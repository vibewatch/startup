      - number: '6.4'
        title: 客户结论与尽调阻点
        blocks:
          - type: paragraph
            body: >-
              综合证据看，Destinus
              的客户故事强于「没有客户」，但弱于「商业风险已拆除」。公司拥有早期国防创业公司常缺的公开、近期、军事场景证据点：具名西班牙陆军和西班牙海军评估界面、由主承包商背书通往更广欧洲项目的路径，以及符合现代买方系统连接需求的集成伙伴关系。这是真实的战略牵引。


              仍缺的是投资人承销持续性所需的那一层：活跃用户或买方完整名单、逐项目部署状态、复购行为、按国家或部委划分的客户集中度、操作员满意度，以及从评估转化为合同支持列装的清晰证据。公司近期称支持客户和合作伙伴当前没有中断，这有帮助；但这也凸显，在披露任何收入指标之前，该行业的客户信心就可能受到安全和声誉噪音影响。


              一句话：Destinus 似乎拥有真实的国防客户接触，以及进入更大盟国市场的可信渠道。但其公开披露深度还不足以把客户基础视为广泛、粘性强或多元。
