      - number: '3.3'
        title: 定价、打包、切换成本与现状替代
        blocks:
          - type: paragraph
            body: >-
              整个格局的公开定价透明度都很弱。多数竞争者通过项目授标、政府直接采购、培训与支持包，或主承包商集成合同销售，而不是公开标价。因此，与其用简单单价对比理解竞争，不如看打包方式和采购姿态。Destinus
              似乎把空中平台、效应器、自主、推进和工业化打包进协商防务合同。Shield AI 把自主和飞机一起打包，也可以作为跨平台软件层嵌入。TEKEVER
              披露的葡萄牙海事合同显示的是更重服务包装的模式，包含培训、技术援助和维护。Hermeus 看起来仍是开发阶段平台业务，靠股权、债务和政府需求创造融资，而不是成熟生产目录。


              这些打包差异重要，因为行业真正的切换成本很少只看标价。买方会锁进资格认证流程、操作者培训、物流链、软件架构、集成接口、出口审批和本土工业政治。纸面上更便宜的产品，如果带来新的培训负担或主权顾虑，仍可能输掉。反过来，更贵的系统如果能更顺地插入现有海事、防空或情报架构，就可能赢。


              因此，最大的现状竞争者就是既有解决方案集合本身：主承包商牵头的导弹项目、已部署 ISR 无人机和现有盟友库存。当客户想要在本地设计主导权下新增欧洲打击或防空产能时，Destinus
              才有胜算；当买方可以用成熟既有方案加已验证自主层解决同一任务，且不需要 Destinus 的全栈主张时，Destinus 就会失分。
