      - number: '3.4'
        title: 护城河耐久性与反向竞争视角
        blocks:
          - type: paragraph
            body: >-
              Destinus 的护城河真实但不完整。公司最强的公开差异化，是在欧洲主权框架下的品类宽度：它是少数同时谈远程打击、反 UAS
              拦截、导弹防御邻近领域、自主集成和工业节奏制造的欧洲风投支持公司之一。在欧洲政府越来越重视本土控制和盟友互操作的市场里，这个组合有战略价值。


              反向视角是，竞争者恰好强在 Destinus 公开证据最薄的地方。Shield AI 自主深度更清晰，披露的美国客户验证更强。TEKEVER 和 Quantum Systems 在 ISR
              和直接面向运营者的无人工作流上看起来更成熟。AeroVironment 和 Kratos 带来更广部署或生产可信度。MBDA 和其他主承包商带来客户信任、融资韧性和初创公司通常难以匹敌的采购杠杆。Hermeus
              和 Boom 作为直接预算对手危险性较低，但它们确实争夺工程师、投资人注意力，以及定义“下一代航空航天”赢家的叙事权。


              承保结论是，不应把 Destinus
              视为垄断了欧洲下一代防务叙事。它在欧洲特定的打击和防空项目中竞争位置最强，前提是主权、生产节奏和模块化集成同时重要。凡是买方可以把软件层与机体拆开、向有部署验证的既有玩家采购，或转向主承包商牵头架构的场景，它的位置就更弱。因此，已披露订单簿质量、集成所有权和独立性能验证，是后续章节必须回答的护城河问题。
