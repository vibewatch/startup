company:
  name: Destinus
chapter:
  number: 1
  title: Company Overview
  summary: Destinus is now best understood as a Netherlands-headquartered European defense manufacturer rather than as the hydrogen-hypersonic transport startup it launched as in 2021. Public evidence shows a company with 700–800+ engineers, a product stack spanning Ruta cruise missiles and Hornet interceptors, nearly €400 million of total capital by December 2025, and a 2026 pre-IPO marketing narrative above €5 billion — but founder Mikhail Kokorich's SEC settlement and limited public governance disclosure remain material diligence flags.
sections:
- id: identity-mission-product-transition
  title: Identity, Mission, and Product Transition
  body: |-
    Destinus presents itself in 2026 as a European defence manufacturer focused on scalable strike and air-defence systems for European and allied armed forces. The official home and about pages emphasize “defence at industrial tempo,” deep vertical integration, and a mission to strengthen Europe’s security and strategic autonomy through affordable, cost-asymmetric systems. That framing is materially different from Destinus’s original public identity. Independent historical coverage and Sacra’s 2026 profile both describe the company as having started in 2021 around hydrogen-powered hypersonic cargo and passenger aircraft, with the hyperplane roadmap still discussed as a long-term aspiration but clearly deprioritized relative to defence UAVs, cruise missiles, and autonomous systems that can generate nearer-term revenue and procurement traction.

    The active product stack is now concrete rather than conceptual. Kryla is described as a distributed saturation cruise system with a 50 kg payload and 800+ km range. Hornet Block 1 is positioned as a radar-cued interceptor for subsonic aerial threats with a 75+ km range and GNSS-denied autonomous terminal interception. Ruta Block 2 is marketed as an extended-range precision-strike system with a 250 kg payload, 700+ km range, terrain-following penetration, and containerized launch architecture. The company also highlights subsystems, autonomy, propulsion, and effectors as in-house layers rather than mere supplier dependencies. Public posts through mid-2026 show this portfolio moving from brochureware into repeatable industrial offerings tied to serial production, test campaigns, and European prime-contractor partnerships.

    The business model visible from public materials is therefore business-to-government and business-to-prime rather than commercial aviation. Destinus appears to monetize through direct defence system sales, strategic joint ventures, technology integration partnerships, and potentially contract-backed industrial scaling programs. The official careers page reinforces that this is a defence-first industrial company with teams across the Netherlands, Spain, Germany, Switzerland, France, Ukraine, and the UK, not a narrow R&D lab chasing a single demonstrator. The identity question matters because later chapters should underwrite Destinus primarily as a fast-scaling European defence platform company with optionality in hypersonics, not the other way around.
