  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board list, independent-director roster, committee structure, and beneficial ownership / cap-table schedule for Destinus Group B.V. and key operating entities.
    whyItMatters: A founder-led defence company with a recent SEC governance overhang requires stronger public governance evidence before IPO or institutional underwriting.
    diligencePath: Request the latest board materials, shareholder register, and organizational chart directly from management or counsel.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: headcount-quality
    missingEvidence: An audited employee count by legal entity, country, and function, plus disclosure of whether contractors are included in public engineering totals.
    whyItMatters: Headcount is a key proxy for capacity and burn, but public figures range from 700+ to 800+ across official sources within eight months.
    diligencePath: Ask finance / HR for a dated payroll-based headcount bridge and country-level breakdown.
    relatedQuestionRefs:
    - QO008
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Term sheets or closing documents for the 2025 rounds, the €140 million convertible/shareholder-loan package, the Commerzbank facility, and any 2026 pre-IPO fundraising materials.
    whyItMatters: Public financing headlines are clear, but preference stack, debt covenants, pricing, and dilution risk are not.
    diligencePath: Request the cap table, debt summary, latest financing documents, and any investor deck used for the 2026 pre-IPO process.
    relatedQuestionRefs:
    - QO011
    - QO025
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: ukraine-deployment-proof
    missingEvidence: Independent contract or delivery records showing the volume, customer identity, and recurring economics behind claims of supply to Ukraine or operational validation there.
    whyItMatters: Ukraine relevance is central to Destinus's market credibility and valuation narrative, but the deepest volume claims still rely on media summaries and company framing.
    diligencePath: Obtain customer references, delivery schedules, ministry confirmations, or export-license backed shipment data under NDA.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
