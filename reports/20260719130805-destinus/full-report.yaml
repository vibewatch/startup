      - number: '8.2'
        title: Comparable Set and Valuation Frame
        blocks:
          - type: paragraph
            body: >-
              The cleanest public valuation frame for Destinus is a sales-multiple bridge using defense-tech comparables
              plus a reality check from private unicorn marks. Mature public defense and unmanned names cluster far
              below the most exuberant private-defense outliers. Using current public market-cap snapshots against
              disclosed 2025 revenue, Kratos screens around 6.4x sales and AeroVironment around 8.7x. Rheinmetall,
              despite being a large incumbent, also sits in a high-single-digit sales neighborhood on the rough public
              numbers available here. Those are useful anchors because they represent real public markets digesting real
              revenue, margins, and program risk.


              At the premium end, private defense-tech outliers trade richer. StockAnalysis and CNBC show Anduril at
              about $61 billion on roughly $2.2 billion of 2025 revenue, implying about 27.7x sales. Shield AI’s $12.7
              billion valuation and Quantum Systems’ $8 billion post-money mark show that autonomy and sovereign-drone
              narratives can carry exceptional private-market premiums, especially in 2026’s defense-funding
              environment. But those premiums are not free comparables. Anduril has far larger revenue, stronger
              contract density, and cleaner public scaling optics. Shield and Quantum also represent autonomy-heavy or
              platform-network narratives that the market may reward differently than Destinus’s mixed missile,
              interceptor, propulsion, and industrialization stack.


              The conclusion is that Destinus deserves neither the lowest public-comp multiple nor the highest
              private-defense premium by default. The right frame is a wide range centered on what proof the company can
              actually show, not on sector euphoria alone.
