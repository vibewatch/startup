      - number: '1.2'
        title: Leadership, Governance, and Founder History
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is founder-centric. Official company statements still present Mikhail
              Kokorich as Founder and CEO, while other named executives surface mainly through press-release quotations
              tied to operating domains: Tim Moser as Group CTO, Sidney Berndt as Chief Manufacturing Officer, and
              Wouter Van Beek as Chief Commercial Officer. That gives comfort that product, manufacturing, and
              commercial functions are staffed, but the public record is thin on board composition, independent
              directors, committee structure, and exact beneficial ownership. A registry-derived Dutch company profile
              for Destinus Group B.V. indicates a Valkenburg address and identifies management entries tied to 2025, but
              it does not provide the level of governance transparency an investor would want before underwriting a
              possible public listing.


              Kokorich himself is both a strength and a risk. Independent reporting describes him as a serial space and
              aerospace entrepreneur who previously founded Dauria Space, Astro Digital, and Momentus before starting
              Destinus in 2021. That track record shows repeat company creation, capital formation, and technical
              ambition across multiple jurisdictions. It also explains why Destinus has been able to assemble a
              multinational engineering footprint and a network of strategic relationships unusually quickly.


              The adverse side is unavoidable. The SEC’s November 25, 2024 litigation release states that a final
              consent judgment resolved claims that Kokorich made misleading statements in the lead-up to Momentus’s
              de-SPAC transaction regarding the company’s technology, national-security risks, and his immigration
              status. The judgment imposed a $2 million civil penalty and a five-year bar from acting as an officer or
              director of a public company. Court records show the litigation ran from the SEC’s 2021 complaint through
              denial of Kokorich’s motion to dismiss in 2023 before the 2024 resolution. None of this directly accuses
              Destinus of wrongdoing, but it materially raises the bar for governance diligence, disclosure discipline,
              export-control scrutiny, and IPO credibility around a founder-led defence company operating in politically
              sensitive markets.
