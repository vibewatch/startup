      - number: '7.4'
        title: Financial-Model and People Risk
        blocks:
          - type: paragraph
            body: >-
              The financial risk is not merely “burn.” It is the interaction between capital intensity, under-disclosed
              current economics, and a visibly ambitious scale plan. By December 2025 the company said total capital
              raised was approaching €400 million, yet 2026 reporting still described another roughly €200 million
              pre-IPO raise being sought. That combination implies a company financing a serious industrial ramp but not
              yet demonstrably self-funding it. Public valuation talk has run well ahead of public unit-economics
              disclosure, which means future financing terms may depend disproportionately on narrative credibility,
              partner confidence, and program milestones.


              The people side compounds that exposure. Workable shows Destinus still hiring heavily across engineering,
              production, trade compliance, documentation, and IT. That is a healthy signal of ambition, but also a sign
              that the organization is still building core execution muscle while pursuing complex programs across
              multiple countries. A company can have product momentum and still break under coordination load: too many
              new hires, too many partner interfaces, too many simultaneous product lines, and too much dependence on a
              founder whose external profile carries baggage.


              For underwriting purposes, this means financial and people risk should be treated as first-order. If
              financing slips, if recruiting fails in a few critical functions, or if program conversion lags, the
              entire scale thesis weakens quickly because the fixed-cost base and partner commitments are already being
              built for much larger output.
