  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Founder, Governance, and Regulatory Overhang
        blocks:
          - type: paragraph
            body: >-
              Destinus’s single most important adverse factor is not a technical challenge but a governance and
              credibility overhang carried by founder Mikhail Kokorich from Momentus. The official SEC litigation
              release from November 2024 says a final consent judgment was entered against Kokorich over alleged
              misleading statements about Momentus’s technology, national-security risks, and his immigration status in
              the lead-up to the de-SPAC transaction. The judgment imposed a $2 million civil penalty and a five-year
              public-company officer/director bar. The older SEC press release and the court docket show that this was
              not a minor disclosure spat; it was bound up with alleged fraud and national-security concerns around a
              sensitive technology company.


              That history matters directly for Destinus because the company is again selling into sensitive defense and
              dual-use domains while simultaneously nurturing a pre-IPO narrative. Government buyers, primes, banks, and
              future public-market investors are exactly the constituencies likely to revisit a founder’s recent
              enforcement history. The National Law Review summary of the CFIUS process at Momentus underscores the
              severity of that prior scrutiny: mitigation agreements, oversight roles, and a CFIUS-approved director
              were required to address foreign-ownership concerns. Even though Destinus is a different company in a
              different jurisdictional setting, the lesson is that governance remediation can become intrusive and
              value-shaping when technology touches national security.


              The risk conclusion is not that Destinus is automatically disqualified. It is that founder-driven
              governance risk is non-theoretical, recently documented, and especially salient for a defense company that
              wants both sovereign-customer trust and public-market optionality.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR028
              - CR030
              - CR039
