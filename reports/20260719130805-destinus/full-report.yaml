      - number: '6.2'
        title: Named Customer Proof and Adoption Surfaces
        blocks:
          - type: paragraph
            body: >-
              The most credible named customer proof in public sources comes from Spain. The Spanish Navy is the
              cleanest example: Destinus officially disclosed a June 2026 Hornet Block 1 launch from the F-81 Santa
              María frigate, and both Naval Today and Infodefensa independently described the same test as a
              containerized maritime air-defence evaluation. The Spanish Army’s TEC 3 experimentation campaign is the
              second major proof point. Defence Blog and TheDefenseNews both described Hornet B1 being demonstrated in a
              military-run experimentation environment connected to Spain’s Future Force 2035 initiative, with field
              validation rather than trade-show theater as the point.


              Those proofs matter because they are not generic “customer interest” statements. They name the military
              organizations, the use cases, and the operating environment. But they also have sharp limits. Public
              sources do not disclose procurement quantities, pricing, success rates, or whether the demonstrations
              converted into production orders. Naval coverage explicitly notes that the Spanish Navy did not release
              the threat scenario, engagement parameters, or outcome. The Spanish Army coverage describes a pipeline to
              evaluation and potential procurement, not a completed procurement.


              Beyond Spain, Destinus’s adoption surface widens through channels rather than direct named end-customer
              disclosure. Rheinmetall provides an industrial and qualification pathway into European and allied armed
              forces; Quantum Systems links Destinus strike systems into sensor-to-effector workflows compatible with
              existing national and NATO command systems; Diehl creates a route into layered GBAD and counter-UAS
              architectures; and Shield AI demonstrates operator-relevant autonomy workflows. Collectively, these are
              meaningful customer-proof surfaces — but they are still one step removed from a public list of paying
              deployed customers.
