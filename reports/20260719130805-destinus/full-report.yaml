  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Traction
        blocks:
          - type: paragraph
            body: >-
              Destinus’s revenue model is visible only in outline, but the outline is clear enough to rule out the wrong
              frameworks. This is not a SaaS business and not a commercial-aircraft pre-order story. The public record
              shows a defense manufacturer selling systems, subsystems, and program access into government or
              prime-mediated workflows. The official product pages show monetizable hardware categories such as Hornet
              and Ruta, while the Shield AI, Quantum Systems, and Rheinmetall-linked announcements show that some future
              revenue will likely travel through integration partnerships, joint production, or consortium structures
              rather than through a single clean direct-sales motion.


              What is missing is hard public revenue disclosure. Neither official company pages nor the independent
              coverage reviewed in this run disclose current annual revenue, gross profit, or backlog for Destinus
              itself. TNW and NL Times both say the 2026 pre-IPO process was being marketed around forecast annual
              revenue of roughly €500 million, but that is a forward-looking underwriting input, not proof of current
              realized revenue. The financial interpretation is that Destinus may already be generating meaningful
              defense revenue, but public sources do not show whether it is coming from delivered systems, development
              work, prototype programs, partner-funded industrialization, or some mix of all four.


              Public traction proxies therefore matter more than usual. Destinus’s disclosed headcount,
              engine-production milestone, Spanish Navy Hornet test, and 2026 delivery-readiness language with
              Rheinmetall all suggest a company operating beyond the prototype stage. But those are operating signals,
              not revenue-quality signals. Later diligence should treat them as evidence that a revenue engine may
              exist, while still demanding contract-level proof of what has actually been booked, delivered, accepted,
              and paid for.
