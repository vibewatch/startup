    Destinus is a private European defense and aerospace company founded in 2021 by Mikhail Kokorich. The company
    started with a hydrogen-hypersonic transport vision but has pivoted toward nearer-term defense demand, now
    positioning itself as a supplier of interceptors, deep-strike and saturation systems, propulsion subsystems, and
    autonomy-enabled air vehicles sold through government and prime-contractor channels. Public evidence shows a
    Netherlands-based headquarters, fast hiring, serious partners, and named Spanish military evaluation proof, but the
    economics and governance disclosures still lag the ambition of the commercial narrative.
