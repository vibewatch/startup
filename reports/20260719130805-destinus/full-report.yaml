  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Destinus’s public customer path runs from military interest and evaluation to partner-mediated qualification and
      potential service-branch expansion.
    data:
      items:
        - label: Delegation / ministry interest
          stage: acquisition
          note: >-
            Eurosatory recap names ministers, chiefs of staff, procurement directors, and industrial partners from
            Europe and NATO
        - label: Military evaluation
          stage: activation
          note: Spanish Army TEC 3 and Spanish Navy frigate trial are the clearest named evaluation surfaces
        - label: Partner qualification path
          stage: usage
          note: Rheinmetall and Diehl create validation and industrial pathways inside existing defense architectures
        - label: Operator workflow fit
          stage: value
          note: Quantum and Shield integrations reduce adoption friction inside existing C2 and autonomy workflows
        - label: Program conversion
          stage: expansion
          note: Public evidence does not yet show conversion from evaluation into signed production programs
        - label: Multi-service / allied expansion
          stage: expansion
          note: The stated expansion logic is from Spanish proof points into broader NATO and allied markets
    approximationNotes: The stages are evidence-based, but public sources do not disclose numeric conversion rates between them.
