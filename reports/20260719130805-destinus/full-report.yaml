      - number: '4.2'
        title: Cost Structure, Unit Economics, and Analogues
        blocks:
          - type: paragraph
            body: >-
              Destinus does not publish the unit-economics data an investor would normally want: no disclosed gross
              margin, no bill of materials, no inventory turns, no monthly burn, and no contracted backlog. For that
              reason, this chapter must reason by mechanism and by hardware-defense analogues rather than by direct
              company disclosure. The most relevant public analogue in this source set is Kratos. Its 2025 results
              explicitly show how an unmanned and strike-adjacent defense contractor can grow bookings and revenue while
              still consuming cash through pre-build inventory, expansion capex, and working-capital needs. Kratos said
              free cash flow used in operations was negative after funding elevated capex, partly because it
              manufactured Valkyries before contract award to meet anticipated customer demand.


              That is important for Destinus because its public narrative sounds similar in economic shape: serial
              production, European industrial expansion, and readiness to deliver hardware into defense programs before
              fully transparent order-book disclosure exists. AeroVironment’s 2025 results add a second analogue. AV’s
              revenue, bookings, funded backlog, gross margin, and fiscal-2026 outlook show what a more mature
              defense-technology production company looks like once demand, manufacturing scale, and acquisition
              integration all become visible in the numbers. MBDA’s 2025 results then show the much larger
              prime-contractor endpoint: big revenue, enormous backlog, rising production, and multi-billion-euro
              investment plans to support missile output.


              The practical lesson is that Destinus’s economic bottleneck is unlikely to be software-style CAC or seat
              pricing. It is more likely to be hardware throughput, fixed-price contract discipline, engineering
              payroll, supplier reliability, inventory funding, and the cost of building enough capacity before programs
              mature into steady cash collection. That is why every missing unit-economics field in the tables below
              matters.
