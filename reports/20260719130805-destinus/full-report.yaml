  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The valuation problem with Destinus is not whether it is interesting. It plainly is. The public record
              supports a real defense-manufacturing effort with meaningful product breadth, strong industrial partners,
              recent military-evaluation proof, and unusually favorable market timing as Europe rearms. The valuation
              problem is price discipline. Public marks moved from a Forbes/PitchBook estimate of roughly $1.76 billion
              in late 2025 to 2026 reporting that Destinus was seeking around €200 million at a valuation above €5
              billion, with the sales pitch tied to forecast annual revenue near €500 million. That is not a small
              step-up; it is a jump from a plausible late-stage private-defense mark to a premium growth-defense
              valuation that demands unusually strong execution.


              On public evidence alone, that higher price is not yet underwritten. Investors still lack audited current
              revenue, gross margin, backlog quality, customer concentration, preference-stack detail, and a clean
              governance story. The company has enough proof to avoid a blanket dismissive call, but not enough to
              justify paying the rumor price as if its future milestones were already banked. The right recommendation
              is therefore price-sensitive: track aggressively, research further, and only underwrite an entry if either
              the valuation resets materially downward or the company discloses evidence strong enough to make the
              rumored valuation feel earned rather than aspirational.


              In practical IC terms, this is not a “bad company” conclusion. It is a “good story, incomplete proof,
              aggressive price” conclusion.
            claimRefs:
