      - number: '3.4'
        title: Moat Durability and Adverse Competitive Lens
        blocks:
          - type: paragraph
            body: >-
              Destinus’s moat is real but incomplete. The company’s strongest public differentiation is category breadth
              under a European-sovereignty frame: it is one of the few venture-backed European companies simultaneously
              talking about long-range strike, counter-UAS interception, missile-defence adjacencies, autonomy
              integration, and industrial-tempo manufacturing. In a market where European governments increasingly care
              about domestic control and allied interoperability, that bundle is strategically valuable.


              The adverse lens is that competitors are strong exactly where public evidence on Destinus is thinnest.
              Shield AI has clearer autonomy depth and stronger disclosed U.S. customer proof. TEKEVER and Quantum
              Systems look more mature in ISR and operator-direct unmanned workflows. AeroVironment and Kratos bring
              broader deployment or production credibility. MBDA and other primes bring customer trust, financing
              resilience, and procurement leverage that startups usually cannot match. Hermeus and Boom are less
              dangerous as direct budget rivals, but they do compete for engineers, investor attention, and the right to
              define what a “next-generation aerospace” winner looks like.


              The underwriting takeaway is that Destinus should not be viewed as having a monopoly on Europe’s
              next-generation defense narrative. Its competitive position is strongest in Europe-specific strike and
              air-defence programmes where sovereignty, production tempo, and modular integration matter simultaneously.
              Its position is weaker wherever the buyer can separate the software layer from the airframe, buy from an
              incumbent with fielded proof, or defer to a prime-led architecture. That makes disclosed order-book
              quality, integration ownership, and independent performance proof decisive moat questions for later
              chapters.
