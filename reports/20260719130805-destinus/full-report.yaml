      - number: '5.3'
        title: Deployment, Industrialization, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Destinus’s strongest 2026 technical proof points are deployment-adjacent rather than certification-heavy.
              The Spanish Navy frigate test shows Hornet has at least been exercised in a containerized maritime
              air-defence concept, which is more operationally relevant than a static range demo. The engine No. 1000
              announcement is equally important: it frames T150 turbojet manufacturing as an owned European production
              system rather than a prototype shop, and directly links propulsion throughput to the Ruta family. The Ruta
              Block 3 and Rheinmetall materials push the story further, presenting serial production of Ruta Block 1 in
              the Netherlands, expanding Ruta-family capacity, and a German final-assembly path with initial delivery
              readiness planned for 2026.


              That is a meaningful industrial narrative because it converts “deep-tech startup” language into a
              production thesis. It also shows the roadmap hierarchy. Hornet Block 1, Ruta Block 1, Ruta Block 2, and
              Kryla appear closer to near-term deployment or initial production. Hornet Block 2 and especially Ruta
              Block 3 add larger payloads, longer ranges, and deeper-strike ambitions, but they rely more on partnership
              execution, qualification, and scaling. Public roadmap evidence is therefore directional rather than
              complete: enough to see which systems are nearer fielding and which are still maturation projects, but not
              enough to underwrite exact production rates, acceptance criteria, or schedule confidence.


              Just as important is what the roadmap no longer centers. In this chapter’s source set, Destinus’s public
              product identity is overwhelmingly defence-focused. The brand still carries high-speed aerospace DNA, but
              current technical proof is concentrated in interceptor, strike, propulsion, and air-defence systems rather
