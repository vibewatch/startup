  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Legal, regulatory, partner, and financing risks flow into customer conversion, revenue timing, and valuation at
      the same time.
    data:
      nodes:
        - id: n1
          label: Founder / governance risk
          description: SEC and Momentus history affect credibility and diligence outcomes
        - id: n2
          label: Export / qualification friction
          description: Licences, sanctions, and approvals constrain deliveries
        - id: n3
          label: Partner dependency
          description: Primes and technology partners shape route-to-market and capability delivery
        - id: n4
          label: Customer conversion
          description: Evaluations must convert into funded programs
        - id: n5
          label: Revenue timing and margin
          description: Program slips delay cash flow and raise carrying cost
        - id: n6
          label: Financing need
          description: Delayed conversion or extra cost increases dependence on new capital
        - id: n7
          label: Valuation / IPO optionality
          description: Public-market readiness depends on governance, disclosure, and program quality
      edges:
