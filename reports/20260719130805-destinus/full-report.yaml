  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from a favorable market and real product proof into weaker economics and risk-adjusted
      valuation support.
    data:
      nodes:
        - label: Strong market tailwind
        - label: Real product + partner proof
        - label: Partial customer proof
        - label: Opaque economics + governance risk
        - label: Rumored >€5B price
        - label: Track / research more, not buy
      edges:
        - from: Strong market tailwind
          to: Real product + partner proof
        - from: Real product + partner proof
          to: Partial customer proof
        - from: Partial customer proof
          to: Opaque economics + governance risk
        - from: Opaque economics + governance risk
          to: Rumored >€5B price
        - from: Rumored >€5B price
          to: Track / research more, not buy
    approximationNotes: null
    claimRefs:
      - CV015
      - CV017
      - CV021
      - CV036
      - CV040
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      At the published ~€500M forecast revenue level, the justified value moves dramatically with the sales multiple
      applied.
    data:
      items:
        - label: 4x revenue
          value: 2
        - label: 6x revenue
          value: 3
        - label: 8x revenue
          value: 4
        - label: 10x revenue
          value: 5
        - label: 12x revenue
          value: 6
    approximationNotes: >-
      Values are implied enterprise/valuation outcomes in € billions if the ~€500M forecast revenue is treated as real
      and high quality.
    claimRefs:
      - CV003
      - CV021
      - CV029
      - CV032
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Public evidence supports a broad range, with the rumored price sitting near the top of what the current bull case
      can justify.
    data:
      items:
        - label: Bear case (€B)
          low: 0.8
          mid: 1
          high: 1.3
          displayValue: €0.8B-€1.3B
          detail: €200M-€250M support at ~4x-5x sales
          tone: negative
        - label: Base case (€B)
          low: 2
          mid: 2.5
          high: 3
          displayValue: €2.0B-€3.0B
          detail: €300M-€375M support at ~6x-8x sales
          tone: warning
        - label: Bull case (€B)
          low: 4.5
          mid: 5
          high: 5.5
          displayValue: €4.5B-€5.5B
          detail: €500M support at ~9x-11x sales
          tone: positive
        - label: Rumored 2026 ask (€B+)
          low: 5
          mid: 5
          high: 5.2
          displayValue: '>€5.0B'
          detail: Publicly reported pre-IPO marketing level
          tone: warning
    approximationNotes: >-
      Ranges are scenario outputs for investment discussion only; they do not capture unknown preference-stack
      economics.
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV037
      - CV038
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      Destinus scores strongly on market need and product ambition, but materially lower on economics visibility,
      governance, and present valuation support.
    data:
      items:
        - label: Market need
          score: 9
          detail: European rearmament and sovereign-strike demand are unusually strong.
          tone: positive
        - label: Product / industrial proof
          score: 7
          detail: Real products, engines, partners, and evaluations exist, but qualification is still maturing.
          tone: positive
        - label: Customer proof
          score: 6
          detail: Spanish military evaluation surfaces and partner channels are real, but still narrow.
          tone: warning
        - label: Economics visibility
          score: 3
          detail: Public revenue, backlog, margin, and concentration disclosure remain inadequate.
          tone: negative
        - label: Governance quality
          score: 3
          detail: Founder overhang and public-market readiness remain real concerns.
          tone: negative
        - label: Valuation support
          score: 4
          detail: Public evidence supports a wide range, but not a casual >€5B underwrite.
          tone: warning
        - label: Evidence quality
          score: 5
          detail: Enough to track seriously; not enough to buy blindly.
          tone: neutral
    approximationNotes: Scores are 0-10 ordinal judgments for IC discussion, not deterministic ratings.
    claimRefs:
      - CV013
      - CV017
      - CV021
      - CV031
      - CV036
      - CV040
