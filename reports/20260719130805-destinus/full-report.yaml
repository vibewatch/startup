      - number: '6.3'
        title: Durability, Expansion, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is weak. No reviewed source discloses customer count, deployed-unit count,
              renewal rate, contract length, repeat-order behavior, or satisfaction metrics. That is not unusual in
              defense, but it materially changes the interpretation of traction. Instead of a broad, durable installed
              base, the public record shows a narrow set of high-quality military evaluations and a wider set of
              partner-mediated expansion paths. The adoption trajectory is therefore legible only in proxy form: more
              named field evaluations, more partner integrations, more industrialization announcements, and more
              staffing for documentation, compliance, engineering, and manufacturing.


              Expansion potential is real. Spain looks like the clearest near-term beachhead because both army and navy
              evaluation surfaces are public. The Rheinmetall venture broadens the story toward NATO and EU member
              markets through German industrial qualification and serial production. Quantum and Diehl create adjacent
              channel access: one through reconnaissance and C2 workflows, the other through existing layered
              air-defence architectures. Yet those same structures create concentration risk. If a small number of
              ministries, services, or primes slow qualification or choose alternative effectors, Destinus’s visible
              customer pipeline could narrow quickly.


              The chapter’s core diligence conclusion is that Destinus has credible early military-customer proof and
              plausible expansion logic, but not enough public data to underwrite retention, revenue concentration, or
              post-pilot durability. Investors should treat concentration and qualification risk as core parts of the
              customer story, not as edge cases.
