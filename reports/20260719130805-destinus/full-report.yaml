  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Destinus should be underwritten inside defence procurement markets, not inside speculative civilian
              hypersonic aviation. The company’s 2026 official positioning is explicit: it describes itself as a
              European defence manufacturer focused on scalable strike and air-defence systems for European and allied
              armed forces. Its product pages map that positioning into concrete mission categories: Kryla for
              distributed saturation strike, Hornet Block 1 for counter-UAS and air-defence interception, Ruta Block 2
              for long-range precision strike, and newer programmes such as Ruta Block 3 and Bliksem EXO for
              deeper-strike and upper-layer missile-defence adjacencies. That means the relevant spend pools are
              defence-system budgets, munitions and interceptor replenishment, autonomy software, seekers, launch
              architecture, production capacity, and sustainment — not broad commercial aerospace or consumer-drone
              demand.


              This boundary matters because Destinus now spans more than one product niche. The TNO radar-seeker joint
              venture, the Shield AI autonomy partnership, and the Quantum Systems reconnaissance-strike tie-up all show
              a company trying to capture value across subsystems, mission software, and coalition integration rather
              than only selling a single air vehicle. In practical terms, Destinus competes where armed forces need
              affordable, replenishable systems that can survive GNSS-degraded, electronic-warfare-heavy environments
              and can be manufactured in Europe at industrial tempo.


              The status-quo substitutes are therefore military and institutional, not civilian. Hornet competes against
              higher-cost interceptor and short-range air-defence options, as well as against lower-tech counter-drone
              approaches. Ruta-family systems compete with manned strike aircraft, artillery-rocket and missile
              inventories, and incumbent prime-contractor long-range strike solutions. Bliksem and TNO-related work
              compete for a share of Europe’s missile-defence and sensor-chain buildout. A useful mental model is that
              Destinus is chasing multiple parts of Europe’s rearmament stack — strike, air defence, autonomy, and
              industrial replenishment — rather than one neatly bounded drone category.
