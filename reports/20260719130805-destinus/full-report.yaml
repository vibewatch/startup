      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is therefore mixed. Destinus looks plausibly capable of generating meaningful
              defense revenue and of financing continued growth in the near term. Its product mix, partnerships,
              industrial milestones, and fundraising record are all too substantial for a “PowerPoint only” label. But
              from an investor’s point of view, the business is still under-disclosed on the variables that separate a
              compelling defense-growth story from a capital sink: revenue composition, realized pricing, margins,
              backlog quality, burn, and cash conversion.


              The analogues also cut both ways. Kratos shows how even a growing contractor can burn cash when it builds
              inventory and capacity ahead of awards. AeroVironment shows that a more mature defense-technology company
              can produce strong bookings and backlog, but still remains exposed to margin swings, integration risk, and
              dependence on government procurement. MBDA shows the sheer scale of capital and industrial depth behind
              the incumbent missile primes. Destinus is far earlier on that curve, which means it can grow faster — but
              also that it cannot yet be underwritten as if it already enjoys prime-like resilience.


              Bottom line: public evidence supports ambition and partial industrial validation, but not a clean view of
              revenue quality or unit economics. The next chapters should assume ongoing financing dependency until
              management can disclose contract-backed revenue, backlog, and cash-burn metrics that make the current
              scale story financially concrete.
