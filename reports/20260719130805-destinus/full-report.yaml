      - number: '4.3'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The strongest publicly disclosed financial fact about Destinus is capital formation, not revenue quality.
              The company’s December 2025 release said a €50 million Commerzbank commercial bank facility complemented
              €140 million of recently completed convertible instruments and shareholder loans plus more than €200
              million of previously raised equity, bringing total capital raised to nearly €400 million. Independent
              reporting in 2026 then said Destinus was seeking another roughly €200 million ahead of a possible
              Amsterdam IPO, with the marketing narrative tied to forecast annual revenue around €500 million.


              Taken together, those facts imply a company that has raised enough money to build real industrial capacity
              but is still financing-dependent. If nearly €400 million of capital were sufficient to carry the business
              to self-sustaining scale, the 2026 pre-IPO raise would be less urgent. Instead, the public picture looks
              like a classic defense-hardware scaling curve: large engineering payroll, manufacturing expansion,
              integration of acquired autonomy capability, and likely working-capital needs ahead of transparent
              recurring cash generation. The Rheinmetall joint venture’s 2026 delivery-readiness goal and German
              final-assembly plan reinforce that interpretation, because such readiness normally consumes cash before it
              reliably produces it.


              What public evidence cannot show is cash on hand, net debt, monthly burn, covenant headroom, or runway.
              Investors should therefore treat the balance sheet as directionally strong relative to an earlier-stage
              startup, but still opaque relative to what would be required for real underwriting. The company has
              financing momentum; it does not yet have public financial transparency.
