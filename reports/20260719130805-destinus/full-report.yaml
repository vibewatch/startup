        - stage: Named military evaluation surfaces
          value: 2
          label: Spanish Army TEC 3 and Spanish Navy frigate trial
        - stage: Named partner channels into larger markets
          value: 3
          label: Rheinmetall, Diehl, Quantum
        - stage: Public disclosed production-customer count
          value: 0
          label: No full live-customer roster disclosed
        - stage: Public retention / repeat-order cohorts
          value: 0
          label: No renewal or reorder cohorts disclosed
    approximationNotes: >-
