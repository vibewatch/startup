chapter:
  number: 6
  title: Customers
  summary: 'Destinus’s public customer evidence is concentrated but real: named Spanish Army and Spanish Navy evaluation surfaces, plus expansion channels through Rheinmetall, Diehl, Quantum Systems, and Shield AI. The chapter supports strategic relevance and early defense-customer engagement, but not a broad or durable installed-base thesis. Public sources still do not disclose customer count, repeat orders, retention, concentration, or conversion from evaluation to production orders.'
sections:
- id: buyer-map-and-channel-structure
  title: Buyer Map and Channel Structure
  body: |-
    Destinus’s public customer surface in 2026 is overwhelmingly governmental and defense-industrial rather than commercial. The company’s own homepage, trade-show recap, and partner releases consistently frame the target customer as European and allied armed forces, their ministries and procurement organizations, and the prime contractors that already intermediate procurement and qualification. The strongest public buyer-language in the source set comes from Eurosatory 2026, where Destinus said it met ministers, chiefs of staff, procurement directors, and industrial partners from across Europe, NATO, and beyond. That does not prove signed contracts, but it does show clearly who the sales motion is aimed at.

    Just as important, the “customer” is not always a single actor. In this market, payer, user, and channel can split. Ministries or procurement authorities fund programs; service branches and operators use the systems; primes such as Rheinmetall and Diehl can become qualification and route-to-market channels; and software or ISR partners such as Quantum Systems and Shield AI can make the offering easier to adopt inside existing command structures. That means Destinus’s customer architecture is less like direct enterprise SaaS and more like a defense-procurement stack with layered buyers, validators, and integrators.

    The practical implication is that customer traction should be judged through named military evaluations and partner-backed channel access rather than through classic startup metrics like logos, seats, or self-serve growth. Public evidence supports that framing. It does not yet support a diversified, directly disclosed customer roster.
  claimRefs:
