- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Spanish Army and Navy evaluation beachheads
    - Proof is concentrated in one country and two military branches
    - A setback in Spain would remove the clearest public customer proof
    - Request Spanish pipeline status, next milestones, and probability-weighted value
  - - Rheinmetall industrial / qualification channel
    - Heavy dependence on a prime for qualification and broader market entry
    - If JV timing slips, wider NATO/EU expansion may slow materially
    - Request JV governance, pipeline ownership, and named customer pursuits
  - - Diehl layered-air-defence channel
    - Path depends on validation and approvals inside another company’s architecture
    - Channel access may remain aspirational if integration takes longer than expected
    - Request integration roadmap, test plan, and customer-target list
  - - Quantum workflow compatibility
    - Useful expansion path but not direct end-customer proof
    - Could improve fit without creating revenue if customers do not adopt combined workflow
    - Request named joint opportunities and deployment plans
  - - Defense-only customer base
    - Budget, qualification, and geopolitical cycles dominate purchase timing
    - Revenue timing may be lumpy even if strategic interest is strong
    - Request procurement-calendar map and scenario analysis by customer set
  - - Security / reputational noise
    - Customer and partner confidence can be affected before operations are visibly disrupted
    - Can slow deals or qualification even when operations continue
    - Request customer communications log and incident-response governance
  notes: Expansion and concentration are inseparable in a defense-sales model built on a few named evaluations and a few large prime channels.
