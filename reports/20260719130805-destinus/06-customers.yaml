- id: customer-verdict-and-diligence-blockers
  title: Customer Verdict and Diligence Blockers
  body: |-
    Netting the evidence out, Destinus’s customer story is stronger than “no customers,” but weaker than “commercially de-risked.” The company has public, recent, military-context proof points that many earlier-stage defense startups lack: named Spanish Army and Spanish Navy evaluation surfaces, a prime-backed route into wider European programs, and integration partnerships that fit how modern buyers want systems connected. That is real strategic traction.

    What is still missing is the layer an investor needs for underwriting durability: a full roster of live users or buyers, program-by-program deployment status, repeat-order behavior, customer concentration by country or ministry, operator satisfaction, and clear conversion from evaluation into contract-backed fielding. The recent company statement that there was no current disruption to supporting customers and partners is helpful, but it also underscores that customer confidence in this sector can be affected by security and reputational noise even before any revenue metric is disclosed.

    Bottom line: Destinus appears to have authentic defense-customer engagement and credible channels into larger allied markets. It does not yet have public disclosure deep enough to treat the customer base as broad, sticky, or diversified.
  claimRefs:
  - CU024
  - CU027
  - CU035
  - CU036
