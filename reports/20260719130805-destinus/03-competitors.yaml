chapter:
  number: 3
  title: Competitors
  summary: Destinus competes most directly with autonomous-defense and European UAS vendors, not with generic commercial aerospace startups. Shield AI, Quantum Systems, and TEKEVER matter most at the software/UAS edge; Kratos, AeroVironment, and MBDA matter most as incumbents with stronger deployments and procurement access; Hermeus and Boom are mainly talent-and-capital adjacencies. Destinus’s moat is strongest where European sovereignty, strike plus air-defence breadth, and industrial tempo matter together — and weakest where autonomy layers, incumbent channels, or mature ISR alternatives can displace its full-stack pitch.
sections:
- id: who-really-competes-with-destinus
  title: Who Really Competes with Destinus
  body: |-
    Destinus does not face one clean peer set. Its competitive landscape splits into four groups: direct autonomous-defense peers, incumbent defense contractors with broader procurement reach, European prime or consortium substitutes, and high-speed aerospace adjacencies that compete more for talent and capital than for the exact same 2026 budgets. The closest direct overlap is not commercial supersonic aviation. It is the set of companies selling military autonomy, tactical UAS, loitering or strike-adjacent systems, and sovereign-European ISR or air-defence capabilities.

    On that definition, Shield AI, Quantum Systems, and TEKEVER are the most relevant startup-like comparables. Shield AI competes on resilient autonomy and tactical unmanned systems; Quantum Systems competes on European autonomous systems, reconnaissance, cUAS, and software backbone positioning; TEKEVER competes on AI-centric autonomous systems with growing operator-direct maritime and surveillance proof in Europe. Hermeus is strategically relevant because it shares the dual-use, high-speed, venture-backed aerospace narrative, but its current product path remains high-Mach aircraft for U.S. national-security use rather than the air-defence and long-range strike products Destinus is actually marketing today. Boom Supersonic is even further away: it is mainly a capital and engineering-talent adjacency rather than a direct defense-systems competitor.

    The practical result is that Destinus has a more direct collision course with autonomous-defense and strike-system vendors than with glamour supersonic startups. That is good in one sense because it narrows the real market. It is also challenging because the best-capitalized competitors in that narrower market often have stronger software stacks, clearer maritime or ISR customer proof, or deeper access to incumbent defense procurement channels.
