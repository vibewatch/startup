- id: pricing-packaging-switching-costs-and-status-quo
  title: Pricing, Packaging, Switching Costs, and Status Quo Alternatives
  body: |-
    Public pricing transparency is weak across this entire landscape. Most competitors sell through program awards, direct government procurement, training-and-support packages, or prime-integrated contracts rather than through public list prices. That means competition is better understood through packaging and procurement posture than through simple unit-price comparisons. Destinus appears to package air vehicles, effectors, autonomy, propulsion, and industrialization into negotiated defense contracts. Shield AI packages autonomy and aircraft together but can also sit as a software layer across other platforms. TEKEVER’s disclosed Portuguese maritime contract shows a more service-wrapped model that includes training, technical assistance, and maintenance. Hermeus still looks like a developmental platform business funded through equity, debt, and government demand creation rather than a mature production catalogue.

    These packaging differences matter because the sector’s real switching costs are rarely about sticker price alone. Buyers lock into qualification processes, operator training, logistics chains, software architectures, integration interfaces, export approvals, and domestic-industry politics. A product that is merely cheaper on paper can still lose if it forces a new training burden or creates sovereignty concerns. Conversely, a more expensive system can win if it plugs into an existing maritime, air-defence, or intelligence architecture more cleanly.

    The biggest status-quo competitor is therefore the incumbent solution set itself: prime-led missile programs, fielded ISR drones, and existing allied inventories. Destinus wins where a customer wants new European strike or air-defence capacity under local design authority. It loses where the buyer can solve the same mission with a mature incumbent plus a proven autonomy layer and does not need Destinus’s full-stack proposition.
