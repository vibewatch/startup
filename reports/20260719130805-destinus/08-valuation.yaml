- id: final-diligence-asks-and-decision-triggers
  title: Final Diligence Asks and Decision Triggers
  body: |-
    The good news is that the diligence path is clear. This is not a situation where investors need exotic information. They need standard underwriting information that happens to be missing: audited revenue by stream, backlog and bookings by customer, export and qualification status by product, customer concentration, preference-stack and dilution detail, and explicit founder-governance boundaries. If those materials show that the company really is approaching €500 million of high-quality annual revenue with repeatable qualification and a manageable cap table, the investment view changes meaningfully.

    Absent that, price discipline should stay firm. The main triggers that would improve the call are audited proof of revenue quality, customer breadth beyond a handful of public military surfaces, a cleaner governance package, and a financing round priced more like the base case than the bull case. The main triggers that would worsen the call are missed financing, partner or qualification slippage, adverse security or governance developments, or evidence that the revenue story rests mainly on non-recurring or loosely committed program economics.

    This is why the final call is “track, not buy.” The upside is real, but the current public evidence base still asks the investor to bridge too many gaps with hope.
