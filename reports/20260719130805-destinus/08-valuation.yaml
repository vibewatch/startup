- id: scenario-ranges-and-return-math
  title: Scenario Ranges and Return Math
  body: |-
    Because the current public evidence is thin on audited economics, scenario analysis is more honest than single-point valuation. The key published input is the roughly €500 million forecast annual revenue cited in 2026 reporting around the pre-IPO raise. If that figure were achieved with credible customer conversion, qualification progress, and governance stabilization, a bull-case valuation in the roughly €4.5 billion to €5.5 billion range can be argued using 9x to 11x forward sales. That is expensive, but not impossible in a defense-boom tape where the market is willing to pay for scarce sovereign strike and autonomy assets.

    The base case should be materially lower because the company has not yet publicly earned the right to top-end multiples. A more sober base case assumes partial realization of the forecast — something like €300 million to €375 million of real revenue support — and a 6x to 8x sales band more in line with strong public-defense comps, yielding roughly €2.0 billion to €3.0 billion. The bear case is not zero; Destinus has too much industrial and partner proof for that. But if revenue is slower, customer proof remains narrow, or financing dependency persists, a 4x to 5x sales band on €200 million to €250 million of support can push value toward roughly €0.8 billion to €1.3 billion.

    That distribution explains the recommendation. At a rumored valuation above €5 billion, investors are being asked to pay almost the full bull case before the public evidence base looks bull-case ready.
