- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - European rearmament and sovereign-strike demand create a strong market tailwind for Destinus
    - If defense-spending urgency softens or procurement slows materially, top-end multiple support weakens
  - - Product and partner proof are stronger than for a paper-only deep-tech startup
    - If qualification or customer conversion slips, the proof set becomes less monetizable than it appears
  - - Rheinmetall, Diehl, Shield, and Quantum provide real channel and capability leverage
    - If those partner paths do not convert into funded programs, valuation should compress
  - - The 2025 $1.76B mark may understate 2026 defense-boom sentiment
    - If the >€5B ask reflects hype more than earned execution, the step-up is too large
  - - Bull case works if the ~€500M revenue forecast is close to reality and high quality
    - If current revenue is materially below forecast or weakly contracted, the rumored price is difficult to justify
  - - Public-market comps show high-quality defense names can trade at healthy sales multiples
    - If Destinus remains opaque on margins, backlog, and governance, it should not get a best-in-class multiple
  notes: Each thesis point is paired with the condition most likely to invalidate it.
