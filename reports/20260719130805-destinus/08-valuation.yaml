- id: anti-thesis-risks-and-exit-readiness
  title: Anti-Thesis, Risks, and Exit Readiness
  body: |-
    The anti-thesis is straightforward. Destinus may simply be too early, too opaque, and too governance-heavy for the price being floated. The customer story is still concentrated, product qualification is still maturing, export-control and geopolitical risks are real, and the founder’s recent enforcement history is exactly the kind of issue that can widen a valuation discount when a company moves toward public-market scrutiny. That matters because a premium private valuation only works if there is believable exit readiness on the far side.

    Exit readiness here looks incomplete. There is no public IPO filing, no public cap-table or preference-stack detail, no reliable public read on current revenue quality, and no disclosed retention or backlog metrics strong enough to anchor an institutional-quality roadshow. The company does have positives: a defense-market tailwind, partner depth, and enough real hardware progress to make a future public listing conceivable. But “conceivable” is not the same as “ready.” In public-market terms, Destinus still looks like a company that needs another tranche of proof before investors should price it like a near-term listed winner.

    For that reason, the anti-thesis is not that Destinus fails operationally. It is that the market may be trying to pre-price too much success too early.
