  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited revenue by stream, product, customer, and contract type for 2025 and year-to-date 2026.
    whyItMatters: Forward-sales valuation is meaningless if the current revenue base is weak, non-recurring, or partner-attributed in unexpected ways.
    diligencePath: Request audited revenue bridge and revenue-recognition policy by program type.
    relatedQuestionRefs:
    - QV003
    - QV017
    - QV018
    - QV019
    - QV024
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: backlog-and-customer-concentration
    missingEvidence: Signed backlog, bookings, cancellation rights, customer concentration, and partner-attributed pipeline by country and product family.
    whyItMatters: These determine whether the revenue forecast deserves a premium multiple or a discount.
    diligencePath: Request order-book, top-customer concentration, and channel-attribution schedule.
    relatedQuestionRefs:
    - QV012
    - QV021
    - QV023
    - QV027
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Cap table, convertibles, shareholder loans, preference stack, liquidation preferences, and debt covenants.
    whyItMatters: Return math for a new investor can differ dramatically from enterprise-value optics.
    diligencePath: Request fully diluted cap table and all financing agreements.
    relatedQuestionRefs:
    - QV021
    - QV027
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: export-and-qualification-status
    missingEvidence: Product-by-product export, approval, and customer-country status, plus qualification milestones and blockers.
    whyItMatters: Premium valuations only hold if revenue can actually be shipped, supported, and approved.
    diligencePath: Request export and qualification matrix by product and destination.
    relatedQuestionRefs:
    - QV015
    - QV024
    - QV027
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: governance-readiness
    missingEvidence: Board structure, founder-role boundaries, reserved matters, public-listing readiness, and any extra governance undertakings.
    whyItMatters: A premium pre-IPO valuation requires unusually strong confidence in governance quality.
    diligencePath: Request governance package, board materials, and public-market readiness plan.
