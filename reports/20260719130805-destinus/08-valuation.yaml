  - CV025
  - CV028
  - CV033
  - CV035
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Audited revenue by stream, customer, and contract type
    - Without it, forward-sales math is mostly narrative
    - Request audited 2025 and YTD 2026 revenue bridge
  - - Backlog and bookings
    - Signed backlog, bookings, cancellations, and milestone schedule
    - Determines whether forecast revenue is underwritten or aspirational
    - Request order-book and pipeline detail by product family
  - - Customer concentration
    - Top-customer and country concentration plus partner-attributed pipeline
    - A concentrated base deserves a lower multiple
    - Request concentration tables and revenue share by channel
  - - Export / qualification matrix
    - Product-by-product licence, approval, and customer-country status
    - Revenue cannot be valued cleanly if shipment rights are uncertain
    - Request compliance and qualification matrix
  - - Governance and founder role
    - Board structure, reserved matters, founder-control rights, and remediation steps
    - Key to IPO readiness and discount rate
    - Request governance package and counsel memo
  - - Preference / dilution overhang
    - Cap table, convertibles, shareholder loans, debt covenants, and round terms
    - Return math changes materially with hidden seniority
    - Request full capitalization table and financing documents
  notes: Every missing item here directly changes either the justified multiple or the investor’s downside protection.
