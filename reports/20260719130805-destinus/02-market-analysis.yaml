- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Ukraine battlefield lessons and massed air/missile attacks
    - Driver
    - Immediate and ongoing
    - Pushes drones, air defence, and replenishable precision strike into must-have budgets
    - Request signed orders or framework agreements tied to Ukraine-linked demand
  - - NATO spending growth and production urgency
    - Driver
    - 2026 onward
    - Supports more procurement and manufacturing capacity across allied defence budgets
    - Track which NATO-aligned programmes Destinus can actually bid on or supply
  - - Readiness 2030 / SAFE / EDF policy stack
    - Driver
    - 2026-2030
    - Creates official European financing and R&D lanes around drones, air defence, and strike
    - Map which specific calls or procurement windows Destinus is eligible for
  - - AI autonomy and GNSS-denied operations
    - Driver
    - Immediate
    - Rewards vendors that can integrate mission autonomy, seekers, and resilient navigation
    - Ask for measured autonomy performance and EW-survivability data
  - - Industrial replenishment gap at legacy primes
    - Driver
    - Immediate
    - Startups with serial production and partner access can win alongside or through incumbents
    - Verify actual throughput, yield, and supplier bottlenecks by product family
  - - Formal procurement and qualification cycles
    - Constraint
    - Ongoing
    - Converts buyer interest into slower revenue recognition and milestone risk
    - 'Ask for pipeline by stage: trial, LOI, framework, contract, delivery'
  - - Export control, sovereignty, and security approvals
    - Constraint
    - Ongoing
    - Can restrict market access and shape partner structure even when demand exists
    - Clarify control, security-clearance, and export-licence dependencies by programme
  - - Cybersecurity and EW vulnerability
    - Constraint (adverse)
    - Immediate
    - Jamming, spoofing, and hacking risk can block adoption or raise lifecycle cost
    - Request red-team data, encryption stack, and navigation-resilience evidence
  - - Capital-intensity and valuation exuberance
    - Constraint (adverse)
    - Next 12-24 months
    - Private valuations can outrun contract conversion and make later financing or IPO outcomes fragile
    - Test whether current price narratives are backed by disclosed bookings and gross margins
  notes: Positive and negative rows are mixed intentionally because the market is currently strong but still operationally hard. Diligence asks are the shortest path from narrative to underwritable demand.
