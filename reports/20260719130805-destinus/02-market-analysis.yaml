  - - Long-range precision strike / cruise systems
    - One-way effectors, cruise-missile-like systems, launch containers, engines, seekers, production ramp
    - Crewed strike aviation, large ballistic-missile programmes, general munitions categories with no Destinus presence
    - MoDs, armaments agencies, coalition or allied channels, prime-led programmes
