- id: sizing-lenses-budget-pools-and-why-one-tam-is-misleading
  title: Sizing Lenses, Budget Pools, and Why One TAM Is Misleading
  body: |-
    The public evidence supports a multiple-lens market view, not a single TAM. At the broadest level, SIPRI says world military expenditure reached $2.887 trillion in 2025, with European military expenditure at $864 billion and the 29 European NATO members at $559 billion. NATO-related demand is especially important because Destinus is built around European and allied customers, and the company’s own programmes emphasize interoperability with NATO air-and-missile-defence concepts. Narrowing further, Germany, Spain, and the Netherlands alone accounted for roughly $183.1 billion of 2025 military expenditure, giving Destinus a sizeable home-region budget pool before considering other European buyers.

    The next layer is programme financing and R&D access. The European Commission’s Readiness 2030 white paper explicitly prioritizes support for Ukraine through ammunition, air defence, drones, and direct support to Ukraine’s defence industry. SAFE adds up to €150 billion of long-maturity loans to Member States for urgent defence procurement, while the EDF 2026 work programme includes a hypersonic-glide-vehicle action and support for an EU endo-atmospheric interceptor. Those pools are not revenue forecasts for Destinus, but they are high-signal evidence that European institutions are creating funding lanes around exactly the categories where the company now operates.

    Generic drone-market reports are still useful, but only as outer bounds. Grand View pegs the 2026 military drone market at $54.2 billion, Research and Markets pegs the narrower 2026 defence drone market at $13.73 billion, and StartUs cites a $22.81 billion 2030 military-drones outlook. Those figures point in the same direction — material growth — but clearly do not represent one harmonized market definition. The underwriting implication is straightforward: later chapters should rely more on spend pools, procurement signals, and programme evidence than on any single share-of-TAM narrative.
