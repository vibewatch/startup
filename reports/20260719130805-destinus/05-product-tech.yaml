- id: architecture-autonomy-and-subsystems
  title: Architecture, Autonomy, and Subsystems
  body: |-
    The architecture story is more interesting than the airframe names alone. Across the public product pages, Destinus repeatedly claims common building blocks: container or booster-assisted launch, autonomous navigation for denied environments, terrain-following flight, and terminal guidance or interception. The subsystem page makes that stack less abstract by listing a propulsion family — T150, T70, and T35 turbojets — plus a Vista visual-navigation module. Ruta Block 3 then adds the most explicit systems statement in the public record: an in-house T220 turbojet, an ITAR-free European technology stack, and a navigation set spanning INS, GNSS, visual navigation, and TERCON. Taken together, those sources imply Destinus wants to own enough propulsion, guidance, and mission-system IP to avoid being just a final assembler.

    External autonomy evidence strengthens that view but also shows where the stack is shared. Shield AI’s March 2026 release said Hivemind was integrated with the Hornet flight-control architecture in two months, dynamically rerouting around changing geofenced areas in flight. Both Shield and Destinus described Hornet as the first baseline system for rollout across additional platform families, with Tim Moser explicitly saying Destinus platforms share a common technical architecture. That suggests a software-defined layer above individual airframes, but it does not mean every autonomy layer is built internally. The Daedalean acquisition reporting points in the same direction: Destinus appears to be buying and integrating certifiable AI and flight-software capability to accelerate its roadmap.

    The result is an architecture that looks modular, vertically ambitious, and integration-friendly — but also dependent on successful coupling among propulsion, autonomy, seeker, and production systems. The common-architecture narrative is credible enough to take seriously; the unresolved diligence question is how much of the stack has been validated end to end under field conditions rather than in limited demonstrations.
