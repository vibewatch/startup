  - type: private-evidence-only
    severity: material
    topic: industrial-yield-and-supplier-resilience
    missingEvidence: Actual engine yield, critical supplier concentration, rework rates, QA escapes, and production bottlenecks across Dutch, Spanish, Swiss, and partner facilities.
    whyItMatters: The industrial-tempo thesis depends on repeatable throughput, not just product announcements and one-off milestones.
    diligencePath: Request manufacturing KPIs, supplier concentration analysis, NCR data, and line-capacity plans for propulsion and final assembly.
