chapter:
  number: 5
  title: Product and Technology
  summary: Destinus’s 2026 product surface is a defence-first portfolio of interceptors, strike systems, propulsion, and navigation modules rather than a single hypersonic concept. Public evidence supports real hardware breadth, common-architecture ambition, and meaningful industrialization signals such as containerized naval launch, turbojet production scale, and Rheinmetall-linked delivery readiness. The key diligence gap is not whether products exist; it is whether reliability, qualification, software assurance, and sustainment depth are strong enough to support the scale implied by the company’s fundraising and strategic narrative.
sections:
- id: product-portfolio-and-customer-jobs
  title: Product Portfolio and Customer Jobs
  body: |-
    In customer-workflow terms, Destinus is no longer selling a single futuristic aircraft concept. Its public product surface in 2026 is a portfolio of strike, interceptor, and subsystem offerings aimed at military users that need affordable effectors and counter-effectors at industrial tempo. The homepage and downloads surface present the stack plainly: Kryla for distributed saturation strike, Hornet Block 1 and Block 2 for air-defence and precision-strike roles, and Ruta Block 1 through Block 3 for baseline to deep-strike missions. That breadth matters because it shows management is trying to cover multiple layers of the modern European missile and drone problem rather than chasing one exquisite platform.

    The workflow is also concrete enough to diligence. Hornet is framed around countering subsonic aerial threats and, in Block 2 form, striking maritime or ground targets. Ruta is framed around pre-planned precision attack against hardened or high-value targets, including GNSS-denied and EW-contested scenarios. Kryla extends the portfolio toward high-volume, lower-payload saturation attacks coordinated in salvo. The practical reading is that Destinus is mapping products to operational jobs: point defence, precision strike, deep strike, and distributed mass. That is a more coherent product architecture than the company’s earlier public association with hydrogen hypersonic passenger travel, and it is consistent with the defence-first identity now visible across official surfaces and recruiting copy.

    Public proof still stops short of buyer-level program detail. There is no public price sheet, no availability matrix by customer, and limited disclosure on how much of the advertised capability has passed qualification versus remaining in advanced development. But the product pages do show more than branding. They expose ranges, payload classes, launch concepts, and mission framing with enough specificity to conclude that the company has a real hardware portfolio rather than a pure concept deck.
