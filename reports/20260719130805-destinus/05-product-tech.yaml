  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-and-effectiveness
    missingEvidence: Program-level reliability data, intercept success rates, CEP data, failure modes, maintenance burden, and sustained test-series outcomes by product family.
    whyItMatters: Without it, public product pages and demos cannot be translated into fieldable combat effectiveness or sustainment confidence.
    diligencePath: Request test reports, reliability-growth curves, acceptance criteria, and sustainment metrics for Hornet, Ruta, Kryla, and engine programs.
    relatedQuestionRefs:
    - QE013
    - QE019
    - QE022
    - QE024
    relatedTableRefs:
    - TE001
    - TE004
  - type: private-evidence-only
    severity: material
    topic: autonomy-ownership-and-assurance
    missingEvidence: A clean architecture split showing which autonomy, flight-control, and perception functions are internal, partnered, or acquired, plus the assurance method for each.
    whyItMatters: Platform breadth is only a moat if the company controls the critical layers and can certify, govern, and support them.
    diligencePath: Request system architecture, software BOM, partner boundaries, certification plans, and assurance artefacts for Hivemind- and Daedalean-related capabilities.
    relatedQuestionRefs:
    - QE009
    - QE010
    - QE015
    - QE023
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: qualification-export-and-cyber-governance
    missingEvidence: Completed NATO or buyer qualification milestones, export-license pathways, cyber-assurance standards, and product-level compliance ownership by system.
    whyItMatters: Weapons systems cannot scale commercially if qualification and governance lag the product roadmap.
    diligencePath: Request qualification matrix, export-control memos, cyber testing results, and customer-specific approval status by product family.
    relatedQuestionRefs:
    - QE017
    - QE018
    - QE024
    relatedTableRefs:
