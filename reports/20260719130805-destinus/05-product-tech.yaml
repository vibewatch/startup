    - Nearer-term product with partner industrialization path
    - 700+ km, 250 kg, terrain-following and AI-assisted target recognition
    - Need seeker performance proof, exportability detail, and backlog visibility
  - - Ruta Block 3
    - Long-range deep strike
    - Roadmap-plus-industrialization program with Rheinmetall
