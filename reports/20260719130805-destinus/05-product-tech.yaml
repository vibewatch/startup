- id: trust-quality-and-compliance
  title: Trust, Quality, and Compliance
  body: |-
    Public trust and quality evidence exists, but it is uneven. The clearest disclosed control is ISO 9001 certification: the quality-policy page links certificates for Destinus Energy B.V., Destinus NL B.V., and Destinus Spain. That is useful because it signals a documented quality-management baseline across key operating entities, which matters for any company claiming industrial-scale defence production. The suppliers page adds another operational control surface by showing a structured intake path for prospect suppliers and published terms, implying procurement and quality processes extend beyond internal engineering.

    The gap is that ISO 9001 is not the same thing as product reliability proof or defence-qualification proof. The public materials reviewed here do not show mean time between failure, intercept success rates, seeker performance envelopes, cyber-assurance certifications, export-license status, or software-assurance evidence for autonomy. Rheinmetall’s June 2026 release says the objective is NATO qualification for Ruta Block 3, which is directionally positive, but an objective is not a completed certification. Similarly, Shield AI’s language around traceability, reliability, and governability helps the autonomy narrative, yet it is still partner-language rather than a disclosed program-level assurance package for Destinus systems.

    For diligence, the honest conclusion is that the trust story is credible at the process level but under-disclosed at the product-assurance level. Buyers may be reassured that the company has a quality system and industrial partners; investors should still ask for formal qualification evidence, reliability testing, software-assurance documentation, and export-control governance by product family.
