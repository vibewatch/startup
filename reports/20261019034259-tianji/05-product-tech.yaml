    summary: 'Public evidence points to a layered product stack: industrial and humanoid robot platforms, force-control components, and developer-facing integration surfaces.'
    data:
      layers:
        - label: Customer / operator workflows
          detail: 'Public evidence points to three main workflow destinations for the stack: factory automation, humanoid OEM integration, and research / teleoperation.'
