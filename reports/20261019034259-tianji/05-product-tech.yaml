            - label: Industrial automation cells
              note: Legacy SCARA, six-axis, and collaborative deployments.
            - label: Humanoid OEM integration
              note: Dual-arm subsystem sourcing for complete-machine makers.
            - label: Research and teleoperation
              note: Embodied-AI experiments, data capture, and robot learning.
        - label: Robot platforms
          detail: Tianji's public product evidence spans legacy industrial robots plus newer force-controlled dual-arm platforms rather than a single humanoid SKU.
          items:
            - label: Small- and medium-payload industrial robots
              note: SCARA and six-axis portfolio.
            - label: Collaborative robots
              note: Flexible automation line.
            - label: Force-controlled humanoid dual arms
              note: Commercial flagship in 2025-26 reporting.
            - label: Marvin / Marvin Pro
              note: Fixed-base research platform with optional grippers.
        - label: Control and sensing core
          modules:
            - label: Tianji Fusion Control System
              note: Named control layer across robot portfolio.
            - label: MEMS joint torque sensors
              note: Core force-control differentiator.
            - label: Integrated joint modules
              note: Lightweight force-controlled joint packaging.
            - label: Motion control algorithms
              note: Cited scaling focus for continued R&D.
        - label: Developer / deployment interfaces
          outputs:
            - label: URDF-compatible asset naming
              note: EmbodiChain exposes original ACD naming.
            - label: FK/IK + simulation config
              note: Community preset includes simulation-ready configuration.
            - label: ROS 2 communications
              note: Robotopian cites flexible integration workflows.
            - label: HDF5 / RLDS / MCAP data formats
              note: Supports data capture for robot-learning pipelines.
        - label: Manufacturing scale-up
          detail: Independent reporting says Tianji is directing capital toward larger-scale production, production-line automation, and first-pass yield.
          items:
            - label: Production automation
              note: A stated use of new financing rather than a verified current capability.
            - label: First-pass yield improvement
              note: A named scale-up priority without a disclosed baseline or target.
        - label: Commercial support rollout
          detail: Independent reporting says Tianji is building a global sales and technical-support network alongside product scale-up.
          outputs:
            - label: Localized sales coverage
              note: Expansion objective for overseas markets.
            - label: Technical support capacity
              note: Public service-level and staffing metrics remain unavailable.
    approximationNotes: The stack compresses multiple public surfaces into one layered operating view; it is an analyst synthesis, not a company-authored architecture diagram.
