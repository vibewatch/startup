artifact: product-tech
slug: tianji
runDate: '2026-10-19'
company:
  name: Tianji
chapter:
  number: 5
  title: Product & Technology
  summary: 'Tianji appears to have a real multi-line robotics stack: legacy industrial robots and controllers, plus a newer force-controlled humanoid-arm platform with externally visible developer and research tooling. The strongest proof is not just official marketing but a third-party simulation preset, a reseller research-platform listing, and multiple 2025-26 reports of scaled dual-arm shipments; the main remaining gap is public trust/compliance documentation for field deployment.'
sections:
  - id: portfolio-and-workflows
    title: Portfolio breadth is broader than a single humanoid demo
    body: 'The public product picture is broader than Tianji''s 2026 humanoid-arm headlines. Third-party and database sources still describe a legacy industrial stack of SCARA, six-axis, and collaborative robots anchored by the self-developed Tianji Fusion control system, while Caplight classifies the business model as hardware sales plus services and consulting. That matters because it suggests the humanoid-arm line is being layered onto an existing automation supplier base rather than replacing the company''s earlier industrial workflow. For product diligence, the key distinction is that Tianji now appears to serve two adjacent jobs: conventional industrial automation deployments and embodied-AI / humanoid development programs that need force control, teleoperation, and data capture.'
    claimRefs:
      - CE001
      - CE002
      - CE009
    tableRefs:
      - TE001
      - TE002
  - id: architecture-and-differentiation
    title: Externally verifiable architecture signals center on force control, joints, and developer tooling
    body: 'The clearest architecture evidence comes from three different surfaces that line up with each other. Tianji''s own news flow emphasizes MEMS joint torque sensors and lightweight integrated joint modules; EmbodiChain exposes a community-maintained preset with original ACD URDF naming, FK/IK tooling, and a simulation-ready configuration; and Robotopian presents Marvin Pro as a research/deployment platform with ROS 2 interfaces, multimodal data formats, and force / impedance control. Together, those sources support a product thesis built around actuation precision and deployable tooling rather than a generic humanoid concept slide. The differentiation claim is therefore strongest at the component-and-platform layer: sensors, joint modules, motion/control software, and developer interfaces that make the arm usable inside research or OEM workflows.'
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE010
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: maturity-dependencies-and-product-risk
    title: Scaled shipment claims improve maturity, but manufacturing and trust controls still need direct diligence
    body: Tianji's strongest maturity signal is that multiple sources converge on scaled force-controlled dual-arm delivery in 2025-26 rather than just prototype announcements. Official and independent coverage both point to more than 2,000 dual-arm units delivered within four months, while independent reports also describe more than 100 served customers and a Q1 2026 order book above 10,000 units across 45 global humanoid-robot OEM customers. That pushes the underwriting question from “is there a real product?” toward “how repeatable is fulfillment and support at scale?” The same independent reporting says new capital is earmarked for R&D, mass production, production-line yield, and global sales / technical support, which implies those operating capabilities are still being built out. Public product evidence in this assigned pool is also thin on named safety certifications, security attestations, uptime/status reporting, or formal quality-system disclosures for the humanoid-arm line, so trust and compliance diligence still needs direct document requests before enterprise deployment risk can be scored tightly.
    claimRefs:
      - CE008
      - CE011
      - CE012
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset / product line
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - SCARA and six-axis industrial robots
        - Factory automation teams
        - Legacy / commercialized line
        - Part of a full small- and medium-payload product matrix tied to Tianji Fusion Control System
        - Public sources do not break out current SKU mix, ASP, or gross margin by industrial line
      - - Collaborative robots and automation solutions
        - Industrial customers needing flexible automation
        - Commercialized line, but public evidence is summary-level
        - Extends Tianji beyond a single humanoid bet into broader automation workflows
        - Need named deployments, list pricing, and realized service attach rates
      - - Force-controlled humanoid dual-arm systems
        - Humanoid OEMs and embodied-AI developers
        - Scaled from launch in 2024 to reported mass production in 2025
        - Force control plus integrated joint modules position Tianji as a subsystem supplier, not just a demo builder
        - Need verified customer retention, failure rates, and warranty economics
      - - Marvin / Marvin Pro research platform
        - Researchers, universities, and robot-learning teams
        - Externally visible platform with developer-facing documentation and reseller specs
        - Teleoperation, ROS 2, data-capture formats, and optional grippers make the arm usable for experimentation and dataset creation
        - Need direct Tianji documentation on software stack ownership, release cadence, and support SLAs
    notes: Sources combine company, reseller, developer, and third-party database evidence; maturity reflects public signals, not audited shipment or support data.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE008
      - CE009
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Tianji solution
      - Measurable benefit
      - Limitation
    rows:
      - - Small/medium-payload factory automation
        - Deploy SCARA, six-axis, and control systems for repetitive industrial tasks
        - Industrial robot portfolio plus Tianji Fusion Control System
        - Installed-base signal of more than 800 customers and over 10,000 robots operating online
        - Public evidence does not separate which workloads belong to which robot families or what utilization looks like today
      - - Embodied-AI / humanoid research
        - Need force-sensitive manipulation, teleoperation, and structured data capture
        - Marvin Pro dual-arm platform
        - ROS 2 plus HDF5/RLDS/MCAP support lowers integration friction for robot-learning workflows
        - Public sources do not clarify what portion of the stack is Tianji-native software versus integrator packaging
      - - Humanoid OEM subsystem sourcing
        - Need force-controlled dual arms that can scale beyond prototype stage
        - Force-controlled dual-arm systems with MEMS torque sensors and integrated joint modules
        - Multiple sources cite >2,000 units delivered in four months and >10,000 Q1 2026 orders
        - Shipment claims are not independently audited and warranty / field-failure metrics are undisclosed
      - - University and lab experimentation
        - Need fixed-base manipulation platform with precise control and optional end-effectors
        - Marvin / Marvin Pro with optional grippers and simulation preset
        - Community preset and reseller listing both point to simulation and research readiness
        - Need official software roadmap, localization, and maintenance commitments for international labs
    notes: Benefits are source-stated metrics or workflow capabilities; limitations mark missing denominators, support details, or ownership boundaries not resolved in public evidence.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE010
      - CE011
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - MEMS joint torque sensors
        - Provide force-control input at the joint level for humanoid arms
        - Sensor performance, calibration, and manufacturing yield
        - Public metrics come from marketing/reporting, not from independent benchmark suites or reliability studies
      - - Integrated joint modules
        - Package actuation for lightweight dual-arm systems and 3kg-20kg product payloads
        - Mechanical design, supply chain, and line yield
        - Scale-up depends on first-pass yield and automation improvements that the company says it is still building
      - - Fusion control / motion-control software
        - Coordinates industrial robot portfolio and force-control behavior
        - Controller software maturity and integration tooling
        - Public evidence names the control stack but does not surface release cadence, APIs, or safety architecture documentation
      - - Teleoperation, simulation, and data interfaces
        - Make Marvin usable for research, demonstration, and robot-learning workflows
        - ROS 2 compatibility, data pipelines, and partner/research distribution
        - Current evidence relies on community and reseller surfaces rather than a deep official developer portal or public status/SLA reporting
    notes: Architecture rows mix directly stated components with operating dependencies inferred from how Tianji describes scaling production and support.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE010
      - CE011
      - CE012
