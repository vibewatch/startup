      a common denominator.
    whyItMatters: >-
      Without a defensible SAM/SOM bridge, valuation work has to treat current market size as directional rather than
      underwritten.
    diligencePath: >-
      Request management's segmentation model with named customer cohorts, unit ASPs, attach rates, and current pipeline
      by buyer type.
    relatedQuestionRefs:
      - QM008
