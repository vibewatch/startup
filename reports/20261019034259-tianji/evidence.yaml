evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: A current board roster, named executive bench, and any disclosed committee or veto structure.
    whyItMatters: Governance concentration and key-person dependence are visible, but board mechanics and bench depth remain opaque.
    diligencePath: Request the latest board materials, shareholder agreement summary, and an executive org chart from management.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      A signed financing summary that fixes the exact post-money valuation and reconciles RMB8 billion versus nearly
      RMB10 billion public references.
    whyItMatters: >-
      Valuation drives return underwriting and relative market positioning, and the current public number is a range
      rather than a settled figure.
    diligencePath: Obtain the signed May 2026 round documents or an investor deck with the exact round math and FX assumptions.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Standalone 2026 revenue, gross margin, burn, runway, backlog conversion, and current headcount.
    whyItMatters: >-
      Operating scale claims are strong, but without financial conversion the overview cannot anchor valuation or
      execution quality confidently.
    diligencePath: Request the latest management accounts, payroll snapshot, and shipment-to-revenue bridge by product line.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: >-
      Detailed May 2026 round terms, including board rights, liquidation preferences, anti-dilution, and any secondary
      component.
    whyItMatters: A real financing amount does not reveal the control or downside economics attached to the unicorn headline.
    diligencePath: Review the share purchase agreement, shareholder rights agreement, and cap table immediately after close.
    relatedQuestionRefs:
