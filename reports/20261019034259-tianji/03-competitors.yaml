callouts:
  - calloutType: strength
    title: Supply-chain position is the clearest differentiator
    body: >-
      The strongest public edge is not a consumer brand or software ecosystem; it is visible dual-arm delivery scale into
      OEM supply chains plus a technical narrative around force control, integrated joints, and support expansion.
    claimRefs: [CP004, CP005, CP010, CP011]
  - calloutType: risk
    title: Pricing opacity and blurred partner-competitor boundaries keep the moat provisional
    body: >-
      Public sources do not expose Tianji's core OEM pricing or direct peer benchmarks, while adjacent humanoid entrants and
      Tianji's own whole-body incubation can turn customers, suppliers, and peers into overlapping competitive threats.
    claimRefs: [CP008, CP012, CP013]
