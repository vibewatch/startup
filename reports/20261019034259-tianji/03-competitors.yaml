schemaVersion: report-v2
artifact: competitors
slug: tianji
runDate: 2026-10-19
company:
  name: Tianji
chapter:
  number: 3
  title: Competitors
  summary: >-
    Tianji competes less like a consumer-humanoid OEM and more like a force-control infrastructure supplier whose
    benchmark set spans collaborative-robot peers, humanoid OEMs that could internalize arms, research platforms, and
    incumbent automation stacks. The best-supported edge in the assigned evidence is execution at scale in force-controlled
    dual arms; the weakest public areas are peer pricing, head-to-head benchmarks, and proof that switching costs are
    durable beyond hardware performance and delivery capacity.
sections:
  - id: market-boundary
    title: "Competitive boundary: supplier to humanoid OEMs, but still benchmarked against industrial robotics peers"
    body: >-
      The assigned evidence places Tianji in two overlapping competitive arenas. Independent profiles describe it as a B2B
      robotics company spanning industrial robots, collaborative dual-arm robots, automation solutions, and physical-AI
      development tooling, while official surfaces still market articulated robots, collaborative robots, controllers,
      software, and factory applications. That means Tianji does not compete only against other force-controlled humanoid-arm
      vendors; buyers can still solve similar jobs through conventional industrial automation stacks, internal integration
      teams, or adjacent research platforms. Caplight's closest embedding-similarity comparables are Titanium Tiger
      Robotics, Flexiv, and Huayan Robotics, which reinforces that outside observers still benchmark Tianji against
      industrial and collaborative robotics peers rather than treating it solely as a full-stack humanoid brand. At the
      same time, 36Kr, Embodied Global, and ManbotAI all frame Tianji's current demand around supplying humanoid OEMs and
      embodied-AI companies, so its real competitive field sits at the boundary between components, subsystems, and broader
      automation vendors.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capabilities-and-packaging
    title: Capabilities favor force-control execution, but public packaging evidence is narrow
    body: >-
      The most defensible differentiation in the retained pool is technical and operational rather than commercial. Multiple
      independent sources repeat Tianji's claims around force-controlled dual-arm delivery volume, while Robotopian shows a
      public Marvin Pro research platform with ROS 2 workflows, teleoperation, multimodal data collection, and quote-based
      academic bulk pricing. Those facts suggest Tianji can compete for both OEM subsystem budgets and lab/developer
      tooling budgets. However, public packaging evidence remains thin: the assigned sources do not expose list prices for
      Tianji's core OEM dual-arm supply or broader industrial arms, and they do not provide direct feature or pricing pages
      for Caplight's named peer set. As a result, Tianji's apparent product edge is supported better than its commercial
      edge, and matrix cells around pricing transparency, ecosystem lock-in, and direct like-for-like benchmarks remain
      materially incomplete.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002, TP003]
  - id: durability-and-competitive-risk
    title: Durability depends on scale delivery and supply-chain embedment more than software lock-in
    body: >-
      The strongest moat evidence in this pool is Tianji's combination of force-control performance claims and visible
      shipment/backlog scale into humanoid OEM supply chains. Independent reporting says the company delivered more than
      2,000 force-controlled dual-arm units within four months in 2025 and entered 2026 with more than 10,000 units of
      backlog covering 45 OEM or embodied-AI customers; those are more concrete deployment markers than the prototype-stage
      descriptions attached to many adjacent embodied-AI entrants. But moat durability is not yet proven as software or
      channel lock-in. The same sources emphasize new funding for R&D, mass production, and global sales coverage, implying
      that execution speed and service coverage are still decisive. KuCoin's syndicated flash also situates Tianji beside
      other heavily financed embodied-AI names such as Unitree, Galaxy General, Looj Robotics, and Zidongbian Robotics, and
      EqualOcean says Tianji is incubating humanoid robot products and brands of its own. That creates a plausible future in
      which today's customers or adjacent OEMs become more direct competitors, while buyers still retain the fallback of
      conventional automation or in-house builds when Tianji's embodied-AI premium is not clearly priced or benchmarked.
    claimRefs: [CP010, CP011, CP012, CP013, CP014]
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor / alternative
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation signal
      - Limitation in assigned evidence
    rows:
      - [Tianji, "Force-controlled dual-arm platform supplier", "Series B/B+; $138M-$152.58M raised; ~$1.4B-$1.5B valuation proxies", "Humanoid OEMs, embodied-AI companies, industrial automation buyers", "Force-control stack plus visible backlog and delivery claims", "Peer pricing and head-to-head benchmark data are not public in this pool"]
      - ["Titanium Tiger Robotics / Flexiv / Huayan Robotics", "Caplight embedding-similarity peer set", "Similarity scores 85% / 84% / 83%; no retained funding detail", "Industrial/collaborative robotics buyers", "Closest named external peer set in retained evidence", "Assigned pool lacks direct product, pricing, and deployment pages for these peers"]
      - ["Unitree / Galaxy General / Looj / Zidongbian", "Adjacent capital-rich embodied-AI entrants", "Named only through one syndicated 2026 funding/IPO comparison source", "Humanoid or embodied-AI ecosystem attention", "Potential to internalize arms or crowd buyer mindshare", "No apples-to-apples capability or pricing evidence in assigned pool"]
      - ["Internal build / conventional industrial automation stack", "Status quo substitute", "No public spend benchmark in retained sources", "Factories, labs, and integration-heavy operators", "Can solve similar manipulation jobs with existing robots, controllers, and software", "Replacement economics and migration triggers are not disclosed publicly"]
    notes: >-
      Rows mix named peers and category-level substitutes because the assigned pool contains one explicit peer list but not a
      full set of direct competitor product pages; unknown cells remain evidence gaps rather than model-filled estimates.
    enumerationScope:
      coverage: partial
      basis: >-
        Retained alternatives reflect only the named peers and substitute classes visible in the assigned competitor pool as
        of the 2026-10-19 run.
    claimRefs: [CP001, CP002, CP003, CP004, CP012, CP014]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Tianji evidence
      - Alternatives visible in assigned evidence
      - Unsupported or unknown
    rows:
      - ["Industrial deployment proof", "2,000+ dual-arm deliveries in four months in 2025 and 10,000+ Q1 2026 backlog claims", "Named adjacent entrants are described mainly through fundraising/IPO activity, not deployed volume", "No standardized third-party benchmark normalizes deployments across peer set"]
      - ["Force-control and manipulation stack", "MEMS torque sensing, integrated joints, dual-arm coordination, ROS 2 research workflow", "Conventional automation substitutes are broader but less explicitly force-control centric in this pool", "No retained side-by-side spec sheets for Flexiv, Titanium Tiger, or Huayan"]
      - ["Research / developer workflow", "Marvin Pro exposes teleoperation, multimodal data capture, and ROS 2 interfaces", "Research-platform competition clearly exists, but assigned evidence only documents Tianji's public offering", "No retained external lab-platform pricing or spec sheets"]
      - ["Whole-body robot scope", "Tianji is still described primarily as arm / infrastructure supplier, though brand incubation is mentioned", "Adjacent OEM entrants compete at full-robot or ecosystem mindshare level", "Timing and seriousness of Tianji's move into whole-body products remain unclear"]
    notes: >-
      This matrix preserves only capabilities stated in retained sources and marks the missing external benchmark cells as
      unknown instead of inferring parity or inferiority.
    enumerationScope:
      coverage: partial
      basis: >-
        Criteria reflect the buying lenses that recur in the retained evidence: deployment proof, force-control capability,
        developer workflow, and whole-body scope.
    claimRefs: [CP004, CP005, CP006, CP009, CP012, CP013]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Route / alternative
      - Public commercial model
      - Included capabilities
      - Discount or unknowns
      - Implication
    rows:
      - ["Marvin Pro research platform", "Quote-based", "Dual 7DoF arms, teleoperation, ROS 2 workflows, data capture", "Bulk pricing and academic discounts are offered, but no list price is disclosed", "Tianji can pursue research budgets, but procurement still requires direct sales engagement"]
      - ["Core force-controlled OEM dual-arm supply", "Not publicly priced in retained sources", "Subsystem supply for humanoid OEM / embodied-AI customers", "No public ASP, contract model, or volume discount structure in assigned pool", "Commercial competitiveness versus peer suppliers cannot be underwritten from public evidence"]
      - ["Broader industrial robot / automation catalog", "Public catalog exists, pricing not retained", "Articulated robots, collaborative robots, controllers, software, applications", "No public list pricing in the retained official pages", "Status-quo buyers may compare on existing vendor relationships rather than transparent pricing"]
      - ["Adjacent humanoid OEM / internal-build path", "No retained public pricing", "Whole-robot programs or integration-heavy in-house approach", "Assigned pool offers capital headlines, not comparable customer pricing", "Switching-cost and make-versus-buy judgments remain diligence items"]
    notes: >-
      The retained pool supports packaging transparency analysis better than direct price benchmarking; cells stay explicit
      about unknown commercial terms rather than converting absence of evidence into implied affordability.
    enumerationScope:
      coverage: partial
      basis: >-
        Comparison is limited to commercial routes explicitly visible in the retained sources and does not claim exhaustive
        pricing coverage across the robotics market.
    claimRefs: [CP006, CP007, CP008, CP014]
