artifact: company-overview
slug: tianji
runDate: 2026-10-19
company:
  name: Tianji
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Tianji is a Dongguan robotics company founded in 2015 whose current identity is anchored in
    force-control hardware, industrial robot products, and an embodied-intelligence infrastructure
    narrative rather than in audited financial disclosure. Public evidence supports a real May 2026
    RMB1 billion Series B/B+ round and meaningful shipment momentum, but valuation references still
    resolve only to a range because independent summaries disagree between RMB8 billion and nearly
    RMB10 billion and current secondary-market pricing is not visible.
sections:
  - id: identity-and-scale
    title: Identity and operating scope
    body: >-
      Public company materials and startup databases agree that Tianji is a Dongguan / Songshan Lake
      robotics company formed in 2015, but they describe the business through the lens of its current
      force-control niche rather than through audited financial scale. The official site positions
      Tianji as a robot and control-systems vendor spanning collaborative, articulated, SCARA, and
      force-controlled humanoid-arm products on its Tianji Fusion control system. That matters for
      the rest of the report: Tianji should be treated as an automation supplier evolving into
      embodied-intelligence infrastructure, not as a pure software company or a generic humanoid
      brand. Scale signals are directionally positive but dated. The official site still points to
      more than 800 customers and over 10,000 robot units online by end-2022, while later 2025-2026
      coverage shifts toward dual-arm deliveries and order backlog instead of refreshed enterprise-
      wide revenue, customer, or headcount disclosure.
    claimRefs: [CO001, CO002, CO003, CO008, CO009, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, ownership, and governance visibility
    body: >-
      Public reporting points to a concentrated control picture rather than a fully transparent
      operating bench. KuCoin and 36Kr identify Chen Xi as the legal representative or chairman and
      place her alongside Changying Precision as a meaningful owner, while KuCoin also links her to
      Changying founder Chen Qixing through family ties. That combination suggests industrial parent
      influence, founder-linked governance, and a high degree of key-person dependence around the
      current transition from general industrial automation into force-controlled embodied-intelligence
      products. The limitation is that the public source set does not enumerate a current board roster
      or a broader executive bench, so investors can see the control nodes but not yet the full
      governance mechanics behind them.
    claimRefs: [CO012, CO016]
    tableRefs: [TO002]
  - id: funding-and-valuation
    title: Funding history and valuation range
    body: >-
      The clearest current financing fact is the May 2026 Series B/B+ raise: official and
      independent sources align on RMB1 billion and broadly agree on the investor set led by
      Hillhouse / GL Ventures and Meituan Strategic Investment, with Tencent and other investors
      participating. The valuation signal is less precise. EqualOcean reports an RMB8 billion
      post-investment value, while 36Kr, KuCoin, and Tianji's own news page frame the same event as
      nearly RMB10 billion. Private-market databases translate the round into roughly $1.4-$1.5
      billion, but Caplight explicitly says no recent secondary-market data is available and its
      number is estimated from funding round information. That makes the round real, but it leaves
      current price discovery and exact post-money interpretation weaker than the unicorn headline.
    claimRefs: [CO004, CO005, CO006, CO007, CO010, CO011]
    tableRefs: [TO003]
  - id: milestones-and-open-gaps
    title: Milestones and remaining diligence gaps
    body: >-
      The source set shows a coherent operating arc even though important diligence fields remain
      private. Official news entries trace a progression from the April 2024 launch of a force-
      controlled humanoid arm, to 2025 mass delivery claims for dual-arm systems, to a September
      2025 strategic partnership with Zhongke Huiling, to showcase and award events in April 2026,
      and then to the May 2026 financing milestone. That sequence supports the thesis that Tianji
      has moved from legacy industrial robotics into a higher-profile embodied-intelligence position.
      At the same time, current public materials still do not disclose standalone 2026 revenue, gross
      margin, burn, runway, detailed round terms, or a fuller board roster, so later chapters should
      reuse the identity and milestone base here while keeping financial and governance conclusions
      conditional on additional diligence.
    claimRefs: [CO013, CO014, CO015, CO016, CO008, CO009]
    figureRefs: [FO001]
