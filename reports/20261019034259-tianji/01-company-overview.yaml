      coverage: partial
      basis: Rows retain only stakeholders that were explicitly named in assigned public sources and matter to control, latest financing, or diligence routing.
    claimRefs: [CO004, CO007, CO012]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Public evidence shows a 2015 industrial-robotics origin, a 2024-2026 embodied-intelligence acceleration, and a May 2026 financing step without closing core disclosure gaps.
    data:
      items:
        - date: "2015-05"
          label: Founded in Dongguan / Songshan Lake
          detail: Public company and database sources place Tianji's formation in 2015 in Dongguan.
          tone: neutral
        - year: "2021"
          label: Renamed and repositioned from the Changying automation lineage
          detail: EqualOcean says the company was renamed Guangdong Tianji Intelligent System Co., Ltd. in 2021 after operating as an internal automation division.
          tone: neutral
        - period: End 2022
          label: Reported 800 plus customers and 10,000 plus robots online
          detail: The official about page gives the last clearly dated all-company customer and installed-base snapshot.
          tone: positive
        - period: April 2024
          label: Launched a force-controlled humanoid arm
          detail: The official news page says Tianji launched the world's first force-controlled humanoid arm in April 2024.
          tone: positive
        - year: "2025"
          label: Claimed mass delivery of dual-arm systems
          detail: Official and independent 2026 coverage says Tianji delivered more than 2,000 force-controlled humanoid dual-arm units within four months in 2025.
          tone: positive
        - date: "2025-09-22"
          label: Signed strategic partnership with Zhongke Huiling
          detail: The official news page lists a strategic partnership and order with Beijing Zhongke Huiling.
          tone: positive
        - date: "2026-04-22"
          label: Displayed force-controlled humanoid dual arms at FAIRplus 2026
          detail: The official news page frames FAIRplus as a showcase milestone for embodied-intelligence limbs.
          tone: positive
        - date: "2026-04-28"
          label: Won LeadeRobot 2026 awards
          detail: The official news page lists three industry awards across mass production, supply chain, and talent categories.
          tone: positive
        - date: "2026-05-25"
          label: Closed RMB1 billion Series B/B+ round
          detail: Official and independent coverage agree on the financing amount, while public valuation descriptions still span RMB8 billion to nearly RMB10 billion.
          tone: positive
    approximationNotes: null
    claimRefs: [CO001, CO004, CO005, CO006, CO008, CO009, CO013, CO014]
callouts:
  - calloutType: insight
    title: Industrial pedigree matters more than generic humanoid branding
    body: >-
      The assigned evidence consistently frames Tianji as a company that came out of industrial
      robotics and is now trying to own the force-control layer of embodied intelligence. That is a
      more precise identity than simply calling it a humanoid startup.
    claimRefs: [CO001, CO002, CO008, CO009]
  - calloutType: risk
    title: Valuation should be treated as a range, not as a settled price
    body: >-
      The RMB1 billion round appears real, but public valuation support is still weaker than the
      unicorn headline because independent sources disagree between RMB8 billion and nearly RMB10
      billion and Caplight says no recent secondary-market data is available.
    claimRefs: [CO004, CO005, CO006, CO010, CO011]
