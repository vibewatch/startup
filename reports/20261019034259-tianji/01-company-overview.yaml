      - ['Chen Xi', 'Chairman or legal representative and insider owner', '36Kr reports a 15.225% stake in 2026 coverage', 'Public leadership visibility is concentrated here.', 'Management depth, succession planning, and employment agreements.']
      - ['CLH 142 HK Limited', 'Large minority holder', '36Kr places CLH 142 near 19.7% in 2026 ownership reporting', 'Economically important but not well explained in public materials.', 'Beneficial owner identity and governance rights.']
      - ['GL Ventures / Hillhouse', 'Co-lead investor in the May 2026 round', 'Lead-capital signaling for the latest financing', 'EqualOcean, 36Kr, and InforCapital all place GL or Hillhouse in the lead set.', 'Ownership percentage, board rights, and milestone conditions.']
      - ['Meituan Strategic Investment', 'Co-lead strategic investor', 'Signals ecosystem interest beyond pure VC capital', 'Official and independent coverage place Meituan in the co-lead group.', 'Commercial cooperation terms, procurement overlap, and exclusivity.']
      - ['Tencent and follow-on syndicate', 'Participating strategic and financial investors', 'Adds brand and network support but public economics remain opaque', 'EqualOcean, 36Kr, and KuCoin list Tencent alongside other growth investors.', 'Final post-close cap table and any secondary component.']
    notes: >-
      Ownership percentages and investor roles come from a mix of May 2026 funding coverage and
      contemporaneous summaries. They should be reconciled against the signed financing documents and
      current shareholder register.
