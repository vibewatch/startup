  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Observed public mark
        - Latest round remains the only hard price anchor and outside data clusters near $1.4-1.5 billion.
        - Treat the May 2026 mark as reference value rather than upside proof.
        - Public sources still disagree on the exact post-money number and do not show operating conversion.
        - Current baseline.
      - - Bull
        - >-
          Claimed backlog converts into disclosed revenue and gross margin while terms are clean and repeat customers
          validate the demand story.
        - >-
          A premium above the latest round could be justified only after operating proof closes the current disclosure
          gap.
        - Orders may not convert into quality revenue and preferences may absorb upside.
        - Needs new private diligence rather than public extrapolation.
      - - Base
        - Round mark holds, industrial traction remains credible, and no major negative diligence surprise appears.
        - Value clusters around the latest financing band with limited re-rating until fundamentals are shown.
        - The company may simply be fairly priced already with little margin of safety.
        - Most supportable with current evidence.
      - - Bear
        - >-
          Revenue conversion disappoints, preference overhang is heavy, or liquidity stays thin while independent marks
          remain inconsistent.
        - >-
          A discount to the latest round would be warranted because the current public evidence would look momentum-led
          rather than fundamentals-led.
        - Headline shipment claims may mask weaker margins, concentration, or backlog quality.
        - Triggered by failed diligence or a weaker next round.
    notes: >-
      Scenario ranges are qualitative because the assigned public sources do not provide enough financial detail for a
      defensible model-based valuation.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV009
      - CV010
