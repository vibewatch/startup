              a product thesis built around actuation precision and deployable tooling rather than a generic humanoid
              concept slide. The differentiation claim is therefore strongest at the component-and-platform layer:
              sensors, joint modules, motion/control software, and developer interfaces that make the arm usable inside
              research or OEM workflows.
