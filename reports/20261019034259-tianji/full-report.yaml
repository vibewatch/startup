              Tianji's own news flow emphasizes MEMS joint torque sensors and lightweight integrated joint modules;
              EmbodiChain exposes a community-maintained preset with original ACD URDF naming, FK/IK tooling, and a
              simulation-ready configuration; and Robotopian presents Marvin Pro as a research/deployment platform with
