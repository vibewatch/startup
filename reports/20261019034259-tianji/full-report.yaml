        title: Milestones and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The source set shows a coherent operating arc even though important diligence fields remain private.
              Official news entries trace a progression from the April 2024 launch of a force- controlled humanoid arm,
              to 2025 mass delivery claims for dual-arm systems, to a September 2025 strategic partnership with Zhongke
              Huiling, to showcase and award events in April 2026, and then to the May 2026 financing milestone. That
              sequence supports the thesis that Tianji has moved from legacy industrial robotics into a higher-profile
              embodied-intelligence position. At the same time, current public materials still do not disclose
              standalone 2026 revenue, gross margin, burn, runway, detailed round terms, or a fuller board roster, so
              later chapters should reuse the identity and milestone base here while keeping financial and governance
