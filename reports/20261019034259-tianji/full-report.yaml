  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive boundary: supplier to humanoid OEMs, but still benchmarked against industrial robotics peers'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence places Tianji in two overlapping competitive arenas. Independent profiles describe
              it as a B2B robotics company spanning industrial robots, collaborative dual-arm robots, automation
              solutions, and physical-AI development tooling, while official surfaces still market articulated robots,
              collaborative robots, controllers, software, and factory applications. That means Tianji does not compete
              only against other force-controlled humanoid-arm vendors; buyers can still solve similar jobs through
              conventional industrial automation stacks, internal integration teams, or adjacent research platforms.
              Caplight's closest embedding-similarity comparables are Titanium Tiger Robotics, Flexiv, and Huayan
              Robotics, which reinforces that outside observers still benchmark Tianji against industrial and
              collaborative robotics peers rather than treating it solely as a full-stack humanoid brand. At the same
              time, 36Kr, Embodied Global, and ManbotAI all frame Tianji's current demand around supplying humanoid OEMs
              and embodied-AI companies, so its real competitive field sits at the boundary between components,
              subsystems, and broader automation vendors.
            claimRefs:
