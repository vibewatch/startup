      - number: '2.3'
        title: Adoption drivers, buyer motion, and the main constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption appears to be pulled by a specific bottleneck: humanoid and embodied-AI programs need reliable
              force-controlled manipulation hardware, not just better cognition. That creates a buyer set spanning
              factory automation teams, humanoid OEM platform groups, and research labs that want ready-made
              teleoperation and data-collection systems. At the same time, the sources repeatedly frame production
              consistency, yield, stability, and local support as the real gating factors for scaling from prototype
              programs into repeat deployments. Tianji's 2026 expansion into Gento full-humanoid products may broaden
              the reachable market, but it also increases execution complexity by pushing the company closer to platform
              and OEM exposure rather than staying purely in subsystems.
