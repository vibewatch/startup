  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence now
      - What would change the view
    rows:
      - - 'Thesis: real financing mark'
        - >-
          Official and independent coverage align that RMB 1 billion was raised in May 2026 and external trackers
          cluster around roughly $1.4-1.5 billion.
        - A lower-quality round structure or hidden investor protections would weaken the usefulness of the latest mark.
      - - 'Thesis: commercialization signals exist'
        - >-
          Public sources cite >2,000 dual-arm units delivered in 2025 plus >10,000 units of Q1 2026 orders and broad
          OEM/customer reach.
        - >-
          Verified revenue, gross margin, and repeat-order disclosure would turn these demand signals into underwritable
          operating proof.
      - - 'Anti-thesis: financial bridge is missing'
        - >-
          The assigned valuation sources do not disclose standalone revenue, gross margin, burn, runway, renewal,
          backlog aging, or realized ASP.
        - >-
          Audited or management-provided KPI disclosure could justify underwriting closer to operating value rather than
          headline momentum.
      - - 'Anti-thesis: public mark quality is inconsistent'
        - >-
          EqualOcean prints RMB 8 billion while other sources cluster near RMB 10 billion / $1.4-1.5 billion, and
          Caplight reports no recent secondary market data.
        - >-
          Consistent third-party marks plus disclosed secondary or IPO-readiness evidence would improve confidence in
          price discovery.
    notes: >-
      Thesis rows summarize valuation-relevant evidence only; changes in view require new disclosed facts, not a
      stronger narrative about robotics demand.
