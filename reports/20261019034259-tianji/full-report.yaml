      - number: '4.2'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              Tianji's public materials are much stronger on engineering output than on unit economics. The company and
              syndicated coverage consistently emphasize force-control performance, mass-production capability,
              automation-rate improvement, first-pass yield, and global-sales expansion, which suggests a cost structure
              dominated by hardware BOM, manufacturing yield, labor, and field-support costs rather than
              low-marginal-cost software delivery. However, none of the retained public sources disclose realized
              pricing, gross margin, warranty burden, channel take-rates, sales cycle length, customer-acquisition cost,
              payback, or working-capital intensity.


              That omission matters because Tianji's reported order and shipment volumes are not enough to infer revenue
              quality. Backlog above 10,000 units is not the same as booked revenue, and list-less hardware businesses
              can see wide differences between demonstration shipments, paid production deployments, pilot discounts,
              and full-margin recurring orders. Public evidence therefore supports only proxy analysis: Tianji appears
              to be scaling a capital-intensive hardware platform with meaningful production and support requirements,
              but the key underwriting inputs remain private.
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI008
              - CI011
              - CI012
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The clearest financial datapoint is the May 2026 Series B/B+ financing. EqualOcean and Gasgoo both report
              RMB 1 billion raised, with proceeds earmarked for R&D, large-scale mass production, and a global sales
              network. That use-of-funds mix implies Tianji still needs external capital to expand manufacturing
              capacity and overseas commercial coverage; it is not presenting itself publicly as a self-funding cash
              machine. The financing may be adequate for the current scale-up phase, but public evidence does not
              disclose cash-on-hand, monthly burn, debt, covenant load, or runway, so outside investors cannot
              independently test how long this round lasts.


              Third-party summaries also show some variance around the same financing event. InforCapital describes the
              May 2026 round as $138 million at a $1.4 billion valuation; EmbodiedGlobal translates it to approximately
              $140 million and nearly RMB 10 billion; and Caplight estimates $152.58 million total funding and a $1.5
              billion valuation while saying no recent secondary-market data is available. That spread is not large
              enough to negate unicorn status, but it does underline that current market pricing is inferred from sparse
              private-market datapoints rather than transparent financial disclosure. On available evidence, the next
              round trigger is more likely tied to manufacturing execution and revenue conversion than to any publicly
              auditable profitability milestone.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI008
              - CI012
      - number: '4.4'
        title: Verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Tianji looks like a fast-scaling robotics hardware supplier with credible demand signals and
              a clearly funded near-term expansion plan, but the public record does not yet support a clean underwriting
              case on revenue quality or margin path. The positive case is that customers, shipments, and backlog all
              point to genuine commercial pull, and the company is using fresh capital to industrialize production and
              global distribution. The weak point is that every decisive financial bridge — ASP to revenue, revenue to
              gross profit, gross profit to burn, and burn to runway — remains undisclosed.


              For diligence, the highest-priority asks are product-line pricing history, realized revenue by stream,
              gross margin by hardware versus services, backlog aging and cancellation rates, working-capital and capex
              requirements, and the current cash/runway picture after the 2026 round. Until those items are produced,
              the best-supported conclusion is that Tianji's operational momentum is real but its valuation still
              outruns the public financial evidence.
            claimRefs:
              - CI003
              - CI004
              - CI008
              - CI011
              - CI012
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital is funding capacity before transparency
            body: >-
              The May 2026 round is explicitly aimed at R&D, mass production, and global sales expansion, which is
              consistent with a hardware scale-up story but not with a public proof point on profitability or cash
              efficiency.
            calloutType: insight
            claimRefs:
              - CI002
              - CI008
          - type: callout
            title: Orders are not yet an underwritten revenue bridge
            body: >-
              Tianji's disclosed shipments and backlog support demand, yet the public record still lacks pricing,
              revenue-recognition, gross-margin, and runway data, so investors cannot verify whether scale is
              translating into healthy unit economics.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI012
