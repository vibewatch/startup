              - CE011
      - number: '5.3'
        title: Scaled shipment claims improve maturity, but manufacturing and trust controls still need direct diligence
        blocks:
          - type: paragraph
            body: >-
              Tianji's strongest maturity signal is that multiple sources converge on scaled force-controlled dual-arm
              delivery in 2025-26 rather than just prototype announcements. Official and independent coverage both point
              to more than 2,000 dual-arm units delivered within four months, while independent reports also describe
              more than 100 served customers and a Q1 2026 order book above 10,000 units across 45 global humanoid-robot
              OEM customers. That pushes the underwriting question from “is there a real product?” toward “how
              repeatable is fulfillment and support at scale?” The same independent reporting says new capital is
              earmarked for R&D, mass production, production-line yield, and global sales / technical support, which
              implies those operating capabilities are still being built out. Public product evidence in this assigned
              pool is also thin on named safety certifications, security attestations, uptime/status reporting, or
              formal quality-system disclosures for the humanoid-arm line, so trust and compliance diligence still needs
              direct document requests before enterprise deployment risk can be scored tightly.
            claimRefs:
              - CE008
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The product has unusually visible external tooling for a private robotics supplier
            body: >-
              EmbodiChain and Robotopian provide concrete third-party evidence that Tianji's dual-arm platform is
              exposed through simulation, teleoperation, and robot-learning interfaces rather than existing only as a
              press-release concept.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE005
          - type: callout
            title: Commercial maturity is improving faster than public trust/compliance disclosure
            body: >-
              Shipment and order claims suggest real demand, but the public package reviewed here still does not resolve
              safety certification, field-reliability, or quality-system documentation for the humanoid-arm line.
            calloutType: risk
            claimRefs:
              - CE008
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Installed base spans legacy factory accounts and newer humanoid buyers
        blocks:
          - type: paragraph
            body: >-
              The public customer picture is bifurcated. Tianji's owned web surfaces still present the company as a
              broad industrial robotics supplier across 3C electronics, footwear and apparel, construction machinery,
              and automotive manufacturing, while third-party profiles frame the business as a B2B hardware-and-services
              supplier rather than a pure software or research startup. Independent retellings of company data add that
              Tianji had more than 800 customers and over 10,000 robots online by the end of 2022, which implies the
              current humanoid narrative is building on a legacy industrial base rather than starting from zero.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU011
      - number: '6.2'
        title: Humanoid adoption claims are stronger on volume and cohort reach than on named accounts
        blocks:
          - type: paragraph
            body: >-
              Tianji has more concrete proof of adoption than many private robotics companies, but the proof is uneven.
              The strongest public datapoint is a company-originated claim, echoed by 36Kr, that Tianji delivered more
              than 2,000 force-controlled humanoid dual-arm units within four months during 2025. Third-party coverage
              also repeats that first-quarter 2026 on-hand orders exceeded 10,000 units and that the customer set
              covered 45 global humanoid robot OEMs and embodied-intelligence unicorn enterprises. Those figures point
              to real pipeline depth, yet outside one named Zhongke Huiling partnership and order, the public record
              still exposes far more cohort-level proof than individually referenceable production deployments.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU012
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU014
      - number: '6.3'
        title: Expansion appears to rely on customer enablement as much as on hardware specs
        blocks:
          - type: paragraph
            body: >-
              The adoption loop Tianji is describing is not just sell-a-robot and leave. Official support pages
              advertise phone, remote, and on-site fault support, spare-parts planning, software guidance, and training
              delivered by robotics engineers, while a third-party Marvin Pro product listing adds product-level
              warranty terms and academic discounts for universities and research institutions. Separately, 36Kr and
              EqualOcean both say Tianji plans to expand localized sales and technical-support teams overseas,
              especially in North America, on top of its existing OEM customer coverage. That combination suggests
              land-and-expand ambitions, but the public sources do not quantify attach rates, renewal behavior, or
              service revenue.
            claimRefs:
              - CU008
              - CU009
      - number: '6.4'
        title: Durability and concentration are still the weakest parts of the customer case
        blocks:
          - type: paragraph
            body: >-
              The biggest diligence gap is not whether Tianji has customer logos or even whether it ships product; it is
              whether the installed base renews, expands, and diversifies economically. The assigned pool does not
              disclose NRR, GRR, churn, contract duration, backlog conversion, top-customer exposure, channel
              dependence, or backlog aging by product line. Even the lone explicitly risk-framed third-party artifact
              retained for this chapter only surfaces as an aVenture title rather than as usable underlying analysis.
              That leaves the chapter able to say Tianji is commercially active, but not able to underwrite customer
              durability with the same confidence as adoption momentum.
            claimRefs:
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption proof is better than a logo page, even if still company-led
            body: >-
              Tianji has public adoption metrics that go beyond pure branding: legacy installed-base data, a 2025
              shipment milestone, a 2026 OEM coverage claim, and one named Zhongke Huiling order. That is materially
              stronger than a page of unlabeled customer logos, even though the largest metrics still come from
              company-linked disclosures echoed by outside media.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU010
              - CU014
          - type: callout
            title: Durability and concentration remain unproven
            body: >-
              Nothing in the assigned public pool establishes renewal economics, net revenue retention, churn, customer
              concentration, or backlog conversion. The chapter can validate demand signals and customer breadth claims,
              but it cannot yet validate whether that breadth translates into durable recurring economics or a
              diversified revenue base.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence public risks are execution and pricing risks rather than proof of an outright
              product or financing fabrication problem. Multiple sources align that Tianji raised roughly RMB1 billion
              in May 2026 and then added a September 2026 B++ round, while claiming more than 2,000 force-controlled
              dual-arm deliveries in four months and more than 10,000 units on order by Q1 2026. Those same sources also
              show that the new capital is still being aimed at manufacturing automation, yield improvement, and
              localized overseas support, which means the operating model is still being hardened while investors are
              already being asked to price the business at unicorn-scale marks. Public evidence therefore supports a
              risk ranking led by valuation/disclosure opacity, manufacturing scale-up, customer/OEM concentration, and
              overseas support/compliance execution.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR011
              - CR012
              - CR015
      - number: '7.2'
        title: Governance, regulatory, and financial disclosure risk
        blocks:
          - type: paragraph
            body: >-
              The sharpest financial underwriting risk is not whether Tianji raised money, but whether an investor can
              underwrite the price and control surface with precision. Public sources point to a May 2026 post-money
              valuation anywhere from RMB8 billion to nearly RMB10 billion, while market-data pages translate that into
              roughly $1.4 billion to $1.5 billion. The same public record is also inconsistent on ownership language:
              Robot Belt and 36Kr describe Changying or Everwin retaining about a 27 percent stake, whereas EqualOcean
              still describes Tianji as a wholly owned subsidiary. That does not prove misconduct, but it does mean
              minority investors should treat cap-table precision, board rights, preference stack, and any secondary
              component as unresolved diligence items rather than assuming the public story is already clean. Public
              materials in the assigned pool also do not surface named export-control, certification, product-safety, or
              litigation disclosures commensurate with Tianji's stated North America expansion ambitions, so regulatory
              readiness should be treated as unverified rather than presumed.
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR007
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Operational, partner, and customer execution risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Tianji has meaningful momentum but also a narrow path to proving that momentum is durable.
              Independent and company-linked sources repeatedly cite more than 2,000 dual-arm units delivered in four
              months and more than 10,000 units on order by Q1 2026, but the same evidence makes clear that management
              is still investing new capital to raise automation, improve first-pass yield, and stand up localized
              support teams abroad. That is consistent with a company that may have found product-market pull but has
              not yet publicly demonstrated mature service, reliability, or backlog-conversion metrics. Customer and
              partner concentration add to that risk: the disclosed backlog is tied to 45 global humanoid OEMs and
              embodied-AI companies, the product listing reviewed here shows a limited hardware warranty footprint, and
              public evidence still does not disclose cancellation rates, top-customer exposure, renewal behavior, or
              warranty-claim performance. The result is high residual execution risk even if product demand is real.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR010
              - CR012
              - CR014
      - number: '7.4'
        title: Mitigations, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The current mitigants are tangible but incomplete: Tianji has raised additional capital, continues to
              invest in core torque-sensor and control IP, and explicitly plans localized sales and technical-support
              teams to reduce overseas execution risk. Those steps matter, but they are still plans or early build-out
              indicators rather than disclosed proof that quality, field support, and customer economics are already
              de-risked. The practical monitoring set for the next diligence cycle is therefore narrow and measurable:
              whether the company can reconcile the May 2026 valuation range and ownership disclosures; whether backlog
              converts into shipped, accepted, and repeat orders; whether overseas support entities, certifications, and
              channel partners become visible; and whether field-reliability metrics or large-customer references become
              public. A thesis-break would be any credible evidence of a down-round versus the May mark, major backlog
              slippage, material safety or compliance issues, or customer concentration meaningfully worse than the
              current 45-OEM framing implies.
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite Tianji as a scaling execution story, not a fully de-risked unicorn
            body: >-
              The current public record is strong enough to justify continued diligence, but not strong enough to
              underwrite the May 2026 pricing or the September 2026 follow-on without cap-table, term-sheet,
              backlog-conversion, and field-reliability evidence that does not yet appear in this pool.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR009
              - CR010
              - CR011
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Underwriting call
        blocks:
          - type: paragraph
            body: >-
              Tianji's May 2026 round appears real and strategically important: the company and independent coverage
              align on RMB 1 billion of new capital, while third-party market-data vendors cluster the financing around
              roughly $1.4-1.5 billion post-money. That is enough to treat the latest round as a credible reference
              point, but not enough to treat it as a durable bargain. The same public package that supports the mark
              also leaves the crucial bridge from backlog and shipment claims to revenue, gross margin, cash burn, and
              repeat purchasing completely undisclosed. With real traction signals but an incomplete operating-value
              bridge, the price-sensitive call is track rather than buy, and entry discipline should stay at or below
              the last round until management opens the financial and term data room. 
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV009
              - CV012
              - CV013
      - number: '8.2'
        title: Price support and public mark quality
        blocks:
          - type: paragraph
            body: >-
              Public valuation support is directionally consistent but not clean. Multiples, Caplight, and InforCapital
              all anchor Tianji near $1.4-1.5 billion, while the company-led English page and 36Kr frame the round at
              nearly RMB 10 billion post-money. EqualOcean, however, prints the same RMB 1 billion financing at RMB 8
              billion post-investment, which is a meaningful gap rather than a rounding error. Caplight also reports no
              recent secondary market data and no public IPO plans, limiting any external read-through on present
              liquidity or price discovery. The result is a usable last-round mark but not a well-corroborated premium
              valuation case, especially because the only public term detail in the assigned pool is Multiples' note
              that the round used convertible preferred shares. 
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: Scenario framing
        blocks:
          - type: paragraph
            body: >-
              The upside case rests on commercialization conversion, not on storytelling about embodied-intelligence
              demand. Tianji has enough product and delivery evidence to justify continued diligence: public sources
              describe more than 2,000 dual-arm units delivered in 2025, more than 10,000 units of Q1 2026 orders, broad
              OEM coverage, and a legacy installed base across industrial customers. But those claims remain a demand
              proxy until they are translated into disclosed revenue, gross margin, backlog quality, and customer
              concentration data. Accordingly, the base case is a hold-the-mark scenario around the latest financing
              band, the bull case requires proof that backlog converts into quality revenue, and the bear case is driven
              by opaque terms or weaker-than-advertised conversion. 
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not yet support an exit-underwriting narrative beyond another private financing or a
              strategic outcome tied to Tianji's position in the humanoid-robot supply chain. Caplight's page explicitly
              says no public IPO plans have been announced and that no recent secondary market data is available, which
              makes the public market exit window speculative rather than evidenced. The minimum diligence package
              before paying into or above the latest round is straightforward: verify revenue and gross margin
              conversion from the claimed order book, inspect liquidation preference and anti-dilution terms, test
              repeat buying and concentration across the stated customer base, and confirm whether secondary liquidity
              exists at or above the headline mark. Absent those proofs, the thesis stays interesting but not yet
              underwritable at a premium. 
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Treat Tianji as a track candidate: the company looks real and strategically funded, but the price is ahead
              of the public financial disclosure needed for a buy call.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV013
          - type: callout
            title: Main underwriting gap
            body: >-
              The public record still lacks the operating bridge from orders and shipments to revenue quality, gross
              margin, and cash efficiency.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
          - type: callout
            title: What would move the view
            body: >-
              Verified revenue conversion, clean preference terms, and evidence of repeat customer quality would be the
              fastest path from track toward buy.
            calloutType: assumption
            claimRefs:
              - CV010
              - CV014
              - CV015
