  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed operating outputs
        blocks:
          - type: paragraph
            body: >-
              The retained sources describe Tianji as a B2B robotics infrastructure supplier rather than a software
              subscription business. Caplight classifies the company under “Hardware Sales, Services & Consulting,”
              while EqualOcean, Gasgoo, and 36Kr all describe a stack spanning force-controlled humanoid dual-arm
              systems, integrated joints, controllers, sensors, and broader automation solutions. That mix supports a
              revenue model centered on hardware product sales plus related systems/support work, but public disclosures
              stop short of showing how much revenue comes from each stream, whether services are recurring, or how
              revenue is recognized across equipment shipments, backlog, and any channel relationships.


              The traction metrics in public view are operational, not financial. Gasgoo reports more than 2,000
              force-control humanoid dual arms delivered to more than 100 clients within four months of 2025, while
              EqualOcean and 36Kr say Q1 2026 backlog exceeded 10,000 units and covered 45 global humanoid OEMs and
              embodied-intelligence unicorns. 36Kr also cites older company-wide operating figures of more than 800
              customers and more than 10,000 robots running online as of end-2022. Those disclosures indicate meaningful
              demand and installed-base breadth, but they do not reveal ASPs, acceptance timing, cancellation rates, or
              what portion of backlog converts into recognized revenue.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI009
              - CI010
              - CI011
              - CI012
