chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Public company materials and startup databases agree that Tianji is a Dongguan / Songshan Lake robotics
              company formed in 2015, but they describe the business through the lens of its current force-control niche
              rather than through audited financial scale. The official site positions Tianji as a robot and
              control-systems vendor spanning collaborative, articulated, SCARA, and force-controlled humanoid-arm
              products on its Tianji Fusion control system. That matters for the rest of the report: Tianji should be
              treated as an automation supplier evolving into embodied-intelligence infrastructure, not as a pure
              software company or a generic humanoid brand. Scale signals are directionally positive but dated. The
              official site still points to more than 800 customers and over 10,000 robot units online by end-2022,
              while later 2025-2026 coverage shifts toward dual-arm deliveries and order backlog instead of refreshed
              enterprise- wide revenue, customer, or headcount disclosure.
