      - number: '1.3'
        title: Funding history and valuation range
        blocks:
          - type: paragraph
            body: >-
              The clearest current financing fact is the May 2026 Series B/B+ raise: official and independent sources
              align on RMB1 billion and broadly agree on the investor set led by Hillhouse / GL Ventures and Meituan
              Strategic Investment, with Tencent and other investors participating. The valuation signal is less
              precise. EqualOcean reports an RMB8 billion post-investment value, while 36Kr, KuCoin, and Tianji's own
              news page frame the same event as nearly RMB10 billion. Private-market databases translate the round into
              roughly $1.4-$1.5 billion, but Caplight explicitly says no recent secondary-market data is available and
              its number is estimated from funding round information. That makes the round real, but it leaves current
              price discovery and exact post-money interpretation weaker than the unicorn headline.
