              - CP014
      - number: '3.3'
        title: Durability depends on scale delivery and supply-chain embedment more than software lock-in
        blocks:
          - type: paragraph
            body: >-
              The strongest moat evidence in this pool is Tianji's combination of force-control performance claims and
              visible shipment/backlog scale into humanoid OEM supply chains. Independent reporting says the company
              delivered more than 2,000 force-controlled dual-arm units within four months in 2025 and entered 2026 with
              more than 10,000 units of backlog covering 45 OEM or embodied-AI customers; those are more concrete
              deployment markers than the prototype-stage descriptions attached to many adjacent embodied-AI entrants.
              But moat durability is not yet proven as software or channel lock-in. The same sources emphasize new
              funding for R&D, mass production, and global sales coverage, implying that execution speed and service
              coverage are still decisive. KuCoin's syndicated flash also situates Tianji beside other heavily financed
              embodied-AI names such as Unitree, Galaxy General, Looj Robotics, and Zidongbian Robotics, and EqualOcean
              says Tianji is incubating humanoid robot products and brands of its own. That creates a plausible future
              in which today's customers or adjacent OEMs become more direct competitors, while buyers still retain the
              fallback of conventional automation or in-house builds when Tianji's embodied-AI premium is not clearly
              priced or benchmarked.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
