      - number: '1.2'
        title: Leadership, ownership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public reporting points to a concentrated control picture rather than a fully transparent operating bench.
              KuCoin and 36Kr identify Chen Xi as the legal representative or chairman and place her alongside Changying
              Precision as a meaningful owner, while KuCoin also links her to Changying founder Chen Qixing through
              family ties. That combination suggests industrial parent influence, founder-linked governance, and a high
              degree of key-person dependence around the current transition from general industrial automation into
              force-controlled embodied-intelligence products. The limitation is that the public source set does not
              enumerate a current board roster or a broader executive bench, so investors can see the control nodes but
              not yet the full governance mechanics behind them.
            claimRefs:
              - CO012
              - CO016
