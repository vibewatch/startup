      - number: '3.2'
        title: Capabilities favor force-control execution, but public packaging evidence is narrow
        blocks:
          - type: paragraph
            body: >-
              The most defensible differentiation in the retained pool is technical and operational rather than
              commercial. Multiple independent sources repeat Tianji's claims around force-controlled dual-arm delivery
              volume, while Robotopian shows a public Marvin Pro research platform with ROS 2 workflows, teleoperation,
              multimodal data collection, and quote-based academic bulk pricing. Those facts suggest Tianji can compete
              for both OEM subsystem budgets and lab/developer tooling budgets. However, public packaging evidence
              remains thin: the assigned sources do not expose list prices for Tianji's core OEM dual-arm supply or
              broader industrial arms, and they do not provide direct feature or pricing pages for Caplight's named peer
              set. As a result, Tianji's apparent product edge is supported better than its commercial edge, and matrix
              cells around pricing transparency, ecosystem lock-in, and direct like-for-like benchmarks remain
              materially incomplete.
