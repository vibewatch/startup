  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence places Tianji in embodied-AI manipulation infrastructure rather than in generic AI
              software or a single finished-robot SKU. Current commercial scope includes industrial collaborative
              robots, force-controlled humanoid dual arms, joint and control modules, and related automation solutions,
              while newer 2026 launches start to extend the company into wheeled full-humanoid platforms and research
              tooling. That means the included spend today is closest to factory automation capex, humanoid OEM
              subsystem procurement, and research-platform equipment budgets. The sources do not support treating
              general-purpose AI model spend, unrelated humanoid locomotion stacks, or the entire robotics software
              toolchain as Tianji's current market.
