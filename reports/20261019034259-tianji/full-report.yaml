      - number: '2.2'
        title: Sizing lenses are directional, not a clean TAM/SAM/SOM stack
        blocks:
          - type: paragraph
            body: >-
              The pool provides two useful top-down lenses and several stronger bottom-up demand proxies, but they are
              not directly comparable. 36Kr cites IDC for a roughly $30 billion 2026 global intelligent-robot-hardware
              market and cites China Development Report 2025 for a CNY400 billion China embodied-intelligence market by
              2030, while multiple outlets relay Tianji-specific shipment and backlog signals that are much closer to
              the company's real commercial traction. Those bottom-up signals matter because they show actual buyer
              pull, yet they cannot by themselves define Tianji's total addressable market. For diligence, the practical
              read is that macro market tailwinds are large, but underwriting should rely more heavily on observable
              order density, customer breadth, and payload/application breadth than on any single headline TAM figure.
            claimRefs:
