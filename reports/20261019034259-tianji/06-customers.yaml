callouts:
  - calloutType: strength
    title: Adoption proof is better than a logo page, even if still company-led
    body: >-
      Tianji has public adoption metrics that go beyond pure branding: legacy installed-base data,
      a 2025 shipment milestone, a 2026 OEM coverage claim, and one named Zhongke Huiling order.
      That is materially stronger than a page of unlabeled customer logos, even though the largest
      metrics still come from company-linked disclosures echoed by outside media.
    claimRefs: [CU004, CU005, CU007, CU010, CU014]
  - calloutType: risk
    title: Durability and concentration remain unproven
    body: >-
      Nothing in the assigned public pool establishes renewal economics, net revenue retention,
      churn, customer concentration, or backlog conversion. The chapter can validate demand signals
      and customer breadth claims, but it cannot yet validate whether that breadth translates into
      durable recurring economics or a diversified revenue base.
    claimRefs: [CU012, CU013]
