schemaVersion: "report-v2"
artifact: customers
slug: tianji
runDate: 2026-10-19
company:
  name: Tianji
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence suggests Tianji already has a meaningful legacy industrial installed
    base and is now pushing force-controlled humanoid arms into a newer OEM and research buyer
    set, but most of the strongest 2026 traction metrics still come from company-linked
    disclosures repeated by third parties. Adoption proof is better than a logo wall—there is a
    named Zhongke Huiling order, a 2025 dual-arm shipment claim, and a 2026 OEM coverage claim—but
    durability, renewal, and concentration remain materially under-disclosed.
sections:
  - id: installed-base-and-segmentation
    title: Installed base spans legacy factory accounts and newer humanoid buyers
    body: >-
      The public customer picture is bifurcated. Tianji's owned web surfaces still present the
      company as a broad industrial robotics supplier across 3C electronics, footwear and apparel,
      construction machinery, and automotive manufacturing, while third-party profiles frame the
      business as a B2B hardware-and-services supplier rather than a pure software or research
      startup. Independent retellings of company data add that Tianji had more than 800 customers
      and over 10,000 robots online by the end of 2022, which implies the current humanoid
      narrative is building on a legacy industrial base rather than starting from zero.
    claimRefs: [CU001, CU002, CU003, CU004, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: humanoid-adoption-proof
    title: Humanoid adoption claims are stronger on volume and cohort reach than on named accounts
    body: >-
      Tianji has more concrete proof of adoption than many private robotics companies, but the
      proof is uneven. The strongest public datapoint is a company-originated claim, echoed by
      36Kr, that Tianji delivered more than 2,000 force-controlled humanoid dual-arm units within
      four months during 2025. Third-party coverage also repeats that first-quarter 2026 on-hand
      orders exceeded 10,000 units and that the customer set covered 45 global humanoid robot OEMs
      and embodied-intelligence unicorn enterprises. Those figures point to real pipeline depth,
      yet outside one named Zhongke Huiling partnership and order, the public record still exposes
      far more cohort-level proof than individually referenceable production deployments.
    claimRefs: [CU005, CU006, CU007, CU010, CU014]
    tableRefs: [TU002, TU003]
  - id: expansion-and-customer-enablement
    title: Expansion appears to rely on customer enablement as much as on hardware specs
    body: >-
      The adoption loop Tianji is describing is not just sell-a-robot and leave. Official support
      pages advertise phone, remote, and on-site fault support, spare-parts planning, software
      guidance, and training delivered by robotics engineers, while a third-party Marvin Pro
      product listing adds product-level warranty terms and academic discounts for universities and
      research institutions. Separately, 36Kr and EqualOcean both say Tianji plans to expand
      localized sales and technical-support teams overseas, especially in North America, on top of
      its existing OEM customer coverage. That combination suggests land-and-expand ambitions, but
      the public sources do not quantify attach rates, renewal behavior, or service revenue.
    claimRefs: [CU008, CU009]
    tableRefs: []
  - id: durability-and-concentration
    title: Durability and concentration are still the weakest parts of the customer case
    body: >-
      The biggest diligence gap is not whether Tianji has customer logos or even whether it ships
      product; it is whether the installed base renews, expands, and diversifies economically. The
      assigned pool does not disclose NRR, GRR, churn, contract duration, backlog conversion,
      top-customer exposure, channel dependence, or backlog aging by product line. Even the lone
      explicitly risk-framed third-party artifact retained for this chapter only surfaces as an
      aVenture title rather than as usable underlying analysis. That leaves the chapter able to say
      Tianji is commercially active, but not able to underwrite customer durability with the same
      confidence as adoption momentum.
    claimRefs: [CU012, CU013]
