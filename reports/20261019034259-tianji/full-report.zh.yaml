      - number: '1.2'
        title: 领导层、股权与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开报道呈现的是较为集中的控制格局，而不是完全透明的经营团队。KuCoin 和 36Kr 将 Chen Xi 认定为法定代表人或董事长，并将她与重要股东 Changying Precision
              联系在一起；KuCoin 还称她与 Changying 创始人 Chen Qixing
              存在家族关系。这一组合说明，工业母公司影响、创始人关联治理和关键人物依赖，正共同作用于公司从通用工业自动化转向力控具身智能产品的阶段。局限在于，公开资料没有列出当前完整董事会或更广泛的管理层名单，因此投资人能看见控制节点，却尚未看清背后的完整治理机制。
            claimRefs:
              - CO012
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO012
              - CO016
      - number: '1.3'
        title: 融资历史与估值区间
        blocks:
          - type: paragraph
            body: >-
              当前最明确的融资事实是 2026 年 5 月的 B/B+ 轮：官方与独立来源都确认融资额为人民币十亿元，投资人则大体一致指向 Hillhouse / GL Ventures 与 Meituan Strategic
              Investment 领投，Tencent 等其他投资者参与。估值信号没有这么精确。EqualOcean 报道投后估值为人民币八十亿元，而 36Kr、KuCoin 和 Tianji
              自己的新闻页面都将同一事件描述为接近人民币一百亿元。私募市场数据库将这轮融资换算为约 $1.4-$1.5 billion，但 Caplight
              明确表示近期没有二级市场数据，其数字是根据融资轮信息估算的。因此，这轮融资本身可信，但当前价格发现和确切投后估值的解释力，仍弱于独角兽光环。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO010
              - CO011
