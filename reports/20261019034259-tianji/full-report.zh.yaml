      - number: '2.2'
        title: 规模测算只能提供方向，尚未形成干净的 TAM/SAM/SOM 框架
        blocks:
          - type: paragraph
            body: >-
              现有材料提供了两个有用的自上而下视角，以及几个更有力的自下而上需求代理指标，但它们不能直接比较。36Kr 引用 IDC，称 2026 年全球智能机器人硬件市场约为 $30 billion；同时引用 China
              Development Report 2025，称到 2030 年中国具身智能市场将达到 4,000 亿元人民币。多家媒体还转述了更接近 Tianji
              实际商业牵引力的出货和订单积压信号。这些自下而上的信号之所以重要，是因为它们显示了真实买方需求；但它们本身不能定义 Tianji 的总可用市场。尽调时更实际的读法是：             
              宏观市场顺风很大，但投资判断应更多依赖可观察的订单密度、客户广度和负载 / 应用广度，而不是任何一个醒目 TAM 数字。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
