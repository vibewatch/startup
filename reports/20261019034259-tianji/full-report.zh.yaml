  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与已披露经营产出
        blocks:
          - type: paragraph
            body: >-
              纳入的来源将 Tianji 描述为 B2B 机器人基础设施供应商，而不是软件订阅业务。Caplight 将公司归入“硬件销售、服务与咨询”，EqualOcean、Gasgoo 和 36Kr
              则都描述了一个覆盖力控人形双臂系统、集成关节、控制器、传感器和更广泛自动化解决方案的产品栈。这种组合支持一种以硬件产品销售加相关系统 /
              支持工作为核心的收入模式，但公开披露没有说明各条收入流的占比、服务是否具有经常性，或设备出货、订单积压和任何渠道关系之间如何确认收入。


              公开可见的增长指标是运营指标，而非财务指标。Gasgoo 报道称，Tianji 在 2025 年四个月内向超过 100 家客户交付了超过 2,000 台力控人形双臂；EqualOcean 和 36Kr
              则称，2026 年第一季度订单积压超过 10,000 台，覆盖 45 家全球人形机器人 OEM 和具身智能独角兽。36Kr 还引用了公司较早的整体运营数据：截至 2022 年底，客户超过 800
              家，在线运行机器人超过 10,000 台。这些披露说明需求和装机基础具有一定规模，但无法说明 ASP、验收时间、取消率，或订单积压中有多少最终会转化为已确认收入。
