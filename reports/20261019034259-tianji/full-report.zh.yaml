  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 公开观察到的估值标记
        - 最新一轮仍是唯一硬价格锚点，外部数据大多落在 $1.4-1.5 billion 附近。
        - 将 2026 年 5 月的估值标记视为参考价值，而不是上涨空间的证明。
        - 公开来源对确切投后金额仍有分歧，也没有展示经营转化。
        - 当前基线。
      - - 乐观情景
        - 据称的积压订单转化为已披露收入和毛利率，同时条款干净、复购客户验证需求叙事。
        - 只有经营证据填补当前披露缺口后，最新一轮之上的溢价才有可能成立。
        - 订单未必转化为高质量收入，优先权安排也可能吞噬上行空间。
        - 需要新的私募尽调，而不是从公开信息外推。
      - - 基准情景
        - 融资估值标记维持，工业客户需求势头仍可信，且没有出现重大负面尽调意外。
        - 在基本面得到展示前，估值大致围绕最新融资区间，重估空间有限。
        - 公司可能已经合理定价，安全边际很小。
        - 以当前证据最能支持。
      - - 悲观情景
        - 收入转化令人失望、优先权负担过重，或独立估值标记持续不一致的同时流动性维持低位。
        - 由于当前公开证据更像由市场热度驱动而非基本面驱动，最新一轮估值需要打折。
        - 头条式出货量说法可能掩盖更低的利润率、客户集中度或积压订单质量。
        - 由尽调失败或下一轮融资走弱触发。
    notes: 情景区间采用定性表达，因为指定的公开来源没有提供足够财务细节，无法建立有依据的模型化估值。
    claimRefs:
      - CV003
