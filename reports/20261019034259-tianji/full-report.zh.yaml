            title: 工业机器人底色，比泛化的人形机器人品牌更重要
            body: 纳入的证据一致将 Tianji 描述为一家从工业机器人起步、如今试图掌握具身智能力控层的公司。与其简单称作人形机器人初创公司，这个身份定位更准确。
