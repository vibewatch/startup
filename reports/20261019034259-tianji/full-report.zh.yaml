chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与经营范围
        blocks:
          - type: paragraph
            body: >-
              公司公开材料和创业数据库都确认，Tianji 是一家位于东莞 / 松山湖、成立于 2015 年的机器人公司，但它们更多从当前力控业务切入描述公司，而不是提供经审计的财务规模。官网将 Tianji
              定位为机器人及控制系统供应商，产品覆盖协作、关节、SCARA 和力控人形机械臂，并统一运行在 Tianji Fusion 控制系统上。这一点决定了后文的分析框架：Tianji
              应被视为一家正向具身智能基础设施演进的自动化供应商，而不是纯软件公司或泛化的人形机器人品牌。规模信号总体向好，但时间较旧。官网仍显示，截至 2022 年底，公司拥有超过 800 家客户和超过 10,000
              台在线机器人；而 2025—2026 年的后续报道转向双臂出货和订单积压，没有更新企业整体收入、客户数或员工数。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
              - CO015
