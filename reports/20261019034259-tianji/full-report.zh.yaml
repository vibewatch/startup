  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入的支出
        blocks:
          - type: paragraph
            body: >-
              纳入的证据将 Tianji 放在具身 AI 操作基础设施，而不是通用 AI 软件或单一成品机器人 SKU 中。当前商业范围包括工业协作机器人、力控人形双臂、关节与控制模块及相关自动化解决方案；2026
              年的新产品也开始将公司延伸到轮式全身人形平台和研究工具。因此，当前应纳入的支出最接近工厂自动化资本开支、人形机器人 OEM 子系统采购和研究平台设备预算。现有来源不支持把通用 AI
              模型支出、无关的人形机器人运动栈或整个机器人软件工具链都算作 Tianji 的当前市场。
            claimRefs:
              - CM001
