        title: 里程碑与待补尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管重要尽调字段仍未公开，现有来源勾勒出一条连贯的经营轨迹。官方新闻记录了从 2024 年 4 月推出力控人形机械臂，到 2025 年据称大规模交付双臂系统，再到 2025 年 9 月与 Zhongke
              Huiling 建立战略合作、2026 年 4 月参加展示和获奖活动，最后到 2026 年 5 月融资的演进过程。这条路径支持一个判断：Tianji
              已从传统工业机器人走向更受关注的具身智能位置。与此同时，当前公开材料仍未披露独立口径的 2026
              年收入、毛利率、烧钱速度、现金跑道、详细轮次条款或更完整的董事会名单，因此后续章节可以沿用这里的身份和里程碑基础，但财务与治理结论仍须以进一步尽调为前提。
