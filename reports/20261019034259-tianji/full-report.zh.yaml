      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最明确的财务数据点是 2026 年 5 月的 B/B+ 轮融资。EqualOcean 和 Gasgoo 都报告融资额为 RMB 1 billion，资金将用于研发、大规模量产和全球销售网络。这个资金用途组合说明
              Tianji
              仍需要外部资本来扩大制造能力和海外商业覆盖；公开材料并未把公司呈现为能够自我造血的现金机器。这轮融资可能足以支撑当前扩张阶段，但公开证据没有披露现金余额、月度烧钱速度、债务、契约负担或现金跑道，因此外部投资人无法独立检验这轮钱能支撑多久。


              第三方摘要对同一融资事件的描述也存在差异。InforCapital 将 2026 年 5 月融资描述为 $138 million、估值 $1.4 billion；EmbodiedGlobal 将其换算为约
              $140 million、接近 RMB 10 billion；Caplight 则估计累计融资 $152.58 million、估值 $1.5
              billion，同时表示近期没有二级市场数据。这一差异不足以否定独角兽地位，但确实说明当前市场定价是从稀疏的私募市场数据点推导出来的，而不是来自透明财务披露。根据现有证据，下一轮融资触发点更可能与制造执行和收入转化有关，而不是任何公开可审计的盈利里程碑。
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI008
              - CI012
      - number: '4.4'
        title: 结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Tianji
              像一家快速扩张的机器人硬件供应商，拥有可信的需求信号和资金明确的近期扩张计划；但公开记录尚不足以支持对收入质量或利润率路径作出干净的投资判断。乐观情景是客户、出货和订单积压都指向真实的商业牵引力，公司也在用新资金推进生产工业化和全球分销。弱点在于每一条关键财务桥梁——ASP
              到收入、收入到毛利、毛利到烧钱速度、烧钱速度到现金跑道——都尚未披露。


              尽调优先索取项包括各产品线的历史定价、按收入流拆分的实际收入、硬件与服务的毛利率、订单积压账龄和取消率、营运资金与资本开支要求，以及 2026
              年融资后的现金和现金跑道情况。在这些材料拿到之前，最有证据支撑的结论是：Tianji 的运营势头真实存在，但其估值仍跑在公开财务证据之前。
            claimRefs:
              - CI003
              - CI004
              - CI008
              - CI011
              - CI012
