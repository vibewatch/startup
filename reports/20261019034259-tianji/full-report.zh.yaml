              - CP012
              - CP013
              - CP014
      - number: '3.2'
        title: 能力优势偏向力控执行，但公开产品包装证据有限
        blocks:
          - type: paragraph
            body: >-
              现有材料中最站得住脚的差异化来自技术和运营，而不是商业表现。多家独立来源重复 Tianji 关于力控双臂交付量的说法；Robotopian 则展示了公开的 Marvin Pro 研究平台，支持 ROS 2
              工作流、远程操作、多模态数据采集和按报价定价的学术批量采购。这些事实说明 Tianji 既可以争取 OEM 子系统预算，也可以争取实验室 / 开发者工具预算。但公开的产品包装证据仍然薄弱：纳入的来源没有披露
              Tianji 核心 OEM 双臂供应或更广泛工业机械臂的目录价格，也没有提供 Caplight 所列同行的直接功能或价格页面。因此，Tianji
              的产品优势比商业优势更有证据支撑；关于价格透明度、生态锁定和直接同类比较的矩阵单元，仍存在实质性缺口。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
