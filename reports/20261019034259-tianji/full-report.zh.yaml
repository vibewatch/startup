      - number: '4.2'
        title: 单位经济模型与成本结构
        blocks:
          - type: paragraph
            body: >-
              Tianji 的公开材料在工程产出上远强于单位经济模型。公司及转载报道持续强调力控性能、量产能力、自动化率提升、首件良率和全球销售扩张，这说明其成本结构更可能由硬件
              BOM、制造良率、人工和现场支持成本主导，而不是低边际成本的软件交付。但纳入的公开来源均未披露实际定价、毛利率、保修负担、渠道分成、销售周期、获客成本、回本周期或营运资金强度。


              这一遗漏很重要，因为 Tianji 报告的订单和出货量不足以推断收入质量。超过 10,000
              台的订单积压不等于已确认收入；没有公开目录价格的硬件业务，在展示出货、付费生产部署、试点折扣和全毛利经常性订单之间，可能存在很大差异。因此，公开证据只能支持代理分析：Tianji
              似乎正在扩大一个资本密集型硬件平台，并承担可观的生产和支持要求，但关键投资判断输入仍属私有信息。
