        title: 运营、合作伙伴与客户执行风险
        blocks:
          - type: paragraph
            body: >-
              从运营角度看，Tianji 势头明显，但要证明这种势头持久，路径仍很窄。独立来源和公司关联来源反复据称四个月交付超过 2,000 台双臂，以及截至 2026 年第一季度超过 10,000
              台订单；但同一批证据也明确显示，管理层仍在投入新资金提升自动化、改善首件良率，并在海外搭建本地化支持团队。这与一家可能已经找到产品市场牵引力、但尚未公开证明服务、可靠性或订单积压转化指标成熟的公司相符。客户和合作伙伴集中度进一步放大风险：已披露订单积压关联
              45 家全球人形机器人 OEM 和具身 AI 公司，本次审阅的产品页面显示硬件保修覆盖有限，公开证据仍未披露取消率、头部客户暴露、续购行为或保修索赔表现。即便产品需求真实存在，剩余执行风险仍然偏高。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
