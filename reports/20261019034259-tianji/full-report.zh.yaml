      - number: '3.3'
        title: 护城河更依赖规模交付和嵌入供应链，而不是软件锁定
        blocks:
          - type: paragraph
            body: >-
              现有材料中最强的护城河证据，是 Tianji 据称的力控性能与进入人形机器人 OEM 供应链的可见出货 / 订单积压规模相结合。独立报道显示，公司在 2025 年四个月内交付了超过 2,000
              台力控双臂，并以覆盖 45 家 OEM 或具身 AI 客户的超过 10,000 台订单积压进入 2026 年；相比许多仍停留在原型阶段的相邻具身 AI
              参与者，这些是更具体的部署信号。但护城河能否通过软件或渠道锁定长期维持，尚未得到证明。同一批来源强调，新资金将投入研发、大规模生产和全球销售覆盖，因此执行速度和服务覆盖仍是决定性因素。KuCoin 的转载快讯还将
              Tianji 与 Unitree、Galaxy General、Looj Robotics 和 Zidongbian Robotics 等其他资金充足的具身 AI 公司并列；EqualOcean 则称
              Tianji 正在孵化自有的人形机器人产品和品牌。这可能导致未来的客户或相邻 OEM 变成更直接的竞争对手；而当 Tianji 的具身 AI 溢价没有清晰定价或可比基准时，买方仍可退回传统自动化或内部自建方案。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
