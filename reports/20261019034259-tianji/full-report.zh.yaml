  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示出分层产品栈：工业及人形机器人平台、力控部件，以及面向开发者的集成接口。
    data:
      layers:
        - label: 客户 / 操作员工作流
          detail: 公开证据显示，该产品栈主要服务三类工作流：工厂自动化、人形机器人 OEM 集成，以及研究 / 遥操作。
          items:
            - label: 工业自动化单元
              note: Legacy SCARA, six-axis, and collaborative deployments.
            - label: 人形机器人 OEM 集成
              note: Dual-arm subsystem sourcing for complete-machine makers.
            - label: 研究与遥操作
              note: Embodied-AI experiments, data capture, and robot learning.
        - label: 机器人平台
          detail: Tianji 的公开产品证据覆盖传统工业机器人及更新的力控双臂平台，而非单一人形机器人 SKU。
          items:
            - label: 小负载和中负载工业机器人
              note: SCARA and six-axis portfolio.
            - label: 协作机器人
              note: Flexible automation line.
            - label: 力控人形双臂
              note: Commercial flagship in 2025-26 reporting.
            - label: Marvin / Marvin Pro
              note: Fixed-base research platform with optional grippers.
        - label: 控制与感知核心
          modules:
            - label: Tianji Fusion Control System
              note: Named control layer across robot portfolio.
            - label: MEMS 关节扭矩传感器
              note: Core force-control differentiator.
            - label: 集成式关节模块
              note: Lightweight force-controlled joint packaging.
            - label: 运动控制算法
              note: Cited scaling focus for continued R&D.
        - label: 开发者 / 部署接口
          outputs:
            - label: URDF-compatible asset naming
              note: EmbodiChain exposes original ACD naming.
            - label: FK/IK + simulation config
              note: Community preset includes simulation-ready configuration.
            - label: ROS 2 communications
              note: Robotopian cites flexible integration workflows.
            - label: HDF5 / RLDS / MCAP data formats
              note: Supports data capture for robot-learning pipelines.
        - label: 制造规模化
          detail: 独立报道称，Tianji 正将资金投向更大规模生产、生产线自动化和一次通过率。
          items:
            - label: 生产自动化
              note: A stated use of new financing rather than a verified current capability.
            - label: 一次通过率提升
              note: A named scale-up priority without a disclosed baseline or target.
        - label: 商业支持铺设
          detail: 独立报道称，Tianji 正在扩建全球销售和技术支持网络，同时推进产品规模化。
          outputs:
            - label: Localized sales coverage
              note: Expansion objective for overseas markets.
            - label: Technical support capacity
              note: Public service-level and staffing metrics remain unavailable.
    approximationNotes: 该产品栈将多个公开产品面压缩成一个分层运营视图，是分析师综合判断，不是公司制作的架构图。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE007
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，客户旅程从传统工厂账户起步，并延伸至人形机器人 OEM、研究和支持驱动的扩张循环。
    data:
      items:
        - label: 传统工厂覆盖
          actor: 工厂和制造团队
          stage: 装机基数证明
          touchpoints:
            - 官方应用案例列出 3C 电子、鞋服、工程机械和汽车制造。
            - KuCoin 称，部署领域还延伸至新能源、医疗、家电和食品。
            - 36Kr 引述官方数据称，截至 2022 年末，客户超过 800 家、线上运行机器人超过 10,000 台。
        - label: B2B 采购推进
          actor: 硬件买方和技术采购团队
          stage: 商业模式
          touchpoints:
            - Caplight 将客户画像描述为硬件销售、服务和咨询。
            - InforCapital 将 Tianji 定义为向工业及具身 AI 客户销售的机器人初创公司。
        - label: 人形机器人生产验证
          actor: OEM 工程与项目团队
          stage: 采用加速
          touchpoints:
            - 官方新闻及 36Kr 均重复提到，2025 年四个月内交付超过 2,000 台力控人形双臂设备。
            - EqualOcean 和 EmbodiedGlobal 均重复提到 2026 年第一季度超过 10,000 台订单。
        - label: 客户队列扩张
          actor: 全球人形机器人 OEM 和独角兽客户
          stage: 进入供应链
          touchpoints:
            - 36Kr、EqualOcean 和 EmbodiedGlobal 均引用 45 家全球 OEM / 具身智能客户。
            - 具名的生产客户参考仍少于队列规模的说法。
        - label: 研究与实验室渠道
          actor: 高校和机器人研究人员
          stage: 开发新买方
          touchpoints:
            - Robotopian 将 Marvin Pro 定位为用于具身 AI 研究、遥操作和数据采集的产品。
            - 该页面还宣传面向高校和研究机构的学术折扣。
        - label: 支持驱动的扩张循环
          actor: 操作员、维护团队和客户成功人员
          stage: 售后赋能
          touchpoints:
            - Tianji 服务页面宣传电话、远程和现场支持、备件、软件帮助及培训。
            - 36Kr 和 EqualOcean 称，Tianji 计划建设本地化的海外销售和技术支持团队。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU007
      - CU008
      - CU009
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据最集中在估值 / 披露、制造规模化、客户集中度和海外支持准备度。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
        - label: 剩余暴露
      rows:
        - label: 估值 / 披露不透明
          note: 公开估值和所有权表述相互冲突，且没有披露轮次条款。
          values:
            - label: 高
              tone: high
              note: RMB 8 billion 至接近 RMB 10 billion 的公开估值标记仍相互冲突。
            - label: 高
              tone: critical
              note: 直接影响入场价格和下行保护分析。
            - label: 低
              tone: medium
              note: 缓释措施主要仍是计划中的尽调，而非已披露控制措施。
            - label: 高
              tone: high
              note: 在文件核对融资和股权结构表之前，剩余风险维持高位。
        - label: 制造规模化
          note: 超过 10,000 台的订单说法与持续进行的自动化和良率建设并存。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 新资金将投向自动化和一次通过率。
            - label: 高
              tone: high
        - label: 客户 / OEM 集中度
          note: 积压订单以 45 家全球人形机器人 OEM 和具身 AI 客户为框架。
          values:
            - label: 中高
              tone: high
            - label: 高
              tone: high
            - label: 中低
              tone: medium
              note: 公开证据尚未显示客户多元化或复购深度。
            - label: 高
              tone: high
        - label: 海外支持 / 合规准备度
          note: 公开来源更清楚地展示了全球支持扩张意图，而非已完成的合规建设。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: medium
              note: 支持团队仍在规划中，此处尚未披露准备度证据。
            - label: 中高
              tone: high
        - label: 所有权 / 治理清晰度
          note: 公开来源对 Everwin / Changying 是否仍持有约 27% 股权，或是否仍为全资持有，存在冲突。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: medium
              note: 解决问题取决于私有股权结构表和治理文件。
            - label: 高
              tone: high
        - label: 可靠性 / 支持证明
          note: 可以看到保修和支持渠道，但没有公开故障率或正常运行时间证据。
          values:
            - label: 中
              tone: medium
            - label: 中高
              tone: high
            - label: 低
              tone: medium
            - label: 中高
              tone: high
    claimRefs:
      - CR002
      - CR005
      - CR007
      - CR011
      - CR012
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据支持最新一轮估值标记真实存在，但不足以支持溢价投资判断。
    data:
      nodes:
        - id: round
          label: 真实的 2026 年 5 月融资估值标记
          note: 官方及独立报道一致称 RMB 1 billion 融资已完成。
        - id: traction
          label: 存在需求信号
          note: 公开来源称 2025 年交付超过 2,000 台设备，2026 年第一季度订单超过 10,000 台。
        - id: cluster
          label: 外部估值标记集中在 $1.4-1.5B 附近
          note: Multiples、Caplight 和 InforCapital 大致落在同一区间。
        - id: conflict
          label: 估值标记并不完全干净
          note: EqualOcean 报道 RMB 8 billion，Caplight 称近期没有老股交易数据。
        - id: gap
          label: 财务桥接缺失
          note: 指定来源仍未披露收入、利润率、烧钱速度和完整融资条款。
        - id: decision
          label: 建议 = 观察 / 不支付溢价
          note: 只有私人财务和条款尽调填补缺口后，才纳入投资判断。
    claimRefs:
      - CV001
