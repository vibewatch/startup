figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开证据显示，公司源自 2015 年的工业机器人业务，2024-2026 年加速布局具身智能，并于 2026 年 5 月完成一轮融资，但核心披露缺口仍未填补。
    data:
      items:
        - date: 2015-05
          label: 在东莞 / 松山湖成立
          detail: 公司及数据库来源均将 Tianji 的成立时间和地点指向 2015 年东莞。
          tone: neutral
        - year: '2021'
          label: 从长盈自动化体系更名并重新定位
          detail: EqualOcean 称，公司在作为内部自动化部门运营后，于 2021 年更名为 Guangdong Tianji Intelligent System Co., Ltd.。
          tone: neutral
        - period: End 2022
          label: 据称拥有 800 多家客户、线上运行 10,000 多台机器人
          detail: 官方关于页面给出了最后一个明确标注日期的全公司客户数和装机量快照。
          tone: positive
        - period: April 2024
          label: 推出力控人形机械臂
          detail: 官方新闻页面称，Tianji 于 2024 年 4 月推出全球首款力控人形机械臂。
          tone: positive
        - year: '2025'
          label: 据称实现双臂系统批量交付
          detail: 官方及独立的 2026 年报道称，Tianji 在 2025 年四个月内交付了超过 2,000 台力控人形双臂设备。
          tone: positive
        - date: '2025-09-22'
          label: 与中科慧灵签署战略合作
