              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.3'
        title: 采用驱动、买方动作与主要约束
        blocks:
          - type: paragraph
            body: >-
              采用需求似乎被一个具体瓶颈拉动：人形机器人和具身 AI 项目需要可靠的力控操作硬件，而不只是更强的认知能力。因此，买方包括工厂自动化团队、人形机器人 OEM
              平台团队，以及希望直接获得远程操作和数据采集系统的研究实验室。与此同时，来源反复将生产一致性、良率、稳定性和本地支持列为从原型项目走向重复部署的真正门槛。Tianji 在 2026 年向 Gento
              全身人形产品扩张，可能扩大可触达市场，但也会让执行更复杂，因为公司会更接近平台和 OEM 暴露，而不再只是子系统供应商。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.4'
        title: 展品
        blocks:
          - type: callout
            title: 需求代理指标强于公开 TAM 计算
            body: >-
              多家媒体重复了 Tianji 据称的业绩：2025 年双臂交付超过 2,000 台，2026 年第一季度订单超过 10,000 台，覆盖 45 家 OEM
              客户。对近期尽调而言，这比任何一个自上而下的市场估算都更有决策价值。
            calloutType: strength
            claimRefs:
              - CM011
              - CM012
              - CM015
          - type: callout
            title: 市场定义比支出定义更宽
            body: 公开规模测算混合了全球机器人硬件预测、中国具身智能政策目标和 Tianji 特有的订单积压信号，因此估值工作不应把任何一个公开数字直接视为公司的 SAM。
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争边界：面向人形机器人 OEM 的供应商，但仍以工业机器人同行为基准
        blocks:
          - type: paragraph
            body: >-
              纳入的证据将 Tianji 放在两个相互重叠的竞争场域。独立资料将其描述为一家 B2B 机器人公司，覆盖工业机器人、协作双臂机器人、自动化解决方案和物理 AI
              开发工具；官方页面则仍在销售关节机器人、协作机器人、控制器、软件和工厂应用。因此，Tianji
              的竞争对手不只是其他力控人形机械臂供应商；买方也可以通过传统工业自动化栈、内部集成团队或相邻研究平台解决类似任务。Caplight 以嵌入相似度筛选出的最接近可比公司是 Titanium Tiger
              Robotics、Flexiv 和 Huayan Robotics，这说明外部观察者仍将 Tianji 与工业及协作机器人同行比较，而不是只把它看作全栈人形机器人品牌。与此同时，36Kr、Embodied
              Global 和 ManbotAI 都将 Tianji 当前的需求描述为向人形机器人 OEM 和具身 AI 公司供货，因此它真正的竞争场域处在零部件、子系统和更广泛自动化供应商的交界处。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
