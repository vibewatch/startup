      - 当前证据
      - 哪些信息会改变判断
    rows:
      - - 投资逻辑：融资定价真实
        - 官方及独立报道一致显示，2026 年 5 月融资额为 RMB 1 billion；外部追踪数据大多落在约 $1.4-1.5 billion。
        - 更低质量的轮次结构或未披露的投资人保护条款，会削弱最新估值的参考价值。
      - - 投资逻辑：已有商业化信号
        - 公开来源称，2025 年已交付超过 2,000 台双臂设备，2026 年第一季度订单超过 10,000 台，且 OEM / 客户覆盖面广。
        - 经验证的收入、毛利率和复购订单披露，才能把这些需求信号转化为可纳入投资判断的经营证据。
      - - 反向逻辑：财务桥接缺失
        - 指定的估值来源没有披露独立口径的收入、毛利率、烧钱速度、现金跑道、续约、积压订单账龄或实际 ASP。
        - 经审计或管理层提供的 KPI 披露，才可能支持按经营价值而非表面热度来评估。
      - - 反向逻辑：公开估值标记不一致
        - EqualOcean 报道 RMB 8 billion，而其他来源大多落在 RMB 10 billion / $1.4-1.5 billion 附近；Caplight 报告称近期没有老股市场数据。
        - 一致的第三方估值标记，加上已披露的老股交易或 IPO 准备证据，将提升价格发现的可信度。
    notes: 投资逻辑行只总结与估值相关的证据；判断变化需要新的已披露事实，而不是更强的机器人需求叙事。
