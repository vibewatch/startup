companyProfile:
  summary: >-
    Tianji 是一家总部位于东莞的机器人公司，从工业自动化发展为力控与具身智能硬件供应商。公开证据显示，其业务覆盖工业机器人、协作机器人、力控双臂系统和 Tianji Fusion 控制栈，近期又向人形机器人 OEM 供应以及研发
    / 部署工具延伸。更准确的定位是：一家以硬件为主、同时获得支持与系统集成收入的机器人供应商，而不是软件优先型公司。
  foundingLocation: Dongguan, Guangdong, China
  headquarters: Dongguan, Guangdong, China
