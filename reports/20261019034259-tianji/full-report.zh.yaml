      - number: '7.4'
        title: 缓释措施、监测指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              当前的缓释措施是具体的，但并不完整：Tianji 已追加融资，继续投资核心扭矩传感器和控制
              IP，并明确计划建设本地化销售和技术支持团队，以降低海外执行风险。这些步骤很重要，但目前仍属于计划或早期建设信号，而不是质量、现场支持和客户经济性已经完成去风险的公开证明。因此，下一轮尽调的实际监测项应保持窄而可量化：公司能否解释清楚
              2026 年 5 月估值区间和股权披露；订单积压能否转化为已发货、已验收和重复订单；海外支持实体、认证和渠道合作伙伴是否开始出现；现场可靠性指标或大客户背书是否公开。任何可信的相对 5
              月估值下调轮、重大订单积压延误、重大安全或合规问题，或明显差于当前 45 家 OEM 框架所暗示水平的客户集中度，都将构成投资逻辑破坏。
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 应把 Tianji 当作规模化执行故事，而不是已经完成去风险的独角兽
            body: 当前公开记录足以支持继续尽调，但不足以在没有股权结构表、条款清单、订单积压转化和现场可靠性证据的情况下，对 2026 年 5 月定价或 2026 年 9 月追加融资作出投资判断；这些证据目前尚未出现在本材料池中。
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR009
              - CR010
              - CR011
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断
        blocks:
          - type: paragraph
            body: >-
              Tianji 2026 年 5 月的融资看起来真实且具有战略意义：公司和独立报道都确认新增资本为 RMB 1 billion，第三方市场数据供应商则将融资估值集中在约 $1.4-1.5 billion
              投后。这足以把最新一轮视为可信参考点，但不足以把它视为长期便宜价。支持这一估值的同一批公开材料，也完全没有披露从订单积压和出货说法到收入、毛利率、现金烧钱速度和重复采购的关键桥梁。在具备真实增长信号、但经营价值桥梁不完整的情况下，价格敏感型判断应是观察而非买入；在管理层开放财务和条款数据室之前，入场纪律应保持在上一轮价格或以下。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV009
              - CV012
              - CV013
      - number: '8.2'
        title: 价格支撑与公开估值质量
        blocks:
          - type: paragraph
            body: >-
              公开估值支撑方向一致，但并不干净。Multiples、Caplight 和 InforCapital 都将 Tianji 锚定在约 $1.4-1.5 billion；公司主导的英文页面和 36Kr
              则将该轮描述为接近 RMB 10 billion 投后估值。但 EqualOcean 将同一笔 RMB 1 billion 融资列为投后 RMB 8
              billion，这是实质性差异，而不是四舍五入。Caplight 还称没有近期二级市场数据，也没有公开 IPO
              计划，因此无法从外部判断当前流动性或价格发现。结果是：上一轮估值可以使用，但还不能构成得到充分交叉验证的溢价估值案例，尤其是因为本材料池唯一的公开条款细节，只有 Multiples 提到该轮使用了可转换优先股。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: 情景框架
        blocks:
          - type: paragraph
            body: >-
              上行情景依赖商业化转化，而不是具身智能需求的故事包装。Tianji 拥有足够的产品和交付证据，值得继续尽调：公开来源称 2025 年交付超过 2,000 台双臂，2026 年第一季度订单超过 10,000
              台，OEM
              覆盖广泛，并在工业客户中拥有传统装机基础。但在转化为公开收入、毛利率、订单质量和客户集中度数据之前，这些口径仍只是需求代理指标。因此，基准情景是围绕最新融资区间维持估值；乐观情景需要证明订单积压能转化为高质量收入；悲观情景则由条款不透明或转化率弱于宣传驱动。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 退出准备度与最终尽调索取项
        blocks:
          - type: paragraph
            body: >-
              除了再进行一轮私募融资，或围绕 Tianji 在人形机器人供应链中的位置实现战略退出，公开证据还不足以支持退出投资判断叙事。Caplight 页面明确称没有公开 IPO
              计划，也没有近期二级市场数据，这使公开市场退出窗口停留在推测，而不是证据之上。在以最新一轮价格或更高价格投资前，最低限度的尽调包很清楚：核实声称的订单簿如何转化为收入和毛利率，检查清算优先权与反稀释条款，测试所述客户基础的重复采购和集中度，并确认二级流动性是否存在于醒目估值或以上。没有这些证明，投资逻辑仍有吸引力，但还不足以支持溢价投资判断。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 当前判断
            body: 将 Tianji 视为观察候选：公司看起来真实且获得战略资本支持，但其价格已经领先于买入判断所需的公开财务披露。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV013
          - type: callout
            title: 主要投资判断缺口
            body: 公开记录仍缺少从订单和出货到收入质量、毛利率和现金效率的经营桥梁。
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
          - type: callout
            title: 什么会改变判断
            body: 经验证的收入转化、干净的优先权条款，以及重复采购客户质量证据，将是从观察走向买入最快的路径。
            calloutType: assumption
            claimRefs:
              - CV010
              - CV014
              - CV015
