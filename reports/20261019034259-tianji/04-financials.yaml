      - ["Recent dual-arm customer count", ">100 clients; 45 global humanoid OEMs/unicorns in Q1 2026", "Medium", "Helps size concentration and channel breadth", "List top customers, concentration, and repeat-order share"]
      - ["Realized ASP / contract value", null, "Low", "Needed to translate units into revenue quality", "Disclose list versus realized ASP and payment milestones by product line"]
      - ["Gross margin / service-delivery margin", null, "Low", "Required to judge hardware economics and margin path", "Provide margin by systems, modules, and services/support"]
