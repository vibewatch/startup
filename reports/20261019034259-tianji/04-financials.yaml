callouts:
  - calloutType: insight
    title: Capital is funding capacity before transparency
    body: "The May 2026 round is explicitly aimed at R&D, mass production, and global sales expansion, which is consistent with a hardware scale-up story but not with a public proof point on profitability or cash efficiency."
    claimRefs: [CI002, CI008]
  - calloutType: risk
    title: Orders are not yet an underwritten revenue bridge
    body: "Tianji's disclosed shipments and backlog support demand, yet the public record still lacks pricing, revenue-recognition, gross-margin, and runway data, so investors cannot verify whether scale is translating into healthy unit economics."
    claimRefs: [CI003, CI004, CI012]
