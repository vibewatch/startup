company:
  name: Tianji
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports Tianji's story of hardware-led traction and fresh
    capital for production scale-up, but it does not disclose the realized
    pricing, revenue conversion, margin structure, or runway needed to underwrite
    the May 2026 unicorn valuation confidently. The strongest corroborated data
    points are financing amount, intended use of proceeds, shipment/backlog
    signals, and third-party market-data variance rather than audited operating
    economics.
sections:
  - id: revenue-model-and-public-traction
    title: Revenue model and disclosed operating outputs
    body: |-
      The retained sources describe Tianji as a B2B robotics infrastructure supplier rather than a software subscription business. Caplight classifies the company under “Hardware Sales, Services & Consulting,” while EqualOcean, Gasgoo, and 36Kr all describe a stack spanning force-controlled humanoid dual-arm systems, integrated joints, controllers, sensors, and broader automation solutions. That mix supports a revenue model centered on hardware product sales plus related systems/support work, but public disclosures stop short of showing how much revenue comes from each stream, whether services are recurring, or how revenue is recognized across equipment shipments, backlog, and any channel relationships.

      The traction metrics in public view are operational, not financial. Gasgoo reports more than 2,000 force-control humanoid dual arms delivered to more than 100 clients within four months of 2025, while EqualOcean and 36Kr say Q1 2026 backlog exceeded 10,000 units and covered 45 global humanoid OEMs and embodied-intelligence unicorns. 36Kr also cites older company-wide operating figures of more than 800 customers and more than 10,000 robots running online as of end-2022. Those disclosures indicate meaningful demand and installed-base breadth, but they do not reveal ASPs, acceptance timing, cancellation rates, or what portion of backlog converts into recognized revenue.
    claimRefs: [CI001, CI003, CI004, CI005, CI009, CI010, CI011, CI012]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-cost-structure
    title: Unit economics and cost structure
    body: |-
      Tianji's public materials are much stronger on engineering output than on unit economics. The company and syndicated coverage consistently emphasize force-control performance, mass-production capability, automation-rate improvement, first-pass yield, and global-sales expansion, which suggests a cost structure dominated by hardware BOM, manufacturing yield, labor, and field-support costs rather than low-marginal-cost software delivery. However, none of the retained public sources disclose realized pricing, gross margin, warranty burden, channel take-rates, sales cycle length, customer-acquisition cost, payback, or working-capital intensity.

      That omission matters because Tianji's reported order and shipment volumes are not enough to infer revenue quality. Backlog above 10,000 units is not the same as booked revenue, and list-less hardware businesses can see wide differences between demonstration shipments, paid production deployments, pilot discounts, and full-margin recurring orders. Public evidence therefore supports only proxy analysis: Tianji appears to be scaling a capital-intensive hardware platform with meaningful production and support requirements, but the key underwriting inputs remain private.
    claimRefs: [CI002, CI004, CI005, CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financing-dependency
    title: Capital adequacy and financing dependency
    body: |-
      The clearest financial datapoint is the May 2026 Series B/B+ financing. EqualOcean and Gasgoo both report RMB 1 billion raised, with proceeds earmarked for R&D, large-scale mass production, and a global sales network. That use-of-funds mix implies Tianji still needs external capital to expand manufacturing capacity and overseas commercial coverage; it is not presenting itself publicly as a self-funding cash machine. The financing may be adequate for the current scale-up phase, but public evidence does not disclose cash-on-hand, monthly burn, debt, covenant load, or runway, so outside investors cannot independently test how long this round lasts.

      Third-party summaries also show some variance around the same financing event. InforCapital describes the May 2026 round as $138 million at a $1.4 billion valuation; EmbodiedGlobal translates it to approximately $140 million and nearly RMB 10 billion; and Caplight estimates $152.58 million total funding and a $1.5 billion valuation while saying no recent secondary-market data is available. That spread is not large enough to negate unicorn status, but it does underline that current market pricing is inferred from sparse private-market datapoints rather than transparent financial disclosure. On available evidence, the next round trigger is more likely tied to manufacturing execution and revenue conversion than to any publicly auditable profitability milestone.
    claimRefs: [CI001, CI002, CI006, CI007, CI008, CI012]
  - id: verdict-and-diligence-blockers
    title: Verdict and diligence blockers
    body: |-
      Financially, Tianji looks like a fast-scaling robotics hardware supplier with credible demand signals and a clearly funded near-term expansion plan, but the public record does not yet support a clean underwriting case on revenue quality or margin path. The positive case is that customers, shipments, and backlog all point to genuine commercial pull, and the company is using fresh capital to industrialize production and global distribution. The weak point is that every decisive financial bridge — ASP to revenue, revenue to gross profit, gross profit to burn, and burn to runway — remains undisclosed.

      For diligence, the highest-priority asks are product-line pricing history, realized revenue by stream, gross margin by hardware versus services, backlog aging and cancellation rates, working-capital and capex requirements, and the current cash/runway picture after the 2026 round. Until those items are produced, the best-supported conclusion is that Tianji's operational momentum is real but its valuation still outruns the public financial evidence.
    claimRefs: [CI003, CI004, CI008, CI011, CI012]
