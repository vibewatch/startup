  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: round-terms
      missingEvidence: Signed term sheet, liquidation preferences, anti-dilution terms, board rights, and any secondary-sale component for the 2026 rounds.
      whyItMatters: These items determine whether the public unicorn mark is economically real for new investors or masked by preference overhang and control asymmetry.
      diligencePath: Request the current cap table, financing documents, board observer rights, and any side letters from the May and September 2026 rounds.
      relatedQuestionRefs: [QR001, QR005, QR008]
    - type: missing-source
      severity: material
      topic: regulatory-readiness
      missingEvidence: Named export-control, safety, cyber, privacy, incident, recall, and freedom-to-operate materials supporting Tianji's overseas expansion.
      whyItMatters: International deployments can stall or become more expensive if certifications, product safety, or IP constraints are weaker than the growth story implies.
      diligencePath: Run counsel-led litigation and regulatory searches and collect certification packs, export classifications, and patent/opinion summaries for the main product families.
      relatedQuestionRefs: [QR002, QR007]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: backlog-conversion
      missingEvidence: Top-customer mix, cancellation rate, repeat-order cadence, shipped-versus-ordered bridge, backlog aging, and accepted-revenue conversion.
      whyItMatters: The 10,000-unit order story can overstate durability if a few OEM programs drive most of the pipeline or if backlog converts slowly.
      diligencePath: Request cohort views for the top 10 customers, booked-to-shipped bridges, cancellation history, and repeat-purchase evidence by product line.
      relatedQuestionRefs: [QR003, QR004]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
      topic: reliability-security
      missingEvidence: Field failure logs, warranty-claim rates, uptime/RMA data, penetration-test results, and customer reference calls on deployed systems.
      whyItMatters: Manufacturing scale claims are not enough if product reliability, service burden, or data-security controls break under real-world usage.
      diligencePath: Request quality dashboards, support SLAs, red-team or pen-test reports, and at least three reference calls from deployed customers or platform partners.
      relatedQuestionRefs: [QR002, QR003, QR007]
      relatedTableRefs: [TR002]
