callouts:
  - calloutType: risk
    title: Underwrite Tianji as a scaling execution story, not a fully de-risked unicorn
    body: >-
      The current public record is strong enough to justify continued diligence, but not strong
      enough to underwrite the May 2026 pricing or the September 2026 follow-on without cap-table,
      term-sheet, backlog-conversion, and field-reliability evidence that does not yet appear in
      this pool.
    claimRefs: [CR002, CR005, CR009, CR010, CR011, CR015]
