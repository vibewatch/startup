company:
  name: Tianji
chapter:
  number: 7
  title: Risks
  summary: >-
    Tianji's public risk picture is dominated less by evidence of a current failure and more by
    execution and underwriting uncertainty: the company is scaling manufacturing, backlog, and
    overseas support quickly, but public disclosures still leave material gaps on round terms,
    exact ownership, compliance readiness, and field reliability. The strongest disclosed
    mitigants are fresh capital, product depth, and planned support build-out, yet the residual
    exposure remains high because those mitigants are still in build-out rather than already
    demonstrated at global scale.
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      The highest-confidence public risks are execution and pricing risks rather than proof of an
      outright product or financing fabrication problem. Multiple sources align that Tianji raised
      roughly RMB1 billion in May 2026 and then added a September 2026 B++ round, while claiming
      more than 2,000 force-controlled dual-arm deliveries in four months and more than 10,000
      units on order by Q1 2026. Those same sources also show that the new capital is still being
      aimed at manufacturing automation, yield improvement, and localized overseas support, which
      means the operating model is still being hardened while investors are already being asked to
      price the business at unicorn-scale marks. Public evidence therefore supports a risk ranking
      led by valuation/disclosure opacity, manufacturing scale-up, customer/OEM concentration, and
      overseas support/compliance execution.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR007, CR015]
    figureRefs: [FR001]
  - id: governance-regulatory-and-financial-disclosure
    title: Governance, regulatory, and financial disclosure risk
    body: >-
      The sharpest financial underwriting risk is not whether Tianji raised money, but whether an
      investor can underwrite the price and control surface with precision. Public sources point to
      a May 2026 post-money valuation anywhere from RMB8 billion to nearly RMB10 billion, while
      market-data pages translate that into roughly $1.4 billion to $1.5 billion. The same public
      record is also inconsistent on ownership language: Robot Belt and 36Kr describe Changying or
      Everwin retaining about a 27 percent stake, whereas EqualOcean still describes Tianji as a
      wholly owned subsidiary. That does not prove misconduct, but it does mean minority investors
      should treat cap-table precision, board rights, preference stack, and any secondary component
      as unresolved diligence items rather than assuming the public story is already clean. Public
      materials in the assigned pool also do not surface named export-control, certification,
      product-safety, or litigation disclosures commensurate with Tianji's stated North America
      expansion ambitions, so regulatory readiness should be treated as unverified rather than
      presumed.
    claimRefs: [CR002, CR003, CR007, CR009, CR010, CR011]
    tableRefs: [TR001]
  - id: operational-partner-and-customer-execution
    title: Operational, partner, and customer execution risk
    body: >-
      Operationally, Tianji has meaningful momentum but also a narrow path to proving that momentum
      is durable. Independent and company-linked sources repeatedly cite more than 2,000 dual-arm
      units delivered in four months and more than 10,000 units on order by Q1 2026, but the same
      evidence makes clear that management is still investing new capital to raise automation,
      improve first-pass yield, and stand up localized support teams abroad. That is consistent with
      a company that may have found product-market pull but has not yet publicly demonstrated mature
      service, reliability, or backlog-conversion metrics. Customer and partner concentration add to
      that risk: the disclosed backlog is tied to 45 global humanoid OEMs and embodied-AI companies,
      the product listing reviewed here shows a limited hardware warranty footprint, and public
      evidence still does not disclose cancellation rates, top-customer exposure, renewal behavior,
      or warranty-claim performance. The result is high residual execution risk even if product
      demand is real.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR012, CR013, CR014, CR015]
    tableRefs: [TR002, TR003]
  - id: mitigations-monitors-and-kill-criteria
    title: Mitigations, monitoring indicators, and kill criteria
    body: >-
      The current mitigants are tangible but incomplete: Tianji has raised additional capital,
      continues to invest in core torque-sensor and control IP, and explicitly plans localized sales
      and technical-support teams to reduce overseas execution risk. Those steps matter, but they
      are still plans or early build-out indicators rather than disclosed proof that quality, field
      support, and customer economics are already de-risked. The practical monitoring set for the
      next diligence cycle is therefore narrow and measurable: whether the company can reconcile the
      May 2026 valuation range and ownership disclosures; whether backlog converts into shipped,
      accepted, and repeat orders; whether overseas support entities, certifications, and channel
      partners become visible; and whether field-reliability metrics or large-customer references
      become public. A thesis-break would be any credible evidence of a down-round versus the May
      mark, major backlog slippage, material safety or compliance issues, or customer concentration
      meaningfully worse than the current 45-OEM framing implies.
    claimRefs: [CR002, CR005, CR007, CR011, CR012, CR015]
