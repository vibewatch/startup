companyProfile:
  summary: >-
    Tianji is a Dongguan-based robotics company that evolved from industrial automation into a force-control and
    embodied-intelligence hardware supplier. The public evidence base points to a business spanning industrial robots,
    collaborative robots, force-controlled dual-arm systems, and the Tianji Fusion control stack, with a recent push
    into humanoid-robot OEM supply and research/deployment tooling. It is best understood as a hardware-led robotics
    supplier with support and systems-integration revenue, not as a software-first company.
