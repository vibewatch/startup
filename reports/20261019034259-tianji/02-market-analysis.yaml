company:
  name: "Tianji"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Tianji's addressable market is better framed as embodied-AI manipulation infrastructure—industrial automation, humanoid OEM subsystems, and emerging research platforms—than as a single software-like TAM.
    Public top-down forecasts point to a large robotics and embodied-intelligence envelope, but the strongest evidence in the assigned pool is bottom-up: more than 2,000 force-controlled dual-arm deliveries in 2025 and a Q1 2026 order book above 10,000 units across 45 OEM customers.
    The main diligence limitation is that public sources do not isolate Tianji's SAM, ASP, or budget ownership cleanly, so current market sizing remains lens-based rather than definitive.
sections:
  - id: "market-boundary"
    title: "Market boundary and included spend"
    body: >-
      The assigned evidence places Tianji in embodied-AI manipulation infrastructure rather than in generic AI software or a single finished-robot SKU.
      Current commercial scope includes industrial collaborative robots, force-controlled humanoid dual arms, joint and control modules, and related automation solutions, while newer 2026 launches start to extend the company into wheeled full-humanoid platforms and research tooling.
      That means the included spend today is closest to factory automation capex, humanoid OEM subsystem procurement, and research-platform equipment budgets.
      The sources do not support treating general-purpose AI model spend, unrelated humanoid locomotion stacks, or the entire robotics software toolchain as Tianji's current market.
    claimRefs: ["CM001", "CM002", "CM007", "CM008", "CM009", "CM010", "CM013", "CM014"]
    tableRefs: ["TM001", "TM003"]
  - id: "sizing-lenses"
    title: "Sizing lenses are directional, not a clean TAM/SAM/SOM stack"
    body: >-
      The pool provides two useful top-down lenses and several stronger bottom-up demand proxies, but they are not directly comparable.
      36Kr cites IDC for a roughly $30 billion 2026 global intelligent-robot-hardware market and cites China Development Report 2025 for a CNY400 billion China embodied-intelligence market by 2030, while multiple outlets relay Tianji-specific shipment and backlog signals that are much closer to the company's real commercial traction.
      Those bottom-up signals matter because they show actual buyer pull, yet they cannot by themselves define Tianji's total addressable market.
      For diligence, the practical read is that macro market tailwinds are large, but underwriting should rely more heavily on observable order density, customer breadth, and payload/application breadth than on any single headline TAM figure.
    claimRefs: ["CM003", "CM004", "CM005", "CM006", "CM011", "CM012", "CM015"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "drivers-and-constraints"
    title: "Adoption drivers, buyer motion, and the main constraints"
    body: >-
      Adoption appears to be pulled by a specific bottleneck: humanoid and embodied-AI programs need reliable force-controlled manipulation hardware, not just better cognition.
      That creates a buyer set spanning factory automation teams, humanoid OEM platform groups, and research labs that want ready-made teleoperation and data-collection systems.
      At the same time, the sources repeatedly frame production consistency, yield, stability, and local support as the real gating factors for scaling from prototype programs into repeat deployments.
      Tianji's 2026 expansion into Gento full-humanoid products may broaden the reachable market, but it also increases execution complexity by pushing the company closer to platform and OEM exposure rather than staying purely in subsystems.
    claimRefs: ["CM003", "CM004", "CM010", "CM012", "CM013", "CM014", "CM016"]
callouts:
  - calloutType: "strength"
    title: "Demand proxy is stronger than the public TAM math"
    body: >-
      Multiple outlets repeated Tianji's claims of more than 2,000 dual-arm deliveries in 2025 and more than 10,000 Q1 2026 orders across 45 OEM customers, which is more decision-useful for near-term diligence than any single top-down market estimate.
    claimRefs: ["CM011", "CM012", "CM015"]
  - calloutType: "risk"
    title: "Market framing is broader than spend framing"
    body: >-
      Public sizing sources mix global robot-hardware forecasts, China embodied-intelligence policy projections, and Tianji-specific backlog signals, so valuation work should not treat any one published figure as the company's SAM.
    claimRefs: ["CM005", "CM006", "CM015"]
