  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: round-terms
      missingEvidence: Signed term sheet or cap-table materials showing liquidation preferences, anti-dilution, board rights, secondary mix, and ownership changes from the May 2026 round.
      whyItMatters: Investor protections can absorb a large share of upside even when the headline valuation looks acceptable.
      diligencePath: Request the latest financing documents, cap table, and board materials from management and counsel.
      relatedQuestionRefs: [QV003]
    - type: missing-source
      severity: material
      topic: financial-conversion
      missingEvidence: Revenue, gross margin, burn, runway, backlog-aging, realized ASP, renewal, and customer-concentration data for the 2025 to 2026 commercialization ramp.
      whyItMatters: Shipment and order claims cannot be translated into value or downside protection without an operating-value bridge.
      diligencePath: Obtain monthly KPI packs, audited financial statements, backlog detail, and customer cohort data.
      relatedQuestionRefs: [QV005, QV006, QV008]
      relatedTableRefs: [TV003]
    - type: missing-source
      severity: material
      topic: liquidity-exit
      missingEvidence: Evidence of recent secondary transactions, transfer restrictions, or documented IPO-readiness steps.
      whyItMatters: Exit timing and realized return depend on whether the latest round mark is actually liquid or only a paper reference.
      diligencePath: Ask brokers, management, and lead investors for any secondary data, transfer terms, and IPO planning materials.
      relatedQuestionRefs: [QV007, QV008]
