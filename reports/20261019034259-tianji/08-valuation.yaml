schemaVersion: report-v2
artifact: valuation
slug: tianji
runDate: 2026-10-19
company:
  name: Tianji
chapter:
  number: 8
  title: Valuation
  summary: >-
    The public record supports a real May 2026 financing event and a latest-round value cluster around
    roughly $1.4-1.5 billion, but it does not provide the revenue, margin, liquidity, or term disclosure
    needed to underwrite a premium price. Tianji therefore screens as a track rather than buy: the
    operating proof points and investor roster are credible enough to keep the company in scope, while
    the public evidence base remains too thin for confident entry above the latest round mark.
sections:
  - id: underwriting-call
    title: Underwriting call
    body: >-
      Tianji's May 2026 round appears real and strategically important: the company and independent
      coverage align on RMB 1 billion of new capital, while third-party market-data vendors cluster the
      financing around roughly $1.4-1.5 billion post-money. That is enough to treat the latest round as a
      credible reference point, but not enough to treat it as a durable bargain. The same public package
      that supports the mark also leaves the crucial bridge from backlog and shipment claims to revenue,
      gross margin, cash burn, and repeat purchasing completely undisclosed. With real traction signals but
      an incomplete operating-value bridge, the price-sensitive call is track rather than buy, and entry
      discipline should stay at or below the last round until management opens the financial and term data
      room. 
    claimRefs: [CV001, CV003, CV005, CV007, CV009, CV012, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: price-support-and-public-mark
    title: Price support and public mark quality
    body: >-
      Public valuation support is directionally consistent but not clean. Multiples, Caplight, and
      InforCapital all anchor Tianji near $1.4-1.5 billion, while the company-led English page and 36Kr
      frame the round at nearly RMB 10 billion post-money. EqualOcean, however, prints the same RMB 1
      billion financing at RMB 8 billion post-investment, which is a meaningful gap rather than a rounding
      error. Caplight also reports no recent secondary market data and no public IPO plans, limiting any
      external read-through on present liquidity or price discovery. The result is a usable last-round mark
      but not a well-corroborated premium valuation case, especially because the only public term detail in
      the assigned pool is Multiples' note that the round used convertible preferred shares. 
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenario-framing
    title: Scenario framing
    body: >-
      The upside case rests on commercialization conversion, not on storytelling about embodied-intelligence
      demand. Tianji has enough product and delivery evidence to justify continued diligence: public sources
      describe more than 2,000 dual-arm units delivered in 2025, more than 10,000 units of Q1 2026 orders,
      broad OEM coverage, and a legacy installed base across industrial customers. But those claims remain a
      demand proxy until they are translated into disclosed revenue, gross margin, backlog quality, and
      customer concentration data. Accordingly, the base case is a hold-the-mark scenario around the latest
      financing band, the bull case requires proof that backlog converts into quality revenue, and the bear
      case is driven by opaque terms or weaker-than-advertised conversion. 
    claimRefs: [CV007, CV008, CV009, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence-asks
    title: Exit readiness and final diligence asks
    body: >-
      Public evidence does not yet support an exit-underwriting narrative beyond another private financing
      or a strategic outcome tied to Tianji's position in the humanoid-robot supply chain. Caplight's page
      explicitly says no public IPO plans have been announced and that no recent secondary market data is
      available, which makes the public market exit window speculative rather than evidenced. The minimum
      diligence package before paying into or above the latest round is straightforward: verify revenue and
      gross margin conversion from the claimed order book, inspect liquidation preference and anti-dilution
      terms, test repeat buying and concentration across the stated customer base, and confirm whether
      secondary liquidity exists at or above the headline mark. Absent those proofs, the thesis stays
      interesting but not yet underwritable at a premium. 
    claimRefs: [CV003, CV004, CV009, CV010, CV014, CV015]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision lens
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - [Current underwriting, track, medium, high, stretched, "Do not pay above the latest round mark without private financial diligence."]
      - [Upside test, not yet met, low, high, needs proof, "Require disclosed revenue conversion, gross margins, and repeat-customer quality before underwriting a premium."]
      - [Likely exit path, private follow-on / strategic, low, high, illiquid, "Public evidence points to another private round or supply-chain outcome sooner than a transparent IPO or liquid secondary market."]
    notes: Public recommendation uses only assigned public sources; low confidence rows reflect missing financial and liquidity disclosure rather than weak product interest.
    claimRefs: [CV003, CV004, CV012, CV013, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence now
      - What would change the view
    rows:
      - ["Thesis: real financing mark", "Official and independent coverage align that RMB 1 billion was raised in May 2026 and external trackers cluster around roughly $1.4-1.5 billion.", "A lower-quality round structure or hidden investor protections would weaken the usefulness of the latest mark."]
      - ["Thesis: commercialization signals exist", "Public sources cite >2,000 dual-arm units delivered in 2025 plus >10,000 units of Q1 2026 orders and broad OEM/customer reach.", "Verified revenue, gross margin, and repeat-order disclosure would turn these demand signals into underwritable operating proof."]
      - ["Anti-thesis: financial bridge is missing", "The assigned valuation sources do not disclose standalone revenue, gross margin, burn, runway, renewal, backlog aging, or realized ASP.", "Audited or management-provided KPI disclosure could justify underwriting closer to operating value rather than headline momentum."]
      - ["Anti-thesis: public mark quality is inconsistent", "EqualOcean prints RMB 8 billion while other sources cluster near RMB 10 billion / $1.4-1.5 billion, and Caplight reports no recent secondary market data.", "Consistent third-party marks plus disclosed secondary or IPO-readiness evidence would improve confidence in price discovery."]
    notes: Thesis rows summarize valuation-relevant evidence only; changes in view require new disclosed facts, not a stronger narrative about robotics demand.
    claimRefs: [CV001, CV003, CV006, CV007, CV009, CV010, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Observed public mark, "Latest round remains the only hard price anchor and outside data clusters near $1.4-1.5 billion.", "Treat the May 2026 mark as reference value rather than upside proof.", "Public sources still disagree on the exact post-money number and do not show operating conversion.", Current baseline.]
      - [Bull, "Claimed backlog converts into disclosed revenue and gross margin while terms are clean and repeat customers validate the demand story.", "A premium above the latest round could be justified only after operating proof closes the current disclosure gap.", "Orders may not convert into quality revenue and preferences may absorb upside.", "Needs new private diligence rather than public extrapolation."]
      - [Base, "Round mark holds, industrial traction remains credible, and no major negative diligence surprise appears.", "Value clusters around the latest financing band with limited re-rating until fundamentals are shown.", "The company may simply be fairly priced already with little margin of safety.", "Most supportable with current evidence."]
      - [Bear, "Revenue conversion disappoints, preference overhang is heavy, or liquidity stays thin while independent marks remain inconsistent.", "A discount to the latest round would be warranted because the current public evidence would look momentum-led rather than fundamentals-led.", "Headline shipment claims may mask weaker margins, concentration, or backlog quality.", "Triggered by failed diligence or a weaker next round."]
    notes: Scenario ranges are qualitative because the assigned public sources do not provide enough financial detail for a defensible model-based valuation.
    claimRefs: [CV003, CV006, CV007, CV009, CV010, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public evidence supports a real latest-round mark, but not a premium underwriting case.
    data:
      nodes:
        - id: round
          label: Real May 2026 financing mark
          note: Official and independent coverage agree RMB 1 billion closed.
        - id: traction
          label: Demand signals exist
          note: Public sources cite >2,000 units delivered in 2025 and >10,000 Q1 2026 orders.
        - id: cluster
          label: External marks cluster near $1.4-1.5B
          note: Multiples, Caplight, and InforCapital sit in the same general band.
        - id: conflict
          label: Mark quality is not perfectly clean
          note: EqualOcean prints RMB 8 billion and Caplight reports no recent secondary data.
        - id: gap
          label: Financial bridge is missing
          note: Revenue, margin, burn, and full round terms remain undisclosed in the assigned sources.
        - id: decision
          label: Recommendation = track / no premium
          note: Underwrite only after private financial and term diligence closes the gap.
    claimRefs: [CV001, CV003, CV005, CV006, CV009, CV012, CV013]
callouts:
  - calloutType: recommendation
    title: Current call
    body: "Treat Tianji as a track candidate: the company looks real and strategically funded, but the price is ahead of the public financial disclosure needed for a buy call."
    claimRefs: [CV001, CV012, CV013]
  - calloutType: risk
    title: Main underwriting gap
    body: The public record still lacks the operating bridge from orders and shipments to revenue quality, gross margin, and cash efficiency.
    claimRefs: [CV007, CV009]
  - calloutType: assumption
    title: What would move the view
    body: "Verified revenue conversion, clean preference terms, and evidence of repeat customer quality would be the fastest path from track toward buy."
    claimRefs: [CV010, CV014, CV015]
