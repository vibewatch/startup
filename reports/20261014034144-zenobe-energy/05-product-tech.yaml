callouts:
  - calloutType: "insight"
    title: "Grid-Forming Inverter Technology as a Structural Transmission Moat"
    body: "Zenobē's deployment of grid-forming batteries under NESO Stability Pathfinder Phase 2 positions the company ahead of merchant storage peers. By delivering synthetic inertia and short-circuit level rather than pure frequency response, Zenobē secures long-term stability contracts that hedge merchant power price volatility."
    claimRefs:
      - "CE009"
      - "CE010"
  - calloutType: "risk"
    title: "External Dependency on Third-Party Algorithmic Trading Platforms"
    body: "While Zenobē promotes proprietary software capabilities, core revenue optimisation at sites like Hill Farm relies on Open Energi's Dynamic Demand 2.0 Trader and Erova Energy's trading desk. Diligence must establish whether Zenobē is building native algorithmic trading IP or remains dependent on external software revenue-sharing arrangements."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE013"
