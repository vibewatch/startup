        - Defensible 20-25% UK market share and multi-year turnkey infrastructure contracts with bus operators
        - High capital intensity and customer concentration among regional transit operators
        - Proof of profitable contract renewals and margin expansion in European expansion markets
      - - Grid-Scale Battery Storage
        - Pioneering commercial deployment with 175MW+ contracted capacity and algorithmic balancing trade revenue
        - Merchant market revenue risk and revenue degradation as battery grid saturation increases
        - Securing 10+ year contracted floor pricing or capacity market indexation
