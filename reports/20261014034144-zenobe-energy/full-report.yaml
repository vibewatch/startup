      - number: '5.4'
        title: Technical Differentiation, Second-Life Batteries, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Zenobē's technical differentiation lies in complex systems integration, regulatory pathfinder execution,
              and asset lifecycle management rather than proprietary chemical cell manufacturing or standalone
              enterprise software. In circular battery lifecycle management, Zenobē repurposes degraded bus battery
              packs into mobile second-life portable power units—deploying 50 units globally for applications such as
              the Extreme E off-road racing series paddock operations and construction sites. In heavy transport,
              broader decarbonization partners like Hitachi Rail explore 70 km battery ranges for non-electrified
              routes, highlighting the expanding boundary of rail and transit battery electrification. However,
              technical diligence must evaluate key operational vulnerabilities: heavy reliance on third-party cell
              suppliers exposes Zenobē to supply chain volatility, while integration with partner optimization platforms
              like Open Energi creates external software dependencies that warrant careful contractual review.
            claimRefs:
              - CE001
              - CE009
              - CE011
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Grid-Forming Inverter Technology as a Structural Transmission Moat
            body: >-
              Zenobē's deployment of grid-forming batteries under NESO Stability Pathfinder Phase 2 positions the
              company ahead of merchant storage peers. By delivering synthetic inertia and short-circuit level rather
              than pure frequency response, Zenobē secures long-term stability contracts that hedge merchant power price
              volatility.
            calloutType: insight
            claimRefs:
              - CE009
              - CE010
          - type: callout
            title: External Dependency on Third-Party Algorithmic Trading Platforms
            body: >-
              While Zenobē promotes proprietary software capabilities, core revenue optimisation at sites like Hill Farm
              relies on Open Energi's Dynamic Demand 2.0 Trader and Erova Energy's trading desk. Diligence must
              establish whether Zenobē is building native algorithmic trading IP or remains dependent on external
              software revenue-sharing arrangements.
