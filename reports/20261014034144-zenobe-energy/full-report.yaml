        - Strong equity backing from KKR, Infracapital, and M&G with access to major European bank syndicates
        - Excessive debt leverage (> $1.3B debt) creating heavy debt service burden and refinancing risk
        - Disclosure of conservative debt service coverage ratios (>1.5x) and sponsor equity subordination
      - - Valuation & Exit Horizon
        - Substantial infrastructure platform premium upon eventual IPO or trade sale to global utility sponsor
        - Public clean energy storage comparables (Fluence -64.3% in 2026) facing multiple compression
        - Rebound in public energy storage valuation multiples and audited double-digit EBITDA margins
