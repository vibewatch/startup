      - number: '5.2'
        title: Grid-Scale Network Infrastructure and Stability Services
        blocks:
          - type: paragraph
            body: >-
              In addition to fleet depot assets, Zenobē develops and operates large-scale transmission-connected battery
              storage facilities designed to provide critical network stability services to transmission system
              operators. As renewable generation replaces fossil-fueled thermal power plants, electricity grids lose
              physical inertia and short-circuit level, increasing vulnerability to rapid frequency drops. Zenobē's
              flagship Scottish site at Blackhillock represents one of Europe's largest transmission-connected
              batteries, with an initial capacity of 200 MW expanding to 300 MW. Contracted under the National Energy
              System Operator (NESO) Stability Pathfinder Phase 2 initiative, Blackhillock utilizes advanced
              grid-forming inverters that mimic synchronous generators by setting voltage and frequency waveforms to
              deliver synthetic inertia. Together with projects such as the 100 MW Capenhurst facility—contracted
              commercially for reactive power voltage support—Zenobē has amassed approximately 1,500 MW of contracted
              battery storage assets providing contracted stability rather than relying purely on merchant arbitrage.
            claimRefs:
