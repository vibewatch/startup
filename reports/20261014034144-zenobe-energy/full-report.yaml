      - number: '5.3'
        title: Operating Architecture, Algorithmic Trading, and Software Strategy
        blocks:
          - type: paragraph
            body: >-
              Zenobē's operating technology stack spans physical hardware, grid control interfaces, and algorithmic
              software. For revenue optimization and market dispatch across its grid-connected battery portfolio, Zenobē
              collaborates with Open Energi and power trading desk Erova Energy. At sites such as Hill Farm (10 MW),
              Zenobē deployed the Dynamic Demand 2.0 Trader platform, which algorithmically co-optimizes market revenue
              across the UK Balancing Mechanism, wholesale power markets, and frequency response while continuously
              tracking state of charge to satisfy battery manufacturer warranty constraints. Rather than maintaining a
              fully internal merchant trading desk or proprietary algorithmic engine, Zenobē integrates specialized
              third-party trading and dispatch technology. On the fleet management layer, Zenobē deepened software
              capabilities through a strategic investment in GoMetro, a fleet management technology firm focused on
              commercial vehicle telematics and digital dispatch integration.
