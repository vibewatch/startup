  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Zenobē's commercial strategy organizes its customer base across three primary operational categories:
              municipal and regional bus transit operators, industrial and utility infrastructure owners, and commercial
              freight logistics fleets. In the bus transit sector, Zenobē acts as a turnkey infrastructure and financing
              partner for major public transport groups including Mobico Group (National Express), Transdev Blazefield,
              and municipal municipal transport operators like Nottingham City Transport. These buyers operate under
              concession or franchise contracts where upfront capital expenditure constraints, depot grid capacity
              limits, and battery residual value risks create substantial adoption friction. For utility and industrial
              accounts such as United Utilities, Zenobē delivers behind-the-meter battery storage systems paired with
              onsite renewable generation under multi-year flexibility and resilience contracts. More recently, the
              company has begun expanding into commercial freight logistics through partnerships such as its deployment
              of electric delivery trucks with Winning Group in Australia. Commercial terms typically span 10 to 15
              years, during which Zenobē assumes the technical and degradation risk of the batteries while securing
              predictable, contracted service revenue.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU011
