chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Governance, and Founding History
        blocks:
          - type: paragraph
            body: >-
              Zenobē Energy was established in August 2017 by its three co-founders Nicholas Beatty, James Basden, and
              Steven Meersman, establishing headquarters in London to address systemic constraints in grid-scale battery
              storage and fleet decarbonization [CO001]. The company operates a dual-pronged infrastructure model,
              combining turnkey fleet electrification services for commercial bus and delivery operators with
              utility-scale battery energy storage systems (BESS) designed for grid stability and power market arbitrage
              [CO002]. Executive leadership remains strongly anchored by founder-directors Nicholas Beatty and Steven
              Meersman, who maintain strategic and operational continuity through institutional capital expansions
              [CO003]. Corporate finance execution and institutional syndication are directed by functional leadership
              including Head of Corporate Finance Ciaran Kelly, who manages multi-currency debt and equity structuring
              across battery and mobility verticals [CO004]. Supported by rapid scaling in commercial operations, Zenobē
              expanded its workforce from 230 global personnel in September 2023 to 300 full-time equivalents by June
              2026, reflecting deepening technical, software, and financial capabilities across international
              jurisdictions [CO009].
