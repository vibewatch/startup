        title: Exhibits
        blocks:
          - type: callout
            title: Subsidy Control Litigation and Policy Reform Uncertainty
            body: >-
              Zenobē Energy's active challenge against GEMA's cap-and-floor support for long-duration energy storage
              underscores rising regulatory friction in the UK flexibility market. While seeking to preserve parity for
              lithium-ion storage, litigation poses risks of counter-regulatory adjustments or prolonged policy
              uncertainty.
