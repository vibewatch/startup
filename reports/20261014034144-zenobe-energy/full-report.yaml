      - number: '7.4'
        title: Comprehensive Risk Matrix and Diligence Monitoring Triggers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Zenobē Energy's comprehensive risk profile reveals that while technology and asset execution
              have achieved commercial operational proof, systemic regulatory and financial leverage exposures represent
              the primary thesis-break risks. The company's proactive stance in challenging GEMA's subsidy policies
              reflects the existential importance of wholesale flexibility market design, where regulatory favoring of
              longer-duration non-battery assets could compress merchant margins for utility-scale lithium-ion
              batteries. Simultaneously, the capital-intensive deployment of turnkey bus depots and
              multi-hundred-megawatt grid storage facilities creates high fixed debt service obligations that demand
              sustained contract renewal rates and prompt municipal bus fleet electrification schedules. For prospective
              investors and diligence teams, primary monitoring indicators must center on the forthcoming Competition
              Appeal Tribunal judgment in April 2026, the resolution of Ofgem's residual network charging reviews for
              commercial fleet depots, disclosed ratios of contracted ancillary revenues versus volatile merchant
              wholesale arbitrage, and lender covenant headroom across the syndicated financing facilities.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR008
              - CR010
