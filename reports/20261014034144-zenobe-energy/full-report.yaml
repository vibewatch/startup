            body: >-
              With over $1.3 billion in cumulative debt facilities and private valuation marks of £800m facing public
              market comparables that have collapsed (such as Fluence Energy declining 64.3% in 2026), equity returns
              face severe downside if merchant revenue compression triggers refinancing headwinds.
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
              - CV012
