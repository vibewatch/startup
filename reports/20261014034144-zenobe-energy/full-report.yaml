      - number: '7.3'
        title: Capital Structure, Partner Dependencies, and Counterparty Exposure
        blocks:
          - type: paragraph
            body: >-
              The fleet electrification and grid infrastructure business model is intrinsically capital intensive,
              requiring extensive up-front project finance and debt capital before long-term service contracts amortize
              investments. To fund its turnkey Electric Vehicle as a Service (EVaaS) offering, Zenobē established a
              multi-source debt platform of £241 million ($326 million) arranged by NatWest, alongside subsequent debt
              syndications involving Santander, Rabobank, and institutional infrastructure lenders. The company is
              backed by major infrastructure equity sponsors including KKR, Infracapital, and Mubadala Capital,
              following a substantial £870 million growth recapitalization. However, maintaining multi-lender debt
              platforms creates ongoing refinancing, interest rate, and debt service covenant risks that require
              consistent contracted cash flows. On the counterparty side, Zenobē relies heavily on anchor municipal and
              regional transit operators—such as National Express in Coventry, Stagecoach, and Newport Transport—for
              long-term bus leasing revenues. Expansion into international markets, including deploying 30 electric
              trucks across Australia in partnership with the Winning Group with ARENA support, introduces cross-border
              execution, logistical delays, and international counterparty performance exposure.
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
