  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Service Architecture, and Addressable Spend
        blocks:
          - type: paragraph
            body: >-
              Zenobe Energy operates at the intersection of fleet electrification infrastructure and grid-scale flexible
              battery storage. The addressable commercial spend encompassed by Zenobe's business model comprises turnkey
              Electric Vehicle as a Service (EVaaS) infrastructure, long-term stationary depot battery storage for
              overcoming local grid distribution constraints, traction battery financing, and dedicated depot charging
              hardware. Excluded spend encompasses vehicle chassis manufacturing, vehicle assembly lines, and commodity
              driver payroll, which remain the responsibility of original equipment manufacturers and transit fleet
              operating companies. Status-quo substitutes include continued operation of fossil-fuel diesel buses,
              conventional depot diesel refueling, and unmanaged grid connections that risk severe peak-demand charges.
              Adjacent market opportunities span stationary utility-scale battery energy storage systems (BESS)
              delivering frequency response and dynamic trading capabilities directly to national transmission system
              operators.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing, Capital Sizing Lenses, and Fleet Scale
        blocks:
          - type: paragraph
            body: >-
              Sizing the commercial fleet electrification and battery storage market requires decomposing addressable
              spend across distinct capital deployment lenses rather than relying on a singular unconstrained top-down
              figure. In debt-funded infrastructure capacity, Zenobe secured a $1.3 billion senior debt financing
              facility backed by KKR to support transport fleet electrification across the UK and Ireland. On the equity
              capitalization front, KKR confirmed a £600 million ($748 million) equity investment alongside
              Infracapital, bringing Zenobe's cumulative equity and debt capital raised to approximately £1.8 billion by
              late 2023. At the regional operational level, Zenobe previously operated 394 electric buses alongside
              175MW of operational and contracted battery storage assets, representing an estimated 25% market share of
              the operational UK EV bus sector. Public subsidy frameworks further delineate the near-term addressable
              market: the UK Department for Transport's ZEBRA programme allocated £73.2 million in public grants matched
              by £94 million in private capital to deploy 484 zero-emission buses across ten regions, contributing to a
              nationwide target of 2,500 subsidized zero-emission buses.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
