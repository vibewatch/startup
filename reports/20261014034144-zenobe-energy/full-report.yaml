      - number: '7.2'
        title: Grid Interconnection, Planning, and Operational Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Zenobē's utility-scale battery storage deployments present distinct technical and operational execution
              failure modes across transmission network connection and high-frequency dispatch. The company's 100MW
              Capenhurst battery project in Chester represents Europe's largest grid-connected battery built to absorb
              reactive power directly from a 275kV transmission system under National Grid's stability pathfinder
              programme. While approved under an updated planning regime allowing battery facilities over 50MW to obtain
              local planning approval rather than national development consent, connecting directly to transmission
              infrastructure carries severe outage penalties if voltage stabilization requirements fail. Operationally,
              Zenobē mitigates degradation across its storage portfolio by partnering with Open Energi and Erova Energy,
              deploying the Dynamic Demand 2.0 Trader platform. This automated algorithmic software manages real-time
              battery state of charge, protects complex cell warranties, and optimizes continuous multi-market bidding
              across the Balancing Mechanism, wholesale power markets, and ancillary service tenders. A disruption or
              latency spike in automated dispatch models threatens revenue yield while accelerating unrecoverable
              battery degradation.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
