      - number: '6.3'
        title: Retention Dynamics, Expansion Loops, and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Customer retention and expansion in Zenobē's core fleet business are driven by strong operational lock-in
              and high switching barriers embedded within turnkey depot infrastructure. Because Zenobē finances depot
              electrical grid upgrades, installs proprietary software management systems, and assumes ongoing battery
              replacement obligations under 15-year service agreements, transit operators cannot easily transition
              between service providers without stranding capital or assuming unhedged battery performance risk.
              Furthermore, Zenobē integrates algorithmic trading and optimization capabilities, demonstrated at grid
              assets such as Hill Farm, to unlock revenue streams from grid balancing mechanisms and lower total energy
              procurement costs for counterparties. However, this model concentrates significant commercial risk in a
              small number of regional UK transit operators whose financial viability is exposed to broader
              macroeconomic pressures. Recent industry disclosures indicate that UK bus and coach registrations fell
              32.1% year-to-date in 2026 as operators absorbed severe cost inflation, highlighting that commercial
              transit customer budgets remain tightly constrained and heavily reliant on continued central government
              fleet decarbonization subsidies.
            claimRefs:
              - CU007
              - CU009
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Turnkey Battery Risk Transfer Drives High Customer Stickiness
            body: >-
              Zenobē's primary customer value proposition relies on absorbing capital expenditure and battery
              degradation risks under multi-year agreements. By financing depot electrical infrastructure and
              guaranteeing battery availability over 10-15 year horizons, Zenobē creates substantial operational
              switching barriers that protect contract durability across major regional transit accounts.
            calloutType: insight
            claimRefs:
              - CU007
              - CU009
          - type: callout
            title: Customer Base Concentration and Fleet Replacement Cycles
            body: >-
              Commercial bus operators face macro industry headwinds and reliance on municipal decarbonization
              subsidies, exposing Zenobē to policy shifts and high revenue concentration across a handful of regional
              transit concessionaires.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Subsidy Control, and Litigation Risks
        blocks:
          - type: paragraph
            body: >-
              Zenobē Energy operates in an evolving regulatory environment where public policy decisions and subsidy
              structures directly influence market economics. In late 2025 and early 2026, Zenobē initiated significant
              legal proceedings before the UK Competition Appeal Tribunal (CAT) under the Subsidy Control Act 2022,
              challenging decisions by the Gas and Electricity Markets Authority (GEMA). The litigation disputes GEMA's
              implementation of a cap-and-floor financial support mechanism for longer-duration energy storage (LDES)
              projects, arguing that GEMA erred in law by failing to evaluate statutory subsidy control principles prior
              to adopting the scheme. A conjoined hearing for both applications was scheduled before the tribunal for
              late April 2026, with third parties including NatPower, British Hydropower Association, Gresham House, and
              the Secretary of State for Energy Security and Net Zero seeking or addressing intervention rights. Beyond
              wholesale storage litigation, Zenobē's fleet electrification business faces policy hurdles from UK
              residual network charges, which create economic disincentives by penalizing bus depots that charge
              electric fleets overnight. Furthermore, historical inconsistencies in public capital funding schemes,
              including transitions between the Ultra Low Emission Bus (ULEB) and Zero Emission Bus Regional Areas
              (ZEBRA) grant frameworks, introduce procurement timing friction across municipal transit partnerships.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
