  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Turnkey Fleet Electrification and Depot Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Zenobē's commercial flagship offering is its Electric Vehicle as a Service (EVaaS) model for municipal and
              commercial fleet operators. Launched as a turnkey package, the solution bundles behind-the-meter charging
              infrastructure, stationary depot battery energy storage systems, on-vehicle battery financing and
              maintenance, and depot operational software. A primary engineering barrier to urban fleet electrification
              is local grid capacity: utility substations often require years and millions of pounds to upgrade before
              accommodating multi-megawatt depot charging demands. Zenobē bypasses this constraint by installing
              stationary depot battery energy storage systems that charge slowly from available grid capacity during
              off-peak hours and discharge rapidly to power overnight electric bus charging cycles. Zenobē reports
              supporting over 3,400 electric vehicles globally across the UK, Australia, and New Zealand, providing
              operational telemetry, battery health tracking, and contracted availability guarantees that shift asset
              degradation risk away from fleet operators.
            claimRefs:
