  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Zenobē Energy presents a compelling core infrastructure thesis anchored by its defensible market
              leadership in European and UK fleet electrification alongside innovative utility-scale battery storage
              deployments. Across the UK, the company owns and operates approximately 20% to 25% of the operational
              electric bus sector, servicing commercial operators through multi-year turnkey infrastructure and battery
              leasing contracts. Globally, Zenobē supports more than 3,400 electric fleet vehicles across 120 depots,
              creating highly sticky customer integrations with predictable long-term service cash flows. In stationary
              energy storage, Zenobē has deployed over 175MW of operational and contracted battery capacity, pioneering
              automated algorithmic trading through Dynamic Demand 2.0 Trader with Open Energi and Erova Energy to
              capture wholesale and Balancing Mechanism revenues. However, this infrastructure thesis is counterbalanced
              by a formidable financial and operational anti-thesis. Zenobē has accumulated over $1.3 billion in debt
              financing to fund capital-intensive depot construction and battery procurement. Furthermore, its
              stationary battery revenues remain exposed to merchant power price spreads and ancillary service
              saturation, which introduces cash flow volatility just as public pure-play peers face sharp market
              derating. Without contractual floor protections across its battery portfolio, asset-level cash generation
              remains vulnerable to grid trading compression.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
      - number: '8.2'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Zenobē's growth has been fueled by successive multi-hundred-million-pound capital raises combining
              institutional equity with structured bank debt. In November 2020, M&G's infrastructure arm contributed
              £150 million in equity, enabling an initial £450 million deployment program for 500MWh of battery storage
              and 1,000 electric buses. The company subsequently secured landmark debt platforms, including a £241
              million facility structured by NatWest in February 2022 and a €325 million multi-currency debt facility in
              July 2025 from European commercial lenders to expand its Electric Vehicle as a Service model across the EU
              and EEA. Globally, Zenobē has also accessed public grant funding, such as Australian Renewable Energy
              Agency support for electric truck deployments with the Winning Group. In late 2023, infrastructure
              sponsors KKR, Infracapital, and Mubadala invested £870 million in growth equity, with Dealroom tracking an
              indicative enterprise valuation of £800 million. However, public market benchmarks for pure-play energy
              storage platforms show severe multiple compression: comparable battery integrator Fluence Energy saw its
              market capitalization collapse by 64.3% in 2026 to $1.31 billion. Zenobē's private marks remain entirely
              unverified against public multiples, and the lack of published audited revenues, EBITDA margins, and
              capital structure seniority prevents validating whether private sponsor valuations reflect durable equity
              value or debt-heavy asset accumulation.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Scenario Analysis and Return Drivers
        blocks:
          - type: paragraph
            body: >-
              To evaluate prospective risk-adjusted returns, we model three distinct commercial scenarios reflecting
              fleet expansion velocity, merchant battery returns, and debt service sustainability. Under the Bull Case,
              Zenobē successfully accelerates European deployment using its €325 million debt facility, converting
              municipal transit tenders across Germany, Spain, and Benelux to lift contracted recurring revenues to over
              70% of total revenue. In this trajectory, stationary storage expansion surpasses 1GWh with contracted
              capacity payments, driving enterprise value toward £1.5B–£2.0B on an infrastructure-grade 12-14x EBITDA
              multiple. The Base Case models steady execution where Zenobē maintains its 20% to 25% UK bus market share
              and delivers incremental European depot expansions, while merchant battery trading revenues normalize to
              lower historical baselines. Enterprise value in this case stabilizes around £800m–£1.0B, generating
              single-digit equity IRRs that reflect private infrastructure cost of capital. Conversely, the Bear Case
              reflects the severe downside of excessive leverage combined with merchant revenue erosion. If wholesale
              battery arbitrage margins compress further and transit authorities delay electric bus procurement,
              Zenobē's debt burden exceeding $1.3 billion would severely impair equity returns, echoing the steep
              multiple compression observed in public peer Fluence Energy (-64.3% in 2026). In this downside scenario,
              debt service covenants could trigger dilutive sponsor equity injections or restructurings.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV011
              - CV012
      - number: '8.4'
        title: Recommendation and Diligence Framework
        blocks:
          - type: paragraph
            body: >-
              Synthesizing operational delivery, market positioning, and financial transparency yields a recommendation
              of research-more with medium confidence, high risk rating, and an unknown valuation stance. Zenobē has
              unquestionably proven industrial-scale execution, managing over 3,400 electrified fleet vehicles globally
              and securing tier-one infrastructure partners including KKR and NatWest. Nonetheless, investment
              underwriting requires verifiable pricing discipline. Because Zenobē remains private and does not publicly
              disclose audited corporate P&L accounts, division-level gross margins, or debt amortization schedules,
              assigning a specific equity price target or endorsing private Dealroom marks of £800 million would
              represent false precision. The high risk rating directly captures the company's significant debt leverage
              exceeding $1.3 billion amidst volatile power markets and sharp public peer multiple contractions. Before
              capital can be committed, diligence must obtain Zenobē's complete audited financial filings, contractual
              merchant-versus-fixed revenue ratios, senior debt covenant compliance certificates, and the exact
              liquidation preference waterfall established in the 2023 sponsor recapitalization. Only definitive
              confirmation of robust operating cash flows and adequate debt service headroom would justify upgrading the
              stance to an actionable buy.
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV009
              - CV010
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Commitment Requires Audited Financial Visibility
            body: >-
              While Zenobē exhibits top-tier sponsor support and substantial operational scale across UK battery storage
              and European EV fleet depots, private market opacity prevents underwriting an equity entry at unverified
              marks. Diligence must establish audited division-level EBITDA and debt covenants before committing
              capital.
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV013
              - CV014
