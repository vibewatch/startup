      - number: '6.2'
        title: Adoption Trajectory and Named Deployment Proof
        blocks:
          - type: paragraph
            body: >-
              Zenobē's commercial adoption trajectory has expanded rapidly from pilot vehicle trials in 2018 to
              infrastructure-scale depot operations. By December 2023, the platform had supported over 1,500 electric
              vehicles across 75 commercial depots globally, representing a significant scaling from 394 electric buses
              and a 25% UK operational market share recorded in early 2022. Headline deployment proof includes
              Coventry's landmark All-Electric Bus City initiative, where Zenobē provided end-to-end depot charging
              infrastructure and battery solutions supporting 130 National Express electric buses operating in full
              commercial revenue service. In May 2024, Zenobē augmented its capital base with £410 million in green
              fleet debt financing to fund a pipeline targeting more than 2,000 electric buses across the UK and Ireland
              by 2026. This debt facility directly supports long-term fleet management agreements, such as its 15-year
              battery service contract for 39 electric vehicles with Transdev Blazefield in Harrogate, as well as
              on-board battery financing for 24 electric single-decker buses with Nottingham City Transport designed to
              enhance local government zero-emission regional funding allocations.
            claimRefs:
