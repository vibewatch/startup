  - id: TE002
    title: Core Use-Case and Operational Workflow Solutions
    columns:
      - User Job / Use Case
      - Traditional Workflow
      - Zenobē Solution
      - Measurable Operational Benefit
      - Key Limitation / Trade-off
    rows:
      - - Depot Bus Electrification
        - Operator buys e-buses and finances expensive grid connection upgrades at local depot
        - Turnkey EVaaS with behind-the-meter stationary depot batteries buffering constrained grid connections
        - Avoids multimillion-pound grid reinforcement capex and shortens depot electrification timeline
        - Ties depot space to stationary battery footprint and creates long-term leasing commitments
      - - Transmission Grid Stabilisation
        - Fossil-fuel spinning generators run out of merit to provide system inertia and short-circuit level
        - Grid-forming battery storage systems mimicking synchronous generators via advanced inverter control
        - Delivers synthetic inertia and reactive power with zero direct emissions under NESO Pathfinder contracts
        - High upfront battery capex and technological complexity of grid-forming inverter controls
      - - Battery Revenue Optimisation
        - Manual or rule-based trading in single electricity markets risking warranty breaches
        - Automated algorithmic trading (Dynamic Demand 2.0 Trader) taking multi-market positions
        - Maximises revenue across Balancing Mechanism and wholesale markets while actively managing state of charge
        - Third-party software revenue sharing and reliance on partner algorithmic models
      - - Clean Off-Grid Portable Power
        - Diesel generators run continuously at film shoots, sports events, and temporary sites
        - Refurbished second-life EV batteries packaged into mobile portable power units
        - Zero-emission, silent onsite power replacing diesel combustion and extending battery economic life
        - Lower energy density than new cells and uncertain cycle life under heavy transient loads
    notes: >-
      Workflows derived from Zenobē commercial case studies, NESO stability pathfinder specifications, and published
      partner case histories.
