evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited standalone financial statements disclosing detailed annual revenue, EBITDA, and contracted versus merchant
      cash flow mix by division.
    whyItMatters: >-
      Essential to underwrite debt service headroom, equity return multiples, and operational profitability beyond
      top-line asset scale.
    diligencePath: >-
      Review UK Companies House statutory filings for Zenobe Energy Limited and request sponsor financial models from
      KKR and Infracapital.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Comprehensive executive committee organizational roster and independent non-executive board member listings.
    whyItMatters: Determines key-person dependency risks and sponsor board representation between KKR, Infracapital, and management.
    diligencePath: Request official board governance charter and executive organizational chart during corporate diligence.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete capitalization table, share class rights, liquidation preferences, and individual lender commitments
      within the £980m and £241m debt syndicates.
    whyItMatters: >-
      Clarifies control rights, minority veto thresholds, and priority of claim across senior debt versus sponsor
      equity.
    diligencePath: Review definitive facility agreements and shareholder agreements in the data room.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: independent-tam-sizing
    missingEvidence: >-
      Granular third-party market sizing studies separating annual commercial fleet depot charging capex from long-term
      merchant battery storage capacity spend.
    whyItMatters: >-
      Without independent segment-by-segment TAM and SAM benchmarks, sizing relies on aggregate debt facilities and
      vendor announcements that conflate capital raises with addressable annual market turnover.
    diligencePath: >-
      Obtain independent transport research reports (such as BloombergNEF or Wood Mackenzie) and procurement tenders
      from regional transport authorities.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: contracted-versus-merchant-revenue-split
    missingEvidence: >-
      Audited financial breakdown of fleet electrification EVaaS recurring service fees versus merchant Balancing
      Mechanism trading revenue.
    whyItMatters: >-
      Assessing creditworthiness and debt service sustainability for the $1.3 billion debt facility requires visibility
      into contracted revenue floors versus merchant volatility.
    diligencePath: >-
      Request private lender presentation models and contracted asset revenue schedules during management diligence
      sessions.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM001
  - type: missing-source
    severity: material
    topic: bess-merchant-revenues
    missingEvidence: >-
      Granular third-party revenue breakdown distinguishing tolling contract fees, capacity market payments, and
      merchant wholesale arbitrage margins for UK grid-scale BESS operators.
    whyItMatters: >-
      Essential for underwriting whether Zenobē's 731MW operational storage fleet can maintain debt-service coverage if
      capacity market and ancillary service prices continue to compress.
    diligencePath: >-
      Request audited asset-level financial models and route-to-market contract terms from EDF Energy and Kraken trading
      agreements.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margin percentages, asset-level operating expenses, and contract-specific debt service coverage
      ratios.
    whyItMatters: >-
      Without segmented gross margins, underwriters cannot determine whether turnkey EVaaS operations produce positive
      unit margins after debt amortization and battery degradation.
    diligencePath: >-
      Review audited statutory accounts and request a lender-grade financial model with asset-level cash flow
      waterfalls.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
