company:
  name: Zenobē Energy
chapter:
  number: 1
  title: Company Overview
  summary: Zenobē Energy is a London-headquartered EV fleet electrification and battery storage infrastructure platform established
    in 2017. Backed jointly by KKR and Infracapital alongside minority utilities JERA and TEPCO Power Grid, the business has
    secured over £3.2bn in total capital, operating more than 1GW of battery storage assets and supporting over 3,400 electric
    vehicles across 120+ depots globally.
sections:
- id: corporate-identity-and-leadership
  title: Corporate Identity, Governance, and Founding History
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO009
  tableRefs:
  - TO001
  - TO002
  body: Zenobē Energy was established in August 2017 by its three co-founders Nicholas Beatty, James Basden, and Steven Meersman,
    establishing headquarters in London to address systemic constraints in grid-scale battery storage and fleet decarbonization
    [CO001]. The company operates a dual-pronged infrastructure model, combining turnkey fleet electrification services for
    commercial bus and delivery operators with utility-scale battery energy storage systems (BESS) designed for grid stability
    and power market arbitrage [CO002]. Executive leadership remains strongly anchored by founder-directors Nicholas Beatty
    and Steven Meersman, who maintain strategic and operational continuity through institutional capital expansions [CO003].
    Corporate finance execution and institutional syndication are directed by functional leadership including Head of Corporate
    Finance Ciaran Kelly, who manages multi-currency debt and equity structuring across battery and mobility verticals [CO004].
    Supported by rapid scaling in commercial operations, Zenobē expanded its workforce from 230 global personnel in September
    2023 to 300 full-time equivalents by June 2026, reflecting deepening technical, software, and financial capabilities across
    international jurisdictions [CO009].
- id: capital-structure-and-sponsor-backing
  title: Capital Structure, Sponsor Backing, and Debt Syndication
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  tableRefs:
  - TO003
  body: Zenobē's capital structure is characterized by heavyweight infrastructure sponsor ownership and multi-tiered debt
    facilities designed to fund capital-intensive assets off public market balance sheets [CO005]. In September 2023, global
    investment firm KKR invested approximately £600 million alongside an additional £270 million equity injection from existing
    majority shareholder Infracapital, establishing KKR and Infracapital as joint majority owners with combined equity backing
    surpassing £850 million [CO005]. Japanese utility majors JERA and TEPCO Power Grid continue to retain strategic minority
    equity stakes from their initial 2019 growth round, providing strategic technical alignment across energy markets [CO006].
    On the credit side, Zenobē pioneered scalable debt structures, closing a landmark £241 million (US$326 million) multi-source
    private placement facility structured by NatWest in February 2022 to finance e-buses and charging hardware [CO008]. This
    platform expanded decisively in June 2026, when Zenobē finalized a £980 million debt financing round with a consortium
    of tier-one institutional banks, pushing cumulative capital raised beyond £3.2 billion since inception and validating
    commercial bank appetite for infrastructure-as-a-service models [CO007].
- id: operational-scale-and-corporate-milestones
  title: Operational Scale, Fleet Deployments, and Milestone Evolution
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  figureRefs:
  - FO001
  body: From early algorithmic battery trading to global commercial fleet management, Zenobē has progressively scaled its
    physical asset footprint across five international markets [CO010]. As of March 2026, the company manages over 3,400 electric
    vehicles across more than 120 operational depots globally, while operating or constructing more than 1GW of transmission-connected
    battery storage assets in Great Britain alone [CO010]. Technological differentiation began in May 2020 at the 10MW Hill
    Farm BESS site, where Zenobē implemented the Dynamic Demand 2.0 Trader automated algorithmic optimization platform with
    Open Energi and Erova Energy, achieving direct Balancing Mechanism access and software-driven revenue maximization [CO013].
    International footprint expansion accelerated through strategic execution in Australia, deploying 30 electric commercial
    trucks with the Winning Group under an Electric Vehicle as a Service (EVaaS) structure backed by ARENA [CO014]. In March
    2026, Zenobē acquired California-based commercial fleet operator Revolv, absorbing 13 operational depots and over 100
    electric vehicles into its North American division [CO011]. However, rapid BESS deployment has intersected with regulatory
    controversy; in April 2026, Zenobē initiated a second high-stakes Subsidy Control challenge before the Competition Appeal
    Tribunal against GEMA's cap-and-floor subsidy regime for longer-duration storage, demonstrating active corporate defense
    of commercial merchant revenues against subsidized utility programs [CO012].
