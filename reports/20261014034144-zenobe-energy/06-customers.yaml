callouts:
  - calloutType: "insight"
    title: "Turnkey Battery Risk Transfer Drives High Customer Stickiness"
    body: "Zenobē's primary customer value proposition relies on absorbing capital expenditure and battery degradation risks under multi-year agreements. By financing depot electrical infrastructure and guaranteeing battery availability over 10-15 year horizons, Zenobē creates substantial operational switching barriers that protect contract durability across major regional transit accounts."
    claimRefs:
      - "CU007"
      - "CU009"
  - calloutType: "risk"
    title: "Customer Base Concentration and Fleet Replacement Cycles"
    body: "Commercial bus operators face macro industry headwinds and reliance on municipal decarbonization subsidies, exposing Zenobē to policy shifts and high revenue concentration across a handful of regional transit concessionaires."
    claimRefs:
      - "CU013"
      - "CU014"
