        - label: "3. Infrastructure Construction & Commissioning"
          stage: "Deployment"
          touchpoints:
            - "Depot charger installation"
            - "Stationary battery integration"
            - "Hardware commissioning"
          description: "Delivery of physical depot hardware, including smart chargers and stationary battery storage to overcome local grid capacity constraints."
