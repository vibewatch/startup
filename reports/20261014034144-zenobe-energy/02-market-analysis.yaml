callouts:
  - calloutType: "risk"
    title: "Debt Servicing Sensitivity and Adoption Bottlenecks"
    body: "Zenobe's $1.3 billion debt facility requires stable contracted cash flows to service senior debt obligations. Fleet electrification remains vulnerable to depot grid connection delays, commercial EV supply bottlenecks, and potential regulatory shifts, which could strain balance sheet leverage if fleet deployment pace slows."
    claimRefs:
      - "CM005"
      - "CM013"
  - calloutType: "insight"
    title: "Turnkey EVaaS Architecture Unlocks Municipal Budgets"
    body: "By bundling charging infrastructure, stationary depot batteries, vehicle batteries, and intelligent software into an Electric Vehicle as a Service contract, Zenobe removes upfront capital barriers for bus operators and aligns directly with public co-funding schemes like ZEBRA."
    claimRefs:
      - "CM002"
      - "CM008"
      - "CM011"
