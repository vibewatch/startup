            body: >-
              Zenobē 的商业采用从 2018 年试点车辆测试，快速扩展到基础设施规模的车库运营。截至 2023 年 12 月，该平台已在全球 75 个商业车库支持超过 1,500 辆电动车，较 2022 年初记录的
              394 辆电动公交和英国运营市场 25% 份额显著增长。代表性部署验证包括 Coventry 的标志性全电动公交城市计划：Zenobē 提供端到端车库充电基础设施和电池方案，支持 130 辆 National
              Express 电动公交投入完整商业收入运营。2024 年 5 月，Zenobē 通过 £410 million 绿色车队债务融资充实资本基础，为截至 2026 年在英国和爱尔兰部署超过 2,000
              辆电动公交的项目储备提供资金。该债务融资直接支持长期车队管理协议，包括在 Harrogate 与 Transdev Blazefield 签订的 15 年期、覆盖 39 辆电动车的电池服务合同，以及为
              Nottingham City Transport 的 24 辆电动单层公交提供车载电池融资，以提升地方政府零排放区域资金的配置效率。
