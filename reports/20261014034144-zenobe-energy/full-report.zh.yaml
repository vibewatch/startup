      - number: '3.2'
        title: 差异化、技术整合与能力基准
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的核心差异化来自项目开发、资产持有、电力工程和运营软件的全栈整合。传统公交运营商若自行电气化车库，会遇到多年接入延迟，以及配电网络运营商（DNO）收取的高额资本升级费用。Zenobē
              通过把固定式电池储能直接部署在公交车库内，缓冲高功率夜间充电，避免昂贵电网升级，从而解决配电瓶颈。在输电规模上，Zenobē 通过交付苏格兰 300MW Kilmarnock South
              电池等重大稳定性项目实现差异化；该项目配备成网型逆变器，并与 Wärtsilä 和 Omexom 合作。公司还通过 Open Energi、Erova Energy、EDF Energy 和 Kraken
              等合作接入自动交易平台，在平衡机制和辅助服务市场进行动态调度，这是未整合车队竞争者无法复制的能力。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP012
          - type: table
