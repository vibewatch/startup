  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、EV 即服务与电网灵活性模式
        blocks:
          - type: paragraph
            body: >-
              Zenobē Energy 采用覆盖车队电气化和并网电池储能的双引擎商业模式。在车队业务中，公司把电动车、车库充电基础设施、电池更换保修和自有管理软件打包成完整的电动车即服务（EVaaS）方案。根据
              Dealroom 市场分析，Zenobē
              通过销售和运营电池解决方案，以及与商业和市政车队运营商签订长期服务协议来获取商业收入。这套一站式方案让商业公交和重型货车运营商转向零排放车队，无需承担高额前置资本支出或电池残值风险。Zenobē
              通过长期合同月度服务协议摊销前期资本投入，形成稳定且高度可预测的经常性收入。同时，Zenobē 运营公用事业级电池储能系统，从英国 National Grid 和区域配电网络运营商处获取多种收入。借助 Open
              Energi 和 Erova Energy 等自动交易伙伴，公司使用算法优化软件直接参与平衡机制、容量市场拍卖和批发电力套利。该动态能力使 10MW Hill Farm
              电池等资产能够优化充放电周期，捕捉波动的电力市场价差。这些车队合同服务费与变化的电网灵活性收入共同构成 Zenobē 在英国、欧洲大陆和澳大拉西亚快速扩张运营版图的商业基础。
