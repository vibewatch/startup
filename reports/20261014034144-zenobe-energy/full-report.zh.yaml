      - number: '8.2'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的增长靠连续数轮数亿英镑级别融资推动，机构股权与结构化银行债务并用。2020 年 11 月，M&G 的基础设施部门注资 £150 million 股权，启动 £450 million
              的首期部署计划，用于建设 500MWh 电池储能和 1,000 辆电动公交车。之后，公司又拿下多项标志性债务平台，包括 NatWest 于 2022 年 2 月安排的 £241 million
              融资，以及欧洲商业银行于 2025 年 7 月提供的 €325 million 多币种债务融资，用于在 EU 和 EEA 扩展 Electric Vehicle as a Service 模式。Zenobē
              还获得过公共补助，例如 Australian Renewable Energy Agency 支持其与 Winning Group 合作部署电动卡车。2023 年末，KKR、Infracapital 和
              Mubadala 投入 £870 million 增长股权；Dealroom 追踪的指示性企业估值为 £800 million。

              但上市市场对纯储能平台的估值基准显示倍数严重压缩：可比电池集成商 Fluence Energy 的市值在 2026 年下跌 64.3%，降至 $1.31 billion。Zenobē
              的私募估值标记尚未与公开市场倍数完成任何验证；公司也未公布经审计收入、EBITDA 利润率和资本结构债权优先级，因此无法判断私募投资方估值反映的是可持续股权价值，还是高负债驱动的资产堆积。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
