      - number: '8.3'
        title: 情景分析与回报驱动因素
        blocks:
          - type: paragraph
            body: >-
              为评估预期的风险调整后回报，我们构建三个商业情景，分别反映车队扩张速度、现货电池回报和偿债可持续性。乐观情景下，Zenobē 利用 €325 million 债务融资加快欧洲部署，拿下德国、西班牙和
              Benelux 的市政交通招标，把合同经常性收入提升至总收入的 70% 以上。沿着这条路径，固定式储能扩张超过 1GWh，并获得合同容量付款；按基础设施级 12-14x EBITDA 倍数，企业价值升至
              £1.5B–£2.0B。

              基准情景假设执行平稳：Zenobē 保持 20% 至 25% 的英国公交市场份额，持续增加欧洲车库，同时现货电池交易收入回归较低的历史基线。此时企业价值稳定在 £800m–£1.0B，股权 IRR
              为个位数，反映私募基础设施资本成本。相反，悲观情景显示高杠杆叠加现货收入下滑的严重下行风险。若批发电池套利利润率继续收窄，且交通主管部门推迟采购电动公交车，Zenobē 超过 $1.3 billion
              的债务负担将严重侵蚀股权回报，重演上市同业 Fluence Energy 的估值倍数大幅压缩（2026 年 -64.3%）。在这一下行情景下，偿债契约可能触发稀释性投资方注资或重组。
