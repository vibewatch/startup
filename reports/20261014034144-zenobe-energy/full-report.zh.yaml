      - number: '4.2'
        title: 资本结构、发起方支持与债务融资
        blocks:
          - type: paragraph
            body: >-
              Zenobē Energy 的资产负债表反映出基础设施级资产开发商常见的大量机构支持和高债务资本化。2023 年 9 月，全球投资管理公司 KKR 完成对 Zenobē 的 $750m 股权投资，与现有大股东
              Infracapital 组成共同控股伙伴关系，推动国际扩张。Infracapital 此前在 2020 年 11 月承诺 £150m 成长股权；更早之前，日本电力公用事业 JERA 和 TEPCO Power
              Grid 也持有战略性少数股权。为了支付资本密集型车库基础设施和车辆采购，Zenobē 搭建了项目层面和平台层面的多项债务融资。2022 年 2 月，公司建立由 NatWest 设计的
              £241m（$326m）多来源债务结构，为电动公交和充电硬件融资。2025 年，公司又完成与国际银行银团签署的 €325m 债务融资，为欧洲车队扩张提供支持。根据 Dealroom 市场记录，Zenobē
              的债务融资方包括 NatWest、Santander、Rabobank 和 Credit Agricole CIB
              等一线基础设施贷款机构。虽然高杠杆显示贷款方信心较强，但也带来持续的偿债义务，要求资产保持严格利用率。
