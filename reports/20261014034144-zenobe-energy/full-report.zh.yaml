      - number: '6.3'
        title: 留存动态、扩张循环与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              Zenobē 核心车队业务的客户留存和扩张，靠一站式车库基础设施内置的强运营锁定和高切换门槛驱动。Zenobē 为车库电网升级提供融资、安装自有软件管理系统，并在 15
              年服务协议下承担持续电池更换义务；因此，公交运营商若切换服务商，就会面临资本闲置或承担未对冲的电池性能风险，难以轻易迁移。此外，Zenobē 还整合算法交易和优化能力，并在 Hill Farm
              等电网资产上得到验证，帮助交易对手从电网平衡机制获取收入、降低总能源采购成本。不过，这一模式把大量商业风险集中到少数英国区域公交运营商身上，它们的财务可持续性暴露于更广泛的宏观经济压力。近期行业披露显示，英国公交和长途客车注册量在
              2026 年年初至今下降 32.1%，因为运营商正在消化严重的成本通胀；这说明商业交通客户预算仍受到严格约束，并高度依赖中央政府持续提供车队脱碳补贴。
            claimRefs:
              - CU007
              - CU009
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: 展示项
        blocks:
