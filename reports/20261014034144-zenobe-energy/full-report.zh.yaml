  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正论与反论
        blocks:
          - type: paragraph
            body: >-
              Zenobē Energy 的核心基础设施投资逻辑很有吸引力：公司在欧洲和英国车队电动化领域保持可守住的市场领先地位，同时部署创新的公用事业级电池储能。在英国，公司拥有并运营约 20% 至 25%
              的在运营电动公交车市场，靠多年期交钥匙基础设施和电池租赁合同服务商业运营商。Zenobē 在全球 120 个车库支持超过 3,400
              辆电动车，客户系统一旦接入就很难替换，也带来可预测的长期服务现金流。固定式储能领域，公司已部署超过 175MW 的运营中及已签约电池容量，并与 Open Energi、Erova Energy 借助
              Dynamic Demand 2.0 Trader 开创自动化算法交易，捕捉批发市场和 Balancing Mechanism 收入。

              但这套基础设施逻辑也被严峻的财务和运营反论抵消。Zenobē 已累计超过 $1.3 billion
              债务融资，用于资本密集型车库建设和电池采购。固定式电池收入还暴露于电力现货价差和辅助服务饱和风险；恰逢上市纯电池储能同业遭遇市场估值大幅下调，现金流波动因此更大。若电池资产组合缺乏合同最低收益保护，资产层面的现金创造仍容易受到电网交易价差收窄的挤压。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
