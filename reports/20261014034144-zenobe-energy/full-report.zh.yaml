      - number: '2.3'
        title: 买方细分、预算归属与采用经济性
        blocks:
          - type: paragraph
            body: >-
              Zenobe 的商业版图覆盖三类客户：市政公交运营商、货运和物流车队，以及输电系统运营商。核心市政交通买方包括 Stagecoach West、National Express 和 Newport
              Transport 等大型私营公交集团，它们需要应对城市清洁空气区要求和市政净零排放期限。预算过去主要来自市政交通资本采购；但 Zenobe 的一站式融资模式最初由 NatWest 顾问设计、依托 £241
              million 债务平台，将支出从前置资产负债表债务转为长期合同运营费用。在货运配送领域，澳大利亚 Winning Group 等商业物流企业会签约购买整合式卡车与车库 EVaaS
              套餐。采用动力来自相对于波动柴油价格的总拥有成本优势，以及合同风险转移：Zenobe 保证电池荷电状态、车库充电可靠性和车辆可用率。
            claimRefs:
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 监管催化剂、市场改革与资产负债表约束
        blocks:
          - type: paragraph
            body: >-
              采用速度受电网结构性瓶颈和能源市场系统性改革影响。输电和配电电网接入延迟是车队车库改造的首要运营瓶颈，因此需要现场固定式电池储能来缓冲充电负荷。在收入端，Elexon
              监督的监管改革以及平衡与结算守则（BSC）正在 Clean Power 2030 议程下重塑灵活市场接入，尤其包括全市场半小时结算（MHHS）和新定义的灵活市场市场促进者角色。与 Open Energi 和
              Erova Energy 的软件合作，使 Zenobe 的电网资产能够算法化参与 National Grid 的平衡机制。但采用约束依然明显：偿付 $1.3 billion
              债务负担需要稳定的长期收入；如果商业车队部署遭遇车辆供应链延误、电池化学体系演进造成的技术过时，或地方基础设施许可延误，公司就会面临现金流压力。
            claimRefs:
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 偿债敏感性与采用瓶颈
            body: Zenobe 的 $1.3 billion 债务融资要求稳定的合同现金流来偿付高级债务。车队电气化仍容易受到车库电网接入延迟、商用电动车供应瓶颈和潜在监管变化影响；一旦车队部署放慢，资产负债表杠杆可能承压。
            calloutType: risk
            claimRefs:
              - CM005
              - CM013
          - type: callout
            title: 一站式 EVaaS 架构释放市政预算
            body: Zenobe 把充电基础设施、固定式车库电池、车辆电池和智能软件打包成电动车即服务合同，消除公交运营商的前置资本门槛，并直接对接 ZEBRA 等公共共同出资计划。
            calloutType: insight
