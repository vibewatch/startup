    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、治理与创立历程
        blocks:
          - type: paragraph
            body: >-
              Zenobē Energy 于 2017 年 8 月由三位联合创始人 Nicholas Beatty、James Basden 和 Steven Meersman
              创立，总部设在伦敦，着眼于解决电网级电池储能和车队脱碳的系统性约束
              [CO001]。公司的基础设施模式有两条主线：为商业公交和配送运营商提供一站式车队电气化服务，同时建设面向电网稳定和电力市场套利的公用事业级电池储能系统（BESS）[CO002]。创始人兼董事 Nicholas
              Beatty 和 Steven Meersman 仍深度参与高管层，在机构资本持续扩张中保持战略和运营连续性 [CO003]。公司融资执行和机构银团工作由职能负责人主导，其中包括企业融资主管 Ciaran
              Kelly；他负责电池和出行两大业务的多币种债务与股权架构 [CO004]。商业运营快速扩张后，Zenobē 的全球员工从 2023 年 9 月的 230 人增至 2026 年 6 月的 300
              名全职等效员工，反映出公司在各国际司法辖区的技术、软件和金融能力不断加深 [CO009]。
            claimRefs:
