      - number: '2.2'
        title: 市场规模、资本规模视角与车队规模
        blocks:
          - type: paragraph
            body: >-
              要估算商业车队电气化和电池储能市场，必须从不同资本部署视角拆分可触达支出，而不能依赖一个不受约束的单一自上而下数字。债务融资支持的基础设施产能上，Zenobe 获得 KKR 支持的 $1.3 billion
              高级债务融资，用于英国和爱尔兰的交通车队电气化。股权资本化上，KKR 确认投资 £600 million（$748 million）股权，另有 Infracapital 参与，使 Zenobe 截至 2023
              年末累计募集的股权和债务资本约为 £1.8 billion。区域运营上，Zenobe 此前运营 394 辆电动公交，并拥有 175MW 运营中及已签约的电池储能资产，估计占英国运营中电动公交市场 25%
              的份额。公共补贴框架进一步划定了近期可触达市场：英国交通部的 ZEBRA 计划拨出 £73.2 million 公共补助，并由 £94 million 私人资本配套，在十个地区部署 484 辆零排放公交，为全国
              2,500 辆获补贴零排放公交目标提供支持。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
