      - number: '3.3'
        title: 商业打包、定价结构与客户锁定
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的商业模式围绕长期可用性服务协议搭建，替车队运营商消除前置资本门槛和运营技术风险。Zenobē
              不要求交通主管部门一次性购买车辆、电池和高功率充电硬件，而是把车辆、充电基础设施、车库微电网储能以及持续电池健康管理打包进长期服务合同。这些合同由结构化债务平台融资，包括英国 £241 million 债务和欧洲
              €325 million 融资，并获得领先机构基础设施贷款方支持。Zenobē 承担车辆电池衰减和残值风险，降低车队运营商的总拥有成本，消除相对柴油替代方案的感知绿色溢价。一旦运营商采用 Zenobē
              的一体化车库电力架构，切换成本就会变得很高，因为充电硬件、远程信息处理和电力接入都深度嵌入客户的日常交通班次。
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP012
              - CP013
