  - id: TV002
    title: 正论 / 反论表
    columns:
      - 支柱
      - 正论
      - 反论
      - 改变判断的触发因素
    rows:
      - - 车队电动化（EVaaS）
        - 可守住的英国 20-25% 市占率，以及与公交运营商签订的多年交钥匙基础设施合同
        - 高资本密度，以及区域公交运营商客户集中度高
        - 欧洲扩张市场中合同续签盈利且利润率扩张的证据
      - - 电网级电池储能
        - 175MW+ 合同容量及算法平衡交易收入带来的先发商业部署
        - 电池电网饱和度上升导致现货市场收入风险和收入下滑
        - 锁定 10+ 年合同保底价格或容量市场指数化定价
      - - 资本结构与出资方
        - KKR、Infracapital 和 M&G 强力提供股权支持，并可接入欧洲主要银行银团
        - 过高债务杠杆（> $1.3B 债务）造成沉重偿债负担和再融资风险
        - 披露审慎的偿债覆盖率（>1.5x）及出资方股权次级受偿安排
      - - 估值与退出期限
        - 未来 IPO 或出售给全球公用事业出资方时，基础设施平台可获得显著溢价
        - 公开清洁能源储能可比公司（Fluence 2026 年 -64.3%）面临估值倍数压缩
        - 公开能源储能估值倍数反弹，且经审计 EBITDA 利润率达到两位数
    notes: 分析将投资正论驱动因素与下行执行风险、财务风险进行对照。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 欧盟快速扩张，新增车辆达到 1,000+ 辆；合同收入占比超过总收入的 70%；BESS 容量超过 1GWh
        - 企业价值按 12-14x EBITDA 达到 £1.5B–£2.0B；经常性收入支撑基础设施估值倍数
        - 车库接入环节执行受阻，供应商电池交付延迟
        - 低至中（20-25%）
      - - 基准情景
        - 保住英国市场领先地位（20-25% 市占率）；稳步推进欧盟铺开；电池现货市场回报回归历史均值
        - 企业价值按投入资本计为 £800m–£1.0B；股权回报温和，达到私募基础设施投资门槛
        - 浮动利率债务工具利息成本上升，市政电动巴士采购放缓
        - 中至高（50-55%）
      - - 悲观情景
        - 电网饱和导致电池现货市场收入崩塌；高杠杆（> $1.3B 债务）压低股权价值；可比公司倍数收缩
        - 大幅股权稀释或折价轮重组融资；高级贷款人债务负担下股权价值受损
        - 债务契约违约；公交重新招标中流失客户；估值倍数大幅下调
        - 中（25-30%）
    notes: 情景根据车队电动化速度、储能现货市场现金流稳定性和偿债可持续性，对潜在结果建模。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV011
      - CV012
