      - number: '1.2'
        title: 资本结构、发起方支持与债务银团
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的资本结构以大型基础设施投资方持股和多层债务融资为特征，用于把资本密集型资产放在公开市场资产负债表之外融资 [CO005]。2023 年 9 月，全球投资公司 KKR 投资约 £600
              million，现有大股东 Infracapital 另注入 £270 million 股权；两者由此成为共同大股东，合计股权支持超过 £850 million [CO005]。日本公用事业巨头 JERA 和
              TEPCO Power Grid 继续保留其在 2019 年首次成长轮中的战略性少数股权，为跨能源市场的技术协同提供支持 [CO006]。在信贷端，Zenobē 率先搭建可规模化的债务结构，于 2022 年 2
              月完成由 NatWest 设计的 £241 million（US$326 million）多来源私募融资，用于电动公交和充电硬件 [CO008]。2026 年 6 月，该平台进一步扩张：Zenobē
              与一线机构银行组成的银团完成 £980 million 债务融资，使公司自成立以来累计融资超过 £3.2 billion，也验证了商业银行对基础设施即服务模式的兴趣 [CO007]。
