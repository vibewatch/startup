        title: 财务结论、商用监管风险与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              Zenobē Energy
              的财务画像分化明显：一方面有顶级机构支持和大量已签约业务，另一方面也承受显著的商用市场和监管风险。公司的核心信用优势在于，已证明自己能够在全球知名基础设施基金支持下银团筹集大规模、多币种债务。此外，与市政和区域交通运营商签订的
              EVaaS 合同提供长期合同收入，可缓冲短期宏观经济波动。不过，若要精确评估股权，仍有多项重大尽调阻塞。除了私人法定利润率不透明，商用市场动态也带来新挑战。2026 年，Zenobē
              就竞争性长期储能资产的政府封顶与保底补贴机制，向英国竞争上诉法庭起诉 Gas and Electricity Markets
              Authority（GEMA），发起补贴控制法律挑战。该诉讼凸显受监管补贴计划可能压低批发和平衡市场价差、损害商用电池经济性的风险。在投入风险资本前，承销方必须取得经审计法定账目、资产层面财务模型、债务契约合规证明以及按合同区分的终止条款。
