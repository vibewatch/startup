            body: >-
              除车队车库资产外，Zenobē 还开发和运营大型接入输电网的电池储能设施，为输电系统运营商提供关键网络稳定服务。可再生能源取代化石燃料火电后，电网会失去物理惯性和短路容量，对快速频率下降更脆弱。Zenobē
              位于苏格兰的旗舰 Blackhillock 项目是欧洲最大的接入输电网电池之一，初始容量 200 MW，后扩至 300 MW。              Blackhillock 获 National
              Energy System Operator（NESO）稳定性探路者第二阶段计划合同支持，使用先进成网型逆变器，设定电压和频率波形，模拟同步发电机并提供合成惯性。连同 100 MW Capenhurst
              项目（已签订无功功率电压支持商业合同）等项目，Zenobē 已积累约 1,500 MW 的已签约电池储能资产，提供合同型稳定性服务，而非单纯依赖商用套利。
