  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与买方画像
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的商业策略把客户群分为三类主要运营客户：市政和区域公交运营商、工业与公用事业基础设施所有者，以及商业货运物流车队。在公交领域，Zenobē 为 Mobico Group（National
              Express）、Transdev Blazefield 等大型公共交通集团，以及 Nottingham City Transport
              等市政公交运营商提供一站式基础设施和融资服务。这些买方通常采用特许经营或加盟合同；前置资本支出约束、车库电网容量限制和电池残值风险造成显著采用摩擦。对于 United Utilities
              等公用事业和工业客户，Zenobē 在多年期灵活性和韧性合同下，交付与现场可再生能源配套的表后电池储能系统。最近，公司通过与 Winning Group
              合作在澳大利亚部署电动配送卡车等方式，开始拓展商业货运物流。商业条款通常持续 10 至 15 年；期间 Zenobē 承担电池的技术和衰减风险，同时获得可预测的合同服务收入。
