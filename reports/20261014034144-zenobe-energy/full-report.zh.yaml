      - number: '4.3'
        title: 单位经济、成本结构驱动因素与私人信息缺口
        blocks:
          - type: paragraph
            body: >-
              评估 Zenobē Energy 的底层单位经济，需要区分资本支出融资机制和运营服务利润率。作为私人运营实体，Zenobē
              未公开披露分部毛利率、获客成本或车库层面的回本周期。在车队业务中，成本结构主要由车辆和电池采购、并网升级费用、车库安装人工及持续维护构成。Zenobē
              试图通过金融工程消除感知绿色溢价，设计长期合同，把总拥有成本压到传统柴油车队基准以下。在电网储能业务中，收入质量取决于资产可用率、往返效率，以及算法捕捉的价差相对电池衰减率。Dealroom 估算 Zenobē
              成长期估值约为收入的 14.9x、EBITDA 的
              64.9x，反映市场对未来现金转化的高预期。但由于经审计的折旧计划、保修转嫁负债和净利息费用在公开记录中不可得，投资人无法独立验证当前合同产生的现金利润是否足以承受未来电池单元更换或再融资利率上升。
            claimRefs:
              - CI008
              - CI009
