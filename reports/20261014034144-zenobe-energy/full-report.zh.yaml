  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 一站式车队电气化与车库基础设施
        blocks:
          - type: paragraph
            body: >-
              Zenobē
              面向市政和商业车队运营商的旗舰商业方案，是电动车即服务（EVaaS）模式。该一站式方案把表后充电基础设施、固定式车库电池储能系统、车载电池融资与维护，以及车库运营软件整合在一起。城市车队电气化的主要工程障碍是本地电网容量：公用事业变电站通常要耗时数年、投入数百万英镑升级，才能承受兆瓦级车库充电需求。Zenobē
              通过安装固定式车库电池储能系统绕开这一约束：系统在非高峰时段利用现有电网容量慢速充电，再快速放电，为夜间电动公交充电提供电力。Zenobē 称其在英国、澳大利亚和新西兰全球支持超过 3,400
              辆电动车，并提供运营遥测、电池健康跟踪和合同可用率保证，把资产衰减风险从车队运营商转移出去。
