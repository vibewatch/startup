  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、服务架构与可触达支出
        blocks:
          - type: paragraph
            body: >-
              Zenobe Energy 位于车队电气化基础设施与电网级灵活电池储能的交汇处。Zenobe
              商业模式覆盖的可触达商业支出包括一站式电动车即服务（EVaaS）基础设施、用于缓解当地电网配电约束的长期固定式车库电池储能、牵引电池融资以及专用车库充电硬件。排除项包括车辆底盘制造、车辆装配线和普通司机工资，这些仍由原始设备制造商及公交车队运营公司负责。现状替代方案包括继续运营化石燃料柴油公交、传统车库柴油加油，以及不受管理的电网接入，后者可能带来严重的峰值需求费用。相邻市场机会包括固定式公用事业级电池储能系统（BESS），直接向国家输电系统运营商提供频率响应和动态交易能力。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
