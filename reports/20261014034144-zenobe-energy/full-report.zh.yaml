        - 运营商购买电动公交车，并为本地车场昂贵的电网接入升级融资
        - 采用交钥匙 EVaaS，并以表后固定式车场电池缓冲受限电网接入
        - 避免数百万英镑的电网强化资本支出，并缩短车场电动化周期
