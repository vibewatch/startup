  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 由于财务不透明，决策链将运营证据和出资方支持连接至继续研究的建议。
    approximationNotes: 流程顺序模拟从证据基线到投资建议的分析推进。
    data:
      nodes:
        - id: scale-proof
          label: 运营规模证据
          detail: 175MW+ 合同储能，以及全球部署 3,400+ 辆车、约 25% 英国电动巴士份额
        - id: sponsor-capital
          label: 出资方资本支持
          detail: KKR、Infracapital 和 M&G 大力支持，并可获得 >$1.3B 商业债务工具
        - id: financial-opacity
          label: 财务披露不透明
          detail: 尚无公开审计收入、分部门毛利率和公司 EBITDA
        - id: leverage-risks
          label: 高债务杠杆负担
          detail: 债务融资额度超过 $1.3B，但契约余量和偿债覆盖率尚未验证
        - id: peer-compression
          label: 公开可比公司估值倍数压缩
          detail: 公开能源存储可比公司 Fluence Energy 在 2026 年下跌 64.3%，市值降至 $1.31B
        - id: valuation-uncertainty
          label: 未经验证的估值标记
          detail: Dealroom 给出的 £800m 私募估值缺少股份数量、优先股堆叠和现金验证
        - id: final-recommendation
          label: 建议：需进一步研究
          detail: 暂缓入场；在评估投资前，先要求提供经审计财务报表、债务条款和分部门经济数据
      edges:
        - from: scale-proof
          to: sponsor-capital
        - from: sponsor-capital
          to: financial-opacity
        - from: financial-opacity
          to: leverage-risks
        - from: leverage-risks
          to: peer-compression
        - from: peer-compression
          to: valuation-uncertainty
        - from: valuation-uncertainty
          to: final-recommendation
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV009
      - CV010
      - CV013
