  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与市场分类
        blocks:
          - type: paragraph
            body: >-
              Zenobē Energy 横跨两个相互关联但各自独立的商业领域：一站式电动车队电气化（电动车即服务或 EVaaS）与公用事业级电池储能系统（BESS）。在车队电气化领域，Zenobē 通过与 National
              Express、Arriva、Abellio、McGills 和 Stagecoach 等大型商业交通运营商签约，在英国早期建立领先地位，估计占运营中电动公交市场 25%。车队电气化的竞争者分为专业 EVaaS
              服务商、提供专属租赁的设备制造商，以及由运营商直接购车并自行协商配电网升级的传统模式。在公用事业级储能领域，Zenobē 管理着英国 731MW
              运营中资产，与专业基础设施投资信托和纯储能开发商争夺电网接入和市场收入。两个细分市场的交汇，让 Zenobē
              能够安装车库电池来突破本地网络容量限制，同时参与批发灵活性市场，形成不提供整合服务的竞争者难以复制的结构性优势。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
