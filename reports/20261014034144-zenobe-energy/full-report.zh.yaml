      - number: '3.4'
        title: 护城河持久性、在位者反击与替代风险
        blocks:
          - type: paragraph
            body: >-
              Zenobē 在车队电气化合作中拥有较强客户锁定，但其独立的电网级储能业务仍暴露于商品周期和竞争性利润侵蚀。英国大不列颠容量市场的 T-1 交付拍卖清算价从 2021-22 年每年每 kW £45 大幅降至
              2026-27 年每年每 kW 仅 £5，反映出竞争性灵活资产、延寿核电和需求侧响应聚合商涌入；后者获得了 662MW
              容量。此外，如果电网接入队列得到清理、设备融资商品化，纯软件优化平台和大型能源公用事业公司也会持续带来替代风险。Zenobē 能否长期守住护城河，取决于能否维持双飞轮协同：利用其 £1.1 billion
              企业估值以及 KKR、Infracapital 和 Mubadala 的机构支持，锁定最低成本资本，并在公用事业在位者建立一站式运营前抢占进入门槛高的市政公交车库。
