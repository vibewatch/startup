      - number: '7.2'
        title: 电网互联、规划与运营执行风险
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的公用事业级电池储能部署，在输电网络接入和高频调度上存在不同的技术与运营执行失败模式。公司位于 Chester 的 100MW Capenhurst 电池项目，是欧洲最大的并网电池，建成后可在
              National Grid 稳定性探路者计划下，直接从 275kV 输电系统吸收无功功率。该项目依据更新后的规划制度获批；新制度允许超过 50MW
              的电池设施取得地方规划许可，而非国家级开发许可。但直接连接输电基础设施意味着，如果电压稳定要求未达标，就会面临严重的停运处罚。运营上，Zenobē 与 Open Energi 和 Erova Energy
              合作，借助 Dynamic Demand 2.0 Trader
              平台降低整个储能组合的衰减。该自动算法软件实时管理电池荷电状态、保护复杂电芯保修，并在平衡机制、批发电力市场和辅助服务招标之间优化持续多市场竞价。运营上，一旦自动调度模型中断或延迟激增，就会威胁收入产出，同时加速不可收回的电池衰减。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
