      - number: '8.4'
        title: 建议与尽调框架
        blocks:
          - type: paragraph
            body: >-
              综合运营交付、市场定位和财务透明度后，我们给出“继续研究”建议：中等信心、高风险，估值立场未知。Zenobē 无疑已证明自己具备工业级执行能力，在全球管理超过 3,400 辆电动化车队车辆，并拿下
              KKR、NatWest 等一线基础设施合作方。但投资判断仍需要可验证的定价纪律。Zenobē 仍是私营公司，未公开披露经审计的公司损益表、分部毛利率或债务摊还计划；因此，给出具体股权目标价，或认可
              Dealroom 的 £800 million 私募估值，都会是假精确。

              这一高风险评级直接反映公司超过 $1.3 billion 的高额债务杠杆，以及电力市场波动和上市同业倍数骤降。在投入资本前，尽调必须取得 Zenobē
              完整的经审计财务报表、合同约定的现货与固定收入占比、优先级债务契约合规证明，以及 2023 年投资方资本重组设定的确切清算优先权分配瀑布。只有明确确认运营现金流稳健且偿债余量充足，才足以把建议升级为可执行的买入。
