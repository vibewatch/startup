            title: 一站式电池风险转移带来高客户黏性
            body: >-
              Zenobē 的主要客户价值主张，是在多年期协议下承担资本支出和电池衰减风险。通过为车库电气基础设施提供融资，并在 10-15 年期限内保证电池可用性，Zenobē
              为主要区域交通客户形成显著运营切换壁垒，保护合同持久性。
