            - 承担保修风险
            - 保证可用性
          description: Zenobē 在 15 年合同下承担电池衰减和性能风险，保证荷电状态和车辆就绪度。
        - label: 6. 梯次利用改造与车队扩张
          stage: 生命周期与扩张
          touchpoints:
            - 梯次利用电池改造
            - 车库容量扩张
            - 额外线路电动化
          description: 将衰减的移动电池退役并用于固定储能，同时扩建车库基础设施以支持更多车辆线路。
    approximationNotes: 生命周期阶段综合自 Zenobē 交钥匙电动车即服务（EVaaS）商业披露和车库交付案例。
