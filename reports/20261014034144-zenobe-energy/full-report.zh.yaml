      - number: '7.3'
        title: 资本结构、合作伙伴依赖与交易对手风险
        blocks:
          - type: paragraph
            body: >-
              车队电气化和电网基础设施业务本质上资本密集，在长期服务合同摊销投资前，需要大量前期项目融资和债务资本。为支持一站式电动车即服务（EVaaS），Zenobē 建立了由 NatWest 安排的 £241
              million（$326 million）多来源债务平台，并进一步与 Santander、Rabobank 和机构基础设施贷款方完成债务银团融资。公司由 KKR、Infracapital 和 Mubadala
              Capital 等大型基础设施股权投资方支持，此前完成了 £870 million
              大规模成长资本重组。不过，维持多贷款方债务平台会持续产生再融资、利率和债务服务契约风险，需要稳定的合同现金流。在交易对手端，Zenobē 高度依赖核心市政和区域交通运营商，包括 Coventry 的
              National Express、Stagecoach 和 Newport Transport，以获得长期公交租赁收入。拓展国际市场也会带来跨境执行、物流延误和国际交易对手履约风险，例如在 ARENA 支持下与
              Winning Group 合作，在澳大利亚部署 30 辆电动卡车。
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
