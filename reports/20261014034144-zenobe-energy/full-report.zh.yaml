      - number: '7.4'
        title: 综合风险矩阵与尽调监测触发器
        blocks:
          - type: paragraph
            body: >-
              对 Zenobē Energy 综合风险画像的评估显示，虽然技术和资产执行已取得商业运营验证，但系统性监管风险和金融杠杆暴露构成最主要的论点破坏风险。公司主动挑战 GEMA
              补贴政策，反映出批发灵活性市场设计对其至关重要：监管若偏向更长时长的非电池资产，可能压缩公用事业级锂离子电池的商用利润率。同时，一站式公交车库和数百兆瓦级电网储能设施的资本密集型部署，会带来高额固定债务服务义务，要求持续的合同续签率以及及时的市政公交车队电气化进度。对潜在投资人和尽调团队而言，首要监测指标应包括
              2026 年 4 月即将到来的竞争上诉法庭判决、Ofgem 对商业车队车库剩余网络收费的审查结果、已披露的合同辅助服务收入与波动商用批发套利收入之比，以及银团融资中贷款方的契约余量。
