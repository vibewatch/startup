      - number: '1.3'
        title: 运营规模、车队部署与里程碑演进
        blocks:
          - type: paragraph
            body: >-
              Zenobē 从早期的电池算法交易发展到全球商业车队管理，已将实体资产版图扩展至五个国际市场 [CO010]。截至 2026 年 3 月，公司在全球管理超过 3,400 辆电动车、覆盖 120
              多个运营车库，仅在英国大不列颠就运营或在建超过 1GW 的接入输电网电池储能资产 [CO010]。技术差异化始于 2020 年 5 月的 10MW Hill Farm BESS 项目：Zenobē 与 Open
              Energi 和 Erova Energy 合作部署 Dynamic Demand 2.0 Trader 自动算法优化平台，直接接入平衡机制，并以软件提高收入最大化能力 [CO013]。公司通过在澳大利亚与
              Winning Group 合作部署 30 辆电动商用卡车、采用 ARENA 支持的电动车即服务（EVaaS）结构，加快了国际扩张 [CO014]。2026 年 3 月，Zenobē
              收购总部位于加州的商用车队运营商 Revolv，将 13 个运营车库和超过 100 辆电动车纳入北美业务 [CO011]。不过，BESS 的快速部署也引发监管争议：2026 年 4 月，Zenobē
              就长期储能的竞争与市场管理局（GEMA）封顶与保底补贴机制，向竞争上诉法庭发起第二次高风险补贴控制挑战，显示公司正积极捍卫商业商用收入，抵御补贴型公用事业项目 [CO012]。
