  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、补贴控制与诉讼风险
        blocks:
          - type: paragraph
            body: >-
              Zenobē Energy 所处监管环境仍在变化，公共政策决定和补贴结构直接影响市场经济性。2025 年末和 2026 年初，Zenobē 依据《2022
              年补贴控制法》在英国竞争上诉法庭（CAT）提起重大法律程序，挑战 Gas and Electricity Markets Authority（GEMA）的决定。诉讼针对 GEMA
              为长期储能（LDES）项目实施的封顶与保底金融支持机制；Zenobē 认为，GEMA 在采用该方案前未评估法定补贴控制原则，构成法律适用错误。两项申请的合并听证原定于 2026 年 4
              月下旬在法庭举行；NatPower、British Hydropower Association、Gresham House 以及能源安全与净零排放大臣等第三方寻求或处理介入权。除批发储能诉讼外，Zenobē
              的车队电气化业务还面临英国剩余网络费用带来的政策障碍；该费用会惩罚夜间为电动车队充电的公交车库，形成经济性阻力。此外，公共资本资助计划历来不一致，包括从超低排放公交（ULEB）补助框架转向零排放公交区域（ZEBRA）补助框架，给市政交通合作带来采购时点摩擦。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
