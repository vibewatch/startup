companyProfile:
  summary: >-
    Zenobē Energy is a London-based infrastructure platform that finances, builds, and operates electric fleet charging
    and battery systems for transit, freight, and grid customers. The company couples long-term EV-as-a-service
    contracts with transmission-connected battery storage and algorithmic trading partnerships, backed by major
    infrastructure sponsors and multi-layer debt facilities.
