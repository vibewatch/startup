callouts:
  - calloutType: insight
    title: "The Dual-Flywheel Competitive Advantage"
    body: "Zenobē uniquely hedges its business model by bridging fleet depot electrification with grid-scale BESS. Stationary depot batteries overcome local distribution grid bottlenecks for transit operators while generating secondary revenue streams through flexible demand management, giving Zenobē a lower net cost of infrastructure delivery than pure-play fleet or pure-play storage competitors."
    claimRefs:
      - CP001
      - CP004
  - calloutType: risk
    title: "Capacity Market Clearing Compression and Revenue Erosion"
    body: "Great Britain's T-1 capacity auction clearing prices dropped to £5 per kW per year for 2026-27 delivery, demonstrating that short-term grid flexibility revenues are increasingly contested by aggregators and legacy plants. Standalone merchant storage assets face compressed margins unless protected by long-term tolling contracts or proprietary fleet synergies."
    claimRefs:
      - CP009
      - CP010
      - CP014
