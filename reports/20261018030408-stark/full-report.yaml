        - >-
          If procurement timing slips or scale-up spending fails to create repeat orders, today's valuation could
          compress sharply.
        - Repeat follow-on awards, throughput proof, and margin disclosure would soften this risk.
    notes: >-
      This table blends reported facts with investor interpretation; the key missing variables are revenue quality,
      backlog conversion, and latest-round preference terms.
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - June 2026 capital translates into scaled production, repeat NATO procurement, and stronger software attach.
        - >-
          The current valuation can sustain if Stark becomes a scarce sovereign-autonomy platform rather than a
          single-program drone vendor.
        - Evidence of manufacturing throughput, repeat orders, and better disclosure than peers.
        - Qualification delays, weaker-than-expected demand conversion, or margin opacity.
      - - Base
        - Demand remains real but monetization follows normal defense procurement timing and disclosure stays partial.
        - >-
          The mark may hold privately, but upside for new investors is hard to underwrite without a better price or new
          proof points.
        - 'Mixed signal set: strong demand narrative, weak public financial disclosure.'
        - Another mark-up without better disclosure.
      - - Bear
        - >-
          Headline contracts prove less monetizable than expected or later financing terms reveal weak economics for new
          money.
        - >-
          A stretched multiple compresses because investors were paying for scarcity and strategic urgency rather than
          proven fundamentals.
        - Limited revenue visibility, political friction, and long procurement cycles remain unresolved.
        - Down-round signals, delayed deliveries, or evidence of weak backlog conversion.
    notes: >-
      These are qualitative scenarios because public sources do not disclose revenue, margin, cash burn, or a full cap
      table for conventional valuation modeling.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
