  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The risk stack is concentrated in a few underwriting-critical questions rather than in a long tail of
              minor issues. First, visible demand and program traction are heavily tied to NATO-aligned procurement and
              German military programs, which increases customer concentration and makes political or export-control
              friction material. Second, STARK is trying to scale production, R&D, and product breadth simultaneously;
              that is a credible growth path, but also an execution burden because the public evidence emphasizes plans,
              facilities, and hiring more than delivered units, acceptance rates, or failure data. Third, the financing
              story is running ahead of public fundamentals—the 2025 and 2026 rounds imply a sharp valuation step-up,
              while the assigned sources still do not surface audited revenue, burn, backlog conversion, or
              framework-award drawdown. The company does have mitigation signals—frontline deployment claims, NATO
              exercise testing, and fresh capital—but the residual heat remains high until public or diligence-only
              evidence closes those proof gaps.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR012
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and procurement exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest legal and regulatory risk in the assigned pool is not a disclosed lawsuit; it is procurement
              sensitivity around politically visible capital, export-control boundaries, and government contracting
              structure. Tectonic reports that a German military award involving STARK was delayed in parliament because
              of Peter Thiel and Founders Fund links before eventual approval, which means investor composition can
              become a live approval variable rather than background context. At the same time, RobotToday frames STARK
              as selling only to NATO member states and close partners, while STARK recruiting materials require
              eligibility for defense-sector security clearance. That combination is strategically attractive, but it
              also means the business likely depends on export-control discipline, classified-program hygiene, and
              country-by-country approval processes that are not publicly detailed in the current source set.
              Framework-award headlines therefore should not be treated as risk-free revenue until diligence confirms
              call-off schedules, acceptance criteria, and any procurement conditions attached to the visible German
              programs.
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.3'
        title: Operational, quality, and technical execution risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, STARK is attempting to scale on several fronts at once; new capital is earmarked for
              research facilities and manufacturing, the company is expanding across multiple countries, and the product
              set spans loitering munitions, maritime vessels, and command software. That is encouraging for ambition
              and market timing, but it also raises the burden on quality control, supplier coordination, and systems
              assurance. The strongest product-validation evidence in this chapter remains company-issued. STARK says it
              reached frontline deployment in 13 months, and its September 2025 Vanta release describes nearly a month
              of NATO-linked testing with daily serial missions, ranges up to 900 nautical miles, and operations in
              harsh conditions. Those are meaningful mitigants, but they are not the same as independent reliability,
              mission-success, rework, or field-failure statistics. Recruiting signals reinforce the complexity point;
              STARK is explicitly hiring for AI-driven aerodynamic optimization, simulation workflows, and validation
              against simulation and flight-test data, which suggests the technical stack is sophisticated and still
              heavily execution-dependent.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR012
              - CR013
              - CR015
      - number: '7.4'
        title: Financial, partner, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The financial and dependency profile is still the hardest part of the underwriting case. Public sources in
              the assigned pool support a move from a $62 million round at a $500 million valuation in 2025 to a €500
              million round at roughly €3.2-3.5 billion in 2026, yet they do not disclose audited revenue, gross margin,
              burn, or realized contract conversion. That does not make the valuation wrong, but it does mean the
              current public story is being carried by investor quality, customer urgency, and framework-award headlines
              more than by transparent operating metrics. Dependence also clusters in a narrow set of counterparties and
              programs. RobotToday says STARK sells exclusively to NATO member states and close partners, while Dealroom
              and Tectonic connect the growth plan to acquisitions, investor backing, and a handful of defense
              relationships. The result is a company with real momentum and clear mitigants, but also one whose downside
              is unusually exposed to procurement timing, funding discipline, and integration execution.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: Kill criteria, monitoring indicators, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Before underwriting a new round or secondary entry, diligence should force three measurable tests. First,
              procurement concentration needs a hard readout; if STARK cannot show contracted backlog, drawdown cadence,
              and customer mix beyond the visible German and NATO-aligned programs, concentration risk remains high.
              Second, production scale must be proven, not narrated; monthly output, acceptance yields, field-return
              rates, and mission-success data should improve in step with the claim that new capital will push
              manufacturing to thousands of systems per month. Third, valuation discipline needs operating evidence; if
              management cannot reconcile the valuation step-up with revenue, gross margin, burn, runway, and unit
              economics, then the round is being priced on strategic enthusiasm more than durable fundamentals. Those
              are the core thesis-break triggers for this chapter.
            claimRefs:
              - CR007
              - CR008
              - CR014
              - CR015
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers for this chapter
            body: >-
              Walk away or re-price if diligence cannot verify diversified backlog beyond the visible NATO/German
              programs, if manufacturing output and acceptance data do not substantiate the scale-up narrative, or if
              management cannot tie the valuation step-up to audited operating metrics and contract realization.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and what the public mark actually says
        blocks:
          - type: paragraph
            body: >-
              The public record points to a sharp valuation step-up in less than a year. DealMatrix places the August
              2025 round at $62 million and a $500 million valuation, while June 2026 coverage from Tectonic, Vestbee,
              and Dealroom reports a €500 million financing at roughly €3.5 billion. Silicon Valley Invest Club also
              records an intermediate February 2026 point above $1 billion and discussion of another large raise, which
              supports the direction of travel even if the exact intermediate terms remain thin. The mark is therefore
              not a rumor-free range, but it is consistent across several third-party trackers and news sources that
              Stark re-rated from early proof to strategic-scale expectations very quickly.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.2'
        title: Price support exists, but the underwriting stack is incomplete
        blocks:
          - type: paragraph
            body: >-
              What supports the valuation today is strategic momentum rather than disclosed operating fundamentals.
              Stark's official positioning spans loitering munitions, unmanned surface vessels, and command-and-control
              software, and third-party profiles describe real Bundeswehr and NATO-adjacent traction plus a large June
              2026 capital infusion earmarked mostly for R&D and manufacturing. That creates a plausible
              strategic-scarcity narrative. What is missing is just as important: Sacra says no public revenue, ARR, or
              profitability figures are disclosed, and public sources do not reveal liquidation preferences, exact
              ownership dilution, or the full shareholder register for the latest round. Without those anchors, the
              market evidence supports tracking the company and its next diligence disclosures, not underwriting the
              latest private mark as a buy.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Scenario logic is driven by conversion, not by narrative alone
        blocks:
          - type: paragraph
            body: >-
              The upside case is not hard to imagine: if Stark converts fresh capital into scaled output, converts
              headline contracts into repeat NATO demand, and preserves its product-speed edge, today's valuation could
              still prove reasonable in a category where sovereign autonomy and defense-industrial capacity are scarce.
              The base and bear cases are more conventional: procurement cycles can still run for years, certification
              and political review can slow cash conversion, and the current price has little publicly disclosed revenue
              support if execution slips. That combination means scenario weighting should focus on evidence of
              manufacturing throughput, booked backlog quality, and follow-on procurement rather than on headline
              valuation marks alone.
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.4'
        title: Final call, thesis-break triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation on public evidence is track with medium confidence and a high risk rating. A more
              constructive call would require evidence that the June 2026 round bought measurable production scale,
              customer conversion, and operating leverage rather than just strategic optionality. The fastest ways to
              change the call are audited or board-level disclosure on revenue, backlog, gross margin, burn, and round
              terms, plus independent confirmation that framework awards are converting into recognized delivery
              programs. The thesis breaks if Stark cannot turn capital and contract visibility into repeatable
              procurement wins, or if later financing reveals that the current valuation embedded terms materially less
              favorable than the headline mark implies.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track rather than buy: Stark's category position is compelling, but the current mark is ahead of the
              operating disclosure needed for conventional underwriting.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
              - CV016
          - type: callout
            title: What would most quickly change the view
            body: >-
              Audited revenue, backlog, gross margin, burn, and exact round-term disclosure would do more to change the
              call than another headline valuation mark.
            calloutType: risk
            claimRefs:
              - CV009
              - CV015
              - CV016
