      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              National defense ministries and procurement authorities are the economic payers; naval, land, and joint
              commands are the operating users; and NATO exercises and military evaluations are important qualification
              venues. REPMUS evidence shows an adoption path from simulated missions alongside conventional and unmanned
              assets toward service-specific procurement and deployment. STARK's reported delivery of a Vanta-6 to the
              Bundeswehr's Cyber and Information Domain Service Command also illustrates how an initial surveillance use
              case can precede broader strike integration. Payload partners such as MBDA can accelerate integration into
              existing arsenals, but they also introduce certification, supply, and roadmap dependencies. The
              addressable buyer set is therefore not every NATO entity: it is the subset with a funded mission,
              sovereign procurement authority, integration capacity, legal authorization, and a route from trial to
              operational acceptance.
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM014
              - CM016
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by rising NATO defense budgets, Ukraine-driven urgency, personnel shortages,
              critical-infrastructure protection, and interest in lower-cost systems that can be produced and deployed
              in greater numbers. STARK's rapid expansion from frontline deployment in 13 months to a wider air,
              maritime, and software portfolio is consistent with that urgency. Reported financing and a plan to direct
              more than 80% of the latest capital toward research, development, and manufacturing indicate a supply
              response, not proven end demand. Adoption can still be delayed by qualification, rules governing
              autonomous strike, interoperability testing, payload certification, budget cycles, and the difficulty of
              replacing installed crewed and legacy systems. For valuation, the key missing bridge is from exercises and
              framework ceilings to funded orders, deliveries, recognized revenue, and repeat purchases by named budget
              owners.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand evidence does not yet establish obtainable revenue
            body: >-
              Exercises, strategic need, financing, and framework ceilings support market relevance, but underwriting
              requires funded orders, pricing, deliveries, acceptance milestones, and repeat procurement by named budget
              owners.
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape spans direct strike peers, adjacent system vendors, and legacy alternatives
        blocks:
          - type: paragraph
            body: >
              Stark should be framed as a multi-class competitor rather than a single drone startup. Official and
              supplier-profile material place the company across loitering munitions, unmanned surface vessels, and
              command-and-control software, which means buyers can compare it against direct strike peers, adjacent
              reconnaissance or mission-software vendors, and incumbent defense primes in the same program. In the
              German recce-strike exercise cited here, Quantum Systems supplied reconnaissance while Stark supplied
              strike and control, so Quantum appears as an adjacent integration alternative in that program rather than
              a like-for-like strike competitor. Independent sources consistently position Helsing as the closest German
              loitering-munition peer, with Rheinmetall as the incumbent response risk, while Elintium broadens the
              field to Anduril, Aeronautics, Kongsberg, Thales, and Patria for buyers evaluating broader autonomy or
              counter-drone options.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP013
      - number: '3.2'
        title: Differentiation rests on integration breadth more than on one product alone
        blocks:
          - type: paragraph
            body: >
              The clearest evidence-backed differentiation is architectural breadth. Stark's own surfaces and recent
              launch coverage show that Virtus is no longer the only product in scope: Cascade and Gambit broaden the
              strike catalog, while Vanta extends the offer into maritime systems and Minerva is presented as the common
              control layer across domains. That matters because the cited Bundeswehr and maritime material describes
              value in shortening the detection-to-engagement loop and integrating unmanned systems into existing
              battle-management workflows rather than adding another isolated point product. If Minerva becomes the
              adopted control layer, switching costs can increase, but that lock-in thesis depends on whether customers
              standardize on Stark's software rather than mixing independent reconnaissance, strike, and maritime
              vendors under a different command stack.
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP009
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP009
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP007
              - CP011
              - CP012
      - number: '3.3'
        title: Procurement relevance is visible, but public price transparency is weak
        blocks:
          - type: paragraph
            body: >
              Public evidence supports procurement relevance more than commercial transparency. Retained sources
              describe direct sales into government or NATO-aligned defense buyers, cite framework contracts and
              procurement wins, and note a fresh €500 million financing intended to expand R&D and manufacturing. That
              combination helps Stark argue that it can scale with customer demand, but it does not yet give outside
              investors or buyers a clean public view into per-system pricing, discounting, sustainment terms, or
              gross-margin structure relative to Helsing or large incumbents. The result is a market position that looks
              strategically important and increasingly well-funded, while still remaining difficult to benchmark on
              total cost of ownership from public evidence alone.
            claimRefs:
              - CP004
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: Durability is real but not yet de-risked
        blocks:
          - type: paragraph
            body: >
              Stark's moat appears to come from speed, integration, and access to capital more than from a long,
              independently verified performance record. DroneXL's chronology still runs from high-profile trial
              failures in late 2025 to later procurement momentum and a June 2026 launch of new products whose
              launch-customer base was not yet named in retained public coverage. That means commoditization and
              incumbent response remain serious risks: if loitering munitions become easier to source and command
              software standards stay open, buyers can multi-home across vendors. Conversely, if Stark converts Minerva
              plus multi-domain hardware into recurring program-of-record adoption, it can become harder to displace
              than a single-SKU drone vendor. The available evidence supports the possibility of that outcome, but not
              its inevitability.
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Direct threat is a bundle decision, not a single-vendor matchup
            body: >
              The most important competitive question is whether a buyer wants a strike drone, a recon-plus-strike
              workflow, or a multi-domain control stack. Stark looks strongest when the program values the third.
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP009
          - type: callout
            title: Breadth narrative still outruns public proof on the newest SKUs
            body: >
              Cascade and Gambit expand the catalog, but retained sources still lack named launch customers and
              independent performance evidence specific to those systems.
            calloutType: risk
            claimRefs:
              - CP002
              - CP010
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial model is procurement-led, but public monetization detail is thin
        blocks:
          - type: paragraph
            body: >-
              The retained sources consistently describe Stark as selling a bundle of military hardware and software
              rather than a consumer or self-serve software product. Official and company-issued sources describe Virtus
              loitering munitions, Vanta unmanned surface vessels, and Minerva command-and-control software for NATO
              member states and partner militaries, while the official maritime release frames Vanta and Minerva as
              interoperable elements of multi-domain operations. That evidence supports a capability-package revenue
              model in which procurement awards, deployments, and follow-on production matter more than seat counts or
              usage-based billing.


              What remains missing is the monetization layer that would let an investor move from product relevance to
              revenue quality. None of the retained sources disclose list prices, realized prices, discounting, software
              license structure, contract duration, payment milestones, or service attach rates for Virtus, Vanta, or
              Minerva. The financial chapter therefore has to separate what is evidenced — products, customers, and
              stated scale ambitions — from what is not: the pricing mechanics that determine how quickly military
              demand converts into recognized revenue and gross profit.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI012
          - type: table
            tableRef: TI001
            claimRefs:
