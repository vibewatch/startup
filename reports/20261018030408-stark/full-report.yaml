  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >
      Evidence-backed ordinal scoring places Stark high on platform breadth and above most cited peers on procurement
      validation, while the newest products remain less proven than the bundle narrative.
    data:
      points:
        - label: Stark
          x: 5
          'y': 4
          note: >-
            Breadth score reflects strike, maritime, and C2 products; validation score reflects cited procurement wins
            and exercises.
        - label: Helsing
          x: 3
          'y': 4
          note: >-
            Direct German strike-drone peer with shared procurement context, but retained sources do not show the same
            multi-domain stack.
        - label: Rheinmetall
          x: 4
          'y': 3
          note: >-
            Incumbent alternative with procurement weight, but retained sources frame it as displaced in the cited
            loitering-munition contest.
        - label: Quantum Systems
          x: 2
          'y': 3
          note: >-
            Strong adjacent reconnaissance role in the cited recce-strike loop, but not shown as the same-stack strike
            vendor.
        - label: Anduril or Aeronautics
          x: 3
          'y': 2
          note: >-
            Named international loitering-munition rivals, but retained sources provide weaker Europe-specific
            procurement proof.
        - label: Thales, Patria, or Kongsberg
          x: 4
          'y': 2
          note: >-
            Named broader sovereignty, swarm, or counter-drone alternatives with likely channel advantages, but not
            detailed here as like-for-like peers.
    approximationNotes: >
      Ordinal 1-5 scoring is synthesized from retained sources only. The x-axis represents platform breadth across
      strike, maritime, and control layers; the y-axis represents publicly cited program validation or procurement
      relevance in the retained evidence.
    claimRefs:
      - CP004
      - CP007
      - CP011
      - CP012
  - id: FI001
    title: Publicly evidenced revenue model bridge
    type: flow
    summary: >-
      The evidence supports a procurement-led bridge from NATO demand to bundled hardware/software deliveries, but the
      final step from orders to recognized revenue and gross profit remains undisclosed.
    data:
      nodes:
        - label: NATO and partner-state demand
          detail: Official and company-issued sources say Stark supplies NATO member states and close partner nations.
        - label: Procurement awards and program access
          detail: Commercialization appears contract-led through defense procurement rather than self-serve software.
        - label: Bundled product stack
          detail: >-
            Virtus loitering munitions, Vanta USVs, and Minerva C2 software are the publicly evidenced commercial
            package.
        - label: R&D and engineering spend
          detail: Stark says more than 45% of expenditure is invested into R&D.
        - label: Manufacturing scale-up
          detail: >-
            Independent coverage says more than 80% of the June 2026 capital is going to R&D and manufacturing to reach
            thousands of systems per month.
        - label: Recognized revenue and gross profit
          detail: Public sources do not disclose realized pricing, revenue, margin, or cash conversion.
      edges:
        - from: NATO and partner-state demand
          to: Procurement awards and program access
        - from: Procurement awards and program access
          to: Bundled product stack
        - from: Bundled product stack
          to: R&D and engineering spend
        - from: R&D and engineering spend
          to: Manufacturing scale-up
        - from: Manufacturing scale-up
          to: Recognized revenue and gross profit
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI007
      - CI008
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      STARK's public product surface stacks operator software above air and maritime platforms, with payload and
      industrial integrations widening the architecture.
    data:
      layers:
        - label: Operator missions
          detail: >-
            NATO buyers are addressed around maritime patrol, distributed strike, counter-UAS coordination, and
            multi-domain operations rather than around a single platform purchase.
          outputs:
            - Persistent maritime ISR
            - Distributed strike
            - Sensor-to-effector tasking
        - label: Mission software
          detail: >-
            Minerva is the named C2 / mission-autonomy layer; MOSA and the recruited C-UAS suite widen the software
            wedge.
          modules:
            - Minerva
            - MOSA
            - C-UAS C2 suite
          outputs:
            - Grouped unmanned operations
            - Degraded-link coordination
            - Battle-management integration
        - label: Air effectors
          detail: Public portfolio evidence points to multiple air-side products rather than one loitering munition.
          modules:
            - Virtus
            - Cascade
            - Gambit
        - label: Maritime platforms
          detail: The Vanta family is the unmanned maritime hull layer, with increasing endurance and strike ambition.
          modules:
            - Vanta 4
            - Vanta 6
            - Vanta 12
        - label: Payloads and sensors
          detail: Public descriptions emphasize modular hosting of sensors and effectors rather than fixed mission kits.
          modules:
            - Sea Venom concept integration
            - ISR sensor suites
            - Electronic warfare systems
        - label: Industrial / engineering base
          detail: >-
            Rapid build and scaling claims depend on shipyard partners plus internal open-source simulation and
            AI-assisted engineering workflows.
          modules:
            - Partner shipyards
            - OpenVSP / OpenFOAM / OpenMDAO
            - AI-agent workflows
    approximationNotes: >-
      Architecture reflects only named public modules and dependencies from the allocated sources; hidden subsystems and
      classified controls are intentionally excluded.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE009
      - CE010
      - CE011
      - CE013
  - id: FU001
    title: Customer adoption path in public evidence
    type: journey-map
    summary: >-
      Public proof clusters around a government-procurement path from technical fit to contract, then to delivery or
      exercise-based expansion, with durability still unproven.
    data:
      nodes:
        - label: Allied defence buyer need
          tone: neutral
          detail: Public evidence is centred on NATO-aligned government buyers rather than commercial accounts.
          touchpoints:
            - NATO member states and closest partner nations
            - European defence agencies and Bundeswehr references
        - label: Multi-product evaluation
          tone: medium
          detail: Air, maritime, and C2 products give the same buyer multiple adoption surfaces.
          touchpoints:
            - Virtus loitering munition
            - Vanta maritime platform
            - Minerva command-and-control software
        - label: First contract
          tone: positive
          detail: NIF says Stark secured its first contract within nine months.
          touchpoints:
            - Early procurement acceptance
            - Speed is a core adoption signal
        - label: Fielded delivery
          tone: positive
          detail: >-
            STARK says it reached frontline deployment in 13 months and a 2026 contract moved to same-month first
            delivery.
          touchpoints:
            - Frontline deployment claim
            - First tranche due in signing month
        - label: Programme expansion
          tone: positive
          detail: Public reporting points to German framework activity and entry into a new European market.
          touchpoints:
            - German military awards and framework reporting
            - New NATO-country contract
            - Partnerships with Germany, Ukraine, and the UK
        - label: Durability still opaque
          tone: adverse
          detail: Public evidence does not disclose renewal rates, churn, or top-customer concentration.
          touchpoints:
            - No NRR or GRR
            - No public customer-count disclosure
            - Parliamentary friction around one major deal
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU009
      - CU011
      - CU012
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk clusters around procurement concentration, manufacturing scale-up, valuation support, and proof gaps
      rather than around demand creation.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
        - label: Residual rating
      rows:
        - label: Government-buyer concentration
          note: Visible demand is concentrated in Bundeswehr and NATO-aligned programs.
          values:
            - label: High
              tone: risk
            - label: Critical
              tone: risk
            - label: Early
              tone: risk
            - label: High
              tone: risk
        - label: Manufacturing ramp
          note: STARK is trying to scale facilities, output, and product breadth simultaneously.
          values:
            - label: High
              tone: risk
            - label: High
              tone: risk
            - label: Medium
              tone: warning
            - label: High
              tone: risk
