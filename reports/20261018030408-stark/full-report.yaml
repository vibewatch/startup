      - number: '5.2'
        title: Architecture and integration model
        blocks:
          - type: paragraph
            body: >
              The clearest architecture signal is Minerva's role as the orchestration layer. STARK's 2025 maritime
              release says Minerva is intended to let Vanta operate in groups, interoperate with reconnaissance and
              strike drones, and connect to conventional battle-management systems; Naval News adds that the Vanta 12
              sensor/effector stack is integrated around Minerva and that STARK is seeking to connect into larger
              digital-targeting webs. The company's product framing also emphasizes modularity rather than a vertically
              closed system: Vanta is described as sensor- and effector-agnostic, MOSA is positioned around digital
              sovereignty, and recruiting points to open-source simulation and AI-agent tooling behind aircraft design
              and C-UAS C2 development. The practical implication is a software-defined architecture with many
              integration surfaces, which is powerful if qualification succeeds but also raises execution risk at each
              external dependency boundary.
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
