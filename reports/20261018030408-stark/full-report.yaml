      - CR007
      - CR008
      - CR010
      - CR012
      - CR014
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Stark's strategic demand and financing momentum are real, but missing operating disclosure and procurement
      friction push the public-evidence recommendation to track.
    data:
      nodes:
        - id: demand-proof
          label: Strategic demand proof
          detail: Bundeswehr-linked demand and NATO-only positioning show real buyer interest.
        - id: product-speed
          label: Product breadth and speed
          detail: Virtus, Vanta, and Minerva plus 13-month deployment reinforce the strategic narrative.
        - id: private-mark
          label: Private-market mark-up
          detail: Public sources moved from $500M in Aug 2025 to about €3.2B-€3.5B in Jun 2026.
        - id: missing-operating-data
          label: Missing operating disclosure
          detail: No public revenue, ARR, profitability, or full latest-round term disclosure anchors the mark.
        - id: execution-drag
          label: Execution and procurement drag
          detail: Multi-year military adoption and political review can delay cash conversion.
        - id: recommendation
          label: 'Recommendation: track'
          detail: Investors need better price support or audited operating proof before underwriting a buy.
      edges:
        - from: demand-proof
          to: product-speed
          label: validates
        - from: product-speed
          to: private-mark
          label: helps explain
        - from: private-mark
          to: missing-operating-data
          label: raises the burden of proof
        - from: missing-operating-data
          to: execution-drag
          label: compounds
        - from: execution-drag
          to: recommendation
          label: leads to
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
      - CV016
