  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              STARK's addressable market is narrower than broad global defense spending. Its disclosed portfolio places
              it in three linked procurement categories: one-way effectors, unmanned maritime systems, and
              command-and-control software for multi-domain operations. The practical customer boundary is also
              constrained: a supplier profile says STARK supplies NATO members and their closest partner nations, while
              the company's own material emphasizes NATO interoperability and European sovereignty. Included spend
              should therefore be limited to programs that can buy these systems, their mission software, integration,
              training, and relevant payloads. Crewed ships, general-purpose enterprise software, unrelated missiles,
              and the full value of national defense budgets are excluded. Status-quo substitutes remain crewed patrol
              assets, conventional reconnaissance and strike chains, separately procured effectors, and internal
              military integration. This boundary prevents strategic need from being mistaken for immediately
              contestable revenue.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The available sources support several demand lenses, but not a monetary market total. STARK says European
              NATO allies are responsible for about five million square kilometers of maritime waters and links the
              mission to undersea data cables and seaborne trade. Its Vanta-4 and Vanta-6 were described as having
              ranges up to 900 nautical miles, while independent coverage reports that Vanta-12 is designed for
              1,200-mile patrols, speeds above 40 knots, and weeks at sea. These figures show the operational scale and
              persistence problem; they are not interchangeable units and cannot be summed into TAM. Financing and
              framework-contract reports are also only capacity and procurement signals, not revenue. None of the eight
              reviewed pages supplies independently derived annual category spend, eligible program counts, pricing, win
              rates, or production-linked revenue needed to isolate SAM or SOM.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
              - CM015
