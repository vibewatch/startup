      - number: '5.3'
        title: Maturity, deployment, and roadmap
        blocks:
          - type: paragraph
            body: >
              Public evidence suggests uneven maturity across the portfolio. Vanta 4 and Vanta 6 were already being
              tested in NATO maritime exercises in 2025, with STARK claiming serial mission execution and up to 900
              nautical miles of range. By contrast, the strongest 2026 third-party evidence for Vanta 12 still reads as
              advanced trial and integration work rather than fielded production capability: Janes reports a Sea Venom
              emulation model to prove the concept, and Naval News says the companies are still working through full
              missile integration while also exploring other payload options. Recruiting likewise indicates that STARK
              is still expanding core technical capabilities in aero simulation and C-UAS software. This is consistent
              with a company that is moving quickly, but it means diligence should underwrite product readiness at the
              program level, not simply accept the breadth of the roadmap at face value.
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE009
              - CE013
      - number: '5.4'
        title: Trust, controls, and technical risks
        blocks:
          - type: paragraph
            body: >
              The main product-tech risk is not lack of ambition but lack of public operating proof. The reviewed
              materials provide concrete product names, some trial evidence, and useful developer-signal via recruiting,
              yet they do not expose technical documentation, support metrics, status telemetry, security attestations,
              or formal compliance artifacts for Minerva, MOSA, or the broader product stack. In parallel, the most
              aggressive maritime-strike narrative still depends on finishing partner-weapon and external-C2
              integration. For an investor or strategic partner, that shifts diligence toward qualification evidence:
              secure-development processes, export/control boundaries, in-service reliability, support burden, and
              customer-specific integration timelines all need direct documentation rather than brand-level claims.
            claimRefs:
              - CE009
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: More than a single drone SKU
            body: >-
              The strongest product positive is portfolio shape: STARK now publicly spans software, air effectors, and
              maritime platforms, which can raise switching costs if Minerva becomes the operator control layer rather
              than a bundle of disconnected vehicles.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE010
          - type: callout
            title: Roadmap breadth is ahead of disclosed operating proof
            body: >-
              The public story already markets modular strike, C-UAS software, and maritime mass production, but the
              reviewed evidence still shows important programs at trial, concept, or recruiting stage and does not
              disclose the control artifacts needed to underwrite supportability or cyber readiness.
            calloutType: risk
            claimRefs:
              - CE004
              - CE009
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is government-led and mission specific
        blocks:
          - type: paragraph
            body: >-
              The visible customer base is not a broad commercial roster; it is a concentrated set of allied defence
              buyers, operators, and program offices. Public sources point to ministries of defence and armed forces as
              buyer and payer, with end users spanning loitering munition operators, maritime ISR users, and
              command-and-control teams. The product set also implies a land-and-expand motion inside the same buyer
              account: Virtus addresses strike-drone procurement, Vanta expands into maritime missions, and Minerva can
              coordinate both domains. That gives STARK a plausible multi-product wedge within NATO programmes, but the
              company does not publish customer counts, contract values by segment, or attach rates for software.
            claimRefs:
              - CU001
              - CU002
              - CU014
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU010
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU009
              - CU011
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption proof exists, but named production deployments are still thin
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signals are speed-to-contract and program-level proof rather than usage metrics.
              NATO Innovation Fund says STARK secured its first contract within nine months of founding, while STARK
              says it reached frontline deployment within 13 months. By 2026, independent reporting tied the company to
              a new NATO-country contract with same-month first delivery, public reporting on German military awards and
              framework activity for Virtus, and month-long NATO maritime testing for Vanta. Taken together, the
              evidence supports real demand and field relevance, but not yet a large set of named, independently
              verified production customers with disclosed unit economics or renewal data.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Durability and concentration are the main customer unknowns
        blocks:
          - type: paragraph
            body: >-
              STARK appears to be building around visible demand from NATO-aligned defence programmes, but public
              durability evidence is much weaker than its procurement headlines. The assigned sources do not disclose
              NRR, GRR, churn, renewal rates, customer satisfaction metrics, or contract duration, so there is no public
              proof that early program wins convert into a diversified recurring base. Concentration also remains a live
              risk: Germany and an unnamed NATO-country programme dominate the visible record, and one major German deal
              was publicly delayed in parliament before approval. Fresh capital and manufacturing expansion help
              capacity, but they do not resolve concentration or retention on their own.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU015
          - type: table
