          values:
            - label: Medium
              tone: warning
            - label: High
              tone: risk
            - label: Developing
              tone: warning
            - label: Medium-High
              tone: risk
        - label: Integration / technical assurance
          note: Acquisitions, autonomy, electronic warfare, and C2 workflows increase coordination and validation load.
          values:
            - label: Medium
              tone: warning
            - label: Medium-High
              tone: warning
            - label: Medium
              tone: warning
            - label: Medium
              tone: warning
