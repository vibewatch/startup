chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, products, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Stark is consistently presented in the assigned evidence as a European defence-technology company
              headquartered in Berlin and founded in 2024, with a product set spanning strike drones, maritime
              autonomous systems, and command software rather than a single-asset program. The cleanest reader-facing
              shorthand is a software-driven unmanned-systems company for allied militaries: the homepage centers
              Virtus, Vanta, and Minerva, while third-party profiles repeat the same air-maritime-software stack. The
              current footprint appears operational rather than conceptual. By September and October 2025, the company
              was publicly tying Vanta to NATO maritime exercises and saying Virtus had already been deployed in
              Ukraine, and by February 2026 it was disclosing a new NATO-country contract plus a Sweden office. That
              supports a growth-stage operating profile, but the exact named customer roster, backlog, and production
              throughput remain partly opaque in the assigned pool.
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO008
              - CO009
              - CO010
