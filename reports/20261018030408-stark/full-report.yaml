              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public founder and leadership visibility is adequate for naming key people, but still too thin to treat
              governance as closed. Uwe Horstmann is the clearest operating center of gravity because the company
              publicly announced him as CEO in October 2025, linked him to the next scale phase, and external profiles
              also list him as a founder. The problem is founder attribution consistency: Vestbee describes Stark as
              founded by Horstmann, while RobotToday and DealMatrix list Florian Seibel and Johannes Schaback alongside
              him. That discrepancy is not fatal for identity, but it matters for later diligence on control, prior
              operating history, and division of responsibilities. Investor visibility is better than board visibility:
              Sequoia, the NATO Innovation Fund, Project A, and In-Q-Tel appear across multiple sources, but the
              assigned pool does not establish board composition, voting control, or any secondary/debt component.
            claimRefs:
