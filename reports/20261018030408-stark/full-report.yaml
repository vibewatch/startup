      - number: '4.2'
        title: Cost structure signals point to a capital-intensive hardware-plus-software buildout
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a company still spending aggressively on engineering and industrial capacity.
              Stark's homepage says more than 45% of expenditure is invested into R&D, and independent reporting on the
              June 2026 round says the fresh capital is intended to expand electronic-warfare research facilities, add
              manufacturing capacity, and support output at thousands of systems per month. Those signals are
              directionally consistent with a defense manufacturer that also carries a meaningful software and autonomy
              burden, rather than a low-capex software vendor.


              The problem is that the available evidence stops at directional cost signals. The retained sources do not
              disclose gross margin, warranty burden, field-support cost, inventory turns, receivables cadence, capex,
              or service-delivery cost. That means public diligence can say Stark is likely investing heavily ahead of
              scale, but it cannot say whether that spending is generating attractive unit economics, whether software
              offsets hardware margin pressure, or whether working capital will expand alongside production.
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI008
              - CI011
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI008
              - CI011
              - CI014
      - number: '4.3'
        title: Capital access is strong, but capital adequacy is still unproven
        blocks:
          - type: paragraph
            body: >-
              Company Overview covers the round-by-round chronology; the financial takeaway is the step change in size
              and valuation between the 2025 and 2026 financings. DealMatrix reports a $62 million 2025 round at a $500
              million valuation, while Grosswald reports a €500 million June 2026 round at a valuation above €3.5
              billion and roughly €640 million of total funding since founding. That is a dramatic markup in less than a
              year and gives Stark more room than most defense startups to fund engineering, manufacturing, and
              deployment before public revenue disclosure catches up.


              Even so, the raise should not be mistaken for proof that Stark is fully financed to scale. The retained
              sources do not disclose cash on hand after the round, burn rate, covenant constraints, backlog conversion,
              or working-capital consumption, and third-party reports do not reconcile the exact economic weight of the
              Bundeswehr-linked order book. The public case for capital adequacy therefore rests on investor appetite
              and announced use of proceeds, not on auditable evidence that Stark can self-fund production ramp or hit
              acceptable payback on each deployed system.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
      - number: '4.4'
        title: 'Financial verdict: demand and fundraising are credible, revenue quality is not yet underwritable'
        blocks:
          - type: paragraph
            body: >-
              The strongest financial positives are real. Stark appears to have credible access to top-tier capital, a
              product set aligned with active European defense procurement, and public signals that the company is
              prioritizing engineering and production scale over short-term optics. That is materially better than a
              pre-product defense startup still proving technical relevance.


              The underwriting blockers are also real. Public evidence does not disclose revenue, margins, realized
              pricing, customer concentration, cash runway, or contract economics, and one of the assigned independent
              sources explicitly warns that not every €3.5 billion defense valuation survives sector consolidation. The
              right conclusion is not that Stark lacks traction; it is that the retained public evidence is sufficient
              to support diligence interest, but insufficient to support a clean view on revenue quality, margin path,
              or how much additional capital the business may need after the current manufacturing push.
            claimRefs:
              - CI006
              - CI011
              - CI012
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio breadth and customer workflow
        blocks:
          - type: paragraph
            body: >
              The reviewed public surface supports treating STARK as a multi-domain defence stack, not a one-product
              vendor. Its homepage names one-way effectors, command-and-control software, maritime vessels, CASCADE,
              GAMBIT, MOSA, and VANTA 12, while independent profiles describe the same portfolio as loitering munitions,
              unmanned surface vessels, and mission-control software. That matters because the buyer workflow is broader
              than simple drone procurement: STARK is positioning software, effectors, and platforms together for
              reconnaissance, strike, and maritime patrol missions across NATO operators. Public evidence is still
              marketing-heavy, but it is specific enough to map product families to operator jobs and to separate the
              core software layer from the air and maritime hardware layers.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE010
          - type: table
