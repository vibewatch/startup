      - number: '1.3'
        title: Capital base and milestone compression
        blocks:
          - type: paragraph
            body: >-
              The financing arc in the assigned pool is steep. DealMatrix reported a $62 million round at a $500 million
              valuation in 2025, and by June 2026 Tectonic and Vestbee were reporting a €500 million financing, with
              Tectonic citing a €3.5 billion valuation and Vestbee stating total disclosed funding had reached €640
              million. That is enough to conclude Stark moved rapidly from early venture financing into a much larger
              scale round, but not enough to underwrite the precise economics: there is still no official announcement
              in this pool confirming round structure, lead ownership, secondaries, or debt. The same milestone
              compression appears in operations. Within roughly two years of founding, Stark had disclosed NATO exercise
              activity, a new CEO, a Sweden office, and a new NATO-market contract. Tectonic also adds a caution flag by
              noting parliamentary delay around one Virtus deal tied to Founders Fund and Peter Thiel links, suggesting
              stakeholder politics can complicate procurement even when capital access remains strong.
