  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public record shows Stark compressing founding, product deployment, geographic expansion, and financing
      milestones into roughly two years.
    data:
      items:
        - date: '2024'
          label: Company founded in Berlin
          detail: DealMatrix and RobotToday both place Stark's founding in 2024 and base the company in Berlin.
          tone: positive
          claimRefs:
            - CO001
        - period: Aug 2025
          label: $62M round disclosed
          detail: DealMatrix reported a $62 million round at a $500 million valuation led by Sequoia Capital.
          tone: positive
          claimRefs:
            - CO011
        - date: 2025-09-30T00:00:00.000Z
          label: Vanta introduced at NATO exercise
          detail: >-
            Stark said it introduced the Vanta-4 and Vanta-6 USVs at the REP(MUS)/NATO Dynamic Messenger exercise in
            Portugal.
          tone: positive
          claimRefs:
            - CO006
            - CO008
        - date: 2025-10-16T00:00:00.000Z
          label: Horstmann becomes CEO
          detail: >-
            The company announced Uwe Horstmann as CEO and tied the appointment to production expansion, longer-range
            products, and new partnerships.
          tone: positive
          claimRefs:
            - CO007
        - period: Late Jan 2026
          label: Stockholm office opened
          detail: >-
            The February 2026 contract release says the Sweden office had been announced one week earlier, marking a new
            Northern Europe foothold.
          tone: positive
          claimRefs:
            - CO010
        - date: 2026-02-04T00:00:00.000Z
          label: New NATO-country contract announced
          detail: >-
            Stark said it signed a loitering-munition contract with the armed forces of a NATO country and expected
            first deliveries in February 2026.
          tone: positive
          claimRefs:
            - CO009
        - period: Jun 2026
          label: €500M financing reported
          detail: Tectonic and Vestbee both reported a €500 million financing, with Tectonic citing a €3.5 billion valuation.
          tone: positive
          claimRefs:
            - CO012
        - period: Jun 2026
          label: Scale-up use of proceeds described
          detail: >-
            Tectonic reported that more than 80% of the capital raised would go into R&D and manufacturing to support
            thousands of systems per month.
          tone: positive
          claimRefs:
            - CO015
    approximationNotes: >-
