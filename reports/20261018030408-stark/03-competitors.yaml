      - ["Maritime or multi-domain breadth", "Vanta plus Minerva extends the stack beyond air systems", "Direct strike peers are not shown here with cited maritime products", "Broader primes may cover adjacent domains, but retained sources do not show a like-for-like autonomous strike plus USV bundle", "Breadth can matter in multi-domain tenders more than in single-drone buys"]
      - ["Battle-management interoperability", "Official material says Minerva integrates across domains and onto conventional maritime battle-management platforms", "Unknown in retained sources", "Quantum is shown plugging into the recce-strike loop; other incumbents may already sit in defense workflows, but not with cited detail here", "Switching costs rise only if Stark wins the control layer"]
