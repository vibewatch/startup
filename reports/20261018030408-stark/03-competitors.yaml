      - Price, unit, or contract model
      - Included capabilities in retained evidence
      - Discount or unknowns
      - Implication
    rows:
      - [Stark, "Direct government procurement and framework-contract motion; no public list pricing in retained sources", "Loitering munitions, USVs, Minerva C2, and emerging C-UAS C2 references", "Unit pricing, discounting, sustainment economics, and gross margins are undisclosed", "Buyers may like the bundle, but outside underwriting cannot yet benchmark TCO"]
      - [Helsing, "Shared procurement context with Stark; no public per-system pricing in retained sources", "Direct strike-drone peer role in cited procurement", "Software scope, discounting, and unit economics are not disclosed here", "Direct benchmark exists strategically, but cost position remains opaque"]
      - [Quantum Systems, "Program partner role in cited exercise; pricing not disclosed in retained sources", "Vector reconnaissance contribution to the recce-strike loop", "No public bundled price or strike-capability scope in retained evidence", "Alternative may enter as a sensor partner instead of a full substitute"]
      - ["Rheinmetall and other incumbents", "Likely contract-led government procurement; public unit pricing not disclosed in retained sources", "Broader procurement presence and adjacent defense programs", "Retained sources do not provide apples-to-apples package or software detail", "Channel power can pressure Stark even without transparent public pricing"]
    notes: >
      The retained public sources describe contract context and product scope, not price books. Unknowns
      are left explicit instead of being backfilled from assumption.
    enumerationScope:
      coverage: partial
      basis: >
        This table summarizes only the pricing or packaging evidence visible in retained public sources,
        which is incomplete for every named competitor.
    claimRefs: [CP004, CP012, CP013, CP015]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >
      Evidence-backed ordinal scoring places Stark high on platform breadth and above most cited peers on
      procurement validation, while the newest products remain less proven than the bundle narrative.
    data:
      points:
        - label: Stark
          x: 5
          y: 4
          note: "Breadth score reflects strike, maritime, and C2 products; validation score reflects cited procurement wins and exercises."
        - label: Helsing
          x: 3
          y: 4
          note: "Direct German strike-drone peer with shared procurement context, but retained sources do not show the same multi-domain stack."
        - label: Rheinmetall
          x: 4
          y: 3
          note: "Incumbent alternative with procurement weight, but retained sources frame it as displaced in the cited loitering-munition contest."
        - label: Quantum Systems
          x: 2
          y: 3
          note: "Strong adjacent reconnaissance role in the cited recce-strike loop, but not shown as the same-stack strike vendor."
        - label: Anduril or Aeronautics
          x: 3
          y: 2
          note: "Named international loitering-munition rivals, but retained sources provide weaker Europe-specific procurement proof."
        - label: Thales, Patria, or Kongsberg
          x: 4
          y: 2
          note: "Named broader sovereignty, swarm, or counter-drone alternatives with likely channel advantages, but not detailed here as like-for-like peers."
    approximationNotes: >
      Ordinal 1-5 scoring is synthesized from retained sources only. The x-axis represents platform
      breadth across strike, maritime, and control layers; the y-axis represents publicly cited program
      validation or procurement relevance in the retained evidence.
    claimRefs: [CP004, CP007, CP011, CP012]
callouts:
  - calloutType: insight
    title: Direct threat is a bundle decision, not a single-vendor matchup
    body: >
      The most important competitive question is whether a buyer wants a strike drone, a recon-plus-strike
      workflow, or a multi-domain control stack. Stark looks strongest when the program values the third.
    claimRefs: [CP001, CP003, CP007, CP009]
  - calloutType: risk
    title: Breadth narrative still outruns public proof on the newest SKUs
    body: >
      Cascade and Gambit expand the catalog, but retained sources still lack named launch customers and
      independent performance evidence specific to those systems.
    claimRefs: [CP002, CP010, CP011]
