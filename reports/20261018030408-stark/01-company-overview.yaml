slug: stark
runDate: 2026-10-18
company:
  name: Stark
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Stark is a Berlin-based defence-technology company founded in 2024 that
    presents a multi-domain stack around the Virtus loitering munition, Vanta
    unmanned surface vessels, and Minerva command-and-control software. The
    assigned 2025-26 evidence shows unusually rapid product, geographic, and
    financing expansion, but founder attribution, financing terms, and basic
    operating metrics such as revenue, customer count, and headcount remain only
    partially disclosed in public sources.
sections:
  - id: identity-products-and-footprint
    title: Identity, products, and operating footprint
    body: >-
      Stark is consistently presented in the assigned evidence as a European
      defence-technology company headquartered in Berlin and founded in 2024,
      with a product set spanning strike drones, maritime autonomous systems,
      and command software rather than a single-asset program. The cleanest
      reader-facing shorthand is a software-driven unmanned-systems company for
      allied militaries: the homepage centers Virtus, Vanta, and Minerva, while
      third-party profiles repeat the same air-maritime-software stack. The
      current footprint appears operational rather than conceptual. By September
      and October 2025, the company was publicly tying Vanta to NATO maritime
      exercises and saying Virtus had already been deployed in Ukraine, and by
      February 2026 it was disclosing a new NATO-country contract plus a Sweden
      office. That supports a growth-stage operating profile, but the exact
      named customer roster, backlog, and production throughput remain partly
      opaque in the assigned pool.
    claimRefs: [CO001, CO005, CO006, CO008, CO009, CO010]
    tableRefs: [TO001]
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      Public founder and leadership visibility is adequate for naming key
      people, but still too thin to treat governance as closed. Uwe Horstmann
      is the clearest operating center of gravity because the company publicly
      announced him as CEO in October 2025, linked him to the next scale phase,
      and external profiles also list him as a founder. The problem is founder
      attribution consistency: Vestbee describes Stark as founded by Horstmann,
      while RobotToday and DealMatrix list Florian Seibel and Johannes Schaback
      alongside him. That discrepancy is not fatal for identity, but it matters
      for later diligence on control, prior operating history, and division of
      responsibilities. Investor visibility is better than board visibility:
      Sequoia, the NATO Innovation Fund, Project A, and In-Q-Tel appear across
      multiple sources, but the assigned pool does not establish board
      composition, voting control, or any secondary/debt component.
    claimRefs: [CO002, CO003, CO004, CO007, CO013]
    tableRefs: [TO002]
  - id: capital-base-and-milestone-compression
    title: Capital base and milestone compression
    body: >-
      The financing arc in the assigned pool is steep. DealMatrix reported a
      $62 million round at a $500 million valuation in 2025, and by June 2026
      Tectonic and Vestbee were reporting a €500 million financing, with
      Tectonic citing a €3.5 billion valuation and Vestbee stating total
      disclosed funding had reached €640 million. That is enough to conclude
      Stark moved rapidly from early venture financing into a much larger scale
      round, but not enough to underwrite the precise economics: there is still
      no official announcement in this pool confirming round structure, lead
      ownership, secondaries, or debt. The same milestone compression appears in
      operations. Within roughly two years of founding, Stark had disclosed
      NATO exercise activity, a new CEO, a Sweden office, and a new NATO-market
      contract. Tectonic also adds a caution flag by noting parliamentary delay
      around one Virtus deal tied to Founders Fund and Peter Thiel links,
      suggesting stakeholder politics can complicate procurement even when
      capital access remains strong.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
    figureRefs: [FO001]
