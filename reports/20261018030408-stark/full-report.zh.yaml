  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              STARK 的可服务市场小于广义全球防务支出。其已披露产品组合位于三个相互关联的采购类别：单向攻击武器、无人海上系统，以及面向跨域作战的指挥控制软件。客户边界也受到约束：供应商资料称 STARK 服务 NATO
              成员及最亲密的伙伴国家，而公司自身材料强调 NATO
              互操作性和欧洲主权。因此，纳入的支出应限于能够采购这些系统、任务软件、集成、培训和相关载荷的项目。有人驾驶舰艇、通用企业软件、无关导弹以及各国防务预算的全部金额均应排除。现状替代方案包括有人巡逻资产、传统侦察与打击链、单独采购的攻击武器，以及军方内部集成。划清这一边界，才能避免把战略需求误当成立即可争取的收入。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM016
      - number: '2.2'
        title: 受证据约束的市场规模判断
        blocks:
          - type: paragraph
            body: >-
              现有来源支持从多个需求角度观察市场，但不足以得出货币化市场总额。STARK 称欧洲 NATO 盟国负责约五百万平方公里的海域，并将任务与海底数据电缆和海运贸易联系起来。资料称 Vanta-4 和 Vanta-6
              的航程最高可达 900 海里；独立报道则称 Vanta-12 面向 1,200 英里巡逻、速度超过 40 节，并可连续出海数周。这些数字反映了作战规模和持续作业问题，但它们不是可互换的单位，不能相加得出
              TAM。融资和框架合同报道也只是产能与采购信号，并非收入。审阅的八个页面中，没有一个提供独立推导的年度分类支出、合资格项目数量、定价、赢单率或与产量挂钩的收入，因此无法拆分 SAM 或 SOM。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
              - CM016
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              国防部和采购机构是经济付款方；海军、陆军和联合司令部是实际用户；NATO 演习和军事评估则是重要的资格验证场景。REPMUS
              证据显示，采用路径从与传统及无人资产协同的模拟任务，逐步走向按军种采购和实际部署。STARK 向德国联邦国防军网络与信息领域服务司令部交付 Vanta-6，也说明最初的监视用例可能先于更广泛的打击集成。MBDA
              等载荷合作伙伴可以加快与既有武器库的集成，但也会带来认证、供应和路线图依赖。因此，可服务买方并不是所有 NATO
              实体，而是其中同时具备经费支持的任务、主权采购权、集成能力、法律授权，以及从试验走向作战验收路径的那一部分。
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM014
              - CM016
      - number: '2.4'
        title: 采用驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              NATO 防务预算上升、乌克兰战争带来的紧迫性、人员短缺、关键基础设施保护，以及对低成本、可大批量生产和部署系统的兴趣，共同支撑需求。STARK 在 13
              个月内从前线部署扩展到更广泛的空中、海上和软件产品组合，与这种紧迫性相符。已披露融资，以及将最新资金超过 80%
              投向研发和制造的计划，说明供给端在响应，但不等于终端需求已经得到证明，仍属未经证明。采用仍可能受到资格认证、自主打击规则、互操作性测试、载荷认证、预算周期，以及替换既有人驾和传统系统难度的拖延。对估值而言，关键缺口在于：演习和框架额度如何转化为有资金支持的订单、交付、确认收入，以及具名预算负责人的重复采购。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 需求证据尚不足以证明可获得的收入
            body: 演习、战略需求、融资和框架额度支持市场相关性；但要评估收入质量，还需要具名预算负责人的有资金订单、定价、交付、验收里程碑和重复采购。
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范围横跨直接打击同业、相邻系统供应商和传统替代方案
        blocks:
          - type: paragraph
            body: >
              Stark
              应被视为多类别竞争者，而不是单一无人机初创公司。官方和供应商资料将其产品覆盖巡飞弹药、无人水面艇及指挥控制软件，因此买方可以在同一项目中将其与直接打击同业、相邻的侦察或任务软件供应商，以及传统防务巨头进行比较。在此处引用的德国侦察—打击演习中，Quantum
              Systems 提供侦察，Stark 提供打击和控制；因此 Quantum 在该项目中属于相邻集成替代方案，而非同类打击竞争者。独立来源一贯将 Helsing 定位为最接近的德国巡飞弹药同业，将
              Rheinmetall 视为传统厂商的反制风险；Elintium 则把范围扩展到 Anduril、Aeronautics、Kongsberg、Thales 和
              Patria，供买方评估更广泛的自主化或反无人机方案。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP013
      - number: '3.2'
        title: 差异化更多依赖集成广度，而非单一产品
        blocks:
          - type: paragraph
            body: >
              有证据支持的最清晰差异化在于架构广度。Stark 自有渠道和近期发布报道显示，Virtus 已不再是唯一产品：Cascade 和 Gambit 扩大了打击产品目录，Vanta 将方案延伸至海上系统，Minerva
              则被定位为跨域通用控制层。这一点很重要，因为引用的德国联邦国防军和海上资料强调的价值，是缩短从发现到交战的链路，并将无人系统接入现有战场管理流程，而不是再增加一个孤立的点状产品。如果 Minerva
              成为采用方的控制层，切换成本可能上升；但这一锁定逻辑取决于客户是否会标准化使用 Stark 的软件，而不是在另一套指挥栈下混用独立的侦察、打击和海上供应商。
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP009
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP009
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP007
              - CP011
              - CP012
      - number: '3.3'
        title: 采购相关性可见，但公开价格透明度薄弱
        blocks:
          - type: paragraph
            body: >
              公开证据更能支持采购相关性，而不是商业透明度。保留的来源描述其直接向政府或 NATO 相关防务买方销售，提到框架合同和采购赢单，并指出一笔新的 €500 million 融资将用于扩大研发和制造。这一组合有助于
              Stark 证明自己能够随客户需求扩张，但仍尚未让外部投资人或买方清楚了解其单系统定价、折扣、维护条款，或相对于 Helsing 和大型传统厂商的毛利结构。因此，Stark
              的市场地位看起来具有战略重要性且资金日益充足，但仅凭公开证据，仍难以比较其全生命周期总成本。
            claimRefs:
              - CP004
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: 持久性确实存在，但尚未去风险
        blocks:
          - type: paragraph
            body: >
              Stark 的护城河似乎更多来自速度、集成和资本获取能力，而不是来自一份长期且经独立验证的性能记录。DroneXL 的时间线仍显示，公司从 2025 年末的高关注度试验失败，走向后续采购势头和 2026 年 6
              月新产品发布；但保留的公开报道尚未披露这些产品的首发客户。由此，商品化和传统厂商反击仍是严肃风险：如果巡飞弹药更容易采购、指挥软件标准保持开放，买方就可以同时使用多家供应商。反过来，如果 Stark 将
              Minerva 与跨域硬件转化为持续的项目制采用，其被替代的难度可能高于单一 SKU 无人机供应商。现有证据支持这一结果存在可能，但不能证明它必然发生。
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 直接威胁是组合方案选择，而非单一供应商对决
            body: |
              最重要的竞争问题是：买方需要的是打击无人机、侦察加打击流程，还是跨域控制栈。Stark 在项目重视第三种方案时看起来最强。
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP009
          - type: callout
            title: 广度叙事仍领先于最新 SKU 的公开证明
            body: |
              Cascade 和 Gambit 扩大了产品目录，但保留的来源仍缺乏具名首发客户，以及针对这些系统的独立性能证据。
            calloutType: risk
            claimRefs:
              - CP002
              - CP010
              - CP011
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业模式以采购为主导，但公开变现细节有限
        blocks:
          - type: paragraph
            body: >-
              保留的来源一贯将 Stark 描述为销售军事软硬件组合，而非消费品或自助式软件产品。官方和公司发布的资料介绍了 Virtus 巡飞弹药、Vanta 无人水面艇和 Minerva 指挥控制软件，客户为 NATO
              成员国及伙伴军队；官方海事公告则将 Vanta 和 Minerva 描述为跨域作战中的互操作组件。这些证据支持一种能力组合收入模式：采购授标、部署和后续生产的重要性高于席位数或按用量计费。


              但要从产品相关性走向收入质量，仍缺少变现层信息。保留的来源没有披露 Virtus、Vanta 或 Minerva
              的标价、实际成交价、折扣、软件许可结构、合同期限、付款里程碑或服务附加率。因此，财务分析必须把已证实内容——产品、客户和公开的规模化目标——与未证实内容分开：正是定价机制决定了军事需求转化为确认收入和毛利的速度。
