      - number: '5.2'
        title: 架构与集成模式
        blocks:
          - type: paragraph
            body: >
              最清晰的架构信号来自 Minerva 的编排层角色。STARK 2025 年的海事发布称，Minerva 旨在让 Vanta 以编队运行、与侦察和打击无人机互操作，并接入传统战场管理系统；Naval News
              补充称，Vanta 12 的传感器 / 攻击武器栈围绕 Minerva 集成，STARK 正寻求接入更大的数字目标指示网络。公司的产品定位也强调模块化，而不是封闭的垂直系统：Vanta
              被描述为不依赖特定传感器和攻击武器，MOSA 围绕数字主权定位，招聘信息则指向支撑飞机设计和反无人机系统 C2 开发的开源仿真与 AI agent
              工具。实际含义是，这是一个软件定义架构，拥有许多集成接口；认证成功时它会很强，但每个外部依赖边界也会增加执行风险。
