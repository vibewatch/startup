chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营足迹
        blocks:
          - type: paragraph
            body: >-
              指定证据一贯将 Stark 描述为一家总部位于柏林、成立于 2024
              年的欧洲防务科技公司，产品覆盖攻击无人机、海上自主系统和指挥软件，而非单一资产项目。面向读者最简洁的概括是：一家以软件驱动的无人系统公司，服务盟军；其官网重点展示 Virtus、Vanta 和
              Minerva，第三方资料也反复提到同一套空中—海上—软件产品栈。当前足迹看起来已经进入运营阶段，而非停留在概念阶段。到 2025 年 9 月和 10 月，公司已公开将 Vanta 与 NATO
              海上演习联系起来，并称 Virtus 已在乌克兰部署；到 2026 年 2 月，公司又披露了一个新的 NATO
              国家合同和一家瑞典办公室。这支持其成长期运营画像，但指定来源池对具体客户名单、订单积压和产能吞吐量的披露仍然不完整。
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: 创始人、管理层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开创始人和管理层信息足以识别关键人物，但仍不足以认为治理结构已经清晰。Uwe Horstmann 是最明确的运营核心：公司于 2025 年 10 月公开宣布其出任
              CEO，并将其与下一阶段规模化联系起来；外部资料也将其列为创始人。问题在于创始人归属并不一致：Vestbee 称 Stark 由 Horstmann 创立，而 RobotToday 和 DealMatrix 则将
              Florian Seibel、Johannes Schaback 与他并列。这一差异不影响公司身份判断，但会影响后续对控制权、过往经营经历和职责分工的尽调。投资人透明度好于董事会透明度：Sequoia、NATO
              Innovation Fund、Project A 和 In-Q-Tel 出现在多个来源中，但指定来源池无法确认董事会构成、投票控制权，或是否存在二级交易 / 债务成分。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO007
              - CO013
