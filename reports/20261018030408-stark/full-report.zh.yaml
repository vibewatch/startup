      - number: '7.4'
        title: 财务、伙伴与集中度风险
        blocks:
          - type: paragraph
            body: >-
              财务和依赖关系仍是投资判断中最棘手的部分。指定来源池支持这样的变化：Stark 从 2025 年 $62 million、估值 $500 million 的融资，走到 2026 年约 €3.2-3.5
              billion 估值、€500 million
              融资；但来源没有披露经审计收入、毛利率、消耗率或实际合同转化。这不代表估值一定错误，但当前公开叙事更多由投资人质量、客户紧迫性和框架授标头条支撑，而不是透明的运营指标。依赖关系也集中在一组狭窄的交易对手和项目上。RobotToday
              称 STARK 只向 NATO 成员及亲密伙伴销售；Dealroom 和 Tectonic
              则将增长计划与收购、投资人支持和少数防务关系联系起来。结果是：公司确有真实势头和明确缓释因素，但下行风险也异常暴露于采购时点、资金纪律和集成执行。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: 终止标准、监测指标与尽调要求
        blocks:
          - type: paragraph
            body: >-
              在评估新一轮融资或二级交易前，尽调应强制执行三个可量化测试。第一，采购集中度必须得到硬数据；如果 STARK 无法展示可签约订单积压、调用节奏，以及德国和 NATO
              相关项目以外的客户结构，集中度风险仍高。第二，产能规模必须用数据证明，而不是靠叙述；月度产量、验收良率、现场退回率和任务成功数据，应与新资本将制造能力推向每月数千套系统的说法同步改善。第三，估值纪律需要运营证据；如果管理层无法用收入、毛利率、消耗率、跑道和单位经济性解释估值跃升，那么这轮融资定价更多建立在战略热情之上，而不是持久基本面。这些就是本章的核心论点破裂触发点。
            claimRefs:
              - CR007
              - CR008
              - CR014
              - CR015
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: 本章的论点破裂触发点
            body: 如果尽调无法验证可见 NATO / 德国项目之外的多元化订单积压，如果制造产量和验收数据无法支持规模化叙事，或管理层无法将估值跃升与经审计运营指标及合同兑现联系起来，就应放弃交易或重新定价。
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与公开估值真正说明了什么
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，不到一年内估值大幅跃升。DealMatrix 将 2025 年 8 月融资记为 $62 million、估值 $500 million；Tectonic、Vestbee 和 Dealroom 对
              2026 年 6 月的报道则称，Stark 完成 €500 million 融资，估值约 €3.5 billion。Silicon Valley Invest Club 还记录了 2026 年 2 月超过 $1
              billion 的中间节点，以及另一笔大额融资的讨论；这支持估值上行方向，但具体中间条款仍很少。因此，这个估值不是没有噪音的精确区间，但多个第三方追踪机构和新闻来源都指向同一结论：Stark
              很快从早期验证阶段重估到战略规模预期。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.2'
        title: 存在价格支撑，但投资判断链条尚不完整
        blocks:
          - type: paragraph
            body: >-
              当前支撑估值的是战略势头，而不是公开披露的运营基本面。Stark 官方定位覆盖巡飞弹药、无人水面艇和指挥控制软件；第三方资料则描述了真实的德国联邦国防军和 NATO 相关项目进展，以及一笔主要用于研发和制造的大额
              2026 年 6 月融资。这足以构成合理的战略稀缺性叙事。但缺失的信息同样重要：Sacra 称没有披露公开收入、ARR
              或盈利数字，公开来源也没有揭示清算优先权、确切持股摊薄，或最新一轮融资的完整股东名册。             
              这些锚点尚未补齐，因此市场证据支持持续跟踪公司及下一轮尽调披露，而不足以据最新私募估值做出买入判断。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: 情景逻辑由转化驱动，而非只靠叙事
        blocks:
          - type: paragraph
            body: >-
              上行情景并不难想象：如果 Stark 将新资本转化为规模化产出，将头条合同转化为 NATO
              的重复需求，同时保持产品迭代速度优势，那么在主权自主和防务工业能力稀缺的领域，当前估值仍可能合理。基准和下行情景则更常见：采购周期仍可能持续数年，认证和政治审查可能拖慢现金转化；一旦执行失误，当前价格几乎没有公开收入支撑。因而，情景权重应重点看制造吞吐量、已确认订单积压质量和后续采购证据，而不是只看头条估值。
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.4'
        title: 最终判断、论点破裂触发点与尽调要求
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，建议以中等信心继续跟踪，风险评级为高。若要转为更积极的判断，需要证明 2026 年 6
              月融资带来了可量化的产能、客户转化和经营杠杆，而不只是战略期权。最快改变判断的证据，是经审计或董事会层面的收入、订单积压、毛利率、消耗率和融资条款披露，以及独立确认框架授标正在转化为已确认交付项目。如果
              Stark 无法将资本和合同可见度转化为可重复的采购赢单，或后续融资显示当前估值隐含的条款明显不如头条估值所暗示的水平，核心论点就会破裂。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 继续跟踪而非买入：Stark 的品类地位很有吸引力，但当前估值领先于进行常规投资判断所需的运营披露。
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
              - CV016
          - type: callout
            title: 哪些信息最可能迅速改变判断
            body: 经审计收入、订单积压、毛利率、消耗率和确切融资条款披露，比又一个头条估值数字更可能改变判断。
            calloutType: risk
            claimRefs:
              - CV009
              - CV015
              - CV016
