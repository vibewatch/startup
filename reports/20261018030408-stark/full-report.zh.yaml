      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 看涨
        - 2026 年 6 月的资金将生产推向规模化，带来 NATO 的重复采购，并提升软件附加销售。
        - 如果 Stark 成为稀缺的主权自主系统平台，而不只是单一项目的无人机供应商，当前估值仍可站住。
        - 产能交付、复购订单，以及比同业更充分的信息披露。
        - 资质审批延误、需求转化弱于预期，或利润率不透明。
      - - 基准
        - 需求确实存在，但变现遵循正常的国防采购节奏，披露仍不完整。
        - 估值在私募市场或许能维持，但没有更好的价格或新的验证点，新投资者很难评估上行空间。
        - 信号参差：需求叙事强，但公开财务披露弱。
        - 信息披露没有改善却再次上调估值。
      - - 看跌
        - 头条合同的变现能力低于预期，或后续融资条款暴露出新资金面对的经济性较弱。
        - 估值倍数过高而后续压缩，是因为投资者买的是稀缺性和战略紧迫感，而非经过验证的基本面。
        - 收入可见度有限、政治摩擦和漫长采购周期仍未解决。
        - 下轮融资信号、交付延误，或积压订单转化疲弱的证据。
    notes: 这些是定性情景，因为公开来源没有披露收入、毛利率、现金消耗，也没有完整的股权结构表，无法按常规估值模型测算。
