  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: |
      基于证据的序数评分显示，Stark 的平台广度较高，在采购验证上也超过大多数被引用的同业；但最新产品的验证程度仍低于产品组合叙事。
    data:
      points:
        - label: Stark
          x: 5
          'y': 4
          note: 广度评分反映打击、海事和 C2 产品；验证评分反映被引用的采购赢单和演习记录。
        - label: Helsing
          x: 3
          'y': 4
          note: 德国直接的打击无人机同业，采购背景相近，但保留来源没有显示其拥有同样的多域产品栈。
        - label: Rheinmetall
          x: 4
          'y': 3
          note: 具备采购分量的现有供应商替代者，但保留来源称其在所引用的巡飞弹竞争中被取代。
        - label: Quantum Systems
          x: 2
          'y': 3
          note: 在所引用的侦察—打击闭环中承担强势的相邻侦察角色，但没有显示其是同一产品栈的打击供应商。
        - label: Anduril 或 Aeronautics
          x: 3
          'y': 2
          note: 被点名的国际巡飞弹竞争者，但保留来源提供的欧洲特定采购证据较弱。
        - label: Thales、Patria 或 Kongsberg
          x: 4
          'y': 2
          note: 被点名的更广义主权、蜂群或反无人机替代者，可能具备渠道优势，但此处未将其作为同类同口径对手详述。
    approximationNotes: |
      1–5 的序数评分仅根据保留来源综合得出。x 轴代表打击、海事和控制层面的平台广度；y 轴代表保留证据中公开引用的项目验证或采购相关性。
    claimRefs:
      - CP004
      - CP007
      - CP011
      - CP012
  - id: FI001
    title: 有公开证据支持的收入模型桥接
    type: flow
    summary: 证据支持一条从 NATO 需求到硬件 / 软件打包交付、以采购为主导的路径，但从订单到确认收入和毛利的最后一步仍未披露。
    data:
      nodes:
        - label: NATO 与伙伴国需求
          detail: 官方和公司发布的来源称，Stark 向 NATO 成员国及关系密切的伙伴国供货。
        - label: 采购授标与项目准入
          detail: 商业化似乎由国防采购合同驱动，而非自助式软件销售。
        - label: 打包产品栈
          detail: Virtus 巡飞弹、Vanta USV 和 Minerva C2 软件构成有公开证据支持的商业产品组合。
        - label: 研发与工程投入
          detail: Stark 表示，超过 45% 的支出投入研发。
        - label: 制造扩产
          detail: 独立报道称，2026 年 6 月募集资金的 80% 以上将投入研发和制造，以达到每月生产数千套系统。
        - label: 确认收入与毛利
          detail: 公开来源没有披露实际定价、收入、利润率或现金转化。
      edges:
        - from: NATO and partner-state demand
          to: Procurement awards and program access
        - from: Procurement awards and program access
          to: Bundled product stack
        - from: Bundled product stack
          to: R&D and engineering spend
        - from: R&D and engineering spend
          to: Manufacturing scale-up
        - from: Manufacturing scale-up
          to: Recognized revenue and gross profit
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI007
      - CI008
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: STARK 的公开产品面将操作员软件叠加在空中和海事平台之上，并通过载荷和工业集成拓宽架构。
    data:
      layers:
        - label: 操作员任务
          detail: Stark 面向 NATO 买家提供海上巡逻、分布式打击、反 UAS 协同和多域作战能力，而不是围绕单一平台销售。
          outputs:
            - 持续性海事 ISR
            - 分布式打击
            - 传感器到效应器的任务调度
        - label: 任务软件
          detail: Minerva 是具名的 C2 / 任务自主层；MOSA 和正在招募的 C-UAS 套件进一步拓宽软件切入点。
          modules:
            - Minerva
            - MOSA
            - C-UAS C2 套件
          outputs:
            - 编组无人系统作战
            - 弱链路协同
            - 战场管理集成
        - label: 空中效应器
          detail: 公开产品组合证据指向多个空中产品，而非单一巡飞弹。
          modules:
            - Virtus
            - Cascade
            - Gambit
        - label: 海事平台
          detail: Vanta 家族构成无人海事艇体层，续航能力和打击目标不断提升。
          modules:
            - Vanta 4
            - Vanta 6
            - Vanta 12
        - label: 载荷与传感器
          detail: 公开描述强调模块化搭载传感器和效应器，而非固定任务套件。
          modules:
            - Sea Venom 概念集成
            - ISR 传感器套件
            - 电子战系统
        - label: 工业 / 工程基础
          detail: 快速制造和扩产的说法依赖船厂合作伙伴，以及内部的开源仿真和 AI 辅助工程流程。
          modules:
            - 合作船厂
            - OpenVSP / OpenFOAM / OpenMDAO
            - AI 代理工作流
    approximationNotes: 架构只反映指定来源中点名的公开模块和依赖关系；隐藏的子系统和机密控制被有意排除。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE009
      - CE010
      - CE011
      - CE013
  - id: FU001
    title: 公开证据中的客户采用路径
    type: journey-map
    summary: 公开证据集中在政府采购路径：从技术匹配到签约，再到交付或基于演习的扩张；但持续性仍未经验证。
    data:
      nodes:
        - label: 盟国国防买家需求
          tone: neutral
          detail: 公开证据聚焦于与 NATO 对齐的政府买家，而非商业客户。
          touchpoints:
            - NATO member states and closest partner nations
            - European defence agencies and Bundeswehr references
        - label: 多产品评估
          tone: medium
          detail: 空中、海事和 C2 产品为同一买家提供多个采用入口。
          touchpoints:
            - Virtus loitering munition
            - Vanta maritime platform
            - Minerva command-and-control software
        - label: 首份合同
          tone: positive
          detail: NIF 称 Stark 在九个月内拿下首份合同。
          touchpoints:
            - Early procurement acceptance
            - Speed is a core adoption signal
        - label: 部署交付
          tone: positive
          detail: STARK 表示，13 个月内已实现前线部署；一份 2026 年合同则在签约当月完成首次交付。
          touchpoints:
            - Frontline deployment claim
            - First tranche due in signing month
        - label: 项目扩张
          tone: positive
          detail: 公开报道指向德国框架协议活动，以及进入新的欧洲市场。
          touchpoints:
            - German military awards and framework reporting
            - New NATO-country contract
            - Partnerships with Germany, Ukraine, and the UK
        - label: 持续性仍不透明
          tone: adverse
          detail: 公开证据没有披露续约率、客户流失率或头部客户集中度。
          touchpoints:
            - No NRR or GRR
            - No public customer-count disclosure
            - Parliamentary friction around one major deal
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU009
      - CU011
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中在采购集中度、制造扩产、估值支撑和验证缺口，而不是需求创造。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
        - label: 剩余评级
      rows:
        - label: 政府买家集中度
          note: 可见需求集中在 Bundeswehr 和与 NATO 对齐的项目。
          values:
            - label: 高
              tone: risk
            - label: 严重
              tone: risk
            - label: 初期
              tone: risk
            - label: 高
              tone: risk
        - label: 制造爬坡
          note: STARK 正同时扩大设施、产量和产品广度。
          values:
            - label: 高
              tone: risk
            - label: 高
              tone: risk
            - label: 中
              tone: warning
            - label: 高
              tone: risk
        - label: 估值支撑缺口
          note: 2025 年至 2026 年的估值跃升没有公开收入、现金消耗或毛利率披露相匹配。
          values:
            - label: 中
              tone: warning
            - label: 严重
              tone: risk
            - label: 已获资金支持
              tone: positive
            - label: 高
              tone: risk
        - label: 政治 / 出口管制审查
          note: 议会敏感性和安全审查负担可能拖慢授标或部署。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 有限
              tone: risk
            - label: 中高
              tone: risk
        - label: 可靠性验证缺口
          note: 指定来源池中最有力的验证证据仍由公司发布。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 发展中
              tone: warning
            - label: 中高
              tone: risk
        - label: 集成 / 技术保障
          note: 收购、自主能力、电子战和 C2 工作流增加了协调与验证负担。
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
            - label: 中
              tone: warning
            - label: 中
              tone: warning
    approximationNotes: 可能性和影响的位置由分析师根据引用证据设定；尽调取得合同、可靠性和合规数据后应更新。
    claimRefs:
      - CR007
      - CR008
      - CR010
      - CR012
      - CR014
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: Stark 的战略需求和融资势头确实存在，但运营披露缺失、采购摩擦仍在，因此基于公开证据的建议是持续跟踪。
    data:
      nodes:
        - id: demand-proof
          label: 战略需求证据
          detail: 与 Bundeswehr 相关的需求和仅面向 NATO 的定位，显示买家确有兴趣。
        - id: product-speed
          label: 产品广度与速度
          detail: Virtus、Vanta、Minerva 加上 13 个月内完成部署，强化了战略叙事。
        - id: private-mark
          label: 私募市场估值上调
          detail: 公开来源显示，估值从 2025 年 8 月的 $500M 升至 2026 年 6 月约 €3.2B-€3.5B。
        - id: missing-operating-data
          label: 运营披露缺失
          detail: 没有公开披露的收入、ARR、盈利能力或最新一轮融资完整条款，无法为当前估值提供锚点。
        - id: execution-drag
          label: 执行与采购拖累
          detail: 军方采用周期长达数年，加上政治审查，可能推迟现金转化。
        - id: recommendation
          label: 建议：持续跟踪
          detail: 投资者需要更好的价格支撑或经审计的运营证据，才应评估买入。
      edges:
        - from: demand-proof
          to: product-speed
          label: 验证
        - from: product-speed
          to: private-mark
          label: 有助于解释
        - from: private-mark
          to: missing-operating-data
          label: 提高证明负担
        - from: missing-operating-data
          to: execution-drag
          label: 叠加
        - from: execution-drag
          to: recommendation
          label: 导致
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
      - CV016
