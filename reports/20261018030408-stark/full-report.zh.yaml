      - number: '4.3'
        title: 资本获取能力强，但资本充足性仍未经证明
        blocks:
          - type: paragraph
            body: >-
              公司概览已覆盖逐轮融资时间线；财务层面的重点，是 2025 年与 2026 年融资之间规模和估值的跃升。DealMatrix 报道 2025 年完成 $62 million、估值 $500 million
              的融资；Grosswald 报道 2026 年 6 月完成 €500 million 融资，估值超过 €3.5 billion，成立以来累计融资约 €640 million。这不到一年内的估值大幅抬升，让
              Stark 比多数防务初创公司拥有更大空间，在公开收入披露追上来之前投入工程、制造和部署。


              即便如此，也不能把这轮融资误认为 Stark
              已获得足够资金完成规模化。保留的来源没有披露融资后的现金余额、消耗率、契约约束、订单积压转化或营运资金消耗；第三方报道也没有核对与德国联邦国防军相关订单簿的确切经济权重。因此，公开证据对资本充足性的支持，仍来自投资人意愿和公告中的资金用途，而不是可审计证据证明
              Stark 能自行承担产能爬坡，或让每套已部署系统达到可接受的回本水平。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
      - number: '4.4'
        title: 财务结论：需求与融资可信，但收入质量尚不足以纳入投资判断
        blocks:
          - type: paragraph
            body: >-
              财务层面的积极因素确实存在。Stark 似乎能够获得一线资本，产品组合契合欧洲正在推进的防务采购，公开信号也显示公司优先投入工程和产能，而非追求短期表面指标。这明显好于仍在证明技术相关性的前产品防务初创公司。


              但投资判断的障碍同样真实。公开证据没有披露收入、利润率、实际定价、客户集中度、现金跑道或合同经济性；指定的一家独立来源还明确提醒，并非所有 €3.5 billion 防务估值都能经受行业整合。正确结论不是
              Stark 没有 traction，而是保留的公开证据足以支持继续尽调，但不足以清晰判断收入质量、利润率路径，或当前制造扩张之后业务还需要多少额外资本。
            claimRefs:
              - CI006
              - CI011
              - CI012
              - CI013
              - CI014
