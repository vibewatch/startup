      - number: '1.3'
        title: 资本基础与里程碑压缩
        blocks:
          - type: paragraph
            body: >-
              指定来源池中的融资轨迹非常陡峭。DealMatrix 报道 2025 年完成 $62 million、估值 $500 million 的融资；到 2026 年 6 月，Tectonic 和 Vestbee
              报道公司完成 €500 million 融资，Tectonic 给出的估值为 €3.5 billion，Vestbee 则称累计披露融资已达到 €640 million。由此足以判断 Stark
              在很短时间内从早期风险融资进入更大规模的一轮融资，但还不足以评估其精确经济条件：来源池中仍没有官方公告确认轮次结构、领投方持股、二级交易或债务。运营层面也出现了类似的里程碑压缩。成立约两年内，Stark 已披露
              NATO 演习活动、新任 CEO、瑞典办公室和一份新的 NATO 市场合同。Tectonic 还提示了一个风险点：一笔与 Founders Fund 和 Peter Thiel 关系有关的 Virtus
              交易曾受到议会延迟，这说明即使融资渠道强劲，利益相关方政治也可能让采购复杂化。
