          label: Vanta-4 和 Vanta-6 覆盖范围
          value: up to 900 nautical miles
          detail: 公司自述的系统航程
          claimRefs:
            - CM005
        - id: expanded-system-reach
          label: Vanta-12 覆盖范围与续航
          value: 1,200 miles; 40+ knots; weeks at sea
          detail: 报道中的运行规格
          claimRefs:
            - CM006
        - id: eligible-buyers
          label: 采购资格
          value: NATO members and closest partners
          detail: 供应商所述的客户边界
          claimRefs:
            - CM002
        - id: obtainable-revenue
          label: 可辩护的 SAM 和 SOM
          value: not publicly quantifiable
          detail: 定价、项目数量、赢单率和交付转化数据均缺失
          claimRefs:
            - CM015
            - CM016
