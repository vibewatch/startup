      - number: '4.2'
        title: 成本结构显示这是资本密集型的软硬件建设
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，公司仍在大力投入工程能力和工业产能。Stark 官网称超过 45% 的支出投向研发；独立报道 2026 年 6
              月融资时称，新资金将用于扩大电子战研发设施、增加制造能力，并支持每月生产数千套系统。这些信号与一家同时承担大量软件和自主化工作、仍在制造防务产品的公司相符，而不是低资本开支的软件供应商。


              问题在于，现有证据只停留在方向性的成本信号。保留的来源没有披露毛利率、保修负担、现场支持成本、存货周转、应收账款回款节奏、资本开支或服务交付成本。因此，公开尽调可以判断 Stark
              可能在规模化前重投入，但不能判断这些支出是否带来有吸引力的单位经济性，软件是否抵消硬件毛利压力，或营运资金是否会随产量同步扩大。
            claimRefs:
              - CI004
