            body: >
              公开证据显示，不同产品的成熟度并不均衡。2025 年，Vanta 4 和 Vanta 6 已在 NATO 海事演习中测试，STARK 声称它们能够连续执行任务，航程最高达 900 海里。相比之下，2026 年关于
