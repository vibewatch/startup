  topStrengths:
    - Stark 已搭建起可信的多域产品组合，覆盖巡飞弹、无人水面艇和指挥软件。
    - 公开来源显示，公司融资积累速度异常快，并多次与 NATO 体系产生关联，这为其战略势头提供支撑。
    - 对一家年轻的国防初创公司而言，Stark 似乎很快就从原型阶段走到了采购和部署阶段。
  topRisks:
    - 公开来源没有披露收入、订单积压、毛利率、烧钱速度或现金跑道，因此当前估值主要靠叙事支撑。
    - 据报道的估值已跑在经营披露前面，当前价格高度依赖未来采购转化。
    - 国防项目的采购、认证和政治审查仍可能推迟收入确认。
  unresolvedGaps:
