evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: snapshot KPI table coverage
    missingEvidence: Revenue, customer count, and headcount disclosed with periods, denominators, and scope definitions.
    whyItMatters: >-
      These are the core operating metrics needed to judge scale, efficiency, and valuation support rather than relying
      on financing headlines.
    diligencePath: >-
      Request the current board deck or monthly operating KPI pack with dated revenue, active-customer, and employee
      definitions.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: An authoritative founder roster plus current board and executive-role disclosure.
    whyItMatters: >-
      Founder attribution and governance visibility affect control diligence, decision rights, and assessment of
      key-person dependence.
    diligencePath: >-
      Request incorporation records, the current board list, and management bios that tie each founder to present
      ownership or operating responsibility.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: stakeholder or investor map
    missingEvidence: >-
      Official confirmation of the June 2026 round structure, lead economics, secondary components, debt, and named
      customer contracts.
    whyItMatters: >-
      Capital-provider influence and customer concentration drive both procurement risk and whether the reported
      valuation is financeable on fundamentals.
    diligencePath: >-
      Obtain the financing announcement, term sheet summary, and contract/backlog schedule that reconcile investor
      rights with customer demand.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: spend-boundary
    missingEvidence: >-
      Program-level budgets, system pricing, eligible unit counts, integration and support economics, and the portion of
      framework ceilings funded for STARK-deliverable systems.
    whyItMatters: >-
      Without these denominators, included spend cannot be converted from a category definition into defensible annual
      SAM or obtainable revenue.
    diligencePath: >-
      Obtain the qualified pipeline by program, customer budget documents, contract call-offs, unit pricing, delivery
      schedules, and management's bottom-up market model.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM001
      - TM002
  - type: missing-source
    severity: material
    topic: independent-market-sizing
    missingEvidence: >-
      An independent forecast covering comparable autonomous strike, unmanned maritime, and command-and-control
      categories with geography, period, methodology, and non-overlapping spend definitions.
    whyItMatters: >-
      Current sources mix physical mission scale, company specifications, financing, and framework ceilings, none of
      which is a monetary market forecast or a reliable growth rate.
    diligencePath: >-
      Commission or obtain analyst data and public procurement schedules, then reconcile top-down category spend with a
      bottom-up program and unit model.
    relatedQuestionRefs:
      - QM008
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Program-level unit pricing, sustainment terms, discount structures, and gross-margin data for Virtus, Cascade,
      Gambit, Vanta, and Minerva.
    whyItMatters: >-
      Public contract context alone is not enough to benchmark Stark's cost position or buyer total cost of ownership
      versus Helsing or incumbent alternatives.
    diligencePath: >-
      Request framework-agreement annexes, procurement budget schedules, or customer documents that disclose unit
      pricing and sustainment assumptions.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: product-validation
    missingEvidence: Independent operational test data or named launch customers specific to Cascade and Gambit.
    whyItMatters: >-
      The newest products support Stark's breadth thesis, but retained public sources do not yet prove repeat
      procurement demand or field performance for those SKUs.
    diligencePath: >-
      Obtain trial reports, procurement notices, or customer references that specifically identify Cascade or Gambit in
      service.
    relatedQuestionRefs:
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: material
    topic: like-for-like-peer-benchmarking
    missingEvidence: >-
      Deeper product, pricing, and software detail for Helsing, Rheinmetall, Thales, Patria, Kongsberg, Anduril, and
      Aeronautics.
    whyItMatters: >-
      The current matrix and profile table are evidence-backed, but they still rely on class-level comparisons more than
      verified SKU-by-SKU benchmarks.
    diligencePath: >-
      In a deeper pass, retain peer product pages, procurement records, and independent reviews for each named
      competitor to convert class labels into direct benchmarks.
    relatedQuestionRefs:
      - QP003
      - QP006
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: underwriting-gaps
    missingEvidence: Audited revenue, backlog, gross margin, burn rate, cash balance, and runway for 2025 and 2026.
    whyItMatters: >-
      These are the core inputs required to judge revenue quality, liquidity, and whether the current production push is
      self-funding or financing-dependent.
    diligencePath: >-
      Request monthly management accounts, backlog rollforward, gross-margin bridge, and cash-flow statement through the
      latest quarter.
    relatedQuestionRefs:
      - QI003
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Contract pricing, software license terms, discounting, payment milestones, and after-sales/service economics for
      Virtus, Vanta, and Minerva.
    whyItMatters: >-
      Without realized pricing and payment terms, it is impossible to model contribution margin, CAC/payback proxies, or
      the quality of reported demand.
    diligencePath: Request redacted customer proposals, signed procurement terms, software schedules, and milestone billing examples.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: material
    topic: procurement-backlog
    missingEvidence: >-
      A reconciled explanation of Stark's Bundeswehr-linked order book, including framework ceiling, funded tranche,
      delivery schedule, and backlog still convertible into revenue.
    whyItMatters: >-
      Independent sources point to large demand, but they do not reconcile the economically relevant size and timing of
      the orders that would actually become revenue.
    diligencePath: Request the contract summary, funded tranche detail, acceptance milestones, and backlog aging by program.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: working-capital
    missingEvidence: >-
      Public or private disclosure on receivables, inventory, capex, supplier concentration, warranty cost, and
      field-support burden.
    whyItMatters: >-
      A business targeting thousands of systems per month may consume substantial working capital before revenue
      converts into cash.
    diligencePath: Request inventory policy, supplier terms, capex plan, receivables aging, and warranty/service cost history.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: technical-documentation
    missingEvidence: >-
      Public or diligence-room technical documentation for Minerva, MOSA, and the C-UAS software layer, including
      interfaces, admin workflows, and support model.
    whyItMatters: >-
      Without documentation, investors cannot underwrite integration burden, switching costs, supportability, or whether
      the software layer is genuinely sticky versus bundled marketing.
    diligencePath: >-
      Request current product docs, architecture diagrams, API/interface schemas, deployment patterns, support SLAs, and
      operator training materials.
    relatedQuestionRefs:
      - QE003
      - QE008
  - type: private-evidence-only
    severity: material
    topic: field-reliability
    missingEvidence: >-
      Program-level reliability, qualification, and sustainment evidence for Virtus, Vanta, and partner-integrated
      maritime strike configurations.
    whyItMatters: >-
      The current public record shows trials and concepts, but not enough operating data to separate impressive
      demonstrations from repeatable field performance.
    diligencePath: >-
      Request qualification reports, test-fire records, sea-trial summaries, maintenance burden data, sortie/mission
      success rates, and customer after-action feedback.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: material
    topic: security-and-compliance
    missingEvidence: >-
      Cyber assurance, secure-development, export-control, safety, and compliance evidence for the software and autonomy
      stack.
    whyItMatters: >-
      Product differentiation in defence software is not enough if buyer accreditation, cyber controls, or export
      restrictions delay deployment or limit addressable customers.
    diligencePath: >-
      Request secure-SDLC materials, accreditation status, red-team results, export-control matrix, data-handling
      policy, and any customer security requirements already passed.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: production-scale
    missingEvidence: >-
      Verified evidence for production-rate claims, shipyard throughput, and the economics behind mass-scalable
      autonomous systems.
    whyItMatters: >-
      The product thesis leans on affordable mass and rapid scaling, so underwriting requires proof that industrial
      partners and internal processes can deliver volume without degrading quality.
    diligencePath: >-
      Request plant throughput plans, supplier bottleneck analysis, partner agreements, defect/yield data, and unit-cost
      build curves by product family.
    relatedQuestionRefs:
      - QE005
      - QE007
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: Public NRR, GRR, churn, renewal-rate, customer-count, and contract-duration disclosures.
    whyItMatters: >-
      Without durability metrics, procurement wins cannot be translated into recurring quality, renewal confidence, or
      customer stickiness.
    diligencePath: >-
      Request cohort, renewal, backlog-conversion, and customer-count data by programme or country from management or
      primary procurement records.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A complete roster of public production customers and which programmes are live procurement versus trials.
    whyItMatters: >-
      The sample shows real activity, but it is too narrow to judge breadth of adoption or the mix between pilots,
      framework awards, and scaled deployment.
    diligencePath: >-
      Build a named-programme ledger from management disclosures, procurement databases, and customer announcements,
      then tag each row by contract stage and delivery status.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer, top-country, and channel-partner concentration metrics.
    whyItMatters: >-
      Germany and an unnamed allied customer dominate the visible record, so revenue or backlog concentration could be
      much higher than the public narrative suggests.
    diligencePath: >-
      Request backlog and revenue concentration by programme, ministry, and country, plus any reseller or
      prime-contractor dependence.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, gross margin, burn, cash runway, and booked-versus-framework backlog conversion for the 2025-2026
      growth period.
    whyItMatters: Without operating metrics, the public valuation step-up is harder to underwrite and downside is harder to size.
    diligencePath: >-
      Request management accounts, board materials, runway model, backlog bridge, and revenue recognition policy by
      program.
    relatedQuestionRefs:
      - QR003
      - QR008
  - type: missing-source
    severity: material
