artifact: customers
slug: stark
runDate: 2026-10-18
company:
  name: Stark
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof for STARK is strongest in NATO-aligned government procurement and
    exercise programs rather than in commercial-style account metrics. The company shows fast
    initial adoption and geographic expansion, but retention, renewal, and concentration remain
    materially under-disclosed in the assigned evidence set.
sections:
  - id: customer-base
    title: Customer base is government-led and mission specific
    body: >-
      The visible customer base is not a broad commercial roster; it is a concentrated set of
      allied defence buyers, operators, and program offices. Public sources point to ministries
      of defence and armed forces as buyer and payer, with end users spanning loitering munition
      operators, maritime ISR users, and command-and-control teams. The product set also implies
      a land-and-expand motion inside the same buyer account: Virtus addresses strike-drone
      procurement, Vanta expands into maritime missions, and Minerva can coordinate both domains.
      That gives STARK a plausible multi-product wedge within NATO programmes, but the company
      does not publish customer counts, contract values by segment, or attach rates for software.
    claimRefs: [CU001, CU002, CU014, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof exists, but named production deployments are still thin
    body: >-
      The strongest adoption signals are speed-to-contract and program-level proof rather than
      usage metrics. NATO Innovation Fund says STARK secured its first contract within nine
      months of founding, while STARK says it reached frontline deployment within 13 months.
      By 2026, independent reporting tied the company to a new NATO-country contract with
      same-month first delivery, public reporting on German military awards and framework
      activity for Virtus, and month-long NATO maritime testing for Vanta. Taken together, the
      evidence supports real demand and field relevance, but not yet a large set of named,
      independently verified production customers with disclosed unit economics or renewal data.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
  - id: durability-concentration
    title: Durability and concentration are the main customer unknowns
    body: >-
      STARK appears to be building around visible demand from NATO-aligned defence programmes,
      but public durability evidence is much weaker than its procurement headlines. The assigned
      sources do not disclose NRR, GRR, churn, renewal rates, customer satisfaction metrics, or
      contract duration, so there is no public proof that early program wins convert into a
      diversified recurring base. Concentration also remains a live risk: Germany and an unnamed
      NATO-country programme dominate the visible record, and one major German deal was publicly
      delayed in parliament before approval. Fresh capital and manufacturing expansion help
      capacity, but they do not resolve concentration or retention on their own.
    claimRefs: [CU011, CU012, CU013, CU015]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Public proof
      - Scale / signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Loitering munition programmes
        - National defence ministries / armed forces operators / state budgets
        - Virtus contract wins, framework activity, and delivery reporting
        - First contract within 9 months; follow-on 2026 contract and German programme evidence
        - Appears to be the flagship revenue anchor in public evidence
        - No disclosed reorder cadence, active fleet count, or contract duration
      - - Maritime ISR and strike programmes
        - Naval or maritime-security operators / mission crews / defence budgets
        - Vanta trials at REP(MUS)/NATO DYNAMIC MESSENGER
        - Nearly one month of daily serial missions in a NATO exercise
        - Opens a second mission domain for the same allied buyer set
        - No disclosed production procurement or deployed fleet count
      - - Multi-domain C2 software
        - Same defence operators / command users / defence budgets
        - Minerva is presented as the coordinating layer for air and maritime systems
        - Product is public, but customer count is undisclosed
        - Could deepen switching costs if adopted with effectors
        - No standalone software pricing, seat count, or attach-rate disclosure
      - - Geographic expansion accounts
        - Germany, Ukraine, UK, and an unnamed new European market / direct government relationships
        - FirstFeature cites new-market entry; public sources reference allied partnerships
        - Expansion beyond Germany is visible, but still tied to defence procurement
        - Diversifies reference quality across NATO geographies
        - Country mix, reseller role, and top-country concentration are undisclosed
    notes: >-
      Public segmentation is inferred from programme evidence and product surfaces; Stark does not
      publish customer counts, segment revenue, or software attach metrics.
    claimRefs: [CU001, CU002, CU005, CU010, CU014, CU016]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Time to first contract
        - 9 months from founding
        - 2024-2025
        - NATO Innovation Fund
        - Medium
        - Suggests unusually fast procurement acceptance for a new defence supplier
        - Customer identity, contract size, and repeat-purchase status are undisclosed
      - - Time to frontline deployment
        - 13 months from founding
        - 2024-2025
        - STARK homepage; DealMatrix
        - High
        - Supports fast conversion from product launch to operational use
        - Number of deployed systems and active operators is undisclosed
      - - New NATO-country delivery contract
        - First tranche due in signing month; full delivery due by end-August 2026
        - 2026
        - FirstFeature
        - Medium
        - Shows repeatable fulfillment and entry into a new European market
        - Contract value, customer identity, and reorder path are undisclosed
      - - German strike-drone procurement signals
        - Up to €300M / 4,000 drones in 2025 reporting; €2.8B framework in 2026 reporting
        - 2025-2026
        - RobotToday; Tectonic
        - Medium
        - Germany appears to be the best-evidenced anchor account
        - Revenue recognition, exercised framework volume, and deployment pace are undisclosed
      - - Maritime exercise cadence
        - Serial missions completed daily over nearly one month
        - 2025-09
        - STARK maritime release
        - Medium
        - Demonstrates sustained testing and cross-domain expansion
        - Exercise-to-procurement conversion is undisclosed
    notes: >-
      Adoption metrics mix procurement, deployment, and trial milestones; they do not provide a
      common denominator such as active customers, annual contract value, or renewal rate.
    claimRefs: [CU003, CU004, CU006, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / program
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / evidence
      - Limitation
    rows:
      - - Unnamed NATO-country armed forces
        - Loitering munition buyer
        - Delivery contract for STARK's loitering munition system
        - Early production delivery
        - Entry into a new European market, with first delivery slated in the signing month
        - Customer name, contract value, and reorder evidence are undisclosed
      - - German military programmes, including Lithuania brigade reporting
        - Strike-drone procurement
        - Virtus supply and framework activity
        - Production procurement / framework
        - Public reporting ties STARK to large German awards and framework activity
        - Public sources do not show exercised framework volume, deployment pace, or top-customer share
      - - REP(MUS) / NATO DYNAMIC MESSENGER maritime exercise
        - Maritime ISR and strike operations
        - Vanta-4 and Vanta-6 tested in Portugal alongside other NATO capabilities
        - Pilot / trial
        - Month-long exercise with daily serial missions across escort, harbour control, and ISR
        - Exercise success does not prove follow-on procurement
    notes: >-
      This is a sample of publicly named programmes, not an exhaustive customer roster; logos or
      programme mentions without disclosed usage depth are excluded.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample built from the assigned prefetched pool's publicly named customer and programme
        references; Stark does not publish a complete customer list or production-status roster.
    claimRefs: [CU005, CU008, CU009, CU010, CU013]
figures:
  - id: FU001
    title: Customer adoption path in public evidence
    type: journey-map
    summary: >-
      Public proof clusters around a government-procurement path from technical fit to contract,
      then to delivery or exercise-based expansion, with durability still unproven.
    data:
      nodes:
        - label: Allied defence buyer need
          tone: neutral
          detail: Public evidence is centred on NATO-aligned government buyers rather than commercial accounts.
          touchpoints:
            - NATO member states and closest partner nations
            - European defence agencies and Bundeswehr references
        - label: Multi-product evaluation
          tone: medium
          detail: Air, maritime, and C2 products give the same buyer multiple adoption surfaces.
          touchpoints:
            - Virtus loitering munition
            - Vanta maritime platform
            - Minerva command-and-control software
        - label: First contract
          tone: positive
          detail: NIF says Stark secured its first contract within nine months.
          touchpoints:
            - Early procurement acceptance
            - Speed is a core adoption signal
        - label: Fielded delivery
          tone: positive
          detail: STARK says it reached frontline deployment in 13 months and a 2026 contract moved to same-month first delivery.
          touchpoints:
            - Frontline deployment claim
            - First tranche due in signing month
        - label: Programme expansion
          tone: positive
          detail: Public reporting points to German framework activity and entry into a new European market.
          touchpoints:
            - German military awards and framework reporting
            - New NATO-country contract
            - Partnerships with Germany, Ukraine, and the UK
        - label: Durability still opaque
          tone: adverse
          detail: Public evidence does not disclose renewal rates, churn, or top-customer concentration.
          touchpoints:
            - No NRR or GRR
            - No public customer-count disclosure
            - Parliamentary friction around one major deal
    claimRefs: [CU003, CU004, CU005, CU006, CU009, CU011, CU012, CU013]
