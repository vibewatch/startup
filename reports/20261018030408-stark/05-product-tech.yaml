      - "Limitation"
    rows:
      - ["Maritime patrol across wide NATO waters", "Crewed vessels cover large areas with manpower and availability constraints", "Vanta 4/6/12 USVs marketed for persistent patrol, ISR, and maritime deterrence", "Official and third-party sources cite up to 900 n mile range for early Vanta craft and 1,200 n mile patrol range for Vanta 12", "Operator proof is still exercise/trial-centric rather than supported by fleet service data"]
      - ["Recce-to-strike loop in degraded environments", "Reconnaissance and strike assets often sit in separate chains with vulnerable links", "Minerva coordinates unmanned assets and independent profiles say it supports strike coordination where GPS or data links are degraded", "Potentially compresses operator loop and supports multi-domain tasking", "No public documentation on interfaces, latency, or resilience testing"]
      - ["Distributed littoral strike from uncrewed vessels", "Strike usually depends on crewed platforms or single-purpose missile launchers", "Vanta 12 plus Sea Venom and Cascade aims to give an uncrewed high-low strike mix", "Janes reports up to four Sea Venoms plus ten Cascades in the concept configuration", "2026 evidence still shows emulation / integration work, not finished operational integration"]
      - ["Counter-UAS and sensor-to-effector coordination", "Operators manage separate sensor networks and effectors with cognitive burden", "Recruiting indicates a C-UAS C2 software suite designed to connect sensor networks to effector tasking", "Could lower operator workload and create a reusable software wedge beyond hardware", "Public customers, deployments, and control evidence are not disclosed in the reviewed materials"]
    notes: "Benefits are limited to source-supported ranges, payload counts, or stated workflow claims; unsupported adoption or performance metrics are left qualitative."
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE009", "CE013"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Operator software (Minerva / MOSA / C-UAS C2)", "Mission planning, orchestration, strike coordination, and sensor-to-effector tasking", "Needs interfaces into drones, USVs, battle-management platforms, and customer command systems", "Integration burden, cyber assurance, and supportability are not publicly documented"]
      - ["Air effectors (Virtus / Cascade / Gambit)", "Provide strike and ISR effectors within STARK's broader software-defined stack", "Depend on flight dynamics, autonomy models, and manufacturing consistency", "Public materials do not disclose reliability, attrition, or sustainment data"]
      - ["Maritime platforms (Vanta 4 / 6 / 12)", "Provide unmanned hulls for ISR, EW, and strike payloads", "Depend on seaworthiness, sensor payloads, and customer-specific mission kits", "Field maturity differs by model, with Vanta 12 still visibly in trial/integration phase"]
      - ["Partner / industrial integration", "Sea Venom, shipyards, and open-source simulation workflows extend performance and speed", "Requires partner payload qualification, external manufacturing partners, and engineering-toolchain scalability", "Roadmap breadth can outrun proven qualification if integration milestones slip"]
    notes: "Architecture is reconstructed only from explicit public product descriptions, trial reporting, and recruiting signals; no hidden interfaces or certifications are inferred."
    claimRefs: ["CE004", "CE005", "CE006", "CE009", "CE010", "CE011", "CE013"]
