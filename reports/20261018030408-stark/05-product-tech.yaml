slug: "stark"
runDate: "2026-10-18"
company:
  name: "Stark"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "STARK now presents a real multi-product autonomous-systems stack rather than a single drone SKU: Virtus and other effectors on the air side, Vanta on the maritime side, and Minerva/MOSA on the software side. The strongest independent 2026 evidence shows Vanta 12 has moved into trials and partner integration, but the marketed modular strike stack still depends on finishing weapon/C2 integration and on diligence materials that are not public."
sections:
  - id: "portfolio-and-customer-workflows"
    title: "Portfolio breadth and customer workflow"
    body: |
      The reviewed public surface supports treating STARK as a multi-domain defence stack, not a one-product vendor. Its homepage names one-way effectors, command-and-control software, maritime vessels, CASCADE, GAMBIT, MOSA, and VANTA 12, while independent profiles describe the same portfolio as loitering munitions, unmanned surface vessels, and mission-control software. That matters because the buyer workflow is broader than simple drone procurement: STARK is positioning software, effectors, and platforms together for reconnaissance, strike, and maritime patrol missions across NATO operators. Public evidence is still marketing-heavy, but it is specific enough to map product families to operator jobs and to separate the core software layer from the air and maritime hardware layers.
    claimRefs: ["CE001", "CE002", "CE007", "CE010"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-and-integration-model"
    title: "Architecture and integration model"
    body: |
      The clearest architecture signal is Minerva's role as the orchestration layer. STARK's 2025 maritime release says Minerva is intended to let Vanta operate in groups, interoperate with reconnaissance and strike drones, and connect to conventional battle-management systems; Naval News adds that the Vanta 12 sensor/effector stack is integrated around Minerva and that STARK is seeking to connect into larger digital-targeting webs. The company's product framing also emphasizes modularity rather than a vertically closed system: Vanta is described as sensor- and effector-agnostic, MOSA is positioned around digital sovereignty, and recruiting points to open-source simulation and AI-agent tooling behind aircraft design and C-UAS C2 development. The practical implication is a software-defined architecture with many integration surfaces, which is powerful if qualification succeeds but also raises execution risk at each external dependency boundary.
    claimRefs: ["CE005", "CE006", "CE009", "CE010", "CE011"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "maturity-deployment-and-roadmap"
    title: "Maturity, deployment, and roadmap"
    body: |
      Public evidence suggests uneven maturity across the portfolio. Vanta 4 and Vanta 6 were already being tested in NATO maritime exercises in 2025, with STARK claiming serial mission execution and up to 900 nautical miles of range. By contrast, the strongest 2026 third-party evidence for Vanta 12 still reads as advanced trial and integration work rather than fielded production capability: Janes reports a Sea Venom emulation model to prove the concept, and Naval News says the companies are still working through full missile integration while also exploring other payload options. Recruiting likewise indicates that STARK is still expanding core technical capabilities in aero simulation and C-UAS software. This is consistent with a company that is moving quickly, but it means diligence should underwrite product readiness at the program level, not simply accept the breadth of the roadmap at face value.
    claimRefs: ["CE003", "CE004", "CE008", "CE009", "CE013"]
    calloutRefs: []
  - id: "controls-and-technical-risks"
    title: "Trust, controls, and technical risks"
    body: |
      The main product-tech risk is not lack of ambition but lack of public operating proof. The reviewed materials provide concrete product names, some trial evidence, and useful developer-signal via recruiting, yet they do not expose technical documentation, support metrics, status telemetry, security attestations, or formal compliance artifacts for Minerva, MOSA, or the broader product stack. In parallel, the most aggressive maritime-strike narrative still depends on finishing partner-weapon and external-C2 integration. For an investor or strategic partner, that shifts diligence toward qualification evidence: secure-development processes, export/control boundaries, in-service reliability, support burden, and customer-specific integration timelines all need direct documentation rather than brand-level claims.
    claimRefs: ["CE009", "CE012", "CE013"]
