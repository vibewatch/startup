      - ["Vanta 12 USV", "Navies seeking longer-endurance ISR / strike and distributed fires", "Independent 2026 evidence shows sea trials and REPMUS concept activity, not mature fleet deployment", "Combines higher endurance with modular payload hosting and prospective Sea Venom integration", "Need customer qualification status, production readiness, and live integration evidence"]
      - ["Cascade / Gambit / MOSA", "Strike, ISR, and sovereign software buyers", "Publicly named products, but public technical detail is thin", "Expands STARK from single-effector narrative to broader modular family", "Need role-by-role specs, buyer references, and interoperability evidence"]
    notes: "Mixes company pages, company release, recruiting, and independent profiles; nulls are avoided by converting unsupported quantitative fields into diligence asks."
