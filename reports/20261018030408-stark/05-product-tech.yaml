        - label: "Air effectors"
          detail: "Public portfolio evidence points to multiple air-side products rather than one loitering munition."
          modules: ["Virtus", "Cascade", "Gambit"]
        - label: "Maritime platforms"
          detail: "The Vanta family is the unmanned maritime hull layer, with increasing endurance and strike ambition."
          modules: ["Vanta 4", "Vanta 6", "Vanta 12"]
        - label: "Payloads and sensors"
          detail: "Public descriptions emphasize modular hosting of sensors and effectors rather than fixed mission kits."
          modules: ["Sea Venom concept integration", "ISR sensor suites", "Electronic warfare systems"]
        - label: "Industrial / engineering base"
          detail: "Rapid build and scaling claims depend on shipyard partners plus internal open-source simulation and AI-assisted engineering workflows."
          modules: ["Partner shipyards", "OpenVSP / OpenFOAM / OpenMDAO", "AI-agent workflows"]
    approximationNotes: "Architecture reflects only named public modules and dependencies from the allocated sources; hidden subsystems and classified controls are intentionally excluded."
    claimRefs: ["CE004", "CE005", "CE006", "CE009", "CE010", "CE011", "CE013"]
callouts:
  - calloutType: "strength"
    title: "More than a single drone SKU"
    body: "The strongest product positive is portfolio shape: STARK now publicly spans software, air effectors, and maritime platforms, which can raise switching costs if Minerva becomes the operator control layer rather than a bundle of disconnected vehicles."
    claimRefs: ["CE001", "CE005", "CE007", "CE010"]
  - calloutType: "risk"
    title: "Roadmap breadth is ahead of disclosed operating proof"
    body: "The public story already markets modular strike, C-UAS software, and maritime mass production, but the reviewed evidence still shows important programs at trial, concept, or recruiting stage and does not disclose the control artifacts needed to underwrite supportability or cyber readiness."
    claimRefs: ["CE004", "CE009", "CE012", "CE013"]
