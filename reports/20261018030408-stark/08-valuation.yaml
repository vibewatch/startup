schemaVersion: "report-v2"
artifact: valuation
slug: stark
runDate: 2026-10-18
company:
  name: Stark
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence shows real financing momentum and credible demand signals for Stark, but the
    private-market mark-up from roughly $500 million in August 2025 to about €3.2-€3.5 billion by
    June 2026 outruns the public operating disclosure available to outside investors. The right
    stance on current evidence is track: strategic scarcity and contract momentum are real, but the
    price cannot be underwritten conventionally without audited revenue, backlog conversion, and
    round-term transparency.
sections:
  - id: financing-context
    title: Financing context and what the public mark actually says
    body: >-
      The public record points to a sharp valuation step-up in less than a year. DealMatrix places
      the August 2025 round at $62 million and a $500 million valuation, while June 2026 coverage
      from Tectonic, Vestbee, and Dealroom reports a €500 million financing at roughly €3.5
      billion. Silicon Valley Invest Club also records an intermediate February 2026 point above $1
      billion and discussion of another large raise, which supports the direction of travel even if
      the exact intermediate terms remain thin. The mark is therefore not a rumor-free range, but
      it is consistent across several third-party trackers and news sources that Stark re-rated from
      early proof to strategic-scale expectations very quickly.
    claimRefs: [CV002, CV004, CV005, CV006, CV012]
    tableRefs: [TV001]
  - id: price-support-and-entry-discipline
    title: Price support exists, but the underwriting stack is incomplete
    body: >-
      What supports the valuation today is strategic momentum rather than disclosed operating
      fundamentals. Stark's official positioning spans loitering munitions, unmanned surface
      vessels, and command-and-control software, and third-party profiles describe real Bundeswehr
      and NATO-adjacent traction plus a large June 2026 capital infusion earmarked mostly for R&D
      and manufacturing. That creates a plausible strategic-scarcity narrative. What is missing is
      just as important: Sacra says no public revenue, ARR, or profitability figures are disclosed,
      and public sources do not reveal liquidation preferences, exact ownership dilution, or the
      full shareholder register for the latest round. Without those anchors, the market evidence
      supports tracking the company and its next diligence disclosures, not underwriting the latest
      private mark as a buy.
    claimRefs: [CV001, CV007, CV008, CV009, CV013, CV015, CV016]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenario-frame
    title: Scenario logic is driven by conversion, not by narrative alone
    body: >-
      The upside case is not hard to imagine: if Stark converts fresh capital into scaled output,
      converts headline contracts into repeat NATO demand, and preserves its product-speed edge,
      today's valuation could still prove reasonable in a category where sovereign autonomy and
      defense-industrial capacity are scarce. The base and bear cases are more conventional:
      procurement cycles can still run for years, certification and political review can slow cash
      conversion, and the current price has little publicly disclosed revenue support if execution
      slips. That combination means scenario weighting should focus on evidence of manufacturing
      throughput, booked backlog quality, and follow-on procurement rather than on headline
      valuation marks alone.
    claimRefs: [CV007, CV008, CV010, CV011, CV014]
    tableRefs: [TV003]
  - id: final-call-and-diligence-asks
    title: Final call, thesis-break triggers, and diligence asks
    body: >-
      The recommendation on public evidence is track with medium confidence and a high risk rating.
      A more constructive call would require evidence that the June 2026 round bought measurable
      production scale, customer conversion, and operating leverage rather than just strategic
      optionality. The fastest ways to change the call are audited or board-level disclosure on
      revenue, backlog, gross margin, burn, and round terms, plus independent confirmation that
      framework awards are converting into recognized delivery programs. The thesis breaks if Stark
      cannot turn capital and contract visibility into repeatable procurement wins, or if later
      financing reveals that the current valuation embedded terms materially less favorable than the
      headline mark implies.
    claimRefs: [CV009, CV010, CV011, CV013, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Item
      - Assessment
      - Evidence / implication
    rows:
      - ["Recommendation", "Track", "Momentum is real, but public evidence does not yet justify underwriting the latest price as a buy."]
      - ["Confidence", "Medium", "Multiple third-party sources corroborate recent financing, but operating and term disclosure remains limited."]
      - ["Risk rating", "High", "Procurement timing, political review, and limited public financial disclosure keep downside wide."]
      - ["Valuation stance", "Stretched", "Reported valuation moved sharply ahead of public revenue or profitability disclosure."]
      - ["Decision implication", "Wait for operating proof or a better entry", "Price sensitivity matters more than company quality in this chapter."]
    notes: >-
      Assessment synthesizes cited public sources as of 2026-10-18; no public revenue, ARR,
      profitability, or latest-round term sheet is disclosed.
    claimRefs: [CV009, CV010, CV011, CV012, CV013, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Supporting evidence
      - What would change the view
    rows:
      - ["Thesis", "Stark combines a real multi-domain product stack with visible NATO-oriented demand and unusually large fresh capital for a young European defense company.", "Independent confirmation that contract headlines convert into recurring delivery programs would strengthen conviction."]
      - ["Anti-thesis", "The valuation has repriced far faster than public operating disclosure, leaving investors to underwrite narrative, scarcity, and defense demand more than fundamentals.", "Audited revenue, backlog, gross margin, and burn disclosure would reduce the underwriting gap."]
      - ["Entry discipline", "Public round marks are useful signals, but the latest price lacks public revenue and cap-table context.", "A lower entry price or clearer round terms could improve risk-adjusted appeal."]
      - ["Kill criterion", "If procurement timing slips or scale-up spending fails to create repeat orders, today's valuation could compress sharply.", "Repeat follow-on awards, throughput proof, and margin disclosure would soften this risk."]
    notes: >-
      This table blends reported facts with investor interpretation; the key missing variables are
      revenue quality, backlog conversion, and latest-round preference terms.
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV013, CV014, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - ["Bull", "June 2026 capital translates into scaled production, repeat NATO procurement, and stronger software attach.", "The current valuation can sustain if Stark becomes a scarce sovereign-autonomy platform rather than a single-program drone vendor.", "Evidence of manufacturing throughput, repeat orders, and better disclosure than peers.", "Qualification delays, weaker-than-expected demand conversion, or margin opacity."]
      - ["Base", "Demand remains real but monetization follows normal defense procurement timing and disclosure stays partial.", "The mark may hold privately, but upside for new investors is hard to underwrite without a better price or new proof points.", "Mixed signal set: strong demand narrative, weak public financial disclosure.", "Another mark-up without better disclosure."]
      - ["Bear", "Headline contracts prove less monetizable than expected or later financing terms reveal weak economics for new money.", "A stretched multiple compresses because investors were paying for scarcity and strategic urgency rather than proven fundamentals.", "Limited revenue visibility, political friction, and long procurement cycles remain unresolved.", "Down-round signals, delayed deliveries, or evidence of weak backlog conversion."]
    notes: >-
      These are qualitative scenarios because public sources do not disclose revenue, margin, cash
      burn, or a full cap table for conventional valuation modeling.
    claimRefs: [CV002, CV004, CV005, CV006, CV007, CV010, CV011, CV012, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Stark's strategic demand and financing momentum are real, but missing operating disclosure and
      procurement friction push the public-evidence recommendation to track.
    data:
      nodes:
        - id: demand-proof
          label: Strategic demand proof
          detail: Bundeswehr-linked demand and NATO-only positioning show real buyer interest.
        - id: product-speed
          label: Product breadth and speed
          detail: Virtus, Vanta, and Minerva plus 13-month deployment reinforce the strategic narrative.
        - id: private-mark
          label: Private-market mark-up
          detail: Public sources moved from $500M in Aug 2025 to about €3.2B-€3.5B in Jun 2026.
        - id: missing-operating-data
          label: Missing operating disclosure
          detail: No public revenue, ARR, profitability, or full latest-round term disclosure anchors the mark.
        - id: execution-drag
          label: Execution and procurement drag
          detail: Multi-year military adoption and political review can delay cash conversion.
        - id: recommendation
          label: "Recommendation: track"
          detail: Investors need better price support or audited operating proof before underwriting a buy.
      edges:
        - from: demand-proof
          to: product-speed
          label: validates
        - from: product-speed
          to: private-mark
          label: helps explain
        - from: private-mark
          to: missing-operating-data
          label: raises the burden of proof
        - from: missing-operating-data
          to: execution-drag
          label: compounds
        - from: execution-drag
          to: recommendation
          label: leads to
    claimRefs: [CV001, CV008, CV009, CV010, CV012, CV013, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Track rather than buy: Stark's category position is compelling, but the current mark is ahead
      of the operating disclosure needed for conventional underwriting.
    claimRefs: [CV012, CV013, CV016]
  - calloutType: risk
    title: What would most quickly change the view
    body: >-
      Audited revenue, backlog, gross margin, burn, and exact round-term disclosure would do more
      to change the call than another headline valuation mark.
    claimRefs: [CV009, CV015, CV016]
