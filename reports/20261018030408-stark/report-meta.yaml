companyProfile:
  summary: >-
    Stark is a Berlin-based defence-technology company founded in 2024 that builds a multi-domain stack around Virtus
    loitering munitions, Vanta unmanned surface vessels, and Minerva command-and-control software. The public record
    shows a fast-moving growth-stage company with clear NATO relevance, rapid financing, and visible product expansion,
    but the economics behind that momentum remain only partly disclosed.
