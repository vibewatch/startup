  topStrengths:
    - >-
      Stark has a credible multi-domain product stack across loitering munitions, unmanned surface vessels, and command
      software.
    - >-
      Public sources show unusually fast capital formation and repeated NATO adjacency, which supports strategic
      momentum.
    - >-
      The company appears to have moved from prototype to procurement and deployment quickly for a young defense
      startup.
  topRisks:
    - >-
      Public sources do not disclose revenue, backlog, gross margin, burn rate, or cash runway, which leaves the
      valuation underwritten on narrative.
    - >-
      Reported valuation has outrun operating disclosure, so the current price depends heavily on future procurement
      conversion.
    - Procurement, certification, and political review can still delay revenue recognition in defense programs.
  unresolvedGaps:
    - Audited revenue, backlog, gross margin, burn rate, and cash runway remain unavailable in public sources.
    - The exact size, terms, and lead economics of the reported June 2026 financing are not officially confirmed.
    - >-
      Independent evidence reconciling the DroneXL adverse trial narrative with Stark's later rebuttal and Bundeswehr
      qualification progress is still missing.
