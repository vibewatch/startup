  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, formal governance structure, and named independent directors.
    whyItMatters: >-
      Without a verified board view it is difficult to assess founder control, oversight quality, and regulatory
      readiness.
    diligencePath: >-
      Request a current cap-table / governance overview or an investor deck section listing board members and
      committees.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: An exact current capitalization table, ownership by investor, and any secondary sales after the 2022 Series B.
    whyItMatters: >-
      The return profile and present-day valuation sensitivity cannot be underwritten from the last public 2022 price
      alone.
    diligencePath: Request the latest cap table, option-pool schedule, and any post-Series-B financing or secondary documentation.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
