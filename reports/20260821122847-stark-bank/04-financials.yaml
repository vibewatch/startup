  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin-by-stream
    missingEvidence: Gross margin and contribution margin by payments, cards, treasury, credit, and infra streams.
    whyItMatters: Without stream-level margins, volume growth may be confused with value creation.
    diligencePath: Request revenue and gross profit by product for the last 8 quarters.
    relatedQuestionRefs:
    - QI012
    - QI013
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, and management runway view.
    whyItMatters: Needed to test downside financing risk and resilience to slower growth or higher compliance cost.
    diligencePath: Request monthly cash bridge, burn, and runway under base/stress cases.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: loss-rates-and-reserves
    missingEvidence: Fraud losses, charge-offs, reserves, and any warehouse or funding lines tied to credit products.
    whyItMatters: Balance-sheet products can make published net income more volatile than transaction volume suggests.
    diligencePath: Request credit-loss and fraud-loss data by product.
    relatedQuestionRefs:
    - QI014
    - QI017
    - QI020
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue and TPV concentration across the top customers or sectors.
    whyItMatters: Large-volume payment fintechs can be exposed to a small set of customers without obvious logo concentration.
    diligencePath: Request top-10 customer revenue share and TPV share.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounts
    missingEvidence: Actual take rates and discounting by customer cohort and workflow.
    whyItMatters: List-pricing signals are insufficient to judge pricing power and margin durability.
    diligencePath: Request cohort take-rate bridges and discount policy.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI002
    - TI005
