- id: SI002
  title: Traction, cost structure, and public unit-economics proxies
  body: 'The strongest public traction datapoints are unusually clear for a private Brazilian fintech. Valor and Exame reported that Stark processed R$155 billion in 2023 and generated R$71.5 million of net profit. Bloomberg Línea then said 2024 payment volume reached R$280 billion while net income fell to about R$50 million because Stark deliberately increased marketing and investment. Company-authored and trade-publication updates later escalated the scale narrative again: R$600 billion moved in 2025, more than R$670 billion of Pix in the prior 12 months by mid-2026, and a R$1 trillion moved-volume target for 2026. These are not the same metric series, but together they show rapid activity growth.


    The cost story is more nuanced than the volume curve. Public comments imply three major cost buckets: infrastructure and support needed for always-on payment operations; marketing and GTM spend that increased materially in 2024-2025; and regulatory/compliance overhead associated with operating as an SCD and IP while pushing toward broader licenses. The company also launched credit-related products from its own balance sheet, which creates capital and loss-exposure questions that a pure software vendor would not face. Because Stark is still private, there is no public gross margin, CAC, payback, fraud loss, or provisioning disclosure. Investors are left with proxies rather than unit economics.


    Those proxies are directionally useful. Payments-per-employee and profit-per-employee look very high in the public record, which supports the capital-efficiency narrative. But the lack of product-level revenue, contribution margin, or loss data means nobody outside the company can tell whether the most profitable growth comes from payments, cards, credit, treasury, or infrastructure. The business appears financially stronger than many growth-stage fintechs, yet the public package remains insufficient for a true underwriting model.'
