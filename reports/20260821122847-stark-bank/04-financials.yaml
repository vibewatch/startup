  title: Financials
summary: 'Public evidence supports a rare profile for a private Brazilian fintech: Stark appears to have reached real profitability while still growing payment scale aggressively. The company disclosed R$155 billion of processed volume and R$71.5 million of net profit in 2023, then roughly R$280 billion of volume and R$50 million of net profit in 2024 as investment accelerated. Since then, management and company-authored materials have pushed the scale story to R$600 billion moved in 2025, more than R$670 billion of Pix in the prior 12 months by mid-2026, and a R$1 trillion goal for 2026. The opportunity looks financially attractive, but the public package still lacks the revenue mix, margin, loss, cash, and concentration detail needed for full underwriting.'
sections:
- id: SI001
  title: 'Revenue model: high-volume payments first, broader monetization second'
  body: 'Stark’s public financial picture starts with transaction volume, not disclosed revenue. The company sells a set of workflows that monetizes several ways at once: payment processing fees on Pix, boleto, TED, and acquiring-like flows; card-related economics such as interchange and credit spread where relevant; treasury or fixed-income spread on client balances parked in Stark products; and infrastructure or service fees tied to Stark Infra and adjacent products. The documentation is explicit that money movement is priced per transaction with no monthly minimums, which reinforces the interpretation that payment frequency and mix matter more than seat count or classical SaaS ARR.


    Public product and interview evidence also suggests the revenue base is widening rather than remaining a single-rail Pix processor. Management has discussed card credit, fixed-income products, Open Finance initiatives, and infrastructure services for other institutions. The 2025 article on crypto-focused expansion said Stark Infra represented 15% of revenue and grew 200% year over year, which is important because infrastructure revenue can be operationally sticky and less exposed to end-customer bank switching than a pure direct-account product. Still, the company does not disclose precise revenue mix, take rate by product, or gross margin by stream, so investors can observe monetization mechanisms without seeing the exact quality of each one.


    That means the core financial debate is about conversion of volume into durable economics. Public payment-volume disclosures are impressive, but volume alone can hide low-margin flows, customer discounts, or treasury spread dependence. The right framing is therefore that Stark has proven high throughput and at least some profitability, yet still withholds the granular mix needed to underwrite how repeatable those profits are as competition and compliance costs rise.'
