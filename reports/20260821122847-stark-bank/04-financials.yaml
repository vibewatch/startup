tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Payments processing
    - Fees on Pix, boleto, TED, and related money movement
    - Per transaction / volume-based
    - Core, publicly visible through product docs and volume disclosures
    - Likely durable but highly competitive
    - Request product-level net take rate and gross margin by rail
  - - Corporate cards
    - Interchange, float, and possibly credit spread
    - Card spend / card balance
    - Publicly present; credit line discussed since 2022
    - Potentially higher-yield but risk-bearing
    - Request card TPV, loss rate, interchange share, and limit utilization
  - - Treasury / fixed income
    - Spread or fee on balances allocated into digital fixed-income products
    - Balance / spread income
    - Public product exists, revenue contribution undisclosed
    - Could improve margin but may be rate-sensitive
    - Request AUC/AUM-equivalent balance metrics and spread sensitivity
  - - Stark Infra
    - Infrastructure/service fees for Pix and RSFN connectivity sold to institutions
    - Contract / volume / service fee
    - Publicly described as 15% of revenue in 2025 lens
    - Strategically attractive if sticky and diversified
    - Request revenue share, top partners, and contract duration
  - - Open Finance / recurring payment adjacencies
    - Potential usage or workflow monetization on payment-initiation and recurring flows
    - API usage / transaction
    - Strategic but publicly immature
    - Future upside, not yet underwritten
    - Request actual production volumes and monetization status
  notes: Streams are inferred from product and interview evidence because Stark does not publish audited revenue-segment reporting.
