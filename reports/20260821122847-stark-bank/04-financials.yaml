- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue by product
    - Impossible to judge whether growth comes from the highest-quality streams
    - Request revenue split for payments, cards, credit, treasury, infra, and other
  - - Gross margin by stream
    - Cannot tell whether transaction growth improves or dilutes economics
    - Request gross profit and direct cost by workflow
  - - Client concentration
    - High-volume fintechs can be exposed to a few major accounts
    - Request top-10 customer revenue and TPV share
  - - Cash / runway
    - Cannot underwrite financing need or downside buffer
    - Request current cash balance and monthly burn
  - - Credit losses and reserves
    - Cards and SCD lending can hide future earnings volatility
    - Request NPL, reserve, charge-off, and fraud-loss metrics
  - - Realized pricing by cohort
    - List-pricing and transaction volume do not reveal discounting pressure
    - Request cohort take rates by segment and product
  notes: The chapter can support a positive directional view, but these gaps block a full model.
