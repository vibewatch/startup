  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, formal governance structure, and named independent directors.
    whyItMatters: Without a verified board view it is difficult to assess founder control, oversight quality, and regulatory readiness.
    diligencePath: Request a current cap-table / governance overview or an investor deck section listing board members and committees.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: An exact current capitalization table, ownership by investor, and any secondary sales after the 2022 Series B.
    whyItMatters: The return profile and present-day valuation sensitivity cannot be underwritten from the last public 2022 price alone.
    diligencePath: Request the latest cap table, option-pool schedule, and any post-Series-B financing or secondary documentation.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: One authoritative current employee count and department mix.
    whyItMatters: Efficiency claims and org-scaling needs depend on whether Stark is still sub-100 or has already scaled well beyond that.
    diligencePath: Request a current org summary or verified LinkedIn/HR export with total employees and engineering share.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
    - TO002
  - type: missing-source
    severity: material
    topic: co-founder-bench
    missingEvidence: Primary evidence confirming whether Rafael Stark had co-founders or a broader founding team beyond the public materials reviewed here.
    whyItMatters: Founder-market fit and succession risk look different in a solo-founder versus multi-founder structure.
    diligencePath: Request incorporation history, founder biographies, and earliest financing docs to validate the founding team.
    relatedQuestionRefs:
    - QO025
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Current revenue split across transaction fees, cards, credit, treasury, and Stark Infra.
    whyItMatters: Quality of revenue and durability of profitability cannot be judged from moved-volume numbers alone.
    diligencePath: Request management reporting with revenue by product line and margin contribution for 2023-2026 YTD.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO001
