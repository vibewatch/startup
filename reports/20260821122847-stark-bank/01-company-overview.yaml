callouts:
- calloutType: strength
  title: Capital-efficient growth is real even if current valuation is not visible
  body: 'The strongest evidence in Stark’s favor is not an investor slide but the combination of disclosed

    profit and payment scale. A private fintech that reached R$155B of payments and R$71.5M of net income

    in 2023, then R$280B of payments in 2024, has already crossed from story stock to real financial

    infrastructure. Even without a fresh round, those operating numbers justify serious diligence.'
  claimRefs:
  - CO017
  - CO018
  - CO019
- calloutType: risk
  title: The bank brand is ahead of the full bank license
  body: 'Stark’s strategic direction clearly points toward full bank status, but public evidence shows that it

    still relies on the combination of payment-institution, SCD, and payment-initiation permissions while

    its banking-license request remains pending. That gap is manageable today, but it matters for deposit

    gathering, funding flexibility, and any claim of bank-like completeness.'
  claimRefs:
  - CO027
  - CO029
  - CO031
  - CO032
  - CO037
- calloutType: assumption
  title: Unicorn status should not be assumed from the current source set
  body: 'This run found no reliable public evidence for the user-provided 2025 Series C at a $1B+ valuation.

    The accessible public record still points to a 2022 Series B at $250M, with management later stressing

    profitability and no near-term fundraise. If a hidden insider round exists, it did not surface in the

    retained evidence and should not be treated as fact.'
  claimRefs:
  - CO014
  - CO016
  - CO039
