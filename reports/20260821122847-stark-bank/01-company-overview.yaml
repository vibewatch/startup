- id: SO003
  title: Funding history, capital structure, and scale disclosures
  body: 'The best-supported public funding datapoint is the 2022 Series B: US$45M at a US$250M valuation with

    participation from Ribbit Capital and Bezos Expeditions. Multiple press accounts and profile databases

    point to total cumulative funding in the high-US$50M to low-US$60M range, but management’s later

    interviews emphasize that the balance sheet remains capitalized and that Stark is not actively pursuing

    a new round simply to mark up valuation. In March 2025, Rafael Stark explicitly said a fresh fundraise

    was not the priority and that the company wanted to turn profitability into more value rather than accept

    dilution for optics.


    That stance is important because it directly conflicts with the user-supplied “August 2025 Series C at a

    $1B+ valuation” claim. Neither the official investor-relations shell, nor Valor, Exame, Startups.com.br,

    CNN Brasil, BP Money, or the accessible company-profile databases reviewed for this run surfaced evidence

    of a 2025 Series C, 8VC lead, or unicorn pricing for the Brazilian Stark Bank. Web discovery repeatedly

    pulled in funding stories about STARK, the German defense-tech company, which is a strong signal that the

    unicorn narrative may be a name collision rather than a hidden Stark Bank round. Until a primary

    announcement appears, the last public priced round remains the 2022 Series B.


    Operating disclosures, however, show a business that has grown far beyond its 2022 financing snapshot.

    Stark reported R$155B of processed volume and R$71.5M of net income in 2023, then R$280B of payments and

    R$50M of net income in 2024 as it stepped up investment and marketing. Bloomberg Línea also cited R$212B

    of trailing-twelve-month TPV by July 2024, which fits the broader acceleration pattern. The result is a

    company that appears operationally stronger than its last disclosed valuation would suggest, but with no

    fresh market-clearing price to anchor current investor returns.'
  claimRefs:
