- id: SO004
  title: Milestones, regulatory transition, and early adverse signals
  body: 'The chronology of Stark’s development is unusually important because product, scale, and regulatory

    permissions are moving in parallel. The company was founded in 2018, raised its Series B in 2022,

    disclosed profitability and R$155B of payments for 2023, expanded into acquiring and broader enterprise

    marketing in 2024, and then entered 2025-2026 discussing Open Finance initiation, international

    licensing, and a target of R$1T in moved volume for 2026. This is not the profile of a seed-stage API

    bank; it is a late-growth infrastructure company trying to convert payment scale into a wider

    corporate-finance suite.


    The same timeline also surfaces the principal diligence risks. CNN Brasil and Portal Tela reported that

    Stark requested a full banking license from the BCB in December 2023 and still lacked approval by April

    2026, which means the company continues to operate within IP and SCD constraints even as its brand and

    product suite approach bank-like territory. Legal commentary reviewed for this run shows why that matters:

    Brazil tightened authorization and prudential rules for payment institutions in 2025, especially around

    Pix participation, governance, and institutions whose public presentation runs ahead of their licenses.


    Operational resilience is the second adverse theme. The official status page and IsDown history show

    material incidents in 2026, including a DICT communication outage tied to the Central Bank connection,

    Visa acquiring instability, and settlement-bank disruptions affecting boleto-related flows. None of these

    incidents prove structural fragility on their own, but they do show that a company built around

    mission-critical money movement still carries infrastructure and ecosystem dependency risk. That risk is

    especially relevant when management is simultaneously trying to scale clients, add rails, and expand

    geographically.'
