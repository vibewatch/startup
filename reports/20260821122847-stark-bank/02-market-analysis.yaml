- id: SM004
  title: Growth drivers, constraints, and contradictory evidence
  body: 'The growth drivers are unusually strong. Pix already reaches more than 170 million users and 93% of the

    adult population by EBANX’s analysis, while merchants that add Pix reportedly see better revenue and

    customer-growth outcomes. Open Finance adds payment initiation and data-sharing infrastructure that can

    further reduce friction. For recurring businesses, Pix Automático potentially expands the addressable base

    beyond cardholders, which matters in a market where tens of millions of Brazilians still do not have a

    credit card. All of this creates a fertile environment for vendors that can package regulation and API

    complexity into usable enterprise products.


    The constraints are just as real. Legal commentary on the 2025 BCB rules shows that payment institutions

    face tougher authorization, governance, and security expectations. Worldpay’s and EBANX’s product

    materials make clear that Pix Automático and high-volume payment initiation are not one-click add-ons; they

    require retry logic, compliance discipline, and billing-engine redesign. Buyers also need to trust a

    provider with mission-critical operations, which raises the importance of uptime, incident handling, and

    direct regulatory perimeter. Finally, the opportunity is crowded: incumbents like BTG, Inter, Itaú, and

    Stone, plus specialists like Cora, Conta Simples, and Celcoin, all attack adjacent parts of the same

    workflow budget.


    The contradictory evidence is therefore not about whether the market is large — it obviously is — but

    about how much of that largeness is monetizable for Stark. Rail volume, consumer adoption, and checkout

    share all point upward. Yet pricing power, attach rates, enterprise trust, and compliance burden will

    determine the portion of the market that converts into durable revenue. That distinction should anchor the

    rest of the report.'
