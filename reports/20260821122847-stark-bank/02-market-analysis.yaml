callouts:
- calloutType: strength
  title: Brazil’s rail shift is real, not theoretical
  body: 'Pix’s scale, A2A e-commerce growth, and recurring-payment innovation mean Stark is riding one of the

    strongest structural payment transitions globally. The market no longer needs to be convinced that real-

    time account-to-account payments can work at scale in Brazil.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM013
- calloutType: risk
  title: The biggest TAM in the chapter is not the most useful TAM for investors
  body: 'US$6.7T of Pix value is a powerful macro signal, but it is not the same as Stark’s monetizable market.

    Investors should focus on serviceable enterprise workflows, attach rates, and pricing power rather than

    on national rail throughput alone.'
