- id: SM002
  title: Sizing lenses and the real serviceable market
  body: 'The broadest lens comes from EBANX’s analysis of official data: Pix transaction value in Brazil was on

    course to reach about US$6.7T in 2025, with monthly transactions potentially reaching 7.9 billion in

    December. That figure demonstrates why Brazil’s payments infrastructure is globally important, but it is

    too broad to serve as Stark’s TAM. Worldpay’s market-specific numbers provide a narrower and more useful

    lens: Brazilian account-to-account e-commerce spend grew from US$3.6B in 2020 to US$35.3B in 2024 after

    Pix launched. That is still not the whole corporate opportunity, but it shows how quickly an API-friendly

    rail can move from niche to default in a monetizable digital-commerce segment.


    Recurring and B2B use cases create the most relevant expansion wedge. EBANX estimates Brazil’s recurring-

    payments market at roughly US$50B annually and says Pix Automático could process about US$30B within its

    first two years. Separate EBANX material on B2B rails argues that account-to-account methods such as Pix,

    PSE, and SPEI are already responsible for up to half of some merchants’ B2B revenue in Latin America. The

    implication is that Stark’s serviceable market is not limited to checkout payments; it includes high-

    frequency accounts receivable and accounts payable flows where retry logic, reconciliation, and ERP

    integration are decisive.


    Stark’s own current scale adds a final SOM reality check. Company sources cite R$600B moved in 2025, more

    than R$670B of Pix in the prior 12 months by mid-2026, and a target of R$1T moved in 2026. Those numbers

    are company-reported and not revenue figures, but they show Stark already operates on a meaningful share

    of the workflow layer it cares about. The right conclusion is not that Stark owns the Pix market; it is

    that Stark already sits inside a large enough serviceable slice to matter, while still remaining small

    relative to the total national rail.'
