- id: SP003
  title: Switching costs, moat durability, and adverse competitive evidence
  body: 'The competitive moat here is more operational than structural. Pix, boleto, and account infrastructure are increasingly standardized by regulation, which means no vendor owns the rail. What matters is implementation quality: uptime, reconciliation fidelity, card controls, onboarding speed, compliance readiness, and how much engineering work a client must still do. That creates some switching cost once a finance stack is embedded into ERP, billing, payout, and approval flows, but it also allows multi-homing. A company can keep an incumbent bank for treasury, use another provider for cards, and test Stark or Celcoin for a specific payment workflow.


    Adverse evidence matters because several rivals have advantages Stark cannot wave away. Celcoin’s breadth, licensing message, and published ecosystem numbers suggest it can outflank Stark on infrastructure breadth. Cora’s recent SCFI authorization expands the product menu for SME buyers. Inter, BTG, and Stone can combine balance-sheet trust, broad customer access, and cross-selling. Even Conta Simples, a narrower player, competes effectively when the buyer primarily wants spend control rather than programmable banking. Meanwhile, Stark’s lack of public win-rate, churn, cohort-retention, or independently benchmarked customer-satisfaction data means the market still has to trust management’s positioning story more than hard competitive proof.


    The right conclusion is that Stark’s moat is real but conditional. It is strongest when the customer values API ergonomics, direct settlement, fast integration, and enterprise-grade Pix operations more than branch relationships or broad banking bundles. It weakens when procurement is dominated by trust, bundled discounts, or desire for a single universal bank relationship. The diligence burden for investors is therefore to test whether Stark’s product-led edge persists as incumbents productize the same rails.'
