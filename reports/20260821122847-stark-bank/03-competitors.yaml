- id: SP002
  title: Capability, packaging, and distribution comparison
  body: 'On capability, Stark’s public edge is coherence: a single REST API spanning Pix, boleto, cards, transfers, and banking, paired with direct settlement into a Stark account and a regulatory-quality service rating on Pix. That is a compelling bundle for finance teams with engineering support. But the edge is not uncontested. Celcoin offers broader embedded-finance modularity and a larger published ecosystem footprint. Inter and BTG can wrap APIs and recurring-Pix tooling inside institutions with more mature consumer and enterprise trust. Cora and Conta Simples may not match Stark’s full developer-first positioning, yet they simplify specific buyer jobs—free operating accounts, cards, cash-management, or spend control—without asking customers to think like infrastructure buyers.


    Packaging is also mixed. Stark’s docs emphasize transparent per-transaction pricing and no monthly minimums for money movement, while Conta Simples discloses a monthly platform fee that can be waived with card volume. Cora publicizes a free account and free Pix/TED positioning for SMEs. Several enterprise players, however, keep negotiated pricing opaque, which shifts the buying decision toward trust, breadth, service, and willingness to underwrite complex onboarding. In practice, that favors incumbents and large specialists in formal procurement but can favor Stark in developer-led evaluations where speed of integration matters more than list-price clarity.


    Distribution power is therefore asymmetrical. Inter, BTG, and Stone already touch broad customer bases and can cross-sell new payment features into existing relationships. Celcoin benefits from being infrastructure for other institutions. Stark, by contrast, appears to rely more on product fit, case-led proof, and word of mouth than on mass distribution. The upside is cleaner positioning around high-volume workflows; the downside is that competitors with broader installed bases may gain share simply by bundling similar capabilities into accounts buyers already use.'
