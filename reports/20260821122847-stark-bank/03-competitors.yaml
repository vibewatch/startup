  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rate
    missingEvidence: Public win-rate, loss-rate, and churn data versus incumbent banks and specialist fintechs in enterprise deals.
    whyItMatters: Without competitive conversion data, investors cannot tell whether Stark's product story survives procurement-led comparisons.
    diligencePath: Request pipeline win/loss analysis segmented by competitor class and customer size.
    relatedQuestionRefs:
    - QP022
  - type: private-evidence-only
    severity: material
    topic: retention-and-switching-costs
    missingEvidence: Net revenue retention, gross retention, and product-attach by cohort.
    whyItMatters: These metrics would show whether integrated workflows create durable switching costs or only point-solution usage.
    diligencePath: Request cohort retention by product and customer segment.
    relatedQuestionRefs:
    - QP017
    - QP022
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: peer-uptime-benchmark
    missingEvidence: A comparable peer benchmark for uptime, failed transactions, incident rate, and support SLA across Stark and competitors.
    whyItMatters: One-off status pages and IQS scores do not prove relative operational superiority in enterprise production conditions.
    diligencePath: Request internal benchmark packs or customer references that compare operating quality across vendors.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: stark-infra-revenue-split
    missingEvidence: Exact Stark Infra revenue share, partner concentration, and margin contribution versus direct banking revenue.
    whyItMatters: Competitive strength at the infrastructure layer cannot be underwritten without knowing whether it is large, profitable, and diversified.
    diligencePath: Request segment reporting or management-level split of infrastructure versus direct products.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: minor
    topic: contract-pricing-benchmarks
    missingEvidence: Full enterprise contract pricing and discounting patterns across Stark, Celcoin, Inter, BTG, and Stone.
    whyItMatters: Headline packaging signals understate how much price competition may matter in larger procurement cycles.
    diligencePath: Collect anonymized customer contracts or pricing sheets during diligence.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP003
