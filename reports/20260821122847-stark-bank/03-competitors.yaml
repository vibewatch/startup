tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Stark Bank
    - Direct specialist
    - R$280B payments in 2024; 700-800 active corporations disclosed across 2025-2026 lenses
    - Mid-market and enterprise Brazilian companies
    - Single API across Pix, boleto, cards, transfers, and direct settlement
    - No disclosed fresh public win-rate or broad branch distribution
  - - Celcoin
    - Embedded-finance infrastructure
    - 600 digital banks/fintechs, 6k medium & large companies, 40k retail points, >R$40B monthly volume
    - Regulated and non-regulated companies wanting embedded finance
    - Broad modular banking/credit/payments stack and licensing story
    - Less obviously positioned as the day-to-day operating bank for finance teams
  - - Cora
    - SME digital account / adjacent direct rival
    - +1.7M accounts, +R$190B transacted, ~350 employees
    - PMEs, entrepreneurs, small businesses
    - Free account positioning, strong SME brand, widening credit/investment scope
    - SME skew means less explicit enterprise/API depth than Stark
  - - Conta Simples
    - Spend-management adjacent rival
    - Corporate-card and finance-ops platform; public case studies emphasize new-economy companies
    - SMBs and mid-market teams prioritizing spend control
    - Unlimited virtual cards, centers of cost, dashboards, and card workflow UX
    - Narrower banking breadth and less public infrastructure depth
  - - Inter / BTG Pactual
    - Incumbent digital-bank substitutes
    - Large regulated institutions with enterprise distribution and Pix/API surfaces
    - PJ, MEI, and corporate customers
    - Trust, broad relationship coverage, and bundled banking features
    - May be less opinionated or cohesive for developer-first operational workflows
  - - Stone
    - Merchant-finance incumbent adjacent
    - 4.8M active clients; R$3.6B total revenue and income in 2Q26
    - Merchants and businesses of multiple sizes
    - One-stop mix of payments, banking, software, and credit
    - Merchant-centric bundle does not equal enterprise API-banking depth
  notes: Profiles are job-to-be-done oriented rather than claiming each name is identical to Stark on every product dimension.
