  title: Competitors
summary: Stark competes in a crowded Brazilian corporate-finance market where buyers can choose specialist API banks, embedded-finance infrastructure vendors, SME account platforms, incumbent universal banks, merchant-finance bundles, or the status quo of manual incumbent workflows. The most credible specialist rival on infrastructure breadth is Celcoin; the most credible account-led rivals are Cora and Conta Simples; and the most credible trust-and-distribution substitutes are Inter, BTG Pactual, and Stone. Stark’s edge is product coherence, direct settlement, and enterprise-grade Pix operations, but its moat looks more executional than structural because the underlying rails are standardized and competitors can bundle similar capabilities into broader relationships.
sections:
- id: SP001
  title: 'Landscape: the buyer can choose specialists, incumbents, or internal build'
  body: 'Stark does not compete in one clean peer set. The same finance team that considers Stark can also buy a specialized embedded-finance platform such as Celcoin, a SME-focused account platform such as Cora or Conta Simples, a universal bank product from Inter or BTG Pactual, a merchant-finance bundle from Stone, or simply keep running the workflow through incumbent bank portals and spreadsheet-heavy internal processes. That matters because the real comparison is job-based: receive with Pix and boleto, pay suppliers, issue cards, reconcile transactions, keep balances productive, and expose those workflows to internal software through APIs. A buyer does not need another generic “digital bank”; it needs lower operational friction on mission-critical money movement.


    The most direct overlap comes from the specialist end of the market. Celcoin attacks the infrastructure layer with embedded-finance modules, licenses, and connectivity sold to regulated and non-regulated companies. Cora and Conta Simples attack the operating-account and finance-ops layers for Brazilian businesses, especially smaller and mid-market customers that want easier cash management, free Pix, spend control, or credit. Inter and BTG bring brand, balance-sheet trust, and increasingly visible API or Pix Automático capabilities. Stone comes from merchant acquiring and software, but its integrated payments, banking, and credit stack makes it a real substitute for some operating accounts.


    The final competitor is the status quo. Many Brazilian companies still tolerate fragmented bank portals, manual boleto issuance, spreadsheet reconciliation, and in-house approval logic because switching core finance operations carries process and trust risk. That means Stark must beat not only rival fintechs but also the inertia of “good enough” incumbent workflows. The practical competitive question is therefore whether Stark’s developer-first product can justify workflow migration faster than incumbents and adjacent specialists can copy the same core rails.'
