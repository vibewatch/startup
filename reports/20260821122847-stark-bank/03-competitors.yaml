  - - Specialist focus on finance operations
    - Incumbents bundle features into existing relationships at low marginal cost
    - High
    - Review Stark win rates in procurement-led deals versus bank-led renewals
  - - Stark Infra adjacency
    - Celcoin and other infrastructure vendors outscale on partner access
    - High
    - Disaggregate infra revenue and partner concentration from direct-bank revenue
  notes: The competitive risk is not one killer rival but cumulative feature convergence plus distribution asymmetry.
