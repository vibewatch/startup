      - number: '3.3'
        title: 切换成本、护城河耐久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              这里的竞争护城河更偏运营，而非结构性。Pix、boleto
              和账户基础设施越来越由监管标准化，意味着没有一家供应商拥有轨道。关键在落地质量：可用性、对账准确度、卡控制、接入上线速度、合规准备度，以及客户还需要投入多少工程工作。一旦财务栈嵌进
              ERP、计费、出款和审批流，就会产生一些切换成本；但这也允许多归属。公司可以保留既有银行做资金管理，用另一家供应商做卡，并测试 Stark 或 Celcoin 的某个支付工作流。

              反向证据重要，因为几家竞争者有 Stark 不能轻描淡写的优势。Celcoin 的广度、牌照叙事和公开生态数字显示，它可能在基础设施广度上绕到 Stark 侧翼。Cora 最近获得 SCFI
              授权，扩大了面向中小企业买方的产品菜单。Inter、BTG 和 Stone 能把资产负债表信任、广泛客户触达和交叉销售组合起来。即便是更窄的 Conta
              Simples，当买方主要想要支出控制而不是可编程银行时，也能有效竞争。与此同时，Stark 不公开赢单率、流失、队列留存或经独立基准化的客户满意度数据，市场仍要更多相信管理层定位故事，而不是硬竞争证明。

              正确结论是，Stark 的护城河真实但有条件。客户把 API 易用性、直接结算、快速集成和企业级 Pix
              运营看得比网点关系或宽泛银行组合更重时，护城河最强。采购若由信任、捆绑折扣或对单一综合银行关系的偏好主导，护城河就会变弱。投资人的尽调负担，是检验既有机构把同一批轨道产品化之后，Stark
              的产品主导优势是否还能延续。
