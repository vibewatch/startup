              Stark 最有利的证据不是投资人幻灯片，而是已披露利润和支付规模的组合。一家私营金融科技公司，2023 年达到 R$155B 支付量和 R$71.5M 净利润，2024 年又达到 R$280B
              支付量，已经从故事型资产跨到了真实金融基础设施。即使没有新一轮融资，这些经营数字也足以支撑认真尽调。
