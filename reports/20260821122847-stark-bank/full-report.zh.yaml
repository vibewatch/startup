chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Stark Bank 把自己定位成面向成长型公司的开发者优先企业银行，产品界面围绕资金流转展开，而不是网点式关系银行。官方文档描述了一个单一 REST API，覆盖
              Pix、boleto、卡、转账和银行工作流；同一来源还称，集成通常约两天完成，请求使用客户自管 ECDSA 密钥对认证，而不是共享 API key，收款直接结算到 Stark
              账户，而不是中间钱包。这套架构很关键：Stark 更不像消费者新银行，更像服务财务团队、资金团队、平台和运营复杂的巴西公司的可编程金融基础设施。


              媒体报道和公司自有材料一直把客户痛点描述为人工、易出错的后台财务：开票、供应商付款、类工资转账、应收款跟踪和卡支出控制。Rafael Stark
              多次把产品叙事放在消除高频支付运营中的人工瓶颈上，面向客户的产品组合也印证这一点：Pix 发票和二维码收款、boleto 开具和支付、TED 与 Pix
              出款、公用事业和税费支付、企业卡、固定收益资金管理产品，以及越来越多的 Open Finance
              支付发起。因此，后续章节的总可用市场（TAM）逻辑从巴西企业支付和资金管理自动化出发，而不是从零售银行存款余额出发。


              官方文档和 2026 年博客材料显示，平台 2025 年经手 R$600B；Ti Inside 和 Portal Tela 在 2026 年中引用的口径则是过去 12 个月 Pix 交易量超过
              R$670B。这些数字来自公司口径，且视角略有不同，但指向同一个战略判断：Stark 已在 Pix 轨道上跑出真实运营规模，现在争夺的是更大的企业支付流，而不只是创业公司账户。因此，当前公开定位是 API
              银行、支付处理商和资金编排层的混合体。
