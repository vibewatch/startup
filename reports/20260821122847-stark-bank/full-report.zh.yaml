      - - Cora
        - 免费账户；Pix 和 TED PJ 免费；100 张 boleto 免费
        - SME 账户、转账、卡，以及扩展中的信贷 / 投资
        - 免费包之外的抽佣率未完全公开
        - 有利于获取 SME 和价格敏感买家
      - - Conta Simples
        - 平台费 R$49.90/month，卡消费达到 R$5,000 后免除
        - 企业卡、费用管理、账户工作流
        - 卡经济性和大型企业折扣未公开
        - 简单、可见的包装能赢下部门预算负责人
      - - Inter / BTG
        - 多为谈判价 / 关系型定价
        - 广泛银行功能、Pix、API、经常性 Pix 工具
        - 公开企业价目表有限
        - 信任和捆绑广度可能抵消标价不透明
      - - Celcoin / Stone
        - 多为企业 / 合作伙伴谈判价
        - 基础设施模块或商户金融组合
        - 定价高度取决于交易量和模块组合
        - 竞争压力可能通过定制包装体现，而非公开标价
