      - number: '5.3'
        title: 可靠性、合规、路线图与产品风险
        blocks:
          - type: paragraph
            body: >-
              最强的公开信任信号来自文档、监管文件和状态页面。Stark 声称 99.99% 可用性、中位延迟低于 200ms、Bacen Pix Grade A、PCI DSS 4.0.1、SOC 2 和 ISO
              27001。BCB IQS 文件独立佐证了 Grade A Pix 结果，公开状态页至少显示公司把事故沟通当作正式界面，而不是事后补救。面向客户的案例材料也强化了运营价值主张：Vertem
              强调在一个环境中集中支付、卡和对账；Simplic 则称采用 Stark Pix 和 boleto 工具后，人工工作减少、收款效果改善。

              风险也体现在公开界面没有展示的内容里。本轮抓取的主网站页面比文档、博客文章或 SDK README
              薄得多，因此很多技术理解依赖公司自有文档，而不是第三方基准。几个官方案例子页面抓取结果是空壳，意味着客户证明在博客叙事里强于在正式案例中心页面里。软件包注册表页面部分受阻，使 GitHub
              和文档成为主要开发者信号证据。尽管 API 面很丰富，内部账本处理、韧性设计、数据分区或发布工程仍没有公开深度架构说明。

              正确的产品技术结论是正面但带限定。Stark 看起来比许多区域银行产品更原生面向开发者、更贴近工作流，围绕认证、沙盒与生产一致性、webhook 设计和多语言 SDK
              支持都有强公开信号。但投资人仍应把内部可靠性架构、部署成功率和发布/变更管理纪律，当成尽调主题，而不是被公开营销完全证明的事实。
