      - number: '7.2'
        title: 运营、安全和合作伙伴依赖构成第二大风险簇
        blocks:
          - type: paragraph
            body: >-
              Stark 的产品承诺依赖全天候运营质量。公开定位强调直连结算、实时 webhook、自动对账、7x24 支持，并要求关键流程在亚秒到数秒内响应。这很有价值，但也把容错空间压得很窄。收款或出款供应商能扛住小的
              UI 瑕疵；但如果一家公司把资金管理、周期性收款、收单、卡和 Pix 都跑在同一供应商上，就会对停机、webhook 投递失败、结算延迟、欺诈和事故处理高度敏感。公开状态页和 IsDown
              事故历史显示，公司确实遇到过运营事件，即便更长周期的记录仍显得扎实。


              Stark 拓宽范围后，安全和业务外延风险也会上升。收单页强调拒付管理和 3DS
              2.0，企业卡页强调令牌化，信用额度页承诺更高额度，加密业务页面则让资金管理暴露在数字资产上。每一块都有商业吸引力，也各自带来风险向量：商户争议、欺诈、信贷审批、准备金需求，以及加密资产波动或合规问题带来的声誉传染。公开文档证明公司知道这些风险存在；它们没有量化生产环境里的损失和控制效果。


              依赖链条也在外部。Stark 依赖 BCB
              管理的清算轨道、客户实施质量、法律解释和自身支持运营。也就是说，一次大型事故或监管事件会很快传导到客户信任和留存。主要缓释因素是公司看起来技术上很认真；最大的未解问题是，内部韧性和控制系统是否已经扩到下一个数量级。
