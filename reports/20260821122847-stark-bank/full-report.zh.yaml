      - number: '2.4'
        title: 增长驱动、约束与矛盾证据
        blocks:
          - type: paragraph
            body: >-
              增长驱动异常强。按 EBANX 分析，Pix 已覆盖超过 170 million 用户和 93% 成年人口；据报道，接入 Pix 的商户收入和客户增长表现更好。Open Finance
              增加了支付发起和数据共享基础设施，可进一步降低摩擦。对周期性业务而言，Pix Automático 可能把可触达基础扩大到持卡人之外；在仍有数千万巴西人没有信用卡的市场，这一点很关键。这一切为能把监管和 API
              复杂度封装成可用企业产品的供应商，创造了肥沃土壤。

              约束同样真实。关于 2025 年 BCB 规则的法律评论显示，支付机构面对更高的授权、治理和安全要求。Worldpay 与 EBANX 的产品材料也说得很清楚：Pix Automático
              和高频支付发起不是一键插件；它们需要重试逻辑、合规纪律和计费引擎重构。买方还必须把关键运营交给供应商，这抬高了可用性、事故处理和直接监管边界的重要性。最后，机会很拥挤：BTG、Inter、Itaú、Stone
              等既有机构，以及 Cora、Conta Simples、Celcoin 等专门玩家，都在争夺同一工作流预算的相邻部分。

              因此，矛盾证据不在于市场是否大——它显然很大——而在于这份大里有多少能被 Stark
              变现。轨道交易量、消费者采用和结账份额都向上；但定价权、附着率、企业信任和合规负担，将决定能转化为耐久收入的那一部分。这一区分应成为报告余下部分的锚点。
