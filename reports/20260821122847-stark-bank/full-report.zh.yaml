      - number: '4.3'
        title: 资本充足、融资依赖与财务结论
        blocks:
          - type: paragraph
            body: >-
              财务实力是 Stark 公开画像中更有吸引力的属性之一。公司多次强调，它保留了此前融资中的大量现金，2023 和 2024 年披露盈利，并在 2025
              年表示不会仅为重置估值观感而融资。这很重要，因为许多高增长金融科技公司需要频繁外部资本，才能支撑合规、损失资金或营销。Stark 的信息则指向内部现金生成，加上仍可使用的历史资本。

              但“轻资本”不等于资本无关。一家公司发卡、以 SCD 身份放贷、运营支付基础设施、追求更宽监管许可，并瞄准 5,000 家公司和 R$1 trillion
              经手量，仍会面对资本需求：监管资本、流动性缓冲、技术韧性、客户支持，以及潜在信贷风险资金。具体月度烧钱速度、现金跑道和资产负债表储备没有公开。同样，如果银行牌照获批后拓展获准产品面，也可能扩大支撑这一野心所需的资本底座。

              因此，财务结论偏正面但不完整。公开证据支持 Stark
              已从交易量故事跨过重要门槛，成为盈利运营商，从而降低近期融资风险。但收入结构、利润率、现金、烧钱速度、信贷损失和客户集中度数据缺失，使本章无法支撑已充分定价的投资测算。对投资人而言，只有尽调能确认披露盈利没有被临时利差环境或少数高交易量客户美化，业务才看起来可投资。
