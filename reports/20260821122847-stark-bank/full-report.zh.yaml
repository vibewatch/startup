      - number: '2.3'
        title: 买方地图、采用路径与预算归属
        blocks:
          - type: paragraph
            body: >-
              买方通常不是零售银行客户，甚至不是泛泛的中小企业业主。Stark 的自然采购中心，是已经感受到扩张痛点的公司财务组织：CFO、司库、财务控制、财务运营负责人和支付负责人。技术用户往往是工程或产品团队，因为 API
              集成、审批规则和 webhook 处理在软件系统里，而不只是网银界面里。付款方仍是公司；用户是内部财务和运营员工；预算负责人通常在财务部门，有时在直接负责支付转化的平台或业务单元。


              采用通常从一个最痛的工作流开始，而不是替换整家银行。对一些买方是用 Pix 或 boleto 做收款和对账；对另一些买方，是供应商付款、卡和支出控制，或借助 Pix Automático
              做周期性收款。一旦集成落地，扩张路径就清晰：直接结算、支付发起、周期性逻辑、资金管理产品，最终到嵌入式金融基础设施。这种先落地再扩张的动态，是市场即便有大型既有机构也能容纳一家专门 API 银行的原因之一。


              Stark Infra 创造了毗邻第一类买方的第二个买方宇宙。这里的买方不是企业资金团队，而是想获得 RSFN/Pix 基础设施、又不想从零自建的金融科技公司、银行或平台。这一邻近市场有战略意义：它加深了
              Stark 在金融生态中的存在感，但也把公司暴露在更像基础设施的市场里；在这种市场中，可靠性、授权和定价纪律比品牌或关系银行更重要。
