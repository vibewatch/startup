      - number: '6.3'
        title: 耐久性、扩张和集中度：最大的客户问题仍未公开
        blocks:
          - type: paragraph
            body: >-
              公开证据强力支持先落地再扩张的潜力。产品面允许客户先从一个工作流开始——Pix、boleto、卡或付款出款——再追加资金管理、周期性付款、收单或基础设施服务。客户叙述也印证这一模式：它们反复先讲运营痛点，再讲更宽的控制平面。如果
              Stark 嵌入 ERP、账单、付款出款和审批环节，账户就可能更耐久。


              但公开记录仍缺少投资人真正想看的耐久性指标：NRR、GRR、流失、合同期限、续约率、队列扩张，甚至按规模和行业拆分的基本客户数。Familhão 的 85% 续费提升和 Simplic
              的逾期率下降，都是不错的点状证据，但它们不能说明 Stark 是否能在整个组合中留住收入。我们也不知道 TPV 或收入是否集中在少数超大品牌客户手中。高交易量支付平台的集中度风险，可能比客户数更重要。


              最稳妥的解读是，Stark
              显然已经在财务密集型企业中找到了可复制的契合点，但组合质量仍未定论。投资人需要弄清楚哪些客户仍像试点，哪些已经深度嵌入；有多少客户使用不止一个产品；加密业务和企业客户群的行为是否不同；大品牌客户代表耐久的经常性收入，还是只是阶段性的高
              TPV。这些问题卡在「真实采用」和「可支撑投资判断的客户质量」之间。
