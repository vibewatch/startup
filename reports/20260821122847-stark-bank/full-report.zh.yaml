  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管边界是首要风险，因为品牌野心跑在法律确定性前面
        blocks:
          - type: paragraph
            body: >-
              最大的单一投资风险是监管，而不是市场需求。Stark
              已经在受监管的支付和信贷结构内运营，但公开报道也显示，公司在申请更广泛的银行牌照，并在流程未落定时继续扩张产品范围。风险在于，公司的品牌、产品宽度和客户承诺越来越像一家完整的企业银行，而法律边界仍取决于特定实体授权和合规义务。Banco
              Central do Brasil 的任何延误、附加条件或负面解释，都可能抬高成本、拖慢开户、限制产品，或迫使公司改动运营设计。


              更大的监管环境会放大风险。本轮审阅的法律分析认为，2025 年规则调整后，巴西支付机构面临更严格的授权、治理和 Pix 安全要求。公开的 BCB 参与方文件和 IQS 报告是正面信号——它们显示 Stark
              已进入正式支付基础设施，并拿到较强的 Pix 质量评分——但不能消除战略风险：监管收紧可能快于公司扩张许可。说白了，当前合规今天或许足够，却仍可能撑不起明天的路线图。


              正确评分应是严重性高，但今天还不至于打穿投资逻辑。审阅来源中没有公开执法事件，公司看起来也更像方法稳健，而不是鲁莽扩张。但投资人不应把没有执法等同于没有风险。围绕受监管资金流转搭建的业务，会被更慢的审批、更严的审慎规则，或刚好在增长提速时抬高服务成本的义务所伤。
