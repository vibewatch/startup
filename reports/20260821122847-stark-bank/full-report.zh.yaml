      - number: '1.2'
        title: 创始人、领导层与治理路径
        blocks:
          - type: paragraph
            body: >-
              公开可得的创始人证据几乎都指向 Rafael Stark。Exame、Valor、Bloomberg Línea、IPO Ventures 和 Y Combinator 均将其列为创始人兼
              CEO；可得履历材料称，他受过 ITA 工程训练，接触过 Stanford 创业项目，在接触到人工银行流程和易受欺诈的支付流程后创办 Stark。本轮审阅的公开来源均未佐证用户提供的 “Davi Veloso
              是联合创始人” 说法，因此后续尽调应把这一点视为未验证，而不是既定事实。


              公司相对支付量一直保持精简团队。Valor 和 Exame 在披露 2023 年业绩时报道员工接近 90 人；Bloomberg Línea 称，R$71.5M 的 2023 年净利润由 80
              名员工创造，2024 年团队扩至 100 人，其中约 30% 在技术岗。第三方数据库给出的数字更嘈杂。正确理解不是 Stark
              很小或很大，而是公开员工数披露不一致，只能近似看待。这一点重要，因为公司的资本效率叙事依赖极高的人均支付量。


              治理也处在过渡期。公开 BCB 记录显示，Stark 目前至少通过两家受监管实体运营：Stark Sociedade de Crédito Direto（自 2021 年起）和作为 Instituição de
              Pagamento 的 Stark Bank S.A.（自 2024 年 11 月起）。管理层还谈到 Open Finance
              的支付发起牌照，以及长期取得完整银行牌照的目标。这种拼接可以有两种解读：正面看，公司在有步骤地拓宽监管许可；反面看，企业银行品牌已经跑在它最终想占据的法律边界前面。监管补课是本报告最核心的治理主题之一。
