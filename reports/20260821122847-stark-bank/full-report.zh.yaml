      - number: '4.2'
        title: 牵引力、成本结构与公开单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              在巴西私营金融科技公司中，Stark 最强的公开牵引力数据异常清晰。Valor 和 Exame 报道，Stark 2023 年处理 R$155 billion，产生 R$71.5 million
              净利润。Bloomberg Línea 随后称，2024 年支付量达到 R$280 billion；由于 Stark 主动加大营销和投资，净利润降至约 R$50
              million。公司自写内容和行业媒体更新随后再次抬高规模叙事：2025 年经手 R$600 billion，2026 年中以前 12 个月 Pix 超过 R$670 billion，2026 年目标为 R$1
              trillion 经手量。这些不是同一指标序列，但合在一起显示活动量快速增长。

              成本故事比交易量曲线更复杂。公开评论暗示三大成本桶：全天候支付运营所需的基础设施和支持；2024-2025 年明显增加的营销和 GTM 支出；以及公司以 SCD 和 IP
              身份运营、同时推进更宽牌照带来的监管/合规开销。公司还用自有资产负债表推出信贷相关产品，这带来资本和损失敞口问题，纯软件供应商不会面对。Stark
              仍是私营公司，因此没有公开毛利率、CAC、回本周期、欺诈损失或拨备披露。投资人只能使用代理指标，而不是单位经济。

              这些代理指标方向上有用。公开记录中的人均支付量和人均利润都很高，支撑资本效率叙事。但缺少产品级收入、贡献利润率或损失数据，意味着公司外部没人能判断最赚钱的增长来自支付、卡、信贷、资金管理还是基础设施。
              业务看起来比许多成长阶段金融科技公司财务更强，但公开材料仍不足以支撑真正的投资测算模型。
