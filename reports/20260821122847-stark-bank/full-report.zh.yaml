      - number: '1.4'
        title: 里程碑、监管过渡与早期反向信号
        blocks:
          - type: paragraph
            body: >-
              Stark 发展时间线异常重要，因为产品、规模和监管许可在同步推进。公司 2018 年成立，2022 年完成 Series B，披露 2023 年盈利和 R$155B 支付量，2024
              年扩展到收单和更广泛的企业营销，随后在 2025-2026 年讨论 Open Finance 支付发起、国际牌照，并把 2026 年经手资金目标定为 R$1T。这不是种子期 API
              银行的画像；它是一家后期成长型基础设施公司，试图把支付规模转化为更宽的企业财务套件。


              同一条时间线也暴露主要尽调风险。CNN Brasil 和 Portal Tela 报道，Stark 于 2023 年 12 月向 BCB 申请完整银行牌照，到 2026 年 4
              月仍未获批；这意味着，即使品牌和产品组合接近银行形态，公司仍在 IP 和 SCD 约束内运营。本轮审阅的法律评论解释了为什么这点重要：巴西 2025 年收紧了支付机构的授权和审慎规则，尤其聚焦 Pix
              参与、治理，以及公开呈现跑在牌照前面的机构。


              运营韧性是第二个反向主题。官方状态页和 IsDown 历史显示，2026 年出现过实质性事故，包括与 Central Bank 连接相关的 DICT 通信中断、Visa 收单不稳定，以及结算银行故障影响
              boleto 相关流。单个事故本身不能证明结构性脆弱，但它们说明，围绕关键资金流转搭建的公司仍有基础设施和生态依赖风险。管理层同时扩客户、加轨道、做地域扩张时，这一风险尤其相关。
