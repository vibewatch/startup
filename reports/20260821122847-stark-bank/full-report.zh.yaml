      - number: '8.2'
        title: 估值背景：最后公开估值锚已经过时，但公司比当时大得多
        blocks:
          - type: paragraph
            body: >-
              最强的硬锚仍是 2022 年 Series B。公开融资报道一致称，Stark 融资 $45 million，估值约 $250 million，Ribbit Capital 和 Bezos Expeditions
              参投。同期还有创始人表述，称公司在概念上“接近”独角兽状态，但实际估值并未达到独角兽。这个区别很重要，因为它说明叙事为什么会跑在价格前面。公司此后显著扩大了交易量和产品宽度，但公开记录仍缺少新的定价融资事件。


              因此，合理的估值流程必须三角校验，而不是机械内插。Stone、PagBank、Banco Inter 等上市公司可比对象，显示巴西大型上市金融平台在客户、存款、收入和利润上可以长到多大。Stark
              在绝对规模和资产负债表厚度上显然远小于这些公司，但公开来源也暗示，相对团队规模和细分聚焦，它异常高效。同时，市场追踪器和通用独角兽榜单没有给出可信公开确认，证明 Stark 本身在 2025 年或 2026
              年跨过 $1 billion。最保守的解读是，公司已经长过最后公开估值锚；最激进的解读——已确认的独角兽——仍未被证明。


              这指向一个有边界的区间，而不是单一目标价。如果尽调验证留存、集中度和监管进展，较 2022 轮大幅溢价可以成立。如果当前卖方预期在缺少新硬证据的情况下已经假定独角兽级状态，安全边际就会消失。
