        - 如果赢单率和多产品附加率都强，则上调判断
      - - 监管和运营风险应当打折
        - 如果牌照、事故或损失恶化，则下调判断
    notes: 论点来自前文各章，并被转成明确的决策枢纽。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 留存强，监管路径打通，多产品附加扩大，利润率保持韧性
        - 有支撑证据时，估值可能接近但仍未必超过独角兽区间
        - 需要当前收入和集中度证明
        - 可能成立，但公开证据尚未证明
      - - 基准
        - 业务质量强，但当前价格缺乏支撑；估值显著高于 2022 年锚点，但低于 $1B
        - 规模和盈利能力可支撑较 2022 年估值适度上调
        - 证据缺口压住上行空间
        - 最符合公开记录
      - - 悲观
        - 集中度、损失或监管摩擦削弱信心；当前要价过高
        - 估值仅略高于 2022 年，或可能回压至该锚点附近
        - 若出现定价轮，存在降价轮 / 平价轮风险
        - 如果尽调不及预期，概率不低
    notes: 情景边界取决于公开证据今天实际能支撑什么。
    claimRefs:
      - CV017
      - CV021
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 为何有用
      - 局限
    rows:
      - - Stark Bank（2022 Series B 轮）
        - $45M 融资，对应 $250M 估值
        - 私募历史锚点
        - Stark 唯一清晰的公开价格点
        - 已陈旧，且发生在规模放大之前
      - - StoneCo（Q2 2026）
        - 3.24M 活跃客户；R$3.12B 收入；R$290.6M 调整后净利润；R$109.1B TPV
        - 巴西上市商户金融可比公司
        - 提供规模化支付平台的上市市场标尺
        - 业务组合不同，且上市公司体量大得多
      - - PagBank（Q2 2026）
        - 34.1M 客户；R$3.4B 净收入；R$576M 经常性净利润；R$133.4B TPV
        - 巴西上市银行 / 支付可比公司
        - 提供资金规模和上市盈利能力语境
        - 生态和存款基础大得多
      - - Banco Inter（IR 首页视角）
        - 上市数字银行，IR 页面披露客户、收入和信贷规模数据
        - 上市数字银行可比公司
        - 展示巴西上市数字金融的估值重心
        - 客户组合和产品宽度不同
    notes: 这些可比对象是方向性标尺，不是 Stark 直接套模型的替代品。
