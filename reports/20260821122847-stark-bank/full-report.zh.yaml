      - number: '8.3'
        title: 建议：仅在有价格纪律和硬尽调闸门时保留条件性兴趣
        blocks:
          - type: paragraph
            body: >-
              由此得出的建议不是干净的“买入”或“回避”，而是有条件。只看公司质量，Stark
              很有吸引力：市场强、产品深度真实、客户真实、已经盈利，并有一条可信的继续扩张路径。但从估值纪律看，局面仍未解，因为投资人没有足够公开证据支撑紧致的当前公允价值估计。因此，正确姿态是继续研究或条件性兴趣，而不是盲目追高。


              落到实操上，入场价格必须承担大部分安全边际。低于独角兽的估值，再叠加客户耐久性、损失纪律和监管进展的证据支持，可能很有吸引力。主要靠管理层叙事和过期轮次历史支撑的独角兽以上要价，就难辩护得多。风险章节在这里也重要：监管边界、可用性、集中度不透明和资产负债表产品，相比更干净的软件业务都应有估值折扣。


              最终投资姿态是中等置信度、高证据敏感性和中高业务质量。Stark
              应进入投资人的重点跟踪清单，但必须设定明确尽调闸门：收入质量、集中度、损失、监管状态和当前价格。如果这些闸门通过，判断可以上调；否则，更安全的做法是观察，而不是硬给精确结论。
