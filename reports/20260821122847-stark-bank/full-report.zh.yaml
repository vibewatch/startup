  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：哪些算入，哪些不算
        blocks:
          - type: paragraph
            body: >-
              Stark 的正确市场边界，不是抽象的“巴西银行业”，甚至也不是“所有 Pix 支付”。Stark 的产品栈围绕可编程企业资金流转：企业和平台收款、付款、资金路由、卡、银行 API 工作流、嵌入式金融基础设施和
              Open Finance 支付发起。因此，Stark 可覆盖的是支付层和工作流层，客户能用 API 控制执行，替代人工财务运营。不包括大部分零售存款、个人信贷、网点分销、财富管理 AUM，以及不依赖 Stark
              式运营软件的长久期贷款。


              巴西重要，因为 Pix 轨道把其他市场需要多年完成的采用周期压缩了。Worldpay 的支付研究和产品文档都把 Pix 定义为实时、24/7、低成本的账户到账户基础设施；EBANX 2025
              年分析则认为，巴西即时支付系统已经成为全球大众市场采用最快的样本。落到实践，总可用市场（TAM）从模糊的“数字银行”故事变成工作流市场：任何需要收款、付款、对账、重试和监控支付的巴西公司，都是自动化的潜在买方。


              另一个市场边界洞见是，全国 Pix 交易量是必要但不充分的规模口径。总轨道量包含消费者转账、不可服务的流量，以及无法干净映射到 Stark 定价或附着点的支付类别。因此，后续估值应把全国 Pix
              金额视为采用上限，再下切到 Stark 真正销售产品的可服务层：企业财务运营、周期性收款、嵌入式金融和高频企业交易编排。
