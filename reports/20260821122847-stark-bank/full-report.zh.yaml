        universe.
  - id: TV005
    title: 打破投资逻辑与否决触发表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前要价接近或高于独角兽估值，且没有新的硬证据
        - 价格 > 公开证据支撑
        - 抹掉安全边际
        - 下调至观察 / 放弃
      - - 监管受挫
        - 牌照重大延误或限制性条件
        - 削弱增长和信任假设
        - 下修基准情景
      - - 运营可靠性恶化
        - 反复发生严重事故
        - 损害客户持久性和溢价倍数逻辑
        - 暂停投资
      - - 损失或集中度意外
        - 少数客户敞口过大，或损失上升
        - 削弱盈利质量叙事
        - 要求更大折价
      - - 留存或附加销售尽调偏弱
        - 多产品扩张低或留存差
        - 降低相对 2022 年锚点的溢价
        - 转向悲观情景
    notes: 否决触发点把尽调结果直接接到组合行动上。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入和毛利率
        - 产品层收入和毛利
        - 支撑任何当前估值都需要这些数据
        - 财务尽调 / 管理层资料室
      - - 留存和附加销售
        - NRR、GRR、客户流失、多产品附加率
        - 区分强客户名单和可持续经济性
        - RevOps / 客户分析
      - - 集中度
        - 头部客户 TPV 和收入占比
        - 决定下行韧性
        - 财务 / 客户分析
      - - 损失和准备金
        - 拒付、欺诈损失、信用损失、准备金
        - 检验盈利持久性
        - 风险 / 财务
      - - 监管状态
        - 当前银行牌照范围、时点和条件
        - 最大战略风险因素
        - 法务 / 合规 / 律师
      - - 当前定价预期
        - 条款清单或老股价格背景
        - 建议对价格敏感
        - 投资团队 / 经纪人 / 卖方
    notes: 这些尽调问题是把公开兴趣转成投 / 不投决策所需的最低信息。
    claimRefs:
      - CV026
      - CV027
      - CV038
      - CV039
      - CV040
