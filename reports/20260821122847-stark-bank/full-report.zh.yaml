      - number: '5.2'
        title: 架构、开发者体验与运营模式
        blocks:
          - type: paragraph
            body: >-
              对私营金融科技公司来说，Stark 的公开架构证据异常扎实，因为文档和 SDK 较详细地暴露了集成模型。认证基于 ECDSA 密钥对，而不是共享 API key：客户生成私钥，在 Stark
              网银登记公钥，并在本地签署每个请求。文档强调，写入端点接受外部 ID，以保证重试安全；签名 webhook 实时传递状态变化；失败投递会用指数退避重试。这不只是营销表面；Python 和 Java SDK
              README 也展示了 webhook 订阅资源、webhook 事件尝试、签名校验、转账操作、账单支付、税费支付和分页/查询原语。

              开发者体验看起来是真正的设计优先级。文档称官方 SDK 覆盖九种语言，沙盒免费且不限量，生产客户可获得 24/7 支持。Go、Python、Java 和 Node 的 GitHub
              仓库确认了多语言维护姿态；Python 和 Java SDK 中的包管理器安装片段也说明，这些仓库是实用入口，而不是宣传册。虽然本轮中软件包注册表页面不如 GitHub 和文档可读，但详尽技术文档叠加维护中的
              SDK 仓库，构成了有意义的开发者信号。

              运营上，系统依赖直接接入巴西支付和监管轨道。结算直接进入 Stark 账户，而不是中间钱包；Pix 24/7
              秒级结算；其他产品则遵循各自轨道的结算窗口。这意味着架构不只是前端工作流软件，而是与受监管资金流转高度耦合，也抬高了可追溯性、事故处理和正式合规控制的重要性。
