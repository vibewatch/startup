      - number: '1.3'
        title: 融资历史、资本结构与规模披露
        blocks:
          - type: paragraph
            body: >-
              公开证据最扎实的融资点是 2022 年 Series B：US$45M，估值 US$250M，Ribbit Capital 和 Bezos Expeditions 参投。多篇媒体报道和画像数据库指向累计融资总额在
              US$50M 高位到 US$60M 低位区间，但管理层后续访谈强调，资产负债表仍有资金，公司并不为抬高估值而主动寻求新一轮融资。2025 年 3 月，Rafael Stark
              明确表示，新融资不是优先事项，公司想把盈利转化为更多价值，而不是为了外部观感接受稀释。


              这一立场重要，因为它直接冲突于用户提供的 “2025 年 8 月 Series C、估值 $1B+” 说法。本轮审阅的官方投资者关系页面、Valor、Exame、Startups.com.br、CNN
              Brasil、BP Money 和可访问公司画像数据库，均没有找到巴西 Stark Bank 在 2025 年 Series C、由 8VC 领投或按独角兽估值定价的证据。网页检索反复拉出德国防务科技公司
              STARK 的融资新闻，这强烈提示所谓独角兽叙事可能是名称碰撞，而不是 Stark Bank 的隐藏融资轮。在一手公告出现前，最后一轮公开定价融资仍是 2022 年 Series B。


              但经营披露显示，公司规模已经远超 2022 年融资时的快照。Stark 披露 2023 年处理 R$155B 支付量、实现 R$71.5M 净利润；2024 年加大投资和营销后，支付量达 R$280B、净利润约
              R$50M。Bloomberg Línea 还引用了截至 2024 年 7 月过去 12 个月 R$212B 的
              TPV，与整体加速轨迹吻合。结果是，公司经营上看起来强于最后披露估值所暗示的水平，但缺少新的市场清算价格来锚定当前投资人回报。
