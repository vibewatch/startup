      - number: '3.2'
        title: 能力、打包与分发对比
        blocks:
          - type: paragraph
            body: >-
              能力上，Stark 的公开优势是连贯性：一个 REST API 横跨 Pix、boleto、卡、转账和银行，搭配直接结算到 Stark 账户，以及 Pix
              上具监管质量的服务评级。对有工程支持的财务团队，这是一套有吸引力的组合。但优势并非无人挑战。Celcoin 提供更广的嵌入式金融模块化能力和更大的公开生态足迹。Inter 与 BTG 可以把 API 和周期性
              Pix 工具包在消费者和企业信任更成熟的机构里。Cora 与 Conta Simples 未必匹配 Stark
              完整的开发者优先定位，但它们简化了具体买方任务——免费经营账户、卡、现金管理或支出控制——且不要求客户把自己当成基础设施买方。

              打包也有混合信号。Stark 文档强调资金流转按交易透明定价、没有月度最低消费；Conta Simples 披露月度平台费，可用卡交易量抵免。Cora 公开宣传免费账户和免费 Pix/TED
              的中小企业定位。但几家企业玩家仍保持协商定价不透明，采购决策就转向信任、广度、服务，以及承接复杂接入上线的意愿。实践中，这会让既有机构和大型专门玩家在正式采购中受益；在开发者主导的评估里，如果集成速度比价目表清晰度更重要，Stark
              反而受益。

              分发力因此不对称。Inter、BTG 和 Stone 已经触达广泛客户群，可以把新的支付功能交叉销售给既有关系。Celcoin 受益于为其他机构提供基础设施。相比之下，Stark
              似乎更多依赖产品匹配、案例证明和口碑，而不是大众分发。好处是围绕高频工作流的定位更干净；坏处是，装机基数更大的竞争者只要把相似能力捆进买方已经使用的账户，就可能拿到份额。
