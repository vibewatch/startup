  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑：业务质量强，定价能见度弱
        blocks:
          - type: paragraph
            body: >-
              正向投资逻辑很容易讲清楚。Stark 有真实支付规模、公开盈利、可信的企业客户证据、强开发者优先产品证据，并切入全球最具结构性吸引力的支付转型之一。它不是概念阶段的 API
              银行。公司已经处理数千亿雷亚尔交易，披露 2023 年和 2024
              年盈利，拿下可识别的大企业客户，并搭出一个看起来明显强于许多泛企业银行竞品的技术产品面。如果公司能继续把工作流深度转化为质量更高的经常性经济性，业务价值可能显著高于 2022 年最后公开估值锚。


              反向逻辑同样清楚：估值风险主要来自缺少价格发现和投资判断输入。最后一个可信的公开定价轮仍是 2022 年 Series B 轮，估值约 $250
              million。此后，公开证据支持一个大得多的经营业务，但不支持新的市场出清估值。用户提供的 2025 年独角兽叙事，在可访问的公开记录中未获佐证。没有当前收入、毛利率、留存、集中度或实时
              投资条款清单数据，任何把公司按某个具体数字判定为便宜或高估的尝试都很脆弱。


              因此结论对价格高度敏感。Stark 很可能值得较 2022
              年估值锚大幅上调，因为业务运营已经成熟。但公开证据不足以支撑有把握地按独角兽价格入场。若价格预期低于这一门槛，或尽调能证明当前盈利能力、留存和监管准备度显著强于公开证据显示，投资案会改善。
