      - number: '7.3'
        title: 即便公开势头强劲，模式、客户和执行风险仍披露不足
        blocks:
          - type: paragraph
            body: >-
              最后一组风险是财务质量和组合质量。公开证据显示 Stark
              有盈利、也在增长，但同一批来源仍留下最重要的模式问题：客户集中度、收入结构、损失率、对利率敏感的资金管理或沉淀资金经济性，以及加密业务等高风险垂直领域的确切占比。一家公司可能在支付量上显得很稳健，同时仍在少数客户、产品线或受监管活动中承受集中敞口。客户章节已经把这一点讲得很清楚：采用证据强，但耐久性证据仍不完整。


              执行风险同样重要，因为 Stark
              同时在多个方向扩张：更多客户、更多产品、更宽监管范围、更强营销、更多企业级预期，以及可能的国际化。创始人驱动的高强度执行在早期是资产；但如果管理流程、事故治理或合规职能没有随业务扩容，它也可能变成瓶颈。公开记录没有显示这里已经爆发危机，却也没有给出足以让投资人排除担忧的管理流程细节。


              因此，整体风险结论是可管理但重要。审阅到的问题没有哪一个今天明确击穿投资逻辑。放在一起，它们构成一套典型的成长型金融科技风险栈：监管边界、关键任务可用性、外部清算轨道依赖、欺诈 / 信贷 /
              拒付敞口、集中度不透明，以及执行拉伸。如果尽调能确认公司的控制、资产负债表纪律和组合质量已经强于公开资料呈现，投资案会明显改善。
