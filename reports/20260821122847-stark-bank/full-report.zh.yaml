      - number: '2.2'
        title: 规模测算口径与真实可服务市场
        blocks:
          - type: paragraph
            body: >-
              最宽的口径来自 EBANX 对官方数据的分析：巴西 Pix 交易金额 2025 年有望达到约 US$6.7T，12 月月交易笔数可能达到 7.9 billion。这个数字说明巴西支付基础设施具备全球重要性，但作为
              Stark 的总可用市场（TAM）太宽。Worldpay 的市场专项数据给出了更窄、更有用的口径：Pix 推出后，巴西账户到账户电商支出从 2020 年 US$3.6B 增至 2024 年
              US$35.3B。这仍不是全部企业机会，但说明一条 API 友好的支付轨道能多快从小众变成可变现数字商业场景中的默认选项。


              周期性和 B2B 场景构成最贴近 Stark 的扩张楔子。EBANX 估计巴西周期性支付市场约 US$50B/年，并称 Pix Automático 上线前两年内可能处理约 US$30B。EBANX 另有关于
              B2B 轨道的材料指出，Pix、PSE、SPEI 等账户到账户方式，已经贡献拉美部分商户 B2B 收入最高一半。这意味着 Stark 的可服务市场不止结账支付，还包括高频应收和应付流；在这些流里，重试逻辑、对账和
              ERP 集成才是关键。


              Stark 自身当前规模给了最后一层可获取市场（SOM）现实校验。公司来源称 2025 年经手 R$600B，2026 年中以前 12 个月 Pix 超过 R$670B，目标是 2026 年经手
              R$1T。这些数字来自公司披露，不是收入数字，但显示 Stark 已经在它关心的工作流层占据有意义的份额。正确结论不是 Stark 拥有 Pix
              市场，而是它已经嵌在足够大的可服务切片里，重要性成立，同时相对全国总轨道仍然很小。
