      - number: '6.2'
        title: 具名客户证明：生产使用可见，但常由公司自有证据呈现
        blocks:
          - type: paragraph
            body: >-
              最有说服力的公开客户证据来自具名案例，而不是汇总指标。Buser 案例显示，银行 API 自动化帮助公司一年内收入增长 30x、客户基数扩大 5x。Daki 案例把 Stark 的 Pix
              方案和更高审批通过率联系起来，并强调实时结算对速度敏感的生鲜杂货模式很关键。Ingresse 称，Stark 将付款速度提升了 80%，并用企业卡工作流支撑其财务运营。Simplic 案例突出 Pix 和
              boleto 带来的运营成本下降、逾期率降低。Familhão 称 Pix Automático 帮助续费率提升 85%，并减少流失。Vertem 案例强调，支付、卡和对账集中在同一个环境里。


              这些信号有分量，因为它们不只是罗列品牌标识：案例说明具体用例，也至少给出部分结果。不过，这些证据仍主要由公司撰写或经公司转述。投资人应把它们视为生产环境证据，说服力中到高，而不是独立审计。真正支撑可信度的，是多个案例反复出现同一组主题——收款更快、手工工作更少、可见性更强、审批更好，或留存更好——而不是中立第三方基准。


              更广义的客户证据也有短板。一些官方案例页只能靠阅读器抽取恢复，说明官网原生体验弱于底层内容。同时，解决方案页和媒体报道列出许多知名品牌标识，但品牌标识本身看不出 TPV
              份额、合同规模、留存，或关系是否在跨产品扩张。具名证据证明了真实使用；它还没有证明组合的耐久性。
