  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品面：围绕 API 搭建的企业财务运营层
        blocks:
          - type: paragraph
            body: >-
              理解 Stark 产品最干净的方式，是把它看成可编程企业财务层，而不是传统数字银行。技术文档展示了一个 REST API，覆盖
              Pix、boleto、卡、转账和银行。博客材料把这一运营面扩展到资金管理/固定收益产品、收单、Pix Automático、Bolepix
              和企业卡管理。从客户工作流看，平台意在把收款开具、结算监控、账单和税费支付、卡冻结或创建、事件对账、现金路由等人工财务任务，搬进客户自己的系统里，而不是让人去点击银行门户。

              这种产品打包重要，因为它把多个模块绑定到同一份集成契约。只要核心 API 和事件模型保持连贯，客户不必分别为
              Pix、boleto、转账编排或卡管理维护不同供应商关系。文档称，第一张发票大约五行代码即可创建，多数团队约两天完成集成，沙盒行为与生产环境一致。如果尽调证实这些说法，它们就是重要商业优势，因为很多企业财务团队只有在部署负担足够低、足以抵消迁移风险时，才会切换供应商。

              平台边缘也在继续变宽。本轮审阅的产品材料强调，借助 Pix Automático 做周期性 Pix 收款，借助 Bolepix 做 boleto 与 Pix
              混合收款，无中介收单，无限实体和虚拟企业卡，以及为余额提供固定收益停放。结果是一套既想做交易引擎、又想做其外围控制平面的系统。
