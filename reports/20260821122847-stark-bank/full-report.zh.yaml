  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：买方可以选专门玩家、既有机构，也可以自建
        blocks:
          - type: paragraph
            body: >-
              Stark 并不处在一个干净的同业集合里。同一个考虑 Stark 的财务团队，也可以买 Celcoin 这样的专门嵌入式金融平台、Cora 或 Conta Simples 这样的中小企业账户平台、Inter 或
              BTG Pactual 的综合银行产品、Stone 的商户金融组合，或者干脆继续用既有银行门户和重度电子表格的内部流程跑工作流。这一点重要，因为真正的比较是按任务来的：用 Pix 和 boleto
              收款、付供应商、发卡、对账、让余额产生收益，并用 API 把这些工作流暴露给内部软件。买方不需要另一个泛泛的“数字银行”；它需要降低关键资金流转的运营摩擦。

              最直接的重叠来自市场的专门玩家一端。Celcoin 用嵌入式金融模块、牌照和连接能力切基础设施层，卖给受监管和未受监管公司。Cora 与 Conta Simples
              切巴西企业的经营账户和财务运营层，尤其是想要更容易现金管理、免费 Pix、支出控制或信贷的中小和中型客户。Inter 与 BTG 带来品牌、资产负债表信任，以及越来越可见的 API 或 Pix
              Automático 能力。Stone 起点是商户收单和软件，但其支付、银行和信贷一体化栈，已经能替代部分经营账户。

              最后一个竞争者是现状。许多巴西公司仍忍受碎片化银行门户、人工 boleto 开具、电子表格对账和自建审批逻辑，因为切换核心财务运营有流程和信任风险。这意味着 Stark
              不仅要打败金融科技竞争对手，也要打败“够用就好”的既有工作流惯性。实际竞争问题因此是：Stark 的开发者优先产品，能否比既有机构和相邻专门玩家复制同一核心轨道更快，证明迁移工作流值得。
