  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础：企业财务买方，但存在多个分群口径
        blocks:
          - type: paragraph
            body: >-
              Stark
              的客户基础最好理解为一组运营复杂的巴西公司，而不是单一中小企业客户池。公开来源长期描述的客户包括航空公司、电商平台、出行公司、消费应用、加密公司和大型全国品牌。采购中心通常在财务或运营——CFO、资金团队、财务运营，或必须把资金流转嵌进软件工作流的产品/工程团队。用户往往是财务或支付团队；付款方是公司；战略价值来自去掉运营摩擦，而不是给创始人一个更好看的银行仪表盘。

              公开客户数披露很嘈杂，但方向上有用。Startups.com.br 报道 2022 年约有 500 个活跃客户。Exame 和 Valor 后来在 2023 年业绩期描述约 600 个客户；Bloomberg
              Línea 则称 Stark 在 2024/2025 年接近 800 个活跃客户。2026 年解决方案页把口径改写为超过 700 家公司，BP Money 称公司目标是 5,000
              家公司。这些数字没有矛盾到推翻故事；它们只是显示公开指标来自不同时间点和定义。正确结论是，Stark 已经获得有意义的企业采用，但“客户”、“活跃客户”和“公司”背后的准确分母仍需要尽调。

              分群结构比原始数量更重要。具名客户和案例指向交易密集型买方：Buser、Daki、Ingresse、Familhão、Simplic、Vertem、Loft、Localiza、Ultragaz、PetLove、Óticas
              Diniz、QuintoAndar、Ambev、iFood 和加密公司。这说明 Stark 最匹配关心规模化收款、付款、卡、对账或周期性计费的公司，而不是寻找免费账户的小企业。
