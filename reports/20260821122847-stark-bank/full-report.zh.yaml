  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型：先是高频支付，后是更宽的变现
        blocks:
          - type: paragraph
            body: >-
              Stark 的公开财务图景从交易量开始，而不是从披露收入开始。公司销售一组工作流，同时以几种方式变现：Pix、boleto、TED
              和类收单流的支付处理费；卡业务经济性，如适用场景下的交换费和信贷利差；客户余额停放在 Stark 产品中的资金管理或固定收益利差；以及与 Stark Infra
              和相邻产品绑定的基础设施或服务费。文档明确表示，资金流转按交易计价、没有月度最低消费，这强化了一个判断：支付频次和结构比席位数或经典 SaaS ARR 更重要。

              公开产品和访谈证据还显示，收入底座在变宽，而不是停留在单一 Pix 轨道处理商。管理层谈到卡信贷、固定收益产品、Open Finance 倡议，以及为其他机构提供基础设施服务。2025 年关于加密领域扩张的文章称
              Stark Infra 占收入 15%，同比增长
              200%，这一点重要，因为基础设施收入在运营上可能更粘，也比纯直接账户产品更少暴露于终端客户换银行的风险。尽管如此，公司并未披露精确收入结构、按产品的抽佣率（take
              rate）或各条收入流的毛利率，投资人只能看到变现机制，看不到每一项的准确质量。

              所以核心财务争论，是交易量如何转成耐久经济性。公开支付量披露很亮眼，但交易量本身可能掩盖低利润率资金流、客户折扣或对资金利差的依赖。正确框架是：Stark
              已证明高吞吐和至少一定盈利能力，但仍没有给出足以判断竞争和合规成本上升后利润可重复性的细粒度结构。
