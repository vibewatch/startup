      claimRefs:
        - CO011
  foundingLocation: São Paulo, Brazil
  headquarters: São Paulo, Brazil
  productSummary: >-
    API-first corporate-finance workflows including Pix, boleto, cards, transfers, bills and taxes,
    recurring Pix collections, receivables, treasury-adjacent products, and institutional
    infrastructure sold through Stark Infra.
  customerFocus: >-
    Mid-market and enterprise Brazilian companies, especially finance-intensive businesses with high
    collection, payout, reconciliation, or recurring-billing complexity; adjacent infrastructure
    demand also comes from fintechs and institutions.
  businessModel: >-
    Transaction-led monetization on money movement plus adjacent economics from cards, treasury,
    credit, and infrastructure services. Public materials explain the mechanisms, but current
    product-level revenue mix and margin contribution are not disclosed.
  stage: Late-stage private fintech
  fundingStatus: >-
    The last clearly evidenced public priced round remains the 2022 Series B of $45 million at
    about a $250 million valuation. Later public evidence shows a much larger operating business,
    but no credible public source reviewed in this run confirmed a 2025 or 2026 unicorn valuation.
