summary:
  headline: >-
    Stark Bank looks like a real, scalable, profitable corporate-finance platform, but the current
    valuation cannot be underwritten tightly from public evidence alone.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: unknown
  keyMetrics:
    valuationUsdM: 250
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 60
    customerCount: 800
    headcount: 100
  topStrengths:
    - >-
      Public evidence supports a rare fintech combination of strong product depth, meaningful named
      customer proof, and disclosed profitability rather than a pure scale-at-all-costs story.
    - >-
      Stark appears materially more developer-native than a generic business bank, with a coherent
      API surface, signed requests, signed webhooks, sandbox parity, and multi-language SDKs.
    - >-
      Brazil’s Pix- and Open-Finance-led market structure remains favorable for vendors that can
      package regulated money movement into enterprise workflows.
    - >-
      The company has likely grown far beyond its 2022 pricing snapshot, creating a plausible case
      for valuation uplift if current private metrics are strong.
  topRisks:
    - >-
      Public evidence does not confirm a current valuation, current revenue, margins, retention,
      concentration, or loss profile, so valuation precision is weak.
    - >-
      Regulatory perimeter remains the highest-severity risk because product ambition is expanding
      while broader licensing and prudential expectations remain live issues.
    - >-
      The business is mission-critical for customers, so severe uptime, webhook, settlement, fraud,
      or support failures could transmit quickly into trust and valuation.
    - >-
      Customer and segment concentration may be materially higher than logo count suggests, and the
      public record does not disclose top-customer economics or multi-product attach.
    - >-
      If current seller expectations already assume a unicorn price, the public record reviewed in
      this run does not support paying up with conviction.
  unresolvedGaps:
    - >-
      Current revenue, gross margin, contribution margin, and product-level take rates are not public.
    - >-
      NRR, GRR, customer concentration, segment mix, and multi-product attach are not public.
    - >-
      Chargeback, fraud, credit-loss, reserve, and funding-line metrics are not public.
    - >-
      The live status, scope, and expected timing of any broader banking-license process are not public.
    - >-
      No fresh post-2022 price discovery, term sheet, or secondary market context is available in the public record.
