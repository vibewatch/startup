companyProfile:
  summary: >-
    Stark Bank is a 2018-founded, São Paulo-based corporate-finance platform that packages Pix,
    boleto, cards, transfers, bill payments, treasury-adjacent products, and recurring-collection
    workflows behind a single API and a developer-first operating model. The public record supports
    a founder-led company centered on Rafael Stark, a 2022 Series B at roughly $250 million, a
    highly efficient growth story with disclosed profitability in 2023 and 2024, and a customer
    base that includes well-known Brazilian brands and finance-intensive platforms. The same record
    also shows a business still under-disclosed on current revenue mix, margins, concentration,
    loss rates, and live valuation.
  foundedDate: '2018-01-01'
  founders:
    - name: Rafael Stark
      role: Founder & Chief Executive Officer
      background: >-
        Public biographies describe Stark as an engineer who founded the company to automate
        corporate payments and finance operations in Brazil.
      claimRefs:
        - CO001
        - CO007
    - name: Davi Veloso
      role: Unverified public co-founder claim
      background: >-
