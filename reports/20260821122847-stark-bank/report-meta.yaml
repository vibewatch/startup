coverageNotes: >-
  Public evidence for this run supports a 2018 founding, São Paulo headquarters, a developer-first
  corporate-finance product, a last confirmed 2022 Series B at roughly $250 million valuation,
  R$155 billion of payment volume and R$71.5 million of net income in 2023, R$280 billion of
  payments and roughly R$50 million of net income in 2024, later 2025-2026 volume lenses up to
  R$600-670 billion, and meaningful named customer proof across Buser, Daki, Ingresse, Familhão,
  Simplic, and Vertem. Public sources do not confirm the user-supplied 2025/2026 unicorn round,
  do not disclose current revenue, gross margin, NRR, concentration, loss rates, or live price,
  and leave regulatory-perimeter and current valuation clarity as the main blockers.
