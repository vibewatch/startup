- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Docs and SDKs
    - Developer entry point and contract surface
    - Maintained repos and accurate docs
    - Docs can overstate ease if production edge cases differ
  - - ECDSA auth
    - Protect request integrity without shared API keys
    - Customer key management + signing libraries
    - Operational complexity if customers mishandle keys
  - - Webhook/event system
    - Real-time status propagation
    - Customer endpoint reliability + signature verification
    - Missed or misprocessed events can break workflows
  - - Sandbox parity
    - Shorten implementation cycles
    - Accurate environment mirroring
    - If parity breaks, deployment risk rises sharply
  - - Settlement and rail layer
    - Move money over Pix/TED/boleto/card rails
    - BCB rails and banking windows
    - Rail incidents or timing differences hit customer trust
  - - Support / traceability
    - Production debugging and high-volume onboarding
    - 24/7 support and structured logs
    - Support quality may become bottleneck at larger scale
  notes: Architecture is reconstructed only from public docs and SDKs; internal ledger and infrastructure details remain private.
