- id: SE003
  title: Reliability, compliance, roadmap, and product risks
  body: 'The strongest public trust signals come from the docs, regulator files, and status surfaces. Stark claims 99.99% uptime, sub-200ms median latency, Bacen Pix Grade A, PCI DSS 4.0.1, SOC 2, and ISO 27001. The BCB IQS file independently corroborates the Grade A Pix result, and the public status page at least shows that the company treats incident communication as a formal surface rather than an afterthought. Customer-facing case material also reinforces the operating-value proposition: Vertem highlighted centralizing payments, cards, and conciliation in one environment, while Simplic described lower manual work and better collection outcomes after adopting Stark Pix and boleto tools.


    The risks are also visible in what public surfaces do not show. The main website pages fetched during this run were much thinner than the docs, blog posts, or SDK READMEs, so much of the technical understanding depends on company-authored documentation rather than third-party benchmarks. Several official case subpages fetched as empty shells, which means customer proof is stronger in blog narratives than in canonical case-center pages. Package-registry pages were partially blocked, leaving GitHub and documentation as the primary developer-signal evidence. And despite the rich API surface, there is still no public deep architecture description of internal ledgering, resilience design, data partitioning, or release engineering.


    The correct product-tech verdict is positive but qualified. Stark looks meaningfully more developer-native and workflow-specific than many regional banking products, with strong public signals around authentication, sandbox parity, webhook design, and multi-language SDK support. But investors should still treat the internal reliability architecture, deployment success rate, and release/change-management discipline as diligence topics rather than as fully proven by public marketing.'
