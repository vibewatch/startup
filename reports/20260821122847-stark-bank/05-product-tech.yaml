- id: SE002
  title: Architecture, developer ergonomics, and operating model
  body: 'Public architecture evidence is unusually strong for a private fintech because Stark’s docs and SDKs expose the integration model in some detail. Authentication is based on ECDSA key pairs rather than shared API keys: the customer generates a private key, registers the public key in Stark’s web banking, and signs each request locally. The documentation emphasizes that write endpoints accept external IDs to make retries safe, that signed webhooks deliver status changes in real time, and that failed deliveries are retried with exponential backoff. This is not just a marketing surface; the Python and Java SDK READMEs also show webhook subscription resources, webhook event attempts, signature verification, transfer operations, bill payments, tax payments, and pagination/query primitives.


    Developer ergonomics appear to be a real design priority. The docs say official SDKs exist in nine languages, the sandbox is free and unlimited, and production support is available 24/7 for live customers. The GitHub repositories for Go, Python, Java, and Node confirm the multi-language maintenance posture, while package-manager installation snippets in the Python and Java SDKs show the repos are meant to be practical entry points rather than brochureware. Although package-registry pages were less readable in this run than GitHub and docs were, the combination of detailed technical docs plus maintained SDK repos is a meaningful developer signal.


    Operationally, the system depends on direct participation in Brazilian payment and regulatory rails. Settlement happens directly into a Stark account rather than an intermediary wallet; Pix settles in seconds 24/7; and other products follow rail-specific settlement windows. That means the architecture is not just frontend workflow software. It is tightly coupled to regulated money movement, which raises the importance of traceability, incident handling, and formal compliance controls.'
