      - number: '4.3'
        title: Capital adequacy, financing dependency, and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financial strength is one of Stark’s more attractive public attributes. The company repeatedly emphasized
              that it preserved much of the cash raised in prior rounds, disclosed profitability in 2023 and 2024, and
              said in 2025 that it was not fundraising simply to reset valuation optics. That matters because many
              high-growth fintechs require frequent external capital to sustain compliance, loss funding, or marketing.
              Stark’s messaging instead points to internal cash generation plus still-available historical capital.


              The caveat is that “capital light” is not the same thing as capital irrelevant. A company that issues
              cards, lends through an SCD, operates payment infrastructure, pursues broader regulatory permissions, and
              targets 5,000 companies and R$1 trillion of moved volume will still face capital needs: regulatory
              capital, liquidity buffers, technology resilience, customer support, and potentially credit-risk funding.
              The exact monthly burn rate, runway, and balance-sheet reserves are not public. Likewise, if bank-license
              approval expands the permitted product surface, it may also expand the capital base required to support
              that ambition.


              The financial verdict is therefore favorable but incomplete. Public evidence supports the view that Stark
              has crossed the important threshold from volume story to profitable operator, which lowers near-term
              financing risk. However, the absence of revenue mix, margin, cash, burn, credit-loss, and concentration
              data keeps the chapter from supporting a fully priced underwriting view. For investors, the business looks
              investable only if diligence can confirm that reported profitability is not being flattered by temporary
              spread conditions or a narrow cohort of high-volume customers.
