  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory perimeter is the top risk because brand ambition is ahead of legal certainty
        blocks:
          - type: paragraph
            body: >-
              The single biggest investment risk is regulatory, not market demand. Stark already operates inside
              regulated payment and credit structures, but public reporting has also shown the company seeking a broader
              banking license and continuing to expand product scope while that process remains unresolved. That matters
              because the company’s brand, product breadth, and customer promises increasingly resemble a full corporate
              bank, while the legal perimeter still depends on specific entity authorizations and compliance
              obligations. Any delay, condition, or adverse interpretation from the Banco Central do Brasil can raise
              cost, slow onboarding, constrain products, or force changes to operating design.


              The risk is amplified by the broader regulatory environment. Legal analyses reviewed in this run say
              Brazilian payment institutions face tighter authorization, governance, and Pix-security requirements after
              the 2025 rule changes. Public BCB participant files and the IQS report are positive signals—they show
              Stark inside formal payment infrastructure and achieving a strong Pix quality score—but they do not
              eliminate the strategic risk that regulation tightens faster than the company expands permissions. Put
              simply: current compliance may be adequate for today, while still being insufficient for tomorrow’s
              roadmap.


              The right way to score this is high severity but not thesis-breaking today. There is no public enforcement
              event in the reviewed sources, and the company appears methodical rather than reckless. Still, investors
              should not confuse absence of enforcement with absence of risk. A business built around regulated money
              movement can be harmed by slower approvals, tighter prudential rules, or obligations that raise
              cost-to-serve just as growth accelerates.
            claimRefs:
              - CR001
