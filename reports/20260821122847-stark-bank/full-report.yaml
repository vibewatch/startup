  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product surface: a corporate-finance operating layer built around APIs'
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to understand Stark’s product is as a programmable corporate-finance layer rather than a
              traditional digital bank. The technical documentation presents one REST API spanning Pix, boleto, cards,
              transfers, and banking. Blog material expands that operating surface with treasury/fixed-income products,
              acquiring, Pix Automático, Bolepix, and corporate-card management. In customer-workflow terms, the
              platform is meant to replace manual finance tasks—issuing collections, monitoring settlement, paying bills
              and taxes, blocking or creating cards, reconciling events, and routing cash—inside the customer’s own
              systems rather than through a human clicking around bank portals.


              That product packaging matters because it ties multiple modules to one integration contract. Customers do
              not need separate vendor relationships for Pix, boleto, transfer orchestration, or card management if the
              core APIs and event model stay coherent. The docs claim a first invoice can be created in about five lines
              of code, most teams finish integration in roughly two days, and the sandbox mirrors production behavior.
              Those assertions, if true in diligence, are important commercial advantages because many enterprise
              finance teams will only switch providers if the deployment burden is low enough to justify migration risk.


              The platform also appears to keep widening at the edge. Product material reviewed for this run emphasizes
              recurring Pix collection through Pix Automático, hybrid boleto-with-Pix collection through Bolepix,
              acquiring without intermediaries, unlimited physical and virtual corporate cards, and fixed-income parking
              for balances. The result is a system that wants to be both the transaction engine and the control plane
              around it.
