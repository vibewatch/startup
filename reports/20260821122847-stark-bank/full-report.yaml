      - number: '8.3'
        title: 'Recommendation: conditional interest only, with price discipline and hard diligence gates'
        blocks:
          - type: paragraph
            body: >-
              The resulting recommendation is not a clean “buy” or “avoid”; it is conditional. On company quality alone,
              Stark looks attractive: strong market, real product depth, real customers, profitability, and a plausible
              route to further expansion. On valuation discipline, however, the situation is unresolved because
              investors do not have enough public evidence to support a tight current fair-value estimate. The correct
              stance is therefore research-more or conditional interest rather than a blind chase.


              In practical terms, that means the entry price must do most of the work. A sub-unicorn valuation with
              evidence-backed improvements in customer durability, loss discipline, and regulatory progress could be
              compelling. A unicorn-plus ask supported mainly by management narrative and stale round history would be
              much harder to defend. The risk chapter also matters here: regulatory perimeter, uptime, concentration
              opacity, and balance-sheet products all deserve a valuation discount versus a cleaner software business.


              The final investment posture is medium confidence, high evidence sensitivity, and medium-high business
              quality. Stark belongs on an investor’s active list, but only with explicit diligence gates on revenue
              quality, concentration, losses, regulatory status, and current price. If those gates clear, the call can
              upgrade. If not, the safer action is to track rather than force precision.
