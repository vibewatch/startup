  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: what is and is not in scope'
        blocks:
          - type: paragraph
            body: |-
              The correct market boundary for Stark is not “Brazilian banking” in the abstract and not even “all Pix
              payments.” Stark’s product stack is centered on programmable corporate money movement: enterprise and
              platform collections, payouts, treasury routing, cards, banking API workflows, embedded-finance
              infrastructure, and Open Finance payment initiation. That means the relevant market includes the payment
              and workflow layers where a company can replace manual finance operations with API-controlled execution.
              It excludes most retail deposit gathering, household credit, branch distribution, wealth-management AUM,
              and long-duration lending that does not depend on Stark-like operational software.

              Brazil matters because the Pix rail compressed adoption cycles that elsewhere take years. Worldpay’s
              payments research and product documentation both frame Pix as real-time, 24/7, low-cost account-to-
              account infrastructure, while EBANX’s 2025 analysis argues that Brazil’s instant-payment system has become
              the fastest-growing example of mass-market adoption worldwide. In practice, this transforms the TAM from
              a vague “digital banking” story into a workflow market: every Brazilian company that must collect,
              disburse, reconcile, retry, and monitor payments is a potential buyer of automation.

              The other market-boundary insight is that national Pix volume is a necessary but insufficient sizing lens.
              Total rail volume includes consumer transfers, non-addressable flows, and payment categories that do not
              map cleanly to Stark’s pricing or attach points. Later valuation work therefore should treat national Pix
              value as an adoption ceiling, then step down to the serviceable layers where Stark actually sells product:
              corporate finance operations, recurring collections, embedded finance, and high-volume enterprise
              transaction orchestration.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM028
