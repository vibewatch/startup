      - number: '6.3'
        title: 'Durability, expansion, and concentration: the biggest customer questions are still private'
        blocks:
          - type: paragraph
            body: >-
              Public evidence strongly supports land-and-expand potential. The product surface allows a customer to
              start with one workflow—Pix, boleto, cards, or payouts—and then add treasury, recurring payments,
              acquiring, or infrastructure services later. Customer narratives reinforce this pattern because they
              repeatedly describe operational pain first and a wider control plane second. That dynamic can produce
              durable accounts if Stark becomes embedded in ERP, billing, payout, and approval loops.


              But the public record is still thin on the durability metrics investors actually want: NRR, GRR, churn,
              contract length, renewal rates, cohort expansion, or even basic segmentation of customer count by size and
              industry. Familhão’s 85% renewal lift and Simplic’s lower delinquency are good point proofs, yet they do
              not tell us whether Stark retains revenue across the full portfolio. Nor do we know how concentrated TPV
              or revenue is among a handful of very large logos. For a high-volume payments platform, concentration risk
              can matter more than customer count.


              The safest read is that Stark has clearly found repeatable fit with finance-intensive corporates, but the
              portfolio-quality debate is unresolved. Investors need to know which customers are pilot-like versus
              deeply embedded, how many use more than one product, whether the crypto and enterprise segments behave
              differently, and whether large logos represent durable recurring revenue or merely episodic high TPV.
              Those are the key blockers between “real adoption” and “underwritable customer quality.”
