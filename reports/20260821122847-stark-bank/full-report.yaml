      - number: '1.2'
        title: Founder, leadership, and governance path
        blocks:
          - type: paragraph
            body: |-
              Publicly available founder evidence centers overwhelmingly on Rafael Stark. Exame, Valor, Bloomberg
              Línea, IPO Ventures, and Y Combinator all identify him as founder and CEO; available biographical
              material describes him as an engineer trained at ITA with Stanford entrepreneurship exposure who built
              Stark after encountering manual banking workflows and fraud-prone payment processes. None of the public
              sources reviewed for this run corroborated the user-supplied claim that Davi Veloso is a co-founder, so
              later diligence should treat that point as unverified rather than canonical.

              The company has historically run with a lean team relative to payment volume. Valor and Exame reported
              almost 90 employees around the 2023-results disclosure, while Bloomberg Línea said the 2023 net profit
              of R$71.5M was produced with 80 staff and that the team had expanded to 100 employees in 2024, with
              about 30% in technology. Third-party databases produce even noisier figures. The correct take is not
              that Stark is tiny or huge, but that public headcount disclosure is inconsistent and should be treated
              as approximate. That matters because the company’s narrative of capital efficiency relies on a very high
              payments-per-employee ratio.

              Governance is also in transition. Stark today operates through at least two regulated entities in public
              BCB records: Stark Sociedade de Crédito Direto (since 2021) and Stark Bank S.A. as an Instituição de
              Pagamento (since November 2024). Management has also discussed a payment-initiation license in Open
              Finance and the longer-term ambition to obtain a full banking license. This patchwork can be read two
              ways: positively, as evidence that the company is broadening regulatory permissions methodically; or
              adversely, as proof that the corporate banking brand is still ahead of the legal perimeter it ultimately
              wants to occupy. That regulatory catch-up is one of the central governance themes of the report.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO027
              - CO029
              - CO031
              - CO040
