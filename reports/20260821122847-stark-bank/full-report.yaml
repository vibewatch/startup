      - number: '7.3'
        title: Model, customer, and execution risks remain under-disclosed even with strong public momentum
        blocks:
          - type: paragraph
            body: >-
              The final risk cluster is financial and portfolio quality. Public evidence suggests Stark is profitable
              and growing, but the same sources leave open the most important model questions: customer concentration,
              revenue mix, loss rates, reliance on rate-sensitive treasury or float economics, and the precise share of
              high-risk verticals such as crypto. A company can look robust on payment volume while still carrying
              concentrated exposure in a handful of customers, product lines, or regulated activities. The customer
              chapter showed this clearly: adoption proof is strong, but durability proof remains partial.


              Execution risk also matters because Stark is scaling across several fronts at once: more customers, more
              products, broader regulation, more marketing, more enterprise expectations, and possible
              internationalization. Founder-led intensity is an asset in early stages, but it can become a bottleneck if
              management processes, incident governance, or compliance functions fail to widen with the business. The
              public record does not show a crisis here, yet it also does not offer the management-process detail that
              would let an investor dismiss the concern.


              The overall risk verdict is therefore manageable but material. None of the reviewed issues alone clearly
              breaks the thesis today. Together, however, they create a classic growth-fintech risk stack: regulatory
              perimeter, mission-critical uptime, external rail dependency, fraud/credit/chargeback exposure,
              concentration opacity, and execution stretch. The investment case improves dramatically if diligence can
              confirm that the company’s controls, balance-sheet discipline, and portfolio quality are already stronger
              than the public package can show.
