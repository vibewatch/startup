  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Investment thesis and anti-thesis: strong business quality, weak pricing visibility'
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is easy to articulate. Stark has real payment scale, public profitability, credible
              enterprise customer proof, strong developer-first product evidence, and exposure to one of the most
              structurally attractive payment transitions in the world. It is not a concept-stage API bank. It has
              processed hundreds of billions of reais, disclosed profit in 2023 and 2024, won recognizable corporates,
              and built a technical surface that appears materially stronger than many generic business-banking
              competitors. If the company can keep converting workflow depth into higher-quality recurring economics,
              the business may be worth meaningfully more than the last public 2022 mark.


              The anti-thesis is equally clear: valuation risk is dominated by missing price discovery and missing
              underwriting inputs. The last credible public priced round remains the 2022 Series B at about a $250
              million valuation. Since then, public evidence supports a much larger operating business—but not a new
              market-clearing valuation. The user-supplied 2025 unicorn narrative was not corroborated in the accessible
              public record. Without current revenue, gross margin, retention, concentration, or live term-sheet data,
              any attempt to call the company a bargain or overvalued at a specific number is fragile.


              That leaves a price-sensitive conclusion. Stark may well deserve a substantial step-up from the 2022 mark
              because the business has matured operationally. But public evidence does not support underwriting a
              unicorn entry price with conviction. The investment case improves when price expectations remain below
              that threshold or when diligence can prove that current profitability, retention, and regulatory readiness
              are materially stronger than public evidence alone can show.
            claimRefs:
              - CV001
              - CV002
