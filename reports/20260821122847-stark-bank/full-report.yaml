      - number: '6.2'
        title: 'Named customer proof: production usage is visible, but often through company-authored evidence'
        blocks:
          - type: paragraph
            body: >-
              The most compelling public customer evidence comes from named case studies rather than aggregate metrics.
              The Buser case says banking API automation helped the company increase revenue 30x in one year and expand
              its customer base 5x. The Daki case ties Stark’s Pix solution to better approval rates and emphasizes
              real-time settlement for a speed-sensitive grocery model. Ingresse says Stark improved payment speed by
              80% and helped its finance operation through corporate-card workflows. The Simplic case highlights lower
              operational cost and lower delinquency using Pix and boleto. Familhão says Pix Automático helped lift
              renewals by 85% and reduce churn. Vertem’s case stresses centralization of payments, cards, and
              conciliation in one environment.


              Those are strong signals because they go beyond logo drops: they specify use cases and at least some
              outcomes. However, they are still largely company-authored or company-mediated proofs. Investors should
              treat them as production-evidence with medium-to-high persuasive value, not as independent audits. The
              supporting credibility comes from the recurrence of the same themes across multiple cases—faster
              collection, lower manual work, more visibility, better approvals, or better retention—not from neutral
              third-party benchmarking.


              The broader customer-proof surface is also mixed. Some official case pages were recoverable only through
              reader extraction, which means the canonical site experience is weaker than the underlying content.
              Meanwhile, the solutions page and press coverage list many recognizable logos, but logos alone do not
              reveal TPV share, contract size, retention, or whether a relationship is expanding across products. Named
              proof establishes real usage; it does not yet establish portfolio durability.
