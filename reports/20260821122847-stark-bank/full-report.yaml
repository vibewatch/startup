      - number: '2.3'
        title: Buyer map, adoption path, and budget ownership
        blocks:
          - type: paragraph
            body: |-
              The buyer is usually not a retail-banking customer or even a generic SMB owner. Stark’s natural buying
              center is the finance organization of a company that has already felt scaling pain: CFOs, treasurers,
              controllers, heads of finance operations, and payments leads. The technical user is often an engineering
              or product team because API integration, approval rules, and webhook handling sit inside software
              systems, not just web banking. The payer remains the company; the users are internal finance and
              operations staff; the budget owner usually sits with finance or occasionally with a platform/business unit
              that directly owns payment conversion.

              Adoption usually starts with one painful workflow rather than a full-bank replacement. For some buyers it
              is collections via Pix or boleto with reconciliation. For others it is supplier payouts, cards and spend
              controls, or recurring collections via Pix Automático. Once an integration is in place, the expansion path
              becomes clear: direct settlement, payment initiation, recurring logic, treasury products, and eventually
              embedded-finance infrastructure. That land-and-expand dynamic is one reason the market can support a
              specialist API bank even alongside large incumbents.

              Stark Infra creates a second buyer universe adjacent to the first. Here the buyer is not a corporate
              treasury team but a fintech, bank, or platform that wants RSFN/Pix infrastructure without building it from
              scratch. This adjacency matters strategically: it deepens Stark’s relevance to the financial ecosystem,
              but it also exposes the company to a more infrastructure-like market where reliability, authorization, and
              pricing discipline matter even more than brand or relationship banking.
            claimRefs:
              - CM016
              - CM018
              - CM019
              - CM020
              - CM021
              - CM029
              - CM030
