chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and business model
        blocks:
          - type: paragraph
            body: |-
              Stark Bank presents itself as a developer-first corporate bank for growing companies, with a product
              surface organized around money movement rather than branch-based relationship banking. The official
              documentation describes a single REST API for Pix, boleto, card, transfer, and banking workflows; the
              same source also claims that integrations typically complete in about two days, that requests are
              authenticated with customer-managed ECDSA key pairs instead of shared API keys, and that received funds
              settle directly into a Stark account instead of an intermediary wallet. This architecture matters because
              it positions Stark less as a consumer neobank and more as programmable finance infrastructure for finance
              teams, treasury teams, platforms, and operationally complex Brazilian companies.

              Press reporting and company-authored material consistently describe the customer problem as manual,
              error-prone back-office finance: invoice issuance, supplier payouts, payroll-adjacent transfers,
              receivables tracking, and card-spend controls. Rafael Stark has repeatedly framed the product around
              eliminating human bottlenecks in high-volume payment operations, and the customer-facing solution set
              reflects that thesis: Pix invoice and QR collection, boleto issuance and payment, TED and Pix payouts,
              utility and tax payments, corporate cards, fixed-income treasury products, and increasingly Open Finance
              payment initiation. The TAM logic for later chapters therefore starts with Brazilian corporate payments
              and treasury automation, not with retail banking balances.

              The official docs and 2026 blog material indicate that the platform had moved R$600B in 2025, while Ti
              Inside and Portal Tela cited more than R$670B of Pix volume over the prior 12 months in mid-2026. Those
              figures are company-claimed and use slightly different lenses, but they support the same strategic read:
              Stark has achieved real operating scale on top of the Pix rail and now competes for larger enterprise
              payment flows, not just startup accounts. The current public positioning is therefore a hybrid of API
              bank, payment processor, and treasury orchestration layer.
