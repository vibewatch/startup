  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer base: enterprise finance buyers, but multiple segment lenses'
        blocks:
          - type: paragraph
            body: >-
              Stark’s customer base is best read as a set of operationally complex Brazilian companies rather than a
              monolithic SMB pool. Public sources over time describe customers that include airlines, marketplaces,
              mobility companies, consumer apps, crypto firms, and large national brands. The buying center is usually
              financial or operational—CFOs, treasury teams, finance operations, or a product/engineering group that
              must embed money movement in a software workflow. The user is often a finance or payments team; the payer
              is the company; and the strategic value comes from removing operational friction rather than from giving
              founders a prettier bank dashboard.


              Public customer-count disclosures are noisy but directionally useful. Startups.com.br reported about 500
              active clients in 2022. Exame and Valor later described roughly 600 clients in the 2023-results period,
              while Bloomberg Línea said Stark had nearly 800 active clients in 2024/2025. The 2026 solutions page
              reframed the lens as more than 700 corporations, and BP Money said the company was targeting 5,000
              companies. These are not contradictory enough to discredit the story; they simply show that public metrics
              come from different moments and definitions. The right conclusion is that Stark has achieved meaningful
              corporate adoption, but the exact denominator behind “clients,” “active clients,” and “corporations” still
              needs diligence.


              The segment mix matters more than the raw count. Named customers and cases point toward
              transaction-intensive buyers: Buser, Daki, Ingresse, Familhão, Simplic, Vertem, Loft, Localiza, Ultragaz,
              PetLove, Óticas Diniz, QuintoAndar, Ambev, iFood, and crypto-related firms. This suggests Stark’s
              strongest fit is with companies that care about collections, disbursements, cards, reconciliation, or
              recurring billing at scale, not with small businesses seeking a free account.
