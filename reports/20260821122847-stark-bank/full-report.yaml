        title: Exhibits
        blocks:
          - type: callout
            title: Brazil’s rail shift is real, not theoretical
            body: |-
              Pix’s scale, A2A e-commerce growth, and recurring-payment innovation mean Stark is riding one of the
              strongest structural payment transitions globally. The market no longer needs to be convinced that real-
              time account-to-account payments can work at scale in Brazil.
