- id: SR002
  title: Operational, security, and partner dependencies are the second major risk cluster
  body: 'Stark’s product promise depends on always-on operational quality. Its public positioning emphasizes direct settlement, real-time webhooks, automated reconciliation, 24/7 support, and sub-second-to-seconds responsiveness across critical flows. That is valuable, but it also creates a narrow tolerance for failure. A collections or payout vendor can survive minor UI flaws; a company running treasury, recurring collections, acquiring, cards, and Pix through the same provider becomes highly sensitive to downtime, failed webhook delivery, settlement delays, fraud, and incident handling. Public status surfaces and the IsDown incident history show the company does encounter operational events, even if the broader track record still looks solid.


    Security and product-adjacency risk also rise as Stark widens its scope. The card acquiring page highlights chargeback management and 3DS 2.0, the corporate card page highlights tokenization, the credit-line page promises much larger limits, and the crypto page introduces treasury exposure to digital assets. Each of those surfaces can be attractive commercially while also adding distinct risk vectors: merchant disputes, fraud, credit underwriting, reserve needs, and reputational contagion from crypto volatility or compliance issues. Public docs prove the company knows these risks exist; they do not quantify how well losses and controls behave in production.


    The dependency chain is also external. Stark depends on BCB-managed rails, customer implementation quality, legal interpretations, and its own support operations. That means a large incident or regulatory event can transmit quickly into customer trust and retention. The main mitigation is that the company appears technically serious; the main unresolved question is whether its internal resilience and control systems are already scaled for the next order of magnitude.'
