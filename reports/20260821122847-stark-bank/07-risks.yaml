    - Re-rate growth and valuation assumptions downward
  - - Operational reliability
    - Sustained severe incidents
    - Repeated multi-hour production issues or webhook failures
    - Pause aggressive growth assumptions until reliability improves
  - - Fraud / credit exposure
    - Loss metrics deteriorate
    - Chargebacks, fraud losses, or reserves spike beyond plan
    - Treat profitability as less durable
  - - Customer concentration
    - Top-customer exposure too high
    - One or few logos dominate TPV / revenue
    - Discount retention and downside resilience
  - - Execution stretch
    - Support or onboarding breaks at scale
    - Cycle times or implementation failures worsen materially
    - Assume slower adoption and higher cost-to-serve
