  topStrengths:
    - 公开证据支持一种少见的 fintech 组合：产品深度够、具名客户验证有分量，也披露了盈利，而不是单纯靠不计代价换规模。
    - Stark 明显比普通企业银行更贴近开发者，API 体系连贯，请求和 webhook 都有签名，沙盒与生产环境保持一致，并提供多语言 SDK。
    - 巴西由 Pix 和 Open Finance 牵引的市场结构，仍利好能把受监管资金流封装进企业工作流的供应商。
    - 公司规模很可能已远超 2022 年定价快照；只要当前私有指标够强，估值上修就有合理依据。
  topRisks:
    - 公开证据无法确认当前估值、收入、利润率、留存、集中度或亏损情况，因此估值精度偏弱。
    - 监管边界仍是最重大的风险：产品野心在扩张，更广泛牌照和审慎监管要求仍是悬而未决的问题。
    - 这门生意嵌在客户关键流程里，若可用性、webhook、清算、欺诈或支持出现严重故障，信任和估值会很快受冲击。
    - 客户和细分市场集中度可能明显高于 logo 数量呈现的表象；公开记录没有披露头部客户经济性或多产品绑定情况。
    - 如果当前卖方预期已按独角兽价格定锚，本轮审阅的公开记录不足以支撑高价买入的信心。
  unresolvedGaps:
