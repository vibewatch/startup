- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue and gross margin
    - Product-level revenue and gross profit
    - Needed to support any current valuation
    - Finance diligence / management data room
  - - Retention and attach
    - NRR, GRR, logo churn, multi-product attach
    - Separates strong logos from durable economics
    - RevOps / customer analytics
  - - Concentration
    - Top-customer TPV and revenue share
    - Determines downside resilience
    - Finance / customer analytics
  - - Losses and reserves
    - Chargebacks, fraud losses, credit losses, reserves
    - Tests profit durability
    - Risk / finance
  - - Regulatory status
    - Live bank-license scope, timing, and conditions
    - Largest strategic risk factor
    - Legal / compliance / counsel
  - - Current pricing expectations
    - Term-sheet or secondary price context
    - Recommendation is price-sensitive
    - Investment team / broker / seller
  notes: These diligence asks are the minimum needed to convert public interest into an invest/not-invest decision.
