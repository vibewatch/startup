- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Current ask near or above unicorn valuation with no new hard proof
    - Price > public-evidence support
    - Removes margin of safety
    - Downgrade to track / pass
  - - Regulatory setback
    - Material license delay or restrictive condition
    - Weakens growth and trust assumptions
    - Re-rate base case downward
  - - Operational reliability deterioration
    - Repeated severe incidents
    - Hurts customer durability and premium-multiple logic
    - Pause investment
  - - Loss or concentration surprise
    - Major exposure to a few customers or rising losses
    - Undermines profit-quality story
    - Demand steeper discount
  - - Weak diligence on retention or attach
    - Low multi-product expansion or poor retention
    - Reduces premium to 2022 anchor
    - Move toward bear case
  notes: Kill triggers connect diligence outcomes directly to portfolio action.
