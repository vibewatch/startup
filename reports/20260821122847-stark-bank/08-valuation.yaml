- id: SV002
  title: 'Valuation context: last public mark is old, but the company is bigger than it was then'
  body: 'The strongest hard anchor is still the 2022 Series B. Public funding coverage consistently described Stark as raising $45 million at about a $250 million valuation, with participation from Ribbit Capital and Bezos Expeditions. The same period included founder commentary that the company was “close” to unicorn status conceptually, but not actually at a unicorn valuation. That distinction matters because it shows why narrative can outrun price. The company has since grown volume and product breadth meaningfully, but the public record still lacks a fresh priced financing event.


    A reasonable valuation process therefore has to triangulate rather than interpolate. Public-company comps such as Stone, PagBank, and Banco Inter show how large Brazilian listed finance platforms can become in clients, deposits, revenue, and profit. Stark is clearly much smaller than those businesses in absolute scale and balance-sheet depth, but public sources also imply it is unusually efficient relative to team size and niche focus. Meanwhile, market trackers and general unicorn lists provide no credible public confirmation that Stark itself crossed $1 billion in 2025 or 2026. The most conservative read is that the company has outgrown its last public mark, but the most aggressive read—a confirmed unicorn—remains unproven.


    That points toward a bounded range rather than a single price target. If diligence validates retention, concentration, and regulatory progress, a significant premium to the 2022 round is justifiable. If the current seller expectation already assumes unicorn-level status without new hard evidence, the margin of safety disappears.'
  claimRefs:
