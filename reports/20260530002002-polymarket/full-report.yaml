companyProfile:
  summary: >-
    Polymarket is a New York-founded prediction market platform where users trade tokenized outcome contracts priced as
    crowd-implied probabilities on Polygon. Since its 2022 CFTC settlement, the company has rebuilt toward a dual-track
    model: a global non-custodial crypto venue plus a CFTC-regulated US pathway through QCX LLC, while also adding fee
    monetization, ICE-distributed data products, and a deeper institutional interface. The central diligence question is
    not whether Polymarket has product-market fit, but whether reported volume, fee durability, market-integrity
    controls, and governance transparency are strong enough to justify the step-up from a $9 billion completed mark
    toward much higher 2026 targets.
