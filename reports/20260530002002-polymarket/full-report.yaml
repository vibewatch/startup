  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Polymarket's valuation history compresses five years of capital formation into three transformative
              rounds. The company raised a seed and Series A between 2020 and 2022 with participation from Founders
              Fund, Blockchain Capital, General Catalyst, Polychain Capital, and Vitalik Buterin, but disclosed minimal
              valuation or terms information publicly. The pivotal event was Intercontinental Exchange's October 2025
              direct equity investment of $1 billion, which established a post-money valuation of $9 billion and gave
              ICE approximately 17% of outstanding shares (11% fully diluted). ICE simultaneously became the exclusive
              global distributor of Polymarket's event-driven data to institutional investors, transforming the
              relationship from capital partner to strategic infrastructure provider.

              By January 2026, Polymarket's secondary market implied valuation reached $11.6 billion, reflecting the
              platform's US relaunch in December 2025 and rapid fee revenue anticipation. On March 27, 2026, ICE
              announced a second direct cash equity investment of $600 million as part of Polymarket's Series E
              fundraising round, alongside plans to purchase up to $40 million of securities from existing holders in
              the secondary market. This transaction fulfilled ICE's total commitment of approximately $2 billion and
              increased ICE's stake to approximately 23% of outstanding shares (14% fully diluted). The Series E is
              targeting a post-money valuation of approximately $20 billion, representing a 122% increase from the
              October 2025 mark in under six months—one of the fastest major late-stage valuation step-ups on record in
              fintech. In April 2026, reports indicated Polymarket was in discussions for an additional $400 million
              raise at approximately $15 billion, suggesting some moderation from the $20 billion target amid ongoing
              fee and compliance normalization.

              The entry price justification from ICE's perspective rests not on trailing revenue multiples but on
              strategic positioning: prediction market data is increasingly cited by institutional investors as a
              real-time geopolitical and economic signal, and ICE's distribution infrastructure enables embedding
              Polymarket probabilities directly into financial data terminals and institutional workflows. The terms and
              liquidation preferences of the preferred stack are not publicly disclosed, and no audited financial
              statements, gross margin, or burn rate data have been made available by Polymarket. This opacity is the
              single largest impediment to precise valuation underwriting for secondary or co-investment decisions.
