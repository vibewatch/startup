              The March 30 fee launch immediately validated the platform's monetization potential. DefiLlama data showed
              daily fees rising from $363,000 on March 31 to over $1 million on both April 2 and April 3, 2026. Retained
              revenue (after maker rebates) reached $995,000 on April 2 and $899,000 on April 3. Based on the $9.55
              billion 30-day rolling volume at launch, analysts projected a blended daily revenue of $800,000–$1
              million, implying approximately $25 million monthly and $300 million annualized. By comparison, competitor
              Kalshi reported an annualized run rate of $1.5 billion as of early 2026, indicating Polymarket's fee
              revenue is growing rapidly but has further scale to capture, particularly as Polymarket US (the
