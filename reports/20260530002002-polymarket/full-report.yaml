  - id: FI001
    title: Revenue Model Bridge — From User Activity to Gross Profit
    type: flow
    layout: standard
    summary: >-
      Illustrates how user trading activity flows through Polymarket's fee architecture into gross fee revenue and net
      retained revenue, incorporating maker rebates and Treasury yield.
    data:
      nodes:
        - id: user-trade
          label: User Executes Taker Trade
          description: Taker pays probability-based fee; fee = C × p × feeRate × (p(1-p))^exp
        - id: gross-fee
          label: Gross Taker Fee Collected
          description: ~0.7% blended rate on GMV; peaks at 1.80% for crypto near 50% prob
        - id: maker-rebate
          label: Maker Rebate Distributed
          description: 20–50% of taker fee returned to liquidity providers in daily USDC
        - id: net-fee-revenue
          label: Net Fee Revenue Retained
          description: Remaining ~50–80% of gross taker fees; ~$15–22M estimated monthly (Apr 2026)
        - id: treasury-yield
          label: Treasury USDC Yield
          description: Deposited user collateral earns >4% APY; net yield above 4% paid to users
        - id: gross-profit
          label: Gross Profit Pool
          description: Net fees + net Treasury yield; funds operating expenses and POLY staking (future)
      edges:
        - from: user-trade
          to: gross-fee
        - from: gross-fee
          to: maker-rebate
        - from: gross-fee
          to: net-fee-revenue
        - from: net-fee-revenue
          to: gross-profit
        - from: treasury-yield
          to: gross-profit
    approximationNotes: >-
      Node values are estimates based on analyst projections as of March–April 2026. Maker rebate percentages vary by
      category (20–50%). Treasury yield net margin is undisclosed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI010
      - CI011
