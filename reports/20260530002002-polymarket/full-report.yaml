  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Trader Segmentation & User Base
        blocks:
          - type: paragraph
            body: >
              Polymarket's user base spans four broadly distinguishable segments that differ substantially in behavior,
              volume contribution, and retention profile. Casual retail traders—the largest segment by head count—are
              primarily event-driven participants who join during politically or culturally significant moments such as
              elections, major sporting contests, or breaking geopolitical events. This segment accounts for the bulk of
              new sign-up surges, such as the 45% first-time-user cohort recorded in Q4 2024, but demonstrates the
              weakest multi-month retention and relies on a straightforward mobile or web interface rather than the CLOB
              API. Power retail traders maintain more diversified market positions across political, crypto, sports, and
              AI categories; this cohort exhibits meaningfully higher 30-day retention and represents the core of
              Polymarket's recurring non-event volume. The algorithmic and bot segment—concentrated around the Builder
              Program's ranked leaderboard—drives the majority of programmatic order flow; the top bot Betmoar alone
              routed $1.34 billion in cumulative volume, roughly 42% of all attributed Builder Program activity.
              Finally, a small institutional tier of quant desks and market-making firms (including reported
              participants such as Jump Trading and Susquehanna) provides depth and tight spreads on flagship election
              and finance markets. Geographically, international users dominate: Polymarket operates in 160+ countries,
              and April 2026 data shows the international platform generating $9 billion in monthly volume versus $1.3
              billion for the CFTC-regulated US product. The core user profile is crypto-native, requiring USDC
              stablecoin deposits and Polygon wallet management—creating meaningful friction for non-crypto-experienced
              retail.
