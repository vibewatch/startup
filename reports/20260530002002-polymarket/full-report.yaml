            body: >
              Retention data is mixed and skewed by election cycles. The strongest available figure is a 65% 30-day
              retention rate for the Q4 2024 sign-up cohort, which Polymarket outperformed over 85% of comparable DeFi
              and crypto trading protocols. However, post-election 60% volume declines show sharp churn among
              event-driven casual users. App store satisfaction diverges sharply by platform: the iOS app carries
              approximately 4.7 out of 5 stars from more than 30,000 reviews, while the Android app sits at roughly 2.2
