              $143 million in anomalous profits extracted by informed traders over a two-year period, representing a
              transfer from uninformed retail participants to those with material non-public information. These findings
              are highly material to retention because they undermine the "wisdom of the crowd" signal quality, reduce
              trust among retail losers, and expose the platform to regulatory enforcement action. Polymarket has
              responded with a 2026 fee structure intended to deter wash trading economically, and with market integrity
