      - number: '1.5'
        title: Regulatory and Legal Landscape
        blocks:
          - type: paragraph
            body: >-
              Polymarket's regulatory trajectory from 2020 to 2026 is one of the central diligence narratives for the
              company. The 2022 CFTC enforcement action—a $1.4 million civil penalty and cease-and-desist order for
              operating an unregistered derivatives platform—forced US user geoblocking and operational restructuring
              that ultimately led to the QCEX acquisition and December 2025 relaunch as a federally regulated Designated
              Contract Market.

              The path to re-compliance: $1.4 million CFTC settlement (January 2022); Giancarlo advisory board
              appointment (May 2022); QCEX acquisition for $112 million (July 2025); CFTC no-action relief letter
              (September 2025); CFTC Amended Order of Designation (November 2025); US relaunch (December 2, 2025). The
              DOJ and CFTC closed their parallel investigations into whether Polymarket allowed US users to bet on the
              2024 election without charges in July 2025—sequenced approximately four weeks before the QCEX acquisition
              announcement, de-risking that transaction.

              Federal legality does not eliminate state-level exposure. As of May 2026, Polymarket faces active
              litigation in Massachusetts (QCX LLC v. Campbell, filed February 10, 2026), Michigan (QCX LLC v. Nessel,
              W.D. Mich. No. 1:26-cv-00710, filed March 4, 2026), and threats from Rhode Island, Nevada, and other
              states. The core legal question—whether CFTC jurisdiction preempts state gambling laws— has not been
              definitively resolved. State courts have ruled in favor of state authority in related Kalshi cases;
              Polymarket argues the Supremacy Clause and CEA require CFTC-exclusive jurisdiction.

              On April 23, 2026, SDNY unsealed an indictment against US Army Special Forces Master Sergeant Gannon Ken
              Van Dyke for allegedly using classified military information about Operation Absolute Resolve to place
              $33,000 in bets on Polymarket, earning approximately $409,881 in profits. This case—the CFTC's first
              insider trading action involving event contracts—signals intensifying scrutiny of prediction market
              participants. A separate adverse finding from Fortune magazine in 2024 reported that up to one-third of
              Polymarket's volume may consist of wash trades; Polymarket declined to comment. Internationally, France,
              Belgium, Australia, Singapore, and other jurisdictions maintain access restrictions. Current CFTC Chairman
              Michael Selig has publicly aligned with prediction markets over state regulators, providing favorable
              federal posture Polymarket cites in state suits.
