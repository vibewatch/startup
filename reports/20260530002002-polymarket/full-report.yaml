      - number: '8.5'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Polymarket's exit readiness is materially enhanced by the ICE relationship, which provides the two most
              important preconditions for an IPO: institutional credibility and financial infrastructure. ICE is the
              parent of NYSE, the world's largest exchange, and its ongoing investment positions Polymarket as a partner
              rather than a startup seeking a traditional underwriter. A tentative IPO timeline referenced in secondary
              market materials points to late 2026, which would align with the POLY token launch and provide a dual
              public-markets and token liquidity event. However, Polymarket has not filed an S-1, has not publicly
              disclosed audited financials, and has not announced a specific listing exchange. The absence of these
              preconditions makes a late-2026 IPO ambitious but not implausible.

              The POLY token airdrop (confirmed in principle by the CMO, with trademark applications for "POLY" and
              "$POLY" filed in 2026) introduces a significant cap table complication for equity investors: if the token
              is structured as a revenue-sharing or governance instrument, it could redirect fee revenues to token
              holders rather than equity shareholders, diluting the economic value of the equity stake. No public
              disclosure of token economics, vesting schedules, or the allocation between equity and token holders has
              been made.

              Founder Shayne Coplan is estimated to hold approximately 11% of Polymarket personally post-Series E,
              representing a stake valued at approximately $1–2.2 billion at the Series E range. Early investors and
              employees benefited from secondary purchases included in ICE's $40 million secondary transaction. This
              creates partial liquidity overhang relief but also signals that insiders have taken some chips off the
              table at current valuations—a standard observation at this stage but material when combined with the
              volume of ongoing regulatory uncertainty.

              Critical diligence asks for any investor considering entry at the current valuation include: audited 2025
              financial statements (revenue, gross margin, EBITDA, burn), the complete waterfall and liquidation
              preference stack, POLY token economic structure (equity vs. token revenue split), the ICE master data
              licensing agreement terms and renewal rights, and an independent audit of wash trading removal since fee
              introduction. Without these, a precise underwriting of fair value is impossible and track is the
              appropriate posture.
