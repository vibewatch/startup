  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    notes: >-
      Triggers are observable market or regulatory events; thresholds are illustrative monitoring points, not formal
      investment covenants. Severity levels are qualitative assessments.
    columns:
      - Trigger
      - Observable Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Platform-level CFTC/DOJ enforcement action
        - Polymarket receives Wells notice, cease-and-desist, or indictment (not individual trader)
        - Immediate DCM license suspension risk; trading halt; equity value to near zero
        - Full exit / immediate divestment; no mitigation available
      - - Monthly fee revenue sustained below $15M for 3+ months
        - Verified on-chain data showing fees <$15M/month for Q3 or Q4 2026
        - Annualized run rate of $180M implies $2–3B fair value; current marks undefendable
        - Reassess; pressure for down round; reconsider at 4–5x trailing revenue
      - - POLY token classified as unregistered security by SEC
        - SEC enforcement action or formal guidance classifying POLY as a security
        - Token launch blocked or restricted; secondary revenue stream eliminated; cap table restructuring required
        - Track closely; equity investors need token-equity waterfall re-analysis
      - - ICE reduces stake or terminates data exclusivity
        - ICE files 13D/13G amendments showing stake decline, or press release terminating data license
        - Loss of institutional distribution and credibility anchor; strategic narrative collapses
        - Immediate downgrade to Avoid; ICE relationship is load-bearing for bull case
      - - Kalshi captures >50% of Polymarket's non-US GMV
        - Third-party volume data (Dune, Nansen) showing Kalshi global share >50%
        - Competitive moat eroded; TAM must be re-shared; revenue multiples compress
        - Reassess market share sustainability; entry price must reset to reflect duopoly not monopoly
