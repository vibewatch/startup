      - number: '3.5'
        title: Switching Costs, Moat Durability, and Adverse Competitive Dynamics
        blocks:
          - type: paragraph
            body: >-
              Polymarket's competitive moats rest on three primary pillars: global liquidity depth, brand and media data
              integration, and its low-fee global platform. In April 2026, Polymarket had $449.9 million in open
              interest and 678,342 unique traders—approximately 8 times the estimated Kalshi active user count—while
              generating $29.2 million in platform fee revenue versus Kalshi's estimated nominal fee revenue. The
              combined lifetime volume of $150 billion validates prediction markets as established financial
              infrastructure. Polymarket's partnerships with X (Twitter), Dow Jones, and UFC for price feed integration,
              and the ICE investment giving its data access to institutional networks, represent distribution advantages
              that smaller competitors cannot replicate quickly. Switching costs for traders are low at the technical
              level—users just need a different wallet or account—but high in practice: Polymarket's liquidity depth and
              market breadth create execution advantages that sophisticated traders cannot abandon without material
              slippage costs. The platform processes 87.4 million transactions in April 2026, indicating high engagement
              that reinforces habituation. However, 63% of Polymarket's trading volume comes from just 0.23% of wallets,
              indicating meaningful concentration in professional and institutional traders whose multi-homing risk is
              higher.

              The most significant adverse dynamics are wash trading, insider trading enforcement, and Congressional
              scrutiny. The CFTC filed its first-ever event contract insider trading complaint on April 23, 2026,
              charging US Army soldier Gannon Ken Van Dyke with using classified information about Operation Absolute
              Resolve to earn over $404,000 profit on Polymarket. A parallel DOJ indictment charged wire fraud,
              commodities fraud, and money laundering. Columbia University researchers estimated that up to 25% of
              Polymarket's trading volume over three years may represent wash trading, with wash trading peaking at 60%
              of total volume in December 2024 and 45% of historical sports market volume. Polymarket has responded with
              transaction fees and enhanced surveillance, but the issue undermines the platform's trust narrative with
              institutional buyers. Kalshi has run an explicit ad campaign in Washington differentiating itself: "We ban
              insider trading," "We don't do death markets," "We operate under U.S. law." CFTC Chairman Selig announced
              at the January 29, 2026 Project Crypto summit an agenda to "support the responsible development of event
              contract markets," and the CFTC formally classified prediction market contracts as derivatives in March
              2026—a ruling that codified Kalshi's existing operational structure and provides greater institutional
              legitimacy to regulated platforms. State-level legal challenges including Arizona's 20 criminal counts
              against Kalshi and Nevada restrictions (Ninth Circuit cleared the way for a temporary restraining order),
              with New Jersey's challenge dismissed by a federal appeals court in April, illustrate the continuing dual
              regulatory reality that both Polymarket and Kalshi face. Kalshi spent $615,000 and Polymarket spent
              $360,000 on Washington lobbying in 2025 according to OpenSecrets, signaling escalating
              regulatory-competition investment.
