            body: >
              Only 0.015% of Polymarket traders sustain a full-time income from the platform, and fewer than 8% of
              all-time wallet addresses have been profitable in any amount. The Harvard Law study estimates $143 million
              extracted by informed traders from retail counterparties. This structural asymmetry undermines the
              "democratized forecasting" narrative and is likely a primary driver of the 60% post-election volume decay:
              casual retail users lose money, lose trust, and do not return. Without cohort-level retention data and
              transparent market integrity reporting, this concentration risk is difficult to manage or disclose
              adequately.
            calloutType: risk
            claimRefs:
              - CU024
              - CU025
              - CU035
              - CU033
          - type: callout
            title: On-Chain Verifiability Provides Rare Customer Evidence Transparency
            body: >
              Unlike most B2C fintech platforms, Polymarket's blockchain-settled architecture makes individual trader
              P&L verifiable by any third party with access to the on-chain ledger. The public leaderboard confirms top
              traders with $1M–$2.4M+ lifetime P&L, bot operators like sovereign2013 have documented six-figure and
              seven-figure outcomes in independent media, and the Builder Program ranks bots by verifiable cumulative
              volume. This transparency is a double-edged asset: it validates real adoption and enables due diligence,
              but also exposes the full scale of concentration and the severity of retail losses.
            calloutType: strength
            claimRefs:
              - CU019
              - CU020
              - CU022
              - CU026
          - type: callout
            title: Referral Program Concentrates Acquisition in Power-Trader Tier
            body: >
              The 2026 referral program redesign—moving from a flat $10 sign-up bonus to a 30%/10% fee-sharing model
              gated by a $10,000 lifetime volume threshold—represents a deliberate commercial shift. It aligns
              acquisition costs with revenue, filters out low-value referrals, and incentivizes the platform's most
              active traders to recruit similar-profile users. The implication for investor diligence is that organic
              retail growth at the bottom of the funnel is now primarily driven by event salience rather than structured
              incentives, while structured incentives are concentrated in the power-trader tier that already dominates
              volume.
            calloutType: insight
            claimRefs:
