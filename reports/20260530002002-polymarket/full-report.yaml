      - number: '3.2'
        title: Direct Competitors — Kalshi and Regulated Peers
        blocks:
          - type: paragraph
            body: >-
              Kalshi is Polymarket's most significant direct competitor and has surpassed Polymarket as the largest
              global prediction market by notional trading volume. Founded in 2019 by Tarek Mansour and Luana Lopes
              Lara, Kalshi is based in New York City and operates as the first CFTC-designated contract market (DCM) for
              event contracts in the United States. The company raised a $1 billion Series F round in March 2026 led by
              Coatue Management, valuing the company at $22 billion—double its $11 billion December 2025 valuation—and
              its total disclosed funding has reached approximately $2.8 billion. Bloomberg cited annualized revenue of
              $1.5 billion at the time of the March 2026 round.

              Kalshi's trading volume has grown explosively. Year-to-date through April 20, 2026, Kalshi processed
              $37.49 billion in notional taker volume versus Polymarket's $29.23 billion. In April 2026 alone, Kalshi
              recorded $14.8 billion in monthly notional volume against Polymarket's $9.0 billion international plus
              $1.26 billion US. Kalshi's taker fee formula is 0.07 × C × P × (1 − P), highest at mid-market (50-cent)
              contracts; its maker fee is 0.0175 × C × P × (1 − P). While the implied all-in cost per trade is
              approximately 0.5–1.2%, Kalshi's partnership with Robinhood—which routes trades directly to Kalshi's
              infrastructure at $0.01/contract—provides a massive distribution advantage over Polymarket's
              crypto-wallet-dependent onboarding.

              Polymarket's own CFTC-regulated US entity (QCX LLC) launched in December 2025 via a waitlist iOS rollout
              but recorded only $1.26 billion in April 2026 versus Kalshi's $14.8 billion US volume, indicating Kalshi's
              first-mover and distribution advantages are durable in the near term. PredictIt, the legacy political
              prediction market operated under a CFTC no-action letter with a strict $850-per-contract cap, transferred
              operational control from Victoria University of Wellington to the US-based Prediction Market Research
              Consortium in July 2025, but remains a research-oriented platform with limited scale and a fragile
              regulatory foundation.
