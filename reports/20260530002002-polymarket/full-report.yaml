      - number: '7.5'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Polymarket has taken substantive steps to mitigate its top risks during 2025–2026, though material
              residual exposures remain. On the regulatory front, the acquisition of CFTC-licensed QCX LLC and launch of
              the US exchange with full KYC, NFA surveillance oversight, and the March 2026 market integrity rules
              update represent the strongest mitigation posture in the company's history. The partnership with Gibson
              Dunn & Crutcher and Mintz Levin on the Massachusetts lawsuit demonstrates legal seriousness. On the
              operational side, the March 2026 announcement introduced dedicated market integrity pages, a multi-layered
              surveillance program including HALO platform integration, and confidential reporting channels. The NFA
              Regulatory Services Agreement provides independent trade surveillance for the US exchange.

              However, several residual risks lack adequate mitigations. UMA governance concentration has not been
              structurally addressed—the same whale-manipulation vulnerability that resolved a $7 million market
              incorrectly in March 2025 persists, and SettleRisk's quantitative analysis confirms the 2-hour dispute
              window remains a structural gap. Private key management for operational wallets—the attack vector in the
              May 2026 exploit—requires hardware security module (HSM) deployment and formal key-rotation procedures
              that Polymarket has not publicly confirmed implementing. The global DeFi platform's pseudonymous
              architecture means wash trading enforcement relies on on-chain pattern detection and voluntary wallet
              bans, not identity-based enforcement. State jurisdiction patchwork has no institutional mitigation beyond
              active litigation.

              Investors should monitor the following kill-criteria events: (1) Massachusetts federal district court
              rules against Polymarket's preemption argument AND the First Circuit declines a stay—triggering
              state-by-state licensing requirements that would fragment the US market; (2) a second UMA governance vote
              manipulation disrupts a market with >$10 million in open interest—demonstrating oracle risk is systemic
              and not isolated; (3) April 2026's competitive volume trajectory continues for three consecutive
              months—indicating structural rather than seasonal market share loss; (4) the CFTC's ANPRM results in a
              final rule that prohibits politics or sports contracts—eliminating Polymarket's highest-volume categories;
              (5) Shayne Coplan departures under regulatory or criminal cloud without a named successor. Each of these
              constitutes a thesis-break trigger requiring immediate position reassessment.
