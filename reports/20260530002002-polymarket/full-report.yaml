      - number: '5.3'
        title: Oracle Resolution and Settlement Mechanics
        blocks:
          - type: paragraph
            body: >-
              Polymarket uses UMA Protocol's Optimistic Oracle (upgraded to MOOV2 in 2025) for decentralized,
              permissionless market resolution. Every market specifies pre-defined resolution criteria (resolution
              source, end date, edge-case handling) published alongside the market question. After a market closes, a
              whitelisted proposer posts a $750 USDC bond and submits the outcome on-chain. The proposal is
              "optimistically" treated as correct for a 2-hour challenge window. If no one disputes within that period,
              the market settles automatically and winning tokens become redeemable for $1.00 each in pUSD.

              If a dispute is filed, the proposer's bond is voided and a new proposal round opens. A second dispute
              escalates the question to UMA's Data Verification Mechanism (DVM), where UMA token holders vote using a
              Schelling-point mechanism (majority rules). DVM votes typically complete in 48-96 hours. Per SettleRisk's
              February 2026 quantitative analysis, more than 98.5% of Polymarket markets resolve cleanly in a single
              proposal cycle without DVM escalation. The 1.5% that escalate to DVM voting are typically ambiguous
              events, contested geopolitical outcomes, or cases where resolution criteria are vague.

              The UMA CTF Adapter (audited by OpenZeppelin) bridges the UMA oracle result into the CTF so winning
              conditional tokens can be redeemed. This resolution infrastructure is materially dependent on UMA
              token-holder governance, creating a systemic risk if whale concentration allows coordinated manipulation
              of DVM votes — a concern documented by SettleRisk's analysis of a $7M market that resolved incorrectly in
              March 2025 due to governance gaming. The $750 bond is modest relative to large-market stakes, and
              sophisticated actors with enough UMA tokens could exploit ambiguously worded markets.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE040
