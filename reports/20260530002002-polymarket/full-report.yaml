            body: >
              Polymarket's 2026 expansion strategy leverages a redesigned referral program and a Builder Program as its
              primary community-acquisition channels. The referral program, launched in updated form in early 2026
              following the introduction of trading fees, pays direct referrers 30% of net trading fees generated by
              referred users for 180 days, plus 10% of fees from second-level indirect referrals. Eligibility requires a
              $10,000 lifetime trading volume threshold, which effectively gates the referral channel to experienced,
              high-volume traders rather than casual participants—a deliberate design to tie acquisition costs directly
              to revenue generation and filter low-activity referrers. The previous flat $10 sign-up bonus was
              discontinued; the performance-based model is commercially more defensible but concentrates acquisition
              power in the existing power-trader cohort. Concentration risk is significant: the top 10 trading bots
              collectively account for the majority of programmatic volume; the single largest bot (Betmoar) alone
              controls ~42% of Builder Program attributed flow. This dynamic gives a narrow group of sophisticated
              actors outsized influence over liquidity depth, spread tightening, and price discovery quality—advantages
              accruing disproportionately to users with capital, latency infrastructure, and API expertise. For manual
              retail participants, this creates an adverse selection environment in high-liquidity markets. Geographic
              expansion is partially constrained by regulatory friction: Nevada maintains a court-ordered restriction on
              sports, entertainment, and election contracts; multiple European jurisdictions restrict access;
              OFAC-sanctioned regions are permanently blocked. The CFTC-regulated US product broadens domestic access
              but maintains separate KYC requirements and is subject to ongoing state-level litigation.
