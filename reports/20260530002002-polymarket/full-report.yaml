      - number: '2.3'
        title: Buyer and User Segmentation
        blocks:
          - type: paragraph
            body: >
              Three distinct buyer segments participate in prediction markets with different motivations, budgets, and
              adoption paths: retail speculators, institutional data and alpha buyers, and embedded platform users.

              Retail speculators are the volume engine by user count. Over 80% of users are classified as retail,
              trading less than $10,000 per quarter, with average trade sizes under $100. The demographic profile skews
              young — 38% of 18-34-year-old US voters have placed money in prediction markets versus only 3% of those
              aged 65+. Men participate more (46%) than women (31%), and users of color participate at higher rates than
              white users. Politically and news-engaged users, former sportsbook bettors, and crypto-native traders form
              the core. Average active days per user quadrupled from 2.5 to 9.9 days in Q1 2026, indicating deepening
              engagement rather than purely episodic betting. Gen Z sees prediction markets as a faster wealth-building
              path than traditional investing, a dynamic that financial advisors warn is misaligned with the risk
              profile.

              Institutional buyers are a small share of users but contribute disproportionate volume. Coalition
              Greenwich surveyed 53 capital markets specialists in January 2026 and found 75% believe prediction markets
              will bring new speculation instruments within 12 months, with 60% viewing market data as at least somewhat
              valuable. Institutional motivations include direct alpha trading on macro and political outcomes, and
              using market prices as alternative data signals for portfolio construction. ICE's $2 billion investment in
              Polymarket and the launch of Polymarket Signals signal the largest exchange infrastructure providers are
              preparing institutional-grade data products built on prediction market price feeds. Robinhood's prediction
              market hub has 1 million users and generates $350 million in annual recurring revenue, illustrating the
              embedded consumer-platform model that blurs retail and fintech distribution.

              Embedded platform users represent the emerging third segment: Robinhood accounts for approximately 30% of
              Kalshi's trading volume, DraftKings and FanDuel have entered as market makers, and Fanatics launched its
              own prediction platform in December 2025. This channel brings prediction markets to users who would not
              independently seek out a dedicated platform, compressing onboarding friction and accelerating the funnel
              from awareness to first trade.
