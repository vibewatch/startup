      - number: '4.3'
        title: Cost Structure, Capital Adequacy, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Polymarket's disclosed cost structure is dominated by three identifiable spending categories: regulatory
              and re-entry costs, user incentive programs, and headcount expansion. The company spent $112 million to
              acquire QCX LLC, a CFTC-registered designated contract market, in July 2025 to unlock legal US operations.
              The platform simultaneously subsidizes liquidity by paying users 4% annual yield on held USDC positions—a
              negative-carry program that must be offset by Treasury yield management above 4% to remain non-dilutive.
              Headcount reached approximately 241 employees globally as of 2026, with the hiring wave spanning
              engineering, compliance, and market operations functions needed for the regulated US entity.

              Capital adequacy is robust on a near-term basis. ICE's strategic investment commitment of $2 billion (of
              which $600 million was deployed in March 2026 as part of the Series E) provides a strong liquidity
              backstop. Total capital raised across all rounds stands at approximately $2.3 billion. As of April 2026,
              Polymarket was reported to be in discussions to raise an additional $400 million at a $15 billion
              valuation, which could bring the Series E total to $1 billion. Monthly burn rate is not disclosed, but
              based on headcount, incentive programs, and platform infrastructure costs, estimates suggest it exceeds $8
              million per month. At that rate, the March 2026 $600 million deployment implies well over five years of
              runway before accounting for fee revenues, which began flowing in April 2026. This comfortable capital
              position reduces near-term financing risk, but Polymarket's valuation of $9–$15 billion requires a
              material revenue acceleration—its current $300 million annualized run rate implies an implied revenue
              multiple of 30–50x against recent valuation anchors.
