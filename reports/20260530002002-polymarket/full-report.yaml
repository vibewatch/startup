      - number: '3.4'
        title: Capability, Pricing, and Regulatory Comparisons
        blocks:
          - type: paragraph
            body: >-
              Comparing Polymarket against Kalshi and substitute platforms across buying criteria reveals meaningful
              structural differences in regulatory status, access model, and fee architecture. Polymarket's global
              platform collects a 2% fee on net winnings only—users pay nothing on losses, giving it a fee structure
              favorable to active traders with moderate win rates. The US arm (QCX) operates a maker/taker exchange
              model with taker fees up to 1.56% for crypto contracts and 0.44% for sports, with maker rebates. Kalshi's
              position-at-risk fee of 0.07 × C × P × (1-P) implies lower effective costs at high-certainty contracts
              (near $0.01 or $0.99) but higher costs at mid-market, making Kalshi structurally cheaper for informed
              traders with high-conviction positions.

              The most consequential differentiation is regulatory access and fiat on-ramps. Kalshi accepts ACH and
              debit card deposits (2% debit card fee), while Polymarket's global platform requires a crypto wallet and
              USDC, creating friction for the mainstream US retail user that Robinhood's Kalshi-powered product
              eliminates entirely. Manifold operates with no fees but also no real-money stakes. PredictIt charges 10%
              on net profits plus a 5% withdrawal fee—the highest in the competitive set—and is constrained to political
              markets. Traditional sportsbooks' implicit 4–5% vig represents a substantial effective-cost disadvantage
              for informed traders but remains the default for entertainment-oriented sports bettors who value parlays,
              live betting, and bonuses unavailable on prediction market platforms.

              On capability breadth, Polymarket operates approximately 1,200+ live markets spanning politics, sports,
              crypto, and economics, with politics at 32% and sports at 39% of global volume. Kalshi mirrors this
              breadth but skews heavily toward sports (80% of its volume) and has deeper macro/economic indicators
              coverage. Neither platform supports user-created markets; Manifold is the only player with open market
              creation, contributing to its long-tail coverage of niche topics.
