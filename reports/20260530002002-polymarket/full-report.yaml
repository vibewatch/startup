              bugs on Android. Trustpilot reviews paint a more critical picture, with an estimated score near 1.3 out of
              5, reflecting recurring complaints about withdrawal difficulties, frozen funds, and unresponsive customer
              support. Adverse research evidence is substantial: a Columbia University study estimated up to 25% of
              total Polymarket trading volume constitutes wash trading, with sports markets peaking near 45% wash rate
