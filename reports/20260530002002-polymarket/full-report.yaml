      - number: '5.2'
        title: Smart Contract Infrastructure and CLOB V2
        blocks:
          - type: paragraph
            body: >-
              Polymarket's on-chain architecture is built on the Gnosis Conditional Token Framework (CTF), a standard
              for tokenizing event outcomes as ERC-1155 tokens on Polygon mainnet (Chain ID 137). The core contracts are
              the CTF Exchange V2 (0xE111180000d2663C0091e4f400237545B87B996B), which handles operator-driven order
              matching and settlement, and the Conditional Tokens contract (0x4D97DCd97eC945f40cF65F87097ACe5EA0476045),
              which governs splitting, merging, and redeeming outcome shares. Multi-outcome markets with correlated
              Yes/No legs are handled by the Neg Risk CTF Exchange (0xe2222d279d744050d28e00520010520000310F59).

              The April 2026 infrastructure overhaul (announced April 7, live April 28) was the most significant
              platform change since launch. CLOB V2 replaced V1's matching engine and delivers 10,000+ orders per second
              versus 800-1,200 on V1, reduces order matching latency from 800-2,000 ms to 80-150 ms, and cuts per-trade
              gas fees from $0.15-$0.45 to $0.02-$0.08. CTF Exchange V2 adds EIP-1271 support (enabling multi-sig and
              smart-contract wallet access for institutional traders), builder codes for on-chain API attribution, and
              simplified order structs with proxy upgradeability.

              Simultaneously, Polymarket migrated its collateral from bridged USDC.e to pUSD (Polymarket USD), a
              proprietary stablecoin backed 1:1 by Circle USDC. The pUSD Collateral Onramp contract
              (0x93070a847efEf7F70739046A929D47a521F5B8ee) handles conversion; users on the web frontend needed only a
              single approval prompt. pUSD is a collateral instrument only — it is not a tradeable asset — and its
              introduction removes the platform's dependence on a Polygon-to-Ethereum bridged stablecoin, reducing
              bridge counterparty risk. The POLY governance token airdrop, confirmed by Polymarket's CMO in October
              2025, remains pending the full US consumer rollout.
