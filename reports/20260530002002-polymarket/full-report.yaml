  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Polymarket competes in a rapidly scaling prediction market sector that has grown more than 17-fold in
              trading volume between mid-2024 and early 2026. Combined monthly global trading volume on Kalshi and
              Polymarket surged from under $5 billion in September 2025 to approximately $24 billion in April 2026,
              according to a Pew Research Center analysis of data from The Block. Monthly active users across prediction
              markets grew from approximately 4,000 in early 2024 to over 600,000 by late 2025.

              The competitive landscape divides into four tiers. First, direct peers in real-money event contract
              trading: Kalshi (CFTC-regulated DCM, US-focused) and Polymarket US (QCX LLC, the company's own regulated
              US entity). Second, adjacent sportsbook substitutes that have entered event-contract trading: DraftKings
              Predictions and FanDuel Predicts, both operating as active market makers through CFTC-licensed
              infrastructure. Third, status-quo informational substitutes that satisfy the forecasting job-to-be-done
              without real money: Manifold Markets (play-money, global) and Metaculus (points-based, professional).
              Fourth, legacy and emerging alternatives including PredictIt (CFTC no-action, political markets only), and
              a long tail of on-chain venues led by Predict.fun ($579M monthly volume), Opinion ($376M), and Limitless
              ($205M) in April 2026.

              Within this landscape, Kalshi and Polymarket control roughly 65% and 35% of global trading volume
              respectively as of April 2026, a near-complete reversal from December 2024 when Polymarket held
              approximately 95% of sector volume. This structural shift traces directly to Kalshi's CFTC-regulatory moat
              and Robinhood distribution, making competitive-moat durability the central diligence question for
              Polymarket's investment thesis. Kalshi accounted for approximately 90% of US regulated prediction market
              activity as of February 2026 according to a Bank of America report cited in CNBC coverage.
