  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Adjacent Markets
        blocks:
          - type: paragraph
            body: >
              Prediction markets constitute a distinct financial category in which participants trade binary or scalar
              event-outcome contracts, with prices reflecting crowd-aggregated probabilities. The core market spans
              contracts on political events, macroeconomic data releases, sports outcomes, and increasingly weather, AI
              milestones, and pop-culture topics. The included spend is notional trading volume — the dollar value of
              contracts bought and sold — not revenue or house take; this distinction matters for sizing comparisons.

              The primary status-quo substitutes are online sportsbooks (for sports-outcome speculation), traditional
              financial derivatives (for macro/rate hedging), and informal polling or forecasting services (for
              information buyers). Online sports betting reached $49.74 billion in gross wager value in 2026 and is
              forecast to grow to $92.49 billion by 2031 at a 13.21% CAGR; prediction market sports contracts compete
              directly for this spend among the 18-49-year-old demographic. The broader global online gambling market
              totals approximately $143 billion in 2026, providing an upper-bound adjacency.

              Excluded from the core prediction market definition are traditional financial exchange products (futures,
              options on indices, commodities) even when outcome-linked, as well as unregulated offshore gambling
              platforms not operating under exchange rules. The regulatory boundary matters commercially: the CFTC
              issued an Advance Notice of Proposed Rulemaking (ANPR) on March 12, 2026, explicitly classifying event
              contracts as derivatives subject to Commodity Exchange Act jurisdiction, which formalizes the separation
              from state gambling laws. The CFTC Innovation Task Force, launched March 24, 2026, is now developing a
              comprehensive federal framework. Legal disputes in 14 US states and the Kalshi-Nevada appellate battle
              remain live vectors that could narrow or expand the effective US SAM.
            claimRefs:
              - CM017
              - CM018
              - CM005
