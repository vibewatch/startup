  - id: TV006
    title: Final Diligence Asks Table
    notes: >-
      All six asks represent blocking or material gaps as of May 30, 2026. No publicly
      available evidence fills any of these items; all require Polymarket data room access
      or direct company engagement.
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited Financial Statements
        - 2024 and 2025 audited P&L, balance sheet, cash flow; gross margin; EBITDA; burn rate
        - Valuation underwriting is impossible without these; current marks rest on unaudited estimates
        - Polymarket management; data room request required
      - - Preference Stack and Waterfall
        - Complete liquidation preference terms for all rounds; ICE preferred terms; participating vs non-participating
        - ICE's $2B at preferred terms may eliminate common equity value in down-round or moderate-exit scenarios
        - Polymarket legal counsel; cap table modeling required before any entry decision
      - - POLY Token Economics
        - Token distribution (equity vs. community vs. team), revenue-sharing formula, vesting, regulatory classification opinion
        - Token could redirect material fee revenue from equity to token holders; SEC classification risk is material
        - Polymarket CMO and legal; SEC no-action letter or outside counsel legal opinion required
      - - ICE Data License Terms
        - Master data licensing agreement duration, renewal terms, exclusivity scope, and pricing
        - Data licensing is the highest-margin adjacent revenue opportunity; loss of ICE exclusivity collapses the bull case
        - Polymarket CFO; contract review in data room
      - - Post-Fee Wash Trading Audit
        - Independent on-chain analysis of wallet behavior post-March 30, 2026 fee introduction
        - Columbia study covered pre-fee era; without post-fee audit, reported GMV may still contain material noise
        - Polymarket engineering or third-party blockchain analytics firm (Chainalysis, Nansen)
      - - Retention and Churn Metrics
        - Monthly active traders, 30/90-day retention by cohort, geographic breakdown, institutional vs retail split
        - High-volume retail concentration creates event-cycle volatility; institutional retention would support base case
        - Polymarket data team; internal analytics data room
