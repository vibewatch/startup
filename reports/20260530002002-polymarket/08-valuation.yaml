  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >-
        Audited 2024 and 2025 financial statements including P&L, balance sheet, gross margin,
        EBITDA, cash burn rate, and maker-rebate cost detail. Without these, the post-fee revenue
        run rate is based entirely on on-chain estimates and the valuation multiple cannot be
        precisely underwritten. This gap is blocking for any investment decision at the Series E
        valuation.
      relatedQuestionRefs:
        - QV020

    - type: private-evidence-only
      severity: blocking
      topic: preference-stack
      missingEvidence: >-
        Complete liquidation waterfall including ICE's preferred terms, participating vs.
        non-participating structure, and senior/junior preference ordering for all rounds.
        ICE's $2 billion at undisclosed preferred terms could eliminate common equity value
        in base and bear case exit scenarios.
      relatedQuestionRefs:
        - QV029

    - type: missing-source
      severity: material
      topic: token
      missingEvidence: >-
        POLY token economic structure including equity-to-token revenue split, token supply,
        community vs. team vs. investor allocation, vesting schedules, and any outside counsel
        legal opinion on SEC securities classification. Token economics could redirect material
        fee revenue from equity holders to token holders.
      relatedQuestionRefs:
        - QV022

    - type: missing-source
      severity: material
      topic: wash-trading
      missingEvidence: >-
        Independent on-chain post-fee wash trading audit covering March 30 – May 30, 2026
        to confirm that fee introduction eliminated artificial volume. The Columbia study
        covered the pre-fee era only; without a current-period analysis, reported GMV may
        still contain material noise.
      relatedQuestionRefs:
        - QV026

    - type: missing-source
      severity: material
      topic: ipo-path
      missingEvidence: >-
        Formal IPO or liquidity planning timeline from Polymarket management or ICE. No
        public evidence confirms whether Polymarket is pursuing a US IPO, a SPAC, a direct
        listing, or indefinite private status. The presence or absence of a public exit
        pathway materially affects growth equity return modeling.
      relatedQuestionRefs:
        - QV009

    - type: missing-source
      severity: material
      topic: series-e-close
      missingEvidence: >-
        Confirmation of whether the reported April 2026 Series E round at $20B valuation
        was formally closed, is in process, or was merely rumored. Secondary market and press
        reports use ambiguous language; no filing, press release, or company announcement
        confirms the round. Unconfirmed close means the $20B anchor price may not reflect
        actual investor-agreed terms.
      relatedQuestionRefs:
        - QV030

    - type: partial-data
      severity: material
      topic: comparable-private-financials
      missingEvidence: >-
        Audited or independently verified financial data for private comparables including
        Kalshi, PredictIt, and other private prediction market operators. The comparable
