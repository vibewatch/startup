  - id: section-scenarios
    title: Bull, Base, and Bear Scenario Analysis
    body: >-
      The bull case for Polymarket requires three co-occurring developments: (1) GMV sustains
      above $100 billion annualized through institutional adoption and US market normalization,
      (2) the POLY token launch generates a material incremental revenue stream via staking and
      protocol fees, and (3) ICE's data licensing channel signs 20+ institutional contracts by
      year-end 2026, producing a defensible $50–100 million incremental revenue line. Under
      these conditions, total revenues could reach $600–800 million in 2026, and a 30x forward
      multiple on $800 million would support an $18–24 billion equity value—broadly consistent
      with the Series E target. Exit multiple compression at IPO to 20x on $1 billion 2027
      revenues implies a $20 billion equity value at listing.

      The base case assumes that the April $43.36 million fee month was elevated by event
      volume (UEFA Champions League, economic data cycles) and that steady-state monthly fees
      average $25–35 million ($300–420 million annualized). The POLY token launch proceeds but
      generates modest staking revenue below $50 million in its first year. Data licensing
      contributes $20–40 million. Total revenues settle at $340–460 million by 2026 year-end.
      A 15–20x forward revenue multiple on $400 million implies a fair value of $6–8 billion—
      below the current Series E mark of $9 billion at which ICE initially invested and well
      below the $20 billion target. This gap represents the "growth and execution premium" that
      investors are paying for the strategic option value of the prediction market category.

      The bear case requires at least two of: (1) wash trading fee-introduction effect causes
      genuine daily volumes to decline 40%+; (2) DOJ/CFTC enforcement escalates to platform-level
      actions (not individual insider traders); (3) Kalshi's 90%+ US market share claims prove
      durable and Polymarket fails to win back US institutional volume; (4) the POLY token
      launch is delayed or classified as a security, triggering SEC action. Under this scenario,
      annualized fees decline to $100–150 million, and a 10x distressed-growth multiple implies
      $1–1.5 billion equity value—representing an 83–89% markdown from the October 2025 mark
      and a complete wipeout for the Series E at the $20 billion target.
