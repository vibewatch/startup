        - from: gross-fee-rate
          to: net-fee-rate
        - from: net-fee-rate
          to: infra-cost
    approximationNotes: 所有数字均为估计；没有经审计损益表。挂单方返利区间 20–50% 来自 Polymarket 已发布费率表。 基础设施成本为基于链上数据的结构性估计。不含人员、合规和收益补贴成本。
