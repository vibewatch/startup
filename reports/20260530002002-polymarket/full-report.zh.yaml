      - number: '2.3'
        title: 买家与用户分层
        blocks:
          - type: paragraph
            body: >
              三类不同买家参与预测市场：零售投机者、机构数据和超额收益买家，以及嵌入式平台用户。三者动机、预算和采用路径各不相同。

              按用户数看，零售投机者是成交量引擎。超过 80% 的用户被归为零售，每季度交易少于 $10,000，平均单笔交易低于 $100。人口画像偏年轻：18-34 岁美国选民中有 38% 曾把钱投进预测市场，65
              岁以上人群只有 3%。男性参与率（46%）高于女性（31%），有色人种用户参与率高于白人用户。政治和新闻高参与者、前体育投注下注者、加密原生交易者构成核心。2026 年 Q1，每用户平均活跃天数从 2.5
              天增长到 9.9 天，显示参与在加深，而非只是事件驱动的短暂下注。Gen Z 把预测市场视为比传统投资更快的财富积累路径；理财顾问则警告，这种理解与风险画像并不匹配。

              机构买家在用户数中占比很小，却贡献不成比例的成交量。Coalition Greenwich 于 2026 年 1 月调查 53 名资本市场专家，发现 75% 认为预测市场将在 12 个月内带来新的投机工具，60%
              认为市场数据至少有一定价值。机构动机包括直接围绕宏观和政治结果交易超额收益，以及把市场价格用作组合构建的另类数据信号。ICE 对 Polymarket 投入 $2 billion，Polymarket
              Signals 上线，都表明最大级别交易所基础设施提供商正准备基于预测市场价格流打造机构级数据产品。Robinhood 的预测市场中心有 1 million 用户，并产生 $350 million
              年经常性收入，展示了嵌入式消费者平台模式如何模糊零售与金融科技分发边界。

              嵌入式平台用户代表正在出现的第三类人群：Robinhood 约占 Kalshi 交易量的 30%，DraftKings 和 FanDuel 已以做市商身份进入，Fanatics 也在 2025 年 12
              月上线自有预测平台。这个渠道把预测市场带给原本不会主动寻找专门平台的用户，压低开户摩擦，加快从认知到首次交易的漏斗。
