            title: 收费架构撑起可持续收入流
            body: >-
              Polymarket 按概率计算的吃单费模型，在结构上很适配预测市场：费用在市场最不确定（交易兴趣最高）处达到峰值，在概率两端趋近于零，从而保留知情投注者的经济吸引力。2026 年 3 月上线收费后 72
              小时内日收入达到 $1 million，在规模化场景验证了货币化设计。以 4 月 $9.14 billion GMV 计算，$300 million 年化运行率代表真实且仍在增长的收入基础。
