      - number: '6.4'
        title: 留存、满意度与反向证据
        blocks:
          - type: paragraph
            body: >
              留存数据混合，并受选举周期扭曲。最强可用数字是 Q4 2024 注册队列的 65% 30 天留存率，Polymarket 在这一指标上超过 85% 可比 DeFi 和 crypto 交易协议。但选后交易量下降
              60%，显示事件驱动的休闲用户迅速流失。应用商店满意度在平台间分化明显：iOS app 在 30,000+ 条评价中约 4.7/5 星，Android app 在 7,000+ 条评价中约 2.2/5
              星；差距主要来自 Android 崩溃、登录失败和界面 bug。Trustpilot 评价更负面，估计得分接近 1.3/5，反映提现困难、资金冻结和客服无响应等反复投诉。反向研究证据很重：Columbia
              University 研究估计，Polymarket 总交易量最多 25% 是刷量交易，体育市场历史峰值刷量率接近 45%，选举市场约 17%。Harvard Law School
              研究记录，知情交易者在两年期间提取了估计 $143 million
              异常利润，实质上是从不知情零售参与者向持有重大非公开信息者转移。这些发现对留存高度关键，因为它们削弱「群体智慧」信号质量，降低输钱零售用户的信任，并让平台暴露于监管执法。Polymarket 已用 2026
              年收费结构试图在经济上抑制刷量交易，也上线了供用户举报的市场诚信页面。
