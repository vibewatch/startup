      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              预测市场行业受到监管、技术和行为多重顺风推动，但也要顶住显著结构性摩擦。

              主要增长驱动包括：CFTC 监管澄清降低了长期压低机构参与的法律风险溢价；Robinhood、Coinbase、DraftKings
              等平台带来主流金融分发；区块链基础设施支持无需许可的全球流动性和低结算成本；2024 年大选后的认知外溢把普通新闻消费者转化为活跃市场参与者。CFTC 2026 年 3 月衍生品认定和 Innovation
              Task Force 都释放出行政部门倾向支持而非限制该行业的信号。

              采用约束同样实质。监管不确定性仍是最大因素：14 个州的法律战、尚未解决的 Kalshi-Nevada 上诉争议，以及 CFTC ANPR
              公开征求意见期，都会让哪些合约、哪些平台能继续开放变得不确定。内幕交易风险已被明确列为执法重点——CFTC Division of Enforcement
              表示正在监测预测市场聊天室和社交平台中对重大非公开信息的滥用，多项联邦指控已经提出。预言机争议、事件结算模糊和平台宕机造成的信任障碍，会同时压低零售和机构买家的回访率。

              切换成本分析：零售用户名义切换成本低（钱包可迁移，没有锁定合约），但体验成本高——流动性碎片化意味着从 Polymarket 转向新平台，可能牺牲市场深度和市场选择范围。机构用户则面对 API
              集成成本、合规重新审批和数据流迁移。Polymarket 的加密到法币入口摩擦（USDC 抵押品、Polygon 网络）让非加密原生用户开户明显更难，相比 Kalshi 的法币原生界面处于劣势。

              对多数零售参与者而言，资本强度和 ROI 动态不利：CNBC 报道称，自 2022 年以来，超过 70% 的 Kalshi 交易者和约 69% 的 Polymarket 交易者亏钱，77% 收益流向前 1%
              用户。理财顾问公开建议把预测市场支出当作娱乐预算，而非投资。亏损的结构性画像限制了零售用户在净亏损体验后的口碑自然增长。
