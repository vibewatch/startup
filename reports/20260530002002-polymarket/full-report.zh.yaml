      - number: '7.4'
        title: 竞争、财务与执行风险
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的财务风险压在两处结构性漏洞上：事件驱动收入周期性，以及竞争对手蚕食份额正在加速。2026 年 4 月，平台交易量自 2025 年 8 月以来首次环比下滑，降 8.9% 至 $10.2
              billion；同月 Kalshi 增 13% 至 $14.8 billion。整个板块 4 月增 12.4% 至 $29.8 billion，说明 Polymarket 在增长中的市场里丢份额。Laika
              Labs 的 2026 年分析估计，Kalshi 目前占合并市场份额约 52–53%，Polymarket 已降至约 35–40%。

              事件周期收入风险是结构性的：2024 年美国大选带来异常活跃，未平仓量峰值达到 $474 million。选后，未平仓量在 2024 年 12 月坍缩至 $117
              million，说明平台对头部政治事件高度敏感。下一次美国大选要到 2028 年，且 Polymarket 面临更高的美国监管限制；若要守住非选举交易量，只能靠体育、加密和经济市场的执行，而这些市场 Kalshi
              已经占优。

              Polymarket 在 2026 年 3 月从零手续费模式转向收取交易费，本身就是结构性执行风险。平台在预测新结构下日收入约 $1 million
              后推出收费；这项调整可能导致用户流失，也可能加速用户迁往成本更低的替代平台。2025 年 12 月上线的美国专用应用仍与 Polymarket 的全球流动性池隔离，造成两套用户体验，也让美国交易者相较国际用户和
              CFTC 监管竞品处于劣势。

              创始人兼 CEO Shayne Coplan 的关键人物集中度，是重大执行风险。Coplan 亲自带公司穿过 2022 年 CFTC 同意令、2024 年 11 月 FBI 搜查其住所，以及 2025 年 7 月
              DOJ 与 CFTC 在未起诉情况下结案。多位高调顾问和战略伙伴都系于 Coplan 的个人网络。首席法务官 Neal Kumar 负责公司的州诉讼策略；两位高管能否继续任职，对 Massachusetts
              诉讼结果都有重大影响。
