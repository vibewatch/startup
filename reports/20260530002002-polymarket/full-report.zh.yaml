            title: 利润集中拖累零售留存
            body: >
              只有 0.015% 的 Polymarket 交易者能在平台上维持全职收入，历史累计钱包地址中任何金额盈利者不到 8%。Harvard Law 研究估计，知情交易者从零售对手方提取了 $143
              million。这种结构性不对称削弱了「民主化预测」叙事，也可能是选后交易量衰减 60%
