companyProfile:
  summary: >-
    Polymarket 是一家创立于纽约的预测市场平台。用户在 Polygon 上交易代币化结果合约，价格体现群体隐含概率。2022 年与 CFTC 达成和解后，公司重建为双轨模式：一边是全球非托管加密交易场所，一边通过 QCX
    LLC 打通受 CFTC 监管的美国路径；同时，公司加入手续费货币化、由 ICE 分发的数据产品，以及更深的机构接口。尽调的核心问题不是 Polymarket
    有没有产品市场契合，而是已披露成交量、手续费耐久性、市场完整性控制和治理透明度，是否足以支撑估值从已经完成的 $9 billion 标记继续迈向更高的 2026 年目标。
