  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的估值历史把五年的资本形成压缩进三轮改写格局的融资。2020–2022 年，公司完成种子轮和 Series A，Founders Fund、Blockchain
              Capital、General Catalyst、Polychain Capital、Vitalik Buterin 参投，但公开披露的估值和条款信息很少。关键转折是 Intercontinental
              Exchange 在 2025 年 10 月直接投入 $1 billion 股权投资，确立 $9 billion 投后估值，并让 ICE 持有约 17% 流通股（完全稀释后 11%）。ICE 同时成为
              Polymarket 面向机构投资者分发事件驱动数据的全球独家分销商；双方关系从资本伙伴升级为战略基础设施提供方。

              到 2026 年 1 月，Polymarket 二级市场隐含估值达到 $11.6 billion，反映 2025 年 12 月美国重启以及市场对手续费收入快速落地的预期。2026 年 3 月 27 日，ICE
              宣布作为 Polymarket Series E 融资的一部分，第二次直接现金股权投资 $600 million，并计划在二级市场向现有持有人购买至多 $40 million 证券。这笔交易兑现 ICE 约 $2
              billion 的总承诺，并把 ICE 持股提高到约 23% 流通股（完全稀释后 14%）。Series E 目标投后估值约 $20 billion，较 2025 年 10 月估值不到六个月提升
              122%——这是金融科技重大后期融资中最快的估值跃升之一。2026 年 4 月，有报道显示 Polymarket 正洽谈以约 $15 billion 估值再融资 $400
              million，说明在手续费和合规逐步常态化时，$20 billion 目标已有一定降温。

              从 ICE 视角看，入场价格并非靠历史收入倍数支撑，而是靠战略位置：机构投资者越来越把预测市场数据当作实时地缘政治和经济信号，ICE 的分销基础设施则能把 Polymarket
              概率直接嵌入金融数据终端和机构工作流。优先股堆叠的条款和清算优先权没有公开披露；Polymarket
              也没有提供经审计财务报表、毛利率或烧钱速度数据。这种不透明，是二级交易或跟投决策进行精确估值承销时最大的单一障碍。
