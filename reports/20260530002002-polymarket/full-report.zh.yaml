  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台概览与用户流程
        blocks:
          - type: paragraph
            body: >-
              Polymarket 是全球最大的预测市场。任何持有非托管加密钱包的用户，都可以在 Polygon PoS 网络上交易以 USDC 支持的 pUSD
              计价的二元或多结果事件代币。在平台上，一个「市场」代表一个关于真实世界结果的问题（政治、经济、体育、crypto、天气），每个结果被代币化为 ERC-1155 条件代币，价格介于 $0.00 到
              $1.00；价格反映人群的概率估计。市场结算时，获胜代币精确兑付 $1.00；失败代币归零。

              从用户视角看，端到端流程分四步：（1）连接 Web3 钱包（美国访问则通过 FCM 经纪商完成 KYC），并通过链上抵押品入口把 USDC 转为 pUSD；（2）浏览预测市场信息流——web 端
              polymarket.com、iOS（4.7 星，30,000+ 条评价）和 Android（3.7 星，7,100+ 条评价）均可访问——并选择市场；（3）通过 CLOB V2
              引擎下限价单或市价单；（4）持有代币直到事件结算，由 UMA 预言机触发自动兑付。截至 2026 年 5 月，平台托管 214,735+ 个市场，累计超过 2.4 million 交易者，总交易量约 $62
              billion。

              平台有两个不同产品面：全球非托管钱包平台（不强制 KYC）和 Polymarket US（QCX LLC DCM）。后者于 2025 年 12 月以 iOS 候补名单方式推出，要求完整 KYC/AML 验证和
              FCM 中介。双架构让 Polymarket 在同一品牌下同时服务 crypto 原生零售用户和受监管机构参与者。
