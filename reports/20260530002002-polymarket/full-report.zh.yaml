  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    summary: 截至 2026 年 5 月，围绕 Polymarket 的市场、验证、护城河、经济性、风险、估值和证据质量，给出可供投委会使用的评分。标为估计的项目不确定区间很宽，因为公司没有披露经审计财务，收费后收入历史也很短。
    data:
      items:
        - label: 市场规模（TAM）
          value: $5B US / $1T potential by 2030
          note: 美国估算来自分析师共识；$1T 是投机性机构预测
        - label: GMV（月度峰值）
          value: $10.57B (March 2026)
          note: 链上验证；由政治和宏观事件市场主导
        - label: 年化费用运行率
          value: $300–520M
          note: 基于收费后 2 个月数据；未经审计；未扣除 maker 返佣
        - label: 上轮估值
          value: $9B (Oct 2025 ICE) / $20B (Series E target)
          note: ICE 提交了官方投资者关系披露；Series E 条款尚未最终确定
        - label: 隐含收入倍数
          value: 30–67x forward revenue
          note: 区间覆盖 $9–20B 估值下的保守（$300M）至峰值（$520M）运行率
        - label: 主要可比倍数
          value: 'Kalshi: ~15x; Coinbase: ~9x; Robinhood: ~15x'
          note: Polymarket 相比所有直接和相邻可比公司都有显著溢价
        - label: 风险评级
          value: High
          note: 刷量交易历史、执法、无经审计财务、单一创始人、POLY 稀释
        - label: 建议
          value: Track
          note: $20B 不可操作；若 $8–10B 入场且可访问 data room，可重新评估
