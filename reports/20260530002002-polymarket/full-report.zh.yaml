      - number: '7.2'
        title: 运营与平台安全风险
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的运营风险画像由分层架构决定：Polygon 网络上的智能合约、用于市场裁决的 UMA Protocol Optimistic Oracle、桥接这些系统的自定义 adapter
              合约，以及用于内部补款和奖励分发的运营钱包。过去 15 个月，每一层都独立产生过重大安全事件，形成反复基础设施漏洞的模式。

              最新事件发生在 2026 年 5 月 22 日，Polymarket 位于 Polygon 的 UMA CTF（Conditional Tokens Framework）Adapter 流失
              $660,000。链上调查员 ZachXBT 标记了该攻击，Bubblemaps 追踪到资金以大约每 30 秒 5,000 POL 代币的速度流出。Polymarket 在 Discord
              消息中确认事件，并归因于内部补款操作使用的一把私钥被攻破，而非智能合约代码漏洞。公司称用户余额和活跃市场结算未受影响；但事件暴露了结构性风险：UMA CTF Adapter 是 Polymarket
              编写的自定义集成代码，不属于 UMA 经审计核心协议，因此其安全完全由 Polymarket 负责。PeckShield 独立确认资金流入 ChangeNOW；该非托管交易所使追回更复杂。

              更严重的先例出现在 2025 年 3 月。当时一名单一参与者据称控制约 25% UMA 投票权，强行让一个 $7 million 预测市场结算为「Yes」，尽管底层事件并未发生。SettleRisk
              分析量化了结构性预言机风险：UMA 的 2 小时争议窗口给快速变化事件带来结算风险，UMA 代币持有人集中让治理操纵可在不触发传统欺诈检测的情况下发生。2025 年 12 月，Polymarket
              还单独确认，第三方认证提供商漏洞被利用后，用户资金受损。

              市场诚信层面，Solidus Labs 2026 年 4 月取证报告《Polymarket Under the Polygraph》记录，仅 2024 年美国大选市场就有 $253 million
              名义总额刷量交易，占选举市场总交易量 15%。报告识别出「跨标的刷量交易」这种预测市场特有策略：在互斥结果之间用 delta-neutral 头寸制造人工交易量；还发现不到 1% 的钱包攫取了 Politics
              类别近 50% 利润。高级多链取证识别出代理钱包集群，用来掩盖身份并利用地缘政治事件中的非公开信息。Polymarket 2026 年 3
              月市场诚信更新——禁止内幕交易、刷量交易、诱骗挂单和抢跑——以及其美国交易所的 National Futures Association（NFA）Regulatory Services Agreement
              是缓解措施；但全球平台的匿名链上架构限制了执法效果。
