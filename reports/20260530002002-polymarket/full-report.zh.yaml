      - number: '3.2'
        title: 直接竞争对手——Kalshi 与受监管同业
        blocks:
          - type: paragraph
            body: >-
              Kalshi 是 Polymarket 最重要的直接竞争对手，并已按名义交易量超过 Polymarket，成为全球最大预测市场。Kalshi 由 Tarek Mansour 和 Luana Lopes Lara
              于 2019 年创立，总部位于纽约市，是美国首个面向事件合约的 CFTC 指定合约市场（DCM）。公司在 2026 年 3 月完成由 Coatue Management 领投的 $1 billion F 轮，估值
              $22 billion——是其 2025 年 12 月 $11 billion 估值的两倍——已披露累计融资约 $2.8 billion。Bloomberg 在 2026 年 3 月轮次时引用的年化收入为
              $1.5 billion。

              Kalshi 的交易量爆发式增长。截至 2026 年 4 月 20 日，Kalshi 年初至今处理 $37.49 billion 名义吃单成交量，而 Polymarket 为 $29.23 billion。仅
              2026 年 4 月，Kalshi 月度名义交易量达 $14.8 billion，对比 Polymarket 国际业务 $9.0 billion 加美国业务 $1.26 billion。Kalshi
              的吃单费公式为 0.07 × C × P × (1 − P)，在中间价（50 美分）合约上最高；挂单费为 0.0175 × C × P × (1 − P)。虽然每笔交易隐含全成本约 0.5–1.2%，但
              Kalshi 与 Robinhood 的合作——后者以每份合约 $0.01 将交易直接路由至 Kalshi 基础设施——给了它相对 Polymarket 依赖加密钱包开户的巨大分发优势。

              Polymarket 自有 CFTC 监管美国实体（QCX LLC）于 2025 年 12 月通过候补名单制 iOS 上线，但 2026 年 4 月仅录得 $1.26 billion 成交量，而 Kalshi
              美国成交量为 $14.8 billion，说明 Kalshi 的先发和分发优势短期内很耐久。PredictIt 是传统政治预测市场，在 CFTC 不采取行动函框架下运营，并受每份合约 $850
              上限限制；其运营控制权在 2025 年 7 月从 Victoria University of Wellington 转移至美国 Prediction Market Research
              Consortium，但仍是研究导向平台，规模有限，监管基础脆弱。
