  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Polymarket 所处的预测市场行业正在快速扩张，2024 年中至 2026 年初交易量增长超过 17 倍。Pew Research Center 基于 The Block 数据的分析显示，Kalshi 与
              Polymarket 的全球月度合计交易量从 2025 年 9 月不到 $5 billion，跃升至 2026 年 4 月约 $24 billion。整个预测市场的月活用户从 2024 年初约 4,000 人增至
              2025 年末超过 600,000 人。

              竞争格局分为四层。第一层是真金白银事件合约交易的直接同业：Kalshi（CFTC 监管的 DCM，聚焦美国）和 Polymarket US（QCX
              LLC，公司自有受监管美国实体）。第二层是进入事件合约交易的相邻体育投注替代者：DraftKings Predictions 和 FanDuel Predicts，二者都通过 CFTC
              持牌基础设施以活跃做市商身份运营。第三层是满足预测这一待完成任务、但不涉及真钱的现状信息替代品：Manifold Markets（虚拟币，全球）和
              Metaculus（积分制，专业化）。第四层是传统和新兴替代者，包括 PredictIt（CFTC 不采取行动，仅政治市场），以及由 Predict.fun（2026 年 4 月月度交易量
              $579M）、Opinion（$376M）和 Limitless（$205M）领头的长尾链上交易场所。

              在这套格局中，截至 2026 年 4 月，Kalshi 和 Polymarket 分别控制约 65% 和 35% 的全球交易量；而 2024 年 12 月 Polymarket 曾占行业交易量约
              95%，局面几乎完全反转。这一结构性迁移直接来自 Kalshi 的 CFTC 监管护城河和 Robinhood 分发，使竞争护城河的耐久性成为 Polymarket 投资逻辑的核心尽调问题。根据 CNBC
              报道引用的 Bank of America 报告，截至 2026 年 2 月，Kalshi 约占美国受监管预测市场活动的 90%。
