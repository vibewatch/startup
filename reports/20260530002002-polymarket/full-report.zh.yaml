      - number: '5.2'
        title: 智能合约基础设施与 CLOB V2
        blocks:
          - type: paragraph
            body: >-
              Polymarket 链上架构建立在 Gnosis Conditional Token Framework（CTF）之上；这是在 Polygon mainnet（Chain ID 137）上把事件结果代币化为
              ERC-1155 代币的标准。核心合约包括 CTF Exchange V2 (0xE111180000d2663C0091e4f400237545B87B996B)，负责运营方驱动的订单撮合与结算；以及
              Conditional Tokens contract (0x4D97DCd97eC945f40cF65F87097ACe5EA0476045)，负责结果份额的拆分、合并和赎回。带有相互关联 Yes/No
              分支的多结果市场由 Neg Risk CTF Exchange (0xe2222d279d744050d28e00520010520000310F59) 处理。

              2026 年 4 月基础设施改造（4 月 7 日宣布，4 月 28 日上线）是平台上线以来最重大的变更。CLOB V2 取代 V1 撮合引擎，吞吐量从 V1 的每秒 800-1,200 笔提升到 10,000+
              笔订单，订单撮合延迟从 800-2,000 ms 降至 80-150 ms，单笔交易 gas 费从 $0.15-$0.45 降至 $0.02-$0.08。CTF Exchange V2 新增 EIP-1271
              支持（让机构交易者可使用多签和智能合约钱包）、用于链上 API 归因的 builder 代码，以及带代理可升级性的简化订单结构。

              与此同时，Polymarket 将抵押品从 bridged USDC.e 迁移到 pUSD（Polymarket USD），一种由 Circle USDC 1:1 支持的自研稳定币。pUSD Collateral
              Onramp 合约 (0x93070a847efEf7F70739046A929D47a521F5B8ee) 负责转换；web 前端用户只需一次授权提示。pUSD 仅是抵押工具，不是可交易资产；引入 pUSD
              让平台不再依赖 Polygon-to-Ethereum 桥接稳定币，降低桥接对手方风险。Polymarket CMO 已确认 POLY 治理代币空投（2025 年 10 月），但仍等待完整美国消费者端推出。
