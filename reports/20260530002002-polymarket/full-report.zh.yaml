      - number: '4.3'
        title: 成本结构、资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Polymarket 披露的成本结构由三类可识别支出主导：监管和重返美国市场成本、用户激励计划、员工扩张。2025 年 7 月，公司斥资 $112 million 收购 CFTC 注册的指定合约市场 QCX
              LLC，以打开合法美国业务。平台同时通过向用户持有的 USDC 头寸支付 4% 年化收益来补贴流动性；这是一个负利差项目，只有 Treasury 收益管理跑赢 4%，才不会摊薄资本。2026 年全球员工数约
              241 人，招聘潮覆盖工程、合规和市场运营等受监管美国实体所需职能。

              近期资本充足性很强。ICE 的 $2 billion 战略投资承诺（其中 $600 million 已在 2026 年 3 月作为 Series E 部署）提供了强流动性后盾。各轮累计融资约 $2.3
              billion。据报道，截至 2026 年 4 月，Polymarket 正洽谈以 $15 billion 估值再融资 $400 million，这可能把 Series E 总额推至 $1
              billion。月度烧钱速度未披露，但基于员工数、激励计划和平台基础设施成本，估计超过每月 $8 million。按这个速度，2026 年 3 月部署的 $600 million 意味着在计入 2026 年 4
              月开始流入的费用收入前，现金跑道已远超五年。宽裕资本降低了近期融资风险，但 Polymarket $9–$15 billion 的估值要求收入显著加速——当前 $300 million
              年化收入运行率，对应近期估值锚点隐含 30–50x 收入倍数。
