          - type: callout
            title: 州管辖拼图——Massachusetts 诉讼是风向标
            body: >-
              Polymarket 于 2026 年 2 月对 Massachusetts 提起的联邦诉讼（QCX LLC v. Campbell），是公司史上风险最高的法律程序。若 Polymarket
              败诉，将确认各州有权要求 CFTC 注册预测市场取得博彩牌照，触发 49 州牌照级联要求；结果要么通过地理围栏割裂美国市场，要么需要投入高到难以承受的合规成本。Third Circuit 在 2026 年 4 月
              KalshiEX v. Flaherty 案中支持体育合约的联邦优先适用，但 Massachusetts 案不同，First Circuit 尚未处理这一问题。Wisconsin、Nevada、New
              Jersey 的活跃州诉讼叠加放大风险，形成多线法律敞口；即便 Polymarket 符合 CFTC 要求，美国业务仍可能被实质压缩。
