      - number: '4.5'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的财务呈现出有吸引力的近期货币化故事，同时伴随严重的结构性披露缺口。对预测市场而言，收费架构设计合理：按概率定价从不确定（也就更活跃）的市场提取更多价值，同时对高确信度头寸保持友好。如果
              $300 million 年化收入运行率能维持，就构成可信的货币化基础。但收入质量脆弱：平台在 33 个国家被屏蔽，在 11 个美国州面临法律行动，收入基础集中在一小群专业交易者手里。Bloomberg 2026
              年 4 月报道称，Polymarket「因延迟和反弹失去预测市场领先地位」，突出了收费上线错误和治理争议带来的声誉风险。

              资本充足性很强，ICE 数十亿美元承诺提供长现金跑道；但 Polymarket 当前 $9–$15 billion
              估值押注收入增长，而增长同时需要监管扩张和持续交易量，两者都没有保证。核心尽调阻碍包括缺少审计财务、总烧钱速度未披露、ICE 数据授权经济性未披露，以及 CAC 或队列留存数据没有公开披露。POLY
              代币推出增加了可选性，也带来代币证券风险和执行依赖，公开证据不足以承保。本章结论是：Polymarket 财务模型有前景，但以当前估值做高确信度承保，透明度还不够。
