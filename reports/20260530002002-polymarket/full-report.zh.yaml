      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 3 月，Polymarket 已通过至少八次融资事件累计募资约 $2.9 billion。融资轨迹从 2020 年 7 月 $4 million 种子轮开始，到 2026 年 3 月 $600
              million E 轮；其间最具转折性的是 2025 年 10 月 Intercontinental Exchange 承诺投入的 $2 billion D 轮战略资金，确定 $9 billion 投前估值，也让
              Polymarket 跻身全球估值最高的私营金融科技公司之一。

              2024 年 5 月，Founders Fund 和 Dragonfly 领投 B 轮，Vitalik Buterin、1confirmation 和 ParaFi
              参与。这个轮次是机构风险资本押注此前加密原生项目的转折点。到 2024 年 10 月，公司又完成 $90.9 million C 轮，反映 2024 年 11 月美国大选周期前的增长。2025 年 7 月
              $135 million D 轮分批融资在 QCEX 收购前不久落地；2025 年 8 月，由 1789 Capital 领投的一轮未披露融资把 Polymarket 在 ICE 交易前推到 $1 billion
              投后估值。

              ICE 合作既是财务投资，也是战略合作：ICE 作为 Polymarket 事件数据面向机构交易台的全球分销方，把预测市场情报接入其更广的市场基础设施。2026 年 3 月，ICE 再次领投 $600
              million E 轮，进一步加深这层关系。2026 年 1 月的老股交易隐含最高 $11.6 billion 估值；TechStack IPO tracker 在 2026 年 5 月给出的估计为 $9.6
              billion。截至 2026 年 4 月下旬，据报道公司正洽谈一轮 $400 million 融资，估值 $15 billion。收入未公开披露；按 2026 年 Q1 $26.2 billion 成交量和
              2% 净盈利收费结构测算，理论手续费池很大，但实际抽佣率、成本和利润率仍未公开。
