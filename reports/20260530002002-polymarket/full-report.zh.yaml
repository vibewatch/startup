      - number: '4.4'
        title: 单位经济与利润率分析
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的单位经济可以用公开数据部分重建，但关键仍取决于未披露的私人财务数据。收入端，按分析师估算，混合有效吃单费率约为名义总交易量的 0.7%。在 30 天交易量 $9.55 billion
              下，这意味着每 30 天约 $66.9 million 总费用；其中 20–50% maker 返佣返还给流动性提供者，净留存收入估计为每月 $33–53 million。这个估算与分析师引用的每月 $25
              million 之间的差距，可能来自返佣拖累和类别组合影响。

              成本端，Polymarket 单笔交易交付成本结构性很低：Polygon gas 费低于每笔 $0.01，基于智能合约的结算不需要托管基础设施。因此，在扣除 maker 返佣、4%
              用户收益、平台开发、合规和人员成本之前，费用收入流理论毛利率可超过 80%。专业和算法交易者估计仅占用户 2%，却贡献约 90%
              交易量；这种集中度制造了显著收入脆弱性——该群体的激励一旦变化（竞争性费率侵蚀、监管限制、替代平台），交易量可能迅速收缩。分层获客成本和 LTV 尚未公开量化，限制了对持续增长的承保能力。
