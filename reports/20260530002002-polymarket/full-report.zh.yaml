      - number: '6.5'
        title: 扩张、集中度与推荐动态
        blocks:
          - type: paragraph
            body: >
              Polymarket 2026 年扩张策略把重新设计的推荐计划和 Builder Program 作为主要社区获客渠道。推荐计划在引入交易费后于 2026 年初更新推出，向直接推荐人支付被推荐用户 180
              天内产生净交易费的 30%，并支付二级间接推荐费用的 10%。资格要求为生命周期交易量达到
              $10,000，这实际上把推荐渠道限制在有经验的高交易量交易者，而非休闲参与者——这是有意设计，用来把获客成本直接绑定到收入生成，并过滤低活跃推荐人。此前固定 $10
              注册奖励已停止；按绩效分成的模型商业上更站得住，但也把获客权力集中到既有高阶交易者队列。集中风险显著：前 10 个交易 bot 合计贡献大多数程序化交易量；最大单一 bot（Betmoar）单独控制
              Builder Program 可归因流量约 42%。这种动态让一小群成熟参与者对流动性深度、价差收窄和价格发现质量拥有超额影响力——优势不成比例地流向拥有资本、低延迟基础设施和 API
              专长的用户。对手工零售参与者而言，高流动性市场因此形成逆向选择环境。地域扩张部分受监管摩擦约束：Nevada 对体育、娱乐和选举合约维持法院命令限制；多个欧洲司法辖区限制访问；OFAC 制裁地区永久屏蔽。CFTC
              监管的美国产品扩大了国内访问，但维持单独 KYC 要求，并受持续州级诉讼约束。
