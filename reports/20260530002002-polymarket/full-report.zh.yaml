      - number: '8.3'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的投资逻辑建立在五个相互勾连的判断上。第一，Polymarket 已在一个跨过生死级监管和流动性门槛的类别里建立结构性领先：公司通过 QCX LLC 持有 CFTC
              指定合约市场牌照，并在全球运营，峰值月交易量超过 $10 billion，注册用户超过 13 million。第二，ICE 的 $2 billion
              承诺，是预测市场类别迄今最可信的机构背书，也提供长期资本充足性、监管信誉和机构分销渠道，竞争对手很难复制。第三，收费上线验证了付费意愿：引入手续费后，专业交易者仍以有意义的交易量留在平台，证明平台流动性深度以及市场需求缺乏弹性。第四，计划在
              2026 年推出的 POLY 治理代币提供第二层变现，可能在不追加资本投入的情况下创造质押收入。第五，借助 ICE 机构分销产生的相邻数据授权机会——“Signals and Sentiment”
              数据流——可能形成高毛利、经常性收入流，且结构上不随交易量周期同步波动。

              反向逻辑同样具体。第一，支撑 $20 billion 估值的证据只包括两个月收费后收入数据、二级市场价格和 ICE 的战略投资理由——没有一项构成经审计财务证明。第二，Columbia University
              研究（2025 年 11 月）发现，Polymarket 历史交易量中约 25% 是人为刷量交易，2024 年 12 月峰值达到 60%。如果手续费上线永久性减少的是刷量，而不只是总交易量，披露 GMV
              会下降，手续费运行率也会随之下降。第三，DOJ 和 CFTC 在 Polymarket 市场上执行内幕交易案件（2026 年 4 月），说明平台的事件交易模型带来传统交易所不面对的持续监管敞口。第四，ICE
              23% 的持股造成治理集中和潜在战略错位：未来 ICE 的优先事项（数据授权、代币化）可能偏离独立股权价值最大化。第五，Polymarket 收入高度集中于政治和宏观事件；2024
              年大选后的后遗症曾让月交易量显著下降，之后才恢复——这一模式很可能重演。
