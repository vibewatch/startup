      - number: '5.3'
        title: 预言机裁决与结算机制
        blocks:
          - type: paragraph
            body: >-
              Polymarket 使用 UMA Protocol 的 Optimistic Oracle（2025 年升级至
              MOOV2）做去中心化、无需许可的市场裁决。每个市场都会预先指定结算标准（结算来源、结束日期、边界情形处理），并随市场问题一起发布。市场关闭后，白名单提议者缴纳 $750 USDC
              保证金并在链上提交结果。提议会在 2 小时挑战窗口内被「乐观地」视为正确。若期间无人争议，市场自动结算，获胜代币可按每枚 $1.00 兑付为 pUSD。

              若有人提出争议，提议者保证金作废，并进入新一轮提议。第二次争议会把问题升级至 UMA 的 Data Verification Mechanism（DVM），由 UMA 代币持有人用 Schelling-point
              机制投票（多数决定）。DVM 投票通常在 48-96 小时内完成。根据 SettleRisk 2026 年 2 月定量分析，超过 98.5% 的 Polymarket 市场在单次提议周期内干净结算，无需升级至
              DVM。升级到 DVM 投票的 1.5% 通常是模糊事件、存在争议的地缘政治结果，或结算标准表述含糊的案例。

              经 OpenZeppelin 审计的 UMA CTF Adapter 将 UMA 预言机结果桥接进 CTF，以便获胜条件代币赎回。这套结算基础设施实质上依赖 UMA 代币持有人治理；若鲸鱼集中度允许协同操纵
              DVM 投票，就会形成系统性风险。SettleRisk 对 2025 年 3 月一个 $7M 市场因治理博弈而错误结算的分析记录了这一担忧。相对大规模市场利益，$750 保证金并不高；持有足够 UMA
              代币的成熟参与者可能利用措辞模糊的市场。
            claimRefs:
