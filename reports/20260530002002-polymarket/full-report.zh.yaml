          label: 估值评估
          description: $9B–$20B 区间 = 30–67x 前瞻收入；成熟交易所可比公司 7–17x；溢价尚未被数据证明
        - id: n7
          label: 观察——有条件上调
          description: $20B 不可操作；若估值 $8–10B、拿到经审计财务和 6+ 个月收费后数据，可重新评估
      edges:
        - from: n1
          to: n6
          label: 大 GMV 基础支撑收入规模叙事
        - from: n2
          to: n6
          label: 监管证明降低一刀切关停风险
        - from: n3
          to: n6
          label: 两个月收费数据不足以完整承销
        - from: n4
          to: n6
          label: ICE 提供机构底盘和可信度溢价
        - from: n5
          to: n6
          label: 风险因素要求对未调整倍数打折
        - from: n6
          to: n7
          label: 估值偏高叠加收入历史太短，导向观察
