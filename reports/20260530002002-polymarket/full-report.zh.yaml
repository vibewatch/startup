      - number: '5.5'
        title: 合规、安全与信任基础设施
        blocks:
          - type: paragraph
            body: >-
              Polymarket US（QCX LLC）于 2025 年 11 月获得 CFTC 修订指定令（Amended Order of Designation，经 PR Newswire 宣布），成为继 Kalshi
              之后美国第二个持有指定合约市场（DCM）资质的预测市场。根据修订命令，Polymarket 建设了更强的市场监控系统、市场监管政策、清算程序和 Part-16 监管报告能力。美国参与者只能通过
              FCM（Futures Commission Merchant）中介访问平台，并完成完整 KYC 与 AML 验证；在 DCM 架构下，美国用户无法直接用钱包访问。polymarketexchange.com
              的监管页面发布了完整规则手册、风险披露声明和交易所会员申请材料，符合 Commodity Exchange Act（商品交易法）要求。

              安全侧，核心 CTF 交易合约已由 ChainSecurity（V1）以及 Quantstamp 和 Cantina（V2，2026 年 3 月）审计。ChainSecurity
              审计认为其具备「高安全水平」，功能正确性和签名处理充分。Cantina 托管的漏洞赏金计划持续激励负责任披露。

              2026 年 5 月 22 日，链上调查员 ZachXBT 标记了 Polygon 上 Polymarket 的 UMA CTF Adapter 邻近地址可疑流出。合计流失约 $520,000 到
              $660,000 的 POL 代币和 USDC.e。Polymarket 工程副总裁 Josh Stevens
              确认，这不是智能合约漏洞，而是一把使用六年的内部后端「refiller」钱包私钥被攻破；该钱包用于流动性补充。与该密钥绑定的所有权限已撤销；用户交易余额和市场结算未受影响。但事件暴露出重大的运营安全缺口：带特权访问的历史管理密钥在不再需要时没有轮换或退役，也没有链上监控触发早期发现。事后，安全专家呼吁对所有预言机邻近地址实施更严格的密钥生命周期管理和持续链上监控。
