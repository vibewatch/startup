  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与费率架构
        blocks:
          - type: paragraph
            body: >-
              2026 年 3 月，Polymarket 从零费率交易切到按概率计算的吃单费制，收入模型发生了最关键的结构变化。此前，平台累计撮合 $23.5 billion
              交易量，却没有披露任何协议收入。零费率是有意为之：先把全球交易量、流动性深度和用户获取做起来，再等待货币化时点。这个时点在 2026 年 3 月 30
              日到来，吃单费扩展到大多数市场类别，包括金融、政治、经济、文化、天气和科技。地缘政治和全球事件市场则永久免收费用。

              费用公式按概率计算：fee = C × p × feeRate × (p × (1 − p))^exponent，其中 C 是份额数量，p 是份额价格（即隐含概率），feeRate
              是按类别设置的常数，exponent 控制价格越接近两端时费用下降的斜率。市场交易价接近 $0.50（最大不确定性）时费用最高，接近 $0.01 或 $0.99
              时趋近于零。这个结构奖励高确信度头寸，却让不确定市场处于劣势——这恰恰是平台交易最活跃、流动性最深的板块。

              费率表按类别分层：crypto 市场峰值费率 1.80%，体育 0.75%，金融和政治约 1.75%。Maker 订单（限价单）按日获得 USDC 返佣，金额为已收取吃单费的
              20–50%，具体取决于类别。由此形成双层成本结构：专业流动性提供者被补贴，零售吃单用户承担完整费用。次级收入流包括隐性 AMM 价差捕获（归入 Treasury）、Treasury USDC
              收益管理（必须超过支付给用户的 4% APY 才能自我维持），以及正在形成的 ICE 机构数据授权渠道。POLY 治理代币已确认 2026 年推出，预计会引入质押模型，把部分费用收入导向代币持有人。
