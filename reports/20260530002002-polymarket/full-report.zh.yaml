  - id: FI001
    title: 收入模型桥——从用户活动到毛利
    type: flow
    layout: standard
    summary: 展示用户交易活动如何通过 Polymarket 的费用架构流向总手续费收入和净留存收入，并纳入挂单方返利和国债收益。
    data:
      nodes:
        - id: user-trade
          label: 用户执行吃单交易
          description: 吃单方支付基于概率的费用；fee = C × p × feeRate × (p(1-p))^exp
        - id: gross-fee
          label: 收取吃单方总手续费
          description: GMV 综合费率约 0.7%；加密品类在接近 50% 概率时峰值 1.80%
        - id: maker-rebate
          label: 分发挂单方返利
          description: 20–50% 的吃单方费用以每日 USDC 返还给流动性提供者
        - id: net-fee-revenue
          label: 留存净手续费收入
          description: 留存吃单方总手续费剩余约 50–80%；估计月度约 $15–22M（2026 年 4 月）
        - id: treasury-yield
          label: USDC 国债收益
          description: 用户存入抵押品赚取 >4% APY；超过 4% 的净收益支付给用户
        - id: gross-profit
          label: 毛利池
          description: 净手续费 + 国债净收益；用于支付运营费用和 POLY 质押（未来）
      edges:
        - from: user-trade
          to: gross-fee
        - from: gross-fee
          to: maker-rebate
        - from: gross-fee
          to: net-fee-revenue
        - from: net-fee-revenue
          to: gross-profit
        - from: treasury-yield
          to: gross-profit
    approximationNotes: 节点数值基于截至 2026 年 3–4 月的分析师预测估计。挂单方返利比例随品类变化（20–50%）。 国债收益净利差未披露。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI010
      - CI011
