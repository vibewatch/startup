      - number: '3.4'
        title: 能力、定价与监管对比
        blocks:
          - type: paragraph
            body: >-
              按购买标准比较 Polymarket、Kalshi 和替代平台，可以看到监管状态、访问模式和费率架构存在明显结构差异。Polymarket 全球平台只对净盈利收取 2%
              手续费——亏损不收费，因此这种费率结构有利于胜率中等的活跃交易者。美国业务（QCX）采用挂单 / 吃单交易所模式，加密合约吃单费最高 1.56%，体育合约最高 0.44%，并提供挂单返佣。Kalshi
              按风险头寸收费，公式为 0.07 × C × P × (1-P)，在高确定性合约（接近 $0.01 或 $0.99）上的有效成本更低，但在中间价更高，因此对持有高确信度仓位的信息优势交易者来说，Kalshi
              在结构上更便宜。

              最关键的差异在于监管访问和法币入金。Kalshi 接受 ACH 和借记卡入金（借记卡费率 2%），而 Polymarket 全球平台需要加密钱包和 USDC，给美国主流零售用户制造摩擦；Robinhood 由
              Kalshi 驱动的产品则把这道摩擦完全抹掉。Manifold 不收费，但也没有真钱权益。PredictIt 对净利润收取 10%，另收 5% 提现费，是竞争组中最高，并且仅限政治市场。传统体育投注平台隐含
              4–5% 抽水（vig），对信息优势交易者构成很高的有效成本劣势，但对重视串关、滚球和奖金、以娱乐为导向的体育投注者来说，仍是默认选择。

              能力广度上，Polymarket 运营约 1,200+ 个实时市场，覆盖政治、体育、加密和经济，其全球成交量中政治占 32%、体育占 39%。Kalshi 覆盖面相近，但明显偏向体育（占其成交量 80%），宏观
              / 经济指标覆盖更深。两家平台都不支持用户自建市场；Manifold 是唯一开放市场创建的玩家，因此覆盖了长尾小众话题。
