  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻市场
        blocks:
          - type: paragraph
            body: >
              预测市场构成一个独立金融品类。参与者交易二元或标量事件结果合约，价格反映群体聚合概率。核心市场覆盖政治事件、宏观经济数据发布、体育结果，并越来越多覆盖天气、AI
              里程碑和流行文化话题。本章纳入的支出是名义交易量——买卖合约的美元价值——不是收入或平台抽成；这个差别对市场规模比较很关键。

              主要现状替代品包括在线体育投注（用于体育结果投机）、传统金融衍生品（用于宏观 / 利率对冲），以及非正式民调或预测服务（用于信息买家）。在线体育博彩在 2026 年的总投注额达到 $49.74
              billion，预计到 2031 年增长至 $92.49 billion，CAGR 为 13.21%；预测市场体育合约在 18-49 岁人群中直接争夺这笔支出。更广义的全球在线博彩市场在 2026 年约 $143
              billion，构成相邻市场上限。

              核心预测市场定义不包括传统金融交易所产品（期货、指数和商品期权），即使这些产品与结果挂钩；也不包括未按交易所规则运营的非监管离岸博彩平台。监管边界有直接商业意义：CFTC 于 2026 年 3 月 12
              日发布拟议规则制定预告（ANPR），明确把事件合约归类为受 Commodity Exchange Act 管辖的衍生品，从制度上将其与州赌博法分开。2026 年 3 月 24 日启动的 CFTC
              Innovation Task Force 正在制定全面联邦框架。14 个美国州的法律争议和 Kalshi-Nevada 上诉战仍在推进，可能收窄或扩大有效美国 SAM。
