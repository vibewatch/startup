chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与产品
        blocks:
          - type: paragraph
            body: >-
              Polymarket 是一家基于区块链的预测市场平台，2020 年 6 月由 Shayne Coplan 创立。Coplan 出生于纽约市，曾从 New York University
              退学，转而投入预测市场和区块链技术。平台最初在 COVID-19 疫情早期以 Union.market
              之名上线，设想是通过给现实事件定价、激励准确预测来对抗错误信息。之后，覆盖范围从疫情扩展到政治、体育、经济、科技和娱乐，平台也更名为 Polymarket。

              公司总部位于纽约市，主要以在线预测市场平台运营，建在 Polygon 网络上——一条 Ethereum 二层扩容链——并以 USDC 计价和结算。这套技术栈让 Polymarket
              相比更早的区块链预测平台拿到几个实质优势：交易成本更低、结算更快、美元计价更清晰。非托管架构意味着智能合约会自动执行赔付规则；结果由去中心化预言机协议 Universal Market
              Access（UMA）验证，该协议通过代币持有人投票裁决有争议的结算。

              Polymarket 的商业模式是对净盈利收取 2% 手续费，用户在亏损或按中间价成交时不付费。公司正在探索来自机构合作伙伴和媒体机构的媒体与数据授权收入。2025 年 10 月 ICE
              投资之后，Polymarket 的数据和市场价格开始流入 ICE 的机构网络，给交易手续费之外的系统性数据服务收入打开路径。截至 2026 年 5 月，平台通过 polymarket.com
              面向全球运营，并通过美国实体 Polymarket US（QCX LLC）服务美国用户；QCX LLC 是受 CFTC 监管的指定合约市场，2025 年 12 月通过候补名单制 iOS 发布并完成全量 KYC
              验证。
