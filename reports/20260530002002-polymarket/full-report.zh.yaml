      - number: '6.2'
        title: 采用轨迹与事件驱动增长
        blocks:
          - type: paragraph
            body: >
              Polymarket 的增长轨迹与高关注度全球事件紧密绑定，尤其是美国选举。2024 年美国总统大选是平台历史上最关键的增长催化剂：2024 年 11 月月交易量创下 $1.2 billion 纪录，选举市场占
              Q4 2024 全部交易量的 65%（在 $4.5+ billion 累计生命周期交易量中贡献 $2.8 billion），选举日 DAU 达到 250,000 峰值。2024 自然年独立交易者总数达到 1.2
              million，较 2023 年约增长 500%。截至 2026 年 4 月，历史累计钱包地址约 2.5 million。平台被 Harvard Law 引用的一项学术研究发现，在 2024 年 2 月至
              2026 年 2 月的两年窗口内，约 50,000 个独立钱包地址活跃于 93,000 个不同市场，说明除选举季峰值外仍有可持续活跃基础。选后，交易量较峰值下滑约
              60%；这符合所有预测市场的模式。但平台向体育、crypto 价格市场、AI 和娱乐等多类别扩张，帮助日常交易量维持，而非回落到选前低点。到 2026 年初，仅政治市场每月就产生 $350 million
              交易量，挂牌活跃政治合约超过 1,600 个。2025 年末推出的 CFTC 监管美国产品，在全球 Polygon 平台之外增加了一条受监管的国内渠道，扩大了总可触达用户基础。
