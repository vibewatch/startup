      - number: '8.2'
        title: 收入证据和隐含估值倍数
        blocks:
          - type: paragraph
            body: >-
              对估值分析而言，Polymarket 从零手续费协议转为创收交易所，是最核心的收入进展。2026 年 3 月 30 日之前，尽管累计促成超过 $23.5 billion 交易量，Polymarket
              未披露任何协议收入。2026 年 3 月 30 日，平台把吃单手续费扩展到多数类别，采用按概率加权的公式：中等概率（不确定性最高）时费率最高，接近确定结果时费率趋近零。在 $9.55 billion 30 日
              GMV 基础上，日手续费收入立即达到 $800,000 至 $1 million。

              2026 年 4 月，Polymarket 总手续费收入为 $43.36 million；若能维持，年化运行率约 $520 million。更保守的 3–4 月均值对应 $300–340 million
              年化估计，也是覆盖该平台的分析师最常引用的数字。Polymarket 声称捕获链上预测市场手续费收入的 97% 以上。挂单返佣为吃单手续费的
              20–50%（按类别不同），会把总收入压到一个未披露的净额；Treasury USDC 收益部分还要求 4%+ APY 才能覆盖用户收益承诺，进一步增加净留存经济性的未知数。

              按 2025 年 10 月 $9 billion 估值和 $300 million 年化运行率计算，隐含前瞻收入倍数约 30x——大约是成熟受监管交易所交易区间的 2–3 倍（Coinbase
              7.6–9x、CME Group 16.7x、Robinhood 15x）。按 $20 billion Series E 目标和 $520 million 运行率计算，倍数约 38x；按报道的 $15
              billion 替代目标计算，约 29x。把 CME 16.7x P/S 倍数套到 $520 million 运行率上，当前公允价值约 $8.7 billion——仍低于 2025 年 10 月估值。套用
              Robinhood 15x P/S 倍数，则为 $7.8 billion。交易所板块里，只有早期超高速增长平台的三位数倍数能支撑当前估值；而 Polymarket
              由于已取得主导市场地位，实际上已过了这一阶段。因此，市场正在为当前手续费经济性之外的结构性增长定价：代币发行收入、扩大的数据授权、机构产品开发，以及美国市场准入常态化后交易量复利增长。
