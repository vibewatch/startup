      - number: '3.5'
        title: 切换成本、护城河耐久性与反向竞争动态
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的竞争护城河建立在三根支柱上：全球流动性深度、品牌和媒体数据集成，以及低费率全球平台。2026 年 4 月，Polymarket 未平仓量为 $449.9 million，独立交易者
              678,342 人——约为估计 Kalshi 活跃用户数的 8 倍——同时产生 $29.2 million 平台手续费收入，超过 Kalshi 的估计名义手续费收入。$150 billion
              的累计合计交易量验证了预测市场已成为既有金融基础设施。Polymarket 与 X（Twitter）、Dow Jones、UFC 的价格流集成合作，以及 ICE
              投资带来的机构网络数据入口，构成小型竞争者难以快速复制的分发优势。技术层面的交易者切换成本很低——用户只需要另一个钱包或账户——但实践中的成本很高：Polymarket
              的流动性深度和市场广度创造了执行优势，成熟交易者离开会承担实质滑点成本。平台在 2026 年 4 月处理 87.4 million 笔交易，说明高参与度正在强化使用习惯。不过，Polymarket 63%
              的交易量来自仅 0.23% 的钱包，显示专业和机构交易者高度集中，而这类用户多平台使用风险更高。

              最重要的反向动态是刷量交易、内幕交易执法和国会审查。CFTC 于 2026 年 4 月 23 日提起首起事件合约内幕交易投诉，指控美国陆军士兵 Gannon Ken Van Dyke 利用 Operation
              Absolute Resolve 的机密信息，在 Polymarket 获利超过 $404,000。DOJ 并行起诉其电汇欺诈、商品欺诈和洗钱。Columbia University
              研究人员估计，Polymarket 过去三年最高 25% 的交易量可能属于刷量交易；2024 年 12 月刷量交易峰值达到总量的 60%，历史体育市场交易量中 45% 也可能为刷量。Polymarket
              已通过交易费和增强监控应对，但该问题削弱了其面向机构买家的信任叙事。Kalshi 在华盛顿投放了明确区隔自己的广告：「我们禁止内幕交易」「我们不做死亡市场」「我们按美国法律运营」。CFTC 主席 Selig 在
              2026 年 1 月 29 日 Project Crypto 峰会上宣布议程，要「支持事件合约市场负责任发展」；CFTC 于 2026 年 3 月正式把预测市场合约归类为衍生品，这项裁定把 Kalshi
              既有运营结构法典化，也给受监管平台更多机构合法性。州层面法律挑战包括 Arizona 对 Kalshi 提出 20 项刑事指控、Nevada 限制（Ninth Circuit 为临时限制令放行），以及 New
              Jersey 挑战在 4 月被联邦上诉法院驳回；这些都说明 Polymarket 与 Kalshi 仍面对联邦和州并存的监管现实。OpenSecrets 数据显示，Kalshi 2025 年在华盛顿游说支出为
              $615,000，Polymarket 为 $360,000，说明监管竞争投入正在升级。
