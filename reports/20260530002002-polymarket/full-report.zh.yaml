      - number: '8.5'
        title: 退出准备度和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              ICE 关系显著提高了 Polymarket 的退出准备度，因为它提供 IPO 最重要的两个前置条件：机构信誉和金融基础设施。ICE 是 NYSE 的母公司，而 NYSE 是全球最大交易所；ICE 持续投资也让
              Polymarket 更像合作伙伴，而不是寻找传统承销商的创业公司。二级市场材料提及的初步 IPO 时间线指向 2026 年底，这会与 POLY
              代币发行对齐，并形成公开股票市场和代币的双重流动性事件。不过，Polymarket 尚未提交 S-1，尚未公开披露经审计财务，也未宣布具体上市交易所。缺少这些前置条件，让 2026 年底 IPO
              显得激进，但并非不可能。

              POLY 代币空投（CMO 已原则确认，且 2026
              年提交了“POLY”和“$POLY”商标申请）给股权投资者带来重大股权结构表复杂性：如果代币被设计成收入分享或治理工具，它可能把手续费收入导向代币持有人，而非股权股东，从而稀释股权的经济价值。代币经济、归属安排，以及股权持有人与代币持有人之间的分配，均未公开披露。

              据估计，Series E 后创始人 Shayne Coplan 个人持有 Polymarket 约 11%，按 Series E 区间计价值约 $1–2.2 billion。ICE $40 million
              二级交易中包含对早期投资者和员工的老股购买，让他们获得部分流动性释放；这缓解了流动性悬压，但也表明内部人在当前估值下已经套现一部分——在这个阶段并不异常，但若叠加持续监管不确定性，仍属重大观察点。

              任何考虑按当前估值进入的投资者，都需要拿到几项关键尽调材料：经审计的 2025 年财务报表（收入、毛利率、EBITDA、烧钱速度）、完整分配瀑布和清算优先权堆叠、POLY
              代币经济结构（股权与代币收入分配）、ICE 主数据授权协议条款和续约权，以及手续费上线后刷量交易剔除情况的独立审计。没有这些材料，就无法精确承销公允价值；观察才是合适姿态。
