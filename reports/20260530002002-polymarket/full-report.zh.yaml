      - number: '3.3'
        title: 相邻替代品——体育投注、预测社区与新兴平台
        blocks:
          - type: paragraph
            body: >-
              除了直接预测市场同业，Polymarket 还面临来自相邻平台的实质竞争。这些平台服务的是重叠的用户动机：金融投机和概率预测。Robinhood 的事件合约产品建在 Kalshi 基础设施上，运营最初几个月就在
              2025 年 Q2 处理超过 $1 billion，至 2026 年初累计交易超过 9 billion 份合约，参与用户超过 1 million。Robinhood 每份合约每边收费
              $0.01，大幅降低已有券商账户的美国主流零售交易者开户门槛。DraftKings Predictions 和 FanDuel Predicts 分别通过 Railbird Technologies 与 CME
              Group 作为 CFTC 持牌 DCM 运营，并在 2026 年以活跃做市商身份扩张。DraftKings CEO Jason Robins 在 2026 年 Q1
              财报电话会上称，预测市场是「我们推出过、最快实现盈利的业务线之一」。传统体育投注平台在美国合法博彩中合计每月处理约 $14 billion，是体育结果投机的现有默认选择；其隐含抽水（vig）为
              4–5%，明显高于预测市场有效费率。

              信息替代品这一端，Manifold Markets 运营一个虚拟币平台，约有 18,000 日活用户，不要求 KYC，全球可访问，支持用户创建二元和多选市场。Manifold 虚拟币市场准确度估计只比真钱平台差
              3–5%：其 2024 年美国大选 Brier score 为 0.0342，而 Polymarket 为 0.0296。Manifold 对 Polymarket
              不构成直接商业收入威胁，但它为一个重要的全球研究社区满足了预测市场的预测效用。Metaculus 是积分制预测平台，估计年收入约 $3.9 million，员工超过 30 人，服务学术和专业预测者，并提供 API
              与私人锦标赛服务。PredictIt 于 2025 年 7 月把运营控制权转移至美国 PMRC，并继续在 CFTC 不采取行动函下聚焦政治市场，合约上限 $850。包括 Predict.fun（4 月成交量
              $579M）、Opinion（$376M）和 Limitless（$205M）在内的新兴链上平台，合计约占预测市场总活动的 5–15%，但相对双寡头仍处早期。
