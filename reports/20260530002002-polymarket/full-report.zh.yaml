      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: CFTC/DOJ 内幕交易执法——确立行业先例
            body: >-
              2026 年 4–5 月 Van Dyke 与 Spagnuolo 案的起诉确立了两点：Polymarket 上的事件合约在联邦法律下属于“掉期”，内幕交易理论——包括电汇欺诈、商品欺诈和 “Eddie
              Murphy Rule”——会完整适用。也就是说，任何掌握重大非公开信息并在 Polymarket 交易的参与者，都面临刑事和民事责任；Polymarket
              作为运营方，也要承担平台级合规义务，发现、报告并阻止这类行为。CFTC 执法部门负责人表示，该部门“绝不容忍我们市场中的内幕交易，绝不”。投资者应监测 Polymarket 的 NFA
              监控协议和市场诚信系统，是否足以满足这项新的执法标准。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR049
          - type: callout
            title: UMA 预言机治理——未缓释的系统性风险
            body: >-
              2025 年 3 月，单一行为人展示出控制 UMA 25% 投票权的能力，迫使一个 $7 million 的 Polymarket 市场错误结算。Polymarket
              称该事件“前所未有”，但它暴露的是根本设计漏洞：UMA 的乐观预言机依赖代币持有人治理，而普通二级市场买入就可能达到足以捕获治理的集中度。2026 年 5 月 UMA CTF Adapter
              漏洞利用进一步表明，Polymarket 的自定义集成代码形成了一个完全落在 UMA 自身安全保证之外的攻击面。除非 Polymarket 披露结构性修复——为运营密钥部署 HSM、改革 UMA
              治理，或改用替代预言机——这些漏洞仍然敞开，并可能成为打破投资逻辑的事件。
            calloutType: risk
            claimRefs:
