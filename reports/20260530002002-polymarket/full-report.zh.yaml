      - number: '7.5'
        title: 缓释措施、监测指标和终止标准
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年，Polymarket 已采取实质动作缓释最高优先级风险，但重大剩余敞口仍在。监管端，公司收购持有 CFTC 牌照的 QCX LLC，并推出美国交易所，配套完整 KYC、NFA 监控监督和
              2026 年 3 月市场诚信规则更新；这是公司史上最强的缓释姿态。Massachusetts 诉讼中，公司与 Gibson Dunn & Crutcher、Mintz Levin
              合作，也显示法律投入认真。运营端，2026 年 3 月公告引入专门的市场诚信页面、多层监控计划（含 HALO 平台集成）以及保密举报渠道。NFA Regulatory Services Agreement
              为美国交易所提供独立交易监控。

              但若干剩余风险缺少足够缓释。UMA 治理集中度尚未从结构上解决——2025 年 3 月曾让一个 $7 million 市场错误结算的同一鲸鱼操纵漏洞仍在，SettleRisk 的定量分析也确认 2
              小时争议窗口仍是结构性缺口。运营钱包私钥管理——2026 年 5 月漏洞利用的攻击向量——需要部署硬件安全模块（HSM）和正式轮换密钥流程，而 Polymarket 尚未公开确认已落地。全球 DeFi
              平台的匿名架构意味着，刷量交易执法依赖链上模式识别和自愿钱包封禁，而非基于身份执法。州管辖拼图除正在推进的诉讼外，没有机构化缓释手段。

              投资者应监测以下终止标准事件：（1）Massachusetts 联邦地区法院驳回 Polymarket 的优先适用抗辩，且 First Circuit
              拒绝中止执行——触发逐州牌照要求，进而割裂美国市场；（2）第二次 UMA 治理投票操纵扰乱一个未平仓量 >$10 million 的市场——说明预言机风险是系统性的，并非孤例；（3）2026 年 4
              月的竞争性交易量轨迹连续三个月延续——表明份额流失是结构性的，而非季节性；（4）CFTC 的 ANPRM 最终规则禁止政治或体育合约——抹掉 Polymarket 交易量最高的类别；（5）Shayne
              Coplan 在监管或刑事阴云下离任且没有指定继任者。上述任一事件都会打破投资逻辑，需要立即重估持仓。
