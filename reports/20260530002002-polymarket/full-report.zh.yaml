      - number: '6.3'
        title: 具名用户证据与市场类别使用
        blocks:
          - type: paragraph
            body: >
              Polymarket 的链上结算基础设施给预测市场带来少见透明度：个人交易者 P&L 可以通过区块链地址验证。平台公开排行榜确认，前 20 名交易者生命周期利润在 $1 million 到 $2.4
              million 区间，体现真实生产级参与。记录最广的案例是交易者 “sovereign2013”，其借助 Claude 驱动的算法工作流把 $1 本金变成约 $3.3
              million；该案例被多家独立媒体报道，并可通过链上地址追踪验证。Bot 运营者 “OpenClaw” 据报道在一周内赚得 $115,000，交易通过 Builder API 打标。具名第三方分析平台
              Polyloly 跟踪每月 $1 billion 以上鲸鱼头寸，独立印证成熟参与者的活动集中度。机构层面，Jump Trading、Susquehanna 等做市公司被行业来源提及为平台参与者；吸引它们的是
              CLOB 升级移除了 500-millisecond 吃单延迟，并实现低于 100 毫秒执行。市场类别深度同样证明真实采用：截至 2026 年 4 月有 1,600+ 个活跃政治市场，选举市场持续保持每月
              $350 million 交易量，crypto、体育和地缘政治市场等非政治类别也在增长。跨群体的真实用户结果证据，加上链上可追踪性，使它成为文档化程度更高的 B2C 预测市场用户基础之一。
