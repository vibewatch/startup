      - number: '7.3'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的运营模型在四层形成关键单点依赖：机构伙伴、区块链网络、预言机协议和结算货币。每一层都是集中风险，都可能独立于公司自身执行质量而损害运营。

              ICE（Intercontinental Exchange）是 NYSE 母公司，2025 年 10 月承诺投资 $2 billion，也是 Polymarket 最关键的单一机构依赖。ICE 现在通过
              Signals and Sentiment Tool 向其机构网络分发 Polymarket 市场价格，在股权关系之外形成商业共同依赖。ICE 治理变化、战略转离 crypto 基础设施，或 ICE
              传统衍生品业务承受监管压力，都可能实质性改变这段战略伙伴关系。据报道，截至 2026 年 5 月，Polymarket 正寻求以约 $15 billion 估值再融资 $400 million，因此 ICE
              持续背书对资本形成至关重要。

              Polygon 网络是 Polymarket 唯一区块链基础设施。所有交易都在 Polygon PoS 链上执行，因此任何网络级宕机、安全事件或针对 Polygon 的监管行动，都会直接影响 Polymarket
              运营。Polygon 验证者集合历史上比 Ethereum mainnet 更中心化，Polygon 桥合约也有管理密钥风险。UMA Protocol Optimistic Oracle
              还带来治理集中风险——2025 年 3 月，一个鲸鱼验证者证明 25% 投票权足以操纵市场结算结果。USDC（Circle）作为唯一结算货币，意味着监管冻结、Circle 破产或脱锚事件会立即阻断
              Polymarket 结算市场并向用户返还资金的能力。合在一起，这些依赖制造了级联失效情景：单一外部事件——Polygon 网络停摆、Circle 执法行动或 UMA 治理攻击——都可能在 Polymarket
              自身合规姿态之外触发全平台中断。
