      - number: '4.2'
        title: 交易量、GMV 轨迹与收入牵引
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的交易量在 2025 年下半年到 2026 年初大幅扩张，动力来自地缘政治和金融市场事件热度上升。月度 GMV 从 2025 年 12 月的 $2.17 billion 升至 2026 年
              1 月的 $4.19 billion、2 月的 $7.26 billion，并在 2026 年 3 月达到约 $12.22 billion 峰值，4 月回落至 $9.14 billion。2026 年截至 4
              月，Polymarket 总交易量为 $33.50 billion。Pew Research Center 基于 The Block 数据分析确认，2026 年 4 月 Polymarket 和 Kalshi
              合计月交易量约 $24 billion，与 2025 年美国所有合法体育博彩每月约 $14 billion 的投注额同量级。

              3 月 30 日上线收费后，平台货币化潜力立即得到验证。DefiLlama 数据显示，日费用从 3 月 31 日的 $363,000 升至 2026 年 4 月 2 日和 4 月 3 日均超过 $1
              million。扣除 maker 返佣后的留存收入在 4 月 2 日达到 $995,000、4 月 3 日达到 $899,000。按上线时 $9.55 billion 的 30
              天滚动交易量测算，分析师预计混合日收入为 $800,000–$1 million，对应月收入约 $25 million、年化约 $300 million。相比之下，竞争对手 Kalshi 截至 2026
              年初报告的年化收入运行率为 $1.5 billion，说明 Polymarket 费用收入增长很快，但仍有规模待捕捉；尤其是 CFTC 监管子公司 Polymarket US 在 2026 年 4 月交易量只有
              $1.3 billion，而 Polymarket International 为 $9 billion。
