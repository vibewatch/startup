      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 体育是成交量引擎，但不是战略大奖
            body: >
              体育合约目前贡献全球名义交易量的 60%+，但 Bernstein 和 Eilers & Krejcik 都预计，随着机构宏观、金融和政治合约更快增长，体育占比到 2030 年会降至约 30%。对
              Polymarket 而言，其成交量在品类之间比 Kalshi 的体育重仓组合更均衡；如果能在 Kalshi 锁定机构客群前拿到符合 CFTC 的分发，这一变化更有利于其全球化、去中心化市场模型。
            calloutType: insight
            claimRefs:
              - CM007
              - CM009
              - CM011
              - CM029
              - CM030
          - type: callout
            title: 零售亏损画像带来结构性流失逆风
            body: >
              超过 70% 的 Kalshi 交易者和约 69% 的 Polymarket 交易者亏钱，77% 收益流向前 1%
              用户。理财顾问公开建议把预测市场支出当作娱乐，而非投资。亏损的结构性画像带来自然流失风险，平台需要持续补充漏斗顶部获客来抵消，也抬高了长期获客成本压力。
            calloutType: risk
            claimRefs:
              - CM015
          - type: callout
            title: 监管碎片化压低近期美国 SAM 上限
            body: >
              14 个美国州的活跃法律争议，以及尚未解决的 Kalshi-Nevada 上诉战，意味着美国预测市场 SAM 明显小于完整可触达人群。CFTC ANPR
              对禁止类别合约的开放问题，也给体育等高成交量品类带来不确定性；一些州监管方主张这类产品在州管辖下属于赌博产品。解决过程很可能以多年计。
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM016
              - CM033
          - type: callout
            title: 名义交易量不是收入
            body: >
              本章所有市场规模测算均使用名义交易量（买入 / 卖出合约的总美元额），会把每笔交易两边都计入。平台收入只是名义交易量的一小部分。Polymarket 基于手续费的收入模式意味着平台经济性约为名义交易量的
              1-2%；$162.65 billion 名义市场折算为所有运营方合计约 $1-3 billion 平台手续费。投资人和分析师不应在未调整抽佣率的情况下，把市场规模倍数套用到名义交易量。
            calloutType: assumption
            claimRefs:
