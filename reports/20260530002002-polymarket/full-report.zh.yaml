      - number: '8.4'
        title: 乐观、基准和悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的乐观情景需要三项进展同时发生：（1）机构采用和美国市场正常化把年化 GMV 稳在 $100 billion 以上；（2）POLY 代币发行通过质押和协议费用创造显著增量收入流；（3）ICE
              的数据授权渠道在 2026 年底前签下 20+ 份机构合同，形成可防守的 $50–100 million 增量收入线。若满足这些条件，2026 年总收入可达 $600–800 million；在 $800
              million 上给 30x 前瞻倍数，可支撑 $18–24 billion 股权价值——大体符合 Series E 目标。IPO 时退出倍数若压缩到 2027 年 $1 billion 收入的
              20x，则上市时股权价值为 $20 billion。

              基准情景假设，4 月 $43.36 million 手续费收入受事件交易量抬升（UEFA Champions League、经济数据周期），稳态月手续费均值为 $25–35 million（年化 $300–420
              million）。POLY 代币按计划推出，但第一年质押收入温和，低于 $50 million。数据授权贡献 $20–40 million。到 2026 年底，总收入落在 $340–460 million。对
              $400 million 给 15–20x 前瞻收入倍数，公允价值为 $6–8 billion——低于 ICE 最初投资时的当前 Series E 标记 $9 billion，更远低于 $20 billion
              目标。这个缺口就是投资者为预测市场类别的战略期权价值支付的“增长与执行溢价”。

              悲观情景至少需要以下两项发生：（1）手续费引入对刷量交易的影响导致真实日交易量下降 40%+；（2）DOJ/CFTC 执法升级为平台级行动（而非针对个人内幕交易者）；（3）Kalshi 宣称的 90%+
              美国市场份额被证明可持续，且 Polymarket 无法夺回美国机构交易量；（4）POLY 代币发行推迟或被认定为证券，引发 SEC 行动。在这一情景下，年化手续费降至 $100–150 million，10x
              困境增长倍数对应 $1–1.5 billion 股权价值——较 2025 年 10 月估值下调 83–89%，并让 $20 billion 目标下的 Series E 投资完全归零。
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV038
              - CV043
