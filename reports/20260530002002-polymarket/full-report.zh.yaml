      - number: '1.5'
        title: 监管与法律格局
        blocks:
          - type: paragraph
            body: >-
              2020 年到 2026 年的监管轨迹，是 Polymarket 最核心的尽调叙事之一。2022 年 CFTC 执法行动要求公司支付 $1.4 million
              民事罚款，并因运营未注册衍生品平台下达停止令；这迫使公司对美国用户做地理封锁并重组运营，最终走向收购 QCEX，并在 2025 年 12 月以联邦监管指定合约市场身份重新上线。

              重新合规路径包括：2022 年 1 月与 CFTC 达成 $1.4 million 和解；2022 年 5 月任命 Giancarlo 进入顾问委员会；2025 年 7 月以 $112 million 收购
              QCEX；2025 年 9 月获得 CFTC 不采取行动救济函；2025 年 11 月获得 CFTC 修订指定令；2025 年 12 月 2 日在美国重新上线。2025 年 7 月，DOJ 和 CFTC
              结束并行调查，未就 Polymarket 是否允许美国用户下注 2024 年大选提出指控；这个时间点大约早于 QCEX 收购公告四周，为交易降了风险。

              联邦合法性并不消除州层面敞口。截至 2026 年 5 月，Polymarket 在 Massachusetts（QCX LLC v. Campbell，2026 年 2 月 10
              日提交）、Michigan（QCX LLC v. Nessel，W.D. Mich. No. 1:26-cv-00710，2026 年 3 月 4 日提交）面临活跃诉讼，并受到 Rhode
              Island、Nevada 等州威胁。核心法律问题——CFTC 管辖权是否优先于州赌博法——尚未得到最终解决。在同类 Kalshi 案件中，州法院曾支持州权；Polymarket 则主张至高条款和 CEA 要求
              CFTC 拥有排他管辖权。

              2026 年 4 月 23 日，SDNY 解封一份起诉书，指控美国陆军特种部队 Master Sergeant Gannon Ken Van Dyke 利用关于 Operation Absolute
              Resolve 的机密军事信息在 Polymarket 上下注 $33,000，并获利约 $409,881。该案是 CFTC 首起涉及事件合约的内幕交易行动，显示预测市场参与者正受到更强审查。Fortune 杂志
              2024 年另有负面发现称，Polymarket 交易量最高三分之一可能由刷量交易构成；Polymarket 拒绝置评。国际上，法国、比利时、澳大利亚、新加坡等司法辖区维持访问限制。现任 CFTC 主席
              Michael Selig 公开站在预测市场一边、反对州监管方，为 Polymarket 在州诉讼中引用的联邦立场提供了顺风。
