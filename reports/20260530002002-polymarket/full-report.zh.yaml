  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 交易者分层与用户基础
        blocks:
          - type: paragraph
            body: >
              Polymarket 的用户基础可大致分为四个行为、交易量贡献和留存画像差异很大的群体。休闲零售交易者按人数看最大，主要受事件驱动，在选举、重大体育比赛或突发地缘政治事件等政治 /
              文化高关注时刻入场。这个群体贡献了新增注册激增的主体，例如 Q4 2024 录得 45% 首次用户队列；但多月留存最弱，使用简单的移动端或 web 界面，而不是 CLOB
              API。高阶零售交易者在政治、crypto、体育和 AI 等类别持有更多元市场头寸；这个群体的 30 天留存显著更高，是 Polymarket 经常性非事件交易量的核心。算法和 bot 群体集中在 Builder
              Program 排名榜周围，贡献大多数程序化订单流；头部 bot Betmoar 单独路由累计 $1.34 billion 交易量，约占所有可归因 Builder Program 活动的
              42%。最后，小型机构层由量化交易台和做市公司构成（包括据报道参与的 Jump Trading、Susquehanna），为旗舰选举和金融市场提供深度与紧价差。地域上，国际用户占主导：Polymarket 在
              160+ 个国家运营，2026 年 4 月数据显示，国际平台月交易量 $9 billion，而 CFTC 监管的美国产品为 $1.3 billion。核心用户画像是 crypto 原生，需要存入 USDC
              稳定币并管理 Polygon 钱包——这给没有 crypto 经验的零售用户带来明显摩擦。
            claimRefs:
              - CU001
              - CU005
