      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              预测市场行业无法用单一视角定规模；参照物是名义交易量、年化运行率、可比体育投注投注额，还是成熟状态收入预测，不同分析框架会给出差异很大的数字。正确方法是跨方法三角验证。

              名义交易量视角：TRM Labs 和 Dune Analytics 数据显示，Kalshi 与 Polymarket 的全球月度合计交易量在 2026 年 4 月达到 $24 billion，意味着年化运行率高于
              $240 billion。Datawallet 和 Gambling Insider 汇总的 2026 全年名义交易量为 $162.65 billion，反映出一年前每月 $1.9 billion
              之后的爬坡。仅体育合约在 2026 年 Q1 就贡献 $10.1 billion 成交量，同期政治市场为 $5 billion。

              分析师预测视角：Bernstein 在 2026 年 4 月发布卖方预测，预计 2026 全年成交量为 $240 billion，到 2030 年年成交量达到 $1 trillion，相比 2025 年 CAGR
              为 80%；随着机构宏观合约增长，体育占比预计从 60%+ 降至总量的约 30%。Eilers & Krejcik 2025 年 12 月报告估计，仅美国市场完全成熟后规模就达 $1 trillion，拆分为体育
              $435 billion、金融和加密 $310 billion、新闻 / 政治 $160 billion、其他类别 $55 billion。2025 年有 12 家机构获得指定合约市场资格，较 2024 年增长约
              500%，说明供给侧具备继续扩张的能力。

              体育投注投注额可比视角：CNBC 指出，E&K 设计了一套公式，把预测市场名义交易量换算为等同体育投注的投注额，并得出结论：成熟体育预测市场可支撑约为当今在线体育博彩市场 60-80% 的投注额，而后者在
              2026 年为 $49.74 billion。这意味着按投注额口径，当前体育预测 SAM 约为 $30-40 billion。

              平台集中度限制 SOM：Kalshi 与 Polymarket 合计控制行业 85-90% 的交易量；Kalshi 2026 年年初至今交易量为 $37.49 billion，给其带来约 65% 的全球份额和
              89% 的美国预测市场活动。Polymarket 的全球加密原生用户基础和去中心化模式，让其 SOM 有别于 Kalshi 受监管、美国中心的定位。
