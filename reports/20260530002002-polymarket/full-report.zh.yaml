      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Polymarket 由 Shayne Coplan 创立、搭建，并一直由他领导。Coplan 出生于 1998 年，在曼哈顿 Upper West Side 长大。十几岁时，他参与了 2014 年
              Ethereum 的首次代币发行，早早接触加密资产，也为后来创业积累了种子资金。他曾在 New York University 学习计算机科学，大一期间离校，转向区块链和预测市场。2020 年 6 月，22
              岁的他在 Lower East Side 公寓里搭出并上线 Polymarket，灵感来自经济学家 Friedrich Hayek 的去中心化信息理论和 Robin Hanson 的 futarchy 概念。

              2022 年 1 月与 CFTC 和解后，Coplan 于 2022 年 5 月招募美国商品期货交易委员会前主席 J. Christopher Giancarlo 担任 Polymarket
              顾问委员会主席。这是公司重返美国计划前一个重要的监管可信度信号。2024 年 7 月，统计学家、FiveThirtyEight 创始人 Nate Silver 加入顾问委员会；同期新闻稿称，年初至今交易量已超过
              $400 million。公司仍未公开披露董事会，这两项任命也就构成目前公开文件中最清晰的治理层。

              2025 年 10 月 ICE 投资后，Coplan 约 11% 的持股对应个人净资产超过 $1 billion；按当时 Bloomberg
              指数，他成为全球最年轻的白手起家亿万富翁。关键人集中是重要尽调因素：Coplan 仍是核心战略高管、公众面孔和主要品牌。公司 CLO Neal Kumar 在法律策略上公开活跃，尤其围绕 2026
              年州诉讼发声。Raymond Qin 担任美国实体总裁，Art Malkov 担任首席营销官。员工数在 2026 年 2 月约 241 人，到 2026 年 4 月约 325 人，显示美国重启上线和 E
              轮融资同时推动公司快速招聘。
