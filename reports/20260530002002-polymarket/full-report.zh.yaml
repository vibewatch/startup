  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    notes: 触发因素是可观察的市场或监管事件；阈值是示例性监控点，不是正式投资契约。严重性等级为定性评估。
    columns:
      - 触发因素
      - 可观察阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 平台层面 CFTC/DOJ 执法行动
        - Polymarket 收到 Wells 通知、停止令或起诉书（不是个别交易者）
        - DCM 牌照立即面临暂停风险；交易停摆；股权价值接近归零
        - 全面退出 / 立即减持；无可用缓释
      - - 月度手续费收入连续 3+ 个月低于 $15M
        - 经验证链上数据显示 2026 年 Q3 或 Q4 手续费 <$15M/月
        - $180M 年化运行率意味着 $2–3B 公允价值；当前估值标记无法辩护
        - 重新评估；面临估值下调融资压力；按 4–5x 历史收入重新考虑
      - - SEC 将 POLY 代币认定为未注册证券
        - SEC 执法行动或正式指引将 POLY 归类为证券
        - 代币发行受阻或受限；第二收入流消失；需重组股权结构表
        - 密切跟踪；股权投资人需重新分析代币—股权瀑布
      - - ICE 减持或终止数据独家权
        - ICE 提交显示持股下降的 13D/13G 修订文件，或发布终止数据许可的新闻稿
        - 失去机构分发和信用锚；战略叙事坍塌
        - 立即下调至回避；ICE 关系支撑乐观情景
      - - Kalshi 拿下 Polymarket 非美国 GMV 的 >50%
        - 第三方交易量数据（Dune、Nansen）显示 Kalshi 全球份额 >50%
        - 竞争护城河被削弱；TAM 需重新分配；收入倍数压缩
        - 重新评估市场份额可持续性；入场价格需按双寡头而非垄断重置
    claimRefs:
      - CV025
      - CV039
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调待索取事项表
    notes: 截至 2026 年 5 月 30 日，这六项索取事项都是阻断性或重大缺口。公开资料均无法补足； 每一项都需要访问 Polymarket 数据室或直接与公司沟通。
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务报表
        - 2024 和 2025 年经审计损益表、资产负债表、现金流；毛利率；EBITDA；烧钱速度
        - 没有这些数据就无法承销估值；当前标记依赖未经审计的估计
        - Polymarket 管理层；需提出数据室请求
      - - 优先股堆叠与瀑布
        - 所有轮次完整清算优先权条款；ICE 优先股条款；参与型 / 非参与型
        - ICE 以优先股条款投入的 $2B，可能在降价轮或中等退出情景下吃掉普通股价值
        - Polymarket 法律顾问；任何入场决定前都需建模股权结构表
      - - POLY 代币经济
        - 代币分配（股权 / 社区 / 团队）、收入分成公式、归属安排、 监管分类意见
        - 代币可能把大量手续费收入从股权转向代币持有人；SEC 分类风险重大
        - Polymarket CMO 和法务；需 SEC 不采取行动函或外部律师法律意见
      - - ICE 数据许可条款
        - 主数据许可协议期限、续约条款、独家范围和定价
        - 数据许可是利润率最高的相邻收入机会；失去 ICE 独家权会压垮乐观情景
        - Polymarket CFO；在数据室审阅合同
      - - 收费后对倒交易审计
        - 对 2026 年 3 月 30 日收费引入后钱包行为的独立链上分析
        - Columbia 研究覆盖收费前时期；没有收费后审计，披露 GMV 仍可能含有大量噪音
        - Polymarket 工程团队或第三方区块链分析公司（Chainalysis、Nansen）
      - - 留存与流失指标
        - 月活跃交易者、按队列划分的 30/90 天留存、地域拆分、机构 / 零售拆分
        - 高交易量零售用户集中会带来事件周期波动；机构留存可支撑基准情景
        - Polymarket 数据团队；内部分析数据室
    claimRefs:
      - CV011
      - CV027
      - CV029
      - CV044
      - CV045
