      - number: '1.4'
        title: 规模、里程碑与竞争位置
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的成交量轨迹是衡量规模和动能最清晰的代理指标。2026 年 3 月，平台交易量达到 $10.57 billion，首次单月跨过 $10 billion 门槛，约为 2024 年 10
              月美国总统大选周期峰值的 2.5 倍。2026 年 Q1 总成交量约 $26.2 billion，环比增长超过 90%。2026 年 4 月，Polymarket 与 Kalshi 的累计历史交易量合计突破
              $150 billion。

              体育市场、加密价格二元合约和地缘政治事件，如今与最早推动主流关注的大选周期一起支撑日常活跃。Polymarket US 作为美国本土 DCM 实体，于 2025 年 12 月上线；尽管只限体育市场，2026 年
              3 月仍产生超过 $700 million 交易量，其占全平台活动的份额到 2026 年 3 月翻倍至 6.6%。市场集中度仍是持续风险：公开分析显示，总交易量的 63% 集中在前 0.23%
              的钱包内，说明平台依赖少数大交易者。

              Polymarket 的主要竞争对手 Kalshi（自 2020 年起持有 CFTC 许可的 DCM）在 2026 年 4 月录得 $14.81 billion 成交量，超过 Polymarket 当月
              $9.01 billion；不过，在加密原生、去中心化和政治主题交易中，Polymarket 仍保有品牌优先级。关键产品里程碑包括：2023 年 Titan 潜水器事件带来的病毒式传播和用户导入；2024
              年大选周期中，Polymarket 承接超过 $3+ billion 美国总统下注，并拿下约 85% 的在线选举押注；2025 年 7 月收购 QCEX，打通受监管美国实体；2025 年 12
              月美国重新上线；以及 2026 年 3 月创下月度交易量纪录。
