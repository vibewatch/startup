      - number: '5.4'
        title: 开发者生态、API 与 SDK
        blocks:
          - type: paragraph
            body: >-
              Polymarket 在 GitHub 上维持活跃开源开发者生态（18+ 个仓库），并发布三类主要 API：Gamma API（市场发现和元数据，无需认证）、CLOB API（下单和订单簿访问，需要认证）和
              Data API（用户活动和分析，无需认证）。实时更新通过 WebSocket 流提供。Polymarket US DCM 产品增加了以流式为先的机构 REST API，并用 gRPC 流
              提供实时市场数据和订单跟踪，文档位于 docs.polymarket.us。

              官方 SDK 覆盖 Python（polymarket-client，2026 年 beta 发布）、TypeScript、Go 和 Rust（CLI）。旧版 py-clob-client Python
              库已归档，统一迁移到 py-sdk。PyPI 上的统一 polymarket-apis 包（最后更新于 2026 年 5 月 24 日）把 Clob、Gamma、Data、Web3、WebSocket 和
              GraphQL 客户端打包进一个由 Pydantic 校验的接口。CLOB V2 引入 builder 代码，可通过新增的 builderCode 字段把链上订单归因到具体 API 集成方；该字段已加入
              leaderboard 和 volume 端点（5 月 18 日更新日志）。

              ICE 2026 年 2 月推出的 Polymarket Signals and Sentiment 工具，代表一条并行机构 API 渠道：ICE 标准化 Polymarket 市场数据，将信号映射到 ICE
              证券 ID（股票、大宗商品等），再通过 ICE Consolidated Feed 和 ICE Consolidated History 交付，用于回测。这把 Polymarket
              数据定位为机构量化策略中传统价格、基本面和情绪数据之外的补充信号。Polymarket 借 ICE 的全球分销触达投资银行、资产管理公司和对冲基金，不必自建机构数据基础设施。开发者社区通过 Discord
              #devs 频道、开源漏洞赏金和 docs.polymarket.com 文档维持参与。
