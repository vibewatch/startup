              最终规则禁止政治或体育事件合约；（5）DOJ 或 CFTC 针对 Polymarket 本身（而非个人用户）提起运营方层面的指控，指其系统性便利内幕交易。截至 2026 年 5 月 30 日，上述阈值均未触发。
