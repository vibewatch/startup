  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Polymarket 位于商品衍生品监管和州级博彩执法的交叉点，双线法律风险在 2026 年显著升温。公司监管史始于 2022 年 1 月 CFTC 同意令：Blockratize Inc.（d/b/a
              Polymarket）因经营未注册事件市场被处以 $1.4 million 民事罚款，平台二元结果智能合约被归类为 Commodity Exchange Act 下的「swaps」。尽管 Polymarket
              随后在 2025 年 7 月收购 CFTC 持牌 QCX LLC，以指定合约市场身份重返美国市场，但 2022 年执法行动树立了一个先例：所有预测市场活动都落入 CFTC 管辖。多个州监管方正在积极挑战这一主张。

              2026 年最关键的新法律进展，是 DOJ 和 CFTC 并行发起首例同类内幕交易执法行动。2026 年 4 月 23 日，SDNY 解封起诉书，指控美国陆军特种部队 Master Sergeant Gannon
              Ken Van Dyke 利用关于 Operation Absolute Resolve 的机密信息——一次抓捕委内瑞拉总统 Nicolás Maduro 的秘密行动——在 Polymarket 获利约
              $404,000。CFTC 同时依据「Eddie Murphy Rule」提交首起民事诉状，该规则禁止在商品交易中使用非公开政府信息。仅数周后，2026 年 5 月 27 日，CFTC 又指控 Google 员工
              Michele Spagnuolo 在 Polymarket 利用内幕信息获利约 $1.2 million，显示执法正从政府信息主动扩展到企业内幕知识。CFTC 执法主任 David Miller
              表示，该部门「绝不容忍我们市场中的内幕交易，不容例外」，Debevoise & Plimpton 和 Sidley Austin 的法律分析也确认，同样的欺诈理论适用于掌握重大非公开信息的企业员工。

              州层面，Polymarket 于 2026 年 2 月 9 日对 Massachusetts Attorney General Andrea Campbell 和 Massachusetts Gaming
              Commission 提起联邦诉讼，试图阻止州博彩法针对其 CFTC 监管事件合约执法。该诉讼发生在 Massachusetts 州法院对 Kalshi 体育合约发布初步禁令之后；该禁令认定 CFTC
              监管并不排除州博彩法。Wisconsin Attorney General 也在 2026 年 4 月分别起诉 Kalshi 和 Polymarket。2026 年 4 月 6 日，Third Circuit
              一个分裂合议庭认为体育类事件合约很可能构成 swaps——这可能强化联邦优先权；但州级拼图式执法继续威胁 Polymarket 的全国运营。Aurum Law 2026 年概览识别出 Nevada、New
              Jersey、Connecticut、Tennessee 和 Massachusetts 的活跃停止令或诉讼。

              CFTC 2026 年 3 月 12 日拟议规则制定预告（ANPRM）又增加一层结构性规则制定：平台是否应禁止内幕知识交易者、哪些合约违反 CEA §5c(c)(5)(C)
              下的「公共利益」、是否应允许保证金交易。征求意见期已于 2026 年 4 月 30 日结束；预计需要一年以上才能最终敲定的新规则，可能显著提高合规成本，并收窄可允许合约范围。Senator Elizabeth
              Warren 和 40+ 名国会议员也在 2026 年 3 月单独呼吁 CFTC 打击政府官员使用预测市场。
