    summary: >-
      乐观、基准、悲观情景的股权价值低高区间，并列展示 2025 年 10 月 ICE 入场标记（$9B）和 Series E 目标（$20B）。区间反映情景分析章节中的明确收入和倍数假设。概率权重：乐观 20%、基准 55%、悲观
