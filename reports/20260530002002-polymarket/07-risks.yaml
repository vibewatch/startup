callouts:
  - calloutType: risk
    title: CFTC/DOJ Insider Trading Enforcement — Industry Precedent Set
    body: >-
      The April–May 2026 Van Dyke and Spagnuolo prosecutions establish that event contracts on
      Polymarket are "swaps" under federal law and that insider trading theories—including wire
      fraud, commodities fraud, and the "Eddie Murphy Rule"—apply with full force. This means
      any participant with material nonpublic information who trades on Polymarket faces criminal
      and civil liability, and Polymarket as operator faces platform-level compliance obligations
      to detect, report, and prevent such conduct. The CFTC's Director of Enforcement stated
      the Division will "not tolerate insider trading in our markets, period." Investors should
      monitor whether Polymarket's NFA surveillance agreement and market integrity systems
      adequately satisfy this new enforcement standard.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR049

  - calloutType: risk
    title: UMA Oracle Governance — Unmitigated Systemic Risk
    body: >-
      A single actor demonstrating ability to control 25% of UMA voting power forced a
      $7 million Polymarket market to resolve incorrectly in March 2025. This event—described
      by Polymarket as "unprecedented"—exposed a fundamental design vulnerability: UMA's
      optimistic oracle depends on token-holder governance that can be captured at a concentration
      level achievable through normal secondary market accumulation. The May 2026 UMA CTF
      Adapter exploit further demonstrated that Polymarket's custom integration code creates
      an attack surface entirely outside UMA's own security guarantees. Until Polymarket
      discloses structural remediation—HSM deployment for operational keys, UMA governance
      reform, or an alternative oracle—these vulnerabilities remain open and represent potential
      thesis-break events.
    claimRefs:
      - CR022
      - CR023
      - CR024
      - CR025

  - calloutType: risk
    title: State Jurisdiction Patchwork — Massachusetts Lawsuit Is a Bellwether
    body: >-
      Polymarket's February 2026 federal lawsuit against Massachusetts (QCX LLC v. Campbell)
      is the highest-stakes legal proceeding in its history. A ruling against Polymarket would
      validate state authority to require gambling licenses from CFTC-registered prediction
      markets, triggering a 49-state licensing cascade that would either fragment the US market
      through geofencing or require prohibitive compliance investment. The Third Circuit's April
      2026 KalshiEX v. Flaherty ruling supports federal preemption for sports contracts, but
      the Massachusetts case is distinct and the First Circuit has not yet addressed the question.
      Active state lawsuits in Wisconsin, Nevada, and New Jersey compound the risk, creating a
      multi-front legal exposure that could materially constrain Polymarket's US operations
      independent of its CFTC compliance status.
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR011
      - CR014
      - CR047

  - calloutType: recommendation
    title: Five Kill-Criteria Events for Investor Monitoring
    body: >-
      Based on the risk register analysis, five events constitute thesis-break triggers that
      should prompt immediate position reassessment: (1) Massachusetts district court rules
      against CFTC preemption AND First Circuit denies a stay; (2) a second UMA governance
      attack resolves a market with >$5 million in open interest incorrectly; (3) Polymarket
      global volume declines >20% month-over-month for three consecutive months while the
      sector grows; (4) the CFTC's ANPRM results in a final rule prohibiting political or
      sports event contracts; (5) DOJ or CFTC files operator-level charges against Polymarket
      itself (rather than individual users) for systemic facilitation of insider trading.
      None of these thresholds has been crossed as of May 30, 2026.
    claimRefs:
      - CR012
      - CR022
      - CR026
      - CR008
      - CR004

