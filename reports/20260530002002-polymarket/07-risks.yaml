  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Quantitative likelihood and impact scoring for risks
      missingEvidence: "No actuarial or quantitative probability assessments are publicly available for Polymarket's regulatory, operational, or competitive risks. Likelihood and impact ratings in the risk registers are qualitative."
      whyItMatters: "Quantitative likelihood and impact scores would enable more precise portfolio-level risk weighting and comparison across risk categories."
      diligencePath: "Request management's internal risk register or board-level risk reporting that includes quantitative scoring; engage a specialized regulatory risk firm for actuarial probability estimates on CFTC enforcement scenarios."
      relatedQuestionRefs:
        - QR002

    - type: private-evidence-only
      severity: material
      topic: CFTC consent order VPN bypass compliance verification
      missingEvidence: "There is no publicly available independent audit confirming that Polymarket's geoblocking and VPN detection systems fully prevent US users from accessing the global platform in violation of the 2022 CFTC consent order."
      whyItMatters: "If US users systematically bypass Polymarket's access controls, the company could face renewed CFTC enforcement for violating its consent order, with potential penalties and DCM designation review."
      diligencePath: "Request Polymarket's technical documentation of VPN and geoblocking controls; obtain CFTC no-action or confirmation letter if available; commission independent penetration testing of access controls."
      relatedQuestionRefs:
        - QR006

    - type: private-evidence-only
      severity: blocking
      topic: Polymarket burn rate and runway
      missingEvidence: "Polymarket's monthly operating expenses, burn rate, and cash/capital runway are not publicly disclosed; no public financial statements exist for the private company."
      whyItMatters: "Without burn rate data, it is impossible to assess how long Polymarket can sustain operations under regulatory headwinds or competitive volume declines before requiring additional capital."
      diligencePath: "Request management accounts or board-level financial reporting showing quarterly burn rate, cash position, and runway projection under base and downside scenarios."
      relatedQuestionRefs:
        - QR021

    - type: missing-source
      severity: material
      topic: CFTC ANPRM compliance cost projections
      missingEvidence: "No public cost-benefit analysis or industry estimate exists for the compliance cost implications of potential CFTC ANPRM final rules on existing DCMs."
      whyItMatters: "Potential new rules on margin trading, contract prohibitions, position limits, and surveillance requirements could impose material compliance costs that affect Polymarket's unit economics."
