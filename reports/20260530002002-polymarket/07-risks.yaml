chapter:
  number: 7
  title: Risks
  summary: >-
    Polymarket faces a complex, multi-dimensional risk profile dominated by four interlocking threat
    clusters: an escalating federal enforcement environment in which the CFTC and DOJ prosecuted
    insider trading on prediction markets for the first time in April–May 2026; an unresolved
    federal-versus-state jurisdictional conflict crystallized in Polymarket's February 2026 federal
    lawsuit against Massachusetts; operational vulnerabilities exposed by the May 2026 $660,000 UMA
    CTF Adapter exploit and a 2025 UMA governance manipulation attack; and competitive pressure that
    saw Polymarket cede its global volume lead to Kalshi in April 2026. The CFTC's March 2026 ANPRM
    introduces structural rulemaking uncertainty, while wash-trading analyses, key-person concentration
    in founder Shayne Coplan, and Polygon single-chain dependency form material residual risks.

sections:
  - id: regulatory-legal-risk
    title: Regulatory and Legal Risk
    body: >-
      Polymarket operates at the intersection of commodity derivatives regulation and state gambling
      enforcement, a dual-front legal risk that intensified materially in 2026. The company's
      regulatory history begins with the January 2022 CFTC consent order, which imposed a $1.4 million
      civil penalty on Blockratize Inc. (d/b/a Polymarket) for operating unregistered event markets
      and classified the platform's binary-outcome smart contracts as "swaps" under the Commodity
      Exchange Act. Although Polymarket subsequently acquired CFTC-licensed QCX LLC in July 2025 to
      reenter the US market as a Designated Contract Market, the 2022 enforcement action set a
      precedent that all prediction market activity falls within CFTC jurisdiction—a claim now being
      actively contested by multiple state regulators.

      The most consequential new legal development in 2026 is the DOJ and CFTC's parallel first-of-its-kind
      insider trading enforcement action. On April 23, 2026, SDNY unsealed an indictment charging
      U.S. Army Special Forces Master Sergeant Gannon Ken Van Dyke with using classified information
      about Operation Absolute Resolve—a covert mission to capture Venezuelan President Nicolás
      Maduro—to earn approximately $404,000 in profits on Polymarket. The CFTC simultaneously filed
      its first civil complaint using the "Eddie Murphy Rule," which bars use of nonpublic government
      information in commodity trades. Just weeks later, on May 27, 2026, the CFTC charged Google
      employee Michele Spagnuolo with insider trading on Polymarket for approximately $1.2 million in
      profits, signaling that enforcement is actively widening beyond government information to cover
      corporate insider knowledge. CFTC Director of Enforcement David Miller stated the Division will
      "not tolerate insider trading in our markets, period," and legal analyses by Debevoise & Plimpton
      and Sidley Austin confirm the same fraud theories apply to corporate employees with material
      nonpublic information.

      At the state level, Polymarket filed a federal lawsuit on February 9, 2026 against Massachusetts
      Attorney General Andrea Campbell and the Massachusetts Gaming Commission to block enforcement of
      state gambling laws against its CFTC-regulated event contracts. The suit follows a Massachusetts
      state court preliminary injunction against Kalshi's sports contracts, which ruled CFTC oversight
      does not preempt state gaming law. Wisconsin's Attorney General filed additional suits against
      both Kalshi and Polymarket in April 2026. A divided Third Circuit panel held on April 6, 2026
      that sport-related event contracts likely qualify as swaps—potentially reinforcing federal
      preemption—but state-level patchwork enforcement continues to threaten Polymarket's nationwide
      operations. Aurum Law's 2026 overview identified active cease-and-desist orders or lawsuits
      from Nevada, New Jersey, Connecticut, Tennessee, and Massachusetts.

      The CFTC's March 12, 2026 Advance Notice of Proposed Rulemaking (ANPRM) adds a structural
      rulemaking layer, asking whether platforms should bar insider-knowledge traders, what contracts
      violate the "public interest" under CEA §5c(c)(5)(C), and whether margin trading should be
      permitted. The comment period closed April 30, 2026 and new rules—expected to take over a year
      to finalize—could impose materially higher compliance costs and narrow the permissible contract
      universe. Senator Elizabeth Warren and 40+ members of Congress separately called on the CFTC
      in March 2026 to crack down on government officials using prediction markets.
