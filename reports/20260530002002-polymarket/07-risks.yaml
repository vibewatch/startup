  - id: competitive-financial-risk
    title: Competitive, Financial, and Execution Risk
    body: >-
      Polymarket's financial risk profile is anchored by two structural vulnerabilities: event-driven
      revenue cyclicality and accelerating competitive market share erosion. April 2026 marked the
      first month-over-month trading volume decline since August 2025, with volume falling 8.9% to
      $10.2 billion against Kalshi's simultaneous 13% surge to $14.8 billion. The broader sector
      grew 12.4% to $29.8 billion in April, indicating Polymarket is losing share in a growing
      market. Laika Labs' 2026 analysis estimates Kalshi now holds approximately 52–53% of combined
      market share, while Polymarket has fallen to approximately 35–40%.

      The event-cycle revenue risk is structural: the 2024 US Election drove extraordinary activity,
      with open interest peaking at $474 million. Post-election, open interest collapsed to
      $117 million in December 2024, demonstrating high sensitivity to marquee political events.
      As the next US election is not until 2028 and Polymarket faces heightened US regulatory
      restrictions, sustaining non-election volumes depends entirely on execution in sports,
      crypto, and economics markets where Kalshi is already dominant.

      Polymarket's March 2026 transition from a zero-fee model to charging transaction fees is a
      structural execution risk. The fee change—introduced after the platform projected approximately
      $1 million in daily revenue under the new structure—risks user attrition and could accelerate
      migration to lower-cost alternatives. The US-specific app launched in December 2025 remains
      isolated from Polymarket's global liquidity pool, creating a bifurcated user experience that
      disadvantages US traders relative to international users and CFTC-regulated competitors.

      Key-person concentration in founder and CEO Shayne Coplan is a material execution risk. Coplan
      has personally navigated the company through the 2022 CFTC consent order, the November 2024
      FBI raid of his residence, and the subsequent closure of DOJ and CFTC investigations in July
      2025 without charges. Many high-profile advisors and strategic partners are tied to Coplan's
      personal network. Chief Legal Officer Neal Kumar leads the company's state litigation strategy,
      and both executives' continued tenure is material to the Massachusetts lawsuit outcome.
