company:
  name: Polymarket
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Polymarket is a New York-based blockchain prediction market platform founded in June 2020 by Shayne
    Coplan that evolved from a pandemic-era experiment into the world's leading event-trading venue,
    recording $10.57 billion in monthly trading volume in March 2026. After settling CFTC charges in
    January 2022, the company acquired a regulated exchange in July 2025 and relaunched in the United
    States in December 2025, backed by a $2 billion commitment from Intercontinental Exchange at a $9
    billion valuation; a $600 million Series E followed in March 2026. Persistent state-level legal
    challenges, wash-trade controversy, and high key-person concentration remain material diligence factors.

sections:
  - id: section-identity
    title: Identity, Mission, and Product
    body: >-
      Polymarket is a blockchain-based prediction market platform founded in June 2020 by Shayne Coplan,
      a New York City native who dropped out of New York University to pursue prediction markets and
      blockchain technology. The platform launched initially under the name Union.market during the early
      months of the COVID-19 pandemic, conceived as a mechanism to fight misinformation by pricing
      real-world events and incentivizing accurate forecasting. It subsequently rebranded to Polymarket
      as its scope expanded beyond the pandemic to cover politics, sports, economics, technology, and
      entertainment.

      The company is headquartered in New York City and operates primarily as an online prediction market
      platform built on the Polygon network—an Ethereum layer-2 scaling chain—using USDC as the
      denomination and settlement currency. This technical stack gave Polymarket meaningful advantages
      over earlier blockchain prediction platforms: lower transaction costs, faster settlement, and
      clear dollar-denominated pricing. The non-custodial architecture means smart contracts automatically
      enforce payout rules; outcomes are verified through Universal Market Access (UMA), a decentralized
      oracle protocol that uses token-holder votes to adjudicate disputed resolutions.

      Polymarket's business model charges a 2% fee on net winnings while users pay nothing on losses or
      mid-market trades. The company is exploring media and data-licensing revenue from institutional
      partners and media outlets. Following the October 2025 ICE investment, Polymarket's data and market
      prices began flowing to ICE's institutional network, representing a potential path toward systematic
      data-service revenues alongside trading fees. As of May 2026, the platform operates globally at
      polymarket.com and through the Polymarket US entity (QCX LLC), a CFTC-regulated Designated Contract
      Market that launched in December 2025 for US users via a waitlist-based iOS rollout with full KYC
      verification.
