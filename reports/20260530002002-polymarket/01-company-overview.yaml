  - id: section-funding
    title: Funding History and Capital Structure
    body: >-
      Polymarket has raised approximately $2.9 billion across at least eight financing events through
      March 2026. The funding arc runs from a $4 million seed round in July 2020 through a $600 million
      Series E in March 2026, with a transformative $2 billion Series D commitment from Intercontinental
      Exchange in October 2025 that established a $9 billion pre-money valuation and made Polymarket
      among the highest-valued private fintech companies globally.

      The May 2024 Series B led by Founders Fund and Dragonfly—with participation from Vitalik Buterin,
      1confirmation, and ParaFi—was the pivot point at which institutional venture capital attached to a
      previously crypto-native project. By October 2024, a Series C of $90.9 million followed, reflecting
      growth ahead of the November 2024 US election cycle. The July 2025 $135 million Series D tranche
      arrived just before the QCEX acquisition, and an August 2025 undisclosed round led by 1789 Capital
      placed Polymarket at a $1 billion post-money valuation ahead of the ICE deal.

      The ICE partnership is strategic as well as financial: ICE serves as a global distributor of
      Polymarket's event-based data to institutional trading desks, integrating prediction market
      intelligence into its wider market infrastructure. A March 2026 $600 million Series E (with ICE
      again as lead) deepened this relationship. Secondary market trades in January 2026 implied a
      valuation of up to $11.6 billion; a TechStack IPO tracker estimate from May 2026 placed the
      company at $9.6 billion. As of late April 2026, the company was reportedly negotiating a
      $400 million round at a $15 billion valuation. Revenue is not publicly disclosed; the 2% net-
      winnings fee structure at Q1 2026's $26.2 billion volume creates a large theoretical fee pool,
      but actual capture rates, costs, and margins remain private.
