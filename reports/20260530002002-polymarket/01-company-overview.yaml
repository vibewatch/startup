  - id: section-leadership
    title: Founders, Leadership, and Governance
    body: >-
      Polymarket was founded, built, and continues to be led by Shayne Coplan, born in 1998 and raised
      on the Upper West Side of Manhattan. As a teenager, Coplan participated in the initial coin offering
      of Ethereum in 2014, gaining early crypto exposure and seed capital for later ventures. He studied
      computer science at New York University before leaving during his freshman year to pursue blockchain
      and prediction markets. In June 2020, at age 22, he built and launched Polymarket from his Lower
      East Side apartment, inspired by economist Friedrich Hayek's theories on decentralized information
      and Robin Hanson's concept of futarchy.

      Following the January 2022 CFTC settlement, Coplan recruited J. Christopher Giancarlo—former
      chairman of the US Commodity Futures Trading Commission—to chair Polymarket's advisory board in
      May 2022, a significant regulatory credibility signal ahead of re-entry plans. In July 2024,
      statistician and FiveThirtyEight founder Nate Silver joined the advisory board; the accompanying
      press release noted that trading volume had already topped $400 million year-to-date. These two
      appointments constitute the most publicly documented governance layer for what remains a private
      company without a publicly disclosed board of directors.

      Following the October 2025 ICE investment, Coplan's approximately 11% ownership stake translated
      to a personal net worth exceeding $1 billion, making him the world's youngest self-made billionaire
      according to Bloomberg's index at that time. Key-person concentration is a material diligence
      factor: Coplan remains the central strategic executive, public face, and primary brand. The
      company's CLO, Neal Kumar, has been publicly active in legal strategy—notably communicating about
      the 2026 state lawsuits. Raymond Qin serves as President of the US entity, and Art Malkov as Chief
      Marketing Officer. Headcount reached approximately 241 as of February 2026 and approximately 325
      by April 2026, reflecting rapid hiring alongside the US relaunch and Series E fundraising.
