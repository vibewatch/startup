  - id: section-milestones
    title: Scale, Milestones, and Competitive Position
    body: >-
      Polymarket's trading volume trajectory is the clearest proxy for its scale and momentum. The
      platform recorded $10.57 billion in trading volume for March 2026—its first month crossing the
      $10 billion threshold—roughly 2.5 times higher than peak volumes seen during the October 2024 US
      presidential election cycle. Total Q1 2026 volume reached approximately $26.2 billion, up over
      90% from the prior quarter. In April 2026, Polymarket and Kalshi together crossed a combined
      lifetime trading volume of $150 billion.

      Sports markets, crypto price binaries, and geopolitical events now anchor daily activity alongside
      the election cycles that first drove mainstream attention. Polymarket US, launched December 2025
      as the domestic DCM entity, generated over $700 million in March 2026 despite being restricted to
      sports-related markets only, with its share of total platform activity doubling to 6.6% by March
      2026. Market concentration is an ongoing risk: published analysis indicates 63% of total volume
      is concentrated within the top 0.23% of wallets, indicating dependence on a small group of large
      traders.

      Polymarket's principal competitor, Kalshi (CFTC-licensed DCM since 2020), posted $14.81 billion
      in April 2026 volume—exceeding Polymarket's $9.01 billion for that month—though Polymarket retains
      brand primacy in crypto-native, decentralized, and politically-focused trading. Key product
      milestones include: the 2023 Titan submersible viral moment that drove user onboarding; the 2024
      election cycle during which Polymarket handled $3+ billion in US presidential bets and captured
      approximately 85% of all online election wagers; the QCEX acquisition in July 2025 enabling the
      regulated US entity; December 2025 US relaunch; and the March 2026 monthly volume record.
