  - calloutType: risk
    title: Key-Person Concentration and State Legal Uncertainty
    body: >-
      Shayne Coplan remains the dominant strategic actor and brand; no succession plan or deputy CEO
      has been publicly identified. Simultaneously, active lawsuits in Massachusetts, Michigan, and
      multiple other states could force geofencing that fragments liquidity—Polymarket's core asset.
      Wash-trade concerns from the 2024 Fortune investigation remain unresolved by independent audit.
