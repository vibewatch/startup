callouts:
  - calloutType: strength
    title: "Polymarket's Global User Base and Fee-Revenue Efficiency Remain Distinctive"
    body: >-
      Despite trailing Kalshi in notional trading volume and valuation, Polymarket retains compelling
      competitive strengths. Its 678,342 unique April 2026 traders are approximately 8 times Kalshi's
      estimated active user count, reflecting deeper global penetration and more democratized market
      access. More importantly, Polymarket generated $29.2 million in platform fee revenue in April 2026—
      substantially more than Kalshi's implied fee revenue on a per-dollar-of-volume basis—because its
      2% net-winnings model captures high value from profitable active traders. Combined with its $449.9
      million in open interest, Polymarket's fee yield superiority indicates higher platform engagement
      quality per trader, even as Kalshi leads on institutional and high-frequency notional volume.
    claimRefs:
      - CP011
      - CP012
      - CP035
  - calloutType: risk
    title: "Wash Trading and Insider Trading Enforcement Create Competitive Credibility Risk"
    body: >-
      Two categories of adverse evidence create meaningful competitive credibility risk for Polymarket
      compared with its regulated peers. Columbia University researchers estimated that up to 25% of
      Polymarket's trading volume over three years may have been wash trading, with peaks of 60% in
      December 2024 and 45% historically in sports markets—concentrated in a pre-airdrop incentive
      environment. The April 2026 CFTC/DOJ insider trading action against a US Army soldier who allegedly
      earned $404,000 on Polymarket using classified military information is the first-ever event contract
      insider trading enforcement case, and Kalshi has explicitly used it in Washington advertising to
      differentiate its KYC-enforced, surveillance-equipped regulatory posture. These dynamics risk
      accelerating institutional and Congressional preference for regulated alternatives.
    claimRefs:
      - CP025
      - CP026
      - CP027
      - CP028
      - CP030
  - calloutType: insight
    title: "CFTC Regulatory Clarity Creates a Two-Tier Market Structure Favoring Kalshi"
    body: >-
      The March 2026 CFTC derivatives ruling formally classifying prediction market contracts as derivatives,
      combined with Chairman Selig's January 2026 announcement supporting responsible development of event
      contract markets, has codified the regulatory advantage that Kalshi has operated under since 2021.
      This two-tier market structure—full-federal-DCM vs offshore-crypto—structurally limits Polymarket's
      institutional distribution to the ICE data partnership and its nascent QCX US entity, while Kalshi
      accesses the entire US institutional capital market through its broker ecosystem including Robinhood.
      The state-level legal challenges affecting both platforms (AZ, NV, NJ) will likely resolve in
      favor of federal preemption over time given the Supremacy Clause, but the interim regulatory
      uncertainty benefits the platform with the cleaner regulatory record.
    claimRefs:
      - CP032
      - CP033
      - CP034

