  - id: section-adjacent-substitutes
    title: Adjacent Substitutes — Sportsbooks, Forecasters, and Emerging Platforms
    body: >-
      Beyond direct prediction market peers, Polymarket faces meaningful competition from adjacent platforms
      that serve overlapping user motivations of financial speculation and probabilistic forecasting.
      Robinhood's event contract offering, built on Kalshi's infrastructure, processed over $1 billion
      in Q2 2025 in its first months of operation and traded more than 9 billion contracts by early 2026,
      with over one million users participating. Robinhood charges $0.01 per contract per side, dramatically
      lowering the onboarding barrier for mainstream US retail traders who already hold brokerage accounts.
      DraftKings Predictions and FanDuel Predicts—respectively operated through Railbird Technologies and
      CME Group as CFTC-licensed DCMs—expanded as active market makers in 2026. DraftKings CEO Jason Robins
      characterized prediction markets as "one of our fastest to profitability business lines we've ever
      launched" on its Q1 2026 earnings call. Traditional sportsbooks collectively process approximately
      $14 billion per month in legal US wagering, serving as the incumbent status quo for sports outcome
      speculation; their implicit vig of 4–5% is materially higher than prediction market effective fees.

      On the informational-substitute end, Manifold Markets operates a play-money platform with approximately
      18,000 daily active users and no KYC requirement, globally accessible, offering user-created binary
      and multi-choice markets. Manifold's play-money accuracy is estimated only 3–5% worse than real-money
      platforms: its Brier score on the 2024 US election was 0.0342 versus Polymarket's 0.0296. While
      Manifold poses no direct commercial revenue threat to Polymarket, it satisfies the forecasting utility
      of prediction markets for a significant global research community. Metaculus, a points-based forecasting
      platform with approximately $3.9 million in estimated annual revenue and 30+ employees, serves academic
      and professional forecasters with an API and private tournament service. PredictIt transferred
      operational control to the US-based PMRC in July 2025 and continues under a CFTC no-action letter
      with political market focus and $850 contract caps. Emerging on-chain platforms including Predict.fun
      ($579M April volume), Opinion ($376M), and Limitless ($205M) collectively represent a long tail of
      approximately 5–15% of total prediction market activity but remain early-stage relative to the duopoly.
