chapter:
  number: 3
  title: Competitors
  summary: >-
    Polymarket occupies a global duopoly with Kalshi in the prediction market sector, together controlling
    roughly 85–95% of all trading activity and $150 billion in combined lifetime volume as of April 2026.
    Kalshi has overtaken Polymarket as the largest platform by notional trading volume ($37.5B vs $29.2B
    YTD through April 20, 2026) and by valuation ($22B vs $15B), driven by its CFTC-designated contract
    market (DCM) status, Robinhood distribution partnership, and sports-led volume engine. Polymarket
    retains a substantial global user-base advantage (678K unique traders in April vs Kalshi's estimated
    ~85K), earns more platform fee revenue per dollar of volume ($29.2M in April), and continues to lead
    in political and crypto event categories. Sportsbooks (DraftKings Predictions, FanDuel Predicts), play-money
    forecasters (Manifold Markets, Metaculus), and the legacy PredictIt round out the adjacent competitive set.
    Material adverse dynamics include a Columbia University finding that up to 25% of Polymarket's
    historical volume may constitute wash trading, the first CFTC/DOJ insider trading enforcement action
    against a Polymarket trader in April 2026, and ongoing Congressional scrutiny differentiating Kalshi
    from Polymarket on regulatory posture.

sections:
  - id: section-competitive-landscape
    title: Competitive Landscape Overview
    body: >-
      Polymarket competes in a rapidly scaling prediction market sector that has grown more than 17-fold
      in trading volume between mid-2024 and early 2026. Combined monthly global trading volume on Kalshi
      and Polymarket surged from under $5 billion in September 2025 to approximately $24 billion in April
      2026, according to a Pew Research Center analysis of data from The Block. Monthly active users across
      prediction markets grew from approximately 4,000 in early 2024 to over 600,000 by late 2025.

      The competitive landscape divides into four tiers. First, direct peers in real-money event contract
      trading: Kalshi (CFTC-regulated DCM, US-focused) and Polymarket US (QCX LLC, the company's own
      regulated US entity). Second, adjacent sportsbook substitutes that have entered event-contract trading:
      DraftKings Predictions and FanDuel Predicts, both operating as active market makers through CFTC-licensed
      infrastructure. Third, status-quo informational substitutes that satisfy the forecasting job-to-be-done
      without real money: Manifold Markets (play-money, global) and Metaculus (points-based, professional).
      Fourth, legacy and emerging alternatives including PredictIt (CFTC no-action, political markets only),
      and a long tail of on-chain venues led by Predict.fun ($579M monthly volume), Opinion ($376M), and
      Limitless ($205M) in April 2026.

      Within this landscape, Kalshi and Polymarket control roughly 65% and 35% of global trading volume
      respectively as of April 2026, a near-complete reversal from December 2024 when Polymarket held
      approximately 95% of sector volume. This structural shift traces directly to Kalshi's CFTC-regulatory
      moat and Robinhood distribution, making competitive-moat durability the central diligence question
      for Polymarket's investment thesis. Kalshi accounted for approximately 90% of US regulated prediction
      market activity as of February 2026 according to a Bank of America report cited in CNBC coverage.
