  topStrengths:
    - >-
      Polymarket has clear category leadership in prediction markets, with multi-billion-dollar monthly volume, broad
      event coverage, and meaningful trader mindshare that competitors still chase.
    - >-
      The product stack is technically differentiated enough to matter, combining Polygon-based conditional tokens, an
      upgraded high-throughput order book, open APIs, and institutional distribution through ICE.
    - >-
      Monetization is no longer hypothetical: the March 2026 fee launch and collateral economics imply a real
      nine-figure revenue run rate with substantial operating leverage if integrity and retention hold.
  topRisks:
    - >-
      Active DOJ and CFTC insider-trading enforcement, ongoing state-law conflict, and broader event-contract rulemaking
      create material regulatory and legal uncertainty.
    - >-
      Wash trading, informed-trading asymmetry, and whale concentration could mean reported liquidity overstates the
      quality and durability of genuine end-user demand.
    - >-
      The valuation stack has moved faster than public proof, with limited audited financial disclosure and meaningful
      dependence on ICE for capital, governance influence, and institutional distribution.
  unresolvedGaps:
    - Audited 2026 revenue, gross margin, burn, runway, and treasury-yield economics remain undisclosed.
    - >-
      Public sources do not cleanly show cohort retention, customer concentration, bot-versus-human mix, or post-fee net
      revenue quality by segment.
    - Board composition, liquidation preferences, ICE side-letter economics, and founder-control rights remain opaque.
    - >-
      Recent market-integrity enhancements have not yet produced a long enough public record to verify whether wash
      trading and manipulation meaningfully declined.
