  - id: named-user-proof
    title: Named User Proof & Market Category Usage
    body: >
      Polymarket's on-chain settlement infrastructure enables rare transparency for a prediction market:
      individual trader P&L is verifiable by blockchain address. The platform's public leaderboard confirms
      top-20 traders with lifetime profits in the $1 million to $2.4 million range, representing genuine
      production-grade participation. The most widely documented case is trader "sovereign2013," credited with
      turning a $1 stake into approximately $3.3 million using a Claude-powered algorithmic workflow—covered
      in multiple independent media outlets and verifiable by on-chain address trace. Bot operator "OpenClaw"
      reportedly earned $115,000 in a single week with trades tagged through the Builder API. Named
      third-party analytics platform Polyloly tracks whale positions across $1 billion or more in monthly
      volume, independently corroborating the concentration of activity among sophisticated participants.
      At the institutional level, market-making firms including Jump Trading and Susquehanna have been
      cited in industry sources as operating on the platform, attracted by the CLOB upgrade that removed
      the 500-millisecond taker delay and enabled sub-100-millisecond execution. Market category depth also
      reveals genuine adoption: 1,600+ active political markets as of April 2026, sustained election market
      volume of $350 million per month, and growing non-political categories across crypto, sports, and
      geopolitical markets. Evidence of real user outcomes across segments, combined with on-chain
      traceability, makes this one of the more verifiably documented B2C prediction market user bases.
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
    tableRefs:
      - TU003
    figureRefs:
      - FU003

  - id: retention-satisfaction
    title: Retention, Satisfaction & Adverse Evidence
    body: >
      Retention data is mixed and skewed by election cycles. The strongest available figure is a 65% 30-day
      retention rate for the Q4 2024 sign-up cohort, which Polymarket outperformed over 85% of comparable
      DeFi and crypto trading protocols. However, post-election 60% volume declines show sharp churn among
      event-driven casual users. App store satisfaction diverges sharply by platform: the iOS app carries
      approximately 4.7 out of 5 stars from more than 30,000 reviews, while the Android app sits at roughly
      2.2 out of 5 stars from over 7,000 reviews—a gap driven primarily by crashes, login failures, and
      interface bugs on Android. Trustpilot reviews paint a more critical picture, with an estimated score
      near 1.3 out of 5, reflecting recurring complaints about withdrawal difficulties, frozen funds, and
      unresponsive customer support. Adverse research evidence is substantial: a Columbia University study
      estimated up to 25% of total Polymarket trading volume constitutes wash trading, with sports markets
      peaking near 45% wash rate historically and election markets at approximately 17%. A Harvard Law
      School study documented an estimated $143 million in anomalous profits extracted by informed traders
      over a two-year period, representing a transfer from uninformed retail participants to those with
      material non-public information. These findings are highly material to retention because they undermine
      the "wisdom of the crowd" signal quality, reduce trust among retail losers, and expose the platform
      to regulatory enforcement action. Polymarket has responded with a 2026 fee structure intended to deter
      wash trading economically, and with market integrity pages for user reporting.
    claimRefs:
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: expansion-concentration
    title: Expansion, Concentration & Referral Dynamics
    body: >
      Polymarket's 2026 expansion strategy leverages a redesigned referral program and a Builder Program
      as its primary community-acquisition channels. The referral program, launched in updated form in
      early 2026 following the introduction of trading fees, pays direct referrers 30% of net trading fees
      generated by referred users for 180 days, plus 10% of fees from second-level indirect referrals.
      Eligibility requires a $10,000 lifetime trading volume threshold, which effectively gates the
      referral channel to experienced, high-volume traders rather than casual participants—a deliberate
      design to tie acquisition costs directly to revenue generation and filter low-activity referrers.
      The previous flat $10 sign-up bonus was discontinued; the performance-based model is commercially
      more defensible but concentrates acquisition power in the existing power-trader cohort. Concentration
      risk is significant: the top 10 trading bots collectively account for the majority of programmatic
      volume; the single largest bot (Betmoar) alone controls ~42% of Builder Program attributed flow.
      This dynamic gives a narrow group of sophisticated actors outsized influence over liquidity depth,
      spread tightening, and price discovery quality—advantages accruing disproportionately to users with
      capital, latency infrastructure, and API expertise. For manual retail participants, this creates an
      adverse selection environment in high-liquidity markets. Geographic expansion is partially constrained
      by regulatory friction: Nevada maintains a court-ordered restriction on sports, entertainment, and
      election contracts; multiple European jurisdictions restrict access; OFAC-sanctioned regions are
      permanently blocked. The CFTC-regulated US product broadens domestic access but maintains separate
      KYC requirements and is subject to ongoing state-level litigation.
    claimRefs:
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
      - CU041
      - CU042
      - CU043
