company:
  name: Polymarket
chapter:
  number: 6
  title: Customers
  summary: >
    Polymarket's user base has grown to over 2.5 million all-time wallet addresses, with 1.2 million unique
    traders recorded in 2024 alone and daily active user peaks of 250,000 on Election Day 2024. The platform
    operates in 160+ countries and exhibits a pronounced event-driven usage pattern anchored to elections and
    geopolitical markets, though multi-category expansion has helped sustain activity between peaks. Significant
    concentration risks exist: trading profits are captured overwhelmingly by a small elite of algorithmic traders
    and institutional desks, and adverse evidence includes a Columbia University study flagging up to 25% wash
    trading and a Harvard Law School study documenting $143 million in anomalous informed-trading profits
    extracted from uninformed retail participants.

sections:
  - id: trader-segmentation
    title: Trader Segmentation & User Base
    body: >
      Polymarket's user base spans four broadly distinguishable segments that differ substantially in behavior,
      volume contribution, and retention profile. Casual retail traders—the largest segment by head count—are
      primarily event-driven participants who join during politically or culturally significant moments such as
      elections, major sporting contests, or breaking geopolitical events. This segment accounts for the bulk of
      new sign-up surges, such as the 45% first-time-user cohort recorded in Q4 2024, but demonstrates the
      weakest multi-month retention and relies on a straightforward mobile or web interface rather than the
      CLOB API. Power retail traders maintain more diversified market positions across political, crypto, sports,
      and AI categories; this cohort exhibits meaningfully higher 30-day retention and represents the core of
      Polymarket's recurring non-event volume. The algorithmic and bot segment—concentrated around the Builder
      Program's ranked leaderboard—drives the majority of programmatic order flow; the top bot Betmoar alone
      routed $1.34 billion in cumulative volume, roughly 42% of all attributed Builder Program activity.
      Finally, a small institutional tier of quant desks and market-making firms (including reported participants
      such as Jump Trading and Susquehanna) provides depth and tight spreads on flagship election and finance
      markets. Geographically, international users dominate: Polymarket operates in 160+ countries, and April
      2026 data shows the international platform generating $9 billion in monthly volume versus $1.3 billion
      for the CFTC-regulated US product. The core user profile is crypto-native, requiring USDC stablecoin
      deposits and Polygon wallet management—creating meaningful friction for non-crypto-experienced retail.
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory
    title: Adoption Trajectory & Event-Driven Growth
    body: >
      Polymarket's growth trajectory is tightly coupled to high-salience global events, particularly US
      elections. The 2024 US Presidential Election was the single most consequential growth catalyst in the
      platform's history: monthly trading volume hit a record $1.2 billion in November 2024, election markets
      accounted for 65% of all Q4 2024 volume ($2.8 billion of $4.5+ billion lifetime), and daily active
      users peaked at 250,000 on Election Day. Total unique traders for calendar year 2024 reached 1.2 million,
      representing approximately 500% year-over-year growth from 2023. All-time cumulative wallet addresses
      reached approximately 2.5 million by April 2026. The platform's Harvard Law–cited academic study
      found roughly 50,000 unique wallet addresses were active across 93,000 distinct markets over the
      two-year window from February 2024 to February 2026, suggesting a sustainably active base well beyond
      election-season spikes. Post-election, trading volume declined approximately 60% from peak levels—a
      pattern consistent with all prediction markets—but the platform's multi-category expansion into
      sports, crypto price markets, AI, and entertainment categories helped sustain ongoing daily volume
      rather than reverting to pre-election lows. By early 2026, political markets alone were generating
      $350 million per month, with more than 1,600 active political contracts listed. The launch of the
      CFTC-regulated US product in late 2025 added a regulated domestic channel alongside the global
      Polygon-based platform, broadening the total addressable user base.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
