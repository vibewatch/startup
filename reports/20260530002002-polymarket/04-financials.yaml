  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >-
        Polymarket has not disclosed an audited P&L, gross margin, or unit-economics breakdown.
        No public filing or regulatory submission includes these metrics.
      whyItMatters: >-
        Without audited gross margin data, revenue quality cannot be underwritten. The 80%+
        theoretical gross margin estimate assumes zero direct cost of revenue beyond Polygon gas
        and oracle fees, but compliance, maker-rebate programs, and Treasury yield subsidies
        are material unquantified costs.
      diligencePath: >-
        Request audited financial statements for fiscal years 2024 and 2025, plus management
        accounts for Q1 2026. Specifically: gross revenue, cost of revenue, maker-rebate expense,
        and net operating income.
      relatedQuestionRefs:
        - QI006

    - type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: >-
        Polymarket's monthly gross burn rate and current cash-on-hand position are not disclosed
        in any public source. The $8M+/month estimate is a rough third-party inference from
        headcount and disclosed incentive programs.
      whyItMatters: >-
        Capital adequacy and runway assessment are fundamental to investment underwriting. The
        Series E capital appears adequate for near-term operations, but the exact runway and
        future capital requirements are unknowable without internal financial data.
      diligencePath: >-
        Request CFO attestation letter showing cash and equivalents, monthly net cash consumption,
        and projected burn-to-breakeven timeline under the current fee revenue trajectory.
      relatedQuestionRefs:
        - QI017

    - type: private-evidence-only
      severity: material
      topic: data-licensing
      missingEvidence: >-
        ICE data-licensing revenue, contract terms, and revenue-sharing mechanics between ICE
        and Polymarket are not publicly disclosed. The contractual exclusivity period, pricing,
        and revenue attribution are unknown.
      whyItMatters: >-
        If data licensing contributes a significant and recurring revenue stream, it materially
        changes Polymarket's revenue quality and diversification profile. Conversely, if the
        arrangement generates negligible near-term revenue, it does not offset the platform's
        concentration risk.
      diligencePath: >-
        Review the full data-licensing agreement between ICE and Polymarket, including revenue
        sharing schedule, exclusivity duration, and institutional subscription metrics.

    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: >-
        No primary source discloses CAC (customer acquisition cost), LTV (lifetime value),
        cohort retention curves, or churn rate segmented by professional versus retail traders.
      whyItMatters: >-
        The platform's revenue sustainability depends on whether it can retain its small cohort
        of professional traders. Without LTV and churn data, the revenue concentration risk
        cannot be quantified and the payback period on any user acquisition investment is unknown.
      diligencePath: >-
        Request marketing and acquisition spend breakdown, trader cohort retention data, and
        separate LTV analysis for algorithmic/professional versus retail trader segments.
      relatedQuestionRefs:
        - QI015

    - type: partial-evidence
      severity: material
      topic: burn-rate-precision
      missingEvidence: >-
        Polymarket's exact monthly burn rate is only estimable via inference from reported
        headcount (~241 employees) and the 4% annual yield subsidy. No audited figure or
        management disclosure is available to refine the >$8M/month estimate.
      whyItMatters: >-
        The precision of the runway calculation directly determines whether the $1.24B+ cash
        position represents adequate multi-year runway or near-term capital pressure under
        growth scenarios.
      diligencePath: >-
        Request audited or CFO-attested monthly burn rate, payroll run-rate, and infrastructure
        cost breakdown as part of Series E due diligence.
      relatedQuestionRefs:
        - QI010

    - type: partial-evidence
      severity: material
      topic: infrastructure-cost-detail
      missingEvidence: >-
        Polymarket's Polygon-based infrastructure operates at low marginal cost per trade, but
        oracle costs, smart-contract audit fees, CFTC compliance expenses, and personnel costs
        per resolved market have not been disclosed by any primary source.
      whyItMatters: >-
        Understanding per-trade infrastructure cost is essential for modeling true gross margin
        and assessing whether the fee revenue model scales profitably at volumes beyond $9B/month.
      diligencePath: >-
        Request itemized operating cost breakdown including oracle network fees, compliance
        personnel costs, and smart-contract infrastructure costs on a per-market and per-trade basis.
      relatedQuestionRefs:
        - QI022
