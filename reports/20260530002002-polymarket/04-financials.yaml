company:
  name: Polymarket
chapter:
  number: 4
  title: Financials
  summary: >-
    Polymarket completed a historic pivot from a zero-fee, venture-subsidized platform to a
    fee-generating exchange in Q1 2026, deploying dynamic probability-based taker fees on
    March 30, 2026 and immediately reaching an estimated $800,000–$1 million in daily gross
    revenue against a $9.55 billion 30-day GMV base. An annualized run rate of approximately
    $300 million is achievable at current volumes, though the platform's burn rate, gross margin,
    and ICE data-licensing revenue remain undisclosed. ICE's $2 billion strategic commitment
    (of which $600 million was deployed in March 2026) ensures multi-year capital adequacy, but
    professional-trader concentration, maker-rebate costs, and persistent regulatory restrictions
    represent material risks to revenue durability.

sections:
  - id: section-revenue-model
    title: Revenue Model and Fee Architecture
    body: >-
      Polymarket's revenue model underwent its most consequential structural change in March 2026
      when the platform transitioned from zero-fee trading to a probability-based taker fee system.
      Prior to this shift, Polymarket generated no disclosed protocol revenue despite facilitating
      $23.5 billion in cumulative trading volume. The zero-fee strategy was deliberate: it drove
      global volume growth, liquidity depth, and user acquisition ahead of an eventual monetization
      event. That event arrived on March 30, 2026, when taker fees were expanded across most market
      categories, including finance, politics, economics, culture, weather, and technology. Geopolitics
      and world events markets remain permanently fee-free.

      The fee formula is probability-based: fee = C × p × feeRate × (p × (1 − p))^exponent, where
      C is the number of shares, p is the share price (the implied probability), feeRate is a
      category-specific constant, and the exponent controls how sharply fees taper toward the price
      extremes. Fees peak when a market trades near $0.50 (maximum uncertainty) and fall toward zero
      at prices near $0.01 or $0.99. This structure rewards high-conviction positions and disadvantages
      uncertain markets—the most actively traded and deepest-liquidity segment of the platform.

      The fee schedule varies by category: crypto markets carry a peak rate of 1.80%, sports 0.75%,
      and finance and politics approximately 1.75%. Maker orders (limit orders) receive daily USDC
      rebates of 20–50% of collected taker fees, depending on category. This creates a bifurcated
      cost structure in which sophisticated liquidity providers are subsidized and retail takers
      carry the full fee burden. Secondary revenue streams include implicit AMM spread capture
      (accruing to the Treasury), Treasury USDC yield management (which must exceed the 4% APY paid
      to users to be self-sustaining), and an emerging ICE institutional data licensing channel.
      The POLY governance token, confirmed for a 2026 launch, is expected to introduce a staking
      model that would direct a portion of fee revenue to token holders.
