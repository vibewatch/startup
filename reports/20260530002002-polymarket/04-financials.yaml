  - id: section-volume-traction
    title: Trading Volume, GMV Trajectory, and Revenue Traction
    body: >-
      Polymarket's trading volume expanded dramatically through the second half of 2025 and into
      early 2026, driven by heightened geopolitical and financial market event activity. Monthly
      GMV rose from $2.17 billion in December 2025 to $4.19 billion in January 2026, $7.26 billion
      in February, and peaked at approximately $12.22 billion in March 2026 before pulling back to
      $9.14 billion in April. Year-to-date through April 2026, Polymarket processed $33.50 billion
      in total trading volume. Pew Research Center, analyzing data from The Block, confirmed combined
      monthly trading volume across Polymarket and Kalshi reached approximately $24 billion in April
      2026—comparable to the approximately $14 billion per month wagered across all US legal
      sportsbooks during 2025.

      The March 30 fee launch immediately validated the platform's monetization potential. DefiLlama
      data showed daily fees rising from $363,000 on March 31 to over $1 million on both April 2 and
      April 3, 2026. Retained revenue (after maker rebates) reached $995,000 on April 2 and
      $899,000 on April 3. Based on the $9.55 billion 30-day rolling volume at launch, analysts
      projected a blended daily revenue of $800,000–$1 million, implying approximately $25 million
      monthly and $300 million annualized. By comparison, competitor Kalshi reported an annualized
      run rate of $1.5 billion as of early 2026, indicating Polymarket's fee revenue is growing
      rapidly but has further scale to capture, particularly as Polymarket US (the CFTC-regulated
      subsidiary) had only $1.3 billion in April 2026 trading volume versus $9 billion on
      Polymarket International.
