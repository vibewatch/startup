  - id: section-unit-economics
    title: Unit Economics and Margin Analysis
    body: >-
      Polymarket's unit economics are partially reconstructable from public data but critically
      depend on undisclosed private financials. On the revenue side, the blended effective taker
      fee rate is approximately 0.7% of gross notional trading volume based on analyst estimates.
      At $9.55 billion in 30-day volume, this implies approximately $66.9 million in gross fees
      per 30-day period—from which maker rebates of 20–50% are returned to liquidity providers,
      yielding a net retained revenue estimate of $33–53 million monthly. The gap between this
      estimate and the $25 million monthly figure cited by analysts likely reflects the rebate
      drag and category-mix effects.

      On the cost side, Polymarket's per-trade delivery cost is structurally low: Polygon gas fees
      are under $0.01 per transaction, and smart-contract-based settlement requires no custodial
      infrastructure. This implies theoretical gross margins above 80% on the fee revenue stream,
      before subtracting the maker-rebate program, 4% user yield, platform development, compliance,
      and headcount costs. Professional and algorithmic traders are estimated to drive approximately
      90% of trading volume from just 2% of users; this concentration creates significant revenue
      fragility—any shift in incentives for that cohort (competitive fee erosion, regulatory
      restrictions, alternative platforms) could compress volumes rapidly. Customer acquisition
      cost and lifetime value by segment have not been publicly quantified, limiting the ability
      to underwrite sustained growth.
