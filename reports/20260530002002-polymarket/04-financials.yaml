    title: Revenue Model Bridge — From User Activity to Gross Profit
    type: flow
    layout: standard
    summary: >-
      Illustrates how user trading activity flows through Polymarket's fee architecture into
      gross fee revenue and net retained revenue, incorporating maker rebates and Treasury yield.
    data:
      nodes:
        - id: user-trade
          label: User Executes Taker Trade
          description: "Taker pays probability-based fee; fee = C × p × feeRate × (p(1-p))^exp"
        - id: gross-fee
          label: Gross Taker Fee Collected
          description: "~0.7% blended rate on GMV; peaks at 1.80% for crypto near 50% prob"
        - id: maker-rebate
          label: Maker Rebate Distributed
          description: "20–50% of taker fee returned to liquidity providers in daily USDC"
        - id: net-fee-revenue
          label: Net Fee Revenue Retained
