callouts:
  - calloutType: strength
    title: Fee Architecture Creates Durable Revenue Stream
    body: >-
      Polymarket's probability-based taker fee model is structurally well-designed for a
      prediction market: fees peak where markets are most uncertain (highest trading interest)
      and taper toward zero at extremes, preserving attractive economics for informed bettors.
      The immediate fee launch in March 2026 generated $1 million in daily revenue within 72
      hours, validating the monetization design at scale. At $9.14 billion in April GMV,
      the $300 million annualized run rate represents a genuine and growing revenue foundation.
    claimRefs:
      - CI002
      - CI013
      - CI014
      - CI012

  - calloutType: risk
    title: Revenue Concentration and Regulatory Attrition Risk
    body: >-
      Professional and algorithmic traders are estimated to drive approximately 90% of
      Polymarket's trading volume, from just 2% of the user base. If fee increases, competitive
      pressure from Kalshi or offshore alternatives, or regulatory restrictions cause this cohort
      to reduce activity, trading volume—and hence fee revenue—could collapse rapidly. Bloomberg
      reported in April 2026 that Polymarket "lost its prediction-market lead after delays and
      blowback," and the platform is blocked in 33 countries with US legal action in 11 states.
      Revenue quality is therefore fragile relative to the platform's $9–$15 billion valuation.
    claimRefs:
      - CI036
      - CI037
