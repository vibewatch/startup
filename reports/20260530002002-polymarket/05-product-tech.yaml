  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Polygon PoS reliability SLA
      missingEvidence: >-
        Public SLA documentation or uptime metrics for Polygon PoS sequencer and validator set,
        including any fallback or recovery procedures Polymarket has in place for sequencer downtime.
      whyItMatters: >-
        If Polygon PoS becomes unavailable — due to validator failure, governance attack, or sequencer
        downtime — Polymarket's on-chain settlement would halt entirely; understanding this risk
        requires Polygon's published reliability data.
      diligencePath: >-
        Request Polygon's published SLA, past incident reports, and any bilateral agreement between
        Polymarket and Polygon Labs covering uptime guarantees or emergency response procedures.
      relatedQuestionRefs: [QE017]

    - type: private-evidence-only
      severity: minor
      topic: Neg Risk CTF Exchange internals
      missingEvidence: >-
        Detailed technical documentation on how the Neg Risk CTF Exchange (0xe2222...) handles
        correlated multi-outcome markets and how negative-risk token redemption works mathematically.
      whyItMatters: >-
        Multi-outcome markets represent a growing share of Polymarket volume; without documented
        mechanics, auditors and integrators cannot independently verify payout correctness for
        complex event structures.
      diligencePath: >-
        Review Neg Risk CTF Exchange source code on GitHub and request Polymarket to publish
        dedicated documentation covering multi-outcome token splits, collateralization math,
        and audit coverage for this contract.
      relatedQuestionRefs: [QE021]

    - type: missing-source
      severity: minor
      topic: competitive fee comparison
      missingEvidence: >-
        Independent comparison of Polymarket's 2% fee on net winnings versus Kalshi's fee structure
        and other regulated prediction market venues, including realized effective fee rates.
      whyItMatters: >-
        Polymarket's competitive position on fees and liquidity directly affects trader preference
        and market depth; without a head-to-head comparison, fee competitiveness is unverified.
      diligencePath: >-
        Pull current fee schedules from Kalshi, Augur, and Manifold; compute effective fee rates
        on representative market sizes and compare against Polymarket's published 2% net-winnings fee.
      relatedQuestionRefs: [QE024]

    - type: stale
      severity: minor
      topic: builder code developer documentation
      missingEvidence: >-
        Comprehensive developer documentation explaining how builder codes are registered, what
        on-chain data they expose, and how API-level analytics are derived from the builderCode field.
