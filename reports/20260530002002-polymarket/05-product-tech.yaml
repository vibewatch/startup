  - id: section-developer-ecosystem
    title: Developer Ecosystem, APIs, and SDK
    body: >-
      Polymarket maintains an active open-source developer ecosystem on GitHub (18+ repositories)
      and publishes three primary API surfaces: the Gamma API (market discovery and metadata, no
      auth required), the CLOB API (order placement and order-book access, auth required), and the
      Data API (user activity and analytics, no auth). Real-time updates are delivered via WebSocket
      streams. The Polymarket US DCM product adds a streaming-first institutional REST API with
      gRPC streams for real-time market data and order tracking, documented at docs.polymarket.us.

      Official SDKs exist in Python (polymarket-client, released in beta in 2026), TypeScript, Go,
      and Rust (CLI). The legacy py-clob-client Python library was archived in favor of the unified
      py-sdk. The unified polymarket-apis package on PyPI (last updated May 24, 2026) packages Clob,
      Gamma, Data, Web3, WebSocket, and GraphQL clients in a single Pydantic-validated interface.
      CLOB V2 introduced builder codes, enabling on-chain attribution of orders to specific API
      integrators via a new builderCode field added to the leaderboard and volume endpoints (May
      18 changelog).

      ICE's February 2026 launch of the Polymarket Signals and Sentiment tool represents a parallel
      institutional API channel: ICE normalizes Polymarket market data, maps signals to ICE security
      IDs (equities, commodities, etc.), and delivers the feed through ICE Consolidated Feed and
      ICE Consolidated History for backtesting. This positions Polymarket data as a complementary
      signal alongside traditional pricing, fundamental, and sentiment data for institutional
      quantitative strategies. Polymarket benefits from ICE's global distribution to investment
      banks, asset managers, and hedge funds without building institutional data infrastructure
      itself. Developer community engagement is sustained via the Discord #devs channel, open-source
      bug bounty, and documentation maintained at docs.polymarket.com.
