        Builder codes are a new V2 feature enabling institutional API attribution; gaps in developer
        documentation slow institutional integrator adoption and reduce transparency of platform usage.
      diligencePath: >-
        Review the Polymarket changelog for builder code documentation links; request the Polymarket
        developer relations team to publish a dedicated builder-code guide in docs.polymarket.com.
      relatedQuestionRefs: [QE026]

