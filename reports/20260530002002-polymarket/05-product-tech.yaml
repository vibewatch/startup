  - id: section-compliance-security
    title: Compliance, Security, and Trust Infrastructure
    body: >-
      Polymarket US (QCX LLC) received CFTC Amended Order of Designation in November 2025 (announced
      via PR Newswire), making it only the second US prediction market to hold Designated Contract
      Market (DCM) status alongside Kalshi. Under the amended order, Polymarket developed enhanced
      market surveillance systems, market supervision policies, clearing procedures, and Part-16
      regulatory reporting capabilities. US participants access the platform exclusively through
      FCM (Futures Commission Merchant) intermediaries with full KYC and AML verification; direct
      wallet access is not available for US users under the DCM structure. The regulatory page at
      polymarketexchange.com publishes the full rulebook, risk disclosure statement, and exchange
      member application materials consistent with Commodity Exchange Act requirements.

      On the security side, the core CTF exchange contracts have been audited by ChainSecurity (V1)
      and Quantstamp and Cantina (V2, March 2026). ChainSecurity's audit found "a high level of
      security" with adequate functional correctness and signature handling. A Cantina-hosted bug
      bounty program provides ongoing incentive for responsible disclosure.

      On May 22, 2026, on-chain investigator ZachXBT flagged suspicious outflows from Polymarket's
      UMA CTF Adapter-adjacent addresses on Polygon. The total drained was approximately $520,000
      to $660,000 in POL tokens and USDC.e. Polymarket VP of Engineering Josh Stevens confirmed
      this was not a smart contract exploit but a compromise of a six-year-old private key for an
      internal backend "refiller" wallet used for liquidity top-ups. All permissions tied to the key
      were revoked; user trading balances and market resolution were unaffected. The incident
      nonetheless exposes a material operational security gap: legacy administrative keys with
      privileged access were not rotated or retired when no longer needed, and no on-chain monitoring
      triggered early detection. Post-incident, security experts have called for stricter key
      lifecycle management and continuous on-chain surveillance across all oracle-adjacent addresses.
