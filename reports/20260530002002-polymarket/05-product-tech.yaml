chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Polymarket is a non-custodial prediction market platform on Polygon PoS that combines an
    off-chain Central Limit Order Book (CLOB V2, live April 28 2026) with on-chain settlement via
    the Conditional Token Framework (CTF Exchange V2) and decentralized resolution through UMA's
    Optimistic Oracle. The April 2026 infrastructure overhaul delivered a 10x throughput improvement
    (10,000+ orders/second), pUSD as a native 1:1 USDC-backed collateral token, and EIP-1271 support
    for institutional smart-contract wallets. ICE became the exclusive institutional data distributor
    in February 2026, and the CFTC-regulated QCX LLC DCM opened US access in December 2025 via
    FCM-intermediated onboarding with full KYC/AML. A May 22 2026 private-key compromise drained
    approximately $600K from a legacy operational wallet — no user funds or core contracts were
    affected — but surfaced material key-management risk that requires a post-incident audit trail.

sections:
  - id: section-product-overview
    title: Platform Overview and User Workflow
    body: >-
      Polymarket operates as the world's largest prediction market, enabling any user with a
      non-custodial crypto wallet to trade binary or multi-outcome event tokens denominated in
      USDC-backed pUSD on the Polygon PoS network. On the platform, a "market" represents a
      question about a real-world outcome (politics, economics, sports, crypto, weather) and
      each outcome is tokenized as an ERC-1155 conditional token priced between $0.00 and $1.00,
      where the price reflects the crowd's probability estimate. Winning tokens redeem for exactly
      $1.00 when the market resolves; losing tokens expire worthless.

      From a user perspective, the end-to-end workflow involves four stages: (1) connect a Web3
      wallet (or complete KYC via an FCM broker for US access) and convert USDC to pUSD through
      the on-chain collateral ramp; (2) browse the prediction-market feed — available on web at
      polymarket.com, iOS (4.7 stars, 30,000+ reviews), and Android (3.7 stars, 7,100+ reviews)
      — and select a market; (3) place a limit or market order through the CLOB V2 engine; and
      (4) hold tokens through event resolution, which triggers automatic payout via the UMA oracle.
      As of May 2026, the platform hosts 214,735+ markets across a lifetime base of over 2.4
      million traders and approximately $62 billion in total trading volume.

      The platform carries two distinct product surfaces: the global non-custodial wallet-based
      platform (no mandatory KYC) and Polymarket US (QCX LLC DCM), which launched in December
      2025 via a waitlist iOS rollout requiring full KYC/AML verification and FCM intermediation.
      This dual architecture allows Polymarket to serve both crypto-native retail users and
      regulated institutional participants within a single brand.
