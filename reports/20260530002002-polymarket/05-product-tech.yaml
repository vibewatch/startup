callouts:
  - calloutType: strength
    title: CLOB V2 Delivers Institutional-Grade Throughput
    body: >-
      The April 2026 CLOB V2 launch achieves 10,000+ orders/second at sub-150ms latency — a 10x
      throughput improvement over V1 — and adds EIP-1271 support enabling smart-contract wallets
      and multi-sig institutional accounts for the first time. Combined with builder attribution
      codes and reduced gas costs of $0.02-$0.08 per trade, the V2 architecture materially closes
      the gap with centralized venue performance while preserving non-custodial, on-chain settlement.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008

  - calloutType: risk
    title: May 2026 Key Compromise Reveals Legacy Operational Security Gap
    body: >-
      The May 22 2026 drain of approximately $600K from a six-year-old internal operational wallet
      was not a smart contract exploit, but it exposes a systemic key-management failure: privileged
      backend wallets near the resolution infrastructure lacked rotation policies, and no on-chain
      monitoring triggered early detection. The incident has no direct user impact, but it signals
      that operational security practices lag the platform's smart-contract security posture, and
      any future compromise of oracle-adjacent addresses with larger balances could pose a
      material risk.
    claimRefs:
      - CE023
      - CE024
      - CE040

  - calloutType: insight
    title: ICE Partnership Creates a Flywheel Between Prediction Markets and Capital Markets
    body: >-
      By designating ICE as the exclusive institutional data distributor, Polymarket has embedded
      itself within the workflows of investment banks, hedge funds, and asset managers who subscribe
      to the ICE Consolidated Feed. As institutional participants integrate Polymarket signals into
      quant strategies and risk management, their own informed trading could improve market
      liquidity and signal quality, reinforcing the data product's value to ICE clients — a
      feedback loop that neither a pure crypto-native operator nor a pure financial-data provider
      could replicate alone.
    claimRefs:
      - CE020
      - CE038

