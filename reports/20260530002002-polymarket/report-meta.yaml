  productSummary: Polymarket lets users trade binary and multi-outcome event contracts through an off-chain order book with on-chain settlement, using Polygon-based conditional tokens and USDC-backed collateral.
  customerFocus: Crypto-native retail traders, event speculators, professional market makers, data consumers, and increasingly US institutional intermediaries accessing regulated event contracts.
  businessModel: Transaction fees on net winnings and taker flow, treasury yield on collateral, data-distribution economics with ICE, and potential ecosystem monetization through APIs, builder attribution, and token-linked fee sharing.
  stage: Late private growth / pre-IPO infrastructure buildout
  fundingStatus: Completed rounds publicly include a $45 million Series B in 2024, a $135 million 2025 tranche, a $9 billion October 2025 ICE-led primary, and a $600 million March 2026 Series E close; management and market reports also reference a larger $2 billion ICE commitment and higher follow-on valuation targets.
