  - id: market-sizing
    title: Market Sizing — TAM, SAM, and SOM
    body: >
      The prediction markets industry defies single-lens sizing; different analytical frameworks produce
      meaningfully different numbers depending on whether the reference is notional volume, annualized run-rate,
      comparable sportsbook handle, or projected mature-state revenue. The correct approach is to triangulate
      across methods.

      Notional volume lens: TRM Labs and Dune Analytics data show global monthly trading volume on Kalshi and
      Polymarket combined reached $24 billion in April 2026, implying an annualized run-rate above $240 billion.
      Datawallet and Gambling Insider aggregated 2026 full-year notional volume at $162.65 billion, reflecting
      the ramp from $1.9 billion per month a year earlier. Sports contracts drove $10.1 billion in Q1 2026
      volume alone, with political markets at $5 billion over the same period.

      Analyst forecast lens: Bernstein published a sell-side projection in April 2026 forecasting $240 billion
      for full-year 2026 and $1 trillion in annual volume by 2030, an 80% CAGR from 2025, with the sports share
      expected to decline from 60%+ to ~30% of total as institutional macro contracts grow. Eilers & Krejcik's
      December 2025 report estimated a fully mature US market alone at $1 trillion, broken down as $435 billion
      sports, $310 billion financial and crypto, $160 billion news/political, and $55 billion other categories.
      Twelve organizations received designated contract market status in 2025, a ~500% rise over 2024, signaling
      supply-side capacity for further scaling.

      Sportsbook-handle comparability lens: CNBC noted that E&K crafted a formula translating prediction market
      notional volume to sportsbook-equivalent handle, concluding mature sports prediction markets could support
      handle at roughly 60-80% of today's online sports betting market, which itself was $49.74 billion in 2026.
      This implies a sports-prediction SAM of approximately $30-40 billion in handle terms today.

      Platform concentration limits SOM: Kalshi and Polymarket together control 85-90% of industry volume;
      Kalshi's year-to-date 2026 volume of $37.49 billion gave it approximately 65% global share and 89% of US
      prediction-market activity. Polymarket's global crypto-native user base and decentralized model
      differentiate its SOM from Kalshi's regulated US-centric position.
