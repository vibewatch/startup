  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >
      The prediction markets sector is driven by a constellation of regulatory, technological, and behavioral
      tailwinds operating against significant structural friction.

      Primary growth drivers include CFTC regulatory clarification, which reduces the legal risk premium that
      has historically depressed institutional participation; mainstream financial distribution through platforms
      like Robinhood, Coinbase, and DraftKings; blockchain infrastructure enabling permissionless global
      liquidity and low settlement costs; and the post-2024-election awareness spillover that converted casual
      news consumers into active market participants. The CFTC's March 2026 derivatives determination and
      Innovation Task Force signal an administration intent to support rather than restrict the sector.

      Adoption constraints are material. Regulatory uncertainty remains the largest: legal battles in 14 states,
      the unresolved Kalshi-Nevada appellate fight, and the open public comment period on the CFTC ANPR all
      inject uncertainty about which contracts and which platforms will remain accessible. Insider trading risk
      is an acknowledged enforcement priority — the CFTC Division of Enforcement has signaled it is monitoring
      prediction market chatrooms and social platforms for misuse of material non-public information, and multiple
      federal charges have been filed. Trust barriers from oracle disputes, ambiguous event resolution, and
      platform outages reduce return user rates for retail and institutional buyers alike.

      Switching cost analysis: retail users face low nominal switching costs (wallets are portable, no lock-in
      contracts) but high experiential costs — liquidity fragmentation means moving from Polymarket to a new
      platform risks worse market depth and narrower market selection. Institutional users face API integration
      costs, compliance re-approval, and data-feed migration. The crypto-to-fiat onramp frictions on Polymarket
      (USDC collateral, Polygon network) create a meaningful onboarding barrier for non-crypto-native users
      compared to Kalshi's fiat-native interface.

      Capital intensity and ROI dynamics are adverse for most retail participants: CNBC reported that over 70%
      of Kalshi traders and approximately 69% of Polymarket traders since 2022 lose money, with 77% of gains
      accruing to the top 1% of users. Financial advisors publicly recommend treating prediction market spend
      as entertainment budget, not investment. This structural loss profile limits organic growth from word-of-
      mouth recommendation among retail users who experienced net losses.
