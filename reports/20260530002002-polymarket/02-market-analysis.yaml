callouts:
  - calloutType: insight
    title: "Sports Is the Volume Engine but Not the Strategic Prize"
    body: >
      Sports contracts currently drive 60%+ of global notional volume, but Bernstein and Eilers & Krejcik both
      project sports' share will fall to ~30% by 2030 as institutional macro, financial, and political contracts
      grow faster. For Polymarket, whose volume is more evenly distributed across categories than Kalshi's
      sports-heavy mix, this shift favors its global, decentralized market model if it can secure CFTC-compliant
      distribution before Kalshi locks in the institutional segment.
    claimRefs:
      - CM007
      - CM009
      - CM011
      - CM029
      - CM030

  - calloutType: risk
    title: "Retail Loss Profile Creates Structural Churn Headwind"
    body: >
      Over 70% of Kalshi and ~69% of Polymarket traders lose money, with 77% of gains going to the top 1% of
      users. Financial advisors publicly recommend treating prediction market spending as entertainment, not
      investment. This structural loss profile creates an organic churn risk that requires continuous top-of-
      funnel acquisition to offset, raising long-term customer acquisition cost concerns.
    claimRefs:
      - CM015

  - calloutType: risk
    title: "Regulatory Fragmentation Caps Near-Term US SAM"
    body: >
      Active legal disputes in 14 US states and the unresolved Kalshi-Nevada appellate battle mean the US SAM
      for prediction markets is meaningfully smaller than the full addressable population. The CFTC ANPR's
      open question about prohibited-category contracts also creates uncertainty for high-volume categories like
      sports, where some state regulators argue these are gambling products under state jurisdiction. Resolution
      is likely multi-year.
    claimRefs:
      - CM005
      - CM006
      - CM016
      - CM033

  - calloutType: assumption
    title: "Notional Volume Is Not Revenue"
    body: >
      All market sizing in this chapter uses notional trading volume (total dollars of contracts bought/sold),
      which counts both sides of each trade. Platform revenue is a small fraction of notional volume. Polymarket's
      fee-based revenue model implies platform economics approximately 1-2% of notional volume; a $162.65 billion
      notional market translates to roughly $1-3 billion in total platform fees across all operators. Investors
      and analysts should not apply market-size multiples to notional volume without adjusting for take rate.
    claimRefs:
      - CM001
      - CM007

