evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership and founder table public completeness
    missingEvidence: >-
      A current official executive roster and full board list showing named functional leaders, committee assignments,
      and succession coverage.
    whyItMatters: >-
      Public evidence is founder-centric and reveals only isolated governance names, making management depth and board
      independence hard to assess.
    diligencePath: Request the latest org chart, executive bios, board roster, and committee map from management or the data room.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder or investor map rights stack
    missingEvidence: >-
      A cap table, investor-rights summary, board-observer list, and ownership percentages for major investors and
      founders.
    whyItMatters: >-
      Round size and visible stakeholders are public, but actual control rights, preferences, and liquidation dynamics
      are not.
    diligencePath: >-
      Request the current cap table, charter and financing docs, investor-rights agreement, and most recent board
      consents.
    relatedQuestionRefs:
      - QO007
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current headcount
    missingEvidence: A precise 2026 employee count with location and function breakout plus attrition history.
    whyItMatters: >-
      Public headcount snapshots are all directionally positive, but they differ enough that staffing scale and leverage
      cannot be underwritten confidently.
    diligencePath: Request an HR-system export showing active employees, geography, function, hiring plan, and trailing attrition.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: economics and disclosure
    missingEvidence: >-
      Current revenue quality, margin, burn, cash runway, retention, and product-line contribution data with management
      support.
    whyItMatters: >-
      The public record supports valuation and top-line scale claims, but investment judgment still depends on
      underlying unit economics and liquidity needs.
    diligencePath: >-
      Request the latest board deck or management financials covering ARR bridge, gross margin, burn, runway, and cohort
      retention.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table public chronology
    missingEvidence: >-
      A fuller internal chronology covering unannounced launches, operational setbacks, and governance changes between
      public milestone disclosures.
    whyItMatters: >-
      The public milestone table is strong enough for orientation but not exhaustive enough to evaluate execution
      cadence or internal turbulence.
    diligencePath: >-
      Request a management-prepared timeline of launches, major contracts, incidents, and leadership changes from 2017
      through 2026.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: clean-sam-and-segment-acv
    missingEvidence: >-
      Segment-specific annual contract values and attach rates for police, HOA, retail, transportation, and drone
      modules.
    whyItMatters: >-
      Without ACV and module-attach data, public disclosures cannot convert buyer counts into a dependable Flock-like
      SAM.
    diligencePath: >-
      Obtain representative contracts, renewal quotes, or budget documents from each segment and build a bottoms-up
      revenue bridge by module.
    relatedQuestionRefs:
      - QM024
      - QM026
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: rtcc-adoption-base
    missingEvidence: A reliable public census of how many U.S. agencies operate staffed RTCC or RTIC functions today.
    whyItMatters: >-
      The official agency count overstates the subset that can support always-on real-time operations staffing and
      process overhead.
    diligencePath: >-
      Compile BJA or PERF style RTCC inventories, large-city budget documents, and county or regional center rosters to
      estimate feasible RTCC penetration.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: public-vs-private-installed-base-mix
    missingEvidence: >-
      Current installed-base mix between public-safety agencies and private-sector customers, ideally by revenue and by
      logo count.
    whyItMatters: >-
      The mix determines whether future growth should be underwritten primarily as municipal spend, private-security
      spend, or a balanced two-sided network.
    diligencePath: >-
      Request management reporting that splits customers and ARR by segment, then reconcile it to sales capacity and
      product attach rates.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: renewal-backlash-incidence
    missingEvidence: >-
      A systematic public dataset of cancellations, non-renewals, or delayed procurements tied specifically to privacy
      backlash rather than general budget pressure.
    whyItMatters: >-
      Anecdotes prove the risk exists, but portfolio underwriting needs incidence rates to separate headline controversy
      from durable churn risk.
    diligencePath: >-
      Review council minutes, procurement records, and contract-renewal notices in jurisdictions with known privacy
      activism to build a cancellation dataset.
    relatedQuestionRefs:
      - QM028
  - type: missing-source
    severity: material
    topic: public-pricing
    missingEvidence: >-
      Recent line-item price sheets or awarded-contract exhibits for Axon Fusus, Motorola Vigilant, Genetec AutoVu,
      Verkada government, and Peregrine public safety were not publicly reviewed in this chapter.
    whyItMatters: >-
      List pricing and contract packaging shape competitive win rates, but most vendors in this set still sell by quote,
      making apples-to-apples comparisons difficult.
    diligencePath: >-
      Request current public-sector order forms, cooperative-contract price books, or recent city award exhibits for the
      major vendors and update the pricing table with realized examples.
    relatedQuestionRefs:
      - QP016
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Cohort renewal rates, rip-and-replace win rates, migration effort, and data-migration costs across Flock, Axon,
      Motorola, and Genetec are not publicly disclosed.
    whyItMatters: >-
      Switching-cost strength is a central moat question; without renewal and replacement data, the analysis can
      identify mechanisms but cannot quantify how sticky deployments actually are.
    diligencePath: >-
      Ask management and channel partners for renewal rates, competitive displacement examples, deployment timelines,
      and customer references that migrated from incumbent systems.
    relatedQuestionRefs:
      - QP019
  - type: missing-source
    severity: minor
    topic: channel-access
    missingEvidence: >-
      Public evidence on reseller mix, partner-sourced ARR, and attached-base conversion rates is limited across the
      competitive set.
    whyItMatters: >-
      Distribution power matters because adjacent installed bases can move budget without winning on raw product depth,
      but the exact strength of each vendor's channel is not fully visible.
    diligencePath: >-
      Collect partner-program documents, reseller incentive sheets, and channel interviews for Axon, Motorola, Verkada,
      Skydio, and Flock.
    relatedQuestionRefs:
      - QP021
  - type: missing-source
    severity: material
    topic: peregrine-scale
    missingEvidence: >-
      Peregrine's public site does not expose customer count, ARR, or broad agency-footprint metrics comparable to the
      public-company or better-disclosed vendors in this chapter.
    whyItMatters: >-
      Scale and deployment density affect whether Peregrine is a niche interoperability layer or a broadly credible
      budget-line competitor.
    diligencePath: >-
      Request customer count, deployment footprint, and public-agency reference list directly from Peregrine or find
      procurement awards that identify contract size.
    relatedQuestionRefs:
      - QP012
  - type: missing-source
    severity: material
    topic: dfr-awards
    missingEvidence: >-
      Recent city-level contract awards that show line items for combined RTCC-plus-DFR bundles from Axon, Skydio, or
      Flock were not publicly reviewed here.
    whyItMatters: >-
      DFR is moving from pilot to buying criterion, and hard award data would sharpen the view on whether agencies are
      funding standalone drone programs or broader integrated response stacks.
    diligencePath: >-
      Search large-city council packets, procurement portals, and cooperative purchasing attachments for 2025-2026
