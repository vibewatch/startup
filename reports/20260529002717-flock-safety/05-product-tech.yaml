  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security-attestation
    missingEvidence: Public trust-center style disclosure or customer-shareable proof of SOC 2, ISO 27001, penetration-testing scope, and remediation process.
    whyItMatters: Large public-safety and enterprise buyers will care whether the trust posture is backed by independent assurance, not only policy/process statements.
    diligencePath: Request security packet, most recent pen-test summary, and any SOC 2 / ISO certifications or equivalents under NDA.
    relatedQuestionRefs:
    - QE026
  - type: private-evidence-only
    severity: material
    topic: dfr-reliability-metrics
    missingEvidence: Production uptime, false-alert, maintenance, and battery / dock reliability metrics for DFR, Alpha, and audio/video alerting.
    whyItMatters: The product pitch relies on faster response and operational confidence, but public sources do not quantify reliability at fleet scale.
    diligencePath: Request customer SLA language, fleet uptime dashboards, incident logs, and hardware-failure / false-alert statistics by product line.
    relatedQuestionRefs:
    - QE012
    - QE013
    - QE024
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: condor-remediation
    missingEvidence: Independent or official remediation detail describing the root cause, fix status, and affected scope of the reported Condor exposure issue.
    whyItMatters: If the allegation is accurate, buyers need to know whether the problem was a factory-default mistake, a customer misconfiguration issue, or a systemic product-security weakness.
    diligencePath: Obtain vendor advisory, CVE or security bulletin, and customer remediation guidance tied to the reported PTZ exposure.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: misuse-enforcement
    missingEvidence: Audited misuse statistics, disciplinary outcomes, or external oversight reports showing how often logged controls actually stop or punish misuse across agencies.
    whyItMatters: The main trust challenge is not whether logging exists, but whether it changes behavior at network scale when controversial searches or sharing requests arise.
    diligencePath: Request anonymized audit-review statistics, policy-violation counts, and examples of access revocation or disciplinary action from representative customers.
    relatedQuestionRefs:
    - QE019
    - QE021
    - QE023
    relatedTableRefs:
    - TE004
