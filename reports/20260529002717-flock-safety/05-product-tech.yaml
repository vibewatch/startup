- id: SE_SEC005
  title: Trust, Privacy, Security, Compliance, and Weak Points
  body: 'Official trust controls are substantive and repeatedly stated. Flock says customer agencies own their data, sharing is opt-in, access is tied to named users and approved roles, searches require a case-related reason, logs are available for supervisor review, and LPR data is retained for 30 days unless law or formal approval supports longer storage. The FAQ adds lifecycle encryption, AWS GovCloud for CJIS data, KMS-based key controls, Safe List-based resident deletion options, and no facial-recognition positioning for both LPR and FreeForm. On paper, that is a more mature privacy-and-accountability package than a generic camera stack.


    The weak point is that the public control set is mostly policy and workflow controls, not independently disclosed assurance. The reviewed materials do not surface public SOC 2 or ISO 27001 claims, and the strongest cyber-hardening breadcrumb on the public site is a press-center listing about a Bishop Fox engagement rather than a broadly documented trust center. More importantly, adverse sources argue that mission creep and misuse are not hypothetical edge cases. EFF, ACLU, 404 Media, and state/local drone critics all describe scenarios where optional sharing, audit logs, and local policies did not prevent expansive search behavior, federal-access controversy, oversight bypass, or anxiety about airborne surveillance. The Condor exposure allegation adds a different risk class: even a policy-heavy product can still fail if device or deployment security is weak. Net: Flock’s trust posture is stronger on documented governance mechanics than on independently evidenced security assurance.'
