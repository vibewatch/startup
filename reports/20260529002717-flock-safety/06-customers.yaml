  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Flock Safety's customer proof is strongest in public safety, where official and Reuters disclosures together support a footprint of roughly five thousand law-enforcement accounts and about one thousand business accounts by 2025-2026. Named case studies show real production usage across RTCCs, retailers, HOAs, schools, hospitals, and utilities, but retention and concentration remain under-disclosed: durability is inferred mainly from bundled annual subscriptions, public contracts, and visible cross-sell rather than disclosed NRR, GRR, or churn."
  },
  "sections": [
    {
      "id": "SU_SEC001",
      "title": "Segmentation and customer-base mix",
      "body": "Flock's customer base is no longer just a law-enforcement logo wall, but public safety still appears to be the economic center of gravity. The freshest breadth signal on the company's own site is the customer index, which advertises more than 5,000 law-enforcement agencies, more than 6,000 communities, and more than 1,000 businesses. Reuters' March 2025 financing coverage is directionally consistent but more conservative, reporting over 4,800 law-enforcement agencies, nearly 1,000 businesses, and roughly 30% of revenue from enterprise accounts. Read together, those disclosures imply a business with meaningful private-sector diversification but one still anchored by agency budgets and public-safety workflows rather than by pure enterprise SaaS demand.\n\nSegment breadth is also visible in the operating surfaces Flock now markets. The law-enforcement page explicitly positions public-private data sharing among agencies, schools, businesses, and HOAs; the retail page centers organized-retail-crime and cross-location investigations; the healthcare page focuses on parking-lot safety and campus access; and the transportation page plus MS2 partnership expand the stack into DOT traffic analytics. That breadth matters strategically because it gives Flock more ways to reuse the same camera, search, alerting, and workflow infrastructure across adjacent buyers. The caveat is that the published counts are definitional rather than audited: communities may overlap with agencies and private owners, and the public record still does not disclose exact account splits, revenue by vertical beyond Reuters' enterprise comment, or how many of these accounts are multi-product versus single-camera deployments.",
      "claimRefs": ["CU001", "CU002", "CU003", "CU004", "CU005", "CU006", "CU007", "CU008", "CU009", "CU010", "CU032", "CU042", "CU043", "CU044", "CU049"],
      "tableRefs": ["TU001"],
      "figureRefs": ["FU001"]
    },
    {
      "id": "SU_SEC002",
      "title": "Adoption trajectory and named customer proof",
      "body": "The adoption story is strongest when the analysis separates broad account counts from named production deployments with disclosed outcomes. In law enforcement, Fort Worth's RTCC case shows Flock expanding beyond a single LPR install into an integrated workflow spanning Falcon LPR, third-party camera integration, neighboring-jurisdiction PTZ access, and planned Raven audio-detection expansion; the story ties that setup to 2,227 RTCC calls resulting in arrests and 417 firearms seized from 2021 through September 2023. Tulsa's RTIC case similarly shows FlockOS operating as a real-time command layer across 911, patrol location, body-worn video, PTZ, and LPR, with the customer claiming a 100% homicide-clearance rate in under 17 months. Albany adds a Raven-specific proof point: the department says it began using the product in March 2023 and uncovered 30% more gunfire than previously believed.\n\nOutside public safety, the references show real production usage but with more uneven detail. Academy Sports deployed LPR around stores and later expanded into live and recorded video; the retailer's named story describes an arrest roughly 20 minutes after an inter-store alert. A logistics operator claims multi-facility deployment, elimination of organized-theft losses, and more than 700 stolen vehicles or plates flagged in two months. Shelter Creek COA in San Bruno describes community-scale installation across nine driveways and says the system has helped solve more than 100 crimes over time. Healthcare and school stories also move beyond logo use: a Georgia hospital deployed six Falcon cameras and reported a 55% theft decline over six months, while a Georgia school system built a virtual gate around 100-plus schools. Utilities and transportation are farther down the proof stack. The utility case shows live headquarters deployment and clear operational value, but not multi-site scale; transportation evidence is credible on product fit and partnership distribution, yet still thin on named, scaled, independently corroborated production fleets.",
      "claimRefs": ["CU011", "CU012", "CU013", "CU014", "CU015", "CU016", "CU017", "CU018", "CU019", "CU020", "CU021", "CU022", "CU023", "CU024", "CU025", "CU026", "CU027", "CU028", "CU029", "CU030", "CU031", "CU035", "CU052"],
      "tableRefs": ["TU002", "TU003"],
      "figureRefs": ["FU002", "FU003"]
    },
    {
      "id": "SU_SEC003",
      "title": "Reference quality, freshness, and what the proof really shows",
      "body": "Reference quality is good enough to support a real customer chapter, but not good enough to remove all diligence risk. The positive side is that Flock's retained sources go beyond bare logo use: most named examples include a buyer role, a concrete deployment surface, and a specific metric, incident, or operational quote. The public-procurement layer is also helpful. OMNIA's contract documents and 2026 price list, plus the Oakland-posted CHP agreement, are stronger evidence of live public-sector buying than a marketing page because they show actual products, pricing structures, support obligations, and term mechanics. Those documents also confirm that Flock is selling a broader platform bundle — Raven, FlockOS tiers, Flock911, and DFR services — rather than just fixed LPR hardware.\n\nThe weak point is that most named customer proof is still company-authored and selective. Official case studies naturally surface wins, not dormant accounts, failed pilots, or weak renewals, and only some disclose time windows clearly enough to evaluate freshness. The customer index is useful as the latest breadth signal, but it is not timestamped and does not explain overlap between agencies, communities, and businesses. Reuters adds independent scale context, but it is from March 2025 rather than run-date current. For newer verticals such as utilities and transportation, the public record is even thinner: there is enough to support existence and go-to-market intent, but not enough to cleanly distinguish isolated deployments from repeatable scaled production across many sites. Net: the chapter can underwrite adoption and expansion potential, but not with the same confidence it can underwrite durability or precise concentration.",
      "claimRefs": ["CU032", "CU033", "CU034", "CU040", "CU050", "CU051", "CU052"],
      "tableRefs": [],
      "figureRefs": ["FU004"]
    },
    {
      "id": "SU_SEC004",
      "title": "Retention and durability",
      "body": "Durability is visible structurally, not metrically. Flock's pricing page describes an annual subscription that bundles installation, onboarding, maintenance, repairs, upgrades, and support, and says the company proactively reviews performance and renewal options before expiry. The same page also promises secure offboarding, hardware removal, and data transition if the customer chooses not to renew. The law-enforcement industry page reinforces the service model by stating that Flock handles maintenance, upgrades, and uptime monitoring under one subscription. That design should improve practical stickiness because the customer is buying a managed workflow and support layer, not just hardware that can be left in place without vendor involvement.\n\nPublic contracts reinforce that the relationship is recurring, but they do not reveal actual renewal quality. The Oakland-posted CHP agreement has a 12-month base term, two optional one-year extensions, and renegotiation language for later renewals, which supports the idea that Flock's public-safety relationships are intended to recur. What remains missing is the investor-grade retention stack: no retained source discloses NRR, GRR, churn, gross logo retention, renewal rates by cohort, contract attach by product, or satisfaction scores comparable across segments. That forces the durability judgment to stay cautious. The public record supports recurring contract architecture and operational dependency, but not yet measured proof that customers renew, expand, and stay at a high rate across time.",
      "claimRefs": ["CU036", "CU037", "CU038", "CU039", "CU041", "CU048"],
      "tableRefs": ["TU004"],
      "figureRefs": []
    },
    {
      "id": "SU_SEC005",
      "title": "Expansion motion, concentration, and procurement friction",
      "body": "Flock's expansion motion looks real. The clearest evidence is product packaging plus named cross-sell. Academy moved from LPR into video, Fort Worth added integrated cameras and planned Raven, Tulsa's proof centers on FlockOS rather than just cameras, and OMNIA's 2026 price list shows Raven, FlockOS, Flock911, Enhanced LPR, and DFR offered through one purchasing vehicle. The retail, healthcare, and transportation pages all reuse the same core logic — cameras, alerts, searchable evidence, and one dashboard — which supports a land-and-expand motion into adjacent buyers. Reuters' disclosure that enterprise customers make up about 30% of revenue is important here: it implies private-sector growth is meaningful enough to matter, but still not enough to eliminate public-safety concentration.\n\nThe biggest concentration and expansion risks sit around budget cycles, politics, and dependency on distribution infrastructure. Public safety likely still drives the majority of revenue, yet the company does not disclose top-customer concentration, ARR by segment, or whether a handful of large agencies dominate multi-product spend. Public-sector expansion also depends on procurement paths such as OMNIA and on partners such as MS2 for transportation analytics. Meanwhile, adverse reporting shows real friction: Security Systems News documented customer-trust questions around ICE access; TechCrunch reported cities rejecting Flock cameras and vandalism against deployments; and Connecticut Public shows drone expansion can trigger privacy backlash even when programs move forward. So the customer story is positive on cross-sell and segment breadth, but the concentration overhang remains that Flock still appears most exposed to politically sensitive public-safety spending and to the procurement drag that comes with it.",
      "claimRefs": ["CU003", "CU040", "CU042", "CU043", "CU044", "CU045", "CU046", "CU047", "CU050"],
      "tableRefs": ["TU005"],
      "figureRefs": []
    }
  ],
