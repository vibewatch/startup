  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-pricing
    missingEvidence: Recent line-item price sheets or awarded-contract exhibits for Axon Fusus, Motorola Vigilant, Genetec AutoVu, Verkada government, and Peregrine public safety were not publicly reviewed in this chapter.
    whyItMatters: List pricing and contract packaging shape competitive win rates, but most vendors in this set still sell by quote, making apples-to-apples comparisons difficult.
    diligencePath: Request current public-sector order forms, cooperative-contract price books, or recent city award exhibits for the major vendors and update the pricing table with realized examples.
    relatedQuestionRefs:
    - QP016
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Cohort renewal rates, rip-and-replace win rates, migration effort, and data-migration costs across Flock, Axon, Motorola, and Genetec are not publicly disclosed.
    whyItMatters: Switching-cost strength is a central moat question; without renewal and replacement data, the analysis can identify mechanisms but cannot quantify how sticky deployments actually are.
    diligencePath: Ask management and channel partners for renewal rates, competitive displacement examples, deployment timelines, and customer references that migrated from incumbent systems.
    relatedQuestionRefs:
    - QP019
  - type: missing-source
    severity: minor
    topic: channel-access
    missingEvidence: Public evidence on reseller mix, partner-sourced ARR, and attached-base conversion rates is limited across the competitive set.
    whyItMatters: Distribution power matters because adjacent installed bases can move budget without winning on raw product depth, but the exact strength of each vendor's channel is not fully visible.
    diligencePath: Collect partner-program documents, reseller incentive sheets, and channel interviews for Axon, Motorola, Verkada, Skydio, and Flock.
    relatedQuestionRefs:
    - QP021
  - type: missing-source
    severity: material
    topic: peregrine-scale
    missingEvidence: Peregrine's public site does not expose customer count, ARR, or broad agency-footprint metrics comparable to the public-company or better-disclosed vendors in this chapter.
    whyItMatters: Scale and deployment density affect whether Peregrine is a niche interoperability layer or a broadly credible budget-line competitor.
    diligencePath: Request customer count, deployment footprint, and public-agency reference list directly from Peregrine or find procurement awards that identify contract size.
    relatedQuestionRefs:
    - QP012
  - type: missing-source
    severity: material
    topic: dfr-awards
    missingEvidence: Recent city-level contract awards that show line items for combined RTCC-plus-DFR bundles from Axon, Skydio, or Flock were not publicly reviewed here.
    whyItMatters: DFR is moving from pilot to buying criterion, and hard award data would sharpen the view on whether agencies are funding standalone drone programs or broader integrated response stacks.
    diligencePath: Search large-city council packets, procurement portals, and cooperative purchasing attachments for 2025-2026 drone-as-first-responder awards and bundle configurations.
    relatedQuestionRefs:
    - QP017
    - QP025
