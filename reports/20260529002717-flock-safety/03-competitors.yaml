- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - supporting evidence
  - threat
  - severity
  - implication / mitigation
  rows:
  - - Turnkey one-vendor workflow
    - Flock bundles hardware, software, onboarding, maintenance, and support across LPR, RTCC, and DFR
    - Low-cost modular substitutes or incumbent discounting
    - high
    - Moat holds only if buyers prioritize speed and simplicity over lowest cost
  - - Public-safety-native RTCC + DFR stack
    - FlockOS plus DFR creates broader workflow scope than specialist ALPR vendors
    - Axon + Skydio can now bundle RTCC, evidence, drones, and BVLOS tooling
    - high
    - Flock must keep DFR deeply integrated rather than treated as a sidecar
  - - Any-vendor integration
    - Flock reduces rip-and-replace friction by connecting existing systems
    - The same openness lowers hard technical lock-in and can enable multi-homing
    - medium
    - Retention depends on workflow habit and service quality, not protocol lock-in alone
  - - Trust and policy controls
    - Flock publishes role-based access, logging, and optional sharing controls
    - EFF and ACLU say the network still enables nationwide misuse and expansion
    - high
    - Trust posture needs more than controls; it needs governance that survives adversarial scrutiny
  - - Procurement shortcuts
    - Texas DIR lowers buying friction for part of the market
    - Incumbents and adjacents also have contract vehicles and deeper adjacent procurement surfaces
    - medium
    - Channel reach can erode purely product-led advantages
  - - Innovation speed from private funding
    - 2025 financing and ARR scale give Flock room to expand products quickly
    - Incumbents can answer with ecosystem acquisitions and partnerships
    - medium
    - Capital helps, but adjacent distribution still determines who gets first call in many deals
  - - Internal-build difficulty
    - Government sources say RTCC builds require staffing, integration, policy, and privacy work
    - Agencies with existing estates can still assemble a pane of glass without standardizing on Flock
    - medium
    - The hardest deals will be replacement or overlay deals inside already-integrated agencies
  notes: >-
    Severity reflects competitive pressure on Flock's moat, not vendor execution quality. The register mixes product evidence with public-policy and procurement evidence because all three shape competitive durability in public safety.
