- id: switching-cost-lock-in-and-moat-durability
  title: Switching cost, lock-in, partner access, and moat durability
  body: >-
    Flock's moat looks more durable at the workflow layer than at the sensor layer. The low-end ALPR market is already commoditizing: OpenALPR makes a use-existing-camera, software-first case and publicly lists a starting price point that is far below a turnkey national platform. That does not invalidate Flock's model, but it shows that raw capture and alerting can be undercut. Flock therefore needs buyers to value workflow speed, deployment simplicity, trust controls, and response integration more than the cheapest possible read. Its own materials support that thesis: the company sells a single annual bundle, optional network sharing, logged access, and an RTCC-plus-DFR stack that can be deployed without standing up a full city technology program. Those are real switching-cost mechanisms because they reduce vendor sprawl and operational friction.


    The problem is that incumbent and entrant pressure is also moving up the stack. Axon's Fusus acquisition and later Skydio partnership show that a larger public-safety operating system can now wrap RTCC and DFR together. Motorola's installed base gives it leverage in procurement conversations long before Flock is on the shortlist. Government sources also show why internal-build alternatives never fully disappear: agencies can assemble cameras, CAD, RMS, and mapping into one pane of glass, especially when they already own the underlying systems, even though NIJ and Seattle make clear that doing so demands staffing, governance, privacy review, and data-management discipline. The net result is that Flock is not losing to one single rival. It wins when the buyer wants a public-safety-native, turnkey workflow layer; it is most exposed when the buyer already sits inside an incumbent estate, can accept a modular low-cost substitute, or wants to combine drones, cameras, and interoperability through
    separate specialists.
