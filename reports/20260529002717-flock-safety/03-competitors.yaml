  rows:
  - - Flock Safety
    - Focal company / direct benchmark
    - $275M 2025 financing; $300M ARR; 5,000+ communities
    - Law enforcement, cities, businesses, HOAs, transportation
    - Turnkey bundle across LPR, RTCC, trust controls, and DFR
    - Quote-based pricing and sharper privacy scrutiny than many point solutions
  - - Axon Fusus
    - Direct RTCC platform + incumbent ecosystem
    - Public incumbent; Fusus acquired by Axon in 2024; broad device ecosystem
    - Law enforcement, federal, education, enterprise security
    - One-view real-time ops, evidence continuity, partner-device compatibility
    - Pricing not public; strongest when buyer already uses Axon surfaces
  - - Motorola Solutions Vigilant
    - Incumbent ALPR / video / public-safety stack
    - 5M+ fixed cameras; 300k+ installations; 60%+ PSAP call-handling share
    - Agencies with legacy camera, call-center, or radio estates
    - Broad LPR portfolio with major installed-base leverage
    - More portfolio complexity and no public rate card on reviewed pages
  - - Genetec AutoVu
    - Incumbent unified-security / ALPR vendor
    - Established private security-platform incumbent
    - Justice and public-safety operators with broader security-center needs
    - AutoVu plus wider Security Center / Omnicast / Mission Control scope
    - Reviewed public pages expose less pricing and RTCC detail than Flock or Axon
  - - Leonardo ELSAG
    - Direct legacy LPR specialist
    - Specialist vendor with multiple hardware form factors
    - Agencies prioritizing fixed, mobile, or solar-powered LPR
    - Agency data autonomy and specialized LPR hardware options
    - Narrower workflow layer than Flock or Axon
  - - Rekor / OpenALPR
    - Direct software-led ALPR alternative / substitute
    - Public company; 30k+ collection sites; 775B+ data points
    - Agencies wanting affordable ALPR or existing-camera upgrades
    - Use existing cameras, searchable vehicle data, $72/month entry point
    - Lower workflow breadth than a full RTCC-plus-DFR platform
  - - Verkada
    - Adjacent cloud-video / public-sector platform
    - Private cloud-security vendor with government contract vehicles
    - Government facilities and distributed security teams
    - GovCloud hosting, FedRAMP posture, watchlists, centralized cloud operations
    - Less policing-native workflow depth than Flock
  - - Peregrine
    - Adjacent interoperability layer
    - Private platform; reviewed public pages do not disclose broad scale metrics
    - Police and emergency-response data-unification buyers
    - Real-time interoperability and matched records across systems
    - Does not own the sensor or drone layer
  - - Skydio
    - Likely entrant / DFR specialist
    - 1,200+ public safety agencies; federal procurement paths
    - Agencies building or expanding DFR programs
    - Fast launch, docked operations, strong CAD and RTCC integrations
    - Narrower value proposition unless paired with RTCC/evidence stack
  - - Status quo / internal build
    - Substitute / no-platform option
    - Existing city systems plus local integrators and staff
    - Agencies with strong incumbent estates or constrained rip-and-replace budgets
    - Lowest rip-and-replace cost and maximum local control
    - Integration, staffing, governance, and privacy-review burden remain high
  notes: >-
    Scale and funding cells reflect only the public evidence reviewed for this chapter. Pricing remains quote-based or opaque for much of the set, so the table distinguishes public evidence from disclosure gaps instead of guessing.
