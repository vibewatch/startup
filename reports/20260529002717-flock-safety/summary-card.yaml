  topStrengths:
    - >-
      Flock has built a real workflow moat across LPR, video, audio detection, RTCC software, investigative search, and
      drone response rather than a single-device product.
    - >-
      Scale is already meaningful: public 2025 disclosures support more than $300M of ARR, roughly 70% year-over-year
      growth, and thousands of public-safety and business customers.
    - >-
      The revenue model appears structurally better than one-time hardware resale because annual bundled subscriptions
      include hardware, software, maintenance, upgrades, and support.
    - >-
      Financing access is strong, with a $275M 2025 round at a $7.5B valuation and cumulative funding above $950M to
      support manufacturing, product expansion, and hiring.
  topRisks:
    - >-
      Privacy, civil-liberties, and cybersecurity controversies are already inside congressional scrutiny, litigation,
      and municipal pushback, so trust risk can hit both growth and valuation multiple.
    - >-
      Gross margin, burn, retention, churn, CAC, and the 2025 round's preference stack remain undisclosed, limiting
      confidence that the public mark is underwritten for common-equity buyers.
    - >-
      Public safety still appears to drive roughly 70% of revenue, leaving Flock exposed to procurement cycles, city
      politics, policy backlash, and concentration in politically sensitive budgets.
    - >-
      The model is more capital- and execution-intensive than pure SaaS because manufacturing, installation,
      maintenance, field service, and drones all expand the operational surface area.
    - >-
      If a security incident, interstate data-sharing restriction, or wider cancellation wave emerges, both growth
      expectations and the premium multiple can compress at the same time.
  unresolvedGaps:
    - Cohort retention, NRR, churn, and renewal data by law-enforcement versus enterprise segment are still undisclosed.
    - Gross margin by product line, revenue mix by module, and true software versus service economics remain private.
    - >-
      Investors still need the 2025 cap-table, preference waterfall, participation rights, and any secondary-sale mix to
      judge downside protection.
    - >-
      Top-customer, top-state, and public-sector concentration are not disclosed tightly enough to underwrite
      procurement shock scenarios.
    - Cash burn, runway, and drone/manufacturing capital intensity remain unresolved despite the 2025 financing.
