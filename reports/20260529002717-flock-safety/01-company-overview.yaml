    {
      "id": "privacy-regulatory-and-reputational-overhang",
      "title": "Privacy, regulatory, and reputational overhang",
      "body": "Flock’s own trust materials emphasize that searches are tied to named users, sharing is optional, and agencies control access settings. Those controls matter, but the adverse record shows they have not prevented controversy. Security Systems News reported that ICE and HSI were accessing Flock searches through local agencies without a direct Flock contract. 404 Media said members of Congress opened a formal investigation after reporting on immigration and abortion-related lookups, while EFF and ACLU argue that Flock’s national architecture enables protest surveillance, reproductive-rights targeting, and broader AI-enabled dragnet expansion. State of Surveillance and TechSpot both describe a growing cancellation and non-renewal wave among cities concerned about privacy and federal access, and TechCrunch later reported camera vandalism across multiple states. Product-security scrutiny has also emerged: an Independent Institute article summarizing Benn Jordan’s work said Condor PTZ cameras exposed live and archived footage to the open internet. The practical conclusion is that Flock’s core diligence risk is not merely reputational noise; it is the possibility that surveillance scale, policy design, and governance discipline are misaligned with the company’s expanding footprint.",
