    {
      "id": "funding-scale-and-milestones",
      "title": "Funding history, scale signals, and operating milestones",
      "body": "Flock’s public financing trail is strong enough to anchor later chapters. Official and independent March 2025 coverage supports a $275 million round at a $7.5 billion valuation led by Andreessen Horowitz, with a large syndicate of returning investors. The same package of sources says Flock crossed $300 million in ARR and grew about 70 percent year over year, while public reach figures point to more than 5,000 communities, more than 4,800 law-enforcement agencies, and nearly 1,000 businesses. Those scale signals are meaningful, but they are not equally clean. Headcount snapshots move from 1,100+ employees in 2024 to 1,300 in early 2025 and nearly 1,600 later in 2025, which is directionally positive but still too imprecise to serve as a current operating benchmark. Milestones from the careers timeline and later coverage show the company expanding from LPR into gunshot detection, Flock OS, video, Nova, and drones, capped by the Aerodome acquisition and a new Georgia manufacturing facility. The chronology supports a business that has kept widening its product surface and capital base at high speed, even as disclosure on profitability and control has lagged behind valuation growth.",
