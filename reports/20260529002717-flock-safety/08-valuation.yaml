    "title": "Valuation",
    "artifact": "valuation",
    "summary": "Flock Safety has real scale and momentum\u2014its 2025 round priced the company at $7.5 billion after management disclosed more than $300 million of ARR, roughly 70% growth, and thousands of public-safety and business customers. But that same disclosure implies at least ~25x ARR on the public floor, above most public-safety comparables and only defensible if software mix, retention, and trust risk resolve favorably. Public evidence therefore supports company quality and some premium, but not enough economics or downside protection to call the entry attractive for a new investor."
