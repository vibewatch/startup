    {
      "id": "scenario-analysis-and-return-math",
      "title": "Bull, base, and bear scenarios",
      "body": "Scenario work is where the current entry becomes hardest to defend. The bull case assumes Flock keeps compounding as a premium public-safety operating system, holds growth around the high-30s for several years, deepens software mix, and exits on a multiple closer to Axon than to traditional or smaller public-safety names. That can produce a roughly $10-$14 billion outcome by 2029, but even that only implies about 1.3x-1.9x gross value from the current round. The base case is more conservative and, in our view, more supportable from public evidence: growth decelerates into the mid-to-high-20s, the business still improves mix, and valuation lands around 12x-15x. That points to roughly $6-$8 billion and only around flat to modest upside. The bear case is more damaging because trust or policy shocks can compress both growth and multiple at once. If privacy, security, or local-governance controversies slow adoption and push the valuation toward 6x-9x, the range falls to about $2-$3.5 billion, before any preference waterfall effects.",
