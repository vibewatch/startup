      "id": "buyers-payers-and-land-expand-path",
      "title": "Buyers, payers, and the adoption path",
      "body": "The buyer map differs sharply by segment even when the workflow surface looks similar. In police deployments, RTCC supervisors, chiefs, or operations leaders champion the purchase, but agencies still need municipal budget approval and operational SOPs. Community and HOA deployments are more fragmented: boards or property managers buy, residents experience the benefit, and law-enforcement relationships often make the ROI visible. Retail and private-security deals usually start with ORC, trespass, or perimeter-safety pain, with loss-prevention or security teams owning the budget case. Transportation deployments move again, this time toward planners and operations managers who want always-on count, class, speed, and incident data. Across segments, the most credible adoption path is land-and-expand. Buyers can start with LPR or a perimeter use case, reuse existing hardware where possible, and later add RTCC orchestration, AI search, traffic modules, or drones once the operational workflow widens and trust barriers are cleared.",
