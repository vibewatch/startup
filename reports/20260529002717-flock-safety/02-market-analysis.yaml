    "number": 2,
    "title": "Market Analysis",
    "summary": "Flock Safety’s real market is not generic global ALPR, but the converging public-safety and physical-security operations stack built around LPR, RTCC orchestration, investigative search, and adjacent perimeter-response tools. Top-down TAMs are large, but official buyer-count baselines, privacy constraints, and emerging political backlash mean valuation should lean more on wallet-share expansion and adjacent segments than on unlimited greenfield police-logo growth."
