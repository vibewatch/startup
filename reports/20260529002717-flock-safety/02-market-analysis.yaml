      "id": "sizing-lenses-and-contradictions",
      "title": "Sizing lenses and contradictory estimates",
      "body": "Top-down and bottom-up sizing tell different stories, and both matter. The retained market-report source puts global ALPR spend above ten billion dollars in 2026 and rising, but that figure includes parking, tolling, traffic management, non-U.S. geographies, and factory-gate hardware revenue. It is directionally useful for proving category size, yet too broad for underwriting Flock’s real near-term opportunity. The official U.S. public-safety baseline is far narrower: BJS counted 17,541 state and local agencies, with most of the practical local-buyer universe concentrated in local police departments and sheriffs’ offices and many agencies remaining very small. Flock’s own 4,800-plus agency network claim suggests meaningful penetration already, which shifts future upside from simple logo-count expansion toward deeper wallet share, more modules, and adjacent buyers such as HOAs, retailers, campuses, and transportation managers. The right conclusion is not to pick one lens and ignore the other, but to preserve the contradiction and underwrite segment-specific attach rates rather than generic ALPR CAGR.",
