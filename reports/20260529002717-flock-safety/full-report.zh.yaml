      - number: '5.4'
        title: 差异化与护城河
        blocks:
          - type: paragraph
            body: >-
              Flock 最强的差异化，是它承诺压缩工作流的程度。竞争对手可以销售 LPR、视频或无人机，但 Flock 的主张是，运营员可以从告警摄取到证据复核再到现场协同，一直留在一个控制平面里。Alpha
              公告把这一定位说得很直白：同一套软件可以接收 LPR 告警、数秒内调度无人机，并实时引导警员。National LPR Network
              是第二层护城河：本地摄像头供应商很难复制跨机构布控名单、去冲突和全国读码池访问。开发者平台是第三层护城河，因为它让 Flock 能接入第三方传感器，并把 Flock
              派生告警分发进伙伴工作流，同时不放弃核心运营界面的控制。


              围绕无人机，也出现了制造和部署叙事。收购 Aerodome 后，Flock 推动美国制造、NDAA 合规的 Alpha
              故事，并把它接入更宽平台，而不是把无人机当独立航空产品销售。这一点重要，因为护城河越来越是生态宽度加运营杠杆，而不只是硬件规格。不过，部分护城河仍带有愿景成分：公司营销「连接任意供应商」和低负担部署，但公开材料不披露伙伴数量、生产可靠性指标，也不披露有多少客户把开发者生态用到足以形成结构性切换成本。
