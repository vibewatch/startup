        - 索取工厂利用率、折旧计划和产出计划
      - - 招聘承诺
        - 公开员工数快照为 1,300 人，另计划 2025 年招聘 200+ 名工程 / 制造人员
        - 新增人员可加速增长，也会抬高固定成本底座
        - 中
        - 提供当前员工数、招聘计划和全口径人员预算
      - - 手头现金
        - null
        - 决定现金跑道和融资依赖的关键变量
        - 低
        - 提供当前现金、可流通证券和受限现金
      - - 月度烧钱速度
        - null
        - 用于判断制造和商业化扩张消耗资本的速度
        - 低
        - 提供月度现金消耗和 EBITDA 桥表
      - - 现金跑道月数
        - null
        - 把融资新闻转化为偿付能力和期权价值分析
        - 低
        - 提供基准、计划和下行情景下的现金跑道
      - - 债务 / 项目融资义务
        - 本次保留来源未公开披露
        - 债务、租赁或供应商融资可能实质性改变有效现金跑道
        - 低
        - 提供债务计划表、租赁义务和任何资产支持融资
      - - 下一轮融资触发点
        - 未公开披露；Reuters 提到其为未来上市做准备，但没有时间表
        - 决定当前资本是过桥资金，还是足够的增长资本
        - 低
        - 提供董事会关于盈利能力 / IPO 准备度的计划，以及应急触发条件
    notes: 资本充足性只能被公开来源部分支撑。融资头条和投资计划可见；现金余额、烧钱速度、现金跑道和义务不可见。
