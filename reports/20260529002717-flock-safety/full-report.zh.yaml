      - number: '8.6'
        title: 图表要点
        blocks:
          - type: callout
            title: 公司强于价格支撑
            body: Flock 的规模、增长和产品广度都是真实的。投资问题不是公司是否重要，而是当前价格下，新投资者是否因未解决的经济性和治理风险获得了足够补偿。
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV037
          - type: callout
            title: 信任风险是乘法，不是加法
            body: 隐私和网络安全争议不只带来法律成本。对 Flock 来说，它们还会放慢增长、伤害审批，并压缩倍数，因为公司卖的是跨辖区网络叙事。
            calloutType: insight
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: callout
            title: 现在观察；只有价格更好或证据更强才买入
            body: 从观察到买入的路径很明确：更低入场价、更强的私有利润率和留存证据，或能抵消未解决股权结构表风险的下行保护条款。
            calloutType: insight
            claimRefs:
              - CV029
              - CV037
              - CV040
              - CV041
              - CV043
          - type: callout
            title: Axon 是上限可比，不是基准可比
            body: Axon 是唯一可能支撑溢价平台倍数的公开锚点，但它范围更广、披露更深、且有公开市场流动性。因此，Axon 是上限叙事，不是容易默认采用的可比公司。
            calloutType: insight
            claimRefs:
              - CV017
              - CV018
              - CV024
              - CV025
              - CV027
