      - number: '3.3'
        title: 切换成本、锁定、伙伴访问与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Flock 的护城河在工作流层比在传感器层更耐久。低端 ALPR 市场已经商品化：OpenALPR 打的是复用现有摄像头、软件优先的牌，并公开列出远低于交钥匙全国平台的起始价。这并不否定 Flock
              模式，但说明原始抓拍和告警可以被压价。Flock
              因此需要买家把工作流速度、部署简单度、信任控制和响应集成看得比最低成本读码更重要。它自己的材料支持这个论点：公司销售单一年度捆绑、可选网络共享、带日志的访问，以及无需搭建完整城市技术项目即可部署的
              RTCC+DFR 栈。这些是真实的切换成本机制，因为它们减少供应商蔓延和运营摩擦。


              问题在于，既有巨头和新进入者的压力也在往上走。Axon 收购 Fusus、后来与 Skydio 合作，显示更大的公共安全操作系统如今可以把 RTCC 和 DFR 包在一起。Motorola
              的装机基础让它在采购对话中早于 Flock 进入候选。政府来源也说明，内部自建替代方案从未完全消失：机构可以把摄像头、CAD、RMS 和地图拼成单一视图，尤其当底层系统已经归自己所有时；尽管 NIJ 和
              Seattle 清楚表明，这么做需要人员、治理、隐私审查和数据管理纪律。净结果是，Flock
              不是输给单一对手。买家想要公共安全原生、交钥匙的工作流层时，它会赢；买家已经处在既有厂商资产里、能接受模块化低成本替代，或想通过多个专业厂商组合无人机、摄像头和互操作性时，它最暴露。
