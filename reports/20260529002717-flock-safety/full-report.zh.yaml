            body: >-
              Flock 的公开融资轨迹足以支撑后续章节。2025 年 3 月官方和独立报道共同支持：公司由 Andreessen Horowitz 领投完成 $275 million 融资，估值 $7.5
              billion，老股东大规模跟投。同一组资料称 Flock ARR 超过 $300 million、同比增长约 70%；公开覆盖数据指向 5,000 多个社区、4,800 多家执法机构和近 1,000
              家企业。这些规模信号有意义，但并非同样干净。员工数快照从 2024 年 1,100+ 人，到 2025 年初 1,300 人，再到 2025 年晚些时候接近 1,600
              人；方向向好，但仍过于粗略，不能作为当前经营基准。招聘时间线和后续报道里的里程碑显示，公司从 LPR 扩展到枪声检测、Flock OS、视频、Nova 和无人机，并以 Aerodome 收购和 Georgia
              新制造设施收尾。时间线支撑了一个判断：公司一直在高速扩大产品面和资本基础，但盈利能力与控制权披露落后于估值增长。
