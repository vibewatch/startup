      - number: '2.2'
        title: 规模测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              自上而下和自下而上测算讲的是不同故事，两者都重要。留存的市场报告来源把 2026 年全球 ALPR 支出放在 100
              亿美元以上并继续上升，但该数字包含停车、收费、交通管理、非美国地区和出厂口径硬件收入。它能证明品类规模，方向有用；但用于承销 Flock 真实近端机会又过宽。官方美国公共安全基线窄得多：BJS 统计州和地方机构
              17,541 家，大多数实际本地买家集中在地方警察局和治安官办公室，且很多机构规模很小。Flock 自称 4,800
              多家机构网络，意味着渗透已经有分量，未来上行不再只是客户数量扩张，而更要靠更深的钱包份额、更多模块和
              HOA、零售商、校园、交通管理者等相邻买家。正确结论不是选一个视角、忽略另一个，而是保留矛盾，按细分市场承销附加率，而不是套用泛化 ALPR CAGR。
