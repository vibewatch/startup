      - number: '4.2'
        title: GTM 动作、ROI 代理指标与服务交付负荷
        blocks:
          - type: paragraph
            body: >-
              Flock 的 GTM 更像外勤销售和顾问式部署，而不是低接触 SaaS 漏斗。官方产品页强调交钥匙安装、低 IT 部署和由 Flock 负责上线引导；Nova
              页面称，机构可在数周内上线，集成由公司管理。这个运营模式在财务上重要，因为它可以抬高赢单率和交叉销售，同时也会把服务人力拉进成本栈。公开 ROI 证据最强处在买家故事，而非审计后的分群数据。Police1
              总结一项研究称，每名宣誓警员配一台 Flock 摄像头与破案率提升 9.1% 有关联；公司撰写的客户故事提到 Georgia 一家医院盗窃下降 55%、San Bruno 一个社区侦破 100
              多起犯罪、Academy Sports 约 20 分钟内完成逮捕，以及一家物流客户称部署后有组织盗窃损失停止。这些是强销售赋能信号，也解释了 Flock 为什么能卖进机构、零售商、HOA
              和医疗系统。Hypepotamus 还报道，2025 年融资的一部分将用于产品、工程和销售招聘。即便如此，公开记录仍不给 CAC、回本周期、销售配额达成率、续约率或净收入留存率，销售效率只能推断，不能承销。
