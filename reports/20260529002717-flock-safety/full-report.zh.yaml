        - 尽管没有直接 Flock 合同，ICE 访问审视仍被报道
        - 监管
        - 联邦访问争议
        - Security Systems News、地方机构、ICE/HSI
        - 把隐私和联邦使用风险变成主流尽调问题。
      - - 2025-12
        - EFF 年度回顾和国会调查报道加深了监控批评
        - 反向
        - 正式调查 / 滥用指控
        - EFF、404 Media、国会议员
        - 将公民自由风险从活动人士批评抬升为正式公共政策审视。
