  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分，评估 Flock Safety 在市场、证据、经济性、风险和估值上的公开证据。
    data:
      items:
        - label: 市场需求 / 品类拉力
          value: 4 / 5
          detail: 公共安全足迹大，并且向企业和工作流用例扩张的迹象清晰。
          claimRefs:
            - CV003
            - CV009
            - CV044
        - label: 产品 / 平台证据
          value: 4 / 5
          detail: 捆绑订阅、平台宽度和跨机构工作流叙事都站得住。
          claimRefs:
            - CV005
            - CV006
        - label: 收入规模 / 增长
          value: 4 / 5
          detail: $300M+ ARR 和 ~70% 增长是强有力的后期阶段输入。
          claimRefs:
            - CV001
            - CV002
        - label: 经济性透明度
          value: 2 / 5
          detail: 公开证据仍缺毛利率、NRR、烧钱速度和回本周期。
          claimRefs:
            - CV008
        - label: 监管 / 信任姿态
          value: 1 / 5
          detail: 监督信、诉讼和城市反弹仍在持续。
          claimRefs:
            - CV011
            - CV012
            - CV013
            - CV015
        - label: 竞争韧性
          value: 3 / 5
          detail: 高端平台仍有上行空间，但 Axon 已经铺得更广，且已上市。
          claimRefs:
            - CV024
            - CV025
            - CV027
        - label: 估值支撑
          value: 2 / 5
          detail: 按上市可比公司和情景测算看，当前价格偏高。
          claimRefs:
            - CV025
            - CV033
            - CV034
            - CV035
            - CV040
        - label: 证据质量
          value: 3 / 5
          detail: 融资事实扎实；私募承销所需事实仍然缺位。
          claimRefs:
            - CV001
            - CV002
            - CV038
            - CV043
    approximationNotes: 评分仅基于公开证据判断，不能替代数据室尽调。
    claimRefs:
      - CV002
      - CV006
      - CV008
      - CV011
      - CV024
      - CV025
      - CV038
      - CV040
      - CV043
