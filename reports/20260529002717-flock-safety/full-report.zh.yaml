companyProfile:
  summary: >
    Flock Safety 是一家总部位于 Georgia 州 Atlanta 的公共安全科技公司，Garrett Langley、Matt Feury 和 Paige Todd 2017 年创立，随后进入 Y Combinator
    S17 批次加速。公司从车牌识别扩展为更宽的联网证据与响应平台，覆盖 LPR、视频、音频检测、RTCC 软件、调查搜索和无人机响应；销售形态多为捆绑年度订阅，包含硬件、软件、安装、维护、升级和支持。2025
    年公开融资披露显示，公司完成 $275 million 融资，估值 $7.5 billion；此前管理层称 Flock ARR 已超过 $300 million、同比增长约
    70%，覆盖数千个社区、执法机构和商业客户。因此，公开记录支撑了真实公司质量和品类重要性，但经济性、治理深度和信任风险控制仍只披露了一部分。
