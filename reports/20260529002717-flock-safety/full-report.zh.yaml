  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险栈
        blocks:
          - type: paragraph
            body: >-
              风险排序由两个问题驱动：哪些失败模式最能直接伤害合同续约、采购速度和估值；哪些风险只被 Flock
              公开披露的控制措施部分缓释。基于这一点，最高层级是隐私和公民自由风险，不是因为每一项指控都会变成判决，而是因为证据已经显示出多步传导路径：从有争议的搜索，到国会审查、诉讼、市政暂停，再到可见的采购反弹。换句话说，这已不再是抽象的声誉争论。它是运营风险，会改变机构是否扩张、城市是否批准相邻产品，以及投资者愿意为增长支付什么倍数。


              第二层是安全和运营执行。Flock 现在已远不止固定式 ALPR：视频、PTZ、枪声检测、OS、911 接警、无人机和制造，都增加了可能以不同方式失灵、且更容易被公开审视的交付面。第三层是模型脆弱性。2025
              年融资验证了需求，但也抬高了门槛：一个按持续超高增长和平台扩张定价的业务，对监管拖累、客户流失或广为报道的安全事件容错更低。因此，下方登记表把可能性、影响、缓释成熟度和剩余风险视为相互联动，而不是彼此独立的维度。
