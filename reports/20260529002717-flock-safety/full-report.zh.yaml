  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与可见组合
        blocks:
          - type: paragraph
            body: >-
              公开证据把 Flock
              的变现模式讲得比完整经济性清楚得多。公司并不把自己营销成一次性硬件供应商。官方定价和产品页反复描述一份合同、一张发票、一笔年度订阅，把硬件、软件、安装、维护、升级和支持打包。采购记录又把这套营销语言转成具体价格锚点。OMNIA
              2026 年 5 月价目表列出 Falcon LPR、Condor 视频、Raven 音频检测和多档实施费的年度化公共部门价格；Whitestown 订单则显示一份历史 Falcon
              合同按年计费，另收安装费，并采用多年期限。产品页还显示，变现已不再限于基础摄像头：Flock 现在销售 LPR、视频、音频、Nova 调查软件和无人机相关产品，并由 FlockOS
              和服务义务串在一起。因此，收入质量在结构上好于纯硬件转售模式，因为合同形式是经常性的，软件层也真实存在。但组合披露仍不完整。Reuters 估计企业客户约占收入 30%，这很有用；Hypepotamus 统计近
              1,000 家企业、对比 4,800 家机构，也显示有分量的商业覆盖。但公开材料仍未披露 SKU 级收入、附加率或收入确认政策。
