  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    description: >-
      Main arguments for and against underwriting Flock at the disclosed 2025 valuation, plus what would change the
      view.
    columns:
      - 类型
      - 论点
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - Flock 规模真实：ARR >$300M、增长约 70%，已有数千家机构和企业接入网络。
        - 若增长被下修，或有证据显示客户数大幅夸大付费账户，这一支柱会被削弱。
      - - 投资逻辑
        - 公司销售打包年度订阅和更广的工作流平台，因此可以比单点方案供应商享受溢价。
        - 若毛利率、留存或附加率显示平台仍主要偏硬件，溢价就应收缩。
      - - 投资逻辑
        - 公共安全工作流的广度和网络效应，仍可能让 Flock 的叙事更接近 Axon 式平台，而不是商品化 ALPR。
        - 如果机构越来越多地多供应商并用，或只把 Flock 当作另一个传感器，平台溢价会快速消退。
      - - 反向逻辑
        - 按披露下限，本轮隐含约 25x ARR，高于多数公共安全可比公司，也不明显比 Axon 的公开市场溢价更便宜。
        - 更低的有效入场价格，或证明经济性强得多的私有证据，会削弱这一反对点。
      - - 反向逻辑
        - 公开证据未披露毛利率、烧钱速度、NRR 或优先股堆叠，因此回报测算信息不足。
        - 数据室开放 KPI 包和融资文件，会显著提升信心。
      - - 反向逻辑
        - 隐私、网络安全和治理问题已出现在监督信、诉讼、城市取消和摄像头破坏事件中。
        - 如果 Flock 展示强有力的事件控制、低争议驱动流失，且没有更广泛政策打压，下行尾部会收窄。
    notes: 「什么会改变判断」列列出的是推动建议变化所需的最低证据或市场变化。
