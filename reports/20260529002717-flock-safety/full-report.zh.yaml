  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与支出篮子
        blocks:
          - type: paragraph
            body: >-
              Flock 的市场不该被框成单一摄像头品类。留存的产品页显示，一套捆绑栈以 LPR 硬件和软件起步，延伸到跨机构网络访问和 AI 赋能的调查搜索，并越来越多触达 RTCC
              工作流、商用无人机和交通分析。这比「车牌读取摄像头」这个窄词更宽，但仍窄于全部安全科技支出。买家可以用警卫、门禁、传统 CCTV、CAD 和 RMS 系统，或既有 LPR 套件解决重叠任务，并不一定购买完整的
              Flock 式订阅。本章的实际边界因此是以 ALPR 和 RTCC 运行为中心的公共安全技术，并纳入私人物业安防和交通中的相邻支出，因为同一套检测、搜索和响应逻辑也适用。这个边界重要，因为它避开两个常见错误：把
              Flock 低估成只是一家摄像头供应商，或把它高估成所有公共安全/物理安防软件支出的代理。
