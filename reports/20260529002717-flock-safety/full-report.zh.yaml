      - number: '3.2'
        title: 能力、打包、分销与信任对比
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争分野不只是摄像头质量，而是各厂商在工作流宽度和相邻分销上的位置。Flock 把硬件、软件、安装、维护和支持包进一笔年度订阅费；FlockOS
              则把自己定位成连接视频、CAD、RMS、告警和跨机构共享的指挥层。对想要快速部署、少找供应商的机构，这是差异化采购叙事。Axon Fusus 在实时运营宽度上最接近，但路径不同：Axon
              强调保护既有投资、政策约束下的共享、审计轨迹、证据连续性，以及延伸到其他 Axon 产品面的能力。Motorola 更像既有组合资产所有者，既有 LPR 宽度，又有深厚相邻装机基础。Genetec 和
              Leonardo 对优先考虑传统兼容性和成熟物理安防平台、而非单一供应商承诺的机构仍可信。


              相邻供应商让局面更复杂。Verkada 不是警务原生操作系统，但它的 GovCloud 姿态、政府合规栈和可支持观察名单的 LPR，意味着它可以吸收一部分本会流向 Flock 的安防预算。Peregrine
              更窄，但战略上重要，因为它销售互操作性本身，把共同运营图景变成数据层问题，而非传感器平台决策。Skydio 是 DFR
              周边最清晰的进入者：其公共安全材料显示出有分量的机构采用、快速起飞和响应主张、强伙伴集成；采购指南也说明，机构通过现有联邦和经销商渠道购买无人机正变得更容易。换句话说，Flock
              作为私人平台供应商仍显得异常完整，但竞争对手越来越从边缘进攻，那些边缘已经有采购路径和装机基础。
