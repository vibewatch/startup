        - Flock 职业页时间线
        - 公开历史中的第一个独角兽式规模标记。
      - - '2022'
        - 公司称估值达到 $3.5B，并推出 Flock OS
        - 产品
        - 估值 $3.5B
        - Flock 职业页时间线
        - 强化平台逻辑和估值跃升。
      - - '2023'
        - 公司称估值达到 $4.8B，并推出视频和移动应用
        - 产品
        - 估值 $4.8B
        - Flock 职业页时间线
        - 将覆盖面从 LPR 延伸到更广运营工作流。
      - - '2024'
        - 收购 Aerodome 并推出 Nova
        - 产品
        - DFR + 调查智能扩张
        - 官方融资博客和 Hypepotamus
        - 把 Flock 推入无人机和更深的数据综合工具。
      - - 2025-03
        - Flock 宣布 $275M 轮融资，估值 $7.5B，年经常性收入（ARR）>$300M
        - 融资
        - $275M / $7.5B / >$300M ARR
        - Flock、a16z 投资团、既有投资者
        - 围绕资本、规模和增长，重设公司的后期画像。
      - - 2025-04
        - 收购 Aerodome 后，Smyrna 制造设施开业
        - 规模
        - 97,000 sq ft 设施 / $10M
        - Flock Safety、Georgia 官员
        - 显示本土制造雄心和无人机生产重点。
