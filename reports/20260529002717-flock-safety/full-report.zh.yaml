            body: >-
              创始故事异常清晰。Flock 称 Garrett Langley、Matt Feury 和 Paige Todd 2017 年创立公司并加入 Y Combinator
              S17；第三方资料补足了起点：社区入室盗窃促使 Langley 转向更便宜的车牌读取系统，Todd 负责早期市场发现，Feury 作为技术联合创始人加入。Garrett Langley
              仍是融资、制造和产品定位中的主要公开高管声音，这有利于分析创始人-市场匹配，也凸显关键人物依赖。公开治理披露明显比客户和融资叙事薄。Flock 公开任命 Jennifer Ceran
              为独立董事和审计委员会主席，并称 James LaCamp 当时新任 CFO；Forbes 另报道称 Matrix 合伙人 Ilya Sukhar
              在董事会任职。即便有这些信息，完整董事名单、观察员权利、持股比例和融资控制条款仍未公开。因此，可见利益相关方地图能说明桌边谁重要，但不能说明控制权、清算优先权或下行保护到底如何分配。
