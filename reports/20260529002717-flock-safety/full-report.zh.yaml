      - number: '6.5'
        title: 扩张动作、集中度与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Flock 的扩张动作看起来是真实的。最清楚的证据是产品打包加具名交叉销售。Academy 从 LPR 扩到视频，Fort Worth 加入一体化摄像头并计划采用 Raven，Tulsa 的证据核心是
              FlockOS 而不只是摄像头，OMNIA 的 2026 价目表则显示 Raven、FlockOS、Flock911、Enhanced LPR 和 DFR
              都能通过同一个采购工具购买。零售、医疗和交通页面复用同一套核心逻辑——摄像头、告警、可搜索证据和单一仪表盘——支撑其向相邻买方先落地再扩张。Reuters 披露企业客户约贡献 30%
              收入，这一点很重要：它意味着私营部门增长已经有分量，但还不足以消除公共安全集中度。


              最大的集中度和扩张风险围绕预算周期、政治和分销基础设施依赖。公共安全很可能仍贡献大部分收入，但公司没有披露头部客户集中度、按细分市场划分的年经常性收入（ARR），或是否由少数大型机构主导多产品支出。公共部门扩张还依赖
              OMNIA 等采购路径，以及 MS2 等交通分析伙伴。与此同时，负面报道显示摩擦是真实的：Security Systems News 记录了围绕 ICE 访问的客户信任问题；TechCrunch 报道了城市拒绝
              Flock 摄像头以及部署被破坏；Connecticut Public 显示，即便项目继续推进，无人机扩张也可能引发隐私反弹。因此，客户故事在交叉销售和细分市场广度上是正面的，但集中度阴影仍在：Flock
              看起来最暴露于政治敏感的公共安全支出，以及随之而来的采购拖累。
