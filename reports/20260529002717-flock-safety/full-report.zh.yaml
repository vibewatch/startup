      - number: '1.4'
        title: 隐私、监管与声誉包袱
        blocks:
          - type: paragraph
            body: >-
              Flock 自有信任材料强调，搜索绑定具名用户，共享可选，机构控制访问设置。这些控制重要，但负面记录显示争议并未被挡住。Security Systems News 报道称，ICE 和 HSI 通过地方机构访问
              Flock 搜索，且没有与 Flock 直接签约。404 Media 称，围绕移民和堕胎相关查询的报道之后，国会议员启动正式调查；EFF 和 ACLU 认为，Flock
              的全国架构让抗议监控、生育权目标定位和更广泛的 AI 化拖网扩张成为可能。State of Surveillance 和 TechSpot
              都描述了越来越多城市因隐私和联邦访问担忧取消或不续约，TechCrunch 后来报道多个州出现摄像头破坏。产品安全审视也已出现：Independent Institute 一篇总结 Benn Jordan
              研究的文章称，Condor PTZ 摄像头把实时和归档画面暴露在公开互联网。实际结论是，Flock 的核心尽调风险不只是声誉噪音；而是监控规模、政策设计和治理纪律可能与公司扩张足迹错配。
