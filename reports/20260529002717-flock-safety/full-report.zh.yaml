  - id: TV006
    title: 最终尽调索取清单
    description: Highest-priority diligence requests before any attempt to underwrite the 2025 valuation.
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 路径
    rows:
      - - 留存与 NRR
        - 按队列、客群和产品包划分的总留存与净留存
        - 决定 ARR 是否配得上软件溢价，还是只是伪装成软件的硬件倍数。
        - CFO + FP&A 留存队列包。
      - - 按产品线划分的毛利率
        - 硬件、安装、软件、服务和无人机的利润率桥
        - 判断混合业务能否长成公开平台倍数。
        - 财务总监 + 财务数据室导出。
      - - 股权结构表与优先权
        - 完整瀑布、投资者权利、反稀释、参与分配权和任何老股分配
        - 需要用它把估值区间换算成普通股结果。
        - 对融资文件做法律尽调。
      - - 客户与州集中度
        - 头部账户、头部州、取消日志和争议相关敞口
        - 量化政策或信任事件是否会比预期更快打击增长。
        - RevOps + GTM 负责人排期。
      - - 无人机与制造资本强度
        - 工厂利用率、翻新成本、营运资本和无人机部署经济性
        - 判断新产品广度是在改善回报，还是稀释回报。
        - 运营 + 制造复核。
      - - 信任与事件管理
        - 安全审计、事件历史、监管往来和整改态势
        - 需要用它承销当前监督和诉讼背后的下行尾部。
        - CISO + 外部律师尽调。
    notes: 这些索取项有意限制在最可能快速改变建议、信心或下行测算的证据上。
    claimRefs:
      - CV008
      - CV029
      - CV041
      - CV043
    sourceRefs:
      - SV001
      - SV002
      - SV006
      - SV008
      - SV012
