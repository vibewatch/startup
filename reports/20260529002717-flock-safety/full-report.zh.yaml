      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分析最能显示，当前入场价很难辩护。乐观情景假设 Flock 继续作为溢价公共安全操作系统复合增长，未来几年增速保持在高 30% 区间，软件组合加深，退出倍数更接近 Axon，而不是传统或更小的公共安全公司。到
              2029 年，这可能产生约 $10-$14B 结果，但即便如此，相对当前轮次也只意味着约 1.3x-1.9x 总价值。基准情景更保守，也更能由公开证据支撑：增长降速到中高 20% 区间，业务组合仍改善，估值落在约
              12x-15x。这指向约 $6-$8B，只带来大致持平到温和上行。悲观情景伤害更大，因为信任或政策冲击会同时压缩增长和倍数。如果隐私、安全或地方治理争议放慢采用，并把估值推向 6x-9x，区间会降到约
              $2-$3.5B，且尚未计入任何清算优先权瀑布影响。
