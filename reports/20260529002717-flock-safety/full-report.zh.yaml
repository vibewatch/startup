      - number: '6.4'
        title: 留存与持续性
        blocks:
          - type: paragraph
            body: >-
              持续性更多体现在结构上，而不是指标上。Flock
              的定价页描述了一种年度订阅：把安装、上线、维护、维修、升级和支持打包在一起，并称公司会在到期前主动复盘表现和续约选项。同一页面还承诺，如果客户选择不续约，会提供安全下线、硬件拆除和数据迁移。执法行业页面进一步强化了服务模型，称
              Flock 在一个订阅内处理维护、升级和正常运行时间监控。该设计应当提升实际粘性，因为客户买的是托管工作流和支持层，而不是一套可以留在原地、无需供应商参与的硬件。


              公开合同强化了关系的经常性，但没有揭示真实续约质量。Oakland 发布的 CHP 协议有 12 个月基础期限、两个可选的一年延期，以及后续续约的重新谈判语言，支持 Flock
              的公共安全关系本意是反复发生。缺失的仍是投资者级别的留存证据栈：保留来源没有披露净留存率（NRR）、总留存率（GRR）、流失、客户 logo
              总留存、按队列划分的续约率、按产品划分的合同绑定，或可跨细分市场比较的满意度评分。这迫使持续性判断保持谨慎。公开记录支持经常性合同架构和运营依赖，但还没有量化证明客户会长期高比例续约、扩张并留下来。
