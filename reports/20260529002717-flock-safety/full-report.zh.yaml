      - 门槛
      - 为什么打破投资逻辑
      - 行动含义
    rows:
      - - 已确认的多客户安全漏洞
        - 网络范围内广泛未授权访问或客户账户被攻破的证据
        - 削弱信任、治理和跨机构网络投资逻辑，同时招来监管行动。
        - 立即暂停流程并重置下行情景。
      - - 具有约束力的数据共享限制
        - 法院、监管机构或立法行动实质限制跨州或跨机构搜索行为
        - 损害网络效应上行空间，并拖慢公共安全工作流扩张。
        - 除非价格大幅重置，否则将建议转向回避。
      - - 标杆辖区取消潮
        - 主要城市或州系统因隐私争议出现实质流失
        - 表明信任问题正在打击付费部署，而不只是停留在头条新闻。
        - 按更慢增长和更低退出倍数承销。
      - - 尽调中经济性不达标
        - 毛利率或 NRR 显著低于支撑溢价估值所需的软件化门槛
        - 表明当前溢价靠收入叙事支撑，而不是持久单位经济性。
        - 没有更好价格或条款，不推进。
      - - 偏重优先权的资本重组或降价轮
        - 新融资显示重度优先级、参与分配权，或价格低于 2025 年
        - 确认普通股结果下行，并削弱价格支撑。
        - 将现有估值标记视为偏高，并基于新股权结构表重新承销。
