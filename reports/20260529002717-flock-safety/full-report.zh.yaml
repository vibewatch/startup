  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有巨头、相邻玩家、替代品与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Flock Safety 不再只和独立车牌读取供应商竞争。它自己的产品页显示出更宽的运营层，把 LPR、RTCC 协同、信任控制和现在的 DFR 结合起来。真正的替代集合因此改变。机构明确采购 ALPR
              和实时运营工具时，直接同业仍包括 Axon Fusus、Motorola Vigilant、Genetec AutoVu、Leonardo ELSAG 和
              Rekor/OpenALPR。但实务中重要的交易集合更宽：Verkada 可以从云视频角度攻击摄像头、告警和合规预算；Peregrine 可以靠承诺为警务和应急响应做实时数据整合，赢下互操作层；Skydio
              可以把 DFR 变成独立预算线，或挂到 Axon 生态；维持现状的机构也可以保留传统摄像头和 CAD/RMS，只补最窄的缺口能力。


              这一点重要，因为买家想用一个供应商把部署、培训、维护和问责压缩进单一工作流时，Flock 最强。公司的捆绑降低了协调负担，但也让它撞上拥有更广相邻资产的既有巨头。Axon
              可以围绕证据、无人机和不断扩大的实时运营栈销售 RTCC。Motorola 可以调动摄像头、呼叫处理和无线电网络。Genetec 和 Leonardo 在机构偏好既有厂商式 ALPR
              和统一安防资产时仍能参与竞争。Rekor/OpenALPR 的意义在于，它证明愿意升级现有摄像头、而非标准化到完整全国平台的机构，仍有一条便宜、模块化路径。
