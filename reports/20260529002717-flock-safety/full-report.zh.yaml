        - 增长维持在约 35%-40%；工作流软件占比加深；信任问题保持可控；退出倍数接近高端平台水平。
        - $10B-$14B
        - ~1.3x-1.9x
        - 软件收入结构尚未证明前，倍数溢价先消退。
        - 需要多年执行表现更接近 Axon，而不是其他公共安全同行。
      - - 基准
        - 增长放缓至约 25%-30%；公共安全预算保持健康；收入结构改善，但估值回落到更接近 12x-15x。
        - $6B-$8B
        - ~0.8x-1.1x
        - 经济性尚未充分去风险化以支撑溢价前，增长先放缓。
        - 与当前公开证据和披露的下限倍数最一致。
      - - 悲观
        - 监管或信任事件拖慢采用；公共部门摩擦上升；估值压缩至 6x-9x。
        - $2B-$3.5B
        - ~0.3x-0.5x，未计优先权前
        - 安全或治理冲击同时打击增长和倍数。
        - 已有活跃监督、诉讼和地方反弹在公开来源中可见，支撑该情景。
    notes: 区间是估值代理，不是完整建模的股权结果；任何高级优先股堆叠都可能让普通股结果更差。
