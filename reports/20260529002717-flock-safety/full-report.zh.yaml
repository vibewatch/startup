      - number: '2.3'
        title: 买家、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              即便工作流界面相似，不同细分市场的买家地图也差异很大。警务部署中，RTCC 主管、局长或运营负责人推动采购，但机构仍需要市政预算批准和运营 SOP。社区和 HOA
              部署更碎片化：董事会或物业经理采购，居民感受收益，执法关系常让 ROI 变得可见。零售和私营安保交易通常从
              ORC、闯入或边界安全痛点切入，由防损或安保团队负责预算论证。交通部署又转向规划人员和运营经理，他们想要全天候车流量、类别、速度和事故数据。跨细分市场看，最可信的采用路径是先落地再扩张。买家可以先从 LPR
              或周界用例起步，尽可能复用现有硬件；等运营工作流变宽、信任障碍被清除后，再增加 RTCC 编排、AI 搜索、交通模块或无人机。
