      - number: '6.3'
        title: 参考质量、新鲜度与证明到底说明什么
        blocks:
          - type: paragraph
            body: >-
              引用质量足以支撑一个真实的客户章节，但还不足以抹平全部尽调风险。积极面在于，Flock 留下的来源不只是贴
              logo：多数具名案例都给出买方角色、具体部署场景，以及某个指标、事件或运营引语。公共采购层也有帮助。OMNIA 的合同文件和 2026 价目表，加上 Oakland 发布的 CHP
              协议，比营销页更能证明公共部门正在采购，因为它们展示了真实产品、定价结构、支持义务和期限机制。上述文件也确认，Flock 卖的是更宽的平台套装——Raven、FlockOS 层级、Flock911 和 DFR
              服务——而不只是固定式 LPR 硬件。


              弱点在于，大多数具名客户证据仍由公司撰写，且具有选择性。官方案例研究天然会呈现胜利，而不是沉睡账户、失败试点或续约疲软；只有一部分案例把时间窗口披露得足够清楚，可以判断新鲜度。客户索引能作为最新广度信号，但没有时间戳，也没有解释机构、社区和企业之间的重叠。Reuters
              提供了独立的规模背景，但时间停在 2025 年 3
              月，并非运行日最新。公用事业、交通等较新垂直领域的公开记录更薄：证据足以支撑其存在和商业化意图，却不足以清楚区分单点部署和跨多站点、可重复放大的生产化落地。净结论是，本章可以支撑采用与扩张潜力，但无法以同样信心支撑持续性或精确集中度。
