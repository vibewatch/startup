  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与公开证据真正能支撑什么
        blocks:
          - type: paragraph
            body: >-
              Flock 的 2025 年融资有充分佐证：公司、Reuters、TechCrunch、Hypepotamus 和 Wilson Sonsini 都指向一轮 $275M 融资，估值
              $7.5B。同一组来源也支持管理层披露：Flock 的年经常性收入（ARR）已越过 $300M，且仍以约 70% 的同比速度增长。这个组合很重要，因为它说明 2025
              年价格不是贴在一个尚未规模化的故事上。公司也有可见广度：当前材料宣称有 5,000+ 执法机构、6,000+ 社区和 1,000+ 企业，职业页时间线还显示更早的估值里程碑：2021 年 $1B、2022 年
              $3.5B、2023 年 $4.8B。即便如此，价格支撑和价格吸引力是两个问题。仅用已披露年经常性收入（ARR）下限计算，2025 年融资至少隐含约 25x
              ARR，而公开证据仍未披露毛利率、烧钱速度、留存或优先股堆叠。因此，公开记录支持强商业证明和真实估值跃升，但只能部分支撑新投资者承销该轮价格。
            claimRefs:
