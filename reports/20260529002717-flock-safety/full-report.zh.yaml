      - number: '5.3'
        title: 部署、可靠性姿态与路线图
        blocks:
          - type: paragraph
            body: >-
              Flock 的部署话术刻意降低摩擦。LPR 和视频页面强调轻基础设施安装、太阳能选项、同杆部署，以及一笔包含维护、升级和支持的捆绑订阅。现场工作流也在减少工具蔓延：Flock911
              通过现有告警/地图界面交付，移动应用增加按班次的通知、位置半径过滤和媒体回放。无人机侧，公司承诺白手套启动支持，覆盖站点规划、FAA 指导、SOP 创建、培训和持续运营帮助。Spokane
              案例研究支持了客户感知：Flock 承担了很大一部分集成负担。


              可靠性证据方向为正，但仍比运营级证据更偏营销。官方材料提到云健康监控、Alpha 的四蜂窝调制解调器冗余、90
              秒内再次起飞准备，以及关于响应更快、集成更轻松的客户轶事。缺失的是硬公共遥测：正常运行时间、误报率、MTBF、摄像头失效率曲线和事后可靠性披露，在已审阅来源中没有浮现。路线图同样混合。一些能力显然已经出货，另一些仍处于阶段性或有条件状态：Nova
              仍把仪表盘/报告营销为「即将推出」，私人 Aerodome 把定时巡逻自动化描述为近端更新，完整自动调度仍绑定 FAA
              批准。这意味着客户今天可以拿到一套集成系统，但最有野心的自主化故事有些部分仍在建设中，而非已大规模证明。
