  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流定义与产品栈
        blocks:
          - type: paragraph
            body: >-
              只有把 Flock 当作工作流平台，而不是摄像头供应商，它的产品技术故事才讲得通。在公共安全工作流中，起始信号可能是一次车牌命中、类似枪声的声学事件、一通实时 911 电话，或警员描述的可疑车辆。Flock
              试图把这个信号留在一个运营闭环里：告警进入移动应用或 FlockOS 地图，运营员或巡逻人员能看到附近摄像头和车辆上下文，同一事件还可以进入 FreeForm 或 Nova
              做更深的搜索和案件工作。私营部门无人机界面用的是同一思路，在私人物业上由报警或传感器触发一键起飞工作流。


              这个工作流框架也解释了 SKU 地图。硬件层现在覆盖多种 LPR 变体、固定式和 PTZ 视频、音频传感器；软件层覆盖 FlockOS、Flock911、Nova 和 FreeForm；网络层覆盖
              National LPR Network
              和共享控制。结果是一个宽模块目录，实际价值单位不是「一台摄像头」，而是「更快的调查和调度闭环」。这一定位可信，因为每个模块页面都描述它如何插入下一个产品面；但它也意味着买家其实在采用一个更大的运营模型，而不是一个孤立工具。
