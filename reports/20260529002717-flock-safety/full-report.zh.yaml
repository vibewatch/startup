    summary: 公开来源揭示了可能影响回本周期的销售和交付步骤，但没有披露真实的获客成本（CAC）、留存或贡献利润率。
    data:
      nodes:
        - id: sale
          label: 拿下交易
          detail: 面向机构、零售商、HOA、医疗或物流买方的现场销售
        - id: install
          label: 实施
          detail: 硬件布点、设置、测试、入门培训、集成
        - id: use
          label: 嵌入工作流
          detail: 警报、搜索、案件侦破、伙伴共享
        - id: roi
          label: 可观察 ROI 代理指标
          detail: 破案率提升、盗窃减少、更快抓捕、防损
        - id: expand
          label: 扩张账户
          detail: 交叉销售视频、Nova、音频、无人机和服务
        - id: renew
          label: 续约或流失
          detail: 绩效复盘和年度续约决定
        - id: unknowns
          label: 缺失的经济性指标
          detail: 获客成本（CAC）、回本周期、净留存率（NRR）、流失、服务毛利率
