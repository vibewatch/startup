  - id: FE001
    title: 产品架构图
    type: stack
    summary: Flock 的分层架构，从边缘传感器到云端搜索、运营界面、伙伴 API 和治理控制。
    claimRefs:
      - CE001
      - CE005
      - CE013
      - CE014
      - CE019
      - CE033
    data:
      layers:
        - id: edge-hardware
          label: 边缘采集层
          detail: LPR、PTZ / 固定视频、音频检测和无人机机场采集路侧、校园和空中证据。
        - id: event-generation
          label: 警报与事件层
          detail: 热名单、音频触发器、实时 911 数据流和移动通知，把原始检测转成事件。
        - id: cloud-search
          label: 云端证据与搜索层
          detail: 车辆搜索、转录回放、音频片段、案件上下文、留存逻辑和共享证据，都在 Flock 管理的云服务中。
        - id: ops-surfaces
          label: 运营界面
          detail: FlockOS、Flock911、Nova、FreeForm 和现场移动应用，将同一事件数据暴露给不同角色。
        - id: integration-layer
          label: 集成与生态层
          detail: CAD/RMS/VMS 链接、第三方传感器和视频、伙伴应用、Events API、Vehicle Detection API，以及基于 OAuth 的访问。
        - id: governance-layer
          label: 治理与信任层
          detail: 角色权限、理由代码、审计日志、留存规则、Safe List 选项以及透明度 / 仪表盘控制，贯穿每条工作流。
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    summary: Flock 栈内，从事件信号到响应和案件跟进的公共安全运营流程。
    claimRefs:
      - CE004
      - CE007
      - CE015
      - CE021
      - CE025
      - CE033
    data:
      nodes:
        - id: signal
          label: 信号出现
          description: 车牌命中、911 电话、音频事件或可疑车辆描述进入系统。
        - id: correlate
          label: 证据完成关联
          description: 系统把附近摄像头、车辆属性、转录文本和警报上下文拉入同一事件视图。
        - id: operate
          label: 操作员看到一张地图
          description: FlockOS 或移动应用显示警力单元、摄像头、位置和相关证据。
        - id: dispatch
          label: 调度或无人机起飞
          description: 巡逻、RTCC 或 DFR 飞手通过现有 Flock 界面接到呼叫，而不是另开一个新工具。
        - id: field
          label: 现场响应
          description: 响应人员接近现场时使用实时视频、音频片段和警报。
        - id: investigate
          label: 搜索与案件工作
          description: Nova 和 FreeForm 将事件扩展成更深的记录、LPR 和视频调查。
        - id: review
          label: 共享与复盘
          description: 结果与授权伙伴共享，并保存在日志、报告和案件文档中。
      edges:
        - id: e1
          source: signal
          target: correlate
          label: 捕获触发信号
        - id: e2
          source: correlate
          target: operate
          label: 组装上下文
        - id: e3
          source: operate
          target: dispatch
          label: 响应决策
        - id: e4
          source: dispatch
          target: field
          label: 提醒响应人员
        - id: e5
          source: field
          target: investigate
          label: 现场转为案件证据
        - id: e6
          source: investigate
          target: review
          label: 证据共享并审计
