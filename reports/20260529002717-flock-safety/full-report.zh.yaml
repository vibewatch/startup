  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场 / 桶
      - 纳入支出
      - 排除支出 / 替代品
      - 典型买方 / 付款方
      - 为什么对 Flock 重要
    rows:
      - - 核心公共安全 ALPR
        - LPR 传感器、警报、搜索、审计轨迹、热名单、NCIC 关联工作流
        - 通用 CCTV、门禁硬件、人工 BOLO 工作流
        - 警方指挥、侦探、RTCC 单元 / 公共安全预算
        - 这是历史入口，仍是最清晰的核心支出池。
      - - RTCC / RTIC 编排
        - 视频聚合、CAD/RMS 集成、跨机构协作、地理空间响应工具
        - 没有实时编排的独立 CAD、RMS 或 VMS
        - 警长、RTCC 主管、城市公共安全领导层 / 市政机构预算
        - 这把 Flock 从证据捕捉扩展到操作系统地带。
      - - 调查 AI 与工作流软件
        - 自然语言搜索、第三方视频搜索、分析警报
        - 人工审查、点解决方案分析、通用 AI 搜索工具
        - 调查员、分析师、指挥人员 / 软件和运营预算
        - 这能在不增加更多杆件或摄像头的情况下，提高单客户钱包份额。
      - - 私有物业边界安全
        - 停车场、校园、仓库、HOA 和社区边界覆盖，以及共享控制
        - 保安、闸门、传统门禁、未托管 CCTV
        - HOA 董事会、物业经理、防损、GSOC / 会费或安全预算
        - 这在警方案例之外创造相邻需求，并以选择加入条款把私有数据接入公共安全。
      - - 无人机和快速响应层
        - 自动无人机响应、传感器触发的空中核验、大范围巡逻支持
        - 保安巡逻人力、固定塔扩建、临时无人机项目
        - 企业安全、校园、大型场地 / 安全运营预算
        - 这是可选邻接项，能显著提高大型场地的 ACV。
      - - 交通与道路分析
        - 计数、分类、速度、事件核验、走廊和拨款规划数据
        - 人工交通研究、独立道路传感器、没有安全工作流的纯 ITS 分析
        - 交通经理和规划者 / DOT 或公共工程预算
        - 这是相邻而非核心，但会把市场扩展到警务之外。
    notes: 纳入和排除支出围绕买方实际替换或组合的工作流来定义，而不是围绕所有能和公共安全松散关联的技术词。
