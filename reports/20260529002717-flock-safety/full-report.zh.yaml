    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品栈与商业模式
        blocks:
          - type: paragraph
            body: >-
              Flock Safety 对外定位是公共安全科技平台，而不是单一摄像头供应商。官网首页围绕联网证据、更快调查和更清晰响应讲故事；产品页显示，供给已覆盖车牌读码器、AI 视频摄像头、音频检测、Nova
              调查搜索和无人机第一响应者工作流。产品宽度重要，因为 Flock 不是靠一次性硬件销售变现。定价、视频和 LPR
              资料都强调年度捆绑订阅，包含硬件、软件、安装、维护、升级和支持。同一批页面也说明，公司服务对象不只正式警务机构：社区、企业、学校、HOA
              和私营安保团队都在其客户口径内。实际看，公司概览在产品架构上证据最强，在单位经济上最弱。公开资料把一体化交叉销售故事讲清楚了，但没有披露毛利率、烧钱速度、留存率或贡献经济性。尽调中，最合适的理解是：这是一家后期、纵向整合的安全平台，经营杠杆仍需要私人财务证据证明。
