  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 因素
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 人手短缺和数据过载
        - 正向
        - 近期
        - 推动机构采用承诺更快分流、让每名员工撬动更多产出的工具
        - 按部署阶段索取 RTCC 人员配置模型、加班趋势和操作员生产率指标。
      - - ORC 和私有物业犯罪
        - 正向
        - 近期
        - 支撑经典警务预算之外的零售、物流、HOA 和校园需求
        - 收集垂直行业案例和损耗防控 ROI 数据，不要只看警方案件侦破故事。
      - - 复用现有摄像头和基础设施
        - 正向
        - 近期
        - 降低切换摩擦，让预算受限买方更容易分阶段铺开
        - 询问有多少部署依赖第三方摄像头复用，而不是全新硬件。
      - - 跨机构和公私共享
        - 正向
        - 近期至中期
        - 网络效应可提升案件价值，并让平台更黏
        - 衡量共享网络功能多常推动续约或多模块扩张。
      - - 现有厂商广度和低价替代品
        - 负向
        - 当前
        - Motorola、Leonardo、OpenALPR、Rekor 和 Axon 都提供重叠工作流或更低成本入口
        - 对标模块化替代方案，并识别 Flock 是在哪里靠工作流取胜，而不只是靠硬件。
      - - 隐私、留存和访问监管
        - 负向
        - 当前且反复出现
        - 各辖区法律和 SOP 要求可能拖慢或缩小部署
        - 获取法律留存期限、审计控制，以及州或地方法律要求的任何产品例外。
      - - 采购和利益相关方摩擦
        - 负向
        - 当前且反复出现
        - 董事会批准、DOT 许可、城市采购和公众反弹都可能推迟安装
        - 按板块复盘样本采购周期和取消原因。
      - - 公民自由反弹和续约风险
        - 负向
        - 中期
        - 政治争议可能转化为不续约或阻止扩张
        - 跟踪敏感辖区的续约队列，并将流失与政策争议做关联。
    notes: 驱动因素和约束按市场层面列示；承保的关键不是把它们当成泛泛行业话术，而是映射到各板块的销售周期、ACV 和续约风险。
