  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 重要性
      - 当前公开代理指标
      - 对投资测算的影响
      - 具体尽调路径
    rows:
      - - GAAP 收入和确认政策
        - ARR 和合同形式看不出收入是一次性确认还是按期确认
        - '>$300M ARR 和年度订阅表述'
        - 让收入质量和季节性难以精确测算
        - 索取经审计财务报表、收入确认备忘录和递延收入滚动表
      - - 产品与分部收入结构
        - 交叉销售逻辑取决于软件、视频、音频和无人机实际贡献多少
        - 企业业务约占收入 30%；公开材料能看到产品宽度
        - 无法清晰评估软件占比或硬件集中度对估值的影响
        - 要求提供 FY2024-FY2026 按 SKU 家族和客户分部拆分的收入
      - - 按产品拆分的毛利率
        - 捆绑合同可能掩盖低毛利服务或硬件义务
        - 未公开披露毛利率；可比公司只能提供参照
        - 削弱对长期盈利能力的把握
        - 要求提供产品 P&L、服务毛利率和保修准备金历史
      - - 现金、烧钱速度和现金跑道
        - 如果资本开支和招聘投入很重，大额融资也可能对应较短现金跑道
        - $275M 轮融资和累计融资 >$950M
        - 无法评估融资依赖度或下行韧性
        - 要求提供月度现金桥、资本开支计划和董事会批准预算
      - - 留存、NRR 和流失
        - 经常性合同只有在客户以有吸引力的经济性续约时才有价值
        - 定价 FAQ 和合同能看到续约机制，但未披露续约率
        - 卡住收入质量判断
        - 要求提供队列续约、总留存率、NRR、取消历史和降级率
      - - CAC、回本周期和销售效率
        - 现场销售加交钥匙部署，可能高效，也可能很贵
        - 案例研究 ROI 为正，且仍在招聘
        - 卡住 GTM 效率判断和利润率预测
        - 要求提供按分部拆分的 CAC / 回本周期、销售配额达成率和管道转化数据
      - - 客户集中度和预算敞口
        - 公共部门预算周期和单个大型部署会影响收入耐久性
        - 4,800 家机构、近 1,000 家企业，企业业务约占收入 30%
        - 集中度和补助依赖仍未知
        - 要求提供头部客户清单、收入集中度和预算来源映射
      - - 制造利用率和营运资本
        - 新工厂、翻新和无人机生产可能在利润率放大前先消耗现金
        - 佐治亚州工厂 97k-100k 平方英尺，投资 $10M
        - 卡住资本强度和现金转化分析
        - 要求提供利用率、库存周转、供应商条款和翻新吞吐量
      - - 债务、租赁和其他义务
        - 表外或租赁承诺可能实质压缩可用现金跑道
        - 未找到 Flock 相关公开披露
        - 可能改变下行保护和资金需求判断
        - 要求提供债务明细、租赁承诺和任何供应商融资安排
    notes: 这些缺失的非公开指标仍卡住清晰的财务判断。每个缺口都对应一项具体请求，而不是泛泛的“还需要更多数据”占位。
    enumerationScope:
