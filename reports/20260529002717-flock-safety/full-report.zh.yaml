  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    description: >-
      Scenario-based valuation ranges, return logic, risks, and probability signals from the current $7.5 billion entry
      mark.
    columns:
      - 情景
      - 关键假设
      - 隐含估值
      - 相对 $7.5B 入场的毛价值
