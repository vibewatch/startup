  - id: TV004
    title: 可比公司估值表
    description: >-
      Public and milestone reference points used to triangulate whether Flocks 2025 price is supportable, stretched, or
      attractive.
    columns:
      - 可比对象
      - 状态
      - 指标
      - 倍数 / 估值
      - 相关性
      - 局限
    rows:
      - - Flock 2025 年融资轮
        - 私有参考标记
        - '>$300M ARR；同比增长约 70%'
        - $7.5B 估值；ARR 下限 >25x
        - 正在评估的直接入场标记。
        - ARR 下限已披露，但毛利率、NRR 和优先权没有披露。
      - - Axon
        - 上市公司
        - TTM 收入约 $2.98B；高端公共安全平台
        - ~10.84x P/S；市值约 $31.5B-$35.4B
        - 工作流、传感器和软件广度最接近的上限平台可比公司。
        - 已上市，比 Flock 更分散、也更成熟。
      - - Motorola Solutions
        - 上市公司
        - TTM 收入约 $11.87B；2025 年净销售额 $11.7B
        - ~5.80x P/S；市值约 $68.31B
        - 公共安全硬件、软件和服务的规模化在位锚点。
        - 更成熟且盈利；存量装机基础削弱直接可比性。
      - - Rekor
        - 上市公司
        - TTM 收入约 $49.52M；经常性软件加硬件组合
        - ~1.91x P/S；市值约 $105.8M
        - 公共部门敞口下，较低端传感器和分析业务参考。
        - 规模更小，也不如 Flock 多元。
      - - SoundThinking
        - 上市公司
        - TTM 收入约 $99.96M
        - ~0.87x P/S；市值约 $93.7M
        - 展示公开市场如何给多元化有限且有争议的公共安全软件定价。
        - 产品范围窄于 Flock 的平台野心。
      - - Flock 2023 年估值标记
        - 里程碑参考
        - 公司披露的私有估值历史
        - 2025 年融资前估值 $4.8B
        - 展示估值跳升幅度，需要增长和产品广度来证明其合理性。
        - 内部里程碑，不是独立交易的公开可比对象。
