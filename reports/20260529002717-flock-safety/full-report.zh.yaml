  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 公开机制
      - 单位 / 合同
      - 当前公开状态
      - 收入质量
      - 尽调要求
    rows:
      - - LPR 订阅
        - 年度打包订阅，覆盖硬件、云软件、告警、安装、维护和支持
        - 按摄像头 / 年度期限；合同约定时另加安装
        - 官方定价按报价；公开合同显示 Falcon 每台摄像头每年约 $2.5k-$3.0k
        - 经常性合同结构强于一次性硬件销售，但实际 ASP 和续约质量未披露
        - 按 LPR SKU 索取队列定价、续约、毛利率和递延收入数据
      - - 视频订阅
        - 固定与 PTZ 视频摄像头年度订阅，含存储 / VMS 和平台访问
        - 按摄像头 / 年度期限
        - OMNIA 显示 Condor 约 $2.871k，太阳能固定式约 $3.110k
        - 经常性且利于打包，但现场服务和支持成本可能压低利润率
        - 索取视频附加率、单站点服务成本和产品级毛利率
      - - 音频探测
        - Raven 枪声探测按覆盖范围收取年度订阅
        - 按覆盖区域 / 年度期限
        - OMNIA 按覆盖规模显示约 $11.484k、$19.140k 和 $33.495k 三档
        - 单次部署合同额高，但密度取决于地理分布，服务经济性也不透明
        - 索取 Raven 部署密度假设、误报负担和支持毛利率
      - - Nova 侦查软件
        - 叠加在既有机构系统之上的软件工作流订阅
        - 按机构 / 工作流订阅
        - 公开部署模式可见，但公开标价不可见
        - 可能是高毛利软件增购，但收入贡献和流失未披露
        - 索取 Nova 订单额、ASP、实施工时和续约队列
      - - DFR / 无人机与 FlockOS
        - 绑定自动响应和运营工作流的硬件、软件与服务包
        - 按系统 / 部署
        - 官方和 OMNIA 材料显示 DFR 硬件加软件与服务，但没有清晰的公开收入拆分
        - 可能同时抬高 ASP 和资本强度
        - 索取无人机硬件毛利率、维护成本和经常性软件附加率
      - - 专业服务 / 实施
        - 一次性和订阅式实施、设置、测试及电气工作
        - 按部署或服务包
        - OMNIA 显示实施费约 $622 至 $957+，取决于配置
        - 能提升部署速度，但若人力占比高，会稀释毛利率
        - 索取现场服务利用率、可计费工时和安装积压
      - - 可选平台附加模块
        - 叠加在核心订阅上的告警响应和集成类附加模块
        - 附加订阅 / 服务
        - 视频 FAQ 提到可选告警响应服务；完整公开价目表不完整
        - 若附加率强，可拉高 ARPU，但公开资料未披露附加模块组合
        - 按模块索取附加渗透率、增购转化和贡献毛利率
    notes: 公开证据由官方定价表述、OMNIA 采购价格和具体合同记录拼成。实际成交价格和组合只露出一部分，因此本表把已签约内容与仍未公开的信息分开。
