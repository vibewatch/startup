  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标板块
      - 差异化
      - 局限
    rows:
      - - Flock Safety
        - 目标公司 / 直接对标
        - 2025 年融资 $275M；ARR $300M；5,000+ 个社区
        - 执法、城市、企业、HOA、交通
        - 跨 LPR、RTCC、信任控制和 DFR 的交钥匙组合
        - 报价制价格，隐私审查比许多点解决方案更尖锐
      - - Axon Fusus
        - 直接 RTCC 平台 + 现有生态
        - 上市现有厂商；Fusus 2024 年被 Axon 收购；设备生态广
        - 执法、联邦、教育、企业安防
        - 单一视图实时运营、证据连续性、合作伙伴设备兼容
        - 价格不公开；买方已使用 Axon 界面时竞争力最强
      - - Motorola Solutions Vigilant
        - 现有 ALPR / 视频 / 公共安全技术栈
        - 5M+ 固定摄像头；300k+ 安装；PSAP 呼叫处理份额 60%+
        - 已有传统摄像头、呼叫中心或无线电资产的机构
        - LPR 产品组合广，能撬动庞大装机基础
        - 产品组合更复杂，已审阅页面没有公开费率表
      - - Genetec AutoVu
        - 现有统一安防 / ALPR 厂商
        - 成熟的私营安防平台现有厂商
        - 需要更广泛安防中心能力的司法和公共安全运营方
        - AutoVu 加上更广的 Security Center / Omnicast / Mission Control 范围
        - 相比 Flock 或 Axon，已审阅公开页面披露的定价和 RTCC 细节更少
      - - Leonardo ELSAG
        - 直接传统 LPR 专家
        - 专业厂商，提供多种硬件形态
        - 优先考虑固定、移动或太阳能 LPR 的机构
        - 机构数据自主权和专业 LPR 硬件选项
        - 工作流层比 Flock 或 Axon 更窄
      - - Rekor / OpenALPR
        - 直接软件主导型 ALPR 替代方案 / 替代品
        - 上市公司；30k+ 采集点；775B+ 数据点
        - 想要低成本 ALPR 或现有摄像头升级的机构
        - 使用现有摄像头、可搜索车辆数据、$72/月入口
        - 工作流广度低于完整 RTCC+DFR 平台
      - - Verkada
        - 相邻云视频 / 公共部门平台
        - 私营云安防厂商，拥有政府合同工具
        - 政府设施和分布式安防团队
        - GovCloud 托管、FedRAMP 姿态、监视名单、集中式云运营
        - 警务原生工作流深度不如 Flock
      - - Peregrine
        - 相邻互操作层
        - 私营平台；已审阅公开页面未披露广泛规模指标
        - 警务和应急响应数据统一买方
        - 跨系统实时互操作和匹配记录
        - 不拥有传感器或无人机层
      - - Skydio
        - 可能进入者 / DFR 专家
        - 1,200+ 个公共安全机构；联邦采购路径
        - 正在建设或扩展 DFR 项目的机构
        - 快速起飞、机库化运营、强 CAD 和 RTCC 集成
        - 除非搭配 RTCC / 证据技术栈，否则价值主张更窄
      - - 现状 / 内部自建
        - 替代品 / 无平台选项
        - 现有城市系统，加本地集成商和员工
        - 已有强现有资产或替换预算受限的机构
        - 最低替换成本和最高本地控制
        - 集成、人手、治理和隐私审查负担仍高
    notes: 规模和融资单元格仅反映本章审阅到的公开证据。多数厂商价格仍是报价制或不透明，因此本表区分公开证据和披露缺口，而不是猜测。
