      - number: '7.2'
        title: 隐私、公民自由与监管风险
        blocks:
          - type: paragraph
            body: >-
              这是本章严重度最高的风险，因为多条独立证据指向同一方向。国会已经介入。州层面的限制已经收紧。诉讼已经在推进。公开报道还显示，有争议的使用场景不是孤立在某个失控警员或某座特殊城市的边缘案例。House
              Oversight 和 EFF 描述的堕胎相关查询尤其重要，因为它展示了单次搜索如何快速跨全国网络放大，触达那些本地政治选择未必认同该查询的摄像头和辖区。California 投诉和 Virginia
              诉讼则把同一担忧转化为基于成文法和宪法理由的正式法律攻击。


              Flock 自己的缓释故事是连贯的：本地控制、基于角色的权限、搜索日志、选择加入式共享，以及没有人脸识别。但剩余暴露仍高，因为这些控制仍取决于成千上万名客户的治理选择、准确配置和可靠的平台执行。Oxnard
              因供应商问题暂停摄像头，Richmond 阻止联邦访问，Mount Prospect 因滥用担忧撤回，国会要求提交关于堕胎、ICE 和 CBP 查询的文件——这些事件摆在一起，投资问题就不再是 Flock
              能否解释防护措施，而是这些防护是否足够强，能在对抗性、跨辖区审视下守住信任和网络效应。
