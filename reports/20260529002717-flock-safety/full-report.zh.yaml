      - number: '8.5'
        title: 最后尽调问题与投资逻辑击穿触发器
        blocks:
          - type: paragraph
            body: >-
              剩余工作是集中的，而不是开放式的。第一，管理层必须打开留存、利润率和回本周期数据，证明当前价格不只是建立在收入增长上。第二，投资者需要股权结构表和清算优先权瀑布；没有这些，即便企业价值情景看似可接受，普通股结果也可能很弱。第三，信任和治理尽调不是可选项。支撑
              Flock
              规模的同一份公开记录，也显示联邦监督、隐私诉讼、地方治理漏洞，以及一些客户或城市反弹。这意味着最容易击穿投资逻辑的未必只是竞争。一次确认的多客户安全事件、对州际或机构间数据共享有约束力的限制，或重要州出现更广泛取消潮，都会同时削弱收入信心和倍数支撑。因此，最终建议仍取决于具体尽调闭环，而不是又一轮泛泛的市场热情。
