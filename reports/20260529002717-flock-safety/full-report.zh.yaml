  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 支撑证据
      - 威胁
      - 严重性
      - 影响 / 缓释
    rows:
      - - 一站式单一供应商工作流
        - Flock 将 LPR、RTCC 和 DFR 的硬件、软件、上线、维护和支持打包
        - 低成本模块化替代品或既有厂商折扣
        - 高
        - 只有买方把速度和简单性放在最低成本之前，护城河才守得住
      - - 原生面向公共安全的 RTCC + DFR 堆栈
        - FlockOS 加 DFR，比专业 ALPR 厂商覆盖更宽的工作流
        - Axon + Skydio 现在可以打包 RTCC、证据、无人机和 BVLOS 工具
        - 高
        - Flock 必须让 DFR 深度集成，不能把它当外挂
      - - 任意供应商集成
        - Flock 连接既有系统，降低推倒重来的摩擦
        - 同样的开放性也削弱硬技术锁定，并可能让客户多平台并用
        - 中
        - 留存靠工作流习惯和服务质量，不能只靠协议锁定
      - - 信任与政策控制
        - Flock 公开了基于角色的访问、日志记录和可选共享控制
        - EFF 和 ACLU 认为，该网络仍可能助长全国范围的滥用和扩张
        - 高
        - 信任姿态不只需要控制项，还需要经得起对抗性审查的治理
      - - 采购捷径
        - Texas DIR 降低了部分市场的采购摩擦
        - 既有厂商和相邻玩家也有合同工具，并占据更深的相邻采购入口
        - 中
        - 渠道触达会削弱纯产品驱动优势
      - - 私募融资带来的创新速度
        - 2025 年融资和 ARR 规模让 Flock 有空间快速扩产品
        - 既有厂商可用生态收购和合作伙伴关系回应
        - 中
        - 资本有帮助，但许多交易里，谁先被买方想起仍由相邻渠道决定
      - - 内部自建难度
        - 政府来源称，搭建 RTCC 需要人员、集成、政策和隐私工作
        - 已有资产底座的机构仍可拼出一个统一视图，不必标准化采用 Flock
        - 中
        - 最难打的是已完成集成机构里的替换或叠加项目
    notes: 严重性衡量 Flock 护城河承受的竞争压力，而非供应商执行质量。登记表同时纳入产品、公共政策和采购证据，因为三者都会塑造公共安全领域的竞争耐久度。
