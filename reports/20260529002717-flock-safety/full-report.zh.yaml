      - number: '8.4'
        title: 可比公司、入场纪律与退出准备度
        blocks:
          - type: paragraph
            body: >-
              公开可比公司并不完美，但方向很清楚。Axon 是上限可比公司，因为它已经在公共安全中结合设备、软件、传感器、视频和工作流产品，但按历史销售额计，交易倍数仍低于 Flock
              的年经常性收入（ARR）下限倍数。Motorola 提供规模化既有龙头锚点，销售倍数大约在中个位数；Rekor 和 SoundThinking
              则显示，公开市场会如何严厉对待规模较小、硬件组合复杂或暴露于争议的公共安全 / 分析公司。这些锚点不能证明 Flock 被高估，因为年经常性收入（ARR）和 GAAP
              收入并不相同，更强留存或软件属性也可能支撑溢价。但它们说明为什么入场纪律重要。若要从观察（TRACK）转为买入（BUY），投资者需要三件事之一：显著更低的有效入场价格、数据室证据证明毛利率和留存配得上大幅溢价，或证券条款中有结构性下行保护。Flock
              具备足够规模和叙事广度，可以有退出资格，但公开披露还不足以让其经济性被视为已准备好接受公开市场检验。
