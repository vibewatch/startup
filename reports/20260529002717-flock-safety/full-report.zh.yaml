      - number: '2.4'
        title: 驱动因素、约束与承销含义
        blocks:
          - type: paragraph
            body: >-
              品类确有需求拉力：人员短缺、ORC、跨辖区调查，以及复用现有摄像头的能力都支撑采用。但最强的市场故事也包含最强的约束故事。隐私和留存规则因辖区而异，RTCC
              部署需要利益相关方管理和成文操作流程，即便社区安装在公共街道上也可能需要交通部门批准。竞争也不是假设：Motorola、Leonardo、OpenALPR、Axon 和 Rekor
              都围绕模块化部署、互操作性或道路智能讲重叠方案。最关键的下行风险在于，这不只是采购市场，也是信任市场。EFF 的取消和不续约案例表明，反弹会把隐私争议变成预算摩擦。估值时，应把 Flock
              承销为一个正在收敛的公共安全与物理安防运营平台，有显著相邻上行；但采用率受治理质量和政治容忍度支配，与产品宽度同等重要。
