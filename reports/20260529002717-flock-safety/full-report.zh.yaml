      - number: '4.3'
        title: 成本结构、毛利率路径与资本强度
        blocks:
          - type: paragraph
            body: >-
              公开毛利率故事方向可理解，但数字缺失。Flock 自有页面显示，公司负责安装、维护、升级、支持，并在部分场景负责下线和硬件拆除。新的 Smyrna
              工厂带来更多固定成本和营运资本暴露，因为它覆盖无人机生产、太阳能板组装和设备翻新。这意味着 Flock
              的成本栈不只是传感器硬件加云托管；还包括现场服务、物流、类似保修的维护、制造运营、翻新，以及在部署计划跑在需求前面时可能出现的库存风险。公开可比公司文件有助于框定含义。Axon
              披露硬件、软件订阅、专业服务和保修混合模式；Motorola 显示，规模化公共安全厂商会混合设备、软件、安装和托管服务，但仍需要库存缓冲，并在政府合同中面对部分拨款或前置资本开支风险。Rekor
              展示同一问题的小规模版本：经常性软件野心与硬件暴露、续约风险和持续资本需求绑在一起。这些可比项支持一个观点：随着软件和工作流产品加深，Flock
              模式可能成熟为有吸引力的毛利率；但也提醒，现场服务强度和制造扩张会推迟毛利兑现。由于 Flock 不披露毛利率、产品 COGS、保修准备金或翻新成本，毛利路径仍是投资假设，而非已证明事实。
