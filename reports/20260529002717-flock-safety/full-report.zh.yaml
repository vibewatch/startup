      - number: '7.3'
        title: 安全、运营与产品蔓延风险
        blocks:
          - type: paragraph
            body: >-
              产品面拓宽之后，运营风险被放大。只卖固定式 ALPR 硬件的公司面对的是一种质量保障问题。Flock 现在必须同时保护账户访问、边缘设备、云视频、PTZ 摄像头、音频检测、RTCC
              工作流软件和无人机运营，还要继续承诺低摩擦部署和一个打包订阅。Wyden 信重要，因为它暗示账户安全基线本身可能落后于所处理数据的敏感度。Condor
              报道重要，因为它指向完全不同的失败模式：不是政策滥用问题，而是设备或部署暴露，可能泄露实时和存档画面，或让证据被毁。


              与此同时，执行强度在上升。制造扩建、现场服务、支持和更广泛的产品发布，都会把公司从纯软件运营模型拉开。这并不致命——事实上，它是护城河的一部分——但会抬高犯错成本。一次可见的宕机、泄露或可靠性失灵，在这里会比很多
              SaaS
              公司更重，因为客户往往是警局、市政部门，或在政治高压场景中使用系统的安全敏感型企业买方。缓释理由是真实的——资本、招聘、订阅支持和官方部署帮助——但公开证据仍缺少运营者级别遥测，无法让投资者区分可扩展平台和快速增长的运营负担。
