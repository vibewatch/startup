      - number: '5.5'
        title: 信任、隐私、安全、合规与弱点
        blocks:
          - type: paragraph
            body: >-
              官方信任控制有实质内容，而且反复出现。Flock 称客户机构拥有数据，共享需要主动选择加入，访问绑定具名用户和获批角色，搜索需要案件相关理由，日志可供主管审查，LPR 数据保留 30
              天，除非法律或正式批准支持更长存储。FAQ 还补充了生命周期加密、面向 CJIS 数据的 AWS GovCloud、基于 KMS 的密钥控制、基于 Safe List 的居民删除选项，以及 LPR 和
              FreeForm 都不做人脸识别的定位。纸面上，这套隐私与问责包比泛摄像头栈成熟。


              弱点在于，公开控制集合大多是政策和工作流控制，而不是独立披露的保障证据。已审阅材料没有浮现公开 SOC 2 或 ISO 27001 声明；公共网站上最强的网络加固线索，是新闻中心一条关于 Bishop Fox
              合作的列表，而不是文档完整的信任中心。更重要的是，负面来源认为任务蔓延和误用不是假想边缘案例。EFF、ACLU、404 Media
              以及州/地方无人机批评者都描述了若干场景：可选共享、审计日志和地方政策并未阻止扩张式搜索行为、联邦访问争议、监督绕行或对空中监控的焦虑。Condor
              暴露指控又增加了另一类风险：即便政策很重，设备或部署安全薄弱时产品仍会失败。净结论：Flock 的信任姿态在成文治理机制上强于在独立证明的安全保障上。
