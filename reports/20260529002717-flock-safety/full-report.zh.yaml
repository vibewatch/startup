      - number: '7.4'
        title: 伙伴、采购与财务模型依赖风险
        blocks:
          - type: paragraph
            body: >-
              Flock 的收入模型已经多元化，但还没多元到可以消除公共部门依赖。Reuters 称企业约占收入
              30%，这个信息有价值，正因为它反过来说明：公共安全和公共部门需求仍很可能贡献大部分业务。这意味着采购摩擦、城市政治、合作采购机制和州级数据共享规则，不只是品牌问题，而是核心收入驱动因素。OMNIA 和 CHP
              协议证明 Flock 已搭出真实的签约基础设施，但也显示商业化引擎多么依赖公共签约路径、政策合规，以及客户随时间继续绑定更多模块的意愿。


              模型风险在于，投资者被要求承销一家按规模化、持久平台定价的公司，但耐久性证明的大块内容仍是私有的。2025
              年融资和年经常性收入（ARR）增长都有充分佐证，公开来源却仍不披露烧钱速度、现金、毛利率、净留存率（NRR）、流失或头部客户集中度。这让业务暴露于叙事压缩：如果公共部门转化放慢，如果取消压力扩散，或如果单位经济显著弱于估值所暗示的水平，下行会同时穿透增长、利润率和退出倍数。从这个意义上说，采购依赖和披露缺口不是两类分开的风险；它们会相互放大。
