            - text: 高
              tone: risk
              detail: 数据敏感，容错空间很低。
        - label: 采购 / 政策反弹
          values:
            - text: 高
              tone: risk
              detail: 数十座城市已经拒绝或关闭摄像头。
            - text: 高
              tone: risk
              detail: 反弹会拖慢新客户和相邻业务拓展。
            - text: 部分
              tone: warning
              detail: 本地控制叙事有帮助，但不够。
            - text: 高
              tone: risk
              detail: 公共部门仍是核心时，这一点尤其重要。
        - label: 制造 / 现场执行
          values:
            - text: 中
              tone: warning
              detail: 扩张负担真实存在，但已有部分资金支持。
            - text: 高
              tone: risk
              detail: 交付失败会外溢到服务质量。
            - text: 部分
              tone: warning
              detail: 资本和招聘能缓解压力，但缺少遥测数据。
            - text: 中高
              tone: warning
              detail: 需要私有运营 KPI，风险才可能下调。
        - label: 估值 / 披露脆弱性
          values:
            - text: 中高
              tone: warning
              detail: 增长或续约走弱时，脆弱性会上升。
            - text: 严重
              tone: risk
              detail: 政策阻力下，高倍数可能迅速重置。
            - text: 低
              tone: risk
              detail: 缓解主要靠未来披露，不是当前证据。
            - text: 高
              tone: risk
              detail: 入场纪律应保持保守。
        - label: 人才 / 平台蔓延
          values:
            - text: 中高
              tone: warning
              detail: 创始人中心化和产品宽度都很明显。
            - text: 高
              tone: risk
              detail: 执行一旦滑坡，其他风险都可能被放大。
            - text: 部分
              tone: warning
              detail: 管理梯队正在建设，但证据还不充分。
            - text: 高
              tone: risk
              detail: 需要私有的接班与可靠性证明。
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 主要下行路径从争议性使用和安全问题出发，传导到监督，再传到客户行动、增长摩擦和估值倍数压缩。
    claimRefs:
      - CR011
      - CR014
      - CR035
      - CR038
      - CR040
      - CR041
      - CR043
      - CR046
    data:
      nodes:
        - id: misuse
          label: 争议性搜索 / 滥用
          description: 堕胎、移民和跨辖区查询触发审查。
        - id: security
          label: 网络 / 设备暴露
          description: MFA 缺口或 Condor 式事件会抬高信任风险。
        - id: oversight
          label: 监督 / 诉讼
          description: 国会、法院和州级政策将争议制度化。
        - id: customer-action
          label: 客户纠偏行动
          description: 暂停、封禁访问、撤回以及审批放慢。
        - id: procurement
          label: 采购摩擦
          description: 市议会和机构决策更慢，或直接否决。
        - id: growth
          label: 增长 / 续约压力
          description: 公共部门转化和扩张放慢。
        - id: valuation
          label: 倍数压缩
          description: 信心下降后，被拉伸的平台倍数重置。
        - id: thesis
          label: 投资逻辑破裂
          description: 一次泄露、禁令或大范围取消潮会推翻投资案。
      edges:
        - id: e1
          source: misuse
          target: oversight
          label: 已有记录的查询触发调查
        - id: e2
          source: security
          target: oversight
          label: 安全缺口招来监管关注
        - id: e3
          source: oversight
          target: customer-action
          label: 城市和机构作出反应
        - id: e4
          source: customer-action
          target: procurement
          label: 客户背书和审批走弱
        - id: e5
          source: procurement
          target: growth
          label: 赢单变少，续约放慢
        - id: e6
          source: growth
          target: valuation
          label: 叙事和倍数同时压缩
        - id: e7
          source: security
          target: customer-action
          label: 运营信任更快破裂
        - id: e8
          source: valuation
          target: thesis
          label: 信心下降后，入场逻辑失效
        - id: e9
          source: oversight
          target: thesis
          label: 有约束力的限制或禁令可能打断网络效应
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: Flock 的扩张逻辑依赖许多外部参与方保持同向：机构、采购渠道、监管者、云基础设施，以及快速扩张的内部管理梯队。
    claimRefs:
      - CR024
      - CR027
      - CR028
      - CR029
      - CR031
      - CR032
      - CR042
    data:
      nodes:
        - id: agencies
          label: 本地机构 / 客户
          description: 掌握数据、权限和本地政策选择。
        - id: network
          label: 共享网络价值
          description: 跨辖区访问和查询规模。
        - id: procurement
          label: 采购渠道
          description: OMNIA、合同办公室和公共采购路径。
        - id: regulators
          label: 法院 / 立法者 / FAA
          description: 划定法律和审批边界。
        - id: cloud
          label: 云 / 连接栈
          description: GovCloud、电信、存储和搜索可用性。
        - id: manufacturing
          label: 制造 / 现场运营
          description: 工厂、安装、维护和支持执行。
        - id: platform
          label: 扩展产品栈
          description: LPR、视频、音频、OS、DFR 和工作流软件。
        - id: bench
          label: 高管 / 组织梯队
          description: 协调整套系统需要足够领导层深度。
      edges:
        - id: d1
          source: agencies
          target: network
          label: 选择加入式共享会创造或缩小网络效应
        - id: d2
          source: procurement
          target: agencies
          label: 采购摩擦决定部署速度
        - id: d3
          source: regulators
          target: network
          label: 共享规则可能压缩查询价值
        - id: d4
          source: regulators
          target: platform
          label: FAA 和隐私审批塑造 DFR 推出节奏
        - id: d5
          source: cloud
          target: platform
          label: 托管可靠性支撑证据和工作流
        - id: d6
          source: manufacturing
          target: platform
          label: 硬件质量和支持决定交付成功
        - id: d7
          source: bench
          target: manufacturing
          label: 安全扩张运营需要组织深度
        - id: d8
          source: bench
          target: platform
          label: 路线图治理和事件响应依赖领导层
        - id: d9
          source: network
          target: agencies
          label: 网络价值影响续约和扩张
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从规模和产品证据，经由估值和信任风险，推导到最终观察建议的链条。
    data:
      nodes:
        - id: N1
          label: |-
            规模证据
            （$275M 融资；>$300M ARR；~70% 增长）
        - id: N2
          label: |-
            产品宽度
            （捆绑 + 平台 + 网络叙事）
        - id: N3
          label: |-
            当前价格
            （>$7.5B；>25x ARR 下限）
        - id: N4
          label: |-
            公开可比公司锚点
            （Axon / Motorola / Rekor / SoundThinking）
        - id: N5
          label: |-
            信任与政策风险
            （监督、诉讼、城市反弹）
        - id: N6
          label: |-
            经济性缺口
            （无公开毛利率 / NRR / 优先股堆叠）
        - id: N7
          label: |-
            观察
            （价格偏高；信心中等；风险高）
      edges:
        - from: N1
          to: N7
          label: 支撑质量
        - from: N2
          to: N7
          label: 支撑溢价
        - from: N3
          to: N7
          label: 限制上行空间
        - from: N4
          to: N7
          label: 设定市场边界
        - from: N5
          to: N7
          label: 抬高下行风险
        - from: N6
          to: N7
          label: 制约投资信念
    approximationNotes: 逻辑只反映公开证据；不纳入任何私有队列、毛利率或优先权数据。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV016
      - CV025
      - CV037
      - CV039
      - CV040
    sourceRefs:
      - SV001
      - SV002
      - SV009
      - SV010
      - SV011
      - SV012
      - SV017
      - SV018
      - SV022
      - SV023
      - SV024
      - SV025
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 用三档 ARR 和三档 ARR 倍数假设推算隐含估值，展示当前估值已经吃进多少执行预期。
    data:
      items:
        - label: $300M ARR × 10x 情景
          value: 3000
        - label: $300M ARR × 15x 情景
          value: 4500
        - label: $300M ARR × 20x 情景
          value: 6000
        - label: $400M ARR × 10x 情景
          value: 4000
        - label: $400M ARR × 15x 情景
          value: 6000
        - label: $400M ARR × 20x 情景
          value: 8000
        - label: $500M ARR × 10x 情景
          value: 5000
        - label: $500M ARR × 15x 情景
          value: 7500
        - label: $500M ARR × 20x 情景
          value: 10000
    approximationNotes: 数值为以 USD 百万美元计的估值。当前 $7.5B 估值大致落在 $500M ARR × 15x 或 $375M ARR × 20x，显示当前估值已经提前吃进了多少未来兑现。
    claimRefs:
      - CV007
      - CV025
      - CV030
      - CV031
    sourceRefs:
      - SV001
      - SV002
      - SV022
      - SV023
      - SV024
      - SV025
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于公开证据情景集，到 2029 年的乐观、基准、悲观和当前入场估值区间。
    data:
      items:
        - label: 悲观
          low: 2000
          mid: 2750
          high: 3500
          unit: USDm valuation
        - label: 基准
          low: 6000
          mid: 7000
          high: 8000
          unit: USDm valuation
        - label: 乐观
          low: 10000
          mid: 12000
          high: 14000
          unit: USDm valuation
        - label: 当前入场
          low: 7500
          mid: 7500
          high: 7500
          unit: USDm valuation
    approximationNotes: 未建模优先股堆叠；在悲观和基准情景中，普通股结果可能显著差于图示的企业价值或股权价值区间。
    claimRefs:
      - CV033
      - CV034
      - CV035
    sourceRefs:
      - SV001
      - SV002
      - SV012
      - SV014
      - SV015
