  - id: TM002
    title: 总可用市场（TAM）/ 可服务市场（SAM）/ 规模测算表
    columns:
      - 视角
      - 地理范围
      - 数值 / 数量
      - 年份
      - 方法论 / 覆盖内容
      - 置信度
      - 局限
    rows:
      - - 公开 ALPR 总可用市场（TAM）
        - 全球
        - $10.1B 市场规模；2030 年预测 $15.22B
        - 2026 / 2030
        - 自上而下的市场报告，覆盖交通、停车、收费、执法等政府和商业 ALPR 用途
        - 中
        - 范围对 Flock 可服务市场（SAM）过宽，因为包含非美国和非核心品类。
      - - 官方州 / 地方机构上限
        - 美国
        - 17,541 个机构
        - 2018 年基准
        - BJS 对至少 1 名 FTE 宣誓警员机构的普查
        - 高
        - 官方口径但数据偏旧；并非所有机构都能支撑 RTCC 规模部署。
      - - 可落地的地方公共安全核心盘
        - 美国
        - 14,875 个地方警察局 + 警长办公室
        - 2018 年基准
        - 根据 BJS 机构类型数量做算术汇总
        - 中
        - 仍会高估可服务支出，因为许多机构规模很小，或依赖县 / 州合作。
      - - 超小型机构队列
        - 美国
        - 7,055 个 FTE 宣誓警员 <10 人的机构
        - 2018 年基准
        - BJS 按机构规模划分的分布
        - 高
        - 适合判断可行性，不是直接支出数。
      - - Flock 网络覆盖
        - 美国 / 多州
        - 4,800+ 个联网机构
        - 当前页面
        - Flock 平台关于机构网络覆盖的说法
        - 中
        - 公司自报，且不是披露的 ARR 贡献客户数。
      - - HOA / 社区邻近市场
        - 美国
        - 373,000 个社区协会；78.1M 居民
        - '2025'
        - CAI 关于协会和居民的统计综述
        - 中
        - 统计的是买方实体，不是安防预算或采用率。
      - - 零售损耗压力视角
        - 美国
        - $112.1B 损耗损失；平均损耗率 1.6%
        - FY2022 调研
        - NRF 对零售损耗防控专业人士的安全调研
        - 中
        - 损耗不是安防支出，但它强烈指向损耗防控预算需求。
    notes: 本表刻意混合自上而下的收入估算、由下而上的买方数量和痛点强度视角，因为留存的公开来源没有单独拆出一个覆盖警务、HOA、零售和交通板块的干净 Flock 式可服务市场（SAM）。
