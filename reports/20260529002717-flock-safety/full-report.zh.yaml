        - 模型准确率和误报的公开细节很少
      - - FlockOS
        - RTCC、GSOC、一线主管
        - 统一实时地图和事件协同
        - 核心 / 中央控制平面
        - 聚合 CAD / RMS / 视频 / 传感器，并支持移动端访问
        - 实时集成的广度更多是营销表述，公开枚举较少
      - - Flock911
        - 调度、巡逻、DFR 飞手、RTCC
        - 实时通话音频和转写分发
        - 已上线 / 工作流附加模块
        - 使用现有 Flock 界面，而不是新应用
        - PSAP 后端集成公开细节不深
      - - Flock Nova
        - 分析员、刑侦人员、管理层
        - 统一记录 / 调查搜索
        - 已上线 / 新兴运营层
        - 在一个标签页搜索机构系统，并带审计日志和角色控制
        - 仪表盘 / 报告仍标注为即将推出
      - - FreeForm
        - 刑侦人员、分析员、巡逻
        - 跨视频和 LPR 的自然语言搜索
        - 已上线 / 高可见度 AI 层
        - 共享摄像头搜索、实时告警、第三方视频集成
        - 审核模型只有高层次描述，未经独立审计
      - - 全国 LPR 网络
        - 执法机构
        - 跨辖区线索生成和热名单共享
        - 核心 / 已规模化的网络效应
        - 覆盖 49 个州、冲突消解、连接 NCIC / NCMEC 和州数据库
        - 授权访问越广，网络级治理风险越高
      - - Flock DFR / Alpha
        - RTCC、DFR 团队、巡逻指挥
        - 针对报警、告警和警员支援远程起飞无人机
        - DFR 已上线；Alpha 处于早期访问
        - 基于 LPR / 枪声 / RTCC 上下文的同工作流调度，加上 Alpha 美国制造叙事
        - 公开可用性和机队可靠性数据仍有限
      - - Aerodome 私有场地无人机
        - 企业安保团队
        - 私有物业上与告警联动的空中响应
        - 已上线，但带路线图限制
        - 将同一平台逻辑用于仓库、铁路货场、园区和零售
        - 完整自动派遣和定时巡逻自动化仍属有条件 / 近期待落地
