      - number: '5.2'
        title: 运营架构与集成模型
        blocks:
          - type: paragraph
            body: >-
              架构是分层的边缘到云栈。边缘端，Flock 硬件通过为路边、停车场和校园部署设计的轻基础设施设备，捕获车牌、视频和音频事件。中间层，云平台标准化检测、告警和搜索产物，再在
              FlockOS、Nova、FreeForm 和移动应用等共享运营界面中呈现。围绕核心，公司越来越像集成枢纽：产品页强调 CAD 和 RMS
              集成、第三方视频支持、跨机构共享和「连接任意供应商」；开发者平台文档则提供了更具体证据，说明 Flock 现在支持托管伙伴应用、事件订阅、车辆检测 API，以及基于 OAuth 的限域访问。


              NIJ 和 Seattle 的 RTCC 文献在这里有用，因为它用中性语言描述目标品类：把调度、摄像头、警员位置、枪声系统和记录叠到地图上的「单一视图」。Flock
              自有材料与这一架构高度贴合。关键细节是，开发者界面并不是消费级 SaaS 意义上的完全开放。Flock 筛选伙伴参与，要求应用注册，执行按权限范围划分的访问控制，并把可审计性写进 API
              条款。这提升了控制，但也意味着生态宽度取决于 Flock 的伙伴准入决定，和 API 是否可用同样重要。
