  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 细分与客户组合
        blocks:
          - type: paragraph
            body: >-
              Flock 的客户基础已不再只是执法客户墙，但公共安全看起来仍是经济重心。公司官网上最新的广度信号是客户索引，宣称超过 5,000 家执法机构、超过 6,000 个社区、超过 1,000 家企业。Reuters
              2025 年 3 月融资报道方向一致但更保守，称执法机构超过 4,800 家、企业近 1,000 家，企业账户约占收入
              30%。合起来看，这些披露意味着公司已有相当分量的私营部门多元化，但仍锚定机构预算和公共安全工作流，而不是纯企业 SaaS 需求。


              Flock 现在营销的运营界面也能看出细分宽度。执法页面明确把机构、学校、企业和 HOA 之间的公私数据共享作为定位；零售页面聚焦有组织零售犯罪和跨地点调查；医疗页面关注停车场安全和校园出入；交通页面加上 MS2
              伙伴关系，则把技术栈扩展到 DOT 交通分析。这种宽度在战略上重要，因为它让 Flock
              有更多方式，把同一套摄像头、搜索、告警和工作流基础设施复用到相邻买家。限制在于，已发布计数是定义性口径而非审计结果：社区可能与机构和私人业主重叠；公开记录仍未披露精确账户拆分、Reuters
              企业收入评论之外的按垂直拆分收入，也未披露这些账户中有多少是多产品部署，而非单摄像头部署。
