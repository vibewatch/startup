      - number: '4.4'
        title: 资本充足性、融资依赖与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              头部资本支持很强，但承销可见度仍不完整。Flock 2025 年融资包得到充分交叉印证：$275 million、估值 $7.5 billion、累计融资超过 $950 million，ARR 超过 $300
              million 且同比约
              70%。官方和独立报道也一致认为，资金将投向产品创新、研发、美国本土制造和扩大的无人机能力，并继续在工程、制造和销售岗位招聘。这在定性上降低了近端偿付担忧。但公开证据停在真正影响承销的问题之前：现金余额、月度烧钱速度、资本开支预算、现金跑道、债务、留存率和细分层面毛利率全都缺失。Reuters
              提到 Flock 增设 CFO、为未来可能上市做准备，这解释了披露日后可能改善，但不能解决今天的尽调缺口。负面记录也有财务意义。TechCrunch 报道多个州的破坏行为和数十个城市拒绝 Flock
              摄像头；同业文件也提醒投资者，续约率、政府客户资金和合同取消动态都会削弱看似有吸引力的经常性模式。财务结论：合同经常性、多产品，因此收入质量好于只看监控技术的怀疑者可能假设；但毛利路径和资本强度仍过于不透明，没有私人数据室证据就无法干净承销。
