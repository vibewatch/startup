      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              分析把广泛账户数和披露结果的具名生产部署分开时，采用故事最强。执法领域，Fort Worth 的 RTCC 案例显示 Flock 从单一 LPR 安装扩展到一体化工作流，覆盖 Falcon
              LPR、第三方摄像头集成、邻近辖区 PTZ 访问和计划中的 Raven 音频检测扩展；该故事把这套配置与 2021 年至 2023 年 9 月期间 2,227 次 RTCC 呼叫、随后的逮捕和 417
              支枪支缴获联系起来。Tulsa 的 RTIC 案例同样显示，FlockOS 作为实时指挥层横跨 911、巡逻位置、执法记录仪视频、PTZ 和 LPR，客户称不到 17 个月内凶杀案破案率达到
              100%。Albany 增加了 Raven 专属证明点：该部门称 2023 年 3 月开始使用产品，并发现枪击事件比此前认为的多 30%。


              公共安全之外，引用材料显示真实生产使用，但细节更不均衡。Academy Sports 在门店周边部署 LPR，后来扩展到实时和录制视频；这家零售商的具名故事描述一次跨店告警后约 20
              分钟完成逮捕。一家物流运营商称多设施部署、消除有组织盗窃损失，并在两个月内标记 700 多辆被盗车辆或车牌。San Bruno 的 Shelter Creek COA
              描述了跨九条车道的社区级安装，并称系统长期帮助侦破 100 多起犯罪。医疗和学校故事也不只是挂客户标识：Georgia 一家医院部署六台 Falcon 摄像头，并报告六个月内盗窃下降 55%；Georgia
              一套学校系统围绕 100
              多所学校建立虚拟大门。公用事业和交通在证明栈上更靠后。公用事业案例显示总部实时部署和明确运营价值，但没有多站点规模；交通证据在产品匹配和伙伴分销上可信，但具名、规模化、独立交叉印证的生产车队仍偏薄。
