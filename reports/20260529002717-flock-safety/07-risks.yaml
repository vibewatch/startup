- id: TR005
  title: Mitigation and kill criteria table
  notes: Thresholds are investment discipline triggers, not predictions; they are designed to be monitorable from diligence or follow-up refreshes.
  claimRefs:
  - CR040
  - CR042
  - CR043
  - CR045
