  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / civil-liberties / regulatory
    - Formal enforcement or appellate restriction
    - FTC or state AG action, injunction, or adverse appellate ruling that materially constrains cross-jurisdiction sharing
    - Treat as thesis break unless management can prove de minimis revenue exposure and compliant redesign
  - - Cybersecurity / data protection
    - Confirmed multi-customer incident
    - Unauthorized access to law-enforcement-only data or live or archived video affecting multiple customers
    - Move to avoid until remediation, audit evidence, and customer-retention impact are fully understood
  - - Procurement / policy climate
    - Cancellation or suspension wave broadens
    - Material additional suspensions or a greater-than-100-municipality rejection or shutdown footprint across major states
    - Cut public-sector growth assumptions and reset valuation multiple expectations
  - - Financial / model opacity
    - Core KPI disclosure still absent in diligence
    - No burn, gross margin, NRR, concentration, or renewal waterfall shared in diligence
    - Do not pay a stretched entry multiple; hold at research-more or track
  - - Execution / platform sprawl
    - Reliability and approval metrics lag launches
    - DFR, Condor, or video modules scale without module-level uptime, false-alert, or approval-funnel evidence
    - Lower attach assumptions and require phased underwriting by module
  - - Mitigation maturity
    - Private evidence closes the main gaps
    - Independent security audit pack, concentration data, renewal metrics, and succession evidence all clear
    - Re-rate residual risk down one notch and revisit valuation tolerance
