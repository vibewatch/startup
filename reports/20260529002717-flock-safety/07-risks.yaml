- id: execution-kill-criteria
  title: Execution watchpoints, mitigations, and kill criteria
  body: 'Execution risk is best understood as a residual overlay on the other categories. Founder-led urgency, rapid hiring, product sprawl, and manufacturing expansion can all be strengths when they compress time to market. They become risk when the company adds new modules faster than it can standardize controls, reliability, compliance, and leadership depth. The public leadership picture still looks founder-centric, and the company''s own milestones show a fast cadence of launches across adjacent products. That can justify upside, but it also means that diligence cannot stop at ARR and customer count; it has to test whether bench depth, security assurance, and incident response have matured as quickly as the product map has.


    The practical underwriting response is to pre-commit to monitorable stop conditions. If the legal environment tightens enough to limit cross-jurisdiction network effects, if a confirmed security incident touches multiple customers or sensitive video data, or if cancellation momentum spreads materially through flagship states or major agencies, the core platform thesis weakens sharply. Conversely, the thesis can de-risk if management produces hard private evidence on renewal quality, security assurance, module reliability, concentration, and succession depth. Until then, the right stance is not to deny Flock''s strengths, but to treat mitigation maturity as partial and residual risk as high.'
