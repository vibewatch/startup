  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-retention
    missingEvidence: Burn, cash balance, gross margin, NRR, churn, CAC or payback, and a revenue bridge by segment or product.
    whyItMatters: Valuation fragility is impossible to underwrite cleanly without the core economic and retention metrics that determine whether growth is durable or only headline-deep.
    diligencePath: Request the latest board KPI pack, cohort retention tables, budget versus actual cash burn, gross-margin bridge, and top-customer or top-state revenue concentration schedule.
    relatedQuestionRefs:
    - QR017
  - type: private-evidence-only
    severity: material
    topic: independent-security-assurance
    missingEvidence: Customer-shareable evidence of security certifications, penetration-testing scope, remediation history, MFA rollout, and incident postmortems.
    whyItMatters: Official trust pages show what Flock says it does, but investors need independent assurance to judge whether cyber and footage-exposure risk is a contained issue or a systemic weakness.
    diligencePath: Request SOC 2 or equivalent reports, external pentest letters, vulnerability-management SLAs, MFA adoption data, and any incident register covering account compromise or device exposure.
    relatedQuestionRefs:
    - QR024
  - type: private-evidence-only
    severity: material
    topic: dfr-and-condor-reliability
    missingEvidence: Module-level uptime, false-alert rates, device-failure data, incident counts, approval-funnel metrics, and remediation history for DFR and PTZ video deployments.
    whyItMatters: The newest and most visually intrusive modules can swing both growth and downside, but the public record does not yet show whether they scale with operator-grade reliability.
    diligencePath: Request deployment scorecards for Condor and DFR, COA or waiver funnel metrics, customer references using the modules in production, and the internal launch-quality thresholds used before expansion.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: minor
    topic: succession-and-bench-depth
    missingEvidence: Succession planning, span-of-control data, executive turnover, and named operating owners for security, compliance, manufacturing, and product governance.
    whyItMatters: A founder-led company can scale well, but the platform-sprawl and public-scrutiny mix here requires confidence that execution depth extends meaningfully beyond one or two visible leaders.
    diligencePath: Request current org chart, succession and delegation materials, executive turnover history, and operating-review ownership by critical function.
    relatedQuestionRefs:
    - QR029
