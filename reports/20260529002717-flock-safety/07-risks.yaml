company:
  name: Flock Safety
chapter:
  number: 7
  title: Risks
  summary: 'Flock Safety''s highest-severity residual risk is that privacy, civil-liberties, and cybersecurity controversies have already crossed into formal oversight, litigation, and municipal pushback, giving the company less room for operational error than its headline ARR growth suggests. Security and platform-sprawl risk are the next layer: the business is now broad enough that any trust failure can travel from one module into renewals, procurement, and valuation. Mitigations exist, but public evidence still leaves key assurance, unit-economics, and bench-depth questions unresolved.'
sections:
- id: severity-stack
  title: Severity-ranked risk stack
  body: 'The risk ranking is driven by two questions: which failure modes can most directly impair contract renewals, procurement velocity, and valuation, and which ones remain only partially mitigated by the controls Flock publicly discloses. On that basis, the top tier is privacy and civil-liberties exposure, not because every allegation will become a judgment, but because the evidence already shows a multi-step transmission path from controversial searches to congressional scrutiny, lawsuits, municipal suspensions, and visible procurement backlash. In other words, this is no longer an abstract reputational debate. It is an operating risk that can change whether agencies expand, whether cities approve adjacent products, and what multiple investors are willing to pay for growth.


    The second tier is security and operational execution. Flock is now a much broader stack than fixed ALPR: video, PTZ, gunshot detection, OS, 911 intake, drones, and manufacturing all add delivery surfaces that can fail differently and under more public scrutiny. The third tier is model fragility. The 2025 financing round validates demand, but it also raises the bar: a business priced for continued hypergrowth and platform expansion has less room for regulatory drag, customer churn, or a well-publicized security incident. The registers below therefore treat likelihood, impact, mitigation maturity, and residual risk as linked rather than separate dimensions.'
