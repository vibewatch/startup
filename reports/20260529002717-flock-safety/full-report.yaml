      - number: '5.3'
        title: Deployment, Reliability Posture, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Flock’s deployment pitch is deliberately low-friction. LPR and video pages stress infrastructure-light
              installation, solar power options, same-pole deployment, and one bundled subscription that includes
              maintenance, upgrades, and support. The field workflow is also built to reduce tool sprawl: Flock911 is
              delivered through the existing alert/map interface, and the mobile app adds shift-aware notifications,
              location radius filters, and media playback. On the drone side, the company promises white-glove launch
              support that covers site planning, FAA guidance, SOP creation, training, and ongoing operational help.
              Spokane’s case study supports the claim that customers perceive Flock as carrying a meaningful share of
              integration burden.


              Reliability evidence is directionally positive but still more marketing-heavy than operator-grade.
              Official materials point to cloud health monitoring, four-cellular-modem redundancy for Alpha,
              under-90-second reflight readiness, and customer anecdotes about faster response and easier integration.
              What is missing is hard public telemetry: uptime, false-alert rates, MTBF, camera failure curves, and
              post-incident reliability disclosures are not surfaced in reviewed sources. The roadmap is similarly
              mixed. Some capabilities are clearly shipped now, while others remain staged or conditional: Nova still
              markets dashboards/reporting as “coming soon,” private Aerodome describes scheduled patrol automation as a
              near-term update, and full auto-dispatch remains linked to FAA approvals. That means customers get an
              integrated system today, but parts of the most ambitious autonomy story are still in build-out rather than
              proven at scale.
