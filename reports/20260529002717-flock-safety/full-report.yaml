        title: Comparable set, entry discipline, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Public comparables are imperfect, but they are directionally clear. Axon is the upper-bound comp because
              it already combines devices, software, sensors, video, and workflow products in public safety and still
              trades below Flocks floor ARR multiple on trailing sales. Motorola supplies the scaled incumbent anchor at
              roughly mid-single-digit sales multiples, while Rekor and SoundThinking show how harsh public markets can
              be on smaller public-safety or analytics names with mixed hardware or controversy exposure. Those anchors
              do not prove Flock is overvalued, because ARR and GAAP revenue are not the same and a stronger retention
              or software profile could justify a premium. But they do show why entry discipline matters. To move from
              TRACK to BUY, an investor would need one of three things: a meaningfully lower effective entry price,
              data-room evidence that gross margin and retention deserve a large premium, or structural downside
              protection in the security. Flock has enough scale and narrative breadth to be exit-eligible, but not
              enough public disclosure to be treated as public-market-ready on economics.
