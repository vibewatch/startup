  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of the public evidence on market, proof, economics, risk, and valuation for Flock Safety.
    data:
      items:
        - label: Market demand / category pull
          value: 4 / 5
          detail: Large public-safety footprint and visible expansion into enterprise and workflow use cases.
          claimRefs:
            - CV003
            - CV009
            - CV044
        - label: Product / platform proof
          value: 4 / 5
          detail: Bundled subscription, platform breadth, and cross-agency workflow narrative are supportable.
          claimRefs:
            - CV005
            - CV006
        - label: Revenue scale / growth
          value: 4 / 5
          detail: $300M+ ARR and ~70% growth are strong late-stage inputs.
          claimRefs:
            - CV001
            - CV002
        - label: Economics transparency
          value: 2 / 5
          detail: Public evidence still omits margin, NRR, burn, and payback.
          claimRefs:
            - CV008
        - label: Regulatory / trust posture
          value: 1 / 5
          detail: Oversight letters, litigation, and city pushback remain active.
          claimRefs:
            - CV011
            - CV012
            - CV013
            - CV015
        - label: Competitive durability
          value: 3 / 5
          detail: Premium platform upside exists, but Axon is already broad and public.
          claimRefs:
            - CV024
            - CV025
            - CV027
        - label: Valuation support
          value: 2 / 5
          detail: Current price looks stretched relative to public anchors and scenario math.
          claimRefs:
