      - number: '6.5'
        title: Expansion motion, concentration, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Flock's expansion motion looks real. The clearest evidence is product packaging plus named cross-sell.
              Academy moved from LPR into video, Fort Worth added integrated cameras and planned Raven, Tulsa's proof
              centers on FlockOS rather than just cameras, and OMNIA's 2026 price list shows Raven, FlockOS, Flock911,
              Enhanced LPR, and DFR offered through one purchasing vehicle. The retail, healthcare, and transportation
              pages all reuse the same core logic — cameras, alerts, searchable evidence, and one dashboard — which
              supports a land-and-expand motion into adjacent buyers. Reuters' disclosure that enterprise customers make
              up about 30% of revenue is important here: it implies private-sector growth is meaningful enough to
              matter, but still not enough to eliminate public-safety concentration.


              The biggest concentration and expansion risks sit around budget cycles, politics, and dependency on
              distribution infrastructure. Public safety likely still drives the majority of revenue, yet the company
              does not disclose top-customer concentration, ARR by segment, or whether a handful of large agencies
              dominate multi-product spend. Public-sector expansion also depends on procurement paths such as OMNIA and
              on partners such as MS2 for transportation analytics. Meanwhile, adverse reporting shows real friction:
              Security Systems News documented customer-trust questions around ICE access; TechCrunch reported cities
              rejecting Flock cameras and vandalism against deployments; and Connecticut Public shows drone expansion
              can trigger privacy backlash even when programs move forward. So the customer story is positive on
              cross-sell and segment breadth, but the concentration overhang remains that Flock still appears most
              exposed to politically sensitive public-safety spending and to the procurement drag that comes with it.
