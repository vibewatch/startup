  - id: TV002
    title: Thesis / anti-thesis table
    description: >-
      Main arguments for and against underwriting Flock at the disclosed 2025 valuation, plus what would change the
      view.
    columns:
      - Type
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          Flock has real scale: >$300M ARR, ~70% growth, and thousands of agencies and businesses already on the
          network.
        - >-
          Downward revision of growth or evidence that the customer count materially overstates paying accounts would
          weaken this pillar.
      - - Thesis
        - >-
          The business sells a bundled annual subscription and a broader workflow platform, which can justify a premium
          to point-solution vendors.
        - >-
          If margin, retention, or attach rates show the platform is still mostly hardware-heavy, the premium should
          compress.
      - - Thesis
        - >-
          Public-safety workflow breadth and network effects can still move Flock closer to an Axon-style platform
          narrative than to commodity ALPR.
        - If agencies increasingly multi-home or treat Flock as just another sensor, platform premium fades quickly.
      - - Anti-thesis
        - >-
          At the disclosed floor the round implies ~25x ARR, above most public-safety comparables and not obviously
          cheaper than Axons public-market premium.
        - A lower effective entry price or private evidence of much stronger economics would reduce this objection.
      - - Anti-thesis
        - >-
          Public evidence does not disclose gross margin, burn, NRR, or the preference stack, so return math is
          under-specified.
        - Data-room access to KPI packs and financing documents would materially improve conviction.
      - - Anti-thesis
        - >-
          Privacy, cybersecurity, and governance issues are already in oversight letters, litigation, city
          cancellations, and camera vandalism.
        - >-
          If Flock shows strong incident controls, low controversy-driven churn, and no broader policy crackdown, the
          downside tail narrows.
