      - number: '7.2'
        title: Privacy, civil-liberties, and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              This is the chapter's highest-severity risk because multiple independent lines of evidence point in the
              same direction. Congress is already involved. State-level restrictions are already tightening. Lawsuits
              are already active. And public reporting shows controversial use cases are not edge cases isolated to one
              rogue officer or one unusual city. The abortion-related lookup described by House Oversight and EFF is
              especially important because it demonstrates how a single search can scale across a national network
              quickly, touching cameras and jurisdictions whose local political choices may not align with the query.
              The California complaint and Virginia litigation then convert the same concern into formal legal attack on
              both statutory and constitutional grounds.


              Flock's own mitigation story is coherent: local control, role-based permissions, logged searches, opt-in
              sharing, and no facial recognition. But the residual exposure remains high because those controls still
              depend on thousands of customer governance choices, accurate configuration, and reliable platform
              enforcement. When Oxnard suspends cameras after a vendor-based issue, Richmond blocks federal access,
              Mount Prospect withdraws after misuse concerns, and Congress requests documents on abortion, ICE, and CBP
              queries, the investment question is not whether Flock can explain the safeguards. It is whether those
              safeguards are strong enough to preserve trust and network effects under adversarial, multi-jurisdiction
              scrutiny.
            claimRefs:
