      - number: '5.2'
        title: Operating Architecture and Integration Model
        blocks:
          - type: paragraph
            body: >-
              The architecture is a layered edge-to-cloud stack. At the edge, Flock hardware captures plate, video, and
              audio events from infrastructure-light devices designed for roadside, lot, and campus deployment. In the
              middle, the cloud platform normalizes detections, alerts, and search artifacts, then exposes them in
              shared operational surfaces such as FlockOS, Nova, FreeForm, and the mobile app. Around that core, the
              company increasingly behaves like an integration hub: the product pages emphasize CAD and RMS
              integrations, third-party video support, cross-agency sharing, and “connect any vendor,” while the
              developer-platform docs add concrete evidence that Flock now supports managed partner apps, event
              subscriptions, vehicle-detection APIs, and OAuth-based scoped access.


              The RTCC literature from NIJ and Seattle is useful here because it describes the target category in
              neutral terms: a “single pane of glass” that overlays dispatch, cameras, officer location, gunshot
              systems, and records on a map. Flock’s own materials align tightly with that architecture. The important
              nuance is that the developer surface is not fully open in a consumer-SaaS sense. Flock curates partner
              participation, requires app registration, enforces scope-based permissions, and makes auditability part of
              the API terms. That improves control, but it also means ecosystem breadth depends on Flock’s
              partner-admission decisions as much as on pure API availability.
