      - number: '3.2'
        title: Capability, packaging, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              The most important competitive split is not simply camera quality; it is where each vendor sits on
              workflow breadth versus adjacent distribution. Flock packages an annual subscription that wraps hardware,
              software, installation, maintenance, and support into one fee, and FlockOS positions itself as the command
              layer joining video, CAD, RMS, alerts, and cross-agency sharing. That is a differentiated buying story for
              agencies that want fast deployment and fewer vendors. Axon Fusus comes closest on real-time operations
              breadth, but from a different direction: Axon emphasizes preserving prior investments, policy-governed
              sharing, audit trails, evidence continuity, and the ability to extend into other Axon surfaces. Motorola
              competes more as an incumbent portfolio owner with LPR breadth plus deep adjacent installed base. Genetec
              and Leonardo remain credible for agencies that prioritize legacy compatibility and established
              physical-security platforms over one vendor promise.


              Adjacent vendors complicate the picture. Verkada is not a policing-native operating system, but its
              GovCloud posture, government compliance stack, and watchlist-capable LPR mean it can absorb some security
              budgets that might otherwise move toward Flock. Peregrine is narrower but strategically important because
              it sells interoperability itself, turning the common operating picture into a data-layer problem rather
              than a sensor-platform decision. Skydio is the clearest entrant around DFR: its public-safety materials
              show meaningful agency adoption, fast launch and response claims, and strong partner integrations, while
              its procurement guide makes clear that drones are becoming easier for agencies to buy through existing
              federal and reseller channels. In other words, Flock still looks unusually complete for a private platform
              vendor, but its rivals increasingly attack from the edges where procurement and installed base are already
              in place.
