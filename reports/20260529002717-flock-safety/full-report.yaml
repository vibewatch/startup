  - id: TV005
    title: Thesis-break and kill triggers table
    description: Concrete events or thresholds that would turn the current track call into avoid or stop-work.
    columns:
      - Trigger
      - Threshold
      - Why it breaks the thesis
      - Action implication
    rows:
      - - Confirmed multi-customer security breach
        - Evidence of broad unauthorized access or compromised customer accounts across the network
        - Undercuts the trust, governance, and cross-agency-network thesis while inviting regulatory action.
        - Pause process and reset downside case immediately.
      - - Binding data-sharing restriction
        - Court, regulator, or lawmaking action meaningfully limits interstate or cross-agency search behavior
        - Damages network-effect upside and slows public-safety workflow expansion.
        - Move recommendation toward avoid unless price resets materially.
      - - Cancellation wave in flagship jurisdictions
        - Material churn from major city or state systems tied to privacy controversy
        - Signals trust issues are hitting paid deployments rather than only headlines.
        - Underwrite slower growth and lower exit multiple.
      - - Economics miss in diligence
        - Gross margin or NRR materially below software-like thresholds needed for premium valuation
        - Shows current premium is being carried by topline narrative rather than durable unit economics.
        - Do not proceed without better price or terms.
      - - Preference-heavy recap or down round
        - New financing reveals heavy seniority, participation, or a lower price than 2025
        - Confirms downside to common-equity outcomes and weakens price support.
        - Treat existing mark as stretched and re-underwrite from the new cap table.
    notes: Thresholds focus on thesis transmission rather than on one-off negative headlines.
