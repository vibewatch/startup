      - CE013
      - CE014
      - CE019
      - CE033
    data:
      layers:
        - id: edge-hardware
          label: Edge capture layer
          detail: LPR, PTZ/fixed video, audio detection, and drone docks collect roadside, campus, and aerial evidence.
        - id: event-generation
          label: Alert and event layer
          detail: >-
            Hotlists, audio triggers, live 911 streams, and mobile notifications transform raw detections into
            incidents.
        - id: cloud-search
          label: Cloud evidence and search layer
          detail: >-
            Vehicle search, transcript replay, audio clips, case context, retention logic, and shared evidence live in
            Flock-managed cloud services.
        - id: ops-surfaces
          label: Operational surfaces
          detail: >-
            FlockOS, Flock911, Nova, FreeForm, and the field mobile app expose the same incident data to different
            roles.
        - id: integration-layer
          label: Integration and ecosystem layer
          detail: >-
            CAD/RMS/VMS links, third-party sensors and video, partner apps, Events API, Vehicle Detection API, and
            OAuth-based access.
        - id: governance-layer
          label: Governance and trust layer
          detail: >-
            Role permissions, reason codes, audit logs, retention rules, Safe List options, and transparency/dashboard
            controls sit across every workflow.
