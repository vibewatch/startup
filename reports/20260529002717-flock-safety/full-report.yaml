      - number: '6.3'
        title: Reference quality, freshness, and what the proof really shows
        blocks:
          - type: paragraph
            body: >-
              Reference quality is good enough to support a real customer chapter, but not good enough to remove all
              diligence risk. The positive side is that Flock's retained sources go beyond bare logo use: most named
              examples include a buyer role, a concrete deployment surface, and a specific metric, incident, or
              operational quote. The public-procurement layer is also helpful. OMNIA's contract documents and 2026 price
              list, plus the Oakland-posted CHP agreement, are stronger evidence of live public-sector buying than a
              marketing page because they show actual products, pricing structures, support obligations, and term
              mechanics. Those documents also confirm that Flock is selling a broader platform bundle — Raven, FlockOS
              tiers, Flock911, and DFR services — rather than just fixed LPR hardware.


              The weak point is that most named customer proof is still company-authored and selective. Official case
              studies naturally surface wins, not dormant accounts, failed pilots, or weak renewals, and only some
              disclose time windows clearly enough to evaluate freshness. The customer index is useful as the latest
              breadth signal, but it is not timestamped and does not explain overlap between agencies, communities, and
              businesses. Reuters adds independent scale context, but it is from March 2025 rather than run-date
              current. For newer verticals such as utilities and transportation, the public record is even thinner:
              there is enough to support existence and go-to-market intent, but not enough to cleanly distinguish
              isolated deployments from repeatable scaled production across many sites. Net: the chapter can underwrite
              adoption and expansion potential, but not with the same confidence it can underwrite durability or precise
              concentration.
