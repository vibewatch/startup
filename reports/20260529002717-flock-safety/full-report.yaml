              September 2023. Tulsa's RTIC case similarly shows FlockOS operating as a real-time command layer across
              911, patrol location, body-worn video, PTZ, and LPR, with the customer claiming a 100% homicide-clearance
              rate in under 17 months. Albany adds a Raven-specific proof point: the department says it began using the
              product in March 2023 and uncovered 30% more gunfire than previously believed.


              Outside public safety, the references show real production usage but with more uneven detail. Academy
              Sports deployed LPR around stores and later expanded into live and recorded video; the retailer's named
              story describes an arrest roughly 20 minutes after an inter-store alert. A logistics operator claims
              multi-facility deployment, elimination of organized-theft losses, and more than 700 stolen vehicles or
              plates flagged in two months. Shelter Creek COA in San Bruno describes community-scale installation across
              nine driveways and says the system has helped solve more than 100 crimes over time. Healthcare and school
              stories also move beyond logo use: a Georgia hospital deployed six Falcon cameras and reported a 55% theft
              decline over six months, while a Georgia school system built a virtual gate around 100-plus schools.
              Utilities and transportation are farther down the proof stack. The utility case shows live headquarters
              deployment and clear operational value, but not multi-site scale; transportation evidence is credible on
              product fit and partnership distribution, yet still thin on named, scaled, independently corroborated
              production fleets.
