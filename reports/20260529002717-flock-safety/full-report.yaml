  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow Definition and Product Stack
        blocks:
          - type: paragraph
            body: >-
              Flock’s product-tech story only makes sense if the company is treated as a workflow platform rather than a
              camera vendor. In the public-safety workflow, the starting signal can be a plate hit, a gunshot-style
              acoustic event, a live 911 call, or a suspicious vehicle description from an officer. Flock then tries to
              keep that signal inside one operating loop: alerts land in the mobile app or FlockOS map, operators or
              patrol can see nearby cameras and vehicle context, and the same incident can move into FreeForm or Nova
              for deeper search and case work. The private-sector drone surface uses the same idea on private property,
              with alarms or sensors triggering a one-click launch workflow.


              That workflow framing also explains the SKU map. The hardware layer now spans multiple LPR variants, fixed
              and PTZ video, and audio sensors; the software layer spans FlockOS, Flock911, Nova, and FreeForm; and the
              network layer spans the National LPR Network and sharing controls. The result is a broad module catalog
              where the practical unit of value is not “a camera” but “a faster investigative and dispatch loop.” That
              positioning is credible because each module page describes how it plugs into the next surface, but it also
              means buyers are implicitly adopting a larger operating model, not a single isolated tool.
