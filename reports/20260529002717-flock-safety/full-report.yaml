        - Natural-language search, third-party video search, analytic alerts
        - Manual review, point-solution analytics, generic AI search tooling
        - Investigators, analysts, command staff / software and operations budget
        - This raises wallet share per customer without requiring more poles or cameras.
      - - Private-property perimeter security
        - Parking-lot, campus, warehouse, HOA, and neighborhood perimeter coverage plus sharing controls
        - Guards, gates, traditional access control, unmanaged CCTV
        - HOA boards, property managers, loss prevention, GSOCs / dues or security budget
        - This creates adjacent demand outside police logos and links private data to public safety on opt-in terms.
