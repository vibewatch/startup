companyProfile:
  summary: >
    Flock Safety is an Atlanta, Georgia-based public-safety technology company founded in 2017 by Garrett Langley, Matt
    Feury, and Paige Todd and accelerated through Y Combinator's S17 batch. The company has expanded from license-plate
    recognition into a broader connected-evidence and response platform spanning LPR, video, audio detection, RTCC
    software, investigative search, and drone response, sold mostly as bundled annual subscriptions that include
    hardware, software, installation, maintenance, upgrades, and support. Public 2025 financing disclosures show a $275
    million round at a $7.5 billion valuation after management said Flock had surpassed $300 million of ARR and roughly
    70% year-over-year growth, with reach across thousands of communities, law-enforcement agencies, and business
    customers. The public record therefore supports real company quality and category relevance, but still leaves
    economics, governance depth, and trust-risk controls only partially disclosed.
