        - Gross and net retention by cohort, segment, and product bundle
        - Determines whether ARR merits a software premium or a hardware-disguised multiple.
        - CFO + FP&A retention cohort pack.
      - - Gross margin by product line
        - Hardware, installation, software, service, and drone margin bridge
        - Shows whether the blended business can grow into public-platform multiples.
        - Controller + finance data room exports.
      - - Cap table and preferences
        - Full waterfall, investor rights, anti-dilution, participation, and any secondary allocation
        - Required to translate valuation ranges into common-equity outcomes.
        - Legal diligence on financing documents.
      - - Customer and state concentration
        - Top accounts, top states, cancellation logs, and controversy-linked exposure
        - Quantifies whether policy or trust events can hit growth faster than expected.
        - RevOps + GTM leadership schedule.
      - - Drone and manufacturing capital intensity
        - Plant utilization, refurbishment costs, working capital, and drone deployment economics
        - Needed to know whether new product breadth improves or dilutes returns.
        - Operations + manufacturing review.
      - - Trust and incident management
        - Security audits, incident history, regulator correspondence, and remediation posture
        - Needed to underwrite the downside tail behind current oversight and litigation.
        - CISO + outside counsel diligence.
    notes: >-
