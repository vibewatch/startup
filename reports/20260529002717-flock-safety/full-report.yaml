chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product stack, and business model
        blocks:
          - type: paragraph
            body: >-
              Flock Safety presents itself as a public-safety technology platform rather than a single-camera vendor.
              The official homepage frames the company around connected evidence, faster investigation, and clearer
              response, while product pages show that the offering now spans license plate readers, AI video cameras,
              audio detection, Nova investigative search, and drone-as-first-responder workflows. That breadth matters
              because Flock does not monetize like a one-time hardware sale. Pricing, video, and LPR materials all
              emphasize annual bundled subscriptions that include hardware, software, installation, maintenance,
              upgrades, and support. The same pages also make clear that the company serves more than sworn police
              agencies: neighborhoods, businesses, schools, HOAs, and private security teams are all part of the stated
              customer base. In practice, the company overview is strongest on product architecture and weakest on unit
              economics. Public materials make the integrated cross-sell story legible, but they do not disclose gross
              margin, burn, retention, or contribution economics. For diligence purposes, the business is best
              understood as a late-stage, vertically integrated safety platform whose operating leverage still has to be
              proven with private financial evidence.
