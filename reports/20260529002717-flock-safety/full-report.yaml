      - number: '7.4'
        title: Partner, procurement, and financial-model dependency risk
        blocks:
          - type: paragraph
            body: >-
              Flock's revenue model has diversified, but not enough to remove public-sector dependence. Reuters' note
              that enterprise is about 30% of revenue is useful precisely because it implies the opposite: public-safety
              and public-sector demand still likely account for most of the business. That means procurement friction,
              city politics, cooperative purchasing mechanics, and state-level data-sharing rules matter not just as
              brand issues but as core revenue drivers. OMNIA and the CHP agreement prove that Flock has built real
              contracting infrastructure, but they also show how dependent the go-to-market engine is on public
              contracting pathways, policy compliance, and customer willingness to attach more modules over time.


              The model risk is that investors are being asked to underwrite a company priced as a scaled, durable
              platform while large pieces of the durability proof remain private. The 2025 financing round and ARR
              growth are well corroborated, yet public sources still do not disclose burn, cash, gross margin, NRR,
              churn, or top-customer concentration. That leaves the business exposed to narrative compression: if
              public-sector conversions slow, if cancellation pressure spreads, or if unit economics are materially
              weaker than the valuation implies, the downside can travel through growth, margins, and exit multiple at
              once. In that sense, procurement dependence and disclosure gaps are not separate risks; they compound each
              other.
