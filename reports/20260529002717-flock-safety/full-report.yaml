            body: >-
              The public margin story is directionally understandable even though the numbers are not. Flock's own pages
              show the company taking responsibility for installation, maintenance, upgrades, support, and in some cases
              offboarding and hardware removal. The new Smyrna plant adds more fixed-cost and working-capital exposure
              because it covers drone production, solar-panel assembly, and device refurbishment. That means Flock's
              cost stack is not just sensor hardware plus cloud hosting; it also includes field service, logistics,
              warranty-like upkeep, manufacturing operations, refurbishment, and potentially inventory risk if
              deployment plans outrun demand. Public comparable filings help frame what that can mean. Axon discloses a
              hybrid model of hardware, software subscriptions, professional services, and warranties, while Motorola
              shows how scaled public-safety vendors mix devices, software, installation, and managed services yet still
              need inventory buffers and face partial-funding or front-loaded-capex risk in government contracts. Rekor
              shows the smaller-scale version of the same problem: recurring-software ambitions paired with hardware
              exposure, renewal risk, and continuing capital needs. Those comps support the idea that Flock's model
              could mature into attractive margins as software and workflow products deepen, but they also caution that
              field-service intensity and manufacturing expansion can delay margin realization. Because Flock publishes
              no gross margin, product COGS, warranty reserve, or refurbishment cost, the margin path remains a thesis
