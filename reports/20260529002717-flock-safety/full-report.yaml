              - CV014
              - CV015
              - CV016
              - CV042
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV011
              - CV024
              - CV025
              - CV038
              - CV040
              - CV043
      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining work is concentrated rather than open-ended. First, management has to prove that the current
              price rests on more than topline growth by opening retention, margin, and payback data. Second, investors
              need the cap table and preference waterfall; without that, even a seemingly acceptable enterprise-value
              scenario can produce weak common-equity outcomes. Third, trust and governance diligence is not optional.
              The same public record that supports Flocks scale also shows federal oversight, privacy litigation,
              local-governance leakage, and some customer or city backlash. That means the easiest way to break the
              thesis is not necessarily competition alone. A confirmed multi-customer security event, binding
              restrictions on interstate or inter-agency data sharing, or a broader cancellation wave in important
              states would each undermine both revenue confidence and multiple support. The final recommendation
              therefore remains conditional on concrete diligence closure, not on another round of generic market
              enthusiasm.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV042
              - CV043
          - type: table
            tableRef: TV006
            claimRefs:
              - CV008
              - CV029
              - CV041
              - CV043
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The company is stronger than the price support
            body: >-
              Flocks scale, growth, and product breadth are real. The investment problem is not whether the company
              matters; it is whether new investors are being paid enough for unresolved economics and governance risk at
              the current price.
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV037
          - type: callout
            title: Trust risk is multiplicative, not additive
            body: >-
              Privacy and cybersecurity controversies do not just create legal cost. For Flock they can also slow
              growth, damage approvals, and compress multiples because the company sells a cross-jurisdiction network
              narrative.
            calloutType: insight
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: callout
            title: Track now; only buy on better price or better proof
            body: >-
              The path from track to buy is explicit: lower entry price, stronger private evidence on margin and
              retention, or downside-protective terms that offset the unresolved cap-table risk.
            calloutType: insight
            claimRefs:
              - CV029
              - CV037
              - CV040
              - CV041
              - CV043
          - type: callout
            title: Axon is the ceiling comp, not the base-case comp
            body: >-
              Axon is the only public anchor that plausibly justifies a premium platform multiple, but it already has
              broader scope, deeper disclosure, and public-market liquidity. That makes Axon an upper-bound narrative,
              not an easy default comp.
            calloutType: insight
            claimRefs:
              - CV017
