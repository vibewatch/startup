      - number: '6.4'
        title: Retention and durability
        blocks:
          - type: paragraph
            body: >-
              Durability is visible structurally, not metrically. Flock's pricing page describes an annual subscription
              that bundles installation, onboarding, maintenance, repairs, upgrades, and support, and says the company
              proactively reviews performance and renewal options before expiry. The same page also promises secure
              offboarding, hardware removal, and data transition if the customer chooses not to renew. The
              law-enforcement industry page reinforces the service model by stating that Flock handles maintenance,
              upgrades, and uptime monitoring under one subscription. That design should improve practical stickiness
              because the customer is buying a managed workflow and support layer, not just hardware that can be left in
              place without vendor involvement.


              Public contracts reinforce that the relationship is recurring, but they do not reveal actual renewal
              quality. The Oakland-posted CHP agreement has a 12-month base term, two optional one-year extensions, and
              renegotiation language for later renewals, which supports the idea that Flock's public-safety
              relationships are intended to recur. What remains missing is the investor-grade retention stack: no
              retained source discloses NRR, GRR, churn, gross logo retention, renewal rates by cohort, contract attach
              by product, or satisfaction scores comparable across segments. That forces the durability judgment to stay
              cautious. The public record supports recurring contract architecture and operational dependency, but not
              yet measured proof that customers renew, expand, and stay at a high rate across time.
            claimRefs:
              - CU036
