      - number: '8.2'
        title: Investment thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The pro-investment case is straightforward. Flock has real top-line scale, visible product expansion
              beyond basic ALPR, and a bundled annual-subscription model that appears more durable than a one-time
              hardware sale. The platform and trust materials also show a company trying to become a workflow layer
              across public safety rather than a single-point sensor vendor. Those factors justify a premium to
              commodity camera or lower-growth public comparables. The anti-thesis is just as important. The premium
              already embedded in the 2025 price is large, and public-market anchors are not forgiving: Motorola, Rekor,
              and SoundThinking trade far below Flocks disclosed floor multiple, while Axon offers a broader, liquid,
              already-public platform at a lower trailing-sales multiple than Flocks floor ARR multiple. At the same
              time, privacy, cybersecurity, and governance disputes have already moved into oversight letters,
              litigation, and municipal pushback. That combination leads to a price-sensitive recommendation of TRACK:
              the business can still compound into the round, but public evidence today does not justify calling the
              current price attractive without deeper private diligence or a better entry.
