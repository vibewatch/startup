  - id: FR003
    title: Dependency map
    type: dag
    summary: >-
      Flock's expansion thesis depends on many external actors staying aligned: agencies, procurement vehicles,
      regulators, cloud infrastructure, and a fast-scaling internal bench.
    claimRefs:
      - CR024
      - CR027
      - CR028
      - CR029
      - CR031
      - CR032
      - CR042
    data:
      nodes:
        - id: agencies
          label: Local agencies / customers
          description: Own data, permissions, and local policy choices.
        - id: network
          label: Shared network value
          description: Inter-jurisdiction access and lookup scale.
        - id: procurement
          label: Procurement vehicles
          description: OMNIA, contract offices, and public buying pathways.
        - id: regulators
          label: Courts / lawmakers / FAA
          description: Set legal and approval boundaries.
        - id: cloud
          label: Cloud / connectivity stack
          description: GovCloud, telecom, storage, and search availability.
        - id: manufacturing
          label: Manufacturing / field ops
          description: Plant, installation, maintenance, and support execution.
        - id: platform
          label: Expanded product stack
          description: LPR, video, audio, OS, DFR, and workflow software.
        - id: bench
          label: Executive / org bench
          description: Leadership depth needed to coordinate the whole system.
      edges:
        - id: d1
          source: agencies
          target: network
          label: Opt-in sharing creates or shrinks network effects
        - id: d2
