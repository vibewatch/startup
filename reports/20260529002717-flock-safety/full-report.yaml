      - number: '2.4'
        title: Drivers, constraints, and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              The category has real demand pull: staffing shortages, ORC, cross-jurisdiction investigations, and the
              ability to reuse existing cameras all support adoption. But the strongest market story also contains the
              strongest constraint story. Privacy and retention rules vary by jurisdiction, RTCC deployments require
              stakeholder management and documented operating procedures, and even community installs can require
              transportation-department approvals on public streets. Competition is not hypothetical either: Motorola,
              Leonardo, OpenALPR, Axon, and Rekor all frame overlapping offerings around modular deployment,
              interoperability, or roadway intelligence. The most material downside risk is that this is not just a
              procurement market but a trust market. EFF’s examples of cancellations and non-renewals show that backlash
              can turn privacy controversy into budget friction. For valuation work, that means Flock should be
              underwritten as a converging public-safety and physical-security operations platform with meaningful
              adjacency upside, but with adoption rates governed by governance quality and political tolerance as much
              as by product breadth.
