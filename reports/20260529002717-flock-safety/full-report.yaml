  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, substitutes, and likely entrants'
        blocks:
          - type: paragraph
            body: >-
              Flock Safety no longer competes only with standalone plate-reader vendors. Its own product pages show a
              broader operating layer that combines LPR, RTCC coordination, trust controls, and now DFR. That shifts the
              real alternative set. Direct peers still include Axon Fusus, Motorola Vigilant, Genetec AutoVu, Leonardo
              ELSAG, and Rekor/OpenALPR where agencies are explicitly buying ALPR and real-time operations tooling. But
              the deal set that matters in practice is wider: Verkada can attack camera, alerting, and compliance
              budgets from a cloud-video angle; Peregrine can win the interoperability layer by promising real-time data
              integration for police and emergency response; Skydio can turn DFR into a separate budget line or attach
              it to Axon ecosystems; and status quo agencies can keep legacy cameras and CAD/RMS while adding only the
              narrowest missing capability.


              That matters because Flock is strongest when the buyer wants one vendor to compress deployment, training,
              maintenance, and accountability into a single workflow. The company's bundle reduces coordination burden,
              but it also puts it up against incumbents with broader adjacent assets. Axon can sell RTCC around
              evidence, drones, and a growing real-time operations stack. Motorola can pull from cameras, call handling,
              and radio networks. Genetec and Leonardo remain relevant where agencies prefer incumbent-style ALPR and
              unified-security estates. Rekor/OpenALPR matters because it proves there is still a cheap, modular path
              for agencies willing to upgrade existing cameras instead of standardizing on a full national platform.
            claimRefs:
