  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Why it matters
      - Public proxy today
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - GAAP revenue and recognition policy
        - ARR and contract form do not reveal what is recognized upfront vs ratably
        - '>$300M ARR and annual subscription language'
        - Makes revenue quality and seasonality hard to underwrite precisely
        - Request audited financials, revenue-recognition memo, and deferred-revenue roll-forward
      - - Product and segment revenue mix
        - Cross-sell thesis depends on how much software, video, audio, and drones actually contribute
        - Enterprise ~30% of revenue; public product breadth is visible
        - Prevents clean valuation on software mix or hardware concentration
        - Request revenue by SKU family and customer segment for FY2024-FY2026
      - - Gross margin by product
        - Bundled contracts can hide low-margin service or hardware obligations
        - No public gross margin disclosure; comps only provide context
        - Blocks conviction on long-term profitability
        - Request product P&Ls, service gross margin, and warranty reserve history
      - - Cash, burn, and runway
        - Large fundraises can still coincide with short runway if capex and hiring are heavy
        - $275M round and >$950M cumulative funding
        - Cannot assess financing dependency or downside resilience
        - Request monthly cash bridge, capex plan, and board-approved budget
      - - Retention, NRR, and churn
        - Recurring contract form is only valuable if customers renew at attractive economics
        - Renewal mechanics visible in pricing FAQs and contracts, but no rates disclosed
        - Blocks revenue-quality underwriting
        - Request cohort renewal, gross retention, NRR, cancellation history, and downgrade rates
      - - CAC, payback, and sales productivity
        - Field sales plus turnkey deployment can be efficient or very expensive
        - Positive case-study ROI and continued hiring
        - Blocks GTM-efficiency judgment and margin forecasting
        - Request CAC/payback by segment, quota attainment, and pipeline-conversion data
      - - Customer concentration and budget exposure
        - Public-sector budget cycles and single large deployments can affect revenue durability
        - 4,800 agencies, nearly 1,000 businesses, enterprise ~30% of revenue
        - Concentration and grant dependence remain unknown
        - Request top-customer list, revenue concentration, and budget-source mapping
      - - Manufacturing utilization and working capital
        - New plant, refurbishment, and drone production can consume cash before margins scale
        - 97k-100k sq ft Georgia plant and $10M investment
        - Blocks capital-intensity and cash-conversion analysis
        - Request utilization, inventory turns, supplier terms, and refurbishment throughput
      - - Debt, leases, and other obligations
        - Off-balance-sheet or lease commitments can materially reduce usable runway
        - No public disclosure retained for Flock
        - Could change downside protection and capital needs
        - Request debt schedule, lease commitments, and any vendor-financing arrangements
    notes: >-
      These are the missing private metrics that still block a clean financial underwrite. Each gap maps to a specific
      request rather than a generic need-more-data placeholder.
