        - Generic CCTV, gate hardware, manual BOLO workflows
        - Police command, detectives, RTCC units / public-safety budget
        - This is the historical entry point and still the most legible core spend bucket.
      - - RTCC / RTIC orchestration
        - Video aggregation, CAD/RMS integrations, cross-agency collaboration, geospatial response tools
