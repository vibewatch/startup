      - number: '1.2'
        title: Founders, leadership, governance, and stakeholder visibility
        blocks:
          - type: paragraph
            body: >-
              The founding story is unusually clear. Flock says Garrett Langley, Matt Feury, and Paige Todd started the
              company in 2017 and joined Y Combinator’s S17 batch, and third-party profiles fill in the origin
              narrative: neighborhood break-ins pushed Langley toward a cheaper license-plate-reading system, Todd
              handled early market discovery, and Feury joined as the technical co-founder. Garrett Langley remains the
              dominant public executive voice across financing, manufacturing, and product positioning, which is helpful
              for founder-market-fit analysis but also highlights key-person dependence. Public governance disclosure is
              notably thinner than the company’s customer and funding storytelling. Flock has publicly named Jennifer
              Ceran as an independent director and audit chair and said James LaCamp was a newly installed CFO at that
              time; Forbes separately reported that Matrix partner Ilya Sukhar sits on the board. Even with those data
              points, the full board roster, observer rights, ownership percentages, and financing-control terms are not
              publicly available. The visible stakeholder map therefore supports who matters around the table, but not
              exactly how control, liquidation preference, or downside protection are allocated.
