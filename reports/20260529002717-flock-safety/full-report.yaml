  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Staffing shortages and data overload
        - Positive
        - Near-term
        - Push agencies toward tools that promise faster triage and more leverage per employee
        - Request RTCC staffing models, overtime trends, and operator productivity metrics by deployment stage.
      - - ORC and private-property crime
        - Positive
        - Near-term
        - Supports retail, logistics, HOA, and campus demand beyond classic police budgets
        - Gather vertical-specific case studies and loss-prevention ROI data, not only police solved stories.
      - - Reuse of existing cameras and infrastructure
        - Positive
        - Near-term
        - Reduces switching friction and makes phased rollouts easier for budget-constrained buyers
        - Ask what percent of deployments depend on third-party camera reuse versus greenfield hardware.
      - - Cross-agency and public-private sharing
        - Positive
        - Near to medium-term
        - Network effects can improve case value and make the platform stickier
        - Measure how often shared-network features drive renewals or multi-module expansion.
      - - Incumbent breadth and pricing-floor substitutes
        - Negative
        - Current
        - Motorola, Leonardo, OpenALPR, Rekor, and Axon all offer overlapping workflows or lower-cost entry points
        - Benchmark modular substitutes and identify where Flock wins on workflow, not just on hardware.
      - - Privacy, retention, and access regulation
        - Negative
        - Current and recurring
        - Jurisdiction-specific laws and SOP requirements can slow or shrink deployments
        - Obtain legal retention schedules, audit controls, and any product exceptions needed by state or local law.
      - - Procurement and stakeholder friction
        - Negative
        - Current and recurring
        - Board approvals, DOT permissions, city procurement, and public backlash can delay installations
        - Review sample procurement cycles and cancellation reasons by segment.
      - - Civil-liberties backlash and renewal risk
        - Negative
        - Medium-term
        - Political controversy can convert into non-renewals or prevented expansion
        - Track renewal cohorts in sensitive jurisdictions and correlate churn with policy controversy.
    notes: >-
      Drivers and constraints are listed at the market level; the key underwriting task is to map each one to
      segment-specific sales cycles, ACVs, and renewal risk rather than treating them as generic industry talking
      points.
