  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk stack
        blocks:
          - type: paragraph
            body: >-
              The risk ranking is driven by two questions: which failure modes can most directly impair contract
              renewals, procurement velocity, and valuation, and which ones remain only partially mitigated by the
              controls Flock publicly discloses. On that basis, the top tier is privacy and civil-liberties exposure,
              not because every allegation will become a judgment, but because the evidence already shows a multi-step
              transmission path from controversial searches to congressional scrutiny, lawsuits, municipal suspensions,
              and visible procurement backlash. In other words, this is no longer an abstract reputational debate. It is
              an operating risk that can change whether agencies expand, whether cities approve adjacent products, and
              what multiple investors are willing to pay for growth.


              The second tier is security and operational execution. Flock is now a much broader stack than fixed ALPR:
              video, PTZ, gunshot detection, OS, 911 intake, drones, and manufacturing all add delivery surfaces that
              can fail differently and under more public scrutiny. The third tier is model fragility. The 2025 financing
              round validates demand, but it also raises the bar: a business priced for continued hypergrowth and
              platform expansion has less room for regulatory drag, customer churn, or a well-publicized security
              incident. The registers below therefore treat likelihood, impact, mitigation maturity, and residual risk
              as linked rather than separate dimensions.
            claimRefs:
              - CR001
              - CR012
              - CR021
              - CR031
              - CR038
