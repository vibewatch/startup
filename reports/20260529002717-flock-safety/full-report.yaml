        title: Revenue model, pricing architecture, and visible mix
        blocks:
          - type: paragraph
            body: >-
              Public evidence makes Flock's monetization model much clearer than its full economics. The company does
              not market itself as a one-time hardware vendor. Official pricing and product pages consistently describe
              one contract, one invoice, and one annual subscription that bundles hardware, software, installation,
              maintenance, upgrades, and support. Procurement records then convert that marketing language into concrete
              price anchors. OMNIA's May 2026 price list shows annualized public-sector prices for Falcon LPR, Condor
              video, Raven audio detection, and multiple implementation-fee tiers, while the Whitestown order form shows
              a historical Falcon contract billed annually with separate installation fees and multi-year terms. Product
              pages also show that monetization is no longer limited to basic cameras: Flock now sells LPR, video,
              audio, Nova investigative software, and drone-related offerings, all tied together by FlockOS and service
              obligations. Revenue quality therefore looks structurally better than a pure hardware-reseller model
              because the contract form is recurring and the software layer is real. However, disclosure on mix is still
              incomplete. Reuters' estimate that enterprise customers are about 30% of revenue is useful, and
              Hypepotamus' count of nearly 1,000 businesses versus 4,800 agencies shows meaningful commercial reach, but
              public materials still do not disclose SKU-level revenue, attach rates, or revenue recognition policy.
