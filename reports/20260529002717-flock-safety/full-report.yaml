        title: Segmentation and customer-base mix
        blocks:
          - type: paragraph
            body: >-
              Flock's customer base is no longer just a law-enforcement logo wall, but public safety still appears to be
              the economic center of gravity. The freshest breadth signal on the company's own site is the customer
              index, which advertises more than 5,000 law-enforcement agencies, more than 6,000 communities, and more
              than 1,000 businesses. Reuters' March 2025 financing coverage is directionally consistent but more
              conservative, reporting over 4,800 law-enforcement agencies, nearly 1,000 businesses, and roughly 30% of
              revenue from enterprise accounts. Read together, those disclosures imply a business with meaningful
              private-sector diversification but one still anchored by agency budgets and public-safety workflows rather
              than by pure enterprise SaaS demand.


              Segment breadth is also visible in the operating surfaces Flock now markets. The law-enforcement page
              explicitly positions public-private data sharing among agencies, schools, businesses, and HOAs; the retail
              page centers organized-retail-crime and cross-location investigations; the healthcare page focuses on
              parking-lot safety and campus access; and the transportation page plus MS2 partnership expand the stack
              into DOT traffic analytics. That breadth matters strategically because it gives Flock more ways to reuse
              the same camera, search, alerting, and workflow infrastructure across adjacent buyers. The caveat is that
              the published counts are definitional rather than audited: communities may overlap with agencies and
              private owners, and the public record still does not disclose exact account splits, revenue by vertical
              beyond Reuters' enterprise comment, or how many of these accounts are multi-product versus single-camera
