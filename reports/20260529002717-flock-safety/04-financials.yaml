    {
      "id": "capital-adequacy-and-underwriting-blockers",
      "title": "Capital adequacy, financing dependency, and diligence blockers",
      "body": "Headline capital support is strong, but underwriting visibility is still incomplete. Flock's 2025 financing package is well corroborated: $275 million at a $7.5 billion valuation, more than $950 million in cumulative funding, and more than $300 million of ARR growing around 70% year over year. Official and independent coverage also agree that the money is being directed toward product innovation, research and development, U.S.-based manufacturing, and expanded drone capabilities, with hiring continuing across engineering, manufacturing, and sales. That reduces near-term solvency concern in a qualitative sense. But public evidence stops before the questions that actually matter for underwriting: cash on hand, monthly burn, capex budget, runway, debt, retention, and segment-level margins are all missing. Reuters' note that Flock added a CFO as it prepares for a possible eventual public listing helps explain why disclosure may improve later, but it does not solve today's diligence gap. The adverse record is also financially relevant. TechCrunch reports multi-state vandalism and dozens of cities rejecting Flock cameras, while peer filings remind investors that renewal rates, government-customer funding, and contract-cancellation dynamics can all weaken otherwise attractive recurring models. Financial verdict: revenue quality looks better than headline surveillance-tech skeptics might assume because contracts are recurring and multi-product, but margin path and capital intensity are still too opaque for a clean underwrite without private data-room evidence.",
