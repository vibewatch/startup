  productSummary: >
    Flock sells a workflow platform rather than a single camera SKU. The current stack spans LPR
    variants, fixed and PTZ video, audio detection, FlockOS RTCC software, Flock911, Nova,
    FreeForm, a national data-sharing network, and drone-as-first-responder workflows.
  customerFocus: >
    Core buyers are law-enforcement and public-safety agencies, with growing but still secondary
    demand from businesses, HOAs, schools, hospitals, utilities, transportation, and other
    community-security operators.
  businessModel: >
    The model is primarily annual bundled subscriptions that combine hardware, software,
    installation, maintenance, upgrades, support, and optional add-on services, with cross-sell
    across LPR, video, audio, software, and drones shaping expansion.
  stage: "Late-stage private / Series H"
  fundingStatus: >
