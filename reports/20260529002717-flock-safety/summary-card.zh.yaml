summary:
  headline: |
    Flock Safety 是一家真正跑出规模的公共安全平台，但 2025 年融资估值已经预设了利润率与信任都能兑现的乐观结果，而公开记录还没有证明这一点，因此当前更适合观察，而不是买入。
