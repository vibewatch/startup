    title: Customer journey from listing to expansion
    type: journey-map
    summary: "Carousell's customer journey links low-friction supply creation to discovery, trust-enabled transaction, and higher-value or merchant expansion."
    data:
      nodes:
        - id: discover
          label: Discover
          title: Buyer or seller enters a local category
          details: "Fashion, electronics, furniture, luxury, autos, and services create multiple entry points."
        - id: list
          label: List
          title: Seller creates a listing
          details: "Photo or video AI can populate title, description, category, price, and condition."
        - id: chat
          label: Chat
          title: Buyer and seller negotiate in-app
          details: "Messaging, ratings, and moderation keep the conversation closer to the transaction."
        - id: trust
          label: Trust
          title: Buyer protection and certified categories reduce friction
          details: "Escrow or buyer protection and certified phones, bags, watches, and cars are available in selected markets."
        - id: fulfill
          label: Fulfill
          title: Meetup, drop-off, pickup, or partner logistics
          details: "Market-specific drop-off networks and delivery partnerships support unique and bulky goods."
        - id: expand
          label: Expand
          title: Merchant tools and high-value verticals deepen usage
          details: "Professional sellers, autos, luxury, services, and paid visibility create expansion paths."
    claimRefs: [CU001, CU003, CU009, CU011, CU012, CU015]

callouts:
  - calloutType: strength
    title: Broad local-market utility
    body: "Carousell combines casual peer-to-peer selling with merchant and high-value vertical use cases, giving customers more than one reason to return."
    claimRefs: [CU001, CU004, CU007]
  - calloutType: risk
    title: Retention is not publicly proven
    body: "Public scale and satisfaction signals do not substitute for cohorts, repeat purchase, churn, NRR, GRR, or customer concentration data."
    claimRefs: [CU016]
  - calloutType: recommendation
    title: Request cohort and concentration data
    body: "Diligence should request seller and buyer cohorts by market and category, paid-merchant retention, top-customer concentration, and the denominator behind reported adoption improvements."
    claimRefs: [CU016]

