    title: Customer segmentation table
    columns: [Segment, Buyer/user/payer, Primary use case, Scale or value signal, Diligence gap]
    rows:
      - [Casual individual sellers, "Users listing personal goods", "Declutter and earn side income", "Mobile-first listing and chat; public sources describe broad community use", "Active-seller frequency and seller-to-sale conversion are undisclosed"]
      - [Bargain and secondhand buyers, "Consumers purchasing from other users", "Find affordable, local, unique, or pre-owned goods", "Millions of listings across fashion, electronics, furniture, luxury, and other categories", "Repeat-purchase rate and completed-transaction denominator are undisclosed"]
      - [Professional merchants and resellers, "Small businesses, dealers, and power sellers", "Acquire local demand and pay for visibility or business tools", "Named Caroupreneur merchant and SME onboarding examples", "Paid-seller count, ARPU, and retention are undisclosed"]
      - [High-value vertical customers, "Auto dealers, luxury sellers, property and service providers", "Generate leads or transact in higher-value categories", "Autos historically reported as one-third of group revenue; luxury investment expanded", "Vertical-level margin, lead conversion, and concentration are undisclosed"]
      - [Platform partners and service providers, "Logistics, payment, cloud, and chat providers", "Enable delivery, trust, messaging, and marketplace infrastructure", "Drop-off networks, escrow/buyer protection, Sendbird, and Google Cloud integrations are documented", "Partner dependency, economics, and substitution costs are undisclosed"]
    notes: "Sources combine current product documentation, historical reporting, and partner case studies; scale signals are not directly comparable and null gaps mean no public denominator was found."
    claimRefs: [CU001, CU003, CU004, CU007, CU008, CU011, CU012]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source basis, Confidence, Implication, Missing denominator]
    rows:
      - [Listings, "More than 250 million", "2020", "Forbes description of Carousell since launch", "medium", "Indicates accumulated marketplace inventory and supply breadth", "Current active listings and sell-through rate"]
      - [Users, "Tens of millions", "2020", "Forbes report", "medium", "Supports broad regional reach", "Monthly active users, geography split, and repeat rate"]
      - [Monthly active users, "Tens of millions across seven markets", "Current partner case study", "Google Cloud customer case", "high", "Suggests continuing regional scale", "Market-level MAU, retention, and definition of active"]
      - [App rating, "4.7/5 from 3.1K ratings", "Current App Store listing", "Apple App Store", "high", "Provides a directional product-satisfaction signal", "Review representativeness, recency mix, and transaction linkage"]
      - [Listing workflow, "Median listing time under two minutes; items listed +20%", "Google case-study period", "Google Cloud customer case", "high", "Suggests lower seller friction can expand supply", "Baseline cohort, causal design, and persistence"]
    notes: "Values retain each source's metric and period; user counts, ratings, and listing velocity are different populations and must not be read as a conversion funnel. The Google figures are partner case-study claims, not independent audits."
    claimRefs: [CU002, CU004, CU005, CU013]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or cohort, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly documented named customer, merchant, community, and category examples available in assigned sources through the 2026-10-25 run date"
    rows:
      - [mybrogarage / Ng Han Xiang, Used-car merchant, "Carousell Autos inquiries for a fleet of up to 10 cars", Production merchant use, "Reported inquiry conversion about 100% higher and operations recovered within months", "Single merchant testimony; no controlled baseline or current result"]
      - [Singapore F&B and hawker businesses, Local SMEs, "#SupportLocal free-listing category and online ordering visibility", Production campaign, "More than 2,500 businesses were onboarded in the cited campaign", "Campaign-era onboarding is not recurring customer retention"]
      - [LuxLexicon, Luxury reseller and authenticated consignment platform, "Acquisition and integration with Carousell luxury recommerce", Production acquisition, "High-end bag listings reportedly increased 71% per month over the prior two years; deal up to S$2 million in cash and shares", "Reported by a connected source; no post-acquisition revenue or retention disclosure"]
    notes: "Enumeration is partial because public materials do not disclose a complete customer roster; named proof is included only when a source identifies a concrete use case or deployment."
    claimRefs: [CU007, CU011, CU015]

figures:
