artifact: customers
slug: carousell
runDate: 2026-10-25
company:
  name: Carousell
chapter:
  number: 6
  title: Customers
  summary: Carousell serves a broad, multi-sided recommerce community spanning casual sellers, professional merchants, buyers, and high-value vertical customers. Public evidence supports meaningful usage, named merchant outcomes, and expanding trust and logistics surfaces, but retention, cohort economics, and current customer concentration remain undisclosed.
sections:
  - id: customer-segments
    title: Customer segments and value exchange
    body: >-
      Carousell's customer base is a two-sided local marketplace rather than a single
      enterprise buyer. Individual sellers use mobile listing, chat, ratings, and local
      delivery to turn unused goods into cash; buyers seek lower-priced, unique, or
      nearby inventory; and merchants use storefront and visibility tools to reach
      demand without building a separate commerce stack. The same product supports
      fashion, electronics, furniture, luxury, autos, and home services, so the
      economic value of a customer varies materially by category. Public evidence
      identifies the roles and use cases, but does not disclose segment-level revenue,
      active-buyer frequency, or seller conversion denominators.
    claimRefs: [CU001, CU003, CU004, CU005, CU006]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-usage
    title: Adoption surfaces and operating scale
    body: >-
      Adoption is visible through several different lenses that should not be treated
      as interchangeable. Historical reporting cited more than 250 million listings
      and tens of millions of users, while a current partner case describes tens of
      millions of monthly active users across seven markets. The App Store listing
      provides a current product surface and a 4.7/5 rating from 3.1K ratings, but
      ratings are not retention or transaction completion. Google reports that its AI
      listing workflow reduced median listing time to under two minutes and contributed
      to a 20% increase in items listed; this is a company case-study result, not an
      independently audited cohort measurement.
    claimRefs: [CU002, CU004, CU005, CU013, CU014]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named customer and partner proof
    body: >-
      Named proof is strongest where a customer or merchant describes a concrete use
      case rather than where Carousell displays a logo. The Straits Times profile
      gives a named used-car merchant, a stated fleet size, and a reported improvement
      in inquiry conversion after the circuit breaker. Carousell's SME and community
      programmes also provide examples of merchant onboarding and demand generation,
      although these are campaign-level outcomes rather than recurring-revenue proof.
      The LuxLexicon acquisition supplies a named specialist capability in luxury
      resale and a category-growth signal, but the purchase price and listing growth
      were reported by sources connected to the transaction and do not establish
      retention.
    claimRefs: [CU007, CU008, CU011, CU015]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability, expansion, and unresolved concentration
    body: >-
      Durability depends on whether Carousell can convert episodic decluttering into
      repeat marketplace activity and paid merchant usage. Localization, in-app chat,
      escrow or buyer protection in selected markets, certified categories, and
      market-specific logistics reduce friction, while auto, luxury, and recommerce
      categories create expansion paths. However, public sources do not provide NRR,
      GRR, churn, repeat-purchase cohorts, customer concentration, CAC payback, or
      category-level contribution margins. Trust and safety also remains a structural
      customer risk: the platform must detect fraud and off-platform behavior without
      making casual sellers or buyers abandon the marketplace. These are diligence
      gaps, not evidence that retention is weak.
    claimRefs: [CU009, CU010, CU012, CU014, CU016]

tables:
