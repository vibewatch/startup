      - ["In-app buyer-seller chat", "Supported", "Unknown", "Unknown", "Retaining chat can improve trust visibility; comparative completion rates are unknown"]
      - ["AI-assisted listing", "Supported; under two minutes median listing time in Google case", "Unknown", "Carousell auto capability described", "Speed may increase supply, but quality and conversion comparisons are not public"]
      - ["Certified or inspected inventory", "Supported in selected categories", "Unknown", "Automotive specialists may provide category assurance", "Coverage and unit economics by category are not disclosed"]
      - ["Integrated delivery or protected checkout", "Supported in selected markets", "Likely core incumbent capability; not evidenced here", "Potentially category-specific", "Carousell can reduce transaction friction but geographic coverage matters"]
      - ["Seller monetization", "Coins, bumps, seller tools, and subscriptions described", "Unknown", "Unknown", "Low entry friction supports multi-homing; realized pricing and retention are gaps"]
      - ["Regional localization", "Local teams, language, and content adaptation are described", "Unknown", "Unknown", "Specialists may localize faster in one vertical"]
      - ["Trust and safety", "Chat moderation, fraud analysis, ratings, certification, and protection are described", "Unknown", "Automotive quality assurance may be stronger in-category", "Trust remains a barrier and comparable rates are unavailable"]
      - ["Supply liquidity", "Tens of millions of users and billions of interactions are company/partner reported", "Unknown", "Category-specific liquidity is possible", "Measure active sellers, buyer conversion, and repeat transactions"]
      - ["Data and AI", "AI listing, fraud, translation, and data workflows are described", "Unknown", "Unknown", "Incremental conversion and fraud reduction net of cost are unproven"]
      - ["Physical and multichannel recommerce", "29 stores and selected-business GMV uplift are company-reported", "Unknown", "Specialists may own high-value categories", "Store cohort contribution margin and payback are unavailable"]
    notes: Cells marked Unknown are not negative findings; the assigned pool did not provide comparable public evidence for those competitors.
    claimRefs: [CP005, CP006, CP009, CP010, CP011]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Offer or workflow, Published price or model, Included capability, Discount or unknown, Competitive implication]
    rows:
      - ["Basic marketplace listing", "Free entry described in freemium case", "Listing and buyer-seller discovery", "Realized monetization unknown", "Low acquisition friction and easy multi-homing"]
      - ["Carousell Coins", "App Store in-app purchases include $2.99, $3.99, $4.99, $6.99, and $12.99 options", "Paid listing attention tools", "Currency and package economics are not independently explained", "Paid attention tools create an upsell path"]
      - ["Three-day bump", "App Store lists $2.99", "Temporary listing promotion", "Conversion and seller ROI unknown", "Tests willingness to pay for visibility"]
      - ["Professional seller subscription", "SMU case describes subscription services for professional sellers", "Visibility and promotion for property or professional inventory", "Current plans and realized price unknown", "Potentially higher-value recurring revenue"]
      - ["Certified / direct sale / protection", "Product listing describes selected-category services", "Inspection, direct selling, delivery, or escrow-protected protection depending on market", "Coverage and fees unknown", "Can raise trust and monetization but adds operational complexity"]
    notes: App Store figures are listed in-app purchase prices, not realized revenue or take rate; other rows describe packaging models without public current price.
    claimRefs: [CP009, CP010, CP011, CP012]
