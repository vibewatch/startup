      - ["Internal build / offline sale", "Substitute or status quo", "Sellers with trusted local networks", "No platform fee and direct control over buyer relationship", "Existing relationships and zero migration effort", "Lower discoverability, safety tooling, and measurement"]
    notes: Source-backed illustrative set, not an exhaustive census; competitor scale is reported only where the assigned sources provide it, and null comparative economics are intentional evidence gaps.
    claimRefs: [CP001, CP002, CP003, CP004]
