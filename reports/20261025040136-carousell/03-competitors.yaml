        - {label: Facebook Marketplace, x: 9, y: 4, note: "Broad social distribution; comparative trust and completion evidence not retained"}
        - {label: Shopee / Lazada, x: 9, y: 7, note: "Broad commerce incumbents; peer-to-peer comparability not established"}
        - {label: Carsome / Carro, x: 3, y: 9, note: "Automotive specialists with category focus and quality-assurance potential"}
        - {label: Internal or offline sale, x: 2, y: 5, note: "Narrow reach but direct relationship and control"}
        - {label: OLX Group, x: 7, y: 5, note: "Classifieds peer; current comparative scope and trust evidence unknown"}
    approximationNotes: Coordinates are evidence-backed ordinal judgments from the assigned sources, not measured market-share or performance data.
    claimRefs: [CP001, CP003, CP005, CP006, CP016]
