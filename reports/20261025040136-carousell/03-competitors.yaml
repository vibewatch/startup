company:
  name: Carousell
chapter:
  number: 3
  title: Competitors
  summary: Carousell competes as a regional, community-led recommerce marketplace rather than a pure classifieds utility. Its defensibility is strongest where localized liquidity, trust controls, and transaction services compound, but automotive specialists, horizontal platforms, and internal alternatives can attack individual categories or workflows.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The relevant competitive set is broader than named resale apps. Carousell's
      own product surface spans fashion, luxury, furniture, electronics, cars,
      collectibles, home services, integrated delivery, escrow-protected buyer
      protection, and direct selling to Carousell in selected markets. That creates
      direct overlap with peer-to-peer classifieds and recommerce platforms, but
      also exposes the company to category specialists and generalist commerce
      platforms with stronger logistics or checkout. The 2020 SMU case describes
      Facebook Marketplace as a new entrant contesting the classified-platform
      business, while KrASIA identifies Carsome and Carro as strong used-car
      players. The practical buyer choice is therefore category-specific: a seller
      can list on Carousell, cross-list to another marketplace, use a specialist
      dealer, or keep the item offline. Carousell's regional presence and local
      teams help it compete where language, trust, and local transaction norms
      matter, but do not remove the need to win each vertical.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capabilities
    title: Capability, distribution, and trust comparison
    body: >-
      Carousell's differentiation is a bundle rather than a single feature. Its
      app listing flow, buyer-seller chat, ratings, localized market operations,
      certified categories, delivery, and buyer protection address the friction
      between discovery and completed trade. The Google customer story reports
      that Gemini reduced median listing time to less than two minutes and
      increased items listed per seller by 20%; these are company/partner-reported
      operating outcomes, not independent benchmarks. Sendbird's customer case
      shows why retaining communication in-app matters: off-platform messaging
      fragmented the experience and reduced visibility into failed transactions
      and unsafe behavior. This supports a credible trust-and-conversion thesis,
      but also reveals dependency on third-party infrastructure and the ongoing
      cost of moderation. Competitors can match individual features; the harder
      question is whether they can match local liquidity and trusted completion
      rates simultaneously.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: economics
    title: Pricing, packaging, and switching costs
    body: >-
      The observable monetization model is freemium and attention-based: the SMU
      case describes paid visibility services for used-goods sellers and
      subscriptions for professional sellers, while the App Store listing shows
      Carousell Coins and a paid three-day bump. This supports low-friction
      entry, but it also means sellers can multi-home and compare reach before
      paying. Carousell's direct-sale, certified, delivery, and protection
      services can deepen monetization beyond listing promotion, especially in
      higher-value categories, yet public evidence does not disclose realized
      take rates, seller retention, or category-level contribution margins.
      Switching costs therefore sit mainly in accumulated reputation, listing
      inventory, buyer conversations, and local liquidity rather than contractual
      lock-in. A seller with a differentiated audience or inventory can still
      cross-list, and a buyer can move to Facebook Marketplace, Shopee, Lazada,
      or a specialist auto platform when price, trust, or fulfillment is better.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: durability
    title: Moat durability and displacement risk
    body: >-
      The moat case is conditional. Carousell has operated across seven markets,
      built a decade of buyer-seller behavior data, and is adding AI to listing,
      fraud detection, translation, and discovery. Its FY25 announcement says
      recommerce revenue grew 40% year on year, represented 45% of revenue, and
      that 29 physical stores contributed to more than 20% GMV uplift in selected
      businesses. Those claims indicate strategic movement from classifieds toward
      trusted, transaction-led recommerce, but they are not proof that the model
      is insulated from competition. KrASIA reports that trust remained the
      biggest barrier in automotive commerce and that competition was expected
      to intensify. The most material displacement risks are a specialist winning
      a high-value vertical, a horizontal platform subsidizing distribution, or
      fraud and moderation costs rising faster than monetization. FY26 execution
      should be judged on repeat usage, completed transactions, take rate, and
      category contribution rather than listing volume alone.
    claimRefs: [CP013, CP014, CP015, CP016]
callouts:
  - calloutType: strength
    title: Regional liquidity plus trust tooling
    body: Carousell's strongest advantage is the combination of localized marketplace liquidity and controls that keep discovery, communication, and selected transactions inside one workflow.
    claimRefs: [CP005, CP006, CP013]
  - calloutType: risk
    title: Specialists can win the valuable slices
    body: Automotive and other high-value categories attract focused competitors, while horizontal platforms can pressure acquisition and seller economics; public category-level retention and contribution data remain unavailable.
    claimRefs: [CP003, CP012, CP016]
