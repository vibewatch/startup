company:
  name: Carousell
chapter:
  number: 8
  title: Valuation
  summary: >-
    Carousell has a credible regional marketplace franchise and several monetisation paths, but
    the last supportable company valuation in the retained evidence is the historical $1.1B mark
    from 2021. A track recommendation is appropriate until investors can verify a current price,
    audited financials, unit economics, and the preference stack.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The investable thesis is local marketplace density paired with paid visibility,
      professional-seller subscriptions, and higher-value vertical services rather than a
      generic software multiple. Singapore Management University documents the evolution from
      a mobile-first classifieds community into paid premium services and subscriptions for
      professional sellers, while Carousell's own survey evidence points to broad secondhand
      adoption across eight Asian markets. The anti-thesis is substantial: users can multi-home,
      fraud and moderation are costly, and the available public record does not disclose the
      current operating data needed to test whether liquidity converts into durable margin.
      Supplier-reported chat performance is useful product evidence, but it is not independent
      proof of company-wide transaction economics.
    claimRefs: [CV001, CV002, CV003, CV004, CV011]
    tableRefs: [TV001, TV002]
  - id: price-and-comparables
    title: Price discipline and comparable signals
    body: >-
      The retained evidence consistently places Carousell's $1.1B valuation in the September
      2021 financing; it does not establish a current primary or secondary clearing price.
      Consequently, neither an entry multiple nor a numeric Carousell valuation range is
      supportable from public evidence. Comparator dispersion reinforces the need for
      business-model-specific underwriting: Sacra estimates Back Market's 2024 revenue at
      $415M and an approximately 13x revenue multiple, whereas the retrieved October 2024
      ThredUp page reports a 0.28 price-to-sales ratio. These are contextual observations, not
      independent benchmarks for Carousell, because category mix, geography, growth,
      profitability, and transaction structure differ.
    claimRefs: [CV005, CV006, CV007, CV008]
  - id: scenarios-and-decision
    title: Scenarios and decision
    body: >-
      The base case is continued private compounding with a track recommendation: engage in
      diligence, but do not convert the 2021 mark into a present buy price. The bull case
      requires recurring professional-seller or vertical revenue, durable marketplace
      liquidity, and contribution-margin evidence sufficient to support a premium marketplace
      multiple. The bear case is a valuation reset if multi-homing, competition, fraud, or
      moderation costs prevent operating leverage. Because current Carousell revenue, EBITDA,
      cash flow, dilution, and price are not established by retained public evidence, every
      scenario leaves the valuation range unquantified and uses operating milestones rather
      than false precision.
    claimRefs: [CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: exit-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Vinted's April 2026 secondary transaction shows the profile that can attract institutional
      liquidity: an €8B equity valuation alongside reported 2025 GMV of €10.8B, revenue of
      €1.1B, and net profit of €62M. That transaction is a comparator signal, not a transferable
      Carousell valuation, and Vinted raised no new primary capital in it. Carousell could pursue
      a future listing, strategic sale, or continued private compounding, but a premium exit
      requires audited reporting, segment economics, governance, and a credible margin narrative.
      The final diligence gate is a current security price and terms, audited financials, cohort
      retention, paid-seller conversion, fraud-loss trends, vertical contribution margins, debt,
      and a fully diluted preference waterfall.
    claimRefs: [CV013, CV014, CV015, CV012]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, track, "Proceed to diligence, but do not underwrite an investment without current price and operating evidence."]
      - [Confidence, medium, "Historical financing and business-model evidence are usable; current valuation and financial disclosure remain incomplete."]
      - [Risk rating, high, "Trust costs, multi-homing, competitive pressure, and private-company opacity remain material."]
      - [Valuation stance, unknown, "The $1.1B mark is historical and cannot establish a current fair-value range."]
    notes: "Qualitative investment judgment based on the retained public evidence; unknown means no supportable current Carousell valuation range, not zero value."
    claimRefs: [CV005, CV006, CV009, CV011, CV012]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - [Local marketplace density, "Mobile-first community and broad regional marketplace presence", "Current active-buyer, active-seller, liquidity, and repeat-use cohorts."]
      - [Professional monetisation, "Paid listing visibility and subscriptions for professional sellers", "Paid-seller penetration, retention, ARPU, and contribution margin."]
      - [Secondhand demand, "Company survey of 3,029 users across eight markets reported 72% had bought secondhand", "Independent, current demand and transaction-frequency evidence by market."]
      - [Trust infrastructure, "Supplier case study reports faster in-app transaction communication", "Audited fraud losses, support costs, and dispute-resolution outcomes."]
      - [Historical investor validation, "$100M financing valued Carousell at $1.1B in 2021", "A current primary or secondary transaction with disclosed security terms."]
      - [Disclosure and multi-homing risk, "Current economics remain private and sellers can use competing venues", "Audited accounts, retention, switching-cost, debt, and preference evidence."]
    notes: "Signals have different issuers and vintages; survey and supplier-case-study metrics are company- or partner-sourced and are not independently verified operating results."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV011, CV012]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Paid-seller and vertical revenue becomes recurring; local liquidity persists; trust costs scale efficiently.", "Premium marketplace multiple could become supportable, but the current public record cannot quantify a Carousell range or target return.", "Low-to-medium pending private operating proof.", "Cohort or contribution-margin evidence fails to show operating leverage."]
      - [Base, "Monetisation improves gradually while Carousell continues private compounding without a public price.", "Track and preserve entry discipline; require a disclosed security price, audited financials, and ownership terms before calculating returns.", "Medium because it requires the fewest unsupported assumptions.", "A new financing prices below the 2021 mark or monetisation remains opaque."]
      - [Bear, "Multi-homing, competition, fraud, and moderation costs constrain revenue quality and margins.", "Multiple compression or a down-round is possible, but the magnitude is unquantified without current financial and capital-structure data.", "Medium as a risk case, not a forecast.", "Rising trust losses, weak paid conversion, declining liquidity, or adverse preference terms."]
    notes: "Scenarios are decision cases rather than forecasts. Numeric valuation and return ranges are deliberately left unsupported because current Carousell price, revenue, margin, cash flow, and security terms are not public in the retained evidence."
    claimRefs: [CV006, CV009, CV010, CV011, CV012]
