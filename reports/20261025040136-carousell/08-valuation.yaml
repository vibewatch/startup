callouts:
  - calloutType: recommendation
    title: Track; do not price from the 2021 anchor
    body: >-
      Carousell merits investor diligence, but the public evidence does not establish a current
      security price or the operating denominator needed for a defensible valuation multiple.
    claimRefs: [CV005, CV006, CV009]
  - calloutType: risk
    title: Common-share value may differ from headline equity value
    body: >-
      A fully diluted cap table, debt schedule, liquidation preferences, and exit waterfall are
      necessary before translating any future headline valuation into investor returns.
    claimRefs: [CV012]
