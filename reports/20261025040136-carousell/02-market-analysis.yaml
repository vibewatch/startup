company:
  name: Carousell
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Carousell operates in the overlap between Southeast Asian online classifieds, recommerce, and
    selected high-value commerce categories. The addressable context is large and growing, but
    public evidence supports a constrained market thesis rather than a company-specific SAM or
    SOM: broad e-commerce estimates include categories and platforms outside Carousell's core,
    while trust, localization, and transaction economics determine how much spend is reachable.
sections:
  - id: market-boundary
    title: Market boundary and adoption logic
    body: >-
      The relevant market is not all digital retail. Carousell's own fact sheet describes two
      linked models: multi-category classifieds that let users buy and sell secondhand directly,
      and an omnichannel recommerce business that adds consigning, trusted partners, and physical
      retail. The category boundary therefore includes peer-to-peer listings, professional
      listings, recommerce services, and selected high-value verticals such as cars, luxury,
      mobile phones, fashion, home and living, property, and services. It excludes first-party
      general merchandise retail, food delivery, and payment value that does not pass through
      Carousell's marketplace. The buyer value proposition is affordability, discovery, and
      convenience; the seller value proposition is monetizing unused goods or acquiring demand.
      In practice, the substitute set includes new-item e-commerce, offline classifieds, social
      selling, specialist vertical marketplaces, and simply retaining or giving away an item.
      This boundary matters because a regional e-commerce headline is an upper context, not
      Carousell's own serviceable market.
    claimRefs: [CM001, CM002, CM006, CM008, CM010]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses and what they do not prove
    body: >-
      Two third-party lenses quantify the surrounding market but use different definitions and
      methodologies. Statista's current topic page reports an e-commerce market value of
      US$181 billion for Southeast Asia and separately lists a US$263 billion internet-economy
      figure; its page also notes that its statistics have different update cycles and may not be
      complete. UnivDatos reports US$201.92 billion for Southeast Asia e-commerce in 2024 and a
      forecast CAGR of 21.13% for 2025–2033, segmented by type, payment method, and country.
      These figures are not interchangeable: one is a current topic-page statistic with access
      limitations, while the other is a paid-market-study estimate whose methodology combines
      secondary research, expert interviews, top-down and bottom-up approaches, and triangulation.
      A narrower recommerce lens is supported by the Carousell Recommerce Index summary reported
      by eTailAsia: 72% of 3,029 respondents across eight markets had purchased secondhand before.
      That is a survey incidence metric, not a GMV or revenue estimate. The evidence therefore
      supports a large and growing context plus meaningful secondhand adoption, but not a precise
      Carousell TAM, SAM, or SOM. The missing bridge is category-level GMV, take rate, active
      transacting users, and country-level reach.
    claimRefs: [CM003, CM004, CM007, CM014, CM016, CM017, CM018]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, budget owners, and adoption constraints
    body: >-
      The demand system has several distinct budget owners. Individuals are both users and
      payers for low- and mid-value secondhand goods; professional sellers, agents, merchants,
      and dealers are the economic buyers for visibility, subscriptions, or transaction tools;
      and category partners or advertisers fund high-intent commercial placements. The Singapore
      Management University case records Carousell's freemium model, paid visibility services
      for used-goods sellers, and subscriptions for professional sellers such as real-estate
      agents. Growth drivers include mobile penetration, local payment rails, affordability,
      sustainability preferences, and the shift from new-item purchase to resale. eTailAsia's
      eight-market survey provides evidence of secondhand familiarity, while the Statista page
      highlights social commerce and major platform competition as structural forces. Constraints
      are equally material: users may leave the app for messaging, trust and fraud concerns can
      slow conversion, localization raises operating complexity, and high-value categories need
      verification, delivery, or financing. Sendbird's customer case says off-platform
      conversations reduced Carousell's visibility into failed transactions and unacceptable
      behavior; Carousell's official fact sheet describes buyer protection, tracked delivery,
      verification, and fraud prevention as trust enablers. Adoption timing and valuation
      therefore depend on monetizing intent without degrading liquidity or trust.
    claimRefs: [CM006, CM007, CM011, CM012, CM015]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: The investable market is narrower than regional e-commerce
    body: The regional e-commerce estimates establish a large context, but Carousell's reachable market must be underwritten from recommerce incidence, category GMV, monetizable seller demand, and country-level liquidity rather than from a broad e-commerce total.
    claimRefs: [CM003, CM004, CM007, CM016, CM017, CM018]
  - calloutType: risk
    title: Trust is both a conversion lever and a cost center
    body: Moving communication, payments, verification, delivery, and moderation into a marketplace can improve transaction completion and safety, but the public evidence does not quantify the resulting contribution margin or payback.
    claimRefs: [CM011, CM012, CM015]
