  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: Current Carousell GMV by category and country, monetized transaction volume, take rate, and active transacting users.
      whyItMatters: Without these denominators, broad regional e-commerce estimates cannot be translated into Carousell's SAM, SOM, or unit-economic opportunity.
      diligencePath: Request a current management market model reconciled to category GMV, transacting users, take rate, and country-level liquidity.
      relatedQuestionRefs: [QM009]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: buyer-segmentation
      missingEvidence: Public evidence on budget ownership, conversion, repeat purchase, and paid-seller retention by segment.
      whyItMatters: Segment incidence and stated demand do not establish which buyers create durable, profitable marketplace liquidity.
      diligencePath: Obtain cohort-level seller and buyer funnels, paid-product attach rates, repeat rates, and contribution margin by category.
      relatedQuestionRefs: [QM004, QM005]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: minor
      topic: market-size
      missingEvidence: A reconciled explanation for the different definitions and values in the Statista and UnivDatos regional e-commerce estimates.
      whyItMatters: Treating unlike market scopes as a single TAM would overstate precision and could distort valuation benchmarks.
      diligencePath: Compare source definitions, included channels, currencies, base years, and whether values represent GMV, revenue, or broader internet-economy measures.
      relatedQuestionRefs: [QM002, QM007]
      relatedTableRefs: [TM002]
