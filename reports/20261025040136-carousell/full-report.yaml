        - >-
          Multiple compression or a down-round is possible, but the magnitude is unquantified without current financial
          and capital-structure data.
        - Medium as a risk case, not a forecast.
        - Rising trust losses, weak paid conversion, declining liquidity, or adverse preference terms.
    notes: >-
      Scenarios are decision cases rather than forecasts. Numeric valuation and return ranges are deliberately left
      unsupported because current Carousell price, revenue, margin, cash flow, and security terms are not public in the
      retained evidence.
    claimRefs:
      - CV006
      - CV009
      - CV010
      - CV011
      - CV012
