  - id: FE001
    title: Product architecture map
    type: stack
    summary: Carousell layers marketplace discovery with communications, trust controls, and specialist transaction operations.
    data:
      layers:
        - label: Customer experience
          detail: The customer-facing marketplace and localized entry points.
          modules:
            - label: Listings and discovery
              detail: Mobile classifieds across goods, luxury, mobile, auto, property, jobs, and services
            - label: Localized surfaces
              detail: Market-specific language, content, and support
        - label: Interaction
          detail: Communication and identity surfaces around a listing.
          modules:
            - label: In-app chat
              detail: Presence, receipts, typing indicators, and message moderation
            - label: Profiles and badges
              detail: Reviews, verified status, and user-risk signals
        - label: Trust and transaction
          detail: Controls that make a transaction observable and resolvable.
          modules:
            - label: Secure payment and delivery
              detail: Buy button, Buyer Protection, delivery tracking, and dispute handling
            - label: Verification and certification
              detail: KYC triggers, Certified listings, inspection, and diagnostic tools
        - label: Specialist operations
          detail: Category-specific operations layered on top of the marketplace.
          modules:
            - label: Managed recommerce
              detail: Sell to Carousell, consignment, Refash, LuxLexicon, Laku6, and automotive partners
            - label: Data and AI
              detail: Listing assistance, pricing models, bad-actor detection, and bad-listing removal
        - label: External integrations
          detail: Partner services that extend transaction completion.
          modules:
            - label: Payments
              detail: Secure on-platform payment and buyer protection
            - label: Logistics
              detail: Delivery arrangements, tracking, and local delivery partners
        - label: Governance
          detail: Controls and escalation mechanisms for regulated marketplace risk.
          modules:
            - label: Identity and compliance
              detail: Mobile verification, Singpass checks, KYC triggers, and safety policy
            - label: Disputes and enforcement
              detail: Reports, payment holds, dispute banners, suspension, and investigation records
    approximationNotes: >-
      Layer ordering is an analytical representation of publicly described components, not a company-published
      architecture or proof of technical dependency order.
    claimRefs:
      - CE001
      - CE004
      - CE009
      - CE010
      - CE013
  - id: FU001
    title: Customer journey from listing to expansion
    type: journey-map
    summary: >-
      Carousell's customer journey links low-friction supply creation to discovery, trust-enabled transaction, and
      higher-value or merchant expansion.
    data:
      nodes:
        - id: discover
          label: Discover
          title: Buyer or seller enters a local category
          details: Fashion, electronics, furniture, luxury, autos, and services create multiple entry points.
        - id: list
          label: List
          title: Seller creates a listing
          details: Photo or video AI can populate title, description, category, price, and condition.
        - id: chat
          label: Chat
          title: Buyer and seller negotiate in-app
          details: Messaging, ratings, and moderation keep the conversation closer to the transaction.
        - id: trust
          label: Trust
          title: Buyer protection and certified categories reduce friction
          details: Escrow or buyer protection and certified phones, bags, watches, and cars are available in selected markets.
        - id: fulfill
          label: Fulfill
          title: Meetup, drop-off, pickup, or partner logistics
          details: Market-specific drop-off networks and delivery partnerships support unique and bulky goods.
        - id: expand
          label: Expand
          title: Merchant tools and high-value verticals deepen usage
          details: Professional sellers, autos, luxury, services, and paid visibility create expansion paths.
    claimRefs:
      - CU001
      - CU003
      - CU009
      - CU011
      - CU012
      - CU015
