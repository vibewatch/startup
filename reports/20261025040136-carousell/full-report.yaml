              - CO020
              - CO021
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adoption logic
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all digital retail. Carousell's own fact sheet describes two linked models:
              multi-category classifieds that let users buy and sell secondhand directly, and an omnichannel recommerce
              business that adds consigning, trusted partners, and physical retail. The category boundary therefore
              includes peer-to-peer listings, professional listings, recommerce services, and selected high-value
              verticals such as cars, luxury, mobile phones, fashion, home and living, property, and services. It
              excludes first-party general merchandise retail, food delivery, and payment value that does not pass
              through Carousell's marketplace. The buyer value proposition is affordability, discovery, and convenience;
              the seller value proposition is monetizing unused goods or acquiring demand. In practice, the substitute
              set includes new-item e-commerce, offline classifieds, social selling, specialist vertical marketplaces,
              and simply retaining or giving away an item. This boundary matters because a regional e-commerce headline
              is an upper context, not Carousell's own serviceable market.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM008
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM008
              - CM010
      - number: '2.2'
        title: Multiple sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              Two third-party lenses quantify the surrounding market but use different definitions and methodologies.
              Statista's current topic page reports an e-commerce market value of US$181 billion for Southeast Asia and
              separately lists a US$263 billion internet-economy figure; its page also notes that its statistics have
              different update cycles and may not be complete. UnivDatos reports US$201.92 billion for Southeast Asia
              e-commerce in 2024 and a forecast CAGR of 21.13% for 2025–2033, segmented by type, payment method, and
              country. These figures are not interchangeable: one is a current topic-page statistic with access
              limitations, while the other is a paid-market-study estimate whose methodology combines secondary
              research, expert interviews, top-down and bottom-up approaches, and triangulation. A narrower recommerce
              lens is supported by the Carousell Recommerce Index summary reported by eTailAsia: 72% of 3,029
              respondents across eight markets had purchased secondhand before. That is a survey incidence metric, not a
              GMV or revenue estimate. The evidence therefore supports a large and growing context plus meaningful
              secondhand adoption, but not a precise Carousell TAM, SAM, or SOM. The missing bridge is category-level
              GMV, take rate, active transacting users, and country-level reach.
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM014
              - CM016
              - CM017
              - CM018
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM014
              - CM016
              - CM017
              - CM018
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM014
              - CM016
              - CM017
              - CM018
      - number: '2.3'
        title: Buyers, budget owners, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The demand system has several distinct budget owners. Individuals are both users and payers for low- and
              mid-value secondhand goods; professional sellers, agents, merchants, and dealers are the economic buyers
              for visibility, subscriptions, or transaction tools; and category partners or advertisers fund high-intent
              commercial placements. The Singapore Management University case records Carousell's freemium model, paid
              visibility services for used-goods sellers, and subscriptions for professional sellers such as real-estate
              agents. Growth drivers include mobile penetration, local payment rails, affordability, sustainability
              preferences, and the shift from new-item purchase to resale. eTailAsia's eight-market survey provides
              evidence of secondhand familiarity, while the Statista page highlights social commerce and major platform
              competition as structural forces. Constraints are equally material: users may leave the app for messaging,
              trust and fraud concerns can slow conversion, localization raises operating complexity, and high-value
              categories need verification, delivery, or financing. Sendbird's customer case says off-platform
              conversations reduced Carousell's visibility into failed transactions and unacceptable behavior;
              Carousell's official fact sheet describes buyer protection, tracked delivery, verification, and fraud
              prevention as trust enablers. Adoption timing and valuation therefore depend on monetizing intent without
              degrading liquidity or trust.
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is narrower than regional e-commerce
            body: >-
              The regional e-commerce estimates establish a large context, but Carousell's reachable market must be
              underwritten from recommerce incidence, category GMV, monetizable seller demand, and country-level
              liquidity rather than from a broad e-commerce total.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM016
              - CM017
              - CM018
          - type: callout
            title: Trust is both a conversion lever and a cost center
            body: >-
              Moving communication, payments, verification, delivery, and moderation into a marketplace can improve
              transaction completion and safety, but the public evidence does not quantify the resulting contribution
              margin or payback.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than named resale apps. Carousell's own product surface spans
              fashion, luxury, furniture, electronics, cars, collectibles, home services, integrated delivery,
              escrow-protected buyer protection, and direct selling to Carousell in selected markets. That creates
              direct overlap with peer-to-peer classifieds and recommerce platforms, but also exposes the company to
              category specialists and generalist commerce platforms with stronger logistics or checkout. The 2020 SMU
              case describes Facebook Marketplace as a new entrant contesting the classified-platform business, while
              KrASIA identifies Carsome and Carro as strong used-car players. The practical buyer choice is therefore
              category-specific: a seller can list on Carousell, cross-list to another marketplace, use a specialist
              dealer, or keep the item offline. Carousell's regional presence and local teams help it compete where
              language, trust, and local transaction norms matter, but do not remove the need to win each vertical.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Carousell's differentiation is a bundle rather than a single feature. Its app listing flow, buyer-seller
              chat, ratings, localized market operations, certified categories, delivery, and buyer protection address
              the friction between discovery and completed trade. The Google customer story reports that Gemini reduced
              median listing time to less than two minutes and increased items listed per seller by 20%; these are
              company/partner-reported operating outcomes, not independent benchmarks. Sendbird's customer case shows
              why retaining communication in-app matters: off-platform messaging fragmented the experience and reduced
              visibility into failed transactions and unsafe behavior. This supports a credible trust-and-conversion
              thesis, but also reveals dependency on third-party infrastructure and the ongoing cost of moderation.
              Competitors can match individual features; the harder question is whether they can match local liquidity
              and trusted completion rates simultaneously.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP016
      - number: '3.3'
        title: Pricing, packaging, and switching costs
        blocks:
          - type: paragraph
            body: >-
              The observable monetization model is freemium and attention-based: the SMU case describes paid visibility
              services for used-goods sellers and subscriptions for professional sellers, while the App Store listing
              shows Carousell Coins and a paid three-day bump. This supports low-friction entry, but it also means
              sellers can multi-home and compare reach before paying. Carousell's direct-sale, certified, delivery, and
              protection services can deepen monetization beyond listing promotion, especially in higher-value
              categories, yet public evidence does not disclose realized take rates, seller retention, or category-level
              contribution margins. Switching costs therefore sit mainly in accumulated reputation, listing inventory,
              buyer conversations, and local liquidity rather than contractual lock-in. A seller with a differentiated
              audience or inventory can still cross-list, and a buyer can move to Facebook Marketplace, Shopee, Lazada,
              or a specialist auto platform when price, trust, or fulfillment is better.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case is conditional. Carousell has operated across seven markets, built a decade of buyer-seller
              behavior data, and is adding AI to listing, fraud detection, translation, and discovery. Its FY25
              announcement says recommerce revenue grew 40% year on year, represented 45% of revenue, and that 29
              physical stores contributed to more than 20% GMV uplift in selected businesses. Those claims indicate
              strategic movement from classifieds toward trusted, transaction-led recommerce, but they are not proof
              that the model is insulated from competition. KrASIA reports that trust remained the biggest barrier in
              automotive commerce and that competition was expected to intensify. The most material displacement risks
              are a specialist winning a high-value vertical, a horizontal platform subsidizing distribution, or fraud
              and moderation costs rising faster than monetization. FY26 execution should be judged on repeat usage,
              completed transactions, take rate, and category contribution rather than listing volume alone.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regional liquidity plus trust tooling
            body: >-
              Carousell's strongest advantage is the combination of localized marketplace liquidity and controls that
              keep discovery, communication, and selected transactions inside one workflow.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP013
          - type: callout
            title: Specialists can win the valuable slices
            body: >-
              Automotive and other high-value categories attract focused competitors, while horizontal platforms can
              pressure acquisition and seller economics; public category-level retention and contribution data remain
              unavailable.
            calloutType: risk
            claimRefs:
              - CP003
              - CP012
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and mix
        blocks:
          - type: paragraph
            body: >-
              Carousell's disclosed model is broader than a single classifieds fee. Company statements reported by
              current news sources describe multiple revenue streams and a growing transaction business, while a
              lower-reputation business-model explainer identifies paid listing visibility, seller subscriptions,
              transaction fees, and advertising. Those mechanisms should not be treated as audited revenue lines or
              current realized pricing. The strongest quantitative evidence is FY25 revenue of US$141 million, up 18%
              from US$119.3 million in FY24. Recommerce grew about 40% and reached 45% of group revenue, showing that
              transaction-led activity has become material. Public evidence still does not separate subscription,
              advertising, transaction, or classifieds revenue, so recurring revenue, take rate, concentration, and
              recognition policy remain open.
            claimRefs:
              - CI001
              - CI003
              - CI006
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI009
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI009
              - CI011
      - number: '4.2'
        title: Monetization and service-delivery economics
        blocks:
          - type: paragraph
            body: >-
              The public record supports several monetization points but almost no pricing depth. Historical academic
              evidence describes a freemium model with premium visibility services and professional-seller
              subscriptions. Current reporting adds payments, shipping, inspection, trade-in, and physical stores as
              trust and convenience infrastructure. Carousell operated 29 stores by FY25 year-end and attributed more
              than 20% GMV uplift across luxury, mobile phones, and fashion businesses to those stores, but the
              statement supplies neither a baseline nor store-level contribution. A supplier case says buying chat
              technology reduced engineering cost and accelerated transaction velocity from hours to minutes. Both are
              useful operating proxies, yet neither establishes CAC, payback, gross margin, refund cost, fraud loss, or
              incremental profit.
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI012
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI012
              - CI013
      - number: '4.3'
        title: Profitability and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Carousell reported positive FY25 EBITDA, but the amount was not disclosed. Management told The Business
              Times that it intended to preserve EBITDA positivity, maintain cost discipline, and keep investing
              selectively in AI and recommerce; it also characterized the balance sheet as strong without publishing a
              cash or debt figure. Positive accounting EBITDA is not cash generation, and historical financing cannot be
              treated as cash still available. A 2021 US$100 million financing at a reported US$1.1 billion valuation
              demonstrates past access to capital, while contemporaneous coverage noted that the announced use of
              proceeds lacked specifics. The assigned evidence provides no current cash, burn, runway, debt facilities,
              covenants, working-capital profile, or next-round trigger.
            claimRefs:
              - CI002
              - CI010
              - CI011
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
              - CI011
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence threshold
        blocks:
          - type: paragraph
            body: >-
              The operating trajectory has improved: revenue grew, recommerce became a large mix component, and the
              company crossed its stated EBITDA threshold. The evidence is still insufficient to infer durable free cash
              flow. An academic case frames fraud, new competition, and possible tension between paid services and
              community participation as unresolved business-model risks. Those risks matter financially because higher
              trust-and-safety expense or seller resistance could absorb the apparent operating leverage. The
              underwriting stance should therefore remain conditional. Before assigning value to the profitability
              inflection, diligence should reconcile revenue by stream, gross and contribution margins, EBITDA
              adjustments, store cohorts, CAC and retention, cash conversion, and downside runway. Unsupported
              quantities should remain explicit gaps rather than scenario inputs presented as facts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommerce is financially material
            body: Recommerce contributed 45% of FY25 revenue and grew about 40%, alongside 18% group revenue growth.
            calloutType: strength
            claimRefs:
              - CI001
              - CI003
          - type: callout
            title: EBITDA is not runway
            body: >-
              The company disclosed neither its EBITDA amount nor cash, debt, burn, or runway, so reported profitability
              cannot establish capital self-sufficiency.
            calloutType: risk
            claimRefs:
              - CI002
              - CI011
          - type: callout
            title: Underwrite cash conversion before valuation uplift
            body: >-
              Require stream-level margins, store cohorts, EBITDA adjustments, and downside liquidity evidence before
              treating FY25 as durable free-cash-flow profitability.
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI003
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and operating model
        blocks:
          - type: paragraph
            body: >-
              Carousell delivers a peer-to-peer marketplace in customer workflow terms: a seller creates a listing, a
              buyer discovers it, the parties communicate, and the transaction can move through in-platform payment and
              delivery. The product is no longer only an open listings surface. Tech in Asia describes a group of nine
              brands in seven markets spanning online and omnichannel resale, while the company’s programs add managed
              buying, consignment, certification, and physical drop-off or retail touchpoints. The result is a portfolio
              operating model: the general marketplace supplies liquidity and discovery, while vertical brands and
              managed services address categories where trust, condition, or convenience matter more. This is a
              plausible product wedge, but public disclosures do not establish the relative contribution, repeat usage,
              or profitability of each workflow.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
              - CE011
      - number: '5.2'
        title: Workflow, trust, and transaction controls
        blocks:
          - type: paragraph
            body: >-
              The transaction workflow is built around reducing two marketplace frictions: uncertainty and coordination
              cost. The platform supports chat, reviews, verified badges, secure payment, buyer protection, delivery
              tracking, and dispute handling; selected verticals add inspection, authentication, warranties, or
              diagnostic checks. Sendbird’s customer case describes the earlier problem clearly: buyer-seller
              communication moved to WhatsApp or iMessage, fragmenting the experience and reducing Carousell’s
              visibility into trust-and-safety issues. Carousell’s own safety surface says in-platform records can
              support investigation and dispute resolution. These controls improve observability and conversion
              potential, but they do not eliminate off-platform behavior or fraud. Singapore’s MHA reported that scam
              cases on Carousell rose from 470 to 513 year over year for April-June while total reported scams fell from
              1,125 to 720, showing why control effectiveness needs to be tracked by denominator and scam type.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
      - number: '5.3'
        title: Architecture, data, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The public record supports an applied marketplace technology stack rather than a fully disclosed
              proprietary infrastructure architecture. It includes mobile listing and discovery, localized content and
              support, real-time chat, moderation filters, machine-learning reply suggestions, secure payments,
              logistics integrations, verification signals, and category-specific inspection or pricing tools. A case
              study says Carousell used Sendbird rather than building chat internally and implemented presence, delivery
              receipts, read receipts, typing indicators, profanity filters, regular-expression moderation, and shadow
              banning. KrASIA reports that the auto product was developing AI-assisted detailed listings, partnerships
              for certified vehicle condition, and use of historical data to improve price fairness. These are concrete
              capabilities, but vendor-managed components and partner dependencies mean diligence should test
              portability, data governance, model performance, service-level history, and whether data advantages
              translate into defensible liquidity rather than merely feature breadth.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE006
              - CE009
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE009
              - CE010
              - CE013
      - number: '5.4'
        title: Maturity, roadmap, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Product maturity is mixed by layer. Core marketplace functionality is established across multiple markets,
              while certified programs, managed resale, physical retail, AI-assisted trust, and specialist acquisitions
              are still evolving. CNBC reported in July 2026 that the CEO said AI was being used to prevent bad actors
              and proactively detect and remove bad listings. That is a current management statement, not an
              independently measured safety outcome. MHA’s continuing monitoring and the company’s planned stronger
              authentication options indicate that account takeover and identity abuse remain live operating risks. The
              product roadmap therefore has a dual mandate: expand convenience and vertical depth while improving safety
              controls without imposing excessive seller friction. The public evidence does not disclose uptime for the
              whole marketplace, incident severity, false-positive rates, model recall, security audit scope, or
              category-level unit economics; these are material implementation and underwriting gaps.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence priority
            body: >-
              Request a product-risk pack covering scam loss and recovery rates, account-takeover controls, model
              precision and recall, uptime and incident history, vendor exit plans, and contribution margins for managed
              verticals before underwriting product defensibility.
            calloutType: recommendation
            claimRefs:
              - CE007
              - CE009
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and value exchange
        blocks:
          - type: paragraph
            body: >-
              Carousell's customer base is a two-sided local marketplace rather than a single enterprise buyer.
              Individual sellers use mobile listing, chat, ratings, and local delivery to turn unused goods into cash;
              buyers seek lower-priced, unique, or nearby inventory; and merchants use storefront and visibility tools
              to reach demand without building a separate commerce stack. The same product supports fashion,
              electronics, furniture, luxury, autos, and home services, so the economic value of a customer varies
              materially by category. Public evidence identifies the roles and use cases, but does not disclose
              segment-level revenue, active-buyer frequency, or seller conversion denominators.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU007
              - CU008
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU009
              - CU011
              - CU012
              - CU015
      - number: '6.2'
        title: Adoption surfaces and operating scale
        blocks:
          - type: paragraph
            body: >-
              Adoption is visible through several different lenses that should not be treated as interchangeable.
              Historical reporting cited more than 250 million listings and tens of millions of users, while a current
              partner case describes tens of millions of monthly active users across seven markets. The App Store
              listing provides a current product surface and a 4.7/5 rating from 3.1K ratings, but ratings are not
              retention or transaction completion. Google reports that its AI listing workflow reduced median listing
              time to under two minutes and contributed to a 20% increase in items listed; this is a company case-study
              result, not an independently audited cohort measurement.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU013
      - number: '6.3'
        title: Named customer and partner proof
        blocks:
          - type: paragraph
            body: >-
              Named proof is strongest where a customer or merchant describes a concrete use case rather than where
              Carousell displays a logo. The Straits Times profile gives a named used-car merchant, a stated fleet size,
              and a reported improvement in inquiry conversion after the circuit breaker. Carousell's SME and community
              programmes also provide examples of merchant onboarding and demand generation, although these are
              campaign-level outcomes rather than recurring-revenue proof. The LuxLexicon acquisition supplies a named
              specialist capability in luxury resale and a category-growth signal, but the purchase price and listing
              growth were reported by sources connected to the transaction and do not establish retention.
            claimRefs:
              - CU007
              - CU008
              - CU011
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU011
              - CU015
      - number: '6.4'
        title: Durability, expansion, and unresolved concentration
        blocks:
          - type: paragraph
            body: >-
              Durability depends on whether Carousell can convert episodic decluttering into repeat marketplace activity
              and paid merchant usage. Localization, in-app chat, escrow or buyer protection in selected markets,
              certified categories, and market-specific logistics reduce friction, while auto, luxury, and recommerce
              categories create expansion paths. However, public sources do not provide NRR, GRR, churn, repeat-purchase
              cohorts, customer concentration, CAC payback, or category-level contribution margins. Trust and safety
              also remains a structural customer risk: the platform must detect fraud and off-platform behavior without
              making casual sellers or buyers abandon the marketplace. These are diligence gaps, not evidence that
              retention is weak.
            claimRefs:
              - CU009
              - CU010
              - CU012
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad local-market utility
            body: >-
              Carousell combines casual peer-to-peer selling with merchant and high-value vertical use cases, giving
              customers more than one reason to return.
            calloutType: strength
            claimRefs:
              - CU001
              - CU004
              - CU007
          - type: callout
            title: Retention is not publicly proven
            body: >-
              Public scale and satisfaction signals do not substitute for cohorts, repeat purchase, churn, NRR, GRR, or
              customer concentration data.
            calloutType: risk
            claimRefs:
              - CU016
          - type: callout
            title: Request cohort and concentration data
            body: >-
              Diligence should request seller and buyer cohorts by market and category, paid-merchant retention,
              top-customer concentration, and the denominator behind reported adoption improvements.
            calloutType: recommendation
            claimRefs:
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk assessment
        blocks:
          - type: paragraph
            body: >-
              Carousell has moved from a lightweight classifieds product toward managed recommerce, which raises the
              operating bar. The strongest evidence supports a high residual risk around trust and transaction
              integrity: a 2020 academic case explicitly framed online fraud as an increasing problem, while a supplier
              case study says off-platform messaging weakened review of failed transactions and unacceptable behaviour.
              Carousell responded with in-app moderation and a security-focused chat implementation, but those controls
              are described by the technology vendor rather than independently measured. Competitive risk is also
              material. Current regional evidence describes Shopee and TikTok Shop taking most tracked platform GMV
              while Lazada contracts, against an estimated US$159 billion regional e-commerce market in 2024.
              Independent reporting says price competition, promotions, warehousing and logistics are pressuring
              profitability across the sector. These dynamics can raise acquisition costs or force Carousell to spend
              more to preserve liquidity and trust. Positive adjusted EBITDA is encouraging, but it is one reported
              operating milestone, not evidence of durable free cash flow or a disclosed reserve for fraud, disputes,
              and compliance.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
              - CR012
              - CR016
      - number: '7.2'
        title: Regulatory, legal, operational and security exposures
        blocks:
          - type: paragraph
            body: >-
              The public pool does not document a current enforcement action, license failure, material outage, breach,
              or litigation outcome for Carousell; that absence should remain an evidence gap rather than a clean bill
              of health. Marketplace operations span multiple countries, languages, currencies, logistics environments
              and product categories. A localization source describes local teams and country-specific experiences,
              while another source records partnerships with delivery providers and government-backed digitalisation
              programmes. This footprint increases the number of jurisdictions and counterparties in which privacy,
              consumer protection, payments, advertising, counterfeit, safety and employment obligations may differ. The
              platform's own transaction design also matters: a vendor case says users previously left the app for
              WhatsApp or iMessage, limiting data governance and trust-and-safety review, and reports moderation tools
              for profanity, PII and bad actors. The control is plausible, but the public evidence does not quantify
              false negatives, appeals, response times, or whether the same controls cover every market and category.
              The diligence priority is a market-by-market control inventory tied to incident and complaint data.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR012
              - CR013
      - number: '7.3'
        title: Partner, dependency and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              Carousell's regional model depends on local market liquidity, category specialists, delivery and payments
              partners, and the ability to monetize both individual sellers and professional merchants. Historical
              reporting describes a hybrid footprint that includes general classifieds and autos, with partnerships and
              acquisitions used to deepen market coverage. That creates execution leverage but also dependency risk: a
              logistics or payments partner failure, a weak local team, or a category-specific trust event could impair
              conversion in one market without being visible in group-level revenue. Automotive is especially exposed to
              certification and assurance requirements; a sector source identifies trust as the biggest barrier and says
              competition is likely to intensify. Financial disclosure is incomplete. The latest available article
              reports US$141 million revenue, 18% year-on-year growth and first positive EBITDA, but neither it nor the
              assigned evidence discloses EBITDA margin, cash, debt, working capital, fraud loss, or trust-and-safety
              spend. Investment judgment should therefore use explicit monitoring triggers rather than treating adjusted
              EBITDA as proof that the model is self-funding.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk posture is monitorable if management supplies operating data that public sources do not provide.
              The first trigger is trust: rising scam complaints, counterfeit or unsafe-listing takedowns, dispute
              losses, or slower moderation responses would indicate that transaction growth is outrunning control
              capacity. The second is competitive economics: sustained share loss, higher promotional intensity, or
              seller churn as Shopee and TikTok Shop scale would pressure monetization and require a clearer category
              strategy. The third is profitability quality: a reversal from positive EBITDA, rising trust-and-safety or
              logistics costs, or a cash balance that cannot fund a downside period would break the
              operating-improvement thesis. The fourth is dependency resilience: a material partner outage, regulatory
              restriction, or failure of an acquired/local platform to meet service or compliance standards would test
              whether Carousell has substitutes. These are diligence gates, not forecasts; current public evidence is
              insufficient to set numeric thresholds for most of them.
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Trust controls are a thesis condition
            body: >-
              Carousell's transition to managed recommerce improves monetization potential but makes fraud, privacy,
              moderation and dispute performance central to the investment case. The assigned sources describe controls,
              not current control effectiveness.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
          - type: callout
            title: Require operating proof before upgrading conviction
            body: >-
              Treat positive adjusted EBITDA as an important milestone, not a sufficient proof of durable cash
              generation. An upgrade should require current trust-and-safety metrics, partner resilience evidence and a
              bridge from EBITDA to cash.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is local marketplace density paired with paid visibility, professional-seller
              subscriptions, and higher-value vertical services rather than a generic software multiple. Singapore
              Management University documents the evolution from a mobile-first classifieds community into paid premium
              services and subscriptions for professional sellers, while Carousell's own survey evidence points to broad
              secondhand adoption across eight Asian markets. The anti-thesis is substantial: users can multi-home,
              fraud and moderation are costly, and the available public record does not disclose the current operating
              data needed to test whether liquidity converts into durable margin. Supplier-reported chat performance is
              useful product evidence, but it is not independent proof of company-wide transaction economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
      - number: '8.2'
        title: Price discipline and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The retained evidence consistently places Carousell's $1.1B valuation in the September 2021 financing; it
              does not establish a current primary or secondary clearing price. Consequently, neither an entry multiple
              nor a numeric Carousell valuation range is supportable from public evidence. Comparator dispersion
              reinforces the need for business-model-specific underwriting: Sacra estimates Back Market's 2024 revenue
              at $415M and an approximately 13x revenue multiple, whereas the retrieved October 2024 ThredUp page
              reports a 0.28 price-to-sales ratio. These are contextual observations, not independent benchmarks for
              Carousell, because category mix, geography, growth, profitability, and transaction structure differ.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenarios and decision
        blocks:
          - type: paragraph
            body: >-
              The base case is continued private compounding with a track recommendation: engage in diligence, but do
              not convert the 2021 mark into a present buy price. The bull case requires recurring professional-seller
              or vertical revenue, durable marketplace liquidity, and contribution-margin evidence sufficient to support
              a premium marketplace multiple. The bear case is a valuation reset if multi-homing, competition, fraud, or
              moderation costs prevent operating leverage. Because current Carousell revenue, EBITDA, cash flow,
              dilution, and price are not established by retained public evidence, every scenario leaves the valuation
              range unquantified and uses operating milestones rather than false precision.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV011
              - CV012
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Vinted's April 2026 secondary transaction shows the profile that can attract institutional liquidity: an
              €8B equity valuation alongside reported 2025 GMV of €10.8B, revenue of €1.1B, and net profit of €62M. That
              transaction is a comparator signal, not a transferable Carousell valuation, and Vinted raised no new
              primary capital in it. Carousell could pursue a future listing, strategic sale, or continued private
              compounding, but a premium exit requires audited reporting, segment economics, governance, and a credible
              margin narrative. The final diligence gate is a current security price and terms, audited financials,
              cohort retention, paid-seller conversion, fraud-loss trends, vertical contribution margins, debt, and a
              fully diluted preference waterfall.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track; do not price from the 2021 anchor
            body: >-
              Carousell merits investor diligence, but the public evidence does not establish a current security price
              or the operating denominator needed for a defensible valuation multiple.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV009
          - type: callout
            title: Common-share value may differ from headline equity value
            body: >-
              A fully diluted cap table, debt schedule, liquidation preferences, and exit waterfall are necessary before
              translating any future headline valuation into investor returns.
            calloutType: risk
            claimRefs:
              - CV012
