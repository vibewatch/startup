chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Carousell began in Singapore in 2012 as a mobile-first peer-to-peer classifieds product built by Quek Siu
              Rui, Marcus Tan, and Lucas Ngoo. The original workflow reduced listing friction by allowing a seller to
              photograph an item, publish it, and communicate with a buyer in-app; the early product left payment and
              fulfilment largely to the parties. Current company material describes a broader multi-category classifieds
              and recommerce group spanning Singapore, Hong Kong, Indonesia, Malaysia, the Philippines, and Taiwan,
              while also naming brands and verticals in Vietnam, Malaysia, Indonesia, and Singapore. The product surface
              now includes seller tools, paid business accounts, integrated delivery in selected markets, direct-sale
              programmes, certified listings, and escrow-protected Buyer Protection in selected markets. This is a
              meaningful change in economic model: the company is no longer only a listing-and-chat utility, but public
              evidence still does not disclose a consolidated mix of marketplace fees, seller subscriptions, managed
              recommerce, or financial services.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO014
              - CO015
              - CO016
              - CO018
      - number: '1.2'
        title: Founders, funding, and leadership
        blocks:
          - type: paragraph
            body: >-
              The founding team has remained central to the public narrative: TechCrunch identified Quek as CEO and
              described all three founders as National University of Singapore graduates, while the Singapore Management
              University case identifies Quek, Tan, and Ngoo as the three friends who started the company. The disclosed
              financing path includes an US$800,000 seed round in 2013, US$6 million Series A in 2014, US$35 million
              Series B in 2016, US$85 million Series C in 2018, US$80 million in 2020, and US$100 million from STIC
              Investments in 2021. Independent coverage reported the 2021 round at a US$1.1 billion valuation; a
              separate 2020 case study reported US$550 million, showing that valuation is event-specific rather than a
              current mark. Public sources identify major backers including Rakuten Ventures, Sequoia/Peak XV, Golden
              Gate Ventures, 500 Global, Naver, OLX Group, Telenor Group, EDBI, Mirae Asset, DBS, and STIC. The evidence
              does not establish the current board, voting control, liquidation preferences, debt, secondary
              transactions, or whether the founding trio retains operational and economic control.
            claimRefs:
              - CO006
              - CO008
              - CO009
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO020
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO011
              - CO012
      - number: '1.3'
        title: Scale, milestones, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Carousell has disclosed scale through several different lenses rather than one consistent current KPI set.
              In 2016, the company claimed 35 million listings, 70 new listings per minute, 17 minutes of average in-app
              time, five countries, and more than 90 staff; the 2020 academic case described seven markets and a US$550
              million valuation; current company material says the group has a leading presence in seven markets and
              serves tens of millions of users, while the Vietnam Chợ Tốt brand reports more than 55 million monthly
              visitors and REFASH reports more than 7 million clothing pieces processed. These figures are not
              interchangeable: listings, visitors, users, app engagement, and processed garments have different
              denominators and periods. The current public app listing confirms a live consumer product with 4.7/5 from
              3.1K ratings, but app-store ratings are not active-user or transaction measures. An IPO tracker updated
              April 2, 2026 reports no IPO announced, while the company’s public evidence does not disclose a current
              clearing valuation. The investment case therefore has a credible operating history and regional footprint,
              but requires refreshed evidence on headcount, revenue mix, GMV, cash, debt, governance, cohort economics,
              and trust-and-safety losses before a high-confidence current valuation conclusion.
            claimRefs:
              - CO014
              - CO015
              - CO016
              - CO017
              - CO018
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO012
              - CO014
              - CO015
              - CO017
      - number: '1.4'
        title: Adverse evidence and control considerations
        blocks:
          - type: paragraph
            body: >-
              The principal adverse evidence is structural rather than a disclosed enforcement event. The 2020 academic
              case describes online fraud as a continuing challenge and asks how Carousell could provide safety and
              assurance while monetising without undermining community building. Sendbird’s customer case says that
              leaving conversations outside the app fragmented the experience and reduced the company’s visibility into
              transaction failures and unacceptable behaviour; Carousell subsequently adopted in-app chat and moderation
              controls. The current app listing shows user-generated content, messaging, tracking and linked financial
              or contact data, alongside regional limitations on delivery, Buyer Protection, AI listing, and direct-sale
              features. These facts support a diligence focus on fraud loss, dispute reserves, privacy controls,
              moderation effectiveness, and geographic consistency of product protections. They do not establish a
              current legal breach or a quantified incident rate; no such public metric is retained in this chapter’s
              assigned sources.
            claimRefs:
              - CO020
              - CO021
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regional operating breadth
            body: >-
              The company has evolved from a Singapore listings app into a multi-brand, multi-market recommerce group
              with managed resale, seller tools, and selected transaction protections.
            calloutType: strength
            claimRefs:
