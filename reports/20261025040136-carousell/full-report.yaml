            title: Current private-company opacity
            body: >-
              The assigned evidence does not establish current revenue, GMV, cash, debt, board control, or a 2026
              clearing valuation, so the 2021 unicorn mark should not be treated as a current price.
            calloutType: risk
            claimRefs:
              - CO012
              - CO016
              - CO018
          - type: callout
            title: Verify the control and economics layer
            body: >-
              Prioritize a current cap table, investor rights, audited management accounts, trust-and-safety loss data,
              and market-by-market cohort economics before underwriting an upgrade.
            calloutType: recommendation
            claimRefs:
