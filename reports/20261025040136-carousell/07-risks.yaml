company:
  name: Carousell
chapter:
  number: 7
  title: Risks
  summary: Carousell's main exposures are trust-and-safety execution, intensifying regional platform competition, and the difficulty of sustaining profitability while investing in local operations and AI. Public evidence shows mitigations such as moderated in-app chat and certified electronics, but does not establish current incident rates, regulatory compliance, cash headroom, or the durability of positive EBITDA.
sections:
  - id: risk-ranking
    title: Ranked risk assessment
    body: "Carousell has moved from a lightweight classifieds product toward managed recommerce, which raises the operating bar. The strongest evidence supports a high residual risk around trust and transaction integrity: a 2020 academic case explicitly framed online fraud as an increasing problem, while a supplier case study says off-platform messaging weakened review of failed transactions and unacceptable behaviour. Carousell responded with in-app moderation and a security-focused chat implementation, but those controls are described by the technology vendor rather than independently measured. Competitive risk is also material. Current regional evidence describes Shopee and TikTok Shop taking most tracked platform GMV while Lazada contracts, against an estimated US$159 billion regional e-commerce market in 2024. Independent reporting says price competition, promotions, warehousing and logistics are pressuring profitability across the sector. These dynamics can raise acquisition costs or force Carousell to spend more to preserve liquidity and trust. Positive adjusted EBITDA is encouraging, but it is one reported operating milestone, not evidence of durable free cash flow or a disclosed reserve for fraud, disputes, and compliance."
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR013]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-operational
    title: Regulatory, legal, operational and security exposures
    body: "The public pool does not document a current enforcement action, license failure, material outage, breach, or litigation outcome for Carousell; that absence should remain an evidence gap rather than a clean bill of health. Marketplace operations span multiple countries, languages, currencies, logistics environments and product categories. A localization source describes local teams and country-specific experiences, while another source records partnerships with delivery providers and government-backed digitalisation programmes. This footprint increases the number of jurisdictions and counterparties in which privacy, consumer protection, payments, advertising, counterfeit, safety and employment obligations may differ. The platform's own transaction design also matters: a vendor case says users previously left the app for WhatsApp or iMessage, limiting data governance and trust-and-safety review, and reports moderation tools for profanity, PII and bad actors. The control is plausible, but the public evidence does not quantify false negatives, appeals, response times, or whether the same controls cover every market and category. The diligence priority is a market-by-market control inventory tied to incident and complaint data."
    claimRefs: [CR007, CR008, CR009, CR010, CR011]
    tableRefs: [TR002]
  - id: dependency-financial
    title: Partner, dependency and financial-model risks
    body: "Carousell's regional model depends on local market liquidity, category specialists, delivery and payments partners, and the ability to monetize both individual sellers and professional merchants. Historical reporting describes a hybrid footprint that includes general classifieds and autos, with partnerships and acquisitions used to deepen market coverage. That creates execution leverage but also dependency risk: a logistics or payments partner failure, a weak local team, or a category-specific trust event could impair conversion in one market without being visible in group-level revenue. Automotive is especially exposed to certification and assurance requirements; a sector source identifies trust as the biggest barrier and says competition is likely to intensify. Financial disclosure is incomplete. The latest available article reports US$141 million revenue, 18% year-on-year growth and first positive EBITDA, but neither it nor the assigned evidence discloses EBITDA margin, cash, debt, working capital, fraud loss, or trust-and-safety spend. Investment judgment should therefore use explicit monitoring triggers rather than treating adjusted EBITDA as proof that the model is self-funding."
    claimRefs: [CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring indicators and thesis-break triggers
    body: "The risk posture is monitorable if management supplies operating data that public sources do not provide. The first trigger is trust: rising scam complaints, counterfeit or unsafe-listing takedowns, dispute losses, or slower moderation responses would indicate that transaction growth is outrunning control capacity. The second is competitive economics: sustained share loss, higher promotional intensity, or seller churn as Shopee and TikTok Shop scale would pressure monetization and require a clearer category strategy. The third is profitability quality: a reversal from positive EBITDA, rising trust-and-safety or logistics costs, or a cash balance that cannot fund a downside period would break the operating-improvement thesis. The fourth is dependency resilience: a material partner outage, regulatory restriction, or failure of an acquired/local platform to meet service or compliance standards would test whether Carousell has substitutes. These are diligence gates, not forecasts; current public evidence is insufficient to set numeric thresholds for most of them."
    claimRefs: [CR003, CR005, CR008, CR014, CR016]
    tableRefs: []
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, Evidence and jurisdiction, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Privacy and trust-and-safety control failure, "Cross-market marketplace; off-platform chat previously limited review and vendor reports moderation tools", "Medium", "High", "Partial", "High", "Obtain market-by-market privacy, moderation, PII, appeals and incident metrics"]
      - ["Consumer protection, counterfeit and unsafe-listing exposure", "Marketplace goods include cars, fashion, electronics and furniture; public pool lacks current enforcement record", "Medium", "High", "Partial", "High", "Review takedown, counterfeit, warranty, returns and regulator correspondence by market"]
      - [Regulatory or legal status not publicly evidenced, "No current license, enforcement, litigation or approval record was established in assigned sources", "Unknown", "High", "Unverified", "High", "Commission legal diligence covering Singapore and every operating jurisdiction"]
      - [Cross-border obligations and localization complexity, "Local teams and country-specific language, currency, logistics and consumer contexts are described", "Medium", "Medium", "Partial", "Medium", "Map data, payments, employment, tax and advertising obligations to named owners"]
    notes: Public-source register; likelihood and residual exposure are analytical assessments anchored to the cited operating evidence, not disclosed incident probabilities. Null or unknown legal status means not established in the assigned pool.
    enumerationScope:
      coverage: partial
      basis: "Publicly documented risk categories and operating jurisdictions in the assigned 2026 refresh evidence; not a complete legal register."
    claimRefs: [CR001, CR007, CR008, CR009, CR010]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Scams or unacceptable behaviour in buyer-seller interactions", "Medium", "High", "Partial", "High", "Current scam rate, loss rate, response time and appeal outcomes"]
      - ["Messaging, privacy or PII control failure", "Medium", "High", "Partial", "High", "Coverage and audit results for moderation and data governance across markets"]
      - [Partner or logistics disruption, "Medium", "Medium", "Partial", "Medium", "Substitution plans and service-level performance by delivery/payment partner"]
      - [Category quality or safety failure in autos and high-value goods, "Medium", "High", "Partial", "High", "Certification, warranty, returns and dispute data by category"]
    notes: Operational register combines independent reporting, a customer case study and a vendor case study; no source provides a complete current incident or quality series.
    claimRefs: [CR002, CR007, CR008, CR012, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring indicator]
    rows:
      - [Regional marketplace liquidity, "Shopee, TikTok Shop and other platforms", "Consumer or seller attention shifts to faster-growing or more promotional channels", "High", "Category focus and trust investment", "High", "Seller churn, traffic share, take rate and promotion spend"]
      - [Messaging infrastructure, "Sendbird / cloud messaging stack", "Messaging outage or moderation integration failure interrupts negotiation and control visibility", "High", "In-app chat, moderation tools and reported uptime", "Medium", "Incident minutes, message delivery, moderation backlog and failover tests"]
      - [Delivery and transaction partners, "GrabExpress, GOGOVan, EasyParcel, blu and other local providers", "Service interruption raises friction or prevents completion of local transactions", "Medium", "Multiple local partnerships and discounted delivery options", "Medium", "Completion rate, SLA breaches and partner concentration"]
      - [Acquired or specialist platforms, "OLX Philippines, autos and local market teams", "Integration, category quality or local execution underperforms", "High", "M&A and localized operating teams", "Medium", "Market contribution, retention, compliance exceptions and integration milestones"]
    notes: Dependency register distinguishes counterparties and roles from company-issued strategy claims; concentration percentages and contractual protections were not disclosed in the assigned sources.
    claimRefs: [CR003, CR005, CR012, CR013, CR014]
