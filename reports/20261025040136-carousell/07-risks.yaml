        - label: Cross-market regulatory exposure
          values: [0, 0, 3, 0]
        - label: Partner or logistics disruption
          values: [0, 0, 3, 0]
        - label: Autos and high-value category quality
          values: [0, 0, 3, 0]
        - label: Profitability durability and cash opacity
          values: [0, 0, 3, 0]
    approximationNotes: "Ordinal likelihood and impact scores are a structured synthesis, not measured frequencies."
    claimRefs: [CR001, CR003, CR005, CR008, CR012, CR016]
callouts:
  - calloutType: risk
    title: Trust controls are a thesis condition
    body: Carousell's transition to managed recommerce improves monetization potential but makes fraud, privacy, moderation and dispute performance central to the investment case. The assigned sources describe controls, not current control effectiveness.
    claimRefs: [CR001, CR002, CR007, CR008]
  - calloutType: recommendation
    title: Require operating proof before upgrading conviction
    body: Treat positive adjusted EBITDA as an important milestone, not a sufficient proof of durable cash generation. An upgrade should require current trust-and-safety metrics, partner resilience evidence and a bridge from EBITDA to cash.
    claimRefs: [CR003, CR014, CR016]
