      - [Transact with less fraud, "Verify identity, review seller, and use protected payment", "Mobile/Singpass verification, badges, Buy button, Buyer Protection", "Records and dispute handling improve investigability", "MHA still monitors scam effectiveness"]
      - [Avoid meet-up friction, "Pay and arrange delivery inside platform", "Secure payment and Carousell Official Delivery", "Delivery can be tracked in-platform", "Eligibility and coverage by market are unclear"]
      - [Sell specialist goods, "Use inspection, consignment, or direct sale", "Certified, Sell to Carousell, Refash, LuxLexicon, and diagnostic tools", "Adds authentication, warranties, or objective offers", "Unit economics and claims-denial rates are private"]
    notes: "Benefits are source-described capabilities or historical observations, not a controlled product benchmark; null performance denominators should be requested in diligence."
    claimRefs: [CE004, CE005, CE006, CE008, CE009]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Experience, "Mobile listing, discovery, localized content, user profiles", "iOS/Android and local teams", "Fragmentation and localization execution"]
      - [Communication, "Real-time buyer-seller chat and moderation", "Sendbird vendor platform and AWS-backed service", "Vendor concentration, data governance, moderation coverage"]
      - [Trust and safety, "Identity signals, badges, KYC triggers, AI listing controls", "Singpass, regulators, internal models", "Account takeover, scams, false positives, evolving regulation"]
      - [Transaction operations, "Protected payment, delivery, disputes, inspection, certification", "Payment and logistics partners plus specialist brands", "Partner SLA, fraud losses, warranty and inventory exposure"]
    notes: "Architecture is reconstructed from public product and partner descriptions; Carousell has not published a complete system diagram, service-level history, or model-risk documentation."
    claimRefs: [CE004, CE006, CE009, CE013, CE014]
