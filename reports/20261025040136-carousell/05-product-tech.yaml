    claimRefs: [CE001, CE004, CE009, CE010, CE013]
callouts:
  - calloutType: recommendation
    title: Diligence priority
    body: "Request a product-risk pack covering scam loss and recovery rates, account-takeover controls, model precision and recall, uptime and incident history, vendor exit plans, and contribution margins for managed verticals before underwriting product defensibility."
    claimRefs: [CE007, CE009, CE014, CE015]
