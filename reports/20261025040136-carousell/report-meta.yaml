  headline: >-
    Carousell merits close tracking and serious diligence because FY25 growth, rising recommerce mix, and positive
    EBITDA improve the operating case, but the lack of a current price, audited unit economics, and complete risk
    disclosure prevents a high-conviction investment recommendation.
