  topStrengths:
    - Regional marketplace density and a multi-category recommerce footprint support differentiated local liquidity.
    - FY25 revenue reached US$141 million, grew 18% year on year, and recommerce represented 45% of revenue.
    - >-
      Monetization extends beyond free listings into professional-seller services, managed resale, specialist verticals,
      and transaction infrastructure.
  topRisks:
    - Trust, fraud, moderation, and dispute-control costs may rise as transactions and platform complexity increase.
    - >-
      Competition from horizontal platforms, social commerce, and category specialists can pressure liquidity, pricing,
      and customer acquisition.
    - >-
      Current cash, debt, margin, cohort, governance, and valuation data are not disclosed well enough for full
      underwriting.
  unresolvedGaps:
    - >-
      No fresh 2026 primary or secondary Carousell pricing event is public, so the current clearing price remains
      unknown.
    - Public GMV, contribution margin, CAC payback, and store cohort economics are not disclosed.
    - FY25 ending cash, debt facilities, and reserve assumptions for fraud or disputes are not publicly available.
    - The durability of positive EBITDA if trust-and-safety spending or competitive intensity rises remains unproven.
    - The return profile of specialist verticals and physical stores is not established in public evidence.
