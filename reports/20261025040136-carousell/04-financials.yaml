company:
  name: Carousell
chapter:
  number: 4
  title: Financials
  summary: Carousell reported US$141 million of FY25 revenue, 18% year-on-year growth, and positive EBITDA, with recommerce contributing 45% of revenue. The direction is favorable, but the EBITDA amount, gross margin, cash, debt, runway, customer-acquisition economics, and store contribution remain unavailable, preventing a cash-return or capital-adequacy underwriting.
sections:
  - id: revenue-model
    title: Revenue model and mix
    body: >-
      Carousell's disclosed model is broader than a single classifieds fee.
      Company statements reported by current news sources describe multiple revenue
      streams and a growing transaction business, while a lower-reputation business-model
      explainer identifies paid listing visibility, seller subscriptions, transaction
      fees, and advertising. Those mechanisms should not be treated as audited revenue
      lines or current realized pricing. The strongest quantitative evidence is FY25
      revenue of US$141 million, up 18% from US$119.3 million in FY24. Recommerce grew
      about 40% and reached 45% of group revenue, showing that transaction-led activity
      has become material. Public evidence still does not separate subscription,
      advertising, transaction, or classifieds revenue, so recurring revenue, take rate,
      concentration, and recognition policy remain open.
    claimRefs: [CI001, CI003, CI006, CI007]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: monetization-and-delivery-cost
    title: Monetization and service-delivery economics
    body: >-
      The public record supports several monetization points but almost no pricing
      depth. Historical academic evidence describes a freemium model with premium
      visibility services and professional-seller subscriptions. Current reporting
      adds payments, shipping, inspection, trade-in, and physical stores as trust and
      convenience infrastructure. Carousell operated 29 stores by FY25 year-end and
      attributed more than 20% GMV uplift across luxury, mobile phones, and fashion
      businesses to those stores, but the statement supplies neither a baseline nor
      store-level contribution. A supplier case says buying chat technology reduced
      engineering cost and accelerated transaction velocity from hours to minutes.
      Both are useful operating proxies, yet neither establishes CAC, payback, gross
      margin, refund cost, fraud loss, or incremental profit.
    claimRefs: [CI004, CI005, CI009, CI012, CI013]
    tableRefs: [TI002]
  - id: profitability-and-capital
    title: Profitability and capital adequacy
    body: >-
      Carousell reported positive FY25 EBITDA, but the amount was not disclosed.
      Management told The Business Times that it intended to preserve EBITDA positivity,
      maintain cost discipline, and keep investing selectively in AI and recommerce;
      it also characterized the balance sheet as strong without publishing a cash or
      debt figure. Positive accounting EBITDA is not cash generation, and historical
      financing cannot be treated as cash still available. A 2021 US$100 million
      financing at a reported US$1.1 billion valuation demonstrates past access to
      capital, while contemporaneous coverage noted that the announced use of proceeds
      lacked specifics. The assigned evidence provides no current cash, burn, runway,
      debt facilities, covenants, working-capital profile, or next-round trigger.
    claimRefs: [CI002, CI010, CI011, CI014, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and diligence threshold
    body: >-
      The operating trajectory has improved: revenue grew, recommerce became a large
      mix component, and the company crossed its stated EBITDA threshold. The evidence
      is still insufficient to infer durable free cash flow. An academic case frames
      fraud, new competition, and possible tension between paid services and community
      participation as unresolved business-model risks. Those risks matter financially
      because higher trust-and-safety expense or seller resistance could absorb the
      apparent operating leverage. The underwriting stance should therefore remain
      conditional. Before assigning value to the profitability inflection, diligence
      should reconcile revenue by stream, gross and contribution margins, EBITDA
      adjustments, store cohorts, CAC and retention, cash conversion, and downside
      runway. Unsupported quantities should remain explicit gaps rather than scenario
      inputs presented as facts.
    claimRefs: [CI001, CI002, CI003, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Public status, Quality assessment, Diligence ask]
    rows:
      - [Classifieds, "Marketplace listings and seller visibility", "Core business; stream revenue not separated", "Current company description, no audited mix", "Revenue, realized price, renewal, and contribution by market"]
      - [Promoted listings, "Paid placement and visibility tools", "Mechanism described; current realized pricing unavailable", "Low-reputation independent explainer", "Price book, discounting, conversion lift, and repeat purchase"]
      - [Seller subscriptions, "Professional-seller tools and listing services", "Historically documented; current subscribers and retention unavailable", "Independent academic case, but historical", "Subscribers, ARPU, churn, cohort retention, and gross margin"]
      - [Transaction services, "Payments and trust-enabled transaction fees", "Growing transaction business; take rate unavailable", "Current company statement reported by news sources", "GMV, payment penetration, take rate, refunds, and fraud losses"]
      - [Recommerce, "Transaction-led luxury, electronics, and fashion activity", "45% of FY25 revenue; about 40% FY25 growth", "Two current reports repeat company disclosure", "Segment revenue, GMV, take rate, inventory exposure, and contribution"]
    notes: "Streams are public descriptions rather than audited segment reporting; current values are shown only where FY25 sources disclosed them."
    claimRefs: [CI003, CI006, CI007, CI009]
  - id: TI002
    title: Pricing and operating-economics evidence
    columns: [Lever, What is public, Value or status, Economic implication, Missing proof]
    rows:
      - [Premium visibility, "Paid services increase listing visibility", "Price and conversion unavailable", "Potential high-margin monetization, subject to seller ROI", "Realized price, discounting, conversion lift, repeat rate"]
      - [Professional subscriptions, "Historical rollout to professional sellers", "Subscriber count and retention unavailable", "Potential recurring revenue, but not evidence of ARR", "Current plans, subscribers, ARPU, churn, and margin"]
      - [Physical stores, "29 stores by FY25 year-end", "Company attributed over 20% GMV uplift in three businesses", "Trust and access may raise activity while adding fixed and service costs", "Store cohorts, baseline GMV, labor, occupancy, payback, and contribution"]
      - [Inspection and trade-in, "Stores support services difficult to replicate online", "Pricing and attach rate unavailable", "May improve conversion but adds authentication and handling expense", "Attach rate, fee, error rate, return rate, and unit contribution"]
      - [Third-party chat infrastructure, "Supplier says buy-versus-build reduced engineering costs", "Transaction velocity reportedly moved from hours to minutes", "Possible operating leverage, but supplier-issued evidence", "Contract cost, internal savings baseline, and conversion impact"]
    notes: "No assigned source supplies a current Carousell price sheet or realized-price dataset; supplier and company statements are not independent unit-economics validation."
    claimRefs: [CI004, CI005, CI009, CI012, CI013]
  - id: TI003
    title: Unit economics and capital-underwriting checklist
    columns: [Metric, Public value, Confidence, Why it matters, Diligence request]
    rows:
      - [Revenue, "US$141M in FY25; 18% YoY growth", High, "Establishes current disclosed scale", "Reconcile audited accounts to revenue by stream and market"]
      - [Recommerce mix, "45% of FY25 revenue; about 40% growth", High, "Tests materiality of the second growth engine", "Provide segment revenue, GMV, take rate, and contribution"]
      - [EBITDA, "Positive in FY25; amount undisclosed", High on direction only, "Signals operating leverage but not cash generation", "Provide amount, adjustments, share-based pay, and cash conversion"]
      - [Gross margin, "Not disclosed", Low, "Tests whether stores and services dilute platform economics", "Provide gross and contribution margin by stream"]
      - [CAC and payback, "Not disclosed", Low, "Determines growth efficiency and financing need", "Provide acquisition spend, organic mix, cohorts, retention, and payback"]
      - [Store contribution, "Not disclosed", Low, "Tests whether offline trust investments create durable profit", "Provide store cohort P&Ls, capex, working capital, and payback"]
      - [Cash and debt, "Management described a strong balance sheet without figures", Low, "Determines resilience and financing dependency", "Provide ending cash, debt facilities, covenants, and restricted cash"]
      - [Burn and runway, "Not disclosed", Low, "Determines timing of any next financing", "Provide monthly cash bridge and base/downside runway scenarios"]
    notes: "Not disclosed means the assigned public evidence supplies no value; it does not mean zero. Confidence applies to the stated public value, not to the unavailable metric."
    claimRefs: [CI001, CI002, CI003, CI010, CI011, CI014, CI015]
