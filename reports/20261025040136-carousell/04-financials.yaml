          value: "Inspection, trade-in, shipping, and stores"
          note: "The service layer can aid conversion but introduces delivery costs."
        - id: revenue
          label: FY25 revenue
          value: "US$141M; 18% YoY growth"
          unit: "US dollars"
          note: "Stream-level revenue and recognition policy are not disclosed."
        - id: profitability
          label: FY25 profitability
          value: "EBITDA-positive; amount undisclosed"
          note: "Gross margin, EBITDA adjustments, capex, and cash conversion remain gaps."
    claimRefs: [CI001, CI002, CI006, CI007, CI009, CI011]
callouts:
  - calloutType: strength
    title: Recommerce is financially material
    body: "Recommerce contributed 45% of FY25 revenue and grew about 40%, alongside 18% group revenue growth."
    claimRefs: [CI001, CI003]
  - calloutType: risk
    title: EBITDA is not runway
    body: "The company disclosed neither its EBITDA amount nor cash, debt, burn, or runway, so reported profitability cannot establish capital self-sufficiency."
    claimRefs: [CI002, CI011]
  - calloutType: recommendation
    title: Underwrite cash conversion before valuation uplift
    body: "Require stream-level margins, store cohorts, EBITDA adjustments, and downside liquidity evidence before treating FY25 as durable free-cash-flow profitability."
    claimRefs: [CI002, CI003, CI011]
