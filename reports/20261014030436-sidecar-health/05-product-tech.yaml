      - TE002
    figureRefs:
      - FE001
  - id: product-lines-and-operational-architecture
    title: Product Lines and Operational Architecture
    body: >
      The commercial product architecture of Sidecar Health has undergone a structural pivot, discontinuing its historical individual indemnity products (such as the legacy Access Plan underwritten by SiriusPoint America or United States Fire Insurance Company) to focus exclusively on employer-sponsored major medical offerings. The current commercial catalogue is partitioned into two core delivery vehicles: Employer-Sponsored Group Fully Insured Plans underwritten by Sidecar Health Insurance Company, Inc. (NAIC #17104) and available to employers based in Ohio, Georgia, Florida, and recently expanded into Texas; and Administrative Services Only (ASO) / Third Party Administrator (TPA) solutions offered through Sidecar Health Insurance Solutions, LLC for self-funded enterprise sponsors across nationwide footprints.


      Underpinning these plan options is an integrated technology stack spanning four core operating layers: Member Engagement, Financial & Payments Infrastructure, Core Adjudication & Pricing Engine, and Clinical Quality & Partner Integrations. The Member Engagement layer provides web and mobile user interfaces offering location-aware price comparison, digital identification, and direct receipt/bill ingestion via mobile camera capture. The Financial & Payments layer integrates commercial Visa card issuing and real-time ledger authorization, allowing dynamic debit transactions at the healthcare point-of-sale while mitigating provider balance billing frictions.


      The Core Adjudication Engine evaluates uploaded itemized bills against plan coverage rules, essential health benefits (EHB) guidelines, and member deductibles. Unlike conventional carriers that enforce manual clinical utilization reviews and prior authorizations, Sidecar Health relies on post-service verification of medical billing codes and eligibility. Internal operating metrics from plan years 2024 and 2025 demonstrate that more than 99% of processed claims were approved, with fewer than 1% subjected to clinical denials—a dramatic departure from commercial health insurance denial averages. To protect employer sponsors from catastrophic volatility, plans integrate standard ACA out-of-pocket maximum limits alongside aggregate and specific stop-loss reinsurance arrangements.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
