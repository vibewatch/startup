  - id: TP003
    title: Pricing / Packaging Comparison
    columns:
      - Model / Carrier
      - Contract Structure
      - Cost Basis
      - Out-of-Pocket Mechanism
      - Key Tradeoff
    rows:
      - - Sidecar Health Large Group
        - Fully insured (FL, GA, OH) or self-funded ASO nationally
        - Fixed Benefit Amount derived from regional cash prices
        - First-dollar plan variants; deductible aligns with OOP max; member pays excess cash variance
        - Substantial premium savings offset by member financial risk if provider charges exceed Benefit Amount
      - - Traditional Commercial PPO
        - Fully insured or self-funded ASO with stop-loss
        - Opaque negotiated commercial fee schedule (percentage of charge / RBRVS markup)
        - Tiered copayments, upfront deductible, and 20–30% coinsurance up to ACA out-of-pocket maximum
        - High predictable coverage inside network offset by 15–20% higher employer premiums and surprise out-of-network bills
      - - Digital Insurtech (Oscar)
        - Individual off/on exchange and small group HMO/EPO
        - Contracted fee schedule with narrow provider panels
        - Standard ACA tier design (Bronze/Silver/Gold) with copays and coinsurance
        - Modern member app experience offset by narrow provider selection and limited large-group enterprise adoption
      - - Reference-Based Pricing (RBP)
        - Self-funded employer plan administered by specialty TPA
        - Medicare reimbursement multiple (e.g., 140–160% of Medicare)
        - Deductible and coinsurance; balance bill defense support provided by vendor
        - Aggressive employer cost control offset by severe provider balance-billing disputes and patient collection threats
    notes: Pricing structures reflect disclosed benefit amount policies, commercial network fee schedules, and self-pay reimbursement mechanics.
