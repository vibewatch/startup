  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: employer-retention-metrics
      missingEvidence: Audited cohort retention, group policy renewal rates, and state-level covered life counts for large employer plans.
      whyItMatters: Without audited group renewal rates, underwriting cannot confirm whether employers sustain multi-year adoption or churn back to traditional PPO plans after encountering member price-shopping friction.
      diligencePath: Request historical cohort renewal tables and broker commission persistence schedules directly from management under NDA.
      relatedQuestionRefs:
        - QP007
        - QP008
    - type: missing-source
      severity: material
      topic: balance-billing-variance
      missingEvidence: Empirical distribution of member cash variances above Benefit Amounts across acute and surgical claims.
      whyItMatters: Exceeding the Benefit Amount exposes members to direct balance billing that does not accrue to out-of-pocket maximums, which could severely depress employee satisfaction if frequent.
      diligencePath: Analyze anonymized claims adjudication distributions comparing billed provider cash rates against plan Benefit Amounts.
      relatedQuestionRefs:
        - QP005
        - QP008
