    whyItMatters: >-
      Reported cost savings currently rely primarily on internal claims benchmarking and marketing figures rather than
      peer-reviewed actuarial audits.
    diligencePath: >-
      Obtain independent Milliman or actuary audit reports evaluating claims experience against standard commercial
      plans.
    relatedQuestionRefs:
      - QU002
  - type: missing-source
    severity: material
    topic: statutory-capital-and-loss-ratios
    missingEvidence: >-
      Audited statutory financial statements, medical loss ratios (MLR), risk-based capital (RBC) percentages, and
      underwriting reserves for Sidecar Health Insurance Company, Inc.
    whyItMatters: >-
      Without statutory filings, investors cannot evaluate whether fixed Benefit Amount payments adequately protect
      underwriting margins against severe medical claims volatility.
    diligencePath: Obtain NAIC annual statutory statements and Ohio Department of Insurance financial examination reports.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
