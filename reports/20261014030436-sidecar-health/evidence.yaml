evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: >-
      Audited statutory annual statements, 2024-2026 revenue run-rate, medical loss ratios, and cash balance data from
      state insurance regulators or audited accounting reports.
    whyItMatters: >-
      Without verified statutory financial filings or audited loss ratios, it is impossible to evaluate whether Sidecar
      Health's fixed Benefit Amount model achieves sustainable underwriting profitability or requires ongoing equity
      subsidies.
    diligencePath: >-
      Request NAIC annual and quarterly statutory financial statements for Sidecar Health Insurance Company, Inc. (NAIC
      #17104) from the Ohio Department of Insurance or company management.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: cap-table-governance-gap
    missingEvidence: >-
      Fully diluted capitalization table, preferred stock liquidation preferences, and board voting agreements for
      Series D financing.
    whyItMatters: >-
      Complete ownership percentages and governance rights cannot be established from public investor announcements
      alone.
    diligencePath: Obtain the Series D stock purchase agreement and certified capitalization table during formal legal diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-scale
    missingEvidence: >-
      Audited employer customer count, enrolled covered member lives, and renewal rates across active states (Florida,
      Georgia, Ohio).
    whyItMatters: >-
      Without verified enrollment numbers, serviceable obtainable market (SOM) penetration and revenue scale cannot be
      reliably modeled.
    diligencePath: >-
      Request insurer state regulatory filings, NAIC statutory filings, or management disclosure of group lives under
      administration.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: employer-retention-metrics
    missingEvidence: >-
      Audited cohort retention, group policy renewal rates, and state-level covered life counts for large employer
      plans.
    whyItMatters: >-
      Without audited group renewal rates, underwriting cannot confirm whether employers sustain multi-year adoption or
      churn back to traditional PPO plans after encountering member price-shopping friction.
    diligencePath: >-
      Request historical cohort renewal tables and broker commission persistence schedules directly from management
      under NDA.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: missing-source
    severity: material
    topic: balance-billing-variance
    missingEvidence: Empirical distribution of member cash variances above Benefit Amounts across acute and surgical claims.
    whyItMatters: >-
      Exceeding the Benefit Amount exposes members to direct balance billing that does not accrue to out-of-pocket
      maximums, which could severely depress employee satisfaction if frequent.
    diligencePath: >-
      Analyze anonymized claims adjudication distributions comparing billed provider cash rates against plan Benefit
      Amounts.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited GAAP financial statements, statutory balance sheet statements for Sidecar Health Insurance Company, Inc.,
      and annual medical loss ratios for fiscal years 2024 through 2026.
    whyItMatters: >-
      Without audited financial statements and statutory filings, underwriters and investors cannot evaluate
      underwriting profitability, reserve adequacy, or baseline cash burn.
    diligencePath: >-
      Request NAIC statutory annual and quarterly financial filings, audited income statements, and actuarial reserve
      certifications under NDA.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Audited commercial metrics detailing covered lives, group employer client counts, retention and renewal rates, and
      ARR/ASO fee mix by state.
    whyItMatters: >-
      Third-party estimates show massive divergence ($25M to $265M), preventing verification of actual operational
      scale, unit revenue per member, or renewal durability.
    diligencePath: >-
      Require management reporting schedules showing contracted group accounts, enrolled subscriber lives, cohort
      retention rates, and fee revenue breakdown.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: Public developer platform documentation, API schemas, or open-source software repositories for Sidecar Health.
    whyItMatters: >-
      Developer-signal evaluates engineering openness and direct platform integration capabilities for enterprise
      benefits software.
    diligencePath: >-
      Request engineering architecture documentation and proprietary API specifications directly from Sidecar Health
      technical leadership.
    relatedQuestionRefs:
      - QE003
  - type: private-evidence-only
    severity: material
    topic: Customer retention and cohort renewal metrics
    missingEvidence: >-
      Audited employer account retention rates, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and member
      covered lives churn by plan year.
    whyItMatters: >-
      Without renewal and cohort expansion data, long-term customer lifetime value and the durability of employer
      adoption cannot be verified.
    diligencePath: Request confidential employer renewal cohorts and broker retention reports under NDA during management diligence.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: Comprehensive census of enterprise employer clients
    missingEvidence: >-
      Full enumeration of enterprise employer accounts, covered lives per client, and commercial contract terms beyond
      public case studies and Koch Industries.
    whyItMatters: >-
      Public disclosure is limited to a small sample of partners, obscuring customer concentration risks and total
      enrolled group lives.
    diligencePath: Review master customer lists, top-ten account concentration percentages, and ASO client billings.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: Independent actuarial cost-reduction benchmarks
    missingEvidence: >-
      Third-party audited actuarial comparisons verifying Sidecar Health's claimed 20% premium reduction and 45% ER
