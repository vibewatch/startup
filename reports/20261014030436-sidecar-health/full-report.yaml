      - number: '1.3'
        title: Capitalization History, Valuation Trajectory, and Investor Backing
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health has accumulated approximately $328 million in equity financing across four institutional
              venture capital rounds. The company raised an initial $18 million round in August 2019 led by GreatPoint
              Ventures to initiate market entry, followed by a $20 million financing in July 2020 led by Cathay
              Innovation with participation from Comcast Ventures, Kauffman Fellows, and 23andMe co-founder Anne
              Wojcicki. In January 2021, Sidecar Health achieved unicorn status upon closing a $125 million Series C
              round led by Drive Capital with BOND, Tiger Global Management, and Menlo Ventures, establishing an
              estimated $1.0 billion post-money valuation mark. Most recently, in June 2024, the company secured a $165
              million Series D investment led by Koch Disruptive Technologies, alongside strategic validation as Koch
              Industries announced plans to deploy Sidecar Health medical coverage across workforce segments and
              co-design employer plan solutions. Although third-party platforms benchmark Sidecar Health's valuation at
              approximately $1.2 billion following the Series D round, formal capitalization details, liquidation
              preference structures, and secondary transaction discounts remain confidential private company data.
