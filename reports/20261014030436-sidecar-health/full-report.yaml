  - id: FI001
    title: Revenue Model Bridge Flow
    type: flow
    summary: >-
      Visual flow tracing how employer procurement converts into premium and fee revenue, cash-pay provider settlement,
      member cash-back incentives, and gross profit.
    data:
      nodes:
        - id: emp-procure
          label: Employer Plan Procurement
          detail: Large group employers (51+ employees) select fully insured or self-funded ASO plans.
        - id: rev-inflow
          label: Premium & Fee Inflow
          detail: >-
            Insured group premiums flow to Sidecar Health Insurance Company; ASO fees flow to Sidecar Health Insurance
            Solutions.
        - id: card-fund
          label: Member Card Disbursement
          detail: Members receive Benefit Amounts loaded onto Sidecar Health Visa cards for point-of-care cash payments.
        - id: prov-settle
          label: Provider Cash-Rate Settlement
          detail: >-
            Healthcare providers bill discounted cash rates directly, bypassing prior authorizations and network
            contracts.
        - id: incentive-split
          label: Incentive Cash-Back Split
          detail: If provider fee is below Benefit Amount, member retains 50% cash back; excess costs billed to member.
        - id: gross-margin
          label: Underwriting & Operating Margin
          detail: Residual premium after medical losses yields underwriting margin; ASO retains net administrative margin.
      edges:
        - from: emp-procure
          to: rev-inflow
        - from: rev-inflow
          to: card-fund
        - from: card-fund
          to: prov-settle
        - from: prov-settle
          to: incentive-split
        - from: incentive-split
          to: gross-margin
    claimRefs:
      - CI002
      - CI004
      - CI005
      - CI006
      - CI011
      - CI014
  - id: FE001
    title: Product and Operating Architecture Stack
    type: stack
    summary: Six-layer technical and operating stack governing Sidecar Health's consumer-directed major medical delivery model.
    data:
      layers:
        - label: 'Layer 1: Member Experience & Transparency Surface'
          detail: Consumer mobile and web interfaces delivering pre-care price discovery and receipt capture.
          items:
            - Pre-Care Price Discovery Search (CPT/NDC Code Lookup)
            - GAM Clinical Quality Rating Displays (0.00 to 5.00 Score)
            - Mobile Receipt & Superbill Digital Ingestion
            - Digital Benefit Card Management & Savings Wallet
        - label: 'Layer 2: Point-of-Sale Financial Rails'
          detail: Point-of-sale payment clearing connecting members directly to healthcare providers.
          items:
            - Sidecar Health Branded Visa Debit Payment Card
            - Real-Time Point-of-Sale Claims Account Funding
            - Provider Merchant Category Code (MCC) Authorization
            - Immediate Cash-Pay Check-In & Settlement Rails
        - label: 'Layer 3: Benchmark Pricing & Incentives Engine'
          detail: Proprietary pricing algorithms calibrating procedure allowances to local market cash rates.
          items:
            - Local Market Benchmark Indexing Engine (Benefit Amounts)
            - CPT, DRG, and NDC Procedure & Medication Taxonomy
            - Automated 50% Savings Cash-Back Rebate Disbursal
            - Member Balance Billing & Direct Debit Reconciliation
        - label: 'Layer 4: Adjudication & Regulatory Compliance'
          detail: Rules engine verifying ACA EHB compliance, deductibles, and clinical necessity.
          items:
            - Post-Service Automated Code & Receipt Auditing
            - Sub-1% Clinical Denial Adjudication Pipeline
            - ACA Essential Health Benefits (EHB) Compliance Validator
            - Deductible & Out-of-Pocket Maximum Accounting Engine
        - label: 'Layer 5: Clinical Quality & Bundled Centers of Excellence'
          detail: Vetted surgical and oncology networks providing pre-negotiated bundled rates and warranties.
          items:
            - Carrum Health 1,200+ Centers of Excellence Bundled Network
            - Global Appropriateness Measures (GAM) Clinical Quality Scores
            - Pre-Negotiated All-Inclusive Surgical & Oncology Case Rates
            - Two-Year Cancer Care & 30-Day Surgical Guarantees
        - label: 'Layer 6: Underwriting & Carrier Governance'
          detail: Statutory insurance carriers, administrative entities, and reinsurance risk transfer.
          items:
            - 'Sidecar Health Insurance Co. Underwriting (NAIC #17104)'
            - Sidecar Health Insurance Solutions, LLC (ASO/TPA Services)
            - Fully Insured Group Product Licensing (FL, GA, OH, TX)
            - Specific & Aggregate Stop-Loss Reinsurance Interfacing
    approximationNotes: >-
      Architecture layers structured from company disclosures, regulatory filings, and partner integration
      announcements.
    claimRefs:
      - CE001
      - CE005
      - CE008
      - CE010
      - CE013
      - CE014
