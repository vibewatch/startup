      - number: '8.2'
        title: Capitalization Structure, Series D Pricing, and Financing Context
        blocks:
          - type: paragraph
            body: >-
              With $328 million raised across four equity financing rounds, Sidecar Health has built substantial
              capitalization to fund carrier operations and geographic market expansions. The June 2024 Series D
              infusion brought major institutional and strategic partners to the cap table, notably Koch Disruptive
              Technologies, BOND, Drive Capital, and Menlo Ventures. While the $1.2 billion valuation established
              unicorn status, private secondary estimates indicate revenue multiples ranging widely from 4.5x to over
              30x depending on modeled top-line estimates. Furthermore, the commercial transition from fixed-indemnity
              plans to comprehensive ACA-compliant major medical limits fully insured risk underwriting to Florida,
              Georgia, and Ohio, leaving multi-state growth heavily reliant on self-funded ASO capabilities. Without
              transparent liquidation preference waterfalls and governance covenants, new equity capital faces
              structural seniority risk.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
