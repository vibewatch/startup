        title: Enterprise Deployments and Member Proof
        blocks:
          - type: paragraph
            body: >
              Enterprise customer validation reached a pivotal milestone with the commercial partnership between Sidecar
              Health and industrial conglomerate Koch Industries. In conjunction with Koch Disruptive Technologies
              leading Sidecar's $165 million Series D financing round, Koch Industries—which provides healthcare
              coverage across a workforce exceeding 100,000 employees—selected Sidecar Health major medical coverage for
              an initial segment of its workforce beginning in 2025. Additionally, Koch acts as a formal co-design
              partner to tailor Sidecar's coverage mechanics for jumbo employers. Geographic expansion has also relied
              on targeted market launches, including Pierpont Communications coordinating media and market entry
              campaigns across major Texas metropolitan centers. At the individual employee level, published member
              testimonials from patients undergoing cancer therapy and complex care highlight substantial out-of-pocket
              savings and freedom from traditional narrow network constraints, though public evidence remains restricted
              to self-selected marketing cohorts.
