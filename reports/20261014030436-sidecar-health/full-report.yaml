            body: >-
              With independent estimates of annual revenue spanning a massive range from $25 million to $265 million,
              and no publicly available statutory loss-ratio or cash-burn filings, underwriters cannot determine whether
              Sidecar Health is approaching self-sustaining unit economics or burning through its $165 million Series D
