  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Licensing, and Geographic Rollout Risks
        blocks:
          - type: paragraph
            body: >
              Sidecar Health has fundamentally restructured its regulatory architecture by discontinuing its legacy
              individual fixed-indemnity Access Plans, which previously subjected the firm to consumer criticism over
              out-of-pocket exposure and restricted benefits. The carrier now operates exclusively in the employer
              market for organizations with 51 or more employees, providing fully ACA-compliant large-group major
              medical coverage alongside Administrative Services Only (ASO) solutions for self-funded employers. Fully
              insured policies are legally underwritten by Sidecar Health Insurance Company, Inc., an Ohio-domiciled
              entity operating under NAIC #17104.


              However, geographic distribution remains tightly circumscribed by state insurance department
              authorizations. As of 2026, Sidecar Health's fully insured employer health plans are restricted to just
              three jurisdictions: Florida, Georgia, and Ohio. While self-funded arrangements and network-free payment
              cards support members across 44 states, expansion of full-risk underwriting into additional major
              commercial states requires multi-year state department approvals, capital commitments, and statutory
              reserve deposits. Any regulatory delays in securing Form A approvals or state market licenses will
              constrain top-line addressable market growth and lengthen the runway required to achieve national scale.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
