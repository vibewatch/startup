        title: Executive Leadership, Founder Backgrounds, and Governance
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health is led by co-founders Patrick Quigley and Veronica Osetinsky, representing their third
              joint entrepreneurial venture following senior executive tenures at health insurance enrollment platform
              Katch. Chief Executive Officer Patrick Quigley previously served as CEO of Katch and was a member of the
              founding management team at QuinStreet (NASDAQ: QNST), combining digital customer acquisition expertise
              with private equity and venture leadership backgrounds. Chief Operating Officer Veronica Osetinsky oversaw
              the growth and eventual sale of Healthplans.com within Katch, bringing extensive operational execution,
              product scaling, and institutional finance experience from Banc of America Securities and securitized
              asset management. Key functional leaders include Chief Financial Officer and Chief Actuary Douglas Lynch,
              who oversees statutory insurance solvency, reserve adequacy, and rate filings, alongside Chief Technology
              Officer Rodney Barlow, who directs platform development, real-time claims integration, and transparency
              tooling. The executive team exhibits strong founder-market fit in health insurance customer acquisition
              and plan administration, though strategic reliance on the co-founders creates notable key-person exposure
              during current commercial expansion.
