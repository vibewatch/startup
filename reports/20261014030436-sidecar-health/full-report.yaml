      - number: '4.3'
        title: Cost Structure and Unit Economics Drivers
        blocks:
          - type: paragraph
            body: >-
              The company's underlying unit economics depend on whether direct cash-pay pricing and consumer price
              shopping can reliably suppress aggregate medical loss costs below standard carrier benchmarks. Sidecar
              Health claims its transparent model delivers an estimated 20 percent reduction in employer premiums
              compared to legacy group plans, alongside a 45 percent reduction in emergency department utilization
              compared to Milliman commercial average assumptions. By encouraging members to select cost-effective
              outpatient providers and local imaging centers, Sidecar aims to reduce total medical claim disbursements,
              capturing a wider gross margin before administrative expenses.


              However, unit-level profitability remains difficult to corroborate independently because Sidecar Health
              does not publicly report audited Medical Loss Ratios (MLRs), statutory loss adjustment expenses, or member
              acquisition costs. Operating expenses include the maintenance of regional healthcare price databases,
              payment card clearing transaction charges, broker distribution commissions, and administrative customer
              support for balance-billing disputes. If providers demand rates significantly higher than Benefit Amounts,
              members face out-of-pocket balance-billing liabilities that do not accrue toward their annual
              out-of-pocket maximum, potentially impairing member retention and driving churn. While the elimination of
              prior authorization overhead reduces clinical review administrative costs, it shifts financial risk to
              actuarial pricing accuracy and automated post-service claims adjudication.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
          - type: table
            tableRef: TI003
