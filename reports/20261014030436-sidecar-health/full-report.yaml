              - CV007
              - CV008
      - number: '8.3'
        title: Scenario Modeling, Return Asymmetry, and Downside Triggers
        blocks:
          - type: paragraph
            body: >-
              Scenario modeling highlights pronounced return asymmetry for prospective late-stage investors at current
              valuation levels. In the bull case, rapid adoption of Administrative Services Only arrangements among
              self-funded employers nationwide drives premium equivalents above $300 million, supporting an enterprise
              valuation between $1.8 billion and $2.5 billion under favorable commercial multiples. The base case
              reflects steady enterprise deployment with Koch and regional employers across existing licensed states,
              yielding an intrinsic valuation of $900 million to $1.2 billion that roughly matches the Series D
              post-money watermark. Conversely, the bear case models significant underwriting margin compression,
              consumer friction over non-preventive deductibles, and adverse member churn, causing the valuation
              multiple to compress toward 3.0x revenue and dropping equity value to $350 million to $600 million.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV014
