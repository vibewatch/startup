chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Regulatory Foundation
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health was founded in 2018 by Patrick Quigley and Veronica Osetinsky in El Segundo, California,
              aiming to address stark healthcare price opacity where cash prices for standard procedures frequently sit
              far below insured chargemaster rates. The company operates as a full-stack health insurance provider and
              third-party administrator, offering fully ACA-compliant comprehensive major medical plans for employer
              groups with 51 or more employees alongside Administrative Services Only (ASO) solutions for self-funded
              plans. Rather than contracting narrow provider networks that restrict access or impose prior authorization
              delays, Sidecar Health utilizes an innovative Benefit Amount architecture that pays members a fixed local
              cash-equivalent reimbursement for covered medical services, allowing policyholders to access any licensed
              healthcare provider across the United States. To underwrite its major medical insurance contracts
              directly, the company formed an Ohio-domiciled carrier, Sidecar Health Insurance Company, Inc. (NAIC
              #17104), licensed to offer fully insured group coverage in Ohio, Florida, and Georgia, while administering
              self-funded programs across broader national geographies.
