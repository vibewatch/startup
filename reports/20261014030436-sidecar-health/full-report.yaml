      - number: '6.2'
        title: Adoption Trajectory and Operational Metrics
        blocks:
          - type: paragraph
            body: >
              Commercial adoption of Sidecar Health's employer offering is anchored in measurable claim adjudication
              performance and pharmacy routing efficiencies. The company markets an estimated 20% premium reduction
              compared to conventional major medical group plans quoted in 2025, positioning affordability as its
              central acquisition lever for benefits brokers and cost-sensitive employers. Operational claims data
              released by the company indicates that 75% of member prescriptions are filled at lower-cost retail
              pharmacies, while member emergency room utilization runs 45% below Milliman nationwide commercial baseline
              benchmarks. Crucially for member retention and provider acceptance, Sidecar Health reported an
              adjudication record with more than 99% of processed claims approved and a clinical denial rate below 1%
              for plan year 2025. However, because comprehensive covered lives counts, employer renewal rates, and
              regional retention cohorts remain private, verified scale must be separated from promotional claims
              performance metrics.
