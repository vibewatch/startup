      - number: '4.2'
        title: Pricing Structure and Monetization Dynamics
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health's monetization framework replaces conventional negotiated provider networks with
              transparent cash-pay pricing benchmarks. Rather than maintaining contracted fee schedules or narrow
              physician networks, the company publishes predefined Benefit Amounts for thousands of shoppable medical
              procedures, laboratory evaluations, and pharmaceutical treatments, derived from regional cash-rate
              benchmarks. When an enrolled member seeks non-emergency care, they utilize a Sidecar Health Visa payment
              card to pay the provider's direct self-pay rate at the point of service, bypassing prior authorization
              requirements.


              The plan's First Dollar coverage structure aligns the deductible directly with the out-of-pocket
              maximum—typically established at $3,000 for individual coverage and $6,000 for family plans in large-group
              deployments—eliminating standard copayments and percentage coinsurance for covered services priced at or
              below Benefit Amounts. To drive consumer engagement, the plan incorporates a shared-savings cash-back
              mechanism: when a member shops effectively and secures care below the published Benefit Amount, Sidecar
              refunds 50 percent of the realized savings directly to the member. In plan year 2025 claims data, Sidecar
              reported that 78 percent of processed claims resulted in zero member cost or net cash back, with
              participating families of four averaging $989 in annual cash-back distributions. For high-cost complex
              episodes, Sidecar integrates bundled surgical and oncology packages via Carrum Health Centers of
              Excellence, realizing pre-negotiated package discounts of up to 45 percent.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
