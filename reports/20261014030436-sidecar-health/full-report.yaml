  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Member Workflow
        blocks:
          - type: paragraph
            body: >
              Sidecar Health delivers comprehensive major medical health insurance designed around a consumer-driven
              cash-pay purchasing model rather than restrictive managed-care networks. Exclusively serving large
              employers with 51 or more employees across fully insured and self-funded administrative services only
              (ASO) structures, Sidecar Health eliminates traditional health maintenance organization (HMO) and
              preferred provider organization (PPO) gatekeeping mechanisms. The platform imposes no in-network or
              out-of-network provider restrictions, requires no primary care physician referrals, and removes
              pre-service prior authorization requirements for covered care. Instead, members are treated as cash-paying
              consumers authorized to receive healthcare services from any licensed medical physician, specialist,
              hospital facility, or retail pharmacy nationwide.


              The end-to-end user workflow is anchored by the Sidecar Health mobile application and portal, which
              translates complex medical coding (CPT, DRG, and NDC classifications) into understandable pre-care pricing
              disclosures. Before seeking medical care, a member searches for the scheduled procedure or prescription
              drug to review its predetermined Benefit Amount—a standardized benchmark allowance calibrated to
              prevailing local market cash prices. At the point of care, members present a dedicated Sidecar Health Visa
              payment card funded from the plan's claims account to pay providers directly at discounted cash-pay or
              self-pay rates. Following service delivery, the member uploads an itemized medical bill or receipt through
              the mobile application for administrative adjudication.


              A core economic mechanism of the product design is the two-way shared incentive structure governing
              procedure pricing. When an engaged member navigates to a cost-effective provider whose cash charge falls
              below the designated Benefit Amount, the plan reimburses the member with half of the realized savings as
              cash back deposited directly into their account. Conversely, if a member selects a provider whose cash
              charge exceeds the published Benefit Amount, the member is responsible for covering the incremental cost
              difference. According to company disclosures and commercial filings, nearly 80% of processed claims settle
              at or below the published Benefit Amount, with 93% of claims resulting in zero out-of-pocket cost above
              the benefit, cash back, or an outlay lower than standard commercial copayments.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
