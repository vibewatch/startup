      - number: '6.4'
        title: Retention Mechanisms and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Customer retention and plan durability depend heavily on member navigation mechanics and the avoidance of
              out-of-pocket billing friction. Sidecar Health's model eliminates prior authorizations, physician
              referrals, and restrictive formularies, issuing members a physical VISA benefit card to pay healthcare
              providers directly at point-of-service cash rates. When members shop for care below Sidecar's
              predetermined Benefit Amount, the plan returns half the cash savings directly to the patient. Despite
              positive testimonial feedback, adverse evidence from consumer watchdog reviews and Better Business Bureau
              filings highlights persistent friction: when provider charges exceed fixed Benefit Amounts, members face
              unexpected out-of-pocket balance billing. Furthermore, with external trackers recording an operating team
              of approximately 259 employees, Sidecar Health faces customer concentration risks where jumbo
              implementations like Koch Industries absorb substantial operational capacity relative to established
              national carriers.
