            body: >-
              Sidecar Health's bifurcation into a fully insured carrier (Sidecar Health Insurance Company, Inc.) in
              Florida, Georgia, and Ohio, paired with a non-risk Administrative Services Only entity across dozens of
              states, creates two distinct revenue engines. While fully insured employer premiums generate larger
              top-line figures, they require heavy statutory reserves and expose Sidecar to claims volatility. The ASO
              offering represents higher-margin, balance-sheet-light fee revenue that can scale nationally without
              carrier licenses in every state.
            calloutType: insight
