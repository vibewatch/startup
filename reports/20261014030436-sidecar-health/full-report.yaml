      - number: '2.2'
        title: Addressable Market Sizing, Sizing Lenses, and Macro Inefficiencies
        blocks:
          - type: paragraph
            body: >-
              Evaluating Sidecar Health's total addressable market requires disaggregating macro healthcare waste
              estimates from realistic, regulatory-constrained commercial insurance pools. Top-down venture narratives
              frequently cite an addressable ceiling exceeding one trillion dollars in annual U.S. healthcare
              administrative waste and price distortion, as highlighted in early funding documentation from Cathay
              Innovation. In more concrete commercial terms, U.S. employer-sponsored health coverage represents an
              annual expenditure pool surpassing $1.25 trillion, providing medical coverage to over 160 million
              Americans. However, Sidecar Health's actual serviceable addressable market (SAM) is tightly constrained by
              product structure and regulatory licensing. Fully insured plans remain restricted to large group employers
              based in Florida, Georgia, and Ohio, representing an estimated regional commercial expenditure pool of
              approximately $115 billion. Furthermore, the model's consumer-directed cash-pay mechanism applies most
              effectively to shoppable outpatient care, elective surgeries, diagnostic imaging, and routine specialist
              visits—a segment representing roughly $350 billion nationally—while high-acuity trauma and non-elective
              inpatient admissions offer limited scope for pre-service price comparison. Crucially, because Sidecar
              Health remains a private venture-backed insurer that has not disclosed audited customer employer counts or
              enrolled member lives, its serviceable obtainable market (SOM) share cannot be independently verified,
              representing an essential diligence question for underwriters and co-investors.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM014
