      Chronological development of Sidecar Health from founding and individual indemnity plans to ACA major medical
      carrier status and national ASO expansion.
    data:
      items:
        - date: '2018'
          label: Company Founded
          detail: >-
            Patrick Quigley and Veronica Osetinsky founded Sidecar Health in El Segundo, California, to create
            transparent healthcare pricing.
          tone: neutral
        - date: '2019'
          label: Access Plan Launched
          detail: >-
            Introduced fixed indemnity supplemental insurance product in Texas giving members price transparency and
            shopping tools.
          tone: neutral
