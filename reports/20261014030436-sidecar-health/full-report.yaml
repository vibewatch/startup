            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: Exit Readiness, Regulatory Hurdles, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health's eventual exit pathways will depend heavily on proving that its cash-pay major medical
              paradigm can achieve regulatory scale and sustained commercial renewal economics. An initial public
              offering requires consistent statutory capital reserves, low claim denial dispute rates, and multi-year
              GAAP profitability across diverse state jurisdictions. M&A acquisition interest from legacy commercial
              payers or large benefits brokers like Employee Navigator remains viable, yet incumbent acquirers will
              heavily discount unverified loss reserves and customer balance-billing dissatisfaction documented in BBB
              complaints. Prior to considering any equity transaction, diligence teams must demand audited statutory
              underwriting filings, employer group renewal cohort data, and detailed Series D liquidation preference
              documentation to quantify downside exposure.
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting Opacity and Downside Asymmetry
            body: >-
              Without public statutory disclosures or audited medical loss ratios, underwriting performance remains
              unverified. If claims severity exceeds Benefit Amounts, Sidecar Health faces either severe member friction
              or unhedged carrier loss absorption.
            calloutType: risk
            claimRefs:
              - CV003
              - CV007
          - type: callout
            title: Pre-Investment Diligence Prerequisites
            body: >-
              Institutional growth investors should maintain a research-more stance, demanding audited NAIC statutory
              blanks, multi-year employer account retention curves, and Series D liquidation preference waterfall
              mechanics before committing capital.
            calloutType: recommendation
            claimRefs:
