  - id: TV002
    title: 多空论点平衡
    columns:
      - 维度
      - 多方论点
      - 空方风险
      - 证伪触发条件
    rows:
      - - 产品与经济性
        - Fixed Benefit Amount 模式绕开不透明网络，降低企业成本
        - 消费者自付费用波动和非预防性免赔额摩擦引发会员投诉
        - BBB 投诉量上升，或雇主账户续约率低于 80%
      - - 商业规模
        - Koch Industries 企业合作和 ASO 能力支持大型团体覆盖
        - 全额承保的大型医疗计划在地域上仍限于佛罗里达、乔治亚和俄亥俄
        - 无法在关键工业州取得承保人许可或客户增长
      - - 资本结构
        - Koch、Drive Capital 和 BOND 主导的累计 $328M 股权融资提供扩张流动性
        - Series D 之后的清算优先权、票息条款和董事会否决权仍未披露
        - 二级市场交易折价超过 30%，或出现紧急内部人过桥融资
      - - 监管姿态
        - 转向符合 ACA 的大型医疗计划，消除了旧固定赔偿模式的合规风险
        - 州保险专员关注现金支付计费模式和消费者自付费用风险
        - 保险部门执法行动或州级市场行为处罚
    notes: 从结构性单位经济性、地域扩张和治理透明度三个维度比较多空论点。
