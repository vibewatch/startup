            body: >-
              Sidecar Health 通过两种运营和监管模式创收：承担风险的雇主团体健康保险保费，以及按费收取的自保计划管理费。对于拥有 51 名及以上员工的全额保险雇主，保障由 Sidecar Health
              Insurance Company, Inc. 承保，该公司注册地在 Ohio，获准在 Florida、Georgia 和 Ohio 提供大型团体大病医疗计划。在全额保险安排下，Sidecar
              从计划发起人处按月收取 Per Employee Per Month（PEPM）保费，并承担法定承保风险和医疗损失责任，受 ACA 标准医疗损失率最低要求约束。

              与此同时，Sidecar Health Insurance Solutions, LLC 作为 ASO 和 Third Party Administrator（TPA）机构，为覆盖 44 至 48
              个州的自保型企业雇主提供理赔裁定、福利卡发放和技术服务。这种自保安排把商业分销与直接资产负债表保险承保拆开，按每名承保员工产生稳定的经常性管理费，不让公司暴露于承保损失或法定资本准备金要求。商业采用由战略企业客户支撑，尤其是
              Koch Industries；Koch 承诺为部分员工提供 Sidecar 保障，并在领投后共同设计大型雇主保险方案。
