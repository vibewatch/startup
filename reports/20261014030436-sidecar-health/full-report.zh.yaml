      - number: '1.4'
        title: 战略演进、产品里程碑与运营风险
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 的商业演进，实质上是从早期个人补充型赔付保单转向机构雇主大病医疗保障。2019 年，初创公司推出 Access
              Plan，这一固定赔付产品用于测试预付现金定价和会员直接支付行为。但当医疗提供商收费大幅高于预设赔付额时，固定赔付计划会让保单持有人承担严重的差额账单责任，并引发用户争议及向 Better Business
              Bureau 投诉未获理赔。随后，Sidecar Health 于 2021 年设立受监管的 Ohio 保险公司，2022 年在 Ohio 推出符合 ACA 的雇主团体保障，2023 年扩展到
              Georgia，2024 年进入 Florida，并正式停止旧 Access Plan。公司还与 Employee Navigator 等平台建立商业分销合作以加快经纪人采用，并于 2025 年为自保雇主推出全国
              ASO 能力。尽管近期公司披露称临床理赔通过率超过 99%，雇主保费支出预计低 20%，但在没有经审计的法定申报前，承保盈利能力和会员赔付率仍未获验证。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
