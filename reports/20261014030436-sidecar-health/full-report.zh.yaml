  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与战略分类
        blocks:
          - type: paragraph
            body: >-
              雇主健康保险市场由根深蒂固的全国传统保险商寡头主导，主要包括 UnitedHealth Group、Elevance Health（Anthem）、Cigna 和 CVS Health（Aetna），通常统称
              BUCAH 保险商。这些在位者掌握庞大的议价提供商网络、深厚的经纪人分销渠道，并与自保型 Fortune 500 雇主保持牢固的 ASO 关系。Kaiser Permanente
              等封闭式整合医疗网络则把保障和直接医院服务合并成一个协调系统，将会员锁定在严格限定的护理环境中。

              过去十年，Oscar Health、Clover Health 和 Devoted Health
              等数字优先保险科技挑战者进入市场，试图用现代消费者移动体验、专有理赔路由软件和技术驱动的互动打破在位者垄断。但这些保险科技同业仍保留传统管理式医疗结构：Oscar 建立窄网络或分层网络，Clover 和
              Devoted 则集中于政府资助的 Medicare Advantage。Sidecar Health 与传统保险商及第一代保险科技公司明显不同。它没有构建受限提供商网络，而是作为符合 ACA
              的大病医疗保险商，以直接支付、固定 Benefit Amount 模式完全取代网络限制，成为按服务收费管理式医疗模式的结构性替代方案。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
