      - number: '1.2'
        title: 高管领导、创始人背景与治理
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 由联合创始人 Patrick Quigley 和 Veronica Osetinsky 领导，这是两人在健康保险投保平台 Katch 担任高管后共同创办的第三家企业。首席执行官
              Patrick Quigley 曾任 Katch CEO，也是 QuinStreet（NASDAQ: QNST）创始管理团队成员，将数字客户获客能力与私募股权、风险投资领导经验结合起来。首席运营官
              Veronica Osetinsky 曾负责 Katch 内 Healthplans.com 的增长和最终出售，并带来 Banc of America Securities
              及证券化资产管理方面的机构金融经验。核心职能负责人还包括负责法定保险偿付能力、准备金充足性和费率申报的首席财务官兼首席精算师 Douglas Lynch，以及负责平台开发、实时理赔整合和透明度工具的首席技术官
              Rodney Barlow。团队很懂健康保险获客和计划管理，创始人与市场高度匹配，但目前的商业扩张仍高度依赖两位创始人，形成明显的关键人风险。
