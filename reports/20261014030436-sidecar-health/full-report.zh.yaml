      - number: '3.2'
        title: 核心能力与运营架构
        blocks:
          - type: paragraph
            body: >-
              按雇主的核心购买标准评估，Sidecar Health
              以与传统及数字优先竞争者截然不同的运营机制切入市场。其产品的核心是提供商通用可及性：会员无需承担网络外财务惩罚或转诊瓶颈，即可在全国任意持牌医生、专科医生、急诊诊所或医院就诊。相比之下，传统商业保险商在会员离开签约网络就医时会施加很高的分摊差异，常常让免赔额和共同保险翻倍。

              同样具有改变性的是 Sidecar Health 取消了承保大病医疗服务的事前授权。商业保险商越来越多地用利用管理和预认证门槛限制高价影像、手术和专科药品，Sidecar 则依靠预先公布的 Benefit
              Amount 和客观临床适宜性工具（如 GAM Care Quality Score）引导选择。Sidecar 报告临床理赔拒绝率低于
              1%，而传统保险商通过医疗必要性审查拒绝相当一部分理赔。针对灾难性专科和手术治疗，Sidecar 通过 Carrum Health 整合打包病例支付，在超过 1,200
              家经过审核的卓越中心提供预协商的全包价格，在不采用传统网络限制的情况下实现 45% 的病例成本下降。
