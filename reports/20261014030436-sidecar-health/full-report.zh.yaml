      - number: '1.3'
        title: 资本化历史、估值轨迹与投资者支持
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 通过四轮机构风险投资累计获得约 $328 million 股权融资。公司于 2019 年 8 月获得 GreatPoint Ventures 领投的首轮 $18
              million，用于进入市场；随后于 2020 年 7 月获得 Cathay Innovation 领投的 $20 million，Comcast Ventures、Kauffman Fellows 及
              23andMe 联合创始人 Anne Wojcicki 参与。2021 年 1 月，公司完成 Drive Capital 领投、BOND、Tiger Global Management 和 Menlo
              Ventures 参与的 $125 million Series C，成为独角兽，投后估值估计约 $1.0 billion。最近一次是 2024 年 6 月，Koch Disruptive
              Technologies 领投 $165 million Series D；Koch Industries 同时宣布计划向部分员工提供 Sidecar Health 医疗保障，并共同设计雇主计划。虽然第三方平台在
              Series D 后将 Sidecar Health 估值基准定在约 $1.2 billion，但正式资本结构、清算优先权安排和二级交易折价仍属于保密的非上市公司数据。
