            body: >
              Sidecar Health 已完成有意的战略转向，停止历史个人 Access Plan 固定赔付保障，只为拥有 51 名及以上员工的组织提供雇主大病医疗保险。商业买方从两种监管和财务结构评估 Sidecar
              Health：大型团体全额保险，以及自保 ASO 方案。全额保险雇主计划的承保权由 Sidecar Health Insurance Company, Inc. 行使，截至 2026 年末，商业上仍仅在
              Florida、Georgia 和 Ohio 可用。自保 ASO 让大型多州雇主绕过单州保险商限制，同时部署 Sidecar 的透明支付模式。为触达中型市场和企业福利管理者，公司借助 Employee
              Navigator 等经纪人技术市场，让独立员工福利顾问直接为企业决策者建模并分销 Sidecar 计划。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
