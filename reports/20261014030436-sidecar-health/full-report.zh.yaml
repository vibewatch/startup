    title: 公司里程碑时间线
    type: timeline
    summary: Sidecar Health 从创立和个人赔偿计划起步，发展到 ACA 大型医疗承保人资质及全国 ASO 扩张的时间顺序。
    data:
      items:
        - date: '2018'
          label: 公司成立
          detail: Patrick Quigley 和 Veronica Osetinsky 在加利福尼亚州埃尔塞贡多创立 Sidecar Health，旨在打造透明的医疗定价。
          tone: neutral
        - date: '2019'
          label: Access Plan 上线
          detail: 在得州推出固定赔偿补充保险产品，提供价格透明度和比价工具。
          tone: neutral
        - date: 2020-07
          label: Series B 融资
          detail: Cathay Innovation 领投 $20M，Comcast Ventures 和 Anne Wojcicki 跟投，早期会员数增长至三倍。
          tone: positive
        - date: 2021-01
          label: Series C 独角兽轮融资与承保人组建
          detail: Drive Capital 领投 $125M，估值达到 $1B；在俄亥俄州成立 Sidecar Health Insurance Company, Inc.。
          tone: positive
        - date: '2022'
          label: 大型团体市场上线
          detail: 在俄亥俄州推出符合 ACA 的全额承保大型医疗雇主计划，开始转向团体保障。
          tone: positive
        - date: '2023'
          label: 东南部扩张
          detail: 将符合 ACA 的雇主计划扩展至乔治亚州，并建立卓越中心手术打包支付合作关系。
          tone: positive
        - date: 2024-06
          label: Series D 融资与 Access Plan 退出
          detail: Koch Disruptive Technologies 领投 $165M；扩展至佛罗里达州，并停止销售个人 Access Plan。
          tone: positive
        - date: '2025'
          label: 全国 ASO 自筹资金方案上线
          detail: 为覆盖数十个州的全国性自筹资金雇主推出仅行政服务（ASO）能力。
          tone: positive
