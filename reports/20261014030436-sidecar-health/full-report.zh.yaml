      - number: '2.3'
        title: 买方分层、分销经济与采用约束
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 透明医疗计划的采用取决于三方互动：企业雇主计划发起人、持牌员工福利经纪人和员工计划参与者。主要经济买方通常是面对 UnitedHealth、Elevance 和 Blue Cross
              Blue Shield 等传统保险商反复上涨年度保费的首席财务官或人力资源副总裁。对于拥有 51 至 500 名员工的雇主，Sidecar Health
              以报价中的保费节省和免除传统自付额的首美元保障结构来定位全额保险计划。分销高度依赖独立福利经纪人及数字福利管理平台的整合，例如与 Employee Navigator 的市场合作。对经纪人而言，Sidecar
              提供差异化的成本控制叙事，以帮助其抵御传统保险通胀。对医疗提供商而言，医生在服务现场通过 Sidecar Health Visa 卡即时收款，避免保险账单延迟和坏账催收风险。公司披露称会员行为发生显著变化：相比
              Milliman 全国商业基准，急诊使用率低 45%，78% 的理赔实现返现或会员零成本。不过，采用仍有明显阻力：习惯零摩擦自付额层级的员工，如果提供商收费超过 Benefit
              Amount，可能承担差额账单，从而产生顾虑，经纪人和 HR 高管必须主动处理。
