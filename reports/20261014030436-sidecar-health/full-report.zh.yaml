  - id: TV001
    title: 建议摘要
    columns:
      - 参数
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 大额 Series D 资金注入，但损失率尚未核实
        - 在承保披露经审计前，暂缓承诺成长股权投资
      - - 信心
        - 中等
        - 已确认 $165M 的 Series D 融资，但雇主续约率未披露
        - 维持监测姿态，不投入资产负债表资金
      - - 风险评级
        - 高
        - 承保风险、非网络余额争议和州监管许可壁垒
        - 需要保护性清算契约和结构性下行风险缓释
      - - 估值立场
        - 偏高
        - $1.2B 投后估值意味着未经核实的营收规模对应较高倍数
        - 宏观环境恶化时，面临大幅下轮融资或倍数压缩风险
    notes: 建议和风险评估综合已公布的资本化里程碑与监管披露；估值倍数反映未经核实的外部估算。
