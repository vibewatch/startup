      - number: '2.2'
        title: 可服务市场规模、估值口径与宏观低效
        blocks:
          - type: paragraph
            body: >-
              评估 Sidecar Health 的总可寻址市场，需要把宏观医疗浪费估算与现实中受监管约束的商业保险池拆开。自上而下的风险投资叙事经常引用美国医疗体系每年超过一万亿美元的行政浪费和价格扭曲上限，Cathay
              Innovation 早期融资材料也强调过这一点。更具体地看，美国雇主医疗保障每年支出超过 $1.25 trillion，为超过 160 million 名美国人提供医疗保障。但 Sidecar Health
              的实际可服务市场（SAM）受到产品结构和监管牌照严格限制。全额保险计划目前仅面向位于 Florida、Georgia 和 Ohio 的大型团体雇主，预计对应地区商业支出池约 $115
              billion。此外，面向消费者的现金支付机制最适合可比价的门诊护理、择期手术、诊断影像和常规专科就诊，全国规模约 $350 billion；高严重度创伤和非择期住院则很难在服务前比价。更关键的是，Sidecar
              Health 仍是一家未披露经审计客户雇主数量或参保会员人数的私营风险投资保险公司，因此其可获取市场（SOM）份额无法独立验证，是承保人和共同投资者必须追问的事项。
            claimRefs:
