      - number: '4.4'
        title: 资本充足性与承保判断
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 资产负债表由约 $328 million 累计股权资本支持，核心是 Koch Disruptive Technologies 于 2024 年 6 月领投完成的 $165
              million Series D。此前股权轮包括 2019 年 $18 million 早期融资、2020 年 $20 million，以及 2021 年由 Drive Capital 领投、BOND 和
              Menlo Ventures 支持的 $125 million Series C，该轮使公司估值超过 $1 billion 并成为独角兽。Series D 资本为多州雇主市场扩张提供较长 runway，支持
              Ohio 的法定风险资本准备金，并为计划于 2028 年进入个人 ACA 交易所前的工程投入提供资金。

              从机构尽调角度看，Sidecar Health 的财务画像有吸引力但并不完整。商业模式得到 Koch
              的强力战略支持，现金返现也具备清晰的消费者吸引力，但严重的信息不对称掩盖了基本财务健康状况。第三方年度收入估算差异极大：Owler 为 $25 million 至 $100 million，Growjo 为
              $35.8 million，ZoomInfo 为 $265.1 million，说明缺乏可靠的收入披露。年度 GAAP
              损益表、现金消耗率和州保险监管机构法定准备金申报均无法公开取得。因此，承保人无法核实商业增长是否增厚价值，或当前运营是否由投资者股权维持。机构投资者必须以完整披露 NAIC
              法定申报、过去十二个月团体留存指标，以及 ASO 与全额保险分部利润率表为财务承保前提。
