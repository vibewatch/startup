      - number: '5.2'
        title: 产品线与运营架构
        blocks:
          - type: paragraph
            body: >
              Sidecar Health 的商业产品架构经历结构性转向，停止历史个人赔付产品（例如由 SiriusPoint America 或 United States Fire Insurance Company
              承保的旧 Access Plan），只做雇主大病医疗。当前商业目录分成两种核心交付方式：由 Sidecar Health Insurance Company, Inc.（NAIC #17104）承保、面向位于
              Ohio、Georgia、Florida 且近期扩展至 Texas 的雇主提供的 Employer-Sponsored Group Fully Insured Plans；以及通过 Sidecar Health
              Insurance Solutions, LLC 向全国自保型企业发起人提供的 ASO/TPA 方案。

              这些计划由四个核心运营层组成的整合技术栈支撑：Member Engagement、Financial & Payments Infrastructure、Core Adjudication & Pricing
              Engine，以及 Clinical Quality & Partner Integrations。Member Engagement
              层提供网页和移动界面，支持按地点比价、数字身份识别，以及用手机摄像头直接上传收据和账单。Financial & Payments 层整合商业 Visa
              发卡与实时账本授权，让医疗服务现场可以动态借记，同时减轻提供商差额账单摩擦。

              Core Adjudication Engine 会根据计划保障规则、基本健康福利（EHB）指引和会员免赔额审核上传的逐项账单。与强制人工临床利用审查和事前授权的传统保险商不同，Sidecar Health
              依赖服务后核验医疗账单编码和资格。2024 和 2025 计划年度内部运营指标显示，超过 99% 的已处理理赔获批，少于 1%
              受到临床拒赔，明显不同于商业健康保险平均拒赔水平。为保护雇主发起人免受灾难性波动影响，计划在标准 ACA 自付上限之外，还整合总额和特定止损再保险安排。
