  - id: FE001
    title: 产品与运营架构栈
    type: stack
    summary: 由六层组成的技术与运营栈，支撑 Sidecar Health 以消费者为导向的大型医疗交付模式。
    data:
      layers:
        - label: 第 1 层：会员体验与透明度界面
          detail: 提供护理前价格查询和收据采集的消费者移动端与网页界面。
          items:
            - 护理前价格查询（CPT/NDC 代码查询）
            - GAM 临床质量评级显示（0.00 至 5.00 分）
            - 移动收据与超级账单数字化采集
            - 数字福利卡管理与节省钱包
        - label: 第 2 层：服务点金融通道
          detail: 通过服务点支付清算，将会员直接连接到医疗服务方。
          items:
            - Sidecar Health 品牌 Visa 借记支付卡
            - 实时服务点理赔账户注资
            - 医疗服务方商户类别代码（MCC）授权
            - 即时现金支付签到与结算通道
        - label: 第 3 层：基准定价与激励引擎
          detail: 专有定价算法根据当地市场现金费率校准手术额度。
          items:
            - 本地市场基准索引引擎（Benefit Amount）
            - CPT、DRG 和 NDC 手术与药物分类体系
            - 自动发放 50% 节省返现
            - 会员余额计费与直接借记对账
        - label: 第 4 层：理赔裁定与监管合规
          detail: 核验 ACA EHB 合规性、免赔额和临床必要性。
          items:
            - 服务后自动代码与收据审计
            - 低于 1% 的临床拒付裁定流程
            - ACA 基本医疗福利（EHB）合规验证器
            - 免赔额与自付费用上限核算引擎
        - label: 第 5 层：临床质量与打包式卓越中心
          detail: 经审核的手术和肿瘤网络，提供预先协商的打包费率和保障。
          items:
            - Carrum Health 1,200+ 家卓越中心打包网络
            - 全球适宜性指标（GAM）临床质量评分
            - 预先协商的全包手术与肿瘤病例费率
            - 两年癌症护理与 30 天手术保障
        - label: 第 6 层：承保与承保人治理
          detail: 法定保险承保人、行政实体和再保险风险转移。
          items:
            - 'Sidecar Health Insurance Co. 承保（NAIC #17104）'
            - Sidecar Health Insurance Solutions, LLC（ASO/TPA 服务）
            - 全额承保团体产品许可（FL、GA、OH、TX）
            - 特定和累计止损再保险对接
