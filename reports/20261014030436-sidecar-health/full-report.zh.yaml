chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营模式与监管基础
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 由 Patrick Quigley 和 Veronica Osetinsky 于 2018 年在加利福尼亚州 El Segundo
              创立，试图解决医疗价格严重不透明的问题：标准医疗项目的现金价格往往远低于保险方的 chargemaster 费率。公司既是全栈健康保险提供商，也是第三方管理机构，为拥有 51 名及以上员工的雇主团体提供完全符合
              ACA 的综合大病医疗计划，并为自保计划提供 Administrative Services Only（ASO）方案。公司没有采用限制就医或造成事前授权延迟的窄网络，而是使用创新的 Benefit Amount
              架构，为会员的承保医疗服务支付固定的本地现金等价报销，让保单持有人可以在全美选择任何持牌医疗提供商。为直接承保大病医疗保险合同，公司成立了注册地在 Ohio 的 Sidecar Health Insurance
              Company, Inc.（NAIC #17104），获准在 Ohio、Florida 和 Georgia 提供全额保险团体保障，同时在更广泛的全国范围管理自保项目。
