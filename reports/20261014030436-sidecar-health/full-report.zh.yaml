      - number: '4.2'
        title: 定价结构与变现动力
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 的变现框架以透明现金支付定价基准替代传统议价提供商网络。公司不维护签约费率表或窄医生网络，而是根据地区现金费率基准，为数千项可比价医疗程序、实验室检查和药物公布预设 Benefit
              Amount。参保会员接受非急诊护理时，使用 Sidecar Health Visa 支付卡按提供商直接自付费率在服务现场付款，从而绕过事前授权。

              计划的 First Dollar 保障结构让免赔额直接等于自付上限：大型团体部署中，个人保障通常设为 $3,000，家庭计划为 $6,000；对于价格不超过 Benefit Amount
              的承保服务，这一结构取消标准自付额和按比例共同保险。为推动消费者参与，计划加入共享节省返现机制：会员有效比价并获得低于公布 Benefit Amount 的护理后，Sidecar 将实际节省的 50%
              直接返还。2025 计划年度理赔数据显示，78% 的已处理理赔实现会员零成本或净返现，四口之家参与者平均每年获得 $989 返现。对于高价复杂病例，Sidecar 通过 Carrum Health Centers
              of Excellence 整合手术和肿瘤打包方案，获得最高 45% 的预协商折扣。
