  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与会员工作流
        blocks:
          - type: paragraph
            body: >
              Sidecar Health 提供综合大病医疗保险，核心是消费者驱动的现金支付购买模式，而非受限的管理式医疗网络。公司只服务拥有 51 名及以上员工的大型雇主，覆盖全额保险和自保 ASO 结构，取消传统 HMO
              和 PPO 的准入控制。平台不限制网络内或网络外提供商，不要求基层医生转诊，也取消承保护理的服务前事前授权。会员被视为现金支付消费者，可以在全国任何持牌医生、专科医生、医院或零售药房接受服务。

              端到端用户流程由 Sidecar Health 移动应用和门户承载，将复杂医疗编码（CPT、DRG 和 NDC
              分类）转化为易懂的护理前价格披露。就医前，会员搜索计划中的医疗程序或处方药，查看按照当地市场现金价格校准的预设 Benefit Amount。就医时，会员出示从计划理赔账户充值的 Sidecar Health
              Visa 支付卡，按折扣现金价或自付价直接支付。服务完成后，会员通过移动应用上传逐项医疗账单或收据，交由管理系统裁定。

              产品的核心经济机制是围绕程序定价的双向共享激励。如果会员找到现金收费低于指定 Benefit Amount 的高性价比提供商，计划会把实际节省的一半以返现形式存入会员账户。反之，如果会员选择收费超过公布
              Benefit Amount 的提供商，超出的差额由会员承担。公司披露和商业申报显示，近 80% 的已处理理赔结算金额不超过公布的 Benefit Amount；93%
              的理赔实现超过保障额的自付成本为零、获得返现，或支出低于标准商业自付额。
