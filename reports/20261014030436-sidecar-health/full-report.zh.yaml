  - id: FI001
    title: 收入模式桥接流程
    type: flow
    summary: 可视化追踪雇主采购如何转化为保费和费用收入、现金支付医疗服务方结算、会员返现激励及毛利。
    data:
      nodes:
        - id: emp-procure
          label: 雇主计划采购
          detail: 大型团体雇主（51 名以上员工）选择全额承保计划或自筹资金 ASO 计划。
        - id: rev-inflow
          label: 保费与费用流入
          detail: 承保团体保费流入 Sidecar Health Insurance Company；ASO 费用流入 Sidecar Health Insurance Solutions。
        - id: card-fund
          label: 会员卡发放
          detail: 会员收到充值了 Benefit Amount 的 Sidecar Health Visa 卡，用于服务点现金支付。
        - id: prov-settle
          label: 医疗服务方现金费率结算
          detail: 医疗服务方直接按折扣现金费率收费，绕过事前授权和网络合同。
        - id: incentive-split
          label: 激励返现分成
          detail: 如果医疗服务方费用低于 Benefit Amount，会员保留 50% 的返现金额；超出部分由会员承担。
        - id: gross-margin
          label: 承保与运营利润率
          detail: 医疗损失后的剩余保费形成承保利润率；ASO 保留净行政利润率。
      edges:
        - from: emp-procure
          to: rev-inflow
        - from: rev-inflow
          to: card-fund
        - from: card-fund
          to: prov-settle
        - from: prov-settle
          to: incentive-split
        - from: incentive-split
          to: gross-margin
