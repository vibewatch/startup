      - number: '3.3'
        title: 定价、产品组合与财务激励设计
        blocks:
          - type: paragraph
            body: >-
              传统团体健康计划把不透明的协商费率表与复杂分摊机制捆绑在一起，员工需要满足免赔额、处理自付额，并在达到年度自付上限前支付 20% 至 30% 的共同保险。Sidecar Health
              则采用与地区现金支付基准挂钩的透明 Benefit Amount 结构，覆盖超过 170,000 项医疗服务和处方药。会员获得与计划理赔账户绑定的 Sidecar Health Visa
              支付卡，可以在服务时直接向医疗提供商付款。

              这一架构创造了强烈的消费者比价激励：如果员工选择现金收费低于 Benefit Amount 的高性价比提供商，会员就能获得返现，通常为差额的 50%。Sidecar 报告称，78%
              的已处理理赔实现返现或会员净成本为零，参保四口之家平均每年节省 $989。对雇主而言，Sidecar 报价显示相对标准商业团体保单预计节省 20% 保费。公司停止旧固定赔付 Access Plan 后，如今只为
              51 名及以上员工的团体提供符合 ACA 的大病医疗；Florida、Georgia 和 Ohio 为全额保险，全国则提供自保 ASO 方案。
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
