            body: >-
              Sidecar Health 用服务现场 Visa 支付和基准现金定价替代不透明的签约保险网络，实现低于 1% 的临床拒赔率，并让 78% 的理赔达到会员零自付或返现。但提供商收费超过 Benefit
              Amount 时，会员承担全部差额账单风险，财务尽调责任也由支付方转移到患者。
