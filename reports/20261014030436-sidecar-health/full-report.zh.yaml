      - number: '4.3'
        title: 成本结构与单位经济驱动因素
        blocks:
          - type: paragraph
            body: >-
              公司单位经济的基础在于，直接现金定价和消费者比价能否稳定地把总体医疗损失成本压到传统保险商基准以下。Sidecar Health 声称，透明模式据估计可使雇主保费较传统团体计划低 20%，急诊使用率则比
              Milliman 商业平均假设低 45%。公司鼓励会员选择高性价比门诊提供商和本地影像中心，以降低医疗理赔总支付，并在行政费用前获得更高毛利率。

              但单位层面的盈利能力仍难以独立核实，因为 Sidecar Health
              没有公开经审计的医疗损失率（MLR）、法定损失调整费用或会员获客成本。运营费用包括维护地区医疗价格数据库、支付卡清算交易费、经纪人分销佣金，以及处理差额账单争议的客户支持。如果提供商要求的费率显著高于
              Benefit Amount，会员将承担不会计入年度自付上限的差额账单，可能损害留存并推动流失。取消事前授权虽能降低临床审查行政成本，却把财务风险转移到精算定价准确性和自动化服务后理赔裁定上。
