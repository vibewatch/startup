  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、计划结构与商业范围
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 位于商业健康保险承保与医疗金融科技支付基础设施的交汇处。公司最初推出个人固定赔付 Access Plans，后来战略转向只做符合 Affordable Care
              Act（ACA）的综合大病医疗产品。新的边界主动排除个人交易所保单、Medicare Advantage，以及员工人数少于 51
              人的小型团体，瞄准医疗福利支出不断上升、已成为资产负债表主要压力的中大型商业企业。当前产品包括两种运营交付机制：由 Sidecar Health Insurance Company, Inc.
              承保的全额保险团体医疗保单，以及为自保雇主团体定制的 Administrative Services
              Only（ASO）第三方管理安排。其核心差异在于彻底拆除传统管理式医疗的提供商网络和事前授权机制。Sidecar Health 不与封闭的医院、医生网络签订专属费率表，而是根据地区基准价格为每项承保服务设定透明
              Benefit Amount。会员可在任意持牌医疗提供商之间自由选择，用专用支付卡按协商现金价或自付价直接结算。若实际护理成本低于公布的 Benefit Amount，会员保留差额的 50%
              作为现金激励，把员工的比价行为与雇主控制保费直接绑定。
            claimRefs:
              - CM001
