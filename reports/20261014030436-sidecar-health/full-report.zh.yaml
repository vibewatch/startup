      - number: '3.4'
        title: 护城河持久性、分销能力与替代风险
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health
              的竞争持久性取决于其无网络、直接支付模式能否抵御在位保险商反击和结构性市场摩擦。传统保险商凭借庞大的资产负债表资本、深厚经纪人关系、行政锁定及激进的多产品捆绑建立了强大护城河，覆盖医疗、牙科、视力、寿险和止损保险。Sidecar
              靠战略福利市场整合来应对分销壁垒，尤其是与 Employee Navigator 合作触达独立福利经纪人，并借助 Koch Industries 获得企业验证；Koch 在 Series D
              投资后承诺为部分员工提供保障并共同设计大型雇主方案。

              但 Sidecar 也存在威胁长期企业替代的严重结构性脆弱点。最关键的是会员差额账单暴露：由于提供商不签署将其费率固定在 Sidecar 费率上的网络合同，任何超过 Benefit Amount
              的收费都由会员个人自付，且不会计入计划自付上限。若员工遭遇强硬账单争议或复杂住院护理的意外现金支出，福利管理者会面对强烈的不满。此外，公司估计员工少于 250
              人，且业务集中在四个全额保险州，因此更像小众颠覆者而非成熟品类领导者；如果全国保险商推出透明参考定价的雇主产品，Sidecar 可能遭遇模仿或掠夺性定价。
            claimRefs:
              - CP001
              - CP012
              - CP013
              - CP014
