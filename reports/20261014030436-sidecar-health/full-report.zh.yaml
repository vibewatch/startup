          - type: callout
            title: 差额账单与提供商摩擦拖累采用
            body: >-
              Sidecar Health 按平均现金费率预先确定 Benefit
              Amount，而不是以合同约束提供商接受折扣费率；因此医疗提供商收费高于基准时，会员承担直接财务暴露，且现金差额不会计入自付上限。若员工遭遇意外差额账单或提供商在服务现场犹豫，雇主福利负责人将面对内部反弹，威胁多年期团体续保率。
