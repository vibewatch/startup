      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 无网络模式的结构性护城河
            body: >-
              Sidecar Health 将医疗保障与议价提供商网络拆开，移除了签约、资质审核和事前授权等行政开销，这些开销最高可占传统支付方支出的 30%。因此 Sidecar 可以在让会员自由选择 100%
              提供商的同时，提供 20% 的保费折扣。但这一优势能否持久，完全取决于会员是否愿意主动比价，以及提供商是否接受服务现场付款。
