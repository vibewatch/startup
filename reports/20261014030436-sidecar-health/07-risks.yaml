callouts:
  - calloutType: risk
    title: "Structural Dilemma: Transferring Price Risk to Consumers"
    body: |
      Sidecar Health's economic model achieves lower headline employer premiums by stripping away managed care networks and replacing negotiated provider fee schedules with fixed Benefit Amounts. While this rewards disciplined consumer price shopping, it fundamentally exposes employees to catastrophic or unexpected out-of-pocket balance billing in non-elective, urgent, or high-cost specialty care scenarios where shopping is practically impossible. If employers experience widespread employee backlash over unexpected bills, retention will deteriorate rapidly.
    claimRefs:
      - "CR004"
      - "CR006"
      - "CR014"

