  summary: >-
    Sidecar Health is a venture-backed health insurance and benefits technology company founded in 2018 in El Segundo,
    California. It combines ACA-compliant large-group major medical coverage with national ASO administration built
    around a transparent cash-price Benefit Amount model and a member-facing payment card.
