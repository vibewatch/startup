callouts:
  - calloutType: "insight"
    title: "Dual-Engine Revenue Architecture Separates Underwriting Risk from Scalable Fee Revenue"
    body: "Sidecar Health's bifurcation into a fully insured carrier (Sidecar Health Insurance Company, Inc.) in Florida, Georgia, and Ohio, paired with a non-risk Administrative Services Only entity across dozens of states, creates two distinct revenue engines. While fully insured employer premiums generate larger top-line figures, they require heavy statutory reserves and expose Sidecar to claims volatility. The ASO offering represents higher-margin, balance-sheet-light fee revenue that can scale nationally without carrier licenses in every state."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
  - calloutType: "risk"
    title: "Severe Revenue and Loss-Ratio Opacity Prevents Institutional Underwriting"
    body: "With independent estimates of annual revenue spanning a massive range from $25 million to $265 million, and no publicly available statutory loss-ratio or cash-burn filings, underwriters cannot determine whether Sidecar Health is approaching self-sustaining unit economics or burning through its $165 million Series D capital to subsidize member claims and employer discounts."
    claimRefs:
      - "CI001"
      - "CI012"
      - "CI013"
      - "CI014"
