callouts:
  - calloutType: insight
    title: Market Boundary Evolution from Fixed Indemnity to ACA Major Medical
    body: Sidecar Health's strategic withdrawal from individual fixed-indemnity Access Plans to concentrate exclusively on large group ACA-compliant major medical refocuses the business on employer-sponsored commercial pools, where price-transparency shared savings can structurally reduce group premium renewals.
    claimRefs:
      - CM001
      - CM002
      - CM004
  - calloutType: risk
    title: Member Financial Exposure and Geographic Friction
    body: While Sidecar Health eliminates network boundaries, members bear balance-billing liability whenever billed provider charges exceed the plan's Benefit Amount. Furthermore, fully insured availability remains confined to Florida, Georgia, and Ohio, creating friction for multi-state employers seeking uniform coverage.
    claimRefs:
      - CM003
      - CM006
      - CM013
