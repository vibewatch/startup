  topStrengths:
    - Benefit Amount 定价透明，消费者能直接看到费用。
    - 获得包括 Koch Disruptive Technologies 在内的有分量后期资本支持。
    - 双轨模式覆盖全额承保的雇主保险和全国 ASO 服务。
    - 创始团队与健康计划分销及运营高度匹配。
  topRisks:
    - 承保透明度不足：法定 MLR、准备金充足性和盈利能力仍未披露。
    - 当医疗服务提供方的现金价格超过 Benefit Amount 时，可能出现余额账单和会员摩擦。
    - 全额承保业务集中在仅三个州，地域风险较高。
    - 依赖 Koch、经纪人平台和支付通道等交易对手及分销渠道。
  unresolvedGaps:
    - 经审计的 2024-2026 年收入、医疗损失率、准备金充足性、法定资本和现金消耗数据没有公开。
    - 各州或各产品类型的雇主数量、覆盖会员数量、队列续保率和留存率仍未披露。
    - Series D 之后的估值、董事会权利、清算优先权和反稀释条款没有公开。
    - 公开证据没有清楚披露当前董事会构成、顾问姓名或 Veronica Osetinsky 的当前职务。
    - 德州及更广泛的全国扩张证据方向上偏正面，但公开材料对当前承保州和客户规模的精确情况仍不明确。
