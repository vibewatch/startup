- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why the threat is real
  - Mitigation / diligence ask
  rows:
  - - Cross-vendor portability
    - vLLM and SGLang also advertise broad accelerator support
    - Medium
    - Portability matters, but competing runtimes already span many accelerators publicly
    - Request real migration case studies showing faster bring-up or lower re-validation burden than open-source peers
  - - Performance leadership
    - Third-party wins are workload-specific and cold-start trade-offs remain
    - High
    - Spheron reports dense-model wins for MAX but also flags slower first-run cold start, weaker MoE maturity, and thinner ecosystem support
    - Demand independent, apples-to-apples benchmarks across dense, MoE, latency-sensitive, and shared-prefix workloads
  - - Integrated full-stack control
    - Ray/Anyscale, Together, and internal-build stacks can separate runtime from orchestration and procurement
    - Medium
    - Many buyers do not need one vendor to own every layer if they can compose acceptable alternatives
    - Probe whether Mammoth meaningfully reduces ops headcount or only repackages common platform functions
  - - Lower vendor lock-in
    - CUDA lock-in and NVIDIA channel power can outweigh portability economics
    - High
    - Migration cost includes validation, tooling, and access to scarce production-ready compute
    - Test whether Modular can show materially lower switching time or TCO on a real customer workload
  - - Open-source credibility
    - vLLM and SGLang currently own more visible open-inference mindshare
    - High
    - Mindshare drives integrations, third-party support, and buyer comfort
    - Track contribution velocity, partner wrappers, and named production references rather than stars alone
  - - Sales-led enterprise wedge
    - Managed alternatives publish clearer pricing and easier trial surfaces
    - Medium
    - Opaque packaging slows replacement deals against hosted competitors
    - Ask for standardized pricing bands, migration offers, and time-to-production references
  notes: The register captures the main public moat claims and the public evidence most likely to erode them; it is directional rather than exhaustive because private customer evidence is not available.
