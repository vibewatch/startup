- id: capability-and-packaging-comparison
  title: Capability comparison, packaging, and where Modular is actually different
  body: |-
    On product substance, Modular’s case is clearest where portability and kernel control matter. MAX is framed as one programmable stack for serving, model adaptation, and low-level optimization across NVIDIA, AMD, and now Apple development targets. That is meaningfully different from TensorRT-LLM, which is explicitly optimized for NVIDIA-centric deployment, and from Together AI, which sells a managed cloud rather than a portable runtime. It is less different from vLLM and SGLang on the familiar checklist. OpenAI-compatible APIs, batching, cache optimizations, and broad model serving are now category norms rather than MAX-only features. Public third-party evidence also narrows the claimed lead: Spheron reports that MAX can beat vLLM and SGLang on dense-model throughput in one 2026 H100 setup, but that same review says vLLM remains the general-purpose production default and that MAX still trails on MoE maturity, multi-LoRA, and ecosystem integrations.

    Packaging is another real gap. Together publishes token prices, dedicated endpoint offers, and hourly GPU prices. Ray and Anyscale publish a clear BYOC or multi-cloud control story. Modular’s public surfaces still push larger buyers toward demos and enterprise engagement. That does not mean the product is weak, but it does mean the market-facing package is less standardized and less transparent than several alternatives. For enterprise buyers, packaging clarity is itself a feature because it lowers evaluation friction.
