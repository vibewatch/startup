- id: switching-costs-and-distribution-power
  title: Switching costs, distribution power, and why incumbents stay strong
  body: |-
    The strongest adverse evidence against a durable Modular moat is not that MAX lacks technical merit; it is that many buyers will not move unless the migration burden is clearly worth it. CUDA lock-in accumulates through tooling, libraries, validation workflows, and the practical habit of doing the “fast path” on NVIDIA first. AlphaStreet’s 2026 write-up, citing NVIDIA-reported ecosystem scale, highlights the depth of that installed base. NVIDIA’s own MGX materials extend the story beyond software into partner distribution, modular server reference designs, and full-stack system compatibility. TensorRT-LLM then gives that hardware base a dedicated serving stack. For a conservative enterprise, that bundle is boring in the best possible sense: plenty of engineers know it, integration paths are familiar, and the qualification burden is already absorbed.

    Modular is trying to break that inertia with portability and better economics, but competitor ecosystems can also cooperate with each other. Anyscale explicitly says users can scale vLLM and SGLang on its platform. Internal-build buyers can run vLLM under Ray or layer llm-d and ONNX Runtime into their own stack. Managed buyers can use Together instead of operating any runtime at all. Those options make multi-homing realistic and reduce the chance that MAX becomes the sole architectural default. As a result, Modular’s distribution challenge is at least as large as its technical challenge.
  claimRefs:
  - CP020
  - CP021
