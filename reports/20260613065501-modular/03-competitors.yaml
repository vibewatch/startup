callouts:
- calloutType: strength
  title: Modular has a real portability wedge, not just a branding wedge
  body: The strongest evidence in this chapter is not generic “AI infrastructure” positioning but repeated public proof that MAX is being aimed at NVIDIA, AMD, and Apple targets from one stack. That does not guarantee commercial dominance, but it does define a real buyer problem that several incumbents still solve less elegantly.
  claimRefs:
  - CP002
  - CP004
  - CP016
  - CP029
- calloutType: risk
  title: CUDA and open-source incumbents still set the default buying path
  body: 'For many buyers, the status quo remains good enough: vLLM or SGLang for OSS breadth, TensorRT-LLM for NVIDIA-first performance, and Together or Anyscale for easier procurement or control. Modular has to overcome not just performance comparisons but also ecosystem habit and migration cost.'
  claimRefs:
  - CP015
  - CP017
  - CP018
  - CP030
  - CP033
- calloutType: recommendation
  title: Best-fit customers are cross-vendor teams, not every inference buyer
  body: The chapter evidence supports a focused go-to-market reading. Modular looks most compelling for teams that want cross-vendor bring-up, custom kernels, and a tighter stack than a DIY platform. It looks less compelling for buyers who want maximum OSS breadth, fully transparent managed pricing, or the safest NVIDIA-only production path.
  claimRefs:
  - CP016
  - CP037
  - CP040
