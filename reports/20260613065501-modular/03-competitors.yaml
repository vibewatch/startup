company:
  name: Modular
chapter:
  number: 3
  title: Competitors
  summary: Modular competes in a layered field that includes direct open-source serving peers like vLLM and SGLang, NVIDIA's TensorRT-LLM and broader CUDA-centered incumbent stack, orchestration platforms such as Ray Serve and Anyscale, managed alternatives like Together AI, and credible internal-build substitutes built on vLLM, ONNX Runtime, and llm-d. Public evidence supports a real differentiation wedge around cross-vendor portability, unified kernel tooling, and faster hardware bring-up, but the moat is narrower than the company's broad unified-compute narrative because open-source incumbents own more ecosystem breadth while NVIDIA still owns the deepest installed-base and channel advantage. The chapter verdict is that Modular looks strongest for portability-sensitive teams willing to adopt a newer stack, not yet as the safest default for the full inference market.
sections:
- id: landscape-and-peer-classes
  title: Landscape, direct peers, and substitute classes
  body: |-
    Modular is not competing with one monolithic “inference market.” Its actual battlefield splits into several classes. The most direct runtime peers are vLLM, SGLang, TensorRT-LLM, and—less forcefully now—Hugging Face TGI. Those products all try to solve the same immediate job of serving open-weight models with good throughput, batching, and API compatibility. Around them sit orchestration and deployment layers such as Ray Serve and Anyscale, which matter because buyers often care as much about composition, autoscaling, and VPC control as about kernel speed. Together AI sits in another class again: it sells managed convenience, published pricing, and GPU access without asking the customer to operate a runtime. Internal-build substitutes also matter. ONNX Runtime, llm-d, and a self-hosted vLLM plus Ray stack give sophisticated teams a way to keep the architecture in-house.

    That classification matters for judgment. Modular’s public materials do not show a winner-take-all engine market. Instead, they show a layered decision tree where different buyers can solve the same underlying serving problem with open-source engines, managed clouds, orchestration platforms, or custom stacks. That makes the competitive set broader than “vLLM versus MAX,” and it raises the bar for moat durability because Modular must beat not only direct peers but also acceptable substitutes and incumbent deployment habits.
  claimRefs:
