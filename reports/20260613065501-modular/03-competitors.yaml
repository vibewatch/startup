    - Unified serving framework, kernel tooling, and Kubernetes-native control plane
    - NVIDIA + AMD production support with Apple and consumer GPU expansion
    - Open-source entry point plus sales-led enterprise / cloud engagement
    - Public packaging and customer scale are less standardized than major managed or incumbent alternatives
  - - vLLM
    - Direct peer
    - Teams self-hosting broad open-weight model fleets
    - High-throughput open-source serving engine with broad model and hardware support
    - Very broad multi-accelerator support
    - Open-source self-host or wrap with another platform
    - Less differentiated on managed convenience; customer owns more operations
  - - SGLang
    - Direct peer
    - Latency-sensitive teams with shared-prefix or large distributed workloads
    - High-performance serving framework with prefix-aware and distributed optimizations
    - Broad hardware support across NVIDIA, AMD, TPU, and more
    - Open-source self-host with strong ecosystem partners
    - Public pitch is still runtime-centric rather than turnkey enterprise packaging
  - - TensorRT-LLM
    - Incumbent runtime
    - NVIDIA-standardized teams optimizing for top single-stack throughput
    - NVIDIA-optimized inference library with Triton and Dynamo integration
    - NVIDIA-first by design
    - Open-source plus deep NVIDIA ecosystem pull-through
    - Portability outside NVIDIA is structurally weak
  - - Ray Serve / Anyscale
    - Adjacent orchestrator
    - Platform teams that need composition, autoscaling, and BYOC control
    - Framework-agnostic serving and orchestration layer that can run other engines
    - Portable across clouds rather than across kernels
    - Open-source Ray plus Anyscale-managed control options
    - Not itself the deepest kernel-optimization layer
  - - Together AI
    - Managed alternative
    - Teams that want immediate hosted access and clear pricing
    - Serverless inference, dedicated endpoints, and GPU infrastructure
    - Managed cloud abstraction rather than runtime portability
    - Public token and GPU pricing with dedicated deployment paths
    - Less buyer control over the low-level serving stack
  - - TGI
    - Legacy direct peer
    - Hugging Face-aligned users with existing deployments
    - Inference toolkit with batching, tensor parallelism, and API compatibility
    - Multi-hardware support documented
    - Open-source runtime
    - Maintenance-mode status weakens forward competitive momentum
  - - Internal build (vLLM + Ray / ONNX / llm-d)
    - Substitute / status quo
    - Sophisticated teams willing to compose their own platform
    - Self-assembled serving, orchestration, and optimization stack
    - Potentially very portable depending on chosen components
    - No license premium beyond compute and engineering time
    - Higher integration burden and slower time to value
