  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-packaging
    missingEvidence: A standardized public or customer-shareable MAX Enterprise price sheet with at least one representative managed endpoint configuration.
    whyItMatters: Packaging clarity affects replacement speed against Together and managed alternatives, and it limits apples-to-apples cost comparison today.
    diligencePath: Request current list or banded pricing for shared, dedicated, and BYOC-style Modular deployments plus any minimum commitments.
    relatedQuestionRefs:
    - QP017
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: distribution-power
    missingEvidence: Named production deployment references, migration case studies, and repeatable proof that customers switched from vLLM, TensorRT-LLM, or managed clouds into MAX.
    whyItMatters: Without customer migration proof, public evidence cannot confirm that Modular's portability wedge converts into distribution power comparable to larger incumbents.
    diligencePath: Ask management for customer references segmented by workload, hardware mix, prior stack, and time-to-production after migration.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: material
    topic: benchmark-evidence
    missingEvidence: Independent apples-to-apples benchmark evidence spanning dense models, MoE models, low-latency chat, shared-prefix workloads, and multi-GPU production settings.
    whyItMatters: Current third-party evidence is helpful but narrow, so it cannot fully establish a durable performance moat across the buyer shapes that matter most.
    diligencePath: Commission or request reproducible benchmarks run by an independent operator on fixed hardware and identical model or tokenizer settings.
    relatedQuestionRefs:
    - QP024
