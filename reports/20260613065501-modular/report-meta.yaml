  foundingLocation: San Francisco Bay Area, CA, USA
  headquarters: Los Altos, CA, USA
  productSummary: Modular sells a layered AI infrastructure stack built around MAX for inference and model execution, Mammoth for Kubernetes-native orchestration across heterogeneous GPU fleets, Mojo for portable kernel development, and managed or bring-your-own-cloud deployment options.
  customerFocus: AI-native application builders, enterprise platform and ML infrastructure teams, compliance-sensitive BYOC buyers, and channel or cloud counterparties.
  businessModel: Free developer entry points feed into token-priced shared endpoints, minute-priced dedicated and BYOC deployments, and higher-touch optimization or channel engagements that add engineering support.
  stage: Series C
  fundingStatus: September 2025 Series C financing brought in $250 million, took total capital raised to $380 million, and set a $1.6 billion valuation.
