  - CR050
- calloutType: risk
  title: Third kill criterion — the product scales only as fast as scarce humans
  body: Repeated evidence that forward-deployed engineering is the gating factor for enterprise success would imply that Modular behaves more like a services-heavy consultancy than a scalable software layer, which would compress confidence and valuation expectations.
