  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: incident-transparency
    missingEvidence: A public incident log, uptime history, or scope-level audit summary for shared, dedicated, and BYOC deployments.
    whyItMatters: The company markets reliability and SOC 2, but investors still cannot independently test how often the platform has failed or what trust-service criteria are actually covered.
    diligencePath: Request historical uptime, severity-1/2 incident counts, customer-facing postmortems, and the SOC 2 report scope under NDA.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Revenue, ARR, gross margin, burn, runway, and cohort economics by deployment type.
    whyItMatters: Without unit-economics evidence, fresh capital can mask whether Modular scales like software, managed infrastructure, or services-heavy engineering work.
    diligencePath: Request board-approved operating plan, recent actuals, and deployment-type gross-margin bridges before underwriting valuation durability.
    relatedQuestionRefs:
    - QR016
    - QR017
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer count, renewal, NRR/GRR, top-account concentration, and share of bookings routed through AWS or any single partner.
    whyItMatters: Public customer proof is visible but narrow; concentration could materially change the risk-adjusted quality of the 2025 demand narrative.
    diligencePath: Request customer cohort table, top-10 account share, renewals calendar, and channel mix by bookings and revenue.
    relatedQuestionRefs:
    - QR018
    - QR019
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: succession-governance
    missingEvidence: Full board roster, committee structure, delegated product ownership, and formal succession coverage for founders and senior engineering leaders.
    whyItMatters: The product story is founder-led and engineering-intensive; thin governance disclosure raises key-person and continuity risk.
    diligencePath: Request governance materials, key-person insurance status, org chart, and formal succession documentation.
    relatedQuestionRefs:
    - QR011
    - QR029
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: compliance-mapping
    missingEvidence: A control-by-control mapping from DOJ Part 202, state AI/privacy obligations, and customer contractual requirements to Modular product architecture and vendor-management processes.
    whyItMatters: The risk is not only whether rules exist; it is whether Modular has translated them into deployable controls fast enough for regulated buyers.
    diligencePath: Request legal-compliance matrix, DPA/MSA templates, vendor-screening procedures, and audit cadence tied to regulated customer segments.
    relatedQuestionRefs:
    - QR020
    - QR021
    - QR022
    - QR027
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: supply-allocation
    missingEvidence: Real allocation, pricing, and fallback arrangements across NVIDIA, AMD, and cloud partners for the next major hardware cycles.
    whyItMatters: Hardware portability only protects the thesis if Modular can actually secure capacity and qualify new stacks when customers need them.
    diligencePath: Request supplier/partner allocation terms, qualification timelines, backlog history, and customer examples of real workload migration across GPU vendors.
    relatedQuestionRefs:
    - QR024
    - QR025
    - QR028
    relatedTableRefs:
    - TR003
