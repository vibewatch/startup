- id: legal-regulatory-and-privacy-risks
  title: Legal, regulatory, privacy, and export-control risks are rising with the AI compliance perimeter
  body: The legal and regulatory risk is not driven by one known lawsuit against Modular; it is driven by the widening number of obligations that can attach to an AI infrastructure vendor serving enterprise workloads. Modular's own privacy, terms, and issue-reporting surfaces show that it collects personal data, retains it while accounts remain open or as necessary for business purposes, routes security/privacy issues to a security team, and disclaims substantial availability and liability risk in its terms. On the mitigation side, its pricing and BYOC pages market SOC 2 Type 2 certification and customer-VPC deployments. But external policy sources make clear that the compliance floor is moving. DOJ's Data Security Program is already effective and imposes due-diligence, audit, and restricted-transaction requirements around bulk sensitive personal data. BIS continues to tighten advanced-computing export controls. NIST's Cyber AI Profile frames cybersecurity controls for AI systems as a growing
    expectation rather than a niche best practice. At the state level, NCSL and Troutman both show that private-sector AI deployment now faces a widening patchwork of transparency, discrimination, provenance, and sector-specific obligations. For Modular, the key risk is less a single current violation than the chance that sales to regulated enterprises outpace the company's ability to map those obligations into contracts, shared-responsibility boundaries, and operating controls.
