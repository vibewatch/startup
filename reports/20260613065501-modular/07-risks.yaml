callouts:
- calloutType: risk
  title: Top kill criterion — compliance misses in regulated deployments
  body: If a regulated enterprise deployment triggers a public privacy, DSP, or state-AI compliance failure, the current thesis that BYOC plus enterprise controls can keep Modular ahead of the rule perimeter should be treated as broken until the control gap is explained and remediated.
  claimRefs:
  - CR007
  - CR028
  - CR029
  - CR033
  - CR034
  - CR047
  - CR048
  - CR051
- calloutType: risk
  title: Second kill criterion — portability fails under real GPU scarcity
  body: Modular's differentiation depends on turning hardware heterogeneity into a customer advantage. If customers still cannot deploy on time because NVIDIA allocation, CUDA inertia, or partner ecosystem constraints dominate outcomes, the portability thesis deserves a marked downgrade.
  claimRefs:
  - CR019
  - CR024
  - CR026
  - CR035
