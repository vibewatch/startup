- id: people-financial-opacity-and-kill-criteria
  title: People risk and financial opacity are manageable today, but they define the chapter's key kill criteria
  body: 'The people and financial risks are less about imminent distress than about what investors still cannot verify. The 2025 financing materially reduced short-term capital pressure, and external coverage corroborates the $250 million raise, $380 million total capital, and $1.6 billion valuation. That is a real cushion. However, public disclosures still do not resolve the core underwriting question of whether Modular is scaling like a software platform or like a high-touch infrastructure consultancy. The reviewed source pack still does not disclose revenue, ARR, gross margin, burn, runway, customer count, renewal behavior, or concentration by partner and account. Leadership visibility is also incomplete. The About page names a credible founder bench and a few functional leaders, but the public record does not disclose a full board roster or succession plan, while the product surfaces repeatedly emphasize forward-deployed engineers as the delivery engine. That means the chapter''s kill
    criteria are monitorable rather than hypothetical: a material compliance miss in a regulated deployment, a sharp loss of GPU or cloud-partner access, or signs that talent density cannot support promised performance and support levels would all force a more negative diligence view. Until public evidence fills the economics, incident, and succession gaps, the risk verdict remains high rather than merely medium.'
