- id: operational-partner-and-hardware-risks
  title: 'Operational and partner risk sits inside the product promise: portability, performance, and support all rely on external ecosystems'
  body: 'Operational risk is unusually entangled with the product narrative because Modular does not merely promise a model endpoint; it promises cross-hardware portability, custom-kernel optimization, and enterprise reliability across shared, dedicated, and BYOC environments. The public product pages show how ambitious that promise is. Shared endpoints sell NVIDIA-versus-AMD choice as a pricing lever. Dedicated endpoints sell always-warm capacity and forward-deployed engineers. BYOC adds customer-cloud residency but still keeps the control plane outside the VPC and relies on BentoCloud architecture. Custom-model pages add one-codebase portability across NVIDIA, AMD, Apple Silicon, and ARM. Those are compelling differentiators, but they widen the QA matrix, increase the consequences of any regression on a new GPU generation, and make support staffing part of the product. External evidence compounds the point. AWS case studies and partnership posts show that procurement, deployment, and distribution
    increasingly run through AWS Marketplace and AWS services. AlphaStreet shows why CUDA lock-in and supply scarcity still matter even when a vendor is trying to be hardware-agnostic. NVIDIA''s MGX architecture shows how quickly ecosystem standards can deepen dependence on NVIDIA''s roadmap. Net: Modular''s portability story is a mitigation, but it is also an operating commitment that depends on cloud partners, chip roadmaps, container compatibility, and scarce engineering labor all holding together at once.'
