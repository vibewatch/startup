- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Legal / compliance drift
    - Regulated-customer control failure or enforcement contact
    - Any public enforcement action, material customer remediation, or failed audit tied to privacy, DSP, or state AI controls
    - Pause underwriting until product-control mapping, counsel analysis, and remediation evidence are reviewed
  - - Hardware / supply dependence
    - Loss of timely access to priority GPU capacity or major vendor roadmap slippage
    - Repeated inability to support the newest target hardware within expected launch windows or material customer churn due to hardware unavailability
    - Downgrade portability advantage and assume margin pressure from constrained supply
  - - Channel dependence
    - AWS Marketplace / hyperscaler channel becomes dominant without proof of diversified direct wins
    - Large share of enterprise bookings depends on one marketplace or one cloud-partner motion
    - Treat revenue quality as lower and model concentration discount
  - - Delivery-capacity bottleneck
    - Forward-deployed engineering utilization or queue times spike
    - Meaningful backlog, rising latency incidents, or inability to onboard/custom-optimize new accounts on time
    - Assume services-heavy scaling and reduce software-multiple assumptions
  - - Financial opacity
    - Company continues raising expectations without disclosing basic unit economics
    - No credible disclosure of revenue quality, burn, or margin progression by next major financing or refresh cycle
    - Keep confidence capped and require direct diligence access before upgrading view
  - - People / governance
    - Founder departure, missing successor, or unresolved board/control concerns
    - CEO, president, or principal technical leader exits without clear succession and operating continuity plan
    - Move thesis to hold/re-underwrite until leadership continuity is proven
  notes: Kill criteria are intentionally monitorable. They are not forecasts; they are thresholds at which the current constructive-but-cautious risk view should be revisited.
