  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-revenue-and-margin
      missingEvidence: Current revenue or ARR and gross margin by shared endpoints, dedicated endpoints, BYOC, and services.
      whyItMatters: These are the minimum inputs needed to test whether the latest valuation is stretched or justified.
      diligencePath: Request the latest monthly KPI page and product-surface P&L cut from management.
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-preferences
      missingEvidence: >-
        Most recent capitalization table, share classes, liquidation preferences, SAFE conversions, and anti-dilution
        protections.
      whyItMatters: Headline post-money value can materially overstate the value available to new or common-equity investors.
      diligencePath: Request the latest financing documents and a fully diluted ownership bridge.
    - type: missing-source
      severity: material
      topic: retention-and-concentration
      missingEvidence: NRR, GRR, logo retention, top-customer concentration, and renewal timing.
      whyItMatters: >-
        Customer durability determines whether reference wins represent a scalable platform or a narrow set of bespoke
        successes.
      diligencePath: Request cohort tables, top-customer schedules, and the renewal calendar for the next four quarters.
    - type: private-evidence-only
      severity: material
      topic: org-mix-and-services-intensity
      missingEvidence: Current organization split between product-platform engineering and forward-deployed or customer engineering.
      whyItMatters: >-
        This is one of the fastest ways to test whether the company is scaling like software or like premium technical
        services.
      diligencePath: Request an org chart with headcount by function plus the near-term hiring plan.
    - type: stale
      severity: minor
      topic: latest-mark-update-for-TV004
      missingEvidence: Any 2026 secondary-market mark, extension financing, or new investor term sheet since the September 2025 round.
      whyItMatters: >-
        A more recent price signal could tighten the valuation stance materially in either direction and improve
        comparable-set coverage.
      diligencePath: Ask management and existing investors for any post-round mark updates, extension notes, or tender data.
      relatedTableRefs:
        - TV004
