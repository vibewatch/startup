  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Next financing resets below the 2025 mark
        - Flat or down round versus $1.6B
        - Would imply private investors no longer support the existing narrative premium
        - Downgrade stance and revisit downside case
      - - Customer breadth does not widen beyond reference accounts
        - No evidence of diversified paying accounts, renewals, or reduced concentration
        - Would weaken the claim that Modular is becoming a broad platform rather than a narrow optimization vendor
        - Hold or reduce conviction until breadth improves
      - - Services intensity stays too high
        - Forward-deployed engineering remains essential for most wins and gross-margin proof never appears
        - Would cap multiple expansion and make the company look more like premium services than scalable software
        - Require product-margin and support-ratio disclosure before adding risk
      - - Portability edge narrows
        - Competitors or incumbents match the practical multi-hardware benefit without similar migration cost
        - Would compress the core differentiation that supports premium pricing
        - Re-rate toward lower-multiple software or infra comps
      - - Capital intensity or concentration starts to resemble downside infra cases
        - Large commitments or customer concentration emerge without offsetting margin transparency
        - Would raise the chance of a future funding reset and lower strategic leverage
        - Treat as thesis break until concentration or economics improve
    notes: >-
      These are monitorable events that would force a material reassessment of the recommendation even if the broader AI
      market remains strong.
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV037
      - CV038
      - CV041
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current revenue / ARR
        - Latest monthly revenue, ARR, and growth by product surface
        - This is the minimum input required to test whether $1.6B is cheap, fair, or expensive
        - Request board deck KPI page and latest operating review
      - - Gross margin by surface
        - Gross margin for shared endpoints, dedicated endpoints, BYOC, and services
        - Separates software-like economics from services-heavy revenue quality
        - Request finance cut by revenue surface and support burden
      - - Retention and concentration
        - NRR, GRR, logo retention, top-10 customer share, and named renewal calendar
        - Shows whether customer proof is durable and diversified or concentrated
        - Request cohort table plus concentration schedule
      - - Cap table and preferences
        - Share classes, liquidation preferences, SAFEs, option pool, and anti-dilution terms
        - A strong headline valuation can still hide weak common-equity outcomes
        - Request most recent cap table and financing docs
      - - Org mix
        - Split between product or platform engineers and forward-deployed or customer engineers
        - Tests whether Modular scales like software or a high-touch delivery organization
        - Request current org chart and hiring plan
      - - Pricing realization
        - Actual average selling prices, discounting, committed-use terms, and channel fees
        - Published list mechanics do not reveal realized economics
        - Request sample customer contracts and pricing waterfalls
    notes: Each row identifies evidence that would move the recommendation materially rather than merely add color.
    claimRefs:
      - CV008
      - CV009
      - CV011
      - CV016
      - CV042
      - CV043
      - CV044
