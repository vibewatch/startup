callouts:
  - calloutType: recommendation
    title: 'Recommendation: research-more, not buy'
    body: >-
      Modular has enough signal to stay on the short list, but the latest $1.6B mark is not underwritten by public
      revenue, margin, retention, or preference data. A better price or a private KPI pack could move the view
      meaningfully.
    claimRefs:
      - CV001
      - CV008
      - CV033
      - CV035
      - CV044
  - calloutType: risk
    title: The anti-thesis is a services-heavy scaling path
    body: >-
      The repeated presence of forward-deployed engineers and custom optimization work is valuable commercially, but it
      can also cap the margin profile and slow the transition from product relevance to software-multiple durability.
    claimRefs:
      - CV011
      - CV037
      - CV038
  - calloutType: assumption
    title: Peer marks alone do not justify Modular's price
    body: >-
      Recent funding rounds for Together AI, Groq, Lambda, and Cerebras prove category appetite, not that Modular is
      already operating at the revenue scale or margin quality needed to deserve a similar premium.
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
