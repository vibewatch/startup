      - number: '2.2'
        title: 用受证据约束的测算取代单一泛化 TAM
        blocks:
          - type: paragraph
            body: >-
              公开资料包支持市场方向，但不支持一个干净、权威的 Modular TAM。第三方发布机构测的是相邻边界。The Business Research Company 估算更宽泛的 AI 基础设施市场在 2026
              年为 USD 90.91 billion，Fortune Business Insights 估算 AI 推理市场在 2026 年为 USD 117.80 billion，Technavio 估算 2025 年
              AI 推理硬件为 USD 67.80 billion，至 2030 年 CAGR 为 20.8%。这些数字有用，但不能互换，因为它们混合了纯硬件、基础设施层，以及更宽的推理软件加硬件定义。CNCF 和
              KubeCon 报道提供了采用视角：Kubernetes 已被广泛用于生产和生成式 AI 推理，说明真实预算正从实验性模型访问，转向生产编排和成本控制。对 Modular
              最可辩护的市场测算框架因此是分层的。广义推理和 AI 基础设施估计描述外层 TAM；更近的 SAM 是企业和 AI-native 生产 serving 支出中，买家真正重视硬件可移植性、从专有 API
              迁移、BYOC 合规或成本敏感的多模型运营的那一部分。没有内部工作负载、客户或收入分段，公开 SOM 无法支撑。
