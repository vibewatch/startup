      - number: '5.2'
        title: 架构、部署模型和这套栈如何实际运行
        blocks:
          - type: paragraph
            body: >-
              Modular 解释 MAX 如何组织模型和 serving 内部结构时，技术故事最强。公开文档显示，MAX 把模型支持视为一组架构包：它们定义计算图、类型化 config、权重 adapter，以及把
              Hugging Face checkpoint 映射到 MAX graph 格式所需的任何自定义层。这不只是浅层 wrapper：平台声称提供硬件优化 kernel、生产 batching、KV-cache
              管理和多 GPU 分布，而无需用户从零重建 serving 层。Runtime 优化界面也很具体。MAX 文档把 speculative decoding、prefix caching 和 structured
              output 列为一等 serving 功能，并明确限制，例如 speculative decoding 不兼容 structured output。文档还说明 prefix caching
              默认开启，structured output 目前仅支持 GPU。


              部署架构同样具体。Modular 托管云提供 serverless、dedicated、custom-model 和 batch-inference 模式。Bring-your-own-cloud 选项把
              data plane 留在客户 VPC 内，同时把端点生命周期、扩缩容策略、监控和模型注册交给 Modular 运营的 control
              plane。这个拆分对有数据驻留要求的团队有吸引力，但也是企业买家必须接受的真实治理边界。Modular 还用 forward-deployed engineering support
              和明确承诺强化托管服务姿态：调优吞吐、延迟，甚至自定义 Mojo kernel。换句话说，产品不只是可下载 runtime，而是软件加专家运营的组合，运营模型横跨 graph compilation、kernel
              specialization、部署策略和人工调优支持。
