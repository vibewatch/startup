      - number: '1.4'
        title: 里程碑、牵引力主张和主要承销缺口
        blocks:
          - type: paragraph
            body: >-
              里程碑曲线显示，公司正从开发者语言发布，成熟为更宽的基础设施平台。Mojo 于 2023 年 5 月 2 日公开发布；到 Modular 宣布本地下载时，公司称已有超过 120,000
              名开发者注册，Discord 和 GitHub 上有 19,000 多名活跃用户。到 2025 年 9 月，公司声称平台每月下载量达数万次、GitHub star 超过 24,000、每天服务 trillions
              of tokens、生态覆盖 100 多个国家，并有 600,000 多行开源代码。路线图也在推进：核心标准库以 Apache 2 with LLVM exceptions 发布，公开 Mojo 网站列出 5 月
              7 日稳定版 1.0.0b1 和 6 月 11 日 nightly，26.3 版本称最终 1.0 预计在 2026 年晚些时候发布。产品范围也变宽，Mammoth 面向企业级 serving 推出，围绕 AWS
              和 AMD 的合作公告强化了硬件无关论点。最大未解问题不是技术品牌，而是商业证据：公开材料仍不披露收入、准确客户数、完整董事会组成，或开源 Mojo 组件与专有 / 合同约束商业栈之间的长期边界。GitHub
              上围绕许可的担忧讨论串并不会打破投资逻辑，但它确实说明开发者信任仍是承销负担的一部分。
