  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和替代品
        blocks:
          - type: paragraph
            body: >-
              不应把 Modular 当作参与所有 AI 软件或所有 GPU 基础设施支出的公司来分析。它自己的产品界面定义了更窄的市场：生产推理基础设施，包括托管共享端点、专用托管端点、自带云部署、自定义模型
              serving，以及承诺在 NVIDIA、AMD、CPU 和 Apple Silicon 之间可移植的编译器 / runtime 层。因此，纳入支出是买家为在生产环境中以可接受延迟、可靠性和合规性 serving
              模型而分配的预算，再加上调优 kernel、batching 和 routing 所需的工程层。排除支出包括基础模型创建、通用 SaaS copilots、无差异云 IaaS，以及大多数从未进入生产
              serving 的一次性实验。替代品集合很宽：专有模型 API、单一厂商 GPU 云、vLLM 或 TensorRT 集成等 wrapper-based 栈、自管 Kubernetes 推理，以及 ONNX
              Runtime 等可移植 runtime。这个框架重要，因为 Modular 更少是押注某个模型家族，更多是押注可移植性、部署灵活性和推理经济性会成为严肃 AI 运营方的采购标准。
