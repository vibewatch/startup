      - number: '7.2'
        title: 法律、监管、隐私和出口管制风险，正随 AI 合规边界扩张而上升
        blocks:
          - type: paragraph
            body: >-
              法律和监管风险并非来自某一起针对 Modular 的已知诉讼，而是来自 AI 基础设施供应商服务企业工作负载时可能承担的义务越来越多。Modular
              自己的隐私、条款和问题报告入口显示，公司会收集个人数据；在账户保持开放或业务需要时保留数据；把安全 / 隐私问题转给安全团队；并在条款中排除了大量可用性和责任风险。缓释一侧，其定价和 BYOC 页面宣传 SOC
              2 Type 2 认证及客户 VPC 部署。但外部政策来源清楚表明，合规底线正在移动。DOJ 的 Data Security Program 已经生效，并围绕大批量敏感个人数据提出尽调、审计和受限交易要求。BIS
              继续收紧先进计算出口管制。NIST 的 Cyber AI Profile 把 AI 系统的网络安全控制框定为不断上升的预期，而不是小众最佳实践。在州层面，NCSL 和 Troutman 都显示，私营部门部署 AI
              现在面对的透明度、歧视、来源和行业特定责任拼图正在扩大。对 Modular 而言，关键风险不太是眼下一次违规，而是向受监管企业销售的速度，可能快过公司把这些义务映射进合同、共同责任边界和运营控制的能力。
