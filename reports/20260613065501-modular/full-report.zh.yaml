              Hippocratic；客户页面其余部分混合了合作伙伴背书、硬件平台引用，以及未具名的企业级规模说法。Reuters
              及后续报道也强化了一点：公司的商业动作既直接面向企业，也通过与云厂商的收入分成合作推进。因此，渠道杠杆既是优势，也是依赖。BYOC 降低了买方摩擦，适合希望把数据和云额度留在自身边界内的团队；但这也意味着
              Modular 依赖云和硬件生态，而不是掌控完整的全栈经济性。反向背景同样重要：CUDA 锁定、供给稀缺、超大规模云厂商分发，都会抬高迁移摩擦。结论是：Modular 对 AI
              推理买方中的真实一部分看起来具备商业相关性，但在客户广度、留存和集中度上仍披露不足。
