  - id: TR005
    title: 缓释和否决标准表
    columns:
      - 风险
      - 可监控触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 法律 / 合规漂移
        - 受监管客户控制失败或接触执法机构
        - 任何与隐私、DSP 或州级 AI 控制有关的公开执法行动、重大客户补救或审计失败
        - 暂停承销，直到审阅产品控制映射、法律顾问分析和补救证据
      - - 硬件 / 供应依赖
        - 无法及时获得优先 GPU 产能，或主要供应商路线图滑坡
        - 反复无法在预期发布窗口内支持最新目标硬件，或因硬件不可得导致重大客户流失
        - 下调可移植性优势，并假设受限供应带来利润率压力
      - - 渠道依赖
        - AWS Marketplace / 超大规模云渠道在没有多元化直接赢单证明的情况下成为主导
        - 企业订单额很大一部分依赖一个交易市场或一种云伙伴动作
        - 将收入质量视为更低，并在模型中计入集中度折价
      - - 交付能力瓶颈
        - 面向现场的工程利用率或排队时间飙升
        - 有意义的积压、延迟事故增加，或无法按时接入 / 定制优化新账户
        - 假设规模化更偏服务，并下调软件倍数假设
      - - 财务不透明
        - 公司继续抬高预期，却不披露基本单位经济
        - 到下一轮重大融资或刷新周期时，仍没有可信披露收入质量、烧钱速度或利润率进展
        - 维持信心上限，并要求直接尽调访问后再上调观点
      - - 人员 / 治理
        - 创始人离任、继任者缺失，或董事会 / 控制权疑虑未解决
        - CEO、总裁或主要技术负责人离任，且没有清晰继任和运营连续性计划
        - 将投资逻辑转为持有 / 重新承销，直到领导连续性得到证明
    notes: 否决标准刻意设计为可监控。它们不是预测；而是一旦触及，就应重新审视当前建设性但谨慎风险观点的阈值。
