        - Sacra 称上一轮隐含约 9.6x 2024 年收入
        - 最接近的同业，兼具 token API 和 GPU 云，收入启发式指标更可见
        - 收入数字是分析师估计，并非公司申报
      - - Groq
        - 私有推理基础设施厂商
        - 2025 年 9 月投后估值 $6.9B
        - 已披露估值；抓取资料包未披露收入
        - 显示投资人愿意为推理赢家支付稀缺性溢价
        - 业务组合和硬件策略不同于 Modular
      - - Lambda
        - 私有 GPU 云 / AI 基础设施厂商
        - 2025 年 Series E 超过 $1.5B；此前报道提到 $4B 估值
        - 已披露估值；提及客户规模，但这里收入仍不透明
        - 可作为基础设施需求和 GPU 云偏好的参考可比对象
        - 相比 Modular 的软件主导叙事，更接近 GPU 云和硬件容量风险敞口
      - - Cerebras
        - 私有 AI 硬件 / 系统公司
        - 2025 年 9 月估值 $8.1B
        - 已披露估值；抓取资料包未披露收入
        - 显示前沿 AI 基础设施资本如何给平台稀缺性定价
        - 硬件偏重，不能直接与 Modular 比较
      - - CoreWeave
        - 已提交监管文件的 AI 基础设施公司
        - S-1/A 显示 2024 年收入 $1.9B，capex 和客户集中度很高
        - 规模存在，但资本强度和客户集中度也极端
        - 可提醒：基础设施增长再快，也可能带有结构性风险
        - 不是软件可移植性平台；资本结构和资产基础大得多
