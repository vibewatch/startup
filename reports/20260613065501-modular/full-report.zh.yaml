      - number: '3.4'
        title: 护城河耐久性、买家匹配和竞争结论
        blocks:
          - type: paragraph
            body: >-
              最可辩护的 Modular 逻辑不是「MAX 到处打败所有人」。更可信的逻辑更窄：某些买家越来越想要一套栈，能快速启动新硬件，保留自定义 kernel 空间，并降低对 CUDA-only
              工作流的依赖。对这些客户而言，Modular 的 MAX 加 Mojo 加 Mammoth
              一体化故事有差异化，也有实质产品工作支撑。公开材料显示出真实野心和足够第三方验证，可以把这个楔子视为真实存在。但护城河仍是有条件的，而不是已经落定。vLLM 和 SGLang
              拿住更多开放推理心智份额。TensorRT-LLM 搭载最深的既有平台。Together 和 Anyscale 简化了那些更看重便利或控制、而非运行时新颖性的买家的采购。内部自建路径仍可信。


              实际结果是一个分层市场。当工作负载是 dense-model 推理、买家重视跨厂商可移植性，并愿意采用较新的栈来换取潜在性能或灵活性收益时，MAX 看起来最强。当需求是默认稳妥的 OSS 广度、完全成熟的 MoE
              和 adapter 生态、全托管云便利，或严格绑定 NVIDIA 软件和渠道栈时，MAX 看起来较弱。这是有意义但比广泛基础设施赢家叙事更窄的竞争位置；因此，护城河耐久性取决于 Modular
              能否在既有厂商吸收更多同类叙事之前，把可移植性楔子转化为可重复客户采用。
