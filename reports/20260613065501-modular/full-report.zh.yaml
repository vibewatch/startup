              为特殊项目负责人。独立和投资方信息增强了创始人-市场匹配信心：GV 强调 Lattner 的 LLVM、Clang、Swift 和 TPU 背景，以及 Davis 的 TensorFlow Lite 和端侧 ML
              经验；TechCrunch 和 SDxCentral 也独立称公司位于 Palo Alto。办公版图披露也扩大了。Modular 的 About 页面现在列出 San Francisco、Los
              Altos、Boston 和 Edinburgh 办公室；办公室扩张文章称 Edinburgh 位于 Bayes Centre，San Francisco 的 Jackson Square 办公室则补充 Los
              Altos 总部。规模披露仍是方向性而非完整口径：公司称 2025 年 9 月员工已超过 130 人，Reuters 相关报道也称当时约 130
