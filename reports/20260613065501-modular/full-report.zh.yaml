companyProfile:
  summary: >-
    Modular 是一家湾区私有 AI 基础设施公司，Chris Lattner 和 Tim Davis 于 2022 年创立。公司已经从早期 Mojo 语言叙事，扩展为覆盖 MAX 推理、Mammoth 编排，以及面向硬件可移植
    AI serving 的托管或 BYOC 部署界面的一整套栈。最强的公开证据包括 2025 年 $250 million Series C、$1.6 billion 估值，清晰的跨硬件定位，以及
