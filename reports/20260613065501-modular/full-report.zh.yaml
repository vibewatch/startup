  - id: FR001
    title: 风险热力图——按类别划分的剩余严重性
    type: matrix
    layout: wide
    summary: 法律合规漂移和合作伙伴 / 硬件依赖的剩余严重性最高，因为 Modular 的缓释措施确实存在，但仍靠外部生态和不完整公开披露支撑。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
