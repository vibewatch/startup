      - number: '4.4'
        title: 资本充足性、融资依赖和财务结论
        blocks:
          - type: paragraph
            body: >-
              Modular 的资本基础是真实的，但公开证据仍无法支撑精确跑道判断。公司在种子轮、Series B 和 Series C 中合计融资约 $380 million，最新一轮估值约 $1.6
              billion。公开报道还称，2025 年融资将用于工程和 go-to-market 扩张，同时推动公司从推理进入训练。这很重要，因为一个软件主导的推理平台，在依赖 BYOC、伙伴云和 marketplace
              渠道时，可以保持相对 asset-light；但更深进入训练，或更重地持有基础设施，都可能显著提高资本强度。最干净的可比警示来自 CoreWeave 的 S-1/A：AI
              基础设施的爆炸式收入增长，可以和大额净亏损、重大债务、可观 capex 需求以及客户集中并存。反向竞争背景也指向同一方向：NVIDIA 的 CUDA 锁定、MGX 生态和一体化平台 bundling
              提高迁移摩擦，并可能限制替代栈把兴趣转化为盈利性经常性支出的速度。因此结论是，Modular 作为软件加服务平台在财务上看起来有前景，但作为可承销企业仍受证据限制，因为收入质量、毛利结构和现金跑道仍是私有信息。
