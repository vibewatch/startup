      - number: '3.3'
        title: 切换成本、分发力，以及 incumbents 为什么仍强
        blocks:
          - type: paragraph
            body: >-
              反驳 Modular 耐久护城河的最强反向证据，不是 MAX 缺少技术价值，而是很多买家不会迁移，除非迁移负担明显值得。CUDA 锁定会靠工具、库、验证工作流，以及先在 NVIDIA 上走「fast
              path」的实际习惯不断累积。AlphaStreet 2026 年文章引用 NVIDIA 披露的生态规模，强调这种装机基础的深度。NVIDIA 自己的 MGX
              材料把故事从软件延伸到伙伴分发、模块化服务器参考设计和全栈系统兼容性。TensorRT-LLM 随后给这套硬件基础配上专用 serving 栈。对保守企业来说，这个 bundle
              最好的一面就是无聊：懂它的工程师很多，集成路径熟悉，qualification 负担已经被吸收。


              Modular 试图靠可移植性和更好经济性打破这种惯性，但竞争对手生态也能彼此协作。Anyscale 明确表示，用户可以在其平台上扩展 vLLM 和 SGLang。内部自建买家可以在 Ray 下跑 vLLM，或把
              llm-d 和 ONNX Runtime 叠进自己的栈。托管买家可以用 Together，而不是运营任何 runtime。这些选项让 multi-homing 现实可行，也降低了 MAX
              成为唯一架构默认选项的概率。因此，Modular 的分发挑战至少和技术挑战一样大。
            claimRefs:
