  - id: FR002
    title: 风险传导图——外部冲击如何打到收入、利润率和估值
    type: dag
    layout: wide
    summary: 合规漂移、硬件短缺和交付瓶颈，最终都会汇聚成部署放慢、利润率承压，以及更弱的估值叙事。
    data:
      nodes:
