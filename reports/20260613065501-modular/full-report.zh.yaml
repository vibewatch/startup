  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 典型 Modular 工作流从选择或适配模型开始，把模型放到 MAX API 后面提供服务，再按工作负载复杂度扩展到托管云、BYOC 或 Mammoth。
    approximationNotes: 这条流程强调客户动作点，而不是内部调度器的每一步。
    data:
      nodes:
        - id: choose-model
          label: 选择受支持模型或检查点
          detail: 从受支持的 Hugging Face 架构或相近参考模型开始。
          tone: neutral
        - id: adapt-model
          label: 按需适配配置和权重
          detail: 使用 MAX 架构包、配置映射和权重适配器，完成自定义上线。
          tone: positive
        - id: serve-endpoint
          label: 启动 MAX 端点
          detail: 暴露一个由 CLI 或 Docker 托管的 OpenAI 兼容端点，用于自托管验证。
          tone: positive
        - id: optimize-runtime
          label: 启用运行时优化
          detail: 根据工作负载形态和约束，加入前缀缓存、推测解码或结构化输出。
          tone: positive
        - id: choose-deployment
          label: 选择部署模型
          detail: 留在自托管，迁移到托管无服务器或专用端点，或把数据平面放进客户 VPC。
          tone: neutral
        - id: scale-fleet
          label: 扩展到 Mammoth 或企业运维
          detail: 当集群变得异构或规模扩大时，使用多模型编排、解耦推理和前置部署调优支持。
          tone: warning
      edges:
        - from: choose-model
          to: adapt-model
          label: 如果架构不同
        - from: adapt-model
          to: serve-endpoint
          label: 编译并注册
        - from: serve-endpoint
          to: optimize-runtime
          label: 调优服务路径
        - from: optimize-runtime
          to: choose-deployment
          label: 决定运行位置
        - from: choose-deployment
          to: scale-fleet
          label: 扩展工作负载
    claimRefs:
      - CE002
      - CE003
      - CE014
      - CE017
      - CE020
      - CE022
      - CE024
