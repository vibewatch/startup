      - 依赖
      - 风险
    rows:
      - - Hugging Face / 模型架构映射
        - 提供 checkpoint、配置元数据，以及 MAX 适配的源模型家族
        - 依赖 MAX 参考架构和权重适配器持续跟上
        - 新架构或快速演进架构可能拉长 bring-up 时间
      - - MAX 图与模型层
        - 构建类型化配置、计算图、量化设置和多 GPU 执行计划
        - 依赖 arch.py、model.py、model_config.py 等架构包
        - 不受支持的图差异可能迫使团队做定制工程
      - - 服务运行时
        - 暴露兼容 OpenAI 的端点、批处理、KV-cache 管理和运行时功能
        - 依赖图编译、缓存格式和端点标志
        - 功能组合有明确限制，例如 speculative decoding 与 structured output 不能并用
      - - Mojo 内核层
        - 实现可移植 GPU 和 CPU 内核，并支持 custom ops 扩展
        - 依赖 Mojo 语言成熟度，以及编译器在不同目标上的行为
        - 封闭编译器治理仍是可审计工具链的尽调问题
      - - 部署控制平面
        - 处理端点生命周期、扩缩容、可观测性；在 Mammoth 场景下还处理工作负载放置
        - 即使采用 BYOC 模式，也依赖 Modular 运营的控制服务
        - 相比纯自托管，客户控制力下降，受监管买家尤其敏感
      - - 人工支持层
        - 前置部署工程师为企业部署调优工作负载并编写自定义内核
        - 依赖服务产能和 Modular 自身工程带宽
        - 经济与运营扩展性可能弱于纯软件毛利率暗示的水平
    notes: 这张架构表同时列出软件组件和运营模式，因为 Modular 的企业产品交付包含专家服务。
