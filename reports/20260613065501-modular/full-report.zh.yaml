  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 理由
      - 什么会改变观点
    rows:
      - - 建议
        - 继续研究
        - 公开证据显示真实产品需求，但经济性披露不足，无法在今天承销 $1.6B
        - 只有入场价格更低，或拿到私下 KPI 证据，才上调
      - - 信心
        - 中
        - 融资、客户证明和市场增长都真实存在，但经济性材料缺失
        - 如果披露 ARR、利润率和留存，信心会上升
      - - 风险评级
        - 高
        - 轻资本软件上行空间存在，但服务结构、集中度和以 NVIDIA 为中心的竞争仍可能压缩价值
        - 关注降价轮或集中度信号
      - - 估值立场
        - 偏高
        - 这个标记并非不可能，但公开数据无法说明收入是否接近支撑 6-10x 软件倍数所需的水平
        - 敏感性取决于未披露收入和利润率
      - - 决策含义
        - 不应只凭公开证据给出买入
        - 继续跟踪并开启尽调；只有价格更好，或私下指标确认规模后，才更建设性
        - 当前标记提供的是可选性，不是承销清晰度
    notes: 这张表刻意对价格敏感：同样的公司质量，在披露经济性和入场点不同的情况下，可以支持不同判断。
