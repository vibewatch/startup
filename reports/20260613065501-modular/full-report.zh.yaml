        - from: U4
          to: U6
          label: 服务也推高服务成本
        - from: U5
          to: U6
          label: ASP 扣除计算 + 支持成本后决定利润率
    approximationNotes: 这条桥是定性的，因为公开来源披露了驱动因素，但没有披露毛利率、CAC 或回本周期等输出指标。
