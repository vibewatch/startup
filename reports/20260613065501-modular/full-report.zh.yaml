              和社区工具吸引开发者，共享端点降低试用门槛，一旦可靠性、合规或成本控制变重要，专用或 BYOC 部署就成为付费路径。Reuters
              增加了一个重要细节：公司计划直接向企业销售，也通过与云提供商的收入分成伙伴关系销售。AWS 合作和 AWS Marketplace 材料强化了这种解读，因为它们显示了通过 AWS
              账户集中采购、支持包装，以及不止一个推理端点的至少两个 Marketplace 应用。公开验证混合但真实。Modular 点名 Inworld、AWS、NVIDIA、AMD 和 Hippocratic AI
