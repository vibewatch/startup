      - number: '2.3'
        title: 买家、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Modular 的买家地图比「任何运行模型的人」更细。自助和共享端点界面面向开发者和产品团队，他们想要快速实验、明确 token 经济性，并尽量少做基础设施工作。BYOC 方案不同：它瞄准平台、安全和 ML
              基础设施团队，这些团队需要数据留在客户 VPC，想复用云承诺，并且更偏好企业工程支持，而不是内部拼集群。解决方案页面暗示至少三个短期、工作流很重的细分：agent builders、语音团队和
              coding-tool 厂商。每个场景里，终端用户体验产品，但经济买家通常是平台负责人、AI 工程经理或采购 / FinOps owner，他们要对延迟、毛利率和供应商风险负责。客户页面进一步拓宽了地图，展示
              AWS、AMD、NVIDIA、Inworld 和 Hippocratic AI 等云、硬件和应用伙伴。这个组合说明 Modular
              卖的不是通用开发者工具，而是面向有重复推理负载、且高度敏感于基础设施设计的组织的生产 serving 层。
