  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 投资逻辑论点
      - 证据
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 硬件可移植切口真实存在
        - 公司和第三方资料反复把 MAX 定位为横跨 NVIDIA、AMD 和 Apple 目标，并提供兼容 OpenAI 的端点
        - NVIDIA 的一体化栈和 CUDA 使用惯性，仍是许多买家的默认生产路径
        - 需要独立、多客户证据，证明可移植性能赢下实质性企业支出
      - - 客户证据显示真实经济价值
        - Inworld 和 Hippocratic 都称，在接近生产的场景中获得了有意义的延迟或效率改善
        - 具名证据仍然集中，且由公司筛选
        - 需要更广泛的独立客户案例，附续约和支出数据
      - - 开源漏斗可以带来企业转化
        - GitHub、Apache 2 许可、公开 CI 和社区会议支撑开发者采用
        - 庞大的开源社区并不保证企业变现
        - 需要从社区到付费产品的转化和留存收入数据
      - - 市场增长顺风很强
        - 第三方报告显示，AI 基础设施和推理市场仍在快速复合增长
        - 市场高速增长会吸引资本更充足的对手，并压缩差异化
        - 需要证据证明，标准化和平台捆绑之下 Modular 仍能持续赢单
      - - 如果经济性已经很强，当前价格可以成立
        - 如果收入足够高、利润率接近软件，$1.6B 相比私有基础设施同业可能合理
        - 若没有披露收入和利润率，这一估值可能只是叙事溢价
        - 需要私有 KPI 包，显示收入规模、毛利率、NRR 和客户集中度
    notes: 这些论点刻意绑定证据和反向证据，而不是泛泛赞美产品类别。
