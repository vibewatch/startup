  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序：法律合规漂移和生态依赖，比短期偿付能力更重要
        blocks:
          - type: paragraph
            body: >-
              Modular 的风险堆栈不是由单一生死缺陷主导，而是由合规、生态依赖和执行不透明之间的相互作用主导。最强的公开缓释因素是真实存在的：公司称付费产品已通过 SOC 2 Type 2 认证；提供 BYOC/VPC
              部署，把推理输入和输出留在客户网络内；2025 年以 $1.6 billion 估值融资 $250 million；并宣传可在 NVIDIA、AMD、Apple
              和云环境之间移植。这些因素降低了眼前的数据驻留、融资和单一供应商风险。但风险并未消失。同一组来源也显示，Modular 的 go-to-market 仍重度依赖前置部署工程师、AWS
              分发与采购入口，以及对最新加速器路线图的持续支持。公开证据在收入、毛利率、客户集中度、事故历史和管理层继任方面仍然稀薄。因此，剩余严重度最高的风险是法律 / 监管漂移和合作伙伴 / 硬件依赖，其次是运营交付和人员
              / 执行风险。近期融资缓释了短期财务风险，但该风险仍然重要，因为外部投资者无法公开验证需求能否转化为耐久的软件经济性。
