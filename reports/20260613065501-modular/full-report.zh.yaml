  - id: TV005
    title: 投资逻辑失效与止损触发因素表
    columns:
      - 触发因素
      - 门槛 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 下一轮融资低于 2025 年估值重设
        - 相比 $1.6B 持平或降轮
        - 意味着私募投资人不再支撑既有叙事溢价
        - 下调立场，并重审下行情景
      - - 客户广度没有超出参考账户
        - 没有证据显示付费账户多元化、续约或集中度下降
        - 会削弱「Modular 正从窄优化厂商变成广泛平台」这一主张
        - 在广度改善前，维持或降低确信度
      - - 服务强度持续过高
        - 前置部署工程仍是多数赢单的必要条件，且毛利率证据一直不出现
        - 会限制倍数扩张，让公司更像高端服务而非可扩展软件
        - 增加风险敞口前，要求披露产品利润率和支持比率
      - - 可移植优势收窄
        - 竞争对手或 incumbent 在不带来类似迁移成本的情况下，匹配实际多硬件收益
        - 会压缩支撑溢价定价的核心差异化
        - 按更低倍数的软件或基础设施可比对象重新定价
      - - 资本强度或集中度开始类似基础设施下行情形
        - 出现大额承诺或客户集中，同时没有利润率透明度抵消
        - 会提高未来融资重设的概率，并降低战略杠杆
        - 视为投资逻辑失效，直到集中度或经济性改善
    notes: 这些是可监控事件；即便更广泛的 AI 市场仍强，一旦发生也会迫使建议出现实质性重估。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV037
      - CV038
      - CV041
      - CV045
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 当前收入 / ARR
        - 按产品表面拆分的最新月收入、ARR 和增长
        - 要判断 $1.6B 是便宜、合理还是昂贵，这是最低限度输入
        - 索取董事会材料中的 KPI 页和最新经营复盘
      - - 按表面拆分的毛利率
        - 共享端点、专用端点、BYOC 和服务的毛利率
        - 把软件式经济性和服务偏重的收入质量分开
        - 索取按收入表面和支持负担拆分的财务切片
      - - 留存和集中度
        - NRR、GRR、logo 留存、前 10 大客户占比和具名续约日历
        - 显示客户证据是持久且多元，还是集中
        - 索取 cohort 表和集中度明细
      - - 股权结构表和优先权
        - 股份类别、清算优先权、SAFE、期权池和反稀释条款
        - 强劲的表面估值仍可能掩盖普通股结果偏弱
        - 索取最新股权结构表和融资文件
      - - 组织结构
        - 产品或平台工程师，与前置部署或客户工程师的占比
        - 测试 Modular 是像软件一样扩展，还是像高接触交付组织一样扩展
        - 索取当前组织架构和招聘计划
      - - 定价实现
        - 实际平均售价、折扣、承诺使用条款和渠道费用
        - 公开标价机制不能揭示实际经济性
        - 索取客户合同样本和定价瀑布
    notes: 每一行都指出会实质性改变建议的证据，而不只是补充背景。
    claimRefs:
      - CV008
      - CV009
      - CV011
      - CV016
      - CV042
      - CV043
      - CV044
