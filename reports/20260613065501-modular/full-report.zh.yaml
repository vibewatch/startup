  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台地图和客户侧工作流
        blocks:
          - type: paragraph
            body: >-
              Modular 面向客户的产品已经不只是「一门编程语言」或「一个推理引擎」。公开界面现在可以拆成四个相互连接的层。第一，MAX 是 serving 和模型执行框架：它暴露 OpenAI-compatible
              endpoint，可通过 CLI 或 Docker 自托管运行，并给开发者一条类似 PyTorch 的路径来做自定义模型和自定义 ops。第二，Mammoth 是 scale-out 编排层：一个
              Kubernetes-native 控制平面，服务那些需要在异构 GPU 集群中放置多个模型，并自动平衡性能和成本的组织。第三，Mojo 是栈底部面向 kernel 的语言。Modular 把它呈现为开发者扩展
              MAX、编写 hardware-agnostic GPU kernel，并在 NVIDIA、AMD、Apple 和 CPU 之间保持可移植性的方式。第四，Modular
              把软件包在几个部署界面里——自托管端点、托管 serverless 或专用端点，以及把推理流量留在客户 VPC 的 bring-your-own-cloud 选项。


              放到客户工作流里，架构很直观，尽管实现很有野心。团队先选择一个受支持模型，或把相邻的 Hugging Face 架构移植到 MAX；随后把模型放在 OpenAI-compatible API 后
              serving，再选择把端点留在本地、迁入 Modular 托管云，或采用 VPC-resident 部署。如果工作负载变大、多模型化或异构化，Mammoth
              就是下一层，用来协调模型放置和分布式推理。这个顺序很重要，因为它让产品变得可理解：MAX 是执行层，Mammoth 是集群管理层，Mojo 是可扩展性层。最佳证据支持一张真实模块地图，而不是营销伞面，尽管社区 /
              开放入口和合同约束商业使用之间的边界仍需尽调。
