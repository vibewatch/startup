            body: >-
              Modular 没有一个公开客户原型。免费的 Self Hosted 版本和开源 MAX
              repo，显然是为了吸引想在没有前期支出的情况下测试开放模型推理的开发者和平台工程师。变现从开发者兴趣转化为生产流量时开始：Shared Endpoints 面向实验和可变负载生产，按 token
              付费；Dedicated Endpoints 面向 latency-sensitive 生产，使用预留 warm capacity；BYOC 面向重视安全或合规的团队，他们希望推理留在自己的云或 on-prem
              环境里。这意味着买家、用户和付款方经常分离。开发者可能启动评估，但在 Dedicated 和 BYOC 界面上，平台、基础设施、安全或财务 owner 才是真正预算持有人。公开记录还显示第二层商业关系：AWS 和
              SF Compute 等渠道和生态合作方。即便它们不是最终 end-customer 工作负载 owner，也会塑造采购和部署路径。
