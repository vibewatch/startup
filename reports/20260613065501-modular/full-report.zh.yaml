  - id: FI004
    title: 资本强度 / 现金流图
    type: matrix
    layout: standard
    summary: 这张矩阵展示当前资产负债表负担落在哪里，以及 Modular 若调整战略姿态，负担可能在哪些地方上升。
    data:
      columns:
        - 当前资产负债表负担
        - 公开证据说明
        - 主要财务风险
      rows:
        - label: Modular 云中的共享端点
          values:
            - 中等
            - Modular 拥有托管体验，因此相比 BYOC 可能承担更多直接计算敞口，但公开成本未披露。
            - 利用率不足或激进折扣可能压缩利润率。
        - label: Modular 云中的专用端点
          values:
            - 中高
            - 预留热容量提升买方可靠性，但可能增加 Modular 托管部署的承诺计算负担。
            - 闲置预留容量和支持强度会拖累贡献利润率。
        - label: BYOC 部署
          values:
            - 较低
            - 客户云额度和基础设施留在客户账户内，Modular 提供软件、控制平面和工程支持。
            - 抽成率可能低于完整托管方案，支持负担仍可能偏高。
        - label: AWS Marketplace / 合作伙伴渠道
          values:
            - 较低
            - 合作伙伴采购把部分获客摩擦转移到云渠道。
            - Marketplace 费用和收入分成会稀释每笔签约额的净实现收入。
        - label: 训练扩张
          values:
            - 可能上升
            - Reuters 和 Modular 都指向从推理向训练扩张。
            - 训练可能需要更多计算、更长周期和更多资本，之后才回本。
        - label: 更重的基础设施所有权（可比警示）
          values:
            - 可比案例中为高
            - CoreWeave 显示，拥有更多基础设施时，强劲增长可能伴随债务、资本开支和集中度风险。
            - 战略若转向资产所有权，融资依赖可能大幅上升。
    approximationNotes: 方向性标签反映资产负担似乎落在哪里，不是量化的 Modular 损益表。加入可比行，是为了框定战略若转向更重基础设施所有权可能发生什么。
