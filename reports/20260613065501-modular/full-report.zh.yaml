  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Modular 方案
      - 可量化收益
      - 局限
    rows:
      - - 快速启动标准开放模型
        - 拉取 Hugging Face 模型，搭建端点，接入 OpenAI 客户端
        - max serve 或 Docker 启动兼容 OpenAI 的端点
        - 代码改动最少，自托管验证推进快
        - 收益在落地速度，不等于证明企业级耐久性
      - - 移植自定义或相邻架构
        - 手动适配配置字段、checkpoint 名称和自定义层
        - MAX 参考架构，加上 arch.py、model_config.py、model.py 和 weight_adapters.py 工作流
        - 复用既有计算图和内核，不必从零搭建服务栈
        - 深度创新架构可能仍需要新的图组件
      - - 提升重复 prompt 工作负载吞吐
        - 服务重复系统 prompt 或长对话时，KV-cache 重复计算冗余
        - Prefix caching 通过 PagedAttention 默认启用
        - prefix 重复时，TTFT 更低，有效吞吐更好
        - 唯一 prompt 或解码主导型工作负载收益有限
      - - 提高受支持模型的 token 生成效率
        - 目标模型逐步运行，每个 token 都承担完整验证成本
        - 用 EAGLE、EAGLE3、MTP 或独立 draft model 做 speculative decoding
        - 每步可接受多个 token，计算利用率更高
        - 启用 speculative decoding 后，不支持 structured output 和 echo
      - - 在应用工作流中强制 schema 安全响应
        - 在下游 Python 或中间件解析自由格式模型文本
        - 借助 llguidance、JSON schema 或 Pydantic 实现 structured output
        - 下游系统拿到可预测的输出契约
        - 目前仅支持 GPU；仍需仔细测试，因为模型训练本身仍然关键
      - - 运行大规模、多模型生产集群
        - 手动把模型放到不同 GPU 类型上，并手工处理扩缩容
        - Mammoth 控制平面提供模型放置、自动扩缩容和解耦式推理
        - 混合集群里的硬件利用率和多模型编排更好
        - 公开证据主要是公司撰写的预览材料，还不是广泛一线验证
    notes: 各行刻意按真实买家任务组织，而不是按产品品牌组织，让工作流表始终锚定团队想用这套栈完成什么。
