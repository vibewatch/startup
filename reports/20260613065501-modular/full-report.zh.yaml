  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从市场机会和证明点，推导到当前对证据敏感的建议。
    data:
      nodes:
        - id: n1
          label: 大市场顺风
          detail: 第三方报告仍显示，AI 基础设施和推理支出在快速增长。
        - id: n2
          label: 真实产品证明
          detail: 融资、Inworld、Hippocratic 和可移植性主张，说明需求并不轻。
        - id: n3
          label: 开发者漏斗
          detail: 开源、GitHub 活跃度和社区触点，把漏斗顶端触达做了出来。
        - id: n4
          label: 经济性不透明
          detail: 收入、毛利率、留存和集中度仍未公开披露。
        - id: n5
          label: 现有巨头压力
          detail: NVIDIA 锁定和拥挤的推理替代方案，压低了确信度。
        - id: n6
          label: 立场：research-more
          detail: 当前估值标记说得通，但仅靠公开证据还撑不起承销判断。
      edges:
        - from: n1
          to: n6
          label: 支撑上行可选性
        - from: n2
          to: n6
          label: 显示真实需求
        - from: n3
          to: n6
          label: 支撑漏斗论点
        - from: n4
          to: n6
          label: 阻止买入判断
        - from: n5
          to: n6
          label: 抬高执行风险
    claimRefs:
      - CV018
      - CV019
      - CV014
      - CV015
      - CV017
      - CV035
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在不同收入倍数下，Modular 要支撑 $1.6B 估值所需达到的收入门槛。
    data:
      items:
        - label: 12x 收入倍数
          value: 133.3
          unit: $M revenue
          note: 高端软件式倍数
        - label: 10x 收入倍数
          value: 160
          unit: $M revenue
          note: 高增长私营软件基准
        - label: 8x 收入倍数
          value: 200
          unit: $M revenue
          note: 仍假设强增长和健康利润率
        - label: 6x 收入倍数
          value: 266.7
          unit: $M revenue
          note: 较低但仍偏增长的倍数
    approximationNotes: 数值只是用最新披露的 $1.6B 估值标记除以倍数得出的简单计算；它们是门槛检查，不是对 Modular 当前收入的预测。
    claimRefs:
      - CV001
      - CV028
      - CV033
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于执行、披露和竞争压力，给出未来 24-36 个月的情景估值区间。
    data:
      items:
        - label: 熊市情景估值
          low: 0.6
          mid: 0.9
          high: 1.2
          displayValue: $0.6B-$1.2B
          detail: 经常性经济性尚未证明，差异化先收窄。
          tone: warning
        - label: 基准情景估值
          low: 1.5
          mid: 2
          high: 2.5
          displayValue: $1.5B-$2.5B
          detail: 增长仍强，但经济性披露仍不完整。
          tone: neutral
        - label: 牛市情景估值
          low: 3
          mid: 4
          high: 5
          displayValue: $3.0B-$5.0B
          detail: 收入规模、多元化和软件式利润率在私下得到确认。
          tone: positive
    approximationNotes: 这些区间是分析师情景范围，锚定当前 $1.6B 估值标记、同业融资轮次，以及关于披露和执行的明确假设；它们不是公司指引。
    claimRefs:
      - CV032
      - CV039
      - CV040
      - CV041
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 以 IC 记分卡方式，呈现今天承销 Modular 时最关键的维度。
    data:
      items:
        - label: 市场顺风
          value: High
          note: AI 基础设施和推理市场规模大，且仍在快速增长
        - label: 产品证明
          value: Medium-High
          note: 具名客户成果和可移植性主张有意义，但范围偏窄
        - label: 护城河耐久度
          value: Medium
          note: 可移植性楔子真实存在，但现有巨头和 OSS 替代方案仍强
        - label: 收入可见度
          value: Low
          note: 审阅材料中没有公开 ARR 或收入披露
        - label: 利润率可见度
          value: Low
          note: 没有按产品模块公开披露毛利率
        - label: 融资支持
          value: High
          note: 刚完成 $250M 融资，品类融资背景也强
        - label: 估值清晰度
          value: Low
          note: 当前估值标记无法落到已披露经济性上
        - label: 总体立场
          value: Research-more
          note: 等待私有 KPI 证明，或更有利的入场点
    claimRefs:
      - CV001
      - CV014
      - CV015
      - CV018
      - CV019
      - CV032
      - CV035
      - CV042
