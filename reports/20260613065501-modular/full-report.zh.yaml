  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 收入已经进入或正快速逼近 $200M+ 区间；开源漏斗转化为广泛企业账户；跨 NVIDIA 和 AMD 的可移植性仍有差异化
        - 如果投资人奖励已披露规模和软件式利润率，未来 24-36 个月潜在估值区间为 $3.0B-$5.0B
        - 低-中
        - 执行、集中度和 incumbent 反应仍然重要
      - - 基准
        - 增长仍强，但经济性披露仍不完整，模式仍是软件和高接触服务的混合
        - 潜在估值区间 $1.5B-$2.5B，大致在最新估值附近或略高
        - 中
        - 倍数压缩或转化放缓可能限制上行
      - - 悲观
        - 差异化收窄，付费转化滞后，或下一轮在经常性经济性公开证据出现前被迫重设估值
        - 存在降轮风险、议价能力变弱，潜在估值区间 $0.6B-$1.2B
        - 中
        - 可移植性变成功能同质化，服务负担仍然高
    notes: 区间是分析师情景，锚定已披露融资背景、同业轮次以及缺少公开收入披露这一事实；并非公司指引。
