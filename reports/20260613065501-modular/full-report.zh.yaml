chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立背景，以及公司实际销售什么
        blocks:
          - type: paragraph
            body: >-
              Modular 把自己描述为一家构建统一 AI 计算层的公司，而不是某个芯片厂商或某个模型家族的点状工具。结合 About 页面、定价界面和 2025 年融资文章，公司始终把核心产品定义为围绕 MAX、Mojo
              以及现在的 Mammoth 打造的硬件可移植推理基础设施，部署选项覆盖 Modular 托管云、客户 VPC 和自托管环境。创立故事也一致：Chris Lattner 和 Tim Davis 在 Google
              相识，认为割裂的 AI 基础设施拖慢了采用，于是在 2022 年创立 Modular，试图把复杂性抽象掉。公开地址表述在 Silicon Valley、Palo Alto、Los Altos 和更宽泛的 San
              Francisco Bay Area 之间变化，但重心显然在湾区。务实的商业模式结论是，Modular 已经不只是语言赌注；它在卖一套全栈基础设施层，既有免费开发者入口，也有付费消费端点和企业部署，服务那些希望在
              NVIDIA、AMD、CPU 和云环境之间保持可移植性的客户。
