              Modular 的公开商业栈在包装层面异常清晰，尽管已实现经济性仍不透明。公司保留免费的自托管社区版，明显是开发者获客漏斗，而不是直接收入来源。付费变现随后分成三个主要界面：按 token
              计价的共享端点、Modular 自有云内按分钟计价的专用端点，以及让推理留在客户环境内、按分钟计价的 BYOC 部署。公司还叠加自定义模型工作、自定义 kernel 和 forward-deployed
              engineers，因此付费产品不只是「租 GPU」，而是软件加服务模型。真正有用的是，Modular 公开了共享端点的实际 token 标价，也公开了专用和 BYOC
              的计费基础。定价界面没揭示的同样重要：公开页面仍不展示分钟费率卡、典型企业折扣、渠道费用或已实现毛利率。因此读者应把定价页视为标价机制，而不是底层收入质量的证据。
