  - id: FI002
    title: 单位经济模型桥
    type: flow
    layout: standard
    summary: 虽然公司不披露最终指标，这条定性流程展示了大概率决定 Modular 毛利结果的主要输入。
    data:
      nodes:
        - id: U1
          label: 客户工作负载
          detail: 流量形态、延迟要求和模型组合决定经济起点。
        - id: U2
          label: 硬件 + 云选择
          detail: NVIDIA 还是 AMD、Modular 云还是客户云、是否使用承诺云额度，都会影响成本基底。
        - id: U3
          label: 编译器 + 内核优化
          detail: MAX 和 Mojo 旨在提升吞吐、利用率和冷启动表现。
        - id: U4
          label: 支持强度
          detail: 前置部署工程师和高端服务能抬高价值，也会增加交付成本。
        - id: U5
          label: 计费触点
          detail: 按 token、按分钟，或合作伙伴渠道经济模型，决定实际 ASP 结构。
        - id: U6
          label: 毛利结果
          detail: 这是缺失的公开指标：来源描述了驱动因素，没有给出实际利润率结果。
      edges:
        - from: U1
          to: U2
          label: 工作负载选择部署方式和硬件
