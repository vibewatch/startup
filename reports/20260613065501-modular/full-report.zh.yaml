      - number: '3.2'
        title: 能力比较、包装，以及 Modular 真正不同在哪里
        blocks:
          - type: paragraph
            body: >-
              从产品实质看，Modular 的论点在可移植性和 kernel 控制重要时最清晰。MAX 被定位为一套可编程栈，覆盖 NVIDIA、AMD 以及现在的 Apple 开发目标上的
              serving、模型适配和底层优化。这和 TensorRT-LLM 明显不同，后者明确为 NVIDIA-centric 部署优化；也不同于 Together
              AI，后者卖的是托管云，而不是可移植运行时。放到熟悉的清单上，它与 vLLM 和 SGLang 的差异没那么大。OpenAI-compatible API、batching、cache 优化和广泛模型
              serving 已经是品类标配，而不是 MAX 独有功能。公开第三方证据也收窄了领先主张：Spheron 报告称，在一个 2026 H100 设置里，MAX 能在 dense-model 吞吐上击败 vLLM 和
              SGLang；但同一篇评测也说，vLLM 仍是通用生产默认选项，MAX 在 MoE 成熟度、multi-LoRA 和生态集成上仍落后。


              包装是另一个真实差距。Together 公开 token 价格、专用端点方案和按小时 GPU 价格。Ray 和 Anyscale 公开了清晰的 BYOC 或 multi-cloud 控制叙事。Modular
              的公开界面仍把大买家推向 demo 和企业沟通。这不代表产品弱，但说明面向市场的包装比几个替代方案更不标准、更不透明。对企业买家而言，包装清晰本身就是功能，因为它降低评估摩擦。
