      - number: '5.4'
        title: 信任、治理和仍未解决的产品风险
        blocks:
          - type: paragraph
            body: >-
              Modular 确实有可见的信任控制，但公开资料包在政策上强于 attestations。隐私政策描述技术和组织保障，并映射到 GDPR 和 CPRA 风格权利。Report-issue 页面把隐私、安全和
              security 关切导向专门 security team。Acceptable Use Policy 明确覆盖 MAX Platform、Modular Cloud 和 AI-powered
              features，并要求法律、医疗和金融建议用例有人类 review。这些都是有意义的控制。BYOC 模型也一样，它把推理流量留在客户 VPC
              内。对于主要想确认公司已经考虑隐私、误用和事件入口的买家，基础项是存在的。


              但尽调缺口仍然重大。本次审阅的公开材料没有浮现 SOC 2 报告、ISO 27001 证书、公开 uptime 承诺或详细安全架构白皮书。法律结构也引入治理摩擦。Modular 已经开源 MAX 和 Mojo
              的大部分内容，但 Community License 仍受合同约束，允许使用 telemetry，限制逆向工程和 standalone
              redistribution，并要求自定义硬件在受支持目标之外使用时获得批准。独立评论把更大的风险说清楚：Mojo 标准库可能开源，但 MAX
              编译器仍闭源，对一些企业仍是合规和可审计性担忧。产品结论：Modular 看起来技术上有差异化，且方向上具备企业意识；但风险敏感买家仍应把认证、SLA 证据、编译器治理，以及 preview-to-GA
              过渡视为开放尽调项，而不是已解决问题。
