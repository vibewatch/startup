      - number: '1.3'
        title: 融资历史、投资人图谱和商业模型
        blocks:
          - type: paragraph
            body: >-
              公开资本历史是 Modular 故事里记录最完整的部分之一。Sacra 报道 2022 年 6 月有 $30 million 种子轮；TechCrunch 和 The SaaS News 均指向 2023 年 8
              月由 General Catalyst 领投的 $100 million 融资，使累计融资达到 $130 million。关键跃迁发生在 2025 年 9 月，Modular 和独立媒体称公司完成由 Thomas
              Tull 的 US Innovative Technology fund 领投的 $250 million Series C，引入 DFJ Growth，并保留 GV、General Catalyst 和
              Greylock 等老股东参与。该轮把累计融资推至 $380 million，估值达到 $1.6 billion，接近上一轮隐含估值的三倍。商业上，公司似乎同时在三层变现：MAX 和 Mojo 的免费开发者 /
              社区入口，按消费计价的托管端点，以及把软件、工作负载调优和云收入分成打包的企业或伙伴交易。仍未公开的是收入规模、不同部署模式的单位经济性，以及客户基础在云、硬件伙伴和具名企业账户之间的集中度。
