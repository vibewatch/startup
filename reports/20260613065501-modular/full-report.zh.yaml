  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图、直接同行和替代品类别
        blocks:
          - type: paragraph
            body: >-
              Modular 不是在和一个单体「推理市场」竞争。它的真实战场分成几类。最直接的运行时同行是 vLLM、SGLang、TensorRT-LLM，以及现在没那么强势的 Hugging Face
              TGI。这些产品都试图解决同一个即时任务：以较好吞吐、batching 和 API 兼容性 serving 开放权重模型。外围还有 Ray Serve 和 Anyscale
              等编排和部署层，买家往往同样在意组合、autoscaling 和 VPC 控制，而不只是 kernel 速度。Together AI 又处在另一类：它卖托管便利、公开定价和 GPU
              访问，不要求客户运营运行时。内部自建替代品也重要。ONNX Runtime、llm-d，以及自托管 vLLM 加 Ray 栈，让成熟团队能把架构留在内部。


              这种分类影响判断。Modular 的公开材料没有显示一个赢家通吃的引擎市场。它展示的是分层决策树：不同买家可以用开源引擎、托管云、编排平台或自定义栈，解决同一个底层 serving 问题。这让竞争集合比「vLLM
              对 MAX」更宽，也抬高了护城河耐久性的门槛，因为 Modular 不仅要打败直接同行，还要打败可接受替代品和既有部署习惯。
