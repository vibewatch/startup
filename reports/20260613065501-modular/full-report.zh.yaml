      - number: '2.4'
        title: 增长驱动、采用约束和仍缺什么
        blocks:
          - type: paragraph
            body: >-
              三个结构性驱动支撑 Modular 所在类别。第一，随着企业把 AI 运营化、云原生团队标准化 Kubernetes、开源 serving
              栈把更多工作负载推入生产，推理背景足够大且在增长。第二，可移植工具真实存在：ONNX Runtime、MLIR 和 llm-d 都反映出行业需要能跨多个加速器、部署目标和编排模式的抽象。第三，Modular
              自身信息与买家围绕延迟、成本可预测性和合规的痛点一致。约束同样重要。CUDA 的装机基础和生产硬化意味着，许多买家在接受迁移风险之前，会先容忍厂商集中。分析师报告也强调高
              capex、集成复杂度、隐私要求和人才短缺。即便 Kubernetes-native 推理，运营成熟度也仍早，每日生产部署比例远低于广泛采用。承销缺口因此不是问题是否存在，而是 Modular
              实际能拿下多少市场。公开资料仍不披露客户数、细分组合、共享端点与 BYOC 的量级，独立 benchmark 证据也不足以把公司自报的性能提升转化为干净的 bottom-up SOM。
