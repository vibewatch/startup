  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-arr
    missingEvidence: Current revenue, ARR, and active-paying-customer counts by product surface.
    whyItMatters: Without revenue scale and mix, the chapter can describe monetization design but cannot underwrite current commercial traction or enterprise contract quality.
    diligencePath: Request board deck or finance snapshot showing trailing twelve-month revenue, ARR, paying accounts, and product-level mix for shared, dedicated, BYOC, and services.
    relatedQuestionRefs:
    - QI014
    - QI021
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-runway
    missingEvidence: Cash on hand, net burn, gross burn, and management runway assumptions after the 2025 financing.
    whyItMatters: Runway and next-round timing are central to the financial verdict, especially if the company broadens from inference into training or takes on more infrastructure exposure.
    diligencePath: Request monthly cash bridge, 12-month operating plan, hiring plan, and downside/upside runway scenarios from the finance team.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-by-surface
    missingEvidence: Gross margin and contribution margin by shared endpoints, dedicated endpoints, BYOC, professional services, and marketplace channel.
    whyItMatters: List pricing and customer ROI anecdotes do not reveal whether the best-looking surfaces are actually profitable after GPU, support, and engineering costs.
    diligencePath: Request margin waterfall by product surface, including GPU cost, cloud pass-through, support load, and forward-deployed-engineer allocation.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-contracts
    missingEvidence: Top-customer concentration, average contract value, duration, renewal rates, and committed-use terms.
    whyItMatters: A few large cloud or hardware-linked accounts could make early growth look stronger than the underlying customer base actually is.
    diligencePath: Request cohort analysis, top-10 customer concentration, renewal schedule, and direct-versus-channel revenue split.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: channel-take-rates
    missingEvidence: Marketplace fees, cloud-provider revenue-sharing percentages, and the share of bookings sourced through AWS or other partners.
    whyItMatters: Partner procurement can accelerate growth but also compress net revenue realization if channel economics are unfavorable.
    diligencePath: Request channel P&L with marketplace fees, rev-share terms, and attachment rates for partner-sourced bookings.
    relatedQuestionRefs:
    - QI011
    - QI021
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: utilization-and-support-intensity
    missingEvidence: GPU utilization, token throughput per reserved GPU, support hours per account, and forward-deployed-engineer staffing ratios.
    whyItMatters: The case for a strong long-run margin profile depends on operational leverage in both compute utilization and service delivery.
    diligencePath: Request internal capacity and support dashboards split by deployment mode and customer segment.
    relatedQuestionRefs:
    - QI019
    - QI020
    relatedTableRefs:
    - TI003
