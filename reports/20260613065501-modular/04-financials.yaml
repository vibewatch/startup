company:
  name: Modular
chapter:
  number: 4
  title: Financials
  summary: Modular has a legible monetization design—free self-hosted entry, token-priced shared endpoints, minute-priced dedicated and BYOC deployments, and partner-channel procurement—but public evidence stops at list pricing, channel descriptions, and a small number of company-curated ROI anecdotes. The company’s $380 million funding base and roughly 130-person scale look meaningful for a software-led inference vendor, yet expansion toward training and the migration friction created by NVIDIA’s ecosystem mean capital needs could rise faster than public disclosures allow investors to underwrite. The chapter verdict is constructive on revenue design and buyer fit, but cautious on revenue quality, margin path, and runway because those metrics remain private.
sections:
- id: monetization-surfaces-and-list-pricing
  title: Monetization surfaces and what public pricing actually shows
  body: 'Modular’s public commercial stack is unusually legible at the packaging level, even if it remains opaque at the realized-economics level. The company keeps a free self-hosted community edition, which clearly functions as a developer-acquisition funnel rather than a direct revenue source. Paid monetization then splits into three main surfaces: token-priced shared endpoints, minute-priced dedicated endpoints in Modular’s own cloud, and minute-priced BYOC deployments that keep inference inside the customer’s environment. The company also layers in custom-model work, custom kernels, and forward-deployed engineers, which means the paid offer is not just “rent a GPU” but a software-plus-services model. What is genuinely useful here is that Modular publishes actual token list prices for shared endpoints and publishes the billing basis for dedicated and BYOC. What the pricing surface does not reveal is just as important: public pages still do not show the minute-rate card, typical enterprise
    discounts, channel fees, or realized margins, so the reader should treat the pricing pages as list mechanics rather than proof of underlying revenue quality.'
