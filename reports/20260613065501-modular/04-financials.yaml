callouts:
- calloutType: insight
  title: Public monetization design is clear; public realized economics are not
  body: This chapter can confidently describe how Modular sells—free funnel, token pricing, minute pricing, BYOC, and AWS channel procurement—but it cannot public-market underwrite how much revenue those surfaces produce or at what margin.
  claimRefs:
  - CI007
  - CI011
  - CI017
  - CI031
  - CI032
- calloutType: risk
  title: Training expansion is the main path by which capital needs could step up
  body: The current public story still reads more software-led than asset-led, especially with BYOC and marketplace channels. But once the roadmap moves deeper into training, the financing burden could rise before investors have clear public proof on revenue quality or burn discipline.
  claimRefs:
  - CI028
  - CI030
  - CI038
  - CI043
  - CI044
- calloutType: recommendation
  title: Require private financial data before treating the revenue model as underwritten
  body: The evidence is strong enough to say Modular has a coherent monetization architecture and some real customer proof. It is not strong enough to support a conviction view on ARR, gross margin, runway, or next-round timing without management data.
  claimRefs:
  - CI022
  - CI031
  - CI035
  - CI042
  - CI044
