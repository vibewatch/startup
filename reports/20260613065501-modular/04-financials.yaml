- id: unit-economics-cost-structure-and-evidence-limits
  title: Unit economics, cost structure, and the limits of public evidence
  body: 'Public evidence is good enough to outline the shape of the unit-economics model, but not good enough to calculate it. On the favorable side, Modular keeps repeating the same economic story: hardware portability across NVIDIA and AMD lets customers chase better price-performance, BYOC lets them apply their own cloud credits and commitments, and MAX’s compiler-plus-kernel stack is supposed to lift throughput while lowering latency and cold-start overhead. The Inworld quote provides a concrete if company-curated proof point, claiming roughly 70% faster time-to-first-audio and an eventual price that could be about 60% lower than with a vanilla vLLM approach. That said, none of this reveals Modular’s own realized margin. Forward-deployed engineers, custom kernels, support, and optimization all add service cost, and minute-priced dedicated or BYOC contracts may only become attractive if utilization stays high and support intensity stays bounded. The central diligence takeaway is that
    list prices and customer anecdotes show where value might exist, not whether the company is already capturing that value with healthy gross margins, efficient sales payback, or durable retention.'
