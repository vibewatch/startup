- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Visible driver(s)
  - Diligence ask
  rows:
  - - Revenue / ARR
    - Not publicly disclosed
    - low
    - Determines whether traction proxies convert into real commercial scale
    - Only indirect proxies from downloads, tokens, and named logos
    - Request latest monthly revenue, ARR, and product mix
  - - Gross margin by surface
    - Not publicly disclosed
    - low
    - Core test of whether portability and services create attractive software economics
    - GPU cost, utilization, batching, support, and cloud pass-through
    - Request gross margin by shared, dedicated, BYOC, services, and channel
  - - Realized discount rate
    - Not publicly disclosed
    - low
    - List prices can overstate monetization if enterprise discounts are heavy
    - Committed-use pricing and volume discounts are mentioned but not quantified
    - Request average discount by segment and deployment mode
  - - Support / engineering intensity
    - Clearly material, not quantified
    - medium
    - Forward-deployed engineers can improve ACV but also compress contribution margin
    - Embedded engineers, custom kernels, premium support, professional services
    - Request support hours and engineer allocation per account
  - - Customer ROI proof
    - Selective positive anecdotes only
    - medium
    - Useful for selling power, but not a substitute for Modular margin data
    - Inworld quote, AWS cost/performance framing, portability narrative
    - Request independent before/after customer margin and utilization studies
  - - GPU / cloud cost leverage
    - Directionally positive, not quantified for Modular itself
    - medium
    - Portability is the core economic wedge behind the thesis
    - NVIDIA/AMD switching, cloud credits, runtime efficiency, batching
    - Request utilization and cost-per-token by hardware class
  - - CAC / payback
    - Not publicly disclosed
    - low
    - Needed to judge whether GTM expansion is efficient
    - Only indirect signal is headcount growth and GTM hiring
    - Request sales efficiency dashboard and payback by segment
  - - NRR / churn
    - Not publicly disclosed
    - low
    - Recurrence quality matters more than one-off pilots in infra software
    - No public cohort or renewal data
    - Request cohort retention and gross/logo churn by product surface
  - - Customer concentration
    - Not publicly disclosed
    - low
    - A few large partners or clouds could skew early revenue quality
    - Named customers are public but revenue concentration is not
    - Request top-10 customer revenue share and partner dependence
  notes: Nulls are deliberate where the public pack does not support a credible metric. The table distinguishes visible economic drivers from actual measured unit economics.
