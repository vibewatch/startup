- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: standard
  summary: Matrix showing where balance-sheet burden sits today and where it could rise if Modular changes strategic posture.
  data:
    columns:
    - Current balance-sheet burden
    - What public evidence says
    - Main financial risk
    rows:
    - label: Shared endpoints in Modular cloud
      values:
      - Moderate
      - Modular owns the managed experience and therefore likely carries more direct compute exposure than BYOC, but public costs are undisclosed.
      - Utilization shortfalls or aggressive discounting could compress margin.
    - label: Dedicated endpoints in Modular cloud
      values:
      - Moderate-High
      - Reserved warm capacity improves buyer reliability but likely increases committed compute burden for Modular-managed deployments.
      - Idle reserved capacity and support intensity can drag contribution margin.
    - label: BYOC deployments
      values:
      - Lower
      - Customer cloud credits and infrastructure stay in the customer account while Modular provides software, control plane, and engineering.
      - Take-rate may be lower than a full managed offer and support burden may still be high.
    - label: AWS Marketplace / partner channel
      values:
      - Lower
      - Partner procurement shifts some customer acquisition friction to the cloud channel.
      - Marketplace fees and rev-share can dilute net realization per booking.
    - label: Training expansion
      values:
      - Potentially rising
      - Reuters and Modular both point to expansion from inference toward training.
      - Training can demand more compute, longer cycles, and more capital before payback.
    - label: Heavier infra ownership (comparable warning)
      values:
      - High in comparable cases
      - CoreWeave shows that owning more infrastructure can pair strong growth with debt, capex, and concentration risk.
      - A strategy shift toward asset ownership would likely increase financing dependency materially.
