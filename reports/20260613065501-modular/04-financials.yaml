  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Billing unit
  - Public proof
  - Revenue-quality read
  - Diligence ask
  rows:
  - - Community / self-hosted
    - Free distribution of MAX + Mojo under community license
    - Free
    - Pricing page and MAX page show no usage fee
    - Strong funnel evidence, no direct revenue evidence
    - Need free-to-paid conversion, activation, and enterprise handoff rates
  - - Shared endpoints
    - Hosted open-model API in Modular cloud
    - $/1M tokens
    - Pricing page publishes model-level list prices and scale-to-zero terms
    - Best public price transparency, but realized discounts and gross margin unknown
    - Need blended realized ASP, utilization, and gross margin by model family
  - - Dedicated endpoints
    - Reserved warm capacity in Modular cloud with engineer support
    - $/minute
    - Dedicated-endpoint page states per-minute billing and reserved capacity
    - Better fit for predictable enterprise spend, but no published rate card
    - Need actual minute rates, minimum commits, and average reserved capacity per account
  - - BYOC / Your Cloud
    - Control plane and engineers layered on customer-owned infrastructure
    - $/minute deployed
    - BYOC page says customer cloud credits and commitments still apply
    - Likely software-like recognition, but net take-rate is opaque
    - Need recognized revenue versus pass-through cloud spend by BYOC account
  - - Custom models / custom kernels
    - Performance engineering, proprietary-model deployment, and custom kernel work
    - Contract / project + recurring platform usage
    - Custom Models and MAX pages describe premium technical services
    - Potentially high ACV and sticky, but recurring versus project mix is unknown
    - Need services-versus-platform split and attach rate to recurring deployments
  - - Partner / marketplace channel
    - Procurement and deployment through AWS Marketplace and cloud-provider relationships
    - Marketplace purchase + rev-share / support
    - AWS Marketplace announcement and Reuters both describe channel motion
    - Could accelerate bookings, but channel fees may dilute net realization
    - Need marketplace fee stack, rev-share percentages, and direct-versus-channel bookings mix
  notes: Rows separate public packaging from implied economics. Billing mechanics are visible; realized contract rates, channel fees, and revenue recognition details remain private.
