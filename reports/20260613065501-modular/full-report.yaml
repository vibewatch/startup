companyProfile:
  summary: >-
    Modular is a Bay Area private AI infrastructure company founded in 2022 by Chris Lattner and Tim Davis. It has
    expanded from the early Mojo-language narrative into a broader stack spanning MAX inference, Mammoth orchestration,
    and managed or BYOC deployment surfaces for hardware-portable AI serving. The strongest public proof points are the
    2025 $250 million Series C at a $1.6 billion valuation, visible cross-hardware positioning, and named production
    references such as Inworld and Hippocratic AI, while the central underwriting debate is whether the business scales
    as a durable software platform or a more services-heavy optimization vendor.
