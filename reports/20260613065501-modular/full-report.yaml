      - number: '1.3'
        title: Funding history, investor map, and commercial model
        blocks:
          - type: paragraph
            body: >-
              Public capital history is one of the best-documented parts of the Modular story. Sacra reports a $30
              million seed in June 2022, while TechCrunch and The SaaS News align on a $100 million August 2023 round
              led by General Catalyst that brought total capital to $130 million. The step-change came in September
              2025, when Modular and independent media said the company raised $250 million in Series C financing led by
              Thomas Tull’s US Innovative Technology fund, added DFJ Growth, and kept existing participation from GV,
              General Catalyst, and Greylock. That round lifted total capital raised to $380 million and valued the
              company at $1.6 billion, nearly triple the prior round’s implied level. Commercially, the company appears
              to be monetizing in three layers at once: a free developer/community entry point for MAX and Mojo,
              consumption-priced managed endpoints, and enterprise or partner deals that combine software with workload
              tuning and cloud revenue-sharing. What is still not public is revenue scale, unit economics by deployment
              mode, or how concentrated the customer base is across clouds, hardware partners, and named enterprise
              accounts.
