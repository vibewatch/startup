  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Modular should not be analyzed as if it participates in all AI software or all GPU infrastructure spend.
              Its own product surfaces define a narrower market around production inference infrastructure: hosted
              shared endpoints, dedicated managed endpoints, bring-your-own-cloud deployments, custom model serving, and
              the compiler/runtime layer that promises portability across NVIDIA, AMD, CPUs, and Apple Silicon. The
              included spend is therefore the budget a buyer allocates to serving models in production with acceptable
              latency, reliability, and compliance, plus the engineering layer needed to tune kernels, batching, and
              routing. Excluded spend includes foundational model creation, generic SaaS copilots, undifferentiated
              cloud IaaS, and most one-off experimentation that never reaches production serving. The substitute set is
              broad: proprietary model APIs, single-vendor GPU clouds, wrapper-based stacks such as vLLM or TensorRT
              integrations, self-managed Kubernetes inference, and portable runtimes like ONNX Runtime. That framing
              matters because it makes Modular less a bet on one model family and more a bet that portability,
              deployment flexibility, and inference economics become purchase criteria for serious AI operators.
