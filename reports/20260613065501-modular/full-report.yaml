      - number: '4.4'
        title: Capital adequacy, funding dependency, and the financial verdict
        blocks:
          - type: paragraph
            body: >-
              Modular’s capital base is real, but public evidence still does not support a precise runway call. The
              company has raised about $380 million across seed, Series B, and Series C financing, and the latest round
              valued it at roughly $1.6 billion. Public reporting also says the 2025 round will fund engineering and
              go-to-market expansion while pushing the company from inference into training. That matters because a
              software-led inference platform can stay relatively asset-light when it relies on BYOC, partner clouds,
              and marketplace channels, but a deeper move into training or any heavier ownership of infrastructure would
              likely raise capital intensity materially. The cleanest comparable warning comes from CoreWeave’s S-1/A,
              which shows how explosive revenue growth in AI infrastructure can coexist with large net losses, major
              debt, substantial capital expenditure needs, and customer concentration. The adverse competitive context
              points the same way: NVIDIA’s CUDA lock-in, MGX ecosystem, and integrated platform bundling raise
              migration friction and can limit how fast an alternative stack converts interest into profitable recurring
              spend. The verdict, then, is that Modular appears financially promising as a software-and-services
              platform, but still evidence-limited as an underwritten business because revenue quality, margin
              structure, and runway remain private.
