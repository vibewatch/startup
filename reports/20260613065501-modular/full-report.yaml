chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and what the company actually sells
        blocks:
          - type: paragraph
            body: >-
              Modular describes itself as a company building a unified AI compute layer rather than a point tool for one
              chip vendor or one model family. Across the About page, pricing surface, and 2025 financing post, the
              company consistently frames the core offer as hardware-portable inference infrastructure built around MAX,
              Mojo, and now Mammoth, with deployment options in Modular-hosted cloud, customer VPCs, or self-managed
              environments. The founding story is also consistent: Chris Lattner and Tim Davis met at Google, concluded
              that fragmented AI infrastructure was slowing adoption, and founded Modular in 2022 to abstract that
              complexity away. Public location language varies between Silicon Valley, Palo Alto, Los Altos, and the
              broader San Francisco Bay Area, but the center of gravity is clearly Bay Area-based. The practical
              business-model takeaway is that Modular is no longer only a language bet; it is selling a full-stack
              infrastructure layer with free developer entry points, paid consumption endpoints, and enterprise
              deployments for customers that want portability across NVIDIA, AMD, CPU, and cloud environments.
