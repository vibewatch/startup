  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform map and the customer-facing workflow
        blocks:
          - type: paragraph
            body: >-
              Modular’s customer-facing product is no longer just “a programming language” or “an inference engine.” The
              public surface now resolves into four linked layers. First, MAX is the serving and model-execution
              framework: it exposes an OpenAI-compatible endpoint, runs self-hosted through the CLI or Docker, and gives
              developers a PyTorch-like path for custom models and custom ops. Second, Mammoth is the scale-out
              orchestration layer: a Kubernetes-native control plane for organizations that need to place multiple
              models across heterogeneous GPU fleets and automatically balance performance against cost. Third, Mojo is
              the kernel-focused language underneath the stack. Modular presents it as the way developers extend MAX,
              write hardware-agnostic GPU kernels, and preserve portability across NVIDIA, AMD, Apple, and CPUs. Fourth,
              Modular wraps the software in several deployment surfaces—self-hosted endpoints, managed serverless or
              dedicated endpoints, and a bring-your-own-cloud option that keeps inference traffic in a customer VPC.


              In customer workflow terms, the architecture is straightforward even if the implementation is ambitious. A
              team starts by selecting a supported model or porting an adjacent Hugging Face architecture into MAX,
              serves it behind the OpenAI-compatible API, and then chooses whether to keep the endpoint local, move into
              Modular’s managed cloud, or adopt a VPC-resident deployment. If the workload becomes large, multi-model,
              or heterogeneous, Mammoth is the next layer that coordinates model placement and distributed inference.
              That sequencing matters because it makes the product legible: MAX is the execution layer, Mammoth is the
              fleet-management layer, and Mojo is the extensibility layer. The best evidence supports a real module map
              rather than a marketing umbrella, although the line between community/open entry points and
              contract-governed commercial use still needs diligence.
