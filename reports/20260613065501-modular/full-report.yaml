      - number: '1.4'
        title: Milestones, traction claims, and the main underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone arc shows a company maturing from a developer-language launch into a broader infrastructure
              platform. Mojo launched publicly on May 2, 2023; by the time Modular announced local downloads it said
              more than 120,000 developers had signed up and 19,000-plus were active on Discord and GitHub. By September
              2025, the company claimed 10-thousands of platform downloads per month, 24,000-plus GitHub stars,
              trillions of tokens served daily, more than 100 countries represented in its ecosystem, and 600,000-plus
              lines of open-source code. The roadmap also moved forward: the core standard library was released under
              Apache 2 with LLVM exceptions, the public Mojo site listed stable version 1.0.0b1 on May 7 with a June 11
              nightly, and the 26.3 release said final 1.0 was expected later in 2026. Product scope has widened as
              well, with Mammoth introduced for enterprise-scale serving and partner announcements around AWS and AMD
              reinforcing the hardware-agnostic thesis. The biggest open questions are not technical branding but
              commercial evidence: public materials still do not disclose revenue, exact customer count, full board
              composition, or a fully settled long-run boundary between open-source Mojo components and the proprietary
              or contract-governed commercial stack. The GitHub licensing concern thread is not a thesis-breaker, but it
              is a real signal that developer trust remains part of the underwriting burden.
