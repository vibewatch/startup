  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Modular’s public stack runs from managed or VPC-resident deployment surfaces down through MAX serving and model
      graphs to Mojo kernels and heterogeneous hardware targets.
    approximationNotes: >-
      This stack is synthesized from product pages, docs, and release notes rather than copied from a single vendor
      system diagram.
    data:
      layers:
        - id: deploy
          label: Deployment surfaces
          detail: >-
            Self-hosted endpoints, Modular-managed serverless and dedicated endpoints, and bring-your-own-cloud VPC
            deployment.
        - id: orchestration
          label: Orchestration and control plane
          detail: >-
            Endpoint lifecycle, scaling, monitoring, and Mammoth’s multi-model placement and disaggregated inference
            controls.
        - id: serve
          label: MAX serving and model layer
          detail: >-
            OpenAI-compatible APIs, model graphs, batching, KV-cache management, multi-GPU execution, custom
            architectures.
        - id: kernels
          label: Mojo kernel and compiler layer
          detail: >-
            Portable GPU and CPU kernels, custom ops, graph compilation, and structured-kernel specialization across
            hardware.
        - id: hardware
          label: Heterogeneous hardware targets
          detail: NVIDIA, AMD, Apple Silicon, CPUs, and cloud or on-prem GPU fleets.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE012
      - CE013
      - CE025
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      A typical Modular workflow starts with choosing or adapting a model, serving it behind the MAX API, then scaling
      into managed cloud, BYOC, or Mammoth depending on workload complexity.
    approximationNotes: The flow emphasizes customer action points rather than every internal scheduler step.
    data:
      nodes:
        - id: choose-model
          label: Choose a supported model or checkpoint
          detail: Start with a supported Hugging Face architecture or a close reference model.
          tone: neutral
        - id: adapt-model
          label: Adapt config and weights when needed
          detail: Use MAX architecture packages, config mapping, and weight adapters for custom bring-up.
          tone: positive
        - id: serve-endpoint
          label: Launch MAX endpoint
          detail: Expose a CLI or Docker-hosted OpenAI-compatible endpoint for self-hosted validation.
          tone: positive
        - id: optimize-runtime
          label: Enable runtime optimizations
          detail: Add prefix caching, speculative decoding, or structured output depending on workload shape and constraints.
          tone: positive
        - id: choose-deployment
          label: Choose deployment model
          detail: >-
            Stay self-hosted, move to managed serverless or dedicated endpoints, or place the data plane in a customer
            VPC.
          tone: neutral
        - id: scale-fleet
          label: Scale into Mammoth or enterprise ops
          detail: >-
            Use multi-model orchestration, disaggregated inference, and forward-deployed tuning support when fleets
            become heterogeneous or large.
          tone: warning
      edges:
        - from: choose-model
          to: adapt-model
          label: if architecture differs
        - from: adapt-model
          to: serve-endpoint
          label: compile and register
        - from: serve-endpoint
          to: optimize-runtime
          label: tune serving path
        - from: optimize-runtime
          to: choose-deployment
          label: decide where to run
        - from: choose-deployment
          to: scale-fleet
          label: scale workloads
    claimRefs:
      - CE002
      - CE003
      - CE014
      - CE017
      - CE020
      - CE022
      - CE024
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Modular’s execution stack depends on external model ecosystems, Modular-operated control services, and hardware
      vendors even though it tries to reduce dependence on any one accelerator stack.
    approximationNotes: The map focuses on operational dependency rather than ownership or exclusive contracts.
    data:
      nodes:
        - id: modular-core
          label: Modular execution stack
          type: system
          detail: MAX serving, graph compiler, Mojo kernels, and cloud deployment surfaces.
        - id: hf-models
          label: Hugging Face model ecosystem
          type: dependency
          detail: Configs, checkpoints, and model-family conventions that MAX maps into its own graph format.
        - id: control-plane
          label: Modular control plane / Mammoth
          type: dependency
          detail: Endpoint lifecycle, scaling, monitoring, and multi-model orchestration.
        - id: hardware
          label: NVIDIA / AMD / Apple hardware targets
          type: dependency
          detail: Underlying accelerator capabilities that MAX and Mojo specialize toward.
        - id: customer-vpc
          label: Customer cloud / VPC
          type: dependency
          detail: BYOC data plane, cloud commitments, and regulated deployment boundary.
        - id: legal-governance
          label: License, privacy, and AUP governance
          type: dependency
          detail: Community license, telemetry terms, privacy policy, and acceptable-use rules governing SDK and platform use.
        - id: dev-community
          label: Developer ecosystem
          type: dependency
          detail: GitHub, PyPI, Meetup, Discord, YouTube, and broader community support for adoption and debugging.
      edges:
        - from: modular-core
          to: hf-models
          label: model intake dependency
        - from: modular-core
          to: control-plane
          label: managed-scale dependency
        - from: modular-core
          to: hardware
          label: performance and portability dependency
        - from: control-plane
          to: customer-vpc
          label: BYOC operational boundary
        - from: modular-core
          to: legal-governance
          label: contractual and policy boundary
        - from: modular-core
          to: dev-community
          label: adoption and support flywheel
    claimRefs:
      - CE014
      - CE025
      - CE026
      - CE038
      - CE043
      - CE046
      - CE048
      - CE049
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public proof is strongest for MAX serving, portability claims, and developer tooling; weaker for security
      attestation, mainstream ecosystem depth, and Mammoth field maturity.
    approximationNotes: The matrix reflects only what was supported in the reviewed public source pack.
    data:
      columns:
