      - number: '2.4'
        title: Growth drivers, adoption constraints, and what is still missing
        blocks:
          - type: paragraph
            body: >-
              Three structural drivers support the category around Modular. First, the inference backdrop is large and
              growing as enterprises operationalize AI, cloud-native teams standardize on Kubernetes, and open-source
              serving stacks push more workloads into production. Second, portability tooling is real: ONNX Runtime,
              MLIR, and llm-d all reflect industry demand for abstractions that span multiple accelerators, deployment
              targets, and orchestration patterns. Third, Modular’s own messaging lines up with buyer pain around
              latency, cost predictability, and compliance. The constraints are equally important. CUDA’s installed base
              and production hardening mean many buyers will tolerate vendor concentration before they accept migration
              risk. Analyst reports also stress high capex, integration complexity, privacy requirements, and talent
              shortages. Even Kubernetes-native inference remains early in operational maturity, with daily production
              deployment still far below broad adoption. The underwriting gap is therefore not whether the problem
              exists, but how much of that market Modular can actually capture. Public sources still do not disclose
              customer count, segment mix, shared-endpoint versus BYOC volume, or independent benchmark evidence strong
              enough to turn company-reported performance gains into a clean bottom-up SOM.
