          note: Fresh $250M round and strong category funding backdrop
        - label: Valuation clarity
          value: Low
          note: Current mark cannot be grounded to disclosed economics
        - label: Overall stance
          value: Research-more
          note: Wait for private KPI proof or a more favorable entry point
    claimRefs:
