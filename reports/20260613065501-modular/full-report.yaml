      - number: '3.4'
        title: Moat durability, buyer fit, and the competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The most defensible Modular thesis is not “MAX beats everyone everywhere.” The more credible thesis is
              narrower: certain buyers increasingly want one stack that can bring up new hardware quickly, preserve room
              for custom kernels, and reduce dependence on CUDA-only workflows. For those customers, Modular’s
              integrated MAX plus Mojo plus Mammoth story is differentiated and backed by meaningful product work.
              Public materials show genuine ambition and enough third-party validation to treat the wedge as real. But
              the moat still looks conditional rather than settled. vLLM and SGLang own more of the open-inference
              mindshare. TensorRT-LLM rides the deepest incumbent platform. Together and Anyscale simplify procurement
              for buyers who value convenience or control more than runtime novelty. Internal-build paths remain
              credible.


              The practical result is a segmented market. MAX looks strongest when the workload is dense-model
              inference, the buyer values cross-vendor portability, and the team is willing to adopt a newer stack for
              potential performance or flexibility gains. It looks weaker when the requirement is default-safe OSS
              breadth, fully mature MoE and adapter ecosystems, fully managed cloud convenience, or strict attachment to
              the NVIDIA software and channel stack. That is a meaningful but narrower competitive position than a broad
              infrastructure winner narrative, so moat durability depends on Modular converting its portability wedge
              into repeatable customer adoption before incumbents absorb more of the same story.
