  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Modular solution
      - Measurable benefit
      - Limitation
    rows:
      - - Launch a standard open model quickly
        - Pull a Hugging Face model, stand up an endpoint, wire an OpenAI client
        - max serve or Docker starts an OpenAI-compatible endpoint
        - Minimal code changes and fast self-hosted validation
        - Benefit is implementation speed, not proof of enterprise durability
      - - Port a custom or adjacent architecture
        - Adapt config fields, checkpoint names, and custom layers manually
        - MAX reference architectures plus arch.py, model_config.py, model.py, and weight_adapters.py workflow
        - Reuse of existing compute graph and kernels instead of building a serving stack from scratch
        - Deeply novel architectures may still require new graph components
      - - Improve throughput on repeat-prompt workloads
        - Serve repeated system prompts or long chats with redundant KV-cache work
        - Prefix caching enabled by default through PagedAttention
        - Lower TTFT and better effective throughput when prefixes repeat
        - Little gain for unique prompts or decode-dominated workloads
      - - Raise token-generation efficiency on supported models
        - Run target model step by step and accept full verification cost each token
        - Speculative decoding with EAGLE, EAGLE3, MTP, or standalone draft models
        - Multiple tokens can be accepted per step, improving compute use
        - Structured output and echo are not supported when speculative decoding is enabled
      - - Enforce schema-safe responses in app workflows
        - Parse free-form model text downstream in Python or middleware
        - Structured output with llguidance, JSON schema, or Pydantic
        - Predictable output contracts for downstream systems
        - GPU-only today and requires careful testing because model training still matters
      - - Run large, multi-model production fleets
        - Manually place models across different GPU types and handle scaling by hand
        - Mammoth control plane with model placement, auto-scaling, and disaggregated inference
        - Better hardware utilization and multi-model orchestration across mixed fleets
        - Public evidence is mostly company-authored preview material, not broad field proof yet
    notes: >-
      The rows intentionally follow real buyer jobs rather than product branding so the workflow table stays anchored in
      what a team is trying to do with the stack.
