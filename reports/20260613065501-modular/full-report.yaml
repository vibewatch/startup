  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Hugging Face / model architecture mapping
        - Supplies checkpoints, config metadata, and the source model family MAX adapts
        - Depends on MAX reference architectures and weight adapters staying current
        - Novel or fast-moving architectures can create bring-up lag
      - - MAX graph and model layer
        - Builds typed configs, compute graphs, quantization settings, and multi-GPU execution plans
        - Depends on architecture packages such as arch.py, model.py, and model_config.py
        - Unsupported graph differences can force custom engineering
      - - Serving runtime
        - Exposes OpenAI-compatible endpoints, batching, KV-cache management, and runtime features
        - Depends on graph compilation, cache formats, and endpoint flags
        - Feature combinations have explicit limits such as speculative decoding versus structured output
      - - Mojo kernel layer
        - Implements portable GPU and CPU kernels plus custom-ops extensibility
        - Depends on Mojo language maturity and compiler behavior across targets
        - Closed-compiler governance remains a diligence issue for auditable toolchains
      - - Deployment control plane
        - Handles endpoint lifecycle, scaling, observability, and in Mammoth’s case workload placement
        - Depends on Modular-operated control services even in BYOC mode
        - Customer control is reduced relative to pure self-hosting, especially for regulated buyers
      - - Human support layer
        - Forward-deployed engineers tune workloads and write custom kernels for enterprise deployments
        - Depends on service capacity and Modular’s own engineering bandwidth
        - Economic and operational scalability may be weaker than pure software margins imply
    notes: >-
      This architecture table highlights both software components and the operating model because Modular’s enterprise
      offer includes expert services as part of product delivery.
