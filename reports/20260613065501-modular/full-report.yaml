      - number: '8.3'
        title: Scenario analysis and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The scenario range is wide because the open question is not whether Modular has built something useful; it
              is whether the company is becoming a durable software platform fast enough to justify a premium multiple
              before incumbents and open-source alternatives close the gap. The bull case requires several things to be
              true at once: enterprise conversion broadens beyond a few named customers, benchmark leadership persists
              across new GPU generations, and private diligence shows software-like margins on meaningful revenue. The
              base case accepts that public proof remains partial but assumes the company still compounds inside a
              fast-growing market and keeps enough differentiation to defend the current mark. The bear case is less
              about the product failing outright and more about the valuation compressing because portability becomes
              less unique, customer breadth remains narrow, or the economics look more services-heavy than
              platform-like. Those are the conditions that should drive portfolio monitoring.
