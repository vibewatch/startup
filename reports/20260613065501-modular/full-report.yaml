  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Flow from market opportunity and proof points to the current evidence-sensitive recommendation.
    data:
      nodes:
        - id: n1
          label: Large market tailwind
          detail: Third-party reports still show rapid growth in AI infrastructure and inference spend.
        - id: n2
          label: Real product proof
          detail: Funding, Inworld, Hippocratic, and portability claims show non-trivial demand.
        - id: n3
          label: Developer funnel
          detail: Open source, GitHub activity, and community surfaces create top-of-funnel reach.
        - id: n4
          label: Economics opacity
          detail: Revenue, gross margin, retention, and concentration are still undisclosed publicly.
        - id: n5
          label: Incumbent pressure
          detail: NVIDIA lock-in and crowded inference alternatives constrain conviction.
        - id: n6
          label: 'Stance: research-more'
          detail: Current mark is plausible but not underwritten from public evidence alone.
      edges:
        - from: n1
          to: n6
          label: supports upside optionality
        - from: n2
          to: n6
          label: shows real demand
        - from: n3
          to: n6
          label: supports funnel thesis
        - from: n4
          to: n6
          label: blocks a buy call
        - from: n5
          to: n6
          label: raises execution risk
    claimRefs:
      - CV018
      - CV019
      - CV014
      - CV015
      - CV017
      - CV035
      - CV046
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Revenue thresholds Modular would need to justify a $1.6B valuation under different revenue multiples.
    data:
      items:
        - label: 12x revenue multiple
          value: 133.3
          unit: $M revenue
          note: Premium software-style multiple
        - label: 10x revenue multiple
          value: 160
          unit: $M revenue
          note: High-growth private software benchmark
        - label: 8x revenue multiple
          value: 200
          unit: $M revenue
          note: Still assumes strong growth and healthy margins
        - label: 6x revenue multiple
          value: 266.7
          unit: $M revenue
          note: Lower but still growth-oriented multiple
    approximationNotes: >-
      Values are simple valuation divided by multiple calculations using the latest disclosed $1.6B mark; they are
      threshold checks, not forecasts of Modular's current revenue.
    claimRefs:
      - CV001
      - CV028
      - CV033
      - CV034
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Scenario valuation brackets for the next 24-36 months based on execution, disclosure, and competitive pressure.
    data:
      items:
        - label: Bear case valuation
          low: 0.6
          mid: 0.9
          high: 1.2
          displayValue: $0.6B-$1.2B
          detail: Differentiation narrows before recurring economics are proven.
          tone: warning
        - label: Base case valuation
          low: 1.5
          mid: 2
          high: 2.5
          displayValue: $1.5B-$2.5B
          detail: Growth remains strong, but economics disclosure stays partial.
          tone: neutral
        - label: Bull case valuation
          low: 3
          mid: 4
          high: 5
          displayValue: $3.0B-$5.0B
          detail: Revenue scale, diversification, and software-like margins are privately confirmed.
          tone: positive
    approximationNotes: >-
      These brackets are analyst scenario ranges anchored to the current $1.6B mark, peer rounds, and explicit
      assumptions about disclosure and execution; they are not company guidance.
    claimRefs:
      - CV032
      - CV039
      - CV040
      - CV041
      - CV044
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-style scorecard of the dimensions that matter most for underwriting Modular today.
    data:
      items:
        - label: Market tailwind
          value: High
          note: Large and still fast-growing AI infrastructure and inference markets
        - label: Product proof
          value: Medium-High
          note: Named customer outcomes and portability claims are meaningful but narrow
        - label: Moat durability
          value: Medium
          note: Portability wedge is real, yet incumbents and OSS alternatives remain strong
        - label: Revenue visibility
          value: Low
          note: No public ARR or revenue disclosure in the reviewed pack
        - label: Margin visibility
          value: Low
          note: No public gross-margin disclosure by product surface
        - label: Financing support
