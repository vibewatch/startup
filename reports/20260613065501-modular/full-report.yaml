        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public exit readiness is still thin. There is no public KPI pack that lets outside investors model Modular
              the way they could model a maturing public software company, and there is no public cap table or
              preference stack that would let an investor translate a strong headline valuation into actual
              common-equity outcomes. That is why the final diligence agenda matters more than any elegant valuation
              formula. Before underwriting the current mark, investors need current revenue and ARR, gross margin by
              surface, cohort retention, concentration, realized pricing, and the organizational mix between platform
              engineering and forward-deployed support. They also need financing mechanics: share classes, liquidation
              preferences, and any anti-dilution features that could make a future flat or down round more punitive than
              the headline valuation suggests. Until those items are known, Modular remains a high-interest tracking
              candidate rather than a conviction buy.
