  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: >-
          Customer map: Modular sells to developers first, but monetizes through managed and compliance-sensitive
          production buyers
        blocks:
          - type: paragraph
            body: >-
              Modular does not have one public customer archetype. The free Self Hosted edition and open-source MAX repo
              are clearly designed to attract developers and platform engineers who want to test open-model inference
              without upfront spend. Monetization begins once that developer interest turns into production traffic:
              Shared Endpoints target experimentation and variable-load production on a pay-per-token basis, Dedicated
              Endpoints target latency-sensitive production on reserved warm capacity, and BYOC targets security- or
              compliance-sensitive teams that want inference inside their own cloud or on-prem environment. That means
              the buyer, user, and payer often split. Developers may start the evaluation, but platform, infrastructure,
              security, or finance owners become the real budget holders on Dedicated and BYOC surfaces. The public
              record also shows a second commercial layer: channel and ecosystem counterparties such as AWS and SF
              Compute, which matter because they shape procurement and deployment paths even when they are not the final
              end-customer workload owner.
