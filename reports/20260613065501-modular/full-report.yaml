      - number: '8.2'
        title: Valuation context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The best valuation anchor in the public pack is not a revenue multiple that we can observe directly,
              because Modular does not disclose revenue. The cleaner exercise is reverse engineering what revenue would
              be required to support the latest mark. At $1.6 billion, a 10x revenue multiple implies roughly $160
              million of annual revenue, 8x implies about $200 million, and 6x implies about $267 million. Those are not
              unreasonable thresholds for a category leader, but the reviewed sources do not tell us whether Modular is
              already near any of them. Peer funding context cuts both ways. Together AI, Groq, Lambda, and Cerebras all
              show that investors are still willing to fund scarce AI infrastructure assets at multi-billion-dollar
              marks. But some of those peers either disclose more about scale, have a more obvious capacity business, or
              sit in even scarcer categories. Net: the price is not self-evidently absurd, yet it is still too opaque to
              earn a buy recommendation without private KPI evidence or a better entry point.
