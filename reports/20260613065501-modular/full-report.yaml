      - number: '2.2'
        title: Evidence-constrained sizing instead of one generic TAM
        blocks:
          - type: paragraph
            body: >-
              The public source pack supports market direction but not one clean, canonical Modular TAM. Third-party
              publishers are measuring adjacent boundaries. The Business Research Company sizes the broader AI
              infrastructure market at USD 90.91 billion in 2026, Fortune Business Insights sizes the AI inference
              market at USD 117.80 billion in 2026, and Technavio sizes AI inference hardware at USD 67.80 billion in
              2025 with 20.8% CAGR through 2030. Those figures are useful, but they are not interchangeable because they
              mix hardware-only, infrastructure-layer, and broader inference-software-plus-hardware definitions. CNCF
              and KubeCon coverage add an adoption lens: Kubernetes is already widely used for production and for
              generative-AI inference, which suggests the real budget is shifting from experimental model access toward
              production orchestration and cost control. The most defensible market-sizing lens for Modular is therefore
              layered. Broad inference and AI-infrastructure estimates describe the outer TAM, while the nearer SAM is
              the subset of enterprise and AI-native production serving spend where buyers actually value hardware
              portability, migration from proprietary APIs, BYOC compliance, or cost-sensitive multi-model operations. A
              public SOM is not supportable without internal workload, customer, or revenue segmentation.
