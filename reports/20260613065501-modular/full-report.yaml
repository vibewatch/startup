  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, direct peers, and substitute classes
        blocks:
          - type: paragraph
            body: >-
              Modular is not competing with one monolithic “inference market.” Its actual battlefield splits into
              several classes. The most direct runtime peers are vLLM, SGLang, TensorRT-LLM, and—less forcefully
              now—Hugging Face TGI. Those products all try to solve the same immediate job of serving open-weight models
              with good throughput, batching, and API compatibility. Around them sit orchestration and deployment layers
              such as Ray Serve and Anyscale, which matter because buyers often care as much about composition,
              autoscaling, and VPC control as about kernel speed. Together AI sits in another class again: it sells
              managed convenience, published pricing, and GPU access without asking the customer to operate a runtime.
              Internal-build substitutes also matter. ONNX Runtime, llm-d, and a self-hosted vLLM plus Ray stack give
              sophisticated teams a way to keep the architecture in-house.


              That classification matters for judgment. Modular’s public materials do not show a winner-take-all engine
              market. Instead, they show a layered decision tree where different buyers can solve the same underlying
              serving problem with open-source engines, managed clouds, orchestration platforms, or custom stacks. That
              makes the competitive set broader than “vLLM versus MAX,” and it raises the bar for moat durability
              because Modular must beat not only direct peers but also acceptable substitutes and incumbent deployment
              habits.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
