  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Risk ranking: legal-compliance drift and ecosystem dependency matter more than near-term solvency'
        blocks:
          - type: paragraph
            body: >-
              Modular's risk stack is not dominated by one existential defect; it is dominated by interactions among
              compliance, ecosystem dependency, and execution opacity. The strongest public mitigants are real: the
              company says it is SOC 2 Type 2 certified on paid offerings, it offers BYOC/VPC deployments that keep
              inference inputs and outputs inside the customer's network, it raised $250 million in 2025 at a $1.6
              billion valuation, and it markets portability across NVIDIA, AMD, Apple, and cloud environments. Those
              factors reduce immediate data-residency, financing, and single-vendor risks. But they do not eliminate
              them. The same source pack also shows that Modular's go-to-market still relies heavily on forward-deployed
              engineers, AWS distribution and procurement surfaces, and continued support for the newest accelerator
              roadmaps. Public evidence on revenue, gross margin, customer concentration, incident history, and
              management succession remains thin. That is why the highest residual-severity risks are legal/regulatory
              drift and partner/hardware dependence, followed by operational-delivery and people/execution risks.
              Financial risk is mitigated near term by capital raised, but it is still material because outside
              investors cannot publicly verify whether demand converts into durable software economics.
            claimRefs:
