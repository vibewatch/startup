  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and current stance
        blocks:
          - type: paragraph
            body: >-
              Modular is not hard to like as a product story. The company has a fresh $250 million round, a credible
              portability narrative across NVIDIA and AMD hardware, a visible open-source funnel, and named customer
              proof from Inworld and Hippocratic AI that suggests the stack can drive meaningful latency and cost
              outcomes on real workloads. Independent market reports also support a large and still-growing AI
              infrastructure backdrop. The problem is that this is not the same thing as a clean underwriting case at
              the latest valuation. Public sources still do not disclose revenue, ARR, gross margin, customer
              concentration, or retention, and the commercial model repeatedly emphasizes forward-deployed engineers and
              custom optimization work. That means the thesis is investable only conditionally. On public evidence
              alone, the right stance is research-more: keep following the company closely, but do not pretend the
              existing data can prove whether $1.6 billion is cheap, fair, or expensive.
