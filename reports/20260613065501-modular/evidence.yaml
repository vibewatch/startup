evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, board observer rights, committee structure, and founder or investor control documents.
    whyItMatters: >-
      Leadership and funding are visible, but governance control still materially affects downside protection and
      strategic decision-making.
    diligencePath: Request the latest board deck, charter set, and cap-table or governance summary from management or lead investors.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current ARR, revenue run-rate, gross margin, and customer concentration by deployment mode.
    whyItMatters: >-
      The company can be technically impressive and still fail underwriting if growth quality, unit economics, or
      revenue concentration are weak.
    diligencePath: >-
      Request monthly recurring revenue, booked ARR, gross-margin bridge, and top-customer concentration for the last
      four quarters.
    relatedQuestionRefs:
      - QO022
      - QO023
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      A full current investor list, customer roster, and distinction between design partners, cloud channels, and paying
      production accounts.
    whyItMatters: >-
      Named logos help with story quality, but diligence needs to know who actually drives revenue, control, and
      referenceability.
    diligencePath: Request a current cap table, a top-20 customer list with ARR or spend bands, and partner-program terms.
    relatedQuestionRefs:
      - QO013
      - QO015
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      More precise dates for some office, roadmap, and release milestones that are only year-level or month-level in the
      reviewed public pack.
    whyItMatters: >-
      Chronology is directionally clear, but exact sequencing would matter in a deeper refresh or competitive-timing
      analysis.
    diligencePath: Pull a fuller press archive or internal release calendar if exact event dating becomes material.
    relatedQuestionRefs:
      - QO019
      - QO020
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      Customer-count, deployment-mode mix, gross-margin, and workload-volume data needed to calculate a bottom-up
      Modular SAM or SOM.
    whyItMatters: >-
      Without internal customer and usage data, public TAMs cannot be translated into a defendable captured-market
      estimate.
    diligencePath: >-
      Request cohort-level customer counts, ARR or usage by product line, top workloads, and deployment-mode mix under
      NDA.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-mix
    missingEvidence: >-
      Independent disclosure of active customers, segment mix, and the share of production volume across shared
      endpoints, dedicated cloud, and BYOC.
    whyItMatters: >-
      Buyer concentration and product-line mix determine whether Modular is a broad platform or a narrower set of
      lighthouse deployments.
    diligencePath: >-
      Obtain customer cohort, logo-to-revenue mapping, deployment-mode adoption, and renewal or expansion data from
      management.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: minor
    topic: deployment-mix
    missingEvidence: >-
      A reconciled explanation for why public analysts disagree on whether cloud or edge is the leading deployment
      segment for inference-related spending.
    whyItMatters: >-
      Deployment-mix assumptions influence how much of adjacent market growth is actually relevant to Modular's public
      cloud and BYOC offers.
    diligencePath: >-
      Triangulate with additional primary cloud, edge, and enterprise survey data or company disclosures rather than
      relying on one analyst definition.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent benchmarks that test Modular's performance and cost claims against vLLM, SGLang, or proprietary APIs
      under comparable workloads.
    whyItMatters: >-
      If performance and savings are only company- or partner-reported, the durability of the economic advantage is
      still uncertain.
    diligencePath: >-
      Request third-party benchmark methodology, customer reference calls, and workload-level before/after economics for
      at least two production accounts.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: pricing-packaging
    missingEvidence: >-
      A standardized public or customer-shareable MAX Enterprise price sheet with at least one representative managed
      endpoint configuration.
    whyItMatters: >-
      Packaging clarity affects replacement speed against Together and managed alternatives, and it limits
      apples-to-apples cost comparison today.
    diligencePath: >-
      Request current list or banded pricing for shared, dedicated, and BYOC-style Modular deployments plus any minimum
      commitments.
    relatedQuestionRefs:
      - QP017
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: distribution-power
    missingEvidence: >-
      Named production deployment references, migration case studies, and repeatable proof that customers switched from
      vLLM, TensorRT-LLM, or managed clouds into MAX.
    whyItMatters: >-
      Without customer migration proof, public evidence cannot confirm that Modular's portability wedge converts into
      distribution power comparable to larger incumbents.
    diligencePath: >-
      Ask management for customer references segmented by workload, hardware mix, prior stack, and time-to-production
      after migration.
    relatedQuestionRefs:
      - QP023
  - type: missing-source
    severity: material
    topic: benchmark-evidence
    missingEvidence: >-
      Independent apples-to-apples benchmark evidence spanning dense models, MoE models, low-latency chat, shared-prefix
      workloads, and multi-GPU production settings.
    whyItMatters: >-
      Current third-party evidence is helpful but narrow, so it cannot fully establish a durable performance moat across
      the buyer shapes that matter most.
    diligencePath: >-
      Commission or request reproducible benchmarks run by an independent operator on fixed hardware and identical model
      or tokenizer settings.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-arr
    missingEvidence: Current revenue, ARR, and active-paying-customer counts by product surface.
    whyItMatters: >-
      Without revenue scale and mix, the chapter can describe monetization design but cannot underwrite current
      commercial traction or enterprise contract quality.
    diligencePath: >-
      Request board deck or finance snapshot showing trailing twelve-month revenue, ARR, paying accounts, and
      product-level mix for shared, dedicated, BYOC, and services.
    relatedQuestionRefs:
      - QI014
      - QI021
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-runway
    missingEvidence: Cash on hand, net burn, gross burn, and management runway assumptions after the 2025 financing.
    whyItMatters: >-
      Runway and next-round timing are central to the financial verdict, especially if the company broadens from
      inference into training or takes on more infrastructure exposure.
    diligencePath: >-
      Request monthly cash bridge, 12-month operating plan, hiring plan, and downside/upside runway scenarios from the
      finance team.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-by-surface
    missingEvidence: >-
      Gross margin and contribution margin by shared endpoints, dedicated endpoints, BYOC, professional services, and
      marketplace channel.
    whyItMatters: >-
      List pricing and customer ROI anecdotes do not reveal whether the best-looking surfaces are actually profitable
      after GPU, support, and engineering costs.
    diligencePath: >-
      Request margin waterfall by product surface, including GPU cost, cloud pass-through, support load, and
      forward-deployed-engineer allocation.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-contracts
    missingEvidence: Top-customer concentration, average contract value, duration, renewal rates, and committed-use terms.
    whyItMatters: >-
      A few large cloud or hardware-linked accounts could make early growth look stronger than the underlying customer
      base actually is.
    diligencePath: Request cohort analysis, top-10 customer concentration, renewal schedule, and direct-versus-channel revenue split.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: channel-take-rates
    missingEvidence: >-
      Marketplace fees, cloud-provider revenue-sharing percentages, and the share of bookings sourced through AWS or
      other partners.
    whyItMatters: >-
      Partner procurement can accelerate growth but also compress net revenue realization if channel economics are
      unfavorable.
    diligencePath: Request channel P&L with marketplace fees, rev-share terms, and attachment rates for partner-sourced bookings.
    relatedQuestionRefs:
      - QI011
      - QI021
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: material
    topic: utilization-and-support-intensity
    missingEvidence: >-
      GPU utilization, token throughput per reserved GPU, support hours per account, and forward-deployed-engineer
      staffing ratios.
    whyItMatters: >-
      The case for a strong long-run margin profile depends on operational leverage in both compute utilization and
      service delivery.
    diligencePath: Request internal capacity and support dashboards split by deployment mode and customer segment.
    relatedQuestionRefs:
      - QI019
      - QI020
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-attestation
    missingEvidence: Public certification or attestation artifacts such as SOC 2, ISO 27001, or a detailed third-party security review.
    whyItMatters: >-
      Policy pages show intent, but enterprise buyers often require independent assurance before approving a platform
      that touches production models or regulated data.
    diligencePath: >-
      Request current audit reports, certification status, pen-test summaries, and any customer-shareable security
      architecture documentation.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: sla-reliability
    missingEvidence: >-
      Public uptime commitments, support response commitments, incident history, or status-page evidence for managed
      endpoints and Mammoth.
    whyItMatters: >-
      Managed-service positioning is central to the product thesis, but public reliability proof is still much thinner
      than the feature narrative.
    diligencePath: >-
      Ask for standard SLA language, status-page history, postmortem process, and customer references discussing
      production operations.
    relatedQuestionRefs:
      - QE025
      - QE026
    relatedTableRefs:
      - TE001
      - TE004
  - type: missing-source
    severity: material
    topic: mammoth-proof
    missingEvidence: >-
      Independent or customer-authored evidence showing Mammoth operating at scale beyond Modular’s own preview
      materials.
    whyItMatters: >-
      Mammoth is central to Modular’s scale-out story, but preview-stage evidence leaves uncertainty about real-world
      maturity and operational overhead.
    diligencePath: >-
      Request design-partner references, architecture deep dives, production case studies, and benchmark methodology for
      multi-model deployments.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE001
      - TE005
  - type: private-evidence-only
    severity: material
    topic: compiler-governance
    missingEvidence: >-
      A precise post-beta roadmap for compiler openness, auditability, telemetry controls, and customer rights if
      Modular changes license terms.
    whyItMatters: >-
      Regulated or security-conscious buyers may accept proprietary tooling, but only if they understand governance,
      audit, and continuity risks clearly.
    diligencePath: >-
      Request a roadmap memo covering compiler-source timing, telemetry controls, escrow or continuity options, and
      enterprise-negotiated license carve-outs.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: blocking
    topic: retention-metrics
    missingEvidence: Customer count, NRR, GRR, logo churn, and renewal schedule by deployment surface.
    whyItMatters: These are the core metrics required to convert strong reference accounts into a view on durable recurring revenue.
    diligencePath: >-
      Request cohort retention, contract renewal, and churn dashboards split by Shared, Dedicated, BYOC, and channel
      accounts.
    relatedQuestionRefs:
      - QU024
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-metrics
    missingEvidence: Top-customer revenue share, partner-sourced bookings mix, and revenue concentration by named account or channel.
    whyItMatters: >-
      Public proof could be dominated by a small number of accounts or one channel without investors being able to see
      it.
    diligencePath: >-
      Request top-10 customer concentration, channel mix, and revenue by named reference account versus long-tail
      customers.
    relatedQuestionRefs:
      - QU028
    relatedTableRefs:
      - TU005
  - type: missing-source
