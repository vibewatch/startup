- id: architecture-deployment-and-operating-model
  title: Architecture, deployment model, and how the stack actually works
  body: |-
    The technical story is strongest where Modular explains how MAX organizes models and serving internals. Public documentation shows that MAX treats model support as a set of architecture packages that define compute graphs, typed configs, weight adapters, and any custom layers needed to map Hugging Face checkpoints into MAX’s graph format. That is more than a shallow wrapper: the platform claims hardware-optimized kernels, production batching, KV-cache management, and multi-GPU distribution without forcing the user to rebuild the serving layer from scratch. The runtime optimization surface is also concrete. MAX documents speculative decoding, prefix caching, and structured output as first-class serving features, with explicit limits such as speculative decoding being incompatible with structured output. The docs further state that prefix caching is enabled by default and that structured output is currently GPU-only.

    Deployment architecture is similarly specific. Modular’s managed cloud offers serverless, dedicated, custom-model, and batch-inference modes. The bring-your-own-cloud option keeps the data plane inside the customer VPC while leaving endpoint lifecycle, scaling policy, monitoring, and model registration in a Modular-operated control plane. That split is attractive for teams with data-residency requirements, but it is also a real governance boundary that an enterprise buyer has to accept. Modular reinforces the managed-service posture with forward-deployed engineering support and explicit promises to tune throughput, latency, and even custom Mojo kernels. In other words, the product is not just a downloadable runtime. It is a software-and-expert-ops offer whose operating model spans graph compilation, kernel specialization, deployment policy, and human tuning support.
