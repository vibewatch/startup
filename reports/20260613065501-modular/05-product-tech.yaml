- calloutType: risk
  title: Mammoth and enterprise trust are the two biggest execution gaps
  body: Public materials show a promising orchestration layer and several policy controls, but the strongest sources still stop short of broad field proof on Mammoth, public security attestations, or explicit uptime and compliance commitments. Those are not fatal gaps, but they matter for buyers who need more than performance narratives.
