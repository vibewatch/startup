- id: trust-governance-and-open-risks
  title: Trust, governance, and the product risks that remain open
  body: |-
    Modular does have visible trust controls, but the public pack is stronger on policy than on attestation. The privacy policy describes technical and organizational safeguards and maps to GDPR and CPRA-style rights. The report-issue page routes privacy, safety, and security concerns to a dedicated security team. The Acceptable Use Policy explicitly covers MAX Platform, Modular Cloud, and AI-powered features, and requires human review for legal, medical, and financial advice use cases. Those are meaningful controls. So is the BYOC model, which keeps inference traffic inside the customer VPC. For buyers that mainly want proof that the company has thought about privacy, misuse, and incident intake, the basics are present.

    But the diligence gaps are still material. The public material reviewed here did not surface a SOC 2 report, ISO 27001 certificate, public uptime commitments, or a detailed security architecture white paper. The legal structure also introduces governance friction. Modular has open-sourced large parts of MAX and Mojo, yet the Community License remains contract-governed, allows telemetry usage, restricts reverse engineering and standalone redistribution, and requires approval for custom hardware use beyond supported targets. Independent commentary makes the bigger risk explicit: the Mojo standard library may be open, but the MAX compiler remaining closed is still a compliance and auditability concern for some enterprises. Product verdict: Modular looks technically differentiated and directionally enterprise-aware, but a risk-conscious buyer should still treat certifications, SLA proof, compiler governance, and preview-to-GA transitions as open diligence items rather than solved problems.
