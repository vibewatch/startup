tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - MAX serving framework
    - Inference engineers and platform teams
    - Publicly shipped; docs, PyPI package, GitHub repo, and release branches all active
    - OpenAI-compatible serving plus cross-vendor portability and custom-kernel extensibility
    - Need customer-level proof on production uptime and migration friction from incumbent stacks
  - - MAX custom model workflow
    - Model developers adapting Hugging Face checkpoints
    - Publicly documented with reference architectures and weight-adapter workflow
    - Lets teams reuse existing architectures and only override graph pieces that differ
    - Need proof of how often non-trivial architectures require deeper rewrites than docs imply
  - - Mammoth orchestration layer
    - Enterprise AI infra teams running many models across mixed GPU fleets
    - Public preview
    - Kubernetes-native control plane, multi-model orchestration, and disaggregated inference on heterogeneous hardware
    - Need GA timing, customer references, and independent proof of large-cluster operations
  - - Managed cloud
    - Teams that want Modular-operated production inference
    - Publicly offered with serverless, dedicated, custom-model, and batch patterns
    - Kernel-to-cloud optimization with forward-deployed engineering support
    - Public SLA detail, certification evidence, and per-surface reliability metrics remain thin
  - - Bring-your-own-cloud
    - Regulated or security-sensitive buyers with existing cloud commitments
    - Publicly offered
    - Keeps data plane in customer VPC while preserving Modular control-plane tooling and GPU portability
    - Control-plane boundary, telemetry, and security-review burden need procurement diligence
  - - Mojo language
    - Kernel developers and advanced systems programmers
    - 1.0 beta; broader roadmap still in progress
    - Pythonic syntax with compile-time metaprogramming, hardware dispatch, and portable kernel authoring
    - Need final 1.0 timeline confidence and clarity on compiler governance after beta
  - - Community and channel surfaces
    - Developers, evaluators, and enterprise buyers
    - Active but still maturing
    - GitHub, PyPI, Meetup, Discord, YouTube, and AWS Marketplace create multiple acquisition paths
    - Mainstream troubleshooting and independent ecosystem breadth still trail older OSS incumbents
  notes: Rows separate execution-layer products from orchestration, deployment, language, and developer-acquisition surfaces because Modular now sells a stack rather than a single runtime.
