    - Public and current
    - Defines redistribution, custom-hardware approval, telemetry, and reverse-engineering restrictions
    - Contract-governed SDK use limits openness for some enterprise buyers
  - - Independent compliance proof
    - Not publicly surfaced in reviewed sources
    - Would normally include certifications, uptime commitments, or external security attestations
    - No public SOC 2, ISO 27001, or detailed security architecture artifact was located in the source pack
