  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-attestation
    missingEvidence: Public certification or attestation artifacts such as SOC 2, ISO 27001, or a detailed third-party security review.
    whyItMatters: Policy pages show intent, but enterprise buyers often require independent assurance before approving a platform that touches production models or regulated data.
    diligencePath: Request current audit reports, certification status, pen-test summaries, and any customer-shareable security architecture documentation.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: sla-reliability
    missingEvidence: Public uptime commitments, support response commitments, incident history, or status-page evidence for managed endpoints and Mammoth.
    whyItMatters: Managed-service positioning is central to the product thesis, but public reliability proof is still much thinner than the feature narrative.
    diligencePath: Ask for standard SLA language, status-page history, postmortem process, and customer references discussing production operations.
    relatedQuestionRefs:
    - QE025
    - QE026
    relatedTableRefs:
    - TE001
    - TE004
  - type: missing-source
    severity: material
    topic: mammoth-proof
    missingEvidence: Independent or customer-authored evidence showing Mammoth operating at scale beyond Modular’s own preview materials.
    whyItMatters: Mammoth is central to Modular’s scale-out story, but preview-stage evidence leaves uncertainty about real-world maturity and operational overhead.
    diligencePath: Request design-partner references, architecture deep dives, production case studies, and benchmark methodology for multi-model deployments.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: compiler-governance
    missingEvidence: A precise post-beta roadmap for compiler openness, auditability, telemetry controls, and customer rights if Modular changes license terms.
    whyItMatters: Regulated or security-conscious buyers may accept proprietary tooling, but only if they understand governance, audit, and continuity risks clearly.
    diligencePath: Request a roadmap memo covering compiler-source timing, telemetry controls, escrow or continuity options, and enterprise-negotiated license carve-outs.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
