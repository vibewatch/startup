  - CE011
  - CE025
  - CE043
  - CE045
  - CE049
- calloutType: recommendation
  title: Treat compiler governance, control-plane boundaries, and certification proof as priority diligence asks
  body: Before underwriting Modular as a default enterprise platform, diligence should pin down the post-1.0 compiler open-source plan, the exact operational and access boundaries in BYOC deployments, and whether public certification or audit evidence exists beyond policies and intake forms.
