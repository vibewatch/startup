- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap
  rows:
  - - Privacy policy
    - Public and current
    - Covers website and platform data handling, GDPR/CPRA rights, and security measures
    - Describes controls at policy level but is not an independent certification
  - - Security / safety report intake
    - Public and current
    - Dedicated issue-report form for safety, privacy, and security concerns
    - No public disclosure timetable or bug-bounty detail was surfaced in the reviewed pack
  - - Acceptable AI Use Policy
    - Public and current
    - Governs MAX Platform, Modular Cloud, and AI-powered features; adds human-review requirements for sensitive advice use cases
    - Policy language exists, but enforcement evidence is not publicly described in depth
  - - BYOC VPC data-plane isolation
    - Publicly documented
    - Keeps inference traffic inside customer infrastructure while Modular runs control services
    - Still requires review of control-plane access, telemetry, and operational boundaries
