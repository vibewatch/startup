tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Modular
    rows:
      - - Shared inference endpoints
        - Token-priced API inference, burst capacity, and optimization support for open or custom models
        - Foundational model R&D, generic chatbot SaaS, and raw cloud GPU reservation without serving layer
        - Product team or AI engineering lead with usage budget
        - Closest fit for fast-start buyers using Modular-managed infrastructure
      - - Dedicated managed inference
        - Always-on managed serving, observability, and custom model tuning in Modular-hosted cloud
        - General-purpose cloud spend not tied to model-serving outcomes
        - Platform team with latency or reliability budget
        - Relevant for teams moving beyond prototypes into production SLAs
      - - BYOC / private inference
        - Control plane, orchestration, and model-serving stack inside the customer VPC plus engineering support
        - Unmanaged Kubernetes labor, unrelated security tooling, or sovereign-cloud spend outside inference
        - Platform, security, or procurement owner using committed cloud spend
        - High relevance for regulated or large-enterprise buyers
      - - Portable compiler/runtime layer
        - Kernel optimization, cross-accelerator portability, and custom model compilation
        - Training infrastructure, model creation, or one-off local developer notebooks
        - ML infra or systems engineering owner
        - Differentiating layer that can justify switching from wrapper-based stacks
      - - Workflow-specific inference
        - Agentic, voice, code, and multimodal serving tuned for latency, throughput, and hardware mix
        - Vertical application revenue not attributable to serving layer
        - AI product GM or business-unit owner
        - Important because Modular markets around workflow economics rather than abstract infrastructure
      - - Status-quo substitutes
        - NVIDIA-centric clouds, proprietary APIs, vLLM/TensorRT wrappers, self-managed K8s, ONNX-based portability stacks
        - N/A
        - Same buyer set as above
        - These substitutes compete for the same budget and define the real boundary of demand
    notes: Rows separate production inference infrastructure spend from broader AI software, model-development, and generic cloud spend so the chapter does not overstate Modular's market.
    claimRefs:
