  - id: buyer-user-and-payer-map
    title: Buyer, user, payer, and adoption path
    body: >-
      Modular’s buyer map is more nuanced than “anyone running models.” The
      self-serve and shared-endpoint surfaces speak to developers and product
      teams that want fast experimentation, explicit token economics, and
      minimal infrastructure work. The BYOC offer is different: it is aimed at
      platform, security, and ML infrastructure teams that need data to stay
      inside a customer VPC, want to reuse cloud commitments, and prefer
      enterprise engineering support over internal cluster assembly. The
      solutions pages imply at least three near-term workflow-heavy segments:
      agent builders, voice teams, and coding-tool vendors. In each case the
      end user experiences the product, but the economic buyer is usually a
      platform lead, AI engineering manager, or procurement/FinOps owner who
      is accountable for latency, gross margin, and vendor risk. The customer
      page broadens the map further by showing cloud, hardware, and
      application partners such as AWS, AMD, NVIDIA, Inworld, and Hippocratic
      AI. That mix suggests Modular is not selling a generic developer tool so
      much as a production-serving layer to organizations with recurring
      inference loads and strong sensitivity to infrastructure design.
    claimRefs:
