callouts:
  - calloutType: strength
    title: Modular is selling a portability-and-economics wedge, not a generic AI platform
    body: The strongest public market case is not that Modular owns all inference spend, but that a meaningful subset of production AI buyers now care deeply about hardware choice, deployment flexibility, and unit economics. Shared endpoints, BYOC packaging, and workflow-specific pages all reinforce that wedge.
    claimRefs:
      - CM002
      - CM020
      - CM024
      - CM025
      - CM026
      - CM043
  - calloutType: risk
    title: CUDA lock-in and incumbent standardization are real adoption headwinds
    body: Portable serving is attractive in theory, but the cost of leaving CUDA-first production paths is still high. AlphaStreet highlights deep software lock-in and supply scarcity around Nvidia, while Nvidia's own MGX push shows incumbents are also making deployment easier for buyers who stay inside the dominant ecosystem.
    claimRefs:
      - CM034
      - CM035
      - CM039
      - CM040
  - calloutType: risk
    title: Public TAMs are useful context, but not a defendable Modular SOM
    body: The published market numbers in this pack are adjacent definitions, not a clean bottom-up market for Modular. Without public customer-count, deployment-mode, or revenue-mix disclosure, investors still need internal data before underwriting any precise serviceable obtainable market.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
      - CM019
      - CM041
