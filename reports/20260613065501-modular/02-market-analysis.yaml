  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Inference market and infrastructure growth
        - Growth driver
        - Current / multi-year
        - Large adjacent markets create room for specialized serving layers as production AI spend rises
        - Map which portions of spending Modular can actually monetize versus generic cloud or model spend
      - - Kubernetes standardization for AI workloads
        - Growth driver
        - Current
        - Production inference is increasingly organized around Kubernetes-native control planes and routing
        - Test how much customer demand truly prefers K8s-native stacks versus simpler managed APIs
      - - Hardware portability and abstraction demand
        - Growth driver
        - Current / multi-year
        - ONNX Runtime, MLIR, and llm-d all show industry appetite for accelerator-neutral serving and orchestration
        - Verify whether buyers are willing to switch vendors for portability before supply pressure forces them
      - - Workflow-specific cost pressure in agentic, voice, and coding products
        - Growth driver
        - Current
        - High call volume and low-latency requirements make serving economics a strategic budget line
        - Request per-segment gross-margin and latency case studies beyond partner quotes
      - - CUDA lock-in and migration inertia
        - Constraint
        - Current / structural
        - Existing software stacks, libraries, and developer muscle memory slow platform switching
        - Quantify migration time, retesting burden, and buyer appetite for dual-stack operations
      - - GPU supply scarcity and procurement timing
        - Constraint
        - Current / cyclical
        - Access to usable compute can matter more than theoretical price-performance, favoring incumbents
        - Determine whether Modular wins because of better economics, better access, or both
      - - Capex, integration, and talent constraints
        - Constraint
        - Current / structural
        - Analyst sources cite upfront cost, co-design complexity, privacy/security, and skills gaps as real blockers
        - Assess how much Modular reduces implementation burden versus merely relocating it
      - - Public evidence gap on Modular-specific scale
        - Constraint
        - Current
        - No public customer-count, workload-mix, or SAM/SOM disclosure makes underwriting heavily diligence-dependent
        - Request cohort, deployment-mode, retention, and benchmark data under NDA
    notes: Drivers and constraints are mixed intentionally because the same market expansion that creates demand also raises the implementation and switching burden buyers must clear.
