  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sam-som
      missingEvidence: Customer-count, deployment-mode mix, gross-margin, and workload-volume data needed to calculate a bottom-up Modular SAM or SOM.
      whyItMatters: Without internal customer and usage data, public TAMs cannot be translated into a defendable captured-market estimate.
      diligencePath: Request cohort-level customer counts, ARR or usage by product line, top workloads, and deployment-mode mix under NDA.
      relatedQuestionRefs:
        - QM023
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: customer-mix
      missingEvidence: Independent disclosure of active customers, segment mix, and the share of production volume across shared endpoints, dedicated cloud, and BYOC.
      whyItMatters: Buyer concentration and product-line mix determine whether Modular is a broad platform or a narrower set of lighthouse deployments.
      diligencePath: Obtain customer cohort, logo-to-revenue mapping, deployment-mode adoption, and renewal or expansion data from management.
      relatedQuestionRefs:
        - QM024
      relatedTableRefs:
        - TM004
    - type: conflicting-data
      severity: minor
      topic: deployment-mix
      missingEvidence: A reconciled explanation for why public analysts disagree on whether cloud or edge is the leading deployment segment for inference-related spending.
      whyItMatters: Deployment-mix assumptions influence how much of adjacent market growth is actually relevant to Modular's public cloud and BYOC offers.
      diligencePath: Triangulate with additional primary cloud, edge, and enterprise survey data or company disclosures rather than relying on one analyst definition.
      relatedQuestionRefs:
        - QM009
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: independent-benchmarking
      missingEvidence: Independent benchmarks that test Modular's performance and cost claims against vLLM, SGLang, or proprietary APIs under comparable workloads.
      whyItMatters: If performance and savings are only company- or partner-reported, the durability of the economic advantage is still uncertain.
      diligencePath: Request third-party benchmark methodology, customer reference calls, and workload-level before/after economics for at least two production accounts.
      relatedQuestionRefs:
        - QM025
      relatedTableRefs:
        - TM004
