        - label: Outer TAM — Global AI inference / infrastructure markets (USD 67.8B–117.8B adjacent 2025-2026 views)
          detail: Analyst estimates show large demand, but boundaries differ across hardware-only, infrastructure, and inference definitions.
          tone: neutral
        - label: Constrained SAM — Production-serving spend where buyers value portability, orchestration, or compliance
          detail: Enterprise and AI-native inference budgets that care about BYOC, multi-accelerator flexibility, or migration away from proprietary APIs.
          tone: neutral
        - label: Publicly unquantified SOM — Modular-capturable share
          detail: Requires internal customer mix, deployment-mode volume, and retention data; not supportable from public evidence alone.
          tone: warning
