slug: modular
runDate: '2026-06-13'
company:
  name: Modular
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Modular competes in a narrower wedge than the broad AI-software or model
    market: production inference infrastructure that promises hardware
    portability, managed deployment, and lower cost for AI-native teams and
    enterprise platform groups. Public market data supports a large and
    fast-growing backdrop for inference and AI infrastructure, but published
    2026 sizing ranges are boundary-dependent and sometimes contradictory, so
    the most defensible lens is a constrained serviceable market rather than
    one headline TAM. Adoption is helped by Kubernetes standardization, rising
    inference spend, and portability tooling, but slowed by CUDA lock-in,
    buyer migration risk, capex constraints, and the lack of public
    Modular-specific customer or workload mix data.
sections:
  - id: market-boundary-and-substitutes
    title: Market boundary, included spend, and substitutes
    body: >-
      Modular should not be analyzed as if it participates in all AI software
      or all GPU infrastructure spend. Its own product surfaces define a
      narrower market around production inference infrastructure: hosted shared
      endpoints, dedicated managed endpoints, bring-your-own-cloud deployments,
      custom model serving, and the compiler/runtime layer that promises
      portability across NVIDIA, AMD, CPUs, and Apple Silicon. The included
      spend is therefore the budget a buyer allocates to serving models in
      production with acceptable latency, reliability, and compliance, plus
      the engineering layer needed to tune kernels, batching, and routing.
      Excluded spend includes foundational model creation, generic SaaS
      copilots, undifferentiated cloud IaaS, and most one-off experimentation
      that never reaches production serving. The substitute set is broad:
      proprietary model APIs, single-vendor GPU clouds, wrapper-based stacks
      such as vLLM or TensorRT integrations, self-managed Kubernetes
      inference, and portable runtimes like ONNX Runtime. That framing matters
      because it makes Modular less a bet on one model family and more a bet
      that portability, deployment flexibility, and inference economics become
      purchase criteria for serious AI operators.
