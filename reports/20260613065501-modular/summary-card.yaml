summary:
  headline: >-
    Modular has real technical differentiation, fresh capital, and early customer proof, but public revenue, margin,
    retention, and cap-table disclosure remain too thin to underwrite a buy at the latest $1.6 billion valuation.
  overallScore: 6
  recommendation: research-more
