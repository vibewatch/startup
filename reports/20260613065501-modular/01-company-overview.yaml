callouts:
- calloutType: strength
  title: Hardware neutrality is the core strategic differentiator
  body: The strongest through-line across Modular’s materials is not any single model endpoint or language feature but the promise that one stack can span NVIDIA, AMD, CPUs, clouds, and customer-controlled environments. That narrative is reinforced by repeat venture backing and named partners rather than by marketing copy alone.
  claimRefs:
  - CO016
  - CO017
  - CO030
  - CO031
  - CO036
  - CO045
- calloutType: risk
  title: Commercial disclosure still lags technical momentum
  body: Public evidence is strong on fundraising, platform vision, and ecosystem claims, but weak on revenue, customer count, contract concentration, and board control. That means the company may be strategically impressive while still requiring much deeper commercial diligence before underwriting durable economics.
  claimRefs:
  - CO019
  - CO038
  - CO040
  - CO041
  - CO042
  - CO047
- calloutType: insight
  title: Mojo remains important, but the live company thesis is broader than a language bet
  body: Mojo created early community attention, yet the current Modular story is really MAX plus orchestration plus partner-led deployment across heterogeneous hardware. Investors and operators should therefore evaluate the company as an infrastructure platform with a language component, not as a pure developer-tools startup.
  claimRefs:
  - CO021
  - CO029
  - CO038
  - CO045
  - CO046
