  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, board observer rights, committee structure, and founder or investor control documents.
    whyItMatters: Leadership and funding are visible, but governance control still materially affects downside protection and strategic decision-making.
    diligencePath: Request the latest board deck, charter set, and cap-table or governance summary from management or lead investors.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current ARR, revenue run-rate, gross margin, and customer concentration by deployment mode.
    whyItMatters: The company can be technically impressive and still fail underwriting if growth quality, unit economics, or revenue concentration are weak.
    diligencePath: Request monthly recurring revenue, booked ARR, gross-margin bridge, and top-customer concentration for the last four quarters.
    relatedQuestionRefs:
    - QO022
    - QO023
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: A full current investor list, customer roster, and distinction between design partners, cloud channels, and paying production accounts.
    whyItMatters: Named logos help with story quality, but diligence needs to know who actually drives revenue, control, and referenceability.
    diligencePath: Request a current cap table, a top-20 customer list with ARR or spend bands, and partner-program terms.
    relatedQuestionRefs:
    - QO013
    - QO015
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: More precise dates for some office, roadmap, and release milestones that are only year-level or month-level in the reviewed public pack.
    whyItMatters: Chronology is directionally clear, but exact sequencing would matter in a deeper refresh or competitive-timing analysis.
    diligencePath: Pull a fuller press archive or internal release calendar if exact event dating becomes material.
    relatedQuestionRefs:
    - QO019
    - QO020
    relatedTableRefs:
    - TO004
