- id: leadership-footprint-and-organization
  title: Leadership visibility, operating footprint, and organizational scale
  body: 'The public leadership bench is identifiable but not fully governed in the way a late-stage private company diligence process would ideally require. Modular’s About page names Chris Lattner as co-founder and CEO, Tim Davis as co-founder and president, Mostafa Hagog as VP of engineering, Kalor Lewis as VP of finance, Eric Johnson as product lead, and Mike Edwards as head of special projects. Independent and investor sources strengthen founder-market-fit confidence: GV highlights Lattner’s LLVM, Clang, Swift, and TPU background and Davis’s TensorFlow Lite and on-device ML experience, while TechCrunch and SDxCentral independently describe the company as Palo Alto-based. Footprint disclosure has also broadened. Modular’s About page now lists offices in San Francisco, Los Altos, Boston, and Edinburgh, and the office-expansion post says Edinburgh sits in the Bayes Centre while San Francisco’s Jackson Square office complements the Los Altos headquarters. Scale disclosure remains directional
    rather than exhaustive: the company said it had grown to more than 130 people in September 2025, and Reuters-linked coverage described about 130 employees at that point. What remains missing is a full board roster, committee structure, and clearer succession depth beyond the founders.'
