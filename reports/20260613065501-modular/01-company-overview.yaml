company:
  name: Modular
chapter:
  number: 1
  title: Company Overview
  summary: Modular is a 2022-founded private AI infrastructure company led by Chris Lattner and Tim Davis that has expanded from the early Mojo-language story into a broader MAX-plus-Mammoth stack for hardware-portable inference. Public evidence supports a June 2022 seed, a $100 million August 2023 Series B, and a $250 million September 2025 Series C that brought total capital raised to $380 million at a $1.6 billion valuation. The strongest diligence caveats are still limited public disclosure on revenue, exact customer count, full board composition, and the long-term boundary between open-source Mojo components and Modular’s contract-governed commercial platform.
sections:
- id: identity-product-and-founding
  title: Identity, founding, and what the company actually sells
  body: 'Modular describes itself as a company building a unified AI compute layer rather than a point tool for one chip vendor or one model family. Across the About page, pricing surface, and 2025 financing post, the company consistently frames the core offer as hardware-portable inference infrastructure built around MAX, Mojo, and now Mammoth, with deployment options in Modular-hosted cloud, customer VPCs, or self-managed environments. The founding story is also consistent: Chris Lattner and Tim Davis met at Google, concluded that fragmented AI infrastructure was slowing adoption, and founded Modular in 2022 to abstract that complexity away. Public location language varies between Silicon Valley, Palo Alto, Los Altos, and the broader San Francisco Bay Area, but the center of gravity is clearly Bay Area-based. The practical business-model takeaway is that Modular is no longer only a language bet; it is selling a full-stack infrastructure layer with free developer entry points, paid consumption
    endpoints, and enterprise deployments for customers that want portability across NVIDIA, AMD, CPU, and cloud environments.'
