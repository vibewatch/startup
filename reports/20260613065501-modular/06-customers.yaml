- id: TU006
  title: Public customer evidence quality table
  columns:
  - Evidence class
  - What public sources show
  - Example
  - Underwriting value
  - What it does not prove
  rows:
  - - Named customer case study on company site
    - Workload, deployment story, and outcome metrics
    - Inworld or Hippocratic AI
    - Strongest customer-proof surface when paired with third-party corroboration
    - Contract value, renewal, or concentration
  - - Customer-authored corroboration
    - External customer describes the same deployment problem and outcome
    - Inworld blog
    - Upgrades trust versus a company-only case study
    - Broader customer breadth or retention
  - - Partner/channel case study
    - Marketplace packaging, deployment scope, and procurement path
    - AWS case study
    - Useful for GTM and channel design
    - Direct end-customer diversification
  - - Launch or release announcement
    - New distribution or batch-inference surface
    - SF Compute launch or Platform 25.5
    - Shows commercialization experimentation and product expansion
    - Durable spend or repeat usage
  - - Logo, quote, or ecosystem mention
    - Named partner or customer appears in a quote or broad list
    - Customers page, Modverse, funding blog
    - Useful lead for diligence
    - Production maturity, spend, or retention by itself
  notes: 'This ladder is the central distinction for the chapter: not all named logos carry equal evidentiary weight.'
