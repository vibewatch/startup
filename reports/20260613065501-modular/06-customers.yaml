  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: retention-metrics
    missingEvidence: Customer count, NRR, GRR, logo churn, and renewal schedule by deployment surface.
    whyItMatters: These are the core metrics required to convert strong reference accounts into a view on durable recurring revenue.
    diligencePath: Request cohort retention, contract renewal, and churn dashboards split by Shared, Dedicated, BYOC, and channel accounts.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-metrics
    missingEvidence: Top-customer revenue share, partner-sourced bookings mix, and revenue concentration by named account or channel.
    whyItMatters: Public proof could be dominated by a small number of accounts or one channel without investors being able to see it.
    diligencePath: Request top-10 customer concentration, channel mix, and revenue by named reference account versus long-tail customers.
    relatedQuestionRefs:
    - QU028
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: enterprise-proof
    missingEvidence: Named Fortune 500 or compliance-sensitive BYOC customers with workload, term, and deployment scope.
    whyItMatters: BYOC is the premium enterprise motion, but unnamed scale claims leave buyer quality and repeatability uncertain.
    diligencePath: Obtain named BYOC customer references or anonymized account roster with workload type, live date, and current usage.
    relatedQuestionRefs:
    - QU019
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: proof-grading
    missingEvidence: Contract value, term, and expansion history for Inworld, Hippocratic AI, AWS channel, and SF Compute.
    whyItMatters: The current proof is good enough to show relevance, but not good enough to distinguish pilots, strategic design partners, and durable revenue anchors.
    diligencePath: Request account histories showing initial ACV, current ACV, usage growth, and renewal state for each named reference.
    relatedQuestionRefs:
    - QU025
    - QU033
    relatedTableRefs:
    - TU003
