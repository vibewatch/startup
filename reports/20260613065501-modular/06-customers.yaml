- id: named-proof-inworld-and-hippocratic-are-the-core-end-customer-evidence
  title: 'Named proof: Inworld and Hippocratic AI are the strongest end-customer signals, while AWS and SF Compute are stronger as channel proof'
  body: 'The strongest public customer evidence comes from AI-native application builders with concrete workloads, not from broad enterprise logo pages. Inworld is the cleanest example because both Modular and Inworld describe the same production text-to-speech engagement: a co-engineered deployment, less than eight weeks from engagement to production, roughly 70% faster time to first audio, about 200 milliseconds to the first two seconds of audio, and an eventual price roughly 60% lower than a vanilla vLLM-based path. Hippocratic AI is the next-best proof point. Modular says Hippocratic already contacts tens of thousands of patients daily, runs production deployments across multiple frameworks, and benchmarked MAX against an existing SGLang deployment on 400B-plus-parameter models with sub-500 millisecond TTFT plus better mean and tail latency. By contrast, AWS and SF Compute matter mostly as packaging and distribution proof: they show procurement, deployment, and partner monetization surfaces, but they do not establish broad independent end-customer breadth on their own.'
