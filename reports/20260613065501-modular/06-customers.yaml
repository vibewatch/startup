artifact: customers
slug: modular
company:
  name: Modular
chapter:
  number: 6
  title: Customers
summary: Modular has real customer proof, but the proof is narrow and mostly concentrated in AI-native reference accounts plus cloud-channel partners. Inworld and Hippocratic AI are the clearest named workload operators with quantified production outcomes; AWS and SF Compute are more accurately procurement and distribution proof than end-customer breadth. The customer verdict is constructive on product-market resonance in real-time AI inference, but cautious on durability because public materials still do not disclose customer count, renewals, retention, or concentration.
runDate: '2026-06-13'
sections:
- id: segmenting-who-buys-who-uses-and-who-pays
  title: 'Customer map: Modular sells to developers first, but monetizes through managed and compliance-sensitive production buyers'
  body: 'Modular does not have one public customer archetype. The free Self Hosted edition and open-source MAX repo are clearly designed to attract developers and platform engineers who want to test open-model inference without upfront spend. Monetization begins once that developer interest turns into production traffic: Shared Endpoints target experimentation and variable-load production on a pay-per-token basis, Dedicated Endpoints target latency-sensitive production on reserved warm capacity, and BYOC targets security- or compliance-sensitive teams that want inference inside their own cloud or on-prem environment. That means the buyer, user, and payer often split. Developers may start the evaluation, but platform, infrastructure, security, or finance owners become the real budget holders on Dedicated and BYOC surfaces. The public record also shows a second commercial layer: channel and ecosystem counterparties such as AWS and SF Compute, which matter because they shape procurement and deployment paths even when they are not the final end-customer workload owner.'
