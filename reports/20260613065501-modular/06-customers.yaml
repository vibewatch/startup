- id: concentration-and-partner-dependence-remain-the-main-customer-risks
  title: 'Risk read: customer proof is concentrated and partner dependence is still a real part of the story'
  body: 'The practical risk is not that Modular has zero proof; it is that the proof is narrow relative to the scale implied by the broader company narrative. The named end-customer workload evidence is concentrated in a handful of AI-native references, especially Inworld and Hippocratic, while the rest of the customer page mixes partner endorsements, hardware-platform quotes, and unnamed enterprise-scale claims. Reuters and follow-on coverage reinforce that the company''s commercial motion runs both directly to enterprises and through revenue-sharing partnerships with cloud providers, which makes channel leverage a strength but also a dependency. BYOC reduces buyer friction for teams that want to keep data and cloud credits inside their own perimeter, yet it also means Modular depends on cloud and hardware ecosystems rather than owning the full stack economics. The adverse backdrop matters too: CUDA lock-in, supply scarcity, and hyperscaler distribution all raise migration friction. Net: Modular looks commercially relevant for a real slice of AI inference buyers, but still under-disclosed on breadth, retention, and concentration.'
