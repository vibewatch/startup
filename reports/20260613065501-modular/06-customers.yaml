- id: durability-and-expansion-logic-are-visible-but-not-quantified
  title: 'Durability: the expansion loop is legible, but the retention math is still private'
  body: 'The attractive part of Modular''s customer story is that the expansion loop is easy to understand. Public pages show a deliberate bridge from free self-hosted usage into Shared Endpoints, then Dedicated or BYOC deployments, and finally custom engineering, custom kernels, or AWS Marketplace procurement. Every paid tier also includes engineers tuning the workload, which suggests that expansion is not just more GPU consumption but also deeper account penetration through optimization work and migration help. The problem is that none of the public materials disclose the metrics needed to judge whether this loop is durable or efficient. There is no public customer count, no NRR or GRR, no churn, no contract duration, no renewal schedule, and no top-customer mix. The best public durability proxies are therefore weaker substitutes: repeated co-engineering depth with Inworld and Hippocratic, Fortune-500-scale claims on BYOC without named accounts, and channel packaging through AWS. Those are useful signs of relevance, but they are not renewal evidence.'
  claimRefs:
  - CU023
  - CU024
  - CU027
  - CU028
  - CU029
