  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Named proof
  - Use case
  - Revenue / strategic value
  - Main gap
  rows:
  - - Free self-serve developers
    - Developers and platform engineers evaluate; no separate payer at entry
    - Self Hosted edition, MAX repo, community meetings
    - Trial open-model serving, benchmarking, early integration
    - Top-of-funnel adoption and future enterprise pipeline
    - Conversion from free usage into paid accounts is undisclosed
  - - Managed-cloud experimenters
    - App teams and platform engineers use Shared Endpoints; budget usually sits with engineering or product
    - Shared Endpoints page
    - Variable-traffic prototyping and early production
    - Token-priced land motion with low procurement friction
    - No public account counts or conversion rates
  - - Latency-sensitive production buyers
    - Infrastructure or platform owners pay; developers and ML teams are users
    - Dedicated Endpoints page
    - Warm reserved inference for production workloads
    - Higher-ACV managed production surface
    - No public minute-rate card, contract length, or renewal history
  - - Compliance-sensitive enterprise buyers
    - Security, platform, or procurement teams pay; app teams and operators use the service
    - BYOC / Your Cloud page
    - Inference in customer VPC or on-prem with Modular control plane and engineers
    - Strongest fit for regulated or data-sensitive workloads
    - No named BYOC customer or Fortune 500 account disclosed
  - - AI-native workload operators
    - Product and infrastructure teams pay; end users are application customers or patients
    - Inworld and Hippocratic AI
    - Real-time voice and large-model inference
    - Best public end-customer proof with quantified outcomes
    - Proof is concentrated in a small number of named accounts
  - - Channel / cloud counterparties
    - Cloud or marketplace counterparty enables procurement; end buyer may be AWS customer or batch-inference buyer
    - AWS and SF Compute
    - Marketplace procurement, channel packaging, batch inference distribution
    - Expands reach without requiring Modular to source every account directly
    - Does not equal diversified direct-customer breadth
  notes: Rows separate developer adoption, direct enterprise monetization, and partner-channel motion so logos are not mistaken for equivalent customer proof.
