- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / dependence risk
  - Impact
  - Diligence path
  rows:
  - - Free-to-paid conversion from self-hosted and open-source funnel
    - Public adoption is visible, but conversion into paying accounts is opaque
    - Funnel quality could be overstated if downloads mostly stay non-commercial
    - Request free-to-shared, shared-to-dedicated, and repo-to-demo conversion metrics
  - - Real-time voice reference accounts
    - Strongest named proof is concentrated in a narrow AI-native workload wedge
    - Customer appeal may be real but more vertical than the broader narrative implies
    - Request pipeline and win-rate by end market beyond voice and inference infra teams
  - - BYOC / regulated deployment motion
    - Fortune 500 and compliance claims are unnamed
    - Hard to tell whether the premium enterprise motion is broad or bespoke
    - Request named references or anonymized count of live BYOC tenants
  - - AWS Marketplace / channel procurement
    - Channel packaging can dilute customer ownership and hide direct-customer concentration
    - Growth may depend on partner policy, fees, and co-sell support
    - Request bookings mix, fee stack, and partner-sourced renewal rates
  - - Cloud / hardware portability story
    - Customer adoption still depends on buyers validating migration away from CUDA-first stacks
    - Migration friction can slow uptake even when economics are attractive
    - Request competitive win/loss data and migration timelines by hardware target
  - - Named-account concentration
    - Public proof revolves around Inworld, Hippocratic, AWS, and SF Compute
    - A small number of reference accounts could dominate the visible story
    - Request top-10 customer share and revenue by named reference account versus long tail
  notes: Expansion vectors are real, but every one of them still suffers from missing account-level disclosure or ecosystem dependency.
