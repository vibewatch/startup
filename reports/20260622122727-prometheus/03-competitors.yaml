callouts:
  - calloutType: strength
    title: Architectural Distinction from All Incumbents
    body: >
      No incumbent engineering software vendor ships a cross-domain "artificial general engineer" built on generalist world models. Autodesk Neural CAD, Siemens Eigen Engineering
      Agent, Ansys SimAI, and Cadence Cerebrus are all domain-specific or workflow-specific automation tools, not generalist physics-grounded AI agents. Prometheus's founding
      thesis occupies genuinely uncontested architectural territory, with transformer-based LPMs trained on multimodal physical data from aerospace, semiconductors, automotive, and
      manufacturing simultaneously.
    claimRefs:
      - CP001
      - CP006
      - CP027

  - calloutType: risk
    title: Incumbent Distribution at Scale Is the Primary Moat Risk
    body: >
      Siemens' Eigen Engineering Agent launched commercially to 600,000+ TIA Portal users on April 20, 2026. Autodesk serves 4.6 million engineering professionals through Fusion 360.
      Cadence and Synopsys each serve nearly all semiconductor design teams globally. Prometheus must build distribution from zero against entrenched players who can push AI
      engineering capabilities as updates to existing subscriptions. The NemoClaw Blueprint enabling autonomous agent capabilities for all five major incumbents simultaneously
      is the single largest competitive risk to Prometheus's market entry timeline.
    claimRefs:
      - CP003
      - CP012
      - CP024
      - CP034

