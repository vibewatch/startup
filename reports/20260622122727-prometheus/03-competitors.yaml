company:
  name: Prometheus
chapter:
  number: 3
  title: Competitors
  summary: >
    Prometheus (formerly Project Prometheus) operates at the intersection of three competitive rings: deep-pocketed engineering-software incumbents now rapidly embedding AI
    (Synopsys+Ansys, Autodesk, Siemens DIS, Dassault Systèmes, Cadence, PTC), AI-native physics-simulation startups led by PhysicsX ($300M Series C, $2.4B valuation, June 2026),
    and NVIDIA whose NemoClaw Blueprint enables any ISV to build autonomous engineering agents. Prometheus's "artificial general engineer" world-model framing is architecturally
    distinct from all incumbent offerings and most startups, but incumbents command decades of customer lock-in, hundreds of thousands of existing users, and are deploying
    agentic engineering tools now—Siemens' Eigen Engineering Agent is already production-ready for 600,000+ TIA Portal users as of April 2026.

sections:
  - id: landscape-overview
    title: Competitive Landscape Overview
    body: >
      Prometheus enters a market defined by three overlapping competitive layers. The first is the established engineering-software oligopoly—Synopsys (which completed the $35B
      acquisition of Ansys in July 2025), Autodesk, Siemens Digital Industries Software (which acquired Altair for ~$10B), Dassault Systèmes, Cadence Design Systems, and PTC.
      These incumbents collectively serve hundreds of thousands of engineering organizations with deeply embedded CAD, CAM, CAE, EDA, and PLM tools. Their switching costs are
      structurally very high: workflows, file formats, training pipelines, and regulatory validations are all tied to specific tools. All six incumbents are actively embedding
      AI—including autonomous agents—into their platforms, with Siemens' Eigen Engineering Agent (April 2026) and Autodesk's Neural CAD (announced AU 2025, limited availability)
      representing the most direct tactical responses to the agentic-engineering thesis. The second layer is NVIDIA, whose NemoClaw Blueprint reference architecture provides the
      scaffolding for any ISV to build autonomous AI engineers that compress simulation weeks into hours. By providing the enabling infrastructure, NVIDIA both competes with
      Prometheus's vision of a standalone artificial general engineer and simultaneously de-risks the market thesis. The third layer is AI-native engineering startups. PhysicsX
      is the clearest direct peer: an AI-native platform deploying Large Physics Models (LPMs) for aerospace, automotive, semiconductors, and energy, now at $2.4B valuation and
      $300M in Series C funding (June 8, 2026) with NVIDIA and Siemens as strategic backers. The status quo—human engineers supported by traditional finite element analysis (FEA)
      and computational fluid dynamics (CFD) tools running for hours to days—remains the dominant workflow and the most common substitute. Internal build (enterprise-commissioned
      surrogate model development teams) and external consultancies represent additional substitution paths. Prometheus's "artificial general engineer" framing targets the layer
      above all these: a cross-domain, world-model-grounded AI that can plan, simulate, and validate physical designs end-to-end without hand-offs, which no incumbent currently
      ships.
