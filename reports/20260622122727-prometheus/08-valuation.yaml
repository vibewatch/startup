  - id: scenario-analysis
    title: 'Scenario analysis: bull, base, and bear cases'
    body: >-
      Three scenarios are developed from the evidence available as of June 22, 2026. All three share
      the same fundamental evidence constraint: Prometheus has zero disclosed revenue, no named
      commercial customer beyond Blue Origin, and no public product benchmark. Scenario ranges
      are anchored to public comparable multiples and private AI round precedents.


      The bull case assumes Prometheus executes across three high-value initial deployments by
      late 2026 or early 2027. Blue Origin becomes a recurring paying customer rather than an
      internal testbed; select aerospace and semiconductor manufacturers sign pilot contracts
      that generate early ARR in the $200–500 million range by end-2027; and the separately
      reported $100 billion manufacturing acquisition fund closes, giving Prometheus an internally
      captive customer base that could generate additional hundreds of millions in software-and-
      services ARR. In this scenario, a 2027 ARR of $1–2 billion at a premium physical-AI
      multiple of 30–50x produces a fair value of $30–100 billion—consistent with or modestly
      above the current $41 billion mark. The bull case also assumes no down-round risk and that
      the AI private market sustains current premiums through 2027.


      The base case assumes product development proceeds but commercial adoption is slower than
      the bull case, constrained by long industrial sales cycles, data access challenges with
      proprietary manufacturer datasets, and the regulatory complexity of AI-generated engineering
      designs in FAA and FDA-governed industries. A 2027 ARR of $100–300 million at a
      compressed physical-AI multiple of 15–25x produces a fair value of $1.5–7.5 billion—
      well below the current $41 billion mark. At the current price, investors in the Series B
      are underwriting a 5–27x revenue multiple step-up from the base-case 2027 scenario
      that has no current evidentiary support.


      The bear case assumes the physical engineering automation problem proves harder to generalize
      than Bezos and Bajaj project, training data access is structurally limited by manufacturers
      unwilling to share proprietary simulation data with a potential competitor, and commercial
      deployments are delayed past 2028. In this scenario, Prometheus reaches maturity as an
      internal tool (Blue Origin, acquired manufacturers) but fails to establish a broad enterprise
      customer base. Fair value in this case is closer to $3–8 billion—roughly matching a
      well-funded industrial AI software company with strong IP but limited commercial traction.
      A down-round is possible if private AI market sentiment shifts and revenue visibility does
      not materially improve.
