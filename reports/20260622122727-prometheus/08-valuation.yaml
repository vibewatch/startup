      - - Ansys (ANSS)
        - Public — simulation software
        - Market cap / sector multiple
        - '$33B / ~4.8x NTM'
        - Physics simulation is the closest product analog to Prometheus's Large-Physics-Model ambition
        - Ansys was acquired by Synopsys in a deal terminated; trades at compressed multiple due to M&A uncertainty; Prometheus claims broader generalization than Ansys's simulation scope
      - - OpenAI
        - Private — frontier AI (language model)
        - Post-money valuation / annualized revenue / multiple
        - '$852B / $24B ARR / ~35x forward'
        - Highest-multiple private AI comparable with disclosed revenue; sets the ceiling for premium AI multiples
        - OpenAI has confirmed $24B ARR and consumer scale; Prometheus has zero revenue; applying OpenAI multiples requires a heroic revenue ramp assumption
      - - PhysicsX
