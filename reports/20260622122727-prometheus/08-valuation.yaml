  - id: TV005
    title: Thesis-break and kill triggers
    columns:
      - Trigger
      - Threshold / observable event
      - Transmission to thesis
      - Action implication
    rows:
      - - First commercial customer announcement
        - No named paying customer beyond Blue Origin disclosed by end of 2026
        - Confirms that the 'artificial general engineer' is an internal tool rather than a commercially viable product; removes primary bull-case ARR assumption
        - Revise valuation to internal-tool scenario; base-case multiple compression; re-evaluate hold
      - - Headcount contraction at 12-month mark
        - More than 15% of technical leadership departures by December 2026 from a 150-person team
        - At a 150-person company with $18.2B raised, significant technical departures signal roadmap failures or internal conflict; destroys execution credibility
        - Immediate diligence escalation; thesis-break signal if departures include co-founders or lead researchers
      - - Training data access denial
        - A major aerospace, semiconductor, or automotive OEM publicly declines Prometheus data-sharing request or competitor (Siemens, ANSYS) announces exclusive data partnership
        - Directly undermines the model-performance moat; Prometheus without proprietary training data competes on general-purpose physics simulation already covered by incumbents
        - Material thesis impairment; reassess defensibility and competitive positioning
      - - Regulatory enforcement on AI-assisted engineering
        - FAA or FDA issues adverse guidance that prevents AI-generated designs from qualifying for certification or imposes liability per-error on the AI vendor
        - Removes the highest-value use cases (aerospace components, drug compounds); forces Prometheus to retreat to low-regulation industrial applications with smaller TAM
        - Scenario compression toward base case; reassess addressable market assumptions
      - - $100B manufacturing fund fails to close
        - Reported fund stalls at less than 25% of target or Bezos publicly abandons the manufacturing acquisition strategy
        - Removes the vertically integrated captive-customer thesis; Prometheus becomes a software vendor competing for enterprise sales against entrenched incumbents
        - Downgrade bull-case probability; base case now more likely than bull
    notes: >-
      Triggers are observable from public disclosures, press reporting, and regulatory announcements.
      Timelines are indicative; specific thresholds should be set by the diligence owner.
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045

  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Financial transparency
        - Current ARR, monthly burn rate, gross margin, and projected runway at current capital deployment rate
        - Determines whether $41B is defensible at any multiple; zero of these figures are publicly available
        - Company CFO or data room; secondary sources at Forge Global or EquityZen may reflect implied marks
      - - Commercial traction
        - Named paying customers beyond Blue Origin; any signed contracts, letters of intent, or pilots with third-party manufacturers
        - Single most important variable for moving from research-more to track or buy; Blue Origin is a Bezos-affiliated entity and cannot substitute for arms-length customer proof
        - Direct company disclosure; trade press coverage of first customer announcement
      - - Cap table and preference structure
        - Liquidation preference stack, anti-dilution provisions, Series A/B term sheet terms, secondary market pricing at Forge Global or Equityzen
        - At $18.2B in total raised capital, preference overhang could significantly impair common equity returns even if enterprise value reaches $80–100B
        - Data room; secondary-market broker checks; SEC Form D for primary entity if filed
      - - Product benchmarking
        - Any third-party or published performance data comparing Prometheus AI outputs to ANSYS, Siemens NX, or other physics-simulation benchmarks
        - Bezos said it is premature to disclose what has been built; without performance data, the product differentiation claim cannot be verified
        - Academic publications, industry conference presentations, or named customer case studies
      - - $100B acquisition fund
        - Legal entity, investor commitments, targeted manufacturers, relationship to the Prometheus AI cap table, and whether fund economics create conflicts of interest
        - Fund close would confirm the vertical-integration thesis and captive-customer revenue model; fund failure narrows Prometheus to a software vendor with no captive demand
        - WSJ / Bloomberg follow-up reporting; SEC filings for the fund entity
    notes: >-
      Topics, missing evidence, and diligence paths are qualitative assessments based on public
      evidence; data room or direct company disclosure required to close most gaps.
    claimRefs:
