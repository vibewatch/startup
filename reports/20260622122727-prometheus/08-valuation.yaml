  - id: TV002
    title: Investment thesis and anti-thesis
    columns:
      - Argument
      - Type
      - What would change this view
    rows:
      - - Jeff Bezos founder premium — track record of scaling Amazon and investing in transformative companies; first formal operating role since 2021 signals deep conviction
        - Thesis
        - Material departure of Bezos from day-to-day operations
      - - Institutional capital quality — JPMorgan, BlackRock, Goldman Sachs signal infrastructure-grade demand; not purely venture speculation
        - Thesis
        - Investor withdrawals or secondary-market markdowns below Series B price
      - - Physical-AI market size — $81.4B market in 2025 growing at ~33% CAGR; far larger and more defensible TAM than pure software AI
        - Thesis
        - Market adoption slower than projections; incumbents (Siemens, ANSYS) execute AI roadmaps faster than projected
      - - Capital-intensive moat — $18.2B raised creates compute and training-data infrastructure that 150-person competitors cannot easily replicate
        - Thesis
        - Capital-intensity proves to be cash-destruction without proprietary data access, narrowing the moat
      - - Zero revenue at $41B — valuation equals Autodesk's full market cap before first commercial contract; no public product, no customer proof
        - Anti-thesis
        - First named commercial customer + signed revenue backlog disclosed
      - - Data-access dependency — proprietary manufacturer simulation data is the core training input; owners have competitive incentives not to share with Bezos
        - Anti-thesis
        - Confirmed data-sharing partnerships with aerospace or semiconductor manufacturers
      - - Regulatory complexity — FAA and FDA AI governance frameworks do not yet exist; liability for AI-generated engineering errors is uninsurable
        - Anti-thesis
        - Regulatory clarity on AI-assisted engineering design emerges with manageable liability framework
      - - Governance opacity — no public website, no SEC Form D for primary entity through late 2025, no disclosed cap table or preference stack
        - Anti-thesis
        - Prometheus files standard disclosure or investor relations materials with basic financial transparency
    notes: >-
      Thesis and anti-thesis arguments are drawn from public reporting and analysis as of 2026-06-22.
      Conviction weights are the authors' assessment, not a quantitative model.
