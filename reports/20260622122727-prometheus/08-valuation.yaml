        - Series C valuation / growth metrics
        - '$2.4B / doubled revenue YoY / $300M raised'
        - Most direct sector comparable — physics-AI for industrial engineering, backed by NVIDIA and Siemens with confirmed enterprise customers
        - Prometheus carries a 17x premium to PhysicsX; PhysicsX has disclosed revenue growth and enterprise customers; Prometheus has neither
