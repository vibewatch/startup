  - id: thesis-break-and-diligence
    title: Thesis-break triggers and final diligence asks
    body: >-
      The Prometheus investment case can be monitored through five observable trigger points.
      First, any named commercial customer announcement beyond Blue Origin would move the narrative
      from vision to execution and is the single most important near-term signal. Second,
      Prometheus's headcount at the 12-month mark (targeting December 2026): employee retention
      at a 150-person company with $18.2 billion raised, where exits would signal roadmap problems
      or internal disagreements at the leadership level. Third, any disclosed regulatory agency
      comment or guidance on AI-assisted engineering design from the FAA or FDA, which will define
      the timeline and liability framework for Prometheus's highest-value industrial use cases.
      Fourth, the status of the separate $100 billion manufacturing acquisition fund: a successful
      close and first acquisition would confirm the vertical integration thesis; failure to close
      would narrow Prometheus to an AI tools vendor without a captive customer base. Fifth,
      any data-access partnership announcement with a major manufacturer (aerospace, semiconductor,
      automotive) confirming access to the proprietary training datasets the models require.


      Final diligence asks are clustered in five areas: financial transparency (current ARR, burn
      rate, gross margin, projected runway at current spend); commercial traction (named customers
      beyond Blue Origin, any signed contracts, revenue backlog); cap table and preference stack
      (liquidation preferences, anti-dilution provisions, secondary market marks); product
      benchmarking (any third-party performance data on Prometheus AI outputs against physics
      simulations from Siemens, ANSYS, or comparable tools); and the $100 billion acquisition fund
      structure (legal entity, investor commitments, targeted manufacturers, and relationship to
      the Prometheus AI cap table).
