  - id: comparable-valuation-analysis
    title: Comparable companies and valuation multiples
    body: >-
      Prometheus's $41 billion valuation can be evaluated against two comparable sets: public
      engineering-and-design software companies that represent the market it aims to disrupt, and
      private AI companies that share its capital structure and investor expectations.


      On the public side, the design-and-engineering software sector traded at a median of 4.8x
      NTM revenue and 11.6x NTM EBITDA in June 2026, per Multiples.vc analysis. Autodesk, the
      sector's largest company by revenue, carried a market capitalization of approximately $40.92
      billion on $7.51 billion trailing revenue—an implied revenue multiple of roughly 5.5x—and
      had shed approximately 36% of its market cap over the prior twelve months, suggesting multiple
      compression rather than expansion in the traditional engineering software segment. PTC, the
      fastest-growing large-cap engineering software company with 23.6% LTM revenue growth, traded
      at a market cap of $13.25 billion on approximately $2.86 billion in revenue—a 4.6x multiple.
      Ansys, the simulation-specialist whose technology most closely resembles what Prometheus claims
      to build, carried a market capitalization of approximately $33 billion.


      At the sector median of 4.8x NTM revenue, Prometheus would need approximately $8.5 billion in
      near-term ARR to justify $41 billion—a figure that would make it larger than Autodesk's current
      revenue base before shipping a single commercial product. Applied at a premium multiple consistent
      with fast-growing vertical AI (say 15–20x), Prometheus would still need $2–2.7 billion in ARR.
      Neither figure has any public evidence behind it.


      On the private side, OpenAI closed a record $122 billion round at $852 billion valuation in
      March 2026, with confirmed $24 billion annualized revenue, implying approximately 35x forward
      ARR—the highest multiple for any AI company with disclosed revenue. PhysicsX, the most directly
      comparable private company—a physics-AI startup that has doubled recognized revenue and tripled
      booked revenue year-over-year and is backed by NVIDIA, Siemens, and Temasek—raised its Series C
      at a $2.4 billion valuation in June 2026. Prometheus carries a 17x premium to PhysicsX, its
      closest sector peer, with no disclosed revenue. The premium reflects Bezos's credibility and
      institutional capital access rather than documented technical or commercial advantage.
