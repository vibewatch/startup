callouts:
  - calloutType: risk
    title: Zero revenue at Autodesk-equivalent valuation
    body: >-
      At $41 billion, Prometheus is valued at the same level as Autodesk—a company generating
      $7.5 billion in annual recurring revenue from decades of enterprise relationships. The implied
      revenue multiple under the design-and-engineering sector median (4.8x NTM) requires Prometheus
      to generate approximately $8.5 billion in near-term ARR before its valuation is evidence-backed.
      No comparable pre-revenue AI company has sustained a mark at this revenue-requirements gap
      without either a product release or a significant multiple compression event.
    claimRefs:
      - CV015
      - CV016
      - CV034
      - CV035

  - calloutType: insight
    title: Bezos premium vs physical-AI sector comparable
    body: >-
      PhysicsX—the nearest direct competitor in physics-AI for industrial engineering—raised its
      Series C at $2.4 billion in June 2026 with disclosed doubled year-over-year revenue and
      300+ enterprise-facing employees. Prometheus carries a 17x valuation premium to PhysicsX
      with no disclosed revenue, no named customers, and 150 employees. The gap is entirely attributable
      to Bezos's founder premium and institutional investor demand—not to documented technical or
      commercial superiority. That premium may be justified if Prometheus's AGE approach proves
      far more general than PhysicsX's simulation-specific platform, but that remains entirely
      unverified as of this report date.
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV025

  - calloutType: assumption
    title: '$100B acquisition fund as key thesis enabler'
    body: >-
      The separately reported $100 billion manufacturing acquisition fund—if closed—would provide
      Prometheus with a captive customer base whose proprietary engineering data feeds model training
      and whose operational productivity gains validate the AGE thesis commercially. Without the fund,
      Prometheus competes for enterprise sales against Autodesk, Siemens, and ANSYS on the open market.
      The fund's status as of June 2026 remains unconfirmed beyond WSJ and Forbes reporting; it has
      not been officially announced or SEC-filed by Prometheus.
    claimRefs:
      - CV007
      - CV008
      - CV043

