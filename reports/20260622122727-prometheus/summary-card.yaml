  topStrengths:
    - >-
      Jeff Bezos and Vik Bajaj give Prometheus unusual founder credibility, and the Series B investor base includes
      blue-chip institutional capital rather than only venture funds.
    - >-
      The company is pursuing a real pain point—slow engineering iteration in aerospace, automotive, chip design, and
      pharma—inside markets with very large incumbent software spend.
    - >-
      More than $18B of funding can finance compute, proprietary data creation, and long commercialization cycles in a
      way most engineering-AI startups cannot match.
  topRisks:
    - >-
      Prometheus has no disclosed revenue, no public product benchmark, and no named arms-length customer despite a $41B
      valuation.
    - >-
      Execution risk is extreme because the company must prove that AI can reliably compress safety-critical engineering
      workflows without regulatory, liability, or IP failures.
    - >-
      The thesis depends heavily on Bezos/Bajaj leadership, proprietary industrial data access, and sustained compute
      intensity, all while incumbents like Autodesk, Siemens, Synopsys, and PhysicsX are advancing in parallel.
  unresolvedGaps:
    - No audited financials, revenue, pricing, gross margin, or burn data are public.
    - >-
      No independent product benchmark, deployment case study, or customer contract has been disclosed beyond Blue
      Origin as a self-referential early use case.
    - >-
      The exact product architecture, data-rights model, and regulatory readiness for safety-critical deployments remain
      private.
