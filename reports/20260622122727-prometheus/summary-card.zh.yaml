  topStrengths:
    - Jeff Bezos 和 Vik Bajaj 给 Prometheus 带来罕见的创始人可信度；Series B 投资人中有蓝筹机构资金，而不只是风险基金。
    - 公司切入的痛点真实存在：航空航天、汽车、芯片设计和医药里的工程迭代太慢，而这些市场原本就有巨额软件支出。
    - 超过 $18B 融资可以支撑算力、自研数据构建和漫长商业化周期，这是大多数工程 AI 初创公司比不了的资金厚度。
  topRisks:
    - Prometheus 估值已达 $41B，却没有披露收入、公开产品基准，也没有具名的独立客户。
    - 执行风险极高：公司必须证明 AI 能可靠压缩安全关键工程流程，同时不能踩中监管、责任或知识产权雷区。
    - 投资逻辑高度依赖 Bezos / Bajaj 领导力、自有工业数据入口和持续算力投入；与此同时，Autodesk、Siemens、Synopsys、PhysicsX 等既有玩家也在并行推进。
  unresolvedGaps:
    - 没有公开的审计财务、收入、定价、毛利率或烧钱速度数据。
    - 除了 Blue Origin 这个自我指向的早期用例外，公司没有披露独立产品基准、部署案例或客户合同。
    - 面向安全关键部署的具体产品架构、数据权利模型和监管就绪度仍未公开。
