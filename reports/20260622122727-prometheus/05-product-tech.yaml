figures:
  - id: FE001
    title: Prometheus Physical AI Stack
    type: stack
    summary: >
      Layer diagram of the Prometheus product architecture as inferred from co-CEO interviews and reporting.
      Bottom layers represent foundation model infrastructure; upper layers represent the engineering tool
      surface and agentic interface that customers would interact with. All layers are reported or inferred;
      none are officially published by Prometheus.
    approximationNotes: >-
      Architecture is inferred from CNBC, GeekWire, and Built In reporting; no official architecture
      documentation has been published. Layers and labels represent analyst reconstruction, not company disclosure.
    data:
      layers:
        - id: L1
          label: Hyperscaler Compute (AWS, multi-cloud)
          description: Large-scale GPU clusters for model training and inference
          detail: AWS reported as primary compute provider; Bezos cited massive compute investment as central to Prometheus strategy in June 2026 CNBC interview.
        - id: L2
          label: Physical-World Training Data Pipeline
          description: Proprietary generation of sensor logs, simulation outputs, materials data, telemetry
          detail: Generating physical-world data at scale is the core technical bottleneck; physical data is 100-1000x more expensive per training token than web text data.
        - id: L3
          label: Physical AI Foundation Models (World Models)
          description: Large-scale models trained on physical-world data for causality and simulation reasoning
          detail: World models learn physical causality, material behaviour, and manufacturing constraints rather than language; architecture and scale not publicly disclosed.
        - id: L4
          label: Multi-Physics Simulation Engine
          description: Thermal, mechanical, fluid, and electromagnetic simulation inference layer
          detail: AI-driven simulation replaces or augments traditional FEA/CFD tools; enables autonomous design iteration without manual simulation setup.
        - id: L5
          label: VLA Agentic Layer (Ace / General Agents)
          description: Real-time computer-control agent using video-language-action models
          detail: Based on General Agents Ace; ace-control-small and ace-control-medium models execute computer tasks via VLA architecture trained on screen demonstrations.
        - id: L6
          label: Engineering Design Interface (planned)
          description: User-facing CAD-evolution software tools for engineering simulation and design
          detail: Described by Bajaj as a "very modern version of CAD"; no product mockup or specification has been publicly released as of June 2026.
