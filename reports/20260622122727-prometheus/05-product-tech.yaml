sections:
  - id: sec-01
    title: Product Vision — The Artificial General Engineer
    body: >
      Prometheus is building what it calls an "artificial general engineer" (AGE): a suite of AI tools designed to
      dramatically compress the invention loop — the full arc from engineering ideation through design, simulation,
      prototyping, and manufacturing — for complex physical systems. Co-CEO Jeff Bezos, in his first public
      description of the company in May 2026, called the product "a very, very modern version of CAD," immediately
      adding that he was "really oversimplifying" and that the ambition is far larger. The stated target: make the
      design-to-manufacture cycle 10× faster or more.

      Bezos and co-CEO Vik Bajaj have been emphatic that Prometheus is not building robots or factory-floor
      automation. "We have nothing to do with robotics," Bezos told CNBC's Andrew Ross Sorkin on Squawk Box
      in May 2026. The company targets the upstream invention layer — the creative and analytical work that
      precedes manufacturing — not physical production systems. Bajaj frames the core insight as: "What has changed
      in the last few years is the ability to formulate even something as complicated as [a jet engine], from design
      to manufacturing, as an end-to-end AI problem."

      Bezos frames this as a civilizational bet: "All societal wealth is driven by invention… What Prometheus seeks to
      do is to offer a set of tools that dramatically accelerates that invention loop." Target domains explicitly
      named by the co-CEOs include jet engine design, spacecraft engineering, automotive systems, advanced computing
      hardware (chips), and pharmaceutical compounds — any complex physical system where long multi-disciplinary
      design cycles currently slow innovation. The Wall Street Journal reported that Prometheus initially plans to
      deliver its capabilities through software tools for engineering simulations and design.
    tableRefs:
      - TE001
    figureRefs:
      - FE001
  - id: sec-02
    title: Physical AI Architecture and World Models
    body: >
      Prometheus is building what the Built In technical analysis and other reporting describe as "world models" —
      AI systems trained explicitly on physical-world data rather than the text-and-image corpora that underpin
      large language models. A traditional LLM can describe gravity but cannot internalize the physical causality of
      how objects fall, deform, or fail under stress. World models ingest multimodal real-world inputs — sensor
      telemetry, materials properties data, manufacturing process logs, computational fluid dynamics and finite
      element analysis outputs, and structured engineering data — to generate dynamic simulations of how designs
      will behave before any physical prototype is built.

      The training stack is compute-intensive by design. Bezos stated in the June 11, 2026 CNBC interview that a
      "big chunk of the funding we've raised" is earmarked for compute, because "what we're doing is very compute
      intensive and we need to create that data." The emphasis on creating rather than merely consuming data reflects
      a synthetic-data strategy: Prometheus generates training data through simulation and real-world engineering
      experiments, not by scraping publicly available corpora. The Claru AI infrastructure analysis notes that
      physical AI training data is 100-1000× more expensive per token-equivalent to produce than web text, making
      proprietary data generation a structural requirement rather than an optimization.

      Reporting from The Wall Street Journal (via Inc and Built In) indicates that Prometheus initially plans to
      sell capabilities through engineering simulation and design software, suggesting a tool layer that wraps the
      world-model inference engine. Multi-physics simulation — predicting how a design behaves under concurrent
      thermal, mechanical, aerodynamic, and electromagnetic constraints — is cited as a key capability. Prometheus
      sources compute from multiple hyperscalers, including AWS, reflecting the scale of its inference and training
      requirements. No technical papers or model architecture disclosures had been published under the Prometheus
      name as of June 2026.
    tableRefs:
      - TE003
    figureRefs:
      - FE002
  - id: sec-03
    title: General Agents Acquisition and Agentic AI Stack
    body: >
      In November 2025, Prometheus quietly acquired General Agents, an agentic AI startup founded by Sherjil Ozair
      (ex-Google DeepMind, Tesla) and co-founded by William Guss (ex-OpenAI research scientist). The acquisition
      was confirmed by corporate filings in Delaware obtained by Wired: Bajaj formed an acquisition entity the
      morning after an off-the-record AI dinner at San Francisco's Saison restaurant, where Ozair was present, and
      the merger was executed four days later.

      General Agents had developed Ace — described as "the first realtime computer autopilot." Ace uses a
      video-language-action (VLA) model architecture to interpret visual inputs and act on natural language
      instructions in real time: a demonstration video showed Ace downloading an image from Google and sending it
      via iMessage in under 15 seconds. At least two custom foundation models power Ace: ace-control-small and
      ace-control-medium. VLA architectures are commonly used for robotics foundation models — systems that must
      perceive visual context, plan sequences of actions, and execute those actions; their extension to
      computer-control agents provides agentic automation capabilities directly applicable to engineering
      workflows. General Agents also published Showdown, a suite of offline and online benchmarks for
      computer-use agents (GitHub: generalagents/showdown), providing an independent evaluation framework.

      Founding advisors to Prometheus include Ashish Vaswani and Jakob Uszkoreit, two former Google researchers
      who co-authored the seminal 2017 "Attention Is All You Need" paper introducing the transformer architecture.
      Both continue to run their own startups while advising Prometheus. Kamyar Azizzadenesheli, former senior
      research scientist at Nvidia (specializing in physics-informed AI), also joined Prometheus early on.
      The General Agents team, now operating from Foresite Labs' San Francisco headquarters, contributes
      computer-control and agentic workflow capabilities that could extend Prometheus's tooling into automated
      engineering task execution rather than purely model-driven design generation.
    tableRefs:
      - TE002
    figureRefs:
      - FE003
  - id: sec-04
    title: Compute Infrastructure, Deployment Model, and Go-to-Market
    body: >
      Prometheus has not announced a product launch date or named any customers as of June 22, 2026. Co-CEOs
      Bezos and Bajaj told GeekWire on June 11, 2026 that "early rollouts are coming" but declined to specify
      a timeline. This is consistent with Bezos's May 2026 characterization of the work as "premature" to
      disclose in detail, though he added that progress is "really quite remarkable." The lack of a disclosed
      product timeline reflects both the inherent difficulty of building physical AI models and the company's
      deliberate operational focus, described by Bezos as "being heads down and trying to do the work."

      The company's compute infrastructure is multi-sourced. Bezos stated that Prometheus sources compute "from a
      multitude" of hyperscalers because "compute is scarce enough that you get it where you can," with AWS
      specifically confirmed as one supplier. The company's large capital base ($18.2B total raised) is in part
      a reflection of multi-year compute commitments required to train large-scale physical-world foundation
      models. Grey Journal analysis notes this mirrors the pattern of other megarounds where capital locks up
      scarce compute capacity and funds proprietary data pipeline construction, not just GPU rentals.

      The Financial Times reported in February 2026 that Bezos is separately seeking to raise a $100 billion
      fund — controlled by Prometheus — to acquire companies in AI-disrupted manufacturing sectors. Portfolio
      companies would both benefit from Prometheus's tools and feed back proprietary industrial data. This
      creates a potential vertical integration model: Prometheus as an AI-driven holding company that uses
      its physical AI stack to transform manufacturing businesses it acquires. Bezos confirmed at the June 11
      CNBC interview that Prometheus "may buy parts of companies" to help improve their manufacturing processes,
      though he characterized the $100B fund reporting as imprecise. The company has no formal ties to Amazon
      or Blue Origin and operates with structural independence.
    tableRefs:
      - TE005
    figureRefs: []
  - id: sec-05
    title: Technical Differentiation, Limitations, and Validation Status
    body: >
      Prometheus's differentiation rests on four pillars at this stage: (1) team quality — researchers from
      OpenAI, Google DeepMind, Meta, Nvidia, xAI, and Anthropic, plus transformer co-inventors as founding
      advisors; (2) founder brand — Bezos as operational co-CEO brings logistics, capital, and Amazon-era
      operational rigor; (3) capital scale — $18.2B committed makes Prometheus arguably the best-funded
      physical AI research effort globally, with the ability to fund proprietary data pipelines and compute
      that competitors cannot match; and (4) the General Agents/Ace VLA technology, which contributes real-time
      agentic computer-control capabilities to Prometheus's stack.

      The limitations are substantial and largely unresolved. Prometheus had released no public products, published
      no research papers, and disclosed no specific technical achievements as of June 2026. Bezos described
      progress as "remarkable" but termed detailed disclosure "premature." Physical engineering skeptics — as
      noted in community discussions and independent analysis — point to three persistent risks: (a) the
      sim-to-real gap, where even highly accurate multi-physics models fail to capture manufacturing tolerances,
      supply chain variability, and real-world material behavior; (b) the data bottleneck, since physical-world
      training data is orders of magnitude harder and more expensive to collect than text data, with no
      equivalent of Common Crawl for engineering; and (c) the certification and safety gap, where
      AI-generated designs for safety-critical physical systems (aerospace components, drug compounds) require
      regulatory certification pathways that do not currently incorporate AI-generated design artifacts.
      Prometheus must demonstrate not just faster design tools, but tools whose outputs can be validated,
      certified, and integrated with real manufacturing, testing, and supply chains.
    tableRefs:
      - TE004
    figureRefs:
      - FE004
