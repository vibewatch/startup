- id: capital-adequacy
  title: Capital Adequacy and Financing Dependency
  body: 'The Company Overview chapter documents Prometheus''s round-by-round funding chronology; this
    section focuses on forward capital adequacy. The short-form picture is that Prometheus holds the largest
    pre-product capital position in private AI: more than $18 billion raised since inception in November
    2025 through the June 11, 2026 Series B close. The Series B was led by Bezos alongside JPMorgan, Goldman
    Sachs, BlackRock, DST Global, and Arch Venture Partners. Bezos confirmed he participated in the new
    round as he did in the $6.2 billion Series A. At a $1–3 billion annualised burn rate, the company
    has an estimated five-to-eighteen years of runway from current capital alone — though the upper bound
    assumes burn stays near the Series A pace and the lower bound reflects a rapid scale-up of compute
    commitments. The company has declined to disclose cash on hand, monthly burn, or any budgeted use-of-funds
    breakdown beyond "compute and training data." No debt facilities, credit lines, project financing,
    or convertible notes have been publicly disclosed. Bezos said an IPO is "too early to think about,"
    framing Prometheus as a long-horizon private build. A separately reported manufacturing transformation
    vehicle targeting up to $100 billion in industrial acquisitions would create additional capital demands
    and structural complexity, but that vehicle has no confirmed close, no confirmed investors, and no
    public fundraising timeline. SEC Form D filings for several investor SPVs (Sydecar-administered series
    vehicles) were recorded in April–June 2026, confirming that at least some Series B capital was structured
    through regulated exempt offerings; the SPV amounts individually range from $310,000 to $2.5 million,
    reflecting small-check co-investors alongside the institutional round lead. No debt or project financing
    is evidenced in public filings as of June 2026.'
