- id: pricing-and-gtm
  title: Pricing Architecture and GTM Economics
  body: 'No list pricing, contract terms, or realized pricing information for Prometheus has been publicly
    disclosed. The company has not released a product page, a demo environment, or a pricing document.
    The most informative public anchor is the competitive context: Autodesk, the closest revenue-generating
    incumbent in terms of engineering software for physical design, reaches over $7 billion in annual
    recurring revenue across a multi-decade enterprise installed base. At a $41 billion post-money valuation,
    Prometheus is priced at rough Autodesk parity before commercial operations begin, which implies investors
    are pricing in faster-than- incumbent adoption, a materially higher value-per-contract pricing model,
    or both. Bajaj indicated the economic case rests on compressing multi-year engineering cycles to months
    — framing the expected willingness-to-pay as a function of the redesigned project timeline value rather
    than seat count. For the aerospace and semiconductor sectors, where a single programme development
    cycle can run $1–10 billion, even a modest share-of-savings pricing model could support multi-million-dollar
    annual contracts per customer. Customer acquisition, however, faces structural barriers: long procurement
    cycles in regulated industries, the need for proprietary design-data integration, and entrenched incumbent
    relationships with Autodesk, Siemens, and Dassault. No sales team size, CAC estimate, or channel strategy
    has been disclosed. The GTM motion has not formally launched; the company is at the partner-data-access
    stage, not the sales stage.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
