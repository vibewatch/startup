- id: cost-structure-burn
  title: Cost Structure, Capital Intensity, and Estimated Burn
  body: 'Bezos''s most concrete financial disclosure is that Prometheus is capital-intensive by design,
    and that a large portion of the Series B will fund two categories: compute infrastructure and the
    construction of specialised training data for physical-world AI. Neither cost figure has been quantified
    publicly. Drawing on comparable frontier AI labs as proxy benchmarks, a 150- person team with a $18B+
    capital base and a mandate to build proprietary compute clusters and physical-world data pipelines
    is consistent with an annualised burn rate in the $1–3 billion range. At the lower end, this implies
    monthly burn of roughly $80–100 million; at the upper end, $200–250 million per month. These estimates
    are inferred from the scale of capital raised, headcount, and comparable frontier AI lab disclosures
    — not from Prometheus disclosures. For comparison, Anthropic disclosed approximately $2.7 billion
    in operating losses for fiscal 2024 on a staff of roughly 1,000, and OpenAI has burned $5+ billion
    annually at larger scale. Prometheus''s per-headcount capital basis (~$120M per employee) is the highest
    in the sector, suggesting a large portion is allocated to compute rather than compensation. The General
    Agents acquisition in November 2025 added an undisclosed but likely modest cash component. Working
    capital and capex needs are limited — Prometheus is a software and AI lab, not a manufacturer — but
    compute procurement may involve long-term contracts with cloud providers or GPU clusters that create
    multi-year fixed-cost obligations. No gross margin target, no R&D budget breakdown, and no vendor
    contract terms have been disclosed.'
  claimRefs:
