figures:
- id: FI001
  title: Revenue Model Bridge
  type: flow
  layout: wide
  summary: How Prometheus's intended artificial-general-engineer platform converts customer activity into
    revenue — from industrial operator engagement through platform licensing and potential outcome-based
    pricing to gross profit.
  data:
    nodes:
    - id: industrial-customer
      label: Industrial Operator (Target Customer)
      detail: Aerospace, automotive, semiconductor, pharmaceutical manufacturers with long engineering
        cycles and large R&D budgets. No confirmed commercial customers as of June 2026.
    - id: data-onboarding
      label: Design Data Integration
      detail: Customer onboards proprietary engineering data (CAD files, simulation outputs, manufacturing
        telemetry) into the Prometheus platform. Data quality and access are the primary adoption barrier.
    - id: agi-platform
      label: Artificial General Engineer Platform
      detail: AI system compresses design-to-manufacturing cycle. Intended to reduce jet-engine-class
        engineering from 10+ years to months. No shipped product as of June 2026.
    - id: license-revenue
      label: Platform License Revenue
      detail: Enterprise SaaS or project-based license fee. Analogous to Autodesk ($7B+ ARR) or Siemens
        NX but targeted at higher value-per-project pricing. No list pricing disclosed.
    - id: outcome-revenue
      label: Outcome-Based Revenue (Optional)
      detail: Value-share or fee tied to measurable cycle-time savings. Speculative; no confirmed contract
        structure.
    - id: gross-profit
      label: Gross Profit (Undisclosed)
      detail: Software-layer gross margin expected in the 60–80%+ range if Prometheus scales as enterprise
        SaaS. No public margin target or disclosure.
    edges:
    - from: industrial-customer
      to: data-onboarding
    - from: data-onboarding
      to: agi-platform
    - from: agi-platform
      to: license-revenue
    - from: agi-platform
      to: outcome-revenue
    - from: license-revenue
      to: gross-profit
    - from: outcome-revenue
      to: gross-profit
  approximationNotes: All revenue nodes are projected or inferred. No commercial product has been shipped.
    Revenue mechanism is based on CEO directional statements, analyst inference, and comparable industrial
    AI companies.
