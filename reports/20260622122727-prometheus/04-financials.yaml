callouts:
- calloutType: risk
  title: Pre-Revenue $41B Valuation Is the Primary Financial Risk
  body: Prometheus is priced at rough Autodesk parity ($7B+ ARR, decades of enterprise relationships)
    before shipping a product. Independent analysts note a 17x premium to PhysicsX, the closest sector
    comparable, attributable to founder credibility rather than technical evidence. A regulatory design-failure
    event, unexpected compute competition, or inability to acquire sufficient industrial training data
    could compress the valuation materially with no revenue buffer.
  claimRefs:
  - CI031
  - CI032
  - CI033
  - CI034
- calloutType: insight
  title: Runway Is Exceptionally Long by Startup Standards
  body: At any plausible burn rate between $1B and $3B per year, Prometheus's $18.2B capital base provides
    six to eighteen years of runway. This insulates the company from near-term financing pressure and
    allows a long-horizon R&D build without conventional milestone-based gates. The trade-off is that
    investor patience horizons are untested and the long-duration bet requires sustained institutional
    commitment from JPMorgan, BlackRock, and Goldman Sachs.
  claimRefs:
  - CI022
  - CI024
  - CI025
- calloutType: assumption
  title: Burn Rate Estimates Are Analogous, Not Disclosed
  body: All burn-rate figures in this chapter are inferred from comparable frontier AI labs and capital-to-headcount
    ratios, not from Prometheus disclosures. Actual burn could be materially higher (if large-scale proprietary
    compute build has already begun) or lower (if the company is in a slower pre-launch research phase).
    Any financial model built on these estimates should assign wide uncertainty bands.
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
