- id: FI002
  title: Unit Economics Bridge
  type: flow
  layout: standard
  summary: Qualitative unit economics bridge showing the inputs Prometheus needs to establish and the
    gaps that prevent financial underwriting as of June 2026.
  data:
    nodes:
    - id: tam
      label: TAM (Industrial Engineering Software)
      detail: Estimated $300B+ total addressable market across aerospace, automotive, semiconductor, and
        pharmaceutical engineering tools. Prometheus claims to address the full design-to-manufacturing
        cycle, not a slice.
    - id: cac
      label: Customer Acquisition Cost (Unknown)
      detail: Enterprise sales cycle in regulated industries is typically 12–36 months. No sales team
        disclosed. CAC entirely undisclosed and inapplicable pre-commercial launch.
    - id: acv
      label: Annual Contract Value (Unknown)
      detail: Bezos framed value as compressing multi-year, multi-billion-dollar engineering programmes.
        ACV for comparable industrial software ranges from $1M to $50M+ per account. Not disclosed.
    - id: gross-margin
      label: Gross Margin (Undisclosed)
      detail: Software platform business expected to target 60–80%+ gross margin at scale. Outcome-based
        pricing could reduce gross margin significantly. Not disclosed.
    - id: unit-economics-unknown
      label: 'Unit Economics: Unresolvable Pre-Commercial'
      detail: LTV, payback, NRR, and CAC/LTV ratio are entirely unknown. No commercial customer exists
        to derive these metrics. All unit economics require first commercial deployment to estimate.
  approximationNotes: All nodes represent inferred or unavailable values. Prometheus has not disclosed
    any unit economics inputs. TAM range is author-estimated from third-party market reports cited in
    the Market Analysis chapter.
