  - id: u605
    title: Retention, expansion, and concentration risk
    body: "No retention, durability, or satisfaction metrics exist for Prometheus because the company has not yet commercially deployed its product or generated revenue. All standard SaaS health indicators—NRR, GRR, churn rate, contract length, cohort retention—are unavailable and cannot be estimated from public information. Diligence on retention must wait for commercial launch and will require direct customer reference calls and data room access. On the expansion dimension, the primary mechanism is the $100B industrial acquisition fund that Bezos is building, which would create a captive initial customer base rather than relying on organic enterprise sales. For individual enterprise customers, the land-and-expand model has not been described publicly; Prometheus has not disclosed any pricing structure, contract terms, or expansion metrics. The concentration risk is unusually severe: if Blue Origin becomes the first customer, Prometheus's initial revenue would flow entirely from a company controlled by the same co-founder who started Prometheus, raising independence, pricing, and governance questions. The single-customer concentration risk is extreme by any standard, and the lack of a second named potential customer makes it binary: either pilots announce in H2 2026 or the customer narrative remains entirely aspirational. Amazon's potential future engagement adds theoretical diversification but is non-contractual. The competitor benchmark (PhysicsX having doubled its customer count year-over-year to an undisclosed number) provides a useful reference for what healthy industrial AI customer growth looks like, but Prometheus starts from zero and faces a higher-risk customer acquisition path due to its broader scope and lack of a defined product."
