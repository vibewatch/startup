  - id: u603
    title: Buying motion and go-to-market model
    body: "Prometheus has not publicly disclosed a go-to-market strategy, pricing model, enterprise sales team, or customer acquisition playbook. The company has approximately 150 employees—nearly all engineers and researchers—with no visible commercial team in the public hiring record as of June 2026. The buying motion that has been signaled, however, is a data-partnership model: Prometheus plans to partner with industrial operators who share proprietary design and manufacturing data in exchange for early access to the AI tools. This is effectively a barter arrangement in which the customer's data serves as both payment and training input for better models. Bezos described this at Axios: 'There isn't an Internet of manufacturing data they can ingest'—implying the company must generate or partner to acquire proprietary simulation outputs, sensor logs, and materials data. The $100B affiliated acquisition fund adds a second distribution channel: acquiring industrial manufacturing companies outright and deploying Prometheus tools inside the acquirees, creating captive customers who simultaneously feed data into model training. This holding-company strategy—described in March 2026 WSJ reporting as analogous to a 'Berkshire Hathaway-type' model—would bypass the traditional enterprise sales cycle entirely for the first wave of deployments. Early commercial rollouts are expected in the second half of 2026, per analyst coverage, but no signed letters of intent or term sheets have been disclosed. The commercial cycle for regulated industries such as aerospace and pharma is likely to be long (2-4 years) given qualification and certification requirements."
