        - Molecule design, protein simulation, and drug manufacturing process optimization
        - Very high — global pharma R&D ~$250B; drug development averages 10–15 years
        - No named buyers; FDA approval required for clinical applications; IND/NDA process does not recognize AI design tools without validation package
