  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: customer-evidence
      missingEvidence: "Named paying customers, signed pilot agreements, or confirmed design partners are entirely absent from the public record; any such relationships are either non-existent or under NDA."
      whyItMatters: "Without a named independent customer, Prometheus's entire customer story rests on co-founder aspiration; the company's $41B valuation is unsupported by any customer traction evidence."
      diligencePath: "Request full customer and partner pipeline, including any NDA-covered LOIs, term sheets, or pilot agreements; require at least two independent industrial reference customers before any investment commitment."
      relatedQuestionRefs:
        - QU015
        - QU023
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: blocking
      topic: retention
      missingEvidence: "No revenue, ARR, NRR, GRR, churn, or customer satisfaction metrics exist because Prometheus has no commercial customers."
      whyItMatters: "Retention and durability assessment is entirely impossible at this stage; investors must underwrite a 100% pre-commercial company with no SaaS health metrics available."
      diligencePath: "Revisit at first commercial launch; benchmark initial NRR and contract structure against Autodesk (~125% NRR) and PhysicsX as the closest sector comparables."
      relatedQuestionRefs:
        - QU005
      relatedTableRefs:
        - TU004

    - type: private-evidence-only
      severity: material
      topic: 100b-fund
      missingEvidence: "The $100B industrial acquisition fund target companies and deal structure have not been disclosed; the fund has not closed as of June 2026."
      whyItMatters: "The acquisition fund is the primary stated path to a captive first-customer base and proprietary training data; without fund closure and named targets, the customer creation mechanism is unproven."
      diligencePath: "Request fund term sheet, LP list, and named acquisition pipeline; confirm fund legal separation from Prometheus Inc. entity; assess exclusive vs. non-exclusive data licensing terms."
      relatedQuestionRefs:
        - QU025

    - type: missing-source
      severity: material
      topic: regulatory-barriers
      missingEvidence: "No public regulatory guidance exists on FAA or FDA certification pathways for AI-influenced aerospace component design or pharmaceutical manufacturing processes."
      whyItMatters: "Without a clear regulatory pathway, Prometheus's aerospace and pharma segments may be gated for 3-5 years, materially reducing addressable market in the initial commercial window."
      diligencePath: "Commission independent regulatory counsel to assess FAA and FDA AI certification roadmap; interview aerospace OEM legal and regulatory teams about current AI tool certification practice; review EU AI Act product liability implications."
      relatedQuestionRefs:
        - QU022

    - type: missing-source
      severity: minor
      topic: go-to-market
      missingEvidence: "Prometheus has not disclosed a land-and-expand motion, account expansion playbook, pricing model, or enterprise sales organizational structure."
      whyItMatters: "Without a defined commercial motion, assessing customer lifetime value, expansion economics, and concentration risk is impossible; the company may not have a scalable GTM at all."
      diligencePath: "Request GTM deck, pipeline model, and enterprise sales hiring plan from Prometheus management; assess whether a commercial team has been hired or planned."
      relatedQuestionRefs:
        - QU026

