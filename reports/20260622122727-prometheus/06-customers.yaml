        - Infrastructure engineering teams at hyperscalers (AWS, Google, Microsoft, Meta); payer is capex budget
        - Chip and rack design for data centers; thermal and power optimization
        - High — hyperscaler capex expected to exceed $400B in 2026; Bezos mentioned data centers at CNBC
        - Not a formally stated segment; Amazon involvement creates conflict-of-interest optics; no named buyer
      - - Civil engineering and infrastructure (aspirational)
        - Engineering firms for bridges, buildings, and industrial plants; Bezos mentioned bridges in interviews
        - Structural design optimization and rapid prototyping
        - Medium — large but fragmented; longer sales cycles; lower willingness to pay
        - Least evidence of ICP fit; likely aspirational rather than immediate TAM
    notes: "All segments are company-stated ICP designations from public co-founder interviews; no revenue data, no named buyers, and no pricing information has been disclosed by Prometheus as of June 22, 2026."
