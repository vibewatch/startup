chapter:
  number: 6
  title: Customers
  summary: "As of June 22, 2026, Prometheus has disclosed zero commercial customers and no named design partners. The only public customer reference is Jeff Bezos's June 2026 Axios statement that Blue Origin serves as a 'case study for a customer' of Prometheus—a company-stated potential, not a signed contract. The ideal customer profile targets Fortune 500 industrial firms in aerospace, automotive, semiconductor chip design, and pharma whose multi-year engineering programs constitute the acute pain point Prometheus aims to compress. Adoption is blocked by proprietary data moats, incumbent CAD/PLM entrenchment (Autodesk, Siemens, Synopsys, Cadence), and aerospace/pharma regulatory certification requirements that could delay commercial deployment by years."

sections:
  - id: u601
    title: ICP and target customer segments
    body: "Prometheus defines its ideal customer as the large industrial organizations that build the world's most complex physical products—companies with engineering programs spanning years, budgets in the hundreds of millions of dollars, and deep pain from slow design-to-manufacturing cycles. Co-CEOs Bezos and Bajaj have publicly named four primary vertical segments: aerospace (jet engines, spacecraft, propulsion systems), automotive systems, semiconductor chip design, and pharmaceutical drug discovery. A fifth implied segment is hyperscaler data center and chip design; Bezos specifically noted at CNBC in June 2026 that Prometheus tools could help cloud operators improve their data centers, hinting that infrastructure engineering teams at Amazon, Google, and Microsoft are also within scope. In all cases, the buyer persona is the engineering team or R&D organization inside a large industrial enterprise—not factory floor operators or procurement officers. Bezos is explicit that the target is the pre-production invention loop: the design, simulation, prototyping, and optimization phase that precedes mass manufacturing. His jet engine example is illustrative: a jet engine manufacturer wanting 10% more thrust currently faces a 10-year program, not because engineers are slow, but because the multi-physics design space is intractably complex. Prometheus proposes to compress that cycle by 10x or more. Geography is implicitly global; the company's offices in San Francisco, London, and Zurich signal an international approach. No revenue banding, channel preference, or customer size threshold has been disclosed. The customer segmentation is therefore a market aspiration grounded in verified pain points, not a closed list of signed accounts."
    claimRefs:
      - CU001
      - CU002
