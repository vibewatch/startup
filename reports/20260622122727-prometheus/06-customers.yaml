  - id: u602
    title: Named customer evidence
    body: "Prometheus's public customer record consists of a single named organization—Blue Origin—cited not as a paying customer but as a 'case study for a customer of Prometheus' in Bezos's own words during a June 11, 2026 Axios interview. Blue Origin is Bezos's aerospace venture and therefore not an independent reference; the relationship is a co-founder's self-identified potential use case, not an arm's-length commercial deployment. The Inc.com report on the same day added that Bezos told The New York Times the technology could 'ultimately be used to improve processes at Blue Origin.' Beyond that, Amazon was described by Bezos at CNBC as a company that 'could work with' Prometheus—similarly aspirational and non-contractual. General Agents Inc., acquired in November 2025, is sometimes cited as a customer relationship, but it is actually a technology acquisition, not a commercial customer. No revenue, no signed contract, no deployment proof, no customer-quoted testimonial, and no third-party review of Prometheus's tools exists as of June 22, 2026. Analysts covering the company explicitly flag the initial named-customer announcement as the critical signal for validating execution; until that announcement materializes, the entire customer story rests on a single self-referential statement from the CEO. PhysicsX, Prometheus's direct competitor in physics AI for industrial engineering, by contrast had doubled its customer count year-over-year as of June 2026 and generates recognized revenue—illustrating what actual industrial AI customer traction looks like in this exact market segment. The absence of any comparable proof for Prometheus is a material gap."
