callouts:
  - calloutType: risk
    title: Zero named commercial customers at $41B valuation
    body: "Prometheus had no paying customers, no signed pilots, and no disclosed design partners as of June 22, 2026—the same month it closed a $12B Series B at a $41B post-money valuation. The $41B figure equals Autodesk's market capitalization; Autodesk generates $7B+ in annual recurring revenue from decades of customer relationships. The initial named-customer announcement is identified by analysts as the single most critical near-term execution signal. Until pilots are announced and converted to commercial contracts, the entire customer story rests on co-founder aspiration."
    claimRefs:
      - CU003
      - CU013
      - CU014
      - CU036

  - calloutType: insight
    title: Blue Origin is the only named reference—but it is not an independent customer
    body: "Jeff Bezos named Blue Origin as a 'case study for a customer of Prometheus' in his June 11, 2026 Axios interview—the only named organization in Prometheus's public customer record. Blue Origin is Bezos's own aerospace company; the reference is a co-founder projecting his company's own future demand, not an arms-length commercial validation. If Blue Origin becomes Prometheus's first customer, diligence must establish arm's-length pricing, governance separation, and independent reference checks before the relationship can serve as meaningful customer proof."
    claimRefs:
      - CU004
      - CU012
      - CU040

  - calloutType: risk
    title: Industrial data moat and regulatory certification create 3–5 year adoption delay risk
    body: "Two structural barriers could delay commercial customer acquisition by years. First, proprietary design data—the fuel Prometheus needs to train superior models—resides inside manufacturer systems that have strong competitive reasons not to share it. Tech-Insider analysis called this 'a five-year problem.' Second, FAA and FDA certification requirements for AI-influenced aerospace and pharmaceutical design could lock out two of Prometheus's four primary target segments until regulatory frameworks catch up. These barriers mean Prometheus may be commercially constrained to automotive and chip design in its first commercial window, materially narrowing near-term TAM."
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU032
      - CU034

