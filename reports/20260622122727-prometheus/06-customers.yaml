        - Vehicle component, powertrain, and chassis design acceleration
        - High — global auto R&D ~$150B; EV transition pressure intensifying design velocity demands
        - No named buyers; Siemens NX is default for automotive OEMs; ISO 26262 functional-safety certification required for AI design tools
      - - Semiconductor chip design
        - EDA and chip design teams at fabless designers (Qualcomm, AMD), IDMs (Intel), foundries (TSMC); payer is engineering budget
        - Chip design cycle compression; tapeout acceleration; data center chip optimization
