  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: product-timeline
      missingEvidence: >-
        Internal product roadmap, beta customer agreements, or first commercial-product
        announcement confirming what Prometheus has actually built and when it will ship.
      whyItMatters: >-
        Without a confirmed product or timeline, the $41 billion valuation is
        entirely forward-looking and the thesis cannot be stress-tested against
        real adoption evidence.
      diligencePath: >-
        Request product demo and roadmap from management; verify at least one
        named beta customer or data-partnership agreement with an industrial OEM.
      relatedQuestionRefs:
        - QR027
        - QR009

    - type: missing-source
      severity: material
      topic: regulatory-engagement
      missingEvidence: >-
        Confirmation of any formal regulatory-engagement programme with BIS,
        CFIUS, EU AI Act notified bodies, FAA, EASA, or FDA regarding Prometheus's
        engineering AI tools.
      whyItMatters: >-
        Absence of regulatory engagement means Prometheus could face surprise
        enforcement actions at first product deployment, particularly in regulated
        industries like aerospace or pharmaceuticals.
      diligencePath: >-
        Request from management: list of regulatory counsel engagements, any BIS
        advisory opinion on model-weight export classification, any EU AI Act
        conformity-assessment work initiated.
      relatedQuestionRefs:
        - QR021
        - QR001

    - type: missing-source
      severity: material
      topic: data-partnership
      missingEvidence: >-
        Named industrial data-sharing partnerships confirming Prometheus can access
        sufficient proprietary physical-world training data (sensor logs, test data,
        CAD repositories) to train models that generalise across its stated target domains.
      whyItMatters: >-
        Without confirmed data partnerships, Prometheus's ability to train
        domain-generalisable models is unverified; the company's moat claim rests
        entirely on proprietary data that remains undisclosed.
      diligencePath: >-
        Request data-partnership list with approximate data volumes, domain coverage,
        and exclusivity terms from management; cross-reference against target
        engineering domains.
      relatedQuestionRefs:
        - QR009

    - type: private-evidence-only
      severity: material
      topic: export-controls
      missingEvidence: >-
        BIS export-control classification opinion for Prometheus's AI model weights
        and any CFIUS analysis of the London/Zurich office structure and non-U.S.
        employee access to training data or model weights.
      whyItMatters: >-
        If Prometheus's model weights are classified under ECCN 4E091 or equivalent
        when a replacement AI Diffusion Rule is published, cross-border transfers
        to UK and Swiss employees or cloud nodes could require licenses.
      diligencePath: >-
        Retain BIS export-control specialist to classify Prometheus model weights;
        review employee nationality mix and cloud-access geography for license exposure.
      relatedQuestionRefs:
        - QR001
        - QR006

    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: >-
        Board composition, independent-director presence, equity-vesting schedules
        for key research talent, and any formal conflict-of-interest firewall between
        Prometheus and Amazon/Blue Origin.
      whyItMatters: >-
        Governance opacity in a dual-CEO, related-party-laden structure increases
        the risk of undetected strategic misalignment or fiduciary conflicts.
      diligencePath: >-
        Request board composition, D&O insurance coverage, and conflict-of-interest
        policy from management; confirm independence of at least two board members.
      relatedQuestionRefs:
        - QR014
        - QR026

    - type: stale
      severity: minor
      topic: trademark
      missingEvidence: >-
        Current USPTO status of the trademark dispute between Prometheus and the
        California lawyer with a prior application for the same name; no resolution
        has been publicly reported since December 2025.
      whyItMatters: >-
        An unresolved trademark dispute could require a further brand rename or
        licensing payment, though this is low severity compared to other risks.
      diligencePath: >-
        Search USPTO database for Trademark Application No. related to "Project
        Prometheus" or "Prometheus AI"; confirm Prometheus holds or has licensed
        the mark.
      relatedQuestionRefs:
        - QR005

    - type: enumeration-incomplete
      severity: material
      topic: data-strategy
      missingEvidence: >-
        Complete enumeration of Prometheus's industrial-domain data coverage —
        which specific engineering verticals (aerospace, automotive, semiconductor,
        pharmaceutical, civil engineering) have sufficient training data to support
        commercial model deployment.
      whyItMatters: >-
        Investors need to understand which domains will be commercially addressable
        at launch vs. which remain research-stage, to properly size the revenue onset
        and risk profile.
      diligencePath: >-
        Request domain-by-domain data inventory and model-readiness assessment from
        management; benchmark against competitor data holdings.
      relatedQuestionRefs:
        - QR009
        - QR025
      relatedTableRefs:
        - TR003

    - type: enumeration-incomplete
      severity: material
      topic: regulatory-risk-register
      missingEvidence: >-
        Complete enumeration of all applicable regulatory and legal risks facing
        Prometheus including undisclosed litigation, internal legal matters, CFIUS
        assessments, and any state-level or international regulatory proceedings
        not yet publicly reported.
      whyItMatters: >-
        The regulatory risk register (TR001) is based on publicly available information
        only; undisclosed legal or regulatory proceedings could materially change the
        risk profile and investment thesis.
      diligencePath: >-
        Request from Prometheus legal counsel: full list of ongoing or threatened
        legal proceedings, regulatory correspondence, and IP disputes; obtain
