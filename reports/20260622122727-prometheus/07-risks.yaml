callouts:
  - calloutType: risk
    title: Thesis-Break Risk — No Product Before Capital Exhaustion
    body: >-
      Prometheus has raised $18.2 billion at a $41 billion valuation with zero shipped
      product and no disclosed product timeline. If the sim-to-real technical gap proves
      harder to close than founders project, the company could require a third major
      capital raise before generating any commercial revenue. Given the compute-intensive
      cost structure and the high valuation baseline, a down-round at that stage would
      trigger talent loss, investor write-downs, and a reputational setback for the
      broader physical-AI thesis.
    claimRefs:
      - CR016
      - CR009
      - CR014

  - calloutType: risk
    title: Dual-Use Export Controls — Underappreciated Near-Term Risk
    body: >-
      Prometheus's core product — an AI model trained on physical-engineering data
      capable of accelerating the design of jet engines, semiconductors, and spacecraft —
      is a textbook dual-use technology. BIS has already imposed catch-all controls on
      model weights used for weapons-of-mass-destruction or military-intelligence end
      uses, and a replacement AI diffusion rule is forthcoming. Prometheus's London and
      Zurich offices and its recruiting of researchers from global AI labs make cross-
      border technology-transfer compliance non-trivial. Investors should treat export
      control as a near-term operational risk, not a distant regulatory scenario.
    claimRefs:
      - CR001
      - CR002
      - CR003

  - calloutType: risk
    title: Key-Person and Governance Concentration
    body: >-
      A co-CEO structure where both leaders are simultaneously managing a $100B
      acquisition fund ambition, Blue Origin recovery from a rocket explosion, and a
      pre-product AI lab with 150 employees is a governance model with limited precedent.
      Both Bezos and Bajaj are irreplaceable in the near term. No board succession
      plan, no public independent-director disclosure, and strict confidentiality
      agreements that reduce external visibility into internal culture and alignment.
    claimRefs:
      - CR021
      - CR022
      - CR024

