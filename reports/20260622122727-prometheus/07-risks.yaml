      relatedQuestionRefs:
        - QR004
        - QR005
      relatedTableRefs:
        - TR001

    - type: missing-source
      severity: material
      topic: competition
      missingEvidence: >-
        Detailed competitive analysis of physical-AI peers including World Labs
        (Fei-Fei Li), AMI Labs (Yann LeCun), Physical Intelligence, xAI physical-AI
        efforts, and ANSYS/Siemens digital-twin platforms — specifically their data
        advantages, technical capabilities, and pricing relative to Prometheus.
      whyItMatters: >-
        If a well-resourced competitor delivers a comparable product before Prometheus
        ships, the $41 billion valuation cannot be justified and first-mover advantage
        is lost.
      diligencePath: >-
        Commission independent competitive landscape analysis; conduct technical
        benchmarking of available competitor products against Prometheus's claimed
        capabilities once available.
      relatedQuestionRefs:
        - QR022

    - type: missing-source
      severity: material
      topic: burn-rate
      missingEvidence: >-
        Prometheus's actual annual burn rate, cash runway, and financial model
        assumptions including compute costs, headcount growth projections, and
        expected revenue onset timing that would inform whether $18.2 billion
        in capital is sufficient to reach commercial viability.
      whyItMatters: >-
        Without a financial model, investors cannot assess whether Prometheus
        needs a third major capital raise before shipping a product, which is
        the highest-probability scenario for a down-round or dilution event.
      diligencePath: >-
        Request audited financial statements, monthly burn rate, and 3-year
        financial model from management; validate compute costs against
        third-party GPU pricing data.
      relatedQuestionRefs:
        - QR028

