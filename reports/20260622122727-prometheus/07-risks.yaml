  - id: financial-capital
    title: Financial and Capital Risks
    body: >-
      At $41 billion valuation with no revenue and a compute-intensive pre-product
      profile, Prometheus's financial risk profile is among the most extreme in venture-
      backed technology history.

      **Valuation step-down risk.** $18.2 billion in total capital raised at a $41 billion
      pre-money valuation implies investors are pricing in a multi-billion-dollar revenue
      trajectory on a timeline that remains unconfirmed. Even Bezos acknowledged an "AI
      bubble" context. If industrial AI adoption is slower than projected, if a comparable
      tool ships from a well-resourced incumbent (Siemens, ANSYS, PTC, or a Big Tech
      lab), or if macro conditions tighten credit markets for large private rounds, a
      down-round or write-down could undermine the company's ability to retain talent
      and attract follow-on capital.

      **Compute and data OPEX burn.** Prometheus is spending large amounts of capital on
      GPU compute and physical-data generation before any product revenue. Bezos confirmed
      compute is the largest cost driver. If training runs require repeated restarts due
      to model failures or new physics-domain coverage, burn rate could exceed projections.
      The company has no disclosed revenue, no customer contracts on record, and no
      published unit economics.

      **$100 billion conglomerate ambition.** Prometheus is reportedly in discussions to
      raise a $100 billion affiliated holding fund to acquire manufacturing companies.
      If this materialises, it would transform Prometheus from an AI tools developer into
      an industrial conglomerate — introducing integration risk, capital allocation
      complexity, and regulatory scrutiny that far exceed a typical software startup.
      Failure to execute the acquisition strategy after announcing it could damage investor
      confidence and management credibility.

      **Concentration of institutional capital.** JPMorgan, Goldman Sachs, and BlackRock
      each participated in the Series B. This creates dependency on a small set of large
      institutional backers. If any of these firms face regulatory pressure, internal
      risk-committee shifts, or reputational concerns about AI governance, follow-on
      capital access could narrow rapidly.
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020

  - id: people-execution
    title: People and Execution Risks
    body: >-
      Prometheus's talent base is exceptional by venture standards — researchers from
      OpenAI, DeepMind, Meta, NVIDIA, and Anthropic — but the concentration of risk
      in two key individuals and the challenges of retaining frontier AI talent in a
      competitive market create material execution exposure.

      **Key-person concentration.** Bezos and Bajaj are co-CEOs with no disclosed
      succession plan. Bezos has simultaneously significant commitments to Amazon
      (executive chair), Blue Origin (extensive operational involvement following the
      May 2026 rocket explosion), and the Bezos Earth Fund. If Bezos were to deprioritise
      Prometheus, investor confidence and talent retention could deteriorate rapidly.
      Bajaj brings life-sciences AI and Verily-era expertise that is difficult to replace
      on a short timeline. A co-CEO structure at a 150-person stealth-mode company is
      also an unusual governance arrangement that creates potential for strategic
      misalignment.

      **Talent retention and competitive poaching.** The AI talent market in 2026 is at
      peak intensity. Prometheus competes for the same researchers as Anthropic, OpenAI,
      DeepMind, xAI, Meta FAIR, and NVIDIA Research. Compensation packages that look
      attractive at founding could be outbid by an IPO at OpenAI or a competing physical-AI
      lab. Departure of even a handful of senior research leads could undermine the model
      development roadmap.

      **Secrecy and culture risk.** Employees operate under strict confidentiality
      agreements and the company has no public website or technical publications as of
      June 2026. While stealth is a competitive tool, it can also mask internal culture
      or misalignment issues that might surface at a critical product-delivery moment.
      The recent pivot from "Project Prometheus" to "Prometheus" and the public CNBC
      appearance are early signals of growing external-communication pressure.

      **Scale mismatch.** Building an AGI-for-engineering system capable of designing
      jet engines at a certifiable quality level with 150 people is an audacious scope-
      to-headcount ratio. Comparable deep-tech companies (e.g., prior-generation aerospace
      simulation firms) required 500–2,000 engineers just for domain coverage. If
      Prometheus needs to scale headcount by 5–10x to deliver broad-domain coverage,
      the talent acquisition and integration challenge grows proportionally.
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR024
    tableRefs:
      - TR004

  - id: partner-dependency
    title: Partner and Dependency Risks
    body: >-
      Prometheus's architecture creates critical dependencies on external parties across
      compute, data, and distribution — each with distinct failure scenarios.

      **Compute-provider dependency.** Prometheus sources GPU compute from multiple
      hyperscalers including AWS (Bezos confirmed). AWS, Azure, and GCP each face their
      own GPU supply constraints driven by NVIDIA's chip production schedule and HBM
      memory availability. A shift in cloud-provider terms, export-control restrictions
      on GPU access, or hyperscaler prioritisation of their own AI workloads could
      constrain Prometheus's training capacity without warning. Prometheus has no disclosed
      owned data-center infrastructure to fall back on.

      **Industrial-data partnership risk.** Prometheus's proprietary-data strategy
      depends on industrial partners sharing sensor logs, test results, and process data.
      Partners who perceive competitive risk in sharing data (e.g., aerospace OEMs whose
      engine-design data could inform a competitor) may negotiate exclusivity requirements,
      limit data scope, or withdraw data access entirely. The absence of named data
      partnerships as of June 2026 is a material diligence gap.

      **Blue Origin/Amazon relationship and conflict-of-interest risk.** Bezos is
      executive chair at Amazon and heavily involved with Blue Origin. David Limp (Blue
      Origin CEO) sits on the Prometheus board. Bezos told CNBC it is "easy to imagine
      Prometheus being a customer of AWS." These overlapping relationships create both
      preferential access (to AWS compute, Amazon data) and potential conflicts of interest
      that could be scrutinised by regulators (antitrust, CFIUS), competing investors,
      or potential customers who do not want a Bezos-controlled entity to have access
      to their proprietary manufacturing data.

      **Acquisition integration risk.** The reported $100 billion acquisition fund would
      require Prometheus to integrate acquired manufacturing companies into its AI
      workflow — a multi-year operational challenge in sectors (aerospace, automotive,
      semiconductor) where incumbent ERP systems, union labour agreements, safety
      certification requirements, and regulatory oversight are complex and slow-moving.
    claimRefs:
      - CR025
      - CR026
      - CR027
      - CR028
    tableRefs:
      - TR003
    figureRefs:
      - FR003

  - id: mitigations-kill-criteria
    title: Mitigations and Kill Criteria
    body: >-
      Prometheus's mitigations are primarily financial (deep capital reserves) and
      reputational (Bezos brand, institutional-grade investors), but each major risk
      category has an observable trigger that, if crossed, would constitute a thesis-break
      event for investors.

      The primary strength of Prometheus's risk profile is the depth of its capital base:
      $18.2 billion provides substantial runway even under adverse compute-cost and
      timeline scenarios. Bezos's personal credibility and hands-on time commitment
      reduce — but do not eliminate — the key-person risk. The co-CEO structure with
      Bajaj provides some redundancy in day-to-day operations.

      Regulatory mitigations remain nascent. Bezos has publicly endorsed "reasonable"
      regulation and pointed to drug development and airline safety as precedents, but
      Prometheus has not disclosed any active engagement with FAA, EASA, FDA, BIS,
      CFIUS, or EU AI Act notified bodies. This is consistent with pre-product status
      but creates the risk that regulatory relationships will need to be built under
      time pressure once products begin beta deployment.

      Compute risk is partly mitigated by multi-provider sourcing (AWS plus multiple
      hyperscalers) and by Bezos's acknowledged expectation that Prometheus will be a
      large cloud customer — implying priority allocation in exchange for contract scale.
      However, no disclosed owned-infrastructure backstop exists.

      Thesis-break conditions that should be monitored as investment kill criteria include:
      Bezos or Bajaj departure before first commercial product release; any enforcement
      action or formal investigation by BIS, CFIUS, or EU DG COMP; failure to announce
      at least one named industrial data partner by end of 2026; a down-round or financing
      inability at the next capital event; model recall or safety incident in early customer
      pilots; or failure to publish any technical validation of the sim-to-real performance
      gap before series C.
    claimRefs:
      - CR029
      - CR030
      - CR031
    tableRefs:
      - TR005

