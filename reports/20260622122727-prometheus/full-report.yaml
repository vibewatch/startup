              have been publicly disclosed. Bezos said an IPO is "too early to think about," framing Prometheus as a
              long-horizon private build. A separately reported manufacturing transformation vehicle targeting up to
              $100 billion in industrial acquisitions would create additional capital demands and structural complexity,
              but that vehicle has no confirmed close, no confirmed investors, and no public fundraising timeline. SEC
              Form D filings for several investor SPVs (Sydecar-administered series vehicles) were recorded in
              April–June 2026, confirming that at least some Series B capital was structured through regulated exempt
              offerings; the SPV amounts individually range from $310,000 to $2.5 million, reflecting small-check
