      - number: '1.3'
        title: Capital base, funding history, and investors
        blocks:
          - type: paragraph
            body: >-
              Prometheus has raised capital at a pace and scale that is exceptional even by frontier AI standards. The
              company launched in November 2025 with an initial raise of $6.2 billion — one of the largest seed or
              pre-Series A rounds in technology history — with Jeff Bezos as the largest single backer. This initial
              round was not formally labeled Series A in all sources, but is treated in the press as the company's
              founding capital event.

              On June 11, 2026, the company announced a $12 billion Series B at an approximately $41 billion post-money
              valuation, in an interview with CNBC's David Faber. Investors in the Series B include JPMorgan, Goldman
              Sachs, BlackRock, DST Global, and Arch Venture Partners, per GeekWire citing Axios. Bezos again
              participated personally. Combined capital raised now exceeds $18 billion, within approximately seven
              months of founding — a funding trajectory unmatched at comparable company ages. Bezos described the
              business as "capital-intensive" and confirmed that a significant portion of funding goes to compute
              infrastructure and proprietary training data creation.

              A separate and still-emerging capital story is the affiliated holding company strategy. In February 2026,
              the Financial Times reported that Prometheus was seeking "tens of billions" to establish a holding vehicle
              that would acquire traditional industrial companies Bezos and Bajaj expect to be disrupted by industrial
              AI. Bezos confirmed on June 11 that Prometheus "may buy parts of companies" and help them improve
              manufacturing. The scale of this potential is unconfirmed and details remain sparse, but if realised it
              would substantially expand Prometheus's financial footprint and strategic complexity. No IPO discussions
              are active; Bezos called it "too early to think about that."
