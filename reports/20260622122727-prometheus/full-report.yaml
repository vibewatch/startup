      - number: '7.6'
        title: Mitigations and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Prometheus's mitigations are primarily financial (deep capital reserves) and reputational (Bezos brand,
              institutional-grade investors), but each major risk category has an observable trigger that, if crossed,
              would constitute a thesis-break event for investors.

              The primary strength of Prometheus's risk profile is the depth of its capital base: $18.2 billion provides
              substantial runway even under adverse compute-cost and timeline scenarios. Bezos's personal credibility
              and hands-on time commitment reduce — but do not eliminate — the key-person risk. The co-CEO structure
              with Bajaj provides some redundancy in day-to-day operations.

              Regulatory mitigations remain nascent. Bezos has publicly endorsed "reasonable" regulation and pointed to
              drug development and airline safety as precedents, but Prometheus has not disclosed any active engagement
              with FAA, EASA, FDA, BIS, CFIUS, or EU AI Act notified bodies. This is consistent with pre-product status
              but creates the risk that regulatory relationships will need to be built under time pressure once products
              begin beta deployment.

              Compute risk is partly mitigated by multi-provider sourcing (AWS plus multiple hyperscalers) and by
              Bezos's acknowledged expectation that Prometheus will be a large cloud customer — implying priority
              allocation in exchange for contract scale. However, no disclosed owned-infrastructure backstop exists.

              Thesis-break conditions that should be monitored as investment kill criteria include: Bezos or Bajaj
              departure before first commercial product release; any enforcement action or formal investigation by BIS,
              CFIUS, or EU DG COMP; failure to announce at least one named industrial data partner by end of 2026; a
              down-round or financing inability at the next capital event; model recall or safety incident in early
              customer pilots; or failure to publish any technical validation of the sim-to-real performance gap before
              series C.
            claimRefs:
              - CR029
              - CR030
              - CR031
          - type: table
            tableRef: TR005
            claimRefs:
              - CR029
              - CR030
              - CR031
      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-Break Risk — No Product Before Capital Exhaustion
            body: >-
              Prometheus has raised $18.2 billion at a $41 billion valuation with zero shipped product and no disclosed
              product timeline. If the sim-to-real technical gap proves harder to close than founders project, the
              company could require a third major capital raise before generating any commercial revenue. Given the
              compute-intensive cost structure and the high valuation baseline, a down-round at that stage would trigger
              talent loss, investor write-downs, and a reputational setback for the broader physical-AI thesis.
            calloutType: risk
            claimRefs:
              - CR016
              - CR009
              - CR014
          - type: callout
            title: Dual-Use Export Controls — Underappreciated Near-Term Risk
            body: >-
              Prometheus's core product — an AI model trained on physical-engineering data capable of accelerating the
              design of jet engines, semiconductors, and spacecraft — is a textbook dual-use technology. BIS has already
              imposed catch-all controls on model weights used for weapons-of-mass-destruction or military-intelligence
              end uses, and a replacement AI diffusion rule is forthcoming. Prometheus's London and Zurich offices and
              its recruiting of researchers from global AI labs make cross- border technology-transfer compliance
              non-trivial. Investors should treat export control as a near-term operational risk, not a distant
              regulatory scenario.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Key-Person and Governance Concentration
            body: >-
              A co-CEO structure where both leaders are simultaneously managing a $100B acquisition fund ambition, Blue
              Origin recovery from a rocket explosion, and a pre-product AI lab with 150 employees is a governance model
              with limited precedent. Both Bezos and Bajaj are irreplaceable in the near term. No board succession plan,
              no public independent-director disclosure, and strict confidentiality agreements that reduce external
              visibility into internal culture and alignment.
            calloutType: risk
            claimRefs:
              - CR021
              - CR022
              - CR024
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and current financing context
        blocks:
          - type: paragraph
            body: >-
              Prometheus announced its $12 billion Series B on June 11, 2026, at a post-money valuation of approximately
              $41 billion, the largest single-round bet on physical AI in history. The company launched in November 2025
              with a $6.2 billion Series A at a valuation of approximately $30 billion, meaning the business reached $41
              billion in roughly seven months—a $3 billion markup in the final seven weeks alone (from $38 billion in
              April to $41 billion at close). Investors in the Series B include JPMorgan Chase, BlackRock, Goldman
              Sachs, DST Global, Arch Venture Partners, and Bezos himself, blending institutional capital with venture
              at a stage that is unusual for a 150-person company with no disclosed commercial product.


              The investment thesis rests on four pillars. First, founder premium: Jeff Bezos, whose track record
              scaling Amazon from e-commerce to cloud infrastructure is the most documented value-creation story in
              technology history, is serving as co-CEO—his first formal operating role since leaving Amazon in 2021. Vik
              Bajaj, co-CEO and former Verily co-founder, brings domain credibility in applying AI to complex physical
              systems. Second, market size: the physical AI market was valued at approximately $81.4 billion in 2025 and
              is projected to grow at approximately 33% CAGR through 2035, giving Prometheus a genuinely large
              opportunity if its technology performs. Third, compute capital allocation: a substantial portion of the
              $18.2 billion raised will fund compute and specialized training data, creating an infrastructure moat that
              mirrors how Anthropic and OpenAI have defended their model positions through capital-intensive
              pre-training. Fourth, institutional signal: JPMorgan, BlackRock, and Goldman Sachs treating industrial AI
              as infrastructure-grade investment—rather than venture speculation—is a qualitative signal that the
              category is developing real institutional demand.


              The anti-thesis is equally forceful. Prometheus has shipped no product, has no disclosed revenue, and has
              only Blue Origin—Bezos's own space venture—as a named early customer or internal testbed. The company does
              not have a public website. The $41 billion valuation equals Autodesk's entire market capitalization on
              $7.5 billion annual recurring revenue; Prometheus carries that mark before day one of commercial
              operations. Critically, the valuation climbed $3 billion in seven weeks with no disclosed capability
              release, customer win, or product benchmark in between. Fast Company noted the absence of SEC Form D
              filings for the primary Prometheus entity through late 2025, raising early governance transparency
              questions that have not fully resolved. Adverse analysis from Angel Investors Network argues that the $41
              billion represents hope, not proven execution, and that the comparison to Autodesk's market cap is not a
              valuation anchor but a cautionary benchmark—Autodesk required decades of enterprise relationship-building
              to reach that market value.
