      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Prometheus is led by two co-founders who serve as co-CEOs: Jeff Bezos and Vikram "Vik" Bajaj. Bezos, the
              founder of Amazon and its executive chairman and largest individual shareholder, stepped down as Amazon
              CEO in July 2021. Prometheus is his first operational CEO role since that departure. He has described
              becoming "so impressed by what was happening and the potential that I decided I couldn't sit on the
              sidelines and I needed to jump in with both feet," having begun as a founding investor in late 2024 before
              assuming the co-CEO title. His participation gives Prometheus extraordinary access to capital, engineering
              networks, and executive credibility, but also creates a key-person dependency profile that warrants
              ongoing diligence — particularly given concurrent leadership roles at Blue Origin.

              Bajaj brings scientific and operational depth. He is MIT-trained as a chemist and physicist, was a
              co-founder of Verily (Alphabet's life sciences unit, previously Google Life Sciences), led Foresite Labs
              (an AI incubator within Foresite Capital), and holds academic affiliations at Stanford. His background
              spans both advanced scientific research and AI-forward company building, lending Prometheus a pedigree
              that differs from pure software AI startups. The co-CEO structure shared between Bezos and Bajaj creates a
              complementary division: Bezos handles capital strategy and public-facing commercial vision, while Bajaj
              provides scientific and technical leadership.

              Below the co-CEO level, Prometheus has approximately 150 employees as of June 2026, including researchers
              and engineers recruited from OpenAI, Google DeepMind, Meta, and Nvidia. A notable hire is Kyle Kosic, an
              OpenAI and xAI alumnus. The company also expanded its team through the November 2025 acquisition of
              General Agents, an agentic AI startup. Board composition and formal governance documents have not been
              publicly disclosed; no independent board member names are public. This is a material governance gap for
              diligence. Prometheus has asserted that the company has no corporate ties to Amazon or Blue Origin.
