              at Amazon, Google, and Microsoft are also within scope. In all cases, the buyer persona is the engineering
              team or R&D organization inside a large industrial enterprise—not factory floor operators or procurement
              officers. Bezos is explicit that the target is the pre-production invention loop: the design, simulation,
              prototyping, and optimization phase that precedes mass manufacturing. His jet engine example is
              illustrative: a jet engine manufacturer wanting 10% more thrust currently faces a 10-year program, not
              because engineers are slow, but because the multi-physics design space is intractably complex. Prometheus
              proposes to compress that cycle by 10x or more. Geography is implicitly global; the company's offices in
              San Francisco, London, and Zurich signal an international approach. No revenue banding, channel
