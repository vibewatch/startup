      - number: '3.2'
        title: Incumbent Engineering Software Vendors
        blocks:
          - type: paragraph
            body: >
              The engineering software incumbents each hold powerful positional advantages in their sub-markets and are
              moving aggressively into AI. Synopsys, after completing the $35B acquisition of Ansys (July 2025),
              controls the combined EDA + multiphysics simulation stack that chipmakers and system engineers depend on
              daily. Its AI portfolio—DSO.ai for digital implementation, TSO.ai for semiconductor test, ASO.ai for
              analog design, and a Microsoft-backed Copilot product—represents substantial head-start on AI-assisted
              workflows within the semiconductor design cycle. The Synopsys+Ansys combination also spans structural,
              fluid, and electromagnetic simulation domains that overlap with what Prometheus calls "artificial general
              engineering."

              Autodesk (FY2026 revenue $7.21B, 14,300 employees) is the dominant incumbent for mechanical and
              architectural CAD/CAM/CAE. Its Fusion 360 platform serves 4.6 million professionals and its Neural CAD
              initiative—announced at AU 2025 and aimed at automating 80-90% of routine design tasks using an
              auto-regressive transformer generating parametric BREP geometry—directly competes with Prometheus's
              software channel. In February 2026, Autodesk invested $200M in World Labs (Fei-Fei Li's spatial
              intelligence startup), signaling its intent to own physical-world AI at the design layer.

              Siemens Digital Industries Software has responded most aggressively to the agentic-engineering moment. In
              April 2026, Siemens unveiled the Eigen Engineering Agent at Hannover Messe—commercially available to
              600,000+ TIA Portal users—which autonomously plans, writes automation code, configures systems, and
              iterates until benchmarks are met, claiming 2-5x faster execution and up to 50% greater engineering
              efficiency than manual workflows. Siemens also acquired Altair (~$10B) and has €1B committed to industrial
              AI, with NVIDIA as a strategic partner. Dassault Systèmes' 3DEXPERIENCE platform anchors aerospace and
              automotive design at the high end with CATIA and virtual twin experiences; Cadence ($5.30B revenue, 2025)
              is expanding beyond EDA into multiphysics via its acquisition of Hexagon's MSC Software business
              (announced September 2025 at $3.16B) and its Millennium Platform digital-twin supercomputer. PTC ($2.74B
              revenue, 2025) competes in mechanical CAD+PLM via Creo and ThingWorx IoT.
