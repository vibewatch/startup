              run $1–10 billion, even a modest share-of-savings pricing model could support multi-million-dollar annual
              contracts per customer. Customer acquisition, however, faces structural barriers: long procurement cycles
              in regulated industries, the need for proprietary design-data integration, and entrenched incumbent
              relationships with Autodesk, Siemens, and Dassault. No sales team size, CAC estimate, or channel strategy
