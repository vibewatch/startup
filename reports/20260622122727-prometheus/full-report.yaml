  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Vision — The Artificial General Engineer
        blocks:
          - type: paragraph
            body: >
              Prometheus is building what it calls an "artificial general engineer" (AGE): a suite of AI tools designed
              to dramatically compress the invention loop — the full arc from engineering ideation through design,
              simulation, prototyping, and manufacturing — for complex physical systems. Co-CEO Jeff Bezos, in his first
              public description of the company in May 2026, called the product "a very, very modern version of CAD,"
              immediately adding that he was "really oversimplifying" and that the ambition is far larger. The stated
              target: make the design-to-manufacture cycle 10× faster or more.

              Bezos and co-CEO Vik Bajaj have been emphatic that Prometheus is not building robots or factory-floor
              automation. "We have nothing to do with robotics," Bezos told CNBC's Andrew Ross Sorkin on Squawk Box in
              May 2026. The company targets the upstream invention layer — the creative and analytical work that
              precedes manufacturing — not physical production systems. Bajaj frames the core insight as: "What has
              changed in the last few years is the ability to formulate even something as complicated as [a jet engine],
              from design to manufacturing, as an end-to-end AI problem."

              Bezos frames this as a civilizational bet: "All societal wealth is driven by invention… What Prometheus
              seeks to do is to offer a set of tools that dramatically accelerates that invention loop." Target domains
              explicitly named by the co-CEOs include jet engine design, spacecraft engineering, automotive systems,
              advanced computing hardware (chips), and pharmaceutical compounds — any complex physical system where long
              multi-disciplinary design cycles currently slow innovation. The Wall Street Journal reported that
              Prometheus initially plans to deliver its capabilities through software tools for engineering simulations
              and design.
