      - number: '7.5'
        title: Partner and Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Prometheus's architecture creates critical dependencies on external parties across compute, data, and
              distribution — each with distinct failure scenarios.

              **Compute-provider dependency.** Prometheus sources GPU compute from multiple hyperscalers including AWS
              (Bezos confirmed). AWS, Azure, and GCP each face their own GPU supply constraints driven by NVIDIA's chip
              production schedule and HBM memory availability. A shift in cloud-provider terms, export-control
              restrictions on GPU access, or hyperscaler prioritisation of their own AI workloads could constrain
              Prometheus's training capacity without warning. Prometheus has no disclosed owned data-center
              infrastructure to fall back on.

              **Industrial-data partnership risk.** Prometheus's proprietary-data strategy depends on industrial
              partners sharing sensor logs, test results, and process data. Partners who perceive competitive risk in
              sharing data (e.g., aerospace OEMs whose engine-design data could inform a competitor) may negotiate
              exclusivity requirements, limit data scope, or withdraw data access entirely. The absence of named data
              partnerships as of June 2026 is a material diligence gap.

              **Blue Origin/Amazon relationship and conflict-of-interest risk.** Bezos is executive chair at Amazon and
              heavily involved with Blue Origin. David Limp (Blue Origin CEO) sits on the Prometheus board. Bezos told
              CNBC it is "easy to imagine Prometheus being a customer of AWS." These overlapping relationships create
              both preferential access (to AWS compute, Amazon data) and potential conflicts of interest that could be
              scrutinised by regulators (antitrust, CFIUS), competing investors, or potential customers who do not want
              a Bezos-controlled entity to have access to their proprietary manufacturing data.

              **Acquisition integration risk.** The reported $100 billion acquisition fund would require Prometheus to
              integrate acquired manufacturing companies into its AI workflow — a multi-year operational challenge in
              sectors (aerospace, automotive, semiconductor) where incumbent ERP systems, union labour agreements,
              safety certification requirements, and regulatory oversight are complex and slow-moving.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
