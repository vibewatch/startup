chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and product
        blocks:
          - type: paragraph
            body: >-
              Prometheus is a US-based artificial intelligence startup incorporated in November 2025 under the name
              "Project Prometheus," which it shortened to "Prometheus" in 2026. The company is headquartered in San
              Francisco, California, with operational offices in London and Zurich. Its founders describe the venture as
              building an "artificial general engineer" — a set of AI tools designed to automate and radically compress
              the full engineering workflow from initial concept through simulation, prototyping, and into
              manufacturable product.

              The product thesis is deliberately sweeping. Bezos and Bajaj articulate the target as any complex physical
              system where human engineering cycles are measured in years rather than months: jet engines, semiconductor
              manufacturing equipment (citing ASML as an exemplar), automotive powertrains, solar cell manufacturing,
              battery technology, civil engineering structures, aerospace components, and pharmaceutical compounds. The
              company is explicit that its AI is not aimed at software engineering and does not build robots; rather,
              the tools are intended to make existing human engineers orders-of-magnitude more productive by replacing
              or accelerating multidisciplinary simulation, design iteration, and physical validation.

              Prometheus distinguishes its approach from large language models by arguing that physical AI requires
              proprietary training data derived from real-world experiments, simulations, and manufacturing processes —
              not the internet-scale text corpus that underlies LLMs. As Bezos put it in the CNBC interview on June 11,
              2026: "We have to create our data sets ... the training data is completely different from what the LLMs
              that you're accustomed to have access to." This positions the company's data-creation strategy as its
              primary moat claim. As of June 2026, the company has not publicly released any product, has no known
              commercial customers, and describes only internal benchmarks as evidence of technical progress.
