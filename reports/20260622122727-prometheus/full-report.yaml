            body: >-
              The Company Overview chapter documents Prometheus's round-by-round funding chronology; this section
              focuses on forward capital adequacy. The short-form picture is that Prometheus holds the largest
              pre-product capital position in private AI: more than $18 billion raised since inception in November 2025
              through the June 11, 2026 Series B close. The Series B was led by Bezos alongside JPMorgan, Goldman Sachs,
              BlackRock, DST Global, and Arch Venture Partners. Bezos confirmed he participated in the new round as he
              did in the $6.2 billion Series A. At a $1–3 billion annualised burn rate, the company has an estimated
