  - id: TV005
    title: Thesis-break and kill triggers
    columns:
      - Trigger
      - Threshold / observable event
      - Transmission to thesis
      - Action implication
    rows:
      - - First commercial customer announcement
        - No named paying customer beyond Blue Origin disclosed by end of 2026
        - >-
          Confirms that the 'artificial general engineer' is an internal tool rather than a commercially viable product;
          removes primary bull-case ARR assumption
        - Revise valuation to internal-tool scenario; base-case multiple compression; re-evaluate hold
      - - Headcount contraction at 12-month mark
        - More than 15% of technical leadership departures by December 2026 from a 150-person team
        - >-
          At a 150-person company with $18.2B raised, significant technical departures signal roadmap failures or
          internal conflict; destroys execution credibility
        - Immediate diligence escalation; thesis-break signal if departures include co-founders or lead researchers
      - - Training data access denial
        - >-
          A major aerospace, semiconductor, or automotive OEM publicly declines Prometheus data-sharing request or
          competitor (Siemens, ANSYS) announces exclusive data partnership
        - >-
          Directly undermines the model-performance moat; Prometheus without proprietary training data competes on
          general-purpose physics simulation already covered by incumbents
        - Material thesis impairment; reassess defensibility and competitive positioning
      - - Regulatory enforcement on AI-assisted engineering
        - >-
          FAA or FDA issues adverse guidance that prevents AI-generated designs from qualifying for certification or
          imposes liability per-error on the AI vendor
        - >-
          Removes the highest-value use cases (aerospace components, drug compounds); forces Prometheus to retreat to
          low-regulation industrial applications with smaller TAM
        - Scenario compression toward base case; reassess addressable market assumptions
      - - $100B manufacturing fund fails to close
        - >-
          Reported fund stalls at less than 25% of target or Bezos publicly abandons the manufacturing acquisition
          strategy
        - >-
          Removes the vertically integrated captive-customer thesis; Prometheus becomes a software vendor competing for
          enterprise sales against entrenched incumbents
        - Downgrade bull-case probability; base case now more likely than bull
    notes: >-
      Triggers are observable from public disclosures, press reporting, and regulatory announcements. Timelines are
      indicative; specific thresholds should be set by the diligence owner.
