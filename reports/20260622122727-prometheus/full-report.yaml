              are pricing in faster-than- incumbent adoption, a materially higher value-per-contract pricing model, or
              both. Bajaj indicated the economic case rests on compressing multi-year engineering cycles to months —
              framing the expected willingness-to-pay as a function of the redesigned project timeline value rather than
