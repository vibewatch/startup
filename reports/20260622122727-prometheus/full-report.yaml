      - number: '2.3'
        title: Buyer and segment map
        blocks:
          - type: paragraph
            body: >-
              Engineering software buyer patterns are well-documented across the incumbent market and provide the best
              available proxy for Prometheus. Mordor Intelligence reports that automotive and transportation is the
              largest PLM end-user industry with 26.86% of revenue in 2025, while electronics and high-tech is the
              fastest-growing PLM segment at 9.56% CAGR. Grand View Research notes that aerospace, defense, and
              automotive are the dominant simulation software buyers, citing Airbus and Boeing as early adopters.
              Fortune Business Insights identifies automotive, aerospace and defense, and industrial machinery and
              manufacturing as the leading end-user industries for generative AI in product design.


              The aerospace and defense vertical is structurally significant. PwC's June 2026 Annual A&D Report states
              that the top 100 A&D companies' collective revenue crossed $1 trillion for the first time in 2025,
              commercial aircraft backlogs reached nearly 15,000 units, and defense backlogs grew more than 50% in three
              years. Fitch Ratings confirmed in December 2025 that Boeing/Airbus backlogs exceeded 15,300 aircraft and
              that U.S. and European defense spending would remain strong through 2026. The U.S. DoD requested $179.1
              billion for R&D in FY2026. Aerospace companies have historically been the largest buyers of PLM and
              simulation software — the Mordor data confirms that aerospace and defense is the sector with the strongest
              long-term digital thread driver.


              Budget ownership in industrial engineering typically sits with the chief technology officer or VP of
              engineering for platform-level purchases, program managers for project-level tools, and central IT and
              procurement for enterprise-wide licensing. Bain's survey finds that shortening time-to-market is a top
              priority for 73% of CTOs and that incorporating novel technologies is a key priority for 70%. For
              Prometheus, the most credible first buyers are likely the same Tier-1 aerospace, defense, and
              advanced-manufacturing OEMs who already spend the most on engineering software — including Blue Origin,
              which Bezos has acknowledged as an initial beneficiary. Pharmaceutical and semiconductor buyers represent
              a secondary segment with large R&D budgets but different regulatory and data-governance requirements.
