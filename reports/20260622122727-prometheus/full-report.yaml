      - CV009
      - CV011
      - CV034
      - CV035
  - id: FV002
    title: Prometheus implied fair value under revenue and multiple assumptions
    type: bar
    layout: wide
    summary: >-
      Shows implied fair values (USD billions) under different ARR scenarios and sector multiples; the current $41B
      Series B mark is shown for reference, illustrating how far it sits above all base-case scenarios.
    data:
      items:
        - label: $100M ARR × 4.8x (sector median)
          value: 0.5
        - label: $300M ARR × 4.8x (sector median)
          value: 1.4
        - label: $1B ARR × 4.8x (sector median)
          value: 4.8
        - label: $1B ARR × 35x (OpenAI premium)
          value: 35
        - label: $2B ARR × 35x (OpenAI premium)
          value: 70
        - label: Series B reference valuation (zero ARR)
          value: 41
    approximationNotes: >-
      ARR scenarios are directional; no public revenue data exists for Prometheus. Sector median (4.8x) from
      Multiples.vc June 2026 design-and-engineering category. OpenAI premium (35x) from CNBC March 2026 confirmed
      revenue and valuation. All values in USD billions.
    claimRefs:
      - CV015
      - CV016
      - CV019
      - CV020
      - CV030
      - CV031
  - id: FV003
    title: Valuation and return range across scenarios
    type: range
    layout: standard
    summary: >-
      Bull, base, and bear valuation ranges for Prometheus derived from scenario assumptions and comparable-set
      multiples; illustrates the wide dispersion between the Series B mark and the evidence-constrained base and bear
      cases.
    data:
      items:
        - label: Bull (2027 ARR $1–2B, 30–50x premium multiple)
          low: 30
          high: 100
        - label: Base (2027 ARR $100–300M, 15–25x compressed multiple)
          low: 1.5
          high: 7.5
        - label: Bear (minimal commercial traction, compute/IP floor)
          low: 3
          high: 8
        - label: Series B reference valuation (June 2026)
          low: 40
          high: 42
    approximationNotes: >-
      Ranges are directional, not price targets. Bull scenario requires multiple simultaneous commercial wins before
      product has been publicly demonstrated. Base scenario is consistent with typical industrial AI adoption timelines.
      All values in USD billions.
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: FV004
    title: Investment committee scoring across dimensions
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring of Prometheus across eight dimensions from 0–10; reflects public-evidence quality and highlights
      the gap between structural attractiveness and financial verifiability.
    data:
      items:
        - label: Market Opportunity
          value: 9
          unit: /10
        - label: Founder / Team Credibility
          value: 9
          unit: /10
        - label: Institutional Investor Quality
          value: 8
          unit: /10
        - label: Competitive Moat (Pre-Product)
          value: 5
          unit: /10
        - label: Revenue Visibility
          value: 1
          unit: /10
        - label: Product Traction
          value: 1
          unit: /10
        - label: Valuation Risk-Adjustment
          value: 2
          unit: /10
        - label: Governance and Disclosure Quality
          value: 3
          unit: /10
    approximationNotes: >-
      Scores are qualitative assessments based on public evidence reviewed for this chapter. Revenue Visibility and
      Product Traction are low due to total absence of any Prometheus financial or product disclosure. Valuation
      Risk-Adjustment reflects the premium implied by the $41B Series B against comparable evidence. Competitive Moat
      reflects structural advantages (capital, team) partially offset by unresolved data-access challenge.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV011
      - CV034
      - CV035
      - CV036
