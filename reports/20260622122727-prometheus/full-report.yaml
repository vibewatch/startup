      - number: '7.3'
        title: Financial and Capital Risks
        blocks:
          - type: paragraph
            body: >-
              At $41 billion valuation with no revenue and a compute-intensive pre-product profile, Prometheus's
              financial risk profile is among the most extreme in venture- backed technology history.

              **Valuation step-down risk.** $18.2 billion in total capital raised at a $41 billion pre-money valuation
              implies investors are pricing in a multi-billion-dollar revenue trajectory on a timeline that remains
              unconfirmed. Even Bezos acknowledged an "AI bubble" context. If industrial AI adoption is slower than
              projected, if a comparable tool ships from a well-resourced incumbent (Siemens, ANSYS, PTC, or a Big Tech
              lab), or if macro conditions tighten credit markets for large private rounds, a down-round or write-down
              could undermine the company's ability to retain talent and attract follow-on capital.

              **Compute and data OPEX burn.** Prometheus is spending large amounts of capital on GPU compute and
              physical-data generation before any product revenue. Bezos confirmed compute is the largest cost driver.
              If training runs require repeated restarts due to model failures or new physics-domain coverage, burn rate
              could exceed projections. The company has no disclosed revenue, no customer contracts on record, and no
              published unit economics.

              **$100 billion conglomerate ambition.** Prometheus is reportedly in discussions to raise a $100 billion
              affiliated holding fund to acquire manufacturing companies. If this materialises, it would transform
              Prometheus from an AI tools developer into an industrial conglomerate — introducing integration risk,
              capital allocation complexity, and regulatory scrutiny that far exceed a typical software startup. Failure
              to execute the acquisition strategy after announcing it could damage investor confidence and management
              credibility.

              **Concentration of institutional capital.** JPMorgan, Goldman Sachs, and BlackRock each participated in
              the Series B. This creates dependency on a small set of large institutional backers. If any of these firms
              face regulatory pressure, internal risk-committee shifts, or reputational concerns about AI governance,
              follow-on capital access could narrow rapidly.
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
      - number: '7.4'
        title: People and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Prometheus's talent base is exceptional by venture standards — researchers from OpenAI, DeepMind, Meta,
              NVIDIA, and Anthropic — but the concentration of risk in two key individuals and the challenges of
              retaining frontier AI talent in a competitive market create material execution exposure.

              **Key-person concentration.** Bezos and Bajaj are co-CEOs with no disclosed succession plan. Bezos has
              simultaneously significant commitments to Amazon (executive chair), Blue Origin (extensive operational
              involvement following the May 2026 rocket explosion), and the Bezos Earth Fund. If Bezos were to
              deprioritise Prometheus, investor confidence and talent retention could deteriorate rapidly. Bajaj brings
              life-sciences AI and Verily-era expertise that is difficult to replace on a short timeline. A co-CEO
              structure at a 150-person stealth-mode company is also an unusual governance arrangement that creates
              potential for strategic misalignment.

              **Talent retention and competitive poaching.** The AI talent market in 2026 is at peak intensity.
              Prometheus competes for the same researchers as Anthropic, OpenAI, DeepMind, xAI, Meta FAIR, and NVIDIA
              Research. Compensation packages that look attractive at founding could be outbid by an IPO at OpenAI or a
              competing physical-AI lab. Departure of even a handful of senior research leads could undermine the model
              development roadmap.

              **Secrecy and culture risk.** Employees operate under strict confidentiality agreements and the company
              has no public website or technical publications as of June 2026. While stealth is a competitive tool, it
              can also mask internal culture or misalignment issues that might surface at a critical product-delivery
              moment. The recent pivot from "Project Prometheus" to "Prometheus" and the public CNBC appearance are
              early signals of growing external-communication pressure.

              **Scale mismatch.** Building an AGI-for-engineering system capable of designing jet engines at a
              certifiable quality level with 150 people is an audacious scope- to-headcount ratio. Comparable deep-tech
              companies (e.g., prior-generation aerospace simulation firms) required 500–2,000 engineers just for domain
              coverage. If Prometheus needs to scale headcount by 5–10x to deliver broad-domain coverage, the talent
              acquisition and integration challenge grows proportionally.
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
