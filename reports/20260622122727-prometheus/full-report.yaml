  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Financial transparency
        - Current ARR, monthly burn rate, gross margin, and projected runway at current capital deployment rate
        - Determines whether $41B is defensible at any multiple; zero of these figures are publicly available
        - Company CFO or data room; secondary sources at Forge Global or EquityZen may reflect implied marks
      - - Commercial traction
        - >-
          Named paying customers beyond Blue Origin; any signed contracts, letters of intent, or pilots with third-party
          manufacturers
        - >-
          Single most important variable for moving from research-more to track or buy; Blue Origin is a
          Bezos-affiliated entity and cannot substitute for arms-length customer proof
        - Direct company disclosure; trade press coverage of first customer announcement
      - - Cap table and preference structure
        - >-
          Liquidation preference stack, anti-dilution provisions, Series A/B term sheet terms, secondary market pricing
          at Forge Global or Equityzen
        - >-
          At $18.2B in total raised capital, preference overhang could significantly impair common equity returns even
          if enterprise value reaches $80–100B
        - Data room; secondary-market broker checks; SEC Form D for primary entity if filed
      - - Product benchmarking
        - >-
          Any third-party or published performance data comparing Prometheus AI outputs to ANSYS, Siemens NX, or other
          physics-simulation benchmarks
        - >-
          Bezos said it is premature to disclose what has been built; without performance data, the product
          differentiation claim cannot be verified
        - Academic publications, industry conference presentations, or named customer case studies
      - - $100B acquisition fund
        - >-
          Legal entity, investor commitments, targeted manufacturers, relationship to the Prometheus AI cap table, and
          whether fund economics create conflicts of interest
        - >-
          Fund close would confirm the vertical-integration thesis and captive-customer revenue model; fund failure
          narrows Prometheus to a software vendor with no captive demand
        - WSJ / Bloomberg follow-up reporting; SEC filings for the fund entity
    notes: >-
      Topics, missing evidence, and diligence paths are qualitative assessments based on public evidence; data room or
      direct company disclosure required to close most gaps.
