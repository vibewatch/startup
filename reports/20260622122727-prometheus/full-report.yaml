  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Prometheus faces a multilayered regulatory and legal threat landscape that is evolving faster than its
              product roadmap. Three distinct regimes converge on its core technology.

              **Export controls.** The U.S. Bureau of Industry and Security (BIS) rescinded the Biden-era AI Diffusion
              Rule in May 2025, but simultaneously issued new guidance warning industry about the risks of advanced
              computing ICs being diverted to PRC actors and imposing catch-all controls on model weights used to
              support weapons-of-mass-destruction or military-intelligence end uses. A replacement rule is forthcoming.
              Prometheus explicitly targets aerospace, chip design, and advanced manufacturing — precisely the dual-use
              domains that attract export-control scrutiny. Its London and Zurich offices create ongoing cross-border
              technology transfer obligations; any employee or cloud-service access from a D:5-country national may
              trigger license requirements under the catch-all controls even if the U.S. export-diffusion rule is
              rescinded. Because Prometheus generates proprietary training data that encodes physical-world engineering
              knowledge (turbine-blade aerodynamics, semiconductor process parameters, materials-fatigue limits), the
              model weights themselves could be classified as controlled exports under ECCN 4E091 when the replacement
              rule is published.

              **EU AI Act and product liability.** EU Directive (EU) 2024/2853, which must be implemented by EU Member
              States by December 2026, explicitly classifies software (including cloud-delivered AI) as a product
              subject to strict liability. Engineering AI systems that design safety-critical hardware (aircraft
              engines, bridges, pharmaceuticals) qualify as "high-risk" under the EU AI Act, requiring conformity
              assessments, mandatory human-oversight provisions, audit trails, and transparency obligations before
              market access. Prometheus's products have not yet been released and appear not to have entered any
              conformity-assessment process. The EU liability directive also removes the historical software-service
              exemption: if a Prometheus-designed component fails and causes harm, Prometheus (and any integrator or
              deployer) faces strict liability without requiring claimant proof of negligence. That liability chain is
              untested but material given the target applications.

              **IP ownership and trademark.** Current patent law in both the U.S. and EU does not recognise AI as an
              inventor, leaving ownership of AI-generated engineering designs unresolved across jurisdictions. If
              Prometheus's tools produce novel designs, the question of who holds — or can enforce — IP rights in those
              outputs is legally unsettled and could undermine a key value proposition. A trademark dispute also emerged
              in December 2025 when a California lawyer had filed a prior trademark application under the same name; the
              dispute has not been publicly resolved. Antitrust attention is an emerging risk: Prometheus is reportedly
              seeking a $100 billion affiliated fund to acquire industrial companies, a Berkshire-style vertical
              integration that would concentrate AI model, compute, manufacturing knowledge, and industrial cash flows
              under one umbrella — a structure that European and U.S. competition authorities have increasingly
              scrutinised in Big Tech contexts.
            claimRefs:
