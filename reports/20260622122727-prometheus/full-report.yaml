  - id: FV001
    title: Recommendation logic flow
    type: flow
    layout: wide
    summary: >-
      Chain from available public evidence signals to the research-more recommendation, showing how founder premium,
      institutional capital, market size, revenue opacity, and comparable multiples combine.
    data:
      nodes:
        - id: founder
          label: >-
            Founder signal: Bezos co-CEO (first operating role since Amazon); Bajaj ex-Verily; advisors include
            Attention-Is-All-You-Need co-authors
        - id: capital
          label: >-
            Capital signal: $18.2B total raised; Series B at $41B from JPMorgan, BlackRock, Goldman Sachs, DST Global,
            Arch
        - id: market
          label: >-
            Market signal: Physical AI TAM ~$81.4B (2025), ~33% CAGR; physical moats more defensible than pure software
            AI
        - id: revenue
          label: 'Revenue gap: Zero disclosed ARR; no named commercial customer beyond Bezos-affiliated Blue Origin'
        - id: comps
          label: >-
            Comp context: $41B = Autodesk market cap at $7.5B ARR; PhysicsX $2.4B with disclosed revenue growth; OpenAI
            35x ARR with $24B confirmed
        - id: risk
          label: >-
            Risk overlay: data-access challenge; FAA/FDA regulatory uncertainty; governance opacity; key-person
            concentration in Bezos
        - id: rec
          label: >-
            Recommendation: Research-more — thesis credible, Bezos premium real, but conviction at $41B requires private
            revenue data unavailable publicly
      edges:
        - source: founder
          target: comps
        - source: capital
          target: comps
        - source: market
          target: comps
        - source: revenue
          target: comps
        - source: comps
          target: rec
        - source: risk
          target: rec
    approximationNotes: >-
      Flow is a logical representation of the recommendation reasoning chain, not a financial model. Evidence nodes
      reflect best available public information as of 2026-06-22.
    claimRefs:
