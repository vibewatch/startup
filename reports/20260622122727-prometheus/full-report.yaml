  - id: FU001
    title: Customer journey map — from discovery to production engineering deployment
    type: journey-map
    layout: standard
    summary: >-
      Illustrative customer journey for a Fortune 500 industrial firm from first hearing about Prometheus to embedding
      it in standard design workflows; stages reflect the data-partnership model disclosed by co-founders.
    data:
      nodes:
        - id: jm1
          label: Discovery
          detail: >-
            Engineering director at industrial firm discovers Prometheus through investor network, industry media, or
            co-founder CNBC/Axios interview coverage.
          tone: neutral
        - id: jm2
          label: Qualification
          detail: >-
            Engineering team evaluates Prometheus against incumbent tools (Autodesk Fusion, Siemens NX, Ansys) to assess
            whether AI design tools address the specific cycle-time bottleneck.
          tone: warning
        - id: jm3
          label: Data Partnership Negotiation
          detail: >-
            Manufacturer negotiates data-sharing agreement with Prometheus, exchanging proprietary CAD files, simulation
            outputs, and telemetry for early tool access; IP protection is key sticking point.
          tone: warning
        - id: jm4
          label: Pilot Deployment
          detail: >-
            Prometheus deploys AI tools with engineering team on one design program; success criteria are measurable
            cycle-time compression versus baseline, targeting 10x or more.
          tone: positive
        - id: jm5
          label: Enterprise Expansion
          detail: >-
            If pilot demonstrates 5-10x cycle compression, engineering leadership advocates for enterprise-wide rollout
            across multiple engineering divisions and subsidiaries.
          tone: positive
        - id: jm6
          label: Production Embedding
          detail: >-
            Prometheus becomes embedded in standard design workflow; recurring enterprise license; manufacturer
