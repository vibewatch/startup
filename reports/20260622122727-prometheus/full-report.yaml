  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Prometheus describes its product as an "artificial general engineer" — software that automates the design,
              simulation, optimization, and manufacturing specification of complex physical systems. Jeff Bezos
              clarified in May 2026 that the product is "a very, very modern version of CAD," explicitly not robotics,
              with ambitions spanning aerospace components, drug compounds, and other engineered physical systems. That
              description places Prometheus inside at least four established software markets, each of which defines an
              adjacent spend boundary.


              The first is engineering simulation software — tools for finite element analysis (FEA), computational
              fluid dynamics (CFD), multiphysics, and related verification workflows used by Ansys, Siemens, Altair, and
              Dassault Systèmes. Grand View Research sized this market at $23.56 billion in 2024, growing to $51 billion
              by 2030 at a 14% CAGR. The second is product lifecycle management (PLM) software, covering collaborative
              product data management, bill-of-materials governance, digital manufacturing, and MES integration; Mordor
              Intelligence sized PLM at $50.17 billion in 2026, growing to $73.91 billion by 2031 at 8.06% CAGR. The
              third is AI electronic design automation (EDA), focused on chip and circuit design verification with AI
              tools; MarketsandMarkets sized AI EDA at $4.27 billion in 2026, growing to $15.85 billion by 2032 at 24.4%
              CAGR. The fourth is the broader industrial software market covering SCADA, MES, plant design, and product
              design platforms; Business Research Insights sized it at $29.25 billion in 2026, growing to $86.43 billion
              by 2035 at 16.7% CAGR.


              The narrower physical-AI-native layer is smaller: MarketsandMarkets estimates the physical AI market at
              $1.50 billion in 2026, growing to $15.24 billion by 2032 at 47.2% CAGR. Fortune Business Insights sizes
              generative AI in product design and engineering at $7.02 billion in 2026, rising to $39.12 billion by 2034
              at 24% CAGR. This is the sub-market closest to Prometheus's described scope.


              Status-quo substitutes for Prometheus's proposed value include: traditional CAD tools (Siemens NX,
              Autodesk Fusion, Dassault CATIA), manual simulation workflows with Ansys or COMSOL, large PLM deployments
              at Tier-1 aerospace and automotive OEMs, and the internal engineering teams that perform iterative design
              and validation work today. A DemystifyingPLM analysis of the April 2026 Threaded conference observed that
              90-95% of CAD files still live on local desktops and that many engineering organizations lack the data
              governance foundation required to make AI-augmented workflows reliable. That data state is both a
              substitute (the status quo works well enough for many existing programs) and a constraint on Prometheus's
              own adoption ramp.
