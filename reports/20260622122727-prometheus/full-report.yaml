            higher value-per-project pricing. No list pricing disclosed.
        - id: outcome-revenue
          label: Outcome-Based Revenue (Optional)
          detail: Value-share or fee tied to measurable cycle-time savings. Speculative; no confirmed contract structure.
        - id: gross-profit
          label: Gross Profit (Undisclosed)
          detail: >-
            Software-layer gross margin expected in the 60–80%+ range if Prometheus scales as enterprise SaaS. No public
            margin target or disclosure.
