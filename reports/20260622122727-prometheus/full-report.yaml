      - number: '6.4'
        title: Adoption barriers and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Three structural barriers stand between Prometheus and its first paying customer: proprietary data,
              regulatory certification, and incumbent entrenchment. The data barrier is the most acute. Industrial
              design data—from semiconductor fabrication specs to aerospace component tolerances—lives inside
              proprietary systems at manufacturers who have strong competitive reasons not to share it with a Bezos
              startup that could become a supplier, a competitor, or an acquirer. Tech-Insider analysis described this
              as 'a five-year problem, not a product launch decision.' The regulatory barrier is severe in aerospace and
              pharma: any AI-influenced aerospace component design must pass FAA certification, and drug design AI faces
              FDA approval requirements for clinical applications. A design recommendation error propagating through
              Prometheus's outputs in regulated sectors creates product liability exposure that, per analysts, existing
              insurance products do not cover. The incumbent barrier is deep: Autodesk, Siemens NX, Dassault Systèmes
              SOLIDWORKS, PTC Creo, and Ansys control the file formats, historical design data repositories, regulatory
              approval certifications, and trust relationships that define industrial engineering software. These
              incumbents have been integrating AI into their own tools and leverage decades of installed-base
              distribution—engineering schools teach AutoCAD, and Siemens NX is the default for automotive OEMs.
              Prometheus must either prove dramatically superior outcomes or overcome switching costs that are high by
              design. Deloitte's 2026 State of AI in the Enterprise report found that 58% of companies use physical AI
              in some form, but only 34% of enterprise AI deployments truly reimagine business processes, underscoring
              how difficult deep industrial adoption is even for established products.
