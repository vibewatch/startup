              millions of dollars, and deep pain from slow design-to-manufacturing cycles. Co-CEOs Bezos and Bajaj have
              publicly named four primary vertical segments: aerospace (jet engines, spacecraft, propulsion systems),
              automotive systems, semiconductor chip design, and pharmaceutical drug discovery. A fifth implied segment
              is hyperscaler data center and chip design; Bezos specifically noted at CNBC in June 2026 that Prometheus
