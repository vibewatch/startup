      - number: '3.4'
        title: Switching Costs, Moat Durability, and Competitive Risk
        blocks:
          - type: paragraph
            body: >
              Engineering software incumbents enjoy structural switching costs that are among the strongest in
              enterprise software: proprietary file formats, regulatory validation histories tied to specific tools,
              multi-decade tribal knowledge embedded in tool-specific parametric models, and deeply trained workforces.
              A manufacturer certified for aerospace production using Ansys simulation or CATIA CAD cannot switch its
              validation baseline without years of re-qualification—this creates a strong installed-base moat for
              incumbents even as Prometheus attacks the same workflow with an AI-native approach.

              Prometheus's moat narrative rests on the "world model" or foundational physical-AI model as a proprietary
              asset. If the company successfully trains Large Physics Models (LPMs) that generalize across
              domains—aerospace, semiconductors, automotive, drug development—the model itself becomes a durable asset
              that incumbents cannot easily replicate given the combination of proprietary training data, simulation
              assets, and engineering IP. The acquisition of General Agents brought VLA model capabilities that extend
              from simulation into physical manipulation, potentially grounding the world model in real-world
              sensorimotor experience rather than purely simulation-derived data.

              The risks are material. Enterprise AI adoption in industrial settings is running behind forecast: research
              published in 2026 documents that the dominant failure mode is not model capability but deployment
              methodology—data readiness gaps, legacy system integration (3-4x more engineering effort than initial
              estimates), and organizational change management. Buyers considering Prometheus products will face the
              same barriers against deployment at scale that have slowed other enterprise AI rollouts. Incumbents have
              decisive distribution advantages: Siemens' Eigen Engineering Agent reached 600,000 TIA Portal users on day
              one of commercial availability. Prometheus must build distribution from zero. The commoditization risk is
              non-trivial: if NVIDIA's NemoClaw Blueprint enables all five major incumbents to field autonomous
              engineering agents within 12-18 months, the window for Prometheus to establish durable product
              differentiation narrows significantly. Prometheus's $18.2B raised (pre- and Series B) partially offsets
              this through infrastructure investment and potential acquisitions, but capital does not substitute for
              embedded distribution.
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
              - CP037
