            body: >
              Prometheus has not announced a product launch date or named any customers as of June 22, 2026. Co-CEOs
              Bezos and Bajaj told GeekWire on June 11, 2026 that "early rollouts are coming" but declined to specify a
              timeline. This is consistent with Bezos's May 2026 characterization of the work as "premature" to disclose
              in detail, though he added that progress is "really quite remarkable." The lack of a disclosed product
              timeline reflects both the inherent difficulty of building physical AI models and the company's deliberate
              operational focus, described by Bezos as "being heads down and trying to do the work."

              The company's compute infrastructure is multi-sourced. Bezos stated that Prometheus sources compute "from
              a multitude" of hyperscalers because "compute is scarce enough that you get it where you can," with AWS
              specifically confirmed as one supplier. The company's large capital base ($18.2B total raised) is in part
              a reflection of multi-year compute commitments required to train large-scale physical-world foundation
              models. Grey Journal analysis notes this mirrors the pattern of other megarounds where capital locks up
              scarce compute capacity and funds proprietary data pipeline construction, not just GPU rentals.

              The Financial Times reported in February 2026 that Bezos is separately seeking to raise a $100 billion
              fund — controlled by Prometheus — to acquire companies in AI-disrupted manufacturing sectors. Portfolio
              companies would both benefit from Prometheus's tools and feed back proprietary industrial data. This
              creates a potential vertical integration model: Prometheus as an AI-driven holding company that uses its
              physical AI stack to transform manufacturing businesses it acquires. Bezos confirmed at the June 11 CNBC
              interview that Prometheus "may buy parts of companies" to help improve their manufacturing processes,
