      - number: '5.3'
        title: General Agents Acquisition and Agentic AI Stack
        blocks:
          - type: paragraph
            body: >
              In November 2025, Prometheus quietly acquired General Agents, an agentic AI startup founded by Sherjil
              Ozair (ex-Google DeepMind, Tesla) and co-founded by William Guss (ex-OpenAI research scientist). The
              acquisition was confirmed by corporate filings in Delaware obtained by Wired: Bajaj formed an acquisition
              entity the morning after an off-the-record AI dinner at San Francisco's Saison restaurant, where Ozair was
              present, and the merger was executed four days later.

              General Agents had developed Ace — described as "the first realtime computer autopilot." Ace uses a
              video-language-action (VLA) model architecture to interpret visual inputs and act on natural language
              instructions in real time: a demonstration video showed Ace downloading an image from Google and sending
              it via iMessage in under 15 seconds. At least two custom foundation models power Ace: ace-control-small
              and ace-control-medium. VLA architectures are commonly used for robotics foundation models — systems that
              must perceive visual context, plan sequences of actions, and execute those actions; their extension to
              computer-control agents provides agentic automation capabilities directly applicable to engineering
              workflows. General Agents also published Showdown, a suite of offline and online benchmarks for
              computer-use agents (GitHub: generalagents/showdown), providing an independent evaluation framework.

              Founding advisors to Prometheus include Ashish Vaswani and Jakob Uszkoreit, two former Google researchers
              who co-authored the seminal 2017 "Attention Is All You Need" paper introducing the transformer
              architecture. Both continue to run their own startups while advising Prometheus. Kamyar Azizzadenesheli,
              former senior research scientist at Nvidia (specializing in physics-informed AI), also joined Prometheus
              early on. The General Agents team, now operating from Foresite Labs' San Francisco headquarters,
              contributes computer-control and agentic workflow capabilities that could extend Prometheus's tooling into
              automated engineering task execution rather than purely model-driven design generation.
