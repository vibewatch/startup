            body: >-
              As of June 2026, Prometheus has disclosed no commercial revenue, no named commercial customers, and no
              formal product launch timeline. The company is building what it calls an "artificial general engineer" —
              AI software that automates the design-to-manufacturing cycle for complex physical systems, from jet
              engines to pharmaceutical compounds. Bezos and co-CEO Vik Bajaj confirmed to CNBC on June 11, 2026 that
              early rollouts are coming, but declined to give a specific timeline or describe any current paying
              deployments. The only explicitly named analogous user is Blue Origin, which Bezos called a natural early
              "case study for a customer of Prometheus," though no commercial contract has been announced and Blue
              Origin is an independent entity with no formal Prometheus corporate tie. The intended revenue mechanism
              appears to be enterprise licensing of AI engineering tools charged to large industrial operators —
              aerospace, automotive, semiconductor fabrication, and pharmaceutical manufacturers — following a pattern
              similar to Autodesk or Siemens NX, but at a much higher value-per-seat or value-per-project pricing point
              given the claimed 10x or greater cycle-time compression. Prometheus may also pursue outcome-based pricing
              or co-development arrangements as an alternative to pure software licensing. A parallel, separately funded
              manufacturing transformation vehicle targeting up to $100 billion in acquisitions of industrial companies
              would layer an operational deployment channel on top of the software licensing story, but that vehicle is
              not yet closed, has no confirmed investors, and is structurally distinct from Prometheus itself. No
              revenue run-rate, backlog, letter-of-intent pipeline, or commercial contract has been publicly disclosed.
