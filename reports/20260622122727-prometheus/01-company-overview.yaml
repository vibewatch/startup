callouts:
  - calloutType: strength
    title: Unprecedented capital formation at pre-revenue stage
    body: >-
      With more than $18 billion raised within seven months of public founding, Prometheus has assembled a capital
      base that rivals early-stage funding rounds of much more mature startups. The participation of JPMorgan,
      Goldman Sachs, and BlackRock — institutions not typically associated with seed-stage AI bets — validates the
      institutional credibility of the co-CEO team and the physical AI thesis.
    claimRefs:
      - CO019
      - CO020
      - CO022
      - CO023

  - calloutType: strength
    title: Complementary co-founder credentials with rare scientific depth
    body: >-
      Bezos brings capital, commercial scale experience, and credibility with major financial institutions, while
      Bajaj brings the physical-science expertise (Verily, Foresite Labs) required to credibly recruit AI
      researchers for non-text physical AI. This complementary pairing is difficult to replicate and distinguishes
      Prometheus from AI startups led by software-only teams.
    claimRefs:
      - CO009
      - CO010
      - CO017

  - calloutType: risk
    title: Pre-revenue $41B valuation with no public product
    body: >-
      Prometheus's $41 billion valuation is entirely narrative-driven as of June 2026. The company has no
      disclosed revenue, no commercial customers, and has shown no independent validation of its internal
      benchmarks. Multiple analysts and journalists have characterised the valuation as speculative. This creates
      material downside risk if technical delivery timelines slip or if LLMs extend to cover physical engineering
      tasks faster than Prometheus anticipates.
    claimRefs:
      - CO008
      - CO039
      - CO041
      - CO042

  - calloutType: risk
    title: Key-person concentration in Bezos and Bajaj
    body: >-
      The company's strategic direction, investor relationships, and public credibility are entirely concentrated
      in two individuals. Bezos's concurrent obligations at Blue Origin — which suffered a significant setback in
      May 2026 — illustrate the bandwidth risk. No formal succession plan, board governance details, or below-CEO
      leadership layer has been disclosed publicly.
    claimRefs:
      - CO009
      - CO010
      - CO018
      - CO043

  - calloutType: insight
    title: Proprietary training data as the stated moat — unverified
    body: >-
      Prometheus's primary competitive claim is that physical AI requires bespoke training data from real-world
      experiments and simulations, not internet-scale text. If this claim holds, it creates a durable barrier to
      entry. However, Google DeepMind, Meta, and others are pursuing similar physical science AI with significant
      compute and data resources. The moat has not been independently validated.
    claimRefs:
      - CO007
      - CO046
      - CO050

