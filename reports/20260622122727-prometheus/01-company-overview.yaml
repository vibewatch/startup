  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Board composition, governance documents, shareholder agreement, equity split between Bezos and other
        early investors, and formal succession provisions for co-CEO roles.
      whyItMatters: >-
        Without board and governance details, it is impossible to assess whether investor protective rights,
        co-CEO succession, or conflict-of-interest policies are adequate.
      diligencePath: >-
        Request cap table, board minutes summary, and governance summary directly from Prometheus; look for
        any Delaware Secretary of State filings.
      relatedQuestionRefs:
        - QO002
        - QO003
        - QO013
      relatedTableRefs:
        - TO002

    - type: private-evidence-only
      severity: material
      topic: financing
      missingEvidence: >-
        Exact investment sizes per Series B investor, pre-money valuation at each round, dilution table,
        and tranche structure.
      whyItMatters: >-
        Without the cap table or round economics, economic and control interests of each investor cannot be
        assessed and downside scenarios cannot be modelled.
      diligencePath: >-
        Request Series B term sheet summary; check EDGAR or SEC Form D if any U.S. registered securities
        are involved; cross-check via PitchBook or Crunchbase.
      relatedQuestionRefs:
        - QO006
        - QO007
        - QO010
        - QO011

    - type: private-evidence-only
      severity: blocking
      topic: product-status
      missingEvidence: >-
        Product architecture, technical benchmarks with independent validation, engineering roadmap, pilot
        customer agreements, and product timeline.
      whyItMatters: >-
        Product delivery is the central risk in Prometheus's investment case. Without third-party technical
        validation, all product progress claims rest entirely on company-controlled statements.
      diligencePath: >-
        Request product demonstration with independent technical evaluators; ask for third-party benchmark
        data; identify any pilot customer references willing to speak.
      relatedQuestionRefs:
        - QO018
        - QO021
        - QO022
        - QO023
        - QO024

    - type: private-evidence-only
      severity: material
      topic: capital-use
      missingEvidence: >-
        Breakdown of Series B capital allocation between compute, data acquisition, R&D labor, and
        holding-company purposes.
      whyItMatters: >-
        Capital allocation between compute, data, and the affiliated industrial holding company will
        determine runway and focus; without it, burn-rate modelling is guesswork.
      diligencePath: >-
        Request financial model and budget allocation from management; seek clarity on any firewall between
        the AI build budget and the holding-company vehicle.
      relatedQuestionRefs:
        - QO009
        - QO025

    - type: missing-source
      severity: material
      topic: investors-Series-A
      missingEvidence: >-
        Names and investment sizes for investors in the $6.2B initial/seed round beyond Bezos; only his
        participation is confirmed in public sources.
      whyItMatters: >-
        The Series A investor set determines early governance, board composition, and signalling of who
        underwrote the original Prometheus thesis.
      diligencePath: >-
        Search for any SEC Form D filing under "Prometheus" or "Project Prometheus"; check Crunchbase,
        PitchBook, and CNBC November 2025 coverage for partial investor lists.
      relatedQuestionRefs:
        - QO011
      relatedTableRefs:
        - TO003

    - type: private-evidence-only
      severity: minor
      topic: trademark
      missingEvidence: >-
        Current status of the "Project Prometheus" trademark conflict with the California lawyer's filing and
        whether it has been resolved following the name change.
      whyItMatters: >-
        The name change to "Prometheus" likely resolves the immediate conflict, but if unresolved it could
        complicate product and branding launches.
      diligencePath: >-
        Search USPTO TESS database for "Prometheus" AI-related trademark filings; confirm current status.
      relatedQuestionRefs:
        - QO019

    - type: private-evidence-only
      severity: material
      topic: milestone-completeness
      missingEvidence: >-
        Internal Prometheus milestone records, including technical milestones, internal engineering
        benchmarks, product build milestones, and any internal governance or board decisions between
        November 2025 and June 2026.
      whyItMatters: >-
        The public chronology covers only announced events; internal milestones (product progress, key hires,
        technical inflection points) are unavailable and may be more revealing of actual trajectory than
        fundraising events alone.
      diligencePath: >-
        Request a technical and operational milestone timeline from management during diligence; check press
        coverage for any leaked internal information or conference presentations.
      relatedTableRefs:
        - TO004

    - type: missing-source
      severity: material
      topic: customers-pilots
      missingEvidence: >-
        Any early customer agreements, pilot deployments, letters of intent, or partnership announcements
        as of June 2026.
      whyItMatters: >-
        Without customer evidence, the investment case rests entirely on the technical vision and founder
        credibility; even one reference customer would materially change the risk profile.
      diligencePath: >-
        Ask management for any customer references; search for any early user communities, GitHub activity,
        or conference demo recordings that might indicate external engagement.
      relatedQuestionRefs:
        - QO022
