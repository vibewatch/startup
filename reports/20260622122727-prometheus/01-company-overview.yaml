  - id: milestones-adverse-diligence
    title: Milestones, adverse signals, and diligence context
    body: >-
      The Prometheus chronology is short but dense. The company's public record spans just seven months as of
      the run date, yet it already contains landmark financing events, a strategic acquisition, a trademark dispute,
      leadership revelations, and a wave of critical media analysis. This section anchors the milestone chronology
      and flags the adverse signals that subsequent diligence chapters must carry forward.

      The most significant adverse theme is overvaluation on a pre-revenue basis. Multiple independent analysts and
      journalists have questioned whether a $41 billion valuation — with zero disclosed revenue, no commercial
      product, and no known customers — reflects genuine enterprise value or AI narrative momentum. AInvest
      published a direct critique headlined "Project Prometheus: $41 Billion Valuation With Zero Revenue, No
      Product." IBTimes raised "global dominion" concerns about the concentration of foundational science and
      engineering AI in a single private entity. ComputerWorld questioned whether the Prometheus approach
      represents a fundamental rethinking of AI IT strategy or primarily a bet on Bezos's personal brand.

      A secondary adverse signal is the operational opacity. Prometheus revealed nothing publicly for the first
      six months of its existence, and even after the June 11 announcement, Bezos and Bajaj declined to provide
      a product timeline, declined to name pilot customers, and declined to give technical detail beyond internal
      benchmark claims. Bezos's concurrent obligations at Blue Origin — where a New Glenn rocket exploded on the
      launchpad in late May 2026 — also raise questions about leadership bandwidth. The trademark dispute over
      "Project Prometheus" filed by a California lawyer in December 2025 is a minor legal friction item rather
      than a blocking issue, but is recorded in the milestone table. No litigation, regulatory investigation, or
      sanctions were found in the research set.
