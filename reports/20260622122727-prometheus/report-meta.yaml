companyProfile:
  summary: "Prometheus is Jeff Bezos and Vik Bajaj's industrial AI startup focused on building an \"artificial general engineer\" that automates design, simulation, and manufacturing workflows for complex physical systems. Publicly discussed target sectors include aerospace, automotive, semiconductor design, and pharmaceuticals, but as of June 2026 the company remains pre-product, has no disclosed commercial revenue, and has only identified Blue Origin as an internal early use case rather than an arms-length customer. The company has nonetheless raised $18.2 billion across a November 2025 launch round and a June 2026 $12 billion Series B, giving it exceptional compute and data-acquisition capacity but also forcing diligence to focus on execution proof that is still largely private."
