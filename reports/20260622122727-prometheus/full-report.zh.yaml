      - number: '8.3'
        title: 情景分析：牛市、基准与熊市
        blocks:
          - type: paragraph
            body: >-
              以下三个情景基于截至 2026 年 6 月 22 日可获得的证据。三者共享同一项根本证据约束：Prometheus 披露收入为零，除 Blue Origin
              外没有具名商业客户，也没有公开产品基准。情景区间以公开可比公司倍数和私有 AI 融资先例为锚。


              牛市情景假设 Prometheus 到 2026 年底或 2027 年初跑通三个高价值初始部署。Blue Origin 从内部测试场景转为经常性付费客户；部分航空航天和半导体制造商签署试点合同，到 2027
              年底带来 $200–500 million 早期 ARR；另据报道的 $100 billion 制造业收购基金单独完成交割，为 Prometheus 提供内部 captive
              客户群，并可能额外产生数亿美元软件与服务 ARR。在该情景下，2027 年 ARR 达到 $1–2 billion，按 30–50x 的物理 AI 溢价倍数计算，公允价值为 $30–100 billion，与当前
              $41 billion 估值一致或略高。牛市情景还假设没有下轮降价风险，且 AI 私有市场溢价能维持到 2027 年。


              基准情景假设产品开发继续推进，但商业采用慢于牛市情景，受制于工业销售周期长、专有制造商数据集获取难，以及 FAA 和 FDA 监管行业中 AI 生成工程设计的监管复杂性。2027 年 ARR 为 $100–300
              million，按压缩后的物理 AI 倍数 15–25x 计算，公允价值为 $1.5–7.5 billion，远低于当前 $41 billion 估值。按当前价格，Series B 投资人押注的是相对于基准情景
              2027 年收入的 5–27x 倍数跃升，而目前没有证据支持。


              熊市情景假设物理工程自动化问题比 Bezos 和 Bajaj 预想的更难泛化，训练数据获取因制造商不愿向潜在竞争者共享专有仿真数据而受到结构性限制，商业部署被推迟到 2028
              年之后。在该情景下，Prometheus 最终成熟为内部工具（服务 Blue Origin 和被收购制造商），但无法建立广泛企业客户群。此时公允价值更接近 $3–8 billion——大致对应一家资金充足、IP
              强但商业牵引有限的工业 AI 软件公司。如果私有 AI 市场情绪转向且收入可见度没有实质改善，下一轮降价融资可能发生。
