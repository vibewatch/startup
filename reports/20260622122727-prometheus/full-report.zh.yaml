  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与当前融资背景
        blocks:
          - type: paragraph
            body: >-
              Prometheus 于 2026 年 6 月 11 日宣布完成 $12 billion Series B，投后估值约 $41 billion，这是物理 AI 历史上最大单轮押注。公司 2025 年 11 月以
              $6.2 billion Series A 启动，当时估值约 $30 billion；也就是说，这家公司约 7 个月就涨到 $41 billion，其中最后 7 周（从 4 月 $38 billion 到交割时
              $41 billion）单独上调了 $3 billion。Series B 投资人包括 JPMorgan Chase、BlackRock、Goldman Sachs、DST Global、Arch Venture
              Partners 以及 Bezos 本人。对一家 150 人、没有披露商业产品的公司而言，这一阶段同时吸引机构资本和风险资本并不常见。


              投资论点建立在四根支柱上。第一，创始人溢价：Jeff Bezos 曾把 Amazon 从电商扩成云基础设施公司，这是科技史上记录最完整的价值创造故事之一；他担任联席 CEO，也是 2021 年离开 Amazon
              后首次正式回到运营岗位。联席 CEO Vik Bajaj 曾联合创办 Verily，在把 AI 用于复杂物理系统上具备领域可信度。第二，市场规模：物理 AI 市场 2025 年估值约 $81.4
              billion，预计到 2035 年 CAGR 约 33%；如果技术跑通，Prometheus 面对的机会足够大。第三，算力资本配置：已融资 $18.2 billion
              中相当一部分将投向算力和专用训练数据，形成基础设施护城河，类似 Anthropic 和 OpenAI 通过资本密集型预训练守住模型位置。第四，机构信号：JPMorgan、BlackRock 和 Goldman
              Sachs 把工业 AI 当作基础设施级投资，而非风险投机，这一质性信号说明该品类正在形成真实机构需求。


              反论点同样强。Prometheus 尚未交付产品，没有披露收入，唯一具名早期客户或内部测试场景是 Bezos 自己的航天公司 Blue Origin。公司没有公开网站。$41 billion 估值等同于
              Autodesk 的全部市值，而 Autodesk 年经常性收入为 $7.5 billion；Prometheus
              在商业运营第一天之前就背上了这个估值。更关键的是，在没有披露能力发布、客户赢单或产品基准的情况下，估值 7 周内上调了 $3 billion。Fast Company 指出，截至 2025
              年底，Prometheus 主体没有 SEC Form D 备案，引发早期治理透明度问题，至今尚未完全消除。Angel Investors Network 的负面分析认为，$41 billion
              代表的是希望，而不是已被验证的执行力；与 Autodesk 市值相比也不是估值锚，而是警示性基准——Autodesk 花了数十年建设企业客户关系才达到这一市值。
