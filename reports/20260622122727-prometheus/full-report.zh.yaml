          - type: callout
            title: Blue Origin 是唯一具名参考，但不是独立客户
            body: >-
              Jeff Bezos 在 2026 年 6 月 11 日 Axios 采访中把 Blue Origin 称为“Prometheus 客户案例研究”——这是 Prometheus
              公开客户记录中唯一具名组织。Blue Origin 是 Bezos 自己的航空航天公司；这项参考是联合创始人在投射自己公司的未来需求，不是公平交易的商业验证。如果 Blue Origin 成为
              Prometheus 的第一位客户，尽调必须确认公平交易定价、治理隔离和独立客户核验，之后这段关系才可能成为有意义的客户证明。
            calloutType: insight
