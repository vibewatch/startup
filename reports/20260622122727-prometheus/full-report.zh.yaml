      - number: '5.3'
        title: 收购 General Agents 与智能体 AI 技术栈
        blocks:
          - type: paragraph
            body: >
              2025 年 11 月，Prometheus 悄然收购了 General Agents。这是一家 agentic AI 创业公司，由 Sherjil Ozair（曾任 Google
              DeepMind、Tesla）创立，William Guss（曾任 OpenAI 研究科学家）共同创立。Wired 取得的 Delaware 公司文件确认了这笔收购：在 San Francisco 的
              Saison 餐厅一场非公开 AI 晚宴之后第二天早上，Bajaj 设立了收购实体；Ozair 当时也在场；四天后合并完成。

              General Agents 开发了 Ace，被描述为“第一个实时计算机自动驾驶”。Ace 使用
              video-language-action（VLA）模型架构，实时解读视觉输入并按自然语言指令行动：一段演示视频显示，Ace 在不到 15 秒内从 Google 下载一张图片并通过 iMessage 发送。Ace
              至少由两个定制基础模型驱动：ace-control-small 和 ace-control-medium。VLA
              架构常用于机器人基础模型——这类系统必须感知视觉语境、规划动作序列并执行；延伸到计算机控制智能体后，可提供直接适用于工程工作流的智能体自动化能力。General Agents 还发布了
              Showdown，一套面向计算机使用智能体的离线和在线基准（GitHub: generalagents/showdown），提供独立评估框架。

              Prometheus 的创始顾问包括 Ashish Vaswani 和 Jakob Uszkoreit，两人曾是 Google 研究员，共同署名 2017 年开创性论文“Attention Is All You
              Need”，引入 transformer 架构。两人一边运营自己的创业公司，一边为 Prometheus 提供建议。Kamyar Azizzadenesheli 曾任 Nvidia 高级研究科学家，专长
              physics-informed AI，也早期加入 Prometheus。General Agents 团队目前在 Foresite Labs 的 San Francisco
              总部办公，贡献计算机控制和智能体工作流能力；这可能把 Prometheus 的工具从纯模型驱动的设计生成，延伸到自动执行工程任务。
