      - number: '5.4'
        title: 算力基础设施、部署模型与上市路径
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月 22 日，Prometheus 尚未宣布产品发布日期，也未点名任何客户。Bezos 和 Bajaj 在 2026 年 6 月 11 日对 GeekWire
              表示，“早期推出快来了”，但拒绝说明时间表。这与 Bezos 2026 年 5 月对该工作的表述一致：详细披露还“为时过早”，但他也说进展“真的相当了不起”。没有披露产品时间线，既反映出构建物理 AI
              模型本身很难，也反映了公司刻意保持的运营专注；Bezos 形容为“低头把事情做出来”。

              公司的算力基础设施来自多方。Bezos 表示，Prometheus 从“多个”超大规模云服务商获取算力，因为“算力稀缺到你只能哪里有就去哪里拿”，其中 AWS 被明确确认为供应商之一。公司巨大的资本基础（累计融资
              $18.2B）部分体现了训练大规模物理世界基础模型所需的多年算力承诺。Grey Journal 分析指出，这与其他巨额融资模式相似：资本用来锁定稀缺算力并建设自有数据管线，而不只是租 GPU。

              Financial Times 2026 年 2 月报道称，Bezos 还在单独寻求募集一个由 Prometheus 控制的 $100 billion 基金，用来收购受 AI 冲击的制造业公司。被投公司既会受益于
              Prometheus 工具，也会反哺自有工业数据。这会形成一种潜在垂直整合模型：Prometheus 作为 AI 驱动的控股公司，用自己的物理 AI 技术栈改造所收购的制造企业。Bezos 在 6 月 11 日
              CNBC 采访中确认，Prometheus “可能会买下公司的一部分”，以帮助改善其制造流程，但他称关于 $100B 基金的报道并不精确。公司与 Amazon 或 Blue Origin
              没有正式关系，并以结构独立方式运营。
