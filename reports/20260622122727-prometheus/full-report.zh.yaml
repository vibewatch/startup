  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: ICP 与目标客户分群
        blocks:
          - type: paragraph
            body: >-
              Prometheus 把理想客户定义为那些制造全球最复杂物理产品的大型工业组织：工程项目跨越多年，预算动辄数亿美元，并深受设计到制造周期缓慢之痛。联合 CEO Bezos 和 Bajaj
              已公开点名四个主要垂直领域：航空航天（喷气发动机、航天器、推进系统）、汽车系统、半导体芯片设计和药物发现。第五个隐含领域是 超大规模云服务商的数据中心和芯片设计；Bezos 2026 年 6 月在 CNBC
              特别提到，Prometheus 工具可帮助云运营商改进数据中心，暗示 Amazon、Google 和 Microsoft 的基础设施工程团队也在范围内。所有场景里，买方画像都是大型工业企业内部的工程团队或 R&D
              组织，而不是工厂车间操作员或采购官。Bezos 明确说，目标是量产之前的发明闭环：设计、仿真、原型和优化阶段。他举的喷气发动机例子很典型：一家喷气发动机制造商想要 10% 更多推力，今天面对的是一个 10
              年项目，不是因为工程师慢，而是因为多物理场设计空间复杂到难以处理。Prometheus 希望把这个周期压缩 10x 或更多。地域上隐含为全球；公司在 San Francisco、London 和 Zurich
              设办公室，显示国际化取向。公司没有披露收入分层、渠道偏好或客户规模门槛。因此，客户分群是一种扎根于已验证痛点的市场愿景，而不是已签约账户清单。
