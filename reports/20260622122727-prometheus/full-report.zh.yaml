      - - Jeff Bezos 创始人溢价 — 他有扩张 Amazon、投资变革性公司的记录；2021 年以来首次正式担任运营角色，显示深度信念
        - 正论点
        - Bezos 实质退出日常运营
      - - 机构资本质量 — JPMorgan、BlackRock、Goldman Sachs 传递基础设施级需求信号；并非纯粹风投投机
        - 正论点
        - 投资者撤资，或二级市场估值下调至 Series B 价格以下
      - - Physical-AI 市场规模 — 2025 年市场为 $81.4B，CAGR 约 33%；TAM 远大于纯软件 AI，也更可防守
        - 正论点
        - 市场采用慢于预测；既有厂商（Siemens、ANSYS）推进 AI 路线图快于预期
      - - 资本密集型护城河 — 已筹集 $18.2B，撑起算力和训练数据基础设施，150 人规模的竞争者很难复制
        - 正论点
        - 若没有专有数据访问，资本密集最终变成烧钱，护城河随之收窄
      - - 零收入却估值 $41B — 首份商业合同前，估值已等于 Autodesk 整个市值；没有公开产品，也没有客户验证
        - 反论点
        - 披露首个具名商业客户和已签收入 backlog
      - - 数据访问依赖 — 专有制造商仿真数据是核心训练输入；这些数据所有方有竞争动机，不一定愿意与 Bezos 分享
        - 反论点
        - 与航空航天或半导体制造商确认数据共享合作
      - - 监管复杂性 — FAA 和 FDA 的 AI 治理框架尚不存在；AI 生成工程错误的责任无法承保
        - 反论点
        - AI 辅助工程设计监管规则变清晰，并形成可管理的责任框架
      - - 治理不透明 — 没有公开网站，截至 2025 年末主要实体没有 SEC Form D，也未披露 cap table 或清算优先权结构
        - 反论点
        - Prometheus 提交标准披露，或发布包含基础财务透明度的投资者关系材料
    notes: 正反论点来自截至 2026-06-22 的公开报道和分析。信念权重为作者判断，并非量化模型。
