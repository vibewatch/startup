      - number: '7.5'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Prometheus 的架构在算力、数据和分销上都依赖外部方；每一种依赖都有不同失败场景。

              **算力供应商依赖。** Prometheus 从包括 AWS 在内的多个超大规模云服务商获取 GPU 算力（Bezos 已确认）。AWS、Azure 和 GCP 都受 NVIDIA 芯片生产节奏和 HBM
              内存供应制约，面临各自 GPU 供给压力。云供应商条款变化、GPU 访问出口管制限制，或超大规模云服务商 优先服务自家 AI 工作负载，都可能在没有预警的情况下限制 Prometheus
              的训练能力。Prometheus 没有披露可兜底的自有数据中心基础设施。

              **工业数据合作风险。** Prometheus 的自有数据策略依赖工业伙伴共享传感器日志、测试结果和工艺数据。认为共享数据存在竞争风险的伙伴（例如发动机设计数据可能帮助竞争对手的航空航天
              OEM）可能要求排他、限制数据范围，或完全撤回数据访问。截至 2026 年 6 月，没有具名数据合作伙伴，这是重大尽调缺口。

              **Blue Origin/Amazon 关系与利益冲突风险。** Bezos 是 Amazon 执行董事长，并深度参与 Blue Origin。Blue Origin CEO David Limp 坐在
              Prometheus 董事会。Bezos 告诉 CNBC，“很容易想象 Prometheus 成为 AWS 的客户”。这些重叠关系既带来优先访问（AWS 算力、Amazon
              数据），也带来潜在利益冲突；监管机构（反垄断、CFIUS）、竞争投资人，或不希望 Bezos 控制实体接触其自有制造数据的潜在客户，都可能审视这些冲突。

              **收购整合风险。** 据报道的 $100 billion 收购基金将要求 Prometheus 把被收购制造公司整合进其 AI 工作流——这是一个多年运营挑战，所在行业（航空航天、汽车、半导体）的既有 ERP
              系统、工会劳工协议、安全认证要求和监管监督都复杂且推进缓慢。
