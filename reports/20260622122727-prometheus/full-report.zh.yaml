          tone: positive
        - id: jm5
          label: 企业扩展
          detail: 如果试点证明可压缩周期 5-10 倍，工程负责人会推动在多个工程部门和子公司全企业铺开。
          tone: positive
        - id: jm6
          label: 生产嵌入
          detail: Prometheus 嵌入标准设计工作流；企业许可证形成经常性收入；制造商持续提供新的设计数据，喂给模型改进飞轮。
