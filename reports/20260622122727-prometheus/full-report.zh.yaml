          to: compute
        - from: capital-pool
          to: training-data
        - from: capital-pool
          to: talent
        - from: capital-pool
          to: acquisitions
        - from: capital-pool
          to: manufacturing-fund
    approximationNotes: 资本配置根据 Bezos 公开表述和类似前沿 AI 实验室推断。公司未披露预算拆分。制造业基金已有报道，但尚未关账，且与 Prometheus 运营主体结构分离。
