    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 含义
      - 尽调问题
    rows:
      - - 工程人才短缺
        - 上行
        - 当前且继续扩大
        - 对能替代稀缺熟练工程师的 AI 工具形成结构性需求
        - 要求 Prometheus 说明目标工程细分学科，并拿出试点客户已意识到人才缺口的证据
      - - 航空航天与国防积压订单激增
        - 上行
        - 当前且持续多年
        - 商用飞机订单超过 15,000 架、国防积压订单增长超过 50%，带来多年设计与生产工作；压缩周期能直接兑现 ROI
        - 要求披露 Prometheus 的 A&D 垂直管线，以及 Blue Origin 关系能否转化为更广泛的 A&D 商业合同
      - - 现有厂商 AI 投资与验证
        - 上行
        - 当前
        - Siemens 的 €1B 工业 AI 投资、Autodesk 的 Neural CAD、Ansys SimAI 验证了论点，也教育了买方；同时加剧竞争
        - 监测现有厂商产品发布和定价，评估 Prometheus 定位被替代的风险
      - - $15.7B 创业生态验证工程 AI
        - 上行
        - 当前
        - 600 多家创业公司、10 家独角兽，以及特定用例中数量级的工作流压缩，确认需求和客户更换工具的意愿
        - 评估 Prometheus 定位为平台，还是直接与垂直工具创业生态竞争
      - - 全球 ER&D 投资以 10% CAGR 增长
        - 上行
        - 中期（2022-2026）
        - ER&D 预算扩张，即便 AI 渗透率尚未上升，也会扩大总可寻址支出
        - 要求证明 Prometheus 定价按 ER&D 软件预算校准，而不是按服务支出校准
      - - 数据治理碎片化
        - 下行
        - 当前
        - 90-95% 的 CAD 文件留在本地桌面；PDM 连基础命名都失效；没有干净数据，AI 质量会下降
        - 要求 Prometheus 说明数据修复方法，以及是否包含上线服务或客户侧数据要求
      - - 物理 AI 成熟度缺口
        - 下行
        - 当前及近期
        - 2026 年 PINNs 仍处研究阶段；替代模型是务实绕行方案，但不是第一性原理物理推理
        - 要求披露技术架构：Prometheus 使用替代模型、PINNs，还是混合方法？
      - - IP 敏感性与国防出口管制
