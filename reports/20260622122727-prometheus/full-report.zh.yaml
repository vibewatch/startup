              billion 估值在商业运营第一天之前就定价了 Autodesk 级别的收入创造；训练数据获取是 5 到 10 年难题；如果 Prometheus
              的设计建议在受监管物理系统中失效，目前没有保险产品覆盖随之而来的责任链。证实案例则是：Bezos 的运营履历、投资人财团质量和长跑道，使 Prometheus
              比历史上几乎任何创业公司都更能顶住执行时间线。尽调层面的财务结论是：不能用传统 SaaS、硬件或服务业财务指标承保 Prometheus，因为这些指标都不存在。更合适的框架是长期风险投资：判断资本能否支撑多年
