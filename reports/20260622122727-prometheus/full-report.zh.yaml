  - id: FU001
    title: 客户旅程图——从发现到生产工程部署
    type: journey-map
    layout: standard
    summary: 以一家财富 500 强工业公司为例，展示其从首次听说 Prometheus 到将其嵌入标准设计工作流的客户旅程；各阶段反映联合创始人披露的数据合作模式。
