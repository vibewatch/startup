  - id: FI004
    title: 资本强度与现金流向图
    type: flow
    layout: wide
    summary: Prometheus 如何把融资投向计算资源、人才、训练数据和潜在收购，以及现金从资产负债表流向哪里。
    data:
      nodes:
        - id: capital-pool
          label: 资金池（$18.2B+）
          detail: >-
            Series A（$6.2B，2025 年 11 月）和 Series B（$12B，2026 年 6 月）资金来自 Bezos、JPMorgan、Goldman Sachs、BlackRock、DST Global
            和 Arch Venture Partners。
        - id: compute
          label: 计算基础设施
          detail: GPU 集群、云合同或自有 AI 基础设施。Bezos 明确称计算资源是资本的主要用途。规模与前沿 AI 实验室每年 $500M–$2B+ 的支出相符。
        - id: training-data
          label: 专用训练数据
          detail: 物理世界数据——材料属性、仿真输出、制造遥测、工程公差——并不存在可抓取的公开数据集。Prometheus 必须购买或生成这些数据。Bezos 将其列为第二大成本驱动。
        - id: talent
          label: 人才（约 150 名员工）
          detail: 员工来自 OpenAI、Google DeepMind、Nvidia、Meta FAIR 和 xAI。这一级别的资深 AI 研究员年薪酬包可达 $1–5M+。按当前人数估算，年度人才支出为 $150M–$300M+。
        - id: acquisitions
          label: 战略收购
          detail: 2025 年 11 月收购 General Agents（条款未披露）。按 $100B 制造业基金设想，后续还可能继续收购。
        - id: manufacturing-fund
          label: 制造业转型载体（独立）
          detail: WSJ/TechCrunch 报道，收购载体规模最高可达 $100B。该载体与 Prometheus 在结构上分离，但设计上会成为 Prometheus AI 工具的分发渠道。截至 2026 年 6 月尚未关账。
      edges:
