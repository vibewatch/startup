        blocks:
          - type: paragraph
            body: >-
              Company Overview 章梳理了 Prometheus 每一轮融资的时间线；本节只看未来资本是否够用。简版结论是：Prometheus 拿着私营 AI 公司里最大的产品前资本池——自 2025 年 11
              月成立到 2026 年 6 月 11 日 Series B 交割，累计融资超过 $18 billion。Series B 由 Bezos 领投，JPMorgan、Goldman
              Sachs、BlackRock、DST Global 和 Arch Venture Partners 参与。Bezos 确认，他也像参与 $6.2 billion Series A 一样参与了新一轮。按每年
              $1–3 billion 的年化烧钱速度，仅靠现有资本，公司估计可撑 5 到 18 年——上限假设烧钱接近 Series A
              节奏，下限则反映算力承诺迅速放大。除“算力和训练数据”外，公司拒绝披露手头现金、月度烧钱，或任何预算用途拆分。公开信息中没有债务工具、授信额度、项目融资或可转债。Bezos 说 IPO “现在想还太早”，把
              Prometheus 定位成长期私营建设项目。另有报道提到，一个制造业转型载体计划最多投入 $100 billion
              收购工业企业；若落地，会带来额外资本需求和结构复杂度，但该载体尚无确认交割、确认投资人或公开募资时间表。2026 年 4–6 月，若干投资人 SPV（Sydecar 管理的系列载体）提交了 SEC Form
              D，确认至少部分 Series B 资本经受监管的豁免发行结构进入；单个 SPV 金额从 $310,000 到 $2.5 million 不等，体现出机构领投轮旁边还有小额支票共同投资人。截至 2026 年 6
              月，公开申报中看不到债务或项目融资证据。
