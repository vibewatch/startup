      - number: '7.6'
        title: 缓释措施与终止标准
        blocks:
          - type: paragraph
            body: >-
              Prometheus 的缓释措施主要来自财务（深厚资本储备）和声誉（Bezos 品牌、机构级投资人），但每一类重大风险都有可观察触发点；一旦越过，就会构成投资人的论点破裂事件。

              Prometheus 风险画像的主要强项是资本基础深：$18.2 billion 即便在不利算力成本和时间线情景下，也能提供可观跑道。Bezos 的个人可信度和亲自投入时间降低了关键人风险，但并未消除。与
              Bajaj 的联合 CEO 结构，在日常运营上提供了一定冗余。

              监管缓释仍处萌芽。Bezos 公开支持“合理”监管，并把药物开发和航空安全作为先例，但 Prometheus 没有披露与 FAA、EASA、FDA、BIS、CFIUS 或 EU AI Act
              公告机构的任何主动接触。这与产品前状态一致，但也带来一个风险：一旦产品开始测试版部署，公司可能不得不在时间压力下建立监管关系。

              算力风险部分由多供应商采购（AWS 加多个超大规模云服务商）缓释，也由 Bezos 对 Prometheus
              将成为大型云客户的预期缓释——这意味着可用合同规模换取优先分配。不过，公司没有披露可兜底的自有基础设施。

              应作为投资终止标准监测的论点破裂条件包括：Bezos 或 Bajaj 在首个商业产品发布前离职；BIS、CFIUS 或 EU DG COMP 采取任何执法行动或正式调查；到 2026
              年底仍未宣布至少一个具名工业数据伙伴；下一次资本事件出现降轮或无法融资；早期客户试点 中出现模型召回或安全事故；或在 series C 前仍未发布任何关于 sim-to-real 性能差距的技术验证。
