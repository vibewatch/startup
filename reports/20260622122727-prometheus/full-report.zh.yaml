      - number: '3.2'
        title: 既有工程软件供应商
        blocks:
          - type: paragraph
            body: >
              各工程软件既有厂商都在自身子市场拥有强势位置优势，并正积极转向 AI。Synopsys 在完成 $35B 收购 Ansys（2025 年 7 月）后，控制了芯片厂商和系统工程师日常依赖的 EDA +
              多物理场仿真组合栈。其 AI 产品组合——用于数字实现的 DSO.ai、用于半导体测试的 TSO.ai、用于模拟设计的 ASO.ai，以及 Microsoft 支持的 Copilot
              产品——意味着它在半导体设计周期内的 AI 辅助工作流上已有明显先发。Synopsys+Ansys 组合还覆盖结构、流体和电磁仿真领域，与 Prometheus 所称「人工通用工程」发生重叠。

              Autodesk（FY2026 收入 $7.21B，14,300 名员工）是机械和建筑 CAD/CAM/CAE 的主导既有厂商。其 Fusion 360 平台服务 460 万专业人士；Neural CAD 项目在
              AU 2025 发布，目标是用自回归 transformer 生成参数化 BREP 几何，从而自动化 80-90% 的常规设计任务，直接与 Prometheus 的软件渠道竞争。2026 年 2
              月，Autodesk 向 World Labs（Fei-Fei Li 的空间智能初创公司）投资 $200M，释放出要在设计层掌控物理世界 AI 的信号。

              Siemens Digital Industries Software 对智能体工程时刻的回应最激进。2026 年 4 月，Siemens 在 Hannover Messe 发布 Eigen
              Engineering Agent，并向 600,000 多名 TIA Portal 用户商业开放；该智能体可自主规划、编写自动化代码、配置系统，并迭代到满足基准，声称执行速度比手工流程快
              2-5x，工程效率最高提升 50%。Siemens 还收购 Altair（约 $10B），承诺向工业 AI 投入 €1B，并与 NVIDIA 建立战略合作。Dassault Systèmes 的
              3DEXPERIENCE 平台以 CATIA 和虚拟孪生体验锚定高端航空航天与汽车设计；Cadence（2025 年收入 $5.30B）通过收购 Hexagon 的 MSC Software 业务（2025 年
              9 月宣布，价格 $3.16B）和 Millennium Platform 数字孪生超级计算机，从 EDA 向多物理场扩展。PTC（2025 年收入 $2.74B）则通过 Creo 和 ThingWorx IoT
              在机械 CAD+PLM 领域竞争。
