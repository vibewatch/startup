        Public engineering/design software companies and private AI startups with disclosed valuations and partial
        revenue data as of June 2026; excludes private comps without disclosed valuations.
    rows:
      - - Autodesk (ADSK)
        - 上市 — 设计 / 工程软件
        - 市值 / TTM revenue / 隐含倍数
        - $40.9B / $7.5B / 约 5.5x
        - 最接近的上市可比公司 — 工程与设计软件龙头；Prometheus 零收入时市值几乎相同，而 Autodesk 有 $7.5B ARR
        - Prometheus 仍是收入前；Autodesk 拥有数十年企业关系；ADSK 同比下跌 36%，显示传统工程软件倍数压缩
      - - PTC (PTC)
        - 上市 — 工业软件 / PLM
        - 市值 / LTM revenue / 隐含倍数
        - $13.3B / $2.86B / 约 4.6x
        - 工业软件同业；收入增长 23.6%，是该类别增速最快的大市值公司
        - 市值远小于 Prometheus；PLM（产品生命周期管理）聚焦范围比 Prometheus 声称的 AGE 范围更窄
      - - Ansys (ANSS)
        - 上市 — 仿真软件
        - 市值 / 行业倍数
        - $33B / 约 4.8x NTM
        - 物理仿真是最接近 Prometheus Large-Physics-Model 野心的产品类比
        - Ansys 曾被 Synopsys 收购，交易终止；因 M&A 不确定性以压缩倍数交易；Prometheus 声称泛化范围比 Ansys 的仿真范围更广
      - - OpenAI
        - 私有 — 前沿 AI（语言模型）
        - Post-money valuation / annualized revenue / 倍数
        - $852B / $24B ARR / 约 35x forward
        - 有披露收入的最高倍数私有 AI 可比公司；为高端 AI 倍数划定上限
        - OpenAI 已确认 $24B ARR 和消费者规模；Prometheus 零收入；套用 OpenAI 倍数需要极激进的收入爬坡假设
      - - PhysicsX
        - 私有 — 物理 AI / 工业仿真
        - Series C 估值 / 增长指标
        - $2.4B / 收入同比翻倍 / 融资 $300M
        - 最直接的行业可比公司 — 面向工业工程的 physics-AI，由 NVIDIA 和 Siemens 支持，且已有确认的企业客户
        - Prometheus 相对 PhysicsX 有 17x 溢价；PhysicsX 披露了收入增长和企业客户；Prometheus 两者都没有
