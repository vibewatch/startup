      - number: '8.2'
        title: 可比公司与估值倍数
        blocks:
          - type: paragraph
            body: >-
              Prometheus 的 $41 billion 估值可用两组可比对象衡量：一组是它意图颠覆的公开市场工程与设计软件公司，另一组是资本结构和投资人预期相近的私有 AI 公司。


              公开市场方面，Multiples.vc 分析显示，设计与工程软件板块 2026 年 6 月交易中位数为 4.8x NTM 收入、11.6x NTM EBITDA。Autodesk
              是该板块收入规模最大的公司，市值约 $40.92 billion，过去 12 个月收入 $7.51 billion，隐含收入倍数约 5.5x；过去 12 个月市值缩水约
              36%，说明传统工程软件板块倍数在压缩而非扩张。PTC 是增长最快的大市值工程软件公司，LTM 收入增长 23.6%，市值 $13.25 billion，收入约 $2.86 billion，倍数为
              4.6x。Ansys 是技术形态最接近 Prometheus 声称要构建内容的仿真专家公司，市值约 $33 billion。


              按板块中位数 4.8x NTM 收入计算，Prometheus 需要约 $8.5 billion 近期 ARR 才能支撑 $41 billion 估值——这意味着在推出单个商业产品前，收入规模就要超过
              Autodesk 当前收入基数。即便套用与高速增长垂直 AI 相符的溢价倍数（比如 15–20x），Prometheus 仍需要 $2–2.7 billion ARR。这两个数字都没有任何公开证据支撑。


              私有市场方面，OpenAI 于 2026 年 3 月以 $852 billion 估值完成创纪录的 $122 billion 融资，并确认年化收入 $24 billion，隐含约 35x 前瞻
              ARR——这是所有披露收入的 AI 公司中最高的倍数。PhysicsX 是最直接的私有可比公司，这家 physics-AI 初创公司已实现确认收入同比翻倍、预订收入同比三倍增长，并获得
              NVIDIA、Siemens 和 Temasek 支持；它于 2026 年 6 月以 $2.4 billion 估值完成 Series C。Prometheus 没有披露收入，却比最接近的同业 PhysicsX
              贵 17x。这一溢价反映的是 Bezos 的信誉和机构资本获取能力，而非已记录的技术或商业优势。
