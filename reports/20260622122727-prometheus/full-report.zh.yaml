  - id: FE001
    title: Prometheus 物理 AI 技术栈
    type: stack
    summary: |
      根据联席 CEO 采访和报道推断出的 Prometheus 产品架构分层图。底层代表基础模型基础设施；上层代表客户会接触的工程工具界面和智能体接口。所有层级都来自报道或推断；Prometheus 未正式发布任何架构。
    approximationNotes: 架构根据 CNBC、GeekWire 和 Built In 报道推断；公司未发布官方架构文档。层级和标签是分析师重建，并非公司披露。
    data:
      layers:
        - id: L1
          label: 超大规模云计算（AWS，多云）
          description: 用于模型训练和推理的大规模 GPU 集群
          detail: 报道称 AWS 是主要计算资源提供方；Bezos 在 2026 年 6 月 CNBC 采访中称，大规模计算投入是 Prometheus 战略核心。
        - id: L2
          label: 物理世界训练数据管线
          description: 自行生成传感器日志、仿真输出、材料数据和遥测数据
          detail: 大规模生成物理世界数据是核心技术瓶颈；按每个训练 token 计算，物理数据成本比网页文本数据高 100-1000 倍。
        - id: L3
          label: 物理 AI 基础模型（世界模型）
          description: 在物理世界数据上训练的大模型，用于因果关系和仿真推理
          detail: 世界模型学习的是物理因果、材料行为和制造约束，而非语言；架构和规模未公开披露。
        - id: L4
          label: 多物理场仿真引擎
          description: 热、机械、流体和电磁仿真的推理层
          detail: AI 驱动仿真替代或增强传统 FEA/CFD 工具；无需人工设置仿真，也能自主迭代设计。
        - id: L5
          label: VLA 智能体层（Ace / General Agents）
          description: 使用视频-语言-动作模型的实时电脑控制智能体
          detail: 基于 General Agents Ace；ace-control-small 和 ace-control-medium 模型通过在屏幕演示上训练的 VLA 架构执行电脑任务。
        - id: L6
          label: 工程设计界面（规划中）
          description: 面向用户的 CAD 演进版软件工具，用于工程仿真和设计
          detail: Bajaj 将其描述为「非常现代的 CAD 版本」；截至 2026 年 6 月，公司未公开发布产品模型图或规格。
    claimRefs:
      - CE009
      - CE010
      - CE013
      - CE018
