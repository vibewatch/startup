      - number: '1.4'
        title: 里程碑、负面信号与尽调背景
        blocks:
          - type: paragraph
            body: >-
              Prometheus
              的时间线很短，但信息密度很高。截至运行日期，公司公开记录只有七个月，却已包含标志性融资、战略收购、商标纠纷、领导层披露和一波批判性媒体分析。本节锚定里程碑时间线，并标出后续尽调章节必须持续跟踪的负面信号。

              最重要的负面主题，是收入前阶段的估值过高。多位独立分析师和记者质疑，$41B 估值——零披露收入、没有商业产品、没有已知客户——究竟反映真实企业价值，还是 AI 叙事动能。AInvest
              发表了标题直指「Project Prometheus：零收入、无产品，却估值 $41B」的批评文章。IBTimes 担心基础科学和工程 AI
              集中在单一私营实体手中，可能形成「全球支配」。ComputerWorld 则质疑 Prometheus 路线究竟是在根本重塑 AI IT 策略，还是主要押注 Bezos 的个人品牌。

              次要负面信号是运营不透明。Prometheus 成立前六个月几乎没有对外披露；即便在 6 月 11 日公告之后，Bezos 和 Bajaj
              也拒绝提供产品时间表、拒绝说出试点客户姓名，只在内部基准之外提供很少技术细节。Bezos 在 Blue Origin 的同步职责也引发领导带宽问题——该公司一枚 New Glenn 火箭在 2026 年 5
              月下旬于发射台爆炸。加州律师 2025 年 12 月就「Project Prometheus」提起的商标纠纷只是轻微法律摩擦，并非阻断事项，但已记录在里程碑表中。研究集中未发现诉讼、监管调查或制裁。
