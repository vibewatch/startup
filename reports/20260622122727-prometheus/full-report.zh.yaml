      - number: '3.4'
        title: 切换成本、护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              工程软件既有厂商享有企业软件中最强的一类结构性切换成本：专有文件格式、绑定特定工具的监管验证历史、嵌入工具专用参数化模型中的数十年部落知识，以及经过深度培训的员工队伍。若一家制造商用 Ansys 仿真或
              CATIA CAD 取得航空航天生产认证，就无法在不经历多年重新认证的情况下切换验证基线——即便 Prometheus 以 AI 原生方式攻击同一工作流，这也为既有厂商创造了强大的装机基础护城河。

              Prometheus 的护城河叙事建立在「世界模型」或基础物理 AI 模型这个专有资产之上。若公司成功训练出可跨航空航天、半导体、汽车、药物开发等领域泛化的 Large Physics
              Models（LPMs），模型本身就会成为持久资产；考虑到专有训练数据、仿真资产和工程 IP 的组合，既有厂商很难复制。收购 General Agents 带来了 VLA
              模型能力，可从仿真延伸到物理操作，或许能让世界模型植根于真实传感运动经验，而不仅是仿真生成数据。

              风险很实质。工业场景中的企业 AI 采用落后于预测：2026 年发布的研究显示，主要失败模式不是模型能力，而是部署方法——数据就绪缺口、遗留系统集成（工程工作量比初始估计高 3-4x）和组织变革管理。考虑
              Prometheus 产品的买方，将面对同样阻碍其他企业 AI 大规模部署的障碍。既有厂商拥有决定性分发优势：Siemens 的 Eigen Engineering Agent 在商业开放第一天就触达
              600,000 名 TIA Portal 用户。Prometheus 必须从零建立分发。商品化风险不低：如果 NVIDIA 的 NemoClaw Blueprint 让五大既有厂商在 12-18
              个月内都推出自主工程智能体，Prometheus 建立持久产品差异化的窗口会显著收窄。Prometheus 已融资 $18.2B（Pre 轮与 Series
              B）可通过基础设施投资和潜在收购部分抵消这一点，但资本不能替代嵌入式分发。
            claimRefs:
              - CP029
