              - CU004
              - CU012
              - CU040
          - type: callout
            title: 工业数据护城河和监管认证带来 3–5 年采用延迟风险
            body: >-
              两道结构性障碍可能把商业客户获取推迟数年。第一，自有设计数据——Prometheus 训练更强模型所需的燃料——存在制造商系统内部，而制造商有很强的竞争理由不愿共享。Tech-Insider
              分析称这是“一个五年问题”。第二，FAA 和 FDA 对受 AI 影响的航空航天和药物设计有认证要求，可能把 Prometheus
              四个主要目标领域中的两个挡在门外，直到监管框架跟上。这些障碍意味着，Prometheus 在第一个商业窗口可能只能被限制在汽车和芯片设计，近期 TAM 会明显变窄。
            calloutType: risk
            claimRefs:
              - CU026
              - CU027
              - CU028
              - CU032
              - CU034
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Prometheus 面对多层监管和法律威胁，而且这些威胁演变速度快于其产品路线图。三套不同制度在其核心技术上交汇。

              **出口管制。** 美国 Bureau of Industry and Security（BIS）在 2025 年 5 月撤销了 Biden 时代的 AI Diffusion
              Rule，但同时发布新指南，警示行业先进计算 IC 被转移给 PRC 行为方的风险，并对用于支持大规模杀伤性武器或军事情报最终用途的模型权重施加 catch-all 管制。替代规则即将出台。Prometheus
              明确瞄准航空航天、芯片设计和先进制造——这些正是吸引出口管制审查的军民两用领域。London 和 Zurich 办公室带来持续跨境技术转移义务；即使美国 export-diffusion rule 已撤销，来自
              D:5 国家国民的任何员工或云服务访问，也可能触发 catch-all 管制下的许可证要求。Prometheus
              生成的自有训练数据编码了物理世界工程知识（涡轮叶片空气动力学、半导体工艺参数、材料疲劳极限），因此替代规则发布后，模型权重本身可能被归类为 ECCN 4E091 下的受控出口。

              **EU AI Act 与产品责任。** EU Directive (EU) 2024/2853 必须在 2026 年 12 月前由 EU Member States 落地，且明确把软件（包括云交付
              AI）列为承担严格责任的产品。设计安全关键硬件（飞机发动机、桥梁、药品）的工程 AI 系统，在 EU AI Act
              下属于“高风险”，进入市场前需要合格评定、强制人工监督安排、审计轨迹和透明度义务。Prometheus 产品尚未发布，看起来也尚未进入任何合格评定流程。EU 责任指令还移除了历史上的软件服务豁免：如果
              Prometheus 设计的部件失效并造成损害，Prometheus（以及任何集成商或部署方）面临严格责任，索赔方无需证明疏忽。这条责任链尚未被检验，但鉴于目标应用，影响重大。

              **IP 所有权与商标。** 美国和 EU 现行专利法都不承认 AI 可作为发明人，使 AI 生成工程设计在不同司法辖区的所有权问题悬而未决。如果 Prometheus
              工具产出新颖设计，谁持有——或能执行——这些输出的 IP 权利，法律上仍不确定，可能削弱关键价值主张。2025 年 12 月还出现商标争议：一名 California
              律师此前已用同一名称提交商标申请；争议尚未公开解决。反垄断关注正在上升：据报道，Prometheus 正寻求一个 $100 billion 关联基金来收购工业公司，这种 Berkshire 式垂直整合会把 AI
              模型、算力、制造知识和工业现金流集中到同一伞下——European 和 U.S. 竞争机构近年来在 Big Tech 语境下越来越审查这种结构。
