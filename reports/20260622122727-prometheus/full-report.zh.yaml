  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Prometheus 进入的是一个由三层重叠力量定义的市场。第一层是成熟的工程软件寡头——Synopsys（2025 年 7 月完成 $35B 收购 Ansys）、Autodesk、Siemens Digital
              Industries Software（以约 $10B 收购 Altair）、Dassault Systèmes、Cadence Design Systems 和 PTC。这些既有厂商合计服务数十万家工程组织，其
              CAD、CAM、CAE、EDA 和 PLM 工具深度嵌入客户流程。它们的切换成本结构性很高：工作流、文件格式、培训管线和监管验证都绑定在特定工具上。六家既有厂商都在积极把 AI——包括自主智能体——嵌入平台，其中
              Siemens 的 Eigen Engineering Agent（2026 年 4 月）和 Autodesk 的 Neural CAD（AU 2025
              发布，限量开放）是对智能体工程命题最直接的战术回应。第二层是 NVIDIA。其 NemoClaw Blueprint 参考架构为任何 ISV 构建自主 AI
              工程师提供脚手架，可把数周仿真压缩到数小时。NVIDIA 提供底层基础设施，既与 Prometheus 关于独立人工通用工程师的愿景竞争，也同时降低了市场命题的不确定性。第三层是 AI
              原生工程初创公司。PhysicsX 是最清晰的直接同类：一家 AI 原生平台公司，面向航空航天、汽车、半导体和能源部署 Large Physics Models（LPMs），2026 年 6 月 8 日完成
              $300M Series C，估值 $2.4B，NVIDIA 和 Siemens
              是战略支持方。现状——人类工程师借助传统有限元分析（FEA）和计算流体动力学（CFD）工具运行数小时到数天——仍是主导工作流，也是最常见替代方案。内部自建（企业委托替代模型开发团队）和外部咨询公司也构成额外替代路径。Prometheus
              的「人工通用工程师」叙事瞄准的是这些之上的一层：一个跨领域、由世界模型支撑的 AI，能端到端规划、仿真和验证物理设计且无需交接，目前没有既有厂商真正交付。
