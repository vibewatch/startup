  - id: TU001
    title: 客户细分表
    columns:
      - 细分市场
      - 买方 / 用户 / 付款方
      - 用例
      - 规模 / 战略价值
      - 缺口
    rows:
      - - 航空航天（航天器、火箭、喷气发动机）
        - 主机厂（Boeing、Lockheed、Blue Origin、SpaceX）和一级供应商的工程团队；付款方是 R&D 预算负责人
        - 推进系统、机体和航空电子设备的设计与仿真提速
        - 很高 —— 全球航空航天 R&D 超过 $100B；设计周期 5–15 年；Blue Origin 是 Bezos 点名的案例客户
        - 没有具名买方；AI 影响的设计要飞行，先要 FAA 认证；既有 PLM 根基很深
      - - 汽车（EV 和 ICE 系统）
        - OEM（Ford、GM、Toyota、BMW、Tesla）和一级供应商的工程团队；付款方是 R&D 预算
        - 车辆部件、动力总成和底盘设计提速
        - 高 —— 全球汽车 R&D 约 $150B；EV 转型压力推高设计速度要求
        - 没有具名买方；Siemens NX 是汽车 OEM 的默认选择；AI 设计工具需要 ISO 26262 功能安全认证
      - - 半导体芯片设计
        - 无晶圆厂设计公司（Qualcomm、AMD）、IDM（Intel）、代工厂（TSMC）的 EDA 和芯片设计团队；付款方是工程预算
        - 压缩芯片设计周期；加快流片；优化数据中心芯片
        - 很高 —— 半导体市场超过 $600B；设计周期 12–36 个月；Bezos 在 CNBC 点名芯片设计
        - 没有具名买方；Synopsys 和 Cadence 依靠专有工具链与 IP 主导 EDA；与外部 AI 共享数据会带来重大 IP 泄露风险
      - - 制药 / 药物发现
        - 大型药企（Pfizer、Roche、J&J）和生物科技公司的研究团队；付款方是 R&D 预算；用户是计算化学家
        - 分子设计、蛋白质仿真和药物制造流程优化
        - 很高 —— 全球制药 R&D 约 $250B；药物开发平均需要 10–15 年
        - 没有具名买方；临床应用需要 FDA 批准；IND/NDA 流程若没有验证包，不会认可 AI 设计工具
      - - 云基础设施和数据中心（推测）
        - 超大规模云厂商（AWS、Google、Microsoft、Meta）的基础设施工程团队；付款方是资本开支预算
        - 数据中心芯片和机架设计；散热与电力优化
        - 高 —— 超大规模云厂商资本开支预计 2026 年超过 $400B；Bezos 在 CNBC 提到数据中心
        - 并非正式声明的细分市场；Amazon 牵涉其中会带来利益冲突观感；没有具名买方
      - - 土木工程和基础设施（愿景型）
        - 桥梁、建筑和工业厂房工程公司；Bezos 在访谈中提到桥梁
        - 结构设计优化和快速原型
        - 中 —— 市场大但分散；销售周期更长；付费意愿较低
        - ICP 适配证据最弱；更可能是愿景，而非近期 TAM
    notes: 所有细分市场都来自公开联合创始人访谈中公司声明的 ICP 定位；截至 2026 年 6 月 22 日，Prometheus 未披露收入数据、具名买方或定价信息。
