      - number: '2.2'
        title: 市场规模测算视角
        blocks:
          - type: paragraph
            body: >-
              公开分析师报告尚未直接测算 Prometheus 专属机会，因此市场规模需要多视角拆解。最外层边界是全球工程与研发（ER&D）支出。Bain & Company 2023 年对 500 多名高管的调查预测，全球
              ER&D 支出到 2026 年将达到约 $3.5T 至 $4T，CAGR 为 10%；数字工程投资的 CAGR 为 19%，几乎是整体增速的两倍。该数字同时包含软件工具、硬件、测试、验证和临床试验中的内部与外包
              ER&D。它可作为估值上限背景，但本身不是 Prometheus 的 TAM。


              直接相关的工程软件市场在 2026 年合计超过 $110B，涵盖 PLM（$50.17B）、仿真（$30B）、工业软件（$29.25B）和 AI EDA（$4.27B）。其中，产品设计与工程中的生成式 AI
              子市场——最接近 Bezos 所称「非常非常现代的 CAD」的层——Fortune Business Insights 估算 2026 年为 $7.02B，并以 24% CAGR 增至 2034 年
              $39.12B。芯片设计与验证的 AI EDA 子板块增长更快，从 2026 年 $4.27B 基数按 24.4% CAGR 扩张。Information Matters 估算智能体 AI
              市场——自主执行工作流的 AI 在软件层面最宽泛的框架——2026 年为 $40B（区间 $33-$48B）。


              最接近 Prometheus 的公开 SAM 代理，是产品设计中的生成式 AI（$7B）加 AI EDA（$4.27B）这一层，2026 年约 $11B。但 Prometheus
              的既定野心不只是软件工具，而是跨航空航天到制药等行业端到端自动化工程工作流，这意味着随着产品成熟，可触达市场可能显著扩张。由于 Prometheus 尚未披露目标垂直、定价模型或商业管线，无法用公开数据可靠构建
              SAM 和 SOM。
