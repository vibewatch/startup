  - id: TV005
    title: 论点破裂与否决触发项
    columns:
      - 触发项
      - 门槛 / 可观察事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 首个商业客户公告
        - 2026 年底前，除 Blue Origin 外未披露任何具名付费客户
        - 证实「人工通用工程师」更像内部工具，而非具备商业可行性的产品；移除乐观情景的核心 ARR 假设
        - 将估值修正为内部工具情景；基准情景倍数压缩；重新评估是否持有
      - - 12 个月节点人员收缩
        - 到 2026 年 12 月，150 人团队中超过 15% 的技术领导层离职
        - 一家 150 人公司已融资 $18.2B，若技术骨干大幅离开，说明路线图失灵或内部冲突；执行可信度被击穿
        - 立即升级尽调；若离职者包括联合创始人或首席研究员，则构成论点破裂信号
      - - 训练数据访问被拒
        - 主要航空航天、半导体或汽车 OEM 公开拒绝 Prometheus 的数据共享请求，或竞争对手（Siemens、ANSYS）宣布独家数据合作
        - 直接削弱模型性能护城河；没有专有训练数据，Prometheus 只能在通用物理仿真上竞争，而这已被现有厂商覆盖
        - 投资论点受到实质损害；重新评估防御性和竞争定位
      - - AI 辅助工程遭监管执法
        - FAA 或 FDA 发布负面指引，阻止 AI 生成设计取得认证资格，或要求 AI 供应商按错误承担责任
        - 最高价值用例（航空航天部件、药物化合物）被移除；Prometheus 被迫退回监管较轻、TAM 更小的工业应用
        - 情景向基准压缩；重新评估可触达市场假设
      - - $100B 制造业基金未能关闭
        - 据报道该基金停在目标规模 25% 以下，或 Bezos 公开放弃制造业收购策略
        - 垂直整合的绑定客户论点消失；Prometheus 变成软件供应商，必须在企业销售中对抗根深蒂固的现有厂商
        - 下调乐观情景概率；基准情景现在比乐观情景更可能
    notes: 触发器可从公开披露、媒体报道和监管公告中观察。时间线仅作指示；具体门槛应由尽调负责人设定。
    claimRefs:
