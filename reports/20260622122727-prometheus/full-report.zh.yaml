chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与产品
        blocks:
          - type: paragraph
            body: >-
              Prometheus 是一家美国人工智能初创公司，2025 年 11 月以「Project Prometheus」名义注册，2026
              年缩短为「Prometheus」。公司总部位于加州旧金山，并在伦敦和苏黎世设有运营办公室。创始人把这家公司描述为在打造「人工通用工程师」——一组 AI
              工具，意在把工程全流程从初始概念、仿真、原型，到可制造产品全部自动化，并大幅压缩周期。

              产品命题刻意拉得很宽。Bezos 和 Bajaj 把目标指向任何工程周期以年而非月计的复杂物理系统：喷气发动机、半导体制造设备（以 ASML
              为例）、汽车动力总成、太阳能电池制造、电池技术、土木工程结构、航空航天部件和药物化合物。公司明确表示，这套 AI
              不面向软件工程，也不制造机器人；工具的目标是替代或加速多学科仿真、设计迭代和物理验证，让现有人类工程师的生产力提升一个数量级以上。

              Prometheus 把自己的路线与大语言模型区分开来：物理 AI 需要来自真实实验、仿真和制造流程的专有训练数据，而不是支撑 LLM 的互联网规模文本语料。Bezos 在 2026 年 6 月 11 日
              CNBC 访谈中说：「我们必须创建自己的数据集……训练数据和你们熟悉的 LLM 能拿到的数据完全不同。」这让公司的数据创建策略成为其最主要的护城河主张。截至 2026 年 6
              月，公司尚未公开发布任何产品，没有已知商业客户，也只用内部基准来证明技术进展。
