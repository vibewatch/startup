      - number: '6.4'
        title: 采用障碍与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Prometheus
              与第一个付费客户之间有三道结构性障碍：自有数据、监管认证和既有厂商盘踞。数据障碍最尖锐。工业设计数据——从半导体制造规格到航空航天部件公差——都在制造商的自有系统内；这些制造商有很强的竞争理由，不愿与一家可能成为供应商、竞争对手或收购方的
              Bezos 创业公司共享。Tech-Insider 分析把这称为“一个五年问题，而不是产品发布决定”。航空航天和制药的监管障碍很重：任何受 AI 影响的航空航天部件设计都必须通过 FAA 认证，药物设计 AI
              的临床应用则面对 FDA 审批要求。如果 Prometheus
              的输出在受监管行业里传播出设计建议错误，就会产生产品责任敞口；分析师认为，现有保险产品不覆盖这种责任。既有厂商障碍同样很深：Autodesk、Siemens NX、Dassault Systèmes
              SOLIDWORKS、PTC Creo 和 Ansys 控制着工业工程软件的文件格式、历史设计数据仓库、监管批准认证和信任关系。这些既有厂商已经把 AI 集成进自家工具，并利用数十年装机基础分销——工程院校教
              AutoCAD，Siemens NX 则是汽车 OEM 的默认选择。Prometheus 要么证明结果显著更好，要么克服本就设计得很高的切换成本。Deloitte 2026 State of AI in the
              Enterprise 报告发现，58% 的公司以某种形式使用物理 AI，但只有 34% 的企业 AI 部署真正重塑业务流程；这凸显出，即便是成熟产品，深度工业采用也很难。
