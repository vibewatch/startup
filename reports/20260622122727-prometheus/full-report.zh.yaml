      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Prometheus 的人才基础按风投标准非常强——研究员来自 OpenAI、DeepMind、Meta、NVIDIA 和 Anthropic——但风险集中在两位关键人物身上，加上前沿 AI
              人才市场竞争激烈，形成实质执行敞口。

              **关键人集中。** Bezos 和 Bajaj 共同担任 CEO，且没有披露继任计划。Bezos 同时对 Amazon（执行董事长）、Blue Origin（2026 年 5 月火箭爆炸后深度参与运营）和
              Bezos Earth Fund 承担重大承诺。如果 Bezos 降低 Prometheus 优先级，投资人信心和人才留存可能快速恶化。Bajaj 带来生命科学 AI 和 Verily
              时代经验，短期内很难替代。150 人的 stealth-mode 公司采用联合 CEO 结构，也是一种不寻常治理安排，可能带来战略错位。

              **人才留存与竞争性挖角。** 2026 年 AI 人才市场处于高强度峰值。Prometheus 与 Anthropic、OpenAI、DeepMind、xAI、Meta FAIR 和 NVIDIA
              Research 争夺同一批研究员。创立时看似有吸引力的薪酬包，可能被 OpenAI IPO 或竞争性物理 AI 实验室 抬价超过。哪怕只有少数高级研究负责人离开，也可能削弱模型开发路线图。

              **保密与文化风险。** 员工受严格保密协议约束，截至 2026 年 6 月，公司没有公开网站或技术论文。隐身模式
              是竞争工具，但也可能遮住内部文化或协同问题；这些问题可能在关键产品交付节点爆发。近期从“Project Prometheus”转向“Prometheus”，以及公开亮相 CNBC，都是外部沟通压力上升的早期信号。

              **规模错配。** 用 150 人打造一个能以可认证质量设计喷气发动机的工程 AGI 系统，范围与人员比例非常大胆。可比深科技 公司（例如上一代航空航天仿真公司）仅为覆盖领域就需要 500–2,000
              名工程师。如果 Prometheus 需要把人员规模扩大 5–10x 才能交付广域覆盖，人才获取和整合挑战会同比放大。
            claimRefs:
