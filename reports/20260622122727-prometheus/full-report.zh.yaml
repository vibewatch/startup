        - id: jm2
          label: 资格评估
          detail: 工程团队将 Prometheus 与既有工具（Autodesk Fusion、Siemens NX、Ansys）对比，评估 AI 设计工具能否解决具体周期瓶颈。
          tone: warning
        - id: jm3
