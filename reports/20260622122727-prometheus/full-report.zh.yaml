            body: >-
              Bezos 最具体的财务披露是，Prometheus 从设计上就是资本密集型公司，Series B 的很大一部分会投向两类事项：算力基础设施，以及为物理世界 AI 构建专用训练数据。两类成本都未公开量化。以前沿
              AI 实验室的可比基准推算，一个 150 人团队，拥有 $18B+ 资本基础，并承担建设专有算力集群和物理世界数据管线的任务，年化烧钱率落在 $1–3B 区间并不违和。低端意味着每月约
              $80–100M；高端为每月 $200–250M。这些估算来自融资规模、员工数和可比前沿 AI 实验室披露，而不是 Prometheus 披露。作为对比，Anthropic 披露 FY2024 约 $2.7B
              运营亏损，员工约 1,000 人；OpenAI 在更大规模下年烧钱超过 $5B。Prometheus 的人均资本基础（约每名员工 $120M）为行业最高，说明大量资金可能分配给算力，而非薪酬。2025 年 11
              月收购 General Agents 增加了未披露但可能较小的现金支出。营运资本和资本开支需求有限——Prometheus 是软件与 AI 实验室，不是制造商——但算力采购可能涉及与云服务商或 GPU
              集群签订长期合同，从而形成多年固定成本义务。公司尚未披露毛利率目标、R&D 预算拆分或供应商合同条款。
