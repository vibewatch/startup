      - number: '8.4'
        title: 建议、信心、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              总体建议是继续研究。投资论点在结构逻辑上可信——创始人溢价、机构资本质量、巨大可寻址市场，以及“物理 AI 作为基础设施”的叙事都是真实的——但以 $41 billion
              估值建立确信所需的尽调包并未公开。公开记录中没有经审计收入、毛利率、客户合同、股权结构优先权堆栈、烧钱率数据或独立产品基准。Bezos 明确表示，现在披露 Prometheus
              已构建内容还“为时过早”；Bajaj 也没有给出产品时间表。要价在首个商业客户协议之前就等于 Autodesk 的全部市值。


              估值立场是昂贵。Prometheus 以零收入获得 $41 billion 估值，只有在公司已经接近 $1.2 billion ARR（按 OpenAI 的 35x
              前瞻溢价倍数）时才说得通；或者说，投资人正在为没有公开证据支撑的多年阶跃式收入增长定价。即便按板块中位数 4.8x NTM 收入计算，所需 ARR 也达 $8.5 billion，会让 Prometheus
              在交付首个商业合同前就比今天的 Autodesk 更大。7 周内估值上调 $3 billion 且没有披露里程碑，进一步支撑“昂贵”的判断。


              风险评级为高。关键风险包括：以 $41 billion 入场价计，公司收入和产品牵引为零；数据获取难题（专有制造商仿真数据集是核心训练输入，而所有者有强烈竞争动机不共享）；FAA 和 FDA
              监管行业的复杂监管，AI 生成工程建议会带来新的责任暴露；Bezos 关键人物集中；以及私有市场流动性风险——截至 2026 年 6 月，IPO
              被描述为“想这个还太早”。对建议的信心为中等：结构性证据扎实，但对估值最关键的三个变量（收入、利润率和财务可持续性）完全不公开。
