  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: wide
    summary: 从可获得的公开证据信号推导到「继续研究」建议，展示创始人溢价、机构资本、市场规模、收入不透明和可比倍数如何共同作用。
    data:
      nodes:
        - id: founder
          label: 创始人信号：Bezos 担任联席 CEO（离开 Amazon 后首次担任运营角色）；Bajaj 曾任职 Verily；顾问包括 Attention-Is-All-You-Need 共同作者
        - id: capital
          label: 资本信号：累计融资 $18.2B；Series B 估值 $41B，投资方包括 JPMorgan、BlackRock、Goldman Sachs、DST Global、Arch
        - id: market
          label: 市场信号：物理 AI TAM 约 $81.4B（2025 年），CAGR 约 33%；物理护城河比纯软件 AI 更容易防守
        - id: revenue
          label: 收入缺口：披露 ARR 为零；除 Bezos 关联的 Blue Origin 外，没有具名商业客户
        - id: comps
          label: 可比背景：$41B 相当于 ARR 为 $7.5B 的 Autodesk 市值；PhysicsX 估值 $2.4B 且披露收入增长；OpenAI 在已确认 $24B 收入下约为 35x ARR
        - id: risk
          label: 风险叠加：数据获取挑战；FAA/FDA 监管不确定性；治理不透明；关键人物集中于 Bezos
        - id: rec
          label: 建议：继续研究——论点可信，Bezos 溢价真实存在，但若要对 $41B 估值形成确信，需要公开市场拿不到的私有收入数据
      edges:
        - source: founder
          target: comps
        - source: capital
          target: comps
        - source: market
          target: comps
        - source: revenue
          target: comps
        - source: comps
          target: rec
        - source: risk
          target: rec
    approximationNotes: 该流程是建议推理链的逻辑表达，不是财务模型。证据节点反映截至 2026-06-22 可获得的最佳公开信息。
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV011
      - CV034
      - CV035
  - id: FV002
    title: 收入和倍数假设下的 Prometheus 隐含公允价值
    type: bar
    layout: wide
    summary: 展示不同 ARR 情景和行业倍数下的隐含公允价值（十亿美元）；当前 $41B 的 Series B 标记估值作为参照，显示其高出所有基准情景有多远。
    data:
      items:
        - label: $100M ARR × 4.8x（行业中位数）
          value: 0.5
        - label: $300M ARR × 4.8x（行业中位数）
          value: 1.4
        - label: $1B ARR × 4.8x（行业中位数）
          value: 4.8
        - label: $1B ARR × 35x（OpenAI 溢价）
          value: 35
        - label: $2B ARR × 35x（OpenAI 溢价）
          value: 70
        - label: Series B 参考估值（零 ARR）
          value: 41
    approximationNotes: >-
      ARR 情景只提供方向感；Prometheus 没有公开收入数据。行业中位数（4.8x）来自 Multiples.vc 2026 年 6 月设计与工程类别。OpenAI 溢价（35x）来自 CNBC 2026 年 3
      月确认的收入和估值。所有数值单位均为十亿美元。
    claimRefs:
      - CV015
      - CV016
      - CV019
      - CV020
      - CV030
      - CV031
  - id: FV003
    title: 不同情景下的估值与回报区间
    type: range
    layout: standard
    summary: 基于情景假设和可比公司倍数推导 Prometheus 的牛市、基准和熊市估值区间；展示 Series B 标记估值与受证据约束的基准 / 熊市情景之间的巨大分歧。
    data:
      items:
        - label: 牛市（2027 年 ARR $1–2B，30–50x 溢价倍数）
          low: 30
          high: 100
        - label: 基准（2027 年 ARR $100–300M，15–25x 压缩倍数）
          low: 1.5
          high: 7.5
        - label: 熊市（商业牵引力极低，计算 / IP 底价）
          low: 3
          high: 8
        - label: Series B 参考估值（2026 年 6 月）
          low: 40
          high: 42
    approximationNotes: 区间只提供方向感，不是目标价格。牛市情景要求产品公开演示前就同时拿下多个商业胜利。基准情景与典型工业 AI 采用时间线相符。所有数值单位均为十亿美元。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: FV004
    title: 投委会多维评分
    type: kpi
    layout: standard
    summary: 面向投委会的 Prometheus 八维评分，范围 0–10；反映公开证据质量，并突出结构吸引力与财务可验证性之间的缺口。
    data:
      items:
        - label: 市场机会
          value: 9
          unit: /10
        - label: 创始人 / 团队可信度
          value: 9
          unit: /10
        - label: 机构投资人质量
          value: 8
          unit: /10
        - label: 竞争护城河（产品前）
          value: 5
          unit: /10
        - label: 收入可见性
          value: 1
          unit: /10
        - label: 产品牵引力
          value: 1
          unit: /10
        - label: 估值风险调整
          value: 2
          unit: /10
        - label: 治理与披露质量
          value: 3
          unit: /10
    approximationNotes: >-
      评分是基于本章审阅公开证据作出的定性评估。Prometheus 完全没有财务或产品披露，因此收入可见性和产品牵引力得分较低。估值风险调整反映 $41B Series B
      相对于可比证据所隐含的溢价。竞争护城河反映资本和团队带来的结构性优势，但未解决的数据获取挑战抵消了一部分优势。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV011
      - CV034
      - CV035
      - CV036
