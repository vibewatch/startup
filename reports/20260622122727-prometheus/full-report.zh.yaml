      - number: '6.2'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: >-
              Prometheus 的公开客户记录只有一个具名组织——Blue Origin——但 Bezos 在 2026 年 6 月 11 日 Axios 采访中称其为“Prometheus
              客户案例研究”，不是付费客户。Blue Origin 是 Bezos 的航空航天公司，因此不是独立参考；这段关系是联合创始人自我点名的潜在用例，不是公平交易的商业部署。同日 Inc.com
              报道还补充说，Bezos 告诉 The New York Times，这项技术“最终可用于改进 Blue Origin 的流程”。除此之外，Bezos 在 CNBC 把 Amazon 描述为一家“可以与”
              Prometheus 合作的公司——同样只是愿景性、非合同性表述。2025 年 11 月被收购的 General Agents Inc. 有时被当作客户关系引用，但它实际上是技术收购，不是商业客户。截至 2026
              年 6 月 22 日，没有收入、没有已签合同、没有部署证明、没有客户引用证言，也没有第三方评测 Prometheus
              工具。覆盖该公司的分析师明确把首个具名客户公告列为验证执行力的关键信号；在该公告出现之前，整个客户叙事都压在 CEO 的一句自我指涉表述上。相比之下，Prometheus 在工业工程物理 AI 领域的直接竞争对手
              PhysicsX，截至 2026 年 6 月客户数同比翻倍，并产生已确认收入——这说明在同一细分市场里，真实工业 AI 客户牵引力是什么样。Prometheus 缺少任何类似证明，这是重大缺口。
