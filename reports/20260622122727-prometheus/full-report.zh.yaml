      - number: '1.3'
        title: 资本基础、融资历史与投资方
        blocks:
          - type: paragraph
            body: >-
              Prometheus 的融资速度和规模，即使放在前沿 AI 领域也异常突出。公司在 2025 年 11 月启动时完成首轮 $6.2B 融资——科技史上最大规模的种子轮或 Pre-Series A
              轮之一——Jeff Bezos 是最大单一支持者。各来源并未都把这笔首轮正式标记为 Series A，但媒体普遍将其视作公司的创始资本事件。

              2026 年 6 月 11 日，公司在 CNBC 的 David Faber 访谈中宣布，以约 $41B 的投后估值完成 $12B Series B。GeekWire 援引 Axios 称，Series B
              投资方包括 JPMorgan、Goldman Sachs、BlackRock、DST Global 和 Arch Venture Partners。Bezos 再次以个人身份参投。公司成立约七个月内累计融资已超过
              $18B——同龄公司几乎没有可比的融资轨迹。Bezos 将业务描述为「资本密集型」，并确认相当一部分资金会投向算力基础设施和专有训练数据创建。

              另一个仍在成形的资本故事，是关联控股公司的策略。Financial Times 2026 年 2 月报道称，Prometheus 正在寻求「数百亿美元」资金，用于设立一家控股载体，收购 Bezos 和 Bajaj
              认为会被工业 AI 颠覆的传统工业公司。Bezos 在 6 月 11 日确认，Prometheus「可能收购公司的部分业务」并帮助其改善制造。该潜在计划的规模尚未确认，细节也很稀疏；若落地，将显著扩大
              Prometheus 的财务足迹和战略复杂度。IPO 讨论尚未启动；Bezos 称「现在考虑还太早」。
