      - number: '8.5'
        title: 论点破裂触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Prometheus 投资案可通过五个可观察触发点跟踪。第一，任何 Blue Origin 之外的具名商业客户公告，都会把叙事从愿景推向执行，是近期最重要的信号。第二，Prometheus 成立 12
              个月时的员工规模（目标时间为 2026 年 12 月）：一家融资 $18.2 billion、拥有 150 人的公司，如果出现人员流失，将指向路线图问题或领导层内部分歧。第三，FAA 或 FDA 对 AI
              辅助工程设计披露任何监管机构评论或指南，将定义 Prometheus 最高价值工业用例的时间线和责任框架。第四，单独的 $100 billion
              制造业收购基金状态：成功交割并完成首笔收购将验证纵向整合论点；如果无法交割，Prometheus 将被压缩成一家没有 captive 客户群的 AI
              工具供应商。第五，与大型制造商（航空航天、半导体、汽车）宣布任何数据获取合作，确认可获得模型所需的专有训练数据集。


              最终尽调问题集中在五个领域：财务透明度（当前 ARR、烧钱率、毛利率、按当前支出计算的预计 runway）；商业牵引（Blue Origin 之外的具名客户、任何已签合同、收入
              backlog）；股权结构和优先权堆栈（清算优先权、反稀释条款、二级市场估值）；产品基准（Prometheus AI 输出相对于 Siemens、ANSYS 或可比工具物理仿真的任何第三方性能数据）；以及
              $100 billion 收购基金结构（法律实体、投资人承诺、目标制造商，以及与 Prometheus AI cap table 的关系）。
