  - id: FM003
    title: 买方细分准备度矩阵
    type: matrix
    layout: wide
    summary: 从现有支出水平和已验证的工程人才、周期压力看，航空航天与防务、汽车是 Prometheus 最高优先级的细分市场；半导体和制药拥有大额研发预算，但需要针对领域的信任验证。
    data:
      columns:
        - 预算规模
        - 上市时间压力
        - 数据治理准备度
        - IP / 监管风险
      rows:
        - label: 航空航天与防务
          values:
            - label: 很高
              tone: positive
              detail: 仅美国国防部 FY2026 研发预算请求就达 $179B；A&D 行业收入在 2025 年突破 $1T。
            - label: 很高
              tone: positive
              detail: 超过 15,000 架商用飞机积压订单，以及防务积压订单增长超过 50%，造成尖锐的周期时间压力。
            - label: 低
              tone: warning
              detail: ITAR/EAR 管制、涉密数据和本地部署要求；防务云需要 FedRAMP 授权。
            - label: 很高
              tone: warning
              detail: 出口管制、国家安全审查和安全认证，为 AI 部署设置高门槛。
        - label: 汽车与出行
          values:
            - label: 高
              tone: positive
              detail: 汽车是最大的 PLM 细分市场，收入占比 26.86%；EV 转型带来巨额研发预算。
            - label: 高
              tone: positive
              detail: EV 产品周期、CAFE 标准和竞争压力要求更快设计与仿真。
            - label: 中
              tone: neutral
              detail: 全球 PLM 部署已成熟，但云迁移仅占收入 43%；数据治理正在改善。
            - label: 中
              tone: neutral
              detail: ITAR 适用性低于防务；安全关键型认证仍然必需；欧洲还有 GDPR。
        - label: 半导体与电子
          values:
            - label: 高
              tone: positive
              detail: 2026 年 AI EDA 市场为 $4.27B；主要芯片公司在设计自动化上投入数十亿美元。
            - label: 很高
              tone: positive
              detail: 消费电子产品生命周期为 12-18 个月；AI 加速有清晰 ROI。
            - label: 中
              tone: neutral
              detail: 部分工作流中的 EDA 工具已是云原生；芯片设计的 IP 敏感度很高。
            - label: 高
              tone: warning
              detail: 芯片 IP 高度敏感；先进半导体出口管制增加复杂性。
        - label: 制药与生命科学
          values:
            - label: 高
              tone: positive
              detail: 到 2026 年，AI 药物发现市场接近 $6.7B；制药研发预算位居最高梯队。
            - label: 中
              tone: neutral
              detail: 药物开发周期以年计；AI 加速有价值，但不如 A&D 积压订单压力那样迫切。
            - label: 低
              tone: warning
              detail: 临床和分子数据治理受到严格监管；云 PLM 需符合 FDA 21 CFR Part 11。
            - label: 很高
              tone: warning
              detail: FDA、EMA 和 GxP 合规要求；临床试验数据主权；IP 保护关键。
        - label: 工业与先进制造
          values:
            - label: 中
              tone: neutral
              detail: 2026 年工业软件市场为 $29.25B；市场广但分散在大量 SME 和主承包商之间。
            - label: 中
              tone: neutral
              detail: 工业 4.0 数字化压力真实存在，但不如航空航天积压订单或制药管线压力紧迫。
            - label: 中
              tone: neutral
              detail: 2025 年 47% 的制造商升级到 AI 集成平台；云采用率为 58%。
            - label: 低
              tone: positive
              detail: 出口管制少于防务；产品安全要求因子行业而异。
