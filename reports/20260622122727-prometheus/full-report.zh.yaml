      - number: '7.3'
        title: 财务与资本风险
        blocks:
          - type: paragraph
            body: >-
              Prometheus 估值 $41 billion、没有收入，且处于产品前、算力密集阶段；其财务风险画像在风投支持的技术公司历史中属于最极端一档。

              **估值下调风险。** 累计融资 $18.2 billion、融资前估值 $41 billion，意味着投资人在一个尚未确认的时间线上定价了数十亿美元级收入轨迹。连 Bezos 也承认存在“AI
              泡沫”语境。如果工业 AI 采用慢于预期，如果资源雄厚的既有厂商（Siemens、ANSYS、PTC 或 Big Tech
              实验室）推出可比工具，或宏观环境收紧大型私募轮的信贷市场，降轮或减记都可能削弱公司留住人才和吸引后续资本的能力。

              **算力和数据 OPEX 烧钱。** 在任何产品收入出现前，Prometheus 已把大量资本砸向 GPU 算力和物理数据生成。Bezos
              确认算力是最大成本驱动。如果训练运行因模型失败或新增物理领域覆盖而反复重启，烧钱速度可能超出预测。公司没有披露收入，记录中没有客户合同，也没有发布单位经济。

              **$100 billion 集团化野心。** 据报道，Prometheus 正讨论募集一个 $100 billion 关联控股基金来收购制造业公司。如果成真，公司将从 AI
              工具开发商变成工业集团——引入的整合风险、资本配置复杂度和监管审查，远超典型软件创业公司。如果宣布后无法执行收购策略，可能伤及投资人信心和管理层可信度。

              **机构资本集中。** JPMorgan、Goldman Sachs 和 BlackRock 都参与了 Series B。这让公司依赖少数大型机构支持者。如果其中任何一家面临监管压力、内部风险委员会转向，或对
              AI 治理产生声誉顾虑，后续资本通道可能迅速收窄。
