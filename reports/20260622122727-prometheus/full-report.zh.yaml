  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Prometheus 将其产品描述为「人工通用工程师」——一种自动化复杂物理系统设计、仿真、优化和制造规格的软件。Jeff Bezos 在 2026 年 5 月澄清，该产品是「非常非常现代的
              CAD」，明确不是机器人，野心覆盖航空航天部件、药物化合物及其他工程化物理系统。按这个描述，Prometheus 至少落在四个既有软件市场内部，而每个市场都界定了一圈相邻支出边界。


              第一类是工程仿真软件——有限元分析（FEA）、计算流体动力学（CFD）、多物理场以及 Ansys、Siemens、Altair、Dassault Systèmes 用户采用的相关验证流程。Grand View
              Research 估算该市场 2024 年为 $23.56B，到 2030 年按 14% CAGR 增至 $51B。第二类是产品生命周期管理（PLM）软件，覆盖协同产品数据管理、物料清单治理、数字制造和 MES
              集成；Mordor Intelligence 估算 PLM 在 2026 年为 $50.17B，到 2031 年按 8.06% CAGR 增至 $73.91B。第三类是 AI 电子设计自动化（EDA），聚焦用
              AI 工具进行芯片和电路设计验证；MarketsandMarkets 估算 AI EDA 在 2026 年为 $4.27B，到 2032 年按 24.4% CAGR 增至
              $15.85B。第四类是更广义的工业软件市场，覆盖 SCADA、MES、工厂设计和产品设计平台；Business Research Insights 估算其 2026 年为 $29.25B，到 2035 年按
              16.7% CAGR 增至 $86.43B。


              更窄的物理 AI 原生层规模较小：MarketsandMarkets 估算物理 AI 市场 2026 年为 $1.50B，到 2032 年按 47.2% CAGR 增至 $15.24B。Fortune
              Business Insights 估算产品设计与工程中的生成式 AI 2026 年为 $7.02B，到 2034 年按 24% CAGR 增至 $39.12B。这是最接近 Prometheus
              描述范围的子市场。


              Prometheus 拟议价值的现状替代方案包括：传统 CAD 工具（Siemens NX、Autodesk Fusion、Dassault CATIA）、借助 Ansys 或 COMSOL
              的手工仿真流程、一级航空航天和汽车 OEM 的大型 PLM 部署，以及如今执行迭代设计和验证工作的内部工程团队。DemystifyingPLM 对 2026 年 4 月 Threaded conference
              的分析指出，90-95% 的 CAD 文件仍存在本地桌面，许多工程组织缺乏让 AI 增强流程可靠运行所需的数据治理基础。这种数据状态既是替代方案（对许多现有项目来说，现状已经足够好），也是 Prometheus
              自身采用爬坡的约束。
