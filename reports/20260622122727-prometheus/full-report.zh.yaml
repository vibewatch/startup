  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品愿景——人工通用工程师
        blocks:
          - type: paragraph
            body: >
              Prometheus 正在打造其所谓“人工通用工程师”（AGE）：一套面向复杂物理系统的 AI 工具，目标是大幅压缩发明闭环——从工程构想到设计、仿真、原型和制造的完整链条。联合 CEO Jeff Bezos 在
              2026 年 5 月首次公开描述公司时，把产品称为“一个非常、非常现代的 CAD 版本”，随即补充说这是“真的过度简化”，野心远不止于此。公司给出的目标是：让设计到制造周期提速 10× 或更多。

              Bezos 和联合 CEO Vik Bajaj 一直强调，Prometheus 不做机器人或工厂车间自动化。Bezos 2026 年 5 月在 CNBC 的 Squawk Box 对 Andrew Ross
              Sorkin 说：“我们和机器人没有任何关系。”公司瞄准的是上游发明层——制造之前的创造性与分析性工作——而不是物理生产系统。Bajaj 把核心洞察概括为：“过去几年改变的是，我们有能力把哪怕像 [喷气发动机]
              这样复杂的东西，从设计到制造，表述成一个端到端 AI 问题。”

              Bezos 把这称为文明层面的赌注：“所有社会财富都由发明驱动……Prometheus 想做的是提供一套工具，大幅加速那个发明闭环。”两位联合 CEO
              明确点名的目标领域包括喷气发动机设计、航天器工程、汽车系统、先进计算硬件（芯片）和药物化合物——凡是多学科长设计周期拖慢创新的复杂物理系统，都在范围内。The Wall Street Journal
              报道称，Prometheus 最初计划通过工程仿真和设计软件工具交付能力。
            claimRefs: []
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE011
              - CE013
              - CE014
              - CE020
              - CE035
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE009
              - CE010
              - CE013
              - CE018
      - number: '5.2'
        title: 物理 AI 架构与世界模型
        blocks:
          - type: paragraph
            body: >
              Prometheus 正在构建 Built In 技术分析和其他报道所称的“世界模型”——明确用物理世界数据训练的 AI 系统，而不是支撑大型语言模型的文本和图像语料。传统 LLM
              可以描述重力，却无法内化物体如何下落、变形或在应力下失效的物理因果。世界模型摄入多模态真实世界输入——传感器遥测、材料属性数据、制造工艺日志、计算流体力学和有限元分析输出，以及结构化工程数据——在任何实体原型制造前，动态仿真设计会如何表现。

              训练栈从设计上就吃算力。Bezos 在 2026 年 6 月 11 日 CNBC
              采访中说，“我们筹到资金中的很大一块”将投向算力，因为“我们做的事情非常消耗算力，而且我们需要创造那些数据”。强调创造而非只是消费数据，反映出一种合成数据策略：Prometheus
              通过仿真和真实工程实验生成训练数据，而不是抓取公开语料。Claru AI 基础设施分析指出，按 token 等价口径，物理 AI 训练数据的生产成本比网页文本高
              100-1000×，因此自有数据生成不是优化项，而是结构性要求。

              The Wall Street Journal（经 Inc 和 Built In）报道显示，Prometheus
              最初计划通过工程仿真和设计软件销售能力，意味着世界模型推理引擎外面会包一层工具层。多物理场仿真——预测设计在热、机械、气动和电磁约束同时存在时的表现——被列为关键能力。Prometheus
              从多个超大规模云服务商获取算力，包括 AWS，这反映了其推理和训练需求的规模。截至 2026 年 6 月，Prometheus 名下尚未发布技术论文或模型架构披露。
