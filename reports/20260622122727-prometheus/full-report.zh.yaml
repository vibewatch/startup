  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Prometheus 设想中的人工通用工程师平台如何把客户活动转化为收入——从工业运营方参与，到平台许可、潜在结果定价，再到毛利。
    data:
      nodes:
        - id: industrial-customer
          label: 工业运营方（目标客户）
          detail: 航空航天、汽车、半导体、制药制造商，工程周期长、研发预算大。截至 2026 年 6 月，没有确认商业客户。
        - id: data-onboarding
          label: 设计数据集成
          detail: 客户将专有工程数据（CAD 文件、仿真输出、制造遥测）接入 Prometheus 平台。数据质量和访问是首要采用障碍。
        - id: agi-platform
          label: 人工通用工程师平台
          detail: AI 系统压缩设计到制造周期。目标是把喷气发动机级工程从 10+ 年压到数月。截至 2026 年 6 月，尚无已交付产品。
        - id: license-revenue
          label: 平台许可收入
          detail: 企业 SaaS 或项目制许可费。类似 Autodesk（$7B+ ARR）或 Siemens NX，但瞄准更高的单项目价值定价。未披露标价。
        - id: outcome-revenue
          label: 结果导向收入（可选）
          detail: 与可衡量的周期时间节省挂钩的价值分成或费用。属推测；没有确认合同结构。
        - id: gross-profit
          label: 毛利（未披露）
          detail: 若 Prometheus 按企业 SaaS 扩张，软件层毛利率预计在 60–80%+ 区间。没有公开毛利目标或披露。
      edges:
        - from: industrial-customer
          to: data-onboarding
        - from: data-onboarding
          to: agi-platform
        - from: agi-platform
          to: license-revenue
        - from: agi-platform
          to: outcome-revenue
        - from: license-revenue
          to: gross-profit
        - from: outcome-revenue
          to: gross-profit
    approximationNotes: 所有收入节点均为预测或推断。尚未交付商业产品。收入机制基于 CEO 方向性表述、分析师推断和可比工业 AI 公司。
