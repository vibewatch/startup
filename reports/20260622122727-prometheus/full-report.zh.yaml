              截至 2026 年 6 月 22 日，Prometheus 没有付费客户、没有已签试点，也没有披露设计伙伴；同一个月，公司以 $41B 融资后估值完成 $12B Series B。$41B 大致等于
              Autodesk 市值；Autodesk 靠数十年客户关系产生 $7B+ 年度经常性收入。分析师把首个具名客户公告视为近期最关键的执行信号。在试点宣布并转化为商业合同之前，整个客户故事都停留在联合创始人的愿景上。
