      - number: '2.3'
        title: 买方与细分市场地图
        blocks:
          - type: paragraph
            body: >-
              工程软件买方模式在既有市场中已有充分记录，是 Prometheus 目前可用的最佳代理。Mordor Intelligence 报告称，汽车与交通是最大的 PLM 终端用户行业，2025 年占收入
              26.86%；电子与高科技则是增长最快的 PLM 细分，CAGR 为 9.56%。Grand View Research 指出，航空航天、国防和汽车是仿真软件的主导买方，并提到 Airbus 和 Boeing
              是早期采用者。Fortune Business Insights 将汽车、航空航天与国防、工业机械和制造列为产品设计中生成式 AI 的领先终端用户行业。


              航空航天与国防垂直具有结构性意义。PwC 2026 年 6 月 Annual A&D Report 显示，2025 年全球前 100 家 A&D 公司总收入首次突破 $1T，商用飞机积压订单接近 15,000
              架，国防积压订单三年内增长超过 50%。Fitch Ratings 2025 年 12 月确认，Boeing/Airbus 积压订单超过 15,300 架，美国和欧洲国防支出将在 2026 年继续保持强劲。美国
              DoD 申请 FY2026 研发预算 $179.1B。航空航天公司历来是 PLM 和仿真软件的最大买家——Mordor 数据确认，航空航天与国防是长期数字主线驱动最强的行业。


              工业工程预算通常由 CTO 或工程副总裁掌握平台级采购，由项目经理掌握项目级工具，由中央 IT 和采购掌握企业级授权。Bain 调查发现，缩短上市时间是 73% CTO 的首要优先事项，纳入新技术是 70%
              CTO 的关键优先事项。对 Prometheus 来说，最可信的首批买方很可能是已经在工程软件上投入最多的同一批一级航空航天、国防和先进制造 OEM——包括 Bezos 承认会成为初始受益方的 Blue
              Origin。制药和半导体买方构成次级细分，研发预算同样庞大，但监管和数据治理要求不同。
