      - number: '8.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 零收入却达到 Autodesk 等值估值
            body: >-
              Prometheus 的 $41 billion 估值与 Autodesk 处在同一水平，而 Autodesk 靠数十年企业客户关系创造 $7.5 billion 年经常性收入。按设计与工程板块中位数（4.8x
              NTM）推算，Prometheus 需要在近期产生约 $8.5 billion ARR，估值才有证据支撑。没有任何可比的收入前 AI 公司，在产品发布或重大倍数压缩事件缺位时，能长期维持这种收入要求缺口下的估值。
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
              - CV034
              - CV035
          - type: callout
            title: Bezos 溢价 vs 物理 AI 板块可比公司
            body: >-
              PhysicsX 是工业工程 physics-AI 中最接近的直接竞争者，2026 年 6 月以 $2.4 billion 估值完成 Series C，并披露收入同比翻倍、拥有 300+
              面向企业的员工。Prometheus 没有披露收入、没有具名客户、只有 150 名员工，却相对于 PhysicsX 享有 17x 估值溢价。差距完全来自 Bezos
              的创始人溢价和机构投资人需求，而不是已记录的技术或商业优势。如果 Prometheus 的 AGE 路径被证明远比 PhysicsX 专注仿真的平台更通用，这一溢价或许合理，但截至本报告日期仍完全未经验证。
            calloutType: insight
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
          - type: callout
            title: $100B 收购基金是关键论点启用器
            body: >-
              另据报道的 $100 billion 制造业收购基金如果完成交割，将为 Prometheus 提供 captive 客户群：这些客户的专有工程数据可反哺模型训练，运营生产率提升也能在商业上验证 AGE
              论点。没有该基金，Prometheus 就要在开放市场与 Autodesk、Siemens 和 ANSYS 竞争企业销售。截至 2026 年 6 月，该基金状态除 WSJ 和 Forbes
              报道外仍未确认；Prometheus 未正式公告，也未向 SEC 备案。
            calloutType: assumption
            claimRefs:
