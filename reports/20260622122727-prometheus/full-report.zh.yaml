  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 财务透明度
        - 当前 ARR、月度烧钱速度、毛利率，以及按当前资本部署速度测算的预计 runway
        - 决定 $41B 在任何倍数下是否站得住；这些数字目前一个都未公开
        - 公司 CFO 或数据室；Forge Global 或 EquityZen 的二级市场信息可能反映隐含估值
      - - 商业牵引
        - 除 Blue Origin 外的具名付费客户；与第三方制造商签署的任何合同、意向书或试点
        - 这是从「继续研究」推进到「跟踪」或「买入」的最关键变量；Blue Origin 与 Bezos 有关联，不能替代独立客户证据
        - 公司直接披露；首个客户公告的行业媒体报道
      - - 股权结构和优先权安排
        - 清算优先权堆叠、反稀释条款、Series A/B 条款清单，以及 Forge Global 或 Equityzen 的二级市场定价
        - 总融资 $18.2B，优先权压力即便在企业价值达到 $80–100B 时，也可能显著侵蚀普通股回报
        - 数据室；二级市场经纪人访谈；若已提交，查看主要实体的 SEC Form D
      - - 产品基准测试
        - 任何第三方或公开性能数据，将 Prometheus AI 输出与 ANSYS、Siemens NX 或其他物理仿真基准比较
        - Bezos 称披露已构建内容还为时过早；没有性能数据，产品差异化主张无法验证
        - 学术论文、行业会议演示，或具名客户案例研究
      - - $100B 收购基金
        - 法律实体、投资人承诺、目标制造商、与 Prometheus AI 股权结构的关系，以及基金经济条款是否产生利益冲突
        - 基金关闭将验证垂直整合论点和绑定客户收入模型；基金失败则把 Prometheus 收窄为没有绑定需求的软件供应商
        - WSJ / Bloomberg 后续报道；基金实体的 SEC 文件
    notes: 主题、缺失证据和尽调路径均为基于公开证据的定性判断；多数缺口需要数据室或公司直接披露才能闭合。
