      - number: '7.2'
        title: 技术与执行风险
        blocks:
          - type: paragraph
            body: >-
              Prometheus 的核心技术主张——现代 AI 可以把端到端物理工程设计周期压缩一个数量级——非常大胆，且尚未在生产规模上证明。几类叠加技术风险挑战这一论点。

              **Sim-to-real 差距。** 仿真训练数据很少覆盖所有真实世界失效模式。要把模型具备物理意识的 提案转化为可制造、可认证、已证明安全的部件，需要硬件在环验证、严谨实验设计和保守安全证明点。截至 2026
              年 6 月，Bezos 本人承认披露公司已构建内容还“为时过早”，公司也未发布技术论文或基准。从亮眼仿真阶段表现，到生产认证的航空航天或半导体输出，中间的差距可能比估值暗示的时间多花数年。

              **数据获取与质量。** 用物理世界数据训练模型——传感器日志、材料疲劳曲线、CAD 仓库、制造遥测——要么需要许可高度自有的工业数据，要么靠昂贵的物理测试台自生成。Bezos
              确认公司必须“创造那些数据”，且这是 $18 billion 资本需求的主要驱动。如果工业伙伴不愿分享竞争专有知识，数据质量或覆盖面可能不足以训练出可跨工程领域泛化的模型。

              **算力依赖与 GPU 稀缺。** Prometheus 同时用多物理场仿真输出、有限元数据集和受控实验日志训练模型；这些工作负载比文本模型训练更吃算力，差出多个数量级。Bezos 承认算力“稀缺”，公司从包括
              AWS 在内的多个供应商获取 GPU。任何持续 GPU 供应中断（NVIDIA 芯片短缺、出口管制驱动的配额限制、超大规模云服务商 产能配给）都可能压缩 Prometheus 的训练吞吐，并显著推迟产品路线图。

              **安全关键场景中的模型可靠性与幻觉。**
              如果模型产出看似合理但物理上不安全的工程图纸——错误材料应力容差、误算气动属性——可能导致灾难性下游失败。不同于文本领域幻觉，物理工程错误可能直到原型测试才被发现，更糟时甚至到现场部署才暴露。受监管行业（航空航天
              FAA/EASA 认证、制药 FDA 审批、核能 NRC 许可）各自要求独立验证制度，不能靠模型声明走捷径。

              **产品前状态与时间线不确定。** 截至 2026 年 6 月，公司约有 150 名员工、公开发货产品为零；联合 CEO
              拒绝给出产品时间表。工业客户在生产采用前通常需要多年试点、深度集成和第三方安全审计。收入启动可能比早期访问合作晚 3–5 年，这段缺口必须由当前现金跑道覆盖。
