      - number: '3.3'
        title: AI 原生工程初创公司与平台赋能方
        blocks:
          - type: paragraph
            body: >
              PhysicsX 是 Prometheus 最接近的 AI 原生竞争对手。这家英国公司在 2026 年 6 月 8 日以 $2.4B 估值完成 $300M Series C——大约比 Prometheus 自己
              $12B Series B 交割早一周。PhysicsX 的平台统一了仿真工作台、AI 工作台（用于开发和部署 Deep Physics Models，即
              DPMs）和工程应用，并采用企业级多云部署模型。其同比指标相当亮眼：截至 2026 年 6 月的十二个月内，确认收入翻倍，签约收入增长两倍，客户数增长超过一倍，员工数超过 300。NVIDIA、Siemens 和
              Applied Materials 是战略投资者，使 PhysicsX 成为可信的替代工业 AI 工程平台，而不只是单点方案供应商。不过，PhysicsX
              聚焦加速物理仿真（为现有仿真工作流构建替代模型），而不是打造 Prometheus「人工通用工程师」叙事所暗示的广义「世界模型」——这是有意义的架构差异。

              NVIDIA 不销售工程软件，但其 NemoClaw Blueprint 参考架构正在重塑竞争格局。该架构在 GTC Taipei/COMPUTEX 2026 展示，使 Cadence、Dassault
              Systèmes、PTC、Siemens 和 Synopsys 等 ISV 能够构建端到端自主执行仿真和验证工作流、无需人工交接的 AI 智能体。与此同时，NVIDIA 的 PhysicsNeMo 框架支撑
              AI-physics NIM 微服务，其面向计算工程的 DoMINO NIM 微服务正被 Altair、Ansys、Cadence 和 Siemens 采用。NVIDIA
              作为赋能型基础设施层的姿态，意味着既有厂商可以迅速获得自主智能体能力，而不必从零构建，从而压缩 Prometheus 的技术领先窗口。

              Cognition（运营自主软件工程师 Devin）相邻但不直接竞争：它专注软件工程工作流，尚未公开宣布物理工程能力。Prometheus 2025 年 11 月收购的 General Agents
              曾专攻用于多步智能体计算机使用任务的视频-语言-动作（VLA）模型，可直接应用于制造机器人。「内部自建」路径（企业用数据科学团队开发专有替代模型）和传统 CAD 咨询公司，则是早期买方可选的低技术替代方案。
