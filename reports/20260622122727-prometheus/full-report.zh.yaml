      - number: '6.3'
        title: 采购动作与上市模型
        blocks:
          - type: paragraph
            body: >-
              Prometheus 尚未公开披露上市策略、定价模型、企业销售团队或客户获取打法。公司约有 150 名员工，几乎全是工程师和研究员；截至 2026 年 6
              月，公开招聘记录中看不到商业团队。不过，公司已经释放出的采购动作是数据合作伙伴模型：Prometheus 计划与工业运营商合作，后者共享自有设计和制造数据，换取早期使用 AI
              工具的机会。这本质上是一种易货安排：客户的数据既是支付，也是训练更好模型的输入。Bezos 在 Axios
              采访中这样描述：“他们没有一个可摄取的制造业数据互联网”——这意味着公司必须自生成，或靠合作伙伴获取自有仿真输出、传感器日志和材料数据。$100B
              关联收购基金增加了第二条分销渠道：直接收购工业制造公司，并在被收购方内部部署 Prometheus 工具，形成俘获型客户，同时把数据喂回模型训练。2026 年 3 月 WSJ
              报道把这种控股公司策略类比为“伯克希尔式”模式；它会让第一波部署完全绕过传统企业销售周期。分析师覆盖称，早期商业推出 预计在 2026
              年下半年出现，但没有披露已签意向书或条款清单。航空航天和制药等受监管行业的商业周期可能很长（2-4 年），因为需要资质确认和认证。
