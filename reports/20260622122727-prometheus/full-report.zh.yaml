      - number: '5.5'
        title: 技术差异化、局限与验证状态
        blocks:
          - type: paragraph
            body: >
              现阶段，Prometheus 的差异化靠四根柱子撑着：（1）团队质量——来自 OpenAI、Google DeepMind、Meta、Nvidia、xAI 和 Anthropic 的研究员，再加上
              transformer 共同发明者担任创始顾问；（2）创始人品牌——Bezos 作为运营型联合 CEO，带来物流、资本和 Amazon 时代的运营严谨性；（3）资本规模——已承诺 $18.2B，使
              Prometheus 可说是全球资金最充足的物理 AI 研究项目，有能力投入竞争对手无法匹配的自有数据管线和算力；（4）General Agents/Ace 的 VLA 技术，为 Prometheus
              技术栈贡献实时智能体计算机控制能力。

              局限同样很大，且大多尚未解决。截至 2026 年 6 月，Prometheus 没有发布公开产品，没有发表研究论文，也没有披露具体技术成果。Bezos
              形容进展“了不起”，但称详细披露“为时过早”。物理工程怀疑者——社区讨论和独立分析均有提及——指出三类持续风险：（a）sim-to-real
              差距，即便高度精确的多物理场模型，也可能无法捕捉制造公差、供应链变化和真实材料行为；（b）数据瓶颈，物理世界训练数据比文本数据难收集、贵几个数量级，工程领域没有 Common Crawl
              的等价物；（c）认证与安全缺口，面向安全关键物理系统（航天部件、药物化合物）的 AI 生成设计，需要监管认证路径，而现有路径尚未纳入 AI 生成设计工件。Prometheus
              不只要证明设计工具更快，还要证明其输出可验证、可认证，并能接入真实制造、测试和供应链。
