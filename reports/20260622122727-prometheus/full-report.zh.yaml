      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              工程领域物理 AI 的结构性需求，得到供给侧压力的文件化支撑。Bain 的全球 ER&D 调查发现，73% 的 ER&D 公司报告人才缺口，工程师离职比例已升至 16-17%，缩短上市时间是 CTO
              的首要优先事项。全球航空航天积压订单接近 15,000 架，国防积压订单三年内增长 50% 以上，也为更快设计和验证周期创造了持久需求，而 AI 工具有机会解决这一问题。


              从既有厂商一侧看，AI 投资规模确认了该命题的可信度。Siemens 2025 年 11 月宣布向工业 AI 投资 €1B，并在 2026 年 4 月 Hannover Messe 推出 Eigen
              Engineering Agent，声称执行速度比手工流程快 2-5x，并在 19 个国家 100 多家公司试点部署中将工程效率提升 50%。Autodesk 声称 Neural CAD 可自动化 80-90%
              的常规设计任务。AgentMarketCap 观察到，一个 $15.7B 的并行工程软件初创生态正在交付数量级级别的工作流改进：45 个国家 600 家初创公司、10
              家独角兽，初创公司的推进速度显著快于既有厂商开发周期。该生态验证了命题，也表明 Prometheus 正进入竞争激烈的空间。


              制动力来自工程行业本身。DemystifyingPLM 的 Threaded 分析发现，真正的阻塞点不是 AI 能力，而是数据治理：90-95% 的 CAD 文件仍在本地桌面，PDM
              落地会卡在基础命名规范上，历史数据常常只剩 PowerPoint，源文件已经删除。物理信息神经网络（PINNs）是建立真正物理原生 AI 工程系统的底层技术之一，但在 2026
              年仍大多停留在研究和试点阶段，受训练不稳定、难以泛化到真实 3D 几何等问题拖累。Writer/Workplace Intelligence 2026 年企业 AI 调查发现，79% 的组织在采用 AI
              时遇到挑战——较 2025 年上升两位数——只有 29% 从生成式 AI 中看到显著 ROI。工程专用工作流对信任和准确性的门槛高于通用企业 AI：喷气发动机部件的仿真错误不是一篇幻觉备忘录。


              监管和 IP 敏感性还会增加守门机制，航空航天与国防尤其如此。最有价值的工程数据中，很多受出口管制或属于机密；若没有 ITAR/EAR 合规、FedRAMP 授权或等效国家框架，云端 AI
              管线很难部署。Mordor Intelligence 指出，尽管云有成本优势，国防和制药领域仍保留本地部署。Forbes 的 AI
              采用障碍调查将技能缺口、数据治理、资本配置、能源获取和流程重构列为五大主要障碍——这些障碍在资本密集、受监管的工程行业中会更重。
