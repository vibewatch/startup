      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Prometheus 由两位联合创始人以联席 CEO 身份领导：Jeff Bezos 与 Vikram「Vik」Bajaj。Bezos 是 Amazon 创始人、执行董事长和最大个人股东，2021 年 7 月卸任
              Amazon CEO。Prometheus 是他离任后的第一个运营型 CEO 职位。他说自己起初在 2024
              年末作为创始投资人加入，后来「对正在发生的事情和潜力印象太深，决定不能袖手旁观，必须全身心投入」，于是担任联席 CEO。他的参与让 Prometheus
              获得极强的资本、工程网络和高管信誉，但也带来关键人物依赖，需要持续尽调——尤其是他还同时领导 Blue Origin。

              Bajaj 提供科学与运营深度。他在 MIT 接受化学和物理训练，曾联合创办 Verily（Alphabet 旗下生命科学部门，前身为 Google Life Sciences），领导 Foresite
              Labs（Foresite Capital 旗下 AI 孵化器），并在 Stanford 拥有学术关联。他的经历横跨前沿科学研究和 AI 公司建设，让 Prometheus 的履历不同于纯软件 AI
              初创公司。Bezos 与 Bajaj 共享联席 CEO 架构，分工互补：Bezos 负责资本战略和面向公众的商业愿景，Bajaj 提供科学与技术领导力。

              联席 CEO 之下，截至 2026 年 6 月 Prometheus 约有 150 名员工，其中包括从 OpenAI、Google DeepMind、Meta 和 Nvidia
              招募的研究人员和工程师。值得注意的一位新员工是 OpenAI 与 xAI 前员工 Kyle Kosic。公司还通过 2025 年 11 月收购智能体 AI 初创公司 General Agents
              扩充团队。董事会构成和正式治理文件尚未公开披露；没有独立董事姓名对外可见。这是尽调中的重大治理缺口。Prometheus 声称公司与 Amazon 或 Blue Origin 没有公司层面的关联。
