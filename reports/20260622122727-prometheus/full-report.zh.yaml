      - number: '6.5'
        title: 留存、扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              Prometheus 尚未商业部署产品或产生收入，因此不存在留存、耐久性或满意度指标。所有标准 SaaS
              健康指标——NRR、GRR、流失率、合同期限、队列留存——都不可得，也无法从公开信息估计。留存尽调必须等到商业发布后，需要直接客户访谈 和资料室访问。扩张维度上，主要机制是 Bezos 正在搭建的 $100B
              工业收购基金；它会创造一个俘获型初始客户群，而不是依赖有机企业销售。面向单个企业客户的 先落地再扩张模型尚未公开描述；Prometheus 没有披露任何定价结构、合同条款或扩张指标。集中风险异常严重：如果
              Blue Origin 成为第一位客户，Prometheus
              初始收入将完全来自一家由同一位联合创始人控制的公司，从而引发独立性、定价和治理问题。单客户集中风险按任何标准都很极端；又没有第二个具名潜在客户，使局面变成二元：要么 H2 2026
              宣布试点，要么客户叙事仍完全停留在愿景。Amazon 未来潜在参与在理论上增加多元化，但不具合同性。竞争对手基准（PhysicsX 客户数同比翻倍至未披露数量）可作为健康工业 AI 客户增长的参考；但
              Prometheus 从零开始，且范围更宽、产品未定义，客户获取路径风险更高。
