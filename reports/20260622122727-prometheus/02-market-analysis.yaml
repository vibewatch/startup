callouts:
  - calloutType: insight
    title: Prometheus's real TAM is narrower than the AI hype cycle suggests
    body: >-
      The generative AI in product design and engineering market — the closest proxy for Prometheus's described
      scope — is $7 billion in 2026, not the $110 billion combined PLM and simulation market. Valuation at $41 billion
      implies the market believes Prometheus will create a new category or expand the AI-native engineering layer
      substantially, not merely take market share from existing simulation tool vendors.
    claimRefs:
      - CM001
      - CM003
      - CM007
      - CM010
  - calloutType: strength
    title: Engineering talent shortage and backlog pressure create genuine structural demand
    body: >-
      73% of ER&D companies report talent gaps, aerospace and defense backlogs have grown more than 50% in three
      years, and the global commercial aircraft backlog has crossed 15,000 units. These are durable, documented demand
      drivers that favor AI tools capable of compressing engineering cycles — exactly Prometheus's stated thesis.
    claimRefs:
      - CM022
      - CM024
      - CM025
      - CM026
      - CM027
  - calloutType: risk
    title: Data governance and IP sensitivity are structural adoption barriers, not temporary ones
    body: >-
      90-95% of CAD files live on local desktops, ITAR/EAR export controls restrict AI deployment for defense programs,
      and FDA/GxP requirements constrain life-sciences data flows. These are engineering-industry-specific constraints
      that the broader enterprise AI adoption literature does not fully capture and that Prometheus must address
      credibly before tier-one A&D or pharma buyers will deploy at scale.
    claimRefs:
      - CM031
      - CM033
      - CM034
      - CM036
      - CM037
