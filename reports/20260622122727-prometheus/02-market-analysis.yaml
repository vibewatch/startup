  - id: s2
    title: Market sizing lenses
    body: >-
      No public analyst report has sized the Prometheus-specific opportunity directly, so sizing requires a multi-lens
      approach. The outer envelope is global engineering and R&D (ER&D) spending. Bain & Company's 2023 survey of over
      500 senior executives forecast global ER&D spending would reach roughly $3.5 to $4 trillion by 2026, growing at a
      10% CAGR, with digital engineering investments growing at 19% CAGR, nearly double the overall rate. That figure
      includes both internal and outsourced ER&D across software tools, hardware, testing, validation, and clinical
      trials. It is a useful upper-bound backdrop for valuation but is not itself Prometheus's TAM.


      The directly relevant engineering software markets add up to more than $110 billion in 2026 across PLM ($50.17B),
      simulation ($30B), industrial software ($29.25B), and AI EDA ($4.27B). Within this, the generative AI in product
      design and engineering sub-market — the layer most analogous to what Bezos calls "a very, very modern version of
      CAD" — is estimated at $7.02 billion in 2026 by Fortune Business Insights, with a 24% CAGR to $39.12 billion by
      2034. The AI EDA sub-segment for chip design and verification is growing even faster (24.4% CAGR) from a $4.27
      billion 2026 base. Information Matters estimates the agentic AI market — the broadest software-level frame for
      AI that autonomously executes workflows — at $40 billion in 2026 (range $33-$48 billion).


      The closest publicly sized SAM proxy for Prometheus is the combined generative AI in product design ($7B) plus AI
      EDA ($4.27B) layer — roughly $11 billion in 2026. However, Prometheus's stated ambition covers not just software
      tools but the end-to-end automation of engineering workflows across sectors from aerospace to pharmaceuticals,
      which implies the addressable market could expand substantially as the product matures. SAM and SOM cannot be
      reliably constructed with public data because Prometheus has not disclosed its target verticals, pricing model,
      or commercial pipeline.
