  - id: s4
    title: Growth drivers, adoption constraints, and valuation relevance
    body: >-
      The structural demand case for physical AI in engineering is supported by documented supply-side stress. Bain's
      global ER&D survey found that 73% of ER&D companies report talent gaps, that the percentage of engineers quitting
      their jobs has risen to 16-17%, and that shortening time-to-market is the top CTO priority. The global aerospace
      backlog of nearly 15,000 aircraft and the 50%+ growth in defense backlogs over three years create durable demand
      for faster design and validation cycles that AI tools could address.


      On the incumbent side, the scale of AI investment confirms that the thesis is credible. Siemens announced a
      €1 billion investment in industrial AI in November 2025 and launched the Eigen Engineering Agent at Hannover Messe
      in April 2026, claiming 2-5x faster execution than manual workflows and 50% greater engineering efficiency in
      pilot deployments across 100+ companies in 19 countries. Autodesk claims Neural CAD can automate 80-90% of
      routine design tasks. AgentMarketCap observed that a $15.7 billion parallel engineering software startup ecosystem
      — 600 startups across 45 countries, 10 unicorns — is shipping order-of-magnitude workflow improvements, with
      startup velocity materially faster than incumbent development cycles. That ecosystem validates the thesis but also
      signals that Prometheus is entering a contested space.


      The braking forces are structural and engineering-specific. The DemystifyingPLM Threaded analysis found that data
      governance, not AI capability, is the actual blocker: 90-95% of CAD files still live on local desktops, PDM
      implementations fail over basic naming conventions, and historical data is often in PowerPoint with source files
      deleted. Physics-informed neural networks (PINNs), which would underlie a true physics-native AI engineering
      system, remain largely in research and pilot phases in 2026, hampered by training instability and difficulty
      generalizing across realistic 3D geometries. The Writer/Workplace Intelligence 2026 enterprise AI survey found that
      79% of organizations face challenges adopting AI — a double-digit increase from 2025 — and only 29% see significant
      ROI from generative AI. For engineering-specific workflows, the trust and accuracy bar is higher than for general
      enterprise AI: a simulation error in a jet engine component is not a hallucinated memo.


      Regulatory and IP sensitivity create additional gatekeeping, especially in aerospace and defense. Much of the most
      valuable engineering data is export-controlled or classified, making cloud-based AI pipelines difficult to deploy
      without ITAR/EAR compliance, FedRAMP authorization, or equivalent national frameworks. Mordor Intelligence notes
      that on-premise deployments persist in defense and pharma despite cloud's cost advantages. The Forbes AI adoption
      barriers survey identifies skill deficits, data governance, capital allocation, energy sourcing, and process
      reimagination as the five principal barriers — all of which apply with particular force in capital-intensive,
      regulated engineering industries.
