  - id: FM004
    title: Engineering AI adoption funnel
    type: funnel
    layout: wide
    summary: >-
      The path from existing engineering software incumbents to Prometheus-style AI-native automation requires clearing
      data governance and IP hurdles before AI value can be demonstrated, and then surviving a lengthy enterprise
      security and procurement review before production deployment.
    data:
      items:
        - label: Status-quo engineering workflow
          value: 100
          description: CAD/CAE/PLM using Siemens, Dassault, Ansys, Autodesk; 90-95% of files on local desktops; manual simulation loops.
        - label: AI copilot or agent pilot
          value: 60
          description: Engineer uses AI assistant (Ansys SimAI, Siemens Eigen Agent, or novel tool) on non-critical workflow; surrogate models accelerate simulation.
        - label: Data remediation and governance gate
          value: 30
          description: Organization must clean CAD file naming, consolidate PDM, and establish data ownership before AI can work reliably. The majority of implementations stall here.
        - label: IP and security review
          value: 15
          description: Procurement, legal, and IT review data residency, ITAR/EAR applicability, export controls, and IP protection clauses.
        - label: ROI demonstration and stakeholder alignment
          value: 8
          description: Program manager and CTO require demonstrated cycle-time or cost reduction before committing platform-level spend.
        - label: Enterprise contract and production deployment
          value: 3
          description: Multi-year license or platform contract; integration with existing PLM and MES; ongoing support commitment.
    approximationNotes: null
