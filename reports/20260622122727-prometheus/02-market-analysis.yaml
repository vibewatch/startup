    title: Buyer segment readiness matrix
    type: matrix
    layout: wide
    summary: >-
      Aerospace and defense and automotive are the highest-priority segments for Prometheus given incumbent spend levels
      and validated engineering talent and cycle-time pressures; semiconductor and pharmaceutical segments offer
      large R&D budgets but require domain-specific trust demonstrations.
    data:
      columns:
        - Budget scale
        - Time-to-market pressure
        - Data governance readiness
        - IP/regulatory risk
      rows:
        - label: Aerospace and defense
          values:
            - label: Very high
              tone: positive
              detail: US DoD alone requests $179B for R&D in FY2026; A&D industry revenue crossed $1T in 2025.
            - label: Very high
              tone: positive
              detail: Backlog of 15,000+ commercial aircraft and 50%+ growth in defense backlog create acute cycle-time pressure.
            - label: Low
              tone: warning
              detail: ITAR/EAR controls, classified data, and on-premise requirements; FedRAMP authorization needed for defense cloud.
            - label: Very high
              tone: warning
              detail: Export controls, national security review, and safety certification create high barriers for AI deployment.
        - label: Automotive and mobility
          values:
            - label: High
              tone: positive
              detail: Automotive is largest PLM segment at 26.86% revenue share; massive R&D budgets for EV transition.
            - label: High
              tone: positive
              detail: EV product cycles, CAFE standards, and competitive pressure demand faster design and simulation.
            - label: Medium
              tone: neutral
              detail: Global PLM deployments are mature but cloud migration is at 43% of revenue; data governance improving.
            - label: Medium
              tone: neutral
              detail: ITAR applicability lower than defense; safety-critical homologation still required; GDPR in Europe.
        - label: Semiconductor and electronics
          values:
            - label: High
              tone: positive
              detail: AI EDA market at $4.27B in 2026; major chip firms spend billions on design automation.
            - label: Very high
              tone: positive
              detail: Product lifecycles of 12-18 months in consumer electronics; AI acceleration has clear ROI.
            - label: Medium
              tone: neutral
              detail: EDA tools already cloud-native in some workflows; IP sensitivity is high for chip designs.
            - label: High
              tone: warning
              detail: Chip IP is highly sensitive; export controls on advanced semiconductors add complexity.
        - label: Pharmaceutical and life sciences
          values:
            - label: High
              tone: positive
              detail: AI drug discovery market approaching $6.7B by 2026; pharma R&D budgets are among the largest.
            - label: Medium
