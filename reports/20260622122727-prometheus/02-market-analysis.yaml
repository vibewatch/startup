  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Prometheus revenue, customers, pricing, and vertical focus
      missingEvidence: >-
        Prometheus has not disclosed any revenue figures, commercial customers, product specifications, pricing model,
        or go-to-market vertical prioritization as of June 2026. The company was described as pre-revenue and early-stage
        in all public reporting. SAM and SOM cannot be constructed without this information.
    - type: conflicting-data
      severity: material
      topic: Conflicting market scope definitions across analyst reports
      relatedQuestionRefs:
        - QM030
      missingEvidence: >-
        PLM ($50B), simulation ($30B), industrial software ($29B), and generative AI in product design ($7B) overlap
        in ways that are not precisely quantified. A single-dollar TAM for Prometheus cannot be derived by summing these
        figures. Independent methodology review of the Fortune Business Insights and Mordor Intelligence models, and
        enterprise PLM contract pricing data, would be required to deconflict scope and build reliable deal-size benchmarks.
    - type: access-blocked
      severity: low
      topic: Grand View Research simulation software market report
      missingEvidence: >-
        The Grand View Research simulation software market report was blocked at origin; a Wayback Machine archive
        snapshot from September 2025 was used. This may not reflect the most current GVR estimate.

