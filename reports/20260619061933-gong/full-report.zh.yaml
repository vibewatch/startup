  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              2025–2026 年，收入智能和会话智能市场进入显著结构性整合期。Gartner 在 2025 年 12 月通过首届 Magic Quadrant 正式确立 Revenue Action
              Orchestration（RAO）品类，让一个此前分散在会话智能、销售互动和收入预测点工具之间的市场获得了分析框架。RAO 框架评估供应商在整个 go-to-market 周期中统一数据捕捉、AI
              驱动洞察生成和工作流编排的能力。


              Gong 进入 2026 年时是无可争议的品类领导者：它在首届 RAO Magic Quadrant 中被评为 Leader，是 12 家被评供应商中仅有的三家之一，并在 Gartner 定义的四个
              Critical Capabilities 用例中全部排名第一。到 2026 年中，Gong ARR 达 $500M，同比增速 55%+；其财务表现既反映品类扩张，也反映平台整合挤出点工具竞争者后的份额获取。


              竞争场分为四个清晰层级。第一层直接竞争者包括合并后的 Clari+Salesloft、Outreach（重塑为 agentic AI 收入平台）和 ZoomInfo 旗下 Chorus，它们在部分或全部 RAO
              用例上与 Gong 竞争。第二层现任平台包括 Salesforce（Revenue Intelligence + Agentforce）、HubSpot（Sales Hub）和 Microsoft（M365
              Copilot），它们靠捆绑和分发优势竞争，而不是靠 AI 深度。第三层相邻和替代产品包括 Aviso、Avoma、Fireflies.ai 和
              Revenue.io，服务更窄用例、更低价位或特定集成生态。第四层是现状替代：手工 CRM 仪表盘、基于电子表格的管线，以及原生 Salesforce 或 HubSpot
              报告，对预算受限买家构成零成本竞争。每一层都对 Gong 客户基础和扩张机会的不同部分施加不同竞争压力。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP035
      - number: '3.2'
        title: 直接同业画像——Clari+Salesloft、Outreach、Chorus
        blocks:
          - type: paragraph
            body: >
              2025 年 8 月，Clari 与 Salesloft 宣布合并，并在 2025 年末正式完成，Steve Cox 被任命为 CEO。这是 Gong 2021 年 $7.25B Series E
              以来，收入智能市场最重要的竞争事件。合并实体把 Clari 的预测和管线编排能力（合并前管理 $5T+ 企业收入）与 Salesloft 领先的销售互动 cadence 平台（服务
              Shopify、Google、3M、IBM 和 Square）结合起来。合并后公司声称管理 $10 trillion 收入，拥有 5,000+ 全球企业客户，数据集摄入 10 billion 次收入互动和 1
              trillion 个数据信号——这是其宣称的数据规模优势，直接对标 Gong 的 Revenue Graph。合并实体在合并后将 R&D 投入翻倍，并把自身定位为打造「Predictive Revenue
              System」，明确与 Gong「Revenue AI Operating System」叙事竞争。该实体覆盖完整 RAO 光谱：Salesloft Conversations 提供 CI 深度，Clari
              贡献企业预测和管线健康评分，合并后的产品路线图则瞄准端到端全覆盖。Salesloft 自身营销称，客户使用其 CI 产品后赢单增加 28%、交易推进速度快 75%，用结果语言直接对抗 Gong 的 ROI 定位。


              Outreach 现在以 Outreach.ai 运营，已把自己重塑为「面向收入的 agentic AI 平台」，通过包括 Amplify Core 在内的套餐，提供席位加 AI credit
              消耗的定价模式。Outreach 的 Kaia 能力提供通话中的实时辅导，公司宣称可带来销售代表入职速度 3x、赢率提升 41%、效率提升 30%。Outreach 最直接竞争的是 Gong
              Engage（销售序列编排）和 Gong 的实时辅导功能，而不是 Gong AI 模型最具差异化的深度会话智能或预测前沿。Gong 和 Outreach
              过去常在企业客户中共同部署，形成多归属模式，互补性缓和了直接竞争压力；但 Outreach 不断增强的 CI 野心正在侵蚀这一动态。


              ZoomInfo 旗下 Chorus 专注于嵌入 ZoomInfo B2B 联系人与公司数据平台的会话智能。Chorus 的核心优势是用 ZoomInfo
              的意图数据、公司画像和购买信号增强通话分析，这一差异化并非 Gong 原生复制。不过，Chorus 是纯 CI 工具，没有销售互动或预测能力，因此更适合已经押注 ZoomInfo
              生态的组织。Clari+Salesloft 合并实体的 Revenue Context 数据集摄入 10B+ 次互动，并被定位为训练 LLM 模型的基础，使数据规模成为其宣称的竞争差异化，目标直指 Gong 的
              Revenue Graph。
