      - number: '6.5'
        title: 扩张动作、落地后扩张与集中风险
        blocks:
          - type: paragraph
            body: >
              Gong 的 land-and-expand 模型在数据中结构性可见。典型切入动作是为核心销售团队部署会话智能，通常从一部分席位开始，再扩展到覆盖完整收入组织。Gong 的平台经济性奖励广度：新增 Gong
              Engage（销售互动）或 Gong Forecast（预测性管道）可拉动 ACV 扩张，而不需要客户重新走一遍企业级审批周期。多产品采用率在 14 个月内从 25% 翻至
              50%，确认这一动作已经在规模化执行。通过 Zapier、Workato、Make.com、Salesforce 和 HubSpot
              集成嵌入伙伴生态，提高了工作流锁定，替换时运营扰动更大。集中风险有两条轴线。第一，垂直集中：公开参考客户里科技行业占比过高。B2B 科技招聘放缓或预算压缩（如 2023–2024
              年所见）会比多元化软件组合更强地冲击 Gong 客户基数。第二，头部账户集中：测量期最后两个季度 $1M+ 交易加速，意味着 ARR 中越来越大一部分由少数超大型客户贡献。Gong 没有披露客户集中度指标（例如前
              10 或前 50 大客户贡献多少 ARR）。采购摩擦真实存在：竞争对手和评论者持续提到僵硬的多年期合同结构、不透明定价是较小企业采用的障碍，可能限制下沉市场 TAM 扩张。Salesforce
              Ventures（Series D 和 E 投资方）带来的渠道依赖，也引出一个战略问题：联合销售条款以及是否存在未公开的排他安排。
