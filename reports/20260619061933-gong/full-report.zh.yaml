      - number: '1.4'
        title: 规模、牵引力与市场地位
        blocks:
          - type: paragraph
            body: >-
              Gong 的收入曲线属于 B2B SaaS 中最快的一档：公司从 2021 年中 Series E 时约 $100M 年化收入，增长到 2025 财年 $300M ARR（2025 年 3 月 5 日公布），再到
              2026 年 5 月 $500M ARR，五年内约增长 5x。截至 2026 年 Q1，公司连续第十个季度增长加速，同比增速 55%+；如果延续这一势头，两年内冲向 $1B ARR 的路径成立，CEO
              Bendov 也承认该里程碑可以实现。企业客户采用是明确顺风：Fortune 10 中有一半是客户，$1M+ 年合同加速增加（两个季度新增数量超过此前六个季度总和），50% 客户使用多个 Gong 产品。截至
              2026 年 6 月，平台拥有 5,000+ 企业客户，包括 ADP、Anthropic、Canva、Cisco、DocuSign、Google、Paycor、Thomson Reuters 和 Uber for
              Business。Gong 在 2025 年 12 月首届 Gartner Magic Quadrant for Revenue Action Orchestration 中获评 Leader，并在 12
              家被评供应商的四个关键能力用例中均排名第一，这强化了其相对 Outreach、ZoomInfo（Chorus）、Clari 和 Salesloft 的品类领导地位。按 Gong Assistant
              使用量衡量的平台 AI 采用同比增长超过 200%。Gong 平台上的客户评价超过 6,278 条，显示席位层面的 NPS 和拥护度较强。
