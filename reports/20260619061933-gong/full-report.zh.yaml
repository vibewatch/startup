  - id: TV005
    title: 打破论点与止损触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - ARR 增长放缓
        - ARR YoY 增长连续两个季度 <25%
        - 打破「50%+ 可持续增长」核心前提；退出倍数压缩到 <6x ARR；熊市情景变成中心情景
        - 降低或清空头寸；避免新的二级购买
      - - 竞争替代信号
        - 单季度有文档证明 >2 个 Fortune 500 账户流失给 Salesforce Agentforce 或 Microsoft Copilot
        - 验证「原生捆绑、零成本」替代论点；NRR 风险变得实质性
        - 委托更深的竞争情报；标记为退出前风险
      - - 一级融资价低于二级
        - Gong 新一级轮投后估值 <$4.5B
        - 正式重置估值；确认降价轮；早期轮次可能触发反稀释
        - 重新评估完整头寸；建模反稀释影响
      - - CFO / CEO 离任
        - Amit Bendov（CEO）或 Todd Busler（CFO）在没有计划接班的情况下离任
        - 关键人物集中；2025 年任命的新 CFO 对 IPO 执行至关重要
        - 在接班安排清晰前暂停投资
      - - IPO 申报估值低于 $4B
        - S-1 申报或 IPO 定价市值低于 $4B
        - 确认公开市场拒绝一级估值；以 $4.5B 二级进入已亏损
        - 全面复核组合；二级持有人应尽可能在 IPO 前寻求退出
      - - 披露 NRR 低于 100%
        - IPO 招股书或数据室披露任意过去 4 个季度 NRR <100%
        - 打破扩张论点；$500M ARR 可能是新客户拉动的高水位，而非留存结果
        - 退出所有头寸；论点根本失效
    notes: 这些触发器设计为可通过公开信号监测。阈值定义尽可能量化。「行动含义」是方向性指引， 不是交易建议。
