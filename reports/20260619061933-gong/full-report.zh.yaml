            body: >
              Gong 的客户数轨迹是公开记录中最清晰的采用信号之一。2021 年 6 月 Series E 时（公司最近一次估值 $7.25B）客户数为 2,000+ 家；到 2025 年 3 月增至 4,500 家（CEO
