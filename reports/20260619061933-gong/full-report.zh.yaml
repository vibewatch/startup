      - number: '1.3'
        title: 融资历史、资本结构与估值
        blocks:
          - type: paragraph
            body: >-
              2016 年至 2021 年，Gong 通过五轮一级机构融资累计募得约 $584 million。Series A（$6M，2016 年 9 月）由 Norwest Venture Partners 和 Wing
              Venture Capital 领投。Series B（约 $20M，2018 年 2 月）由 Battery Ventures 领投。Series C（$65M，2019 年 12 月）由 Sequoia
              Capital 领投。Series D（$200M，2020 年 8 月）由 Coatue 领投，估值 $2.2 billion，Index Ventures、Salesforce Ventures、Thrive
              Capital、Battery Ventures、NextWorld Capital、Norwest、Sequoia 和 Wing VC 参投；该轮发生在 2020 年远程销售潮推动年初至今收入增长 2.5x
              之后。Series E（$250M，2021 年 6 月）由 Franklin Templeton 领投，估值 $7.25 billion，一度让 Gong 成为 Israel
              估值最高的初创公司，Coatue、Salesforce Ventures、Sequoia、Thrive Capital 和 Tiger Global 也参与其中。CEO Amit Bendov 在 2025
              年初表示，公司未再进行一级市场融资，并保留了 2021 年募资所得的大部分资金。不过，2025 年 11 月通过 Nasdaq 私人市场平台完成的二级股票交易隐含估值约 $4.5 billion，较 2021
              年峰值下降 38%；Gong 未批准这些交易，员工期权是否重新定价也未公开，这给在峰值估值获授期权的员工带来潜在留任风险。
