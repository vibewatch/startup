              Gong 的 AI 管线从媒体采集开始：会议平台或电话系统的音频和视频，由机器人录制器或原生录制 API（Zoom、Teams、Google Meet）采集，并存储在 AWS
              S3。针对收入对话词汇优化的专有转写模型，将媒体转换为 70+ 语言的可搜索文本；部分功能仍仅支持英文（基于示例的 smart trackers、邮件标签、红旗提醒）。收入专用 NLP
              模型随后解析转写文本中的主题、行动项、情绪、交易信号和竞争对手提及，构建 Gong Revenue Graph。生成式任务——call spotlight、Ask Anything、AI
              Composer——使用第三方大语言模型（LLMs），并叠加 Gong 的专有上下文和提示工程。Gong 用 Elo 评分系统评估 AI 模型表现，对 account / deal / contact Ask
              Anything、Briefs 等功能的模型版本做 A/B 对比；2025 年 8 月，Gong 更新了所有关键 AI 功能的底层模型和提示。内部 smart-tracker
              模型则按命中率和精度单独评估。MongoDB Atlas 分片在五个集群上，为交易关联数据提供符合 ACID 的事务存储；从基于 Lucene 的前代系统迁移后，过去需要数十秒的查询现在可在 20–30
              毫秒内完成。Snowflake 存储分析聚合数据，并作为具名子处理方支撑 Gong Labs 基于 25 million+ 去标识互动的研究。客户对话数据明确排除在共享生成式 AI 模型训练之外——Gong
