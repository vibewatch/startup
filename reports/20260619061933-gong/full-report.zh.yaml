      - number: '6.4'
        title: 留存、满意度与耐久性代理指标
        blocks:
          - type: paragraph
            body: >
              Gong 不公开披露净收入留存（NRR）、总收入留存（GRR）、客户流失率或 cohort 层级留存数据。鉴于公司在 $500M ARR 规模仍有 55%+ 同比增长，如果增长主要由 upsell 而非净新增
              logo 驱动，就需要 NRR 高于 130% 才能维持当前增速；这一数字无法由公开来源验证，因此是重大尽调缺口。留存质量有代理指标，但都偏间接。50%
              多产品采用率是最强隐含留存信号：客户在核心通话智能产品之外运行 Gong Engage 和 Gong Forecast，意味着 Gong 已嵌入核心收入工作流，切换成本实质上升。$1M+ ACV 的企业 SaaS
              合同通常有 12–24 个月期限并自动续约，进一步锚定流失率。用户满意度高：G2 6,660 条评论平均 4.7 / 5，评论者反复提到通话转写准确、AI 摘要和辅导实用。PeerSpot
              评论突出实际结果，包括续约率改善和辅导效果提升。Work-management.org 的独立评测指出 AI 准确性和采用便利性。主要满意度投诉包括：客户支持慢（多名 PeerSpot
              评论者）、Microsoft Teams 集成质量差（相较 Zoom 和 Google Meet）、定价不透明（竞争对手分析师指出）、美国本土数据存储为默认（安全 / 合规研究者标注）。NRR
              或流失率均无法验证；尽调路径是直接与 Gong 管理层谈判，或在公司进入公开市场时审阅 IPO 前 S-1 披露。
