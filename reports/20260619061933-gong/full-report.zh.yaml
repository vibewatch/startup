      - number: '3.4'
        title: 替代品、相邻产品与现状竞争
        blocks:
          - type: paragraph
            body: >
              在第一层和第二层竞争者之下，相邻产品、替代品和现状方案构成碎片化格局，以不同价位和用例画像争夺预算与心智。CloudTalk 的 2026 年竞争评测列出 11 个不同 Gong 替代方案，覆盖不同用例，包括
              CloudTalk 自身、Chorus、Salesloft、Avoma、Wingman（Clari）、Fireflies.ai、Dialpad、Salesken、Backstory 和
              Outreach，显示买家评估替代方案时能看到的碎片化深度。


              Avoma 面向 SMB 和成长阶段公司，提供一体化会议智能与排程平台，起价约 $19/user/month。它覆盖 AI 记笔记、会议摘要、议程管理、会话智能和线索路由，会议工作流范围比 Gong
              更宽，价格只有其一小部分。Fireflies.ai 声称全球超过 1 million 家公司采用，付费计划为 $10-19/month，并提供免费层，是占主导地位的低成本转写替代品。Avoma 和
              Fireflies.ai 都把基础会话捕捉和摘要商品化，削弱了预算受限买家采用 Gong 的入门级理由。


              Aviso 定位为更重的端到端收入编排平台，服务 450+ 收入团队，提供 30+ 开箱即用 agentic 工作流和 50+ 关键收入用例，包括会话智能、关系智能和预测。Backstory.ai 瞄准 CRM
              数据完整性细分市场，服务不信任 Salesforce 数据质量的 CRO，直接竞争 Gong 的管线智能功能。Revenue.io 是 Salesforce 原生 CI 平台，提供实时辅导（Moments）、AI
              评分卡和深度 Salesforce 集成，专门服务以 Salesforce 为记录系统的客户。Outreach 的基于消耗定价模式（通过 Amplify Core，在席位费旁叠加 AI
              credits）让入门成本低于 Gong 按席位加平台费的结构，进一步分割可寻址市场低端。


              现状方案构成有意义的零成本竞争：原生 Salesforce Reports 和 Dashboards、HubSpot 交易管线，以及基于电子表格的管线复盘，对成本敏感或 AI
              成熟度较低的买家来说已经足够。2026 年第三方评论网站持续把 Gong 定价列为其主要竞争劣势，推动成长阶段和预算敏感型中型市场试用更低成本替代品。HubSpot 自己关于会话智能工具的博客列出 Avoma
              和其他可负担替代品，并未把 Gong 定位为其 SMB 读者群可轻松采用的选项。
