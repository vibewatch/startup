      - number: '1.5'
        title: 里程碑、负面事件与风险因素
        blocks:
          - type: paragraph
            body: >-
              Gong 的里程碑从 2015 年创立一路延伸到五轮机构融资、多次平台扩张，以及 $500M ARR 拐点。负面事件包括 2025 年末二级市场交易显示的 38% 隐含估值重置（约 $4.5B，对比 $7.25B
              峰值），以及 2025 年 10 月在 California 北区被驳回的专利侵权诉讼 Gong.io v. Hyperdoc（Recall.ai）。合规和隐私风险嵌在商业模式里：Gong
              记录、转写并处理商业通信，客户因此承担 GDPR 和多司法辖区数据保护义务。公司持有 EU-US Data Privacy Framework 认证，并通过 Standard Contractual
              Clauses 覆盖 EEA 数据传输，但合规负担——包括有限的数据驻留选项和跨境传输复杂性——仍会拖慢欧洲和高度监管行业的企业销售周期。至少十个美国州和 District of Columbia
              要求通话录音取得全方同意，这意味着使用 Gong 的客户必须谨慎配置同意机制，否则会面临法律风险。Gong 通常要求 2–3
              年订阅合同，这带来有利于留存的高切换成本；但如果更强的竞争技术出现，下行风险也会被放大。Microsoft 将 AI 集成进 Microsoft 365 Copilot，以及 Salesforce 将
              Einstein AI 与 Sales Cloud 捆绑，是风险最高的平台整合情景。Gong 未披露盈利能力；尽管 Bendov 表示公司已为上市做好准备，IPO 时间表仍未明确。2025 年，Gong 与
              Microsoft 合作，将平台集成进 Microsoft 365 Copilot、Teams 和 Outlook；这既可能成为增长渠道，也可能是对冲 Microsoft 竞争性 AI 能力的战略手段。
