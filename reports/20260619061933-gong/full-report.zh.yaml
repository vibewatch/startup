  - id: TV006
    title: 最终尽调事项
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构与优先股结构
        - 完整清算分配模型：五轮融资（A–E）的清算优先权、参与权、反稀释条款
        - 决定基准和熊市退出情景下普通股权益价值；已融资 $584M 在下行情景中可能带来 30–50% 折损
        - 管理层 / CFO 在数据室提供；S-1 要求披露
      - - 经审计毛利率
        - 过去 4–8 个季度 GAAP 毛利率，按订阅和服务拆分
        - AI 算力成本和专业服务结构可能把毛利率压到 60–70%；这会改变退出倍数讨论
        - 数据室中的经审计财务报表；可比 SaaS 公司在 IPO 时披露
      - - 净收入留存率（NRR）
        - 过去 4 个季度企业客户（>$100K ACV）的队列级 NRR
        - 没有 NRR，50%→50% 的多产品采用翻倍可能掩盖流失，侵蚀增长故事
        - CRM / 计费数据；CFO 数据室；订阅商业模式 IPO 必需
      - - 现金与烧钱速度
        - 截至 2026 年 Q1 的实际现金余额和月度经营现金消耗
        - CEO 称「$250M 大部分未动用」，但未验证；更高的烧钱速度会缩短资金续航，并提高降价轮风险
        - 经审计资产负债表；CFO 确认；数据室银行对账单
      - - 竞争赢单 / 输单数据（2026）
        - 2026 年企业 RFP 中，相对 Salesforce Agentforce、Microsoft Copilot for Sales、Clari + Salesloft 的赢单 / 输单率
        - 最大单一论点风险是原生平台替代；当前数据只是轶事
        - 销售运营 / CRO 数据室；2026 年客户背调访谈
      - - 期权悬压与重定价
        - 完全摊薄股数、期权行权价，以及 2021 年后是否发生任何重定价
        - 按 $7.25B 估值授予的期权在 $4.5B 下深度价外；未重定价期权会伤害留存，并压低摊薄后权益价值
        - 数据室期权台账；HR / 财务披露；Calcalist 2025 年 11 月称此项并不清晰
    notes: 证据缺口按其对投资回报的重要性排序。第 1–2 项会阻断任何高于 $4.5B 的大额一级或二级承诺。 第 3–6 项对仓位大小和回报建模很重要。「负责人」指谁持有证据，而非谁应执行尽调。
