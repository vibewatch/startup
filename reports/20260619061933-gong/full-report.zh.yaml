      - number: '3.3'
        title: 现任平台威胁——Salesforce、HubSpot、Microsoft
        blocks:
          - type: paragraph
            body: >
              Salesforce 是 Gong 长期市场地位面临的最复杂结构性威胁。Revenue Intelligence 现在被捆绑进 Salesforce Sales Cloud
              企业版，或作为专门附加项销售，覆盖管线管理、配额跟踪和 AI 驱动交易指导。Salesforce 的 Agentforce 平台支持在销售、服务和营销工作流中部署自主 AI
              agent，包括交易摘要、辅导建议和管线风险评分，与 Gong 的 AI 能力直接重叠。对于 Salesforce 全球 150,000+ 企业客户存量来说，Revenue Intelligence 和
              Agentforce 是嵌在现有合同里的零增量成本能力，降低了单独部署 Gong 的感知边际价值。Salesforce 的分发优势无可匹敌：平均企业客户已经拥有 Sales Cloud，Gong
              因而是预算增项，而不是默认智能层。Revenue Intelligence 可以作为 Sales Cloud 捆绑增项购买，这意味着现有企业 SFDC 客户采购 Gong 时，有效增量成本是 Gong 全价，而
              Salesforce RI 接近零。


              HubSpot 构成第二类平台威胁，尤其在 SMB 和中型市场。Sales Hub Professional（$90/user/month）和
              Enterprise（$150/user/month）都包含原生会话智能，让 HubSpot 客户无需单独购买 CI 工具。HubSpot 的 Breeze AI agents 和 CI
              功能不额外按用户收费，导致已投入 HubSpot 的买家认为 Gong 定价不利。HubSpot 关于会话智能工具的博客没有把 Gong 列入可负担选项，进一步强化了 Gong 只服务企业市场的定位，也把 SMB
              和较低端中型市场让给 HubSpot。


              Microsoft 365 Copilot 是另一种结构性威胁：Teams 内嵌 AI 能力，包括会议记录、转写、摘要，以及通过 Work IQ 实现的 agent 工作流，所有 Microsoft 365
              企业客户都能获得。Copilot 许可证是现有 M365 协议上的低增量附加项，在以 Microsoft 为标准的企业中，几乎以零边际成本替代 Gong 核心会话捕捉。Gong 面向收入场景的 AI 与
              Microsoft 通用 Copilot 之间仍有实质深度差距，但 Copilot 改进很快；对于主要使用 Gong 做通话记录和基础摘要的客户，Microsoft 捆绑会压低续约价格和扩张意愿上限。
