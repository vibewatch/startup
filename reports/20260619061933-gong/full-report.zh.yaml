  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Gong 的收入模式是 B2B SaaS
              订阅，由两个互相咬合的部分撑起：按用户计费的席位许可，以及按支持用户数量确定的平台费。两部分都完全走报价制——官方定价页要求潜在买家提交表单获取定制方案，不公布套餐、底价或命名计划。Gong
              刻意保持这种不透明，与其规模下的企业 SaaS 做法一致：公司可以按垂直行业、交易规模、多年期承诺和打包产品组合差异化定价，也避免竞争对手或买家用公开标价锚定折扣谈判。

              Gong 平台横跨六个商业上独立的模块：Conversation Intelligence（最初的核心产品）、Gong Engage（销售序列与外联）、Gong Forecast（管道与收入预测）、Gong
              Enable（辅导与赋能）、Gong Assistant（代理式 AI 自动化），以及正在扩张的 Professional Services / Revenue Architects 服务。核心 CI
              许可之外的所有产品附加项，都通过定制报价流程增量定价。Gong Collective 市场公布的 411 个集成不额外收费，更像提升平台黏性和切换成本的机制，而不是直接收入线。2026 年初，Gong
              将服务和咨询生态扩大五倍，引入 Revenue Architects 和全球系统集成商伙伴，专业服务收入由此成为结构性增长投入——这一路径带来增量收入，同时加深部署、提高多年期留存。
