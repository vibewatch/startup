      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Gong 由 Amit Bendov（CEO）和 Eilon Reshef（CPO）共同创立，两人都是拥有深厚企业软件背景的以色列创业者。Bendov 曾任商业智能公司 SiSense 的
              CEO，一次销售管线突然且无法解释地崩塌，启发他打造面向销售决策支持的 AI 平台。Reshef 是资深工程负责人，现任首席产品官，也是 Gong AI 与数据平台的主要架构师。目前 C-suite
              包括首席营收官 Shane Evans、CFO Tim Riitters、首席人力官 Sunaina Lobo、CMO Emily He、首席研发官 Ohad Parush，以及 Simon Frey；Frey
              在 2026 年初客户数超过 5,000 家时被任命为首席客户官。Gong 仍是私营公司，未公开董事会构成。作为联合创始人领导的公司，关键人风险集中在 Amit
              Bendov：他是主要公开发声者，设定战略方向，并出现在所有重大产品和融资公告中。公开信息中未出现被视为负面事件的重大 C-suite
              离职。投资人董事席位和治理结构未公开，这是潜在投资者开展治理尽调时的重大缺口。
