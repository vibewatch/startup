  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >
              收入智能是一类 AI 驱动软件，可自动捕捉 B2B 客户互动——电话、邮件、会议、CRM 触点——用机器学习分析后，为销售、客户成功和收入运营团队输出可行动洞察。Gong
              自己的定义强调四个集成层：从每一次客户互动采集数据，用 AI
              分析识别模式和风险，给出下一步处方式建议，再通过工作流自动化把洞察转成行动。这套四层架构，把收入智能平台同更窄的会话智能品类（只覆盖通话记录和转写）以及独立 CRM（需要手工录入数据、缺少 AI 综合）区分开来。


              2025 年 12 月，Gartner 用首份 Magic Quadrant 正式确立 Revenue Action Orchestration（RAO）品类，并评估 12 家供应商。RAO
              定义明确把销售互动（自动化外联序列）与收入智能（预测、辅导、交易分析）合并为一个工作流编排层；相比传统「conversation
              intelligence」品类，这一定义更宽，也更能落到行动。Gong、Salesloft 和 Outreach 都在这个空间竞争，但切入市场边界的起点不同：Gong 从会话智能走向序列编排，Salesloft
              和 Outreach 则从序列编排走向智能。


              不属于 RAO 市场边界的相邻支出包括通用 CRM 系统（Salesforce Sales Cloud、Microsoft Dynamics 365、HubSpot
              CRM）、营销自动化平台（Marketo、HubSpot Marketing Hub）和客户支持 AI（Zendesk AI、Intercom）。这些是互补支出池——收入智能平台通常与 CRM 集成，而不是替代
              CRM——其市场规模数字不能与收入智能 TAM 估计相加。收入智能替代的现状方案包括手工 CRM 数据录入、基于电子表格的预测，以及没有 AI 综合的经理定期通话复盘。
            claimRefs:
