      - number: '7.7'
        title: 图表附录
        blocks:
          - type: callout
            title: EU AI Act 的情绪识别禁令构成产品风险
            body: >
              Gong 的情绪分析和买方意图推断功能，可能落入 EU AI Act 对工作场景情绪识别系统的禁令范围（第 5 条，2025 年 2 月生效）。不同于合规认证或 DPA
              条款，这一风险不能靠合同化解——受影响功能必须在产品层面限定范围，或退出欧盟市场。Gong 已获得 ISO 42001:2023 AI 管理体系认证，但尚未发布正式的 EU AI Act
              产品范围评估。尽调应要求外部法律意见，确认 Gong 当前和路线图中的 AI 功能不落入第 5 条禁止实践。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: callout
            title: Salesforce–Microsoft 双重威胁是首要结构性风险
            body: >
              Salesforce Agentforce 与 Microsoft Copilot for Sales 的组合，是 Gong 最具结构性威胁的竞争动态。两家公司正在把等同于 Gong
              的录音、转写和交易情报能力，原生嵌入 Gong 客户已经授权使用的平台。与创业公司竞争者不同，Salesforce 和 Microsoft 能向已有多年期 ELA 的企业账户以近零边际成本提供这些功能。Gong
              的多产品 Revenue AI OS 是主要可防守护城河——但必须用客户结果数据（NRR、ARR 扩张）证明，而不是靠营销说法。
            calloutType: risk
            claimRefs:
