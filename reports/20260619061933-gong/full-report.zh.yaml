      - - 单位经济
        - 「接近盈利」，Series E 募资大体未动用；隐含 $294K ARR / 员工，处于前四分位
        - 毛利率、NRR、CAC 回收期和烧钱速度均未披露；效率主张无法验证
        - IPO 招股书或数据室披露经审计毛利率 >70%、NRR >120%
      - - 估值进入点
        - 二级 ~$4.5B = 9x ARR；在 2026 年 55%+ 增长 AI SaaS 环境下可辩护
        - 一级 $7.25B = 14.5x ARR，沿用 2021 年峰值倍数；比二级共识高 38%
