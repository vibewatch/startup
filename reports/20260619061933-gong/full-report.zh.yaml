      - number: '4.6'
        title: 财务缺口、尽调阻碍与结论
        blocks:
          - type: paragraph
            body: >-
              Gong 的私营状态带来系统性承销缺口，仅靠公开信息无法解决。一级资本决策中最关键的五个缺口是：毛利率（用于评估盈利路径和竞争性定价可持续性）、按 cohort 划分的净收入留存（用于判断扩张是否压过流失，以及
              50% 多产品统计是否反映真实美元留存）、按细分市场划分的客户获取成本和 S&M 效率（用于验证向上市场动作的经济性）、分产品 ARR 拆分（用于判断 Engage / Forecast / Enable
              是独立收入驱动还是打包折扣），以及 GAAP 收入确认（用于按 ASC 606 区分 ARR 与递延或已确认收入）。

              从收入质量和资本充足性看，Gong 的财务结论偏建设性，但单位经济仍有重大不确定性。$500M ARR、55%+ 增长、连续 10 个季度加速和多产品扩张，为平台采用提供了强劲的收入端证据。CEO
              公开表述释放的资本充足性信号为正面。二级市场估值压缩和未知期权悬挂是治理与激励一致性风险，不是基本面财务损伤。承销的主要阻碍是毛利率和 NRR
              数据缺失；可比上市公司的区间很宽——Salesforce（76%）、HubSpot（85%）、Clari（估计 75%+）——因此 Gong 的精确毛利率画像仍是重大未知。若覆盖 TI005
              项目的尽调资料室开放，一级轮判断定稿前的主要缺口即可补上。
