  - id: FR001
    title: 风险热力图 — Gong 可能性 vs. 影响矩阵
    type: matrix
    layout: standard
    summary: |
      四乘四风险矩阵，按可能性（纵轴）和影响（横轴）定位 Gong 的关键风险类别；单元格列出各交叉点的风险。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 极高可能性（4–5）
          values:
            - 轻微 API 摩擦
            - IPO 执行延迟；估值下调
            - EU AI Act 合规缺口；CCPA 执法
            - 平台原生 CRM 替代（Salesforce/Microsoft）
        - label: 高可能性（3–4）
          values:
            - 集成延迟
            - 客户集中 / 续约风险；AI 偏见索赔
            - 录制同意监管行动；AI 幻觉导致流失
            - AWS 单云故障；企业数据泄露
        - label: 中等可能性（2–3）
          values:
            - 专利剩余风险
            - CFO/CCO 离任；ML 人才流失
            - GDPR 第 9 条特殊数据暴露；NRR 下滑
            - IPO 前 CEO/CTO 关键人离任
        - label: 低可能性（1–2）
          values:
            - 小型中断
            - 竞品点解决方案价格压力
            - MongoDB 中断；Salesforce API 弃用
            - 系统性安全泄露；地缘政治出口限制
    approximationNotes: |
      可能性和影响位置是基于截至 2026 年 6 月的监管活动、竞争动态和运营风险因素做出的定性评估，并非精算结论。
    claimRefs:
      - CR001
      - CR003
      - CR012
      - CR017
      - CR022
      - CR027
      - CR032
      - CR038
  - id: FR002
