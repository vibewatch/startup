      - - 退出准备度
        - 新 CFO、Gartner MQ 领导者、5,000+ 客户、渗透 Fortune 10；IPO 路径清晰
        - SaaS IPO 市场要求经审计 GAAP 财务、队列披露、FCF >15%；Gong 均未公开
        - S-1 申报，或投资银行取得正式 IPO 委托
      - - 竞争耐久性
        - 数据飞轮锁住 50% 多产品客户；Revenue Graph 一旦接入，切换成本可观
        - Clari + Salesloft 合并造出资金充足的对手；原生 CRM AI 套件自然扩大采用
        - NRR 连续 4 个季度保持 120% 以上，总客户数留存率保持 85% 以上
    notes: 论点 / 反论点反映截至 2026 年 6 月的证据权衡。论证锚定证据，而非猜测。 标为未披露的项目代表已确认的公开证据缺口，不是建模假设。
