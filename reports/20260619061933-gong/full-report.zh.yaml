      - number: '7.2'
        title: AI 模型质量、幻觉与准确性风险
        blocks:
          - type: paragraph
            body: >
              Gong 的价值主张建立在 AI 生成洞察的准确性和可信度之上——交易风险分数、对话摘要、辅导提示和收入预测。AI 模型错误不只是产品质量问题，而是投资论点风险。如果 Gong
              的交易智能产出系统性偏差或不准确预测，客户会失去信心，转向替代方案或回到人工判断。2025–2026 年 G2 用户评论持续把转写不准确（尤其是口音语音和技术术语）、辅导提示误读上下文、AI
              摘要遗漏关键交易进展列为主要投诉。


              NIST AI Risk Management Framework（AI RMF 1.0）将有效性、可靠性和可解释性列为 AI 可信度核心支柱——而 Gong 的专有模型在这些维度上不透明。Gong 的
              ISO/IEC 42001:2023 AI 管理体系认证是正面治理信号，但认证并不验证模型准确性。Gong 关于 “Measuring AI Performance at Gong”
              的专用帮助文档承认，模型质量指标可由客户配置，并受单个团队校准影响——这实际上意味着准确性在安装基数中并不均一。使用 Gong 预测驱动季度指引的企业客户，如果 Gong 模型显著偏离，会承担下游
              earnings-call 风险。若连续两个季度 AI 预测大范围失准，可能触发企业客户流失，而这恰好是 Gong $1M+ 客户 cohort 增长最快的部分。Gong 的 “AI trust barrier”
              研究也承认，企业大规模采用需要可证明、可审计的 AI 可靠性。
