      - number: '8.5'
        title: 入场纪律、稀释与优先权悬顶
        blocks:
          - type: paragraph
            body: >
              在这个情境下，入场价格是决定回报的最重要变量。按 $7.25B primary 估值——2021 年 cap table 上的纸面标记——投资人是在为一家二级价格已下跌 38% 的公司支付约 14.5x
              trailing ARR。以 primary 买入，等于假设市场倍数会重新膨胀到 2021 年水平（在 2026 年利率环境下不太可能），或 Gong 会在退出前达到 $750M+
              ARR——这条路径可行但不确定，需要持续 40%+ 增长。按二级市场价格（约 $4.5B，9x trailing ARR）进入，安全垫更可辩护：基准情景产生持平到温和回报，牛市情景有吸引力。若入场价等于或低于
              $4B（约 8x ARR），基准和牛市情景下的风险 / 回报才真正有利。稀释风险不小，但可管理。Gong 已融资 $584M primary 资本，CEO 称 2021
              年融资大部分仍未动用，降低了近期进行新一轮稀释融资的必要性。不过，IPO 或后期二级交易很可能涉及增发股份，且五轮机构融资（Series A 到
              E）的优先权结构从未公开披露。若早期轮次带有参与型优先股和清算倍数，下行情景下普通股实际价值可能显著低于名义估值。投资人必须在出资前取得完整 cap table、优先权条款和期权悬顶（包括期权是否已从 2021
              年高水位重新定价）。Calcalist 2025 年 11 月文章明确指出，期权是否重定价尚不清楚——这是重大的治理和激励缺口。
