    title: 具名客户证明矩阵：按部署深度划分的证据质量
    type: matrix
    layout: wide
    summary: 按证据质量（x 轴）和部署深度 / 结果具体度（y 轴）映射截至 2026 年 6 月的 Gong 具名客户。
    data:
      columns:
        - 仅 Logo（新闻列表）
