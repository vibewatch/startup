  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、同意与监管合规风险
        blocks:
          - type: paragraph
            body: >
              Gong 的核心产品——AI 驱动的销售电话录音和转写——位于两个快速演变的监管制度交汇处：美国各州录音同意法，以及欧盟 AI 监管框架。在美国，11 个州要求通话录音取得所有参与方同意，包括
              California（CIPA）、Illinois（BIPA 邻近的窃听条款）、Pennsylvania 和 Michigan。Gong 建议客户提供披露通知并取得同意，但法律义务落在客户使用平台的行为上，而不是
              Gong 本身。尽管合同把责任向客户传递，集体诉讼风险并不低：当平台功能促成未经适当同意的录音时，原告已经成功将 SaaS 厂商列为共同被告。National Law Review 已将 Gong
              和类似工具标记为雇主窃听责任的潜在目标。


              在 GDPR 下，Gong 作为数据处理方代表其企业客户（控制方）处理数据。其 Data Processing Addendum 纳入标准合同条款、EU-U.S. Data Privacy Framework
              认证（也包括 Swiss 和 UK 扩展），并说明 Amazon Web Services 和 MongoDB 是子处理方，且有 EU 区域部署选项。GDPR 的主要剩余风险是：（1）客户未能为录制 EU
              潜在客户或员工取得有效法律基础，这可能使 Gong 作为技术使能方面临监管审查；（2）如果对话分析无意中暴露特殊类别数据（通话中披露的健康、政治观点），会触发 Art. 9 GDPR 担忧。


              EU AI Act（Regulation 2024/1689，自 2025 年 2 月分阶段执行）明确禁止在工作场所和教育环境中使用情绪识别系统（Art. 5）。Gong
              的情绪分析和交易健康评分功能与该禁令相邻。虽然 Gong 现有产品关注销售通话结果，而非生物识别情绪推断，但随着 Gong 的 AI
              模型演进到从语音和语言线索推断买方意图与情绪姿态，监管机构可能宽泛适用该禁令。ICO 关于 AI 和数据保护的更新指南还要求 AI 系统对每一项处理活动证明法律基础、透明度和可解释性。California 的
              CCPA/CPRA 要求企业向被录音方披露 AI 辅助通话分析——这是 Gong 客户经常低估的缺口。尽调必须确认合规架构和监管抗辩保险覆盖。
