      - number: '8.6'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              Gong 呈现出几项 IPO 准备信号：新 CFO（Todd Busler，2025 年任命）、Gartner Magic Quadrant 领导者位置、$500M ARR 规模、接近盈利姿态，以及公开表达
              IPO 目标的 CEO。公司在规模上已经像事实上的准上市公司运营——5,000+ 客户、打入 Fortune 10、多产品采用率 50%——而且每多积累一个季度互动数据，其 revenue graph
              数据护城河就更难被竞争者复制。不过，2026 年 SaaS IPO 窗口仍然挑剔：公开市场投资人要求先证明盈利能力，或给出可信的近期路径（FCF margin >15%），才会给予溢价倍数。Gong
              的「nearly profitable」姿态尚未接受独立审计师或公开市场披露标准检验。公司没有披露 GAAP 财务、 cohort 数据或 NRR 基准的历史，而这些都是科技 IPO
              的基本门槛。六个尽调主题会阻碍任何价格下的明确投资推荐。第一，完整经审计 cap table，包括清算优先权和反稀释条款。第二，过去两年经独立审计或审阅的 GAAP 收入和毛利率。第三，按 cohort
              拆分的净收入留存（NRR），验证 ARR 增长由新 logo 还是扩张驱动。第四，实际烧钱率和现金余额，以确认 CEO 关于融资款大体完好的说法。第五，2026 年企业 RFP 中与 Salesforce
              Agentforce 和 Microsoft Copilot 竞争的赢 / 输数据。第六，2024 年 HyperDoc 专利驳回后，任何待决法律或 IP 索赔的状态。在这些缺口补齐前，合适结论是
              TRACK，并将 primary 入场价格纪律设在 $4.0–4.5B。
            claimRefs:
