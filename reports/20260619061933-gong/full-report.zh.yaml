      - number: '2.2'
        title: 市场规模——多重口径与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，收入智能或 Revenue Action Orchestration 市场没有单一权威公开 TAM。已发布估计分歧极大，按 2026–2030 年可服务可获得市场计，从约 $2B 到
              $10B，跨度达五倍；差异完全取决于分析师如何划定市场边界。这种定义模糊反映了分析师、供应商和投资人之间的真实分歧：RAO 究竟是 CRM 的子市场、CRM 旁边的独立品类，还是更广义 go-to-market
              技术栈正在形成的核心。


              Fortune Business Insights 的 CRM 市场报告（2025）估算，全球 CRM 市场 2025 年为 $112.91B，到 2034 年增长至 $320.99B，CAGR 为
              12.4%。CRM 是相邻支出的代理变量，不是收入智能的直接口径；但该数字为位于 CRM 数据层之上的收入智能平台提供了可寻址空间背景。MarketsandMarkets 估算销售智能市场 2019 年为
              $2.0B，到 2024 年以 11.4% CAGR 增长至 $3.4B；外推到 2026 年，销售智能约为 $4.2B。这一口径更窄，排除了大多数收入智能功能，也未纳入 RAO 品类边界更新。


              以 Gong 2026 年 5 月 $500M ARR 为基础，并假设其可服务市场份额为 8–15%，自下而上推导出的企业收入智能平台 SAM 约为
              $3.3B–$6.3B。这个估计在结构上是循环的——市场份额未经验证，只由 ARR 反推——但在缺乏公开 Gartner RAO 市场规模数字时，这是最贴近 2026 年现状的可用口径。Gartner 的 RAO
              MQ 评估了 12 家供应商，但未披露市场总收入。宏观 AI 顺风也增加了不确定性：MarketsandMarkets 估算 2026 年全球 AI 市场为 $601.93B，并以 29.3% CAGR
              增长，为收入智能这类专用垂直 AI 应用提供了有利投资环境；但宏观 AI 增长不会直接转化为 RAO 品类增长。Gong 的估值已从 2021 年的 72x ARR，回落到 2025 年末二级市场参考隐含的约
              11x ARR。
