      - number: '8.4'
        title: 情景分析——牛市、基准与熊市
        blocks:
          - type: paragraph
            body: >
              三个情景锚定可观察增长向量，并以 2026 年 6 月 $500M+ ARR、同比 55%+ 增长为起点校准。每个情景在退出时采用不同的终局 ARR
              倍数，反映届时业务成熟度、退出窗口时点和竞争护城河侵蚀程度。所有情景的估值区间均按潜在退出（IPO 或战略出售）时点建模，而不是按今天的二级价格；因此，以二级标记（约
              $4.5B）进入的投资人，应相对入场价评估潜在回报倍数，并计入退出前任何 primary 融资带来的进一步稀释。牛市情景：Gong 在 2027 财年维持 40–50% ARR 增长，到 2027 年中达到
              $700M+ ARR，在友好的公开市场以 12–15x ARR 倍数 IPO，普通股股东在清算优先权后拿到名义估值的 85–90%。隐含退出股权价值：$8.4B–$10.5B。按 $4.5B 二级入场的回报：约
              1.9–2.3x。基准情景：竞争加剧后增长降至 30–40%，Gong 到 2027 年底达到 $650M ARR，并在 24 个月内以 8–10x 倍数 IPO。清算优先权后，普通股捕获
              80%。隐含退出股权价值：$5.2B–$6.5B。按 $4.5B 二级入场的回报：约 0.9–1.2x（温和或持平）。熊市情景：增长降至 25% 以下，IPO 延迟（3+ 年），被 Salesforce 或
              Microsoft 竞争替代，并被迫以 5–7x ARR 进行二级或战略交易。隐含退出价值：$3.5B–$4.5B。按 $4.5B 二级入场的回报：约 0.6–1.0x（资本保全风险）。若 Gong 在 IPO
              前需要新的 primary 资本，进一步 down-round 情景不能排除。
            claimRefs:
