      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              收入智能平台的购买流程复杂、涉及多角色，这使其不同于更简单的销售效率工具。经济买家通常是首席营收官（CRO）或销售
              VP，他们承担收入责任，也掌控可自由支配的销售技术预算。技术买家是收入运营（RevOps）负责人或收入运营总监，负责推动 CRM
              集成架构、数据战略，以及销售、营销和客户成功团队之间的跨职能协同。销售赋能经理是内部倡导者，关注销售代表辅导和新员工入职用例。IT 和安全团队是审批守门人，尤其在企业和监管行业客户中如此；但他们通常不掌握预算权。


              Forrester 的 RevOps 框架把「通过收入技术交付价值」列为六大核心 RevOps 优先事项之一，进一步巩固了 RevOps 作为企业销售技术栈关键技术买家和倡导者的地位。B2B
              企业为收入智能组建的采购委员会平均有五名或更多决策者，这把大型客户的典型销售周期拉长到 60–180 天；购买决定前，CRO、RevOps、IT/安全、法务/隐私和财务必须达成一致。


              不同细分市场的采用模式差异明显。企业客户（1,000+ 员工）引领 Gong 增长：截至 2026 年 5 月的两个季度内，公司新增 $1M+ 年合同数量超过此前六个季度总和。中型市场买家（100–999
              个席位）优先看重 ROI 速度，常以会话智能作为楔子产品进入；Gong 在第一年案例研究中引用 30–60%+ 的销售效率提升。SMB 细分市场（<100
              个席位）因企业级平台实施复杂、合同要求多年而服务不足。Salesforce 的 2026 State of Sales 发现，十分之九销售团队已在使用或预计两年内使用 AI
              agents，验证了可触达买方池的广度。随着用例延伸到售后流失预防和增购识别，客户成功团队正成为新的扩张细分。
