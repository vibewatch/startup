  - id: FV004
    title: 投资 KPI — 投委会就绪评分卡
    type: kpi
    layout: wide
    summary: 从市场、验证、护城河、经济性、风险、估值和证据质量七个维度评估 Gong 的投委会就绪度。每项按 1–5 分打分，理由均锚定已验证证据。
    data:
      items:
        - label: 市场机会
          value: 4
          unit: /5
          note: RAO 类别对应 $2B–$10B+ TAM；Gartner 领导者；企业 AI 强制推进带来结构性顺风
        - label: 收入验证
          value: 5
          unit: /5
          note: $500M ARR 已确认，连续 10 个季度加速，已打入 Fortune 10
        - label: 竞争护城河
          value: 4
          unit: /5
          note: Revenue Graph 数据飞轮（25M+ 次互动）、50% 多产品锁定；原生 CRM 捆绑带来风险
        - label: 单位经济性
          value: 2
          unit: /5
          note: CEO 称已接近盈利；NRR、毛利率或烧钱速度未披露；代理指标显示效率不错
        - label: 风险画像
          value: 3
          unit: /5
          note: 监管、AI 质量和竞争风险都重要但可控；优先权悬顶规模未知
        - label: 估值入场
          value: 2
          unit: /5
          note: 一级 $7.25B = 14.5x ARR（偏紧）；二级约 $4.5B = 9x ARR（合理）；入场纪律很关键
        - label: 证据质量
          value: 2
          unit: /5
          note: 六个关键缺口未解：NRR、毛利率、股权结构表、烧钱速度、赢单 / 输单、期权重定价
    approximationNotes: 分数是分析师按 1–5 分给出的判断，不是公式输出。3 分代表中性；4–5 分代表正向信心；1–2 分代表担忧或缺口。单位经济性、估值入场和证据质量均为 2/5，压低了整体投委会就绪度。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV022
      - CV034
      - CV046
