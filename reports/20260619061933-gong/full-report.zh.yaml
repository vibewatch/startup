  - id: FV003
    title: 估值与回报区间 — 二级入场 vs. 一级入场
    type: range
    layout: standard
    summary: 投资者按二级（约 $4.5B）与一级（$7.25B）价格进入时，退出的低 / 基准 / 高隐含股权价值区间，展示不同情景下的回报不对称。
    data:
      items:
        - label: 牛市退出 — 二级入场（$4.5B）
          low: 7100
          mid: 8300
          high: 9500
          unit: $M equity value
        - label: 基准退出 — 二级入场（$4.5B）
          low: 4200
          mid: 4700
          high: 5200
          unit: $M equity value
