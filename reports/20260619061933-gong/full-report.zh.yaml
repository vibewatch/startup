              家。算术上，2021–2026 年间每年净新增约 500 家公司——数量稳步扩张但并非爆发式增长，符合公司向上市场、转向更少但更大的企业账户。多产品采用是最尖锐的轨迹信号：2025 年 Q1，25%
              客户（四分之一）使用多个 Gong 产品；到 2026 年 5 月升至 50%——约 14 个月翻倍。2026 年 5 月前最后两个季度新增的 $1M+ 年合同客户，超过此前六个季度合计。到 2026 年 5
              月，Gong Assistant（旗舰 AI 功能）使用量同比增长超过 200%；截至 2025 年 Q1，Ask Anything 使用量同比增长 400%。平台处理了超过 25 million 次销售互动，为
