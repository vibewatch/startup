    approximationNotes: >-
      两种入场情景下，退出时的股权价值相同；回报倍数差异来自入场价格。基于已融资 $584M 的参与型优先股结构假设，普通股权益捕获率估计为
      85%（牛市）、80%（基准）、70%（熊市）。实际回报取决于清算优先权条款、稀释和时间点——这些均未披露。数值单位为百万美元。
