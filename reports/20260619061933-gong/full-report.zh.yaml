      - number: '2.4'
        title: 增长驱动因素与 AI 顺风
        blocks:
          - type: paragraph
            body: >
              2025–2026 年，三股结构性力量正在加速收入智能平台需求。第一，董事会层面对 AI 驱动销售效率的要求制造了预算紧迫感：Gong 2026 年 5 月新闻稿把「来自高层的 AI
              mandate」列为主要需求驱动因素。销售团队承受配额未达和获客成本上升压力，开始转向 AI 平台，系统识别顶尖销售的差异做法，并在规模上复制。Gong 内部数据显示，销售人员 77%
              时间花在非销售活动上——这一效率缺口为自动化平台提供了有说服力的 ROI 论证。


              第二，技术栈整合是强劲的结构性顺风。企业正在用统一平台替换 3–7 个碎片化点工具——分别用于通话记录、管线预测、销售辅导和外联序列编排。Gong 披露 50% 客户现在使用多个 Gong 产品（2026 年 5
              月），验证了多产品 land-and-expand 动作。整合动态推高平均合同价值并延长客户生命周期，形成强化 Gong 企业战略的经济飞轮。


              第三，存量客户中的 AI 功能采用正在加速。Gong 旗舰 AI 产品 Gong Assistant 到 2026 年 5 月使用量同比增长超过 200%。Salesforce 的 State of Sales
              报告（2025/2026）发现，十分之九销售团队已经使用 AI agents，或预计两年内会使用，显示销售工作流 AI 化意图几乎普遍存在。2020 年开始，远程和混合销售确立了会话捕捉的基础需求；如今 AI
              分析叠加在已捕捉数据之上，增加了更高阶价值层，形成两层价值主张，推动持续投入。
