  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基数与分层
        blocks:
          - type: paragraph
            body: >
              Gong 的可服务买家，是任何拥有结构化 GTM 团队、管理背负 quota 的销售人员和收入运营的 B2B 公司。主要买家通常是首席收入官、销售 VP 或收入运营负责人，所在公司约 200–10,000+
              名员工；日常用户包括客户经理、销售开发代表、收入运营分析师、销售赋能经理、客户成功经理，以及近来增加的专业服务和支持团队。截至 2026 年 5 月，Gong 服务全球超过 5,000 家公司，Fortune
              10 中有一半是客户——这说明其在企业市场最顶端有显著集中。平台覆盖至少七个垂直行业：科技、媒体、电信、专业服务、金融服务、医疗健康和制造。科技垂直占比过高，原因在于 Gong 起源于 Silicon
              Valley SaaS 工具，并与 Salesforce、HubSpot 和云原生 CRM
              栈深度集成。企业科技客户最可见（ADP、Anthropic、Canva、Cisco、Docusign、Google、Paycor、Thomson Reuters），考虑到 $1M+ ACV
              加速，它们很可能驱动最快的合同增长。渠道依赖中等：Gong 主要直销，并通过 Salesforce 伙伴关系销售；但 Zapier、Workato 和 Make.com 集成反映出运营驱动型买家的需求，他们会把
              Gong 嵌入更广泛的自动化工作流。地域上，美国本土数据存储是默认架构，这给 GDPR 监管市场中的非美国企业造成合规摩擦；不过 Gong
              确实为大客户提供多司法辖区数据处理。买家画像在一个维度上同质——所有付费方都是拥有结构化销售动作的 B2B
              公司——但在垂直行业、规模和技术成熟度上异质，这既创造扩张机会，也带来分层风险：经济周期可能对科技与非科技垂直产生不同冲击。
