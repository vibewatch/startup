      items:
        - date: '2015'
          label: 创立
          detail: Amit Bendov 和 Eilon Reshef 在加州旧金山创立 Gong
          tone: neutral
        - date: 2016-09
          label: Series A（$6M）与产品发布
          detail: 首个商业产品发布；Series A 由 Norwest VP 和 Wing VC 领投
          tone: positive
        - date: 2018-02
          label: Series B（~$20M）
          detail: Battery Ventures 领投，资金用于产品和销售扩张
          tone: positive
        - date: 2019-12
          label: Series C（$65M，估值 ~$750M）
          detail: Sequoia Capital 领投；估值达到 $750M；企业采用加速
          tone: positive
        - date: 2020-08
          label: Series D（$200M，估值 $2.2B）
          detail: Coatue 领投；远程办公激增带动年初至今收入增长 2.5x；跨过独角兽门槛
          tone: positive
        - date: 2021-06
          label: Series E（$250M，估值 $7.25B）
          detail: Franklin Templeton 领投；客户 2,000+；一度成为以色列最大独角兽
          tone: positive
        - date: 2025-03
          label: ARR 超过 $300M（FY2025）
          detail: 4,500+ 客户；AI 使用量 YoY 上升 50%；连续第 9 个季度加速
          tone: positive
