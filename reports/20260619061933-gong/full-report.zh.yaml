      - number: '4.2'
        title: ARR 轨迹、增长质量与收入信号
        blocks:
          - type: paragraph
            body: >-
              Gong 的 ARR 轨迹在企业软件里处于最强一档：公司在 2021 年 6 月 Series E 时约为 $100M ARR，2025 年 3 月达到 $300M ARR——约 45 个月增长 3 倍——随后在
              2026 年 5 月加速至 $500M ARR，不到 15 个月又新增第二个 $200M。2026 年 Q1 披露的隐含同比增速超过 55%，CEO
              称这是增长率连续第十个季度加速。公司在这种规模下还能持续加速并不常见，说明新增客户之外还有复合驱动：多产品扩张、现有账户内席位扩张，以及向上市场替代点状方案，都在结构性拉动 ARR。

              收入质量信号偏正面。Gong 的多产品采用率从 $300M ARR 时约四分之一客户（2025 年 3 月）升至 2026 年 5 月的 50%，说明存量客户内的净扩张已经有实质体量。$1M+
              年合同的赢单速度翻倍：截至 2026 年 5 月的两个季度里，Gong 新增的七位数客户数超过此前六个季度合计。Fortune 10 中已有一半是客户。客户数从 2025 年 11 月约 4,500 家增至
              2026 年 3 月超过 5,000 家，约一个季度新增 500+ 家企业。不过，所有 ARR、增长和客户指标都由公司自报且未经审计；目前没有第三方审计、GAAP 文件或独立验证公开。从 $100M 到
              $500M 的三年 ARR CAGR 隐含约 50% 的复合增速，在 $500M ARR 规模下，Gong 已稳居企业 SaaS 增长第一梯队。
