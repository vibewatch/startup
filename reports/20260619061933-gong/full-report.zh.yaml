      - number: '7.3'
        title: 技术、云与集成依赖风险
        blocks:
          - type: paragraph
            body: >
              Gong 的基础设施几乎完全运行在 Amazon Web Services 上，这一点见于其子处理方列表。AWS 提供云托管、语言转写（Amazon Transcribe）和应用 AI 功能；MongoDB
              用于数据存储和查询。这形成单一云集中风险：长时间 AWS 中断或商业条款恶化，可能直接损害 Gong 的服务等级协议并伤害企业信任。Gong 与 AWS 的 SCA（Multi-Year Strategic
              Collaboration Agreement）进一步加深这种依赖，把产品路线图和 GTM 承诺绑定到 AWS 生态——AWS 成为顺风时有利，若 Gong 需要分散供应商则会棘手。


              Gong 的收入高度依赖与 CRM 平台的集成——主要是 Salesforce 和 Microsoft Dynamics——以及 Zoom、Microsoft Teams、Google Meet
              等协作工具。这些集成作为市场上架项交付，受 AppExchange 和 Microsoft 365 marketplace 政策约束。Salesforce 或 Microsoft 随时可以修改 API
              条款、增加竞争功能（Salesforce Einstein Copilot；Microsoft Copilot for Sales），或限制第三方录制访问。2024 年，Microsoft 开始把原生 AI
              通话录制和辅导嵌入 Teams Premium 和 Microsoft 365 Copilot，使 Gong 的核心通话智能功能直接面对来自协作平台的竞争，而 Gong 此前把该平台视为分发渠道。Gong 与
              Salesforce 的伙伴关系包括 CRM 层面的 revenue-intelligence 集成，但 Salesforce 同时在打造自己的 Agentforce 自主销售平台，原生复制 Gong
              的预测和辅导输出。


              Salesforce 和 Microsoft 既是依赖又是竞争对手，这种双重性是最具结构性威胁的技术风险：如果任一平台撤回 API 访问、限制录制权限，或在企业合同中捆绑竞争功能，Gong
              的价值主张会在缺少独立分发渠道时显著下降。
