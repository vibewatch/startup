      - number: '8.2'
        title: 估值背景——Primary 与 Secondary 证据
        blocks:
          - type: paragraph
            body: >
              Gong 最近一次 primary 资本事件是 2021 年 6 月 Series E：融资 $250M，投后估值 $7.25B，由 Franklin Templeton 领投，Coatue、Salesforce
              Ventures、Sequoia、Thrive Capital 和 Tiger Global 参投。2021 年 6 月 15 日提交的 SEC Form D 确认了发行和发行主体，把 primary
              估值锚定在监管记录中。当时 Gong 报告约 2,000 家客户、ARR 增长 2.3x——隐含 ARR 基数约 $100–135M——因此 2021 年倍数为 54x–73x 远期
              ARR。这个峰值更多反映疫情时期 SaaS 狂热，而非正常化需求环境。2021 年后重估的第一个可信公开信号出现在 2025 年 11 月。Calcalist 报道称，Gong 股票在 Nasdaq
              私人市场平台交易，隐含估值约 $4.5B，较 2021 年 Series E 价格折让 38%。Gong
              未批准这些二级交易，并拒绝评论估值猜测。二级市场标记是真实但不精确的信号：它反映流动性折价和卖方紧迫性，而不是干净的公平 primary；尽管如此，它仍是 2021 年至今 Gong
              股权唯一独立市场价格。将二级市场标记套到 2026 年 5 月 $500M+ ARR 基数上，隐含 9x trailing ARR 倍数。套用 primary 标记则为 14.5x。作为背景，Sacra 估计
              2026 年初一笔二级交易约为 $4.5B，与 Calcalist 报道一致。CEO Bendov 2025 年 3 月的表述——「I don't know what valuation we would
              receive today because market multiples have changed」——本身就是隐性承认：2021 年价格很可能已经过时。
