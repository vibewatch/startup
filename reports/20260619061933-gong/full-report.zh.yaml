      - number: '3.5'
        title: 切换成本、锁定与多归属动态
        blocks:
          - type: paragraph
            body: >
              Gong 的切换成本实质且多维。迁出 Gong 需要导出并重新摄入可能横跨多年的通话录音和转写库，重建按 Gong 分类体系校准的分析模板和辅导评分卡，重新配置 Gong Collective 市场中多达
              300+ 个活跃集成，并重新培训销售团队使用新的界面和工作流。对运行多个 Gong 产品的企业客户来说，切换摩擦会叠加：同时使用 Gong CI、Gong Engage 和 Gong Forecast
              的客户，必须同时拆开三套互联工作流。截至 2026 年 5 月，50% 多产品采用率既反映交叉销售动作成功，也说明随着客户使用年限增长，锁定深度正在增加。


              Gong 的 Revenue Graph 形成一种数据驱动锁定，不同于技术集成切换成本。Revenue Graph 是持续存在、面向单个公司的智能层，基于客户多年来自己的通话语料、交易历史、邮件模式和 CRM
              数据训练。该专有上下文捕捉特定公司买家的反应方式、销售代表表现，以及预测赢单的交易模式；不从零重建，就无法迁移到竞争平台。即便技术迁移完成，竞争者也必须重新创建该上下文，带来 6-12
              个月智能缺口。智能飞轮会随时间复利：Gong 部署越久，Revenue Graph 越丰富，切换成本越陡。


              Gong 企业端动能正在加速——最近两个季度新增 $1M+ ARR 客户超过此前六个季度总和——这表明即便面对 Clari+Salesloft 合并和 Salesforce、Microsoft
              平台捆绑，切换成本保护仍在发挥作用。Clari+Salesloft 合并实体在合并后将 R&D 投入翻倍，并声称拥有「最广泛的 Revenue AI 数据集」，这是复制 Gong
              数据规模优势的最可信尝试；但其数据集来自不同来源，缺少 Gong 十年专用 AI 模型训练。多归属在市场中很常见：许多企业客户同时部署 Gong 与 Outreach 或
              Salesloft，用于互补的互动工作流，从而降低这些供应商的替代风险，但也让切换成本暴露更集中在 Gong 的 CI 和预测模块上。
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
              - CP039
      - number: '3.6'
        title: 护城河耐久性与竞争结论
        blocks:
          - type: paragraph
            body: >
              Gong 的竞争护城河建立在三根支柱上：Revenue Graph 数据深度与公司特定 AI 训练、通过 300+ Gong Collective 集成形成的生态锁定，以及在企业级收入 AI 上多年先发、已有
              5,000+ 客户部署。截至 2026 年中，55%+ YoY 增长和连续 10 个季度加速，是护城河仍在守住的最强可得指标——客户正整合到 Gong，而不是分散流失。到 2026 年 5 月，Gong 已渗透
              Fortune 10 的一半；再加上可衡量客户结果，包括 Anthropic 销售效率提升 64%、Paycor 赢单增加 141%、Canva 销售代表产能提升 60%、Uber for Business
              回复率提升 32%，提供了企业级参考验证，捆绑竞争者和低成本替代品在这一规模上尚未匹配。


              主要耐久性风险是 AI 商品化：随着通用大语言模型在通话摘要、关键时刻提取和辅导建议上变强，Gong 收入专用模型与通用 AI 的功能差距会收窄。Gong 的防线在于 Revenue Graph
              不是简单转写集合，而是一个结构化、具备时间感的收入表现模型，能识别跨交易、跨销售代表、跨账户模式；没有领域专用训练数据和专门设计的产品架构，通用 LLM 无法复制。随着竞争者积累可比训练数据，这条防线在 3-5
              年维度能否保持耐久，是护城河最关键的未解问题。


              Clari+Salesloft 合并后声称拥有 10 billion 次收入互动和 1 trillion 个数据信号，这是首个可信的、在数据规模上与 Gong 竞争的尝试；但该数据集相对 Gong
              的质量、整理方式和收入专用标签并无独立验证。Gong 在 Anthropic、Uber for Business、Canva 和 Paycor 等客户中记录的企业客户成功结果，仍是差异化价值最有说服力的指标。只要
              Gong 继续在第一层企业客户中证明可衡量收入结果，而没有任何捆绑替代品能以相近深度复制，其定价权和 land-and-expand 动作就应能在 2026 年竞争周期中维持增长，尽管四个层级的竞争强度都在上升。
