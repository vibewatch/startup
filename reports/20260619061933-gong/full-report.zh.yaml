  - id: FO001
    title: Gong 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 从 2015 年创立到 2026 年 5 月 ARR 达到 $500M 的关键里程碑，覆盖融资轮次、产品发布、 规模拐点和不利估值事件。
