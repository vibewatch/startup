  - id: FV001
    title: 推荐逻辑 — 从证据到 TRACK 评级
    type: flow
    layout: wide
    summary: 从 Gong 的四个证据支柱，经由不确定性缺口，推导到 TRACK 推荐；展示哪些证据会把判断上调为买入，哪些会下调为避免。
    data:
      nodes:
        - id: scale-proof
          label: 规模与证明：$500M ARR、55%+ YoY、Fortune 10 客户
          type: input
        - id: moat
          label: 护城河：Revenue Graph 数据飞轮、Gartner RAO Leader、25M+ 次互动
          type: input
        - id: economics
          label: 经济性：接近盈利、已融资 $584M、Series E 大部分仍在账上
          type: input
        - id: risks
          label: 风险：Salesforce/Microsoft 原生打包、Clari+Salesloft 竞争、关键人
          type: risk
        - id: valuation-primary
          label: 一级估值：$7.25B（14.5x ARR）— 相比 8–12x 同行区间偏高
          type: risk
        - id: valuation-secondary
          label: 二级市场：约 $4.5B（9x ARR）— 更接近公允价值
          type: positive
        - id: gaps
          label: 缺口：NRR、毛利率、股权结构、烧钱速度——均未披露
          type: gap
        - id: track
          label: 推荐：TRACK — 在二级市场或更低价格进入；避开一级
          type: output
        - id: upgrade-condition
          label: 若满足则上调至 BUY：NRR >120%、审计后利润率 >70%、进入估值 <$4.5B
          type: conditional
        - id: downgrade-condition
          label: 若出现则下调至 AVOID：增长 <25%、down-round、CFO 离任
          type: conditional
    claimRefs:
      - CV001
      - CV012
      - CV015
      - CV034
      - CV040
      - CV043
