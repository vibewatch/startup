  - id: FE001
    title: 产品架构图
    type: stack
    layout: standard
    summary: Gong Revenue AI OS 的分层架构，从 UI 应用一路到 AI 模型和云基础设施。
    data:
      layers:
        - label: 用户应用（GTM 层）
          modules:
            - Foundation：通话库、交易看板、辅导仪表盘
            - Engage：邮件撰写器、Flows、拨号器、待办
            - Forecast：预测看板、账户看板、提交汇总
            - Enable：评分卡、AI Trainer 模拟、Initiatives
        - label: Gong Assistant + Agent Studio
          modules:
            - Gong Assistant：对话式 Q&A、文档生成、评分卡构建器
            - Agent Studio：15 个具名代理（AI Briefer、AI Composer、AI Deal Monitor、AI Revenue Predictor 等）
            - MCP Interface：外部 AI 编排器通过 Model Context Protocol 接入
        - label: Revenue AI / 智能层
          modules:
            - Gong Revenue Graph：互动 → CRM 商机映射
            - 自研 NLP：主题、Trackers、Smart Trackers、交易信号、竞品提及
            - 生成式 AI：第三方 LLM + Gong 提示工程（Spotlight、Ask Anything、Composer）
            - Elo 评级模型评估：持续基准测试与模型替换
        - label: 数据摄取与处理层
          modules:
            - 机器人录制器 / 原生 API：Zoom、Teams、Google Meet、电话（Twilio）
            - 自研转写：70+ 种语言，针对收入对话优化
            - 交易关联算法：MongoDB Atlas ACID 事务，5 个分片
            - Snowflake 集成：分析聚合与数据共享
        - label: 基础设施层（AWS，美国 + 欧盟）
          modules:
            - AWS 云计算与存储（美国和欧盟区域）
            - MongoDB Atlas：运营数据库、ACID、5 个分片
            - AWS KMS + BYOK：加密密钥管理
            - Mailgun（电子邮件）、Twilio（VoIP/SMS）、Gong.io Ltd（以色列研发）
    approximationNotes: LLM 供应商身份未公开；自研与第三方 AI 组件之间的层级边界，是根据子处理方清单和文档推断。
