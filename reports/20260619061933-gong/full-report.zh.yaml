      - number: '2.5'
        title: 采用约束、竞争与数据治理风险
        blocks:
          - type: paragraph
            body: >
              收入智能市场面临三方面结构性逆风：超大云厂商捆绑竞争、监管摩擦，以及同意录音法律的复杂性。


              Microsoft 365 Copilot for Sales 和 Salesforce Agentforce/Einstein AI 都包含原生 AI
              会议摘要、交易智能和销售工作流自动化。这些能力与收入智能平台直接重叠，且现有 Microsoft 和 Salesforce 客户可以用低于独立平台的增量成本获得。到 2026 年初，Salesforce 已通过
              Einstein AI 处理 11 trillion 个 LLM tokens，反映其深度嵌入企业 Sales Cloud 工作流。Microsoft 在 Teams 和 Outlook
              中的捆绑（几乎所有企业客户都在使用）为不需要 Gong AI 模型深度或数据网络效应的买家，提供了「够用」替代方案。Microsoft 和 Salesforce 都把 AI
              销售能力定位为现有企业协议的捆绑附加项，进一步降低「够用」替代品的感知成本。超大云厂商竞争是 Gong 市场增长轨迹的主要下行风险。收入智能平台供应商通常要求 2–3
              年订阅合同，这为现任供应商提供切换成本保护；但如果合同期内出现技术更优或被捆绑销售的替代品，下行风险也会被放大。


              GDPR 和类似隐私法规要求 AI 系统在记录和处理个人数据时具备合法基础。英国 ICO 的 AI 与 GDPR 指南把数据最小化、目的限制和透明的自动化决策列为 AI
              部署要求——这些都适用于处理通话录音、邮件内容以及员工和客户行为模式的收入智能系统。Gong 持有 EU-US Data Privacy Framework 认证，并拥有全面合规组合（SOC 2 Type
              2、ISO/IEC 27001:2022、面向 AI 管理的 ISO/IEC 42001:2023），但合规开销仍会拉长金融服务和医疗健康垂直领域的企业销售周期。


              至少十个美国州和 District of Columbia 要求通话录音取得全方同意，这给客户带来配置复杂性和法律责任。Gong
              提供同意通知工具，但客户承担正确配置的法律责任。这些录音法律约束是企业采购中的反复异议；在法律资源有限、难以管理合规的 SMB 客户中，也会增加明显摩擦。未来 18–36 个月内，超大云厂商 AI
              是否会把通话记录和转写商品化，从而消除纯会话智能供应商的独立价值主张，仍是 RAO 市场未解的战略风险。
            claimRefs:
              - CM036
