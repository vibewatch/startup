      - number: '4.3'
        title: 单位经济、毛利率与隐含效率
        blocks:
          - type: paragraph
            body: >-
              Gong 作为私营公司没有披露单位经济指标。毛利率、净收入留存（NRR）、客户获取成本（CAC）、回本周期和分产品 ARR
              拆分，公开披露中都缺失，形成需要管理层账户访问才能补上的重大承销缺口。尽管信息不透明，若干结构性代理指标和可推断信号仍能提供部分背景。

              毛利率：与 Gong 规模和架构相近的企业 SaaS 同行——以软件为主，有云托管、AI 推理成本、无硬件——通常报告 70–80% 区间的毛利率。Gong 的 AI 推理和数据处理工作负载（处理 25M+
              销售互动以支撑 Revenue Graph）构成不小的算力成本，可能使利润率低于更轻量的同行；不过，处理过的训练数据规模会让边际推理成本递减。2026
              年初专业服务扩大五倍，引入更低毛利的服务收入组合；若其规模足够大，会把混合毛利率拉低到纯软件水平之下。

              收入效率：以 $500M ARR 和约 1,700 名员工计算（CEO 2026 年 5 月向 Calcalis 表述），Gong 隐含每名全职员工 ARR 约为 $294K。企业 SaaS 中位数通常为
              $200–350K，前四分位公司超过 $400K。该比率很可能已显著改善：2025 年 11 月，公司 $300M ARR、1,300 名员工时，比率为 $231K。净收入留存未披露，但多产品采用轨迹（15
              个月内从四分之一升至二分之一）意味着存量客户扩张高于收缩。CEO 表示公司在 $300M ARR 时“接近盈利”，并且可以“随时实现盈利”；到 $500M ARR 时，这意味着烧钱受控，且很可能在下降。
