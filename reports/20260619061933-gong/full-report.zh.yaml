    sections:
      - number: '1.1'
        title: 公司身份与产品概览
        blocks:
          - type: paragraph
            body: >-
              Gong 是一家私人 B2B 软件公司，注册地为 Delaware，总部位于 California 州 San Francisco，在 Israel 的 Ramat Gan 设有主要研发中心，并在 New
              York、Austin、Dublin、Singapore、Salt Lake City 和 Chicago 设有办公室。公司由 CEO Amit Bendov 和 CPO Eilon Reshef 于 2015
              年创立，2016 年推出商业化产品，最初是一款 AI 驱动的会话智能工具，可自动记录、转写和分析 B2B 销售电话。之后十年，平台大幅演进为公司现在所称的 Revenue AI Operating
              System：一套统一技术栈，捕捉电话、邮件和网页会议中的客户互动；把信号汇入专有 Gong Revenue Graph；调用基于超过 25 million 次销售互动训练的专用 AI
              模型；再为销售、收入运营、销售赋能和客户成功团队输出决策、自动化和工作流。商业模式是经常性 SaaS 订阅，按用户授权，同时叠加平台费，并面向企业客户采用定制价格。从电话记录扩展到预测（Gong
              Forecast）、销售互动（Gong Engage）、辅导（Gong Enable）和 AI agent 自动化（Gong Assistant），是多产品采用的主引擎；截至 2026 年 5 月，50%
              客户已使用多个 Gong 产品。使用传统 CRM 的销售人员约 77% 时间花在非销售活动上，Gong 瞄准的正是这种结构性低效。
