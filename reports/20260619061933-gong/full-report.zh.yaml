      - number: '8.3'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >
              到 2026 年 6 月，没有哪一家上市公司能完美类比 Gong，但区间测算仍有信息量。在上市 sales/CRM/revtech 范围内，ZoomInfo（2025 年更名后交易名为 GTM）倍数最低，为
              0.66x trailing revenue，反映其增长持平到下滑（同比 2.9%，TTM 收入 $1.25B）以及多位分析师下调评级。HubSpot（HUBS）在 21% 增长和 $9.0B
              市值下，交易倍数约为 2.74x trailing revenue。Salesforce（CRM）在 11% 增长和 $124B 市值下，交易倍数约为 2.9x trailing
              revenue。这些可比公司都不匹配 Gong 55%+ 的增长曲线，说明相对上市 SaaS 基准给出溢价是合理的——但溢价上限受制于市场愿意为未经审计的私营公司增长声明支付多少。在私有市场，Sacra 估计
              Outreach 2021 年 6 月以 $250M ARR 对应 $4.4B 估值（17.6x），Apollo 2023 年 8 月以 $96M ARR 对应 $1.6B
              估值（16.6x）。这些私有可比都是不同利率环境下的旧标记。最相关的前瞻锚点是 AI-native SaaS 队列：Anysphere（Cursor）在 2025 年初被引用的 ARR 倍数为
              25x——但它处在从近零起步的超高速增长轨道，Gong 在 $500M 规模上无法复制。对一个 50%+ 增长、接近盈利、拥有 5,000+ 付费客户的企业 AI SaaS 平台而言，按 2026
              年校准的合理倍数约为 8–12x trailing ARR，对应公允价值区间 $4.0B–$6.0B。这个区间包住二级市场标记，并显著低于 primary。
