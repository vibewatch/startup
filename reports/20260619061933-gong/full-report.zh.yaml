      - number: '8.7'
        title: 图表附录
        blocks:
          - type: callout
            title: 二级价格下 TRACK；Primary 价格下回避
            body: >
              证据支持 TRACK 建议：Gong 的增长轨迹、品类领导力和接近盈亏平衡的经济性确实出色，但 2021 年设定的 $7.25B primary 估值，比最近二级市场证据高 38%，也显著高于 2026 年
              SaaS 可比分析隐含的 8–12x ARR 区间。入场纪律是决定变量。以约 $4.5B 入场的二级买家拿到的是公平价格，并有可信基准情景；以 primary
              价格买入，则需要牛市退出才能打平。六个重大尽调缺口——NRR、毛利率、cap table、烧钱率、2026 年竞争赢 / 输和期权悬顶——必须解决后，结论才可上调为买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV015
              - CV034
              - CV043
          - type: callout
            title: 优先权悬顶和期权重定价风险尚未量化
            body: >
              Gong 已通过五轮机构融资募得 $584M，但从未披露清算优先权结构或期权池条款。Calcalist 2025 年 11 月报道明确指出，员工期权是否已从 2021 年 $7.25B
              高水位重定价仍不确定。在熊市或基准退出中，参与型优先股结构可能在普通股股东拿到收益前吸收 20–30% 的名义估值。投资人必须把 cap table 视为阻塞性尽调事项。
            calloutType: risk
            claimRefs:
              - CV036
              - CV037
              - CV038
          - type: callout
            title: 二级市场是唯一当前价格信号
            body: >
              2021 年以来没有 primary 融资，也没有公开交易，2025 年 11 月约 $4.5B 的二级市场标记（经 Nasdaq Private Market，非公司批准）是 Gong
              股权唯一独立的同期价格信号。它隐含较 primary 估值折让 38%。二级价格包含流动性折价，但折价幅度——再加上 CEO 自己关于「doesn't know what valuation we would
              receive today」的评论——说明截至 2026 年 6 月，primary 标记已明显过时。
            calloutType: insight
            claimRefs:
              - CV015
              - CV016
              - CV017
