            body: >-
              Gong 拥有 revenue-AI 类别中最完整的合规组合之一。经第三方验证的认证包括 SOC 2 Type II（安全、可用性、保密性、隐私；含 HIPAA 映射）、ISO
              27001:2022（信息安全管理）、ISO 27017（云服务控制）、ISO 27018（公有云 PII）、ISO 27701（隐私信息管理）、ISO 42001:2023（AI 管理体系——截至 2026
              年中唯一拥有该认证的主要 revenue-AI 厂商）、PCI DSS SAQ-D（仅限电话通话采集范围）和 CSA STAR 注册。公司通过 EU-US Data Privacy Framework 认证（包括
              UK Extension 和 Swiss-US DPF），并遵守 GDPR、CCPA 和 HIPAA。数据层面，所有传输流量通过 TLS 1.2 加密，静态数据通过 AES-256 加密；密钥管理使用 AWS
              KMS，并可选客户自管 BYOK 加密。多租户数据通过 MongoDB Atlas 客户分片做逻辑隔离。访问控制采用四层 RBAC 模型（Collaborator、Standard、Business
              Admin、Technical Admin），并配有细粒度权限配置；SCIM 配置和 SAML 2.0、OAuth 2.0、OIDC SSO 可接入
              Google、Microsoft、Salesforce、Okta 和 OneLogin。同意机制可按地区或使用场景配置，包含托管同意页、音频提示和会前邮件。Gong 运行公开 Vulnerability
              Disclosure Program（vdp.gong.io），并每年委托独立渗透测试。每日备份和 AWS 多区域冗余支撑 99.5% 正常运行时间 SLA。PCI DSS
              范围有一条关键说明：合规只覆盖电话通话采集——网页录制通话和邮件数据不在 PCI 范围内——受监管行业的企业买家必须谨慎评估。
