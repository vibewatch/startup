chapter:
  number: 6
  title: "Customers"
  summary: >
    Gong serves more than 5,000 enterprise companies globally as of May 2026, including half of the Fortune 10, with
    named customers spanning ADP, Anthropic, Canva, Cisco, Docusign, Google, Thomson Reuters, and Uber for Business.
    Canva documented a 60% lift in sales rep capacity; 50% of customers now run multiple Gong products (up from 25%
    in March 2025), signaling a strong land-and-expand motion. No NRR, GRR, or cohort data are publicly disclosed,
    creating a material diligence gap on retention durability, offset partly by G2's 6,660 reviews at 4.7 stars.

sections:
  - id: customer-base-segmentation
    title: "Customer Base and Segmentation"
    body: >
      Gong's addressable buyer is any B2B company with a structured go-to-market team that runs quota-carrying
      salespeople and revenue operations. The primary buyer is typically the Chief Revenue Officer, VP of Sales,
      or Head of Revenue Operations at a company with 200–10,000+ employees; the day-to-day users include account
      executives, sales development representatives, revenue operations analysts, sales enablement managers, customer
      success managers, and more recently professional-services and support teams. As of May 2026, Gong serves more
      than 5,000 companies worldwide, with half of the Fortune 10 as customers — a significant concentration at
      the very top of the enterprise market. The platform reaches across seven or more verticals: technology, media,
      telecommunications, professional services, financial services, healthcare, and manufacturing. The technology
      vertical is disproportionately represented, given Gong's origins as a Silicon Valley SaaS tool and its deep
      integration with Salesforce, HubSpot, and cloud-native CRM stacks. Enterprise technology customers are the
      most visible (ADP, Anthropic, Canva, Cisco, Docusign, Google, Paycor, Thomson Reuters) and likely drive the
      fastest contract growth, given the $1M+ ACV acceleration. Channel dependence is moderate: Gong sells primarily
      direct and through Salesforce partnerships, but Zapier, Workato, and Make.com integrations reflect demand from
      operations-driven buyers who embed Gong into broader automation workflows. Geographically, US-only data storage
      is the default architecture, creating a compliance friction point for non-US enterprises in GDPR-regulated
      markets, though Gong does offer multi-jurisdictional data handling for large accounts. The buyer profile is
      homogeneous in one sense — all payers are B2B companies with structured sales motions — but heterogeneous in
      vertical, size, and technical maturity, which creates both an expansion opportunity and a segmentation risk
      if economic cycles differentially impact tech versus non-tech verticals.
