  - id: expansion-concentration-risk
    title: "Expansion Motion, Land-and-Expand, and Concentration Risk"
    body: >
      Gong's land-and-expand model is structurally visible in the data. The typical entry motion is a conversation
      intelligence deployment for the core sales team, often starting with a subset of seats, and expanding to full
      revenue organization coverage. Gong's platform economics reward breadth: adding Gong Engage (sales engagement)
      or Gong Forecast (predictive pipeline) drives ACV expansion without requiring new enterprise approval cycles
      at the customer. The doubling of multi-product adoption from 25% to 50% in 14 months confirms this motion is
      executing at scale. Partner ecosystem embeddedness through Zapier, Workato, Make.com, Salesforce, and HubSpot
      integrations increases workflow lock-in, making replacement more disruptive operationally. Concentration risk
      operates on two axes. First, vertical concentration: the technology sector is disproportionately represented
      among public reference customers. A B2B tech hiring slowdown or budget compression (as seen in 2023–2024)
      would stress Gong's customer base more than a diversified software portfolio. Second, top-account
      concentration: the acceleration of $1M+ deals in the last two quarters of the measurement period implies a
      growing share of ARR is held by a small number of very large customers. Gong has not disclosed its customer
      concentration metrics (e.g., what percentage of ARR is attributable to the top 10 or top 50 customers).
      Procurement friction is real: competitors and reviewers consistently cite rigid multi-year contract structures
      and opaque pricing as barriers to adoption at smaller enterprises, potentially limiting TAM expansion
      downmarket. Channel dependence on Salesforce Ventures (Series D and E investor) raises a strategic question
      around co-sell terms and any exclusivity arrangements that have not been publicly disclosed.
