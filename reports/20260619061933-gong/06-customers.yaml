  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "retention"
      missingEvidence: "Gong's Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo churn rate for fiscal years 2024 and 2025"
      whyItMatters: "Without NRR and GRR, it is impossible to determine whether Gong's 55%+ ARR growth is driven by durable upsell or by volume of new logos that may not renew; a company with poor GRR can temporarily mask it with aggressive new-logo growth."
      diligencePath: "Request NRR and GRR by segment, quarter, and cohort year in management sessions; require disclosure as pre-condition for term sheet; monitor S-1 if IPO proceeds."
      relatedQuestionRefs: [QU024]

    - type: missing-source
      severity: material
      topic: "customer-outcomes"
      missingEvidence: "Independent third-party verification of Canva's 60% rep capacity lift and any similar outcome claims for other named customers"
      whyItMatters: "All specific outcome metrics in public evidence are sourced from Gong's own press releases; without independent corroboration, outcomes may be cherry-picked, self-reported by customers under incentive, or measured over an unrepresentative time window."
      diligencePath: "Request direct customer reference calls with Canva, ADP, and Cisco; obtain original ROI study methodology and measurement window; seek independent analyst case studies."
      relatedQuestionRefs: [QU011, QU009]

    - type: missing-source
      severity: material
      topic: "concentration-risk"
      missingEvidence: "Top-10 and top-50 customer ARR concentration data; renewal dates for largest contracts; vertical ARR mix"
      whyItMatters: "Accelerating $1M+ deal growth implies rising ARR concentration in a small number of enterprise accounts; loss of one or two mega-accounts could represent a material miss; without disclosure this risk is unquantifiable."
      diligencePath: "Request customer revenue concentration report (top-10 and top-50 as percentage of total ARR); request renewal schedule for all $1M+ contracts."
      relatedQuestionRefs: [QU023]

    - type: missing-source
