callouts:
  - calloutType: strength
    title: "Strong Land-and-Expand with 50% Multi-Product Adoption"
    body: >
      The doubling of multi-product adoption from 25% (Q1 2025) to 50% (May 2026) in just 14 months is the
      strongest commercial signal in this chapter. When half of all customers run Gong Engage or Gong Forecast
      alongside core call intelligence, Gong has successfully converted from a point solution to a platform.
      This should translate to NRR materially above 100% — though the actual figure remains undisclosed and
      must be confirmed in diligence.
    claimRefs:
      - CU016
      - CU017

  - calloutType: risk
    title: "Material Retention Gap: No NRR, GRR, or Cohort Data Disclosed"
    body: >
      Gong's refusal to disclose NRR, GRR, or cohort retention metrics is the single largest diligence gap
      in this chapter. At $500M ARR growing 55%+ YoY, the implied NRR needed to sustain growth through
      upsell (rather than pure logo adds) would need to exceed 130%. Without disclosure, there is no way
      to determine whether the ARR growth is structurally durable or concentrated in a small number of
      recent large contracts. Investors should require NRR and GRR disclosure as a pre-condition for any
      term sheet.
    claimRefs:
      - CU028
      - CU029
      - CU031

  - calloutType: risk
    title: "Tech-Vertical Concentration and Data Residency Friction Limit Global TAM"
    body: >
      Gong's public customer evidence is heavily skewed toward US enterprise technology companies. US-only
      default data storage creates a compliance barrier for EMEA and APAC regulated-sector enterprises.
      Competitor analysis by Oliv.ai and Cloudtalk.io confirm pricing rigidity and multi-year contract
      structures deter downmarket expansion. These factors together limit Gong's addressable market in
      non-tech verticals and non-US geographies unless infrastructure investments are made to address
      data residency requirements.
    claimRefs:
      - CU026
      - CU027
      - CU030

