  - id: named-customer-evidence
    title: "Named Customer Evidence and Production Deployments"
    body: >
      Gong has published or confirmed production use by a substantial list of global enterprises. The highest-quality
      public evidence comes from the May 2026 press release announcing $500M ARR, which lists ADP, Anthropic, Canva,
      Cisco, Docusign, Google, Paycor, Thomson Reuters, and Uber for Business alongside a specific outcome claim:
      Canva achieved a 60% lift in sales rep capacity. Canva's deployment encompasses the full Revenue AI Operating
      System including conversation intelligence, coaching, and pipeline analytics. An earlier March 2025 TechCrunch
      interview with CEO Amit Bendov named Google, LinkedIn, Canva, and Square as customers; LinkedIn's deployment
      predates the May 2026 announcement and has likely expanded. Kustomer's SVP of Global Sales confirmed Gong was
      operationally critical during a market turbulence period ("I don't know how we would have survived these
      uncertain times without Gong"), providing an independent customer-voice testimonial published on Gong's blog.
      PeerSpot reviewers include a CSM who attributed a 10% ARR increase to Gong's coaching and renewal tracking
      features, a Senior Director at a 51–200 person tech company, and multiple account executives at SMB-to-midmarket
      technology firms. These reviews confirm cross-functional adoption beyond the initial sales-rep wedge. The
      evidence base is skewed toward named technology and information-services companies; financial services,
      healthcare, and manufacturing case studies are absent from public disclosures, creating a verification gap
      for these verticals. No named customer has publicly corroborated a pilot-only or failed deployment, which
      limits adverse signal triangulation. The Gong Visioneers community (visioneers.gong.io) provides a peer
      advocacy and learning network, including an Academy and customer events calendar, confirming active community
      investment in retention and expansion programs.
