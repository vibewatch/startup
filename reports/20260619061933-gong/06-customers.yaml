  - id: adoption-trajectory
    title: "Adoption Trajectory and Customer Growth"
    body: >
      Gong's customer count trajectory is among the clearest adoption signals in the public record. From 2,000+
      companies at Series E in June 2021 (when the company was last valued at $7.25B), the base grew to 4,500 as
      of March 2025 (CEO-confirmed in TechCrunch interview), crossed 5,000 in September 2025 when Simon Frey was
      appointed Chief Customer Officer, and remained at 5,000+ in the May 2026 $500M ARR announcement. The
      arithmetic implies net new adds of roughly 500 companies per year over the 2021–2026 window — steady volume
      expansion but not explosive count growth, consistent with a move upmarket to fewer, larger enterprise accounts.
      Multi-product adoption is the sharpest trajectory signal: 25% of customers (1 in 4) used multiple Gong
      products in Q1 2025; 50% did so by May 2026 — a doubling in roughly 14 months. Gong added more $1M+ annual
      contract customers in the last two quarters before May 2026 than in the prior six combined. Gong Assistant
      (flagship AI feature) usage grew more than 200% year-over-year by May 2026, and Ask Anything usage grew 400%
      YoY as of Q1 2025. The platform processed over 25 million sales interactions, providing the data scale for
      Gong Labs research and model training. G2 shows 6,660 user reviews at 4.7 stars as of June 2026 (archived),
      vs. competitors that typically have 1,000–3,000 reviews, indicating a large and engaged user community.
      Fortune 10 penetration expanded from four companies (Q1 2025) to half of the Fortune 10 (May 2026),
      confirming that the largest global accounts are actively deploying, not piloting.
