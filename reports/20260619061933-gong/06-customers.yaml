  - id: retention-satisfaction
    title: "Retention, Satisfaction, and Durability Proxies"
    body: >
      Gong does not publicly disclose Net Revenue Retention (NRR), Gross Revenue Retention (GRR), customer churn
      rate, or cohort-level retention data. This is a significant due diligence gap given that the company's $500M
      ARR at 55%+ YoY growth, if driven substantially by upsell rather than net-new logos, requires NRR above 130%
      to sustain current growth — a figure that is unverifiable from public sources. Proxies for retention quality
      exist but are indirect. The 50% multi-product adoption rate is the strongest implicit retention signal:
      customers running Gong Engage and Gong Forecast alongside the core call intelligence product have integrated
      Gong into core revenue workflows, elevating switching costs materially. Enterprise SaaS contracts with $1M+
      ACVs typically carry 12–24 month terms with auto-renewal, further anchoring churn rates. User satisfaction
      scores are high: G2 ratings average 4.7 out of 5 across 6,660 reviews, with reviewers consistently citing
      call transcription accuracy, AI summaries, and coaching utility. PeerSpot reviews highlight practical
      outcomes including improved renewal rates and coaching effectiveness. Work-management.org's independent review
      calls out AI accuracy and ease of adoption. The primary satisfaction complaints are: slow customer support
      (multiple PeerSpot reviewers), poor Microsoft Teams integration quality (vs. Zoom and Google Meet), pricing
      opacity (noted by competitor analysts), and US-only data storage by default (flagged by security/compliance
      researchers). No NRR or churn is verifiable; the diligence path is direct negotiation with Gong management or
      review of pre-IPO S-1 disclosures should the company proceed to public markets.
