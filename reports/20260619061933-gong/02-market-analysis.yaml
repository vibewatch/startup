  claims:
    - id: "CM001"
      statement: "Revenue intelligence is a category of AI-powered software that automatically captures B2B customer interactions—calls, emails, meetings, and CRM touchpoints—analyzes them with machine learning, and surfaces actionable insights for sales, customer success, and revenue operations teams."
      type: "third-party-reported"
      topic: "market-definition"
      sourceRefs: ["SM001", "SM003"]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: ["QM001"]

    - id: "CM002"
      statement: "Conversation intelligence is a narrower sub-category that specifically records, transcribes, and analyzes verbal conversations to identify coaching opportunities, track deal objections, and measure rep performance—without the forecasting, deal analytics, or workflow orchestration layers of revenue intelligence."
      type: "third-party-reported"
      topic: "market-boundary"
      sourceRefs: ["SM002", "SM015"]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: ["QM001"]

    - id: "CM003"
      statement: "Gartner published the inaugural Magic Quadrant for Revenue Action Orchestration (RAO) in December 2025, formally establishing RAO as a distinct analyst-tracked category by evaluating 12 vendors across Critical Capabilities; three vendors were named Leaders."
      type: "third-party-reported"
      topic: "analyst-coverage"
      sourceRefs: ["SM019", "SM004"]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: ["QM008"]

    - id: "CM004"
      statement: "The Gartner RAO category definition describes the market as the convergence of previously separate sales engagement and revenue intelligence markets, per the December 2025 Gong press release describing the inaugural RAO Magic Quadrant."
      type: "third-party-reported"
      topic: "analyst-coverage"
      sourceRefs: ["SM019"]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: ["QM008"]

    - id: "CM005"
      statement: "Adjacent revenue technology spend includes the global CRM market ($112.91B in 2025), sales analytics platforms, sales engagement tools, and marketing automation—all representing complementary spending pools where revenue intelligence integrates rather than substitutes."
      type: "estimated"
      topic: "adjacent-spend"
      sourceRefs: ["SM017", "SM012"]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: ["QM002"]

    - id: "CM006"
      statement: "Revenue intelligence platforms differentiate from legacy CRM by automating data capture—eliminating manual rep logging—and applying AI to generate pipeline intelligence and coaching recommendations from captured interaction data."
      type: "company-claimed"
      topic: "product-differentiation"
      sourceRefs: ["SM001", "SM018"]
      confidence: "medium"
      freshness: "current"

    - id: "CM007"
      statement: "Status-quo alternatives to revenue intelligence platforms include manual CRM data entry, spreadsheet-based forecasting, periodic manager-led call reviews, and legacy call recording tools without AI analysis—all of which rely on human effort for data capture and synthesis."
      type: "inferred"
      topic: "competitive-substitutes"
      sourceRefs: ["SM003", "SM006"]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: ["QM003"]

    - id: "CM008"
      statement: "Gong is one of only three Leader vendors in the inaugural Gartner Magic Quadrant for Revenue Action Orchestration (December 2025) and was ranked highest across all four Critical Capabilities use cases."
      type: "third-party-reported"
      topic: "analyst-coverage"
      sourceRefs: ["SM019", "SM004"]
      confidence: "high"
      freshness: "current"

    - id: "CM009"
      statement: "Revenue Action Orchestration platforms unify sales engagement (automated outreach sequencing and cadences), conversation intelligence, AI-powered forecasting, rep coaching, and deal management into a single workflow orchestration layer."
      type: "third-party-reported"
      topic: "category-definition"
      sourceRefs: ["SM019", "SM022", "SM016"]
      confidence: "medium"
      freshness: "current"

