  - id: comparable-analysis
    title: Comparable Valuation Framework
    body: >
      No single public company is a perfect Gong analogue in June 2026, but the bracketing
      exercise is informative. Within the public sales/CRM/revtech universe, ZoomInfo (now
      trading as GTM after a 2025 rebranding) commands the lowest multiple—0.66x trailing
      revenue—reflecting flat-to-declining growth (2.9% YoY, $1.25B TTM revenue) and multiple
      analyst downgrades. HubSpot (HUBS) trades at approximately 2.74x trailing revenue on
      21% growth and a $9.0B market cap. Salesforce (CRM) trades at approximately 2.9x
      trailing revenue on 11% growth and a $124B market cap. None of these comps match
      Gong's 55%+ growth profile, confirming that a premium to public SaaS benchmarks is
      warranted—but the premium ceiling is constrained by the market's willingness to pay
      for un-audited private-company growth claims.
      In the private market, Sacra estimates that Outreach carried a $4.4B valuation against
      $250M ARR (17.6x) in June 2021, while Apollo was valued at $1.6B against $96M ARR
      (16.6x) in August 2023. These private comps are all older marks set in different rate
      environments. The most relevant forward-looking anchor is the AI-native SaaS cohort:
      Anysphere (Cursor) was cited at a 25x ARR multiple in early 2025—but on a hypergrowth
      trajectory from near-zero that Gong cannot replicate at $500M scale. A reasonable
      2026-calibrated multiple for a 50%+ growth, near-profitable enterprise AI SaaS platform
      with 5,000+ paying customers is approximately 8–12x trailing ARR, implying a fair
      value range of $4.0B–$6.0B. This range brackets the secondary mark and sits materially
      below the primary.
