  - id: scenario-analysis
    title: Scenario Analysis — Bull, Base, and Bear Cases
    body: >
      The three scenarios are anchored to observable growth vectors and calibrated to the
      June 2026 starting point of $500M+ ARR at 55%+ YoY growth. Each case applies a
      different terminal ARR multiple at exit, reflecting the degree of business maturity,
      exit-window timing, and competitive moat erosion by that date. The valuation range
      in all scenarios is modelled at the time of a potential exit (IPO or strategic), not
      at today's secondary price; investors entering at the secondary mark (~$4.5B) should
      therefore assess potential return multiples relative to entry, accounting for further
      dilution from any primary raise before exit.
      Bull case: Gong sustains 40–50% ARR growth through fiscal 2027, reaches $700M+ ARR
      by mid-2027, achieves IPO at a 12–15x ARR multiple in a benign public market, and
      common shareholders capture 85–90% of headline valuation after liquidation preferences.
      Implied exit equity value: $8.4B–$10.5B. Return on $4.5B secondary entry: ~1.9–2.3x.
      Base case: Growth decelerates to 30–40% as competition intensifies, Gong reaches
      $650M ARR by end of 2027, IPOs at an 8–10x multiple within 24 months. Common equity
      capture 80% after preferences. Implied exit equity value: $5.2B–$6.5B. Return on
      $4.5B secondary entry: ~0.9–1.2x (modest or flat).
      Bear case: Growth deceleration below 25%, delayed IPO (3+ years), competitive
      displacement by Salesforce or Microsoft, and a forced secondary or strategic at
      5–7x ARR. Implied exit value: $3.5B–$4.5B. Return on $4.5B secondary entry:
      ~0.6–1.0x (capital preservation risk). A further down-round scenario cannot be
      excluded if Gong needs fresh primary capital before IPO.
