  - id: valuation-context
    title: Valuation Context — Primary vs. Secondary Evidence
    body: >
      Gong's last primary capital event was the June 2021 Series E: $250M raised at a $7.25B
      post-money valuation, led by Franklin Templeton with participation from Coatue, Salesforce
      Ventures, Sequoia, Thrive Capital, and Tiger Global. The SEC Form D filed June 15, 2021
      confirms the offering and issuer, anchoring the primary valuation in regulatory record.
      At that time Gong reported approximately 2,000 customers and 2.3x ARR growth—implying
      an ARR base of roughly $100–135M—so the 2021 multiple ranged from 54x to 73x forward ARR,
      a peak that reflected pandemic-era SaaS euphoria rather than normalised demand conditions.
      The first credible public signal of post-2021 repricing came in November 2025, when
      Calcalist reported that Gong shares were trading on Nasdaq's private market platform at
      an implied valuation of approximately $4.5B—a 38% discount from the 2021 Series E price.
      Gong did not approve those secondary transactions and declined to comment on valuation
      speculation. The secondary mark is a real but imprecise signal: it reflects liquidity-
      discount and seller urgency, not a clean arm's-length primary; nonetheless, it is the
      only independent market price for Gong equity between 2021 and today.
      Applying the secondary mark to the May 2026 ARR base of $500M+ implies a 9x trailing ARR
      multiple. Applying the primary mark yields 14.5x. For context, Sacra estimated an early-2026
      secondary transaction at approximately $4.5B, consistent with Calcalist's reporting.
      CEO Bendov's March 2025 statement—"I don't know what valuation we would receive today
      because market multiples have changed"—is itself an implicit acknowledgement that the
      2021 price is likely stale.
