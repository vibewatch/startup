  - id: exit-readiness-diligence
    title: Exit Readiness and Final Diligence Asks
    body: >
      Gong exhibits several IPO-readiness signals: a new CFO (Todd Busler, appointed 2025),
      a Gartner Magic Quadrant leadership position, $500M ARR scale, near-profitability
      posture, and a CEO who has publicly articulated IPO as a goal. The company has operated
      as a de-facto public-equivalent at scale—5,000+ customers, Fortune 10 penetration,
      multi-product at 50% adoption—and its revenue graph data moat becomes harder for
      competitors to replicate with each passing quarter of accumulated interactions.
      However, the SaaS IPO window in 2026 remains selective: public market investors are
      demanding demonstrated profitability or a credible near-term path (FCF margin >15%)
      before awarding premium multiples. Gong's "nearly profitable" posture has not been
      tested against independent auditors or public market disclosure standards. The company
      has no disclosed history of GAAP financials, cohort data, or NRR benchmarks, all of
      which are table-stakes for a technology IPO.
      Six diligence topics are material blockers to a firm investment recommendation at any
      price. First, the full audited cap table with liquidation preferences and antidilution
      provisions. Second, independently audited or reviewed GAAP revenue and gross margin
      for the trailing two years. Third, net revenue retention (NRR) disaggregated by cohort
      to verify whether the ARR growth is driven by new logos or expansion. Fourth, actual
      burn rate and cash balance to confirm the CEO's assertion that proceeds are largely
      intact. Fifth, competitive win/loss data against Salesforce Agentforce and Microsoft
      Copilot in enterprise RFPs during 2026. Sixth, the status of any pending legal or IP
      claims post the 2024 HyperDoc patent dismissal. Until these gaps are closed, the
      appropriate call is TRACK with a primary entry price discipline of $4.0–4.5B.
