  - id: roadmap-release-cadence
    title: "Roadmap and Release Cadence"
    body: >-
      Gong operates a continuous-delivery model with no published quarterly release cycle; features surface as "available" or "launching later this year" in Agent Studio configuration. The platform version v17.main.33029 (visible on the sign-in page, June 2026) reflects a build-over-build cadence aligned to cloud-native SaaS practice. Major product milestones in 2026 include Agent Studio launch (self-service agent configuration), Gong Assistant enhancements (document creation, scorecard generation, file uploads, dedicated workspace), MCP integration for external AI orchestrators, and a series of new AI agents. Gong was named a Leader in the Gartner Magic Quadrant for Revenue Action Orchestration and #7 in Fast Company's Most Innovative Companies 2026 Applied AI category—both recognized in the first half of 2026 alongside the ARR-surpassing-$500M announcement in May 2026. AI-agent monthly user growth of 75% YoY and Gong Assistant usage growth of 200%+ YoY from the May 2026 press release signal rapid feature adoption. Strategic roadmap direction: Engage, Forecast, and Enable modules are the primary expansion surface (50% of customers run multiple products). Key diligence gaps include the absence of a public product roadmap with committed delivery dates, no disclosed plan for on-premise or self-hosted deployment, limited AI feature parity across non-English languages, and the reliance on third-party LLMs for generative features creating dependency risk if model access or pricing changes. Gong's generative AI capabilities remain tightly coupled to AWS and external LLM providers, representing concentration risk in the infrastructure dependency graph.
