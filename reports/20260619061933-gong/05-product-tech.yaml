callouts:
  - calloutType: strength
    title: "ISO 42001 AI Governance Certification — Industry First"
    body: "Gong's ISO 42001:2023 certification (AI Management System) positions it as an industry leader in responsible AI deployment for revenue teams. This certification documents organizational AI governance, ethical AI use, and risk/impact assessments—and explicitly confirms that customer data is not used to train shared generative AI models. No major competing revenue-AI platform holds this certification as of mid-2026, creating a trust-based differentiation that is particularly compelling for regulated enterprises."
    claimRefs:
      - CE005
      - CE022
  - calloutType: risk
    title: "Generative AI LLM Dependency — Undisclosed Vendor, Concentration Risk"
    body: "Gong's generative AI features (Call Spotlight, Ask Anything, AI Composer, AI Briefer) rely on third-party LLMs whose identity is not publicly disclosed. This creates model-quality regression risk, pricing dependency, and potential confidentiality exposure if the vendor relationship changes. While Gong's ISO 42001 certification and privacy policy state that customer data is not used for model training, the fundamental architecture depends on external model infrastructure that Gong does not control. Diligence buyers should contractually confirm the LLM vendor list and data handling terms in the DPA."
    claimRefs:
      - CE049
      - CE022
  - calloutType: risk
    title: "PCI DSS Scope Limited to Telephony Only"
    body: "Gong's PCI DSS SAQ-D compliance covers only the telephony call ingestion pipeline—the initial ingestion, processing, and redaction of cardholder data from phone calls. Web conference recordings (Zoom, Teams, Google Meet) and email data are explicitly outside PCI scope. Customers in payment-processing industries who record web calls must implement their own controls to avoid PCI violations, and must define Gong's digit-redaction rules correctly or risk scope creep."
    claimRefs:
      - CE025
      - CE048

