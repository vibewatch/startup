chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Gong's Revenue AI Operating System (OS) delivers conversation intelligence, sales engagement, forecasting, and coaching through four tiered application layers—Foundation, Engage, Forecast, and Enable—all powered by the Gong Revenue Graph, a living interaction-data layer mapped to CRM records. The platform runs exclusively on AWS (US and EU), uses MongoDB Atlas sharded across five clusters for sub-30ms deal-association queries, and holds SOC 2 Type II, ISO 27001:2022, ISO 42001:2023, and eight other certifications. Gong's 15 named AI agents, evaluated via an Elo rating system, achieved 200%+ YoY Assistant usage growth and 75% YoY AI-agent monthly-user growth by mid-2026, while GitHub hosts 20+ community repositories for its public API v2—confirming a functional but early developer ecosystem.

sections:
  - id: platform-architecture-modules
    title: "Platform Architecture and Product Modules"
    body: >-
      The Gong Revenue AI Operating System comprises four commercial application layers built on a common data and model foundation. Foundation is the platform core: it ingests calls, emails, and meetings through a bot-based recorder or native conference-provider integrations (Zoom, Microsoft Teams, Google Meet), runs proprietary transcription across 70+ languages, and produces the Gong Revenue Graph—a structured mapping of every customer interaction to CRM opportunities. The Foundation layer also hosts Gong Assistant, a conversational AI available on call pages, search results, and a dedicated workspace for analysis, document creation, and scorecard generation. Engage is the sales-engagement add-on offering AI-powered email sequencing, phone dialing, LinkedIn outreach steps, and workflow automation, with AI Composer drafting context-aware emails from conversation history. Forecast aggregates 300+ behavioral and sentiment signals to generate deal likelihood scores, hierarchical rollup boards, and AI Revenue Predictor forecasts. Enable packages coaching scorecards, AI Call Reviewer evaluations, and AI Trainer role-play simulations. Agent Studio, a self-service hub introduced in 2026, allows business administrators to configure and deploy fifteen named AI agents across all application layers. A sixth infrastructure component—Data Cloud—handles Snowflake-based data sharing, and a Calendar layer manages consent and scheduling. The Gong status page (June 2026) confirms six live operational components: Foundation, Engage, Forecast, Enable, Data Cloud, and Calendar, backed by a stated uptime rate above 99.5%.
