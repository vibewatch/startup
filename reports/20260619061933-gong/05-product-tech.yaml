  - id: trust-security-compliance
    title: "Trust, Security, and Compliance"
    body: >-
      Gong holds one of the most comprehensive compliance portfolios in the revenue-AI category. Third-party–validated certifications include SOC 2 Type II (security, availability, confidentiality, privacy; with HIPAA mapping), ISO 27001:2022 (information security management), ISO 27017 (cloud services controls), ISO 27018 (PII in public clouds), ISO 27701 (privacy information management), ISO 42001:2023 (AI management system—the only major revenue-AI vendor with this certification as of mid-2026), PCI DSS SAQ-D (telephony call ingestion scope only), and CSA STAR registry. The company is certified under the EU-US Data Privacy Framework (including UK Extension and Swiss-US DPF) and complies with GDPR, CCPA, and HIPAA. At the data layer, all traffic is encrypted in transit via TLS 1.2 and at rest via AES-256; key management uses AWS KMS with optional customer-managed bring-your-own-key (BYOK) encryption. Multi-tenant data is logically separated via MongoDB Atlas customer sharding. Access control follows a four-tier RBAC model (Collaborator, Standard, Business Admin, Technical Admin) with granular permission profiles; SCIM provisioning and SAML 2.0, OAuth 2.0, and OIDC SSO integrate with Google, Microsoft, Salesforce, Okta, and OneLogin. Consent is configurable per region or use case with hosted consent pages, audio prompts, and pre-call emails. Gong runs a public Vulnerability Disclosure Program (vdp.gong.io) and commissions annual independent penetration testing. Daily backups and multi-region AWS redundancy underpin the 99.5% uptime SLA. A critical PCI DSS scoping note: the compliance covers telephony call ingestion only—web-recorded calls and email data fall outside PCI scope—which enterprise buyers in regulated industries must evaluate carefully.
