  - id: customer-workflows-use-cases
    title: "Customer Workflows and Use Cases"
    body: >-
      Gong serves four primary revenue-team personas across the deal lifecycle. Business development reps use Gong Engage to prospect via sequenced email, phone, and LinkedIn outreach; AI Composer drafts personalized emails from prior call transcripts and CRM context; AI Tasker surfaces prioritized next actions. On average, Gong Engage users report a 34% higher email response rate and SpotOn created 30% more top-of-funnel opportunities after adoption. Account executives record discovery, demo, and negotiation calls automatically, review AI Briefs and Spotlight summaries post-meeting, and update CRM fields from deal-board panels without switching tools. Sales managers use AI Deal Monitor alerts for at-risk deals, AI Deal Reviewer scorecards to enforce playbook adherence, and configurable forecast boards with automated team-level rollup submissions; one Forecast customer (Upwork) reported 95% forecast accuracy. Revenue operations teams configure trackers, scorecards, and playbooks to standardize methodology and analyze themes across the full conversation corpus using AI Theme Spotter. Customer success managers use Account Boards to track renewal health and expansion signals. Enterprise outcomes cited for mid-2026: Anthropic reported a 64% seller-productivity increase (10 hours per week returned); Canva reported 60% rep-capacity lift; Paycor reported 141% deal-win increase; Uber for Business lifted response rates 32% using Gong AI agents. Independent PeerSpot reviewers (mid-2026) praised AI transcript quality and coaching value but flagged limitations in external call sharing and the quality of AI-generated follow-up emails—two genuine gaps in the engagement module that prospective buyers should validate during proof of concept.
