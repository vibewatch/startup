  - id: integration-developer-surface
    title: "Integration Ecosystem and Developer Surface"
    body: >-
      Gong's Collective marketplace lists 411 integrations as of June 2026, spanning CRM, conferencing, sales intelligence, marketing automation, workflow, and data platforms. The Salesforce integration is the dominant deployment pattern at enterprise accounts: it syncs CRM opportunities bidirectionally to deal boards and writes AI insights back to Salesforce records. Microsoft Teams native recording captures calls without a bot; the Gong for Outlook add-in, published to the Microsoft AppSource marketplace, manages scheduling and consent. Gong Meeting Manager is listed in the Google Workspace Marketplace. Zoom, Slack, LinkedIn Sales Navigator, HubSpot, ZoomInfo, and Snowflake are among the high-volume integrations. Gong exposes a public REST API v2 supporting OAuth 2.0 and Basic Auth; the application version (v17.main.33029) confirms active continuous delivery. The Audit API exports activity logs in JSON for SIEM integration. GitHub's "gong" topic page (June 2026) lists 20+ community repositories including an unofficial Python SDK, a Ruby client (GongAPI), Rust and JavaScript MCP servers, and multi-platform sales workflow plugins—signaling a growing but community-driven (not vendor-maintained) developer ecosystem. Gong also supports the Model Context Protocol (MCP) natively, enabling external AI systems and orchestrators to connect to the Revenue AI OS; this was highlighted in the June 2026 platform trust page as configurable. US Patents 9,699,409 and 9,992,448 cover Gong's web conference recording mechanism, providing some IP protection for the capture layer.
