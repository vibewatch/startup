    - type: "missing-source"
      severity: "minor"
      topic: "competition"
      missingEvidence: "Independent analyst comparison of Gong's pricing, feature set, win rates, and revenue multiples versus Clari, Outreach, ZoomInfo Chorus, and Salesloft."
      whyItMatters: "Understanding competitive positioning requires third-party win/loss data and product benchmarks; Gong's own claims of leadership cannot be fully verified without adversarial evidence."
      diligencePath: "Obtain G2 win-loss data, Gartner Peer Insights competitive reports, and customer interview evidence comparing Gong to direct alternatives."
      relatedQuestionRefs:
        - QO024

    - type: "missing-source"
      severity: "minor"
      topic: "competition"
      missingEvidence: "Depth of competitive overlap and revenue impact from Microsoft Copilot for Sales and Salesforce Einstein AI bundling in enterprise accounts."
      whyItMatters: "Large platform vendors can bundle AI capabilities with existing enterprise agreements at zero marginal cost, which is a material threat to Gong's standalone SaaS ARR."
      diligencePath: "Track Microsoft and Salesforce AI product roadmap announcements; conduct customer interviews on whether bundled alternatives are being evaluated."
      relatedQuestionRefs:
