  evidenceGaps:
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "governance"
      missingEvidence: "Board composition, investor director seats, pro-rata rights, and governance rights for each funding round participant."
      whyItMatters: "Investors cannot assess control, decision-making authority, or dilution risk without visibility into board structure and governance rights."
      diligencePath: "Request governance term sheet, capitalization table, and board observer agreements directly from Gong as part of formal due diligence."
