      - TO003

  - id: "scale-traction-market-position"
    title: "Scale, Traction, and Market Position"
    body: >-
      Gong's revenue trajectory is among the fastest in B2B SaaS: the company grew from
      approximately $100M in annualized revenue at its Series E in mid-2021 to $300M ARR for
      fiscal year 2025 (announced March 5, 2025) and $500M ARR in May 2026—roughly a 5x increase
      in five years. The tenth consecutive quarter of accelerating growth as of Q1 2026 at 55%+
      year-over-year puts the company on a trajectory toward $1B ARR within two years if
      sustained, a milestone CEO Bendov has acknowledged as achievable. Enterprise adoption is a
      clear tailwind: half of the Fortune 10 are customers, $1M+ annual contracts are accelerating
      (more added in two quarters than the prior six combined), and 50% of customers use multiple
      Gong products. As of June 2026 the platform hosts 5,000+ enterprise customers including ADP,
      Anthropic, Canva, Cisco, DocuSign, Google, Paycor, Thomson Reuters, and Uber for Business.
      Gong's December 2025 recognition as a Leader in the inaugural Gartner Magic Quadrant for
      Revenue Action Orchestration—ranked first across all four critical capabilities use cases
      among 12 evaluated vendors—reinforces category leadership above Outreach, ZoomInfo (Chorus),
      Clari, and Salesloft. Platform AI adoption measured by Gong Assistant usage grew over 200%
      year-over-year. Customer reviews on Gong's platform total over 6,278, signaling strong NPS
      and broad advocacy at the seat level.
    claimRefs:
      - CO022
