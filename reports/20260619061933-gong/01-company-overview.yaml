  - id: "milestones-and-adverse-events"
    title: "Milestones, Adverse Events, and Risk Factors"
    body: >-
      Gong's milestone arc spans a 2015 founding through five rounds of institutional capital,
      multiple platform expansions, and a $500M ARR inflection. Adverse events include the 38%
      implied valuation reset evidenced by late-2025 secondary transactions (~$4.5B vs. $7.25B
      peak) and a dismissed patent infringement lawsuit—Gong.io v. Hyperdoc (Recall.ai)—in the
      Northern District of California in October 2025. Compliance and privacy risks are structural
      to the business model: Gong records, transcribes, and processes business communications,
      creating GDPR and multi-jurisdictional data protection obligations for customers. The company
      holds EU-US Data Privacy Framework certification and Standard Contractual Clause coverage
      for EEA transfers, but the compliance burden—including limited data residency options and
      cross-border transfer complexity—remains a friction point in enterprise sales cycles in
      Europe and in highly regulated sectors. At least ten US states and the District of Columbia
      require all-party consent for call recording, meaning customers using Gong must configure
      consent mechanisms carefully or face legal exposure. Gong typically requires 2–3 year
      subscription contracts, creating high switching costs that benefit retention but also amplify
      downside if a superior competing technology emerges. Microsoft's integration of AI into
      Microsoft 365 Copilot and Salesforce's bundling of Einstein AI with Sales Cloud represent
      the highest-risk consolidation scenarios. Gong has not disclosed profitability, and the IPO
      timeline remains undefined despite Bendov stating preparedness for a public offering.
      In 2025 Gong partnered with Microsoft to integrate its platform into Microsoft 365 Copilot,
      Teams, and Outlook, which may serve as both a growth channel and a strategic hedge against
      Microsoft's competing AI capabilities.
