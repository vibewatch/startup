  - id: "funding-and-valuation"
    title: "Funding History, Capital Structure, and Valuation"
    body: >-
      Gong has raised approximately $584 million across five primary institutional funding rounds
      from 2016 through 2021. The Series A ($6M, September 2016) was led by Norwest Venture
      Partners and Wing Venture Capital. The Series B (approximately $20M, February 2018) was led
      by Battery Ventures. The Series C ($65M, December 2019) was led by Sequoia Capital. The
      Series D ($200M, August 2020) was led by Coatue at a $2.2 billion valuation, with
      participation from Index Ventures, Salesforce Ventures, Thrive Capital, Battery Ventures,
      NextWorld Capital, Norwest, Sequoia, and Wing VC; the round followed 2.5x revenue growth
      year-to-date in 2020 driven by the remote selling surge. The Series E ($250M, June 2021)
      was led by Franklin Templeton at a $7.25 billion valuation—briefly making Gong the
      highest-valued startup in Israel—with Coatue, Salesforce Ventures, Sequoia, Thrive Capital,
      and Tiger Global also participating. CEO Amit Bendov stated as of early 2025 that the
      company had not raised additional primary capital and retained most of the 2021 proceeds.
      However, secondary share transactions conducted via Nasdaq's private market platform in
      November 2025 implied a valuation of approximately $4.5 billion—a 38% decline from the 2021
      peak—though Gong did not approve those transactions and the status of employee option
      repricing remains publicly unknown, creating potential retention risk for staff granted
      options at peak valuations.
    claimRefs:
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
