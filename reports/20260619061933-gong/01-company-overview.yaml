company:
  name: "Gong"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Gong is a late-stage private AI-powered revenue intelligence platform founded in 2015,
    headquartered in San Francisco with a major R&D presence in Ramat Gan, Israel. Having raised
    $584M across five institutional rounds at a peak valuation of $7.25B in 2021—though secondary
    shares traded at approximately $4.5B in late 2025—the company surpassed $500M in ARR in
    May 2026 at 55%+ year-over-year growth, serving more than 5,000 enterprise customers including
    half of the Fortune 10 and earning the top ranking in the inaugural 2025 Gartner Magic Quadrant
    for Revenue Action Orchestration.

sections:
  - id: "identity-and-product"
    title: "Company Identity and Product Overview"
    body: >-
      Gong is a private B2B software company incorporated in Delaware and headquartered in San
      Francisco, California, with a major research and development center in Ramat Gan, Israel, and
      additional offices in New York, Austin, Dublin, Singapore, Salt Lake City, and Chicago.
      Founded in 2015 by CEO Amit Bendov and CPO Eilon Reshef, Gong launched its commercial product
      in 2016, initially as an AI-driven conversation intelligence tool that automatically recorded,
      transcribed, and analyzed B2B sales calls. Over the subsequent decade the platform evolved
      substantially into what the company now calls the Revenue AI Operating System—a unified stack
      that captures customer interactions across calls, emails, and web meetings; synthesizes those
      signals into the proprietary Gong Revenue Graph; applies specialized AI models trained on more
      than 25 million sales interactions; and surfaces decisions, automations, and workflows for
      sales, revenue operations, sales enablement, and customer success teams. The business model
      is a recurring SaaS subscription using per-user licensing combined with a platform fee and
      custom pricing for enterprise accounts. Expansion beyond call recording into forecasting
      (Gong Forecast), sales engagement (Gong Engage), coaching (Gong Enable), and AI-agent
      automation (Gong Assistant) is the primary driver of multi-product adoption, which reached
      50% of the customer base by May 2026. Sellers on legacy CRM systems spend approximately 77%
      of their time on non-selling activities—the structural inefficiency Gong targets.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO006
      - CO041
    figureRefs:
      - FO002

  - id: "founders-leadership-governance"
    title: "Founders, Leadership, and Governance"
    body: >-
      Gong was co-founded by Amit Bendov (CEO) and Eilon Reshef (CPO), both Israeli entrepreneurs
      with deep enterprise software backgrounds. Bendov previously served as CEO of SiSense, a
      business intelligence company, where a sudden and unexplained pipeline collapse inspired him
      to build an AI-driven platform for sales decision support. Reshef, an experienced engineering
      leader, serves as Chief Product Officer and has been the primary architect of Gong's AI and
      data platform. The current C-suite includes Shane Evans as Chief Revenue Officer, Tim
      Riitters as CFO, Sunaina Lobo as Chief People Officer, Emily He as CMO, Ohad Parush as
      Chief R&D Officer, and Simon Frey, who was appointed Chief Customer Officer in early 2026
      when the customer base surpassed 5,000 organizations. Gong remains private with no public
      board composition disclosure. As a co-founder-led company, key-person risk is concentrated
      in Amit Bendov, who serves as the primary public voice, sets strategic direction, and is
      cited in all material product and funding announcements. No significant C-suite departures
      have been publicly reported as adverse events. Investor board seats and governance structure
      are not publicly disclosed, representing a material gap for prospective investors conducting
      governance due diligence.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
