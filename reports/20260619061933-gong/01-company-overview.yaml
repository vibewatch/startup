    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-structure"
      missingEvidence: "Investor ownership percentages, equity stake per round, pro-rata rights, lock-up terms, and secondary market participation by investor."
      whyItMatters: "Without cap table details, investors cannot assess dilution exposure, secondary market overhang, or alignment between early and late investors on IPO timing."
      diligencePath: "Request capitalization table, secondary market transaction history, and lock-up schedule from Gong's CFO or legal counsel."
      relatedQuestionRefs:
        - QO008
      relatedTableRefs:
        - TO003

    - type: "missing-source"
      severity: "material"
      topic: "funding"
      missingEvidence: "Primary press release or filing confirming the exact amount and date of Gong's Series A ($6M) and Series B (~$20M) funding rounds."
      whyItMatters: "The Series A and B amounts used in the milestone table are based on aggregator estimates; incorrect amounts could affect total-raised calculations and investor mapping."
      diligencePath: "Search Gong's archived press release index, Crunchbase, and investor announcement pages for Norwest VP (Series A) and Battery Ventures (Series B)."
      relatedTableRefs:
        - TO004

    - type: "private-evidence-only"
      severity: "material"
      topic: "financials"
      missingEvidence: "Audited financial statements, gross margin, operating income or loss, burn rate, and runway given retained 2021 capital."
      whyItMatters: "Gong has not publicly disclosed profitability or detailed financials; without this, judgment on unit economics, capital efficiency, and IPO readiness is constrained."
      diligencePath: "Request audited P&L, gross margin by product, and cash position from Gong's CFO under NDA during formal due diligence."
      relatedQuestionRefs:
