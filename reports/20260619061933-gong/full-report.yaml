  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture and Product Modules
        blocks:
          - type: paragraph
            body: >-
              The Gong Revenue AI Operating System comprises four commercial application layers built on a common data
              and model foundation. Foundation is the platform core: it ingests calls, emails, and meetings through a
              bot-based recorder or native conference-provider integrations (Zoom, Microsoft Teams, Google Meet), runs
              proprietary transcription across 70+ languages, and produces the Gong Revenue Graph—a structured mapping
              of every customer interaction to CRM opportunities. The Foundation layer also hosts Gong Assistant, a
              conversational AI available on call pages, search results, and a dedicated workspace for analysis,
              document creation, and scorecard generation. Engage is the sales-engagement add-on offering AI-powered
              email sequencing, phone dialing, LinkedIn outreach steps, and workflow automation, with AI Composer
              drafting context-aware emails from conversation history. Forecast aggregates 300+ behavioral and sentiment
              signals to generate deal likelihood scores, hierarchical rollup boards, and AI Revenue Predictor
              forecasts. Enable packages coaching scorecards, AI Call Reviewer evaluations, and AI Trainer role-play
              simulations. Agent Studio, a self-service hub introduced in 2026, allows business administrators to
              configure and deploy fifteen named AI agents across all application layers. A sixth infrastructure
              component—Data Cloud—handles Snowflake-based data sharing, and a Calendar layer manages consent and
              scheduling. The Gong status page (June 2026) confirms six live operational components: Foundation, Engage,
              Forecast, Enable, Data Cloud, and Calendar, backed by a stated uptime rate above 99.5%.
