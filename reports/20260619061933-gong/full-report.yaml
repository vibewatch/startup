      - number: '4.2'
        title: ARR Trajectory, Growth Quality, and Revenue Signals
        blocks:
          - type: paragraph
            body: >-
              Gong's ARR trajectory is among the strongest in enterprise software: from approximately $100M at the June
              2021 Series E, the company reached $300M ARR in March 2025 — a 3x increase in roughly 45 months — and then
              accelerated to $500M ARR by May 2026, adding the second $200M in less than 15 months. The implied
              year-over-year growth rate reported for Q1 2026 exceeds 55%, which Gong's CEO has described as the tenth
              consecutive quarter of accelerating growth rate. This sustained acceleration at scale is unusual and
              suggests compounding factors beyond mere new customer acquisition: multi-product expansion, seat expansion
              within existing accounts, and up-market displacement of point solutions are all structurally driving ARR.

              The revenue quality signals are constructive. Gong's multi-product adoption rate rose from roughly one in
              four customers at $300M ARR (March 2025) to 50% by May 2026, indicating meaningful net expansion within
              the installed base. The pace of $1M+ annual contract wins doubled: Gong added more seven-figure customers
              in the two quarters ending May 2026 than in the prior six quarters combined. Half of the Fortune 10 are
              now customers. Customer count grew from approximately 4,500 in November 2025 to more than 5,000 in March
              2026, an addition of 500+ enterprises in roughly one quarter. However, all ARR, growth, and customer
              metrics are company-reported and unaudited; no third-party audit, GAAP filing, or independent verification
              has been published. The three-year ARR CAGR from $100M to $500M implies a compound growth rate of
              approximately 50%, which at $500M ARR places Gong firmly in the upper tier of enterprise SaaS growth.
