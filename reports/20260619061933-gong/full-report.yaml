        - label: Revenue Proof
          value: 5
          unit: /5
          note: $500M ARR confirmed, 10 consecutive quarters of acceleration, Fortune 10 penetration
        - label: Competitive Moat
          value: 4
          unit: /5
          note: Revenue Graph data flywheel (25M+ interactions), 50% multi-product lock-in; risk from native CRM bundling
        - label: Unit Economics
          value: 2
          unit: /5
          note: Near-profitable per CEO; no disclosed NRR, gross margin, or burn; proxy metrics suggest efficiency
        - label: Risk Profile
          value: 3
          unit: /5
          note: Regulatory, AI quality, and competitive risks material but manageable; preference overhang unknown
        - label: Valuation Entry
          value: 2
          unit: /5
          note: Primary $7.25B = 14.5x ARR (stretched); secondary ~$4.5B = 9x ARR (fair); entry discipline critical
        - label: Evidence Quality
          value: 2
          unit: /5
          note: 'Six material gaps unresolved: NRR, gross margin, cap table, burn, win/loss, option repricing'
    approximationNotes: >-
      Scores are analyst judgment on a 1–5 scale, not a formula output. A score of 3 reflects neutral; 4–5 is positive
      conviction; 1–2 is concern or gap. Overall IC readiness is constrained by the 2/5 on unit economics, valuation
      entry, and evidence quality.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV022
      - CV034
