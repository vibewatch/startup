      - number: '6.5'
        title: Expansion Motion, Land-and-Expand, and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Gong's land-and-expand model is structurally visible in the data. The typical entry motion is a
              conversation intelligence deployment for the core sales team, often starting with a subset of seats, and
              expanding to full revenue organization coverage. Gong's platform economics reward breadth: adding Gong
              Engage (sales engagement) or Gong Forecast (predictive pipeline) drives ACV expansion without requiring
              new enterprise approval cycles at the customer. The doubling of multi-product adoption from 25% to 50% in
              14 months confirms this motion is executing at scale. Partner ecosystem embeddedness through Zapier,
              Workato, Make.com, Salesforce, and HubSpot integrations increases workflow lock-in, making replacement
              more disruptive operationally. Concentration risk operates on two axes. First, vertical concentration: the
              technology sector is disproportionately represented among public reference customers. A B2B tech hiring
              slowdown or budget compression (as seen in 2023–2024) would stress Gong's customer base more than a
              diversified software portfolio. Second, top-account concentration: the acceleration of $1M+ deals in the
