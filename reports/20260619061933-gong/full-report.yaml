      - number: '3.4'
        title: Substitutes, Adjacents, and Status Quo Competition
        blocks:
          - type: paragraph
            body: >
              Below the tier-one and tier-two competitors, a fragmented landscape of adjacents, substitutes, and status
              quo alternatives competes for budget and mindshare at different price points and use-case profiles.
              CloudTalk's 2026 competitive review identified 11 distinct Gong alternatives covering different use
              cases—including CloudTalk itself, Chorus, Salesloft, Avoma, Wingman (Clari), Fireflies.ai, Dialpad,
              Salesken, Backstory, and Outreach—illustrating the depth of fragmentation that buyers can surface when
              evaluating alternatives.


              Avoma targets SMB and growth-stage companies with an all-in-one meeting intelligence and scheduling
              platform starting at approximately $19/user/month. It covers AI note-taking, meeting summaries, agenda
              management, conversation intelligence, and lead routing—a broader meeting workflow scope than Gong at a
              fraction of the price. Fireflies.ai claims adoption across more than 1 million companies globally with
              $10-19/month paid plans and a free tier, making it the dominant low-cost transcription alternative. Both
              Avoma and Fireflies.ai commoditize basic conversation capture and summarization, removing the entry-level
              justification for Gong among budget-constrained buyers.


              Aviso positions as a heavier end-to-end revenue orchestration platform with 450+ revenue teams, 30+
              out-of-the-box agentic workflows, and 50+ critical revenue use cases including conversation intelligence,
              relationship intelligence, and forecasting. Backstory.ai targets the CRM data integrity segment—serving
              CROs who distrust Salesforce data quality—competing directly with Gong's pipeline intelligence features.
              Revenue.io competes as a Salesforce-native CI platform with real-time coaching (Moments), AI scorecards,
              and deep Salesforce integration, specifically serving accounts where Salesforce is the system of record.
              Outreach's consumption-based pricing model (AI credits alongside seat fees via Amplify Core) enables lower
              entry costs than Gong's per-seat-plus-platform-fee structure, further fragmenting the addressable lower
              end of the market.


              Status quo alternatives represent meaningful zero-cost competition: native Salesforce Reports and
              Dashboards, HubSpot deal pipelines, and spreadsheet-based pipeline reviews serve as sufficient
              alternatives for cost-sensitive or lower AI-maturity buyers. Third-party review sites in 2026 consistently
              identify Gong's pricing as its primary competitive disadvantage, driving trial of lower-cost alternatives
              particularly in the growth-stage and budget-sensitive mid-market. HubSpot's own blog on conversation
              intelligence tools lists Avoma and other affordable alternatives without positioning Gong as accessible
              for its SMB reader base.
