            body: >-
              Gong serves four primary revenue-team personas across the deal lifecycle. Business development reps use
              Gong Engage to prospect via sequenced email, phone, and LinkedIn outreach; AI Composer drafts personalized
              emails from prior call transcripts and CRM context; AI Tasker surfaces prioritized next actions. On
