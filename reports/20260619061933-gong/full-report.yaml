      - number: '7.3'
        title: Technology, Cloud, and Integration Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Gong's infrastructure runs almost entirely on Amazon Web Services, as disclosed in its sub-processor list.
              AWS provides cloud hosting, language transcription (Amazon Transcribe), and application AI functionality;
              MongoDB is used for data storage and querying. This creates a single-cloud concentration risk: a prolonged
              AWS outage or a deterioration in commercial terms could directly impair Gong's service-level agreements
              and damage enterprise trust. Gong's SCA (Multi-Year Strategic Collaboration Agreement) with AWS deepens
              this dependency by tying product roadmap and go-to-market commitments to the AWS ecosystem—beneficial when
              AWS is the tailwind, problematic if Gong needs to diversify providers.


              Gong's revenue depends heavily on its integrations with CRM platforms—primarily Salesforce and Microsoft
              Dynamics—and collaboration tools like Zoom, Microsoft Teams, and Google Meet. These integrations are
              delivered as marketplace listings subject to AppExchange and Microsoft 365 marketplace policies.
              Salesforce or Microsoft can modify API terms, add competing functionality (Salesforce Einstein Copilot;
              Microsoft Copilot for Sales), or restrict third-party recording access at any time. In 2024, Microsoft
              began embedding native AI call recording and coaching into Teams Premium and Microsoft 365 Copilot,
              putting Gong's core call-intelligence features in direct competition with the collaboration platform Gong
              previously treated as a distribution channel. Gong's partnership with Salesforce includes
              revenue-intelligence integration at the CRM layer, but Salesforce is simultaneously building its own
              Agentforce autonomous sales platform that replicates Gong's forecasting and coaching outputs natively.


              The Salesforce and Microsoft dependency/competition duality represents the single most structurally
              threatening technical risk: if either platform withdraws API access, caps recording permissions, or
              bundles competing functionality in enterprise contracts, Gong's value proposition degrades materially
              without an independent distribution channel.
