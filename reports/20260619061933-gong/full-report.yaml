      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Revenue intelligence platforms have a complex, multi-role buying process that distinguishes them from
              simpler sales productivity tools. The economic buyer is typically the Chief Revenue Officer (CRO) or VP
              Sales, who owns the revenue accountability mandate and controls discretionary sales technology budgets.
              The technical buyer is the Revenue Operations (RevOps) leader or Director of Revenue Operations, who
              drives CRM integration architecture, data strategy, and cross-functional alignment across sales,
              marketing, and customer success teams. Sales Enablement managers serve as internal champions, focused on
              rep coaching and new hire onboarding use cases. IT and Security teams are approval gatekeepers—especially
              in enterprise and regulated-industry accounts—without typically holding budget authority.


              Forrester's RevOps framework identifies "deliver value through revenue technology" as one of six core
              RevOps priorities, further cementing RevOps as the key technical buyer and advocate across the enterprise
              sales technology stack. B2B enterprise buying committees for revenue intelligence average five or more
              decision-makers, extending typical sales cycles to 60–180 days in large accounts and requiring alignment
              across CRO, RevOps, IT/Security, Legal/Privacy, and Finance before a purchase decision.


              Adoption patterns differ meaningfully by segment. Enterprise accounts (1,000+ employees) lead Gong's
              growth: the company added more $1M+ annual contracts in the two quarters ending May 2026 than in the prior
              six quarters combined. Mid-market buyers (100–999 seats) prioritize speed-to-ROI and often enter through
              conversation intelligence as a wedge product, with Gong citing 30–60%+ sales productivity improvements in
              year-one case studies. The SMB segment (<100 seats) is underserved by enterprise-grade platforms given
              implementation complexity and multi-year contract requirements. Salesforce's 2026 State of Sales found
              nine in ten sales teams use or expect AI agents within two years, validating the broad pool of addressable
              buyers. Customer success teams are an emerging expansion segment as use cases grow into post-sale churn
              prevention and upsell identification.
