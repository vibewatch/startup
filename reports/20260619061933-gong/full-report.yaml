      - number: '2.2'
        title: Market Sizing — Multiple Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >
              No single authoritative public TAM for the revenue intelligence or Revenue Action Orchestration market
              existed as of June 2026. Published estimates diverge dramatically—spanning a five-fold range from
              approximately $2B to $10B for the serviceable addressable market by 2026–2030—depending entirely on how
              analysts define the market boundary. This definitional ambiguity reflects genuine disagreement among
              analysts, vendors, and investors about whether RAO is a submarket of CRM, a distinct category adjacent to
              CRM, or the emerging core of a broader go-to-market technology stack.


              The Fortune Business Insights CRM market report (2025) pegged the global CRM market at $112.91B in 2025,
              growing to $320.99B by 2034 at a 12.4% CAGR. While CRM is a proxy for adjacent spend rather than a direct
              revenue intelligence measure, this figure contextualizes the addressable headroom for revenue intelligence
              platforms that sit above the CRM data layer. MarketsandMarkets estimated the sales intelligence market at
              $2.0B in 2019 growing to $3.4B by 2024 at an 11.4% CAGR; extrapolated to 2026, this implies approximately
              $4.2B for sales intelligence—a narrower definition excluding most revenue intelligence features and not
              updated with the RAO category boundary.


              A bottom-up derivation using Gong's $500M ARR (May 2026) and an assumed 8–15% serviceable market share
              implies a SAM of approximately $3.3B–$6.3B for enterprise-focused revenue intelligence platforms. This
              estimate is circular by construction—market share is unvalidated and derived from ARR alone—but it is the
              most 2026-current figure available given the absence of a public Gartner RAO market size figure. Gartner's
              RAO MQ evaluated 12 vendors but did not disclose the market's total revenue. The macro AI tailwind also
              compounds the uncertainty: MarketsandMarkets estimated the global AI market at $601.93B in 2026 growing at
              a 29.3% CAGR, providing a favorable investment environment for specialized vertical AI applications like
              revenue intelligence—but macro AI growth does not translate directly into RAO category growth. Gong's
              valuation has normalized from 72x ARR in 2021 to an implied ~11x ARR in late 2025 secondary market
              references.
