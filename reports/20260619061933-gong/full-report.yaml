    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Gong's revenue model is a B2B SaaS subscription anchored on two interlocking components: a per-user seat
              license and a platform fee sized to the number of supported users. Both components are entirely
              quote-based — the official pricing page instructs prospective buyers to complete a request form for a
              custom proposal and offers no published tiers, floor prices, or named plans. This deliberately opaque
              structure is consistent with enterprise SaaS practice at Gong's scale: it allows differentiated pricing by
              vertical, deal size, multi-year commitment, and bundled product set, and it prevents competitors or buyers
              from anchoring discount negotiations to published list prices.

              Gong's platform spans six commercially distinct modules: Conversation Intelligence (the original core
              product), Gong Engage (sales sequencing and outreach), Gong Forecast (pipeline and revenue forecasting),
              Gong Enable (coaching and enablement), Gong Assistant (agentic AI automation), and a growing Professional
              Services / Revenue Architects offering. All product add-ons beyond the core CI license are priced
              incrementally through the custom-quote process. The 411 integrations published on the Gong Collective
              marketplace are offered at no additional cost, functioning as a platform-stickiness and switching-cost
              mechanism rather than a direct revenue line. Professional services revenue emerged as a structural growth
              investment in early 2026 when Gong scaled its services and consulting ecosystem fivefold, introducing
              Revenue Architects and global systems integrator partnerships — a motion that generates incremental
              revenue while increasing deployment depth and multi-year retention.
