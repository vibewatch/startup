      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Gong was co-founded by Amit Bendov (CEO) and Eilon Reshef (CPO), both Israeli entrepreneurs with deep
              enterprise software backgrounds. Bendov previously served as CEO of SiSense, a business intelligence
              company, where a sudden and unexplained pipeline collapse inspired him to build an AI-driven platform for
              sales decision support. Reshef, an experienced engineering leader, serves as Chief Product Officer and has
              been the primary architect of Gong's AI and data platform. The current C-suite includes Shane Evans as
              Chief Revenue Officer, Tim Riitters as CFO, Sunaina Lobo as Chief People Officer, Emily He as CMO, Ohad
              Parush as Chief R&D Officer, and Simon Frey, who was appointed Chief Customer Officer in early 2026 when
              the customer base surpassed 5,000 organizations. Gong remains private with no public board composition
              disclosure. As a co-founder-led company, key-person risk is concentrated in Amit Bendov, who serves as the
              primary public voice, sets strategic direction, and is cited in all material product and funding
              announcements. No significant C-suite departures have been publicly reported as adverse events. Investor
              board seats and governance structure are not publicly disclosed, representing a material gap for
              prospective investors conducting governance due diligence.
