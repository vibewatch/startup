      - number: '2.4'
        title: Growth Drivers and AI Tailwinds
        blocks:
          - type: paragraph
            body: >
              Three structural forces are accelerating demand for revenue intelligence platforms in 2025–2026. First,
              board-level mandates for AI-driven sales productivity have created budget urgency: Gong's May 2026 press
              release identified "AI mandate from the top" as a primary demand driver. Sales teams under pressure from
              quota misses and rising customer acquisition costs are turning to AI platforms to systematically identify
              what top performers do differently and replicate it at scale. Gong's internal data indicated sellers spend
              77% of their time on non-selling activities—a productivity gap that creates compelling ROI justification
              for automation platforms.


              Second, tech-stack consolidation is a powerful structural tailwind. Enterprises are replacing 3–7
              fragmented point solutions—separate tools for call recording, pipeline forecasting, sales coaching, and
              outreach sequencing—with unified platforms. Gong reported that 50% of its customers now use multiple Gong
              products (May 2026), validating the multi-product land-and-expand motion. This consolidation dynamic
              drives higher average contract values and longer customer lifetimes, creating an economic flywheel that
              reinforces Gong's enterprise strategy.


              Third, AI feature adoption within the installed base is accelerating. Gong's flagship AI product, Gong
              Assistant, grew over 200% year-over-year in usage by May 2026. Salesforce's State of Sales report
              (2025/2026) found that nine in ten sales teams either use AI agents or expect to within two
              years—indicating near-universal intent to AI-enable sales workflows. Remote and hybrid selling established
              the baseline need for conversation capture beginning in 2020; AI analysis has now added the higher-order
              value layer on top of that captured data, creating a two-layer value proposition that drives continued
              investment.
