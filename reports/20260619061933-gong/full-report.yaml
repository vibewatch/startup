  - id: FR001
    title: Risk Heatmap — Gong Likelihood vs. Impact Matrix
    type: matrix
    layout: standard
    summary: >
      Four-by-four risk matrix positioning Gong's key risk categories by likelihood (vertical axis) and impact
      (horizontal axis); cells name the risks at each intersection.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
