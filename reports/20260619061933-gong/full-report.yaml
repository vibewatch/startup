  - id: FU001
    title: 'Gong Customer Journey Map: Segments, Adoption Surfaces, and Expansion Loops'
    type: journey-map
    layout: wide
    summary: >-
      Maps enterprise buyer journey stages from initial discovery through full Revenue AI OS adoption for each customer
      segment.
    data:
      items:
        - label: Discovery & Evaluation (~1 month)
          description: >-
            CRO / VP Sales identifies call intelligence need via peer referral, G2 research, or Salesforce partner
            recommendation; ~1 month implementation per G2 data; proof-of-concept with core sales team
        - label: Core Deployment (Sales Org)
          description: >-
            Conversation intelligence and coaching live for full sales org; CRM integration (Salesforce / HubSpot)
            embedded; workflow automation via Zapier / Workato active; enterprise security review completed
        - label: Platform Expansion (Multi-Product)
          description: >-
            Add Gong Engage (sales engagement) and/or Gong Forecast (predictive pipeline); 50% of customers at this
            stage by May 2026, up from 25% in March 2025; ACV expansion without new procurement cycle
        - label: Enterprise Standardization (Revenue AI OS)
          description: >-
            Revenue AI OS deployed across sales, revenue ops, enablement, customer success, and professional services;
            $1M+ ACV; AI Agents active; Fortune 10 penetration at this stage
        - label: Fortune 10 / Global Rollout
          description: >-
            Half of Fortune 10 at production-grade rollout; multi-country deployment; AI Trust framework deployed; Gong
            Visioneers community active for peer advocacy and retention
    approximationNotes: >-
