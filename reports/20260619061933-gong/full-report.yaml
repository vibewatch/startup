  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Category Definition
        blocks:
          - type: paragraph
            body: >
              Revenue intelligence is a category of AI-powered software that automatically captures B2B customer
              interactions—calls, emails, meetings, CRM touchpoints—analyzes them using machine learning, and surfaces
              actionable insights for sales, customer success, and revenue operations teams. Gong's own definition
              emphasizes four integrated layers: data capture from every customer interaction, AI analysis to identify
              patterns and risk, prescriptive recommendations for next steps, and workflow automation to convert
              insights into action. This four-layer architecture is what separates revenue intelligence platforms from
              the narrower conversation intelligence category (which covers only call recording and transcription) and
              from standalone CRM (which requires manual data entry and lacks AI synthesis).


              Gartner formalized the Revenue Action Orchestration (RAO) category in December 2025 with its inaugural
              Magic Quadrant evaluating 12 vendors. The RAO category definition explicitly merges sales engagement
              (automated outreach sequencing) with revenue intelligence (forecasting, coaching, deal analytics) into a
              single workflow orchestration layer—representing a broader and more actionable definition than the legacy
              "conversation intelligence" category. Gong, Salesloft, and Outreach all compete in this space, but they
              approach the market boundary from different starting points: Gong from conversation intelligence toward
              sequencing, while Salesloft and Outreach approached from sequencing toward intelligence.


              Adjacent spend that is NOT part of the RAO market boundary includes general-purpose CRM systems
              (Salesforce Sales Cloud, Microsoft Dynamics 365, HubSpot CRM), marketing automation platforms (Marketo,
              HubSpot Marketing Hub), and customer support AI (Zendesk AI, Intercom). These are complementary spending
              pools—revenue intelligence platforms typically integrate with CRM rather than replace it—and their market
              size figures are not additive to revenue intelligence TAM estimates. Status-quo alternatives that revenue
              intelligence displaces include manual CRM data entry, spreadsheet-based forecasting, and periodic
              manager-led call reviews without AI synthesis.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM009
              - CM010
          - type: table
            tableRef: TM001
