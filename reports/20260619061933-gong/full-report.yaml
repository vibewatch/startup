      - number: '5.2'
        title: AI Engine and Data Pipeline
        blocks:
          - type: paragraph
            body: >-
              Gong's AI pipeline begins at media capture: audio and video from conferencing platforms or telephony
              systems are ingested by a bot recorder or native recording APIs (Zoom, Teams, Google Meet) and stored on
              AWS S3. A proprietary transcription model—optimized for revenue-conversation vocabulary—converts media to
              searchable text in 70+ languages, with some features remaining English-only (example-based smart trackers,
              email labels, red-flag alerts). Revenue-specific NLP models then parse transcripts for topics, action
              items, sentiment, deal signals, and competitor mentions, building the Gong Revenue Graph. Generative
              tasks—call spotlight, Ask Anything, AI Composer—use third-party large language models (LLMs) augmented by
              Gong's proprietary context and prompt engineering. Gong evaluates AI model performance using the Elo
              rating system, running A/B comparisons between model versions for features such as account/deal/contact
              Ask Anything, Briefs, and more; in August 2025 Gong updated underlying models and prompts for all key AI
              features. In-house smart-tracker models are evaluated separately by hit rate and precision. MongoDB Atlas,
              sharded across five clusters, provides ACID-compliant transactional storage for deal-association data;
              after migrating from a Lucene-based predecessor, queries that previously took tens of seconds now run in
              20–30 milliseconds. Snowflake stores analytical aggregates and is a named sub-processor powering Gong Labs
              research based on 25 million+ de-identified interactions. Customer conversation data is explicitly
              excluded from training shared generative AI models—Gong trains only on aggregated, anonymized metadata, a
              commitment backed by the ISO 42001:2023 AI governance certification.
