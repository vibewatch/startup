            title: Salesforce–Microsoft Dual Threat Is the Primary Structural Risk
            body: >
              The combination of Salesforce Agentforce and Microsoft Copilot for Sales represents the most structurally
              threatening competitive dynamic for Gong. Both vendors are embedding Gong-equivalent recording,
              transcription, and deal intelligence natively into platforms that Gong's customers already license. Unlike
              startup competitors, Salesforce and Microsoft can offer this functionality at near-zero marginal cost to
              enterprise accounts with existing multi-year ELAs. Gong's multi-product Revenue AI OS is the primary
