      - number: '3.2'
        title: Direct Peer Profiles — Clari+Salesloft, Outreach, Chorus
        blocks:
          - type: paragraph
            body: >
              The August 2025 merger announcement between Clari and Salesloft—formally completed in late 2025 with Steve
              Cox appointed as CEO—is the most consequential competitive event in the revenue intelligence market since
              Gong's $7.25B Series E in 2021. The merged entity brings together Clari's forecasting and pipeline
              orchestration capabilities (managing $5T+ in enterprise revenue pre-merger) with Salesloft's
              market-leading sales engagement cadence platform (serving Shopify, Google, 3M, IBM, and Square). The
              combined company claims $10 trillion in revenue under management, 5,000+ global enterprise customers, and
              a dataset ingesting 10 billion revenue interactions and 1 trillion data signals—representing a declared
              data-scale advantage directly competing with Gong's Revenue Graph. The merged entity doubled its R&D
              investment post-merger and positioned itself as building the "Predictive Revenue System," explicitly
              competing with Gong's "Revenue AI Operating System" framing. This combined entity competes across the full
              RAO spectrum: Salesloft Conversations provides CI depth, Clari contributes enterprise forecasting and
              pipeline health scoring, and the merged product roadmap targets full end-to-end coverage. Salesloft's own
              marketing asserts customers win 28% more deals and advance deals 75% faster with its CI product, using
              outcome language directly competitive with Gong's ROI positioning.


              Outreach—now operating as Outreach.ai—has reframed itself as an "agentic AI platform for revenue,"
              offering a seat-plus-AI-credit consumption pricing model through packages including Amplify Core.
              Outreach's Kaia capability provides real-time in-call coaching, with company-claimed outcomes of 3x faster
              rep onboarding, 41% win rate improvement, and 30% productivity gains. Outreach competes most directly
              against Gong Engage (sales sequencing) and Gong's real-time coaching features, rather than on deep
              conversation intelligence or forecasting fronts where Gong's AI models are most differentiated. Gong and
              Outreach have historically been frequent co-deployment partners in enterprise accounts, creating a
              multi-homing pattern where complementarity moderated direct competitive pressure—a dynamic that Outreach's
              growing CI ambitions are now eroding.


              Chorus by ZoomInfo focuses on conversation intelligence embedded within ZoomInfo's B2B contact and company
              data platform. Chorus's core advantage is call analytics enriched with ZoomInfo's intent data,
              firmographics, and buying signals—a differentiation not replicated natively by Gong. However, Chorus is a
              CI-only tool with no sales engagement or forecasting capabilities, making it a narrow competitor suited to
              organizations already committed to the ZoomInfo ecosystem. The Clari+Salesloft combined entity's Revenue
              Context dataset—ingesting 10B+ interactions—is positioned as the foundation for training LLM models,
              making data scale a declared competitive differentiator targeting Gong's Revenue Graph.
