      - number: '4.5'
        title: Capital Adequacy, Burn, and Runway
        blocks:
          - type: paragraph
            body: >-
              Gong has raised a total of $584M across five institutional rounds between 2016 and 2021. The last primary
              round — the $250M Series E led by Franklin Templeton at a $7.25B valuation in June 2021 — remains the most
              recent equity event. No primary capital raise has been announced in the five years since. This fact is
              itself a strong positive signal: it implies the company reached $500M ARR on the original capital base
              without needing a bridge or down-round, and that operations have been funded from subscription revenue
              growth rather than fresh equity.

              CEO Amit Bendov told TechCrunch in March 2025 that the company is "nearly profitable" and has "almost not
              touched" the 2021 Series E capital. The same interview confirmed active hiring and continued growth
              investment, consistent with a deliberate choice to operate just below breakeven while capturing market
              share. By November 2025, the CEO reiterated in Calcalis that "we still have most of the capital we raised,
              so we don't need and don't plan to raise additional funds in the near future." Taken together, these
              statements imply remaining cash on hand in the range of $150–220M, though no audited figure exists. At a
              "nearly profitable" burn posture with approximately $500M in ARR and continuing subscription revenue
              inflow, runway is estimated to be multi-year.

              The adverse signal is a November 2025 secondary transaction — employees and investors selling shares via
              Nasdaq Private Market at a roughly $4.5B implied valuation, a 38% decline from the $7.25B 2021 peak. Gong
              did not approve the transaction and noted it does not comment on secondary activity. It is not yet known
              whether employee options have been repriced relative to the $7.25B peak; an option overhang at inflated
              strike prices can impair talent retention in the pre-IPO window.
