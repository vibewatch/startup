      - number: '4.4'
        title: Enterprise GTM Motion and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Gong's go-to-market is entirely enterprise-focused, requiring a complex, multi-stakeholder sales cycle
              typical of platform software displacing incumbent point solutions. The company does not publish average
              sales cycle length, win rates, or direct CAC data. However, several observable proxies support the
              assessment.

              The $1M+ contract acceleration — more seven-figure deals added in two quarters than in the prior six —
              indicates a significant up-market motion is succeeding at scale. The customer base grew by approximately
              500 organizations between November 2025 and March 2026, implying a quarterly net add rate of roughly
              125–175 new accounts during a period of strong ARR acceleration. If the average new customer in 2026 is
              landing at meaningfully higher ACV than the blended book average ($100K implied), the growth is being
              driven disproportionately by large enterprise expansions and up-market wins. The presence of half the
              Fortune 10 — Gong names ADP, Anthropic, Canva, Cisco, DocuSign, Google, Paycor, Uber for Business, and
              Thomson Reuters — validates enterprise GTM penetration but also reflects concentration in very large
              accounts that may have extended procurement cycles and higher renewal risk if a consolidating CRM vendor
              bundles equivalent functionality.

              Gong's Customer Office, launched in early 2026, integrates pre-sales and post-sales under CCO Simon Frey,
              with Revenue Architects providing deployment advisory. This structure is designed to shorten the
              time-to-value curve and improve renewal economics at scale, directly addressing the risk that AI-adjacent
              buyers buy pilots rather than platform commitments. The fivefold scaling of the services/consulting
              ecosystem implies meaningful S&M investment in professional services headcount, which, if expensed as
              sales cost, increases CAC without a corresponding increase in first-year ARR.
