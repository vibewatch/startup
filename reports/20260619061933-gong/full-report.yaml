chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Product Overview
        blocks:
          - type: paragraph
            body: >-
              Gong is a private B2B software company incorporated in Delaware and headquartered in San Francisco,
              California, with a major research and development center in Ramat Gan, Israel, and additional offices in
              New York, Austin, Dublin, Singapore, Salt Lake City, and Chicago. Founded in 2015 by CEO Amit Bendov and
              CPO Eilon Reshef, Gong launched its commercial product in 2016, initially as an AI-driven conversation
              intelligence tool that automatically recorded, transcribed, and analyzed B2B sales calls. Over the
              subsequent decade the platform evolved substantially into what the company now calls the Revenue AI
              Operating System—a unified stack that captures customer interactions across calls, emails, and web
              meetings; synthesizes those signals into the proprietary Gong Revenue Graph; applies specialized AI models
              trained on more than 25 million sales interactions; and surfaces decisions, automations, and workflows for
              sales, revenue operations, sales enablement, and customer success teams. The business model is a recurring
              SaaS subscription using per-user licensing combined with a platform fee and custom pricing for enterprise
              accounts. Expansion beyond call recording into forecasting (Gong Forecast), sales engagement (Gong
              Engage), coaching (Gong Enable), and AI-agent automation (Gong Assistant) is the primary driver of
              multi-product adoption, which reached 50% of the customer base by May 2026. Sellers on legacy CRM systems
              spend approximately 77% of their time on non-selling activities—the structural inefficiency Gong targets.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
              - CO041
