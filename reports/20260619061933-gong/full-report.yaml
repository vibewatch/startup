            title: EU AI Act Emotion-Recognition Prohibition Is a Product Risk
            body: >
              Gong's sentiment-analysis and buyer-intent inference features are potentially in scope of the EU AI Act's
              prohibition on emotion-recognition systems in workplace contexts (Art. 5, effective February 2025). Unlike
              a compliance certification or a DPA clause, this risk cannot be managed away contractually—it requires
              product- level feature scoping or withdrawal from the EU market for affected features. Gong has ISO
              42001:2023 AI management system certification but has not published a formal EU AI Act product scope
              assessment. Diligence should demand an external legal opinion confirming that Gong's current and roadmap
