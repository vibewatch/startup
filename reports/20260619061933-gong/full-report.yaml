    type: kpi
    layout: wide
    summary: >-
      IC-ready scoring of Gong across seven dimensions: market, proof, moat, economics, risk, valuation, and evidence
      quality. Each scored 1–5 with rationale anchored to verified evidence.
    data:
      items:
        - label: Market Opportunity
          value: 4
          unit: /5
