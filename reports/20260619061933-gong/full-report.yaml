      - number: '8.5'
        title: Entry Discipline, Dilution, and Preference Overhang
        blocks:
          - type: paragraph
            body: >
              The entry price is the single most important variable for returns in this situation. At the $7.25B primary
              valuation—the paper mark that appears on the 2021 cap table— investors are paying approximately 14.5x
              trailing ARR for a company whose secondary price has fallen 38%. Buying at primary assumes either that
              market multiples will re-inflate to 2021 levels (unlikely in the 2026 rate environment) or that Gong will
              reach $750M+ ARR before exiting—a plausible but not certain trajectory requiring sustained 40%+ growth.
              Entry at secondary-market prices (~$4.5B, 9x trailing ARR) provides a more defensible cushion: the base
              case produces flat-to-modest returns, and the bull case is attractive. Entry at or below $4B (~8x ARR) is
              where the risk/return calculus becomes genuinely favourable across base and bull cases. Dilution risk is
              non-trivial but manageable. Gong has raised $584M in primary capital and the CEO states most of the 2021
              proceeds remain intact, reducing the near-term need for a new dilutive round. However, an IPO or
              late-stage secondary transaction will likely involve additional shares, and the preference structure for
              the five institutional rounds (Series A through E) has never been publicly disclosed. If earlier rounds
              carry participating preferred with liquidation multiples, the effective common equity value could be
              meaningfully below headline valuation in downside scenarios. Investors must obtain the full cap table,
              preference terms, and option overhang (including whether options have been repriced from the 2021
              high-water mark) before committing capital. The Calcalist November 2025 article explicitly noted that it
              was unclear whether options had been repriced—a material governance and incentive gap.
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
