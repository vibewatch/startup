      - number: '2.5'
        title: Adoption Constraints, Competition, and Data Governance Risks
        blocks:
          - type: paragraph
            body: >
              The revenue intelligence market faces structural headwinds from three directions: bundled hyperscaler
              competition, regulatory friction, and consent law complexity.


              Microsoft 365 Copilot for Sales and Salesforce Agentforce/Einstein AI both include native AI meeting
              summaries, deal intelligence, and sales workflow automation—capabilities that directly overlap with
              revenue intelligence platforms—and are available to existing Microsoft and Salesforce customers at lower
              incremental cost than standalone platforms. Salesforce processed 11 trillion LLM tokens through Einstein
              AI by early 2026, reflecting deep integration into the enterprise Sales Cloud workflow. Microsoft's
              bundling within Teams and Outlook (used by virtually all enterprise accounts) creates a "good enough"
              alternative for buyers who do not require the depth of Gong's AI models or data network effects. Both
              Microsoft and Salesforce positioned AI sales capabilities as bundled add-ons to existing enterprise
              agreements, further lowering the perceived cost of "good enough" alternatives. This hyperscaler
              competition is the primary downside risk to Gong's market growth trajectory. Revenue intelligence platform
              vendors typically require 2–3 year subscription contracts, which creates switching-cost protection for
              incumbents but also amplifies downside risk if a technically superior or bundled alternative emerges
              during the contract term.


              GDPR and comparable privacy regulations impose lawful-basis requirements for recording and processing
              personal data in AI systems. The UK ICO's AI and GDPR guidance identifies data minimization, purpose
              limitation, and transparent automated decision-making as requirements for AI deployments—all relevant to
              revenue intelligence systems that process call recordings, email content, and behavioral patterns from
              employees and customers. Gong holds EU-US Data Privacy Framework certification and a comprehensive
              compliance portfolio (SOC 2 Type 2, ISO/IEC 27001:2022, ISO/IEC 42001:2023 for AI management), but the
              compliance overhead still extends enterprise sales cycles in financial services and healthcare verticals.


              At least ten US states and the District of Columbia require all-party consent for call recording, creating
              configuration complexity and legal liability for customers. Gong provides consent notification tooling but
              customers bear the legal responsibility for appropriate configuration. These recording-law constraints are
              a recurring objection in enterprise procurement and add meaningful friction to SMB adoption where legal
              resources to manage compliance are limited. Whether hyperscaler AI will commoditize call recording and
              transcription within 18–36 months—eliminating the standalone value proposition for pure conversation
              intelligence vendors—remains an unresolved strategic risk for the RAO market.
            claimRefs:
              - CM036
              - CM037
              - CM038
              - CM039
