      - number: '7.2'
        title: AI Model Quality, Hallucination, and Accuracy Risk
        blocks:
          - type: paragraph
            body: >
              Gong's value proposition is anchored in the accuracy and trustworthiness of its AI-generated insights—deal
              risk scores, conversation summaries, coaching nudges, and revenue forecasts. AI model errors are not
              merely product quality issues; they are investment-thesis risks. If Gong's deal intelligence produces
              systematically biased or inaccurate predictions, customers will lose confidence and churn to alternatives
              or revert to manual judgment. G2 user reviews in 2025–2026 consistently cite transcript inaccuracy
              (especially on accented speech and technical terminology), coaching nudges that misread context, and AI
              summaries that omit critical deal developments as top complaints.


              The NIST AI Risk Management Framework (AI RMF 1.0) identifies validity, reliability, and explainability as
              core AI trustworthiness pillars—dimensions on which Gong's proprietary models are opaque. Gong's ISO/IEC
              42001:2023 certification for AI management systems is a positive governance signal, but certification does
              not validate model accuracy. Gong's dedicated help documentation on "Measuring AI Performance at Gong"
              acknowledges that model quality metrics are customer- configurable and subject to individual team
              calibration—which effectively means accuracy is heterogeneous across the install base. Enterprise
              customers using Gong forecasts to drive quarterly guidance carry downstream earnings-call risk if Gong's
              models are materially off. Two consecutive quarters of widely inaccurate AI predictions could trigger
              customer churn at the enterprise segment, precisely where Gong's $1M+ customer cohort is growing fastest.
              Gong's "AI trust barrier" research acknowledges that widespread enterprise adoption requires demonstrable,
              auditable AI reliability.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
