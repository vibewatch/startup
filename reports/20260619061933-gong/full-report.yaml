  - id: FV001
    title: Recommendation Logic — From Evidence to TRACK Rating
    type: flow
    layout: wide
    summary: >-
      Chain from Gong's four evidence pillars through uncertainty gaps to the TRACK recommendation, showing which
      evidence upgrades the call to buy and which downgrades it to avoid.
    data:
      nodes:
        - id: scale-proof
          label: 'Scale & Proof: $500M ARR, 55%+ YoY, Fortune 10 customers'
          type: input
        - id: moat
          label: 'Moat: Revenue Graph data flywheel, Gartner RAO Leader, 25M+ interactions'
          type: input
        - id: economics
          label: 'Economics: Near-profitable, $584M raised, most Series E intact'
          type: input
        - id: risks
          label: 'Risks: Salesforce/Microsoft native bundling, Clari+Salesloft rivalry, key-person'
          type: risk
        - id: valuation-primary
          label: 'Primary Valuation: $7.25B (14.5x ARR) — stretched vs. 8–12x peer range'
          type: risk
        - id: valuation-secondary
          label: 'Secondary Market: ~$4.5B (9x ARR) — closer to fair value'
          type: positive
        - id: gaps
          label: 'Gaps: NRR, gross margin, cap table, burn — all undisclosed'
          type: gap
        - id: track
          label: 'RECOMMENDATION: TRACK — Entry at secondary or below; avoid primary'
          type: output
        - id: upgrade-condition
          label: 'Upgrade to BUY if: NRR >120%, audited margin >70%, entry <$4.5B'
          type: conditional
        - id: downgrade-condition
          label: 'Downgrade to AVOID if: growth <25%, down-round, CFO departure'
          type: conditional
