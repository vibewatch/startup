            - IPO execution delay; valuation mark-down
            - EU AI Act compliance gap; CCPA enforcement
            - Platform-native CRM displacement (Salesforce/Microsoft)
        - label: High Likelihood (3–4)
          values:
            - Integration latency
            - Customer concentration/renewal risk; AI bias claims
            - Recording-consent regulatory action; AI hallucination churn
            - AWS single-cloud failure; enterprise data breach
        - label: Medium Likelihood (2–3)
          values:
            - Patent residual risk
            - CFO/CCO departure; ML talent attrition
            - GDPR Article 9 special-data exposure; NRR decline
            - CEO/CTO key-person departure before IPO
        - label: Low Likelihood (1–2)
          values:
