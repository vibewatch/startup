  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The revenue intelligence and conversation intelligence market entered a period of significant structural
              consolidation in 2025–2026. Gartner formalized the Revenue Action Orchestration (RAO) category in December
              2025 through its inaugural Magic Quadrant, bringing analytical clarity to a market previously fragmented
              across conversation intelligence, sales engagement, and revenue forecasting point solutions. The RAO
              framework evaluates vendors on their ability to unify data capture, AI-driven insight generation, and
              workflow orchestration across the full go-to-market cycle.


              Gong entered 2026 as the undisputed category leader: named a Leader in the inaugural RAO Magic
              Quadrant—one of only three vendors so recognized among twelve evaluated—and ranking first across all four
              Critical Capabilities use cases defined by Gartner. With $500M ARR and 55%+ year-over-year growth through
              mid-2026, Gong's financial performance reflects both category expansion and share capture from
              point-solution competitors being displaced by platform consolidation.


              The competitive field organizes into four distinct tiers. First-tier direct competitors include the merged
              Clari+Salesloft entity, Outreach (rebranded as an agentic AI revenue platform), and Chorus by ZoomInfo—all
              competing on some or all of the same RAO use cases as Gong. Second-tier incumbents include Salesforce
              (Revenue Intelligence + Agentforce), HubSpot (Sales Hub), and Microsoft (M365 Copilot), which compete
              through bundling and distribution advantages rather than AI depth. Third-tier adjacents and substitutes
              include Aviso, Avoma, Fireflies.ai, and Revenue.io, which serve narrower use cases, lower price points, or
              specific integration ecosystems. The fourth tier is status quo alternatives: manual CRM dashboards,
              spreadsheet-based pipelines, and native Salesforce or HubSpot reporting that represent zero-cost
              competition for budget-constrained buyers. Each tier exerts distinct competitive pressure on different
              segments of Gong's customer base and expansion opportunity.
