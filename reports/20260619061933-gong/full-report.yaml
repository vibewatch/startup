              - CV047
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: TRACK at Secondary Prices; Avoid at Primary
            body: >
              The evidence supports a TRACK recommendation: Gong's growth trajectory, category leadership, and
              near-breakeven economics are genuinely exceptional, but the $7.25B primary valuation set in 2021 is 38%
              above the most recent secondary-market evidence and materially above the 8–12x ARR range implied by 2026
              SaaS comparable analysis. Entry discipline is the deciding variable. Secondary buyers at ~$4.5B capture a
              fair entry with a credible base-case outcome; primary-price buyers require a bull-case exit to break even.
              Six material diligence gaps—NRR, gross margin, cap table, burn rate, 2026 competitive win/loss, and option
              overhang—must be resolved before the call can be upgraded to buy.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV015
              - CV034
              - CV043
          - type: callout
            title: Preference Overhang and Option Repricing Are Unquantified Risks
            body: >
              Gong has raised $584M across five institutional rounds and has never disclosed its liquidation preference
              structure or option-pool terms. The November 2025 Calcalist report explicitly noted uncertainty about
              whether employee options have been repriced from the 2021 $7.25B high-water mark. In a bear or base exit,
              participating preferred structures could absorb 20–30% of headline valuation before common shareholders
              receive proceeds. Investors must treat the cap table as a blocking diligence item.
            calloutType: risk
            claimRefs:
              - CV036
              - CV037
              - CV038
          - type: callout
            title: The Secondary Market is the Only Current Price Signal
            body: >
              With no primary raise since 2021 and no public trading, the November 2025 ~$4.5B secondary mark (via
              Nasdaq Private Market, not company-approved) is the only independent contemporaneous price signal for Gong
              equity. It implies a 38% discount to the primary valuation. Secondary prices carry a liquidity discount,
              but the size of the gap—combined with the CEO's own comment that he "doesn't know what valuation we would
              receive today"—suggests the primary mark is meaningfully stale as of June 2026.
            calloutType: insight
            claimRefs:
              - CV015
              - CV016
              - CV017
