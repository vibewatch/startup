  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR Growth Deceleration
        - Two consecutive quarters of <25% YoY ARR growth
        - Breaks the core '50%+ durable growth' premise; compresses exit multiple to <6x ARR; bear case becomes central
        - Reduce or eliminate position; avoid new secondary purchases
      - - Competitive Displacement Signal
        - Documented loss of >2 Fortune 500 accounts to Salesforce Agentforce or Microsoft Copilot in a single quarter
        - Validates the 'native bundling at zero cost' displacement thesis; NRR risk becomes material
        - Commission deeper competitive intelligence; flag as pre-exit risk
      - - Primary Raise at Discount to Secondary
        - Gong raises a new primary round at <$4.5B post-money
        - Formal valuation reset; confirms down-round; anti-dilution triggers on earlier rounds likely
        - Reassess full position; model anti-dilution impact
      - - CFO/CEO Departure
        - Departure of Amit Bendov (CEO) or Todd Busler (CFO) without planned succession
        - Key-person concentration; new CFO appointed in 2025, critical for IPO execution
        - Place investment on hold pending succession clarity
      - - IPO Filed at <$4B Valuation
        - S-1 filed or IPO priced below $4B market cap
        - Confirms that public market rejected primary valuation; secondary entry at $4.5B is underwater
        - Full portfolio review; secondary holders should seek exit pre-IPO if possible
      - - NRR Below 100% Revealed
        - IPO prospectus or data-room disclosure shows NRR <100% in any trailing 4 quarters
        - Breaks expansion thesis; $500M ARR may be a high-water mark driven by new logo acquisition, not retention
        - Exit all positions; thesis fundamentally flawed
    notes: >-
      Triggers are designed to be monitorable with publicly available signals. Threshold definitions are quantitative
      where possible. 'Action implication' is directional guidance, not a trading recommendation.
    claimRefs:
      - CV032
      - CV033
      - CV038
      - CV039
      - CV044
      - CV045
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Cap Table and Preference Structure
        - >-
          Full waterfall model: liquidation preferences, participation rights, anti-dilution provisions for all five
          rounds (A–E)
        - >-
          Determines common equity value in base and bear exit scenarios; $584M raised could represent 30–50% haircut in
          downside
        - Management/CFO in data room; required disclosure in S-1
      - - Audited Gross Margin
        - GAAP gross margin for trailing 4–8 quarters, split between subscription and services
        - >-
          AI compute costs and professional services mix could compress margins to 60–70%; changes the exit multiple
          debate
        - Audited financial statements in data room; comparable SaaS companies disclose at IPO
      - - Net Revenue Retention (NRR)
        - Cohort-level NRR for enterprise customers (>$100K ACV) over trailing 4 quarters
        - Without NRR, the 50%→50% multi-product adoption doubling could mask churn that erodes the growth story
        - CRM/billing data; CFO data room; required for IPO with subscription business model
      - - Cash and Burn Rate
        - Actual cash balance and monthly operating cash burn as of Q1 2026
        - >-
          CEO states 'most of $250M intact' but this is unverified; a higher burn reduces runway and increases
          down-round risk
        - Audited balance sheet; CFO confirmation; bank statements in data room
      - - Competitive Win/Loss Data (2026)
        - >-
          Win/loss rates against Salesforce Agentforce, Microsoft Copilot for Sales, and Clari+Salesloft in enterprise
          RFPs during 2026
        - The single biggest thesis risk is native platform displacement; current data is anecdotal
        - Sales ops / CRO data room; customer reference interviews in 2026
      - - Option Overhang and Repricing
        - Fully diluted share count, option strike prices, and whether any post-2021 repricing occurred
        - >-
          Options issued at $7.25B valuation are deeply underwater at $4.5B; non-repriced options impair retention and
          reduce diluted equity value
        - Option ledger in data room; HR/finance disclosure; Calcalist November 2025 noted this was unclear
    notes: >-
      Evidence gaps are ordered by materiality to investment returns. Items 1–2 are blocking for any sizable primary or
      secondary commitment above $4.5B. Items 3–6 are material for sizing and return modelling. 'Owner' designates who
      holds the evidence, not who should perform diligence.
