      - number: '3.5'
        title: Switching Costs, Lock-in, and Multi-homing Dynamics
        blocks:
          - type: paragraph
            body: >
              Gong's switching costs are material and multi-dimensional. Migrating away from Gong requires exporting and
              re-ingesting a potentially multi-year library of call recordings and transcripts, rebuilding analytics
              templates and coaching scorecards calibrated to Gong's taxonomy, reconfiguring up to 300+ active
              integrations in the Gong Collective marketplace, and retraining sales teams on a new interface and
              workflow. For enterprise accounts running multiple Gong products, the switching friction compounds: an
              account on Gong CI plus Gong Engage plus Gong Forecast must disentangle three interconnected workflows
              simultaneously. The 50% multi-product adoption rate as of May 2026 reflects both successful cross-sell
              motion and increasing lock-in depth as account tenure grows.


              Gong's Revenue Graph creates a form of data-driven lock-in distinct from technical integration switching
              costs. The Revenue Graph is a persistent, company-specific intelligence layer trained on the customer's
              own call corpus, deal history, email patterns, and CRM data over years. This proprietary context—capturing
              how a specific company's buyers respond, how reps perform, and which deal patterns predict wins—is not
              portable to a competing platform without a rebuild from scratch. A competitor must re-create this context,
              producing a 6-12 month intelligence gap even after technical migration is complete. This intelligence
              flywheel compounds over time: the longer Gong is deployed, the richer the Revenue Graph, and the steeper
              the switching cost.


              Gong's accelerating enterprise momentum—adding more $1M+ ARR customers in two recent quarters than in the
              prior six combined—suggests that switching-cost protection is holding despite the Clari+Salesloft merger
              and platform bundling from Salesforce and Microsoft. The Clari+Salesloft combined entity's doubled
              post-merger R&D investment and its claim of the "broadest Revenue AI dataset" is the most credible attempt
              to replicate Gong's data scale advantage, but its dataset is assembled from different sources and lacks
              the decade of Gong-specific AI model training. Multi-homing is common in the market: many enterprise
              accounts deploy Gong alongside Outreach or Salesloft for complementary engagement workflows, reducing the
              displacement risk from those vendors while concentrating switching-cost exposure on Gong's CI and
              forecasting modules specifically.
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
              - CP039
      - number: '3.6'
        title: Moat Durability and Competitive Verdict
        blocks:
          - type: paragraph
            body: >
              Gong's competitive moat rests on three pillars: Revenue Graph data depth and company-specific AI training,
              integration ecosystem lock-in through 300+ Gong Collective integrations, and a multi-year head start on
              enterprise-grade revenue AI with 5,000+ customer deployments. The 55%+ YoY growth rate and 10 consecutive
              quarters of acceleration through mid-2026 are the strongest available indicators that the moat is
              holding—customers are consolidating onto Gong rather than fragmenting away. The half-of-Fortune-10
              penetration as of May 2026, combined with measurable customer outcomes including 64% seller productivity
              gain at Anthropic, 141% deal win increase at Paycor, 60% rep capacity lift at Canva, and 32% response rate
              lift at Uber for Business, provides enterprise-grade reference validation that bundled competitors and
              lower-cost alternatives have not matched at this scale.


              The primary durability risk is AI commoditization: as generic large language models improve at call
              summarization, key-moment extraction, and coaching recommendations, the functional gap between Gong's
              revenue-specific models and general-purpose AI narrows. Gong's defense is that the Revenue Graph is not a
              simple transcript collection—it is a structured, time-aware model of revenue performance with cross-deal,
              cross-rep, and cross-account pattern recognition that generic LLMs cannot replicate without
              domain-specific training data and purpose-built product architecture. Whether this defense is durable over
              a 3-5 year horizon as competitors accumulate comparable training data is the key unresolved moat question.


              The Clari+Salesloft merger's claim of 10 billion revenue interactions and 1 trillion data signals is the
              first credible attempt to compete on data scale with Gong, though the quality, curation, and
              revenue-specific labeling of that dataset relative to Gong's is not independently verifiable. Gong's
              enterprise customer success outcomes—documented across Anthropic, Uber for Business, Canva, and
              Paycor—remain the most compelling indicator of differentiated value. As long as Gong continues to
              demonstrate measurable revenue outcomes at tier-one enterprise accounts that no bundled alternative can
              replicate at comparable depth, its pricing power and land-and-expand motion should sustain growth through
              the 2026 competitive cycle despite increasing competitive intensity on all four tiers.
            claimRefs:
