  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "competitive-churn-switching"
      missingEvidence: "Customer-disclosed churn rates and win/loss data comparing Gong to Clari+Salesloft and Outreach, including migration case studies with disclosed switching reasons."
      whyItMatters: "Without churn data, switching-cost durability and the competitive threat from the Clari+Salesloft merger cannot be independently validated; Gong's self-reported growth may not reflect replacement risk."
      diligencePath: "Request win/loss analysis data from Gong; interview recently churned customers; review competitor case studies claiming successful migrations from Gong."
      relatedQuestionRefs: [QP011]

    - type: "private-evidence-only"
      severity: "material"
      topic: "gong-list-pricing"
      missingEvidence: "Gong's actual list pricing structure, platform fee schedule, volume discount thresholds, and multi-year commitment terms."
      whyItMatters: "Pricing estimates from third-party review sites may be outdated or inaccurate; actual pricing governs competitive win rates in procurement-driven enterprise evaluations."
      diligencePath: "Obtain Gong's current price list in due diligence; compare to renewal pricing for existing customers; benchmark against Clari+Salesloft and Outreach quotes."

    - type: "private-evidence-only"
      severity: "material"
      topic: "clari-salesloft-combined-arr"
      missingEvidence: "Clari+Salesloft combined ARR, customer count breakdown by segment, and R&D investment level post-merger to assess true scale relative to Gong."
      whyItMatters: "The competitive threat of the merged entity cannot be sized without verified financials; the $10T revenue under management figure reflects managed revenue, not Clari+Salesloft's own ARR."
      diligencePath: "Seek investor reports or secondary market data on Clari+Salesloft financials; request management commentary from Gong on the merger's competitive impact."
      relatedQuestionRefs: [QP006]

    - type: "missing-source"
      severity: "minor"
      topic: "market-share-conversation-intelligence"
      missingEvidence: "Independent market share data for the conversation intelligence and RAO segment, disaggregated by vendor, that is not self-reported by vendors or produced by affiliated analysts."
      whyItMatters: "Without third-party market share data, competitive positioning assessments rely on self-reported metrics and analyst opinions that may have vendor bias."
      diligencePath: "Commission IDC or Forrester custom market share analysis; review any public data from procurement platform Vendr or G2 install base data."

    - type: "conflicting-data"
      severity: "material"
      topic: "commoditization-risk-timeline"
      missingEvidence: "Independent benchmark comparing Gong's revenue-specific AI quality against GPT-5 or Gemini fine-tuned on sales call datasets, and a credible timeline for feature parity."
      whyItMatters: "If generic LLMs commoditize conversation intelligence within 18 months, Gong's AI moat becomes temporary; if 5+ years, the moat is durable. This is the single most consequential strategic uncertainty for the competitive verdict."
      diligencePath: "Commission head-to-head AI quality testing; review Gong's patent portfolio for defensible IP in revenue AI; assess OpenAI and Anthropic roadmaps for sales-specific model capabilities."
      relatedQuestionRefs: [QP027]

