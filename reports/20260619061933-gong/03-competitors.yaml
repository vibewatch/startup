chapter:
  number: 3
  title: "Competitors"
  summary: "The revenue intelligence competitive landscape in 2026 is defined by three structural dynamics: Gong's leadership position in the inaugural Gartner Revenue Action Orchestration (RAO) Magic Quadrant with $500M ARR and #1 ranking across all four Critical Capabilities use cases; the landmark merger of Clari and Salesloft into a combined Revenue AI entity managing $10 trillion for 5,000+ enterprise customers; and accelerating platform-bundling threats from Salesforce and Microsoft at zero incremental cost for existing enterprise customers. Gong's primary moat is its Revenue Graph proprietary data model, 300+ integrations, and multi-year head start on revenue-specific AI training, but commoditization of basic conversation intelligence from LLM-native and CRM-embedded competitors represents a medium-term durability risk."

sections:
  - id: "s01-landscape"
    title: "Competitive Landscape Overview"
    body: |
      The revenue intelligence and conversation intelligence market entered a period of significant structural consolidation in 2025–2026. Gartner formalized the Revenue Action Orchestration (RAO) category in December 2025 through its inaugural Magic Quadrant, bringing analytical clarity to a market previously fragmented across conversation intelligence, sales engagement, and revenue forecasting point solutions. The RAO framework evaluates vendors on their ability to unify data capture, AI-driven insight generation, and workflow orchestration across the full go-to-market cycle.

      Gong entered 2026 as the undisputed category leader: named a Leader in the inaugural RAO Magic Quadrant—one of only three vendors so recognized among twelve evaluated—and ranking first across all four Critical Capabilities use cases defined by Gartner. With $500M ARR and 55%+ year-over-year growth through mid-2026, Gong's financial performance reflects both category expansion and share capture from point-solution competitors being displaced by platform consolidation.

      The competitive field organizes into four distinct tiers. First-tier direct competitors include the merged Clari+Salesloft entity, Outreach (rebranded as an agentic AI revenue platform), and Chorus by ZoomInfo—all competing on some or all of the same RAO use cases as Gong. Second-tier incumbents include Salesforce (Revenue Intelligence + Agentforce), HubSpot (Sales Hub), and Microsoft (M365 Copilot), which compete through bundling and distribution advantages rather than AI depth. Third-tier adjacents and substitutes include Aviso, Avoma, Fireflies.ai, and Revenue.io, which serve narrower use cases, lower price points, or specific integration ecosystems. The fourth tier is status quo alternatives: manual CRM dashboards, spreadsheet-based pipelines, and native Salesforce or HubSpot reporting that represent zero-cost competition for budget-constrained buyers. Each tier exerts distinct competitive pressure on different segments of Gong's customer base and expansion opportunity.
    claimRefs: [CP001, CP002, CP003, CP004, CP035]

  - id: "s02-direct-peers"
    title: "Direct Peer Profiles — Clari+Salesloft, Outreach, Chorus"
    body: |
      The August 2025 merger announcement between Clari and Salesloft—formally completed in late 2025 with Steve Cox appointed as CEO—is the most consequential competitive event in the revenue intelligence market since Gong's $7.25B Series E in 2021. The merged entity brings together Clari's forecasting and pipeline orchestration capabilities (managing $5T+ in enterprise revenue pre-merger) with Salesloft's market-leading sales engagement cadence platform (serving Shopify, Google, 3M, IBM, and Square). The combined company claims $10 trillion in revenue under management, 5,000+ global enterprise customers, and a dataset ingesting 10 billion revenue interactions and 1 trillion data signals—representing a declared data-scale advantage directly competing with Gong's Revenue Graph. The merged entity doubled its R&D investment post-merger and positioned itself as building the "Predictive Revenue System," explicitly competing with Gong's "Revenue AI Operating System" framing. This combined entity competes across the full RAO spectrum: Salesloft Conversations provides CI depth, Clari contributes enterprise forecasting and pipeline health scoring, and the merged product roadmap targets full end-to-end coverage. Salesloft's own marketing asserts customers win 28% more deals and advance deals 75% faster with its CI product, using outcome language directly competitive with Gong's ROI positioning.

      Outreach—now operating as Outreach.ai—has reframed itself as an "agentic AI platform for revenue," offering a seat-plus-AI-credit consumption pricing model through packages including Amplify Core. Outreach's Kaia capability provides real-time in-call coaching, with company-claimed outcomes of 3x faster rep onboarding, 41% win rate improvement, and 30% productivity gains. Outreach competes most directly against Gong Engage (sales sequencing) and Gong's real-time coaching features, rather than on deep conversation intelligence or forecasting fronts where Gong's AI models are most differentiated. Gong and Outreach have historically been frequent co-deployment partners in enterprise accounts, creating a multi-homing pattern where complementarity moderated direct competitive pressure—a dynamic that Outreach's growing CI ambitions are now eroding.

      Chorus by ZoomInfo focuses on conversation intelligence embedded within ZoomInfo's B2B contact and company data platform. Chorus's core advantage is call analytics enriched with ZoomInfo's intent data, firmographics, and buying signals—a differentiation not replicated natively by Gong. However, Chorus is a CI-only tool with no sales engagement or forecasting capabilities, making it a narrow competitor suited to organizations already committed to the ZoomInfo ecosystem. The Clari+Salesloft combined entity's Revenue Context dataset—ingesting 10B+ interactions—is positioned as the foundation for training LLM models, making data scale a declared competitive differentiator targeting Gong's Revenue Graph.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP013, CP027, CP034, CP043, CP044]
    tableRefs: [TP001]
    figureRefs: [FP001]

  - id: "s03-incumbents"
    title: "Incumbent and Platform Threats — Salesforce, HubSpot, Microsoft"
    body: |
      Salesforce represents the most structurally complex threat to Gong's long-term market position. Revenue Intelligence is now bundled into Salesforce Sales Cloud enterprise editions or available as a dedicated add-on, covering pipeline management, quota tracking, and AI-powered deal guidance. Salesforce's Agentforce platform enables autonomous AI agent deployment across sales, service, and marketing workflows—including deal summarization, coaching recommendations, and pipeline risk scoring—overlapping directly with Gong's AI capabilities. For Salesforce's installed base of 150,000+ enterprise customers globally, Revenue Intelligence and Agentforce represent zero-incremental-cost capabilities embedded in existing contracts, lowering the perceived marginal value of a separate Gong deployment. Salesforce's distribution advantage is unmatched: the average enterprise account already has Sales Cloud, making Gong a budget addition rather than the default intelligence layer. Revenue Intelligence pricing is available as a bundle addition to Sales Cloud, meaning the effective incremental cost for existing enterprise SFDC customers purchasing Gong is Gong's full price versus near-zero for Salesforce RI.

      HubSpot presents a second form of platform threat, particularly in SMB and mid-market. Sales Hub Professional ($90/user/month) and Enterprise ($150/user/month) both include native conversation intelligence, eliminating the need for a separate CI tool for HubSpot customers. HubSpot's Breeze AI agents and CI features are embedded at no separate per-user fee, making Gong's pricing unfavorable for buyers already invested in HubSpot. HubSpot's blog coverage of conversation intelligence tools does not list Gong among the affordable options, reinforcing Gong's enterprise-only market position and ceding SMB and lower mid-market to HubSpot.

      Microsoft 365 Copilot is a structurally distinct threat: AI capabilities embedded in Teams—including meeting recording, transcription, summarization, and agent workflows through Work IQ—are available to every enterprise on Microsoft 365. Copilot licenses are a low-incremental add-on to existing M365 agreements, creating a near-zero-marginal-cost substitute for Gong's core conversation capture in Microsoft-standardized enterprises. The depth gap between Gong's revenue-specific AI and Microsoft's general-purpose Copilot remains material, but Copilot is improving rapidly, and for accounts where the primary Gong use case is call recording and basic summarization, Microsoft's bundling creates a ceiling on renewal price and expansion willingness.
    claimRefs: [CP014, CP015, CP016, CP017, CP028, CP029, CP041]
    tableRefs: [TP002]
    figureRefs: [FP002]

  - id: "s04-substitutes-and-status-quo"
    title: "Substitutes, Adjacents, and Status Quo Competition"
    body: |
      Below the tier-one and tier-two competitors, a fragmented landscape of adjacents, substitutes, and status quo alternatives competes for budget and mindshare at different price points and use-case profiles. CloudTalk's 2026 competitive review identified 11 distinct Gong alternatives covering different use cases—including CloudTalk itself, Chorus, Salesloft, Avoma, Wingman (Clari), Fireflies.ai, Dialpad, Salesken, Backstory, and Outreach—illustrating the depth of fragmentation that buyers can surface when evaluating alternatives.

      Avoma targets SMB and growth-stage companies with an all-in-one meeting intelligence and scheduling platform starting at approximately $19/user/month. It covers AI note-taking, meeting summaries, agenda management, conversation intelligence, and lead routing—a broader meeting workflow scope than Gong at a fraction of the price. Fireflies.ai claims adoption across more than 1 million companies globally with $10-19/month paid plans and a free tier, making it the dominant low-cost transcription alternative. Both Avoma and Fireflies.ai commoditize basic conversation capture and summarization, removing the entry-level justification for Gong among budget-constrained buyers.

      Aviso positions as a heavier end-to-end revenue orchestration platform with 450+ revenue teams, 30+ out-of-the-box agentic workflows, and 50+ critical revenue use cases including conversation intelligence, relationship intelligence, and forecasting. Backstory.ai targets the CRM data integrity segment—serving CROs who distrust Salesforce data quality—competing directly with Gong's pipeline intelligence features. Revenue.io competes as a Salesforce-native CI platform with real-time coaching (Moments), AI scorecards, and deep Salesforce integration, specifically serving accounts where Salesforce is the system of record. Outreach's consumption-based pricing model (AI credits alongside seat fees via Amplify Core) enables lower entry costs than Gong's per-seat-plus-platform-fee structure, further fragmenting the addressable lower end of the market.

      Status quo alternatives represent meaningful zero-cost competition: native Salesforce Reports and Dashboards, HubSpot deal pipelines, and spreadsheet-based pipeline reviews serve as sufficient alternatives for cost-sensitive or lower AI-maturity buyers. Third-party review sites in 2026 consistently identify Gong's pricing as its primary competitive disadvantage, driving trial of lower-cost alternatives particularly in the growth-stage and budget-sensitive mid-market. HubSpot's own blog on conversation intelligence tools lists Avoma and other affordable alternatives without positioning Gong as accessible for its SMB reader base.
    claimRefs: [CP018, CP019, CP020, CP021, CP030, CP031, CP032, CP036, CP037, CP038, CP040, CP042]
    tableRefs: [TP003]

  - id: "s05-switching-costs"
    title: "Switching Costs, Lock-in, and Multi-homing Dynamics"
    body: |
      Gong's switching costs are material and multi-dimensional. Migrating away from Gong requires exporting and re-ingesting a potentially multi-year library of call recordings and transcripts, rebuilding analytics templates and coaching scorecards calibrated to Gong's taxonomy, reconfiguring up to 300+ active integrations in the Gong Collective marketplace, and retraining sales teams on a new interface and workflow. For enterprise accounts running multiple Gong products, the switching friction compounds: an account on Gong CI plus Gong Engage plus Gong Forecast must disentangle three interconnected workflows simultaneously. The 50% multi-product adoption rate as of May 2026 reflects both successful cross-sell motion and increasing lock-in depth as account tenure grows.

      Gong's Revenue Graph creates a form of data-driven lock-in distinct from technical integration switching costs. The Revenue Graph is a persistent, company-specific intelligence layer trained on the customer's own call corpus, deal history, email patterns, and CRM data over years. This proprietary context—capturing how a specific company's buyers respond, how reps perform, and which deal patterns predict wins—is not portable to a competing platform without a rebuild from scratch. A competitor must re-create this context, producing a 6-12 month intelligence gap even after technical migration is complete. This intelligence flywheel compounds over time: the longer Gong is deployed, the richer the Revenue Graph, and the steeper the switching cost.

      Gong's accelerating enterprise momentum—adding more $1M+ ARR customers in two recent quarters than in the prior six combined—suggests that switching-cost protection is holding despite the Clari+Salesloft merger and platform bundling from Salesforce and Microsoft. The Clari+Salesloft combined entity's doubled post-merger R&D investment and its claim of the "broadest Revenue AI dataset" is the most credible attempt to replicate Gong's data scale advantage, but its dataset is assembled from different sources and lacks the decade of Gong-specific AI model training. Multi-homing is common in the market: many enterprise accounts deploy Gong alongside Outreach or Salesloft for complementary engagement workflows, reducing the displacement risk from those vendors while concentrating switching-cost exposure on Gong's CI and forecasting modules specifically.
    claimRefs: [CP022, CP023, CP024, CP025, CP026, CP039]

  - id: "s06-moat-verdict"
    title: "Moat Durability and Competitive Verdict"
    body: |
      Gong's competitive moat rests on three pillars: Revenue Graph data depth and company-specific AI training, integration ecosystem lock-in through 300+ Gong Collective integrations, and a multi-year head start on enterprise-grade revenue AI with 5,000+ customer deployments. The 55%+ YoY growth rate and 10 consecutive quarters of acceleration through mid-2026 are the strongest available indicators that the moat is holding—customers are consolidating onto Gong rather than fragmenting away. The half-of-Fortune-10 penetration as of May 2026, combined with measurable customer outcomes including 64% seller productivity gain at Anthropic, 141% deal win increase at Paycor, 60% rep capacity lift at Canva, and 32% response rate lift at Uber for Business, provides enterprise-grade reference validation that bundled competitors and lower-cost alternatives have not matched at this scale.

      The primary durability risk is AI commoditization: as generic large language models improve at call summarization, key-moment extraction, and coaching recommendations, the functional gap between Gong's revenue-specific models and general-purpose AI narrows. Gong's defense is that the Revenue Graph is not a simple transcript collection—it is a structured, time-aware model of revenue performance with cross-deal, cross-rep, and cross-account pattern recognition that generic LLMs cannot replicate without domain-specific training data and purpose-built product architecture. Whether this defense is durable over a 3-5 year horizon as competitors accumulate comparable training data is the key unresolved moat question.

      The Clari+Salesloft merger's claim of 10 billion revenue interactions and 1 trillion data signals is the first credible attempt to compete on data scale with Gong, though the quality, curation, and revenue-specific labeling of that dataset relative to Gong's is not independently verifiable. Gong's enterprise customer success outcomes—documented across Anthropic, Uber for Business, Canva, and Paycor—remain the most compelling indicator of differentiated value. As long as Gong continues to demonstrate measurable revenue outcomes at tier-one enterprise accounts that no bundled alternative can replicate at comparable depth, its pricing power and land-and-expand motion should sustain growth through the 2026 competitive cycle despite increasing competitive intensity on all four tiers.
    claimRefs: [CP033, CP045]
    tableRefs: [TP004]
    figureRefs: [FP003]

