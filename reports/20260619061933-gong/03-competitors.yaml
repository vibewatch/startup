  - id: "FP003"
    title: "Moat and Competitive Readiness KPIs — Gong vs. Competitive Landscape"
    type: "kpi"
    layout: "wide"
    summary: "Gong's Revenue Graph data moat and switching costs are the highest-durability advantages; AI model commoditization and CRM-native bundling from Salesforce and Microsoft are the highest-severity risks."
    approximationNotes: "KPI ratings (High/Medium/Low) reflect qualitative analyst assessment based on public evidence as of June 2026. No quantitative benchmarks for AI model quality or switching cost magnitude are independently available for this market."
    data:
      items:
        - label: "Revenue Graph Data Moat"
          value: "High Durability"
          description: "10B+ proprietary revenue interactions; company-specific AI model training; not replicable without same data architecture and years of accumulation"
        - label: "Customer Switching Cost"
          value: "High"
          description: "Multi-year call library migration, 300+ integration reconfiguration, analytics template rebuild, rep retraining; 50% multi-product attachment deepens lock-in"
        - label: "Integration Ecosystem Depth"
          value: "Medium-High"
          description: "300+ Gong Collective integrations; at risk from SFDC Agentforce and HubSpot Breeze AI replacing integration need natively for CRM-standardized accounts"
        - label: "AI Model Differentiation"
          value: "Medium (Contested)"
          description: "Revenue-specific training advantage vs. GPT-5 and Gemini fine-tuning; differentiation window estimated at 18-36 months at current pace of LLM commoditization"
        - label: "CRM Bundling Threat (Salesforce + HubSpot)"
          value: "High Risk"
          description: "Zero-increment-cost RI for 150K+ Salesforce customers and HubSpot mid-market; Gong must demonstrate depth advantage to justify premium pricing"
        - label: "Network Effects"
          value: "Medium-Low"
          description: "Intra-company rep behavior benchmarks provide value; no cross-company data network moat; per-account value does not compound across the installed base"
        - label: "Clari+Salesloft Merger Threat"
          value: "High Risk"
          description: "Combined 5,000+ customers, $10T revenue under management, doubled R&D post-merger; first credible data-scale competitor to Gong's Revenue Graph"
    claimRefs: [CP024, CP039, CP033, CP045]

callouts:
  - calloutType: "strength"
    title: "Gong Leads the Inaugural Gartner RAO Magic Quadrant"
    body: "Gong was named a Leader in the 2025 Gartner Magic Quadrant for Revenue Action Orchestration—one of only three vendors so recognized among twelve evaluated—and ranked first across all four Critical Capabilities use cases: acquire new customers, retain and grow accounts, manage pipeline and forecast, and coach sales talent. With $500M ARR and 55%+ YoY growth through mid-2026, Gong enters the 2026 competitive cycle from a position of undisputed category leadership in a newly formalized market."
    claimRefs: [CP001, CP002, CP003]

  - calloutType: "risk"
    title: "Clari+Salesloft Merger Creates Formidable Direct Competitor"
    body: "The August 2025 announcement and late-2025 close of the Clari+Salesloft merger is the most significant competitive consolidation event in the revenue intelligence market since Gong's 2021 fundraise. The combined entity manages $10 trillion in enterprise revenue, serves 5,000+ customers, and doubled its R&D investment post-merger. With a combined sales engagement and forecasting platform competing directly against Gong on the 'Predictive Revenue System' thesis and the declared goal of out-scaling Gong's Revenue Graph data moat, this is Gong's most capable direct challenger as of mid-2026."
    claimRefs: [CP005, CP006, CP007, CP034]

  - calloutType: "risk"
    title: "Microsoft and Salesforce Bundle AI at Zero Incremental Cost"
    body: "Salesforce Revenue Intelligence is bundled into Sales Cloud Enterprise or available as an add-on to 150,000+ existing enterprise customers globally—creating a near-zero-increment alternative for the largest share of the enterprise buyer base. Microsoft 365 Copilot's meeting recording, summarization, and AI agents in Teams are available to virtually all enterprise M365 accounts at approximately $30/user/month add-on, or effectively zero when bundled into enterprise agreements. For any buyer whose primary Gong use case is call capture and basic CI, both represent 'good enough' substitutes at significantly lower incremental cost."
    claimRefs: [CP015, CP017, CP028, CP041]

  - calloutType: "insight"
    title: "Revenue Graph Creates Self-Reinforcing Data Moat if AI Gap Holds"
    body: "Gong's Revenue Graph converts every customer interaction into a persistent, company-specific intelligence layer trained on deal history, rep behavior patterns, and buyer signals. This context is not portable across platforms and compounds over time—creating a switching cost that grows with account tenure. At 50% multi-product attachment and growing enterprise ARR, the Revenue Graph is the most defensible element of Gong's competitive moat, provided AI commoditization does not erode the model-quality gap within the critical 18-36 month window."
    claimRefs: [CP024, CP033]

