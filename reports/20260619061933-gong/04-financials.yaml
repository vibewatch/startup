  - id: "financial-gaps-and-verdict"
    title: "Financial Gaps, Diligence Blockers, and Verdict"
    body: >-
      Gong's private status creates systematic underwriting gaps that cannot be resolved from
      public information alone. The five most material gaps for a primary capital decision are:
      gross margin (required to assess profitability path and competitive pricing sustainability),
      net revenue retention by cohort (required to understand whether expansion outweighs churn
      and whether the 50% multi-product statistic reflects true dollar retention), customer
      acquisition cost and S&M efficiency by segment (required to validate the up-market motion
      economics), product-level ARR breakdown (required to assess whether Engage/Forecast/Enable
      are standalone revenue drivers or bundled discounts), and GAAP revenue recognition
      (required to distinguish ARR from deferred or recognized revenue under ASC 606).

      The financial verdict on Gong is constructive from a revenue-quality and capital-adequacy
      perspective, with material uncertainty on unit economics. The $500M ARR, 55%+ growth, 10-
      quarter acceleration streak, and multi-product expansion provide strong top-line evidence of
      platform adoption. The capital adequacy signal from the CEO's public statements is positive.
      The adversely noted valuation compression on the secondary market and unknown option
      overhang are governance and incentive-alignment risks, not fundamental financial impairments.
      The main blocker for underwriting is the unavailability of gross margin and NRR data, which
      in comparable public companies span a wide range — Salesforce (76%), HubSpot (85%), Clari
      (estimated 75%+) — making Gong's exact margin profile a material unknown. A due-diligence
      data room covering the items in TI005 would resolve the primary gaps before a primary-round
      judgment can be finalized.
    claimRefs:
      - CI038
      - CI039
      - CI025
      - CI009
      - CI033
      - CI041
    tableRefs:
