  - id: "unit-economics-and-margin"
    title: "Unit Economics, Gross Margin, and Implied Efficiency"
    body: >-
      Gong discloses no unit-economics metrics as a private company. Gross margin, net revenue
      retention (NRR), customer acquisition cost (CAC), payback period, and product-level ARR
      breakdown are all absent from public disclosures, creating material underwriting gaps that
      require management account access. Despite this opacity, several structural proxies and
      inferrable signals provide partial context.

      Gross margin: Enterprise SaaS peers operating at Gong's scale and architecture — primarily
      software with cloud hosting, AI inference costs, and no hardware — typically report gross
      margins in the 70–80% range. Gong's AI inference and data processing workloads (processing
      25M+ sales interactions to power the Revenue Graph) represent a non-trivial compute cost
      component that may suppress margins relative to lighter-weight peers, though the scale of
      training data processed provides diminishing marginal inference costs. The fivefold scaling of
      professional services in early 2026 introduces a lower-margin services revenue mix that, if
      material, would pull blended gross margin below pure software levels.

      Revenue efficiency: At $500M ARR and approximately 1,700 employees (per CEO statement to
      Calcalis in May 2026), Gong's implied ARR per full-time employee is approximately $294K.
      This compares to enterprise SaaS medians of $200–350K and top-quartile performers above
      $400K. The ratio has likely improved significantly: at $300M ARR and 1,300 employees
      (November 2025), the ratio was $231K. Net revenue retention is not disclosed but the
      multi-product adoption trajectory (1-in-4 to 1-in-2 in 15 months) implies expansion above
      contraction for the installed base. CEO statements indicate the company is "nearly
      profitable" at $300M ARR and can "become profitable at any time," which at $500M ARR
      suggests burn is controlled and likely declining.
    claimRefs:
      - CI010
      - CI033
      - CI037
