callouts:
  - calloutType: "strength"
    title: "Capital Adequacy: Five Years on One Round"
    body: >-
      Gong reaching $500M ARR without a primary capital raise since June 2021 is a rare
      efficiency signal for an enterprise SaaS company at this scale. The CEO's public
      statements confirm that most of the $250M Series E proceeds remain intact, implying the
      company has been largely self-funding its growth since 2021 — a strong capital discipline
      indicator.
    claimRefs:
      - CI007
      - CI008
      - CI023

  - calloutType: "risk"
    title: "Secondary Market Valuation Decline and Option Overhang"
    body: >-
      The November 2025 secondary transaction at ~$4.5B — a 38% discount to the June 2021
      $7.25B Series E valuation — is an adverse financial signal with dual implications:
      investors holding at peak may face paper losses, and employee options granted at peak
      strike prices may be economically underwater. It is not publicly known whether Gong has
      repriced employee options. An unresolved option overhang at a pre-IPO stage creates
      retention risk for senior talent, particularly in a competitive AI talent market.
    claimRefs:
      - CI009
      - CI024
      - CI025

  - calloutType: "insight"
    title: "Multi-Product Expansion Is the Primary ARR Growth Engine"
    body: >-
      The most significant revenue quality insight in Gong's 2026 financials is the speed of
      multi-product adoption: from 25% to 50% of customers using multiple products in
      approximately 15 months. This implies that a majority of ARR growth is coming from
      expansion within the existing 4,500–5,000 account base rather than from new customer
      acquisition alone. If true NRR reflects this expansion pattern, it likely exceeds 115%
      and substantially reduces the reliance on new logo sales to sustain growth.
    claimRefs:
      - CI022
      - CI005
      - CI035

