  evidenceGaps:
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "gross-margin"
      missingEvidence: "Audited gross margin with COGS breakdown by hosting, AI inference, support, and professional services"
      whyItMatters: "Without gross margin, the profitability path, competitive pricing floor, and services-mix dilution effect cannot be assessed, blocking a primary-round underwriting decision"
      diligencePath: "Request management accounts or audited P&L with COGS line-item detail and gross margin trend for the past four quarters"
      relatedQuestionRefs: [QI009]

    - type: "private-evidence-only"
      severity: "blocking"
      topic: "nrr"
      missingEvidence: "Net revenue retention by annual customer cohort, segment (SMB/MM/ENT), and product line"
      whyItMatters: "Multi-product adoption rate is an activity metric, not a dollar-retention metric; NRR is required to distinguish genuine expansion from gross churn offset"
      diligencePath: "Request cohort-level NRR and gross revenue retention for the trailing eight quarters, segmented by ACV band"
      relatedQuestionRefs: [QI022]

    - type: "private-evidence-only"
      severity: "material"
      topic: "product-level-arr"
      missingEvidence: "ARR attributed to each product line: Conversation Intelligence, Engage, Forecast, Enable, Assistant, and Professional Services"
      whyItMatters: "Product-level ARR determines whether multi-product expansion reflects standalone revenue or bundled discounting; critical to assessing the durability of the 50% multi-product statistic"
      diligencePath: "Request product-level ARR waterfall and customer count by product attachment; confirm whether bundled products are discounted below standalone rate card"
      relatedQuestionRefs: [QI019]

    - type: "private-evidence-only"
      severity: "material"
      topic: "burn-rate"
