chapter:
  number: 4
  title: "Financials"
  summary: >-
    Gong has surpassed $500M ARR in May 2026 at 55%+ year-over-year growth — its tenth consecutive
    quarter of acceleration — anchored by a quote-only per-user-plus-platform-fee pricing model,
    multi-product expansion now covering 50% of its 5,000+ enterprise customers, and accelerating
    $1M+ contract wins. The company's CEO has publicly stated it remains "nearly profitable" and
    that the bulk of the $250M Series E capital is intact, signaling adequate near-term runway
    without a primary raise. However, core financial metrics — gross margin, NRR, CAC, burn rate,
    and product-level ARR — remain undisclosed for this private company, and a November 2025
    secondary market transaction at roughly $4.5B (38% below the $7.25B 2021 peak) introduces
    an adverse signal on valuation expectations and employee option overhang.

sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model and Pricing Architecture"
    body: >-
      Gong's revenue model is a B2B SaaS subscription anchored on two interlocking components:
      a per-user seat license and a platform fee sized to the number of supported users. Both
      components are entirely quote-based — the official pricing page instructs prospective buyers
      to complete a request form for a custom proposal and offers no published tiers, floor prices,
      or named plans. This deliberately opaque structure is consistent with enterprise SaaS practice
      at Gong's scale: it allows differentiated pricing by vertical, deal size, multi-year
      commitment, and bundled product set, and it prevents competitors or buyers from anchoring
      discount negotiations to published list prices.

      Gong's platform spans six commercially distinct modules: Conversation Intelligence (the
      original core product), Gong Engage (sales sequencing and outreach), Gong Forecast (pipeline
      and revenue forecasting), Gong Enable (coaching and enablement), Gong Assistant (agentic AI
      automation), and a growing Professional Services / Revenue Architects offering. All product
      add-ons beyond the core CI license are priced incrementally through the custom-quote process.
      The 411 integrations published on the Gong Collective marketplace are offered at no additional
      cost, functioning as a platform-stickiness and switching-cost mechanism rather than a direct
      revenue line. Professional services revenue emerged as a structural growth investment in early
      2026 when Gong scaled its services and consulting ecosystem fivefold, introducing Revenue
      Architects and global systems integrator partnerships — a motion that generates incremental
      revenue while increasing deployment depth and multi-year retention.
    claimRefs:
      - CI001
      - CI003
      - CI004
