  - id: "enterprise-gtm-and-sales-efficiency"
    title: "Enterprise GTM Motion and Sales Efficiency Proxies"
    body: >-
      Gong's go-to-market is entirely enterprise-focused, requiring a complex, multi-stakeholder
      sales cycle typical of platform software displacing incumbent point solutions. The company
      does not publish average sales cycle length, win rates, or direct CAC data. However, several
      observable proxies support the assessment.

      The $1M+ contract acceleration — more seven-figure deals added in two quarters than in the
      prior six — indicates a significant up-market motion is succeeding at scale. The customer
      base grew by approximately 500 organizations between November 2025 and March 2026, implying
      a quarterly net add rate of roughly 125–175 new accounts during a period of strong ARR
      acceleration. If the average new customer in 2026 is landing at meaningfully higher ACV than
      the blended book average ($100K implied), the growth is being driven disproportionately by
      large enterprise expansions and up-market wins. The presence of half the Fortune 10 — Gong
      names ADP, Anthropic, Canva, Cisco, DocuSign, Google, Paycor, Uber for Business, and Thomson
      Reuters — validates enterprise GTM penetration but also reflects concentration in very large
      accounts that may have extended procurement cycles and higher renewal risk if a consolidating
      CRM vendor bundles equivalent functionality.

      Gong's Customer Office, launched in early 2026, integrates pre-sales and post-sales under
      CCO Simon Frey, with Revenue Architects providing deployment advisory. This structure is
      designed to shorten the time-to-value curve and improve renewal economics at scale, directly
      addressing the risk that AI-adjacent buyers buy pilots rather than platform commitments. The
      fivefold scaling of the services/consulting ecosystem implies meaningful S&M investment in
      professional services headcount, which, if expensed as sales cost, increases CAC without a
      corresponding increase in first-year ARR.
    claimRefs:
      - CI005
      - CI015
      - CI022
      - CI026
      - CI035

  - id: "capital-adequacy-burn-runway"
    title: "Capital Adequacy, Burn, and Runway"
    body: >-
      Gong has raised a total of $584M across five institutional rounds between 2016 and 2021.
      The last primary round — the $250M Series E led by Franklin Templeton at a $7.25B valuation
      in June 2021 — remains the most recent equity event. No primary capital raise has been
      announced in the five years since. This fact is itself a strong positive signal: it implies
      the company reached $500M ARR on the original capital base without needing a bridge or
      down-round, and that operations have been funded from subscription revenue growth rather than
      fresh equity.

      CEO Amit Bendov told TechCrunch in March 2025 that the company is "nearly profitable" and
      has "almost not touched" the 2021 Series E capital. The same interview confirmed active hiring
      and continued growth investment, consistent with a deliberate choice to operate just below
      breakeven while capturing market share. By November 2025, the CEO reiterated in Calcalis that
      "we still have most of the capital we raised, so we don't need and don't plan to raise
      additional funds in the near future." Taken together, these statements imply remaining cash
      on hand in the range of $150–220M, though no audited figure exists. At a "nearly profitable"
      burn posture with approximately $500M in ARR and continuing subscription revenue inflow,
      runway is estimated to be multi-year.

      The adverse signal is a November 2025 secondary transaction — employees and investors selling
      shares via Nasdaq Private Market at a roughly $4.5B implied valuation, a 38% decline from the
      $7.25B 2021 peak. Gong did not approve the transaction and noted it does not comment on
      secondary activity. It is not yet known whether employee options have been repriced relative
      to the $7.25B peak; an option overhang at inflated strike prices can impair talent retention
      in the pre-IPO window.
