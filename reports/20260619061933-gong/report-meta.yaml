companyProfile:
  summary: >-
    Gong is a San Francisco-headquartered revenue intelligence software company founded in 2015 by Amit Bendov and
    Eilon Reshef. The company sells a multi-product Revenue AI platform that records, transcribes, analyzes, and acts
    on sales and customer interactions across calls, email, meetings, forecasting, and workflow automation. Gong has
    raised approximately $584 million, reached a $7.25 billion primary valuation in 2021, and by May 2026 reported
    $500 million-plus ARR, more than 5,000 customers, and 55%+ year-over-year growth; however, underwriting still
    depends heavily on company disclosures and secondary-market evidence because audited margins, retention, and cap-
    table terms remain private.
  foundedDate: '2015-01-01'
  founders:
    - name: Amit Bendov
      role: Co-Founder and CEO
      background: Former SiSense CEO who turned a sales-pipeline failure into Gong's founding product thesis.
      claimRefs: [CO001, CO007]
    - name: Eilon Reshef
