  topStrengths:
    - Category-defining position in revenue intelligence with strong product breadth and a visible Revenue Graph data moat.
    - "Rare late-stage growth profile: $500M+ ARR, 55%+ year-over-year growth, and 5,000+ customers by May 2026."
    - Near-profitability claims and lack of a new primary round since 2021 imply unusually strong capital adequacy for a pre-IPO SaaS company.
  topRisks:
    - The 2021 $7.25B primary mark appears stretched versus the late-2025 ~$4.5B secondary signal and current SaaS multiples.
    - Gross margin, NRR, burn, and audited GAAP financials remain undisclosed, limiting valuation precision.
    - Native AI bundling from Salesforce and Microsoft could compress new-logo wins and future exit multiples.
    - Cap-table preferences, option repricing status, and customer concentration remain opaque and could materially change common-equity outcomes.
  unresolvedGaps:
    - Audited GAAP revenue, gross margin, burn, and cash balance are not public.
    - Net revenue retention, gross retention, and cohort-level customer economics remain undisclosed.
    - Full cap-table waterfall, liquidation preferences, anti-dilution terms, and option repricing status are private.
    - Competitive win/loss data against Salesforce Agentforce and Microsoft Copilot for Sales is not publicly available.
