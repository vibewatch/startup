  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: ai-accuracy-benchmarks
      missingEvidence: >
        An independently audited accuracy benchmark for Gong's transcript, deal-score, and revenue forecast models,
        including false-positive/negative rates segmented by language, accent, and industry vertical.
      whyItMatters: >
        Without a published accuracy SLA or independent benchmark, enterprise buyers cannot evaluate AI model risk
        and are exposed to model errors that could affect earnings guidance if Gong forecasts are used directly.
      diligencePath: >
        Request internal accuracy benchmark data and model validation reports from Gong; ask whether ISO 42001
        audit covers model-level accuracy claims.
      relatedQuestionRefs: [QR006, QR013, QR027]

    - type: missing-source
      severity: material
      topic: eu-ai-act-product-scope-assessment
      missingEvidence: >
        An external legal opinion or formal self-assessment confirming whether Gong's current sentiment analysis,
        buyer-intent scoring, and conversation coaching features fall within or outside the EU AI Act's
        Art. 5 emotion-recognition prohibition.
      whyItMatters: >
        Without a formal product scope assessment, Gong faces a regulatory enforcement risk that cannot be mitigated
        through standard DPA or contractual pass-through mechanisms—a product withdrawal scenario is possible.
      diligencePath: >
        Demand Gong's internal EU AI Act product compliance memo; engage external EU counsel to conduct
        an independent Art. 5 scope analysis of Gong's current and roadmap AI features.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR001]

    - type: private-evidence-only
      severity: material
      topic: nrr-and-churn-data
      missingEvidence: >
        Gong's net revenue retention (NRR) rate, gross churn rate, and renewal rates by customer segment (enterprise
        vs. mid-market), which are not publicly disclosed.
      whyItMatters: >
        NRR is the primary indicator of enterprise customer health and renewal risk. Without this data, investor
        assessment of customer concentration and churn exposure is based solely on company-stated growth metrics.
      diligencePath: >
        Request NRR by cohort year and segment; cross-reference with G2 review volume and sentiment trends;
        conduct reference checks with 5+ enterprise accounts.
      relatedQuestionRefs: [QR017, QR023]

    - type: private-evidence-only
      severity: material
      topic: ipo-financial-readiness
      missingEvidence: >
        Gong's current profitability, operating cash flow, burn rate, and remaining cash reserves from the 2021
        Series E ($250M raised)—none of which are publicly disclosed for this private company.
      whyItMatters: >
        IPO readiness assessment requires knowing whether Gong has adequate runway, clean GAAP financials, and
        defensible margin expansion trajectory to withstand public-market scrutiny.
      diligencePath: >
