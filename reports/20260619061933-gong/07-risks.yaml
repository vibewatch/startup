company:
  name: Gong
chapter:
  number: 7
  title: Risks
  summary: >
    Gong faces a constellation of material risks across regulatory compliance (recording-consent and GDPR/EU AI Act exposure), AI model
    quality, platform concentration on AWS, competitive displacement by native CRM vendors (Salesforce and Microsoft), leadership
    key-person dependencies, and a vintage valuation mismatch at $7.25 B from 2021 against current multiples. Most risks are
    manageable at the current scale—Gong's compliance certifications (SOC 2, ISO 27001, ISO 42001) are extensive—but recording-consent
    litigation, EU AI Act emotion-recognition prohibitions, and Salesforce/Microsoft native-embedding strategies are structural and
    merit sustained monitoring. Kill criteria center on ARR growth deceleration below 25%, loss of Salesforce or AWS partnerships,
    regulatory enforcement action in a major market, or a sustained NRR decline below 110%.

sections:
  - id: privacy-regulatory-risk
    title: Privacy, Consent, and Regulatory Compliance Risk
    body: >
      Gong's core product—AI-powered recording and transcription of sales calls—sits at the intersection of two rapidly evolving
      regulatory regimes: US state recording-consent laws and the EU's AI regulatory framework. In the United States, eleven states
      require all-party consent for call recording, including California (CIPA), Illinois (BIPA-adjacent wiretapping provisions),
      Pennsylvania, and Michigan. Gong advises customers to provide disclosure notices and obtain consent, but the legal obligation
      rests with the customer's use of the platform, not with Gong directly. Despite this contractual pass-through, class-action
      litigation risk is non-trivial: plaintiffs have successfully named SaaS vendors as co-defendants when platform features
      facilitate recording without proper consent. The National Law Review has flagged Gong and similar tools as potential targets
      for employer wiretapping liability.


      Under GDPR, Gong operates as a data processor on behalf of its enterprise customers (controllers). Its Data Processing
      Addendum incorporates standard contractual clauses, EU-U.S. Data Privacy Framework certification (also Swiss and UK
      extensions), and specifies that Amazon Web Services and MongoDB are sub-processors with EU-regional deployment options.
      The principal GDPR residual risk is: (1) customers failing to obtain valid legal basis for recording EU prospects or employees,
      which could expose Gong to regulatory scrutiny as the technical enabler; and (2) Art. 9 GDPR concerns if conversation
      analysis inadvertently surfaces special-category data (health, political views disclosed in calls).


      The EU AI Act (Regulation 2024/1689, enforcement phased from February 2025) explicitly prohibits emotion-recognition systems
      in workplace and educational settings (Art. 5). Gong's sentiment analysis and deal-health scoring features are adjacent to
      this prohibition. While Gong's current product focuses on sales-call outcomes, not biometric emotion inferences, regulators
      may apply the prohibition broadly, particularly as Gong's AI models evolve to infer buyer intent and emotional posture from
      vocal and linguistic cues. The ICO's updated guidance on AI and data protection further requires that AI systems demonstrate
      lawful basis, transparency, and explainability for every processing activity. CCPA/CPRA in California requires businesses
      to disclose AI-assisted call analysis to recorded parties—a gap Gong's customers often underestimate. Diligence must confirm
      compliance architecture and insurance coverage for regulatory defense.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
