callouts:
  - calloutType: risk
    title: EU AI Act Emotion-Recognition Prohibition Is a Product Risk
    body: >
      Gong's sentiment-analysis and buyer-intent inference features are potentially in scope of the EU AI Act's
      prohibition on emotion-recognition systems in workplace contexts (Art. 5, effective February 2025). Unlike a
      compliance certification or a DPA clause, this risk cannot be managed away contractually—it requires product-
      level feature scoping or withdrawal from the EU market for affected features. Gong has ISO 42001:2023 AI
      management system certification but has not published a formal EU AI Act product scope assessment. Diligence
      should demand an external legal opinion confirming that Gong's current and roadmap AI features fall outside
      Art. 5 prohibited practices.
    claimRefs:
      - CR004
      - CR005
      - CR006
  - calloutType: risk
    title: Salesforce–Microsoft Dual Threat Is the Primary Structural Risk
    body: >
      The combination of Salesforce Agentforce and Microsoft Copilot for Sales represents the most structurally
      threatening competitive dynamic for Gong. Both vendors are embedding Gong-equivalent recording, transcription,
      and deal intelligence natively into platforms that Gong's customers already license. Unlike startup competitors,
      Salesforce and Microsoft can offer this functionality at near-zero marginal cost to enterprise accounts with
      existing multi-year ELAs. Gong's multi-product Revenue AI OS is the primary defensible moat—but it must be
      demonstrated through customer outcome data (NRR, ARR expansion) rather than marketing claims.
    claimRefs:
      - CR022
      - CR023
      - CR024
      - CR025

