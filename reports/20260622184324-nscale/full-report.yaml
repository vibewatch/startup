      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Microsoft Single-Customer Concentration Is the Highest Investment-Thesis Risk
            body: >
              Microsoft is the anchor tenant across every material Nscale site simultaneously. No alternative anchor
              customer of comparable scale has been publicly identified. If Microsoft's AI infrastructure strategy
              changes—for any reason—it creates simultaneous revenue pipeline, debt covenant, and valuation impairment
              across all geographies. This is an unusually high single-counterparty concentration for any infrastructure
              business of this scale, and the contract terms providing protection (take-or-pay, termination fees,
              step-in rights) are not public.
            calloutType: risk
            claimRefs:
              - CR014
