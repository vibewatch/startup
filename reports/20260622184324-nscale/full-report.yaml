      - number: '5.6'
        title: Trust, Sovereignty, Security, and Compliance
        blocks:
          - type: paragraph
            body: >
              Nscale's security posture is led by CISO Latha Maripuri, formerly of Uber, News Corp, and IBM, overseeing
              cyber, physical, and supply chain security. The company's primary compliance proposition is sovereign AI
              design: all facilities are built with local data residency controls, and customers in the UK and EU can
              contractually confine workloads within jurisdiction. The BT sovereign AI platform is purpose-built for UK
              regulatory, data residency, and security requirements, including healthcare, public services, energy,
              finance, and critical national infrastructure. Nscale's website footer links to a Transparency & Human
              Rights policy. As of June 2026, no public ISO 27001, ISO 42001, SOC 2, or equivalent third-party
              certifications are disclosed on the Nscale website or in press materials — a gap versus Crusoe (ISO
              27001:2022 + ISO 42001:2023) and comparable neocloud peers. The West Virginia Monarch campus adds a
              US-sovereign design, state law protecting local ratepayers from cost pass-through, closed-loop cooling
              with zero municipal water, and enclosed generator setups to limit community noise impact. Planning-related
              risk is material at Loughton: local authority objections could push the timeline further and increase
              cost. Nscale's CISO appointment, sovereign AI design claims, and BT partnership each signal enterprise
              compliance intent, but the absence of published third-party audit reports means independent verification
              of the security posture is not currently possible.
