        title: GPU Compute Hardware Stack and Deployment Roadmap
        blocks:
          - type: paragraph
            body: >
              Nscale's compute stack is built entirely on NVIDIA GPU generations, with each successive generation
              deployed at hyperscale under multi-year Microsoft commitments. The currently deployed generation is NVIDIA
              Blackwell GB300 (GB300 Ultra): approximately 104,000 GPUs committed for the Texas campus and 12,600 for
