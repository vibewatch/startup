      - number: '1.5'
        title: Milestones, Partnerships, and Adverse Context
        blocks:
          - type: paragraph
            body: >
              Nscale's milestone record is densely packed into roughly 30 months from founding to mid-2026. The company
              emerged from Arkon Energy's crypto-mining infrastructure and pivoted entirely to AI workloads, rapidly
              acquiring land, GPUs, and partnerships at a pace uncommon even in the neocloud peer set. The partnership
              ecosystem is anchored by Microsoft (the primary hyperscaler offtaker across Norway, UK, Portugal, and
              Texas), NVIDIA (GPU supplier and recurring equity investor), and Aker ASA (Norwegian industrial
              conglomerate, lead investor in Series B and C, and former JV partner now folded into Nscale equity).
              OpenAI serves as a strategic anchor through Stargate Norway and Stargate UK, with BT, Nokia, Dell, Fortum,
              and Start Campus completing the key partnership ring.

              The adverse context is centred on UK planning. In March 2026 DataCentre Review reported that Nscale had
              become "the latest company to face public backlash" over its Loughton data centre, with Loughton Town
              Council calling for a fresh planning application because the proposed expansion is 50% larger than
              originally approved and raises power grid concerns. Epping Forest District Council holds final decision
              authority but has not yet ruled. The company stated that construction site investigation and permit work
              is under way and that it expects construction to begin in Q2 2026 and the site to be operational in Q2
              2027. Separately, the delay in the Loughton timeline conflicts with Nscale's earlier Q4 2026 target, with
              the company attributing the slip to NVIDIA Vera Rubin 200 technology upgrades; the planning objections
              create a competing risk explanation.

              At the sector level, Edinburgh Council's moratorium on new data centre developments and growing public
              resistance to AI infrastructure across the UK represent systemic risks that could complicate future UK
              site acquisitions. Revenue and financial transparency remain a gap: Nscale has not published ARR, revenue,
              gross margin, or employee headcount figures in any public disclosure as of June 2026.
