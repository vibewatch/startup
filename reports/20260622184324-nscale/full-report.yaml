        title: Exhibits
        blocks:
          - type: callout
            title: Loughton Planning Backlash — Construction and Revenue Schedule at Risk
            body: >
              Loughton Town Council planning officers have demanded a fresh planning application from Nscale following
              proposed expansion of the site (approximately 50% larger than the original outline approval), citing grid
              strain concerns. Nscale has already pushed the operational timeline back to Q2 2027. A new full planning
              application could extend the delay by 12–18 months, putting approximately 23,000 GB300 GPUs contracted to
              Microsoft at risk of further deferral. This is both an execution risk and a near-term revenue risk, as the
              Loughton tranche of the October 2025 Microsoft deal is the UK's largest GPU deployment commitment.
            calloutType: risk
            claimRefs:
              - CI029
              - CI030
              - CI031
              - CI044
          - type: callout
            title: GPU-Backed DDTL Creates Mark-to-Market Collateral Risk
            body: >
              The $1.4B delayed draw term loan is secured against Nscale's GPU fleet. H100 GPU spot market values have
              already compressed by approximately 60–70% from 2023 peaks. If next-generation Rubin/Blackwell deployments
              further depress H100/H200 resale values, the collateral base may fall below covenant LTV thresholds,
              triggering margin calls or accelerated repayment requirements. No public information is available on the
              DDTL's LTV ratio, maintenance covenant, or GPU-value floor, making this risk entirely unquantifiable
              without lender documents.
            calloutType: risk
            claimRefs:
              - CI011
              - CI025
              - CI038
              - CI043
          - type: callout
            title: Microsoft Anchor Customer Provides Multi-Year Revenue Visibility
            body: >
              Microsoft is anchored across every major Nscale geography — Norway, UK, Portugal, Texas, and potentially
              West Virginia — providing multi-year GPU delivery commitments that are the nearest proxy to contracted
              revenue backlog. The disclosed volume (~200,000 GB300 GPUs under the October 2025 deal, plus expansions)
              implies substantial contracted revenue in aggregate, though exact contract values, pricing, and
              take-or-pay terms are not public. The relationship mirrors CoreWeave's use of Microsoft as its primary
              anchor, which underpins CoreWeave's $99.4B revenue backlog.
            calloutType: strength
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI014
              - CI031
          - type: callout
            title: Minimum Diligence Requirements Before Underwriting Nscale
            body: >
              Financial underwriting of Nscale requires at minimum: (1) audited or CPA-reviewed financial statements for
              2024 and 2025; (2) gross margin by segment (GPU infrastructure vs. API/managed services); (3) cash on hand
              and monthly operating burn rate; (4) full DDTL and Norway bank financing credit agreements including
              covenants, LTV requirements, and cross-default clauses; (5) realized pricing per GPU-hr or blended
              contracted rate for the Microsoft deal; (6) GPU utilization and revenue recognition schedule for delivered
              capacity. Without these six items, the capital-raise narrative supports the investment thesis but the
              financial condition of the business cannot be assessed.
