      - number: '3.3'
        title: Capability Comparison, Pricing, and Go-to-Market
        blocks:
          - type: paragraph
            body: >-
              On GPU availability, Nscale's most critical differentiation is its NVIDIA Vera Rubin platform deployment
              commitment for 2027—placing it among the first providers globally and the first European company outside
              Microsoft itself to deploy this architecture. This follows its deployment of NVIDIA GB300 GPUs across its
              Texas, UK, Norway, and Portugal sites, supported by the 200,000-GPU Microsoft contract. CoreWeave
              similarly holds NVIDIA preferred partner status and the Platinum ClusterMAX rating, while Lambda and
              Nebius have more limited documented access to the newest GPU generations.

              On pricing, Lambda publishes the most competitive on-demand rates: H100 at $3.99/GPU-hr and B200 SXM6 at
              $6.69/GPU-hr. Nebius offers H100 at approximately $2.15–$3.85/GPU-hr with reserved and on-demand options
              targeting EU customers. CoreWeave does not publish list pricing; enterprise contracts are negotiated.
              Nscale also does not publish retail GPU-hour pricing, consistent with its anchor-tenant /
              hyperscaler-contract GTM model rather than a self-serve developer cloud. Azure GPU instances (e.g., NDv5
              H100 on-demand ~$3.60/GPU-hr) represent the hyperscaler benchmark, with significant enterprise discount
              programs reducing effective rates.

              Go-to-market strategies diverge sharply. CoreWeave pursues a multi-customer AI-native model, expanding
              enterprise relationships with frontier labs and financial firms. Lambda targets developers and researchers
              at scale, with tens of thousands of self-serve customers. Nscale concentrates its GTM on large-scale
              anchor tenants—primarily Microsoft—and sovereign AI partnerships (BT, OpenAI for Stargate Norway). This
              gives Nscale predictable revenue visibility through contracted delivery, but limits its exposure to the
              broader on-demand GPU cloud market that Lambda and CoreWeave compete for. Crusoe's GTM falls between:
              dedicated campus reservations for AI-native labs, plus a Spark modular factory product with no direct
              Nscale equivalent.
