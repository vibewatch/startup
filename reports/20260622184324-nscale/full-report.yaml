      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Nscale has executed one of the fastest funding trajectories in European AI history. The Series A of $155
              million was announced before January 2025. In September 2025 the company closed a $1.1 billion Series B
              led by Aker ASA, which committed $285 million in cash and in-kind Narvik land assets, acquiring 9.3%
              ownership on a fully diluted basis with a potential earn-out to 12.2%. The Series B round also attracted
              Sandton Capital, Blue Owl, Dell, Fidelity Management and Research, G Squared, Nokia, NVIDIA, Point72, and
              T.Capital; Goldman Sachs acted as exclusive placement agent.

              In October 2025, Nscale raised a $433 million pre-Series C SAFE backed by Blue Owl, Dell, NVIDIA, and
              Nokia. In February 2026 the company secured a $1.4 billion Delayed Draw Term Loan backed by GPUs to
              finance European cluster deployments. On March 9, 2026, the $2 billion Series C closed, led by Aker ASA
              and New York-based 8090 Industries (co-founded by Rayyan Islam), with support from Astra Capital, Citadel,
              Dell, Jane Street, Lenovo, Linden Advisors, Nokia, NVIDIA, and Point72. The official press release states
              the $2 billion figure is "inclusive of the Pre-Series C SAFE," implying net new Series C equity of
              approximately $1.567 billion. Goldman Sachs and JPMorgan acted as joint placement agents, with TechCrunch
              noting their involvement signals possible IPO preparation. The post-money valuation stands at $14.6
              billion.

              In May 2026, ABN AMRO, DNB, Eksfin, Nordea, and SEB committed $790 million in project financing for the
              Narvik data center, plus an accordion feature for a further $790 million. Total disclosed equity is
              approximately $3.7 billion (Series A $155M + Series B $1.1B + pre-C SAFE $433M + Series C $2B), and total
              debt and project financing stands at approximately $2.19 billion (DDTL $1.4B + Norway banking $790M).
              Revenue, ARR, gross margin, and net revenue retention are not publicly disclosed.
