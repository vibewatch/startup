      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Nscale's buyer universe segments into four primary groups. Hyperscaler anchor tenants — principally
              Microsoft — contract long-duration, large-scale GPU clusters under multi-year capacity agreements spanning
              the UK, Norway, Portugal, and the US. Nscale contracted approximately 200,000 NVIDIA GB300 GPUs with
              Microsoft in one of the largest AI infrastructure contracts ever signed. Microsoft's $30 billion UK AI
              infrastructure commitment (2025–2028) confirms the macro demand signal, and Stargate UK
              (OpenAI/Nscale/NVIDIA) adds a second anchor with up to 31,000 GPUs for sovereign workloads. Budget
              ownership at this tier is at board and VP-infrastructure level; contracts are multi-year and denominated
              in hundreds of millions to billions of dollars.

              Enterprise AI teams in regulated industries — finance, healthcare, legal, and defence — form the second
              segment. They require dedicated GPU clusters with compliance postures that shared hyperscaler clouds
              cannot meet: GDPR, FCA/DORA, NHS data governance, and national-security procurement rules mandate
              in-jurisdiction compute. The BT–Nscale partnership directly targets this segment, enabling organizations
              to run AI models in the UK under regulatory, data residency, and security requirements. Government and
              public sector buyers represent a third segment with sovereign data mandates embedded in central government
              policy: the UK AI Action Plan's 20x public compute commitment operationalizes this demand.

              A fourth, developer/research segment accesses Nscale's inference marketplace. Nscale's inference platform
              has scaled 148x as of 2026 with more than 5,000 active users. Analyst commentary confirms neoclouds are
              complementary to hyperscalers: enterprises deploying production AI typically span on-premises, neocloud,
              and hyperscaler simultaneously, making Nscale's sovereign infrastructure additive to — not a replacement
              for — Azure or AWS relationships.
