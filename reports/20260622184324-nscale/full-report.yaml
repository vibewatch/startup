      - number: '6.4'
        title: Retention Dynamics and Evidence Gaps
        blocks:
          - type: paragraph
            body: >
              Nscale has disclosed none of the standard SaaS or infrastructure-as-a-service retention metrics: there is
              no NRR, GRR, logo churn rate, contract renewal rate, or cohort-level data in any public source reviewed.
              This is a material diligence gap for a company building capital-intensive infrastructure whose project
              financing depends on long-term contracted capacity.

              The available proxies suggest a bifurcated retention profile. For Microsoft, the multi-year nature of
              capacity agreements and the escalating GPU commitments across successive quarters imply structural
              retention: Nscale is deploying bespoke infrastructure for Microsoft, and the $14 billion+ deal value means
              switching costs are prohibitive during the construction and early operational phases. However, Nscale has
              not disclosed whether these agreements include minimum take-or-pay provisions, contract durations, or
              cancellation rights — all of which matter materially given the financing commitments behind each campus.

              For BT, the April 2026 announcement is a new customer relationship with no operational tenure. There is no
              retention evidence for BT beyond the announcement itself. The sovereign AI positioning creates some
              institutional stickiness (BT cannot easily move UK government workloads to non-UK-sovereign
              infrastructure), but the commercial terms, SLA commitments, and contract structure are not public.

              For the inference platform, with 5,000+ claimed users, there is no cohort data, no churn disclosure, and
              no evidence of repeat usage at enterprise scale. The inference user base could be skewed toward
              experimental or short-duration users; without retention data it is impossible to distinguish recurring
              enterprise demand from one-time developer trials. Nscale's pricing page lists on-demand GPU pricing, which
              implies low switching costs for inference users relative to capacity anchor tenants.

              A key adverse inference from the OpenAI situation is that customer commitments in this market are
              reversible. OpenAI was publicly announced as an anchor partner for both the Norway and UK Stargate sites,
              yet withdrew from direct infrastructure commitments in both cases. While not a churn event in the
              traditional sense — OpenAI never reached contracted production status — it illustrates that announced AI
              infrastructure partnerships can dissolve before deployment. This risk applies directly to Nscale's
              announced pipeline.
