      - number: '2.5'
        title: Regulatory and Policy Environment
        blocks:
          - type: paragraph
            body: >-
              Two government frameworks directly shape Nscale's addressable market. In the UK, the AI Opportunities
              Action Plan (January 2025) — endorsed by Prime Minister Starmer with all 50 recommendations accepted —
              commits to AI Growth Zones with expedited planning permissions, a twentyfold increase in public compute
              capacity, and a National Data Library. The first AI Growth Zone was designated at Culham, Oxfordshire. The
              concurrent private commitment of £14 billion and 13,250 jobs from Vantage Data Centres, Nscale, and
              Kyndryl validates government demand-stimulation as a real market catalyst. Nscale's $2.5 billion UK
              investment was cited in every government announcement, embedding it as a policy proof-point and creating
              reputational alignment with future government AI procurement decisions.

              At the European level, the EU Cloud and AI Development Act — expected in 2025–2026 — aims to triple data
              center capacity in 5–7 years, directly expanding the EU sovereign AI market. The EU Energy Efficiency
              Directive requires data centers to report energy consumption, water usage, and renewable energy sourcing.
              Global data center electricity demand is projected to more than double to approximately 945 TWh by 2030.
              Norway benefits from some of the lowest- cost renewable electricity in Europe due to hydropower surplus,
              providing Nscale's Narvik and Glomfjord sites with structural energy-cost advantages and enabling 100%
              renewable power sourcing — positioning Nscale favorably under the EU's climate-neutral data center target
              for 2030 and under European enterprise ESG procurement policies.

              Export-control risk exists at the margin: China's AI infrastructure spending declined 8.1% in Q4 2025 due
              to chip-export restrictions, confirming that technology policy can reshape market geography. While export
              controls currently benefit European suppliers like Nscale (less GPU-allocation competition in EMEA), they
              also signal systemic regulatory risk if US technology export policy evolves to restrict non-US AI
              infrastructure operators.
