      - number: '1.4'
        title: Operating Scale and Data Centers
        blocks:
          - type: paragraph
            body: >
              Nscale's operational footprint spans multiple continents. Its first and currently operational site is in
              Glomfjord, Norway, a 60MW renewable-energy-powered data centre. The Narvik (Kvandal) campus is the
              flagship project: announced July 2025 as Stargate Norway in partnership with Aker ASA and OpenAI to target
              100,000 NVIDIA GPUs by end of 2026, the 230MW site has since been deepened with a September 2025 Aker JV
              consolidation and Microsoft taking over as the primary anchor tenant (the OpenAI relationship is still
              active under Stargate UK, but the Narvik offtake transitioned primarily to Microsoft). In April 2026,
              Nscale expanded the Narvik agreement with Microsoft to include an additional 30,000+ NVIDIA Rubin GPUs.

              In the UK, Nscale acquired the Loughton, Essex site in January 2025, planning a 50MW facility (scalable to
              90MW) to house approximately 23,040 NVIDIA GB300 GPUs for Microsoft Azure from Q1 2027. The original Q4
              2026 completion date was revised to Q1 2027, officially attributed to NVIDIA Vera Rubin 200 technology
              upgrades. Planning complications arose in early 2026 when Loughton Town Council officers called for a
              fresh planning application after Nscale proposed a configuration 50% larger than the original outline
              approval from 2024.

              In the US, Nscale leased a Texas site from Ionic Digital for approximately 104,000 NVIDIA GB300 GPUs in a
              ~240MW hyperscale campus serving Microsoft from Q3 2026. At GTC 2026 (March 16, 2026), Nscale acquired the
              Monarch Compute Campus in West Virginia (up to 2,250 acres in Mason County, America's first
              state-certified AI microgrid, scalable to over 8GW) via the purchase of AIPCorp, and signed an LOI with
              Microsoft for 1.35GW of AI compute. Portugal's Start Campus in Sines holds 12,600 NVIDIA Blackwell Ultra
              GPUs (from Q1 2026), with an expanded agreement for 66,000+ NVIDIA Vera Rubin NVL72 GPUs added in May 2026
              (€695M+ combined investment). In April 2026, a BT partnership added 14MW across three UK BT network sites.
              Nscale has also secured a site development agreement with Fortum for a future data centre in Harjavalta,
              Finland. Additional partner-run sites are listed in Keflavik (Iceland), Stavanger, Oslo, Blönduós
              (Norway), Slough, and North Carolina. Nscale's total current capacity exceeds 1GW and its global GPU
              pipeline targets 300,000+ NVIDIA units.
