  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The track recommendation flows from strong Microsoft anchor proof and institutional capital meeting a stretched
      $14.6B pre-revenue mark and absent financial disclosure, with IPO or revenue confirmation as the primary upgrade
      trigger.
    data:
      nodes:
        - id: microsoft-anchor
          label: Microsoft 200K+ GPU anchor
          detail: >-
            Oct 2025 deal plus April and May 2026 Rubin expansions make Microsoft the primary demand anchor for
            near-term GPU capacity.
          tone: positive
        - id: institutional-capital
          label: $5.9B capital stack assembled
          detail: >-
            Roughly $3.7B equity plus about $2.19B debt from high-profile investors and lenders validates Nscale's
            ability to finance hyperscale buildout.
          tone: positive
        - id: power-moat
          label: Norwegian hydro and EU sovereign moat
          detail: >-
            Narvik and related Norway assets provide renewable-power positioning at a time when power availability has
            become the sector bottleneck.
          tone: positive
        - id: no-revenue
          label: Zero revenue or ARR disclosure
          detail: No audited revenue, ARR, gross margin, or EBITDA figures are public as of June 22, 2026.
          tone: warning
        - id: planning-risk
          label: Loughton planning objection
          detail: >-
            The UK site faces a fresh planning process and revised timing to Q2 2027, creating an execution overhang on
            one Microsoft location.
          tone: warning
        - id: leverage
          label: $2.19B drawn debt against pre-revenue base
          detail: GPU-backed and project-finance facilities magnify downside if GPU deployment or utilization slips.
          tone: warning
        - id: valuation-mark
          label: $14.6B mark requires ~$3.2B ARR
          detail: >-
            Using CoreWeave's IPO benchmark of roughly 4.6x EV/ARR, Nscale needs about $3.2B of ARR to support the
            current valuation.
          tone: warning
        - id: recommendation
          label: TRACK — monitor for IPO and revenue confirmation
          detail: >-
            Strategic quality is high, but underwriting conviction requires audited ARR, margin disclosure, and planning
            resolution.
          tone: neutral
      edges:
        - from: microsoft-anchor
          to: valuation-mark
          label: supports premium
        - from: institutional-capital
          to: valuation-mark
          label: validates scale
        - from: power-moat
          to: valuation-mark
          label: justifies moat premium
        - from: no-revenue
          to: recommendation
          label: blocks buy conviction
        - from: planning-risk
          to: recommendation
          label: creates execution overhang
        - from: leverage
          to: recommendation
          label: amplifies downside risk
        - from: valuation-mark
          to: recommendation
          label: stretched vs public comps
    approximationNotes: >-
      Flow captures the recommendation logic rather than a quantitative model and reflects the public evidence base as
