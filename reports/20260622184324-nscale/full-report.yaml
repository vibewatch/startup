        - >-
          Inference prefers lower-density distributed sites — Nscale's modular format advantage; inference platform
          scaled 148x confirming developer adoption
        - Confirm revenue split between training/fine-tuning and inference workloads; compare margin by workload type
      - - UK and EU sovereign AI policy mandates
        - Positive
        - 2025–2028 (policy-driven)
        - >-
          UK AI Action Plan and EU Cloud and AI Development Act create structural demand for sovereign-grade providers;
          Nscale embedded as government-endorsed infrastructure anchor
        - >-
