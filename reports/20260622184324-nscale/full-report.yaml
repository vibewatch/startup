      - number: '6.2'
        title: Named Customer Deployments and Evidence Quality
        blocks:
          - type: paragraph
            body: >
              Microsoft's commitment is the best-evidenced customer relationship Nscale has disclosed. The October 2025
              press release — countersigned with a Microsoft executive quote from Jon Tinter, President of Business
              Development and Ventures — confirms approximately 200,000 NVIDIA GB300 GPUs across four Nscale sites, with
              Dell Technologies as the hardware integrator. The cumulative Microsoft GPU commitments total at least
              282,000 GPUs across all announced agreements (200,000 GB300s from October 2025, 30,000+ Rubin GPUs in
              Norway from April 2026, and 66,000+ Rubin GPUs in Portugal from May 2026), and the West Virginia LOI adds
              a further 1.35 GW pipeline. The deal value has been independently estimated at approximately $14 billion
              (The Next Web, April 2026). Microsoft is deploying compute at the Norway Narvik campus, Portugal Start
              Campus, UK Loughton campus, and Texas site, all under Nscale's managed AI infrastructure services.

              BT Group is the second named anchor, confirmed via both a joint press release with BT Business CEO Jon
              James quoted explicitly and an independent BT newsroom announcement published on April 23, 2026. BT will
              provide connectivity infrastructure; Nscale will build modular NVIDIA-powered AI data centres at three
              undisclosed BT network exchange sites. The use cases span healthcare, finance, energy, and public services
              under UK data residency requirements. The BT CEO's direct quote — "The development of AI and data centre
              infrastructure is key to unlocking economic growth in the UK" — constitutes the strongest customer-level
              public endorsement in Nscale's disclosed customer roster.

              OpenAI's role has materially changed. Originally the primary offtaker for Stargate Norway (announced July
              2025 as targeting 100,000 GPUs by end 2026), OpenAI subsequently pulled out of the Norway deal; Microsoft
              replaced it as anchor tenant. OpenAI also paused its UK Stargate programme (announced September 2025 with
              Nscale and Nvidia at sites in North East England: ~8,000 GPUs scalable to 31,000), citing UK electricity
              costs four times higher than the US and unresolved copyright regulations. These withdrawals are adverse to
              Nscale's customer quality narrative: OpenAI is no longer a directly contracted committed customer at any
              Nscale site, though Microsoft may provide Nscale-hosted compute to OpenAI indirectly.

              Nscale's inference platform claims 5,000+ users and 148× scaling (from the Vera Rubin press release), but
              no independent source confirms either figure. No enterprise customers in the inference segment are named
              publicly. The platform lists capabilities including Inference Endpoints, Managed Slurm, Kubernetes, and
              bare metal, positioning it for developer and enterprise ML workloads. The claim that Nscale is "a top
              provider on public inference marketplaces" is also unverified in third-party sources.
