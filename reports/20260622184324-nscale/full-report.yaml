          - type: callout
            title: Loughton Planning Dispute Is the Most Time-Critical Near-Term Blocker
            body: >
              The Loughton Town Council's demand for a fresh planning application, if sustained by Epping Forest
              District Council, could delay or eliminate Nscale's UK flagship site. This is the only Nscale risk with a
              near-term binary outcome: either the revised application is approved in 2026-2027, or the UK sovereign AI
              supercomputer commitment collapses. The UK government's AI Opportunities Action Plan explicitly names
              Nscale; a planning failure creates political as well as financial consequences.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
          - type: callout
            title: NVIDIA Investor Status Mitigates but Does Not Eliminate Supply Dependency
            body: >
              NVIDIA's equity participation in both Series B and Series C creates a strong alignment incentive for
              preferred GPU allocation to Nscale. However, NVIDIA's DGX Cloud product line and its relationships with
              hyperscalers (AWS, Azure, GCP) create competing allocation priorities that no equity investment can
              contractually override. The investor relationship is a genuine risk-reducing factor, but should not be
              treated as an unconditional supply guarantee in diligence.
            calloutType: insight
            claimRefs:
              - CR021
              - CR022
              - CR023
          - type: callout
            title: Five Priority Diligence Asks Before Committing Capital
            body: >
              (1) Obtain current EFDC planning status and decision timeline for Loughton, plus Microsoft UK contract
              delay-and-termination terms. (2) Request Microsoft take-or-pay provisions and minimum volume commitments
              across all four active sites. (3) Obtain DDTL covenant terms, GPU collateral coverage ratio, and
              milestone-based acceleration triggers. (4) Confirm NSI Act legal review status and any Investment Security
              Unit clearance for foreign investor positions. (5) Request organisational chart and confirm CFO and
              General Counsel appointments, given IPO stated as possible in 2026.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR014
              - CR015
              - CR026
              - CR007
              - CR017
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context and financing stack
        blocks:
          - type: paragraph
            body: >-
              Nscale's valuation case begins with extraordinary scale in capital formation and customer validation
              rather than with disclosed financial output. The company raised a $155 million Series A in January 2025, a
              $1.1 billion Series B in September 2025, and a $2 billion Series C in March 2026 at a $14.6 billion
              post-money valuation, while public reporting indicates the Series C total included a $433 million
              pre-Series C SAFE closed in October 2025. That equity stack sits alongside a $1.4 billion GPU-backed
              delayed draw term loan and a $790 million Norwegian bank facility for Narvik, bringing the total known
              capital base to roughly $5.9 billion. Demand evidence is unusually strong for a company with no public
              financial disclosures: Microsoft is the anchor for approximately 212,000 or more committed GPUs, OpenAI is
              the initial offtaker for Stargate Norway, and BT provides a UK enterprise distribution path. The market
              backdrop is also favorable, with IDC projecting AI infrastructure spending past $1 trillion by 2029 and
              Bain arguing in June 2026 that power availability has become the critical bottleneck. The valuation debate
              therefore is not whether Nscale addresses a real market, but whether the current mark already prices in a
              revenue ramp that the public record still cannot verify.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV016
              - CV017
              - CV018
              - CV019
              - CV029
              - CV030
              - CV031
              - CV032
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV009
              - CV011
              - CV012
              - CV022
              - CV023
      - number: '8.2'
        title: Comparable analysis and public-market anchors
        blocks:
          - type: paragraph
            body: >-
              The most useful external anchor for Nscale is CoreWeave, because it combines NVIDIA alignment, GPU cloud
              exposure, hyperscaler-style customer concentration, and very large capital requirements. CoreWeave's March
              2025 IPO valuation of approximately $23 billion on roughly $5 billion of annualized revenue implied about
              4.6x EV/ARR, and by Q1 2026 CoreWeave reported $2.078 billion of quarterly revenue plus a $99.4 billion
              backlog, demonstrating how large a real revenue denominator can become once GPU capacity is accepted and
              monetized. Applied to Nscale's $14.6 billion mark, that benchmark implies a required ARR base of roughly
              $3.2 billion. Nebius, Lambda, and Crusoe provide secondary context: Nebius is the nearest public European
              AI cloud benchmark, while Lambda and Crusoe show how private neocloud and power-first infrastructure
              businesses have been financed below or around Nscale's mark, generally with more modest public evidence on
              revenue support. The comparable set therefore does not prove that Nscale is impossible to grow into, but
              it does show that the current price already assumes Nscale will translate GPU commitments into very large
              revenue quickly, without the public disclosures that investors would normally require to verify that
              thesis.
            claimRefs:
              - CV009
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
          - type: table
            tableRef: TV004
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
      - number: '8.3'
        title: Bull, base, and bear valuation ranges
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is unavoidable because the valuation denominator is not public. The bull case assumes
              Nscale can confirm more than $1 billion of ARR in the second half of 2026, keep Microsoft deployments on
              schedule, add at least one additional anchor beyond Microsoft, and preserve a premium multiple through an
              IPO window in 2026 or 2027. In that path, a valuation range of roughly $20-25 billion is supportable and
              the current mark can work. The base case is more conservative and more consistent with a partially
              delivered infrastructure pipeline: $500-750 million of ARR by the end of 2026, continued execution in
              Norway and Portugal, and a delayed but still viable IPO pathway in 2027-2028, which points to
              approximately $8-12 billion of fair value. The bear case combines the risks already visible in the
              evidence base: planning delays at Loughton, slower revenue conversion from contracted GPU capacity, and
              refinancing pressure from the $2.19 billion debt stack. Under that combination, fair value can compress
              into the $3-5 billion range and force a down-round discussion. The asymmetry therefore remains unfavorable
              at the current entry price.
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV013
              - CV014
              - CV044
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV039
              - CV040
              - CV041
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV009
      - number: '8.4'
        title: Recommendation, thesis balance, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The recommended posture is track, not buy. Nscale has built a serious infrastructure narrative: Microsoft
              anchor demand, Norwegian hydro-powered capacity, elite investors, Goldman Sachs and JPMorgan
              placement-agent involvement, and a reconstituted board with Sheryl Sandberg, Susan Decker, and Nick Clegg
              all support the idea that this company may be preparing for a public listing and could become a meaningful
              European AI infrastructure champion. But the anti-thesis is still decisive at the current price. No
              revenue, ARR, margin, EBITDA, or cash balance has been made public. Customer concentration appears heavily
              skewed to Microsoft. Loughton planning remains unresolved, and the debt layer introduces leverage risk
              before the public record shows a matching revenue base. For an investment committee, the practical next
              steps are straightforward: require audited revenue and gross margin disclosure, understand covenant terms
              and collateral mechanics on the debt stack, confirm customer concentration and backlog by contract, and
              monitor whether an IPO filing or equivalent private disclosure provides the financial denominator that the
              current valuation still lacks. Until then, Nscale deserves close tracking but not fresh underwriting at
              $14.6 billion.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV021
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
