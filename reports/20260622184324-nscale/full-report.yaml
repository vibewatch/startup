      - number: '2.4'
        title: Growth Drivers and Market Constraints
        blocks:
          - type: paragraph
            body: >-
              The primary growth driver is sustained AI compute demand from scaling laws: training compute grows
              superlinearly while inference demand grows multiplicatively with model adoption. CoreWeave's nearly $100
              billion revenue backlog (Q1 2026) and Lambda's $1.5 billion Series E (November 2025) confirm that a rapid
              supply response has not erased the demand surplus. Bain's June 2026 data center forecast confirms
              inference is now the center of gravity, with test-time compute reshaping data center architecture toward
              distributed, lower-density sites — a format Nscale's modular strategy explicitly targets.

              Sovereign AI policy mandates are a demand-side structural accelerator: the UK AI Opportunities Action Plan
              commits to a 20x increase in public compute capacity; the EU Cloud and AI Development Act aims to triple
              EU data center capacity in 5–7 years; and Microsoft's $30 billion UK investment crowds in allied
              infrastructure capital. Nscale's role as a preferred infrastructure partner to Microsoft, OpenAI, and
              NVIDIA makes it a direct beneficiary of these policy-driven investment cycles. Norway's 100% renewable
              hydropower footprint provides a structural energy-cost advantage for Nscale's Narvik and Glomfjord sites,
              supporting competitive pricing for long-duration contracts.

              Power grid and planning constraints are the principal countervailing forces. Grid connection queues range
              3–10 years in advanced economies; transmission line construction takes 4–8 years. Nscale's Loughton site
              has faced planning scrutiny: Loughton Town Council called for a fresh planning application citing a 50%
              scope increase and power grid impact, pushing the operational date to Q2 2027. Edinburgh Council proposed
              a moratorium on new data center developments — a leading indicator of broader national resistance.
              Microsoft concentration is a revenue-risk dimension: Microsoft accounts for the majority of Nscale's
              announced contracted GPU capacity across all four geographies, with no disclosed secondary anchor tenant
              to offset this dependency.
