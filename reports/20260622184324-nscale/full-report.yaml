  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Planning, Regulatory, and Legal Risks
        blocks:
          - type: paragraph
            body: >
              Nscale's most immediate and well-evidenced regulatory risk is the UK planning dispute for its Loughton,
              Essex data centre. Datacentre Review reported in March 2026 that Loughton Town Council planning officers
              called for a completely fresh planning application, citing proposed changes by Nscale that are
              approximately 50% larger than the originally approved scheme, with the additional capacity requiring more
              cooling and more energy. The final decision rests with Epping Forest District Council, not Loughton Town
              Council, but the council's formal objection introduces procedural delay that Nscale itself acknowledged by
              pushing the Loughton completion date to Q2 2027—a slip from an original 2026 target framed publicly as a
              technology upgrade decision. A full planning rejection would eliminate the primary site for the UK's
              largest planned sovereign AI supercomputer and trigger a major reset on the Microsoft and UK government
              commitments that have been publicly tied to the Loughton campus.

              Beyond Loughton, the broader UK and EU regulatory environment creates material structural obligations. The
              UK National Security and Investment Act 2021 designates data infrastructure as a notifiable acquisition
              sector; Nscale has received material foreign investment (Aker ASA, Citadel, 8090 Industries, NVIDIA,
              Lenovo) without any disclosed NSI Act notification, creating latent exposure if a mandatory notification
              is triggered retroactively or if Nscale pursues UK government AI contracts requiring security clearance.
              Across its EU operations, EU Regulation 2024/1689 (EU AI Act, in force since August 2024) applies to AI
              system providers and operators; Nscale's full-stack positioning—GPU cluster, orchestration software,
              inference endpoints, fine-tuning services—means it likely falls under GPAI model obligations and
              transparency requirements as it expands its AI services layer. The EU Energy Efficiency Directive (2023)
              requires Nscale's Norwegian and Portuguese data centres to report annually on energy consumption, water
              use, and renewable energy utilisation, creating compliance overhead and reputational exposure if reporting
              surfaces performance gaps against its renewable energy claims.

              Companies House records confirm that Nscale Global Holdings Limited was incorporated on 29 May 2024—fewer
              than 25 months old as of the research date—and show at least four secured charges registered in 2025-2026,
              covering IP and other assets, in favour of Sandton Capital, Macquarie Bank (satisfied May 2026), and AF
              Realizations Sàrl. This pattern of secured bridge lending against IP and the subsequent discharge after
              each major equity round is consistent with pre-round bridge financing, but it also reflects that the
              entity's core IP has been pledged multiple times within a very short operating history. Nscale Limited,
              the UK operating entity, was incorporated as recently as 22 December 2025, immediately before the Series C
              raise. No active litigation, sanctions, or enforcement actions have been identified in public records.
