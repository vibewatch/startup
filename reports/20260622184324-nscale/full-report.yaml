      - number: '7.2'
        title: Customer Concentration and Microsoft Dependency
        blocks:
          - type: paragraph
            body: >
              Microsoft is Nscale's sole publicly confirmed major anchor tenant across every material site in its global
              portfolio. The October 2025 expanded partnership committed approximately 200,000 NVIDIA GB300 GPUs across
              four sites: the UK Loughton campus (~23,000 GB300s), the Norway Narvik campus (~52,000 GB300s,
              subsequently expanded with 30,000+ Rubin GPUs in April 2026), the Portugal Sines campus (~12,600 GB300s,
              expanded to 66,000+ Rubin GPUs in May 2026), and the Texas campus (~104,000 GB300s, ~240 MW). The March
              2026 West Virginia Monarch Campus announcement added a letter of intent for 1.35 GW of NVIDIA Vera Rubin
              NVL72 capacity, beginning late 2027. Microsoft is described as the customer on every major site; no
              alternative anchor tenant of comparable scale has been publicly identified.

              This concentration is unusual even by neocloud standards. CoreWeave, the closest public comparable,
              reported $2.08B in Q1 2026 revenue but disclosed no comparable single-customer concentration at the
              individual site level, and its backlog of nearly $100B is diversified across multiple enterprise and
              hyperscaler customers. Nscale's concentration means any change in Microsoft's AI infrastructure strategy
              simultaneously affects UK, Norway, Portugal, Texas, and West Virginia positions with no fallback anchor.
              The Norway Narvik campus originally had OpenAI as an intended customer under the Stargate Norway
              framework; Microsoft stepped in as the primary offtaker, suggesting Nscale's revenue pipeline depends on
              Microsoft sustaining all current commitments.

              The West Virginia LOI is explicitly a letter of intent, not a binding definitive agreement; the contract
              terms, delivery schedule, GPU specifics, and payment obligations are not publicly disclosed. The UK
              Loughton contract terms and Microsoft's take-or-pay provisions are also undisclosed. CEO Josh Payne told
              The New York Times that Nscale might IPO "as early as this year" (2026), introducing IPO execution risk
              alongside the delivery backlog. If Microsoft's AI capex plans were to soften due to AI demand contraction,
              competitive dynamics, or internal strategy changes, Nscale's entire revenue pipeline and debt service
              capacity would be simultaneously impaired, with no identified replacement customer pipeline of comparable
              scale.
