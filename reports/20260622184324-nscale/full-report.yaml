      - number: '5.3'
        title: Software Platform and API Architecture
        blocks:
          - type: paragraph
            body: >
              Nscale's software stack sits between the physical GPU cluster and the application layer, providing
              orchestration, scheduling, storage, networking, observability, and inference primitives. The AI Services
              tier (Inference Endpoints, Prompt Workbench, Fine-tuning) is the highest-margin, easiest-to-consume
              surface. Inference Endpoints expose popular open-weight LLMs as REST APIs without requiring customers to
              manage infrastructure; Fine-tuning uses serverless, API-driven pipelines; and Prompt Workbench provides
              versioned prompts and real-time feedback. Underneath, the Platform Services tier includes Managed Slurm
              (NVIDIA Slinky — an HPC-grade batch scheduler that runs Slurm on Kubernetes, tuned for large-scale GPU
              workloads), NKS (GPU-aware scheduling, seamless autoscaling, enterprise security, under-two-minute
              provisioning), and Instances (bare metal and VMs with prebuilt AI images and optional VPC isolation). The
              Infrastructure Services tier provides Compute (raw bare metal / VMs), Networking (RDMA/InfiniBand/NVLink
              fabrics, multi-rack topology), and Storage (parallel, AI-optimised, GPU-tuned distributed file systems
              with low-latency design). Fleet Operations — Control Center, Observability, and Radar API — form a unified
              lifecycle manager that automates provisioning, health checks, and capacity planning. The nscaledev GitHub
              organisation hosts open-source platform components including a fork of pydantic-ai (2,280 GitHub stars,
              MIT license, actively updated as of June 2026) and uni-kubernetes, uni-compute, uni-region, uni-core, and
              uni-identity repos, demonstrating public engineering investment in the orchestration and cloud-management
              layer. Nscale is a HuggingFace verified Inference Provider with approximately 2.59 M monthly requests,
              providing an independent signal of inference platform scale and developer adoption.
