          indicator for other councils
        - >-
          Confirm planning status for all UK and EU sites; request planning risk register; obtain contingency capacity
          plan if Loughton delayed beyond Q2 2027
      - - Microsoft customer concentration
        - Negative (structural risk)
        - Ongoing
        - >-
