chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Nscale describes itself as "the engine of superintelligence" and "the hyperscaler engineered for AI." The
              company is headquartered in London, UK, with registered offices at Level 5, 16 New Burlington Place,
              London W1S 2HX (operating entity) and C/O Zedra Booths Hall, Booths Park 3, Chelford Road, Knutsford,
              Cheshire WA16 8GS (holding company). CNBC reported in September 2025 that Nscale was spun out from Arkon
              Energy, an Australian cryptocurrency mining firm, in 2023; Data Center Knowledge placed the emergence in
              2024, creating a minor ambiguity that aligns with the UK holding company (Nscale Global Holdings Limited,
              company no. 15749408) being incorporated on 29 May 2024. The operating entity Nscale Limited (company no.
              16925886) was incorporated on 22 December 2025.

              The business model is vertically integrated: Nscale owns and operates the full stack from energy sourcing
              and greenfield data centre design and construction through GPU compute and networking, orchestration
              software, and a managed AI cloud platform. Revenue is generated through cloud compute subscriptions and
              on-demand GPU rental (Inference Endpoints, Managed Slurm, Kubernetes, Instances), long-term capacity
              agreements with hyperscalers (primarily Microsoft), and sovereign AI deployments for enterprise and
              government customers. The company exploits cheap renewable energy — particularly hydropower in Norway — to
              offer GPU compute at competitive cost while meeting European data residency requirements. As of early
              2026, Nscale's inference platform had scaled 148x and served more than 5,000 users, though this figure has
              not been independently corroborated.
