      - number: '4.3'
        title: Capital Structure and Financing Dependency
        blocks:
          - type: paragraph
            body: >
              Nscale has assembled a multi-layered capital structure characteristic of large-scale data center project
              developers. On the equity side, the $1.1B Series B (September 2025, led by Aker ASA with NVIDIA, Nokia,
              Dell, Fidelity, Blue Owl, G Squared, and Point72) was followed by a $2B Series C in March 2026, the
              largest equity raise in European history per the company, valuing Nscale at $14.6B. The Series C included
              a $433M pre-Series C SAFE closed in October 2025 (backed by Blue Owl, Dell, Nvidia, Nokia), with the
              balance raised at closing. Aker committed $285M in the Series B for 9.3% fully diluted ownership, and the
              Aker-Nscale joint venture for Norway was rolled fully into Nscale as part of the Series C. Goldman Sachs
              and J.P. Morgan served as joint placement agents for the Series C, and CEO Josh Payne told the New York
              Times in March 2026 that an IPO was possible "as early as this year."

              On the debt side, Nscale closed a $1.4 billion delayed draw term loan (DDTL) in February 2026 backed by
