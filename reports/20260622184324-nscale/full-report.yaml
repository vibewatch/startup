    title: Sovereign AI Cloud Market Sizing Pyramid (TAM → SAM → SOM)
    type: pyramid
    layout: standard
    summary: >-
      Global AI infrastructure TAM ($318B in 2025; $1T+ by 2029) narrows to a European sovereign AI cloud SAM of
      approximately $3–8B by 2030, bounded by Nscale's contracted capacity, sovereign data-residency requirements, and
      current policy-driven demand.
    data:
      nodes:
        - label: 'Global AI Infrastructure TAM: $1T+ by 2029'
          detail: >-
            IDC: $318B FY 2025 actual (+108% YoY); $487B 2026 forecast; >$1T by 2029 at ~31% CAGR. Includes servers,
            networking, cooling, power worldwide.
          tone: neutral
        - label: 'Global GPU Cloud Rental Market: ~$30–50B+ est. annual run-rate by 2026'
          detail: >-
            Derived: CoreWeave $2.1B Q1 2026 revenue annualises to ~$8.3B. Full neocloud market (CoreWeave, Lambda,
            Nscale, Nebius and peers) estimated $30–50B+ annual run-rate by end of 2026.
          tone: neutral
        - label: 'European AI Infrastructure Spend: ~$20–38B in 2025'
          detail: >-
            Analyst estimate: 7–12% of IDC global AI infra spend; supported by Microsoft $30B UK commitment and EU Cloud
            and AI Development Act intent to triple EU capacity in 5–7 years.
          tone: positive
        - label: 'Nscale SAM (European sovereign-grade GPU cloud): ~$3–8B by 2030'
          detail: >-
            Bounded by Nscale's contracted GPU pipeline (~200,000 GPUs to Microsoft; global 300,000-GPU plan),
            sovereign-grade focus, and construction timeline constraints.
          tone: positive
    approximationNotes: >-
      SAM is an analyst construct derived from Nscale's disclosed contracted commitments and IDC regional data; no
      primary European sovereign GPU cloud rental study was found. TAM and GPU cloud rental layers are directionally
      consistent with IDC and CoreWeave public data but differ in methodology (capex vs. rental revenue). Layers are not
      additive.
