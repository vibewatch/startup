  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer Service Workflow and Full-Stack Platform
        blocks:
          - type: paragraph
            body: >
              Nscale markets itself as a vertically integrated AI cloud, meaning a customer can purchase everything from
              raw GPU bare metal through to serverless inference without leaving the platform. The customer journey
              begins at the infrastructure tier — GPU compute accessible as bare-metal nodes, virtual machines, or
              orchestrated clusters — and extends up through AI-native managed services. Inference Endpoints provide a
              serverless LLM API that allows customers to call a model without provisioning or managing servers;
              Fine-tuning allows customers to adapt open-source models to their domain via an API-driven pipeline; and
              Prompt Workbench offers a browser-based interface for rapid prompt iteration and real-time model feedback.
              For customers running large-scale training or batch jobs, Managed Slurm (using NVIDIA's Slinky scheduler
              running Slurm on Kubernetes) and Nscale Kubernetes Service (NKS) handle orchestration, with NKS
              provisioning isolated GPU-aware clusters in under two minutes. Instances (bare metal or VMs) support
              customers requiring maximum GPU throughput. Fleet Operations tools — Control Center for lifecycle
              management, Observability for cross-stack telemetry, and Radar API for real-time GPU availability and
              maintenance notices — complete the platform. Nscale's inference service has grown 148× and serves more
              than 5,000 users as of its Vera Rubin announcement in 2026. HuggingFace lists Nscale as a verified
              Inference Provider with approximately 2.59 million monthly requests, providing an independent read on
              developer adoption at platform scale. The platform is designed to reduce time-to-first-token and to let
              customers move from proof-of-concept to production without rebuilding infrastructure.
            claimRefs:
