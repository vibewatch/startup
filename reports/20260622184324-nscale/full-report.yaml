          policy tailwind from Microsoft/OpenAI anchor tenants
      - - Nordic hydropower energy-cost advantage
        - Positive (structural)
        - Ongoing
        - >-
          Narvik and Glomfjord sites leverage below-average EU electricity prices; 100% renewable sourcing; EU
          sustainability disclosure compliance advantage
        - >-
          Request LCOE breakdowns for Norway vs. UK sites; verify renewable energy share per campus; compare to UK
          National Grid pricing
      - - Power grid lead times and planning constraints
