  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Overview and Segmentation
        blocks:
          - type: paragraph
            body: >
              Nscale serves three identifiable customer segments. First, hyperscaler capacity anchors — primarily
              Microsoft — that commit multi-hundred-megawatt GPU deployments under multi-year infrastructure agreements
              covering specific Nscale campuses. Second, sovereign AI institutional customers — BT Group and,
              implicitly, UK and European public-sector bodies — that require compute under national data residency and
              regulatory compliance frameworks. Third, inference cloud users — over 5,000 accounts on Nscale's inference
              platform (company-claimed, 148× growth unverified) — consisting of AI developers, startups, and
              enterprises running training, fine-tuning, and inference workloads on Nscale's managed GPU cloud.

              Microsoft is the overwhelming revenue anchor. Across confirmed agreements signed between September 2025
              and May 2026, Microsoft has contracted delivery of approximately 200,000 NVIDIA GB300 GPUs plus over
              96,000 NVIDIA Rubin GPUs (Norway expansion and Portugal expansion), representing what Nscale calls "one of
              the largest AI infrastructure contracts ever signed." The deal spans four countries (UK, Norway, Portugal,
              US) and two continents, and includes an additional LOI for 1.35 GW of West Virginia capacity. No second
              customer approaches this scale. Nscale's inference cloud provides geographic and customer-type
              diversification, but there is no evidence its aggregate revenue approaches the hyperscaler capacity
              contracts.

              BT Group entered the customer roster in April 2026 as a sovereign AI partner: Nscale will build 14 MW
              across three existing BT network exchange sites, offering UK-controlled compute with BT's nationwide fibre
              connectivity as the backbone. The BT relationship is strategically important because it aligns Nscale with
              UK government AI policy, opens public-sector procurement channels, and provides a reference enterprise
              customer beyond the Microsoft relationship. However, 14 MW is modest relative to the 50–240 MW campus
              scale of the Microsoft deployments.

              Nscale self-identifies as serving telecommunications, life sciences, financial services, and the public
              sector through its inference and sovereign cloud platforms. No independent verification of customer names
              within these verticals beyond Microsoft and BT exists in public sources reviewed.
