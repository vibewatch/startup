      - number: '7.4'
        title: Financial Structure and Capital Intensity Risks
        blocks:
          - type: paragraph
            body: >
              Nscale has assembled a complex multi-tranche capital structure across a very young holding entity
              (incorporated May 2024) with no publicly disclosed revenue, gross margin, or profitability data. The $1.4B
              Delayed Draw Term Loan secured in February 2026 uses GPU clusters as collateral; the $790M Nordic project
              financing for the Narvik campus (ABN AMRO, DNB, Eksfin, Nordea, SEB) closed in May 2026 with a further
              $790M uncommitted accordion feature; and the Portugal site requires €695M+ in additional capital
              commitments. The West Virginia Monarch campus involves GW-scale construction costs not yet quantified in
              public filings. The cumulative committed capital substantially exceeds the $3.1B raised in equity (Series
              B + C combined) and requires sustained delivery of contracted capacity and revenue generation to service
              debt obligations.

              The GPU-backed DDTL creates a structural vulnerability: GPU hardware depreciates rapidly and spot prices
              have demonstrated significant downward compression, with H100 class compute declining from approximately
              $8/hr in 2023 to $2-3/hr by 2025. If GPU asset values decline materially—as has occurred for prior
              generations—the collateral value backing the DDTL may be impaired. CoreWeave's publicly reported Q1 2026
              financials show that at $2.08B quarterly revenue, the leading neocloud still operates at a loss due to
              depreciation and interest expense; Nscale's leverage without disclosed revenue creates a structural
              opacity risk that makes it impossible for investors to assess debt service coverage ratios independently.

              Companies House records confirm a pattern of short-dated bridge lending (Sandton Capital, Macquarie Bank,
              AF Realizations Sàrl) against IP and assets, with charges discharged after each equity round. The
              Macquarie charge (registered June 2025) was satisfied in May 2026, consistent with the Series C raise. The
              rapid sequential charging and discharging of the company's core IP assets reflects high financing velocity
              but also confirms that the entity has been near-continuously pledging its principal assets as collateral
              since its first months of existence. No audited accounts have been filed at Companies House as of June
              2026, depriving external stakeholders of any independent financial verification.
