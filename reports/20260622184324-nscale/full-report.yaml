  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >
              Nscale's business model is GPU compute-as-a-service combined with long-term hyperscale infrastructure
              capacity delivery. Customers receive access to NVIDIA GPU clusters for AI training, fine-tuning, and
              inference — billed on a GPU-hour or reserved-capacity basis — supplemented by managed networking, storage,
              and orchestration software that Nscale owns end-to-end in a vertically integrated stack. The company does
              not operate a public self-service cloud with published pricing; instead, the dominant commercial channel
              is direct enterprise and government contracts, with Microsoft as the sole publicly named anchor customer.

              The Microsoft relationship is the financial spine of Nscale's near-term revenue profile. The October 2025
              deal covers approximately 200,000 NVIDIA GB300 GPUs across Texas (~104,000 GPUs, Q3 2026), Portugal
              (~12,600 GPUs, Q1 2026), Norway (~52,000 GPUs), and Loughton UK (~23,000 GPUs, Q1 2027 delayed to Q2
              2027). A March 2026 LOI extends the relationship to a potential 1.35 GW at the West Virginia Monarch
              campus from late 2027. The April 2026 Norway expansion adds 30,000+ Nvidia Rubin GPUs, and a post-Q1 2026
              Portugal expansion added 66,000+ Rubin GPUs for a second 200 MW building at Start Campus Sines.

              Revenue recognition for infrastructure capacity contracts of this type is milestone-driven rather than
              subscription-SaaS: revenue accrues as deployed GPU capacity is accepted and utilised by the customer.
              Delays in construction or GPU delivery postpone recognition. Nscale has disclosed no revenue, ARR,
              traction metrics, or customer count as of the run date; the business is operationally pre-revenue on most
              committed capacity through mid-2026 with limited realized revenue visible in the public record.
            claimRefs:
              - CI001
