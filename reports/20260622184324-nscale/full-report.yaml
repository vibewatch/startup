  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >-
              Nscale competes at the intersection of three adjacent AI infrastructure markets: sovereign-grade GPU cloud
              (rental of H100/B200/GB300/GB200-class clusters for training, fine-tuning, and inference with
              in-jurisdiction data residency); hyperscaler capacity provision (large-scale GPU infrastructure leased
              under multi-year agreements to anchor tenants such as Microsoft and OpenAI); and AI infrastructure
              services (orchestration software, managed Kubernetes/Slurm, inference endpoints, and fine-tuning APIs).
              Explicitly excluded are general-purpose CPU cloud IaaS, consumer AI application software, AI semiconductor
              manufacturing, and unrelated energy infrastructure.

              The defining characteristic of Nscale's sub-market — sovereign AI cloud — is the requirement that data and
              compute remain within a specific legal jurisdiction. GDPR, the EU AI Act, national-security procurement
              rules, NHS-grade data-handling requirements, and FCA/DORA obligations create a distinct sub-market where
              hyperscaler shared clouds are structurally constrained and sovereign-focused operators command a
              compliance premium. The UK AI Opportunities Action Plan explicitly identifies sovereign compute as a
              strategic national priority, embedding policy endorsement into the demand signal.

              The primary status-quo substitutes are AWS P4/P5, Azure NDv5, and GCP A3 GPU instances, which serve the
              bulk of global enterprise AI compute but lack in-country data-residency commitments at the required
              specificity for regulated UK and EU enterprise buyers. Secondary substitutes include in-house GPU clusters
              and general-purpose colocation. Nscale vertically integrates adjacent layers — energy procurement, modular
              data center manufacturing, and fleet management software — rather than addressing them as independent
              markets, converting them into cost and speed advantages.
