      - number: '5.2'
        title: Data Center and Physical Infrastructure Portfolio
        blocks:
          - type: paragraph
            body: >
              Nscale's physical footprint is its most differentiated asset: owned-and-operated hyperscale campuses
              anchored in low-cost renewable power, supplemented by partner-site colocation and a growing North American
              campus pipeline. The operational flagship is Glomfjord, Norway — 30 MW of live capacity powered by 100%
              hydro renewable energy from the region's oversupply of hydropower dams, with expandability to 60 MW.
              Adiabatic cooling leverages the Arctic climate, and redundant low-latency fibre provides dual-path
              connectivity. In construction is the Narvik AI campus (Kvandal, 230 MW), originally designated as Stargate
              Norway with OpenAI and Aker ASA, now principally serving Microsoft. A secondary 250 MW facility in Korgen,
              also near Narvik, is also underway, and $790 M in project financing from ABN AMRO, DNB, Eksfin, Nordea,
              and SEB anchors the Narvik development. In the UK, the Loughton campus (50–90 MW, 23,040 NVIDIA GB300 GPUs
              for Microsoft, target Q1 2027) faces planning objections from Loughton Town Council, which has asked for a
              fresh planning application due to a proposed 50% capacity increase and grid-impact concerns; timeline has
              been pushed to Q2 2027. The Texas campus (~240 MW, Ionic Digital site) will host approximately 104,000
              NVIDIA GB300 GPUs for Microsoft from Q3 2026. The West Virginia Monarch Compute Campus (Mason County,
              2,250+ acres) is the US's first state-certified AI Microgrid, targeting 1.35 GW of Phase 1 AI compute
              using NVIDIA Vera Rubin NVL72 GPUs, with Caterpillar G3500 natural gas generators delivering 2 GW of
              grid-independent power by H1 2028; expansion to 8 GW+ is designed into the site. At Sines, Portugal, the
              Start Campus deployment includes 12,600 NVIDIA Blackwell Ultra GPUs (first building) and 66,000+ NVIDIA
              Vera Rubin GPUs for Microsoft from late 2027, representing Nscale's largest single EU infrastructure
              investment (€695 M+). Partner-run sites include Keflavik (Iceland), Stavanger, Oslo, and Blönduós
              (Norway), Slough (UK), and North Carolina. A further facility in Harjavalta, Finland is in permitting,
              supported by Fortum's grid connection.
