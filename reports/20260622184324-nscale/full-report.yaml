      - number: '3.2'
        title: Key Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              CoreWeave (Nasdaq: CRWV, Livingston NJ) is the largest neocloud GPU cloud operator by revenue. In Q1 2026
              it reported $2.078 billion in revenue on $99.4 billion of revenue backlog—the strongest booking quarter in
              its history. CoreWeave has surpassed 1 GW of active power and targets 8+ GW by 2030, with over 3.5 GW of
              contracted power. CoreWeave earns SemiAnalysis' Platinum ClusterMAX rating and expanded relationships with
              Cohere, Jane Street, and Mistral AI in Q1 2026. Its new Dedicated Inference product targets production
              inference workloads. Unlike Nscale, CoreWeave does not own power generation or construct campuses—it
              relies on third-party colocation. However, its public-company capital access, NVIDIA preferred status, and
              $99+ billion backlog make it Nscale's most formidable neocloud peer. CoreWeave's Q1 operating loss of $144
              million on $2.078 billion revenue illustrates that neocloud scale does not automatically produce
              profitability.

              Lambda (San Francisco CA, founded 2012) raised $480 million in Series D (February 2025) and $1.5 billion
              in Series E (November 2025). In May 2026 Lambda appointed global infrastructure operator Michel Combes as
              CEO and former AT&T CEO John Donovan as board chairman, signaling a transition from developer-centric
              cloud to gigawatt-scale AI factories. Lambda targets 3 GW of compute under management by 2030. Lambda's
              on-demand pricing is accessible (H100 at $3.99/GPU-hr, B200 at $6.69/GPU-hr) and serves "tens of
              thousands" of customers, but it historically lacks the sovereign AI positioning, European presence, and
              anchor-tenant hyperscaler contracts that define Nscale's model.

              Nebius Group (Nasdaq: NBIS, Amsterdam) was spun off from Yandex in July 2024 and released Q1 2026
              financial results on May 13, 2026. Nebius announced up to 1.2 GW of power and land for a new owned AI
              factory in Pennsylvania, demonstrating a US expansion thesis. Nebius targets data sovereignty workloads in
              the EU and US, positioning itself on privacy and compliance. Its on-demand H100 pricing is approximately
              $2.15–$3.85/GPU-hr. Nebius has limited customer reference disclosure but carries NVIDIA investor backing
              and an established EU cloud footprint.

              Crusoe (San Francisco CA) raised $1.375 billion in Series E at a valuation above $10 billion. Its power
              pipeline grew more than 4x to 45+ GW in 2025, and its 1.2 GW Abilene, Texas campus phase one went live
              approximately one year after construction began. Crusoe's US-energy-first model—sourcing power, building
              campuses, and operating GPU cloud from a single integrated stack—directly parallels Nscale's approach in
              structure. The key difference is geography (US-centric vs. Europe-centric) and customer strategy
              (diversified AI-native customers vs. Nscale's Microsoft anchor-tenant model). Both face a customer
              concentration challenge.

              Microsoft Azure, AWS, and GCP represent the most consequential competitive threat to all neoclouds. These
              three platforms collectively command the vast majority of enterprise GPU workloads through existing
              account relationships, compliance ecosystems, and global SLA coverage. The Bain June 2026 global data
              center forecast notes that hyperscalers are now entering a "disciplined, selective, power-constrained"
              growth phase—but their aggregate GPU capacity still dwarfs every neocloud operator combined. IDC projects
              AI infrastructure spending will surpass $1 trillion by 2029, much of which will flow to hyperscalers
              rather than to neoclouds.
