  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The AI compute infrastructure competitive landscape divides into three tiers relevant to Nscale. First,
              pure-play neocloud GPU cloud operators—CoreWeave, Lambda, Nebius AI, and Crusoe—serve as the closest
              direct revenue competitors, all racing to deploy GPU capacity ahead of demand and differentiate on access,
              pricing, geography, or vertical integration. Second, hyperscalers—Microsoft Azure, AWS, and Google Cloud
              Platform—represent the dominant status-quo substitute, offering GPU compute as part of a broader
              enterprise cloud platform with mature compliance, SLA, and integration ecosystems. Third, sovereign AI
              programs, telecom operators, and national cloud initiatives (e.g., BT, national cloud programs in Europe)
              represent an emerging adjacent and entrant class that Nscale is actively co-opting through partnership
              rather than ceding to as competitors.

              CoreWeave leads the neocloud segment with Q1 2026 revenue of $2.078 billion (up 112% year-over-year), a
              $99.4 billion revenue backlog, and over 1 GW of active power—establishing the public-market benchmark for
              the category via its March 2025 NASDAQ IPO (ticker: CRWV). Lambda raised $1.5 billion in Series E funding
              in November 2025 and appointed a new CEO in May 2026, targeting 3 GW of compute by 2030. Nebius Group
              (Nasdaq: NBIS), spun off from Yandex in 2024, targets data sovereignty workloads in the EU and US, and
              announced a 1.2 GW Pennsylvania AI factory in its Q1 2026 earnings. Crusoe, valued above $10 billion after
              a $1.375 billion Series E, operates from a US-centric energy-thesis strategy anchored by a 1.2 GW campus
              in Abilene, Texas. Hyperscalers continue aggressive GPU buildout: IDC reported full-year 2025 AI
              infrastructure spending of $318 billion, more than double 2024, with U.S. hyperscalers accounting for 77%
              of that spend.

              Nscale occupies a distinct position: a European-headquartered, vertically integrated AI infrastructure
              hyperscaler with NVIDIA preferred partner status, renewable-energy campuses in Norway and the UK, and a
              transformative anchor-tenant relationship with Microsoft covering approximately 200,000 NVIDIA GB300 GPUs
              across four countries. This makes Nscale more directly comparable to CoreWeave and Crusoe in ambition and
              capital scale, while its European sovereign AI positioning differentiates it from primarily US-focused
              peers.
