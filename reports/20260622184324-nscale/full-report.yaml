      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >
              Josh Payne is CEO and Founder of Nscale. His biography describes an entrepreneurial background spanning
              recruitment, capital markets, and supercomputing infrastructure, with experience in energy, data centres,
              and hardware supply chains. No prior public-company executive experience or academic credentials are
              listed in official communications. Nscale carries meaningful key-person risk: Payne is the sole named
              founder, the primary external spokesperson, and the public face of every major fundraise and partnership
              announcement.

              The leadership bench is substantial for a company at this stage. Sam Huckaby (President, Data Centers)
              joined from Oracle, where he was SVP of OCI Data Center Infrastructure, and previously held COO and CDO
              roles at Vantage Data Centers. Sagar Rawal (Chief Infrastructure Officer) is a former Head of
              Infrastructure at Microsoft with prior stints at Oracle Cloud, NVIDIA, and AWS. Osvaldo Morales (Deputy
              President North America) has delivered 10GW+ across 200+ data center projects at Microsoft, AWS, Amazon,
              NVIDIA, and Digital Realty. David Power (CTO) has 20+ years in HPC and served on the advisory board of the
              Irish Supercomputing List. Tom Burke (CRO) was previously CRO at Applied Digital and VP Global Sales at
              IBM. Philippe Sachs (President EMEA) brings banking and early venture capital experience, having been an
              early-stage investor in Nscale. Phoebee Gahan (CLO) oversees corporate law and capital markets. The
              leadership team also includes Daniel Bathurst (CPO), Naeem Hatimi (CPO, People), Daniel Shapiro (Chief
              Power Officer), Latha Maripuri (CISO, ex-Uber), and Sam Sturgess (SVP Strategy and Corporate Development).

              Following the March 2026 Series C, Nscale's board comprises seven members: Josh Payne (CEO), Rael Nurick,
              Jacob Leschly, Øyvind Eriksen (CEO of Aker ASA, who joined post-Series B), Sheryl Sandberg (former Meta
              COO, co-founder of Sandberg Bernthal Venture Partners), Susan Decker (CEO of Raftr, former Yahoo
              President, board member at Costco and Berkshire Hathaway), and Nick Clegg (General Partner at Hiro
              Capital, former UK Deputy Prime Minister, former President Global Affairs at Meta). The addition of
              Sandberg, Decker, and Clegg brings governance depth and is consistent with IPO preparation, as noted by
              TechCrunch.
