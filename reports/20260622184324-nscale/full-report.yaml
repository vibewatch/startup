      - number: '4.5'
        title: Financial Gaps and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >
              Nscale's financial profile is structurally opaque for pre-diligence underwriting purposes. The company has
              no SEC reporting obligations and has filed no financial statements in the public domain beyond the
              Companies House annual accounts (last filed for year ending December 31, 2024; 2025 accounts due September
              30, 2026 and not yet available). NSCALE GLOBAL HOLDINGS LIMITED (Companies House 15749408) has an overdue
              confirmation statement as of the run date. NSCALE LIMITED (16925886), incorporated December 22, 2025, is
              the apparent operating entity but has no filed accounts. No audited financials, management accounts, or
              investor presentations are publicly accessible.

              The key financial underwriting blockers are: (1) absence of gross margin disclosure for GPU cloud and
              infrastructure contracts — the revenue mix between on-demand GPU-hr, reserved capacity, and
              construction-and-leaseback is unknown; (2) no realized pricing per GPU-hr, meaning the Microsoft deal
              economics cannot be modeled from the public record; (3) no cash on hand or monthly burn rate, making
              runway post-Series C unverifiable; (4) unknown covenant terms and debt service coverage on $2.19B of debt,
              exposing the company to accelerated repayment or covenant breach risk; (5) customer concentration
              overwhelmingly in Microsoft across all major geographies, with limited evidence of revenue
              diversification. The planning and permitting delays at Loughton — now requiring a fresh application — add
              a schedule risk overlay to the UK tranche of the Microsoft contract. Without data-room access, this
              chapter can confirm capital was raised but cannot affirm that the business is financially sound at its
              current stage.
