      - number: '7.5'
        title: Operational Delivery, People, and ESG Risks
        blocks:
          - type: paragraph
            body: >
              Nscale is building or planning data centres across six countries—UK, Norway, Portugal, Finland, US (Texas
              + West Virginia), and Iceland—simultaneously, with first operational dates from 2026 to 2028. As of June
              2026, Glomfjord in Norway is the only confirmed operational GPU data centre; all major campus developments
              are under construction or in planning phases. This multi-country parallel build programme is being
              executed by a holding entity incorporated in May 2024, a UK operating entity incorporated December 2025,
              and a management team that is still being assembled: Sam Huckaby joined as President of Data Centers in
              early 2026, hired from Oracle Cloud Infrastructure, and has been in role fewer than six months during the
              most intensive construction and delivery phase. Josh Payne, as sole CEO and founder, is the single most
              critical individual; all major press, investor communications, and strategic announcements are attributed
              to him personally.

              The BT partnership for 14 MW of AI data centre capacity across three UK BT sites (announced April 2026)
              adds a further parallel delivery thread, albeit smaller in scale. Nscale's total announced pipeline across
              all geographies exceeds 3 GW of contracted or committed capacity, with delivery commitments extending
              through 2028; the operational maturity to execute this simultaneously without quality or schedule failures
              has not been independently validated at the current headcount and organisational age.

              On the ESG and reputational front, Datacentre Review reported in March 2026 that Nscale is "the latest
              company to face intense scrutiny" over its Loughton proposal, with power grid impact cited as the primary
              public concern. Edinburgh Council's consideration of a moratorium on new data centres, referenced in the
              same article, illustrates that local authority opposition is becoming a sector-wide pattern rather than a
              site-specific issue. The European Parliament Research Service (July 2025) concluded that AI data centres
              "contribute to pressure on local grids and involve trade-offs with climate goals, land use and energy
              affordability." Nscale pledges 100% renewable energy for its Norwegian sites—credible given Norwegian
              hydropower abundance—but has not disclosed the energy mix, certification methodology, or renewable energy
              credit framework for UK (National Grid), Texas (ERCOT), or West Virginia (PJM) sites where the grid carbon
              intensity is materially higher. The Bain AI data centre forecast identified power constraints as the
              primary execution risk for large-scale AI infrastructure buildouts, with some locations facing utility
              bottlenecks extending lead times beyond 24 months.
