      - number: '6.5'
        title: Customer Concentration and Adverse Findings
        blocks:
          - type: paragraph
            body: >
              Microsoft concentration is Nscale's primary commercial risk. Across all confirmed agreements, Microsoft
              accounts for the overwhelming majority of Nscale's disclosed contracted GPU capacity — at least 282,000
              GPUs of announced commitments, with the West Virginia LOI adding a further pipeline in the GW range. No
              second customer is disclosed with more than 14 MW of contracted capacity. If Microsoft were to pause,
              renegotiate, or exit any of its four active Nscale deployments, the resulting capacity utilisation
              shortfall could directly threaten Nscale's debt servicing on the project financing underlying those
              campuses. Nscale has not disclosed whether its financing covenants include anchor-tenant retention
              requirements, nor whether Microsoft's commitments include minimum take-or-pay protections.

              The OpenAI withdrawal signals are adverse for Nscale's customer diversification narrative in two ways.
              First, OpenAI was publicised as a cornerstone partner for the Norwegian Stargate project, lending
              credibility and demand assurance to the $790 million Norway financing. Its replacement by Microsoft as
              anchor preserved the commercial outcome, but the substitution demonstrates that Nscale's named-partner
              announcements do not always convert to binding long-term offtake. Second, OpenAI's pause on the UK
              Stargate project — citing UK electricity costs four times higher than the US and unresolved copyright
              regulations — constitutes a direct adverse signal for Nscale's UK pipeline. The planned UK Stargate
              deployment was to provide 8,000–31,000 GPUs of demand at Nscale's North East England sites. Its loss
              constrains Nscale's non-Microsoft UK demand and places greater commercial reliance on the BT sovereign AI
              agreement and any undisclosed pipeline customers.

              Loughton planning objections represent a second adverse finding. Loughton Town Council officers in early
              2026 called for a new planning application after Nscale proposed a configuration 50% larger than
              originally approved, citing grid strain and increased power demands. Nscale revised the Loughton
              completion date to Q2 2027 (from Q4 2026), officially attributing the delay to Vera Rubin 200 technology
              upgrades. The planning complication could further delay delivery to Microsoft and any other UK customers,
              with knock-on implications for Q1 2027 GPU deployment commitments.

              A third concentration risk is geographic: Nscale's largest announced customer deployments (Norway,
              Portugal, Texas) are in markets with specific regulatory contexts, and the European deployments face EU AI
              governance requirements that could constrain customer flexibility. The DCD report noting "Microsoft and
              Google are set to lease capacity from Nscale in the UK" introduces Google as a potential second
              hyperscaler customer; however, this reference is unconfirmed by either party and cannot be relied upon as
              disclosed customer proof.
