      - number: '4.2'
        title: Pricing Visibility and Unit Economics
        blocks:
          - type: paragraph
            body: >
              Nscale does not publish list pricing for GPU compute on its website as of June 2026, departing from the
              practice of neocloud peers CoreWeave, Lambda Labs, and Nebius — all of which publish per-GPU-hour rates.
              Enterprise deals are structured privately, which means realized pricing, volume discount depth, contract
              duration, and renewal escalators are not in the public domain. This absence makes independent verification
              of Nscale's revenue per deployed GPU-hour impossible at the pre-diligence stage.

              The neocloud peer landscape provides the closest available unit economics proxies. CoreWeave, now public,
              reported Q1 2026 revenue of $2.078 billion (up 112% YoY) and a revenue backlog of $99.4 billion as of
              March 31, 2026, implying long-term contracted revenue at scale. Nebius Group also reported Q1 2026 results
              and announced 1.2 GW of secured power in Pennsylvania, demonstrating the capital intensity of the sector.
              GPU spot market H100 rates have compressed significantly from approximately $8/GPU-hr in 2023 to
              approximately $2–3/GPU-hr by late 2024, driven by neocloud supply expansion, creating a pricing floor that
              constrains unreserved on-demand revenue.

              Nscale's cost-side advantage lies in its Northern Norway positioning. The Narvik and Glomfjord sites
              benefit from hydropower electricity prices significantly below the European average, improving energy cost
              of goods per GPU-hour relative to continental or UK peers. However, no PUE figures, blended energy cost
              per kWh, GPU utilization rates, or gross margin estimates have been disclosed. Data center capex
              benchmarks suggest $10–15M per MW for hyperscale AI-optimized facilities, implying that Nscale's 1.3+ GW
              committed pipeline represents $13–20+ billion in total capital deployment over multiple years — a figure
              that frames the critical importance of capex-to-revenue efficiency that cannot yet be assessed.
