              GPUs are contracted for Q1 2027. The Narvik campus originally contracted 52,000 NVIDIA GB300 GPUs, now
              expanded to 30,000+ NVIDIA Vera Rubin GPUs for the 2027 phase; a prior agreement covered ~52,000 GB300
              GPUs in an earlier tranche. In aggregate, the Microsoft deal signed in October 2025 committed
              approximately 200,000 NVIDIA GB300 GPUs across Europe and the US, in collaboration with Dell. The
              2027-generation NVIDIA Vera Rubin NVL72 platform represents a 10× inference token cost reduction and 4×
              fewer GPUs to train MoE models vs Blackwell, with sixth-generation NVLink at 260 TB/s per rack and
              hardware-accelerated confidential computing across CPU, GPU, and NVLink domains. Nscale was named by
              NVIDIA at CES as among the world's first providers to adopt Rubin. The West Virginia Monarch campus is
              designated as the global flagship deployment of the NVIDIA Vera Rubin DSX AI Factory reference design,
              with 1.35 GW of Vera Rubin compute targeted for delivery from late 2027. The Portugal Start Campus will
              host 66,000+ Rubin GPUs for Microsoft beginning late 2027. In Norway, the Narvik campus adds 30,000+ Rubin
