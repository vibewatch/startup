companyProfile:
  summary: >-
    Nscale is a London-headquartered AI infrastructure company spun out of Arkon Energy that is trying to build a
    European and transatlantic sovereign-AI hyperscaler. Its model combines site development, power sourcing, AI data
    center construction, NVIDIA GPU procurement, and a managed software layer spanning inference endpoints, fine-tuning,
    Kubernetes, Slurm, and observability. The company has raised unusually large amounts of capital in a short period —
    Series B, Series C, GPU-backed debt, and Norway project financing — and has won Microsoft as its anchor customer
    across the UK, Norway, Portugal, Texas, and West Virginia. The upside case depends on converting that announced
    capacity into operating revenue before planning delays, concentration, or leverage undermine the story.
  foundedDate: '2024-05-29'
  founders:
    - name: Josh Payne
      role: CEO and Founder
      background: >-
        Entrepreneur with prior experience in recruitment, capital markets, supercomputing infrastructure, energy, data
        centers, and hardware supply chains.
      claimRefs:
        - CO011
  foundingLocation: United Kingdom
  headquarters: London, United Kingdom
  productSummary: >-
    Nscale sells a full-stack AI infrastructure platform: GPU compute, high-performance networking, storage, and
    orchestration software delivered through owned and partner-run campuses, plus higher-level services such as
    inference endpoints, prompt tooling, fine-tuning, Managed Slurm, and Kubernetes-based deployment.
  customerFocus: >-
    Hyperscalers, frontier-model labs, public-sector and regulated-industry buyers, and enterprises that require
    large-scale sovereign or regionally hosted AI compute.
  businessModel: >-
    Long-term contracted GPU and campus capacity agreements, enterprise AI infrastructure services, and managed platform
    revenue layered on top of owned or controlled data center and power assets.
  stage: Series C
  fundingStatus: >-
