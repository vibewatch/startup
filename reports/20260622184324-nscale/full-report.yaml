    title: Unit Economics Bridge — GPU-Hour Revenue to Estimated Gross Margin
    type: flow
    layout: standard
    summary: >-
      Key cost and revenue drivers that determine per-GPU-hour economics for Nscale's infrastructure; all intermediate
      values are estimated or disclosed by peers, not Nscale.
    data:
      nodes:
        - id: list-price
          label: Contracted / Realized Price
          detail: Not disclosed; Nscale has no public list price. Peer range ~$2.00–4.00/GPU-hr H100 equivalent
        - id: utilization
          label: GPU Utilization Rate
          detail: Not disclosed; target unknown. High utilization (>80%) required to cover fixed capex and debt service
        - id: realized-rev
          label: Realized Revenue / GPU-hr
          detail: Contracted price × utilization rate; not publicly known for Nscale
        - id: gpu-capex
          label: GPU & Rack Capex (Depreciation)
          detail: H100/GB300 cost ~$20K–40K/unit; DDTL GPU-backed; amortized over 3–5 years; dominant COGS
        - id: power-opex
          label: Power OPEX
          detail: >-
            Norway sites benefit from hydro pricing well below EU average; UK/US sites at higher rates; blended rate
            undisclosed
        - id: debt-service
          label: Debt Service (DDTL + Norway)
          detail: $2.19B+ in debt; annual service unknown; erodes free cash flow and compresses effective margin
        - id: gross-margin
          label: Estimated Gross Margin
          detail: >-
            Not disclosed; peer GPU cloud range 20–45% (CoreWeave, Nebius); Nscale's Norway energy advantage may support
            high end
      edges:
        - from: list-price
          to: realized-rev
          label: Contract pricing
        - from: utilization
          to: realized-rev
          label: Capacity fill
        - from: realized-rev
          to: gross-margin
          label: Revenue line
        - from: gpu-capex
          to: gross-margin
          label: Depreciation COGS
        - from: power-opex
          to: gross-margin
          label: Energy COGS
        - from: debt-service
          to: gross-margin
          label: Below gross margin; affects FCF
