      - number: '2.2'
        title: Market Sizing and Growth Trajectory
        blocks:
          - type: paragraph
            body: >-
              Global AI infrastructure spending reached $318 billion in full-year 2025, more than doubling the $153
              billion recorded in 2024. In Q4 2025 alone, spending hit $89.9 billion — a 62.2% year- over-year increase
              — driven by continued hyperscaler buildout, accelerated inference workload deployment, and the first wave
              of sovereign AI programs in the Middle East and Europe. IDC projects the market will reach $487 billion in
              2026 (approximately 53% YoY growth) and surpass $1 trillion by 2029 at a five-year CAGR of approximately
              31%.

              These estimates are broad and include server hardware, networking, storage, and cooling infrastructure —
              not solely GPU rental revenue. CoreWeave's revenue backlog of nearly $100 billion as of Q1 2026 (with
              $2.078 billion quarterly revenue, +112% YoY) provides the clearest public benchmark for the neocloud
              segment's absolute scale. Western Europe represented a 42% year-over-year growth region in Q4 2025, one of
              the fastest-growing non-US AI infrastructure markets, which directly validates Nscale's European anchor
              strategy.

              No independent analyst study isolating the EU sovereign GPU cloud rental market was identified. The
              European market share of global AI infrastructure spend is estimated at 7–12% based on IDC regional data
              and Microsoft's UK and EU data center commitments, implying approximately $20–38B in EU-region
              infrastructure spend in 2025. Nscale's SAM is narrowed further by its sovereign-grade focus, construction
              timelines, and current contracted capacity, estimated at $3–8B addressable by 2030. Multiple contradictory
              and differently scoped estimates are preserved in Table 2.
