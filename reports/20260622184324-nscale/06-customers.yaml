      Retention percentages are illustrative diligence scenarios, not company-disclosed data. Microsoft
      retention is treated as near-certain through 2027 delivery cycle based on contractual lock-in and
      financial co-dependence. BT retention is assumed high but with degradation risk given pre-operational
      status and no disclosed SLA. Inference user retention is estimated low based on typical developer
      cloud churn patterns and low switching costs. The OpenAI scenario is calibrated from the actual
      documented withdrawal from Norway and UK Stargate. Nscale has not disclosed NRR, GRR, or cohort data.
    claimRefs: [CU008, CU009, CU010, CU017, CU035, CU036]

callouts:
  - calloutType: strength
    title: Microsoft's Multi-Quarter Escalating Commitment Is Rare Customer Proof at This Scale
    body: >
      Three sequential Microsoft contract expansions between October 2025 and May 2026 —
      initial 200K GB300 GPU deal, Norway Rubin expansion, Portugal Rubin expansion —
      demonstrate an ongoing operational relationship, not a single headline agreement.
      Each expansion follows the prior deployment batch progressing toward service,
      suggesting a live feedback loop between Microsoft's infrastructure team and
      Nscale's operations. For a company without disclosed NRR, this escalating commit
      pattern is the strongest available proxy for customer retention and satisfaction.
    claimRefs: [CU001, CU002, CU003, CU004, CU007]

  - calloutType: strength
    title: BT Partnership Opens Sovereign AI Market With UK Government Backing
    body: >
      BT Group's CEO publicly endorsing the April 2026 partnership, combined with the
      UK AI Minister's welcome statement and co-membership in the UK Sovereign AI
      Industry Forum, positions Nscale as the preferred sovereign compute partner for
      UK public-sector and regulated-industry AI workloads. This institutional alignment
      is difficult to replicate and creates a credible second revenue stream distinct
      from Microsoft hyperscaler capacity.
    claimRefs: [CU010, CU011, CU033]

  - calloutType: risk
    title: OpenAI Withdrawal Signals That Named-Partner Commitments Can Dissolve Pre-Deployment
    body: >
      OpenAI was announced as the primary anchor for both Stargate Norway and the UK
      Stargate programme, yet exited both before reaching contracted production. In
      Norway, Microsoft absorbed the capacity; in the UK, no replacement was disclosed.
      This calibrates the risk of Nscale's other announced-but-uncontracted partnerships:
      GPU infrastructure demand letters of intent are not equivalent to take-or-pay
      revenue, and a single counterparty change can leave a site partially unplaced.
    claimRefs: [CU008, CU009, CU019, CU020, CU021, CU022]

  - calloutType: risk
    title: >
      Microsoft Concentration Exceeds 90% of Disclosed GPU Capacity — A Single-Customer
      Business at Infrastructure Scale
    body: >
      With no second customer approaching Microsoft's disclosed GPU commitments, Nscale
      is structurally a single-customer infrastructure business in its announced
      hyperscaler tier. A contract renegotiation, payment default, or technology shift
      by Microsoft could impair Nscale's ability to service project financing across
      four active campuses simultaneously. This concentration is not unusual for
      early-stage infrastructure builders, but it is the single most important watchpoint
      for investors evaluating the $14.6 billion valuation.
    claimRefs: [CU016, CU028, CU037]

  - calloutType: insight
    title: Loughton Planning Delay Introduces Execution Risk to UK Microsoft Delivery Timeline
    body: >
      Loughton Town Council's call for a new planning application, driven by Nscale's
      50% scope expansion and grid impact concerns, adds uncertainty to the Q2 2027
      UK delivery commitment to Microsoft. If a full new planning process is required,
      the timeline could slip by 6–12 months. Combined with the OpenAI UK Stargate
      pause, Nscale's UK customer footprint is currently thinner than public
      announcements suggest.
    claimRefs: [CU018, CU019, CU024]

