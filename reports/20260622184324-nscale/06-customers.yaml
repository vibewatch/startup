  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-gaps
      missingEvidence: >
        Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and customer count
        by segment are not disclosed in any public Nscale communication or third-party report.
      whyItMatters: >
        Retention metrics are fundamental to valuing a capital-intensive GPU infrastructure
        business at $14.6 billion. Without NRR data it is impossible to assess whether
        Nscale's announced customer commitments translate to durable recurring revenue,
        or whether the inference cloud user base is growing, stable, or declining.
      diligencePath: >
        Request trailing-12-month NRR and GRR by segment (hyperscaler, sovereign AI, inference)
        directly from management; cross-reference with individual contract renewal confirmations
        and capacity utilisation reports per campus.
      relatedQuestionRefs: [QU016, QU022]

    - type: private-evidence-only
      severity: material
      topic: Microsoft-contract-terms
      missingEvidence: >
        No public source discloses contract duration, minimum take-or-pay obligations,
        cancellation rights, or financing covenant triggers tied to Microsoft anchor retention
        across the UK, Norway, Portugal, and Texas deployments.
      whyItMatters: >
        These terms determine the financial risk to Nscale's project financing (Norway $790M,
        other campuses undisclosed) in the event of a Microsoft contract modification. If
        Microsoft has cancellation rights without significant penalties, the anchor-tenant
        narrative may not adequately protect lenders.
      diligencePath: >
        Obtain and review executed MSA and site-specific addenda for all four Microsoft campus
        agreements; confirm covenant structures with Nscale's primary project finance lender(s).
      relatedQuestionRefs: [QU012, QU022]

    - type: private-evidence-only
      severity: material
      topic: inference-platform-users
      missingEvidence: >
        Independent corroboration of the 5,000+ users and 148× growth claims for Nscale's
        inference platform, including named enterprise customers, cohort retention data, and
        any third-party G2/Gartner Peer Insights reviews or marketplace usage statistics.
      whyItMatters: >
        The inference platform is presented as a diversification engine beyond the Microsoft
        concentration. Without verifiable user and retention data, it is impossible to assess
        its revenue contribution or whether it constitutes a genuine second business unit.
      diligencePath: >
        Request Nscale's inference platform MAU/DAU metrics, ARR breakdown, enterprise vs.
        developer mix, and cohort retention curves; search G2/Capterra/Gartner for Nscale reviews.
      relatedQuestionRefs: [QU006, QU019]

    - type: private-evidence-only
      severity: material
      topic: OpenAI-current-status
