company:
  name: Nscale
chapter:
  number: 6
  title: Customers
  summary: >
    Nscale's customer base is hyperconcentrated in Microsoft, which has contracted
    approximately 200,000 NVIDIA GB300 GPUs across UK, Norway, Portugal, and Texas in
    one of the largest AI infrastructure agreements ever signed, plus an LOI for 1.35 GW
    in West Virginia. BT Group is the sole confirmed non-Microsoft anchor, contributing
    14 MW of sovereign AI capacity across three UK network sites. Nscale's inference
    cloud claims 5,000+ users and 148× growth but lacks independent corroboration.
    Two material adverse signals emerged in 2026: OpenAI withdrew as the original
    Narvik anchor and paused its UK Stargate plans, leaving Microsoft as the default
    backstop in both cases. No NRR, GRR, customer count, or per-segment revenue has
    been disclosed publicly, and extreme concentration in Microsoft constitutes the
    single largest commercial risk to Nscale's capital programme.

sections:
  - id: customer-base-overview
    title: Customer Base Overview and Segmentation
    body: >
      Nscale serves three identifiable customer segments. First, hyperscaler capacity
      anchors — primarily Microsoft — that commit multi-hundred-megawatt GPU deployments
      under multi-year infrastructure agreements covering specific Nscale campuses.
      Second, sovereign AI institutional customers — BT Group and, implicitly, UK and
      European public-sector bodies — that require compute under national data residency
      and regulatory compliance frameworks. Third, inference cloud users — over 5,000
      accounts on Nscale's inference platform (company-claimed, 148× growth
      unverified) — consisting of AI developers, startups, and enterprises running
      training, fine-tuning, and inference workloads on Nscale's managed GPU cloud.

      Microsoft is the overwhelming revenue anchor. Across confirmed agreements signed
      between September 2025 and May 2026, Microsoft has contracted delivery of
      approximately 200,000 NVIDIA GB300 GPUs plus over 96,000 NVIDIA Rubin GPUs
      (Norway expansion and Portugal expansion), representing what Nscale calls "one
      of the largest AI infrastructure contracts ever signed." The deal spans four
      countries (UK, Norway, Portugal, US) and two continents, and includes an
      additional LOI for 1.35 GW of West Virginia capacity. No second customer
      approaches this scale. Nscale's inference cloud provides geographic and
      customer-type diversification, but there is no evidence its aggregate revenue
      approaches the hyperscaler capacity contracts.

      BT Group entered the customer roster in April 2026 as a sovereign AI partner:
      Nscale will build 14 MW across three existing BT network exchange sites, offering
      UK-controlled compute with BT's nationwide fibre connectivity as the backbone.
      The BT relationship is strategically important because it aligns Nscale with
      UK government AI policy, opens public-sector procurement channels, and provides
      a reference enterprise customer beyond the Microsoft relationship. However, 14 MW
      is modest relative to the 50–240 MW campus scale of the Microsoft deployments.

      Nscale self-identifies as serving telecommunications, life sciences, financial
      services, and the public sector through its inference and sovereign cloud
      platforms. No independent verification of customer names within these verticals
      beyond Microsoft and BT exists in public sources reviewed.
    claimRefs:
      [CU001, CU002, CU003, CU004, CU010, CU011, CU013, CU014, CU032, CU038]
    tableRefs: [TU001, TU002]
    figureRefs: [FU002]

  - id: named-customer-proof
    title: Named Customer Deployments and Evidence Quality
    body: >
      Microsoft's commitment is the best-evidenced customer relationship Nscale has
      disclosed. The October 2025 press release — countersigned with a Microsoft
      executive quote from Jon Tinter, President of Business Development and Ventures —
      confirms approximately 200,000 NVIDIA GB300 GPUs across four Nscale sites, with
      Dell Technologies as the hardware integrator. The cumulative Microsoft GPU
      commitments total at least 282,000 GPUs across all announced agreements (200,000
      GB300s from October 2025, 30,000+ Rubin GPUs in Norway from April 2026, and
      66,000+ Rubin GPUs in Portugal from May 2026), and the West Virginia LOI
      adds a further 1.35 GW pipeline. The deal value has been independently estimated
      at approximately $14 billion (The Next Web, April 2026). Microsoft is deploying
      compute at the Norway Narvik campus, Portugal Start Campus, UK Loughton campus,
      and Texas site, all under Nscale's managed AI infrastructure services.

      BT Group is the second named anchor, confirmed via both a joint press release
      with BT Business CEO Jon James quoted explicitly and an independent BT newsroom
      announcement published on April 23, 2026. BT will provide connectivity
      infrastructure; Nscale will build modular NVIDIA-powered AI data centres at
      three undisclosed BT network exchange sites. The use cases span healthcare,
      finance, energy, and public services under UK data residency requirements. The
      BT CEO's direct quote — "The development of AI and data centre infrastructure
      is key to unlocking economic growth in the UK" — constitutes the strongest
      customer-level public endorsement in Nscale's disclosed customer roster.

      OpenAI's role has materially changed. Originally the primary offtaker for
      Stargate Norway (announced July 2025 as targeting 100,000 GPUs by end 2026),
      OpenAI subsequently pulled out of the Norway deal; Microsoft replaced it as
      anchor tenant. OpenAI also paused its UK Stargate programme (announced September
      2025 with Nscale and Nvidia at sites in North East England: ~8,000 GPUs scalable
      to 31,000), citing UK electricity costs four times higher than the US and
      unresolved copyright regulations. These withdrawals are adverse to Nscale's
      customer quality narrative: OpenAI is no longer a directly contracted committed
      customer at any Nscale site, though Microsoft may provide Nscale-hosted compute
      to OpenAI indirectly.

      Nscale's inference platform claims 5,000+ users and 148× scaling (from the Vera
      Rubin press release), but no independent source confirms either figure. No
      enterprise customers in the inference segment are named publicly. The platform
      lists capabilities including Inference Endpoints, Managed Slurm, Kubernetes,
      and bare metal, positioning it for developer and enterprise ML workloads.
      The claim that Nscale is "a top provider on public inference marketplaces" is
      also unverified in third-party sources.
    claimRefs:
      [CU001, CU002, CU003, CU007, CU008, CU009, CU010, CU011, CU013, CU014,
       CU022, CU023, CU024, CU027, CU028, CU029, CU030, CU039]
    tableRefs: [TU003]
    figureRefs: [FU001, FU003]

  - id: adoption-trajectory
    title: Adoption Trajectory and Market Context
    body: >
      The pace of Nscale's contracted GPU pipeline reflects extraordinary demand
      acceleration: the company went from a $1.1 billion Series B in September 2025 to
      a $2 billion Series C at $14.6 billion valuation by March 2026, with each capital
      raise anchored by a new Microsoft GPU contract announcement. The Microsoft deal
      trajectory shows increasing commitment size — initial Loughton and Norway
      announcements (September 2025) gave way to the October 2025 expanded 200,000 GPU
      deal, the April 2026 Narvik Rubin expansion, and the May 2026 Portugal Rubin
      expansion — suggesting a live, escalating commercial relationship rather than a
      single contract.

      Nscale's inference platform's 148× scaling is a claimed adoption metric but
      unverified externally. If accurate, it would indicate strong demand traction in
      the developer and SME inference segment. The inference platform supports
      Slurm and Kubernetes orchestration, suggesting consumption by both
      enterprise HPC-style workloads and cloud-native ML teams.

      Nscale's deployment geography aligns with two key demand vectors: (1) European
      sovereign AI demand, driven by GDPR, the EU AI Act, and national AI strategies
      (UK AI Opportunities Action Plan, Norway's industrial policy), and (2) North
      American hyperscaler infrastructure outsourcing demand, driven by Microsoft's
      documented capacity constraints and large-scale GPU procurement. The EU AI
      Continent Action Plan, Microsoft's Q1 2026 global AI adoption report, and Bain's
      AI data centre forecast all describe structurally accelerating demand that
      validates Nscale's large-scale build approach.

      The single most important adoption signal is that Microsoft has continued to
      expand its commitment across multiple sequential quarters, culminating in an
      additional 30,000 Rubin GPUs in Norway (April 2026) and 66,000+ Rubin GPUs in
      Portugal (May 2026). Each expansion follows the prior deployment going into
      service, suggesting operational satisfaction sufficient to trigger follow-on
      contracting — the closest available proxy to a land-and-expand motion in the
      absence of disclosed NRR data.
    claimRefs:
      [CU001, CU002, CU003, CU004, CU005, CU006, CU015, CU016, CU025, CU026,
       CU027, CU031, CU033, CU034, CU040]
    figureRefs: []

  - id: retention-and-data-gaps
    title: Retention Dynamics and Evidence Gaps
    body: >
      Nscale has disclosed none of the standard SaaS or infrastructure-as-a-service
      retention metrics: there is no NRR, GRR, logo churn rate, contract renewal rate,
      or cohort-level data in any public source reviewed. This is a material diligence
      gap for a company building capital-intensive infrastructure whose project
      financing depends on long-term contracted capacity.

      The available proxies suggest a bifurcated retention profile. For Microsoft, the
      multi-year nature of capacity agreements and the escalating GPU commitments across
      successive quarters imply structural retention: Nscale is deploying bespoke
      infrastructure for Microsoft, and the $14 billion+ deal value means switching
      costs are prohibitive during the construction and early operational phases.
      However, Nscale has not disclosed whether these agreements include minimum
      take-or-pay provisions, contract durations, or cancellation rights — all of which
      matter materially given the financing commitments behind each campus.

      For BT, the April 2026 announcement is a new customer relationship with no
      operational tenure. There is no retention evidence for BT beyond the announcement
      itself. The sovereign AI positioning creates some institutional stickiness (BT
      cannot easily move UK government workloads to non-UK-sovereign infrastructure),
      but the commercial terms, SLA commitments, and contract structure are not public.

      For the inference platform, with 5,000+ claimed users, there is no cohort data,
      no churn disclosure, and no evidence of repeat usage at enterprise scale. The
      inference user base could be skewed toward experimental or short-duration users;
      without retention data it is impossible to distinguish recurring enterprise
      demand from one-time developer trials. Nscale's pricing page lists on-demand
      GPU pricing, which implies low switching costs for inference users relative
      to capacity anchor tenants.

      A key adverse inference from the OpenAI situation is that customer commitments in
      this market are reversible. OpenAI was publicly announced as an anchor partner
      for both the Norway and UK Stargate sites, yet withdrew from direct
      infrastructure commitments in both cases. While not a churn event in the
      traditional sense — OpenAI never reached contracted production status — it
      illustrates that announced AI infrastructure partnerships can dissolve before
      deployment. This risk applies directly to Nscale's announced pipeline.
    claimRefs:
      [CU008, CU009, CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU024,
       CU035, CU036]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: concentration-risk-and-adverse
    title: Customer Concentration and Adverse Findings
    body: >
      Microsoft concentration is Nscale's primary commercial risk. Across all confirmed
      agreements, Microsoft accounts for the overwhelming majority of Nscale's
      disclosed contracted GPU capacity — at least 282,000 GPUs of announced
      commitments, with the West Virginia LOI adding a further pipeline in the GW range.
      No second customer is disclosed with more than 14 MW of contracted capacity. If
      Microsoft were to pause, renegotiate, or exit any of its four active Nscale
      deployments, the resulting capacity utilisation shortfall could directly threaten
      Nscale's debt servicing on the project financing underlying those campuses.
      Nscale has not disclosed whether its financing covenants include anchor-tenant
      retention requirements, nor whether Microsoft's commitments include minimum
      take-or-pay protections.

      The OpenAI withdrawal signals are adverse for Nscale's customer diversification
      narrative in two ways. First, OpenAI was publicised as a cornerstone partner for
      the Norwegian Stargate project, lending credibility and demand assurance to the
      $790 million Norway financing. Its replacement by Microsoft as anchor preserved
      the commercial outcome, but the substitution demonstrates that Nscale's
      named-partner announcements do not always convert to binding long-term offtake.
      Second, OpenAI's pause on the UK Stargate project — citing UK electricity costs
      four times higher than the US and unresolved copyright regulations — constitutes
      a direct adverse signal for Nscale's UK pipeline. The planned UK Stargate
      deployment was to provide 8,000–31,000 GPUs of demand at Nscale's North East
      England sites. Its loss constrains Nscale's non-Microsoft UK demand and places
      greater commercial reliance on the BT sovereign AI agreement and any
      undisclosed pipeline customers.

      Loughton planning objections represent a second adverse finding. Loughton Town
      Council officers in early 2026 called for a new planning application after Nscale
      proposed a configuration 50% larger than originally approved, citing grid strain
      and increased power demands. Nscale revised the Loughton completion date to Q2
      2027 (from Q4 2026), officially attributing the delay to Vera Rubin 200
      technology upgrades. The planning complication could further delay delivery to
      Microsoft and any other UK customers, with knock-on implications for Q1 2027
      GPU deployment commitments.

      A third concentration risk is geographic: Nscale's largest announced customer
      deployments (Norway, Portugal, Texas) are in markets with specific regulatory
      contexts, and the European deployments face EU AI governance requirements that
      could constrain customer flexibility. The DCD report noting "Microsoft and Google
      are set to lease capacity from Nscale in the UK" introduces Google as a potential
      second hyperscaler customer; however, this reference is unconfirmed by either
      party and cannot be relied upon as disclosed customer proof.
    claimRefs:
      [CU003, CU004, CU005, CU006, CU008, CU009, CU018, CU019, CU020, CU021,
       CU022, CU023, CU024, CU028, CU030, CU037]
    tableRefs: [TU005]
    figureRefs: []

