figures:
  - id: FU001
    title: Nscale Customer Journey Map
    type: journey-map
    layout: wide
    summary: >
      Steps from initial discovery through multi-year contracted deployment for Nscale
      AI infrastructure customers, including the OpenAI withdrawal as an adverse stage
      at the offtake commitment step.
    data:
      items:
        - label: "Stage 1 – Discovery (Hyperscaler / Sovereign AI identifies Nscale)"
          detail: "Microsoft, BT, and OpenAI discovered Nscale through NVIDIA strategic partnership, UK government AI policy (AI Opportunities Action Plan), and Aker co-investment. Developer/inference users discover via nscale.com, inference marketplace listings, and NVIDIA ecosystem referrals."
        - label: "Stage 2 – Qualification (Nscale CRO / sales qualify opportunity)"
          detail: "Hyperscalers evaluate GPU supply chain, NVIDIA allocation, campus readiness, power certainty, and delivery timeline. Sovereign AI buyers evaluate data residency compliance, UK regulatory alignment, and BT connectivity integration. Inference users self-qualify via cloud console."
        - label: "Stage 3 – Site Selection and Technical Evaluation"
          detail: "Customer and Nscale agree on campus (Norway Narvik, Portugal Sines, UK Loughton, Texas, West Virginia) based on GPU architecture, delivery schedule, energy cost, and regulatory framework. BT partners on network exchange site selection."
        - label: "Stage 4 – Contract and Financing Alignment"
          detail: "Hyperscaler signs multi-year capacity agreement covering GPU type, delivery schedule, and power commitment. For anchor tenants, contract signing often precedes or accompanies Nscale's external financing (e.g., Norway $790M financing tied to Microsoft Narvik agreement). BT signs sovereign AI data centre agreement."
        - label: "Stage 5 – Deployment and Infrastructure Build"
          detail: "Nscale constructs campus or deploys in partner facility (Start Campus, BT sites). GPU delivery and rack integration follows NVIDIA supply chain. Adverse: Loughton Town Council planning objections delayed Q4 2026 target to Q2 2027 for UK delivery."
        - label: "Stage 6 – Production and Value Delivery"
          detail: "Microsoft begins receiving AI compute services (Norway Sines from Q1 2026; Texas from Q3 2026; UK from Q2 2027). BT activates sovereign AI services at UK exchange sites. Inference users access GPU pools via Slurm/Kubernetes APIs."
        - label: "Stage 7 – Expansion and Follow-on Contracting"
          detail: "Microsoft expanded Norway from GB300 to +30,000 Rubin GPUs (April 2026), Portugal from 12,600 to 66,000+ Rubin GPUs (May 2026), and holds an option for 700 MW second Texas phase from late 2027. WV LOI adds 1.35 GW pipeline. Adverse: OpenAI pulled out of Norway Narvik anchor commitment; Microsoft absorbed capacity."
        - label: "Stage 8 – Multi-year Anchor Lock-in"
          detail: "Microsoft's four active Nscale sites and $14B+ deal create infrastructure lock-in through 2027–2028 delivery cycle. BT sovereign AI relationship provides institutional stickiness via UK data residency requirements. OpenAI's withdrawal from UK Stargate illustrates that partner lock-in is not guaranteed pre-deployment."
    approximationNotes: >
      Journey stages are synthesised from official Nscale press releases, BT newsroom, DCD, Computerworld,
      and The Next Web reporting. Conversion rates between stages are not available publicly. The OpenAI
      adverse event is a documented real occurrence, not a hypothetical scenario.
    claimRefs: [CU001, CU008, CU009, CU010, CU011, CU018, CU019, CU023]

  - id: FU002
    title: Nscale Customer Adoption Funnel
    type: funnel
    layout: standard
    summary: >
      Estimated stages from AI infrastructure prospect to anchor-contracted deployment
      for Nscale's GPU cloud business, illustrating the narrow top-of-funnel to
      hyperscaler lock-in conversion path.
    data:
      items:
        - label: "Addressable AI Infrastructure Prospects"
          value: 500
          detail: "Hyperscalers, sovereign AI buyers (telecoms, governments), and enterprise ML teams across UK, Europe, and North America with multi-MW GPU requirements and data residency needs matching Nscale's value proposition"
        - label: "Active Pipeline / RFP Stage"
          value: 80
          detail: "Organisations in active discussion with Nscale's sales or CRO team, evaluating specific campus options, GPU specifications, delivery timelines, and sovereign compliance requirements"
        - label: "MOU / LOI Stage"
          value: 12
          detail: "Entities that have signed letters of intent, framework agreements, or MOU-level commitments; includes West Virginia LOI with Microsoft and reported Google UK discussions (unconfirmed)"
        - label: "Contracted Anchor Deployments"
          value: 2
          detail: "Publicly confirmed contracted anchors with named customer executives on record: Microsoft (multi-site, multi-GPU type) and BT Group (UK sovereign AI, 14 MW)"
