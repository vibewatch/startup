  - id: CO007
    statement: >
      Nscale's global data centre footprint spans operational sites in Norway (Glomfjord, Narvik), the UK (Loughton),
      the US (Texas, West Virginia), and Portugal (Sines/Start Campus), with partner-run sites in Iceland, Norway
      (Stavanger, Oslo, Blönduós), UK (Slough, North Carolina), and a planned Finland site.
    type: company-claimed
    topic: data-centers
