    statement: >
      Nscale is headquartered in London, UK, and is an AI-native infrastructure platform providing vertically integrated
      compute, networking, storage, managed software, and AI services delivered in both Nscale-owned and colocated data
      centres.
    type: company-claimed
    topic: identity
    sourceRefs:
