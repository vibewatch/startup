  - id: CO006
    statement: >
      Nscale's product stack spans AI services (Inference Endpoints, Prompt Workbench, Fine-tuning) and
      platform/infrastructure services (Managed Slurm, Kubernetes, Instances, Compute, Networking), targeting AI
      training, fine-tuning, and inference workloads.
    type: company-claimed
    topic: products
    sourceRefs:
      - SO001
      - SO025
    confidence: medium
    freshness: current
    answersQuestionRefs:
