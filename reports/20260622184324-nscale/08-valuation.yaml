  - id: comparable-analysis
    title: Comparable analysis and public-market anchors
    body: >-
      The most useful external anchor for Nscale is CoreWeave, because it combines NVIDIA alignment, GPU cloud exposure,
      hyperscaler-style customer concentration, and very large capital requirements. CoreWeave's March 2025 IPO valuation
      of approximately $23 billion on roughly $5 billion of annualized revenue implied about 4.6x EV/ARR, and by Q1 2026
      CoreWeave reported $2.078 billion of quarterly revenue plus a $99.4 billion backlog, demonstrating how large a real
      revenue denominator can become once GPU capacity is accepted and monetized. Applied to Nscale's $14.6 billion mark,
      that benchmark implies a required ARR base of roughly $3.2 billion. Nebius, Lambda, and Crusoe provide secondary
      context: Nebius is the nearest public European AI cloud benchmark, while Lambda and Crusoe show how private neocloud
      and power-first infrastructure businesses have been financed below or around Nscale's mark, generally with more
      modest public evidence on revenue support. The comparable set therefore does not prove that Nscale is impossible to
      grow into, but it does show that the current price already assumes Nscale will translate GPU commitments into very
      large revenue quickly, without the public disclosures that investors would normally require to verify that thesis.
    claimRefs:
      - CV009
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
    tableRefs:
      - TV004

  - id: bull-base-bear
    title: Bull, base, and bear valuation ranges
    body: >-
      Scenario analysis is unavoidable because the valuation denominator is not public. The bull case assumes Nscale can
      confirm more than $1 billion of ARR in the second half of 2026, keep Microsoft deployments on schedule, add at least
      one additional anchor beyond Microsoft, and preserve a premium multiple through an IPO window in 2026 or 2027. In
      that path, a valuation range of roughly $20-25 billion is supportable and the current mark can work. The base case is
      more conservative and more consistent with a partially delivered infrastructure pipeline: $500-750 million of ARR by
      the end of 2026, continued execution in Norway and Portugal, and a delayed but still viable IPO pathway in 2027-2028,
      which points to approximately $8-12 billion of fair value. The bear case combines the risks already visible in the
      evidence base: planning delays at Loughton, slower revenue conversion from contracted GPU capacity, and refinancing
      pressure from the $2.19 billion debt stack. Under that combination, fair value can compress into the $3-5 billion
      range and force a down-round discussion. The asymmetry therefore remains unfavorable at the current entry price.
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV013
      - CV014
      - CV044
    tableRefs:
      - TV003
    figureRefs:
      - FV003

  - id: recommendation-diligence
    title: Recommendation, thesis balance, and final diligence asks
    body: >-
      The recommended posture is track, not buy. Nscale has built a serious infrastructure narrative: Microsoft anchor
      demand, Norwegian hydro-powered capacity, elite investors, Goldman Sachs and JPMorgan placement-agent involvement,
      and a reconstituted board with Sheryl Sandberg, Susan Decker, and Nick Clegg all support the idea that this company
      may be preparing for a public listing and could become a meaningful European AI infrastructure champion. But the
      anti-thesis is still decisive at the current price. No revenue, ARR, margin, EBITDA, or cash balance has been made
      public. Customer concentration appears heavily skewed to Microsoft. Loughton planning remains unresolved, and the
      debt layer introduces leverage risk before the public record shows a matching revenue base. For an investment
      committee, the practical next steps are straightforward: require audited revenue and gross margin disclosure,
      understand covenant terms and collateral mechanics on the debt stack, confirm customer concentration and backlog by
      contract, and monitor whether an IPO filing or equivalent private disclosure provides the financial denominator that
      the current valuation still lacks. Until then, Nscale deserves close tracking but not fresh underwriting at $14.6
      billion.
    claimRefs:
      - CV010
