company:
  name: Nscale
chapter:
  number: 8
  title: Valuation
  summary: >-
    Nscale has achieved one of the fastest capital formation stories in European AI infrastructure, raising a disclosed
    roughly $3.7 billion of equity and layering on approximately $2.19 billion of known debt while securing Microsoft as
    the anchor customer for more than 200,000 committed GPUs across Europe and the US. That strategic quality is real,
    but the March 2026 $14.6 billion post-money valuation is stretched against public comparable evidence because Nscale
    has disclosed no revenue, ARR, gross margin, EBITDA, or cash data. At the 4.6x EV/ARR benchmark implied by
    CoreWeave's IPO, Nscale would need about $3.2 billion of ARR to justify the mark. The recommendation is track:
    monitor closely for IPO filing, audited revenue confirmation, and planning resolution at Loughton before underwriting
    new money at the current valuation.

sections:
  - id: valuation-context
    title: Valuation context and financing stack
    body: >-
      Nscale's valuation case begins with extraordinary scale in capital formation and customer validation rather than
      with disclosed financial output. The company raised a $155 million Series A in January 2025, a $1.1 billion Series B
      in September 2025, and a $2 billion Series C in March 2026 at a $14.6 billion post-money valuation, while public
      reporting indicates the Series C total included a $433 million pre-Series C SAFE closed in October 2025. That equity
      stack sits alongside a $1.4 billion GPU-backed delayed draw term loan and a $790 million Norwegian bank facility for
      Narvik, bringing the total known capital base to roughly $5.9 billion. Demand evidence is unusually strong for a
      company with no public financial disclosures: Microsoft is the anchor for approximately 212,000 or more committed
      GPUs, OpenAI is the initial offtaker for Stargate Norway, and BT provides a UK enterprise distribution path. The
      market backdrop is also favorable, with IDC projecting AI infrastructure spending past $1 trillion by 2029 and Bain
      arguing in June 2026 that power availability has become the critical bottleneck. The valuation debate therefore is
      not whether Nscale addresses a real market, but whether the current mark already prices in a revenue ramp that the
      public record still cannot verify.
