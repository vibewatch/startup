callouts:
  - calloutType: recommendation
    title: "Current call: track — not buy"
    body: >-
      Nscale is a serious AI infrastructure platform with compelling customer proof, institutional capital, and a genuine
      power moat in European AI. The evidence does not support buying at $14.6 billion because the mark outruns confirmed
      revenue and the $2.19 billion debt stack amplifies downside if GPU deployments are delayed. Upgrade to buy when
      audited ARR is confirmed above $1 billion, gross margins are disclosed, and the Loughton planning risk is resolved.
    claimRefs:
      - CV009
      - CV012
      - CV013
      - CV041

  - calloutType: strength
    title: Microsoft anchor and NVIDIA backing de-risk near-term demand
    body: >-
      Three successive GPU expansion agreements with Microsoft in October 2025, April 2026, and May 2026 confirm that
      demand is real and growing. NVIDIA's participation across two consecutive rounds provides both supply-chain comfort
      and technical validation. Together, these relationships represent the strongest customer and supplier proof visible
      in European AI infrastructure.
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV043

  - calloutType: risk
    title: Pre-revenue $14.6B mark and $2.19B leverage are the dominant risks
    body: >-
      Nscale has disclosed zero revenue, ARR, or margin data. The $14.6B valuation at a pre-disclosure stage is the most
      aggressive mark in European startup history and requires flawless GPU deployment execution to justify. The roughly
      $2.19 billion debt layer amplifies downside if deployments are delayed by planning blockers, construction risk, or
      GPU supply and utilization disruption.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV012
      - CV013

  - calloutType: assumption
    title: Base case assumes $500-750M ARR ramp by end of 2026
    body: >-
      The entire valuation framework depends on Nscale demonstrating that contracted GPU capacity translates into
      recognized revenue at scale. If 2026 ARR comes in below $400 million, which remains plausible given the multi-quarter
      ramp periods on much of the announced capacity, the base case degrades toward the bear case and the $14.6B mark may
      prove to be a substantial overshoot requiring a down-round.
    claimRefs:
      - CV040
      - CV041

