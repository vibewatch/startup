figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The track recommendation flows from strong Microsoft anchor proof and institutional capital meeting a stretched
      $14.6B pre-revenue mark and absent financial disclosure, with IPO or revenue confirmation as the primary upgrade
      trigger.
    data:
      nodes:
        - id: microsoft-anchor
          label: Microsoft 200K+ GPU anchor
          detail: Oct 2025 deal plus April and May 2026 Rubin expansions make Microsoft the primary demand anchor for near-term GPU capacity.
          tone: positive
        - id: institutional-capital
          label: $5.9B capital stack assembled
          detail: Roughly $3.7B equity plus about $2.19B debt from high-profile investors and lenders validates Nscale's ability to finance hyperscale buildout.
          tone: positive
        - id: power-moat
          label: Norwegian hydro and EU sovereign moat
          detail: Narvik and related Norway assets provide renewable-power positioning at a time when power availability has become the sector bottleneck.
          tone: positive
        - id: no-revenue
          label: Zero revenue or ARR disclosure
          detail: No audited revenue, ARR, gross margin, or EBITDA figures are public as of June 22, 2026.
          tone: warning
        - id: planning-risk
          label: Loughton planning objection
          detail: The UK site faces a fresh planning process and revised timing to Q2 2027, creating an execution overhang on one Microsoft location.
          tone: warning
        - id: leverage
          label: $2.19B drawn debt against pre-revenue base
          detail: GPU-backed and project-finance facilities magnify downside if GPU deployment or utilization slips.
          tone: warning
        - id: valuation-mark
          label: $14.6B mark requires ~$3.2B ARR
          detail: Using CoreWeave's IPO benchmark of roughly 4.6x EV/ARR, Nscale needs about $3.2B of ARR to support the current valuation.
          tone: warning
        - id: recommendation
          label: TRACK — monitor for IPO and revenue confirmation
          detail: Strategic quality is high, but underwriting conviction requires audited ARR, margin disclosure, and planning resolution.
          tone: neutral
      edges:
        - {from: microsoft-anchor, to: valuation-mark, label: supports premium}
        - {from: institutional-capital, to: valuation-mark, label: validates scale}
        - {from: power-moat, to: valuation-mark, label: justifies moat premium}
        - {from: no-revenue, to: recommendation, label: blocks buy conviction}
        - {from: planning-risk, to: recommendation, label: creates execution overhang}
        - {from: leverage, to: recommendation, label: amplifies downside risk}
        - {from: valuation-mark, to: recommendation, label: stretched vs public comps}
    approximationNotes: >-
      Flow captures the recommendation logic rather than a quantitative model and reflects the public evidence base as of
      2026-06-22.
    claimRefs:
      - CV001
      - CV009
      - CV011
      - CV012
      - CV013
      - CV031

  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      At a CoreWeave IPO benchmark of 4.6x ARR, Nscale's $14.6B valuation requires about $3.2B ARR; at a premium 8x
      multiple, about $1.8B ARR suffices; even at 12x, about $1.2B ARR is needed, all well above any publicly confirmed
      revenue figure.
    data:
      items:
        - label: ARR needed at 4.6x (CoreWeave IPO)
          value: 3.2
          detail: At CoreWeave's March 2025 IPO benchmark of 4.6x EV/ARR, Nscale needs about $3.2B ARR to justify $14.6B.
          tone: negative
        - label: ARR needed at 6x (premium infra)
          value: 2.4
          detail: At a premium infrastructure multiple of 6x, Nscale needs about $2.4B ARR to support the current valuation.
          tone: negative
        - label: ARR needed at 8x (high-growth)
          value: 1.8
          detail: At an 8x multiple consistent with very strong GPU cloud growth, Nscale still needs about $1.8B ARR.
          tone: warning
        - label: ARR needed at 10x (frontier premium)
          value: 1.5
          detail: At 10x ARR, about $1.46B ARR is required, which is only plausible if deployments convert rapidly through 2027.
          tone: warning
        - label: ARR needed at 12x (max premium)
          value: 1.2
          detail: Even at a frontier 12x revenue multiple, Nscale still needs about $1.2B of ARR to support the mark.
          tone: neutral
        - label: Confirmed revenue none disclosed
          value: 0.0
          detail: No public revenue or ARR figure exists as of June 2026; the bar represents disclosure absence rather than literal zero activity.
          tone: negative
    approximationNotes: >-
      ARR-to-valuation bridges are simple EV/ARR calculations at stated multiples rather than discounted cash flow
      outputs, and all ARR figures are scenario illustrations given the absence of Nscale public revenue disclosure.
    claimRefs:
      - CV009
      - CV011
      - CV012
      - CV022
      - CV023

