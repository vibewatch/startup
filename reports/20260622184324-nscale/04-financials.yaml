          to: "contract"
          label: "Enterprise negotiation"
        - from: "contract"
          to: "dc-build"
          label: "Construction trigger"
        - from: "dc-build"
          to: "gpu-deploy"
          label: "Delivery milestone"
        - from: "gpu-deploy"
          to: "revenue"
          label: "Accepted capacity → revenue"
        - from: "customer"
          to: "cloud-api"
          label: "Self-service / API usage"
        - from: "cloud-api"
          to: "revenue"
          label: "Usage-based billing"
    approximationNotes: "Revenue recognition mechanism (milestone vs. ratable subscription) has not been confirmed publicly. Edge labels are inferred from deal structure described in press releases. No revenue amount is disclosed."
