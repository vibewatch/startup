schemaVersion: "report-v2"
artifact: "financials"
slug: "nscale"
runDate: "2026-06-22"
company:
  name: "Nscale"
chapter:
  number: 4
  title: "Financials"
  summary: >
    Nscale has assembled a multi-billion-dollar capital stack — $1.1B Series B (Sep 2025), $2B Series C at $14.6B valuation
    (Mar 2026), a $1.4B GPU-backed Delayed Draw Term Loan (Feb 2026), and $790M Norwegian bank financing (May 2026) — in
    support of a Microsoft-anchored hyperscale GPU delivery pipeline spanning Norway, UK, Portugal, and the US. No revenue,
    gross margin, cash position, or unit economics have been publicly disclosed; the company is operationally pre-revenue
    on most contracted capacity through mid-2026, and underwriting is currently blocked by the absence of audited financials,
    realized pricing, and covenant terms on approximately $2.19B in known debt.

sections:
  - id: revenue-model
    title: Revenue Model and Streams
    body: >
      Nscale's business model is GPU compute-as-a-service combined with long-term hyperscale infrastructure capacity delivery.
      Customers receive access to NVIDIA GPU clusters for AI training, fine-tuning, and inference — billed on a GPU-hour or
      reserved-capacity basis — supplemented by managed networking, storage, and orchestration software that Nscale owns
      end-to-end in a vertically integrated stack. The company does not operate a public self-service cloud with published
      pricing; instead, the dominant commercial channel is direct enterprise and government contracts, with Microsoft as the
      sole publicly named anchor customer.

      The Microsoft relationship is the financial spine of Nscale's near-term revenue profile. The October 2025 deal covers
      approximately 200,000 NVIDIA GB300 GPUs across Texas (~104,000 GPUs, Q3 2026), Portugal (~12,600 GPUs, Q1 2026),
      Norway (~52,000 GPUs), and Loughton UK (~23,000 GPUs, Q1 2027 delayed to Q2 2027). A March 2026 LOI extends the
      relationship to a potential 1.35 GW at the West Virginia Monarch campus from late 2027. The April 2026 Norway expansion
      adds 30,000+ Nvidia Rubin GPUs, and a post-Q1 2026 Portugal expansion added 66,000+ Rubin GPUs for a second 200 MW
      building at Start Campus Sines.

      Revenue recognition for infrastructure capacity contracts of this type is milestone-driven rather than subscription-SaaS:
      revenue accrues as deployed GPU capacity is accepted and utilised by the customer. Delays in construction or GPU
      delivery postpone recognition. Nscale has disclosed no revenue, ARR, traction metrics, or customer count as of the
      run date; the business is operationally pre-revenue on most committed capacity through mid-2026 with limited realized
      revenue visible in the public record.
    claimRefs: [CI001, CI004, CI005, CI006, CI007, CI008, CI009, CI031, CI040, CI042]
    tableRefs: [TI001]
    figureRefs: [FI001]

  - id: pricing-unit-economics
    title: Pricing Visibility and Unit Economics
    body: >
      Nscale does not publish list pricing for GPU compute on its website as of June 2026, departing from the practice of
      neocloud peers CoreWeave, Lambda Labs, and Nebius — all of which publish per-GPU-hour rates. Enterprise deals are
      structured privately, which means realized pricing, volume discount depth, contract duration, and renewal escalators
      are not in the public domain. This absence makes independent verification of Nscale's revenue per deployed GPU-hour
      impossible at the pre-diligence stage.

      The neocloud peer landscape provides the closest available unit economics proxies. CoreWeave, now public, reported
      Q1 2026 revenue of $2.078 billion (up 112% YoY) and a revenue backlog of $99.4 billion as of March 31, 2026, implying
      long-term contracted revenue at scale. Nebius Group also reported Q1 2026 results and announced 1.2 GW of secured
      power in Pennsylvania, demonstrating the capital intensity of the sector. GPU spot market H100 rates have compressed
      significantly from approximately $8/GPU-hr in 2023 to approximately $2–3/GPU-hr by late 2024, driven by neocloud
      supply expansion, creating a pricing floor that constrains unreserved on-demand revenue.

      Nscale's cost-side advantage lies in its Northern Norway positioning. The Narvik and Glomfjord sites benefit from
      hydropower electricity prices significantly below the European average, improving energy cost of goods per GPU-hour
      relative to continental or UK peers. However, no PUE figures, blended energy cost per kWh, GPU utilization rates,
      or gross margin estimates have been disclosed. Data center capex benchmarks suggest $10–15M per MW for hyperscale
      AI-optimized facilities, implying that Nscale's 1.3+ GW committed pipeline represents $13–20+ billion in total
      capital deployment over multiple years — a figure that frames the critical importance of capex-to-revenue efficiency
      that cannot yet be assessed.
    claimRefs: [CI013, CI014, CI015, CI016, CI017, CI026, CI032, CI036, CI037]
    tableRefs: [TI002, TI003]
    figureRefs: [FI004]

  - id: capital-structure
    title: Capital Structure and Financing Dependency
    body: >
      Nscale has assembled a multi-layered capital structure characteristic of large-scale data center project developers.
      On the equity side, the $1.1B Series B (September 2025, led by Aker ASA with NVIDIA, Nokia, Dell, Fidelity, Blue Owl,
      G Squared, and Point72) was followed by a $2B Series C in March 2026, the largest equity raise in European history
      per the company, valuing Nscale at $14.6B. The Series C included a $433M pre-Series C SAFE closed in October 2025
      (backed by Blue Owl, Dell, Nvidia, Nokia), with the balance raised at closing. Aker committed $285M in the Series B
      for 9.3% fully diluted ownership, and the Aker-Nscale joint venture for Norway was rolled fully into Nscale as part
      of the Series C. Goldman Sachs and J.P. Morgan served as joint placement agents for the Series C, and CEO Josh Payne
      told the New York Times in March 2026 that an IPO was possible "as early as this year."

      On the debt side, Nscale closed a $1.4 billion delayed draw term loan (DDTL) in February 2026 backed by its GPU fleet,
      and secured $790M in Norwegian bank financing (ABN AMRO, DNB, Eksfin, Nordea, SEB) in May 2026 for the Narvik data
      center, with an additional $790M uncommitted accordion for a further 115MW. Total disclosed debt obligations stand at
      approximately $2.19B, with the GPU-collateral structure of the DDTL creating mark-to-market risk if GPU values decline
      or spot market prices compress further. Covenant terms, debt service coverage ratios, and LTV requirements for both
      facilities are not publicly disclosed.
    claimRefs: [CI002, CI003, CI010, CI011, CI012, CI021, CI022, CI023, CI024, CI025, CI038]
    tableRefs: [TI004]
    figureRefs: [FI002, FI003]

  - id: project-finance-capex
    title: Project Finance and Capex Exposure
    body: >
      Nscale's pipeline spans six active geographies: operational capacity at Glomfjord (Norway), live Portugal deployment
      at Start Campus Sines, Texas campus (~240MW, leased from Ionic Digital) delivering from Q3 2026, Norway Narvik 230MW
      campus targeting 100,000 GPU deployment by end-2026, Loughton UK (50MW, delayed to Q2 2027), and the West Virginia
      Monarch campus (LOI up to 1.35 GW, starting late 2027). The Norway Narvik campus is supported by the $790M bank
      financing facility. The Portugal expansion adds €695M in disclosed investment commitments (€230M shared infrastructure
      plus €465M for a second 200MW building). Sam Huckaby, appointed President of Data Centers in 2026 after a career at
      Oracle OCI and Vantage Data Centers, oversees the global build program.

      The BT partnership announced in April 2026 adds a complementary sovereign AI channel: Nscale will build up to 14 MW
      across three existing BT UK sites for private and public sector customers, providing a lighter-footprint distributed
      deployment alongside the large-scale campus model. AI infrastructure spending globally reached $318B in 2025 per IDC
      and is projected to surpass $1T by 2029, validating the demand backdrop, but power availability is now the binding
      constraint per both IEA and Bain research. Nscale's UK Loughton site is already navigating power-grid objections
      from Loughton Town Council, adding execution risk to the UK contribution of the Microsoft contract.
    claimRefs: [CI026, CI027, CI028, CI034, CI035, CI036, CI039, CI041]

  - id: financial-gaps-verdict
    title: Financial Gaps and Underwriting Verdict
    body: >
      Nscale's financial profile is structurally opaque for pre-diligence underwriting purposes. The company has no SEC
      reporting obligations and has filed no financial statements in the public domain beyond the Companies House annual
      accounts (last filed for year ending December 31, 2024; 2025 accounts due September 30, 2026 and not yet available).
      NSCALE GLOBAL HOLDINGS LIMITED (Companies House 15749408) has an overdue confirmation statement as of the run date.
      NSCALE LIMITED (16925886), incorporated December 22, 2025, is the apparent operating entity but has no filed accounts.
      No audited financials, management accounts, or investor presentations are publicly accessible.

      The key financial underwriting blockers are: (1) absence of gross margin disclosure for GPU cloud and infrastructure
      contracts — the revenue mix between on-demand GPU-hr, reserved capacity, and construction-and-leaseback is unknown;
      (2) no realized pricing per GPU-hr, meaning the Microsoft deal economics cannot be modeled from the public record;
      (3) no cash on hand or monthly burn rate, making runway post-Series C unverifiable; (4) unknown covenant terms and
      debt service coverage on $2.19B of debt, exposing the company to accelerated repayment or covenant breach risk;
      (5) customer concentration overwhelmingly in Microsoft across all major geographies, with limited evidence of
      revenue diversification. The planning and permitting delays at Loughton — now requiring a fresh application — add
      a schedule risk overlay to the UK tranche of the Microsoft contract. Without data-room access, this chapter can
      confirm capital was raised but cannot affirm that the business is financially sound at its current stage.
    claimRefs: [CI009, CI018, CI019, CI020, CI029, CI030, CI033, CI043, CI044]
    tableRefs: [TI005]

