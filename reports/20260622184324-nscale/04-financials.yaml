    title: Nscale Revenue Model — Customer Demand to Recognized Revenue
    type: flow
    layout: standard
    summary: How enterprise and sovereign customer compute demand flows through Nscale's vertically integrated stack to contracted capacity delivery and eventual revenue recognition.
    data:
      nodes:
        - id: "customer"
          label: "Enterprise / Sovereign Customer"
          detail: "Hyperscalers (Microsoft), governments (OpenAI Norway, BT sovereign AI), enterprises seeking AI compute"
        - id: "contract"
          label: "Capacity Contract"
          detail: "Multi-year GPU delivery agreement; pricing, volumes, and take-or-pay vs utilization terms negotiated privately"
        - id: "dc-build"
          label: "Data Center Construction"
          detail: "Nscale-owned or leased campuses: Narvik, Texas, Loughton, Sines; capex est. $10–15M/MW industry benchmark"
        - id: "gpu-deploy"
          label: "GPU Deployment"
          detail: "NVIDIA GB300/Rubin clusters delivered and accepted; milestone triggers revenue recognition"
        - id: "cloud-api"
          label: "Cloud API / Managed Services"
          detail: "Inference endpoints, fine-tuning APIs, AI Studio, private cloud — secondary revenue channel"
        - id: "revenue"
          label: "Recognized Revenue"
          detail: "Not disclosed publicly; milestone-based vs. subscription TBD; no ARR, GMV, or revenue figure in public domain"
      edges:
