  evidenceGaps:
    - type: missing-source
      severity: material
      topic: throughput-benchmarks
      missingEvidence: "Independent GPU throughput or model FLOP utilisation (MFU) benchmarks for Nscale clusters, comparable to published results for CoreWeave or Lambda clusters."
      whyItMatters: "Without third-party benchmarks, enterprise buyers cannot verify Nscale's GPU efficiency claims or compare compute value vs peers."
      diligencePath: "Request production MFU or job completion metrics from Nscale for a representative training run; compare to published CoreWeave/Lambda benchmarks."
      relatedQuestionRefs: [QE023]

    - type: missing-source
      severity: material
      topic: reliability-sla
      missingEvidence: "Published SLA terms, uptime track record, or reliability metrics for Nscale's inference endpoints, NKS, and data centers."
      whyItMatters: "Enterprise and regulated buyers require contractual SLA commitments; the absence limits addressable market and creates churn risk."
      diligencePath: "Review enterprise MSA/SLA documentation; check status.nscale.com or equivalent; request incident history."
      relatedQuestionRefs: [QE024]

    - type: missing-source
      severity: material
      topic: security-certifications
      missingEvidence: "Public disclosure of ISO 27001, SOC 2 Type II, ISO 42001, or equivalent third-party security and AI management certifications for Nscale's platform."
      whyItMatters: "Enterprise buyers in finance, healthcare, and government typically require SOC 2 Type II as a baseline; its absence limits addressable market."
      diligencePath: "Request certification documentation directly from Nscale; check UKAS, ANAB, or equivalent certification databases for Nscale entity names."
      relatedQuestionRefs: [QE020]

    - type: private-evidence-only
      severity: minor
      topic: uni-platform-adoption
      missingEvidence: "Production deployment metrics (customer count, workloads running) for Nscale's uni-kubernetes, uni-compute, and uni-region platform repos."
      whyItMatters: "Star counts and commit activity show public engineering investment but do not confirm production adoption or scale of the orchestration platform."
      diligencePath: "Review GitHub issue activity, pull request history, and release notes; ask Nscale for customer adoption metrics for the platform layer."
      relatedQuestionRefs: [QE027]

    - type: missing-source
      severity: minor
      topic: sovereign-ai-comparison
      missingEvidence: "Technical comparison between Nscale's sovereign AI design and hyperscaler offerings (e.g. Azure Sovereign Cloud, AWS GovCloud) on data residency, key management, and compliance scope."
      whyItMatters: "Buyers evaluating sovereign AI platforms need to compare feature depth; Nscale's sovereignty proposition relies primarily on physical location and company-level assertions rather than published certification frameworks."
      diligencePath: "Obtain Nscale's sovereignty architecture whitepaper or compliance framework documentation; compare published controls to hyperscaler sovereign offerings."
      relatedQuestionRefs: [QE025]

    - type: missing-source
      severity: minor
      topic: software-stack-comparison
      missingEvidence: "Technical feature comparison between Nscale's software platform (NKS, Managed Slurm, Fleet Ops) and CoreWeave's Mission Control orchestration layer including SLA depth, autoscaling behaviour, and developer experience benchmarks."
      whyItMatters: "Enterprise buyers selecting a neocloud need to compare feature depth and operational reliability; Nscale's claims are company-stated without third-party comparative validation."
      diligencePath: "Review CoreWeave Mission Control public documentation; run side-by-side API tests; request Nscale independent customer references for platform reliability."
      relatedQuestionRefs: [QE028]

