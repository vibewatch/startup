company:
  name: Nscale
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Nscale delivers a vertically integrated AI infrastructure platform spanning owned data centers,
    NVIDIA GPU compute, RDMA/InfiniBand networking, distributed storage, and a software layer of
    inference endpoints, fine-tuning APIs, managed Slurm, Kubernetes, and fleet-operations tooling.
    Operational highlights include the 30 MW Glomfjord hydro-powered campus and an aggressive
    buildout spanning Norway, the UK, Texas, Portugal, and the 1.35 GW West Virginia Monarch campus.
    NVIDIA GB300 Blackwell GPUs are in active multi-site deployment; NVIDIA Vera Rubin NVL72 is
    contracted for 2027, making Nscale the first European non-Microsoft deployer. Developer presence
    on HuggingFace (~2.6 M monthly requests) and GitHub (nscaledev org, 2,280-star pydantic-ai fork)
    shows growing adoption. Key gaps: no public ISO or SOC 2 certifications disclosed, the Loughton
    campus faces material planning delays, and no independent throughput benchmarks have been published.

sections:
  - id: platform-overview
    title: Customer Service Workflow and Full-Stack Platform
    body: >
      Nscale markets itself as a vertically integrated AI cloud, meaning a customer
      can purchase everything from raw GPU bare metal through to serverless inference without
      leaving the platform. The customer journey begins at the infrastructure tier — GPU compute
      accessible as bare-metal nodes, virtual machines, or orchestrated clusters — and extends
      up through AI-native managed services. Inference Endpoints provide a serverless LLM API
      that allows customers to call a model without provisioning or managing servers; Fine-tuning
      allows customers to adapt open-source models to their domain via an API-driven pipeline;
      and Prompt Workbench offers a browser-based interface for rapid prompt iteration and real-time
      model feedback. For customers running large-scale training or batch jobs, Managed Slurm (using
      NVIDIA's Slinky scheduler running Slurm on Kubernetes) and Nscale Kubernetes Service (NKS)
      handle orchestration, with NKS provisioning isolated GPU-aware clusters in under two minutes.
      Instances (bare metal or VMs) support customers requiring maximum GPU throughput. Fleet
      Operations tools — Control Center for lifecycle management, Observability for cross-stack
      telemetry, and Radar API for real-time GPU availability and maintenance notices — complete the
      platform. Nscale's inference service has grown 148× and serves more than 5,000 users as of
      its Vera Rubin announcement in 2026. HuggingFace lists Nscale as a verified Inference Provider
      with approximately 2.59 million monthly requests, providing an independent read on developer
      adoption at platform scale. The platform is designed to reduce time-to-first-token and to let
      customers move from proof-of-concept to production without rebuilding infrastructure.
    claimRefs: [CE001, CE017, CE018, CE019, CE020, CE021, CE022, CE023]
    tableRefs: [TE002]
    figureRefs: [FE002]

  - id: datacenter-portfolio
    title: Data Center and Physical Infrastructure Portfolio
    body: >
      Nscale's physical footprint is its most differentiated asset: owned-and-operated hyperscale
      campuses anchored in low-cost renewable power, supplemented by partner-site colocation and a
      growing North American campus pipeline. The operational flagship is Glomfjord, Norway — 30 MW
      of live capacity powered by 100% hydro renewable energy from the region's oversupply of
      hydropower dams, with expandability to 60 MW. Adiabatic cooling leverages the Arctic climate,
      and redundant low-latency fibre provides dual-path connectivity. In construction is the Narvik
      AI campus (Kvandal, 230 MW), originally designated as Stargate Norway with OpenAI and Aker ASA,
      now principally serving Microsoft. A secondary 250 MW facility in Korgen, also near Narvik, is
      also underway, and $790 M in project financing from ABN AMRO, DNB, Eksfin, Nordea, and SEB
      anchors the Narvik development.
      In the UK, the Loughton campus (50–90 MW, 23,040 NVIDIA GB300 GPUs for Microsoft, target
      Q1 2027) faces planning objections from Loughton Town Council, which has asked for a fresh
      planning application due to a proposed 50% capacity increase and grid-impact concerns; timeline
      has been pushed to Q2 2027. The Texas campus (~240 MW, Ionic Digital site) will host
      approximately 104,000 NVIDIA GB300 GPUs for Microsoft from Q3 2026. The West Virginia Monarch
      Compute Campus (Mason County, 2,250+ acres) is the US's first state-certified AI Microgrid,
      targeting 1.35 GW of Phase 1 AI compute using NVIDIA Vera Rubin NVL72 GPUs, with Caterpillar
      G3500 natural gas generators delivering 2 GW of grid-independent power by H1 2028; expansion
      to 8 GW+ is designed into the site. At Sines, Portugal, the Start Campus deployment includes
      12,600 NVIDIA Blackwell Ultra GPUs (first building) and 66,000+ NVIDIA Vera Rubin GPUs for
      Microsoft from late 2027, representing Nscale's largest single EU infrastructure investment
      (€695 M+). Partner-run sites include Keflavik (Iceland), Stavanger, Oslo, and Blönduós
      (Norway), Slough (UK), and North Carolina. A further facility in Harjavalta, Finland is in
      permitting, supported by Fortum's grid connection.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011, CE012, CE013, CE014, CE015, CE016, CE042, CE043, CE044]
    tableRefs: [TE001]
    figureRefs: [FE003]

  - id: software-stack
    title: Software Platform and API Architecture
    body: >
      Nscale's software stack sits between the physical GPU cluster and the application layer,
      providing orchestration, scheduling, storage, networking, observability, and inference
      primitives. The AI Services tier (Inference Endpoints, Prompt Workbench, Fine-tuning) is
      the highest-margin, easiest-to-consume surface. Inference Endpoints expose popular open-weight
      LLMs as REST APIs without requiring customers to manage infrastructure; Fine-tuning uses
      serverless, API-driven pipelines; and Prompt Workbench provides versioned prompts and real-time
      feedback. Underneath, the Platform Services tier includes Managed Slurm (NVIDIA Slinky — an
      HPC-grade batch scheduler that runs Slurm on Kubernetes, tuned for large-scale GPU workloads),
      NKS (GPU-aware scheduling, seamless autoscaling, enterprise security, under-two-minute
      provisioning), and Instances (bare metal and VMs with prebuilt AI images and optional VPC
      isolation). The Infrastructure Services tier provides Compute (raw bare metal / VMs), Networking
      (RDMA/InfiniBand/NVLink fabrics, multi-rack topology), and Storage (parallel, AI-optimised,
      GPU-tuned distributed file systems with low-latency design). Fleet Operations — Control Center,
      Observability, and Radar API — form a unified lifecycle manager that automates provisioning,
      health checks, and capacity planning. The nscaledev GitHub organisation hosts open-source
      platform components including a fork of pydantic-ai (2,280 GitHub stars, MIT license, actively
      updated as of June 2026) and uni-kubernetes, uni-compute, uni-region, uni-core, and uni-identity
      repos, demonstrating public engineering investment in the orchestration and cloud-management
      layer. Nscale is a HuggingFace verified Inference Provider with approximately 2.59 M monthly
      requests, providing an independent signal of inference platform scale and developer adoption.
    claimRefs: [CE017, CE018, CE019, CE020, CE021, CE024, CE025, CE026, CE027]
    tableRefs: [TE003]
    figureRefs: [FE001]

  - id: gpu-hardware-roadmap
    title: GPU Compute Hardware Stack and Deployment Roadmap
    body: >
      Nscale's compute stack is built entirely on NVIDIA GPU generations, with each successive
      generation deployed at hyperscale under multi-year Microsoft commitments. The currently
      deployed generation is NVIDIA Blackwell GB300 (GB300 Ultra): approximately 104,000 GPUs
      committed for the Texas campus and 12,600 for the Portugal Start Campus first building, both
      from 2026. For the Loughton campus, 23,040 NVIDIA GB300 GPUs are contracted for Q1 2027. The
      Narvik campus originally contracted 52,000 NVIDIA GB300 GPUs, now expanded to 30,000+ NVIDIA
      Vera Rubin GPUs for the 2027 phase; a prior agreement covered ~52,000 GB300 GPUs in an
      earlier tranche. In aggregate, the Microsoft deal signed in October 2025 committed approximately
      200,000 NVIDIA GB300 GPUs across Europe and the US, in collaboration with Dell.
      The 2027-generation NVIDIA Vera Rubin NVL72 platform represents a 10× inference token cost
      reduction and 4× fewer GPUs to train MoE models vs Blackwell, with sixth-generation NVLink
      at 260 TB/s per rack and hardware-accelerated confidential computing across CPU, GPU, and
      NVLink domains. Nscale was named by NVIDIA at CES as among the world's first providers to
      adopt Rubin. The West Virginia Monarch campus is designated as the global flagship deployment
      of the NVIDIA Vera Rubin DSX AI Factory reference design, with 1.35 GW of Vera Rubin compute
      targeted for delivery from late 2027. The Portugal Start Campus will host 66,000+ Rubin GPUs
      for Microsoft beginning late 2027. In Norway, the Narvik campus adds 30,000+ Rubin GPUs for
      Microsoft in 2027. Nscale's stated global GPU pipeline totals approximately 300,000 GPUs as
      of the September 2025 UK AI announcement.
    claimRefs: [CE002, CE003, CE004, CE005, CE029, CE038, CE039, CE040, CE041]
    tableRefs: [TE005]
    figureRefs: [FE004]

  - id: differentiation
    title: Differentiation and Partnership Ecosystem
    body: >
      Nscale's primary differentiation claim is vertical integration: owning the full stack from
      energy and data center real estate through GPU compute, networking, storage, orchestration,
      and AI services. This contrasts with asset-light GPU clouds (Lambda, CoreWeave public cloud)
      that lease data center space and with hyperscalers that lack sovereign, modular facilities
      in European renewable-energy markets. The renewable energy anchor in Norway (hydro surplus)
      and the modular data center design enable faster and cheaper campus stand-up than traditional
      build-to-order facilities. Nscale's partnership with NVIDIA spans hardware priority, Rubin
      DSX AI Factory reference design collaboration, and joint NVIDIA Slinky software integration.
      Nokia invested in both the Series B and Series C and announced a networking partnership
      combining Nokia's IP/optical expertise with Nscale's infrastructure platform. Dell participates
      in GPU delivery for the Microsoft contract and invested in both rounds.
      The BT collaboration (April 2026) adds 14 MW of sovereign AI across three BT UK sites,
      with NVIDIA GPU infrastructure and UK data residency compliance, making Nscale a supply
      chain partner for the UK's largest telecoms operator. BT, NVIDIA, and Nscale are founding
      members of the UK Sovereign AI Industry Forum. Stargate UK — co-established with OpenAI and
      NVIDIA — positions Nscale as a named sovereign AI infrastructure provider for the UK, with
      an initial 8,000-GPU OpenAI offtake option scaling to 31,000. The Microsoft multi-country
      relationship (UK, Norway, Portugal, US) makes Microsoft Nscale's anchor customer and provides
      a durable revenue base for infrastructure that would otherwise require diverse spot-market
      fill to sustain utilisation.
    claimRefs: [CE001, CE028, CE029, CE030, CE031, CE032, CE033, CE040, CE042]
    tableRefs: []
    figureRefs: []

  - id: trust-security-compliance
    title: Trust, Sovereignty, Security, and Compliance
    body: >
      Nscale's security posture is led by CISO Latha Maripuri, formerly of Uber, News Corp, and
      IBM, overseeing cyber, physical, and supply chain security. The company's primary compliance
      proposition is sovereign AI design: all facilities are built with local data residency
      controls, and customers in the UK and EU can contractually confine workloads within
      jurisdiction. The BT sovereign AI platform is purpose-built for UK regulatory, data residency,
      and security requirements, including healthcare, public services, energy, finance, and
      critical national infrastructure. Nscale's website footer links to a Transparency & Human
      Rights policy. As of June 2026, no public ISO 27001, ISO 42001, SOC 2, or equivalent
      third-party certifications are disclosed on the Nscale website or in press materials — a gap
      versus Crusoe (ISO 27001:2022 + ISO 42001:2023) and comparable neocloud peers. The West
      Virginia Monarch campus adds a US-sovereign design, state law protecting local ratepayers
      from cost pass-through, closed-loop cooling with zero municipal water, and enclosed
      generator setups to limit community noise impact. Planning-related risk is material at Loughton:
      local authority objections could push the timeline further and increase cost. Nscale's CISO
      appointment, sovereign AI design claims, and BT partnership each signal enterprise compliance
      intent, but the absence of published third-party audit reports means independent verification
      of the security posture is not currently possible.
    claimRefs: [CE034, CE035, CE036, CE037, CE010, CE045, CE046]
    tableRefs: [TE004]
    figureRefs: []

