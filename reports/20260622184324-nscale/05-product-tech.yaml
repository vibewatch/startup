callouts:
  - calloutType: strength
    title: "Microsoft Anchor Customer Reduces Offtake Risk Across Multiple Campuses"
    body: >
      A multi-country Microsoft commitment covering the UK, Norway, Portugal, and the US — amounting
      to approximately 200,000 NVIDIA GB300 GPUs plus 100,000+ Rubin GPUs in pipeline — provides
      Nscale with contracted revenue underpinning the majority of its near-term build programme.
      This anchor relationship de-risks asset-heavy campuses and signals deep trust from the world's
      largest cloud buyer.
    claimRefs: [CE003, CE029, CE038, CE039]

  - calloutType: strength
    title: "First European Non-Microsoft Deployer of NVIDIA Vera Rubin — Hardware Pipeline Edge"
    body: >
      Nscale's designation as one of the first global Rubin deployers, the global flagship for the
      NVIDIA DSX AI Factory reference design, and named inclusion in the NVIDIA Rubin launch partner
      list gives it early-access GPU procurement leverage. This accelerates time-to-market for
      frontier AI customers who need the next-generation compute the year it launches.
    claimRefs: [CE004, CE005, CE028, CE041]

  - calloutType: risk
    title: "Loughton Planning Delays and Broader UK Regulatory Headwinds"
    body: >
      Loughton Town Council has requested a new planning application for the 50–90 MW UK campus
      due to grid concerns and proposed capacity increases. This follows a broader pattern of
      data centre planning opposition across the UK. The timeline has already slipped from Q4 2026
      to Q2 2027 and a further delay is material given the Microsoft contractual commitment to
      have 23,040 GB300 GPUs live in Q1 2027.
    claimRefs: [CE010, CE045, CE046]

  - calloutType: risk
    title: "No Public ISO/SOC 2 Certifications Limits Enterprise Regulated-Buyer Addressability"
    body: >
      As of June 2026, Nscale has not disclosed ISO 27001, SOC 2 Type II, ISO 42001, or equivalent
      certifications. This is a material gap versus Crusoe (which holds ISO 27001:2022 and
      ISO 42001:2023) and limits Nscale's addressable market among regulated enterprise buyers in
      finance, healthcare, and government who mandate third-party security audit evidence.
    claimRefs: [CE034, CE035]

