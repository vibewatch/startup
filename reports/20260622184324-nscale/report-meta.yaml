    loan and $790M of Norway project financing with another $790M accordion available.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO005, CO008, CO011, CI003, CI025, CU001]

summary:
  headline: >-
    Nscale has assembled one of Europe's most ambitious AI infrastructure platforms, with sovereign
    AI positioning, elite investors, and Microsoft-anchored demand — but the public record still
    lacks revenue disclosure, the customer base is hyperconcentrated, leverage is rising, and UK
    planning friction keeps the current $14.6B valuation in stretched territory.
