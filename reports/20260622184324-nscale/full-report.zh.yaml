      - number: '4.4'
        title: 项目融资与 Capex 暴露
        blocks:
          - type: paragraph
            body: >
              Nscale 管线横跨六个活跃地理区域：Glomfjord（Norway）运营容量、Start Campus Sines 的 Portugal 在运部署、 Texas campus（约 240MW，从 Ionic
              Digital 租赁，2026 年 Q3 起交付）、Norway Narvik 230MW campus（目标 2026 年底前部署 100,000 块 GPU）、Loughton UK（50MW，延至 2027
              年 Q2）以及 West Virginia Monarch campus（LOI 最高 1.35 GW， 2027 年末启动）。Norway Narvik campus 有 $790M
              银行融资支持。Portugal 扩容新增 €695M 已披露投资承诺 （€230M 共享基础设施，加 €465M 建第二栋 200MW 建筑）。Sam Huckaby 曾任 Oracle OCI 和
              Vantage Data Centers 高管， 2026 年出任 President of Data Centers，负责全球建设项目。

              2026 年 4 月宣布的 BT 合作新增一条互补的主权 AI 通道：Nscale 将在三个现有 BT UK 站点建设最多 14 MW， 服务私营和公共部门客户，在大规模 campus
              模式之外提供更轻量的分布式部署。IDC 称全球 AI 基础设施支出 2025 年达到 $318B，预计 2029 年超过 $1T，需求背景被验证；但 IEA 和 Bain
