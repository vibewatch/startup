      - number: '5.3'
        title: 软件平台与 API 架构
        blocks:
          - type: paragraph
            body: >
              Nscale 的软件栈位于物理 GPU 集群和应用层之间，提供编排、调度、存储、网络、可观测性和推理 primitives。AI Services 层 （Inference Endpoints、Prompt
              Workbench、Fine-tuning）毛利最高、消费门槛最低。Inference Endpoints 将热门 open-weight LLM 暴露为 REST
              API，客户无需管理基础设施；Fine-tuning 采用 serverless、API 驱动管线；Prompt Workbench 提供版本化 prompt 和实时反馈。 底层 Platform
              Services 包括 Managed Slurm（NVIDIA Slinky——HPC 级 batch scheduler，在 Kubernetes 上运行 Slurm，针对大规模 GPU 工作负载调优）、
              NKS（感知 GPU 的调度、无缝 autoscaling、企业安全、两分钟内 provisioning）和 Instances（bare metal 与 VM，预置 AI 镜像，可选 VPC 隔离）。
              Infrastructure Services 层提供 Compute（原始 bare metal / VM）、Networking（RDMA/InfiniBand/NVLink fabrics，多机架拓扑）和
              Storage （并行、AI 优化、GPU 调优的分布式文件系统，低延迟设计）。Fleet Operations——Control Center、Observability、Radar
              API——组成统一生命周期管理器， 自动化 provisioning、健康检查和容量规划。nscaledev GitHub organisation 托管开源平台组件，包括 pydantic-ai
              fork（2,280 GitHub stars， MIT license，截至 2026 年 6 月仍活跃更新）以及
              uni-kubernetes、uni-compute、uni-region、uni-core、uni-identity repos，显示公司在编排和云管理层有公开工程投入。 Nscale 是
              HuggingFace verified Inference Provider，月请求约 2.59 M，为推理平台规模和开发者采用提供了独立信号。
