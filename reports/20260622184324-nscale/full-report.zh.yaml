  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户服务工作流与全栈平台
        blocks:
          - type: paragraph
            body: >
              Nscale 将自己定位为垂直整合 AI 云，意思是客户无需离开平台，就能从原始 GPU bare metal 一路买到 serverless 推理。 客户旅程从基础设施层开始——GPU 计算可作为
              bare-metal 节点、虚拟机或编排集群使用——再向上延伸到 AI-native 托管服务。 Inference Endpoints 提供 serverless LLM
              API，客户无需预置或管理服务器就能调用模型；Fine-tuning 让客户通过 API 驱动管线， 将开源模型适配到自身领域；Prompt Workbench 提供基于浏览器的界面，用于快速迭代 prompt
              和实时获取模型反馈。对跑大规模训练或批处理作业的客户， Managed Slurm（使用 NVIDIA 的 Slinky scheduler 在 Kubernetes 上运行 Slurm）和 Nscale
              Kubernetes Service（NKS）负责编排， NKS 可在两分钟内拉起隔离、感知 GPU 的集群。Instances（bare metal 或 VM）服务那些需要最大 GPU 吞吐的客户。Fleet
              Operations 工具补齐平台： Control Center 管生命周期，Observability 做跨栈 telemetry，Radar API 提供实时 GPU 可用性和维护通知。到 2026 年
              Vera Rubin 公告时， Nscale 推理服务增长 148×，服务超过 5,000 名用户。HuggingFace 将 Nscale 列为 verified Inference Provider，月请求约
              2.59 million， 为平台级开发者采用提供了独立读数。平台设计目标是缩短 time-to-first-token，并让客户无需重建基础设施，就能从 proof-of-concept 走到生产。
