      - number: '6.2'
        title: 具名客户部署与证据质量
        blocks:
          - type: paragraph
            body: >
              Microsoft 承诺是 Nscale 已披露客户关系中证据最强的一项。2025 年 10 月新闻稿——附有 Microsoft Business Development and Ventures 总裁 Jon
              Tinter 的高管引述——确认约 200,000 块 NVIDIA GB300 GPU 覆盖四个 Nscale 站点，Dell Technologies 担任硬件集成商。Microsoft 累计 GPU
              承诺至少 282,000 块，覆盖所有已宣布协议（2025 年 10 月 200,000 块 GB300、2026 年 4 月 Norway 30,000+ 块 Rubin GPU、2026 年 5 月
              Portugal 66,000+ 块 Rubin GPU），West Virginia LOI 又增加 1.35 GW 管线。交易价值被独立估算约 $14 billion（The Next Web，2026 年
              4 月）。 Microsoft 正在 Norway Narvik campus、Portugal Start Campus、UK Loughton campus 和 Texas site 部署计算，全部使用
              Nscale 托管 AI 基础设施服务。

              BT Group 是第二个具名锚点，既有联合新闻稿确认，也有 BT Business CEO Jon James 的明确引述，并由 BT newsroom 于 2026 年 4 月 23 日发布独立公告。 BT
              将提供连接基础设施；Nscale 将在三个未披露的 BT 网络交换站点建设模块化 NVIDIA-powered AI 数据中心。用例覆盖医疗、金融、能源和公共服务， 并满足 UK 数据驻留要求。BT CEO
              的直接引述——「The development of AI and data centre infrastructure is key to unlocking economic growth in the
              UK」—— 是 Nscale 已披露客户名单中最强的客户级公开背书。

              OpenAI 的角色已经发生实质变化。OpenAI 最初是 Stargate Norway 的主要 offtaker（2025 年 7 月宣布，目标到 2026 年底部署 100,000 块 GPU）， 后来退出
              Norway 交易；Microsoft 取代其成为锚定租户。OpenAI 也暂停了 UK Stargate 计划（2025 年 9 月与 Nscale、Nvidia 在 North East England
              站点宣布：约 8,000 块 GPU，可扩至 31,000 块），理由是 UK 电力成本是美国四倍、版权监管未解决。这些退出对 Nscale 客户质量叙事不利： OpenAI 不再是任何 Nscale
              站点的直接签约承诺客户，尽管 Microsoft 可能间接向 OpenAI 提供由 Nscale 承载的计算。

              Nscale 推理平台声称有 5,000+ 用户、规模扩大 148×（来自 Vera Rubin 新闻稿），但没有独立来源确认任一数字。推理分部没有公开具名企业客户。 平台列出的能力包括 Inference
              Endpoints、Managed Slurm、Kubernetes 和 bare metal，定位于开发者和企业 ML 工作负载。Nscale 是「a top provider on public
              inference marketplaces」的说法，也未被第三方来源验证。
