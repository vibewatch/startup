  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 关键假设
      - 估值逻辑
      - 概率信号
    rows:
      - - 牛市
        - >-
          Nscale 在 2026 年 H2 确认 $1B+ ARR；Loughton 获规划批准并于 2027 年 Q2 开业；2026-2027 年 IPO，按未来 ARR 12-15x 定价；除 Microsoft
          外签下第二个锚定客户
        - $1B × 12x = $12B；$2B 2027 ARR × 12x = $24B；以 $14.6B 入场价持有 3-4 年至 IPO，回报 1.0-1.6x
        - 低至中：需要在 18 个月内确认收入、解决规划并完成 IPO
      - - 基准
        - 收入爬坡较慢，2026 年底 ARR 为 $500-750M；GPU 部署按计划推进；2027-2028 年 IPO，按 ARR 10-14x 定价；Loughton 延迟但未受阻
        - $500M × 10x = $5B；$750M × 14x = $10.5B；较当前 $14.6B 估值略有折价；入场价下基本持平至小幅亏损
        - 中：在 Series C 前收入状态下，最符合已签约 GPU 产能爬坡时间线
      - - 熊市
        - 收入爬坡低于 $400M ARR；Loughton 规划受阻或大幅延迟；债务契约承压；欧洲数据中心反对加剧；2028 年前无 IPO
        - $400M × 5x = $2B；$300M × 6x = $1.8B；较 $14.6B 入场估值下行 65-85%；若需要更多资本，存在下轮降估值融资风险
        - 低至中：规划失败和收入不及预期必须与杠杆压力同时出现；以现有证据看并非不可能
    notes: 估值倍数是 EV/ARR 情景示例，用于投资委员会讨论；不是 DCF 输出。所有 ARR 数字都是估算，因为 Nscale 未公开财务披露。
    claimRefs:
      - CV009
      - CV039
      - CV040
      - CV041
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 阶段 / 市场
      - 收入或 ARR
      - 估值与倍数
      - 与 Nscale 的相关性
      - 主要限制
    enumerationScope:
      coverage: partial
      basis: >-
        Covers publicly disclosed or analyst-estimated valuations for GPU cloud and AI infrastructure peers as of June
        2026, based on SEC and Companies House filings, earnings releases, and financial news reporting. Excludes
        private companies with no credible public valuation anchor and earlier-stage AI cloud startups without
        comparable GPU pipeline scale.
    rows:
      - - CoreWeave
        - '上市公司（NASDAQ: CRWV，2025 年 3 月 IPO）'
        - IPO 时 ARR 约 $5B；2026 年 Q1 收入 $2.078B（年化约 $8.3B）
        - IPO 估值 $23B；IPO 时约 4.6x ARR；上市后倍数压缩；2026 年 Q1 未履约收入为 $99.4B
        - 最接近的上市可比公司；NVIDIA 支持的 GPU 云，新型云模式相似，扩张很快，客户包括大型超大规模云厂商
        - 没有自有可再生电力护城河；以美国为中心；欧洲主权需求占比更不透明
      - - Nebius Group
        - '上市公司（NASDAQ: NBIS）'
        - 未披露；欧洲 AI 云；2026 年 Q1 业绩于 2026 年 5 月发布
        - 市值低于 Nscale 私募估值；交易折价反映其尚未盈利
        - NVIDIA 支持的欧洲 GPU 云；在主权 AI 与企业 AI 上有部分业务模式重叠
        - 本次审阅未见收入披露；规模较小；作为 Yandex 分拆公司，治理与股权结构不同
      - - Lambda
        - 私营公司（2025 年 11 月 Series E）
        - $1.5B Series E；服务数万名客户；聚焦开发者
        - 私营公司；累计融资约 $2B+；估值未公开披露
        - 面向开发者的 GPU 云可比公司；同属新型云类别；NVIDIA 合作模式相似
        - 没有自有电力基础设施；不聚焦欧洲主权需求；基础设施版图明显更小
      - - Crusoe Energy
        - 私营公司（2025 年 10 月 Series E）
        - ARR 未披露；2024 年总收入 $276M（含已出售给 NYDIG 的 Bitcoin 挖矿业务）
        - Series E 估值 $10B+；据报道 2026 年 2 月云 ARR 增长 150%
        - 最接近的私营类比公司，押注 AI 基础设施中电力优先的垂直整合逻辑
        - 以美国为中心；既有 Bitcoin 挖矿业务让纯 AI 云 ARR 口径变得模糊；$10B 估值也缺少已确认收入基础
      - - 欧洲超大规模云厂商 / AWS / Azure
        - 上市公司；市值数千亿美元
        - 年云收入达数千亿美元
        - EV/revenue 5-10x；万亿美元级估值；不能直接作为倍数基准
        - 划定 Nscale 的竞争天花板和潜在收购情景
        - 规模、多元化程度和资产负债表根本不同；多云竞争格局无法直接拿来套倍数
    notes: 可比公司集合并不完整；Nscale 的欧洲主权定位和垂直整合让它区别于美国新型云厂商，但也带来美国同行倍数没有反映的规划与监管风险。
