      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Nscale 的买方宇宙可分为四个主要群体。超大规模云锚定租户——主要是 Microsoft——按多年容量协议签下长期、大规模 GPU 集群，覆盖英国、挪威、葡萄牙和美国。Nscale 与 Microsoft
              签约约 200,000 块 NVIDIA GB300 GPU，是史上规模最大的 AI 基础设施合同之一。Microsoft 的 $30B 英国 AI
              基础设施承诺（2025–2028）确认了宏观需求信号，Stargate UK（OpenAI/Nscale/NVIDIA）则增加第二个锚点，为主权工作负载提供最高 31,000 块
              GPU。该层级预算归属董事会和基础设施 VP 级别；合同为多年期，金额以数亿美元到数十亿美元计。

              受监管行业的企业 AI 团队——金融、医疗、法律和国防——构成第二个细分。他们需要专用 GPU 集群，并且合规姿态是共享超大规模云无法满足的：GDPR、FCA/DORA、NHS
              数据治理和国家安全采购规则要求算力留在辖区内。BT–Nscale 合作直接瞄准这一群体，让组织可在英国境内、按监管、数据驻留和安全要求运行 AI
              模型。政府和公共部门买家构成第三个细分，其主权数据要求写进中央政府政策：UK AI Action Plan 的公共算力 20 倍承诺让这类需求落地。

              第四类是开发者 / 研究细分，通过 Nscale 的推理市场接入。到 2026 年，Nscale 推理平台已扩张 148 倍，活跃用户超过 5,000
              名。分析师评论确认，新云与超大规模云是互补关系：企业部署生产级 AI 时通常同时覆盖本地、新云和超大规模云，因此 Nscale 的主权基础设施是 Azure 或 AWS 关系的增量，而非替代。
