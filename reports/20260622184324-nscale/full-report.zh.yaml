  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资栈
        blocks:
          - type: paragraph
            body: >-
              Nscale 的估值故事不是从已披露财务产出开始，而是从异常大的资本形成规模和客户验证开始。公司在 2025 年 1 月完成 $155 million Series A，2025 年 9 月完成 $1.1
              billion Series B，2026 年 3 月以 $14.6 billion 投后估值完成 $2 billion Series C；公开报道还显示，Series C 总额包含 2025 年 10 月完成的
              $433 million pre-Series C SAFE。这套股权栈之外，还有 $1.4 billion GPU 抵押延期提款定期贷款，以及用于 Narvik 的 $790 million
              挪威银行贷款，使已知资本基础合计约 $5.9 billion。对一家没有公开财务披露的公司来说，需求证据异常强：Microsoft 是约 212,000 颗或更多已承诺 GPU 的锚定客户，OpenAI 是
              Stargate Norway 的初始承购方，BT 提供英国企业分销路径。市场背景同样有利，IDC 预计 AI 基础设施支出到 2029 年超过 $1 trillion，Bain 在 2026 年 6
              月则认为电力可得性已经成为关键瓶颈。因此，估值争议不在于 Nscale 是否面对真实市场，而在于当前估值是否已经提前计入一条公开记录仍无法验证的收入爬坡曲线。
