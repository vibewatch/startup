companyProfile:
  summary: >-
    Nscale 是一家总部位于伦敦的 AI 基础设施公司，由 Arkon Energy 拆分而来，正试图搭建一个覆盖欧洲和跨大西洋市场的主权 AI 超大规模云厂商。其模式把站点开发、电力采购、AI 数据中心建设、NVIDIA GPU
    采购，以及覆盖推理端点、微调、Kubernetes、Slurm 和可观测性的托管软件层合在一起。公司在短时间内融入异常大规模资本——Series B、Series C、GPU 抵押债务和挪威项目融资——并拿下 Microsoft
    作为横跨英国、挪威、葡萄牙、Texas 和 West Virginia 的锚定客户。上行情景取决于公司能否在规划延误、客户集中或杠杆侵蚀故事之前，把已公告产能转成运营收入。
  foundedDate: '2024-05-29'
  founders:
    - name: Josh Payne
      role: CEO 兼创始人
      background: 连续创业者，此前横跨招聘、资本市场、超算基础设施、能源、数据中心和硬件供应链。
      claimRefs:
        - CO011
  foundingLocation: United Kingdom
  headquarters: London, United Kingdom
  productSummary: Nscale 销售全栈 AI 基础设施平台：GPU 算力、高性能网络、存储和编排软件，经自有和合作方运营园区交付；上层服务还包括推理端点、提示词工具、微调、Managed Slurm 和基于 Kubernetes 的部署。
  customerFocus: 超大规模云厂商、前沿模型实验室、公共部门与受监管行业买家，以及需要大规模主权或区域托管 AI 算力的企业。
  businessModel: 长期签约的 GPU 与园区容量协议、企业 AI 基础设施服务，以及叠加在自有或可控数据中心和电力资产之上的托管平台收入。
