      - number: '3.2'
        title: 关键竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              CoreWeave（Nasdaq: CRWV，Livingston NJ）按收入计是最大的新云 GPU 云运营商。2026 年 Q1，公司报告 $2.078B 收入、$99.4B
              收入积压——这是其历史上最强劲的预订季度。CoreWeave 活跃电力已超过 1GW，目标到 2030 年超过 8GW，并拥有超过 3.5GW 签约电力。CoreWeave 获得 SemiAnalysis 的
              Platinum ClusterMAX 评级，并在 2026 年 Q1 扩大与 Cohere、Jane Street 和 Mistral AI 的关系。其新产品 Dedicated Inference
              瞄准生产级推理工作负载。不同于 Nscale，CoreWeave 不拥有发电资产，也不自建园区——它依赖第三方托管机房。不过，上市公司资本通道、NVIDIA preferred 身份和超过 $99B
              的积压，使其成为 Nscale 最强的新云同行。CoreWeave 在 $2.078B 收入上录得 $144M Q1 运营亏损，说明新云规模并不会自动带来盈利。

              Lambda（San Francisco CA，成立于 2012 年）在 2025 年 2 月完成 $480M Series D，并在 2025 年 11 月完成 $1.5B Series E。2026 年 5
              月，Lambda 任命全球基础设施运营者 Michel Combes 为 CEO，并任命前 AT&T CEO John Donovan 为董事会主席，释放出从开发者中心云转向吉瓦级 AI 工厂的信号。Lambda
              目标到 2030 年管理 3GW 算力。Lambda 的按需定价易获得（H100 为 $3.99/GPU-hr，B200 为 $6.69/GPU-hr），并服务「tens of
              thousands」客户，但历史上缺乏界定 Nscale 模式的主权 AI 定位、欧洲存在和超大规模云锚定租户合同。

              Nebius Group（Nasdaq: NBIS，Amsterdam）于 2024 年 7 月从 Yandex 拆分，并于 2026 年 5 月 13 日发布 2026 年 Q1 财务业绩。Nebius 宣布在
              Pennsylvania 新建自有 AI 工厂，获得最高 1.2GW 电力和土地，展示美国扩张逻辑。Nebius 瞄准欧盟和美国的数据主权工作负载，以隐私和合规定位。其按需 H100 定价约
              $2.15–$3.85/GPU-hr。Nebius 对客户参考披露有限，但拥有 NVIDIA 投资方支持和既有欧盟云足迹。

              Crusoe（San Francisco CA）在估值超过 $10B 时完成 $1.375B Series E。其电力管线在 2025 年增长超过 4 倍至 45GW 以上，Texas Abilene 1.2GW
              园区一期在开工约一年后上线。Crusoe 以美国能源优先的模式——采购电力、建设园区，并从单一整合栈运营 GPU 云——在结构上直接平行 Nscale。关键差异在地理（美国中心 vs. 欧洲中心）和客户策略（多元
              AI-native 客户 vs. Nscale 的 Microsoft 锚定租户模式）。两者都面临客户集中挑战。

              Microsoft Azure、AWS 和 GCP 是所有新云最重要的竞争威胁。三大平台凭借既有账户关系、合规生态和全球 SLA 覆盖，共同掌握绝大多数企业 GPU 工作负载。Bain 2026 年 6
              月全球数据中心预测指出，超大规模云厂商正在进入一个「disciplined, selective, power-constrained」增长阶段——但它们合计 GPU 容量仍远超所有新云运营商总和。IDC 预计
              AI 基础设施支出到 2029 年将超过 $1T，其中很大一部分会流向超大规模云厂商，而非新云。
