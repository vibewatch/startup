      - - EU Energy Efficiency Directive（2023）——数据中心年度能源、水和可再生能源报告义务
        - 欧盟 / 挪威（EEA）/ 葡萄牙
        - 已生效；超过门槛的欧盟数据中心适用年度报告；挪威经 EEA 很可能纳入范围
        - 高（义务确定）
        - 低至中——仅为报告义务；未披露会受处罚；若报告数据弱于可再生能源宣称，存在声誉风险
        - 挪威站点受益于认证水电（可再生可信度高）；葡萄牙站点位于 Sines Data Campus（承诺 100% 可再生）；新站点报告框架未公开确认
        - 英国、Texas 和 WV 站点存在报告缺口，这些地区电网碳强度高于挪威 / 葡萄牙
        - 确认 EU EED 合规计划；索取可再生能源证书方法，以及所有欧盟和 EEA 站点已报告数据与宣称数据的对比
      - - Companies House 押记——向 Sandton Capital、Macquarie Bank、AF Realizations Sàrl 质押 IP 和资产
