      - number: '5.5'
        title: 差异化与合作生态
        blocks:
          - type: paragraph
            body: >
              Nscale 的核心差异化主张是垂直整合：从能源和数据中心地产，到 GPU 计算、网络、存储、编排和 AI 服务，全栈自有。这不同于 Lambda、 CoreWeave public cloud 等资产较轻的
              GPU 云，它们租赁数据中心空间；也不同于在欧洲可再生能源市场缺少主权、模块化设施的 hyperscalers。 Norway 的可再生能源锚点（水电富余）和模块化数据中心设计，让 campus 起量比传统
              build-to-order 设施更快、更便宜。Nscale 与 NVIDIA 的合作覆盖 硬件优先级、Rubin DSX AI Factory reference design 协作，以及联合 NVIDIA
              Slinky 软件集成。Nokia 投资了 Series B 和 Series C，并宣布网络合作， 把 Nokia 的 IP / optical 能力与 Nscale 基础设施平台结合。Dell 参与
              Microsoft 合同的 GPU 交付，也投资了两轮。BT 合作（2026 年 4 月） 在三个 BT UK 站点新增 14 MW 主权 AI，配套 NVIDIA GPU 基础设施和 UK 数据驻留合规，使
              Nscale 成为 UK 最大电信运营商的供应链伙伴。BT、NVIDIA、 Nscale 是 UK Sovereign AI Industry Forum 创始成员。Stargate UK——与 OpenAI 和
              NVIDIA 共同成立——把 Nscale 放在 UK 主权 AI 基础设施供应商名单中， 初始 OpenAI offtake option 为 8,000 块 GPU，可扩至 31,000
              块。Microsoft 跨国关系（UK、Norway、Portugal、US）让 Microsoft 成为 Nscale
              锚定客户，也给基础设施提供持久收入基础；否则，这些基础设施需要靠多元现货市场填充来维持利用率。
