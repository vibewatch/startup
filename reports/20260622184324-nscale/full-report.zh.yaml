      - number: '7.3'
        title: NVIDIA 供应集中与技术执行风险
        blocks:
          - type: paragraph
            body: >
              Nscale 已部署和已承诺的全部 GPU 机群都只基于 NVIDIA 架构：Glomfjord 和早期部署中的 H100/H200 集群，2026 年交付管线中的 GB300 Blackwell Ultra
              系统，以及面向 2027+ 年在 Narvik、Loughton、葡萄牙、Texas 和 West Virginia 部署的 NVIDIA Vera Rubin NVL72 系统。Nscale
              的任何公告中都没有提到 AMD、Intel 或其他 GPU 供应商。这意味着硬件采购和技术路线图执行都 100% 依赖单一 GPU 供应商。

              NVIDIA 同时还是战略股权投资人，参与了 $1.1B Series B（2025 年 9 月）和 $2B Series C（2026 年 3 月）。投资关系带来利益一致和优先分配动机，但并不在合同上保证
              GPU 供应优先于更大的 hyperscaler 客户（AWS、Azure、Google）。如果在供应紧张环境下，NVIDIA 把供给重新分配给自有 DGX Cloud 产品，或更大的客户，Nscale
              没有披露备用采购渠道。

              Vera Rubin NVL72 依赖是重大执行风险。NVIDIA 宣布 Vera Rubin 为下一代架构，预计 2027 年开始量产交付；截至 2026 年 6 月，该芯片尚未商业化量产。Nscale
              宣称自己将成为部署 Vera Rubin NVL72 的「全球首批提供商之一」，以及「Microsoft 自身之外的首家提供商」，意味着其 2027 年交付承诺取决于 NVIDIA
              能否按自身生产节奏推进。Loughton 推迟到 2027 年 Q2，被归因于向 Vera Rubin 200 的「技术升级」，直接说明 NVIDIA 的芯片时间表支配着 Nscale 的交付承诺。Vera
              Rubin NVL72 若量产延迟 6 到 12 个月，会同时传导到 Narvik、Loughton、葡萄牙、Texas 和 West Virginia。
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
      - number: '7.4'
        title: 财务结构与资本密集风险
        blocks:
          - type: paragraph
            body: >
              Nscale 在一个非常年轻的控股实体（2024 年 5 月成立）之上，拼出了一套复杂的多层资本结构，但没有公开披露收入、毛利率或盈利能力数据。2026 年 2 月拿到的 $1.4B Delayed Draw
              Term Loan 以 GPU 集群为抵押；Narvik 园区的 $790M 北欧项目融资（ABN AMRO、DNB、Eksfin、Nordea、SEB）于 2026 年 5 月完成，并带有额外 $790M
              未承诺增额额度；葡萄牙场址还需要 €695M+ 的新增资本承诺。West Virginia Monarch 园区涉及 GW 级建设成本，公开申报中尚未量化。累计已承诺资本显著超过股权融资所募集的
              $3.1B（Series B + C 合计），并要求 Nscale 持续交付已签容量、产生收入，才能覆盖债务义务。

              GPU 支持的 DDTL 形成结构性脆弱点：GPU 硬件折旧很快，现货价格已经大幅下压，H100 级算力从 2023 年约 $8/hr 降到 2025 年的 $2-3/hr。如果 GPU
              资产价值显著下跌——以往代际已经发生过——DDTL 背后的抵押价值可能受损。CoreWeave 公开披露的 2026 年 Q1 财务显示，即使季度收入达到 $2.08B，领先 neocloud
              仍因折旧和利息费用亏损；Nscale 有杠杆却没有披露收入，形成结构性不透明风险，使投资人无法独立评估偿债覆盖率。

              Companies House 记录确认，Nscale 存在以 IP 和资产作抵押的短期过桥贷款模式（Sandton Capital、Macquarie Bank、AF Realizations
              Sàrl），并在每轮股权融资后解除抵押。Macquarie 抵押（2025 年 6 月登记）在 2026 年 5 月清偿，与 Series C 融资节奏一致。公司核心 IP
              资产快速连续设押和解押，反映融资速度很高；但也确认，自成立最初几个月起，该实体几乎持续把主要资产作为抵押品。截至 2026 年 6 月，Companies House
              尚未提交经审计账目，外部利益相关方因此拿不到任何独立财务验证。
