chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Nscale 自称是「the engine of superintelligence」和「the hyperscaler engineered for AI」。公司总部在英国伦敦，注册办公地址分别为 Level
              5, 16 New Burlington Place, London W1S 2HX（运营实体）和 C/O Zedra Booths Hall, Booths Park 3, Chelford Road,
              Knutsford, Cheshire WA16 8GS（控股公司）。CNBC 在 2025 年 9 月报道称，Nscale 于 2023 年从澳大利亚加密货币挖矿公司 Arkon Energy 拆分；Data
              Center Knowledge 则把公司出现时间放在 2024 年。这个小幅歧义与英国控股公司 Nscale Global Holdings Limited（公司编号 15749408）于 2024 年 5 月
              29 日注册成立相吻合。运营实体 Nscale Limited（公司编号 16925886）于 2025 年 12 月 22 日注册成立。

              商业模式走垂直整合：Nscale 从能源采购、绿地数据中心设计与建设一路做到 GPU 算力和网络、编排软件，以及托管 AI 云平台，完整拥有并运营这条栈。收入来自云算力订阅和按需 GPU 租赁（Inference
              Endpoints、Managed Slurm、Kubernetes、Instances）、与超大规模云厂商签订的长期容量协议（主要是 Microsoft），以及面向企业和政府客户的主权 AI
              部署。公司利用低价可再生能源——尤其是挪威水电——在满足欧洲数据驻留要求的同时，以有竞争力的成本提供 GPU 算力。截至 2026 年初，Nscale 的推理平台已扩张 148 倍，服务超过 5,000
              名用户，不过该数字尚未得到独立证实。
