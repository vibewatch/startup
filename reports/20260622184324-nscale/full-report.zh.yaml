  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: Microsoft 锚定需求和机构资本证明很强，但撞上 $14.6B 的收入前高估值和缺失的财务披露，因此建议为 TRACK；主要上调触发点是 IPO 或收入得到确认。
    data:
      nodes:
        - id: microsoft-anchor
          label: Microsoft 200K+ GPU 锚定
          detail: 2025 年 10 月交易叠加 2026 年 4 月和 5 月的 Rubin 扩容，使 Microsoft 成为近期 GPU 容量的主要需求锚。
          tone: positive
        - id: institutional-capital
          label: 已拼出 $5.9B 资本结构
          detail: 知名投资人和贷款方提供约 $3.7B 股权加约 $2.19B 债务，验证了 Nscale 为超大规模建设融资的能力。
          tone: positive
        - id: power-moat
          label: 挪威水电与欧盟主权护城河
          detail: 电力可得性已经成为行业瓶颈，Narvik 和挪威相关资产给了 Nscale 可再生电力定位。
          tone: positive
        - id: no-revenue
          label: 未披露任何收入或 ARR
          detail: 截至 2026 年 6 月 22 日，没有公开经审计收入、ARR、毛利率或 EBITDA 数据。
          tone: warning
        - id: planning-risk
          label: Loughton 规划反对
          detail: 该英国站点面临新的规划流程，时间表改到 2027 年 Q2，给一个 Microsoft 站点留下执行压力。
          tone: warning
        - id: leverage
          label: 收入前基底上已提款债务 $2.19B
          detail: 如果 GPU 部署或利用率滑坡，GPU 抵押和项目融资工具会放大下行风险。
          tone: warning
        - id: valuation-mark
          label: $14.6B 估值需要约 $3.2B ARR
          detail: 按 CoreWeave IPO 约 4.6x EV/ARR 的基准，Nscale 需要约 $3.2B ARR 才能撑住当前估值。
          tone: warning
        - id: recommendation
          label: TRACK——跟踪 IPO 和收入确认
          detail: 战略质量很高，但要建立承销信心，还需要经审计 ARR、利润率披露以及规划问题解决。
          tone: neutral
      edges:
        - from: microsoft-anchor
          to: valuation-mark
          label: 支撑溢价
        - from: institutional-capital
          to: valuation-mark
          label: 验证规模
        - from: power-moat
          to: valuation-mark
          label: 证明护城河溢价
        - from: no-revenue
          to: recommendation
          label: 阻断买入信心
        - from: planning-risk
          to: recommendation
          label: 制造执行压力
        - from: leverage
          to: recommendation
          label: 放大下行风险
        - from: valuation-mark
          to: recommendation
          label: 相比上市可比公司偏紧
    approximationNotes: 该流程图呈现推荐逻辑，而不是量化模型；依据截至 2026-06-22 的公开证据。
    claimRefs:
      - CV001
      - CV009
      - CV011
      - CV012
      - CV013
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: >-
      按 CoreWeave IPO 的 4.6x ARR 基准，Nscale 的 $14.6B 估值需要约 $3.2B ARR；若给到 8x 溢价倍数，约 $1.8B ARR 即可；即便按 12x，也需要约 $1.2B
      ARR，全部远高于任何已公开确认的收入数字。
    data:
      items:
        - label: 4.6x 所需 ARR（CoreWeave IPO）
          value: 3.2
          detail: 按 CoreWeave 2025 年 3 月 IPO 的 4.6x EV/ARR 基准，Nscale 需要约 $3.2B ARR 才能证明 $14.6B 估值合理。
          tone: negative
        - label: 6x 所需 ARR（溢价基础设施）
          value: 2.4
          detail: 按 6x 的基础设施溢价倍数，Nscale 需要约 $2.4B ARR 才能支撑当前估值。
          tone: negative
        - label: 8x 所需 ARR（高增长）
          value: 1.8
          detail: 即使用符合强劲 GPU 云增长的 8x 倍数，Nscale 仍需要约 $1.8B ARR。
          tone: warning
        - label: 10x 所需 ARR（前沿溢价）
          value: 1.5
          detail: 按 10x ARR，需要约 $1.46B ARR；只有 2027 年部署快速转化，这一数字才说得通。
          tone: warning
        - label: 12x 所需 ARR（最高溢价）
          value: 1.2
          detail: 即便给到前沿 12x 收入倍数，Nscale 仍需要约 $1.2B ARR 才能撑住估值。
          tone: neutral
        - label: 已确认收入未披露
          value: 0
          detail: 截至 2026 年 6 月，没有公开收入或 ARR 数据；该柱表示披露缺失，并不等于实际活动为零。
          tone: negative
    approximationNotes: ARR 到估值的桥接只是按给定倍数做简单 EV/ARR 计算，并非贴现现金流输出；在 Nscale 缺少公开收入披露的情况下，所有 ARR 数字都是情景示例。
    claimRefs:
      - CV009
      - CV011
      - CV012
      - CV022
      - CV023
  - id: FV003
    title: 估值回报区间
    type: range
    layout: standard
    summary: 牛市情景相对 $14.6B 入场估值有可观上行；基准情景意味着盈亏平衡到小幅亏损；若执行和规划风险叠加，熊市情景对应严重下行。
    data:
      items:
        - label: 熊市情景
          low: 1.8
          mid: 3
          high: 5
          detail: ARR 低于 $400M、规划失败和杠杆压力，会把估值区间明显压低到数十亿美元级别。
          tone: negative
        - label: 基准情景
          low: 5
          mid: 8
          high: 12
          detail: 2026 年底 ARR 为 $500-750M 且 IPO 节奏放慢，意味着公允价值低于当前数十亿美元级估值。
          tone: warning
        - label: 牛市情景
          low: 14.6
          mid: 20
          high: 25
          detail: 确认 $1B+ ARR、规划问题解决并获得溢价倍数支撑，才会从今天的估值出发拼出唯一明确有吸引力的结果。
          tone: positive
    approximationNotes: 区间是供投委会讨论的 EV/ARR 情景示例，以数十亿美元计，并非管理层指引或 DCF 输出。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV009
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Nscale 在客户验证和基础设施进展上得分极高，但财务透明度几乎为零；在当前估值下，战略质量与承销信心之间差距很大。
    data:
      items:
        - label: 市场机会
          score: 9
          detail: IDC 显示 2025 年 AI 基础设施支出为 $318B，并有望到 2029 年超过 $1T，政策顺风仍在支撑。
          tone: positive
        - label: 客户和伙伴验证
          score: 8
          detail: Microsoft 200K+ GPU 锚定、OpenAI Stargate Norway 承购方、NVIDIA 投资人身份以及 BT 企业合作伙伴身份，共同支撑需求可信度。
          tone: positive
        - label: 基础设施和电力护城河
          score: 8
          detail: 挪威水电接入、Narvik 规模和垂直整合交付，使 Nscale 相比纯租赁同行拥有真实基础设施优势。
          tone: positive
        - label: 财务透明度
          score: 1
          detail: 截至 2026 年 6 月，没有公开收入、ARR、毛利率或 EBITDA 披露。
          tone: negative
        - label: 估值支撑 vs 可比公司
          score: 2
          detail: 在没有任何已披露分母的情况下，按 CoreWeave IPO 基准，$14.6B 需要约 $3.2B ARR 支撑。
          tone: negative
        - label: 治理和领导层
          score: 7
          detail: Sandberg、Clegg 和 Decker 加入董事会，Aker 仍居核心，显示公开市场准备度提升。
          tone: positive
        - label: 退出准备度
          score: 5
          detail: CEO 和投行释放 IPO 意图，但规划悬而未决、财务披露缺失，限制了近期准备度。
          tone: neutral
    approximationNotes: 分数是基于公开证据的 0-10 序数型投委会判断，而不是量化因子模型输出。
