      - number: '6.4'
        title: 留存动态与证据缺口
        blocks:
          - type: paragraph
            body: >
              Nscale 没有披露任何标准 SaaS 或基础设施即服务留存指标：公开来源中没有 NRR、GRR、logo churn rate、合同续约率或 cohort 级数据。对一家建设资本密集型基础设施、
              且项目融资依赖长期签约容量的公司来说，这是实质尽调缺口。

              可用替代指标显示留存画像分化。对 Microsoft 来说，容量协议的多年属性，以及连续多个季度升级 GPU 承诺，意味着结构性留存：Nscale 正在为 Microsoft 部署定制基础设施，$14
              billion+ 交易价值也意味着在建设和早期运营阶段切换成本极高。但 Nscale 没有披露这些协议是否包含最低 take-or-pay 条款、 合同时长或取消权；考虑到每个 campus
              背后的融资承诺，这些都很关键。

              对 BT 来说，2026 年 4 月公告是一段新的客户关系，没有运营年限。除公告本身外，没有 BT 留存证据。主权 AI 定位带来一定机构粘性 （BT 很难把 UK 政府工作负载迁到非 UK
              主权基础设施），但商业条款、SLA 承诺和合同结构未公开。

              对推理平台来说，尽管声称有 5,000+ 用户，但没有 cohort 数据、没有 churn 披露，也没有企业规模重复使用证据。推理用户群可能偏向实验性或短周期用户；
              没有留存数据，就无法区分持续企业需求和一次性开发者试用。Nscale 价格页列出按需 GPU 定价，这意味着相比容量锚定租户，推理用户切换成本较低。

              OpenAI 情况带来的关键负面推断是：这个市场的客户承诺可以逆转。OpenAI 曾公开宣布作为 Norway 和 UK Stargate 站点的锚定伙伴，却在两种情况下都退出直接基础设施承诺。
              这不是传统意义上的 churn——OpenAI 从未达到签约生产状态——但它说明，已宣布 AI 基础设施合作可能在部署前解体。这一风险直接适用于 Nscale 已宣布管线。
