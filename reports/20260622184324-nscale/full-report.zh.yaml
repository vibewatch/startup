    notes: >-
      IDC 覆盖 AI 基础设施总资本支出（硬件、网络、冷却），不是 GPU 租赁收入。CoreWeave 行折算为近似租赁收入参照。分析师 SAM/SOM 估计是推导结果，可信度低；未识别出独立一手研究单独拆分欧洲主权 GPU
