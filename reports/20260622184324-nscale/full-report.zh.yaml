  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与收入流
        blocks:
          - type: paragraph
            body: >
              Nscale 的商业模式，是把 GPU 计算即服务和长期超大规模基础设施容量交付绑在一起。客户拿到 NVIDIA GPU 集群，用于 AI 训练、微调和推理，按 GPU
              小时或预留容量计费；同时配套托管网络、存储和编排软件， 这些都由 Nscale 在垂直整合栈里端到端掌控。公司没有运营公开自助式云，也没有公布价格；主要商业通道是直接签企业和政府合同， Microsoft
              是唯一公开点名的锚定客户。

              Microsoft 关系支撑着 Nscale 近期收入画像的财务主轴。2025 年 10 月的交易覆盖约 200,000 块 NVIDIA GB300 GPU， 分布在 Texas（约 104,000
              块，2026 年 Q3）、Portugal（约 12,600 块，2026 年 Q1）、Norway（约 52,000 块） 和 Loughton UK（约 23,000 块，原 2027 年 Q1，已延至
              2027 年 Q2）。2026 年 3 月的一份 LOI 把关系延伸到 West Virginia Monarch campus，自 2027 年末起潜在容量达 1.35 GW。2026 年 4 月的
              Norway 扩容新增 30,000+ 块 Nvidia Rubin GPU；2026 年 Q1 后，Portugal 又为 Start Campus Sines 第二栋 200 MW 建筑新增 66,000+
              块 Rubin GPU。

              这类基础设施容量合同的收入确认靠里程碑推进，不是订阅 SaaS：部署后的 GPU 容量被客户验收并使用后，收入才开始计入。 施工或 GPU 交付延迟会推迟确认。截至运行日，Nscale
              未披露收入、ARR、牵引指标或客户数；到 2026 年中之前， 大多数已承诺容量在运营上仍处于收入前阶段，公开记录中能看到的已实现收入有限。
