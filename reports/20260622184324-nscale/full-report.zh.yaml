      - number: '7.2'
        title: 客户集中度与 Microsoft 依赖
        blocks:
          - type: paragraph
            body: >
              在 Nscale 全球组合的每一个重要场址上，Microsoft 都是唯一公开确认的主要锚定租户。2025 年 10 月扩大战略合作后，约 200,000 颗 NVIDIA GB300 GPU
              被承诺部署在四个场址：英国 Loughton 园区（约 23,000 颗 GB300）、挪威 Narvik 园区（约 52,000 颗 GB300，随后在 2026 年 4 月追加 30,000+ 颗 Rubin
              GPU）、葡萄牙 Sines 园区（约 12,600 颗 GB300，2026 年 5 月扩至 66,000+ 颗 Rubin GPU），以及 Texas 园区（约 104,000 颗 GB300，约 240
              MW）。2026 年 3 月 West Virginia Monarch Campus 公告又增加了一份意向书，涉及 1.35 GW 的 NVIDIA Vera Rubin NVL72 容量，计划 2027
              年末开始。每个重大场址都把 Microsoft 描述为客户；公开信息中没有发现规模相当的替代锚定租户。

              即便按 neocloud 标准看，这种集中度也不寻常。最接近的上市可比公司 CoreWeave 报告 2026 年 Q1 收入 $2.08B，但没有披露可比的单客户、单场址集中度，其近 $100B
              积压订单也分布在多个企业和 hyperscaler 客户之间。Nscale 的集中度意味着，Microsoft 的 AI 基础设施战略一旦变化，会同时影响英国、挪威、葡萄牙、Texas 和 West
              Virginia 的仓位，而且没有备用锚定客户。挪威 Narvik 园区最初在 Stargate Norway 框架下把 OpenAI 设为目标客户；后来 Microsoft 接手成为主要 offtaker，说明
              Nscale 的收入管线依赖 Microsoft 维持所有现有承诺。

              West Virginia LOI 明确是意向书，不是有约束力的最终协议；合同条款、交付进度、GPU 细节和付款义务都未公开披露。英国 Loughton 合同条款以及 Microsoft 的
              take-or-pay 安排同样未披露。CEO Josh Payne 对 The New York Times 表示，Nscale 最早可能「今年」（2026 年）IPO，这把 IPO
              执行风险叠加到交付积压之上。如果 AI 需求收缩、竞争格局或内部战略变化让 Microsoft 的 AI capex 计划降温，Nscale
              的整个收入管线和偿债能力会同步受损，而公开信息中没有发现规模相当的替代客户管线。
