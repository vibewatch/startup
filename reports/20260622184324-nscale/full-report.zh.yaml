  - id: FU001
    title: Nscale 客户旅程地图
    type: journey-map
    layout: wide
    summary: |
      Nscale AI 基础设施客户从初次发现到多年期签约部署的步骤；其中 OpenAI 退出被列为承购承诺环节的反向阶段。
    data:
      items:
        - label: 阶段 1 – 发现（Hyperscaler / 主权 AI 识别 Nscale）
          detail: >-
            Microsoft、BT 和 OpenAI 通过 NVIDIA 战略合作、英国政府 AI 政策（AI Opportunities Action Plan）和 Aker 共同投资发现 Nscale。开发者 /
            推理用户通过 nscale.com、推理市场列表和 NVIDIA 生态转介发现 Nscale。
        - label: 阶段 2 – 资格筛选（Nscale CRO / 销售评估机会）
          detail: Hyperscaler 评估 GPU 供应链、NVIDIA 配额、园区就绪度、电力确定性和交付时间线。主权 AI 买家评估数据驻留合规、英国监管对齐和 BT 连接集成。推理用户通过云控制台自助筛选。
        - label: 阶段 3 – 选址与技术评估
          detail: >-
            客户和 Nscale 基于 GPU 架构、交付排期、能源成本和监管框架确定园区（Norway Narvik、Portugal Sines、UK Loughton、Texas、West Virginia）。BT
            参与网络交换站点选择。
        - label: 阶段 4 – 合同与融资对齐
          detail: >-
            Hyperscaler 签署多年期容量协议，覆盖 GPU 类型、交付排期和电力承诺。对锚定租户而言，签约往往早于或伴随 Nscale 外部融资（例如挪威 $790M 融资绑定 Microsoft Narvik
            协议）。BT 签署主权 AI 数据中心协议。
        - label: 阶段 5 – 部署与基础设施建设
          detail: >-
            Nscale 建设园区，或在合作伙伴设施内部署（Start Campus、BT 站点）。GPU 交付和机架集成沿 NVIDIA 供应链推进。反向事件：Loughton Town Council
            的规划异议把英国交付目标从 2026 年 Q4 推迟到 2027 年 Q2。
        - label: 阶段 6 – 生产与价值交付
          detail: >-
            Microsoft 开始接收 AI 算力服务（Norway Sines 自 2026 年 Q1；Texas 自 2026 年 Q3；UK 自 2027 年 Q2）。BT 在英国交换站点启用主权 AI
            服务。推理用户通过 Slurm/Kubernetes API 访问 GPU 池。
        - label: 阶段 7 – 扩容与后续签约
          detail: >-
            Microsoft 将 Norway 从 GB300 扩到 +30,000 块 Rubin GPU（2026 年 4 月），将 Portugal 从 12,600 扩到 66,000+ 块 Rubin
            GPU（2026 年 5 月），并持有从 2027 年末启动的 Texas 二期 700 MW 选项。WV LOI 增加 1.35 GW 储备。反向事件：OpenAI 退出 Norway Narvik
            锚定承诺；Microsoft 吸收容量。
        - label: 阶段 8 – 多年期锚定锁定
          detail: >-
            Microsoft 四个活跃 Nscale 站点和 $14B+ 交易形成基础设施锁定，覆盖 2027–2028 交付周期。BT 主权 AI 关系借助英国数据驻留要求带来机构粘性。OpenAI 退出 UK
            Stargate 说明，部署前的伙伴锁定并不可靠。
    approximationNotes: |
      旅程阶段综合自 Nscale 官方新闻稿、BT newsroom、DCD、Computerworld 和 The Next Web 报道。各阶段转化率没有公开数据。OpenAI 反向事件是有记录的真实事件，不是假设情景。
    claimRefs:
      - CU001
      - CU008
      - CU009
      - CU010
      - CU011
      - CU018
      - CU019
      - CU023
