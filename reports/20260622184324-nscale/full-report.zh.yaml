  - id: TV005
    title: 投资逻辑击穿与否决触发条件表
    columns:
      - 触发条件
      - 阈值或信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Microsoft 下调或取消 GPU 承诺
        - Microsoft 正式将 GPU 部署量下调 25% 或更多，或对已验收产能延迟付款
        - 核心收入锚受损；如果 GPU 抵押品价值下跌，DDTL 契约条款可能被触发；基准情景下修为悲观情景
        - 立即复核投资信念；评估 DDTL 是否违约；暂停新增资金投入；重新评估债务再融资风险
      - - 收入爬坡低于预期
        - 经审计或管理层确认的 2026 或 2027 全年 ARR 低于 $400M
        - 核心估值支柱坍塌；在 $400M ARR 上，任何低于 37x 的合理倍数都撑不起 $14.6B 估值
        - 启动降价轮风险评估；审阅优先股条款；不参与估值不低于当前水平的后续融资
      - - Loughton 规划受阻或实质性延后至 2027 年 Q4 之后
        - Epping Forest District Council 要求重新提交完整规划申请，导致延迟 12+ 个月；或拒绝该申请
        - 对 Microsoft 的英国产能承诺（约 23,000 块 GPU）受扰动；英国主权 AI 定位受到声誉伤害
        - 跟踪 EFDC 规划登记；评估英国替代站点；审阅 Microsoft UK 合同中的不可抗力条款
      - - 欧洲数据中心反对升级为暂停审批或拒绝接入电网
        - 两个或更多英国或欧盟规划主管机构在 Nscale 目标市场实施或正式提议暂停批准新数据中心
        - 对欧盟大陆和英国扩张管线构成结构性威胁；影响 Stargate Norway 的社会许可和挪威电网接入
        - 跟踪挪威、英国和欧盟规划机构决定；审阅电网连接协议中的取消条款
      - - 市场情绪或执行失误触发下一轮降价轮
        - Nscale 在 Series C 交割后 24 个月内以低于 $14.6B 的估值发行新股融资
        - 表明私募市场已重估执行风险；早期轮次留下的优先权包袱可能损害普通股
        - 审阅 Series C 章程中的反稀释和清算优先权条款；评估 Nscale 股份在二级市场的买卖价差
    notes: 触发条件是基于公开证据推导出的示例阈值；实际投委会流程可能设定不同数字门槛。
