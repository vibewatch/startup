      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Josh Payne 是 Nscale 的 CEO
              兼创始人。他的履历显示，创业背景横跨招聘、资本市场和超算基础设施，并具备能源、数据中心和硬件供应链经验。官方沟通中没有列出此前的上市公司高管经历或学术资历。Nscale 存在显著关键人物风险：Payne
              是唯一具名创始人、主要外部发言人，也是每一项重大融资和合作公告的公众面孔。

              以公司当前阶段看，领导团队相当厚实。Sam Huckaby（数据中心总裁）来自 Oracle，曾任 OCI Data Center Infrastructure SVP，此前在 Vantage Data
              Centers 担任 COO 和 CDO。Sagar Rawal（首席基础设施官）曾任 Microsoft 基础设施负责人，此前任职 Oracle Cloud、NVIDIA 和 AWS。Osvaldo
              Morales（北美副总裁）曾在 Microsoft、AWS、Amazon、NVIDIA 和 Digital Realty 交付 200 多个数据中心项目，合计超过 10GW。David Power（CTO）拥有
              20 多年 HPC 经验，并曾担任 Irish Supercomputing List 顾问委员会成员。Tom Burke（CRO）此前是 Applied Digital CRO 和 IBM 全球销售
              VP。Philippe Sachs（EMEA 总裁）具备银行和早期风投经验，也是 Nscale 早期投资人。Phoebee Gahan（CLO）负责公司法和资本市场。领导层还包括 Daniel
              Bathurst（CPO）、Naeem Hatimi（CPO, People）、Daniel Shapiro（首席电力官）、Latha Maripuri（CISO，前 Uber）和 Sam
              Sturgess（战略与公司发展 SVP）。

              2026 年 3 月 Series C 之后，Nscale 董事会由七名成员组成：Josh Payne（CEO）、Rael Nurick、Jacob Leschly、Øyvind Eriksen（Aker ASA
              CEO，Series B 后加入）、Sheryl Sandberg（前 Meta COO、Sandberg Bernthal Venture Partners 联合创始人）、Susan Decker（Raftr
              CEO、前 Yahoo 总裁、Costco 与 Berkshire Hathaway 董事）和 Nick Clegg（Hiro Capital 普通合伙人、前英国副首相、前 Meta
              全球事务总裁）。TechCrunch 指出，Sandberg、Decker 和 Clegg 的加入带来更深的治理能力，也符合 IPO 准备逻辑。
