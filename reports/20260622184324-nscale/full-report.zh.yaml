  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              Nscale 竞争的位置，是三个相邻 AI 基础设施市场的交汇处：主权级 GPU 云（出租 H100/B200/GB300/GB200
              级集群，用于训练、微调和推理，并满足辖区内数据驻留）；超大规模云容量供给（把大规模 GPU 基础设施按多年协议租给 Microsoft、OpenAI 等锚定租户）；以及 AI 基础设施服务（编排软件、托管
              Kubernetes/Slurm、推理端点和微调 API）。明确排除在外的是通用 CPU 云 IaaS、消费级 AI 应用软件、AI 半导体制造和无关能源基础设施。

              Nscale 子市场——主权 AI 云——的定义性特征，是数据和算力必须留在特定法律辖区内。GDPR、EU AI Act、国家安全采购规则、NHS 级数据处理要求以及 FCA/DORA
              义务共同创造出一个独立子市场：超大规模云的共享云在结构上受限，聚焦主权的运营商则能收取合规溢价。英国 AI Opportunities Action Plan
              明确把主权算力列为国家战略优先事项，把政策背书嵌进需求信号里。

              当前主要替代方案是 AWS P4/P5、Azure NDv5 和 GCP A3 GPU 实例，它们承载全球企业 AI
              算力的大部分需求，但缺乏受监管的英国和欧盟企业买家所要求的精确本地数据驻留承诺。次级替代方案包括企业自建 GPU 集群和通用托管机房。Nscale
              把相邻层——能源采购、模块化数据中心制造和机群管理软件——垂直整合起来，而不是把它们当作独立市场切入，并将其转化为成本和速度优势。
