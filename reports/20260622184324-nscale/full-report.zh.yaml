  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础概览与分层
        blocks:
          - type: paragraph
            body: >
              Nscale 服务三个可识别客户分层。第一类是 hyperscaler 容量锚点，主要是 Microsoft，它们通过多年基础设施协议承诺数百 MW 级 GPU 部署， 覆盖特定 Nscale
              campus。第二类是主权 AI 机构客户——BT Group，以及隐含的 UK 和欧洲公共部门机构——它们需要在国家数据驻留和监管合规框架下使用计算。 第三类是推理云用户——Nscale 推理平台上超过
              5,000 个账户（公司声称，148× 增长未经验证）——包括在 Nscale 托管 GPU 云上运行训练、微调和推理工作负载的 AI 开发者、初创公司和企业。

              Microsoft 是压倒性的收入锚点。在 2025 年 9 月至 2026 年 5 月签署的已确认协议中，Microsoft 已签约交付约 200,000 块 NVIDIA GB300 GPU， 外加超过
              96,000 块 NVIDIA Rubin GPU（Norway 扩容和 Portugal 扩容），构成 Nscale 所称「one of the largest AI infrastructure
              contracts ever signed」。 该交易横跨四国（UK、Norway、Portugal、US）和两大洲，并包含 West Virginia 1.35 GW 容量的额外
              LOI。没有第二个客户接近这个规模。 Nscale 推理云提供地理和客户类型多元化，但没有证据显示其总收入接近 hyperscaler 容量合同。

              BT Group 于 2026 年 4 月作为主权 AI 合作伙伴进入客户名单：Nscale 将在三个现有 BT 网络交换站点建设 14 MW，借助 BT 全国 fibre 连接作为骨干， 提供 UK
              控制的计算。BT 关系在战略上重要，因为它让 Nscale 对齐 UK 政府 AI 政策，打开公共部门采购通道，并在 Microsoft 之外提供一个企业参考客户。 但相对于 Microsoft 部署的
              50–240 MW campus 规模，14 MW 仍然较小。

              Nscale 自称通过推理和主权云平台服务电信、生命科学、金融服务和公共部门。除 Microsoft 和 BT 外，公开来源中没有独立证据验证这些垂直领域的客户名称。
