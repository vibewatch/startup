      - number: '8.4'
        title: 建议、论点权衡与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              建议姿态是跟踪，而不是买入。Nscale 已经搭起一个严肃的基础设施叙事：Microsoft 锚定需求、挪威水电驱动容量、顶级投资人、Goldman Sachs 和 JPMorgan 担任配售代理，以及由
              Sheryl Sandberg、Susan Decker 和 Nick Clegg 加入后重组的董事会，都支持一种可能性：这家公司正在为上市做准备，并可能成为有意义的欧洲 AI
              基础设施冠军。但按当前价格，反论点仍然压倒性。公司没有公开收入、ARR、毛利率、EBITDA 或现金余额。客户集中度看起来严重偏向 Microsoft。Loughton
              规划尚未解决，债务层在公开记录显示匹配收入基础之前就引入杠杆风险。对投资委员会而言，实际下一步很清楚：要求披露经审计收入和毛利率，弄清债务栈的契约条款和抵押机制，按合同确认客户集中度和积压订单，并观察 IPO
              申报或等同的私有披露是否给出当前估值仍缺少的财务分母。在此之前，Nscale 值得密切跟踪，但不值得按 $14.6 billion 新出资。
