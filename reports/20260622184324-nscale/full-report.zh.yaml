  - id: FP003
    title: 护城河与竞争准备度 KPI
    type: kpi
    layout: standard
    summary: >-
      Nscale 最强的护城河是 Vera Rubin 在欧洲的先发接入、Microsoft 锚定租户规模，以及英国 / 欧盟主权 AI 定位；最核心的竞争风险是 Microsoft 收入集中、CoreWeave 112%
      同比收入规模优势，以及 Loughton 规划延误。
    data:
      items:
        - label: CoreWeave 2026 年 Q1 收入 vs Nscale 已披露收入
          value: $2.078B vs undisclosed
          detail: CoreWeave 2026 年 Q1 申报文件（收入 $2.078B、同比增长 112%）设定了 Nscale 必须追赶的新云规模基准；Nscale 没有公开收入数字
          tone: warning
        - label: Nscale Microsoft GPU 合同（已签约 GPU）
          value: ~200,000 GPUs
          detail: 在德州、葡萄牙、英国、挪威合计签约 200K 块 NVIDIA GB300 GPU——这是已宣布的最大 AI 基础设施合同之一；同时也是最大的单一客户集中度
          tone: positive
        - label: CoreWeave 收入积压（前瞻可见度）
          value: $99.4B
          detail: CoreWeave 2026 年 Q1 $99.4B 积压订单提供 12 个以上季度的前瞻收入可见度；Nscale 未披露同等积压指标
          tone: warning
        - label: Nscale Vera Rubin 欧盟首个部署（2027）
          value: Confirmed
          detail: Nscale 是 Microsoft 之外首家将在 2027 年部署 NVIDIA Vera Rubin NVL72 的欧洲供应商；随着平台铺开，该差异化有时间窗口
          tone: positive
        - label: CoreWeave 2026 年 Q1 经营利润率
          value: '-7%'
          detail: CoreWeave 在 $2.078B 收入上录得 $144M 经营亏损（2026 年 Q1）；即便年化收入 run-rate 超过 $8B，新云盈利能力仍未被证明
          tone: warning
        - label: Nscale 挪威项目融资已落地
          value: $790M
          detail: ABN AMRO、DNB、Eksfin、Nordea、SEB 为 Narvik 230MW 园区提供项目融资；验证了以 GPU 支撑的结构化债务可成为融资护城河
          tone: positive
        - label: Loughton 英国园区交付时间线
          value: Q2 2027 (slipped)
          detail: 受技术升级和规划异议影响，完工时间从 2026 年底推迟到 2027 年 Q2；这是英国主权 AI 交付的执行风险信号
          tone: warning
    approximationNotes: >-
      CoreWeave 收入和积压订单数字来自 2026 年 Q1 公开申报文件。Nscale GPU 合同数字来自 Nscale 和 Microsoft 官方新闻稿。Nscale 挪威融资来自 Data Center
      Dynamics 报道。经营利润率根据 CoreWeave 2026 年 Q1 GAAP 财务数据计算。
