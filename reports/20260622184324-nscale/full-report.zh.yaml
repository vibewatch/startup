  - id: FR002
    title: 风险传导地图
    type: dag
    layout: wide
    summary: |
      Nscale 主要风险如何传导为收入短缺、债务契约违约和估值压缩；Microsoft 客户集中是中心节点。
    data:
      nodes:
        - id: loughton_rejection
          label: Loughton 规划被拒
          detail: EFDC 驳回修订规划；英国主权 AI 超算站点丢失；Microsoft UK 合同承压
        - id: nvidia_delay
          label: NVIDIA Vera Rubin 延误
          detail: 量产滑坡 6+ 个月，同时传导至 Narvik、Loughton、Portugal、Texas、WV
        - id: microsoft_reduction
          label: Microsoft 降低容量
          detail: Microsoft AI capex 削减或战略转向，会损害 Nscale 80%+ 的已签约收入管线
        - id: gpu_price_compression
          label: GPU 价格压缩
          detail: H100 从 $8 降至 $2–3/hr；Blackwell/Rubin 若出现类似轨迹，将损害按需利润率和 DDTL 抵押品价值
        - id: delivery_delay
          label: 多站点交付延误
          detail: 6 个国家并行建设；组织不成熟；领导团队仍在搭建
        - id: esg_backlash
          label: ESG / 电网反弹
          detail: 英国 / 欧盟规划反对；电网压力；Edinburgh 暂停先例
        - id: revenue_shortfall
          label: 收入短缺
          detail: Microsoft GPU 小时延迟或取消；按需价格压缩；IPO 推迟
        - id: ddtl_covenant
          label: DDTL 契约违约
          detail: $1.4B GPU 抵押债务；契约绑定交付里程碑和 GPU 资产价值
        - id: valuation_compression
          label: 估值 / IPO 压缩
          detail: 投资人信心受损；被迫股权稀释；IPO 推迟或重新定价
      edges:
        - from: loughton_rejection
          to: delivery_delay
          label: 主要英国站点出局
        - from: loughton_rejection
          to: esg_backlash
          label: 放大整个行业的规划反对
        - from: nvidia_delay
