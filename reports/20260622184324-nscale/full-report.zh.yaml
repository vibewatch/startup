  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 规划、监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Nscale 最紧迫、证据最充分的监管风险，是英国 Essex Loughton 数据中心的规划争议。Datacentre Review 2026 年 3 月报道称，Loughton Town Council
              的规划官员要求 Nscale 重新提交一份全新的规划申请，理由是 Nscale 提出的变更比原已获批方案大约 50%，新增容量需要更多冷却和更多电力。最终决定权在 Epping Forest District
              Council，而不是 Loughton Town Council；但市镇议会的正式反对已经带来程序性延误。Nscale 也等于承认了这一点，把 Loughton 完工时间推迟到 2027 年
              Q2——相较原本公开表述为技术升级决定的 2026 年目标已经滑期。若规划被完全驳回，英国计划中最大的主权 AI 超级计算机将失去核心场址，也会迫使 Microsoft 和英国政府围绕 Loughton
              园区公开绑定的承诺大幅重置。

              Loughton 之外，英国和欧盟更广泛的监管环境也带来实质性结构义务。英国《国家安全与投资法 2021》把数据基础设施列为需申报的收购行业；Nscale 已获得重大外资（Aker
              ASA、Citadel、8090 Industries、NVIDIA、Lenovo），但没有披露任何 NSI Act 申报。如果强制申报被追溯触发，或 Nscale 争取需要安全审查的英国政府 AI
              合同，就存在潜在风险。在欧盟业务中，EU Regulation 2024/1689（EU AI Act，2024 年 8 月生效）适用于 AI 系统提供方和运营方；Nscale 的全栈定位——GPU
              集群、编排软件、推理端点、微调服务——意味着其 AI 服务层扩张后，很可能落入 GPAI 模型义务和透明度要求。EU Energy Efficiency Directive (2023) 要求 Nscale
              的挪威和葡萄牙数据中心每年报告能耗、用水和可再生能源利用情况；这会增加合规负担，一旦披露显示其表现落后于可再生能源主张，也会带来声誉风险。

              Companies House 记录确认，Nscale Global Holdings Limited 于 2024 年 5 月 29 日成立——截至研究日期还不到 25 个月——并显示 2025-2026
              年至少登记了四项有担保债权，覆盖 IP 和其他资产，债权人包括 Sandton Capital、Macquarie Bank（2026 年 5 月清偿）和 AF Realizations Sàrl。这种以 IP
              做抵押的轮前过桥贷款、并在每次重大股权融资后解除抵押的模式，符合轮前过桥融资特征；但也说明，在极短经营历史里，该实体的核心 IP 已被多次质押。英国运营实体 Nscale Limited 直到 2025 年 12
              月 22 日才成立，紧挨着 Series C 融资。公开记录中未发现正在进行的诉讼、制裁或执法行动。
