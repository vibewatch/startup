      - number: '2.2'
        title: 市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              2025 全年全球 AI 基础设施支出达到 $318B，较 2024 年的 $153B 增长超过一倍。仅 2025 年 Q4，支出就达到 $89.9B，同比增长
              62.2%，动力来自超大规模云持续建设、推理工作负载部署加速，以及中东和欧洲首轮主权 AI 项目。IDC 预计该市场 2026 年将达到 $487B（约 53% 同比增长），并在 2029 年突破 $1T，五年
              CAGR 约 31%。

              这些估算口径较宽，包含服务器硬件、网络、存储和冷却基础设施，并非仅指 GPU 租赁收入。CoreWeave 截至 2026 年 Q1 近 $100B 的收入积压（季度收入 $2.078B，同比增长
              112%）提供了新云细分市场绝对规模的最清晰公开基准。2025 年 Q4，西欧同比增长 42%，是美国之外增长最快的 AI 基础设施区域之一，直接验证了 Nscale 的欧洲锚定策略。

              未发现独立分析师研究单独拆出欧盟主权 GPU 云租赁市场。基于 IDC 区域数据以及 Microsoft 在英国和欧盟的数据中心承诺，欧洲在全球 AI 基础设施支出中的份额估计为 7–12%，意味着 2025
              年欧盟区域基础设施支出约 $20–38B。Nscale 的 SAM 进一步受主权级定位、建设时间表和当前签约容量约束，估计到 2030 年可触达规模为 $3–8B。表 2 保留了多个彼此矛盾且口径不同的估算。
