      - number: '5.2'
        title: 数据中心与物理基础设施组合
        blocks:
          - type: paragraph
            body: >
              Nscale 的物理足迹是最差异化的资产：自有自营的超大规模 campus 锚定低成本可再生电力，同时补充合作方站点 colocation 和不断扩大的北美 campus 管线。 运营旗舰是 Glomfjord,
              Norway——30 MW 在运容量，100% 使用当地水电坝富余水电，可扩展到 60 MW。绝热冷却借助 Arctic 气候， 冗余低延迟 fibre 提供双路径连接。正在建设的是 Narvik AI
              campus（Kvandal，230 MW），最初与 OpenAI、Aker ASA 一起定名为 Stargate Norway，现在主要服务 Microsoft。Narvik 附近 Korgen 的第二个
              250 MW 设施也在推进；ABN AMRO、DNB、Eksfin、Nordea 和 SEB 提供的 $790 M 项目融资锚定 Narvik 开发。在 UK，Loughton campus（50–90 MW，为
              Microsoft 配 23,040 块 NVIDIA GB300 GPU， 目标 2027 年 Q1）面临 Loughton Town Council 的规划异议，后者因拟议容量增加 50%
              和电网影响担忧要求重新提交规划申请；时间线已推至 2027 年 Q2。 Texas campus（约 240 MW，Ionic Digital 站点）将从 2026 年 Q3 起为 Microsoft 承载约
              104,000 块 NVIDIA GB300 GPU。West Virginia Monarch Compute Campus（Mason County，2,250+ acres）是美国首个州认证 AI
              Microgrid，目标在 Phase 1 用 NVIDIA Vera Rubin NVL72 GPU 提供 1.35 GW AI 计算，Caterpillar G3500 天然气发电机到 2028 年 H1
              提供 2 GW 脱网电力；站点设计可扩展到 8 GW+。在 Sines, Portugal， Start Campus 部署包括 12,600 块 NVIDIA Blackwell Ultra
              GPU（第一栋）以及自 2027 年末起为 Microsoft 配置的 66,000+ 块 NVIDIA Vera Rubin GPU， 代表 Nscale 最大的单笔 EU 基础设施投资（€695
              M+）。合作方运营站点包括 Keflavik（Iceland）、Stavanger、Oslo、Blönduós（Norway）、 Slough（UK）和 North Carolina。Finland
              Harjavalta 还有一个设施在许可中，由 Fortum 的电网连接支持。
