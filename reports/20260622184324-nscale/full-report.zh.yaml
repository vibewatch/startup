      - number: '1.5'
        title: 里程碑、合作伙伴与负面背景
        blocks:
          - type: paragraph
            body: >
              从创立到 2026 年中，Nscale 的里程碑密集压缩在约 30 个月里。公司从 Arkon Energy 的加密挖矿基础设施中脱胎，彻底转向 AI 工作负载，并以即便在新云同行中也罕见的速度获取土地、GPU
              和合作伙伴。合作生态以 Microsoft（挪威、英国、葡萄牙和 Texas 的主要超大规模云承购方）、NVIDIA（GPU 供应商和反复参与股权投资的投资方）以及 Aker ASA（挪威工业集团、Series
              B 和 C 领投方、前 JV 伙伴且现已并入 Nscale 股权）为锚。OpenAI 通过 Stargate Norway 和 Stargate UK 扮演战略锚点，BT、Nokia、Dell、Fortum 和
              Start Campus 则补齐关键合作圈。

              负面背景集中在英国规划。2026 年 3 月，DataCentre Review 报道称，Nscale 因 Loughton 数据中心成为「the latest company to face public
              backlash」；Loughton Town Council 要求提交新的规划申请，原因是拟议扩建比原批准规模大 50%，并引发电网担忧。Epping Forest District Council
              拥有最终决定权，但尚未裁定。公司表示，施工现场勘察和许可工作正在推进，预计 2026 年 Q2 开工、2027 年 Q2 投运。另一个问题是 Loughton 时间表延误与 Nscale 此前 2026 年 Q4
              目标冲突；公司把滑期归因于 NVIDIA Vera Rubin 200 技术升级，但规划反对意见构成另一套风险解释。

              行业层面，Edinburgh Council 暂停新数据中心开发，以及英国公众对 AI 基础设施的抵触升温，构成系统性风险，可能让未来英国站点收购变复杂。收入和财务透明度仍是缺口：截至 2026 年 6
              月，Nscale 未在任何公开披露中发布 ARR、收入、毛利率或员工人数。
