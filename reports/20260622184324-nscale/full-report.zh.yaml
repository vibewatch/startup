      - number: '8.3'
        title: 牛市、基准与熊市估值区间
        blocks:
          - type: paragraph
            body: >-
              由于估值分母不公开，情景分析无法回避。牛市情景假设 Nscale 能在 2026 年下半年确认超过 $1 billion ARR，Microsoft 部署按期推进，在 Microsoft
              之外至少增加一个锚定客户，并在 2026 或 2027 年 IPO 窗口维持溢价倍数。沿着这条路径，约 $20-25 billion
              的估值区间可以支撑，当前估值也说得通。基准情景更保守，也更符合一条部分交付的基础设施管线：到 2026 年底 ARR 达 $500-750 million，挪威和葡萄牙继续执行，IPO 路径推迟但在
              2027-2028 年仍可行，对应约 $8-12 billion 公允价值。熊市情景把证据中已经可见的风险叠加在一起：Loughton 规划延误、已签约 GPU 容量转化收入更慢，以及 $2.19 billion
              债务栈带来的再融资压力。在这一组合下，公允价值可能压缩到 $3-5 billion 区间，并迫使公司讨论 down-round。因此，按当前进入价格看，风险回报仍不有利。
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV013
              - CV014
              - CV044
