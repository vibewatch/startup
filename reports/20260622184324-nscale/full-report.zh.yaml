  - id: FI001
    title: Nscale 收入模型——从客户需求到确认收入
    type: flow
    layout: standard
    summary: 企业和主权客户的算力需求如何流经 Nscale 垂直整合栈，变成已签约容量交付，并最终确认收入。
    data:
      nodes:
        - id: customer
          label: 企业 / 主权客户
          detail: Hyperscalers（Microsoft）、政府（OpenAI Norway、BT 主权 AI）、寻求 AI 算力的企业
        - id: contract
          label: 容量合同
          detail: 多年期 GPU 交付协议；定价、数量，以及 take-or-pay 与利用率条款均私下谈判
        - id: dc-build
          label: 数据中心建设
          detail: Nscale 自有或租赁园区：Narvik、Texas、Loughton、Sines；capex 估算采用行业基准 $10–15M/MW
        - id: gpu-deploy
          label: GPU 部署
          detail: NVIDIA GB300/Rubin 集群交付并验收；里程碑触发收入确认
        - id: cloud-api
          label: Cloud API / 托管服务
          detail: 推理端点、微调 API、AI Studio、私有云——第二收入通道
        - id: revenue
          label: 已确认收入
          detail: 未公开披露；基于里程碑还是订阅确认仍待确定；公开领域没有 ARR、GMV 或收入数字
      edges:
        - from: customer
          to: contract
          label: 企业谈判
        - from: contract
          to: dc-build
          label: 建设触发
        - from: dc-build
          to: gpu-deploy
          label: 交付里程碑
        - from: gpu-deploy
          to: revenue
          label: 已验收容量 → 收入
        - from: customer
          to: cloud-api
          label: 自助服务 / API 使用
        - from: cloud-api
          to: revenue
          label: 按使用量计费
