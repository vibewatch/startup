      - number: '6.5'
        title: 客户集中度与负面发现
        blocks:
          - type: paragraph
            body: >
              Microsoft 集中度是 Nscale 的首要商业风险。在所有已确认协议中，Microsoft 占 Nscale 已披露签约 GPU 容量的压倒性多数——至少 282,000 块已宣布承诺， West
              Virginia LOI 又增加 GW 级管线。没有第二个客户披露超过 14 MW 的签约容量。如果 Microsoft 暂停、重谈或退出其四个活跃 Nscale 部署中的任一个，
              由此产生的容量利用缺口可能直接威胁这些 campus 背后项目融资的偿债能力。Nscale 没有披露融资 covenants 是否包含锚定租户留存要求，也没有披露 Microsoft 承诺是否包含最低
              take-or-pay 保护。

              OpenAI 退出信号从两方面削弱 Nscale 的客户多元化叙事。第一，OpenAI 曾公开被称为 Norwegian Stargate 项目的基石伙伴，为 $790 million Norway
              融资提供可信度和需求保障。 Microsoft 取代其成为锚点，保住了商业结果，但这一替换说明，Nscale 具名合作伙伴公告并不总能转化为有约束力的长期 offtake。第二，OpenAI 暂停 UK
              Stargate 项目—— 理由是 UK 电力成本是美国四倍、版权监管未解决——构成对 Nscale UK 管线的直接负面信号。计划中的 UK Stargate 部署本应在 Nscale North East
              England 站点带来 8,000–31,000 块 GPU 需求。该需求流失压缩了 Nscale 的非 Microsoft UK 需求，也让 BT 主权 AI 协议和任何未披露管线客户承担更大商业压力。

              Loughton 规划异议是第二个负面发现。2026 年初，Loughton Town Council 官员在 Nscale 提议配置比原批准方案大 50% 后，因电网承压和用电需求增加，
              要求重新提交规划申请。Nscale 将 Loughton 完成日期从 2026 年 Q4 修订为 2027 年 Q2，官方归因于 Vera Rubin 200 技术升级。规划问题可能进一步推迟向
              Microsoft 和其他 UK 客户交付，并连带影响 2027 年 Q1 GPU 部署承诺。

              第三个集中度风险是地理风险：Nscale 最大的已宣布客户部署（Norway、Portugal、Texas）处在各自特定监管环境中，欧洲部署还面对可能限制客户灵活性的 EU AI 治理要求。DCD
              报告称「Microsoft and Google are set to lease capacity from Nscale in the UK」，把 Google 引入为潜在第二个 hyperscaler
              客户； 但该表述未获任一方确认，不能作为已披露客户证据依赖。
