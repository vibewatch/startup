      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 当前判断：跟踪——不买入
            body: >-
              Nscale 是一家严肃的 AI 基础设施平台，有有力的客户证明、机构资本，以及欧洲 AI 中真实的电力护城河。但证据不支持按 $14.6 billion 买入，因为估值跑在已确认收入前面；如果 GPU
              部署延迟，$2.19 billion 债务栈会放大下行。只有在经审计 ARR 确认超过 $1 billion、毛利率披露、且 Loughton 规划风险解决后，才应上调至买入。
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV012
              - CV013
              - CV041
          - type: callout
            title: Microsoft 锚定与 NVIDIA 背书降低近期需求风险
            body: >-
              2025 年 10 月、2026 年 4 月和 2026 年 5 月，Nscale 与 Microsoft 连续三次达成 GPU 扩容协议，确认需求真实且仍在增长。NVIDIA
              连续两轮参投，既带来供应链舒适度，也提供技术验证。两者合在一起，是欧洲 AI 基础设施中目前可见的最强客户与供应商证明。
            calloutType: strength
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV043
          - type: callout
            title: 收入披露前 $14.6B 估值与 $2.19B 杠杆是主导风险
            body: >-
              Nscale 没有披露任何收入、ARR 或毛利率数据。在披露前阶段给出 $14.6B 估值，是欧洲创业公司史上最激进的估值，需要 GPU 部署零失误才能证明其合理性。约 $2.19 billion
              债务层会在部署因规划阻碍、建设风险、GPU 供应或利用率中断而延迟时放大下行。
            calloutType: risk
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV012
              - CV013
          - type: callout
            title: 基准情景假设 2026 年底 ARR 爬升至 $500-750M
            body: >-
              整个估值框架都取决于 Nscale 证明已签约 GPU 容量能大规模转化为确认收入。若 2026 年 ARR 低于 $400
              million——考虑到已宣布容量中相当一部分需要多个季度爬坡，这仍然合理——基准情景会滑向熊市情景，$14.6B 估值可能被证明明显过高，并需要下调估值融资。
            calloutType: assumption
            claimRefs:
              - CV040
              - CV041
