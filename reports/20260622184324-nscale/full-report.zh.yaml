  - id: TM001
    title: 市场定义与边界——Nscale 主权 AI 云
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Nscale 的相关性
    rows:
      - - 主权 AI GPU 云（核心）
        - 为 AI 训练、微调和推理租用 H100/B200/GB200/GB300 级 GPU 集群，支持预留和按需模式，并满足境内数据驻留要求
        - CPU VM、对象存储、CDN、通用 IaaS
        - 需要满足数据驻留合规的企业、政府和 AI 原生公司
        - 核心直接市场；Nscale Cloud 以英国 / 欧盟主权级供应商身份参与竞争
      - - Hyperscaler 容量供给（锚定合同）
        - 多年期、大规模 GPU 基础设施协议；为 hyperscaler 锚定租户提供托管、供电和 GPU 部署服务
        - 消费级云服务、中小企业 SaaS 托管、传统 carrier hotel
        - Microsoft、OpenAI、NVIDIA DGX Cloud 是主要锚定 GPU 容量买方
        - 主要收入引擎来自 Microsoft 约 200,000 块 GPU 合同，覆盖英国、挪威、葡萄牙和美国
      - - AI 基础设施和托管服务
        - 托管 Kubernetes/Slurm、推理端点、微调 API、AI Studio、Fleet Operations 遥测
        - 应用层 AI 软件、SaaS 模型访问、AI 安全和治理工具
        - 企业 AI 平台团队和主权政府机构
        - 区别于裸金属租赁；降低客户运维负担，并支撑溢价定价
      - - 现状替代：hyperscaler GPU 云
        - 在 AWS P4/P5、Azure NDv5 和 GCP A3 上按需或预留使用 GPU 实例，但不承诺境内数据驻留
        - 纯 CPU 实例、存储工作负载、非 GPU 云服务
        - 所有企业 AI 买方；hyperscaler 掌控全球云计算收入的 >80%
        - 主要竞争威胁；买方会在主权溢价与 hyperscaler 的熟悉度和既有合同之间权衡
      - - 相邻：能源和数据中心基础设施
        - 电力采购、PPA、水电采购、模块化数据中心设计和建设
        - 非 AI 用途的公用事业级电力；无关的电网级储能
        - 投资 AI-ready 设施的主权政府和数据中心 REIT
        - 上游垂直整合；挪威水电和模块化建设带来结构性成本与速度优势
    notes: >-
      截至 2026 年 6 月，Nscale 估值采用上述市场边界。主权 AI 云是 GPU-as-a-Service 的子细分，边界由司法辖区内数据驻留要求划定。买方 / 付款方区别：Microsoft（锚定租户）在 VP /
      董事会层面掌控预算，合同多年期、金额达数亿美元；企业买方通过 CTO / VP Infrastructure 决策；政府买方涉及正式采购权限。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
