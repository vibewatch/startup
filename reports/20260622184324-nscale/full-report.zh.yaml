        - 押记 0001、0002 未清偿；0003（Macquarie）2026 年 5 月清偿；0004（Sandton）2025 年 10 月清偿；0006-0008 于 2026 年 5 月登记
        - 持续中
        - 中——有担保债权人优先于股权；IP 质押限制灵活性；加速还款触发条件未披露
        - Series C 股权和 DDTL 再融资似乎已解除 Macquarie 与 Sandton 押记；新押记 0006-0008 反映当前有担保债务结构
        - 未清偿押记仍带来剩余敞口；条款、契约和交叉违约安排未公开披露
        - 获取 0001、0002、0006、0007、0008 的押记文件；审阅 IP 质押范围，以及与 DDTL 或北欧项目融资的任何交叉违约
