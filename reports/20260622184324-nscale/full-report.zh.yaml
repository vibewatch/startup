      - number: '2.4'
        title: 增长驱动与市场约束
        blocks:
          - type: paragraph
            body: >-
              首要增长驱动来自 scaling laws 推动的持续 AI 算力需求：训练算力超线性增长，推理需求则随模型采用成倍增长。CoreWeave 近 $100B 的收入积压（2026 年 Q1）和 Lambda 的
              $1.5B Series E（2025 年 11 月）证明，快速供给响应还没有抹平需求盈余。Bain 2026 年 6 月的数据中心预测确认，推理现在已成为重心，test-time compute
              正把数据中心架构推向分布式、低密度站点——这正是 Nscale 模块化策略明确瞄准的形态。

              主权 AI 政策授权是需求侧结构性加速器：英国 AI Opportunities Action Plan 承诺公共算力容量提升 20 倍；EU Cloud and AI Development Act 目标在
              5–7 年内把欧盟数据中心容量提高两倍；Microsoft 的 $30B 英国投资带动盟友基础设施资本入场。Nscale 作为 Microsoft、OpenAI 和 NVIDIA
              的优选基础设施伙伴，直接受益于这些政策驱动的投资周期。挪威 100% 可再生水电足迹，为 Nscale 的 Narvik 和 Glomfjord 站点提供结构性能源成本优势，支撑长期合同的竞争性定价。

              电网和规划约束是主要反向力量。发达经济体的并网队列长达 3–10 年；输电线路建设需要 4–8 年。Nscale 的 Loughton 站点遭遇规划审查：Loughton Town Council 以范围增加
              50% 和电网影响为由，要求重新提交规划申请，投运日期被推至 2027 年 Q2。Edinburgh Council 提议暂停新数据中心开发，是更广泛全国性阻力的先行指标。Microsoft
              集中度也是收入风险维度：Microsoft 占 Nscale 已公告签约 GPU 容量的大多数，覆盖全部四个地区，且公司没有披露可对冲该依赖的第二锚定租户。
