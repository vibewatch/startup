      - - 领导层不稳——CEO 或数据中心总裁在 2028 年前离任
        - LinkedIn、Nscale 新闻稿、Companies House 董事备案、主流媒体
        - Josh Payne 或 Sam Huckaby 在主要交付周期完成前（2028 年前）宣布离任
        - 标记投资者信心和运营连续性风险；要求董事会紧急应对和继任方案；重新评估交付时间表和 Microsoft 合同可信度
    notes: >
      这些触发点用于主动尽调监控计划。门槛为示例，应按具体投资条款和契约校准。标为「最高严重性」的触发点意味着需要立即重评投资论点。DDTL
      契约触发点依赖公开披露；契约条款未公开，可能包含私下合规证书——任何投资的信息权应覆盖这些私有信息。
