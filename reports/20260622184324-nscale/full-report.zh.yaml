      - number: '4.2'
        title: 定价可见度与单位经济
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Nscale 没有在官网公布 GPU 计算标价，这不同于 CoreWeave、Lambda Labs、Nebius 等 neocloud 同行——这些公司都公布按 GPU
              小时计价的费率。企业交易私下定价，因此实际价格、批量折扣深度、 合同时长和续约调价条款都不在公开域内。缺少这些信息，预尽调阶段无法独立验证 Nscale 每个已部署 GPU 小时的收入。

              neocloud 同行提供了目前最接近的单位经济参照。已上市的 CoreWeave 报告 2026 年 Q1 收入为 $2.078 billion （同比增长 112%），截至 2026 年 3 月 31 日收入
              backlog 为 $99.4 billion，显示规模化长期签约收入。Nebius Group 也报告了 2026 年 Q1 业绩，并宣布在 Pennsylvania 获得 1.2 GW
              电力，说明该行业资本强度很高。GPU 现货市场 H100 费率已从 2023 年约 $8/GPU-hr 大幅压缩到 2024 年末约 $2–3/GPU-hr，背后是 neocloud 供给扩张；这形成了定价地板，
              也压住了非预留按需收入。

              Nscale 成本侧优势来自 Northern Norway 站位。Narvik 和 Glomfjord 站点受益于显著低于欧洲平均水平的水电价格， 相比欧洲大陆或 UK 同行，单个 GPU 小时的能源 COGS
              更低。但公司没有披露 PUE、混合电价 / kWh、GPU 利用率或毛利率估算。 数据中心 capex 基准显示，面向超大规模 AI 优化设施每 MW 约需 $10–15M；据此，Nscale 已承诺的 1.3+
              GW 管线意味着 多年总资本投放约 $13–20+ billion。这个数字凸显了 capex 转收入效率的重要性，而该效率目前仍无法评估。
