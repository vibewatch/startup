  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              与 Nscale 有关的 AI 算力基础设施竞争格局可分为三层。第一层，纯新云 GPU 云运营商——CoreWeave、Lambda、Nebius AI 和
              Crusoe——是最接近的直接收入竞争者，都在抢在需求前部署 GPU 容量，并靠可获得性、定价、地理位置或垂直整合拉开差异。第二层，超大规模云厂商——Microsoft Azure、AWS 和 Google
              Cloud Platform——是占主导的现状替代方案，把 GPU 算力作为更广泛企业云平台的一部分出售，并拥有成熟的合规、SLA 和集成生态。第三层，主权 AI 项目、电信运营商和国家云计划（例如
              BT、欧洲国家云项目）构成新兴相邻和进入者类别；Nscale 正通过合作主动吸纳，而非把市场让给它们做竞争对手。

              CoreWeave 以 2026 年 Q1 $2.078B 收入（同比增长 112%）、$99.4B 收入积压和超过 1GW 活跃电力领跑新云细分，并通过 2025 年 3 月 NASDAQ
              IPO（ticker: CRWV）树立了该类别的公开市场基准。Lambda 于 2025 年 11 月完成 $1.5B Series E，并在 2026 年 5 月任命新 CEO，目标到 2030 年实现 3GW
              算力。Nebius Group（Nasdaq: NBIS）于 2024 年从 Yandex 拆分，瞄准欧盟和美国的数据主权工作负载，并在 2026 年 Q1 财报中宣布 Pennsylvania 1.2GW AI
              工厂。Crusoe 在 $1.375B Series E 后估值超过 $10B，采用以美国为中心的能源逻辑，锚点是 Texas Abilene 1.2GW 园区。超大规模云厂商继续激进扩建 GPU：IDC
              报告称，2025 全年 AI 基础设施支出为 $318B，是 2024 年两倍多，其中美国超大规模云厂商占 77%。

              Nscale 占据一个独特位置：一家总部在欧洲、垂直整合的 AI 基础设施超大规模云厂商，具备 NVIDIA preferred partner 身份，在挪威和英国拥有可再生能源园区，并与 Microsoft
              建立了变革性锚定租户关系，覆盖四国约 200,000 块 NVIDIA GB300 GPU。这让 Nscale 在野心和资本规模上更直接可比 CoreWeave 与 Crusoe，而其欧洲主权 AI
              定位又把它与主要聚焦美国的同行区分开来。
