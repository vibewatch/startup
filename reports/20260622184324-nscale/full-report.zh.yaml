  - id: FI004
    title: 单位经济桥——从 GPU 小时收入到估算毛利率
    type: flow
    layout: standard
    summary: 决定 Nscale 基础设施每 GPU 小时经济性的关键成本和收入驱动因素；所有中间值均来自估算或同行披露，不是 Nscale 披露。
    data:
      nodes:
        - id: list-price
          label: 合同 / 实际价格
          detail: 未披露；Nscale 没有公开标价。同行区间约 $2.00–4.00/GPU-hr H100 等价
        - id: utilization
          label: GPU 利用率
          detail: 未披露；目标未知。要覆盖固定 capex 和债务服务，需要高利用率（>80%）
        - id: realized-rev
          label: 实际收入 / GPU-hr
          detail: 合同价格 × 利用率；Nscale 的数字未公开
        - id: gpu-capex
          label: GPU 与机架 Capex（折旧）
          detail: H100/GB300 成本约 $20K–40K/台；DDTL 由 GPU 支撑；按 3–5 年摊销；COGS 主项
        - id: power-opex
          label: 电力 OPEX
          detail: 挪威站点受益于显著低于欧盟平均的水电价格；英国 / 美国站点费率更高；混合费率未披露
        - id: debt-service
          label: 债务服务（DDTL + Norway）
          detail: $2.19B+ 债务；年度服务成本未知；侵蚀自由现金流并压缩有效利润率
        - id: gross-margin
          label: 估算毛利率
          detail: 未披露；同行 GPU 云区间为 20–45%（CoreWeave、Nebius）；Nscale 的挪威能源优势可能支撑高端水平
      edges:
        - from: list-price
          to: realized-rev
          label: 合同定价
        - from: utilization
          to: realized-rev
          label: 容量填充
        - from: realized-rev
          to: gross-margin
          label: 收入线
        - from: gpu-capex
          to: gross-margin
          label: 折旧 COGS
        - from: power-opex
          to: gross-margin
          label: 能源 COGS
        - from: debt-service
          to: gross-margin
          label: 位于毛利率以下；影响 FCF
    approximationNotes: 所有中间值均根据同行公开数据（CoreWeave、Nebius）和行业基准估算。没有 Nscale 特定数字公开。债务服务单独列为成本，是为了突出其对自由现金流的影响，尽管在标准 P&L 呈现中它位于毛利率以下。
