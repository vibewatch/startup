      - number: '8.2'
        title: 可比分析与公开市场锚点
        blocks:
          - type: paragraph
            body: >-
              Nscale 最有用的外部锚点是 CoreWeave，因为它同时具备 NVIDIA 绑定、GPU 云暴露、hyperscaler 式客户集中，以及极大的资本需求。CoreWeave 2025 年 3 月 IPO
              估值约 $23 billion，对应约 $5 billion 年化收入，隐含约 4.6x EV/ARR；到 2026 年 Q1，CoreWeave 报告季度收入 $2.078 billion，并有 $99.4
              billion 积压订单，说明一旦 GPU 容量被客户验收并货币化，真实收入分母可以变得很大。把这一基准套到 Nscale 的 $14.6 billion 估值上，意味着所需 ARR 基础约 $3.2
              billion。Nebius、Lambda 和 Crusoe 提供二级参照：Nebius 是最接近的欧洲上市 AI 云基准，Lambda 和 Crusoe 则显示，私有 neocloud
              与电力优先型基础设施公司通常在低于或接近 Nscale 的估值水平融资，且公开收入支撑证据往往更有限。因此，可比组并不能证明 Nscale 不可能长进当前估值；但它确实说明，当前价格已经假设 Nscale
              会很快把 GPU 承诺转化为巨额收入，而公开披露还没有达到投资人通常用来验证该论点的水平。
