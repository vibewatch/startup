      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: Microsoft 单一客户集中是投资论点中最高风险
            body: >
              Microsoft 同时是 Nscale 每个重要场址的锚定租户。公开信息中没有发现规模相当的替代锚定客户。只要 Microsoft 的 AI 基础设施战略因任何原因改变，Nscale
              在所有地区都会同时面对收入管线、债务契约和估值受损。这种规模的基础设施业务，出现如此高的单一交易对手集中度并不常见；提供保护的合同条款（take-or-pay、终止费、介入权）并未公开。
            calloutType: risk
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR020
          - type: callout
            title: Loughton 规划争议是近期最具时间敏感性的阻碍
            body: >
              如果 Epping Forest District Council 支持 Loughton Town Council 要求重新提交规划申请，Nscale 的英国旗舰场址可能被推迟，甚至被取消。这是 Nscale
              风险中唯一带有近期二元结果的一项：修订申请要么在 2026-2027 年获批，要么英国主权 AI 超级计算机承诺坍塌。英国政府的 AI Opportunities Action Plan 明确点名
              Nscale；规划失败不仅有财务后果，也有政治后果。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
          - type: callout
            title: NVIDIA 投资人身份缓解但不能消除供应依赖
            body: >
              NVIDIA 参与 Series B 和 Series C 股权融资，为 Nscale 获得优先 GPU 分配提供了强烈的一致利益。但 NVIDIA 的 DGX Cloud 产品线，以及它与
              hyperscaler（AWS、Azure、GCP）的关系，也带来相互竞争的分配优先级，任何股权投资都无法在合同上压过这些优先级。投资人关系确实降低风险，但尽调中不应把它视为无条件供应保证。
            calloutType: insight
            claimRefs:
              - CR021
              - CR022
              - CR023
          - type: callout
            title: 出资前五项优先尽调要求
            body: >
              (1) 获取 Loughton 当前 EFDC 规划状态和决策时间表，以及 Microsoft UK 合同中的延误和终止条款。(2) 要求披露 Microsoft 在四个活跃场址的 take-or-pay
              条款和最低采购量承诺。(3) 获取 DDTL 契约条款、GPU 抵押覆盖率和基于里程碑的加速触发条件。(4) 确认 NSI Act 法律审查状态，以及外国投资人持仓是否获得 Investment Security
              Unit clearance。(5) 鉴于公司称 2026 年可能 IPO，要求提供组织架构图，并确认 CFO 和 General Counsel 任命。
