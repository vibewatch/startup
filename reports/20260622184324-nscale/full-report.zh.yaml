  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入与 ARR 确认
        - 2025 年和 2026 年 H1 经审计或管理层确认的收入与 ARR，并按客户和合同类型拆分
        - 核心估值输入；$14.6B 按 4.6x 倍数隐含约 $3.2B ARR；承销前必须确认已实现收入
        - 私人数据室；提交后的 S-1 招股说明书；牵头投资方 Aker ASA 出具的管理层确认函
      - - 毛利率与 EBITDA 披露
        - 任何 Nscale 业务单元或期间都没有公开毛利率、贡献利润率或 EBITDA 数据
        - GPU 部署业务资本开支重，利润率决定 GPU 规模是在杠杆下创造价值还是摧毁价值
        - 私人财务披露；IPO S-1；对标 CoreWeave 分部利润率（规模化后毛利率约 30-35%）
      - - 客户收入集中度
        - 未公开披露各客户收入占比；Microsoft 是锚定客户，但集中度比例未披露
        - 如果 Microsoft 收入占比超过 60%，一旦其削减支出或自建等效产能，收入风险会变成二元
        - 数据室合同审阅；S-1 风险因素分析；与 BT 及其他具名企业客户进行客户访谈
      - - 债务契约条款与覆盖结构
        - DDTL 和挪威融资工具的条款、契约条款与 GPU 抵押品覆盖率未公开披露
        - 公司尚处收入前状态，却已有合计 $2.19B 的 GPU 支持债务，带来再融资风险；契约条款违约可能触发债务加速到期
        - 法律顾问审阅 DDTL 条款清单和挪威融资协议；向 Aker ASA（牵头投资方、董事会成员）索取资料
      - - Loughton 规划结果
        - 截至 2026 年 6 月，Epping Forest District Council 尚未就新的规划申请作出最终决定
        - 对 Microsoft UK 的约 23,000 块 GPU 承诺依赖 Loughton 产能；延迟可能引发合同罚则或声誉损害
        - 监控 EFDC 规划登记（ref NOT/3025/26）；聘请英国规划专项法律顾问；审阅 Microsoft UK 合同条款
      - - 股权结构表优先权结构与反稀释条款
        - 四轮股权融资来自多个牵头投资方；清算优先权和反稀释条款未公开披露
        - $3.7B 股权融资形成的优先权包袱，可能在接近当前估值退出时显著压低普通股回报
        - 私人数据室；法律顾问审阅股东协议；409A 估值报告；投资者权利协议条款
    notes: 尽调路径假设可访问私人数据室；如果 Nscale 如其信号所示走向公开市场，多数事项会在 IPO S-1 文件中披露。优先级按紧迫性降序排列。
