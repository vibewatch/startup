  - id: TV002
    title: 正论点 / 反论点表
    columns:
      - 方向
      - 论点
      - 证据
      - 什么会改变观点
    rows:
      - - 正论点
        - Microsoft 锚定客户降低近期收入风险；200K+ GPU 承诺带来可预测现金流爬坡
        - 2025 年 10 月扩展交易，在 4 个数据中心覆盖约 200K 张 GPU；2026 年 4 月挪威 +30K Rubin；2026 年 5 月葡萄牙 +66K Rubin
        - Microsoft 正式削减或取消 25% 以上 GPU 部署承诺
      - - 正论点
        - 电力优先的垂直模式叠加挪威水电，相比燃气供电同行形成结构性低成本算力优势
        - Narvik 园区使用富余水电；Bain 2026 年 6 月确认，电力可得性已成为 AI 基础设施关键瓶颈
        - 超大规模云厂商在 Nscale 达到收入运行率之前，就规模化建成同等可再生能源供电的欧洲园区
      - - 正论点
        - Goldman Sachs + JPMorgan 参与，以及精英董事会（Sandberg、Clegg、Decker），指向可信的近期 IPO 路径
        - Series C 联合配售代理；CEO 告诉 NYT 最早 2026 年 IPO；董事会 2026 年 3 月重组
        - 宏观 IPO 窗口关闭，投行退出，或关键董事会成员在申报前辞任
      - - 反论点
        - 公开信息没有收入、ARR、毛利率或 EBITDA 数据；无法有把握地承销 $14.6B 估值
        - 截至 2026 年 6 月，审阅所有 Nscale 新闻稿和媒体报道后确认：财务披露为零
        - 经审计收入超过 $1B，或公开 S-1 文件提供经验证财务披露
      - - 反论点
        - Loughton 规划异议和欧洲数据中心反对声音，可能推迟或阻断英国产能，威胁既定时间表
        - Loughton Town Council 要求重新提交规划申请；时间线滑至 2027 年 Q2；Edinburgh 暂停信号
        - Epping Forest District Council 批准规划，且施工按 2026 年 Q2 进度启动
      - - 反论点
        - 前收入资产负债表上已有 $2.19B 已提款债务；一旦 GPU 部署延迟，再融资和契约风险会放大
        - DDTL $1.4B 以 GPU 资产支持；挪威 $790M；在未披露收入覆盖率情况下，总已提款杠杆偏高
        - Nscale 披露已签约 GPU 产能带来的债务服务覆盖率高于 1.5x，或用 IPO 募资偿债
    notes: 论点由公开来源综合而成；改变观点的门槛仅作示例。
