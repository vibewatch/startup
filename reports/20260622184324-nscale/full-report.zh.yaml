      - number: '4.3'
        title: 资本结构与融资依赖
        blocks:
          - type: paragraph
            body: >
              Nscale 搭建了大型数据中心项目开发商典型的多层资本结构。股权端，2025 年 9 月 $1.1B Series B（Aker ASA 领投， NVIDIA、Nokia、Dell、Fidelity、Blue
              Owl、G Squared、Point72 参投）之后，公司在 2026 年 3 月完成 $2B Series C， 按公司说法是欧洲史上最大股权融资，Nscale 估值达到 $14.6B。Series C 包括
              2025 年 10 月完成的 $433M pre-Series C SAFE（Blue Owl、Dell、Nvidia、Nokia 支持），其余资金在交割时募集。Aker 在 Series B 投入
              $285M，取得 9.3% 完全稀释后持股；Aker-Nscale 的 Norway 合资公司也作为 Series C 的一部分完全并入 Nscale。Goldman Sachs 和 J.P. Morgan 担任
              Series C 联席配售代理；CEO Josh Payne 2026 年 3 月告诉 New York Times，IPO 可能「as early as this year」。

              债务端，Nscale 2026 年 2 月完成一笔以 GPU 机队作抵押的 $1.4 billion 延迟提款定期贷款（DDTL），并在 2026 年 5 月 为 Narvik 数据中心拿到 $790M
              挪威银行融资（ABN AMRO、DNB、Eksfin、Nordea、SEB），另有 $790M 未承诺 accordion， 可支持再增加 115MW。已披露债务义务合计约 $2.19B；DDTL 的 GPU
              抵押结构意味着，一旦 GPU 价值下跌或现货市场价格继续压缩， 公司面临按市值重估风险。两项融资的 covenant 条款、偿债覆盖率和 LTV 要求均未公开披露。
