      - number: '7.5'
        title: 运营交付、人员与 ESG 风险
        blocks:
          - type: paragraph
            body: >
              Nscale 同时在六个国家建设或规划数据中心——英国、挪威、葡萄牙、芬兰、美国（Texas + West Virginia）和冰岛——首批运营日期从 2026 年延伸到 2028 年。截至 2026 年 6
              月，挪威 Glomfjord 是唯一确认已运营的 GPU 数据中心；所有主要园区项目都还处于建设或规划阶段。这套多国并行建设计划，由 2024 年 5 月成立的控股实体、2025 年 12
              月成立的英国运营实体，以及仍在搭建中的管理团队执行：Sam Huckaby 2026 年初从 Oracle Cloud Infrastructure 加入，担任 President of Data
              Centers，在最密集的建设和交付阶段任职还不到 6 个月。Josh Payne 作为唯一 CEO 和创始人，是最关键的单点人物；所有重大新闻稿、投资者沟通和战略公告都归于他本人。

              2026 年 4 月宣布的 BT 合作，为英国三处 BT 场址增加 14 MW AI 数据中心容量，虽然规模较小，但又新增了一条并行交付线。Nscale 在所有地区已宣布的总管线超过 3 GW
              已签约或已承诺容量，交付承诺延续到 2028 年；以当前人员规模和组织年龄，其能否在不出现质量或进度失败的情况下同时执行，尚未得到独立验证。

              ESG 和声誉层面，Datacentre Review 2026 年 3 月报道称，Nscale 因 Loughton 方案成为「最新一家受到严格审视的公司」，电网影响是主要公众担忧。同一篇文章提到
              Edinburgh Council 正考虑暂停新数据中心，说明地方政府反对正在成为行业性模式，而不是单一场址问题。European Parliament Research Service（2025 年 7
              月）认为，AI 数据中心「会给本地电网施压，并在气候目标、土地使用和能源可负担性之间带来取舍」。Nscale 承诺挪威场址 100%
              使用可再生能源——考虑到挪威水电充裕，这一说法可信——但没有披露英国（National Grid）、Texas（ERCOT）或 West
              Virginia（PJM）场址的能源结构、认证方法或可再生能源信用框架，而这些电网的碳强度明显更高。Bain 的 AI 数据中心预测把电力约束列为大型 AI
              基础设施建设的首要执行风险，部分地点面临公用事业瓶颈，可能把交付周期拉长到 24 个月以上。
