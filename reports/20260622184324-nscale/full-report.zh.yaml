              - CE041
          - type: callout
            title: Loughton 规划延误与更广泛 UK 监管逆风
            body: >
              Loughton Town Council 因电网担忧和拟议容量增加，要求 50–90 MW UK campus 重新提交规划申请。这延续了 UK 数据中心规划反对的更广泛模式。 时间线已经从 2026 年 Q4
              滑到 2027 年 Q2；考虑到 Microsoft 合同要求 23,040 块 GB300 GPU 在 2027 年 Q1 上线，进一步延误很实质。
            calloutType: risk
            claimRefs:
              - CE010
              - CE045
              - CE046
          - type: callout
            title: 无公开 ISO/SOC 2 认证限制受监管企业买家可服务市场
            body: >
              截至 2026 年 6 月，Nscale 未披露 ISO 27001、SOC 2 Type II、ISO 42001 或同等认证。相比持有 ISO 27001:2022 和 ISO 42001:2023 的
              Crusoe， 这是实质缺口，也限制了 Nscale 在金融、医疗和政府等受监管企业买家中的可服务市场，因为这些买家要求第三方安全审计证据。
            calloutType: risk
