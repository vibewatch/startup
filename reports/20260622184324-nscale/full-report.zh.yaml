          label: 抹去 80%+ 已签约容量收入
        - from: microsoft_reduction
          to: ddtl_covenant
          label: 交付里程碑落空触发契约
        - from: gpu_price_compression
          to: ddtl_covenant
          label: 削弱支撑 DDTL 的 GPU 抵押品
        - from: gpu_price_compression
          to: revenue_shortfall
          label: 压缩按需和现货利润率
        - from: delivery_delay
          to: revenue_shortfall
          label: 未投产站点拖慢收入爬坡
        - from: delivery_delay
          to: ddtl_covenant
          label: 基于里程碑的契约可能违约
        - from: esg_backlash
          to: delivery_delay
          label: 规划审批受阻或延迟
        - from: revenue_shortfall
