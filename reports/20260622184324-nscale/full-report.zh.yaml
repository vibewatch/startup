      - number: '5.6'
        title: 信任、主权、安全与合规
        blocks:
          - type: paragraph
            body: >
              Nscale 的安全负责人是 CISO Latha Maripuri，此前任职 Uber、News Corp 和 IBM，负责网络、物理和供应链安全。公司的核心合规主张是主权 AI 设计：
              所有设施都内置本地数据驻留控制，UK 和 EU 客户可通过合同把工作负载限制在司法辖区内。BT 主权 AI 平台专为 UK 监管、数据驻留和安全要求打造，
              覆盖医疗、公共服务、能源、金融和关键国家基础设施。Nscale 官网页脚链接到 Transparency & Human Rights policy。截至 2026 年 6 月，Nscale 官网或新闻材料
              未披露公开 ISO 27001、ISO 42001、SOC 2 或同等第三方认证——相比 Crusoe（ISO 27001:2022 + ISO 42001:2023）及类似 neocloud 同行，这是缺口。
              West Virginia Monarch campus 增加了美国主权设计、保护本地缴费用户免受成本转嫁的州法、零市政用水的闭环冷却，以及限制社区噪音影响的封闭式发电机布置。 Loughton
