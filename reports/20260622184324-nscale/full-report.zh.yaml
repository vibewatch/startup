      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Nscale 跑出了欧洲 AI 史上最快的融资轨迹之一。$155M Series A 在 2025 年 1 月前宣布。2025 年 9 月，公司完成 $1.1B Series B，由 Aker ASA
              领投；Aker ASA 承诺投入 $285M 现金和 Narvik 土地实物资产，按完全摊薄口径取得 9.3% 股权，并有潜在 earn-out 可提升至 12.2%。Series B 还吸引了 Sandton
              Capital、Blue Owl、Dell、Fidelity Management and Research、G Squared、Nokia、NVIDIA、Point72 和 T.Capital；Goldman
              Sachs 担任独家配售代理。

              2025 年 10 月，Nscale 获得 $433M pre-Series C SAFE，支持方包括 Blue Owl、Dell、NVIDIA 和 Nokia。2026 年 2 月，公司获得一笔以 GPU
              为支持的 $1.4B Delayed Draw Term Loan，用于欧洲集群部署融资。2026 年 3 月 9 日，$2B Series C 完成，由 Aker ASA 和总部位于 New York 的
              8090 Industries（Rayyan Islam 联合创办）领投，Astra Capital、Citadel、Dell、Jane Street、Lenovo、Linden
              Advisors、Nokia、NVIDIA 和 Point72 参与。官方新闻稿称 $2B 数字「inclusive of the Pre-Series C SAFE」，意味着 Series C 净新增股权约
              $1.567B。Goldman Sachs 和 JPMorgan 担任联合配售代理；TechCrunch 指出，两家机构参与释放了可能准备 IPO 的信号。投后估值为 $14.6B。

              2026 年 5 月，ABN AMRO、DNB、Eksfin、Nordea 和 SEB 为 Narvik 数据中心承诺 $790M 项目融资，并附带额外 $790M 手风琴额度。已披露股权融资总额约
              $3.7B（Series A $155M + Series B $1.1B + pre-C SAFE $433M + Series C $2B），债务与项目融资总额约 $2.19B（DDTL $1.4B +
              挪威银行融资 $790M）。收入、ARR、毛利率和净收入留存率均未公开披露。
