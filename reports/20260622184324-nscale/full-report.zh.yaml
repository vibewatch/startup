      - number: '3.3'
        title: 能力对比、定价与市场进入
        blocks:
          - type: paragraph
            body: >-
              在 GPU 可获得性上，Nscale 最关键的差异化是承诺 2027 年部署 NVIDIA Vera Rubin 平台——使其进入全球首批供应商，也成为 Microsoft
              之外第一家部署该架构的欧洲公司。此前，公司已在 Texas、英国、挪威和葡萄牙站点部署 NVIDIA GB300 GPU，并由 200,000 块 GPU 的 Microsoft 合同支撑。CoreWeave
              同样拥有 NVIDIA preferred partner 身份和 Platinum ClusterMAX 评级，Lambda 与 Nebius 对最新 GPU 世代的可获得性记录则更有限。

              定价方面，Lambda 公布了最有竞争力的按需价格：H100 为 $3.99/GPU-hr，B200 SXM6 为 $6.69/GPU-hr。Nebius 面向欧盟客户提供 H100，价格约
              $2.15–$3.85/GPU-hr，并有预留和按需选项。CoreWeave 不公布标价；企业合同经谈判确定。Nscale 也不公布零售 GPU-hour 定价，这符合其锚定租户 / 超大规模云合同 GTM
              模式，而非自助式开发者云。Azure GPU 实例（例如 NDv5 H100 按需约 $3.60/GPU-hr）构成超大规模云基准，重大企业折扣计划会降低有效费率。

              市场进入策略分化明显。CoreWeave 走多客户 AI-native 模式，扩大与前沿实验室和金融公司的企业关系。Lambda 面向开发者和研究人员规模化，拥有数万名自助客户。Nscale 把 GTM
              集中在大规模锚定租户——主要是 Microsoft——以及主权 AI 合作（BT、OpenAI for Stargate Norway）。这让 Nscale 通过签约交付获得可预测收入可见度，但也限制其触达
              Lambda 和 CoreWeave 竞争的更广泛按需 GPU 云市场。Crusoe 的 GTM 介于两者之间：为 AI-native 实验室提供专用园区预订，另有 Spark 模块化工厂产品，Nscale
              没有直接对应物。
