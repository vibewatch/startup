      - number: '6.3'
        title: 采用轨迹与市场背景
        blocks:
          - type: paragraph
            body: >
              Nscale 签约 GPU 管线的推进速度反映了异常强的需求加速：公司从 2025 年 9 月 $1.1 billion Series B，到 2026 年 3 月以 $14.6 billion 估值完成 $2
              billion Series C，每次融资都由新的 Microsoft GPU 合同公告锚定。Microsoft 交易轨迹显示承诺规模持续扩大——2025 年 9 月最初的 Loughton 和 Norway
              公告，随后是 2025 年 10 月扩大的 200,000 块 GPU 交易、2026 年 4 月 Narvik Rubin 扩容、2026 年 5 月 Portugal Rubin 扩容——
              更像一段实时升级的商业关系，而非单一合同。

              Nscale 推理平台的 148× 扩张是公司声称的采用指标，但外部未验证。如果准确，它说明开发者和 SME 推理分部需求牵引很强。推理平台支持 Slurm 和 Kubernetes 编排，暗示既有企业 HPC
              风格工作负载，也有 cloud-native ML 团队在消费。

              Nscale 的部署地理与两条关键需求向量对齐：（1）欧洲主权 AI 需求，由 GDPR、EU AI Act 和国家 AI 战略驱动（UK AI Opportunities Action Plan、 Norway
              工业政策）；（2）北美 hyperscaler 基础设施外包需求，由 Microsoft 已记录的容量约束和大规模 GPU 采购驱动。EU AI Continent Action Plan、 Microsoft
              2026 年 Q1 全球 AI 采用报告和 Bain AI 数据中心预测，都描述了结构性加速的需求，验证 Nscale 的大规模建设路径。

              最重要的采用信号，是 Microsoft 连续多个季度扩大承诺，最终在 Norway 新增 30,000 块 Rubin GPU（2026 年 4 月），在 Portugal 新增 66,000+ 块 Rubin
              GPU（2026 年 5 月）。每次扩容都发生在前一批部署向投运推进之后，说明运营满意度足以触发后续签约；在未披露 NRR 数据时，这是最接近 land-and-expand 动作的可用替代指标。
