      - number: '1.4'
        title: 运营规模与数据中心
        blocks:
          - type: paragraph
            body: >
              Nscale 的运营足迹横跨多个大洲。首个且当前已运营站点位于挪威 Glomfjord，是一座 60MW、由可再生能源供电的数据中心。Narvik（Kvandal）园区是旗舰项目：2025 年 7 月以
              Stargate Norway 名义宣布，由 Nscale 与 Aker ASA 和 OpenAI 合作，目标到 2026 年底部署 100,000 块 NVIDIA GPU；这座 230MW 站点随后在
              2025 年 9 月通过 Aker JV 整合进一步加深合作，Microsoft 接手成为主要锚定租户（OpenAI 关系仍在 Stargate UK 下保持活跃，但 Narvik 的承购方主要转为
              Microsoft）。2026 年 4 月，Nscale 扩大了与 Microsoft 的 Narvik 协议，新增 30,000 多块 NVIDIA Rubin GPU。

              在英国，Nscale 于 2025 年 1 月收购 Essex 的 Loughton 站点，计划建设一座 50MW 设施（可扩至 90MW），从 2027 年 Q1 起为 Microsoft Azure 容纳约
              23,040 块 NVIDIA GB300 GPU。原定 2026 年 Q4 完工时间被调整至 2027 年 Q1，官方归因于 NVIDIA Vera Rubin 200 技术升级。2026
              年初出现规划复杂性：Nscale 提出比 2024 年原有框架批准大 50% 的配置后，Loughton Town Council 官员要求提交新的规划申请。

              在美国，Nscale 从 Ionic Digital 租赁 Texas 站点，用于约 104,000 块 NVIDIA GB300 GPU，形成约 240MW 超大规模园区，自 2026 年 Q3 起服务
              Microsoft。在 GTC 2026（2026 年 3 月 16 日）上，Nscale 通过收购 AIPCorp 拿下 West Virginia 的 Monarch Compute Campus（位于
              Mason County，面积最高 2,250 英亩，是美国首个州认证 AI 微电网，可扩至超过 8GW），并与 Microsoft 签署 1.35GW AI 算力 LOI。葡萄牙 Sines 的 Start
              Campus 容纳 12,600 块 NVIDIA Blackwell Ultra GPU（自 2026 年 Q1 起），并在 2026 年 5 月新增扩展协议，加入 66,000 多块 NVIDIA Vera
              Rubin NVL72 GPU（合计投资超过 €695M）。2026 年 4 月，与 BT 的合作在三个英国 BT 网络站点增加 14MW。Nscale 还与 Fortum 签署站点开发协议，计划在芬兰
              Harjavalta 建设未来数据中心。额外合作方运营站点列在 Keflavik（冰岛）、Stavanger、Oslo、Blönduós（挪威）、Slough 和 North Carolina。Nscale
              当前总容量超过 1GW，全球 GPU 管线目标超过 300,000 块 NVIDIA 设备。
