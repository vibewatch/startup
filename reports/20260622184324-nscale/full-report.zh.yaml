      - number: '2.5'
        title: 监管与政策环境
        blocks:
          - type: paragraph
            body: >-
              两套政府框架直接塑造 Nscale 的可服务市场。在英国，AI Opportunities Action Plan（2025 年 1 月）获得首相 Starmer 背书，50
              条建议全部被接受，承诺设立可加速规划许可的 AI Growth Zones、把公共算力容量提高 20 倍，并建设 National Data Library。首个 AI Growth Zone 设在
              Oxfordshire 的 Culham。Vantage Data Centres、Nscale 和 Kyndryl 同步承诺 £14B 私人投资和 13,250
              个岗位，验证政府刺激需求不是口号，而是真实市场催化剂。Nscale 的 $2.5B 英国投资被每一份政府公告引用，使其成为政策证明点，也让公司声誉与未来政府 AI 采购决策对齐。

              在欧洲层面，预计 2025–2026 年出台的 EU Cloud and AI Development Act 目标在 5–7 年内把数据中心容量提高两倍，直接扩张欧盟主权 AI 市场。EU Energy
              Efficiency Directive 要求数据中心报告能源消耗、水使用和可再生能源采购。全球数据中心用电需求预计到 2030 年将翻倍以上，达到约 945
              TWh。挪威因水电盈余而拥有欧洲最低成本的可再生电力之一，为 Nscale 的 Narvik 和 Glomfjord 站点提供结构性能源成本优势，并支持 100% 可再生电力采购——这让 Nscale 在欧盟
              2030 年气候中和数据中心目标以及欧洲企业 ESG 采购政策下处于有利位置。

              出口管制风险存在于边际：受芯片出口限制影响，中国 AI 基础设施支出在 2025 年 Q4 下滑 8.1%，证明技术政策可以重塑市场地理。虽然出口管制当前利好 Nscale 等欧洲供应商（EMEA GPU
              分配竞争减少），但如果美国技术出口政策演变为限制非美国 AI 基础设施运营商，也会释放系统性监管风险信号。
