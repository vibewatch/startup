        - Nscale 运营 AI 服务栈（Inference Endpoints、Fine-tuning、Prompt Workbench）；合规计划未公开确认；在葡萄牙、挪威有欧盟相关站点部署
        - 未公开 EU AI Act 合规声明，增加尽调负担；随着 AI Office 成熟，存在执法风险
