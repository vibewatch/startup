            body: >
              Nscale 的计算栈完全建立在 NVIDIA GPU 代际之上，每一代都在 Microsoft 多年承诺下按超大规模部署。目前已部署代际是 NVIDIA Blackwell GB300 （GB300
              Ultra）：Texas campus 承诺约 104,000 块 GPU，Portugal Start Campus 第一栋承诺 12,600 块，二者都从 2026 年开始。Loughton campus
              已为 2027 年 Q1 签约 23,040 块 NVIDIA GB300 GPU。Narvik campus 最初签约 52,000 块 NVIDIA GB300 GPU，现在为 2027 年阶段扩展到
              30,000+ 块 NVIDIA Vera Rubin GPU；此前一份协议覆盖早期 tranche 约 52,000 块 GB300 GPU。总体看，2025 年 10 月签署的 Microsoft 交易 与
              Dell 协作，在欧洲和美国合计承诺约 200,000 块 NVIDIA GB300 GPU。2027 代 NVIDIA Vera Rubin NVL72 平台把推理 token 成本降低 10×， 训练 MoE
