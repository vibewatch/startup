      - number: '3.5'
        title: 护城河耐久性、替代风险与竞争对手负面证据
        blocks:
          - type: paragraph
            body: >-
              Nscale 最耐久的护城河，是其与 NVIDIA 和 Microsoft 建立得早且集中的关系。作为 Microsoft 之外首家将在 2027 年部署 NVIDIA Vera Rubin NVL72
              的欧洲提供商，Nscale 在欧洲前沿 AI 基础设施上获得有意义的先发优势；但一旦 NVIDIA Vera Rubin 平台进入更广泛商业可得状态，该优势会被侵蚀。以 GPU 为支持的 $1.4B
              延迟提款定期贷款（2026 年 2 月）和 $790M 挪威项目融资（2026 年 5 月）证明，Nscale 能获得以 GPU 资产为抵押的结构化债务——Lambda
              等同行无法以同等规模复制这种资本结构，因此硬件护城河之外还有融资护城河。

              最实质的替代风险，是 Nscale 围绕 Microsoft 的客户集中度。Microsoft 在 Nscale 的 Texas、英国、挪威和葡萄牙站点签约约 200,000 块 NVIDIA GPU——它既是
              Nscale 最大锚定租户，又通过 Azure GPU 云服务直接竞争。如果 Microsoft 削减 Nscale 配额、加速内部建设或重新谈判条款，Nscale 的收入可见度会崩塌。CoreWeave
              也面临自己的超大规模云客户集中（Microsoft 也是 CoreWeave 头部客户），但 CoreWeave 拥有 Cohere、Jane Street、Mistral 和数百家 AI-native
              公司构成的多元客户基础，比 Nscale 的收入前锚定租户模式更有韧性。

              所有新云面对的更广泛商品化风险，同样适用于 Nscale。Bain 2026 年 6 月预测称，数据中心行业正在进入一个「disciplined,
              power-constrained」阶段，超大规模云厂商变得更有选择性；IDC 统计的 2025 年 $318B AI 基础设施支出——预计到 2029 年达到 $1T——主要由超大规模云 capex
              主导，而非新云收入。CoreWeave 在 $2.078B 收入上录得 2026 年 Q1 $144M 运营亏损，确认新云运营杠杆尚未被证明。Nscale
              未披露收入，且相对发展阶段承担的资本承诺显著更重，证明单位经济性的路径更陡。2023 年从加密挖矿公司 Arkon Energy 拆分，也意味着 Nscale 缺少 CoreWeave 在 IPO
              后通过季度公开文件建立的多年企业运营记录。
