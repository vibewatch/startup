      nodes:
        - label: 全球 AI 基础设施 TAM：到 2029 年 $1T+
          detail: IDC：FY 2025 实际 $318B（同比 +108%）；2026 年预测 $487B；按约 31% CAGR 到 2029 年超过 $1T。包括全球服务器、网络、冷却和电力。
          tone: neutral
        - label: 全球 GPU 云租赁市场：估计到 2026 年年化运行率约 $30–50B+
          detail: >-
            推导：CoreWeave 2026 年 Q1 收入 $2.1B，年化约 $8.3B。完整新型云市场（CoreWeave、Lambda、Nscale、Nebius 及同行）估计到 2026 年底年化运行率为
            $30–50B+。
          tone: neutral
        - label: 欧洲 AI 基础设施支出：2025 年约 $20–38B
          detail: >-
            分析师估计：占 IDC 全球 AI 基础设施支出的 7–12%；Microsoft $30B 英国承诺以及 EU Cloud and AI Development Act 计划在 5–7
            年内将欧盟产能提高两倍，支撑该估计。
          tone: positive
        - label: Nscale SAM（欧洲主权级 GPU 云）：到 2030 年约 $3–8B
          detail: 受 Nscale 已签约 GPU 管线（向 Microsoft 提供约 200,000 块 GPU；全球 300,000-GPU 计划）、主权级定位和建设时间线约束。
          tone: positive
    approximationNotes: >-
      SAM 是分析师基于 Nscale 已披露签约承诺和 IDC 区域数据搭建的口径；未找到欧洲主权 GPU 云租赁的一手研究。TAM 与 GPU 云租赁层级在方向上与 IDC 和 CoreWeave
      公开数据一致，但方法不同（capex 与租赁收入）。各层级不可相加。
