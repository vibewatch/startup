      - number: '3.4'
        title: 信任、主权与监管姿态
        blocks:
          - type: paragraph
            body: >-
              Nscale 已把主权 AI 基础设施做成竞争身份的基石，尤其是在英国和欧洲。其 2026 年 4 月与 BT 的合作——在三个 BT 英国站点交付最高 14MW 主权 AI 数据中心基础设施——把 Nscale
              定位为英国主权算力提供商，并与总部在美国的新云区分开来。Nscale、NVIDIA 和 BT 是英国 Sovereign AI Industry Forum 的创始成员之一，这是一个政府支持的联盟。Nscale
              的挪威园区完全由可再生水电供电，与欧盟可持续发展授权和数据主权框架对齐。

              Nebius 是最直接的欧洲主权 AI 对标方，具备欧盟优先定位、强调 GDPR 合规，并拥有既有欧盟云基础设施。不过，Nebius 没有 Nscale 与英国国家电信在位者的合作，也没有 Stargate
              Norway OpenAI 关系。欧洲主权 AI 的关键战场——监管合规、数据驻留和政府关系——正是 Nscale 的 BT 合作、挪威可再生能源资质和参与 UK AI Opportunities Action
              Plan 共同构成可信护城河之处，使其相较美国新云更有优势。

              负面来看，Nscale 位于 Essex 的 Loughton 数据中心遭到 Loughton Town Council 新一轮规划反对；后者要求提交一份全新的规划申请，理由是拟议范围增加 50%
              且存在电网担忧。全行业反对声也在上升：DataCentre Review 2026 年 3 月报道称，Edinburgh Council 宣布计划暂停新数据中心开发。Loughton 项目完工时间已从最初预测滑至
              2027 年 Q2，构成交付风险，也释放出总部在英国的新云所面对的更广泛规划环境信号。这种负面规划背景，是 CoreWeave 美国业务或 Nebius 欧盟数据中心并未同等程度面对的结构性逆风。
