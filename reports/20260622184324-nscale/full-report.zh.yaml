    type: pyramid
    layout: standard
    summary: 全球 AI 基础设施 TAM（2025 年 $318B；到 2029 年 $1T+）收窄到 2030 年约 $3–8B 的欧洲主权 AI 云 SAM，边界由 Nscale 已签约产能、主权数据驻留要求和当前政策驱动需求共同决定。
