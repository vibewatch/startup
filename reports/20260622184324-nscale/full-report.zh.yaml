      - number: '4.5'
        title: 财务缺口与承销判断
        blocks:
          - type: paragraph
            body: >
              用于预尽调承销时，Nscale 的财务画像在结构上不透明。公司没有 SEC 报告义务，除 Companies House 年度账目外， 未在公开域提交财务报表（最近一次为截至 2024 年 12 月 31
              日年度；2025 年账目应于 2026 年 9 月 30 日提交， 尚不可得）。截至运行日，NSCALE GLOBAL HOLDINGS LIMITED（Companies House 15749408）的
              confirmation statement 已逾期。 NSCALE LIMITED（16925886）于 2025 年 12 月 22
              日注册，似乎是运营实体，但没有提交账目。经审计财务、管理账目和投资人材料均未公开。

              核心财务承销阻塞点包括：（1）GPU 云和基础设施合同没有披露毛利率——按需 GPU-hr、预留容量、construction-and-leaseback 之间的收入组合未知；（2）没有每 GPU-hr
              实际价格，Microsoft 交易的经济性无法从公开记录建模；（3）没有现金余额或月 burn rate， Series C 后 runway 无法验证；（4）$2.19B 债务的 covenant
              条款和偿债覆盖率未知，公司暴露于加速还款或 covenant 违约风险； （5）客户高度集中在 Microsoft，覆盖所有主要地理区域，收入多元化证据有限。Loughton
              规划与许可延误——现在需要重新提交申请—— 又给 Microsoft 合同 UK tranche 增加了排期风险。没有 data-room 访问，本章只能确认公司融到了资本，无法确认当前阶段财务状况稳健。
