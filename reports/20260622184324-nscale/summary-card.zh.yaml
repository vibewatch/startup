summary:
  headline: >-
    Nscale 已经拼出欧洲最有野心的 AI 基础设施平台之一，主权 AI 定位、顶级投资人和 Microsoft 锚定需求都在位；但公开记录仍缺少收入披露，客户极度集中，杠杆快速抬升，英国规划摩擦也让当前 $14.6B
    估值仍处在偏高区间。
