    - type: missing-source
      severity: material
      topic: GPU cloud pricing
      missingEvidence: "Publicly available Nscale GPU cloud pricing tiers (per-GPU-hour or per-instance rates for GB300/Vera Rubin class instances) in the European and UK market as of H1 2026."
      whyItMatters: "Without pricing data, it is impossible to assess Nscale's premium vs. hyperscaler spot or to model unit economics, revenue per GPU, and competitive positioning relative to CoreWeave, Lambda, or Azure EU sovereign cloud."
      diligencePath: "Request current price list from Nscale investor relations; review Nscale Cloud API documentation, pricing page, and any published procurement frameworks for UK public sector customers."
      relatedQuestionRefs: [QM008, QM014]

    - type: private-evidence-only
      severity: material
      topic: contracted vs speculative capacity
      missingEvidence: "Breakdown of Nscale's stated 300,000-GPU global pipeline into: (1) contractually signed and committed, (2) LOI/MOU stage, and (3) speculative greenfield pipeline — with corresponding MW and timeline."
      whyItMatters: "The contracted-vs-speculative split is the primary determinant of revenue visibility and execution risk. A 300,000-GPU headline is strategically significant but analytically opaque if the majority is conditional or subject to hyperscaler option rights."
      diligencePath: "Request a site-by-site capacity table from Nscale investor relations with contract status (signed/LOI/pipeline), customer (if disclosed), MW capacity, and expected operational date for each facility."
      relatedQuestionRefs: [QM027]

