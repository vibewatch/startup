callouts:
  - calloutType: strength
    title: Sovereign AI Policy Creates a Structural, Policy-Enforced Demand Floor
    body: >-
      The UK AI Opportunities Action Plan and EU Cloud and AI Development Act collectively create
      a regulatory demand floor for sovereign AI compute that hyperscaler shared clouds structurally
      cannot meet. Nscale's citation in UK government announcements alongside Microsoft, NVIDIA,
      and OpenAI positions it as an institutional proof-point, accelerating public sector
      procurement decisions and reducing demand risk relative to pure-play neocloud peers.
    claimRefs: [CM019, CM020, CM021, CM022, CM023, CM025]

  - calloutType: risk
    title: Power Grid Constraints and Planning Opposition Impose Real Timeline and Cost Risk
    body: >-
      Grid connection queues of 3–10 years and growing community opposition — evidenced by Loughton's
      planning complications and Edinburgh's proposed moratorium — create material delay and cost risk
      for Nscale's UK capacity additions. Loughton's Q2 2027 timeline represents a 12+ month
      slip on its flagship sovereign UK campus, affecting when sovereign-premium UK revenue begins
      to contribute materially to the run-rate.
    claimRefs: [CM029, CM030, CM031, CM032]

  - calloutType: risk
    title: Microsoft Concentration Amplifies Revenue Sensitivity to a Single Relationship
    body: >-
      Nscale's announced contracted GPU capacity is dominated by Microsoft across all four
      active geographies (UK, Norway, Portugal, US). This concentration exposes Nscale to
      meaningful contract-renewal, pricing, and capacity-direction risk from a single buyer
      that also operates directly competing Azure cloud infrastructure. No secondary hyperscaler
      anchor tenant has been publicly announced to diversify this dependency.
    claimRefs: [CM019, CM033, CM039]

  - calloutType: insight
    title: Inference Shift Structurally Favours Modular Distributed Infrastructure
    body: >-
      Bain's June 2026 analysis confirms inference — not training — is now the centre of gravity
      for AI infrastructure demand, with test-time compute favouring smaller, distributed,
      lower-latency sites over frontier-model mega-campuses. Nscale's modular data center format
      and BT network-site co-location strategy are architecturally aligned with this demand shift,
      potentially opening a distributed inference edge market beyond its current large-campus
      hyperscaler contracts.
    claimRefs: [CM013, CM017, CM024, CM036]

