  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: regulatory-legal
      missingEvidence: >
        Confirmation of whether Nscale or its major foreign investors have filed any notification
        with the UK Investment Security Unit under the NSI Act 2021, or obtained informal
        clearance for the data infrastructure sector.
      whyItMatters: >
        Failure to notify is a criminal offence under the NSI Act; retroactive notification or
        a call-in by the ISU could void investments, restrict UK government contracts, and delay
        IPO registration. Given Aker ASA (Norwegian), Citadel (US), and other foreign shareholders,
        the materiality of this gap is high.
      diligencePath: >
        Request NSI Act legal review documentation from Nscale's UK legal advisers; confirm
        whether the Investment Security Unit has received any informal pre-notification; review
        shareholder cap table against the notifiable acquisition threshold criteria in the
        National Security and Investment Act 2021 (Notifiable Acquisitions) (Specification of
        Qualifying Entities) Regulations 2021.
      relatedQuestionRefs: [QR012]
      relatedTableRefs: [TR001]

    - type: private-evidence-only
      severity: material
      topic: financial-risk
      missingEvidence: >
        The specific financial covenants, milestone triggers, collateral coverage ratios, and
        cross-default provisions in the $1.4B DDTL and the $790M Nordic Narvik project
        financing are not publicly disclosed.
      whyItMatters: >
        Covenant terms determine whether a Loughton planning delay, a NVIDIA Vera Rubin
        production slip, or a Microsoft capacity reduction would constitute an event of default
        or trigger accelerated repayment. Without this data, investors cannot independently
        assess debt service risk or the sensitivity of the capital structure to delivery delays.
      diligencePath: >
        Request DDTL facility agreement, Nordic loan agreement, and any intercreditor or
        security sharing agreement; negotiate information rights in any investment that include
        covenant compliance certificates and borrowing base reports.
      relatedQuestionRefs: [QR029]

    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: >
        Microsoft take-or-pay provisions, minimum volume commitments, termination fees, and
        step-in rights across the UK, Norway, Portugal, and Texas site agreements have not
        been publicly disclosed; the West Virginia LOI has not been converted to a binding
        definitive agreement.
      whyItMatters: >
        The degree of downside protection if Microsoft reduces or terminates capacity
        commitments is the single most important unknown in the Nscale investment thesis;
        without knowing contractual protections, the customer concentration risk cannot be
        quantified or mitigated in due diligence.
      diligencePath: >
        Request the Microsoft master services framework, site-level capacity agreements, and
        the WV LOI/binding contract; specifically review termination, force majeure, and
        minimum purchase obligation provisions.
      relatedQuestionRefs: [QR014, QR016]

    - type: private-evidence-only
      severity: material
      topic: financial-risk
      missingEvidence: >
        Nscale has not filed audited accounts for any entity at Companies House as of June 2026;
        no revenue, gross margin, EBITDA, or cash position has been publicly disclosed.
      whyItMatters: >
        Without audited financial statements, investors cannot independently assess revenue
        trajectory, debt service capacity, working capital, or whether the company is generating
        any cash from its earliest operational sites (e.g. Glomfjord). This is a core diligence
        gap for any equity or debt investment.
      diligencePath: >
        Request full management accounts for Nscale Global Holdings and its operating
        subsidiaries; request revenue from Glomfjord operations; request waterfall of
        capital commitments vs. capital in hand and draw schedule for DDTL and Nordic
        project finance.

    - type: missing-source
      severity: minor
      topic: operational-delivery
      missingEvidence: >
        Nscale has not disclosed any security posture documentation, ISO 27001 certification
        status, SOC 2 Type II reports, NCSC Cyber Essentials status, or NIS2 Directive
        compliance programme for its AI cloud platform.
      whyItMatters: >
        Nscale markets sovereign AI workloads for defence, healthcare, and government customers
        via BT and direct channels; absence of independently verified security posture is a
        qualification barrier for these customers and a regulatory risk under UK NIS and EU NIS2.
      diligencePath: >
        Request current security certifications, penetration test results, and any NCSC or
        DSIT security reviews applicable to Nscale's data centre and cloud platforms; confirm
        ISO 27001 and SOC 2 Type II status for all operational sites.
