callouts:
  - calloutType: risk
    title: Microsoft Single-Customer Concentration Is the Highest Investment-Thesis Risk
    body: >
      Microsoft is the anchor tenant across every material Nscale site simultaneously.
      No alternative anchor customer of comparable scale has been publicly identified.
      If Microsoft's AI infrastructure strategy changes—for any reason—it creates
      simultaneous revenue pipeline, debt covenant, and valuation impairment across
      all geographies. This is an unusually high single-counterparty concentration
      for any infrastructure business of this scale, and the contract terms providing
      protection (take-or-pay, termination fees, step-in rights) are not public.
    claimRefs: [CR014, CR015, CR016, CR020]

  - calloutType: risk
    title: Loughton Planning Dispute Is the Most Time-Critical Near-Term Blocker
    body: >
      The Loughton Town Council's demand for a fresh planning application, if sustained
      by Epping Forest District Council, could delay or eliminate Nscale's UK flagship
      site. This is the only Nscale risk with a near-term binary outcome: either the
      revised application is approved in 2026-2027, or the UK sovereign AI supercomputer
      commitment collapses. The UK government's AI Opportunities Action Plan explicitly
      names Nscale; a planning failure creates political as well as financial consequences.
    claimRefs: [CR001, CR002, CR003, CR013]

  - calloutType: insight
    title: NVIDIA Investor Status Mitigates but Does Not Eliminate Supply Dependency
    body: >
      NVIDIA's equity participation in both Series B and Series C creates a strong
      alignment incentive for preferred GPU allocation to Nscale. However, NVIDIA's
      DGX Cloud product line and its relationships with hyperscalers (AWS, Azure, GCP)
      create competing allocation priorities that no equity investment can contractually
      override. The investor relationship is a genuine risk-reducing factor, but should
      not be treated as an unconditional supply guarantee in diligence.
    claimRefs: [CR021, CR022, CR023]

  - calloutType: recommendation
    title: Five Priority Diligence Asks Before Committing Capital
    body: >
      (1) Obtain current EFDC planning status and decision timeline for Loughton, plus
      Microsoft UK contract delay-and-termination terms. (2) Request Microsoft take-or-pay
      provisions and minimum volume commitments across all four active sites. (3) Obtain
      DDTL covenant terms, GPU collateral coverage ratio, and milestone-based acceleration
      triggers. (4) Confirm NSI Act legal review status and any Investment Security Unit
      clearance for foreign investor positions. (5) Request organisational chart and
      confirm CFO and General Counsel appointments, given IPO stated as possible in 2026.
    claimRefs: [CR001, CR014, CR015, CR026, CR007, CR017]

