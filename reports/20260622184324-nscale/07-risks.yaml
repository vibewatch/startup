        - "NVIDIA signals Vera Rubin NVL72 volume production slip of 6+ months beyond announced 2027 schedule"
        - "Reassess 2027-2028 delivery timelines across all Nscale sites; evaluate cascade impact on Microsoft contract milestones; assess GPU-backed DDTL collateral value under delay scenario"
