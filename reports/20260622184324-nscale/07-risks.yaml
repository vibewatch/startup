  - id: nvidia-technology
    title: NVIDIA Supply Concentration and Technology Execution Risks
    body: >
      Nscale's entire deployed and committed GPU fleet is based exclusively on NVIDIA
      architecture: H100/H200 clusters in Glomfjord and early deployments, GB300 Blackwell
      Ultra systems across the 2026 delivery pipeline, and NVIDIA Vera Rubin NVL72 systems
      targeted for 2027+ deployments across Narvik, Loughton, Portugal, Texas, and West
      Virginia. No AMD, Intel, or alternative GPU supplier has been named in any Nscale
      announcement. This creates 100% GPU supply dependency on a single vendor for both
      hardware procurement and technology roadmap execution.

      NVIDIA is also a strategic equity investor, having participated in both the $1.1B
      Series B (September 2025) and the $2B Series C (March 2026). The investor relationship
      creates alignment and preferential allocation incentives, but does not contractually
      guarantee GPU supply priority over larger hyperscaler customers (AWS, Azure, Google).
      If NVIDIA reallocates supply to its own DGX Cloud product or to a larger customer
      in a supply-constrained environment, Nscale has no disclosed backup procurement
      channel.

      The Vera Rubin NVL72 dependency is a significant execution risk. NVIDIA announced
      Vera Rubin as its next-generation architecture with production deliveries expected
      from 2027; as of June 2026, this silicon is not in commercial production. Nscale's
      announcement that it will be "among the first providers globally" and "the first
      provider outside of Microsoft itself" to deploy Vera Rubin NVL72 means its
      2027 delivery commitments are contingent on NVIDIA meeting its own production
      schedule. The Loughton delay to Q2 2027 was attributed to a "technology upgrade"
      to Vera Rubin 200, directly demonstrating how NVIDIA's silicon timeline governs
      Nscale's delivery commitments. A six-to-twelve month production delay in Vera
      Rubin NVL72 would cascade across Narvik, Loughton, Portugal, Texas, and West
      Virginia simultaneously.
