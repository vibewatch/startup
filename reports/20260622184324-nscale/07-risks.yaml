        - "Microsoft publicly announces reduction, deferral, or cancellation of contracted GPU deployment at Loughton, Narvik, Portugal, or Texas, or declines to convert WV LOI to a binding contract"
        - "Maximum severity trigger — simultaneous revenue pipeline and debt service impairment across all geographies; evaluate DDTL covenant exposure; escalate to senior diligence immediately"
      - - "NVIDIA Vera Rubin NVL72 production delay beyond Q1 2027"
