company:
  name: Nscale
chapter:
  number: 7
  title: Risks
  summary: >
    Nscale's risk profile is dominated by five interlocking exposures: (1) UK planning
    uncertainty at Loughton, Essex, where Loughton Town Council has demanded a fresh planning
    application, threatening the timeline of the UK's flagship sovereign AI supercomputer;
    (2) extreme customer concentration, with Microsoft the sole confirmed anchor tenant
    across UK, Norway, Portugal, Texas, and West Virginia commitments totalling approximately
    200,000+ NVIDIA GB300/Rubin GPUs and a 1.35 GW letter of intent; (3) single-supplier
    NVIDIA GPU dependency, where the entire deployed and committed fleet runs on NVIDIA
    architecture and the Vera Rubin NVL72 rollout from 2027 introduces next-generation
    silicon execution risk; (4) a high-leverage capital structure—$1.4B GPU-backed DDTL
    plus $790M Nordic project financing plus €695M+ Portugal commitments—with no disclosed
    revenue to benchmark debt service capacity; and (5) multi-site parallel execution risk
    across six countries simultaneously at a company with a holding entity incorporated
    fewer than 25 months ago. No active litigation or regulatory enforcement has been
    identified, but NSI Act 2021 and EU AI Act obligations introduce structural legal
    exposure that has not been publicly addressed.

sections:
  - id: planning-regulatory-legal
    title: Planning, Regulatory, and Legal Risks
    body: >
      Nscale's most immediate and well-evidenced regulatory risk is the UK planning dispute
      for its Loughton, Essex data centre. Datacentre Review reported in March 2026 that
      Loughton Town Council planning officers called for a completely fresh planning
      application, citing proposed changes by Nscale that are approximately 50% larger than
      the originally approved scheme, with the additional capacity requiring more cooling and
      more energy. The final decision rests with Epping Forest District Council, not Loughton
      Town Council, but the council's formal objection introduces procedural delay that
      Nscale itself acknowledged by pushing the Loughton completion date to Q2 2027—a
      slip from an original 2026 target framed publicly as a technology upgrade decision.
      A full planning rejection would eliminate the primary site for the UK's largest
      planned sovereign AI supercomputer and trigger a major reset on the Microsoft and
      UK government commitments that have been publicly tied to the Loughton campus.

      Beyond Loughton, the broader UK and EU regulatory environment creates material
      structural obligations. The UK National Security and Investment Act 2021 designates
      data infrastructure as a notifiable acquisition sector; Nscale has received material
      foreign investment (Aker ASA, Citadel, 8090 Industries, NVIDIA, Lenovo) without any
      disclosed NSI Act notification, creating latent exposure if a mandatory notification
      is triggered retroactively or if Nscale pursues UK government AI contracts requiring
      security clearance. Across its EU operations, EU Regulation 2024/1689 (EU AI Act,
      in force since August 2024) applies to AI system providers and operators; Nscale's
      full-stack positioning—GPU cluster, orchestration software, inference endpoints,
      fine-tuning services—means it likely falls under GPAI model obligations and
      transparency requirements as it expands its AI services layer. The EU Energy
      Efficiency Directive (2023) requires Nscale's Norwegian and Portuguese data centres
      to report annually on energy consumption, water use, and renewable energy utilisation,
      creating compliance overhead and reputational exposure if reporting surfaces
      performance gaps against its renewable energy claims.

      Companies House records confirm that Nscale Global Holdings Limited was incorporated
      on 29 May 2024—fewer than 25 months old as of the research date—and show at least
      four secured charges registered in 2025-2026, covering IP and other assets, in
      favour of Sandton Capital, Macquarie Bank (satisfied May 2026), and AF Realizations
      Sàrl. This pattern of secured bridge lending against IP and the subsequent discharge
      after each major equity round is consistent with pre-round bridge financing, but it
      also reflects that the entity's core IP has been pledged multiple times within a
      very short operating history. Nscale Limited, the UK operating entity, was incorporated
      as recently as 22 December 2025, immediately before the Series C raise. No active
      litigation, sanctions, or enforcement actions have been identified in public records.
