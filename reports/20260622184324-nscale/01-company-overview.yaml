company:
  name: Nscale
chapter:
  number: 1
  title: Company Overview
  summary: >
    Nscale is a London-headquartered AI infrastructure hyperscaler that emerged from
    Australian crypto-mining firm Arkon Energy in 2023–2024, positioning as a
    vertically integrated platform spanning energy, data centres, GPU compute,
    networking, and managed AI services. By March 2026 the company closed a $2 billion
    Series C at a $14.6 billion post-money valuation — the largest equity raise in
    European history — bringing total disclosed equity to approximately $3.7 billion
    and debt financing to approximately $2.2 billion. CEO Josh Payne leads a bench of
    14-plus C-suite executives; a board reconstituted in March 2026 to include Sheryl
    Sandberg, Susan Decker, and Nick Clegg signals governance maturation and possible
    IPO preparation. Principal risks include Loughton planning objections, an
    undisclosed revenue base, and execution risk on a 300,000-GPU global pipeline.

sections:
  - id: identity-and-overview
    title: Identity and Business Model
    body: >
      Nscale describes itself as "the engine of superintelligence" and "the hyperscaler
      engineered for AI." The company is headquartered in London, UK, with registered
      offices at Level 5, 16 New Burlington Place, London W1S 2HX (operating entity)
      and C/O Zedra Booths Hall, Booths Park 3, Chelford Road, Knutsford, Cheshire
      WA16 8GS (holding company). CNBC reported in September 2025 that Nscale was
      spun out from Arkon Energy, an Australian cryptocurrency mining firm, in 2023;
      Data Center Knowledge placed the emergence in 2024, creating a minor ambiguity
      that aligns with the UK holding company (Nscale Global Holdings Limited, company
      no. 15749408) being incorporated on 29 May 2024. The operating entity Nscale
      Limited (company no. 16925886) was incorporated on 22 December 2025.

      The business model is vertically integrated: Nscale owns and operates the full
      stack from energy sourcing and greenfield data centre design and construction
      through GPU compute and networking, orchestration software, and a managed AI
      cloud platform. Revenue is generated through cloud compute subscriptions and
      on-demand GPU rental (Inference Endpoints, Managed Slurm, Kubernetes, Instances),
      long-term capacity agreements with hyperscalers (primarily Microsoft), and
      sovereign AI deployments for enterprise and government customers. The company
      exploits cheap renewable energy — particularly hydropower in Norway — to offer
      GPU compute at competitive cost while meeting European data residency requirements.
      As of early 2026, Nscale's inference platform had scaled 148x and served more than
      5,000 users, though this figure has not been independently corroborated.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: leadership-and-governance
    title: Leadership and Governance
    body: >
      Josh Payne is CEO and Founder of Nscale. His biography describes an entrepreneurial
      background spanning recruitment, capital markets, and supercomputing infrastructure,
      with experience in energy, data centres, and hardware supply chains. No prior public-company
      executive experience or academic credentials are listed in official communications.
      Nscale carries meaningful key-person risk: Payne is the sole named founder, the
      primary external spokesperson, and the public face of every major fundraise and
      partnership announcement.

      The leadership bench is substantial for a company at this stage. Sam Huckaby
      (President, Data Centers) joined from Oracle, where he was SVP of OCI Data Center
      Infrastructure, and previously held COO and CDO roles at Vantage Data Centers.
      Sagar Rawal (Chief Infrastructure Officer) is a former Head of Infrastructure at
      Microsoft with prior stints at Oracle Cloud, NVIDIA, and AWS. Osvaldo Morales
      (Deputy President North America) has delivered 10GW+ across 200+ data center projects
      at Microsoft, AWS, Amazon, NVIDIA, and Digital Realty. David Power (CTO) has 20+
      years in HPC and served on the advisory board of the Irish Supercomputing List.
      Tom Burke (CRO) was previously CRO at Applied Digital and VP Global Sales at IBM.
      Philippe Sachs (President EMEA) brings banking and early venture capital experience,
      having been an early-stage investor in Nscale. Phoebee Gahan (CLO) oversees
      corporate law and capital markets. The leadership team also includes Daniel Bathurst
      (CPO), Naeem Hatimi (CPO, People), Daniel Shapiro (Chief Power Officer), Latha
      Maripuri (CISO, ex-Uber), and Sam Sturgess (SVP Strategy and Corporate Development).

      Following the March 2026 Series C, Nscale's board comprises seven members: Josh
      Payne (CEO), Rael Nurick, Jacob Leschly, Øyvind Eriksen (CEO of Aker ASA, who
      joined post-Series B), Sheryl Sandberg (former Meta COO, co-founder of Sandberg
      Bernthal Venture Partners), Susan Decker (CEO of Raftr, former Yahoo President,
      board member at Costco and Berkshire Hathaway), and Nick Clegg (General Partner
      at Hiro Capital, former UK Deputy Prime Minister, former President Global Affairs
      at Meta). The addition of Sandberg, Decker, and Clegg brings governance depth and
      is consistent with IPO preparation, as noted by TechCrunch.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020]
    tableRefs: [TO002]

  - id: funding-and-capital
    title: Funding History and Capital Structure
    body: >
      Nscale has executed one of the fastest funding trajectories in European AI history.
      The Series A of $155 million was announced before January 2025. In September 2025
      the company closed a $1.1 billion Series B led by Aker ASA, which committed
      $285 million in cash and in-kind Narvik land assets, acquiring 9.3% ownership
      on a fully diluted basis with a potential earn-out to 12.2%. The Series B round
      also attracted Sandton Capital, Blue Owl, Dell, Fidelity Management and Research,
      G Squared, Nokia, NVIDIA, Point72, and T.Capital; Goldman Sachs acted as exclusive
      placement agent.

      In October 2025, Nscale raised a $433 million pre-Series C SAFE backed by Blue Owl,
      Dell, NVIDIA, and Nokia. In February 2026 the company secured a $1.4 billion Delayed
      Draw Term Loan backed by GPUs to finance European cluster deployments. On March 9, 2026,
      the $2 billion Series C closed, led by Aker ASA and New York-based 8090 Industries
      (co-founded by Rayyan Islam), with support from Astra Capital, Citadel, Dell, Jane
      Street, Lenovo, Linden Advisors, Nokia, NVIDIA, and Point72. The official press
      release states the $2 billion figure is "inclusive of the Pre-Series C SAFE,"
      implying net new Series C equity of approximately $1.567 billion. Goldman Sachs and
      JPMorgan acted as joint placement agents, with TechCrunch noting their involvement
      signals possible IPO preparation. The post-money valuation stands at $14.6 billion.

      In May 2026, ABN AMRO, DNB, Eksfin, Nordea, and SEB committed $790 million in
      project financing for the Narvik data center, plus an accordion feature for a
      further $790 million. Total disclosed equity is approximately $3.7 billion (Series A
      $155M + Series B $1.1B + pre-C SAFE $433M + Series C $2B), and total debt and
      project financing stands at approximately $2.19 billion (DDTL $1.4B + Norway
      banking $790M). Revenue, ARR, gross margin, and net revenue retention are not
      publicly disclosed.
    claimRefs: [CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: operating-scale-data-centers
    title: Operating Scale and Data Centers
    body: >
      Nscale's operational footprint spans multiple continents. Its first and currently
      operational site is in Glomfjord, Norway, a 60MW renewable-energy-powered data
      centre. The Narvik (Kvandal) campus is the flagship project: announced July 2025
      as Stargate Norway in partnership with Aker ASA and OpenAI to target 100,000 NVIDIA
      GPUs by end of 2026, the 230MW site has since been deepened with a September 2025
      Aker JV consolidation and Microsoft taking over as the primary anchor tenant (the
      OpenAI relationship is still active under Stargate UK, but the Narvik offtake
      transitioned primarily to Microsoft). In April 2026, Nscale expanded the Narvik
      agreement with Microsoft to include an additional 30,000+ NVIDIA Rubin GPUs.

      In the UK, Nscale acquired the Loughton, Essex site in January 2025, planning a
      50MW facility (scalable to 90MW) to house approximately 23,040 NVIDIA GB300 GPUs
      for Microsoft Azure from Q1 2027. The original Q4 2026 completion date was revised
      to Q1 2027, officially attributed to NVIDIA Vera Rubin 200 technology upgrades.
      Planning complications arose in early 2026 when Loughton Town Council officers
      called for a fresh planning application after Nscale proposed a configuration 50%
      larger than the original outline approval from 2024.

      In the US, Nscale leased a Texas site from Ionic Digital for approximately
      104,000 NVIDIA GB300 GPUs in a ~240MW hyperscale campus serving Microsoft from
      Q3 2026. At GTC 2026 (March 16, 2026), Nscale acquired the Monarch Compute Campus
      in West Virginia (up to 2,250 acres in Mason County, America's first state-certified
      AI microgrid, scalable to over 8GW) via the purchase of AIPCorp, and signed an LOI
      with Microsoft for 1.35GW of AI compute. Portugal's Start Campus in Sines holds
      12,600 NVIDIA Blackwell Ultra GPUs (from Q1 2026), with an expanded agreement for
      66,000+ NVIDIA Vera Rubin NVL72 GPUs added in May 2026 (€695M+ combined investment).
      In April 2026, a BT partnership added 14MW across three UK BT network sites.
      Nscale has also secured a site development agreement with Fortum for a future data
      centre in Harjavalta, Finland. Additional partner-run sites are listed in Keflavik
      (Iceland), Stavanger, Oslo, Blönduós (Norway), Slough, and North Carolina. Nscale's
      total current capacity exceeds 1GW and its global GPU pipeline targets 300,000+
      NVIDIA units.
    claimRefs: [CO036, CO037, CO038, CO039, CO040, CO041, CO042, CO043, CO044, CO045, CO046, CO047, CO048]

  - id: milestones-and-adverse
    title: Milestones, Partnerships, and Adverse Context
    body: >
      Nscale's milestone record is densely packed into roughly 30 months from founding
      to mid-2026. The company emerged from Arkon Energy's crypto-mining infrastructure
      and pivoted entirely to AI workloads, rapidly acquiring land, GPUs, and partnerships
      at a pace uncommon even in the neocloud peer set. The partnership ecosystem is
      anchored by Microsoft (the primary hyperscaler offtaker across Norway, UK, Portugal,
      and Texas), NVIDIA (GPU supplier and recurring equity investor), and Aker ASA
      (Norwegian industrial conglomerate, lead investor in Series B and C, and former
      JV partner now folded into Nscale equity). OpenAI serves as a strategic anchor
      through Stargate Norway and Stargate UK, with BT, Nokia, Dell, Fortum, and Start
      Campus completing the key partnership ring.

      The adverse context is centred on UK planning. In March 2026 DataCentre Review
      reported that Nscale had become "the latest company to face public backlash" over
      its Loughton data centre, with Loughton Town Council calling for a fresh planning
      application because the proposed expansion is 50% larger than originally approved
      and raises power grid concerns. Epping Forest District Council holds final decision
      authority but has not yet ruled. The company stated that construction site
      investigation and permit work is under way and that it expects construction to begin
      in Q2 2026 and the site to be operational in Q2 2027. Separately, the delay in
      the Loughton timeline conflicts with Nscale's earlier Q4 2026 target, with the
      company attributing the slip to NVIDIA Vera Rubin 200 technology upgrades; the
      planning objections create a competing risk explanation.

      At the sector level, Edinburgh Council's moratorium on new data centre developments
      and growing public resistance to AI infrastructure across the UK represent systemic
      risks that could complicate future UK site acquisitions. Revenue and financial
      transparency remain a gap: Nscale has not published ARR, revenue, gross margin, or
      employee headcount figures in any public disclosure as of June 2026.
    claimRefs: [CO049, CO050, CO051, CO052, CO053]
    tableRefs: [TO004]
    figureRefs: [FO001]

