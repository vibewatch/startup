callouts:
  - calloutType: strength
    title: Hyperscaler-Anchor Revenue Model
    body: >
      Microsoft serves as a multi-year anchor tenant across at least four Nscale sites
      (Narvik, Loughton, Texas, Portugal), providing committed revenue that substantially
      de-risks capital deployment and validates delivery execution. The scope of the
      Microsoft relationship — approximately 200,000 NVIDIA GB300 GPUs contracted in
      October 2025, plus subsequent Rubin GPU expansions — is among the largest AI
      infrastructure partnerships ever announced, and gives Nscale a reference anchor
      comparable to CoreWeave's Microsoft relationship or Crusoe's Abilene deal.
    claimRefs: [CO038, CO039, CO043, CO045]

  - calloutType: risk
    title: Loughton Planning Risk and Revenue Opacity
    body: >
      The Loughton, Essex data centre is the UK flagship for Nscale's sovereign AI
      narrative, yet it faces Loughton Town Council objections that could require a fresh
      planning application, potentially delaying the project beyond Q1 2027 and
      threatening the Microsoft Loughton supercomputer commitment. Separately, Nscale
      has disclosed no revenue, ARR, gross margin, headcount, or customer count figures
      publicly, creating significant uncertainty about the company's financial health
      relative to its $2.19 billion debt load and capital-intensive build programme.
    claimRefs: [CO035, CO049, CO050, CO052]

  - calloutType: insight
    title: Board Reconstitution Signals IPO Preparation
    body: >
      The simultaneous addition of Sheryl Sandberg, Susan Decker, and Nick Clegg to the
      Nscale board at Series C close substantially upgrades governance credibility and
      public-market readiness. TechCrunch noted that Goldman Sachs and JPMorgan serving
      as joint placement agents for the Series C is "interpreted as IPO preparation."
      CEO Josh Payne has publicly discussed going public "as early as this year" (2026),
      suggesting the company is building infrastructure for a near-term liquidity event.
    claimRefs: [CO016, CO017, CO019, CO034]

