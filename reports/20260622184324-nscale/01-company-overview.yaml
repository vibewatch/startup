  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: financials
      missingEvidence: >
        Nscale's revenue, ARR, gross margin, net revenue retention, and customer count for
        2025 and 2026; any unaudited management accounts or investor updates disclosing financial
        performance.
      whyItMatters: >
        Without revenue metrics, it is impossible to assess Nscale's ability to service its
        ~$2.19B debt load, evaluate unit economics against its capital-intensive build programme,
        or compare its financial health to neocloud peers like CoreWeave or Crusoe.
      diligencePath: >
        Request audited financial statements and management accounts in diligence; ask for ARR
        trend, gross margin by segment (hyperscaler vs. enterprise), and customer contract
        concentration.
      relatedQuestionRefs: [QO009]

    - type: missing-source
      severity: material
      topic: headcount
      missingEvidence: >
        Total employee headcount and hiring trajectory as of mid-2026; breakdown by function
        (engineering, operations, sales, data centre build).
      whyItMatters: >
        Nscale is executing a multi-continent data centre build programme simultaneously; headcount
        is a key indicator of operational capacity, burn rate, and ability to staff rapid scale-up.
      diligencePath: >
        Request headcount by region and function in diligence; cross-reference LinkedIn employee
        count estimates and job posting volume.
      relatedQuestionRefs: [QO025]

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: >
        Full cap table including ownership percentages, liquidation preferences, anti-dilution
        provisions, board voting rights, and pro-rata participation rights for all Series B,
        pre-Series C SAFE, and Series C investors.
      whyItMatters: >
        Aker's 9.3% post-Series B stake and the participation of 12+ investors across multiple
        rounds creates a complex preference stack; terms are material to both downside and IPO
        scenarios.
      diligencePath: >
        Request full cap table and shareholder agreement in diligence; cross-reference Aker ASA
        stock exchange disclosures for any additional ownership updates post-Series C.
      relatedQuestionRefs: [QO002]

    - type: enumeration-incomplete
      severity: material
      topic: leadership
      missingEvidence: >
        Complete headcount and organisational structure for Nscale's leadership below the C-suite,
        including VP and director-level personnel in engineering, data centre operations, and sales.
      whyItMatters: >
        Key-person risk in data centre operations is meaningful; Nscale's simultaneous multi-site
        build programme requires deep operational bench strength that is not visible from public disclosures.
      diligencePath: >
        Review LinkedIn for VP/director-level hires; request organisational chart in diligence.
      relatedQuestionRefs: [QO021]
      relatedTableRefs: [TO002]

    - type: enumeration-incomplete
      severity: minor
      topic: investors
      missingEvidence: >
        Complete investor register including Series A investors, exact ownership percentages post-Series C
        for all named investors, and any secondary transactions or share transfers between rounds.
      whyItMatters: >
        Without the full cap table, it is unclear whether any investor holds blocking rights or
        board seats beyond the publicly confirmed Aker and founder board members.
      diligencePath: >
        Request complete shareholder register and cap table with all share classes in diligence;
        review Aker ASA annual report for updated Nscale ownership disclosure.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO003]

    - type: stale
      severity: minor
      topic: founding
      missingEvidence: >
        Primary source documentation of Nscale's exact founding date — CNBC reports 2023 and
        Data Center Knowledge reports 2024, with the UK holding company incorporation on 29 May 2024
        not resolving the pre-incorporation operating history.
      whyItMatters: >
        Founding year is a basic identity fact; the discrepancy between 2023 (CNBC) and 2024 (DCK/Companies House)
        could reflect different entities, a rebrand, or a spin-out process that spanned both years.
      diligencePath: >
        Request a corporate history including original entity names, dates, and any predecessor
        entities or trademarks pre-dating Nscale Global Holdings Limited.
      relatedQuestionRefs: [QO003]

    - type: missing-source
      severity: minor
      topic: competitive-benchmarking
      missingEvidence: >
        Detailed financial and operational benchmarks comparing Nscale's funding pace,
        GPU cost per unit, deployment timeline, and customer pricing against neocloud
        peers CoreWeave and Crusoe Energy as of 2026.
      whyItMatters: >
        Without peer-level financial comparison data, it is difficult to assess whether
        Nscale's capital intensity and funding trajectory represent best-in-class efficiency
        or whether it is overpaying for capacity relative to established peers.
      diligencePath: >
        Cross-reference CoreWeave S-1 disclosures, Crusoe's investor disclosures, and
        independent analyst reports on neocloud unit economics; request Nscale unit
        economics and GPU deployment cost per megawatt in diligence.
      relatedQuestionRefs: [QO012]

    - type: missing-source
      severity: minor
      topic: data-center-cost-benchmarks
      missingEvidence: >
        Independent third-party data on Nscale's data centre construction cost per MW,
        delivery timelines, and PUE metrics relative to hyperscaler industry benchmarks
        (AWS, Azure, Google Cloud) and neocloud peers.
      whyItMatters: >
        Nscale claims to deliver data centres faster and at lower cost than industry
        benchmarks, but no independent verification of these claims exists in public
        sources as of June 2026; these claims are central to its investment thesis.
      diligencePath: >
        Request construction cost per MW, delivery timeline data, and PUE/WUE metrics
        for completed sites (Glomfjord, Texas phase 1, Portugal phase 1) in diligence;
        compare to published hyperscaler or colocation benchmarks.
      relatedQuestionRefs: [QO024]

