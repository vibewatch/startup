  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Nscale-revenue
      missingEvidence: Nscale's actual contracted revenue, revenue run-rate, and GPU utilization rates across its Microsoft and other customer contracts
      whyItMatters: Without public revenue figures, it is impossible to assess whether Nscale's $14.6 billion valuation is justified relative to CoreWeave's public-market comparable at ~5x trailing quarterly revenue run-rate
      diligencePath: Request management accounts, signed customer contracts with minimum revenue commitments, and GPU utilization dashboards covering Q4 2025 and Q1-Q2 2026
      relatedQuestionRefs: [QP020]

    - type: private-evidence-only
      severity: material
      topic: Microsoft-concentration
      missingEvidence: Microsoft contract terms including minimum take-or-pay thresholds, termination triggers, price step-down schedules, and exclusivity or capacity priority provisions
      whyItMatters: Customer concentration exceeding 50% of revenue in a single counterparty who is also a direct competitor represents an asymmetric risk; without contract terms this risk cannot be quantified
      diligencePath: Request full contract text or redacted term sheet for Microsoft GPU deployment agreements; specifically review termination provisions, GPU replacement obligations, and Azure conflict of interest provisions

    - type: private-evidence-only
      severity: material
      topic: Nscale-planning-risk
      missingEvidence: Final outcome of Epping Forest District Council review of the Loughton planning application, and whether a new application has been filed
      whyItMatters: If Nscale must refile a planning application, the Loughton UK campus could slip further past Q2 2027, delaying the UK Microsoft GPU delivery commitment and sovereign AI partnership with BT
      diligencePath: Monitor Epping Forest District Council planning portal for Loughton application status; request timeline update from Nscale IR; verify whether BT sovereign AI contractual obligations are contingent on Loughton capacity delivery
      relatedQuestionRefs: [QP010]

    - type: missing-source
      severity: minor
      topic: Nscale-certifications
      missingEvidence: Comprehensive documentation of Nscale's formal compliance certifications (SOC 2, ISO 27001, GDPR attestations, UK NCSC CCP) compared to Nebius's EU certification portfolio and CoreWeave's published SOC 2 Type II
      whyItMatters: EU and UK enterprise buyers in regulated sectors require documented compliance certifications; gaps relative to Nebius or CoreWeave weaken Nscale's sovereign-AI positioning credibility
      diligencePath: Request Nscale's current certification portfolio from their trust/compliance page; compare with Nebius and CoreWeave compliance documentation; verify BT sovereign AI contractual requirements
      relatedQuestionRefs: [QP026]
