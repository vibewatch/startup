callouts:
  - calloutType: risk
    title: Microsoft is simultaneously Nscale's anchor tenant and its most powerful substitute
    body: >-
      With approximately 200,000 NVIDIA GPUs contracted across four countries, Microsoft is Nscale's defining
      revenue anchor—but Microsoft Azure GPU cloud services directly compete for the same enterprise GPU workloads
      Nscale seeks to attract. If Microsoft internalizes more capacity or shifts its strategy, Nscale's
      contracted-delivery model loses its primary demand backstop. No neocloud peer faces equivalent single-customer
      concentration at this stage of development.
    claimRefs: [CP008, CP033, CP034]

  - calloutType: strength
    title: European sovereign AI positioning has no direct neocloud comparator at Nscale's scale
    body: >-
      No other neocloud operator combines Nscale's UK/EU government relationships (UK AI Forum, BT partnership),
      Norwegian renewable-energy campus ownership, NVIDIA Vera Rubin European first-mover access, and Stargate
      Norway OpenAI deal. This sovereign AI stack creates a competitive moat in European regulated markets—
      financial services, healthcare, public sector—that US-headquartered CoreWeave, Lambda, and Crusoe cannot
      replicate without multi-year EU market investment.
    claimRefs: [CP031, CP032, CP011, CP012]

  - calloutType: insight
    title: CoreWeave's IPO financials reveal neocloud unit economics are still unproven at scale
    body: >-
      CoreWeave's Q1 2026 GAAP operating loss of $144 million on $2.078 billion in revenue, alongside $99.4
      billion in future-period backlog commitments, shows that even the sector leader is still in the
      capital-absorption phase of neocloud growth. For pre-revenue Nscale, this means the path to profitability
      requires both executing on contracted GPU deployments and demonstrating utilization rates that justify the
      capital stack—a challenge the public market has not yet resolved for any operator.
    claimRefs: [CP002, CP035, CP001]

