      yAxis: "Advisory and integration breadth (ordinal, 1 low to 5 high)"
    approximationNotes: Coordinates are ordinal analyst placements from the retained evidence, not market-share measurements or independently benchmarked scores.
    claimRefs: [CP002, CP003, CP005, CP007, CP016]
callouts:
  - calloutType: risk
    title: Evidence gap in competitive underwriting
    body: The assigned pool does not establish MGT's realized pricing, bid win rate, renewal rate, customer concentration, or switching costs; these are material gaps before concluding that acquisition breadth is a durable moat.
    claimRefs: [CP010, CP011, CP016, CP019]
