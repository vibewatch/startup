        - {label: Tyler Technologies, x: 5, y: 3, note: "Public-sector workflow software and cloud evidence; advisory breadth not established"}
        - {label: EY, x: 2, y: 4, note: "Broad advisory competitor signal; public-sector workflow ownership not established"}
        - {label: Deloitte, x: 2, y: 4, note: "Broad advisory competitor signal; public-sector workflow ownership not established"}
        - {label: Sourcewell, x: 1, y: 2, note: "Procurement access evidence; delivery capability not established"}
