company:
  name: MGT
chapter:
  number: 3
  title: Competitors
  summary: MGT competes as a broad SLED technology and advisory integrator rather than as a single-product software vendor. Prefetched evidence points to a fragmented field spanning large professional-services firms, public-sector software platforms, procurement channels, internal government teams, and specialist advisers; the key diligence question is whether MGT's acquisition-led breadth converts into durable distribution and repeatable delivery.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      MGT's competitive set is unusually heterogeneous. Tracxn identifies EY, Elm, and Deloitte as top competitors, while its longer list includes ZS, McKinsey, PwC, Cognizant, and Teneo; this is a discovery signal, not a proof that every firm bids for the same contract. Tyler Technologies is a more direct public-sector technology comparator because it sells software and services to federal, state, county, municipal, and education agencies. Sourcewell shows another substitute: cooperative purchasing that gives public employees local dealer access with national buying power. The status quo also includes agency staff, incumbent contractors, and internal procurement vehicles. MGT's job description describes procurement-vehicle management, OEM relationships, subcontractors, and large pursuits, supporting a channel-and-integration model rather than a closed software platform. Unsupported competitor pricing, win rates, switching costs, and customer overlap remain unknown.
    claimRefs: [CP001, CP002, CP003, CP004, CP005]
    tableRefs: [TP001]
  - id: profiles
    title: Profiles, scale, and strategic direction
    body: >-
      The available evidence differentiates competitors by operating model more reliably than by like-for-like revenue. MGT's own newsroom release describes a unified platform built after more than ten acquisitions and lists cybersecurity, IT infrastructure, human capital, fiscal, and operational improvement as solution areas. A contemporaneous MGT job posting says the company combines cloud, data, infrastructure, security, pricing, OEM relationships, and presales ownership in one practice role. Tyler is a scaled public-sector software incumbent: the prefetched company profile reports 2025 revenue of $2.332 billion and 7,800 employees, while Macrotrends describes subscription, services, maintenance, appraisal, and hardware revenue streams. Tracxn reports MGT's $350 million funding and a 791-employee count as of September, but the page does not establish audited comparability with Tyler's public figures. MGT's scale, funding, and customer concentration therefore require private verification.
    claimRefs: [CP006, CP007, CP008, CP010]
    tableRefs: [TP002]
  - id: buying-criteria
    title: Capability, pricing, and trust comparison
    body: >-
      The buyer's decision appears to be governed by capability coverage, procurement access, implementation confidence, security posture, and delivery economics. MGT's role description explicitly assigns pricing and packaging, discount escalation, solution design, OEM relationships, subcontractor management, and customer-facing pursuit leadership to its practice; that supports a flexible services-and-solutions proposition but does not disclose realized prices or margins. Tyler offers a contrasting productized model centered on public-sector applications and cloud delivery, but the retained secondary record also describes historical rollout disputes and litigation settlements, so scale should not be treated as equivalent to implementation trust. Sourcewell documents that cooperative contracts can save time and money and preserve local dealer access, making procurement convenience a substitute for a national integrator. NIST's CSF 2.0 and CISA ransomware guidance indicate that security controls and resilience are baseline buying requirements, not differentiators proven by generic marketing language.
    claimRefs: [CP011, CP012, CP013, CP014, CP015]
    tableRefs: [TP003]
    figureRefs: [FP001]
  - id: durability
    title: Moat durability and displacement risk
    body: >-
      MGT's plausible moat is cumulative public-sector context, acquisition-built specialist coverage, trusted-adviser relationships, and the ability to assemble OEMs and subcontractors around complex procurements. The same model creates integration and commoditization risks: large firms can bundle advisory and technology services, public-sector software vendors can own workflows and data, cooperative purchasing can lower search and contracting friction, and agencies can retain internal teams for routine work. MGT's sources provide evidence of breadth and acquisition activity, but not contract renewal rates, bid win rates, gross margins, backlog, customer concentration, or switching costs. Tyler's public scale and acquisition history show that an incumbent can compound distribution and product depth; the adverse implementation evidence in the retained Tyler record is a reminder that incumbent scale does not eliminate execution risk. A durable advantage is therefore plausible but unproven.
    claimRefs: [CP016, CP019]
    callouts:
      - calloutType: insight
        title: The central competitive test
        body: MGT should be underwritten as an execution-and-distribution platform, not as a uniquely protected software asset, until private diligence demonstrates repeatable wins, renewal behavior, contribution margins, and integration economics.
        claimRefs: [CP016, CP019]
