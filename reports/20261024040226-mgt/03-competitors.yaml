      - [Cybersecurity and resilience, "Supported by official solution list", "Not established as a comparative claim", "Not established", "No", "Possible"]
      - [Procurement vehicle access, "Role explicitly owns procurement vehicles", "Not established", "Not established", "Core function", "Agency-controlled"]
      - [OEM and subcontractor orchestration, "Supported by job description", "Not established", "Possible", "Dealer access", "Agency-controlled"]
      - [List pricing or realized pricing, "Unknown", "Unknown in retained evidence", "Unknown", "Contract-specific", "Internal cost"]
      - [Switching cost or retention, "Unknown", "Unknown", "Unknown", "Low switching friction is plausible but unmeasured", "Institutional"]
    notes: Cells state only what the assigned prefetched sources support; unknown means the pool did not establish a comparable fact, not that the capability is absent.
    claimRefs: [CP007, CP011, CP012, CP013, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Alternative, Price or unit, Included capabilities, Discount or contract model, Competitive implication]
    rows:
      - [MGT, null, "Advisory, implementation, managed solutions, cloud/data, security, and infrastructure", "Practice role owns pricing, packaging, discounting, and margin escalations; realized pricing unknown", "Flexible scope may fit complex procurements but can be harder to benchmark"]
      - [Tyler Technologies, null, "Public-sector software, cloud, services, maintenance, appraisal, and hardware", "Revenue streams are disclosed, but customer-level price and discount terms are unknown", "Productized workflows may create embeddedness and repeatability"]
      - [Sourcewell cooperative purchasing, null, "Technology and services contracts with local dealer access", "Cooperative contract terms vary; source does not establish MGT-specific pricing", "Can reduce procurement friction and substitute for bespoke sourcing"]
      - [Internal agency team, null, "Existing staff, systems, and institutional knowledge", "Internal budget and staffing economics not publicly available", "Avoids vendor margin but may lack specialist capacity"]
    notes: No retained source provides comparable list or realized prices; null values are intentional and should be closed with bid sheets, contract schedules, and delivered-margin data.
    claimRefs: [CP005, CP011, CP012, CP013]
