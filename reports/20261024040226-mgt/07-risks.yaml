company:
  name: MGT
chapter:
  number: 7
  title: Risks
  summary: >-
    MGT's principal disclosed risks are execution complexity across acquisition-led
    growth, OEM and subcontractor dependencies, and delivery obligations for
    mission-critical public-sector technology. Public evidence shows contractual
    mitigants, but it does not establish claims history, incident performance,
    customer concentration, audited financial resilience, or integration outcomes.
sections:
  - id: ranked-risk-view
    title: Ranked residual risk
    body: >-
      The highest residual exposure is execution rather than a verified legal event.
      A current City of Fresno agreement packages roughly $2.08 million of Cisco
      hardware, software, support, and MGT labor into one public-safety technology
      engagement, while MGT-issued job material describes an acquisition-led model,
      strategic OEM relationships, subcontractors, and complex solution delivery.
      Those facts make integration, scoping, staffing, and handoff quality central
      underwriting questions. Contractual insurance, project controls, and defined
      support processes mitigate loss severity, but the assigned public evidence
      does not show actual SLA performance, implementation overruns, warranty
      claims, or acquisition-cohort outcomes. The investment implication is to
      condition confidence on project-level delivery and integration data rather
      than equating scale or certifications with execution quality.
    claimRefs: [CR002, CR006, CR007, CR008, CR015]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: legal-regulatory-and-cyber
    title: Legal, regulatory, and cyber exposure
    body: >-
      MGT operates where technology delivery intersects public procurement,
      privacy, security, licensing, and service continuity. Fresno's agreement
      requires technology professional liability and cyber coverage, allows work
      to stop if required insurance lapses, and places broad indemnity obligations
      on the vendor. These provisions evidence risk transfer, not proof that losses
      or incidents have not occurred. Independently, CIS describes SLTT entities as
      needing continuous monitoring, threat intelligence, and incident response,
      reinforcing the consequence of failure for MGT's government and education
      clients. A 2026 stablecoin rulemaking update is retained only as an adjacent
      regulatory-change boundary; the pool contains no evidence that MGT is a
      payment-stablecoin issuer or directly subject to that proposed regime.
    claimRefs: [CR001, CR003, CR009, CR011, CR016]
    tableRefs: [TR001]
  - id: dependencies-and-commercial-terms
    title: Partner, procurement, and commercial dependencies
    body: >-
      The delivery model depends on upstream manufacturers, contract vehicles,
      field resources, and customer readiness. The Fresno quote is heavily tied to
      Cisco products and support, while MGT-issued role descriptions assign leaders
      responsibility for OEM roadmaps, vendor escalation, subcontractor capacity,
      site surveys, bills of materials, and multi-site execution. Fresno's terms
      also make delivery dates approximate, constrain returns, and allow additional
      customer cost when site assumptions fail. Cooperative procurement can shorten
      sales friction, but the underlying solicitation permits multiple vendors and
      as-needed purchases, limiting exclusivity. Investors should monitor OEM
      concentration, subcontracted labor share, backlog conversion, change orders,
      and customer-caused delays by project.
    claimRefs: [CR004, CR007, CR008, CR013]
    tableRefs: [TR003]
  - id: financial-and-diligence-triggers
    title: Financial exposure, monitoring, and kill criteria
    body: >-
      Public evidence is insufficient to quantify burn, working-capital needs,
      project gross margin, insurance recoverability, debt covenants, or customer
      concentration. The current Fresno project illustrates why these omissions
      matter: hardware can be invoiced on warehouse receipt, labor is progress
      billed, and delays or scope deviations may shift timing and costs. That is
      not evidence of distress, but it creates cash-conversion and margin sensitivity
      that should be reconciled to audited statements and project cohorts. Thesis
      breaks should include a material uninsured cyber event, repeated public-sector
      SLA failure, loss of a critical OEM authorization, acquisition cohorts missing
      retention or margin plans, or customer concentration that breaches lender or
      investment limits. Until those data are produced, residual risk remains
      medium-high and the correct posture is diligence-gated.
    claimRefs: [CR002, CR004, CR014, CR015]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule, license, or exposure
      - Jurisdiction
      - Evidence status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Public procurement, licensing, insurance, and indemnity compliance
        - California public entities
        - Current Fresno agreement names MGT affiliate AMS.NET as vendor and specifies insurance, licensing, and indemnity obligations
        - Medium
        - High
        - Required insurance, contract controls, and documented project management
        - Medium
        - Verify certificates, claims history, license standing, exceptions, and any cure notices across major contracts
      - - Cybersecurity, privacy, and continuity duties for government and education clients
        - U.S. state, local, tribal, territorial, and education clients
        - Sector threat and response need is independently established; MGT-specific incident history is not public in the assigned evidence
        - High
        - High
        - Cyber and technology liability coverage plus claimed security and managed-service capabilities
        - High
        - Review SOC reports, pen tests, incident register, notification history, RTO/RPO attainment, and insurance exclusions
      - - Adjacent financial-technology regulatory change
        - U.S. federal
        - A March 2026 legal update describes a proposed OCC stablecoin framework; no assigned evidence ties MGT directly to issuer status
        - Low or unknown
        - Medium if an engagement enters scope
        - Service-line scoping and specialist legal review
        - Low pending exposure mapping
        - Confirm whether any MGT product, client mandate, or advisory work touches payment-stablecoin issuance and recheck final rule status
    notes: >-
      Partial register based only on assigned public sources; likelihood and residual
      labels are analytical judgments, not disclosed incident probabilities.
    enumerationScope:
      coverage: partial
      basis: >-
        Assigned evidence through 2026-10-24 covers one California agreement, an
        SLTT cyber benchmark, and one adjacent federal proposal, not every
        jurisdiction, license, contract, claim, or proceeding.
    claimRefs: [CR001, CR003, CR009, CR013, CR014, CR016]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Acquisition integration fragments delivery methods, systems, or accountability
        - Medium-high given the company-claimed acquisition cadence
        - High
        - Partial; centralized practice leadership is described but outcomes are not disclosed
        - High
        - Cohort retention, synergy realization, system migrations, and post-acquisition margin data
      - - Complex public-safety infrastructure project misses scope, schedule, or quality targets
        - Medium
        - High
        - Moderate; project plans, RAID logs, testing, and handoff processes are described
        - Medium-high
        - On-time delivery, change-order, defect, warranty, and SLA histories
      - - Field security deployment fails because of site conditions, travel coverage, or subcontractor quality
        - Medium
        - High
        - Partial; design, surveys, commissioning, and QA coordination are role requirements
        - Medium-high
        - Subcontracted labor share, regional capacity, first-pass acceptance, and rework rates
      - - Cyber incident at MGT or a managed client disrupts critical public services
        - Medium-high at the sector level; MGT-specific rate unknown
        - Critical
        - Unverified; insurance and claimed capabilities exist, but control effectiveness is not evidenced
        - High
        - Independent assurance reports, incident record, recovery tests, and policy-limit adequacy
    notes: >-
      Rankings synthesize contract, job-repost, and sector evidence; they do not
      represent measured failure frequencies or independently verified mitigation
      effectiveness.
    claimRefs: [CR002, CR003, CR006, CR007, CR008, CR009, CR015]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or channel
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Hardware, software, support, and certifications
        - Cisco and other OEMs
        - Product supply, licensing, roadmap access, support, and partner credentials
        - A single Fresno quote is heavily Cisco-based; enterprise-wide concentration is not disclosed
        - Shortage, certification loss, price change, roadmap shift, or support failure delays delivery
        - High
        - Multi-vendor capability is claimed; verify actual revenue and backlog split
        - Medium-high
      - - Field installation and specialist delivery
        - Subcontractors and regional technical labor
        - Extend capacity for cabling, security, cloud, and complex deployments
        - No public subcontracted-labor share in the assigned evidence
        - Capacity or QA failure creates rework, delay, liability, or customer dissatisfaction
        - High
        - Architect oversight, site surveys, commissioning, and subcontractor management
        - Medium-high
      - - Cooperative contracts and agency budgets
        - Merced County FOCUS and participating public entities
        - Procurement access and transaction funding
        - The vehicle permits multiple providers and as-needed purchases
        - Funding, competitive selection, or procurement change reduces conversion
        - Medium
        - Diversify contract vehicles, customers, and qualified vendor positions
        - Medium
    notes: >-
      Partial dependency view; no enterprise-wide OEM, subcontractor, contract
      vehicle, or customer concentration percentages were available.
    claimRefs: [CR004, CR007, CR008, CR013, CR014]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative residual ranking based on disclosed exposure and mitigation
      evidence, with unknowns preserved rather than converted into numeric scores.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from assigned evidence, not a measured probability.
        - label: Impact
          detail: Potential consequence to delivery, clients, or investment value.
        - label: Mitigation maturity
          detail: Degree to which controls are evidenced publicly.
        - label: Residual severity
          detail: Remaining exposure after evidenced mitigants.
      rows:
        - label: Acquisition integration
          note: Company-issued job material reports 13 acquisitions since 2020.
          values:
            - label: Medium-high
            - label: High
            - label: Partial
            - label: High
        - label: Complex project delivery
          note: Fresno project combines hardware, licensing, labor, and public-safety infrastructure.
          values:
            - label: Medium
            - label: High
            - label: Moderate
            - label: Medium-high
        - label: Cyber or privacy incident
          note: Sector exposure is independently supported; MGT-specific incident frequency is unavailable.
          values:
            - label: Medium-high
            - label: Critical
            - label: Unverified
            - label: High
        - label: OEM and subcontractor dependency
          note: Role descriptions assign explicit OEM and subcontractor management duties.
          values:
            - label: Medium
            - label: High
            - label: Partial
            - label: Medium-high
        - label: Public procurement conversion
          note: Cooperative vehicle permits multiple vendors and as-needed purchases.
          values:
            - label: Medium
            - label: Medium
            - label: Moderate
            - label: Medium
        - label: Working-capital and margin variance
          note: Project billing and scope terms are visible, but audited company financial data are not.
          values:
            - label: Unknown
            - label: High
            - label: Unverified
            - label: Medium-high
    approximationNotes: >-
      Ordinal labels are analytical judgments; no numeric incident, loss, or default
      probabilities were available in the assigned pool.
    claimRefs: [CR002, CR006, CR009, CR014, CR015]
callouts:
  - calloutType: risk
    title: Diligence-gated risk posture
    body: >-
      Do not treat the lack of a documented incident in this source pool as evidence
      that no incident occurred. Require claims, litigation, cyber-event, SLA,
      concentration, and acquisition-cohort records before reducing residual risk.
    claimRefs: [CR010, CR014, CR015]
