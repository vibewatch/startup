callouts:
  - calloutType: strength
    title: Differentiated SLED orientation
    body: >-
      MGT combines technology, advisory, and operational capabilities around SLED
      leadership priorities, a positioning reinforced by its official materials and
      independent profile.
    claimRefs: [CO001, CO002, CO003]
  - calloutType: risk
    title: Private-company disclosure gap
    body: >-
      The assigned successful sources do not establish funding, valuation, debt,
      ownership, board rights, audited revenue, or customer concentration, limiting
      confidence in capital structure and growth quality.
    claimRefs: [CO012, CO013, CO016]
  - calloutType: recommendation
    title: Diligence before underwriting
    body: >-
      Treat MGT as a scaled growth platform with credible operating momentum, but
      require audited financials, transaction documents, governance materials, and
      customer-level revenue evidence before moving beyond research-more.
    claimRefs: [CO009, CO011, CO012, CO013, CO016]
