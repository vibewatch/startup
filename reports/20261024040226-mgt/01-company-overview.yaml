      - [Headquarters, "Tampa, Florida", "Undated profile", medium, "Legal entity and operating-footprint detail not disclosed"]
      - [Employees, "Almost 1,200", "Current role material; date not stated", medium, "Definition and measurement date not disclosed"]
      - [Customer reach, "Thousands of agencies", "Current role material; date not stated", medium, "Named-customer and concentration data not disclosed"]
      - [Revenue growth, "404% three-year growth", "Inc. 5000 ranking period 2022–2025", medium, "Audited revenue and base-year values not provided"]
      - [Funding and valuation, null, "Current report date", low, "Funding, valuation, debt, and cap table require private diligence"]
    notes: >-
      Company and third-party published figures are kept separate from independently
      verified financial statements; null means the assigned successful source pool
      did not support a current public value.
    claimRefs: [CO001, CO003, CO006, CO009, CO012, CO013]
  - id: TO002
    title: Leadership and founder table
    columns: [Person or leadership layer, Role or evidence, Functional coverage, Key-person or governance implication, Evidence status]
    rows:
      - [Founders, "No named founders in assigned successful sources", "Identity and origin", "Founder-market fit cannot be assessed", "Gap"]
      - [Board and governance, "No board roster or rights disclosure in assigned successful sources", "Governance", "PE control and oversight rights remain unverified", "Gap"]
      - [Senior technical-commercial layer, "Cloud and Data Chief Architect role", "Architecture, pursuits, pricing, OEMs, delivery", "Practice leadership appears commercially consequential", "Company job material"]
      - [Revenue operations, "Lawrence Cowan listed as COO, Revenue Operations, in media contact", "Revenue operations and communications", "One named senior operator is visible; wider executive bench is not", "Company release"]
      - [Workforce, "Almost 1,200 employees stated in role material", "Technology, advisory, delivery, and sales support", "Scale may reduce single-person dependence, but concentration is unknown", "Company job material"]
    notes: >-
      This is a partial enumeration of leadership evidence, not a complete executive
      or board census; role postings and a company release do not establish formal
      governance authority.
    enumerationScope:
      coverage: partial
      basis: "Named people and leadership layers visible in successful assigned sources retrieved for the 2026-10-24 refresh"
    claimRefs: [CO006, CO008, CO014, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder or relationship, Observed role or relevance, Control or economic importance, Diligence ask]
    rows:
      - [SLED government agencies, "Primary target customers and mission context", "Demand, references, procurement access", "Obtain customer concentration, renewal, and backlog data"]
      - [Higher education and education agencies, "Named customer segment", "Education-specific budget and compliance exposure", "Separate education revenue, retention, and implementation economics"]
      - [OEM and technology vendors, "Architect role owns strategic OEM and vendor relationships", "Influences solution capability and delivery dependency", "Review partner concentration, rebates, and certification obligations"]
      - [Subcontractors, "Architect role identifies and manages subcontractors", "Extends delivery capacity and affects gross margin", "Review subcontractor spend, liability, and dependency"]
      - [Capital providers and investors, "Funding, valuation, ownership, and debt not supported by assigned successful sources", "Potential control and leverage rights", "Request cap table, financing agreements, covenants, and board rights"]
    notes: >-
      Stakeholder roles are evidence-constrained; the capital-provider row records an
      unresolved diligence requirement rather than asserting a named investor or term.
    enumerationScope:
      coverage: partial
      basis: "Stakeholder categories and relationships explicitly visible in company, role, and industry materials; not a cap-table census"
    claimRefs: [CO002, CO008, CO012, CO013, CO016]
