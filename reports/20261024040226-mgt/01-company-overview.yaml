company:
  name: MGT
chapter:
  number: 1
  title: Company Overview
  summary: >-
    MGT is a Tampa-based national technology and advisory provider focused on state,
    local, and education government customers. The available evidence supports a
    scaled, acquisition-enabled growth story, but private-company governance,
    audited financials, and customer concentration remain material diligence gaps.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      MGT presents itself as a national technology and advisory solutions provider
      for state, local, and education government agencies, with a stated social-impact
      orientation around education systems, public services, and economic growth
      (CO001, CO002). An independent company profile places the business in Tampa,
      Florida and describes a national SLED focus with selected commercial accounts
      (CO003). The operating model is service-led rather than a narrowly defined
      single-product SaaS model: the available role materials describe critical
      network management and security, human-capital and fiscal problem solving,
      education systems, physical security, cloud and data architecture, pricing,
      delivery, and vendor relationships (CO004, CO005). This breadth can support
      cross-selling and mission-critical relevance, but it also makes segment
      economics and recurring revenue quality difficult to infer from public
      materials alone.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-scale-and-capabilities
    title: Leadership, scale, and capabilities
    body: >-
      The assigned evidence does not provide a complete founder, executive, or board
      roster. It does show an organization that describes itself as having almost
      1,200 employees and serving thousands of agencies, while a separate profile
      places the firm in the 501–1,000 employee band (CO006, CO007). The difference
      is a useful disclosure signal rather than a number to reconcile by assumption:
      the dates, definitions, and inclusion rules are not disclosed. MGT's job
      materials also describe a technical-commercial operating layer in which senior
      architects own solution groups, pricing and packaging, complex pursuits,
      OEM relationships, subcontractors, delivery feasibility, and customer
      handoffs (CO008). That supports meaningful functional coverage, but the lack
      of named governance evidence leaves key-person dependence, board rights, and
      leadership continuity unresolved.
    claimRefs: [CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: growth-capital-and-milestones
    title: Growth, capital, and milestones
    body: >-
      MGT's clearest public growth signal is third-party ranking evidence: the
      company's August 2026 release reports 404% three-year revenue growth for the
      Inc. 5000 ranking period and a fifth consecutive appearance (CO009). The same
      release states that the company ranked No. 859 nationally, No. 48 on Inc.
      Regionals Southeast, No. 9 on the Tampa Bay Business Journal Fast 50, and No. 6
      on CRN's Fast Growth 150 (CO010). A current role description attributes over
      20% compound annual organic growth and 13 acquisitions since 2020, with over
      60% compound annual inorganic growth (CO011); those are company-provided
      operating claims, not audited metrics. The source pool does not contain a
      successful current source establishing funding, valuation, debt terms,
      investors, or a board/cap-table structure, so those metrics remain explicit
      diligence gaps rather than inferred from growth or market context.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
    figureRefs: [FO001]
tables:
