company:
  name: MGT
chapter:
  number: 5
  title: Product & Technology
  summary: MGT presents a broad SLED technology and advisory platform spanning cybersecurity, infrastructure, education, human capital, fiscal improvement, and managed solutions. Public evidence supports a solutions-integration model and a 2026 AI Experience Center, but detailed product telemetry, security attestations, reliability metrics, and production deployment evidence remain limited.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      MGT's customer-facing product is best understood as a portfolio of technology-enabled
      services rather than a single packaged application. Its official site describes
      technology and advisory solutions for improving education systems, optimizing public
      services, and supporting economic growth, while the 2024 company announcement groups
      the offer into cybersecurity, IT infrastructure, human capital, fiscal and operational
      improvement, and education transformation. This breadth gives a public agency one
      contracting relationship for problem diagnosis, implementation, and managed support,
      but it also makes product-level comparability difficult. The available public material
      does not disclose standard SKUs, list prices, service-level objectives, implementation
      cycle times, or customer-level outcome denominators. A buyer diligence process should
      therefore separate repeatable managed services from project-based advisory work and
      test whether the unified brand has produced common delivery controls rather than only
      common marketing.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: architecture-operating-model
    title: Architecture and operating model
    body: >-
      Public recruiting material provides the clearest view of how MGT delivers technology.
      A Cloud and Data Chief Architect role combines customer-facing pursuit leadership with
      offering definition, pricing and packaging, reference architectures, vendor
      relationships, subcontractor management, and continuity into project startup. Its
      technical scope spans on-premises, hybrid and public cloud, storage and backup,
      infrastructure as code, observability, ITSM/CMDB integration, identity and access
      controls, encryption, and regulated hosting frameworks. A separate solutions-architect
      posting describes site surveys, network and power calculations, bills of materials,
      multi-site designs, commissioning, and subcontractor coordination for physical
      security. Together these sources indicate an architecture-led systems-integration
      model with substantial implementation labor and partner dependencies. They do not
      prove that every listed technology is an MGT-owned product, nor do they establish
      production scale, standardization, or realized gross margins.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-roadmap
    title: Differentiation, integrations, and roadmap
    body: >-
      MGT's stated differentiation is the combination of SLED domain access, advisory
      expertise, implementation capability, and a growing partner ecosystem. The 2024
      announcement says acquisitions were integrated into one online platform and names
      capabilities including cybersecurity, IT infrastructure, education performance, and
      human capital. In March 2026, MGT, Protopia AI, and HPE announced an AI Experience
      Center built on HPE Private Cloud AI, NVIDIA infrastructure and software, and
      Protopia's privacy-preserving inference technology. The announcement describes
      segmented development, testing, and production environments, policy enforcement,
      auditability, and use cases such as workflow automation, curriculum-grounded student
      support, and educator assistance. These are partnership and roadmap signals, not
      independent evidence that the center has converted pilots into recurring production
      deployments. The diligence question is whether MGT owns reusable IP and operating
      playbooks or primarily integrates third-party platforms for each engagement.
    claimRefs: [CE010, CE011, CE012, CE013]
    tableRefs: [TE002]
  - id: trust-reliability-gaps
    title: Trust, security, and implementation risk
    body: >-
      MGT's public AI announcement explicitly positions privacy, local control, governance,
      policy enforcement, and auditability as requirements for public-sector deployment.
      NIST's Cybersecurity Framework 2.0 provides an external governance reference for
      reducing cybersecurity risk, but it is not evidence that MGT conforms to the framework.
      The public materials reviewed do not provide an MGT SOC 2 report, FedRAMP or other
      certification, penetration-test summary, incident history, uptime commitment, data
      retention policy, or quantified support performance. Public recruiting evidence also
      points to OEM certification tracking, delivery feasibility checks, and subcontractor
      reliance, which are operational controls to test rather than verified outcomes.
      Implementation risk is consequently concentrated in integration quality, partner and
      subcontractor execution, public-sector privacy obligations, and the ability to turn
      bespoke architectures into repeatable managed services. Investors should request
      customer references, security artifacts, incident logs, SLOs, and acceptance criteria
      before treating the roadmap as mature product evidence.
    claimRefs: [CE014, CE015, CE016]
