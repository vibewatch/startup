      - ["Education and student-support solutions", "School districts and higher education", "Current solution area plus AI use-case roadmap", "Curriculum-grounded support and educator workflow focus", "Production deployments, outcome denominators, and privacy controls"]
      - ["Human capital, fiscal, and operational improvement", "Public-sector leadership teams", "Current advisory and implementation portfolio", "Combination of advisory diagnosis with implementation and managed support", "Repeatability, software ownership, and project-to-recurring conversion"]
    notes: >-
      Status reflects public descriptions and recruiting material, not an audited product
      catalog. Null-like gaps identify evidence not disclosed in the reviewed sources.
    claimRefs: [CE001, CE002, CE003, CE010]
