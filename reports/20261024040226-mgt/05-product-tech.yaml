    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Reduce administrative workload", "Intake, triage, drafting, ticketing, and approvals", "Governed AI agents through the AI Experience Center", "Faster workflow handling is proposed but no measured baseline is disclosed", "Announcement is a launch description rather than deployment evidence"]
      - ["Support educators and students", "Staff lesson planning and student support using district resources", "Curriculum-grounded digital employees and educator copilot", "Improved support and equitable access are stated objectives", "No adoption, learning, or outcome denominator is published"]
      - ["Modernize infrastructure", "Discovery, architecture, pricing, procurement, and delivery handoff", "Cloud, data, hybrid infrastructure, security, and managed-service practices", "Better technical fit and delivery continuity are intended", "Reference architecture reuse and post-deployment SLOs are not disclosed"]
      - ["Secure sensitive public-sector data", "Separate development, testing, and production with controls", "HPE Private Cloud AI plus Protopia privacy-preserving inference and NVIDIA acceleration", "Privacy and auditability are design goals", "Independent validation of controls and operating cost is unavailable"]
    notes: >-
      Use cases and benefits are drawn from MGT's March 2026 partner announcement and
      should be treated as company/partner claims until supported by customer evidence.
    claimRefs: [CE011, CE012, CE013, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Advisory and solution design", "Diagnose agency needs and define scope", "MGT domain experts and customer stakeholders", "Bespoke scoping can constrain comparability and margin visibility"]
      - ["Reference architecture and pricing", "Package offerings, estimate cost, and support pursuits", "OEM roadmaps, vendor relationships, and deals desk", "Third-party changes and discounting may affect delivery economics"]
      - ["Infrastructure and data platform", "Compute, storage, cloud, backup, migration, and hybrid operation", "AWS, Azure, GCP, OEM hardware, and specialist staff", "Compatibility, capacity, security, and migration execution risk"]
      - ["Security and governance", "IAM, encryption, segmentation, policy, and auditability", "Customer governance plus platform and partner controls", "Compliance evidence and control ownership are not publicly verified"]
      - ["Implementation and managed delivery", "Build, integrate, commission, and support multi-site deployments", "MGT teams, OEMs, subcontractors, and customer procurement", "Handoffs, field execution, and subcontractor quality can vary"]
    notes: >-
      This is an evidence-based operating model assembled from public role descriptions and
      the AI partnership announcement; it is not a confirmed internal system diagram.
    claimRefs: [CE005, CE006, CE007, CE008, CE011]
figures:
  - id: FE001
    title: MGT product architecture map
    type: stack
    summary: MGT's public delivery model layers SLED advisory work over architecture, partner platforms, implementation, and managed outcomes.
    data:
      layers:
        - label: SLED mission and advisory
          detail: Customer problem framing and solution design for public-sector priorities.
          modules:
            - label: Public-sector problem framing
              detail: Education, public services, resilience, and organizational performance priorities.
            - label: Solution design
              detail: Customer discovery, scope, procurement, and executive technical guidance.
        - label: Architecture and governance
          detail: Technical design and control requirements before implementation.
          modules:
            - label: Cloud and data architecture
              detail: Hybrid cloud, storage, backup, migration, automation, observability, and ITSM.
            - label: Security and privacy controls
              detail: IAM, encryption, segmentation, policy enforcement, auditability, and privacy-preserving inference.
        - label: Partner technology
          detail: OEM and specialist platforms used to extend MGT delivery capability.
          modules:
            - label: OEM and platform ecosystem
              detail: HPE Private Cloud AI, NVIDIA infrastructure/software, Protopia AI, and other OEM relationships.
            - label: Privacy-preserving inference
              detail: Protopia technology is described as transforming sensitive prompts into protected representations.
        - label: Implementation and operations
          detail: Build, integration, commissioning, handoff, and ongoing managed support.
          modules:
            - label: Delivery and managed support
              detail: Bills of materials, integration, commissioning, handoff, subcontractor coordination, and ongoing service.
            - label: AI workflow enablement
              detail: Governed agents are proposed for intake, triage, drafting, approvals, and educator support.
        - label: Customer adoption
          detail: Agency deployment, change management, and workflow adoption.
          modules:
            - label: Pilot-to-production transition
              detail: The announced center is intended to help customers move from experimentation to production.
        - label: Outcome measurement
          detail: Operational and educational objectives that require customer-level validation.
          modules:
            - label: Service and education outcomes
              detail: Claimed benefits include reduced administrative burden and improved student support.
    claimRefs: [CE005, CE006, CE011, CE014]
callouts:
  - calloutType: strength
    title: Integrated SLED delivery breadth
    body: MGT combines public-sector domain expertise with architecture, implementation, advisory, and managed-solution capabilities across multiple mission areas.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: insight
    title: AI is a partnership-led product bet
    body: The AI Experience Center is a concrete 2026 productization signal, but the disclosed evidence identifies partner technologies and intended use cases rather than independently verified production scale.
    claimRefs: [CE011, CE012, CE013]
  - calloutType: risk
    title: Operating evidence is thinner than architecture claims
    body: Public sources describe controls, roles, and partner designs but do not establish security certifications, uptime, incident performance, or repeatable customer outcomes.
    claimRefs: [CE014, CE015, CE016]
