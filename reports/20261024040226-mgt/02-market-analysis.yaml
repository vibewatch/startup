  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: MGT-specific serviceable market, contract universe, win rates, pricing, and obtainable share by SLED segment and geography.
      whyItMatters: Without these denominators, broad public-sector spending and program caps cannot be translated into MGT revenue opportunity or valuation support.
      diligencePath: Request a segment-by-segment pipeline and bookings bridge, contract vehicle list, win/loss data, pricing realization, and independent market-sizing methodology from management.
      relatedQuestionRefs: [QM003, QM004, QM008]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: segmentation
      missingEvidence: Customer-level budget ownership, recurring versus project mix, renewal rates, and concentration by state, local, education, and commercial segment.
      whyItMatters: Buyer identity and budget durability determine adoption timing, repeatability, and the quality of any market-share inference.
      diligencePath: Obtain anonymized contract-level revenue, renewal, backlog, payer, and budget-source extracts with segment definitions.
      relatedQuestionRefs: [QM005, QM008]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: minor
      topic: adoption-constraint
      missingEvidence: Comparable public-sector technology and cybersecurity procurement slowdowns, failed implementations, and post-funding demand changes.
      whyItMatters: A growth-oriented company description and program availability do not establish that agency budgets convert into timely purchases.
      diligencePath: Review public bid cancellations, audit findings, procurement cycle times, and customer references across the target states and education systems.
      relatedQuestionRefs: [QM007]
