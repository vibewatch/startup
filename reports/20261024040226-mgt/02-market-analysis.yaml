company:
  name: MGT
chapter:
  number: 2
  title: Market Analysis
  summary: MGT operates in a broad SLED technology and advisory market whose boundary spans managed technology, cybersecurity, infrastructure, human capital, education, fiscal, and operational services. The assigned evidence supports a structurally recurring public-sector buying need and identifiable procurement channels, but it does not support a defensible numeric TAM/SAM/SOM estimate for MGT without paid market data, public budgets, or company financial disclosures.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The relevant market is not generic management consulting. It is the set of
      technology, implementation, managed-service, and advisory purchases made by
      state, local, and education agencies, with a limited adjacent commercial
      segment. MGT's 2024 company release describes a unified platform spanning
      cybersecurity, IT infrastructure, human capital, fiscal, and operational
      improvement, while the Massachusetts Municipal Association listing describes
      network infrastructure, cybersecurity, managed technology services, human
      capital, operations, and financial solutions. The practical boundary therefore
      includes outsourced specialist delivery and implementation around public
      agency missions, while excluding general government operating budgets,
      telecommunications resale unrelated to managed delivery, and all commercial
      consulting outside MGT's targeted adjacency. The status quo is internal
      agency staff plus fragmented specialist vendors, with procurement vehicles
      and competitive bidding shaping how a bundled provider can win. MGT's about
      page frames the intended outcomes as improving education, maximizing public
      financial resources, and creating resilient IT environments.
    claimRefs: [CM001, CM002, CM003, CM004, CM014]
    tableRefs: [TM001]
  - id: sizing-and-demand
    title: Sizing lenses and demand drivers
    body: >-
      A defensible market-size conclusion must use several lenses rather than one
      broad technology-spend number. The evidence supports a service-category lens:
      MGT reports more than 30,000 client engagements and a portfolio spanning
      technology modernization, cybersecurity, education transformation, human
      capital, and fiscal and operational improvement, but those are company
      activity indicators rather than market totals. A budget-channel lens is more
      concrete for education technology: the FCC states that E-Rate funding is
      demand-based up to a $3.9 billion annual Commission-established cap, with
      discounts from 20% to 90% for eligible services and equipment. A procurement
      lens is also material because NASPO ValuePoint describes nationally leveraged
      contracts that reduce procurement burden. These sources indicate reachable
      demand pools and adoption mechanisms, not MGT revenue opportunity; SAM and SOM
      remain unisolated because geography, eligibility, contract share, pricing,
      and service mix are not disclosed.
    claimRefs: [CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-constraints
    title: Buyer segmentation and adoption constraints
    body: >-
      The buyer is typically a public agency or education-system leadership team,
      while users and budget owners differ by workflow. USAC's E-Rate process
      requires eligible schools and libraries to create an account, conduct
      competitive bidding, select service providers, apply for discounts, and
      complete review and invoicing; this makes program compliance and procurement
      execution part of the product value proposition. MGT's Cloud and Data Chief
      Architect posting shows the commercial motion: complex pursuits involve
      executive presentations, scoping, pricing, procurement vehicles, OEM
      relationships, and delivery-risk review. GovSpend's account of the
      MS-ISAC's shift to fee-based membership shows an adverse timing constraint:
      SLED cybersecurity buyers can face changing grant and shared-service funding
      models. Adoption is therefore driven by mission risk, capability gaps, and
      eligible funding, but slowed by competitive bidding, compliance, budget
      ownership, switching risk, and uncertain recurring-versus-project economics.
    claimRefs: [CM009, CM010, CM011, CM012, CM013]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: Reachable market is procurement-constrained
    body: MGT's opportunity is better framed as a set of recurring SLED buying workflows and contract channels than as a single disclosed market-size number. The evidence supports demand, but not a company-specific share calculation.
    claimRefs: [CM006, CM007, CM009]
  - calloutType: risk
    title: Numeric sizing remains an evidence gap
    body: The assigned sources do not isolate MGT's eligible geography, serviceable contract universe, win rate, pricing, or recurring mix, so any precise TAM, SAM, or SOM figure would be unsupported.
    claimRefs: [CM008, CM013]
