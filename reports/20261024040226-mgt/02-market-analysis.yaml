      TAM, SAM, SOM, CAGR, or MGT revenue.
    claimRefs: [CM005, CM006, CM007, CM008]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer/budget owner, Workflow, Adoption trigger]
    rows:
      - ["State agencies", "CIO/CISO or cabinet leadership", "IT and security teams", "State technology or program budget", "Modernization, security, managed services", "Capability gap or resilience requirement"]
      - ["Local governments", "City/county executive and department leadership", "IT, operations, finance, and HR teams", "Local department or central technology budget", "Infrastructure, cybersecurity, human capital, fiscal improvement", "Specialist capacity and outcome pressure"]
      - ["School districts and libraries", "Superintendent, district CIO, or library leadership", "IT and education operations staff", "District/library budget plus eligible program funding", "Internet access, internal connections, education transformation", "Eligible funding and competitive-bid process"]
      - ["Universities and higher education", "Cabinet leadership and technology executives", "Campus IT, academic, and administrative users", "Institutional technology or transformation budget", "Infrastructure, data, education, and advisory work", "Complex environment and executive sponsorship"]
    notes: >-
      Buyer roles are an analytical mapping from the cited service descriptions and
      USAC process; the sources do not provide a complete customer-by-customer
      procurement census or payer allocation for MGT.
    claimRefs: [CM009, CM010, CM011, CM012]
