    title: Market sizing lens
    type: pyramid
    summary: A qualitative, evidence-constrained pyramid separates the broad public-sector service boundary from the narrower reachable workflows; no unsupported numeric widths or market totals are implied.
    data:
      nodes:
        - label: Broad SLED technology and advisory demand
          value: Not disclosed
          note: "Boundary includes technology, implementation, managed services, and advisory work."
        - label: State and local agency technology and resilience
          value: Not disclosed
          note: "Includes infrastructure, cybersecurity, operations, fiscal, and human-capital workflows."
        - label: Education and library eligible-service demand
          value: "$3.9B annual E-Rate cap"
          note: "FCC program cap; not MGT opportunity."
        - label: Contract-accessible procurement
          value: Not disclosed
          note: "NASPO describes leveraged contract access but publishes no aggregate spend here."
        - label: MGT-described solution categories
          value: Not disclosed
          note: "Company-described portfolio, not an independently measured market."
        - label: MGT obtainable share
          value: Not disclosed
          note: "Requires win rates, pricing, geography, and contract-level pipeline."
    approximationNotes: >-
      Layers are ordered from broad boundary to narrower evidence lens; widths are
      illustrative only and no conversion rate, proportional share, CAGR, or SOM is
      derived. The only numeric value is the FCC-stated annual E-Rate cap.
    claimRefs: [CM005, CM006, CM007, CM008]
