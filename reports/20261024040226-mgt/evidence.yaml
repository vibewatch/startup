evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital
    missingEvidence: A current cap table, financing history, valuation support, debt agreements, and investor or lender rights.
    whyItMatters: >-
      Ownership and leverage can materially change control, dilution, downside risk, and the interpretation of reported
      growth.
    diligencePath: >-
      Request the latest cap table, equity purchase agreements, credit agreements, covenant package, and board materials
      under NDA.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Audited or lender-quality financial statements with revenue by service line, recurring mix, margins, cash flow,
      and customer concentration.
    whyItMatters: >-
      A reported growth percentage does not establish revenue quality, profitability, cash generation, or concentration
      risk.
    diligencePath: >-
      Obtain audited annual and quarterly statements, a revenue-recognition memo, backlog and renewal schedules, and
      top-customer exposure.
    relatedQuestionRefs:
      - QO007
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A complete founder, executive, board, and governance-rights roster.
    whyItMatters: Leadership continuity and sponsor or board rights affect key-person risk and decision-making accountability.
    diligencePath: >-
      Request the current organizational chart, board minutes or consent rights, executive biographies, and
      incentive-plan summary.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: workforce
    missingEvidence: A dated, consistently defined employee count and geographic workforce breakdown.
    whyItMatters: The almost-1,200 company statement and 501–1,000 third-party band use different undisclosed definitions or dates.
    diligencePath: >-
      Reconcile HR headcount, contractors, acquired entities, and reporting date against payroll or lender diligence
      materials.
    relatedQuestionRefs:
      - QO002
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      MGT-specific serviceable market, contract universe, win rates, pricing, and obtainable share by SLED segment and
      geography.
    whyItMatters: >-
      Without these denominators, broad public-sector spending and program caps cannot be translated into MGT revenue
      opportunity or valuation support.
    diligencePath: >-
      Request a segment-by-segment pipeline and bookings bridge, contract vehicle list, win/loss data, pricing
      realization, and independent market-sizing methodology from management.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: segmentation
    missingEvidence: >-
      Customer-level budget ownership, recurring versus project mix, renewal rates, and concentration by state, local,
      education, and commercial segment.
    whyItMatters: >-
      Buyer identity and budget durability determine adoption timing, repeatability, and the quality of any market-share
      inference.
    diligencePath: >-
      Obtain anonymized contract-level revenue, renewal, backlog, payer, and budget-source extracts with segment
      definitions.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: adoption-constraint
    missingEvidence: >-
      Comparable public-sector technology and cybersecurity procurement slowdowns, failed implementations, and
      post-funding demand changes.
    whyItMatters: >-
      A growth-oriented company description and program availability do not establish that agency budgets convert into
      timely purchases.
    diligencePath: >-
      Review public bid cancellations, audit findings, procurement cycle times, and customer references across the
      target states and education systems.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Comparable MGT and competitor bid sheets, contract schedules, discounting, and delivered gross margins.
    whyItMatters: >-
      Without realized pricing and contribution economics, breadth cannot be translated into durable competitive
      advantage or valuation quality.
    diligencePath: >-
      Request the last 24 months of representative bids, signed schedules, discount approvals, delivery cost, and margin
      by offering.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: MGT win rates, renewal rates, customer concentration, backlog, and switching-cost evidence by segment.
    whyItMatters: These measures distinguish a durable distribution moat from acquisition-driven capability aggregation.
    diligencePath: >-
      Obtain cohort-level bookings, renewal, churn, concentration, bid pipeline, and referenceable customer evidence
      under NDA.
    relatedQuestionRefs:
      - QP008
      - QP009
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile-table
    missingEvidence: A complete bid-level competitor universe and likely entrant list for MGT's priority SLED segments.
    whyItMatters: The assigned pool supports representative categories but not exhaustive market coverage.
    diligencePath: >-
      Run segment-specific procurement and award analysis across priority states, school systems, and solution
      categories.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Audited income statements, balance sheets, cash-flow statements, and revenue-recognition policies by service line.
    whyItMatters: >-
      Without audited results, reported growth, valuation, and scale cannot be converted into verified revenue quality
      or margin underwriting.
    diligencePath: Obtain the latest audited financial statements, management accounts, and revenue-recognition memo under NDA.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Ares credit agreement, debt schedule, interest rate, maturity, covenants, liquidity requirements, and acquisition
      commitments.
    whyItMatters: The financing headline does not establish cash available, debt service burden, refinancing risk, or runway.
    diligencePath: >-
      Review executed financing documents, latest lender compliance certificate, 24-month cash plan, and acquisition
      pipeline.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: enumeration-incomplete
    severity: material
    topic: customer-economics
    missingEvidence: Customer-level revenue, renewal, concentration, backlog, and recurring-versus-project cohort data.
    whyItMatters: A repeat-project percentage is not equivalent to dollar retention, recurring revenue, or low concentration.
    diligencePath: >-
      Request a customer cohort schedule covering revenue, gross margin, renewal, expansion, and top-customer
      concentration.
    relatedQuestionRefs:
      - QI002
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
