company:
  name: MGT
chapter:
  number: 6
  title: Customers
  summary: MGT sells technology and advisory services into state, local, and education agencies, with evidence of named public-sector engagements and a partner-enabled path from pilot to production. The available record does not disclose audited customer counts, retention, recurring revenue mix, or concentration, and recent reporting raises procurement and delivery-quality questions that warrant customer-level diligence.
sections:
  - id: customer-segments-and-buyers
    title: Customer segments and buying motion
    body: >-
      MGT's customer surface is concentrated in state, local, and education agencies, while third-party profiles also describe targeted commercial accounts. The available evidence points to a multi-stakeholder public-sector buying motion: executives and program leaders set priorities, finance and procurement control defensibility, and IT, security, and legal validate implementation and risk. MGT's cloud-and-data practice role explicitly assigns senior leaders to customer pursuits, pricing, procurement vehicles, executive briefings, and delivery handoff, which is consistent with complex consultative sales rather than a self-serve product motion. Cooperative vehicles can widen access to public buyers, but holding a vehicle does not by itself establish awarded volume or repeat purchasing. The segment mix is therefore strategically attractive but operationally dependent on long procurement cycles, reference quality, and proof that projects become durable production relationships.
      Independent market evidence adds two qualifications. Capstone reported comparatively resilient SLED technology demand, while current StateScoop and EdScoop coverage shows that customer agendas span AI, accessibility, cloud, privacy, and cybersecurity rather than a single homogeneous need. Those demand signals support the breadth of MGT's addressable customer problems, but neither source demonstrates MGT-specific wins.
    claimRefs: [CU001, CU002, CU003, CU004, CU015, CU016]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      Publicly available evidence shows several adoption surfaces, but not a complete customer funnel. MGT was reported to have performed early advisory work for the Memphis-Shelby County Schools takeover, with a proposed six-month contract circulated at $1 million but not officially approved at the time of reporting. Separately, the company announced an AI Experience Center with Protopia AI and HPE that is intended to help SLED agencies move from experimentation to production, including managed-service or customer-replicated deployment options. These are meaningful indicators of customer-facing activity and expansion design, not proof of realized recurring revenue, utilization, renewal, or net retention. A job description also says the firm partners with thousands of agencies, but that company-authored statement lacks a disclosed denominator, period, or reconciliation to active customers. Durability should therefore be treated as an unresolved diligence question rather than inferred from logos, pipeline language, or a proposed engagement.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named customer proof and concentration risk
    body: >-
      The strongest named proof is public-sector work tied to Memphis-Shelby County Schools, Houston public schools, and Adams 14 in Colorado, but the evidence quality differs materially across those examples. Memphis and Houston show advisory involvement or claimed precedent; they do not establish a completed production deployment, outcome, or renewal. Adams 14 is a completed engagement with a disclosed contract value and a later dispute, external criticism, and settlement, making it both customer proof and adverse evidence. The AI Experience Center announcement supplies partner and use-case proof but names no paying district or agency. Taken together, the record supports a differentiated route into high-consequence public-sector workflows while leaving customer concentration, referenceability, delivery consistency, and expansion economics unverified. Management should provide a customer cohort and contract-level bridge before relying on broad agency-partnership claims.
    claimRefs: [CU001, CU007, CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
