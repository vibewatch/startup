    notes: "This is a partial public enumeration, not a customer list. Named proof mixes company-cited precedent, reported advisory work, and an adverse completed engagement; production status and outcomes are not comparable across rows."
    claimRefs: [CU001, CU007, CU010, CU011, CU012, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey from public-sector priority to expansion
    type: journey-map
    summary: MGT's observable customer motion runs from mission priority and procurement validation through technical delivery and potential production expansion, with proof and durability gaps at each transition.
    data:
      nodes:
        - id: priority
          label: Mission priority
          detail: Agency leadership identifies an operational, education, technology, or fiscal problem.
          touchpoints: [Executive agenda, program mandate]
        - id: procurement
          label: Procurement and validation
          detail: Finance, procurement, IT, security, and legal test value, compliance, and defensibility.
          touchpoints: [RFP or cooperative vehicle, Peer validation]
        - id: pursuit
          label: Solution pursuit
          detail: MGT shapes architecture, scope, pricing, executive briefings, and partner alignment.
          touchpoints: [Customer pursuit, OEM or partner collaboration]
        - id: deployment
          label: Delivery
          detail: The stated operating model includes technical continuity into project startup and customer success collaboration.
          touchpoints: [Implementation, Handoff to delivery]
        - id: production
          label: Production use
          detail: The AI Experience Center announcement describes governed workflows and managed-service or customer-replicated deployment.
          touchpoints: [Operational workflow, Local data control]
        - id: expansion
          label: Expansion and reference
          detail: Repeat purchase, cross-sell, renewal, and referenceability are potential value pools but are not publicly quantified.
          touchpoints: [Renewal, Additional agencies]
    approximationNotes: "Ordered stages describe the observed or claimed buying and delivery motion; they do not imply that every customer reaches production or expansion."
    claimRefs: [CU003, CU004, CU007, CU008, CU015, CU016]
callouts:
  - calloutType: strength
    title: Public-sector access is demonstrable
    body: Named education engagements and a partner-backed AI Experience Center show MGT can enter complex public-sector workflows and package services with major technology partners.
    claimRefs: [CU005, CU010, CU011]
  - calloutType: risk
    title: Durability and concentration remain opaque
    body: No assigned source discloses audited active customers, cohort retention, recurring versus project revenue, top-customer concentration, or renewal rates; the Adams 14 record also shows that delivery outcomes can be contested.
    claimRefs: [CU012, CU013, CU014]
  - calloutType: recommendation
    title: Require a customer-level evidence pack
    body: Request a contract-level customer bridge with active status, ARR or project value, renewal dates, gross retention, expansion, concentration, reference permissions, and outcome measures by named deployment.
    claimRefs: [CU007, CU008, CU014]
