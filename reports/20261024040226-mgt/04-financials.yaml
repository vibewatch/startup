company:
  name: MGT
chapter:
  number: 4
  title: Financials
  summary: MGT presents a diversified SLED technology and advisory model with repeat-client evidence, acquisition-led scale, and contract structures that support project-level billing. Public materials substantiate growth and financing headlines but do not disclose audited revenue quality, margins, cash runway, debt terms, or realized unit economics, so underwriting remains diligence-dependent.
sections:
  - id: revenue-model
    title: Revenue model and customer economics
    body: >-
      MGT's public materials describe a services platform rather than a single-metric
      software model. The company sells managed technology, cybersecurity, cloud, fiscal,
      human-capital, education, and advisory work to state, local, and education customers,
      with selected enterprise activity. A 2023 investor announcement says 65% of projects
      obtained were from repeat clients and describes a base of recurring revenue, but it
      does not quantify recurring revenue as a percentage of total revenue or distinguish
      subscriptions from recurring managed-services contracts. The 2025 Pasco County
      agreement makes project scope, pricing, and period of performance dependent on
      separately signed statements of work, which is consistent with a multi-engagement
      professional-services model. The evidence therefore supports customer-retention
      quality signals, not a verified ARR or net-retention figure.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-delivery
    title: Pricing, delivery, and margin drivers
    body: >-
      Pricing is negotiated at the statement-of-work level rather than published as a
      standard list-price catalog. The Pasco agreement states that each SOW includes scope,
      pricing, and period of performance, and its payment terms make undisputed invoices
      payable upon receipt, permit interest of the lesser of 1.5% per month or the legal
      maximum after 30 days, and allow work stoppage after 60 days of non-payment. The
      attached proposal also shows that one school engagement can use either a fixed-fee
      transformation model or an external-operator model with a material performance
      holdback. Separately, an MGT job posting says solution leaders own pricing and
      packaging and support discount and margin escalations. Those facts indicate pricing
      discipline and receivables protections, but they do not reveal realized rates,
      utilization, delivery gross margin, subcontractor costs, or customer-level
      contribution margin. The key financial risk is limited visibility into how mix and
      execution convert bookings into cash earnings.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      MGT's latest public financing announcement reports a $350 million investment from
      Ares Credit funds at a $1.25 billion company valuation and says the capital expands
      capacity for larger acquisitions. The same release describes MGT as midway through a
      four-year value-creation plan after Vistria's majority investment and attributes
      growth to programmatic M&A, organic growth, and business transformation. This is
      evidence of institutional financing and an acquisition strategy, not evidence of
      unrestricted cash available to the operating business. The public record reviewed
      here does not disclose cash on hand, cash burn, debt principal versus preferred or
      equity proceeds, interest rate, maturity, covenants, minimum liquidity, acquisition
      commitments, or the next financing trigger. Consequently, capital adequacy cannot
      be scored from headline funding alone; lender documentation and current management
      accounts are required.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      The financial profile is promising but under-disclosed. Positive signals include a
      repeat-project rate reported by Vistria, a broad service portfolio, public evidence
      of pricing and margin ownership inside the commercial organization, and institutional
      capital explicitly linked to acquisitions and a value-creation plan. Counterweights
      are material: public sources do not provide audited income statements, revenue
      reconciliation, gross-margin bridge, customer concentration, backlog quality,
      working-capital needs, utilization, CAC or payback, cash runway, or financing
      covenants. Company and partner releases also combine revenue-growth language with
      operating scale and valuation claims, so each metric must retain its issuer and
      period rather than be treated as independently verified. The appropriate stance is
      research-more until financial statements, debt documents, cohort data, and contract
      economics are available.
    claimRefs: [CI013, CI014, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or contract basis, Current public value/status, Quality, Diligence ask]
    rows:
      - [Managed technology and infrastructure, "Managed services, network, cloud, and related IT delivery", "SOW/project or recurring service engagement", "Offered; no revenue split disclosed", "Company/partner descriptions", "Reconcile recurring managed-services revenue with project revenue"]
      - [Cybersecurity and resilience, "Cyber, network, incident-response, and managed security services", "SOW/project or managed service", "Offered; no margin or retention disclosed", "Official brochure and partner description", "Provide revenue, gross margin, renewal, and incident-cost cohorts"]
      - [Education and school improvement, "Instruction, transformation, analytics, and education improvement", "Engagement/project", "3,500 projects and 50M students stated in brochure; period and accounting basis not stated", "Company brochure", "Tie project counts to recognized revenue and delivery cost"]
      - ["Fiscal, human-capital, and advisory work", "Studies, staffing, fiscal support, and organizational consulting", "SOW/project", "Offered; no mix or backlog disclosed", "Official brochure and contract", "Provide revenue mix, utilization, subcontractor, and backlog data"]
      - [Repeat-client base, "Follow-on work across client engagements", "Project repeat rate", "65% of projects obtained from repeat clients in Vistria's 2023 release", "Partner-issued company evidence", "Define denominator, period, dollar share, and cohort retention"]
    notes: "Public descriptions span managed services and project consulting; counts and repeat rates are not a substitute for audited revenue recognition or ARR."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Pricing or monetization element, Source-backed structure, List versus realized pricing, Financial implication, Diligence ask]
    rows:
      - [Statement of work, "Each SOW states scope, pricing, and period of performance", "Realized pricing not disclosed", "Contract-by-contract pricing can create mix and utilization variation", "Sample signed SOWs and rate cards"]
      - [Invoice collection, "Invoices due upon receipt unless an SOW states otherwise", "Contract term, not a public list price", "Short stated payment cycle supports receivables discipline", "Aging schedule and DSO by customer segment"]
      - [Late-payment protection, "Interest capped at lesser of 1.5% per month or legal maximum after 30 days", "Contractual remedy", "May protect cash collection but does not establish actual collection performance", "Bad-debt history and disputed-invoice data"]
      - [Non-payment work stoppage, "MGT may stop work after 60 days of undisputed non-payment", "Contractual remedy", "Reduces open-ended delivery exposure; customer continuity risk remains", "Termination, suspension, and write-off history"]
      - [Performance-linked school contract, "$642,209 maximum external-operator fee includes a $211,928.97 holdback; alternate transformation model totals $494,007", "One Pasco County engagement, not a company-wide rate card", "Shows outcome-contingent compensation and engagement-specific pricing", "Portfolio-wide mix of fixed, recurring, time-and-materials, and performance-linked fees"]
      - [Practice pricing and packaging, "Solution leader owns pricing and packaging and supports discount and margin escalations", "Realized discounts and margins unavailable", "Commercial governance exists, but margin outcomes are unverified", "Win/loss, discount, utilization, and gross-margin bridge"]
    notes: "The contract provides mechanics and one engagement's stated ceiling; job materials describe pricing governance, but neither source discloses company-wide realized price, gross margin, or customer contribution."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital-adequacy data
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, null, "Unavailable publicly in reviewed sources", "Tests scale and valuation support", "Audited statements and revenue-recognition policy"]
      - [ARR or recurring-revenue dollars, null, "Recurring base described; amount unavailable", "Separates durable contracted revenue from projects", "Recurring-revenue definition, bridge, and cohort schedule"]
      - [Gross margin, null, "Unavailable publicly", "Tests delivery leverage and mix quality", "Gross-margin by service line and customer cohort"]
      - [CAC and payback, null, "Unavailable publicly", "Tests whether organic growth is capital efficient", "Sales expense, bookings, win rate, cycle, and payback analysis"]
      - ["Cash on hand, burn, and runway", null, "Unavailable publicly", "Tests ability to fund operations and M&A", "Monthly cash-flow statements, liquidity, and 24-month plan"]
      - [Debt terms and obligations, null, "Investment headline disclosed; terms unavailable", "Tests refinancing and covenant risk", "Ares credit agreement, rate, maturity, covenants, and acquisition debt schedule"]
    notes: "Null means the assigned public evidence did not disclose a reliable value; no null is treated as zero."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016]

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: MGT's documented commercial path runs from public-sector and selected enterprise needs through scoped engagements and delivery, with repeat work as the main public quality signal.
    data:
      nodes:
        - id: demand
          label: "SLED and selected enterprise needs"
          detail: "Technology, cyber, education, fiscal, human-capital, and modernization priorities."
        - id: scope
          label: "Signed SOWs and service packages"
          detail: "Scope, pricing, and period of performance are set at project level."
        - id: delivery
          label: "Managed services and advisory delivery"
          detail: "Network, cloud, security, education, fiscal, staffing, and consulting work."
        - id: repeat
          label: "Repeat-client work"
          detail: "Vistria reported 65% of projects obtained from repeat clients in 2023."
        - id: cash
          label: "Invoice collection and operating cash"
          detail: "Payment mechanics are documented; cash conversion and margin are not disclosed."
        - id: margin
          label: "Unverified gross profit"
          detail: "No public service-line gross-margin bridge is available in the assigned evidence."
      edges:
        - from: demand
          to: scope
        - from: scope
          to: delivery
        - from: delivery
          to: repeat
        - from: repeat
          to: cash
        - from: cash
          to: margin
    approximationNotes: "The flow expresses the documented commercial mechanism; it does not infer conversion rates, revenue amounts, gross profit, or cash-flow timing."
    claimRefs: [CI001, CI003, CI005, CI006]

callouts:
  - calloutType: strength
    title: Repeat work is the strongest public revenue-quality signal
    body: Vistria reported that 65% of projects obtained were from repeat clients, but the denominator and dollar share are not disclosed.
    claimRefs: [CI003]
  - calloutType: risk
    title: Financing headline is not liquidity evidence
    body: The $350 million Ares investment and $1.25 billion valuation do not establish cash available, debt terms, burn, or runway.
    claimRefs: [CI009, CI010, CI011]
  - calloutType: recommendation
    title: Underwrite only after private financial diligence
    body: Require audited statements, service-line margins, cash flow, customer cohorts, and credit documents before treating growth or valuation as investable financial performance.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]

