company:
  name: MGT
chapter:
  number: 8
  title: Valuation
  summary: >-
    MGT's December 2025 financing establishes a reported $1.25 billion transaction mark,
    but the retained public evidence does not supply the audited earnings, capital structure,
    or security terms needed to convert that mark into a defensible entry valuation. The
    appropriate stance is research-more with medium confidence and strict price discipline.
sections:
  - id: decision-and-price
    title: Decision and price context
    body: >-
      The public record supports institutional validation, not a price-insensitive investment.
      MGT announced that Ares invested $350 million in December 2025 at a reported $1.25 billion
      valuation, while naming The Vistria Group, J.P. Morgan, and WhiteHorse Capital as existing
      backers. Those facts establish a financing event and headline mark, but the announcement
      does not expose security seniority, the primary-versus-secondary split, ownership acquired,
      liquidation preferences, or a bridge from enterprise value to common-equity value. Public
      evidence therefore supports a research-more recommendation, medium confidence, medium-high
      underwriting risk, and a stretched/unproven valuation stance. A buy decision requires both
      audited operating denominators and investor-specific return terms.
    claimRefs: [CV001, CV002, CV003, CV016]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is a scaled SLED technology and advisory platform with mission-critical demand,
      acquisition capacity, and operating infrastructure that appears more developed than a
      typical early-stage services business. Company-issued materials report more than 1,100
      employee-owners, over 2,500 clients, 13 acquisitions since 2016, enterprise value tripling
      after Vistria's April 2023 majority investment, and organic and inorganic growth claims
      above 20% and 60%, respectively. A current recruiting document also assigns senior staff
      responsibility for pricing, discount and margin escalations, and monthly performance
      reporting. The anti-thesis is that these are company claims rather than audited results;
      acquisition-led scale can obscure organic quality, integration cost, leverage, and cash
      conversion.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-benchmarks
    title: Scenario framework and benchmark limits
    body: >-
      A numerical fair-value range is not supportable from this evidence set. Hurun's methodology
      uses the most recent sizeable financing round and turns to industry comparables when a
      company may be underperforming, illustrating why a private mark is an estimate rather than
      a continuously tested market price. Its 2026 index also recorded 88 companies falling below
      the unicorn threshold. TechCrunch and Impact News Wire describe active 2026 unicorn creation,
      but their evidence also shows capital concentrating selectively and valuations being tied
      to specific rounds. The bull, base, and bear cases should therefore be expressed as
      diligence conditions around the $1.25 billion mark, not invented revenue multiples,
      probabilities, or return percentages.
    claimRefs: [CV002, CV011, CV012, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-and-diligence
    title: Exit readiness, thesis breaks, and diligence
    body: >-
      The broader private-market exit environment is open but selective: Hurun counted 75 IPO
      graduations and 64 acquisitions or mergers in its 2026 index. That market evidence does
      not establish MGT-specific IPO readiness, sponsor timing, or buyer demand. The investment
      committee should require audited statements, quality-of-earnings work, net debt, the
      capitalization table, Ares security documents, recurring-versus-project revenue, customer
      concentration, and acquisition-cohort returns before setting a target return or hold
      period. Thesis-break triggers are failure to reconcile the headline mark to normalized
      earnings, materially weaker organic growth than company claims, acquisition cohorts that
      do not earn their cost of capital, or preference and leverage terms that leave common
      equity with asymmetric downside.
    claimRefs: [CV011, CV012, CV013, CV016]
    figureRefs: [FV001]
callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: >-
      Treat $1.25 billion as the latest disclosed transaction mark, not established fair value;
      audited economics and financing terms must support both entry price and downside protection.
    claimRefs: [CV002, CV011, CV016]
  - calloutType: risk
    title: Headline capital is not cash available
    body: >-
      The announcement reports a $350 million investment but does not disclose primary proceeds,
      secondary liquidity, debt content, or the preference waterfall.
    claimRefs: [CV001, CV003, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, research-more, "A financing event and headline mark are public; audited economics are not", "Do not approve an investment from public evidence alone"]
      - [Confidence, medium, "Two company-issued reproductions corroborate the transaction, while key terms remain private", "Use primary transaction documents for underwriting"]
      - [Risk rating, medium-high, "Acquisition integration, leverage, customer mix, and preference exposure are unresolved", "Require downside cases and covenant review"]
      - [Valuation stance, stretched/unproven, "$1.25B is a disclosed transaction mark without a public earnings bridge", "Negotiate only after normalized earnings and equity value are verified"]
    notes: "Analyst synthesis as of 2026-10-24; the table distinguishes the disclosed transaction mark from unsupported fair value."
    claimRefs: [CV001, CV002, CV003, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view, Current implication]
    rows:
      - ["Scaled SLED platform", "Company materials report 1,100+ employee-owners and 2,500+ clients", "Audited revenue quality and customer concentration", "Supports diligence, not price"]
      - ["Acquisition engine", "Company materials report 13 acquisitions since 2016 and a tenth acquisition in four years by September 2024", "Cohort returns, integration costs, and post-close retention", "Potential scale advantage with integration risk"]
      - ["Organic growth", "A company job repost states organic CAGR above 20%", "Audited organic bridge excluding acquisitions and price", "Positive if verified"]
      - ["Inorganic growth", "The same job repost states inorganic CAGR above 60% since 2020", "Purchase-price and cash-return analysis by cohort", "Raises capital-intensity questions"]
      - ["Commercial discipline", "A senior role owns pricing, packaging, discounting, margin escalations, and monthly performance updates", "Actual gross margin, backlog conversion, and quote-to-cash data", "Shows process maturity, not achieved profitability"]
    notes: "Growth and scale figures are company-issued claims; no retained source provides an audit opinion or acquisition-cohort return schedule."
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Audited organic growth validates the >20% claim; acquisitions add cash earnings; leverage is moderate", "Value may exceed the $1.25B mark, but no numerical range is supportable yet", "Integration, procurement cycles, sponsor terms", "Unassignable until audited"]
      - [Base, "Scale is real; growth normalizes; project work and integration costs constrain margins", "Use the transaction mark only as a reference and set price from normalized EBITDA and net debt", "Mix, concentration, cash conversion", "Most defensible diligence frame"]
      - [Bear, "Organic growth misses the claim; acquisition returns disappoint; leverage or preferences absorb value", "Common-equity value falls below the transaction headline, with no public floor available", "Refinancing, down-round, delayed exits", "Material downside case"]
      - [Investment gate, "Audited financials, capital structure, preference waterfall, customer mix, and cohort returns are delivered", "Calculate entry multiple, dilution, downside recovery, target return, and hold period", "Information asymmetry", "Required before investment"]
    notes: "Conditional scenarios only; no probability, revenue multiple, EBITDA multiple, target return, or valuation range is invented without private denominator data."
    claimRefs: [CV002, CV011, CV012, CV014, CV015, CV016]
