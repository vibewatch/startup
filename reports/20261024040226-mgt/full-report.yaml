  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative residual ranking based on disclosed exposure and mitigation evidence, with unknowns preserved rather
      than converted into numeric scores.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from assigned evidence, not a measured probability.
        - label: Impact
          detail: Potential consequence to delivery, clients, or investment value.
        - label: Mitigation maturity
          detail: Degree to which controls are evidenced publicly.
        - label: Residual severity
          detail: Remaining exposure after evidenced mitigants.
      rows:
        - label: Acquisition integration
          note: Company-issued job material reports 13 acquisitions since 2020.
          values:
            - label: Medium-high
            - label: High
            - label: Partial
            - label: High
        - label: Complex project delivery
          note: Fresno project combines hardware, licensing, labor, and public-safety infrastructure.
          values:
            - label: Medium
            - label: High
            - label: Moderate
            - label: Medium-high
        - label: Cyber or privacy incident
          note: Sector exposure is independently supported; MGT-specific incident frequency is unavailable.
          values:
            - label: Medium-high
            - label: Critical
            - label: Unverified
            - label: High
        - label: OEM and subcontractor dependency
          note: Role descriptions assign explicit OEM and subcontractor management duties.
          values:
            - label: Medium
            - label: High
            - label: Partial
            - label: Medium-high
        - label: Public procurement conversion
          note: Cooperative vehicle permits multiple vendors and as-needed purchases.
          values:
            - label: Medium
            - label: Medium
            - label: Moderate
            - label: Medium
        - label: Working-capital and margin variance
          note: Project billing and scope terms are visible, but audited company financial data are not.
          values:
            - label: Unknown
            - label: High
            - label: Unverified
            - label: Medium-high
    approximationNotes: >-
      Ordinal labels are analytical judgments; no numeric incident, loss, or default probabilities were available in the
      assigned pool.
    claimRefs:
      - CR002
      - CR006
      - CR009
      - CR014
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The disclosed financing mark starts diligence, while market-exit evidence and missing company economics determine
      whether the process can advance beyond research-more.
    data:
      nodes:
        - id: transaction
          label: Disclosed transaction
          detail: $350M investment; reported $1.25B valuation
        - id: operating-proof
          label: Verify operating proof
          detail: Audited growth, margins, cash conversion, and concentration
        - id: capital-terms
          label: Verify capital terms
          detail: Net debt, security seniority, dilution, and preferences
        - id: scenarios
          label: Rebuild scenarios
          detail: Bull, base, and bear values from verified denominators
        - id: exit
          label: Test exit path
          detail: Buyer set, IPO readiness, sponsor timing, and hold period
        - id: decision
          label: Price-sensitive decision
          detail: Advance only if target return survives the downside case
      edges:
        - - transaction
          - operating-proof
        - - operating-proof
          - capital-terms
        - - capital-terms
          - scenarios
        - - scenarios
          - exit
        - - exit
          - decision
    approximationNotes: Decision sequence only; node widths do not encode value, probability, or confidence.
    claimRefs:
      - CV002
      - CV013
      - CV016
