  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      MGT's documented commercial path runs from public-sector and selected enterprise needs through scoped engagements
      and delivery, with repeat work as the main public quality signal.
    data:
      nodes:
        - id: demand
          label: SLED and selected enterprise needs
          detail: Technology, cyber, education, fiscal, human-capital, and modernization priorities.
        - id: scope
          label: Signed SOWs and service packages
          detail: Scope, pricing, and period of performance are set at project level.
        - id: delivery
          label: Managed services and advisory delivery
          detail: Network, cloud, security, education, fiscal, staffing, and consulting work.
        - id: repeat
          label: Repeat-client work
          detail: Vistria reported 65% of projects obtained from repeat clients in 2023.
        - id: cash
          label: Invoice collection and operating cash
          detail: Payment mechanics are documented; cash conversion and margin are not disclosed.
        - id: margin
          label: Unverified gross profit
          detail: No public service-line gross-margin bridge is available in the assigned evidence.
      edges:
        - from: demand
          to: scope
        - from: scope
          to: delivery
        - from: delivery
          to: repeat
        - from: repeat
          to: cash
        - from: cash
          to: margin
    approximationNotes: >-
      The flow expresses the documented commercial mechanism; it does not infer conversion rates, revenue amounts, gross
      profit, or cash-flow timing.
