      - CI003
      - CI005
      - CI006
  - id: FE001
    title: MGT product architecture map
    type: stack
    summary: >-
      MGT's public delivery model layers SLED advisory work over architecture, partner platforms, implementation, and
      managed outcomes.
    data:
      layers:
        - label: SLED mission and advisory
          detail: Customer problem framing and solution design for public-sector priorities.
          modules:
            - label: Public-sector problem framing
