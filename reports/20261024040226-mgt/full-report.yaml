chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              MGT presents itself as a national technology and advisory solutions provider for state, local, and
              education government agencies, with a stated social-impact orientation around education systems, public
              services, and economic growth (CO001, CO002). An independent company profile places the business in Tampa,
              Florida and describes a national SLED focus with selected commercial accounts (CO003). The operating model
              is service-led rather than a narrowly defined single-product SaaS model: the available role materials
              describe critical network management and security, human-capital and fiscal problem solving, education
              systems, physical security, cloud and data architecture, pricing, delivery, and vendor relationships
              (CO004, CO005). This breadth can support cross-selling and mission-critical relevance, but it also makes
              segment economics and recurring revenue quality difficult to infer from public materials alone.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO009
              - CO012
              - CO013
      - number: '1.2'
        title: Leadership, scale, and capabilities
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not provide a complete founder, executive, or board roster. It does show an
              organization that describes itself as having almost 1,200 employees and serving thousands of agencies,
              while a separate profile places the firm in the 501–1,000 employee band (CO006, CO007). The difference is
              a useful disclosure signal rather than a number to reconcile by assumption: the dates, definitions, and
              inclusion rules are not disclosed. MGT's job materials also describe a technical-commercial operating
              layer in which senior architects own solution groups, pricing and packaging, complex pursuits, OEM
              relationships, subcontractors, delivery feasibility, and customer handoffs (CO008). That supports
              meaningful functional coverage, but the lack of named governance evidence leaves key-person dependence,
              board rights, and leadership continuity unresolved.
            claimRefs:
              - CO006
              - CO007
              - CO008
