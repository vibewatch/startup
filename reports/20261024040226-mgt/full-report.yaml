  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not generic management consulting. It is the set of technology, implementation,
              managed-service, and advisory purchases made by state, local, and education agencies, with a limited
              adjacent commercial segment. MGT's 2024 company release describes a unified platform spanning
              cybersecurity, IT infrastructure, human capital, fiscal, and operational improvement, while the
              Massachusetts Municipal Association listing describes network infrastructure, cybersecurity, managed
              technology services, human capital, operations, and financial solutions. The practical boundary therefore
              includes outsourced specialist delivery and implementation around public agency missions, while excluding
              general government operating budgets, telecommunications resale unrelated to managed delivery, and all
              commercial consulting outside MGT's targeted adjacency. The status quo is internal agency staff plus
              fragmented specialist vendors, with procurement vehicles and competitive bidding shaping how a bundled
              provider can win. MGT's about page frames the intended outcomes as improving education, maximizing public
              financial resources, and creating resilient IT environments.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and demand drivers
        blocks:
          - type: paragraph
            body: >-
              A defensible market-size conclusion must use several lenses rather than one broad technology-spend number.
              The evidence supports a service-category lens: MGT reports more than 30,000 client engagements and a
              portfolio spanning technology modernization, cybersecurity, education transformation, human capital, and
              fiscal and operational improvement, but those are company activity indicators rather than market totals. A
              budget-channel lens is more concrete for education technology: the FCC states that E-Rate funding is
              demand-based up to a $3.9 billion annual Commission-established cap, with discounts from 20% to 90% for
              eligible services and equipment. A procurement lens is also material because NASPO ValuePoint describes
              nationally leveraged contracts that reduce procurement burden. These sources indicate reachable demand
              pools and adoption mechanisms, not MGT revenue opportunity; SAM and SOM remain unisolated because
              geography, eligibility, contract share, pricing, and service mix are not disclosed.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer segmentation and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer is typically a public agency or education-system leadership team, while users and budget owners
              differ by workflow. USAC's E-Rate process requires eligible schools and libraries to create an account,
              conduct competitive bidding, select service providers, apply for discounts, and complete review and
              invoicing; this makes program compliance and procurement execution part of the product value proposition.
              MGT's Cloud and Data Chief Architect posting shows the commercial motion: complex pursuits involve
              executive presentations, scoping, pricing, procurement vehicles, OEM relationships, and delivery-risk
              review. GovSpend's account of the MS-ISAC's shift to fee-based membership shows an adverse timing
              constraint: SLED cybersecurity buyers can face changing grant and shared-service funding models. Adoption
              is therefore driven by mission risk, capability gaps, and eligible funding, but slowed by competitive
              bidding, compliance, budget ownership, switching risk, and uncertain recurring-versus-project economics.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reachable market is procurement-constrained
            body: >-
              MGT's opportunity is better framed as a set of recurring SLED buying workflows and contract channels than
              as a single disclosed market-size number. The evidence supports demand, but not a company-specific share
              calculation.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM009
          - type: callout
            title: Numeric sizing remains an evidence gap
            body: >-
              The assigned sources do not isolate MGT's eligible geography, serviceable contract universe, win rate,
              pricing, or recurring mix, so any precise TAM, SAM, or SOM figure would be unsupported.
            calloutType: risk
            claimRefs:
              - CM008
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              MGT's competitive set is unusually heterogeneous. Tracxn identifies EY, Elm, and Deloitte as top
              competitors, while its longer list includes ZS, McKinsey, PwC, Cognizant, and Teneo; this is a discovery
              signal, not a proof that every firm bids for the same contract. Tyler Technologies is a more direct
              public-sector technology comparator because it sells software and services to federal, state, county,
              municipal, and education agencies. Sourcewell shows another substitute: cooperative purchasing that gives
              public employees local dealer access with national buying power. The status quo also includes agency
              staff, incumbent contractors, and internal procurement vehicles. MGT's job description describes
              procurement-vehicle management, OEM relationships, subcontractors, and large pursuits, supporting a
              channel-and-integration model rather than a closed software platform. Unsupported competitor pricing, win
              rates, switching costs, and customer overlap remain unknown.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: Profiles, scale, and strategic direction
        blocks:
          - type: paragraph
            body: >-
              The available evidence differentiates competitors by operating model more reliably than by like-for-like
              revenue. MGT's own newsroom release describes a unified platform built after more than ten acquisitions
              and lists cybersecurity, IT infrastructure, human capital, fiscal, and operational improvement as solution
              areas. A contemporaneous MGT job posting says the company combines cloud, data, infrastructure, security,
              pricing, OEM relationships, and presales ownership in one practice role. Tyler is a scaled public-sector
              software incumbent: the prefetched company profile reports 2025 revenue of $2.332 billion and 7,800
              employees, while Macrotrends describes subscription, services, maintenance, appraisal, and hardware
              revenue streams. Tracxn reports MGT's $350 million funding and a 791-employee count as of September, but
              the page does not establish audited comparability with Tyler's public figures. MGT's scale, funding, and
              customer concentration therefore require private verification.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.3'
        title: Capability, pricing, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              The buyer's decision appears to be governed by capability coverage, procurement access, implementation
              confidence, security posture, and delivery economics. MGT's role description explicitly assigns pricing
              and packaging, discount escalation, solution design, OEM relationships, subcontractor management, and
              customer-facing pursuit leadership to its practice; that supports a flexible services-and-solutions
              proposition but does not disclose realized prices or margins. Tyler offers a contrasting productized model
              centered on public-sector applications and cloud delivery, but the retained secondary record also
              describes historical rollout disputes and litigation settlements, so scale should not be treated as
              equivalent to implementation trust. Sourcewell documents that cooperative contracts can save time and
              money and preserve local dealer access, making procurement convenience a substitute for a national
              integrator. NIST's CSF 2.0 and CISA ransomware guidance indicate that security controls and resilience are
              baseline buying requirements, not differentiators proven by generic marketing language.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP007
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              MGT's plausible moat is cumulative public-sector context, acquisition-built specialist coverage,
              trusted-adviser relationships, and the ability to assemble OEMs and subcontractors around complex
              procurements. The same model creates integration and commoditization risks: large firms can bundle
              advisory and technology services, public-sector software vendors can own workflows and data, cooperative
              purchasing can lower search and contracting friction, and agencies can retain internal teams for routine
              work. MGT's sources provide evidence of breadth and acquisition activity, but not contract renewal rates,
              bid win rates, gross margins, backlog, customer concentration, or switching costs. Tyler's public scale
              and acquisition history show that an incumbent can compound distribution and product depth; the adverse
              implementation evidence in the retained Tyler record is a reminder that incumbent scale does not eliminate
              execution risk. A durable advantage is therefore plausible but unproven.
            claimRefs:
              - CP016
              - CP019
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence gap in competitive underwriting
            body: >-
              The assigned pool does not establish MGT's realized pricing, bid win rate, renewal rate, customer
              concentration, or switching costs; these are material gaps before concluding that acquisition breadth is a
              durable moat.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP016
              - CP019
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and customer economics
        blocks:
          - type: paragraph
            body: >-
              MGT's public materials describe a services platform rather than a single-metric software model. The
              company sells managed technology, cybersecurity, cloud, fiscal, human-capital, education, and advisory
              work to state, local, and education customers, with selected enterprise activity. A 2023 investor
              announcement says 65% of projects obtained were from repeat clients and describes a base of recurring
              revenue, but it does not quantify recurring revenue as a percentage of total revenue or distinguish
              subscriptions from recurring managed-services contracts. The 2025 Pasco County agreement makes project
              scope, pricing, and period of performance dependent on separately signed statements of work, which is
              consistent with a multi-engagement professional-services model. The evidence therefore supports
              customer-retention quality signals, not a verified ARR or net-retention figure.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
      - number: '4.2'
        title: Pricing, delivery, and margin drivers
        blocks:
          - type: paragraph
            body: >-
              Pricing is negotiated at the statement-of-work level rather than published as a standard list-price
              catalog. The Pasco agreement states that each SOW includes scope, pricing, and period of performance, and
              its payment terms make undisputed invoices payable upon receipt, permit interest of the lesser of 1.5% per
              month or the legal maximum after 30 days, and allow work stoppage after 60 days of non-payment. The
              attached proposal also shows that one school engagement can use either a fixed-fee transformation model or
              an external-operator model with a material performance holdback. Separately, an MGT job posting says
              solution leaders own pricing and packaging and support discount and margin escalations. Those facts
              indicate pricing discipline and receivables protections, but they do not reveal realized rates,
              utilization, delivery gross margin, subcontractor costs, or customer-level contribution margin. The key
              financial risk is limited visibility into how mix and execution convert bookings into cash earnings.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              MGT's latest public financing announcement reports a $350 million investment from Ares Credit funds at a
              $1.25 billion company valuation and says the capital expands capacity for larger acquisitions. The same
              release describes MGT as midway through a four-year value-creation plan after Vistria's majority
              investment and attributes growth to programmatic M&A, organic growth, and business transformation. This is
              evidence of institutional financing and an acquisition strategy, not evidence of unrestricted cash
              available to the operating business. The public record reviewed here does not disclose cash on hand, cash
              burn, debt principal versus preferred or equity proceeds, interest rate, maturity, covenants, minimum
              liquidity, acquisition commitments, or the next financing trigger. Consequently, capital adequacy cannot
              be scored from headline funding alone; lender documentation and current management accounts are required.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial profile is promising but under-disclosed. Positive signals include a repeat-project rate
              reported by Vistria, a broad service portfolio, public evidence of pricing and margin ownership inside the
              commercial organization, and institutional capital explicitly linked to acquisitions and a value-creation
              plan. Counterweights are material: public sources do not provide audited income statements, revenue
              reconciliation, gross-margin bridge, customer concentration, backlog quality, working-capital needs,
              utilization, CAC or payback, cash runway, or financing covenants. Company and partner releases also
              combine revenue-growth language with operating scale and valuation claims, so each metric must retain its
              issuer and period rather than be treated as independently verified. The appropriate stance is
              research-more until financial statements, debt documents, cohort data, and contract economics are
              available.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Repeat work is the strongest public revenue-quality signal
            body: >-
              Vistria reported that 65% of projects obtained were from repeat clients, but the denominator and dollar
              share are not disclosed.
            calloutType: strength
            claimRefs:
              - CI003
          - type: callout
            title: Financing headline is not liquidity evidence
            body: >-
              The $350 million Ares investment and $1.25 billion valuation do not establish cash available, debt terms,
              burn, or runway.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
          - type: callout
            title: Underwrite only after private financial diligence
            body: >-
              Require audited statements, service-line margins, cash flow, customer cohorts, and credit documents before
              treating growth or valuation as investable financial performance.
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              MGT's customer-facing product is best understood as a portfolio of technology-enabled services rather than
              a single packaged application. Its official site describes technology and advisory solutions for improving
              education systems, optimizing public services, and supporting economic growth, while the 2024 company
              announcement groups the offer into cybersecurity, IT infrastructure, human capital, fiscal and operational
              improvement, and education transformation. This breadth gives a public agency one contracting relationship
              for problem diagnosis, implementation, and managed support, but it also makes product-level comparability
              difficult. The available public material does not disclose standard SKUs, list prices, service-level
              objectives, implementation cycle times, or customer-level outcome denominators. A buyer diligence process
              should therefore separate repeatable managed services from project-based advisory work and test whether
              the unified brand has produced common delivery controls rather than only common marketing.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Public recruiting material provides the clearest view of how MGT delivers technology. A Cloud and Data
              Chief Architect role combines customer-facing pursuit leadership with offering definition, pricing and
              packaging, reference architectures, vendor relationships, subcontractor management, and continuity into
              project startup. Its technical scope spans on-premises, hybrid and public cloud, storage and backup,
              infrastructure as code, observability, ITSM/CMDB integration, identity and access controls, encryption,
              and regulated hosting frameworks. A separate solutions-architect posting describes site surveys, network
              and power calculations, bills of materials, multi-site designs, commissioning, and subcontractor
              coordination for physical security. Together these sources indicate an architecture-led
              systems-integration model with substantial implementation labor and partner dependencies. They do not
              prove that every listed technology is an MGT-owned product, nor do they establish production scale,
              standardization, or realized gross margins.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE011
              - CE014
      - number: '5.3'
        title: Differentiation, integrations, and roadmap
        blocks:
          - type: paragraph
            body: >-
              MGT's stated differentiation is the combination of SLED domain access, advisory expertise, implementation
              capability, and a growing partner ecosystem. The 2024 announcement says acquisitions were integrated into
              one online platform and names capabilities including cybersecurity, IT infrastructure, education
              performance, and human capital. In March 2026, MGT, Protopia AI, and HPE announced an AI Experience Center
              built on HPE Private Cloud AI, NVIDIA infrastructure and software, and Protopia's privacy-preserving
              inference technology. The announcement describes segmented development, testing, and production
              environments, policy enforcement, auditability, and use cases such as workflow automation,
              curriculum-grounded student support, and educator assistance. These are partnership and roadmap signals,
              not independent evidence that the center has converted pilots into recurring production deployments. The
              diligence question is whether MGT owns reusable IP and operating playbooks or primarily integrates
              third-party platforms for each engagement.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Trust, security, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              MGT's public AI announcement explicitly positions privacy, local control, governance, policy enforcement,
              and auditability as requirements for public-sector deployment. NIST's Cybersecurity Framework 2.0 provides
              an external governance reference for reducing cybersecurity risk, but it is not evidence that MGT conforms
              to the framework. The public materials reviewed do not provide an MGT SOC 2 report, FedRAMP or other
              certification, penetration-test summary, incident history, uptime commitment, data retention policy, or
              quantified support performance. Public recruiting evidence also points to OEM certification tracking,
              delivery feasibility checks, and subcontractor reliance, which are operational controls to test rather
              than verified outcomes. Implementation risk is consequently concentrated in integration quality, partner
              and subcontractor execution, public-sector privacy obligations, and the ability to turn bespoke
              architectures into repeatable managed services. Investors should request customer references, security
              artifacts, incident logs, SLOs, and acceptance criteria before treating the roadmap as mature product
              evidence.
            claimRefs:
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated SLED delivery breadth
            body: >-
              MGT combines public-sector domain expertise with architecture, implementation, advisory, and
              managed-solution capabilities across multiple mission areas.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: AI is a partnership-led product bet
            body: >-
              The AI Experience Center is a concrete 2026 productization signal, but the disclosed evidence identifies
              partner technologies and intended use cases rather than independently verified production scale.
            calloutType: insight
            claimRefs:
              - CE011
              - CE012
              - CE013
          - type: callout
            title: Operating evidence is thinner than architecture claims
            body: >-
              Public sources describe controls, roles, and partner designs but do not establish security certifications,
              uptime, incident performance, or repeatable customer outcomes.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              MGT's customer surface is concentrated in state, local, and education agencies, while third-party profiles
              also describe targeted commercial accounts. The available evidence points to a multi-stakeholder
              public-sector buying motion: executives and program leaders set priorities, finance and procurement
              control defensibility, and IT, security, and legal validate implementation and risk. MGT's cloud-and-data
              practice role explicitly assigns senior leaders to customer pursuits, pricing, procurement vehicles,
              executive briefings, and delivery handoff, which is consistent with complex consultative sales rather than
              a self-serve product motion. Cooperative vehicles can widen access to public buyers, but holding a vehicle
              does not by itself establish awarded volume or repeat purchasing. The segment mix is therefore
              strategically attractive but operationally dependent on long procurement cycles, reference quality, and
              proof that projects become durable production relationships. Independent market evidence adds two
              qualifications. Capstone reported comparatively resilient SLED technology demand, while current StateScoop
              and EdScoop coverage shows that customer agendas span AI, accessibility, cloud, privacy, and cybersecurity
              rather than a single homogeneous need. Those demand signals support the breadth of MGT's addressable
              customer problems, but neither source demonstrates MGT-specific wins.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU015
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU015
              - CU016
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              Publicly available evidence shows several adoption surfaces, but not a complete customer funnel. MGT was
              reported to have performed early advisory work for the Memphis-Shelby County Schools takeover, with a
              proposed six-month contract circulated at $1 million but not officially approved at the time of reporting.
              Separately, the company announced an AI Experience Center with Protopia AI and HPE that is intended to
              help SLED agencies move from experimentation to production, including managed-service or
              customer-replicated deployment options. These are meaningful indicators of customer-facing activity and
              expansion design, not proof of realized recurring revenue, utilization, renewal, or net retention. A job
              description also says the firm partners with thousands of agencies, but that company-authored statement
              lacks a disclosed denominator, period, or reconciliation to active customers. Durability should therefore
              be treated as an unresolved diligence question rather than inferred from logos, pipeline language, or a
              proposed engagement.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named customer proof and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The strongest named proof is public-sector work tied to Memphis-Shelby County Schools, Houston public
              schools, and Adams 14 in Colorado, but the evidence quality differs materially across those examples.
              Memphis and Houston show advisory involvement or claimed precedent; they do not establish a completed
              production deployment, outcome, or renewal. Adams 14 is a completed engagement with a disclosed contract
              value and a later dispute, external criticism, and settlement, making it both customer proof and adverse
              evidence. The AI Experience Center announcement supplies partner and use-case proof but names no paying
              district or agency. Taken together, the record supports a differentiated route into high-consequence
              public-sector workflows while leaving customer concentration, referenceability, delivery consistency, and
              expansion economics unverified. Management should provide a customer cohort and contract-level bridge
              before relying on broad agency-partnership claims.
            claimRefs:
              - CU001
              - CU007
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU007
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-sector access is demonstrable
            body: >-
              Named education engagements and a partner-backed AI Experience Center show MGT can enter complex
              public-sector workflows and package services with major technology partners.
            calloutType: strength
            claimRefs:
              - CU005
              - CU010
              - CU011
          - type: callout
            title: Durability and concentration remain opaque
            body: >-
              No assigned source discloses audited active customers, cohort retention, recurring versus project revenue,
              top-customer concentration, or renewal rates; the Adams 14 record also shows that delivery outcomes can be
              contested.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
          - type: callout
            title: Require a customer-level evidence pack
            body: >-
              Request a contract-level customer bridge with active status, ARR or project value, renewal dates, gross
              retention, expansion, concentration, reference permissions, and outcome measures by named deployment.
            calloutType: recommendation
            claimRefs:
              - CU007
              - CU008
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is execution rather than a verified legal event. A current City of Fresno
              agreement packages roughly $2.08 million of Cisco hardware, software, support, and MGT labor into one
              public-safety technology engagement, while MGT-issued job material describes an acquisition-led model,
              strategic OEM relationships, subcontractors, and complex solution delivery. Those facts make integration,
              scoping, staffing, and handoff quality central underwriting questions. Contractual insurance, project
              controls, and defined support processes mitigate loss severity, but the assigned public evidence does not
              show actual SLA performance, implementation overruns, warranty claims, or acquisition-cohort outcomes. The
              investment implication is to condition confidence on project-level delivery and integration data rather
              than equating scale or certifications with execution quality.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR014
              - CR015
      - number: '7.2'
        title: Legal, regulatory, and cyber exposure
        blocks:
          - type: paragraph
            body: >-
              MGT operates where technology delivery intersects public procurement, privacy, security, licensing, and
              service continuity. Fresno's agreement requires technology professional liability and cyber coverage,
              allows work to stop if required insurance lapses, and places broad indemnity obligations on the vendor.
              These provisions evidence risk transfer, not proof that losses or incidents have not occurred.
              Independently, CIS describes SLTT entities as needing continuous monitoring, threat intelligence, and
              incident response, reinforcing the consequence of failure for MGT's government and education clients. A
              2026 stablecoin rulemaking update is retained only as an adjacent regulatory-change boundary; the pool
              contains no evidence that MGT is a payment-stablecoin issuer or directly subject to that proposed regime.
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR011
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR013
              - CR014
              - CR016
      - number: '7.3'
        title: Partner, procurement, and commercial dependencies
        blocks:
          - type: paragraph
            body: >-
              The delivery model depends on upstream manufacturers, contract vehicles, field resources, and customer
              readiness. The Fresno quote is heavily tied to Cisco products and support, while MGT-issued role
              descriptions assign leaders responsibility for OEM roadmaps, vendor escalation, subcontractor capacity,
              site surveys, bills of materials, and multi-site execution. Fresno's terms also make delivery dates
              approximate, constrain returns, and allow additional customer cost when site assumptions fail. Cooperative
              procurement can shorten sales friction, but the underlying solicitation permits multiple vendors and
              as-needed purchases, limiting exclusivity. Investors should monitor OEM concentration, subcontracted labor
              share, backlog conversion, change orders, and customer-caused delays by project.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR013
              - CR014
      - number: '7.4'
        title: Financial exposure, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Public evidence is insufficient to quantify burn, working-capital needs, project gross margin, insurance
              recoverability, debt covenants, or customer concentration. The current Fresno project illustrates why
              these omissions matter: hardware can be invoiced on warehouse receipt, labor is progress billed, and
              delays or scope deviations may shift timing and costs. That is not evidence of distress, but it creates
              cash-conversion and margin sensitivity that should be reconciled to audited statements and project
              cohorts. Thesis breaks should include a material uninsured cyber event, repeated public-sector SLA
              failure, loss of a critical OEM authorization, acquisition cohorts missing retention or margin plans, or
              customer concentration that breaches lender or investment limits. Until those data are produced, residual
              risk remains medium-high and the correct posture is diligence-gated.
            claimRefs:
              - CR002
              - CR004
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence-gated risk posture
            body: >-
              Do not treat the lack of a documented incident in this source pool as evidence that no incident occurred.
              Require claims, litigation, cyber-event, SLA, concentration, and acquisition-cohort records before
              reducing residual risk.
            calloutType: risk
            claimRefs:
              - CR010
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price context
        blocks:
          - type: paragraph
            body: >-
              The public record supports institutional validation, not a price-insensitive investment. MGT announced
              that Ares invested $350 million in December 2025 at a reported $1.25 billion valuation, while naming The
              Vistria Group, J.P. Morgan, and WhiteHorse Capital as existing backers. Those facts establish a financing
              event and headline mark, but the announcement does not expose security seniority, the
              primary-versus-secondary split, ownership acquired, liquidation preferences, or a bridge from enterprise
              value to common-equity value. Public evidence therefore supports a research-more recommendation, medium
              confidence, medium-high underwriting risk, and a stretched/unproven valuation stance. A buy decision
              requires both audited operating denominators and investor-specific return terms.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is a scaled SLED technology and advisory platform with mission-critical demand, acquisition
              capacity, and operating infrastructure that appears more developed than a typical early-stage services
              business. Company-issued materials report more than 1,100 employee-owners, over 2,500 clients, 13
              acquisitions since 2016, enterprise value tripling after Vistria's April 2023 majority investment, and
              organic and inorganic growth claims above 20% and 60%, respectively. A current recruiting document also
              assigns senior staff responsibility for pricing, discount and margin escalations, and monthly performance
              reporting. The anti-thesis is that these are company claims rather than audited results; acquisition-led
              scale can obscure organic quality, integration cost, leverage, and cash conversion.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario framework and benchmark limits
        blocks:
          - type: paragraph
            body: >-
              A numerical fair-value range is not supportable from this evidence set. Hurun's methodology uses the most
              recent sizeable financing round and turns to industry comparables when a company may be underperforming,
              illustrating why a private mark is an estimate rather than a continuously tested market price. Its 2026
              index also recorded 88 companies falling below the unicorn threshold. TechCrunch and Impact News Wire
              describe active 2026 unicorn creation, but their evidence also shows capital concentrating selectively and
              valuations being tied to specific rounds. The bull, base, and bear cases should therefore be expressed as
              diligence conditions around the $1.25 billion mark, not invented revenue multiples, probabilities, or
              return percentages.
            claimRefs:
              - CV002
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, thesis breaks, and diligence
        blocks:
          - type: paragraph
            body: >-
              The broader private-market exit environment is open but selective: Hurun counted 75 IPO graduations and 64
              acquisitions or mergers in its 2026 index. That market evidence does not establish MGT-specific IPO
              readiness, sponsor timing, or buyer demand. The investment committee should require audited statements,
              quality-of-earnings work, net debt, the capitalization table, Ares security documents,
              recurring-versus-project revenue, customer concentration, and acquisition-cohort returns before setting a
              target return or hold period. Thesis-break triggers are failure to reconcile the headline mark to
              normalized earnings, materially weaker organic growth than company claims, acquisition cohorts that do not
              earn their cost of capital, or preference and leverage terms that leave common equity with asymmetric
              downside.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              Treat $1.25 billion as the latest disclosed transaction mark, not established fair value; audited
              economics and financing terms must support both entry price and downside protection.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV011
              - CV016
          - type: callout
            title: Headline capital is not cash available
            body: >-
              The announcement reports a $350 million investment but does not disclose primary proceeds, secondary
              liquidity, debt content, or the preference waterfall.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV016
