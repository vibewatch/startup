            - label: Solution design
              detail: Customer discovery, scope, procurement, and executive technical guidance.
        - label: Architecture and governance
          detail: Technical design and control requirements before implementation.
          modules:
            - label: Cloud and data architecture
              detail: Hybrid cloud, storage, backup, migration, automation, observability, and ITSM.
            - label: Security and privacy controls
              detail: IAM, encryption, segmentation, policy enforcement, auditability, and privacy-preserving inference.
        - label: Partner technology
          detail: OEM and specialist platforms used to extend MGT delivery capability.
          modules:
            - label: OEM and platform ecosystem
              detail: HPE Private Cloud AI, NVIDIA infrastructure/software, Protopia AI, and other OEM relationships.
            - label: Privacy-preserving inference
