      - CE014
  - id: FU001
    title: Customer journey from public-sector priority to expansion
    type: journey-map
    summary: >-
      MGT's observable customer motion runs from mission priority and procurement validation through technical delivery
      and potential production expansion, with proof and durability gaps at each transition.
    data:
      nodes:
