chapter:
  number: 4
  title: Financials
  summary: COOWA presents as a commercially active urban-robotics operator, but the assigned public evidence does not disclose audited revenue quality, margins, cash, burn, or unit economics. Sector benchmarks indicate strong demand and intense capital competition; underwriting therefore depends on obtaining company-level financial statements and contract data.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and disclosed traction
    body: >-
      COOWA's public positioning is an embodied-AI and urban-service robotics business spanning mobility, manufacturing, and property-service environments. The assigned company dossier reports more than 10,000 units deployed across more than 50 global cities and more than RMB 1bn of 2025 revenue, but the dossier does not identify audited revenue, revenue recognition policy, product mix, contract duration, or the denominator behind the deployment count. That distinction matters: deployed units are an operating-footprint indicator, not a recurring-revenue measure, and reported revenue is not ARR. A separate industry report says COOWA reported 2025 revenue above RMB1bn and profitability and describes a May 2026 funding round above US$600m at a US$3bn valuation; those are externally reported company-level assertions, not independently audited statements in this pool. No retained source supplies list pricing or realized price by robot, service contract, location, or outcome-based engagement. The financial case is therefore best framed as potentially substantial but insufficiently decomposed.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Urban robotics economics are likely driven by hardware bill of materials, autonomy and software development, deployment labor, maintenance, fleet operations, connectivity, charging, and customer-specific integration. The retained evidence does not quantify any of those components for COOWA, nor does it disclose gross margin, contribution margin, utilization, service hours, maintenance incidence, warranty cost, replacement cycle, CAC, sales cycle, payback, or customer concentration. The appropriate comparison is not a generic SaaS margin model: official list pricing, if later located, would still not establish realized revenue or margin. A sector benchmark reports RMB26.1bn of 2025 Chinese AGV/AMR sales and 182,000 units, while 44 companies had orders above RMB100m; this supports market scale and competitive density, not COOWA's economics. The absence of company-level unit economics is a material underwriting gap rather than evidence of poor performance.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital adequacy and underwriting verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      The assigned evidence does not disclose COOWA cash on hand, cash burn, runway, debt, project-finance obligations, restricted cash, planned use of funds, or the financing trigger for the next round. A reported US$600m-plus financing and US$3bn valuation would describe financing scale and an implied valuation only if the report's figures and terms are confirmed; they do not establish cash available after transaction costs, investor restrictions, operating burn, or post-money ownership. Sector reporting records US$3.3bn invested across 126 Chinese robotics deals in Q1 2026, while separate coverage says many Chinese embodied-AI companies have only 18–24 months of runway and may face consolidation or down-round pressure in 2027–2028. Those are capital-market risk benchmarks, not a COOWA runway estimate. Peer filings and market coverage show that robotics companies can require substantial capital for research, manufacturing, and commercialization. COOWA should not be underwritten on funding raised or headline valuation alone. The financial verdict is track/research-more: commercial traction appears plausible, but revenue quality, margin path, liquidity, and financing dependency remain unverified.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI015]

