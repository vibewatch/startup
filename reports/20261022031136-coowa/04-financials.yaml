      - [Outcome-based contract, "No contract example retained", "Potentially tied to sanitation, mobility, or logistics outcomes", "Unknown", "Request representative redacted contracts and revenue-recognition memo"]
      - [Maintenance and support, "No published rate retained", "Unknown", "Unknown", "Request warranty, service, spare-parts, and renewal economics"]
    notes: "The assigned pool contains no COOWA pricing page or customer contract. Do not infer realized pricing or margin from sector market size or funding."
    claimRefs: [CI004, CI007, CI008]
  - id: TI003
    title: Unit-economics underwriting checklist
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue per deployed unit, null, low, "Separates fleet scale from monetization", "Reconcile active paid units, contract revenue, and deployment cohort"]
      - [Gross margin, null, low, "Tests hardware and service cost absorption", "Provide audited gross margin by product and service line"]
      - [Utilization, null, low, "Determines revenue productivity and payback", "Provide fleet hours, uptime, and utilization by cohort"]
      - [CAC and sales cycle, null, low, "Tests scalability of municipal and enterprise GTM", "Provide pipeline conversion, sales expense, and signed-to-live timing"]
      - [Maintenance cost per unit, null, low, "Tests lifecycle contribution margin", "Provide warranty claims, spare-parts, labor, and service logs"]
      - [Cash runway, null, low, "Tests financing dependency", "Provide monthly cash balance, burn, debt schedule, and base-case runway"]
      - [Customer concentration, null, low, "Tests renewal and counterparty risk", "Provide top-10 customer revenue and contract expiry schedule"]
      - [Payback period, null, low, "Tests whether deployments scale without repeated subsidies", "Provide cohort-level contribution payback under realized pricing"]
    notes: "Null means unavailable in the assigned successful prefetched evidence, not zero. Each missing metric requires company data before underwriting."
    claimRefs: [CI005, CI006, CI009, CI010, CI011, CI012]

