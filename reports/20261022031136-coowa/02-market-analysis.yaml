  - id: TM002
    title: Evidence-constrained market sizing lenses
    columns: [Publisher, Year, Geography, Value, CAGR or growth, Methodology, Confidence, Limitation]
    rows:
      - [International Federation of Robotics, "2025 report on 2024 data", Global sample, "Almost 200,000 professional service robots sold", "9% unit growth", "Sample of 294 service-robot suppliers", High, "Not projected to whole industry; categories include workflows outside COOWA"]
      - [International Federation of Robotics, "2025 report on 2024 data", Global sample, "102,900 transportation/logistics robots; >25,000 professional cleaning robots", "Transportation RaaS +42%; cleaning +34%", "Application-class unit reporting", High, "Sample composition varies; not a COOWA revenue pool"]
      - [SiliconANGLE citing MarketsandMarkets, 2025 estimate, Global, "$4.5B embodied-AI market", "Projected $23.1B by 2030", "Third-party market estimate as reported by article", Medium, "Underlying methodology and overlap with service robotics not reproduced"]
      - [AIN China, 2026 article, China, "$3.3B robotics startup funding in Q1; 126 deals", "Q1 funding flow", "Reported compilation of Crunchbase and other sources", Medium, "Funding is not customer spend or ARR"]
      - [ChinaBizInsider, 2026 article, China, ">RMB46B disclosed embodied-AI funding in H1", "H1 capital formation", "Article's sector compilation", Medium, "Valuation/funding concentration is not market demand"]
    notes: >-
      Values use the source's units, period, geography, and qualifiers. These are
      alternative lenses, not additive TAM/SAM/SOM layers. No public source in the
      assigned pool isolates COOWA's serviceable obtainable market or contract
      pipeline.
    claimRefs: [CM004, CM005, CM006, CM007, CM008]
  - id: TM003
    title: Buyer and adoption map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger]
    rows:
      - [Property services, Property-management group, Site operations team, Facilities or property budget, Cleaning and routine site service, Labor shortage plus measurable service-level improvement]
      - [Municipal sanitation, City or sanitation contractor, Fleet and route operators, Public-services or contractor budget, Street cleaning and public-space maintenance, Tender requirement plus safety approval]
      - [Logistics and delivery, Logistics operator or site owner, Dispatch and warehouse teams, Operations or logistics budget, Last-mile or site delivery, Payback against labor and reliability baseline]
      - [Shared mobility, Mobility operator or city agency, Fleet operations team, Mobility or transport budget, Autonomous shuttle or shared mobility service, Approved operating domain and utilization evidence]
      - [Industrial service, Factory or industrial-site operator, Facilities and production support, Facilities or plant budget, Material movement and site tasks, Integration with site systems and maintenance coverage]
    notes: >-
      Buyer roles are an analytical segmentation inferred from the documented
      application classes and COOWA's described deployments; the assigned sources
      do not disclose COOWA contract-level budget ownership or conversion rates.
    claimRefs: [CM001, CM002, CM009, CM010]
figures:
  - id: FM001
    title: Market sizing lenses, not additive TAM
    type: pyramid
    summary: >-
      Six evidence lenses move from broad professional service-robot activity to
      the narrower COOWA-relevant opportunity, with the final layers intentionally
      qualitative because public evidence does not isolate COOWA's SAM or SOM.
    data:
      nodes:
        - id: broad
          label: Global professional service robotics
          value: "Almost 200,000 units sold in 2024"
          valueNote: "IFR sample; not projected to the whole industry"
        - id: category
          label: Embodied-AI market estimate
          value: "$4.5B in 2025; $23.1B projected in 2030"
          valueNote: "Third-party estimate reported by SiliconANGLE; methodology not reproduced"
        - id: serviceable
          label: COOWA-relevant urban and commercial workflows
          value: "No public SAM/SOM value disclosed"
          valueNote: "Constrained to eligible cities, contracts, workflows, and approvals"
        - id: obtainable
          label: COOWA obtainable share
          value: "Not disclosed"
          valueNote: "Requires contract pipeline, utilization, pricing, and capacity evidence"
        - id: units
          label: Professional service-robot unit lens
          value: "102,900 transport/logistics units in 2024"
          valueNote: "IFR sample category; not COOWA-specific"
        - id: cleaning
          label: Professional cleaning unit lens
          value: ">25,000 units in 2024"
          valueNote: "IFR sample category; not COOWA-specific"
    claimRefs: [CM004, CM005, CM006, CM009]
    approximationNotes: >-
      The pyramid is a presentation of alternative scope lenses, not a mathematically
      nested or value-proportional TAM/SAM/SOM calculation. The final two layers
      are explicitly evidence gaps rather than estimated dollar amounts.
callouts:
  - calloutType: insight
    title: Commercial market, not merely a technology market
    body: >-
      The strongest market signal is the combination of recurring service workflows
      and a growing RaaS purchasing model; category funding and headline valuations
      should not be substituted for customer spend.
    claimRefs: [CM004, CM009, CM010]
  - calloutType: risk
    title: Sizing and timing remain decision-critical gaps
    body: >-
      Public evidence does not disclose COOWA's SAM, SOM, contract conversion,
      utilization, or workflow-level margins, while safety rules and capital-cycle
      pressure can delay deployments.
    claimRefs: [CM011, CM012, CM013]
