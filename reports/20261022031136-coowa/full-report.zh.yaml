        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              后果最严重的风险是政策与技术获取。Mayer Brown 描述了一项 2026 年 1
              月美国规则：部分先进芯片申请改为逐案审查，并新增技术、客户、远程终端用户和物理安全认证；同一分析称政策仍在变化。对中国城市机器人运营商而言，这可能使进口算力、零部件或海外部署产生依赖风险，但保留来源没有列出
              COOWA 的物料清单。第二项风险是行业融资和商业化：ChinaBizInsider 称许多具身 AI 初创公司现金续航仅 18–24 个月，2027–2028 年可能面临整合、下轮融资或失败。这是行业证据，不是
              COOWA 的现金续航测量。
            claimRefs:
