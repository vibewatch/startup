chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              指定来源将 COOWA 识别为酷哇科技有限公司，使用 COOWA、Coowa 和 Cowarobot 等名称运营。现有资料显示，公司成立于 2015
              年，法定总部和生产运营位于芜湖，创立及主要研发活动则始于上海。其模式是把自动驾驶和具身 AI
              软件与轮式、四足及人形硬件结合。来源所述目标客户包括市政机构、国有运营商和物业集团，产品覆盖环卫、智慧物业、最后一公里配送和共享接驳。业务覆盖面之广，意味着它更像城市服务机器人集成商，而非单一清洁机器人供应商。指定证据未独立核实其法律实体、当前股权登记或结果即服务模式的经济性。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO011
              - CO012
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              现有公司资料将 He Tao 列为创始人兼 CEO，并将 Liao Wenlong、Li Kehong 和 Li Fangqi 列为联合创始人或高级运营负责人。百度百科条目记录 He Tao 于 2020 年介绍
              COOWA 的业务和研发能力，涵盖智慧环卫、物流和出行应用。资料还显示 Liao 任 CTO、Li Kehong 任 COO、Li Fangqi 任
              CFO，但指定来源没有提供董事会名单、独立董事信息、继任计划或当前股权结构表。因此，领导层看起来以创始人为中心，技术、运营和财务职责均明确归于具体高管，但保留证据未公开证明治理深度。在 IPO
              文件或同等公司披露明确决策权和监督机制前，关键人依赖仍应列为尽调事项。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: 资本、估值与运营规模
        blocks:
          - type: paragraph
            body: >-
              指定证据描述了 2026 年 6 月一笔超过 US$600 million、估值高于 US$3 billion 的融资，同时据报道 2025 年收入超过 RMB 1 billion 且实现运营盈利。Silicon
              Valley Investclub 资料还列出更早轮次，包括 2021 年 US$250 million 的 C 轮，以及募集金额未披露的 D 轮，并称累计融资超过 US$895
              million。这些数字应视为报道值而非经审计数据：同一资料称最新估值和融资数字来自引用匿名消息源的中国媒体，Mugglehead
              文章也没有提供经审计报表或融资文件。尽管如此，运营指标对判断身份和成熟度仍很重要：保留来源称其已在 50 多个城市和地区部署超过 10,000 台设备，订单积压超过 RMB 5
              billion。确切的投后条款、可用现金、股权稀释、利润率和客户集中度仍未核实。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO005
              - CO009
              - CO010
      - number: '1.4'
        title: 里程碑与未解决尽调
        blocks:
          - type: paragraph
            body: >-
              已记录的轨迹从 2015 年成立、聚焦自动驾驶，发展到城市环卫、配送和巡逻部署；随后据报道完成 2021 年 C 轮、2022 年 D 轮融资，并在 2026 年进行 IPO
              前融资和香港上市准备。外部背景喜忧参半。IFR 报告称，2024 年专业清洁机器人和机器人即服务车队增长强劲，支持品类需求；另一方面，若 2026 年中国安全标准草案获采纳，L3 和 L4 要求将于 2027 年
              7 月起强制执行。Unitree 披露的收入和利润，以及 Pudu 最新融资估值，可作同业参照，但不能验证 COOWA 的非公开数字。ChinaBizInsider 还强调更广泛具身 AI
              赛道的现金续航短和整合风险；这一行业警示不等于 COOWA 自身面临流动性事件。经审计的经济性、融资条款、股权、客户集中度和治理仍是关键待解问题。
            claimRefs:
              - CO008
              - CO009
              - CO013
              - CO014
              - CO015
              - CO016
