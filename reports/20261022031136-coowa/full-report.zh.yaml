    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 订单续签；经审计的贡献利润率为正；国际部署可复制；融资条款清晰。
        - 可重复的服务经济性以及 IPO 或战略退出，可能支撑高于当前估值的溢价。
        - 离开旗舰部署后，需求和利润率主张无法成立。
        - 低至中等；需要多个尚未核实的条件。
      - - 基准
        - 市政和物业部署增长，但硬件与服务收入仍混杂，利润率适中。
        - 在获得经审计的收入质量和股权结构表条款前，持有或等待价格重置。
        - 合同中标无法转化为经常性现金流。
        - 中等；与当前证据最一致。
      - - 熊市
        - 资本密集度、安全要求或客户集中度迫使公司折价融资，或放慢部署。
        - 由于 US$3B 估值没有独立的价格锚定，永久损失风险上升。
        - 融资和商业化失败。
        - 实质性；行业来源描述了较短的资金续航期和被淘汰风险。
      - - 退出检查点
        - IPO 申报、战略出售或独立定价的二级交易建立市场参考。
        - 只有在核对优先权、稀释和债务后，才能使用交易价格。
        - 没有流动性事件，或条款不利。
        - 未解决；这里没有 COOWA 已申报文件的证据。
    notes: 这些情景是定性的决策区间，不是预测。由于缺少经审计盈利、股数和交易条款，这里没有给出精确估值区间。
