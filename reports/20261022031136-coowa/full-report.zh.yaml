  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与可服务工作流
        blocks:
          - type: paragraph
            body: >-
              相关市场并非全部人工智能或全部机器人。对
              COOWA，合理边界是执行重复性城市和商业工作流的自主或半自主机器，包括街道清洁、最后一公里配送、物业服务、共享出行及相邻物流。边界还包括硬件、自动驾驶软件、部署、车队运营，以及这些组件打包销售时的持续性机器人即服务合同。工厂专用工业机器人、消费级地面清洁设备、医疗机器人和通用
              AI 基础设施不在其中，除非它们争夺同一买方预算。COOWA
              官方产品矩阵列出四足机器人、城市运营服务机器人、自动驾驶小巴和人形机器人；独立报道则称其已在共享出行、制造和物业服务领域部署。这一组合支持多工作流边界，但不支持单一同质市场分母。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: 市场规模视角与估值相关性
        blocks:
          - type: paragraph
            body: >-
              现有规模证据支持多个观察口径，而非一个可相加的 TAM。国际机器人联合会称，2024 年售出的专业服务机器人接近 200,000 台，其中运输和物流占 102,900 台，专业清洁超过 25,000 台；其样本为
              294 家供应商，不能外推至整个行业。另一篇市场文章称，全球具身 AI 市场约为 2025 年 $4.5 billion、预计 2030 年 $23.1
              billion，但这是第三方估算，转载文章没有给出方法。中国具身 AI 融资和估值数据说明资本池很大，不等于客户支出：一篇文章称 2026 年第一季度 126 笔中国机器人交易募资 $3.3
              billion，另一篇称上半年披露的行业融资超过 RMB 46 billion。这些口径不能相加，也不能当作 COOWA 收入。实际 SAM 仍是满足当地安全、运营和回本要求的可服务城市、合同和工作流子集。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
      - number: '2.3'
        title: 买方、采用路径与约束
        blocks:
          - type: paragraph
            body: >-
              主要经济买方可能是拥有高人工成本、重复性工作流的运营方：物业管理集团、环卫承包商、市政或准市政服务买方、物流运营商和出行车队。使用者是现场运营团队，付款方则可能是采购、设施、交通或公共服务预算。因此，采用需要现场试点、安全与运营审批、接入调度和维护流程，并证明持续服务成本低于现状或更可靠。机器人即服务是重要的采用机制：IFR
              报告称，2024 年专业服务 RaaS 增长 31%，运输 RaaS 增长 42%。约束同样重大。中国 L3/L4 自动驾驶规则草案若落地，将从 2027 年 7
              月起强制安全要求并要求存储事故数据，但文本仍是草案。资本和技术人才竞争也提高执行风险：市场报道称，许多具身 AI 初创公司的现金续航只有 18 至 24
              个月，并警告通用模型若延伸到具身控制，垂直模型差异化可能被压缩。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 商业市场，而非单纯技术市场
            body: 最强的市场信号是重复性服务工作流与不断增长的 RaaS 采购模式相结合；品类融资和标题估值不能替代客户支出。
            calloutType: insight
            claimRefs:
              - CM004
              - CM009
              - CM010
          - type: callout
            title: 规模与时点仍是决策关键缺口
            body: 公开证据没有披露 COOWA 的 SAM、SOM、合同转化、利用率或工作流层面的利润率；安全规则和资本周期压力还可能延迟部署。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合比自动驾驶街道清洁供应商更广。COOWA
              的买方可以选择直接的城市服务机器人供应商、向清洁和配送扩张的服务机器人老牌厂商、为其他集成商提供能力的零部件或软件供应商、传统环卫承包商，或用车辆、人工、摄像头和调度软件自行搭建。公开报道称 COOWA
              在上海、深圳及其他城市运营街道清洁和最后一公里配送车辆；另一篇报道将其三条运营方向概括为智慧出行、智慧货运和智慧环卫。这种广度使其成为平台型集成商，但也暴露出多个攻击面：Pudu
              可将共用机器人“大脑”铺到清洁、酒店、餐饮和工业配送场景；Unitree 则在另一种人形机器人品类中拥有更大、已披露的 2025
              年收入和利润基础；零部件供应商也能在不承担城市服务交付义务的情况下获取价值。传统承包商仍是现状替代方案，因为城市项目可以按结果采购，而不必采购机器人车队。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
      - number: '3.2'
        title: 能力、分发与信任比较
        blocks:
          - type: paragraph
            body: >-
              证据支持非对称比较，而不是赢家通吃的矩阵。COOWA 据报道的优势在于真实部署：Tech in Asia 称其在全球 50 多个城市和地区部署超过 10,000 台机器人；Sohu 则称其在 50
              多个城市开展常态化自动驾驶运营，车队超过 1,000 台。这些数字不可互换，也不应视为独立审计结果。Pudu 的公开画像不同：它是多行业商用机器人厂商，据报道清洁业务约占收入
              70%，工业机器人自推出以来已发货超过 4,000 台。Unitree 基于招股书的数字显示其融资和上市路径更具规模：2025 年收入 RMB1.699 billion，净利润 RMB278
              million，人形机器人出货超过 5,500 台。这些同业表明，规模可以通过不同路径形成：COOWA 靠市政运营和持续服务集成，Pudu 靠在商业场景复用产品形态，Unitree
              靠人形产品规模和资本市场渠道。指定来源没有提供可比的实际价格、毛利率、正常运行时间或客户留存，因此公开记录无法支持比较的矩阵单元仍保留未知。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: 转换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              COOWA 的护城河逻辑建立在积累的运营数据、部署经验，以及为城市买方整合硬件、自动驾驶和服务交付的能力之上。36Kr 联合转载的报道称，截至 2026 年公司已积累超过 50 PB 数据和 45 million
              kilometers 的真实运营里程，但这是公司相关报道，不是独立的模型质量基准。Sohu 报道，深圳 2024 年一项试点用“二人一机”模式替代五至六名传统工人，据称运营成本下降约
              10%；这是宣传性运营主张，并非受控比较。车队、工作流和维护体系嵌入城市后，转换成本似乎最高；但公开证据没有证明合同期限、续约率、数据可移植性或排他性。反面情形是，服务机器人资本充足且竞争日益拥挤：China
              Business Insider 称至少 25 家具身智能初创公司估值超过 RMB10 billion，多数现金续航仅 18 至 24 个月，并指出 Pudu 这一传统硬件厂商正转向具身 AI。COOWA
              必须把部署规模转化为可重复的单位经济性，赶在数据优势商品化或资金更充裕的老牌厂商把机器人与更广泛的设施服务捆绑之前。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP012
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: 部署是最清晰的差异化因素
            body: 公开来源一贯将 COOWA 放在实际运营的城市服务部署中，而不只是实验室或试点演示；这具有战略价值，但相关指标来自公司或媒体报道，仍需逐份合同核实。
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
          - type: callout
            title: 护城河尚未得到独立定价
            body: 指定证据没有证明实际定价、续约、毛利率、正常运行时间或排他性，因此仅凭部署规模无法证明持久的经济优势。
            calloutType: risk
            claimRefs:
              - CP009
              - CP012
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与已披露进展
        blocks:
          - type: paragraph
            body: >-
              COOWA 对外定位为具身 AI 和城市服务机器人企业，覆盖出行、制造和物业服务场景。指定公司档案称其已在全球 50 多个城市部署超过 10,000 台设备，2025 年收入超过 RMB
              1bn，但没有说明经审计收入、收入确认政策、产品组合、合同期限或部署数量的分母。这一区分很重要：已部署设备是运营覆盖指标，不是经常性收入指标；报道收入也不是 ARR。另一篇行业报道称 COOWA 2025
              年收入超过 RMB1bn 且实现盈利，并描述 2026 年 5 月一轮超过 US$600m、估值 US$3bn
              的融资；这些是外部报道的公司层面主张，不是本证据池中的独立审计报表。保留来源没有提供目录价，或按机器人、服务合同、地点和结果计费项目拆分的实际价格。因此，财务情况应表述为潜在规模可观，但拆解不足。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
