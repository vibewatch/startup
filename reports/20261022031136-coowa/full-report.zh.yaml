      - number: '4.3'
        title: 资本充足性与投资判断
        blocks:
          - type: paragraph
            body: >-
              指定证据没有披露 COOWA 的现金余额、现金消耗、现金续航、债务、项目融资义务、受限现金、资金计划用途或下一轮融资触发条件。若报道中的数字和条款得到确认，超过 US$600m 的融资和 US$3bn
              估值只能说明融资规模和隐含估值；它们不能证明扣除交易成本、投资人限制、运营消耗后的可用现金，也不能证明投后股权。行业报道记录 2026 年第一季度 126 笔中国机器人交易共投入
              US$3.3bn；另有报道称许多中国具身 AI 公司现金续航只有 18–24 个月，2027–2028 年可能面临整合或下轮融资压力。这些是资本市场风险基准，不是 COOWA
              的现金续航估算。同业文件和市场报道显示，机器人公司研发、制造和商业化都可能需要大量资本。不能仅凭融资额或标题估值对 COOWA
              作投资判断。财务结论是跟踪/继续研究：商业进展看似可信，但收入质量、利润率路径、流动性和融资依赖仍未核实。
