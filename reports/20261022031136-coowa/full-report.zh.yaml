              COOWA 产品适用每一项规定。美国出口管制变化又增加跨境合规风险：Mayer Brown 称申请人必须识别某些第三国终端用户、开展客户尽调并处理未经授权的远程访问。GIZMOCHINA
              也报道，无论运营地点在哪里，中国总部企业仍受许可要求约束。尽调重点应是梳理 COOWA 的车辆分类、运营许可、数据留存、受出口管制零部件和负责合规的人员。
