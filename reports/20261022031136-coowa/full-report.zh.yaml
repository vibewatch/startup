      - number: '4.2'
        title: 成本结构与单位经济性
        blocks:
          - type: paragraph
            body: >-
              城市机器人经济性可能由硬件物料清单、自动驾驶和软件研发、部署人工、维护、车队运营、连接、充电及客户定制集成共同决定。保留证据没有量化 COOWA
              的任何一项，也没有披露毛利率、贡献毛利率、利用率、服务时长、维护发生率、保修成本、替换周期、CAC、销售周期、回本期或客户集中度。合适的比较不是通用 SaaS
              利润模型：即使日后找到官方目录价，也不能证明实际收入或利润率。行业基准称 2025 年中国 AGV/AMR 销售额为 RMB26.1bn、销量 182,000 台，44 家公司订单超过
              RMB100m；这说明市场规模和竞争密度，却不能说明 COOWA 的经济性。缺少公司层面的单位经济性是重大投资判断缺口，而不是表现不佳的证据。
            claimRefs:
