              应用软件、系统集成和环境服务活动。因此，现有证据支持一种由车辆和机器人执行重复性城市运营的组合模式，但没有披露完整 SKU 目录、客户特定服务水平或按工作流拆分的实际收益。Gate News 等报道称其在 50
              多个城市和地区部署超过 10,000 台机器人；这些数字是报道主张，不是独立审计的车队普查。
