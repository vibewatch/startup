          - type: callout
            title: 论点失效监测
            body: 在提高信心前，应要求提供合规的产品分类、出口管制审查、安全与事故指标、关键供应商替代方案、经审计财务报表，以及已核实的融资或 IPO 时间表。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR008
              - CR013
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反面论点
        blocks:
          - type: paragraph
            body: >-
              投资逻辑依托已证明的部署，而不是纯粹前瞻性的机器人叙事。China Business Insider 称 COOWA 部署了自动驾驶街道清洁和最后一公里配送车辆，2025 年收入超过 RMB1 billion
              且实现盈利；中国移动机器人产业联盟则称，2025 年永康环卫合同价值 RMB283.5 million，公司当年拿下 13 个无人环卫项目，总额超过 RMB1
              billion。这些观察支持商业进展，但不是经审计财务报表，也不能证明经常性收入、毛利率、客户集中度或现金转化。反面论点是，赛道私人估值快速上升，而许多同业现金续航只有 18–24
              个月；如果部署不能转化为持久利润率，高融资估值就容易承受下轮融资压力。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV010
              - CV013
      - number: '8.2'
        title: 入场纪律与融资背景
        blocks:
          - type: paragraph
            body: >-
              公开证据将 COOWA 的估值放在 US$3 billion，基于一轮据称超过 US$600 million 的 2026 年 5
              月融资，但没有提供定价条款清单、投后股数、清算优先权、期权池、债务或投资人持股。由此得到的标题倍数只能粗略筛选：相对于报道中超过 RMB1 billion 的收入，按文章自身约略的 RMB/US$ 换算，US$3
              billion 约为收入的 21.4 倍，不是经核实的企业价值/收入倍数。可比证据也不均质。Unitree 据报道的预期 IPO 市值约 RMB42 billion，对应估算的 2025 年收入 RMB1.7
              billion；而中国具身 AI 公司群体同时包含盈利公司和商业化前公司。这些比较可用于建立纪律，但不能替代 COOWA 经审计的收入质量和融资条款。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 情景、退出准备度与论点失效
        blocks:
          - type: paragraph
            body: >-
              基准情景应假设市政和物业管理继续采用，但不能自动把报道的合同中标转化为高毛利经常性软件收入。乐观情景需要订单持续增长、各车型单位经济性转正，以及不会造成重大优先权负担的融资条款。悲观情景是随着资本密集度、集成成本和安全要求上升，出现下轮融资或商业化停滞。市场研究显示清洁机器人品类和机器人即服务渠道都在快速增长，但也强调初始成本高、执行复杂、隐私合规和中国垂直整合厂商带来的利润率压力。若提交上市文件或达成战略出售，退出可能更可信；但现有证据只显示一般性的香港专业科技路线，并未证明
              COOWA 符合资格或已在申请。关键论点失效包括订单转化不及预期、服务成本后贡献毛利为负、融资低于当前估值，或安全/监管事件阻断部署。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV011
              - CV014
      - number: '8.4'
        title: 决策与下一步尽调
        blocks:
          - type: paragraph
            body: >-
              基于证据的决策是跟踪，对估值立场的信心为中低。COOWA 看起来比尚未产生收入的具身 AI 同业更成熟，但公开记录不足以判断考虑优先权、稀释、债务和服务义务后，US$3 billion
              估值是有吸引力、公允还是偏高。投资前，应取得经审计的 2025 年和 2026
              年中期报表，按产品和服务线拆分收入确认，按车型拆分毛利率和贡献毛利率，续约和流失数据、客户集中度、积压订单转化、股权结构表和优先权条款、债务契约、部署安全记录，以及国际可复制性的证据。仅价格变化不应提升建议，除非有证据表明报道的盈利扣除维护、远程运营、保修和车队集成成本后仍成立。
            claimRefs:
              - CV005
              - CV008
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 跟踪，不要因标题估值买入
            body: COOWA 据报道的商业成熟度是一项优势，但公开证据尚不足以支持基于价格的买入决策。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV014
          - type: callout
            title: 缺失的分母是核心风险
            body: 没有经审计的收入质量、贡献毛利率、股权结构表优先权、稀释、债务和积压订单转化，就无法判断当前估值。
            calloutType: risk
            claimRefs:
              - CV005
              - CV008
              - CV011
              - CV012
