  - id: FE001
    title: COOWA 产品架构图
    type: stack
    summary: 公开证据支持一个从实体机器人、世界—行动规划到城市服务的分层运营模型，但若干关键接口仍未验证。
    data:
      layers:
        - label: 城市服务
          detail: 公开账户描述了智慧环卫、智慧物流和智慧出行工作流。
          modules:
            - 环卫运营
            - 物流
            - 出行
        - label: 车队运营
          detail: 部署、连接、维护、许可和本地运营流程。
          modules:
            - 车队管理
            - 现场服务
            - 运营许可
        - label: 机器人平台
          detail: 服务机器人硬件和已登记的技术活动，包括电池和力控制发明。
          modules:
            - 自动驾驶车辆
            - 服务机器人
            - 传感器和执行器
        - label: COOWA WAM 2.0
          detail: QbitAI 描述的世界状态表示、动力学预测、动作生成和 VLM 约束。
          modules:
            - 语义表示
            - 世界动力学
            - 动作生成器
            - VLM 约束
        - label: 信任与控制
          detail: 指定资料池中没有安全、网络安全、隐私、质量和事件控制的公开证据。
          modules:
            - 安全论证
            - 安全控制
            - 事件响应
        - label: 证据边界
          detail: 公开来源支持部署和架构描述，但没有可复现基准或车队可靠性分母。
          modules:
            - 基准
            - 正常运行时间
            - 单位经济
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE008
      - CE009
  - id: FU001
    title: 从采购到扩张的客户旅程
    type: journey-map
    summary: 公开证据支持从市政或运营商采购到现场部署和地域扩张的路径，但留存和复购经济性仍未验证。
    data:
      items:
        - stage: 1
          label: 采购
          title: Procurement
          detail: 市政、街道、环卫或物业服务买方识别出人力和服务质量需求。
        - stage: 2
          label: 试点与运营验证
          title: Pilot and operating validation
          detail: 据报道，深圳项目从初始试点进入了超过半年的运营评估。
        - stage: 3
          label: 生产部署
          title: Production deployment
          detail: 据描述，石井项目部署了 38 台机器人、6 个支持站点和摄像头，作业区域覆盖率超过 85%。
        - stage: 4
          label: 扩张
          title: Expansion
          detail: 据报道，不到一年内，COOWA 在宝安、龙岗和坪山拿下了 5 个深圳城市管家项目。
        - stage: 5
          label: 留存与复购
          title: Retention and repeat purchase
          detail: 指定资料池中没有续约、流失、NRR、合同期限和账户层面扩张的公开证据。
        - stage: 6
          label: 账户经济性
          title: Account economics
          detail: 客户层面收入、付款方身份、合同条款和续约贡献需要私下尽调。
    approximationNotes: 该序列是对报道部署阶段的分析呈现，不是经测量的转化漏斗或经验证的队列路径。
    claimRefs:
      - CU005
      - CU006
      - CU010
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 这张定性热力图将后果与当前证据可信度分开。
    data:
      columns:
        - 影响 / 证据可信度
        - 低可信度
        - 中可信度
        - 高可信度
      rows:
        - label: 高影响
          values:
            - 供应商集中度；利润率和烧钱情况不透明
            - 出口管制暴露
            - 安全合规
            - null
        - label: 中影响
          values:
            - IPO 时间和条款
            - 合作伙伴连续性
            - 行业融资收缩
            - null
        - label: 低影响
          values:
            - 没有保留来源支持低影响的 COOWA 特定风险
            - 没有保留来源支持低影响的 COOWA 特定风险
            - 没有保留来源支持低影响的 COOWA 特定风险
            - null
        - label: 监管控制
          values:
            - 未验证
            - 草案要求
            - 没有高可信度的 COOWA 控制证据
            - null
        - label: 财务控制
          values:
            - 未保留经审计数据
            - 仅有同业亏损基准
            - 未保留 COOWA 披露
            - null
        - label: 依赖控制
          values:
            - 未保留供应商图谱
            - 行业层面警告
            - 未保留 COOWA 连续性证据
            - null
    approximationNotes: 定性位置反映证据可得性和后果，不是数值概率模型。
    claimRefs:
      - CR001
      - CR004
      - CR013
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 商业验证支持继续跟踪，但缺少价格和单位经济证据，无法给出买入建议。
    data:
      nodes:
        - id: proof
          label: 商业验证
          detail: 据报道的收入、盈利能力和环卫项目中标
        - id: market
          label: 市场顺风
          detail: 清洁机器人和 RaaS 增长
        - id: price
          label: 价格证据
          detail: US$3B 估值；条款和分母不完整
        - id: economics
          label: 单位经济
          detail: 经审计利润率、续约和现金转换缺口
        - id: risk
          label: 风险筛查
          detail: 资本密集度、安全、执行和折价融资暴露
        - id: decision
          label: 决策
          detail: 跟踪，等待尽调
      edges:
        - from: proof
          to: price
        - from: market
          to: price
        - from: price
          to: economics
        - from: economics
          to: risk
        - from: risk
          to: decision
    claimRefs:
      - CV001
      - CV005
      - CV010
      - CV011
      - CV014
