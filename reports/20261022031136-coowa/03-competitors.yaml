      - ["Trust, safety, and regulatory posture", "Operating in city environments and preparing a Hong Kong IPO reported", "Commercial deployments reported; comparable safety record unavailable", "STAR Market listing review approved; IPO process provides disclosure pathway", "Regulatory approval is not proof of operating safety; incident, certification, and renewal evidence remain gaps"]
    notes: "Cells distinguish reported evidence from unknowns; no unsupported ratings are assigned where the pool lacks comparable pricing, uptime, safety, or retention data."
    claimRefs: [CP001, CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing, packaging, and switching-cost comparison
    columns: [Alternative, Price or contract model, Included capabilities, Discount or unknowns, Competitive implication]
    rows:
      - [COOWA, "MaaS / integrated robot hardware and operating service reported", "Autonomy, vehicles/robots, city operations, maintenance and data feedback are described", "Realized price, gross margin, contract term, renewal, and discount structure unknown", "Integrated delivery may raise switching costs after deployment, but can also make COOWA operationally asset-heavy"]
      - [Pudu Robotics, "Commercial robot sales and multi-sector deployment implied", "Cleaning, hospitality, restaurant, industrial delivery, and multiple form factors", "List price, service attach rate, and realized revenue mix beyond a reported 70% cleaning share unknown", "Reusable platform could support cross-sell and lower product concentration"]
      - [Unitree Robotics, "Product shipments and IPO-funded scale implied", "Humanoid robot hardware and embodied-AI capabilities", "ASP, recurring software/service revenue, and customer concentration unknown", "Capital and manufacturing scale may fund aggressive expansion, but direct sanitation substitution is unproven"]
      - [Conventional contractors, "Outcome-based municipal or property service contracts", "Labor, equipment, supervision, and local operating relationships", "Labor cost, service-level penalties, and automation capex not comparable from assigned sources", "Incumbency and procurement familiarity can slow robot adoption even when automation is technically feasible"]
      - [Internal build, "Project-specific capex plus ongoing labor and maintenance", "Custom workflow and direct control over data and operations", "Build cost, technical staffing, safety burden, and time to deployment unknown", "May be preferred by large buyers that resist vendor lock-in"]
    notes: "Assigned sources do not disclose comparable realized prices; rows preserve unknowns rather than converting product or funding disclosures into pricing evidence."
    claimRefs: [CP002, CP003, CP006, CP009, CP012]
