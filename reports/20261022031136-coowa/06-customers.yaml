chapter:
  number: 6
  title: Customers
  summary: COOWA's customer evidence points to city-scale deployments in China, especially municipal sanitation and property-service workflows, with reported expansion into multiple Shenzhen projects and a stated overseas pipeline. The strongest public proof is deployment and contract evidence; retention, customer-level revenue concentration, renewal behavior, and independently verified outcomes remain material gaps.
sections:
  - id: customer-segments-and-buyers
    title: Buyer and use-case segmentation
    body: >-
      COOWA appears to sell into a multi-sided operating model rather than a single end-user segment. Public descriptions identify municipal city-management and sanitation projects, property-service operators, and industry partners that combine COOWA technology with their own operating contracts. The buyer, payer, and daily user can therefore differ: a district or state-owned urban-services entity may procure the program, a sanitation contractor may operate it, and field crews may work alongside the robots. This structure can widen the addressable market, but it also creates procurement, partner-dependence, and attribution risk because public material rarely states contract counterparty, term, renewal, or revenue recognition.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-deployment-proof
    title: Adoption trajectory and named deployments
    body: The available evidence is stronger on deployment footprint than on recurring customer economics. An industry article reports five Shenzhen city-manager wins in less than a year, spanning Bao'an, Longgang, and Pingshan, and describes earlier Pingshan Shijing and Bao'an Xixiang projects. It also gives operational detail for Shijing, including 38 robots, six service facilities, and coverage of more than 85% of the work area. A separate 2026 article reports an order reserve above RMB5 billion and three operating pillars, while another report claims more than 10,000 units and EBITDA turning positive; these are company-linked or media-reported figures, not independently audited customer or cohort disclosures.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Retention, expansion, and concentration risk
    body: >-
      Public evidence suggests a land-and-expand motion from pilots to city-level programs, but it does not establish net revenue retention, gross retention, churn, renewal rates, contract duration, or customer-level concentration. The reported Shenzhen sequence is consistent with expansion within one geography and operating template; it is not proof that individual accounts renewed or expanded economically. The reported domestic concentration is also material: one company-linked account says 90% of the business remains domestic while overseas focus is limited to selected Asian and Middle Eastern cities. Investors should require an account-level revenue bridge, signed backlog aging, renewal cohorts, counterparty credit, and a split between COOWA-direct, partner-operated, and municipal-funded deployments.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Deployment evidence is concrete
    body: The Shijing project description names the site, fleet composition, support infrastructure, operating coverage, and measured workflow changes, which is stronger than a logo list or undifferentiated customer count.
    claimRefs: [CU005, CU006]
  - calloutType: risk
    title: Retention and concentration are not public
    body: Neither the assigned sources nor the public deployment descriptions establish customer-level renewal, churn, NRR, contract length, or revenue concentration by account.
    claimRefs: [CU010, CU011, CU012]
  - calloutType: recommendation
    title: Underwrite contracts, not logos
    body: Diligence should reconcile signed contracts and backlog to recognized revenue by counterparty, geography, operating model, term, renewal status, and customer-paid versus partner-paid economics.
    claimRefs: [CU013]
