          detail: Reported Shenzhen projects moved from initial pilots into more than half a year of operating assessment.
        - stage: 3
          label: Production deployment
          title: Production deployment
          detail: Shijing is described with 38 robots, six support sites, cameras, and more than 85% work-area coverage.
        - stage: 4
          label: Expansion
          title: Expansion
          detail: Five Shenzhen city-manager wins were reported across Bao'an, Longgang, and Pingshan in less than one year.
        - stage: 5
          label: Retention and repeat purchase
          title: Retention and repeat purchase
          detail: Renewal, churn, NRR, contract duration, and account-level expansion are not publicly evidenced in the assigned pool.
        - stage: 6
          label: Account economics
          title: Account economics
          detail: Customer-level revenue, payer identity, contract terms, and renewal contribution require private diligence.
    approximationNotes: "The sequence is an analytical representation of reported deployment stages, not a measured conversion funnel or verified cohort path."
    claimRefs: [CU005, CU006, CU010, CU012]
