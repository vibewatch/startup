      - ["Autonomy safety incident or inadequate event records", "Unknown", "High", "Unknown", "High", "No public COOWA incident, uptime, or DSSAD evidence retained"]
      - ["Supplier, distributor, or research-partner disruption", "Unknown", "Medium-high", "Unknown", "Medium-high", "No public concentration or termination terms"]
      - ["Margin compression in hardware/service delivery", "Medium", "High", "Unknown", "High", "No audited product-line margin or cash-conversion data"]
    notes: "Rows are risk hypotheses and diligence prompts, not findings that these failure modes have occurred at COOWA."
    claimRefs: [CR008, CR009, CR010, CR012, CR013]
