chapter:
  number: 7
  title: Risks
  summary: COOWA's principal risks are regulatory and technology-access exposure, execution and financing pressure in a crowded Chinese robotics market, and limited public evidence on its own controls, incidents, and customer concentration. The evidence supports monitorable diligence triggers, but not a conclusion that a specific COOWA incident or breach has occurred.
sections:
  - id: risk-prioritization
    title: Ranked risk view
    body: >-
      The highest-consequence exposure is policy and technology access. Mayer Brown describes a January 2026
      US rule that moved some advanced-chip applications to case-by-case review while adding technical,
      customer, remote-end-user, and physical-security certifications; the same analysis says policy remains in
      flux. For a Chinese urban-robotics operator, that creates a plausible dependency risk for imported compute,
      components, or overseas deployments, but the retained sources do not identify COOWA's bill of materials.
      A second risk is sector financing and commercialization: ChinaBizInsider reports that many embodied-AI
      startups have only 18–24 months of runway and may face consolidation, down-rounds, or failure in 2027–2028.
      That is sector evidence, not a COOWA cash-runway measurement.
    claimRefs: [CR001, CR002, CR003]
    tableRefs: [TR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      China’s proposed autonomous-driving standard, as summarized by Electrive, would make safety requirements
      for Level 3 and Level 4 systems mandatory from July 1, 2027, including takeover capability, emergency
      manoeuvres, and a data-storage system for accident investigation. The source concerns automated driving
      broadly and does not establish that COOWA's products fall within every provision. US export-control
      developments add a cross-border compliance risk: Mayer Brown says applicants must identify certain
      third-country end users, perform customer due diligence, and address unauthorized remote access. GIZMOCHINA
      likewise reports that Chinese-headquartered firms remain subject to licensing requirements regardless of
      where they operate. The diligence priority is to map COOWA vehicle classifications, operating permits,
      data retention, export-controlled components, and responsible compliance owners.
    claimRefs: [CR004, CR005, CR006, CR007]
    tableRefs: [TR002]
  - id: operational-dependency
    title: Operational, quality, and dependency risks
    body: >-
      The retained evidence supports dependency scenarios but not a quantified COOWA failure rate. Mayer Brown
      identifies chip designers, OEMs, integrators, cloud providers, distributors, and multinational deployers as
      affected by advanced-chip controls; that maps to possible supplier and compute dependencies for an autonomy
      stack. A 2020 Baidu Baike entry records a COOWA-linked research institute and university/park cooperation,
      which demonstrates an institutional collaboration but does not prove current exclusivity or operational
      resilience. The sector article describes full-stack competitors and warns that vertical integration can
      pressure hardware specialists. Management should disclose supplier concentration, second-source coverage,
      fleet uptime, mean time to repair, incident rates, and the boundary between remote assistance and autonomous
      operation before these risks can be scored with confidence.
    claimRefs: [CR008, CR009, CR010, CR011]
    tableRefs: [TR003]
  - id: financial-thesis-breaks
    title: Financial, partner, and thesis-break triggers
    body: >-
      Public evidence does not disclose COOWA's audited margin, burn, working-capital cycle, debt, customer
      concentration, or contract-level economics, so those quantities remain gaps rather than inferred values.
      A relevant peer filing shows why accounting and cash risk should be separated: Pony AI reported 2025
      revenue of USD90.0 million, a USD76.8 million net loss, and a USD174.0 million non-GAAP net loss, while
      explaining that its non-GAAP measure excludes several items and should not be used alone. Mugglehead's
      June 2026 headline describes COOWA as preparing for a Hong Kong IPO, but the retained text does not verify
      filing status or terms. Thesis-break monitoring should therefore focus on missed deployment milestones,
      a material increase in safety incidents, loss of a critical supplier or channel partner, inability to fund
      working capital, or an IPO/financing delay that removes the expected liquidity path.
    claimRefs: [CR012, CR013, CR014, CR015]
    figureRefs: [FR001]
