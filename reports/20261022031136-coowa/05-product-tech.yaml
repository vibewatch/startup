company:
  name: COOWA
chapter:
  number: 5
  title: Product & Technology
  summary: COOWA presents an urban-service robotics platform spanning autonomous vehicles, service robots, and a World-Action Model, while public evidence is stronger on deployment breadth and registered technical activity than on independently benchmarked performance, reliability, or safety.
sections:
  - id: customer-workflow
    title: Product surface and customer workflow
    body: >-
      COOWA's public operating description is an urban-service workflow rather than a single
      robot SKU. A 2020 university and industrial-park account described the intended service
      scope as “智慧环卫、智慧物流、智慧出行” (smart sanitation, smart logistics, and smart
      mobility), while the company's registry describes service-consumer robot manufacturing,
      Internet-of-Things equipment, AI application software, system integration, and
      environmental-service activities. The available evidence therefore supports a portfolio
      model in which vehicles and robots perform recurring city operations, but it does not
      disclose a complete SKU catalog, customer-specific service levels, or realized benefits
      by workflow. Gate News and other reporting describe more than 10,000 deployed robots
      across more than 50 cities and regions; those figures are reported claims, not an
      independently audited fleet census.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, operating model, and maturity
    body: >-
      The strongest public technical description is a QbitAI article about COOWA WAM 2.0.
      It describes a world-action model that combines world-state representation, candidate
      actions, and state-action-result evolution, with semantic representation learning,
      video-based world-dynamics prediction, an intuition-driven action generator, and
      vision-language-model constraints. This is a company-specific architecture description
      reported by a specialist technology publisher, not a benchmark paper or independently
      reproduced system. A separate practitioner-oriented account says COOWA's fleet has
      accumulated more than 45 million kilometers of real-world driving data and calls the
      data advantage a hypothesis requiring measurable improvement; it explicitly notes that
      revenue per robot, maintenance costs, and capital-expenditure trajectory are not public.
      The product thus has evidence of deployed operating scale and a stated technical
      direction, but not public proof of generalization, latency, uptime, or unit-level
      economics.
    claimRefs: [CE004, CE005, CE006, CE007]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-dependencies-roadmap
    title: Trust, dependencies, and roadmap evidence
    body: >-
      The registry records recent robot-related patent activity, including a battery structure
      patent, a self-adaptive force-control gripper patent, a quadruped-robot design patent,
      and a masked-graph-pretraining and fair-aware collaborative-dispatching invention. It
      also records a city-sanitation operating permit and a broad business scope spanning road
      vehicle production, waste services, robot manufacturing, software, communications, and
      system integration. These records indicate an active technical and operating footprint,
      but a filing or registration does not establish commercial deployment, freedom to
      operate, safety performance, or certification. China's proposed Level 3/4 automated
      driving rules described by Electrive would add mandatory safety requirements and a
      data-storage system for automated-driving incidents from July 2027 if adopted; the
      article concerns national autonomous-driving regulation broadly and does not establish
      COOWA compliance. Public evidence also does not show service-level uptime, incident
      history, cybersecurity controls, privacy controls, third-party safety certification, or
      an independently tested WAM benchmark.
    claimRefs: [CE008, CE009, CE010, CE011, CE012]
    callouts:
      - calloutType: risk
        title: Technical diligence blocker
        body: Public materials describe architecture and deployment, but do not provide reproducible benchmarks, uptime and incident data, security documentation, or product-by-product certification evidence.
        claimRefs: [CE006, CE010, CE011, CE012]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns: [Module or asset, User or workflow, Public maturity/status, Differentiation evidence, Diligence gap]
    rows:
      - [Autonomous sanitation vehicles, Municipal or property sanitation operations, Deployed at reported scale; exact model mix not disclosed, "More than 10,000 robots reported across more than 50 cities and regions", "Fleet census, uptime, maintenance cost, and per-vehicle economics"]
      - [Urban logistics and delivery robots, Last-mile or site logistics, Described as a service area; production deployment details are not enumerated, "Company scope includes smart logistics and system integration", "Named production customers, payload limits, route constraints, and delivery performance"]
      - [Smart-mobility vehicles, Urban mobility and shuttle workflows, Described as a service area; model-level evidence is incomplete, "Company scope includes smart mobility; external reporting describes wheeled and wheel-legged systems", "Regulatory approvals, safety case, operating domains, and utilization"]
      - [COOWA WAM 2.0, Robot planning and control across physical environments, Publicly described architecture; independent benchmark unavailable, "World-state, action, outcome modeling plus VLM constraints are described by QbitAI", "Weights, datasets, latency, benchmark protocol, failure rates, and transfer results"]
      - [Robot components and embodied hardware, Manufacturing and service-robot R&D, "Registry shows recent battery, force-control, and quadruped-related patent activity", "Recent registered technical activity is visible in the enterprise record", "Patent ownership, grant scope, product linkage, and freedom-to-operate review"]
    notes: "Coverage is a public-evidence snapshot as of 2026-10-22; deployment and architecture descriptions are not an exhaustive SKU or product-catalog enumeration, and the final column records diligence gaps rather than measured performance."
    claimRefs: [CE001, CE002, CE004, CE008]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution described publicly, Measurable benefit, Limitation]
    rows:
      - [Keep streets or sites clean, Human-led sanitation and transport, Autonomous sanitation robots and environmental-service operations, Reported deployment scale suggests operational use, "No independently verified cost, uptime, safety, or service-quality denominator"]
      - [Move goods in urban or site environments, Manual or vehicle-based last-mile logistics, Smart-logistics robots and system integration, No public controlled outcome in the assigned evidence, "Named customer deployments and production-versus-pilot status unavailable"]
      - [Provide urban mobility, Fixed or human-operated transport services, Smart-mobility vehicles and reported urban deployments, More than 50 cities and regions reported, "Operating-domain approvals, utilization, and incident data unavailable"]
      - [Plan robot actions in changing environments, Perception-policy-control loop, WAM 2.0 described as world-state and action-outcome modeling with VLM constraints, Technical rationale is described but not independently measured, "No public reproducible benchmark or failure-rate series"]
    notes: "The source record mixes company scope, media descriptions, and reported fleet metrics; no row should be read as a verified causal benefit or conversion rate."
    claimRefs: [CE001, CE003, CE004, CE005, CE006]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - [Physical assets and sensors, Capture and act in streets, "Robot hardware, batteries, sensing, and actuation", "Battery life, sensor redundancy, weather performance, and component supply are undisclosed"]
      - [Semantic representation, Convert observations into usable environment representations, Training data and model pipeline, "Transfer across sanitation, mobility, and humanoid-like systems is described but not benchmarked"]
      - [World dynamics prediction, Predict possible future scene evolution, Video and interaction data plus compute, "Prediction fidelity, distribution shift, and compute cost are not public"]
      - [Action generation, Produce candidate actions quickly, Imitation or learned policy systems, "Real-time latency and edge-case failure rates are unavailable"]
      - [VLM constraints and control, Apply high-level goals and causal constraints to candidate actions, Vision-language models and control stack, "Safety interlocks, fallback behavior, and human/remote intervention are not documented"]
      - [Operations and service delivery, "Deploy, maintain, and support robot fleets", "Permits, local operating rules, field service, and connectivity", "Cross-market reproducibility, incident response, and service-level uptime are not disclosed"]
    notes: "Architecture layers are an analytical organization of the QbitAI-described WAM components and the operating footprint in the registry; they are not a company-published system diagram and do not establish a complete bill of materials."
    claimRefs: [CE004, CE005, CE006, CE007, CE009, CE010]
figures:
  - id: FE001
    title: COOWA product architecture map
    type: stack
    summary: Public evidence supports a layered operating model from physical robots through world-action planning and city services, with several critical interfaces still unverified.
    data:
      layers:
        - label: City services
          detail: Smart sanitation, smart logistics, and smart mobility workflows described in public accounts.
          modules: [Sanitation operations, Logistics, Mobility]
        - label: Fleet operations
          detail: Deployment, connectivity, maintenance, permits, and local operating procedures.
          modules: [Fleet management, Field service, Operating permissions]
        - label: Robot platform
          detail: Service-robot hardware and registered technical activity, including battery and force-control inventions.
          modules: [Autonomous vehicles, Service robots, Sensors and actuators]
        - label: COOWA WAM 2.0
          detail: World-state representation, dynamics prediction, action generation, and VLM constraints as described by QbitAI.
          modules: [Semantic representation, World dynamics, Action generator, VLM constraints]
        - label: Trust and controls
          detail: Safety, cybersecurity, privacy, quality, and incident controls are not publicly evidenced in the assigned pool.
          modules: [Safety case, Security controls, Incident response]
        - label: Evidence boundary
          detail: Public sources support deployment and architecture descriptions, but not reproducible benchmarks or fleet reliability denominators.
          modules: [Benchmarks, Uptime, Unit economics]
    claimRefs: [CE001, CE004, CE006, CE008, CE009]
callouts:
  - calloutType: strength
    title: Deployed-system evidence
    body: COOWA has a stronger public deployment and operating-footprint signal than a prototype-only robotics company, although the reported fleet metrics remain company-related or media-reported rather than audited.
    claimRefs: [CE001, CE003, CE005]
  - calloutType: assumption
    title: Do not equate patents with product maturity
    body: Registered patents and business permissions show technical and operating activity, but they do not prove that a specific invention is deployed, differentiated, safe, or commercially valuable.
    claimRefs: [CE008, CE009]
