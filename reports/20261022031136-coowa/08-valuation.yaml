company:
  name: COOWA
chapter:
  number: 8
  title: Valuation
  summary: COOWA has unusually strong commercial evidence for an urban-service robotics company, including reported 2025 revenue above RMB1 billion, profitability, and a US$3 billion valuation, but public evidence does not disclose audited margins, terms, or a price-anchored cap table. The evidence therefore supports a track stance rather than a buy until financing terms and unit economics are verified.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The investment case rests on demonstrated deployment rather than a purely
      prospective robotics narrative. China Business Insider reports that COOWA
      deployed autonomous street-cleaning and last-mile delivery vehicles and
      reported 2025 revenue exceeding RMB1 billion and profitability, while the
      China Mobile Robot Association reported a 2025 Yongkang sanitation contract
      worth RMB283.5 million and said the company had won 13 unmanned sanitation
      projects totaling more than RMB1 billion that year. Those observations
      support commercial traction, but they are not audited financial statements
      and do not establish recurring revenue, gross margin, customer
      concentration, or cash conversion. The anti-thesis is that the sector is
      attracting fast-rising private marks while many peers have only 18–24
      months of runway, making a high financing mark vulnerable to down-round
      pressure if deployments do not convert into durable margins.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: valuation-discipline
    title: Entry discipline and financing context
    body: >-
      Public evidence places COOWA at a US$3 billion valuation after a May 2026
      funding round described as exceeding US$600 million, but it does not
      provide a priced term sheet, post-money share count, liquidation
      preference, option pool, debt, or investor ownership. The resulting
      headline multiple is only a rough screen: against reported revenue above
      RMB1 billion, a US$3 billion mark is approximately 21.4 times revenue
      using the article's own approximate RMB/US$ conversion, not a verified
      enterprise-value-to-revenue multiple. Comparable evidence is also
      heterogeneous. Unitree's reported prospective IPO market cap of roughly
      RMB42 billion is paired with estimated 2025 revenue of RMB1.7 billion,
      whereas the China embodied-AI cohort includes both profitable and
      pre-commercial companies. These comparisons can frame discipline, but
      they cannot substitute for COOWA's audited revenue quality and financing
      terms.
    claimRefs: [CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV003]
  - id: scenarios-and-exit
    title: Scenarios, exit readiness, and thesis breaks
    body: >-
      A base case should assume continued municipal and property-management
      adoption but no automatic conversion of reported contract awards into
      high-margin recurring software revenue. The bull case requires sustained
      order growth, positive unit economics by vehicle class, and financing at
      terms that do not impose material preference overhang. The bear case is a
      down-round or stalled commercialization as capital intensity, integration
      costs, and safety requirements rise. Market research points to a growing
      cleaning-robot category and a fast-growing robots-as-a-service channel,
      but also highlights high initial costs, complex execution, privacy
      compliance, and margin pressure from vertically integrated Chinese
      manufacturers. An exit could become more credible through a filing or
      strategic sale, yet the available evidence only shows a general Hong Kong
      specialist-technology route, not COOWA eligibility or an active
      application. The key thesis breaks are missed order conversion, negative
      contribution margin after service costs, financing below the current mark,
      or a safety/regulatory event that blocks deployments.
    claimRefs: [CV010, CV011, CV012, CV013, CV014]
    figureRefs: [FV001]
  - id: diligence-asks
    title: Decision and next diligence
    body: >-
      The evidence-sensitive decision is track with medium-low confidence in
      the valuation stance. COOWA appears more commercially mature than
      pre-revenue embodied-AI peers, but the public record is insufficient to
      determine whether the US$3 billion mark is attractive, fair, or
      stretched after preferences, dilution, debt, and service obligations.
      Before an investment, obtain audited 2025 and interim 2026 statements,
      revenue recognition by product and service line, gross margin and
      contribution margin by vehicle, renewal and churn data, customer
      concentration, backlog conversion, cap-table and preference terms, debt
      covenants, deployment safety records, and evidence of international
      repeatability. A price change alone should not upgrade the recommendation
      without evidence that the reported profitability survives maintenance,
      remote-operations, warranty, and fleet-integration costs.
    claimRefs: [CV005, CV008, CV011, CV012, CV014]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Public evidence, Decision implication]
    rows:
      - [Recommendation, "Track", "Commercial traction is credible, but price support and audited economics are incomplete."]
      - [Confidence, "Medium-low", "Independent evidence exists, yet key financing and margin inputs remain undisclosed."]
      - [Risk rating, "High", "Execution, capital intensity, safety, and financing risks are material."]
      - [Valuation stance, "Unknown / potentially stretched", "US$3B headline mark lacks verified terms and a reliable revenue denominator."]
      - [Decision implication, "Do not buy on current public evidence", "Reassess after audited financials, cap-table terms, and unit economics."]
    notes: "Public reporting and market research are directional; no row should be read as an audited company disclosure."
    claimRefs: [CV001, CV005, CV008, CV011, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Commercial proof", "2025 revenue above RMB1B, reported profitability, and >RMB1B of 2025 sanitation awards.", "Audited statements show weak cash conversion or material contract concentration."]
      - ["Demand runway", "A reported RMB283.5M three-year Yongkang project and a large potential sanitation market.", "Backlog fails to convert into recognized revenue or renewals."]
      - ["Sector tailwind", "Cleaning robots and robots-as-a-service are forecast to grow through 2031.", "Price competition and service costs compress contribution margins."]
      - ["Valuation risk", "US$3B mark is reported alongside a >US$600M round, but terms are unknown.", "Verified post-money terms and durable margins support a lower risk premium."]
      - ["Exit option", "HKEX Chapter 18C thresholds were temporarily lowered for specialist technology companies.", "A filed, eligible transaction or credible strategic-buyer process emerges."]
    notes: "Arguments mix company-specific reporting with sector and listing-context evidence; they are not comparable valuation multiples."
    claimRefs: [CV001, CV002, CV005, CV010, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risk, Probability signal]
    rows:
      - [Bull, "Orders renew; audited contribution margins are positive; international deployments repeat; financing terms are clean.", "A premium to current mark could be justified by recurring service economics and an IPO or strategic exit.", "Demand and margin claims fail outside flagship deployments.", "Low-to-medium; requires several unverified conditions."]
      - [Base, "Municipal and property deployments grow, but hardware and service revenue remain mixed and margins are moderate.", "Hold or wait for a price reset until audited revenue quality and cap-table terms are available.", "Contract awards do not translate into recurring cash flow.", "Medium; most consistent with current evidence."]
      - [Bear, "Capital intensity, safety requirements, or customer concentration force a down-round or slower deployment.", "Permanent loss risk rises because the US$3B mark is not independently price-anchored.", "Financing and commercialization failure.", "Material; sector sources describe short runway and elimination risk."]
      - [Exit checkpoint, "IPO filing, strategic sale, or independently priced secondary establishes a market reference.", "Use the transaction price only after reconciling preferences, dilution, and debt.", "No liquidity event or adverse terms.", "Unresolved; no COOWA filing is evidenced here."]
    notes: "Scenarios are qualitative decision ranges, not forecasts. No precise valuation range is stated because audited earnings, share count, and transaction terms are unavailable."
    claimRefs: [CV005, CV006, CV010, CV011, CV012, CV013]
