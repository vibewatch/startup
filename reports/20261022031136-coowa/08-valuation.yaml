    title: Track, do not buy on headline valuation
    body: "COOWA's reported commercial maturity is a strength, but public evidence does not yet support a price-sensitive buy decision."
    claimRefs: [CV001, CV005, CV008, CV014]
  - calloutType: risk
    title: The missing denominator is the central risk
    body: "The current mark cannot be judged without audited revenue quality, contribution margins, cap-table preferences, dilution, debt, and backlog conversion."
    claimRefs: [CV005, CV008, CV011, CV012]
