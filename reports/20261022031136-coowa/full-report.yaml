      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The available company profile names He Tao as founder and CEO and identifies Liao Wenlong, Li Kehong, and
              Li Fangqi as co-founders or senior operating leaders. A Baidu Baike entry records He Tao presenting
              COOWA's business and research capabilities in 2020, including smart sanitation, logistics, and mobility
              applications. The profile also identifies Liao as CTO, Li Kehong as COO, and Li Fangqi as CFO, but the
              assigned sources do not provide a board roster, independent-director information, succession plan, or a
              current cap table. Leadership therefore appears founder-centered, with technical, operating, and finance
              functions explicitly attributed to named executives but governance depth not publicly demonstrated in the
              retained evidence. Key-person dependence should remain a diligence item until an IPO filing or equivalent
              corporate disclosure identifies decision rights and oversight.
