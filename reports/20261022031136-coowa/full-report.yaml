      - number: '1.4'
        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The documented trajectory runs from a 2015 founding and autonomous-driving focus to urban sanitation,
              delivery, and patrol deployments, followed by a reported 2021 Series C, a 2022 Series D, and the 2026
              pre-IPO financing and Hong Kong listing preparation. External context is mixed. IFR reported strong 2024
              growth in professional cleaning robots and robot-as-a-service fleets, supporting category demand, while a
              2026 draft Chinese safety standard would make Level 3 and Level 4 requirements mandatory from July 2027 if
              adopted. Unitree's disclosed revenue and profit and Pudu's latest funding valuation provide peer reference
              points, not validation of COOWA's private figures. ChinaBizInsider also highlights short runway and
              consolidation risk across the wider embodied-AI cohort; that sector warning is not evidence that COOWA
              itself faces a liquidity event. Audited economics, financing terms, ownership, customer concentration, and
              governance remain the decisive open items.
