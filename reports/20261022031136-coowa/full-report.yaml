chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              COOWA is identified in the assigned sources as 酷哇科技有限公司, operating under the COOWA, Coowa, and Cowarobot
              names. The available profile describes a company founded in 2015 with legal headquarters and production
              operations in Wuhu, while its founding and major research activity began in Shanghai. Its stated model
              combines autonomous-driving and embodied-AI software with wheeled, quadruped, and humanoid hardware. The
              target customers described in the source are municipalities, state-owned operators, and property groups,
              with products spanning sanitation, smart property, last-mile delivery, and shared shuttles. This breadth
              makes the company more accurately understood as an urban-services robotics integrator than as a
              single-product cleaning-robot vendor. The assigned evidence does not independently verify the legal
              entity, current ownership register, or the economics of its result-as-a-service model.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
