      - number: '1.3'
        title: Capital, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence describes a June 2026 financing of more than US$600 million at a valuation above
              US$3 billion, alongside reported 2025 revenue above RMB 1 billion and operating profitability. The Silicon
              Valley Investclub profile also lists earlier rounds, including a US$250 million Series C in 2021 and a
              Series D with undisclosed proceeds, while labeling cumulative funding above US$895 million. These figures
              should be treated as reported rather than audited: the same profile says the latest valuation and
              financing figures came from Chinese media citing unnamed sources, and the Mugglehead article gives no
              audited statements or financing documents. The operating indicators are nevertheless material for identity
              and maturity: more than 10,000 deployed units across more than 50 cities and regions, and an order backlog
              above RMB 5 billion are described in the retained sources. Exact post-money terms, cash available,
              ownership dilution, margins, and customer concentration remain unverified.
