evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements, revenue-recognition policy, gross margin, operating cash flow, and product-line unit
      economics.
    whyItMatters: >-
      Reported revenue and profitability do not establish cash generation, margin quality, or repeatability of
      deployments.
    diligencePath: >-
      Obtain the Hong Kong IPO application proof, audited financial statements, and management accounts by product and
      customer cohort.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: private-evidence-only
    severity: material
    topic: ownership-and-governance
    missingEvidence: Current cap table, financing terms, board composition, related-party transactions, and succession arrangements.
    whyItMatters: >-
      Founder dependence and a reported private valuation cannot be assessed without control, dilution, and oversight
      information.
    diligencePath: Request the latest shareholder register, financing instruments, board materials, and IPO governance disclosures.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Primary confirmation of the June 2026 post-money valuation and financing amount.
    whyItMatters: >-
      The reported above-US$3 billion valuation and more-than-US$600 million financing are central to valuation analysis
      but rely on secondary reporting.
    diligencePath: Reconcile investor confirmations, executed term sheets, and the eventual IPO filing against the secondary reports.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Complete current executive and board roster, including independent oversight and prior operating history.
    whyItMatters: >-
      The four named leaders do not establish the completeness or depth of the company's governance and functional
      coverage.
    diligencePath: >-
      Use the IPO prospectus, corporate registry, and investor diligence package to complete the leadership and board
      enumeration.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: blocking
    topic: sizing
    missingEvidence: A COOWA-specific SAM/SOM model with eligible geographies, contract counts, pricing, utilization, and capacity.
    whyItMatters: >-
      Category-level unit and funding measures cannot establish the revenue pool or obtainable share relevant to
      valuation.
    diligencePath: >-
      Obtain management's bottom-up market model and reconcile it to signed pipeline, deployed fleet, pricing, and
      service capacity.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: Contract-level evidence on buyer, payer, workflow economics, conversion, renewal, and deployment payback.
    whyItMatters: Without buyer-budget and conversion data, adoption drivers cannot be translated into a defensible SAM or forecast.
    diligencePath: >-
      Request anonymized contracts, pipeline cohorts, pilot-to-paid conversion, utilization, and workflow-level gross
      margins.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      Comparable methodology and denominator definitions for global embodied-AI projections and service-robot unit
      estimates.
    whyItMatters: >-
      Published estimates use different populations, units, and inclusions, so apparent growth rates may not be
      comparable.
    diligencePath: >-
      Reconcile analyst definitions, sample frames, geography, category overlap, and forecast assumptions before using a
      single market number.
    relatedQuestionRefs:
      - QM002
      - QM004
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable realized prices, contract terms, renewal rates, and discounting for COOWA and its principal
      urban-service alternatives.
    whyItMatters: >-
      Without buyer economics, deployment scale cannot be translated into switching costs, pricing power, or durable
      margin advantage.
    diligencePath: Obtain signed customer contracts, renewal cohorts, price books, and contribution margins by product and city.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
