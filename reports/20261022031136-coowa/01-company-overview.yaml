chapter:
  number: 1
  title: Company Overview
  summary: COOWA is a privately held Chinese urban-robotics company founded in 2015 that combines autonomous-driving software with wheeled, quadruped, and humanoid platforms for sanitation, property, delivery, and shared-shuttle use cases. The assigned evidence supports a substantial operating footprint and recent profitability claims, but public confirmation of audited financials, governance, and financing terms remains limited.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: COOWA is identified in the assigned sources as 酷哇科技有限公司, operating under the COOWA, Coowa, and Cowarobot names. The available profile describes a company founded in 2015 with legal headquarters and production operations in Wuhu, while its founding and major research activity began in Shanghai. Its stated model combines autonomous-driving and embodied-AI software with wheeled, quadruped, and humanoid hardware. The target customers described in the source are municipalities, state-owned operators, and property groups, with products spanning sanitation, smart property, last-mile delivery, and shared shuttles. This breadth makes the company more accurately understood as an urban-services robotics integrator than as a single-product cleaning-robot vendor. The assigned evidence does not independently verify the legal entity, current ownership register, or the economics of its result-as-a-service model.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: The available company profile names He Tao as founder and CEO and identifies Liao Wenlong, Li Kehong, and Li Fangqi as co-founders or senior operating leaders. A Baidu Baike entry records He Tao presenting COOWA's business and research capabilities in 2020, including smart sanitation, logistics, and mobility applications. The profile also identifies Liao as CTO, Li Kehong as COO, and Li Fangqi as CFO, but the assigned sources do not provide a board roster, independent-director information, succession plan, or a current cap table. Leadership therefore appears founder-centered, with technical, operating, and finance functions explicitly attributed to named executives but governance depth not publicly demonstrated in the retained evidence. Key-person dependence should remain a diligence item until an IPO filing or equivalent corporate disclosure identifies decision rights and oversight.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Capital, valuation, and operating scale
    body: >-
      The assigned evidence describes a June 2026 financing of more than US$600 million at a valuation above US$3 billion, alongside reported 2025 revenue above RMB 1 billion and operating profitability. The Silicon Valley Investclub profile also lists earlier rounds, including a US$250 million Series C in 2021 and a Series D with undisclosed proceeds, while labeling cumulative funding above US$895 million. These figures should be treated as reported rather than audited: the same profile says the latest valuation and financing figures came from Chinese media citing unnamed sources, and the Mugglehead article gives no audited statements or financing documents. The operating indicators are nevertheless material for identity and maturity: more than 10,000 deployed units across more than 50 cities and regions, and an order backlog above RMB 5 billion are described in the retained sources. Exact post-money terms, cash available, ownership dilution, margins, and customer concentration remain unverified.
    claimRefs: [CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-open-gaps
    title: Milestones and unresolved diligence
    body: The documented trajectory runs from a 2015 founding and autonomous-driving focus to urban sanitation, delivery, and patrol deployments, followed by a reported 2021 Series C, a 2022 Series D, and the 2026 pre-IPO financing and Hong Kong listing preparation. External context is mixed. IFR reported strong 2024 growth in professional cleaning robots and robot-as-a-service fleets, supporting category demand, while a 2026 draft Chinese safety standard would make Level 3 and Level 4 requirements mandatory from July 2027 if adopted. Unitree's disclosed revenue and profit and Pudu's latest funding valuation provide peer reference points, not validation of COOWA's private figures. ChinaBizInsider also highlights short runway and consolidation risk across the wider embodied-AI cohort; that sector warning is not evidence that COOWA itself faces a liquidity event. Audited economics, financing terms, ownership, customer concentration, and governance remain the decisive open items.
    claimRefs: [CO008, CO009, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
