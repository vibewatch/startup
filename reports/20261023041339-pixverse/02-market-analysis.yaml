    approximationNotes: "The middle value is calculated as 0.463 × 946 and is rounded to the nearest million; the six nodes are distinct lenses and should not be read as nested TAM, SAM, and SOM."
    claimRefs: [CM005, CM006, CM007, CM014]
callouts:
  - calloutType: insight
    title: The market is real, but the investable wedge is narrower
    body: Category growth and marketer adoption support demand for AI-video generation, yet PixVerse's serviceable market depends on paid conversion, repeat usage, quality control, and workflow integration rather than registered-user volume alone.
    claimRefs: [CM005, CM009, CM011]
  - calloutType: risk
    title: Measurement and economics remain gating variables
    body: Public evidence does not isolate PixVerse's payer mix, retention, enterprise breadth, or compute-adjusted margins; reported buyer measurement problems and product-quality limitations can delay conversion from experimentation to recurring budget.
    claimRefs: [CM008, CM011, CM012]
