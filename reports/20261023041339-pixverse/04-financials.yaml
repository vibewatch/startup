  - id: TI003
    title: Unit economics and underwriting availability
    columns: [Metric, Public value, Confidence, Why it matters, Diligence request]
    rows:
      - [Revenue / ARR, "Above $40M ARR as of October 2025 reported by Toflow; not independently verified", low, "Tests monetization scale against valuation and funding", "Monthly GAAP/non-GAAP revenue bridge and bank reconciliation"]
      - [Paid-user conversion, null, low, "Registered users and MAU do not establish payer density", "Paid accounts by channel and cohort"]
      - [Net revenue retention, null, low, "Shows whether usage and subscriptions persist", "Cohort retention, expansion, contraction, and churn"]
      - [CAC / payback, null, low, "Separates viral acquisition from scalable GTM", "Marketing spend, new paid accounts, gross-margin payback"]
      - [Gross margin, null, low, "Compute intensity may constrain contribution economics", "GPU, storage, moderation, support, and partner costs by output"]
      - [Cash burn / runway, null, low, "Determines financing dependency after Series C", "Cash balance, monthly burn, committed capex, debt, runway case"]
      - [Realized price per successful second, null, low, "Accounts for failed generations, credits, and discounts", "Usage logs, refunds, credits, and successful-output denominator"]
      - [Enterprise ACV / concentration, null, low, "Tests whether enterprise GTM can support capital needs", "Executed contracts, ACV bands, renewal, and top-customer share"]
    notes: "Unavailable values are intentionally null because the assigned public sources do not disclose them; each null has a concrete diligence request."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI013, CI014]
