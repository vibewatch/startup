    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, track, Do not underwrite a purchase at the reported mark without primary financing and operating data.]
      - [Confidence, medium, Financing headline is corroborated; monetization and terms remain unverified.]
      - [Risk rating, high, "Compute intensity, competition, and commercialization are material downside exposures."]
      - [Valuation stance, stretched, The reported $2B+ valuation lacks a public revenue or preference basis.]
      - [Entry discipline, milestone-gated, "Revisit only after cap-table, unit-economics, and cohort diligence."]
    notes: "The recommendation is an evidence-sensitive judgment; null public revenue, margin, and preference inputs are treated as gaps rather than zeroes."
    claimRefs: [CV001, CV003, CV009, CV010, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Large financing signal, "$439M Series C extension; valuation above $2B reported in July 2026", "Primary term sheet and cap table confirming security terms and investor ownership."]
      - [Product expansion, "V6 supports multi-shot audio-visual generation; R1 and Game Engine target interactive worlds", "Paid usage, renewal, and contribution-margin evidence by product."]
      - [Distribution potential, "More than 150M registered users reported across 177 countries", "Verified active-user, payer-conversion, retention, and regional monetization cohorts."]
      - [Monetization uncertainty, "Public financing coverage does not disclose current revenue or gross margin", "Audited or management revenue bridge, inference cost, gross margin, and cash-burn schedule."]
      - [Competitive pressure, "Runway reported $315M at $5.3B; Kuaishou reports Kling AI revenue", "Evidence of differentiated retention, pricing power, or enterprise win rates."]
      - [Down-round risk, "Sora shutdown illustrates that consumer video popularity can coexist with cost pressure", "Durable revenue growth, gross-margin improvement, and runway through the next model cycle."]
    notes: "Comparable financing and competitor metrics are contextual rather than directly comparable because business mix, accounting basis, stage, and units differ."
    claimRefs: [CV001, CV006, CV007, CV008, CV009, CV011, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Trigger]
    rows:
      - [Bull, "R1/Game Engine become paid products; enterprise adoption and retention are disclosed; inference economics improve.", "Upside is plausible, but no defensible numeric range can be calculated without revenue and margin inputs.", "Low-to-medium; product and funding signals exist but monetization is unproven.", "Verified recurring revenue growth, payer cohorts, gross margin, and repeat enterprise contracts."]
      - [Base, "Consumer scale persists; V6 remains competitive; interactive products require pilots and continued capital.", "Track the reported $2B+ mark rather than assume it is justified by ARR.", "Medium; consistent with the public evidence and unresolved gaps.", "Stable user activity plus credible runway and a transparent financing structure."]
      - [Bear, "Compute costs, model convergence, weak conversion, or delayed R1 commercialization compress growth.", "Down-round or preference-driven dilution risk cannot be quantified without cap-table and cash data.", "Medium; adverse industry evidence and competition make the downside material.", "Cash runway shortens, paid retention disappoints, or a financing reset occurs."]
      - [Decision gate, "No scenario is investable on public evidence alone.", "Require primary documents before setting a target return, entry price, or exit multiple.", "High confidence in the diligence requirement, not in any numeric valuation.", "Term sheet, cap table, revenue bridge, cohorts, margin, and cash schedule received."]
    notes: "No precise valuation ranges or probabilities are invented because the assigned pool lacks verified current revenue, margins, cash burn, dilution, preference, and exit inputs."
    claimRefs: [CV009, CV010, CV012, CV013, CV014, CV015, CV016]
