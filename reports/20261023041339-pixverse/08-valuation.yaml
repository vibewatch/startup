callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: "The reported $2B+ financing mark is supported as a headline, but public evidence does not support a precise entry price, target return, or valuation multiple."
    claimRefs: [CV001, CV003, CV009, CV016]
  - calloutType: risk
    title: Monetization is the gating evidence
    body: "A current revenue bridge, payer cohorts, inference-cost structure, cash runway, and preference terms are required before the financing headline can become an investable valuation."
    claimRefs: [CV009, CV010, CV016]
