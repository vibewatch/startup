      - ["PixVerse Pro", "$24/month in Morphed comparison", "Audio and higher-tier capabilities claimed", "Current plan terms need direct verification", "Higher willingness-to-pay tier may narrow the value gap."]
      - ["Kling Standard", "$6.99/month in Morphed comparison", "660 credits plus audio claimed", "Plan and model availability require verification", "Price pressure is material for photorealistic use cases."]
      - ["Runway Standard", "$12/month annual or $15 monthly in YouArt comparison", "Generation plus editing workflow described", "Credits and model access vary", "Higher price may be justified by production controls."]
      - ["Morphic / Morphed", "Morphed says plans start at $9/month; Morphic's exact price is not shown", "Multi-model image/video workspace claims", "Current billing periods and model entitlements are unverified", "Bundling can reduce separate-tool switching costs."]
    notes: "Prices and entitlements are source-stated snapshots from comparison pages, not realized customer pricing; credit consumption, discounts, taxes and regional terms are unknown."
    claimRefs: [CP008, CP010, CP011, CP013]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: PixVerse is positioned toward stylized specialization and accessible creation, while rivals emphasize workflow breadth or photorealistic production; coordinates are ordinal analyst judgments grounded in retained source descriptions.
    data:
      xAxis: "Workflow breadth and model choice (ordinal)"
      yAxis: "Stylized-video specialization (ordinal)"
      points:
        - {label: PixVerse, x: 3, y: 5, note: "Stylized/anime niche, single-model dependence described by comparison sources"}
        - {label: Runway, x: 5, y: 3, note: "Editing, enterprise and cinematic workflow emphasis"}
        - {label: Kling, x: 3, y: 3, note: "Photorealism, 4K and audio emphasis"}
        - {label: Morphed, x: 5, y: 4, note: "Multi-model image/video breadth claimed by vendor comparison"}
        - {label: Luma, x: 4, y: 3, note: "Cinematic and production partnership emphasis"}
        - {label: "Adobe / manual workflow", x: 4, y: 1, note: "Broad established editing control but limited prompt-native specialization"}
    approximationNotes: "Coordinates are analyst-authored ordinal scores from 1 (low) to 5 (high), not measured performance benchmarks; x measures workflow breadth and model choice, while y measures stylized-video specialization."
    claimRefs: [CP006, CP007, CP008, CP009, CP012, CP016]
callouts:
  - calloutType: insight
    title: PixVerse is differentiated, not insulated
    body: >-
      The evidence supports a differentiated stylized-video position and a potential real-time
      interaction wedge. It does not support treating those features as a durable moat without
      public evidence on paid retention, realized unit economics, enterprise adoption or a
      controlled quality benchmark.
    claimRefs: [CP001, CP010, CP016]
