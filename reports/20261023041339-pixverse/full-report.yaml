            - CU007
        - id: iterate
          label: Iterate
          title: Batch production and API experimentation
          touchpoints:
            - Marketing-agency testing
            - MCN and e-commerce batch use cases
          claimRefs:
            - CU002
            - CU008
        - id: deploy
          label: Deploy
          title: Professional and enterprise workflow integration
          touchpoints:
            - CLI and API access
            - Alibaba commercial deployment signal
          claimRefs:
            - CU003
            - CU009
        - id: expand
          label: Expand
          title: Creator rewards, credits, and film-program participation
          touchpoints:
            - PixVerse Earn campaigns
            - PixLight competition and starter credits
          claimRefs:
            - CU010
            - CU011
        - id: retain
          label: Retain
          title: Retention and account economics still require private evidence
          touchpoints:
