  - id: FM001
    title: Market sizing lenses, not a TAM-to-SOM funnel
    type: pyramid
    summary: >-
      Comparable-looking layers are presented as separate sizing lenses; they do not imply conversion, capture, or
      PixVerse revenue.
    data:
      nodes:
        - label: Global AI video generator market, 2026 upper estimate
          value: 946
          unit: USD millions
          detail: Axis Intelligence's upper estimate; research-firm definitions differ.
        - label: Implied text-to-video segment, 2026 upper-bound arithmetic
          value: 438
          unit: USD millions
          detail: 46.3% of $946M; derived, not a separately reported market total.
        - label: US digital video advertising spend, 2026
          value: 80000
          unit: USD millions
          detail: Adjacent demand pool; includes media and services beyond generation software.
        - label: Global AI video generator market, 2025 lower estimate
          value: 716.8
          unit: USD millions
          detail: Prior-year estimate cited by Axis Intelligence.
        - label: Global AI video generator market, 2034 estimate
          value: 3350
          unit: USD millions
          detail: Long-range estimate cited by Axis Intelligence; not a current forecast for PixVerse.
        - label: AI video venture funding, 2025
          value: 3080
          unit: USD millions
          detail: Category financing lens cited by Axis Intelligence; not market revenue.
    approximationNotes: >-
      The middle value is calculated as 0.463 × 946 and is rounded to the nearest million; the six nodes are distinct
      lenses and should not be read as nested TAM, SAM, and SOM.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM014
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      PixVerse is positioned toward stylized specialization and accessible creation, while rivals emphasize workflow
      breadth or photorealistic production; coordinates are ordinal analyst judgments grounded in retained source
      descriptions.
    data:
      xAxis: Workflow breadth and model choice (ordinal)
      yAxis: Stylized-video specialization (ordinal)
      points:
        - label: PixVerse
          x: 3
          'y': 5
          note: Stylized/anime niche, single-model dependence described by comparison sources
        - label: Runway
          x: 5
          'y': 3
          note: Editing, enterprise and cinematic workflow emphasis
        - label: Kling
          x: 3
          'y': 3
          note: Photorealism, 4K and audio emphasis
        - label: Morphed
          x: 5
          'y': 4
          note: Multi-model image/video breadth claimed by vendor comparison
        - label: Luma
          x: 4
          'y': 3
          note: Cinematic and production partnership emphasis
        - label: Adobe / manual workflow
          x: 4
          'y': 1
          note: Broad established editing control but limited prompt-native specialization
    approximationNotes: >-
      Coordinates are analyst-authored ordinal scores from 1 (low) to 5 (high), not measured performance benchmarks; x
      measures workflow breadth and model choice, while y measures stylized-video specialization.
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP009
      - CP012
      - CP016
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      PixVerse can convert creator and enterprise activity into subscription, credit, and usage revenue, but the public
      record does not quantify conversion, channel take rate, or gross profit.
    data:
      nodes:
        - id: N1
          label: Free and paid creators
          detail: Consumer users enter through free credits, templates, and subscriptions.
        - id: N2
          label: API and enterprise customers
          detail: Developers and commercial teams use monthly API access, credits, or contracts.
        - id: N3
          label: Generated output
          detail: Video activity is metered by credits, seconds, or minutes depending on channel.
        - id: N4
          label: Gross billings
          detail: Public price points exist, but realized billings, discounts, refunds, and partner terms are unavailable.
        - id: N5
          label: Gross profit
          detail: GPU, storage, moderation, support, and distribution costs are not publicly quantified.
        - id: N6
          label: Cash generation
          detail: >-
            Burn, runway, debt, and cash conversion are unavailable, so the bridge cannot establish financing
            independence.
      edges:
        - from: N1
          to: N3
        - from: N2
          to: N3
        - from: N3
          to: N4
        - from: N4
          to: N5
        - from: N5
          to: N6
    approximationNotes: >-
      This is a sourced operating-model schematic, not a proportional financial forecast; no conversion rates or margin
      values are inferred.
    claimRefs:
      - CI001
      - CI003
      - CI008
      - CI013
      - CI014
  - id: FE001
    title: PixVerse product architecture map
    type: stack
    summary: >-
      PixVerse combines multimodal inputs with fixed-clip generation, an interactive world-model path, and developer
      delivery surfaces.
    data:
      layers:
        - label: Experience and delivery
          detail: How users and developers reach the product.
          items:
            - label: Consumer web and mobile surfaces
              detail: Prompt, image, template, and short-video creation workflows.
            - label: Partner API and CLI
              detail: V6 and C1 are described as the immediately integrable developer surfaces.
        - label: Generation modes
          detail: The fixed-clip and interactive product modes.
          items:
            - label: V6
              detail: Multi-shot video, camera controls, native audio, and multilingual in-frame text.
            - label: C1
              detail: Reference-guided and storyboard-oriented production workflow.
            - label: R1
              detail: Continuous interactive video stream responsive to live inputs.
        - label: Model and control mechanisms
          detail: The conditioning and continuity mechanisms described publicly.
          items:
            - label: Multimodal conditioning
              detail: Text, images, video, and audio can steer generation.
            - label: Autoregressive continuity and response engine
              detail: R1 technical description emphasizes memory-augmented continuity and reduced sampling steps.
        - label: Operational dependencies
          detail: Dependencies that determine production viability.
          items:
            - label: Inference compute and access policy
              detail: >-
                Quality, latency, cost, quotas, privacy, and safety controls are not publicly quantified in the assigned
                evidence.
        - label: Inputs and conditioning
          detail: Prompt and reference inputs that shape generated content.
          items:
            - label: Text, image, video, and audio
              detail: R1 is described as accepting multimodal steering inputs.
        - label: Trust and evaluation
          detail: Controls and measurements required before enterprise deployment.
          items:
            - label: Reliability, privacy, and safety evidence
              detail: Public benchmark, governance, and incident-response evidence remains incomplete.
    approximationNotes: >-
      This is a source-bounded product architecture map, not a verified internal systems diagram; component boundaries
      and dependencies are simplified.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE014
  - id: FU001
    title: Customer journey from discovery to expansion
    type: journey-map
    summary: >-
      PixVerse's observable customer path runs from accessible creation and testing to professional integration and
      creator-economy expansion, with monetization and retention evidence becoming thinner at later stages.
    data:
      nodes:
