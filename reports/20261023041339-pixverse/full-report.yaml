        - Medium; adverse industry evidence and competition make the downside material.
        - Cash runway shortens, paid retention disappoints, or a financing reset occurs.
      - - Decision gate
        - No scenario is investable on public evidence alone.
        - Require primary documents before setting a target return, entry price, or exit multiple.
        - High confidence in the diligence requirement, not in any numeric valuation.
        - Term sheet, cap table, revenue bridge, cohorts, margin, and cash schedule received.
    notes: >-
      No precise valuation ranges or probabilities are invented because the assigned pool lacks verified current
      revenue, margins, cash burn, dilution, preference, and exit inputs.
    claimRefs:
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
