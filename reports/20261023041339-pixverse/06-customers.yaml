      - [Marketing agencies, Professional services, "Product promos and ad-creative iteration", "Independent test workflow, not a named customer deployment", "Reviewer reports usable product-promo output and low-cost iteration", "No customer identity or commercial outcome"]
      - [Film studios, Professional media, "Cinematic pre-visualization and concept validation", "Independent test workflow, not a named customer deployment", "Reviewer reports coherent pre-viz output at tested settings", "No studio reference, paid contract, or conversion evidence"]
      - [MCN production houses, High-volume content, "Short-form, B-roll, intros, and transitions", "Independent test workflow, not a named customer deployment", "Reviewer reports a fit for repeatable content production", "No named operator, volume, renewal, or margin evidence"]
      - [Creators participating in PixVerse Earn and PixLight, Creator ecosystem, "Campaign rewards, credits, film competition, and visibility", "Program participation; customer status and paid conversion unspecified", "Company says rewards, starter credits, and a $300,000 prize pool are offered", "Program engagement is not retention or recurring revenue"]
