      coverage: partial
      basis: "Publicly named or described customer cohorts and relationships found in the assigned 2026 source pool; private accounts and undisclosed deployments are excluded."
    notes: "Enumeration is partial: only Alibaba is a named enterprise relationship; the other rows are described cohorts or tested workflows, so production use and outcomes must not be inferred."
