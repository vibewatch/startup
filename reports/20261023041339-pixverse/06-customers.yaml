  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "Segmented NRR, GRR, churn, renewal, contract length, and cohort data for consumer, API, and enterprise customers."
      whyItMatters: "User reach and workflow tests cannot establish durable recurring revenue or customer lifetime value."
      diligencePath: "Request monthly cohort retention, renewal schedules, churn reasons, and paid-versus-free conversion by customer segment."
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-proof
      missingEvidence: "A fuller list of named enterprise, agency, studio, and production-house deployments with production status and outcomes."
      whyItMatters: "The current evidence supports use cases and one reported commercial relationship but not breadth or repeatability of enterprise adoption."
      diligencePath: "Obtain reference calls, contracts or redacted order forms, deployment counts, usage volumes, and customer outcome metrics."
      relatedQuestionRefs: [QU004, QU005]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Top-customer revenue share, channel dependence, ACV distribution, and payer conversion."
      whyItMatters: "A large creator footprint could coexist with concentrated enterprise revenue or low monetization."
      diligencePath: "Request a revenue and usage concentration schedule split by direct, partner, API, and self-serve channels."
      relatedQuestionRefs: [QU009]
