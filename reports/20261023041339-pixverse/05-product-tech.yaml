callouts:
  - calloutType: strength
    title: Workflow integration is the clearest product strength
    body: PixVerse is moving beyond isolated short clips toward multi-shot, audio-aware, reference-guided, and developer-integrated workflows, which could increase switching costs if reliability and controls mature.
    claimRefs: [CE005, CE006, CE010]
  - calloutType: risk
    title: Production readiness remains under-documented
    body: Public sources do not establish benchmarked reliability, API service levels, privacy controls, safety performance, or long-horizon consistency, so enterprise deployment risk remains material.
    claimRefs: [CE011, CE012, CE013, CE014]
