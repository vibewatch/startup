      - ["Audio, text and localization", "Native audio and multilingual in-frame text accompany video", "Synchronized multimodal generation", "Dialogue, text accuracy and policy failures need measured testing"]
      - ["Delivery and integration", "Consumer surfaces, partner APIs and CLI workflows distribute outputs", "Platform access, quotas, storage and developer tooling", "Unclear SLAs, governance, privacy and reproducibility"]
    notes: "Architecture rows synthesize descriptions in assigned technical and ecosystem sources; they are not a disclosed reference architecture or an independently verified systems diagram."
