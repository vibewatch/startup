company:
  name: PixVerse
chapter:
  number: 1
  title: Company Overview
  summary: PixVerse is a Singapore-based AI video-generation company founded in 2023 by Wang Changhu and Jaden Xie. Current evidence supports a broad consumer and professional product portfolio, a July 2026 Series C extension that took the reported valuation above $2 billion, and rapid product expansion, while revenue quality, investor economics, and governance depth remain incompletely disclosed.
sections:
  - id: identity-and-product
    title: Identity, product, and operating footprint
    body: PixVerse is described by multiple third parties as a Singapore-based company founded in 2023 by Wang Changhu and Jaden Xie. Its product architecture spans a V-Series for consumer and API use, a C-Series for professional film and commercial workflows, and an R-Series of world models aimed at game development and world building. Tracxn describes the underlying business as developing AI models for automated video content generation from text, images, and audio, with multi-shot storytelling, character consistency, lip-syncing, and API integration. TechCrunch reports 150 employees across Singapore, Beijing, and Shanghai, while the same article says the company plans to hire researchers and go-to-market staff. These sources establish a globalizing product and hiring posture, but not a complete legal-entity or governance map.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: founders-and-leadership
    title: Founders, leadership, and key-person dependence
    body: The available record identifies Wang Changhu as co-founder and CEO and Jaden Xie as co-founder and president; TechCrunch reports that Changhu previously worked at ByteDance on computer vision and that Xie was an executive director at Lighthouse Capital. The evidence gives useful founder-market-fit signals but does not establish a full executive roster, board composition, independent directors, or succession planning. Xie's account of PixVerse's differentiation emphasizes labeling and prior ByteDance visual-understanding experience, suggesting that technical judgment and data-labeling capability remain concentrated in the founding team. The absence of public governance detail is therefore a diligence gap rather than evidence of weak governance.
    claimRefs: [CO005, CO006]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, valuation, and disclosed scale
    body: TechCrunch reports that PixVerse closed a $439 million Series C extension in July 2026 and that the company said its valuation crossed $2 billion. The same report says the initial Series C close occurred in March and was led by CDH Investments, with Bloomberg reporting an amount in the range of $300 million, while the extension included Alibaba, Lollapalooza Capital, Ivy Capital, Grand Mount Capital, Eastern Bell Capital, Mirae Asset, BlueFocus, and CloudAlpha, alongside returning investors iGlobe Partners and Lion X Ventures. This is round-level financing evidence, not proof of lifetime capital raised or cash available. The article reports more than 150 million registered users and more than 15 million monthly active users, but says PixVerse declined to specify paying users. Tracxn's fetched profile is stale or contradictory, describing the company as unfunded, so funding and valuation should be anchored to the dated 2026 reporting while the conflict is retained.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO015]
    tableRefs: [TO003]
  - id: milestones-and-open-diligence
    title: Milestones, partnerships, and unresolved diligence
    body: PixVerse's recent milestones show a shift from a short-form generation product toward multimodal production and interactive world-model ambitions. A March 2026 PRNewswire release announced V6 with multi-shot generation, native audio, multilingual in-frame text, and CLI access for developer and agentic workflows; the release also acknowledges that precise directional control in complex scenes and consistency across major spatial changes remain areas for improvement. TechCrunch says the R-Series world models were released earlier in 2026, that PixVerse has an Alibaba deployment deal, and that the company planned a new V-Series model and world-model version during the year. Third-party reviews report short clips, credit-based pricing, and occasional glitches, but those commercial reviews are not substitutes for audited revenue, retention, compute-cost, or customer-quality evidence. The key conclusion is momentum with material disclosure gaps.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
