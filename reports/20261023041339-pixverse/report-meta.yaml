companyProfile:
  summary: >-
    PixVerse is a Singapore-based AI video-generation company founded in 2023 by Wang Changhu and Jaden Xie. Its public
    product footprint spans consumer text-to-video and image-to-video creation, professional and API workflows, and
    interactive world-model products. The company has reported rapid user scale and a July 2026 Series C extension that
    took its reported valuation above $2 billion, but public evidence does not establish revenue quality, payer
    conversion, retention, margin, cash runway, or financing terms.
