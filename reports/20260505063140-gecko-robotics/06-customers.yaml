- id: s603
  title: "Named Customer Proof \u2014 Commercial and International"
  body: "Outside defense, Gecko's largest confirmed commercial contracts are NAES (U.S. power)\nand ADNOC Gas (UAE oil and gas), supplemented by anonymous industrial case studies\nand the L3Harris aerospace collaboration.\n\nNAES Corporation, \"America's largest independent power operator with 65GW under\nmanagement,\" announced a $100M+ multi-year deal in February 2025 with an option to\ngrow beyond $250M. The agreement targets thermal and renewable energy assets and\nincludes White House backing tied to the national energy emergency declaration.\nGovernor Josh Shapiro of Pennsylvania, NAES President Mark Dobler, and CEO Loosararian\nall provided named endorsements. The Robot Report, POWER magazine, and NAES's own\npartnership page independently confirm the deal \u2014 triple-source corroboration.\n\nADNOC Gas (ADX: ADNOCGAS), a state-owned Abu Dhabi National Oil Company subsidiary,\nsigned a multi-year contract in April 2024 valued at AED 110M ($30M USD) through Al\nMasaood Energy as local\
    \ partner. Pilot results showed 99.6% increase in asset coverage\nand 93%+ efficiency improvement over manual processes. The contract enables online\ninspections while assets remain operational, and is projected to reduce Lost Time\nInjury rates by 33% by eliminating scaffold requirements. offshore-technology.com\nindependently confirmed the contract details. A November 2025 Gecko news headline\nconfirms the ADNOC relationship was active 18+ months after the contract signing.\n\nThe L3Harris collaboration (announced April 2025) is a joint development partnership\non XR aircraft inspection using drone-based 3D imaging, tested over 12 months with\nmultiple military customers. Anonymous case studies include a steel mill ($40M annual\nvalue, 5x ROI, 30% downtime reduction) and a pulp mill ($3M per tank savings, 10-year\nlife extension).\n"
