chapter:
  number: 6
  title: Customers & Customer Evidence
  summary: "Gecko Robotics' customer base spans at least seven distinct verticals \u2014 defense manufacturing,\nmaritime sustainment, power generation, oil and gas, aerospace, steel, and pulp and paper \u2014 with\npublicly confirmed relationships covering U.S. military programs, domestic energy operators, and\nan international state-owned energy company. Named customers with publicly disclosed contracts\ninclude the U.S. Navy ($71M IDIQ, March 2026), NAES Corporation ($100M+ deal, February 2025),\nADNOC Gas ($30M multi-year, April 2024), BPMI (90% inspection reduction, July 2025), Trident\nMaritime (20 facilities, January 2026), U.S. Air Force Sentinel, Columbia-class sub program,\nand L3Harris Technologies. Anonymous case studies document $40M annual value for a steel mill\nand $3M per-tank savings for a pulp mill. Outcome metrics are customer-attributed in press\nreleases with named executive endorsements from BPMI, Trident, NAES, and the Navy. Key gaps\ninclude no public revenue split\
    \ between defense and commercial, no disclosed NRR or churn data,\nand anonymous identities for steel, pulp, and mining customers.\n"
sections:
- id: s601
  title: Customer Base Overview and Vertical Segmentation
  body: "Gecko Robotics serves customers across at least seven industrial verticals as of mid-2026,\nspanning U.S. government defense programs, domestic commercial energy operators, and\ninternational state-owned energy companies. Named customers with publicly documented\ncontracts include the U.S. Navy (Pacific Fleet surface ships and submarine programs),\nBPMI (Bechtel Plant Machinery \u2014 nuclear component manufacturing for the Naval Nuclear\nPropulsion Program), Trident Maritime Systems (U.S. Navy supply chain), the U.S. Air\nForce (Sentinel ICBM silo modernization), ADNOC Gas (Abu Dhabi), NAES Corporation (U.S.\npower grid), and L3Harris Technologies (aircraft maintenance). Unnamed customers in\npublished case studies include a large steel manufacturer and a pulp and paper mill.\nA reference to Freeport-McMoRan on Gecko's mining industry page implies a mining\ncustomer relationship, but no contract details have been published.\n\nThe customer base maps onto Cantilever's three workflow\
    \ modules. BUILD (advanced\nmanufacturing quality assurance) customers include BPMI, Trident, and the Columbia-class\nsubmarine program. SUSTAIN (maritime and asset health) customers include the U.S. Navy\nsurface fleet, USAF Sentinel, and ADNOC Gas. MODERNIZE (legacy infrastructure digitization)\ncustomers include NAES, the anonymous steel mill, the pulp mill, and power plant operators.\nThe Navy relationship spans both BUILD and SUSTAIN phases, making it a cross-module\ndeployment. No European or Asia-Pacific production customers have been publicly confirmed.\nInternational revenue is currently limited to ADNOC Gas in the UAE.\n\nGecko opened an international headquarters in Abu Dhabi under the Ministry of Economy's\nNextGenFDI program, and the November 2025 announcement of ongoing ADNOC AI and robotics\nskills training confirms the Middle East footprint is active. The CEO has presented at\nthe World Economic Forum Annual Meeting (January 2026), citing Gecko's global ambitions\nfor\
    \ industrial asset intelligence. However, no contracts outside the U.S. and UAE have\nbeen publicly disclosed as of the May 2026 run date.\n"
