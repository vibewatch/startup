- id: s605
  title: Customer Concentration, Adverse Signals, and Diligence Gaps
  body: "Customer concentration risk is material. Defense and government programs represent\nfive of eight named customers (Navy, BPMI, Trident, Columbia-class, USAF Sentinel) and\na majority of publicly disclosed contract value. Commercial customers NAES ($100M+) and\nADNOC ($30M) add meaningful diversification, but no European or Asia-Pacific production\ncustomers have been announced. A single government budget cycle change could materially\naffect Gecko's revenue trajectory, particularly given IDIQ-structured contracts.\n\nThe primary adverse signal is a 2023 trade secret lawsuit: Gecko Robotics, Inc. v.\nSummit NDE, LLC (N.D. Indiana, No. 2:23CV229). Gecko alleged two former employees who\njoined competitor Summit NDE misappropriated inspection technology trade secrets. This\nis a competitive IP dispute \u2014 not a customer-facing dispute \u2014 and no customer relationship\nis implicated in the available public record. No evidence of customer churn, contract\ncancellations, or customer\
    \ complaints appeared in public sources reviewed.\n\nChannel dependency risk exists: the ADNOC deal was structured through Al Masaood Energy\nas a local UAE channel partner, and the Navy IDIQ runs through the GSA government-wide\nvehicle. Intermediary channels could introduce margin or control risk if those partner\nrelationships evolve. Steel, pulp, and mining customers are anonymous in all public\nmaterials, making relationship depth and satisfaction unverifiable from outside. No NPS\ndata, renewal rates, or NRR metrics have been publicly disclosed, making retention quality\nunquantifiable from external analysis.\n"
