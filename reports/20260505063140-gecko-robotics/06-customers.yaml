- id: s604
  title: Adoption Trajectory, FDE Stickiness, and Retention Signals
  body: "Gecko's customer acquisition trajectory shows clear acceleration from 2022 to mid-2026.\nFrom 2015 to 2022, Gecko built its reputation in power generation and oil and gas with\nunnamed industrial customers. The 2022\u20132023 period formalized defense relationships:\nUSAF Sentinel (2022), Columbia-class demonstration (November 2023), and Series C + Series\nC extension ($173M total) with Founders Fund and USIT board seats reflecting institutional\ndefense investor confidence. From 2024 to mid-2026, the portfolio expanded with ADNOC\n(April 2024), NAES (February 2025), BPMI (July 2025), Trident (January 2026), and the\nNavy IDIQ (March 2026). The Series D ($125M, June 2025) at a $1.25B valuation cited\nNAES, L3Harris, and ADNOC as momentum proof-points.\n\nRetention signals are strong in the public record. The Navy relationship evolved from\nsurface fleet maintenance to submarine programs to a government-wide IDIQ \u2014 consistent\nwith a deepening, multi-phase engagement. ADNOC\
    \ Gas continued into a multi-year contract\nand the November 2025 training initiative signals ongoing relationship investment. The\nNAES deal includes a $250M option for expansion. Cox Enterprises (Series D lead) and\nFounders Fund both cited customer durability and cross-vertical breadth as investment\nthesis anchors.\n\nThe Forward Deployed Engineering model is Gecko's primary retention mechanism. By\nembedding engineers at customer sites to build mission-specific Cantilever extensions,\nGecko creates three switching cost layers: proprietary digital twins and historical data,\ncustom software workflows, and FDE staff institutional knowledge. No public evidence of\ncustomer churn, contract cancellations, or customer-facing complaints appeared in any\nreviewed source. The Forbes founder profile (2022) describes power plant customers with\nmulti-year tenure dating to 2015\u20132017, suggesting long-lived customer relationships.\n"
