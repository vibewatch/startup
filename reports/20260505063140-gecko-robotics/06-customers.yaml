- id: s602
  title: "Named Customer Proof \u2014 U.S. Defense and Government Programs"
  body: "Gecko's defense customer portfolio is the most thoroughly documented segment, with five\ndistinct U.S. military program relationships evidenced through official press releases,\nU.S. government spending records, and third-party news coverage.\n\nThe U.S. Navy relationship is the single largest confirmed contract. A five-year IDIQ\nwith a $71M ceiling was awarded via GSA in March 2026, covering 18 ships in the U.S.\nPacific Fleet as the initial task order ($54M ceiling). The GSA vehicle is accessible\nto all U.S. military services. Prior to this IDIQ, Gecko worked across the Navy's\nsurface fleet \u2014 destroyers, amphibious warships, aircraft carriers \u2014 and both Virginia-\nclass and Columbia-class nuclear submarine programs. A single robotic evaluation of a\nNavy flight deck eliminated over 208 days of potential maintenance delay. The Chief of\nNaval Operations' 80% fleet readiness target by 2027 was cited in the contract\nannouncement. Navy CTO Justin Fanelli and Senator\
    \ Dave McCormick provided named\nendorsements. A January 2025 GAO report on Navy surface ships documented the structural\nmaintenance backlogs that make Gecko's offering mission-critical.\n\nBPMI, the prime contractor for the Naval Nuclear Propulsion Program, announced a\nproduction partnership in July 2025 reducing inspection spans for forged components\nby up to 90% \u2014 from weeks to days. BPMI President Barb Staniscia provided a named\nexecutive endorsement. Trident Maritime Systems announced a January 2026 partnership\nacross 20 fabrication facilities targeting 40% throughput improvement; Trident COO\nTrip Mullen endorsed the results. The Columbia-class submarine demonstration contract\n(November 2023, via BlueForge Alliance) validates weld inspection ROI across the\nsupply chain. The USAF Sentinel ICBM program is documented via USASpending.gov award\nFA942222C0015 and confirmed in Gecko's December 2023 Series C extension press release.\n"
