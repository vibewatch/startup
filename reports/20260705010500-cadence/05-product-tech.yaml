- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / assurance
  - Status
  - Scope
  - Evidence
  - Gap / risk
  rows:
  - - Clinician review of AI-supported recommendations
    - Publicly stated as active
    - Medication recommendations and escalation decisions
    - Hartford says every recommendation is reviewed and completed by a clinician
    - Need pathway-by-pathway override rates and exception handling logs
  - - Shared clinical protocols with partner systems
    - Publicly stated as active
    - Workflow governance and brand-specific care delivery
    - Hartford and MedCity describe operation under partner clinical protocols and brand
    - No public protocol library or change-management documentation
  - - HIPAA / provider privacy protections
    - Publicly stated
    - Patient information flowing through Duke program
    - Duke says health information is protected under HIPAA and Duke privacy policies
    - No public third-party audit artifact is linked from the reviewed product pages
  - - Internal AI evaluation and guardrails
    - Publicly signaled through hiring materials
    - RAG, reasoning, evaluation, regression, escalation
    - Senior AI Engineer role names safety tests, regression suites, LLM-as-judge, and human-in-the-loop paths
    - Public evidence does not quantify observed model quality or runtime error rates
  - - Peer-reviewed clinical outcomes
    - Strong relative to private-company norm
    - Hypertension, utilization, heart failure, patient experience
    - 'Cadence evidence page cites JACC: Advances, NEJM Catalyst, Journal of Cardiac Failure, and Mayo outcomes'
    - Most evidence is summarized by Cadence rather than linked with full-text quality details on-site
  - - Reimbursement and policy exposure
    - Material dependency remains
    - RPM and broader chronic-care reimbursement economics
    - Healthcare Finance News and Healthcare Dive show ongoing payer / regulatory scrutiny in 2026
    - Billing or policy tightening could pressure product economics even if clinical outcomes remain positive
  notes: Trust evidence is weighted toward workflow governance, clinician supervision, and partner privacy language; public third-party security and uptime artifacts remain limited.
