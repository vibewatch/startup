- id: trust-quality-and-critical-dependencies
  title: Trust, Quality, and Critical Dependencies
  body: 'Cadence’s trust story is stronger on clinical governance than on public security disclosure. Partner sources repeatedly state that AI-supported recommendations are reviewed by clinicians, run through shared clinical protocols, and stay connected to the patient’s existing provider relationship. Duke explicitly tells patients their information is protected under HIPAA and Duke privacy rules, while Hartford describes medical-group oversight and protocol governance. The AI hiring page adds evidence of internal evaluation, regression testing, and human-escalation logic. However, public materials reviewed for this report do not expose uptime SLAs, false-positive rates, model-drift metrics, SOC 2 artifacts, or public API documentation. Product risk also extends beyond software: Cadence’s operating model depends on partner brands, clinician review capacity, home-device data flow, and RPM reimbursement conditions that remain under payer and regulatory scrutiny.'
