company:
  name: Cadence
chapter:
  number: 5
  title: Product & Technology
  summary: 'Cadence sells a partner-embedded chronic-care operating model rather than a standalone RPM app: partner-branded programs place connected devices, daily signal monitoring, supervised AI agents, and clinician follow-up inside health-system EMRs and protocols. Public evidence is unusually strong for a private digital-health company—100K+ active patients, 20+ health-system partners, and peer-reviewed blood-pressure, utilization, and cost outcomes—but trust disclosures still lean more on clinician supervision and workflow integration than on public security or reliability artifacts.'
sections:
- id: product-definition-and-modules
  title: Product Definition and Module Map
  body: 'Cadence presents itself as “clinical AI for chronic care,” but the product is best understood as a health-system-embedded service stack with software, care operations, and partner branding bundled together. Public materials consistently describe a system that tracks patient vitals, symptoms, medications, and engagement between office visits; routes those signals through supervised AI workflows; and turns the output into protocol-based clinician action. The company is not selling consumer self-management software alone. It combines patient enrollment, device distribution, daily monitoring, medical-group staffing, EMR integration, and white-labeled delivery under partner health-system brands. That operating model explains why Cadence can claim both software-like scale and services-heavy differentiation: the product asset is not a single app but a tightly coupled remote-care system spanning patient, clinician, and payer workflows.'
  claimRefs:
