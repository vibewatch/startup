- id: maturity-roadmap-and-diligence-gaps
  title: Maturity, Roadmap, and Diligence Gaps
  body: 'Cadence’s maturity is highest where it combines partner deployment evidence with peer-reviewed outcomes: hypertension, broader chronic-care utilization reduction, and heart-failure medication optimization are all supported by public evidence summaries. Roadmap signals are also visible. Series C proceeds are earmarked for advancing AI agents, expanding value-based care, and entering new health systems; the ACCESS launch extends Cadence into community-practice and CKM pathways; and current technical hiring indicates ongoing investment in agent reliability and scale. Still, key underwriting gaps remain. Public materials do not reveal pathway-level automation rates beyond the headline 55% alert-resolution figure, do not publish reliability dashboards, and do not show how generalizable current outcomes are across every white-labeled partner environment. Product quality appears promising, but diligence still depends on non-public operating data.'
