- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  - Observed public signal
  rows:
  - - Home-device and signal ingestion layer
    - Collects daily vitals from BP, weight, and glucose devices
    - Patient adherence, device logistics, and secure transmission
    - Signal gaps or device drop-off can degrade alert quality
    - Partner pages describe device types and automatic transmission but not the vendor stack
  - - Clinical Intelligence monitoring layer
    - Tracks vitals, symptoms, medications, and engagement to surface risk
    - Clinical protocols, patient data freshness, and EMR context
    - Black-box monitoring quality is hard to assess externally
    - Homepage explicitly shows Identify / Extend / Improve logic and protocol-driven titration
  - - Agent orchestration layer
    - Runs alert review, recommendation generation, and workflow actioning
    - LLM / agent stack, tool orchestration, evaluation, and human escalation
    - Model-quality or cost failures could affect clinician trust and economics
    - Senior AI Engineer role cites retrieval, reasoning, tool use, RAG, and multi-step orchestration
  - - Evaluation and safety layer
    - Benchmarks, safety tests, regression suites, and escalation guardrails
    - Internal QA process and access to real-world labeled data
    - No public benchmarks or guardrail outcomes are disclosed
    - Hiring page names offline benchmarks, LLM-as-judge evaluation, and human-in-the-loop escalation
  - - Partner integration layer
    - Embeds Cadence inside medical groups, EMRs, and ongoing workflows
    - Health-system cooperation, workflow design, and billing integration
    - No public API / SDK docs create integration diligence blind spots
    - Company materials repeatedly emphasize deep EMR and workflow embedding
  - - Operating-service layer
    - Transforms software output into clinician action and patient outreach
    - Cadence medical group staffing and partner protocol alignment
    - Service quality depends on staffing productivity as much as software reliability
    - MedCity and partner pages describe a 300+ person care organization and 24/7 support promise
  notes: Architecture is reconstructed from product copy, partner workflows, and AI hiring pages because Cadence does not publish a formal technical architecture document or API reference.
