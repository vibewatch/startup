callouts:
- calloutType: strength
  title: Partner-branded delivery is a real moat, not just a marketing choice
  body: Cadence’s product is harder to swap out than a generic RPM dashboard because it sits inside the provider’s brand, protocols, care team, and EMR workflow. Duke Health Connected and HHC Remote Care show the company winning trust through partner identity rather than trying to own the patient relationship directly.
  claimRefs:
  - CE029
  - CE031
  - CE041
  - CE042
- calloutType: strength
  title: Public outcomes evidence is unusually strong for a private chronic-care platform
  body: Cadence publicly cites peer-reviewed utilization, blood-pressure, heart-failure, and patient-experience outcomes instead of relying only on case studies or marketing testimonials. That does not remove diligence needs, but it materially raises the quality bar versus many private RPM vendors.
  claimRefs:
  - CE013
  - CE014
  - CE017
  - CE018
  - CE020
- calloutType: risk
  title: Technical transparency lags the ambition of the AI narrative
  body: The hiring pages suggest a sophisticated agentic stack, yet public materials do not expose external API docs, uptime metrics, model-quality dashboards, or public security artifacts. Investors can see where Cadence is heading technically, but not enough to underwrite reliability from public evidence alone.
  claimRefs:
  - CE033
  - CE035
  - CE049
  - CE050
  - CE051
- calloutType: risk
  title: Product economics remain exposed to RPM scrutiny
  body: Even if the clinical workflow works, Cadence still depends on reimbursement and policy conditions that independent press is already scrutinizing in 2026. That creates downside risk if payer controls tighten faster than Cadence can shift mix toward value-based care arrangements.
  claimRefs:
  - CE043
  - CE044
