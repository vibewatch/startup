  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-transparency
    missingEvidence: Public SOC 2 Type II, HITRUST, ISO 27001, or comparable third-party audit artifacts and scope statements for Cadence itself.
    whyItMatters: Public trust claims are currently anchored in clinician review and partner privacy language, which is weaker than external assurance when underwriting enterprise software and data-handling risk.
    diligencePath: Request the latest security package, third-party audit letters, certification scope documents, and customer security-review questionnaire responses.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: developer-surface
    missingEvidence: Public or controlled-access API, SDK, interface, or implementation documentation showing how partner engineering teams integrate with Cadence.
    whyItMatters: EMR and workflow embedding is core to the moat, but the absence of technical integration documentation makes it hard to judge implementation burden, extensibility, and lock-in.
    diligencePath: Request partner integration architecture docs, interface specs, implementation playbooks, and sample project timelines from a recent health-system deployment.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability-transparency
    missingEvidence: Runtime reliability metrics such as uptime, alert precision/recall, false-positive rates, clinician override rates, latency distributions, and model-drift monitoring.
    whyItMatters: Cadence’s product promise depends on trustworthy, timely intervention between visits; without quantitative reliability data, investors cannot fully assess safety, operational leverage, or failure modes.
    diligencePath: Request reliability dashboards, post-incident reviews, QA scorecards, and pathway-level operating metrics from the clinical operations and engineering teams.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
