- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Cadence solution
  - Measurable benefit
  - Limitation / gap
  rows:
  - - Manage hypertension between office visits
    - Intermittent office readings and reactive outreach
    - Daily home BP readings, AI triage, protocol-guided clinician follow-up
    - 70% relative increase in blood-pressure control; 7/5 mmHg average BP reduction in cited evidence
    - No public false-positive or escalation-rate breakdown by alert type
  - - Keep heart-failure patients on guideline therapy
    - Delayed titration and incomplete medication optimization between visits
    - Vitals monitoring plus medication-titration workflow and clinician outreach
    - 230% increase in heart-failure patients on GDMT in company-cited evidence
    - No public cohort-level persistence or discontinuation data by partner
  - - Support diabetes / blood-sugar monitoring at home
    - Periodic visit-based review of glucose trends
    - Glucose-meter-based daily monitoring with coaching and outreach
    - Hartford and Duke materials explicitly include diabetes / high blood sugar pathways
    - No public disease-specific outcomes page for diabetes comparable to hypertension evidence
  - - Run partner-branded chronic-care support
    - Health system must assemble its own remote-care brand, staffing, and escalation operations
    - Cadence operates white-labeled programs under the health system brand and protocols
    - Patients interact through trusted local brands like Duke Health Connected and HHC Remote Care
    - Need patient-retention and satisfaction data by branded program, not just company-wide proof points
  - - Provide around-the-clock support between visits
    - After-hours questions and abnormal readings may wait for the next clinic touchpoint
    - Cadence care teams review readings daily and advertise around-the-clock support in partner materials
    - 3.5-minute median alert response and 55% alert resolution without human adjustment in cited materials
    - No public SLA or incident-reporting history for the around-the-clock service layer
  notes: Workflow rows focus on publicly documented use cases rather than every disease program Cadence may run privately; benefit numbers reflect company-cited evidence and partner pages, not audited customer scorecards.
