tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Partner-branded remote-care programs
    - Health systems, patients
    - Production; Duke Health Connected and HHC Remote Care are live public examples
    - Delivered under partner brand and care relationship rather than a standalone Cadence consumer brand
    - Need renewal / expansion data by partner and cohort economics by program
  - - Clinical Intelligence monitoring layer
    - Cadence care team, partner clinicians
    - Production; tracks vitals, symptoms, medications, and engagement
    - Moves beyond passive dashboarding by flagging risk before crisis and structuring action between visits
    - No public precision / recall or false-positive-rate disclosures
  - - Protocol-driven medication and coaching workflows
    - Clinicians, nurses, NPs, patients
    - Production; daily signal review and protocol-based intervention are publicly described
    - Combines AI support with clinician supervision and local health-system protocols
    - Need pathway-level automation and override statistics
  - - EMR and workflow embedding
    - Partner medical groups, physicians
    - Production; directly integrated into medical groups, EMRs, and clinical workflows
    - Raises switching costs versus a bolt-on RPM vendor
    - No public API, SDK, or interface documentation for third-party technical diligence
  - - Cadence medical-group operations
    - Patients, partner health systems
    - Production; MedCity reports 300+ staff across physicians, nurses, and NPs
    - Lets Cadence deliver a service outcome, not just software licensing
    - Need staffing productivity, licensure mix, and clinician-to-patient ratios by pathway
  - - AI-agent expansion roadmap
    - Cadence operations and product teams
    - Scaling; Series C and hiring pages point to deeper agent deployment
    - Public hiring materials show agent orchestration, RAG, and evaluation investments beyond marketing copy
    - Need evidence of agent performance by workflow before assuming broad operating leverage
  notes: Rows combine official company pages, partner program pages, and independent reporting; maturity labels are author assessments based on publicly visible operating proof rather than company-issued tiers.
