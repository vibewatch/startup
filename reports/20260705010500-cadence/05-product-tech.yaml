- id: operating-workflow-and-use-cases
  title: Operating Workflow and Use Cases
  body: 'The public workflow is specific enough to describe how Cadence operates in production. Health systems or clinicians enroll patients, Cadence sends or supports simple home devices, and readings flow automatically to care teams. Duke Health Connected names blood-pressure monitors, weight scales, and glucose meters; Hartford’s patient materials describe the same model at a broader chronic-care level. Once data arrive, supervised AI agents and care teams monitor daily signals, flag concerning changes, recommend medication titration under protocol, and trigger phone outreach or coaching. The patient does not experience a generic Cadence portal so much as a branded extension of Duke or Hartford. This white-labeled presentation matters commercially and operationally: it lowers trust friction, preserves continuity with the local provider, and lets Cadence claim 24/7 availability without forcing a new patient-brand relationship.'
