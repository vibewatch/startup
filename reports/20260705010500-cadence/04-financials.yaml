callouts:
  - calloutType: strength
    title: "Capital-Efficient Reimbursement Model"
    body: >-
      Payer reimbursement covers ongoing operations, meaning raised capital funds growth rather than
      subsidizing losses, unlike many digital health companies.
    claimRefs: [CI001, CI014]
  - calloutType: risk
    title: "Single Revenue Source Concentration"
    body: >-
      Substantially all revenue derives from RPM CPT codes vulnerable to CMS policy changes,
      creating existential financial risk from a single regulatory decision.
    claimRefs: [CI023, CI025]
  - calloutType: assumption
    title: "Revenue Estimate Uncertainty"
    body: >-
      All revenue estimates are derived from patient count × billing rates; actual revenue depends on
      code utilization rates, patient compliance, and payer mix that remain undisclosed.
    claimRefs: [CI006, CI021]
