slug: cadence
runDate: '2026-07-05'
company:
  name: Cadence
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Cadence tripled ARR in 2025 and raised $241M total, achieving a $1.23B valuation. Revenue is driven
    by per-patient monthly RPM billing (CPT 99454/99457) estimated at $60-150/patient/month. Unit economics
    are capital-efficient given payer reimbursement model, though absolute revenue and margin data remain
    undisclosed as a private company.
sections:
  - id: revenue-model
    title: "Revenue Streams and Monetization"
    body: >-
      Cadence generates revenue primarily through monthly insurance reimbursement for remote physiologic
      monitoring services. The company bills Medicare and commercial payers using CPT codes 99454 (device
      supply and data transmission, ~$64/month), 99457 (clinical monitoring time, ~$52/month), and 99458
      (additional clinical time, ~$42/month). Combined per-patient monthly billing ranges from $60-150
      depending on code combination and payer. With 100,000+ active patients, this suggests a revenue run
      rate potentially in the $70-180M range, though the company has only disclosed that ARR tripled in 2025
      without revealing absolute figures. Secondary revenue streams may include value-based care contracts
      where Cadence shares in cost savings generated for health systems, and program management fees for
      implementation and integration services. The company's plan to expand into value-based care models
      with its Series C funding suggests this could become a material revenue stream. The Medicare savings
      claim of $2.7M per week ($140M annualized) provides a ceiling on the value Cadence creates, though
      the company captures only a fraction of this through billing.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics
    title: "Unit Economics and Margin Structure"
    body: >-
      Cadence's unit economics center on per-patient monthly contribution margin. Revenue per patient is
      estimated at $60-150/month from RPM billing. Key cost drivers include clinical labor (nurses, NPs,
      physicians at approximately $20-40/patient/month depending on patient-to-clinician ratio), connected
      device costs (amortized at approximately $5-10/patient/month), technology platform costs ($3-8/patient),
      and patient engagement overhead ($2-5/patient). This suggests gross margins in the 40-65% range
      depending on clinical labor efficiency, which AI automation is designed to improve. The supervised AI
      agent model aims to increase patient-to-clinician ratios from traditional 200-300:1 to potentially
      500-1000:1, which would dramatically improve unit economics if achieved. The company's tripling of ARR
      in 2025 while maintaining a clinical team of 300+ suggests either significant patient volume growth or
      improving per-patient economics. Without disclosed margins, the financial health of the business remains
      a key diligence question, though the ability to raise $100M at $1.23B suggests investors have visibility
      into attractive unit economics in the data room.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: capital-structure
    title: "Capital Adequacy and Funding History"
    body: >-
      Cadence has raised $241M in total funding: a Series A led by Thrive Capital (amount undisclosed), a
      $100M Series B in December 2021, and a $100M Series C in June 2026 led by Spark Capital at $1.23B
      post-money. The company's burn rate is unknown but the 4.5-year gap between Series B and C suggests
      either capital efficiency or that the Series B lasted longer due to revenue growth covering operating
      costs. At the $1.23B valuation, if revenue is in the estimated $100-150M range, the company trades at
      approximately 8-12x revenue, reasonable for a high-growth healthcare AI company. The participation of
      health system venture arms (Corewell, Memorial Hermann, Duke) in the Series C provides strategic
      capital alongside financial investors. Capital deployment priorities include AI development, clinical
      team expansion, health system partnership onboarding, and value-based care model development. The
      absence of disclosed debt or credit facilities suggests the company operates primarily on equity, though
      venture debt is common at this stage and may exist undisclosed.
    claimRefs: [CI014, CI015, CI016, CI017, CI018, CI019, CI020]
    tableRefs: [TI004]
    figureRefs: [FI003]
  - id: financial-gaps
    title: "Financial Disclosure Gaps and Risk Factors"
    body: >-
      As a private company, Cadence's financial disclosure is limited. Key unknowns include absolute ARR
      (only growth rate disclosed), gross and net margins, customer acquisition cost, lifetime value per
      patient, churn rates, burn rate and runway, and detailed revenue breakdown by payer type. The tripling
      of ARR in 2025 is company-claimed without independent verification. The reimbursement model creates
      significant financial risk: if CMS reduces RPM reimbursement rates in the 2027 physician fee schedule
      or eliminates codes, the entire revenue base could be impaired. UnitedHealthcare's tightening of prior
      authorization requirements may already be affecting revenue from commercially insured patients. The
      company's Medicare savings claim of $2.7M/week has not been independently audited. These gaps are
      typical for a private growth-stage company but material for investment diligence, particularly given
      the regulatory overhang on the core billing mechanism that generates substantially all revenue.
    claimRefs: [CI021, CI022, CI023, CI024, CI025, CI026]
    tableRefs: [TI005]
    figureRefs: [FI004]
