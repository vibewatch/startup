- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Type / status
  - Valuation or latest multiple snapshot
  - Why relevant
  - Key limitation
  rows:
  - - Teladoc Health / Livongo
    - Public virtual-care incumbent with chronic-care history
    - ~$3B market cap in 2026 after a severe peak-to-current reset
    - Best-known public cautionary case for scaled digital chronic-care value compression
    - Broader legacy business mix and public-company baggage make it an imperfect pure-play RPM comp
  - - Omada Health
    - Private-to-public chronic-condition management reference
    - 500M+ raised; public filing path improves disclosure discipline
    - Closer business-model benchmark for chronic-condition management economics
    - Channel mix leans more to employers and payers than Cadence's provider-embedded model
  - - Biofourmis
    - Private AI-enabled remote monitoring company
    - ~$465M raised across private rounds
    - Shows that enterprise remote-monitoring narratives can attract major capital
    - Private funding is not the same as durable public-market or exit support
  - - Hims & Hers
    - Public digital health platform
    - Higher public-market multiple than traditional care-management names
    - Useful upper-bound example of how strong growth can command premium health-tech valuation support
    - Consumer brand and cash-pay mix differ materially from Cadence's reimbursement-dependent model
  - - DarioHealth
    - Public chronic-condition management peer
    - Low public valuation support relative to growth narratives
    - Useful lower-bound example for chronic-care assets without dominant scale
    - Much smaller footprint and different customer channel make direct comparison rough
  - - Digital health sector basket
    - Analyst-market-data framing reference
    - 2026 valuations still sit roughly 40-60% below 2021 peak conditions
    - Anchors why fair-value discipline matters even as funding improves
    - A basket is context, not a company-specific comp
  notes: Comparable set mixes direct peers, public proxies, and sector framing references to bracket valuation rather than to force a false single-multiple answer.
  enumerationScope:
    coverage: partial
    basis: Rows cover the principal public and private chronic-care valuation anchors available from retained 2026 sources, but not every undisclosed private round, secondary trade, or acquisition comp in digital health.
