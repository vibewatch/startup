company:
  name: Cadence
chapter:
  number: 8
  title: Valuation
  summary: Cadence merits a track recommendation rather than an outright buy. The $100M Series C at a $1.23B post-money valuation is defensible if Cadence's 100,000-plus patient footprint already converts into a $70M-$180M revenue run rate, but missing disclosure on absolute ARR, gross margin, reimbursement mix, and financing terms keeps conviction at medium, risk at high, and the valuation stance at fair rather than attractive.
sections:
- id: recommendation-and-underwriting-frame
  title: Recommendation and underwriting frame
  body: Cadence clears the threshold for serious investor attention because it has real scale, real customers, and a current financing event rather than a stale mark. The company disclosed a $100 million Series C led by Spark Capital on June 23, 2026 at a $1.23 billion post-money valuation and stated that total capital raised now stands at $241 million. That gives the story enough external validation to stay on the watch list. The underwriting problem is not whether Cadence is real; it is whether the present price already anticipates too much of the future proof set. Management says ARR tripled in 2025 and that the platform now supports more than 100,000 patients across more than 20 health systems, but the public record still omits the ARR base, billed revenue, gross margin, payer mix, and preference terms that would let an investor distinguish a fair round from a premium round. That combination supports a track call, a 6.5 out of 10 overall score, medium confidence, high risk, and a fair
    valuation stance.
