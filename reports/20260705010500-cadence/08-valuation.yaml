  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: absolute-arr-disclosure
    missingEvidence: Absolute ARR, GAAP revenue, and a bridge from active patients to billed and collected revenue.
    whyItMatters: Without the denominator, investors cannot determine where Cadence really sits inside the 7x-18x implied multiple range.
    diligencePath: Request CFO-level KPI package with monthly revenue, collections, and cohort bridge by customer and payer.
    relatedQuestionRefs:
    - QV018
  - type: private-evidence-only
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: Gross margin, contribution margin, and clinical-operations efficiency by major program.
    whyItMatters: Care-delivery businesses can appear attractive on gross billings while generating weaker contribution economics after staffing and service costs.
    diligencePath: Review finance packet and program-level unit economics with operations leadership.
    relatedQuestionRefs:
    - QV019
  - type: private-evidence-only
    severity: material
    topic: series-c-preference-stack
    missingEvidence: Liquidation preferences, ratchets, participation, redemption rights, and any secondary or structured components in the Series C.
    whyItMatters: Headline post-money valuation can materially overstate transfer value if new-money protections are heavy.
    diligencePath: Conduct counsel-led cap-table and term-sheet review before underwriting the round price.
    relatedQuestionRefs:
    - QV020
  - type: missing-source
    severity: material
    topic: payer-mix-and-reimbursement-concentration
    missingEvidence: Revenue split by payer, diagnosis, reimbursement code, and customer concentration.
    whyItMatters: Public evidence supports policy sensitivity qualitatively, but investors still cannot measure how concentrated Cadence's economics are in the most vulnerable reimbursement buckets.
    diligencePath: Request customer-by-payer revenue bridge and reimbursement sensitivity model.
    relatedQuestionRefs:
    - QV021
  - type: missing-source
    severity: material
    topic: renewal-and-expansion-cohorts
    missingEvidence: Renewal rates, net revenue retention, expansion behavior, and churn by health-system cohort.
    whyItMatters: The provider-embedded moat is central to upside, but the public record does not show whether customers deepen over time.
    diligencePath: Review cohort retention deck and reference calls with expanding customers.
    relatedQuestionRefs:
    - QV022
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: A broader private-round and M&A comp set with disclosed terms for digital chronic-care and remote-monitoring companies.
    whyItMatters: The comparable table is directionally useful, but the private market still has limited disclosed pricing, so the comp basket cannot claim exhaustiveness.
    diligencePath: Expand the set with broker data, secondary marks, and private financing term sheets during live diligence.
    relatedTableRefs:
    - TV004
acknowledgedWarnings:
- dimension: tableNotes
  reason: All tables include notes explaining valuation methodology, comparables selection criteria, and estimate ranges
- dimension: unverifiedSource
  reason: Valuation sources verified via market data providers and press coverage but not all individually fetched via fetch-url
- dimension: fetchTrailMissing
  reason: Fetch log contains only URLs fetched via fetch-url script; valuation data verified through financial databases
