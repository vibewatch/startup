- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Frame
  - Supporting evidence
  - Why it matters
  - What would change the view
  rows:
  - - Thesis
    - Cadence has a fresh $100M Series C, 100,000+ patients, and 20+ health systems
    - A real asset with current scale deserves continued investor attention
    - Proof that enrollment converts into high-quality recurring revenue would strengthen the thesis
  - - Thesis
    - ARR tripled in 2025 according to the company
    - Fast growth can support a premium multiple if the absolute base is meaningful
    - Absolute ARR disclosure and cohort retention would confirm whether the growth is scalable
  - - Thesis
    - Embedded care workflows and published outcomes can create sticky operational integration
    - Provider integration may be more defensible than a pure point solution
    - Show renewal, expansion, and margin durability by health system
  - - Anti-thesis
    - Absolute ARR, billed revenue, gross margin, and EBITDA remain undisclosed
    - The current round cannot be conventionally underwritten from public evidence alone
    - A finance-room KPI pack could close much of this gap quickly
  - - Anti-thesis
    - Most economics appear tied to reimbursable RPM-style care delivery
    - A single reimbursement substrate can compress value quickly if policy changes
    - Diversified contracting or payer resilience data would reduce the discount
  - - Anti-thesis
    - Private headline valuation may not equal transferable entry value if preferences are heavy
    - Structure matters as much as price in late-stage private rounds
    - Disclose liquidation preferences, ratchets, and any seniority protections
  notes: Pairs the core upside case with the specific evidence gaps that keep the recommendation at track instead of buy.
