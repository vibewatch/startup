- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - RPM reimbursement reset
    - Material CMS or major commercial payer tightening on reimbursable chronic-care workflows
    - Cadence's core monetization engine would de-rate quickly
    - Do not add capital at or above the 2026 mark
  - - Revenue quality disappointment
    - Private diligence shows revenue near the bottom of the estimated band or weak collection quality
    - The implied multiple shifts toward stretched territory
    - Reset fair value lower and require stronger terms
  - - Hard downside protections
    - Next financing reveals punitive liquidation preferences, ratchets, or participation
    - Headline valuation overstates transferable value
    - Treat the round price as structurally inflated
  - - Concentration shock
    - A few health systems or payers dominate economics more than expected
    - Growth durability and bargaining power both weaken
    - Apply a concentration discount or stop
  - - Margin or retention weakness
    - Contribution margins or renewal cohorts do not show durable economics
    - Scale would be less valuable than the patient headline suggests
    - Keep recommendation at track or move to pass
  notes: Triggers are monitorable diligence thresholds designed to convert a private-company story into explicit go / no-go conditions.
