- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  - Threshold for comfort
  rows:
  - - Absolute ARR and revenue bridge
    - ARR base, billed revenue, collections, and patient-to-revenue bridge by program
    - Needed to know where the implied multiple really sits
    - CFO packet plus cohort-level billing review
    - Show a revenue base that keeps the round inside a supportable multiple band
  - - Gross margin and clinical ops efficiency
    - Contribution margin, staffing ratio, and device / service cost structure
    - Separates durable economics from gross-billings illusion
    - Finance plus operations review
    - Demonstrate attractive unit economics after clinical delivery costs
  - - Payer and diagnosis mix
    - Revenue share by payer, diagnosis, and reimbursement code
    - Tests the single-revenue-source anti-thesis directly
    - Revenue analytics plus payer policy review
    - Show that no narrow policy bucket dominates the business
  - - Retention and expansion
    - Renewal cohorts, customer expansion, and churn by health system
    - Needed to validate sticky provider integration
    - Customer success and account review
    - Provide cohort evidence of durable land-and-expand behavior
  - - Financing terms
    - Liquidation preferences, ratchets, participation, redemptions, and any secondary components
    - Headline post-money can overstate common-equity transfer value
    - Counsel-led cap-table review
    - Confirm downside structure is clean enough to trust the headline mark
  - - Governance-quality KPI package
    - Board metrics, forecast discipline, and data-room readiness
    - A cleaner KPI package could move the recommendation faster than more partnership PR
    - Board materials and management review
    - Show institutional-grade reporting suitable for crossover-style diligence
  notes: These asks are ordered by what most directly changes underwriting quality rather than by what is easiest for management to provide.
