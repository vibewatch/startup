- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact
  - Current public signal
  - Diligence path
  rows:
  - - More disease pathways within one system
    - Clinical validation may not transfer evenly across every condition
    - Can expand wallet share if outcomes generalize
    - Memorial Hermann scope and Cadence materials point to multi-condition expansion
    - Request attach rate by disease line and outcome by pathway
  - - More sites / clinics within an existing health system
    - A few enterprise accounts could dominate patient volume
    - Systemwide rollout would accelerate growth but increase concentration
    - Cadence highlights broad health-system relationships rather than small clinic deals
    - Request top-10 account share and site-level rollout map
  - - More clinician referrers into the same branded program
    - Referral volume depends on physician buy-in and internal workflow fit
    - Can raise patients-per-account without new logo acquisition
    - White-label program pages imply provider-led enrollment and referral loops
    - Request referral conversion rates by specialty and partner
  - - Customer-investor anchor accounts
    - Strategic investors may shape roadmap and reference set disproportionately
    - Alignment helps trust but can also concentrate influence
    - Corewell, Memorial Hermann, and Duke invested in Series C while being customers
    - Request governance rights and revenue share for investor-customers
  - - RPM reimbursement dependence
    - Coverage or billing scrutiny can delay procurement and renewal
    - Could slow deployments or narrow eligible patient cohorts
    - OIG oversight and payer tightening raise compliance burden for provider buyers
    - Request payer-mix exposure and denial / appeal data by partner
  - - Direct enterprise selling motion
    - No obvious channel diversification means every sale is implementation-heavy
    - Long cycles can make quarterly growth lumpy
    - Public evidence points to direct health-system relationships, not reseller-led distribution
    - Request average sales cycle, implementation time, and channel strategy
  notes: This table separates plausible expansion levers from the operational and reimbursement frictions that can block them; impacts are analytical judgments, not disclosed management scores.
