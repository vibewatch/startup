- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named proof
  body: 'Cadence’s public adoption story is stronger than a simple logo wall but still incomplete. The company and independent coverage align on two top-line numbers—100,000+ active patients and 20+ health-system partners—and management says ARR tripled in 2025. Named proof is freshest in the current cycle: Duke Health and Texas Health Resources were announced with the June 2026 Series C, Memorial Hermann launched an AI-enabled chronic-care program, and February 2026 materials named Yale New Haven Health, Lifepoint Health, Community Health Systems, and Rush as expansion partners. Hackensack Meridian adds late-2025 proof, while RUSH provides an older 2023 deployment example that predates the financing cycle. Still, the public roster remains partial relative to the 20+ claim, so the chapter can validate real deployment momentum and reference quality without claiming a fully enumerated customer base.'
