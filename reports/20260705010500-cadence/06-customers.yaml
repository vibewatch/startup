callouts:
- calloutType: strength
  title: Cadence has progressed beyond logo proof into workflow-level customer evidence
  body: The strongest customer evidence is not just the 20+ partner claim. Duke, Hartford, Providence, Memorial Hermann, Hackensack, and RUSH all provide named public proof that Cadence is embedded in real provider workflows, and Providence plus the peer-reviewed studies add quantified outcomes that many digital-health startups never publish.
  claimRefs:
  - CU021
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU045
- calloutType: risk
  title: Public durability disclosure is still weak
  body: 'Cadence’s public customer evidence is strong on who uses the product and what outcomes it can produce, but weak on the metrics investors normally need for customer-quality underwriting: NRR, GRR, churn, contract terms, and top-account concentration all remain private.'
  claimRefs:
  - CU028
  - CU029
  - CU044
- calloutType: risk
  title: RPM reimbursement scrutiny can slow customer expansion
  body: The main adverse customer signal is not failed deployments; it is the reimbursement and compliance burden around RPM. OIG oversight and payer tightening raise the diligence burden for any health system that wants to expand Cadence quickly across more patients or more disease lines.
  claimRefs:
  - CU035
  - CU036
  - CU037
  - CU038
  - CU039
