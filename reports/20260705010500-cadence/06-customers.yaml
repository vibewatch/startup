chapter:
  number: 6
  title: Customers
  summary: 'Cadence has real customer traction with U.S. health systems: public sources align on 20+ partners, 100,000+ active patients, and named deployments spanning Duke Health, Hartford HealthCare, Providence, Memorial Hermann, Hackensack Meridian, and RUSH. The customer case is strongest on white-label workflow embedding and clinical outcomes, but weakest on public retention, renewal, and concentration disclosure, so durability still requires private diligence.'
sections:
- id: customer-base-and-buying-motion
  title: Customer base and buying motion
  body: 'Cadence’s customers are health systems, not self-serve patients. Public materials consistently frame the buyer as a health-system or medical-group leadership team looking to extend chronic-care capacity, while day-to-day users are clinicians, care managers, and referred patients inside the partner network. Duke Health Connected and Hartford HealthCare’s HHC Remote Care show the commercial model clearly: Cadence is white-labeled into the provider’s own brand, device workflow, and clinical protocols rather than asking patients to adopt a standalone Cadence identity. The patient cohort is also specific rather than generic. Named customer materials repeatedly point to older adults with hypertension, diabetes, heart failure, and adjacent chronic conditions. That combination matters for underwriting because it implies a top-down enterprise sale, an implementation-heavy launch, and downstream patient growth that depends on internal referral behavior inside each health system rather than
    consumer marketing.'
