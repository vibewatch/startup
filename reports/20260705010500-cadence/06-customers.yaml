  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster-gap
    missingEvidence: A dated, exhaustive list of Cadence health-system customers with program status, launch date, and production-versus-announcement state.
    whyItMatters: Public sources name only a subset of the 20+ partner claim, so adoption breadth and referenceability cannot be fully reconciled from open evidence.
    diligencePath: Request the current customer roster, including inactive accounts, by health system, condition, launch date, and status.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics-gap
    missingEvidence: NRR, GRR, logo churn, renewal rate, contract duration, and satisfaction data for Cadence customer cohorts.
    whyItMatters: The chapter can show strong proof of use and outcomes, but it cannot underwrite customer durability without actual retention metrics.
    diligencePath: Request customer-cohort retention reporting, renewal history, and account-level expansion timeline data.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-data-gap
    missingEvidence: Top-customer revenue share, patient share, and any concentration thresholds tied to investor-customer accounts.
    whyItMatters: A small number of large systems could dominate both revenue and references, but public sources do not quantify that risk.
    diligencePath: Request the top-10 customer list with revenue share, enrolled-patient share, and roadmap influence by account.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: expansion-denominator-gap
    missingEvidence: Partner-level data on referrals, site rollout, disease-line attach, and time-to-expansion after first launch.
    whyItMatters: Public sources show plausible expansion vectors but do not reveal how reliably Cadence converts first wins into larger systemwide programs.
    diligencePath: Request cohort reporting that tracks each customer from first program launch to additional sites, specialties, or disease lines.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
    - TU005
