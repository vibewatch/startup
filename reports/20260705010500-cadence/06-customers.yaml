- id: durability-and-outcome-backed-stickiness
  title: Durability and outcome-backed stickiness
  body: Durability evidence is where Cadence’s customer case becomes much thinner. Public sources reviewed for this chapter do not disclose NRR, GRR, logo churn, contract term, renewal rates, or top-account concentration. That means investors cannot directly underwrite customer stickiness from public materials alone. What exists instead is outcome-backed proxy evidence. Providence republishes Cadence clinical results on its own efficacy page, the Mayo paper reports fewer hospitalizations and lower total cost of care for enrolled Medicare patients, and the JACC Advances study reports substantially improved blood-pressure control. RUSH also cites lower total cost of care and better chronic-disease goal attainment in its program materials. These signals matter because health systems usually renew clinical programs when they can defend outcomes and workflow value, but they remain indirect substitutes for actual cohort, renewal, and contract data.
