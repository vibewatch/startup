tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / strategic value
  - Evidence / named examples
  - Key gap
  rows:
  - - Large integrated health systems
    - Buyer = executive / digital-care leadership; users = clinicians and care teams; payer = health system plus reimbursed clinical program economics
    - White-label chronic-disease management across broad ambulatory populations
    - Largest likely source of patient volume and multi-site expansion
    - Providence, Corewell, Memorial Hermann, and Texas Health Resources are publicly named examples
    - No public revenue split or top-account share by system
  - - Academic medical centers
    - Buyer = clinical / digital innovation leadership; users = specialty and primary-care teams; payer = academic medical group budgets plus reimbursement
    - Higher-acuity chronic-care pathways and protocol-heavy deployments
    - Important reference quality because academic brands can validate clinical credibility
    - Duke Health, Yale New Haven Health, and RUSH are named publicly
    - No public disclosure of renewal timing or economics by academic site
  - - Regional and branded remote-care programs
    - Buyer = local health-system leadership; users = existing patients and outreach teams; payer = branded service-line budget
    - Extend care between visits without forcing a new consumer brand
    - Useful proof that white-label positioning works in patient-facing settings
    - Duke Health Connected and HHC Remote Care show Cadence operating behind the local brand
    - Public pages prove workflow presence, not contract value
  - - Community / for-profit multistate systems
    - Buyer = operating leadership; users = care teams managing large distributed populations; payer = system-level chronic-care program budget
    - Standardized chronic-care operations across geographically dispersed markets
    - Can broaden logo count beyond elite academic centers
    - Lifepoint Health and Community Health Systems appear in 2026 expansion materials
    - Program-by-program deployment depth is not public
  - - Senior-care expansion cohort
    - Buyer = value-based or senior-care leadership; users = care teams supporting older adults; payer = chronic-care reimbursement and population-health budgets
    - Proactive senior care with vitals monitoring, coaching, and medication support
    - Shows Cadence can package a repeatable use case across multiple systems
    - February 2026 materials named Yale New Haven Health, Lifepoint Health, Community Health Systems, and RUSH in this motion
    - Customer-level patient counts and rollout dates are not enumerated publicly
  notes: Rows separate institution type from the white-label service pattern; strategic value reflects likely importance to Cadence rather than disclosed contract size.
