companyProfile:
  summary: >-
    Cadence is a New York-based healthcare technology company that operates an AI-powered chronic
    disease management platform. Founded in 2020 by Chris Altchek, the company partners with health
    systems to remotely monitor and manage patients with hypertension, diabetes, and heart failure
    using supervised AI agents, connected devices, and a clinical team of 300+ staff. Cadence
    operates as a white-labeled clinical service embedded in partner health systems' workflows,
    billing insurers directly through RPM CPT codes. The company reached unicorn status in June 2026
    with a $100M Series C at $1.23B post-money valuation led by Spark Capital.
  foundedDate: '2020-01-01'
  founders:
    - name: Chris Altchek
      role: CEO & Co-founder
      background: "Previously built and scaled BuzzFeed's Tasty food media brand"
      claimRefs: [CO008, CO009]
  foundingLocation: "New York, New York, United States"
  headquarters: "New York, New York, United States"
  productSummary: >-
    Clinical Intelligence platform with supervised AI agents for daily vital monitoring, medication
    adjustment support, and personalized lifestyle coaching, delivered through connected devices
    (blood pressure cuffs, glucose monitors) and embedded into partner health system EMRs.
  customerFocus: "Large health systems seeking to manage chronic disease patients at scale"
  businessModel: >-
    Monthly per-patient insurance reimbursement via CPT codes 99454/99457 for remote physiologic
    monitoring, with emerging value-based care shared savings contracts.
  stage: "Series C (Growth)"
  fundingStatus: "$100M Series C closed June 2026 at $1.23B post-money; $241M total raised"
