  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 报销与监管脆弱性
        blocks:
          - type: paragraph
            body: >-
              Cadence 最重要的风险不是临床需求，而是报销架构。公司销售 AI 赋能的慢性病护理服务，经济吸引力来自 Medicare 和 商业支付方会报销远程生理监测及相关临床时间，让医疗系统无需自掏腰包支付传统
              SaaS 费用就能采用 Cadence。同一设计也 制造了单一外部政策卡点。HHS OIG 已经从 2024 年建议加强 RPM 监督，升级到 2025 年计费报告；该报告强调支付增长很快，
              且计费模式值得审视。商业支付方也在行动：UnitedHealthcare 试图把 RPM 覆盖收窄到少数诊断，说明即便 RPM 已广泛采用，
              大型保险方仍愿意挑战这个品类默认的报销逻辑。结果是一个主风险：收入、扩张、估值和融资可能同时被击中。公开证据没有 显示 Cadence
              目前已经受损，但确实显示，该模式的经济底座不是合同化耐久资产，而是可被政治和行政流程撤回的安排。
