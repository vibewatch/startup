  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Cadence 的主战场位于远程患者监测（RPM）、慢性病管理和 AI 驱动临床服务的交叉点。核心市场边界是： 面向慢性病患者——尤其是高血压、糖尿病和心衰患者——交付技术赋能的护理，并通过 Medicare
              和商业保险的 RPM 代码获得报销。该市场不包括纯消费级健康设备、急性病远程问诊和心理健康平台。相邻市场包括价值医疗 赋能、居家住院项目，以及使用独立 CPT
              代码计费的慢性病护理管理（CCM）服务。现状替代方案是 定期到诊室就诊的传统初级保健；但高血压患者中血压得到控制的比例低于 30%，说明该模式尚不足以管理慢性病。 CMS 对 RPM 代码
              99453、99454、99457 和 99458 的收费表定义了这一市场，也为所有参与方建立了结构化的 报销路径和收入锚点。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
