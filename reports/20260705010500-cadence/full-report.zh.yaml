      - number: '4.2'
        title: 单位经济模型与利润率结构
        blocks:
          - type: paragraph
            body: >-
              Cadence 的单位经济模型围绕单名患者每月贡献利润展开。RPM 计费带来的单患者收入估计为 $60–$150/月。 关键成本驱动包括临床人工（护士、NP、医生，按患者与临床人员比例不同，约
              $20–$40/患者/月）、联网设备成本 （摊销后约 $5–$10/患者/月）、技术平台成本（$3–$8/患者）和患者参与开销（$2–$5/患者）。这意味着毛利率可能在 40%–65%
              区间，取决于临床人工效率，而 AI 自动化正是要改善这一点。受监督 AI 智能体模式希望把患者与临床人员 比例从传统 200–300:1 提高到潜在 500–1000:1；如果做到，单位经济模型会大幅改善。公司
              2025 年 ARR 增长至三倍， 同时维持 300+ 人临床团队，说明患者量显著增长，或单患者经济性正在改善。公司未披露利润率，业务财务健康仍是 核心尽调问题；不过它能以 $1.23B 估值融资
              $100M，说明投资人在资料室中可能看到了有吸引力的单位经济数据。
