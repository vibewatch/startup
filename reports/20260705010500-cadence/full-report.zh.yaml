      - number: '7.4'
        title: 团队、市场与执行判断
        blocks:
          - type: paragraph
            body: >-
              剩余风险都是执行问题，但仍足以左右投资判断。Chris Altchek
              是公司公开叙事、融资和战略框架的核心，而更广的高管梯队在公开资料中披露很少。当业务不断拿下标杆客户时，这个问题尚可管理；但如果规模给组织施压，或更深的梯队浮现之前就发生领导层交接，脆弱性会放大。执行风险也异常多线并行：Cadence
              必须同时扩张临床人员、报销运营、设备物流、EMR 集成和 QA 控制，不能一项一项慢慢做。再叠加市场背景仍然挑剔。2026
              年数字医疗融资有所改善，但公开医疗科技公司估值倍数和远程监测情绪仍然低迷，资本也不成比例地流向少数公司。正确结论不是立刻推翻投资命题，而是在明确否决条件下承认高残余风险。如果报销收窄、质量指标恶化，或少数锚定系统暴露集中度风险，即便表观患者数继续增长，融资和估值故事也可能快速重置。
