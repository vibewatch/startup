  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 框架
      - 支撑证据
      - 重要性
      - 哪些信息会改变判断
    rows:
      - - 投资逻辑
        - Cadence 刚完成 $100M Series C，覆盖 100,000+ 名患者、20+ 家医疗系统
        - 已有真实规模的资产，值得投资人继续关注
        - 如果能证明患者入组转化为高质量经常性收入，投资逻辑会更强
      - - 投资逻辑
        - 公司称 ARR 在 2025 年增长至三倍
        - 如果绝对基数足够大，快速增长可以支撑溢价倍数
        - 披露绝对 ARR 和队列留存，才能确认增长是否可规模化
      - - 投资逻辑
        - 嵌入式护理工作流和已发表结果，可能形成黏性的运营集成
        - 医疗服务方集成的防御力，可能强于纯点状解决方案
        - 按医疗系统展示续约、扩张和利润率韧性
      - - 反向逻辑
        - 绝对 ARR、开票收入、毛利率和 EBITDA 仍未披露
        - 仅凭公开证据，无法按常规方式承销本轮融资
        - 财务数据室 KPI 包可以快速弥合很大一部分缺口
      - - 反向逻辑
        - 多数经济性似乎绑定在可报销的 RPM 式护理交付上
        - 如果政策变化，单一报销底座会迅速压缩价值
        - 多元化合约或付款方韧性数据会降低折价
      - - 反向逻辑
        - 如果优先权过重，私募头条估值不一定等于可转让入场价值
        - 晚期私募轮里，结构和价格同样重要
        - 披露清算优先权、反稀释条款，以及任何优先保护
    notes: 把核心上行逻辑与具体证据缺口配对，这些缺口让建议停留在跟踪而不是买入。
