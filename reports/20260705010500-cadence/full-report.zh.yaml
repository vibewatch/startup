      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              关键增长驱动包括：美国人口老龄化（65 岁以上人群预计到 2030 年达到 80M）、CMS 对 RPM 服务的报销扩张、 医疗系统在价值医疗合同下减少再入院的财务压力，以及临床证据显示 RPM 可让住院率下降
              20%–30%。AI 进步正在 自动化临床分诊，降低单患者人工成本，从而加速 RPM 平台规模化。主要采用约束包括 RPM 计费监管不确定性 （HHS OIG 审视）、医疗系统把 RPM 伙伴接入 EMR
              后形成的高切换成本、AI 辅助护理决策需要临床信任、联网设备 项目资本强度较高，以及 CMS 潜在报销削减可能击穿单位经济模型。2026 年 HHS OIG 关于 RPM 漏洞的报告和
              UnitedHealthcare 的反推都构成实质逆风；一旦计费要求收紧，市场增长可能放慢。另外，Apple、Google 等大型 科技公司投资健康监测，也给专门 RPM
              平台带来长期颠覆风险。当前美国符合条件患者中的 RPM 渗透率估计仅 5%–10%，说明监管逆风之外仍有大量未开发增长空间。市场参与者要抓住剩余机会，必须在理赔快速增长和支付方 审视加剧之间走窄路。
