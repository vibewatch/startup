      - number: '3.3'
        title: 定价与打包对比
        blocks:
          - type: paragraph
            body: >-
              竞争格局中的定价模式差异很大。Cadence 的模式独特地围绕支付方报销搭建：公司用 CPT 99454/99457 代码直接向 Medicare
              和商业保险收费，让医疗系统合作方的自付成本很低（主要是项目管理开销）。Biofourmis 按患者每月向 医疗系统或支付方收费，区间为 $100–$300，取决于病情严重度。Livongo/Teladoc
              主要通过雇主合同运营， 每名会员每月 $50–$80。Omada Health 的行为项目向雇主按参与者收费 $150–$500。Prevounce 和 Optimize Health 向诊所收取每名患者每月
              $30–$50，用于计费和工作流软件。关键判断是：Cadence 基于报销的模式把经济风险从医疗 系统买方转移到支付方，降低销售摩擦，但也让公司依赖 CMS 报销政策持续存在。这个定价结构既是竞争优势
              （采用门槛更低），也是战略脆弱点（单一监管故障点）。
