  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 示例估值区间
      - 相对 $1.23B 标记的回报
      - 概率信号
      - 关键下行 / 触发因素
    rows:
      - - 乐观
        - ARR 接近估算区间上沿，报销保持稳定，利润率 / 留存数据扎实
        - $1.6B-$2.1B
        - 较当前标记有明确上行
        - 可能成立，但需要私下 KPI 证明
        - 如果报销或利润率证明不及预期，情景失效
      - - 基准
        - 增长真实，但公开披露缺口仍在，且没有重大条款意外
        - $1.0B-$1.4B
        - 大致持平至温和上行 / 下行
        - 最符合当前证据
        - 如果 KPI 缺口延续到下一轮，情景会停滞
      - - 悲观
        - RPM 报销收紧，收入集中度比预期更差，或融资条款把价值转移给新钱
        - $0.6B-$0.9B
        - 明显下行
        - 鉴于政策和结构风险，不能排除
        - 由付款方反推、严苛条款或薄弱单位经济性触发
    notes: 区间是基于公开证据和情景假设的分析师估算，不是完整股权瀑布或 DCF 结果。
    claimRefs:
      - CV011
      - CV027
      - CV028
      - CV029
      - CV030
