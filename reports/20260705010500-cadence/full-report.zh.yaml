  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              慢性病管理和远程患者监测市场的竞争格局很分散，从纯 RPM 平台，到综合远程医疗提供商，再到新兴 AI 原生护理公司 都在场。Cadence 的主要竞争对手包括 Biofourmis，其用获得 FDA
              许可的算法提供 AI 驱动远程监测； Livongo（现属 Teladoc Health），它是基于联网设备的慢性病护理先行者，拥有 700,000+ 名会员；Omada Health
              聚焦糖尿病和心血管疾病的行为健康干预；Current Health（被 Best Buy Health 收购）提供居家住院和 RPM 基础设施。竞争场还包括医疗系统自建方案、Epic 和 Cerner 的 EHR
              原生监测模块，以及瞄准临床自动化的新兴 AI 初创公司。2023–2025 年，多起收购让市场整合提速；但 RPM 计费受到监管审视，对所有参与方影响相同，
              既带来品类级风险，也给站位好的玩家创造机会。Cadence 的主要差异点是白标临床服务模式：它深度嵌入医疗系统 工作流，而不是作为独立面向患者的平台运营。
