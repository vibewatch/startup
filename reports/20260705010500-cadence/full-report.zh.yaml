  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现
        blocks:
          - type: paragraph
            body: >-
              Cadence 主要通过远程生理监测服务的按月保险报销产生收入。公司使用 CPT 代码 99454（设备供给和数据传输， 约 $64/月）、99457（临床监测时间，约 $52/月）和
              99458（额外临床时间，约 $42/月）向 Medicare 和商业 支付方收费。按代码组合和支付方不同，单名患者月度合计收费约为 $60–$150。以 100,000+ 名活跃患者计算， 公司年化收入率可能在
              $70M–$180M 区间；但公司只披露 2025 年 ARR 增长至三倍，未披露绝对数。次级收入来源 可能包括价值医疗合同，Cadence 与医疗系统分享成本节省，以及实施和集成服务的项目管理费。公司计划用
              Series C 资金扩展价值医疗模式，说明这可能成为重要收入来源。每周为 Medicare 节省 $2.7M（年化 $140M）的说法给出了 Cadence 创造价值的上限，但公司通过计费只能捕获其中一部分。
