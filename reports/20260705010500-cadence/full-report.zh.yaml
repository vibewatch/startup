      - number: '8.2'
        title: 当前融资背景与价格支撑
        blocks:
          - type: paragraph
            body: >-
              关键估值问题在于，Cadence 披露的增长和覆盖面是否已经大到足以让 $1.23 billion 显得普通。公开证据只能支撑一个合理但未被证明的答案。Cadence 覆盖 100,000
              多名患者、面向医疗系统、并声称 2025 年 ARR 翻了三倍，这些都指向真实商业动能；已发布的 RPM 报销区间也暗示，如果活跃患者量能顺利转化为可报销监测收入，估算收入年化运行率约在 $70 million
              至 $180 million。按这个很宽的区间，最新一轮约对应 7x 至 18x 收入。对于成长阶段医疗 AI
              公司，这不明显荒唐，但区间太宽，无法支持买入建议：同一个价格在区间高端显得保守，在低端则偏贵。估值还应因收入来源集中打折。Cadence
              的变现似乎主要绑定可报销慢病护理工作流，因此报销审查或覆盖收紧会同时打击增长、利润率和下一轮定价。
