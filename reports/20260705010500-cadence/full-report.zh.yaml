  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 示意性价值敏感性显示，收入质量和报销韧性可以显著抬升公允价值；政策或条款冲击也能迅速抹掉这部分价值。
    approximationNotes: 条形展示围绕 $1.15B 示意基准的 $M 方向性价值变化；它们不可相加，只用于显示关键投资判断变量的杠杆度。
    data:
      items:
        - label: 收入接近估计区间上沿
          value: 450
        - label: 强毛利率和 cohort 留存证据
          value: 250
        - label: 报销模式证明有韧性
          value: 200
        - label: RPM 报销明显收紧
          value: -400
        - label: 下一轮暴露严苛优先权结构
          value: -300
        - label: 客户 / 支付方集中度差于预期
          value: -250
    claimRefs:
      - CV010
      - CV011
      - CV028
      - CV030
      - CV031
      - CV038
      - CV041
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准和乐观三种区间显示，只有私下尽调确认收入基数强、融资条款干净，最新一轮估值才守得住。
    approximationNotes: 区间为分析师按 $M 估算，基于公开证据、情景假设和可比框架，不是完整 DCF 或清算瀑布。
    data:
      items:
        - label: 悲观情景 — 政策或融资重置
          low: 600
          high: 900
          unit: $M
        - label: 基准情景 — 增长真实，证据不完整
          low: 1000
          high: 1400
          unit: $M
        - label: 乐观情景 — KPI 证据收窄折价
          low: 1600
          high: 2100
          unit: $M
    claimRefs:
      - CV011
      - CV029
      - CV030
      - CV031
      - CV037
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式评分支持 6.5/10 的总体判断：市场需求和客户规模强，但经济性和风险转移披露不足，估值支撑只在中档。
    approximationNotes: 评分采用 1-10 的编辑口径，基于截至 2026-07-05 保留的公开证据；不是管理层提供的 KPI。
    data:
      items:
        - label: 市场需求
          value: 8
          unit: /10
          note: 慢病管理仍是庞大且紧迫的问题集合。
        - label: 客户规模
          value: 7
          unit: /10
          note: 100,000+ 名患者和 20+ 个医疗系统显示已有实质部署。
        - label: 增长信号
          value: 7
          unit: /10
          note: ARR 在 2025 年增长至三倍，尽管未披露分母。
        - label: 经济性可见度
          value: 4
          unit: /10
          note: ARR 基数、利润率和回款披露仍缺失。
        - label: 报销韧性
          value: 3
          unit: /10
          note: 政策敏感性仍是最大且最清晰的反面投资逻辑。
        - label: 估值支撑
          value: 6
          unit: /10
          note: 仅凭公开证据，当前估值能辩护，但不值得追高。
        - label: 证据质量
          value: 5
          unit: /10
          note: 足以密切跟踪，但不足以支撑高确信度投资判断。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV021
      - CV022
      - CV023
      - CV039
      - CV045
