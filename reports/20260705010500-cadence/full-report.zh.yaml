      - number: '8.3'
        title: 可比公司视角与情景区间
        blocks:
          - type: paragraph
            body: >-
              可比分析指向纪律，而不是兴奋。2026 年数字医疗估值较 2022-2023 年低谷已有改善，但主要市场数据来源仍称该板块交易水平大约比 2021 年峰值低 40% 至 60%。Teladoc
              仍是最醒目的公开市场警示：它仍有数十亿美元规模，但股权价值远低于 Livongo 叙事峰值。Omada Health 战略上更接近，因为它同样切入慢病管理，并通过申报路径提供公开市场披露；Biofourmis
              则说明，大额私募融资总额并不保证估值支撑能长期守住。Hims & Hers 和 DarioHealth
              拓宽了视角：公开市场奖励直接面向消费者的订阅增长，与奖励嵌入提供方的护理管理并不相同。在这组参照下，如果隐藏收入基数已经可观，Cadence 当前估值算公允，但还不能证明便宜。基于公开证据的合理区间约为 $0.6
