            body: >-
              Cadence 的合作伙伴叙事表面上是强项，往下看则是一张依赖地图。公司确有真实的医疗系统背书，但公开证据只点名了 20
              多家合作伙伴中的一部分，也没有披露收入集中度、支付方结构或续约经济性。这个缺口重要，因为若干最强验证点同时也是投资方关系：Corewell Health、Memorial Hermann 和 Duke
              Health 既是验证者，也可能成为集中度节点。竞争集不止初创公司。Biofourmis 能拿临床导向、FDA 许可的 AI 做营销；Epic 能把贴近工作流的监测打包进核心 EHR；Apple 和
              Google/Fitbit 也能继续把患者自有监测预期推向商品化数据采集。Cadence 的白标运营模式仍显得差异化，因为它把工作流集成、临床服务层和 AI
              辅助监测放在一起，但护城河并不纯靠技术，而是靠支付方支持、实施深度，以及合作伙伴是否继续扩张。如果旗舰医疗系统放慢采用或重新谈判经济条款，单看合作伙伴数量可能会高估韧性。
