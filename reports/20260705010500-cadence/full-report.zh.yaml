      - number: '6.4'
        title: 扩张、集中与客户风险
        blocks:
          - type: paragraph
            body: >-
              Cadence 的扩张逻辑很直观：一旦医疗系统信任白标运营模式，公司就能扩大疾病覆盖，增加临床转诊者，并从一个医疗集团或
              站点扩展到系统内更多部分。同一结构也制造集中风险。少数大型医疗系统可能贡献大部分量、提供最强公开客户背书，甚至 参与融资轮，从而同时集中收入和路线图影响力。负面证据并不指向客户不满，更多指向采购摩擦。RPM
              项目面临计费和覆盖 审视：OIG 已要求加强 Medicare 监督，支付方政策收紧也加重医疗系统证明合规和报销耐久性的负担。实践中，Cadence 可能
              继续赢得企业关系，但每一轮增量扩张都要在保守的提供方组织内部跨过报销、文档和变更管理门槛。公开可见证据没有显示
              明显流失事件或敌意客户背书，这是积极信号；但也意味着主要下行情景更隐蔽：转诊放慢、支付方适格范围变窄，或者
              扩张项目在成为全系统标准之前停滞。如果尽调只看客户标识和临床结果，而忽略采购机制和报销暴露，这类风险最容易漏掉。
