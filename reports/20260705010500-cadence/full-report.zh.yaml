  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资判断框架
        blocks:
          - type: paragraph
            body: >-
              Cadence 达到了严肃投资人值得关注的门槛，因为它有真实规模、真实客户，也有一轮当前融资事件，而不是过期估值。公司披露，2026 年 6 月 23 日由 Spark Capital 领投 $100
              million Series C 轮，投后估值 $1.23 billion，并表示累计融资已达 $241 million。这些外部验证足以让项目留在观察名单。投资判断的难点不是 Cadence
              是否真实，而是当前价格是否已经提前消化了太多未来证明。管理层称 2025 年 ARR 翻了三倍，平台目前支持 20 多家医疗系统中的 100,000 多名患者，但公开记录仍缺少 ARR
              基数、已计费收入、毛利率、支付方结构和优先条款，投资人因此无法区分这一轮是公允定价还是溢价定价。这个组合支持“跟踪”判断：总体 10 分制中的 6.5 分，中等置信度、高风险，估值立场为公允。
