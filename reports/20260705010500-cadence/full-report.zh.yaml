      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >-
              Cadence 所在市场是三边结构。买方是医疗系统——高管层、首席数字官或人群健康负责人——他们与 Cadence 签约采购白标慢性病护理服务。用户是慢性病患者，接收联网设备并接受持续监测。支付方是按月报销
              RPM 代码的 Medicare 或商业保险。预算通常归医疗系统的人群健康或价值医疗团队掌握，因为 Cadence 模式为医疗系统创造 收入，同时 Cadence
              以医疗系统资质直接向支付方收费。落地路径需要接入医疗系统 EMR、完成 Cadence 临床人员 资质认证，并跑通患者入组工作流。关键买方分层包括大型综合医疗系统（如
              Providence、Corewell）、学术医疗中心 （Duke、Yale New Haven）、社区医疗系统（Lifepoint、CHS）和新兴价值医疗组织。每一层的采用周期、合规要求 和患者结构都不同。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
