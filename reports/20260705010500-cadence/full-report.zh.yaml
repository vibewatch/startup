            body: >-
              Cadence 的信任叙事在临床治理上更强，在公开安全披露上更弱。合作伙伴资料反复强调，AI 支持的建议会由临床人员审核， 通过共同临床方案运行，并与患者既有提供方关系保持连接。Duke 明确告诉患者，其信息受
              HIPAA 和 Duke 隐私规则保护； Hartford 则描述医疗集团监督和方案治理。AI 招聘页面进一步提供内部评估、回归测试和人工升级逻辑的证据。不过，本报告 审阅的公开材料没有披露可用性
              SLA、误报率、模型漂移指标、SOC 2 材料或公开 API 文档。产品风险也不止于软件： Cadence 的运营模式依赖合作伙伴品牌、临床人员审核能力、家用设备数据流，以及仍受支付方和监管审视的 RPM
