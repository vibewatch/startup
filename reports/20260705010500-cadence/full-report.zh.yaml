            title: 结构性报销顺风
            body: CMS RPM 计费代码创造了清晰收入路径，2020 至 2025 年增长 340%。不同于许多数字健康模式，Cadence 的收入锚定在 已确立的按项目付费代码上，且支付方接受度已有体现。
            calloutType: strength
