        title: 客户基础与采购路径
        blocks:
          - type: paragraph
            body: >-
              Cadence 的客户是医疗系统，不是自助式患者。公开材料始终把买方描述为希望扩展慢性病护理能力的医疗系统或医疗集团 领导团队；日常用户则是合作网络内的临床人员、护理管理者和被转诊患者。Duke Health
              Connected 与 Hartford HealthCare 的 HHC Remote Care 清楚展示了商业模式：Cadence 以白标方式进入提供方自有品牌、设备工作流和临床方案，
              而不是要求患者接受一个独立的 Cadence 身份。患者群也很具体，并非泛化人群。具名客户材料反复指向患有高血压、糖尿病、
              心衰及相邻慢性病的老年人。这种组合对承保很重要，因为它意味着自上而下的企业销售、实施很重的上线流程，以及后续患者 增长依赖每个医疗系统内部转诊行为，而不是消费者营销。
