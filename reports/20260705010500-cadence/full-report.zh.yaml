              从跟踪升级到买入的路径很直接，但仍取决于证据。Cadence 需要证明患者规模会转化为持久、多元且有利润的收入，而不是对报销敏感的总账单。第一个投资命题破裂条件是政策：如果 RPM
              报销收窄、计费控制收紧，或商业支付方大幅降低覆盖，即便入组继续增长，当前估值也可能迅速重置。第二个是融资结构。若未披露清算优先权、棘轮条款和其他下行保护，名义估值可能夸大新资金或普通股真正拿到的价值。第三个是运营质量：投资人仍需要续约、扩张、支付方结构和贡献利润率证据。这些缺口不意味着故事已经破裂，但解释了为什么当前正确姿态是密切跟踪、索取财务数据室
