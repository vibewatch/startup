        blocks:
          - type: paragraph
            body: >-
              Chris Altchek 担任 Cadence CEO 兼联合创始人。创立 Cadence 前，Altchek 打造并扩张了 BuzzFeed 的 Tasty
              美食媒体品牌，证明其有能力放大面向消费者的科技产品。他创办 Cadence 的判断是：心衰、高血压 和糖尿病治疗可以从诊室转到家中，并由自动化流程承接。董事会包括 Spark Capital 合伙人 Will
              Reed， 他在 Series C 投资后加入董事会。Dr. Jeffrey Ferranti 是 Duke Health 高级副总裁兼首席数字官； Duke Health 是 Cadence
              最新的医疗系统合作伙伴之一。公司约有 500 名员工，其中 300+ 人为临床人员。 Cadence 仍为私营公司，核心投资方持有董事席位；公开来源中，CEO 之外的完整高管团队信息仍有限。 Altchek
              在公司战略和融资中处于核心位置，因此关键人物集中风险突出。
