              Systems、Hartford HealthCare、Rush University System for Health 和 Texas Health Resources。公司 2025 年 ARR
              增长至三倍，但未公开绝对 ARR。 Cadence 称其每周为 Medicare 节省约 $2.7M。Mayo Clinic 研究发现，Cadence 模式让住院率下降 27%，并让每名患者每年总护理成本减少
