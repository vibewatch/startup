      - number: '7.2'
        title: 临床质量与技术风险
        blocks:
          - type: paragraph
            body: >-
              Cadence 的第二个重大风险，是它正试图在真实临床规模上自动化受监督慢性病管理。跨多个医疗系统管理 100,000+ 名活跃患者， 意味着很小的流程失败也可能变成实质问题。公开记录中的结果令人鼓舞：Mayo
              和 JACC 发表内容支持利用率下降和血压控制改善， Cadence 也始终把自身 AI 描述为由临床人员监督，而不是完全自主。这些事实能缓释风险，却不能消除风险。已审阅材料没有披露 AI
              辅助工作流的不良事件率、升级漏报率、人工覆盖频率或险些事件统计。投资人因此只能依赖结果研究和客户背书，而不是 一个已披露的安全控制系统。技术站位也有战略暴露。Biofourmis 等竞争对手强调获得 FDA
              许可的算法，而在本次来源集中， Cadence 推介的是受监督 AI 智能体，没有公开可见的 FDA 许可表述。如果监管方或医疗系统要求更清晰的软件问责边界， Cadence 可能同时面对合规压力和商业化压力。
