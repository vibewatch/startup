        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >-
              Cadence 的竞争差异集中在三条轴线上：临床深度（运营自有 300+ 人医疗集团）、AI 自动化（受监督 AI 智能体负责 每日监测）和白标模式（在合作医疗系统品牌下运营）。Biofourmis 主要依靠获得
              FDA 许可的 AI 算法竞争， 并已扩展到居家住院，但缺少 Cadence 的临床服务模式。Livongo/Teladoc 拥有 700K+ 慢性病护理会员，
              规模更大，但以直接面向消费者品牌运营，而不是嵌入医疗系统。Omada Health 聚焦糖尿病前期和心血管风险的行为改变项目， 靠教练服务而非临床干预。Current Health（Best Buy）提供 RPM
              基础设施和设备，但定位是平台而非临床服务。 Prevounce 和 Optimize Health 为诊所提供 RPM 技术和计费软件，但不运营临床团队。Epic 的原生 RPM 模块能做
              基础生命体征采集，却缺少 Cadence 提供的临床 AI 层和托管服务。目前没有竞争对手能在同一平台下同时匹配 Cadence 的规模（100K+ 患者）、临床深度（自有医疗集团）和 AI 自动化。
