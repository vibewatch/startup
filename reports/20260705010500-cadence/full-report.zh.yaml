  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型 / 状态
      - 估值或最新倍数快照
      - 相关性
      - 关键局限
    rows:
      - - Teladoc Health / Livongo
        - 有慢病护理历史的上市虚拟护理龙头
        - 2026 年市值约 $3B，已从峰值大幅回落
        - 是规模化数字慢病护理价值压缩最知名的上市警示案例
        - 更宽泛的传统业务组合和上市公司包袱，让它不是完美的纯 RPM 可比对象
      - - Omada Health
        - 慢病管理领域从私募走向上市的参照
        - 已融资 500M+；上市申报路径提升披露纪律
        - 更接近慢病管理经济性的商业模式基准
        - 渠道组合比 Cadence 的医疗服务方嵌入模式更偏雇主和付款方
      - - Biofourmis
        - 私有 AI 赋能远程监测公司
        - 私募轮累计融资约 $465M
        - 说明企业级远程监测叙事可以吸引大额资本
        - 私募融资不等于持久的公开市场或退出支撑
      - - Hims & Hers
        - 上市数字健康平台
        - 公开市场倍数高于传统护理管理公司
        - 是强增长如何支撑健康科技溢价估值的有用上限案例
        - 消费品牌和自费组合，与 Cadence 依赖报销的模式明显不同
      - - DarioHealth
        - 上市慢病管理同业
        - 相对增长叙事，公开估值支撑较低
        - 是缺乏主导规模的慢病护理资产的有用下限案例
        - 体量小得多，客户渠道也不同，直接比较较粗糙
      - - 数字健康行业组合
        - 分析师市场数据框架参照
        - 2026 年估值仍大致低于 2021 年峰值 40-60%
        - 说明即便融资改善，公允价值纪律仍重要
        - 组合只是背景，不是公司特定可比对象
    notes: 可比集合混合直接同业、上市代理和行业框架参照，用来框定估值，而不是强行给出单一倍数答案。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the principal public and private chronic-care valuation anchors available from retained 2026 sources,
        but not every undisclosed private round, secondary trade, or acquisition comp in digital health.
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV046
  - id: TV005
    title: 投资逻辑破裂与止损触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - RPM 报销重置
        - CMS 或主要商业付款方明显收紧可报销慢病护理工作流
        - Cadence 的核心变现引擎会迅速降级
        - 不要在 2026 年标记价或更高价格追加资本
      - - 收入质量低于预期
        - 私下尽调显示收入接近估算区间下沿，或回款质量薄弱
        - 隐含倍数转向偏紧区间
        - 下调公允价值，并要求更强条款
      - - 严苛下行保护
        - 下一轮融资披露惩罚性清算优先权、反稀释条款或参与权
        - 头条估值夸大了可转让价值
        - 将轮次价格视为结构性虚高
      - - 集中度冲击
        - 少数医疗系统或付款方对经济性的主导程度超出预期
        - 增长韧性和议价能力都会削弱
        - 施加集中度折价，或停止推进
      - - 利润率或留存薄弱
        - 贡献利润率或续约队列未显示持久经济性
        - 规模价值会低于患者数头条所暗示的水平
        - 建议维持跟踪，或转为放弃
    notes: 触发因素是可监测的尽调阈值，用来把一家私营公司的故事转换成明确的推进 / 停止条件。
    claimRefs:
      - CV027
      - CV028
      - CV031
      - CV038
      - CV041
      - CV043
      - CV044
      - CV047
      - CV049
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
      - 舒适阈值
    rows:
      - - 绝对 ARR 和收入桥
        - 按项目拆分的 ARR 基数、开票收入、回款，以及患者到收入桥
        - 需要弄清隐含倍数到底落在哪里
        - CFO 材料包，加队列级计费复核
        - 展示一个收入基数，让本轮落在可支撑的倍数区间内
      - - 毛利率和临床运营效率
        - 贡献利润率、人员配比，以及设备 / 服务成本结构
        - 把持久经济性和总开票幻觉区分开
        - 财务加运营复核
        - 在临床交付成本之后，证明有吸引力的单位经济性
      - - 付款方和诊断组合
        - 按付款方、诊断和报销代码拆分的收入占比
        - 直接检验单一收入来源的反向逻辑
        - 收入分析加付款方政策复核
        - 证明没有狭窄政策桶主导业务
      - - 留存和扩张
        - 续约队列、客户扩张，以及按医疗系统拆分的流失
        - 需要验证医疗服务方集成的黏性
        - 客户成功和账户复核
        - 提供能证明持久落地扩张行为的队列证据
      - - 融资条款
        - 清算优先权、反稀释条款、参与权、赎回权和任何二级交易部分
        - 头条 post-money 可能高估普通股可转让价值
        - 法务牵头的股权结构表复核
        - 确认下行结构足够干净，可以信任头条标记
      - - 治理质量 KPI 包
        - 董事会指标、预测纪律和数据室准备度
        - 更干净的 KPI 包，可能比更多合作 PR 更快推动建议升级
        - 董事会材料和管理层复核
        - 展示适合 crossover 式尽调的机构级报告能力
    notes: 这些要求按最能改变承销质量的因素排序，而不是按管理层最容易提供的材料排序。
    claimRefs:
      - CV009
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV048
      - CV050
