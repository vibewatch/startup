            body: >-
              Cadence 自称“面向慢性病护理的临床 AI”，但更准确的理解是一个嵌入医疗系统的服务栈：软件、护理运营和合作伙伴品牌
              被打包在一起。公开材料反复描述的是一套系统：在两次门诊之间追踪患者生命体征、症状、用药和参与度；把这些信号 送入受监督 AI
              工作流；再把输出转成基于临床方案的医生行动。公司卖的不只是消费者自我管理软件。它把患者入组、 设备分发、每日监测、医疗集团人员配置、EMR 集成，以及合作医疗系统品牌下的白标交付组合起来。这个运营模型解释了
              为什么 Cadence 既能宣称软件式规模，又能靠重服务形成差异化：产品资产不是一个单一应用，而是一套紧耦合的远程护理 系统，横跨患者、临床人员和支付方工作流。
