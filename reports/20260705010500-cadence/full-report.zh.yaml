              年，说明公司要么资本效率较高，要么收入增长覆盖了运营成本，让 Series B 资金撑得更久。 在 $1.23B 估值下，如果收入处于估算的 $100M–$150M 区间，公司约按 8–12x
              收入交易；对于高增长医疗 AI 公司， 这个倍数合理。Corewell、Memorial Hermann、Duke 等医疗系统创投部门参与 Series C，为财务投资人之外带来 战略资本。资金投向重点包括 AI
              开发、临床团队扩张、医疗系统合作伙伴上线，以及价值医疗模式开发。公司未披露 债务或授信安排，说明主要依赖股权融资；但这一阶段常见风险债务，未披露并不代表不存在。
