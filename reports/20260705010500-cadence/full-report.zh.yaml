    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              Cadence 是总部位于纽约市的医疗科技公司，由 Chris Altchek 于 2020 年创立。公司运营一个 AI 驱动的
              慢性病管理平台，与医疗系统合作，远程监测并治疗高血压、糖尿病和心衰患者。Cadence 的核心商业模式是 用 CPT 代码 99454、99457
              及相关代码，按月向保险方收取远程生理监测费用。公司向患者家中发送血压计 等联网设备，持续监测生命体征，并借助受监督 AI 智能体实时调整用药。Cadence 以白标临床服务直接嵌入
              合作医疗系统的医疗集团、电子病历和临床工作流。公司运营一个 300+ 人医疗集团，成员包括医生、护士和 执业护士，在各合作医疗系统的临床方案和品牌之下提供 7×24 小时护理。这个模式让 Cadence
              更像临床服务 提供方，而不只是监测平台。
