          type: process
        - id: risk
          label: 估值风险
          detail: 报销集中度和政策审查可能迅速压缩价值
          type: process
        - id: rec
          label: 建议：跟踪
          detail: 表面看公平，但没有尽调证据前，吸引力不足以支持买入
          type: output
      edges:
        - from: round
          to: scale
          label: 确认相关性
        - from: scale
          to: growth
          label: 支撑增长叙事
        - from: growth
          to: gap
          label: 仍缺精度
        - from: gap
          to: risk
          label: 迫使打折
        - from: risk
          to: rec
          label: 将判断维持在跟踪
