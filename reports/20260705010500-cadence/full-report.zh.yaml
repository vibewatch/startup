      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              美国远程患者监测的 TAM 预计到 2030 年为 $15B–$20B，依据是 1.33 亿至少患有一种慢性病的美国人， 以及 RPM 按月计费的潜力。SAM 收窄到约 $5B–$8B：目标人群是 Cadence
              聚焦的三类疾病患者 （高血压、糖尿病、心衰），且由 Medicare 或会报销 RPM 的商业保险覆盖。按医疗系统合作伙伴中的渗透率， 以及 Cadence 需要深度集成的白标临床服务模式估算，公司 SOM 约为
              $500M–$1B。不同分析机构对 RPM 市场 规模判断差异明显：Grand View Research 估计 2026 年为 $7.1B，CAGR 18.5%；Fortune Business
              Insights 估计 2026 年为 $6.2B，CAGR 19.2%。差异来自定义边界不同：哪些服务算 RPM，哪些属于更广义的远程护理。 CMS 计费数据显示，2020 至 2025 年 RPM 理赔增长
              340%，说明采用曲线仍很陡。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
