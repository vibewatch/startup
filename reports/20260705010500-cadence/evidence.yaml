evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ARR and revenue
    missingEvidence: Absolute ARR figure and revenue run rate not publicly disclosed
    whyItMatters: Cannot assess valuation multiple or capital efficiency without revenue data
    diligencePath: Request confidential financials in data room or estimate from patient count and average billing per patient
    relatedQuestionRefs:
      - QO007
      - QO022
  - type: missing-source
    severity: minor
    topic: Co-founders and full executive team beyond CEO (TO002)
    missingEvidence: Identity of co-founders beyond Chris Altchek and full C-suite composition
    whyItMatters: Key-person risk assessment incomplete without understanding full leadership depth
    diligencePath: Review LinkedIn, company about page, or request org chart from company
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: Debt and credit facilities
    missingEvidence: Whether Cadence has taken venture debt or credit facilities in addition to equity
    whyItMatters: Affects total capitalization and dilution calculations
    diligencePath: Request cap table and debt schedule from company or check Delaware filings
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: minor
    topic: Secondary market activity
    missingEvidence: No public data on secondary share sales or employee liquidity events
    whyItMatters: Secondary pricing would provide independent valuation signal
    diligencePath: Check secondary platforms (Forge, EquityZen) or request ROFR records
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: material
    topic: RPM market size divergence
    missingEvidence: Reconciliation of 40-50% variance between analyst RPM market size estimates
    whyItMatters: Makes TAM-based valuation multiples unreliable without consensus definition
    diligencePath: Request methodology documentation from each analyst firm; harmonize definitions
    relatedQuestionRefs:
      - QM012
  - type: private-evidence-only
    severity: material
    topic: RPM unit economics per patient
    missingEvidence: Detailed cost breakdown per patient including device, clinical labor, technology, and overhead costs
    whyItMatters: Cannot validate whether RPM margins support VC-backed growth economics
    diligencePath: Request financial model from company or benchmark against public RPM companies
    relatedQuestionRefs:
      - QM012
  - type: stale
    severity: minor
    topic: Patient enrollment conversion rates
    missingEvidence: Recent enrollment rate data from 2025-2026 across different health system segments
    whyItMatters: Enrollment rates directly affect SOM calculations and revenue projections
    diligencePath: Survey health system partners or request Cadence's internal enrollment funnel data
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: Cadence competitive win rates
    missingEvidence: No public data on win rate against specific competitors in health system deal processes
    whyItMatters: Cannot assess true competitive position without head-to-head win data
    diligencePath: Request anonymized deal data from company or interview health system procurement teams
    relatedQuestionRefs:
      - QP019
  - type: missing-source
    severity: minor
    topic: Exclusive partnership terms
    missingEvidence: Whether Cadence has contractual exclusivity with any health system partners
    whyItMatters: Exclusivity would strengthen moat assessment; non-exclusivity weakens switching cost argument
    diligencePath: Request sample partner agreement or ask about exclusivity provisions in diligence
    relatedQuestionRefs:
      - QP024
  - type: stale
    severity: minor
    topic: RPM vendor retention rates
    missingEvidence: Recent vendor retention data specific to enterprise RPM platforms in 2025-2026
    whyItMatters: Low retention would undermine switching cost moat thesis
    diligencePath: Request data from KLAS Research or conduct CIO interviews
    relatedQuestionRefs:
      - QP015
  - type: private-evidence-only
    severity: blocking
    topic: Absolute revenue and margins
    missingEvidence: Absolute ARR, gross margin, net margin, and burn rate not disclosed
    whyItMatters: Cannot validate valuation multiple, capital efficiency, or path to profitability
    diligencePath: Request P&L, cash flow statement, and financial model from data room
    relatedQuestionRefs:
      - QI008
      - QI009
      - QI015
      - QI023
      - QI024
  - type: private-evidence-only
    severity: material
    topic: Revenue concentration
    missingEvidence: Revenue breakdown by health system partner and payer type
    whyItMatters: High concentration in few partners creates material risk; payer mix affects margin
    diligencePath: Request customer revenue breakdown and payer mix analysis from company
    relatedQuestionRefs:
