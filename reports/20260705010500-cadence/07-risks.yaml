- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Reimbursement reset
    - CMS proposed/final rule language or payer policy bulletins
    - Any rule or policy that materially narrows reimbursable diagnoses, cuts RPM economics, or adds documentation burden that breaks unit economics
    - Pause new capital and rebuild downside case before follow-on commitment
  - - Audit or recoupment exposure
    - OIG/CMS inquiry, repayment demand, or denial-rate spike
    - Confirmed enforcement action, elevated recoupments, or denial trend that suggests broken billing discipline
    - Move diligence to compliance workstream immediately; no close without clean remediation plan
  - - Clinical-quality deterioration
    - Safety review, escalation-miss signal, or partner complaint trend
    - Any disclosed rise in adverse events, missed escalations, or medication-management errors above internal threshold
    - Treat as thesis-threatening because trust and outcomes are core to the story
  - - Flagship customer concentration
    - Expansion and renewal behavior at top partner systems
    - Two or more marquee systems halt expansion, downscope, or renegotiate aggressively in one planning cycle
    - Reduce valuation tolerance and demand account-level retention evidence
  - - Leadership fragility
    - Executive turnover or bench weakness becoming visible
    - CEO departure, compliance-lead turnover, or inability to name a deeper operator bench before the next scale step
    - Pause until succession and operating accountability are clear
  - - Market multiple reset
    - Public RPM / virtual-care comp deterioration and funding selectivity
    - Sector multiple compression without offsetting improvement in Cadence-specific reimbursement durability
    - Tighten return hurdle and avoid underwriting peak private multiple assumptions
  notes: These kill criteria are underwriting tools rather than predictions; the goal is to identify when category risk becomes company-specific impairment.
