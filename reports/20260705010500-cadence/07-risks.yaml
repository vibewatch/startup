  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cms-2027-rulemaking
    missingEvidence: A proposed or final 2027 physician fee schedule showing whether RPM codes will be preserved, repriced, or narrowed.
    whyItMatters: The user's core downside case is policy-driven reimbursement compression, but CMS has not yet published the decisive 2027 rule text.
    diligencePath: Monitor the 2027 proposed rule immediately on release and run a reimbursement sensitivity model by code and diagnosis.
    relatedQuestionRefs:
    - QR007
  - type: private-evidence-only
    severity: material
    topic: ai-safety-disclosure
    missingEvidence: Internal safety metrics such as escalation misses, override rates, adverse events, and QA audit findings for AI-assisted workflows.
    whyItMatters: Outcome studies are useful, but investors still need direct process-safety evidence for a scaled AI-enabled clinical service.
    diligencePath: Request a de-identified safety dashboard, incident-review process, and quality committee materials in diligence.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: ai-regulatory-path
    missingEvidence: Management's regulatory strategy memo on whether the AI layer is intended to remain supervised workflow software or pursue clearer FDA-facing positioning.
    whyItMatters: Competitive and procurement pressure could rise if health systems begin preferring a clearer regulatory classification for higher-acuity AI tools.
    diligencePath: Ask management and counsel to walk through current claims language, intended clinical scope, and any pre-submission or regulatory consultations.
    relatedQuestionRefs:
    - QR026
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: A complete legal and compliance register covering all payer contracts, audits, incident logs, and counsel memoranda behind the public risk set.
    whyItMatters: The regulatory/legal table is intentionally partial because the public record cannot reveal every private audit, appeal, or contract-level obligation.
    diligencePath: Request the internal compliance register, recent audits, and outside-counsel summaries to convert the table from public-risk register to diligence-complete register.
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-and-payer-concentration
    missingEvidence: Top-account revenue share, payer mix, renewal cohorts, and denial-rate concentration by health system and diagnosis.
    whyItMatters: Cadence's headline partner count does not reveal whether a small number of systems or payers dominate economics and risk.
    diligencePath: Request cohort retention, top-ten account exposure, payer-mix waterfall, and diagnosis-level coverage sensitivity before underwriting a follow-on round.
    relatedQuestionRefs:
    - QR011
    - QR012
    relatedTableRefs:
    - TR003
