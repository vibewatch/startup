- id: people-market-and-execution-underwriting
  title: People, market, and execution underwriting
  body: 'The remaining risks are executional but still investment-critical. Chris Altchek is central to the company''s public narrative, fundraising, and strategic framing, while the broader executive bench remains only lightly disclosed in public sources. That is manageable while the business is winning marquee customers, but it increases fragility if scale stresses the organization or if a leadership transition occurs before a deeper bench is visible. Execution risk is also unusually multi-threaded: Cadence has to scale clinician staffing, reimbursement operations, device logistics, EMR integrations, and QA controls in parallel, not one by one. On top of that, the market backdrop remains selective. Digital-health funding improved in 2026, but public healthtech multiples and remote-monitoring sentiment remained compressed and capital flowed disproportionately to a small number of companies. The right conclusion is not immediate thesis break; it is high residual risk with explicit kill criteria.
    If reimbursement narrows, quality metrics deteriorate, or concentration risk appears in a few anchor systems, the financing and valuation story could reset quickly even if top-line patient counts continue to grow.'
