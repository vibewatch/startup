callouts:
  - calloutType: strength
    title: "Unique White-Label Clinical Service Model"
    body: >-
      Cadence's white-label approach embedded into health system workflows creates deeper integration
      and higher switching costs than standalone platform competitors.
    claimRefs: [CP007, CP020]
  - calloutType: risk
    title: "AI Automation Gap Closing Rapidly"
    body: >-
      AI technology advantage is the least durable moat element, with Biofourmis and big tech companies
      rapidly advancing clinical automation capabilities.
    claimRefs: [CP024, CP002]
  - calloutType: insight
    title: "Reimbursement Model as Both Advantage and Vulnerability"
    body: >-
      Cadence's direct payer billing model uniquely reduces buyer friction but creates category-wide
      concentration risk on CMS policy that no competitor has solved.
    claimRefs: [CP014, CP025]
