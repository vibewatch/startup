      - number: '7.3'
        title: Concentration, competition, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Cadence's partner story is a strength on the surface and a dependency map underneath. The company has real
              health-system references, but public evidence names only part of the 20-plus partner base and does not
              disclose revenue concentration, payer mix, or renewal economics. That matters because several of the
              strongest proof points are also investor relationships: Corewell Health, Memorial Hermann, and Duke Health
              serve as both validators and potential concentration nodes. The competitive set also spans more than
              startups. Biofourmis can market clinically oriented, FDA-cleared AI; Epic can bundle workflow-adjacent
              monitoring into the core EHR; and Apple and Google/Fitbit can keep pushing patient-owned monitoring
              expectations toward commodity data capture. Cadence's white-label operating model still looks
              differentiated because it combines workflow integration, a clinical service layer, and AI-assisted
              monitoring, but the moat is not purely technological. It depends on payer support, implementation depth,
              and partner expansion behavior. If flagship health systems slow adoption or renegotiate economics, the
              partner count alone may overstate resilience.
