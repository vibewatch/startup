      - number: '4.2'
        title: Unit Economics and Margin Structure
        blocks:
          - type: paragraph
            body: >-
              Cadence's unit economics center on per-patient monthly contribution margin. Revenue per patient is
              estimated at $60-150/month from RPM billing. Key cost drivers include clinical labor (nurses, NPs,
              physicians at approximately $20-40/patient/month depending on patient-to-clinician ratio), connected
              device costs (amortized at approximately $5-10/patient/month), technology platform costs ($3-8/patient),
              and patient engagement overhead ($2-5/patient). This suggests gross margins in the 40-65% range depending
              on clinical labor efficiency, which AI automation is designed to improve. The supervised AI agent model
              aims to increase patient-to-clinician ratios from traditional 200-300:1 to potentially 500-1000:1, which
              would dramatically improve unit economics if achieved. The company's tripling of ARR in 2025 while
              maintaining a clinical team of 300+ suggests either significant patient volume growth or improving
              per-patient economics. Without disclosed margins, the financial health of the business remains a key
              diligence question, though the ability to raise $100M at $1.23B suggests investors have visibility into
              attractive unit economics in the data room.
