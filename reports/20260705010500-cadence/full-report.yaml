      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Cadence's market has a three-sided buyer structure. The buyer is the health system (C-suite, chief digital
              officer, or population health leadership) that contracts with Cadence for white-labeled chronic care
              services. The user is the patient with chronic conditions who receives connected devices and ongoing
              monitoring. The payer is Medicare or commercial insurance that reimburses monthly RPM codes. Budget
              ownership sits with health system population health or value-based care teams, as Cadence's model
              generates revenue for health systems while Cadence bills payers directly under the health system's
              credentials. The adoption path requires integration with the health system's EMR, credentialing of
              Cadence's clinical staff, and patient enrollment workflows. Key buyer segments include large integrated
              health systems (e.g., Providence, Corewell), academic medical centers (Duke, Yale New Haven), community
              health systems (Lifepoint, CHS), and emerging value-based care organizations. Each segment has different
              adoption timelines, compliance requirements, and patient populations.
            claimRefs:
              - CM013
              - CM014
