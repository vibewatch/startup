      - number: '8.4'
        title: Thesis-breaks and final diligence
        blocks:
          - type: paragraph
            body: >-
              The path from track to buy is straightforward but still evidence-dependent. Cadence needs to show that
              patient scale translates into durable, diversified, and profitable revenue rather than into
              reimbursement-sensitive gross billings. The first thesis-break condition is policy: if RPM reimbursement
              narrows, billing controls tighten, or commercial payers materially reduce coverage, the current valuation
              can reset quickly even if enrollment keeps growing. The second is financing structure. Without disclosure
              on liquidation preferences, ratchets, and any other downside protections, the headline valuation may
              overstate the transfer value available to new money or common-equity holders. The third is operating
              quality: investors still need renewal, expansion, payer-mix, and contribution-margin evidence. Those gaps
              do not make the story broken, but they do explain why the right current posture is to track closely,
              request a finance-room KPI package, and upgrade only if the next diligence cycle proves revenue quality
              and reimbursement resilience.
