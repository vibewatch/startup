      - number: '8.3'
        title: Comparable lens and scenario range
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis argues for discipline rather than excitement. Digital-health valuations in 2026 had
              improved from the 2022-2023 trough, but major market-data sources still described the sector as trading
              roughly 40% to 60% below its 2021 peak conditions. Teladoc remains the most visible public cautionary
              example: it still carries multibillion-dollar scale, yet its equity value is far below the narrative peak
              associated with Livongo. Omada Health is strategically closer because it also addresses chronic-condition
              management and now offers public-market disclosure through a filing path, while Biofourmis demonstrates
              that large private funding totals do not guarantee durable valuation support. Hims & Hers and DarioHealth
              widen the lens by showing how public markets reward direct-to-consumer subscription growth differently
              from provider-embedded care management. On that mix, Cadence's current mark looks fair if the hidden
              revenue base is already meaningful, but not demonstrably cheap. A reasonable public-evidence range is
              roughly $0.6 billion to $2.1 billion, with the base case centered around the latest round rather than far
              above it.
