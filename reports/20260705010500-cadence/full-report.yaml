  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The chronic disease management and remote patient monitoring market features a diverse competitive
              landscape ranging from pure-play RPM platforms to integrated telehealth providers and emerging AI-native
              care companies. Cadence's primary competitors include Biofourmis, which offers AI-powered remote
              monitoring with FDA-cleared algorithms; Livongo (now part of Teladoc Health), the pioneer in connected
              device-based chronic care with 700,000+ members; Omada Health, focused on behavioral health interventions
              for diabetes and cardiovascular disease; and Current Health (acquired by Best Buy Health), which provides
              hospital-at-home and RPM infrastructure. The competitive field also includes health system-built
              solutions, EHR-native monitoring modules from Epic and Cerner, and emerging AI startups targeting clinical
              automation. Market consolidation accelerated in 2023-2025 with multiple acquisitions, though the
              regulatory scrutiny of RPM billing affects all participants equally, creating both category-wide risk and
              opportunity for well-positioned players. Cadence differentiates primarily through its white-label clinical
              service model, which embeds deeply into health system workflows rather than operating as a standalone
              patient-facing platform.
            claimRefs:
