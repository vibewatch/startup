        title: Leadership, Governance, and Key People
        blocks:
          - type: paragraph
            body: >-
              Chris Altchek serves as CEO and co-founder of Cadence. Before founding Cadence, Altchek built and scaled
              BuzzFeed's Tasty food media brand, demonstrating experience in scaling consumer-facing technology
              products. His thesis for Cadence was that treatment of heart failure, hypertension, and diabetes could be
              automated away from the clinic and into the home. The board includes Will Reed, Partner at Spark Capital,
