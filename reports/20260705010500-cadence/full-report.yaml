            body: >-
              As a private company, Cadence's financial disclosure is limited. Key unknowns include absolute ARR (only
              growth rate disclosed), gross and net margins, customer acquisition cost, lifetime value per patient,
              churn rates, burn rate and runway, and detailed revenue breakdown by payer type. The tripling of ARR in
