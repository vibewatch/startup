  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundaries
        blocks:
          - type: paragraph
            body: >-
              Cadence's primary market is the intersection of remote patient monitoring (RPM), chronic disease
              management, and AI-powered clinical services. The core market boundary encompasses technology-enabled care
              delivery for patients with chronic conditions—specifically hypertension, diabetes, and heart failure—that
              is reimbursed through Medicare and commercial insurance RPM codes. The market excludes pure consumer
              wellness devices, acute care telehealth, and mental health platforms. Adjacent markets include value-based
              care enablement, hospital-at-home programs, and chronic care management (CCM) services billed under
              separate CPT codes. The status-quo substitute is traditional primary care with periodic in-office visits,
              which currently fails to adequately manage chronic conditions given that fewer than 30% of hypertension
              patients achieve blood pressure control. The market is defined by the CMS fee schedule for RPM codes
              99453, 99454, 99457, and 99458, creating a structured reimbursement pathway that anchors revenue for all
              participants.
