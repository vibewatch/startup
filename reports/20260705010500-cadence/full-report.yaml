      Bear, base, and bull ranges suggest that the latest round can hold only if private diligence confirms a strong
      revenue base and clean financing terms.
    approximationNotes: >-
      Ranges are analyst estimates in $M based on public evidence, scenario assumptions, and comparable framing rather
      than on a full DCF or liquidation waterfall.
