  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Illustrative value sensitivity shows that revenue quality and reimbursement resilience can add meaningfully to
      fair value, while policy or term shocks can erase it quickly.
    approximationNotes: >-
      Bars show directional value deltas in $M around an illustrative $1.15B base anchor; they are not additive and are
      intended only to show leverage to key underwriting variables.
