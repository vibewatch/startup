      - number: '3.2'
        title: Feature and Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              Cadence's competitive differentiation centers on three axes: clinical depth (operating its own 300+ person
              medical group), AI automation (supervised AI agents for daily monitoring), and the white-label model
              (operating under partner health system brands). Biofourmis competes primarily on FDA-cleared AI algorithms
              and has expanded into hospital-at-home, but lacks Cadence's clinical services model. Livongo/Teladoc
              offers scale with 700K+ chronic care members but operates as a direct-to-consumer brand rather than
              embedding into health systems. Omada Health focuses on behavioral change programs for prediabetes and
              cardiovascular risk, using coaching rather than clinical intervention. Current Health (Best Buy) provides
              RPM infrastructure and devices but positions as a platform rather than a clinical service. Prevounce and
              Optimize Health provide RPM technology and billing software for practices but do not operate clinical
              teams. Epic's native RPM modules offer basic vital collection but lack the clinical AI layer and managed
              services that Cadence provides. No competitor currently matches Cadence's combination of scale (100K+
              patients), clinical depth (own medical group), and AI automation under one platform.
            claimRefs:
