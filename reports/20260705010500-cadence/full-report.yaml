      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >-
              The total addressable market for remote patient monitoring in the United States is estimated at $15-20
              billion by 2030, based on the 133 million Americans with at least one chronic condition and the potential
              for monthly RPM billing. The serviceable addressable market narrows to approximately $5-8 billion based on
              patients with the three conditions Cadence targets (hypertension, diabetes, heart failure) who are insured
              under Medicare or commercial plans that reimburse RPM. The serviceable obtainable market for Cadence is
              estimated at $500M-1B based on penetration rates among health system partners and the company's
              white-label clinical service model requiring deep integration. Multiple analyst reports size the RPM
              market differently: Grand View Research estimates $7.1B in 2026 growing at 18.5% CAGR, while Fortune
              Business Insights estimates $6.2B in 2026 with 19.2% CAGR. The discrepancy reflects differing definitions
              of what constitutes RPM versus broader remote care services. CMS billing data shows RPM claims grew 340%
              from 2020 to 2025, indicating rapid adoption trajectory.
