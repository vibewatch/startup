  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring supports a 6.5/10 overall read: strong market need and customer scale, but only middling
      valuation support because economics and risk transfer remain under-disclosed.
    approximationNotes: >-
      Scores use a 1-10 editorial scale based on retained public evidence as of 2026-07-05; they are not
      management-provided KPIs.
    data:
      items:
        - label: Market need
          value: 8
          unit: /10
          note: Chronic-disease management remains a large and urgent problem set.
        - label: Customer scale
          value: 7
          unit: /10
          note: 100,000+ patients and 20+ health systems indicate meaningful deployment.
        - label: Growth signal
          value: 7
          unit: /10
          note: ARR tripled in 2025, albeit without denominator disclosure.
        - label: Economics visibility
          value: 4
          unit: /10
          note: ARR base, margin, and collections disclosure remain missing.
        - label: Reimbursement resilience
          value: 3
          unit: /10
          note: Policy sensitivity remains the largest clean anti-thesis.
        - label: Valuation support
          value: 6
          unit: /10
          note: Current mark can be defended, but not chased, on public evidence alone.
        - label: Evidence quality
          value: 5
          unit: /10
          note: There is enough to track closely, but not enough for high-conviction underwriting.
