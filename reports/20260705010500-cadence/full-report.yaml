      - number: '7.2'
        title: Clinical quality and technology risk
        blocks:
          - type: paragraph
            body: >-
              Cadence's second major risk is that it is trying to automate supervised chronic-disease management at real
              clinical scale. Managing more than 100,000 active patients across multiple health systems means tiny
              process failures can become material. The public record is encouraging on outcomes: Mayo and JACC
              publications support lower utilization and better blood-pressure control, and Cadence consistently
              describes its AI as supervised by clinicians rather than fully autonomous. Those facts mitigate risk, but
              they do not close it. The reviewed materials do not disclose adverse-event rates, escalation miss rates,
              override frequency, or near-miss statistics for AI-assisted workflows. That leaves investors relying on
              outcome studies and customer endorsements rather than a disclosed safety-control system. The technology
              posture is also strategically exposed. Competitors such as Biofourmis emphasize FDA-cleared algorithms,
              whereas Cadence markets supervised AI agents without publicly visible FDA-clearance language in this
              source set. If regulators or health systems demand clearer software-accountability boundaries, Cadence
              could face both compliance and go-to-market pressure at the same time.
