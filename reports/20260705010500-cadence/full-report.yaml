      - number: '3.4'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Cadence's competitive moat has several components of varying durability. The strongest moat element is EMR
              integration depth and clinical workflow embedding, which creates 12-18 month switching costs for health
              system partners. The clinical team (300+ staff operating under partner credentials) represents operational
              scale that is expensive to replicate. Peer-reviewed outcome data (Mayo Clinic study, JACC study) provides
              credibility that newer entrants cannot match. However, several moat vulnerabilities exist: the
              reimbursement model can be replicated by any company that builds clinical capacity; AI automation
              technology is advancing rapidly across all competitors; and big tech companies (Apple, Google) could
              bypass the RPM billing framework entirely by bundling monitoring into consumer devices. The regulatory
              risk is not a company-specific moat vulnerability but an industry-wide existential risk that affects all
              competitors. Cadence's strongest defensible position is the combination of clinical outcomes data, health
              system relationships, and operational scale, which together create a multi-layered barrier to displacement
              even if individual components are replicable.
