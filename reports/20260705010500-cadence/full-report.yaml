      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Key growth drivers include the aging US population (65+ projected to reach 80M by 2030), expanding CMS
              reimbursement for RPM services, health system financial pressure to reduce readmissions under value-based
              contracts, and clinical evidence demonstrating RPM's ability to reduce hospitalizations by 20-30%. AI
              advances are accelerating the scalability of RPM platforms by automating clinical triage and reducing the
              labor cost per patient. Key adoption constraints include regulatory uncertainty around RPM billing (HHS
              OIG scrutiny), high switching costs once a health system integrates an RPM partner into its EMR, the need
              for clinical trust in AI-assisted care decisions, capital intensity of connected device programs, and
              potential CMS reimbursement cuts that could collapse unit economics. The 2026 HHS OIG report on RPM
              vulnerabilities and UnitedHealthcare's pushback represent material headwinds that could slow market growth
              if billing requirements tighten. Additionally, large technology companies (Apple, Google) investing in
              health monitoring create potential long-term disruption risk for dedicated RPM platforms. Current RPM
              penetration is estimated at only 5-10% of eligible patients nationally, indicating significant untapped
              growth potential despite the regulatory headwinds. Market participants must navigate the tension between
              rapid claims growth and increasing payer scrutiny to capture the remaining opportunity.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
