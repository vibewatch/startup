  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Reimbursement and regulatory fragility
        blocks:
          - type: paragraph
            body: >-
              Cadence's most important risk is not clinical demand but reimbursement architecture. The company sells an
              AI-enabled chronic-care service that is economically attractive because Medicare and commercial payers
              reimburse remote physiologic monitoring and related clinical time, letting health systems adopt Cadence
              without paying a classic SaaS fee out of pocket. That same design creates a single external policy choke
              point. HHS OIG has already escalated from a 2024 recommendation for additional RPM oversight to a 2025
              billing report that highlighted fast payment growth and billing patterns that merit scrutiny. Commercial
              payers are moving too: UnitedHealthcare's attempt to narrow RPM coverage to a small subset of diagnoses
              shows that a major insurer is willing to challenge the category's default reimbursement logic even after
              RPM achieved broad adoption. The result is a master risk that can hit revenue, expansion, valuation, and
              financing simultaneously. Public evidence does not show that Cadence is currently impaired, but it does
              show that the economic substrate under the model is politically and administratively revocable rather than
              contractually durable.
