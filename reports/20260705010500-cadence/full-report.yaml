      - number: '6.4'
        title: Expansion, concentration, and customer risks
        blocks:
          - type: paragraph
            body: >-
              Cadence’s expansion logic is intuitive: once a health system trusts the white-label operating model, it
              can widen disease coverage, add more clinician referrers, and expand from one medical group or site to
              more of the system. The same structure also creates concentration risk. A small number of large health
              systems may drive most volume, provide the strongest public references, and even participate in financing
              rounds, which could concentrate both revenue and roadmap influence. The adverse evidence is not about
              customer dissatisfaction so much as procurement friction. RPM programs face billing and coverage scrutiny:
              OIG has called for more Medicare oversight, and payer policy tightening increases the burden on health
              systems to prove compliance and reimbursement durability. In practice, that means Cadence may keep winning
              enterprise relationships, but each incremental expansion has to clear reimbursement, documentation, and
              change-management hurdles inside conservative provider organizations. Publicly visible evidence does not
              show obvious churn events or hostile customer references, which is a positive, but it also means the main
              downside cases are subtler: slowed referrals, narrower payer eligibility, and expansion programs that
              stall before becoming systemwide standards. Those risks are exactly the kind that can be missed if
              diligence focuses on logos and clinical outcomes while ignoring procurement mechanics and reimbursement
              exposure.
