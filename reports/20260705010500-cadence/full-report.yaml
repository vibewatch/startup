      - number: '3.3'
        title: Pricing and Packaging Comparison
        blocks:
          - type: paragraph
            body: >-
              Pricing models vary significantly across the competitive landscape. Cadence's model is uniquely structured
              around payer reimbursement—the company bills Medicare and commercial insurers directly using CPT
              99454/99457 codes, making the health system partner's out-of-pocket cost minimal (primarily program
              management overhead). Biofourmis charges health systems or payers per-patient-per-month fees ranging from
              $100-300 depending on acuity level. Livongo/Teladoc operates primarily through employer contracts at
              $50-80 per member per month. Omada Health charges employers $150-500 per participant for its behavioral
              programs. Prevounce and Optimize Health charge practices $30-50 per patient per month for billing and
              workflow software. The key insight is that Cadence's reimbursement-based model shifts economic risk from
              the health system buyer to the payer, reducing friction in the sales process but creating dependency on
              continued CMS reimbursement policy. This pricing structure is both a competitive advantage (lower barrier
              to adoption) and a strategic vulnerability (single regulatory point of failure).
            claimRefs:
