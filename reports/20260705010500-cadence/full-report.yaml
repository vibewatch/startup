chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Cadence is a healthcare technology company headquartered in New York City, founded in 2020 by Chris
              Altchek. The company operates an AI-powered chronic disease management platform that partners with health
              systems to remotely monitor and treat patients with hypertension, diabetes, and heart failure. Cadence's
              core business model centers on billing insurers monthly for remote physiologic monitoring using CPT codes
              99454, 99457, and related codes. The company sends patients home with connected devices such as blood
              pressure cuffs, continuously monitors their vitals, and adjusts medications in real time using supervised
              AI agents. Cadence operates as a white-labeled clinical service embedded directly into partner health
              systems' medical groups, electronic medical records, and clinical workflows. The company operates a
              medical group with more than 300 staff members including physicians, nurses, and nurse practitioners who
              provide care 24 hours a day, seven days a week under the clinical protocols and brand of each partner
              health system. This model positions Cadence as a clinical service provider rather than merely a monitoring
              platform.
