            body: >-
              Cadence has raised a total of $241 million across its funding history. The company's Series A was led by
              Thrive Capital, an early backer of OpenAI. Cadence raised a $100 million Series B round in December 2021.
              Most recently, on June 23, 2026, the company closed a $100 million Series C round led by Spark Capital,
