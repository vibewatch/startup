  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization
        blocks:
          - type: paragraph
            body: >-
              Cadence generates revenue primarily through monthly insurance reimbursement for remote physiologic
              monitoring services. The company bills Medicare and commercial payers using CPT codes 99454 (device supply
              and data transmission, ~$64/month), 99457 (clinical monitoring time, ~$52/month), and 99458 (additional
              clinical time, ~$42/month). Combined per-patient monthly billing ranges from $60-150 depending on code
              combination and payer. With 100,000+ active patients, this suggests a revenue run rate potentially in the
              $70-180M range, though the company has only disclosed that ARR tripled in 2025 without revealing absolute
              figures. Secondary revenue streams may include value-based care contracts where Cadence shares in cost
              savings generated for health systems, and program management fees for implementation and integration
              services. The company's plan to expand into value-based care models with its Series C funding suggests
              this could become a material revenue stream. The Medicare savings claim of $2.7M per week ($140M
              annualized) provides a ceiling on the value Cadence creates, though the company captures only a fraction
              of this through billing.
