      - number: '8.2'
        title: Current financing context and price support
        blocks:
          - type: paragraph
            body: >-
              The key valuation question is whether Cadence's disclosed growth and footprint are already large enough to
              make $1.23 billion look ordinary. Public evidence points to a plausible but not proven answer. Cadence's
              100,000-plus patient footprint, health-system orientation, and 2025 ARR tripling claim imply genuine
              commercial momentum, and published RPM reimbursement ranges suggest an estimated revenue run rate
              somewhere around $70 million to $180 million if active patient volumes convert cleanly into reimbursable
              monitoring revenue. At that wide band, the latest round implies roughly 7x to 18x revenue. That is not
              obviously absurd for a growth-stage healthcare AI company, but it is too broad to support a buy
              recommendation because the same price can look conservative at the top of the band and stretched at the
              bottom. The valuation also deserves a discount for revenue-source concentration. Cadence's monetization
              appears tied primarily to reimbursable chronic-care workflows, so reimbursement scrutiny or tighter
              coverage can hit growth, margins, and next-round pricing at the same time.
            claimRefs:
              - CV005
