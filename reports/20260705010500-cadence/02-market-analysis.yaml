callouts:
  - calloutType: strength
    title: "Structural Reimbursement Tailwind"
    body: >-
      CMS RPM billing codes create a clear revenue pathway that grew 340% from 2020-2025. Unlike many
      digital health models, Cadence's revenue is anchored in established fee-for-service codes with
      demonstrated payer acceptance.
    claimRefs: [CM011, CM003]
  - calloutType: risk
    title: "Regulatory Ceiling on Market Growth"
    body: >-
      HHS OIG scrutiny and UnitedHealthcare pushback could constrain market growth if RPM billing
      requirements tighten or reimbursement rates decline, directly impacting the revenue model for
      all participants including Cadence.
    claimRefs: [CM022, CM023]
  - calloutType: insight
    title: "Market Size Uncertainty"
    body: >-
      Analyst estimates for the RPM market vary by 40-50% depending on definition boundaries, suggesting
      the market is still being defined and measurement methodologies have not converged.
    claimRefs: [CM010, CM011, CM012]
