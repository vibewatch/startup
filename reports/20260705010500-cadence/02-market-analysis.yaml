  name: Cadence
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Cadence operates in the remote patient monitoring and chronic disease management market, estimated
    at $5-8B in 2026 growing to $15-20B by 2030. The addressable market is anchored by 133M+ Americans
    with chronic conditions and CMS reimbursement codes that create a structured revenue pathway for
    RPM providers.
sections:
  - id: market-definition
    title: "Market Definition and Boundaries"
    body: >-
      Cadence's primary market is the intersection of remote patient monitoring (RPM), chronic disease
      management, and AI-powered clinical services. The core market boundary encompasses technology-enabled
      care delivery for patients with chronic conditions—specifically hypertension, diabetes, and heart
      failure—that is reimbursed through Medicare and commercial insurance RPM codes. The market excludes
      pure consumer wellness devices, acute care telehealth, and mental health platforms. Adjacent markets
      include value-based care enablement, hospital-at-home programs, and chronic care management (CCM)
      services billed under separate CPT codes. The status-quo substitute is traditional primary care
      with periodic in-office visits, which currently fails to adequately manage chronic conditions given
      that fewer than 30% of hypertension patients achieve blood pressure control. The market is defined
      by the CMS fee schedule for RPM codes 99453, 99454, 99457, and 99458, creating a structured
      reimbursement pathway that anchors revenue for all participants.
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
    tableRefs: [TM001]
    figureRefs: [FM004]
  - id: market-sizing
    title: "Market Sizing: TAM, SAM, and SOM"
    body: >-
      The total addressable market for remote patient monitoring in the United States is estimated at
      $15-20 billion by 2030, based on the 133 million Americans with at least one chronic condition
      and the potential for monthly RPM billing. The serviceable addressable market narrows to approximately
      $5-8 billion based on patients with the three conditions Cadence targets (hypertension, diabetes,
      heart failure) who are insured under Medicare or commercial plans that reimburse RPM. The serviceable
      obtainable market for Cadence is estimated at $500M-1B based on penetration rates among health system
      partners and the company's white-label clinical service model requiring deep integration. Multiple
      analyst reports size the RPM market differently: Grand View Research estimates $7.1B in 2026 growing
      at 18.5% CAGR, while Fortune Business Insights estimates $6.2B in 2026 with 19.2% CAGR. The
      discrepancy reflects differing definitions of what constitutes RPM versus broader remote care services.
      CMS billing data shows RPM claims grew 340% from 2020 to 2025, indicating rapid adoption trajectory.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011, CM012]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]
  - id: buyer-segmentation
    title: "Buyer, User, and Payer Segmentation"
    body: >-
      Cadence's market has a three-sided buyer structure. The buyer is the health system (C-suite, chief
      digital officer, or population health leadership) that contracts with Cadence for white-labeled
      chronic care services. The user is the patient with chronic conditions who receives connected
      devices and ongoing monitoring. The payer is Medicare or commercial insurance that reimburses
      monthly RPM codes. Budget ownership sits with health system population health or value-based care
      teams, as Cadence's model generates revenue for health systems while Cadence bills payers directly
      under the health system's credentials. The adoption path requires integration with the health
      system's EMR, credentialing of Cadence's clinical staff, and patient enrollment workflows. Key
      buyer segments include large integrated health systems (e.g., Providence, Corewell), academic
      medical centers (Duke, Yale New Haven), community health systems (Lifepoint, CHS), and emerging
      value-based care organizations. Each segment has different adoption timelines, compliance
      requirements, and patient populations.
    claimRefs: [CM013, CM014, CM015, CM016, CM017]
    tableRefs: [TM003]
    figureRefs: [FM003]
  - id: growth-drivers-constraints
    title: "Growth Drivers and Adoption Constraints"
    body: >-
      Key growth drivers include the aging US population (65+ projected to reach 80M by 2030), expanding
      CMS reimbursement for RPM services, health system financial pressure to reduce readmissions under
      value-based contracts, and clinical evidence demonstrating RPM's ability to reduce hospitalizations
      by 20-30%. AI advances are accelerating the scalability of RPM platforms by automating clinical
      triage and reducing the labor cost per patient. Key adoption constraints include regulatory
      uncertainty around RPM billing (HHS OIG scrutiny), high switching costs once a health system
      integrates an RPM partner into its EMR, the need for clinical trust in AI-assisted care decisions,
      capital intensity of connected device programs, and potential CMS reimbursement cuts that could
      collapse unit economics. The 2026 HHS OIG report on RPM vulnerabilities and UnitedHealthcare's
      pushback represent material headwinds that could slow market growth if billing requirements tighten.
      Additionally, large technology companies (Apple, Google) investing in health monitoring create
      potential long-term disruption risk for dedicated RPM platforms. Current RPM penetration is estimated
      at only 5-10% of eligible patients nationally, indicating significant untapped growth potential despite
      the regulatory headwinds. Market participants must navigate the tension between rapid claims growth
      and increasing payer scrutiny to capture the remaining opportunity.
    claimRefs: [CM018, CM019, CM020, CM021, CM022, CM023, CM024, CM025]
    tableRefs: [TM004]
