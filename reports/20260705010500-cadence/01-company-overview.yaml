company:
  name: Cadence
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Cadence is a New York-based AI-powered chronic disease management company founded in 2020 by
    Chris Altchek. The company reached unicorn status in June 2026 with a $100M Series C at $1.23B
    valuation led by Spark Capital, managing over 100,000 patients across 20+ health system partners
    using supervised AI agents and remote patient monitoring.
sections:
  - id: identity-and-founding
    title: "Identity, Founding, and Business Model"
    body: >-
      Cadence is a healthcare technology company headquartered in New York City, founded in 2020 by
      Chris Altchek. The company operates an AI-powered chronic disease management platform that
      partners with health systems to remotely monitor and treat patients with hypertension, diabetes,
      and heart failure. Cadence's core business model centers on billing insurers monthly for remote
      physiologic monitoring using CPT codes 99454, 99457, and related codes. The company sends patients
      home with connected devices such as blood pressure cuffs, continuously monitors their vitals, and
      adjusts medications in real time using supervised AI agents. Cadence operates as a white-labeled
      clinical service embedded directly into partner health systems' medical groups, electronic medical
      records, and clinical workflows. The company operates a medical group with more than 300 staff
      members including physicians, nurses, and nurse practitioners who provide care 24 hours a day,
      seven days a week under the clinical protocols and brand of each partner health system. This model
      positions Cadence as a clinical service provider rather than merely a monitoring platform.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: leadership-and-team
    title: "Leadership, Governance, and Key People"
    body: >-
      Chris Altchek serves as CEO and co-founder of Cadence. Before founding Cadence, Altchek built and
      scaled BuzzFeed's Tasty food media brand, demonstrating experience in scaling consumer-facing
      technology products. His thesis for Cadence was that treatment of heart failure, hypertension, and
      diabetes could be automated away from the clinic and into the home. The board includes Will Reed,
      Partner at Spark Capital, who joined as a board member following the Series C investment. Dr. Jeffrey
      Ferranti serves as Senior Vice President and Chief Digital Officer at Duke Health, one of Cadence's
      newest health system partners. The company employs approximately 500 people including over 300
      clinical staff. Cadence operates as a private company with key investors holding board seats, and
      detailed information about the full executive team beyond the CEO remains limited in public sources,
      representing a key-person concentration risk given Altchek's central role in company strategy and
      fundraising.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO002]
  - id: funding-and-valuation
    title: "Funding History and Valuation"
    body: >-
      Cadence has raised a total of $241 million across its funding history. The company's Series A was
      led by Thrive Capital, an early backer of OpenAI. Cadence raised a $100 million Series B round in
      December 2021. Most recently, on June 23, 2026, the company closed a $100 million Series C round
      led by Spark Capital, with participation from Thrive Capital, General Catalyst, Coatue, B Capital,
      Corewell Health Ventures, Memorial Hermann, and Duke Health. The Series C values Cadence at $1.23
      billion post-money, marking the company's entry into unicorn territory. Spark Capital, which was
      among the earliest investors in Anthropic, led this round, signaling conviction from AI-focused
      venture investors. The participation of health system venture arms alongside traditional VCs validates
      the clinical utility of Cadence's platform from both financial and operational perspectives.
    claimRefs: [CO013, CO014, CO015, CO016, CO017, CO018, CO019]
    tableRefs: [TO003]
  - id: scale-and-metrics
    title: "Scale, Traction, and Key Metrics"
    body: >-
      Cadence currently manages more than 100,000 active patients across its health system partnerships.
      The company works with more than 20 health system customers including Corewell Health, Memorial
      Hermann, Duke Health, Providence, Yale New Haven Health, Hackensack Meridian Health, Lifepoint Health,
      Community Health Systems, Hartford HealthCare, Rush University System for Health, and Texas Health
      Resources. The company tripled its annual recurring revenue in 2025, though the absolute ARR figure
      has not been publicly disclosed. Cadence reports saving Medicare approximately $2.7 million per week.
      A Mayo Clinic study found that Cadence's model drove a 27% reduction in hospital admissions and a
      $1,302 per-patient annual reduction in total cost of care. A study published in the Journal of the
      American College of Cardiology found Cadence's hypertension program led to a 70% improvement in
      blood pressure control. These peer-reviewed outcomes serve as significant clinical validation for
      the company's care delivery model.
    claimRefs: [CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027]
    tableRefs: [TO005]
    figureRefs: [FO002]
  - id: milestones-and-trajectory
    title: "Milestones and Corporate Timeline"
    body: >-
      Cadence's corporate history spans from its 2020 founding through rapid growth to unicorn status
      in mid-2026. Key milestones include the founding in 2020 based on the thesis that chronic disease
      management could be automated into the home, the Series A led by Thrive Capital establishing early
      institutional backing, the $100M Series B in December 2021 that significantly expanded the company's
      capital base, and the achievement of 100,000+ active patients by mid-2026. The company's partnership
      trajectory has expanded from initial health system customers to over 20 partnerships including major
      academic medical centers like Duke Health. In June 2026, the Series C at $1.23B valuation confirmed
      unicorn status. The company also announced new affiliations with Duke Health and Texas Health Resources
      alongside the funding round. Revenue tripled in 2025, demonstrating acceleration despite increasing
      regulatory scrutiny of the remote monitoring billing model.
    claimRefs: [CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035]
    tableRefs: [TO004]
    figureRefs: [FO001]
