callouts:
  - calloutType: strength
    title: "Unicorn Valuation with Clinical Validation"
    body: >-
      Cadence achieved $1.23B valuation backed by peer-reviewed clinical outcomes including a 27%
      reduction in hospital admissions and 70% improvement in blood pressure control, combined with
      strategic investments from the health systems themselves.
    claimRefs: [CO013, CO024, CO025]
  - calloutType: risk
    title: "Regulatory Scrutiny of Core Billing Model"
    body: >-
      The HHS Office of Inspector General and UnitedHealthcare have raised concerns about the remote
      physiologic monitoring billing framework that generates the majority of Cadence's revenue,
      creating existential reimbursement risk if CMS restricts RPM codes.
    claimRefs: [CO034, CO035]
  - calloutType: insight
    title: "Strategic Investor-Customer Alignment"
    body: >-
      Three health system venture arms (Corewell, Memorial Hermann, Duke) investing alongside VC
      firms creates strong alignment but also potential conflicts of interest as customers sit on
      the cap table.
    claimRefs: [CO017, CO018, CO019]
