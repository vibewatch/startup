company:
  name: "Salla"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Salla is a Saudi e-commerce enablement SaaS business established in Makkah in
    2016, with a documented $8.5 million Series A in 2020 and a $130 million
    pre-IPO round in 2024. The allocated evidence supports substantial merchant
    scale but leaves valuation, audited revenue, company-wide headcount, current
    headquarters, and complete governance unresolved.
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      Investcorp and MENAbytes place Salla's establishment in Makkah in 2016 and
      identify Nawaf Hariri and Salman Butt as its founders. The product is a
      merchant-facing SaaS platform rather than a marketplace: merchants can
      create online storefronts, accept payments, connect logistics, and extend
      the system through applications. That positioning is consistent across
      investor and independent coverage, although the current headquarters is
      not cleanly resolved by the allocated evidence: Tracxn labels the company
      Mecca-based while Indexed.vc calls it Jeddah-based. The snapshot therefore
      treats Makkah as the documented establishment location and leaves current
      headquarters open rather than converting a location conflict into a
      precise cover fact.
    claimRefs: [CO001, CO002, CO004]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Founder leadership remains central to the public company profile. Tracxn
      identifies Nawaf Hareeri as the current CEO, while Investcorp and
      MENAbytes spell his surname Hariri; this chapter preserves that source
      variation rather than assuming the records refer to different people.
      Salman Butt is consistently named as co-founder, but the allocated sources
      do not establish his current operating remit. The clearest governance
      change is tied to the 2024 financing: Investcorp said its principal Robin
      Mansour would join Salla's board. A complete current board roster,
      executive-team list, committee structure, ownership percentages, and
      succession plan are not disclosed in the assigned evidence, so key-person
      dependence cannot be quantified from public material here.
    claimRefs: [CO002, CO003, CO015]
    tableRefs: [TO002]
  - id: "financing-and-stakeholders"
    title: "Financing history and stakeholder map"
    body: >-
      The disclosed financing sequence begins with an undisclosed 2018 seed
      round from Vision Ventures and Raed Ventures, followed by an $8.5 million
      Series A led by STV in November 2020 and a $130 million pre-IPO round led
      by Investcorp with Sanabil Investment and STV in March 2024. The two
      disclosed amounts sum to $138.5 million, but that arithmetic is not cash
      available and excludes the undisclosed seed. Database totals are not
      reconciled: Tracxn reports $138 million over three rounds, while Indexed.vc
      reports $130 million over one round. Neither figure establishes valuation,
      share price, preferences, dilution, debt, secondaries, or current cash;
      those remain transaction-document diligence items.
    claimRefs: [CO005, CO006, CO008, CO009, CO010, CO011, CO012, CO015]
    tableRefs: [TO003]
  - id: "scale-milestones-and-gaps"
    title: "Scale milestones and diligence implications"
    body: >-
      Merchant scale is directionally strong but the denominator and vintage
      must stay attached to each number. MENAbytes reported more than 10,000
      merchants at the November 2020 Series A. Investcorp's March 2024
      announcement reported more than 80,000 active merchants, while an undated
      Investcorp portfolio page accessed for this run states more than 100,000
      active merchants. The later figure may reflect growth, but its missing
      publication date prevents a precise period comparison. A September 2026
      platform comparison also describes Salla's customization as
      template-constrained, a relevant execution limitation rather than proof of
      poor merchant outcomes. Audited revenue, ARR, margins, cash flow,
      company-wide headcount, valuation, and a consistently defined current
      merchant count remain unavailable in the allocated sources.
    claimRefs: [CO007, CO013, CO014, CO016]
    figureRefs: [FO001]
