callouts:
  - calloutType: "strength"
    title: "Institutional financing and scaled merchant adoption are evidenced"
    body: >-
      The financing sequence and dated active-merchant claim support a scaled,
      institutionally backed platform, but they do not establish valuation,
      revenue quality, profitability, or current liquidity.
    claimRefs: [CO006, CO008, CO013]
  - calloutType: "risk"
    title: "Headline totals are not yet diligence-grade"
    body: >-
      Funding databases disagree on round coverage, and the latest merchant
      figure lacks a publication date; transaction documents and a dated
      merchant-definition bridge are required before using either as a precise
      valuation input.
    claimRefs: [CO010, CO011, CO012, CO014]
