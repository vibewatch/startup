companyProfile:
  summary: >-
    Salla is a Makkah-founded merchant SaaS platform that combines localized storefront creation, payments, logistics,
    marketing, applications, and developer interfaces for Saudi and regional commerce. Public evidence supports
    meaningful merchant reach and institutional backing, but does not disclose the financial quality or transaction
    terms needed for valuation.
