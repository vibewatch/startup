  topStrengths:
    - A $130 million pre-IPO round led by Investcorp demonstrates institutional financing access.
    - >-
      Investor evidence reports more than 100,000 active merchants and more than $10 billion of enabled commerce since
      2020.
    - >-
      Arabic-first workflows, Saudi payments and logistics, applications, APIs, and webhooks create a broad localized
      operating surface.
  topRisks:
    - Post-money valuation, share price, dilution, preferences, and ownership terms are not public.
    - Audited revenue, margin, retention, cash flow, burn, runway, and customer concentration remain undisclosed.
    - >-
      Public merchant and store counts use conflicting definitions and vintages, preventing a reliable growth or cohort
      view.
    - Salla-specific security, resilience, PDPL compliance, incident, and dependency-failover evidence is unavailable.
    - >-
      Template constraints, a narrower ecosystem than Shopify, and harder expansion beyond MENA may pressure complex
      merchants.
  unresolvedGaps:
    - >-
      Obtain the fully diluted cap table, financing documents, share price, post-money valuation, preferences, and
      investor rights.
    - >-
      Obtain audited financial statements, current management accounts, cash, burn, runway, and stream-level revenue
      recognition.
    - >-
      Reconcile active merchants, stores, paid accounts, geography, and activity thresholds in a dated monthly operating
      series.
    - Verify cohort retention, NRR, churn, expansion, merchant concentration, and named customer outcomes.
    - Complete independent security, resilience, privacy, regulatory, and critical-provider failover diligence.
