  evidenceGaps:
    - type: missing-source
      severity: material
      topic: production-assurance
      missingEvidence: >-
        Independent uptime history, incident postmortems, service-level objectives,
        penetration-test results, security certifications, and recovery test evidence.
      whyItMatters: >-
        Public API and control descriptions do not establish production reliability,
        operating resilience, or the effectiveness of security controls.
      diligencePath: >-
        Obtain the trust package, status-page history, 24-month incident register,
        latest penetration-test summary, control reports, and disaster-recovery test results.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: architecture
      missingEvidence: >-
        Private service topology, cloud and critical vendor dependencies, data
        residency, encryption design, tenant isolation, capacity limits, and recovery objectives.
      whyItMatters: >-
        The public-interface architecture cannot reveal concentration risks,
        jurisdiction exposure, scaling bottlenecks, or failure containment.
      diligencePath: >-
        Request an architecture review with current diagrams, data-flow maps,
        dependency inventory, regional hosting details, and resilience test evidence.
    - type: missing-source
      severity: material
      topic: roadmap
      missingEvidence: >-
        A dated product roadmap, release cadence, deprecation policy, API
        compatibility commitments, and delivery history against prior roadmap targets.
      whyItMatters: >-
        Repository activity and feature breadth do not demonstrate roadmap
        predictability or safe change management for merchant integrations.
      diligencePath: >-
        Review the current 18-month roadmap, release notes, API change log,
        deprecation notices, and planned-versus-delivered scorecard.
    - type: private-evidence-only
      severity: material
      topic: app-ecosystem
      missingEvidence: >-
        Active-install distribution, application review standards, permission-risk
        controls, vulnerable-app response, developer retention, and marketplace economics.
      whyItMatters: >-
        A reported application count does not establish ecosystem usage, quality,
        security, concentration, or durable developer participation.
