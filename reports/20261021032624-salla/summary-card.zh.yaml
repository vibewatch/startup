  topStrengths:
    - Investcorp 领投的 $130 million IPO 前融资轮，证明公司能够获得机构融资。
    - 投资人证据显示，自 2020 年以来，平台拥有超过 100,000 个活跃商户，并促成超过 $10 billion 的交易。
    - 阿拉伯语优先的工作流、沙特支付与物流、应用、API 和 webhook 共同构成了覆盖面广的本地化运营体系。
  topRisks:
    - 投后估值、股价、稀释、优先权及所有权条款尚未公开。
    - 经审计的收入、利润率、留存率、现金流、烧钱、现金 runway 及客户集中度仍未披露。
    - 公开商户数和店铺数的定义及统计时点相互冲突，无法可靠判断增长或队列表现。
    - 缺少 Salla 特有的安全性、韧性、PDPL 合规、事故及依赖故障切换证据。
    - 模板限制、比 Shopify 更窄的生态，以及在 MENA 之外扩张的难度，可能挤压复杂商户。
  unresolvedGaps:
    - 获取完全稀释后的股权结构表、融资文件、股价、投后估值、优先权及投资人权利。
    - 获取经审计的财务报表、最新管理账目、现金、烧钱、现金 runway 及按收入流划分的收入确认数据。
    - 在带日期的月度运营序列中，核对活跃商户、店铺、付费账户、地域及活跃度门槛。
    - 核实队列留存、NRR、流失、扩张、商户集中度及具名客户成果。
    - 完成独立的安全、韧性、隐私、监管及关键供应商故障切换尽调。
