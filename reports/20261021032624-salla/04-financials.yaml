artifact: financials
slug: salla
runDate: 2026-10-21
company:
  name: Salla
chapter:
  number: 4
  title: Financials
  summary: >-
    Salla describes a diversified model spanning subscriptions and merchant solutions, while
    third-party pricing research indicates low entry prices and no separately listed platform
    percentage for Salla plans. Public evidence demonstrates substantial merchant transaction
    activity and access to growth capital, but it does not disclose audited revenue, gross margin,
    cash, burn, runway, retention, or acquisition economics needed for underwriting.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      Salla's disclosed model combines recurring subscriptions with merchant-linked solutions.
      Management identifies four plan tiers - Basic, Plus, Pro, and Special - and says the second
      stream includes shipping, payments, third-party application fees, and vetted service
      providers. That mix can broaden monetization beyond a fixed software fee, but the public
      record does not split revenue by stream or show realized take rates. A September 2026
      comparison reports a free Basic tier, Plus at SAR 990 annually, and Pro at SAR 2,990
      annually, with enterprise pricing negotiated. Those are list-price observations from a
      comparison provider, not evidence of average realized price, discounting, contract length,
      collections, or recognized revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
  - id: traction-and-revenue-quality
    title: Traction and revenue quality
    body: >-
      Public traction is meaningful but not financially reconcilable. Salla's November 2025 page
      claims more than 68,000 active merchants and more than USD 13 billion of processed sales.
      Investcorp's March 2024 announcement reported more than 80,000 active merchants and USD 7
      billion of sales enabled since 2020, while its undated portfolio page later states more than
      100,000 active merchants and over USD 10 billion. These figures use different vintages and
      potentially different definitions, so they should not be combined into a growth rate.
      Processed merchant sales are GMV-like activity, not Salla revenue or ARR. The divergence also
      makes cohort quality, merchant activity, and revenue-per-merchant impossible to assess
      without a dated, definition-consistent operating dataset.
    claimRefs: [CI006, CI007, CI008, CI015]
  - id: margins-costs-and-unit-economics
    title: Margins, costs, and unit economics
    body: >-
      Investcorp said in 2024 that Salla had delivered best-in-class margins, but the release
      supplies neither a margin definition nor a percentage. The merchant-solutions model creates
      plausible variable economics around payment processing, shipping, application distribution,
      and service-provider activity; public sources do not reveal whether Salla acts as principal
      or agent, how revenue is recognized, or which costs are passed through. No reviewed source
      discloses audited revenue, ARR, gross profit, gross margin, EBITDA, or operating cash flow.
      Likewise, CAC, payback, retention, NRR, sales-cycle length, and channel commissions remain
      unavailable. Consequently, neither software-like recurring quality nor transaction-linked
      margin expansion can be verified from the public evidence.
    claimRefs: [CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The USD 130 million pre-IPO round announced in March 2024 establishes financing access, not
      cash available on the October 2026 run date. The evidence does not disclose post-round cash,
      monthly or annual burn, working-capital seasonality, capital expenditure, debt facilities,
      covenants, planned use of funds, or a next-round trigger. Nearly 500 employees reported in
      the 2024 interview and more than 160 developers reported by Investcorp indicate a meaningful
      operating cost base, but they do not support a burn estimate. The financial verdict is
      therefore research-more: revenue mechanisms and commercial activity are credible, yet
      revenue quality, margin durability, sales efficiency, and runway remain private-evidence
      diligence items.
    claimRefs: [CI009, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams and quality
    columns: [Stream, Mechanism, Unit, Public status, Revenue-quality implication, Diligence ask]
    rows:
      - [Subscriptions, "Basic / Plus / Pro / Special plans", "merchant plan", "Company-described", "Recurring potential; mix and realized price undisclosed", "Revenue by plan, paid merchants, discounts, churn, and recognition policy"]
      - [Shipping solutions, "Merchant fulfillment activity", "shipment or service fee; undisclosed", "Company-described", "Potentially usage-linked and cost-bearing", "Gross versus net presentation, take rate, carrier cost, and refund exposure"]
      - [Payment solutions, "Merchant payment activity", "payment volume or transaction; undisclosed", "Company-described", "Potentially scales with GMV but is not equal to GMV", "Processed payment volume, take rate, processor fees, losses, and settlement timing"]
      - [Third-party applications, "Fees from app ecosystem", "app or merchant; undisclosed", "Company-described", "Potential ecosystem revenue with unknown concentration", "Commission schedule, attach rate, top-app concentration, and developer payouts"]
      - [Vetted service providers, "Fees from provider relationships", "referral or service; undisclosed", "Company-described", "Likely non-subscription revenue with uncertain repeatability", "Contract model, realized fee, revenue recognition, and provider concentration"]
    notes: "Stream definitions come from the August 2024 CEO interview; units, mix, realized pricing, and accounting treatment are not publicly disclosed."
    claimRefs: [CI001, CI002, CI003, CI013]
  - id: TI002
    title: Pricing and monetization snapshot
    columns: [Plan, Reported list price, Included monetization signal, Realized pricing, Source limitation]
    rows:
      - [Basic, "Free", "Acquisition tier; online payments reportedly excluded", null, "Third-party comparison read September 2026, not a direct Salla pricing capture"]
      - [Plus, "SAR 990/year or SAR 99/month", "Adds online payments and custom domain", null, "Discounts, active paid users, and contract realization unavailable"]
      - [Pro, "SAR 2,990/year or SAR 299/month", "Adds VAT activation, staff accounts, and CSS/JS customization", null, "Discounts, active paid users, and contract realization unavailable"]
      - [Special, "Custom pricing", "Enterprise support and integrations", null, "No public quote, minimum commitment, or average contract value"]
    notes: "List prices are reported by Ijjad from Salla's pricing page as read on 2026-09-13; null means realized pricing was not disclosed in the assigned evidence."
    claimRefs: [CI003, CI004, CI005]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Specific diligence request]
    rows:
      - [Revenue / ARR, null, "Unavailable", "Establishes monetization scale and recurring quality", "Audited revenue by stream, ARR bridge, deferred revenue, and recognition policy"]
      - [Gross margin, null, "Unavailable", "Separates software economics from payment, shipping, and service-delivery costs", "Gross profit and margin by stream, principal-agent policy, and processor/carrier costs"]
      - [CAC and sales cycle, null, "Unavailable", "Tests GTM efficiency by self-serve, partner, and enterprise motions", "New-logo CAC, sales and marketing spend, sales-cycle distribution, and channel commissions"]
      - [Payback and retention, null, "Unavailable", "Tests whether low list pricing compounds into durable cohorts", "CAC payback, logo retention, GRR, NRR, expansion, and cohort revenue"]
      - [Cash burn and runway, null, "Unavailable", "Determines financing dependency after the 2024 round", "Current unrestricted cash, monthly net burn, runway, forecast, and next-round trigger"]
      - [Working capital / debt / capex, null, "Unavailable", "Identifies non-P&L cash needs and claims on liquidity", "Receivable and payable aging, settlement balances, capex plan, debt schedule, covenants, and guarantees"]
    notes: "Null means the metric is absent from the successful prefetched evidence; the USD 130 million financing is not treated as cash on hand or runway."
    claimRefs: [CI009, CI010, CI011, CI012, CI014]
figures:
  - id: FI001
    title: Revenue model bridge from merchant activity to gross profit
    type: flow
    summary: >-
      Public evidence identifies monetization routes but stops before realized revenue, direct
      costs, and gross profit, so the bridge intentionally terminates in an underwriting gap.
    data:
      nodes:
        - id: merchant-base
          label: Merchant base
          detail: "Salla reports merchant activity, but public counts use unreconciled definitions and vintages."
        - id: subscription-plans
          label: Subscription plans
          detail: "Basic, Plus, Pro, and Special; paid mix and realized price are unavailable."
        - id: commerce-activity
          label: Commerce activity
          detail: "Merchant sales and payment, shipping, application, and service-provider activity."
        - id: merchant-solutions
          label: Merchant solutions
          detail: "Shipping, payments, third-party app fees, and vetted service-provider fees."
        - id: recognized-revenue
          label: Recognized revenue
          detail: "Revenue by stream and gross-versus-net accounting are not publicly disclosed."
        - id: direct-costs
          label: Direct costs
          detail: "Processor, carrier, infrastructure, support, and partner payouts are not quantified."
        - id: gross-profit
          label: Gross profit
          detail: "No public gross profit or gross-margin percentage was found."
      edges:
        - from: merchant-base
          to: subscription-plans
        - from: merchant-base
          to: commerce-activity
        - from: commerce-activity
          to: merchant-solutions
        - from: subscription-plans
          to: recognized-revenue
        - from: merchant-solutions
          to: recognized-revenue
        - from: recognized-revenue
          to: direct-costs
        - from: direct-costs
          to: gross-profit
    approximationNotes: "No values are estimated; nodes after monetization identify missing accounting and cost evidence."
    claimRefs: [CI001, CI002, CI013, CI016]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The March 2024 financing validates investor access but cannot substitute for current cash,
      burn, debt, or forecast evidence. Underwrite capital adequacy only after reviewing the
      treasury position and a management-approved operating plan.
    claimRefs: [CI009, CI014]
  - calloutType: recommendation
    title: Make financial data-room access a gating condition
    body: >-
      Require audited statements, revenue recognition policies, stream-level gross margin,
      merchant cohorts, CAC/payback, cash, debt, and runway before assigning a valuation based on
      SaaS or payments comparables.
    claimRefs: [CI011, CI012, CI014]
