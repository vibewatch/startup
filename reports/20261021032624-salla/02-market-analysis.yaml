company:
  name: "Salla"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Salla addresses the Saudi and GCC merchant-enablement layer rather than the full value of online retail. Investor materials describe a $20 billion Saudi e-commerce market and strong expected growth, while current first-party and investor pages disagree on whether Salla serves 68,000 active stores or more than 100,000 active merchants; those figures establish scale but not a reconciled market share, SAM, or SOM."
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The relevant market is hosted commerce enablement for Saudi and GCC merchants: software that lets a seller create a storefront and coordinate products, payments, shipping, inventory, and marketing. The broad value of goods sold online is not Salla's software revenue opportunity, and merchant GMV is not platform revenue. Salla's core buyer base is entrepreneurs and SMEs, with larger merchants and multi-branch operators as an adjacency. Status-quo alternatives include international hosted platforms configured through local apps, Saudi-native peer platforms, custom builds, and fragmented manual tools. The boundary therefore excludes the merchandise value retained by merchants, payment-provider economics not earned by Salla, and unrelated consumer marketplaces.
    claimRefs: [CM001, CM013, CM014, CM015, CM016]
    tableRefs: [TM001]
  - id: "sizing-lenses"
    title: "Sizing lenses and denominator discipline"
    body: >-
      Investcorp's March 2024 announcement placed the Saudi e-commerce market at $20 billion and said it was expected to grow more than 25% year on year, but it did not disclose the estimate's spend boundary, base year, or methodology. That top-down figure is therefore context, not a validated TAM for Salla. Bottom-up scale indicators also use different denominators: an Investcorp portfolio page says Salla has enabled more than $10 billion in e-commerce sales since 2020 and serves more than 100,000 active merchants, while Salla's current site says it powers more than 68,000 active stores across the GCC. A 2020 report provides a historical baseline of 10,000 merchants, eight million orders, and $533 million GMV. None of these observations isolates software spend, Saudi-only SAM, or obtainable SOM.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM012, CM016]
    tableRefs: [TM002]
  - id: "buyers-and-adoption"
    title: "Buyers, users, payers, and adoption path"
    body: >-
      The practical adoption path starts with a merchant owner or e-commerce lead choosing a storefront system, then adding local payments, shipping, and operating applications. Salla and outside reviewers emphasize Arabic-first workflows and local payment and logistics integrations; these reduce setup work for Saudi-focused merchants and help explain adoption without proving market share. Salla also claims a substantial operating ecosystem: more than 100 shipping partners, over 1,000 service providers, more than 550 apps, 40-plus languages, and payment acceptance from 79-plus countries. These are company-reported capability indicators rather than independently tested utilization rates, but they show how the product can move from initial launch to more complex operations.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011, CM013, CM014]
    tableRefs: [TM003]
    figureRefs: [FM001]
  - id: "constraints-and-diligence"
    title: "Constraints, timing, and valuation relevance"
    body: >-
      Adoption is constrained by fit rather than by a simple lack of demand. Commercial comparison publishers identify template-bounded customization, a narrower app ecosystem than Shopify, and more difficult expansion beyond Salla's strongest regional footprint; because those publishers sell alternative or custom solutions, their criticisms are directionally useful but not independent benchmarks. The central valuation problem is evidentiary: no public, checkable dataset in the assigned evidence separates Saudi stores by platform, and the available 68,000-store and 100,000-merchant figures are not reconciled by date or definition. Diligence should therefore underwrite Salla from audited subscription revenue, cohort retention, merchant GMV definitions, and Saudi-versus-non-Saudi mix rather than applying a broad e-commerce CAGR directly to company revenue.
    claimRefs: [CM004, CM005, CM015, CM016]
callouts:
  - calloutType: "insight"
    title: "Large commerce volume is not software TAM"
    body: "The $20 billion market figure and Salla's cumulative enabled sales describe merchandise activity; neither discloses the subscription, payment, or application revenue pool available to Salla."
    claimRefs: [CM001, CM003]
  - calloutType: "risk"
    title: "Scale denominator remains unresolved"
    body: "The current official page reports 68,000-plus active stores across the GCC, while an investor portfolio page reports more than 100,000 active merchants without a visible measurement date."
    claimRefs: [CM004, CM005]
