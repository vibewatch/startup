chapter:
  number: 3
  title: "Competitors"
  summary: "Salla competes most directly with Zid for Saudi-first merchants, while Shopify, WooCommerce, and custom builds become stronger alternatives as international reach, design freedom, or ERP integration outweigh local convenience. The evidence supports Salla's scale and local ecosystem advantage, but exact market shares, realized prices, retention, and migration rates remain unavailable, so the moat should be underwritten as workflow and distribution depth rather than an unqualified platform lead."
sections:
  - id: "competitive-topology"
    title: "Competitive topology"
    body: |-
      The practical choice set is broader than a Salla-versus-Zid comparison. Saudi merchants can choose a local hosted platform, a global hosted incumbent, an open-source stack, a custom or ERP-centered build, or continue selling through marketplaces and social channels without making one platform the full system of record. The retained comparisons consistently place Salla and Zid in the direct Saudi-native tier, Shopify in the global hosted tier, and WooCommerce or custom development in the control-oriented substitute tier. Salla's investor reports more than 100,000 active merchants and over $10 billion of commerce enabled since 2020, while third-party comparison sources report materially smaller scale for Zid. Those figures are not definition-matched market shares, and the retained evidence does not support naming a specific new entrant beyond the already-visible global and custom-build displacement paths.
    claimRefs: [CP001, CP007, CP008, CP009, CP010, CP011, CP012]
    tableRefs: [TP001]
  - id: "capability-distribution-and-positioning"
    title: "Capability, distribution, and positioning"
    body: |-
      Local readiness is increasingly a category requirement rather than a unique moat: multiple 2026 comparison sources describe Salla and Zid as Arabic-first platforms with built-in Saudi payments, e-invoicing, and local logistics, while Shopify reaches those functions through applications or gateway partners. Differentiation therefore shifts to ecosystem breadth, operating fit, and expansion path. The available sources characterize Salla as stronger in application breadth and broader MENA reach, Zid as stronger for Saudi shipping and physical-retail workflows, and Shopify as stronger in themes, customization, and global expansion. Custom builds become credible when a merchant needs an ERP to remain the inventory source of truth or when a differentiated workflow cannot fit a hosted template. These are vendor and practitioner assessments, not independently measured capability benchmarks.
    claimRefs: [CP002, CP003, CP004, CP005, CP016]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: "pricing-and-switching"
    title: "Pricing and switching economics"
    body: |-
      The clearest reported list-price comparison is between the local paid tiers: September 2026 sources list Salla Plus and Zid Rise at SAR 990 per year and Salla Pro and Zid Growth at SAR 2,990 per year. The same sources report that Shopify Basic adds a 2% third-party payment-provider fee in Saudi Arabia because Shopify Payments is unavailable there, although gateway fees and application costs remain separate. Free-tier capability is disputed: a May 2026 article says Salla Basic can accept mada and Apple Pay, while two September comparisons say Salla's and Zid's free tiers cannot accept cards or online payments. This conflict should be resolved against live vendor terms before modeling merchant economics. Switching is also nontrivial because URLs, gateway onboarding, invoicing applications, and custom workflows may need reconstruction; subscription price alone understates lock-in.
    claimRefs: [CP006, CP013, CP014, CP015]
    tableRefs: [TP003]
  - id: "moat-verdict-and-diligence"
    title: "Moat verdict and diligence priorities"
    body: |-
      Salla's defensibility appears strongest where merchant scale, application supply, payment and logistics integrations, and Arabic operating workflows reinforce one another. It appears weaker where the buyer values globally portable storefront infrastructure, deep design control, or tightly coupled ERP and omnichannel processes. Because local payment, Arabic, and ZATCA support are also attributed to Zid, those capabilities are table stakes rather than durable differentiation on their own. The underwriting question is whether Salla's broader ecosystem creates measurable retention and lower operating cost after normalizing for plan, gateway, app, migration, and support expenses. No retained source provides definition-matched market share, cohort retention, merchant multi-homing, realized discounts, or migration win/loss data. Until those data are obtained, the moat is credible but not independently quantified, and displacement risk remains material at the upper end of merchant complexity.
    claimRefs: [CP003, CP004, CP005, CP006, CP007, CP016]
