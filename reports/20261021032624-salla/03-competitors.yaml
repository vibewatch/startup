      - ["Customization and brand control", "Template-bounded, with higher-tier extensions", "Template-bounded", "High through themes, applications, and Liquid", "Highest potential control", "Greater control also raises implementation and maintenance responsibility"]
      - ["Expansion path", "Saudi plus reported UAE and Egypt growth", "Primarily Saudi-focused in retained comparisons", "Global and multi-market", "Depends on architecture and operating resources", "No retained evidence quantifies cross-border merchant outcomes"]
