      - ["Salla Plus", "SAR 990 per year or SAR 99 monthly", "Online payments and custom domain reported", "Realized discounts, gateway fees, and application costs unavailable", "Entry paid price is reported equal to Zid Rise"]
      - ["Salla Pro", "SAR 2,990 per year or SAR 299 monthly", "VAT support, staff, and customization features reported", "Implementation scope and realized total cost unavailable", "Higher tier is positioned around tax and operating depth"]
      - ["Zid Starter", "Free", "Bank transfer and cash on delivery reported", "No card payments according to September sources", "Free plan appears unsuitable for card-led checkout"]
      - ["Zid Rise", "SAR 990 per year or SAR 99 monthly", "Zid Payments, Apple Pay, themes, and custom domain reported", "Promotion and realized fees may differ from list price", "List price does not separate Salla and Zid at the entry paid tier"]
      - ["Zid Growth", "SAR 2,990 per year or SAR 299 monthly", "VAT calculation, staff, branch, and CSS capabilities reported", "No retained realized-cost or financing-attach data", "Operating fit, not list price, becomes the decision variable"]
      - ["Shopify Basic", "US$19 monthly on annual billing or US$27 monthly, as reported in September 2026", "Global storefront, theme, and application ecosystem", "Gateway, application, and e-invoicing costs are additional; 2% third-party provider fee reported", "Cost increases with sales volume where Shopify Payments is unavailable"]
    notes: "List prices and feature packaging are volatile and come from third-party comparisons that state they read vendor pricing pages in September 2026; verify current vendor terms, taxes, gateway rates, promotions, and realized discounts before underwriting."
    claimRefs: [CP013, CP014, CP015]
