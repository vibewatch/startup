  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 商户流程中的产品范围
        blocks:
          - type: paragraph
            body: >-
              Salla
              已记录的产品范围遵循区域商户的运营顺序：创建和设计店铺、导入或维护商品目录、收款、管理订单和库存、安排配送、面向客户营销，并分析表现。官方帮助中心还提供移动应用创建、POS、多市场运营、聊天、融资和应用
              marketplace 等相邻流程。这种广度让产品更像电商运营层，而不是单一网站构建器。WooCommerce、Shopify 和 Magento
              的导入路径降低了初始迁移摩擦，但证据没有量化迁移完整度、实施时间或数据丢失率。第三方评测持续强调阿拉伯语优先操作以及本地相关支付和物流集成；这些是可信的产品定位信号，不是独立性能基准。因此，投资判断的重点不只是模块是否存在，而是商户能否在规模化条件下可靠部署、运营和支持这些模块。
