              可见架构将商户运营与扩展界面分开。Salla 维护公开开发者门户及活跃的公司 GitHub 组织，包含 CLI、OAuth 客户端、starter kits、主题仓库和面向 ZATCA 的软件包。独立 API
              目录描述了 Merchant REST API、OAuth 2.0 授权服务、签名生命周期 webhook、物流和履约契约，以及店铺主题引擎和 JavaScript SDK。这些材料支持这样一个推断：Salla
              将商户数据和流程放在核心层，将开发者认证和事件放在集成层，将主题、嵌入式组件和应用放在体验层。这是一张公开接口图，不代表私有生产技术栈、服务边界、吞吐量、延迟或韧性。这个区分很重要：API
              广度可以降低集成成本，但运营质量和依赖集中度仍未测量。
