  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是面向沙特及 GCC 商户的托管式电商赋能：帮助卖家创建店铺并协调商品、支付、物流、库存和营销的软件。线上销售商品的广义价值不是 Salla 的软件收入机会，商户 GMV 也不是平台收入。Salla
              的核心买家是创业者和中小企业，更大商户及多分店经营者属于邻近场景。现状替代方案包括通过本地应用配置的国际托管平台、沙特本土同类平台、定制开发，以及分散的人工工具。             
              因此，市场边界排除了商户保留的商品价值、Salla 未赚取的支付服务商经济收益，以及无关的消费者平台市场。
            claimRefs:
              - CM001
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM013
              - CM015
              - CM016
      - number: '2.2'
        title: 规模测算视角与分母纪律
        blocks:
          - type: paragraph
            body: >-
              Investcorp 在 2024 年 3 月公告中将沙特电商市场规模定为 $20 billion，并称其预计同比增长超过
              25%，但未披露该估算的支出边界、基准年份或方法论。因此，这个自上而下的数字只能作为背景，不能视为经过验证的 Salla TAM。自下而上的规模指标也使用不同分母：Investcorp 投资组合页面称 Salla
              自 2020 年以来促成的电商销售额超过 $10 billion，服务超过 10 万活跃商户；Salla 当前网站称其在 GCC 范围内支持超过 6.8 万家活跃店铺。2020 年的一篇报道给出历史基线：1
              万商户、800 万订单和 $533 million GMV。这些观察都没有单独识别软件支出、仅沙特的 SAM 或可获得的 SOM。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM012
              - CM016
      - number: '2.3'
        title: 买家、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              实际采用路径通常从商户所有者或电商负责人选择店铺系统开始，再添加本地支付、物流和运营应用。Salla
              及外部评测都强调阿拉伯语优先的流程以及本地支付和物流集成；这些能力减少了面向沙特商户的搭建工作，有助于解释采用，但不能证明市场份额。Salla 还自称拥有较大的运营生态：超过 100 家物流合作伙伴、超过
              1,000 家服务商、超过 550 个应用、40 多种语言，以及来自 79 个以上国家的支付受理能力。这些是公司报告的能力指标，而非经过独立测试的使用率，但能说明产品如何从初始上线延伸到更复杂的运营。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM013
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 约束、时点与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用受产品适配度限制，而不是简单地缺乏需求。商业比较出版方指出模板限制下的定制能力、比 Shopify 更窄的应用生态，以及走出 Salla
              最强区域覆盖范围后更难扩张；由于这些出版方销售替代方案或定制服务，其批评有方向性参考价值，但不是独立基准。估值的核心问题在于证据：指定材料没有公开、可核验的数据集能按平台拆分沙特店铺，现有的 6.8 万店铺和
              10 万商户数字也没有按日期或定义对账。因此，尽调应从经审计的订阅收入、队列留存、商户 GMV 定义以及沙特与非沙特收入结构来评估 Salla，而不是直接把广义电商 CAGR 套到公司收入上。
            claimRefs:
              - CM004
              - CM005
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 巨大的交易规模不是软件 TAM
            body: $20 billion 市场数字和 Salla 累计促成的销售额描述的是商品交易活动；两者都没有披露 Salla 可获得的订阅、支付或应用收入池。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
          - type: callout
            title: 规模分母仍未解决
            body: 当前官方页面报告 GCC 范围内有超过 6.8 万家活跃店铺，而投资人投资组合页面报告超过 10 万活跃商户，却没有显示测量日期。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争拓扑
        blocks:
          - type: paragraph
            body: >-
              实际选择集合远不止 Salla 与 Zid 的二选一。              沙特商户可以选择本地托管平台、全球托管龙头、开源技术栈、定制或以 ERP
              为中心的构建方案，也可以继续通过平台市场和社交渠道销售，而不让单个平台成为完整的系统记录源。保留的比较资料始终将 Salla 和 Zid 放在沙特本土直接竞争层，将 Shopify 放在全球托管层，将
              WooCommerce 或定制开发放在偏控制型替代方案层。Salla 的投资人报告称活跃商户超过 10 万，自 2020 年以来促成的交易超过 $10 billion；第三方比较来源则报告 Zid
              的规模明显更小。这些数字不是定义匹配的市场份额，保留的证据也不支持在已有的全球平台和定制替代路径之外点名某个具体新进入者。
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
