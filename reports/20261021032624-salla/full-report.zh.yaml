      - number: '4.2'
        title: 牵引力与收入质量
        blocks:
          - type: paragraph
            body: >-
              公开牵引力有意义，但无法在财务上对账。Salla 2025 年 11 月页面称活跃商户超过 6.8 万、已处理销售额超过 USD 13 billion。Investcorp 在 2024 年 3
              月公告中报告活跃商户超过 8 万、2020 年以来促成销售额 USD 7 billion；其未注明日期的投资组合页面后来又称活跃商户超过 10 万、销售额超过 USD 10
              billion。这些数字采用不同口径年份、可能也采用不同定义，不应合并成增长率。商户处理销售额类似 GMV 活动，不是 Salla 的收入或
              ARR。若没有带日期且定义一致的运营数据，数字差异也使队列质量、商户活跃度和单商户收入无法判断。
