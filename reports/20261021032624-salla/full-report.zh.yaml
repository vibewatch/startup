        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              2024 年 3 月宣布的 USD 130 million IPO 前轮证明了融资渠道，而不是 2026 年 10
              月本次运行日的可用现金。证据没有披露融资后现金、月度或年度烧钱、营运资金季节性、资本开支、债务工具、契约、资金计划或下一轮触发条件。2024 年采访中提到近 500 名员工，Investcorp 报告开发者超过
              160 人，说明运营成本基础不小，但不足以支持烧钱估算。因此财务结论是继续研究：收入机制和商业活动可信，但收入质量、利润率韧性、销售效率和 runway 仍需私有证据尽调。
