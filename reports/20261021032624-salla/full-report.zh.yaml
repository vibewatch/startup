            body: >-
              商户规模从方向上看很强，但每个数字都必须绑定其分母和口径年份。MENAbytes 报道，2020 年 11 月 A 轮时商户数超过 1 万。Investcorp 在 2024 年 3 月的公告称活跃商户超过 8
              万；本次访问的 Investcorp 未注明日期的投资组合页面则称活跃商户超过 10 万。后一个数字可能反映增长，但缺少发布日期，无法进行精确的时期比较。2026 年 9 月的一篇平台比较文章还称 Salla
              的定制受模板限制；这是执行层面的相关限制，并不能证明商户结果不佳。指定来源仍未提供经审计收入、ARR、利润率、现金流、全公司员工数、估值或口径一致的当前商户数。
