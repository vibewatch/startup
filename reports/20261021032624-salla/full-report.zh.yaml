chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Investcorp 和 MENAbytes 将 Salla 的成立时间定为 2016 年、地点定为 Makkah，并指认 Nawaf Hariri 和 Salman Butt 为创始人。该产品面向商户，是
              SaaS 平台而非 marketplace：商户可以创建线上店铺、收款、接入物流，并通过应用扩展系统。投资人和独立报道对这一定位的描述一致，但现有证据无法明确当前总部所在地：Tracxn 将公司标为
              Mecca，总部研究网站 Indexed.vc 则称其位于 Jeddah。因此，本报告将 Makkah 视为有文档记录的成立地点，对当前总部保留未决，不把地点冲突硬转成精确的封面事实。
            claimRefs:
              - CO001
              - CO002
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO008
              - CO010
              - CO014
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人领导仍是公开公司画像的核心。Tracxn 认定 Nawaf Hareeri 为现任 CEO，而 Investcorp 和 MENAbytes 将其姓氏拼作
              Hariri；本章保留这一来源差异，不假设两条记录对应不同的人。Salman Butt 始终被列为联合创始人，但分配到的来源未说明其当前运营职责。最明确的治理变化与 2024 年融资相关：Investcorp
              表示其负责人 Robin Mansour 将加入 Salla 董事会。指定证据未披露完整的现任董事会名单、管理层名单、委员会结构、持股比例或继任计划，因此无法仅凭此处公开材料量化关键人物依赖。
            claimRefs:
              - CO002
              - CO003
              - CO015
