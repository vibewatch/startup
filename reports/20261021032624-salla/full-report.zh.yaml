            body: 若尽调发现未解决的重大隐私或安全缺陷、反复严重宕机、未缓释的关键服务商依赖、重大商户集中度，或没有可信融资且 runway 少于 18 个月，则暂停或拒绝投资。
            calloutType: recommendation
            claimRefs:
              - CR014
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与决策框架
        blocks:
          - type: paragraph
            body: >-
              当前建议是继续研究，信心中等，投资判断风险高，估值立场未知。Salla 似乎拥有真实规模和可信的本地化产品：Investcorp 投资组合页面报告活跃商户超过 10 万、2020 年以来促成交易超过 $10
              billion，Feedance 则记录了可运行的商户 API
              和外部集成界面。这些信号支持进一步尽调，而不是不考虑价格就批准投资。这里审阅的公开记录没有给出可靠的投后估值、经审计收入、利润率、现金流、留存、稀释或优先权条款。缺少这些输入，套用传统 SaaS
              倍数、折现现金流模型或目标回报计算会制造虚假的精确感。因此，投资批准应继续以完整数据室和可用已验证运营经济性检验的价格为条件。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV016
      - number: '8.2'
        title: 融资背景与价格支撑
        blocks:
          - type: paragraph
            body: >-
              最强的融资证据是 Investcorp 联合 Sanabil Investment 和 STV 领投的 2024 年 3 月 1.3 亿美元 IPO 前轮。Tracxn 页面于 2026 年 9
              月更新，报告三轮累计融资 1.38 亿美元，但其公开表格隐藏了最新轮金额和投后估值。IPO 前轮这一标签描述的是融资工具和投资人意图，不是已完成公开市场流程或已确认的独角兽估值。StartupHub
              明确提醒，融资本身不能证明即将登陆 Tadawul，也不能证明估值超过 10 亿美元。因此，价格敏感结论很直接：这轮融资验证了机构需求，但没有提供公开的入场价格基准。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV009
              - CV014
              - CV016
      - number: '8.3'
        title: 情景与可比局限
        blocks:
          - type: paragraph
            body: >-
              乐观情景需要验证 Salla 对规模的变现能力、持久的商户留存，以及 API
              和应用生态确实提高切换成本。基准情景假设平台在沙特电商中仍具战略相关性，但在经审计的经济数据和交易条款可得前暂缓估值。悲观情景则将倍数压缩或降价轮融资，与留存疲弱、模板限制下的定制和走出 MENA
              后更难扩张结合起来。指定证据支持与 Zid 和 Shopify
              做运营比较，但没有提供标准化的上市公司交易倍数、私募轮投后估值或并购先例。因此，每个情景都使用可观察的尽调信号和下行触发条件，而不是没有依据的数值估值区间或概率。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度是方向性的，还没有达到可交易状态。Investcorp 通过沙特 IPO 前成长基金投资，将一名负责人安排进 Salla
              董事会，并表示有兴趣探索未来上市。审阅过的来源没有指出已提交的招股书、指定承销商、发行时间表或公开估值。在投资委员会设定价格、持股或目标回报前，尽调应取得完全稀释后的股权结构表、股份类别和清算优先权表、经审计报表、队列留存、毛利率、现金转化、商户集中度和经董事会批准的退出计划。论题破坏触发条件应包括融资有效价格低于上一轮、净留存疲弱、经核实的商户活动明显低于投资人报告数字，或治理条款阻止形成可信的回报路径。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 先看价格，再看光环
            body: 1.3 亿美元轮融资和 IPO 前轮定位足以支持尽调，但都没有披露投资人实际需要支付的价格。批准应跟随已验证的经济数据和交易条款，而不是融资标签。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV015
          - type: callout
            title: 没有公开数值估值区间
            body: 收入、经常性收入质量、利润率、留存、现金流、投后估值和优先权条款在指定公开证据中均不可得。因此，任何精确区间都只是没有依据的估算。
            calloutType: risk
            claimRefs:
              - CV003
              - CV012
              - CV015
