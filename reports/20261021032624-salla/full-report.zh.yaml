              - CI006
              - CI007
              - CI008
              - CI015
      - number: '4.3'
        title: 利润率、成本与单位经济
        blocks:
          - type: paragraph
            body: >-
              Investcorp 在 2024 年称 Salla 已实现同类最佳利润率，但公告没有给出利润率定义或百分比。商户解决方案模式围绕支付处理、物流、应用分发和服务商活动，确实存在合理的可变经济性；但公开来源没有说明
              Salla 是主责方还是代理方、收入如何确认、哪些成本会转嫁。审阅过的来源没有披露经审计收入、ARR、毛利、毛利率、EBITDA
              或经营现金流。同样，CAC、回本期、留存、NRR、销售周期和渠道佣金也不可得。因此，公开证据无法验证其软件式经常性收入质量或交易绑定的利润率扩张。
