              - CP012
      - number: '3.2'
        title: 能力、分销与定位
        blocks:
          - type: paragraph
            body: >-
              本地化能力越来越像品类门槛，而不是独特护城河：多份 2026 年比较资料都将 Salla 和 Zid 描述为阿拉伯语优先的平台，内置沙特支付、电子发票和本地物流；Shopify
              则通过应用或网关合作伙伴提供这些能力。因此，差异化转向生态广度、运营适配度和扩张路径。现有来源认为 Salla 在应用广度和 MENA 覆盖上更强，Zid 更擅长沙特物流及线下零售流程，而 Shopify
              在主题、定制和全球扩张上更强。当商户需要 ERP 继续作为库存事实源，或差异化流程无法适配托管模板时，定制开发就变得可信。这些是供应商和从业者的判断，不是独立测量的能力基准。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP016
      - number: '3.3'
        title: 定价与切换经济学
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开标价比较来自本地付费层级：2026 年 9 月资料列出 Salla Plus 和 Zid Rise 年费均为 SAR 990，Salla Pro 和 Zid Growth 年费均为 SAR
              2,990。同一批资料称，由于 Shopify Payments 在沙特不可用，Shopify Basic 在沙特还会收取 2% 的第三方支付服务商费用，但网关费和应用成本另计。免费层能力存在争议：2026 年
              5 月的一篇文章称 Salla Basic 可以接受 mada 和 Apple Pay，而两篇 9 月比较文章称 Salla 和 Zid
              的免费层都不能接受银行卡或线上支付。建模商户经济性前，应对照供应商实时条款解决这一冲突。切换也并不简单，因为 URL、网关开户、发票应用和定制流程可能都要重建；只看订阅价格会低估锁定程度。
            claimRefs:
              - CP006
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: 护城河判断与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              Salla 的防御力最可能来自商户规模、应用供给、支付与物流集成、阿拉伯语运营流程之间的相互强化。在买家更看重全球可迁移的店铺基础设施、深度设计控制或紧密耦合的 ERP
              与全渠道流程时，它的优势会变弱。由于本地支付、阿拉伯语和 ZATCA 支持也归于 Zid，这些能力单独看只是门槛，不是持久差异化。投资判断要看：把套餐、网关、应用、迁移和支持成本统一口径后，Salla
              更大的生态能否带来可量化的留存提升、并压低运营成本。现有来源没有提供定义匹配的市场份额、队列留存、商户多平台经营、实际折扣或迁移输赢数据。在拿到这些数据前，护城河可信但未被独立量化；在商户复杂度较高的上端，替代风险仍然重要。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 本地化是门槛；生态深度才是护城河测试
            body: Salla 的防御力不在于拥有 Zid 也提供的沙特支付、阿拉伯语或电子发票功能，而在于其更大的商户和应用生态能否降低运营摩擦、改善留存并带来更强的合作伙伴经济性。
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Salla 已披露的模式将经常性订阅与商户关联解决方案结合起来。管理层将套餐分为 Basic、Plus、Pro 和 Special
              四档，并称第二类收入包括物流、支付、第三方应用费和经过审核的服务商。这样的组合可以把变现拓展到固定软件费之外，但公开记录没有按收入流拆分，也没有显示实际抽佣率。2026 年 9 月的一篇比较资料称 Basic
              免费，Plus 年费 SAR 990，Pro 年费 SAR 2,990，企业定价则协商确定。这些是比较提供方观察到的标价，不代表实际平均价格、折扣、合同期限、回款或确认收入。
