  - id: TV002
    title: 正论与反论
    columns:
      - 视角
      - 有证据支持的论点
      - 哪些情况会强化判断
      - 哪些情况会削弱判断
    rows:
      - - 正论
        - 投资人报告的规模超过 100,000 家活跃商户，促成的交易额达 $10 billion。
        - 经审计收入与群组数据能够和报告的平台规模相互核对。
        - 经验证的活跃商户数或交易量明显更低。
      - - 正论
        - 平台开放 API、webhook 与应用生态，能够支撑集成。
        - 较高的附加率与留存证明存在可量化的转换成本。
        - 集成使用浅薄，或集中在低价值商户。
      - - 正论
        - $130 million 的机构轮融资表明公司能够获得增长资本。
        - 轮次条款体现出有纪律的稀释安排与一致的治理。
        - 下一轮融资价格低于上一轮有效股价。
      - - 反命题
        - 公开记录没有披露可用估值或经审计的财务画像。
        - 完整数据室支持可持续的 SaaS 经济性与站得住脚的入场倍数。
        - 收入质量、利润率、现金转换或留存未达到投资判断门槛。
      - - 反命题
        - 竞争对比显示模板存在限制，走出 MENA 的路径更难。
        - 企业定制与国际客户胜利表明这些限制正在收窄。
        - 大客户超出平台能力后，商户流失率上升。
      - - 反命题
        - pre-IPO 表述可能在尚未提交上市流程时制造时间预期。
        - 董事会批准的计划、顾问与监管里程碑建立了可信路径。
        - 上市计划仍无明确时间表，而流动性需求不断上升。
    notes: 这些论点区分了合作伙伴报告的规模、独立运营对比与分析师推断；所有改变判断的测试都需要直接尽调。
