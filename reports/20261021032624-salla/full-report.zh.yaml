      - CV004
      - CV006
      - CV009
      - CV014
      - CV016
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 概率信号
      - 下行或上行触发条件
    rows:
      - - 乐观
        - 经验证的留存、利润率与变现能力，将商户和交易规模转化为可持续增长。
        - 只有在获得经审计的经常性收入与净留存后，才应用增长型 SaaS 框架；目前没有公开区间可供支持。
        - 经审计的增长、持续改善的单位经济性与可信的上市里程碑。
        - 上行空间需要数据室证明生态广度带来定价权与转换成本。
      - - 基准
        - Salla 仍是领先的本地化平台，但财务披露与退出时间仍有限。
        - 暂缓数值估值，并以经验证的收入质量、稀释与优先权条款为基础谈判。
        - 活跃商户群组稳定、资本使用有纪律，且近期不会 IPO。
        - 在经济性与交易条款完整前，维持继续研究的立场。
      - - 悲观
        - 倍数压缩、定制化限制、国际扩张疲弱或下轮融资损害回报。
        - 先评估清算优先权与稀释；如果价格假设了未经验证的 IPO 或独角兽估值，则拒绝该价格。
        - 更低的有效轮融资价格、疲弱留存、流动性延迟或治理失配。
        - 如果下行保护无法抵消透明度缺失，则暂停或放弃。
    notes: 这些情景是定性的，因为指定来源没有提供经审计的财务模型、披露的投后估值或标准化交易可比案例集。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
      - CV015
