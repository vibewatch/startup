            body: >-
              产品成熟度最明显地体现在范围和生态活跃度上。官方帮助页面覆盖角色权限、活动日志、合作伙伴权限、webhook、退货、多仓库存、区域支付、配送路线和应用安装。Investcorp 报告平台上有超过 400
              个应用；公司 GitHub 页面显示有 14 个公开仓库，其中多个在 2026 年 10
              月有更新。这些信号支持持续的产品投入和有意义的扩展生态，但无法说明应用使用量、评价质量、依赖集中度或商业抽佣率。竞争评测将差异化归因于阿拉伯语优先管理以及内置的沙特支付、发票和物流流程；同样的评测也指出模板限制下的定制、比
              Shopify 更窄的生态和走出 MENA 后更难扩张。信任证据是最大的技术尽调缺口：指定公开来源没有提供 uptime
