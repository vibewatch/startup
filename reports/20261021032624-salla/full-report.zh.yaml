  - id: FP001
    title: 按沙特适配度与战略灵活性进行竞争定位
    type: quadrant
    summary: 分析师序数定位显示，本地平台在沙特适配度上领先，而全球化或定制方案在定制化与地域灵活性上领先。
    data:
      xAxis:
        label: 沙特市场适配度（1=高度依赖集成，5=大多内置）
        min: 1
        max: 5
      yAxis:
        label: 定制化与地域灵活性（1=有限，5=高）
        min: 1
        max: 5
      points:
        - label: Salla
          x: 5
          'y': 3
          detail: 以阿拉伯语为先并深度本地集成；在保留的对比样本中，其 MENA 覆盖与应用广度高于另一家沙特本土方案。
        - label: Zid
          x: 5
          'y': 2
          detail: 以阿拉伯语为先并深度本地集成；据报道在沙特配送与实体零售运营上占优，但地域扩展路径更窄。
        - label: Shopify
          x: 3
          'y': 5
          detail: 沙特功能可通过合作伙伴与应用获得；主题、应用与全球扩展灵活性是其主要优势。
        - label: WooCommerce
          x: 2
          'y': 5
          detail: 开源控制力强，但本地支付、电子发票、托管与维护仍需自行实施。
        - label: 定制化 / ERP 中心化构建
          x: 3
          'y': 5
          detail: 可以优化本地集成与独特工作流，但适配度取决于实施，而不是开箱即用的平台。
        - label: 平台市场 / 社交销售
          x: 2
          'y': 1
          detail: 可用作需求验证或分销渠道，但现有证据不足以证明其是完整的自有商务操作系统。
    approximationNotes: 分数是分析师根据有来源的功能与适配度对比编制的 1 至 5 序数定位，不代表实测表现、市场份额或统计基准。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP016
  - id: FI001
    title: 从商户活动到毛利的收入模型桥接
    type: flow
    summary: 公开证据识别出变现路径，但无法延伸到实际收入、直接成本和毛利，因此桥接有意止于投资判断所需的信息缺口。
    data:
      nodes:
        - id: merchant-base
          label: 商户基数
          detail: Salla 报告了商户活动，但公开数量采用了尚未核对的定义与时间口径。
        - id: subscription-plans
          label: 订阅方案
          detail: Basic、Plus、Pro 与 Special；付费组合与实际价格不可得。
        - id: commerce-activity
          label: 商务活动
          detail: 商户销售，以及支付、配送、应用和服务商活动。
        - id: merchant-solutions
          label: 商户解决方案
          detail: 配送、支付、第三方应用费用与经审核服务商费用。
        - id: recognized-revenue
          label: 确认收入
          detail: 各收入流的收入以及总额与净额会计处理均未公开披露。
        - id: direct-costs
          label: 直接成本
          detail: 支付处理商、承运商、基础设施、支持与合作伙伴分成均未量化。
        - id: gross-profit
          label: 毛利
          detail: 未找到公开毛利或毛利率。
      edges:
        - from: merchant-base
          to: subscription-plans
        - from: merchant-base
          to: commerce-activity
        - from: commerce-activity
          to: merchant-solutions
        - from: subscription-plans
          to: recognized-revenue
        - from: merchant-solutions
          to: recognized-revenue
        - from: recognized-revenue
          to: direct-costs
        - from: direct-costs
          to: gross-profit
    approximationNotes: 没有估算任何数值；变现之后的节点标出缺失的会计与成本证据。
    claimRefs:
      - CI001
      - CI002
      - CI013
      - CI016
  - id: FE001
    title: 公开产品架构图
    type: stack
    summary: 这是一张基于公开接口的视图，展示商户体验、运营工作流、平台服务、集成控制、开发者工具与生态扩展之间的关系。
    data:
      layers:
        - label: 商户体验
          items:
            - 店面
            - 商户仪表盘
            - 移动应用
            - Salla Point POS
          detail: 面向客户和商户的运营界面。
        - label: 商务运营
          items:
            - 商品目录
            - 订单
            - 库存
            - 支付
            - 配送
            - 营销
            - 分析
          detail: 官方帮助中心记录的工作流模块。
        - label: 平台接口
          items:
            - 商户 REST API
            - 配送与履约合约
            - 店铺配置
          detail: 保留的公开 API 画像所描述的程序化接口。
        - label: 身份与事件
          items:
            - OAuth 2.0
            - 访问令牌与刷新令牌
            - 签名 webhook
            - 应用生命周期
          detail: 集成控制与事件交付界面。
        - label: 开发者体验
          items:
            - 开发者门户
            - CLI
            - 入门套件
            - 主题引擎
            - JavaScript SDK
          detail: 用于构建和管理 Salla 扩展的公开工具。
        - label: 生态扩展
          items:
            - Salla App Store
            - 合作伙伴应用
            - 区域服务集成
          detail: 挂接在核心平台上的第三方与合作伙伴能力。
    approximationNotes: 逻辑分层根据公开接口推断；层级顺序不代表 Salla 的私有部署拓扑、信任边界或数据流。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE013
      - CE014
  - id: FU001
    title: 商户采用与扩张路径
    type: journey-map
    summary: 证据支持从沙特商户启动到更广泛工作流的路径，但续约与客户层面的扩张仍未经验证。
    data:
      nodes:
        - id: target
          label: 沙特创业者或中小企业
          detail: 寻求本地化商务基础设施的核心商户画像。
          touchpoints:
            - Arabic-first administration
            - Local merchant workflow
        - id: launch
          label: 店铺启动
          detail: 无需编程能力即可搭建店面并开始销售。
          touchpoints:
            - Store builder
            - Product catalog
        - id: transact
          label: 支付与履约
          detail: 使用集成的支付与物流能力处理订单。
          touchpoints:
            - Payments
            - Shipping
        - id: specialize
          label: 垂直工作流
          detail: 将店铺调整到零售、数字业务、服务或批发场景。
          touchpoints:
            - Themes and apps
            - Workflow extensions
        - id: expand
          label: 区域或运营扩张
          detail: 增加集成、市场或更复杂的商户运营。
          touchpoints:
            - GCC reach
            - Custom integrations
        - id: retain
          label: 续约与扩张
          detail: 公开证据没有量化留存、流失或扩张收入。
          touchpoints:
            - Cohort retention request
            - Reference calls
    approximationNotes: 阶段展示的是基于证据的工作流顺序，不是经过测量的转化、时间或按价值比例推进。
    claimRefs:
      - CU005
      - CU011
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 剩余风险证据矩阵
    type: matrix
    summary: 矩阵按潜在影响和公开缓解证据对剩余担忧排序，而不是按实测事件概率排序。
    data:
      columns:
        - id: impact
          label: 潜在影响
          detail: 风险发生时的定性影响。
        - id: mitigation
          label: 缓解成熟度
          detail: 指定证据池中公司特定缓解措施的证据强度。
        - id: residual
          label: 剩余严重度
          detail: 纳入现有缓解证据后，分析师给出的排序。
      rows:
        - label: 隐私与 API 控制
          note: 指定证据池未纳入 Salla 特定的测试或事件证据。
          values:
            - label: 高
              detail: 重大控制失效可能影响商户与客户数据。
            - label: 无公开证据
              detail: 保留的文章提供的是通用建议，而不是公司控制措施。
            - label: 验证前为高风险
              detail: 需要当前测试、整改与事件证据。
        - label: 平台可用性
          note: 报告的商户规模扩大了潜在影响范围。
          values:
            - label: 高
              detail: 投资人报告的规模超过 100,000 家活跃商户。
            - label: 无公开证据
              detail: 证据池中没有可用性、恢复或严重事件历史。
            - label: 验证前为高风险
              detail: 需要运营指标与经过测试的恢复能力。
        - label: 支付与物流连续性
          note: 服务商集中度与故障切换未披露。
          values:
            - label: 高
              detail: 结账、结算与履约依赖外部通道。
            - label: 部分有证据
              detail: 已披露集成广度，但未披露连续性控制。
            - label: 中高
              detail: 剩余严重度取决于集中度、SLA 与替代所需时间。
        - label: 应用生态
          note: 400 多个应用扩大了能力与第三方暴露面。
          values:
            - label: 中高
              detail: 关键应用故障可能打断商户工作流。
            - label: 部分有证据
              detail: 已披露生态广度，但未披露治理与关键性。
            - label: 中高
              detail: 需要应用使用量、安全与替代数据。
        - label: 财务 runway 与商户经济性
          note: 当前现金、现金消耗率、利润率、留存与集中度均未公开。
          values:
            - label: 高
              detail: 现金续航不足或群组经济性疲弱可能限制执行。
            - label: 部分有证据
              detail: 已披露 2024 年大额融资，但未披露当前流动性。
            - label: 验证前为高风险
              detail: 募集资金不视为可用现金。
        - label: 定制化与跨境适配
          note: 商业对比指出复杂商户与全球商户存在限制。
          values:
            - label: 中高
              detail: 产品限制可能推动迁移或带来留存压力。
            - label: 部分有证据
              detail: 沙特市场集成缓解了本地中小企业的适配风险。
            - label: 中
              detail: 风险集中在复杂、品牌驱动与国际化群组。
    approximationNotes: 定性定位反映已披露规模、依赖广度、产品限制与证据缺口；它不是概率模型，也不主张已经发生过事件。
    claimRefs:
      - CR006
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 运营证据支持继续尽调，但估值与回报输入缺失，不足以批准投资。
    data:
      nodes:
        - id: scale
          label: 规模信号
          value: '>100k active merchants'
          detail: 投资人报告的当前平台规模；未经独立审计。
        - id: ecosystem
          label: 生态信号
          value: API plus app integrations
          detail: 外部集成文档支持技术可扩展性。
        - id: capital
          label: 资本信号
          value: $130m pre-IPO round
          detail: 可以看到机构需求，但融资金额不等于估值。
        - id: disclosure-gap
          label: 披露缺口
          value: No usable public valuation
          detail: 投后估值、经审计的经营数据、稀释情况和优先权安排仍不可得。
        - id: exit-signal
          label: 退出信号
          value: Potential future listing
          detail: 投资者意向只体现方向；未发现已提交的退出流程或时间表。
        - id: recommendation
          label: 建议
          value: Research more
          detail: 定价前必须直接核验财务、资本结构、治理和退出方面的证据。
      edges:
        - from: scale
          to: recommendation
        - from: ecosystem
          to: recommendation
        - from: capital
          to: disclosure-gap
        - from: disclosure-gap
          to: recommendation
        - from: exit-signal
          to: recommendation
    approximationNotes: 该流程是定性判断，不代表数值权重、概率或估值。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV009
      - CV016
