        blocks:
          - type: paragraph
            body: >-
              已披露融资序列始于 2018 年 Vision Ventures 和 Raed Ventures 参与的未披露种子轮，随后是 STV 于 2020 年 11 月领投的 850 万美元 A 轮，以及
              Investcorp 联合 Sanabil Investment 和 STV 于 2024 年 3 月领投的 1.3 亿美元 IPO 前轮。两笔已披露金额合计 1.385
              亿美元，但这不是可用现金，且不包括未披露的种子轮。数据库总额无法对账：Tracxn 报告三轮累计 1.38 亿美元，Indexed.vc 报告一轮 1.3
              亿美元。两者都无法证明估值、股价、优先权、稀释、债务、老股转让或当前现金，这些仍是交易文件层面的尽调事项。
