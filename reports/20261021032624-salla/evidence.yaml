evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      The 2024 round's post-money valuation, share price, security class, liquidation preferences, dilution, and
      secondary component.
    whyItMatters: Funding raised cannot be converted into valuation, ownership, or cash available without transaction terms.
    diligencePath: Request the 2024 term sheet, capitalization table, subscription documents, and post-close funds-flow statement.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: Audited revenue, ARR, gross margin, operating loss, cash flow, cash balance, burn, and runway.
    whyItMatters: Merchant GMV and enabled sales are not Salla revenue, ARR, cash generation, or cash available.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, revenue-recognition policy, bank balances, and a
      cash-flow bridge.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: company-wide-headcount
    missingEvidence: A current company-wide employee count by function, geography, employment status, and measurement date.
    whyItMatters: Public material cannot support operating leverage, personnel concentration, or a current headcount cover metric.
    diligencePath: Request an HRIS export reconciled to payroll and contractor records at the run date.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO001
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      The complete current executive team, board roster, committees, reserved matters, ownership stakes, and succession
      plan.
    whyItMatters: >-
      Founder dependence and investor control cannot be assessed from one CEO reference and one announced board
      appointment.
    diligencePath: >-
      Request the organization chart, board register, committee charters, shareholders' agreement, delegation matrix,
      and succession materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: merchant-scale
    missingEvidence: >-
      A dated bridge reconciling registered stores, paying merchants, active merchants, geographic coverage, churn, and
      duplicate accounts.
    whyItMatters: >-
      The 80,000 and 100,000-plus figures may reflect growth, but the undated later figure prevents a controlled
      comparison.
    diligencePath: >-
      Request monthly merchant cohorts with definitions, billing status, geography, activations, closures, and
      reconciliation to platform analytics.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: >-
      Regulator, court, incident, outage, and leadership-change records tied specifically to Salla during the review
      period.
    whyItMatters: >-
      The allocated pool supplies a product constraint but does not establish whether material adverse events occurred
      or did not occur.
    diligencePath: >-
      Run jurisdiction-specific regulator, court, cyber-incident, status-page, and executive-change checks in a
      dedicated risk review.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs: []
  - type: conflicting-data
    severity: material
    topic: platform-scale
    missingEvidence: >-
      A dated, reconciled definition of active merchant, active store, geography, and duplicate-account treatment for
      the 68,000-plus and 100,000-plus figures.
    whyItMatters: The denominator changes any penetration, retention, merchant productivity, and bottom-up SOM analysis.
    diligencePath: >-
      Request a management KPI dictionary and monthly merchant cohort export, then reconcile the official-site and
      investor-portfolio counts.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: market-share-gap
    missingEvidence: >-
      An independently checkable, dated dataset of Saudi online stores by platform with collection and activity
      methodology.
    whyItMatters: >-
      Without a platform-level denominator, neither Salla's Saudi share nor an evidence-based obtainable market can be
      calculated.
    diligencePath: >-
      Commission or obtain a methodology-disclosed domain census and reconcile it with payment, shipping, and
      merchant-registration datasets.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      Segment revenue, paid-store mix, merchant GMV distribution, take rates, churn, and Saudi-versus-international
      merchant mix.
    whyItMatters: >-
      These inputs are required to convert broad commerce activity into Salla's serviceable and obtainable revenue
      pools.
    diligencePath: >-
      Obtain audited revenue bridges, plan mix, cohort retention, merchant GMV bands, and geography splits from
      management.
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitive-economics
    missingEvidence: >-
      Definition-matched market share, active-merchant cohorts, gross and net retention, merchant multi-homing,
      migration win-loss rates, realized discounts, gateway fees, and application attach rates.
    whyItMatters: >-
      Without cohort and realized-cost data, the reported scale and feature lead cannot be translated into durable
      pricing power or switching-cost economics.
    diligencePath: >-
      Request board-grade cohort retention, merchant segmentation, churn reasons, realized ARPU, gateway economics,
      application revenue, and competitive win-loss data from Salla; reconcile definitions against Zid and Shopify where
      possible.
    relatedQuestionRefs:
      - QP009
  - type: conflicting-data
    severity: material
    topic: free-tier-payments
    missingEvidence: >-
      Current official Salla and Zid plan terms confirming whether free tiers can accept mada, Apple Pay, cards, or any
      other online payment method.
    whyItMatters: >-
      The free-tier capability changes entry pricing, merchant acquisition friction, and the validity of third-party
      total-cost comparisons.
    diligencePath: >-
      Capture dated screenshots or plan documents from the vendors and test checkout activation on fresh free-tier
      accounts.
    relatedQuestionRefs:
      - QP004
      - QP009
  - type: missing-source
    severity: minor
    topic: likely-entrants
    missingEvidence: >-
      Independent evidence identifying specific likely new entrants or a complete set of marketplace and social-selling
      substitutes in Saudi Arabia.
    whyItMatters: >-
      Unnamed entrant risk should not be converted into a scored competitor or a precise market-share dilution
      assumption.
    diligencePath: >-
      Review current Saudi commercial registrations, funding databases, technology-detection datasets, and merchant
      interviews for emerging platform names and substitution behavior.
    relatedQuestionRefs:
      - QP001
      - QP009
  - type: private-evidence-only
    severity: material
    topic: private-financials
    missingEvidence: Audited income statements, cash-flow statements, balance sheets, and stream-level revenue recognition policies.
    whyItMatters: Without these records, revenue quality, gross margin, cash conversion, and liabilities cannot be underwritten.
    diligencePath: >-
      Obtain three years of audited statements plus 2026 monthly management accounts and reconcile them to billing and
      payment-processor data.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Merchant cohort retention, GRR, NRR, CAC, payback, sales-cycle, channel-commission, and support-cost data.
    whyItMatters: >-
      These metrics determine whether low entry pricing and merchant-solutions monetization produce durable contribution
      margins.
    diligencePath: >-
      Request monthly cohorts by plan, geography, acquisition channel, and merchant size, with reconciled sales and
      service costs.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: metric-reconciliation
    missingEvidence: A dated merchant and GMV series with definitions for registered, paying, active, and transacting merchants.
    whyItMatters: >-
      Public claims range from 68,000 to more than 100,000 active merchants and cannot support growth or monetization
      analysis without a common basis.
    diligencePath: >-
      Obtain board-approved KPI definitions and monthly source-system exports, then reconcile public statements to the
      canonical series.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, burn, runway, debt, covenants, working capital, capex, use of funds, and next-round
      trigger.
    whyItMatters: The 2024 financing amount alone cannot establish current liquidity or financing dependency.
    diligencePath: >-
      Review bank statements, treasury reports, debt agreements, the operating forecast, and downside liquidity
      scenarios through 2028.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: production-assurance
    missingEvidence: >-
      Independent uptime history, incident postmortems, service-level objectives, penetration-test results, security
      certifications, and recovery test evidence.
    whyItMatters: >-
      Public API and control descriptions do not establish production reliability, operating resilience, or the
      effectiveness of security controls.
    diligencePath: >-
      Obtain the trust package, status-page history, 24-month incident register, latest penetration-test summary,
      control reports, and disaster-recovery test results.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: >-
      Private service topology, cloud and critical vendor dependencies, data residency, encryption design, tenant
      isolation, capacity limits, and recovery objectives.
    whyItMatters: >-
      The public-interface architecture cannot reveal concentration risks, jurisdiction exposure, scaling bottlenecks,
      or failure containment.
    diligencePath: >-
      Request an architecture review with current diagrams, data-flow maps, dependency inventory, regional hosting
      details, and resilience test evidence.
  - type: missing-source
    severity: material
    topic: roadmap
    missingEvidence: >-
      A dated product roadmap, release cadence, deprecation policy, API compatibility commitments, and delivery history
      against prior roadmap targets.
    whyItMatters: >-
      Repository activity and feature breadth do not demonstrate roadmap predictability or safe change management for
      merchant integrations.
    diligencePath: >-
      Review the current 18-month roadmap, release notes, API change log, deprecation notices, and
      planned-versus-delivered scorecard.
  - type: private-evidence-only
    severity: material
    topic: app-ecosystem
    missingEvidence: >-
      Active-install distribution, application review standards, permission-risk controls, vulnerable-app response,
      developer retention, and marketplace economics.
    whyItMatters: >-
      A reported application count does not establish ecosystem usage, quality, security, concentration, or durable
