company:
  name: Salla
chapter:
  number: 8
  title: Valuation
  summary: >-
    Salla has credible financing and operating-scale signals, including a $130 million
    pre-IPO round and investor-reported growth beyond 100,000 active merchants, but
    public evidence does not disclose a usable valuation, audited financials, or deal
    terms. The appropriate stance is research-more with strict entry discipline rather
    than a numeric valuation or an unconditional investment recommendation.
sections:
  - id: recommendation-and-decision-frame
    title: Recommendation and decision frame
    body: >-
      The current recommendation is research-more, with medium confidence, high
      underwriting risk, and an unknown valuation stance. Salla appears to have real
      scale and a credible localized product: Investcorp's portfolio page reports more
      than 100,000 active merchants and more than $10 billion of enabled commerce since
      2020, while Feedance documents a functioning merchant API and external integration
      surface. Those signals support further diligence, not a price-independent approval.
      The public record reviewed here does not reveal a reliable post-money valuation,
      audited revenue, margin, cash-flow, retention, dilution, or preference terms.
      Without those inputs, a conventional SaaS multiple, discounted cash-flow model, or
      target return calculation would create false precision. Investment approval should
      therefore remain conditional on a complete data room and a price that can be tested
      against verified operating economics.
    claimRefs: [CV003, CV004, CV009, CV012, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-price-support
    title: Financing context and price support
    body: >-
      The strongest financing evidence is the March 2024 $130 million pre-IPO round led
      by Investcorp alongside Sanabil Investment and STV. Tracxn's page, updated in
      September 2026, reports $138 million raised across three rounds, but its public
      table masks the latest round amount and post-money valuation. The pre-IPO label
      describes the financing vehicle and investor intent; it is not evidence of a
      completed public-market process or a confirmed unicorn valuation. StartupHub
      explicitly cautions that funding alone does not establish an imminent Tadawul
      listing or a valuation above $1 billion. The price-sensitive conclusion is thus
      straightforward: the round validates institutional demand, but it does not provide
      a public entry-price benchmark.
    claimRefs: [CV001, CV002, CV003, CV005, CV008, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-limitations
    title: Scenarios and comparable limitations
    body: >-
      A bull case requires verified monetization of Salla's scale, durable merchant
      retention, and evidence that its API and application ecosystem deepen switching
      costs. A base case assumes the platform remains strategically relevant in Saudi
      commerce but defers valuation until audited economics and transaction terms are
      available. A bear case combines multiple compression or a down round with weak
      retention, template-constrained customization, and harder expansion beyond MENA.
      The assigned evidence supports an operating comparison with Zid and Shopify, but
      it does not supply normalized public-company trading multiples, private-round
      post-money values, or M&A precedents. Accordingly, each scenario uses observable
      diligence signals and downside triggers rather than unsupported numerical valuation
      ranges or probabilities.
    claimRefs: [CV006, CV007, CV009, CV013, CV014]
    tableRefs: [TV003]
  - id: exit-readiness-and-final-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Exit readiness is directional rather than transaction-ready. Investcorp invested
      through a Saudi pre-IPO growth fund, placed a principal on Salla's board, and stated
      an interest in exploring a potential future listing. No reviewed source identifies
      a filed prospectus, named underwriter, offering timetable, or public valuation.
      Before an investment committee can set price, ownership, or target return, diligence
      should obtain the fully diluted cap table, share-class and liquidation-preference
      schedule, audited statements, cohort retention, gross margin, cash conversion,
      merchant concentration, and board-approved exit plan. Thesis-break triggers should
      include a financing below the prior round's effective price, weak net retention,
      materially lower verified merchant activity than investor-reported figures, or
      governance terms that prevent a credible return path.
    claimRefs: [CV003, CV004, CV005, CV011, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision dimension, Current view, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Research more, "Institutional financing and scale signals exist, but price-critical evidence is missing.", "Do not approve until data-room evidence supports a price and return case."]
      - [Confidence, Medium, "Funding and platform scale are corroborated by multiple assigned sources; economics are not.", "Treat operating quality as plausible but valuation confidence as low."]
      - [Risk rating, High, "No audited revenue, margins, retention, cash flow, cap table, or preference schedule is public.", "Require downside protection and explicit kill criteria."]
      - [Valuation stance, Unknown, "The accessible Tracxn table masks post-money valuation and the investor materials disclose no price.", "Do not infer a unicorn mark from the financing amount or pre-IPO label."]
      - [Entry discipline, Conditional, "A complete capitalization and operating package is needed to test dilution and returns.", "Set price only after normalized SaaS and transaction comparables can be applied."]
    notes: "Analyst decision framework based only on assigned public evidence; no numeric valuation range is supportable from the disclosed inputs."
    claimRefs: [CV002, CV003, CV012, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would strengthen the view, What would weaken the view]
    rows:
      - [Thesis, "Investor-reported scale exceeds 100,000 active merchants and $10 billion of enabled commerce.", "Audited revenue and cohort data reconcile with reported platform scale.", "Verified active merchants or commerce volume is materially lower."]
      - [Thesis, "The platform exposes APIs, webhooks, and an application ecosystem that can support integrations.", "High attach rates and retention demonstrate measurable switching costs.", "Integration usage is shallow or concentrated in low-value merchants."]
      - [Thesis, "A $130 million institutional round signals access to growth capital.", "Round terms show disciplined dilution and aligned governance.", "The next financing is priced below the prior effective share price."]
      - [Anti-thesis, "The public record does not disclose a usable valuation or audited financial profile.", "A complete data room supports durable SaaS economics and a defensible entry multiple.", "Revenue quality, margins, cash conversion, or retention miss underwriting thresholds."]
      - [Anti-thesis, "A competitor comparison identifies template constraints and a harder path beyond MENA.", "Enterprise customization and international wins show the constraints are narrowing.", "Merchant churn rises as larger customers outgrow the platform."]
      - [Anti-thesis, "Pre-IPO language may create timing expectations without a filed process.", "A board-approved plan, advisers, and regulatory milestones establish a credible path.", "Listing plans remain indefinite while liquidity needs increase."]
    notes: "Arguments separate partner-reported scale, independent operating comparisons, and analyst inferences; all change-of-view tests require direct diligence."
    claimRefs: [CV001, CV003, CV004, CV006, CV009, CV014, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Downside or upside trigger]
    rows:
      - [Bull, "Verified retention, margins, and monetization convert merchant and commerce scale into durable growth.", "Apply a growth-SaaS framework only after audited recurring revenue and net retention are available; no public range is supportable today.", "Audited growth plus improving unit economics and credible listing milestones.", "Upside requires data-room proof that ecosystem breadth creates pricing power and switching costs."]
      - [Base, "Salla remains a leading localized platform, but financial disclosure and exit timing stay limited.", "Defer numeric valuation and negotiate against verified revenue quality, dilution, and preference terms.", "Stable active-merchant cohorts and disciplined capital use without a near-term IPO.", "Hold the research-more stance until economics and transaction terms are complete."]
      - [Bear, "Multiple compression, customization limits, weak international expansion, or a down round impair returns.", "Underwrite liquidation preferences and dilution first; reject a price that assumes an unverified IPO or unicorn mark.", "Lower effective round price, weak retention, delayed liquidity, or governance misalignment.", "Pause or decline if downside protection cannot offset missing transparency."]
    notes: "Scenarios are qualitative because assigned sources contain no audited financial model, disclosed post-money valuation, or normalized transaction-comparable set."
    claimRefs: [CV003, CV005, CV006, CV012, CV013, CV014, CV015]
