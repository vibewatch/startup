    claimRefs: [CV003, CV004, CV005, CV009, CV016]
callouts:
  - calloutType: recommendation
    title: Price before prestige
    body: >-
      The $130 million round and pre-IPO framing justify diligence, but neither discloses
      the price an investor is being asked to pay. Approval should follow verified
      economics and transaction terms, not the financing label.
    claimRefs: [CV001, CV003, CV005, CV015]
  - calloutType: risk
    title: No public numerical valuation range
    body: >-
      Revenue, recurring-revenue quality, margins, retention, cash flow, post-money
      valuation, and preference terms are unavailable in the assigned public evidence.
      A precise range would therefore be an unsupported estimate.
    claimRefs: [CV003, CV012, CV015]
