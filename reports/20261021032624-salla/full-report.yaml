      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder leadership remains central to the public company profile. Tracxn identifies Nawaf Hareeri as the
              current CEO, while Investcorp and MENAbytes spell his surname Hariri; this chapter preserves that source
              variation rather than assuming the records refer to different people. Salman Butt is consistently named as
              co-founder, but the allocated sources do not establish his current operating remit. The clearest
              governance change is tied to the 2024 financing: Investcorp said its principal Robin Mansour would join
              Salla's board. A complete current board roster, executive-team list, committee structure, ownership
              percentages, and succession plan are not disclosed in the assigned evidence, so key-person dependence
              cannot be quantified from public material here.
