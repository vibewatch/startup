        title: Scale milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Merchant scale is directionally strong but the denominator and vintage must stay attached to each number.
              MENAbytes reported more than 10,000 merchants at the November 2020 Series A. Investcorp's March 2024
              announcement reported more than 80,000 active merchants, while an undated Investcorp portfolio page
              accessed for this run states more than 100,000 active merchants. The later figure may reflect growth, but
              its missing publication date prevents a precise period comparison. A September 2026 platform comparison
              also describes Salla's customization as template-constrained, a relevant execution limitation rather than
              proof of poor merchant outcomes. Audited revenue, ARR, margins, cash flow, company-wide headcount,
