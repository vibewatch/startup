        - Multiple compression, customization limits, weak international expansion, or a down round impair returns.
        - >-
          Underwrite liquidation preferences and dilution first; reject a price that assumes an unverified IPO or
          unicorn mark.
        - Lower effective round price, weak retention, delayed liquidity, or governance misalignment.
        - Pause or decline if downside protection cannot offset missing transparency.
    notes: >-
      Scenarios are qualitative because assigned sources contain no audited financial model, disclosed post-money
      valuation, or normalized transaction-comparable set.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
      - CV015
