  - id: FP001
    title: Competitive positioning by Saudi readiness and strategic flexibility
    type: quadrant
    summary: >-
      Analyst ordinal positioning shows local platforms leading Saudi readiness while global or custom options lead
      customization and geographic flexibility.
    data:
      xAxis:
        label: Saudi-market readiness (1=integration-heavy, 5=mostly built in)
        min: 1
        max: 5
      yAxis:
        label: Customization and geographic flexibility (1=limited, 5=high)
        min: 1
        max: 5
      points:
        - label: Salla
          x: 5
          'y': 3
          detail: >-
            Arabic-first and locally integrated, with broader MENA and application breadth than the other Saudi-native
            option in retained comparisons.
        - label: Zid
          x: 5
          'y': 2
          detail: >-
            Arabic-first and locally integrated, with a reported edge in Saudi shipping and physical-retail operations
            but a narrower geographic path.
        - label: Shopify
          x: 3
          'y': 5
          detail: >-
            Saudi functions are available through partners and applications; theme, app, and global expansion
            flexibility are the principal strengths.
        - label: WooCommerce
          x: 2
          'y': 5
          detail: >-
            Open-source control is high, while local payments, e-invoicing, hosting, and maintenance remain
            implementation responsibilities.
        - label: Custom / ERP-centered build
          x: 3
          'y': 5
          detail: >-
            Can optimize local integrations and unique workflows, but readiness depends on implementation rather than a
            packaged platform.
        - label: Marketplaces / social selling
          x: 2
          'y': 1
          detail: >-
            Useful as a demand-validation or distribution route, but not evidenced here as a complete owned commerce
            operating system.
    approximationNotes: >-
      Scores are analyst-authored ordinal positions from 1 to 5 based on attributed feature and fit comparisons, not
      measured performance, market share, or statistical benchmarks.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP016
  - id: FI001
    title: Revenue model bridge from merchant activity to gross profit
    type: flow
    summary: >-
      Public evidence identifies monetization routes but stops before realized revenue, direct costs, and gross profit,
      so the bridge intentionally terminates in an underwriting gap.
    data:
      nodes:
        - id: merchant-base
          label: Merchant base
          detail: Salla reports merchant activity, but public counts use unreconciled definitions and vintages.
        - id: subscription-plans
          label: Subscription plans
          detail: Basic, Plus, Pro, and Special; paid mix and realized price are unavailable.
        - id: commerce-activity
          label: Commerce activity
          detail: Merchant sales and payment, shipping, application, and service-provider activity.
        - id: merchant-solutions
          label: Merchant solutions
          detail: Shipping, payments, third-party app fees, and vetted service-provider fees.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Revenue by stream and gross-versus-net accounting are not publicly disclosed.
        - id: direct-costs
          label: Direct costs
          detail: Processor, carrier, infrastructure, support, and partner payouts are not quantified.
        - id: gross-profit
          label: Gross profit
          detail: No public gross profit or gross-margin percentage was found.
      edges:
        - from: merchant-base
          to: subscription-plans
        - from: merchant-base
          to: commerce-activity
        - from: commerce-activity
          to: merchant-solutions
        - from: subscription-plans
          to: recognized-revenue
        - from: merchant-solutions
          to: recognized-revenue
        - from: recognized-revenue
          to: direct-costs
        - from: direct-costs
          to: gross-profit
    approximationNotes: No values are estimated; nodes after monetization identify missing accounting and cost evidence.
    claimRefs:
