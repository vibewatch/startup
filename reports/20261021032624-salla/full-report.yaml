  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is hosted commerce enablement for Saudi and GCC merchants: software that lets a seller
              create a storefront and coordinate products, payments, shipping, inventory, and marketing. The broad value
              of goods sold online is not Salla's software revenue opportunity, and merchant GMV is not platform
              revenue. Salla's core buyer base is entrepreneurs and SMEs, with larger merchants and multi-branch
              operators as an adjacency. Status-quo alternatives include international hosted platforms configured
              through local apps, Saudi-native peer platforms, custom builds, and fragmented manual tools. The boundary
              therefore excludes the merchandise value retained by merchants, payment-provider economics not earned by
              Salla, and unrelated consumer marketplaces.
            claimRefs:
              - CM001
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM013
              - CM015
              - CM016
      - number: '2.2'
        title: Sizing lenses and denominator discipline
        blocks:
          - type: paragraph
            body: >-
              Investcorp's March 2024 announcement placed the Saudi e-commerce market at $20 billion and said it was
              expected to grow more than 25% year on year, but it did not disclose the estimate's spend boundary, base
              year, or methodology. That top-down figure is therefore context, not a validated TAM for Salla. Bottom-up
              scale indicators also use different denominators: an Investcorp portfolio page says Salla has enabled more
              than $10 billion in e-commerce sales since 2020 and serves more than 100,000 active merchants, while
              Salla's current site says it powers more than 68,000 active stores across the GCC. A 2020 report provides
              a historical baseline of 10,000 merchants, eight million orders, and $533 million GMV. None of these
              observations isolates software spend, Saudi-only SAM, or obtainable SOM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM012
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The practical adoption path starts with a merchant owner or e-commerce lead choosing a storefront system,
              then adding local payments, shipping, and operating applications. Salla and outside reviewers emphasize
              Arabic-first workflows and local payment and logistics integrations; these reduce setup work for
              Saudi-focused merchants and help explain adoption without proving market share. Salla also claims a
              substantial operating ecosystem: more than 100 shipping partners, over 1,000 service providers, more than
              550 apps, 40-plus languages, and payment acceptance from 79-plus countries. These are company-reported
              capability indicators rather than independently tested utilization rates, but they show how the product
              can move from initial launch to more complex operations.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM013
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Constraints, timing, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is constrained by fit rather than by a simple lack of demand. Commercial comparison publishers
              identify template-bounded customization, a narrower app ecosystem than Shopify, and more difficult
              expansion beyond Salla's strongest regional footprint; because those publishers sell alternative or custom
              solutions, their criticisms are directionally useful but not independent benchmarks. The central valuation
              problem is evidentiary: no public, checkable dataset in the assigned evidence separates Saudi stores by
              platform, and the available 68,000-store and 100,000-merchant figures are not reconciled by date or
              definition. Diligence should therefore underwrite Salla from audited subscription revenue, cohort
              retention, merchant GMV definitions, and Saudi-versus-non-Saudi mix rather than applying a broad
              e-commerce CAGR directly to company revenue.
            claimRefs:
              - CM004
              - CM005
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Large commerce volume is not software TAM
            body: >-
              The $20 billion market figure and Salla's cumulative enabled sales describe merchandise activity; neither
              discloses the subscription, payment, or application revenue pool available to Salla.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
          - type: callout
            title: Scale denominator remains unresolved
            body: >-
              The current official page reports 68,000-plus active stores across the GCC, while an investor portfolio
              page reports more than 100,000 active merchants without a visible measurement date.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive topology
        blocks:
          - type: paragraph
            body: >-
              The practical choice set is broader than a Salla-versus-Zid comparison. Saudi merchants can choose a local
              hosted platform, a global hosted incumbent, an open-source stack, a custom or ERP-centered build, or
              continue selling through marketplaces and social channels without making one platform the full system of
              record. The retained comparisons consistently place Salla and Zid in the direct Saudi-native tier, Shopify
              in the global hosted tier, and WooCommerce or custom development in the control-oriented substitute tier.
              Salla's investor reports more than 100,000 active merchants and over $10 billion of commerce enabled since
              2020, while third-party comparison sources report materially smaller scale for Zid. Those figures are not
              definition-matched market shares, and the retained evidence does not support naming a specific new entrant
              beyond the already-visible global and custom-build displacement paths.
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: Capability, distribution, and positioning
        blocks:
          - type: paragraph
            body: >-
              Local readiness is increasingly a category requirement rather than a unique moat: multiple 2026 comparison
              sources describe Salla and Zid as Arabic-first platforms with built-in Saudi payments, e-invoicing, and
              local logistics, while Shopify reaches those functions through applications or gateway partners.
              Differentiation therefore shifts to ecosystem breadth, operating fit, and expansion path. The available
              sources characterize Salla as stronger in application breadth and broader MENA reach, Zid as stronger for
              Saudi shipping and physical-retail workflows, and Shopify as stronger in themes, customization, and global
              expansion. Custom builds become credible when a merchant needs an ERP to remain the inventory source of
              truth or when a differentiated workflow cannot fit a hosted template. These are vendor and practitioner
              assessments, not independently measured capability benchmarks.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP016
      - number: '3.3'
        title: Pricing and switching economics
        blocks:
          - type: paragraph
            body: >-
              The clearest reported list-price comparison is between the local paid tiers: September 2026 sources list
              Salla Plus and Zid Rise at SAR 990 per year and Salla Pro and Zid Growth at SAR 2,990 per year. The same
              sources report that Shopify Basic adds a 2% third-party payment-provider fee in Saudi Arabia because
              Shopify Payments is unavailable there, although gateway fees and application costs remain separate.
              Free-tier capability is disputed: a May 2026 article says Salla Basic can accept mada and Apple Pay, while
              two September comparisons say Salla's and Zid's free tiers cannot accept cards or online payments. This
              conflict should be resolved against live vendor terms before modeling merchant economics. Switching is
              also nontrivial because URLs, gateway onboarding, invoicing applications, and custom workflows may need
              reconstruction; subscription price alone understates lock-in.
            claimRefs:
              - CP006
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Moat verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Salla's defensibility appears strongest where merchant scale, application supply, payment and logistics
              integrations, and Arabic operating workflows reinforce one another. It appears weaker where the buyer
              values globally portable storefront infrastructure, deep design control, or tightly coupled ERP and
              omnichannel processes. Because local payment, Arabic, and ZATCA support are also attributed to Zid, those
              capabilities are table stakes rather than durable differentiation on their own. The underwriting question
              is whether Salla's broader ecosystem creates measurable retention and lower operating cost after
              normalizing for plan, gateway, app, migration, and support expenses. No retained source provides
              definition-matched market share, cohort retention, merchant multi-homing, realized discounts, or migration
              win/loss data. Until those data are obtained, the moat is credible but not independently quantified, and
              displacement risk remains material at the upper end of merchant complexity.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Local readiness is table stakes; ecosystem depth is the moat test
            body: >-
              Salla's defensibility depends less on possessing Saudi payment, Arabic, or e-invoicing features that Zid
              also offers and more on whether its larger reported merchant and application ecosystem produces lower
              operating friction, better retention, and stronger partner economics.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Salla's disclosed model combines recurring subscriptions with merchant-linked solutions. Management
              identifies four plan tiers - Basic, Plus, Pro, and Special - and says the second stream includes shipping,
              payments, third-party application fees, and vetted service providers. That mix can broaden monetization
              beyond a fixed software fee, but the public record does not split revenue by stream or show realized take
              rates. A September 2026 comparison reports a free Basic tier, Plus at SAR 990 annually, and Pro at SAR
              2,990 annually, with enterprise pricing negotiated. Those are list-price observations from a comparison
              provider, not evidence of average realized price, discounting, contract length, collections, or recognized
              revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI005
      - number: '4.2'
        title: Traction and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Public traction is meaningful but not financially reconcilable. Salla's November 2025 page claims more
              than 68,000 active merchants and more than USD 13 billion of processed sales. Investcorp's March 2024
              announcement reported more than 80,000 active merchants and USD 7 billion of sales enabled since 2020,
              while its undated portfolio page later states more than 100,000 active merchants and over USD 10 billion.
              These figures use different vintages and potentially different definitions, so they should not be combined
              into a growth rate. Processed merchant sales are GMV-like activity, not Salla revenue or ARR. The
              divergence also makes cohort quality, merchant activity, and revenue-per-merchant impossible to assess
              without a dated, definition-consistent operating dataset.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI015
      - number: '4.3'
        title: Margins, costs, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Investcorp said in 2024 that Salla had delivered best-in-class margins, but the release supplies neither a
              margin definition nor a percentage. The merchant-solutions model creates plausible variable economics
              around payment processing, shipping, application distribution, and service-provider activity; public
              sources do not reveal whether Salla acts as principal or agent, how revenue is recognized, or which costs
              are passed through. No reviewed source discloses audited revenue, ARR, gross profit, gross margin, EBITDA,
              or operating cash flow. Likewise, CAC, payback, retention, NRR, sales-cycle length, and channel
              commissions remain unavailable. Consequently, neither software-like recurring quality nor
              transaction-linked margin expansion can be verified from the public evidence.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI013
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The USD 130 million pre-IPO round announced in March 2024 establishes financing access, not cash available
              on the October 2026 run date. The evidence does not disclose post-round cash, monthly or annual burn,
              working-capital seasonality, capital expenditure, debt facilities, covenants, planned use of funds, or a
              next-round trigger. Nearly 500 employees reported in the 2024 interview and more than 160 developers
              reported by Investcorp indicate a meaningful operating cost base, but they do not support a burn estimate.
              The financial verdict is therefore research-more: revenue mechanisms and commercial activity are credible,
              yet revenue quality, margin durability, sales efficiency, and runway remain private-evidence diligence
              items.
            claimRefs:
              - CI009
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The March 2024 financing validates investor access but cannot substitute for current cash, burn, debt, or
              forecast evidence. Underwrite capital adequacy only after reviewing the treasury position and a
              management-approved operating plan.
            calloutType: risk
            claimRefs:
              - CI009
              - CI014
          - type: callout
            title: Make financial data-room access a gating condition
            body: >-
              Require audited statements, revenue recognition policies, stream-level gross margin, merchant cohorts,
              CAC/payback, cash, debt, and runway before assigning a valuation based on SaaS or payments comparables.
            calloutType: recommendation
            claimRefs:
              - CI011
              - CI012
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface in the merchant workflow
        blocks:
          - type: paragraph
            body: >-
              Salla's documented product surface follows the operating sequence of a regional merchant: create and
              design a store, import or maintain a catalog, take payments, manage orders and inventory, arrange
              delivery, market to customers, and analyze performance. The official help center also exposes adjacent
              workflows for mobile-app creation, point of sale, multi-market operations, chat, financing, and an app
              marketplace. That breadth makes the product more akin to a commerce operating layer than a single website
              builder. Import paths from WooCommerce, Shopify, and Magento reduce initial migration friction, although
              the evidence does not quantify migration completeness, implementation time, or data-loss rates.
              Third-party reviews consistently emphasize Arabic-first operation and locally relevant payment and
              logistics integrations; those are credible product-positioning signals, not independent performance
              benchmarks. The underwriting question is therefore less whether the modules exist and more whether
              merchants can deploy, operate, and support them reliably at scale.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE010
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE007
              - CE008
              - CE009
      - number: '5.2'
        title: Public technical and extension architecture
        blocks:
          - type: paragraph
            body: >-
              The visible architecture separates merchant operations from extension surfaces. Salla maintains a public
              developer portal and an active company GitHub organization with a CLI, OAuth client, starter kits, a theme
              repository, and a ZATCA-oriented package. An independent API catalog describes a Merchant REST API, an
              OAuth 2.0 authorization service, signed lifecycle webhooks, shipping and fulfillment contracts, and a
              storefront theme engine and JavaScript SDK. Together these artifacts support an inference that Salla is
              designed as an extensible platform with merchant data and workflows at the core, developer authentication
              and events in the integration layer, and themes, embedded components, and apps at the experience layer.
              This is a public-interface map, not proof of the private production stack, service boundaries, throughput,
              latency, or resilience. The distinction matters because API breadth can lower integration costs while
              leaving operating quality and dependency concentration unmeasured.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE013
              - CE014
      - number: '5.3'
        title: Maturity, differentiation, and control gaps
        blocks:
          - type: paragraph
            body: >-
              Product maturity is most visible in breadth and ecosystem activity. The official help surface covers role
              permissions, activity logs, partner permissions, webhooks, returns, multi-warehouse inventory, regional
              payments, shipping routes, and app installation. Investcorp reports more than 400 applications on the
              platform, while the company GitHub page showed 14 public repositories with several updates during October
              2026. These signals support ongoing product investment and a meaningful extension ecosystem, but they do
              not reveal app usage, review quality, dependency concentration, or commercial take rates. Competitive
              reviews attribute differentiation to Arabic-first administration and built-in Saudi payment, invoicing,
              and shipping workflows; the same reviews identify template-bounded customization, a narrower ecosystem
              than Shopify, and a harder path beyond MENA. Trust evidence remains the largest technical diligence gap:
              the assigned public sources do not provide an uptime record, status history, penetration-test results,
              security certifications, data residency commitments, recovery objectives, or a dated roadmap. No inference
              about the absence of incidents is made from that missing record.
            claimRefs:
              - CE004
              - CE006
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Localized breadth is the clearest product advantage
            body: >-
              Salla combines Arabic-first commerce operations with documented regional payments, invoicing, shipping,
              marketing, POS, mobile, and extension surfaces. The breadth is observable even though realized merchant
              outcomes are not.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE010
              - CE015
          - type: callout
            title: Public interfaces do not establish production assurance
            body: >-
              API, OAuth, webhook, and repository evidence demonstrates extensibility, but the reviewed pool does not
              disclose uptime, incident history, security attestations, recovery objectives, data residency, or
              independent control tests.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Adoption is substantial, but the denominator is unstable
        blocks:
          - type: paragraph
            body: >-
              Salla's own current page states that the platform powers more than 68,000 active stores and that one in
              two people in Saudi Arabia has bought from a Salla store. Investcorp, an investor rather than an
              independent benchmark, describes more than 100,000 active merchants and more than $10 billion of commerce
              enabled since 2020. Both establish meaningful reach, but they do not establish a common merchant
              definition, measurement date, or active-use threshold. The discrepancy becomes sharper against an
              implementation agency's citation of AfterShip for more than 19,600 active Saudi stores. Historical
              reporting provides a directional trajectory from more than 10,000 merchants and eight million processed
              orders in 2020, yet the retained evidence cannot convert these snapshots into a clean cohort or growth
              series. Diligence should therefore treat scale as demonstrated and the precise current customer count as
              unresolved.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.2'
        title: The core buyer is a Saudi merchant, with widening use-case breadth
        blocks:
          - type: paragraph
            body: >-
              The clearest customer fit is Saudi-focused entrepreneurs and SMEs seeking Arabic-first store operations,
              local payments, logistics, and rapid launch. Third-party practitioner material describes use cases across
              fashion, beauty, food, electronics, home goods, digital products, B2B wholesale, and service businesses.
              This breadth suggests a horizontal merchant platform rather than a single-vertical product, while
              specialist B2B and service workflows can require extensions or custom development. AIOM describes use
              beyond Saudi Arabia across several Gulf markets, and Ijjad frames Salla as the Saudi-native option for
              SMEs with broader MENA ambition. Those sources are useful for segment mapping, not audited customer mix:
              no retained source discloses merchant distribution by geography, vertical, plan, GMV band, or enterprise
              size.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.3'
        title: Retention, expansion, and reference quality remain the decisive gaps
        blocks:
          - type: paragraph
            body: >-
              Public reach does not demonstrate durable subscription economics. None of the retained materials discloses
              gross or net revenue retention, logo churn, renewal rates, contract duration, cohort behavior, expansion
              revenue, or customer concentration. The official site presents aggregate adoption and trust claims, while
              investor and media pages provide aggregate merchant or transaction snapshots; none identifies a merchant
              with a verified production status, measured outcome, and evidence date. The absence of a checkable
              platform-share dataset further weakens comparative adoption claims. Investment diligence should request
              cohort retention by plan and merchant size, top-customer and channel exposure, and a reference set
              spanning recent joiners, mature merchants, and churned accounts before assigning durability or
              land-and-expand value.
            claimRefs:
              - CU003
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU007
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate stores with merchants
            body: >-
              The 19,600-store, 68,000-store, and 100,000-merchant figures use different labels and lack a reconciled
              date and active-use definition.
            calloutType: risk
            claimRefs:
              - CU001
              - CU004
              - CU009
              - CU010
          - type: callout
            title: Make cohort evidence a diligence condition
            body: >-
              Request monthly logo and revenue cohorts by plan, merchant size, geography, and acquisition channel, plus
              named reference and churned-customer calls.
            calloutType: recommendation
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and ranking
        blocks:
          - type: paragraph
            body: >-
              Salla's disclosed scale makes resilience a thesis-level issue: Investcorp says the platform serves more
              than 100,000 active merchants and has enabled more than $10 billion in e-commerce sales since 2020, while
              also describing more than 400 applications and integrations with payment and logistics providers. Those
              figures are investor-issued and undated on the retained portfolio page, so they establish potential blast
              radius rather than current incident probability. The highest residual concerns are therefore platform
              availability, privacy and API controls, and external-service continuity. The heatmap ranks evidence
              exposure, not measured event frequency; no source in the assigned pool provides Salla-specific outage
              history, loss data, control testing, or provider concentration.
            claimRefs:
              - CR001
              - CR003
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not establish Salla's current PDPL compliance, security certifications,
              regulatory approvals, litigation position, or enforcement history. A security article naming Salla
              discusses common e-commerce API risks such as broken authorization, excessive data exposure,
              object-reference flaws, rate-limit gaps, weak encryption, and inadequate monitoring, but it reports no
              Salla-specific test, vulnerability, breach, or incident. That distinction is critical: generic attack
              paths justify diligence, not an allegation. Commercial comparison material says Saudi payment methods and
              ZATCA e-invoicing are built into Salla, but no regulator or audited company artifact in the pool verifies
              implementation quality. Investment approval should require primary compliance and control evidence rather
              than infer safety from the absence of an identified incident.
            claimRefs:
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR010
              - CR015
      - number: '7.3'
        title: Operational, product, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is concentrated in a multi-sided platform whose merchants depend on store creation,
              payments, shipping, marketing, analytics, and third-party applications. The company-issued profile
              reposted by Naukrigulf confirms the breadth of those workflows, while Investcorp reports more than 160
              developers and over 400 applications. Development capacity is a mitigation signal, but neither figure
              proves redundancy, recovery performance, change-control maturity, or incident response. Ijjad's
              commercially interested comparison identifies template-bounded customization, a narrower theme and app
              ecosystem than Shopify, and harder expansion outside MENA. These constraints could drive migration or
              retention pressure among complex, brand-led, or internationally ambitious merchants even if Salla remains
              well fitted to Saudi SMEs.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
              - CR009
              - CR010
              - CR013
      - number: '7.4'
        title: Dependencies, financial opacity, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Investcorp announced a $130 million pre-IPO round in March 2024, but funding raised is not cash available
              and the retained investor disclosures do not provide current cash, burn, runway, revenue, gross margin,
              retention, loss exposure, or financing preferences. Historical reporting described a freemium model, paid
              tiers starting at SAR 99, no sales cut, and much smaller 2020 merchant and GMV figures; those data do not
              establish current unit economics. The thesis should break or pause if diligence finds unresolved material
              PDPL or security deficiencies, recurring severe outages, a critical payment or logistics provider without
              tested failover, material top-merchant concentration, deteriorating retention among complex merchants, or
              less than 18 months of funded runway without a credible financing plan.
            claimRefs:
              - CR004
              - CR011
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary diligence condition
            body: >-
              Do not infer a clean compliance or incident record from silence. Approval should require current security
              testing, PDPL evidence, resilience metrics, provider concentration, merchant revenue cohorts, and a
              reconciled cash-runway bridge.
            calloutType: risk
            claimRefs:
              - CR010
              - CR015
              - CR016
          - type: callout
            title: Thesis-break triggers
            body: >-
              Pause or reject if diligence finds an unresolved material privacy or security deficiency, recurring severe
              outages, an unmitigated critical-provider dependency, material merchant concentration, or less than 18
              months of runway without credible financing.
            calloutType: recommendation
            claimRefs:
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and decision frame
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is research-more, with medium confidence, high underwriting risk, and an
              unknown valuation stance. Salla appears to have real scale and a credible localized product: Investcorp's
              portfolio page reports more than 100,000 active merchants and more than $10 billion of enabled commerce
              since 2020, while Feedance documents a functioning merchant API and external integration surface. Those
              signals support further diligence, not a price-independent approval. The public record reviewed here does
              not reveal a reliable post-money valuation, audited revenue, margin, cash-flow, retention, dilution, or
              preference terms. Without those inputs, a conventional SaaS multiple, discounted cash-flow model, or
              target return calculation would create false precision. Investment approval should therefore remain
              conditional on a complete data room and a price that can be tested against verified operating economics.
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV016
      - number: '8.2'
        title: Financing context and price support
        blocks:
          - type: paragraph
            body: >-
              The strongest financing evidence is the March 2024 $130 million pre-IPO round led by Investcorp alongside
              Sanabil Investment and STV. Tracxn's page, updated in September 2026, reports $138 million raised across
              three rounds, but its public table masks the latest round amount and post-money valuation. The pre-IPO
              label describes the financing vehicle and investor intent; it is not evidence of a completed public-market
              process or a confirmed unicorn valuation. StartupHub explicitly cautions that funding alone does not
              establish an imminent Tadawul listing or a valuation above $1 billion. The price-sensitive conclusion is
              thus straightforward: the round validates institutional demand, but it does not provide a public
              entry-price benchmark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV009
              - CV014
              - CV016
      - number: '8.3'
        title: Scenarios and comparable limitations
        blocks:
          - type: paragraph
            body: >-
              A bull case requires verified monetization of Salla's scale, durable merchant retention, and evidence that
              its API and application ecosystem deepen switching costs. A base case assumes the platform remains
              strategically relevant in Saudi commerce but defers valuation until audited economics and transaction
              terms are available. A bear case combines multiple compression or a down round with weak retention,
              template-constrained customization, and harder expansion beyond MENA. The assigned evidence supports an
              operating comparison with Zid and Shopify, but it does not supply normalized public-company trading
              multiples, private-round post-money values, or M&A precedents. Accordingly, each scenario uses observable
              diligence signals and downside triggers rather than unsupported numerical valuation ranges or
              probabilities.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is directional rather than transaction-ready. Investcorp invested through a Saudi pre-IPO
              growth fund, placed a principal on Salla's board, and stated an interest in exploring a potential future
              listing. No reviewed source identifies a filed prospectus, named underwriter, offering timetable, or
              public valuation. Before an investment committee can set price, ownership, or target return, diligence
              should obtain the fully diluted cap table, share-class and liquidation-preference schedule, audited
              statements, cohort retention, gross margin, cash conversion, merchant concentration, and board-approved
              exit plan. Thesis-break triggers should include a financing below the prior round's effective price, weak
              net retention, materially lower verified merchant activity than investor-reported figures, or governance
              terms that prevent a credible return path.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price before prestige
            body: >-
              The $130 million round and pre-IPO framing justify diligence, but neither discloses the price an investor
              is being asked to pay. Approval should follow verified economics and transaction terms, not the financing
              label.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV015
          - type: callout
            title: No public numerical valuation range
            body: >-
              Revenue, recurring-revenue quality, margins, retention, cash flow, post-money valuation, and preference
              terms are unavailable in the assigned public evidence. A precise range would therefore be an unsupported
              estimate.
            calloutType: risk
            claimRefs:
              - CV003
              - CV012
              - CV015
