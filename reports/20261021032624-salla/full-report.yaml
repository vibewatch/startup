      - number: '1.3'
        title: Financing history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing sequence begins with an undisclosed 2018 seed round from Vision Ventures and Raed
              Ventures, followed by an $8.5 million Series A led by STV in November 2020 and a $130 million pre-IPO
              round led by Investcorp with Sanabil Investment and STV in March 2024. The two disclosed amounts sum to
              $138.5 million, but that arithmetic is not cash available and excludes the undisclosed seed. Database
              totals are not reconciled: Tracxn reports $138 million over three rounds, while Indexed.vc reports $130
              million over one round. Neither figure establishes valuation, share price, preferences, dilution, debt,
              secondaries, or current cash; those remain transaction-document diligence items.
