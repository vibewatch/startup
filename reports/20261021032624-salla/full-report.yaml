chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Investcorp and MENAbytes place Salla's establishment in Makkah in 2016 and identify Nawaf Hariri and
              Salman Butt as its founders. The product is a merchant-facing SaaS platform rather than a marketplace:
              merchants can create online storefronts, accept payments, connect logistics, and extend the system through
              applications. That positioning is consistent across investor and independent coverage, although the
              current headquarters is not cleanly resolved by the allocated evidence: Tracxn labels the company
              Mecca-based while Indexed.vc calls it Jeddah-based. The snapshot therefore treats Makkah as the documented
              establishment location and leaves current headquarters open rather than converting a location conflict
              into a precise cover fact.
            claimRefs:
              - CO001
              - CO002
              - CO004
