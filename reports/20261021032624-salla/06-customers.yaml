  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: customer-count
      missingEvidence: >-
        A dated company reconciliation of active merchants, active stores, paid
        accounts, and geographic scope using explicit activity thresholds.
      whyItMatters: >-
        Unreconciled denominators prevent a defensible current customer count and
        distort adoption growth comparisons.
      diligencePath: >-
        Obtain monthly merchant and store extracts for 2020-2026 with definitions,
        deduplication logic, geography, plan tier, and active-use criteria.
      relatedQuestionRefs: [QU002, QU006]
      relatedTableRefs: [TU002]
    - type: private-evidence-only
      severity: material
      topic: retention-and-expansion
      missingEvidence: >-
        GRR, NRR, logo churn, renewal, cohort survival, expansion revenue, and
        contract-duration data by plan and merchant segment.
      whyItMatters: >-
        Aggregate adoption cannot establish recurring revenue durability or
        land-and-expand economics.
      diligencePath: >-
        Review monthly logo and revenue cohort tables, cancellation reasons, and
        renewal records, then reconcile them to billed subscription revenue.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Named merchants with deployment dates, production status, quantified
        outcomes, and permission for investor reference calls.
      whyItMatters: >-
        Aggregate logos and activity claims do not validate realized customer
        value, implementation quality, or retention.
      diligencePath: >-
        Request at least six references across new, mature, expanded, and churned
        cohorts and verify outcomes against platform records.
      relatedQuestionRefs: [QU001]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Revenue, GMV, and transaction concentration by top merchants, channel,
        geography, vertical, and acquisition partner.
      whyItMatters: >-
