schemaVersion: "report-v2"
artifact: customers
slug: salla
runDate: 2026-10-21
company:
  name: Salla
chapter:
  number: 6
  title: Customers
  summary: >-
    Salla has substantial merchant reach, with current public claims ranging from
    68,000 active stores to more than 100,000 active merchants, but those
    denominators are not reconciled. Public evidence supports broad Saudi SME and
    retail adoption while leaving retention, concentration, and named-customer
    outcomes unverified.
sections:
  - id: adoption-scale
    title: Adoption is substantial, but the denominator is unstable
    body: >-
      Salla's own current page states that the platform powers more than 68,000
      active stores and that one in two people in Saudi Arabia has bought from a
      Salla store. Investcorp, an investor rather than an independent benchmark,
      describes more than 100,000 active merchants and more than $10 billion of
      commerce enabled since 2020. Both establish meaningful reach, but they do
      not establish a common merchant definition, measurement date, or active-use
      threshold. The discrepancy becomes sharper against an implementation
      agency's citation of AfterShip for more than 19,600 active Saudi stores.
      Historical reporting provides a directional trajectory from more than
      10,000 merchants and eight million processed orders in 2020, yet the
      retained evidence cannot convert these snapshots into a clean cohort or
      growth series. Diligence should therefore treat scale as demonstrated and
      the precise current customer count as unresolved.
    claimRefs: [CU001, CU002, CU004, CU005, CU006, CU007, CU009, CU010]
    tableRefs: [TU002]
  - id: customer-segments
    title: The core buyer is a Saudi merchant, with widening use-case breadth
    body: >-
      The clearest customer fit is Saudi-focused entrepreneurs and SMEs seeking
      Arabic-first store operations, local payments, logistics, and rapid launch.
      Third-party practitioner material describes use cases across fashion,
      beauty, food, electronics, home goods, digital products, B2B wholesale,
      and service businesses. This breadth suggests a horizontal merchant
      platform rather than a single-vertical product, while specialist B2B and
      service workflows can require extensions or custom development. AIOM
      describes use beyond Saudi Arabia across several Gulf markets, and Ijjad
      frames Salla as the Saudi-native option for SMEs with broader MENA
      ambition. Those sources are useful for segment mapping, not audited
      customer mix: no retained source discloses merchant distribution by
      geography, vertical, plan, GMV band, or enterprise size.
    claimRefs: [CU011, CU012, CU013, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: durability-proof
    title: Retention, expansion, and reference quality remain the decisive gaps
    body: >-
      Public reach does not demonstrate durable subscription economics. None of
      the retained materials discloses gross or net revenue retention, logo
      churn, renewal rates, contract duration, cohort behavior, expansion
      revenue, or customer concentration. The official site presents aggregate
      adoption and trust claims, while investor and media pages provide aggregate
      merchant or transaction snapshots; none identifies a merchant with a
      verified production status, measured outcome, and evidence date. The
      absence of a checkable platform-share dataset further weakens comparative
      adoption claims. Investment diligence should request cohort retention by
      plan and merchant size, top-customer and channel exposure, and a reference
      set spanning recent joiners, mature merchants, and churned accounts before
      assigning durability or land-and-expand value.
    claimRefs: [CU003, CU015, CU016]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation by merchant workflow
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale evidence
      - Strategic value
      - Diligence gap
    rows:
      - - Saudi entrepreneurs and SMEs
        - Owner-operator or small commerce team
        - Launch and operate an Arabic-first online store
        - "Aggregate platform claims only; segment count not disclosed"
        - Core acquisition base and likely largest logo cohort
        - Plan mix, activation, and survival by cohort
      - - Consumer retail brands
        - Brand owner, e-commerce manager, operations team
        - Fashion, beauty, food, electronics, and home-goods commerce
        - "Multiple verticals described; no vertical merchant distribution"
        - Broader GMV and app demand across repeatable retail workflows
        - Vertical retention, order frequency, and GMV concentration
      - - Digital and service merchants
        - Educator, consultant, clinic, salon, or service operator
        - Digital delivery, subscriptions, or booking-led sales
        - "Use cases described by an implementation agency; no cohort size"
        - Extends addressable demand beyond physical retail
        - Production adoption and workflow completion rates
      - - B2B and cross-MENA merchants
        - Wholesale operator or growth-stage regional merchant
        - Tiered ordering, integrations, and regional expansion
        - "GCC reach reported, but country and B2B mix are undisclosed"
        - Higher-complexity expansion opportunity
        - Custom-workflow limits, country mix, and enterprise renewal
    notes: >-
      Segment taxonomy is synthesized from retained practitioner and review
      sources; no source discloses Salla's actual customer mix by segment.
    claimRefs: [CU011, CU012, CU013, CU014]
  - id: TU002
    title: Customer growth and adoption evidence
    columns:
      - Metric
      - Reported value
      - Period / date
      - Publisher
      - Confidence
      - Implication
      - Missing denominator or qualifier
    rows:
      - - Merchants
        - "More than 10,000"
        - "2020"
        - MENAbytes
        - Medium
        - Establishes a historical adoption baseline
        - Active definition and geographic split not stated
      - - Processed orders
        - "8 million"
        - "Through November 2020"
        - MENAbytes
        - Medium
        - Demonstrates realized transaction activity
        - Order period, repeat rate, and merchant distribution not stated
      - - Active stores
        - "68,000+"
        - "Current page accessed 2026-10-21"
        - Salla
        - Medium
        - Supports substantial current platform reach
        - Methodology, geography, and active threshold not disclosed
      - - Active merchants
        - "Over 100,000"
        - "Current portfolio page accessed 2026-10-21"
        - Investcorp
        - Medium
        - Indicates a potentially broader merchant denominator
        - Store-versus-merchant definition and measurement date not stated
      - - Active KSA stores
        - "More than 19,600"
        - "2026 article citing AfterShip"
        - Etihad Falcon Tech
        - Low
        - Provides an outside technology-tracker snapshot
        - Underlying AfterShip extract, date, and tracking methodology absent
      - - Completed orders
        - "More than 90 million"
        - "2025-labeled case study"
        - TASK
        - Low
        - Suggests cumulative transaction growth after 2020
        - Period, primary source, and duplicate or canceled-order treatment absent
    notes: >-
      Values are reproduced with their original metric labels and are not treated
      as a single comparable series; merchant, store, order, and sales denominators
      differ and several publication dates or methodologies are missing.
    claimRefs: [CU001, CU004, CU006, CU007, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Public evidence surface
      - Named customer
      - Segment
      - Deployment status
      - Quantified outcome
      - Limitation
    rows:
      - - Salla official ecosystem page
        - Not disclosed
        - Aggregate store base
        - Aggregate active-store claim
        - "68,000+ active stores"
        - No merchant identity, cohort, or outcome methodology
      - - Investcorp portfolio page
        - Not disclosed
        - Aggregate merchant base
        - Aggregate active-merchant claim
        - "Over 100,000 active merchants; over $10 billion sales enabled since 2020"
        - Investor-issued aggregate with no customer-level validation
      - - MENAbytes historical coverage
        - Not disclosed
        - Aggregate 2020 merchant base
        - Historical platform usage
        - "More than 10,000 merchants; 8 million orders"
        - No named deployment, retention result, or recent outcome
    notes: >-
      Sample covers the strongest retained official, investor, and independent
      media adoption surfaces; null customer-level proof is an evidence finding,
      not evidence that no reference customers exist.
    enumerationScope:
      coverage: sample
      basis: >-
        Strongest retained public adoption sources reviewed for named merchants,
        production status, and quantified outcomes as of 2026-10-21.
    claimRefs: [CU001, CU004, CU005, CU006, CU007, CU016]
figures:
  - id: FU001
    title: Merchant adoption and expansion journey
    type: journey-map
    summary: >-
      Evidence supports the route from Saudi merchant launch to broader workflows,
      while renewal and customer-level expansion remain unverified.
    data:
      nodes:
        - id: target
          label: Saudi entrepreneur or SME
          detail: Core merchant profile seeking localized commerce infrastructure.
          touchpoints:
            - Arabic-first administration
            - Local merchant workflow
        - id: launch
          label: Store launch
          detail: Build a storefront and begin selling without programming expertise.
          touchpoints:
            - Store builder
            - Product catalog
        - id: transact
          label: Payments and fulfillment
          detail: Use integrated payment and logistics capabilities to process orders.
          touchpoints:
            - Payments
            - Shipping
        - id: specialize
          label: Vertical workflow
          detail: Adapt the store for retail, digital, service, or wholesale use cases.
          touchpoints:
            - Themes and apps
            - Workflow extensions
        - id: expand
          label: Regional or operational expansion
          detail: Add integrations, markets, or more complex merchant operations.
          touchpoints:
            - GCC reach
            - Custom integrations
        - id: retain
          label: Renewal and expansion
          detail: Public evidence does not quantify retention, churn, or expansion revenue.
          touchpoints:
            - Cohort retention request
            - Reference calls
    approximationNotes: >-
      Stages show an evidence-based workflow sequence, not measured conversion,
      timing, or value-proportional progression.
    claimRefs: [CU005, CU011, CU012, CU013, CU014]
callouts:
  - calloutType: risk
    title: Do not equate stores with merchants
    body: >-
      The 19,600-store, 68,000-store, and 100,000-merchant figures use different
      labels and lack a reconciled date and active-use definition.
    claimRefs: [CU001, CU004, CU009, CU010]
  - calloutType: recommendation
    title: Make cohort evidence a diligence condition
    body: >-
      Request monthly logo and revenue cohorts by plan, merchant size, geography,
      and acquisition channel, plus named reference and churned-customer calls.
    claimRefs: [CU015, CU016]
