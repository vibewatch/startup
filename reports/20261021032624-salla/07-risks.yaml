company:
  name: "Salla"
chapter:
  number: 7
  title: "Risks"
  summary: "Salla's largest evidenced exposures are the blast radius created by merchant scale, dependence on payment, logistics, and app integrations, and the absence of public company-specific control, concentration, and financial evidence. Product constraints and a pre-IPO capital structure add execution and governance risk, but the assigned evidence does not substantiate a specific breach, outage, enforcement action, or failed control."
sections:
  - id: "risk-posture"
    title: "Risk posture and ranking"
    body: >-
      Salla's disclosed scale makes resilience a thesis-level issue: Investcorp says the platform serves more than 100,000 active merchants and has enabled more than $10 billion in e-commerce sales since 2020, while also describing more than 400 applications and integrations with payment and logistics providers. Those figures are investor-issued and undated on the retained portfolio page, so they establish potential blast radius rather than current incident probability. The highest residual concerns are therefore platform availability, privacy and API controls, and external-service continuity. The heatmap ranks evidence exposure, not measured event frequency; no source in the assigned pool provides Salla-specific outage history, loss data, control testing, or provider concentration.
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR014"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "regulatory-and-security"
    title: "Regulatory, legal, and security exposure"
    body: >-
      The retained evidence does not establish Salla's current PDPL compliance, security certifications, regulatory approvals, litigation position, or enforcement history. A security article naming Salla discusses common e-commerce API risks such as broken authorization, excessive data exposure, object-reference flaws, rate-limit gaps, weak encryption, and inadequate monitoring, but it reports no Salla-specific test, vulnerability, breach, or incident. That distinction is critical: generic attack paths justify diligence, not an allegation. Commercial comparison material says Saudi payment methods and ZATCA e-invoicing are built into Salla, but no regulator or audited company artifact in the pool verifies implementation quality. Investment approval should require primary compliance and control evidence rather than infer safety from the absence of an identified incident.
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
    tableRefs:
      - "TR001"
  - id: "operational-and-product"
    title: "Operational, product, and execution risk"
    body: >-
      Operational risk is concentrated in a multi-sided platform whose merchants depend on store creation, payments, shipping, marketing, analytics, and third-party applications. The company-issued profile reposted by Naukrigulf confirms the breadth of those workflows, while Investcorp reports more than 160 developers and over 400 applications. Development capacity is a mitigation signal, but neither figure proves redundancy, recovery performance, change-control maturity, or incident response. Ijjad's commercially interested comparison identifies template-bounded customization, a narrower theme and app ecosystem than Shopify, and harder expansion outside MENA. These constraints could drive migration or retention pressure among complex, brand-led, or internationally ambitious merchants even if Salla remains well fitted to Saudi SMEs.
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR006"
      - "CR007"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR002"
  - id: "dependencies-financial-and-kill-criteria"
    title: "Dependencies, financial opacity, and thesis-break triggers"
    body: >-
      Investcorp announced a $130 million pre-IPO round in March 2024, but funding raised is not cash available and the retained investor disclosures do not provide current cash, burn, runway, revenue, gross margin, retention, loss exposure, or financing preferences. Historical reporting described a freemium model, paid tiers starting at SAR 99, no sales cut, and much smaller 2020 merchant and GMV figures; those data do not establish current unit economics. The thesis should break or pause if diligence finds unresolved material PDPL or security deficiencies, recurring severe outages, a critical payment or logistics provider without tested failover, material top-merchant concentration, deteriorating retention among complex merchants, or less than 18 months of funded runway without a credible financing plan.
    claimRefs:
      - "CR004"
      - "CR011"
      - "CR012"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
