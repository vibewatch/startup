figures:
  - id: "FR001"
    title: "Residual-risk evidence matrix"
    type: "matrix"
    summary: "The matrix ranks residual concern by potential impact and public mitigation evidence, not by measured incident probability."
    data:
      columns:
        - id: "impact"
          label: "Potential impact"
          detail: "Qualitative impact if the risk materializes."
        - id: "mitigation"
          label: "Mitigation maturity"
          detail: "Strength of company-specific mitigation evidence in the assigned pool."
        - id: "residual"
          label: "Residual severity"
          detail: "Analyst ranking after considering the available mitigation evidence."
      rows:
        - label: "Privacy and API controls"
          note: "No Salla-specific test or incident evidence was allocated."
          values:
            - label: "High"
              detail: "A material control failure could affect merchant and customer data."
            - label: "Not publicly evidenced"
              detail: "The retained article provides generic recommendations rather than company controls."
            - label: "High until verified"
              detail: "Requires current testing, remediation, and incident evidence."
        - label: "Platform availability"
          note: "Reported merchant scale increases potential blast radius."
          values:
            - label: "High"
              detail: "Investor-reported scale exceeds 100,000 active merchants."
            - label: "Not publicly evidenced"
              detail: "No uptime, recovery, or severe-incident history is in the pool."
            - label: "High until verified"
              detail: "Operational metrics and tested recovery are required."
        - label: "Payment and logistics continuity"
          note: "Provider concentration and failover are undisclosed."
          values:
            - label: "High"
              detail: "Checkout, settlement, and fulfillment depend on external rails."
            - label: "Partially evidenced"
              detail: "Integration breadth is disclosed, but continuity controls are not."
            - label: "Medium-high"
              detail: "Residual severity depends on concentration, SLAs, and substitution time."
        - label: "Application ecosystem"
          note: "More than 400 applications expand capability and third-party surface."
          values:
            - label: "Medium-high"
              detail: "A critical application failure could disrupt merchant workflows."
            - label: "Partially evidenced"
              detail: "Ecosystem breadth is disclosed; governance and criticality are not."
            - label: "Medium-high"
              detail: "Requires application usage, security, and substitution data."
        - label: "Financial runway and merchant economics"
          note: "Current cash, burn, margin, retention, and concentration are not public."
          values:
            - label: "High"
              detail: "Insufficient runway or weak cohort economics could constrain execution."
            - label: "Partially evidenced"
              detail: "A large 2024 financing is disclosed, but present liquidity is not."
            - label: "High until verified"
              detail: "Funding raised is not treated as cash available."
        - label: "Customization and cross-border fit"
          note: "A commercial comparison identifies limits for complex and global merchants."
          values:
            - label: "Medium-high"
              detail: "Product constraints could drive migration or retention pressure."
            - label: "Partially evidenced"
              detail: "Saudi-market integrations mitigate fit risk for local SMEs."
            - label: "Medium"
              detail: "Risk is concentrated in complex, brand-led, and international cohorts."
    approximationNotes: "Qualitative placement reflects disclosed scale, dependency breadth, product constraints, and evidence gaps; it is not a probability model and does not assert an incident occurred."
    claimRefs:
      - "CR006"
      - "CR014"
      - "CR015"
      - "CR016"
