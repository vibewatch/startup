evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board composition, shareholder rights, and any formal governance or committee disclosures.
    whyItMatters: >-
      Founder influence is visible, but underwriting control risk and governance quality requires formal board and
      ownership data.
    diligencePath: Obtain cap table, board list, and latest corporate-structure memo from management or IPO counsel.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A dated, reconcilable employee-count disclosure for 2026 across China, Hong Kong and US operations.
    whyItMatters: >-
      Headcount is a key proxy for burn, platform maturity and operating leverage but is not credibly disclosed in
      accessible public sources.
    diligencePath: Request HR headcount by geography/function and compare with payroll or visa records.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      A current post-2021 valuation or term sheet that can bridge the company from Series A to the reported 2026 IPO
      process.
    whyItMatters: >-
      Recommendation quality later depends on entry price, dilution and step-up history; public sources do not disclose
      a confirmed current valuation.
    diligencePath: Obtain latest financing documents, internal valuation memos or IPO banker materials.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: >-
      A clean legal-entity and headquarters explanation separating operating base, legal topco and strategic-enterprise
      registration.
    whyItMatters: Inconsistent headquarters language complicates jurisdictional, data-governance and listing-risk analysis.
    diligencePath: Request entity chart and confirm registered addresses for topco and principal operating subsidiaries.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, burn, runway and backlog disclosures tied to the platform and partnership business model.
    whyItMatters: Public scale metrics are strong, but company-overview quality remains limited without audited financial context.
    diligencePath: >-
      Request audited statements, management accounts and major-contract revenue schedules before underwriting
      valuation.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: material
    topic: market-conflict
    missingEvidence: >-
      A company-level market model that reconciles the AI-discovery TAM with the broader discovery-technology stack
      without double counting.
    whyItMatters: >-
      Valuation later depends on picking the right market denominator; broad-stack figures materially overstate BioMap’s
      direct reachable spend.
    diligencePath: >-
      Build bottoms-up SAM from customer classes, average contract values and use cases rather than averaging
      third-party TAM reports.
    relatedQuestionRefs:
      - QM005
      - QM023
  - type: private-evidence-only
    severity: material
    topic: sam-gap
    missingEvidence: Customer-level contract values, production-vs-pilot mix, and renewal data by segment and geography.
    whyItMatters: >-
      Without pricing and conversion data, public market size cannot be translated into realistic revenue capture
      assumptions.
    diligencePath: Request cohort data for pilot conversion, ACV, renewal, and segment mix from management.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: missing-source
    severity: minor
    topic: buyer-budget-owner
    missingEvidence: Public procurement examples showing exact buyer, payer, and budget line for AI-biology platform purchases.
    whyItMatters: Buyer maps are inferential without real contract examples, which weakens GTM and cycle-time assumptions.
    diligencePath: Collect at least three anonymized SOWs or procurement summaries from current customers.
    relatedQuestionRefs:
      - QM013
  - type: stale
    severity: minor
    topic: regional-split
    missingEvidence: >-
      A 2026 public source with BioMap-specific regional revenue or customer distribution between China, Hong Kong and
      ex-China markets.
    whyItMatters: Asia-Pacific growth is a strong thesis, but BioMap’s actual regional exposure is not disclosed.
    diligencePath: Request regional customer count and revenue mix from management or IPO banker materials.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-benchmark
    missingEvidence: >-
      Actual contract values, pilot pricing, renewal pricing and commercial discount structures for BioMap and direct
      peers.
    whyItMatters: >-
      Without contract data, the pricing table can only compare packaging logic, not true monetization power or margin
      structure.
    diligencePath: Interview customers and request anonymized SOWs or commercial term sheets.
    relatedQuestionRefs:
      - QP014
      - QP024
    relatedTableRefs:
