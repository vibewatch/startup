- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak prospectus denominator
    - Revenue / margin / retention materially disappoint
    - Undermines platform premium
    - Pass or reprice sharply
  - - High customer concentration
    - Top accounts dominate economics
    - Makes breadth less meaningful
    - Demand concentration discount
  - - IPO delay without financing clarity
    - Listing window slips and no bridge capital appears
    - Raises funding risk
    - Move to watchlist only
  - - Project-heavy mix
    - Recurring platform revenue lower than expected
    - Narrative becomes hybrid-services story
    - Lower multiple anchor
  - - Data-governance friction
    - Enterprise sales stall on legal/security review
    - Slows expansion and raises cost to sell
    - Cut scenario weights
  - - Premium ask > proof set
    - Valuation jumps ahead of disclosed evidence
    - Compresses expected returns
    - Do not chase
  notes: Kill triggers focus on evidence that would break the strategic-platform underwriting case.
