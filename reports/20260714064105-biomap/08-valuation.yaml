- id: financing-context
  title: Financing Context and Entry Discipline
  body: 'BioMap’s financing context is directionally supportive but still incomplete. Public sources support a $100 million Series A, cumulative funding above $200 million, HKIC strategic backing and an IPO target of several hundred million dollars. Sanofi adds a $10 million upfront and more than $1 billion of milestone optionality; Harbour/MegaStream adds potential upfronts, milestones and royalties. Those facts matter because they show that sophisticated partners and investors already assign strategic value to the platform. They do not, however, solve the most important late-stage underwriting questions: what revenue base the market is paying for, how much of the economics are milestone-like rather than recurring, what the dilution and preference stack look like, and how much capital the company still needs if the listing window weakens. Entry discipline should therefore center on the denominator and the terms, not on headline narrative.'
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
  - CV027
  figureRefs: []
- id: scenarios
  title: Bull, Base and Bear Cases
  body: Our base case assumes BioMap is a real strategic platform, but still a hybrid one whose disclosed economics, once public, land closer to public TechBio and software-tool comparables than to frontier-AI hype marks. On that view a fair-value band of roughly $1.5-2.5 billion is defensible. The bull case assumes the filing reveals strong recurring platform revenue, repeat enterprise usage, manageable concentration and a believable margin path; then a roughly $3-5 billion valuation becomes plausible. The bear case assumes public economics disappoint, the business is more project- and milestone-heavy than hoped, or partner concentration is too high; then a roughly $0.7-1.2 billion valuation or a delayed financing path becomes plausible. The dispersion is wide because BioMap’s quality signals are real, but their financial translation is still mostly hidden.
  claimRefs:
  - CV015
  - CV016
  - CV017
  - CV018
  - CV035
  - CV036
  - CV037
  tableRefs:
  - TV003
  figureRefs:
  - FV003
- id: comparables
  title: Comparable Set
  body: Public comparables give a useful but imperfect anchor. As of July 2026 Recursion, Absci, Schrödinger and Certara all trade in a band around roughly $1.0-1.75 billion of market value, but their revenue bases and implied multiples vary wildly. Recursion’s roughly $1.75 billion value on about $65.73 million of revenue implies about 26.6x sales; Absci’s roughly $1.72 billion value on about $2.8 million implies extreme option-value pricing; Schrödinger’s roughly $1.22 billion value on about $250 million and ~4.79x sales is a more balanced software-science reference; and Certara’s roughly $1.05 billion value on about $410 million and ~2.54x sales is a lower-multiple software-services anchor. These comparables do not produce a single answer for BioMap, but they do show that the market pays very differently for transparency, revenue quality and platform optionality. Without a public BioMap denominator, using a precise headline multiple would be false precision.
  claimRefs:
  - CV019
  - CV020
