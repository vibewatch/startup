- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / path
  rows:
  - - Audited revenue / ARR
    - No reconciled public denominator
    - Sets the multiple base
    - Company / filing
  - - Revenue mix
    - Platform vs services vs milestones unknown
    - Determines durability and quality
    - Company / finance
  - - Gross margin path
    - No public margin disclosure
    - Separates software-like economics from hybrid economics
    - Company / finance
  - - Customer concentration
    - Top-customer mix undisclosed
    - Key downside driver
    - Company / RevOps
  - - Burn and runway
    - No public cash-flow visibility
    - Determines financing risk
    - Company / finance
  - - Preference / dilution stack
    - No public term detail
    - Changes return outcomes materially
    - Company / legal
  - - Renewal and retention
    - No NRR / churn data
    - Tests customer durability
    - Company / sales
  notes: These are the gating diligence items before converting track into a premium-priced investment view.
