      - number: '7.2'
        title: Operational, Technical and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              BioMap’s operating model is far more complex than that of a pure software company. The public stack
              combines foundation models, a live AIGP surface, multi-cloud deployment, high-throughput experimentation,
              a Suzhou lab, hardware-linked workflows and partner-specific integrations. That complexity is part of the
              moat claim, but it is also a concentration of failure modes. The Suzhou laboratory and dry-wet feedback
              loop are clearly central to product delivery; if throughput, reproducibility, data quality or lab
              operations slip, value can erode quickly. Likewise, the absence of a public status page or incident
              archive means outside observers have little direct evidence on reliability. On the technical side, public
              benchmarks such as xTrimoPGLM and PFMBench show real scientific capability, but they do not solve the
              translation problem from benchmark leadership to drug-development outcomes or buyer ROI. Finally, partner
              dependencies are structural rather than optional: Harbour contributes datasets and development capability,
              Sanofi anchors flagship proof, and Optoseeker-type integrations tie the stack to third-party
              instrumentation and workflow interoperability. The more BioMap wins on deep workflow integration, the more
              a failure by any one dependency can ripple through science, delivery timing and customer confidence rather
              than staying isolated to one software module.
