chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform and operating footprint
        blocks:
          - type: paragraph
            body: >-
              BioMap presents itself as a life-sciences AI infrastructure company rather than a single-asset drug
              developer. Public company-controlled material describes BioMap as a global pioneer in AI foundation models
              for life sciences and positions BioMap OS as a dry-wet closed-loop discovery system that combines data
              insight, predictive design, experimental control, and model training. The same official materials list a
              four-city footprint spanning Beijing, Suzhou, Hong Kong, and Silicon Valley, while outside profiles
              describe the company as Beijing-based and Chinese. One important inconsistency remains: HKSTP described
              BioMap as “headquartered in the US” in June 2024, while Tracxn and Chinese reporting frame it as
              Beijing-based. The safest conclusion is that BioMap runs a genuinely cross-border operating structure with
              China-centered roots and Hong Kong / US expansion, but public sources do not cleanly resolve the
              legal-topco versus operating-headquarters question.
