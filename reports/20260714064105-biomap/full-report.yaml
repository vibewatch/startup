      - number: '2.5'
        title: Judgment and remaining market gaps
        blocks:
          - type: paragraph
            body: >-
              The market clearly clears the “big enough” hurdle. Even the narrowest AI-discovery lens suggests a
              multi-billion-dollar category with rapid growth, while the broader discovery-stack lens points to much
              larger spend pools that AI-native systems can influence over time. The harder question is not TAM but
              capture. BioMap must convert scientific credibility and cross-border policy support into repeatable
              budgets inside pharma and adjacent biology customers. Public sources still do not isolate BioMap’s true
              SAM by buyer, geography, or modality, and they do not disclose contract sizes, renewal behavior, or what
              share of current users are pilot versus scaled production. As a result, this chapter supports a positive
              market view, but not precise penetration assumptions without customer-level evidence.
