      - number: '8.6'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              The strongest plausible exit path is still the planned HKEX listing, with strategic acquisition a
              secondary option if BioMap’s platform becomes indispensable to a larger biopharma or techbio actor. But
              both paths depend on evidence quality improving quickly. The principal thesis-break triggers are simple:
              the filing fails to show recurring revenue quality; concentration is high; margin and burn are
              unattractive; or the valuation ask is materially above what the proof set can support. The
              highest-priority diligence asks are equally clear: audited revenue, revenue mix, gross margin,
              concentration, runway, preference structure and customer renewal evidence. Until those are answered, the
              right IC-ready posture is track with disciplined preparation, not pre-committed enthusiasm.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV039
              - CV040
