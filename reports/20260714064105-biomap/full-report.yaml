companyProfile:
  summary: >-
    BioMap is a Chinese AI-biotech company founded in 2020 and publicly led by Robin Li as founder- chairman and Wei Liu
    as co-founder and CEO. The company positions BioMap OS and the xTrimo model family as a dry-wet closed-loop
    discovery operating system for protein biology, biologics, precision medicine, synthetic biology and frontier
    life-science research. Public evidence points to strategic backing from HKIC, a flagship Sanofi collaboration, broad
    institutional reach, and a confidential Hong Kong IPO filing, but core financial disclosure remains limited.
