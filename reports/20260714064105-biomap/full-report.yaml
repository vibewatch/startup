      - number: '8.3'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              BioMap’s financing context is directionally supportive but still incomplete. Public sources support a $100
              million Series A, cumulative funding above $200 million, HKIC strategic backing and an IPO target of
              several hundred million dollars. Sanofi adds a $10 million upfront and more than $1 billion of milestone
              optionality; Harbour/MegaStream adds potential upfronts, milestones and royalties. Those facts matter
              because they show that sophisticated partners and investors already assign strategic value to the
              platform. They do not, however, solve the most important late-stage underwriting questions: what revenue
              base the market is paying for, how much of the economics are milestone-like rather than recurring, what
              the dilution and preference stack look like, and how much capital the company still needs if the listing
              window weakens. Entry discipline should therefore center on the denominator and the terms, not on headline
              narrative.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV027
      - number: '8.4'
        title: Bull, Base and Bear Cases
        blocks:
          - type: paragraph
            body: >-
              Our base case assumes BioMap is a real strategic platform, but still a hybrid one whose disclosed
              economics, once public, land closer to public TechBio and software-tool comparables than to frontier-AI
              hype marks. On that view a fair-value band of roughly $1.5-2.5 billion is defensible. The bull case
              assumes the filing reveals strong recurring platform revenue, repeat enterprise usage, manageable
              concentration and a believable margin path; then a roughly $3-5 billion valuation becomes plausible. The
              bear case assumes public economics disappoint, the business is more project- and milestone-heavy than
              hoped, or partner concentration is too high; then a roughly $0.7-1.2 billion valuation or a delayed
              financing path becomes plausible. The dispersion is wide because BioMap’s quality signals are real, but
              their financial translation is still mostly hidden.
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV035
              - CV036
              - CV037
          - type: table
            tableRef: TV003
