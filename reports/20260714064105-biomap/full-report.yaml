  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What BioMap Delivers
        blocks:
          - type: paragraph
            body: >-
              BioMap does not present as a single-purpose drug-design API or a single internal pipeline. Its public
              materials describe BioMap OS as a dry-wet closed-loop discovery system that can be delivered as model,
              software or full system, with nearly 100 combinable modules and both cloud and localized deployment
              options. The product narrative is organized around four vertical systems: antibody and innovative
              proteins, innovative therapy and precision medicine, synthetic biology, and frontier research. That
              framing matters because it clarifies that BioMap’s commercial offer is workflow-centric. The platform is
              meant to help customers move from data interpretation to parameter optimization, de novo design and
              experimental feedback, rather than simply run one prediction task. The product family also includes the
              xTrimo foundation-model line, which is the engine underneath BioMap OS. Public evidence supports that
              BioMap is selling an operating layer for life-science R&D, with models, orchestration and services bundled
              together, rather than a narrow point tool.
