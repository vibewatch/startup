              - CV019
              - CV035
              - CV036
              - CV037
      - number: '8.5'
        title: Comparable Set
        blocks:
          - type: paragraph
            body: >-
              Public comparables give a useful but imperfect anchor. As of July 2026 Recursion, Absci, Schrödinger and
              Certara all trade in a band around roughly $1.0-1.75 billion of market value, but their revenue bases and
              implied multiples vary wildly. Recursion’s roughly $1.75 billion value on about $65.73 million of revenue
              implies about 26.6x sales; Absci’s roughly $1.72 billion value on about $2.8 million implies extreme
              option-value pricing; Schrödinger’s roughly $1.22 billion value on about $250 million and ~4.79x sales is
              a more balanced software-science reference; and Certara’s roughly $1.05 billion value on about $410
              million and ~2.54x sales is a lower-multiple software-services anchor. These comparables do not produce a
              single answer for BioMap, but they do show that the market pays very differently for transparency, revenue
              quality and platform optionality. Without a public BioMap denominator, using a precise headline multiple
              would be false precision.
            claimRefs:
              - CV019
              - CV020
              - CV021
