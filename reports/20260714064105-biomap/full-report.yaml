            body: >-
              The cost base is likely heavier than the label “AI platform” suggests. BioMap’s 2021 Series A was reported
              at about $100 million and was explicitly earmarked for R&D and talent; VCBeat also noted that the company
              was building its own laboratory. Later disclosures add more operating commitments: a Hong Kong InnoHub,
              the BioX accelerator for 50 projects over five years, Suzhou high-throughput experimental deployment, and
              MegaStream’s AI-native dry-wet infrastructure ambitions. These are strategically sensible, but they are
              not pure-software economics. They imply spending on model training, data generation, automation, wet-lab
