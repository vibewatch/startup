  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis is that BioMap is building a rare strategic asset at the intersection of AI infrastructure
              and real-world biology execution. It combines foundation-model depth, a dry-wet discovery operating
              system, strategic Hong Kong backing, broad institutional reach and blue-chip partner proof from Sanofi and
              Harbour. If the coming filing shows that these signals translate into recurring enterprise revenue, decent
              gross margins and repeat customer expansion, BioMap could deserve a premium to mature software-services
              comps because public markets rarely get pure-play AI-biology platform exposure with this breadth. The
              anti-thesis is that BioMap is still easier to admire than to underwrite. Public evidence remains heavy on
              milestones, users, projects and partner narratives, but light on recognized revenue, retention, customer
              concentration and margin quality. In that reading, BioMap may be a milestone-heavy, services-heavy,
              capital-intensive hybrid whose strategic narrative is ahead of public proof, making aggressive valuation
              marks vulnerable to disappointment once prospectus economics arrive.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV033
              - CV034
          - type: table
            tableRef: TV002
            claimRefs:
