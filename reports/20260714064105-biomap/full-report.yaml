  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal and Governance Risk
        blocks:
          - type: paragraph
            body: >-
              BioMap’s regulatory and legal risk is rooted in the fact that it is not just publishing papers; it is
              handling customer relationships, operating across Beijing, Suzhou and Hong Kong, and explicitly using Hong
              Kong’s data and IP posture as part of its multinational trust narrative. The PDPO makes clear that Hong
              Kong is a serious privacy regime, while BioMap’s own policy text shows the company collects identifiable
              personal and organizational data through web forms and email workflows. That creates a real compliance
              burden even before one gets to more sensitive scientific data-sharing questions. The bigger governance
              risk is disclosure. BioMap’s confidential Hong Kong IPO filing means investors still do not have
              prospectus-grade detail on structure, controls, proceeds or concentration. Public media and database
              accounts of funding history are directionally aligned but not perfectly reconciled, and AInvest adds an
              explicitly adverse frame around governance and valuation risk. None of this proves misconduct; it does
              mean the legal and governance surface is still thinner than the scale of the company’s ambition would
              ideally warrant. For a company selling trust to multinational scientific buyers, thin disclosure is itself
              an operating risk because it slows diligence, makes edge-case legal questions harder to close, and leaves
              outsiders relying on narrative fragments instead of complete control evidence.
            claimRefs:
