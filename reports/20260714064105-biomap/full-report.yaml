      - number: '4.4'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              BioMap’s financial profile is stronger than a pre-revenue AI-biotech concept, but weaker than what
              public-market underwriting would normally demand. The company has real commercialization signals: partner
              willingness to pay, contract count, project volume, a broad institutional user base and continuing
              platform-to-pipeline expansion. Yet those signals stop short of a recognizable revenue-quality picture.
              Investors still lack audited revenue, stream-level mix, concentration, gross margin, cash burn and runway.
              That means the central question is not whether BioMap has business activity; it clearly does. The question
              is whether the economics are mostly recurring platform revenue, milestone-heavy partnership revenue,
              labor-intensive discovery work, or some blend that will remain capital-hungry for years. The right
              underwriting stance today is to treat BioMap as a hybrid platform, services and asset-creation company
              with promising demand proof but incomplete financial transparency. Any valuation case should be
              conditioned on reconciling backlog-to-revenue conversion, cost-to-deliver by workflow, and the capital
              needs implied by the Hong Kong listing process.
