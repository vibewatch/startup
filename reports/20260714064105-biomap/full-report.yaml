              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
      - number: '8.2'
        title: Recommendation, Confidence and Stance
        blocks:
          - type: paragraph
            body: >-
              We rate BioMap track with medium confidence, a high risk rating and a stretched valuation stance, with an
              overall score of roughly 5.8 out of 10. The company is too strong strategically to dismiss: the science
              stack, partner set and market position make it worth active monitoring. But it is also too opaque
              financially to justify paying a premium on narrative alone. Recommendation quality here is explicitly
              price-sensitive. If the eventual filing or diligence room proves recurring platform revenue, acceptable
              margin structure and repeat customer expansion, the call could move materially upward. If instead it
              reveals project-heavy economics, high concentration or a valuation ask already above what the public proof
              set can defend, the right move would be to stay disciplined. The current evidence supports attention and
              preparation, not aggressive commitment.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
