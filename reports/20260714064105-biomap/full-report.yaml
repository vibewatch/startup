      - number: '1.5'
        title: Judgment, contradictions and remaining diligence holes
        blocks:
          - type: paragraph
            body: >-
              The company-overview evidence base is good enough to establish BioMap as a serious, well-backed late-stage
              AI-biology platform, but not good enough to underwrite valuation or governance with precision. Public
              sources support the existence of meaningful enterprise and institutional usage, a credible leadership
              bench, a marquee Sanofi collaboration, and strong Hong Kong policy support. They do not provide audited
              financial statements, reconciled current valuation, dependable headcount, board composition, or a clean
              legal-entity map across Beijing, Hong Kong and the US. In addition, headquarters language is inconsistent
              and many traction figures are company-claimed. This means later chapters can safely reuse BioMap’s
              identity, product stack, strategic partnerships and IPO trajectory, but should treat capital efficiency,
              customer concentration, and governance structure as open diligence items rather than settled facts.
