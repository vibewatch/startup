      - number: '2.2'
        title: 'Sizing lenses: narrow AI-discovery vs broad discovery stack'
        blocks:
          - type: paragraph
            body: >-
              The narrowest available lens, from Global Market Insights, sizes AI in drug discovery at $3.1 billion in
              2025 and $4.0 billion in 2026, compounding at roughly 30.5 percent to $43.9 billion by 2035. Precedence
              Research frames a similar market and breaks it down by workflow, modality, AI stack, therapeutic area, and
              region, reinforcing the idea that this is already a multi-segment platform market rather than a
              one-product niche. The broader stack lens from MarketsandMarkets is much larger: drug-discovery
              technologies at $30.58 billion in 2025 and $51.51 billion by 2030. That broader lens overstates BioMap’s
              current monetizable market because it includes instruments and reagents, but it does capture the larger
              budget pool that AI-native platforms are trying to displace or orchestrate. For underwriting, BioMap’s
              realistic market lies between those two poles.
