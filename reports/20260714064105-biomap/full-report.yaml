  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacents, substitutes and status quo'
        blocks:
          - type: paragraph
            body: >-
              BioMap’s competitive set is broader than “other AI drug discovery startups.” Direct peers are AI-native
              platform companies trying to compress discovery timelines, build proprietary biology models, and often
              capture pipeline economics: Insilico, Recursion, Absci, Owkin, Valo, insitro, and BenevolentAI fit this
              bucket. Adjacent competitors include discovery-software and simulation vendors such as Schrödinger and
              Certara that may not market themselves as protein-foundation-model companies but already sit inside buyer
              workflows and budgets. The status quo substitute remains internal pharma discovery teams stitched together
              with point tools, CROs/CDMOs, and incumbent service vendors. That matters because BioMap is not fighting
              one rival in one lane; it is competing against a stack of internal build, specialist tools, and integrated
              TechBio platforms. That layered landscape is why BioMap should be judged less on whether one rival has a
              similar homepage claim and more on which rival class can most easily displace a given customer workflow at
              a given buying moment across discovery programs, enterprise budgets, and partnership structures.
