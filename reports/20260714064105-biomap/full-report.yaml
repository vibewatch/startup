  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts
        blocks:
          - type: paragraph
            body: >-
              BioMap should not be valued against total pharma R&D or total biotech software spend. The most relevant
              core category is AI-driven drug-discovery platforms: software, models, curated data, wet-lab integration,
              and related services sold to pharma, biotech, CROs, CDMOs, and research institutions for target
              identification, hit finding, lead optimization, ADMET, translational modeling, and related preclinical
              work. That boundary comes closest to how BioMap describes BioMap OS, AIGP, and its foundation-model stack.
              A broader but still relevant adjacency is the full drug-discovery-technology market, which includes
              instruments, reagents, software, and screening systems. BioMap also stretches beyond classic pharma into
              synthetic biology and green technology, so no single third-party market report captures the company
              perfectly. The cleanest approach is to use multiple lenses and explicitly separate the narrow AI-discovery
              market from the broader enabling-stack market.
            claimRefs:
              - CM001
