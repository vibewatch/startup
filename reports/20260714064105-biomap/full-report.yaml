      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: BioMap is too strategically interesting to ignore
            body: >-
              The combination of flagship partners, foundation-model credibility and broad institutional reach means
              BioMap deserves active monitoring and serious diligence preparation.
            calloutType: strength
            claimRefs:
