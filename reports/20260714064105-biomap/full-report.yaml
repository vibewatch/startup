            body: >-
              Durability is where the public customer record weakens. There is no disclosed NRR, GRR, churn, contract
              term, top-customer concentration or customer-satisfaction pack. That does not mean customer quality is
              poor; it means the external record is not detailed enough to underwrite it tightly. Publicly, durability
              has to be inferred from repeated platform use, platform migration toward AIGP, continued collaboration
              language and the presence of deeper workflow integrations such as Suzhou experimental deployment or
              MegaStream co-creation. Expansion logic is easier to see than retention logic: BioMap can move from
              exploratory use into contracted AIGP access, then into custom workflows, wet-lab services and eventually
              asset-level partnerships. Concentration risk is the mirror image of that opportunity. Because the
              strongest named proofs are a small set of marquee partners, economics may be more concentrated than the
              broad institutional-user numbers imply. Procurement friction is also non-trivial, likely involving pricing
              opacity, data-governance review and integration effort. Another practical issue is referenceability: there
              is still little public evidence showing whether BioMap customers are willing to speak publicly about
              outcomes, implementation cycles or renewal decisions. The customer view is positive on breadth and
              medium-confidence on durability. In other words, BioMap looks commercially relevant enough to merit
              diligence, but not transparent enough yet to support a high-confidence customer-quality underwrite.
