      - number: '1.5'
        title: 判断、矛盾与剩余尽调空白
        blocks:
          - type: paragraph
            body: >-
              公司概览层面的证据足以证明 BioMap 是一家严肃、资金和资源支持较强的后期 AI 生物平台，但还不足以精确支撑估值或治理判断。公开来源支持几件事的存在：有意义的企业和机构使用、可信的管理梯队、标杆
              Sanofi 合作，以及强香港政策支持。它们没有给出经审计财务报表、可调和的当前估值、可靠员工数、董事会构成，或覆盖北京、香港与美国的清晰法律实体图。此外，总部表述不一致，许多牵引力
              数字来自公司口径。因此，后续章节可以稳妥复用 BioMap 的身份、产品栈、战略合作和 IPO 轨迹，但应把资本效率、客户集中度和治理结构视为仍待尽调的问题，而不是既定事实。
