          - type: callout
            title: 但公开证据仍不足以支撑盲目支付溢价
            body: 如果没有经审计收入、利润率、留存和集中度数据，即便战略故事很漂亮，只要入场价预设了过多确定性， 回报也可能很弱。
            calloutType: risk
            claimRefs:
