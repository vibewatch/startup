          - type: paragraph
            body: >-
              我们对 BioMap 的建议是观察，置信度中等，风险评级高，估值立场偏高；总分约 5.8/10。BioMap 的战略价值太强，
              不能轻易忽略：科学技术栈、合作伙伴组合和市场位置都值得持续跟踪、认真准备尽调。但它的财务信息也太不透明， 不能只靠叙事就支付溢价。这里的投资建议明确受价格影响。若最终监管文件或尽调资料室能证明平台收入具备经常性、
              利润率结构可接受、老客户持续扩张，判断可以明显上调。反过来，如果披露出来的是项目制经济、高集中度， 或估值诉求已经高过公开证据集能支撑的水平，正确动作就是守住纪律。现有证据支持关注和准备， 不支持激进承诺。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
          - type: figure
            figureRef: FV004
            claimRefs:
