      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              这个市场的多头逻辑很直接：生物药复杂度上升、R&D 成本更高、开发周期需要压缩、算力和模型架构更好，以及药企对 AI 合作的强需求。IQVIA 还指出，2025 年融资仍处高位，虽然低于 2024 年；AI 赋能
              项目开始呈现更强成功信号。但约束同样重要。市场报告反复点名数据质量、带标签数据有限、专门人才短缺和湿实验验证需求是瓶颈。McKinsey 强调，药企不能照搬消费软件打法来规模化生成式
              AI，因为受监管数据、验证和工作流改造会拖慢采用。对 BioMap 来说，市场规模不是最关键的闸门；从试点走到规模化平台标准，能否证明 ROI 才是。
