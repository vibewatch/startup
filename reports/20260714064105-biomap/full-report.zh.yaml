      - number: '1.4'
        title: 规模信号与产品节奏
        blocks:
          - type: paragraph
            body: >-
              对一家私人 AI 生物技术公司而言，BioMap 的公开规模图景异常强，但数字来自公司和合作伙伴渠道，不是审计报告。HKIC 称，截至 2024 年 6 月，BioMap 已与 200 多名 AIGP
              用户签约；HKSTP 称公司已与 10 多个商业伙伴、200 多家学术机构合作；Yicai 与 Harbour BioMed 后来引用了 800 多家机构用户的支持，Yicai 还称有 30
              多家领先企业。2025 与 2026 年，产品节奏也在加快。官方新闻标题和论文记录了生成式发现系统、RNAGenesis、ProteinReasoner、PFMBench 和 BioLab 等产品或研究的发布 /
              披露；2026 年 6 月 Harbour 发布的信息显示，平台正在被商业化为一家新的 AI 原生 复杂生物药合资企业。含义很清楚：BioMap 不再只是模型构建者；它试图成为生物学的操作系统和孵化新公司的底层。
