  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              多头论点是，BioMap 正在 AI 基础设施与真实世界生物学执行的交汇处，打造一种罕见战略资产。它把基础模型深度、干湿闭环发现操作系统、香港战略支持、广泛机构触达，以及来自 Sanofi 和 Harbour
              的蓝筹伙伴证明结合在一起。如果即将到来的申报文件显示，这些信号能转化为经常性企业收入、体面的毛利率和可重复客户扩张，BioMap 可能理应相对成熟软件服务可比公司享有溢价，因为公开市场很少能买到广度如此高的纯
              AI 生物学平台敞口。反论点是，BioMap 目前仍比“可承销”更容易让人欣赏。公开证据重在里程碑、用户、项目和伙伴叙事，轻在已确认收入、留存、客户集中度和利润率质量。按这种解读，BioMap
              可能是一家里程碑重、服务重、资本密集的混合体，战略叙事跑在公开证明之前；一旦招股书经济性到来，激进估值标记容易失望。
