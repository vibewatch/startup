  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 战略质量与缺失的分母如何共同导向跟踪建议。
    data:
      nodes:
        - id: quality
          label: 战略平台质量
        - id: proof
          label: 合作伙伴 + 用户验证
        - id: opacity
          label: 收入 / 利润率不透明
        - id: risk
          label: 复杂度 + 集中风险
        - id: rec
          label: 跟踪 / 中等信心
      edges:
        - from: quality
          to: rec
        - from: proof
          to: rec
        - from: opacity
          to: rec
        - from: risk
          to: rec
    approximationNotes: 该流程为定性呈现，展示决策逻辑，而非加权评分模型。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV009
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 不同收入与倍数假设下的示意估值结果，单位为十亿美元。
    data:
      items:
        - label: $100M × 10 倍
          value: 1
        - label: $150M × 12 倍
          value: 1.8
        - label: $200M × 10 倍
          value: 2
        - label: $250M × 12 倍
          value: 3
        - label: $300M × 15 倍
          value: 4.5
        - label: $400M × 12 倍
          value: 4.8
    approximationNotes: 敏感性仅作示意，因为 BioMap 尚未公开披露清晰的收入分母；它展示的是投资者估算收入与质量时，价值会多快变化。
    claimRefs:
      - CV025
      - CV026
      - CV035
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于公开证据的 BioMap 宽口径情景区间，单位为十亿美元。
    data:
      items:
        - label: 悲观情景
          low: 0.7
          base: 0.9
          high: 1.2
          unit: $B
        - label: 基准情景
          low: 1.5
          base: 2
          high: 2.5
          unit: $B
        - label: 乐观情景
          low: 3
          base: 4
          high: 5
          unit: $B
        - label: 上市可比公司区间
          low: 1
          base: 1.4
          high: 1.75
          unit: $B
    approximationNotes: 情景区间不是预测；它们是承销判断区间，锚定公开可比公司和 BioMap 特有的战略期权价值。
    claimRefs:
      - CV019
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 围绕当前跟踪判断的主要维度，给出可供投委会使用的评分。
    data:
      items:
        - label: 市场 / 战略相关性
          value: High
          trend: up
        - label: 产品 / 科学验证
          value: High
          trend: up
        - label: 客户持久性验证
          value: Medium
          trend: flat
        - label: 财务透明度
          value: Low
          trend: flat
        - label: 风险画像
          value: High
          trend: flat
        - label: 当前估值支撑
          value: Weak
          trend: flat
    claimRefs:
      - CV001
      - CV007
      - CV019
      - CV031
      - CV039
      - CV040
