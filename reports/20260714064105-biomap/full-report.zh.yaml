            tableRef: TV005
            claimRefs:
              - CV030
              - CV031
              - CV034
              - CV037
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV013
              - CV032
              - CV039
      - number: '8.7'
        title: 展示材料
        blocks:
          - type: callout
            title: BioMap 的战略价值太突出，不能忽略
            body: 旗舰合作伙伴、基础模型可信度和广泛机构触达叠加在一起，意味着 BioMap 值得持续跟踪，并认真准备尽调。
            calloutType: strength
            claimRefs:
              - CV001
