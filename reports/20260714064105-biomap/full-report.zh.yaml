      - number: '5.4'
        title: 信任、安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              BioMap 公开暴露得最清楚的信任证据偏信息安全。隐私政策片段称，BioMap 持有 ISO/IEC 27001:2022 认证，传输中的数据用 TLS 1.2 加密，静态数据用 AES-256
              加密，并每年开展第三方渗透测试。同一政策还描述了网站可能通过表单和邮件工作流收集的个人信息类别。对共享敏感生物数据的企业买方来说，这些披露有意义，但不能回答所有尽调问题。审阅来源中没有公开状态页、可用性
              档案、事故账本、临床级运营标准，或可与 GxP 要求高的场景买方要求相当的受监管实验室认证组合。因此，BioMap 的信任姿态在信息安全层看起来可信，但在受监管运营层仍不完整。BioMap
              的差异化叙事依赖敏感数据、多云基础设施和物理实验，所以缺失的运营信任细节是真正的尽调缺口，而不是文档小瑕疵。
