  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与计入口径
        blocks:
          - type: paragraph
            body: >-
              BioMap 不应按整体药企 R&D 或整体生物技术软件支出来估值。最相关的核心类别是 AI 驱动药物发现平台：卖给药企、生物技术公司、CRO、CDMO
              和科研机构的软件、模型、整理后的数据、湿实验整合和配套服务，用于靶点识别、命中发现、先导优化、ADMET、转化建模以及临床前配套工作。这个边界最贴近 BioMap 对 BioMap OS、AIGP
              和基础模型栈的描述。更宽但仍相关的邻近市场是完整药物发现技术市场，涵盖仪器、试剂、软件和筛选系统。BioMap
              还延伸到传统药企之外的合成生物学和绿色技术，因此没有单一第三方市场报告能完美覆盖公司。最干净的方法是使用多重视角，并明确区分较窄的 AI 发现市场与更宽的赋能技术栈市场。
