      - number: '3.3'
        title: 切换成本、多供应商并用与分发权
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本可能低于企业基础设施软件。买方常常能并行试用多个供应商，许多平台也把自己呈现为靶点识别、优化、仿真或模型辅助工作流步骤中的模块化层，而不是完整排他的操作系统。只有当 BioMap
              嵌入专有湿实验数据循环、微调模型或共享经济合作时，才会形成真正锁定。因此，分发权掌握在已经占住预算线和信任关系的公司手里：大型药企内部平台、软件既有玩家和规模化服务商。这并不意味着 BioMap
              没有竞争力，但确实意味着单靠科学性能通常不够。采用必须沉淀成专有客户数据、工作流集成和 ROI 证明，护城河说法才会变硬。实际情况是，一个客户既用 Schrödinger 做分子建模，又用 Certara
              做开发分析，并拥有内部生物药团队，也仍然可以试用 BioMap，而无需完全标准化到 BioMap
              上。因此，公司需要证明，至少部分客户正在从评估走向更深工作流，在这些工作流里，数据尾迹、实验设计和多目标优化越来越依赖 BioMap 特定基础设施。
