      - number: '2.5'
        title: 判断与剩余市场缺口
        blocks:
          - type: paragraph
            body: >-
              市场显然跨过了“足够大”的门槛。即使用最窄的 AI 发现视角，也能看到一个快速增长的数十亿美元级品类；更宽的发现技术栈视角则指向 AI 原生 系统长期可以影响的更大支出池。更难的问题不是
              TAM，而是捕获能力。BioMap 必须把科学可信度和跨境政策支持转化为药企及邻近生物学客户内部可重复的预算。公开来源仍未按买方、地区或模态拆出 BioMap 的真实
              SAM，也没有披露合同规模、续约行为，或当前用户中试点与规模化生产的占比。因此，本章支持积极的市场观点，但在缺少客户级证据前，不能支撑精确渗透率假设。
