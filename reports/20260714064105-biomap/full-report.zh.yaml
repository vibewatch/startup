  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与采用广度
        blocks:
          - type: paragraph
            body: >-
              对一家私人 AI 生物技术公司而言，BioMap 的公开客户基础异常宽，但这种广度是分层披露的，不是一个干净 KPI。HKIC 和 HKSTP 描述了 200 多名签约 AIGP
              用户，覆盖国际药企、CDMO、创新药开发商、合成生物学公司、绿色科技企业和科研机构。Yicai 与 PR Newswire 又把视角拉宽，引用 800 多家机构用户、30 多家领先企业和 60
              多个已验证项目。合在一起，这些证据支持一个真实买方 / 用户图谱，横跨多个垂直领域和地理区域，而不是单一旗舰药企关系。它也说明，BioMap 当前触达了直接付费方和战略用户：企业 R&D
              团队、研究组织和生态项目，但它们未必都会转化成同等收入。因此，核心客户问题不是 BioMap
              有没有触达；它显然有。问题是其中有多少处在持久付费生产关系里，多少只是探索性、低强度或由伙伴中介的使用。另一个细微点是，公开指标混合了非常不同的账户单位，所以任何投资者若把 800 家机构解读成 800
              个经济等价账户，都会实质性高估变现质量。因此，广度叙事首先应被视为分层和管线强度信号，其次才是收入质量信号。
