      - number: '4.4'
        title: 财务判断
        blocks:
          - type: paragraph
            body: >-
              BioMap 的财务画像强于一个尚未产生收入的 AI
              生物技术概念，但弱于公开市场承销通常要求的水平。公司有真实商业化信号：合作伙伴愿意付费、合同数量、项目量、广泛机构用户基础，以及从平台走向管线的持续扩张。但这些信号还未形成可辨识的收入质量图景。投资者仍缺经审计收入、按收入流拆分的组合、集中度、毛利率、现金消耗和现金跑道。因此，核心问题不是
              BioMap 有没有业务活动；它显然有。问题是其经济性主要来自经常性平台收入、里程碑较重的合作收入、劳动密集型发现工作，还是某种未来多年仍会渴求资本的混合体。当前合理承销姿态，是把 BioMap
              视为平台、服务和资产创造混合公司：需求证明有前景，但财务透明度不足。任何估值论证都应以三件事为条件：积压订单转收入的转化、按工作流测算的交付成本，以及香港上市进程隐含的资本需求。
