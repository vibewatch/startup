  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接对手、邻近玩家、替代方案与现状
        blocks:
          - type: paragraph
            body: >-
              BioMap 的竞争集合比“其他 AI 药物发现创业公司”更宽。直接对手是那些试图压缩发现周期、构建专有生物学模型，并常常捕获管线经济的 AI
              原生平台公司：Insilico、Recursion、Absci、Owkin、Valo、insitro 和 BenevolentAI 都属于这一桶。邻近竞争者包括 Schrödinger、Certara
              等发现软件和仿真供应商；它们未必把自己包装成蛋白基础模型公司，但已经嵌在买方工作流和预算里。现状替代方案仍是药企内部发现团队，把点状工具、CRO / CDMO 和既有服务商拼在一起。这一点很关键，因为
              BioMap 不是在单一赛道对抗一个敌人；它面对的是内部自建、专用工具和一体化 TechBio 平台叠出来的一整套栈。也正因这种多层格局，评估 BioMap
              时，不应只看某个对手首页是否写了类似主张，而要看在具体购买时点、具体发现项目、企业预算和合作结构下，哪一类对手最容易替换客户工作流。
