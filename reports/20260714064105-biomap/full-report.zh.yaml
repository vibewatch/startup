  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高风险集中在运营复杂、公开披露有限的交汇处。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 融资 / IPO 披露
          values:
            - 高
            - 高
            - 低-中
            - 高
        - label: 合作伙伴集中
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 湿实验室运营可靠性
          values:
            - 中
            - 高
