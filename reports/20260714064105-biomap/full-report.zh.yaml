companyProfile:
  summary: >-
    BioMap 是一家中国 AI 生物技术公司，2020 年成立；公开资料显示 Robin Li 任创始人兼董事长，Wei Liu 任联合创始人兼 CEO。公司把 BioMap OS 和 xTrimo
    模型家族定位成干湿闭环发现操作系统，覆盖蛋白生物学、生物药、精准医学、合成生物学和前沿生命科学研究。公开证据显示，BioMap 获得 HKIC 战略支持，拿到 Sanofi 旗舰合作，机构触达面广，并已保密递表赴港
    IPO，但核心财务披露仍然有限。
