  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              BioMap 的监管和法律风险，根源在于它不只是发表论文；公司还在处理客户关系，横跨北京、苏州和香港运营，并明确把香港的数据与 IP 姿态用作跨国信任叙事的一部分。PDPO
              表明香港是严肃隐私监管体系；BioMap 自身政策文本显示，公司会通过网页表单和邮件工作流收集可识别个人与组织数据。即使还没进入更敏感的科学数据共享问题，这已经带来真实合规负担。更大的治理风险是披露。BioMap
              保密递表赴港 IPO，意味着投资者仍拿不到招股书级别的结构、控制、募资用途或集中度细节。公开媒体和数据库对融资历史的描述方向一致，但并未完全调和；AInvest
              还围绕治理和估值风险给出明确负面框架。这些都不能证明存在不当行为；但确实说明，法律和治理表面比公司雄心规模理应匹配的厚度更薄。对一家向跨国科学买方出售信任的公司而言，薄披露本身就是运营风险，因为它拖慢尽调，让边缘法律问题更难关闭，也让外部人只能依赖叙事碎片，而不是完整控制证据。
