  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 关键依赖包括政策支持、旗舰合作伙伴、算力以及实验室执行。
    data:
      nodes:
        - id: hk
          label: 香港政策支持
        - id: sanofi
          label: Sanofi 旗舰验证
        - id: harbour
          label: Harbour / MegaStream 数据 + 开发
        - id: opto
          label: Optoseeker 硬件工作流
        - id: cloud
          label: 算力 / 多云
        - id: lab
          label: 苏州高通量实验室
        - id: biomap
          label: BioMap 平台产出
      edges:
        - from: hk
          to: biomap
