            - 高
        - label: 隐私 / 数据治理
          values:
            - 中
            - 高
            - 中
            - 中-高
        - label: 路线图焦点稀释
          values:
            - 中
            - 中
            - 低-中
            - 中
        - label: 模型到结果转化
          values:
            - 高
            - 高
            - 低-中
            - 高
