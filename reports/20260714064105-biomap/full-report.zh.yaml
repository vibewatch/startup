  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: BioMap 交付什么
        blocks:
          - type: paragraph
            body: >-
              BioMap 并不像单一用途药物设计 API，也不是单一内部管线。公开材料把 BioMap OS 描述为干湿闭环发现系统，可作为模型、软件或完整系统交付，拥有近 100
              个可组合模块，并支持云端和本地化部署。产品叙事围绕四个垂直系统展开：抗体与创新蛋白、创新疗法与精准医学、合成生物学和前沿研究。这个框架很关键，因为它说明 BioMap
              的商业供给以工作流为中心。平台要帮助客户从数据解读走到参数优化、de novo 设计和实验反馈，而不是只跑一个预测任务。产品家族还包括 xTrimo 基础模型线，这是 BioMap OS
              底层引擎。公开证据支持一个判断：BioMap 卖的是生命科学 R&D 的操作层，把模型、编排和服务捆在一起，而不是一个窄口径点状工具。
