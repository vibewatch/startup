              BioMap 的公开收入模型只能从交易结构和客户数量披露中看出轮廓，而不是来自清晰价目表或收入科目。最明确披露的收入流是合作伙伴经济：Sanofi 合作包含 $10 million 首付款和超过 $1
              billion 的潜在里程碑；MegaStream 则带来首付款、成功里程碑和特许权使用费分享的可能。HKIC 和 HKSTP 还描述了 200 多名签约 AIGP 用户，支持 BioMap
              存在平台合同收入，而不是纯粹投机性使用。Yicai 提到的 60 多个项目和 800 多家机构说明，BioMap 也通过项目交付和企业赋能变现。同时，与 Kexing、Optoseeker
              的合作公告显示，这是一种定制化、重集成的模式，BioMap
              贡献模型、编排能力和实验工作流支持。这种混合结构在财务上很重要：它比纯研究叙事更能证明客户愿意付费，但也意味着收入质量取决于合同组合、里程碑时点和服务强度，而这些目前都没有公开拆分。
