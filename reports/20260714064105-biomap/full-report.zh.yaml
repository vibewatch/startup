      - number: '1.2'
        title: 创始人与管理梯队
        blocks:
          - type: paragraph
            body: >-
              公司由 Baidu 创始人 Robin Li 和 Baidu Ventures 老将 Wei Liu 发起，Liu 负责日常经营。BioMap 目前公开的管理梯队不止两位创始人，这直接影响执行风险：网站资料列出
              Xiaoming Zhang 负责 AI R&D，Xiaoyue Sun 负责运营并担任总法律顾问，Ziyao Xu 负责解决方案、战略和创新，Patrick Zhang 负责全球企业发展，Stan Z. Li
              担任 AI 大模型首席科学家。这是一支技术可信的队伍，覆盖大模型工程、计算生物学、法务 / 运营和医药商务拓展；但叙事和战略控制也集中在 Robin Li 与 Wei Liu
              身上。公开可得来源仍未披露董事会构成和正式治理权利，因此创始人影响力清晰可见，机构治理仍不透明。
