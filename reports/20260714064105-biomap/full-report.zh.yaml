      - number: '1.3'
        title: 资本形成、战略伙伴与香港扩张
        blocks:
          - type: paragraph
            body: >-
              BioMap 的公开融资时间线从 2021 年 7 月宣布的 $100 million Series A 开始；该轮由 GGV Capital 领投，Baidu、Legend Capital、BlueRun
              Ventures、Zhenzhi Capital、Xiang He Capital 参投，Robin Li 继续参与。此后，公开记录从经典风险融资转向战略平台合作。2023 年 10 月，Sanofi 联盟给
              BioMap 带来一个标杆药企背书点：$10 million 首付款，以及超过 $1 billion 的潜在里程碑。2024 年 6 月，公司通过 HKIC 获得香港主权资本支持，并借此推出 BioMap
              InnoHub 和 BioX 加速器。HKSTP 与 HKIC 都把香港建设描述为不止开办公室：它被设计成面向跨国客户的信任、人才、生态和商业化楔子。到 2026 年 3 月，多家媒体报道公司已保密递表赴港
              IPO，承销支持来自 CICC、Morgan Stanley 和 UBS。
