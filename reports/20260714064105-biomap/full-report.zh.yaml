  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: BioMap 的主要风险如何层层传导到收入质量、利润率、融资与估值。
    data:
      nodes:
        - id: privacy
          label: 数据治理风险
        - id: ops
          label: 实验室 / 运营风险
        - id: partner
          label: 合作伙伴集中
        - id: finance
          label: 融资 / IPO 风险
        - id: customer
          label: 客户持久性
        - id: margin
          label: 利润率 / 资本强度
        - id: valuation
          label: 估值 / 建议
      edges:
        - from: privacy
          to: customer
        - from: ops
          to: customer
        - from: partner
          to: customer
        - from: customer
          to: finance
        - from: ops
          to: margin
        - from: finance
          to: valuation
        - from: margin
          to: valuation
        - from: customer
