      - number: '2.2'
        title: 测算视角：窄口径 AI 发现与广口径发现技术栈
        blocks:
          - type: paragraph
            body: >-
              Global Market Insights 给出的最窄可用视角，把药物发现 AI 市场规模估为 2025 年 $3.1 billion、2026 年 $4.0 billion，并以约 30.5% 的复合增速到
              2035 年达到 $43.9 billion。Precedence Research 描述了类似市场，并按工作流、模态、AI
              栈、治疗领域和区域拆分，进一步说明这已经是一个多分部平台市场，而不是单产品小众赛道。MarketsandMarkets 给出的更宽技术栈视角大得多：药物发现技术市场在 2025 年为 $30.58
              billion，到 2030 年达到 $51.51 billion。这个宽口径高估了 BioMap 当前可变现市场，因为它包含仪器和试剂；但它确实捕捉到 AI 原生
              平台试图替代或编排的更大预算池。承销时，BioMap 的现实市场落在这两个端点之间。
