      - number: '2.3'
        title: 买方图谱与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开买方证据显示，BioMap 进入的是科研预算，而不是通用 IT 预算。HKIC 称，当前 AIGP 用户包括国际药企、CDMO、创新药开发商、合成生物学公司、绿色科技企业和科研机构。Harbour
              BioMed 把 BioMap 描述为服务抗体 / 蛋白、精准医学、合成生物学和前沿研究用户的平台。可比公司指向类似需求中心：Recursion 通过自有和合作管线变现，Absci
              通过内部和合作的生成式生物学项目变现，Schrödinger 通过发现软件变现，Certara 通过软件加监管与开发服务变现，Insilico 则同时通过平台软件和管线授权变现。实际采用路径通常从围绕靶点识别
              或先导优化的试点开始，扩展到工作流集成和数据积累，最后才进入更深的共同开发、收入分享或合资孵化。
