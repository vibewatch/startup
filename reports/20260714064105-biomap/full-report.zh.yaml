              - CV025
              - CV026
              - CV035
              - CV036
      - number: '8.6'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              最强的可行退出路径仍是计划中的 HKEX 上市；如果 BioMap 平台对更大的生物制药或 TechBio 参与者变得不可替代，
              战略收购是次一级选项。但两条路都要求证据质量快速提高。打破投资逻辑的触发条件很简单： 监管文件无法证明收入经常性；集中度高；利润率和烧钱速度不好看；或估值诉求显著高于证据集能支撑的水平。
              最高优先级的尽调问题同样清楚：经审计收入、收入结构、毛利率、集中度、现金跑道、优先权结构和客户续约证据。 在这些问题得到回答前，可提交 IC 的正确姿态是观察并有纪律地准备，而不是提前押注式兴奋。
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV039
              - CV040
