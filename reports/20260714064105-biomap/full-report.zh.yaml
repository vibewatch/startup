chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台与运营足迹
        blocks:
          - type: paragraph
            body: >-
              BioMap 对外呈现的是生命科学 AI 基础设施公司，而不是单一资产药物开发商。公司自有材料称 BioMap 是生命科学 AI 基础模型的全球先行者，并把 BioMap OS
              定位成干湿闭环发现系统，把数据洞察、预测设计、实验控制和模型训练串起来。同一批官方材料列出北京、苏州、香港和硅谷四地布局；外部画像则称公司总部在北京、属于中国公司。一个重要不一致仍未解决：HKSTP 2024 年
              6 月称 BioMap “总部在美国”，但 Tracxn 和中文报道都把它放在北京。最稳妥的结论是，BioMap 确实在运营上跨境，根基在中国，并向香港 /
              美国扩张；但公开来源没有把法律顶层公司与运营总部的问题交代清楚。
