              - CV036
              - CV037
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV019
              - CV035
              - CV036
              - CV037
      - number: '8.5'
        title: 可比公司组
        blocks:
          - type: paragraph
            body: >-
              上市可比公司能提供有用但不完美的估值锚。截至 2026 年 7 月，Recursion、Absci、Schrödinger 和 Certara 的市值大致都在 $1.0-1.75 billion
              区间，但收入基数和隐含倍数差异很大。Recursion 约 $1.75 billion 的估值对应约 $65.73 million 收入，隐含约 26.6x 销售额；Absci 约 $1.72 billion
              的估值对应约 $2.8 million 收入，体现极端期权价值定价；Schrödinger 约 $1.22 billion 的估值、 约 $250 million 收入和 ~4.79x
              销售额，是更均衡的软件科学参照；Certara 约 $1.05 billion 的估值、 约 $410 million 收入和 ~2.54x 销售额，则是低倍数软件服务锚。这组可比公司不能给 BioMap
              一个唯一答案， 但能说明市场对透明度、收入质量和平台可选性的定价差异很大。在 BioMap 没有公开分母之前， 使用精确的表观倍数只是伪精确。
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV028
          - type: table
