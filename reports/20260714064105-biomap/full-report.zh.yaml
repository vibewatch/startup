        blocks:
          - type: paragraph
            body: >-
              持续性是公开客户记录变弱的地方。公司没有披露 NRR、GRR、流失率、合同期限、头部客户集中度或客户满意度包。这不意味着客户质量差；它意味着外部记录不够细，无法紧密承销。公开层面，持续性只能从反复平台使用、向
              AIGP 的平台迁移、持续合作措辞，以及苏州实验部署或 MegaStream 共创这类更深工作流集成来推断。扩张逻辑比留存逻辑更容易看见：BioMap 可从探索性使用走向签约 AIGP
              访问，再进入定制工作流、湿实验服务，最终进入资产级合作。集中度风险正是这个机会的镜像。由于最强具名证明集中在少数标杆伙伴，经济性可能比广泛机构用户数字暗示的更集中。采购摩擦也不小，可能涉及定价不透明、数据治理审查和集成投入。另一个实际问题是可被引用程度：公开证据仍很少显示
