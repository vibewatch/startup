      - number: '8.3'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              BioMap 的融资背景给投资逻辑提供了方向性支撑，但信息仍不完整。公开资料能支撑 $100 million Series A、累计融资超过 $200 million、HKIC 战略背书，以及数亿美元 IPO
              目标。Sanofi 带来 $10 million 首付款和超过 $1 billion 的里程碑选择权；Harbour/MegaStream 还可能带来首付款、里程碑和版税。这些事实重要，
              因为它们说明成熟伙伴和投资人已经给平台赋予战略价值。但它们没有回答后期承销最关键的问题：市场究竟在为多大收入基数付钱， 经济条款中有多少更像里程碑而不是经常性收入，稀释和优先股堆叠长什么样，以及如果上市窗口转弱，
              公司还需要多少资本。因此，入场纪律应围绕分母和条款展开，而不是围绕标题叙事。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV027
      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              我们的基准情景假设 BioMap 确实是有战略价值的平台，但仍是混合型平台；一旦披露经济数据， 它更可能落在上市 TechBio 和软件工具可比公司的区间，而不是前沿 AI 热度估值。按这个判断， 约
              $1.5-2.5 billion 的公允价值区间站得住。乐观情景假设监管文件显示平台收入经常性强、 企业客户重复使用、集中度可控、利润率路径可信；届时约 $3-5 billion 的估值就有可能成立。
              悲观情景假设公开经济数据低于预期，业务比想象中更偏项目和里程碑，或合作伙伴集中度过高； 届时约 $0.7-1.2 billion 的估值，或融资路径推迟，都有可能。区间很宽，因为 BioMap
              的质量信号是真实的， 但这些信号如何转成财务结果，大部分仍藏在水面下。
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV035
              - CV036
              - CV037
