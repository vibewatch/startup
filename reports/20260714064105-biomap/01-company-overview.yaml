- id: founders-leadership
  title: Founders and leadership bench
  body: 'The company was initiated by Baidu founder Robin Li and Baidu Ventures veteran Wei Liu, with Liu operating as the day-to-day chief executive. BioMap’s current public leadership bench is broader than the two founders and matters for execution risk: the website bundle lists Xiaoming Zhang as head of AI R&D, Xiaoyue Sun as operations head and general counsel, Ziyao Xu as head of solution, strategy and innovation, Patrick Zhang for global corporate development, and Stan Z. Li as chief scientist for AI large models. This is a technically credible roster spanning large-model engineering, computational biology, legal/operations, and pharma business development, but it also concentrates narrative and strategic control around Robin Li and Wei Liu. Public board composition and formal governance rights are still not disclosed in accessible sources, so founder influence is visible while institutional governance remains opaque.'
