company:
  name: BioMap
chapter:
  number: 1
  title: Company Overview
  summary: BioMap is a 2020-founded Chinese AI-for-biology company built by Robin Li and Wei Liu that has grown from a $100 million Series A into a Hong Kong-backed, late-stage private platform company with a reported confidential HKEX filing in March 2026. Public evidence points to a scaled foundation-model stack around xTrimo and BioMap OS, a $10 million upfront / $1 billion-plus Sanofi collaboration, and expanding Hong Kong operations, but public disclosure on governance, headcount, current valuation, and audited financials remains thin.
sections:
- id: identity-platform-footprint
  title: Identity, platform and operating footprint
  body: 'BioMap presents itself as a life-sciences AI infrastructure company rather than a single-asset drug developer. Public company-controlled material describes BioMap as a global pioneer in AI foundation models for life sciences and positions BioMap OS as a dry-wet closed-loop discovery system that combines data insight, predictive design, experimental control, and model training. The same official materials list a four-city footprint spanning Beijing, Suzhou, Hong Kong, and Silicon Valley, while outside profiles describe the company as Beijing-based and Chinese. One important inconsistency remains: HKSTP described BioMap as “headquartered in the US” in June 2024, while Tracxn and Chinese reporting frame it as Beijing-based. The safest conclusion is that BioMap runs a genuinely cross-border operating structure with China-centered roots and Hong Kong / US expansion, but public sources do not cleanly resolve the legal-topco versus operating-headquarters question.'
