callouts:
- calloutType: strength
  title: Rare blend of sovereign backing and pharma validation
  body: Few private AI-biology companies can point simultaneously to a sovereign Hong Kong partner, a global pharma collaborator, and a visible 2026 pipeline-venture launch. That combination makes BioMap more institutionally embedded than a typical model startup.
  claimRefs:
  - CO015
  - CO022
  - CO023
  - CO036
- calloutType: risk
  title: Disclosure remains well behind ambition
  body: The public story is strong on model scale, ecosystem language and partnership headlines, but weak on the governance, valuation, headcount and audited financial detail needed for hard underwriting. The confidential IPO path has not yet resolved that opacity.
