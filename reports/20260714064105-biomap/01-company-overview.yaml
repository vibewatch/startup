- id: scale-signals-and-product-cadence
  title: Scale signals and product cadence
  body: The public scale picture is unusually strong for a private AI-biotech company, but the figures come from company and partner channels rather than audited reporting. HKIC said BioMap had secured contracts with more than 200 AIGP users by June 2024; HKSTP said the company was already collaborating with more than 10 commercial partners and over 200 academic institutions; Yicai and Harbour BioMed later cited support for more than 800 institutional users and, in Yicai’s case, 30-plus leading enterprises. Product cadence also accelerated through 2025 and 2026. Official news titles and papers document launches or disclosures around a generative discovery system, RNAGenesis, ProteinReasoner, PFMBench, and BioLab, while the June 2026 Harbour release shows the platform being commercialized into a new AI-native complex biologics venture. The implication is that BioMap is no longer just a model builder; it is trying to become an operating system and venture-creation layer for biology.
