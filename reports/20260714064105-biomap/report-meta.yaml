companyProfile:
  summary: >-
    BioMap is a Chinese AI-biotech company founded in 2020 and publicly led by Robin Li as founder-
    chairman and Wei Liu as co-founder and CEO. The company positions BioMap OS and the xTrimo model
    family as a dry-wet closed-loop discovery operating system for protein biology, biologics,
    precision medicine, synthetic biology and frontier life-science research. Public evidence points
    to strategic backing from HKIC, a flagship Sanofi collaboration, broad institutional reach, and a
    confidential Hong Kong IPO filing, but core financial disclosure remains limited.
  foundedDate: "2020-09-25"
  founders:
    - name: Robin Li
      role: Founder-chairman / lead initiator
      background: Baidu founder and public founder-chairman of BioMap.
      claimRefs: [CO002]
    - name: Wei Liu
      role: Co-founder & CEO
      background: Co-founder and current chief executive officer of BioMap.
      claimRefs: [CO003]
  foundingLocation: Beijing, China
  headquarters: Beijing, China, with Hong Kong expansion
  productSummary: >-
    xTrimo foundation models plus BioMap OS, a dry-wet discovery operating system spanning data
    insight, parameter optimization, de novo design, high-throughput validation and iterative model
    improvement.
  customerFocus: >-
    Multinational pharma, Chinese biopharma, CDMOs, research institutions, synthetic-biology teams,
    green-tech enterprises and instrumentation-linked life-science workflows.
  businessModel: >-
    Hybrid B2B monetization via platform contracts, discovery projects, collaboration economics,
    wet-lab workflow support and potential asset-upside structures such as milestones and royalties.
  stage: Late-stage private, pre-IPO
  fundingStatus: >-
    Publicly disclosed history includes a $100M Series A, cumulative funding above $200M by March
    2026 media reports, HKIC strategic backing, and a reported several-hundred-million-dollar HKEX
    IPO target.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CE001, CE004, CI011, CU001, CU004, CV011]
