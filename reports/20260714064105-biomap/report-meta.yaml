  topStrengths:
    - Rare combination of foundation-model depth, dry-wet workflow integration and enterprise biology positioning.
    - Strategic validation from HKIC, Sanofi and Harbour/MegaStream rather than only venture capital narrative.
    - Broad institutional reach with 200+ contracted AIGP users and 800+ institutional users publicly cited.
    - Strong public technical footprint across xTrimoPGLM, PFMBench and related BioMap research assets.
  topRisks:
    - No public audited revenue, gross margin, retention, burn or runway to anchor valuation cleanly.
    - Named proof clusters around a small set of marquee partners, raising possible concentration risk.
    - The operating model is capital-intensive and complex, spanning models, labs, data and partner workflows.
    - Confidential IPO timing and valuation narrative may be ahead of the currently public proof set.
  unresolvedGaps:
    - No reconciled revenue denominator or revenue mix by platform, services and milestones.
    - No public top-customer concentration, renewal or churn metrics.
    - No public preference stack, dilution path or full cap-table visibility.
    - No public operating dashboard covering reliability, implementation success or support quality.
