- id: cost-capital
  title: Cost Structure, Capital Intensity and Adequacy
  body: 'The cost base is likely heavier than the label “AI platform” suggests. BioMap’s 2021 Series A was reported at about $100 million and was explicitly earmarked for R&D and talent; VCBeat also noted that the company was building its own laboratory. Later disclosures add more operating commitments: a Hong Kong InnoHub, the BioX accelerator for 50 projects over five years, Suzhou high-throughput experimental deployment, and MegaStream’s AI-native dry-wet infrastructure ambitions. These are strategically sensible, but they are not pure-software economics. They imply spending on model training, data generation, automation, wet-lab capacity and ecosystem support. Public capital visibility is still incomplete. Sohu reported cumulative funding above $200 million and HKIC announced a strategic investment, but the HKIC check size is not public, and no source reviewed here disclosed cash on hand, monthly burn, runway or debt obligations. The confidential Hong Kong IPO filing, reportedly seeking
    several hundred million dollars, is therefore the clearest public sign that additional capital is important to the next phase of commercialization and scale-up.'
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI021
