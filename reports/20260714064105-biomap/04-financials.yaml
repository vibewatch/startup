chapter:
  number: 4
  title: Financials
summary: 'BioMap shows real commercialization through Sanofi economics, 200-plus contracted AIGP users, 60-plus validated projects and 800-plus institutional users, but public data still do not reveal recognized revenue, margin, burn or runway. The business looks hybrid: platform contracts, bespoke co-development, wet-lab services and future asset-upside structures. Capital adequacy is directionally supported by a $100 million Series A, HKIC backing and a confidential Hong Kong IPO filing, yet the underwriting bottleneck remains basic financial disclosure.'
sections:
- id: revenue-model
  title: Revenue Streams and Monetization Logic
  body: 'BioMap’s public revenue model is visible only through deal structures and customer-count disclosures, not through a clean pricing page or a revenue line. The clearest disclosed stream is partner economics: the Sanofi collaboration carries a $10 million upfront payment and more than $1 billion of possible milestones, while MegaStream adds the prospect of upfronts, success milestones and royalty sharing. HKIC and HKSTP also described more than 200 contracted AIGP users, which supports the existence of platform-contract revenue rather than purely speculative usage. Yicai’s 60-plus projects and 800-plus institutions suggest that BioMap also monetizes through project delivery and enterprise enablement. At the same time, partner announcements with Kexing and Optoseeker show a bespoke integration-heavy model in which BioMap contributes models, orchestration and experimental workflow support. That hybrid structure matters financially: it is stronger evidence of willingness to pay than a
    research-only story, but it also means revenue quality depends on contract mix, milestone timing and service intensity, none of which are publicly broken out today.'
