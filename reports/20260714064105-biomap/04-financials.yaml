- id: traction-proxies
  title: Public Traction and GTM Efficiency Proxies
  body: 'BioMap’s public traction metrics are commercially encouraging but financially awkward because they mix several units of analysis. Official Hong Kong sources cite over 200 contracted AIGP users, while Yicai and PR Newswire cite over 800 institutions, more than 30 leading enterprises and more than 60 validated projects. Those numbers imply a real enterprise go-to-market motion across pharma, CDMOs, research groups, synthetic-biology players and green-tech companies, rather than a narrow one-partner story. They also imply that the company can land in multiple forms: platform contracts, bespoke projects, data-rich co-development and experimental workflow deployments. However, none of the sources reconcile how many of those institutions are paying materially, how many are pilots, how concentrated spend is among top customers, or how much of the total is recurring. The result is that BioMap looks stronger on top-of-funnel proof than on sales efficiency. The disclosed metrics support the
    view that BioMap has meaningful commercial reach, but they do not yet permit CAC, payback, NRR or even a reliable ACV estimate.'
