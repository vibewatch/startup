- id: trust-and-controls
  title: Trust, Security and Quality Controls
  body: The clearest trust evidence BioMap exposes publicly is information-security oriented. The privacy-policy chunk states that BioMap holds ISO/IEC 27001:2022 certification, encrypts data in transit with TLS 1.2 and at rest with AES-256, and conducts annual third-party penetration tests. The same policy describes the categories of personal information the website may collect through forms and email workflows. Those disclosures are meaningful, especially for enterprise buyers sharing sensitive biological data, but they do not answer every diligence question. In the reviewed sources there is no public status page, uptime archive, incident ledger, clinical-grade operating standard, or regulated-lab certification set comparable to what a buyer in GxP-heavy settings might ask for. The trust posture therefore looks credible at the infosec layer but still incomplete at the regulated-operations layer. BioMap’s differentiation story depends on sensitive data, multi-cloud infrastructure and physical
    experimentation, so this missing operational-trust detail is a real diligence gap rather than a documentation nicety.
  claimRefs:
  - CE029
  - CE030
  - CE031
  - CE032
  - CE034
