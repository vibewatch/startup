  title: Customers
summary: BioMap’s customer story is convincing on breadth but incomplete on durability. Official and partner-backed sources support more than 200 contracted AIGP users, more than 800 institutional users, more than 30 leading enterprises and more than 60 validated projects across pharma, research, synthetic biology and green-tech contexts. Named proof is strongest for Sanofi, Harbour/MegaStream, Kexing and Optoseeker, while retention, contract length, concentration and customer satisfaction remain largely undisclosed.
sections:
- id: segmentation-and-breadth
  title: Customer Segmentation and Adoption Breadth
  body: 'BioMap’s public customer base is unusually broad for a private AI-biotech company, but the breadth is disclosed in layers rather than in one clean KPI. HKIC and HKSTP describe more than 200 contracted AIGP users spanning international pharma, CDMOs, innovative drug developers, synthetic-biology companies, green-tech enterprises and research institutions. Yicai and PR Newswire widen that lens further, citing more than 800 institutional users, more than 30 leading enterprises and more than 60 validated projects. Taken together, the evidence supports a real buyer/user map across multiple verticals and geographies rather than a single flagship-pharma relationship. It also suggests that BioMap reaches both direct payers and strategic users: enterprise R&D groups, research organizations and ecosystem programs at this stage that may not all convert into equal revenue. The core customer question is therefore not whether BioMap has reach; it clearly does. The question is how much of that
    reach sits inside durable paid production relationships versus exploratory, lower-intensity or partner-mediated usage. Another subtle point is that the public metrics mix very different units of account, so any investor who reads 800 institutions as 800 economically equivalent accounts will overstate monetization quality materially. That is why the breadth story should be treated as a segmentation and pipeline-strength signal first, and only secondarily as a revenue-quality signal.'
