company:
  name: BioMap
chapter:
  number: 2
  title: Market Analysis
  summary: BioMap sells into a fast-growing but hard-to-bound market at the intersection of AI drug discovery, broader drug-discovery technologies, and discovery software/services for pharma and adjacent biology buyers. Public market lenses range from roughly $4 billion of AI-specific drug-discovery spend in 2026 to more than $30 billion of broader discovery-technology spend, with growth concentrated in biologics, generative models, and Asia-Pacific adoption. The opportunity is large enough to support BioMap’s platform thesis, but the company’s true SAM remains fuzzy because it spans pharma, research, synthetic biology, and green-tech use cases rather than a single clean budget line.
sections:
- id: market-boundary
  title: Market boundary and what counts
  body: 'BioMap should not be valued against total pharma R&D or total biotech software spend. The most relevant core category is AI-driven drug-discovery platforms: software, models, curated data, wet-lab integration, and related services sold to pharma, biotech, CROs, CDMOs, and research institutions for target identification, hit finding, lead optimization, ADMET, translational modeling, and related preclinical work. That boundary comes closest to how BioMap describes BioMap OS, AIGP, and its foundation-model stack. A broader but still relevant adjacency is the full drug-discovery-technology market, which includes instruments, reagents, software, and screening systems. BioMap also stretches beyond classic pharma into synthetic biology and green technology, so no single third-party market report captures the company perfectly. The cleanest approach is to use multiple lenses and explicitly separate the narrow AI-discovery market from the broader enabling-stack market.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM007
  - CM034
  - CM036
  - CM040
  - CM041
  tableRefs:
  - TM001
  figureRefs:
