- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Rising biologics and multi-objective design complexity
    - Driver
    - Now
    - Favors foundation-model platforms over point tools
    - Quantify share of BioMap demand tied to biologics
  - - Need to shorten discovery timelines and improve productivity
    - Driver
    - Now
    - Supports AI pilot budgets inside pharma R&D
    - Request customer ROI case studies and time-to-hit metrics
  - - Asia-Pacific policy support and China-linked dealmaking
    - Driver
    - 2025-2026
    - Supports Hong Kong / China platform adoption and capital access
    - Test how much demand is policy-led versus bottom-up
  - - Data quality and scarcity of labeled data
    - Constraint
    - Now
    - Caps model performance and slows deployment
    - Ask for proprietary-data advantage and feedback loops
  - - Talent scarcity at AI-biology intersection
    - Constraint
    - Now
    - Raises implementation cost for customers and vendors
    - Request BioMap staffing by model, science and solutions roles
  - - Wet-lab validation bottlenecks
    - Constraint
    - Now
    - Prevents purely software economics and slows proof of value
    - Audit dry-wet closed-loop throughput and lab utilization
  - - Regulated workflow change and trust requirements
    - Constraint
    - Medium term
    - Lengthens enterprise sales cycles and validation burden
    - Ask for renewal and expansion data by customer class
  - - Pilot-to-platform conversion risk
    - Constraint
    - Medium term
    - Large TAM does not guarantee scaled contracts
    - Obtain production vs pilot split across 200+/800+ users
  notes: Pairs reported market drivers with practical commercialization blockers. The last three rows are the main reasons headline TAM should not be converted directly into aggressive BioMap revenue assumptions.
