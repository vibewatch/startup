    - Target ID, lead optimization, developability
    - Need to accelerate biologics programs or improve hit rate
  - - Emerging biotech / TechBio
    - Founder-CEO, platform head
    - ML scientists, translational biology teams
    - Corporate R&D / venture capital funded budget
    - Integrated discovery stack from target to pipeline
    - Desire to compete with limited headcount and faster iteration
  - - CDMO / CRO / service providers
    - Service-line GM or innovation lead
    - Process scientists, assay teams
    - Capex + platform enablement budgets
    - Add AI layer to service delivery
    - Need differentiated throughput and client outcomes
  - - Academic / research institutions
    - PI, institute director, innovation office
    - Researchers, PhDs, postdocs
    - Grant / institutional funding
    - Model-assisted research and data interpretation
    - Need access to foundation models without building in-house
  - - Synthetic biology / green tech
    - CTO / platform leader
    - Protein engineers, strain teams
    - R&D budget
    - Protein / pathway design and optimization
    - Need design speed in non-pharma biology use cases
  notes: Buyer map blends third-party market definitions with BioMap-specific disclosed user verticals; exact procurement mechanics differ by customer class and are not publicly disclosed.
