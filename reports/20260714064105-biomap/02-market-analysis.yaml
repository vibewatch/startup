- id: buyers-and-adoption
  title: Buyer map and adoption path
  body: 'Public buyer evidence suggests BioMap sells into scientific budgets rather than generic IT budgets. HKIC says current AIGP users include international pharma, CDMOs, innovative drug developers, synthetic-biology companies, green-technology enterprises, and research institutions. Harbour BioMed frames BioMap as a platform for antibody/protein, precision-medicine, synthetic-biology, and frontier research users. Comparable companies point to similar demand centers: Recursion monetizes through owned and partnered pipelines, Absci through internal and partnered generative-biology programs, Schrödinger through discovery software, Certara through software plus regulatory and development services, and Insilico through both platform software and pipeline licensing. The practical adoption path usually starts with a pilot around target ID or lead optimization, expands into workflow integration and data accumulation, and only later moves into deeper co-development, revenue sharing, or venture
    creation.'
  claimRefs:
  - CM018
  - CM019
  - CM029
  - CM030
