tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Why it matters for BioMap
  rows:
  - - AI-driven drug discovery platforms
    - Model software, data, workflow tools, wet-lab integrations, related services
    - Downstream commercial drug sales, full clinical commercialization
    - Pharma, biotech, CROs, research institutions
    - Closest match to BioMap OS / AIGP / xTrimo business model
  - - Drug discovery technologies (broad stack)
    - Software, instruments, reagents, screening and validation tech
    - Late-stage manufacturing and commercial distribution
    - Large pharma R&D, biotech labs, platform operators
    - Upper bound for budgets AI systems may influence
  - - Discovery informatics / analytics
    - Target data, sequencing analysis, docking, analytics software/services
    - Physical lab infrastructure outside software workflows
    - Discovery informatics teams, translational groups
    - Useful lower-middle adjacency for BioMap software value capture
  - - Biologics discovery platforms
    - Antibody/protein design, multi-parameter optimization, developability tools
    - Small-molecule-only workflows if isolated
    - Biologics and protein-therapy teams
    - Relevant because BioMap sits in fast-growth biologics workflows
  - - Synthetic biology / green-tech design platforms
    - Protein / pathway design for industrial and sustainability use cases
    - General industrial software unrelated to biology
    - Synthetic-biology companies, industrial innovation groups
    - Explains why BioMap’s TAM extends beyond pharma alone
  notes: Boundary table separates the narrow AI-platform market from broader discovery-tech and cross-sector biology budgets to avoid overstating BioMap’s core monetizable market.
