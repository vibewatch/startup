- id: profile-comparison
  title: Profile comparison and scale
  body: Public comparables show a split between pipeline-oriented TechBios and recurring-software vendors. Recursion, Absci, and Insilico emphasize internal and partnered pipelines; Owkin, insitro, Valo, and BenevolentAI emphasize AI-native R&D platforms and autonomous or causal-biology workflows; Schrödinger and Certara emphasize software, simulation and development services. Public market caps for Recursion, Absci, Schrödinger and Certara all sat around $1.0–$1.8 billion in July 2026, giving a useful reality check on how public investors price adjacent discovery platforms. BioMap’s advantage is that it can still tell a private-market growth story around xTrimo and Asia-linked expansion, but its disadvantage is thinner public disclosure than the listed comps.
