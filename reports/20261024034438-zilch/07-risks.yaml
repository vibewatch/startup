company:
  name: Zilch
chapter:
  number: 7
  title: Risks
  summary: >-
    Zilch's payments licence and direct Visa membership reduce one layer of dependency, but the
    15 July 2026 UK BNPL regulatory transition creates a time-bound control and execution test.
    Credit outcomes, incident history, partner concentration, funding terms, and product-level
    economics remain private, leaving residual risk high until diligence closes those gaps.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      The most immediate risk is the UK Deferred Payment Credit regime taking effect on 15 July
      2026. Independent legal and consulting analyses describe authorisation or temporary
      permission, transaction-level creditworthiness assessments, pre-contract information,
      missed-payment support, Consumer Duty integration, complaints handling, and regulatory
      reporting as substantive operating requirements. Zilch's December 2025 payments-services
      licence is useful mitigation because it removes reliance on third-party payment-service
      arrangements, but it is not public proof that every BNPL control, permission, data field,
      and customer-outcome process is ready. The investment case therefore requires documentary
      evidence of permissions, implementation testing, model governance, disclosures, vulnerable-
      customer treatment, complaint handling, and management information before treating
      regulatory execution as de-risked.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR014]
    tableRefs: [TR001]
  - id: operating-and-data
    title: Operating, data, and product execution risk
    body: >-
      The operating surface is expanding rather than simplifying. FinTech Magazine reports that
      Zilch uses AWS for AI and machine-learning workloads, handles 500 million customer data sets,
      and has half of its customer base connected through open banking. The same reporting and
      Zilch's own announcement describe direct Visa membership and greater in-house payment-method
      development. These changes can improve speed and economics, yet they also concentrate
      resilience, privacy, model-risk, and change-management obligations across Zilch, Visa, and
      AWS. Public evidence does not disclose uptime, material incidents, penetration-test results,
      model overrides, recovery objectives, or independent assurance. Zilch Pay and Intelligent
      Commerce add launch and adoption risk while those control gaps remain unresolved.
    claimRefs: [CR004, CR005, CR006, CR007, CR012, CR015]
    tableRefs: [TR002]
  - id: funding-and-model
    title: Funding and financial-model risk
    body: >-
      Zilch raised $176.7 million in a combined debt-and-equity transaction that also expanded its
      Deutsche Bank securitisation facility. That headline does not disclose the debt/equity split,
      incremental unrestricted cash, pricing, covenants, advance rates, or borrowing-base triggers.
      Dealroom reports £110.3 million of revenue and a £10.4 million pre-tax loss for the latest
      financial year; the loss is an accounting result, not cash burn or runway. Multiples.vc
      separately records a $2 billion valuation and a 13.6x multiple on its $147 million revenue
      measure, but its measure should not be substituted for audited revenue or ARR. The core
      downside is that credit losses, compliance spending, marketing, or delayed merchant
      monetisation could consume capital while funding capacity remains counterparty-dependent.
    claimRefs: [CR008, CR009, CR010, CR011, CR013, CR015]
    tableRefs: [TR003]
  - id: residual-risk-and-kill-criteria
    title: Residual risk and thesis-break criteria
    body: >-
      Risk mitigation is credible only where it can be monitored. The payments licence, Visa
      membership, AWS infrastructure, and expanded securitisation show institutional support, but
      public announcements do not establish loss performance, complaint outcomes, service levels,
      concentration limits, or covenant headroom. The highest-priority diligence tests are therefore
      date-bound permission readiness, affordability and arrears outcomes, Financial Ombudsman
      complaints, data and incident controls, facility availability, merchant retention, and
      product adoption. Thesis-break triggers should include a missed regulatory permission or
      remediation event, material deterioration in complaints or credit losses, reduced
      securitisation capacity, a significant outage or data-control failure, or repeated delay and
      weak adoption for Zilch Pay and Intelligent Commerce.
    claimRefs: [CR001, CR003, CR014, CR015, CR016]
    figureRefs: [FR001]
