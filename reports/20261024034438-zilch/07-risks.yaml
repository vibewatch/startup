    claimRefs: [CR006, CR007, CR008, CR013, CR015]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Time-bound regulatory readiness and opaque credit or funding outcomes carry the highest
      residual severity despite visible licence, network, cloud, and financing mitigations.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Medium impact
          values: ["Partner substitution", "Product delay", null]
        - label: High impact
          values: [null, "Data or network incident", "Merchant-economics shortfall"]
        - label: Critical impact
          values: [null, "Funding-capacity reduction", "Regulatory readiness failure"]
        - label: Consumer impact
          values: [null, "Complaint escalation", "Affordability-control weakness"]
        - label: Execution impact
          values: [null, "Launch under-adoption", "Repeated delivery delay"]
        - label: Investment impact
          values: [null, "Valuation compression", "Combined credit and funding shock"]
    approximationNotes: >-
      Placements are qualitative analyst assessments, not measured probabilities or company-issued
      risk scores; null cells mean no selected risk was assigned, not zero exposure.
    claimRefs: [CR016]
callouts:
  - calloutType: risk
    title: Primary thesis break
    body: >-
      A regulatory-readiness failure combined with deteriorating affordability, complaints, or
      credit losses would pressure growth economics while increasing remediation and funding needs.
    claimRefs: [CR001, CR002, CR014, CR016]
  - calloutType: insight
    title: Licence is mitigation, not closure
    body: >-
      The payments licence and direct Visa membership reduce intermediary reliance, but public
      evidence does not establish readiness for every BNPL permission, control, and customer outcome.
    claimRefs: [CR004, CR005]
