slug: zilch
runDate: 2026-10-24
company:
  name: Zilch
chapter:
  number: 3
  title: Competitors
  summary: Zilch competes with Klarna, Clearpay/Afterpay, PayPal and traditional credit on a broad payment surface rather than only at a merchant checkout. Its strongest differentiation is the combination of pay-anywhere distribution, rewards and merchant-funded intelligence, but the moat remains conditional on merchant depth, responsible-credit execution and the ability to turn regulatory infrastructure into better economics.
sections:
  - id: competitive-landscape
    title: Landscape and buyer alternatives
    body: >-
      Zilch's direct competitors are Klarna, Clearpay/Afterpay and PayPal's pay-later products, while Monzo Flex, credit cards, personal loans, ordinary debit cards and saving before purchase remain adjacent or substitute choices. Which? lists Klarna, Clearpay, PayPal and Zilch among the biggest UK BNPL providers and notes that banks now offer their own regulated BNPL products. The competitive job is therefore broader than splitting a purchase: buyers compare flexibility, trust, repayment controls, rewards and acceptance. Zilch's 2022 launch evidence describes a direct-to-consumer virtual Mastercard usable online and in stores, rather than a product limited to merchants that embed its checkout. That reach can reduce merchant-by-merchant distribution dependence, but it also puts Zilch in direct competition for wallet share with incumbent card rails, banks and large payment ecosystems.
    claimRefs: [CP001, CP002, CP003, CP004, CP014]
    tableRefs: [TP001]
  - id: differentiation-and-distribution
    title: Differentiation, distribution and switching
    body: >-
      Zilch's distinctive proposition is a two-sided model: consumers receive flexible payments and rewards, while merchants are offered customer acquisition and data-driven commerce services. A 2026 Fintech Magazine account says the platform drives more than £2.5bn annually to partner merchants and combines debit, credit, instalments and rewards; it also describes new paid membership tiers and Pay Monthly. A third-party review reports that Zilch's revenue comes from merchant fees and advertising, but that assertion should be treated as independent review evidence rather than audited financial disclosure. Switching costs are modest for consumers because alternative cards and BNPL apps are easy to access. They are higher on the merchant side if Zilch's first-party engagement data, rewards and distribution produce measurable conversion, but the evidence pool does not provide audited merchant retention, take-rate or incremental conversion data.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: pricing-trust-and-regulation
    title: Pricing, trust and regulatory posture
    body: >-
      The product comparison is favorable on some consumer-facing terms but not unambiguously superior. Which? records Zilch's six-week and three-month options, soft checks, no late fee in the compared products, and potential credit-score damage from missed payments; it also says Zilch may refer accounts outstanding for more than 70 days to a debt-management agency. Fintech Magazine reports that Pay Monthly has a representative APR of 14.9% and displays fees at checkout, so “zero-interest BNPL” should not be generalized to every new product. UK BNPL regulation changes the basis of competition: Business Expert, Which? and City A.M. describe a 15 July 2026 regime with affordability checks, complaints rights and clearer disclosures. Zilch's FCA payments licence and Visa principal membership are described by Fintech Magazine, but comparative regulatory superiority over rivals is not established by this pool.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: durability-and-displacement
    title: Moat durability and displacement risk
    body: >-
      The plausible moat is a reinforcing loop between consumer frequency, first-party transaction data, rewards personalization and merchant demand. Company-originated 2025 funding coverage reports over 5.3 million customers, thousands of retailers and more than £5bn of commerce processed, while Fintech Magazine describes Intelligent Commerce as a fast-growing revenue source; neither establishes audited merchant retention or contribution margin. Historical Business Insider figures also show why scale comparisons require consistent geography and periods: in 2022 it contrasted Zilch's nearly 2.5 million UK users with Klarna's previously announced 20 million US users. Counterforces include stronger embedded checkout, incumbent ecosystem breadth and credit-loss pressure. City A.M. reported rising Klarna losses and consumer credit losses in 2025, showing that even scaled competitors face economics and regulatory pressure. Those forces can compress Zilch's advantage before merchant-side monetization is independently proven.
    claimRefs: [CP013, CP014, CP015, CP016]
    figureRefs: [FP001]
callouts:
  - calloutType: strength
    title: Distribution is the strategic wedge
    body: Zilch's pay-anywhere card and rewards-led experience can reach transactions beyond an embedded merchant checkout, while Intelligent Commerce gives merchants a reason to participate beyond payment acceptance.
    claimRefs: [CP002, CP005, CP006]
  - calloutType: risk
    title: Merchant monetization remains the key proof gap
    body: Public sources describe merchant intelligence and revenue diversification, but this pool does not establish retention, incremental conversion, realized pricing or contribution margin for the merchant proposition.
    claimRefs: [CP006, CP008, CP015]
tables:
  - id: TP001
    title: Competitor profile table
    columns: [competitor, category, scale_or_reach, target_customer, differentiation, limitation]
    rows:
      - [Zilch, direct BNPL and payments platform, "5.3m+ customers reported by company coverage; thousands of retailers", "Consumers seeking flexible payments and rewards; merchants seeking acquisition and insights", "Pay-anywhere card, rewards, merchant-funded intelligence", "Merchant retention, economics and current private scale are not public"]
      - [Klarna, direct BNPL and payments platform, "Large international merchant network reported in review comparison", "Online and international shoppers; merchants wanting embedded checkout", "Broader global checkout integration", "May offer less distinctive credit-building and rewards combination for this comparison"]
      - [Clearpay / Afterpay, direct BNPL platform, "Major UK BNPL provider; Afterpay owned by Block according to review material", "Younger shoppers and merchants using embedded checkout", "Brand and retailer integrations", "Checkout and late-fee perceptions can be less attractive to some users"]
      - [PayPal Pay in 3, direct BNPL product within payments ecosystem, "Available to eligible PayPal users", "Existing PayPal shoppers and merchants", "Existing account and buyer-protection ecosystem", "Less rewards-led and limited to PayPal-linked repayment methods in Which? comparison"]
      - [Monzo Flex and bank BNPL, adjacent bank-led products, "Available to eligible bank customers; current comparable scale unavailable", "Existing current-account users", "Card-linked instalments inside a banking relationship", "Eligibility and economics vary; cross-provider evidence is incomplete"]
      - [Credit cards and debit cards, substitute and status quo, "Broad acceptance and established consumer habits", "General consumers and large-ticket buyers", "Acceptance, liquidity and credit-card Section 75 protection", "Credit-card interest and hard checks can be less attractive; debit lacks installment flexibility"]
      - [Merchant or bank internal build, likely entrant / internal alternative, "No comparable public scale in the assigned evidence", "Large retailers or banks with owned distribution", "Can integrate credit directly into an existing checkout or account", "Requires underwriting, compliance and servicing capability"]
      - [Save and delay purchase, non-credit status quo, "Universally available but constrained by household liquidity", "Consumers avoiding new borrowing", "No interest, late fee or credit exposure", "Delays consumption and provides no merchant conversion uplift"]
    notes: "Qualitative comparison assembled from Which?, IBS Intelligence, Business Insider, Kandoo, Fintech Magazine and company-originated coverage; scale statements use different geographies and periods and are not a like-for-like market-share dataset."
    claimRefs: [CP001, CP002, CP003, CP004, CP013, CP014]
  - id: TP002
    title: Feature and capability matrix
    columns: [buying_criterion, Zilch, Klarna, Clearpay_or_Afterpay, evidence_limit]
    rows:
      - [Reach, "Pay-anywhere virtual/physical card; 38.7m Mastercard retailers described in 2022 coverage", "Broader international merchant network reported by review", "Strong retailer and checkout integrations reported by review", "Current network size and active acceptance are not independently measured"]
      - [Consumer economics, "Rewards and no-late-fee positioning in comparison; paid tiers and 14.9% representative APR product also reported", "Installments and late-fee terms vary by product", "Pay in 4 with late-fee terms in Which? comparison", "List or reported terms are not realized unit economics"]
      - [Data and merchant tools, "Open Banking, behavioral data and Intelligent Commerce", "Personalized offers and merchant platform not evidenced in this pool", "Merchant checkout distribution; additional data services not evidenced", "Unsupported cells are intentionally not scored"]
      - [Trust and controls, "Soft checks; missed payments may affect credit score; FCA payments licence reported", "Soft checks and reporting vary by product", "Soft checks and late-fee / collections policy vary by product", "Comparative affordability, complaints and outcomes data are unavailable"]
    notes: "Cells distinguish reported capability from missing comparative evidence; no unsupported competitor feature is inferred."
    claimRefs: [CP002, CP005, CP009, CP010, CP011]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [provider_or_product, price_or_repayment_model, included_capabilities, discount_or_unknowns, implication]
    rows:
      - [Zilch Extra, "£2.99 per month", "Spending insights, promotional offers, priority support, rewards and income-verification access", "Rewards and realized value depend on usage; no retention data", "Paid membership tests whether consumer value can supplement merchant monetization"]
      - [Zilch Plus, "£3.99 per month", "Up to 6% rewards on debit purchases and up to 1% on credit transactions; physical card", "Top rates require card preparation; foreign-exchange access begins August 2026 per source", "More rewards may increase engagement but add fulfillment and subsidy requirements"]
      - [Zilch Pay Monthly, "3, 6 or 12 months; purchases of £75+; representative APR 14.9%", "Fees shown at checkout", "Controlled-cohort rollout; eligibility and realized mix are unknown", "Broadens the product beyond short BNPL and creates regulated-credit economics to underwrite"]
      - ["Klarna, Clearpay, PayPal and Zilch comparison", "Short-term plans; terms vary by provider", "Which? reports Zilch over 3 months or 6 weeks, Klarna over 3 installments or 30 days, PayPal over 3 installments, Clearpay over 4 installments", "Current terms can change and the comparison was last updated August 2025", "Buyer choice depends on checkout integration, fees, protections and repayment flexibility"]
    notes: "Prices and terms are reported list or representative terms, not realized revenue, margin or consumer total cost across cohorts; dates and product eligibility matter."
    claimRefs: [CP009, CP010, CP012]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Zilch's reported positioning emphasizes pay-anywhere reach and merchant-funded intelligence, while rivals retain advantages in embedded checkout, international scale or ecosystem breadth.
    data:
      xAxis: "Distribution breadth"
      yAxis: "Merchant intelligence and rewards differentiation"
      points:
        - {label: Zilch, x: 0.72, y: 0.82, detail: "Pay-anywhere card, rewards and Intelligent Commerce", note: "Ordinal placement from retained evidence; not a measured score"}
        - {label: Klarna, x: 0.88, y: 0.58, detail: "Broader international merchant network and integrated checkout reported", note: "Ordinal placement from retained evidence; not a measured score"}
        - {label: Clearpay / Afterpay, x: 0.68, y: 0.48, detail: "Retailer integrations and brand reach reported", note: "Ordinal placement from retained evidence; not a measured score"}
        - {label: PayPal, x: 0.78, y: 0.42, detail: "Existing payments ecosystem and Pay in 3", note: "Ordinal placement from retained evidence; not a measured score"}
        - {label: Credit cards, x: 0.95, y: 0.25, detail: "Broad acceptance and established protections", note: "Ordinal placement from retained evidence; not a measured score"}
        - {label: Debit cards, x: 0.98, y: 0.12, detail: "Broad acceptance without installment credit", note: "Ordinal placement from retained evidence; not a measured score"}
    approximationNotes: "Coordinates are evidence-backed ordinal judgments, not quantitative market-share or product scores; the source pool does not provide comparable benchmark data."
    claimRefs: [CP003, CP006, CP014, CP016]
