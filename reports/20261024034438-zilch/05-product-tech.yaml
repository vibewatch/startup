  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: >-
        Current uptime, latency percentiles, incident history, recovery objectives,
        support SLAs, capacity tests, and production architecture ownership.
      whyItMatters: >-
        Launch-era supplier claims cannot establish current resilience or the operational
        burden created by partner dependencies.
      diligencePath: >-
        Request twelve months of service-level reporting, incident postmortems,
        architecture diagrams, dependency inventories, and continuity-test results.
      relatedQuestionRefs:
        - QE004
    - type: private-evidence-only
      severity: material
      topic: security-and-compliance
      missingEvidence: >-
        Current PCI DSS attestation, security audit scope, penetration-test findings,
        privacy impact assessments, model-governance records, and FCA control testing.
      whyItMatters: >-
        Compliance-by-design language does not demonstrate that current controls are
        effective across the expanded payments, rewards, travel, and data stack.
      diligencePath: >-
        Review current attestations, regulator correspondence, audit reports, privacy
        documentation, model inventories, and remediation trackers in a secure data room.
      relatedQuestionRefs:
        - QE006
    - type: missing-source
      severity: material
      topic: zilch-pay
      missingEvidence: >-
        Current primary evidence confirming whether Zilch Pay launched after its
        stated first-half 2026 target and documenting production adoption.
      whyItMatters: >-
        A missed or delayed checkout launch would change the assessment of roadmap
        execution and Zilch's ability to capture more of the checkout workflow.
      diligencePath: >-
        Obtain a dated product release, live merchant implementation, transaction
        volume, active-user data, and a roadmap variance explanation.
      relatedQuestionRefs:
        - QE007
    - type: private-evidence-only
      severity: material
      topic: partner-dependencies
      missingEvidence: >-
        Contracts, revenue shares, data-rights schedules, service boundaries, SLAs,
        termination rights, and concentration exposure for Plaid, lastminute.com,
        Rezolve AI, Mastercard, and core integration providers.
      whyItMatters: >-
        The product's breadth depends on external infrastructure whose economics,
        continuity protections, and data rights are not visible publicly.
      diligencePath: >-
        Review partner contracts and vendor risk assessments, then reconcile them to
        product margins, service ownership, and tested exit plans.
      relatedQuestionRefs:
        - QE008
