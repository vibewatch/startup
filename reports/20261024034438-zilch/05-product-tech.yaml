          items:
            - label: AWS serverless microservices
              detail: Elastic application framework.
            - label: Event processing
              detail: Low-latency transaction workflow.
            - label: CI/CD
              detail: Continuous deployment tooling.
        - label: External service integrations
          detail: Named transaction and accounting dependencies in the supplier case study.
          items:
            - label: GPS
              detail: Integration named by Innovify.
            - label: Xero
              detail: Integration named by Innovify.
            - label: Cash Flows
              detail: Integration named by Innovify.
        - label: Control requirements
          detail: Original-build requirements rather than verified current attestations.
          items:
            - label: PCI DSS requirements
              detail: Described by Innovify as embedded in the build.
            - label: FCA requirements
              detail: Described by Innovify as embedded in the build.
    approximationNotes: >-
      Conceptual synthesis of public sources; layer order does not prove ownership,
      deployment boundaries, data flows, or the current production topology.
