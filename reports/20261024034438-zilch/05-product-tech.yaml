company:
  name: Zilch
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Zilch presents a broad consumer-payments surface spanning pay-now, instalments,
    rewards, travel, merchant engagement, and bank-based repayment, with several
    capabilities delivered through named partners. Public evidence describes an
    AWS-based launch architecture and specific integrations, but does not establish
    current reliability, control effectiveness, or completion of every announced roadmap item.
sections:
  - id: product-surfaces-and-workflows
    title: Product surfaces and customer workflows
    body: >-
      Zilch's public product surface is broader than a single checkout loan. The
      current company description combines debit, credit, instalments, earned-wage
      access, credit building, deals, and rewards in one payments proposition, while
      an older independent description shows the core customer choice between paying
      immediately for a reward and spreading a purchase over six weeks. That older
      account also describes virtual-card acceptance through Mastercard, which reduced
      the need for each merchant to complete a bespoke integration, although the
      current commercial and eligibility rules are not public. Since then, the surface
      has expanded into bank-based repayment through Plaid, a lastminute.com-powered
      travel experience, merchant-facing Intelligent Commerce, and a Reward integration
      intended to place retailer offers inside the payment journey. These are distinct
      workflows with different counterparties and maturity levels, not a single
      internally owned product stack. The module and workflow exhibits therefore label
      announcements, live partner capabilities, and unresolved rollout questions separately.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
    tableRefs:
      - TE001
      - TE002
  - id: architecture-and-external-dependencies
    title: Architecture and external dependencies
    body: >-
      The most concrete public engineering account is Innovify's supplier case study
      from Zilch's original build. It says the launch platform used AWS serverless
      microservices, continuous-delivery pipelines, optimized transaction data paths,
      and a low-latency event system; it also names GPS, Xero, and Cash Flows as
      integration dependencies. Those details are useful evidence of implementation
      choices, but they are supplier claims about an earlier build rather than a
      current architecture inventory or independently reproduced benchmark. The
      present operating model adds material external layers: Plaid provides Pay by
      Bank and virtual-account capabilities, lastminute.com powers the travel product,
      and Rezolve AI's Reward platform supplies retailer engagement. The resulting
      architecture is best understood as an orchestration layer across payment,
      banking, commerce-media, travel, and cloud services. Public sources do not
      disclose service boundaries, failover design, vendor SLAs, data-sharing terms,
      or which components Zilch now operates directly.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE014
      - CE016
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: maturity-controls-and-roadmap-risk
    title: Maturity, controls, and roadmap risk
    body: >-
      Public maturity evidence is uneven. Innovify reports that PCI DSS and FCA
      requirements were embedded in the original build and that transaction latency
      was optimized below 250 milliseconds, but neither statement is a current
      certification, service-level record, penetration test, or production incident
      history. A 2024 profile also described direct bank-account connectivity for
      affordability checks and personalized limits, yet the publisher labelled its
      own confidence as limited and supplied no model-governance evidence. Roadmap
      language requires similar discipline: November 2025 coverage described
      Intelligent Commerce as launched but Zilch Pay only as expected in the first
      half of 2026, and this assigned evidence does not confirm whether that checkout
      product subsequently launched. Finally, an independent July 2026 assessment
      characterized the Reward deployment as a card-linked-offer business rather than
      autonomous purchasing and noted that contract terms, revenue sharing, and rollout
      timing remained undisclosed. Underwriting therefore needs current operating
      evidence, not an inference from launch-era design or partner marketing.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE012
      - CE013
      - CE015
      - CE016
tables:
  - id: TE001
    title: Product module and partner-asset matrix
    columns:
      - Module or product line
      - Buyer or user
      - Public status or maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Core payments app
        - Consumer
        - Current company description spans debit, credit, instalments, earned-wage access, credit building, deals, and rewards
        - Multiple payment and value features in one consumer surface
        - Current feature-level usage, eligibility, and economics are not public
      - - Virtual-card payment
        - Consumer and accepting merchant
        - Independently described in 2022 as usable through Mastercard acceptance
        - Broad merchant reach without a bespoke integration for every merchant
        - Current card-program terms, coverage, and exception rates are not evidenced
      - - Pay by Bank and virtual accounts
        - Consumer and payment operations
        - Plaid announced one-off repayment and operational capabilities in October 2025
        - Direct bank repayment plus settlement, refund, and reconciliation tooling
        - Rollout coverage, adoption, failure rates, and realized cost savings are undisclosed
      - - Zilch Travel
        - Consumer booking travel
        - Reported as launched with lastminute.com in 2025
        - Search, booking, rewards, and flexible payment in the Zilch app
        - Supplier economics, support boundaries, and booking-volume evidence are unavailable
      - - Intelligent Commerce
        - Merchant or brand
        - Described as launched by November 2025
        - Converts live engagement data into merchant-facing insights
        - Independent performance validation and merchant retention are unavailable
      - - Zilch Pay
        - Consumer and checkout merchant
        - Expected in November 2025 coverage to launch in the first half of 2026
        - Proposed one-click checkout experience
        - Current launch status and production adoption are not confirmed by the assigned evidence
      - - Reward integration
        - Consumer, retailer, and merchant marketer
        - Partnership announced in July 2026
        - Embeds retailer engagement from hundreds of UK retailers into the payment journey
        - Contract terms, revenue share, and rollout timeline are undisclosed
    notes: >-
      Statuses reflect the dates and wording of the cited public sources; they do not
      imply current availability, independently verified performance, or Zilch ownership
      of partner infrastructure.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
  - id: TE002
    title: Workflow and use-case map
    columns:
      - User job
      - Prior or adjacent workflow
      - Zilch solution
      - Publicly described benefit
      - Limitation
    rows:
      - - Pay at a broad set of merchants
        - Merchant-specific credit or card payment
        - App and virtual-card payment with pay-now or instalment choices
        - Reward for immediate payment or six-week payment flexibility in the 2022 description
        - Current terms, merchant exceptions, and underwriting approval rates are not public
      - - Make a one-off repayment
        - Card-rail repayment
        - Plaid Pay by Bank
        - Direct bank payment intended to reduce processing fees and add user control
        - No adoption, success-rate, or realized savings evidence is disclosed
      - - Reconcile and refund repayments
        - Back-office payment matching
        - Plaid virtual accounts
        - Settlement tracking and built-in refund functionality
        - Operational results and exception handling are not public
      - - Search, book, and pay for travel
        - Separate travel discovery and financing
        - Zilch Travel powered by lastminute.com
        - Up to 3% cashback or interest-free payment over six weeks or three months
        - Eligibility, exclusions, supplier economics, and service ownership are undisclosed
      - - Discover a retailer offer while paying
        - Standalone advertising or loyalty channel
        - Reward offers embedded in the Zilch journey
        - Retailer engagement closer to shopping and payment intent
        - Rollout timing, attribution methodology, and commercial terms are undisclosed
      - - Review merchant engagement
        - Delayed or fragmented campaign reporting
        - Intelligent Commerce
        - Company-described conversion of live engagement data into real-time insight
        - Accuracy, incrementality, and independent merchant outcomes are not evidenced
    notes: >-
      Benefits are source-attributed descriptions, not independently measured outcomes;
      unknown denominators and commercial terms remain explicit limitations.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE010
      - CE011
      - CE012
      - CE014
      - CE015
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Publicly described role
      - Named dependency
      - Principal risk
    rows:
      - - Consumer experience
        - App and virtual-card surface for payment, instalments, deals, and rewards
        - Mastercard acceptance and mobile distribution
        - Current availability and feature-level reliability are not disclosed
      - - Repayment operations
        - Pay by Bank, settlement tracking, refund handling, and reconciliation
        - Plaid open-banking and virtual-account capabilities
        - Connectivity, bank coverage, and vendor-service dependency
      - - Travel vertical
        - Search, booking, payment flexibility, and rewards
        - lastminute.com white-label platform
        - Supplier economics, customer-support boundary, and booking-service continuity
      - - Commerce engagement
        - Retailer offers and merchant-facing engagement insight
        - Rezolve AI Reward and Zilch Intelligent Commerce
        - Attribution quality, privacy controls, revenue share, and rollout uncertainty
      - - Application platform
        - Serverless microservices, event processing, and continuous delivery in the original build
        - AWS
        - Supplier account may not reflect the present architecture or current resilience
      - - Transaction integrations
        - Connect external payment and accounting services
        - GPS, Xero, and Cash Flows
        - Fragmented documentation and third-party interoperability
      - - Control layer
        - PCI DSS and FCA requirements described as embedded during the original build
        - Internal controls and external assessors not identified
        - Current attestation, privacy testing, and control-effectiveness evidence are absent
    notes: >-
      This is a public-evidence operating model, not a verified system diagram; launch-era
      supplier statements may not describe the current production estate.
    claimRefs:
