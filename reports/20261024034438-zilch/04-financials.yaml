artifact: financials
slug: zilch
runDate: 2026-10-24
company:
  name: Zilch
chapter:
  number: 4
  title: Financials
  summary: Zilch has shifted from a pure BNPL proposition toward an ad-subsidised payments network, with reported FY2025 revenue growth and margin improvement but limited public visibility into cash, contribution economics, and realized pricing. The latest debt-and-equity raise supports expansion, while securitization and continued product investment make funding access and credit performance central underwriting variables.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Zilch's reported model is merchant-funded rather than primarily interest-funded. Prefetched coverage describes merchant commissions, performance advertising, and transaction-related revenue as the core streams, with consumer-facing payment options generally avoiding interest and late-payment penalties but sometimes carrying upfront or transaction fees. This structure can improve consumer acquisition and merchant conversion, but it also makes revenue quality dependent on repeat commerce, merchant demand for placement, and the company's ability to price credit and rewards without eroding contribution margin. A 2026 product expansion added paid membership tiers, with Zilch Extra at £2.99 per month and Zilch Plus at £3.99 per month, while Pay Monthly applies a representative APR of 14.9% to eligible purchases of £75 or more. These are list or stated product terms, not evidence of realized blended pricing or profit by cohort.
      A lastminute.com partnership also added a travel offer with up to 3% cashback and six-week or three-month interest-free payment options.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-economics
    title: Traction, margins, and operating economics
    body: >-
      Publicly reported operating metrics point to meaningful scale, but the evidence is uneven in quality, currency, and period. EntrepreneurPlus reports FY2025 revenue of £110.3 million, a 93% increase, a £10.5 million net loss, a 49% gross-profit margin versus 39% in FY2024, and £1.9 billion of GMV. Great Entrepreneurs separately reports 2024 revenue of $142 million and a $13.6 million annual pre-tax loss; those USD figures should not be silently normalized to the GBP presentation without the underlying accounts. EntrepreneurPlus also says administrative expenses rose 7% while revenue rose 93%, and average customer spending reached £2,369 annually. Zilch and media coverage separately report more than 5.3 million customers and more than £5 billion of commerce processed, but those are company-reported scale indicators rather than audited cohort economics. CAC, retention, charge-offs, loss rates, funding cost, servicing cost, and contribution margin remain unavailable.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      Zilch announced more than $175 million of combined debt and equity in November 2025, alongside an expansion of its Deutsche Bank-led securitization facility. One account describes a £150 million facility against approximately £3 billion of annual origination, while another describes £10 billion of annual commerce. Origination and commerce are different denominators, so these source-specific descriptions should not be treated as conflicting facility limits or as a single normalized runway figure. The announced uses—above-the-line marketing, product and platform development, and potential acquisitions—are growth uses rather than disclosed cash-on-hand or burn coverage. The company therefore appears dependent on continued debt-market access and disciplined credit performance, while cash balance, undrawn availability, maturity schedule, covenants, warehouse advance rates, and next-round triggers remain private. A 2026 report also notes that a financing backer previously reneged on a term sheet, an adverse reminder that capital availability is not assured.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
  - id: financial-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      The financial case is strongest where platform scale and monetization direction are visible: merchant-funded revenue, paid membership, payments infrastructure, and reported improvement in gross margin and losses suggest operating leverage may be emerging. The case is weaker where an investor needs to underwrite cash generation and downside resilience. Public materials do not provide a consistent revenue bridge by stream, realized merchant take rate by cohort, credit-loss and funding-cost waterfall, customer acquisition payback, merchant retention, or cash runway. The latest financing can fund growth, but it is not equivalent to unrestricted cash available to absorb losses or finance receivables. Underwriting should therefore use reported revenue and GMV as separate metrics, model debt capacity and credit losses explicitly, and require current management accounts and facility documents before relying on a durable margin path.
    claimRefs: [CI006, CI011, CI014, CI015, CI017]
