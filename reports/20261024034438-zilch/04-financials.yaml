callouts:
  - calloutType: strength
    title: Diversified monetization is becoming more explicit
    body: Merchant commissions, advertising, transaction revenue, memberships, and longer-duration payment products give Zilch more than one monetization lever, although public evidence does not quantify the mix.
    claimRefs: [CI001, CI003, CI004]
  - calloutType: risk
    title: Financing dependency remains a core blocker
    body: The latest raise and securitization expansion support scale, but public sources do not disclose cash runway, facility covenants, or receivables-loss coverage.
    claimRefs: [CI011, CI012, CI015]
  - calloutType: recommendation
    title: Underwrite the missing bridge, not just the headline growth
    body: Require current management accounts, merchant contracts, receivables and funding schedules, cohort loss data, and cash-flow forecasts before treating reported growth or the latest raise as evidence of durable cash generation.
    claimRefs: [CI006, CI011, CI014, CI015]
