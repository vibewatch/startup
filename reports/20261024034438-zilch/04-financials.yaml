      - [Zilch Extra, "£2.99 per month", "List membership price", "Reported August 2026 product expansion", "Test paid conversion against rewards and servicing cost"]
      - [Zilch Plus, "£3.99 per month; up to 6% debit rewards and up to 1% credit rewards", "List price and stated maximum reward rates", "Reported August 2026 product expansion", "Maximum rewards are not realized average cost"]
      - [Pay Monthly, "Representative APR 14.9% on eligible purchases of £75+", "Stated product APR", "Controlled cohort rollout", "Need actual approval, loss, and utilization distributions"]
      - [Merchant ASPN economics, "Commission and advertising fees; exact schedule unavailable", "Contracted terms unavailable", "Third-party summary of company model", "Obtain merchant contracts, take-rate cohorts, and concentration"]
    notes: "List prices and stated maximum reward rates are not realized revenue; merchant terms, discounts, refunds, and revenue-recognition details remain private."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI003
    title: Public traction and financial indicators
    columns: [Metric, Value and period, Source posture, Confidence, Why it matters and diligence ask]
    rows:
      - [Revenue, "£110.3m; year ended March 2025", "Third-party report citing FY2025", "medium", "Reconcile to accounts and split by merchant, advertising, transaction, and membership revenue"]
      - [Revenue growth, "93% year on year to year ended March 2025", "Third-party report", "medium", "Test repeatability and definition against audited accounts"]
      - [Gross-profit margin, "49% versus 39% in FY2024", "Third-party report of company annual-report metric", "medium", "Reconcile gross-profit definition and credit/funding costs"]
      - [Loss, "£10.5m net loss in FY2025; separate source reports $13.6m annual pre-tax loss", "Third-party reports with different currency and definitions", "medium", "Reconcile both presentations to audited accounts before comparison"]
      - [GMV, "£1.9bn; year ended March 2025", "Third-party report", "medium", "Separate transaction volume from revenue and assess take rate"]
      - [Customers, "More than 5.3m; reported in November 2025", "Company announcement and media coverage", "medium", "Obtain active, transacting, retained, and delinquent customer cohorts"]
      - [Commerce processed, "More than £5bn since launch; reported in November 2025", "Company announcement and media coverage", "medium", "Reconcile period, gross versus net presentation, and returns"]
      - [Administrative expenses, "Up 7% while revenue rose 93%; FY2025 comparison", "Third-party report", "medium", "Obtain headcount, servicing, marketing, and technology cost bridge"]
    notes: "Metrics are not interchangeable: revenue is not GMV, a reported loss is not cash burn, and customers are not necessarily active users. Periods and definitions must be reconciled to management accounts."
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
