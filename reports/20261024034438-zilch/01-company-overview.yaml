company:
  name: Zilch
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Zilch is a London-based consumer payments company whose retained evidence shows
    more than 5.3 million users, over GBP 5 billion of processed commerce, and a
    November 2025 financing of USD 176.7 million in combined debt and equity. Its
    current valuation, audited revenue or run-rate, headcount, cap-table terms, and
    post-July-2026 regulatory operating metrics remain material diligence gaps.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Zilch is a London-based consumer payments platform that combines flexible
      payment options with rewards and merchant-facing tools. The corporate history
      in the retained evidence begins with a 2018 founding by Philip Belamant, Serge
      Belamant, and Sean O'Connor, followed by FCA sandbox participation in 2019, a
      consumer-credit licence in April 2020, and a UK consumer app launch in September
      2020. The operating model is described as an ad-subsidised payments network:
      advertising and merchant economics help fund rewards and interest-free payment
      options rather than the company relying solely on consumer fees. This
      positioning broadens Zilch beyond a checkout-only BNPL product, but merchant
      revenue composition and contribution economics are not disclosed in the
      assigned evidence.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO011]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Founder influence remains pronounced. Philip Belamant is identified as chief
      executive and co-founder, Sean O'Connor as co-founder, and Serge Belamant as
      chairman and co-founder; current financing coverage also identifies Hugh
      Courtney as chief financial officer. Sean O'Connor is specifically credited in
      company quotations with contributing network and strategic leadership to the
      latest financing. The evidence establishes functional coverage across executive,
      finance, and board leadership, but it does not establish voting control,
      ownership percentages, board committee composition, succession arrangements, or
      the current full director population. The resulting key-person and governance
      assessment is therefore directional rather than a complete control analysis.
    claimRefs: [CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: capital-and-scale
    title: Capital and operating scale
    body: >-
      The latest retained financing evidence reports USD 176.7 million of combined
      debt and equity in November 2025, led by KKCG with BNF Capital participating and
      an expansion of Deutsche Bank-led securitisation. Multiple retained reports
      repeat the same transaction attributes, but two are close reproductions of the
      company's announcement and should not be treated as independent confirmation of
      every detail. The company-reported scale markers are more than 5.3 million users
      and over GBP 5 billion of commerce processed. Those figures describe registered
      reach and transaction volume, not active customers, revenue, ARR, cash available,
      or profitability. No current valuation or cumulative funding total can be
      responsibly inferred from the latest round alone.
    claimRefs: [CO008, CO009, CO010]
  - id: milestones-and-regulatory-transition
    title: Milestones and regulatory transition
    body: >-
      Zilch's chronology shows a progression from sandbox testing and consumer-credit
      authorisation into a broader payments-infrastructure posture. By February 2026,
      reporting described an FCA payment-services licence and Visa principal
      membership, while also stating that the company had reached quarterly
      profitability in July 2024. These are meaningful operating milestones, but
      quarterly profitability is not the same as audited annual profit or free cash
      flow. The external risk perimeter also tightened on 15 July 2026, when covered
      UK deferred-payment lenders became subject to FCA authorisation or temporary
      permissions, affordability assessments, Consumer Duty, and eligible Financial
      Ombudsman escalation. Current compliance performance and the actual launch
      status of products previously scheduled for 2026 are not available in the
      assigned evidence.
    claimRefs: [CO003, CO004, CO005, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
