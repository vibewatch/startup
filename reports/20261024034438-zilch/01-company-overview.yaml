callouts:
  - calloutType: risk
    title: Scale is not the same as financial quality
    body: >-
      Registered users and processed commerce do not reveal activation, retention,
      credit losses, take rate, revenue, cash generation, or capital consumption.
      Underwriting should not convert these scale markers into revenue or ARR.
    claimRefs: [CO009, CO010]
