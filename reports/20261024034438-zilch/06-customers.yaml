schemaVersion: "report-v2"
artifact: customers
slug: zilch
runDate: 2026-10-24
company:
  name: Zilch
chapter:
  number: 6
  title: Customers
  summary: Zilch has scaled from a UK BNPL launch into a broader consumer-payments platform with reported users above five million and material merchant reach. Public evidence supports strong acquisition and engagement signals, but customer retention, cohort economics, and production outcomes for newer merchant products remain insufficiently disclosed.
sections:
  - id: customer-segments
    title: Customer segments and value exchange
    body: >-
      Zilch serves consumers who want to split purchases, manage cash flow, or receive rewards, while merchants use the platform for payment acceptance and customer acquisition. The reported direct-to-consumer card model is broader than a merchant-by-merchant BNPL plug-in because the card can be used wherever Mastercard is accepted. The commercial exchange is therefore two-sided: consumers receive payment flexibility and rewards, and merchants fund advertising or pay for access to high-intent shoppers. Public sources identify large retailers including Amazon, eBay, Tesco, and Sports Direct, but do not disclose the revenue or active-account mix attributable to any named merchant. That distinction matters because registered users, active users, and paying merchant relationships are different populations.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and engagement
    body: >-
      The public trajectory shows rapid headline growth: Zilch reported more than two million UK customers in 2022, more than three million customers later that year, and more than 5.3 million customers in 2025 coverage. Sources also report five billion pounds of processed commerce and near-daily or roughly sixty-times-per-year engagement for the most active users. These are useful scale and usage indicators, not retention measures. The denominator for “customers” is not consistently defined as registered, active, or transacting, and the cited engagement statements do not provide a cohort period, distribution, or repeat-rate table. The underwriting partner describes infrastructure supporting more than four million registered customers, reinforcing scale while leaving current active penetration unresolved.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof
    title: Named customer and partner proof
    body: >-
      Named enterprise relationships provide evidence of market acceptance, but the quality of proof varies. Coverage names Amazon, eBay, Tesco, and Sports Direct as retailer connections; a customer-facing product announcement describes Mastercard-wide acceptance and a US launch with more than 150,000 pre-registered customers. Taktile’s partner case study supplies a more operational proof point: Zilch migrated underwriting decisioning and went live in four weeks, while the partner reports costs falling by more than half. The evidence is stronger for platform deployment and distribution than for merchant-level outcomes. Public material does not independently verify purchase conversion, incremental sales, merchant renewal, or realized return on ad spend for the named retailers.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration risks
    body: >-
      Zilch is expanding the customer proposition through membership tiers, longer instalments, salary access, Intelligent Commerce, and a planned one-click checkout product. This may increase customer frequency and merchant monetization, but the public evidence is primarily launch or company-quoted reporting rather than cohort-level proof. Trustpilot shows a high overall score and a large review base, while also warning that it does not fact-check individual reviews and summarizing complaints about unexpected debit-account withdrawals and support issues. No retained source provides NRR, GRR, churn, renewal, customer concentration, or merchant retention. The key underwriting gap is therefore durability: scale can coexist with volatile credit usage, low-margin customers, or dependence on a small number of retail and funding relationships.
      A second review aggregator reports a strong US Trustpilot score but also a modest year-over-year decline in website traffic; both are directional signals rather than substitutes for active-user cohorts.
    claimRefs: [CU013, CU014, CU015, CU016]
