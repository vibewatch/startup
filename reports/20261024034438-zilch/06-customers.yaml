    notes: "Enumeration is a public sample of named proof, not an exhaustive customer roster. Reported production status follows the source wording and does not establish commercial success."
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from acquisition to expansion
    summary: Zilch's reported customer path links consumer discovery and payment use to rewards, repeat engagement, and merchant-funded expansion, with evidence strength declining at retention and monetization stages.
    type: journey-map
    data:
      items:
        - label: Acquire
          detail: Consumer joins through direct-to-consumer payments and rewards proposition.
          touchpoints: ["UK launch and reported customer milestones", "US launch with over 150,000 pre-registrations"]
        - label: Pay
          detail: Consumer uses debit or instalment options across Mastercard acceptance.
          touchpoints: ["Pay Now and instalment options", "Reported acceptance wherever Mastercard can be used"]
        - label: Reward
          detail: Consumer receives cashback, savings, or membership benefits.
          touchpoints: ["2% instant cashback described in launch material", "Extra and Plus membership tiers"]
        - label: Repeat
          detail: Usage frequency becomes the key proof of durable engagement.
          touchpoints: ["Most active users reported near-daily engagement", "Reported engagement up to roughly 60 times per year"]
        - label: Expand
          detail: Merchant and consumer surfaces broaden through intelligence, checkout, and salary-access products.
          touchpoints: ["Intelligent Commerce for merchants", "Zilch Pay planned one-click checkout", "Pay Monthly and Zilch Advance"]
        - label: Retain
          detail: Cohort retention, merchant renewal, and concentration remain private evidence gaps.
          touchpoints: ["No NRR, GRR, churn, or renewal data retained", "Trustpilot complaints require monitoring"]
    approximationNotes: "Analytical sequence synthesized from retained sources; it is not a measured conversion funnel, and retention remains an evidence gap."
    claimRefs: [CU005, CU008, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: strength
    title: Scale is visible; durability is not
    body: Reported user milestones, named retailers, and usage-frequency claims indicate meaningful distribution and engagement, but the evidence does not establish active-account retention or merchant renewal.
    claimRefs: [CU007, CU008, CU009, CU013]
  - calloutType: risk
    title: Customer concentration and complaint risk remain open
    body: Zilch has not publicly disclosed customer or merchant concentration, while review evidence includes complaints about payment withdrawals and support. These gaps should be tested against cohort, complaint, and top-account data.
    claimRefs: [CU013, CU014, CU016]
