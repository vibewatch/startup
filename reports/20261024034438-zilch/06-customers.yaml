    rows:
      - [Amazon, Retail merchant, Consumer payments acceptance, "Not disclosed; platform connection reported", "Named as a leading global retailer connected to the platform", "No merchant-level volume or renewal data"]
      - [eBay, Retail merchant, Consumer payments acceptance, "Not disclosed; platform connection reported", "Named as a leading global retailer connected to the platform", "No conversion or revenue data"]
      - [Tesco, Retail merchant, Consumer payments acceptance, "Not disclosed; platform connection reported", "Named as a leading global retailer connected to the platform", "No active-use or concentration data"]
      - [Sports Direct, Retail merchant, Consumer payments acceptance, "Not disclosed; platform connection reported", "Named as a leading global retailer connected to the platform", "No outcome or contract data"]
      - [Taktile, Technology partner, Automated underwriting decisioning, "Production migration described by partner", "Went live in four weeks and reported decisioning costs cut by more than half", "Partner case study; no independent financial verification"]
