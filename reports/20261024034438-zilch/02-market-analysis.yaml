  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-sizing
      missingEvidence: >-
        Current UK active borrowers, Zilch transaction share, merchant count and
        retention, take rate by segment, and attributable merchant-advertising spend.
      whyItMatters: >-
        Broad BNPL flow and company-linked merchant volume cannot establish a
        defensible Zilch-specific SAM, SOM, or durable market share.
      diligencePath: >-
        Obtain monthly active borrower cohorts, UK transaction share, merchant
        cohorts, take rates, renewal, and independently reconciled advertising ROAS.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: pricing-gap
      missingEvidence: >-
        A current product-by-product schedule reconciling subscriptions,
        transaction charges, APRs, rewards, and merchant-funded economics.
      whyItMatters: >-
        Undated fee comparisons and 2026 product coverage do not establish current
        consumer pricing or the revenue mix used in adoption and margin analysis.
      diligencePath: >-
        Request current UK pricing disclosures and revenue mix, then test customer
        cohorts by product, fee incidence, APR, rewards, and merchant subsidy.
      relatedQuestionRefs: [QM006]
