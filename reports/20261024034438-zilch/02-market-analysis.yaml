    notes: "Analytical boundaries only; included activities have different units and must not be added into one market-size estimate."
    claimRefs: [CM001, CM004, CM005, CM006, CM007, CM014, CM015]
  - id: TM002
    title: Sizing lenses and limitations
    columns:
      - Lens
      - Period
      - Geography
      - Reported value
      - Denominator
      - Confidence
      - Limitation
    rows:
      - ["BNPL transaction flow", "2024", "UK", "£13.8bn", "Annual transaction value", "Medium", "Not outstanding debt or Zilch share"]
      - ["Adult BNPL adoption", "2026 estimate", "UK", "~54% / ~29.9m people", "Adults who had ever used BNPL", "Medium", "Not active borrowers or current balances"]
      - ["Young-user loan stacking", "Recent, source date not specified", "UK", "~60%", "BNPL users aged 18–28 with 2–5 active plans", "Medium", "Age-specific risk indicator, not total penetration"]
      - ["Zilch-linked merchant flow", "2026 coverage", "Not fully specified", ">£2.5bn annually", "Value driven to partner merchants", "Medium", "Company-related report; not TAM or revenue"]
    notes: "Values retain source periods, units, and denominators; the rows are separate lenses and are not an additive TAM/SAM/SOM model."
    claimRefs: [CM001, CM002, CM003, CM010]
  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["Cash-flow manager", "Consumer", "Consumer", "Consumer repayment account", "Split an eligible purchase", "Household spending", "Payment-timing flexibility"]
      - ["Rewards-led spender", "Consumer", "Consumer", "Consumer payment account", "Pay and earn rewards", "Household spending", "Rewards plus spending control"]
      - ["Retail merchant", "Merchant commerce team", "Shopper", "Merchant commission or service economics", "Acquire and convert shopper demand", "Ecommerce or payments", "Incremental conversion and basket value"]
      - ["Brand performance marketer", "Brand marketing team", "Shopper", "Brand performance-marketing spend", "Target offers and attribute sales", "Performance marketing", "Verified ROAS and new customers"]
    notes: "Roles are inferred from the retained business-model and product evidence; segment-level Zilch revenue, retention, and contribution margins are not public."
    claimRefs: [CM006, CM007, CM008, CM009, CM011, CM012, CM013]
