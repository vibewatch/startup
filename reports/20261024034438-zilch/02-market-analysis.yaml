schemaVersion: "report-v2"
artifact: market-analysis
slug: zilch
runDate: 2026-10-24
company:
  name: Zilch
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Zilch participates in a mainstream UK deferred-payment-credit market while
    also monetizing adjacent payments, rewards, and merchant-acquisition budgets.
    Public evidence supports demand and operating scale, but it does not isolate
    a defensible Zilch-specific SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The core market is UK buy now, pay later, formally deferred payment credit,
      used to spread retail purchases. Business Expert reports £13.8 billion of
      2024 transaction value, which is a flow rather than outstanding debt.
      Zilch also touches adjacent pools: debit and card payments, rewards,
      merchant commissions, and performance advertising. Those adjacencies may
      expand monetization, but they should not be combined with BNPL transaction
      value into one headline TAM. Consumers can instead use debit cards, credit
      cards, personal loans, merchant instalment plans, or defer the purchase.
      Merchants can buy conventional checkout, affiliate, and advertising tools.
      Zilch must therefore win both a consumer payment decision and a merchant
      acquisition-budget decision, rather than merely participate in broad
      payments or advertising expenditure.
    claimRefs: [CM001, CM004, CM005, CM006, CM007, CM014, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      Two external lenses establish category scale without proving company share.
      Business Expert, citing FCA material, estimates that 54% of UK adults, or
      about 29.9 million people, had ever used BNPL in 2026; “ever used” is not
      the same as active borrowing. It also reports £13.8 billion of 2024 BNPL
      transaction value. FinTech Magazine separately reports that Zilch drives
      more than £2.5 billion to partner merchants each year, but that
      company-related metric lacks a fully specified geography and denominator.
      The resulting picture is material demand with unresolved penetration:
      category flow, historical adoption, and company-linked merchant flow use
      different units and periods. No retained source provides active UK Zilch
      borrowers, current category transaction share, merchant retention, or a
      bottom-up advertising opportunity, so SAM and SOM remain diligence gaps.
    claimRefs: [CM001, CM002, CM003, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      Consumers are the users and repayment payers for credit products, while
      merchants and brands fund commissions or performance-marketing economics.
      Netguru’s interview records Zilch’s consumer-first positioning: the company
      seeks a direct relationship with shoppers rather than relying solely on a
      merchant checkout button. Demand evidence is directionally supportive but
      company-originated. FinTech Magazine reports that Zilch’s April 2026 survey
      of 10,000 UK adults found 45% wanted rewards from credit products and 47%
      wanted products that help manage spending. Product adoption also broadens
      the comparison set: Pay Monthly covers three-, six-, or twelve-month terms
      for eligible purchases of at least £75 at a representative 14.9% APR.
      Merchant adoption still depends on attributable conversion, retention, and
      contribution economics that public evidence does not disclose.
    claimRefs: [CM006, CM007, CM008, CM009, CM011]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      Mainstream usage, rewards demand, and merchants’ search for measurable
      acquisition can support growth. Operational tooling may also lower the cost
      of scaling underwriting: supplier Taktile says Zilch reduced decisioning
      provider and usage costs by more than half after switching platforms.
      That is partner proof, not an independent benchmark. Constraints are
      equally important. Business Expert reports that around 60% of BNPL users
      aged 18 to 28 hold two to five active plans, highlighting affordability and
      loan-stacking risk. From 15 July 2026, the UK regime requires affordability
      checks, upfront disclosure, and access to the Financial Ombudsman Service.
      A low-reputation SWOT publisher also asserts that merchant onboarding trails
      user growth; this is a useful adverse hypothesis but not verified operating
      evidence. Valuation should therefore depend on post-regulation credit
      performance, merchant renewal, and incremental advertising returns rather
      than a broad multi-industry market label.
    claimRefs: [CM003, CM004, CM012, CM013]
callouts:
  - calloutType: insight
    title: Do not collapse unlike market metrics
    body: >-
      Annual transaction value, ever-used penetration, company-linked merchant
      flow, and operating cost reductions describe different populations and
      denominators; none is a substitute for a Zilch-specific SAM or SOM.
    claimRefs: [CM001, CM002, CM010, CM012]
  - calloutType: risk
    title: Current pricing evidence is not reconciled
    body: >-
      An undated Merchant Machine page lists a £2.50 Zilch BNPL transaction fee,
      while 2026 coverage describes new subscription tiers and longer-duration
      financing. Current product-level pricing and mix require direct verification.
    claimRefs: [CM011, CM016]
