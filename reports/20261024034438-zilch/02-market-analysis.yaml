          value: 13.8
          unit: "GBP bn"
          detail: "2024 annual transaction value; not outstanding debt."
        - label: UK adults ever using BNPL
          value: 29.9
          unit: "million people"
          detail: "Approximate 2026 estimate; not active borrowers."
        - label: Adult ever-used penetration
          value: 54
          unit: "%"
          detail: "Approximate UK estimate for 2026."
        - label: Young users with multiple plans
          value: 60
          unit: "%"
          detail: "Approximate share of BNPL users aged 18–28 with two to five active plans."
        - label: Zilch-linked partner flow
          value: 2.5
          unit: "GBP bn+ annually"
          detail: "Reported in 2026 coverage; geography and denominator are not fully specified."
        - label: Decisioning provider and usage cost change
          value: 50
          unit: "%+ reduction"
          detail: "Supplier-reported result after Zilch switched to Taktile."
    approximationNotes: >-
      Approximate markers are retained from the sources. Items have different
      populations, periods, and units and are not comparable shares of one total.
    claimRefs: [CM001, CM002, CM003, CM010, CM012]
