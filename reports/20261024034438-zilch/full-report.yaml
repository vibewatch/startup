      Rows distinguish reported scale and financing signals from the additional evidence needed to validate investment
      quality.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          New products scale merchant monetisation; regulation is absorbed without material credit-loss or conduct-cost
          deterioration
        - A higher multiple could be defensible, but no public revenue base supports a numeric target
        - Execution, competition, compliance, and financing costs
        - Low-to-medium; requires currently unverified operating evidence
      - - Base
        - User network grows while monetisation and profitability improve gradually; capital remains available
        - Hold or selectively enter only after price and terms are verified; no precise return estimate
        - Opaque unit economics, dilution, and persistent losses
        - Medium; consistent with available but incomplete evidence
      - - Bear
        - Regulatory or credit-cost pressure combines with slower product adoption and tighter financing
        - Multiple compression or down round creates dilution and preference risk
        - Conduct costs, credit losses, refinancing, and commercialization failure
        - Material downside; public evidence cannot quantify it
      - - Decision trigger
        - Verify permissions, cap table, loss metrics, retention, and product revenue before entry
        - Move from research-more only if evidence supports risk-adjusted return at the actual price
        - Missing data itself delays underwriting
        - 'Current status: unresolved'
    notes: >-
      Scenarios are directional, not a probability-weighted valuation; public sources do not provide a reliable current
      revenue or cap-table base for precision.
    claimRefs:
      - CV006
      - CV008
      - CV011
      - CV012
      - CV013
      - CV015
