          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE009
              - CE010
              - CE012
              - CE014
              - CE016
      - number: '5.3'
        title: Maturity, controls, and roadmap risk
        blocks:
          - type: paragraph
            body: >-
              Public maturity evidence is uneven. Innovify reports that PCI DSS and FCA requirements were embedded in
              the original build and that transaction latency was optimized below 250 milliseconds, but neither
              statement is a current certification, service-level record, penetration test, or production incident
              history. A 2024 profile also described direct bank-account connectivity for affordability checks and
              personalized limits, yet the publisher labelled its own confidence as limited and supplied no
              model-governance evidence. Roadmap language requires similar discipline: November 2025 coverage described
              Intelligent Commerce as launched but Zilch Pay only as expected in the first half of 2026, and this
              assigned evidence does not confirm whether that checkout product subsequently launched. Finally, an
              independent July 2026 assessment characterized the Reward deployment as a card-linked-offer business
              rather than autonomous purchasing and noted that contract terms, revenue sharing, and rollout timing
              remained undisclosed. Underwriting therefore needs current operating evidence, not an inference from
              launch-era design or partner marketing.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE012
              - CE013
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named integration surfaces reduce architectural ambiguity
            body: >-
              Public sources identify concrete partners and technologies across bank repayment, travel, retailer
              engagement, cloud infrastructure, and transaction integrations.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE009
              - CE010
              - CE014
          - type: callout
            title: Current production assurance remains private
            body: >-
              Launch-era latency and compliance-by-design claims do not substitute for current service levels, incident
              history, security attestations, or partner SLAs.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and value exchange
        blocks:
          - type: paragraph
            body: >-
              Zilch serves consumers who want to split purchases, manage cash flow, or receive rewards, while merchants
              use the platform for payment acceptance and customer acquisition. The reported direct-to-consumer card
              model is broader than a merchant-by-merchant BNPL plug-in because the card can be used wherever Mastercard
              is accepted. The commercial exchange is therefore two-sided: consumers receive payment flexibility and
              rewards, and merchants fund advertising or pay for access to high-intent shoppers. Public sources identify
              large retailers including Amazon, eBay, Tesco, and Sports Direct, but do not disclose the revenue or
              active-account mix attributable to any named merchant. That distinction matters because registered users,
              active users, and paying merchant relationships are different populations.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
      - number: '6.2'
        title: Adoption trajectory and engagement
        blocks:
          - type: paragraph
            body: >-
              The public trajectory shows rapid headline growth: Zilch reported more than two million UK customers in
              2022, more than three million customers later that year, and more than 5.3 million customers in 2025
              coverage. Sources also report five billion pounds of processed commerce and near-daily or roughly
              sixty-times-per-year engagement for the most active users. These are useful scale and usage indicators,
              not retention measures. The denominator for “customers” is not consistently defined as registered, active,
              or transacting, and the cited engagement statements do not provide a cohort period, distribution, or
              repeat-rate table. The underwriting partner describes infrastructure supporting more than four million
              registered customers, reinforcing scale while leaving current active penetration unresolved.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU008
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.3'
        title: Named customer and partner proof
        blocks:
          - type: paragraph
            body: >-
              Named enterprise relationships provide evidence of market acceptance, but the quality of proof varies.
              Coverage names Amazon, eBay, Tesco, and Sports Direct as retailer connections; a customer-facing product
              announcement describes Mastercard-wide acceptance and a US launch with more than 150,000 pre-registered
              customers. Taktile’s partner case study supplies a more operational proof point: Zilch migrated
              underwriting decisioning and went live in four weeks, while the partner reports costs falling by more than
              half. The evidence is stronger for platform deployment and distribution than for merchant-level outcomes.
              Public material does not independently verify purchase conversion, incremental sales, merchant renewal, or
              realized return on ad spend for the named retailers.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Durability, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Zilch is expanding the customer proposition through membership tiers, longer instalments, salary access,
              Intelligent Commerce, and a planned one-click checkout product. This may increase customer frequency and
              merchant monetization, but the public evidence is primarily launch or company-quoted reporting rather than
              cohort-level proof. Trustpilot shows a high overall score and a large review base, while also warning that
              it does not fact-check individual reviews and summarizing complaints about unexpected debit-account
              withdrawals and support issues. No retained source provides NRR, GRR, churn, renewal, customer
              concentration, or merchant retention. The key underwriting gap is therefore durability: scale can coexist
              with volatile credit usage, low-margin customers, or dependence on a small number of retail and funding
              relationships. A second review aggregator reports a strong US Trustpilot score but also a modest
              year-over-year decline in website traffic; both are directional signals rather than substitutes for
              active-user cohorts.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is visible; durability is not
            body: >-
              Reported user milestones, named retailers, and usage-frequency claims indicate meaningful distribution and
              engagement, but the evidence does not establish active-account retention or merchant renewal.
            calloutType: strength
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU013
          - type: callout
            title: Customer concentration and complaint risk remain open
            body: >-
              Zilch has not publicly disclosed customer or merchant concentration, while review evidence includes
              complaints about payment withdrawals and support. These gaps should be tested against cohort, complaint,
              and top-account data.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The most immediate risk is the UK Deferred Payment Credit regime taking effect on 15 July 2026.
              Independent legal and consulting analyses describe authorisation or temporary permission,
              transaction-level creditworthiness assessments, pre-contract information, missed-payment support, Consumer
              Duty integration, complaints handling, and regulatory reporting as substantive operating requirements.
              Zilch's December 2025 payments-services licence is useful mitigation because it removes reliance on
              third-party payment-service arrangements, but it is not public proof that every BNPL control, permission,
              data field, and customer-outcome process is ready. The investment case therefore requires documentary
              evidence of permissions, implementation testing, model governance, disclosures, vulnerable- customer
              treatment, complaint handling, and management information before treating regulatory execution as
              de-risked.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR014
      - number: '7.2'
        title: Operating, data, and product execution risk
        blocks:
          - type: paragraph
            body: >-
              The operating surface is expanding rather than simplifying. FinTech Magazine reports that Zilch uses AWS
              for AI and machine-learning workloads, handles 500 million customer data sets, and has half of its
              customer base connected through open banking. The same reporting and Zilch's own announcement describe
              direct Visa membership and greater in-house payment-method development. These changes can improve speed
              and economics, yet they also concentrate resilience, privacy, model-risk, and change-management
              obligations across Zilch, Visa, and AWS. Public evidence does not disclose uptime, material incidents,
              penetration-test results, model overrides, recovery objectives, or independent assurance. Zilch Pay and
              Intelligent Commerce add launch and adoption risk while those control gaps remain unresolved.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
      - number: '7.3'
        title: Funding and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Zilch raised $176.7 million in a combined debt-and-equity transaction that also expanded its Deutsche Bank
              securitisation facility. That headline does not disclose the debt/equity split, incremental unrestricted
              cash, pricing, covenants, advance rates, or borrowing-base triggers. Dealroom reports £110.3 million of
              revenue and a £10.4 million pre-tax loss for the latest financial year; the loss is an accounting result,
              not cash burn or runway. Multiples.vc separately records a $2 billion valuation and a 13.6x multiple on
              its $147 million revenue measure, but its measure should not be substituted for audited revenue or ARR.
              The core downside is that credit losses, compliance spending, marketing, or delayed merchant monetisation
              could consume capital while funding capacity remains counterparty-dependent.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR013
              - CR015
      - number: '7.4'
        title: Residual risk and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Risk mitigation is credible only where it can be monitored. The payments licence, Visa membership, AWS
              infrastructure, and expanded securitisation show institutional support, but public announcements do not
              establish loss performance, complaint outcomes, service levels, concentration limits, or covenant
              headroom. The highest-priority diligence tests are therefore date-bound permission readiness,
              affordability and arrears outcomes, Financial Ombudsman complaints, data and incident controls, facility
              availability, merchant retention, and product adoption. Thesis-break triggers should include a missed
              regulatory permission or remediation event, material deterioration in complaints or credit losses, reduced
              securitisation capacity, a significant outage or data-control failure, or repeated delay and weak adoption
              for Zilch Pay and Intelligent Commerce.
            claimRefs:
              - CR001
              - CR003
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis break
            body: >-
              A regulatory-readiness failure combined with deteriorating affordability, complaints, or credit losses
              would pressure growth economics while increasing remediation and funding needs.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR014
              - CR016
          - type: callout
            title: Licence is mitigation, not closure
            body: >-
              The payments licence and direct Visa membership reduce intermediary reliance, but public evidence does not
              establish readiness for every BNPL permission, control, and customer outcome.
            calloutType: insight
            claimRefs:
              - CR004
              - CR005
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Zilch has assembled a differentiated consumer-payments platform rather than
              remaining a single-product BNPL lender. Independent and investor coverage describes more than five million
              users, over £5 billion of processed commerce, a $175 million debt-and-equity raise, and new Intelligent
              Commerce and Zilch Pay products. Those are meaningful scale and financing signals, but several are company
              statements repeated by counterparties rather than audited KPIs. The anti-thesis is valuation opacity:
              public sources disagree on the latest loss measure, do not disclose current revenue quality or retention,
              and provide no current cap-table or preference terms. FCA regulation of deferred-payment credit from 15
              July 2026 adds a material compliance and unit-economics test, with independent advisers warning that the
              change requires stronger decisioning, reporting, customer-support, and governance systems. On balance, the
              evidence supports monitoring and targeted diligence, not a price-insensitive purchase.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV005
              - CV008
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV014
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The November 2025 financing was reported as more than $175 million of combined debt and equity, led by
              KKCG, with an expanded Deutsche Bank securitisation facility. That headline is evidence of investor and
              lender willingness to fund the platform, not evidence that $175 million is equity value or cash available
              to shareholders. Sources describe the valuation as about $2 billion, close to the company's own over-$2
              billion mark from 2021, but the newer amount is not presented in a filing or accompanied by a current
              share price, preference stack, dilution schedule, or net-debt bridge. Companies House records a 15 January
              2025 allotment, while the accessible filing-history extract does not expose its economic terms. Entry
              discipline therefore requires a verified cap table, debt and securitisation obligations, liquidation
              preferences, and a reconciliation of revenue, contribution margin, credit losses, and regulatory costs.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.3'
        title: Scenarios, exit readiness, and decision
        blocks:
          - type: paragraph
            body: >-
              The bull case requires the new products to convert the reported user and retailer network into durable,
              high-margin merchant revenue while regulatory compliance remains affordable and the company reaches
              public-market readiness. The base case assumes continued platform growth but slower monetisation, ongoing
              financing needs, and a valuation that remains difficult to defend without private financial disclosures.
              The bear case is a combination of multiple compression, credit-loss or conduct-cost pressure, and
              product-commercialisation failure; a future down round or restrictive refinancing would expose dilution
              and preference overhang. The evidence does not support precise probability-weighted returns or a target
              exit price. A research-more recommendation, medium confidence, high risk rating, and stretched valuation
              stance best reflect the evidence. Thesis-break triggers are a regulatory permission failure, sustained
              losses without a credible path to contribution profitability, material deterioration in credit
              performance, or financing terms that subordinate new capital.
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV013
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Research-more: the platform has credible scale and financing access, but the reported valuation cannot be
              tested against current public operating or cap-table evidence.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV008
              - CV013
              - CV016
          - type: callout
            title: Regulation is an underwriting variable
            body: >-
              From 15 July 2026, FCA rules require relevant DPC lenders to be authorised or temporarily permitted and to
              comply with regulatory rules; the cost and outcome impact for Zilch require verification.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
