  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The core market is UK buy now, pay later, formally deferred payment credit, used to spread retail
              purchases. Business Expert reports £13.8 billion of 2024 transaction value, which is a flow rather than
              outstanding debt. Zilch also touches adjacent pools: debit and card payments, rewards, merchant
              commissions, and performance advertising. Those adjacencies may expand monetization, but they should not
              be combined with BNPL transaction value into one headline TAM. Consumers can instead use debit cards,
              credit cards, personal loans, merchant instalment plans, or defer the purchase. Merchants can buy
              conventional checkout, affiliate, and advertising tools. Zilch must therefore win both a consumer payment
              decision and a merchant acquisition-budget decision, rather than merely participate in broad payments or
              advertising expenditure.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Two external lenses establish category scale without proving company share. Business Expert, citing FCA
              material, estimates that 54% of UK adults, or about 29.9 million people, had ever used BNPL in 2026; “ever
              used” is not the same as active borrowing. It also reports £13.8 billion of 2024 BNPL transaction value.
              FinTech Magazine separately reports that Zilch drives more than £2.5 billion to partner merchants each
              year, but that company-related metric lacks a fully specified geography and denominator. The resulting
              picture is material demand with unresolved penetration: category flow, historical adoption, and
              company-linked merchant flow use different units and periods. No retained source provides active UK Zilch
              borrowers, current category transaction share, merchant retention, or a bottom-up advertising opportunity,
              so SAM and SOM remain diligence gaps.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM012
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Consumers are the users and repayment payers for credit products, while merchants and brands fund
              commissions or performance-marketing economics. Netguru’s interview records Zilch’s consumer-first
              positioning: the company seeks a direct relationship with shoppers rather than relying solely on a
              merchant checkout button. Demand evidence is directionally supportive but company-originated. FinTech
              Magazine reports that Zilch’s April 2026 survey of 10,000 UK adults found 45% wanted rewards from credit
              products and 47% wanted products that help manage spending. Product adoption also broadens the comparison
              set: Pay Monthly covers three-, six-, or twelve-month terms for eligible purchases of at least £75 at a
              representative 14.9% APR. Merchant adoption still depends on attributable conversion, retention, and
              contribution economics that public evidence does not disclose.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Mainstream usage, rewards demand, and merchants’ search for measurable acquisition can support growth.
              Operational tooling may also lower the cost of scaling underwriting: supplier Taktile says Zilch reduced
              decisioning provider and usage costs by more than half after switching platforms. That is partner proof,
              not an independent benchmark. Constraints are equally important. Business Expert reports that around 60%
              of BNPL users aged 18 to 28 hold two to five active plans, highlighting affordability and loan-stacking
              risk. From 15 July 2026, the UK regime requires affordability checks, upfront disclosure, and access to
              the Financial Ombudsman Service. A low-reputation SWOT publisher also asserts that merchant onboarding
              trails user growth; this is a useful adverse hypothesis but not verified operating evidence. Valuation
              should therefore depend on post-regulation credit performance, merchant renewal, and incremental
              advertising returns rather than a broad multi-industry market label.
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not collapse unlike market metrics
            body: >-
              Annual transaction value, ever-used penetration, company-linked merchant flow, and operating cost
              reductions describe different populations and denominators; none is a substitute for a Zilch-specific SAM
              or SOM.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM012
          - type: callout
            title: Current pricing evidence is not reconciled
            body: >-
              An undated Merchant Machine page lists a £2.50 Zilch BNPL transaction fee, while 2026 coverage describes
              new subscription tiers and longer-duration financing. Current product-level pricing and mix require direct
              verification.
            calloutType: risk
            claimRefs:
              - CM011
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Zilch's direct competitors are Klarna, Clearpay/Afterpay and PayPal's pay-later products, while Monzo
              Flex, credit cards, personal loans, ordinary debit cards and saving before purchase remain adjacent or
              substitute choices. Which? lists Klarna, Clearpay, PayPal and Zilch among the biggest UK BNPL providers
              and notes that banks now offer their own regulated BNPL products. The competitive job is therefore broader
              than splitting a purchase: buyers compare flexibility, trust, repayment controls, rewards and acceptance.
              Zilch's 2022 launch evidence describes a direct-to-consumer virtual Mastercard usable online and in
              stores, rather than a product limited to merchants that embed its checkout. That reach can reduce
              merchant-by-merchant distribution dependence, but it also puts Zilch in direct competition for wallet
              share with incumbent card rails, banks and large payment ecosystems.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
              - CP014
      - number: '3.2'
        title: Differentiation, distribution and switching
        blocks:
          - type: paragraph
            body: >-
              Zilch's distinctive proposition is a two-sided model: consumers receive flexible payments and rewards,
              while merchants are offered customer acquisition and data-driven commerce services. A 2026 Fintech
              Magazine account says the platform drives more than £2.5bn annually to partner merchants and combines
              debit, credit, instalments and rewards; it also describes new paid membership tiers and Pay Monthly. A
              third-party review reports that Zilch's revenue comes from merchant fees and advertising, but that
              assertion should be treated as independent review evidence rather than audited financial disclosure.
              Switching costs are modest for consumers because alternative cards and BNPL apps are easy to access. They
              are higher on the merchant side if Zilch's first-party engagement data, rewards and distribution produce
              measurable conversion, but the evidence pool does not provide audited merchant retention, take-rate or
              incremental conversion data.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Pricing, trust and regulatory posture
        blocks:
          - type: paragraph
            body: >-
              The product comparison is favorable on some consumer-facing terms but not unambiguously superior. Which?
              records Zilch's six-week and three-month options, soft checks, no late fee in the compared products, and
              potential credit-score damage from missed payments; it also says Zilch may refer accounts outstanding for
              more than 70 days to a debt-management agency. Fintech Magazine reports that Pay Monthly has a
              representative APR of 14.9% and displays fees at checkout, so “zero-interest BNPL” should not be
              generalized to every new product. UK BNPL regulation changes the basis of competition: Business Expert,
              Which? and City A.M. describe a 15 July 2026 regime with affordability checks, complaints rights and
              clearer disclosures. Zilch's FCA payments licence and Visa principal membership are described by Fintech
              Magazine, but comparative regulatory superiority over rivals is not established by this pool.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The plausible moat is a reinforcing loop between consumer frequency, first-party transaction data, rewards
              personalization and merchant demand. Company-originated 2025 funding coverage reports over 5.3 million
              customers, thousands of retailers and more than £5bn of commerce processed, while Fintech Magazine
              describes Intelligent Commerce as a fast-growing revenue source; neither establishes audited merchant
              retention or contribution margin. Historical Business Insider figures also show why scale comparisons
              require consistent geography and periods: in 2022 it contrasted Zilch's nearly 2.5 million UK users with
              Klarna's previously announced 20 million US users. Counterforces include stronger embedded checkout,
              incumbent ecosystem breadth and credit-loss pressure. City A.M. reported rising Klarna losses and consumer
              credit losses in 2025, showing that even scaled competitors face economics and regulatory pressure. Those
              forces can compress Zilch's advantage before merchant-side monetization is independently proven.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP006
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is the strategic wedge
            body: >-
              Zilch's pay-anywhere card and rewards-led experience can reach transactions beyond an embedded merchant
              checkout, while Intelligent Commerce gives merchants a reason to participate beyond payment acceptance.
            calloutType: strength
            claimRefs:
              - CP002
              - CP005
              - CP006
          - type: callout
            title: Merchant monetization remains the key proof gap
            body: >-
              Public sources describe merchant intelligence and revenue diversification, but this pool does not
              establish retention, incremental conversion, realized pricing or contribution margin for the merchant
              proposition.
            calloutType: risk
            claimRefs:
              - CP006
              - CP008
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Zilch's reported model is merchant-funded rather than primarily interest-funded. Prefetched coverage
              describes merchant commissions, performance advertising, and transaction-related revenue as the core
              streams, with consumer-facing payment options generally avoiding interest and late-payment penalties but
              sometimes carrying upfront or transaction fees. This structure can improve consumer acquisition and
              merchant conversion, but it also makes revenue quality dependent on repeat commerce, merchant demand for
              placement, and the company's ability to price credit and rewards without eroding contribution margin. A
              2026 product expansion added paid membership tiers, with Zilch Extra at £2.99 per month and Zilch Plus at
              £3.99 per month, while Pay Monthly applies a representative APR of 14.9% to eligible purchases of £75 or
              more. These are list or stated product terms, not evidence of realized blended pricing or profit by
              cohort. A lastminute.com partnership also added a travel offer with up to 3% cashback and six-week or
              three-month interest-free payment options.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI006
              - CI011
      - number: '4.2'
        title: Traction, margins, and operating economics
        blocks:
          - type: paragraph
            body: >-
              Publicly reported operating metrics point to meaningful scale, but the evidence is uneven in quality,
              currency, and period. EntrepreneurPlus reports FY2025 revenue of £110.3 million, a 93% increase, a £10.5
              million net loss, a 49% gross-profit margin versus 39% in FY2024, and £1.9 billion of GMV. Great
              Entrepreneurs separately reports 2024 revenue of $142 million and a $13.6 million annual pre-tax loss;
              those USD figures should not be silently normalized to the GBP presentation without the underlying
              accounts. EntrepreneurPlus also says administrative expenses rose 7% while revenue rose 93%, and average
              customer spending reached £2,369 annually. Zilch and media coverage separately report more than 5.3
              million customers and more than £5 billion of commerce processed, but those are company-reported scale
              indicators rather than audited cohort economics. CAC, retention, charge-offs, loss rates, funding cost,
              servicing cost, and contribution margin remain unavailable.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Zilch announced more than $175 million of combined debt and equity in November 2025, alongside an
              expansion of its Deutsche Bank-led securitization facility. One account describes a £150 million facility
              against approximately £3 billion of annual origination, while another describes £10 billion of annual
              commerce. Origination and commerce are different denominators, so these source-specific descriptions
              should not be treated as conflicting facility limits or as a single normalized runway figure. The
              announced uses—above-the-line marketing, product and platform development, and potential acquisitions—are
              growth uses rather than disclosed cash-on-hand or burn coverage. The company therefore appears dependent
              on continued debt-market access and disciplined credit performance, while cash balance, undrawn
              availability, maturity schedule, covenants, warehouse advance rates, and next-round triggers remain
              private. A 2026 report also notes that a financing backer previously reneged on a term sheet, an adverse
              reminder that capital availability is not assured.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is strongest where platform scale and monetization direction are visible:
              merchant-funded revenue, paid membership, payments infrastructure, and reported improvement in gross
              margin and losses suggest operating leverage may be emerging. The case is weaker where an investor needs
              to underwrite cash generation and downside resilience. Public materials do not provide a consistent
              revenue bridge by stream, realized merchant take rate by cohort, credit-loss and funding-cost waterfall,
              customer acquisition payback, merchant retention, or cash runway. The latest financing can fund growth,
              but it is not equivalent to unrestricted cash available to absorb losses or finance receivables.
              Underwriting should therefore use reported revenue and GMV as separate metrics, model debt capacity and
              credit losses explicitly, and require current management accounts and facility documents before relying on
              a durable margin path.
            claimRefs:
              - CI006
              - CI011
              - CI014
              - CI015
              - CI017
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diversified monetization is becoming more explicit
            body: >-
              Merchant commissions, advertising, transaction revenue, memberships, and longer-duration payment products
              give Zilch more than one monetization lever, although public evidence does not quantify the mix.
            calloutType: strength
            claimRefs:
              - CI001
              - CI003
              - CI004
          - type: callout
            title: Financing dependency remains a core blocker
            body: >-
              The latest raise and securitization expansion support scale, but public sources do not disclose cash
              runway, facility covenants, or receivables-loss coverage.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI015
          - type: callout
            title: Underwrite the missing bridge, not just the headline growth
            body: >-
              Require current management accounts, merchant contracts, receivables and funding schedules, cohort loss
              data, and cash-flow forecasts before treating reported growth or the latest raise as evidence of durable
              cash generation.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI011
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Zilch's public product surface is broader than a single checkout loan. The current company description
              combines debit, credit, instalments, earned-wage access, credit building, deals, and rewards in one
              payments proposition, while an older independent description shows the core customer choice between paying
              immediately for a reward and spreading a purchase over six weeks. That older account also describes
              virtual-card acceptance through Mastercard, which reduced the need for each merchant to complete a bespoke
              integration, although the current commercial and eligibility rules are not public. Since then, the surface
              has expanded into bank-based repayment through Plaid, a lastminute.com-powered travel experience,
              merchant-facing Intelligent Commerce, and a Reward integration intended to place retailer offers inside
              the payment journey. These are distinct workflows with different counterparties and maturity levels, not a
              single internally owned product stack. The module and workflow exhibits therefore label announcements,
              live partner capabilities, and unresolved rollout questions separately.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
              - CE011
              - CE012
              - CE014
              - CE015
      - number: '5.2'
        title: Architecture and external dependencies
        blocks:
          - type: paragraph
            body: >-
              The most concrete public engineering account is Innovify's supplier case study from Zilch's original
              build. It says the launch platform used AWS serverless microservices, continuous-delivery pipelines,
              optimized transaction data paths, and a low-latency event system; it also names GPS, Xero, and Cash Flows
              as integration dependencies. Those details are useful evidence of implementation choices, but they are
              supplier claims about an earlier build rather than a current architecture inventory or independently
              reproduced benchmark. The present operating model adds material external layers: Plaid provides Pay by
              Bank and virtual-account capabilities, lastminute.com powers the travel product, and Rezolve AI's Reward
              platform supplies retailer engagement. The resulting architecture is best understood as an orchestration
              layer across payment, banking, commerce-media, travel, and cloud services. Public sources do not disclose
              service boundaries, failover design, vendor SLAs, data-sharing terms, or which components Zilch now
              operates directly.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE014
              - CE016
          - type: table
            tableRef: TE003
