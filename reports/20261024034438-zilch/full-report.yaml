    title: Company milestone timeline
    type: timeline
    summary: >-
      The evidence traces Zilch from founding and regulatory sandbox entry to scaled payments infrastructure and the
      July 2026 BNPL regime.
    data:
      items:
        - date: '2018'
          label: Company founded
          details: Philip Belamant, Serge Belamant, and Sean O'Connor founded Zilch.
          tone: neutral
          claimRefs:
            - CO002
        - date: '2019'
          label: FCA sandbox entry
          details: Zilch entered the FCA Regulatory Sandbox Programme and began external beta testing.
          tone: neutral
          claimRefs:
            - CO003
        - date: 2020-04
          label: Consumer-credit licence
          details: Zilch obtained a UK consumer-credit licence.
          tone: positive
          claimRefs:
            - CO004
        - date: 2020-09
          label: UK consumer launch
          details: The Zilch app launched to UK consumers.
          tone: positive
          claimRefs:
            - CO005
        - date: 2024-07
          label: Quarterly profitability
          details: Later reporting states that Zilch reached quarterly profitability; audited annual profit is not established.
          tone: positive
          claimRefs:
