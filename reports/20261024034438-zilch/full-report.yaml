chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Zilch is a London-based consumer payments platform that combines flexible payment options with rewards and
              merchant-facing tools. The corporate history in the retained evidence begins with a 2018 founding by
              Philip Belamant, Serge Belamant, and Sean O'Connor, followed by FCA sandbox participation in 2019, a
              consumer-credit licence in April 2020, and a UK consumer app launch in September 2020. The operating model
              is described as an ad-subsidised payments network: advertising and merchant economics help fund rewards
              and interest-free payment options rather than the company relying solely on consumer fees. This
              positioning broadens Zilch beyond a checkout-only BNPL product, but merchant revenue composition and
              contribution economics are not disclosed in the assigned evidence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO011
