        - date: '2025-11-13'
          label: USD 176.7m financing
          details: >-
            A combined debt-and-equity financing led by KKCG was announced, with BNF Capital participation and expanded
            securitisation.
          tone: positive
          claimRefs:
            - CO008
        - date: 2025-11
          label: Scale exceeds 5.3m users
          details: Company-supplied figures reported more than 5.3 million users and over GBP 5 billion of processed commerce.
          tone: neutral
          claimRefs:
            - CO009
            - CO010
        - date: 2026-H1
          label: Zilch Pay scheduled
          details: >-
