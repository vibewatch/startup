        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder influence remains pronounced. Philip Belamant is identified as chief executive and co-founder,
              Sean O'Connor as co-founder, and Serge Belamant as chairman and co-founder; current financing coverage
              also identifies Hugh Courtney as chief financial officer. Sean O'Connor is specifically credited in
              company quotations with contributing network and strategic leadership to the latest financing. The
              evidence establishes functional coverage across executive, finance, and board leadership, but it does not
              establish voting control, ownership percentages, board committee composition, succession arrangements, or
              the current full director population. The resulting key-person and governance assessment is therefore
              directional rather than a complete control analysis.
            claimRefs:
