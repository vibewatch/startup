  - id: FU001
    title: Customer journey from acquisition to expansion
    summary: >-
      Zilch's reported customer path links consumer discovery and payment use to rewards, repeat engagement, and
      merchant-funded expansion, with evidence strength declining at retention and monetization stages.
    type: journey-map
    data:
      items:
        - label: Acquire
          detail: Consumer joins through direct-to-consumer payments and rewards proposition.
          touchpoints:
            - UK launch and reported customer milestones
            - US launch with over 150,000 pre-registrations
        - label: Pay
          detail: Consumer uses debit or instalment options across Mastercard acceptance.
          touchpoints:
            - Pay Now and instalment options
            - Reported acceptance wherever Mastercard can be used
        - label: Reward
          detail: Consumer receives cashback, savings, or membership benefits.
          touchpoints:
            - 2% instant cashback described in launch material
            - Extra and Plus membership tiers
        - label: Repeat
          detail: Usage frequency becomes the key proof of durable engagement.
          touchpoints:
            - Most active users reported near-daily engagement
            - Reported engagement up to roughly 60 times per year
        - label: Expand
          detail: Merchant and consumer surfaces broaden through intelligence, checkout, and salary-access products.
          touchpoints:
            - Intelligent Commerce for merchants
            - Zilch Pay planned one-click checkout
            - Pay Monthly and Zilch Advance
        - label: Retain
          detail: Cohort retention, merchant renewal, and concentration remain private evidence gaps.
          touchpoints:
            - No NRR, GRR, churn, or renewal data retained
            - Trustpilot complaints require monitoring
    approximationNotes: >-
      Analytical sequence synthesized from retained sources; it is not a measured conversion funnel, and retention
      remains an evidence gap.
    claimRefs:
      - CU005
      - CU008
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Time-bound regulatory readiness and opaque credit or funding outcomes carry the highest residual severity despite
      visible licence, network, cloud, and financing mitigations.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Medium impact
          values:
            - Partner substitution
            - Product delay
            - null
        - label: High impact
          values:
            - null
            - Data or network incident
            - Merchant-economics shortfall
        - label: Critical impact
          values:
            - null
            - Funding-capacity reduction
            - Regulatory readiness failure
        - label: Consumer impact
          values:
            - null
            - Complaint escalation
            - Affordability-control weakness
        - label: Execution impact
          values:
            - null
            - Launch under-adoption
            - Repeated delivery delay
        - label: Investment impact
          values:
            - null
            - Valuation compression
            - Combined credit and funding shock
    approximationNotes: >-
      Placements are qualitative analyst assessments, not measured probabilities or company-issued risk scores; null
      cells mean no selected risk was assigned, not zero exposure.
    claimRefs:
      - CR016
  - id: FV001
    title: Recommendation logic
    summary: Scale and financing support the thesis, while regulatory and valuation opacity constrain the decision.
    type: flow
    data:
      nodes:
        - id: scale
          label: Scale
          detail: More than 5.3m users and over £5bn processed are reported.
        - id: proof
          label: Product and capital proof
          detail: $175m combined debt-and-equity raise plus Intelligent Commerce and Zilch Pay.
        - id: risks
          label: Material risks
          detail: FCA regulation, unresolved profitability, credit performance, and financing terms.
        - id: valuation
          label: Price opacity
          detail: Reported approximately $2bn valuation lacks current public cap-table support.
        - id: decision
          label: Research-more
          detail: Require verified economics, permissions, and terms before entry.
        - id: monitor
          label: Diligence gate
          detail: Reassess after verified economics, permissions, retention, and financing terms.
      edges:
        - - scale
          - proof
        - - proof
          - risks
        - - risks
          - valuation
        - - valuation
          - decision
        - - decision
          - monitor
    approximationNotes: The sequence is an analytical decision path, not a quantitative valuation model.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV008
      - CV013
      - CV016
