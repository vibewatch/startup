      - number: '1.3'
        title: Capital and operating scale
        blocks:
          - type: paragraph
            body: >-
              The latest retained financing evidence reports USD 176.7 million of combined debt and equity in November
              2025, led by KKCG with BNF Capital participating and an expansion of Deutsche Bank-led securitisation.
              Multiple retained reports repeat the same transaction attributes, but two are close reproductions of the
              company's announcement and should not be treated as independent confirmation of every detail. The
              company-reported scale markers are more than 5.3 million users and over GBP 5 billion of commerce
              processed. Those figures describe registered reach and transaction volume, not active customers, revenue,
              ARR, cash available, or profitability. No current valuation or cumulative funding total can be responsibly
              inferred from the latest round alone.
            claimRefs:
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: Milestones and regulatory transition
        blocks:
          - type: paragraph
            body: >-
              Zilch's chronology shows a progression from sandbox testing and consumer-credit authorisation into a
              broader payments-infrastructure posture. By February 2026, reporting described an FCA payment-services
              licence and Visa principal membership, while also stating that the company had reached quarterly
              profitability in July 2024. These are meaningful operating milestones, but quarterly profitability is not
              the same as audited annual profit or free cash flow. The external risk perimeter also tightened on 15 July
              2026, when covered UK deferred-payment lenders became subject to FCA authorisation or temporary
              permissions, affordability assessments, Consumer Duty, and eligible Financial Ombudsman escalation.
              Current compliance performance and the actual launch status of products previously scheduled for 2026 are
              not available in the assigned evidence.
            claimRefs:
