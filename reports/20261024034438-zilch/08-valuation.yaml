company:
  name: Zilch
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports Zilch's recent capital access and consumer scale, but it does not disclose enough current operating or cap-table detail to underwrite a clean buy at the reported roughly $2 billion private valuation. The appropriate stance is research-more, with regulation, profitability, financing terms, and commercialization as the decisive diligence points.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is that Zilch has assembled a differentiated consumer-payments
      platform rather than remaining a single-product BNPL lender. Independent and investor
      coverage describes more than five million users, over £5 billion of processed commerce,
      a $175 million debt-and-equity raise, and new Intelligent Commerce and Zilch Pay
      products. Those are meaningful scale and financing signals, but several are company
      statements repeated by counterparties rather than audited KPIs. The anti-thesis is
      valuation opacity: public sources disagree on the latest loss measure, do not disclose
      current revenue quality or retention, and provide no current cap-table or preference
      terms. FCA regulation of deferred-payment credit from 15 July 2026 adds a material
      compliance and unit-economics test, with independent advisers warning that the change
      requires stronger decisioning, reporting, customer-support, and governance systems.
      On balance, the evidence supports monitoring and targeted diligence, not a
      price-insensitive purchase.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV013]
    tableRefs: [TV001, TV002]
  - id: financing-and-price
    title: Financing context and entry discipline
    body: >-
      The November 2025 financing was reported as more than $175 million of combined debt
      and equity, led by KKCG, with an expanded Deutsche Bank securitisation facility. That
      headline is evidence of investor and lender willingness to fund the platform, not
      evidence that $175 million is equity value or cash available to shareholders. Sources
      describe the valuation as about $2 billion, close to the company's own over-$2 billion
      mark from 2021, but the newer amount is not presented in a filing or accompanied by a
      current share price, preference stack, dilution schedule, or net-debt bridge. Companies
      House records a 15 January 2025 allotment, while the accessible filing-history extract
      does not expose its economic terms. Entry discipline therefore requires a verified cap
      table, debt and securitisation obligations, liquidation preferences, and a
      reconciliation of revenue, contribution margin, credit losses, and regulatory costs.
    claimRefs: [CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV003]
  - id: scenarios-and-decision
    title: Scenarios, exit readiness, and decision
    body: >-
      The bull case requires the new products to convert the reported user and retailer
      network into durable, high-margin merchant revenue while regulatory compliance remains
      affordable and the company reaches public-market readiness. The base case assumes
      continued platform growth but slower monetisation, ongoing financing needs, and a
      valuation that remains difficult to defend without private financial disclosures. The
      bear case is a combination of multiple compression, credit-loss or conduct-cost
      pressure, and product-commercialisation failure; a future down round or restrictive
      refinancing would expose dilution and preference overhang. The evidence does not
      support precise probability-weighted returns or a target exit price. A research-more
      recommendation, medium confidence, high risk rating, and stretched valuation stance
      best reflect the evidence. Thesis-break triggers are a regulatory permission failure,
      sustained losses without a credible path to contribution profitability, material
      deterioration in credit performance, or financing terms that subordinate new capital.
    claimRefs: [CV014, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence-based assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a clean buy until current economics and terms are verified]
      - [Confidence, medium, Scale and financing evidence is meaningful but several metrics are company-reported or stale]
      - [Risk rating, high, "Regulation, credit performance, profitability, and financing structure remain material uncertainties"]
      - [Valuation stance, stretched, Reported approximately $2 billion valuation lacks current public price and cap-table support]
    notes: "Assessment is qualitative because current private-company valuation, operating KPIs, and security terms are not fully disclosed."
    claimRefs: [CV002, CV005, CV008, CV013, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Scale and distribution, "Over 5.3m users and more than £5bn processed are reported", "Verified active-user retention, repeat usage, and contribution margin"]
      - [Capital access, "$175m debt-and-equity round led by KKCG", "Audited use of proceeds, debt terms, and equity ownership after the round"]
      - [Product expansion, "Intelligent Commerce and Zilch Pay target merchant monetisation", "Cohort revenue, merchant renewal, and launched-product conversion data"]
      - [Regulatory exposure, "FCA DPC rules require authorisation and responsible lending", "Evidence of permissions, Consumer Duty controls, and post-regulation loss/complaint trends"]
    notes: "Rows distinguish reported scale and financing signals from the additional evidence needed to validate investment quality."
    claimRefs: [CV001, CV003, CV004, CV006, CV007, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "New products scale merchant monetisation; regulation is absorbed without material credit-loss or conduct-cost deterioration", "A higher multiple could be defensible, but no public revenue base supports a numeric target", "Execution, competition, compliance, and financing costs", "Low-to-medium; requires currently unverified operating evidence"]
      - [Base, "User network grows while monetisation and profitability improve gradually; capital remains available", "Hold or selectively enter only after price and terms are verified; no precise return estimate", "Opaque unit economics, dilution, and persistent losses", "Medium; consistent with available but incomplete evidence"]
      - [Bear, "Regulatory or credit-cost pressure combines with slower product adoption and tighter financing", "Multiple compression or down round creates dilution and preference risk", "Conduct costs, credit losses, refinancing, and commercialization failure", "Material downside; public evidence cannot quantify it"]
      - [Decision trigger, "Verify permissions, cap table, loss metrics, retention, and product revenue before entry", "Move from research-more only if evidence supports risk-adjusted return at the actual price", "Missing data itself delays underwriting", "Current status: unresolved"]
    notes: "Scenarios are directional, not a probability-weighted valuation; public sources do not provide a reliable current revenue or cap-table base for precision."
    claimRefs: [CV006, CV008, CV011, CV012, CV013, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    summary: Scale and financing support the thesis, while regulatory and valuation opacity constrain the decision.
    type: flow
    data:
      nodes:
        - id: scale
          label: Scale
          detail: "More than 5.3m users and over £5bn processed are reported."
        - id: proof
          label: Product and capital proof
          detail: "$175m combined debt-and-equity raise plus Intelligent Commerce and Zilch Pay."
        - id: risks
          label: Material risks
          detail: "FCA regulation, unresolved profitability, credit performance, and financing terms."
        - id: valuation
          label: Price opacity
          detail: "Reported approximately $2bn valuation lacks current public cap-table support."
        - id: decision
          label: Research-more
          detail: "Require verified economics, permissions, and terms before entry."
        - id: monitor
          label: Diligence gate
          detail: "Reassess after verified economics, permissions, retention, and financing terms."
      edges:
        - [scale, proof]
        - [proof, risks]
        - [risks, valuation]
        - [valuation, decision]
        - [decision, monitor]
    approximationNotes: "The sequence is an analytical decision path, not a quantitative valuation model."
    claimRefs: [CV001, CV002, CV006, CV008, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive call
    body: "Research-more: the platform has credible scale and financing access, but the reported valuation cannot be tested against current public operating or cap-table evidence."
    claimRefs: [CV002, CV008, CV013, CV016]
  - calloutType: risk
    title: Regulation is an underwriting variable
    body: "From 15 July 2026, FCA rules require relevant DPC lenders to be authorised or temporarily permitted and to comply with regulatory rules; the cost and outcome impact for Zilch require verification."
    claimRefs: [CV006, CV007]
