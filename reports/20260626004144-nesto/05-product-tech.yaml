  - id: trust-compliance-quality
    title: Trust, Regulatory Compliance, and Quality Controls
    body: >-
      nesto holds mortgage brokerage licences in all Canadian provinces and territories, operating
      under provincial regulators such as FSRAO in Ontario, BCFSA in British Columbia, and RECA in
      Alberta, among others. The company operates as both a licensed broker and a direct lender,
      regulated by OSFI Guideline B-20 for residential mortgage underwriting.

      nesto Inc. received a residential mortgage servicer ranking of MOR RS from DBRS Morningstar
      with a Stable trend, a third-party quality signal that regulated institutional clients require
      before outsourcing servicing. CMLS, operating in the commercial space, holds Fitch "Primary,"
      "Master," and "Special Servicer" ratings, which allow it to participate in CMBS and other
      structured-finance transactions.

      On ESG: nesto achieved B Corp certification in 2023, one of the first mortgage companies
      globally to do so, signalling adherence to social and environmental performance standards.
      The NPS score of 70+ is self-reported and substantially above the Canadian financial-
      services industry average, consistent with Trustpilot ratings that average 4/5 across
      1,100+ reviews but also surface recurring complaints about self-employed borrower
      documentation processes and post-inquiry contact frequency. The company has been recognised
      as a Deloitte Technology Fast 50 winner for three consecutive years (2023, 2024, 2025)
      and was named CLA Mortgage Lender of the Year in 2023 and 2024.
