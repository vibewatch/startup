callouts:
  - calloutType: strength
    title: Vertical Integration as Durable Technical Moat
    body: >-
      nesto is the only Canadian mortgage company operating simultaneously as a D2C digital
      lender, a white-label B2B platform provider, an institutional loan processor, a commercial
      lender (CMLS), and a newly launched AI orchestration vendor (Maestro AI). Each layer captures
      data and workflow capabilities that reinforce the others. Competing digital brokers lack
      lender status; traditional banks lack platform agility; niche B2B vendors lack the consumer
      distribution that feeds model training data. This compound flywheel is difficult to replicate
      without nesto's eight-year accumulation of origination, funding, and servicing data.
    claimRefs:
      - CE001
      - CE021
      - CE029
      - CE038

  - calloutType: risk
    title: Maestro AI Is an Unvalidated Architecture Claim
    body: >-
      Maestro AI was launched simultaneously with a C$302 million fundraise—a pattern that often
      reflects marketing-driven timing rather than technical readiness. As of June 2026, there is
      no published architecture document, benchmark, or independent review of Maestro AI's
      capabilities. The claim of "AI-native orchestration" could represent anything from rule-based
      workflow automation to large-language-model reasoning. Enterprise FI clients evaluating
      nesto as a long-term technology partner should treat Maestro AI as pre-production until
      independent validation is available.
    claimRefs:
      - CE025
      - CE042
      - CE041

  - calloutType: insight
    title: GCP + SOC2/ISO27001 Removes Enterprise Procurement Barrier
    body: >-
      Most large Canadian financial institutions run formal third-party risk management (TPRM)
      programs that require cloud providers to demonstrate SOC 2 Type II and ISO 27001 before
      onboarding. nesto's certification trifecta—SOC 1 Type II, SOC 2 Type II, ISO 27001:2022—
      eliminates a typical 6–18-month security-review gate that would otherwise block FI adoption
      of Nesto Cloud. This procurement advantage is likely a material factor in the IG Wealth
      and Canada Life partnerships and significantly expands the addressable market for white-
      label deployments.
    claimRefs:
      - CE018
      - CE019
      - CE020
      - CE022
      - CE023

