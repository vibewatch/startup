  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "Maestro AI architecture and capability"
      missingEvidence: >-
        Independent technical architecture description, benchmark results, or third-party
        evaluation of Maestro AI's capabilities and limitations.
      whyItMatters: >-
        Enterprise FI clients and investors cannot assess whether Maestro AI represents a
        genuine AI-orchestration leap or rebranded workflow automation without independent
        validation. Overstatement risk is material given the launch timing coincided with
        C$302M fundraise.
      diligencePath: >-
        Request architecture documentation, demo deployment, and benchmark results directly
        from nesto; seek reference calls with early Maestro AI enterprise adopters.
      relatedQuestionRefs:
        - QE017
        - QE023

    - type: private-evidence-only
      severity: material
      topic: "Nesto Cloud API specification and developer onboarding"
      missingEvidence: >-
        Public API documentation, integration sandbox, or developer portal for Nesto Cloud
        white-label partners and brokers.
      whyItMatters: >-
        Absence of public developer tooling signals high onboarding friction for smaller
        FIs and limits the self-serve scalability of the B2B business. Competitors with
        open APIs can expand distribution faster. This is an important growth constraint.
      diligencePath: >-
        Request API specs, integration playbook, and average onboarding timeline from nesto
        enterprise sales team; conduct reference calls with deployed FI partners.
      relatedQuestionRefs:
        - QE020
        - QE024

    - type: private-evidence-only
      severity: material
      topic: "Proprietary underwriting algorithm and AI rate-matching model"
      missingEvidence: >-
        Technical description, validation dataset, error rates, and fair-lending compliance
        documentation for nesto's AI-powered underwriting and rate-matching models.
      whyItMatters: >-
        Opaque algorithmic underwriting raises regulatory risk under OSFI and FCAC fair-lending
        principles, particularly for edge-case borrower segments (self-employed, newcomers,
        non-traditional income). Customer complaints about self-employed underwriting suggest
        the model may lack flexibility for non-standard files.
      diligencePath: >-
        Request model risk documentation, OSFI compliance memo, fair-lending audit, and
        complaint resolution data from nesto's Chief Risk Officer.
      relatedQuestionRefs:
        - QE022
        - QE014

    - type: missing-source
      severity: minor
      topic: "Platform SLA, uptime, and incident history"
      missingEvidence: >-
        Published SLA commitments, historical uptime metrics, and incident/post-mortem
        records for nesto's origination and servicing platforms.
      whyItMatters: >-
        Regulated FI partners (IG Wealth, Canada Life) need contractual SLA assurances
        before outsourcing mission-critical mortgage servicing. Absence of public uptime
        data is a gap in the enterprise sales process.
      diligencePath: >-
        Request status page URL, historical uptime report, and contractual SLA terms from
        nesto enterprise team during due diligence.
      relatedQuestionRefs:
        - QE030

    - type: missing-source
      severity: minor
      topic: "Regulatory complaint history and enforcement record"
      missingEvidence: >-
        FCAC complaint data, OSFI supervisory actions, provincial regulator enforcement
        notices, or OBSI case records involving nesto Inc. or CMLS Financial.
      whyItMatters: >-
        Trustpilot complaints about self-employed borrower friction and aggressive post-
        lead calling suggest potential consumer-protection exposure. No regulatory action
        has been found, but absence of evidence is not evidence of absence given the
        limited public database of non-bank enforcement actions in Canada.
      diligencePath: >-
        Search FCAC complaint tracker, provincial regulator enforcement databases
        (FSRAO, RECA, BCFSA), and OBSI annual reports for nesto / CMLS references.
      relatedQuestionRefs:
        - QE014
        - QE030

