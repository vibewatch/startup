  - id: platform-architecture-security
    title: Platform Architecture and Security Infrastructure
    body: >-
      nesto's technology stack is built on Google Cloud Platform (GCP), conferring managed
      infrastructure, auto-scaling, and continuous security-patch coverage. All data in transit
      is encrypted with TLS 1.2 or higher; all data at rest is encrypted with AES-256. The
      platform code undergoes automated static-analysis scanning, mandatory peer review, and annual
      penetration testing before production deployment. A full-time, dedicated security team
      monitors the environment around the clock.

      nesto holds three independent compliance certifications: SOC 1 Type II (controls over
      financial reporting), SOC 2 Type II (security, availability, and confidentiality), and ISO
      27001:2022 (information security and risk management). The combination of GCP-managed
      infrastructure and this certification trifecta supports nesto's enterprise-client ambitions:
      large regulated financial institutions such as IG Wealth and Canada Life require this level
      of assurance before deploying white-label mortgage services.

      The security page explicitly references a Trust Center for enterprise due-diligence inquiries,
      though a public Trust Center URL is not accessible as of June 2026. No public developer
      portal, API documentation, or integration sandbox has been published; onboarding appears to
      occur through direct commercial negotiation rather than self-serve tooling. This opacity
      limits independent technical validation of the platform's architecture claims.
    claimRefs:
