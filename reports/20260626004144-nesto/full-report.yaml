  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              nesto operates in a fragmented Canadian residential mortgage market where no single non-bank player
              commands dominant market share. The competitive landscape divides into four distinct quadrants: (1)
              digital direct lenders that originate on their own balance sheet or via brokerage models; (2) incumbent
              broker networks that aggregate demand and distribute to many lenders; (3) big-bank direct channels with
              branch infrastructure and deep balance sheets; and (4) US-market platforms whose architectures serve as
              capability benchmarks even though they do not operate in Canada. nesto is the only player in the first
              quadrant that also has a meaningful footprint in the second (via the 2024 M3 Mortgage Group partnership)
              and an enterprise B2B cloud offering that aspires to the fourth benchmark category.

              As of June 2026, the broker channel carries approximately 40% of new Canadian mortgage originations — up
              from roughly 30% a few years prior — meaning that any lender without a credible broker-channel presence is
              cut off from a growing plurality of volume. nesto's multi-channel evolution (direct-to-consumer + Nesto
              Cloud B2B + broker channel via M3) is therefore not an optional strategic add-on but a structural
              necessity for reaching the volume required to justify a C$1.47 billion valuation. The competitor profile
              table below captures the eight most relevant competitive reference points.
