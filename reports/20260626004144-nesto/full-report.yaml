  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Series E Context and Valuation Framing
        blocks:
          - type: paragraph
            body: >-
              On June 10, 2026, nesto announced the closing of a C$302 million Series E financing round at a C$1.47
              billion post-money valuation — equivalent to approximately US$1.07 billion or US$216 million at
              contemporaneous exchange rates depending on the conversion used. The round combines primary and secondary
              capital, meaning some earlier investors or founders achieved partial liquidity. New investors include La
              Caisse (formerly CDPQ), Fidelity Investments Canada ULC, PICTON Investments, and Endeavor Catalyst.
              Existing backers Portage, Diagram, NAventures, Fonds de solidarité FTQ, and Fondaction all
              re-participated, signaling continued conviction across the cap table.

              The round confers unicorn status — a C$1 billion or greater valuation — making nesto the first Canadian
              mortgage technology company to reach this threshold. La Caisse's lead position is strategically
              significant: it is Quebec's principal institutional investor managing over C$452 billion in net assets,
              whose investment mandate carries both financial and Quebec-ecosystem objectives. Kim Thomassin, Executive
              Vice-President at La Caisse, stated the investment "reflects our confidence in nesto, a Montréal-based
              fintech that stands out for its business model and innovative approach."

              nesto's total publicly disclosed capital raised now stands at a minimum of C$458 million across Series B
              (C$76 million, 2021), Series C (C$80 million, 2022), and Series E (C$302 million, 2026). The Series D
              (2024) amount was undisclosed. The Series E includes a secondary component whose mechanics — share count,
              founder dilution, preference stack — remain private, preventing precise cap-table analysis. Despite this
              opacity, the round's institutional breadth and La Caisse's lead are meaningful validation signals for the
              C$1.47 billion mark.
