  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Revenue and gross margin
        - No public revenue figure; no gross margin; no unit economics by product line
        - Cannot verify whether C$1.47B implies 3–5x P/S or a stretched 6–8x; drives all scenario analysis
        - Request audited management accounts or CFO-level data room disclosure
      - - Cap-table and preference stack
        - No disclosure of share count, preference waterfall, or founder dilution post-Series E
        - Secondary component in Series E suggests partial liquidity; preference overhang affects return math
        - Request cap-table summary and waterfall model from lead investor (La Caisse)
      - - Nesto Cloud contract book
        - Contract values, renewal rates, and churn for IG Wealth, Canada Life, Alterna Savings not disclosed
        - B2B platform is the core valuation premium over pure originator; without ARR visibility, it is narrative
        - Request partner contract summaries (NDA-protected); seek management reference checks with partners
      - - Maestro AI monetization
        - Maestro AI launched concurrently with Series E; no revenue, customer, or contract data available
        - AI platform expansion is the bull-case catalyst; without evidence of traction, it is a future option only
        - Seek signed LOIs, early adopter disclosures, or product roadmap with revenue targets
      - - Operational complaint resolution
        - Trustpilot reports of harassment, data concerns, and service failures (June 2026); no public resolution
        - OSFI/FCAC complaint data and any open regulatory inquiries could materially affect licensing
        - Request complaint-handling data, regulatory communication log, and OSFI correspondence
    notes: >-
      Diligence asks are prioritized in order of materiality to valuation. All items are standard for a late-stage
      private growth company entering IPO preparedness; absence of this data is a deliberate private-market norm, not
      necessarily a red flag, but it constrains the conviction level.
