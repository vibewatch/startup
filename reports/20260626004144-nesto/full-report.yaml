      - number: '2.3'
        title: Buyer Segmentation and Channel Preference
        blocks:
          - type: paragraph
            body: >-
              The 2026 CMHC Mortgage Consumer Survey—conducted January 7 to February 1 2026 with a nationally
              representative sample of 4,112 Canadians who had taken out a mortgage in the prior 18 months—provides the
              most granular available picture of borrower behaviour at the peak of the renewal wave. By transaction
              type, renewers accounted for 66 percent of the sample, refinancers for 19 percent, first-time homebuyers
              for 11 percent, and repeat buyers for the remaining five percent. This distribution confirms that the 2026
              market is predominantly a renewal market, not a new-purchase market, and that comparison-platform utility
              is most relevant for the majority renewing cohort.

              First-time homebuyers skew young (42 percent aged 25–34) and relatively high-income (49 percent earning
              C$105,000 or more), reflecting affordability barriers that have pushed the average down-payment savings
              period to 4.7 years. Seventy-two percent of first-time buyers were previously renting for an average of
              7.6 years. Mortgage brokers rank as the second most valued professional resource for mortgage consumers at
              24 percent; approximately 45 percent of first-time buyers chose the broker channel.

              Digital adoption is pervasive and deepening: 77 percent of mortgage consumers conducted online research,
              33 percent used rate comparison websites, 32 percent consulted broker websites, and 46 percent of online
              researchers submitted a pre-approval application online. Sixteen percent used AI tools during the research
              phase. One in three completed their entire transaction remotely. Despite broadly positive outcome metrics,
              42 percent of 2026 mortgage consumers expressed regrets about some aspect of their most recent
              transaction—a persistent dissatisfaction signal that transparency-focused digital brokers and platforms
              are structurally positioned to address.
