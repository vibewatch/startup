            body: >-
              Nesto Cloud is the company's white-label B2B mortgage origination and servicing platform, launched
              alongside the C$80 million Series C in December 2022. It exposes nesto's end-to-end origination, funding,
              and servicing capabilities through a branded interface that partner financial institutions present to
              their own clients. Documented deployments include IG Wealth Management, which uses Nesto Cloud to deliver
              digital mortgage services to its advisor network; and Canada Life, where Nesto Group assumed residential
              mortgage servicing and administration for Canada Life's existing portfolio. Both case studies emphasise
              live status tracking, mobile document upload, and rapid turnaround as differentiating features of the
              platform.

              In January 2024 nesto entered the broker channel through an exclusive alliance with M3 Mortgage Group, the
              largest broker network in Canada with over 8,500 affiliated brokers. The partnership stipulates identical
              rates between the D2C and broker channels—an unusual commitment that addresses the traditional concern
              that digital lenders undercut brokers on rate. Alterna Savings, a credit union, subsequently partnered
              with Intellifi, Nesto Group's operations subsidiary, to streamline mortgage processing for Alterna members
              and brokers.

              Maestro AI was launched in June 2026 concurrently with the Series E closing. It is described as an
              "AI-native orchestration platform designed to drastically simplify end-to-end mortgage operations and
              modernise financial workflows." As of the report date, no independent technical review, architecture
              document, or benchmark has been published. The platform appears to be an orchestration layer sitting above
              Nesto Cloud rather than a standalone product, but the precise scope of automation—rule-based workflow
              automation, large-language-model reasoning, or probabilistic underwriting—has not been disclosed.

              Intellifi is a wholly owned operations subsidiary providing loan-processing services to Nesto Group and
              third-party institutions. CMLS, acquired in June 2024, extends the group's platform into commercial and
              multi-family mortgage origination, funded by its own 50-year institutional lending history and rated by
              both DBRS and Fitch.
