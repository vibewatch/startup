  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and Consumer Workflow
        blocks:
          - type: paragraph
            body: >-
              nesto's consumer-facing product suite covers the full residential mortgage lifecycle for Canadian
              homeowners. On the purchase side, borrowers complete a fully digital application— from AI-powered rate
              discovery to conditional approval—without visiting a branch or speaking to a commissioned broker. All
              advisors are salaried, and rates are published transparently on the platform with no haggling required.

              The renewal workflow is particularly commercially important. Federal regulators (OSFI) removed the
              stress-test requirement for uninsured-mortgage switchers in November 2024, eliminating a historical
              barrier that caused 66 percent of Canadians to auto-renew with their original lender. nesto's digital
              renewal transfer process capitalises on this change by advertising a 15 percent rate advantage over Big 6
              bank posted rates on insured mortgages. The platform locks in the agreed renewal rate for up to 150
              days—the longest publicly advertised rate-hold by a major Canadian lender.

              The Prime Time Mortgage is a proprietary variable-rate product that lets borrowers convert to fixed at any
              time, penalty-free. The HELOC product, launched in 2025–26, offers a revolving line of credit secured
              against home equity at Prime+0.50% (4.95% as of June 2026), with no monthly fees, no withdrawal fees, and
              interest-only payment options. The Financial Advisor channel extends the D2C platform to third-party
              advisors, enabling them to refer clients into a white-labelled digital application flow with document
              upload and status tracking. nesto has served 450,000+ Canadians and staffs 310+ salaried mortgage experts
              nationwide.
