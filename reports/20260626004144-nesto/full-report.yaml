              startups. The 150-day rate lock is a product-level moat that materially reduces borrower switching
              incentives once a rate is locked.

              Commoditization risk is highest in consumer rate-comparison: as WOWA, Ratehub, and digital brokers all
              aggregate and publish current rates, the rate transparency nesto once pioneered is now table stakes.
              nesto's response — transitioning from rate leadership to platform leadership (Nesto Cloud, Maestro AI,
              CMLS commercial) — is directionally sound but execution-dependent. The M3 channel partnership is a forcing
              function: broker- submitted volume now flows through nesto's underwriting, creating dependency risk if M3
              shifts lender preference back toward banks (post-BMO BrokerEdge) or toward competing digital monolines.

              The structural displacement risk is from the Big Six banks deploying their own AI- powered origination
              stacks — RBC, TD, and BMO each have multi-billion-dollar technology budgets — but incumbents have
              historically been slow to self-disrupt mortgage processes. The convergence rerun in 12–24 months will test
              whether Maestro AI delivers measurable unit-economics improvements before the banks close the technology
