      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case rests on nesto successfully monetizing its AI platform (Maestro AI) as a horizontal
              financial services layer beyond mortgages. If Maestro AI attracts multiple financial institution clients
              paying SaaS-style licensing fees, and origination volumes sustain above C$45 billion annually, nesto could
              reach C$500–700 million in revenue within three years. At a 5–6x P/S multiple on C$600 million revenue,
              the implied valuation would be C$3.0–3.6 billion, a 2–2.5x uplift on the current C$1.47 billion mark. This
              scenario requires that the Canadian and broader mortgage market remains active, that AI platform adoption
              by financial institutions accelerates, and that nesto successfully defends its margin against bank
              competition in the broker channel.

              The base case assumes revenue grows at a 20–30% compound annual rate consistent with the Deloitte Fast 50
              three-year trajectory, reaching approximately C$450–550 million in revenue by 2027–2028. At a 3.5–4.5x P/S
              multiple consistent with public fintech peers at their growth stage, the implied valuation range would be
              C$1.6–2.5 billion, representing a modest exit premium over the current round. An IPO or strategic
              acquisition at these levels within three to five years is plausible given La Caisse's typical investment
              horizon.

              The bear case involves a sustained housing market correction — driven by global trade uncertainty,
              unemployment, or renewed rate increases — that compresses origination volumes by 25–35%. Revenue would
              fall to C$200–275 million. At 3.0–3.5x P/S on compressed revenue, the implied valuation is approximately
              C$600–960 million, below the Series E mark. In this scenario a flat or down round at next fundraise, or a
              forced acquisition at below-Series E levels, is plausible. Blend Labs' FY2022 experience — which involved
              a US$449.7 million goodwill and intangible impairment — illustrates how rapidly mortgage platform
              valuations can compress when the rate cycle turns. The Bank of Canada Financial Stability Report 2026
              noted that "vulnerabilities have increased in some parts of the system," providing macroeconomic context
              for this risk.
