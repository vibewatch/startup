            body: >-
              The incumbent broker networks — Dominion Lending Centres (DLC) and Mortgage Alliance — are the largest
              distribution intermediaries in Canadian residential mortgage origination. DLC claims 4,200 brokers across
              500+ offices, a 20-year operating history, and self- reports funding more mortgages than any other
              organization in Canada. Mortgage Alliance describes itself as the "#1 place to connect with the Right
              Broker" with 20+ years of operation and a single-application multi-lender model. These networks are
              channel competitors for consumer origination but are also potential lender clients for nesto — DLC brokers
              submit deals to nesto when nesto's rates are competitive. The critical strategic context: nesto's 2024
              partnership with M3 Mortgage Group (Canada's largest broker network by some measures, with access to the
              Maestro AI orchestration layer) converts what was once a pure distribution competitor into a channel
              partner, with broker- submitted deals funding through nesto's underwriting and balance sheet.

              Canada's Big Six banks — particularly RBC, TD, and BMO — are the most formidable structural competitors.
              RBC's mortgage platform combines online pre-approval, a Home Value Estimator, and in-person or video
              mortgage advisors, backed by Canada's largest retail banking franchise. TD's integrated digital banking
              ecosystem bundles mortgages with chequing, savings, and credit products that create powerful cross-sell
              lock-in. BMO re-entered the broker channel in early 2024 via BMO BrokerEdge, partnering with First
              National for underwriting, directly competing with nesto for broker-submitted premium mortgages. The
              banks' competitive strength lies not in origination innovation but in balance sheet depth, deposit funding
              advantages, and the friction of full relationship switching — factors that make them durable but
              slow-moving incumbents rather than technology disruptors.
