  - id: TR005
    title: Mitigation and Kill Criteria
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Regulatory (OSFI MQR increase)
        - OSFI annual MQR review announcement
        - MQR floor increases above 5.75% or buffer above 2.5%
        - Model origination volume impact; reassess growth projections; diligence ask on insured vs. uninsured mix
      - - Regulatory (FINTRAC / FCAC enforcement)
        - Public enforcement register at FINTRAC; FCAC press releases
        - Any public enforcement notice naming nesto
        - Thesis break; request immediate remediation evidence; review compliance team depth
      - - Market (housing price correction)
        - CREA national average price index; CMHC RMIR quarterly delinquency data
        - National average price decline >15% over 12 months or delinquency rate >0.5%
        - Stress-test nesto's credit-loss reserve adequacy; assess MUA impairment exposure
      - - Operational (AI model failure)
        - Regulatory complaint filings with FCAC; public Trustpilot / Google review volume spike
        - >-
          More than 5 FCAC complaints in a quarter referencing AI-driven credit decisions or 1-star Trustpilot volume
          doubles
        - Demand evidence of model monitoring, backtesting, and independent audit; consider thesis-adverse
      - - Partner (M3 exit or dispute)
        - Industry press (Canadian Mortgage Trends, MPA); M3 public communications
        - Any M3 announcement of new exclusivity with a competing platform, or nesto-M3 dispute reported
        - Thesis break for broker-channel origination projections; demand immediate channel diversification plan
      - - Financial (warehouse facility withdrawal)
        - Any public bank credit-facility disclosure referencing nesto; changes to securitization spreads
        - Securitization spreads for non-bank Canadian mortgage lenders widen >100bps over 6-month period
        - Assess funding cost impact on NIM; model origination slowdown; demand evidence of facility diversification
      - - People (CEO/CTO departure)
        - LinkedIn executive changes; press releases
        - Departure of Malik Yacoubi or Karim Benabdallah without disclosed successor in place
        - Investor concern trigger; request board succession plan; assess interim leadership bench
    notes: >-
      Kill criteria are defined as thesis-break triggers requiring immediate investor re-evaluation. Thresholds are
