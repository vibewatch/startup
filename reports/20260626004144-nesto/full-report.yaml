      - number: '7.3'
        title: Operational, AI, and Technology Risk
        blocks:
          - type: paragraph
            body: >-
              Maestro AI, launched concurrently with the June 2026 Series E, is described by nesto as an "AI-native
              orchestration platform designed to simplify end-to-end mortgage operations." The platform is intended to
              automate high-stakes mortgage workflow decisions at enterprise scale for both nesto's own originations and
              its Nesto Cloud B2B clients. AI model risk in mortgage lending is material: a miscalibrated credit or
              appraisal model could systematically under-qualify or over-qualify borrowers, creating either adverse
              selection (accepting too many high-risk loans) or reputational harm (denying credit to creditworthy
              applicants). No public regulatory guidance specific to AI in Canadian mortgage underwriting has been
              released; compliance standards are being extrapolated from OSFI's general technology-risk guidance and
              FCAC's consumer-protection framework.


              nesto's June 2026 Trustpilot profile shows a 4/5 "Great" score, which is positive but masks specific
              operational failure modes. A June 25, 2026 review describes daily telephone calls from nesto's sales team
              for three months after an abandoned application—a practice that, if systemic, could expose nesto to CASL
              (Canada's Anti-Spam Legislation) violations and FCAC complaints. A June 10, 2026 review from a
              self-employed borrower documents near-70 email exchanges, repeated document requests, and a coordination
              breakdown between sales and underwriting—operational complexity consistent with a rapid scaling period. A
              March-April 2026 review flags slow renewal response times and stressed staff. These signals, while not yet
              material from a regulatory standpoint, indicate that nesto's customer-service infrastructure may be
              lagging its origination growth.


              The CMLS acquisition (2024) integrated a commercial mortgage operation with different risk
              characteristics—longer loan terms, larger individual exposures, and different default dynamics—into a
              platform optimised for residential mortgages. The Intellifi subsidiary provides loan processing services;
              operational dependency on a captive subsidiary creates single-point-of-failure risk if Intellifi's
              capacity is insufficient during volume surges. nesto's engineering blog (medium.com/nesto-engineering)
              confirms active AI and platform development, supporting the technical ambition, but also a continuous
              change cycle that increases integration and regression risk.


              Data security is a specific concern given nesto's data footprint: credit scores, income documents,
              property appraisals, government ID, and browsing data for hundreds of thousands of borrowers. The December
              2025 privacy policy confirms sharing with promotional and advertising partners, creating a broader attack
              surface than a traditional bank. No public breach notifications have been identified, but the 72-hour
              breach notification requirement under Quebec's Law 25 means any incident would become public rapidly.
