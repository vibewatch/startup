      - number: '4.5'
        title: Financial Gaps, Risks, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              The dominant financial diligence gap is nesto's comprehensive opacity on revenue, margins, and capital
              structure. Revenue, ARR, gross margin, EBITDA, headcount, net debt, and the CMLS acquisition price are all
              undisclosed. The Series D raise amount is also undisclosed. These are not unusual omissions for a private
              company, but they prevent confident financial underwriting. The investor base — La Caisse, FIC, National
              Bank, IGM Financial/Portage — represents institutions with access to the full financial picture; public
              diligence cannot replicate this.


              Key financial risks include: (1) Balance-sheet capital intensity — nesto is a direct lender with C$80B+
              MUA, and any funding market disruption (widening warehouse line spreads, MBS market seizure) could rapidly
              impair liquidity and squeeze NIM. Canadian non-bank lenders were tested in 2020 and 2022 credit
              dislocations; nesto's ability to weather a credit event is untested at current scale. (2) Rate compression
              risk — if the Bank of Canada cuts rates further or competitors match nesto's pricing, NIM compression is
              unavoidable. (3) Operational scaling — Trustpilot adverse reviews from 2026 suggest the human-in-the-loop
              underwriting model is under strain. (4) Revenue concentration — if the IG Wealth and Canada Life B2B
              contracts represent a substantial portion of Nesto Cloud revenue, a non-renewal or contract repricing
