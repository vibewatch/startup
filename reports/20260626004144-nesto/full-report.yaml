  - id: FV001
    title: Recommendation Logic Chain
    type: flow
    layout: standard
    summary: >-
      Chain from evidence inputs through scale, proof, and risk assessments to the track recommendation with fair
      valuation stance.
    data:
      nodes:
        - id: scale
          label: 'Scale: C$80B MUA, C$37B+ 2026 originations, profitable'
        - id: proof
          label: 'Proof: La Caisse lead, Fidelity, PICTON; 3x Deloitte Fast 50'
        - id: platform
          label: 'Platform: Nesto Cloud B2B + Maestro AI optionality'
        - id: risk
          label: 'Risk: Revenue opacity, mortgage cyclicality, Trustpilot complaints'
        - id: valuation
          label: 'Valuation: C$1.47B; estimated ~4x P/S; in-line with public comps'
        - id: recommendation
          label: 'Recommendation: TRACK | Confidence: Medium | Stance: Fair'
      edges:
        - from: scale
          to: recommendation
          label: supports fair valuation
        - from: proof
          to: recommendation
          label: institutional validation
        - from: platform
          to: recommendation
          label: upside optionality
        - from: risk
          to: recommendation
          label: constrains to track vs. buy
        - from: valuation
          to: recommendation
          label: not cheap enough to buy through risk
