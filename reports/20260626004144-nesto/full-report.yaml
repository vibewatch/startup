    type: matrix
    layout: standard
    summary: >-
      Likelihood (columns: Low / Medium / High) versus Impact (rows: Critical / High / Medium / Low) for nesto Group's
      top risks, with residual severity indicated by risk label placement.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
        - label: Critical Impact
          values:
            - Warehouse facility withdrawal
            - Housing price correction (>15%)
            - OSFI MQR increase
        - label: High Impact
          values:
            - FINTRAC enforcement action
            - AI model miscalibration; M3 partner exit
            - Regulatory compliance gap (AMF/FSRA/PIPEDA)
        - label: Medium Impact
          values:
            - CMLS integration failure
            - Customer-service failure; Data breach
            - Self-employed underwriting complexity
        - label: Low Impact
          values:
            - ''
            - Intellifi capacity constraint
            - Trustpilot complaints (CASL/FCAC)
    approximationNotes: >-
      Qualitative likelihood and impact placements based on evidence gathered as of June 2026; no actuarial
      loss-frequency data available for non-bank Canadian mortgage lenders.
    claimRefs:
      - CR003
      - CR012
      - CR022
      - CR024
      - CR033
