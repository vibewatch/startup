  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Origination volume decline
        - Annualized originations fall below C$25B (>30% decline)
        - Compresses revenue below C$200M; validates bear case; down-round risk at next financing
        - Exit or reduce position; demand revenue disclosure before re-entry
      - - Nesto Cloud partner loss
        - Any of IG Wealth, Canada Life, or Alterna Savings termination
        - Reduces B2B revenue and multi-sided platform narrative; challenges AI licensing pitch to new clients
        - Escalate to material adverse change; seek revenue disaggregation
      - - Regulatory / compliance action
        - OSFI, FCAC, or provincial regulator enforcement or public warning
        - Operational disruption; reputational damage; potential lending license risk
        - Pause any additional investment; assess materiality within 30 days
      - - Management departure
        - Loss of CEO Malik Yacoubi or CTO Karim Benabdallah within 18 months of Series E
        - Signals strategic misalignment with La Caisse or internal structural issues
        - Initiate dialogue with lead investor; do not commit new capital
      - - Bank of Canada rate reversal
        - BoC overnight rate rises above 3.5% in 2026–2027
        - Housing affordability deteriorates; origination volumes compress; renewal advantage narrows
        - Stress-test origination forecast; reduce bear-case valuation target
    notes: >-
      Triggers based on publicly available information about nesto's business model dependencies and macro signals from
      Bank of Canada FSR 2026.
