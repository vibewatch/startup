      - number: '8.6'
        title: Final Recommendation and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Recommendation: Track. nesto is a high-quality company in a defensible market position, and C$1.47 billion
              is a fair valuation relative to public fintech mortgage peers at estimated revenue multiples. However, the
              complete absence of disclosed revenue, margin, and cap-table data prevents a conviction buy call at this
              stage. An investor entering at this round must underwrite the profitability claim, the origination-volume
              trajectory, and the Nesto Cloud contract book entirely on trust in the institutional investor syndicate.
              That is an above-average risk position for the multiple implied.

              The key diligence items that would move this recommendation from track to buy are: confirmed revenue in
              the C$300–450 million range with 50% or better gross margin, Nesto Cloud contract values and renewal rates
              demonstrating sticky B2B economics, Maestro AI revenue contribution or signed LOIs, and cap-table clarity
              on preference waterfall and founder dilution at current valuation. A down-round trigger should be set at
              any indication of origination volume below C$25 billion annualized, sustained BoC rate increases above 3%,
              or partner departure from Nesto Cloud.

              The confidence level is medium because institutional validation from La Caisse, Fidelity, and existing
              investors provides meaningful signal, but revenue opacity is unusual for a company of this scale
              approaching potential IPO. Risk rating is high due to mortgage market cyclicality, private-company
              multiple compression risk, and operational complaint signals from Trustpilot. Valuation stance is fair: at
              estimated multiples, the price is consistent with peers but not obviously cheap. Any material downward
              revision to origination assumptions would push the valuation into stretched territory.
            claimRefs:
              - CV007
              - CV010
              - CV028
              - CV033
              - CV040
              - CV041
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV010
              - CV031
              - CV037
              - CV039
              - CV041
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Track — Fair Valuation at Estimated Multiple, Revenue Disclosure Needed to Buy
            body: >-
              nesto's C$1.47 billion Series E valuation is anchored by genuine operational scale and institutional
              investor validation, but cannot be confirmed against actual revenue without a financial disclosure. At the
              estimated C$370 million revenue midpoint, the implied ~4x P/S is consistent with public fintech mortgage
              peers. This is a fair price — not a screaming bargain — for a company that remains opaque on its core
              financial metrics. Track until management accounts or an S-1 provide the missing evidence. Move to buy if
              revenue confirms above C$300M with gross margin above 45% and Nesto Cloud contract values above C$50M ARR.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV010
              - CV028
              - CV045
          - type: callout
            title: Revenue Opacity Is the Central Risk — Not Business Quality
            body: >-
              The principal risk in nesto's current valuation is not company quality, which is strong, but the absence
              of any public financial disclosure that would allow verification of the revenue multiple. Blend Labs' 2022
              experience demonstrates that private fintech mortgage valuations can collapse rapidly in a rate cycle
              downturn. With no revenue reference, a potential investor must price on trust in the institutional
              syndicate rather than on verified fundamentals.
            calloutType: risk
            claimRefs:
              - CV010
              - CV041
              - CV043
          - type: callout
            title: La Caisse Lead Is a Credible Institutional Anchor
            body: >-
              La Caisse is one of the world's most credible institutional investors in the Canadian context, managing
              over C$452 billion in assets and taking long-term equity positions in Quebec-based companies. Its decision
              to lead the Series E rather than merely participate signals a conviction level that goes beyond
              financial-only analysis. Fidelity Investments Canada and PICTON Investments further diversify the investor
              base beyond Quebec-mandated capital.
            calloutType: strength
            claimRefs:
              - CV004
