chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              nesto was founded in 2018 in Montreal, Quebec, Canada, by four co-founders: Malik Yacoubi (CEO), Karim
              Benabdallah (CTO), Damien Charbonneau (COO), and Chase Belair (Principal Broker). The company formally
              operates as Nesto Inc. under the Nesto Group holding structure and is headquartered in Montreal, with
              offices across Canada. Its stated mission is to build "Canada's Mortgage Ecosystem of the Future" — a
              deliberate framing that signals both its consumer brand aspiration and its B2B infrastructure ambitions.


              The business runs on two interlocking rails. The consumer rail (nesto brand) is a direct-to-consumer
              digital mortgage lender offering home purchase mortgages, renewals, refinancing, and home equity lines of
              credit (HELOC) with a 150-day rate lock guarantee — the longest advertised by a major Canadian lender. The
              institutional rail (Nesto Cloud) is a proprietary B2B white-label platform that automates mortgage
              origination, funding, and servicing for financial institutions including IG Wealth Management, Canada
              Life, and Alterna Savings. CMLS, acquired in June 2024, extends the platform into commercial mortgage
              lending and brings 50 years of institutional mortgage expertise. Intellifi is an operations subsidiary
              providing loan processing services. The newest component, Maestro AI — launched concurrent with the June
              2026 Series E — is an AI-native orchestration layer designed to simplify end-to-end mortgage workflows at
              enterprise scale.


              nesto describes Canada's outstanding mortgage market as approximately C$2.1 trillion (citing CMHC), and
              positions its integrated approach — combining DTC lending, B2B technology licensing, broker-channel
              partnerships, and AI automation — as a defensible multi-sided strategy. Third-party industry sources
              identify nesto alongside Pine and Strive as digital lenders reshaping the broker experience,
              distinguishing it from traditional bank lenders.
