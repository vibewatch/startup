              Consumer Survey confirms that 66% of all mortgage transactions are renewals, and that 35% of renewing
              borrowers experienced an average monthly payment increase of C$375 due to interest rate changes. nesto
              directly targets this pressure: its renewal page prominently advertises 15% lower renewal rates versus the
              Big Six and calls out that "nearly half of all Canadian mortgages are coming up for renewal before 2027."
              The 150-day rate lock—the longest of any major Canadian lender—is a structural differentiator that reduces
              renewal switching friction and locks in pipeline far in advance. No cohort retention data (what share of
