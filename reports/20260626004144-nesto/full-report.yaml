            body: >-
              nesto's most durable competitive moats are (a) the integrated DTC-plus-B2B-cloud architecture, which no
              other Canadian mortgage lender has replicated at scale; (b) the C$80B+ mortgages under administration that
              generate network effects in data and institutional trust; (c) the 70+ NPS score indicating customer
              experience superiority that drives referral economics; and (d) the CMLS acquisition, which adds 50 years
