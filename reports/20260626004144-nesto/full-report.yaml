      - number: '8.2'
        title: Comparable Set and Multiple Analysis
        blocks:
          - type: paragraph
            body: >-
              Establishing nesto's implied revenue multiple requires estimating its revenue, since the company discloses
              no financial statements. Using a mortgage origination economics framework — net revenue per dollar of
              origination typically ranges from 75 to 125 basis points for a lender combining gain-on-sale, net interest
              margin, and fee income — the C$37 billion-plus in 2026 originations cited by nesto implies an estimated
              revenue range of approximately C$278 million to C$463 million, with a midpoint of roughly C$370 million.
              At C$1.47 billion valuation and C$370 million midpoint, the implied price-to-sales ratio is approximately
              4.0x. This is a rough structural estimate; nesto's actual revenue mix (origination, servicing, B2B
              platform licensing) may yield different economics per origination dollar.

              Public comparable analysis anchors the estimate. Rocket Companies (NYSE: RKT), the largest US digital
              mortgage originator, traded at a price-to-sales ratio of 3.74x and enterprise value-to-revenue of 7.97x on
              a US$8.91 billion trailing revenue base as of June 25, 2026. The high EV/Revenue reflects Rocket's Mr.
              Cooper acquisition-driven servicing scale. Blend Labs (NYSE: BLND), a US mortgage origination software
              platform most analogous to nesto's Nesto Cloud B2B product, traded at 3.44x P/S and 2.77x EV/Revenue on
              US$127.6 million trailing revenue, with an enterprise value of US$334.6 million and levered free cash flow
              of US$12.5 million, suggesting approaching sustainability. EQB Inc (TSX: EQB), Canada's leading
              alternative and digital bank, traded at 3.62x P/S and 25x P/E on C$1.06 billion trailing revenue,
              profitable with a net margin of 18.7%.

              Privately held First National Financial LP remains Canada's largest non-bank mortgage originator and
              provides a reference for pure-play origination economics, though it is not publicly valued on a comparable
              basis. Habito, the UK digital mortgage broker that raised £35 million in 2021, was acquired by Generation
              Home in 2023 at an undisclosed, almost certainly compressed valuation, illustrating the downside scenario
              for digital mortgage intermediaries that do not achieve positive unit economics ahead of a rate cycle
              downturn.

              nesto's estimated 4.0x P/S implied multiple sits between Blend Labs (2.77–3.44x) and Rocket Companies
              (3.74–7.97x), with a modest private company premium reflecting nesto's higher growth trajectory,
              profitable status, and platform optionality. Whether that premium is justified depends on confirming
              revenue trajectory and unit economics, which remain undisclosed.
