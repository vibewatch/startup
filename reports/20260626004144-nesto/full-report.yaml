      - number: '7.4'
        title: Partner Concentration, Competition, and Geographic Risk
        blocks:
          - type: paragraph
            body: >-
              nesto's broker channel operates through an exclusive alliance with M3 Mortgage Group, giving 8,500-plus M3
              brokers access to nesto's products. This exclusivity is simultaneously a strength (guaranteed distribution
              scale) and a concentration risk: nesto has no alternative broker network, and any deterioration in the M3
              relationship—commercial dispute, M3 exiting the partnership, M3 being acquired by a competitor—would
              remove the broker channel entirely. The M3 alliance was only announced in October 2024, making it an
              immature relationship whose durability under stress is untested.


              On the B2B Nesto Cloud side, IG Wealth Management and Canada Life are the two named clients, representing
              concentrated institutional revenue. Loss of either partner—through acquisition, in-sourcing of mortgage
              technology, or competitive displacement—would materially impair B2B revenue. nesto does not disclose the
              revenue contribution of each client or the contract lengths, preventing an independent assessment of
              renewal risk.


              Geographic concentration adds a correlated risk layer: nesto's DTC brand is strongest in Quebec and
              Ontario. Both provinces have above-average household debt levels and large shares of renewing mortgages in
              2026-2027. A provincial housing correction disproportionately concentrated in Quebec or Ontario would hit
              nesto's core markets simultaneously. Ontario real estate regulation (FSRA/RECO) and Quebec's AMF/Law 25
              framework mean that regulatory changes in either province have outsized impact on nesto.


              Competitive risk is intensifying. Pine, Homewise, Strive, and other digital mortgage lenders are targeting
              the same tech-savvy borrower segment. Banks are also accelerating their own digital mortgage capabilities;
              Scotiabank's housing economics team and RBC's housing outlook indicate that major banks remain
              well-capitalised and are competing aggressively for renewal volumes. nesto's 150-day rate-lock and AI
              platform are differentiated, but cannot be patented, and a well-capitalised bank could replicate these
              features with lower funding costs. The Series E valuation of C$1.47 billion implies that nesto must
              sustain significant origination growth and margin expansion to justify the price, leaving little tolerance
              for competitive displacement.
