  - id: FV002
    title: Valuation Sensitivity to Revenue Estimate
    type: bar
    layout: standard
    summary: Implied P/S multiple across a range of estimated nesto revenue scenarios, compared to public comp P/S benchmarks.
    data:
      items:
        - label: C$200M revenue est.
          value: 7.35
        - label: C$302M revenue est.
          value: 4.86
        - label: C$370M revenue est. (midpoint)
          value: 3.97
        - label: C$450M revenue est.
          value: 3.27
        - label: C$500M revenue est.
          value: 2.94
    approximationNotes: >-
      Revenue estimates are derived from origination-economics modelling (75–125bps net revenue per dollar originated on
      C$37B+); actual revenue is not disclosed. Public comp multiples as of June 25, 2026.
    claimRefs:
      - CV011
      - CV013
      - CV017
      - CV018
      - CV022
      - CV027
      - CV028
  - id: FV003
    title: Valuation / Return Range (Bull / Base / Bear)
    type: range
    layout: standard
    summary: >-
      Illustrative exit valuation range across bull, base, and bear scenarios in a 3–5 year horizon assuming IPO or
      strategic acquisition.
    data:
      items:
        - label: Bear Case
          low: 600
          high: 960
          midpoint: 780
          unit: C$M
          note: 25–35% volume compression; C$200–275M revenue; 3.0–3.5x P/S
        - label: Current Valuation (Series E)
          low: 1470
          high: 1470
          midpoint: 1470
          unit: C$M
          note: June 2026 Series E anchor
        - label: Base Case
          low: 1600
          high: 2500
          midpoint: 2050
          unit: C$M
          note: C$400–500M revenue; 3.5–4.5x P/S; 25–30% CAGR
        - label: Bull Case
          low: 3000
          high: 3600
          midpoint: 3300
          unit: C$M
          note: C$550–700M revenue; Maestro AI traction; 5–6x P/S
    approximationNotes: >-
      All ranges are illustrative; based on estimated revenue scenarios and public comparable P/S multiples. No dilution
      adjustment for future financing rounds.
    claimRefs:
      - CV007
      - CV027
      - CV028
      - CV039
      - CV043
  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: IC-ready scoring across seven investment dimensions on a 1–5 scale, with 5 being strongest.
    data:
      items:
        - label: Market Opportunity
          value: 5
          note: C$2.1T Canadian mortgage market; broker channel growth; AI platform expansion
        - label: Proof of Business
          value: 4
          note: C$80B MUA, C$37B+ originations, profitable, Deloitte Fast 50
        - label: Competitive Moat
          value: 3
          note: Multi-brand strategy defensible; bank channel re-entry risk; AI moat unproven
        - label: Unit Economics
          value: 2
          note: Profitable, but no disclosed gross margin, CAC, or LTV data
        - label: Risk Profile
          value: 2
          note: 'High: mortgage cyclicality, revenue opacity, compliance complaints'
        - label: Valuation Discipline
          value: 3
          note: ~4x estimated P/S is fair but not cheap; private premium acknowledged
        - label: Evidence Quality
          value: 3
          note: Strong institutional validation; weak financial transparency; Trustpilot adversity
    approximationNotes: >-
      Scores are qualitative assessments based on public evidence; not quantitative financial model outputs. Evidence
      quality dimension reflects information availability, not company performance.
    claimRefs:
      - CV007
      - CV009
      - CV010
      - CV028
      - CV031
      - CV034
