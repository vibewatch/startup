    approximationNotes: >-
      In-term retention of ~100% reflects the structural industry fact that
      mortgage borrowers are contractually locked in during the term; breaking
      it incurs a prepayment penalty. This is not a nesto-specific loyalty
      metric. The 66% renewal rate is an industry-level figure from CMHC 2026
      MCS representing the share of all mortgage transactions that are renewals;
      it is used here as a market-level proxy for the renewal opportunity facing
      nesto's existing 450K+ borrower book. Nesto-specific cohort data (share
      of 2020–2021 originations that renewed with nesto) is not publicly
      disclosed.
