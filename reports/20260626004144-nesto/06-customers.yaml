    title: Retention and Renewal Evidence Matrix — Industry Benchmarks vs nesto Signals
    type: matrix
    layout: wide
    summary: >-
      Cross-tabulation of nesto segments and the CMHC 2026 industry benchmark
      against four dimensions: in-term retention, renewal-stage signal, source
      basis, and evidence confidence. Null cells indicate data not publicly
      available for that segment-dimension combination.
    data:
      columns:
        - In-Term Retention
        - Renewal-Stage Signal
        - Evidence Source
        - Confidence
      rows:
        - label: nesto DTC Mortgagors (est.)
          values:
