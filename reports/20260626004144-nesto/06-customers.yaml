  summary: >-
    nesto serves 450,000+ Canadians under its DTC brand and 500,000+ across the
    full Nesto Group as of mid-2026, operating across four distribution channels:
    direct-to-consumer (nesto.ca), B2B white-label (Nesto Cloud for IG Wealth
    Management and Canada Life), broker channel (8,500+ M3 brokers), and
    commercial lending (CMLS). The 2026 renewal wave—with 66% of Canadian
    mortgage transactions being renewals per CMHC—is nesto's primary acquisition
    tailwind, reinforced by a 150-day rate lock and C$37B+ in YTD originations.
    Customer satisfaction signals are broadly positive (NPS 70+, 4.5/5 on-site
    rating) but Trustpilot reviews surface adverse patterns: persistent
    post-application calling and disorganised underwriting for self-employed
    borrowers are documented service gaps at scale.

sections:
  - id: customer-segments-and-channel-architecture
    title: Customer Segments and Channel Architecture
    body: >-
      nesto operates a four-channel distribution model that spans every major
      origination path in the Canadian residential and commercial mortgage
      market. The direct-to-consumer (DTC) channel, served through nesto.ca,
      targets homebuyers (first-time and repeat), renewers, refinancers, and
      HELOC borrowers across all thirteen provinces and territories. The company
      holds mortgage broker licences in every Canadian jurisdiction and maintains
      12 offices nationally, staffed by 300+ client-facing mortgage advisors out
      of a total group headcount of 1,200+.


      The B2B white-label channel—Nesto Cloud—targets financial institutions and
      credit unions seeking to digitise their mortgage origination and servicing
      workflows. Named deployments include IG Wealth Management (white-label
      digital mortgage origination since 2022) and Canada Life (residential
      mortgage servicing and administration since 2023). The broker channel was
      formalised in January 2024 through a partnership with M3 Mortgage Group,
      immediately scaling nesto's broker reach to 8,500+ licensed brokers. The
      commercial channel operates primarily through CMLS, Canada's largest
      independently owned commercial mortgage services company with 50+ years of
      institutional relationships.


      This multi-channel architecture is a deliberate strategy to capture
      mortgage demand wherever it originates: online comparison shoppers (77% of
      consumers research online per CMHC 2026), broker-referred borrowers (≈40%
      of originations flow through brokers), and institutional partners seeking a
      technology layer. The financial-advisor (FA) sub-channel—where licensed
      financial advisors refer DTC-qualified clients—further broadens addressable
      borrower flow without requiring separate capital or licensing infrastructure.
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU006
