tables:
  - id: TU001
    title: Customer Segmentation by Channel, Buyer Type, and Evidence Quality
    columns:
      - Segment
      - Buyer / User / Payer
      - Use Case
      - Scale (2026 est.)
      - Revenue / Strategic Value
      - Evidence Gap
    rows:
      - - DTC Homebuyers (First-Time & Repeat)
        - Individual borrower
        - New purchase mortgage; stress-test qualified
        - Part of 450K+ cumulative (no annual split)
        - Core DTC origination spread and origination fee
        - No first-time vs. repeat buyer split disclosed
      - - DTC Renewers
        - Individual borrower (existing mortgage holder)
        - Mortgage renewal / lender switch; 150-day rate lock
        - Primary 2026 growth target; 66% of CA transactions are renewals
        - High-margin acquisition; rate advantage vs. Big Six
        - No disclosed renewal origination share or retention cohort
      - - DTC Refinancers
        - Individual borrower
        - Cash-out refinance, debt consolidation, home improvements
        - Secondary; 49% of 2026 refinancers broke term early (CMHC)
        - Spread revenue; potential HELOC upsell
        - No refinance volume publicly disclosed
      - - DTC HELOC Borrowers
        - Individual borrower (existing equity holder)
        - Revolving equity line at Prime+0.50%; min C$25K
        - New product (2026 launch); no adoption data
        - Cross-sell to 450K+ existing book; fee + interest margin
        - Origination volume and conversion rate not disclosed
      - - Financial Institution Partners (Nesto Cloud)
        - Institutional (FI/credit union); end-client is borrower
        - White-label mortgage origination, servicing, admin
        - 2 named B2B deployments (IG Wealth, Canada Life); 1 Intellifi (Alterna)
        - Platform/licensing/servicing fee; sticky multi-year contracts
        - Partner count, volume per partner, and contract value not disclosed
      - - Broker-Referred Borrowers (M3 Network)
        - Mortgage broker (referrer); individual borrower (payer)
        - Broker-channel mortgage origination
        - 8,500+ brokers in M3 network (since Jan 2024)
        - Origination fees; broker channel diversifies DTC concentration
        - Broker-originated volume share vs. DTC not separately reported
      - - Commercial Borrowers (CMLS)
        - Institutional borrower / commercial real estate investor
        - Commercial real estate mortgage; advisory; asset management
        - Part of C$80B MUA; 50+ years of CMLS relationships
        - Commercial origination fees; CMLS advisory/management revenue
        - Commercial vs. residential MUA split not publicly disclosed
      - - Self-Employed Borrowers (DTC)
        - Individual borrower (complex documentation)
        - Purchase / renewal with non-standard income verification
        - Subset of DTC volume; size undisclosed
        - Same spread economics as prime; higher servicing cost
        - Disproportionate complaint rate on Trustpilot signals a service gap
    notes: >-
      Scale figures are company-reported or estimated from CMHC industry data
      as of June 2026; no segment-level origination breakdown is publicly
      disclosed. Revenue/strategic value estimates reflect the business model
      rather than reported figures. "New product" for HELOC reflects 2026 launch
      with no published adoption metrics.
