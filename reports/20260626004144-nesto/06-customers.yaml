  - id: retention-renewal-and-customer-experience
    title: Retention, Renewal Focus, and Customer Experience
    body: >-
      nesto's most visible customer satisfaction signal is an NPS exceeding 70
      as reported on nestogroup.ca, described as "best in class client
      satisfaction." For context, large Canadian banks typically post consumer
      NPS scores of 30–45; an NPS of 70+ is exceptional and consistent with
      challenger brands. However, the metric is undated, unaudited, and lacks a
      trend series—it cannot be verified against an independent survey. The
      on-site aggregate rating of 4.5/5 from 1,100+ reviews similarly reflects
      company-curated aggregation.


      Trustpilot data (June 2026) rates nesto 4/5 "Great"—one tier below
      "Excellent"—from a smaller independent review pool. Two adverse reviews
      published in June 2026 represent material quality signals: one described
      daily post-abandonment cold calls lasting three months after stopping an
      application, explicitly calling it harassment; the other detailed a
      self-employed borrower's experience of 70+ emails, repeated document
      requests, and apparent coordination failures between sales, compliance, and
      underwriting. nesto responded publicly to the second complaint on
      Trustpilot, acknowledging the stress while attributing the re-requests to
      regulatory document compliance standards—a measured response but one that
      does not resolve the root process concern.


      The 2026 renewal market is nesto's single largest customer acquisition
      lever. CMHC's 2026 Mortgage Consumer Survey confirms that 66% of all
      mortgage transactions are renewals, and that 35% of renewing borrowers
      experienced an average monthly payment increase of C$375 due to interest
      rate changes. nesto directly targets this pressure: its renewal page
      prominently advertises 15% lower renewal rates versus the Big Six and
      calls out that "nearly half of all Canadian mortgages are coming up for
      renewal before 2027." The 150-day rate lock—the longest of any major
      Canadian lender—is a structural differentiator that reduces renewal
      switching friction and locks in pipeline far in advance. No cohort
      retention data (what share of nesto's 2020-2021 cohort renewed with nesto
      rather than returning to a bank) is publicly available, representing a
      material evidence gap.
