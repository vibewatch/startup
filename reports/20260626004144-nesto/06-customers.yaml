      - CU031
      - CU032
      - CU033
      - CU034

callouts:
  - calloutType: strength
    title: Renewal Wave Tailwind and 150-Day Rate Lock Moat
    body: >-
      With 66% of Canadian mortgage transactions in 2026 being renewals and
      nearly half of all Canadian mortgages up for renewal before 2027, nesto's
      primary customer segment is structurally the largest it has ever been.
      The 150-day rate lock—the longest in the market—creates a competitive
      moat that captures renewal intent months before the bank's 35-day window
      opens, effectively locking the renewal customer into the nesto funnel
      well before competitive offers arrive.
    claimRefs:
      - CU013
      - CU031
      - CU034

  - calloutType: risk
    title: Adverse Customer Experience Signals at Scale
    body: >-
      Two June 2026 Trustpilot reviews surface operational quality gaps that
      could weigh on retention at scale: persistent post-abandonment calling
      (harassment complaint) and a disorganised multi-channel underwriting
      process for self-employed borrowers (70+ emails). As nesto scales toward
      and beyond 500K+ customers, service-process failures that were tolerable
      at lower volume may trigger regulator attention (FCAC) or reputational
      damage that erodes the NPS and star-rating advantage.
    claimRefs:
      - CU025
      - CU026
      - CU027

  - calloutType: insight
    title: B2B Nesto Cloud Creates Structural Switching Costs
    body: >-
      Once a financial institution deploys Nesto Cloud for white-label mortgage
      origination, the integration cost, advisor retraining, and client
      continuity considerations create high switching costs. This dynamic—absent
      from the DTC channel—provides nesto with a recurring, sticky revenue base
      that is structurally different from the rate-competitive DTC acquisition
      flywheel. The pipeline growth from "turbo speed" partner onboarding
      (Series E announcement) could become a durable moat if nesto signs 5–10
      institutional partners.
    claimRefs:
      - CU016
      - CU018
      - CU021

  - calloutType: recommendation
    title: Prioritise Cohort Retention and Channel Attribution Disclosure
    body: >-
      The single largest blind spot in nesto's customer story is the absence of
      any cohort retention data: it is unknown what share of borrowers who
      originated with nesto in 2019–2022 have renewed with nesto versus
      returning to a Big Six bank. Disclosing even a directional renewal
      retention rate would be a meaningful signal for institutional partners and
      investors assessing long-term customer lifetime value and NRR. Similarly,
      disclosing channel-level origination splits (DTC vs. broker vs. Nesto
      Cloud) would enable independent verification of the growth narrative.
    claimRefs:
      - CU009
      - CU010
      - CU024

