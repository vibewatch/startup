  - id: TU005
    title: Expansion Drivers and Concentration Risks
    columns:
      - Expansion Driver / Concentration Risk
      - Description
      - Impact Level
      - Diligence Path
    rows:
      - - Renewal wave demand (2026–2027)
        - ≈1.15M mortgages renewing in 2026; nearly half of all Canadian mortgages up before 2027; nesto's primary DTC growth lever
        - High positive / temporal concentration risk post-2027
        - Track CMHC annual renewal forecast; monitor nesto origination mix 2027+
      - - M3 broker channel (8,500+ brokers)
        - Exclusive/preferred access to M3 network; diversifies origination beyond DTC
        - High growth potential; single-channel concentration risk if relationship disrupts
        - Review M3 contract exclusivity and renewal terms; monitor broker-originated volume share
      - - Nesto Cloud partner pipeline
        - 3 active named partners; CEO committed to "turbo speed" onboarding of new partners
        - High recurring revenue potential; opaque pipeline size
        - Request partner pipeline count, 2026 onboarding targets, and ACV estimates
      - - CMLS commercial mortgage platform
        - Adds institutional borrowers; 50 years of CMLS relationships; contributes to C$80B MUA
        - Material revenue contribution; limited public segmentation
        - Request commercial vs. residential MUA and origination split; CMLS named client count
      - - HELOC cross-sell to existing DTC book
        - Launched 2026; 450K+ prior borrowers are potential candidates at Prime+0.50%
        - Material if ≥1–2% conversion rate; new revenue line
        - Request origination volume since launch; conversion rate vs. total mortgage book
      - - Geographic concentration (ON, QC, BC)
        - Major metro markets dominate; 12 offices but DTC volume weighted to major cities
        - Moderate; price-sensitive markets amplify rate-spread risk
        - Disclose origination share by province; stress-test secondary market exposure
      - - Single-platform technology concentration (Nesto Cloud)
        - All white-label partners on one platform; single serious outage = multi-partner exposure
        - High operational risk; no public SLA or uptime disclosure
        - Obtain Nesto Cloud SLA; review incident history; confirm redundancy architecture
      - - Rate-price competitive pressure
        - 77% of mortgage consumers compare rates online; nesto competes primarily on rate advantage
        - Margin compression risk if spread narrows; limited non-rate switching moat
        - Analyse rate-spread trend vs. Big Six; assess non-rate differentiation (UX, speed, service)
    notes: >-
      Impact levels are qualitative assessments based on available evidence;
      no quantitative revenue-at-risk figures are disclosed for individual
      expansion drivers or concentration exposures. Renewal wave figures derived
      from CMHC 2026 MCS and Canadian Mortgage Trends reporting. HELOC adoption
      data is unavailable as the product launched in 2026.
    claimRefs:
      - CU034
      - CU035
      - CU036
      - CU037

