  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: cohort retention rate
      missingEvidence: >-
        Nesto-specific cohort retention data showing what percentage of
        customers who originated mortgages with nesto in 2019–2022 subsequently
        renewed with nesto (rather than switching to a bank or competitor) at
        the end of their five-year term.
      whyItMatters: >-
        Without cohort retention data it is impossible to assess whether nesto's
        DTC business generates durable repeat customer relationships or primarily
        captures one-time transactions from rate-shopping consumers. High NPS
        (70+) is a leading indicator but renewal retention is the lagging proof.
      diligencePath: >-
        Request annual cohort analysis from management: % of 2019 and 2020
        origination cohorts that renewed with nesto at term maturity. Cross-
        reference with MUA growth to validate organic retention vs. new
        originations.
      relatedQuestionRefs:
        - QU016
        - QU011

    - type: private-evidence-only
      severity: material
      topic: institutional partner revenue
      missingEvidence: >-
        Financial terms, contract duration, origination or servicing volume,
        and ACV for each named Nesto Cloud deployment (IG Wealth Management,
        Canada Life, Alterna Savings).
      whyItMatters: >-
        These B2B contracts are potentially the stickiest, highest-margin revenue
        stream in nesto's model. Without any volume or revenue disclosure it is
        impossible to assess whether institutional partners represent 5% or 25%
        of nesto's total revenue, materially affecting valuation and
        concentration-risk assessments.
      diligencePath: >-
        Request management disclosure of B2B platform revenue as a % of total
        revenue; annual contract values; minimum volume commitments; contract
        duration and renewal terms for IG Wealth, Canada Life, and Alterna.
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: customer acquisition cost by channel
      missingEvidence: >-
        Customer acquisition cost (CAC) and payback period for each origination
        channel: DTC (nesto.ca organic and paid), broker (M3 referral fee
        economics), and B2B white-label (Nesto Cloud onboarding cost per
        institutional partner).
      whyItMatters: >-
        Channel-level CAC is the primary driver of unit economics and LTV/CAC
        ratios. If broker-channel CAC approaches or exceeds bank-commission
        rates, the DTC cost-advantage narrative does not apply to that
        channel. This information is required to assess per-channel
        profitability and capital efficiency.
      diligencePath: >-
        Request channel-level CAC from management; compare DTC CAC to broker
        finder-fee economics; reconcile with MUA growth and profitability claim.
      relatedQuestionRefs:
        - QU022

    - type: missing-source
      severity: material
      topic: adverse regulatory and complaint record
      missingEvidence: >-
        FCAC (Financial Consumer Agency of Canada) complaint statistics for
        nesto; OSFI supervisory notes or correspondence; Better Business Bureau
        complaint record or resolution rate.
      whyItMatters: >-
        Trustpilot is the only accessible independent adverse signal for nesto's
        customer service quality. Persistent aggressive outreach (as documented)
        and self-employed process failures could attract FCAC scrutiny as nesto
        scales. No public FCAC complaint data was found, creating an evidence gap
        on regulatory complaint risk.
      diligencePath: >-
        Submit FCAC access-to-information request for complaint statistics by
        lender; review OSFI supervision status for nesto's registered entities;
        check BBB Canada for nesto complaint history.

    - type: enumeration-incomplete
      severity: minor
      topic: HELOC adoption metrics
      missingEvidence: >-
        HELOC origination volume since the 2026 launch, conversion rate from
        the existing 450K+ mortgage book, and average HELOC facility size.
      whyItMatters: >-
        HELOC cross-sell is a stated expansion lever; without adoption data
        it cannot be evaluated as a revenue contribution or a sign of
        customer stickiness.
      diligencePath: >-
        Request HELOC origination count and total facility value since
        launch; compare to mortgage book size to compute conversion rate.
      relatedQuestionRefs:
        - QU020

