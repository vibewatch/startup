  - id: adoption-trajectory-and-scale
    title: Adoption Trajectory and Scale
    body: >-
      nesto's cumulative customer adoption reached 450,000+ Canadians under the
      DTC brand and 500,000+ across Nesto Group by mid-2026—the latter figure
      blending nesto.ca borrowers with Canada Life's transferred portfolio
      customers and CMLS relationships. These are company-reported, unaudited
      numbers: no independent audit of customer count is publicly available. By
      mortgage market standards the operational proof is more compelling: C$80B+
      in mortgages under administration and C$37B+ in originations year-to-date
      through June 2026 are figures confirmed by the Series E press release, a
      high-reputation external source.


      Broker channel scale reflects a deliberate pivot after the January 2024 M3
      partnership: access to 8,500+ licensed brokers overnight transformed nesto
      from a DTC-only originator into a genuine multi-channel lender. The
      combination of DTC digital acquisition economics and broker-channel reach
      positions nesto to capture both the 77% of online researchers and the ≈40%
      of borrowers who transact through advisors or brokers.


      Third-party growth validation comes from Deloitte's Technology Fast 50
      programme, in which nesto has featured for three consecutive years (2022,
      2023, 2024). The Series E CEO statement—"growing rapidly across all
      business units"—is consistent with the origination and MUA trajectory, though
      no annual origination series, year-over-year growth rate, or market-share
      percentage is publicly disclosed, limiting independent growth-rate
      verification.
    claimRefs:
      - CU002
      - CU003
      - CU009
      - CU010
