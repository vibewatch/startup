summary:
  headline: >-
    nesto's C$1.47 billion Series E valuation is anchored by genuine operational scale — C$80B+
    MUA, C$37B+ 2026 originations, and confirmed profitability — and by high-quality institutional
    backing from La Caisse and Fidelity, but revenue opacity, balance-sheet funding dependency,
    and unresolved M3 channel concentration prevent conviction; the evidence supports a track
    recommendation at a fair valuation.
