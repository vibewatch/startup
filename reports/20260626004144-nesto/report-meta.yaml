companyProfile:
  summary: >-
    nesto is a Montreal-founded (2018) AI-driven mortgage technology and financing platform that
    has evolved from Canada's first fully digital mortgage lender into a diversified multi-brand
    lending ecosystem. Its June 2026 Series E — C$302 million at a C$1.47 billion post-money
    valuation led by La Caisse — confers Canada's first mortgage technology unicorn status and
    funds expansion into AI-powered financial services. Operating through five brands — nesto
    (DTC consumer lending), CMLS (commercial and institutional mortgage), Nesto Cloud (B2B
    white-label origination platform), Intellifi (loan processing), and Maestro AI (AI
    orchestration) — nesto Group manages over C$80 billion in mortgages under administration,
    originated more than C$37 billion in 2026 to date, and is profitable. The company serves
    500,000+ customers and has been named to the Deloitte Technology Fast 50 for three
    consecutive years, though precise revenue, headcount, and cap-table detail remain private.
  foundedDate: '2018-01-01'
  founders:
    - name: Malik Yacoubi
      role: Co-founder & CEO
      background: >-
        Public face and CEO of Nesto Group; leads corporate strategy and investor relations;
