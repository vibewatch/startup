  fintech companies, but core financial underwriting inputs remain opaque. The June 2026 Series E
  press release, regulatory filings, partner announcements, and servicer rating confirmations
  provide the operational backbone; however, revenue by segment, gross margin, warehouse facility
  terms, the undisclosed Series D amount, and the CMLS acquisition price are all private. This
  report treats operational scale claims (MUA, originations, customer counts, profitability) as
  company-reported and unaudited, and applies industry benchmarks to estimate revenue ranges.
  All valuation work uses the C$1.47 billion Series E as the single disclosed reference point.
