      background: >-
        Named Principal Broker on the nesto consumer platform; oversees brokerage licensing
        and broker-channel compliance across all thirteen Canadian provinces and territories.
      claimRefs: [CO015]
  foundingLocation: Montreal, Quebec, Canada
  headquarters: Montreal, Quebec, Canada
  productSummary: >-
    nesto sells five interconnected products: (1) direct-to-consumer digital mortgages under the
    nesto brand — home purchase, renewal, refinance, and HELOC with a 150-day rate lock guarantee;
    (2) Nesto Cloud, a B2B white-label mortgage origination, funding, and servicing platform
    licensed to IG Wealth Management, Canada Life, and Alterna Savings; (3) CMLS institutional
    residential and commercial mortgage origination and administration; (4) Intellifi loan
    processing services for financial institutions; and (5) Maestro AI, an AI-native orchestration
    layer for enterprise mortgage workflow automation launched in June 2026.
  customerFocus: >-
    Canadian homebuyers (first-time and repeat purchasers), mortgage renewers, refinancers, and
    HELOC borrowers via the DTC channel; financial institutions, wealth management firms, and
    credit unions via Nesto Cloud and Intellifi; commercial real estate borrowers via CMLS;
    and enterprise clients seeking AI mortgage workflow automation via Maestro AI.
  businessModel: >-
    Multi-stream revenue combining: (1) net interest margin on balance-sheet mortgage lending
    (DTC channel); (2) B2B SaaS licensing and servicing fees from Nesto Cloud institutional
    partners; (3) commercial mortgage origination fees, administration, and servicing income
    from CMLS; (4) loan processing fees from Intellifi; and (5) broker-channel origination
    volume accessible through the M3 Mortgage Group exclusive alliance covering 8,500+ brokers.
    Revenue and margin by segment are not publicly disclosed.
  stage: Series E
  fundingStatus: >-
    Raised at least C$458 million in disclosed capital — C$76M Series B (2021, PCM Encore),
    C$80M Series C (December 2022, IGM Financial), undisclosed Series D (mid-2024, concurrent
    with CMLS acquisition), and C$302M Series E (June 10, 2026, La Caisse lead). Series E
    post-money valuation of C$1.47 billion (~US$1.07 billion) confers unicorn status; the round
    includes both primary and secondary capital. True total raised exceeds C$458M due to the
    undisclosed Series D.
