  - id: us-capability-benchmarks
    title: US Capability Benchmarks — Blend Labs and Figure
    body: >-
      Two US fintech companies — Blend Labs and Figure — serve as product capability benchmarks
      for nesto's B2B and consumer-lending ambitions, even though neither operates in Canada.

      Blend Labs (NASDAQ: BLND) is the closest US analog to Nesto Cloud: a pure B2B digital
      origination platform serving banks, credit unions, and independent mortgage banks. Blend
      claims its platform saves lenders more than 16 hours per loan, enables lenders to grow
      loan volume by 33% with the same headcount, and can go live in as few as 4 weeks. BMO
      itself achieved 10,000 hours of annual savings and a 53% YoY increase in digital home
      equity applications through Blend in the US — a deployment by the same bank that now
      competes with nesto via BMO BrokerEdge in Canada. The Blend benchmark shows what
      enterprise-grade B2B mortgage technology can command in the US: if Nesto Cloud can
      demonstrate comparable unit economics in Canada, its TAM justification strengthens
      materially. Blend does not serve Canadian financial institutions.

      Figure.com is the #1 non-bank HELOC lender in the United States, having unlocked C$25B+
      in home equity for US homeowners using a blockchain-based origination model. Figure's
      5-minute approval and 5-day funding timeline (versus typical industry norms of days to
      weeks) illustrate the technology frontier for AI-accelerated lending. Figure serves 350+
      B2B partners with 40% of US HELOC volume transacted on its Figure Connect marketplace,
      and holds 75% market share in real-world asset tokenization. Figure's Maestro-equivalent
      AI capabilities (slashing processing costs 20x in 2025) provide a direct product-roadmap
      benchmark for nesto's Maestro AI launch.
