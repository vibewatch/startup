  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Pine.ca scale and funding
      missingEvidence: >-
        Disclosed total funding, origination volume, headcount, and institutional
        capitalization details for Pine Canada Financial Corporation.
      whyItMatters: >-
        Pine is nesto's most cited direct digital-first competitor; its actual scale
        determines whether it is a near-term threat or an early-stage reference point.
      diligencePath: >-
        Request CanDeal/SEDAR filings if Pine has any debt financing; check FSRA
        disclosure databases; interview Pine's broker community contacts.
      relatedQuestionRefs:
        - QP003
        - QP022
      relatedTableRefs:
        - TP001

    - type: missing-source
      severity: material
      topic: M3 Mortgage Group partnership exclusivity and volume metrics
      missingEvidence: >-
        Terms of the nesto-M3 partnership: exclusivity provisions, minimum volume
        commitments, lender priority arrangements, and whether M3 brokers can continue
        submitting deals to competing lenders.
      whyItMatters: >-
        The broker channel moat claim depends entirely on whether M3's commitment to
        nesto is exclusive or preferential; without this, the partnership may not
        provide durable volume protection.
      diligencePath: >-
        Request partnership agreement term sheet from nesto management; cross-reference
        with M3 broker communications and CMP broker surveys.
      relatedQuestionRefs:
        - QP012
        - QP024
      relatedTableRefs:
        - TP004

    - type: missing-source
      severity: material
      topic: Broker channel volume share by network (DLC, M3, Mortgage Alliance)
      missingEvidence: >-
        Quantitative market share data for the three major broker networks (DLC, M3,
        Mortgage Alliance) by funded mortgage volume in 2025–2026.
      whyItMatters: >-
        Without network-level volume data, it is impossible to size the prize from the
        M3 partnership or assess DLC's relative dominance as a distribution competitor.
      diligencePath: >-
        Review CMHC RMIR annual data; review Mortgage Professionals Canada annual
        survey; request DLC's public TSX DLCG filings for segment revenue data.
      relatedQuestionRefs:
        - QP021
        - QP023
      relatedTableRefs:
        - TP001

    - type: private-evidence-only
      severity: minor
      topic: Nesto Cloud B2B pricing and contract size
      missingEvidence: >-
        Unit pricing, implementation fees, and average contract value for Nesto Cloud
        enterprise licences, needed to benchmark against Blend Labs' B2B economics.
      whyItMatters: >-
        The strategic value of Nesto Cloud depends on whether its per-lender revenue
        is material at scale; without pricing data, the B2B segment's valuation
        contribution cannot be independently assessed.
      diligencePath: >-
        Request data room access from nesto; review IG Wealth and Canada Life contract
        structures if disclosed in parent company filings.
      relatedQuestionRefs:
        - QP009
      relatedTableRefs:
        - TP004

    - type: missing-source
      severity: minor
      topic: True North Mortgage, Pine, and Ratehub rate lock policies
      missingEvidence: >-
        Published or contractual rate lock durations for True North Mortgage, Pine,
        and Ratehub's CanWise Financial to validate nesto's 150-day claim as
        uniquely longest.
      whyItMatters: >-
        If any competitor has since matched or exceeded nesto's 150-day lock, a key
        product differentiator is reduced to table stakes.
      diligencePath: >-
        Fetch live rate lock terms from competitor mortgage application flows;
        review broker comparison forums and industry publications.
      relatedQuestionRefs:
        - QP013
        - QP020

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      Table TP003 (Pricing and Packaging Comparison) contains partial data for bank posted
      rates because BMO and RBC mortgage rate pages are fully JavaScript-rendered and did
      not return specific rate figures at fetch date; "structurally elevated vs monolines"
      is a factual industry-consensus characterization, not an estimation, and notes on
      this limitation are included in the table notes field.
