  - id: feature-pricing-gtm-comparisons
    title: Feature, Pricing and GTM Comparisons
    body: >-
      The feature comparison across Canadian digital lenders reveals that nesto holds the widest
      capability breadth of any non-bank competitor: it combines direct consumer origination,
      a B2B white-label lending cloud (Nesto Cloud), an AI orchestration layer (Maestro AI),
      commercial mortgage capability (via CMLS), a broker channel (via M3), and a 150-day rate
      lock that is the longest advertised by any major Canadian lender. By contrast, Ratehub
      excels at rate-comparison aggregation and CX-driven closing but has no enterprise B2B or
      commercial segment. Pine and True North are strong on niche DTC propositions but
      structurally limited in scope.

      On pricing, nesto's headline rates as of June 25, 2026 are 4.09% 5-year fixed (insured)
      and 3.40% 5-year variable (Prime −1.05%), which are competitive with broker-channel
      monoline rates. Ratehub's featured rates are 4.04% (5-year fixed) and 3.45% (5-year
      variable), marginally better on fixed — which may reflect that Ratehub sources from a
      broader lender panel rather than funding from its own balance sheet. Banks' posted rates
      are structurally higher, with nesto's rate comparison table showing a meaningful discount
      to the Big Bank posted rate on each product type. WOWA.ca — which aggregates rates from
      50+ lenders three times daily — captures nesto among its featured lenders, providing
      independent distribution value for nesto's rate-transparency positioning.
    claimRefs:
