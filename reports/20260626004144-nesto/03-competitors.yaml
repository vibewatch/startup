callouts:
  - calloutType: risk
    title: Broker Channel Concentration Risk — M3 Partnership
    body: >-
      nesto's 2024 M3 Mortgage Group partnership transforms broker distribution from a
      competitive threat into a channel, but it also creates a single-partner concentration
      risk. If M3 shifts preferred lender status toward BMO BrokerEdge (launched 2024) or
      other digital monolines, nesto loses broker-channel volume without a fallback. The
      exclusivity and minimum volume terms of the M3 agreement are not publicly disclosed.
    claimRefs:
      - CP029
      - CP018
      - CP041

  - calloutType: strength
    title: Integrated Platform Is Canada's Only DTC-Plus-B2B-Plus-Commercial Mortgage Stack
    body: >-
      No other Canadian non-bank mortgage entity combines direct consumer origination (nesto
      brand), an institutional B2B cloud (Nesto Cloud, serving IG Wealth and Canada Life), a
      commercial lending arm (CMLS, 50+ years, C$80B+ AUM), an AI orchestration layer
      (Maestro AI), and broker channel access (M3). This multi-layer architecture is the
      primary basis for nesto's C$1.47B valuation premium over all other Canadian digital
      mortgage peers.
    claimRefs:
      - CP019
      - CP029
      - CP030
      - CP034
      - CP044

