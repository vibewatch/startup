  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: Revenue, ARR, gross margin, burn rate, and unit economics for Nesto Group
      whyItMatters: Without revenue or ARR data, the C$1.47B valuation cannot be independently assessed against a revenue multiple; profitability claim cannot be verified
      diligencePath: Request management data room including audited financial statements and monthly MRR/ARR schedule
      relatedQuestionRefs:
        - QO024
        - QO030

    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: Total Nesto Group employee count across all brands and subsidiaries
      whyItMatters: Headcount is needed to assess revenue-per-employee, operational leverage, and burn-rate trajectory
      diligencePath: Request HRIS data, LinkedIn signals, or corporate filing with employee count disclosure
      relatedQuestionRefs:
        - QO018

    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: Board composition, investor governance rights, and ownership structure post-Series E
      whyItMatters: Institutional investors including La Caisse likely have board representation and protective provisions that affect strategic direction and exit paths
      diligencePath: Review Series E shareholder agreement, board minutes, and any investor rights agreement
      relatedQuestionRefs:
        - QO030

    - type: missing-source
      severity: material
      topic: funding
      missingEvidence: Series D amount and terms; CMLS acquisition price
      whyItMatters: These are the largest undisclosed capital events; their absence makes total-raised figures approximate and caps valuation context
      diligencePath: Request private placement memorandum or management confirmation of Series D size and CMLS acquisition consideration
      relatedQuestionRefs:
        - QO028
      relatedTableRefs:
        - TO004

    - type: missing-source
      severity: minor
      topic: leadership
      missingEvidence: No public source confirms or denies the identity of "Damian Chlopecki" as a co-founder, referenced in secondary sources but absent from nesto's official website co-founder listing
      whyItMatters: Co-founder identity and any prior departures affect key-person risk assessment and cap-table analysis
      diligencePath: Review official corporate registry filings, LinkedIn profiles, and confirm with management
      relatedQuestionRefs:
        - QO029
      relatedTableRefs:
        - TO002

    - type: missing-source
      severity: minor
      topic: regulatory
      missingEvidence: Full list of provincial mortgage broker and lender licences held by Nesto Inc. and CMLS subsidiaries; any regulatory warnings or enforcement actions
      whyItMatters: Multi-province licensing is a compliance dependency; any enforcement action would be material adverse
      diligencePath: Search FSRA (Ontario), AMF (Quebec), and other provincial regulator databases for nesto Inc. and CMLS Group licence status
      relatedQuestionRefs:
        - QO017
        - QO020

    - type: enumeration-incomplete
      severity: minor
      topic: partnership
      missingEvidence: Complete terms, exclusivity duration, and revenue contribution of the M3 Mortgage Group broker-channel partnership and other institutional Nesto Cloud agreements
      whyItMatters: Partnership concentration and term structure affect revenue visibility and B2B moat durability
      diligencePath: Request commercial agreements or management summary of partnership economics from data room
      relatedQuestionRefs:
        - QO014
      relatedTableRefs:
        - TO003

