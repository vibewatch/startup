      - CO013
      - CO043

  - calloutType: risk
    title: Undisclosed Financials and Governance Create Diligence Blind Spots
    body: >-
      Revenue, ARR, headcount, board composition, and cap-table structure are all private. The absence of any public governance disclosure is material for an entity managing C$80B+ in mortgages under administration with multiple regulated subsidiaries.
    claimRefs:
      - CO048
      - CO049

  - calloutType: risk
    title: Customer Experience Adverse Signals at Scale
    body: >-
      Trustpilot adverse reviews document harassment-like persistent sales calls and chaotic self-employed underwriting. These are service-delivery gaps consistent with rapid growth but require monitoring as nesto continues to scale its DTC and broker channels.
    claimRefs:
      - CO040
      - CO041

