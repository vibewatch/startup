  - id: scale-metrics-and-milestones
    title: Scale, Operations, and Key Milestones
    body: >-
      nesto's operational scale as of June 2026 is substantial by Canadian mortgage-market standards. The company manages over C$80 billion in residential and commercial mortgages under administration, has originated more than C$37 billion in mortgages in 2026 to date, and is profitable. The consumer brand claims 450,000+ Canadians helped as of mid-2026. Nesto Group's corporate website references 500,000+ customers across all brands. The discrepancy (450K vs 500K+) likely reflects the nesto DTC brand versus the full Nesto Group umbrella; both numbers are company-reported and unaudited.


      The product and partnership milestones trace a deliberate progression: nesto moved from broker (2018-2019) to direct lender (2020), through Series B/C capital raises and the Mortgage Cloud B2B launch (2022), to a string of institutional partnerships (IG Wealth Management 2022, Canada Life 2023, M3 broker channel 2024, Alterna Savings 2024), and finally to the CMLS acquisition (2024) and the Series E (2026). The 2025 Maple Financial investment signals movement into alternative mortgage lending. Alongside this, nesto has earned repeated industry recognition: CLA Mortgage Lender of the Year in 2023, 2024, and 2025; Forbes Advisor Best Mortgage Lender; GPTW Best Workplaces; and Deloitte Fast 50 for three consecutive years.


      The consumer NPS of 70 (reported in 2022) and the 4.5/5 rating from 1,100+ reviews on the nesto.ca homepage signal strong aggregate customer satisfaction. However, third-party Trustpilot reviews as of June 2026 rate nesto 4/5 ("Great") with a visible tail of adverse reviews citing persistent post-application sales calls (described by one reviewer as harassment) and disorganized underwriting for self-employed borrowers. These adverse signals are consistent with early-stage growth-company service gaps and do not currently indicate systemic regulatory concern, but they deserve monitoring as nesto scales.
