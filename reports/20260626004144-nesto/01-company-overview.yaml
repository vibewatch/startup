  - id: founders-and-leadership
    title: Founders, Leadership, and Governance
    body: >-
      The nestogroup.ca corporate website identifies four co-founders who remain active in executive roles: Malik Yacoubi (Co-founder & CEO), Karim Benabdallah (Co-founder & CTO), Damien Charbonneau (Co-founder & COO), and Chase Belair (Co-founder & Principal Broker). Yacoubi is the primary public face of the company, quoted in the Series E press release and identified by independent news sources as CEO. Belair is the named Principal Broker on the nesto consumer website. Martin Aubut serves as Chief Marketing Officer and was listed as media contact in the Series E announcement.


      Key-person risk is meaningful. The four co-founders appear to collectively hold the strategic, product, technology, and operational narrative. No independent board roster, governance rights disclosure, or investor control provisions are available in public sources. The CMLS acquisition (2024) and the Series E (2026) have brought institutional investors including La Caisse, Fidelity Investments Canada, and National Bank of Canada's venture arm into the cap table, but the mechanics of any board seats or control arrangements are not publicly disclosed.


      nesto achieved B Corp certification in 2023 — one of the first mortgage lenders globally to do so — signaling a stated commitment to social and environmental governance standards. Morningstar DBRS assigned a Canadian Residential Mortgage Servicer (MOR RS) ranking with a Stable trend to Nesto Inc. in 2025, and Fitch confirmed "Primary", "Master", and "Special Servicer" ratings for CMLS Commercial in October 2024, providing external validation of operational credibility. The company has been recognized as a Top Mortgage Employer by Canadian Mortgage Professional (CMP) for 2025, an award suggesting organizational health despite the absence of a disclosed headcount.
