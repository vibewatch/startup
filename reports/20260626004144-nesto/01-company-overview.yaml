  - id: evidence-gaps-and-diligence-asks
    title: Evidence Gaps and Diligence Asks
    body: >-
      Several material facts about nesto are not publicly available and represent genuine diligence gaps rather than research failures. Revenue and ARR are not disclosed; the closest public proxy is the Deloitte Fast 50 growth recognition and the management claim of profitability. Exact headcount for Nesto Group is not listed on any public surface — the nesto.ca consumer site mentions 300+ mortgage experts but this covers only the DTC brand. The CMLS Group acquisition price and the Series D round amount are undisclosed. The Series E's secondary component implies partial investor liquidity but the share count, dilution, and post-money cap table are private.


      On the governance side, no board roster, director independence statement, or investor control provisions are publicly available. For a company managing C$80B+ in mortgages under administration that holds regulatory licenses across Canadian provinces, the absence of any public governance disclosure is a material blind spot for prospective institutional partners and investors.


      An additional identity discrepancy warrants noting: the task brief for this research run references "Damian Chlopecki" as a co-founder, but the current nestogroup.ca corporate homepage identifies the four co-founders as Malik Yacoubi, Karim Benabdallah, Damien Charbonneau, and Chase Belair. Neither "Damian Chlopecki" nor any variant appears in any fetched source. This may reflect a co-founder departure, a name discrepancy, or a data error in the brief; diligence should clarify.
