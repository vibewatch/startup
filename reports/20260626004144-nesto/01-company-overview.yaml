  - id: funding-history-and-investors
    title: Funding History, Valuation, and Investor Map
    body: >-
      nesto has raised multiple rounds since 2021, with disclosed amounts totalling at least C$458 million across Series B, C, and E (the Series D in 2024 was undisclosed). The June 10, 2026 Series E of C$302 million at a C$1.47 billion post-money valuation — approximately US$1.07 billion — is the defining event, conferring unicorn status and bringing strategic institutional capital from La Caisse, Fidelity Investments Canada ULC, PICTON Investments, and Endeavor Catalyst as new investors. La Caisse (formerly CDPQ), Quebec's principal institutional investor, led the new investor tranche.


      The prior financing arc: a C$76 million Series B (2021, led by PCM Encore) funded early growth; a C$80 million Series C (December 2022, led by IGM Financial) funded the launch of Nesto Mortgage Cloud; and an undisclosed Series D in mid-2024 ran in parallel with the CMLS Group acquisition. Early institutional backing from Diagram Ventures and Portage reflects the company's origin as a supported fintech launch; Portage is itself backed by IGM Financial and major Canadian financial institutions, giving nesto deep roots in Canada's financial services establishment. The Series E includes both primary and secondary capital, meaning some earlier investors or founders may have achieved partial liquidity.


      Total capital raised and the exact ownership structure are not publicly disclosed. The secondary component of the Series E creates a valuation reference point but the mechanics — number of shares, founder dilution, board seats granted — remain private. nesto has been named to the Deloitte Technology Fast 50 list for three consecutive years, corroborating high revenue growth even though the absolute revenue figure is undisclosed.
