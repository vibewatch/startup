  - id: FO002
    title: nesto Group — Ecosystem Model (Company Snapshot Logic)
    type: flow
    layout: standard
    summary: >-
      How nesto's consumer lending, B2B technology, commercial mortgage, AI platform, and broker-channel rails connect to serve homeowners, financial institutions, and brokers.
    data:
      nodes:
        - id: n1
          label: Homeowners / Borrowers
          description: Canadian consumers seeking purchase mortgages, renewals, refinancing, or HELOCs through nesto's DTC digital channel.
        - id: n2
          label: nesto DTC Brand
          description: Canada's first fully digital mortgage lender. Offers 150-day rate lock, AI-powered rate matching, and 300+ licensed advisors. Serves 450,000+ customers.
          dependsOn:
            - n1
        - id: n3
          label: Nesto Cloud (B2B Platform)
          description: White-label mortgage origination, funding, and servicing technology licensed to financial institutions including IG Wealth Management, Canada Life, and Alterna Savings.
          dependsOn:
            - n4
        - id: n4
          label: Financial Institutions (B2B Clients)
          description: Banks, insurers, and wealth managers (e.g., IG Wealth, Canada Life, Alterna Savings) that license Nesto Cloud to power their own mortgage businesses.
        - id: n5
          label: CMLS (Commercial + Broker)
          description: Canada's third-largest mortgage finance company (acquired 2024). Adds 50 years of institutional expertise, commercial mortgage origination, and broker-channel relationships. Holds Fitch Primary/Master/Special Servicer ratings.
          dependsOn:
            - n6
        - id: n6
          label: Mortgage Brokers (M3 Channel)
          description: 8,500+ M3 Group-affiliated brokers with exclusive access to nesto products through the broker-channel partnership (2024).
