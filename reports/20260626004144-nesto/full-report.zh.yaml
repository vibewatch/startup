  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与渠道架构
        blocks:
          - type: paragraph
            body: >-
              nesto 采用四渠道分销模型，覆盖加拿大住宅和商业抵押贷款市场的所有主要发起路径。直面消费者（DTC）渠道通过 nesto.ca 服务，目标覆盖十三个省和地区的购房者（首次及重复购房）、续约者、再融资者和
              HELOC 借款人。公司在加拿大每个司法辖区都持有抵押贷款经纪牌照，并在全国设有 12 个办公室；集团总员工 1,200+，其中 300+ 为面向客户的抵押贷款顾问。


              B2B 白标渠道——Nesto Cloud——面向希望数字化抵押贷款发起和服务流程的金融机构与信用合作社。具名部署包括 IG Wealth Management（自 2022 年起提供白标数字抵押贷款发起）和
              Canada Life（自 2023 年起提供住宅抵押贷款服务和管理）。经纪渠道于 2024 年 1 月通过与 M3 Mortgage Group 的合作正式化，立即把 nesto 的经纪覆盖扩展至 8,500+
              名持牌经纪人。商业渠道主要通过 CMLS 运营；CMLS 是加拿大最大的独立商业抵押贷款服务公司，拥有 50+ 年机构关系。


              这种多渠道架构是有意为之：无论抵押贷款需求从哪里产生，都要捕获——线上比价用户（CMHC 2026 显示 77% 的消费者会在线研究）、经纪转介借款人（约 40%
              的发起量通过经纪人流转），以及寻求技术层的机构合作伙伴。财务顾问（FA）子渠道——持牌财务顾问把符合 DTC 条件的客户转介进来——进一步扩大可触达借款人流量，而不需要单独资本或牌照基础设施。
