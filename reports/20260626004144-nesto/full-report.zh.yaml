  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Series E 背景与估值框架
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 10 日，nesto 宣布完成 C$302 million Series E 融资，投后估值 C$1.47 billion——按当时汇率折算，约等于 US$1.07
              billion，或取决于换算口径约为 US$216 million。 本轮包含一级和二级资本，意味着部分早期投资者或创始人实现了部分流动性。新投资者包括 La Caisse（前 CDPQ）、Fidelity
              Investments Canada ULC、PICTON Investments 和 Endeavor Catalyst。 既有股东 Portage、Diagram、NAventures、Fonds de
              solidarité FTQ 和 Fondaction 全部继续参投， 说明股东名册上的信心仍在。

              本轮让 nesto 跻身独角兽——估值达到或超过 C$1 billion——也让 nesto 成为第一家达到这一门槛的加拿大 抵押贷款技术公司。La Caisse 领投的战略意义很强：它是 Quebec
              最主要的机构投资者，管理净资产超过 C$452 billion，投资使命同时带有财务目标和 Quebec 生态目标。La Caisse 执行副总裁 Kim Thomassin 表示，这笔投资“反映了我们对
              nesto 的信心；这是一家总部位于 Montréal 的金融科技公司，凭借商业模式和创新路径脱颖而出。”

              nesto 公开披露的累计融资额目前至少为 C$458 million，来自 Series B（C$76 million，2021 年）、 Series C（C$80 million，2022 年）和
              Series E（C$302 million，2026 年）。Series D（2024 年）金额 未披露。Series E
              含二级交易部分，但股份数量、创始人稀释、优先权堆栈等机制仍未公开，无法精确分析股权结构。 即便有这层不透明，本轮的机构覆盖面和 La Caisse 领投，仍为 C$1.47 billion
              估值提供了有分量的验证信号。
