      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              nestogroup.ca 公司网站列出四位仍担任高管的联合创始人：Malik Yacoubi（联合创始人兼 CEO）、Karim Benabdallah（联合创始人兼 CTO）、Damien
              Charbonneau（联合创始人兼 COO）和 Chase Belair（联合创始人兼首席经纪人）。Yacoubi 是公司的主要公众面孔，在 Series E 新闻稿中被引用，并被独立新闻来源标注为
              CEO。Belair 是 nesto 消费者网站列名的首席经纪人。Martin Aubut 担任首席营销官，并在 Series E 公告中列为媒体联系人。


              关键人物风险不低。四位联合创始人似乎共同掌握战略、产品、技术和运营叙事。公开资料未披露独立董事名单、治理权利或投资者控制条款。CMLS 收购（2024 年）和 Series E（2026 年）已将 La
              Caisse、Fidelity Investments Canada 和 National Bank of Canada 的风投部门等机构投资者带入股权结构，但任何董事席位或控制安排的机制均未公开。


              nesto 于 2023 年获得 B Corp 认证——是全球最早获此认证的按揭贷款机构之一——释放出对社会和环境治理标准的承诺。Morningstar DBRS 于 2025 年给予 Nesto Inc.
              加拿大住宅按揭服务商（MOR RS）评级，趋势为 Stable；Fitch 于 2024 年 10 月确认 CMLS Commercial 的「Primary」「Master」和「Special
              Servicer」评级，为运营可信度提供外部验证。公司还被 Canadian Mortgage Professional（CMP）评为 2025 年 Top Mortgage
              Employer；尽管员工数未披露，该奖项仍暗示组织健康度较好。
