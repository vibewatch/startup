chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              nesto 于 2018 年在加拿大魁北克省蒙特利尔成立，四位联合创始人为 Malik Yacoubi（CEO）、Karim Benabdallah（CTO）、Damien Charbonneau（COO）和
              Chase Belair（首席经纪人）。公司在 Nesto Group 控股结构下以 Nesto Inc. 名义正式运营，总部位于蒙特利尔，并在加拿大多地设办公室。它宣称的使命是打造「Canada's
              Mortgage Ecosystem of the Future」——这种刻意表述同时传递了消费者品牌抱负和 B2B 基础设施野心。


              业务跑在两条互锁轨道上。消费者轨道（nesto 品牌）是 DTC 数字按揭贷款机构，提供购房按揭、续贷、再融资和房屋净值信贷额度（HELOC），并给出 150
              天利率锁定保证——这是加拿大主要贷款机构中宣传最长的锁息期。机构轨道（Nesto Cloud）是自有 B2B 白标平台，为 IG Wealth Management、Canada Life 和 Alterna
              Savings 等金融机构自动化按揭发起、融资与服务。2024 年 6 月收购的 CMLS 将平台延伸至商业按揭贷款，并带来 50 年机构按揭经验。Intellifi 是提供贷款处理服务的运营子公司。最新组件
              Maestro AI 与 2026 年 6 月 Series E 同步推出，是 AI 原生编排层，目标是在企业规模上简化端到端按揭工作流。


              nesto 引用 CMHC 数据称，加拿大未偿按揭市场约为 C$2.1 trillion，并将其整合打法——结合 DTC 贷款、B2B 技术授权、经纪渠道合作和 AI
              自动化——定位为可防守的多边战略。第三方行业来源将 nesto 与 Pine、Strive 并列为重塑经纪人体验的数字贷款机构，区别于传统银行贷款机构。
