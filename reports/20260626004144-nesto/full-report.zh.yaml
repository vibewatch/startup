      - CV043
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的七个投资维度评分，采用 1–5 分制，5 分最强。
    data:
      items:
        - label: 市场机会
          value: 5
          note: 加拿大按揭市场 C$2.1T；经纪渠道增长；AI 平台扩张
        - label: 业务验证
          value: 4
          note: C$80B MUA、C$37B+ 放款、已盈利、Deloitte Fast 50
        - label: 竞争护城河
          value: 3
          note: 多品牌策略有防守性；银行渠道存在重新切入风险；AI 护城河尚未验证
        - label: 单位经济
          value: 2
          note: 已盈利，但未披露毛利率、CAC 或 LTV 数据
        - label: 风险画像
          value: 2
          note: 高：按揭周期性、收入不透明、合规投诉
        - label: 估值纪律
          value: 3
          note: 估算约 4x P/S 属于公允但不便宜；已考虑私募溢价
        - label: 证据质量
          value: 3
          note: 机构背书强；财务透明度弱；Trustpilot 反馈不利
    approximationNotes: 评分是基于公开证据的定性判断，不是量化财务模型输出。证据质量维度反映信息可得性，而非公司表现。
