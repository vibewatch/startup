      - number: '8.6'
        title: 最终建议与尽调要求
        blocks:
          - type: paragraph
            body: >-
              建议：跟踪。nesto 是一家高质量公司，处在可防守的市场位置；相对公开金融科技抵押贷款同行的估算收入倍数， C$1.47 billion
              是合理估值。但收入、利润率和股权结构数据完全缺失，使现阶段无法给出有信心的买入判断。 如果投资者在本轮进入，就必须完全基于对机构投资人财团的信任，承销其盈利声明、贷款发放量轨迹和 Nesto Cloud
              合同账本。以该隐含倍数看，这属于高于平均水平的风险位置。

              能把建议从跟踪推到买入的核心尽调项包括：确认收入在 C$300–450 million 区间且毛利率不低于 50%，Nesto Cloud 合同金额和续约率能证明 B2B 经济性有粘性，Maestro AI
              已贡献收入或已有签署 LOI，以及在当前估值下厘清优先权 瀑布和创始人稀释。下轮触发器应设在以下任一迹象：年化贷款发放量低于 C$25 billion、BoC 利率持续升至 3% 以上， 或 Nesto
              Cloud 合作伙伴流失。

              信心水平为中等，因为 La Caisse、Fidelity 和既有投资者的机构验证提供了有意义的信号；但对一家接近潜在 IPO、
              且达到这一规模的公司来说，收入不透明并不常见。风险评级为高，原因是抵押贷款市场周期性、私有公司倍数压缩风险， 以及 Trustpilot
              反映的运营投诉信号。估值立场为合理：按估算倍数看，价格与同行一致，但并不明显便宜。若贷款发放假设 出现任何实质下修，估值就会进入偏贵区间。
