      - number: '5.2'
        title: 平台架构与安全基础设施
        blocks:
          - type: paragraph
            body: >-
              nesto 的技术栈搭建在 Google Cloud Platform（GCP）之上，获得托管基础设施、自动扩缩容和持续安全补丁覆盖。所有传输中数据均使用 TLS 1.2 或更高版本加密；所有静态数据均使用
              AES-256 加密。平台代码在生产部署前经过自动静态分析扫描、强制同侪评审和年度渗透测试。一个全职专门安全团队全天候监控环境。

              nesto 持有三项独立合规认证：SOC 1 Type II（财务报告相关控制）、SOC 2 Type II（安全性、可用性和保密性）以及 ISO 27001:2022（信息安全和风险管理）。GCP
              托管基础设施加上这组三重认证，支撑了 nesto 的企业客户野心：IG Wealth 和 Canada Life 等大型受监管金融机构在部署白标抵押贷款服务前，需要这一级别的保证。

              安全页面明确提到面向企业尽调咨询的 Trust Center，但截至 2026 年 6 月，公开 Trust Center URL 无法访问。公司未发布公开开发者门户、API
              文档或集成沙盒；客户接入似乎通过直接商业谈判完成，而非自助工具。这种不透明限制了外部对平台架构主张的独立技术验证。
