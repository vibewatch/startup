  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入流
        blocks:
          - type: paragraph
            body: >-
              nesto 采用混合收入模式，结合四条互锁收入流，各自的利润率特征和资本需求不同。按总额计算最大的是直接资产负债表贷款：nesto
              在自有账簿上发起并融资按揭，赚取资金成本与向借款人收取的按揭利率之间的净息差（NIM）。截至 2026 年 6 月 25 日，nesto 挂牌受保五年固定利率为 4.09%，受保浮动利率（Prime 减
              1.05%）为 3.40%，同期 Bank of Canada 政策利率为 2.25%。在扣除资金成本、信用损失和运营成本前，这意味着受保产品约 185–365 个基点的总利差。


              第二条收入流是经纪人和发起方佣金。在加拿大，按揭贷款机构通常按每笔放款交易向经纪人支付约 100–110 个基点。nesto 通过 M3 Group 合作（8,500+
              经纪人）融资的交易可赚取贷款机构经济收益，但当它通过经纪渠道发起时，也会支付介绍费。每笔已融资交易的净佣金取决于渠道组合。


              第三条收入流是通过 Nesto Cloud 获得的 B2B SaaS 授权。IG Wealth Management、Canada Life 和 Alterna Savings 支付授权和服务费，以使用
              nesto 的白标按揭发起、融资和管理平台。合同结构——按单元、按已融资交易，还是按 AUM 收取固定费——未公开。


              第四条收入流来自 C$80B+ 管理中按揭（MUA）的服务收入。加拿大行业标准服务商费用约为每年未偿余额的 10–15 个基点。将 10 bps 套用到 C$80B，得到估计 C$80 million
              年服务收入；考虑 CMLS 带来额外商业服务业务，这只是底部估算。HELOC 产品（Prime + 0.50% = 4.95%）增加了第五条收入流，可能拥有更高 NIM 和循环余额耐久性，但 HELOC
              账簿规模未披露。
