      - number: '4.2'
        title: 资本结构、融资历史与充足性
        blocks:
          - type: paragraph
            body: >-
              nesto 已披露资本历史合计至少 C$458 million：2021 年 C$76 million Series B（PCM Encore 领投）、2022 年 12 月 C$80 million
              Series C（IGM Financial 领投）、2024 年中的未披露 Series D（与 CMLS Group 收购同步），以及 2026 年 6 月 C$302 million、估值 C$1.47
              billion 的 Series E。Series E
              同时包含一级资本（进入公司资产负债表的新股权）和二级资本（为现有股东提供流动性）。精确的一二级拆分未披露，这很重要：如果二级占比很高，新增运营资本会低于标题数字暗示的水平。


              La Caisse（原 CDPQ）是魁北克主要机构投资者，净资产超过 C$450 billion，领投了新投资者部分。这是一次重要的机构背书，也很可能带来董事会代表，尽管治理机制未公开。Fidelity
              Investments Canada ULC、PICTON Investments 和 Endeavor Catalyst 作为新投资者加入；既有投资者
              Portage、Diagram、NAventures（National Bank 的风投部门）、Fonds de solidarité FTQ 和 Fondaction 继续参与。


              资产负债表按揭贷款资本消耗高。nesto 声称 2026 年放款 C$37 billion，意味着需要相当规模的仓储额度或证券化能力：加拿大非银行贷款机构通常需要对资产负债表贷款配置 10–20%
              股权资本覆盖，并通过 CMHC 的证券化计划接入 NHA Mortgage-Backed Securities（MBS）或 Canada Mortgage Bonds（CMB）。nesto 在 CMHC
              注册表中可见的 NHA Approved Lender 身份确认，它可以参与 NHA
              证券化框架，相比持有至到期融资降低资产负债表资本强度。实际仓储额度规模和资金成本未公开。基于融资历史和运营规模，公司看起来至少到 2027 年资金充足，尽管 CMLS 收购成本和总债务义务仍未知。
