      - number: '1.5'
        title: 证据缺口与尽调问题
        blocks:
          - type: paragraph
            body: >-
              nesto 有几项重要事实没有公开，这是真正的尽调缺口，而不是研究失败。收入和 ARR 未披露；最接近的公开代理指标是 Deloitte Fast 50 增长认可和管理层盈利声明。Nesto Group
              的准确员工数未见于任何公开页面——nesto.ca 消费者网站提到 300+ 按揭专家，但仅覆盖 DTC 品牌。CMLS Group 收购价格和 Series D 金额未披露。Series E
              的二级部分意味着投资者获得部分流动性，但股份数量、稀释和投后股权结构均未公开。


              治理侧没有公开董事会名单、董事独立性声明或投资者控制条款。对一家管理 C$80B+ 按揭、并在加拿大各省持有监管牌照的公司而言，缺少任何公开治理披露，是潜在机构合作伙伴和投资者面前的重大盲点。


              还需要记录一个身份差异：本次研究任务简报提到「Damian Chlopecki」为联合创始人，但当前 nestogroup.ca 公司首页列出的四位联合创始人为 Malik Yacoubi、Karim
              Benabdallah、Damien Charbonneau 和 Chase Belair。抓取到的任何来源中都没有出现「Damian
              Chlopecki」或任何变体。这可能反映联合创始人离任、姓名差异，或简报数据错误；尽调需要澄清。
            claimRefs:
