      - number: '4.5'
        title: 财务缺口、风险与尽调结论
        blocks:
          - type: paragraph
            body: >-
              财务尽调中最大的缺口，是 nesto 对收入、利润率和资本结构的全面不透明。收入、ARR、毛利率、EBITDA、员工人数、净债务以及 CMLS 收购价格均未披露。Series D
              融资金额也未披露。私营公司不披露这些信息并不罕见，但会阻止投资人做出高置信度的财务承销。其投资人阵容——La Caisse、FIC、National Bank、IGM
              Financial/Portage——都是能够看到完整财务图景的机构；公开尽调无法复制这一视角。


              关键财务风险包括：（1）资产负债表资本强度——nesto 是直接贷款机构，MUA 超过 C$80B，任何融资市场扰动（仓储额度利差扩大、MBS 市场冻结）都可能迅速损害流动性并挤压 NIM。加拿大非银行贷款机构在
              2020 年和 2022 年信用错位中经受过考验；nesto 在当前规模下抵御信用事件的能力尚未被验证。（2）利率压缩风险——如果 Bank of Canada 进一步降息，或竞争对手跟进 nesto
              定价，NIM 压缩不可避免。（3）运营扩张——2026 年 Trustpilot 负面评论显示，人机协同承保模式正在承压。（4）收入集中——如果 IG Wealth 和 Canada Life B2B 合同占
              Nesto Cloud 收入相当大比例，未续约或合同重新定价会对财务造成实质影响。


              总体看，nesto 的财务画像符合一家资金充足、快速增长、接近或已经达到 EBITDA 盈亏平衡的非银行抵押贷款机构。Series E 按估计 MUA 的 14.7x 定价（C$1.47B / C$80B ×
              100 = MUA 的 1.84%——金融科技贷款机构常用估值指标），说明投资人给了超出纯贷款经济性的技术溢价。投资确信度应以完整财务资料室审阅为条件，覆盖经审计收入拆分、资金成本、仓储额度条款、Series D
              和 CMLS 交易条款，以及详细股权结构表。
