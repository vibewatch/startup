      - number: '5.3'
        title: B2B 基础设施——Nesto Cloud、Maestro AI 与 Intellifi
        blocks:
          - type: paragraph
            body: >-
              Nesto Cloud 是公司的白标 B2B 抵押贷款发起和服务平台，随 2022 年 12 月 C$80M Series C 一同推出。平台通过品牌化界面开放 nesto
              的端到端发起、融资和服务能力，由合作金融机构呈现给自己的客户。已记录部署包括 IG Wealth Management，其使用 Nesto Cloud 向顾问网络交付数字抵押贷款服务；以及 Canada
              Life，Nesto Group 为其现有组合接管住宅抵押贷款服务和管理。两个案例都强调实时状态追踪、移动端文件上传和快速周转，是平台的差异化特征。

              2024 年 1 月，nesto 通过与 M3 Mortgage Group 的独家联盟进入经纪渠道。M3 是加拿大最大经纪网络，拥有 8,500 多名关联经纪人。该合作规定 D2C
              和经纪渠道利率相同——这一承诺并不常见，回应了传统上对数字贷款机构以利率压低经纪人的担忧。随后，信用合作社 Alterna Savings 与 Nesto Group 的运营子公司 Intellifi 合作，为
              Alterna 会员和经纪人简化抵押贷款处理。

              Maestro AI 于 2026 年 6 月随 Series E 完成同时推出。公司将其描述为一个「AI
              原生编排平台，旨在大幅简化端到端抵押贷款运营，并现代化金融工作流」。截至报告日期，尚无独立技术评审、架构文件或基准测试发布。该平台看起来是位于 Nesto Cloud
              之上的编排层，而非独立产品；但自动化的精确范围——基于规则的流程自动化、大语言模型推理，还是概率式承保——尚未披露。

              Intellifi 是一家全资运营子公司，向 Nesto Group 和第三方机构提供贷款处理服务。2024 年 6 月收购的 CMLS，把集团平台延伸至商业和多户住宅抵押贷款发起；其自身拥有 50
              年机构贷款历史，并获得 DBRS 和 Fitch 评级。
