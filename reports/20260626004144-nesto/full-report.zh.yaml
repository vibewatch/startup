      - number: '1.3'
        title: 融资历史、估值与投资者图谱
        blocks:
          - type: paragraph
            body: >-
              nesto 自 2021 年以来完成多轮融资，Series B、C、E 披露金额合计至少 C$458 million（2024 年 Series D 未披露）。2026 年 6 月 10 日的 Series E
              是关键事件：融资 C$302 million，投后估值 C$1.47 billion，约 US$1.07 billion；该轮使公司获得独角兽身份，并引入 La Caisse、Fidelity
              Investments Canada ULC、PICTON Investments 和 Endeavor Catalyst 等战略机构新投资者。La Caisse（原
              CDPQ）是魁北克主要机构投资者，领投了新投资者部分。


              此前融资路径如下：C$76 million Series B（2021 年，PCM Encore 领投）支持早期增长；C$80 million Series C（2022 年 12 月，IGM Financial
              领投）支持 Nesto Mortgage Cloud 推出；2024 年中的未披露 Series D 与 CMLS Group 收购同步推进。Diagram Ventures 和 Portage
              的早期机构支持，反映公司起源于有支撑的 fintech 孵化；Portage 本身由 IGM Financial 和加拿大主要金融机构支持，让 nesto 深深扎根于加拿大金融服务建制体系。Series E
              同时包含一级和二级资本，意味着部分早期投资者或创始人可能已获得部分流动性。


              累计融资和精确所有权结构未公开。Series E 的二级部分创造了估值参考点，但股份数量、创始人稀释、授予董事席位等机制仍属私密。nesto 连续三年入选 Deloitte Technology Fast
              50，佐证其收入高速增长，尽管绝对收入数字未披露。
