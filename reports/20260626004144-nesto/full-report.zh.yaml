      - number: '6.5'
        title: 扩张、集中风险与伙伴分发
        blocks:
          - type: paragraph
            body: >-
              nesto 的扩张机会结构性强劲：续约潮（仅 2026 年就约 115 万笔抵押贷款到期续约）、向 450K+ 现有借款人交叉销售 HELOC，以及 Nesto Cloud 合作伙伴管线（Series E
              公告称「以涡轮速度接入伙伴」），都代表有意义的近期收入加速路径。DTC、经纪、白标 B2B 和商业构成的多渠道模型，有意分散发起来源。


              集中风险也是真实存在的。续约潮有时间属性：如果 2020–2022 利率周期 cohort 消化完后，2027 年之后续约量正常化，nesto 将面临周期性逆风。M3
              合作具有实质重要性；如果独家或优先关系发生变化，它可能成为单一分销失效点。机构伙伴（IG Wealth、Canada
              Life、Alterna）集中在少数具名客户；其交易量和收入贡献未披露，无法评估任何单一伙伴带来的收入集中度。技术集中也是相关担忧：所有 Nesto Cloud
              白标伙伴都依赖同一平台，意味着严重宕机会同时影响多家机构面向客户的抵押贷款服务。


              Ontario、Quebec 和 British Columbia 的地域集中是加拿大抵押贷款市场内生特征，但也带来高 AVM 市场中的利率压缩敞口。nesto 主要靠价格和数字体验竞争；CMHC 2026 显示
              77% 的线上研究者会比较利率，证实这是正确战场。不过，如果 Big Six 加快自身数字发起投资，或全行业贷款机构利差压缩，nesto 的 DTC 价格优势可能收窄。HELOC 推出后的采用情况，以及
              FCAC/OSFI 对数字非银行贷款机构的监管姿态，是另外两个缺少公开数据的变量。
