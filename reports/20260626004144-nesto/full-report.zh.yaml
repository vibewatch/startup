      - number: '3.4'
        title: 经纪网络与银行渠道
        blocks:
          - type: paragraph
            body: >-
              既有经纪网络——Dominion Lending Centres（DLC）和 Mortgage Alliance——是加拿大住宅按揭发起中最大的分销中介。DLC 声称拥有 4,200 名经纪人、覆盖 500+
              办公室、20 年运营历史，并自称在加拿大融资的按揭多于任何其他组织。Mortgage Alliance 自称是连接「Right Broker」的「#1 place」，运营 20+
              年，并采用一次申请、多贷款机构模式。这些网络在消费者发起上是渠道竞争者，但也可能成为 nesto 的贷款机构客户——当 nesto 利率有竞争力时，DLC 经纪人会向 nesto
              提交交易。关键战略背景是：nesto 2024 年与 M3 Mortgage Group（按某些口径为加拿大最大经纪网络，可接入 Maestro AI
              编排层）的合作，将一个曾经纯粹的分销竞争者转化为渠道伙伴，经纪人提交的交易通过 nesto 的承保和资产负债表放款。

              加拿大 Big Six 银行——尤其是 RBC、TD 和 BMO——是最强的结构性竞争对手。RBC 的按揭平台结合在线预批、Home Value
              Estimator，以及线下或视频按揭顾问，并由加拿大最大的零售银行网络支撑。TD 的一体化数字银行生态将按揭与支票、储蓄和信用产品捆绑，形成强大的交叉销售锁定。BMO 于 2024 年初通过 BMO
              BrokerEdge 重返经纪渠道，与 First National 合作承保，直接与 nesto
              竞争经纪人提交的优质按揭。银行的竞争强项不在发起创新，而在资产负债表深度、存款融资优势，以及完整关系迁移的摩擦——这些因素让它们成为耐久但慢速移动的既有巨头，而不是技术颠覆者。
