      - number: '8.2'
        title: 可比公司集合与倍数分析
        blocks:
          - type: paragraph
            body: >-
              要判断 nesto 的隐含收入倍数，必须先估算收入，因为公司没有披露财务报表。按抵押贷款发放经济模型估算—— 结合出售收益、净息差和费用收入的贷款机构，每 1 美元发放额通常可获得 75 至 125
              个基点的净收入—— nesto 披露的 2026 年超过 C$37 billion 发放额，对应估算收入约 C$278 million 至 C$463 million， 中点约 C$370 million。以
              C$1.47 billion 估值和 C$370 million 收入中点计算，隐含市销率约为 4.0x。这个估算只是粗略结构判断；nesto 的实际收入组合（贷款发放、服务、B2B 平台授权）可能让每 1
              美元发放额对应的经济性不同。

              公开可比公司为估算提供锚点。Rocket Companies（NYSE: RKT）是美国最大的数字抵押贷款发放机构， 截至 2026 年 6 月 25 日，基于 US$8.91 billion
              的过去十二个月收入，其市销率为 3.74x，企业价值 / 收入为 7.97x。较高的 EV/Revenue 反映了 Rocket 通过收购 Mr. Cooper 获得的服务规模。Blend Labs（NYSE:
              BLND）是美国抵押贷款发放软件平台，与 nesto 的 Nesto Cloud B2B 产品最相近；其基于 US$127.6 million 的过去十二个月收入，交易倍数为 3.44x P/S 和 2.77x
              EV/Revenue，企业价值 US$334.6 million，杠杆自由 现金流 US$12.5 million，显示其正接近可持续状态。EQB Inc（TSX: EQB）是加拿大领先的另类和数字银行， 基于
              C$1.06 billion 的过去十二个月收入，交易倍数为 3.62x P/S 和 25x P/E，已盈利，净利率为 18.7%。

              私有公司 First National Financial LP 仍是加拿大最大的非银行抵押贷款发放机构，可作为纯贷款发放经济性的 参照，尽管它没有公开可比估值。英国数字抵押贷款经纪商 Habito 在 2021
              年融资 £35 million，2023 年被 Generation Home 收购，交易估值未披露、几乎可以确定已被压缩；这说明数字抵押贷款中介如果在利率周期下行前 没有跑出正向单位经济，可能面对的下行情景。

              nesto 估算的 4.0x P/S 隐含倍数，位于 Blend Labs（2.77–3.44x）与 Rocket Companies（3.74–7.97x） 之间，并带有适度的私有公司溢价，反映 nesto
              更高的增长轨迹、盈利状态和平台可选性。这个溢价是否合理， 取决于收入轨迹和单位经济能否被确认，而这些信息仍未披露。
