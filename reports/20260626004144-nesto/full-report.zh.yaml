      - number: '1.4'
        title: 规模、运营与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              按加拿大按揭市场标准，截至 2026 年 6 月，nesto 的运营规模已经可观。公司管理超过 C$80 billion 住宅和商业按揭，2026 年至今已发起超过 C$37 billion
              按揭，并已盈利。消费者品牌称截至 2026 年中已帮助 450,000+ 加拿大人。Nesto Group 公司网站提到全品牌 500,000+ 客户。450K 与 500K+ 的差异很可能对应 nesto
              DTC 品牌与完整 Nesto Group 伞形结构；两个数字均为公司口径且未经审计。


              产品和合作里程碑呈现出有意设计的推进路径：nesto 从经纪人（2018–2019 年）走向直接贷款机构（2020 年），随后完成 Series B/C 融资并推出 Mortgage Cloud B2B（2022
              年），再进入一连串机构合作（IG Wealth Management 2022 年、Canada Life 2023 年、M3 经纪渠道 2024 年、Alterna Savings 2024 年），最终到
              CMLS 收购（2024 年）和 Series E（2026 年）。2025 年 Maple Financial 投资显示公司进入另类按揭贷款。与此同时，nesto 反复获得行业认可：2023、2024、2025
              年 CLA Mortgage Lender of the Year；Forbes Advisor Best Mortgage Lender；GPTW Best Workplaces；以及连续三年 Deloitte
              Fast 50。


              消费者 NPS 70（2022 年报告）以及 nesto.ca 首页 1,100+ 条评价中的 4.5/5 评分，显示整体客户满意度强。不过，截至 2026 年 6 月，第三方 Trustpilot 评价给
              nesto
              4/5（「Great」），同时有一条可见的负面长尾：持续的申请后销售电话（有评论者称为骚扰），以及面向自雇借款人的混乱承保流程。这些负面信号符合早期成长型公司的服务缺口，目前尚未指向系统性监管问题，但随着
              nesto 扩张，应持续监测。
