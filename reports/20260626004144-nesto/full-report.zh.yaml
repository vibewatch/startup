    summary: 假设通过 IPO 或战略收购退出，3–5 年周期内牛市、基准、熊市情景下的示意性退出估值区间。
    data:
      items:
        - label: 熊市情景
          low: 600
          high: 960
          midpoint: 780
          unit: C$M
          note: 交易量压缩 25–35%；收入 C$200–275M；3.0–3.5x P/S
        - label: 当前估值（Series E）
          low: 1470
          high: 1470
          midpoint: 1470
          unit: C$M
          note: 2026 年 6 月 Series E 锚点
        - label: 基准情景
          low: 1600
          high: 2500
          midpoint: 2050
          unit: C$M
          note: 收入 C$400–500M；3.5–4.5x P/S；25–30% CAGR
        - label: 牛市情景
          low: 3000
          high: 3600
          midpoint: 3300
          unit: C$M
          note: 收入 C$550–700M；Maestro AI 跑出牵引力；5–6x P/S
    approximationNotes: 所有区间仅作示意；依据估算收入情景和上市可比公司 P/S 倍数。未对未来融资轮稀释作调整。
