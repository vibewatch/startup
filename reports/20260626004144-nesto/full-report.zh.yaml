      - number: '7.2'
        title: 市场与财务风险
        blocks:
          - type: paragraph
            body: >-
              nesto 管理中抵押贷款超过 C$80B，2026 年上半年放款超过
              C$37B。这种资产负债表敞口意味着，加拿大抵押贷款拖欠率持续上升或房价大幅修正，会直接转化为信用损失和减值；纯经纪人的收入以费用为主，不承担同样风险。Bank of Canada 的 2026
              Financial Stability Report 指出，尽管家庭和银行仍处于稳定财务状态，但「系统部分环节的脆弱性已经上升」，且「更动荡的全球环境给金融稳定带来风险」。


              加拿大房价近期已经下跌——OSFI 国内稳定缓冲公告中也承认了这一点——家庭债务收入比虽低于近期峰值，但按历史标准仍处高位。根据 CMHC，约 200 万笔抵押贷款将在 2026 和 2027
              年续约，许多贷款面临显著高于原合同的利率。nesto 受益于续约需求，但其中一部分借款人如果不重新谈价，可能无法按当前利率通过资格审核，从而在 nesto 的续约管线中形成逆向选择风险。


              nesto 的贷款模式依赖持续以可接受利差获得批发融资——仓储信贷额度、证券化和资本市场。2026 年 6 月 Series E（C$302M）提供了跑道，但资产负债表抵押贷款天然资本密集，且 Series E
              中的二级部分暗示部分早期投资人希望按 C$1.47B 估值获得部分流动性。信用市场恶化、非银行贷款机构风险重新定价，或银行仓储额度撤回，都会突然限制发起能力。Equitable Bank
              公开报告的财务数据说明了加拿大非银行抵押贷款行业内生的信用损失和融资风险。


              nesto 未披露收入和利润率结构，使外部无法精确量化其利率敏感性。固定利率抵押贷款在发起时锁定利差；如果资金成本上升或收益率曲线趋平，净息差会被压缩。OSFI DSB 下调（2026 年 6
              月）释放了监管机构对银行资产负债表的信心，但更广泛的经济环境——按 BoC 评论，加拿大经济在 2025 年 Q4 和 2026 年 Q1 略有收缩——带来需求侧风险，可能放慢放款增长。
