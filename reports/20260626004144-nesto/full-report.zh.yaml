      - number: '7.4'
        title: 伙伴集中、竞争与地域风险
        blocks:
          - type: paragraph
            body: >-
              nesto 的经纪渠道通过与 M3 Mortgage Group 的独家联盟运营，让 8,500 多名 M3 经纪人接入 nesto 产品。这种独家性既是优势（确保分销规模），也是集中风险：nesto
              没有替代经纪网络；M3 关系一旦恶化——商业纠纷、M3 退出合作、M3 被竞争对手收购——经纪渠道会被整体移除。M3 联盟到 2024 年 10 月才宣布，关系仍不成熟，在压力下的持久性尚未验证。


              B2B Nesto Cloud 方面，IG Wealth Management 和 Canada Life 是两个具名客户，代表集中的机构收入。任一伙伴流失——因收购、抵押贷款技术内建化或竞争替代——都会实质损害
              B2B 收入。nesto 不披露每个客户的收入贡献或合同期限，外部无法独立评估续约风险。


              地域集中增加了一层相关风险：nesto 的 DTC 品牌在 Quebec 和 Ontario 最强。两省家庭债务水平均高于平均值，且 2026-2027 年续约抵押贷款占比较大。Quebec 或 Ontario
              若发生省级房价修正，将同时冲击 nesto 的核心市场。Ontario 房地产监管（FSRA/RECO）和 Quebec 的 AMF/Law 25 框架意味着，任一省份的监管变化都会对 nesto
              产生超比例影响。


              竞争风险正在加剧。Pine、Homewise、Strive 和其他数字抵押贷款机构都在争夺同一批技术敏感型借款人。银行也在加快自身数字抵押贷款能力建设；Scotiabank 住房经济团队和 RBC
              住房展望显示，主要银行资本充足，并在积极争夺续约量。nesto 的 150 天锁息和 AI 平台具备差异化，但无法申请专利；资金充足的银行可以用更低资金成本复制这些功能。C$1.47B 的 Series E
              估值意味着，nesto 必须保持显著放款增长和利润率扩张才能支撑价格，对竞争替代的容错空间很小。
