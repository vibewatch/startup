      - number: '8.4'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              nesto 的投资论点建立在五根支柱上。第一，nesto 已在加拿大 C$2.1 trillion 抵押贷款生态中占据强势位置： 管理 C$80 billion 抵押贷款、业务盈利，并连续三年入选
              Deloitte Fast 50，验证其处于增长上四分位。 第二，一体化多品牌策略——nesto 消费端、CMLS 商业端、Nesto Cloud B2B、Maestro AI——铺出多层收入，
              单一产品竞争对手更难复制。第三，La Caisse 领投用可信的机构标准验证了公司：CDPQ 系投资者带来治理纪律，
              通常也会取得董事席位，降低纯财务工程风险。第四，在这一规模的私有金融科技公司里，“盈利但仍增长”并不常见， 也让 nesto 区别于烧钱同行。第五，Maestro AI
              上线打开了潜在的新收入品类——面向金融服务的 AI 基础设施—— 可能把公司从贷款机构重估为平台，显著扩大抵押贷款之外的可服务市场。

              反论点同样实质。nesto 没有披露收入、单位经济、毛利率、客户 cohort 数据，也没有披露投资者名称以外的股权结构 机制。这种不透明使隐含收入倍数无法验证。Trustpilot
              上的客户投诉包括骚扰指控（申请放弃后频繁致电）和数据处理 担忧，带来监管和声誉风险。B2B Nesto Cloud 业务依赖 IG Wealth、Canada Life 和 Alterna Savings
              的持续合作； 任何主要伙伴流失都会实质性减少收入，而公司无需公开披露。最后，加拿大住房可负担性危机限制新增抵押贷款发放， 即便续贷有顺风；任何宏观恶化都可能迅速压缩发放量，正如 2022 年美国同行经历的情况。
