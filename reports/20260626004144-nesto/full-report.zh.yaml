      - number: '3.3'
        title: 功能、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              加拿大数字贷款机构的功能对比显示，nesto 拥有所有非银行竞争对手中最宽的能力覆盖：它结合了消费者直接发起、B2B 白标贷款云（Nesto Cloud）、AI 编排层（Maestro AI）、商业按揭能力（通过
              CMLS）、经纪渠道（通过 M3），以及 150 天利率锁定——这是加拿大主要贷款机构中宣传最长的锁息期。相比之下，Ratehub 擅长利率比价聚合和 CX 驱动成交，但没有企业 B2B 或商业板块。Pine 和
              True North 在细分 DTC 主张上较强，但范围上受结构限制。

              定价方面，截至 2026 年 6 月 25 日，nesto 的挂牌利率为 4.09% 五年固定（受保）和 3.40% 五年浮动（Prime −1.05%），与经纪渠道 monoline
              利率具备竞争力。Ratehub 展示利率为 4.04%（五年固定）和 3.45%（五年浮动），固定利率略优——这可能反映 Ratehub
              从更广的贷款机构面板取源，而不是用自有资产负债表放款。银行挂牌利率结构性更高，nesto 的利率对比表显示其在每类产品上都较 Big Bank 挂牌利率有明显折扣。WOWA.ca 每日三次聚合 50+
              贷款机构利率，并将 nesto 纳入特色贷款机构，为 nesto 的利率透明定位提供独立分发价值。
