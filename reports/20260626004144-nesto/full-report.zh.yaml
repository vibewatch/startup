companyProfile:
  summary: >-
    nesto 是一家 2018 年创立于蒙特利尔、由 AI 驱动的按揭科技与融资平台，已从加拿大首家全数字按揭贷款机构，演进为多品牌、多元化贷款生态。2026 年 6 月 Series E 由 La Caisse 领投，融资
    C$302 million、投后估值 C$1.47 billion，使其成为加拿大首家按揭科技独角兽，并为 AI 驱动金融服务扩张提供资金。nesto Group 通过五个品牌运营：nesto（DTC
    消费者贷款）、CMLS（商业和机构按揭）、Nesto Cloud（B2B 白标放款平台）、Intellifi（贷款处理）和 Maestro AI（AI 编排）；集团管理超过 C$80 billion 按揭，2026 年至今放款超过
    C$37 billion，并已盈利。公司服务 500,000+ 客户，连续三年入选 Deloitte Technology Fast 50，但精确收入、员工数和股权结构仍未公开。
