      - number: '5.4'
        title: 信任、监管合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              nesto 在加拿大所有省份和地区持有抵押贷款经纪牌照，受 Ontario 的 FSRAO、British Columbia 的 BCFSA、Alberta 的 RECA
              等省级监管机构监管。公司既是持牌经纪人，也是直接贷款机构，住宅抵押贷款承保受 OSFI Guideline B-20 约束。

              nesto Inc. 从 DBRS Morningstar 获得 MOR RS 住宅抵押贷款服务商排名，趋势为 Stable。这是受监管机构客户在外包服务前需要看到的第三方质量信号。CMLS 在商业领域运营，持有
              Fitch 的「Primary」、「Master」和「Special Servicer」评级，使其能够参与 CMBS 和其他结构化金融交易。

              ESG 方面，nesto 于 2023 年获得 B Corp 认证，是全球较早获此认证的抵押贷款公司之一，表明其遵守社会和环境绩效标准。70+ 的 NPS 为公司自报，显著高于加拿大金融服务行业平均水平；这与
              Trustpilot 平均 4/5、1,100+ 条评论的评级一致，但评论中也反复出现自雇借款人文件流程和咨询后联系频率方面的投诉。公司连续三年（2023、2024、2025）入选 Deloitte
