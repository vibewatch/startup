          value: >-
            nesto becomes Canada's first fully digital mortgage lender, transitioning from broker to direct origination
            and establishing technology-first differentiation.
          tone: positive
        - label: 2021 — C$76M Series B
          value: PCM Encore leads Series B; funds DTC growth and rate-leadership strategy.
          tone: positive
        - label: 2022 — C$80M Series C + Nesto Cloud 上线
          value: >-
            IGM Financial leads Series C; Nesto Mortgage Cloud B2B platform launches; IG Wealth Management becomes first
            major institutional client.
          tone: positive
        - label: 2023 — B Corp + CLA Award + Canada Life 合作
          value: >-
            B Corp certification (first in industry); CLA Mortgage Lender of the Year; Canada Life partnership for
            mortgage servicing.
          tone: positive
        - label: 2024 — 收购 CMLS
          value: >-
            nesto acquires CMLS Group (Canada's 3rd-largest mortgage finance company), creating Nesto Group; adds C$60B+
            MUA and commercial lending capability. Series D (undisclosed) concurrent.
          tone: positive
        - label: 2024 — M3 经纪渠道
          value: >-
            Exclusive partnership with M3 Group grants 8,500+ brokers access to nesto products, diversifying origination
            beyond DTC.
          tone: positive
        - label: 2025 — DBRS MOR RS 评级
          value: >-
            Morningstar DBRS assigns MOR RS (Stable) servicer ranking to nesto Inc., validating institutional-grade
            servicing capability.
          tone: positive
        - label: 2025-10 — Maple Financial 投资
          value: >-
            CMLS subsidiary makes strategic equity investment in Maple Financial (alternative lender), signaling
            diversification beyond prime mortgage.
          tone: neutral
        - label: 2026-06-10 — C$302M Series E，估值 C$1.47B
          value: >-
            nesto achieves unicorn status. La Caisse leads new investor group. Concurrent launch of Maestro AI
            orchestration platform. C$80B+ MUA; C$37B+ 2026 originations; profitable.
          tone: positive
        - label: 2026 — 负面：客户体验投诉
          value: >-
            Trustpilot adverse reviews document persistent sales-call harassment and disorganized underwriting for
            self-employed borrowers, signaling service-delivery gaps at scale.
          tone: negative
