      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 跟踪——按估算倍数看估值合理，但买入需要收入披露
            body: >-
              nesto C$1.47 billion 的 Series E 估值由真实运营规模和机构投资者验证支撑，但在没有财务披露的情况下， 无法用实际收入确认。按估算收入中点 C$370 million 计算，隐含约
              4x P/S，与公开金融科技抵押贷款同行一致。 这是合理价格——不是惊人便宜——而且公司核心财务指标仍不透明。继续跟踪，直到管理账目或 S-1 补上缺失证据。 若收入确认超过 C$300M、毛利率超过
              45%、Nesto Cloud 合同金额超过 C$50M ARR，则转为买入。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV010
              - CV028
              - CV045
          - type: callout
            title: 收入不透明是核心风险——不是业务质量
            body: >-
              nesto 当前估值的主要风险不是公司质量，后者很强；风险在于没有任何公开财务披露，无法验证收入倍数。 Blend Labs 2022
              年的经历说明，利率周期下行时，私有金融科技抵押贷款估值可能迅速崩塌。没有收入参照， 潜在投资者只能基于对机构财团的信任定价，而不是基于已验证的基本面。
            calloutType: risk
            claimRefs:
              - CV010
              - CV041
              - CV043
          - type: callout
            title: La Caisse 领投提供可信的机构锚点
            body: >-
              在加拿大语境下，La Caisse 是全球最可信的机构投资者之一，管理资产超过 C$452 billion，并长期持有 Quebec 公司股权。它选择领投 Series
              E，而不是仅仅参投，说明其信心不止来自纯财务分析。Fidelity Investments Canada 和 PICTON Investments 进一步把投资者基础扩展到 Quebec 使命资本之外。
            calloutType: strength
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV030
