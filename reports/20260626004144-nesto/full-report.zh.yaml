  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              nesto
              所在的加拿大住宅按揭市场高度分散，没有任何单一非银行玩家占据主导份额。竞争格局可分为四个不同象限：（1）用自有资产负债表或经纪模式发起贷款的数字直贷机构；（2）聚合需求并分发给多家贷款机构的既有经纪网络；（3）拥有网点基础设施和深厚资产负债表的大银行直营渠道；（4）虽然不在加拿大运营、但架构可作为能力标杆的美国市场平台。nesto
              是第一象限中唯一同时在第二象限有实质足迹（通过 2024 年 M3 Mortgage Group 合作），并拥有企业 B2B 云产品、试图对标第四类能力的玩家。

              截至 2026 年 6 月，经纪渠道承载了约 40% 的加拿大新按揭发起量——高于几年前约 30%——意味着任何缺少可信经纪渠道存在的贷款机构，都会被切断与一个不断增长的复数份额。nesto 的多渠道演进（DTC
              + Nesto Cloud B2B + 通过 M3 的经纪渠道）因此不是可选战略插件，而是达到足以支撑 C$1.47 billion 估值的业务量所需的结构性前提。下方竞争对手画像表捕捉了八个最相关的竞争参考点。
