      - number: '3.2'
        title: 数字直贷机构
        blocks:
          - type: paragraph
            body: >-
              数字直贷机构板块是 nesto 最直接的正面对抗场。Ratehub.ca（2010 年成立）最成熟：其 CanWise Financial 子公司报告已融资按揭 C$23B+，连续四年（2018–2021
              年）获评 Canada's Brokerage of the Year，并汇聚超过 13,000 条客户评价，Trustpilot 评分 4.3/5「Excellent」——略高于 nesto 的
              4/5「Great」。不过，Ratehub 的模式与 nesto 结构性不同：它主要作为利率比价市场运营，通过获客线索变现，再由 CanWise Financial
              完成成交，而不是主要用自有资产负债表直接放款。至少一条客户评价明确称 Ratehub 是「a lead-generating
              organization」，会将咨询导向付费广告主；这是一条立场负面的观察，说明比价优先模式存在感知风险。关键在于，Ratehub 未报告任何可与 Nesto Cloud 竞争的 B2B 云产品。

              Pine.ca 是较新的数字按揭经纪公司，在加拿大六个省获得牌照（Ontario、Alberta、Saskatchewan、Nova Scotia、New
              Brunswick、Newfoundland）。其消费者主张是「home ownership faster, easier and simpler」，但网站主要通过 JavaScript
              渲染，公开可见的规模、融资或产品广度证据有限。Pine 披露融资总额估计为 C$35M——比 nesto 累计 C$458M+ 低一个数量级——限制了其承保能力、利率锁定时长和 B2B 建设。

              True North Mortgage 以固定薪酬顾问模式（无佣金激励）和 20+ 年记录做差异化，声称拥有 16,000+ 条五星评价，并承诺「Lowest Rate in Canada
              Guaranteed」。其 Rate Relief 产品提供六个月减付，帮助客户缓冲高借贷成本。不同于 nesto，True North 拥有实体门店，没有 B2B 平台，也没有机构级商业贷款能力。
