      - number: '2.3'
        title: 买方分层与渠道偏好
        blocks:
          - type: paragraph
            body: >-
              2026 年 CMHC Mortgage Consumer Survey 于 2026 年 1 月 7 日至 2 月 1 日进行，样本为过去 18 个月内办理过按揭的 4,112
              名加拿大人，具有全国代表性；它提供了续贷浪潮高峰期最细颗粒度的借款人行为图景。按交易类型，续贷者占样本 66%，再融资者占 19%，首次购房者占 11%，重复购房者占余下 5%。这一分布确认，2026
              年市场主要是续贷市场，而不是新购房市场；比价平台的效用最适用于占多数的续贷人群。

              首次购房者更年轻（42% 为 25–34 岁），收入也相对较高（49% 收入 C$105,000 或以上），反映可负担性障碍已将平均首付储蓄期推至 4.7 年。72% 的首次购房者此前租房，平均租期 7.6
              年。按揭经纪人在按揭消费者最看重的专业资源中排名第二，占 24%；约 45% 的首次购房者选择经纪渠道。

              数字采用已经普遍且仍在加深：77% 的按揭消费者进行在线研究，33% 使用利率比价网站，32% 咨询经纪人网站，46% 的在线研究者在线提交预批申请。16% 在研究阶段使用 AI
              工具。三分之一全程远程完成交易。尽管结果指标总体积极，42% 的 2026 年按揭消费者仍对最近一次交易的某个方面表示后悔——这种持续不满信号，让聚焦透明度的数字经纪人和平台在结构上有能力解决痛点。
