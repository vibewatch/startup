      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景建立在一个前提上：nesto 能把 AI 平台（Maestro AI）货币化，做成超越抵押贷款的横向金融服务层。 如果 Maestro AI 吸引多家金融机构客户并收取 SaaS
              式授权费，同时贷款发放量维持在每年 C$45 billion 以上，nesto 可能在三年内达到 C$500–700 million 收入。按 C$600 million 收入和 5–6x P/S 倍数计算，
              隐含估值为 C$3.0–3.6 billion，较当前 C$1.47 billion 标记提升 2–2.5x。该情景要求加拿大及更广泛的 抵押贷款市场保持活跃、金融机构加速采用 AI 平台，并且 nesto
              能在经纪渠道抵住银行竞争、守住利润率。

              基准情景假设收入以 20–30% 的复合年增长率增长，与 Deloitte Fast 50 三年轨迹一致，到 2027–2028 年 收入约达 C$450–550
              million。按与同成长阶段公开金融科技同行一致的 3.5–4.5x P/S 倍数计算，隐含估值 区间为 C$1.6–2.5 billion，相比本轮估值只有温和退出溢价。考虑 La Caisse
              典型投资周期，三到五年内 IPO 或战略收购具有可行性。

              熊市情景则是住房市场持续修正——由全球贸易不确定性、失业率上升或重新加息驱动——使贷款发放量压缩 25–35%。收入会降至 C$200–275 million。按压缩后收入和 3.0–3.5x P/S
              计算，隐含估值约 C$600–960 million，低于 Series E 标记。在这种情景下，下一轮融资可能平轮或下轮，或者以低于 Series E 的水平被迫出售。 Blend Labs 在 FY2022
              的经历——包括 US$449.7 million 商誉和无形资产减值——说明利率周期反转时，抵押贷款 平台估值能多快被压缩。Bank of Canada Financial Stability Report
              2026 指出，“系统某些部分的脆弱性已经上升”， 为这一风险提供了宏观背景。
