      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              2026–2027 年的主导增长催化剂是续贷浪潮。约 1.15 million 笔按揭——许多是在 2020–2021 年购房潮中以超低利率发起——将在 2026 年续贷，随后 2027 年还有 940,000
              笔。续贷借款人面临明显更高的月供：CMHC 2026 MCS 发现，35% 在续贷时承受财务压力，平均月供增加 C$375。这一付款冲击推动比价和经纪人参与。消费者对违约的担忧从 2025 年的 53% 降至
              2026 年的 39%，与 Bank of Canada 降息缓和还款压力一致——但比价的结构性激励仍然强。

              Bank of Canada 在从 5.0% 高点降息后，于 2026 年 6 月将隔夜利率维持在 2.25%。2026 年 Q1 GDP 按年率收缩 0.1%，2026 年 4 月通胀为
              2.8%（能源驱动），2026 年 5 月失业率为 6.6%。BoC 将中东冲突和美国关税不确定性列为关键风险，在维持利率的同时暗示 2026 年 Q2 温和增长恢复。OSFI Domestic
              Stability Buffer 自 2026 年 6 月 19 日起降至 3%，为 Big Six 释放约 C$74 billion 可部署资本，并可能带来最高 C$673 billion
              风险加权资产扩张。随着更多贷款机构通过经纪分销争夺份额，这可能加剧按揭发起竞争，并利好经纪渠道平台。

              约束因素也很实质。OSFI 压力测试继续缩小购房市场合格买家池。Toronto 和 Vancouver 的可负担性仍处于结构性紧绷。Bank of Canada 行长在 2026 年 6
              月明确提醒，降低资本要求本身不会引发广泛贷款增长——Big Six 近几个季度贷款增长低迷或持平——直接挑战了对 DSB
              下调最乐观的解读。美国关税不确定性和持续的中东冲突增加宏观下行风险。这些约束的重量意味着，2026 年增长故事由续贷和比价平台驱动，而不是新购房驱动。
