  - id: TV005
    title: 破坏投资论点与否决触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 放款量下滑
        - 年化放款量跌破 C$25B（降幅 >30%）
        - 收入被压到 C$200M 以下；验证熊市情景；下一轮融资存在降估值风险
        - 退出或减仓；重新进入前要求披露收入
      - - Nesto Cloud 合作伙伴流失
        - IG Wealth、Canada Life 或 Alterna Savings 任一终止合作
        - 削弱 B2B 收入和多边平台叙事；新客户的 AI 授权销售说法受挑战
        - 升级为重大不利变化；要求收入拆分
      - - 监管 / 合规行动
        - OSFI、FCAC 或省级监管机构执法或公开警告
        - 运营受扰；声誉受损；潜在贷款牌照风险
        - 暂停任何追加投资；30 天内评估重大性
      - - 管理层离职
        - Series E 后 18 个月内失去 CEO Malik Yacoubi 或 CTO Karim Benabdallah
        - 暗示与 La Caisse 战略错位，或内部结构存在问题
        - 与领投方启动沟通；不承诺新资金
      - - Bank of Canada 利率反转
        - 2026–2027 年 BoC 隔夜利率升至 3.5% 以上
        - 住房可负担性恶化；放款量被压缩；续贷优势收窄
        - 对放款预测做压力测试；下调熊市估值目标
    notes: 触发器基于 nesto 商业模式依赖项的公开信息，以及 Bank of Canada FSR 2026 的宏观信号。
    claimRefs:
      - CV007
      - CV008
      - CV033
      - CV037
      - CV040
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和毛利率
        - 无公开收入数字；无毛利率；无按产品线拆分的单位经济性
        - 无法验证 C$1.47B 是对应 3–5x P/S，还是拉伸到 6–8x；所有情景分析都由此驱动
        - 要求审计后的管理账，或 CFO 级别数据室披露
      - - 股权结构和优先权堆栈
        - 未披露股数、优先清算顺位，或 Series E 后创始人稀释情况
        - Series E 含老股部分，意味着部分流动性；优先权悬置会影响回报测算
        - 向领投方（La Caisse）索取股权结构摘要和清算瀑布模型
      - - Nesto Cloud 合同簿
        - IG Wealth、Canada Life、Alterna Savings 的合同金额、续约率和流失未披露
        - 相比纯放款方，B2B 平台是核心估值溢价；看不到 ARR，就仍是叙事
        - 要求合作伙伴合同摘要（受 NDA 保护）；向合作伙伴做管理层背调
      - - Maestro AI 变现
        - Maestro AI 与 Series E 同期发布；暂无收入、客户或合同数据
        - AI 平台扩张是牛市情景催化剂；没有牵引力证据，它只是未来期权
        - 寻找已签 LOI、早期采用者披露，或带收入目标的产品路线图
      - - 运营投诉解决
        - Trustpilot 出现骚扰、数据担忧和服务失败报告（2026 年 6 月）；未见公开解决
        - OSFI/FCAC 投诉数据及任何未结监管问询，可能实质影响牌照
        - 要求投诉处理数据、监管沟通日志和 OSFI 往来函件
    notes: 尽调要求按对估值的重大性排序。所有项目都是后期私营成长公司进入 IPO 准备阶段的标准材料；缺少这些数据是私募市场有意保留信息的常态，不必然是红旗，但会限制确信度。
    claimRefs:
      - CV010
      - CV031
      - CV037
      - CV039
      - CV041
