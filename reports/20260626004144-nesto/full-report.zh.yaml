      - number: '3.5'
        title: 美国能力标杆——Blend Labs 与 Figure
        blocks:
          - type: paragraph
            body: >-
              两家美国 fintech 公司——Blend Labs 和 Figure——可作为 nesto B2B 和消费者贷款野心的产品能力标杆，尽管两者均不在加拿大运营。

              Blend Labs（NASDAQ: BLND）是 Nesto Cloud 最接近的美国类比：一个纯 B2B 数字发起平台，服务银行、信用合作社和独立按揭银行。Blend 称其平台每笔贷款为贷款机构节省超过 16
              小时，让贷款机构用同样员工数将贷款量提高 33%，并可最快 4 周上线。BMO 本身在美国通过 Blend 实现了每年节省 10,000 小时、数字房屋净值申请同比增加 53%——而同一家银行现在通过加拿大
              BMO BrokerEdge 与 nesto 竞争。Blend 标杆显示，企业级 B2B 按揭技术在美国可以获得怎样的价值：如果 Nesto Cloud 能在加拿大证明可比的单位经济，其 TAM
              论证会明显增强。Blend 不服务加拿大金融机构。

              Figure.com 是美国 #1 非银行 HELOC 贷款机构，使用基于区块链的发起模式，为美国房主释放了 C$25B+ 房屋净值。Figure 的 5 分钟审批和 5
              天放款时间线（相对于行业常见的数天到数周）展示了 AI 加速贷款的技术前沿。Figure 服务 350+ B2B 合作伙伴，其 Figure Connect 市场承载美国 HELOC 交易量的
              40%，并在真实世界资产代币化中占 75% 市场份额。Figure 的 Maestro 等价 AI 能力（2025 年将处理成本削减 20 倍）为 nesto 的 Maestro AI
              推出提供直接产品路线图标杆。
