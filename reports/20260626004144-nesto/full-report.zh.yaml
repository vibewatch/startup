            title: M3 单渠道集中
            body: nesto 的经纪分销完全依赖独家 M3 联盟。该联盟成立不到两年。如果 M3 退出、被收购或以不利方式重新谈判条款，nesto 将失去整个经纪渠道，且没有可立即替代的网络，从而实质压缩放款量和收入。
