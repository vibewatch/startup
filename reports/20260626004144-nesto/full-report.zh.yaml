            title: 监管栈深度
            body: >-
              与拥有统一 OSFI 监管关系的联邦特许银行不同，nesto 必须同时满足 AMF（Quebec）、FSRA（Ontario）、通过融资对手方传导的 OSFI 承保标准、FINTRAC AML/KYC、FCAC
