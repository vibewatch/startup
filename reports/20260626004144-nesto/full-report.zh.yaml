      - number: '7.3'
        title: 运营、AI 与技术风险
        blocks:
          - type: paragraph
            body: >-
              Maestro AI 与 2026 年 6 月 Series E 同时推出，nesto 将其描述为「AI 原生编排平台，旨在简化端到端抵押贷款运营」。该平台意在为 nesto 自有发起业务和 Nesto
              Cloud B2B 客户，在企业规模上自动化高风险抵押贷款流程决策。AI
              模型风险在抵押贷款中具有实质意义：校准不当的信用或估值模型可能系统性地低估或高估借款人资格，带来逆向选择（接受过多高风险贷款）或声誉损害（拒绝信用良好的申请人）。加拿大尚未发布专门针对抵押贷款承保中 AI
              的公开监管指引；合规标准仍从 OSFI 一般技术风险指引和 FCAC 消费者保护框架外推。


              nesto 2026 年 6 月 Trustpilot 页面显示 4/5「Great」评分，这是正面信号，但掩盖了具体运营失效模式。2026 年 6 月 25 日一条评论称，申请被放弃后三个月内，nesto
              销售团队每天打电话；如果这种做法具有系统性，可能使 nesto 面临 CASL（Canada's Anti-Spam Legislation）违规和 FCAC 投诉。2026 年 6 月 10
              日，一位自雇借款人的评论记录了近 70 封邮件往来、反复文件请求，以及销售和承保之间的协调断裂——这类运营复杂度符合快速扩张期特征。2026 年 3–4
              月一条评论指出续约响应缓慢、员工承压。这些信号从监管角度看尚未构成重大事项，但表明 nesto 的客户服务基础设施可能落后于放款增长。


              CMLS 收购（2024）把一个风险特征不同的商业抵押贷款业务整合进来——贷款期限更长、单笔敞口更大、违约动态也不同——而原平台是为住宅抵押贷款优化的。Intellifi 子公司提供贷款处理服务；如果
              Intellifi 在量激增时产能不足，对自有子公司的运营依赖会形成单点故障风险。nesto 的工程博客（medium.com/nesto-engineering）确认其正在积极开发 AI
              和平台，这支撑了技术野心，也意味着持续变化周期会提高集成和回归风险。


              考虑到 nesto 的数据足迹，数据安全是具体担忧：数十万借款人的信用评分、收入文件、房产估值、政府 ID 和浏览数据。2025 年 12
              月隐私政策确认，公司会与促销和广告伙伴共享数据，使攻击面比传统银行更宽。公开渠道未发现数据泄露通知，但 Quebec Law 25 下 72 小时泄露通知要求意味着，任何事件都会很快公开。
