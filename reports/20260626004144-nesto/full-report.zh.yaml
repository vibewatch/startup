  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与结构
        blocks:
          - type: paragraph
            body: >-
              加拿大住宅按揭市场涵盖所有以自住房和投资住宅地产作抵押的按揭信贷，发起方包括联邦和省级监管金融机构以及非银行贷款机构。截至 2026 年初，未偿住宅按揭信贷总额超过 C$2.1
              trillion，是加拿大最大的单一消费信贷品类。从地域看，大多伦多地区、大温哥华地区、蒙特利尔和卡尔加里合计贡献了多数放款金额；其中最大的两个市场——GTA 和
              GVA——长期受可负担性约束抬高，这种结构性压力持续影响首次购房者行为和经纪渠道采用。

              贷款机构格局可分为四个实用类别。Schedule A 特许银行——以 Big Six（RBC、TD、Scotiabank、BMO、CIBC、National Bank）加 Desjardins
              为首——通过直营网点发起多数按揭；自 2024 年初 BMO 通过 BMO BrokerEdge 重返经纪渠道后，这些银行也越来越多通过经纪渠道放款。Monoline 贷款机构（First
              National、MCAP、RFA、Merix、CMLS）只通过经纪人发起，主要在利率和周转时间上竞争。Alternative 或 B lenders（Equitable Bank、Home
              Trust、Haventree Bank、Community Trust、Radius Financial）服务不符合 prime
              资格标准的借款人，通常收取利率溢价。数字和细分平台（nesto、Pine、Strive、Optimum、ICICI Canada）以利率透明和更顺滑的发起流程竞争，瞄准 77% 会在线研究的消费者。

              三家按揭保险机构为受保贷款兜底——CMHC（皇冠公司）、Sagen（私营）和 Canada Guaranty（私营）——覆盖房价低于 C$1.5 million、首付低于 20% 的按揭。OSFI 的
              Guideline B-20 约束联邦监管贷款机构的承保实践，要求借款人以合同利率加两个百分点或 5.25% 中较高者通过资格测试。OSFI
              还豁免续贷时的直接转贷——摊还期和贷款金额均不增加——免于压力测试，从而降低续贷市场的转换摩擦。
