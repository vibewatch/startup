  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              nesto 所处的是加拿大监管最重的行业之一，却没有联邦特许银行那样的合规基础设施。作为省级持牌抵押贷款经纪人和非银行贷款机构，nesto 必须满足：Quebec 的 Autorité des marchés
              financiers（AMF）；Ontario 的 Financial Services Regulatory Authority（FSRA）；其他各省同类机构；负责反洗钱和了解客户义务的
              FINTRAC；负责消费者保护标准的 Financial Consumer Agency of Canada（FCAC）；加拿大联邦隐私法 PIPEDA 和 Quebec 更严格的 Law 25；以及间接受
              OSFI 指引约束——包括 Guideline B-20 和 Minimum Qualifying Rate（MQR）——因为其银行融资对手方和违约保险机构（CMHC、Sagen、Canada
              Guaranty）把合规作为准入条件。


              OSFI MQR 压力测试当前设定为抵押贷款合同利率加 2% 或 5.25% 中较高者，直接限制 nesto 可通过资格审核的借款人池，并影响放款量。OSFI 至少每年审查一次
              MQR；上调会立即收紧承保并压缩成交量。反过来，OSFI 于 2026 年 6 月 20 日决定把国内稳定缓冲下调 50 个基点至 3%，释放约 C$74B 银行资本，这改善了融资环境，但也显示 OSFI
              认为系统性脆弱性「已相对稳定一段时间」，并非已经解决。


              nesto 的隐私义务正在升级。公司 2025 年 12 月隐私政策确认，其收集信用评分、收入、房产数据、借款历史、设备标识符和浏览数据，并与金融机构、转介伙伴和促销伙伴共享。Quebec 的 Law 25
              明显严于联邦 PIPEDA，适用于 nesto 庞大的 Quebec 客户群。Quebec Law 25 要求隐私影响评估、72 小时内强制数据泄露通知，以及算法透明度——随着 Maestro AI
              平台扩张，nesto 必须持续满足这些义务。Office of the Privacy Commissioner 的 PIPEDA 合规框架设定了联邦底线，而 AI 决策透明度要求仍处在监管演进阶段。


              BCSC 2024 年针对数字金融服务公司的证券法执法活动说明，省级监管机构正在主动审视金融科技贷款模式。公开来源未发现针对 nesto 的执法行动，但监管风险是结构性的：OSFI B-20
              承保指引、省级牌照要求或 FINTRAC 门槛的任何实质变化，都可能要求公司迅速调整政策和系统。消费者投诉处理也受监管；FCAC 的投诉管理框架要求 nesto 维持有文档记录的投诉处理流程，而 2026 年 6
              月 Trustpilot 评论指出了具体客户服务失败。
