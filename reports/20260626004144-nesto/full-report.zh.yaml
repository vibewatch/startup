      - number: '6.4'
        title: 留存、续约重点与客户体验
        blocks:
          - type: paragraph
            body: >-
              nesto 最醒目的客户满意度信号，是 nestogroup.ca 披露的 NPS 超过 70，并称其为「同类最佳客户满意度」。作为参照，加拿大大型银行消费者 NPS 通常为 30–45；70+ 的 NPS
              非常突出，符合挑战者品牌特征。不过，该指标没有日期、未经审计，也没有趋势序列，无法与独立调查交叉验证。站内汇总 1,100+ 条评论得分 4.5/5，也同样反映的是公司筛选后的汇总。


              Trustpilot 数据（2026 年 6 月）给 nesto 评为 4/5「Great」，比「Excellent」低一级，评论池更小但独立。2026 年 6
              月发布的两条负面评论构成重要质量信号：一条称在停止申请后，公司连续三个月每天打冷电话，并明确称其为骚扰；另一条详细描述一位自雇借款人经历了 70+
              封邮件、反复文件请求，以及销售、合规和承保之间明显的协调失败。nesto 在 Trustpilot 上公开回复了第二条投诉，承认压力，同时把重复请求归因于监管文件合规标准——回应克制，但没有解决根本流程问题。


              2026 年续约市场是 nesto 最大的单一获客杠杆。CMHC 的 2026 Mortgage Consumer Survey 证实，全部抵押贷款交易中 66% 是续约，且 35%
              的续约借款人因利率变化经历月供平均增加 C$375。nesto 直接瞄准这一压力：其续约页面突出宣传续约利率比 Big Six 低 15%，并强调「近一半加拿大抵押贷款将在 2027 年前到期续约」。150
              天锁息——主要加拿大贷款机构中最长——是结构性差异点，能降低续约转换摩擦，并远早于窗口期锁定管道。公司未公开 cohort 留存数据（nesto 2020-2021 年 cohort 中有多少借款人与 nesto
              续约，而不是回到银行），这是重要证据缺口。
