        - AI 平台未能产生收入；银行竞争加剧
        - 低至中：取决于尚未验证的 Maestro AI 牵引力
      - - 基准
        - C$400–500M（2027–28E）：在当前估算基数上实现 25–30% CAGR
        - C$1.6–2.5B，对应 3.5–4.5x P/S
        - 放款量停滞；B2B 合作伙伴流失
        - 中：与 Deloitte Fast 50 增长信号一致
      - - 熊市
