      - number: '4.3'
        title: 运营规模、牵引力与盈利声明
        blocks:
          - type: paragraph
            body: >-
              nesto 最常被引用的牵引指标——C$80B+ MUA、2026 年至今 C$37B+ 放款，以及盈利运营——直接来自 2026 年 6 月 10 日 Series E 新闻稿，并得到多家独立新闻机构（MPA
              Magazine、Fintech Futures、Business Insider）佐证。这些数字均未经独立审计，代表公司报告数据。「盈利」与「盈亏平衡」之间的区别也未说明：nesto
              未澄清它指的是净利润、EBITDA、贡献利润，还是仅在运营层面现金流为正。


              C$37B 放款数字由 2026 年上半年年化而来，意味着约 C$74B 的年化 run-rate——如果能维持，相当于 C$2.1 trillion 加拿大未偿按揭市场约 3.5%。这说明 nesto
              已是有意义的玩家，但该数字没有区分已融资按揭、经纪转介，或代表机构客户处理的白标业务量。


              连续三年获得 Deloitte Technology Fast 50 认可，为快速收入增长提供第三方佐证，尽管绝对增速未披露。DBRS Morningstar MOR RS 评级（Stable
              trend，2025 年）为贷款管理质量提供独立运营验证。合在一起，这些信号与一家已盈利、快速增长的非银行贷款机构相一致——但仍达不到让承保判断足够有把握的财务披露标准。


              Trustpilot 客户满意度数据显示总体评分 4/5，但 2026 年 6 月的一星评价暴露运营担忧：放弃申请后仍持续收到未经请求的销售电话；自雇借款人的承保流程混乱（被描述为「近 70
              封邮件」）；续贷响应缓慢且员工据称压力很大。这些信号与无摩擦、AI 驱动运营的主张相反，可能指向 2026 年续贷浪潮中的产能约束。
