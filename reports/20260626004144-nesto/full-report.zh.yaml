  - id: TV002
    title: 投资论点 vs. 反论点
    columns:
      - 视角
      - 论点
      - 哪些因素会改变判断
    rows:
      - - 牛市论点
        - nesto 是已盈利独角兽，拥有 C$80B MUA、AI 平台可选性、La Caisse 机构领投，以及连续三年 Fast 50 增长
        - 若收入低于 C$250M，当前倍数就站不住
      - - 熊市反论点
        - 没有财务披露：隐含倍数无法核验；Trustpilot 有骚扰投诉；按揭具周期性；Blend 2022 年可比案例出现减值
        - 若确认收入达到 C$350M+ 且毛利率 50%+，缺口会被补上
      - - 平台论点
        - Maestro AI 把 TAM 从按揭扩到更广金融服务；B2B Nesto Cloud 可能扩展到美国贷款机构
        - 若 18 个月内 Maestro AI 收入为零，说明 AI 叙事尚未变现
      - - 监管反论点
        - OSFI 和 FCAC 对按揭贷款机构和消费者投诉的监管（Trustpilot：骚扰、数据担忧）带来合规敞口
        - 干净的监管记录和投诉解决进展会降低该风险
    notes: 论点来自公开证据；收入和股权结构假设均为估算，仍需确认。
