    rows:
      - - 建议
        - 跟踪
        - 估值公允，但收入不透明，难以下高确信买入结论
      - - 信心
        - 中
        - 有机构验证，但财务未披露
      - - 风险评级
        - 高
        - 周期性、倍数压缩、运营投诉
      - - 估值立场
        - 公允
        - 估算 P/S 约 4x，与上市可比公司一致
      - - 入场价格敏感性
        - C$1.2B 以下有吸引力；C$2.0B 以上偏贵
        - 基于 C$370M 中点收入的 3–5x P/S 区间
      - - 目标回报 / 持有期
        - 3–5 年 1.5–2.5x（基准）；5 年 2–3x（牛市）
        - IPO 或战略 M&A 退出
      - - 投资论点失效条件
        - 年化放款低于 C$25B，或流失 Nesto Cloud 合作伙伴
        - 传导到收入约下降 25–35%
    notes: 入场价格敏感性和目标回报是示例性估算，依据是可比上市同业 P/S 倍数和 nesto 估算收入区间；实际收入未公开披露。
