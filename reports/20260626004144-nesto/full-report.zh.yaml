  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与消费者流程
        blocks:
          - type: paragraph
            body: >-
              nesto 面向消费者的产品组合覆盖加拿大房主的完整住宅抵押贷款生命周期。购房端，借款人无需到网点，也无需与佣金制经纪人沟通，即可完成全数字申请——从 AI
              驱动的利率发现到有条件批准。所有顾问均为有薪员工，平台透明发布利率，无需讨价还价。

              续约流程在商业上尤其重要。2024 年 11 月，联邦监管机构 OSFI 取消了未保险抵押贷款转贷人的压力测试要求，清除了一个历史障碍；此前该障碍导致 66% 的加拿大人自动与原贷款机构续约。nesto
              的数字续约转移流程正借此变化发力，宣传其保险抵押贷款利率较 Big 6 银行挂牌利率低 15%。平台可将约定续约利率锁定最长 150 天，这是加拿大主要贷款机构公开宣传中最长的锁息期。

              Prime Time Mortgage 是一款自有可变利率产品，允许借款人随时无罚金转为固定利率。2025–26 年推出的 HELOC 产品，以房屋净值作抵押提供循环信贷额度，利率为 Prime+0.50%（截至
              2026 年 6 月为 4.95%），无月费、无提款费，并支持只付利息选项。Financial Advisor 渠道把 D2C
              平台延伸给第三方顾问，使其能够将客户转介至白标数字申请流程，并提供文件上传和状态追踪。nesto 已服务 450,000+ 名加拿大人，并在全国配备 310+ 名有薪抵押贷款专家。
