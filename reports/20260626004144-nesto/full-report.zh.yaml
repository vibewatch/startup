      - number: '4.4'
        title: 单位经济、利润率结构与成本估算
        blocks:
          - type: paragraph
            body: >-
              nesto 尚未披露收入、毛利率、EBITDA 或员工人数。因此，单位经济模型只能靠公开市场基准和运营代理指标拼出来。DTC 贷款业务方面，加拿大非银行抵押贷款机构通常在信用损失前取得 1.5–2.5% 的总
              NIM，具体取决于产品组合、资金成本（仓储额度相对 CORRA 或 CDOR 的利差），以及已保险和未保险贷款占比。在年化放款 C$37B、估计平均余额期限 3 年的情况下，任一时点的估计平均贷款账面约为
              C$111B，略高于 MUA 数字，说明其中混合了留存贷款和出售 / 证券化贷款。


              加拿大经纪佣金通常为每笔放款抵押贷款的 100–110 个基点，这与 Dominion Lending Centres 和 Mortgage Alliance 这两家加拿大主要经纪网络的数据一致。对 nesto
              而言，M3 渠道既产生获客成本（支付给经纪人的介绍费），也产生放款手续费收入——净贡献取决于 nesto 是留存还是出售这些抵押贷款。


              如果没有披露营销支出，DTC 数字抵押贷款机构的客户获取成本（CAC）很难估算。可比的加拿大数字贷款机构（Pine、True North Mortgage）没有公开披露
              CAC。作为参照，美国数字抵押贷款市场中，DTC CAC 通常为每笔放款 C$1,000–C$4,000。考虑到 nesto 入选 Deloitte Fast
              50（暗示增长强劲），且采用有薪顾问模式（无佣金销售），其 CAC 可能低于经纪渠道模式，但高于纯自动化平台。


              C$80B MUA 组合的服务成本需要运营人员（Intellifi 子公司提供贷款处理服务）和技术投入。按行业标准约 5–8 bps 的 MUA 服务成本计算，年度服务运营支出约为 C$40–64M。与估计
              C$80–120M 的服务收入相比，服务业务在技术和总部费用分摊前的毛利率约为 25–50%，与加拿大上市抵押贷款服务商并不显著不同。
