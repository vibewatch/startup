      - number: '8.5'
        title: 退出准备与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              以 nesto 当前规模，最可信的退出路径是战略收购，而不是近期上市。希望获得抵押贷款技术能力的加拿大和美国银行—— 或希望进入加拿大市场的美国金融机构——会为 nesto 一体化的发放、服务、技术栈及 C$80
              billion MUA 基础支付战略溢价。 La Caisse 和 National Bank 的创投部门（NAventures）很可能支持一场能打造加拿大贷款技术冠军的战略交易。

              如果公司能做到 C$400–500 million 收入、EBITDA 明确为正，并能披露经审计财务而不伤害与机构贷款客户的谈判， 三到五年内在 Toronto Stock Exchange（TSX）IPO，或
              TSX/NYSE 双重上市，是可能的。加拿大公开市场对一家盈利 抵押贷款技术发行人的接受度，将与 EQB 的 25x P/E 和 3.6x P/S 基准对照检验；但如果 nesto 的增长率差距能够持续，
              理应获得溢价。

              IPO 准备的主要阻碍包括：（1）没有公开财务披露，意味着 S-1 或初步招股书会成为 nesto 第一次财务透明事件；
              如果利润率低于投资者预期，就会带来头条风险；（2）多轮机构融资带来的优先权悬挂和股权结构复杂度，需要被简化； （3）需要向机构投资者证明 Maestro AI 货币化和 Nesto Cloud
              合同续约率；（4）治理准备度——独立董事会构成、 审计质量财务和高管继任规划。上述问题解决前，以高于 C$1.47 billion 的溢价进行二级出售或战略收购，仍是最可能的 流动性路径。
