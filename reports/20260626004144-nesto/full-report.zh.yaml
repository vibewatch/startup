      - number: '3.6'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              nesto 最耐久的竞争护城河包括：（a）整合 DTC 加 B2B 云的架构，加拿大没有其他按揭贷款机构在规模上复制；（b）C$80B+ 管理中按揭，可在数据和机构信任上产生网络效应；（c）70+ NPS
              评分，显示客户体验优势并推动转介绍经济；（d）CMLS 收购带来 50 年机构经验和商业导向贷款品牌，加深对非银行创业公司的护城河。150 天利率锁定是产品层面的护城河，一旦利率锁定，会实质降低借款人切换动机。

              消费者利率比价的商品化风险最高：随着 WOWA、Ratehub 和数字经纪人都聚合并发布当前利率，nesto 曾经开创的利率透明如今已成基本门槛。nesto 的回应——从利率领先转向平台领先（Nesto
              Cloud、Maestro AI、CMLS commercial）——方向正确，但取决于执行。M3 渠道合作是一种倒逼机制：经纪人提交的量现在流经 nesto 承保，如果 M3 将贷款机构偏好转回银行（BMO
              BrokerEdge 之后）或转向竞争性数字 monoline，nesto 将面临依赖风险。

              结构性替代风险来自 Big Six 银行部署自有 AI 驱动发起技术栈——RBC、TD 和 BMO 各自拥有数十亿美元技术预算——但既有巨头在历史上很少快速自我颠覆按揭流程。未来 12–24
              个月的收敛复盘将检验，在银行补上技术差距之前，Maestro AI 是否能交付可衡量的单位经济改善。
