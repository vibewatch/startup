        - 低
        - 中
        - 已记录投诉升级流程；OBSI 作为后备机制
        - 2026 年 6 月 Trustpilot 评价显示客服短板，可能引发 FCAC 投诉
        - 要求披露正式 FCAC 投诉数量和解决率，并与非正式 Trustpilot 评价对照；审查投诉处理 SLA
      - - PIPEDA 和 Quebec Law 25（数据隐私）
        - 联邦 + 魁北克
        - PIPEDA 已生效；Law 25 第三阶段 2023 年 9 月全面生效；适用 72 小时泄露通知
        - 中（Law 25 在 2024–2025 年执法加强）
        - 高
        - 2025 年 12 月更新隐私政策；推测已有泄露响应计划
