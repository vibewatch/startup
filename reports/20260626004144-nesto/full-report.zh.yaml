      - number: '2.2'
        title: 市场规模与放款格局
        blocks:
          - type: paragraph
            body: >-
              要精确测算加拿大按揭发起市场，受限于 CMHC Residential Mortgage Industry Data Dashboard 由 JS
              渲染；该仪表盘是年度放款金额的权威来源，但无法静态访问。基于公开可得代理指标，未偿住宅按揭信贷总额超过 C$2.1 trillion。仅 2026 年续贷群体就代表估计 C$460 billion
              按揭余额，计算来自约 1.15 million 笔续贷按揭乘以约 C$400,000 的代理平均未偿余额。2027 年群体再增加估计 C$376 billion（940,000 笔续贷）。2026–2027
              年续贷浪潮合计约 C$836 billion 余额会寻找有竞争力的利率——这是加拿大按揭市场史上最集中的放款机会窗口之一。

              经纪渠道在 2026 年发起了约 40% 的加拿大新按揭，高于 2020 年前后约 30%；驱动因素包括 BMO 重返经纪渠道、在线比价工具的结构性采用，以及 Bank of Canada
              利率周期后续贷借款人对利率更敏感。将 40% 经纪份额套用到估算年度放款流量，经纪渠道 SAM 约为每年 C$140–200 billion，属推导口径。nesto
              是主要参与者之一的数字和细分贷款板块，占经纪渠道放款的份额仍低于 5%，但随数字化发起交易占比提升而快速增长。截至 2026 年 6 月 25 日，nesto 公布受保五年固定利率 4.09%、受保五年浮动利率
              3.40%，位于市场低利率端。
