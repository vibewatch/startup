callouts:
  - calloutType: recommendation
    title: Track — Fair Valuation at Estimated Multiple, Revenue Disclosure Needed to Buy
    body: >-
      nesto's C$1.47 billion Series E valuation is anchored by genuine operational
      scale and institutional investor validation, but cannot be confirmed against
      actual revenue without a financial disclosure. At the estimated C$370 million
      revenue midpoint, the implied ~4x P/S is consistent with public fintech mortgage
      peers. This is a fair price — not a screaming bargain — for a company that
      remains opaque on its core financial metrics. Track until management accounts or
      an S-1 provide the missing evidence. Move to buy if revenue confirms above C$300M
      with gross margin above 45% and Nesto Cloud contract values above C$50M ARR.
    claimRefs:
      - CV007
      - CV010
      - CV028
      - CV045

  - calloutType: risk
    title: Revenue Opacity Is the Central Risk — Not Business Quality
    body: >-
      The principal risk in nesto's current valuation is not company quality, which
      is strong, but the absence of any public financial disclosure that would allow
      verification of the revenue multiple. Blend Labs' 2022 experience demonstrates
      that private fintech mortgage valuations can collapse rapidly in a rate cycle
      downturn. With no revenue reference, a potential investor must price on trust in
      the institutional syndicate rather than on verified fundamentals.
    claimRefs:
      - CV010
      - CV041
      - CV043

  - calloutType: strength
    title: La Caisse Lead Is a Credible Institutional Anchor
    body: >-
      La Caisse is one of the world's most credible institutional investors in the
      Canadian context, managing over C$452 billion in assets and taking long-term
      equity positions in Quebec-based companies. Its decision to lead the Series E
      rather than merely participate signals a conviction level that goes beyond
      financial-only analysis. Fidelity Investments Canada and PICTON Investments
      further diversify the investor base beyond Quebec-mandated capital.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV030

