  - id: final-recommendation-and-diligence
    title: Final Recommendation and Diligence Asks
    body: >-
      Recommendation: Track. nesto is a high-quality company in a defensible market
      position, and C$1.47 billion is a fair valuation relative to public fintech
      mortgage peers at estimated revenue multiples. However, the complete absence of
      disclosed revenue, margin, and cap-table data prevents a conviction buy call at
      this stage. An investor entering at this round must underwrite the profitability
      claim, the origination-volume trajectory, and the Nesto Cloud contract book
      entirely on trust in the institutional investor syndicate. That is an above-average
      risk position for the multiple implied.

      The key diligence items that would move this recommendation from track to buy are:
      confirmed revenue in the C$300–450 million range with 50% or better gross margin,
      Nesto Cloud contract values and renewal rates demonstrating sticky B2B economics,
      Maestro AI revenue contribution or signed LOIs, and cap-table clarity on preference
      waterfall and founder dilution at current valuation. A down-round trigger should be
      set at any indication of origination volume below C$25 billion annualized, sustained
      BoC rate increases above 3%, or partner departure from Nesto Cloud.

      The confidence level is medium because institutional validation from La Caisse,
      Fidelity, and existing investors provides meaningful signal, but revenue opacity
      is unusual for a company of this scale approaching potential IPO. Risk rating is
      high due to mortgage market cyclicality, private-company multiple compression risk,
      and operational complaint signals from Trustpilot. Valuation stance is fair: at
      estimated multiples, the price is consistent with peers but not obviously cheap.
      Any material downward revision to origination assumptions would push the valuation
      into stretched territory.
