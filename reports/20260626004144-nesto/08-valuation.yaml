  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: nesto revenue
      missingEvidence: >-
        nesto does not publicly disclose revenue, gross margin, customer acquisition
        cost, loan-to-value mix, or unit economics by product line. Without audited or
        management-level financial data, the implied P/S multiple cannot be verified.
      whyItMatters: >-
        The central gate-check for any late-stage growth investment is whether the
        valuation is a reasonable multiple of current revenue. Without this, the
        analysis rests on estimated revenue, which introduces ±50% uncertainty.
      diligencePath: >-
        Request a data-room access from lead investor (La Caisse) or management;
        seek audited management accounts for FY2025 and H1 FY2026.
      relatedQuestionRefs:
        - QV002
        - QV026
      relatedTableRefs:
        - TV001
        - TV004

    - type: private-evidence-only
      severity: blocking
      topic: cap table
      missingEvidence: >-
        The share count, preference waterfall, founder dilution, anti-dilution provisions,
        and liquidation preferences from the Series E are not publicly disclosed.
      whyItMatters: >-
        The secondary component of the Series E means some existing shareholders achieved
        liquidity; without the waterfall, return math at exit is speculative.
      diligencePath: >-
        Obtain cap-table summary from La Caisse or lead counsel; request standard
        VC-style term sheet disclosure as part of any co-investment due diligence.
      relatedQuestionRefs:
        - QV019
        - QV020

    - type: missing-source
      severity: material
      topic: nesto revenue
      missingEvidence: >-
        No independent analyst coverage or proprietary database (PitchBook, CB Insights)
        has published a revenue estimate for nesto that is independent of company-provided
        data points; all revenue estimates are derived from origination-economics proxies.
      whyItMatters: >-
        Independent revenue estimates would allow triangulation across multiple
        methodologies and improve multiple-range confidence.
      diligencePath: >-
        Seek PitchBook, Sacra, or Contrary Research coverage of nesto; request
        management's investor presentation for a comparable market data update.
      relatedQuestionRefs:
        - QV025
        - QV010
      relatedTableRefs:
        - TV004

    - type: missing-source
      severity: material
      topic: Maestro AI revenue
      missingEvidence: >-
        Maestro AI was launched concurrent with the Series E; no revenue, customer
        count, or contract data is publicly available for the platform.
      whyItMatters: >-
        The bull case rests on AI platform monetization. Without any early commercial
        signal, the bull-case probability is lower and the base/bear cases carry
