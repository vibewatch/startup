  - id: exit-readiness-and-ipo-path
    title: Exit Readiness and IPO Path
    body: >-
      nesto's most credible exit path at current scale is a strategic acquisition rather
      than a near-term public offering. Canadian and US banks seeking mortgage technology
      capabilities — or a US financial institution wanting Canadian market entry — would
      pay a strategic premium for nesto's integrated origination-servicing-technology
      stack with its C$80 billion MUA base. La Caisse and National Bank's venture arm
      (NAventures) are both likely to support a strategic process that creates a Canadian
      champion in lending technology.

      An IPO on the Toronto Stock Exchange (TSX) or dual-listed TSX/NYSE is possible
      within a three-to-five-year horizon if the company can achieve C$400–500 million
      in revenue with clearly positive EBITDA and can disclose audited financials without
      adversely impacting negotiations with institutional lender-clients. The Canadian
      public market's appetite for a profitable mortgage technology issuer would be tested
      against EQB's 25x P/E and 3.6x P/S benchmarks, but nesto's growth rate
      differential should command a premium if sustained.

      Key blockers to IPO readiness include: (1) no public financial disclosures,
      meaning an S-1 or preliminary prospectus would be nesto's first financial
      transparency event, creating headline risk if margins are below investor
      expectations; (2) preference overhang and cap-table complexity from multiple
      institutional rounds that would need to be simplified; (3) the need to demonstrate
      Maestro AI monetization and Nesto Cloud contract renewal rates to institutional
      investors; and (4) governance readiness — independent board composition,
      audit-quality financials, and executive succession planning. Until these are
      resolved, a secondary sale or strategic acquisition at a premium to C$1.47 billion
      remains the most probable liquidity path.
