callouts:
  - calloutType: strength
    title: Structural Renewal Wave Creates Durable Platform Opportunity
    body: >-
      With 1.15 million mortgages renewing in 2026 and 940,000 in 2027, the Canadian market
      offers an unusually durable and time-bounded demand surge for comparison platforms. Each
      renewing borrower faces a mandatory market re-entry event—the strongest possible
      acquisition trigger for digital mortgage brokers. The average payment increase of
      C$375 per month further amplifies rate-sensitivity and comparison behaviour.
    claimRefs:
      - CM005
      - CM028
      - CM029

  - calloutType: risk
    title: Macro Headwinds and BoC Caution Limit Credit-Expansion Optimism
    body: >-
      Despite positive signals from BoC rate cuts and the OSFI capital buffer reduction,
      Bank of Canada Governor Macklem explicitly stated in June 2026 that lower capital
      requirements alone will not spark broad lending growth. With GDP contracting in Q1 2026,
      unemployment at 6.6 percent, and US tariff uncertainty ongoing, macro conditions may
      suppress purchase-market volumes even as the renewal wave drives switching activity.
    claimRefs:
      - CM038
      - CM039
      - CM040
      - CM043

