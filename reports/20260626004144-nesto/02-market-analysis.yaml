chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The Canadian residential mortgage market carries an estimated C$2.1 trillion in outstanding
    balances, with approximately 1.15 million mortgages scheduled for renewal in 2026 alone.
    The broker channel has expanded to roughly 40 percent of new originations, driven by a
    post-pandemic comparison-shopping shift, and 77 percent of 2026 mortgage consumers
    researched online—one in three completed their transaction entirely remotely. The Bank of
    Canada held its overnight rate at 2.25 percent in June 2026 following a sustained cutting
    cycle, while OSFI reduced the Domestic Stability Buffer to 3 percent effective June 19 2026;
    however, the Governor explicitly cautioned that capital easing alone will not spark broad
    lending growth.

sections:
  - id: market-boundary-and-structure
    title: Market Boundary and Structure
    body: >-
      The Canadian residential mortgage market encompasses all mortgage credit secured by
      owner-occupied and investment residential real estate, originated by federally and
      provincially regulated financial institutions and by non-bank lenders. Total outstanding
      residential mortgage credit exceeded C$2.1 trillion as of early 2026, making it the
      single largest consumer-credit product class in Canada. Geographically, the Greater
      Toronto Area, Greater Vancouver, Montreal, and Calgary together account for the majority
      of origination dollar volume, with the two largest markets—GTA and GVA—structurally
      elevated by long-run affordability constraints that continue to shape first-time buyer
      behaviour and broker channel adoption.

      The lender landscape divides into four practical categories. Schedule A chartered
      banks—led by the Big Six (RBC, TD, Scotiabank, BMO, CIBC, National Bank) plus
      Desjardins—originate the majority of mortgages through direct branches and, since early
      2024, increasingly through the broker channel following BMO's re-entry via BMO BrokerEdge.
      Monoline lenders (First National, MCAP, RFA, Merix, CMLS) originate exclusively through
      brokers and compete primarily on rate and turnaround time. Alternative or B lenders
      (Equitable Bank, Home Trust, Haventree Bank, Community Trust, Radius Financial) serve
      borrowers outside prime qualification criteria, typically charging a rate premium. Digital
      and niche platforms (nesto, Pine, Strive, Optimum, ICICI Canada) compete on rate
      transparency and streamlined origination, targeting the 77 percent of consumers who
      research online.

      Three mortgage insurers backstop insured lending—CMHC (crown corporation), Sagen
      (private), and Canada Guaranty (private)—covering mortgages with down payments below
      20 percent on properties priced under C$1.5 million. OSFI's Guideline B-20 governs
      underwriting practices for federally regulated lenders, requiring borrowers to qualify at
      the greater of their contract rate plus two percentage points or 5.25 percent. OSFI also
      exempts straight switches at renewal—where neither amortization nor the loan amount
      increases—from the stress test, reducing switching friction in the renewal market.
