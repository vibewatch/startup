  - id: TM004
    title: Growth Drivers and Adoption Constraints (Canadian Mortgage Market, 2026)
    columns:
      - Factor
      - Direction
      - Mechanism and Timing
      - Diligence Ask
    rows:
      - - Renewal wave (1.15M mortgages in 2026)
        - Tailwind
        - Creates mandatory comparison event; immediate (2026); motivates broker / digital platform engagement
        - Confirm renewal volume from CMHC dashboard once accessible
      - - Renewal continuation (940K mortgages in 2027)
        - Tailwind
        - Extends renewal-driven origination volume into 2027; near-term
        - Track CMHC quarterly renewal-cohort data
      - - BoC rate cuts (overnight rate 2.25% June 2026)
        - Tailwind
        - Reduces payment shock for renewers; may re-stimulate purchase demand; current
        - Monitor BoC rate path; any rate increase reverses this tailwind quickly
      - - OSFI DSB reduction to 3% (June 19 2026)
        - Tailwind
        - Releases ~C$74B capital; potential C$673B RWA expansion; near-term lender competition increase
        - Track Big Six balance-sheet growth and broker-panel expansion post-DSB cut
      - - BMO broker-channel re-entry (BrokerEdge, 2024)
        - Tailwind
        - Adds major bank to broker panels; increases product choice and broker-channel credibility
        - Assess BMO BrokerEdge deal volume and lender-panel competitiveness
      - - Digital research adoption (77% online; 33% remote transaction)
        - Tailwind
        - Structural shift toward digital origination; current and ongoing
        - Track CMHC MCS digital-adoption metrics annually
      - - OSFI B-20 stress test (contract rate + 2% or 5.25%)
        - Headwind
        - Reduces purchase-market qualification pool; structural; ongoing
        - Monitor OSFI policy signals for any MQR recalibration
      - - Affordability constraints (GTA / GVA)
        - Headwind
        - Suppresses first-time buyer volumes below pre-pandemic norms; structural
        - Track CREA home price index relative to household income growth
      - - Macroeconomic uncertainty (GDP -0.1% Q1 2026; unemployment 6.6%)
        - Headwind
        - Household income uncertainty dampens purchase activity; current–near-term
        - Monitor BoC GDP and employment forecasts
      - - US tariff and trade uncertainty
        - Headwind
        - Elevates economic downside risk; delays household formation and business investment
        - Track USMCA / tariff developments through H2 2026
      - - BoC caution on capital-rule credit impact
        - Headwind
        - Governor Macklem stated capital easing alone will not spark lending; current
        - Track Big Six loan-growth metrics vs. DSB reduction expectations
    notes: >-
      Driver/constraint classification is qualitative based on publicly available macro data
      and regulatory documents. The BoC capital-rule caution is sourced from an adverse
      source (CMT article, SM015) reporting BoC Governor remarks. Timing categories
      (immediate/near-term/structural/current) are assessments based on the evidence reviewed.
