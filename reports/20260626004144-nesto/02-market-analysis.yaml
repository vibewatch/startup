  - id: market-sizing-and-origination
    title: Market Sizing and Origination Landscape
    body: >-
      Sizing the Canadian mortgage origination market precisely is constrained by the
      JS-rendered nature of CMHC's Residential Mortgage Industry Data Dashboard, which is
      the authoritative annual origination dollar-volume source but is not statically
      accessible. Based on publicly available proxies, total outstanding residential mortgage
      credit exceeds C$2.1 trillion. The 2026 renewal cohort alone represents an estimated
      C$460 billion in mortgage balance, derived from approximately 1.15 million renewing
      mortgages multiplied by a proxy average outstanding balance of roughly C$400,000. The
      2027 cohort adds a further estimated C$376 billion (940,000 renewals). The combined
      2026–2027 renewal wave totals approximately C$836 billion in balance seeking competitive
      rates—one of the most concentrated origination-opportunity periods in Canadian mortgage
      market history.

      The broker channel originated approximately 40 percent of new Canadian mortgages in
      2026, up from roughly 30 percent around 2020, driven by BMO's broker-channel re-entry,
      the structural adoption of online comparison tools, and renewing borrowers' heightened
      rate sensitivity after the Bank of Canada's rate cycle. At 40 percent broker share
      applied to an estimated annual origination flow, the broker-channel SAM is
      approximately C$140–200 billion annually on a derived basis. The digital and niche
      lending segment—of which nesto is a principal participant—remains a sub-5 percent share
      of broker-channel originations but is growing rapidly in proportion to digitally-initiated
      transactions. nesto published an insured five-year fixed rate of 4.09 percent and an
      insured five-year variable rate of 3.40 percent as of June 25 2026, positioning at the
      low-rate end of the market.
