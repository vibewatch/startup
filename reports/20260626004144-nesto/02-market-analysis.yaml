  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: origination-volume
      missingEvidence: >-
        Annual Canadian mortgage origination dollar volume by lender type, channel, and
        insured/uninsured split from the CMHC Residential Mortgage Industry Data Dashboard
        (SM003). The dashboard is JS-rendered and returned only navigation content on static fetch.
      whyItMatters: >-
        Without the authoritative origination volume figure, the broker-channel SAM and
        digital-platform SOM cannot be precisely quantified. All sizing figures in TM002 and
        FM001 are derived proxies with low to medium confidence. This gap limits the precision
        of the addressable market assessment for nesto's broker-channel strategy.
      diligencePath: >-
        Access the CMHC Residential Mortgage Industry Data Dashboard through a browser session
        or request the latest Residential Mortgage Industry Report PDF directly from CMHC. The
        quarterly report typically includes total originations by lender category and channel.
      relatedQuestionRefs:
        - QM001
        - QM002

    - type: access-blocked
      severity: minor
      topic: insured-uninsured-split
      missingEvidence: >-
        Precise insured versus uninsured share of annual Canadian mortgage originations.
        This data is available in the CMHC dashboard but not in any statically accessible source.
      whyItMatters: >-
        The insured/uninsured split affects the assessment of OSFI stress test impact on
        addressable origination volume and the relevance of CMHC's mortgage insurance provider
        position. Without this data, the market-boundary analysis in TM001 uses estimates.
      diligencePath: >-
        Access CMHC quarterly residential mortgage data tables or request the CMHC Residential
        Mortgage Industry Report PDF for the most recent quarter.
      relatedQuestionRefs:
        - QM005

    - type: missing-source
      severity: minor
      topic: broker-channel
      missingEvidence: >-
        Independent corroboration of the ~40% broker channel share estimate. The sole source
        for this figure is TNGOC (2026), an analyst-market-data source. CMHC dashboard data
        (the authoritative corroboration) is inaccessible, and no second independent source
        was found in accessible static form.
      whyItMatters: >-
        Broker channel share is a foundational input to the SAM calculation for nesto. If
        the true share differs materially from 40%, the addressable market and competitive
        intensity estimates change proportionally.
      diligencePath: >-
        Seek corroboration from the CMHC Residential Mortgage Industry Report, Mortgage
        Professionals Canada annual report, or from a Scotiabank or BMO Economics research
        note on mortgage origination channel dynamics.
      relatedQuestionRefs:
        - QM004

    - type: missing-source
      severity: minor
      topic: regional-data
      missingEvidence: >-
        Precise city-level market share figures for GTA, GVA, Montreal, and Calgary as a
        share of total Canadian mortgage origination dollar volume. CREA data covers home
        sales but the static page did not provide mortgage-origination dollar-volume splits.
      whyItMatters: >-
        Regional concentration affects nesto's expansion prioritisation and competitive
        density analysis. Without precise regional data, geographic concentration is described
        qualitatively only.
      diligencePath: >-
        Access CREA's regional statistics pages for unit sales by market, or request CMHC
        Housing Market Outlook reports for the GTA and GVA markets to proxy dollar volumes.
      relatedQuestionRefs:
        - QM026
