  - id: growth-drivers-and-adoption-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      The dominant growth catalyst in 2026–2027 is the renewal wave. Approximately 1.15 million
      mortgages—many originated at ultra-low rates during the 2020–2021 purchase surge—are
      renewing in 2026, followed by 940,000 in 2027. Renewing borrowers face materially higher
      payments: the CMHC 2026 MCS found that 35 percent experienced financial pressure at
      renewal and the average monthly payment increase was C$375. This payment shock motivates
      comparison shopping and broker engagement. Consumer concern about defaulting fell from
      53 percent in 2025 to 39 percent in 2026, consistent with Bank of Canada rate cuts
      reducing payment severity—but the structural incentive to compare rates remains strong.

      The Bank of Canada held the overnight rate at 2.25 percent in June 2026 after cutting from
      a 5.0 percent peak. GDP contracted at 0.1 percent annualized in Q1 2026, inflation ran at
      2.8 percent in April 2026 (energy-driven), and unemployment was 6.6 percent in May 2026.
      The BoC cited Middle East conflict and US tariff uncertainty as key risks, holding rates
      while signalling resumption of modest growth in Q2 2026. The OSFI Domestic Stability
      Buffer reduction to 3 percent effective June 19 2026 releases approximately C$74 billion
      in deployable capital for the Big Six, with potential risk-weighted asset expansion of up
      to C$673 billion. This could intensify lender competition for mortgage originations,
      benefiting broker-channel platforms as more lenders seek share via broker distribution.

      Constraining factors are material. The OSFI stress test continues to reduce the pool of
      qualifying buyers in the purchase market. Affordability remains structurally stretched in
      Toronto and Vancouver. The Bank of Canada Governor explicitly cautioned in June 2026 that
      lower capital requirements alone will not spark a broad increase in lending—loan growth at
      the Big Six has been low or flat in recent quarters—directly challenging the most bullish
      interpretation of the DSB reduction. US tariff uncertainty and ongoing Middle East conflict
      add macroeconomic downside risk. The weight of these constraints means the 2026 growth
      story is renewal-driven and comparison-platform-driven rather than new-purchase driven.
    tableRefs:
      - TM004
    figureRefs:
      - FM004
