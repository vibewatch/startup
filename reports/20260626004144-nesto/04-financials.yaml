  - id: capital-structure-and-adequacy
    title: Capital Structure, Funding History, and Adequacy
    body: >-
      nesto's disclosed capital history totals at least C$458 million: a C$76 million Series B in
      2021 (PCM Encore led), a C$80 million Series C in December 2022 (IGM Financial led), an
      undisclosed Series D in mid-2024 (concurrent with the CMLS Group acquisition), and the
      June 2026 Series E of C$302 million at C$1.47 billion. The Series E comprises both primary
      capital (new equity going to the company's balance sheet) and secondary capital (liquidity
      for existing shareholders). The exact primary/secondary split has not been disclosed, which
      is material: a heavily secondary round would imply less new operating capital than the
      headline figure suggests.


      La Caisse (formerly CDPQ), Québec's principal institutional investor with over C$450 billion
      in net assets, led the new investor tranche. This marks a significant institutional
      endorsement and likely brings board representation, though governance mechanics are not
      publicly disclosed. Fidelity Investments Canada ULC, PICTON Investments, and Endeavor
      Catalyst joined as new investors; existing investors Portage, Diagram, NAventures
      (National Bank's venture arm), Fonds de solidarité FTQ, and Fondaction renewed participation.


      Balance-sheet mortgage lending is capital-intensive. nesto's stated C$37 billion in 2026
      originations implies substantial warehouse line or securitization capacity: a Canadian
      non-bank lender typically needs 10–20% equity capital coverage on balance-sheet loans
      plus access to NHA Mortgage-Backed Securities (MBS) or Canada Mortgage Bonds (CMB)
      through CMHC's securitization programs. nesto's NHA Approved Lender status, visible in the
      CMHC registry, confirms it can participate in the NHA securitization framework, reducing
      balance-sheet capital intensity versus held-to-maturity funding. The actual warehouse
      line size and cost of funds are not publicly disclosed. Based on the capital raise history
      and scale of operations, the company appears adequately funded through at least 2027,
      though the CMLS acquisition cost and total debt obligations remain unknown.
