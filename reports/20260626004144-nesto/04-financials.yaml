callouts:
  - calloutType: risk
    title: Primary/Secondary Split in Series E Is Undisclosed — Operating Capital May Be Less Than C$302M
    body: >-
      The Series E combines primary capital (new equity to the balance sheet) and secondary
      capital (liquidity for existing shareholders). The split has not been disclosed. If a
      significant portion is secondary, the actual increase in operating capital is materially
      less than the headline C$302M. Investors should request the exact primary allocation before
      relying on the full round figure as an adequacy signal.
    claimRefs:
      - CI013
      - CI015

  - calloutType: risk
    title: Balance-Sheet Lending at C$80B+ MUA Creates Material Funding-Market Exposure
    body: >-
      At C$37B in annual originations, nesto requires substantial warehouse financing and
      ongoing access to NHA MBS / Canada Mortgage Bonds securitization. Any disruption to
      Canadian credit markets — as seen during the March 2020 COVID shock or the 2022 rate-hike
      cycle — could temporarily constrain nesto's ability to originate and fund, directly
      impacting top-line volume. The company has not disclosed its warehouse facility terms
      or any contingency liquidity plans.
    claimRefs:
      - CI016
      - CI017
      - CI039

  - calloutType: insight
    title: Estimated Servicing Revenue of C$80–120M Provides Recurring Floor Regardless of Origination Pace
    body: >-
      The C$80B+ MUA generates an estimated C$80–120M in annual servicing revenue at industry
      standard rates, largely independent of origination velocity. This recurring base creates
      a financial floor and supports the profitability claim even in a softer origination year.
      However, CMLS's commercial servicing portfolio is not separately quantified and may add
      materially to this figure.
    claimRefs:
      - CI031
      - CI032
      - CI033

  - calloutType: risk
    title: Trustpilot Adverse Reviews Suggest Operational Strain During Scale-Up
    body: >-
      Multiple June 2026 1-star Trustpilot reviews describe persistent unsolicited sales calls
      after application abandonment, disorganized underwriting for self-employed applicants
      (reported as nearly 70 emails for a single file), and slow renewal response times with
      apparently stressed staff. These are consistent with a company scaling human-intensive
      operations faster than process quality can keep pace. This is material for a company
      marketing an AI-powered, frictionless mortgage experience.
    claimRefs:
      - CI025
      - CI026
      - CI027

