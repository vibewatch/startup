  - id: TI005
    title: Public Financial Gaps Register
    columns:
      - Missing Metric
      - Why It Matters
      - Impact on Judgment
      - Diligence Path
    rows:
      - - Revenue (absolute and by stream)
        - Cannot size total addressable economics or revenue quality
        - Prevents P/S multiple calculation; valuation blind
        - Request audited income statement by business segment
      - - Gross Margin by Stream
        - Lending spread vs. SaaS vs. servicing have fundamentally different margin profiles
        - Cannot assess business quality or trajectory
        - Request segment P&L; distinguish SaaS from lending margins
      - - Series D Amount and CMLS Acquisition Price
        - Unknown dilution and leverage; affects true cost of CMLS capabilities
        - Incomplete capitalization picture; prior investor economics unknown
        - Request full capitalization table and CMLS deal terms from management
      - - Warehouse Facilities / Cost of Funds
        - Critical to NIM calculation; funding risk exposure at scale
        - Cannot model stress scenario for credit market dislocation
        - "Request facility terms: lender, size, pricing, covenants, maturity"
      - - CMLS Commercial Financial Profile
        - CMLS contributes substantial MUA and commercial expertise but no segment disclosure
        - Cannot assess CMLS contribution to total revenue or margin profile
        - Request CMLS standalone P&L or segment breakout for the 12 months post-acquisition
    notes: >-
      All items verified as undisclosed in public sources as of June 26, 2026. These gaps are
      normal for a private company but each represents a material underwriting assumption that
      must be resolved before institutional capital commitment. A full financial data room would
      be required for any diligence engagement.
    claimRefs:
