      - - Broker Channel Origination (M3 Partnership)
        - Fund mortgages sourced via M3's 8,500+ broker network; pay finder fee; retain spread
        - ~100–110 bps finder fee paid to broker; company retains lending spread
        - Exclusive broker channel partnership active since 2024
        - Volume driver; margin depends on channel economics
        - Disclose funded volume through M3 and net contribution margin
      - - Loan Servicing (Intellifi)
        - Administer and service funded mortgage book
        - "~10–15 bps of MUA per year (industry standard)"
        - "Estimated C$80–120M annual gross servicing revenue on C$80B MUA"
        - Stable recurring; scales with MUA
        - Disclose actual servicing fee rate and cost per loan
      - - CMLS Commercial Mortgage Origination
        - Originate and arrange commercial mortgages; earn origination/arrangement fees
        - Origination fees typically 50–150 bps for commercial product
        - Expanded Quebec commercial origination in 2025 with 10-person team
        - Undisclosed volume and revenue contribution
        - Disclose CMLS revenue by segment and origination volume
      - - HELOC (nesto brand)
