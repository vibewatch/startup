runDate: "2026-06-26"
company:
  name: nesto
chapter:
  number: 4
  title: Financials
  summary: >-
    nesto's June 2026 Series E — C$302 million at a C$1.47 billion valuation — confirms unicorn
    status and reflects investor confidence in a multi-stream revenue model spanning DTC lending
    spreads, B2B SaaS licensing, loan servicing on C$80B+ MUA, and CMLS commercial origination.
    The company states profitability, but revenue, margins, and headcount remain entirely private,
    leaving the financial verdict dependent on scale proxies and industry benchmarks. Capital
    intensity is a real concern: balance-sheet lending in a C$2.1 trillion mortgage market demands
    substantial warehouse financing, and the undisclosed Series D and CMLS acquisition price are
    material gaps in the capital-adequacy picture.

sections:
  - id: revenue-model
    title: Revenue Model and Streams
    body: >-
      nesto operates a hybrid revenue model that combines four interlocking streams, each with
      different margin profiles and capital requirements. The largest by gross volume is direct
      balance-sheet lending: nesto originates and funds mortgages on its own books, earning a
      net interest margin (NIM) on the spread between its cost of funds and the mortgage rate
      charged to borrowers. As of June 25, 2026, nesto's posted insured 5-year fixed rate is
      4.09% and its insured variable (Prime minus 1.05%) stands at 3.40%, against a Bank of
      Canada policy rate of 2.25%. This implies a gross spread of roughly 185–365 basis points
      on insured product before cost of funds, credit losses, and operating costs.


      The second stream is broker and originator commissions. In Canada, mortgage lenders
      compensate brokers at approximately 100–110 basis points per funded deal. nesto earns
      the lender's economics on deals it funds through the M3 Group partnership (8,500+ brokers),
      but also pays finder fees when it originates through broker channels. The net commission
      per funded deal depends on the channel mix.


      The third stream is B2B SaaS licensing through Nesto Cloud. IG Wealth Management, Canada
      Life, and Alterna Savings pay licensing and servicing fees to use nesto's white-label
      mortgage origination, funding, and administration platform. The contract structure —
      per-unit, per-funded-deal, or AUM-based flat fee — is not publicly disclosed.


      The fourth stream is servicing income from the C$80B+ mortgages under administration
      (MUA). Industry standard servicer fees in Canada run approximately 10–15 basis points of
      outstanding balance per year. Applying 10 bps to C$80B yields an estimated C$80 million in
      annual servicing revenue, a floor estimate given CMLS brings additional commercial servicing.
      The HELOC product (Prime + 0.50% = 4.95%) adds a fifth stream with potentially higher NIM
      and revolving balance durability, though the HELOC book size is not disclosed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
