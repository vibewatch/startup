  - id: unit-economics
    title: Unit Economics, Margin Profile, and Cost Estimates
    body: >-
      nesto has not disclosed revenue, gross margin, EBITDA, or headcount. The unit economics
      picture must therefore be constructed from public market benchmarks and operational proxies.
      For the DTC lending stream, Canadian non-bank mortgage lenders typically operate at gross
      NIM of 1.5–2.5% before credit losses, depending on product mix, cost of funds (warehouse
      line spread over CORRA or CDOR), and the insured vs. uninsured split. At $37B annualized
      originations with an estimated average balance duration of 3 years, the estimated average
      book at any point would be approximately $111B — slightly above the MUA figure, suggesting
      a blend of retained and sold/securitized loans.


      Broker commissions in Canada typically run 100–110 basis points per funded mortgage,
      consistent with data from Dominion Lending Centres and Mortgage Alliance, two major
      Canadian broker networks. For nesto, this means the M3 channel generates both an
      acquisition cost (broker finder fee paid) AND origination fee income — the net contribution
      depends on whether nesto retains or sells those mortgages.


      Customer acquisition cost (CAC) for a DTC digital mortgage lender is difficult to estimate
      without disclosed marketing spend. Comparable Canadian digital lenders (Pine, True North
      Mortgage) have not disclosed CAC publicly. For context, in the U.S. digital mortgage space,
      DTC CAC has typically ranged from C$1,000–C$4,000 per funded loan. Given nesto's
      Deloitte Fast 50 position (implying strong growth) and its stated salaried advisor model
      (no commission-based sales), CAC is likely lower than broker-channel models but more
      expensive than pure automated platforms.


      Servicing cost for the C$80B MUA portfolio requires operational staff (Intellifi subsidiary
      provides loan processing services) and technology. At industry standard servicing costs of
      approximately 5–8 bps of MUA, total servicing opex would run C$40–64M per year. Against
      estimated servicing revenue of C$80–120M, this implies a servicing segment gross margin
      of 25–50% before technology and overhead allocation — not dissimilar to public Canadian
      mortgage servicers.
