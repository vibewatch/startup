  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: CMLS acquisition price and Series D amount
      missingEvidence: >-
        The acquisition price paid for CMLS Group in 2024 and the Series D funding amount raised
        concurrently are both undisclosed private transactions. No public record of either figure
        exists in press releases, regulatory filings, or news coverage.
      whyItMatters: >-
        Without these figures, the total capitalization history, the goodwill recorded on the
        CMLS acquisition, and the full dilution picture cannot be assessed. Material leverage
        assumptions are impossible without this data.
      diligencePath: >-
        Request CMLS purchase agreement (redacted or summary form), Series D term sheet summary,
        and full capitalization table from management in a formal data room.
      relatedQuestionRefs:
        - QI009

    - type: private-evidence-only
      severity: blocking
      topic: warehouse credit facilities and cost of funds
      missingEvidence: >-
        The counterparty lenders, facility size, pricing (spread over CORRA or other benchmark),
        covenants, and maturity dates for nesto's warehouse credit lines used to fund balance-sheet
        originations are entirely undisclosed.
      whyItMatters: >-
        Warehouse lines are the lifeline of balance-sheet mortgage lending. If facilities are
        constrained, over-priced relative to peers, or contain restrictive covenants, nesto's
        ability to originate and grow NIM is directly impaired. This is a core funding risk.
      diligencePath: >-
        Request warehouse facility term sheets, counterparty identities, availability under
        current lines, and historical draw utilization data.
      relatedQuestionRefs:
        - QI019

    - type: private-evidence-only
      severity: material
      topic: revenue and margin by business segment
      missingEvidence: >-
        Total revenue, revenue by stream (DTC lending, Nesto Cloud SaaS, CMLS commercial,
        servicing), and gross margin by segment have never been publicly disclosed.
      whyItMatters: >-
        Cannot calculate P/S multiple, assess revenue quality, determine SaaS vs. lending mix,
        or validate the profitability claim without this data. The valuation is entirely opaque
        without revenue anchoring.
      diligencePath: >-
        Request audited or management-prepared income statement, segment P&L, and reconciliation
        of MUA to revenue for at least the most recent 24-month period.
      relatedQuestionRefs:
        - QI002
        - QI012

    - type: missing-source
      severity: material
      topic: primary vs. secondary capital allocation in Series E
      missingEvidence: >-
        nesto has not disclosed the split between primary (new equity to balance sheet) and
