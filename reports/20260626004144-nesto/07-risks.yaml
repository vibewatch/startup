callouts:
  - calloutType: risk
    title: Regulatory Stack Depth
    body: >-
      Unlike a federally chartered bank with a unified OSFI supervisory relationship, nesto must simultaneously satisfy AMF (Quebec), FSRA (Ontario), OSFI-derived underwriting standards through funding counterparties, FINTRAC AML/KYC, FCAC consumer protection, PIPEDA, and Quebec's Law 25. Each jurisdiction can impose compliance requirements independently, creating a multi-regulator burden that scales with geographic expansion.
    claimRefs:
      - CR001
      - CR003
      - CR006

  - calloutType: risk
    title: M3 Single-Channel Concentration
    body: >-
      nesto's broker distribution depends entirely on the exclusive M3 alliance. The alliance is less than two years old. Should M3 exit, be acquired, or renegotiate terms adversely, nesto would lose its entire broker channel with no immediate substitute network available, materially compressing origination volumes and revenue.
    claimRefs:
      - CR032
      - CR033

  - calloutType: risk
    title: AI Model Risk Without Settled Regulatory Framework
    body: >-
      Maestro AI is operating at enterprise scale in high-stakes mortgage credit decisions without published Canadian regulatory guidance on AI underwriting. Systematically biased or miscalibrated model outputs could generate both financial losses (adverse selection) and regulatory/reputational exposure under FCAC consumer-protection obligations.
    claimRefs:
      - CR022
      - CR023

tables:
  - id: TR001
    title: "Regulatory / legal risk register"
    enumerationScope:
      coverage: partial
      basis: >-
        Material federal and provincial regulatory frameworks applicable to nesto's mortgage brokering, balance-sheet lending, and data operations in Canada as of June 2026; excludes minor provincial variants and informal OSFI guidance letters not publicly disclosed.
    columns:
      - Rule / License / Framework
      - Jurisdiction
      - Current Status
      - Likelihood of Adverse Change
      - Severity
      - Mitigation
      - Residual Exposure
      - Diligence Path
    rows:
      - - "OSFI Guideline B-20 (residential mortgage underwriting)"
        - Federal (OSFI, applies indirectly via funders)
        - "In force since Jan 2018; reviewed periodically"
        - Medium (annual MQR review; floor could rise)
        - High
        - nesto underwrites to B-20 standards as prerequisite for bank-warehouse access and default insurance
        - Any MQR increase directly cuts origination volumes and reduces accessible borrower pool
        - "Monitor OSFI annual MQR review; model sensitivity of origination volume to +50bps/+100bps stress-test threshold increases"
      - - "OSFI Minimum Qualifying Rate (MQR) stress test"
        - Federal (OSFI)
        - "Contract rate + 2% or 5.25%, whichever is greater; reviewed at least annually"
        - Medium
        - High
        - 150-day rate lock partially absorbs short-term MQR changes; product design limits insured vs uninsured exposure
        - Uninsured borrowers face direct qualifying constraint; volume compression immediate on upward revision
        - "Obtain data on insured vs. uninsured split of nesto's MUA; model origination scenario with +50bps MQR change"
      - - "FINTRAC AML/KYC (PCMLTFA obligations)"
        - Federal (FINTRAC)
        - "Mortgage brokers are reporting entities under PCMLTFA; ongoing compliance required"
        - Low (framework stable; enforcement is event-driven)
        - High
        - Digital identity verification built into onboarding; compliance team handles reporting
        - Failure to file STRs or identify beneficial owners could trigger fines and licensing suspension
        - "Verify FINTRAC registration status; obtain evidence of last compliance audit; review STR filing cadence"
      - - "FCAC consumer-protection framework (Code of Conduct, complaint handling)"
        - Federal (FCAC)
        - "Active; FCAC requires documented complaint processes and disclosure obligations"
        - Low
        - Medium
        - Complaint escalation processes documented; OBSI as backstop
        - June 2026 Trustpilot reviews indicate customer-service gaps that could generate FCAC complaints
        - "Request count and resolution rate of formal FCAC complaints vs informal Trustpilot reviews; review complaint-handling SLAs"
      - - "PIPEDA and Quebec Law 25 (data privacy)"
        - Federal + Quebec
        - "PIPEDA in force; Law 25 Phase 3 fully in force Sept 2023; 72-hour breach notification applies"
        - Medium (Law 25 enforcement intensifying in 2024-2025)
        - High
        - December 2025 privacy policy updated; breach-response plan presumably in place
        - AI decision-making transparency requirements and cross-border data-transfer rules create ongoing gap
        - "Obtain evidence of privacy-impact assessments for Maestro AI; verify breach-response plan; confirm data-transfer agreements"
      - - "AMF (Quebec) and FSRA (Ontario) mortgage broker licensing"
        - Provincial (QC, ON)
        - Licensed; renewals required periodically
        - Low (routine compliance)
        - Critical (license loss would halt operations in primary markets)
        - Active license management team; B Corp certification demonstrates governance posture
        - Provincial-specific requirements; any regulatory expansion into new provinces requires new licensing
        - "Confirm active AMF and FSRA license numbers; verify no outstanding regulatory notices or conditions"
    notes: >-
      Likelihood and severity are qualitative assessments based on publicly available regulatory guidance and analyst commentary as of June 2026. nesto's specific compliance posture on FINTRAC and provincial licensing has not been confirmed through primary audit evidence.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008

