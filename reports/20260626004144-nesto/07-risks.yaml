  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: insured vs. uninsured portfolio split
      missingEvidence: >-
        The split of nesto's C$80B+ MUA between insured (CMHC/Sagen/Canada Guaranty) and uninsured mortgages; insured mortgages carry negligible credit risk to nesto while uninsured mortgages carry full first-loss credit risk.
      whyItMatters: >-
        The credit-loss exposure to a housing price correction is almost entirely concentrated in the uninsured segment; without this split, the severity of housing-correction risk cannot be quantified.
      diligencePath: >-
        Request portfolio-level insured/uninsured breakdown, average LTV by vintage, geographic concentration by province, and delinquency-by-segment data directly from nesto management during due diligence.
      relatedQuestionRefs:
        - QR009
        - QR014
      relatedTableRefs:
        - TR001

    - type: private-evidence-only
      severity: material
      topic: warehouse facility terms and lender identity
      missingEvidence: >-
        The names of nesto's bank warehouse lenders, facility sizes, tenor, margin requirements, covenants, and cross-default provisions are not publicly disclosed.
      whyItMatters: >-
        Warehouse facility withdrawal is a thesis-break trigger; without knowing the counterparty and terms, the probability and severity of this risk cannot be assessed. Concentration in a single lender would be critical.
      diligencePath: >-
        Request warehouse facility documentation including lender names, facility sizes, advance rates, maturity dates, event-of-default triggers, and any cross-default provisions with other nesto Group entities.
      relatedQuestionRefs:
        - QR016
      relatedTableRefs:
        - TR003

    - type: private-evidence-only
      severity: material
      topic: M3 exclusivity contract terms
      missingEvidence: >-
        The contractual term, termination provisions, fee structure, volume commitments, and exclusivity scope of the M3 Mortgage Group broker-channel agreement are not publicly disclosed.
      whyItMatters: >-
        M3 is nesto's sole broker distribution network; understanding the contractual floor on the relationship is essential to assessing whether the concentration risk is structurally locked or could unwind rapidly.
      diligencePath: >-
        Request the M3 partnership agreement (or a summary term sheet) covering: exclusivity scope, minimum volume commitments, termination notice period, fee/commission structure, and non-compete provisions.
      relatedQuestionRefs:
        - QR013
        - QR017
