  - id: market-and-financial-risk
    title: Market and Financial Risk
    body: >-
      nesto holds C$80 billion-plus in mortgages under administration and originated over C$37 billion in the first half of 2026. This balance-sheet exposure means that a sustained increase in Canadian mortgage delinquencies or a material housing price correction would translate directly into credit losses and impairments, unlike a pure broker whose income is fee-based. The Bank of Canada's 2026 Financial Stability Report flags that while households and banks remain in stable financial condition, "vulnerabilities have increased in some parts of the system" and a "more turbulent global environment poses risks to financial stability."


      Canadian housing prices have recently declined—acknowledged in the OSFI domestic stability buffer release—and household debt-to-income remains high by historical standards even if below recent peaks. Approximately two million mortgages are scheduled for renewal in 2026 and 2027 according to CMHC, many at materially higher rates than their original terms. While nesto benefits from renewal demand, a subset of these borrowers may be unable to qualify at current rates without price renegotiations, creating adverse selection risk in nesto's renewal pipeline.


      nesto's lending model depends on continued access to wholesale funding—warehouse credit facilities, securitization, and capital markets—at acceptable spreads. The June 2026 Series E (C$302 million) provides runway, but balance-sheet mortgage lending is capital-intensive by nature, and the secondary component of the Series E suggests some prior investors sought partial liquidity at the C$1.47 billion valuation. Any deterioration in credit markets, a repricing of non-bank lender risk, or a withdrawal of bank warehouse facilities would constrain origination capacity abruptly. Equitable Bank's publicly reported financials illustrate the credit-loss and funding risks inherent in the non-bank Canadian mortgage sector.


      nesto's undisclosed revenue and margin structure makes it impossible to quantify interest-rate sensitivity precisely. Fixed-rate mortgages lock in margins at origination; if funding costs rise or the yield curve flattens, net interest margin compresses. The OSFI DSB reduction (June 2026) signals regulator confidence in bank balance sheets, but the broader economic environment—Canada's economy contracted slightly in Q4 2025 and Q1 2026 per BoC commentary—poses demand-side risks that could slow origination growth.
