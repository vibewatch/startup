chapter:
  number: 7
  title: Risks
  summary: >-
    nesto Group faces layered risks arising from balance-sheet mortgage lending, regulatory obligations under OSFI/FINTRAC/FCAC/provincial frameworks, an AI-dependent operating model still maturing under scrutiny, concentrated partner and geographic exposures, and a customer-experience gap visible in June 2026 Trustpilot reviews. Canadian housing price volatility and high household debt identified in the Bank of Canada's 2026 Financial Stability Report are the broadest macro headwinds. The most structurally acute risks are: (1) regulatory compliance across a patchwork of federal and provincial frameworks without the compliance infrastructure of a chartered bank; (2) the M3 broker-channel concentration after a partner-exclusive alliance with 8,500+ brokers; and (3) AI/model risk from the newly launched Maestro AI platform operating at scale before full regulatory guidance exists.

sections:
  - id: regulatory-and-legal-risk
    title: Regulatory and Legal Risk
    body: >-
      nesto operates in one of Canada's most heavily regulated sectors without the compliance infrastructure of a federally chartered bank. As a provincially licensed mortgage broker and non-bank lender, nesto must satisfy: the Autorité des marchés financiers (AMF) in Quebec; the Financial Services Regulatory Authority of Ontario (FSRA); equivalent bodies in each other province; FINTRAC for anti-money laundering and know-your-customer obligations; the Financial Consumer Agency of Canada (FCAC) for consumer-protection standards; Canada's federal privacy law PIPEDA and Quebec's more stringent Law 25; and indirectly, OSFI guidelines—including Guideline B-20 and the Minimum Qualifying Rate (MQR)—because its bank funding counterparties and default insurers (CMHC, Sagen, Canada Guaranty) require compliance as a condition of access.


      The OSFI MQR stress test, currently set at the greater of the mortgage contract rate plus 2% or 5.25%, directly constrains the pool of borrowers nesto can qualify and hence its origination volume. OSFI reviews the MQR at least annually; an upward revision tightens underwriting and compresses volumes immediately. Conversely, OSFI's June 20, 2026 decision to lower the domestic stability buffer by 50 basis points to 3%—freeing approximately C$74 billion in bank capital—improves the funding environment but signals that OSFI considers systemic vulnerabilities to be "relatively stable for some time," not resolved.


      nesto's privacy obligations are escalating. The company's December 2025 privacy policy confirms it collects credit scores, income, property data, borrowing history, device identifiers, and browsing data, sharing these with financial institutions, referral partners, and promotional partners. Quebec's Law 25, which materially exceeds federal PIPEDA, applies to nesto's large Quebec customer base. Quebec Law 25 requires privacy-impact assessments, mandatory breach notifications within 72 hours, and algorithmic transparency—obligations that nesto must maintain as its Maestro AI platform expands. The Office of the Privacy Commissioner's PIPEDA compliance framework sets the federal floor, while the AI decision-making transparency requirements are still evolving regulatory territory.


      The BCSC's 2024 securities-law enforcement activity regarding digital financial services companies underscores that provincial regulators are actively scrutinising fintech lending models. No enforcement actions against nesto have been identified in public sources, but the regulatory risk is structural: any material change to OSFI B-20 underwriting guidelines, provincial licensing requirements, or FINTRAC thresholds could require rapid policy and systems adaptation. Consumer complaint handling is also regulated; FCAC's complaint-management framework requires nesto to maintain a documented complaint-handling process, and Trustpilot reviews from June 2026 identify specific customer-service failures.
