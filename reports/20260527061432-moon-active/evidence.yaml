evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, committee structure, and ownership map for Moon Active.
    whyItMatters: Without governance visibility it is hard to assess oversight quality, investor control, or key-person dependency.
    diligencePath: Request a management deck, board list, and shareholder overview directly from the company or a lead investor.
    relatedQuestionRefs:
      - QO014
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-confirmed 2026 employee count broken down by geography.
    whyItMatters: Conflicting public headcount figures impair efficiency analysis and make cost-structure assumptions noisier.
    diligencePath: Ask management for current FTE by office and compare it with 2024-2026 payroll or org data.
    relatedQuestionRefs:
      - QO013
  - type: conflicting-data
    severity: minor
    topic: historical-drift
    missingEvidence: A primary corporate source that fixes the canonical founding year and clarifies early Coin Master release history.
    whyItMatters: The discrepancy does not break the thesis, but later chronology should use one consistent baseline.
    diligencePath: Confirm founding date and flagship launch timeline from company legal records or a founder interview.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: company-level-financials
    missingEvidence: >-
      Audited company revenue, margin, and cash-flow statements that separate Coin Master estimates from enterprise
      totals.
    whyItMatters: >-
      Current public coverage is rich on product revenue milestones but weak on company-level quality-of-revenue
      metrics.
    diligencePath: Obtain management financials or investor reporting and reconcile them against app-intelligence estimates.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: TO003 milestone table coverage
    missingEvidence: >-
      A company-authored milestone chronology that confirms every launch, acquisition, and internal product-development
      date.
    whyItMatters: >-
      The public milestone table is sufficient for orientation but may omit internal launches or undisclosed strategic
      steps.
    diligencePath: Ask management for a canonical corporate timeline and reconcile it against the retained public chronology.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: TO004 leadership and founder table coverage
    missingEvidence: A complete current leadership roster, board list, and reporting structure for Moon Active.
    whyItMatters: Partial executive visibility is not enough to assess bench depth, oversight, or succession risk.
    diligencePath: Request an org chart and board roster directly from the company or lead investor.
    relatedQuestionRefs:
      - QO014
      - QO015
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: material
    topic: TO006 stakeholder or investor map coverage
    missingEvidence: A full cap table showing ownership percentages, preference terms, and secondary-sale participants.
    whyItMatters: >-
      The public stakeholder map names only visible participants and cannot support rigorous dilution or control
      analysis.
    diligencePath: Obtain a cap table, financing documents, and investor-rights summary under NDA.
    relatedQuestionRefs:
      - QO008
      - QO014
    relatedTableRefs:
      - TO006
  - type: private-evidence-only
    severity: material
    topic: payer-mix
    missingEvidence: >-
      Company-specific payer conversion, spender concentration, and ARPPU/LTV data for Coin Master and Moon Active's
      newer titles.
    whyItMatters: >-
      Public mobile-gamer averages do not reveal whether Moon Active monetizes like a narrow social-casino product or a
      broader casual portfolio, which changes any SAM/SOM inference.
    diligencePath: >-
      Request internal cohort dashboards showing payer share, payer concentration, and repeat purchase frequency by
      geography and title.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
      - TM005
  - type: private-evidence-only
    severity: material
    topic: platform-economics
    missingEvidence: Current gross-to-net revenue bridge by store, region, tax, and any D2C or web-store channel for Moon Active.
    whyItMatters: >-
      Platform fees, payment mix, and any off-store migration determine how much gross player spend actually lands as
      net revenue and therefore how attractive the broader market really is.
    diligencePath: >-
      Request monthly finance data splitting Apple, Google, taxes, refunds, chargebacks, and any external payment or
      web-shop volume.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM005
  - type: conflicting-data
    severity: material
    topic: market-boundary
    missingEvidence: >-
      A same-vintage, same-method dataset that explicitly separates social casino, casual IAP, and total mobile-game
      spend using consistent inclusion and exclusion rules.
    whyItMatters: >-
      Current market estimates are useful only as lenses; without aligned definitions, any single TAM headline can
      materially overstate or understate Moon Active's true addressable market.
    diligencePath: >-
      Commission or license one primary dataset from a mobile-intelligence vendor that publishes category mappings,
      platform scope, and whether ad revenue or D2C payments are included.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
      - TM006
  - type: private-evidence-only
    severity: material
    topic: moon-active-dtc-visibility
    missingEvidence: >-
      Public Moon Active and Coin Master surfaces reviewed for this chapter do not disclose whether Moon Active has a
      web shop, what share of revenue flows through it, or whether any off-store loyalty program exists.
    whyItMatters: >-
      A real DTC program would materially change Moon Active's margin profile, app-store dependence, and competitive
      position relative to Playtika and Supercell.
    diligencePath: >-
      Request Coin Master DTC roadmap, web-shop GMV share, repeat-purchase rate, and gross-margin delta versus app-store
      purchases.
    relatedQuestionRefs:
      - QP016
      - QP026
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moon-active-portfolio-mix
    missingEvidence: >-
      Independent rankings mention Travel Town and Zen Match, but public evidence does not provide a clean revenue,
      payer, or profit split across Moon Active's broader portfolio versus Coin Master.
    whyItMatters: >-
      Without title-level mix, Moon Active could appear more diversified than it really is, which would overstate
      resilience to a Coin Master slowdown.
    diligencePath: >-
      Request title-level revenue, bookings, payer counts, and UA spend for Coin Master, Travel Town, Zen Match, and any
      acquired casual titles.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: player-overlap-and-switching
    missingEvidence: >-
      The retained public evidence does not show user-level overlap, payer migration, or cohort switching rates between
      Coin Master, MONOPOLY GO, and Playtika's substitute titles.
    whyItMatters: >-
      Without overlap cohorts, it is impossible to know whether Moon Active is mostly sharing wallet with board-game
      adjacencies, social-casino substitutes, or puzzle incumbents.
    diligencePath: >-
      Request overlap cohorts, reactivation rates, and payer migration data across Coin Master, MONOPOLY GO, and
      social-casino substitutes in key geographies.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: likely-entrant-roadmaps
    missingEvidence: >-
      No retained public source shows Supercell or Tripledot actively building a coin-looter or social-casino-adjacent
      title today, so entrant risk is inferred from capability and optionality rather than confirmed product roadmap
      evidence.
    whyItMatters: >-
      Likely-entrant analysis can otherwise overstate near-term threat and understate the time needed for adjacency to
      become direct competition.
    diligencePath: >-
      Monitor soft launches, acquisition activity, hiring plans, and store expansions tied to board, raid, or
      social-casino mechanics for Supercell and Tripledot.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: moon-active-balance-sheet
    missingEvidence: Current cash, short-term investments, debt, covenant package, monthly burn, and runway model.
    whyItMatters: >-
      Without direct liquidity data, the chapter can only infer capital adequacy from revenue scale and financing
      history rather than verify it.
    diligencePath: >-
      Request the last eight quarters of cash, debt, and free-cash-flow reporting plus a board-approved 24-month
      operating plan.
