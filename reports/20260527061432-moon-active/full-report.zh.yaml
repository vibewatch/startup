companyProfile:
  summary: >-
    Moon Active 是一家总部位于特拉维夫的私人移动游戏公司，Samuel Albin 于 2011 年创立。公司围绕 Coin Master 起量；Coin Master 是全球收入最高的休闲移动游戏之一。此后，Moon
    Active 通过收购 Melsoft、Zen Match
    等拓宽产品组合。公开证据支持其收入规模异常大、很可能有很强的现金生成能力，但公司在股权结构表、董事会构成、当前利润率和分游戏收入结构上仍明显不透明。因此，公开尽调更能证明其战略相关性，却不足以完整承销这笔股权。
