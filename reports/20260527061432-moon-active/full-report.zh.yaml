  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价界面与确认问题
        blocks:
          - type: paragraph
            body: >-
              Moon Active 的公开定价界面，是规模化免费移动游戏的典型形态：入口免费，变现推到反复内购里，商业压力藏在循环内部，而不是下载时。Coin Master 的 App Store
              页面称游戏免费并含内购，用户可以用真钱购买虚拟物品，且不属于真钱赌博；Travel Town 同样免费并含内购，还提示存在随机物品。Apple 的开发者页面也把两款游戏都指向 Moon
              Active，这足以说明产品组合通过应用商店交易变现，而不是订阅或企业合同。没有公开的是，玩家消费进入账本之后，Moon Active 如何确认收入。公开同行文件给出了关键会计细节：Playtika
              按总额记录虚拟物品销售，把平台费用计入收入成本，消耗品在使用时确认，耐用品在六到十二个月内确认，并把广告库存按代理收入净额处理。对 Moon Active
              也应采用同样谨慎态度。公开收入线索很强，但已实现收入质量仍取决于虚拟物品组合、消耗时点、递延收入、税费、退款，以及公司没有披露的任何商店外支付流。
