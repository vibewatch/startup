      - number: '8.4'
        title: 在非公开证据补齐股权承销缺口前，观察是正确建议
        blocks:
          - type: paragraph
            body: >-
              Moon Active
              达到了持续关注的质量门槛，但还不到立即买入。公司大概率不需要紧急新股融资；历史上使用老股交易加收购，也说明业务具备真实的内部现金生成能力和选择权。即便如此，私募投资建议仍必须对价格敏感。公开证据没有披露当前现金、债务、优先权条款或单款游戏贡献利润率；这些未知项比又一个漂亮的收入里程碑更重要。因此，建议是以中等置信度观察，并给出高风险评级。可能的上行情景真实存在，但证明责任仍落在经济性和资本结构上。升级为买入需要实时股权结构表、经审计的
              2025 或 2026 年收入和 EBITDA、单款游戏利润贡献、DTC 占比以及 UA 回本数据。若 Coin Master
              集中度恶化，融资质量变得惩罚性，或品类压力压过多元化，投资逻辑就会破裂。退出方面，公开记录更支持老股交易或战略出售视角，而不是可以立即承销的 IPO 路径。
