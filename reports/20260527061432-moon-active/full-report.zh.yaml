  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最伤害价值的路径很直接：政策或 UA 信号损失叠加 LiveOps 摩擦，随后压缩流水、利润率和私募估值支撑。
    data:
      nodes:
        - id: n1
          label: 随机性变现审查
          detail: 商店和法律压力围绕老虎机式或随机变现上升。
        - id: n2
          label: 平台 / 隐私规则变化
          detail: ATT、计费或披露义务收紧。
        - id: n3
          label: UA 效率下降
          detail: 归因噪音或广告饱和削弱付费增长。
        - id: n4
          label: LiveOps / 计费摩擦
          detail: 连接问题、购买失败或客服积压打击玩家信任。
        - id: n5
          label: 评论与声誉受损
          detail: 投诉场域和公开情绪恶化。
        - id: n6
          label: 流水集中度持续
          detail: Coin Master 仍是主要盈利引擎。
        - id: n7
          label: 利润率压缩
          detail: 更高支出或摩擦削减留存经济性。
        - id: n8
          label: 估值压力
          detail: 经济性不透明、分散化放慢，削弱价格支撑。
      edges:
