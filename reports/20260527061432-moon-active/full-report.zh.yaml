      - number: '8.2'
        title: 可比证据只能划边界，不能给出干净的一一对应倍数
        blocks:
          - type: paragraph
            body: >-
              可比公司组更能说明估值边界，而不是给出一个公平倍数。热度退去后，公开交易的纯移动游戏和社交赌场运营商估值可能被压得很低。Playtika 虽然季度收入规模大、DTC 已有实质规模，2026 年 5
              月公开市值也只有 $1.28 billion；Stillfront 仍有一定收入基础，市值却接近 $0.27 billion。MTG 游戏组合更广，Plarium
              之后规模更大，相对收入的公开估值更强，但仍不算高。另一端，战略控制交易仍能跑出大得多的价格：Take-Two 为 Zynga 支付的隐含企业价值为 $12.7 billion，Savvy 同意以 $4.9
              billion 收购 Scopely。AppLovin 说明了为什么业务模式纪律很重要：其巨大市值反映的是营销平台经济性，并不是单一公司游戏运营商的直接先例。再叠加 2026 年 UA 基准显示 CPI 和
              CPM 上升，可比组指向的是 Moon Active 低个位数到中个位数的游戏倍数框架，而不是 AppLovin 式的软件重估。
