  - id: TV005
    title: 投资逻辑破裂与否决触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 集中度再次恶化
        - Coin Master 收入占比相对 Q1 2024 基线不降反升
        - 将规模化组合故事打回单一核心游戏测算问题
        - 转向回避，或要求大幅更低的进入价格
      - - 融资质量恶化
        - 新融资引入惩罚性优先权、反稀释棘轮或救助资本信号
        - 即使公司继续增长，普通股上行也可能被优先级权利吸收
        - 在重新测算分配瀑布前，视为投资逻辑破裂
      - - 品类压力加剧
        - RPD 持续下滑，而 CPI 和 CPM 维持高位
        - 总增长不再转化为有吸引力的净经济性
        - 压缩倍数区间并重新评估建议
      - - 当前规模被证实弱于报道
        - 经审计的 2025 或 2026 年收入显著低于 >$2B 的公开叙事
        - 收入锚断裂，整个仅基于公开信息的区间都必须下移
        - 向悲观情景重置，并重新打开尽调
      - - 退出路径收窄
        - 在合理估值下，既没有老股需求，也没有战略兴趣
        - 没有可实现流动性，即使是好公司也可能变成差投资
        - 无论公司质量如何，都不要从观察上调
    notes: 这些是否决标准，而不是泛化风险。每一项都会改变证券的实际优先级，或改变赚取目标回报所需退出路径的可信度。
    claimRefs:
      - CV009
      - CV016
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 当前股权结构表和优先级
        - 当前证券层级、员工流动性条款、优先股权利，以及任何债务或循环信贷余额
        - 缺少这些材料，就无法把企业价值转换为股权价值，也无法判断下行保护
        - CFO 材料包，并由律师审阅融资文件
      - - 经审计经营业绩
        - 经审计的 2025 年及 2026 年迄今收入、EBITDA、现金流和现金余额
        - 验证 >$2B 收入叙事是否可持续且有利润支撑
        - 财务尽调，使用经审计或董事会级别报表
      - - 单款游戏经济模型
        - 按主要游戏拆分的月收入、毛利率、贡献利润率和实时运营支出
        - 检验多元化是在降风险，还是只是在掩盖公司仍靠单款游戏运转
        - 经营复盘，结合单款游戏 P&L 与管理层桥接表
      - - 渠道与 UA 效率
        - DTC 占比、平台费负担、综合 CPI、队列回本周期和头部国家组合
        - 看平台和买量成本变动时，Moon Active 能否守住利润率
        - 用 UA 看板和 DTC 分析做增长与财务尽调
      - - 退出准备度
        - 董事会层面对老股流动性、战略买家兴趣和公开市场准备度的判断
        - 判断持有期逻辑是否有现实兑现路径
        - 董事会材料、投行参考访谈和股东流动性规划审阅
    notes: 每一项尽调请求都是为了把公开筛查章节转成可投资的承销档案。如果管理层拿不出这些材料，建议不应上调。
    claimRefs:
      - CV047
      - CV048
      - CV050
