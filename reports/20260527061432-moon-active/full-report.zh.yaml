  - id: TM006
    title: 相互矛盾的估算与尽调缺口
    columns:
      - 问题
      - 证据
      - 矛盾原因
      - 对投资测算的含义
      - 尽调下一步
    rows:
      - - 2026 年社交博彩市场规模因来源而异
        - Mordor USD 9.06B，对比 TBRC USD 10.11B
        - 一个来源宽泛界定社交博彩；另一个把应用和网站上的在线社交博彩纳入范围
        - 将两者视为窄口径参照，而非精确事实
        - 向移动情报供应商索取一套一手分类口径
      - - 社交博彩长期预测更大
        - Grand View 预计 2030 年达到 USD 14.31B
        - 预测期限和假设不同于 2026 年时点估算
        - 增长存在，但投资者不应把 2030 年乐观预期折进 2026 年 TAM
        - 估值工作中把当前市场与未来牛市情景拆开
      - - 休闲 IAP 口径远大于社交博彩
        - MAF 休闲 IAP 收入 USD 32.7B
        - 休闲品类包含许多并非 Coin Master 行为替代品的游戏
        - 适合作为中上边界，不适合精确同业集
        - 按机制搭建同业篮子，不只看商店类型
      - - 总移动游戏和应用支出口径更大
        - Newzoo 式 USD 103B 移动游戏；Sensor Tower 式 USD 233B 总应用支出
        - 这些数字包含 Moon Active 无法实际捕获的支出池
        - 适合做背景，但作为核心 TAM 主张风险高
        - 仅在投资备忘录中作背景
      - - 公司自身付费者结构未知
        - 公开付费者基准存在，但 Moon Active 分群数据没有公开
        - 品类均值无法揭示 Coin Master 的实际付费者集中度
        - SAM/SOM 精度有限
        - 索取游戏层面的付费转化率和 ARPPU 数据
      - - 扣除商店费用和 D2C 后的净收入未知
        - Apple 和 Google 有账单系统文档，但 Moon Active 毛额到净额桥接未披露
        - 公开文档描述规则，不描述 Moon Active 的实际组合
        - 不应把玩家总支出混同为公司净收入
        - 索取按商店拆分的毛额到净额桥接
    notes: 这张表保留矛盾，而不是把矛盾抹平。这是有意为之：模糊边界正是 Moon Active 市场分析的核心现实，不是格式问题。
