  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              不应把 Moon Active 当作真钱赌博运营商分析，但也不能把 Coin Master 视为没有任何赌场相邻性的普通休闲游戏。Google Play
              官方页面把该游戏描述为一款带内购的免费游戏，并明确称它不提供真钱赌博或真钱奖励。同时，第三方品类分析师把 Coin Master 在 Google Play 上归为休闲、在 Apple
              上归为冒险；从机制上看，它最接近社交赌场老虎机产品，因为核心循环是旋转、奖励、建造和突袭。实际市场边界因此是以休闲玩法为中心的免费移动娱乐，但带有社交赌场相邻的变现心理。这一框架重要，是因为狭义社交赌场市场在
              2026 年约为 USD 9-10 billion，更宽的休闲游戏内购（IAP）池大得多，约为 USD 32.7 billion，而完整移动游戏背景则约为 2025 年 USD 103 billion
              收入。Coin Master 自 2020 年以来自身约 USD 1.2 billion 的年收入代理值，意味着无论采用哪种口径，Moon Active
              在经济上都已经重要；但隐含市场份额会随着边界选择彻底改变。因此，本章使用多重视角，而不是一个膨胀的总可用市场（TAM）标题。
