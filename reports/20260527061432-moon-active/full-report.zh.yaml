  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接、相邻、替代与可能进入者格局
        blocks:
          - type: paragraph
            body: >-
              Moon Active 的竞争集合，比“移动游戏”这个泛标签暗示的更紧。Coin Master
              官方页面仍把旗舰产品定义为一款包含旋转、突袭、建造、收集和团队玩法的休闲游戏，用户可购买虚拟物品，但没有真钱兑付。这使 Scopely 的 MONOPOLY GO
              成为最接近、已有规模的相邻对手，因为它用不同前端——骰子和棋盘游戏外皮——套上了同一套经济骨架：建造成长、社交抢劫、贴纸收集，以及高频活动节奏。独立分析显示，MONOPOLY GO
              扩大了抢金币玩法受众，而不是立刻摧毁 Coin Master，但这并不令人安心；这意味着 Moon Active 现在是在一个更大、资金更足的竞技场里竞争。因此，直接集合是 Coin Master
              加上其他抢金币或社交赌场相邻循环；在位者集合是 King 和 Playrix；替代集合是 Playtika 的社交赌场组合；可能进入者或标杆集合包括 Supercell、Jam City 和
              Tripledot，它们即便不完全克隆 Coin Master，也有足够的长线运营、受众或商店成熟度形成影响。
