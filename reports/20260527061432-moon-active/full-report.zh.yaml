      - number: '2.3'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              主要增长顺风真实存在，但已经不再简单。智能手机和互联网渗透继续扩大可触达受众：现在使用手机的人超过 5.78 billion，在线人口超过 6
              billion，移动端仍是用户和收入规模最大的游戏平台。休闲形式仍主导安装量，长线运营、小游戏、奖励和季节性活动已经成为维持参与度的标准工具。Adjust 和 AppsFlyer
              都显示同一个运营变化：增长不再主要靠蛮力拉规模，而更依赖留存、创意迭代和高效获客。但约束同样重要。AppMagic 的 2025
              年总结指向一个成熟市场，收入增长近乎持平；赌场游戏下载量上升但收入下降，说明变现效率变弱。ATT 和更广泛的隐私限制降低了 iOS
              上的定向信号质量。应用商店仍中介购买流程，并可能改变分发经济性。最后，赌博相邻机制面临越来越多审查：英国监管方现在要求显著披露战利品箱，希望在没有父母同意时阻止 18
              岁以下购买，并在行业自律失灵时继续评估更强措施。对 Moon Active 来说，市场足够大；真正的问题是，当分发环境更昂贵、监管更严格时，公司能否继续维持高转化和高留存。
