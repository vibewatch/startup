  - id: FU001
    title: Moon Active 玩家旅程地图
    type: journey-map
    layout: wide
    summary: 公开证据显示，免费安装之后，玩家会分化为社交掠夺、合并建设和轻松解谜几类习惯，之后流向客服或跨游戏探索。
    data:
      items:
        - label: 发现
          actor: 新的休闲手游玩家
          touchpoints:
            - App Store 或 Google Play 发现
            - 社交、明星或朋友带来的认知
            - 其他应用任务或激励安装
          emotion: 好奇、投入成本低
          painpoint: Little visibility into true retention or spend pressure before install
          opportunity: Free entry and recognizable Moon Active branding widen the funnel
        - label: 第一习惯循环
          actor: Coin Master 旗舰游戏玩家
          touchpoints:
            - 转盘和掠夺循环
            - 团队、卡牌和复仇机制
            - 早期 Facebook 连接或赠礼提示
          emotion: 快速奖励和社交竞争带来兴奋感
          painpoint: Spins and progression bottlenecks appear quickly
          opportunity: Social loops deepen repeat use better than a pure slot app
        - label: 替代习惯循环
          actor: Travel Town 或 Zen Match 玩家
          touchpoints:
            - 合并任务或每日方块谜题
            - 村民、房间、植物或活动
            - 低强度每日回访行为
          emotion: 放松，但受日常节奏驱动
          painpoint: Energy limits, ads, or feature removals can break the promise
          opportunity: These titles diversify motivation beyond Coin Master's raid psychology
        - label: 客服 / 摩擦
          actor: 付费玩家、卡关玩家或受故障影响的用户
          touchpoints:
            - 单款游戏帮助中心
            - 评论更新或 Trustpilot 投诉
            - 退款或物品缺失升级处理
          emotion: 沮丧，对响应质量高度敏感
          painpoint: Public support transparency is weak relative to visible complaint volume
          opportunity: Better service could protect repeat spend and ratings
        - label: 扩张 / 产品组合探索
          actor: 忠诚 Moon Active 玩家或好奇的新受众
          touchpoints:
            - Google Play 或 Apple 开发者页面
            - Board Adventure、Hole Stars 或 Family Bay 列表
            - 官方单款游戏社区页面
          emotion: 品牌信任已经存在时，愿意测试新循环
          painpoint: No public proof of cross-title overlap or migration efficiency
          opportunity: Portfolio adjacency can turn a single-title relationship into a multi-title one
    approximationNotes: 这是根据商店页面、评论界面和客服文档综合出的定性客户旅程图；Moon Active 不公布漏斗阶段转化率。
    claimRefs:
      - CU038
      - CU039
      - CU041
  - id: FU002
    title: 公开采用与问题升级流程
    type: flow
    layout: wide
    summary: Moon Active 的公开客户流从免费发现进入习惯循环，再分叉到社交深化、变现摩擦、客服和可能的跨游戏迁移。
    data:
      nodes:
        - id: discovery
          label: 免费应用发现
          detail: 玩家通过应用商店、付费认知投放、社区分享或激励安装入口接触 Moon Active。
        - id: install
          label: 安装与首次会话
          detail: 入口免费，初始体验围绕快速早期奖励、教程和可选社交连接搭建。
        - id: habit
          label: 习惯养成
          detail: Coin Master 靠掠夺、卡牌和团队拉动；Travel Town 靠合并订单和村民；Zen Match 靠每日轻松谜题。
        - id: pressure
          label: 变现或能量压力
          detail: 转盘、能量或广告给非付费玩家或不满的重复用户带来摩擦时，进度就会变慢。
        - id: support
          label: 客服与公开反馈
          detail: 故障、物品缺失或消费挫败出现时，玩家要么使用单款游戏帮助中心，要么留下公开评论。
        - id: expansion
          label: 跨游戏探索
          detail: 同一玩家可以通过官方产品组合页面或相邻游戏上线发现其他 Moon Active 游戏。
        - id: churn
          label: 流失或未解决挫败
          detail: 如果客服和价值感失败，玩家会公开投诉，并停止消费或彻底离开。
      edges:
        - from: discovery
          to: install
          label: 免费下载
        - from: install
          to: habit
          label: 早期奖励和核心循环
        - from: habit
          to: pressure
          label: 变现和能量约束浮现
        - from: pressure
          to: support
          label: 玩家求助或留下反馈
        - from: support
          to: expansion
          label: 满意玩家留在产品组合内
        - from: pressure
          to: churn
          label: 摩擦超过感知价值
        - from: habit
          to: expansion
          label: 品牌信任带动相邻游戏试用
    claimRefs:
      - CU036
      - CU040
      - CU042
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 具名玩家证据最能证明当前使用和摩擦可见度，但对付费持久性和正式队列证据仍然偏弱。
    data:
      columns:
        - 上线成熟度
        - 结果具体度
        - 持久性信号
        - 证据质量
      rows:
        - label: Nikki Applewhite / Coin Master
          values:
            - 当前活跃用户
            - 游玩七年；同一团队近一年
            - 最强公开旗舰游戏留存年限信号
            - AppBrain 评论加官方应用语境
        - label: Tom P / Coin Master
          values:
            - 当前活跃用户
            - 明确的非付费进度痛点
            - 证明挫败感，不证明变现持久性
            - AppBrain 评论加更广投诉模式语境
        - label: Yue Ai / Travel Town
          values:
            - 当前活跃用户
            - 积分墙式获客加活动参与
            - 长期留存披露弱
            - AppBrain 评论加官方应用语境
        - label: Madison Pohlen / Zen Match
          values:
            - 当前活跃用户
            - 故障后获得正向客服解决
            - 当前使用可见；长期留存不清楚
            - AppBrain 评论加官方应用语境
        - label: Amanda Rector / Zen Match
          values:
            - 当前重复用户
            - 连接问题出现前已玩约一年
            - 中等持久性证明
            - AppBrain 评论加官方应用语境
    claimRefs:
      - CU038
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
