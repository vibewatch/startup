  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的法律和平台风险：基于机会的变现是最清楚的公开法律阴影
        blocks:
          - type: paragraph
            body: >-
              Moon Active 排名最高的风险不是缺少规模，而是它最大的现金引擎仍贴近受监管的机会机制，同时完全通过第三方应用商店分发；这些商店正在持续收紧披露、隐私和计费规则。Coin Master
              的官方商店界面明确把模拟赌博或老虎机式玩法与真钱购买结合在一起，Travel Town 的 App Store 页面也单独披露随机物品。仅凭这一点并不会让业务违法，但它让 Moon Active
              持续暴露在移动的合规边界上。英国 ASA 的 2026 年执法通知现在要求在 Apple 和 Google 应用列表中显著披露战利品箱，并拒绝含糊的“offers in-app
              purchases”标签。Apple 另行要求对随机虚拟物品披露概率，把赌博视为 App Store 监管最严格的类别之一，并且可以因隐私或追踪违规下架应用。Google Play
              同样要求随机物品披露概率，要求大多数应用内购买使用 Play billing，并限制引导用户使用外部支付方式。正在进行的 Williams v. Moon Active
              诉讼，把抽象政策风险变成具体法律风险：原告称 Coin Master 是面向儿童的非法赌博。我的实际排序因此是：法律和平台风险第一，因为它可以同时直接损害分发、转化和品牌信任。
