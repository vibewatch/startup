      - number: '1.3'
        title: 领导层、运营足迹与披露缺口
        blocks:
          - type: paragraph
            body: >-
              运营图景比治理图景清楚。公开画像和 Moon Active 自己的招聘材料支持 Samuel Albin 持续领导公司，也显示组织在产品、研发、营销、客户关系、安全、财务 /
              法务、变现和运营等职能招聘。当前招聘页面还确认，公司在特拉维夫、基辅和华沙有活跃足迹；一个华沙 DevOps 岗位描述了每天摄入数十亿事件的基础设施，并依赖
              GCP、AWS、Cloudflare、Kubernetes、GitHub Actions 和 ArgoCD。这些运营细节有价值，因为它说明 Moon Active
              不只是营销很重的休闲游戏工作室；它实际运行着有分量的后端、数据和长线运营基础设施。不过，在机构尽调通常更容易推进的地方，公司仍然不透明。可访问的公开来源对当前员工数分歧很大，只露出部分高管信息，也没有可靠的实时董事会名单、股权结构表或经审计收入报表。估值语言也需要谨慎：一些
              2024 年报道清楚指的是 Coin Master 收入里程碑突破 $6 billion，而不是新的公司定价融资。对后续章节的实际启示是：从公开证据看，Moon Active
              作为商业现象容易理解，但作为治理对象更难承销。这种不对称足以支撑第一章的定向理解，但也意味着后续每一章都应把关于员工数、估值和治理的硬数字当作需要重新佐证的估计，而不是盲目继承某个单一画像页面。
