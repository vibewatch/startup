  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 旧估值对应的业务已大得多，但集中度仍是主线
        blocks:
          - type: paragraph
            body: >-
              把 Moon Active 描述成规模化资产并不难，难的是给这只当前私有证券定价。最近有充分记录的公司估值已经很旧：Insight 2020 年投资时估值 $1.25 billion，2021 年 $300
              million 老股交易时估值 $5 billion。之后，公开报道的重心从融资转向经营规模。到 2024 年，本次留存报道称 Coin Master 终身消费已超过 $6 billion，自 2020
              年以来年收入约 $1.2 billion；Globes 则报道 Moon Active 2024 年底收入创纪录，超过 $2 billion。这足以说明，公司规模已大于过时的 $5 billion
              估值所暗示的水平。但这还不足以证明 Moon Active 应享受不受约束的溢价。Naavik 的 2024 年 Q1 商店收入拆分仍显示 Coin Master 贡献 73% 收入，2025
              年裁员报道也说明，即便已有规模，管理层仍在调整组织结构。因此，开篇估值结论很直接：旧估值太低，不能单独锚定 2026 年；但单款游戏集中度和私有披露缺口仍会压住确信度。
