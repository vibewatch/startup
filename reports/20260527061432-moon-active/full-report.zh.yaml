  - id: TV004
    title: 可比估值表
    columns:
      - 参照
      - 最新收入 / 规模信号
      - 估值 / 市值信号
      - 与 Moon Active 的相关性
      - 局限
    rows:
      - - Playtika
        - 2025 年收入增长 8.1%；Q1 2026 收入 $744.7M，DTC $291.8M
        - 2026 年 5 月市值约 $1.28B
        - 成熟移动 / 社交赌场上市参照，有真实 DTC 和较高 UA 强度
        - 上市股权价值受债务、成熟度和产品组合特定问题压低，因此它是下行边界，不是直接估值标记
      - - Stillfront Group
        - 2025 年净收入 5,710 MSEK；调整后 EBITDAC 1,580 MSEK
        - 2026 年 5 月市值约 $0.27B
        - 展示增长停滞时，市场会如何严厉惩罚收购型移动游戏整合平台
        - 币种不同且规模小于 Moon Active；作为下限警示性可比
      - - MTG
        - 2025 年总收入 11,579 MSEK；调整后 EBITDA 利润率 23%
        - 2026 年 5 月市值约 $1.76B
        - 中等区间游戏平台参照，产品组合更深
        - 业务组合不同，且包含无法与 Moon Active 私有结构直接可比的资产
      - - Take-Two / Zynga 交易
        - 大型上市移动平台，拥有广泛的经常性预订额基础
        - 2022 年合并隐含约 ~$12.7B EV 和 64% 溢价
        - 展示规模化移动资产的战略控制权价值可能是什么样
        - 这是 2022 年更友好市场里的控制权交易，不是当前交易倍数
      - - Savvy / Scopely 交易
        - 具备实时运营实力的规模化移动游戏发行商
        - 2023 年宣布收购价值 $4.9B
        - 说明 2021 年热潮之后，市场对规模化移动资产的战略需求仍然真实
        - 私有收入披露更薄，主权买方动机可能抬高溢价
      - - AppLovin
        - 作为营销平台公司，2025 年收入 $5.481B
        - 2026 年 5 月市值约 $172.75B
        - 仅适合作为上限提醒：软件 / 广告技术经济性会拿到完全不同的倍数
        - 不是 Moon Active 的干净经营可比，不应锚定公允价值案例
    notes: 可比样本刻意混合上市公司和战略交易，因为没有单一上市同业能干净映射到 Moon Active。请把这些行读作边界标记，而不是一键选择倍数。
