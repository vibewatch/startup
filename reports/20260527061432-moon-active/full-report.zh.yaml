              - CM060
              - CM061
          - type: callout
            title: 平台与政策依赖是真实市场风险
            body: Moon Active 不只是和其他游戏竞争；它依赖 Apple 和 Google 提供计费、归因、上架可见度和合规界面。战利品箱披露规则和儿童保护预期，在平台经济性之上又加了一层外部依赖。
