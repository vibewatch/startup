      - number: '1.2'
        title: 资本基础、里程碑与产品组合扩张
        blocks:
          - type: paragraph
            body: >-
              核心里程碑显示，这家公司在拿到太多可见新股资本之前，就已经把规模做得异常大。留存报道显示，Moon Active 的第一次重大跃迁发生在 2020 年 1 月，当时 Insight Partners 以 $125
              million 买入股份，对应 $1.25 billion 估值。随后在 2021 年 11 月，公司完成一笔 $300 million 老股交易，对应 $5 billion 估值，由 Insight
              领投，Andalusian Private Capital 参投。这组里程碑重要，是因为后续报道把 Moon Active
              描述成成长阶段巨头，但已披露融资大多是老股交易，而不是注入资产负债表的新资金。下一条主线是产品组合扩张。2020 年 12 月，Moon Active 收购 Melsoft，把 Family Island 和
              MyCafe 纳入体系，给买方带来更宽的休闲游戏组合。2022 年 12 月，公司从 Good Job Games 收购 Zen Match 及其伊斯坦布尔团队，显示它愿意买产品和人才，而不是只靠内部孵化。到
              2024 年，Naavik 等分析机构认为这些押注已经把收入拓展到 Coin Master
              之外，尽管旗舰集中度仍然很重。结果是一家公司故事：一个超级爆款、刻意并购，以及管理层如何评估这些资本配置选择时非常有限的正式披露。
