      - number: '8.3'
        title: 仅凭公开资料，正确输出是带入场纪律的区间，而不是点目标
        blocks:
          - type: paragraph
            body: >-
              数据质量不对称时，公开资料能给出的应是企业价值走廊，而不是假装精确的股权价格。悲观情景假设集中度顽固，品类压力延续，投资者只给一家当前股权结构表不可见的公司以困境或成熟游戏倍数。基准情景假设 Moon
              Active 大致守住当前规模，维持 Coin Master 健康，并让 Travel Town、Family Island 和 Zen Match 获得一些信用，但拿不到软件式溢价。乐观情景则要求投资者把
              Moon Active 视为稀缺的战略型移动游戏资产，且其收入基础足够耐久，可以支撑游戏交易倍数上沿。上述情景支持一个宽区间，中心约为 $9 billion
              企业价值；它提供的是有用的入场纪律，而不是虚假的精确价值陈述。在任何未披露的当前价格下，实际承销规则很简单：区间偏低到中段的价格合理，低于 $7 billion 有吸引力，高于约 $12 billion
              就开始要求公开记录尚未给出的证据。
