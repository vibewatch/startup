      - number: '3.3'
        title: 变现、分发权力与切换成本动态
        blocks:
          - type: paragraph
            body: >-
              在下载阶段，这些游戏几乎不在价格上竞争，因为几乎都免费，并提供可选虚拟物品购买。竞争发生在经济系统内部：哪个循环能转化更多付费者、推动更多日常回访，并在不耗尽受众的情况下变现活动紧迫感。Coin Master
              更重押老虎机式期待、突袭、护盾和卡组收集。MONOPOLY GO 用熟悉的棋盘 IP、小时级活动、贴纸相册和协作系统软化类似压力。Candy Crush、Playrix 和 Jam City
              使用更深的关卡库和主题活动，让玩家在多个拼图在位产品之间多栖。Playtika 则用赌场品类、战利品箱和跨游戏奖励，加入最接近的真实替代行为。分发权力现在分成两层。Apple 和 Google
              仍中介发现、计费规则和大部分用户体验（UX），但头部发行商正在通过网页商店和 D2C 系统绕着这种控制搭建能力。Playtika 创纪录的 DTC 收入和 Supercell 的 Hay Day Store
              展示了更强商店外执行是什么样；Moon Active 留存的公开界面还没有显示出可比的外部商店深度。
