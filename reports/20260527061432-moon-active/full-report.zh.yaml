      - number: '7.4'
        title: 缓释、监控与投资逻辑破裂点：可见控制确实存在，但几项核心问题仍需非公开尽调
        blocks:
          - type: paragraph
            body: >-
              Moon Active 不是盲目运营。Coin Master
              之外的产品组合扩张已经落地；多款游戏都有支持入口；公司公开了漏洞报告页面；招聘信息也显示，团队在变现、分析、基础设施和活动优化上持续投入。这些都是真实缓释因素，也解释了为什么剩余风险不应简单归为「回避」。但缓释成熟度大多仍在低到中之间，因为公开材料没有给出能证明控制有效的指标。我没有看到单款游戏
              SLO、可用性历史、欺诈治理结果、按队列的付费用户集中度，或单款游戏现金转化的公开证据。因此，实际承销姿态应保持触发条件驱动。若 Coin Master 的法律或披露体系恶化，若应用商店或 ATT
              政策变化削弱变现或测量的速度快过 Moon Active 的适应速度，若裁员后的整合滑坡扩散到被收购工作室，或若 Coin Master 集中度仍高、次级游戏又无法抵消付费 UA
              压力，投资逻辑就会破裂。因此，缓释表聚焦可监控事件，而不是泛泛的最佳实践；核心尽调问题也刻意直接：证明付费用户集中度，证明单款游戏盈利能力，证明可靠性，并证明 Melsoft 与 Zen Match
              之后的产品组合能继续复利增长，而不需要再来一次重大成本重置。
