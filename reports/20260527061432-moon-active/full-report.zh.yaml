              King、Playrix、Playtika、Jam City、Tripledot 和 Supercell 处在很不同的威胁位置。King 和 Candy Crush 是最清晰的在位者：机制上不如 MONOPOLY
              GO 相似，但在 Microsoft 所有权之下，仍运营着移动端最深的活动和关卡生态之一。Playrix 的 Scapes
              系列以长时段装修留存竞争，而不是突袭动态；但它们争夺同一批成年休闲付费者，并已经知道如何用活动和社交钩子运营超大关卡库。Playtika 重要，是因为它坐在 Coin Master
              反复触及却没有跨过的社交赌场边界上：Slotomania、Bingo Blitz、WSOP、Board Kings、Pirate Kings、Dice Dreams、Animals and Coins
              合在一起，形成 Moon Active 不能忽视的替代集群。Jam City 和 Tripledot 威胁较小，但仍然真实，因为 Cookie Jam 和 Woodoku
              显示了拥有巨大安装或参与基础的耐久拼图分发能力；Supercell 则是在 Hay Day 等较轻休闲品类中也能做多年期系列产品管理和直接商店执行的标杆。
