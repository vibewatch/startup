  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 推荐链从过时估值数据和真实运营规模出发，穿过可比公司分散度和披露缺口，落到观察判断。
    data:
      nodes:
        - id: scale
          label: 真实规模已被证明
          detail: 2024 公开报道指向 >$2B 收入，以及旗舰游戏超过 $6B 累计消费
        - id: stale-mark
          label: 当前价格未被证明
          detail: 本报告留存来源中，最后一次披露的公司估值仍是 2021 年 $5B 老股交易
        - id: concentration
          label: 集中度仍高
          detail: Coin Master 仍占 2024 Q1 商店收入的 73%
        - id: comp-dispersion
          label: 可比范围很宽
          detail: 上市游戏股便宜，但战略控股交易价格仍高得多
        - id: missing-terms
          label: 股权条款隐藏
          detail: 现金、债务、优先权和单款游戏利润率未公开披露
        - id: recommendation
          label: 观察
          detail: 密切跟踪，但等价格和尽调清晰度足够后再上调到买入
      edges:
        - from: scale
          to: stale-mark
          label: 规模不等于价格
        - from: stale-mark
          to: concentration
          label: 旧估值需要重新承销
        - from: concentration
          to: comp-dispersion
          label: 风险拉宽倍数区间
        - from: comp-dispersion
          to: missing-terms
          label: 可比公司分散抬高举证门槛
        - from: missing-terms
          to: recommendation
          label: 不透明挡住买入判断
    claimRefs:
      - CV041
      - CV046
    approximationNotes: 这是决策流图，不是财务模型。它解释为什么在当前公开记录下，公司质量和证券可定价性会分化。
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 仅收入和倍数假设，就能给 Moon Active 拉出很宽的企业价值走廊。
    data:
      items:
        - label: $1.8B 收入 × 3x
          value: 5.4
          description: 成熟游戏公司下界倍数，基于受压的集中度解读
        - label: $1.8B 收入 × 4x
          value: 7.2
          description: 如果公开市场仍持怀疑态度，这是悲观到中性情景
        - label: $2.0B 收入 × 4x
          value: 8
          description: 若当前规模可守住，这是公允价值区间的低端
        - label: $2.0B 收入 × 5x
          value: 10
          description: 如果分散化获得部分信用，这是中上区间
        - label: $2.2B 收入 × 5x
          value: 11
          description: 稳定核心游戏资产经济性的建设性情景
        - label: $2.2B 收入 × 6x
          value: 13.2
          description: 战略稀缺性情景，但仍远低于软件倍数
    claimRefs:
      - CV039
      - CV042
    approximationNotes: 图中使用企业价值敏感性，而不是每股股权价值，因为当前优先级和净现金未披露。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准和乐观企业价值区间刻意拉宽，因为公开记录能证明规模，却难证明条款。
    data:
      items:
        - id: bear
          label: 悲观情景
          low: 5.5
          value: 7
          high: 8
          unit: $B EV
        - id: base
          label: 基准情景
          low: 8
          value: 9
          high: 10
          unit: $B EV
        - id: bull
          label: 乐观情景
          low: 10
          value: 12
          high: 14
          unit: $B EV
    claimRefs:
      - CV043
      - CV045
    approximationNotes: 这些区间是只基于公开材料的企业价值估计，依据收入代理和可比估值走廊，而不是基于股权结构表的 DCF 或可比交易样本册。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Moon Active 在规模证明上得分最高，在披露、集中度和可定价性上较低。
    data:
      items:
        - id: market
          label: 市场背景
          value: Constructive
          description: 2025 年移动游戏 IAP 恢复增长，但用户获取竞争仍激烈
          tone: neutral
        - id: proof
          label: 规模证明
          value: Strong
          description: 公开来源支持 >$2B 收入和 $6B+ 旗舰游戏消费里程碑
          tone: positive
        - id: diversification
          label: 产品组合广度
          value: Moderate
          description: Travel Town、Family Island 和 Zen Match 有分量，但 Coin Master 仍主导已报道商店收入
          tone: neutral
        - id: economics
          label: 单位经济性
          value: Unverified
          description: 现金生成看起来可信，但单款游戏利润率和 DTC 占比仍是私有信息
          tone: negative
        - id: risk
          label: 风险画像
          value: High
          description: 集中度、品类压力和隐藏优先级让下行空间很宽
          tone: negative
        - id: valuation
          label: 估值清晰度
          value: Low
          description: 最后披露估值已经过时，当前股权条款未公开
          tone: negative
        - id: evidence
          label: 证据质量
          value: Medium
          description: 规模和可比公司证据充足，但只有私下材料才能提供精确度
          tone: neutral
    claimRefs:
      - CV041
      - CV044
    approximationNotes: KPI 图表总结本章加权逻辑，并非数学优化后的评分。
