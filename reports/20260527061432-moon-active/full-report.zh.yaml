  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与玩家流程
        blocks:
          - type: paragraph
            body: >-
              Moon Active 卖的是可重复的移动娱乐循环，而不是一个泛化休闲应用。Coin Master 仍是旗舰社交赌场建造体验：玩家旋转、突袭、攻击、建村、集卡、组队，并在特殊活动之间循环。Travel Town
              服务另一种玩家任务，围绕合成物品、完成村民任务和重建城镇搭建。Zen Match 瞄准更平静的日常习惯循环，用瓷砖匹配、房间装饰、植物照料和每日谜题驱动。公开交易报道进一步扩展了图景：Family Island
              和 MyCafe 通过 Moon Active 收购 Melsoft 进入组合，Zen Match 后来通过 Good Job Games 交易加入。更新的公开上线痕迹也重要。Coin Master: Board
              Adventure 把旗舰 IP 延伸到骰子和棋盘形式；Hole Stars 显示 Moon Active 正在测试或上线另一个休闲拼图循环。按玩家流程看，Moon Active
              已经不只是从单一旋转机制变现。它在社交突袭、合成、匹配和轻量动作拼图等品类里运营多个习惯循环；这比单游戏工作室能提供更强的产品平台信号。
