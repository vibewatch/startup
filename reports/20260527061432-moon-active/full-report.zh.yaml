      - number: '7.3'
        title: 人员、整合与财务模型风险：Moon Active 更大、更宽，但看起来仍然偏重 Coin Master 且披露很轻
        blocks:
          - type: paragraph
            body: >-
              下一层风险是执行加模型质量。Moon Active 2026 年 1 月裁员之所以重要，正是因为公司当时仍称自己在增长。CTech 和 Globes 都把裁员规模放在约 110 人，或员工的 5%；Globes
              称裁员影响了与 Melsoft
              收购相关的立陶宛业务。这让交易后整合、士气和区域协同成为活跃风险，而不只是历史脚注。地缘政治叠加层也真实存在：公开公司页面和招聘帖显示，主要运营暴露在以色列、基辅、华沙、布加勒斯特、伦敦、立陶宛，以及与白俄罗斯有关联的
              Melsoft 遗留结构。财务侧，公开证据仍同时说明两件事。第一，Moon Active 显然规模很大、盈利，而且不明显依赖新的新股融资：CTech 称公司真正募集过的新股资本只有约 $10
              million，后续轮次都是老股出售。第二，经济性在投资者最需要证明的地方仍然不透明。Naavik 仍估计 2024 年 Q1 商店收入的 73% 来自 Coin
              Master，公开来源不披露鲸鱼集中度或分游戏利润率，可见估值锚仍是 2021 年私人 $5 billion 老股轮。这种组合让 Moon Active 在规模上看起来耐久，在经承销的盈利质量上却脆弱。
