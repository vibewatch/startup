      - number: '5.2'
        title: 长线运营架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              招聘证据以少见的细节暴露了 Moon Active 的运营脊柱。后端和 DevOps 岗位描述了
              Node.js、Redis、Aurora、Kubernetes、AWS、GCP、Cloudflare、GKE、GitHub Actions、ArgoCD、可观测性、事故管理和灾难恢复；Coin Master
              基础设施承载约每秒 100 thousand 请求，峰值超过 200 thousand。全栈岗位补上了内部层：面向运营、变现、CRM、分析师、BI 和 AI
              辅助流程的应用。较新的变现和创意岗位显示公司实际如何运行在线运营游戏。变现经理规划日常活动和促销，A/B
              测试内容，并与经济学、分析、设计和技术运营团队协作，以提高留存和客户终身价值。营销创意制作人把洞察转成视频和静态广告创意，跟踪 IPM、CTR、ROAS、留存等
              KPI，并根据竞品信号迭代。合在一起，这看起来像一台有能力承载产品组合的长线运营机器，而不是轻量移动工作室。架构优势不只是客户端循环；而是用于经济调参、内容节奏、创意测试、分析和发布管理的共享系统，并且可以应用到多款游戏。
