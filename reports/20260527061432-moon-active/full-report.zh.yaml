      - number: '2.2'
        title: 用户、付费者与应用商店中介的消费
        blocks:
          - type: paragraph
            body: >-
              Moon Active 所在市场的购买者、用户和付费者结构几乎完全由消费者驱动，但并不均质。Coin Master
              的受众起点，是寻找短时娱乐的广义休闲移动用户；但其留存和变现循环依赖社交竞争、收集压力和反复参与活动。公开人口结构代理数据说明了为什么这点重要。移动游戏的性别接近平衡，女性更可能是只玩移动端的玩家，亚太贡献最大的玩家基础和收入池。同时，变现高度集中：公开移动基准显示，一半玩家完全不付费，只有一小撮高消费少数贡献了不成比例的消费。对
              Moon Active 来说，最相关的分群不是企业预算所有权，而是从免费安装用户到习惯性付费者的路径。应用商店位于这条路径中间。Apple 和 Google
              控制上架可见度、支付轨道、权益处理，以及归因栈的大部分。Apple 的 ATT 规则限制跨应用追踪，Google Play billing 则定义 Android 上数字商品如何销售。实际情况是，Moon
              Active 向个人消费者销售，把其中少数转化为付费者，并依赖平台基础设施收款和优化这些消费。
