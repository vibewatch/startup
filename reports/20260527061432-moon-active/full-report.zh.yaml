      - - 核心产品耐久性
        - Coin Master 多年保持大体量，并在 2026 年 3 月再次回到畅销榜前列
        - Coin Master 仍贡献 Q1 2024 应用商店收入的 73%，因此耐久性和集中度无法切开看
        - 集中度下降且单款游戏利润率得到验证，会显著增强投资逻辑
      - - 多元化
        - Melsoft 和 Zen Match 表明，Moon Active 买到的是实际资产和团队，不只是期权
        - 公开证据仍未显示新组合的单款游戏贡献利润率
        - 按游戏划分的月收入和 EBITDA 能说明多元化是否提供真实经济保护
      - - 公开可比逻辑
        - 游戏上市可比公司和战略交易支撑一个很宽但仍有意义的估值走廊
        - 同一可比样本极度分散；若忽略商业模式差异，很容易误用
        - 加入当前私募估值标记的投行级可比样本，会收窄估值走廊
      - - 资本充足性
        - 老股交易较多的历史和创纪录收入表明，Moon Active 大概率不是为了基本生存而融资
        - 没有公开现金、债务或优先权披露，意味着看似健康的业务仍可能是糟糕的股权进入点
        - 给出买入建议前，必须看到当前资产负债表和分配瀑布披露
      - - 当前反向逻辑
        - 业务可能很好，但仅靠公开证据，证券本身仍无法定价
        - 这个缺口正是本章停在观察而非买入的原因
        - 只有估值条款变得可见，反向逻辑才会弱化
    notes: 本表把公司质量和证券可定价性分开。反向逻辑不是 Moon Active 很弱，而是当前进入价格和优先级仍隐藏在黑箱里。
