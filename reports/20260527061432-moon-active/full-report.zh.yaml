        title: 单位经济代理值、商店费用与获客强度
        blocks:
          - type: paragraph
            body: >-
              Moon Active 的公开单位经济更像渠道和留存问题，而不是标价问题。Apple 降低后的 15% 佣金只适用于收益低于 $1 million 的情况，Moon Active 显然超过这个门槛；Google
              Play 的 2026
              年规则则称，无论采用哪种计费方式都会收取服务费，并且仍会对新老安装收取有意义的抽成。因此，在讨论人员或内容成本之前，平台经济性已经先从玩家消费里削掉很大一块。下一个主要杠杆是获客。公开游戏公司文件和基准报告显示，这一点可以有多痛：Playtika
              将销售和营销主要定义为广告与获客，披露 2025 年广告费用为 $760.8 million，并称仅 2024 年媒体费用就新增超过 $112 million 支出。FoxData 援引 Adjust
              称，全球游戏 CPI 同比上升 30%，北美 CPM 达到 $15.98，赌场 CPI 升至 $1.50，成熟游戏往往把 20% 到 40% 的收入重新投回 UA。Deconstructor of Fun
              补上反向角度：随着复制者挤入抢金币赛道，品类 RPD 正在下滑。Moon Active 可能仍然高效，但公开证据只能支持压力方向，不能证明公司特定的 CAC、回本周期或队列 LTV。
