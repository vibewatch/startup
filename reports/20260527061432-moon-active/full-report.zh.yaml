      - number: '2.4'
        title: 矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              分析 Moon Active 市场时，最大的陷阱是假装一个数字就能解决市场问题。并不能。留存的最窄估计集中在 2026 年社交赌场约 USD 9-10
              billion，但更宽的休闲游戏内购（IAP）池和整体移动游戏背景要大得多。这些数字并不互斥；它们只是边界选择不同。因此，任何份额计算都必须明说采用哪种视角。证据缺口同样重大。公开数据没有揭示 Coin
              Master 当前付费转化率、鲸鱼与更广泛付费群体之间的拆分，也没有揭示商店费用、税费和任何商店外支付之后，Moon Active
              留下的玩家总消费份额。监管证据也混杂：政府倾向于行业主导保护，但学术审查认为合规薄弱、执行不足。因此，正确的尽调姿态不是否定市场，而是把 Moon Active
              视为一家运营在庞大、模糊且政策敏感市场中的公司；在这里，运营执行比口号式总可用市场（TAM）更重要。
