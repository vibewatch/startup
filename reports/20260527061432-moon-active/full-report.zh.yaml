chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、规模与商业模式
        blocks:
          - type: paragraph
            body: >-
              最适合把 Moon Active 理解成一家以色列私人移动游戏运营商，公司的身份至今仍由 Coin Master
              主导。官方表述有意宽泛：公司称自己是全球增长最快的移动游戏公司之一，并称其娱乐产品拥有数百万玩家。独立来源补上了更清晰的边界。多个留存的公司画像显示总部位于特拉维夫，并将 Samuel Albin 识别为创始人兼
              CEO；二级报道也持续把 Coin Master 视作公司的定义性产品，以及后续扩张背后的经济引擎。商业模式不是付费买断游戏，而是围绕内购、成长循环和长线运营搭建的免费移动游戏。Moon Active
              的特别之处不只是单款游戏成功，而是规模高度集中：基于 Sensor Tower 的报道显示，截至 2024 年 8 月，单是 Coin Master 的玩家生命周期消费就突破 $6 billion，自 2020
              年以来年均约 $1.2 billion，并且在 2024 年仍位居全球收入最高的移动游戏之列。这个规模解释了为什么 Moon Active
              看起来像成熟现金生成器，即便它披露的资本和治理细节远少于经济产出相当的多数公司。
