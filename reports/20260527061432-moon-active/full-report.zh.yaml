  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 品类
      - 纳入的支出
      - 排除的支出
      - 买方 / 用户 / 付费方
      - 与 Moon Active 的相关性
    rows:
      - - 核心经营视角：带社交赌场邻近机制的休闲移动娱乐
        - F2P 移动游戏内与旋转、活动、加成道具、卡牌和进度绑定的应用内购买
        - 真金赌博流水、主机 / PC 买断销售、无关应用订阅收入
        - 个人玩家是用户，通常也是付费方；平台居中撮合交易
        - 最适合 Coin Master，因为它匹配实际产品和变现循环
      - - 狭义视角：社交赌场 / 邻近老虎机的移动支出
        - 免费老虎机、宾果、扑克、桌面游戏以及类似虚拟货币赌场玩法
        - 真金下注和受监管博彩收入
        - 成人娱乐寻求者；付费者只占用户的一小部分
        - 用于把 Coin Master 放进行为最相近的支出池中判断
      - - 更宽视角：休闲游戏 IAP 市场
        - 益智、生活方式、模拟、混合休闲及相关应用内购买支出
        - 游戏支出之外的广告收入和非游戏订阅
        - 上手摩擦低的大众休闲玩家
        - 有用，因为 Coin Master 争夺的是休闲注意力和应用商店支出，而不只是赌场支出
      - - 更大背景：整体移动游戏市场
        - 应用商店及相关游戏变现渠道中的全部移动游戏收入
        - 非游戏应用支出、主机和 PC 游戏收入
        - 全球智能手机用户和跨平台玩家
        - 仅作背景；太宽，不能作为核心承销 TAM
      - - 明确排除：真金赌博
        - 核心投资逻辑不纳入
        - 现金下注、体育博彩和受监管赌场净博彩收入
        - 赌客和受监管博彩运营商
        - Coin Master 的列表说明它不是真金赌博，因此应继续留在 Moon Active 核心边界之外
    notes: 本表把行为相近的支出与只是相邻的支出分开，这样后续市场份额计算才会有边界意识，而不是被口号带跑。
