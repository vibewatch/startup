      - number: '7.2'
        title: 运营与依赖风险：全天候长线运营运行在 Moon Active 不能完全控制的云、商店、支持和广告平台之上
        blocks:
          - type: paragraph
            body: >-
              从运营看，Moon Active 比单游戏工作室成熟得多，但这种成熟度也放大了依赖风险。招聘页面显示全天候后端要求、约每秒 100 thousand 请求的 24/7 流量，以及一条穿过
              AWS、GCP、Cloudflare、GKE、GitHub、ArgoCD、可观测性、事故管理、灾难恢复和业务连续性的生产链。这是真实缓释因素，因为它意味着成熟技术运营；它也是真实依赖，因为宕机、成本冲击或供应商政策变化都可能比产品团队反应更快地打击长线服务质量。商业侧也出现同样模式。Coin
              Master 官方帮助页面为连接错误和购买失败设置了常设流程；Moon Active 的 UA 和创意岗位则明确依赖 Facebook、Instagram、视频网络、归因经验、DSP
              和持续广告创意迭代。Apple ATT 和 Apple SDK 规则意味着，测量与再营销仍受结构性限制；AppsFlyer 的 2026
              年游戏数据显示，创意产出和付费竞争都在上升。因此，我把运营和伙伴风险排在法律风险之下：Moon Active
              有真实规模和工具，但服务链的大部分仍依赖外部商店、广告生态和云提供商，它们可以在没有预警的情况下压缩利润率或削弱增长。
