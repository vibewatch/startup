        - 全球三消大众市场
        - 深厚关卡 / 活动机器和品牌熟悉度
        - 与 Coin Master 的机制重叠低于 MONOPOLY GO 或 Playtika
      - - Playrix / Gardenscapes + Homescapes
        - 既有相邻玩家
        - 'Playrix 在 2024 年休闲发行商收入中排名 #2'
        - 成年休闲解谜付费者
        - 装修 meta、庞大内容库、频繁活动
        - 竞争点更多是留存时间，而不是掠夺 / 社交博彩邻近性
      - - Playtika / Slotomania + Dice Dreams 集群
        - 替代集群
        - 2026 年 Q1 收入 $744.7M；DTC 收入 $291.8M
        - 社交博彩和棋盘 / 金币掠夺付费者
        - 博彩深度、跨游戏奖励、DTC 规模、多款相邻游戏
        - 包装不如 Coin Master 或 MONOPOLY GO 适合家庭向
      - - Jam City / Cookie Jam
        - 次级既有玩家
        - 官网称其系列累计数十亿安装；Cookie Jam 有 11,000 个关卡
        - 三消休闲玩家
        - 每周新关卡和限时活动
        - 资产负债表和产品组合实力弱于一线对手
      - - Tripledot / Woodoku
        - 相邻 / 潜在进入者
        - 产品组合 DAU 25M+
        - 广泛解谜受众，广告 + IAP 变现
        - 大规模解谜触达和强变现数据尾迹
        - 当前与 Coin Master 的机制重叠低
      - - Supercell / Hay Day
        - 潜在进入者基准
        - 世界级多系列移动运营商，拥有专属 Hay Day Store
        - 社区优先的休闲玩家
        - Neighborhoods、交易循环、多年活动运营、商店执行
        - 当前与金币掠夺机制直接重叠低
    notes: 覆盖并不穷尽：截至 2026-05-27，这张表聚焦已留存来源中证据信号最高的直接、相邻、替代和潜在进入竞争者。
