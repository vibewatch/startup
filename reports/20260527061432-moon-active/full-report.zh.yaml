            body: >-
              公开牵引力栈足以证明规模，却不足以证明盈利质量。Globes 称 Moon Active 2024 年收入超过 $2 billion，并把估计 $2 billion 年收入归因于 Coin Master
              单款。四份独立的 2024 年报告也收敛到同一结论：Coin Master 生命周期玩家消费已突破 $6 billion，自 2020 年以来年均约 $1.2 billion，下载量 356
              million，美国贡献了不成比例的收入和安装量。这是一个强大的收入引擎。同时，多元化故事真实但不完整。Naavik 称 Moon Active 在 2024 年 Q1 产生 $355 million
              商店收入，其中 73% 仍来自 Coin Master，意味着组合其余部分约贡献 $97 million。Travel Town 和 Family Island
              显然已经成为有意义的现金贡献者，过去收购带来的也是真实收入基础，而不只是人才。不过，利润率路径比收入线索显示的更脆弱。庞大员工基础、长线运营节奏、内容生产和平台通行费都压在收入栈之下；GameRefinery
              2026 年 3 月的榜单反弹也显示，Coin Master 仍在作为公司经济核心被积极防守。
