        blocks:
          - type: paragraph
            body: >-
              公开证据指向一家公司：它很可能不需要传统风险融资来维持生存，但这不等于资产负债表已经被承销。自筹资金能力最强的支撑来自历史：Insight 2020 年 $125 million
              交易买入的是现有股份，没有注入新钱；2021 年 $300 million 轮也同样是老股。后续报道也把 Moon Active
              描述为在极大收入规模下只募集过很少新股资本。这种组合意味着，业务很可能靠内部生成资金支持运营，并且更多把资本事件用于股东流动性和机会型扩张，而不是救命融资。不过，同一段历史也显示，公司愿意把现金重新部署到
              Melsoft、Zen Match 等收购上，而不是简单囤积。公开层面，我们仍不知道当前现金余额、债务负担、烧钱速度、现金跑道、递延收入、营运资本状况或分游戏利润率。2025
              年裁员和跨职能精简之所以重要，是因为它说明即便收入创新高，管理层仍在调整成本结构。因此，财务结论是：规模和可能现金生成偏正面，利润率耐久性需要谨慎，资产负债表不透明则构成阻塞。
