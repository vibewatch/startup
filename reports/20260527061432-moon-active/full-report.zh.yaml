            title: 边界纪律比单个总可用市场（TAM）标题更重要
            body: 取决于选择哪条边界，Moon Active 可以看起来像占主导的小众社交赌场资产、一个中等份额的休闲游戏资产，或整个移动游戏经济中的一小块。投资错误不在于选了“错误”的数字，而在于完全没有说明边界。
            calloutType: insight
            claimRefs:
