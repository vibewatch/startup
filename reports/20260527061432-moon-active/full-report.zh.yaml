  - id: TP004
    title: 护城河耐久性 / 竞争风险台账
    columns:
      - 护城河或风险因素
      - 方向
      - 严重性
      - 当前证据
      - 竞争含义
      - 尽调追问
    rows:
      - - Coin Master 的转盘 - 突袭 - 建造玩法公式
        - 优势
        - 高
        - 官方列表页仍显示一套带明显老虎机感的 PvP 循环，且已达到全球休闲游戏规模
        - 在休闲手游里，仍是少数真正跑出规模的直接玩法公式之一
        - 要求按活动类型提供队列留存和付费转化数据
      - - MONOPOLY GO IP 与规模
        - 风险
        - 高
        - 2024 年收入 $1.344B、下载量 150M+，定位覆盖广泛桌游人群
        - Scopely 可以凭更广的品牌吸引力，继续竞价争夺同一批付费钱包
        - 按地域跟踪 Coin Master 与 MONOPOLY GO 的榜单位置、付费用户重合和 UA 份额
      - - Microsoft 支持的 Candy Crush
        - 风险
        - 中高
        - Candy Crush 在 Team Xbox 旗下仍是巨型在位者
        - 相比独立工作室，King 更能长期消化增长放缓或利润率压力
        - 要求提供 Microsoft 针对 King 的交叉推广或 UA 支持决策证据
      - - Playtika 社交赌场替代品集群
        - 风险
        - 高
        - Slotomania + Dice Dreams + Board Kings + Pirate Kings，加上季度 DTC 收入 $291.8M
        - 高消费用户可能转向数据和运营工具更成熟的替代生态
        - 将 Moon Active 的 VIP、奖励和店外能力与 Playtika 对标
      - - 可见 DTC / 商店缺口
        - 风险
        - 中高
        - Supercell 和 Playtika 有公开商店或 DTC 证据；保留的 Moon Active 页面没有显示
        - Moon Active 可能仍更暴露于应用商店抽成和支付体验
        - 追问 Coin Master 网店收入占比、路线图和复访指标
      - - 硬切换成本低
        - 风险
        - 高
        - 免费安装和社交分享，与强烈多栖使用激励并存
        - Moon Active 必须反复赢得注意力，不能依赖锁定效应
        - 要求提供 Coin Master、MONOPOLY GO 与社交赌场替代品之间的重合队列
      - - Board Adventure 与更广产品组合
        - 优势
        - 中
        - Board Adventure 的榜单牵引力，加上 Travel Town 和 Zen Match 进入收入榜
        - 不只靠老旗舰，Moon Active 还有一定多元化和跨品类学习空间
        - 要求提供各非 Coin Master 游戏的收入组合和增速
      - - 设计商品化压力
        - 风险
        - 高
        - 更多挑战者复制活动层和社交系统后，每下载收入在下滑
        - 如果没有持续 live-ops 创新，仅靠设计领先很难长期稀缺
        - 每季度跟踪功能模仿者、RPD 趋势以及相对同业的活动 ROI
      - - Supercell / Tripledot 入场可选性
        - 风险
        - 中
        - 即便没有直接的 coin-looter 旗舰，两者已有受众规模或商店运营成熟度
        - 未来威胁可能来自邻近品类、组合延伸或收购，而不是 clean-room 克隆
        - 监控与社交或棋盘经济相关的收购、招聘和新游戏软启动
    notes: 严重性是基于保留证据的分析师判断；台账同时列入护城河支撑和压力点，因为 Moon Active 的持久地位既取决于 Coin Master 的强度，也取决于同业多快收敛到相似经济模型。
