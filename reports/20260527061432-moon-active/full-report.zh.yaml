  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 分群组合与公开采用
        blocks:
          - type: paragraph
            body: >
              Moon Active 不像是一个 B2B 或渠道驱动的客户故事。公开客户界面是消费者移动玩家：他们发现一款免费应用，进入习惯循环，随后要么继续免费玩，要么偶尔消费，要么在游戏内成为重复付费者。Coin
              Master 仍是旗舰客户基础：官方 iOS 页面显示 1.3 million 条评分，AppBrain 仍追踪到约 340 million 生命周期 Android
              下载量，并在多个欧洲市场保持畅销可见度。Travel Town 和 Zen Match 不是装饰性补充。它们的官方页面和 AppBrain
              画像显示，各自拥有独立且已有规模的社区，有自己的评论量、品类承诺和市场足迹。同样重要的是，分群组合已经不再单一。Coin Master 服务社交突袭、卡牌收集和复仇导向玩家；Travel Town
              服务合成和建造玩家；Zen Match 服务低强度日常拼图玩家。Moon Active 自己的网站，加上 Apple 和 Google
              的开发者界面，现在把公司框定为一个服务多个相邻休闲队列的产品组合，而不是单游戏工作室。
