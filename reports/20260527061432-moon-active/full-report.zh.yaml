    rows:
      - - 悲观
        - 25%
        - $1.8B-$2.0B 收入底线
        - 集中型经济结构下，成熟 / 承压游戏业务约 ~3x-4x 倍数
        - ~$5.5B-$8.0B
        - Coin Master 仍占主导，品类压力持续，投资者在披露改善前拒绝支付溢价
      - - 基准
        - 50%
        - ~$2.0B-$2.2B 收入锚
        - 规模化游戏业务约 ~4x-4.5x 倍数，并给予部分多元化认可
        - ~$8.0B-$10.0B
        - Moon Active 大致守住规模，新游戏仍有意义，投资者把它按稀缺但不透明的游戏资产测算
      - - 乐观
        - 25%
        - ~$2.2B-$2.4B 收入，加上更强的产品组合
        - 战略稀缺游戏资产约 ~5x-6x 倍数
        - ~$10.0B-$14.0B
        - Travel Town、Family Island 和其他游戏降低依赖，同时买方愿为规模和现金生成付费
    notes: 这些 EV 区间来自公开收入代理指标和可比倍数区间。它们不能替代考虑股权结构表的普通股模型。
