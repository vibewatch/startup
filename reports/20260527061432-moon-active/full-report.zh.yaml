  - id: FR003
    title: 依赖地图
    type: dag
    layout: wide
    summary: Moon Active 的在线服务游戏引擎建在外部商店、广告渠道、测量供应商、云基础设施和被收购区域团队之上。
    data:
      nodes:
        - id: d1
          label: Apple App Store
          detail: iOS 的分发、隐私和审核闸口。
        - id: d2
          label: Google Play
          detail: Android 的分发、计费和变现闸口。
        - id: d3
          label: Meta / 社交 / 视频渠道
          detail: 付费用户获取和创意分发。
        - id: d4
          label: 归因和广告技术栈
          detail: DSP、分析和信号解读。
        - id: d5
          label: AWS / GCP / Cloudflare / GKE
          detail: 云、网络和部署骨架。
        - id: d6
          label: 被收购工作室和区域团队
          detail: Melsoft、Zen Match 和多国执行。
        - id: d7
          label: Moon Active LiveOps 核心
          detail: 变现、客服、工程和发布节奏。
        - id: d8
          label: 收入质量和留存
          detail: 投资人真正承销的是组合结果。
      edges:
