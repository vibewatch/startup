  topStrengths:
    - Coin Master 仍是真正的全球游戏 IP，多年稳居畅销榜，生命周期消费超过 $6B；公开证据显示 Moon Active 2024 年收入超过 $2B。
    - Moon Active 可见新股融资有限，却似乎已做到超常规模，说明内部现金生成强，收购更像战略选择而非续命融资。
    - 产品组合多元化已足够重要：Travel Town、Family Island 和 Zen Match 说明 Moon Active 能在最初旗舰之外，通过收购或自研做出有意义的相邻休闲游戏收入。
  topRisks:
    - Coin Master 集中度仍高；Naavik 估计 2024 年 Q1 应用商店收入有 73% 来自这款旗舰游戏。
    - 股权结构、优先股堆叠、当前现金状况和经审计的 2025-2026 年利润率均未公开，股权判断主要靠推断而不是一手文件支撑。
    - 平台抽成、上升的获客成本，以及休闲博彩式机制面临的监管压力，会在变现效率走弱时放大下行。
  unresolvedGaps:
