- id: unit-economics-and-distribution
  title: Unit economics proxies, store fees, and user-acquisition intensity
  body: 'Moon Active''s public unit economics are a channel-and-retention problem more than a list-price problem. Apple''s reduced 15% commission only applies below $1 million of proceeds, which Moon Active obviously exceeds, while Google Play''s 2026 rules say service fees apply regardless of billing method and still charge meaningful take rates on both new and existing installs. So even before one asks about staff or content costs, platform economics are already a large haircut on player spend. The next major lever is user acquisition. Public gaming filings and benchmark reports show how punishing that can be: Playtika defines sales and marketing largely as advertising and user acquisition, disclosed $760.8 million of advertising expense in 2025, and said 2024 media expense alone added more than $112 million of spend. FoxData, citing Adjust, says global gaming CPI rose 30% year over year, North America CPM reached $15.98, casino CPI climbed to $1.50, and mature games often recycle 20%
    to 40% of revenue back into UA. Deconstructor of Fun adds the adverse angle: category RPD is slipping as copycats crowd the coin-looter field. Moon Active may still be efficient, but public evidence supports only the direction of pressure, not its company-specific CAC, payback, or cohort LTV.'
