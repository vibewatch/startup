- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Coin Master annual player-spend proxy
    - ~$1.2B annually since 2020
    - medium
    - Sets the flagship revenue floor for any Moon Active underwriting.
    - Bridge gross player spend to net recognized revenue and free cash flow by year.
  - - Coin Master lifetime player spending
    - '>$6B by 2024'
    - medium
    - Shows that Moon Active already runs a very large digital-spend machine.
    - Split lifetime spend by geography, platform, and payer cohort.
  - - Portfolio concentration proxy
    - 73% of Q1 2024 store revenue from Coin Master; ~27% from other titles
    - medium
    - Concentration defines revenue quality and hit dependence.
    - Provide title-level monthly bookings and EBITDA contribution.
  - - Download / geography concentration
    - 356M downloads; US = 39% of revenue and 18% of installs
    - medium
    - Shows scale plus concentration in high-value markets that influence UA and margin.
    - Provide payer concentration by top country and top platform.
  - - Global gaming CPI benchmark
    - $0.56 blended CPI; North America CPM $15.98
    - medium
    - Frames acquisition pressure even for scaled publishers.
    - Share Moon Active blended CPI and CPM by region for 2025-26.
  - - Casino CPI / paid-organic benchmark
    - CPI rose from $1.17 to $1.50; paid-to-organic ratio 11.05:1
    - medium
    - Shows how expensive coin-looter and casino-adjacent acquisition can become.
    - Share Coin Master and Travel Town paid-organic mix and D30 payback.
  - - UA reinvestment guideline
    - 20%-40% of monthly revenue for mature games; target LTV/CPI >=1.5x
    - medium
    - Tests whether spend compounds margin or simply buys replacement installs.
    - Provide UA spend as % of revenue and cohort LTV/CPI by title.
  - - Peer DTC mix benchmark
    - ~39.2% of Playtika Q1 2026 revenue came from DTC channels
    - medium
    - Illustrates how off-store collection can change gross-to-net economics.
    - Disclose Moon Active DTC share, payment processing cost, and webstore adoption.
  - - Public headcount proxy
    - ~2,500 employees with selective 2025 layoffs
    - medium
    - People cost is likely one of the largest opex lines behind UA.
    - Provide loaded payroll, contractor spend, and opex by function.
  - - Moon Active CAC / payback / LTV
    - 'null'
    - low
    - Without these, public revenue scale cannot be translated into durable unit economics.
    - Provide CAC, payback, payer conversion, ARPPU, and cohort retention by title.
  notes: The table mixes direct Moon Active public facts with peer and market benchmarks that frame what good or bad economics could look like. Null means the company has not publicly disclosed the metric in retained sources.
