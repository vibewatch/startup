  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: moon-active-balance-sheet
    missingEvidence: Current cash, short-term investments, debt, covenant package, monthly burn, and runway model.
    whyItMatters: Without direct liquidity data, the chapter can only infer capital adequacy from revenue scale and financing history rather than verify it.
    diligencePath: Request the last eight quarters of cash, debt, and free-cash-flow reporting plus a board-approved 24-month operating plan.
    relatedQuestionRefs:
    - QI018
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-to-net-revenue-quality
    missingEvidence: Gross bookings, store-fee deductions, payment processing costs, refunds, taxes, and recognized-revenue bridge by title and channel.
    whyItMatters: Moon Active's public topline is large, but the quality of that topline depends on how much player spend survives fees and recognition timing.
    diligencePath: Request a monthly gross-to-net bridge for Coin Master, Travel Town, and the rest of the portfolio, including DTC if any exists.
    relatedQuestionRefs:
    - QI004
    - QI009
    - QI010
    - QI023
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: moon-active-cohort-economics
    missingEvidence: CAC, payback, payer conversion, ARPPU, whale concentration, and retention curves by title.
    whyItMatters: UA benchmarks and peer filings prove the cost pressure exists, but only Moon Active's own cohorts can show whether scale is compounding or degrading.
    diligencePath: Request cohort dashboards for Coin Master and Travel Town showing CPI, LTV, D30/D90 payback, payer conversion, and top-spender concentration.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI016
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: title-level-portfolio-profitability
    missingEvidence: Title-level revenue, gross margin, EBITDA, and acquisition payback for Travel Town, Family Island, Zen Match, and other non-Coin Master bets.
    whyItMatters: Moon Active clearly diversified revenue, but public sources still do not reveal whether the acquired portfolio genuinely de-risks earnings or only adds topline.
    diligencePath: Request title-level P&Ls and post-acquisition integration scorecards for each major acquired or internally scaled title.
    relatedQuestionRefs:
    - QI003
    - QI021
    - QI022
    relatedTableRefs:
    - TI001
