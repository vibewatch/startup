tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality reading
  - Diligence ask
  rows:
  - - Coin Master virtual-item sales
    - Free-to-play IAP around spins, raids, cards, expeditions, and village progression
    - Virtual items / currency packs
    - Official App Store page confirms free download plus in-app purchases with real-money virtual items
    - Large gross spend is proven, but realized net revenue depends on store fees, taxes, refunds, and recognition timing
    - Request monthly gross bookings, net recognized revenue, and payer mix for Coin Master.
  - - Travel Town virtual-item sales
    - Free-to-play IAP around merge progression and event play
    - Virtual items / randomized item offers
    - Official App Store page confirms free download plus in-app purchases and randomized items
    - Supports second-franchise monetization, but title-level profitability is undisclosed
    - Request monthly bookings, payer conversion, and event-offer mix for Travel Town.
  - - Acquired casual-title revenue base
    - M&A adds already-monetized titles rather than only teams
    - Historical title revenue
    - GamesBeat said Melsoft was running above $160M annual revenue when acquired; Latham identified Family Island and MyCafe as flagship titles
    - Useful proof that diversification was bought with real revenue, not just optionality
    - Reconcile acquired-title revenue at close versus current contribution and margin.
  - - Zen Match contribution
    - Puzzle-title acquisition expands portfolio beyond Coin Master mechanics
    - Historical asset revenue
    - PocketGamer estimated the asset at ~$100M revenue and a $100M-$150M deal value
    - Shows willingness to buy revenue, but estimate quality is lower than for Coin Master
    - Request current Zen Match revenue, gross margin, and user-acquisition spend.
  - - Advertising / offer monetization
    - Peer benchmark for ad inventory, offer walls, or rewarded placements in F2P games
    - Impressions / offers
    - Playtika discloses ad revenue exists and is recognized net, but Moon Active has not publicly broken out ad revenue
    - Advertising could diversify revenue, but there is no public Moon Active split to underwrite it
    - Request ad revenue share by title and whether Moon Active acts as principal or agent.
  - - DTC / webstore sales
    - Off-store or webstore collection can mitigate app-store fees
    - Web purchase volume
    - Peer Playtika discloses a large DTC business, but Moon Active does not disclose any DTC line publicly
    - Potential upside exists, but there is no public proof Moon Active captures it at material scale
    - Request DTC share of gross bookings and gross-to-net take-rate by channel.
  notes: Rows separate directly evidenced Moon Active streams from peer-accounting benchmarks that frame likely but undisclosed revenue paths. Public sources prove large IAP revenue, but not title-level gross margin or DTC mix.
