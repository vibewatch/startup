- id: TI002
  title: Pricing / monetization table
  columns:
  - Title or channel
  - Public list price / access signal
  - List-versus-realized pricing reading
  - Key unknown
  - Source
  rows:
  - - Coin Master
    - Free download; in-app purchases; virtual items purchasable with real money
    - Confirms free-to-play monetization but not the in-game price ladder or realized ARPPU
    - Whale pricing, offer depth, refund rate, and virtual-item mix are private
    - App Store listing
  - - Travel Town
    - Free download; in-app purchases; randomized items disclosed
    - Confirms IAP and chance-based offer mechanics but not actual pack economics
    - Price ladder, paid-conversion rate, and ad-versus-IAP mix are private
    - App Store listing
  - - Apple App Store
    - 15% rate exists only for developers under $1M of proceeds
    - Relevant as a floor for small developers, not for Moon Active's scale
    - Moon Active's actual Apple effective take rate and any regional alternative-term usage are private
    - Apple Developer
  - - Google Play
    - 2026 service-fee model charges all transactions; non-recurring SKUs are 20% on new installs and 25% on existing installs before program discounts and billing-fee specifics
    - Shows platform take remains economically meaningful even under expanded billing choice
    - Moon Active's effective Android fee by geography, billing path, and program status is private
    - Google Play Console Help
  - - DTC benchmark
    - Playtika disclosed $291.8M of Q1 2026 DTC revenue
    - Peer evidence shows webstore scale can be material in social-casino-style gaming
    - Moon Active has not disclosed whether it has comparable off-store monetization
    - Playtika Q1 2026 results
  - - Moon Active realized pricing
    - No public title-level ARPPU or discount ladder disclosed
    - Official app pages show access model, not net realized pricing
    - Cohort pricing, promotions, and country-level price elasticity are all private
    - No retained direct disclosure
  notes: Public price surfaces show access mechanics and platform tolls, not realized net pricing. For Moon Active, the underwriting gap is the spread between gross player spend and retained net revenue after fees, taxes, discounts, and timing effects.
