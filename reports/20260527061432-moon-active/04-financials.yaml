- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public value / status
  - Evidence quality
  - Why it matters
  - Diligence ask
  rows:
  - - 2020 capital event
    - $125M Insight transaction at $1.25B valuation; no new money invested
    - high
    - Shows early liquidity came via secondary share sale rather than balance-sheet financing.
    - Confirm who sold, what cash reached the company, and any secondary rights that remain.
  - - 2021 capital event
    - $300M secondary at $5B valuation
    - medium
    - Supports liquidity for insiders but says little about operating cash on hand.
    - Break down primary vs secondary proceeds and current cash remaining from the event.
  - - Visible primary capital raised
    - ~$10M according to later reporting
    - low
    - If directionally right, it strengthens the case that Moon Active scaled mostly from operations.
    - Reconcile full cap table and historical primary cash-in by round.
  - - 2024 operating scale
    - '> $2B company revenue and ~$2B Coin Master annual revenue proxy'
    - medium
    - High revenue suggests the business may fund itself even without new rounds.
    - Share audited EBITDA, operating cash flow, and free cash flow for 2024-25.
  - - 2025 restructuring
    - 50-100 layoffs despite record revenue
    - medium
    - Implies management is still tuning cost structure and may not be spending from a position of total abundance.
    - Provide 2025 restructuring savings, severance cost, and remaining hiring plan.
  - - M&A appetite
    - Moon Active bought Melsoft and Zen Match-related assets
    - medium
    - Acquisitions consume capital and can compete with shareholder distributions or runway.
    - Provide acquisition spend, earnouts, and post-deal payback targets.
  - - Current cash on hand
    - 'null'
    - low
    - No public cash figure means runway cannot be directly underwritten.
    - Provide cash, short-term investments, and minimum-cash policy.
  - - Debt / credit facilities
    - 'null'
    - low
    - Undisclosed leverage could change dilution risk and resilience in a downturn.
    - Provide debt schedule, covenants, leases, and any contingent acquisition liabilities.
  - - Monthly burn / free cash flow
    - 'null'
    - low
    - Without burn or FCF, one cannot tell whether Moon Active is compounding cash or consuming it.
    - Provide monthly burn, trailing 12-month free cash flow, and downside scenario plan.
  notes: Company Overview owns the full chronology; this table restates only the financing facts needed to judge present capital adequacy. The central problem is not lack of revenue, but lack of balance-sheet visibility.
