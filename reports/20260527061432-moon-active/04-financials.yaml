- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Public proxy
  - Exact diligence path
  rows:
  - - Cash, debt, and runway
    - Blocks direct capital-adequacy underwriting and downside planning.
    - Secondary-heavy financing history and >$2B revenue imply strength but do not prove liquidity.
    - Request current cash, debt, covenant package, and 24-month runway model.
  - - Gross-to-net revenue bridge by platform
    - Prevents converting player spend into retained revenue and gross margin.
    - Store-fee policies and peer filings show platform deductions and timing effects matter.
    - Provide gross bookings, platform fees, payment processing, taxes, refunds, and net revenue by title and channel.
  - - Recognition policy and deferred revenue
    - Can materially shift the timing of revenue and liability recognition.
    - Playtika peer filing shows consumables, durables, and ad inventory can all be recognized differently.
    - Provide accounting memo for virtual items, deferred revenue rollforward, and policy by title.
  - - Payer concentration / whale exposure
    - Without this, revenue quality could be overstated by a small cohort of heavy spenders.
    - Coin Master download and geography data prove scale, not payer breadth.
    - Provide payer conversion, top-spender concentration, and payer cohort retention by title.
  - - CAC, payback, and LTV
    - Without cohort economics, UA spend cannot be judged as productive or destructive.
    - FoxData and Deconstructor only provide market benchmarks, not Moon Active-specific economics.
    - Provide CAC, payback, LTV/CPI, and ROAS curves for Coin Master and Travel Town.
  - - Title-level profitability
    - Diversification cannot be valued if acquired titles are large revenue but low margin.
    - Naavik and acquisition sources show non-Coin Master revenue exists, but not its EBITDA quality.
    - Provide title-level revenue, gross margin, EBITDA, and UA spend for acquired titles.
  - - Working capital and capex
    - Cloud, live-ops, content, and M&A can all consume cash without appearing in topline metrics.
    - Public sources show a 2,500-person company and continued live-ops investment, but not cost timing.
    - Provide monthly opex by function, capitalized development, cloud spend, and acquisition-related cash outflow schedule.
  notes: Each row is a genuine underwriting blocker, not a placeholder. Public evidence is strong enough to prove scale and concentration, but not strong enough to prove cash conversion, balance-sheet resilience, or true portfolio profitability.
