    {
      "id": "growth-drivers-and-adoption-constraints",
      "title": "Growth drivers and adoption constraints",
      "body": "The major growth tailwinds are real, but they are no longer simple. Smartphone and internet penetration keep expanding the reachable audience: more than 5.78 billion people now use mobile phones, more than 6 billion are online, and mobile remains the largest gaming platform by both users and revenue. Casual formats still dominate installs, and live operations, mini-games, rewards, and seasonal events are now standard tools for sustaining engagement. Adjust and AppsFlyer both show the same operational shift: growth depends less on brute-force scale and more on retention, creative iteration, and efficient user acquisition. But the constraints are equally important. AppMagic's 2025 summary points to a mature market with near-flat revenue growth, while casino downloads rose even as casino revenue fell, which suggests weaker monetization efficiency. ATT and broader privacy limits reduce targeting signal quality on iOS. App stores still mediate the purchase flow and can change the economics of distribution. Finally, gambling-adjacent mechanics face rising scrutiny: UK authorities now require prominent loot-box disclosures, want under-18 purchases blocked without parental consent, and continue to review stronger measures if self-regulation fails. For Moon Active, the market is large enough; the real question is whether it can keep conversion and retention high while the distribution environment becomes more expensive and more regulated.",
