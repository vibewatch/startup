      "id": "users-payers-and-platform-mediated-spend",
      "title": "Users, payers, and app-store-mediated spend",
      "body": "The buyer, user, and payer structure in Moon Active's market is overwhelmingly consumer-led, but it is not homogeneous. Coin Master's audience begins with broad casual mobile users looking for short-session entertainment, yet its retention and monetization loops lean on social competition, collection pressure, and repeated event participation. Public demographic proxies show why that matters. Mobile gaming is close to gender balanced, women are more likely to be mobile-only players, and Asia-Pacific contributes the largest player base and revenue pool. At the same time, monetization is highly concentrated: public mobile benchmarks say half of players pay nothing, while only a small high-spender minority contributes disproportionate spend. For Moon Active, that means the most relevant segmentation is not enterprise budget ownership but the path from free installer to habitual spender. App stores sit in the middle of that path. Apple and Google control listing visibility, payment rails, entitlement handling, and large parts of the attribution stack. Apple's ATT rules constrain cross-app tracking, while Google Play billing defines how digital goods are sold on Android. In practice, Moon Active sells to individual consumers, converts a minority of them into payers, and depends on platform infrastructure to collect and optimize that spend.",
