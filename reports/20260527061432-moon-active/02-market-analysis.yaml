    "number": 2,
    "title": "Market Analysis",
    "summary": "Moon Active operates in a market that is large but definition-sensitive: the narrowest retained lens is roughly a USD 9-10 billion social-casino market, while broader casual and total mobile-gaming lenses are much larger. Coin Master's roughly USD 1.2 billion annual revenue proxy proves the company already matters economically, but future upside depends less on abstract TAM than on live-ops execution, app-store mediation, rising user-acquisition costs, and tightening oversight of gambling-adjacent mechanics."
