    {
      "id": "market-boundary-and-sizing",
      "title": "Market boundary and evidence-constrained sizing",
      "body": "Moon Active should not be analyzed as a real-money gambling operator, but neither should Coin Master be treated as a generic casual game with no casino adjacency. The official Google Play listing describes the title as a free game with in-app purchases and explicitly says it does not offer real-money gambling or real-money prizes. At the same time, third-party genre analysts describe Coin Master as casual on Google Play, adventure on Apple, and mechanically closest to a social-casino slots product because its core loop is a spin, reward, build, and raid cycle. The practical market boundary is therefore free-to-play mobile entertainment centered on casual play, but with social-casino-adjacent monetization psychology. That framing matters because the narrow social-casino market is roughly USD 9-10 billion in 2026, the broader casual-game IAP pool is far larger at roughly USD 32.7 billion, and the full mobile-gaming context is roughly USD 103 billion of 2025 revenue. Coin Master's own roughly USD 1.2 billion annual revenue proxy since 2020 means Moon Active already matters economically in any of those lenses, but the implied market share changes radically depending on which boundary is chosen. That is why the chapter uses multiple lenses rather than a single inflated TAM headline.",
