  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "Moon Active's closest scaled threat is Scopely's MONOPOLY GO, while King and Playrix remain incumbent casual-retention rivals and Playtika is the clearest social-casino substitute cluster. Coin Master still has differentiated spin-raid social loops and meaningful scale, but public evidence shows low switching costs, fast feature imitation, and a visible DTC / store gap versus Playtika and Supercell. Moon Active's broader casual portfolio helps, yet competition remains anchored on Coin Master and adjacent live-ops execution rather than an unassailable multi-franchise moat."
  },
  "sections": [
    {
      "id": "landscape-overview",
      "title": "Direct, adjacent, substitute, and likely-entrant landscape",
      "body": "Moon Active competes in a tighter set than a generic “mobile gaming” label implies. Coin Master’s official listings still define the flagship as a spin, raid, build, collect, and team-based casual title with virtual-item purchases and no real-money payouts. That makes Scopely’s MONOPOLY GO the nearest scaled adjacent rival because it pairs a different front-end—dice and a board-game skin—with the same economic skeleton: build progression, social heists, sticker completion, and relentless event cadence. Independent analysis suggests MONOPOLY GO expanded the coin-looter audience instead of immediately destroying Coin Master, but that is not comfort; it means Moon Active now fights in a larger, better-financed arena. The direct set is therefore Coin Master plus other coin-looter or social-casino-adjacent loops; the incumbent set is King and Playrix; the substitute set is Playtika’s social-casino portfolio; and the likely-entrant or benchmark set includes Supercell, Jam City, and Tripledot, which have enough live-ops, audience, or store sophistication to matter even without cloning Coin Master exactly.",
