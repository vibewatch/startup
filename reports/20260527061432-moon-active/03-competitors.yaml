    {
      "calloutType": "strength",
      "title": "Coin Master still owns one of the few globally scaled spin-raid loops",
      "body": "Moon Active still controls a distinctive formula at meaningful scale: the official Coin Master surfaces combine slot-like anticipation, social raids, card sets, teams, expeditions, and village-building in a loop that peers have imitated but not displaced outright. The direct lesson from MONOPOLY GO is not that Coin Master is obsolete; it is that the formula is valuable enough for better-financed rivals to keep attacking.",
      "claimRefs": [
        "CP001",
        "CP003",
        "CP033",
        "CP039"
      ]
    },
    {
      "calloutType": "risk",
      "title": "The clearest structural weakness is off-store and platform leverage",
      "body": "Public evidence shows Playtika and Supercell already using store or DTC capability as part of the competitive stack, while Moon Active's retained public surfaces remain app-store-native. If Moon Active lacks a meaningful web-shop motion, it stays more exposed to Apple and Google billing rules and misses a margin and loyalty lever that top peers are already using.",
      "claimRefs": [
        "CP026",
        "CP028",
        "CP029"
      ]
    },
    {
      "calloutType": "insight",
      "title": "Competition is broader than direct clones",
      "body": "Moon Active is simultaneously fighting Scopely on direct formula execution, Playtika on gambling-adjacent monetization and DTC, King and Playrix on evergreen casual retention, and Supercell on live-service and store sophistication. That broader framing matters because a company can lose share of wallet or margin quality long before a single direct clone “kills” Coin Master.",
