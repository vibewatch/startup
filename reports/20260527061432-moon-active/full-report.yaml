      - CU038
      - CU039
      - CU041
  - id: FU002
    title: Public adoption and escalation flow
    type: flow
    layout: wide
    summary: >-
      Moon Active's public customer flow runs from free discovery into habit loops, then branches into social deepening,
      monetization friction, support, and possible cross-title migration.
    data:
      nodes:
        - id: discovery
          label: Free app discovery
          detail: >-
            Players encounter Moon Active through app stores, paid awareness, community sharing, or rewarded-install
            surfaces.
        - id: install
          label: Install and first session
          detail: >-
            Entry is free and the initial experience is built around fast early rewards, tutorials, and optional social
            connection.
        - id: habit
          label: Habit formation
          detail: >-
            Coin Master leans on raids, cards, and teams; Travel Town on merge orders and villagers; Zen Match on daily
            calm puzzles.
        - id: pressure
          label: Monetization or energy pressure
          detail: Progression slows when spins, energy, or ads create friction for non-payers or dissatisfied repeat users.
        - id: support
          label: Support and public feedback
          detail: >-
            Players either use title help centers or leave public reviews when glitches, missing items, or spend
            frustration appears.
        - id: expansion
          label: Cross-title exploration
          detail: >-
            The same player can discover other Moon Active titles through official portfolio pages or adjacent-title
            launches.
        - id: churn
          label: Churn or unresolved frustration
          detail: If support and value perception fail, players complain publicly and stop spending or leave entirely.
      edges:
        - from: discovery
          to: install
          label: Free download
        - from: install
          to: habit
          label: Early rewards and core loop
        - from: habit
          to: pressure
