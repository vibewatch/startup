      - number: '4.4'
        title: Capital adequacy, financing dependency, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a company that likely does not need a classic venture round to stay alive, but
              that is not the same thing as having an underwritten balance sheet. The strongest support for self-funding
              is historical: Insight's 2020 $125 million transaction bought existing shares and injected no new money,
              while the 2021 $300 million round was also secondary. Later reporting likewise frames Moon Active as
              having raised very little primary equity despite very large revenues. That combination implies the
              business probably funds operations from internal generation and has used capital events more for
              shareholder liquidity and opportunistic expansion than for rescue financing. The same history, however,
              also shows an appetite to redeploy cash into acquisitions such as Melsoft and Zen Match rather than simply
              hoard it. Publicly, we still do not know the current cash balance, debt load, burn, runway, deferred
              revenue, working-capital profile, or title-level margins. The 2025 layoffs and function-wide streamlining
              matter because they show management is still tuning cost structure despite record revenue. The financial
              verdict is therefore favorable on scale and likely cash generation, cautious on margin durability, and
              blocked on balance-sheet opacity.
