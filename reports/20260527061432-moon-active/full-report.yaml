          paying
        - A fresh financing or secondary-clearing mark would convert scale into a real price signal
      - - Franchise durability
        - Coin Master has remained large for years and rebounded into top-grossing charts again in March 2026
        - Coin Master still drove 73% of Q1 2024 store revenue, so durability and concentration are inseparable
        - A lower concentration ratio with proven title-level margins would strengthen the thesis materially
      - - Diversification
        - Melsoft and Zen Match show Moon Active bought real assets and teams rather than only optionality
        - Public evidence still does not show title-level contribution margin for the newer portfolio
        - Monthly revenue and EBITDA by title would show whether diversification is real economic protection
      - - Public comp logic
        - Public gaming comps and strategic deals support a wide but still meaningful valuation corridor
        - The same comp set is extremely dispersed and easy to misuse if business-model differences are ignored
        - A banker-grade comp set with current private marks would narrow the corridor
      - - Capital adequacy
        - Secondary-heavy history and record revenue suggest Moon Active is probably not financing basic survival
        - >-
          No public cash, debt, or preference disclosure means a seemingly healthy business could still be a poor equity
          entry
        - Current balance-sheet and waterfall disclosure is required before a buy recommendation
      - - Current anti-thesis
        - The business may be excellent while the security remains unpriceable on public evidence alone
        - That gap is precisely why the chapter stops at track instead of buy
        - The anti-thesis weakens only when valuation terms become visible
