  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct, adjacent, substitute, and likely-entrant landscape
        blocks:
          - type: paragraph
            body: >-
              Moon Active competes in a tighter set than a generic “mobile gaming” label implies. Coin Master’s official
              listings still define the flagship as a spin, raid, build, collect, and team-based casual title with
              virtual-item purchases and no real-money payouts. That makes Scopely’s MONOPOLY GO the nearest scaled
              adjacent rival because it pairs a different front-end—dice and a board-game skin—with the same economic
              skeleton: build progression, social heists, sticker completion, and relentless event cadence. Independent
              analysis suggests MONOPOLY GO expanded the coin-looter audience instead of immediately destroying Coin
              Master, but that is not comfort; it means Moon Active now fights in a larger, better-financed arena. The
              direct set is therefore Coin Master plus other coin-looter or social-casino-adjacent loops; the incumbent
              set is King and Playrix; the substitute set is Playtika’s social-casino portfolio; and the likely-entrant
              or benchmark set includes Supercell, Jam City, and Tripledot, which have enough live-ops, audience, or
              store sophistication to matter even without cloning Coin Master exactly.
            claimRefs:
              - CP001
              - CP002
              - CP003
