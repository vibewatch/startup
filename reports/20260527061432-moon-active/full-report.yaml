      - number: '1.2'
        title: Capital base, milestones, and portfolio expansion
        blocks:
          - type: paragraph
            body: >-
              The core milestones show a company that scaled unusually far before taking much visible primary capital.
              Retained coverage indicates Moon Active’s first major step-change came in January 2020, when Insight
              Partners bought shares for $125 million at a $1.25 billion valuation. That was followed in November 2021
              by a $300 million secondary transaction at a $5 billion valuation led by Insight with Andalusian Private
              Capital participating. The milestone sequence matters because later coverage frames Moon Active as a
              growth-stage giant, but most of the disclosed financing was secondary rather than fresh balance-sheet
              capital. The next major arc was portfolio expansion. In December 2020 Moon Active acquired Melsoft,
              bringing Family Island and MyCafe into the orbit and giving the buyer a broader casual portfolio. In
              December 2022 it acquired Zen Match and the associated Istanbul-based team from Good Job Games, showing a
              willingness to buy products and talent rather than rely only on internal incubation. By 2024 analysts such
              as Naavik argued those bets had broadened revenue beyond Coin Master, even though flagship concentration
              still remained heavy. The result is a company story built around one mega-hit, deliberate M&A, and very
              limited formal disclosure about how management evaluates those capital allocation choices.
