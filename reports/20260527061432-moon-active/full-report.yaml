        - label: $2.0B revenue × 5x
          value: 10
          description: Upper mid-band if diversification gets partial credit
        - label: $2.2B revenue × 5x
          value: 11
          description: Constructive case with stable franchise economics
        - label: $2.2B revenue × 6x
