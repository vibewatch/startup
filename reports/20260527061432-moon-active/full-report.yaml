              - CV045
      - number: '8.4'
        title: Track is the right call until private evidence closes the equity-underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Moon Active clears the quality bar for ongoing attention but not for an immediate buy call. The company
              likely does not need emergency primary capital, and its historical use of secondaries plus acquisitions
              suggests a business with real internal cash generation and optionality. Even so, a private investment
              recommendation has to be price-sensitive. Public evidence does not disclose current cash, debt, preference
              terms, or title-level contribution margins, and those unknowns matter more than another flattering revenue
              milestone. The recommendation is therefore track with medium confidence and a high risk rating. The likely
              upside case is real, but the burden of proof remains on economics and capital structure. An upgrade to buy
              requires a live cap table, audited 2025 or 2026 revenue and EBITDA, title-level profit contribution, DTC
              share, and UA payback data. The thesis breaks if Coin Master concentration worsens, financing quality
              turns punitive, or category pressure overwhelms diversification. On exit, the public record supports a
              secondary or strategic-sale lens more than an immediately underwritten IPO path.
            claimRefs:
              - CV004
              - CV013
              - CV014
