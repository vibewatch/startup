      - number: '3.2'
        title: Competitor profiles and category-by-category threat shape
        blocks:
          - type: paragraph
            body: >-
              King, Playrix, Playtika, Jam City, Tripledot, and Supercell occupy very different threat positions. King
              and Candy Crush are the clearest incumbents: less mechanically similar than MONOPOLY GO, but still
              operating one of mobile’s deepest event and level ecosystems under Microsoft ownership. Playrix’s Scapes
              titles compete on long-session renovation retention rather than raid dynamics, yet they fight for the same
              adult casual payer and already know how to run very large level libraries with events and social hooks.
              Playtika matters because it sits on the social-casino boundary that Coin Master repeatedly touches without
              crossing: Slotomania, Bingo Blitz, WSOP, Board Kings, Pirate Kings, Dice Dreams, and Animals and Coins
              collectively create a substitute cluster Moon Active cannot ignore. Jam City and Tripledot are smaller
              threats, but they remain real because Cookie Jam and Woodoku show durable puzzle distribution with huge
              install or engagement bases, while Supercell is the benchmark for “years-long” franchise management and
              direct store execution even in lighter casual genres like Hay Day.
