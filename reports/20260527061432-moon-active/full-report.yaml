  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scale, and business model
        blocks:
          - type: paragraph
            body: >-
              Moon Active is best understood as a private Israeli mobile-gaming operator whose identity is still
              dominated by Coin Master. Official copy is intentionally broad: the company describes itself as one of the
              world’s fastest-growing mobile game companies and says its entertainment is enjoyed by millions of
              players. Independent sources fill in the sharper edges. Multiple retained profiles place headquarters in
              Tel Aviv and identify Samuel Albin as founder and CEO, while secondary coverage consistently treats Coin
              Master as the company’s defining product and the economic engine behind later expansion. The business
              model is free-to-play mobile gaming built around in-app purchases, progression loops, and live operations
              rather than packaged-game revenue. What makes Moon Active notable is not just title success but scale
              concentration: Sensor Tower-based reporting says Coin Master alone crossed $6 billion of lifetime player
              spending by August 2024, averaged about $1.2 billion annually since 2020, and still ranked among the
              world’s top-grossing mobile titles in 2024. That scale explains why Moon Active can look like a mature
              cash generator despite having far less publicly disclosed capital and governance detail than most
              companies with comparable economic output.
