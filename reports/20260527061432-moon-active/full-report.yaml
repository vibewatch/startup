      - number: '7.4'
        title: >-
          Mitigations, monitors, and thesis-breaks: visible controls exist, but several core questions still require
          private diligence
        blocks:
          - type: paragraph
            body: >-
              Moon Active is not operating blindly. Portfolio expansion beyond Coin Master is real; support surfaces
              exist across multiple titles; the company has a public vulnerability-reporting page; and job postings show
              explicit investment in monetization, analytics, infrastructure, and campaign optimization. Those are real
              mitigants and they explain why the residual risk is not simply 'avoid.' But mitigation maturity is still
              mostly low to medium because the public set does not show the metrics that would prove these controls are
              working. I do not have public evidence for title-level SLOs, uptime history, fraud outcomes, cohort-level
              payer concentration, or per-title cash conversion. That means the practical underwriting posture should
              stay trigger-based. The thesis breaks if the Coin Master legal or disclosure stack worsens, if app-store
              or ATT policy changes impair monetization or measurement faster than Moon Active can adapt, if post-layoff
              integration slippage expands across acquired studios, or if Coin Master concentration remains high while
              secondary titles fail to offset paid-UA pressure. The mitigation table therefore focuses on monitorable
              events rather than generic best practices, and the main diligence asks are intentionally blunt: prove
              payer concentration, prove title-level profitability, prove reliability, and prove that the post-Melsoft
              and post-Zen Match portfolio can keep compounding without another major cost reset.
