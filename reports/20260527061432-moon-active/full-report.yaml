      - number: '7.2'
        title: >-
          Operational and dependency risk: always-on live ops run through cloud, stores, support, and ad platforms Moon
          Active does not fully control
        blocks:
          - type: paragraph
            body: >-
              Operationally, Moon Active looks far more sophisticated than a single-game studio, but that sophistication
              increases dependency risk. Hiring pages show always-on backend requirements, 24/7 traffic at roughly 100
              thousand requests per second, and a production chain that runs through AWS, GCP, Cloudflare, GKE, GitHub,
              ArgoCD, observability, incident management, disaster recovery, and business continuity. That is a real
              mitigation because it implies mature technical ops. It is also a real dependency because outages, cost
              shocks, or vendor policy changes can hit live-service quality faster than product teams can react. The
              same pattern appears on the commercial side. Official Coin Master help pages have standing flows for
              connection errors and purchase failures, while Moon Active's UA and creative roles explicitly depend on
              Facebook, Instagram, video networks, attribution know-how, DSPs, and constant ad-creative iteration. Apple
              ATT and Apple's SDK rules mean that measurement and remarketing remain structurally constrained, while
              AppsFlyer's 2026 gaming data shows creative output and paid competition are both rising. This is why I
              rank operational and partner risk just below legal exposure: Moon Active has real scale and tooling, but
              much of the service chain still depends on external stores, ad ecosystems, and cloud providers that can
              compress margin or degrade growth without warning.
