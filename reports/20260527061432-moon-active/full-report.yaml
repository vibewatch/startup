  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation chain runs from stale valuation data and real operating scale through comp dispersion and
      disclosure gaps to a track call.
    data:
      nodes:
        - id: scale
          label: Real scale is proven
          detail: 2024 public reporting points to >$2B revenue and a flagship above $6B lifetime spend
        - id: stale-mark
          label: Current price is not proven
          detail: The last disclosed corporate valuation in retained sources is still the 2021 $5B secondary
        - id: concentration
          label: Concentration remains high
          detail: Coin Master still represented 73% of Q1 2024 store revenue
        - id: comp-dispersion
          label: Comparable set is wide
          detail: Public gaming equities are cheap while strategic-control deals remain much higher
        - id: missing-terms
          label: Equity terms are hidden
          detail: Cash, debt, preferences, and title-level margins are not publicly disclosed
        - id: recommendation
          label: Track
          detail: Watch closely, but wait for price and diligence clarity before upgrading to buy
      edges:
        - from: scale
          to: stale-mark
          label: Scale does not equal price
        - from: stale-mark
          to: concentration
          label: Old mark needs fresh underwriting
        - from: concentration
          to: comp-dispersion
          label: Risk widens the multiple band
        - from: comp-dispersion
          to: missing-terms
          label: Wide comps raise the burden of proof
        - from: missing-terms
          to: recommendation
          label: Opacity blocks a buy call
