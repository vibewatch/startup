      - number: '2.4'
        title: Contradictions and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The biggest analytical trap in Moon Active's market is pretending that one number resolves the market
              question. It does not. The narrowest retained estimates cluster around roughly USD 9-10 billion for social
              casino in 2026, but broader casual-game IAP pools and total mobile-gaming contexts are much larger. Those
              figures are not mutually exclusive; they are different boundary choices. That means any share calculation
              must explicitly say which lens it uses. Evidence gaps remain material as well. Public data do not reveal
              Coin Master's current payer conversion, the split between whales and the broader payer base, or the share
              of gross player spend that Moon Active keeps after store fees, taxes, and any off-store payments.
              Regulatory evidence is also mixed: governments have favored industry-led protections, but academic
              scrutiny says compliance is weak and enforcement thin. The right diligence stance is therefore not to
              reject the market, but to treat Moon Active as a company operating in a large, fuzzy, and policy-sensitive
              market where operational execution matters more than slogan-sized TAM.
