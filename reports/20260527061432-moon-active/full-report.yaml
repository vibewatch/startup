      - number: '1.3'
        title: Leadership, operating footprint, and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The operating picture is clearer than the governance picture. Public profiles and Moon Active’s own hiring
              materials support Samuel Albin’s continuing leadership and show an organization hiring across product,
              R&D, marketing, customer relations, security, finance/legal, monetization, and operations. Current
              recruiting pages also confirm active footprints in Tel Aviv, Kyiv, and Warsaw, while a Warsaw DevOps role
              describes infrastructure that ingests billions of daily events and relies on GCP, AWS, Cloudflare,
              Kubernetes, GitHub Actions, and ArgoCD. That operating detail is useful because it suggests Moon Active is
              not just a marketing-heavy casual-game studio; it runs meaningful backend, data, and live-ops
              infrastructure. Still, the company remains opaque where institutional diligence usually gets easier.
              Accessible public sources disagree sharply on current headcount, expose only partial executive detail, and
              do not provide a dependable live board roster, cap table, or audited revenue statements. Even valuation
              language needs care: some 2024 coverage clearly refers to Coin Master’s revenue milestone crossing $6
              billion, not a fresh priced corporate financing. For later chapters, the practical takeaway is that Moon
              Active is easy to understand as a business phenomenon but harder to underwrite as a governance object from
              public evidence alone. That asymmetry is acceptable for a chapter-one orientation pass, but it means every
              later chapter should treat hard numbers about workforce, valuation, and governance as estimates to be
              re-corroborated rather than inherited blindly from a single profile page.
