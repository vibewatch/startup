      - number: '8.3'
        title: The right public-only output is a range with entry discipline, not a point target
        blocks:
          - type: paragraph
            body: >-
              Because the data quality is asymmetric, the right public output is an enterprise-value corridor rather
              than a faux-precise equity price. The bear case assumes concentration remains stubborn, category pressure
              persists, and investors apply only distressed or mature-gaming multiples to a company whose current cap
              table remains invisible. The base case assumes Moon Active can roughly defend its current scale, keep Coin
              Master healthy, and get some credit for Travel Town, Family Island, and Zen Match without winning a
              software-style premium. The bull case requires investors to treat Moon Active as a scarce strategic
              mobile-gaming asset whose revenue base is durable enough to command upper-end gaming deal multiples. Those
              cases support a wide band centered around about $9 billion of enterprise value, with useful entry
              discipline rather than a false statement of exact worth. At any undisclosed current price, the practical
              underwriting rule is simple: lower-mid-band prices are fair, sub-$7 billion is attractive, and anything
              above about $12 billion starts to demand proof the public record does not yet provide.
            claimRefs:
              - CV011
