        - A 2022 control transaction in a friendlier market, not a current trading multiple
      - - Savvy / Scopely deal
        - Scaled mobile-game publisher with live-ops strength
        - 2023 announced acquisition value of $4.9B
        - Shows strategic appetite for scaled mobile assets remained real after the 2021 boom
        - Private revenue disclosure is thinner and sovereign-buyer motives may raise the premium
      - - AppLovin
        - 2025 revenue $5.481B as a marketing-platform company
        - May 2026 market cap about $172.75B
        - Useful only as an upper-bound reminder that software/adtech economics get very different multiples
        - Not a clean operating comp for Moon Active and should not anchor a fair-value case
    notes: >-
      The comparable set intentionally mixes public equities and strategic transactions because no single listed peer
      maps cleanly to Moon Active. Read these rows as boundary markers, not a one-click multiple selection.
