companyProfile:
  summary: >-
    Moon Active is a Tel Aviv-based private mobile-gaming company founded in 2011 by Samuel Albin. It scaled around Coin
    Master, one of the world’s highest-grossing casual mobile games, then broadened its portfolio through acquisitions
    including Melsoft and Zen Match. Public evidence supports exceptional revenue scale and likely strong cash
    generation, but the company remains materially opaque on cap table, board composition, current margins, and
    title-level mix, so public diligence is better at proving strategic relevance than at fully underwriting the equity.
