      - number: '4.3'
        title: Public traction, margin path, and hit dependence
        blocks:
          - type: paragraph
            body: >-
              The public traction stack is good enough to prove scale but not good enough to prove quality of earnings.
              Globes says Moon Active ended 2024 with revenue above $2 billion and attributes an estimated $2 billion of
              annual revenue to Coin Master alone. Four independent 2024 reports also converge that Coin Master has
              crossed $6 billion of lifetime player spending and averaged roughly $1.2 billion annually since 2020, with
              356 million downloads and the United States supplying a disproportionate share of both revenue and
              installs. That is a formidable revenue engine. At the same time, the diversification story is real but
              incomplete. Naavik says Moon Active generated $355 million of Q1 2024 store revenue and that 73% still
              came from Coin Master, implying roughly $97 million from the rest of the portfolio. Travel Town and Family
              Island have clearly become meaningful cash contributors, and past acquisitions brought real revenue bases
              rather than only talent. Yet the margin path remains more fragile than the topline suggests. A large
              employee base, live-ops cadence, content production, and platform tolls all sit underneath the revenue
              stack, and GameRefinery's March 2026 chart rebound shows Coin Master is still being actively defended as
              the economic heart of the company.
