  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing surfaces, and recognition issues
        blocks:
          - type: paragraph
            body: >-
              Moon Active's public pricing surface is typical of scaled free-to-play mobile gaming: entry is free,
              monetization is pushed into repeat in-app purchases, and the commercial pressure sits inside the loop
              rather than at download. Coin Master's App Store listing says the game is free with in-app purchases, lets
              users buy virtual items with real money, and is not real-money gambling, while Travel Town is likewise
              free with in-app purchases and warns of randomized items. Apple's developer page also ties both titles
              back to Moon Active, which is enough to show the portfolio is monetized through app-store transactions
              rather than subscriptions or enterprise contracts. What is not public is how Moon Active recognizes that
              spend once it reaches the ledger. Public peer filings show the accounting nuance that matters: Playtika
              records virtual-item sales on a gross basis, books platform fees in cost of revenue, recognizes
              consumables as they are used, recognizes durables over six to twelve months, and nets ad inventory as
              agent revenue. That is the right caution for Moon Active too. Public topline signals are strong, but
              realized revenue quality still depends on virtual-item mix, timing of consumption, deferred revenue,
              taxes, refunds, and any off-store payment flows the company has not disclosed.
