  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Concentration worsens again
        - Coin Master share of revenue rises rather than falls from the Q1 2024 baseline
        - Converts a scaled portfolio story back into a single-franchise underwriting problem
        - Move to avoid or demand a much lower entry price
      - - Financing quality degrades
        - A new financing introduces punitive preferences, ratchets, or rescue-capital signals
        - Common-equity upside can be absorbed by senior claims even if the company keeps growing
        - Treat as a thesis break until the waterfall is re-underwritten
      - - Category pressure intensifies
        - RPD keeps falling while CPI and CPM stay elevated
        - Gross growth no longer converts into attractive net economics
        - Compress the multiple range and reassess the recommendation
      - - Current scale proves weaker than reported
        - Audited 2025 or 2026 revenue misses the >$2B public storyline by a material margin
        - The whole public-only range has to move down because the revenue anchor breaks
        - Reset toward the bear case and re-open diligence
      - - Exit path narrows
        - Neither secondary demand nor strategic interest exists at a sensible valuation
        - Even a good company can become a poor investment without realizable liquidity
        - Do not upgrade from track regardless of company quality
    notes: >-
      These are kill criteria rather than generic risks. Each one changes either the realized seniority of the security
      or the plausibility of the exit needed to earn target returns.
    claimRefs:
      - CV009
      - CV016
      - CV049
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current cap table and seniority
        - Current security stack, employee-liquidity terms, preferred rights, and any debt or revolver balances
        - Without this, enterprise value cannot be translated into equity value or downside protection
        - CFO package plus counsel review of financing documents
      - - Audited operating results
        - Audited 2025 and year-to-date 2026 revenue, EBITDA, cash flow, and cash balance
        - Validates whether the >$2B revenue narrative is durable and profitable
        - Finance diligence with audited or board-grade statements
      - - Title-level economics
        - Monthly revenue, gross margin, contribution margin, and live-ops spend by major title
        - Tests whether diversification is reducing risk or just masking a still-single-title machine
        - Operating review with title P&Ls and management bridge
      - - Channel and UA efficiency
        - DTC share, platform-fee burden, blended CPI, cohort payback, and top-country mix
        - Shows whether Moon Active can preserve margin as platform and media costs move
        - Growth and finance diligence using UA dashboards and DTC analytics
      - - Exit readiness
        - Board-level view on secondary liquidity, strategic interest, and public-market readiness
        - Determines whether the hold-period logic has a realistic path to realization
        - Board materials, banker references, and shareholder-liquidity planning review
    notes: >-
      Each diligence ask is designed to convert a public-screening chapter into an investable underwriting file. If
      management cannot produce these materials, the recommendation should not be upgraded.
    claimRefs:
      - CV047
      - CV048
      - CV050
