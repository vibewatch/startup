            body: >-
              Hiring evidence exposes Moon Active's operating spine in unusual detail. Backend and DevOps roles describe
              Node.js, Redis, Aurora, Kubernetes, AWS, GCP, Cloudflare, GKE, GitHub Actions, ArgoCD, observability,
              incident management, and disaster recovery, with Coin Master infrastructure serving roughly 100 thousand
              requests per second and peaks above 200 thousand. Full-stack roles add the internal layer: applications
              for operations, monetization, CRM, analysts, BI, and AI-assisted workflows. The newer monetization and
              creative roles show how the company actually runs live games. Monetization managers plan day-to-day events
              and promotions, A/B test content, and coordinate with economists, analytics, design, and technical
              operations to improve retention and lifetime value. Marketing creative producers convert insights into
              video and static ad creatives, track KPIs such as IPM, CTR, ROAS, and retention, and iterate against
              competitor signals. Put together, this looks like a portfolio-capable live-ops machine rather than a
              lightweight mobile studio. The architecture advantage is not just the client loop; it is the shared system
              for economy tuning, content cadence, creative testing, analytics, and release management that can be
              applied across multiple games.
