      - number: '3.3'
        title: Monetization, distribution power, and switching-cost dynamics
        blocks:
          - type: paragraph
            body: >-
              At the download stage, these games barely compete on price because nearly all are free with optional
              virtual-item purchases. Competition instead happens inside the economy: which loop converts more payers,
              drives more daily return visits, and monetizes event urgency without burning out the audience. Coin Master
              leans harder into slot-like anticipation, raids, shields, and card-set completion. MONOPOLY GO softens
              similar pressure with familiar board IP, hourly events, sticker albums, and co-op systems. Candy Crush,
              Playrix, and Jam City use deeper level banks and themed events to keep players multi-homing across puzzle
              incumbents. Playtika adds the closest true substitute behavior with casino categories, loot boxes, and
              cross-game rewards. Distribution power is now two-layered. Apple and Google still mediate discovery,
              billing rules, and much of the UX, but leading publishers are building around that control through web
              shops and D2C systems. Playtika’s record DTC revenue and Supercell’s Hay Day Store show what stronger
              off-store execution looks like; Moon Active’s retained public surfaces do not yet show comparable
              external-store depth.
            claimRefs:
