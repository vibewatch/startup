              Public evidence proves repeat use and visible frustration, but Moon Active still withholds the retention,
              payer-mix, and cross-title-overlap data needed to fully underwrite customer quality.
            calloutType: risk
            claimRefs:
              - CU026
              - CU030
              - CU042
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Severity-ranked legal and platform risk: chance-based monetization is the clearest public legal overhang'
        blocks:
          - type: paragraph
            body: >-
              Moon Active's top-ranked risk is not that it lacks scale; it is that its biggest cash engine still sits
              close to regulated chance mechanics while being distributed entirely through third-party app stores that
              keep tightening disclosure, privacy, and billing rules. Coin Master's official store surfaces explicitly
              combine simulated-gambling or slot-style play with real-money purchases, and Travel Town's App Store page
              separately discloses randomized items. That alone does not make the business illegal, but it keeps Moon
              Active exposed to a moving compliance perimeter. The UK ASA's 2026 enforcement notice now requires
              prominent loot-box disclosure on Apple and Google app listings and rejects vague 'offers in-app purchases'
              labeling. Apple separately requires odds disclosure for randomized virtual items, treats gambling as one
              of the App Store's most regulated categories, and can remove apps for privacy or tracking violations.
              Google Play likewise requires odds disclosure for randomized items, mandates Play billing for most in-app
              purchases, and restricts steering to outside payment methods. The active Williams v. Moon Active lawsuit
              turns that abstract policy risk into concrete legal risk by alleging Coin Master is illegal gambling aimed
              at children. My practical ranking is therefore: legal and platform risk first, because it can directly
              impair distribution, conversion, and brand trust at the same time.
            claimRefs:
