      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The stale 2021 mark likely understates today’s business scale
            body: >-
              Revenue and franchise evidence are strong enough to reject the 2021 $5B secondary as a current fair-value
              anchor on its own. That supports keeping Moon Active in play rather than dismissing it as fully valued by
              an old mark.
            calloutType: strength
            claimRefs:
              - CV003
              - CV005
              - CV011
              - CV039
          - type: callout
            title: Concentration and UA pressure keep the downside wide
            body: >-
              Coin Master still dominates reported store revenue, and public category data shows CPI and CPM pressure
              rising while coin-looter monetization faces more crowding. That combination is why the chapter uses a wide
              band and a high risk rating.
            calloutType: risk
            claimRefs:
              - CV009
              - CV016
              - CV034
              - CV035
          - type: callout
            title: Track, do not chase
            body: >-
              Moon Active looks good enough to follow closely but not transparent enough to buy blind. The public record
              justifies diligence and entry discipline, not momentum investing at an undisclosed price.
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV045
              - CV048
          - type: callout
            title: The range assumes 2024 scale has broadly held
            body: >-
              The valuation corridor assumes the >$2B revenue story remains roughly intact into 2026 and that Coin
              Master remains large but not collapsing. If audited current numbers break that assumption, the range needs
              to move.
            calloutType: assumption
            claimRefs:
              - CV011
              - CV017
              - CV043
