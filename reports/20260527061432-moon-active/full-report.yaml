  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and player workflows
        blocks:
          - type: paragraph
            body: >-
              Moon Active sells repeatable mobile entertainment loops, not one generic casual app. Coin Master remains
              the flagship social-casino-builder experience: players spin, raid, attack, build villages, collect cards,
              join teams, and cycle through special events. Travel Town serves a different player job, built around
              merging items, completing villager missions, and rebuilding a town. Zen Match targets a calmer daily-habit
              loop, using tile matching, room decoration, plant care, and daily puzzles. Public deal reporting expands
              the picture further: Family Island and MyCafe entered the portfolio through Moon Active's Melsoft
              acquisition, while Zen Match later joined through the Good Job Games transaction. Newer public launch
              traces matter too. Coin Master: Board Adventure extends the flagship IP into a dice-and-board format, and
              Hole Stars shows Moon Active testing or launching another casual puzzle loop. In player-workflow terms,
              Moon Active is no longer just monetizing a single spin mechanic. It is operating multiple habit loops
              across social raid, merge, match, and lightweight action-puzzle genres, which is a stronger
              product-platform signal than a one-title studio would offer.
