    {
      "id": "comparable-dispersion-and-multiple-boundaries",
      "title": "Comparable evidence is useful only as a boundary set, not as a clean one-for-one multiple",
      "body": "The comparable set says more about boundaries than about a single fair multiple. Public pure-play mobile and social-casino operators can trade brutally low after enthusiasm fades. Playtika’s public mark sat at only $1.28 billion in May 2026 despite large quarterly revenue and real DTC scale, while Stillfront’s market cap sat near $0.27 billion against a still meaningful revenue base. MTG, with a broader gaming mix and post-Plarium scale, held a stronger but still modest public valuation relative to revenue. At the other end, strategic-control transactions can still clear far larger values, with Take-Two paying an implied $12.7 billion enterprise value for Zynga and Savvy agreeing to buy Scopely for $4.9 billion. AppLovin proves why business-model discipline matters: its enormous market cap reflects marketing-platform economics, not a direct precedent for a single-company game operator. Combined with 2026 UA benchmarks showing rising CPI and CPM, the comp set points to a low- to mid-single-digit gaming multiple framework for Moon Active, not an AppLovin-like software rerating.",
