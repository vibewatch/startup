  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Public evidence supports Moon Active as a very large, probably cash-generative mobile-game company, but not as a tightly priceable private-equity story. The last disclosed corporate mark is the 2021 $5 billion secondary, while later evidence points instead to revenue above $2 billion, heavy Coin Master concentration, ongoing live-ops defense, and public comparables that span distressed sub-1x public multiples to strategic-control transaction premiums. The chapter therefore lands on a track recommendation with medium confidence, high risk, and explicit entry discipline rather than false precision."
  },
  "sections": [
    {
      "id": "stale-mark-versus-current-scale",
      "title": "A stale mark sits against a much larger business, but concentration still dominates the story",
      "body": "Moon Active is easy to describe as a scaled asset and hard to price as a current private security. The last well-documented corporate marks are old: Insight’s 2020 investment at a $1.25 billion valuation and the 2021 $300 million secondary at a $5 billion valuation. Since then, public reporting has shifted away from financing and toward operating scale. By 2024, retained coverage said Coin Master had crossed $6 billion of lifetime spending and roughly $1.2 billion of annual revenue since 2020, while Globes reported Moon Active ended 2024 with record revenue above $2 billion. That is enough to argue the business is larger than the stale $5 billion mark implies. It is not enough to argue that Moon Active deserves an unconstrained premium. Naavik’s Q1 2024 store-revenue split still gave Coin Master 73% of revenue, and the 2025 layoff reporting shows management is still tuning structure despite scale. The opening valuation conclusion is therefore straightforward: the stale mark is too low to anchor 2026 alone, but title concentration and private disclosure gaps still cap conviction.",
