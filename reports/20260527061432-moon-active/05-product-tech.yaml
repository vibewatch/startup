    {
      "id": "differentiation-portfolio-strategy-and-control-gaps",
      "title": "Differentiation, portfolio strategy, and control gaps",
      "body": "Moon Active's differentiation is therefore operational more than patent-led. Coin Master's design still matters, but the harder-to-copy layer is the company's ability to run promotions, economy experiments, ad-creative iteration, support playbooks, and cross-title portfolio bets. The Melsoft and Zen Match deals show M&A as an explicit expansion tool, while Board Adventure and Hole Stars suggest internal incubation is running in parallel. The portfolio is not risk free: PocketGamer says Pet Master, an earlier Coin Master follow-up, is no longer available on mobile, so Moon Active clearly experiments and kills products when they do not scale. Public evidence also remains thin where diligence would normally want hard controls. There is a visible security-report page, public privacy and terms links, and app-store data disclosures, but little on formal security certifications, anti-fraud outcomes, privacy-by-design metrics, or measured reliability performance. Brand, live-ops know-how, and cross-functional operating discipline look real; a public patent or proprietary-engine moat does not. The practical read is favorable on execution quality and mixed on durable defensibility beyond the best-performing titles.",
