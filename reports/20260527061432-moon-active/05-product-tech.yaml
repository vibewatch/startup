  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Moon Active now looks like a multi-title live-service operator, not just Coin Master: public app-store, hiring, and deal evidence shows active Coin Master, Travel Town, and Zen Match products, Melsoft assets Family Island and MyCafe in the portfolio, and newer experiments such as Coin Master: Board Adventure and Hole Stars. The operating model emphasizes rapid live ops, monetization and creative iteration, and shared cloud/support/legal infrastructure, while external disclosure on security, fraud, and reliability metrics remains thin."
  },
  "sections": [
    {
      "id": "product-portfolio-and-player-workflows",
      "title": "Product portfolio and player workflows",
      "body": "Moon Active sells repeatable mobile entertainment loops, not one generic casual app. Coin Master remains the flagship social-casino-builder experience: players spin, raid, attack, build villages, collect cards, join teams, and cycle through special events. Travel Town serves a different player job, built around merging items, completing villager missions, and rebuilding a town. Zen Match targets a calmer daily-habit loop, using tile matching, room decoration, plant care, and daily puzzles. Public deal reporting expands the picture further: Family Island and MyCafe entered the portfolio through Moon Active's Melsoft acquisition, while Zen Match later joined through the Good Job Games transaction. Newer public launch traces matter too. Coin Master: Board Adventure extends the flagship IP into a dice-and-board format, and Hole Stars shows Moon Active testing or launching another casual puzzle loop. In player-workflow terms, Moon Active is no longer just monetizing a single spin mechanic. It is operating multiple habit loops across social raid, merge, match, and lightweight action-puzzle genres, which is a stronger product-platform signal than a one-title studio would offer.",
