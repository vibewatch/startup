    {
      "id": "deployment-support-and-portfolio-release-cadence",
      "title": "Deployment, support, and portfolio release cadence",
      "body": "Deployment and support evidence also looks multi-title and always on. Coin Master's app-store pages show ongoing fixes and feature refreshes, while Travel Town and Zen Match both show current 2026 update activity rather than dormant acquired assets. Coin Master help-center articles document how Moon Active handles connection errors, failed purchases, missing items, and escalation paths; newer titles expose their own support URLs while reusing Moon Active legal surfaces. The clearest roadmap clues come from public product traces rather than a formal roadmap. Board Adventure takes Coin Master's social raid and collection logic into a board-and-dice format, and Hole Stars shows Moon Active launching or soft-launching a separate action-puzzle title with its own support route. Those signals matter because they imply the company can ship new clients, localize support, and reuse compliance scaffolding across titles. What public sources still do not reveal is integration depth: shared-code percentage, release orchestration quality, title-level SLOs, and title-by-title economics remain private.",
