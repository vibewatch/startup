  topStrengths:
    - >-
      Coin Master remains a genuine global franchise with multi-year top-grossing durability, more than $6B of lifetime
      spending, and public evidence that Moon Active ended 2024 above $2B of revenue.
    - >-
      Moon Active appears to have reached exceptional scale with limited visible primary funding, implying strong
      internal cash generation and strategic flexibility for acquisitions rather than survival financing.
    - >-
      Portfolio diversification is real enough to matter: Travel Town, Family Island, and Zen Match show Moon Active can
      buy or build meaningful adjacent casual-game revenue beyond the original flagship.
  topRisks:
    - >-
      Coin Master concentration is still heavy, with Naavik estimating 73% of Q1 2024 store revenue came from the
      flagship title.
    - >-
      The cap table, preference stack, current cash position, and audited 2025-2026 margins are not publicly disclosed,
      leaving the equity materially underwritten by inference rather than primary documents.
    - >-
      Platform tolls, rising user-acquisition costs, and regulatory pressure around casual-casino-style mechanics widen
      downside if monetization efficiency weakens.
  unresolvedGaps:
    - >-
      Current cap table, liquidation preferences, and recent secondary-clearing levels remain unavailable from public
      sources.
    - Audited 2025-2026 revenue, EBITDA, cash, debt, and deferred-revenue figures are still missing.
    - Title-level contribution margins, UA payback, and DTC share are not publicly disclosed.
    - Exact current headcount and board composition remain inconsistent or incomplete across retained public sources.
