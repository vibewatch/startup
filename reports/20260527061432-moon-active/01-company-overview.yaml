    "number": 1,
    "title": "Company Overview",
    "summary": "Moon Active is a private Israeli mobile-gaming company centered on Coin Master, a title that multiple 2024 sources say has surpassed $6 billion in lifetime player spending and roughly $1.2 billion of annual revenue since 2020. Public evidence supports a 2011 founding, Tel Aviv headquarters, Samuel Albin as founder-CEO, a $125 million 2020 Insight transaction, a $300 million 2021 secondary at a $5 billion valuation, and portfolio expansion via Melsoft and Zen Match, while exact current headcount, board composition, and audited financial disclosure remain materially opaque."
  },
  "sections": [
    {
      "id": "identity-scale-and-business-model",
      "title": "Identity, scale, and business model",
      "body": "Moon Active is best understood as a private Israeli mobile-gaming operator whose identity is still dominated by Coin Master. Official copy is intentionally broad: the company describes itself as one of the world’s fastest-growing mobile game companies and says its entertainment is enjoyed by millions of players. Independent sources fill in the sharper edges. Multiple retained profiles place headquarters in Tel Aviv and identify Samuel Albin as founder and CEO, while secondary coverage consistently treats Coin Master as the company’s defining product and the economic engine behind later expansion. The business model is free-to-play mobile gaming built around in-app purchases, progression loops, and live operations rather than packaged-game revenue. What makes Moon Active notable is not just title success but scale concentration: Sensor Tower-based reporting says Coin Master alone crossed $6 billion of lifetime player spending by August 2024, averaged about $1.2 billion annually since 2020, and still ranked among the world’s top-grossing mobile titles in 2024. That scale explains why Moon Active can look like a mature cash generator despite having far less publicly disclosed capital and governance detail than most companies with comparable economic output.",
