    {
      "id": "people-execution-and-financial-model-risk",
      "title": "People, integration, and financial-model risk: Moon Active is larger and broader, but still looks Coin Master-heavy and disclosure-light",
      "body": "The next risk tier is execution plus model quality. Moon Active's January 2026 layoffs matter precisely because they happened while the company still described itself as growing. CTech and Globes both put the cuts at roughly 110 employees, or 5% of staff, and Globes says the reductions hit the Lithuania operation tied to the Melsoft acquisition. That makes post-deal integration, morale, and regional coordination active risks rather than historical footnotes. The geopolitical overlay is also real: public company pages and job posts place major operating exposure in Israel, Kyiv, Warsaw, Bucharest, London, Lithuania, and legacy Belarus-linked Melsoft structures. On the financial side, public evidence still says the same two things at once. First, Moon Active is clearly large, profitable, and not obviously dependent on fresh primary equity: CTech says only about $10 million of true primary capital was ever raised, while later rounds were secondary sales. Second, the economics remain opaque where an investor most needs proof. Naavik still pegs 73% of Q1 2024 store revenue to Coin Master, public sources do not disclose whale concentration or title-level margins, and the visible valuation anchor remains a private 2021 $5 billion secondary round. That combination makes Moon Active look durable on scale and fragile on underwritten quality of earnings.",
