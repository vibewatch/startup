figures:
  - id: FU001
    title: Moon Active player journey map
    type: journey-map
    layout: wide
    summary: Public evidence shows a free-to-install journey that splits into social-raider, merge-builder, and calm-puzzle habits before feeding either support or cross-title exploration.
    data:
      items:
        - label: Discovery
          actor: New casual mobile player
          touchpoints:
            - App Store or Google Play discovery
            - Social, celebrity, or friend-led awareness
            - Another app mission or incentive install
          emotion: Curious and low-commitment
          painpoint: Little visibility into true retention or spend pressure before install
          opportunity: Free entry and recognizable Moon Active branding widen the funnel
        - label: First habit loop
          actor: Coin Master flagship player
          touchpoints:
            - Spin and raid loop
            - Teams, cards, and revenge mechanics
            - Early Facebook connection or gifting prompts
          emotion: Excited by fast rewards and social competition
          painpoint: Spins and progression bottlenecks appear quickly
          opportunity: Social loops deepen repeat use better than a pure slot app
        - label: Alternative habit loop
          actor: Travel Town or Zen Match player
          touchpoints:
            - Merge missions or daily tile puzzles
            - Villagers, rooms, plants, or events
            - Lower-intensity daily return behavior
          emotion: Relaxed but routine-driven
          painpoint: Energy limits, ads, or feature removals can break the promise
          opportunity: These titles diversify motivation beyond Coin Master's raid psychology
        - label: Support / friction
          actor: Spender, stuck player, or glitch-affected user
          touchpoints:
            - Title-specific help center
            - Review update or Trustpilot complaint
            - Refund or missing-item escalation
          emotion: Frustrated and highly sensitive to response quality
          painpoint: Public support transparency is weak relative to visible complaint volume
          opportunity: Better service could protect repeat spend and ratings
        - label: Expansion / portfolio exploration
          actor: Loyal Moon Active player or curious new audience
          touchpoints:
            - Google Play or Apple developer pages
            - Board Adventure, Hole Stars, or Family Bay listings
            - Official title-specific community pages
          emotion: Will test new loops when brand trust already exists
          painpoint: No public proof of cross-title overlap or migration efficiency
          opportunity: Portfolio adjacency can turn a single-title relationship into a multi-title one
    approximationNotes: >-
      This is a qualitative customer-journey figure synthesized from store pages, review surfaces,
      and support docs; Moon Active does not publish funnel-stage conversion rates.
    claimRefs:
      - CU038
      - CU039
      - CU041
  - id: FU002
    title: Public adoption and escalation flow
    type: flow
    layout: wide
    summary: Moon Active's public customer flow runs from free discovery into habit loops, then branches into social deepening, monetization friction, support, and possible cross-title migration.
    data:
      nodes:
        - id: discovery
          label: Free app discovery
          detail: Players encounter Moon Active through app stores, paid awareness, community sharing, or rewarded-install surfaces.
        - id: install
          label: Install and first session
          detail: Entry is free and the initial experience is built around fast early rewards, tutorials, and optional social connection.
        - id: habit
          label: Habit formation
          detail: Coin Master leans on raids, cards, and teams; Travel Town on merge orders and villagers; Zen Match on daily calm puzzles.
        - id: pressure
          label: Monetization or energy pressure
          detail: Progression slows when spins, energy, or ads create friction for non-payers or dissatisfied repeat users.
        - id: support
          label: Support and public feedback
          detail: Players either use title help centers or leave public reviews when glitches, missing items, or spend frustration appears.
        - id: expansion
          label: Cross-title exploration
          detail: The same player can discover other Moon Active titles through official portfolio pages or adjacent-title launches.
        - id: churn
          label: Churn or unresolved frustration
          detail: If support and value perception fail, players complain publicly and stop spending or leave entirely.
      edges:
        - from: discovery
          to: install
          label: Free download
        - from: install
          to: habit
          label: Early rewards and core loop
        - from: habit
          to: pressure
          label: Monetization and energy constraints emerge
        - from: pressure
          to: support
          label: Player seeks help or leaves feedback
        - from: support
          to: expansion
          label: Satisfied players stay in the portfolio
        - from: pressure
          to: churn
          label: Friction exceeds perceived value
        - from: habit
          to: expansion
          label: Brand trust enables adjacent-title trial
    claimRefs:
      - CU036
      - CU040
      - CU042
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Named player proof is strongest on current usage and friction visibility, but still weak on spend durability and formal cohort evidence.
    data:
      columns:
        - Production maturity
        - Outcome specificity
        - Durability signal
        - Evidence quality
      rows:
        - label: Nikki Applewhite / Coin Master
          values:
            - Live current user
            - Seven years of play; same team for almost one year
            - Strongest public flagship tenure signal
            - AppBrain review plus official app context
        - label: Tom P / Coin Master
          values:
            - Live current user
            - Explicit non-payer progression pain
            - Signals frustration, not durable monetization
            - AppBrain review plus broader complaint-pattern context
        - label: Yue Ai / Travel Town
          values:
            - Live current user
            - Offerwall-style acquisition plus event engagement
            - Weak long-term tenure disclosure
            - AppBrain review plus official app context
        - label: Madison Pohlen / Zen Match
          values:
            - Live current user
            - Positive support resolution after glitch
            - Current use visible; long tenure unclear
            - AppBrain review plus official app context
        - label: Amanda Rector / Zen Match
          values:
            - Live repeat user
            - About one year of play before connection issues
            - Moderate durability proof
            - AppBrain review plus official app context
    claimRefs:
      - CU038
      - CU040
