chapter:
  number: 6
  title: Customers
  summary: >-
    Moon Active's customers are mass-market consumer mobile players, with Coin Master still
    dwarfing the rest of the portfolio on ratings, downloads, and social-network depth.
    Travel Town and Zen Match prove the company now serves distinct merge and relaxation
    cohorts, but public durability evidence is still review-led rather than metric-led, and
    adverse complaints about monetization pressure and support quality remain visible.
sections:
  - id: segment-mix-and-public-adoption
    title: Segment mix and public adoption
    body: |
      Moon Active does not look like a B2B or channel-led customer story. The public customer
      surface is consumer mobile players who discover a free app, opt into a habit loop, and
      then either stay free, spend occasionally, or become repeat payers inside the game.
      Coin Master remains the flagship customer base: the official iOS page shows 1.3 million
      ratings, while AppBrain still tracks roughly 340 million lifetime Android downloads and
      top-grossing visibility across multiple European markets. Travel Town and Zen Match are
      not cosmetic add-ons. Their official pages and AppBrain profiles show separate, scaled
      communities with their own review volume, genre promise, and market footprint. Just as
      important, the segment mix is no longer one-dimensional. Coin Master serves social raid,
      card-collection, and revenge-oriented players; Travel Town serves merge-and-build
      players; Zen Match serves lower-intensity daily puzzle players. Moon Active's own site,
      plus the Apple and Google developer surfaces, now frame the company as a portfolio that
      serves several adjacent casual cohorts rather than a one-title studio.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU037
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU001
  - id: named-player-proof-and-repeat-usage
    title: Named player proof and repeat usage
    body: |
      The best public customer proof for Moon Active is not a polished enterprise case study;
      it is named player testimony embedded in store and review surfaces. AppBrain's 2026
      comments are especially useful because they expose identifiable handles, dates, and a
      mix of positive and negative experiences. Coin Master reviewer Nikki Applewhite says she
      has played for seven years and stayed with the same team for almost a year, which is a
      stronger durability signal than a raw rating count. Other public reviewers explain what
      keeps them returning: mini-games layered onto the core Coin Master loop, Travel Town's
      story and events, or Zen Match's calm puzzle cadence. The same evidence also shows the
      limits of this proof. These are still self-selected public reviewers, not audited user
      cohorts or named whale accounts. But they do prove that Moon Active's titles have real
      repeat users, real community behavior, and real frustration points at the player level,
      which is exactly the kind of customer texture the financial chapter could not supply.
    claimRefs:
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU040
    tableRefs:
      - TU003
      - TU004
    figureRefs:
      - FU003
  - id: support-surfaces-and-trust-friction
    title: Support surfaces and trust friction
    body: |
      Public durability evidence is mixed because Moon Active discloses customer-facing
      surfaces but not title-level retention metrics. Coin Master, Travel Town, and Zen Match
      each expose their own support route, and Zen Match's help center openly lists Daily
      Puzzles, Events, In-App Purchases, Advertisements, and Troubleshooting as recurring
      topics. That proves the company is operating an ongoing service layer, not just shipping
      dormant apps. At the same time, the strongest adverse customer evidence is not in those
      help centers but in reviews. Trustpilot's archived Moon Active profile is heavily skewed
      to one-star complaints about unauthorized charges, missing items, rigged outcomes,
      blocked progression, and generic support. Store disclosures add another caution: Coin
      Master carries Apple's 18+ label with simulated gambling, while Travel Town and Zen
      Match are 16+ with loot-box or randomized-item disclosure. What is missing is just as
      important. There is no public churn, DAU-to-MAU, repeat payer, or title-level NPS data,
      so the underwriting case has to rely on ratings, named comments, and support footprints
      rather than formal retention reporting.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU036
      - CU038
    tableRefs:
      - TU005
    figureRefs:
      - FU002
  - id: expansion-loops-and-concentration
    title: Expansion loops and concentration
    body: |
      The customer story is therefore better than a single-app reading but weaker than a fully
      diversified portfolio story. Naavik says 73% of Moon Active's Q1 2024 store revenue
      still came from Coin Master, so the company's most valuable customer community remains
      the flagship social-casino audience. That concentration is visible qualitatively too:
      Coin Master still has the deepest rating stack, biggest download base, and strongest
      social-network identity. The counterweight is that secondary communities look real. Naavik
      describes Travel Town as the top-grossing merge game and Zen Match as the third-highest
      earning tile-match title, while Moon Active's developer pages and new title listings show
      active experimentation around board, farm, merge, and puzzle-adjacent audiences.
      Coin Master: Board Adventure is the clearest example of expansion from an existing payer
      and social community into a new mechanic. Hole Stars and Family Bay point to broader
      top-of-funnel bets, but they do not yet prove net-new customer pools at scale. The right
      read is that Moon Active is broadening customer segments, but the business is still most
      exposed to the Coin Master cohort.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU039
      - CU041
      - CU042
    tableRefs:
      - TU006
    figureRefs: []
