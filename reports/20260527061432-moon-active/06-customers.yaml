  evidenceGaps:
    - type: enumeration-incomplete
      severity: minor
      topic: named-player-proof
      missingEvidence: A broader, cross-platform roster of identifiable repeat players by title, region, and spend status would make the named customer proof table more representative.
      whyItMatters: Public named-player proof is useful, but the current sample is still narrow and review-led rather than cohort-led.
      diligencePath: Export a larger review sample from Apple, Google Play, and support tickets, then stratify it by title, tenure, and monetization posture.
      relatedQuestionRefs:
        - QU008
        - QU011
        - QU012
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: payer-mix-and-whales
      missingEvidence: Title-level payer conversion, whale share, repeat payer mix, and payer retention by cohort are not public.
      whyItMatters: Customer quality in free-to-play mobile gaming depends on whether spend comes from a broad payer base or a narrow whale cohort.
      diligencePath: Request title-level payer conversion, ARPPU, repeat payer rate, and top-decile spend concentration from management or internal BI dashboards.
      relatedQuestionRefs:
        - QU024
    - type: private-evidence-only
      severity: material
      topic: cross-title-overlap
      missingEvidence: No public source quantifies how many Coin Master players migrate into Travel Town, Zen Match, Board Adventure, or newer experiments.
      whyItMatters: Without overlap data, it is impossible to know whether Moon Active is truly expanding its customer base or mainly recycling the flagship audience.
      diligencePath: Request internal cross-title MAU overlap, migration cohorts, and cross-promotion attribution by channel and geography.
      relatedQuestionRefs:
        - QU025
