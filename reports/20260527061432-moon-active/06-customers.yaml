        - Family Bay and Hole Stars
        - Try merge-farm or relaxing puzzle loops under the Moon Active label
        - Official Google Play listings prove live expansion into additional audiences
        - No public data on scale, monetization, or retention by title
    notes: >-
      Rows segment Moon Active's player base by title and motivation. Public evidence proves
