  - id: TU006
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Coin Master flagship scale and network effects
        - Largest player and payer base still dominates public scale and 73% of Q1 2024 store revenue per Naavik
        - Customer or regulatory shock to Coin Master would hit Moon Active's economics disproportionately
        - Request payer share, region mix, and repeat-spend concentration by title
      - - Travel Town merge audience
        - Meaningful standalone base but still materially smaller than Coin Master
        - Diversifies genre and likely geography but may not offset flagship weakness alone
        - Request title-level payer conversion, ARPPU, and retention by country
      - - Zen Match relaxation puzzle audience
        - Smaller title with visible feature-change sensitivity in reviews
        - Diversifies away from casino-adjacent behavior but could be more vulnerable to product-promise changes
        - Request retention before and after ad or room-feature changes
      - - Board Adventure adjacency
        - Could re-harvest the existing Coin Master audience rather than create a net-new one
        - Helpful extension if it monetizes existing loyalists; weak diversification if it mainly cannibalizes the flagship
        - Request migration, attachment, and new-user share versus base Coin Master
      - - Hole Stars and Family Bay experiments
        - New audience tests are visible but unproven at scale
        - Useful for widening the funnel, but they can also dilute live-ops focus if they fail to reach critical mass
        - Request CPI, payer mix, and early retention for newer titles
    notes: >-
      Expansion is visible in public listings, but concentration still runs through Coin Master.
      The key diligence question is whether newer titles bring net-new users or mainly recycle the flagship base.
