            body: >-
              Corelight's capital structure following the April 2024 Series E comprises approximately $310–340M in total
              equity capital raised across five rounds (seed through Series E), plus venture debt from TriplePoint
              Venture Growth BDC Corp (TPVG). The TPVG annual report for the period ending December 31, 2024, filed with
