        title: 'Financial gaps and diligence requirements: private metrics block underwriting'
        blocks:
          - type: paragraph
            body: >-
              Corelight's private-company status means that the public record leaves the majority of financially
              material inputs unconfirmed or entirely absent. The most critical gaps are: (1) actual ARR as of year-end
              2025 or early 2026 — the 40-plus percent growth claim is from April 2024 and no subsequent disclosure has
              confirmed whether growth has accelerated, maintained pace, or decelerated; (2) gross margin by stream —
              hardware appliance and professional services gross margins are structurally different from software
              subscription margins, and the mix shift toward SaaS could improve or worsen blended margin depending on
              cost structure; (3) NRR by customer cohort — land-and-expand economics are central to the NDR business
              model but remain unconfirmed, and a downward shift in NRR would materially impair the revenue quality
              story; (4) CAC and payback period — the enterprise sales motion targeting Fortune 500 companies and
              government agencies implies long sales cycles and high customer acquisition costs, but no public proxy
              exists; (5) BDC debt terms — the TPVG loan principal, interest rate, covenant package, and maturity
              schedule are not disclosed, meaning the actual debt service obligation remains opaque; (6) burn rate and
              runway — the $10–15M per month estimate is model-derived and requires cash-position confirmation. Without
              these six data points, a rigorous financial underwriting verdict is not achievable from public evidence
              alone. The financial evidence that is available points toward a strong-growth, high-quality revenue model
              at early-stage subscription scale — but the risk of undisclosed covenant pressure, accelerated burn, or
              growth deceleration cannot be dismissed without management-provided financials.
