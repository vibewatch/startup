      - - Core Engineering Team (Zeek experts, ML security researchers)
        - 'Specialized talent concentration: network protocol engineers, Zeek maintainers, ML security researchers'
        - Medium – competitive talent market; hyperscaler and PE-backed competitor poaching
        - Medium – loss of Zeek maintainers would slow sensor roadmap and community engagement
        - Equity compensation; research publication opportunities; mission-driven culture
        - >-
          Confirm engineering retention metrics, attrition rate, and equity refresh program; identify named Zeek
          maintainers and their departure provisions
      - - CMMC/FedRAMP Compliance Execution
        - 'Execution risk: internal GRC team must deliver FedRAMP ATO and CMMC certification on schedule'
        - Medium – compliance timelines regularly slip for cloud vendors
        - High – FedRAMP delay directly impacts government ARR ceiling
        - FedRAMP in-progress status; SOC 2 / ISO 27001 as foundation; 3PAO engagement assumed
        - Confirm 3PAO identity, FedRAMP expected ATO date, CMMC certification roadmap, and internal GRC headcount
    notes: >-
      CTO role publicly undisclosed as of May 2026 based on Corelight leadership page review. People risk assessments
      derived from public leadership disclosures and inference from company stage and strategy. Internal succession
      planning, employment agreements, and equity structures are not publicly available.
  - id: TR005
    title: Mitigation and Kill Criteria
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - FedRAMP authorization delay
        - FedRAMP Marketplace listing status; quarterly government ARR growth rate
        - FedRAMP ATO not achieved by Q4 2026 OR government ARR growth below 20% YoY
        - >-
          Recalibrate government revenue forecast; assess whether on-premises sensor bridge sustains government segment;
          may require valuation haircut
      - - Material security breach of Corelight sensor or SaaS
        - SEC incident disclosure equivalent; customer notification; CVE with active exploitation
        - Any confirmed unauthorized access to customer network metadata or sensor firmware
        - >-
          Kill criterion: breach would trigger mass contract termination clauses in government and enterprise; immediate
          reputational damage in security market requires exit evaluation
      - - Loss of major government contract or CISA advisory relationship
        - Public contract cancellation notice; CISA advisory list removal; federal procurement halt
        - Cancellation of contracts representing >15% of ARR OR CISA advisory relationship terminated
        - >-
          Kill criterion if concentration-weighted: triggers revenue cliff and removes government-sector premium from
          valuation
      - - Dominant Zeek fork by well-funded competitor
        - Open-source fork activity on GitHub; enterprise NDR vendor announces Zeek-based product competing directly
        - Fork accumulates >20% of Zeek GitHub stars or comparable enterprise adoption signal within 12 months
        - >-
          Kill criterion for current moat thesis: requires immediate reassessment of technical differentiation; pricing
          power would compress
      - - CrowdStrike or Cisco deprioritizes Corelight integration
        - Integration deprecation announcement; API access restricted; co-sell removal from partner programs
        - Either CrowdStrike or Cisco formally terminates or significantly restricts integration partnership
        - >-
          Significant near-term revenue and pipeline risk; requires reassessment of distribution strategy and
          partner-driven ARR
      - - CEO Brian Dye departure
        - CEO transition announcement; executive departure filing
        - Dye announces departure without named successor from existing leadership bench
        - >-
          Serious near-term operational risk; require emergency board engagement and succession plan review; may extend
          M&A timeline
      - - Vern Paxson departure or IP dispute
        - Paxson departure announcement; ICSI legal action or trademark dispute
        - Paxson formally disengages from Corelight OR ICSI initiates trademark renegotiation
        - Community credibility risk; IP ownership diligence becomes urgent; assess IP assignment agreement immediately
      - - Hyperscaler native NDR displaces third-party market
        - AWS/Azure/Google launches native NDR competing with Corelight in cloud-sensor use case
        - Hyperscaler native NDR achieves parity with Corelight's cloud sensor in independent benchmark
        - >-
          Re-evaluate total addressable market ceiling; on-premises and hybrid segments retain value but cloud sensor
          growth thesis impaired
    notes: >-
      Kill criteria are defined as events that would require a fundamental reassessment of the investment thesis, not
      merely a downward revision. Monitorable triggers are designed to be observable through public information channels
      or standard investor reporting. Thresholds are qualitative benchmarks for this analysis; actual investment-level
      thresholds should be calibrated to specific portfolio position size and risk tolerance.
  - id: TV001
    title: Investment Recommendation Summary
    columns:
      - Dimension
      - Assessment
      - Confidence
      - Implication
    rows:
      - - Recommendation
        - TRACK — do not deploy capital at current implied valuation without additional diligence
        - Medium
        - >-
          Monitor for NRR confirmation, cap table disclosure, TPVG debt terms; upgrade to BUY if all six diligence asks
          are answered satisfactorily
      - - Implied Enterprise Value
        - $1.0B–$1.5B (inferred from Series E round size, comparable company multiples, and NDR sector benchmarks)
        - Low — not disclosed by company
        - >-
          Valuation is competitive but not cheap; premium to Darktrace public comp requires NRR and growth rate
          confirmation
      - - Entry Multiple
        - 7–10x estimated forward ARR ($120–160M ARR at April 2024 close)
        - Low — ARR not publicly disclosed
        - >-
          Multiple is consistent with NDR private benchmarks (ExtraHop 5–7x at M&A; Vectra AI 8–15x private round) but
          not a valuation bargain
      - - Market Position
        - >-
          Gartner MQ Leader (NDR 2024, 2025); Forrester Wave Leader (NAV 2023); highest-quality NDR open-source
          telemetry
        - High — dual third-party validated
        - >-
          Market position is the strongest investment thesis pillar; drives deal shortlisting and reduces commercial
          risk
      - - Risk Rating
        - >-
          Medium-High — preference stack unknown; NRR unconfirmed; venture debt present; FedRAMP incomplete; valuation
          opaque
        - Medium
        - Multiple risk factors co-present; no single risk is deal-breaking but the combination justifies caution
      - - Exit Timeline
        - 2026–2028 (IPO or strategic M&A most likely paths given investor syndicate profile and growth stage)
        - Low — no disclosed event timing
        - >-
          Investor profile (Accel, GC, IP) is consistent with IPO preparation; strategic investors (CrowdStrike, Cisco)
          create M&A optionality
    notes: >-
      All assessment values are analyst-estimated based on public information unless noted as confirmed. ARR, NRR, and
      valuation figures are inferred from comparable company analysis and public signals; they have not been confirmed
      by Corelight or a financial auditor. Confidence ratings reflect the quality of available public evidence
      supporting each dimension.
  - id: TV002
    title: Investment Thesis vs. Anti-Thesis
    columns:
      - Thesis Factor
      - Supporting Evidence
      - Anti-Thesis Risk
      - Evidence Quality
      - What Would Change the View
    rows:
      - - NDR Market Leadership (dual Gartner/Forrester)
        - Gartner MQ Leader 2024–2025; Forrester Wave NAV Leader 2023; consistent multi-year analyst recognition
        - Analyst rankings do not guarantee revenue; vendors can lose rankings with one bad product cycle
        - High — third-party confirmed
        - >-
          Loss of Gartner MQ Leader status in 2026 cycle would signal competitive displacement and move recommendation
          to PASS
      - - Zeek Open-Source Moat
        - >-
          Corelight employs core Zeek maintainers; 400+ protocol parsers; dominant adoption in government SOCs and Five
          Eyes
        - BSD license allows forks; a well-funded competitor or hyperscaler could fund a rival Zeek distribution
        - High — confirmed from public open-source project data
        - A materially adopted Zeek fork (e.g., hyperscaler-backed) would erode the differentiation thesis
      - - Government Revenue Concentration
        - Estimated 30–40% ARR from US government/IC/Five Eyes; CISA national-level advisory relationship
        - >-
          Government concentration creates contract cliff risk; single large contract loss can have outsized ARR impact;
          FedRAMP gap limits cloud growth
        - Medium — revenue mix is estimated, not confirmed
        - Loss of a major government anchor contract (e.g., CISA, DoD agency) would trigger thesis-break review
      - - Series E Investor Quality
        - >-
          Accel lead; General Catalyst; Insight Partners; CrowdStrike Falcon Fund; Cisco Investments; all confirmed by
          PR Newswire and investor portfolio pages
        - >-
          Strategic investors (CrowdStrike, Cisco) have conflict-of-interest risk; their information rights could
          benefit competitors in M&A
        - High — confirmed
        - >-
          Series E term sheet review could reveal unfavorable anti-dilution, ROFR, or information rights provisions that
          impair exit optionality
      - - 40%+ ARR Growth Rate
        - Company-disclosed in April 2024 Series E press release; SaaS/cloud segment growing 300% YoY
        - >-
          Growth rate was a point-in-time disclosure; no trailing four-quarter confirmation; may have decelerated
          post-announcement
        - Low — single data point, company-claimed, not independently verified
        - Confirmed ARR growth below 25% YoY for two consecutive quarters would compress multiple to bear-case range
      - - Path to IPO or M&A Exit
        - >-
          Investor syndicate profile consistent with 3–5 year liquidity horizon; Insight Partners and Accel have
          established IPO track records
        - >-
          Macro environment (rising rates, tech multiple compression) could delay IPO window; strategic M&A requires
          competitive bidding or single acquirer interest
        - Medium — no public timeline or banker engagement confirmed
        - Extended hold period beyond 2029 without liquidity event would significantly impair IRR mathematics
    notes: >-
      Thesis and anti-thesis factors are assessed from public sources and analyst inference. Risk factors are not
      binary; they exist on a spectrum of probability and severity. No single anti-thesis factor is independently
      deal-breaking, but the combination of valuation opacity, unconfirmed NRR, and venture debt warrants a TRACK rather
      than BUY recommendation until all six diligence asks are resolved.
