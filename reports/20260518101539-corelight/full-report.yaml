      - number: '5.5'
        title: Trust, Compliance, and Security Posture
        blocks:
          - type: paragraph
            body: >-
              Corelight has invested in enterprise trust certifications appropriate for its target market of Fortune 500
              corporations and federal government agencies. The company holds a SOC 2 Type II certification, confirming
              that an independent auditor has examined its security, availability, processing integrity,
              confidentiality, and privacy controls over a defined period and found them to meet the AICPA Trust
              Services Criteria. ISO 27001 certification attests to a formally structured information security
              management system (ISMS) aligned to the international standard, which is an increasingly common
              requirement for European and multinational enterprise procurement. HIPAA-capable status means Corelight's
              deployment architecture can be configured to handle PHI-adjacent network telemetry in healthcare
              environments, though HIPAA is not an auditable certification in the same sense as SOC 2 or ISO 27001.
              FedRAMP authorization is in progress as of early 2026; for federal government customers that require
              FedRAMP-authorized cloud services, the current status represents a procurement barrier that limits
              addressable market in the civilian agency segment until authorization is complete. Corelight's
              architecture separates sensor data processing (on-premises or in the customer's cloud environment) from
              the management plane (Corelight SaaS services), which gives customers the option to keep all raw network
              telemetry within their own environment—a significant selling point for data-sovereignty-sensitive buyers
              including government agencies and regulated enterprises. The open-core model introduces a dependency risk:
              if a significant security vulnerability is discovered in the Zeek or Suricata open-source base, Corelight
              is responsible for patching and distributing updated sensor software, creating a potential lag between
              public vulnerability disclosure and enterprise patch deployment. No public bug bounty program or
              coordinated vulnerability disclosure policy has been confirmed from public sources as of May 2026,
              representing a diligence gap for security-conscious enterprise buyers. The company's physical sensor
              appliances undergo hardware validation and the software distribution chain is managed through Corelight's
              commercial update mechanism, separate from the upstream Zeek open-source release cadence.
