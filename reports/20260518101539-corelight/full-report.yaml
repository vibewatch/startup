      - number: '1.4'
        title: Financial Scale and Operational Metrics
        blocks:
          - type: paragraph
            body: >-
              As a private company, Corelight does not publicly disclose revenue, ARR, gross margin, customer count, or
              profitability metrics. The most reliable publicly available financial indicators are self-reported metrics
              from the April 2024 Series E press release: over 40% year-over-year ARR growth and 300% year-over-year
              growth in AI and SaaS-driven NDR solutions. Both figures are company-claimed and unverified by independent
              auditors. The platform metrics disclosed by Corelight include more than 70,000 out-of-the-box detection
              signatures covering behavioral, AI, and ML detections; claims of 95% faster incident response compared to
              alternative approaches; and 4:1 tool consolidation ratios enabling customers to reduce their security
              toolstack. These metrics serve as proxy indicators for platform depth and adoption velocity, but cannot
              substitute for audited financial statements. Headcount, inferred from professional network data as of
              early-to-mid 2026, is approximately 464–473 employees. Corelight has offices or presence in San Francisco
              (global HQ), and operates across North America, EMEA, and APAC. The company's customer base—while not
              publicly enumerated with counts—is described as including Fortune 500 companies, major government
              agencies, and large universities. Corelight is the NDR platform of choice for elite cybersecurity services
              teams at CrowdStrike and Mandiant, and serves as the network monitoring platform for the Black Hat
              conference network operations center (NOC), which represents a credibility signal to the broader security
              community. The absence of disclosed revenue, ARR, customer count, net retention rate, gross margin, and
              burn rate is a significant limitation for quantitative diligence, requiring investors to rely on
              qualitative signals and the credibility of the investor syndicate as proxies for financial health.
