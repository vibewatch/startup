  - id: FU001
    title: Corelight Enterprise Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Seven-stage customer journey from initial awareness of Corelight through long-term expansion, covering the
      distinct paths for enterprise commercial and US government buyers. Government buyers have longer procurement
      cycles, stricter compliance requirements (FedRAMP, clearances), and higher switching costs. Enterprise commercial
      buyers move faster through evaluation but require competitive bake-off against bundled alternatives. Both paths
      converge at production deployment and expand through cloud sensor and SaaS upsell.
    data:
      items:
        - id: journey-item-awareness
          label: Discovery Path
          description: >-
            Primary discovery channels: Gartner/Forrester analyst reports, Black Hat NOC reference, peer referrals from
            CrowdStrike/Mandiant IR teams, Dark Reading / security press, and Zeek open-source community. Enterprise and
            government buyers discover Corelight through security practitioner communities, Dark Reading / SC Magazine
            coverage, Gartner MQ and Forrester Wave reports, CrowdStrike and Mandiant referrals during IR engagements,
            or direct outreach from Corelight's enterprise sales team.
          tone: neutral
        - id: journey-item-evaluation
          label: PoC and Bake-Off
          description: >-
            30–90 day remote-deployable PoC; minimal setup friction confirmed in PeerSpot reviews; competitive
            evaluation against ExtraHop, Darktrace, Vectra, Cisco. Government path adds FedRAMP and compliance review.
            PeerSpot reviewers confirm PoC is 'straightforward and easy, often handled remotely', reducing evaluation
            friction.
          tone: neutral
        - id: journey-item-procurement
          label: Procurement / Contract
          description: >-
            Enterprise procurement (3–9 months for large accounts), legal and security review, MSA execution. Government
            procurement extends to 6–18 months due to FAR/DFARS compliance requirements, RFP processes, and budgetary
            authorization cycles. Contract structured as annual or multi-year subscription.
          tone: neutral
        - id: journey-item-production
          label: Production Value Realization
          description: >-
            Full sensor deployment across production network segments; Zeek and Suricata rule tuning; SIEM integration
            (Splunk, Microsoft Sentinel, Chronicle, QRadar). Post-deployment value: network-wide threat visibility, SIEM
            enrichment, faster IR (95% claim), platform stability rated highly. CSM + TAM model deepens post-sale
            engagement. Black Hat NOC confirms resilience under adversarial conditions.
          tone: positive
        - id: journey-item-expansion
          label: Land-and-Expand Motion
          description: >-
            Three-layer expansion path: cloud sensors for hybrid/cloud workloads (300% SaaS growth YoY 2024),
            Investigator SaaS for analyst workflows, throughput upgrades as network grows. Multi-year renewal with
            throughput tier upgrades, additional sensor deployments for new business units or geographies, and
            incremental Investigator seats. NRR estimated at 115–130%.
          tone: positive
