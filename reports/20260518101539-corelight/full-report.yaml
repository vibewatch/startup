  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >-
              Network Detection and Response (NDR) is the security market category encompassing software and appliance
              products that capture, analyze, and alert on network traffic at scale to detect, investigate, and respond
              to cyber threats that evade perimeter and endpoint controls. NDR platforms ingest raw network packets or
              flow records, apply behavioral baselines, machine learning models, threat intelligence, and
              signature-based rules to identify anomalous or malicious activity across east-west lateral movement,
              command-and-control (C2) communications, and data exfiltration paths invisible to endpoint agents and
              firewalls. Gartner formally defined the NDR category in its inaugural Magic Quadrant for Network Detection
              and Response, separating it from the broader Network Traffic Analysis (NTA) label used earlier. Forrester
              covers an overlapping but slightly broader category it calls Network Analysis and Visibility (NAV), which
              includes NDR alongside packet-capture and network performance monitoring tools; Corelight competes in the
              NDR core and the NAV overlap. The NDR category includes enterprise-grade detection platforms with sensors
              (physical, virtual, and cloud-native), detection engines, and investigation workbenches—but explicitly
              excludes pure SIEM/SOAR platforms, perimeter firewalls, intrusion prevention systems (IPS) without
              behavioral analytics, and endpoint detection and response (EDR) agents operating without network
              telemetry. NDR's share of the broader network security wallet is modest but fast-growing: NDR represents
              roughly 3–4% of the $25-billion-plus total network security market estimated by IDC, but it captures a
              disproportionate share of enterprise security budget growth as CISO attention shifts from perimeter
              hardening to detection and response. Adjacent and overlapping categories include Extended Detection and
              Response (XDR), which aggregates endpoint, identity, cloud, and network telemetry under a single vendor
              umbrella, and Cloud-Native Application Protection Platforms (CNAPP), which provide cloud workload
              visibility that partially overlaps NDR's east-west traffic analysis function. Corelight's Open NDR
              Platform competes on the explicit claim that open-source foundations (Zeek, Suricata, Sigma) and
              vendor-agnostic integrations differentiate it from proprietary closed NDR platforms, enabling deployment
              across physical, virtual, and multi-cloud sensor environments that closed platforms cannot replicate.
            claimRefs:
              - CM001
              - CM002
              - CM022
              - CM023
              - CM029
              - CM030
              - CM032
