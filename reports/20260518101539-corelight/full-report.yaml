        Corelight's publicly disclosed government customer base and cloud product strategy. Specific regulatory
        correspondence, legal opinions, or internal compliance documentation not available for a private company;
        entries represent assessed exposure, not confirmed findings.
    columns:
      - Rule / License / Issue
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Mitigation
      - Residual Exposure
      - Diligence Path
    rows:
      - - FedRAMP Authorization (cloud products)
        - US Federal
        - In progress – not yet authorized as of mid-2026
        - High – certain requirement; timeline uncertain
        - High – blocks cloud sales to civilian agencies
        - On-premises sensor sales bridge; FedRAMP in-progress listing
        - High – each quarter of delay closes cloud ARR opportunities
        - Request FedRAMP authorization timeline, 3PAO engagement letter, and Agency ATO interim arrangements
      - - Export Administration Regulations (EAR) – dual-use cybersecurity tools
        - US (BIS/Commerce)
        - Active regulatory framework; Corelight compliance status unknown
        - Medium – network security ML tools potentially classifiable under ECCN 4E001/5E002
        - High – non-compliance could result in export privilege denial and penalties
        - Assumed EAR compliance procedures in government sales; no public disclosure
        - Medium – deemed-export risk for international engineering staff; international sales licensing
        - >-
          Request EAR classification opinion, denied-party screening program documentation, and deemed-export analysis
          for key engineering personnel
      - - GDPR / Schrems II (EU customer data processing)
        - EU / EEA
        - Active requirement for EU customer deployments; compliance status unconfirmed
        - Medium – EU customers using cloud-hosted Investigator / NDR Platform
        - Medium – regulatory fines up to 4% global annual turnover; contract termination risk
        - Data Processing Agreements with EU customers; architectural data-in-region option
        - Medium – SaaS metadata processing of IP/DNS could constitute personal data
        - >-
          Request DPA templates, SCCs or equivalent transfer mechanism documentation, and data residency options for EU
          customers
      - - CCPA (California consumer data)
        - California, US
        - Active requirement; SaaS platform processes network metadata potentially containing consumer data
        - Low-medium – indirect exposure through enterprise customer data
        - Low – civil penalty exposure; primarily contractual risk
        - Enterprise customer DPA and CCPA addenda in customer agreements
        - Low – primarily addressed through enterprise contract terms
        - Confirm CCPA addenda are included in standard enterprise MSAs
      - - CMMC 2.0 (Cybersecurity Maturity Model Certification) – DoD supply chain
        - US DoD
        - Rulemaking effective; DoD contractors required to comply; Corelight as vendor to DoD must align
        - Medium – DoD procurement opportunity contingent on CMMC-compliant product posture
        - Medium – failure to certify limits DoD supply-chain contracts
        - SOC 2 Type II and ISO 27001 provide partial overlap; CMMC gap analysis not publicly disclosed
        - Medium – CMMC Level 2 or 3 certification may be required for some DoD contracts
        - Request CMMC gap analysis and certification roadmap for DoD-targeted products
      - - Suricata GPL v2 copyleft license compliance
        - US / International
        - Active compliance obligation; Suricata embedded in sensor firmware
        - Low-medium – proprietary code linked against GPL v2 components
        - Medium – OISF copyright claims could require source disclosure or product injunction
        - Architectural separation of GPL and proprietary code; license audit
        - Low-medium – requires formal SBOM and GPL boundary confirmation
        - Request software bill of materials (SBOM) and legal opinion on GPL v2 compliance boundary in sensor firmware
      - - Zeek ICSI Trademark License dependency
