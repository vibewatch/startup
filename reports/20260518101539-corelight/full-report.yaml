      - number: '2.2'
        title: Market Sizing and Growth Trajectories
        blocks:
          - type: paragraph
            body: >-
              Multiple independent analyst reports triangulate the NDR market at $3.0–3.4 billion in 2024, with forward
              projections ranging from $6.5 billion to $9.0 billion by 2028–2030. MarketsandMarkets estimates the NDR
              market at approximately $3.1 billion in 2024, growing to approximately $7.5 billion by 2029 at a 19.2%
              CAGR, driven by increasing sophistication of cyberattacks, rapid digitization of enterprise
              infrastructure, and growing regulatory compliance mandates. Mordor Intelligence published a separate
              report estimating the NDR market at approximately $3.0 billion in 2024 with a 15.4% CAGR through 2029,
              reaching approximately $6.5 billion—the lower bound of the analyst range. Grand View Research's
              independent bottom-up model projects the market at $3.4 billion in 2024 growing to approximately $8.5
              billion by 2030 at approximately 20% CAGR, reflecting higher estimates from including managed NDR service
              revenue. These three independent lens estimates produce a weighted central estimate of approximately
              $3.1–3.2 billion for 2024 NDR spend, with the 2028 central projection at approximately $7.0–7.5 billion,
              implying a 17–18% CAGR. This is the SAM estimate for the NDR-specific market. The broader TAM—defined as
              all enterprise network security tooling in which NDR competes for budget, including network performance
              monitoring, NAV, and XDR network telemetry—is estimated by IDC at over $25 billion globally for network
              security appliances and software combined, though IDC covers a broader definitional scope. Corelight's
              serviceable obtainable market (SOM) is estimated at $300–500 million in 2024, reflecting its leadership
              position among pure-play Open NDR vendors, enterprise focus (Fortune 500 and government, not SMB), and
              current ARR trajectory. From a lens-1 perspective (MarketsandMarkets), the NDR market is growing rapidly
              enough to sustain multiple well-funded competitors while providing Corelight a credible path to $500
              million+ ARR within the planning horizon. From a lens-2 perspective (Mordor Intelligence), even the
              conservative estimate of 15% CAGR implies the market nearly doubles by 2031, creating durable long-term
              opportunity. CAGR estimates across analysts range from 15% to 25%, with the spread reflecting definitional
              differences (pure NDR vs. NAV vs. network security broadly) and geographic scope assumptions.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM021
              - CM022
              - CM023
              - CM024
