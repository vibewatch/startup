      - - Regulatory compliance and audit
        - >-
          Manual packet evidence collection for audit; compliance teams rely on firewall logs with limited
          application-layer detail
        - >-
          Protocol-level logs capture application transactions (HTTP, DNS, SMTP) relevant to HIPAA, PCI-DSS, NERC CIP
