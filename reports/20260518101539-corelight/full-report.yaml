            body: >-
              The NDR market exhibits a moderately fragmented competitive structure with several well-funded pure-play
              vendors and growing participation from large security platform companies. The 2025 Gartner Magic Quadrant
              for Network Detection and Response recognized Corelight as a Leader, placing it in the quadrant's
              upper-right for completeness of vision and ability to execute. Other vendors in the Gartner NDR MQ include
              ExtraHop (acquired by Arista Networks in 2021 and rebranded to Reveal(x)), Darktrace, Vectra AI, and Cisco
              Secure Network Analytics (formerly Stealthwatch). In the 2023 Forrester Wave for Network Analysis and
              Visibility, Corelight was also named a Leader. The pure-play NDR competitive set breaks down as follows:
