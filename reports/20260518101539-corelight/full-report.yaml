      - number: '5.3'
        title: 'Key Detection Capabilities: ETA, ML Analytics, Smart PCAP, and MITRE Coverage'
        blocks:
          - type: paragraph
            body: >-
              Corelight delivers a layered detection capability set that addresses both the breadth of protocol
              visibility and the depth of behavioral analysis required for modern enterprise SOC operations. Encrypted
              Traffic Analysis (ETA) is among the most strategically significant capabilities: by extracting cipher
              suite metadata, certificate chain details, JA3/JA3S fingerprints, and behavioral features from TLS
              handshakes without decrypting session content, Corelight can identify suspicious encrypted communication
              patterns—including command-and-control channels, malware beaconing, and anomalous certificate usage—while
              preserving data privacy and avoiding the legal and performance complexities of full TLS interception.
              Smart PCAP provides selective full-packet capture: rather than continuously storing multi-terabyte PCAP
              files, Smart PCAP records complete packet data only when a detection event triggers a capture window,
              providing the forensic detail of PCAP at a fraction of the storage cost. Domain Generation Algorithm (DGA)
              detection identifies malware that uses algorithmically generated domain names for command-and-control
              rendezvous, an evasion technique that bypasses static blacklists. Command and control (C2) traffic
              detection combines ML-based beaconing analysis, Suricata signatures, and Zeek protocol metadata to flag
              adversary infrastructure communications. Lateral movement detection tracks internal network behaviors
              consistent with credential theft, pass-the-hash, Kerberoasting, and SMB-based traversal. File analysis
              capabilities include SHA256 hashing and MIME type detection for every file transferred across observed
              protocols, creating a searchable inventory of file transfers without storing file contents by default. The
              platform claims coverage of more than 80 MITRE ATT&CK tactics, techniques, and procedures (TTPs) and ships
              with over 70,000 out-of-the-box detection signatures. Company-claimed performance benchmarks include 95%
              faster incident response and 4:1 tool consolidation versus alternatives, though these claims have not been
              independently audited. The Black Hat conference NOC deployment and Mandiant/CrowdStrike partnerships serve
              as informal performance proof points in high-fidelity, high-volume environments.
