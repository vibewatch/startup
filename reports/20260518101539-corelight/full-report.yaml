      - number: '6.4'
        title: Retention, NRR, and Customer Health Indicators
        blocks:
          - type: paragraph
            body: >-
              Corelight does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), customer
              churn rates, or cohort data. The NRR estimate of 115–130% is derived from three proxy signal categories.
              First, product structure: the layered deployment model (physical sensors → virtual sensors → cloud sensors
              → Investigator SaaS) creates three natural upsell vectors within each account, structurally enabling NRR
              above 100% without requiring any competitive displacement. Existing sensor customers who add cloud
              coverage for AWS/Azure/GCP deployments and then add the Investigator SaaS analytics layer can expand ACV
              by 2–3x over the initial contract without changing vendors. Second, customer satisfaction signals:
              PeerSpot reviewers consistently rate support as 'responsive, helpful, and knowledgeable', with access to
              customer success managers and technical account managers. Advisory board participation further deepens
              customer engagement with the Corelight product roadmap. High-quality post-sale support and advisory access
              are consistent with enterprise SaaS businesses achieving NRR in the 110–130% range. Third, institutional
              investor proxies: Accel's decision to lead both the 2017 Series A and the 2024 Series E represents a
