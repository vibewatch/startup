  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product Portfolio: Five Lines Covering On-Premises, Virtual, Cloud, and Managed NDR'
        blocks:
          - type: paragraph
            body: >-
              Corelight markets five distinct product lines that collectively address network detection and response
              (NDR) across on-premises data centers, virtualized environments, cloud-native workloads, and fully managed
              deployments. The flagship offering is the Corelight Sensor, a purpose-built physical network appliance
              available in 1G, 10G, and 100G throughput variants designed to tap high-speed enterprise network links and
              produce rich Zeek-based telemetry. Physical sensors are the most mature offering and carry the strongest
              compliance posture, having undergone the most rigorous enterprise production validation. The Corelight
              Virtual Sensor targets customers who cannot deploy physical taps, supporting VMware ESXi and KVM
              hypervisors for deployment inside virtualized data centers and private clouds. The Corelight Cloud Sensor
              addresses the growing share of enterprise workloads running in public cloud environments, supporting AWS
              VPC Traffic Mirroring, Azure vTAP, and GCP Packet Mirroring as of its 2024-2025 GA release for all three
              major cloud providers. Corelight Investigator is a cloud-delivered SaaS web application providing security
              analysts with an intuitive threat investigation UI layered on top of the structured log data produced by
              any Corelight sensor type. The fifth product, the Corelight NDR Platform, is a cloud-based managed
              detection service providing continuous threat monitoring for organizations that do not want to operate the
              analytics infrastructure themselves. Together these five lines allow Corelight to address enterprise
              accounts with heterogeneous infrastructure, reducing the need for multiple vendor relationships and
              positioning Corelight as a full-stack network visibility solution rather than a point product. A key
              strategic decision embedded in the portfolio is the open data model: every product line exports structured
              JSON logs compatible with any SIEM or data lake, which prevents customer lock-in to proprietary analytics
              formats and is a deliberate competitive differentiator versus closed NDR competitors.
