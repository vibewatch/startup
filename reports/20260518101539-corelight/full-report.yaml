  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Legal Risk: FedRAMP, Export Controls, GDPR, CMMC, and Open-Source License'
        blocks:
          - type: paragraph
            body: >-
              Corelight's regulatory and legal risk profile is dominated by five active exposure categories, each with
              distinct materiality and mitigation maturity. The most immediate commercial risk is the incomplete FedRAMP
              authorization for the Corelight cloud platform. FedRAMP (Federal Risk and Authorization Management
              Program) is the mandatory US government cloud security authorization framework; without an authorized
              listing on the FedRAMP Marketplace, civilian federal agencies cannot procure cloud-hosted Corelight
              Investigator or NDR Platform services. As of mid-2026, Corelight is listed as FedRAMP authorization "in
              progress," not yet authorized. Given that government customers represent an estimated 30–40% of
              Corelight's ARR and that the federal civilian cloud market is growing rapidly, this gap directly limits
              addressable revenue. Physical on-premises sensors remain deployable in classified and sensitive
              environments without FedRAMP, but the SaaS and managed platform products are constrained. The FedRAMP
              process is resource-intensive — typically requiring 12–24 months and millions of dollars in compliance
              investment — and the outcome is not guaranteed. Export control risk under the Export Administration
              Regulations (EAR) administered by the US Department of Commerce Bureau of Industry and Security (BIS) is
              material for network security monitoring technology. Cybersecurity tools with ML-based behavioral
              analytics are potentially classified under Export Control Classification Number (ECCN) 4E001 or 5E002
              categories, which restrict export to certain jurisdictions without a license. Corelight's
              government-sector focus, including intelligence community and Five Eyes partner relationships, creates a
              dual-use classification risk that must be actively managed. Additionally, any international personnel with
              access to the most sensitive analytics source code or trained model weights may trigger deemed-export
              considerations under ITAR/EAR. GDPR risk is present for EU-headquartered customer deployments because
              Zeek-generated network logs can contain IP addresses, DNS query content, and HTTP headers, all of which
              may qualify as personal data under Article 4 GDPR. If Corelight's cloud infrastructure processes EU
              personal data without adequate data processing agreements, Standard Contractual Clauses, or Schrems
              II-compliant transfer mechanisms, it could face regulatory action from EU data protection authorities.
              CCPA creates parallel obligations for California-resident data processed in SaaS contexts. Corelight's
              open-source license compliance risk centers on three components: Zeek (BSD 3-Clause, permissive), Suricata
              (GPL v2, copyleft), and various third-party packages. The GPL v2 copyleft in Suricata requires that any
              distribution of software linked with Suricata comply with GPL v2's source disclosure requirements.
              Corelight ships Suricata as an embedded analytics engine within its sensor software; if sensor firmware
              includes proprietary ML code linked against GPL v2 libraries, a license-compliance defect could expose
              Corelight to copyright claims from the Open Information Security Foundation (OISF), which owns Suricata.
              The Zeek trademark — the "Z and Design" mark and the ZEEK mark — is owned by the International Computer
              Science Institute (ICSI) and is licensed to Corelight under a trademark license agreement. This creates a
              legal dependency: if Corelight and ICSI were to dispute the license terms, Corelight could lose the right
              to use "Zeek" in product and marketing materials, forcing an expensive and disruptive rebrand of its
              central technical asset. This risk is low probability but high severity.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
