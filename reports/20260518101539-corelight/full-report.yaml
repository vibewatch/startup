      - number: '3.2'
        title: Head-to-Head Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              ExtraHop RevealX is Corelight's most technically comparable direct competitor. Now listed as an Arista
              Networks product following acquisition, RevealX combines network performance monitoring with NDR under a
              unified architecture, differentiating through what ExtraHop markets as an "Agentic SOC" capability and
              machine learning-driven detection models covering threat detection, incident response, and performance
              monitoring. ExtraHop was named a Leader in the Forrester Wave: Network Analysis and Visibility Solutions
              Q4 2025, establishing direct analyst parity with Corelight's prior Forrester Leader designation. ExtraHop
              targets enterprise and government accounts and competes directly with Corelight in regulated industries.
              Its key limitation versus Corelight is a proprietary data model that constrains open data export and
              creates vendor lock-in, and less community-anchored open-source positioning.

              Darktrace is a UK-listed public company (DARK.L) that differentiates on Self-Learning AI, which
              continuously models normal behavior for every user, device, and network connection to detect anomalies
              without signatures or rules. Darktrace reported approximately $410 million ARR for FY2024 and has expanded
              well beyond pure NDR to cover email security, OT, and cloud workloads in a single AI-first platform—making
              it the broadest-scope direct NDR competitor to Corelight. Darktrace's strength is autonomous response
              breadth and AI platform ambition; its limitation is an opaque Self-Learning AI model that security
              analysts distrust for forensic investigation work, where Corelight's evidence-based structured logs
              provide more actionable investigation depth.

              Vectra AI has raised approximately $300 million in total venture funding, with a platform centered on
              AI-driven attack signal intelligence for hybrid and multi-cloud environments. Vectra AI's Cognito platform
              provides NDR with strong Azure and Microsoft Defender integration, making it well-positioned in
              Microsoft-standardized enterprises. Vectra AI received the Gartner Peer Insights Customer First
              distinction in 2023, reflecting high customer satisfaction. Its limitation versus Corelight is less
              network metadata depth and architectural dependence on cloud-centric workloads over traditional
              on-premises network environments.

              Stamus Networks is the open-source-adjacent competitor, built natively on Suricata—the world's leading
              open-source network security engine—with a Clear NDR system marketed as providing "greater control, fewer
              false positives, faster response times, and a more responsive, open approach than legacy vendors." Stamus'
              single-license model includes no additional charges for API access, integrations, users, or endpoints—a
              commercially disruptive model that resonates with government, financial institution, and budget-
              constrained security teams. Stamus has been battle-tested in NATO's largest cybersecurity exercises over
              ten years, providing government-credibility validation. Its limitation is smaller scale, more limited
              enterprise support tiers, and a narrower integration ecosystem than Corelight.

              Cisco Secure Network Analytics (formerly Stealthwatch) provides NetFlow- and IPFIX-based behavioral
              analytics designed to help enterprises "gain confidence in securing the digital enterprise by continuously
              monitoring the network and cloud traffic." Its competitive advantage is native integration with existing
              Cisco network infrastructure at effectively zero marginal cost for large Cisco shops; its architectural
              limitation is flow-level metadata depth only, with no deep packet inspection or Zeek-style protocol-level
              parsing.

              Palo Alto Cortex XDR uses agentic AI to block ransomware and advanced threats, positioning network
              analytics as a component of a broader XDR platform covering endpoint, network, and cloud. Microsoft
              Defender for Endpoint is bundled within M365 E5 security suites, providing network telemetry, endpoint
              detection, email security, and Microsoft Sentinel SIEM at near- zero incremental cost for enterprises
              already on M365—the most disruptive pricing model in the competitive landscape.
