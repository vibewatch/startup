      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Corelight was founded in 2013 by the core creators of Zeek: Vern Paxson (Chief Scientist), Robin Sommer,
              Seth Hall, and Gregory Bell (who serves as Chief Security Officer and co-founder). Vern Paxson is a
              distinguished computer scientist who led the Zeek research project for decades, originally at Lawrence
              Berkeley National Laboratory and later at the International Computer Science Institute. Paxson's academic
              pedigree—he holds a PhD from UC Berkeley and has published extensively on network security—gives Corelight
              rare founder-market fit in the open-source network security community. Robin Sommer and Seth Hall were
              core Zeek committers and architects before joining the commercial venture. In 2021, Corelight appointed
              Brian Dye as CEO. Dye came from McAfee (later acquired by Symphony Technology Group and rebranded as
              Trellix), where he served as Senior Vice President of Products. Under Dye's leadership, Corelight has
              significantly scaled commercial operations, expanded its cloud and AI product portfolio, and closed the
              $150 million Series E. The current C-suite includes Russ Keefe (CFO), Julie Parrish (CMO), and Bernard
              Brantley (CISO). Corelight's board includes Michele Bettencourt as Executive Chairman, providing strategic
              governance and operational oversight. In early 2026, Hatem Naguib—former CEO of Barracuda Networks and
              seasoned cybersecurity executive—was added to the board, bringing deep enterprise security leadership and
              go-to-market experience. Jack Huffard, co-founder and former President of Tenable Holdings, serves as an
              advisor, adding another prominent cybersecurity voice to the company's governance circle. The leadership
              page also lists Lynwen Connick, a senior executive with over 40 years of cybersecurity experience spanning
              the Australian Signals Directorate, Australia's Department of the Prime Minister and Cabinet, and ANZ
              Banking Group as Chief Information Security Officer. Key-person risk is elevated at two levels: Vern
              Paxson as the intellectual founder whose name is synonymous with Zeek and network security research, and
              Brian Dye as the commercial CEO who has defined the company's modern go-to-market strategy. Governance is
              entirely private with no public disclosure requirements.
