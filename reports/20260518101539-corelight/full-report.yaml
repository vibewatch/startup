  - id: FE001
    title: Corelight Open NDR Platform Architecture Map
    type: stack
    layout: wide
    summary: >-
      Five-layer architecture stack depicting the Corelight Open NDR Platform from the network collection layer at the
      bottom through protocol analysis, ML and signature-based detection, investigation, and integration at the top. The
      open JSON export at the top layer is the architectural mechanism by which Corelight's 'Open NDR' branding is
      technically realized — logs flow up and out to any SIEM or data lake.
    data:
      layers:
        - label: 'Layer 1: Collection & Packet Capture'
          detail: >-
            Physical sensors (1G/10G/100G), Virtual Sensors (ESXi/KVM), and Cloud Sensors (AWS VPC Traffic Mirroring,
            Azure vTAP, GCP Packet Mirroring) tap network traffic. Smart PCAP provides selective full-packet recording
            when detection events are triggered.
          tone: neutral
        - label: 'Layer 2: Protocol Analysis & Zeek Log Generation (400+ Parsers)'
          detail: >-
            Zeek (open-source, Corelight-custodied) applies 400+ protocol parsers to produce structured JSON logs for
            every observed session — HTTP, DNS, SSL/TLS, SMB, Kerberos, SSH, SMTP, FTP, and dozens of specialized
            protocols. Outputs include connection metadata, application-layer records, and file transfer inventory.
          tone: positive
        - label: 'Layer 3: Multi-Engine Detection (Suricata + ML + Zeek Analytics)'
          detail: >-
            Three parallel detection engines process the same traffic stream: Suricata IDS applies tens of thousands of
            signature-based rules; Zeek scripts encode behavioral detection logic; proprietary ML models score anomalous
            patterns including DGA, C2 beaconing, lateral movement, and protocol deviations. Encrypted Traffic Analysis
            (ETA/JA3) operates at this layer.
          tone: positive
        - label: 'Layer 4: Investigation & Response (Corelight Investigator SaaS)'
          detail: >-
            Cloud-delivered Corelight Investigator provides a purpose-built threat investigation UI with AI-assisted
            triage, session timeline reconstruction, pivoting by IP/user/file SHA256, and integration with CrowdStrike
            Falcon for endpoint context. NDR Platform delivers this layer as a fully managed service.
          tone: positive
        - label: 'Layer 5: Open Integration & Export (SIEM, Data Lake, SOAR)'
          detail: >-
            All Zeek logs are exported as open JSON to Splunk, Microsoft Sentinel, Google Chronicle, IBM QRadar,
            Elasticsearch, and Apache Kafka. The open data model is the defining architectural commitment — customers
            are not locked to Corelight's proprietary analytics tooling.
          tone: positive
