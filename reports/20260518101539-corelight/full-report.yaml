      - number: '5.2'
        title: 'Core Technical Architecture: Zeek Engine, Protocol Parsing, and Open Data Model'
        blocks:
          - type: paragraph
            body: >-
              Corelight's technical architecture centers on Zeek (formerly Bro), the open-source network security
              monitor originally developed at Lawrence Berkeley National Laboratory by co-founder Vern Paxson. Zeek
              functions as a stateful network analysis framework that intercepts raw packet streams and applies a
              scripting-language-driven analysis pipeline to produce structured, application-layer log records.
              Corelight ships Zeek with over 400 protocol parsers covering HTTP/HTTPS, DNS, SSL/TLS, SMTP, FTP, SSH,
              Kerberos, LDAP, SMB/DCE-RPC, RDP, and dozens of specialized protocols, each producing typed JSON log
              records. This breadth of protocol coverage allows analysts to reconstruct the precise sequence of
              transactions in any observed network session without capturing raw packets by default, dramatically
              reducing storage requirements compared to full PCAP-based approaches. Corelight supplements Zeek's
              scripted analytics with Suricata IDS, an open-source intrusion detection engine running in parallel to
              apply tens of thousands of community signatures and custom detection rules against the same traffic
              stream. The combination gives analysts both behavioral (Zeek) and signature-based (Suricata) detection in
              a single integrated pipeline. Machine learning models provide a third analytics layer, trained to identify
              anomalous communication patterns that neither deterministic Zeek scripts nor static Suricata signatures
              would flag. The core data output is the Zeek log set: structured JSON files organized by protocol and
              session type, exportable directly to Splunk, Elasticsearch, Microsoft Sentinel, Google Chronicle, IBM
              QRadar, or any data lake via Apache Kafka. The open data model—a deliberate design principle—means
              customers are not locked into Corelight's proprietary analytics; the same log data can be queried in the
              customer's preferred tool, unlike closed NDR platforms that require proprietary dashboards. An important
              architectural component is Corelight's custodianship of the Zeek open-source project: the company is the
              primary financial backer and code contributor, granting it a privileged position in the Zeek roadmap and
              ensuring commercial feature priorities flow back into the open-source base. The Zeek Community ID standard
              (github.com/corelight/zeek-community-id), which provides a deterministic hash for network flow correlation
              across heterogeneous tools, is a Corelight-originated open-source contribution now adopted across multiple
              security products.
