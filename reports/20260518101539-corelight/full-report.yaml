              indicates that the highest-margin product lines are expanding far faster than the overall base, which is
              structurally attractive. Gartner Magic Quadrant placement as a Leader in the NDR category through 2025
              provides third-party demand credibility, and Gartner Peer Insights customer reviews confirm enterprise
              satisfaction consistent with high net revenue retention. For gross margin estimation, Corelight's revenue
              mix is the primary driver. Pure subscription software at scale typically carries 80–85 percent gross
              margins in the NDR/SaaS security sector; hardware appliances carry 40–55 percent; professional services
              carry 20–35 percent. Blending these at roughly 80/15/5 mix implies a portfolio gross margin in the 73–80
              percent range. However, Corelight's hardware appliance gross margin depends on COGS from component supply
              and manufacturing, which is not publicly disclosed. Net revenue retention is estimated at 115–130 percent
              based on sector benchmarks for Gartner Leader-class NDR vendors, consistent with Corelight's
              land-and-expand model and strategic partner referral channel. CAC, sales-cycle length, and payback period
              are entirely unavailable from public sources. Headcount of approximately 470 employees (based on LinkedIn
