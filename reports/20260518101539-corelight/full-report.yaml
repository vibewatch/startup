    type: matrix
    layout: wide
    summary: >-
      A 3×3 risk heatmap plotting Corelight's primary identified risks on a likelihood (Low / Medium / High) by severity
      (Low / Medium / High/Critical) matrix. The upper-right quadrant (High likelihood × High severity) contains the
      FedRAMP authorization gap. The upper-left (Low likelihood × Critical severity) contains the sensor supply-chain
      breach scenario. Center-mass risks include export control compliance, Zeek fork, and CEO key-person. The heatmap
      visualizes the asymmetric nature of Corelight's risk profile: most risks are low-probability but high-consequence,
      which is characteristic of enterprise security infrastructure vendors where trust is the primary product
      attribute.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
