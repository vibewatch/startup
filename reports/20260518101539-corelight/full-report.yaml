            body: >-
              Corelight's recent product release cadence reflects a strategic push on three fronts: machine learning
              enhancement, cloud coverage expansion, and AI-driven investigation productivity. Sensor v29, released in
              the 2024-2025 timeframe, was the most significant hardware sensor milestone, introducing enhanced ML
              detection packages, new protocol coverage extensions, and improved detection fidelity for encrypted
              traffic analysis scenarios. Corelight published a dedicated blog post describing the ML improvements in
              v29 as a step toward 'modernizing threat detection' by reducing false positives and improving the
              signal-to-noise ratio for SOC analysts dealing with alert fatigue. The Cloud Sensor for GCP achieved
              general availability, completing Corelight's public cloud sensor coverage across all three major cloud
              providers (AWS, Azure, GCP) and enabling customers with Google Cloud workloads to apply the same
              Zeek-based network telemetry to GCP environments that they run on-premises. AI-powered investigation
              features in the Corelight Investigator SaaS product have been progressively introduced, including AI
              triage capabilities that score and prioritize network evidence to surface the most investigation-worthy
              sessions to analysts. The Microsoft Sentinel integration and a refreshed Cisco XDR integration were
              announced in 2024, expanding the reach of Corelight network evidence into cloud-native SIEM and XDR
              workflows. Looking forward, Corelight's roadmap emphasis on AI-assisted investigation and expanded cloud
              sensor coverage reflects the broader NDR market trajectory toward SaaS delivery and AI-augmented SOC
              operations. Diligence gaps in roadmap validation include the absence of a public changelog or detailed
              release notes for sensor software versions beyond blog-post summaries, no confirmed timeline for FedRAMP
              authorization completion, limited documentation of OT/ICS protocol roadmap items, and no public product
