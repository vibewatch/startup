      - number: '2.3'
        title: Buyer, Payer, and Segment Analysis
        blocks:
          - type: paragraph
            body: >-
              The NDR market's buyer universe is concentrated in large, security-mature organizations with dedicated
              security operations center (SOC) teams and the budget to fund network-layer visibility tools. The primary
              enterprise segment comprises Fortune 500 and Global 2000 corporations, where the economic buyer is the
              Chief Information Security Officer (CISO) or VP of Security, the technical evaluator is the SOC Director
              or Lead Analyst, and the ultimate payer is the CFO or Chief Risk Officer who approves the annual
              information security budget. Typical deal sizes for Corelight's enterprise segment run $200,000–$1 million
              or more in annual contract value, reflecting the complexity of multi-site deployments with physical
              sensors, virtual sensors, and cloud-native integrations. The U.S. federal government is a structurally
              important buyer segment for Corelight, driven by Executive Order 14028 (Improving the Nation's
              Cybersecurity, May 2021) and the CISA Zero Trust Maturity Model, which explicitly requires network traffic
              analysis and visibility as a core Zero Trust pillar. Federal agency CISOs face mandatory compliance
              timelines for Zero Trust implementation with network visibility as a scored requirement, creating
              near-demand certainty in this segment. Corelight serves major civilian and defense agencies and holds
              relevant FedRAMP or equivalent authorization pathways. Regulated industries constitute the third core
              segment: financial services firms under PCI-DSS and SOX compliance requirements need network forensic
              data; healthcare organizations facing HIPAA audit and breach notification obligations require network
              telemetry for breach investigation; and critical infrastructure operators (energy, utilities,
              manufacturing) driven by NERC CIP and ICS/SCADA security mandates need east-west traffic visibility for
              operational technology (OT) networks. The OT/IT convergence use case is particularly valuable for
              Corelight because Zeek has native protocol decoders for industrial control protocols (e.g., Modbus, DNP3,
              ENIP), providing a differentiated capability not available from many competitors. Managed Security Service
              Providers (MSSPs) and Managed Detection and Response (MDR) providers represent an indirect channel:
              organizations like CrowdStrike (a Corelight strategic investor and MDR partner) and Mandiant use Corelight
              as the underlying NDR evidence layer for their managed services, creating a distribution multiplier beyond
              direct sales. The Verizon DBIR 2024 and IBM X-Force Threat Intelligence Report 2025 both document that
              network-level evidence (traffic logs, flow records, Zeek logs) is the most commonly requested artifact in
              enterprise breach investigations, reinforcing the spend-category durability of NDR tools.
