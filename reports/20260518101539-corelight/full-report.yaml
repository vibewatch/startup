              materially deteriorated. Gartner MQ Leader placement in both 2024 and 2025 — which requires multi-customer
              reference interview programs — provides direct third-party confirmation of sustained customer
              satisfaction. The primary adverse signal on retention is pricing: PeerSpot and G2 reviewers note that
