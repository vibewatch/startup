      - number: '6.5'
        title: Expansion Drivers and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Corelight's primary expansion drivers within existing accounts are (1) sensor tier upsell from physical to
              cloud deployment as customers migrate workloads to public cloud; (2) Investigator SaaS adoption driving
              per-seat or per-analyst subscription growth within the analyst workflow layer; (3) throughput tier
              upgrades as customer network traffic volumes grow; and (4) new business unit or geographic coverage
              expansion within large enterprise accounts with multiple data centers. These mechanisms structurally
              support NRR above 100% and create the conditions for the land-and-expand ARR growth model. On the
              concentration risk side, Corelight's customer profile creates meaningful concentration exposure. Estimated
              contract values of $200K–$500K for mid-market enterprise and $1M+ for large government and Fortune 500
              accounts mean that the top 10–20 accounts likely represent a disproportionate share — potentially 30–50% —
              of total ARR. A single large government contract non-renewal or a major Fortune 500 account defection to a
              bundled Cisco, CrowdStrike, or Microsoft offering could have material quarterly revenue impact. The
              government sector concentration (~30–40% of ARR) is particularly notable, as government procurement cycles
              are subject to budget authorization volatility, continuing-resolution spending constraints, and the
              political risk of program cancellation. An additional adverse signal is the price-complexity barrier: G2
              and PeerSpot reviewers document that buyers without deep Zeek expertise perceive Corelight as costly and
              complex relative to alternatives, meaning the addressable customer base is narrowed to sophisticated
              security buyers. This creates a ceiling on the total addressable market within the SMB and mid-market
              segments and concentrates Corelight's customer base in the upper-enterprise and government tiers where
              pricing objections are less determinative. The channel strategy with CrowdStrike, Cisco, and Mandiant
              partially mitigates concentration risk by diversifying the customer acquisition funnel, but the depth of
              the partner channel is not publicly quantified and remains a diligence item.
