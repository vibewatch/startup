  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Corelight converts Zeek open-source adoption and enterprise network visibility demand into recurring revenue
      through three commercial layers: subscription software, hardware appliances, and professional services. The
      SaaS/cloud component is growing at triple-digit rates and drives the highest margin, while the hardware stream
      provides customer stickiness but compresses blended gross margin.
    data:
      nodes:
        - id: zeek-oss
          label: Zeek open-source
          detail: Free open-core providing the community entry point and protocol-parsing engine.
          tone: positive
        - id: sensor-subscriptions
          label: Sensor software subscriptions
          detail: Annual licenses for on-premises and virtual sensor software; estimated ~60% of ARR.
          tone: positive
        - id: cloud-saas
          label: Cloud sensor and SaaS analytics
          detail: AWS/Azure cloud sensors plus SaaS management layer; growing at 300%+ YoY per 2024 press release.
          tone: positive
        - id: hardware-appliances
          label: Hardware appliance sales
          detail: One-time physical sensor purchases; estimated ~15% of revenue with mixed gross margin.
          tone: neutral
        - id: professional-services
          label: Professional services
          detail: Deployment, threat hunting, and training; estimated ~5% of revenue at lower margins.
          tone: neutral
        - id: channel-partners
          label: Channel and OEM partners
          detail: CrowdStrike, Mandiant, and Cisco partner referrals; embedded in strategic investor relationships.
          tone: positive
        - id: gross-revenue
          label: Gross revenue pool
          detail: Subscription, hardware, services, and channel contributions combine into total revenue.
          tone: positive
        - id: cogs-pressure
          label: Hardware COGS and cloud infra costs
          detail: Hardware BOM, cloud infrastructure, and PS labor compress blended gross margin below pure SaaS.
          tone: warning
        - id: retained-gross-profit
          label: Retained gross profit
          detail: Estimated 73%–80% blended gross margin; exact figure requires COGS disaggregation.
          tone: neutral
      edges:
        - from: zeek-oss
          to: sensor-subscriptions
        - from: zeek-oss
          to: cloud-saas
        - from: sensor-subscriptions
          to: gross-revenue
        - from: cloud-saas
          to: gross-revenue
        - from: hardware-appliances
          to: gross-revenue
        - from: professional-services
          to: gross-revenue
        - from: channel-partners
          to: gross-revenue
        - from: gross-revenue
          to: cogs-pressure
        - from: cogs-pressure
          to: retained-gross-profit
