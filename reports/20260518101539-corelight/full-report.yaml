    title: Corelight Critical Dependency Map
    type: dag
    layout: wide
    summary: >-
      Directed acyclic graph mapping Corelight's eight critical dependencies and the directional relationships that
      create platform risk. The two most significant upstream dependencies are the Zeek and Suricata open-source
      projects, where a critical vulnerability or governance change would propagate directly into the commercial
      platform. Cloud provider API dependencies are significant for the growing cloud sensor product line.
    data:
      nodes:
        - id: corelight-platform
          label: Corelight Commercial Platform
          detail: The integrated Open NDR Platform combining all sensors, detection, and SaaS services.
          tone: positive
        - id: zeek-oss
          label: Zeek Open Source (Corelight-custodied)
          detail: >-
            Core protocol analysis engine; 400+ parsers; Corelight is primary maintainer, reducing fork risk but
            creating key-person dependency on Zeek committers.
          tone: positive
        - id: suricata-oss
          label: Suricata Open Source (OISF)
          detail: >-
            IDS/IPS engine for signature-based detection; maintained by OISF independent of Corelight; Corelight
            contributes but does not control the project.
          tone: neutral
        - id: cloud-infra-aws-azure-gcp
          label: Cloud Provider Mirroring APIs (AWS/Azure/GCP)
          detail: >-
            Cloud sensor relies on AWS VPC Traffic Mirroring, Azure vTAP, and GCP Packet Mirroring APIs; API changes or
            deprecation would break cloud sensor functionality.
          tone: neutral
        - id: hardware-supply
          label: Hardware Supply Chain (Physical Sensors)
          detail: >-
            Physical sensors require network hardware components; supply chain concentration or component shortage
            creates fulfillment risk for hardware appliance revenue stream.
          tone: neutral
        - id: ml-threat-intel
          label: ML Models and Threat Intelligence Feeds
          detail: >-
            Proprietary ML detection models require training data and threat intelligence feeds; feed freshness and
            model update cadence affect detection fidelity.
          tone: neutral
        - id: siem-integration-partners
          label: SIEM Integration Partners (Splunk, Sentinel, Chronicle, QRadar, Elastic)
          detail: >-
            SIEM API changes or competitive moves by integration partners could break or disadvantage Corelight's
            integration quality; Splunk acquisition by Cisco creates strategic complexity.
          tone: neutral
        - id: crowdstrike-api
          label: CrowdStrike Falcon Enrichment API
          detail: >-
            Endpoint-to-network correlation feature depends on CrowdStrike Falcon API availability; CrowdStrike is both
            a strategic investor and a potential competitor in XDR.
          tone: neutral
