  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer Base Overview: Verticals, Buyers, and Scale'
        blocks:
          - type: paragraph
            body: >-
              Corelight's enterprise customer base spans five primary vertical segments as of mid-2026. The largest by
              estimated revenue share is US government and defense: federal agencies, Department of Defense components,
              and intelligence-community organizations are estimated to represent 30–40% of ARR based on the relative
              density of government reviewers on Gartner Peer Insights and PeerSpot, the FedRAMP authorization in
              progress (confirming active government procurement engagement), and the Cybersentry program deployment
              documented in Gartner reviews. Government buyers in this segment are security operations leads, R&D
              directors, and CISO-level stakeholders with large network monitoring budgets and long procurement cycles.
              The second segment is Fortune 500 technology, financial services, and defense contractors: large
              private-sector enterprises that operate significant network infrastructure and require real-time threat
              detection for SOC operations and incident response. PeerSpot and Gartner Peer Insights reviews from
              manufacturing and financial services practitioners confirm this segment, though no Fortune 500 customers
              are named in public materials. The third segment is universities and national research laboratories —
              historically the original Zeek deployment base, with Lawrence Berkeley National Laboratory (where Zeek was
              invented) as the canonical early adopter. The Zeek open-source community provides a natural commercial
              conversion pipeline, as organizations already operating open-source Zeek can upgrade to Corelight for
              enterprise support, hardware sensors, and the Investigator SaaS analytics layer. Managed security service
              providers (MSSPs) constitute a fourth segment, operating Corelight as the network detection backbone
              within their multi-client security operations centers. The fifth segment is healthcare systems deploying
              Corelight for clinical network visibility, medical IoT device monitoring, and ransomware detection. Buyers
              across all segments are enterprise CISOs and SOC directors; users are threat hunters and incident
              responders; payers are information security budgets at the C-suite level or below.
