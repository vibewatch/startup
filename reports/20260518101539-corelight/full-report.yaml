  - id: FE002
    title: SOC and Incident Response Workflow with Corelight
    type: flow
    layout: wide
    summary: >-
      Seven-node flow diagram tracing the path from network packet capture through Zeek log generation, SIEM ingestion,
      detection, analyst triage, IR investigation, and remediation. Illustrates how Corelight sits at the 'evidence
      generation' step, providing structured telemetry consumed by downstream SOC tools rather than requiring analysts
      to operate a separate Corelight-only console.
    data:
      nodes:
        - id: network-tap
          label: Network Traffic (TAP / Mirror)
          detail: >-
            Raw packet stream from physical TAP, SPAN port, or cloud provider mirroring API (AWS/Azure/GCP) feeds the
            Corelight sensor continuously.
          tone: neutral
        - id: sensor-processing
          label: Corelight Sensor Processing
          detail: >-
            Zeek engine parses 400+ protocols; Suricata applies IDS signatures; ML models score behavioral anomalies;
            Smart PCAP optionally records full packets for triggered events.
          tone: positive
        - id: log-generation
          label: Structured Zeek Log Generation (JSON)
          detail: >-
            Session logs, DNS records, HTTP transactions, SSL/TLS metadata, file transfers, and detection notices output
            as structured JSON — the core 'network evidence' product.
          tone: positive
        - id: siem-ingestion
          label: SIEM / Data Lake Ingestion
          detail: >-
            Zeek logs forwarded to Splunk, Microsoft Sentinel, Elasticsearch, Google Chronicle, IBM QRadar, or a data
            lake via Apache Kafka; no Corelight-proprietary console required for analytics.
          tone: positive
        - id: detection-alerting
          label: Threat Detection and AI Triage
          detail: >-
            SIEM correlation rules, Corelight detection packages, and AI triage features score and prioritize alerts;
            Investigator SaaS surfaces highest-fidelity network evidence to analysts.
          tone: positive
        - id: ir-investigation
          label: IR Investigation and Timeline Reconstruction
          detail: >-
            SOC analyst pivots from alert to full session context, DNS history, file hashes, and lateral movement paths
            using Corelight Investigator or SIEM queries on Zeek log data.
          tone: positive
        - id: remediation
          label: Remediation and Response Action
          detail: >-
            Analyst triggers endpoint isolation via CrowdStrike Falcon API enrichment or SOAR playbook; network block
            instructions sent to firewall; Smart PCAP evidence preserved for forensic record.
          tone: positive
