  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model and streams: subscription-dominant with hardware and services tail'
        blocks:
          - type: paragraph
            body: >-
              Corelight's revenue model is built on three distinct streams that together constitute its Open NDR
              Platform commercial offering. The dominant stream is subscription software, accounting for an estimated 80
              percent of total revenue. Subscription revenue comes from annual or multi-year licenses for Corelight's
              sensor software (Zeek-based protocol parsers and detection collections running on customer-owned hardware
              or virtual machines), cloud sensor subscriptions for AWS and Azure environments, and access to the
              Corelight SaaS analytics and management layer. The subscription model is priced per sensor or per data
              throughput tier, with enterprise customers typically negotiating multi-year agreements. The second stream,
              estimated at approximately 15 percent of revenue, is hardware appliance sales. Corelight sells physical
              network sensors as purpose-built appliances that customers deploy on-premises; these are capital purchases
              rather than recurring revenue, which means hardware mix variability introduces lumpiness into quarterly
              recognition. The third stream, estimated at 5 percent, is professional services — deployment assistance,
              threat-hunting engagements, and training delivered to enterprise accounts. The April 2024 Series E press
              release confirmed greater than 40 percent year-over-year ARR growth and 300 percent YoY growth in AI and
              SaaS-driven NDR solutions, which implies the SaaS/cloud sensor component is growing substantially faster
              than the overall book. The open-core model — where Zeek is free but Corelight's commercial detection
              libraries, protocol parsers, and cloud analytics are subscription-gated — creates a natural
              land-and-expand motion. Customers frequently begin with on-premises sensors, then add cloud sensors and
              the SaaS management layer over time, driving the net revenue retention that industry comparables suggest
              runs above 115 percent for leading NDR platforms.
