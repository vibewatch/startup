      - number: '8.4'
        title: 'Scenario Valuation Analysis: Bull, Base, and Bear Cases with Key Assumptions'
        blocks:
          - type: paragraph
            body: >-
              The valuation scenario analysis constructs three cases differentiated by market multiple, ARR growth rate,
              revenue scale, and exit path. All scenarios use a forward 12-month ARR estimate of $130–160M as the base
              financial metric, consistent with 40%+ YoY growth from an estimated $90–120M ARR baseline at the April
              2024 Series E. The bull case ($1.5–2.0B enterprise value) assumes: (a) Corelight achieves IPO or strategic
              M&A exit in 2026–2027 at a premium to the NDR comp set; (b) FedRAMP authorization is achieved, unlocking
              meaningful federal civilian cloud ARR; (c) NRR is confirmed at 125%+ consistent with Gartner Magic
              Quadrant Leader benchmarks; (d) the NDR TAM expands at the high end of analyst projections; and (e)
              strategic acquirer competition (CrowdStrike, Cisco, Microsoft) creates a bidding dynamic. The bull case
              multiple is 10–14x forward ARR, in line with Illumio's 2021 Series F and above ExtraHop's 2022 M&A
              multiple, justified by government concentration and open-source moat premiums. The base case ($1.0–1.5B
              enterprise value) assumes: (a) an M&A exit or late-stage secondary in 2027–2028; (b) FedRAMP authorization
              delayed by 12–18 months; (c) NRR confirmed at 110–120%, consistent with NDR sector benchmarks; (d) the
              TPVG venture debt is refinanced or repaid without material impact on equity proceeds; and (e) no
              meaningful competitive displacement by SIEM/XDR platform bundling. The base multiple is 7–10x forward ARR.
              The bear case ($600–800M enterprise value) assumes: (a) NDR market saturation accelerates as CrowdStrike,
              Microsoft, and Cisco bundle network telemetry natively; (b) Corelight ARR growth decelerates below 20% YoY
              as land-and-expand motion slows; (c) FedRAMP authorization is not achieved before 2027, blocking the
              federal cloud channel; (d) a down-round dynamic forces a valuation reset; and (e) the TPVG debt creates
              covenant pressure in a slower-growth environment. The bear multiple is 4–6x forward ARR, consistent with
              Darktrace's post-IPO discount trading range for slower-growth NDR vendors. The NDR market saturation risk
              documented in DarkReading's analysis of competitive dynamics is the primary bear-case driver: if SIEM and
              XDR platforms commoditize network telemetry, the pricing umbrella for standalone NDR vendors compresses
              materially.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
