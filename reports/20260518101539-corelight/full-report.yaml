      - number: '8.5'
        title: 'Diligence Framework: Kill Triggers, Remaining Asks, and Upgrade Conditions'
        blocks:
          - type: paragraph
            body: >-
              The TRACK recommendation can be upgraded to BUY if six specific diligence conditions are met and no kill
              trigger is activated. The most important single upgrade condition is NRR confirmation above 115%: if
              Corelight's net revenue retention is materially below NDR Gartner Leader benchmarks, the expansion revenue
              model that justifies the premium multiple is impaired, and the recommendation defaults to PASS. The second
              upgrade condition is cap table and preference stack review: without knowing the cumulative liquidation
              preferences from five equity rounds plus TPVG warrant coverage, the effective equity multiple at a given
              exit valuation is unknowable. A heavy preference stack (e.g., 2x participating preferred) could mean that
              common equity holders receive materially less than the headline exit multiple implies. The third upgrade
              condition is TPVG debt term review: confirming the outstanding principal, interest rate, covenant package,
              and MAC provision is required to model the debt's impact on equity proceeds at exit. Eight kill triggers
              are identified that would convert the TRACK to PASS immediately: (1) a material security breach of
              Corelight's own sensor network (SolarWinds-type supply-chain attack) damaging customer trust; (2) loss of
              a major government contract, particularly a CISA or DoD anchor customer; (3) a confirmed down round
              valuation below the Series E implied value; (4) departure of CEO Brian Dye without a named successor in
              place; (5) a Zeek governance crisis (major fork, ICSI trademark dispute, or competitor-funded Zeek
              distribution); (6) FedRAMP authorization denial or indefinite delay past 2027; (7) NRR confirmed below
              100% (net churn); or (8) competitive displacement of Corelight in two or more Tier-1 anchor government
              accounts. The upgrade path from TRACK to BUY requires all six diligence asks to be answered
              satisfactorily: cap table, financial model with NRR and gross margin, TPVG facility terms, FedRAMP
              authorization timeline, Series E term sheet provision review (CrowdStrike/Cisco information rights and
              ROFR), and a management presentation on the 18-month forward operating plan. The PeerSpot and Gartner Peer
              Insights review data confirm strong customer satisfaction with Corelight's detection quality and
              deployment flexibility, providing qualitative confirmation of the retention thesis. Insight Partners'
              active portfolio page listing and ongoing portfolio engagement reinforce that the lead institutional
              investor is engaged. The recommendation is actionable as TRACK pending receipt of the six diligence items
              above.
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV005
            claimRefs: []
          - type: table
            tableRef: TV006
            claimRefs: []
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual Analyst Leadership (Gartner MQ + Forrester Wave) Is a Rare and Durable Commercial Moat
            body: >-
              Corelight is the only independent pure-play NDR vendor holding simultaneous Gartner Magic Quadrant Leader
              and Forrester Wave Leader status as of mid-2026. This dual ranking is a direct commercial accelerant:
              enterprise procurement teams shortlist based on these designations, and maintaining both across successive
              cycles demonstrates product and go-to-market durability. Accel and Insight Partners both made portfolio
              investment decisions that explicitly reference the analyst leadership position.
            calloutType: strength
            claimRefs:
              - CV001
              - CV004
              - CV019
          - type: callout
            title: TPVG Venture Debt Creates Hidden Equity Dilution and Liquidation Priority Risk
            body: >-
              The TPVG venture debt disclosed in TPVG's 2025 10-K (SEC EDGAR) sits senior to all equity in a liquidation
              event. Combined with five prior equity rounds of cumulative liquidation preferences, the effective equity
              value to common holders at a given exit price may be materially below the headline EV. This is an absolute
              diligence prerequisite before any investment recommendation above TRACK: the preference stack and debt
              terms must be reviewed against the three valuation scenarios to compute actual equity return per share
              class.
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV037
          - type: callout
            title: 'NDR Market Saturation Is the Primary Downside Risk: XDR and SIEM Bundling Threatens Pricing'
            body: >-
              DarkReading's 2025 analysis of the NDR competitive landscape specifically identifies the threat that SIEM
              and XDR platform vendors (CrowdStrike, Microsoft Sentinel, Palo Alto Cortex) are bundling network
              telemetry into broader security operations platform licenses, pressuring the pricing umbrella for
              standalone NDR vendors. Corelight's open-source Zeek differentiation and government concentration mitigate
              this risk, but the bear case depends critically on whether Corelight's expansion motion can overcome
              platform bundling headwinds in commercial enterprise.
            calloutType: risk
            claimRefs:
              - CV005
              - CV031
              - CV036
          - type: callout
            title: Exceptional Investor Syndicate Quality Signals Exit Path and Strategic Premium Potential
            body: >-
              The combination of Accel (top-decile growth equity), General Catalyst, Insight Partners, CrowdStrike
              Falcon Fund, and Cisco Investments creates an investor syndicate that simultaneously validates the growth
              equity thesis (Accel/GC/IP) and signals strategic acquisition interest (CrowdStrike, Cisco). The presence
              of two direct strategic investors with acquisition capability and information rights creates a non-trivial
              probability of a strategic premium exit — though it also creates the board-level conflict-of-interest risk
              documented in Chapter 7.
            calloutType: strength
            claimRefs:
              - CV011
              - CV012
              - CV016
              - CV042
