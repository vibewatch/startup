      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Corelight has raised approximately $310–340 million in total venture capital across five disclosed rounds,
              making it one of the best-capitalized pure-play NDR companies in the market. The funding history reflects
              a strong investor conviction thesis anchored in Accel, which led both the inaugural Series A and the most
              recent Series E—an unusual endorsement of long-term platform value. The Series A closed in July 2017 at
              $9.2 million, led by Accel, providing the initial institutional runway to commercialize Zeek-derived
              technology at scale. General Catalyst led the Series B in September 2018 at $25 million, accelerating
              product development and early enterprise go-to-market. Insight Partners led the Series C in October 2019
              at approximately $50 million (the company was formerly known as BroAla prior to renaming), providing the
              capital for significant team expansion and product maturation. The Series D in 2021 closed at an
              undisclosed amount, estimated in the market at approximately $75 million, providing capital to scale
              global operations and engineering amid strong enterprise demand. The marquee event was the April 30, 2024
              Series E: $150 million led by Accel, with strategic co-investors Cisco Investments and the CrowdStrike
              Falcon Fund. This round is notable not merely for its size but for the strategic alignment it
              represents—Cisco and CrowdStrike are simultaneously strategic investors, technology partners, and
              potential competitors, creating a complex multi-dimensional relationship that diligence must assess
              carefully. Arun Mathew, partner at Accel, cited Corelight's 'unusually strong enterprise traction,
              battle-hardened open-source technology, and delighted customers' as the rationale for leading a fifth
              time. No current valuation has been publicly disclosed by Corelight. The company has no publicly traded
              securities and no confirmed SEC Form D filings accessible via EDGAR, consistent with its status as a
              private company structured outside standard retail security offering channels. Total capital raised is
              estimated at $310–340 million across all rounds.
