          tone: positive
        - id: financial-signal
          label: 40%+ ARR growth; SaaS 300% YoY
          detail: Company-disclosed; April 2024 press release. Single data point; NRR not confirmed. Medium confidence.
          tone: neutral
        - id: investor-signal
          label: Tier-1 investor syndicate
          detail: Accel, GC, Insight Partners, CrowdStrike, Cisco. Confirms exit path optionality. High confidence.
          tone: positive
        - id: valuation-gate
          label: Implied $1.0–1.5B at 7–10x ARR
          detail: Inferred from comps; not confirmed. Not cheap but not overvalued relative to NDR benchmarks.
          tone: neutral
        - id: risk-gate
          label: 'Medium-high risk: TPVG debt, NRR unknown, FedRAMP gap'
          detail: 'Three co-present risk factors: venture debt, unconfirmed NRR, FedRAMP authorization incomplete.'
          tone: warning
        - id: diligence-gate
          label: '6 open diligence items (P0: cap table + NRR)'
          detail: Cap table, NRR, TPVG terms, ARR breakdown, Series E term sheet, FedRAMP timeline.
          tone: warning
        - id: track-recommendation
          label: TRACK — monitor, do not deploy capital yet
          detail: >-
            Sufficient evidence for high conviction in market position; insufficient evidence for valuation
            underwriting.
          tone: neutral
        - id: buy-path
          label: BUY if all 6 diligence asks resolved satisfactorily
          detail: 'Upgrade path: NRR >115%, cap table reviewed, TPVG terms confirmed, no kill trigger activated.'
          tone: positive
        - id: pass-path
          label: PASS if any kill trigger activated
          detail: 8 kill triggers identified; any single trigger routes to immediate PASS without further analysis.
          tone: negative
      edges:
        - from: market-signal
          to: valuation-gate
        - from: financial-signal
          to: valuation-gate
        - from: investor-signal
          to: valuation-gate
        - from: valuation-gate
          to: risk-gate
        - from: risk-gate
          to: diligence-gate
        - from: diligence-gate
          to: track-recommendation
        - from: track-recommendation
          to: buy-path
        - from: track-recommendation
          to: pass-path
    approximationNotes: >-
      The decision flow is a logical representation of the recommendation framework; it does not represent a formal
      decision tree with probability weights. Each node represents a summary of a more detailed evidence assessment
      documented in the sections, tables, and claims of this chapter.
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV013
      - CV014
      - CV039
      - CV040
  - id: FV002
    title: NDR Comparable Valuation Multiples
    type: bar
    layout: wide
    summary: >-
      Revenue multiples across the NDR comparable company set illustrate that Corelight's implied 7–10x forward ARR
      multiple is positioned in the middle of the observable range — above Darktrace's post-IPO trading discount but
      below CrowdStrike's platform premium. The ExtraHop M&A transaction provides the most relevant acquisition
      reference point at 5–7x ARR. The Illumio and Vectra AI private round multiples show the range of premiums
      available in government-heavy zero-trust and NDR segments at peak-market conditions.
    data:
      items:
        - label: Darktrace (public, mid-2026)
          value: 5
          detail: LSE-listed; estimated 4–6x trailing ARR; mid-point used; revenue scale 5–7x Corelight
          tone: neutral
        - label: ExtraHop (M&A, July 2022)
          value: 6
          detail: $900M acquisition by Arista; estimated 5–7x ARR at transaction; conservative reference floor
          tone: neutral
        - label: Vectra AI (private round est.)
          value: 11
          detail: Estimated 8–15x ARR at 2022 Series F; significant uncertainty; mid-point used
          tone: neutral
        - label: Illumio (private round, Nov 2021)
          value: 15
          detail: $2.75B Series F; zero-trust premium; peak-market 2021 conditions; 14–18x ARR mid-point
          tone: positive
        - label: CrowdStrike (public platform)
          value: 24
          detail: NASDAQ; 20–28x ARR; platform diversification premium; not a direct NDR comp
          tone: neutral
        - label: Corelight (implied, mid-2026)
          value: 8
          detail: 7–10x forward ARR implied from comp analysis and Series E context; mid-point; not confirmed
          tone: positive
    approximationNotes: >-
      All revenue multiples are analyst estimates. Darktrace ARR and market cap from public sources as of mid-2026.
      ExtraHop ARR at acquisition is estimated from market observers; transaction price is confirmed. Vectra AI,
      Illumio, and Corelight private financials are not publicly disclosed; all figures are inferences from disclosed
      funding events, market observer estimates, and comparable benchmarks.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: FV003
    title: Corelight Valuation Range by Scenario
    type: range
    layout: wide
    summary: >-
      The three-scenario valuation range illustrates the asymmetry in the Corelight investment: the bull case (IPO or
      premium M&A at $1.5–2.0B) offers limited upside versus the base case ($1.0–1.5B) given the current implied
      valuation, while the bear case ($600–800M) and down-round case ($200–400M) represent material downside relative to
      the Series E price. The wide range reflects genuine uncertainty rather than false precision: without confirmed
      ARR, NRR, and preference stack, the effective equity multiple at any given EV cannot be calculated with precision.
    data:
      items:
        - label: Down-Round Case
          low: 200
          mid: 300
          high: 400
          displayValue: $200M–$400M
          detail: Major adverse event (breach, contract loss, NRR collapse); ~3–4x ARR on severely reduced base
          tone: negative
        - label: Bear Case
          low: 600
          mid: 700
          high: 800
          displayValue: $600M–$800M
          detail: NDR saturation + FedRAMP failure + growth deceleration; 4–6x ARR
          tone: warning
        - label: Base Case
          low: 1000
          mid: 1250
          high: 1500
          displayValue: $1.0B–$1.5B
          detail: Sustained 35–40% growth; M&A or late-stage secondary 2027–2028; 7–10x ARR
          tone: neutral
        - label: Bull Case
          low: 1500
          mid: 1750
          high: 2000
          displayValue: $1.5B–$2.0B
          detail: FedRAMP achieved; NRR >125%; IPO or strategic M&A premium; 10–14x ARR
          tone: positive
    approximationNotes: >-
      Scenario boundaries are analyst estimates based on comparable company analysis and public financial signals. No
      figure has been confirmed by Corelight. The down-round case assumes a major adverse event not currently expected
      as the base case. ARR ranges in each scenario are extrapolated from the April 2024 Series E context with 40%+ YoY
      growth applied forward.
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: Investment Committee KPI Scorecard
    type: kpi
    layout: wide
    summary: >-
      The IC KPI scorecard summarizes the key investability dimensions across market, proof, moat, economics, risk,
      valuation, and evidence quality. The scorecard highlights the asymmetry between the strong market and product
      evidence (high confidence) versus the weak financial transparency and valuation evidence (low confidence), which
      drives the TRACK rather than BUY recommendation.
    data:
      items:
        - label: Recommendation
          value: TRACK
          detail: TRACK with medium confidence; upgrade to BUY requires 6 diligence items resolved
        - label: Implied EV
          value: $1.0–1.5B
          detail: Inferred from comp analysis; 7–10x forward ARR; not confirmed by company
        - label: Market Position Score
          value: 9 / 10
          detail: Dual analyst leader (Gartner + Forrester); highest-quality NDR open-source moat; strong government anchor
        - label: Financial Evidence Score
          value: 3 / 10
          detail: Only ARR growth rate disclosed; NRR, gross margin, CAC, burn all unconfirmed; TPVG debt outstanding
        - label: Valuation Support Score
          value: 5 / 10
          detail: Multiple is in comp range but not cheap; preference stack unknown; implied EV is inferred not confirmed
        - label: Risk Score
          value: 6 / 10 (medium-high)
          detail: TPVG debt, FedRAMP gap, NRR unknown, Cisco/CrowdStrike conflict risk; government concentration
        - label: Exit Readiness Score
          value: 7 / 10
          detail: Investor quality signals IPO/M&A preparation; no confirmed timeline; strategic acquirer interest plausible
        - label: Evidence Quality
          value: Medium
          detail: Strong market and analyst evidence; weak financial and valuation evidence; 6 open diligence items
    approximationNotes: >-
      Scores are analyst-assigned qualitative ratings on a 1–10 scale for comparative purposes within this chapter. They
      reflect the quality and completeness of available evidence, not an absolute ranking of the company. Financial
      evidence score is low due to private-company data absence, not due to any confirmed negative finding.
    claimRefs:
      - CV001
      - CV004
      - CV013
      - CV014
      - CV039
      - CV041
      - CV042
