  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The NDR market in 2026 is a fragmented but consolidating competitive landscape where Corelight competes
              against pure-play NDR vendors, security platform incumbents, and a growing category of XDR and SASE hybrid
              products that bundle network visibility with endpoint or cloud security. Three tiers characterize the
              competition. First, the direct NDR peer set: ExtraHop RevealX (now a product within Arista Networks'
              portfolio following acquisition, combining network performance monitoring with ML-driven threat detection,
              named a Leader in the Forrester Wave: Network Analysis and Visibility Solutions Q4 2025); Darktrace
              (UK-listed public company with approximately $410 million ARR for FY2024, AI-first self-learning threat
              detection covering NDR, email security, and OT); Vectra AI (approximately $300 million total raised,
              cloud-AI NDR with Azure and Microsoft Defender integration, Gartner Peer Insights Customer First recipient
              in 2023); and Stamus Networks (smaller, European, open-source Suricata-based, Clear NDR system
              battle-tested in NATO cybersecurity exercises). Second, the adjacent incumbent tier: Cisco Secure Network
              Analytics, formerly Stealthwatch, which provides NetFlow- and IPFIX-based behavioral analytics embedded
              within Cisco's network infrastructure portfolio; and Palo Alto Networks Cortex XDR, which positions
              network analytics as a component of a unified XDR platform. Third, the substitute tier: SIEM vendors
              including Splunk and IBM QRadar, and EDR or XDR platforms that argue against standalone NDR deployment by
              offering partial network telemetry within a broader security data platform. The analyst community
              recognizes Corelight's open-core approach as a structural differentiator. The 2025 Gartner Magic Quadrant
              for NDR named Corelight a Leader, and the Forrester Wave: Network Analysis and Visibility Q2 2023 likewise
              cited Corelight's protocol parsing depth and open data model as primary leadership criteria. ExtraHop
              RevealX was also named a Leader in the Forrester Wave NAV Q4 2025, establishing it as the closest
              analyst-recognized peer. The competitive dynamic is shaped by a fundamental tension between
              fidelity—Corelight's primary axis of differentiation through forensic-grade network metadata—and platform
              breadth, which Microsoft, Cisco, and Palo Alto exploit by embedding network visibility into larger
              security stacks. Buyers increasingly demand both, creating a two-speed market: forensic-driven SOC and IR
              teams favor Corelight's evidence-based approach, while consolidation-seeking CISOs gravitate toward
              platform vendors offering "good enough" NDR bundled with endpoint and identity.
