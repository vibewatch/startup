  - id: TV005
    title: Thesis-Break Triggers and Kill Criteria
    columns:
      - Trigger
      - Monitoring Signal
      - Transmission to Thesis
      - Assessment Frequency
      - Action
    rows:
      - - Material security breach of Corelight sensors or SaaS platform (SolarWinds-equivalent)
        - CVE disclosure; CISA advisory; customer termination notices; news coverage of incident
        - >-
          Catastrophic — destroys customer trust in an NDR vendor's own security; government contract termination
          likely; irreversible reputational damage
        - Continuous monitoring
        - Immediate PASS; exit any position; notify compliance team
      - - Loss of Gartner Magic Quadrant Leader status in 2026 annual cycle
        - Gartner NDR Magic Quadrant publication (annual, typically Q3)
        - High — dual analyst leadership is the primary commercial moat; loss signals competitive displacement
        - Annual (Gartner publication)
        - Downgrade to PASS; reassess competitive position before any re-entry
      - - Confirmed down-round valuation below Series E implied value
        - Form D filing; news coverage; investor communication; secondary market pricing
        - >-
          High — confirms that growth expectations have been reset; creates preference overhang crisis and anti-dilution
          ratchets
        - Quarterly monitoring via SEC EDGAR Form D filings
        - PASS; review cap table implications; assess whether down-round terms restructure the exit economics
      - - CEO Brian Dye departure without named replacement
        - Press release; LinkedIn; management presentation
        - >-
          High — Dye has led the company through its most commercially critical phase; departure before IPO/M&A creates
          leadership vacuum
        - Continuous
        - PASS pending assessment of successor quality; 60-day hold before re-evaluation
      - - NRR confirmed below 100% (net churn)
        - Management disclosure; investor update; financial data room
        - >-
          Critical — net churn means the subscription base is contracting; the land-and-expand model is failing; premium
          multiple not supportable
        - Upon receipt of financial data room materials
        - Immediate PASS; the valuation thesis depends on NRR above 110%
      - - FedRAMP authorization denied or delayed indefinitely past 2027
        - FedRAMP Marketplace status update; press release; contract award notices
        - >-
          Medium-high — federal civilian cloud ARR channel blocked; limits TAM expansion; bear case probability
          increases
        - Semi-annual review of FedRAMP Marketplace status
        - >-
          Reduce target valuation to bear case range; maintain TRACK only if commercial enterprise growth offsets
          government cloud delay
      - - Zeek major fork or ICSI trademark dispute emerges
        - GitHub fork activity; ICSI press release; court filings; open-source community discourse
        - High — open-source moat is the core technical differentiation; a funded fork commoditizes the engine
        - Quarterly via GitHub and news monitoring
        - PASS if fork gains material enterprise adoption; reassess timeline for re-entry
      - - TPVG debt covenant breach or MAC trigger notification
        - SEC EDGAR TPVG 10-Q/10-K disclosures; news; TPVG investor relations
        - High — covenant breach signals financial stress; could accelerate debt repayment and impair equity proceeds
        - Quarterly via TPVG SEC EDGAR filings
        - PASS; escalate to legal review; assess TPVG facility terms immediately
    notes: >-
      Kill triggers are intended to operate as binary decision gates: if a trigger is confirmed, the recommendation
      moves to PASS without waiting for additional analysis. Assessment frequencies are minimum recommended intervals;
      continuous news monitoring should supplement scheduled reviews. Triggers 1 (security breach) and 5 (NRR below
      100%) are unconditional immediate PASS triggers.
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Specific Ask
      - Why It Matters
      - Source / Diligence Path
      - Priority
    rows:
      - - Cap Table and Preference Stack
        - >-
          Provide fully diluted cap table showing all share classes, option pool, warrant coverage, and liquidation
          preferences from Seed through Series E
        - >-
          Without the preference stack, effective equity multiple at any exit EV is unknown; participating preferred
          with 2x preferences could reduce common holder proceeds by 30–60% in base case
        - Company data room; legal counsel for share structure review
        - Critical (P0)
      - - NRR and Gross Revenue Retention
        - >-
          Provide trailing 12-month NRR, gross revenue retention, and expansion vs. contraction breakdown by customer
          cohort and segment
        - >-
          NRR is the single most important indicator of whether the land-and-expand model is working; below 110% NRR
          triggers bear case multiple compression; below 100% triggers PASS
        - CFO presentation; audited financials; SaaS metrics dashboard
        - Critical (P0)
      - - TPVG Venture Debt Facility Terms
        - >-
          Provide TPVG credit agreement, current drawn balance, interest rate, maturity date, covenant package, warrant
          coverage, and MAC provisions
        - >-
          Venture debt sits senior to equity in liquidation; MAC covenants could accelerate repayment in adverse
          conditions; warrant dilution is incremental to equity round dilution
        - TPVG credit agreement in data room; TPVG SEC EDGAR disclosures; legal counsel review
        - High (P1)
      - - ARR Breakdown by Segment and Customer Cohort
        - >-
          Provide ARR disaggregated by product line (sensors, SaaS, managed), customer segment (government, commercial
          enterprise, international), and cohort vintage
        - >-
          Government concentration risk (estimated 30–40%) requires segment ARR to assess cliff risk; SaaS/cloud vs.
          hardware mix drives gross margin and multiple
        - CFO presentation; annual operating metrics report
        - High (P1)
      - - Series E Term Sheet — CrowdStrike and Cisco Information Rights
        - >-
          Provide Series E preferred stock purchase agreement and investor rights agreement; confirm scope of
          CrowdStrike Falcon Fund and Cisco Investments information rights, board observer rights, ROFR, and co-sale
          provisions
        - >-
          CrowdStrike and Cisco are direct competitors; if they hold full information rights including M&A process
          disclosure rights, this creates a conflict of interest in any competitive M&A scenario; legal review of
          provisions is essential before any recommendation upgrade
        - Series E transaction documents; legal counsel review of investor rights agreement
        - High (P1)
      - - FedRAMP Authorization Timeline and 3PAO Engagement
        - >-
          Provide FedRAMP authorization milestone plan, current 3PAO (Third Party Assessment Organization) engagement
          letter, and interim procurement vehicle strategy (ATOs, P-ATOs)
        - >-
          FedRAMP authorization is on the critical path for federal civilian cloud ARR; delay past 2027 shifts the model
          to bear case; knowing the 3PAO engagement confirms active progress
        - Company management presentation; FedRAMP PMO
        - Medium (P2)
    notes: >-
      Priority levels: P0 (must receive before any recommendation upgrade from TRACK), P1 (must receive before capital
      deployment), P2 (required before IPO or M&A transaction close). All six items are standard institutional investor
      diligence requests; refusal to provide any P0 or P1 item should be treated as a negative signal and may trigger
      reclassification to PASS.
