      - number: '1.5'
        title: Risks and Adverse Considerations
        blocks:
          - type: paragraph
            body: >-
              Corelight faces several categories of material risk that diligence must assess carefully. First, financial
              opacity: as a private company with $310–340 million raised and an undisclosed current valuation, Corelight
              provides no independently verifiable financial data. The most recent verifiable financial metric—over 40%
              ARR growth—is a self-reported company claim from April 2024, and no current ARR, churn, gross margin, or
              burn rate figures are accessible. The $150 million Series E price was not accompanied by a disclosed
              post-money valuation, creating uncertainty about the current enterprise value, especially given shifts in
              SaaS multiples since 2021. Second, competitive pressure from platform vendors: the NDR market faces
              increasing competition from large security platform vendors—including Cisco (which simultaneously invested
              in Corelight), Microsoft Defender (with built-in network telemetry), and CrowdStrike Falcon (another
              simultaneous investor and partner)—who bundle network visibility into broader security suites. This
              creates a 'coopetition' dynamic where Corelight's largest strategic investors are also its most capable
              competitors. The strategic investments from Cisco and CrowdStrike mitigate some of this risk through
              partnership alignment but do not eliminate the structural competitive threat. Third, key-person risk: Vern
              Paxson's identity as the intellectual founder of the underlying Zeek technology creates a concentration
              risk in the company's open-source community credibility. Brian Dye's departure as CEO would require a
              commercially experienced replacement in a competitive talent market. Fourth, valuation uncertainty: no
              current valuation has been publicly disclosed, meaning investors are anchoring to the undisclosed Series E
              price or market-comparable estimates in the $1–1.5 billion range. Public cybersecurity company multiples
              have experienced significant compression since 2021, which may affect how private market peers are valued.
              Fifth, open-source dependency: Corelight's platform is built on Zeek, Suricata, and Sigma—all open-source
              projects. While Corelight's custodianship of Zeek reduces fork risk, reliance on community-maintained
              open-source infrastructure creates vendor dependency concerns for security-sensitive enterprise buyers.
            claimRefs:
              - CO031
              - CO041
              - CO042
              - CO043
              - CO044
              - CO024
