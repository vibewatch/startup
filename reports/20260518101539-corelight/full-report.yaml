      - number: '2.4'
        title: Growth Drivers and Market Headwinds
        blocks:
          - type: paragraph
            body: >-
              The NDR market benefits from a structurally favorable secular demand environment defined by four
              reinforcing growth drivers. First, hybrid and multi-cloud adoption creates persistent network visibility
              gaps: as enterprises migrate workloads to AWS, Azure, and GCP while retaining on-premises infrastructure,
              east-west traffic increasingly traverses cloud VPCs and virtual networks that legacy network taps and
              hardware sensors cannot monitor. Cloud-native NDR sensor deployments—the fastest-growing segment of
              Corelight's business at 300% YoY growth per its 2024 Series E disclosure—address exactly this gap. Second,
              the threat landscape is escalating in sophistication and destructiveness. The CrowdStrike 2025 Global
              Threat Report documents that adversaries are increasingly logging in rather than breaking in—exploiting
              identity, supply chain, and zero-day vulnerabilities—and using AI to scale attack operations. Ransomware
              dwell times, though falling, remain measured in days, during which network traffic evidence is often the
              only reliable forensic artifact that survives lateral movement. IBM's X-Force Threat Intelligence Index
              2025 similarly documents that network-layer telemetry is critical for detecting credential theft, C2
              communications, and data staging. Third, regulatory and policy mandates create institutional pull. CISA's
              Zero Trust Maturity Model and NIST SP 800-207 (Zero Trust Architecture) both explicitly designate network
              traffic analysis as a required Zero Trust pillar. Federal agencies under Executive Order 14028 face
              compliance deadlines that directly expand the addressable NDR market in the U.S. public sector. Fourth,
              AI-enhanced threats require behavioral NDR detection that goes beyond signature-only defenses: as
              attackers use AI to evade static detection patterns, behavioral anomaly detection—core to NDR—becomes a
              required SOC capability. The principal headwinds constraining growth are: (1) XDR platform bundling by
              Cisco, Microsoft, and CrowdStrike, each of which incorporates network telemetry into broader security
              platforms at potentially lower incremental cost to existing customers; (2) SOC talent shortages that
              reduce the ability of enterprise security teams to operationalize complex network monitoring tools,
              potentially favoring managed/MSSP deployment over direct use; (3) security tool consolidation pressure,
              with CISOs actively reducing vendor sprawl; and (4) macroeconomic budget compression, which lengthens
              enterprise security procurement cycles. For Corelight specifically, the coopetition dynamic with Cisco and
              CrowdStrike as simultaneous investors and platform competitors represents the most material market risk in
              the near term.
