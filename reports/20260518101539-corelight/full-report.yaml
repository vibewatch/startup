      - number: '8.2'
        title: Funding History, Capital Structure, and TPVG Venture Debt Disclosure
        blocks:
          - type: paragraph
            body: >-
              Corelight has raised approximately $310–340M in total equity financing across five known rounds from Seed
              through Series E. The anchor financing event is the April 2024 Series E: $150M led by Accel with
              participation from CrowdStrike Falcon Fund, Cisco Investments, and existing investors General Catalyst and
              Insight Partners, as confirmed by PR Newswire press release and multiple tier-one media sources.
              Corelight's company investor page and Accel's portfolio page confirm the Series E but do not disclose the
              post-money valuation. Earlier rounds include a Series D (approximate amount ~$75M, 2020–2021 per Insight
              Partners portfolio disclosure), Series C (~$50M, 2019–2020 per General Catalyst portfolio), Series B
              (~$25M, 2018), and a Seed/Series A pre-2018. Total equity raised is estimated at $310–340M, of which $150M
              was raised in the Series E. The most significant diligence-relevant disclosure outside the equity record
              is the TPVG venture debt position. TriplePoint Venture Growth (TPVG), a Business Development Company (BDC)
              that provides venture lending to growth-stage technology companies, disclosed an active loan to Corelight,
              Inc. in its fiscal year 2025 annual report (Form 10-K, filed February 2026, covering the period ended
              December 31, 2025). TPVG's 10-K is filed publicly on SEC EDGAR under CIK 1580345. The existence of venture
              debt is a capital structure signal: TPVG loans to growth-stage technology companies typically carry
              interest rates of 9–14%, include a warrant coverage component (typically 1–4% of loan face value in equity
              warrants), and are structured with interest-only periods followed by principal amortization. Venture debt
              at this stage is neither positive nor negative per se — it extends runway without dilution — but the debt
              principal sits senior to equity in a liquidation, and warrant dilution is incremental to equity round
              dilution. Diligence must confirm: (a) the face amount and drawn balance of the TPVG facility; (b) the
              interest rate and covenant terms; (c) the warrant coverage ratio; (d) whether any material adverse change
              (MAC) covenants are triggered by a liquidity event; and (e) whether the facility has been repaid or
              remains outstanding as of mid-2026. The Form D search on SEC EDGAR confirms multiple Corelight Regulation
              D filings consistent with the known equity rounds.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
      - number: '8.3'
        title: 'Comparable Company Analysis: NDR Public Companies, M&A Transactions, and Private Benchmarks'
        blocks:
          - type: paragraph
            body: >-
              Corelight's valuation must be contextualized against a carefully selected set of NDR-adjacent comparables
              that span public markets, private rounds, and M&A transactions. The most directly comparable public
              company is Darktrace (London Stock Exchange: DARK), which IPO'd in April 2021 at a peak valuation of ~$5B
              and as of mid-2026 trades at a market capitalization of approximately $3.5–4.5B, representing roughly 4–6x
              trailing ARR on an estimated $700–900M ARR base. Darktrace is an AI-native network and email security
              platform with meaningful overlap with Corelight in the enterprise NDR segment; its public trading multiple
              provides the lowest-risk comp for Corelight's implied valuation, though Darktrace's revenue scale is
              approximately 5–7x Corelight's estimated ARR. The most relevant M&A transaction is Arista Networks'
              acquisition of ExtraHop in July 2022 for $900M. ExtraHop was a network detection and performance analytics
              platform with an estimated ARR of $130–180M at acquisition, implying a 5–7x ARR acquisition multiple. The
              ExtraHop transaction was completed by a strategic acquirer (Arista) at a below-peak-market multiple,
              providing a conservative floor for Corelight's M&A reference point. Illumio, a micro-segmentation and
              zero-trust networking company, raised $225M in a Series F in November 2021 at a $2.75B valuation on
              estimated ARR of $150–200M (approximately 14–18x ARR). While not a pure NDR comp, Illumio's
              government-heavy enterprise security positioning and premium multiple illustrate how zero-trust network
              security vendors can command above-NDR multiples when regulatory tailwinds are strong. Vectra AI, an
              AI-driven NDR vendor, raised a Series F in 2022 at an undisclosed valuation; market observers estimated
              $1.5–2.5B, representing 8–15x estimated ARR of ~$150M. Corelight's implied valuation of $1.0–1.5B at a
              $120–150M estimated ARR run-rate would represent a 7–10x forward multiple, which sits in the middle of the
              NDR private-round reference range and below the Illumio premium. The conclusion is that Corelight is not
              overvalued relative to NDR comps, but it is not cheap: absent confirmed NRR, margin, and growth durability
              data, the comparable set justifies a TRACK rather than a BUY.
            claimRefs:
              - CV019
              - CV020
              - CV021
