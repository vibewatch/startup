        - Low – ICSI relationship is long-standing and stable
        - High – loss of trademark license would require full product rebrand
        - Ongoing collaborative relationship with ICSI; Corelight as primary Zeek funder
        - Medium – license survivability in M&A / change-of-control not publicly confirmed
        - >-
          Obtain and review ICSI trademark license agreement: confirm perpetual term, change-of-control survival, and
          exclusivity provisions
      - - US Executive Order 14028 – Software Supply Chain / SBOM
