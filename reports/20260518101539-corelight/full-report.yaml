      - number: '6.2'
        title: 'Growth and Adoption Trajectory: ARR Expansion and SaaS Acceleration'
        blocks:
          - type: paragraph
            body: >-
              Corelight's growth trajectory is anchored by the April 2024 Series E data point: over 40% year-over-year
              ARR growth, with 300% year-over-year growth in AI and SaaS-driven NDR solutions. These figures,
              company-claimed and unverified by independent audit, indicate two concurrent growth drivers. First, net
              new logo acquisition: at an estimated NRR of 115–130%, organic expansion within existing accounts would
              account for 15–30 percentage points of ARR growth — leaving 10–25 percentage points to be explained by new
              customer adds. Second, product mix expansion: the disproportionately faster growth of SaaS and cloud
              sensor components relative to the overall business suggests that existing on-premise sensor customers are
              adding cloud and SaaS layers as their organizations migrate workloads to AWS, Azure, and GCP, driving
              natural upsell without requiring competitive displacement. The customer acquisition funnel operates
              through three channels: (1) direct enterprise sales to Fortune 500 and government accounts, typically
              involving a pre-sales engineering proof-of-concept and multi-month procurement cycle; (2) channel partner
              referrals through CrowdStrike Falcon, Cisco XDR, and Mandiant incident response services, which embed
              Corelight as the network detection layer and effectively warm-introduce Corelight to the partner's
              enterprise customer base; and (3) MSSP channel, where MSSPs deploy Corelight at scale across their client
              portfolios. The Zeek open-source community provides a supplementary awareness and conversion channel,
              particularly for university and national laboratory accounts. Deployment friction is low per PeerSpot
              reviews — 'straightforward and easy, with many deployments handled remotely' — which supports efficient
