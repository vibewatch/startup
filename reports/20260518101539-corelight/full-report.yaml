    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Market Position
        blocks:
          - type: paragraph
            body: >-
              Corelight, Inc. is a privately held cybersecurity company headquartered in San Francisco, California,
              focused exclusively on network detection and response (NDR). The company was incorporated in 2013 by the
              creators of Zeek (formerly known as Bro), the widely-adopted open-source network security monitor
              developed at the International Computer Science Institute (ICSI) in Berkeley. Corelight's core mission is
              to transform raw network traffic into high-fidelity evidence that security operations center (SOC)
              analysts use to detect, investigate, and respond to advanced threats. The company markets its offering as
              an 'Open NDR Platform'—built on the open-source technologies Zeek, Suricata, and Sigma—providing what it
              describes as evidence-based network detection with over 70,000 out-of-the-box signatures and behavioral
              and AI-driven detections covering more than 80 MITRE ATT&CK tactics, techniques, and procedures (TTPs).
              Corelight serves a global customer base that includes Fortune 500 corporations, major federal and civilian
              government agencies, and large research universities. Its platform is available as physical hardware
              sensors, virtual sensors, and cloud-native deployments across AWS, GCP, and Azure. In the 2025 Gartner
              Magic Quadrant for Network Detection and Response, Corelight was named a Leader, a third-party validation
              of platform maturity, enterprise traction, and completeness of vision. Corelight is the custodian of the
              Zeek open-source project, providing financial backing, code contributions, and community stewardship that
              reinforce the company's open-core competitive positioning. The NDR market in which Corelight operates is
              estimated at approximately $3–4 billion in 2024 and is expected to grow significantly through the
              remainder of the decade, driven by the proliferation of hybrid and cloud-native infrastructure that
              creates new network blind spots and by increasing sophistication of adversarial tradecraft. As of the
              April 2024 Series E announcement, Corelight self-described as the 'industry's fastest-growing, scaled NDR
              platform' with over 40% year-over-year ARR growth and 300% year-over-year growth in its AI and SaaS-driven
              NDR solutions.
