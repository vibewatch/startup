            - Material SaaS data breach (multi-tenant metadata)
            - FedRAMP delay blocks federal cloud ARR
        - label: High Severity
          values:
            - Dominant Zeek fork; CEO Brian Dye departure; Vern Paxson departure / IP dispute
            - EAR export control violation; CrowdStrike/Cisco integration deprecation; Zeek zero-day CVE
            - Government contract loss (>15% ARR); CMMC non-compliance blocks DoD procurement
        - label: Medium Severity
          values:
            - ICSI governance change; Suricata GPL compliance defect
            - Cloud provider API change (mirroring); Mandiant/Google partnership loss; CTO vacancy
            - GDPR/CCPA non-compliance (EU customer data); ML false positive alert fatigue
