      - number: '5.4'
        title: 'Integrations and Partner Ecosystem: SIEM, XDR, and Open Export'
        blocks:
          - type: paragraph
            body: >-
              Corelight's integration strategy is built around the principle that network evidence should flow into the
              customer's existing security stack rather than requiring analysts to adopt a proprietary Corelight
              console. The Corelight for Splunk application, available on the Splunk marketplace, packages pre-built
              dashboards, correlation searches, and sourcetype configurations to ingest Zeek logs directly into Splunk
              Enterprise or Splunk Cloud, enabling analysts to use familiar SPL queries on network evidence alongside
              endpoint and identity telemetry. Microsoft Sentinel integration is provided via a dedicated data connector
              that maps Zeek log fields to the Azure Monitor log schema, supporting KQL-based analytics and MITRE ATT&CK
              workbooks within the Sentinel native environment. A blog post from Corelight in 2024 described the
              Sentinel integration as enabling smarter alert triage and reducing analyst fatigue by combining
              Corelight's high-fidelity network evidence with Sentinel's AI-driven analytics. Google Chronicle
              integration provides a cloud-native SIEM path for organizations on the Google security stack. IBM QRadar
              support is provided via a Device Support Module (DSM) enabling Corelight log normalization within QRadar.
              Elasticsearch, Kibana, and OpenSearch are supported as direct export targets for customers operating
              open-source SIEM stacks. Apache Kafka is supported for high-throughput log streaming to data lakes, SOAR
              platforms, and custom analytics pipelines. The CrowdStrike Falcon integration—bolstered by CrowdStrike's
              strategic investment in Corelight—provides API-driven enrichment that correlates network session evidence
              from Corelight with endpoint process and threat telemetry from the CrowdStrike Falcon platform, enabling
              analysts to pivot from a suspicious network connection to the specific endpoint process that initiated it.
              The Cisco XDR integration, announced in 2024, feeds Corelight high-fidelity network evidence into Cisco's
              extended detection and response platform, leveraging Corelight's sensor network as a telemetry source for
              Cisco's AI-driven correlation engine. These partnerships mean that Corelight sensors function as a
              foundational network evidence layer in multiple larger security platforms rather than only as a standalone
              NDR tool.
            claimRefs:
