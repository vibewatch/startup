      Cloud sensor and SaaS analytics pricing determines the unit economics of the fastest-growing segment (300% YoY).
      Without knowing the pricing model, it is impossible to validate whether the SaaS growth reflects new customer
      acquisition or price-per-unit expansion. Pricing structure also affects gross margin modeling for the SaaS layer.
    diligencePath: >-
      Request Corelight product pricing sheet for cloud sensor (per-sensor/per-terabyte/per-GB/seat) and SaaS analytics
      (per-user or capacity-based) tiers; compare against NDR peer pricing disclosures from Darktrace and Vectra for
      reasonableness.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI001
  - id: EGE001
    topic: Corelight sensor technical documentation
    description: >-
      docs.corelight.com returned HTTP 401 during research, blocking access to official sensor deployment guides,
      protocol parser documentation, and API references. The technical architecture described in this chapter is
      reconstructed from blog posts, product pages, and Zeek open-source documentation rather than official Corelight
      technical docs. Performance reliability metrics and drop-rate data are not publicly disclosed.
    impact: medium
    relatedQuestionRefs:
      - QE021
    diligencePath: >-
      Request access to the Corelight technical documentation portal and sensor deployment guides directly from
      Corelight during due diligence.
  - id: EGE002
    topic: ML model architecture and detection quality benchmarks
    description: >-
      Corelight does not publicly document its ML anomaly detection model architecture, training data sources,
      versioning policy, false-positive rates, or benchmark comparisons. The Sensor v29 ML enhancements are described
      only in high-level blog posts without technical specifics.
    impact: high
    diligencePath: >-
      Request technical white paper on ML detection methodology, false-positive rate data, and third-party evaluation
      (e.g., NSS Labs equivalent) during due diligence.
  - id: EGE003
    topic: FedRAMP authorization timeline and scope
    description: >-
      Corelight has not disclosed a specific FedRAMP authorization timeline or the exact scope of products under
      authorization review. The absence of Corelight from the FedRAMP Marketplace authorized product list as of mid-2026
      confirms authorization is not yet complete.
    impact: medium
    diligencePath: >-
      Check the FedRAMP Marketplace (fedramp.gov) for current status; request Corelight FedRAMP authorization timeline,
      agency sponsor name, and authorization scope in due diligence.
  - id: EGE004
    topic: Physical sensor manufacturing supply chain and hardware BOM
    description: >-
      Corelight does not publicly disclose its physical sensor hardware supply chain, manufacturing partners, component
      BOM, or lead times. Supply chain concentration and component availability risk cannot be assessed from public
      sources.
    impact: low
    diligencePath: >-
      Request hardware BOM summary, manufacturing partner names, and component lead time data from Corelight operations
      team during due diligence.
  - id: EGE005
    topic: Vulnerability disclosure policy and CVE history
    description: >-
      No public Corelight PSIRT, bug bounty program, or coordinated vulnerability disclosure policy was identified.
      Historical CVE exposure from Zeek and Suricata open-source components is documentable via public CVE databases but
      Corelight-specific sensor CVE history is not available from public sources.
    impact: medium
    relatedQuestionRefs:
      - QE024
    diligencePath: >-
      Request Corelight PSIRT policy, historical CVE list for sensor software, responsible disclosure contacts, and
      patch SLA commitments during due diligence.
  - dimension: quantification
    description: >-
      Corelight does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), or customer churn
      rates. The NRR estimate of 115–130% is analyst-derived from sector benchmarks and proxy signals, not verified
      cohort data. No annual recurring revenue figure, customer count, or segment revenue breakdown is publicly
      available.
    severity: major
    type: no-public-evidence
    topic: NRR, GRR, ARR, and customer count not disclosed
    missingEvidence: >-
      Corelight does not publicly disclose net revenue retention, gross revenue retention, customer churn rates, ARR, or
      customer count. Cohort data and segment revenue breakdown are entirely unavailable from public sources.
    whyItMatters: These are the most critical SaaS health metrics; their absence creates significant financial diligence risk.
    relatedQuestionRefs:
      - QU017
      - QU018
    relatedTableRefs:
      - TU004
  - dimension: enumeration
    description: >-
      No named Fortune 500 commercial enterprise customers are publicly confirmed in case studies on Corelight's
      website. Government customer names (beyond general agency descriptions in peer reviews) are also undisclosed. The
      customer list must be assembled from indirect review evidence and company segment claims.
    severity: major
    type: no-public-evidence
    topic: Named enterprise and government customers not publicly disclosed
    missingEvidence: >-
      No named Fortune 500 or government agency customers are confirmed in public case studies. Customer list is
      assembled entirely from indirect review evidence and company segment claims.
    whyItMatters: Named customer references and case studies are standard diligence inputs for enterprise SaaS vendor assessment.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - dimension: quantification
    description: >-
      Customer concentration data — the ARR share of the top 10 accounts — is not disclosed. Given the estimated
      $200K–$1M+ contract values for government and large enterprise accounts, concentration risk in the top 5–10
      accounts could be significant and is a critical diligence item.
    severity: moderate
    type: no-public-evidence
    topic: Customer ARR concentration among top accounts not disclosed
    missingEvidence: No data on customer concentration, top-account ARR share, or government contract terms is publicly available.
    whyItMatters: High customer concentration could create material ARR risk from a single non-renewal.
    relatedQuestionRefs:
      - QU022
      - QU013
    relatedTableRefs:
      - TU005
  - id: EGR001
    type: private-evidence-only
    severity: blocking
    topic: Zeek trademark license change-of-control survival
    missingEvidence: >-
      Full text of the ICSI-Corelight trademark license agreement, specifically change-of-control provisions, term, and
      exclusivity
    whyItMatters: >-
      If the Zeek trademark license does not survive a change of control, any acquirer must rebrand the entire product
      suite immediately post-closing, creating material transaction risk and destroying brand equity built around the
      Zeek name
    diligencePath: >-
      Obtain and review the ICSI-Corelight trademark license agreement; confirm CoC survival clause, perpetual term or
      term extension provisions, and absence of competing licensee rights
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - id: EGR002
    type: private-evidence-only
    severity: material
    topic: CrowdStrike and Cisco strategic investor rights
    missingEvidence: >-
      Series E term sheet and investor rights agreement covering CrowdStrike Falcon Fund and Cisco Investments,
      specifically board observer rights, information rights, ROFR, co-sale, and M&A notification provisions
    whyItMatters: >-
      Information rights or board observer rights held by direct competitors (CrowdStrike, Cisco) in an M&A process
      create structural conflict risk; ROFR provisions could give competitors first-refusal on acquisition opportunities
    diligencePath: >-
      Request and review Series E term sheet, investor rights agreement, and any side letters for CrowdStrike Falcon
      Fund and Cisco Investments positions
    relatedQuestionRefs:
      - QR008
      - QR009
  - id: EGR003
    type: private-evidence-only
    severity: material
    topic: Vern Paxson IP assignment from ICSI and LBL research
    missingEvidence: >-
      Executed IP assignment agreement transferring all Zeek-related inventions, patents, and know-how from Vern
      Paxson's ICSI and Lawrence Berkeley National Laboratory research period to Corelight
    whyItMatters: >-
      If Zeek's core inventions were not fully assigned to Corelight, foundational IP could remain with ICSI or LBL,
      creating IP ownership uncertainty that would affect acquisition valuation and post-closing technology rights
    diligencePath: >-
      Request IP assignment agreement(s) from Vern Paxson and confirm all Zeek-related IP is fully assigned; review any
      ICSI or LBL institutional IP policy that may have created residual rights
    relatedQuestionRefs:
      - QR012
  - id: EGR004
    type: private-evidence-only
    severity: material
    topic: Zeek maintainer engineering attrition
    missingEvidence: >-
      Engineering retention metrics for core Zeek maintainers and security researchers, including attrition rate,
      average tenure, and equity refresh program details
    whyItMatters: >-
      Loss of Zeek maintainers would slow the sensor product roadmap, weaken Corelight's open-source community
      influence, and reduce its ability to attract top security engineering talent who joined to work on Zeek
    diligencePath: >-
      Request engineering attrition data, named Zeek maintainer roster, vesting schedules, and equity refresh program
      terms for key engineering personnel
    relatedQuestionRefs:
      - QR014
  - id: EGR005
    type: private-evidence-only
    severity: material
    topic: cloud sensor API pricing margin impact
    missingEvidence: >-
      AWS VPC Traffic Mirroring, Azure vTAP, and GCP Packet Mirroring API pricing per GB and its impact on cloud sensor
      cost of goods and gross margin
    whyItMatters: >-
      Cloud sensor gross margin is directly affected by cloud provider API pricing for traffic mirroring; changes to
      pricing or metering could compress cloud sensor economics and affect Corelight's SaaS profitability model
    diligencePath: >-
      Request cloud COGS breakdown and cloud sensor gross margin by cloud provider; review cloud provider API pricing
      terms and any volume commitments
    relatedQuestionRefs:
      - QR020
  - title: Post-Money Series E Valuation Not Publicly Disclosed
    relatedQuestionRefs:
      - QV031
    body: >-
      Corelight has not publicly disclosed the post-money enterprise valuation from the April 2024 Series E. All
      valuation estimates in this chapter are analyst-derived inferences from comparable company multiples and ARR
      extrapolation. The actual valuation and preference terms are the single most important missing input for a full
      investment recommendation.
    diligencePath: >-
      Request Series E preferred stock purchase agreement, investor rights agreement, and post-money capitalization
      table from the company data room; alternatively, secondary market pricing from Forge Global or EquityZen may
      provide a market-based valuation reference.
  - title: NRR and Gross Revenue Retention Are Not Publicly Confirmed
    body: >-
      Corelight has not disclosed net revenue retention (NRR), gross revenue retention (GRR), or cohort expansion data.
      The land-and-expand model that justifies the premium multiple requires NRR above 110–115% to be sustainable;
      without confirmation, the model is an assumption rather than a verified fact.
    diligencePath: >-
      Request trailing 12-month NRR and GRR data disaggregated by customer segment (government vs. commercial) from the
      CFO in a management presentation; confirm calculation methodology aligns with standard SaaS NRR definition
      (beginning ARR + expansions - contractions - churn / beginning ARR).
  - title: TPVG Venture Debt Specific Terms Require Credit Agreement Review
    relatedQuestionRefs:
      - QV003
      - QV011
    body: >-
      While the TPVG 10-K confirms the existence of the Corelight loan, the specific interest rate, outstanding
      principal, covenant package, warrant coverage ratio, and MAC provisions are not disclosed in the TPVG annual
      report at the individual loan level. These terms are essential to model the debt's impact on equity proceeds at
      exit.
    diligencePath: >-
      Request TPVG credit agreement and current loan statements from the Corelight data room; review TPVG quarterly 10-Q
      filings for portfolio fair value updates that may provide indicative information on the loan's current carrying
      value.
  - title: Cumulative Liquidation Preference Stack Across All Equity Rounds Unknown
    relatedQuestionRefs:
      - QV004
      - QV005
    body: >-
      Five equity rounds (Seed through Series E) have accumulated liquidation preferences that are unknown without
      reviewing the capitalization table and each round's preferred stock certificate of incorporation. Participating
      preferred structures (common in venture rounds) can significantly reduce common equity proceeds at a given exit
      EV.
    diligencePath: >-
      Request the fully diluted cap table showing all share classes, per-share preference amounts, participation rights,
      and anti-dilution provisions from Seed through Series E from the company's legal counsel or CFO.
  - title: ARR Breakdown by Product Line, Geography, and Customer Segment Not Available
    relatedTableRefs:
      - TV004
    body: >-
      The only publicly available financial metric is the ARR growth rate (40%+ YoY) disclosed in the April 2024 Series
      E press release. No breakdown by product (sensors, SaaS, managed NDR), geography (US vs. international), or
      customer type (government vs. commercial enterprise) is available from public sources.
    diligencePath: >-
      Request CFO-level ARR breakdown across product, geography, and segment; request customer cohort analysis showing
      ACV by vintage year and segment; request four-quarter ARR walk to confirm growth rate trajectory post-Series-E
      announcement.
  - title: FedRAMP Authorization Status and Timeline Unconfirmed Beyond 'In Progress'
    relatedQuestionRefs:
      - QV023
    body: >-
      The FedRAMP Marketplace lists Corelight cloud products as authorization in progress as of mid-2026. The specific
      3PAO engaged, the milestone schedule, the current phase (initiation, review, or authorization pending), and the
      expected authorization date are not publicly disclosed. This is a critical commercial risk factor for the federal
      civilian cloud growth thesis.
    diligencePath: >-
      Request the FedRAMP authorization milestone plan and 3PAO engagement letter from company management; review the
      FedRAMP Marketplace listing for status updates on a monthly basis; request ATO letters for any agency-specific
      interim authorizations in effect.
