  topStrengths:
    - >-
      Dual Gartner MQ Leader (2024, 2025) and Forrester Wave Leader status from an independently operated, respected
      security analyst community validates platform maturity.
    - >-
      Open-source Zeek custodianship creates a structural moat through community lock-in and ecosystem influence that
      proprietary NDR platforms cannot easily replicate.
    - >-
      Strategic co-investors Cisco and CrowdStrike provide distribution channel alignment and reduce standalone
      displacement risk from the two most capable potential competitors.
  topRisks:
    - >-
      No confirmed ARR, NRR, gross margin, or preference stack; all financial modeling relies on analyst estimates,
      creating fundamental uncertainty for any investment sizing decision.
    - >-
      TPVG venture debt (confirmed per FY2025 10-K) has undisclosed terms; outstanding balance, covenants, and warrant
      dilution impact on equity proceeds at exit are unknown.
    - >-
      NDR market bundling risk from CrowdStrike, Cisco, and Microsoft XDR/SIEM platforms could compress standalone NDR
      pricing and addressable market faster than current analyst forecasts project.
  unresolvedGaps:
    - >-
      Post-money Series E enterprise valuation is not publicly disclosed; all $1.0–1.5B implied EV estimates are analyst
      inferences from comparable company multiples.
    - >-
      TPVG venture debt specific terms (face amount, interest rate, covenant package, warrant coverage, maturity)
      require credit agreement review from the company data room.
    - >-
      Cumulative liquidation preference stack from five equity rounds (Seed through Series E) is unknown without
      reviewing the full cap table and certificate of incorporation.
    - >-
      NRR, GRR, and ARR breakdown by product, geography, and customer segment are not publicly available; the
      land-and-expand model that justifies the premium multiple is unverified.
