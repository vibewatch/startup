  researchQuestions:
    - id: QV001
      question: "What is Corelight's implied enterprise valuation at the April 2024 Series E, and how does it compare to NDR market comparables as of 2026?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >-
        The Series E post-money valuation was not publicly disclosed. Inferred from comparable company
        analysis (Darktrace at 4–6x ARR, ExtraHop M&A at 5–7x, Vectra AI at 8–15x), the implied EV is
        estimated at $1.0–1.5B, representing a 7–10x forward ARR multiple. This is an analyst estimate
        with low confidence; the actual valuation requires company disclosure or secondary market pricing.

    - id: QV002
      question: "What is Corelight's current ARR, NRR, and gross margin as of mid-2026?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >-
        ARR growth above 40% YoY was disclosed in the April 2024 Series E press release; absolute ARR
        is estimated at $120–160M for 2025–2026 based on extrapolation. NRR has not been disclosed.
        Gross margin has not been disclosed; sector benchmarks for hybrid hardware/SaaS NDR vendors
        suggest 73–80% blended. None of these figures are confirmed from public sources.

    - id: QV003
      question: "What are the specific terms of the TPVG venture debt facility disclosed in TPVG's fiscal year 2025 10-K filing?"
      type: verification
      targets: ["contentRequirements/3"]
      status: partial
      answer: >-
        TPVG's fiscal year 2025 Form 10-K (CIK 1580345, SEC EDGAR) confirms an active loan to Corelight,
        Inc. as of December 31, 2025. The filing discloses the loan's existence and classification in
        TPVG's portfolio but does not provide full terms publicly. Interest rate, outstanding principal,
        covenant package, warrant coverage, and maturity date must be obtained from the credit agreement.

    - id: QV004
      question: "What is Corelight's cumulative liquidation preference stack from all equity rounds (Seed through Series E)?"
      type: quantification
      targets: ["contentRequirements/3"]
      status: unresolved

    - id: QV005
      question: "What are the probability-weighted expected returns for Corelight equity holders under the bull, base, bear, and down-round scenarios?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: partial
      answer: >-
        Without the preference stack and TPVG debt terms, the precise return calculation cannot be
        completed. The indicative ranges — bull: $1.5–2.0B EV; base: $1.0–1.5B EV; bear: $600–800M EV;
        down-round: $200–400M EV — provide scenario envelopes from which equity return calculations
        can be derived once the preference stack is known.

    - id: QV006
      question: "Is Corelight's valuation overpriced relative to NDR sector comparables given the combination of unconfirmed NRR and TPVG debt?"
      type: adverse
      targets: ["contentRequirements/2"]
      status: answered
      answer: >-
        The implied 7–10x forward ARR multiple is at a premium to Darktrace's post-IPO trading range
        (4–6x) and at parity with the ExtraHop M&A reference (5–7x). Without confirmed NRR above 110%
        and without reviewing the preference stack, the valuation cannot be certified as attractive.
        The combination of opaque NRR, TPVG debt overhang, and unknown preferences creates a
        meaningful risk that the effective equity multiple at a base-case exit is materially below the
        headline EV, suggesting the entry point is not cheap even if not categorically overvalued.

    - id: QV007
      question: "Could NDR market saturation from XDR and SIEM platform bundling trigger a down-round scenario for Corelight?"
      type: adverse
      targets: ["contentRequirements/4"]
      status: answered
      answer: >-
        DarkReading's 2025 competitive analysis confirms that XDR and SIEM platform vendors are bundling
        network telemetry natively, creating pricing pressure for standalone NDR vendors. For Corelight,
        the government concentration (estimated 30–40% ARR) and open-source Zeek moat partially mitigate
        this risk, but commercial enterprise growth could be impaired if XDR platform bundling accelerates.
        A down-round scenario ($200–400M EV) would require simultaneous competitive displacement,
        FedRAMP failure, and growth deceleration — low probability but non-negligible.

    - id: QV008
      question: "How does the Darktrace public market valuation inform the appropriate multiple for Corelight?"
      type: comparison
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        Darktrace trades at approximately 4–6x trailing ARR as of mid-2026 at a market cap of $3.5–4.5B
        on an estimated $700–900M ARR. Corelight's implied 7–10x multiple premium to Darktrace is
        justified by: (a) private company illiquidity premium (typically 20–40% in reverse), so Corelight
        should trade at a premium; (b) higher estimated growth rate (40%+ vs. Darktrace's ~15–20%);
        (c) higher open-source market differentiation. However, the premium must be confirmed by
        financial data; without NRR confirmation, the premium is uncertain.

    - id: QV009
      question: "What does the ExtraHop/Arista M&A transaction imply for Corelight's potential acquisition valuation?"
      type: comparison
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        Arista acquired ExtraHop in July 2022 for $900M, implying a 5–7x ARR multiple on $130–180M
        estimated ARR. For Corelight at $120–160M estimated ARR, a comparable strategic M&A multiple
        would imply a transaction price of $600M–1.1B. The Arista/ExtraHop transaction provides a
        conservative floor: Corelight's government concentration and Gartner MQ Leader status should
        command a premium over ExtraHop, suggesting a strategic acquisition above $900M is achievable.

    - id: QV010
      question: "What was Corelight's total funding across all known rounds as of mid-2026?"
      type: quantification
      targets: ["contentRequirements/3"]
      status: answered
      answer: >-
        Corelight has raised approximately $310–340M in total equity financing across five known rounds:
        Series E ($150M, confirmed, April 2024); Series D (~$75M, estimated); Series C (~$50M, estimated);
        earlier rounds (~$35–65M, estimated). All amounts except the Series E are analyst estimates from
        market observer sources; exact pre-Series-E round sizes have not been officially confirmed.

    - id: QV011
      question: "Is the TPVG venture debt outstanding as of mid-2026 or has it been repaid?"
      type: verification
      targets: ["contentRequirements/3"]
      status: partial
      answer: >-
        TPVG's fiscal year 2025 10-K (filed February 2026, covering the period ended December 31, 2025)
        includes Corelight as an active portfolio loan. This confirms the debt was outstanding as of
        December 31, 2025. Whether it has been repaid or drawn down since that date is not determinable
        from public sources; the next TPVG quarterly filing (Q1 2026 10-Q) or a management data room
        would confirm the current status.

    - id: QV012
      question: "What are the specific Forrester Wave and Gartner MQ positions that support Corelight's analyst leadership claim?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        The Forrester Wave for Network Analysis and Visibility (Q2 2023, report RES178629) placed Corelight
        as a Wave Leader. The Gartner Magic Quadrant for Network Detection and Response (2024 and 2025
        cycles, document reference 5227863) placed Corelight as a Magic Quadrant Leader. Both designations
        are confirmed from the analyst report references and from Corelight's public investor materials.

    - id: QV013
      question: "Does the NDR market TAM support Corelight's current implied valuation of $1.0–1.5B?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >-
        The NDR market is estimated at $3.5–5.2B in 2024–2026 by MarketsAndMarkets and IDC, growing to
        $8.1B by 2028. At a 7–10x implied ARR multiple on $120–160M ARR, Corelight's EV of $1.0–1.5B
        implies a current market share of approximately 3–5% of the NDR TAM, which is plausible for the
        segment leader and is supported by the TAM growth projections.

    - id: QV014
      question: "What does the Corelight investor page disclose about the investor roster and funding history?"
      type: verification
      targets: ["contentRequirements/3"]
      status: answered
      answer: >-
        Corelight's investor page (corelight.com/company/investors) confirms the investor roster including
        Accel, General Catalyst, Insight Partners, CrowdStrike Falcon Fund, and Cisco Investments.
        It does not disclose round sizes, valuations, or preference terms. The page is consistent with
        the April 2024 Series E press release and investor portfolio page disclosures from Accel,
        General Catalyst, and Insight Partners.

    - id: QV015
      question: "What customer satisfaction evidence supports Corelight's NRR estimation above NDR sector benchmarks?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        PeerSpot reviews confirm strong user satisfaction with detection quality, Zeek log depth, and
        SIEM integration. Gartner Peer Insights reviews for Corelight are consistently positive across
        capability, support, and value dimensions. These qualitative signals are consistent with NRR
        above 110% (the sector benchmark for Gartner MQ Leaders) but do not constitute a confirmation.

    - id: QV016
      question: "Are the Series E investors (CrowdStrike, Cisco) likely to participate in a future acquisition of Corelight?"
      type: mechanism
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        Both CrowdStrike and Cisco have strategic rationale for acquiring Corelight: CrowdStrike would
        add the deepest open-source network telemetry to its XDR platform; Cisco would complement Cisco
        Secure Network Analytics and align Corelight Zeek with Cisco's enterprise security portfolio.
        However, information rights held by both as Series E investors create a structural M&A process
        conflict: if either CrowdStrike or Cisco has ROFR or full information rights, the ability to
        run a competitive M&A auction is impaired. Legal review of the Series E investor rights
        agreement is a prerequisite before assessing acquisition dynamics.

    - id: QV017
      question: "What is the IPO readiness assessment for Corelight given its current financial disclosure and market position?"
      type: verification
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        Corelight meets many IPO prerequisite indicators: dual analyst leadership, Tier-1 investor
        syndicate, confirmed 40%+ ARR growth, and government revenue quality. The primary IPO
        readiness gaps are: FedRAMP authorization incomplete (cloud federal revenue constrained),
        NRR not disclosed publicly (required for S-1 prospectus), and audit-ready financial statements
        not in public domain. The 2026–2027 IPO window is plausible but dependent on FedRAMP achievement
        and macro conditions.

    - id: QV018
      question: "How does Corelight's government revenue concentration affect the bull, base, and bear case valuations?"
      type: mechanism
      targets: ["contentRequirements/4"]
      status: answered
      answer: >-
        Government revenue concentration (estimated 30–40% ARR) has asymmetric effects: in the bull
        case, it provides high-quality, long-duration, high-NRR contracts that anchor ARR and justify
        premium multiples; in the bear case, FedRAMP authorization failure or a major government
        contract loss creates a steep ARR cliff. The government concentration is a double-edged
        factor: premium-supporting when intact, cliff-creating when impaired.

    - id: QV019
      question: "What is the recommended approach to monitoring Corelight's TPVG venture debt status on a quarterly basis?"
      type: mechanism
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        TPVG is a publicly traded BDC that files quarterly 10-Q reports and annual 10-K reports with
        the SEC (CIK 1580345). Reviewing the TPVG quarterly filing schedule and checking the portfolio
        loan schedule for Corelight in each filing provides a free, public monitoring mechanism. TPVG
        also issues earnings releases with portfolio fair value updates. If the Corelight loan drops
        off TPVG's active portfolio schedule in a future filing, it may indicate repayment or write-down.

    - id: QV020
      question: "What NDR market growth evidence supports the bull-case valuation assumption?"
      type: verification
      targets: ["contentRequirements/4"]
      status: answered
      answer: >-
        MarketsAndMarkets (report #11787069) projects the NDR market reaching $8.1B by 2028, IDC (US51781224)
        confirms accelerating NDR adoption in enterprise, and Mordor Intelligence corroborates high single-digit
        to low double-digit CAGR growth. IBM X-Force 2024 confirms increasing network-based attack volumes
        that drive detection demand. Collectively, three independent analyst firms confirm TAM expansion
        consistent with the bull-case assumption.

    - id: QV021
      question: "Does the DarkReading NDR market saturation analysis materially change the base-case valuation?"
      type: verification
      targets: ["contentRequirements/4"]
      status: answered
      answer: >-
        DarkReading's 2025 analysis describes NDR market crowding as a directional trend, not a
        current disruption. The base case does not assume market saturation materializes within the
        2026–2028 valuation window; it assumes Corelight's open-source moat and government concentration
        provide sufficient differentiation to maintain 35–40% ARR growth. The saturation analysis
        is the primary bear-case driver, not the base-case assumption.

    - id: QV022
      question: "What is the Forrester Wave Leader designation's commercial impact on Corelight's enterprise pipeline and pricing?"
      type: mechanism
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        Forrester Wave Leader designations are used by enterprise security procurement teams to shortlist
        vendors in RFP/RFI processes; Wave Leaders typically qualify for inclusion in all competitive
        evaluations from eligible enterprise buyers. This translates to a structurally larger pipeline
        of competitive opportunities than non-Leader vendors. The pricing impact is secondary: Wave
        Leaders can command premium pricing in competitive situations but not monopoly pricing given
        multiple NDR leaders in the market.

    - id: QV023
      question: "What is the likely FedRAMP authorization timeline for Corelight, and what is the commercial impact of each possible outcome?"
      type: freshness
      targets: ["contentRequirements/2"]
      status: partial
      answer: >-
        As of mid-2026, Corelight is listed as FedRAMP authorization in progress. No confirmed completion
        date or 3PAO engagement letter is publicly available. Typical FedRAMP authorization timelines
        are 12–24 months from initiation; if initiated in mid-2024 at Series E, authorization in
        mid-2025 to mid-2026 was plausible but has not been confirmed. If authorization extends past
        2027, the bull case ARR assumptions for federal civilian cloud are materially impaired.

    - id: QV024
      question: "What does the Corelight board composition (post-2026 new board members) imply for exit timing?"
      type: mechanism
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        The February 2026 addition of Hatem Naguib (former CEO Barracuda Networks) to the Corelight
        board (per DarkReading coverage) signals governance deepening consistent with pre-exit preparation.
        Barracuda Networks was acquired by KKR in 2022, giving Naguib direct M&A process experience.
        The board composition, combined with Accel and Insight Partners institutional presence, is
        consistent with active preparation for a 2026–2028 liquidity event.

    - id: QV025
      question: "Is Corelight's estimated ARR of $120–160M consistent with the industry-standard implied valuation methodology for growth-stage NDR companies?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >-
        The ARR estimate ($120–160M for 2025–2026) is derived by applying the company-disclosed 40%+
        growth rate forward from an estimated $65–90M ARR at the pre-Series-D period. The methodology
        is consistent with standard growth-rate extrapolation used for private company ARR estimation.
        MarketsAndMarkets and IDC TAM projections support a Corelight market share of 3–5% at this
        ARR level, which is plausible for the segment's leading vendor.

    - id: QV026
      question: "Does Accel's historical cybersecurity portfolio exit performance provide evidence for the Corelight exit timeline and multiple assumptions?"
      type: comparison
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        Accel has led or co-led cybersecurity investments including CrowdStrike (IPO 2019, peak $70B+
        market cap), Tenable (IPO 2018), and others with strong exit outcomes. Accel's portfolio page
        confirms Corelight as an active investment. The firm's track record in enterprise security
        supports the inference that Accel is actively working toward a liquidity event (IPO or M&A)
        within the 2026–2029 window post-Series E.

    - id: QV027
      question: "What specific evidence supports the claim that Corelight's investor syndicate creates M&A optionality?"
      type: verification
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        CrowdStrike Falcon Fund (Series E co-investor) is a corporate venture capital arm of a public
        company with $70B+ market cap and the financial capacity to acquire Corelight. Cisco Investments
        (Series E co-investor) is a division of Cisco Systems, which has been one of the most active
        enterprise security acquirers globally. Both investors hold strategic information rights.
        The combination of financial capacity, strategic rationale, and existing information access
        creates structural M&A optionality, though it simultaneously creates competitive-conflict risk.

    - id: QV028
      question: "What is the risk that the Series E investor rights provisions impair the ability to run a competitive M&A auction?"
      type: adverse
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        Series E investor rights agreements commonly include: right of first refusal (ROFR) on secondary
        sales; co-sale rights; information rights including quarterly financial reporting and M&A notice
        requirements. If CrowdStrike or Cisco holds ROFR or M&A process information rights, any competing
        acquirer's offer could be pre-empted, reducing competitive tension and potentially the acquisition
        premium. This is a real structural risk that is not unusual in strategic-investor-backed deals;
        it is why legal review of the Series E investor rights agreement is a P1 diligence item.

    - id: QV029
      question: "How does Corelight's open-source Zeek moat affect the down-round risk probability?"
      type: mechanism
      targets: ["contentRequirements/4"]
      status: answered
      answer: >-
        The Zeek open-source moat reduces, but does not eliminate, down-round risk. It reduces risk by
        creating a non-replicable community adoption base and lock-in through the Zeek scripting ecosystem.
        It does not eliminate risk because the BSD license permits forks, and a well-funded fork could
        commoditize the base engine. The primary down-round catalyst is not Zeek fork risk but rather
        own-platform security breach or major government contract loss, both of which are event-driven
        rather than structural.

    - id: QV030
      question: "What does the Corelight press releases page reveal about recent company milestones as of mid-2026?"
      type: freshness
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        Corelight's press releases page (corelight.com/press-releases/) confirms ongoing announcement
        activity including product launches, partnership announcements, and the Series E funding event.
        The page does not contain revenue disclosures or financial metrics. The cadence of announcements
        is consistent with an active growth-stage company preparing for public market visibility.

    - id: QV031
      question: "What is the estimated IRR for a mid-2024 Series E investor under the base-case valuation scenario?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: partial
      answer: >-
        Without the preference stack and specific Series E pricing, exact IRR cannot be computed. Using
        the implied $1.0–1.5B Series E EV as entry and base-case exit of $1.0–1.5B in 2027–2028 (3–4
        year hold), the headline return would be approximately flat to 1.5x MOIC, representing a 10–15%
        IRR — below standard growth equity return thresholds. The bull case ($1.5–2.0B exit) implies
        a 1.5–2.0x MOIC and 15–25% IRR, which is more consistent with institutional return expectations.

