company:
  name: "Corelight, Inc."
chapter:
  order: 8
  number: 8
  title: "Valuation"
  letter: "V"
  summary: >-
    Corelight enters the mid-2026 diligence window as the most credentialed independent pure-play NDR vendor
    globally: dual Gartner Magic Quadrant Leader and Forrester Wave Leader designations, a $150M Series E led
    by Accel with strategic participation from CrowdStrike and Cisco Investments (April 2024), and the
    highest-quality open-source telemetry engine in the market via Zeek. The company has disclosed ARR growth
    above 40% year-over-year and triple-digit cloud/SaaS revenue growth, and it targets the global NDR market
    estimated at $3.5B–$5.2B in 2024–2026 and projected to reach $8.1B by 2028 at roughly 20% CAGR. Against
    this backdrop, the implied enterprise valuation inferred from comparable venture rounds and public NDR
    multiples places Corelight in the $1.0B–$1.5B range at the time of the Series E, representing an
    estimated 7–10x forward ARR multiple. This is at a premium to Darktrace's post-IPO trading range
    (2–4x ARR) but below high-growth pure-SaaS cybersecurity benchmarks (15–30x ARR for CrowdStrike-class
    names), which is appropriate given Corelight's hardware-embedded revenue mix and private-company
    illiquidity discount.
    The investment recommendation is TRACK with medium confidence. The thesis is strong — Corelight has the
    market position, analyst endorsement, and investor quality to be a credible IPO or M&A candidate in the
    2026–2028 window. The anti-thesis is equally structured: valuation is opaque (Series E terms and
    implied post-money valuation not publicly disclosed), NRR and CAC are unconfirmed, preference stack and
    cap table are unknown, and the TPVG venture debt (disclosed in TPVG's SEC 10-K for fiscal year ended
    December 2025) introduces a debt overhang that requires diligence before a TRACK rating can be upgraded
    to BUY. Confidence is medium because the valuation entry point is competitive but not clearly cheap,
    and critical unit economics — NRR, gross margin by segment, burn rate — cannot be confirmed from public
    sources. The bear case (multiple compression in a risk-off environment + NDR market saturation from
    SIEM/XDR/MDR convergence) caps downside at $600–800M. The base case holds $1.0–1.5B. The bull case
    (IPO or strategic M&A at premium) reaches $1.5–2.0B. Eight kill triggers and six priority diligence
    asks are catalogued to convert the TRACK rating into an actionable position.

sections:
  - id: investment-thesis
    title: "Investment Thesis and Anti-Thesis: Market Leadership Versus Valuation Opacity"
    body: >-
      Corelight's investment thesis rests on five compounding pillars that differentiate it from generic
      enterprise security vendors. First, it commands the highest-quality open-source telemetry moat in
      NDR: Zeek (née Bro), created by co-founder Vern Paxson, produces the deepest protocol-level network
      log data available and has achieved dominant adoption in enterprise SOCs, government agencies (CISA,
      Five Eyes), and cloud-native environments. This moat is partially replicable (BSD license allows
      forks) but practically difficult to replicate given Corelight's control of the primary Zeek
      maintainer team and its decade-plus of enterprise hardening above the open-source baseline. Second,
      Corelight has achieved the only dual analyst-leadership position in NDR — Gartner Magic Quadrant
      Leader (2024, 2025) and Forrester Wave Leader (2023) — which is a commercial accelerant because
      enterprise procurement teams rely on these rankings to shortlist vendors. Third, the investor
      syndicate quality is exceptional: Accel (lead, Series E), General Catalyst, Insight Partners,
      CrowdStrike Falcon Fund, and Cisco Investments represent a combination of top-decile growth equity
      experience with strategic co-sell and integration value. Fourth, the TAM is growing: the NDR market
      is projected at $3.5B–$5.2B in 2024–2026 and $8.1B by 2028, driven by zero-trust adoption, cloud
      workload visibility requirements, and increasing regulatory mandates for network-level evidence in
      incident investigations. Fifth, the government revenue base (estimated 30–40% of ARR) provides
      high-quality, sticky, long-duration contracts that are resistant to churn and provide a foundation
      for federal civilian cloud growth once FedRAMP authorization is achieved.
      The anti-thesis is equally rigorous. The NDR market is crowded: Darktrace, ExtraHop/Arista, Vectra AI,
      Microsoft Defender for Identity, Cisco Secure Network Analytics, and Palo Alto Networks all compete in
      overlapping segments. Pricing power is being pressured by SIEM and XDR platforms (CrowdStrike, Sentinel,
      Splunk) that are adding network telemetry natively, threatening to disintermediate NDR point solutions.
      Corelight's valuation is opaque: the Series E post-money was not disclosed, NRR is unconfirmed, the
      preference stack from five prior rounds plus TPVG venture debt is unknown, and the cap table has not
      been reviewed. The TPVG venture debt disclosed in TPVG's fiscal year 2025 10-K filing (SEC) represents
      a debt overhang that senior equity cannot ignore: principal repayment from a liquidity event would
      reduce proceeds available to equity holders, particularly if the exit multiple is below the preference
      stack total. The recommendation of TRACK reflects confidence in the company's strategic position while
      acknowledging that the missing financial data prevents a conviction BUY at this stage.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]

  - id: funding-history-and-capital-structure
    title: "Funding History, Capital Structure, and TPVG Venture Debt Disclosure"
    body: >-
      Corelight has raised approximately $310–340M in total equity financing across five known rounds from
      Seed through Series E. The anchor financing event is the April 2024 Series E: $150M led by Accel with
      participation from CrowdStrike Falcon Fund, Cisco Investments, and existing investors General Catalyst
      and Insight Partners, as confirmed by PR Newswire press release and multiple tier-one media sources.
      Corelight's company investor page and Accel's portfolio page confirm the Series E but do not disclose
      the post-money valuation. Earlier rounds include a Series D (approximate amount ~$75M, 2020–2021 per
      Insight Partners portfolio disclosure), Series C (~$50M, 2019–2020 per General Catalyst portfolio),
      Series B (~$25M, 2018), and a Seed/Series A pre-2018. Total equity raised is estimated at $310–340M,
      of which $150M was raised in the Series E.
      The most significant diligence-relevant disclosure outside the equity record is the TPVG venture debt
      position. TriplePoint Venture Growth (TPVG), a Business Development Company (BDC) that provides
      venture lending to growth-stage technology companies, disclosed an active loan to Corelight, Inc. in
      its fiscal year 2025 annual report (Form 10-K, filed February 2026, covering the period ended December
      31, 2025). TPVG's 10-K is filed publicly on SEC EDGAR under CIK 1580345. The existence of venture
      debt is a capital structure signal: TPVG loans to growth-stage technology companies typically carry
      interest rates of 9–14%, include a warrant coverage component (typically 1–4% of loan face value in
      equity warrants), and are structured with interest-only periods followed by principal amortization.
      Venture debt at this stage is neither positive nor negative per se — it extends runway without dilution
      — but the debt principal sits senior to equity in a liquidation, and warrant dilution is incremental
      to equity round dilution. Diligence must confirm: (a) the face amount and drawn balance of the TPVG
      facility; (b) the interest rate and covenant terms; (c) the warrant coverage ratio; (d) whether any
      material adverse change (MAC) covenants are triggered by a liquidity event; and (e) whether the
      facility has been repaid or remains outstanding as of mid-2026. The Form D search on SEC EDGAR
      confirms multiple Corelight Regulation D filings consistent with the known equity rounds.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV018]
    figureRefs: []

  - id: comparable-company-analysis
    title: "Comparable Company Analysis: NDR Public Companies, M&A Transactions, and Private Benchmarks"
    body: >-
      Corelight's valuation must be contextualized against a carefully selected set of NDR-adjacent
      comparables that span public markets, private rounds, and M&A transactions. The most directly
      comparable public company is Darktrace (London Stock Exchange: DARK), which IPO'd in April 2021
      at a peak valuation of ~$5B and as of mid-2026 trades at a market capitalization of approximately
      $3.5–4.5B, representing roughly 4–6x trailing ARR on an estimated $700–900M ARR base. Darktrace is
      an AI-native network and email security platform with meaningful overlap with Corelight in the
      enterprise NDR segment; its public trading multiple provides the lowest-risk comp for Corelight's
      implied valuation, though Darktrace's revenue scale is approximately 5–7x Corelight's estimated ARR.
      The most relevant M&A transaction is Arista Networks' acquisition of ExtraHop in July 2022 for
      $900M. ExtraHop was a network detection and performance analytics platform with an estimated ARR
      of $130–180M at acquisition, implying a 5–7x ARR acquisition multiple. The ExtraHop transaction
      was completed by a strategic acquirer (Arista) at a below-peak-market multiple, providing a
      conservative floor for Corelight's M&A reference point.
      Illumio, a micro-segmentation and zero-trust networking company, raised $225M in a Series F in
      November 2021 at a $2.75B valuation on estimated ARR of $150–200M (approximately 14–18x ARR).
      While not a pure NDR comp, Illumio's government-heavy enterprise security positioning and
      premium multiple illustrate how zero-trust network security vendors can command above-NDR multiples
      when regulatory tailwinds are strong. Vectra AI, an AI-driven NDR vendor, raised a Series F in
      2022 at an undisclosed valuation; market observers estimated $1.5–2.5B, representing 8–15x
      estimated ARR of ~$150M. Corelight's implied valuation of $1.0–1.5B at a $120–150M estimated
      ARR run-rate would represent a 7–10x forward multiple, which sits in the middle of the NDR
      private-round reference range and below the Illumio premium. The conclusion is that Corelight is
      not overvalued relative to NDR comps, but it is not cheap: absent confirmed NRR, margin, and
      growth durability data, the comparable set justifies a TRACK rather than a BUY.
    claimRefs: [CV019, CV020, CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028]
    tableRefs: [TV004]
    figureRefs: [FV002]

  - id: scenario-valuation-analysis
    title: "Scenario Valuation Analysis: Bull, Base, and Bear Cases with Key Assumptions"
    body: >-
      The valuation scenario analysis constructs three cases differentiated by market multiple, ARR
      growth rate, revenue scale, and exit path. All scenarios use a forward 12-month ARR estimate
      of $130–160M as the base financial metric, consistent with 40%+ YoY growth from an estimated
      $90–120M ARR baseline at the April 2024 Series E.
      The bull case ($1.5–2.0B enterprise value) assumes: (a) Corelight achieves IPO or strategic
      M&A exit in 2026–2027 at a premium to the NDR comp set; (b) FedRAMP authorization is achieved,
      unlocking meaningful federal civilian cloud ARR; (c) NRR is confirmed at 125%+ consistent with
      Gartner Magic Quadrant Leader benchmarks; (d) the NDR TAM expands at the high end of analyst
      projections; and (e) strategic acquirer competition (CrowdStrike, Cisco, Microsoft) creates a
      bidding dynamic. The bull case multiple is 10–14x forward ARR, in line with Illumio's 2021
      Series F and above ExtraHop's 2022 M&A multiple, justified by government concentration and
      open-source moat premiums.
      The base case ($1.0–1.5B enterprise value) assumes: (a) an M&A exit or late-stage secondary
      in 2027–2028; (b) FedRAMP authorization delayed by 12–18 months; (c) NRR confirmed at 110–120%,
      consistent with NDR sector benchmarks; (d) the TPVG venture debt is refinanced or repaid without
      material impact on equity proceeds; and (e) no meaningful competitive displacement by SIEM/XDR
      platform bundling. The base multiple is 7–10x forward ARR.
      The bear case ($600–800M enterprise value) assumes: (a) NDR market saturation accelerates as
      CrowdStrike, Microsoft, and Cisco bundle network telemetry natively; (b) Corelight ARR growth
      decelerates below 20% YoY as land-and-expand motion slows; (c) FedRAMP authorization is not
      achieved before 2027, blocking the federal cloud channel; (d) a down-round dynamic forces a
      valuation reset; and (e) the TPVG debt creates covenant pressure in a slower-growth environment.
      The bear multiple is 4–6x forward ARR, consistent with Darktrace's post-IPO discount trading range
      for slower-growth NDR vendors. The NDR market saturation risk documented in DarkReading's analysis
      of competitive dynamics is the primary bear-case driver: if SIEM and XDR platforms commoditize
      network telemetry, the pricing umbrella for standalone NDR vendors compresses materially.
    claimRefs: [CV029, CV030, CV031, CV032, CV033, CV034, CV035, CV036, CV037, CV038]
    tableRefs: [TV003]
    figureRefs: [FV003, FV004]

  - id: diligence-framework
    title: "Diligence Framework: Kill Triggers, Remaining Asks, and Upgrade Conditions"
    body: >-
      The TRACK recommendation can be upgraded to BUY if six specific diligence conditions are met and
      no kill trigger is activated. The most important single upgrade condition is NRR confirmation above
      115%: if Corelight's net revenue retention is materially below NDR Gartner Leader benchmarks, the
      expansion revenue model that justifies the premium multiple is impaired, and the recommendation
      defaults to PASS. The second upgrade condition is cap table and preference stack review: without
      knowing the cumulative liquidation preferences from five equity rounds plus TPVG warrant coverage,
      the effective equity multiple at a given exit valuation is unknowable. A heavy preference stack
      (e.g., 2x participating preferred) could mean that common equity holders receive materially less
      than the headline exit multiple implies. The third upgrade condition is TPVG debt term review:
      confirming the outstanding principal, interest rate, covenant package, and MAC provision is
      required to model the debt's impact on equity proceeds at exit.
      Eight kill triggers are identified that would convert the TRACK to PASS immediately: (1) a
      material security breach of Corelight's own sensor network (SolarWinds-type supply-chain attack)
      damaging customer trust; (2) loss of a major government contract, particularly a CISA or DoD
      anchor customer; (3) a confirmed down round valuation below the Series E implied value; (4)
      departure of CEO Brian Dye without a named successor in place; (5) a Zeek governance crisis
      (major fork, ICSI trademark dispute, or competitor-funded Zeek distribution); (6) FedRAMP
      authorization denial or indefinite delay past 2027; (7) NRR confirmed below 100% (net churn);
      or (8) competitive displacement of Corelight in two or more Tier-1 anchor government accounts.
      The upgrade path from TRACK to BUY requires all six diligence asks to be answered satisfactorily:
      cap table, financial model with NRR and gross margin, TPVG facility terms, FedRAMP authorization
      timeline, Series E term sheet provision review (CrowdStrike/Cisco information rights and ROFR),
      and a management presentation on the 18-month forward operating plan. The PeerSpot and Gartner
      Peer Insights review data confirm strong customer satisfaction with Corelight's detection quality
      and deployment flexibility, providing qualitative confirmation of the retention thesis. Insight
      Partners' active portfolio page listing and ongoing portfolio engagement reinforce that the lead
      institutional investor is engaged. The recommendation is actionable as TRACK pending receipt of
      the six diligence items above.
    claimRefs: [CV039, CV040, CV041, CV042, CV043, CV044, CV045]
    tableRefs: [TV005, TV006]

callouts:
  - calloutType: strength
    title: "Dual Analyst Leadership (Gartner MQ + Forrester Wave) Is a Rare and Durable Commercial Moat"
    body: >-
      Corelight is the only independent pure-play NDR vendor holding simultaneous Gartner Magic Quadrant
      Leader and Forrester Wave Leader status as of mid-2026. This dual ranking is a direct commercial
      accelerant: enterprise procurement teams shortlist based on these designations, and maintaining both
      across successive cycles demonstrates product and go-to-market durability. Accel and Insight Partners
      both made portfolio investment decisions that explicitly reference the analyst leadership position.
    claimRefs: [CV001, CV004, CV019]
  - calloutType: risk
    title: "TPVG Venture Debt Creates Hidden Equity Dilution and Liquidation Priority Risk"
    body: >-
      The TPVG venture debt disclosed in TPVG's 2025 10-K (SEC EDGAR) sits senior to all equity in a
      liquidation event. Combined with five prior equity rounds of cumulative liquidation preferences,
      the effective equity value to common holders at a given exit price may be materially below the
      headline EV. This is an absolute diligence prerequisite before any investment recommendation
      above TRACK: the preference stack and debt terms must be reviewed against the three valuation
      scenarios to compute actual equity return per share class.
    claimRefs: [CV013, CV014, CV015, CV037]
  - calloutType: risk
    title: "NDR Market Saturation Is the Primary Downside Risk: XDR and SIEM Bundling Threatens Pricing"
    body: >-
      DarkReading's 2025 analysis of the NDR competitive landscape specifically identifies the threat
      that SIEM and XDR platform vendors (CrowdStrike, Microsoft Sentinel, Palo Alto Cortex) are
      bundling network telemetry into broader security operations platform licenses, pressuring the
      pricing umbrella for standalone NDR vendors. Corelight's open-source Zeek differentiation and
      government concentration mitigate this risk, but the bear case depends critically on whether
      Corelight's expansion motion can overcome platform bundling headwinds in commercial enterprise.
    claimRefs: [CV005, CV031, CV036]
  - calloutType: strength
    title: "Exceptional Investor Syndicate Quality Signals Exit Path and Strategic Premium Potential"
    body: >-
      The combination of Accel (top-decile growth equity), General Catalyst, Insight Partners, CrowdStrike
      Falcon Fund, and Cisco Investments creates an investor syndicate that simultaneously validates the
      growth equity thesis (Accel/GC/IP) and signals strategic acquisition interest (CrowdStrike, Cisco).
      The presence of two direct strategic investors with acquisition capability and information rights
      creates a non-trivial probability of a strategic premium exit — though it also creates the board-level
      conflict-of-interest risk documented in Chapter 7.
    claimRefs: [CV011, CV012, CV016, CV042]

