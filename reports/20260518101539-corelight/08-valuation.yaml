        enforcement actions, or credit facility defaults have been identified in public sources.
        The primary adverse indicator is the structural — not event-driven — nature of competitive
        platform bundling from XDR/SIEM vendors.

  evidenceGaps:
    - title: "Post-Money Series E Valuation Not Publicly Disclosed"
      relatedQuestionRefs: [QV031]
      body: >-
        Corelight has not publicly disclosed the post-money enterprise valuation from the April 2024
        Series E. All valuation estimates in this chapter are analyst-derived inferences from comparable
        company multiples and ARR extrapolation. The actual valuation and preference terms are the single
        most important missing input for a full investment recommendation.
      diligencePath: >-
        Request Series E preferred stock purchase agreement, investor rights agreement, and post-money
        capitalization table from the company data room; alternatively, secondary market pricing from
        Forge Global or EquityZen may provide a market-based valuation reference.

    - title: "NRR and Gross Revenue Retention Are Not Publicly Confirmed"
      body: >-
        Corelight has not disclosed net revenue retention (NRR), gross revenue retention (GRR), or
        cohort expansion data. The land-and-expand model that justifies the premium multiple requires
        NRR above 110–115% to be sustainable; without confirmation, the model is an assumption rather
        than a verified fact.
      diligencePath: >-
        Request trailing 12-month NRR and GRR data disaggregated by customer segment (government vs.
        commercial) from the CFO in a management presentation; confirm calculation methodology aligns
        with standard SaaS NRR definition (beginning ARR + expansions - contractions - churn / beginning ARR).

    - title: "TPVG Venture Debt Specific Terms Require Credit Agreement Review"
      relatedQuestionRefs: [QV003, QV011]
      body: >-
        While the TPVG 10-K confirms the existence of the Corelight loan, the specific interest rate,
        outstanding principal, covenant package, warrant coverage ratio, and MAC provisions are not
        disclosed in the TPVG annual report at the individual loan level. These terms are essential
        to model the debt's impact on equity proceeds at exit.
      diligencePath: >-
        Request TPVG credit agreement and current loan statements from the Corelight data room; review
        TPVG quarterly 10-Q filings for portfolio fair value updates that may provide indicative
        information on the loan's current carrying value.

    - title: "Cumulative Liquidation Preference Stack Across All Equity Rounds Unknown"
      relatedQuestionRefs: [QV004, QV005]
      body: >-
        Five equity rounds (Seed through Series E) have accumulated liquidation preferences that are
        unknown without reviewing the capitalization table and each round's preferred stock certificate
        of incorporation. Participating preferred structures (common in venture rounds) can significantly
        reduce common equity proceeds at a given exit EV.
      diligencePath: >-
        Request the fully diluted cap table showing all share classes, per-share preference amounts,
        participation rights, and anti-dilution provisions from Seed through Series E from the
        company's legal counsel or CFO.

    - title: "ARR Breakdown by Product Line, Geography, and Customer Segment Not Available"
      relatedTableRefs: [TV004]
      body: >-
        The only publicly available financial metric is the ARR growth rate (40%+ YoY) disclosed in
        the April 2024 Series E press release. No breakdown by product (sensors, SaaS, managed NDR),
        geography (US vs. international), or customer type (government vs. commercial enterprise)
        is available from public sources.
      diligencePath: >-
        Request CFO-level ARR breakdown across product, geography, and segment; request customer cohort
        analysis showing ACV by vintage year and segment; request four-quarter ARR walk to confirm
        growth rate trajectory post-Series-E announcement.

    - title: "FedRAMP Authorization Status and Timeline Unconfirmed Beyond 'In Progress'"
      relatedQuestionRefs: [QV023]
      body: >-
        The FedRAMP Marketplace lists Corelight cloud products as authorization in progress as of
        mid-2026. The specific 3PAO engaged, the milestone schedule, the current phase (initiation,
        review, or authorization pending), and the expected authorization date are not publicly disclosed.
        This is a critical commercial risk factor for the federal civilian cloud growth thesis.
      diligencePath: >-
        Request the FedRAMP authorization milestone plan and 3PAO engagement letter from company
        management; review the FedRAMP Marketplace listing for status updates on a monthly basis;
        request ATO letters for any agency-specific interim authorizations in effect.
