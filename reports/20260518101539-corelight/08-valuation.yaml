  - id: TV005
    title: "Thesis-Break Triggers and Kill Criteria"
    columns:
      - "Trigger"
      - "Monitoring Signal"
      - "Transmission to Thesis"
      - "Assessment Frequency"
      - "Action"
    rows:
      - - "Material security breach of Corelight sensors or SaaS platform (SolarWinds-equivalent)"
        - "CVE disclosure; CISA advisory; customer termination notices; news coverage of incident"
        - "Catastrophic — destroys customer trust in an NDR vendor's own security; government contract termination likely; irreversible reputational damage"
        - "Continuous monitoring"
        - "Immediate PASS; exit any position; notify compliance team"
      - - "Loss of Gartner Magic Quadrant Leader status in 2026 annual cycle"
        - "Gartner NDR Magic Quadrant publication (annual, typically Q3)"
        - "High — dual analyst leadership is the primary commercial moat; loss signals competitive displacement"
        - "Annual (Gartner publication)"
        - "Downgrade to PASS; reassess competitive position before any re-entry"
      - - "Confirmed down-round valuation below Series E implied value"
        - "Form D filing; news coverage; investor communication; secondary market pricing"
        - "High — confirms that growth expectations have been reset; creates preference overhang crisis and anti-dilution ratchets"
        - "Quarterly monitoring via SEC EDGAR Form D filings"
        - "PASS; review cap table implications; assess whether down-round terms restructure the exit economics"
      - - "CEO Brian Dye departure without named replacement"
        - "Press release; LinkedIn; management presentation"
        - "High — Dye has led the company through its most commercially critical phase; departure before IPO/M&A creates leadership vacuum"
        - "Continuous"
        - "PASS pending assessment of successor quality; 60-day hold before re-evaluation"
      - - "NRR confirmed below 100% (net churn)"
        - "Management disclosure; investor update; financial data room"
        - "Critical — net churn means the subscription base is contracting; the land-and-expand model is failing; premium multiple not supportable"
        - "Upon receipt of financial data room materials"
        - "Immediate PASS; the valuation thesis depends on NRR above 110%"
      - - "FedRAMP authorization denied or delayed indefinitely past 2027"
        - "FedRAMP Marketplace status update; press release; contract award notices"
        - "Medium-high — federal civilian cloud ARR channel blocked; limits TAM expansion; bear case probability increases"
        - "Semi-annual review of FedRAMP Marketplace status"
        - "Reduce target valuation to bear case range; maintain TRACK only if commercial enterprise growth offsets government cloud delay"
      - - "Zeek major fork or ICSI trademark dispute emerges"
        - "GitHub fork activity; ICSI press release; court filings; open-source community discourse"
        - "High — open-source moat is the core technical differentiation; a funded fork commoditizes the engine"
        - "Quarterly via GitHub and news monitoring"
        - "PASS if fork gains material enterprise adoption; reassess timeline for re-entry"
      - - "TPVG debt covenant breach or MAC trigger notification"
        - "SEC EDGAR TPVG 10-Q/10-K disclosures; news; TPVG investor relations"
        - "High — covenant breach signals financial stress; could accelerate debt repayment and impair equity proceeds"
        - "Quarterly via TPVG SEC EDGAR filings"
        - "PASS; escalate to legal review; assess TPVG facility terms immediately"
    notes: >-
      Kill triggers are intended to operate as binary decision gates: if a trigger is confirmed, the
      recommendation moves to PASS without waiting for additional analysis. Assessment frequencies are
      minimum recommended intervals; continuous news monitoring should supplement scheduled reviews.
      Triggers 1 (security breach) and 5 (NRR below 100%) are unconditional immediate PASS triggers.

  - id: TV006
    title: "Final Diligence Asks"
    columns:
      - "Topic"
      - "Specific Ask"
      - "Why It Matters"
      - "Source / Diligence Path"
      - "Priority"
    rows:
      - - "Cap Table and Preference Stack"
        - "Provide fully diluted cap table showing all share classes, option pool, warrant coverage, and liquidation preferences from Seed through Series E"
        - "Without the preference stack, effective equity multiple at any exit EV is unknown; participating preferred with 2x preferences could reduce common holder proceeds by 30–60% in base case"
        - "Company data room; legal counsel for share structure review"
        - "Critical (P0)"
      - - "NRR and Gross Revenue Retention"
        - "Provide trailing 12-month NRR, gross revenue retention, and expansion vs. contraction breakdown by customer cohort and segment"
        - "NRR is the single most important indicator of whether the land-and-expand model is working; below 110% NRR triggers bear case multiple compression; below 100% triggers PASS"
        - "CFO presentation; audited financials; SaaS metrics dashboard"
        - "Critical (P0)"
      - - "TPVG Venture Debt Facility Terms"
        - "Provide TPVG credit agreement, current drawn balance, interest rate, maturity date, covenant package, warrant coverage, and MAC provisions"
        - "Venture debt sits senior to equity in liquidation; MAC covenants could accelerate repayment in adverse conditions; warrant dilution is incremental to equity round dilution"
        - "TPVG credit agreement in data room; TPVG SEC EDGAR disclosures; legal counsel review"
        - "High (P1)"
      - - "ARR Breakdown by Segment and Customer Cohort"
        - "Provide ARR disaggregated by product line (sensors, SaaS, managed), customer segment (government, commercial enterprise, international), and cohort vintage"
        - "Government concentration risk (estimated 30–40%) requires segment ARR to assess cliff risk; SaaS/cloud vs. hardware mix drives gross margin and multiple"
        - "CFO presentation; annual operating metrics report"
        - "High (P1)"
      - - "Series E Term Sheet — CrowdStrike and Cisco Information Rights"
        - "Provide Series E preferred stock purchase agreement and investor rights agreement; confirm scope of CrowdStrike Falcon Fund and Cisco Investments information rights, board observer rights, ROFR, and co-sale provisions"
        - "CrowdStrike and Cisco are direct competitors; if they hold full information rights including M&A process disclosure rights, this creates a conflict of interest in any competitive M&A scenario; legal review of provisions is essential before any recommendation upgrade"
        - "Series E transaction documents; legal counsel review of investor rights agreement"
        - "High (P1)"
      - - "FedRAMP Authorization Timeline and 3PAO Engagement"
        - "Provide FedRAMP authorization milestone plan, current 3PAO (Third Party Assessment Organization) engagement letter, and interim procurement vehicle strategy (ATOs, P-ATOs)"
        - "FedRAMP authorization is on the critical path for federal civilian cloud ARR; delay past 2027 shifts the model to bear case; knowing the 3PAO engagement confirms active progress"
        - "Company management presentation; FedRAMP PMO"
        - "Medium (P2)"
    notes: >-
      Priority levels: P0 (must receive before any recommendation upgrade from TRACK), P1 (must receive
      before capital deployment), P2 (required before IPO or M&A transaction close). All six items are
      standard institutional investor diligence requests; refusal to provide any P0 or P1 item should be
      treated as a negative signal and may trigger reclassification to PASS.

figures:
  - id: FV001
    title: "Investment Decision Logic"
    type: flow
    layout: wide
    summary: >-
      The investment decision logic traces from the four primary evidence categories — market position,
      financial signals, valuation context, and risk assessment — through the conditional gates that
      determine whether the recommendation is BUY, TRACK, or PASS. The current state is TRACK pending
      resolution of six open diligence items; each gate shows the specific condition that, if unmet,
      routes to PASS.
    data:
      nodes:
        - id: market-signal
          label: "NDR market leadership confirmed"
          detail: "Gartner MQ Leader 2024–2025; Forrester Wave Leader 2023; dual analyst validation. High-confidence pillar."
          tone: positive
        - id: financial-signal
          label: "40%+ ARR growth; SaaS 300% YoY"
          detail: "Company-disclosed; April 2024 press release. Single data point; NRR not confirmed. Medium confidence."
          tone: neutral
        - id: investor-signal
          label: "Tier-1 investor syndicate"
          detail: "Accel, GC, Insight Partners, CrowdStrike, Cisco. Confirms exit path optionality. High confidence."
          tone: positive
        - id: valuation-gate
          label: "Implied $1.0–1.5B at 7–10x ARR"
          detail: "Inferred from comps; not confirmed. Not cheap but not overvalued relative to NDR benchmarks."
          tone: neutral
        - id: risk-gate
          label: "Medium-high risk: TPVG debt, NRR unknown, FedRAMP gap"
          detail: "Three co-present risk factors: venture debt, unconfirmed NRR, FedRAMP authorization incomplete."
          tone: warning
        - id: diligence-gate
          label: "6 open diligence items (P0: cap table + NRR)"
          detail: "Cap table, NRR, TPVG terms, ARR breakdown, Series E term sheet, FedRAMP timeline."
          tone: warning
        - id: track-recommendation
          label: "TRACK — monitor, do not deploy capital yet"
          detail: "Sufficient evidence for high conviction in market position; insufficient evidence for valuation underwriting."
          tone: neutral
        - id: buy-path
          label: "BUY if all 6 diligence asks resolved satisfactorily"
          detail: "Upgrade path: NRR >115%, cap table reviewed, TPVG terms confirmed, no kill trigger activated."
          tone: positive
        - id: pass-path
          label: "PASS if any kill trigger activated"
          detail: "8 kill triggers identified; any single trigger routes to immediate PASS without further analysis."
          tone: negative
      edges:
        - from: market-signal
          to: valuation-gate
        - from: financial-signal
          to: valuation-gate
        - from: investor-signal
          to: valuation-gate
        - from: valuation-gate
          to: risk-gate
        - from: risk-gate
          to: diligence-gate
        - from: diligence-gate
          to: track-recommendation
        - from: track-recommendation
          to: buy-path
        - from: track-recommendation
          to: pass-path
    approximationNotes: >-
      The decision flow is a logical representation of the recommendation framework; it does not represent
      a formal decision tree with probability weights. Each node represents a summary of a more detailed
      evidence assessment documented in the sections, tables, and claims of this chapter.
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV013
      - CV014
      - CV039
      - CV040

  - id: FV002
    title: "NDR Comparable Valuation Multiples"
    type: bar
    layout: wide
    summary: >-
      Revenue multiples across the NDR comparable company set illustrate that Corelight's implied 7–10x
      forward ARR multiple is positioned in the middle of the observable range — above Darktrace's
      post-IPO trading discount but below CrowdStrike's platform premium. The ExtraHop M&A transaction
      provides the most relevant acquisition reference point at 5–7x ARR. The Illumio and Vectra AI
      private round multiples show the range of premiums available in government-heavy zero-trust and
      NDR segments at peak-market conditions.
    data:
      items:
        - label: "Darktrace (public, mid-2026)"
          value: 5
          detail: "LSE-listed; estimated 4–6x trailing ARR; mid-point used; revenue scale 5–7x Corelight"
          tone: neutral
        - label: "ExtraHop (M&A, July 2022)"
          value: 6
          detail: "$900M acquisition by Arista; estimated 5–7x ARR at transaction; conservative reference floor"
          tone: neutral
        - label: "Vectra AI (private round est.)"
          value: 11
          detail: "Estimated 8–15x ARR at 2022 Series F; significant uncertainty; mid-point used"
          tone: neutral
        - label: "Illumio (private round, Nov 2021)"
          value: 15
          detail: "$2.75B Series F; zero-trust premium; peak-market 2021 conditions; 14–18x ARR mid-point"
          tone: positive
        - label: "CrowdStrike (public platform)"
          value: 24
          detail: "NASDAQ; 20–28x ARR; platform diversification premium; not a direct NDR comp"
          tone: neutral
        - label: "Corelight (implied, mid-2026)"
          value: 8
          detail: "7–10x forward ARR implied from comp analysis and Series E context; mid-point; not confirmed"
          tone: positive
    approximationNotes: >-
      All revenue multiples are analyst estimates. Darktrace ARR and market cap from public sources as of
      mid-2026. ExtraHop ARR at acquisition is estimated from market observers; transaction price is confirmed.
      Vectra AI, Illumio, and Corelight private financials are not publicly disclosed; all figures are
      inferences from disclosed funding events, market observer estimates, and comparable benchmarks.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026

  - id: FV003
    title: "Corelight Valuation Range by Scenario"
    type: range
    layout: wide
    summary: >-
      The three-scenario valuation range illustrates the asymmetry in the Corelight investment: the bull
      case (IPO or premium M&A at $1.5–2.0B) offers limited upside versus the base case ($1.0–1.5B)
      given the current implied valuation, while the bear case ($600–800M) and down-round case
      ($200–400M) represent material downside relative to the Series E price. The wide range reflects
      genuine uncertainty rather than false precision: without confirmed ARR, NRR, and preference stack,
      the effective equity multiple at any given EV cannot be calculated with precision.
    data:
      items:
        - label: "Down-Round Case"
          low: 200
          mid: 300
          high: 400
          displayValue: "$200M–$400M"
          detail: "Major adverse event (breach, contract loss, NRR collapse); ~3–4x ARR on severely reduced base"
          tone: negative
        - label: "Bear Case"
          low: 600
          mid: 700
          high: 800
          displayValue: "$600M–$800M"
          detail: "NDR saturation + FedRAMP failure + growth deceleration; 4–6x ARR"
          tone: warning
        - label: "Base Case"
          low: 1000
          mid: 1250
          high: 1500
          displayValue: "$1.0B–$1.5B"
          detail: "Sustained 35–40% growth; M&A or late-stage secondary 2027–2028; 7–10x ARR"
          tone: neutral
        - label: "Bull Case"
          low: 1500
          mid: 1750
          high: 2000
          displayValue: "$1.5B–$2.0B"
          detail: "FedRAMP achieved; NRR >125%; IPO or strategic M&A premium; 10–14x ARR"
          tone: positive
    approximationNotes: >-
      Scenario boundaries are analyst estimates based on comparable company analysis and public financial
      signals. No figure has been confirmed by Corelight. The down-round case assumes a major adverse
      event not currently expected as the base case. ARR ranges in each scenario are extrapolated from
      the April 2024 Series E context with 40%+ YoY growth applied forward.
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034

  - id: FV004
    title: "Investment Committee KPI Scorecard"
    type: kpi
    layout: wide
    summary: >-
      The IC KPI scorecard summarizes the key investability dimensions across market, proof, moat,
      economics, risk, valuation, and evidence quality. The scorecard highlights the asymmetry between
      the strong market and product evidence (high confidence) versus the weak financial transparency
      and valuation evidence (low confidence), which drives the TRACK rather than BUY recommendation.
    data:
      items:
        - label: "Recommendation"
          value: "TRACK"
          detail: "TRACK with medium confidence; upgrade to BUY requires 6 diligence items resolved"
        - label: "Implied EV"
          value: "$1.0–1.5B"
          detail: "Inferred from comp analysis; 7–10x forward ARR; not confirmed by company"
        - label: "Market Position Score"
          value: "9 / 10"
          detail: "Dual analyst leader (Gartner + Forrester); highest-quality NDR open-source moat; strong government anchor"
        - label: "Financial Evidence Score"
          value: "3 / 10"
          detail: "Only ARR growth rate disclosed; NRR, gross margin, CAC, burn all unconfirmed; TPVG debt outstanding"
        - label: "Valuation Support Score"
          value: "5 / 10"
          detail: "Multiple is in comp range but not cheap; preference stack unknown; implied EV is inferred not confirmed"
        - label: "Risk Score"
          value: "6 / 10 (medium-high)"
          detail: "TPVG debt, FedRAMP gap, NRR unknown, Cisco/CrowdStrike conflict risk; government concentration"
        - label: "Exit Readiness Score"
          value: "7 / 10"
          detail: "Investor quality signals IPO/M&A preparation; no confirmed timeline; strategic acquirer interest plausible"
        - label: "Evidence Quality"
          value: "Medium"
          detail: "Strong market and analyst evidence; weak financial and valuation evidence; 6 open diligence items"
    approximationNotes: >-
      Scores are analyst-assigned qualitative ratings on a 1–10 scale for comparative purposes within this
      chapter. They reflect the quality and completeness of available evidence, not an absolute ranking of
      the company. Financial evidence score is low due to private-company data absence, not due to any
      confirmed negative finding.
    claimRefs:
      - CV001
      - CV004
      - CV013
      - CV014
      - CV039
      - CV041
      - CV042

