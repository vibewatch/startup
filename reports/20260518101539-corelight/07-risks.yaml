  evidenceGaps:
    - id: EGR001
      type: private-evidence-only
      severity: blocking
      topic: "Zeek trademark license change-of-control survival"
      missingEvidence: "Full text of the ICSI-Corelight trademark license agreement, specifically change-of-control provisions, term, and exclusivity"
      whyItMatters: "If the Zeek trademark license does not survive a change of control, any acquirer must rebrand the entire product suite immediately post-closing, creating material transaction risk and destroying brand equity built around the Zeek name"
      diligencePath: "Obtain and review the ICSI-Corelight trademark license agreement; confirm CoC survival clause, perpetual term or term extension provisions, and absence of competing licensee rights"
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR001]
  
    - id: EGR002
      type: private-evidence-only
      severity: material
      topic: "CrowdStrike and Cisco strategic investor rights"
      missingEvidence: "Series E term sheet and investor rights agreement covering CrowdStrike Falcon Fund and Cisco Investments, specifically board observer rights, information rights, ROFR, co-sale, and M&A notification provisions"
      whyItMatters: "Information rights or board observer rights held by direct competitors (CrowdStrike, Cisco) in an M&A process create structural conflict risk; ROFR provisions could give competitors first-refusal on acquisition opportunities"
      diligencePath: "Request and review Series E term sheet, investor rights agreement, and any side letters for CrowdStrike Falcon Fund and Cisco Investments positions"
      relatedQuestionRefs: [QR008, QR009]
  
    - id: EGR003
      type: private-evidence-only
      severity: material
      topic: "Vern Paxson IP assignment from ICSI and LBL research"
      missingEvidence: "Executed IP assignment agreement transferring all Zeek-related inventions, patents, and know-how from Vern Paxson's ICSI and Lawrence Berkeley National Laboratory research period to Corelight"
      whyItMatters: "If Zeek's core inventions were not fully assigned to Corelight, foundational IP could remain with ICSI or LBL, creating IP ownership uncertainty that would affect acquisition valuation and post-closing technology rights"
      diligencePath: "Request IP assignment agreement(s) from Vern Paxson and confirm all Zeek-related IP is fully assigned; review any ICSI or LBL institutional IP policy that may have created residual rights"
      relatedQuestionRefs: [QR012]
  
    - id: EGR004
      type: private-evidence-only
      severity: material
      topic: "Zeek maintainer engineering attrition"
      missingEvidence: "Engineering retention metrics for core Zeek maintainers and security researchers, including attrition rate, average tenure, and equity refresh program details"
      whyItMatters: "Loss of Zeek maintainers would slow the sensor product roadmap, weaken Corelight's open-source community influence, and reduce its ability to attract top security engineering talent who joined to work on Zeek"
      diligencePath: "Request engineering attrition data, named Zeek maintainer roster, vesting schedules, and equity refresh program terms for key engineering personnel"
      relatedQuestionRefs: [QR014]
  
    - id: EGR005
      type: private-evidence-only
      severity: material
      topic: "cloud sensor API pricing margin impact"
      missingEvidence: "AWS VPC Traffic Mirroring, Azure vTAP, and GCP Packet Mirroring API pricing per GB and its impact on cloud sensor cost of goods and gross margin"
      whyItMatters: "Cloud sensor gross margin is directly affected by cloud provider API pricing for traffic mirroring; changes to pricing or metering could compress cloud sensor economics and affect Corelight's SaaS profitability model"
      diligencePath: "Request cloud COGS breakdown and cloud sensor gross margin by cloud provider; review cloud provider API pricing terms and any volume commitments"
      relatedQuestionRefs: [QR020]
  
