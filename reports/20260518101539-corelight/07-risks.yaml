  researchQuestions:
    - id: QR001
      question: "What is Corelight's current FedRAMP authorization status as of mid-2026?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        Corelight's cloud products are listed as FedRAMP authorization in progress as of mid-2026 per the
        FedRAMP Marketplace. Full ATO has not been achieved. No specific completion timeline or named 3PAO
        has been publicly disclosed. On-premises physical sensors are deployable in federal environments
        without FedRAMP; only cloud-hosted Investigator and NDR Platform are subject to the authorization gap.

    - id: QR002
      question: "What export control regulatory framework applies to Corelight's ML-enhanced NDR technology?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        The US Export Administration Regulations (EAR), administered by BIS/Commerce, apply to cybersecurity
        tools with ML analytics as dual-use technology potentially classified under ECCN 4E001 or 5E002.
        Corelight's specific ECCN classification is not publicly disclosed. International sales to certain
        jurisdictions require EAR compliance; international engineering personnel with access to ML code
        may trigger deemed-export analysis requirements.

    - id: QR003
      question: "Does Corelight's Zeek trademark license with ICSI survive a change of control in an M&A transaction?"
      type: verification
      targets: ["contentRequirements/1"]
      status: unresolved

    - id: QR004
      question: "What GDPR compliance mechanisms does Corelight provide for EU customers using cloud-hosted products?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        Corelight's architecture separates sensor data (on-premises or customer cloud) from the management
        plane (Corelight SaaS), allowing customers to keep raw network telemetry within their environment.
        This architectural design addresses EU data sovereignty requirements partially. Specific DPA templates,
        SCCs, and data residency options are not publicly documented; GDPR compliance terms are assumed to be
        in enterprise customer agreements but not confirmed from public sources.

    - id: QR005
      question: "Does EO 14028 SBOM compliance apply to Corelight's federal software sales, and is it confirmed?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        US Executive Order 14028 requires software vendors selling to federal agencies to provide SBOM and
        software attestation letters. As a vendor to federal agencies, Corelight is subject to this requirement.
        Corelight's specific SBOM publication status and attestation compliance are not publicly confirmed.
        NIST SP 800-218 (SSDF) provides the framework for compliance. This represents an open diligence gap.

    - id: QR006
      question: "What historical CVEs have been discovered in the Zeek open-source codebase?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >-
        NIST NVD search results for 'zeek' confirm the existence of historical CVEs against the Zeek
        open-source codebase. Specific CVE identifiers, severity ratings, and Corelight patch response
        timelines are not publicly documented in a consolidated advisory. Corelight ships Zeek as an
        embedded commercial component and controls its own patch release cadence separate from upstream
        open-source releases.

    - id: QR007
      question: "Has Corelight experienced any confirmed security breach or incident affecting customer network metadata?"
      type: adverse
      targets: ["contentRequirements/2"]
      status: answered
      answer: >-
        No confirmed public security incidents involving Corelight infrastructure, sensor firmware, or SaaS
        data have been identified in research conducted as of mid-2026. The absence of public disclosure does
        not confirm the absence of incidents for a private company. No bug bounty program or coordinated
        vulnerability disclosure policy is publicly documented on Corelight's website, representing a
        transparency gap relative to best practices for security infrastructure vendors.

    - id: QR008
      question: "What investor rights (board observer, information rights, ROFR) do CrowdStrike and Cisco hold in Corelight?"
      type: verification
      targets: ["contentRequirements/3"]
      status: unresolved

    - id: QR009
      question: "Do CrowdStrike and Cisco's strategic investment terms include M&A notification or exclusivity provisions?"
      type: verification
      targets: ["contentRequirements/3"]
      status: unresolved

    - id: QR010
      question: "What CMMC 2.0 requirements apply to Corelight and is the company on a confirmed certification path?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        CMMC 2.0 (final rule effective October 2024) applies to DoD contractors and their supply chain.
        As a vendor to DoD-affiliated customers, Corelight must demonstrate CMMC compliance appropriate
        to contract scope (Level 2 or Level 3). Corelight's SOC 2 Type II and ISO 27001 certifications
        provide partial overlap with CMMC practices. A formal CMMC certification or gap analysis has not
        been publicly confirmed. NIST SP 800-171 (rev 3, 2024) is the technical baseline for CMMC Level 2.

    - id: QR011
      question: "What board governance backstop exists for CEO key-person risk at Corelight?"
      type: verification
      targets: ["contentRequirements/4"]
      status: answered
      answer: >-
        Michele Bettencourt serves as Executive Chairman of the board, providing a governance backstop.
        Hatem Naguib (former CEO Barracuda Networks) joined the board in 2026, adding enterprise security
        CEO experience. No named COO or President has been publicly announced as a designated interim
        successor to Brian Dye. The board composition represents a partial mitigation but not a formal
        operational succession plan.

    - id: QR012
      question: "Has Vern Paxson executed a formal IP assignment transferring all Zeek inventions from ICSI/LBL to Corelight?"
      type: verification
      targets: ["contentRequirements/4"]
      status: unresolved

    - id: QR013
      question: "Is Corelight's CTO role publicly disclosed on the company's leadership page as of mid-2026?"
      type: verification
      targets: ["contentRequirements/4"]
      status: answered
      answer: >-
        Corelight's CTO role was not publicly named on the company's leadership page as of mid-2026 per
        review of the public leadership page. Vern Paxson's Chief Scientist role may fulfill some technical
        leadership functions. The absence of a named CTO in public disclosures represents a governance gap
        warranting confirmation in diligence whether the role is vacant, newly filled, or intentionally
        not disclosed.

    - id: QR014
      question: "What is Corelight's Zeek maintainer attrition rate and engineering team retention?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: unresolved

    - id: QR015
      question: "How does Corelight's SOC 2 Type II certification address sensor firmware update integrity?"
      type: mechanism
      targets: ["contentRequirements/2"]
      status: answered
      answer: >-
        SOC 2 Type II certification covers security, availability, processing integrity, confidentiality,
        and privacy controls over a defined audit period, which includes software delivery and change
        management processes. This provides partial assurance over the firmware update chain. However,
        no public firmware security audit, penetration test disclosure, or specific code-signing documentation
        has been confirmed beyond the SOC 2 certification. ISO 27001 provides additional ISMS assurance.
        Specific firmware tamper-detection controls are not publicly documented.

    - id: QR016
      question: "What is the typical FedRAMP authorization timeline for cloud security vendors of Corelight's scale?"
      type: comparison
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        FedRAMP authorization typically requires 12–24 months from initial assessment engagement, involving
        a Third Party Assessment Organization (3PAO) security assessment, agency sponsorship or FedRAMP
        Joint Authorization Board (JAB) review, and a Plan of Action and Milestones (POA&M) remediation
        cycle. For commercial cloud products, JAB authorization is more demanding; agency ATOs are more
        common for specialized security vendors. Corelight's specific 3PAO and current assessment phase
        are not publicly disclosed.

    - id: QR017
      question: "Has any well-funded NDR competitor launched a Zeek-based fork challenging Corelight's open-source position?"
      type: adverse
      targets: ["contentRequirements/3"]
      status: answered
      answer: >-
        No confirmed dominant Zeek fork by a well-funded competitor has been publicly announced as of
        mid-2026. Zeek's BSD license enables unrestricted forking but no competing enterprise-grade Zeek
        distribution has gained significant adoption. ExtraHop (acquired by Arista), Vectra AI, and
        Darktrace use proprietary protocol analysis engines rather than Zeek. The commoditization risk
        is latent and structural but has not materialized. Corelight's role as primary Zeek contributor
        maintains its privileged position in the ecosystem.

    - id: QR018
      question: "What thesis-break triggers and kill criteria should investors monitor for Corelight?"
      type: verification
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        Five primary kill/thesis-break triggers are identified: (1) material security breach of Corelight
        sensor or SaaS infrastructure; (2) loss of government contracts representing >15% of ARR;
        (3) a well-funded competitive Zeek fork achieving significant enterprise adoption; (4) CrowdStrike
        or Cisco simultaneously terminating integration partnerships; and (5) CEO Brian Dye departure
        without a named successor. These are tabulated with monitorable triggers in TR005.

    - id: QR019
      question: "How does GDPR apply to network telemetry containing IP addresses, and what obligation does it create?"
      type: mechanism
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        Under GDPR Article 4, IP addresses qualify as personal data when they can be used to identify a
        natural person. Zeek-generated network logs contain IP addresses, DNS query content, and HTTP headers,
        all of which may qualify as personal data. This requires: (a) a legal basis for processing (typically
        legitimate interests or contractual necessity); (b) data processing agreements with EU customers;
        (c) appropriate transfer mechanisms (SCCs, BCRs) for data processed outside the EU/EEA; and
        (d) data minimization and retention controls. These obligations apply to any Corelight cloud product
        processing EU customer network telemetry.

    - id: QR020
      question: "What is the impact of cloud provider API pricing on Corelight's cloud sensor gross margin?"
      type: quantification
      targets: ["contentRequirements/3"]
      status: unresolved

    - id: QR021
      question: "Does Corelight operate a public bug bounty or coordinated vulnerability disclosure program?"
      type: adverse
      targets: ["contentRequirements/2"]
      status: answered
      answer: >-
        No public bug bounty program or coordinated vulnerability disclosure (CVD) policy has been confirmed
        from Corelight's public website, blog, or third-party security databases as of mid-2026. This is
        a notable gap for a vendor whose sensors are deployed in the most sensitive network positions of
        enterprise and government customers. Comparable security infrastructure vendors (CrowdStrike,
        Palo Alto Networks, Cisco) operate public CVD programs or bug bounties.

    - id: QR022
      question: "What is the Suricata IDS license, and does it create GPL v2 copyleft obligations for Corelight?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        Suricata IDS is licensed under GNU GPL v2, a strong copyleft license requiring that software
        distributed with or linked against GPL v2 code must also be licensed under GPL v2 (or a compatible
        license) and its source must be made available. Corelight embeds Suricata within its sensor firmware.
        This creates a GPL boundary compliance obligation: proprietary Corelight code linked against Suricata
        must be architecturally separated, or Corelight risks a GPL violation claim from OISF. A formal
        SBOM and legal opinion on the GPL boundary is a critical compliance verification step.

    - id: QR023
      question: "What third-party security certifications validate Corelight's security posture for enterprise buyers?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >-
        Corelight holds SOC 2 Type II certification (AICPA Trust Services Criteria; security, availability,
        processing integrity, confidentiality, privacy) and ISO 27001 certification (international ISMS
        standard) as of mid-2026 per Corelight's trust/compliance page. These certifications satisfy the
        majority of enterprise security questionnaire requirements and provide third-party audit evidence
        of security management maturity. FedRAMP authorization is in progress; HIPAA-capability is claimed.
        No CMMC certification has been confirmed.

    - id: QR024
      question: "How does CISA's NDR guidance document align with Corelight's product positioning?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        CISA's Best Practices for Network Detection and Response (published March 2024) endorses NDR
        approaches centered on network telemetry collection, behavioral analytics, and integration with
        SIEM platforms — all core elements of Corelight's Open NDR Platform. The CISA guidance does not
        name specific vendor products but establishes a capability framework that Corelight's platform
        addresses. CISA's Zero Trust Maturity Model similarly emphasizes network visibility capabilities
        that NDR platforms deliver. This alignment supports Corelight's government positioning without
        providing a named-vendor endorsement.

    - id: QR025
      question: "How did the Cisco acquisition of Splunk affect Corelight's distribution channel economics?"
      type: freshness
      targets: ["contentRequirements/3"]
      status: answered
      answer: >-
        Cisco completed the acquisition of Splunk in March 2024, making Cisco simultaneously a strategic
        investor in Corelight and the owner of Splunk, Corelight's primary SIEM distribution channel.
        As of mid-2026, Corelight's Splunk marketplace application remains active and the integration
        appears unchanged from public evidence. No partnership terms changes have been publicly announced.
        The structural conflict — Cisco owns both an investor stake in Corelight and the primary distribution
        channel for Corelight's logs — creates a medium-term risk that warrants formal diligence review.

    - id: QR026
      question: "What share of Corelight's ARR is estimated to come from US government and IC customers?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answer: >-
        Government and IC customers are estimated at 30–40% of Corelight's ARR based on publicly available
        context including the company's sales focus, use-case marketing, and sector benchmarks for NDR
        vendors with federal programs. Specific government ARR figures and named contracts are not publicly
        disclosed. This concentration level creates a meaningful revenue cliff risk if government contracts
        are disrupted by FedRAMP delays, export control issues, or security incidents.

    - id: QR027
      question: "Are there documented adverse incidents involving Corelight's ICSI relationship or Zeek trademark disputes?"
      type: adverse
      targets: ["contentRequirements/3"]
      status: answered
      answer: >-
        No confirmed trademark disputes, governance conflicts, or legal actions between Corelight and ICSI
        have been identified in publicly available sources as of mid-2026. The Corelight website and Zeek
        project website both display the ICSI trademark license notice consistently, indicating the license
        is active and observed. SEC EDGAR search found no litigation filings. The relationship appears stable
        but the legal terms of the license have not been confirmed publicly.

    - id: QR028
      question: "What do Corelight's SOC 2 Type II and ISO 27001 certifications cover in terms of risk management?"
      type: mechanism
      targets: ["contentRequirements/5"]
      status: answered
      answer: >-
        SOC 2 Type II requires formal risk assessment procedures, change management controls, access
        controls, incident response, and business continuity as part of the Trust Services Criteria.
        ISO 27001 requires a formal Information Security Management System (ISMS) including risk assessment
        methodology, risk treatment plans, Statement of Applicability, and management review cycles.
        These certifications confirm that Corelight operates a governance-level risk management framework.
        The specific risk register, board-level audit committee oversight, and risk appetite framework are
        internal documents not publicly disclosed.

    - id: QR029
      question: "What 2026–2027 regulatory developments will increase compliance obligations for security vendors like Corelight?"
      type: freshness
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        Four regulatory developments will materially affect Corelight's compliance posture: (1) CISA CIRCIA
        (Cyber Incident Reporting for Critical Infrastructure Act) — final rules expected; mandatory
        incident reporting for critical infrastructure sectors where Corelight customers operate; (2) EU NIS2
        Directive (effective October 2024) — heightens cybersecurity obligations for EU-market security
        vendors and their supply chains; (3) SEC cyber incident disclosure rules (effective December 2023)
        apply post-IPO or to an acquiring public company; (4) NIST CSF 2.0 (published February 2024)
        updates the detect/respond framework Corelight's platform is positioned against.

    - id: QR030
      question: "Has Corelight been named in material litigation, enforcement, or contract disputes in public filings?"
      type: adverse
      targets: ["contentRequirements/1"]
      status: answered
      answer: >-
        No material litigation, regulatory enforcement actions, or contract disputes involving Corelight
        have been identified in publicly accessible court records or regulatory filings, including SEC
        EDGAR Form D filings reviewed during research. As a private company, Corelight's full litigation
        history is not publicly accessible. A formal legal background check and litigation history
        request from the company (representations and warranties) is a standard diligence requirement
        for any investment or acquisition transaction.

