company:
  name: "Corelight, Inc."
chapter:
  number: 1
  title: "Company Overview"
  summary: "Corelight, Inc. is a San Francisco–based, privately held network detection and response (NDR) company founded in 2013 by the creators of Zeek (formerly Bro), the widely used open-source network security monitor. The company commercializes open-source network security technology into an enterprise-grade Open NDR Platform, delivering evidence-based threat hunting, incident response, and network visibility to Fortune 500 enterprises, major government agencies, and large universities worldwide. Corelight has raised approximately $310–340 million across five rounds, most recently a $150 million Series E in April 2024 led by Accel with strategic participation from Cisco Investments and CrowdStrike Falcon Fund. Corelight was named a Leader in the 2025 Gartner Magic Quadrant for Network Detection and Response, recognizing the company's technology depth and market execution. As of mid-2026 the company employs approximately 464–473 people, reports over 40% year-over-year ARR growth, and operates under CEO Brian Dye, who joined in 2021 from McAfee."

sections:
  - id: identity-and-market-position
    title: "Company Identity and Market Position"
    body: "Corelight, Inc. is a privately held cybersecurity company headquartered in San Francisco, California, focused exclusively on network detection and response (NDR). The company was incorporated in 2013 by the creators of Zeek (formerly known as Bro), the widely-adopted open-source network security monitor developed at the International Computer Science Institute (ICSI) in Berkeley. Corelight's core mission is to transform raw network traffic into high-fidelity evidence that security operations center (SOC) analysts use to detect, investigate, and respond to advanced threats. The company markets its offering as an 'Open NDR Platform'—built on the open-source technologies Zeek, Suricata, and Sigma—providing what it describes as evidence-based network detection with over 70,000 out-of-the-box signatures and behavioral and AI-driven detections covering more than 80 MITRE ATT&CK tactics, techniques, and procedures (TTPs). Corelight serves a global customer base that includes Fortune 500 corporations, major federal and civilian government agencies, and large research universities. Its platform is available as physical hardware sensors, virtual sensors, and cloud-native deployments across AWS, GCP, and Azure. In the 2025 Gartner Magic Quadrant for Network Detection and Response, Corelight was named a Leader, a third-party validation of platform maturity, enterprise traction, and completeness of vision. Corelight is the custodian of the Zeek open-source project, providing financial backing, code contributions, and community stewardship that reinforce the company's open-core competitive positioning. The NDR market in which Corelight operates is estimated at approximately $3–4 billion in 2024 and is expected to grow significantly through the remainder of the decade, driven by the proliferation of hybrid and cloud-native infrastructure that creates new network blind spots and by increasing sophistication of adversarial tradecraft. As of the April 2024 Series E announcement, Corelight self-described as the 'industry's fastest-growing, scaled NDR platform' with over 40% year-over-year ARR growth and 300% year-over-year growth in its AI and SaaS-driven NDR solutions."
    claimRefs: [CO001, CO002, CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO037, CO038, CO039, CO040]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]

  - id: founders-leadership-governance
    title: "Founders, Leadership, and Governance"
    body: "Corelight was founded in 2013 by the core creators of Zeek: Vern Paxson (Chief Scientist), Robin Sommer, Seth Hall, and Gregory Bell (who serves as Chief Security Officer and co-founder). Vern Paxson is a distinguished computer scientist who led the Zeek research project for decades, originally at Lawrence Berkeley National Laboratory and later at the International Computer Science Institute. Paxson's academic pedigree—he holds a PhD from UC Berkeley and has published extensively on network security—gives Corelight rare founder-market fit in the open-source network security community. Robin Sommer and Seth Hall were core Zeek committers and architects before joining the commercial venture. In 2021, Corelight appointed Brian Dye as CEO. Dye came from McAfee (later acquired by Symphony Technology Group and rebranded as Trellix), where he served as Senior Vice President of Products. Under Dye's leadership, Corelight has significantly scaled commercial operations, expanded its cloud and AI product portfolio, and closed the $150 million Series E. The current C-suite includes Russ Keefe (CFO), Julie Parrish (CMO), and Bernard Brantley (CISO). Corelight's board includes Michele Bettencourt as Executive Chairman, providing strategic governance and operational oversight. In early 2026, Hatem Naguib—former CEO of Barracuda Networks and seasoned cybersecurity executive—was added to the board, bringing deep enterprise security leadership and go-to-market experience. Jack Huffard, co-founder and former President of Tenable Holdings, serves as an advisor, adding another prominent cybersecurity voice to the company's governance circle. The leadership page also lists Lynwen Connick, a senior executive with over 40 years of cybersecurity experience spanning the Australian Signals Directorate, Australia's Department of the Prime Minister and Cabinet, and ANZ Banking Group as Chief Information Security Officer. Key-person risk is elevated at two levels: Vern Paxson as the intellectual founder whose name is synonymous with Zeek and network security research, and Brian Dye as the commercial CEO who has defined the company's modern go-to-market strategy. Governance is entirely private with no public disclosure requirements."
    claimRefs: [CO003, CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024]
    tableRefs: [TO002]

  - id: funding-history-capital-structure
    title: "Funding History and Capital Structure"
    body: "Corelight has raised approximately $310–340 million in total venture capital across five disclosed rounds, making it one of the best-capitalized pure-play NDR companies in the market. The funding history reflects a strong investor conviction thesis anchored in Accel, which led both the inaugural Series A and the most recent Series E—an unusual endorsement of long-term platform value. The Series A closed in July 2017 at $9.2 million, led by Accel, providing the initial institutional runway to commercialize Zeek-derived technology at scale. General Catalyst led the Series B in September 2018 at $25 million, accelerating product development and early enterprise go-to-market. Insight Partners led the Series C in October 2019 at approximately $50 million (the company was formerly known as BroAla prior to renaming), providing the capital for significant team expansion and product maturation. The Series D in 2021 closed at an undisclosed amount, estimated in the market at approximately $75 million, providing capital to scale global operations and engineering amid strong enterprise demand. The marquee event was the April 30, 2024 Series E: $150 million led by Accel, with strategic co-investors Cisco Investments and the CrowdStrike Falcon Fund. This round is notable not merely for its size but for the strategic alignment it represents—Cisco and CrowdStrike are simultaneously strategic investors, technology partners, and potential competitors, creating a complex multi-dimensional relationship that diligence must assess carefully. Arun Mathew, partner at Accel, cited Corelight's 'unusually strong enterprise traction, battle-hardened open-source technology, and delighted customers' as the rationale for leading a fifth time. No current valuation has been publicly disclosed by Corelight. The company has no publicly traded securities and no confirmed SEC Form D filings accessible via EDGAR, consistent with its status as a private company structured outside standard retail security offering channels. Total capital raised is estimated at $310–340 million across all rounds."
    claimRefs: [CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035]
    tableRefs: [TO003, TO004]
    figureRefs: [FO001]

  - id: financial-scale-and-metrics
    title: "Financial Scale and Operational Metrics"
    body: "As a private company, Corelight does not publicly disclose revenue, ARR, gross margin, customer count, or profitability metrics. The most reliable publicly available financial indicators are self-reported metrics from the April 2024 Series E press release: over 40% year-over-year ARR growth and 300% year-over-year growth in AI and SaaS-driven NDR solutions. Both figures are company-claimed and unverified by independent auditors. The platform metrics disclosed by Corelight include more than 70,000 out-of-the-box detection signatures covering behavioral, AI, and ML detections; claims of 95% faster incident response compared to alternative approaches; and 4:1 tool consolidation ratios enabling customers to reduce their security toolstack. These metrics serve as proxy indicators for platform depth and adoption velocity, but cannot substitute for audited financial statements. Headcount, inferred from professional network data as of early-to-mid 2026, is approximately 464–473 employees. Corelight has offices or presence in San Francisco (global HQ), and operates across North America, EMEA, and APAC. The company's customer base—while not publicly enumerated with counts—is described as including Fortune 500 companies, major government agencies, and large universities. Corelight is the NDR platform of choice for elite cybersecurity services teams at CrowdStrike and Mandiant, and serves as the network monitoring platform for the Black Hat conference network operations center (NOC), which represents a credibility signal to the broader security community. The absence of disclosed revenue, ARR, customer count, net retention rate, gross margin, and burn rate is a significant limitation for quantitative diligence, requiring investors to rely on qualitative signals and the credibility of the investor syndicate as proxies for financial health."
    claimRefs: [CO010, CO036, CO037, CO038, CO039, CO040, CO007, CO011]

  - id: risks-and-adverse-considerations
    title: "Risks and Adverse Considerations"
    body: "Corelight faces several categories of material risk that diligence must assess carefully. First, financial opacity: as a private company with $310–340 million raised and an undisclosed current valuation, Corelight provides no independently verifiable financial data. The most recent verifiable financial metric—over 40% ARR growth—is a self-reported company claim from April 2024, and no current ARR, churn, gross margin, or burn rate figures are accessible. The $150 million Series E price was not accompanied by a disclosed post-money valuation, creating uncertainty about the current enterprise value, especially given shifts in SaaS multiples since 2021. Second, competitive pressure from platform vendors: the NDR market faces increasing competition from large security platform vendors—including Cisco (which simultaneously invested in Corelight), Microsoft Defender (with built-in network telemetry), and CrowdStrike Falcon (another simultaneous investor and partner)—who bundle network visibility into broader security suites. This creates a 'coopetition' dynamic where Corelight's largest strategic investors are also its most capable competitors. The strategic investments from Cisco and CrowdStrike mitigate some of this risk through partnership alignment but do not eliminate the structural competitive threat. Third, key-person risk: Vern Paxson's identity as the intellectual founder of the underlying Zeek technology creates a concentration risk in the company's open-source community credibility. Brian Dye's departure as CEO would require a commercially experienced replacement in a competitive talent market. Fourth, valuation uncertainty: no current valuation has been publicly disclosed, meaning investors are anchoring to the undisclosed Series E price or market-comparable estimates in the $1–1.5 billion range. Public cybersecurity company multiples have experienced significant compression since 2021, which may affect how private market peers are valued. Fifth, open-source dependency: Corelight's platform is built on Zeek, Suricata, and Sigma—all open-source projects. While Corelight's custodianship of Zeek reduces fork risk, reliance on community-maintained open-source infrastructure creates vendor dependency concerns for security-sensitive enterprise buyers."
    claimRefs: [CO031, CO041, CO042, CO043, CO044, CO024]

callouts:
  - calloutType: strength
    title: "Gartner Magic Quadrant Leader in NDR (2025)"
    body: "Corelight was named a Leader in the 2025 Gartner Magic Quadrant for Network Detection and Response, providing credible third-party validation of platform maturity, enterprise traction, and completeness of vision. Combined with the Forrester Wave Leader designation, Corelight holds the strongest analyst positioning of any pure-play Open NDR vendor."
    claimRefs: [CO005]

  - calloutType: strength
    title: "Accel Led Both Series A and Series E"
    body: "Accel led Corelight's inaugural Series A in 2017 and returned to lead the Series E in 2024, one of the strongest endorsements of long-term platform value available in venture-backed security. This continuity of lead-investor conviction from seed stage through growth stage is unusual and represents a meaningful diligence signal."
    claimRefs: [CO025, CO029, CO032]

  - calloutType: risk
    title: "Valuation Entirely Undisclosed—Private Company Opacity"
    body: "Corelight has not disclosed a post-money valuation for its Series E, and no current ARR, revenue, or profitability data is publicly available. Diligence must be conducted with essentially no quantitative anchoring on enterprise value, relying on implied market comparables and the credibility of the investor syndicate as proxies."
    claimRefs: [CO031, CO041]

  - calloutType: risk
    title: "Coopetition: Cisco and CrowdStrike Are Simultaneous Investors and Competitors"
    body: "The Series E coinvestors—Cisco Investments and the CrowdStrike Falcon Fund—are also two of Corelight's most significant potential competitors. Cisco's XDR platform and CrowdStrike Falcon increasingly incorporate network telemetry, threatening Corelight's standalone NDR value proposition. This coopetition dynamic requires careful contractual and strategic diligence."
    claimRefs: [CO033, CO034, CO042, CO043]

  - calloutType: insight
    title: "Open-Core Custodianship of Zeek Provides Defensible Moat"
    body: "Corelight serves as the primary financial backer and code contributor to the Zeek open-source project, giving it privileged access to the technology roadmap, community trust, and first-mover commercialization rights. This open-core custodian position is difficult for competitors to replicate and provides a structural barrier to entry in the enterprise NDR segment."
    claimRefs: [CO004, CO011, CO013]

