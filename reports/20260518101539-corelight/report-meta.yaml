    - name: Gregory Bell
      role: Co-founder and Chief Security Officer
      background: Core Zeek contributor; serves as CSO of Corelight.
      claimRefs: [CO001]
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California
  productSummary: Corelight's Open NDR Platform converts raw network traffic into high-fidelity security evidence using Zeek, Suricata, and Sigma open-source engines. It delivers over 70,000 detection signatures covering 80+ MITRE ATT&CK TTPs, available as physical sensors, virtual sensors, and cloud-native deployments on AWS, GCP, and Azure.
  customerFocus: Fortune 500 enterprises, major federal and civilian government agencies, large universities, and elite cybersecurity service teams including CrowdStrike and Mandiant.
  businessModel: Hardware sensor sales, SaaS subscription, and managed NDR offerings; hybrid hardware/software model transitioning toward cloud-native and AI-driven SaaS.
  stage: late-stage private
  fundingStatus: Series E closed April 2024 at $150M; total estimated capital raised $310–340M; post-money valuation not publicly disclosed; TPVG venture debt confirmed per TPVG 10-K (FY2025).
