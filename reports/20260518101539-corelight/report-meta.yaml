companyProfile:
  summary: Corelight is a privately held NDR company that commercializes the Zeek open-source network security monitor into an enterprise-grade Open NDR Platform. It has raised $310–340M across five rounds through April 2024, most recently a $150M Series E led by Accel with strategic co-investors Cisco Investments and CrowdStrike Falcon Fund. Corelight was named a Gartner Magic Quadrant Leader for NDR in 2024 and 2025. Financial metrics are not publicly disclosed; the post-money Series E valuation was not announced.
  foundedDate: '2013-01-01'
  founders:
    - name: Vern Paxson
      role: Co-founder and Chief Scientist
      background: Distinguished computer scientist and creator of the Zeek open-source network security monitor; PhD from UC Berkeley; decades of network security research at Lawrence Berkeley National Laboratory and ICSI.
      claimRefs: [CO001]
    - name: Robin Sommer
      role: Co-founder
      background: Core Zeek architect and committer; joined the commercial venture from the open-source project.
      claimRefs: [CO001]
    - name: Seth Hall
