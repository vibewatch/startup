      - number: '7.3'
        title: 合作伙伴与依赖风险：Zeek 开源、ICSI 许可、CrowdStrike 和 Cisco 冲突
        blocks:
          - type: paragraph
            body: >-
              Corelight 最根本的依赖风险，是其结构性押注 Zeek 开源项目。Zeek 不只是上游依赖——它是 Corelight 整个产品组合的技术底座。Corelight 雇用了 Zeek 核心维护者，也是
              Zeek 项目的主要资金贡献者，但它不拥有 Zeek 商标（由 ICSI 持有），也不拥有代码库独占权（BSD 许可证允许 fork）。如果资金充足的竞争者——例如超大规模云厂商或 PE
              支持的安全整合商——资助一个竞争性 Zeek 发行版，Corelight 当前利用的开源护城河可能变成竞争负担。一个获得企业采用的 Zeek fork 会把核心协议分析引擎商品化，并拿掉 Corelight
              最重要的进入壁垒之一。ICSI 商标许可形成了另一类法律依赖：Corelight 在产品营销中使用 Zeek 品牌的权利，取决于与 International Computer Science Institute
              这一拥有自身治理流程的学术机构签署的许可协议。如果 ICSI 面临资金压力、领导层更替，或有竞争性商业实体提出独家安排，Corelight 可能在不合时宜的时点被迫重新谈判商标。CrowdStrike
              的战略投资和集成伙伴关系带来双重角色冲突。CrowdStrike 既是投资人（通过 CrowdStrike Falcon Fund 参与 2024 年 Series E），又在部分 XDR 和网络可见性场景中与
              Corelight 直接竞争；这些场景里，CrowdStrike Falcon 的 Adversary Intelligence 模块或网络控制与 Corelight
              传感器能力重叠。在并购场景下，CrowdStrike 对 Corelight 战略计划和客户基础拥有董事会层面的可见性，带来信息不对称风险。CrowdStrike 集成依赖还意味着，一旦 CrowdStrike
              改变伙伴 API 条款或弃用该集成，Corelight 将失去一条重要联合销售渠道和一个标杆客户叙事。Cisco Investments 作为战略投资人参与 Series E，也带来类似冲突：Cisco 同时是
              Corelight 投资人，并通过自有 XDR 平台、网络安全产品（Cisco Secure Network Analytics/Stealthwatch）以及 Cisco 安全组合里的 NDR
              邻近能力直接竞争。2024 年宣布的 Cisco XDR 集成把 Corelight 定位为 Cisco 平台的遥测源，在战略上从属于 Cisco 技术栈。Splunk 与 Elasticsearch 通过
              Corelight for Splunk app 和 Elasticsearch 导出支持承担主要分发渠道；Cisco 2024 年收购 Splunk 后，如果 Splunk 伙伴计划发生变化，可能影响
              Corelight 的集成经济性和商业化定位。Mandiant/Google 在事件响应工作流中的角色，则使 Corelight 依赖 Google 持续优先把 Corelight 作为事件响应项目的 NDR
              合作伙伴。
