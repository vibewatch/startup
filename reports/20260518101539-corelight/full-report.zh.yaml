      - number: '7.2'
        title: 运营与安全风险：自有平台被攻破、云集中度和固件漏洞
        blocks:
          - type: paragraph
            body: >-
              Corelight 最具后果的运营风险，是其自有传感器平台或 SaaS 基础设施遭到安全入侵。NDR 供应商如果自身被攻破——可类比 2020 年 SolarWinds SUNBURST 供应链攻击或 2021
              年 Kaseya VSA 勒索软件事件——将遭遇灾难性声誉打击，因为该产品的价值主张正是发现客户网络中的攻击者活动。Corelight
              传感器位于企业网络架构中最敏感的观察点：它们能看到全部流量，并产出完整的网络证据。如果攻击者攻破 Corelight
              传感器固件更新机制，就能对所有部署受损传感器的企业网络获得被动监视权限。这一威胁模型让固件更新链完整性、代码签名做法和篡改检测成为关键安全控制。Corelight 拥有 SOC 2 Type II 和 ISO
              27001 认证，证明其具备正式安全管理实践；但截至 2026 年中，公开来源尚未确认其有公开漏洞赏金项目或协调漏洞披露（CVD）政策。未发布 CVD 政策是一个尽调缺口。NVD
              对“zeek”的搜索结果显示，开源 Zeek 代码库历史上出现过 CVE，Corelight 必须按自己的更新时间线打补丁并分发，这可能在公开披露与客户补丁部署之间形成滞后。SaaS
              基础设施层的数据泄露风险是第二个重要运营暴露。Corelight Investigator 和 NDR Platform 是云托管 SaaS 产品；多租户 SaaS
              环境被攻破，可能同时暴露多个企业客户的网络元数据。即使原始 PCAP 数据保存在本地，云端管理平面里的元数据和告警记录也可能揭示政府机构等高价值目标的敏感运营模式。云供应商集中度风险来自 Corelight
              架构对 AWS VPC Traffic Mirroring、Azure vTAP 和 GCP Packet Mirroring API 的依赖。如果任何云供应商改变流量镜像
              API、引入新定价或限制访问——这在其他云周边安全产品中已经发生过——Corelight
              在该云上的云传感器价值主张会受损，直到平台完成重构。单一云供应商宕机会降低该云中客户的传感器可见性。传感器固件漏洞构成硬件攻击面，且尤其难以大规模修复：拥有数千个已部署传感器的企业客户需要协调固件更新活动；传感器处理代码中的零日漏洞，可能在分阶段推送期间让庞大装机基础暴露数周。托管
              NDR Platform 的运营故障——包括误报漏报率（漏掉威胁）、过高误报告警量或平台宕机——会直接削弱服务承诺并触发 SLA 罚款。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
