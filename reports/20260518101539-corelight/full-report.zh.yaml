            body: >-
              Sensor v29 发布强调 ML 检测包改进，说明 Corelight 竞争的不只是协议覆盖，还包括检测质量。随着 Vectra AI、Darktrace 等竞争对手推进无监督学习能力，Corelight
              必须在路线图上投入 ML 检测保真度，才能在 Zeek 协议解析护城河之外继续保持差异化。
