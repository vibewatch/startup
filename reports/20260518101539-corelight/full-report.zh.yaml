      - number: '1.4'
        title: 财务规模与运营指标
        blocks:
          - type: paragraph
            body: >-
              作为私营公司，Corelight 不公开披露收入、ARR、毛利率、客户数或盈利指标。最可靠的公开财务信号来自 2024 年 4 月 Series E 新闻稿中的自报指标：ARR 同比增长超过 40%，AI 和
              SaaS 驱动的 NDR 解决方案同比增长 300%。两项数字均为公司自称，未经独立审计验证。Corelight 披露的平台指标包括超过 70,000 条开箱即用检测签名，覆盖行为、AI 和 ML
              检测；相较替代方案，事件响应速度快 95% 的说法；以及 4:1 的工具整合比，帮助客户减少安全工具栈。这些指标可作为平台深度和采用速度的代理信号，但不能替代经审计的财务报表。根据截至 2026
              年初至年中的职业网络数据推断，员工数约 464–473 人。Corelight 在旧金山设全球总部，并在北美、EMEA 和 APAC 运营。客户基数虽未公开列明数量，但公司描述其客户包括 Fortune 500
              公司、主要政府机构和大型大学。Corelight 是 CrowdStrike 和 Mandiant 等顶级网络安全服务团队首选的 NDR 平台，也为 Black Hat
              大会网络运营中心（NOC）提供网络监控平台，这对更广泛安全社区构成信誉信号。收入、ARR、客户数、净留存率、毛利率和烧钱速度均未披露，显著限制了量化尽调；投资人只能把定性信号和投资人财团信誉作为财务健康状况的代理。
