  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              网络检测与响应（NDR）这一安全市场类别，覆盖在规模化网络流量上捕获、分析并告警的软件和设备产品，用于发现、调查和响应绕过边界和端点控制的网络威胁。NDR
              平台摄取原始网络包或流记录，叠加行为基线、机器学习模型、威胁情报和基于签名的规则，识别东西向横向移动、命令与控制（C2）通信、数据外泄路径上的异常或恶意活动；这些活动对端点代理和防火墙往往不可见。Gartner
              在首份 Network Detection and Response Magic Quadrant 中正式定义 NDR 类别，把它与早先使用的更宽泛 Network Traffic
              Analysis（NTA）标签分开。Forrester 覆盖一个重叠但稍宽的类别，称为 Network Analysis and Visibility（NAV），把
              NDR、包捕获和网络性能监控工具都纳入其中；Corelight 既竞争 NDR 核心市场，也竞争 NAV 的重叠部分。NDR
              类别包括带传感器（物理、虚拟和云原生）、检测引擎、调查工作台的企业级检测平台，但明确排除纯 SIEM/SOAR
              平台、边界防火墙、缺少行为分析的入侵防御系统（IPS），以及没有网络遥测的端点检测与响应（EDR）代理。在更广义网络安全预算中，NDR 占比不高但增长很快：按 IDC 估计，NDR 大约占
              $25-billion-plus 总网络安全市场的 3–4%，但随着 CISO 注意力从边界加固转向检测与响应，它拿走了企业安全预算增量中不成比例的一部分。相邻和重叠类别包括 Extended Detection
              and Response（XDR），它把端点、身份、云和网络遥测聚合在单一供应商伞下；以及 Cloud-Native Application Protection
              Platforms（CNAPP），其云工作负载可见性与 NDR 的东西向流量分析功能部分重叠。Corelight 的开放 NDR
              平台明确声称，开源基础（Zeek、Suricata、Sigma）和供应商中立集成让它区别于封闭专有的 NDR 平台，并能部署在物理、虚拟和多云传感器环境中，这是封闭平台难以复制的。
