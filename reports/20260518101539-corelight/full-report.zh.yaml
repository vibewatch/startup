      - number: '7.6'
        title: 证据展项
        blocks:
          - type: callout
            title: FedRAMP 延迟是最大近期收入风险
            body: >-
              政府客户估计贡献 ARR 的 30–40%，且截至 2026 年中 FedRAMP 授权仍未完成；如果 Corelight 不能按计划完成
              FedRAMP，这就是概率最高的近期收入风险。每拖延一个季度，联邦民用机构的云采购都会被关在门外，Corelight 只能继续依赖本地传感器销售，而这类销售的
              平均销售价格（ASP）更低、部署周期更长。尽调应明确具体 FedRAMP 时间表、已聘用的 3PAO（Third Party Assessment
              Organization，第三方评估机构），以及当前使用哪些过渡采购工具（ATO、P-ATO、机构专项豁免）。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR040
          - type: callout
            title: Cisco 与 CrowdStrike 的投资人兼竞争者冲突需要法律审查
            body: >-
              Cisco Investments 和 CrowdStrike Falcon Fund 都持有 Corelight 战略投资人头寸，而母公司又在邻近分部竞争。Corelight 若进入潜在 M&A
              场景，这些战略投资人持有的信息权和董事会观察员权可能让直接竞争者看见 M&A 过程。法律审查 Series E 条款清单——尤其是任何信息权、优先购买权（ROFR）条款或共同出售拖售义务——是关键尽调优先事项。
            calloutType: risk
            claimRefs:
              - CR020
              - CR021
              - CR022
          - type: callout
            title: Zeek 商标依赖 ICSI，属于低概率但高严重性法律暴露
            body: >-
              Corelight 公开网站和所有营销材料都载有 ICSI 对 Zeek 名称的商标许可声明。Zeek 商标不归 Corelight 所有，而是通过许可使用。尽调必须确认：（a）许可协议为永久，或期限覆盖任何预期
              M&A 或 IPO 窗口；（b）许可在控制权变更后仍有效；（c）ICSI 没有可能造成品牌冲突的竞争许可安排。如果许可不能在交易后延续，收购完成后将需要立即重塑品牌。
            calloutType: risk
            claimRefs:
              - CR006
              - CR019
          - type: callout
            title: SOC 2 Type II 与 ISO 27001 提供扎实企业信任基线
            body: >-
              尽管 FedRAMP 缺口未解，Corelight 的 SOC 2 Type II 和 ISO 27001
              认证提供了可验证的第三方安全管理实践证明，能满足非联邦和国际买方的企业采购要求。这些认证降低了企业销售周期被安全问卷卡住的风险，也显示出与公司成长阶段相匹配的治理成熟度。
            calloutType: strength
            claimRefs:
              - CR011
