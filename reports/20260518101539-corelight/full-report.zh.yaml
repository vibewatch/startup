      - number: '5.2'
        title: 核心技术架构：Zeek 引擎、协议解析与开放数据模型
        blocks:
          - type: paragraph
            body: >-
              Corelight 的技术架构以 Zeek（前称 Bro）为中心。Zeek 是开源网络安全监控器，最初由联合创始人 Vern Paxson 在 Lawrence Berkeley National
              Laboratory 开发。Zeek 作为有状态网络分析框架，截获原始数据包流，并用脚本语言驱动的分析流水线产出结构化应用层日志记录。Corelight 随 Zeek 提供 400 多个协议解析器，覆盖
              HTTP/HTTPS、DNS、SSL/TLS、SMTP、FTP、SSH、Kerberos、LDAP、SMB/DCE-RPC、RDP 以及数十种专门协议，每个解析器都会产出带类型的 JSON
              日志记录。这种协议覆盖广度让分析师无需默认抓取原始数据包，就能重建任何已观测网络会话中的精确交易序列，相比完整 PCAP 路径显著降低存储需求。Corelight 用 Suricata IDS 补充 Zeek
              的脚本化分析；Suricata 是开源入侵检测引擎，与 Zeek
              并行运行，在同一流量上应用数万条社区签名和自定义检测规则。组合后，分析师在一条集成流水线中同时获得行为型（Zeek）和签名型（Suricata）检测。机器学习模型提供第三层分析，用来识别确定性 Zeek
              脚本和静态 Suricata 签名都不会标记的异常通信模式。核心数据输出是 Zeek 日志集：按协议和会话类型组织的结构化 JSON 文件，可通过 Apache Kafka 直接导出到
              Splunk、Elasticsearch、Microsoft Sentinel、Google Chronicle、IBM QRadar 或任何数据湖。开放数据模型是一个有意设计原则，意味着客户不会被
              Corelight 的专有分析锁住；同一份日志数据可以在客户偏好的工具中查询，不像封闭 NDR 平台必须使用专有仪表盘。Corelight 对 Zeek
              开源项目的托管是一个重要架构组件：公司是主要资金支持方和代码贡献方，因此在 Zeek 路线图中拥有特权位置，并确保商业功能优先级回流到开源基础中。Zeek Community ID
              标准（github.com/corelight/zeek-community-id）为跨异构工具的网络流关联提供确定性哈希，是 Corelight 发起的开源贡献，如今已被多款安全产品采用。
