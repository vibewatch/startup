      - number: '5.5'
        title: 信任、合规与安全姿态
        blocks:
          - type: paragraph
            body: >-
              Corelight 已投入建设适合其目标市场的企业信任认证，目标客户包括 Fortune 500 企业和联邦政府机构。公司持有 SOC 2 Type II
              认证，确认独立审计师在一个定义周期内审查了其安全性、可用性、处理完整性、保密性和隐私控制，并认定这些控制符合 AICPA Trust Services Criteria。ISO 27001
              认证证明其信息安全管理体系（ISMS）有正式结构，并符合国际标准；这正日益成为欧洲和跨国企业采购的常见要求。HIPAA-capable 状态意味着 Corelight 的部署架构可配置为处理医疗环境中邻近 PHI
              的网络遥测，不过 HIPAA 不像 SOC 2 或 ISO 27001 那样是可审计认证。截至 2026 年初，FedRAMP 授权仍在推进中；对要求使用 FedRAMP
              授权云服务的联邦政府客户来说，当前状态构成采购障碍，在授权完成前会限制民事机构细分市场的可服务范围。Corelight 的架构把传感器数据处理（本地或客户云环境中）与管理平面（Corelight SaaS
              服务）分开，让客户可以选择把所有原始网络遥测保留在自有环境内；对政府机构和受监管企业等重视数据主权的买家，这是重要卖点。开源核心模式引入了依赖风险：如果 Zeek 或 Suricata
              开源基础中发现重大安全漏洞，Corelight 负责修补并分发更新后的传感器软件，这会在公开漏洞披露和企业补丁部署之间造成潜在滞后。截至 2026 年 5
              月，公开来源未确认有公开漏洞赏金计划或协调漏洞披露政策；对安全意识强的企业买家而言，这是尽调缺口。公司的物理传感器设备经过硬件验证，软件分发链通过 Corelight 的商业更新机制管理，与上游 Zeek
              开源发布节奏分离。
