      - number: '6.4'
        title: 留存、NRR 与客户健康指标
        blocks:
          - type: paragraph
            body: >-
              Corelight 不公开披露净留存率（NRR）、总留存率（GRR）、客户流失率或队列数据。115–130% 的 NRR 估计来自三类代理信号。第一，产品结构：分层部署模式（物理传感器 → 虚拟传感器 →
              云传感器 → Investigator SaaS）在每个账户内创造三条天然增购路径，结构上无需任何竞争性替换也能让 NRR 高于 100%。现有传感器客户为 AWS/Azure/GCP 部署增加云覆盖，再增加
              Investigator SaaS 分析层时，ACV 可在初始合同基础上扩大 2–3x，而无需更换供应商。第二，客户满意度信号：PeerSpot
              评论者一贯把支持评价为“响应快、乐于协助、知识扎实”，并能接触客户成功经理和技术客户经理。顾问委员会参与进一步加深客户与 Corelight 产品路线图的互动。高质量售后支持和顾问访问权，与 NRR 达到
              110–130% 的企业 SaaS 公司相符。第三，机构投资人代理：Accel 既领投 2017 年 Series A，又领投 2024 年 Series E，代表持续七年的机构背书；如果 NRR
              或客户留存出现实质恶化，这种背书难以持续。Gartner MQ 在 2024 和 2025 年均把它列为
              Leader，而这需要多客户参考访谈项目，提供了持续客户满意度的直接第三方确认。留存上的主要反向信号是价格：PeerSpot 和 G2 评论者指出，对缺少深度 Zeek 专长的买方来说，Corelight
              “偏贵”，且 ML 功能集会增加成本——这会在价格敏感的中端市场细分中造成流失风险。FedRAMP 仍在推进的状态限制了部分政府部署，可能推迟合同扩张，直到 FedRAMP 授权完成。
