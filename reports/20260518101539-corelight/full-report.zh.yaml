            title: Cisco 与 CrowdStrike 的竞合：战略协同与结构性张力
            body: >-
              Cisco Investments 和 CrowdStrike Falcon Fund 均参与了 Corelight 2024 年 4 月的 Series E，形成了独特的竞合关系。Cisco 通过 Secure
              Network Analytics 是直接相邻竞争对手，同时又是关注网络安全基础设施的战略投资方。CrowdStrike 是 Corelight 最突出的渠道和集成伙伴、战略投资方，也可能在 Falcon
              平台上自建原生 NDR 能力。这种投资方兼竞争方的双重关系，通过联合销售安排带来商业协同，但结构性竞争张力仍在。尽调应评估这些关系在 Series E 之后如何演变，以及是否存在合同化的联合销售承诺。
