      - number: '5.6'
        title: 产品路线图与近期发布：Sensor v29、GCP GA 与 AI 调查功能
        blocks:
          - type: paragraph
            body: >-
              Corelight 近期产品发布节奏反映了三条战略推进线：机器学习增强、云覆盖扩张，以及 AI 驱动的调查效率提升。2024–2025 年时间段发布的 Sensor v29
              是最重要的硬件传感器里程碑，引入了增强型 ML 检测包、新的协议覆盖扩展，以及针对加密流量分析场景的检测保真度提升。Corelight 发布专门博客，把 v29 的 ML
              改进描述为迈向“现代化威胁检测”的一步，通过降低误报、改善信噪比，帮助面对告警疲劳的 SOC 分析师。GCP 版 Cloud Sensor 达到 GA，完成 Corelight 覆盖 AWS、Azure、GCP
              三大公有云传感器，让拥有 Google Cloud 工作负载的客户能把本地运行的同一套基于 Zeek 的网络遥测应用到 GCP 环境。Corelight Investigator SaaS 产品逐步引入 AI
              驱动调查功能，包括 AI 分诊能力，对网络证据评分并排序，把最值得调查的会话推给分析师。Microsoft Sentinel 集成和更新版 Cisco XDR 集成在 2024 年宣布，扩大 Corelight
              网络证据进入云原生 SIEM 和 XDR 工作流的范围。向前看，Corelight 路线图强调 AI 辅助调查和扩展云传感器覆盖，符合更广泛 NDR 市场转向 SaaS 交付和 AI 增强 SOC
              运营的轨迹。路线图验证上的尽调缺口包括：除博客摘要外没有公开变更日志或传感器软件版本详细发布说明，FedRAMP 授权完成时间未确认，OT/ICS 协议路线图项目文档有限，AI
              分诊功能没有公开产品演示或基准数据。对私营成长阶段厂商来说，这些缺口很常见，但它们是投资人评估长期产品防御性时的具体尽调事项。
