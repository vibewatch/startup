      - number: '2.3'
        title: 买方、付款方与细分市场分析
        blocks:
          - type: paragraph
            body: >-
              NDR 市场的买方集中在安全成熟度高的大型组织，这些组织有专门安全运营中心（SOC）团队，也有预算购买网络层可见性工具。主要企业细分由 Fortune 500 和 Global 2000
              公司构成；经济买方是首席信息安全官（CISO）或安全副总裁，技术评估方是 SOC 总监或首席分析师，最终付款方是批准年度信息安全预算的 CFO 或首席风险官。Corelight 企业细分的典型交易规模为年合同价值
              $200,000–$1 million 或更高，反映多站点部署的复杂度，包括物理传感器、虚拟传感器和云原生集成。美国联邦政府是 Corelight 结构性重要的买方细分，驱动力来自 Executive Order
              14028（Improving the Nation's Cybersecurity，2021 年 5 月）和 CISA Zero Trust Maturity
              Model；后者明确把网络流量分析和可见性列为零信任核心支柱。联邦机构 CISO 面临强制零信任落地时间表，网络可见性又是打分要求，因此该细分形成近似确定的需求。Corelight
              服务主要民用和国防机构，并拥有相关 FedRAMP 或同等授权路径。受监管行业构成第三个核心细分：受 PCI-DSS 和 SOX 合规要求约束的金融服务公司需要网络取证数据；面对 HIPAA
              审计和泄露通知义务的医疗机构，需要网络遥测来调查泄露；受 NERC CIP 和 ICS/SCADA
              安全要求驱动的关键基础设施运营商（能源、公用事业、制造业），需要看见运营技术（OT）网络中的东西向流量。OT/IT 融合场景对 Corelight 尤其有价值，因为 Zeek 原生支持工业控制协议解码器（如
              Modbus、DNP3、ENIP），这是许多竞争者不具备的差异化能力。托管安全服务提供商（MSSP）和托管检测与响应（MDR）提供商构成间接渠道：CrowdStrike（Corelight 战略投资人兼 MDR
              合作伙伴）和 Mandiant 等组织把 Corelight 用作其托管服务的底层 NDR 证据层，把覆盖面扩展到直销之外。Verizon DBIR 2024 和 IBM X-Force Threat
              Intelligence Report 2025 都记录，网络级证据（流量日志、流记录、Zeek 日志）是企业泄露调查中最常被请求的材料，进一步支撑 NDR 工具这一支出类别的耐久性。
