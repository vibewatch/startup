  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础概览：垂直行业、买方与规模
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Corelight 的企业客户基础覆盖五个主要垂直细分。按估计收入占比最大的是美国政府与国防：基于 Gartner Peer Insights 和 PeerSpot
              上政府评论者的相对密度、正在推进的 FedRAMP 授权（确认积极参与政府采购），以及 Gartner 评论中记录的 Cybersentry 项目部署，联邦机构、国防部组成部分和情报界组织估计贡献 30–40%
              的 ARR。该细分中的政府买方是安全运营负责人、R&D 总监和 CISO 层级利益相关方，拥有大型网络监控预算和较长采购周期。第二个细分是 Fortune 500
              科技、金融服务和国防承包商：大型私营企业运营重要网络基础设施，需要面向 SOC 运营和事件响应的实时威胁检测。来自制造业和金融服务从业者的 PeerSpot 与 Gartner Peer Insights
              评论确认了这个细分，尽管公开材料未点名 Fortune 500 客户。第三个细分是大学和国家研究实验室——这是 Zeek 最初的历史部署基础，Lawrence Berkeley National
              Laboratory（Zeek 发明地）是典型早期采用者。Zeek 开源社区提供天然商业转化管道：已运行开源 Zeek 的组织可以升级到 Corelight，以获得企业支持、硬件传感器和 Investigator
              SaaS 分析层。托管安全服务提供商（MSSP）构成第四个细分，它们在多客户安全运营中心内把 Corelight 作为网络检测骨干。第五个细分是医疗系统，用 Corelight 做临床网络可见性、医疗 IoT
              设备监控和勒索软件检测。各细分的买方都是企业 CISO 和 SOC 总监；用户是威胁猎手和事件响应人员；付款方是高管层或其下的信息安全预算。
