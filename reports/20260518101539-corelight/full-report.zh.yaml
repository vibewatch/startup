  - id: FE001
    title: Corelight Open NDR 平台架构图
    type: stack
    layout: wide
    summary: >-
      五层架构栈展示 Corelight Open NDR Platform：底部是网络采集层，向上依次是协议分析、ML 与签名检测、调查、集成。最上层的开放 JSON 导出，是 Corelight「Open
      NDR」品牌在技术上的实现机制——日志向上流动，并输出到任意 SIEM 或数据湖。
    data:
      layers:
        - label: 第 1 层：采集与抓包
          detail: >-
            物理传感器（1G/10G/100G）、Virtual Sensors（ESXi/KVM）和 Cloud Sensors（AWS VPC Traffic Mirroring、Azure vTAP、GCP Packet
            Mirroring）接入网络流量。Smart PCAP 在触发检测事件时提供选择性全包记录。
          tone: neutral
        - label: 第 2 层：协议分析与 Zeek 日志生成（400+ 解析器）
          detail: >-
            Zeek（开源、由 Corelight 托管）用 400+ 个协议解析器，为每个观察到的会话生成结构化 JSON
            日志——HTTP、DNS、SSL/TLS、SMB、Kerberos、SSH、SMTP、FTP，以及数十种专用协议。输出包括连接元数据、应用层记录和文件传输清单。
          tone: positive
        - label: 第 3 层：多引擎检测（Suricata + ML + Zeek Analytics）
          detail: >-
            三个并行检测引擎处理同一股流量：Suricata IDS 应用数万条基于签名的规则；Zeek 脚本编码行为检测逻辑；自研 ML 模型给异常模式打分，包括 DGA、C2
            beaconing、横向移动和协议偏差。Encrypted Traffic Analysis（ETA/JA3）在这一层运行。
          tone: positive
        - label: 第 4 层：调查与响应（Corelight Investigator SaaS）
          detail: >-
            云交付的 Corelight Investigator 提供专为威胁调查设计的 UI，支持 AI 辅助分诊、会话时间线重建、按 IP/用户/文件 SHA256 透视，以及接入 CrowdStrike Falcon
            获取端点上下文。NDR Platform 将这一层作为全托管服务交付。
          tone: positive
        - label: 第 5 层：开放集成与导出（SIEM、数据湖、SOAR）
          detail: >-
            所有 Zeek 日志都以开放 JSON 形式导出到 Splunk、Microsoft Sentinel、Google Chronicle、IBM QRadar、Elasticsearch 和 Apache
            Kafka。开放数据模型是架构承诺的核心——客户不会被锁进 Corelight 的自研分析工具。
          tone: positive
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE010
      - CE011
      - CE032
      - CE040
  - id: FE002
    title: 使用 Corelight 的 SOC 与事件响应工作流
    type: flow
    layout: wide
    summary: >-
      七节点流程图追踪从网络抓包到 Zeek 日志生成、SIEM 摄取、检测、分析师分诊、IR 调查和补救的路径。图中展示 Corelight 位于「证据生成」环节，提供结构化遥测供下游 SOC
      工具消费，而不是要求分析师操作一套只服务 Corelight 的独立控制台。
    data:
      nodes:
        - id: network-tap
          label: 网络流量（TAP / 镜像）
          detail: 来自物理 TAP、SPAN 端口或云服务商镜像 API（AWS/Azure/GCP）的原始包流，持续输入 Corelight 传感器。
          tone: neutral
        - id: sensor-processing
          label: Corelight 传感器处理
          detail: Zeek 引擎解析 400+ 种协议；Suricata 应用 IDS 签名；ML 模型给行为异常打分；Smart PCAP 可在触发事件时记录完整数据包。
          tone: positive
        - id: log-generation
          label: 结构化 Zeek 日志生成（JSON）
          detail: 会话日志、DNS 记录、HTTP 事务、SSL/TLS 元数据、文件传输和检测通知，以结构化 JSON 输出——这是核心「网络证据」产品。
          tone: positive
        - id: siem-ingestion
          label: SIEM / 数据湖摄取
          detail: >-
            Zeek 日志通过 Apache Kafka 转发到 Splunk、Microsoft Sentinel、Elasticsearch、Google Chronicle、IBM QRadar 或数据湖；分析不需要
            Corelight 私有控制台。
          tone: positive
        - id: detection-alerting
          label: 威胁检测与 AI 分诊
          detail: SIEM 关联规则、Corelight 检测包和 AI 分诊功能对告警打分并排序；Investigator SaaS 把最高保真的网络证据呈现给分析师。
          tone: positive
        - id: ir-investigation
          label: IR 调查与时间线重建
          detail: SOC 分析师用 Corelight Investigator 或基于 Zeek 日志数据的 SIEM 查询，从告警透视到完整会话上下文、DNS 历史、文件哈希和横向移动路径。
          tone: positive
        - id: remediation
          label: 补救与响应动作
          detail: 分析师借助 CrowdStrike Falcon API 增强信息或 SOAR 剧本触发端点隔离；网络阻断指令发送到防火墙；Smart PCAP 证据保留下来用于取证记录。
          tone: positive
      edges:
        - from: network-tap
          to: sensor-processing
          label: 数据包流
        - from: sensor-processing
          to: log-generation
          label: Zeek 解析
        - from: log-generation
          to: siem-ingestion
          label: JSON 日志导出
        - from: siem-ingestion
          to: detection-alerting
          label: SIEM 分析
        - from: detection-alerting
          to: ir-investigation
          label: 告警队列
        - from: ir-investigation
          to: remediation
          label: 响应动作
    claimRefs:
      - CE001
      - CE003
      - CE011
      - CE018
      - CE021
      - CE023
      - CE032
  - id: FE003
    title: Corelight 关键依赖地图
    type: dag
    layout: wide
    summary: >-
      有向无环图映射 Corelight 的八项关键依赖，以及会制造平台风险的方向性关系。最重要的两个上游依赖是 Zeek 和 Suricata
      开源项目；若出现严重漏洞或治理变化，风险会直接传导到商业平台。随着云传感器产品线增长，云服务商 API 依赖也很重要。
    data:
      nodes:
        - id: corelight-platform
          label: Corelight 商业平台
          detail: 集成所有传感器、检测和 SaaS 服务的 Open NDR Platform。
          tone: positive
        - id: zeek-oss
          label: Zeek 开源（Corelight 托管）
          detail: 核心协议分析引擎；400+ 个解析器；Corelight 是主要维护者，降低了分叉风险，但也形成对 Zeek 提交者的关键人员依赖。
          tone: positive
        - id: suricata-oss
          label: Suricata 开源（OISF）
          detail: 用于签名检测的 IDS/IPS 引擎；由独立于 Corelight 的 OISF 维护；Corelight 有贡献，但不控制该项目。
          tone: neutral
        - id: cloud-infra-aws-azure-gcp
          label: 云服务商镜像 API（AWS/Azure/GCP）
          detail: 云传感器依赖 AWS VPC Traffic Mirroring、Azure vTAP 和 GCP Packet Mirroring API；API 变化或停用会打断云传感器功能。
          tone: neutral
        - id: hardware-supply
          label: 硬件供应链（物理传感器）
          detail: 物理传感器需要网络硬件组件；供应链集中或组件短缺会给硬件设备收入流制造交付风险。
          tone: neutral
        - id: ml-threat-intel
          label: ML 模型与威胁情报源
          detail: 自研 ML 检测模型需要训练数据和威胁情报源；情报源新鲜度和模型更新节奏会影响检测保真度。
          tone: neutral
        - id: siem-integration-partners
          label: SIEM 集成伙伴（Splunk、Sentinel、Chronicle、QRadar、Elastic）
          detail: SIEM API 变化，或集成伙伴的竞争动作，可能打断或削弱 Corelight 的集成质量；Cisco 收购 Splunk 增加了战略复杂性。
          tone: neutral
        - id: crowdstrike-api
          label: CrowdStrike Falcon 增强 API
          detail: 端点到网络的关联功能依赖 CrowdStrike Falcon API 可用性；CrowdStrike 既是战略投资者，也可能是 XDR 领域的竞争对手。
          tone: neutral
      edges:
        - from: zeek-oss
          to: corelight-platform
          label: 核心解析引擎
        - from: suricata-oss
          to: corelight-platform
          label: IDS 签名层
        - from: cloud-infra-aws-azure-gcp
          to: corelight-platform
          label: 云传感器基础设施
        - from: hardware-supply
          to: corelight-platform
          label: 物理传感器硬件
        - from: ml-threat-intel
          to: corelight-platform
          label: ML 检测层
        - from: siem-integration-partners
          to: corelight-platform
          label: 集成目标
        - from: crowdstrike-api
          to: corelight-platform
          label: 端点增强
    claimRefs:
      - CE001
      - CE007
      - CE010
      - CE021
      - CE039
      - CE040
  - id: FE004
    title: Corelight 产品成熟度与能力矩阵
    type: matrix
    layout: wide
