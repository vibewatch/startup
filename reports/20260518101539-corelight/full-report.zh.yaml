chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与市场位置
        blocks:
          - type: paragraph
            body: >-
              Corelight, Inc. 是一家总部位于加州旧金山的未上市网络安全公司，专注网络检测与响应（NDR）。公司由 Zeek（原名 Bro）的创建者在 2013 年创立；Zeek 是 Berkeley 的
              International Computer Science Institute（ICSI）开发、被广泛采用的开源网络安全监测器。Corelight
              的核心使命，是把原始网络流量转成高保真证据，供安全运营中心（SOC）分析师发现、调查并响应高级威胁。公司把产品定位为「开放 NDR 平台」——建立在 Zeek、Suricata、Sigma
              等开源技术之上，提供其所称的基于证据的网络检测，内置超过 70,000 条签名，并通过行为检测和 AI 驱动检测覆盖 80 多项 MITRE ATT&CK 战术、技术和流程（TTP）。Corelight
              服务全球客户，包括 Fortune 500 公司、主要联邦和民用政府机构、大型研究型大学。平台形态包括物理硬件传感器、虚拟传感器，以及覆盖 AWS、GCP、Azure 的云原生部署。2025 年 Gartner
              Network Detection and Response Magic Quadrant 将 Corelight 评为领导者，为其平台成熟度、企业牵引力和愿景完整性提供了第三方背书。Corelight 也是
              Zeek 开源项目的托管方，提供资金支持、代码贡献和社区治理，进一步强化公司的开放核心竞争定位。Corelight 所处的 NDR 市场，2024 年规模估计约 $3–4
              billion；在混合和云原生基础设施扩张带来新的网络盲区、攻击者技战术持续升级的推动下，预计本十年剩余时间将显著增长。截至 2024 年 4 月 Series E 公告，Corelight
              自称是「行业增长最快、已规模化的 NDR 平台」，ARR 同比增长超过 40%，AI 和 SaaS 驱动的 NDR 解决方案同比增长 300%。
