      - number: '3.2'
        title: 头对头竞争者画像
        blocks:
          - type: paragraph
            body: >-
              ExtraHop RevealX 是与 Corelight 技术上最可比的直接竞争者。被收购后，RevealX 现列为 Arista Networks 产品，把网络性能监控和 NDR 统一在同一架构下，并以
              ExtraHop 所称的「Agentic SOC」能力，以及覆盖威胁检测、事件响应和性能监控的机器学习检测模型做差异化。ExtraHop 在 Forrester Wave: Network Analysis
              and Visibility Solutions Q4 2025 中被评为领导者，与 Corelight 先前的 Forrester 领导者称号形成直接分析师对等。ExtraHop
              面向企业和政府账户，在受监管行业与 Corelight 直接竞争。相比 Corelight，它的关键短板是专有数据模型限制开放数据导出、造成供应商锁定，且开源社区锚定的定位较弱。

              Darktrace 是英国上市公司（DARK.L），以 Self-Learning AI 做差异化；该系统持续为每个用户、设备和网络连接建立正常行为模型，在没有签名或规则的情况下发现异常。Darktrace
              FY2024 ARR 约 $410M，并已远远超出纯 NDR，覆盖邮件安全、OT 和云工作负载，形成单一 AI 优先平台——因此是 Corelight 范围最广的直接 NDR 竞争者。Darktrace
              的强项是自主响应广度和 AI 平台雄心；短板是 Self-Learning AI 模型不透明，安全分析师在取证调查中难以信任。相比之下，Corelight 基于证据的结构化日志能提供更可执行的调查深度。

              Vectra AI 累计融资约 $300M，平台围绕混合和多云环境中的 AI 驱动攻击信号情报构建。Vectra AI 的 Cognito 平台提供 NDR，并与 Azure 和 Microsoft
              Defender 深度集成，因此在 Microsoft 标准化企业中位置较好。Vectra AI 在 2023 年获得 Gartner Peer Insights Customer
              First，反映客户满意度较高。相比 Corelight，它的短板是网络元数据深度较弱，架构更依赖云中心工作负载，而不是传统本地网络环境。

              Stamus Networks 是接近开源的竞争者，原生建立在 Suricata 之上；Suricata 是全球领先的开源网络安全引擎。Stamus 的 Clear NDR
              系统对外宣称，相比传统厂商能提供「更大控制权、更少误报、更快响应时间，以及更灵活开放的方法」。Stamus 的单一许可证模式不对 API
              访问、集成、用户或端点额外收费；这种商业模式具有破坏性，能打动政府、金融机构和预算受限的安全团队。Stamus 十年来经受了 NATO
              最大规模网络安全演习的实战检验，获得政府可信度背书。它的短板是规模更小、企业支持层级有限、集成生态比 Corelight 更窄。

              Cisco Secure Network Analytics（原 Stealthwatch）提供基于 NetFlow 和 IPFIX
              的行为分析，旨在帮助企业「通过持续监控网络和云流量，增强保护数字化企业的信心」。它的竞争优势是与既有 Cisco 网络基础设施原生集成；对大型 Cisco
              客户来说，边际成本几乎为零。架构短板是只具备流级元数据深度，没有深度包检测，也没有 Zeek 式协议级解析。

              Palo Alto Cortex XDR 用 agentic AI 阻断勒索软件和高级威胁，把网络分析定位为覆盖端点、网络和云的更广泛 XDR 平台组件。Microsoft Defender for
              Endpoint 打包在 M365 E5 安全套件中，为已使用 M365 的企业提供网络遥测、端点检测、邮件安全和 Microsoft Sentinel
              SIEM，增量成本接近零，是竞争版图中最具破坏性的定价模式。
