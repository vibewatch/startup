      - number: '6.3'
        title: 具名客户证明：政府、研究与合作伙伴证据
        blocks:
          - type: paragraph
            body: >-
              Corelight
              的具名客户证据受公司政策限制：公司不发布带有可识别企业或政府账户的案例研究；在国防和情报界细分中，这种模式很常见，因为保密要求会阻止公开客户证明项目。现有具名或半具名证据分三类。第一，机构证据：Lawrence
              Berkeley National Laboratory 是典型原始 Zeek 部署，过去二十多年一直对美国 Department of Energy 科学网络进行生产监控。LBNL 同时是 Zeek 和
              Corelight 的发源地，因此是最可信、历史意义最强的客户参考。第二，从业者证据：Gartner Peer Insights 上来自具名角色的评论（“Cybersentry R&D 负责人 –
              政府”、“网络安全专家 – 政府”、“IT 安全与风险管理总监 – 政府”、“信息技术专家 – 制造业”）确认了政府 Cybersentry
              项目和企业制造环境中的生产部署；即便没有公司名，也提供了角色层面的证据。第三，生态证据：CrowdStrike Services 和 Mandiant（Google Cloud
              Security）在企业事件响应项目中嵌入 Corelight，间接确认 CrowdStrike 和 Mandiant 的企业与政府客户——其中包括许多全球最大组织——在 IR 项目期间会在其环境中运行
              Corelight。Black Hat 大会 NOC 部署是最可见的公开证明点，确认 Corelight 能在从业者可观察的对抗性网络条件下运行。已发布营销材料中缺少具名 Fortune 500
              或政府机构案例研究，仍是尽调过程中最大的单一客户证据缺口，需要通过私下客户访谈验证企业和政府渗透深度。
