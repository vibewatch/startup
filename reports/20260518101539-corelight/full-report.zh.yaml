          - type: callout
            title: Microsoft 与超大规模云厂商捆绑：最高严重度的竞争威胁
            body: >-
              Microsoft Defender for Endpoint 的网络遥测能力被打包进 M365 E5，约 $57/用户/月，增量成本接近零，是 Corelight 独立 NDR
              价值主张最尖锐的商品化风险。账户已经标准化在 M365 E5 上时，单独 NDR 平台的经济理由会被结构性削弱——即便 Corelight 的取证深度显著超过 Microsoft
              的网络可见性。同时，超大规模云厂商原生网络遥测（AWS VPC Traffic Mirroring、Azure Network Watcher、GCP Packet Mirroring）随着云原生环境在 3–5
              年内成熟，会对 Corelight Cloud Sensor 的差异化构成中期威胁。
