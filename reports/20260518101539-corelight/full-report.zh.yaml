  - id: FR001
    title: Corelight 风险热力图：可能性与严重性
    type: matrix
    layout: wide
    summary: >-
      3×3 风险热力图，将 Corelight 的主要已识别风险映射到可能性（低 / 中 / 高）与严重性（低 / 中 / 高/关键）的矩阵。右上象限（高可能性 × 高严重性）包含 FedRAMP 授权缺口。左上象限（低可能性 ×
      关键严重性）包含传感器供应链被攻破场景。居中风险包括出口管制合规、Zeek 分叉和 CEO 关键人员风险。热力图显示 Corelight
      风险画像的不对称性：大多数风险是低概率、高后果，这符合企业安全基础设施供应商的特征，因为信任就是核心产品属性。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 关键严重性
          values:
            - 传感器供应链被攻破（SolarWinds 类型）；失去 Zeek 商标许可（ICSI）
            - 重大 SaaS 数据泄露（多租户元数据）
            - FedRAMP 延迟阻断联邦云 ARR
        - label: 高严重性
          values:
            - 主导性 Zeek 分叉；CEO Brian Dye 离职；Vern Paxson 离职 / IP 争议
            - EAR 出口管制违规；CrowdStrike/Cisco 集成停用；Zeek 零日 CVE
            - 政府合同流失（>15% ARR）；CMMC 不合规阻断 DoD 采购
        - label: 中等严重性
          values:
            - ICSI 治理变化；Suricata GPL 合规缺陷
            - 云服务商 API 变化（镜像）；Mandiant/Google 合作关系丢失；CTO 空缺
            - GDPR/CCPA 不合规（欧盟客户数据）；ML 误报导致告警疲劳
