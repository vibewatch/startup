      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: Zeek 开源核心与协议深度：Corelight 最清晰、最可防守的护城河
            body: >-
              Corelight 的 400+ 个源自 Zeek 的协议解析器，以及二十年来对 Zeek 开源项目的托管，是 NDR 市场中最具结构防御性的技术护城河。不同于 ML 优先的竞争对手，这种深度来自 20+
              年里学术和政府机构的分布式社区开发，专有厂商无法快速复制。对依赖取证的 SOC 团队和事件响应公司而言，当 Corelight 与 ExtraHop 或 Darktrace
              竞争时，协议深度和证据质量通常是决定性差异。
            calloutType: strength
            claimRefs:
              - CP013
              - CP015
