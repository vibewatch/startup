  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图概览
        blocks:
          - type: paragraph
            body: >-
              2026 年的 NDR 市场是一个分散但正在整合的竞争版图。Corelight 同时面对纯 NDR 厂商、安全平台既有巨头，以及越来越多把网络可见性与端点或云安全打包的 XDR 和 SASE
              混合产品。竞争分三层。第一层是直接 NDR 同业：ExtraHop RevealX（被收购后已成为 Arista Networks 组合中的产品，结合网络性能监控和 ML 驱动威胁检测，在 Forrester
              Wave: Network Analysis and Visibility Solutions Q4 2025 中被评为领导者）；Darktrace（英国上市公司，FY2024 ARR 约 $410M，以 AI
              优先的自学习威胁检测覆盖 NDR、邮件安全和 OT）；Vectra AI（累计融资约 $300M，面向 Azure 和 Microsoft Defender 集成的云 AI NDR，2023 年获 Gartner
              Peer Insights Customer First）；以及 Stamus Networks（规模较小、欧洲公司，基于开源 Suricata，Clear NDR 系统曾在 NATO
              网络安全演习中经受实战检验）。第二层是相邻既有厂商：Cisco Secure Network Analytics，原 Stealthwatch，提供基于 NetFlow 和 IPFIX 的行为分析，并嵌入
              Cisco 网络基础设施组合；以及 Palo Alto Networks Cortex XDR，把网络分析定位为统一 XDR 平台的一部分。第三层是替代品：Splunk、IBM QRadar 等 SIEM
              厂商，以及 EDR 或 XDR 平台；它们通过在更广泛安全数据平台内提供部分网络遥测，主张不必单独部署 NDR。分析师群体认可 Corelight 的开放核心路线是一种结构性差异。2025 年 Gartner
              Magic Quadrant for NDR 将 Corelight 评为领导者，Forrester Wave: Network Analysis and Visibility Q2 2023 也把
              Corelight 的协议解析深度和开放数据模型列为主要领导力标准。ExtraHop RevealX 同样在 Forrester Wave NAV Q4 2025
              中被评为领导者，成为最接近的分析师认可同业。竞争动态由一个根本张力塑造：一边是保真度——Corelight 通过取证级网络元数据形成主要差异化；另一边是平台广度，Microsoft、Cisco 和 Palo
              Alto 通过把网络可见性嵌入更大安全栈来利用这一点。买方越来越两者都要，市场因此分成两种速度：取证驱动的 SOC 和 IR 团队偏好 Corelight 的证据化方法，寻求整合的 CISO
              则转向平台厂商提供的「足够好」NDR，并把它与端点和身份打包。
