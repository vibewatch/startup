  - id: TR001
    title: 监管 / 法律风险登记表
    tableType: enumeration
    enumerationScope:
      coverage: partial
      basis: >-
        Risk register compiled from publicly available regulatory frameworks (FedRAMP, EAR, GDPR, CMMC 2.0), open-source
        license terms (Zeek BSD, Suricata GPL v2), the ICSI Zeek trademark notice on corelight.com, and inference from
        Corelight's publicly disclosed government customer base and cloud product strategy. Specific regulatory
        correspondence, legal opinions, or internal compliance documentation not available for a private company;
        entries represent assessed exposure, not confirmed findings.
    columns:
      - 规则 / 许可证 / 问题
      - 司法辖区
      - 状态
      - 可能性
      - 严重性
      - 缓解措施
      - 剩余敞口
      - 尽调路径
    rows:
      - - FedRAMP 授权（云产品）
        - 美国联邦
        - 推进中 – 截至 2026 年中尚未获授权
        - 高 – 要求确定；时间表不确定
        - 高 – 阻断面向文职机构的云销售
        - 本地部署传感器销售作为过渡；FedRAMP 进行中列表
        - 高 – 每延迟一个季度都会错失云 ARR 机会
        - 索取 FedRAMP 授权时间表、3PAO 聘用函和机构 ATO 临时安排
      - - 出口管理条例（EAR）– 两用网络安全工具
        - 美国（BIS/商务部）
        - 现行监管框架；Corelight 合规状态未知
        - 中 – 网络安全 ML 工具可能归入 ECCN 4E001/5E002
        - 高 – 不合规可能导致出口权限被拒和处罚
        - 假设政府销售中有 EAR 合规流程；未公开披露
        - 中 – 国际工程人员存在视同出口风险；国际销售许可
        - 索取 EAR 分类意见、拒绝方筛查程序文档，以及关键工程人员视同出口分析
      - - GDPR / Schrems II（欧盟客户数据处理）
        - 欧盟 / EEA
        - 欧盟客户部署的现行要求；合规状态未确认
        - 中 – 欧盟客户使用云托管 Investigator / NDR Platform
        - 中 – 监管罚款最高可达全球年营业额 4%；存在合同终止风险
        - 与欧盟客户签署数据处理协议；架构上提供区域内数据选项
        - 中 – SaaS 对 IP/DNS 元数据的处理可能构成个人数据处理
        - 索取面向欧盟客户的 DPA 模板、SCC 或同等传输机制文档，以及数据驻留选项
      - - CCPA（加州消费者数据）
        - 美国加州
        - 现行要求；SaaS 平台处理的网络元数据可能包含消费者数据
        - 低中 – 通过企业客户数据形成间接敞口
        - 低 – 民事处罚敞口；主要是合同风险
        - 客户协议包含企业客户 DPA 和 CCPA 附录
        - 低 – 主要通过企业合同条款处理
        - 确认标准企业 MSA 纳入 CCPA 附录
      - - CMMC 2.0（网络安全成熟度模型认证）– DoD 供应链
        - 美国 DoD
        - 规则制定已生效；DoD 承包商必须合规；Corelight 作为 DoD 供应商也需对齐
        - 中 – DoD 采购机会取决于产品姿态是否符合 CMMC
        - 中 – 未获认证会限制 DoD 供应链合同
        - SOC 2 Type II 和 ISO 27001 部分覆盖；CMMC 差距分析未公开披露
        - 中 – 某些 DoD 合同可能要求 CMMC Level 2 或 3 认证
        - 索取面向 DoD 产品的 CMMC 差距分析和认证路线图
      - - Suricata GPL v2 copyleft 许可证合规
        - 美国 / 国际
        - 现行合规义务；Suricata 嵌入传感器固件
        - 低中 – 自研代码与 GPL v2 组件链接
        - 中 – OISF 版权主张可能要求披露源代码或禁售产品
        - GPL 与自研代码做架构隔离；许可证审计
        - 低中 – 需要正式 SBOM 和 GPL 边界确认
        - 索取软件物料清单（SBOM）和传感器固件中 GPL v2 合规边界的法律意见
      - - Zeek ICSI 商标许可依赖
        - 美国 / 国际
        - 有效许可 – Corelight 根据 ICSI 许可协议使用「Zeek」
        - 低 – 与 ICSI 关系长期且稳定
        - 高 – 失去商标许可将迫使产品全面更名
        - 与 ICSI 保持合作关系；Corelight 是 Zeek 主要资助方
        - 中 – 并购 / 控制权变更时许可证是否延续尚未公开确认
        - 获取并审阅 ICSI 商标许可协议：确认永久期限、控制权变更后存续以及排他性条款
      - - 美国第 14028 号行政令 – 软件供应链 / SBOM
        - 美国联邦
        - 面向美国联邦机构销售的软件供应商适用的现行要求
        - 中 – Corelight 向联邦机构销售；SBOM 合规属强制要求
        - 中 – 不合规可能导致失去联邦合同资格
        - 鉴于已有联邦销售，EO 14028 合规可能在推进；未公开确认
        - 中 – 面向联邦产品需发布 SBOM 并提供证明信
        - 按 EO 14028 / CISA 指引索取传感器和 SaaS 产品 SBOM 以及联邦软件证明信
    notes: >-
      可能性和严重性采用三档定性尺度（低、中、高）。监管敞口评估基于公开框架和 Corelight 已披露业务活动；它们是风险评估，并非已确认的法律结论。鉴于 Corelight 政府收入集中度，FedRAMP 和 EAR
      条目的综合重要性最高。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR008
      - CR009
  - id: TR002
    title: 运营及质量 / 安全风险登记表
    columns:
      - 失效模式
      - 可能性
      - 严重性
      - 缓解成熟度
      - 剩余敞口
      - 未解决缺口
    rows:
      - - 通过供应链攻击攻陷 Corelight 传感器固件（SolarWinds 类型）
        - 低 – 需要定向且复杂的攻击
        - 极高 – 攻击者可被动监控所有客户网络
        - 中 – 具备 SOC 2 Type II；假设存在代码签名；未公开 CVD 政策
        - 高 – 未确认固件更新链完整性控制或篡改检测
        - 未确认公开漏洞赏金、CVD 政策或第三方固件安全审计
      - - SaaS 管理平面数据泄露（Investigator / NDR Platform 多租户）
        - 低中 – 客户价值高，SaaS 基础设施是有吸引力的目标
        - 高 – 多家企业和政府客户的网络元数据暴露
        - 中 – SOC 2 Type II 覆盖 SaaS；已取得 ISO 27001
        - 中 – 云端多租户元数据可能暴露；本地部署数据仍由客户控制
        - 未见已发布的事故记录；未确认存在漏洞赏金计划；第三方渗透测试结果未披露
      - - Zeek 或 Suricata 开源代码库的零日 CVE 在 Corelight 修补前遭利用
        - 中 – 开源项目会持续披露 CVE；NVD 显示 Zeek 过往存在 CVE
        - 高 – Corelight 传感器在补丁部署前遭主动利用
        - 中 – Corelight 掌握补丁节奏；可比纯上游更快交付修复
        - 中 – 大规模传感器装机量要求协同、分阶段推出固件
        - 未见 Corelight 公开 CVE 响应 SLA 或补丁部署时间承诺
      - - 云厂商 API 变更（AWS VPC Traffic Mirroring / Azure vTAP / GCP Packet Mirroring）
        - 中低 – 云厂商此前曾调整网络 API
        - 中 – 受影响云厂商的云传感器可见性部分丢失
        - 中低 – Corelight 已分别适配各云厂商的流量镜像 API
        - 中 – 任一云厂商变更都可能削弱该云上客户工作负载的可见性
        - 未见公开确认的 SLA，承诺在三大云厂商间维持云传感器能力一致
      - - ML 模型或 Suricata 签名带来过高误报率
        - 中 – ML 模型在生产环境中常导致告警疲劳
        - 中 – 告警信号比恶化时，客户 SOC 团队会失去信任并增加流失风险
        - 中 – Investigator SaaS 中的 AI 调查功能旨在减轻分析师疲劳
        - 中低 – Gartner Peer Insights 客户评论肯定检测质量；也有一些误报反馈
        - 未见公开审计的误报率指标；公司声称的性能基准未获独立验证
      - - 托管 NDR 平台违反 SLA 或长时间中断
        - 低 – 托管服务通常设有高可用 SLA
        - 中 – 政府和企业客户预期实时检测 SLA
        - 中 – SOC 2 Type II 包含可用性标准；架构未完全披露
        - 中低 – 托管服务可用性与底层云厂商正常运行时间绑定
        - 具体可用性 SLA 条款和历史正常运行时间记录未公开披露
    notes: >-
      可能性和严重性采用三档定性刻度（低、中、高）；最高严重度情景使用“严重”。缓释成熟度反映公开可得的控制证据；未公开的内部控制可能提高实际成熟度。关于历史 Zeek CVE 的 NVD 引用，基于研究期间访问的 NIST NVD
      搜索结果。
  - id: TR003
    title: 合作伙伴与依赖风险登记表
    columns:
      - 依赖项
      - 交易对手方
      - 角色
      - 集中度
      - 失效情景
      - 严重性
      - 缓释措施
      - 剩余风险敞口
    rows:
      - - Zeek 开源代码库
        - Zeek 社区 / Corelight（主要贡献者）
        - 核心技术引擎；400+ 个协议解析器；基础分析能力
        - 严重 – 整个产品套件构建在 Zeek 之上
        - 资金充足的竞争性 Zeek 分叉获得企业采用；开源治理出现冲突
        - 高 – 核心技术护城河被商品化；定价权被侵蚀
        - Corelight 是主要贡献者和资助方；雇用核心维护者；社区影响力强
        - 高 – Corelight 不拥有 Zeek；BSD 许可证允许不受限制地分叉
      - - Zeek 商标许可
        - International Computer Science Institute（ICSI，研究机构）
        - 在产品和营销中使用“Zeek”品牌的法律权利
        - 高 – 所有品牌和营销都以 Zeek 名称为锚
        - ICSI 对许可条款提出争议；许可未续签；ICSI 向竞争对手授予竞争性许可
        - 高 – 核心产品身份被迫重塑品牌
        - Corelight 与 ICSI 关系长期稳定；Corelight 是 Zeek 生态主要资助方
        - 中 – 许可条款和控制权变更条款未公开确认
      - - CrowdStrike Falcon 集成与联合销售渠道
        - CrowdStrike（投资方 + 集成伙伴）
        - 产品集成伙伴；战略投资方；面向 Falcon 客户的联合销售渠道
        - 高 – CrowdStrike 是主要 GTM 伙伴和投资方
        - CrowdStrike 废弃集成 API；直接进入 NDR 竞争；并购中存在利益冲突
        - 中高 – 失去主要联合销售渠道；并购中的信息不对称
        - 集成合作已协议化；双方共同投入联合客户
        - 中 – 既是投资方又可能成为竞争对手，这一结构性问题无法完全缓释
      - - Cisco Investments 与 Cisco XDR 集成
        - Cisco / Cisco Investments（投资方 + 竞争对手）
        - 战略投资方；Cisco XDR 集成；Splunk（Cisco 旗下）分发渠道
        - 高 – Cisco 是投资方，并拥有 Splunk（Corelight 主要分发渠道）
        - Cisco 重新优先投入自有网络安全；收购后 Splunk 合作伙伴计划条款变化
        - 中高 – 失去 Splunk 分发；Cisco 竞争升级
        - 已与 Cisco 和 Splunk 签署合作协议；Series E 轮投资关系
        - 中 – Cisco 收购 Splunk 后，集成和分发经济性可能变化
      - - Splunk / Elasticsearch 分发渠道
        - Splunk（Cisco）、Elastic
        - Corelight 日志数据的主要 SIEM 分发渠道
        - 中高 – 企业销售管线中相当一部分流经 Splunk 和 Elastic
        - 平台级定价变化或 API 废弃影响 Corelight 应用
        - 中 – 分发经济性受扰动；Corelight 应用维护成本上升
        - 已进入 Marketplace；有 Corelight for Splunk 应用；开放数据模型降低单一供应商锁定
        - 中低 – 开放数据模型提供一定缓释；客户忠诚度降低流失
      - - Mandiant/Google 事件响应合作
        - Google（Mandiant）
        - IR 工作流集成；Corelight 是 Mandiant IR 项目的网络证据来源
        - 中 – Mandiant IR 项目推动 Corelight 在高价值目标中部署
        - Google 在 Mandiant/Chronicle 内建设原生 NDR；降低对第三方 NDR 的依赖
        - 中 – 失去 IR 驱动的 Corelight 部署；Google Chronicle 竞争
        - 合作仍在推进；Corelight 已集成进 Mandiant 响应工作流
        - 中 – Google 通过 Chronicle 布局 NDR，对该渠道构成独立风险
    notes: 交易对手方关系基于公开确认的合作公告、投资披露（Series E 轮新闻稿）和集成文档评估。内部协议条款（排他性、API SLA、收入分成）不公开。
  - id: TR004
    title: 人员与执行风险登记表
    columns:
      - 角色 / 职能
      - 依赖 / 缺口
      - 可能性
      - 严重性
      - 缓释措施
      - 尽调路径
    rows:
      - - Brian Dye – 首席执行官
        - 关键人：掌握商业基本盘、投资人关系和并购谈判语境
        - 低 – 自愿离职或健康事件
        - 高 – 流动性事件前关键阶段出现领导真空
        - 董事会厚度（Bettencourt 任执行董事长，Naguib 为新董事）提供治理托底
        - 索取雇佣协议、归属时间表、控制权变更条款和继任计划文件
      - - Vern Paxson – 联合创始人、首席科学家
        - 关键人：Zeek 发明者；开源社区信誉和技术权威
        - 低 – 逐步淡出；健康事件；转回学术界
        - 高 – 社区信誉受损；Zeek IP 转让问题重新浮出
        - Zeek 的深层组织知识已分散在工程团队中；Corelight 雇用多名 Zeek 维护者
        - 确认 ICSI/LBL 相关所有 Zeek 发明的 IP 转让协议；确认参与条款和股权
      - - CTO（截至 2026 年中角色未公开披露）
        - 治理缺口：技术领导结构不清；职位空缺或任命未披露
        - 中 – CTO 空缺会造成工程组织领导缺口
        - 中 – CTO 空缺期间，产品路线图执行和工程团队留存承压
        - 未确认；Vern Paxson 作为首席科学家可能承担技术领导职能
        - 确认 CTO 汇报结构、身份和职责范围；判断该职位是空缺还是未披露
      - - 联邦销售团队与持密级许可人员
        - 政府采购需要具备安全许可的销售工程师和解决方案架构师服务涉密环境
        - 中 – 持密级许可人才稀缺且昂贵；FedRAMP 延迟会降低管线紧迫性
        - 中 – 若持密级许可销售能力不足，联邦 ARR 增长会受限
        - 鉴于政府 ARR 占 30–40%，应已有面向政府的销售组织；具体持密级许可人数未知
        - 确认持密级许可人员数量、安全许可级别和政府销售团队结构
      - - 核心工程团队（Zeek 专家、ML 安全研究员）
        - 专业人才集中：网络协议工程师、Zeek 维护者、ML 安全研究员
        - 中 – 人才市场竞争激烈；超大规模云厂商和 PE 支持的竞争对手挖人
        - 中 – Zeek 维护者流失会拖慢传感器路线图和社区参与
        - 股权激励；研究发表机会；使命驱动文化
        - 确认工程团队留存指标、流失率和股权刷新计划；识别具名 Zeek 维护者及其离职条款
      - - CMMC/FedRAMP 合规执行
        - 执行风险：内部 GRC 团队必须按期拿下 FedRAMP ATO 和 CMMC 认证
        - 中 – 云厂商合规时间表经常滑坡
        - 高 – FedRAMP 延迟会直接压低政府 ARR 天花板
        - FedRAMP 处于推进中；SOC 2 / ISO 27001 打底；假定已接洽 3PAO
        - 确认 3PAO 身份、FedRAMP 预计 ATO 日期、CMMC 认证路线图和内部 GRC 人员规模
    notes: 基于 2026 年 5 月对 Corelight 领导层页面的查阅，CTO 角色尚未公开披露。人员风险评估来自公开领导层披露，以及对公司阶段和战略的推断。内部继任计划、雇佣协议和股权结构不公开。
  - id: TR005
    title: 缓释措施与否决标准
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - FedRAMP 授权延迟
        - FedRAMP Marketplace 上架状态；季度政府 ARR 增长率
        - 到 2026 年 Q4 仍未取得 FedRAMP ATO，或政府 ARR 同比增长低于 20%
        - 重新校准政府收入预测；评估本地部署传感器桥梁是否能支撑政府板块；可能需要下调估值
      - - Corelight 传感器或 SaaS 发生重大安全事件
        - 相当于 SEC 事故披露的事件；客户通知；存在主动利用的 CVE
        - 任何经确认的客户网络元数据或传感器固件未授权访问
        - 否决标准：安全事件会触发政府和企业客户的大规模合同终止条款；安全市场中的声誉即时受损，需要评估退出
      - - 失去重大政府合同或 CISA 咨询关系
        - 公开合同取消通知；从 CISA 咨询名单移除；联邦采购暂停
        - 代表 ARR >15% 的合同被取消，或 CISA 咨询关系终止
        - 若按集中度加权，可构成否决标准：触发收入断崖，并从估值中移除政府板块溢价
      - - 资金充足的竞争对手主导 Zeek 分叉
        - GitHub 上的开源分叉活动；企业 NDR 厂商发布基于 Zeek 且直接竞争的产品
        - 分叉在 12 个月内积累超过 Zeek GitHub stars 20% 的关注，或出现可比的企业采用信号
        - 当前护城河投资逻辑的否决标准：必须立即重新评估技术差异化；定价权会被压缩
      - - CrowdStrike 或 Cisco 降低 Corelight 集成优先级
        - 集成废弃公告；API 访问受限；从合作伙伴计划中移除联合销售
        - CrowdStrike 或 Cisco 任一方正式终止或显著限制集成合作
        - 近期收入和销售管线面临显著风险；需要重新评估分发策略和伙伴驱动 ARR
      - - CEO Brian Dye 离任
        - CEO 交接公告；高管离任文件
        - Dye 宣布离任，且现有领导层梯队中没有具名继任者
        - 近期运营风险严重；需要董事会紧急介入并审查继任计划；可能拉长 M&A 时间线
      - - Vern Paxson 离任或 IP 争议
        - Paxson 离任公告；ICSI 采取法律行动或商标争议
        - Paxson 正式退出 Corelight，或 ICSI 发起商标重新谈判
        - 社区信誉承压；IP 所有权尽调变得紧迫；立即评估 IP 转让协议
      - - 超大规模云厂商原生 NDR 取代第三方市场
        - AWS/Azure/Google 推出原生 NDR，在云传感器用例上与 Corelight 竞争
        - 超大规模云厂商原生 NDR 在独立基准测试中达到 Corelight 云传感器同等水平
        - 重新评估总可用市场天花板；本地部署和混合部署板块仍有价值，但云传感器增长逻辑受损
    notes: 否决标准定义为需要根本性重估投资逻辑的事件，而不只是下调预测。可监控触发项设计成可通过公开信息渠道或标准投资人报告观察。阈值是本分析使用的定性基准；实际投资层面的阈值应按具体组合持仓规模和风险偏好校准。
  - id: TV001
    title: 投资建议摘要
    columns:
      - 维度
      - 评估
      - 置信度
      - 影响
    rows:
      - - 投资建议
        - 观察 — 在完成额外尽调前，不应按当前隐含估值投入资本
        - 中
        - 关注 NRR 确认、股权结构表披露、TPVG 债务条款；若六项尽调要求均得到满意回答，可上调至买入
      - - 隐含企业价值
        - $1.0B–$1.5B（根据 Series E 轮规模、可比公司倍数和 NDR 板块基准推断）
        - 低 — 公司未披露
        - 估值有竞争力但不便宜；相对 Darktrace 公开可比公司的溢价需要 NRR 和增长率确认来支撑
      - - 进入倍数
        - 预计远期 ARR 的 7–10x（2024 年 4 月交割时估计 ARR 为 $120–160M）
        - 低 — ARR 未公开披露
        - 该倍数与 NDR 私有市场基准一致（ExtraHop 并购时 5–7x；Vectra AI 私募轮 8–15x），但不是估值便宜货
      - - 市场地位
        - Gartner MQ Leader（NDR 2024、2025）；Forrester Wave Leader（NAV 2023）；最高质量的 NDR 开源遥测
        - 高 — 两家第三方验证
        - 市场地位是最强的投资逻辑支柱；推动进入交易短名单并降低商业风险
      - - 风险评级
        - 中高 — 优先股堆叠未知；NRR 未确认；存在风险债；FedRAMP 未完成；估值不透明
        - 中
        - 多项风险因素同时存在；单一风险均不足以毁掉交易，但组合起来足以支持谨慎
      - - 退出时间线
        - 2026–2028（基于投资人财团画像和增长阶段，IPO 或战略并购是最可能路径）
        - 低 — 未披露事件时间
        - 投资人画像（Accel、GC、IP）符合 IPO 准备特征；战略投资方（CrowdStrike、Cisco）提供 M&A 可选性
    notes: 除特别注明外，所有评估值均为分析师基于公开信息的估计。ARR、NRR 和估值数字来自可比公司分析和公开信号推断；Corelight 或财务审计方均未确认。置信度评级反映支撑各维度的公开证据质量。
  - id: TV002
    title: 投资逻辑 vs. 反向逻辑
    columns:
      - 投资逻辑因素
      - 支持证据
      - 反向逻辑风险
      - 证据质量
      - 哪些变化会改变判断
    rows:
      - - NDR 市场领导地位（Gartner/Forrester 双重认可）
        - Gartner MQ Leader 2024–2025；Forrester Wave NAV Leader 2023；连续多年获得分析机构认可
        - 分析师排名不保证收入；供应商一次产品周期失误就可能掉出榜单
        - 高 — 第三方确认
        - 若在 2026 周期失去 Gartner MQ Leader 地位，将表明竞争替代并把建议调至放弃
      - - Zeek 开源护城河
        - Corelight 雇用核心 Zeek 维护者；400+ 个协议解析器；在政府 SOC 和 Five Eyes 中占据主导采用
        - BSD 许可证允许分叉；资金充足的竞争对手或超大规模云厂商可能资助对手版 Zeek 发行版
        - 高 — 由公开开源项目数据确认
        - 被实质采用的 Zeek 分叉（如超大规模云厂商支持）会侵蚀差异化投资逻辑
      - - 政府收入集中度
        - 估计 30–40% ARR 来自美国政府 / 情报界 / Five Eyes；与 CISA 有国家级咨询关系
        - 政府集中度带来合同断崖风险；单个大型合同流失会对 ARR 产生过大影响；FedRAMP 缺口限制云增长
        - 中 — 收入结构为估计，未获确认
        - 失去重大政府锚定合同（如 CISA、DoD 机构）将触发投资逻辑破坏审查
      - - Series E 轮投资人质量
        - >-
          Accel 领投；General Catalyst、Insight Partners、CrowdStrike Falcon Fund、Cisco Investments 参投；均由 PR Newswire
          和投资人组合页面确认
        - 战略投资方（CrowdStrike、Cisco）存在利益冲突风险；其信息权可能在 M&A 中让竞争对手受益
        - 高 — 已确认
        - 审查 Series E 轮条款清单可能揭示不利的反稀释、ROFR 或信息权条款，削弱退出可选性
      - - 40%+ ARR 增长率
        - 公司在 2024 年 4 月 Series E 轮新闻稿中披露；SaaS/云板块同比增长 300%
        - 增长率只是当时披露；没有连续四个季度确认；公告后可能已减速
        - 低 — 单一数据点、公司声称，未获独立验证
        - 确认连续两个季度 ARR 同比增长低于 25%，倍数将压缩至悲观情景区间
      - - IPO 或 M&A 退出路径
        - 投资人财团画像符合 3–5 年流动性周期；Insight Partners 和 Accel 有成熟 IPO 记录
        - 宏观环境（利率上行、科技股倍数压缩）可能推迟 IPO 窗口；战略 M&A 需要竞价或单一收购方兴趣
        - 中 — 未确认公开时间线或投行介入
        - 2029 年后仍无流动性事件，持有期延长将显著损害 IRR 计算
    notes: >-
      投资逻辑和反向逻辑因素来自公开来源和分析师推断。风险因素不是二元变量，而是落在概率和严重性的光谱上。单一反向逻辑因素本身都不足以毁掉交易，但估值不透明、NRR
      未确认和风险债组合起来，意味着在六项尽调要求全部解决前，建议应为观察而非买入。
  - id: TV003
    title: 乐观 / 基准 / 悲观情景矩阵
    columns:
      - 情景
      - 关键假设
      - 远期 ARR 估计
      - EV 倍数
      - 隐含 EV（USD M）
      - 概率信号
      - 主要下行触发项
    rows:
      - - 乐观情景
        - 2026 年中前取得 FedRAMP；NRR 确认为 125%+；NDR TAM 按高端增速增长；2027 年前 IPO 或溢价 M&A；CrowdStrike 或 Cisco 战略出价带来竞价竞争
        - $160–200M
        - 10–14x
        - $1,500–2,000M
        - 中低 — 需要多个正向催化剂；依赖 IPO 市场和 FedRAMP 时间线
        - IPO 市场关闭或战略收购方退出
      - - 基准情景
        - FedRAMP 延迟 12–18 个月；NRR 为 110–120%；ARR 增长维持 35–40% 同比；2027–2028 年 M&A 退出或老股交易；TPVG 债务再融资
        - $140–175M
        - 7–10x
        - $1,000–1,500M
        - 中 — 大多数假设与已确认的公开证据一致
        - ARR 增长减速至 25% 以下；企业板块被竞争替代
      - - 悲观情景
        - XDR/SIEM 捆绑导致 NDR 市场饱和；ARR 增长减速至 20% 以下；2027 年前未取得 FedRAMP；出现下轮降估动态；TPVG 债务契约承压
        - $100–130M
        - 4–6x
        - $600–800M
        - 中低 — 需要行业逆风同时兑现
        - 以下两项或以上：竞争替代、FedRAMP 失败、NRR 低于 100%，或领导层离任
      - - 下轮降估情景
        - 重大政府合同流失、自有平台安全事件，或 NRR 实质降至 90% 以下并触发投资人信心崩塌
        - $70–100M
        - 3–4x
        - $200–400M
        - 低 — 概率不高，但考虑行业事件风险并非不可想象
        - Corelight 传感器若发生 SolarWinds 等级安全事件，将触发大规模政府合同终止
      - - 首选退出情景
        - CrowdStrike 或 Cisco 以 9–12x ARR 溢价战略收购，现有投资关系和信息访问促成交易
        - $150–180M
        - 9–12x
        - $1,350–1,800M
        - 中 — 两家收购方都有战略理由和投资头寸
        - DOJ/FTC 对 CrowdStrike 或 Cisco 收购的反垄断审查可能延迟或阻止交易
      - - IPO 情景
        - 在取得 FedRAMP 并披露 NRR 后，于 2026 年末或 2027 年按 NDR 市场可比倍数 IPO
        - $160–200M
        - 8–12x
        - $1,200–1,800M
        - 中 — 取决于 IPO 市场条件和宏观环境
        - 利率环境和科技 IPO 市场情绪是主要外部变量
    notes: >-
      所有情景估值均为分析师基于可比公司倍数和从公开来源推断的 ARR 作出的估计。Corelight 未公开披露财务预测、估值或退出时间线。概率信号是定性评估，不代表正式模型给出的概率估计。ARR 估计采用 2024 年 4 月估计
      $90–120M 基线上的 40%+ 同比增长。
  - id: TV004
    title: 可比估值表
    type: enumeration
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable set selected from NDR market participants and adjacent cybersecurity segments based on
        network-telemetry product overlap, enterprise and government customer base similarity, revenue scale proximity
        to Corelight's estimated ARR range, and availability of public valuation or transaction data. Excludes minor NDR
        vendors (Corelight Open NDR forks, sub-$10M ARR pure-play startups) and adjacent infrastructure security vendors
        without meaningful network detection overlap.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
    columns:
      - 公司
      - 类型 / 阶段
      - 估计 ARR / 收入
      - 估值 / 交易
      - 收入倍数
      - NDR 相关性
      - 局限
    rows:
      - - Darktrace (DARK.L)
        - 上市公司（LSE）；AI 原生 NDR + 邮件安全；总部在英国
        - $700–900M ARR（估计 FY2025）
        - $3.5–4.5B 市值（2026 年中）
        - 4–6x ARR
        - 最接近的纯 NDR 上市可比公司；AI 驱动检测；聚焦企业 + 政府
        - 收入规模约为 Corelight 的 5–7x；英国上市，市场动态不同；包含邮件安全
      - - ExtraHop（被 Arista Networks 收购）
        - M&A 交易；SaaS NDR + 网络性能；2022 年 7 月被收购
        - $130–180M ARR（收购时估计）
        - $900M 交易价格
        - 5–7x ARR
        - 最直接可比的 M&A 交易；网络检测 + 性能分析；聚焦企业
        - 市场峰值后交易（2022 年 7 月风险偏好下降环境）；Arista 作为战略收购方，支付倍数可能低于纯财务买家
      - - Vectra AI
        - 私营公司；AI 驱动 NDR；Series F 轮（2022）
        - $100–200M ARR（估计）
        - $1.5–2.5B（估计 Series F 轮隐含）
        - 8–15x ARR
        - 直接 NDR 竞争对手；AI/ML 原生检测；聚焦企业；最新私有市场可比公司
        - 估值未公开披露；ARR 估计来自市场观察者；不确定区间较大
      - - Illumio
        - 私营公司；微分段 + 零信任网络；Series F 轮（2021 年 11 月）
        - $150–200M ARR（估计）
        - $2.75B（已披露 Series F 估值）
        - 14–18x ARR
        - 零信任网络安全；政府 + 企业；监管顺风带来的溢价
        - 微分段与 NDR 相邻，但不是直接可比公司；2021 年市场高点估值；仅部分重叠
      - - CrowdStrike (CRWD)
        - 上市公司（NASDAQ）；XDR + EDR + 网络情报；市值龙头
        - $3.5B+ ARR（FY2026E）
        - $70–90B 市值（2026 年中）
        - 20–28x ARR
        - Corelight 的战略投资方；CrowdStrike Falcon 的网络可见性模块与 NDR 部分可比
        - 规模、多元化和盈利能力结构均不可与 Corelight 直接相比；倍数反映平台溢价
      - - Corelight, Inc.（标的）
        - 私营公司；开放 NDR；Series E（2024 年 4 月）
        - $120–160M ARR（估计，2025–2026）
        - $1.0–1.5B（由可比公司分析推算；未披露）
        - 7–10x 远期 ARR
        - 标的公司；隐含估值来自可比公司组和 Series E 轮背景
        - 所有财务数字均为分析师估计；实际估值未获公开确认
    notes: >-
      除注明为公开披露外，私营公司的所有收入和估值数字均为分析师估计。可比公司组刻意收窄，排除产品重叠不足的相邻安全厂商。Darktrace 是唯一可直接公开对标的纯 NDR 公司。ExtraHop 提供最相关的 M&A
      交易参照。倍数反映估值事件发生时的市场条件；私营公司当前倍数可能不同。
  - id: TV005
    title: 投资逻辑破裂触发项与终止标准
    columns:
      - 触发项
      - 监测信号
      - 对投资逻辑的传导
      - 评估频率
      - 行动
    rows:
      - - Corelight 传感器或 SaaS 平台发生重大安全事件（SolarWinds 级别）
        - CVE 披露；CISA 公告；客户终止通知；新闻报道
        - 灾难性——会摧毁客户对 NDR 厂商自身安全性的信任；政府合同可能终止；声誉损害不可逆
        - 持续监测
        - 立即放弃；退出任何持仓；通知合规团队
      - - 2026 年年度周期失去 Gartner 魔力象限领导者地位
        - Gartner NDR 魔力象限发布（年度，通常 Q3）
        - 高——双重分析师领导者地位是主要商业护城河；失去该地位意味着竞争替代
        - 年度（Gartner 发布）
        - 下调为放弃；任何重新进入前先重新评估竞争位置
      - - 确认新一轮降价融资估值低于 Series E 隐含价值
        - Form D 文件；新闻报道；投资者沟通；二级市场定价
        - 高——确认增长预期已被重置；带来优先股堆叠悬压和反稀释棘轮危机
        - 通过 SEC EDGAR Form D 文件按季度监测
        - 放弃；复核股权结构影响；评估降价轮条款是否重塑退出经济性
      - - CEO Brian Dye 离任且未指定接任者
        - 新闻稿；LinkedIn；管理层材料
        - 高——Dye 带领公司走过最关键的商业化阶段；IPO/M&A 前离任会造成领导真空
        - 持续
        - 在接任者质量评估完成前维持放弃；60 天观察后再评估
      - - NRR 确认低于 100%（净流失）
        - 管理层披露；投资者更新；财务数据室
        - 关键——净流失意味着订阅基础在收缩；落地扩张模型失效；溢价倍数无法支撑
        - 收到财务数据室材料时
        - 立即放弃；估值逻辑取决于 NRR 高于 110%
      - - FedRAMP 授权被拒，或 2027 年后仍无限期拖延
        - FedRAMP Marketplace 状态更新；新闻稿；合同授予通知
        - 中高——联邦民用云 ARR 渠道被堵住；限制 TAM 扩张；悲观情景概率上升
        - 每半年复核 FedRAMP Marketplace 状态
        - 将目标估值下调至悲观情景区间；只有商业企业增长能抵消政府云延误时，才维持观察
      - - 出现 Zeek 重大分叉或 ICSI 商标争议
        - GitHub 分叉活动；ICSI 新闻稿；法院文件；开源社区讨论
        - 高——开源护城河是核心技术差异化；有资金支持的分叉会让底层引擎商品化
        - 通过 GitHub 和新闻按季度监测
        - 若分叉获得实质性企业采用则放弃；重新评估再进入时间线
      - - TPVG 债务契约违约或 MAC 触发通知
        - SEC EDGAR 上的 TPVG 10-Q/10-K 披露；新闻；TPVG 投资者关系
        - 高——契约违约意味着财务承压；可能加速债务偿还并损害股权回款
        - 通过 TPVG 的 SEC EDGAR 文件按季度监测
        - 放弃；升级至法律审查；立即评估 TPVG 融资条款
    notes: 终止触发项应作为二元决策闸门：一旦触发项被确认，建议不再等待额外分析，直接转为放弃。评估频率是建议的最低间隔；持续新闻监测应补充定期复核。触发项 1（安全事件）和 5（NRR 低于 100%）是无条件立即放弃触发项。
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 具体要求
      - 重要性
      - 来源 / 尽调路径
      - 优先级
    rows:
      - - 股权结构表与优先股堆叠
        - 提供完全稀释股权结构表，列出所有股份类别、期权池、认股权证覆盖，以及从 Seed 到 Series E 的清算优先权
        - 缺少优先股堆叠时，任何退出 EV 下的有效股权倍数都无法判断；2x 参与型优先股可能让基准情景下普通股持有人回款减少 30–60%
        - 公司数据室；法律顾问复核股份结构
        - 关键（P0）
      - - NRR 与总收入留存
        - 提供过去 12 个月 NRR、总收入留存，以及按客户队列和细分市场拆分的扩张与收缩
        - NRR 是判断落地扩张模型是否跑通的最重要指标；NRR 低于 110% 会触发悲观情景倍数压缩；低于 100% 则触发放弃
        - CFO 材料；审计财务；SaaS 指标仪表盘
        - 关键（P0）
      - - TPVG 风险债融资条款
        - 提供 TPVG 信贷协议、当前提款余额、利率、到期日、契约包、认股权证覆盖和 MAC 条款
        - 风险债在清算中优先于股权；MAC 契约可能在不利条件下加速偿还；认股权证稀释是在股权轮稀释之外的增量
        - 数据室中的 TPVG 信贷协议；TPVG SEC EDGAR 披露；法律顾问复核
        - 高（P1）
      - - 按细分市场和客户队列拆分 ARR
        - 提供按产品线（传感器、SaaS、托管）、客户细分（政府、商业企业、国际）和队列年份拆分的 ARR
        - 政府集中度风险（估计 30–40%）需要细分 ARR 来评估断崖风险；SaaS/云与硬件组合决定毛利率和倍数
        - CFO 材料；年度经营指标报告
        - 高（P1）
      - - Series E 条款清单——CrowdStrike 与 Cisco 信息权
        - 提供 Series E 优先股购买协议和投资者权利协议；确认 CrowdStrike Falcon Fund 与 Cisco Investments 的信息权、董事会观察员权、优先购买权（ROFR）和共同出售条款范围
        - CrowdStrike 和 Cisco 是直接竞争对手；如果其完整信息权包含 M&A 流程披露权，任何竞争性 M&A 场景都会出现利益冲突；任何上调建议前都必须由法律复核这些条款
        - Series E 交易文件；法律顾问复核投资者权利协议
        - 高（P1）
      - - FedRAMP 授权时间表与 3PAO 聘用情况
        - 提供 FedRAMP 授权里程碑计划、当前 3PAO（第三方评估机构）聘用函，以及过渡期采购载体策略（ATO、P-ATO）
        - FedRAMP 授权是联邦民用云 ARR 的关键路径；若延至 2027 年后，模型会转向悲观情景；掌握 3PAO 聘用情况可确认项目确实在推进
        - 公司管理层材料；FedRAMP PMO
        - 中（P2）
    notes: 优先级：P0（从观察上调任何建议前必须收到），P1（部署资金前必须收到），P2（IPO 或 M&A 交易完成前必须收到）。六项均为标准机构投资者尽调请求；拒绝提供任何 P0 或 P1 项都应视为负面信号，并可能触发重分类为放弃。
figures:
  - id: FO001
    title: Corelight 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Corelight 从 2013 年开源研究起点，到五轮融资、两项 Gartner 领导者认定，再到 2024 年 4 月 Series E 里程碑的路径，凸显其从学术项目转向规模化企业安全平台。
    data:
      items:
        - date: '2013'
          label: Corelight 成立——Zeek 商业化启动
          detail: 由 Vern Paxson、Robin Sommer、Seth Hall 和 Gregory Bell 在 San Francisco 创立；基于 ICSI 的 Zeek（前身为 Bro）开源网络监控器
          tone: positive
