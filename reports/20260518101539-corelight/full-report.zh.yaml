      - number: '8.5'
        title: 尽调框架：放弃触发、剩余要求与上调条件
        blocks:
          - type: paragraph
            body: >-
              如果六项具体尽调条件得到满足，且没有触发放弃条件，观察建议可以上调为买入。最重要的单一上调条件是确认 NRR 高于 115%：如果 Corelight 的净收入留存率显著低于 NDR Gartner Leader
              基准，支撑溢价倍数的扩张收入模型就会受损，建议将默认转为放弃。第二项上调条件是审查股权结构表和优先股堆叠：如果不知道五轮股权融资累积的清算优先权以及 TPVG
              认股权证覆盖，给定退出估值下的实际股权倍数无法得知。沉重的优先股堆叠（例如 2x 参与型优先股）可能意味着普通股持有人拿到的回报显著低于标题退出倍数所暗示的水平。第三项上调条件是审查 TPVG
              债务条款：必须确认未偿本金、利率、约束性条款组合和 MAC 条款，才能建模债务对退出时股权所得款的影响。报告识别出八个会立即把观察转为放弃的触发条件：（1）Corelight
              自有传感器网络发生重大安全入侵（SolarWinds 式供应链攻击），损害客户信任；（2）失去重大政府合同，尤其是 CISA 或 DoD 锚定客户；（3）确认下调估值轮的估值低于 Series E
              隐含价值；（4）CEO Brian Dye 离职且没有指定继任者到位；（5）Zeek 治理危机（重大 fork、ICSI 商标争议，或竞争对手资助 Zeek 发行版）；（6）FedRAMP
              授权被拒，或无限期延迟至 2027 年之后；（7）NRR 确认为低于 100%（净流失）；（8）Corelight 在两个或更多 Tier-1
              锚定政府账户中被竞争替代。观察上调为买入，需要全部六项尽调要求得到满意回答：股权结构表、包含 NRR 和毛利率的财务模型、TPVG 融资条款、FedRAMP 授权时间表、Series E
              条款审查（CrowdStrike/Cisco 信息权与 ROFR），以及管理层关于未来 18 个月运营计划的介绍。PeerSpot 与 Gartner Peer Insights 评论数据确认客户对
              Corelight 检测质量和部署灵活度满意，为留存逻辑提供定性确认。Insight Partners 仍在其投资组合页面列示
              Corelight，并持续参与组合公司事务，进一步说明主要机构投资人仍然投入。在收到上述六项尽调材料前，建议可执行为观察。
