        - id: financial-signal
          label: ARR 增长 40% 以上；SaaS 同比增长 300%
          detail: 公司披露；2024 年 4 月新闻稿。单一数据点；NRR 未确认。中等置信度。
          tone: neutral
        - id: investor-signal
          label: 一线投资人联合体
          detail: Accel、GC、Insight Partners、CrowdStrike、Cisco。证实退出路径有可选项。高置信度。
          tone: positive
        - id: valuation-gate
          label: 按 7–10x ARR 隐含 $1.0–1.5B
          detail: 由可比公司推断；未经确认。相对 NDR 基准不便宜，但也不算高估。
          tone: neutral
        - id: risk-gate
          label: 中高风险：TPVG 债务、NRR 未知、FedRAMP 缺口
          detail: 三项风险同时存在：风险债务、未确认 NRR、FedRAMP 授权未完成。
          tone: warning
        - id: diligence-gate
          label: 6 项待补尽调（P0：股权结构表 + NRR）
          detail: 股权结构表、NRR、TPVG 条款、ARR 拆分、Series E 条款清单、FedRAMP 时间表。
          tone: warning
        - id: track-recommendation
          label: 观察 —— 跟踪，暂不出资
          detail: 市场地位证据足以支撑高信念；估值论证证据仍不足。
          tone: neutral
        - id: buy-path
          label: 若 6 项尽调要求均得到满意解决，则买入
          detail: 上调路径：NRR >115%、股权结构表已审阅、TPVG 条款已确认、未触发否决条件。
          tone: positive
        - id: pass-path
          label: 若触发任何否决条件，则放弃
          detail: 已识别 8 项否决触发项；任一触发项都会直接转向放弃，无需进一步分析。
          tone: negative
      edges:
        - from: market-signal
          to: valuation-gate
        - from: financial-signal
          to: valuation-gate
        - from: investor-signal
          to: valuation-gate
        - from: valuation-gate
          to: risk-gate
        - from: risk-gate
          to: diligence-gate
        - from: diligence-gate
          to: track-recommendation
        - from: track-recommendation
          to: buy-path
        - from: track-recommendation
          to: pass-path
    approximationNotes: 该决策流是对建议框架的逻辑表达；它不是带概率权重的正式决策树。每个节点都概括了更详细的证据评估，后者记录在本章的章节、表格和论点中。
