  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合：五条产品线覆盖本地、虚拟、云和托管 NDR
        blocks:
          - type: paragraph
            body: >-
              Corelight 推出五条不同产品线，合力覆盖本地数据中心、虚拟化环境、云原生工作负载和全托管部署中的网络检测与响应（NDR）。旗舰产品是 Corelight Sensor，这是一种专用物理网络设备，有
              1G、10G 和 100G 吞吐量版本，设计用于接入高速企业网络链路，并产出丰富的 Zeek 遥测。物理传感器是最成熟的产品，也具备最强合规姿态，经历了最严格的企业生产验证。Corelight Virtual
              Sensor 面向无法部署物理分流的客户，支持 VMware ESXi 和 KVM 虚拟机管理程序，可部署在虚拟化数据中心和私有云中。Corelight Cloud Sensor
              面向越来越多运行在公有云环境中的企业工作负载；截至 2024–2025 年面向三大主要云厂商全部 GA 的版本，它支持 AWS VPC Traffic Mirroring、Azure vTAP 和 GCP
              Packet Mirroring。Corelight Investigator 是云交付的 SaaS Web 应用，为安全分析师提供直观的威胁调查 UI，叠加在任意 Corelight
              传感器产出的结构化日志数据之上。第五个产品 Corelight NDR Platform 是云端托管检测服务，为不想自行运营分析基础设施的组织提供持续威胁监控。这五条产品线合在一起，让 Corelight
              能服务基础设施异构的企业账户，减少客户同时维护多家供应商关系的需要，并把 Corelight 定位成全栈网络可见性方案，而非单点产品。组合中嵌入的一个关键战略选择是开放数据模型：每条产品线都导出结构化 JSON
              日志，兼容任何 SIEM 或数据湖，避免客户被锁定在专有分析格式中；这也是相对封闭 NDR 竞争对手的有意差异化。
