      - number: '8.2'
        title: 融资历史、资本结构与 TPVG 风险债披露
        blocks:
          - type: paragraph
            body: >-
              Corelight 从 Seed 到 Series E 的五轮已知融资中，累计股权融资约 $310–340M。锚定融资事件是 2024 年 4 月的 Series E：融资 $150M，由 Accel
              领投，CrowdStrike Falcon Fund、Cisco Investments 以及既有投资人 General Catalyst 和 Insight Partners 参与；PR Newswire
              新闻稿和多家一线媒体均已确认。Corelight 公司投资人页面和 Accel 投资组合页面确认了 Series E，但未披露投后估值。更早轮次包括 Series D（Insight Partners
              投资组合披露显示金额约 ~$75M，2020–2021）、Series C（General Catalyst 投资组合显示约 ~$50M，2019–2020）、Series B（约 ~$25M，2018）以及
              2018 年前的 Seed/Series A。累计股权融资估计为 $310–340M，其中 $150M 来自 Series E。股权记录之外，最值得尽调关注的披露是 TPVG 风险债头寸。TriplePoint
              Venture Growth（TPVG）是一家向成长阶段科技公司提供风险债贷款的业务发展公司（BDC）；其 2025 财年年度报告（Form 10-K，2026 年 2 月提交，覆盖截至 2025 年 12 月
              31 日期间）披露了对 Corelight, Inc. 的活跃贷款。TPVG 的 10-K 已在 SEC EDGAR 以 CIK 1580345 公开提交。风险债的存在是资本结构信号：TPVG
              向成长阶段科技公司的贷款通常利率为 9–14%，包含认股权证覆盖组件（通常为贷款面值 1–4%
              的股权认股权证），并按先付息期、后本金摊还的结构设计。在这一阶段，风险债本身既非正面也非负面——它在不稀释股权的情况下延长现金跑道——但清算时债务本金优先于股权，认股权证稀释又叠加在股权轮稀释之上。尽调必须确认：（a）TPVG
              融资额度的面值和已提款余额；（b）利率与约束性条款；（c）认股权证覆盖比例；（d）任何重大不利变化（MAC）条款 是否会因流动性事件触发；（e）截至 2026 年中，该融资额度是否已偿还或仍未清偿。SEC
              EDGAR 的 Form D 搜索确认，Corelight 有多份 Regulation D 备案，与已知股权轮次一致。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
