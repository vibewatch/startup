  - id: FV002
    title: NDR 可比公司估值倍数
    type: bar
    layout: wide
    summary: >-
      NDR 可比公司组的收入倍数显示，Corelight 隐含 7–10x 前瞻 ARR 倍数处在可观察区间中段——高于 Darktrace 上市后交易折价，低于 CrowdStrike 平台溢价。ExtraHop M&A
      交易是最相关的收购参照点，估计为 5–7x ARR。Illumio 和 Vectra AI 的私募轮倍数显示，在市场高点，政府权重较高的零信任和 NDR 细分可以拿到怎样的溢价区间。
    data:
      items:
        - label: Darktrace（上市公司，2026 年中）
          value: 5
          detail: LSE 上市；估计为 4–6x 历史 ARR；使用中点；收入规模为 Corelight 的 5–7x
          tone: neutral
        - label: ExtraHop（M&A，2022 年 7 月）
          value: 6
          detail: Arista 以 $900M 收购；交易时估计为 5–7x ARR；保守估值底部参照
          tone: neutral
        - label: Vectra AI（私募轮估计）
          value: 11
          detail: 2022 年 Series F 估计为 8–15x ARR；不确定性较高；使用中点
          tone: neutral
        - label: Illumio（私募轮，2021 年 11 月）
          value: 15
          detail: $2.75B Series F；零信任溢价；2021 年市场高点环境；14–18x ARR 中点
          tone: positive
        - label: CrowdStrike（上市平台公司）
          value: 24
          detail: NASDAQ；20–28x ARR；平台多元化溢价；不是直接 NDR 可比公司
          tone: neutral
        - label: Corelight（隐含，2026 年中）
          value: 8
          detail: 由可比分析和 Series E 背景隐含得出 7–10x 前瞻 ARR；使用中点；未经确认
          tone: positive
    approximationNotes: >-
      所有收入倍数均为分析师估计。Darktrace ARR 和市值来自截至 2026 年中的公开来源。ExtraHop 收购时 ARR 来自市场观察者估计；交易价格已确认。Vectra AI、Illumio 和 Corelight
      的私营公司财务数据未公开披露；所有数字均根据已披露融资事件、市场观察者估计和可比基准推断。
