      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Corelight 由 Zeek 的核心创建者 Vern Paxson（首席科学家）、Robin Sommer、Seth Hall 和 Gregory Bell（首席安全官兼联合创始人）于 2013
              年创立。Vern Paxson 是杰出计算机科学家，数十年来主导 Zeek 研究项目，早期在 Lawrence Berkeley National Laboratory，后来在 International
              Computer Science Institute。Paxson 拥有 UC Berkeley 博士学位，并在网络安全领域发表大量研究；这让 Corelight
              在开源网络安全社区里具备罕见的创始人—市场契合度。Robin Sommer 和 Seth Hall 在加入商业化公司前，是 Zeek 的核心提交者和架构师。2021 年，Corelight 任命 Brian
              Dye 为 CEO。Dye 来自 McAfee（后来被 Symphony Technology Group 收购并更名为 Trellix），曾任产品高级副总裁。在 Dye 领导下，Corelight
              大幅扩张商业化运营，扩展云和 AI 产品组合，并完成 $150M Series E。当前 C-suite 包括 Russ Keefe（CFO）、Julie Parrish（CMO）和 Bernard
              Brantley（CISO）。Corelight 董事会包括 Michele Bettencourt，她担任执行董事长，提供战略治理和运营监督。2026 年初，Barracuda Networks 前
              CEO、资深网络安全高管 Hatem Naguib 加入董事会，带来深厚的企业安全领导经验和 go-to-market 能力。Tenable Holdings 联合创始人、前总裁 Jack Huffard
              担任顾问，为公司的治理圈增加另一位知名网络安全人士。领导层页面还列出 Lynwen Connick 为首席信息安全官；她是资深高管，在 Australian Signals
              Directorate、Australia's Department of the Prime Minister and Cabinet 和 ANZ Banking Group 等机构有超过 40
              年网络安全经验。关键人风险分两层：Vern Paxson 是底层 Zeek 技术的智识创始人，其名字几乎等同于 Zeek 和网络安全研究；Brian Dye 是商业 CEO，定义了公司当前的
              go-to-market 策略。公司治理完全处于私有状态，没有公开披露义务。
