      - number: '4.2'
        title: 定价机制与 GTM：按传感器的企业模式，不公布价目表
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年，Corelight 不发布公开价目表。所有商业档位都走企业直销，需要联系销售团队报价。基于产品页面、合作伙伴案例和投资人公告中的公开信息，Corelight
              的商业结构有三条定价轴。第一，硬件设备定价与传感器吞吐能力挂钩，SKU 面向 1 Gbps、10 Gbps、25 Gbps 和 100 Gbps
              环境。第二，订阅软件按传感器或部署定价，年度合同价值随吞吐量、检测库档位，以及 Encrypted Traffic Collection 或 Smart PCAP 等可选附加功能变化。第三，面向 AWS 和
              Azure 环境的云传感器定价基于实例类型和数据吞吐量，形成一个近似用量的元素，随客户云规模扩大而增长。企业合同通常把三层打包进一份年度或多年期协议，并常带多年折扣表。CrowdStrike、Mandiant 和
              Cisco Investments 既是战略投资方，也是技术伙伴，形成一个渠道维度：Corelight 传感器可被转售，或嵌入合作伙伴 SOC
              产品。这个战略合作渠道虽然没有专有数据难以量化，但很可能贡献一部分可观的新客户。GTM
              更偏大型企业和联邦政府账户，支撑更高平均合同价值，同时也意味着更长销售周期，收入可能集中在更少的大客户手中。公开审阅材料未确认任何订阅档位的标价，因此实际 ASP、折扣水平和真实企业经济性仍未确认。
