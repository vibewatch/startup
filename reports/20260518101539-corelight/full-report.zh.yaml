      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Corelight 已在五轮公开披露融资中累计募资约 $310–340M，是市场上资本最充足的纯 NDR 公司之一。融资历史体现了强投资人信心，核心锚点是 Accel：它既领投首轮 Series A，也领投最近的
              Series E；对长期平台价值而言，这是一种少见背书。Series A 于 2017 年 7 月完成，规模 $9.2M，由 Accel 领投，为 Zeek
              衍生技术的大规模商业化提供了最初机构资金。General Catalyst 于 2018 年 9 月领投 $25M Series B，推动产品开发和早期企业 go-to-market。Insight
              Partners 于 2019 年 10 月领投约 $50M Series C（公司更名前曾名为 BroAla），资金用于显著扩张团队并推进产品成熟。2021 年 Series D 金额未披露，市场估计约
              $75M，为强劲企业需求下的全球运营和工程扩张提供资金。标志性事件是 2024 年 4 月 30 日的 Series E：Accel 领投 $150M，Cisco Investments 和
              CrowdStrike Falcon Fund 战略跟投。这一轮的意义不止在规模，也在于它代表的战略绑定——Cisco 和 CrowdStrike
              同时是战略投资人、技术合作伙伴和潜在竞争者，形成复杂的多维关系，尽调必须细看。Accel 合伙人 Arun Mathew 解释第五次领投的理由，是
              Corelight「异常强劲的企业牵引力、经过实战检验的开源技术和满意的客户」。Corelight 未公开披露当前估值。公司没有公开交易证券，也没有在 EDGAR 上可确认的 SEC Form D
              文件，这与其作为私营公司、并未通过标准零售证券发行渠道融资的状态一致。累计融资估计为 $310–340M。
