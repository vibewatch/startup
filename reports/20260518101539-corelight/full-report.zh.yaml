      - number: '7.4'
        title: 人才与执行风险：关键人物集中、人才市场和领导梯队
        blocks:
          - type: paragraph
            body: >-
              Corelight 的人才风险集中在两个人身上；二者离开会以不同方式显著影响公司轨迹。CEO Brian Dye 于 2021 年加入，并带领 Corelight 走过最激进的增长阶段：他在 2024 年 4
              月完成 $150M Series E 融资，引入 CrowdStrike 和 Cisco 作为战略投资人，推动公司同时获得 Gartner Magic Quadrant Leader 与 Forrester
              Wave Leader 评级，并搭建了企业级商业化组织。若 Dye 离职且没有成熟继任者，公司会在最关键的商业化阶段出现领导真空——Corelight 正接近潜在流动性事件（IPO 或
              M&A），此时发生高管交接，会给投资者关系、客户留存和 M&A 谈判筹码带来风险。联合创始人兼首席科学家 Vern Paxson 是 Zeek 发明者，也是公司的技术可信度锚点。Paxson
              在网络安全研究社区有深厚声望，发表过网络流量分析和被动测量方面的奠基论文。他若离开或减少参与，会削弱 Corelight 与开源社区的关系、学术研究可信度，以及吸引顶级安全工程师的能力；这些工程师部分是为与
              Zeek 发明者共事而加入。网络安全人才市场结构性紧张：深度网络协议专长、安全领域 ML 应用能力和系统编程技能（传感器固件所需 C/C++、Zeek 脚本语言）的工程师需求显著高于供给。Corelight
              争夺人才的对手包括超大规模云安全团队（Google Mandiant、Microsoft Security、Amazon AWS Security）、资金充足的纯安全竞争者（Vectra
              AI、ExtraHop/Arista、Darktrace），以及提供安全许可绑定职业路径的政府承包商（Booz Allen、Palantir）。与拥有离岸工程中心的竞争者相比，San Francisco Bay
              Area 的工程成本基础是结构性逆风。除 Dye 和 Paxson 外，截至 2026 年中，Corelight 没有公开披露 CTO 角色，这构成治理缺口：公司缺少公开具名
              CTO，可能意味着职位空缺，也可能是在领导层公告前有意不披露，两种情况都值得尽调。2026 年聘请 Hatem Naguib（前 Barracuda Networks
              CEO）进入董事会，是治理深度的正面信号，但不能解决运营执行风险。执行风险还包括联邦销售扩张的难度：政府采购周期为 12–36 个月，需要具备安全许可的销售人员，并依赖尚未完成的 CMMC 与 FedRAMP
              合规里程碑。若不能按计划获得 FedRAMP 授权，销售团队将被迫拉长管线周期，或放弃联邦云机会。
            claimRefs:
