      - number: '8.3'
        title: 可比公司分析：NDR 上市公司、M&A 交易和私营基准
        blocks:
          - type: paragraph
            body: >-
              Corelight 的估值必须放在一组审慎选择的 NDR 邻近可比对象中理解，这组对象覆盖公开市场、私募融资和 M&A 交易。最直接可比的上市公司是 Darktrace（London Stock
              Exchange: DARK），它于 2021 年 4 月 IPO，峰值估值约 ~$5B；截至 2026 年中，市值约 $3.5–4.5B，基于估计 $700–900M ARR，大致对应 4–6x 过去十二个月
              ARR。Darktrace 是 AI 原生网络与邮件安全平台，在企业 NDR 分部与 Corelight 有显著重叠；其公开交易倍数为 Corelight 隐含估值提供最低风险可比，尽管 Darktrace
              收入规模约为 Corelight 估计 ARR 的 5–7x。最相关的 M&A 交易是 Arista Networks 于 2022 年 7 月以 $900M 收购 ExtraHop。ExtraHop
              是网络检测与性能分析平台，收购时估计 ARR 为 $130–180M，隐含 5–7x ARR 收购倍数。ExtraHop 交易由战略收购方（Arista）在低于市场峰值的倍数下完成，为 Corelight 的
              M&A 参考点提供了保守下限。Illumio 是微分段和零信任网络公司，2021 年 11 月以 $2.75B 估值完成 $225M Series F，当时估计 ARR 为 $150–200M（约 14–18x
              ARR）。Illumio 并非纯 NDR 可比，但其政府占比较高的企业安全定位和溢价倍数说明，当监管顺风足够强时，零信任网络安全供应商可以拿到高于 NDR 的倍数。Vectra AI 是 AI 驱动的 NDR
              供应商，2022 年完成 Series F，估值未披露；市场观察者估计为 $1.5–2.5B，对应约 ~$150M 估计 ARR 的 8–15x。若 Corelight 在 $120–150M 估计 ARR
              运行率下隐含估值 $1.0–1.5B，则对应 7–10x 前瞻倍数，处在 NDR 私募轮参考区间中部，低于 Illumio 溢价。结论是，相对 NDR 可比对象，Corelight
              并未估得过高，但也不便宜：如果没有确认的 NRR、利润率和增长耐久性数据，可比组支持观察，而不是买入。
