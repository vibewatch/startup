      - number: '2.5'
        title: 竞争市场结构与定位
        blocks:
          - type: paragraph
            body: >-
              NDR 市场呈现中度分散的竞争结构：几家资金充足的纯 NDR 厂商并存，大型安全平台公司也在加速进入。2025 年 Gartner Network Detection and Response Magic
              Quadrant 将 Corelight 评为领导者，并把它放在象限右上方，代表愿景完整性和执行能力。Gartner NDR MQ 中的其他厂商包括 ExtraHop（2021 年被 Arista
              Networks 收购并更名为 Reveal(x)）、Darktrace、Vectra AI 和 Cisco Secure Network Analytics（原 Stealthwatch）。2023 年
              Forrester Wave for Network Analysis and Visibility 也将 Corelight 评为领导者。纯 NDR 竞争组可拆分如下：ExtraHop/Arista
              Reveal(x) 是 Corelight 最直接的企业竞争者，提供硬件和云传感器平台，具备基于 ML 的检测和强企业销售能力，如今背靠 Arista 的网络基础设施分销；Darktrace 以 AI /
              无监督学习的行为 NDR 路线竞争，拥有更广泛的企业和中端市场足迹，但在可解释性和告警疲劳上面临质疑；Vectra AI 专注 AI 驱动的网络和云检测，与 AWS/Azure
              深度集成，在云原生环境中竞争；Stamus Networks 是规模较小、接近开源的竞争者（建立在 Suricata 之上），面向偏好开放 NDR 基础的安全成熟组织，最直接地冲击 Corelight
              的开放核心定位。来自 Cisco、Microsoft、CrowdStrike 的平台打包威胁性质不同：这些厂商把网络遥测作为更广泛 XDR、SIEM 和端点安全平台中的一个功能，可能替代预算敏感买家的独立
              NDR，因为这些买家已经持有平台合同。不过，Corelight 靠 Zeek 的深度协议分析、70,000+ 签名、MITRE ATT&CK
              覆盖和开源社区信任形成差异化，大平台厂商很难原生复制。Corelight 作为 Zeek
              项目托管方形成开放核心护城河，提供类似专有优势，却没有单一供应商锁定顾虑；正是这种顾虑，推动受监管行业和政府买家选择开放方案。Corelight 的合作伙伴协议也影响竞争格局：CrowdStrike 和
              Mandiant 都在 MDR 项目中把 Corelight 作为首选 NDR 平台，在顶级安全服务层形成难以复制的分销护城河。
