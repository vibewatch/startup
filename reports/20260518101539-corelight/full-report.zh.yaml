          - type: callout
            title: 开源依赖风险：Zeek 与 Suricata 的漏洞暴露面
            body: >-
              由于传感器核心依赖 Zeek 和 Suricata 开源项目，上游一旦发现任何关键漏洞，Corelight 就有义务迅速为其企业客户群修补并分发更新后的传感器二进制文件。上游 CVE
              披露与企业补丁部署之间的滞后是可管理但真实的风险，尤其是在软件更新需要额外审批周期的隔离联邦环境中。
