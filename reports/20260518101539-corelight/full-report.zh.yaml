  - id: FU001
    title: Corelight 企业客户旅程图
    type: journey-map
    layout: wide
    summary: >-
      七阶段客户旅程，从最初认知 Corelight
      到长期扩张，覆盖企业商业买家和美国政府买家的不同路径。政府买家的采购周期更长，合规要求更严（FedRAMP、安全许可），切换成本更高。企业商业买家评估推进更快，但需要与打包替代方案做竞品比拼。两条路径都在生产部署处汇合，并通过云传感器和
      SaaS 增购继续扩张。
    data:
      items:
        - id: journey-item-awareness
          label: 发现路径
          description: >-
            主要发现渠道：Gartner/Forrester 分析师报告、Black Hat NOC 背书、CrowdStrike/Mandiant IR 团队的同行转介、Dark Reading / 安全媒体，以及 Zeek
            开源社区。企业和政府买家通过安全从业者社区、Dark Reading / SC Magazine 报道、Gartner MQ 和 Forrester Wave 报告、IR 项目中的 CrowdStrike 与
            Mandiant 转介，或 Corelight 企业销售团队直接触达，发现 Corelight。
          tone: neutral
        - id: journey-item-evaluation
          label: PoC 与竞品比拼
          description: >-
            30–90 天、可远程部署的 PoC；PeerSpot 评价确认设置摩擦很低；竞品评估对象包括 ExtraHop、Darktrace、Vectra、Cisco。政府路径还要增加 FedRAMP
            和合规审查。PeerSpot 评价者确认 PoC「直接且容易，通常可远程处理」，降低了评估摩擦。
          tone: neutral
        - id: journey-item-procurement
          label: 采购 / 合同
          description: 企业采购（大客户 3–9 个月）、法务和安全审查、MSA 签署。由于 FAR/DFARS 合规要求、RFP 流程和预算授权周期，政府采购会延长到 6–18 个月。合同结构为年度或多年订阅。
          tone: neutral
        - id: journey-item-production
          label: 生产价值兑现
          description: >-
            在生产网络分段全面部署传感器；调优 Zeek 和 Suricata 规则；集成 SIEM（Splunk、Microsoft
            Sentinel、Chronicle、QRadar）。部署后价值包括：全网威胁可见性、SIEM 增强、IR 提速（声称 95%）、平台稳定性获得高评价。CSM + TAM 模式加深售后参与。Black Hat NOC
            确认其在对抗条件下有韧性。
          tone: positive
        - id: journey-item-expansion
          label: 先落地再扩张打法
          description: >-
            三层扩张路径：面向混合 / 云工作负载的云传感器（2024 年 SaaS YoY 增长 300%）、面向分析师工作流的 Investigator
            SaaS、随网络增长进行吞吐量升级。多年续约配合吞吐量层级升级，为新业务单元或新地区追加传感器部署，并逐步增加 Investigator 席位。NRR 估计为 115–130%。
          tone: positive
  - id: FU002
    title: Corelight 获客与部署漏斗
    type: funnel
    layout: standard
    summary: 五阶段获客漏斗，从总可用市场到生产部署和扩张，展示每个阶段的估计转化率和主要摩擦点。政府和大型企业买家周期更长、资格门槛更高；MSSP 渠道会为下游客户压缩阶段。
    data:
      items:
        - id: funnel-tam
          label: 总可用市场
          value: 10000
          detail: >-
            拥有网络安全监控预算、并具备运行 NDR 平台技术成熟度的大型企业（1,000+ 员工）、政府机构和 MSSP。Corelight 的高成熟度买家画像，使有效 TAM 小于整体 NDR 市场。（全球约 10,000
            家企业有 NDR 预算。）
          tone: neutral
        - id: funnel-awareness
          label: 认知 / 管线
          value: 2500
          detail: >-
            通过 Gartner/Forrester 报告、分析师问询、Black Hat NOC 背书、CrowdStrike/Mandiant 伙伴转介、安全会议曝光和直接外呼销售触达的组织。（估计每年触达约
            2,000–3,000 个账户。）
          tone: neutral
        - id: funnel-poc
          label: 概念验证
          value: 500
          detail: >-
            组织部署 30–90 天 PoC。PeerSpot 评价者确认远程部署摩擦低。政府路径因合规审查拉长 PoC 时间线。该阶段与 ExtraHop、Vectra、Darktrace 做竞品比拼。（估计每年约
            400–600 个 PoC。）
          tone: neutral
        - id: funnel-close
          label: 初始合同签约
          value: 150
          detail: 新增企业和政府客户。平均合同价值：企业 $200K–$500K，政府 $500K–$1M+。偏好多年合约；政府合同可能是 3–5 年期采购工具。（估计每年约 100–200 个新 logo。）
          tone: positive
        - id: funnel-expand
          label: 扩张 / 增购 NRR
          value: 120
          detail: >-
            云传感器附加、Investigator SaaS、吞吐量升级、新业务单元覆盖。每个账户内都有三层扩张路径。2024 年 SaaS YoY 增长 300% 证明激活率。（NRR 估计 115–130%；此处以中点
            120% 表示。）
          tone: positive
