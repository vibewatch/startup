      - number: '5.3'
        title: 关键检测能力：ETA、ML 分析、Smart PCAP 与 MITRE 覆盖
        blocks:
          - type: paragraph
            body: >-
              Corelight 提供分层检测能力组合，同时覆盖现代企业 SOC 运营所需的协议可见性广度和行为分析深度。Encrypted Traffic
              Analysis（ETA）是最具战略意义的能力之一：Corelight 不解密会话内容，而是从 TLS 握手中提取密码套件元数据、证书链细节、JA3/JA3S
              指纹和行为特征，从而识别可疑加密通信模式——包括命令与控制通道、恶意软件信标通信和异常证书使用——同时保留数据隐私，避开完整 TLS 拦截带来的法律和性能复杂性。Smart PCAP
              提供选择性全包捕获：它不是持续存储数 TB 的 PCAP 文件，而是在检测事件触发捕获窗口时才记录完整数据包，以少得多的存储成本提供 PCAP 级取证细节。Domain Generation
              Algorithm（DGA）检测识别使用算法生成域名作为命令与控制会合点的恶意软件，这类规避技术可绕过静态黑名单。命令与控制（C2）流量检测结合基于 ML 的信标通信分析、Suricata 签名和 Zeek
              协议元数据，标记对手基础设施通信。横向移动检测跟踪与凭证窃取、pass-the-hash、Kerberoasting 和基于 SMB 的穿越一致的内部网络行为。文件分析能力包括对通过已观测协议传输的每个文件进行
              SHA256 哈希和 MIME 类型识别，默认不存储文件内容，也能创建可搜索的文件传输清单。平台声称覆盖超过 80 个 MITRE ATT&CK 战术、技术和程序（TTPs），并内置超过 70,000
              条开箱即用检测签名。公司声称的性能基准包括事件响应速度提升 95%、相较替代方案实现 4:1 工具整合，但这些说法尚未被独立审计。Black Hat 大会 NOC 部署以及
              Mandiant/CrowdStrike 合作关系，在高保真、高流量环境中提供了非正式性能证明点。
