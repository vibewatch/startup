              Corelight 同时在 2025 年 Gartner Network Detection and Response Magic Quadrant 和 2023 年 Forrester Wave for
              Network Analysis and Visibility 中处于领导者位置；这是该类别最权威的两套分析师框架。双领导者称号为企业采购团队选择 NDR
              平台提供最强第三方验证，实际上降低了评估周期中的竞争风险。
