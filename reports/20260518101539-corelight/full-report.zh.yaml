      - number: '8.6'
        title: 证据展项
        blocks:
          - type: callout
            title: 双重分析机构领导者地位（Gartner MQ + Forrester Wave）是罕见且耐久的商业护城河
            body: >-
              截至 2026 年中，Corelight 是唯一同时拥有 Gartner Magic Quadrant Leader 和 Forrester Wave Leader 地位的独立纯 NDR
              供应商。这一双重排名直接加速商业化：企业采购团队会基于这些称号筛选供应商，而连续多个周期维持两项地位，证明产品和商业化耐久性。Accel 和 Insight Partners
              的投资组合决策都明确引用了这一分析机构领导地位。
            calloutType: strength
            claimRefs:
              - CV001
              - CV004
              - CV019
          - type: callout
            title: TPVG 风险债带来隐藏股权稀释和清算优先风险
            body: >-
              TPVG 2025 年 10-K（SEC EDGAR）披露的 TPVG 风险债，在清算事件中优先于所有股权。叠加前五轮股权融资累积的清算优先权，给定退出价格下普通股持有人的实际股权价值可能显著低于标题
              EV。任何高于观察的投资建议之前，审查优先股堆叠和债务条款都是绝对前置条件；必须把它们放入三种估值情景中，计算每一类股份的实际股权回报。
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV037
          - type: callout
            title: NDR 市场饱和是主要下行风险：XDR 与 SIEM 捆绑威胁定价
            body: >-
              DarkReading 2025 年对 NDR 竞争格局的分析明确指出，SIEM 和 XDR 平台供应商（CrowdStrike、Microsoft Sentinel、Palo Alto
              Cortex）正在把网络遥测捆绑进更广泛的安全运营平台许可证，压低独立 NDR 供应商的定价伞。Corelight 的开源 Zeek 差异化和政府集中度可以缓释这一风险，但悲观情景关键取决于 Corelight
              的扩张动作能否顶住商业企业中的平台捆绑逆风。
            calloutType: risk
            claimRefs:
              - CV005
              - CV031
              - CV036
          - type: callout
            title: 异常高质量的投资人辛迪加，暗示退出路径和战略溢价潜力
            body: >-
              Accel（一线增长股权）、General Catalyst、Insight Partners、CrowdStrike Falcon Fund 和 Cisco Investments
              的组合，形成了一个既验证增长股权逻辑（Accel/GC/IP）、又释放战略收购兴趣信号（CrowdStrike、Cisco）的投资人辛迪加。两家具备收购能力和信息权的直接战略投资人同时存在，使战略溢价退出的概率不容忽视——尽管这也带来了第
