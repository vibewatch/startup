      - number: '4.3'
        title: 单位经济：需求代理信号强，财务指标信号弱
        blocks:
          - type: paragraph
            body: >-
              公开证据提供了有意义的需求质量代理信号，但不足以闭合单位经济模型。需求端，Corelight 2024 年 4 月披露的 40%+ ARR 增速显示经常性收入动能强。AI 和 SaaS 驱动解决方案增长
              300%，说明毛利最高的产品线扩张速度远快于整体基盘，结构上具备吸引力。Gartner Magic Quadrant 到 2025 年仍把它列为 NDR 类别 Leader，提供第三方需求可信度；Gartner
              Peer Insights 客户评价也确认企业满意度，与高净留存率相符。估算毛利率时，收入结构是主驱动。规模化纯订阅软件在 NDR/SaaS 安全领域通常有 80–85% 毛利率；硬件设备为
              40–55%；专业服务为 20–35%。按约 80/15/5 的结构混合，组合毛利率约为 73–80%。不过，Corelight 硬件设备毛利取决于组件供应和制造 COGS，公开资料未披露。基于 Gartner
              Leader 级 NDR 厂商的行业基准，净留存率估计为 115–130%，与 Corelight 的先落地、再扩张模式和战略伙伴转介绍渠道一致。CAC、销售周期长度和回本周期在公开来源中完全不可得。员工数约
              470 人（基于截至 2026 年的 LinkedIn 和招聘页面信号），按每人 $200,000 全包成本计算，工资和薪酬运行率约 $94M/年。加上云基础设施、硬件
              COGS、办公场地和其他运营成本，估计总烧钱速度为 $120–180M/年，即 $10–15M/月。该估计不确定性很宽，应视为方向性底线，而非精确数字。
