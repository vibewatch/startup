      - number: '3.3'
        title: 功能与定价对比
        blocks:
          - type: paragraph
            body: >-
              Corelight 最持久的产品差异化，在于协议解析深度和取证证据质量。Corelight 拥有 400+ 个网络协议解析器，源自 Zeek 数十年的开源开发，能产出结构化、分析师可读的网络日志；依赖流量流或纯
              ML 检测的竞争者难以复制。开放数据模型把日志导出为开放格式，兼容 Splunk、Elastic、CrowdStrike Falcon、Microsoft Sentinel、Kafka 以及任何 SIEM
              或数据湖，从而消除专有锁定，让安全团队完整拥有自己的网络遥测。Corelight 提供超过 70,000 条开箱即用检测签名，覆盖 80 多项 MITRE ATT&CK
              战术、技术和流程，并在结构化元数据优势之外同时提供基于签名和 AI 驱动的检测。Corelight 面向 AWS、Azure 和 GCP 的 Cloud
              Sensor，把深度包检测和协议解析延伸到云工作负载；多数竞争者在云中只能提供浅层流级可见性。

              竞争功能差距在加密流量分析中最明显：Corelight 无需解密 TLS/SSL 会话，就能借助 JA3/JA4 指纹和 TLS 证书分析生成丰富元数据；Cisco SNA
              等基于流的竞争者在架构上无法匹配。ExtraHop 和 Darktrace 通过不同机制提供可比的加密流量分析，分别依赖被动线速数据捕获和 Self-Learning AI 模式检测。Vectra AI 针对
              Azure 环境提供强云原生加密流量分析。OT/ICS 覆盖维度更有利于 Darktrace（专门的 Darktrace/OT 产品线）和 Corelight（面向 DNP3、Modbus 等的 Zeek ICS
              协议解析器），Cisco SNA 和 Vectra AI 在 OT 深度上落后。

              NDR 市场定价以订阅为主，通常按网络吞吐容量（捕获 Mbps 或 Gbps）、传感器数量或站点数量计量。没有 NDR 厂商公开披露标价；企业合同根据部署范围和支持层级谈判。行业分析师估计，企业 NDR
              平台交易每年在 $200,000 至 $2+ million。Corelight 传感器可作为物理硬件设备、虚拟传感器以及主要 IaaS 平台的云传感器提供。Stamus Networks
              代表最具商业破坏性的定价模式，采用单一许可证结构，不按用户或集成另收费。Microsoft M365 E5 以约 $57 / 用户 / 月打包网络遥测和 SIEM；对 M365
              标准化企业来说，增量成本接近零，也是独立 NDR 正当性面临的最尖锐定价挑战。
