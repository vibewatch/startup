  - id: TI003
    title: 单位经济模型表
    columns:
      - 指标
      - 数值 / 状态
      - 置信度
      - 重要性
      - 尽调要求
    rows:
      - - ARR（年度经常性收入）
        - 截至 2026 年初估计为 $100M–$150M（按增长率外推）
        - 低
        - SaaS 业务的核心规模信号；决定收入质量和估值倍数
        - 要求提供经审计的 ARR 明细，或由管理层确认的季度 ARR 桥接表。
      - - ARR 增长率
        - '>40% 同比增长，2024 年 4 月已确认（公司表述）'
        - 中
        - 增长率决定远期收入估计，也是公开财务信号中最可靠的一项
        - 确认 2025–2026 年增长率是维持、加速还是放缓。
      - - SaaS / AI 收入增长
        - '>300% 同比增长，2024 年 4 月已确认（公司表述）'
        - 中
        - 显示增长最快、利润率可能最高的分部；支撑收入结构切换假设
        - 要求提供 SaaS 专项 ARR 明细及按产品线划分的毛利率。
      - - 毛利率（综合）
        - 估计 73%–80%（由收入结构 × 分部基准推导的模型值）
        - 低
        - 核心盈利能力指标；硬件 / 服务组合会把综合毛利率压低到纯 SaaS 之下
        - 披露按收入流划分的 COGS（订阅软件、硬件 COGS、PS 人力）。
      - - 净收入留存率（NRR）
        - 估计 115%–130%（行业基准估计；未披露）
        - 低
        - 决定经常性收入韧性；最重要的 SaaS 质量指标
        - 提供客户队列留存数据，以及按客户层级划分的过去 12 个月 NRR。
      - - 客户获取成本（CAC）
        - 未披露
        - 不可得
        - 企业 NDR 销售周期长；CAC 决定资本效率和回本周期
        - 要求按分部（企业、中型市场、联邦、渠道）提供 CAC，需包含渠道成本。
      - - CAC 回本周期
        - 未披露
        - 不可得
        - 评估增长投入是否具备资本效率的关键指标
        - 用 CAC 和毛利率输入推导；要求提供漏斗转化和销售配额数据。
      - - 月度烧钱率
        - 估计 $10M–$15M/月（按员工数建模）
        - 低
        - 决定资金续航期充足性和下一轮融资时点
        - 要求提供月度现金消耗桥接表；用资金管理数据核对。
      - - 客户数量
        - 未披露；提及 Fortune 500、政府机构和大型大学
        - 低
        - 客户数量和 ARR 分布决定集中度风险和扩张空间
        - 提供客户数量、前 10 大客户 ARR 集中度和流失率。
    notes: >-
      本表中的 null 值和估计值是有意标出的尽调障碍，不是格式缺口。所有估计均来自公开增长信号、NDR 行业基准和基于员工数的建模。Corelight 作为私营公司不披露财务指标；截至 2026 年 5
      月，也没有独立第三方财务审计机构或评级机构公开覆盖 Corelight 财务。
