  - id: TM001
    title: NDR 市场定义与相邻品类图谱
    columns:
      - 细分市场
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Corelight 的相关性
    rows:
      - - 网络检测与响应（NDR）
        - 企业 NDR 平台许可；云传感器；SaaS NDR 订阅；NDR 专业服务和部署
        - 端点检测（EDR）；边界防火墙；没有行为分析的 IPS；纯网络性能监控
        - CISO（经济买方）；SOC 主管（技术方）；CFO/CRO（审批方）
        - 核心市场 — 主要竞争场
      - - 网络分析与可视化（NAV）
        - 更广义网络可视化工具，包括数据包捕获、NPM，以及与 NDR 重叠的行为分析
        - NDR 专用行为检测引擎
        - IT 运营；网络运营；共用预算的安全团队
        - 相邻 / 融合 — Forrester 使用 NAV 框架
      - - 扩展检测与响应（XDR）
        - 聚合端点、身份、云和网络遥测的平台套件；XDR 原生网络传感器
        - 纯 SIEM/SOAR；没有网络遥测的独立 UEBA
        - CISO；整合工具的平台安全买方
        - 相邻 / 逆风 — Cisco、Microsoft、CrowdStrike 的平台捆绑风险
      - - 更广义网络安全
        - 网络安全设备、防火墙、WAF、ZTNA、微分段、NAC
        - NDR 专用检测和调查产品
        - 网络 / IT 基础设施负责人；CISO 作为预算审批方
        - 仅作 TAM 背景 — Corelight 不在这里直接竞争
      - - OT / ICS 网络安全
        - 工业控制系统网络监控；OT/IT 融合工具；SCADA 流量分析
        - 没有 OT 协议支持的企业 IT 网络监控工具
        - OT 安全工程师；CISO；工厂 / 运营经理
        - 相邻 / 增长 — Zeek OT 协议解码器提供差异化切入点
    notes: >-
      不同分析师对市场范围定义不一。MarketsandMarkets、Mordor Intelligence 和 Grand View Research 的定义略有差异，可能纳入或排除托管 NDR 服务、OT
      网络监控和云原生网络遥测。Corelight 覆盖 NDR 核心市场，并借助 Zeek 工业协议支持切入 OT 相邻市场。XDR 捆绑这一行反映了独立 NDR TAM 扩张在中期面临的最实质逆风。
