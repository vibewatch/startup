  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与来源：订阅为主，硬件和服务构成长尾
        blocks:
          - type: paragraph
            body: >-
              Corelight 的收入模式由三条清晰来源构成，共同组成 Open NDR Platform 的商业化产品组合。主导来源是订阅软件，估计占总收入 80%。订阅收入来自 Corelight
              传感器软件的年度或多年期许可（基于 Zeek 的协议解析器和检测集合，运行在客户自有硬件或虚拟机上）、面向 AWS 和 Azure 环境的云传感器订阅，以及 Corelight SaaS
              分析和管理层访问权限。订阅模式按传感器或数据吞吐量档位定价，企业客户通常谈判多年期协议。第二条收入来源估计约占 15%，是硬件设备销售。Corelight
              销售实体网络传感器，作为专用设备部署在客户本地；这类收入是资本性采购而非经常性收入，因此硬件结构变化会让季度确认出现波动。第三条来源估计占 5%，是专业服务——面向企业账户的部署协助、威胁狩猎项目和培训。2024
              年 4 月 Series E 新闻稿确认 ARR 同比增长超过 40%，AI 和 SaaS 驱动的 NDR 解决方案同比增长 300%；这意味着
              SaaS/云传感器部分的增速显著高于整体业务。开源核心模式下，Zeek 免费，但 Corelight
              的商业检测库、协议解析器和云分析需订阅解锁，天然形成先落地、再扩张的动作。客户往往先从本地传感器开始，随后逐步加入云传感器和 SaaS 管理层，推动净留存率；行业可比公司显示，领先 NDR 平台的净留存率通常高于
              115%。
