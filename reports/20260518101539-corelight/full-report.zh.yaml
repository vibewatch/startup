      - number: '4.4'
        title: 资本充足性：$150M Series E 加 BDC 债务，估计 20–30 个月现金跑道
        blocks:
          - type: paragraph
            body: >-
              Corelight 在 2024 年 4 月 Series E 之后的资本结构包括约 $310–340M 的累计股权融资（从种子轮到 Series E 五轮），另有来自 TriplePoint Venture
              Growth BDC Corp（TPVG）的风险债。TPVG 截至 2024 年 12 月 31 日期间的年度报告于 2025 年 3 月 5 日提交 SEC，列出 Corelight, Inc.
              为组合公司，确认债务融资是 Corelight 资本结构的一部分。TPVG 是一家业务发展公司（BDC），提供风险贷款，利率通常在 10–16%
              区间，以公司资产作担保，并带财务维持契约。债务层存在，对尽调很重要，因为这意味着 Corelight
              的有效资本结构比股权融资新闻稿显示的更复杂：债务服务和契约合规会增加现金流义务，而这些不会出现在新闻稿中。股权侧，$150M Series E 由 Accel 领投，Cisco Investments 和
              CrowdStrike Falcon Fund 参与。Series E 当时披露的资金用途是产品扩张、GTM 扩大和工程团队增长。基于估计每月 $10–15M 的烧钱速度和 $150M 融资，Series E
              后现金跑道从 2024 年 4 月起约 20–30 个月，估计耗尽窗口在 2025 年 12 月至 2026 年 10 月之间，前提是不计收入增长。如果 ARR 以 40%+
              增长，收入贡献会显著延长自给时间，但在当前增长投入阶段，业务几乎肯定尚未实现现金流为正。Series F 时点将取决于增长轨迹、市场环境，以及 TPVG 债务工具是否能在股权轮次之间提供足够过桥资本。
