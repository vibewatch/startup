      - number: '2.2'
        title: 市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              多份独立分析师报告交叉指向：2024 年 NDR 市场规模为 $3.0–3.4 billion，2028–2030 年前瞻预测落在 $6.5 billion 至 $9.0
              billion。MarketsandMarkets 估计 2024 年 NDR 市场约 $3.1 billion，并将在 2029 年增至约 $7.5 billion，CAGR 为
              19.2%；驱动因素包括网络攻击复杂度提升、企业基础设施快速数字化、监管合规要求增长。Mordor Intelligence 另有报告估计 2024 年 NDR 市场约 $3.0 billion，至 2029 年
              CAGR 为 15.4%，达到约 $6.5 billion，是分析师区间下限。Grand View Research 的独立自下而上模型预测 2024 年市场为 $3.4 billion，至 2030 年增长到约
              $8.5 billion，CAGR 约 20%；这一更高估计反映其纳入了托管 NDR 服务收入。三套独立视角给出的加权中心估计，是 2024 年 NDR 支出约 $3.1–3.2 billion，2028
              年中心预测约 $7.0–7.5 billion，隐含 17–18% CAGR。这是 NDR 特定市场的 SAM 估计。更广义 TAM 定义为 NDR 争夺预算的所有企业网络安全工具，包括网络性能监控、NAV 和
              XDR 网络遥测；按 IDC 估计，全球网络安全设备和软件合计超过 $25 billion，但 IDC 的定义范围更宽。Corelight 的可获取市场（SOM）估计 2024 年为
              $300–500M，反映其在纯开放 NDR 厂商中的领导位置、企业客户焦点（Fortune 500 和政府，而非 SMB），以及当前 ARR 轨迹。从视角 1（MarketsandMarkets）看，NDR
              市场增长足以支撑多个资金充足的竞争者，同时为 Corelight 在规划期内迈向 $500M+ ARR 提供可信路径。从视角 2（Mordor Intelligence）看，即便采用 15% CAGR
              的保守估计，市场到 2031 年也接近翻倍，形成持久的长期机会。各分析师的 CAGR 估计在 15% 至 25% 之间，差异来自定义口径（纯 NDR vs. NAV vs. 广义网络安全）和地理范围假设不同。
