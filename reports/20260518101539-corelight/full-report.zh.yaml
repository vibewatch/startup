              Corelight 的产品架构在每个企业账户内自然形成三条增购路径：云工作负载增长带来云传感器加购，Investigator SaaS 进入分析师工作流，网络流量增加后推动吞吐量档位升级。Series E
              新闻稿中宣称的 SaaS 同比增长 300%，证实这套扩张机制已经在规模化运行。
