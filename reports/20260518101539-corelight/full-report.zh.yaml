    title: 投资决策逻辑
    type: flow
    layout: wide
    summary: 投资决策逻辑从四类核心证据——市场地位、财务信号、估值背景和风险评估——一路映射到条件门槛；这些门槛决定建议是买入、观察还是放弃。当前状态为观察，等待 6 项待补尽调问题解决；每个门槛都列出未满足即转向放弃的具体条件。
