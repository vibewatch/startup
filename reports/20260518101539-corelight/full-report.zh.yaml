  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私营公司指标
      - 对承销的影响
      - 确切尽调路径
    rows:
      - - 2025 或 2026 年已确认 ARR
        - 无法验证 40%+ 增长是否延续；远期收入预测带有推测性
        - 要求提供管理层确认的 ARR 桥接表，或 2024–2025 年经审计财务报表。
      - - 按收入流划分的毛利率
        - 硬件 / 服务组合压低综合毛利率；没有分部 COGS 就无法建模盈利路径
        - 要求按订阅软件、硬件 COGS、PS 人力和云基础设施拆分 COGS 瀑布。
      - - 按客户队列划分的净收入留存率
        - 落地扩张假设依赖 NRR；若 NRR 低于 110%，会实质削弱商业模式叙事
        - 提供按客户层级和产品线划分的过去 12 个月 NRR；总留存和扩张需分开列示。
      - - 按分部划分的 CAC 与回本周期
        - 企业 NDR 销售周期长；没有 CAC 数据，增长投入的资本效率无从判断
        - 要求提供销售漏斗指标、配额达成率，以及按分部（企业、中型市场、联邦、渠道）划分的 CAC。
      - - TPVG BDC 贷款条款和约束条款
        - BDC 贷款带有财务维持型约束条款；违反约束条款会对流动性和股权价值构成重大影响
        - 要求提供 TPVG 贷款协议、未偿本金、利率、到期日和任何修订历史。
      - - 截至 2026 年的月度烧钱率和现金余额
        - 没有当前现金余额，就无法评估资金续航期充足性和 Series F 时点
        - 要求提供截至最近季度末的现金报表；提供董事会批准的资金续航情景。
      - - 客户数量和 ARR 集中度
        - 收入集中在少数大客户，是企业 SaaS 的标准风险
        - 披露客户总数、按十分位划分的 ARR，以及前 10 大客户集中度百分比。
    notes: >-
      这七个缺口，是把一个基于公开证据的研究章节转成可投资财务模型所需的最低私有数据请求。缺少任何一项，都会留下实质承销空洞；七项全缺，则意味着财务章节虽然能说明收入模型，但不足以支撑最终投资信念。这里列出的每个缺口都有明确核验路径，管理层配合并提供标准
      数据室文件即可完成。
    claimRefs:
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
  - id: TE001
    title: Corelight 产品模块与资产矩阵
    columns:
