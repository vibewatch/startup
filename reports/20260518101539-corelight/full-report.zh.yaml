      - number: '6.2'
        title: 增长与采用轨迹：ARR 扩张和 SaaS 加速
        blocks:
          - type: paragraph
            body: >-
              Corelight 的增长轨迹锚定在 2024 年 4 月 Series E 数据点：ARR 同比增长超过 40%，AI 和 SaaS 驱动的 NDR 解决方案同比增长
              300%。这些数字由公司声称，未经独立审计验证，显示两个并行增长驱动。第一，新客户获取：在估计 NRR 为 115–130% 的情况下，现有账户内自然扩张会贡献 15–30 个百分点的 ARR 增长，剩余
              10–25 个百分点需要由新增客户解释。第二，产品结构扩张：SaaS 和云传感器组件相对整体业务增长明显更快，说明随着组织把工作负载迁移到 AWS、Azure 和 GCP，现有本地传感器客户正在增加云和 SaaS
              层，无需竞争性替换就能自然增购。获客漏斗通过三条渠道运转：（1）面向 Fortune 500 和政府账户的企业直销，通常包括售前工程概念验证和数月采购周期；（2）来自 CrowdStrike
              Falcon、Cisco XDR 和 Mandiant 事件响应服务的渠道伙伴转介，这些服务把 Corelight 嵌入为网络检测层，并有效把 Corelight 暖介绍给伙伴的企业客户基础；（3）MSSP
              渠道，MSSP 在其客户组合中规模化部署 Corelight。Zeek 开源社区提供补充性的认知和转化渠道，尤其面向大学和国家实验室账户。PeerSpot
              评论显示部署摩擦较低——“简单容易，很多部署可远程完成”——这支持直销动作中的高效客户上线和快速实现价值。SEC 文件中的 TriplePoint Venture Growth BDC 债务工具为 ARR
              规模足以支持机构风险债提供独立确认，并与 300–500 个企业客户、$200K–$500K ACV 的客户基础相符。
