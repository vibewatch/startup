    rows:
      - - 混合 / 多云采用制造网络盲区
        - +
        - 当前 – 2028
        - 高
        - 传统传感器看不到云 VPC / 工作负载流量；这会拉动云原生 NDR 传感器需求 — Corelight 增长最快的细分市场
        - Corelight 2025 年 ARR 中，云传感器部署与本地部署各占多少？云传感器续约率是多少？
      - - 勒索软件 / 高级持续性威胁扩散
        - +
        - 当前
        - 极高
        - 入侵事件驱动采购，网络取证成为必需证据；行业事件浪潮之后，NDR 采用通常在 12–18 个月内上升
        - Corelight 新客户收入中，有多少是事件后的被动采购，多少是主动合规？
      - - 零信任要求（CISA、NIST、E.O. 14028）
        - +
        - 当前 – 2027
        - 高
        - 联邦和受监管行业的合规时间线明确要求网络流量分析；在政府细分市场形成接近确定的近期需求
        - Corelight 政府 ARR 中有多少比例由零信任强制要求驱动？FedRAMP 授权状态如何？
      - - AI/ML 增强的攻击复杂度
        - +
        - 2025 – 2028
        - 中–高
        - AI 生成的多态威胁绕过签名检测；行为型 NDR 检测变成刚需；Corelight 的 AI Triage 产品卡位这一驱动因素
        - Corelight 的 AI/ML 检测能力与 Darktrace 的无监督学习或 Vectra AI 平台相比如何？
      - - XDR 平台捆绑（Cisco、Microsoft、CrowdStrike）
        - –
        - 2025 – 2028
        - 中–高
        - XDR 平台打包网络遥测，可能让预算敏感买家改用平台内置 NDR；Corelight 自身战略投资方带来直接竞争威胁
        - Cisco 和 CrowdStrike 作为投资方，其竞争行为受哪些合同保护约束？相较 Cisco XDR 的竞争胜率是多少？
      - - SOC 分析师人才短缺
        - –
        - 当前
        - 中
        - 削弱团队落地复杂网络监控的能力；可能利好 MSSP / 托管 NDR；若没有自动化，独立企业 NDR 采用可能受压
        - Corelight 为缓解 SOC 人手约束，在自动化、AI Triage 和 MDR 合作伙伴上做了哪些投入？
      - - 安全工具整合 / 工具蔓延疲劳
        - –
        - 2024 – 2026
        - 中
        - CISO 正在压缩供应商数量；NDR 必须证明可量化 ROI 和工具整合收益（Corelight 声称 4:1 比例）
        - 有多少独立验证案例研究支撑 Corelight 的 4:1 工具整合主张？
      - - 监管合规需求（GDPR、HIPAA、PCI-DSS、NERC CIP）
        - +
        - 当前
        - 中
        - 受监管行业对网络取证数据的强制要求，带来持久、非可选的 NDR 需求
        - Corelight 持有哪些合规认证？FedRAMP、ISO 27001、SOC 2？
    notes: >-
      方向（+）表示推动 NDR 需求净增长；（–）表示抑制或替代需求的逆风。时点反映估计中对购买行为影响最大的时期。幅度评级为定性判断，基于 NIST SP 800-207、CISA Zero Trust Maturity
      Model、Verizon DBIR 2024、IBM X-Force 2025 和 CrowdStrike Global Threat Report 2025 数据。尽调问题列出投资者应在管理层会议中追问的具体问题。XDR
      捆绑这项逆风评级高于常规水平，因为 Cisco 和 CrowdStrike 同时是 Corelight 的投资方和平台竞争对手。
