      - number: '5.7'
        title: 图表
        blocks:
          - type: callout
            title: 开放数据模型是战略差异点
            body: >-
              Corelight 在架构上选择把所有网络证据暴露为开放 JSON 日志，而非专有格式，这给它在重视数据主权的企业买家和已投入 SIEM 的安全团队中带来持久竞争优势。Corelight 委托 ESG
              进行的研究发现，在集成灵活性和 SOC 生产力上，开放 NDR 路径优于封闭黑盒替代方案。
            calloutType: strength
            claimRefs:
              - CE032
              - CE040
          - type: callout
            title: 托管 Zeek 创造协议覆盖护城河
            body: >-
              作为 Zeek 开源项目的主要资金支持方和代码贡献方，Corelight 拥有协议解析路线图的特权访问权，并能比任何基于同一开源基础、却没有直接项目影响力的竞争对手早几天到几周交付商业检测能力。400+
              协议解析器库和 Zeek Community ID 标准是这条护城河的具体体现。
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE037
              - CE039
          - type: callout
            title: FedRAMP 授权缺口在完成前限制联邦收入
            body: >-
              截至 2026 年中，Corelight 的 FedRAMP 授权仍在推进中。授权完成前，联邦民事机构客户无法按其标准 FedRAMP 采购要求部署 Corelight
              的云交付产品，从而限制来自美国联邦细分市场的云交付 NDR 收入；考虑到 Corelight 的 LBNL 和政府研究血统，这原本是其历史强势市场。
            calloutType: risk
