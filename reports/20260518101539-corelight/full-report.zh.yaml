        - 开放 NDR 传感器（硬件 / 虚拟 / 云）、Corelight Investigator UI、检测、集成
        - 每年 $200K–$2M+（企业估计；无公开标价）
        - 取证深度和开放模型支撑溢价定价；无公开标价；吞吐量分层是标准做法
      - - ExtraHop RevealX
        - 订阅（按吞吐量）
        - 按捕获 Gbps / 每资产 / 每地点；年度
        - RevealX 360（NDR + NPM 统一）；云传感器；威胁情报源
        - 企业规模下与 Corelight 相当（未验证）
        - NPM + NDR 捆绑可能比纯 NDR 拿到更高价格；Arista 产品组合可能促成基础设施打包交易
      - - Darktrace
        - 订阅（按环境规模）
        - 按员工数或网段规模；年度
        - NDR + 邮件 + OT 模块；包含自主响应（Antigena）
        - 每年 $150K–$500K+（分析师估计）
        - 平台覆盖广，支撑溢价，但也形成平台依赖；AI 不透明限制 IR 重度团队采用取证工作流
      - - Vectra AI
        - 订阅（按资产 / 吞吐量）
        - 按资产或分析 Gbps；年度
        - Cognito Detect + Recall + Stream；AI 攻击信号情报模块
        - 每年 $100K–$500K+（分析师估计）
        - Azure / Microsoft 集成可能推动 M365 客户偏好；在云优先企业评估中与 Corelight 竞争
      - - Stamus Networks
        - 单一许可证 + 订阅
        - 探针和中央服务器使用单一许可证；无按用户或按集成收费
        - Clear NDR 探针 + Centric 管理服务器；包含所有 API 访问、集成和用户
        - $50K–$200K（估计；政府 / 公共部门常见）
        - NDR 中最具颠覆性的商业模式；单一许可证消除按用户壁垒；强烈吸引政府和开源导向买家
      - - Cisco SNA（Stealthwatch）
        - 捆绑 / 订阅
        - 按 Cisco 网络节点或 Cisco 企业协议附加项
        - NetFlow 行为分析；Cisco SecureX 集成；威胁情报源
        - 大型 Cisco 客户近零增量成本；独立采购 $100K–$300K（估计）
        - 在 Cisco 重度账户中有定价优势；实质上由 Cisco 企业协议补贴；独立 ROI 弱
      - - Palo Alto Cortex XDR
        - 按端点 + 模块化订阅
        - 按端点 / 每 TB 分析量；年度；模块化
        - XDR 平台：端点 + 网络 + 云；NDR 作为组件；AI-XSIAM 叠加层
        - 企业规模完整 XDR 平台 $500K–$2M+（估计）
        - NDR 是更大 XDR 交易中的一个功能；适合聚焦整合的买家；网络深度低于端点
      - - Microsoft Defender / M365 E5
        - 捆绑在 M365 E5 订阅中
        - 按用户每月（M365 E5 约 $57/user/month）；年度承诺
        - 端点 + 邮件 + 网络遥测 + Sentinel SIEM + Entra 身份；完全捆绑
        - M365 E5 订阅客户近零增量成本（仅 NDR 组件）
        - NDR 中最具冲击力的定价；E5 订阅客户零增量成本，让 Microsoft 客户很难在经济上证明独立 NDR 合理
    notes: >-
      定价数据基于截至 2026 年的分析师综合、厂商文档和行业从业者报告。除 Microsoft 外，没有 NDR 厂商公开披露标价。受议价折扣、平台捆绑和战略合作伙伴关系影响，企业合同经济性与标价差异很大。Corelight
      定价只能通过直销接洽获得。Microsoft M365 E5 按用户定价来自 Microsoft 公开价格页面。所有非 Microsoft 区间都是分析师共识的方向性估计，仅供尽调定位，不代表合同价格。
