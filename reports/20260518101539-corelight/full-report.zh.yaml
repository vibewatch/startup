      - number: '6.5'
        title: 扩张驱动因素与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Corelight 在现有账户里的主要扩张抓手有四个：（1）客户把工作负载迁到公有云后，传感器从物理部署升级到云部署；（2） Investigator SaaS
              进入分析师工作流，带来按席位或按分析师订阅的增长；（3）客户网络流量增长后，吞吐量档位升级；（4） 拥有多个数据中心的大型企业账户继续覆盖新的业务单元或地理区域。这些机制从结构上支撑净留存率（NRR）高于
              100%，也给先落地再扩张的 ARR 增长模型创造条件。集中度风险同样明显。按中型企业合同估计 $200K–$500K、大型政府和 Fortune 500 账户 $1M+ 计算，前 10–20
              个账户很可能贡献了过高份额——可能达到总 ARR 的 30–50%。任何一个大型政府合同不续约，或一个重要 Fortune 500 账户转向 Cisco、CrowdStrike 或 Microsoft
              的捆绑方案，都可能显著冲击单季收入。政府板块集中度（约占 ARR 的
              30–40%）尤其值得关注，因为政府采购周期受预算授权波动、持续决议下的支出约束，以及项目取消的政治风险影响。另一个负面信号是价格和复杂度门槛：G2 与 PeerSpot 评论显示，没有深厚 Zeek
              专长的买方会认为 Corelight 相比替代品更贵、更复杂，也就是说可服务客户群被压缩到成熟度较高的安全买方。SMB 与中型企业里的总可用市场因此被封顶，Corelight
              的客户基础也集中在大型企业和政府层级，在这些层级里价格异议不那么决定成交。CrowdStrike、Cisco 和 Mandiant
              的渠道策略通过分散获客漏斗部分缓解了集中度风险，但合作伙伴渠道的深度没有公开量化，仍是尽调事项。
