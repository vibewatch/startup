            title: 未披露 Fortune 500 或政府具名案例——最大客户证据缺口
            body: >-
              Corelight 虽称 Fortune 500
              和政府机构是核心客户分部，却没有发布任何商业企业客户的具名案例；政府客户名称也因涉密或保密限制未披露。尽调必须依靠间接代理证据（分析师评论、同行平台、合作伙伴公告），而不是来自公开营销管线的直接客户访谈。
            calloutType: risk
            claimRefs:
              - CU030
              - CU036
          - type: callout
            title: 政府收入集中度（约占 ARR 的 30–40%）带来预算风险
            body: >-
              美国政府板块估计贡献 Corelight ARR 的 30–40%，单个合同可能超过每年 $1M。政府采购受持续决议支出约束、预算授权波动以及 FedRAMP
              授权进度（当前仍在进行中）影响，可能拖慢政府云部署扩张。任何一个大型政府合同不续约，都可能显著冲击单季收入。
            calloutType: risk
            claimRefs:
              - CU009
              - CU030
          - type: callout
            title: CrowdStrike 与 Mandiant 渠道扩大实际客户触达
            body: >-
              CrowdStrike Services 和 Mandiant（Google Cloud Security）在企业事件响应项目中嵌入 Corelight NDR，等于把 Corelight 带进这些顶级 IR
              公司服务的大型企业和政府机构环境——Corelight 不必直接管理这些客户关系。叠加 Cisco XDR 与 CrowdStrike Falcon 集成后，这条渠道把 Corelight
              可触达的企业范围扩展到远超直接销售来源账户数。
            calloutType: insight
            claimRefs:
              - CU010
              - CU017
              - CU022
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：FedRAMP、出口管制、GDPR、CMMC 和开源许可证
        blocks:
          - type: paragraph
            body: >-
              Corelight 的监管与法律风险主要落在五类活跃暴露上，每一类的重要性和缓释成熟度都不同。最直接的商业风险是 Corelight 云平台尚未完成 FedRAMP 授权。FedRAMP（Federal Risk
              and Authorization Management Program，美国联邦风险与授权管理计划）是美国政府强制采用的云安全授权框架；如果没有出现在 FedRAMP Marketplace
              的授权名单上，民用联邦机构就不能采购云托管的 Corelight Investigator 或 NDR Platform 服务。截至 2026 年中，Corelight 的 FedRAMP
              授权状态仍为“进行中”，尚未获批。鉴于政府客户估计贡献 Corelight ARR 的 30–40%，且联邦民用云市场快速增长，这一缺口直接限制可触达收入。物理本地传感器仍可在涉密和敏感环境中不依赖
              FedRAMP 部署，但 SaaS 和托管平台产品受到约束。FedRAMP 流程资源消耗很重——通常需要 12–24 个月和数百万美元合规投入——且结果不能保证。美国商务部工业与安全局（BIS）执行的
              Export Administration Regulations（EAR，出口管理条例）下，出口管制风险对网络安全监测技术具有实质性影响。带有基于 ML
              行为分析的网络安全工具，可能被归入出口管制分类号（ECCN）4E001 或 5E002 类别，向特定司法辖区出口时需要许可证。Corelight 聚焦政府板块，包括情报界和 Five Eyes
              合作伙伴关系，这带来必须主动管理的双用途分类风险。此外，任何可访问最敏感分析源代码或已训练模型权重的国际人员，都可能触发 ITAR/EAR 下的视同出口考量。欧盟总部客户部署也存在 GDPR 风险，因为 Zeek
              生成的网络日志可能包含 IP 地址、DNS 查询内容和 HTTP 头，这些都可能构成 GDPR 第 4 条下的个人数据。如果 Corelight
              的云基础设施在处理欧盟个人数据时缺少充分的数据处理协议、标准合同条款（Standard Contractual Clauses）或符合 Schrems II
              的传输机制，就可能面临欧盟数据保护机构的监管行动。CCPA 对 SaaS 场景中处理的加州居民数据提出平行义务。Corelight 的开源许可证合规风险集中在三类组件：Zeek（BSD
              3-Clause，宽松许可证）、Suricata（GPL v2，copyleft/传染性开源）以及各类第三方包。Suricata 的 GPL v2 传染性开源要求，任何与 Suricata
              链接后分发的软件都必须遵守 GPL v2 的源代码披露要求。Corelight 在其传感器软件中把 Suricata 作为嵌入式分析引擎发布；如果传感器固件包含与 GPL v2 库链接的自研 ML
              代码，许可证合规缺陷可能使 Corelight 面临 Open Information Security Foundation（OISF，Suricata 所有者）的版权索赔。Zeek 商标——“Z and
              Design” 标志和 ZEEK 商标——归 International Computer Science Institute（ICSI）所有，并通过商标许可协议授权给 Corelight。这形成了法律依赖：如果
              Corelight 与 ICSI 因许可条款发生争议，Corelight 可能失去在产品和营销材料中使用“Zeek”的权利，被迫对其核心技术资产进行昂贵且破坏性的品牌重塑。该风险发生概率低，但严重性高。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
