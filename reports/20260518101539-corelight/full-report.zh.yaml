      - number: '5.4'
        title: 集成与合作伙伴生态：SIEM、XDR 与开放导出
        blocks:
          - type: paragraph
            body: >-
              Corelight 的集成策略围绕一个原则：网络证据应该流入客户现有安全栈，而不是要求分析师采用 Corelight 专有控制台。Splunk 市场上的 Corelight for Splunk
              应用打包预构建仪表盘、关联搜索和 sourcetype 配置，把 Zeek 日志直接摄入 Splunk Enterprise 或 Splunk Cloud，让分析师能用熟悉的 SPL
              查询，在端点和身份遥测旁边分析网络证据。Microsoft Sentinel 通过专用数据连接器集成，把 Zeek 日志字段映射到 Azure Monitor 日志架构，支持 Sentinel 原生环境中的
              KQL 分析和 MITRE ATT&CK 工作簿。Corelight 2024 年一篇博客称，Sentinel 集成把 Corelight 的高保真网络证据与 Sentinel 的 AI
              驱动分析结合起来，可支持更聪明的告警分诊，并减少分析师疲劳。Google Chronicle 集成为使用 Google 安全栈的组织提供云原生 SIEM 路径。IBM QRadar 支持通过 Device
              Support Module（DSM）提供，使 Corelight 日志能在 QRadar 中规范化。Elasticsearch、Kibana 和 OpenSearch 可作为直连导出目标，服务运营开源 SIEM
              栈的客户。Apache Kafka 支持面向数据湖、SOAR 平台和自定义分析流水线的高吞吐日志流。CrowdStrike Falcon 集成在 CrowdStrike 对 Corelight
              的战略投资加持下，提供 API 驱动的富化，把 Corelight 的网络会话证据与 CrowdStrike Falcon
              平台的端点进程和威胁遥测关联起来，让分析师能从可疑网络连接跳转到发起连接的具体端点进程。2024 年宣布的 Cisco XDR 集成把 Corelight 高保真网络证据送入 Cisco 的扩展检测与响应平台，把
              Corelight 传感器网络作为 Cisco AI 驱动关联引擎的遥测来源。这些合作意味着 Corelight 传感器不只是独立 NDR 工具，也在多个更大安全平台中充当基础网络证据层。
