  - id: FV003
    title: Corelight 分情景估值区间
    type: range
    layout: wide
    summary: >-
      三种情景估值区间展示了 Corelight 投资的非对称性：在当前隐含估值下，乐观情景（IPO 或溢价
      M&A，$1.5–2.0B）较基准情景（$1.0–1.5B）上行有限；悲观情景（$600–800M）和降价轮情景（$200–400M）相对 Series E
      价格则有实质下行。区间拉得很宽，不是伪精确，而是真不确定：ARR、NRR 和优先股堆叠未确认，任何给定 EV 下的有效权益倍数都无法精确计算。
    data:
      items:
        - label: 降价轮情景
          low: 200
          mid: 300
          high: 400
          displayValue: $200M–$400M
          detail: 重大负面事件（安全事件、合同流失、NRR 崩塌）；在大幅收缩的基数上约 3–4x ARR
          tone: negative
        - label: 悲观情景
          low: 600
          mid: 700
          high: 800
          displayValue: $600M–$800M
          detail: NDR 饱和 + FedRAMP 失败 + 增长放缓；4–6x ARR
          tone: warning
        - label: 基准情景
          low: 1000
          mid: 1250
          high: 1500
          displayValue: $1.0B–$1.5B
          detail: 35–40% 增长可持续；2027–2028 年 M&A 或后期老股交易；7–10x ARR
          tone: neutral
        - label: 乐观情景
          low: 1500
          mid: 1750
          high: 2000
          displayValue: $1.5B–$2.0B
          detail: 取得 FedRAMP 授权；NRR >125%；IPO 或战略 M&A 溢价；10–14x ARR
          tone: positive
    approximationNotes: >-
      情景边界是分析师估计，依据是可比公司分析和公开财务信号。Corelight 未确认任何数字。降价轮情景假设发生重大负面事件，而这不是当前基准情景预期。各情景中的 ARR 区间从 2024 年 4 月 Series E
      背景外推，并向前套用 40% 以上同比增长。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: 投委会 KPI 评分卡
    type: kpi
    layout: wide
    summary: IC KPI 评分卡汇总了可投资性的关键维度：市场、验证、护城河、经济性、风险、估值和证据质量。评分卡凸显强市场和产品证据（高置信度）与薄弱财务透明度和估值证据（低置信度）之间的非对称，也因此建议为观察而非买入。
    data:
      items:
        - label: 建议
          value: TRACK
          detail: 中等置信度的观察；若 6 项尽调问题解决，可上调至买入
        - label: 隐含 EV
          value: $1.0–1.5B
          detail: 由可比分析推断；7–10x 前瞻 ARR；公司未确认
        - label: 市场地位评分
          value: 9 / 10
          detail: Gartner + Forrester 双重分析师领导者；NDR 开源护城河质量最高；政府客户锚点强
        - label: 财务证据评分
          value: 3 / 10
          detail: 仅披露 ARR 增速；NRR、毛利率、CAC、烧钱速度均未确认；TPVG 债务未偿
        - label: 估值支撑评分
          value: 5 / 10
          detail: 倍数处在可比区间内但不便宜；优先股堆叠未知；隐含 EV 为推断值，未经确认
        - label: 风险评分
          value: 6 / 10 (medium-high)
          detail: TPVG 债务、FedRAMP 缺口、NRR 未知、Cisco/CrowdStrike 冲突风险；政府客户集中
        - label: 退出准备度评分
          value: 7 / 10
          detail: 投资人质量显示公司在为 IPO/M&A 做准备；时间表未确认；战略收购方可能有兴趣
        - label: 证据质量
          value: Medium
          detail: 市场和分析师证据强；财务和估值证据弱；6 项待补尽调
    approximationNotes: 评分是分析师给出的 1–10 定性评分，用于本章内部比较。它们衡量的是可得证据的质量和完整度，不是对公司的绝对排名。财务证据评分偏低，是因为私营公司数据缺位，而非任何已确认负面发现。
