  - id: TE002
    title: Corelight 工作流与用例表
    columns:
      - 用户任务
      - 未使用 Corelight 的当前工作流
      - Corelight 方案
      - 可衡量收益（公司声称）
      - 限制 / 缺口
    rows:
      - - SOC 威胁检测与分诊
        - SIEM 告警审查缺少网络上下文；分析师在割裂工具之间手动切换排查
        - Zeek 日志流接入 SIEM / Splunk；Investigator 的 AI 分诊降低噪声
        - 事件响应提速 95%（公司声称）；4:1 工具整合（公司声称）
        - 两项说法均为自报；没有独立审计；收益取决于基线成熟度
      - - 事件响应与取证
        - 大规模 PCAP 捕获带来巨量存储需求；事后覆盖存在缺口
        - Smart PCAP 仅在检测触发时记录完整数据包；结构化日志默认提供会话上下文
        - 显著降低存储成本；为触发事件保留取证保真度
        - Smart PCAP 触发配置需要调优；漏检就会丢失 PCAP 窗口
      - - 威胁狩猎（主动）
        - 威胁猎手针对端点日志编写自定义 SIEM 查询，网络遥测有限或缺失
        - 结构化 Zeek 日志支持 JA3/JA3S 指纹、DNS 异常狩猎、协议行为分析
        - 可测试仅靠端点遥测无法验证的网络层假设
        - 狩猎效果取决于分析师对 Zeek 日志的熟悉程度；培训要求不低
      - - 云工作负载可见性
        - 云原生工作负载不向 SIEM 产出网络遥测；横向移动存在盲区
        - Cloud Sensor 通过云厂商镜像 API 捕获 VPC / vNet 流量；应用同一套 Zeek 分析
        - 无需部署硬件即可补上云环境网络可见性缺口
        - 云厂商镜像 API 有吞吐上限；出口流量成本会在规模化后增加每 GB 成本
      - - 监管合规与审计
        - 审计所需数据包证据靠手工采集；合规团队依赖防火墙日志，而应用层细节有限
        - 协议级日志捕获用于 HIPAA、PCI-DSS、NERC CIP 审计轨迹的应用交易（HTTP、DNS、SMTP）
        - 更丰富的网络审计轨迹降低手工取证工作量
        - SOC 2 和 ISO 27001 覆盖 Corelight 自身安全状态；云交付的 FedRAMP 仍在推进中
    notes: >-
      标注“公司声称”的可衡量收益来自 Corelight 营销材料和新闻稿；没有一项经第三方审计机构独立验证，也没有带具体基线和结果数据的公开案例研究。95% 更快 IR 和 4:1
      整合数字，在披露方法和客户级证据前，应视为愿景型基准。
    claimRefs:
      - CE011
      - CE012
      - CE033
      - CE034
      - CE039
  - id: TE003
    title: Corelight 技术与运营架构表
    columns:
      - 层 / 组件
      - 在平台中的角色
      - 关键依赖
      - 风险
    rows:
      - - Zeek 协议分析引擎
        - 核心数据包解析和日志生成；400+ 协议解析器产出结构化 JSON 日志
        - Zeek 开源项目（由 Corelight 托管）；需要 C++ 和 Zeek 脚本语言能力
        - Zeek 上游漏洞会触发传感器补丁义务；若 Vern Paxson 减少参与，会带来关键人物风险
      - - Suricata IDS 引擎
        - 与 Zeek 并行运行的签名式威胁检测层；匹配已知威胁模式
        - Suricata 开源项目（OISF）；社区签名和 ET Pro 商业数据源
        - 签名新鲜度要求及时更新威胁情报数据源；双引擎处理增加 CPU 负载
      - - ML 异常检测模型
        - 行为分析层，检测 DGA、C2 信标通信、横向移动和协议异常
        - Corelight 自有 ML 模型；训练数据来自客户同意的遥测
        - 模型架构未公开记录；检测质量无独立基准测试；存在模型漂移风险
      - - Smart PCAP 子系统
        - 由检测事件触发的选择性全数据包捕获；相比常开 PCAP 降低存储
        - 本地传感器存储或客户 NFS / SAN；触发规则由 SOC 团队配置
        - 漏检意味着这些会话没有 PCAP；触发器配置错误会降低取证覆盖
      - - Cloud sensor VPC 镜像层
        - 通过 AWS / Azure / GCP 厂商 API 捕获云工作负载流量；输入同一套 Zeek 分析管线
        - 云厂商 VPC Traffic Mirroring、Azure vTAP、GCP Packet Mirroring API
        - 厂商 API 变更或弃用可能打断传感器；吞吐上限限制大规模覆盖
      - - 数据导出与集成层
        - 将结构化 JSON 日志转发至 SIEM、数据湖或 SOAR；Apache Kafka 用于流式传输
        - 客户 SIEM（Splunk、Sentinel、Chronicle、QRadar、Elasticsearch）和 Kafka 基础设施
        - SIEM 摄取管线故障会造成日志缺口；客户自管 SIEM 基础设施不在 Corelight 控制范围内
      - - Corelight Investigator SaaS 管理平面
        - 云交付调查 UI 和传感器管理；AI 分诊与关联分析
        - Corelight 云基础设施（AWS 或 GCP）；传感器到管理平面的互联网连接
        - 管理平面对互联网的依赖，可能与隔离部署要求冲突
    notes: >-
      架构细节由产品文档、博客文章、GitHub 仓库以及行业对基于 Zeek 的 NDR 平台的描述重建。Corelight 未公开发布详细技术架构文档。ML
      模型层尤其不透明——检测模型架构、训练数据来源、版本策略和误报率都未公开披露。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE010
      - CE011
      - CE012
      - CE013
      - CE032
