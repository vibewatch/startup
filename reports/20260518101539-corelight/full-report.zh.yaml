              Corelight 托管 Zeek 开源项目，提供主要资金支持、代码贡献和社区治理，因此形成结构性竞争复制壁垒。政府和受监管行业买家偏好基于开源的方案，因为它们带来审计透明度和供应商退出弹性；这让基于 Zeek
              的开放 NDR 成为最大交易规模、最高留存细分中的优先采购路径。
