      - number: '8.4'
        title: 情景估值分析：乐观、基准与悲观情景及关键假设
        blocks:
          - type: paragraph
            body: >-
              估值情景分析构建三种情景，并用市场倍数、ARR 增长率、收入规模和退出路径区分。所有情景都以未来 12 个月 ARR 估计 $130–160M 作为基础财务指标，这与 2024 年 4 月 Series E
              时估计 $90–120M ARR 基线之上 40%+ YoY 增长相一致。乐观情景（企业价值 $1.5–2.0B）假设：（a）Corelight 在 2026–2027 年以高于 NDR 可比组的溢价完成 IPO
              或战略 M&A 退出；（b）FedRAMP 授权完成，释放有意义的联邦民用云 ARR；（c）NRR 确认为 125%+，与 Gartner Magic Quadrant Leader 基准一致；（d）NDR
              TAM 按分析师预测高端扩张；（e）战略收购方竞争（CrowdStrike、Cisco、Microsoft）形成竞价动态。乐观情景倍数为 10–14x 前瞻 ARR，与 Illumio 2021 年 Series
              F 一致，高于 ExtraHop 2022 年 M&A 倍数；政府集中度和开源护城河溢价可支撑该倍数。基准情景（企业价值 $1.0–1.5B）假设：（a）2027–2028 年完成 M&A
              退出或后期老股交易；（b）FedRAMP 授权延迟 12–18 个月；（c）NRR 确认为 110–120%，与 NDR 行业基准一致；（d）TPVG
              风险债被再融资或偿还，对股权所得款没有重大影响；（e）SIEM/XDR 平台捆绑没有造成有意义的竞争性替代。基准倍数为 7–10x 前瞻 ARR。悲观情景（企业价值
              $600–800M）假设：（a）CrowdStrike、Microsoft 和 Cisco 原生捆绑网络遥测，NDR 市场饱和加速；（b）先落地再扩张动作放缓，Corelight ARR 增长降至 20% YoY
              以下；（c）FedRAMP 授权在 2027 年前未完成，联邦云渠道受阻；（d）下调估值融资动态迫使估值重置；（e）TPVG 债务在低增长环境中造成约束性条款压力。悲观倍数为 4–6x 前瞻 ARR，与
              Darktrace 上市后低增长 NDR 供应商折价交易区间一致。DarkReading 对竞争动态的分析记录的 NDR 市场饱和风险，是悲观情景的主要驱动因素：如果 SIEM 和 XDR
              平台把网络遥测商品化，独立 NDR 供应商的定价伞会被实质性压缩。
