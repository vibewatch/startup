      - number: '4.5'
        title: 财务缺口与尽调要求：私有指标阻碍承销判断
        blocks:
          - type: paragraph
            body: >-
              Corelight 仍是私营公司，公开记录让大多数具有财务重要性的输入要么未确认，要么完全缺失。最关键的缺口包括：（1）截至 2025 年底或 2026 年初的实际 ARR——40%+ 增长说法来自 2024 年
              4 月，之后没有披露确认增长是加速、维持还是放缓；（2）按收入来源拆分的毛利率——硬件设备和专业服务毛利率在结构上不同于软件订阅毛利率，向 SaaS
              的结构迁移可能改善或拖累混合毛利率，取决于成本结构；（3）按客户队列的 NRR——先落地、再扩张的经济性是 NDR 商业模式核心，但仍未确认，NRR 下移会实质削弱收入质量叙事；（4）CAC 和回本周期——面向
              Fortune 500 公司和政府机构的企业销售动作意味着销售周期长、获客成本高，但没有公开代理；（5）BDC 债务条款——TPVG
              贷款本金、利率、契约组合和到期安排未披露，实际债务服务义务仍不透明；（6）烧钱速度和现金跑道——$10–15M/月估计来自模型，需要现金头寸确认。缺少这六个数据点，仅凭公开证据无法给出严谨的财务承销结论。现有财务证据指向一个高增长、高质量、处于早期订阅规模的收入模式——但如果没有管理层提供的财务数据，未披露的契约压力、烧钱加速或增长放缓风险都不能排除。
