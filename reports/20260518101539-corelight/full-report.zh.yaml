  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 当前值 / 状态
      - 影响
      - 尽调要求
    rows:
      - - 累计股权融资额
        - 约 $310M–$340M，共五轮（种子轮至 Series E）
        - 资本底座较厚，说明公司能承受多年投资周期
        - 确认每轮准确融资额、清算优先权和参与型股份类别。
      - - Series E 融资（2024 年 4 月）
        - $150M，由 Accel 领投；Cisco Investments 和 CrowdStrike Falcon Fund 参投
        - 提供运营资金续航期的主要流动性事件；资金用途未完全说明
        - 确认资金投放计划，以及是否存在基于里程碑的分批拨款结构。
      - - TPVG BDC 风险债
        - 已由 TPVG SEC 10-K 确认（截至 2024 年 12 月 31 日期间）；金额未披露
        - BDC 债务利率高于银行债（10%–16%），通常包含财务约束条款
        - 披露贷款本金、利率、到期日、约束条款组合和提前还款条款。
      - - 估计月度烧钱率
        - $10M–$15M/月（按员工数建模估计；未确认）
        - 按中位数 $12.5M/月计算，若不计收入抵消，$150M Series E 可提供约 12 个月总资金续航期
        - 要求提供月度 P&L、现金消耗桥接表和董事会批准的资金续航情景。
      - - Series E 资金对应的估计续航期
        - 自 2024 年 4 月起 20–30 个月，假设收入抵消加速（即基准情景下约到 2025 年底至 2026 年中）
        - 如果增长强劲，现金流盈亏平衡或 Series F 可能已经进入视野
        - 提供最新资金管理仪表盘、截至 2026 年 Q1 的现金余额和下一轮融资触发里程碑。
      - - Series E 资金计划用途
        - 产品扩张、商业化扩张和工程团队扩编（公司披露意图）
        - 符合成长阶段投资逻辑；投放计划仍不清楚
        - 要求提供与里程碑挂钩的预算，以及截至 2025 年 Q4 的实际烧钱与计划对比。
      - - 下一轮融资触发点
        - 未披露；估计在资金续航期降至 12–18 个月以下时触发
        - 高 ARR 增长可能支撑更有利的 Series F 条款；BDC 债务增加下行财务约束风险
        - 讨论董事会融资策略，以及是否已开展任何预热营销或 SPAC / IPO 讨论。
    notes: >-
      历史融资时间线（覆盖至 Series E 的所有轮次）见 Company Overview 章节。本表只聚焦前瞻资本充足性、当前流动性指标，以及影响尽调承销的具体融资义务。TPVG BDC
      贷款确认是这里最具运营意义的一项，因为它是唯一直接触及 Corelight 财务义务的独立第三方财务披露。
