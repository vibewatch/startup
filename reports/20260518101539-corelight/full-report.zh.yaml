      - number: '2.4'
        title: 增长驱动因素与市场逆风
        blocks:
          - type: paragraph
            body: >-
              NDR 市场受益于结构性有利的长期需求环境，由四个相互强化的增长驱动因素构成。第一，混合云和多云采用持续制造网络可见性缺口：企业把工作负载迁往
              AWS、Azure、GCP，同时保留本地基础设施，东西向流量越来越多地穿过云 VPC 和虚拟网络，传统网络分流器和硬件传感器监控不到。云原生 NDR 传感器部署正好填补这一缺口；按 Corelight 2024
              年 Series E 披露，它是公司增长最快的业务细分，同比增速 300%。第二，威胁环境在复杂度和破坏性上持续升级。CrowdStrike 2025 Global Threat Report
              记录，攻击者越来越多选择「登录」而非「闯入」——利用身份、供应链和零日漏洞，并用 AI
              放大攻击行动。勒索软件停留时间虽在下降，但仍以天计；在此期间，网络流量证据常常是横向移动之后仍能保留下来的唯一可靠取证材料。IBM X-Force Threat Intelligence Index 2025
              同样记录，网络层遥测对发现凭证窃取、C2 通信和数据暂存至关重要。第三，监管和政策要求形成机构拉力。CISA Zero Trust Maturity Model 和 NIST SP 800-207（Zero
              Trust Architecture）都明确把网络流量分析指定为零信任必需支柱。Executive Order 14028 下的联邦机构合规期限，直接扩大了美国公共部门可寻址 NDR 市场。第四，AI
              增强威胁要求行为型 NDR 检测超越单纯签名防御：攻击者用 AI 绕过静态检测模式后，行为异常检测——NDR 的核心——成为 SOC 必备能力。限制增长的主要逆风包括：（1）Cisco、Microsoft 和
              CrowdStrike 的 XDR 平台打包，它们都把网络遥测纳入更广泛安全平台，对既有客户的增量成本可能更低；（2）SOC 人才短缺削弱企业安全团队运行复杂网络监控工具的能力，可能让托管 / MSSP
              部署优于直接使用；（3）安全工具整合压力，CISO 正主动减少供应商蔓延；（4）宏观预算压缩，拉长企业安全采购周期。对 Corelight 而言，Cisco 和 CrowdStrike
              同时作为投资人和平台竞争者所形成的竞合格局，是近期最重大的市场风险。
