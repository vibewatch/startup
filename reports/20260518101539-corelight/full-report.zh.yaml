      - number: '7.5'
        title: 风险缓释与放弃标准
        blocks:
          - type: paragraph
            body: >-
              Corelight 已在多个维度展现出有意义的风险缓释进展，但截至 2026 年中，若干关键缺口仍未关闭。监管方面，SOC 2 Type II 和 ISO 27001
              认证提供了扎实的信任基线，并支持企业采购。FedRAMP 授权“进行中”说明 Corelight
              已向联邦云认证流程投入资源；尽调问题在于时间表以及过渡期商业打法（以本地传感器作为桥梁）。出口管制方面，Corelight 面向政府板块的销售动作大概率包含标准 EAR
              合规流程，但没有公开的出口管制合规计划文件。开源许可证合规方面，SBOM（Software Bill of Materials，软件物料清单）纪律在美国 Executive Order 14028 和 CISA
              指引下越来越成为强制要求；Corelight 是否满足这项联邦软件供应链要求，仍是未确认的尽调缺口。鉴于 Corelight 与 ICSI 的长期关系，Zeek 商标许可看起来稳定，但在 M&A
              尽调场景中，正式审查许可不可或缺。合作伙伴冲突通过与 CrowdStrike 和 Cisco
              的集成合作协议部分缓释，但投资人兼竞争者的结构性冲突无法靠运营手段解决——必须法律审查投资协议中的任何信息权、董事会观察员权或优先购买权（ROFR）条款。CEO Dye
              的关键人物风险由董事会治理深度部分缓释（Bettencourt 任执行董事长，Naguib 任新董事），但没有公开确认的继任计划或指定 COO。对 Vern Paxson 而言，覆盖其 ICSI/LBL
              研究中所有 Zeek 相关发明的正式 IP 转让协议，是关键尽调事项。放弃标准代表投资人应重新评估投资逻辑的阈值。Corelight 有三条主要放弃标准：（1）Corelight 自有传感器或 SaaS
              基础设施发生重大安全入侵——尤其涉及未授权访问客户网络元数据——会触发大规模合同终止风险，并在安全市场造成不可修复的品牌损害；（2）因 FedRAMP 延迟、出口管制违规或安全事件失去旗舰政府合同或 CISA
              咨询关系，会从 Corelight 估值中拿掉政府业务溢价，并暴露客户基础集中度风险；（3）资金充足的竞争性 Zeek fork
              获得显著企业采用——尤其由超大规模云厂商或大型安全平台支持时——会把核心技术护城河商品化，并压缩 Corelight 在商业和政府两端的定价权与胜率。次级放弃标准包括 CrowdStrike 或
              Microsoft 强势进入原生 NDR 领域，使集成伙伴模式过时；以及 CrowdStrike 或 Cisco 集成因 M&A 终止，导致主要联合销售渠道同时消失。
