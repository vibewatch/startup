      - 主要用户
      - 部署模式
      - 成熟度 / 状态
      - 核心差异化
      - 尽调缺口
    rows:
      - - 物理传感器 Physical Sensor（1G / 10G / 100G）
        - 企业 SOC、联邦机构、大型园区
        - 本地硬件设备；专用网络 TAP
        - GA – 最成熟；企业验证最广
        - 全协议覆盖；高吞吐认证；兼容隔离网络
        - 硬件供应链、制造合作伙伴和设备 BOM 未公开披露
      - - 虚拟传感器 Virtual Sensor（VMware ESXi / KVM）
        - 使用虚拟化数据中心的企业 SOC
        - 部署在客户虚拟化管理程序中的虚拟机；SPAN 端口或虚拟 TAP
        - GA – 已通过生产验证
        - 无需硬件采购摩擦；可在虚拟化环境中快速部署
        - 高 vCPU 竞争下的性能尚无独立基准测试
      - - 云传感器 Cloud Sensor（AWS / Azure / GCP）
        - 云原生企业、混合云 SOC
        - 使用 VPC Traffic Mirroring、vTAP 或 GCP Packet Mirroring 的云原生代理程序
        - GA（AWS、Azure、GCP）– GCP 于 2024–2025 年 GA
        - 云原生部署；与本地传感器相同的 Zeek 遥测
        - 流量镜像会增加云出口流量成本；Cloud Sensor 在加密流量深度上是否与 Physical Sensor 持平，尚未确认
      - - Corelight Investigator（SaaS）
        - SOC 分析师、IR 团队、威胁猎手
        - 云交付的 SaaS Web 应用；消耗传感器日志数据
        - GA – AI 分诊功能在积极开发中（2025–2026）
        - 为调查场景打造的 UI，AI 辅助告警优先级排序；无需 SIEM
        - AI 分诊评分方法未公开记录；与第三方 SIEM 的集成深度有限
      - - Corelight NDR Platform（托管版）
        - MSSP、MDR、缺少内部 SOC 分析能力的企业
        - 云托管服务；Corelight 运营检测基础设施
        - GA – 定位于托管 NDR 市场分部
        - 移除运营负担；完整 Zeek 遥测，配合 Corelight 托管检测规则
        - 托管服务 SLA、正常运行时间保证和客户数据隔离控制未公开确认
    notes: >-
      成熟度评级基于公开产品页描述、博客文章和新闻稿评估。没有独立第三方基准测试或分析师成熟度评级专门给每条产品线打分。Physical Sensor 上市时间更长，因此独立验证最多。Cloud Sensor 和 NDR
      Platform 的成熟度评估主要基于公司披露的 GA 公告。
    claimRefs:
