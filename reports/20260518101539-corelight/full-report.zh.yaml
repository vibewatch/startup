            title: XDR 平台打包威胁独立 NDR TAM
            body: >-
              Cisco（Corelight 投资人）、Microsoft 和 CrowdStrike（同样是 Corelight 投资人）正在把网络遥测整合进更广泛的 XDR 平台包。企业买家整合安全工具栈时，独立 NDR
              厂商面临一个风险：网络可见性可能从独立采购类别变成打包功能，从而压缩 Corelight 等纯 NDR 厂商的 SAM。Cisco 和 CrowdStrike 的竞合格局让这一风险尤其复杂。
