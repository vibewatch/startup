  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 竞争威胁
      - 严重性
      - 缓解措施 / 尽调问题
    rows:
      - - Zeek 开放核心：社区数十年积累 400+ 协议解析器
        - 竞争对手可在 Zeek 之上构建检测层（Stamus 基于 Suricata；其他厂商可能 fork Zeek）；云原生协议简化可能削弱云专属工作负载中的解析器优势
        - 中
        - 跟踪 Zeek fork 活动和社区贡献指标；验证云工作负载是否需要更少传统解析器；跟踪 Stamus Networks 在重叠政府细分中的企业牵引力
      - - 开放数据模型：无供应商锁定；SIEM 和数据湖无关的日志导出
        - SIEM 厂商（Splunk、Elastic）加入原生 NDR 检测模块，可能降低 SIEM 锚定账户对单独 NDR 平台的需求
        - 中–高
        - 评估 Corelight ARR 中 SIEM 已部署账户占比；跟踪 Splunk 和 Elastic 的 NDR 路线图推进；验证开放数据模型是否是 RFP 中的竞争获胜标准
      - - Zeek 开源托管：社区信任和采用飞轮
        - Zeek 关键贡献者可能转向替代实现；Vern Paxson 离开会削弱 Zeek 治理的学术可信度
        - 中
        - 对 Zeek 治理结构和贡献者多样性做技术尽调；评估 Corelight 代码贡献占比与独立社区贡献；核实 Zeek 关键维护者继任计划
      - - 取证证据质量：CrowdStrike Services 和 Mandiant IR 团队偏好
        - 平台厂商投资 AI 调查助手（Microsoft Security Copilot、CrowdStrike Charlotte AI），降低分析师对原始证据深度的依赖
        - 中
        - 验证 CrowdStrike 和 Mandiant 合同及商业关系深度；评估 AI 调查叠加层是否降低 Zeek 日志质量溢价；向 IR 重度账户索取客户推荐
      - - Corelight Cloud Sensor：为 AWS、Azure 和 GCP 工作负载提供原生深度检测
        - 云厂商提供接近零成本的原生网络遥测（AWS VPC Traffic Mirroring、Azure Network Watcher、GCP Packet Mirroring），降低第三方云传感器需求
        - 高
        - 跟踪云厂商原生遥测能力路线图；评估当前与 Corelight Cloud Sensor 的深度差距；估计云厂商遥测在云环境中达到 Zeek 级协议解析深度的时间线
      - - Microsoft 和 Palo Alto 平台捆绑：大型存量客户网络遥测近零增量成本
        - >-
          Microsoft M365 E5 以总价约 $57/user/month 捆绑 Defender 网络遥测；Palo Alto Cortex XDR 在 XDR 交易中捆绑 NDR；两者都在现有存量客户中替代独立
          NDR，且无需单独 NDR 预算项
        - 高
        - >-
          量化 Microsoft E5 和 Palo Alto Cortex XDR 账户中的 Corelight ARR 暴露；评估同时采用 M365 E5 账户的净留存率；核实 Cisco 投资方关系不会与 SNA
          造成渠道冲突
    notes: >-
      护城河主张和威胁严重性评估均为定性判断，综合了 Gartner NDR MQ 2025、Forrester Wave NAV 2023/2025、ESG 开放式与封闭式 NDR 研究、PeerSpot 和 Gartner
      Peer Insights NDR 市场评论，以及厂商文档中的竞争情报。严重性评级（中 / 中–高 / 高）反映截至 2026 年，在 NDR 市场动态下，每项威胁对 Corelight
      长期竞争地位构成结构性风险的程度。严重性评估没有正式定量模型支撑；它们是分析师判断下的定性评级，用于确定尽调优先级。
