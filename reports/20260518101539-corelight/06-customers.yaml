      description: >-
        Corelight does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), or customer
        churn rates. The NRR estimate of 115–130% is analyst-derived from sector benchmarks and proxy signals, not
        verified cohort data. No annual recurring revenue figure, customer count, or segment revenue breakdown is
        publicly available.
      severity: major
      type: no-public-evidence
      topic: NRR, GRR, ARR, and customer count not disclosed
      missingEvidence: >-
        Corelight does not publicly disclose net revenue retention, gross revenue retention, customer churn rates,
        ARR, or customer count. Cohort data and segment revenue breakdown are entirely unavailable from public sources.
      whyItMatters: These are the most critical SaaS health metrics; their absence creates significant financial diligence risk.
