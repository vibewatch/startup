chapter:
  order: 6
  number: 6
  title: "Customers"
  letter: "U"
  summary: >-
    Corelight serves an estimated 300–500 enterprise accounts globally as of mid-2026, concentrated in Fortune 500
    technology and financial services companies, US federal and intelligence-community agencies, large research
    universities, managed security service providers (MSSPs), and healthcare systems. The government sector is
    estimated to represent 30–40% of annual recurring revenue, with enterprise commercial accounts and MSSPs
    splitting the remainder. Lawrence Berkeley National Laboratory — the birthplace of Zeek — remains the canonical
    early adopter. Corelight's platform is the network detection and response backbone for the Black Hat conference
    NOC and is integrated into CrowdStrike Falcon and Mandiant/Google incident-response workflows. Third-party review
    sites (PeerSpot, TrustRadius, G2, Gartner Peer Insights) confirm high enterprise satisfaction, particularly on
    production deployment stability and threat-hunting value, while pricing complexity and interface usability are
    recurring criticism themes. Net revenue retention is estimated at 115–130% based on sector benchmarks; no
    disclosed cohort data is available to verify this independently. Government customer concentration and the
    undisclosed mix between direct sales and channel/partner-sourced accounts are the primary diligence gaps.

