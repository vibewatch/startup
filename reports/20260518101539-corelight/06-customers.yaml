figures:
  - id: FU001
    title: "Corelight Enterprise Customer Journey Map"
    type: journey-map
    layout: wide
    summary: >-
      Seven-stage customer journey from initial awareness of Corelight through long-term expansion, covering the
      distinct paths for enterprise commercial and US government buyers. Government buyers have longer procurement
      cycles, stricter compliance requirements (FedRAMP, clearances), and higher switching costs. Enterprise
      commercial buyers move faster through evaluation but require competitive bake-off against bundled alternatives.
      Both paths converge at production deployment and expand through cloud sensor and SaaS upsell.
    data:
      items:
        - id: journey-item-awareness
          label: "Discovery Path"
          description: >-
            Primary discovery channels: Gartner/Forrester analyst reports, Black Hat NOC reference, peer referrals
            from CrowdStrike/Mandiant IR teams, Dark Reading / security press, and Zeek open-source community.
            Enterprise and government buyers discover Corelight through security practitioner communities, Dark
            Reading / SC Magazine coverage, Gartner MQ and Forrester Wave reports, CrowdStrike and Mandiant referrals
            during IR engagements, or direct outreach from Corelight's enterprise sales team.
          tone: neutral
        - id: journey-item-evaluation
          label: "PoC and Bake-Off"
          description: >-
            30–90 day remote-deployable PoC; minimal setup friction confirmed in PeerSpot reviews; competitive evaluation
            against ExtraHop, Darktrace, Vectra, Cisco. Government path adds FedRAMP and compliance review. PeerSpot
            reviewers confirm PoC is 'straightforward and easy, often handled remotely', reducing evaluation friction.
          tone: neutral
        - id: journey-item-procurement
          label: "Procurement / Contract"
          description: >-
            Enterprise procurement (3–9 months for large accounts), legal and security review, MSA execution. Government
            procurement extends to 6–18 months due to FAR/DFARS compliance requirements, RFP processes, and budgetary
            authorization cycles. Contract structured as annual or multi-year subscription.
          tone: neutral
        - id: journey-item-production
          label: "Production Value Realization"
          description: >-
            Full sensor deployment across production network segments; Zeek and Suricata rule tuning; SIEM integration
            (Splunk, Microsoft Sentinel, Chronicle, QRadar). Post-deployment value: network-wide threat visibility,
            SIEM enrichment, faster IR (95% claim), platform stability rated highly. CSM + TAM model deepens post-sale
            engagement. Black Hat NOC confirms resilience under adversarial conditions.
          tone: positive
        - id: journey-item-expansion
          label: "Land-and-Expand Motion"
          description: >-
            Three-layer expansion path: cloud sensors for hybrid/cloud workloads (300% SaaS growth YoY 2024),
            Investigator SaaS for analyst workflows, throughput upgrades as network grows. Multi-year renewal with
            throughput tier upgrades, additional sensor deployments for new business units or geographies, and
            incremental Investigator seats. NRR estimated at 115–130%.
          tone: positive

  - id: FU002
    title: "Corelight Customer Acquisition and Deployment Funnel"
    type: funnel
    layout: standard
    summary: >-
      Five-stage acquisition funnel from total addressable market through production deployment and expansion, showing
      estimated conversion rates and primary friction points at each stage. Government and large enterprise buyers
      exhibit longer cycles and higher qualification gates; MSSP channel compresses stages for downstream clients.
    data:
      items:
        - id: funnel-tam
          label: "Total Addressable Market"
          value: 10000
          detail: >-
            Large enterprises (1,000+ employees), government agencies, and MSSPs with network security monitoring
            budgets and the technical sophistication to operate an NDR platform. Corelight's sophisticated buyer
            profile narrows effective TAM vs. total NDR market. (~10,000 enterprises globally with NDR budgets.)
          tone: neutral
        - id: funnel-awareness
          label: "Awareness / Pipeline"
          value: 2500
          detail: >-
            Organizations reached through Gartner/Forrester reports, analyst inquiries, Black Hat NOC reference,
            CrowdStrike/Mandiant partner referrals, security conference presence, and direct outbound sales.
            (~2,000–3,000 accounts engaged per year, estimated.)
          tone: neutral
        - id: funnel-poc
          label: "Proof of Concept"
          value: 500
          detail: >-
            Organizations deploying a 30–90 day PoC. PeerSpot reviewers confirm low-friction remote deployment.
            Government path extends PoC timeline due to compliance reviews. Competitive bake-off with ExtraHop,
            Vectra, Darktrace at this stage. (~400–600 PoCs per year, estimated.)
          tone: neutral
        - id: funnel-close
          label: "Initial Contract Close"
          value: 150
          detail: >-
            New enterprise and government customers. Average contract value $200K–$500K enterprise, $500K–$1M+
            government. Multi-year deals preferred; government contracts may be 3–5 year vehicles.
            (~100–200 new logos per year, estimated.)
          tone: positive
        - id: funnel-expand
          label: "Expansion / Upsell NRR"
          value: 120
          detail: >-
            Cloud sensor add-on, Investigator SaaS, throughput upgrades, new business unit coverage. Three-layer
            expansion path within each account. 300% SaaS growth YoY confirms activation rate.
            (NRR estimated 115–130%; represented here as midpoint 120%.)
          tone: positive

