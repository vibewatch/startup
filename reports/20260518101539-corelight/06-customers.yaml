callouts:
  - calloutType: strength
    title: "PeerSpot and Gartner Reviews Confirm Enterprise Production Adoption"
    body: >-
      Verified reviews from Gartner Peer Insights and PeerSpot confirm that Corelight Open NDR is deployed at
      production scale in US government Cybersentry programs, defense sector organizations, enterprise manufacturing,
      and financial services — providing role-level evidence of broad enterprise vertical penetration even without
      named customer case studies. Reviewer praise for deployment simplicity, support quality, and network visibility
      depth is consistent with high enterprise NRR.
    claimRefs: [CU002, CU003, CU013, CU029]

  - calloutType: strength
    title: "Three-Layer Land-and-Expand Model Structurally Supports 115–130% NRR"
    body: >-
      Corelight's product architecture creates three natural upsell vectors within each enterprise account: cloud
      sensor add-ons as cloud workloads grow, Investigator SaaS adoption for analyst workflows, and throughput
      tier upgrades as network traffic volumes increase. The 300% year-over-year SaaS growth claimed in the
      Series E press release confirms that the expansion mechanism is actively operating at scale.
    claimRefs: [CU007, CU016, CU026]

  - calloutType: risk
    title: "No Named Fortune 500 or Government Case Studies — Largest Customer Evidence Gap"
    body: >-
      Despite claiming Fortune 500 and government agency customers as core segments, Corelight does not publish
      named case studies for any commercial enterprise customer, and government customer names are undisclosed due
      to classification or confidentiality constraints. Diligence must rely on indirect proxy evidence (analyst
      reviews, peer platforms, partner announcements) rather than direct customer reference calls from the public
      marketing pipeline.
    claimRefs: [CU030, CU036]

  - calloutType: risk
    title: "Government Revenue Concentration (~30–40% of ARR) Creates Budget Risk"
    body: >-
      The US government sector is estimated to represent 30–40% of Corelight's ARR, with individual contracts
      potentially exceeding $1M per year. Government procurement is subject to continuing-resolution spending
      constraints, budget authorization volatility, and the FedRAMP authorization timeline (currently in progress)
      that may delay cloud-deployed government expansions. A single large government contract non-renewal could
      have material quarterly revenue impact.
    claimRefs: [CU009, CU030]

  - calloutType: insight
    title: "CrowdStrike and Mandiant Channels Extend Effective Customer Reach"
    body: >-
      CrowdStrike Services and Mandiant (Google Cloud Security) embed Corelight NDR in their enterprise incident
      response engagements, effectively delivering Corelight into the environments of large enterprises and
      government agencies served by these elite IR firms — without requiring Corelight to manage those customer
      relationships directly. Combined with the Cisco XDR and CrowdStrike Falcon integrations, this channel
      extends Corelight's addressable enterprise footprint well beyond its direct-sales-sourced account count.
    claimRefs: [CU010, CU017, CU022]
