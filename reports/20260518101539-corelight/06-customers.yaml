sections:
  - id: cu-segmentation
    title: "Customer Base Overview: Verticals, Buyers, and Scale"
    body: >-
      Corelight's enterprise customer base spans five primary vertical segments as of mid-2026. The largest
      by estimated revenue share is US government and defense: federal agencies, Department of Defense components,
      and intelligence-community organizations are estimated to represent 30–40% of ARR based on the relative
      density of government reviewers on Gartner Peer Insights and PeerSpot, the FedRAMP authorization in
      progress (confirming active government procurement engagement), and the Cybersentry program deployment
      documented in Gartner reviews. Government buyers in this segment are security operations leads, R&D
      directors, and CISO-level stakeholders with large network monitoring budgets and long procurement cycles.
      The second segment is Fortune 500 technology, financial services, and defense contractors: large private-sector
      enterprises that operate significant network infrastructure and require real-time threat detection for SOC
      operations and incident response. PeerSpot and Gartner Peer Insights reviews from manufacturing and
      financial services practitioners confirm this segment, though no Fortune 500 customers are named in
      public materials. The third segment is universities and national research laboratories — historically
      the original Zeek deployment base, with Lawrence Berkeley National Laboratory (where Zeek was invented)
      as the canonical early adopter. The Zeek open-source community provides a natural commercial conversion
      pipeline, as organizations already operating open-source Zeek can upgrade to Corelight for enterprise
      support, hardware sensors, and the Investigator SaaS analytics layer. Managed security service providers
      (MSSPs) constitute a fourth segment, operating Corelight as the network detection backbone within their
      multi-client security operations centers. The fifth segment is healthcare systems deploying Corelight
      for clinical network visibility, medical IoT device monitoring, and ransomware detection. Buyers
      across all segments are enterprise CISOs and SOC directors; users are threat hunters and incident
      responders; payers are information security budgets at the C-suite level or below.
    claimRefs: [CU001, CU002, CU003, CU004, CU009, CU022, CU023, CU035]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: cu-growth-trajectory
    title: "Growth and Adoption Trajectory: ARR Expansion and SaaS Acceleration"
    body: >-
      Corelight's growth trajectory is anchored by the April 2024 Series E data point: over 40% year-over-year
      ARR growth, with 300% year-over-year growth in AI and SaaS-driven NDR solutions. These figures,
      company-claimed and unverified by independent audit, indicate two concurrent growth drivers. First,
      net new logo acquisition: at an estimated NRR of 115–130%, organic expansion within existing accounts
      would account for 15–30 percentage points of ARR growth — leaving 10–25 percentage points to be
      explained by new customer adds. Second, product mix expansion: the disproportionately faster growth
      of SaaS and cloud sensor components relative to the overall business suggests that existing on-premise
      sensor customers are adding cloud and SaaS layers as their organizations migrate workloads to AWS,
      Azure, and GCP, driving natural upsell without requiring competitive displacement. The customer
      acquisition funnel operates through three channels: (1) direct enterprise sales to Fortune 500 and
      government accounts, typically involving a pre-sales engineering proof-of-concept and multi-month
      procurement cycle; (2) channel partner referrals through CrowdStrike Falcon, Cisco XDR, and Mandiant
      incident response services, which embed Corelight as the network detection layer and effectively
      warm-introduce Corelight to the partner's enterprise customer base; and (3) MSSP channel, where MSSPs
      deploy Corelight at scale across their client portfolios. The Zeek open-source community provides a
      supplementary awareness and conversion channel, particularly for university and national laboratory
      accounts. Deployment friction is low per PeerSpot reviews — 'straightforward and easy, with many
      deployments handled remotely' — which supports efficient customer onboarding and fast time-to-value
      in the direct-sales motion. The TriplePoint Venture Growth BDC debt facility in SEC filings provides
      independent confirmation of sufficient ARR scale to support institutional venture debt, consistent
      with an enterprise customer base of 300–500 accounts at $200K–$500K ACV.
    claimRefs: [CU005, CU006, CU007, CU008, CU010, CU016, CU017, CU022, CU024, CU027, CU028, CU038]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: cu-named-customers
    title: "Named Customer Proof: Government, Research, and Partnership Evidence"
    body: >-
      Named customer evidence for Corelight is limited by the company's policy of not publishing case studies
      with identifiable enterprise or government accounts, a pattern common in the defense and intelligence
      community segments where confidentiality requirements prevent public reference programs. The available
      named or semi-named evidence consists of three categories. First, institutional evidence: Lawrence
      Berkeley National Laboratory is the canonical original Zeek deployment, with production monitoring of
      the US Department of Energy scientific network spanning over two decades. LBNL's role as the founding
      site of both Zeek and Corelight makes it the most credible and historically significant customer
      reference. Second, practitioner evidence: Gartner Peer Insights reviews from named roles ('R&D Lead
      for Cybersentry – Government', 'Cybersecurity Specialist – Government', 'IT Security and Risk
      Management Director – Government', 'Information Technology Specialist – Manufacturing') confirm
      production deployments across government Cybersentry programs and enterprise manufacturing environments,
      providing role-level evidence even without company names. Third, ecosystem evidence: CrowdStrike
      Services and Mandiant (Google Cloud Security) embed Corelight in their enterprise incident response
      engagements, providing indirect confirmation that CrowdStrike's and Mandiant's enterprise and
      government clients — which include many of the world's largest organizations — operate Corelight
      in their environments during IR engagements. The Black Hat conference NOC deployment serves as the
      most visible public proof point, confirming Corelight can handle adversarial network conditions in
      a practitioner-observed context. The absence of named Fortune 500 or government agency case studies
      in published marketing materials remains the single largest customer evidence gap in the diligence
      process, requiring private reference calls to validate the depth of enterprise and government penetration.
    claimRefs: [CU002, CU003, CU004, CU010, CU011, CU018, CU019, CU020]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: cu-retention
    title: "Retention, NRR, and Customer Health Indicators"
    body: >-
      Corelight does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), customer
      churn rates, or cohort data. The NRR estimate of 115–130% is derived from three proxy signal categories.
      First, product structure: the layered deployment model (physical sensors → virtual sensors → cloud sensors
      → Investigator SaaS) creates three natural upsell vectors within each account, structurally enabling
      NRR above 100% without requiring any competitive displacement. Existing sensor customers who add cloud
      coverage for AWS/Azure/GCP deployments and then add the Investigator SaaS analytics layer can expand
      ACV by 2–3x over the initial contract without changing vendors. Second, customer satisfaction signals:
      PeerSpot reviewers consistently rate support as 'responsive, helpful, and knowledgeable', with access
      to customer success managers and technical account managers. Advisory board participation further deepens
      customer engagement with the Corelight product roadmap. High-quality post-sale support and advisory
      access are consistent with enterprise SaaS businesses achieving NRR in the 110–130% range. Third,
      institutional investor proxies: Accel's decision to lead both the 2017 Series A and the 2024 Series E
      represents a seven-year institutional endorsement that would not be sustained if NRR or customer
      retention had materially deteriorated. Gartner MQ Leader placement in both 2024 and 2025 — which
      requires multi-customer reference interview programs — provides direct third-party confirmation of
      sustained customer satisfaction. The primary adverse signal on retention is pricing: PeerSpot and
      G2 reviewers note that Corelight is 'pricey' for buyers without deep Zeek expertise, and the ML
      feature set adds cost — creating a churn risk in the price-sensitive mid-market segment. The FedRAMP
      in-progress status limits some government deployments, potentially deferring contract expansions until
      FedRAMP authorization is achieved.
    claimRefs: [CU012, CU013, CU014, CU015, CU016, CU018, CU019, CU021, CU025, CU029, CU033]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: cu-expansion-concentration
    title: "Expansion Drivers and Concentration Risk"
    body: >-
      Corelight's primary expansion drivers within existing accounts are (1) sensor tier upsell from physical
      to cloud deployment as customers migrate workloads to public cloud; (2) Investigator SaaS adoption
      driving per-seat or per-analyst subscription growth within the analyst workflow layer; (3) throughput
      tier upgrades as customer network traffic volumes grow; and (4) new business unit or geographic coverage
      expansion within large enterprise accounts with multiple data centers. These mechanisms structurally
      support NRR above 100% and create the conditions for the land-and-expand ARR growth model. On the
      concentration risk side, Corelight's customer profile creates meaningful concentration exposure. Estimated
      contract values of $200K–$500K for mid-market enterprise and $1M+ for large government and Fortune 500
      accounts mean that the top 10–20 accounts likely represent a disproportionate share — potentially 30–50%
      — of total ARR. A single large government contract non-renewal or a major Fortune 500 account defection
      to a bundled Cisco, CrowdStrike, or Microsoft offering could have material quarterly revenue impact. The
      government sector concentration (~30–40% of ARR) is particularly notable, as government procurement cycles
      are subject to budget authorization volatility, continuing-resolution spending constraints, and the political
      risk of program cancellation. An additional adverse signal is the price-complexity barrier: G2 and PeerSpot
      reviewers document that buyers without deep Zeek expertise perceive Corelight as costly and complex relative
      to alternatives, meaning the addressable customer base is narrowed to sophisticated security buyers. This
      creates a ceiling on the total addressable market within the SMB and mid-market segments and concentrates
      Corelight's customer base in the upper-enterprise and government tiers where pricing objections are less
      determinative. The channel strategy with CrowdStrike, Cisco, and Mandiant partially mitigates concentration
      risk by diversifying the customer acquisition funnel, but the depth of the partner channel is not publicly
      quantified and remains a diligence item.
    claimRefs: [CU015, CU016, CU017, CU022, CU023, CU030, CU032, CU033, CU036]
    tableRefs: [TU005]

