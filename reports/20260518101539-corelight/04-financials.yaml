  - id: section-capital-adequacy
    title: "Capital adequacy: $150M Series E plus BDC debt, estimated 20–30 month runway"
    body: >-
      Corelight's capital structure following the April 2024 Series E comprises approximately $310–340M in total equity
      capital raised across five rounds (seed through Series E), plus venture debt from TriplePoint Venture Growth BDC
      Corp (TPVG). The TPVG annual report for the period ending December 31, 2024, filed with the SEC on March 5, 2025,
      lists Corelight, Inc. as a portfolio company, confirming that debt financing is part of Corelight's capital
      structure. TPVG is a Business Development Company (BDC) that provides venture loans at interest rates typically in
      the 10–16 percent range, secured by company assets and with financial maintenance covenants. The existence of
      this debt layer matters for diligence because it means Corelight's effective capital structure is more complex than
      its equity raises suggest: debt service and covenant compliance add cash flow obligations that do not appear in
      press releases. On the equity side, the $150M Series E was led by Accel with participation from Cisco Investments
      and the CrowdStrike Falcon Fund. The use of funds as disclosed at the time of the Series E was product expansion,
      go-to-market scaling, and engineering headcount growth. Based on estimated monthly burn of $10–15M and the $150M
      raise, the post-Series-E runway was approximately 20–30 months from April 2024, placing the estimated depletion
      window between December 2025 and October 2026 absent revenue growth. If ARR is growing at 40+ percent, the
      revenue contribution meaningfully extends self-sufficiency, but the business is almost certainly not yet
      cash-flow-positive at this stage of growth investment. Series F timing will depend on growth trajectory, market
      conditions, and whether the TPVG debt facility provides sufficient bridge capital between equity rounds.
