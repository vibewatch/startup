  - id: FI004
    title: "Capital intensity and cash-flow map"
    type: matrix
    layout: wide
    summary: >-
      Corelight's capital structure has three distinct funding layers — equity rounds, BDC venture debt, and
      ongoing revenue — each with different risk profiles and diligence requirements. This matrix maps each
      funding source against the key dimensions of diligence confidence.
    data:
      columns:
        - Funding source
        - Confirmed amount
        - Risk signal
        - Diligence confidence
      rows:
        - label: Series E equity (April 2024)
          values:
            - label: equity
              tone: positive
              detail: Accel-led equity round with strategic co-investors.
            - label: $150M confirmed
              tone: positive
              detail: Confirmed by PR Newswire press release and multiple news sources.
            - label: low risk
              tone: positive
              detail: Equity has no repayment obligation; dilution is the primary cost.
            - label: high
              tone: positive
              detail: Amount and investors fully confirmed by official press release.
        - label: Prior equity rounds (Seed–Series D)
          values:
            - label: equity
              tone: positive
              detail: Five prior rounds with General Catalyst, Insight Partners, and others.
            - label: ~$160M–$190M estimated
              tone: neutral
              detail: Estimated based on Crunchbase and investor portfolio page disclosures.
            - label: low risk
              tone: positive
              detail: Historical equity; liquidation preferences may affect economics but not near-term liquidity.
            - label: medium
              tone: neutral
              detail: Individual round sizes not all officially confirmed; total range estimated.
        - label: TPVG BDC venture debt
          values:
            - label: debt
              tone: warning
              detail: TriplePoint Venture Growth BDC Corp loan(s) confirmed via SEC 10-K filing.
            - label: amount undisclosed
              tone: warning
              detail: Principal, interest rate, and maturity date not publicly disclosed.
            - label: elevated risk
              tone: warning
              detail: BDC rates (10%–16%) plus covenants add cash-flow obligations beyond equity cost of capital.
            - label: low
              tone: warning
              detail: Only the existence of the loan is confirmed; terms are entirely private.
        - label: Operating revenue offset
          values:
            - label: recurring revenue
              tone: positive
              detail: Subscription ARR growing at 40%+ provides increasing cash-flow offset against burn.
            - label: estimated $100M–$160M ARR
