  - id: section-pricing-gtm
    title: "Pricing mechanics and GTM motion: per-sensor enterprise model, no public price list"
    body: >-
      Corelight does not publish a public price list as of 2026. Pricing is handled through a direct enterprise sales
      motion with a contact-sales model for all commercial tiers. Based on publicly available information from product
      pages, partner case studies, and investor announcements, Corelight's commercial structure has three pricing axes.
      First, hardware appliance pricing is tied to sensor throughput capacity, with SKUs designed for 1 Gbps, 10 Gbps,
      25 Gbps, and 100 Gbps environments. Second, subscription software pricing follows a per-sensor or per-deployment
      model with annual contract values that vary by throughput, detection library tier, and optional add-ons such as
      Encrypted Traffic Collection or Smart PCAP. Third, cloud sensor pricing for AWS and Azure environments is based on
      instance type and data throughput, creating a consumption-adjacent element that grows with customer cloud scale.
      Enterprise contracts typically bundle all three layers into a single annual or multi-year agreement, often
      negotiated with multi-year discount schedules. CrowdStrike, Mandiant, and Cisco Investments are both strategic
      investors and technology partners, creating a channel dimension where Corelight sensors are resold or embedded
      in partner SOC offerings. This strategic partnership channel—while difficult to size without proprietary data—likely
      provides a meaningful portion of new logo generation. The GTM motion skews toward large enterprise and federal
      government accounts, which supports higher average contract values but also implies longer sales cycles and
      potentially concentrated revenue among fewer large customers. No list pricing for subscription tiers has been
      confirmed in the publicly reviewed material, which means realized ASP, discount levels, and true enterprise
      economics remain unconfirmed.
    claimRefs:
      - CI008
      - CI009
      - CI010
