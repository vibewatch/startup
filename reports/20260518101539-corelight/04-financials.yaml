callouts:
  - calloutType: insight
    title: "SaaS/AI revenue growing 300% YoY signals a mix shift to higher-margin recurring revenue"
    body: >-
      The April 2024 Series E press release disclosed both the headline 40%-plus ARR growth rate and the
      subordinate 300% YoY growth in AI and SaaS-driven NDR solutions. The latter figure is the more financially
      important signal: it implies that the highest-margin product tier (cloud sensor + SaaS analytics) is
      growing roughly seven times faster than the overall business. If this trajectory has continued through
      2025–2026, Corelight's blended gross margin is likely improving as SaaS displaces on-premises hardware
      as a share of revenue. This mix shift is the most plausible path to an eventual gross-margin profile
      above 80 percent, but it requires verification through management financial data.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006

  - calloutType: risk
    title: "TPVG BDC debt adds covenant risk not visible from equity fundraising announcements alone"
    body: >-
      TriplePoint Venture Growth's SEC 10-K filing for fiscal year ending December 31, 2024, lists Corelight
      as a portfolio company, confirming that venture debt is part of Corelight's capital structure. BDC venture
      loans typically carry 10–16 percent annual interest rates, financial maintenance covenants (minimum cash,
      revenue milestones), and security interests over company assets. A covenant breach — possible if growth
      slows or burn accelerates — could trigger acceleration of the debt obligation and materially constrain
      the company's financial flexibility, even with $150M in equity capital. This risk is invisible from press
      releases and investor announcements, which makes the TPVG SEC filings the single most important independent
      financial disclosure about Corelight available in the public record.
    claimRefs:
      - CI023
      - CI024
      - CI025
      - CI027
      - CI028

  - calloutType: recommendation
    title: "Do not underwrite unit economics or capital adequacy from public evidence alone"
    body: >-
      The public record provides strong evidence for Corelight's demand quality (Gartner Leader placement,
      40%+ ARR growth, strategic investors), but it cannot support financial underwriting. ARR, gross margin,
      NRR, CAC, cash position, TPVG loan terms, and burn rate are all either unconfirmed estimates or entirely
      absent. Any investment model built on publicly available Corelight financial data will require model-derived
      proxies for every key input. Management-provided financial statements, a data-room review, and independent
      customer reference calls are mandatory before a financial verdict can be treated as complete.
    claimRefs:
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035

