  - id: TI005
    title: "Public financial gaps table"
    columns:
      - missing private metric
      - impact on underwriting
      - exact diligence path
    rows:
      - - Confirmed ARR as of 2025 or 2026
        - Cannot verify whether 40%+ growth has sustained; forward revenue projections are speculative
        - Request management-certified ARR bridge or audited financial statements from 2024–2025.
      - - Gross margin by revenue stream
        - Hardware/services mix depresses blended margin; cannot model profitability path without segment COGS
        - Request COGS waterfall split across subscription software, hardware COGS, PS labor, and cloud infrastructure.
      - - Net revenue retention by customer cohort
        - Land-and-expand thesis rests on NRR; an NRR below 110% would materially impair the business model narrative
        - Provide trailing-12-month NRR by customer tier and product line; include gross retention and expansion separately.
      - - CAC and payback period by segment
        - Enterprise NDR sales have long cycles; without CAC data, capital efficiency of growth investment is unknowable
        - Request sales funnel metrics, quota attainment, CAC by segment (enterprise, mid-market, federal, channel).
      - - TPVG BDC loan terms and covenants
        - BDC loans have financial maintenance covenants; a covenant breach would be material to liquidity and equity
        - Request TPVG loan agreement, outstanding principal, interest rate, maturity date, and any amendment history.
      - - Monthly burn and cash position as of 2026
        - Runway adequacy and Series F timing cannot be assessed without current cash position
        - Request cash statement as of latest quarter-end; provide board-approved runway scenarios.
      - - Customer count and ARR concentration
        - Revenue concentration in a handful of large accounts is a standard enterprise SaaS risk
        - Disclose total customer count, ARR by decile, and top-10 customer concentration percentage.
    notes: >-
      These seven gaps represent the minimum private-data requests needed to convert a public-evidence research
      chapter into an investable financial model. The absence of any one of these inputs creates a material
      underwriting hole; the absence of all seven means the financials chapter, while informative about the
      revenue model, is insufficient for final investment conviction. Every gap listed here has a specific
      verification path that can be completed with management cooperation and standard data-room documents.
    claimRefs:
      - CI029
