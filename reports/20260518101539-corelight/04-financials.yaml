    title: "Financial estimate range"
    type: range
    layout: wide
    summary: >-
      Key Corelight financial parameters can be bounded from growth-rate extrapolation, sector benchmarks, and
      headcount-based modeling. All figures are estimates with low to medium confidence. The range items
      represent the plausible low-to-high spread across reasonable modeling assumptions.
    data:
      items:
        - label: Estimated ARR (USD millions, early 2026)
          low: 90
          high: 160
          mid: 120
          displayValue: "$90M–$160M"
          detail: >-
            Extrapolated from 40%+ YoY ARR growth starting from an estimated 2022 base of ~$40-50M, growing
            through April 2024 Series E. Wide range reflects uncertainty about growth rate post-announcement.
          tone: neutral
        - label: Estimated blended gross margin (percent)
          low: 70
          high: 82
          mid: 76
          displayValue: "70%–82%"
          detail: >-
            Blended from subscription software (~82%), hardware (~48%), and professional services (~28%) at
            an 80/15/5 revenue mix estimate. Lower bound reflects higher hardware mix; upper bound assumes
            mix shift toward SaaS.
          tone: neutral
        - label: Estimated monthly burn rate (USD millions)
          low: 9
          high: 16
          mid: 12
          displayValue: "$9M–$16M/month"
          detail: >-
            Derived from approximately 470 employees at $200K fully-loaded cost per year ($94M/year), plus
            estimated $20M–$40M in cloud infrastructure, hardware COGS, and facilities annually.
          tone: warning
        - label: Estimated post-Series-E runway (months from April 2024)
          low: 18
          high: 32
          mid: 25
          displayValue: "18–32 months"
          detail: >-
            Based on $150M raised in April 2024 divided by monthly burn estimates, with credit for estimated
            net revenue contribution growing at 40%+ annually. Upper bound assumes strong revenue offset.
          tone: neutral
    approximationNotes: >-
      All figures in this range chart are estimates with low to medium confidence. No figure has been confirmed
      by Corelight or by an independent financial auditor. The ARR estimate rests on growth-rate extrapolation
      from the April 2024 Series E announcement. Gross margin estimates use sector benchmarks. Burn and runway
      estimates use headcount-based modeling with limited verification.
