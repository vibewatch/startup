company:
  name: "Corelight, Inc."
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Corelight's financial picture in 2026 combines a structurally attractive subscription-dominant revenue model with the
    opacity typical of growth-stage private companies. The single most reliable public financial signal is the company's own
    April 2024 Series E press release, which disclosed greater than 40 percent year-over-year ARR growth and 300 percent
    YoY growth in its AI and SaaS-driven NDR solutions. TriplePoint Venture Growth BDC Corp (TPVG) SEC filings from
    2020 through 2026 independently confirm Corelight as a debt portfolio company, revealing that Corelight carries BDC
    venture loans alongside its equity capital, which adds a financial obligation layer not visible from equity funding
    alone. Based on publicly available inputs — approximately 470 employees at roughly $200,000 fully-loaded cost, plus
    cloud and hardware cost structure — estimated monthly burn runs $10–15M. With $150M raised in the Series E and
    estimated prior cash position, independent analysts estimate a 20–30 month runway from mid-2024. ARR is estimated at
    $100–150M as of early 2026 based on growth rate extrapolation; gross margin is estimated at 75–80 percent consistent
    with NDR SaaS/sensor peers; NRR is estimated at 115–130 percent based on sector benchmarks. None of these figures are
    publicly disclosed by the company. The principal financial diligence blockers are: (1) no confirmed path to
    profitability disclosed, (2) BDC debt obligations with undisclosed covenants, (3) hardware/subscription revenue mix
    requires gross margin disaggregation, and (4) CAC, payback, and NRR cohort data are entirely absent from public record.

sections:
  - id: section-revenue-model
    title: "Revenue model and streams: subscription-dominant with hardware and services tail"
    body: >-
      Corelight's revenue model is built on three distinct streams that together constitute its Open NDR Platform
      commercial offering. The dominant stream is subscription software, accounting for an estimated 80 percent of total
      revenue. Subscription revenue comes from annual or multi-year licenses for Corelight's sensor software (Zeek-based
      protocol parsers and detection collections running on customer-owned hardware or virtual machines), cloud sensor
      subscriptions for AWS and Azure environments, and access to the Corelight SaaS analytics and management layer. The
      subscription model is priced per sensor or per data throughput tier, with enterprise customers typically negotiating
      multi-year agreements. The second stream, estimated at approximately 15 percent of revenue, is hardware appliance
      sales. Corelight sells physical network sensors as purpose-built appliances that customers deploy on-premises; these
      are capital purchases rather than recurring revenue, which means hardware mix variability introduces lumpiness into
      quarterly recognition. The third stream, estimated at 5 percent, is professional services — deployment assistance,
      threat-hunting engagements, and training delivered to enterprise accounts. The April 2024 Series E press release
      confirmed greater than 40 percent year-over-year ARR growth and 300 percent YoY growth in AI and SaaS-driven NDR
      solutions, which implies the SaaS/cloud sensor component is growing substantially faster than the overall book.
      The open-core model — where Zeek is free but Corelight's commercial detection libraries, protocol parsers, and
      cloud analytics are subscription-gated — creates a natural land-and-expand motion. Customers frequently begin with
      on-premises sensors, then add cloud sensors and the SaaS management layer over time, driving the net revenue
      retention that industry comparables suggest runs above 115 percent for leading NDR platforms.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
