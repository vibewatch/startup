  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-metrics
      missingEvidence: >-
        Current ARR as of year-end 2025 or Q1 2026; confirmation of whether the 40%+ YoY growth rate
        has been maintained, accelerated, or decelerated since the April 2024 Series E announcement.
      whyItMatters: >-
        The 40%+ ARR growth claim is from April 2024 and is the sole public financial data point. Without
        a current ARR figure, forward revenue projections and next-round valuation estimates are purely
        speculative. A deceleration below 30% YoY would materially affect exit multiple and Series F timing.
      diligencePath: >-
        Request management-certified ARR schedule showing quarterly ARR from 2023 through Q1 2026; obtain
        audited or reviewed financial statements for fiscal years 2024 and 2025; conduct customer reference
        calls with 3–5 enterprise accounts to triangulate ARR estimates independently.
      relatedQuestionRefs: [QI016]
      relatedTableRefs: [TI003]

    - type: private-evidence-only
      severity: material
      topic: debt-obligations
      missingEvidence: >-
        TPVG BDC loan principal amount, interest rate, maturity schedule, covenant package, and any amendment
        or extension history since the initial loan was made.
      whyItMatters: >-
        TPVG BDC loans carry financial maintenance covenants; a covenant breach is a material adverse event
        that could accelerate debt repayment and constrain operating cash flow even with equity available.
        The risk is invisible from equity fundraising announcements, making it the most asymmetric information
        gap in the Corelight financial picture.
      diligencePath: >-
        Obtain the TPVG loan agreement, outstanding principal balance, amortization schedule, interest rate
        (fixed/floating), covenant package, and amendment history from company counsel; request TPVG directly
        for borrower-specific disclosure if permitted under loan agreement.
      relatedQuestionRefs: [QI027]
      relatedTableRefs: [TI004]

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Net revenue retention by customer cohort and year; customer acquisition cost by segment; sales-cycle
        length; and customer count with ARR concentration data.
      whyItMatters: >-
        These are the foundational inputs to a SaaS unit-economics model. An NRR below 110% would suggest
        churn pressure inconsistent with Gartner Leader positioning. A CAC payback above 36 months at
        current gross margin would indicate capital inefficiency requiring a materially larger Series F.
      diligencePath: >-
        Request trailing-12-month cohort NRR by customer tier; provide funnel metrics and CAC by segment
        (enterprise, federal, mid-market, channel); disclose total customer count and ARR by decile.
      relatedQuestionRefs: [QI024]
      relatedTableRefs: [TI003, TI005]

    - type: private-evidence-only
      severity: moderate
      topic: cash-position
      missingEvidence: >-
        Current cash and cash equivalents as of Q1 2026; monthly P&L and cash burn bridge through 2025;
        board-approved runway scenarios under base and downside assumptions.
      whyItMatters: >-
        Without a current cash position, runway adequacy cannot be confirmed. The estimated 20–30 month
        post-Series-E runway from April 2024 implies a potential financing need in 2025–2026; if burn has
        accelerated or revenue growth has slowed, a Series F may be needed sooner than the model implies.
      diligencePath: >-
        Request treasury dashboard showing cash position as of March 31, 2026; provide board-approved
        monthly cash bridge and CFO commentary on burn trend; disclose any draws on the TPVG facility.
      relatedQuestionRefs: []
      relatedTableRefs: [TI004]

    - type: private-evidence-only
      severity: moderate
      topic: cloud-sensor-pricing
      missingEvidence: >-
        Public pricing structure for Corelight's cloud sensor and SaaS analytics products; the pricing page
        (corelight.com/pricing) returns no publicly accessible content, and no independent source discloses
        per-sensor or per-terabyte pricing for the cloud-hosted product tier.
      whyItMatters: >-
        Cloud sensor and SaaS analytics pricing determines the unit economics of the fastest-growing segment
        (300% YoY). Without knowing the pricing model, it is impossible to validate whether the SaaS growth
        reflects new customer acquisition or price-per-unit expansion. Pricing structure also affects gross
        margin modeling for the SaaS layer.
      diligencePath: >-
        Request Corelight product pricing sheet for cloud sensor (per-sensor/per-terabyte/per-GB/seat) and
        SaaS analytics (per-user or capacity-based) tiers; compare against NDR peer pricing disclosures from
        Darktrace and Vectra for reasonableness.
      relatedQuestionRefs: [QI015]
      relatedTableRefs: [TI001]

acknowledgedWarnings:
  - dimension: paywallRisk
    reason: >-
      Three sources have non-ok access status: SI010 (Gartner Magic Quadrant 2025, paywall), SI021 (Accel
      Series E page, broken/404), and SI022 (CrowdStrike Falcon Fund page, broken/404). The Gartner MQ is
      behind a paid subscription with no equivalent free substitute; Corelight's Gartner Leader status is
      independently confirmed via SI009 (Gartner Peer Insights). Both SI021 and SI022 returned 404 at access
      time; the investor participation they would have confirmed is independently documented in the Series E
      press release (SI002) and Corelight investor page (SI001).
