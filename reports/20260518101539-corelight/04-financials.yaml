              detail: Revenue growth offsets burn, but no confirmed cash-flow-positive timeline.
            - label: low
              tone: warning
              detail: All revenue figures are estimates; no audited income statement is public.
    approximationNotes: >-
      Confirmed amount and risk signal columns are based on public disclosures. TPVG debt is confirmed by
      SEC filing existence but amounts and covenants are private. Revenue offset estimates use growth-rate
