callouts:
  - calloutType: strength
    title: "Zeek Open-Core and Protocol Depth: Corelight's Clearest Defensible Moat"
    body: >-
      Corelight's 400+ Zeek-derived protocol parsers and two-decade custodianship of the Zeek
      open-source project represent the most structurally defensible technical moat in the NDR
      market. Unlike ML-first competitors, this depth was accumulated through distributed community
      development over 20+ years at academic and government institutions and cannot be replicated
      quickly by proprietary vendors. For forensic-driven SOC teams and incident response firms,
      this protocol depth and evidence quality is typically the decisive differentiation factor in
      competitive evaluations where Corelight competes against ExtraHop or Darktrace.
    claimRefs:
      - CP013
      - CP015
      - CP016

  - calloutType: risk
    title: "Microsoft and Hyperscaler Bundling: The Highest-Severity Competitive Threats"
    body: >-
      Microsoft Defender for Endpoint's network telemetry capabilities, bundled at near-zero
      incremental cost within M365 E5 at approximately $57 per user per month, represent the most
      acute commoditization risk to Corelight's standalone NDR value proposition. In accounts already
      standardized on M365 E5, the economic justification for a separate NDR platform is structurally
      weakened—even though Corelight's forensic depth significantly exceeds Microsoft's network
      visibility. In parallel, hyperscaler-native network telemetry (AWS VPC Traffic Mirroring, Azure
      Network Watcher, GCP Packet Mirroring) poses a medium-term threat to Corelight's Cloud Sensor
      differentiation as cloud-native environments mature over a 3–5 year horizon.
    claimRefs:
      - CP018
      - CP030
      - CP033

  - calloutType: insight
    title: "Coopetition with Cisco and CrowdStrike: Strategic Alignment and Structural Tension"
    body: >-
      Cisco Investments and the CrowdStrike Falcon Fund both participated in Corelight's April 2024
      Series E, creating a unique coopetition dynamic. Cisco is a direct adjacent competitor via
      Secure Network Analytics and simultaneously a strategic investor with network security
      infrastructure interests. CrowdStrike is Corelight's most prominent channel and integration
      partner, a strategic investor, and a potential builder of native NDR capability on its Falcon
      platform. This dual investor-competitor relationship provides commercial alignment through
      co-sell arrangements while preserving structural competitive tension. Diligence should assess
      how these relationships have evolved post-Series E and whether contractual co-sell commitments
      are in place.
    claimRefs:
      - CP028
      - CP029
      - CP034

