chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Corelight competes in the network detection and response (NDR) market against direct NDR peers,
    platform incumbents, and substitute tools. Direct competitors include ExtraHop RevealX (now an
    Arista Networks product, ML/NPM convergence, Forrester Wave NAV Q4 2025 Leader), Darktrace
    (UK-listed public company, ~$410M ARR FY2024, Self-Learning AI covering NDR/email/OT), Vectra
    AI (~$300M raised, cloud AI NDR, Azure/Microsoft Defender integration), and Stamus Networks
    (Suricata-based, Clear NDR, single-license model, NATO battle-tested). Adjacent incumbents
    include Cisco Secure Network Analytics (NetFlow-based behavioral analytics embedded in Cisco
    portfolio), Palo Alto Cortex XDR (XDR platform with NDR component), and Microsoft Defender
    for Endpoint (M365 E5 bundled network telemetry at near-zero incremental cost). SIEM vendors
    (Splunk, IBM QRadar) and EDR/XDR platforms represent the principal substitute paths. Corelight's
    competitive moat rests on three compounding advantages: Zeek open-core with 400+ protocol parsers
    delivering forensic-grade network metadata depth unmatched by ML-first or flow-based competitors;
    an open data model that decouples detection from storage and integrates with any SIEM or data lake;
    and custodianship of the Zeek open-source project generating community trust and an adoption
    flywheel among elite SOC and IR teams. The highest competitive risks are platform consolidation
    from Microsoft (M365 E5 bundling) and Palo Alto (Cortex XDR), hyperscaler-native network
    telemetry threatening Cloud Sensor differentiation, and open-source commoditization risk if
    competitors build detection layers directly atop Zeek. Corelight was named a Leader in the
    2025 Gartner Magic Quadrant for NDR and previously in the Forrester Wave: Network Analysis
    and Visibility Q2 2023.

sections:
  - id: competitive-landscape-overview
    title: "Competitive Landscape Overview"
    body: >-
      The NDR market in 2026 is a fragmented but consolidating competitive landscape where Corelight
      competes against pure-play NDR vendors, security platform incumbents, and a growing category
      of XDR and SASE hybrid products that bundle network visibility with endpoint or cloud security.
      Three tiers characterize the competition. First, the direct NDR peer set: ExtraHop RevealX
      (now a product within Arista Networks' portfolio following acquisition, combining network
      performance monitoring with ML-driven threat detection, named a Leader in the Forrester Wave:
      Network Analysis and Visibility Solutions Q4 2025); Darktrace (UK-listed public company with
      approximately $410 million ARR for FY2024, AI-first self-learning threat detection covering
      NDR, email security, and OT); Vectra AI (approximately $300 million total raised, cloud-AI
      NDR with Azure and Microsoft Defender integration, Gartner Peer Insights Customer First
      recipient in 2023); and Stamus Networks (smaller, European, open-source Suricata-based,
      Clear NDR system battle-tested in NATO cybersecurity exercises). Second, the adjacent
      incumbent tier: Cisco Secure Network Analytics, formerly Stealthwatch, which provides
      NetFlow- and IPFIX-based behavioral analytics embedded within Cisco's network infrastructure
      portfolio; and Palo Alto Networks Cortex XDR, which positions network analytics as a component
      of a unified XDR platform. Third, the substitute tier: SIEM vendors including Splunk and IBM
      QRadar, and EDR or XDR platforms that argue against standalone NDR deployment by offering
      partial network telemetry within a broader security data platform. The analyst community
      recognizes Corelight's open-core approach as a structural differentiator. The 2025 Gartner
      Magic Quadrant for NDR named Corelight a Leader, and the Forrester Wave: Network Analysis
      and Visibility Q2 2023 likewise cited Corelight's protocol parsing depth and open data model
      as primary leadership criteria. ExtraHop RevealX was also named a Leader in the Forrester
      Wave NAV Q4 2025, establishing it as the closest analyst-recognized peer. The competitive
      dynamic is shaped by a fundamental tension between fidelity—Corelight's primary axis of
      differentiation through forensic-grade network metadata—and platform breadth, which Microsoft,
      Cisco, and Palo Alto exploit by embedding network visibility into larger security stacks.
      Buyers increasingly demand both, creating a two-speed market: forensic-driven SOC and IR
      teams favor Corelight's evidence-based approach, while consolidation-seeking CISOs gravitate
      toward platform vendors offering "good enough" NDR bundled with endpoint and identity.
