  - id: feature-and-pricing-comparison
    title: "Feature and Pricing Comparison"
    body: >-
      Corelight's most durable product differentiation is protocol parsing depth and forensic
      evidence quality. With 400+ network protocol parsers derived from Zeek's decades-long open-
      source development, Corelight produces structured, analyst-readable network logs that competitors
      relying on flow-based or ML-only detection cannot replicate. The open data model—exporting
      logs in open formats compatible with Splunk, Elastic, CrowdStrike Falcon, Microsoft Sentinel,
      Kafka, and any SIEM or data lake—eliminates proprietary lock-in and enables security teams to
      fully own their network telemetry. Corelight delivers over 70,000 out-of-the-box detection
      signatures and covers more than 80 MITRE ATT&CK tactics, techniques, and procedures, providing
      both signature-based and AI-driven detection alongside its structural metadata advantage.
      Corelight's Cloud Sensor for AWS, Azure, and GCP extends deep packet inspection and protocol
      parsing to cloud workloads, where most competitors offer only shallow flow-level visibility.

      The competitive feature gap is most visible in encrypted traffic analysis: Corelight generates
      rich metadata from TLS/SSL sessions without requiring decryption, using JA3/JA4 fingerprinting
      and TLS certificate analysis—a capability that flow-based competitors such as Cisco SNA cannot
      match architecturally. ExtraHop and Darktrace offer comparable encrypted traffic analysis through
      different mechanisms (passive wire data capture and Self-Learning AI pattern detection,
      respectively). Vectra AI provides strong cloud-native encrypted traffic analysis targeting
      Azure environments. The OT/ICS coverage dimension favors Darktrace (dedicated Darktrace/OT
      product line) and Corelight (Zeek ICS protocol parsers for DNP3, Modbus, and others), while
      Cisco SNA and Vectra AI lag in OT depth.

      Pricing across the NDR market is subscription-based, typically metered by network throughput
      capacity (Mbps or Gbps captured), number of sensors, or number of locations. No NDR vendor
      publicly discloses list pricing; enterprise contracts are negotiated based on deployment scope
      and support tier. Industry analyst estimates place enterprise NDR platform deals at $200,000
      to $2+ million annually. Corelight sensors are available as physical hardware appliances,
      virtual sensors, and cloud sensors for major IaaS platforms. Stamus Networks represents the
      most commercially disruptive pricing model with a single-license structure that includes no
      per-user or per-integration charges. Microsoft M365 E5 bundles network telemetry and SIEM
      at approximately $57 per user per month—near-zero incremental cost for M365-standardized
      enterprises and the most acute pricing challenge to standalone NDR justification.
