figures:
  - id: FE001
    title: "Corelight Open NDR Platform Architecture Map"
    type: stack
    layout: wide
    summary: >-
      Five-layer architecture stack depicting the Corelight Open NDR Platform from the network collection
      layer at the bottom through protocol analysis, ML and signature-based detection, investigation, and
      integration at the top. The open JSON export at the top layer is the architectural mechanism by which
      Corelight's 'Open NDR' branding is technically realized — logs flow up and out to any SIEM or data lake.
    data:
      layers:
        - label: "Layer 1: Collection & Packet Capture"
          detail: >-
            Physical sensors (1G/10G/100G), Virtual Sensors (ESXi/KVM), and Cloud Sensors (AWS VPC Traffic
            Mirroring, Azure vTAP, GCP Packet Mirroring) tap network traffic. Smart PCAP provides selective
            full-packet recording when detection events are triggered.
          tone: neutral
        - label: "Layer 2: Protocol Analysis & Zeek Log Generation (400+ Parsers)"
          detail: >-
            Zeek (open-source, Corelight-custodied) applies 400+ protocol parsers to produce structured JSON
            logs for every observed session — HTTP, DNS, SSL/TLS, SMB, Kerberos, SSH, SMTP, FTP, and dozens
            of specialized protocols. Outputs include connection metadata, application-layer records, and file
            transfer inventory.
          tone: positive
        - label: "Layer 3: Multi-Engine Detection (Suricata + ML + Zeek Analytics)"
          detail: >-
            Three parallel detection engines process the same traffic stream: Suricata IDS applies tens of
            thousands of signature-based rules; Zeek scripts encode behavioral detection logic; proprietary ML
            models score anomalous patterns including DGA, C2 beaconing, lateral movement, and protocol
            deviations. Encrypted Traffic Analysis (ETA/JA3) operates at this layer.
          tone: positive
        - label: "Layer 4: Investigation & Response (Corelight Investigator SaaS)"
          detail: >-
            Cloud-delivered Corelight Investigator provides a purpose-built threat investigation UI with
            AI-assisted triage, session timeline reconstruction, pivoting by IP/user/file SHA256, and
            integration with CrowdStrike Falcon for endpoint context. NDR Platform delivers this layer as a
            fully managed service.
          tone: positive
        - label: "Layer 5: Open Integration & Export (SIEM, Data Lake, SOAR)"
          detail: >-
            All Zeek logs are exported as open JSON to Splunk, Microsoft Sentinel, Google Chronicle,
            IBM QRadar, Elasticsearch, and Apache Kafka. The open data model is the defining architectural
            commitment — customers are not locked to Corelight's proprietary analytics tooling.
          tone: positive
    claimRefs: [CE001, CE003, CE004, CE010, CE011, CE032, CE040]

  - id: FE002
    title: "SOC and Incident Response Workflow with Corelight"
    type: flow
    layout: wide
    summary: >-
      Seven-node flow diagram tracing the path from network packet capture through Zeek log generation,
      SIEM ingestion, detection, analyst triage, IR investigation, and remediation. Illustrates how
      Corelight sits at the 'evidence generation' step, providing structured telemetry consumed by
      downstream SOC tools rather than requiring analysts to operate a separate Corelight-only console.
    data:
      nodes:
        - id: network-tap
          label: "Network Traffic (TAP / Mirror)"
          detail: >-
            Raw packet stream from physical TAP, SPAN port, or cloud provider mirroring API (AWS/Azure/GCP)
            feeds the Corelight sensor continuously.
          tone: neutral
        - id: sensor-processing
          label: "Corelight Sensor Processing"
          detail: >-
            Zeek engine parses 400+ protocols; Suricata applies IDS signatures; ML models score behavioral
            anomalies; Smart PCAP optionally records full packets for triggered events.
          tone: positive
        - id: log-generation
          label: "Structured Zeek Log Generation (JSON)"
          detail: >-
            Session logs, DNS records, HTTP transactions, SSL/TLS metadata, file transfers, and detection
            notices output as structured JSON — the core 'network evidence' product.
          tone: positive
        - id: siem-ingestion
          label: "SIEM / Data Lake Ingestion"
          detail: >-
            Zeek logs forwarded to Splunk, Microsoft Sentinel, Elasticsearch, Google Chronicle, IBM QRadar,
            or a data lake via Apache Kafka; no Corelight-proprietary console required for analytics.
          tone: positive
        - id: detection-alerting
          label: "Threat Detection and AI Triage"
          detail: >-
            SIEM correlation rules, Corelight detection packages, and AI triage features score and
            prioritize alerts; Investigator SaaS surfaces highest-fidelity network evidence to analysts.
          tone: positive
        - id: ir-investigation
          label: "IR Investigation and Timeline Reconstruction"
          detail: >-
            SOC analyst pivots from alert to full session context, DNS history, file hashes, and lateral
            movement paths using Corelight Investigator or SIEM queries on Zeek log data.
          tone: positive
        - id: remediation
          label: "Remediation and Response Action"
          detail: >-
            Analyst triggers endpoint isolation via CrowdStrike Falcon API enrichment or SOAR playbook;
            network block instructions sent to firewall; Smart PCAP evidence preserved for forensic record.
          tone: positive
      edges:
        - from: network-tap
          to: sensor-processing
          label: "Packet stream"
        - from: sensor-processing
          to: log-generation
          label: "Zeek parsing"
        - from: log-generation
          to: siem-ingestion
          label: "JSON log export"
        - from: siem-ingestion
          to: detection-alerting
          label: "SIEM analytics"
        - from: detection-alerting
          to: ir-investigation
          label: "Alert queue"
        - from: ir-investigation
          to: remediation
          label: "Response action"
    claimRefs: [CE001, CE003, CE011, CE018, CE021, CE023, CE032]

  - id: FE003
    title: "Corelight Critical Dependency Map"
    type: dag
    layout: wide
    summary: >-
      Directed acyclic graph mapping Corelight's eight critical dependencies and the directional relationships
      that create platform risk. The two most significant upstream dependencies are the Zeek and Suricata
      open-source projects, where a critical vulnerability or governance change would propagate directly into
      the commercial platform. Cloud provider API dependencies are significant for the growing cloud sensor
      product line.
    data:
      nodes:
        - id: corelight-platform
          label: "Corelight Commercial Platform"
          detail: "The integrated Open NDR Platform combining all sensors, detection, and SaaS services."
          tone: positive
        - id: zeek-oss
          label: "Zeek Open Source (Corelight-custodied)"
          detail: >-
            Core protocol analysis engine; 400+ parsers; Corelight is primary maintainer, reducing fork risk
            but creating key-person dependency on Zeek committers.
          tone: positive
        - id: suricata-oss
          label: "Suricata Open Source (OISF)"
          detail: >-
            IDS/IPS engine for signature-based detection; maintained by OISF independent of Corelight;
            Corelight contributes but does not control the project.
          tone: neutral
        - id: cloud-infra-aws-azure-gcp
          label: "Cloud Provider Mirroring APIs (AWS/Azure/GCP)"
          detail: >-
            Cloud sensor relies on AWS VPC Traffic Mirroring, Azure vTAP, and GCP Packet Mirroring APIs;
            API changes or deprecation would break cloud sensor functionality.
          tone: neutral
        - id: hardware-supply
          label: "Hardware Supply Chain (Physical Sensors)"
          detail: >-
            Physical sensors require network hardware components; supply chain concentration or
            component shortage creates fulfillment risk for hardware appliance revenue stream.
          tone: neutral
        - id: ml-threat-intel
          label: "ML Models and Threat Intelligence Feeds"
          detail: >-
            Proprietary ML detection models require training data and threat intelligence feeds;
            feed freshness and model update cadence affect detection fidelity.
          tone: neutral
        - id: siem-integration-partners
          label: "SIEM Integration Partners (Splunk, Sentinel, Chronicle, QRadar, Elastic)"
          detail: >-
            SIEM API changes or competitive moves by integration partners could break or disadvantage
            Corelight's integration quality; Splunk acquisition by Cisco creates strategic complexity.
          tone: neutral
        - id: crowdstrike-api
          label: "CrowdStrike Falcon Enrichment API"
          detail: >-
            Endpoint-to-network correlation feature depends on CrowdStrike Falcon API availability;
            CrowdStrike is both a strategic investor and a potential competitor in XDR.
          tone: neutral
      edges:
        - from: zeek-oss
          to: corelight-platform
          label: "Core parsing engine"
        - from: suricata-oss
          to: corelight-platform
          label: "IDS signature layer"
        - from: cloud-infra-aws-azure-gcp
          to: corelight-platform
          label: "Cloud sensor infrastructure"
        - from: hardware-supply
          to: corelight-platform
          label: "Physical sensor hardware"
        - from: ml-threat-intel
          to: corelight-platform
          label: "ML detection layer"
        - from: siem-integration-partners
          to: corelight-platform
          label: "Integration targets"
        - from: crowdstrike-api
          to: corelight-platform
          label: "Endpoint enrichment"
    claimRefs: [CE001, CE007, CE010, CE021, CE039, CE040]

