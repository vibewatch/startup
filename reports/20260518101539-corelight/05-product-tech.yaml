company:
  name: "Corelight, Inc."
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Corelight's Open NDR Platform is built on Zeek, the open-source network security monitor created by co-founder Vern
    Paxson at Lawrence Berkeley National Laboratory. The commercial platform wraps Zeek's 400-plus protocol parsers with
    Suricata IDS signatures, ML-based behavioral analytics, and Smart PCAP to produce structured JSON network evidence.
    Five product lines cover the full deployment spectrum: physical sensors at 1G/10G/100G, virtual sensors (VMware
    ESXi/KVM), cloud sensors (AWS VPC Traffic Mirroring, Azure vTAP, GCP Packet Mirroring), the Corelight Investigator
    SaaS investigation UI, and the cloud-managed NDR Platform. Key differentiators include Encrypted Traffic Analysis
    for TLS inspection without decryption, an open data model enabling export to any SIEM or data lake, and
    custodianship of the Zeek open-source project. The platform integrates natively with Splunk, Microsoft Sentinel,
    Google Chronicle, IBM QRadar, Elasticsearch, CrowdStrike Falcon, and Apache Kafka. Trust posture includes SOC 2
    Type II and ISO 27001 certifications; FedRAMP authorization is in progress as of 2026. Sensor v29 introduced ML
    detection package enhancements; GCP Cloud Sensor reached GA; AI-powered investigation features have been released
    into the Investigator SaaS product. Key diligence gaps are the specific ML model architecture, FedRAMP timeline,
    OT/ICS protocol depth, and independent performance benchmarks for large-scale enterprise deployments.

sections:
  - id: product-portfolio-overview
    title: "Product Portfolio: Five Lines Covering On-Premises, Virtual, Cloud, and Managed NDR"
    body: >-
      Corelight markets five distinct product lines that collectively address network detection and response (NDR) across
      on-premises data centers, virtualized environments, cloud-native workloads, and fully managed deployments.
      The flagship offering is the Corelight Sensor, a purpose-built physical network appliance available in 1G, 10G,
      and 100G throughput variants designed to tap high-speed enterprise network links and produce rich Zeek-based
      telemetry. Physical sensors are the most mature offering and carry the strongest compliance posture, having
      undergone the most rigorous enterprise production validation. The Corelight Virtual Sensor targets customers who
      cannot deploy physical taps, supporting VMware ESXi and KVM hypervisors for deployment inside virtualized data
      centers and private clouds. The Corelight Cloud Sensor addresses the growing share of enterprise workloads
      running in public cloud environments, supporting AWS VPC Traffic Mirroring, Azure vTAP, and GCP Packet Mirroring
      as of its 2024-2025 GA release for all three major cloud providers. Corelight Investigator is a cloud-delivered
      SaaS web application providing security analysts with an intuitive threat investigation UI layered on top of the
      structured log data produced by any Corelight sensor type. The fifth product, the Corelight NDR Platform, is a
      cloud-based managed detection service providing continuous threat monitoring for organizations that do not want
      to operate the analytics infrastructure themselves. Together these five lines allow Corelight to address
      enterprise accounts with heterogeneous infrastructure, reducing the need for multiple vendor relationships and
      positioning Corelight as a full-stack network visibility solution rather than a point product. A key strategic
      decision embedded in the portfolio is the open data model: every product line exports structured JSON logs
      compatible with any SIEM or data lake, which prevents customer lock-in to proprietary analytics formats and is a
      deliberate competitive differentiator versus closed NDR competitors.
    claimRefs: [CE004, CE005, CE006, CE007, CE008, CE009, CE032, CE040]
    tableRefs: [TE001]
    figureRefs: [FE001]

  - id: core-technical-architecture
    title: "Core Technical Architecture: Zeek Engine, Protocol Parsing, and Open Data Model"
    body: >-
      Corelight's technical architecture centers on Zeek (formerly Bro), the open-source network security monitor
      originally developed at Lawrence Berkeley National Laboratory by co-founder Vern Paxson. Zeek functions as a
      stateful network analysis framework that intercepts raw packet streams and applies a scripting-language-driven
      analysis pipeline to produce structured, application-layer log records. Corelight ships Zeek with over 400
      protocol parsers covering HTTP/HTTPS, DNS, SSL/TLS, SMTP, FTP, SSH, Kerberos, LDAP, SMB/DCE-RPC, RDP,
      and dozens of specialized protocols, each producing typed JSON log records. This breadth of protocol coverage
      allows analysts to reconstruct the precise sequence of transactions in any observed network session without
      capturing raw packets by default, dramatically reducing storage requirements compared to full PCAP-based
      approaches. Corelight supplements Zeek's scripted analytics with Suricata IDS, an open-source intrusion
      detection engine running in parallel to apply tens of thousands of community signatures and custom detection
      rules against the same traffic stream. The combination gives analysts both behavioral (Zeek) and
      signature-based (Suricata) detection in a single integrated pipeline. Machine learning models provide a third
      analytics layer, trained to identify anomalous communication patterns that neither deterministic Zeek scripts
      nor static Suricata signatures would flag. The core data output is the Zeek log set: structured JSON files
      organized by protocol and session type, exportable directly to Splunk, Elasticsearch, Microsoft Sentinel,
      Google Chronicle, IBM QRadar, or any data lake via Apache Kafka. The open data model—a deliberate design
      principle—means customers are not locked into Corelight's proprietary analytics; the same log data can be
      queried in the customer's preferred tool, unlike closed NDR platforms that require proprietary dashboards. An
      important architectural component is Corelight's custodianship of the Zeek open-source project: the company
      is the primary financial backer and code contributor, granting it a privileged position in the Zeek roadmap
      and ensuring commercial feature priorities flow back into the open-source base. The Zeek Community ID standard
      (github.com/corelight/zeek-community-id), which provides a deterministic hash for network flow correlation
      across heterogeneous tools, is a Corelight-originated open-source contribution now adopted across multiple
      security products.
    claimRefs: [CE001, CE002, CE003, CE010, CE029, CE032, CE037, CE040]
    tableRefs: [TE003]
    figureRefs: [FE003]

  - id: key-capabilities-and-detection
    title: "Key Detection Capabilities: ETA, ML Analytics, Smart PCAP, and MITRE Coverage"
    body: >-
      Corelight delivers a layered detection capability set that addresses both the breadth of protocol visibility and
      the depth of behavioral analysis required for modern enterprise SOC operations. Encrypted Traffic Analysis (ETA)
      is among the most strategically significant capabilities: by extracting cipher suite metadata, certificate chain
      details, JA3/JA3S fingerprints, and behavioral features from TLS handshakes without decrypting session content,
      Corelight can identify suspicious encrypted communication patterns—including command-and-control channels,
      malware beaconing, and anomalous certificate usage—while preserving data privacy and avoiding the legal and
      performance complexities of full TLS interception. Smart PCAP provides selective full-packet capture: rather than
      continuously storing multi-terabyte PCAP files, Smart PCAP records complete packet data only when a detection
      event triggers a capture window, providing the forensic detail of PCAP at a fraction of the storage cost.
      Domain Generation Algorithm (DGA) detection identifies malware that uses algorithmically generated domain names
      for command-and-control rendezvous, an evasion technique that bypasses static blacklists. Command and control
      (C2) traffic detection combines ML-based beaconing analysis, Suricata signatures, and Zeek protocol metadata
      to flag adversary infrastructure communications. Lateral movement detection tracks internal network behaviors
      consistent with credential theft, pass-the-hash, Kerberoasting, and SMB-based traversal. File analysis
      capabilities include SHA256 hashing and MIME type detection for every file transferred across observed protocols,
      creating a searchable inventory of file transfers without storing file contents by default. The platform claims
      coverage of more than 80 MITRE ATT&CK tactics, techniques, and procedures (TTPs) and ships with over 70,000
      out-of-the-box detection signatures. Company-claimed performance benchmarks include 95% faster incident response
      and 4:1 tool consolidation versus alternatives, though these claims have not been independently audited. The
      Black Hat conference NOC deployment and Mandiant/CrowdStrike partnerships serve as informal performance proof
      points in high-fidelity, high-volume environments.
    claimRefs: [CE011, CE012, CE013, CE014, CE015, CE016, CE017, CE033, CE034, CE035, CE036, CE042]
    tableRefs: [TE002]
    figureRefs: [FE002]

  - id: integrations-and-partner-ecosystem
    title: "Integrations and Partner Ecosystem: SIEM, XDR, and Open Export"
    body: >-
      Corelight's integration strategy is built around the principle that network evidence should flow into the
      customer's existing security stack rather than requiring analysts to adopt a proprietary Corelight console.
      The Corelight for Splunk application, available on the Splunk marketplace, packages pre-built dashboards,
      correlation searches, and sourcetype configurations to ingest Zeek logs directly into Splunk Enterprise
      or Splunk Cloud, enabling analysts to use familiar SPL queries on network evidence alongside endpoint and
      identity telemetry. Microsoft Sentinel integration is provided via a dedicated data connector that maps
      Zeek log fields to the Azure Monitor log schema, supporting KQL-based analytics and MITRE ATT&CK workbooks
      within the Sentinel native environment. A blog post from Corelight in 2024 described the Sentinel integration
      as enabling smarter alert triage and reducing analyst fatigue by combining Corelight's high-fidelity network
      evidence with Sentinel's AI-driven analytics. Google Chronicle integration provides a cloud-native SIEM path
      for organizations on the Google security stack. IBM QRadar support is provided via a Device Support Module (DSM)
      enabling Corelight log normalization within QRadar. Elasticsearch, Kibana, and OpenSearch are supported as
      direct export targets for customers operating open-source SIEM stacks. Apache Kafka is supported for
      high-throughput log streaming to data lakes, SOAR platforms, and custom analytics pipelines. The CrowdStrike
      Falcon integration—bolstered by CrowdStrike's strategic investment in Corelight—provides API-driven enrichment
      that correlates network session evidence from Corelight with endpoint process and threat telemetry from the
      CrowdStrike Falcon platform, enabling analysts to pivot from a suspicious network connection to the specific
      endpoint process that initiated it. The Cisco XDR integration, announced in 2024, feeds Corelight high-fidelity
      network evidence into Cisco's extended detection and response platform, leveraging Corelight's sensor network
      as a telemetry source for Cisco's AI-driven correlation engine. These partnerships mean that Corelight sensors
      function as a foundational network evidence layer in multiple larger security platforms rather than only as a
      standalone NDR tool.
    claimRefs: [CE018, CE019, CE020, CE021, CE022, CE023, CE024, CE038, CE041]

  - id: trust-compliance-security-posture
    title: "Trust, Compliance, and Security Posture"
    body: >-
      Corelight has invested in enterprise trust certifications appropriate for its target market of Fortune 500
      corporations and federal government agencies. The company holds a SOC 2 Type II certification, confirming
      that an independent auditor has examined its security, availability, processing integrity, confidentiality,
      and privacy controls over a defined period and found them to meet the AICPA Trust Services Criteria. ISO
      27001 certification attests to a formally structured information security management system (ISMS) aligned
      to the international standard, which is an increasingly common requirement for European and multinational
      enterprise procurement. HIPAA-capable status means Corelight's deployment architecture can be configured
      to handle PHI-adjacent network telemetry in healthcare environments, though HIPAA is not an auditable
      certification in the same sense as SOC 2 or ISO 27001. FedRAMP authorization is in progress as of early
      2026; for federal government customers that require FedRAMP-authorized cloud services, the current status
      represents a procurement barrier that limits addressable market in the civilian agency segment until
      authorization is complete. Corelight's architecture separates sensor data processing (on-premises or in
      the customer's cloud environment) from the management plane (Corelight SaaS services), which gives
      customers the option to keep all raw network telemetry within their own environment—a significant selling
      point for data-sovereignty-sensitive buyers including government agencies and regulated enterprises.
      The open-core model introduces a dependency risk: if a significant security vulnerability is discovered in
      the Zeek or Suricata open-source base, Corelight is responsible for patching and distributing updated
      sensor software, creating a potential lag between public vulnerability disclosure and enterprise patch
      deployment. No public bug bounty program or coordinated vulnerability disclosure policy has been
      confirmed from public sources as of May 2026, representing a diligence gap for security-conscious
      enterprise buyers. The company's physical sensor appliances undergo hardware validation and the
      software distribution chain is managed through Corelight's commercial update mechanism, separate from
      the upstream Zeek open-source release cadence.
    claimRefs: [CE025, CE026, CE027, CE028]
    tableRefs: [TE004]
    figureRefs: [FE004]

  - id: product-roadmap-recent-releases
    title: "Product Roadmap and Recent Releases: Sensor v29, GCP GA, and AI Investigation Features"
    body: >-
      Corelight's recent product release cadence reflects a strategic push on three fronts: machine learning
      enhancement, cloud coverage expansion, and AI-driven investigation productivity. Sensor v29, released in
      the 2024-2025 timeframe, was the most significant hardware sensor milestone, introducing enhanced ML
      detection packages, new protocol coverage extensions, and improved detection fidelity for encrypted
      traffic analysis scenarios. Corelight published a dedicated blog post describing the ML improvements
      in v29 as a step toward 'modernizing threat detection' by reducing false positives and improving the
      signal-to-noise ratio for SOC analysts dealing with alert fatigue. The Cloud Sensor for GCP achieved
      general availability, completing Corelight's public cloud sensor coverage across all three major cloud
      providers (AWS, Azure, GCP) and enabling customers with Google Cloud workloads to apply the same
      Zeek-based network telemetry to GCP environments that they run on-premises. AI-powered investigation
      features in the Corelight Investigator SaaS product have been progressively introduced, including AI
      triage capabilities that score and prioritize network evidence to surface the most investigation-worthy
      sessions to analysts. The Microsoft Sentinel integration and a refreshed Cisco XDR integration were
      announced in 2024, expanding the reach of Corelight network evidence into cloud-native SIEM and XDR
      workflows. Looking forward, Corelight's roadmap emphasis on AI-assisted investigation and expanded cloud
      sensor coverage reflects the broader NDR market trajectory toward SaaS delivery and AI-augmented SOC
      operations. Diligence gaps in roadmap validation include the absence of a public changelog or detailed
      release notes for sensor software versions beyond blog-post summaries, no confirmed timeline for FedRAMP
      authorization completion, limited documentation of OT/ICS protocol roadmap items, and no public product
      demo or benchmark data for AI triage features. These gaps are standard for a private growth-stage vendor
      but represent specific due-diligence items for investors assessing long-term product defensibility.
    claimRefs: [CE029, CE030, CE031, CE033, CE034, CE041]
    tableRefs: [TE005]

callouts:
  - calloutType: strength
    title: "Open Data Model as Strategic Differentiator"
    body: >-
      Corelight's architectural decision to expose all network evidence as open JSON logs—rather than proprietary
      formats—gives it a durable competitive advantage with data-sovereign enterprise buyers and SIEM-invested
      security teams. ESG research commissioned by Corelight found that open NDR approaches outperform closed
      black-box alternatives for integration flexibility and SOC productivity.
    claimRefs: [CE032, CE040]

  - calloutType: strength
    title: "Zeek Custodianship Creates Protocol Coverage Moat"
    body: >-
      As the primary financial backer and code contributor to the Zeek open-source project, Corelight has
      privileged access to the protocol parsing roadmap and can ship commercial detection capabilities days to
      weeks ahead of any competitor who builds on the same open-source base without direct project influence.
      The 400+ protocol parser library and Zeek Community ID standard are concrete manifestations of this moat.
    claimRefs: [CE001, CE003, CE037, CE039]

  - calloutType: risk
    title: "FedRAMP Authorization Gap Limits Federal Revenue Until Completion"
    body: >-
      Corelight's FedRAMP authorization remains in progress as of mid-2026. Until authorization is complete,
      federal civilian agency customers cannot deploy Corelight's cloud-delivered products under their standard
      FedRAMP procurement requirements, limiting cloud-delivered NDR revenue from the U.S. federal segment—a
      historically strong market for Corelight given its LBNL and government research heritage.
    claimRefs: [CE027]

  - calloutType: risk
    title: "Open-Source Dependency Risk: Zeek and Suricata Vulnerability Surface"
    body: >-
      Because the sensor core depends on Zeek and Suricata open-source projects, any critical vulnerability
      discovered upstream creates an obligation for Corelight to patch and distribute updated sensor binaries
      quickly across its enterprise customer base. The lag between upstream CVE disclosure and enterprise patch
      deployment is a managed but real risk, especially in air-gapped federal environments where software
      updates require additional approval cycles.
    claimRefs: [CE001, CE010, CE040]

  - calloutType: insight
    title: "Sensor v29 ML Enhancements Reflect Detection-Quality Competition"
    body: >-
      The Sensor v29 release's emphasis on ML detection package improvements signals that Corelight is competing
      on detection quality, not just protocol coverage. As competitors like Vectra AI and Darktrace advance
      unsupervised learning capabilities, Corelight's roadmap investment in ML detection fidelity is necessary
      to maintain differentiation beyond the Zeek protocol-parsing moat alone.
    claimRefs: [CE029, CE013]

