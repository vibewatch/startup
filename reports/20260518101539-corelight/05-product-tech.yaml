  evidenceGaps:
    - id: EGE001
      topic: "Corelight sensor technical documentation"
      description: >-
        docs.corelight.com returned HTTP 401 during research, blocking access to official sensor
        deployment guides, protocol parser documentation, and API references. The technical architecture
        described in this chapter is reconstructed from blog posts, product pages, and Zeek open-source
        documentation rather than official Corelight technical docs. Performance reliability metrics
        and drop-rate data are not publicly disclosed.
      impact: medium
      relatedQuestionRefs: [QE021]
      diligencePath: >-
        Request access to the Corelight technical documentation portal and sensor deployment guides
        directly from Corelight during due diligence.

    - id: EGE002
      topic: "ML model architecture and detection quality benchmarks"
      description: >-
        Corelight does not publicly document its ML anomaly detection model architecture, training data
        sources, versioning policy, false-positive rates, or benchmark comparisons. The Sensor v29 ML
        enhancements are described only in high-level blog posts without technical specifics.
      impact: high
      diligencePath: >-
        Request technical white paper on ML detection methodology, false-positive rate data, and
        third-party evaluation (e.g., NSS Labs equivalent) during due diligence.

    - id: EGE003
      topic: "FedRAMP authorization timeline and scope"
      description: >-
        Corelight has not disclosed a specific FedRAMP authorization timeline or the exact scope of
        products under authorization review. The absence of Corelight from the FedRAMP Marketplace
        authorized product list as of mid-2026 confirms authorization is not yet complete.
      impact: medium
      diligencePath: >-
        Check the FedRAMP Marketplace (fedramp.gov) for current status; request Corelight FedRAMP
        authorization timeline, agency sponsor name, and authorization scope in due diligence.

    - id: EGE004
      topic: "Physical sensor manufacturing supply chain and hardware BOM"
      description: >-
        Corelight does not publicly disclose its physical sensor hardware supply chain, manufacturing
        partners, component BOM, or lead times. Supply chain concentration and component availability
        risk cannot be assessed from public sources.
      impact: low
      diligencePath: >-
        Request hardware BOM summary, manufacturing partner names, and component lead time data
        from Corelight operations team during due diligence.

    - id: EGE005
      topic: "Vulnerability disclosure policy and CVE history"
      description: >-
        No public Corelight PSIRT, bug bounty program, or coordinated vulnerability disclosure policy
        was identified. Historical CVE exposure from Zeek and Suricata open-source components is
        documentable via public CVE databases but Corelight-specific sensor CVE history is not available
        from public sources.
      impact: medium
      relatedQuestionRefs: [QE024]
      diligencePath: >-
        Request Corelight PSIRT policy, historical CVE list for sensor software, responsible disclosure
        contacts, and patch SLA commitments during due diligence.

