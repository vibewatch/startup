  topStrengths:
    - 久经战场验证的乌克兰无人平台叠加 London 法律封装，形成差异化盟友采购故事，少有种子阶段同行能做到。
    - 投资人和领导层质量在种子阶段罕见地强：Lakestar、Shield Capital，加上拥有真实国防政策触达的创始人和官员。
    - NATO、EU、UK 和 U.S. 无人机与反无人机支出的结构性顺风，支撑了大机会集；前提是 UForce 能把战场验证转化为重复主权项目。
  topRisks:
    - 公开证据没有披露经审计收入、毛利率、烧钱速度、客户集中度或股权结构经济性，使 $1B 种子估值难以分析性承销。
    - UForce 的价值主张可能依赖上游乌克兰平台的权利、排他性和可靠本地化，但公开材料没有完整记录。
    - 即使战场验证真实，出口管制、自主系统问责审查，以及西方保障 / 资质要求，都可能拖慢采购转化。
  unresolvedGaps:
    - 订单转收入、回款时间、毛利率拆分和当前现金跑道，需要管理层在 NDA 下披露。
    - 具名客户合同、复购证据、集中度数据和验收里程碑，在公开来源中基本缺失。
    - 海、空、陆和软件产品的平台级权利、排他性、可出口性和本地化许可，公开资料记录仍不足。
