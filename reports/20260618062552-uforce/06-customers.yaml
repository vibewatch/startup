- id: durability-and-repeat-proxies
  title: Durability is proxied by mission recurrence, not by renewal metrics
  body: 'Public durability evidence is much weaker than public adoption evidence. No reviewed source discloses net revenue retention, gross revenue retention, customer churn, contract length, cohort renewal, or satisfaction metrics. That leaves the chapter relying on repeat-usage proxies instead of finance-style retention data. The best proxy is operational recurrence: Magura is described as having participated in hundreds of missions, U-C2 claims nightly multi-vendor swarm coordination in contested electronic-warfare environments, and the company says operator choice matters inside Ukraine’s procurement system. These points matter because they suggest that end users are not just seeing one-off demonstrations; they are returning to the systems in repeated operations. The direct-government turnkey model also supports a plausible stickiness thesis once systems are integrated into doctrine, training, and support workflows. Still, none of this proves reorder cadence, contract renewal, or installed-base
    durability. The prudent reading is that UForce likely has real repeat usage where its systems are already operational, but the commercial durability of that usage remains mostly private.'
