- id: expansion-and-concentration-risks
  title: Expansion paths are real, but procurement friction and concentration are still under-disclosed
  body: 'Expansion opportunities are visible in public sources, but so are the obstacles. The U.S. CEO announcement names government engagement, strategic partnerships, domestic manufacturing, maritime use cases, and critical-infrastructure integration as the next expansion surfaces. Broader policy sources reinforce that these are not hypothetical markets: BCG sees military and critical-infrastructure counter-drone demand widening sharply across Europe, while EU and NATO discussions are converging around joint procurement, testing, interoperability, and industrial scale. At the same time, procurement friction is substantial. UK export-control rules cover military goods, software, technology, and some brokering activity; the UK Defence Drone Strategy emphasizes faster but more standards-driven acquisition; Inside Unmanned highlights trusted labels, harmonized testing, and data interoperability; and ASIS shows how foreign-drone restrictions can disrupt operations while domestic supply chains
    catch up. This is where proof-versus-production risk lives. UForce may have credible battlefield and exercise proof, yet allied buyers increasingly want documented, licensable, localizable, and politically supportable supply. Because named foreign awards and top-customer share are not public, concentration risk should be treated as unresolved, not benign.'
