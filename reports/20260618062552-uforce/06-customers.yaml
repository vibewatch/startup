    items:
    - label: Battlefield proof
      detail: Systems gain credibility through repeated wartime use by Ukrainian operator communities.
    - label: Exercise validation
      detail: NATO and allied experimentation channels test interoperability, doctrine fit, and red-team performance.
    - label: Procurement screening
      detail: Allied ministries or service branches use endorsement, testing, and market-engagement gates before any scaled award.
    - label: Localization and integration
      detail: Manufacturing, export control, documentation, and systems integration work are needed to make the offer awardable.
    - label: Fielding and repeat support
      detail: Only after deployment do sustainment, reorder, and renewal economics become visible to the buyer.
  approximationNotes: The journey is a synthesized procurement path inferred from public battlefield, exercise, and policy sources because UForce does not publish an actual customer lifecycle map.
