- id: adoption-and-named-proof
  title: Adoption proof is strongest in Ukraine and NATO exercises, not in named foreign awards
  body: 'The most supportable adoption story starts inside Ukraine, where multiple sources describe extensive use of the systems and very high mission volume. Public numbers are not perfectly harmonized: U-C2 claims more than 150,000 combat missions managed, the U.S. CEO page says more than 200,000 missions supported, and Orbital Today repeats a 150,000-plus figure. That is enough to show real operational recurrence, but not enough to derive account counts or fleet utilization denominators. Outside Ukraine, named proof becomes thinner but not empty. NATO and Defense News confirm that Ukraine’s Navy brought real-world operational experience into REPMUS/Dynamic Messenger 2025, while UForce’s own sea-platform page says Magura was validated there against NATO Blue Forces. The Royal Navy calling notice matters because it shows a formal allied channel through which industry can secure endorsement to participate in experimentation as systems move toward operational service. These are meaningful
    customer-proof surfaces because they show how battlefield systems can reach allied evaluation and doctrine channels, but they are still a step short of published ministry awards or serial procurement announcements.'
