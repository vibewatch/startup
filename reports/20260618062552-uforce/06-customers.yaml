  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-foreign-customers
    missingEvidence: Named allied ministry, service-branch, or agency contracts with award date, scope, acceptance milestone, and current status.
    whyItMatters: Without named awards, exercise validation can be mistaken for procurement traction and concentration cannot be sized.
    diligencePath: Request contract register, pilot-to-production conversion list, and at least two customer reference calls from non-Ukrainian buyers.
    relatedQuestionRefs:
    - QU005
    - QU011
    - QU016
    - QU024
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, contract length, renewal timing, satisfaction metrics, and reorder cadence by programme.
    whyItMatters: Operational repeat usage does not prove commercial durability or predict future revenue quality.
    diligencePath: Request cohort retention pack, renewal calendar, customer health dashboard, and post-delivery support attachment data.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer exposure by revenue, backlog, geography, and product family.
    whyItMatters: If a small set of sovereign accounts dominates bookings, procurement delays or policy shifts could materially change results.
    diligencePath: Request customer concentration table, backlog by country, and downside analysis for the largest two accounts.
    relatedQuestionRefs:
    - QU016
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: channel-partners
    missingEvidence: Named integration, telecom, manufacturing, and localization partners with role and exclusivity terms.
    whyItMatters: Expansion into critical infrastructure and allied domestic-production channels may depend more on partners than on raw platform performance.
    diligencePath: Request partner list, contract summaries, manufacturing map, and evidence of joint customer pursuits.
    relatedQuestionRefs:
    - QU019
    - QU017
    - QU018
    relatedTableRefs:
    - TU001
    - TU006
  - type: missing-source
    severity: material
    topic: proof-to-production
    missingEvidence: Independent after-action reports, certification artifacts, export-licence workflow data, and examples where exercise participation converted into production deployment.
    whyItMatters: The biggest remaining risk is that validation remains impressive but non-commercial.
    diligencePath: Request REPMUS-related debriefs, standards documentation, export-licence history, and post-exercise pipeline progression.
