chapter:
  number: 6
  title: Customers
  summary: 'Public customer proof for UForce is meaningful but narrow: the strongest evidence is Ukrainian operational use, NATO-adjacent experimentation, and a direct-government contracting model rather than a disclosed list of allied ministry accounts. The chapter’s main conclusion is that UForce appears to sell into sovereign and operator-led workflows with credible battlefield and exercise validation, but retention, renewal, contract concentration, and named foreign customer awards remain largely private.'
sections:
- id: customer-segmentation
  title: Operational users are visible; institutional payers are mostly inferred
  body: 'UForce’s public customer picture should be segmented more carefully than a generic “allied militaries” label. The clearest public user community is Ukrainian operational units and operator communities that have employed the underlying systems in wartime. The clearest public payer model comes from Inventure’s neoprime description, which frames UForce as a contractor that signs direct government deals and then delivers turnkey combat systems assembled from its own and subcontracted capabilities. That means the user, buyer, and payer are not the same actor: frontline operators choose and validate equipment, but sovereign buyers or ministries are the probable contracting counterparties. A second segment is allied ministries of defence and service branches that are being targeted for adoption, even when public awards are not disclosed. A third segment is the NATO experimentation and training ecosystem, where Ukrainian operator knowledge is translated into allied interoperability and
    doctrine learning. A fourth segment is the maritime-security and critical-infrastructure adjacency now named in the U.S. expansion announcement. A fifth segment is channel and integration partners that matter when local manufacturing, certification, and system-level deployment are required. The result is a customer map with real operational credibility but limited public account naming.'
