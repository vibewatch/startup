tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Current public proof
  - Strategic value
  - Main gap
  rows:
  - - Ukrainian operational users / operator communities
    - User = frontline operators; buyer/payer can still be state procurement channels
    - Strike, maritime denial, swarm operations, recon, counter-drone missions
    - 'Strongest public proof: battlefield use, mission counts, operator-choice quote'
    - Proves systems solve real wartime jobs and creates reference credibility
    - No public unit-level roster or fleet-by-unit denominator
  - - Allied ministries of defence and service branches
    - Buyer/payer = sovereign ministry or service; user = operators and units
    - Adopt Ukraine-proven autonomous capability for air, sea, land, and C-UAS missions
    - Launch materials and news coverage explicitly target allied militaries
    - Largest revenue pool and the core neoprime contracting thesis
    - Named foreign awards are not public
  - - NATO experimentation and training ecosystems
    - User = exercise staff, operators, evaluators; payer = national defence organisations
    - Interoperability testing, doctrine learning, red-team validation
    - REPMUS/DYMS, Ukraine OPFOR role, Royal Navy endorsement channel
    - Bridge from battlefield proof into allied evaluation and doctrine
    - Exercise presence is not the same as programme of record
  - - Maritime security and critical-infrastructure adjacencies
    - Buyer could include defence, maritime-security, or infrastructure operators; user = security teams
    - Protect ports, vessels, airfields, energy, and other exposed sites
    - U.S. CEO announcement plus BCG and EU policy demand context
    - Expands TAM beyond classic defence procurement
    - No named customer references in these adjacencies
  - - Channel / integration / manufacturing partners
    - Buyer = prime or local partner; user = procurement and fielding teams; payer = government or prime
    - Localization, integration, documentation, sustainment, and standards compliance
    - Strategic partnerships and U.S. manufacturing are named, but specific partners are not
    - Can accelerate customer conversion where local content matters
    - Named partner roster and revenue split are not public
  notes: Segmentation separates public operational proof from inferred payer identity. It is strongest on operator communities and weakest on named foreign accounts or partner economics.
