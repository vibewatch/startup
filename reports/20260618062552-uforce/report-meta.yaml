companyProfile:
  summary: UForce is a London-headquartered defense technology company formally incorporated in the United Kingdom in January 2025 and publicly launched in March 2026. It aggregates battle-proven Ukrainian autonomous systems across sea, air, land, counter-UAS, and multi-domain C2 into a Western-facing government-contract platform backed by Lakestar, Shield Capital, and Ballistic Ventures. Public evidence supports a $50 million seed round at a $1 billion valuation and a credible wartime-to-allied-commercialization thesis, but not audited revenue or contract-quality visibility.
