      claimRefs: [CO015, CO016]
    - name: Oleksiy Honcharuk
      role: Co-founder & Board Chairman
      background: Former Prime Minister of Ukraine and adviser to the Unmanned Systems Forces, linking battlefield operator insight with state-level procurement context.
