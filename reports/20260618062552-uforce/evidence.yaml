evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-disclosure
    missingEvidence: Named ministries of defence, contract values, acceptance milestones, and renewal schedules.
    whyItMatters: Customer quality and concentration cannot be judged from anonymous allied-market references alone.
    diligencePath: Request top-customer list, signed contract abstracts, and delivery milestones under NDA.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Post-seed ownership percentages, board seats, liquidation preferences, and investor protective provisions.
    whyItMatters: A $1B entry valuation can look very different depending on preference stack and governance control.
    diligencePath: Request cap table, financing documents, and board observer/right schedules from counsel.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 public leadership coverage
    missingEvidence: Full board roster, committee assignments, and succession planning beyond the publicly named leadership set.
    whyItMatters: >-
      The founder and leadership table is intentionally partial because UForce has not published a complete governance
      map.
    diligencePath: Request the current board list, committee charters, and executive org chart.
    relatedQuestionRefs:
