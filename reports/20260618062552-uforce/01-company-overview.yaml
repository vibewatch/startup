  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-disclosure
    missingEvidence: Named ministries of defence, contract values, acceptance milestones, and renewal schedules.
    whyItMatters: Customer quality and concentration cannot be judged from anonymous allied-market references alone.
    diligencePath: Request top-customer list, signed contract abstracts, and delivery milestones under NDA.
    relatedQuestionRefs:
    - QO022
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Post-seed ownership percentages, board seats, liquidation preferences, and investor protective provisions.
    whyItMatters: A $1B entry valuation can look very different depending on preference stack and governance control.
    diligencePath: Request cap table, financing documents, and board observer/right schedules from counsel.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 public leadership coverage
    missingEvidence: Full board roster, committee assignments, and succession planning beyond the publicly named leadership set.
    whyItMatters: The founder and leadership table is intentionally partial because UForce has not published a complete governance map.
    diligencePath: Request the current board list, committee charters, and executive org chart.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Filed or audited revenue, bookings conversion, burn, gross margin, and cash runway data.
    whyItMatters: The public narrative is scale-heavy but offers no way to test unit economics or financing durability.
    diligencePath: Obtain management accounts, 2025 revenue bridge, and current cash/burn schedule under NDA.
    relatedQuestionRefs:
    - QO009
    - QO025
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 private milestone coverage
    missingEvidence: Private customer awards, supplier milestones, and financing mechanics not described in public sources.
    whyItMatters: The chronology is public-only and likely omits commercially important milestones that would sharpen diligence on execution pace.
    diligencePath: Request an internal milestone roadmap with dated contract wins, product releases, and manufacturing milestones.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO004
  - type: stale
    severity: minor
    topic: governance-disclosure
    missingEvidence: Formal board roster, committees, and succession planning after the May 2026 U.S. CEO appointment.
    whyItMatters: Leadership concentration is a central moat and a central risk; without governance detail it is hard to assess resiliency.
    diligencePath: Request board materials, org chart, and key-man contingency planning.
    relatedQuestionRefs:
    - QO006
