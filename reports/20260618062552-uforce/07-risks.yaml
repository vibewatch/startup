  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Field reliability, mission-abort, MTBF, maintenance-hour, training-load, and support-SLA data by platform and software module.
    whyItMatters: Western buyers will evaluate sustainment burden and acceptance risk at least as heavily as battlefield anecdotes.
    diligencePath: Request recent test reports, depot-maintenance assumptions, failure logs, and contractually committed service levels for Magura, U-C2, and interceptor products.
    relatedQuestionRefs:
    - QR016
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named top customers, backlog conversion, renewal cadence, and share of bookings tied to any one ministry, service, or channel partner.
    whyItMatters: Sovereign concentration can stretch cash conversion and sharply raise downside if one buyer or budget cycle slips.
    diligencePath: Request cohort of booked versus deployed programmes, top-five customer revenue share, and pipeline stages by country.
    relatedQuestionRefs:
    - QR018
    - QR029
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: upstream-rights
    missingEvidence: Platform-level IP ownership, exclusivity, sublicensing, export rights, and termination provisions for upstream drones, payloads, and software adapters.
    whyItMatters: An integrator without durable rights can lose margin, transferability, or customer control exactly when demand scales.
    diligencePath: Review OEM and developer agreements for Magura-family, air platforms, UGVs, and C2 interfaces; confirm territorial and government-customer rights.
    relatedQuestionRefs:
    - QR013
    - QR024
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or board-approved figures for revenue, gross margin, cash burn, capex needs, and working-capital cycle through the manufacturing ramp.
    whyItMatters: Risk-adjusted valuation and kill criteria depend on whether bookings translate into cash-efficient production or into negative working-capital strain.
    diligencePath: Request monthly cash bridge, gross-margin waterfall by product family, and inventory/payment assumptions for UK and U.S. production.
    relatedQuestionRefs:
    - QR019
    - QR025
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: minor
    topic: direct-enforcement
    missingEvidence: Direct public regulator or court sources specifically naming UForce in export-control, sanctions, safety, or product-liability proceedings.
    whyItMatters: Absence of public hits is not proof of absence, but direct legal process would change the risk ranking quickly.
    diligencePath: Run counsel-led sanctions, enforcement, and litigation database checks in the UK, EU, and U.S. before underwriting a scaling round.
    relatedQuestionRefs:
    - QR010
    relatedTableRefs:
    - TR001
