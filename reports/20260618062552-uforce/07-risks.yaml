- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - U.S. manufacturing execution slips
    - First U.S.-made USV milestones and site-readiness checkpoints
    - No credible production-ready demonstration by Q4 2026 or repeated supplier qualification misses
    - Downgrade U.S. expansion assumptions and re-underwrite margin and timing
  - - Export-rights ambiguity persists
    - Signed OEM, IP, and export-right confirmations
    - No clean rights package for core platforms before major western orders
    - Treat integrator margin and localisation thesis as impaired
  - - Reliability evidence never matures
    - Release of formal test, sustainment, and acceptance metrics
    - No buyer-grade reliability package after additional NATO/ministerial trials
    - Pause conviction on serial procurement conversion
  - - Sovereign concentration becomes extreme
    - Top-customer share and pipeline aging
    - One country or service represents >40% of near-term bookings with long payment cycles
    - Apply concentration haircut to valuation and financing assumptions
  - - Policy-favoured demand fails to become repeat awards
    - Named follow-on awards from REPMUS/Dynamic Messenger or equivalent trials
    - No public pilot-to-procurement progression by mid-2027
    - Reframe exercise visibility as marketing rather than commercial traction
  - - Localisation runs into nationality screens
    - Component-provenance and compliance reviews in the U.S. or EU
    - Critical components fail provenance or eligibility review for target programmes
    - Budget redesign cost and slower market entry into the model
