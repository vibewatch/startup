    "number": 4,
    "title": "Financials",
    "summary": "Public financial disclosure for UForce is unusually thin relative to its $1 billion-plus seed valuation: no audited revenue, gross margin, burn, cash balance, customer list, or filed accounts are publicly available in the reviewed source pack. The two core hard datapoints are the March 2026 $50 million seed round and management’s claim of nine-figure 2025 bookings, supported by a direct-government turnkey delivery model spanning platforms, C2/autonomy software, and integration. That combination supports a credible revenue engine, but not an underwritten margin or runway view, so the financial verdict is that UForce may have real demand but remains valuation-rich and disclosure-poor."
  },
