      "id": "pricing-and-unit-economics-proxies",
      "title": "Pricing evidence is fragmentary, so unit economics must stay proxy-based",
      "body": "UForce does not publish list pricing for its core sea, air, land, or software products, and public sources do not disclose realized contract prices, take rates, margin structure, or renewal economics. The cleanest public price clue is The Defender’s report on the Bucha strike drone, which says the expected unit price is $10,000-$12,000 depending on communications configuration, while also noting that the flagship version had not yet entered combat trials and that a simplified variant was only at pre-series production. That is helpful as a low-end attritable-hardware proxy, but it cannot be extrapolated to Magura naval systems, bundled combat-system packages, C2/autonomy licenses, or sustainment-heavy government programmes. UForce’s own launch narrative adds only a qualitative price signal: low-cost interceptors and autonomous systems that can defend against drones and rockets at a fraction of traditional missile-defense costs. Comparable public-company and large-peer surfaces mostly help on structure rather than direct economics. AeroVironment’s extensive annual-report stack shows what mature public disclosure looks like in this sector, while Shield AI’s Hivemind materials reinforce that autonomy software can hold standalone strategic value even when monetization details stay private. The right posture is therefore to discuss pricing by bucket and to leave realized unit economics as a diligence item rather than fabricate SaaS-style metrics that the public evidence does not support.",
