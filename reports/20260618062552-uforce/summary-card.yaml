  topStrengths:
    - >-
      Battle-proven Ukrainian unmanned platforms combined with a London legal wrapper create a differentiated
      allied-procurement story that few seed-stage peers can match.
    - >-
      Investor and leadership quality is unusually strong for seed stage, blending Lakestar and Shield Capital with
      founders and officials who have real defense-policy access.
    - >-
      Structural market tailwinds from NATO, EU, UK, and U.S. drone and counter-drone spending support a large
      opportunity set if UForce can translate validation into repeat sovereign programs.
  topRisks:
    - >-
      Public evidence does not disclose audited revenue, gross margin, burn, customer concentration, or cap-table
      economics, making the $1 billion seed hard to underwrite analytically.
    - >-
      UForce's value proposition may depend on rights, exclusivity, and reliable localization of upstream Ukrainian
      platforms that are not fully documented in public.
    - >-
      Export controls, autonomy-accountability scrutiny, and Western sustainment or qualification requirements could
      slow procurement conversion even if battlefield proof is real.
  unresolvedGaps:
    - >-
      Bookings-to-revenue conversion, cash collection timing, gross-margin split, and current runway require management
      disclosure under NDA.
    - >-
      Named customer contracts, repeat-order evidence, concentration data, and acceptance milestones are largely absent
      from public sources.
    - >-
      Platform-level rights, exclusivity, exportability, and localization permissions across sea, air, land, and
      software products remain insufficiently documented.
