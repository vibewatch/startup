      - number: '2.4'
        title: Growth drivers are strong, but conversion remains bottlenecked
        blocks:
          - type: paragraph
            body: >-
              The demand side is strong. European and UK policy now openly says that low-cost drones can beat more
              exquisite systems, that allied militaries must learn from Ukraine, and that industrial bases must scale
              faster. EU institutions are adding funding, startup-access routes, common-procurement incentives, and a
              drone-defence initiative, while Orbital Today and The European both describe a sovereignty-driven push
              toward home-grown European UAV, counter-UAS, and low-cost autonomous-platform programmes. But adoption is
              not frictionless. Export controls cover controlled military goods, software, and technology, which means
              autonomy and C2 transfer can be licensing-gated even when no airframe crosses a border. Europe’s market is
              also fragmented: vendors face multiple national programmes, local-manufacturing expectations, and a shift
              toward proof-heavy standards such as trusted labels, harmonised testing, common data formats, and joint
              purchasing. Infrastructure and mobility are part of the bottleneck too, because NATO still has to fund
              airfields, fuel systems, maritime infrastructure, and command systems while exercises like REPMUS require
              live range access and operational deployment logistics. Finally, autonomy ethics are not settled. Human
              Rights Watch’s accountability critique highlights why buyers may demand stronger human-control, audit, and
              assurance cases before letting autonomy move closer to the kill chain.
