      - number: '3.3'
        title: UForce wins the low-cost attritable argument, but peers win disclosure and distribution
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is poor across almost the entire set. UForce’s own public case is mostly
              qualitative: cheaper, attritable, rapidly iterated systems; lower-cost intercept concepts; and practical
              battle feedback loops. Shield, Anduril, Palantir, and Rheinmetall similarly market outcomes, not list
              prices. Skydio is the outlier in packaging clarity because its X10D page discloses deployment time, speed,
              Blue UAS status, and sensor configurations even though it still does not show public list pricing. In
              other words, the market is opaque on price but not equally opaque on packaging. Distribution and
              procurement access therefore become decisive. AeroVironment and Rheinmetall already look like established
              procurement counterparts. Shield AI and Anduril pair stronger capitalization with clearer autonomy brands.
              Europe’s current policy direction intensifies this: BCG, EPRS, Inside Unmanned, Orbital Today, and The
              European all point toward interoperability, local production, common standards, and larger coordinated
              purchasing pools. UForce’s distributed allied supply chain and policy-heavy leadership help, but the
              company still has to prove that it can translate those ingredients into sovereign assembly, repeat
              channels, and long-duration programmes rather than urgent one-offs.
