  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio breadth and buyer job-to-be-done
        blocks:
          - type: paragraph
            body: >-
              UForce should be read as a portfolio wrapper around multiple battlefield-proven Ukrainian systems rather
              than as a company built around one clean-sheet vehicle. Its public materials consistently bundle sea
              platforms, bomber and strike drones, ground robots, counter-UAS effects, and a shared command-and-control
              layer into one exportable package for allied buyers. That matters because the customer workflow is not
              simply buying a drone: the company pitches a turnkey combat system that can be localized, integrated, and
              fielded quickly for maritime denial, layered counter-drone defense, ground reconnaissance, and
              swarm-enabled strike operations. The maritime layer remains the flagship because Magura carries the
              strongest public combat record, but the air and land layers widen the sales envelope and reinforce the
              integrator thesis. Bucha also shows that not every product is equally mature: UForce is willing to market
              pre-series or flight-test systems alongside already proven ones. The practical product story is therefore
              a mixed portfolio with different readiness levels, all tied together by a promise of rapid fielding,
              interoperability, and lower-cost attritable effects.
