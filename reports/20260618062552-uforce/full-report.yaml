      - number: '3.2'
        title: The most dangerous peers each win on a different axis
        blocks:
          - type: paragraph
            body: >-
              Shield AI is the clearest autonomy-software peer because Hivemind is explicitly platform-agnostic,
              dual-use, and designed for OEM and military integration; it competes with the part of UForce that sells
              vendor-neutral C2 and autonomy rather than just a vehicle. Anduril competes from the opposite direction:
              broad autonomous-defence positioning plus an overt manufacturing thesis through Arsenal-1, which matters
              because procurement winners increasingly need not only good software but the ability to ship in volume.
              AeroVironment and Rheinmetall are not as narratively close to UForce, yet they matter because they bring
              installed bases, public-company or listed-company credibility, and deeper procurement muscle. Skydio is
              narrower but highly productized around resilient small-UAS performance, which can pressure UForce in
              tactical ISR and base-security workflows. Palantir is the software-layer adjacent competitor; buyers
              choosing an analytics, command, and workflow backbone may allocate budget there before they buy new
              hardware. Helsing is the sovereignty-native European AI peer: far better capitalized than UForce in public
              reporting, increasingly willing to move from software into hardware, and well aligned with Europe’s
              industrial-autonomy narrative.
