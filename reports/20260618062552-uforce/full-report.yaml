  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Define the market narrowly before sizing it
        blocks:
          - type: paragraph
            body: >-
              The most defensible boundary for UForce is not “military drones” in the abstract. Its own public materials
              present a stack that spans attritable air, sea, and land platforms, counter-UAS interceptors, and a
              vendor-agnostic command-and-control layer for allied militaries. That points to a narrower procurement
              wedge: ministries and NATO-aligned buyers seeking low-cost autonomous systems, mixed-fleet software, and
              counter-drone tools shaped by Ukraine-war operating lessons. The market-definition table therefore
              includes spend on platforms, autonomy software, intercept, integration, and testing, while excluding broad
              crewed-platform budgets, generic missiles, civilian drones, and general-purpose AI. This distinction
              matters because public market reports often aggregate multiple drone types, autonomy levels, end users,
              and geographies; using those top-line numbers without adjustment would materially overstate UForce’s real
              serviceable market. NATO’s own expenditure definition reinforces that some relevant spend sits outside
              line-item drone procurement, because common funding, trust funds, R&D, and joint procurement services all
              support the fielding environment in which UForce-like systems compete.
            claimRefs:
              - CM001
