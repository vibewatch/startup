chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal structure, and operating model
        blocks:
          - type: paragraph
            body: >-
              UForce is publicly positioned as a United Kingdom-based autonomous-systems defense company that emerged
              from stealth on 5 March 2026 to commercialize battle-proven Ukrainian unmanned capabilities for allied
              militaries. The official launch release describes the company as unifying aerial, maritime, and ground
              systems plus command-and-control software into a single operating platform for Western government buyers,
              while UK Defence Journal and Crunchbase independently describe the same London-based company as a defense
              startup selling unmanned systems used in the Ukrainian war. UK Companies House records show a January 2025
              incorporation for UFORCE GLOBAL LIMITED and a May 2025 incorporation for UFORCE TRADING LIMITED at the
              same London address, consistent with a holding-plus-trading structure rather than a loose reseller
              network. The operating model is not a pure OEM for a single drone: the company markets a portfolio
              spanning Magura sea systems, strike and bomber UAVs, land robots, remote weapon stations, and a
              vendor-agnostic autonomy/C2 layer designed to integrate heterogeneous platforms for allied procurement.
