      - number: '3.4'
        title: The moat is real only where battle proof and integration beat capital and scale
        blocks:
          - type: paragraph
            body: >-
              UForce’s strongest moat claim is not that it has the deepest wallet or the most disclosed software
              franchise. It is that it can import genuine Ukrainian battlefield learning into allied procurement faster
              than larger institutions can. That matters because its public record shows breadth across sea, air, land,
              intercept, and C2, plus claims of operating under EW and mixed-fleet conditions that many rivals market
              but fewer can tie so directly to Ukraine-derived operations. Yet this moat is fragile if it depends mainly
              on packaging other upstream products without durable exclusivity, or if buyers decide they prefer
              specialist software from Shield AI or Palantir layered onto other hardware. It is also fragile if
              sovereignty requirements favor primes, joint ventures, and local factories over a distributed but still
              externally assembled network. The adverse evidence is important here: EPRS argues that drones are decisive
