      - number: '1.3'
        title: Funding, scale signals, and disclosure posture
        blocks:
          - type: paragraph
            body: >-
              Official and independent sources converge on the basic financing facts. UForce announced a $50 million
              seed round led by Lakestar and Shield Capital with Ballistic Ventures participating, and independent
              coverage from UK Defence Journal, InVenture, Vestbee, Crunchbase, and The Defender all repeat the round
              size and unicorn valuation. Crunchbase additionally places UForce among March 2026’s new defense unicorns
              and describes it as a one-year-old London unmanned-systems builder. The harder question is operating
              scale. The launch release claims nine-figure 2025 bookings, near-500% growth in those bookings, more than
              15 locations across six allied countries, and a team of more than 1,000 professionals spanning Kyiv,
              London, and Silicon Valley. These datapoints are directionally important because they imply a real supply
              and integration footprint rather than a concept-stage vehicle, but they remain company-claimed and are not
              backed by filed accounts, customer purchase orders, or a disclosed cap table. Public evidence therefore
              supports the round and valuation more strongly than it supports revenue quality, margin, or fully diluted
              ownership.
