      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The mitigation case is real but conditional. UForce has timing on its side because NATO, the UK, the EU,
              and the U.S. all want more uncrewed and counter-uncrewed capacity, and the company can point to actual
              wartime learning rather than laboratory demos. It also has a plausible localisation story, a U.S.
              executive with homeland-security credibility, and a product suite aligned to segments—maritime autonomy,
              counter-UAS, and C2—that policy makers are actively funding. Still, investors should treat those positives
              as options, not proofs. The central monitoring question is whether policy-favoured demand converts into
              contractable, licensable, and supportable production. Thesis-break events are therefore operationally
              observable: if U.S. production slips, if exclusivity and export rights remain unclear, if no public path
              from exercises to repeat orders appears, or if quality evidence never matures, the narrative can remain
              impressive while the investable business weakens.
