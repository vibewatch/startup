      - CR017
      - CR018
      - CR030
      - CR033
      - CR036
      - CR037
      - CR043
  - id: FR002
    title: Risk transmission map — how compliance and quality risks flow into revenue and valuation
    type: dag
    layout: wide
    summary: >-
      Directed graph linking policy, quality, and concentration risks to delayed contracts, cash strain, and valuation
      compression.
    data:
      nodes:
        - id: export
          label: Export / trade-control complexity
        - id: rights
          label: Upstream rights ambiguity
        - id: quality
          label: Qualification / reliability gap
        - id: usprod
          label: U.S. manufacturing slip
        - id: standards
          label: Rising EU / NATO standards burden
        - id: concentration
          label: Sovereign buyer concentration
        - id: contracts
          label: Contract conversion delay
        - id: margin
          label: Margin compression
        - id: cash
          label: Working-capital strain
        - id: valuation
          label: Valuation and financing pressure
      edges:
        - to: contracts
          label: licensing slows delivery
          from: export
        - to: contracts
          label: buyers question control / localisation
          from: rights
        - to: contracts
          label: acceptance slips
          from: quality
        - to: margin
          label: start-up inefficiency
          from: usprod
        - to: margin
          label: documentation and test cost
          from: standards
        - to: cash
          label: lumpy sovereign receipts
          from: concentration
        - to: cash
          label: bookings convert slowly
          from: contracts
        - to: cash
          label: inventory and rework consume cash
          from: margin
        - to: valuation
          label: fundraising risk rises
          from: cash
        - to: valuation
          label: revenue timing weakens confidence
          from: contracts
    approximationNotes: >-
      Nodes are business mechanisms rather than legal entities; the figure shows causal transmission paths most relevant
      to underwriting.
    claimRefs:
      - CR006
      - CR007
      - CR021
      - CR033
      - CR035
      - CR037
      - CR042
  - id: FR003
    title: Dependency map — the external actors UForce must align to scale
    type: dag
    layout: wide
    summary: >-
      UForce’s scale-up depends on simultaneous alignment across OEMs, regulators, experiments, funding programmes, and
      domestic industrial-policy channels.
    data:
      nodes:
        - id: uforce
          label: UForce integrator layer
        - id: oems
          label: Upstream platform / payload OEMs
        - id: ukreg
          label: UK export-control and procurement regime
        - id: euprog
          label: EU EDF / EDIP / EUDIS ecosystem
        - id: natotrials
          label: NATO / Royal Navy experimentation channels
        - id: uspolicy
          label: U.S. domestic-sourcing policy
        - id: sites
          label: Distributed manufacturing sites
        - id: buyers
          label: Sovereign and critical-infrastructure buyers
      edges:
        - to: uforce
          label: IP, manufacturing know-how, supply
          from: oems
        - to: uforce
          label: licensing and process rules
          from: ukreg
        - to: uforce
          label: eligibility and scale incentives
          from: euprog
        - to: uforce
          label: validation and demand shaping
          from: natotrials
        - to: uforce
          label: nationality and sourcing screens
          from: uspolicy
        - to: uforce
          label: local content and QA execution
          from: sites
        - to: buyers
          label: integrated product offer
          from: uforce
        - to: buyers
          label: questions of control and sustainment
          from: oems
    approximationNotes: >-
      The map emphasises organizational dependencies rather than product architecture; a break at any major node can
      slow commercial scale-up.
    claimRefs:
      - CR014
      - CR015
      - CR018
      - CR020
      - CR028
      - CR030
      - CR033
      - CR040
      - CR043
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from battle-proven proof and market tailwinds through disclosure and execution filters
      into a research-more stance.
    data:
      nodes:
        - id: n1
          label: Battle-proven portfolio
          detail: Sea, air, land, and C2 systems with wartime proof create strategic relevance
        - id: n2
          label: Western wrapper + investors
          detail: UK and U.S. packaging plus credible investors improve access and signaling
        - id: n3
          label: Demand tailwind
          detail: EU, NATO, and U.S. policy increasingly reward drones, counter-drones, and industrial scale
        - id: n4
          label: Disclosure and rights gap
          detail: Revenue quality, margin, customer detail, and platform-rights evidence remain thin
        - id: n5
          label: Research-more
          detail: Stay engaged, but do not call the price cheap without a hard diligence package
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
    approximationNotes: This is an investment-decision logic map, not a process diagram published by the company.
    claimRefs:
      - CV007
      - CV009
      - CV015
      - CV018
      - CV036
      - CV043
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      The midpoint valuation is most sensitive to bookings conversion, margin mix, and localization success rather than
      to brand narrative alone.
    data:
      items:
        - label: Bookings conversion
          value: 0.9
          displayValue: ~$0.9B swing
          tone: high
          detail: How much of the order book becomes recognized revenue and cash
        - label: Margin mix
          value: 0.8
          displayValue: ~$0.8B swing
          tone: high
          detail: Hardware-heavy economics deserve lower multiples than software/sustainment mix
        - label: U.S. / EU localization
          value: 0.7
          displayValue: ~$0.7B swing
          tone: high
          detail: Procurement eligibility and sovereign trust depend on local manufacturing and compliance
        - label: Software / C2 attach
          value: 0.6
          displayValue: ~$0.6B swing
          tone: medium
          detail: Meaningful autonomy and C2 monetization would widen the upside case
        - label: Autonomy-policy drag
          value: 0.4
          displayValue: ~$0.4B swing
          tone: risk
          detail: Human-control and supply-sovereignty constraints can compress adoption and multiple support
    approximationNotes: Bar lengths are directional estimate magnitudes in valuation impact, not market-observed deltas.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV023
      - CV033
      - CV039
      - CV040
      - CV041
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Scenario ranges show why the current round can be defensible without yet being obviously attractive for a new
      investor.
    data:
      items:
        - label: Bear
          low: 0.4
          mid: 0.55
          high: 0.7
          displayValue: $0.4B-$0.7B
          tone: risk
          detail: Weak conversion, heavy hardware mix, slower localization
        - label: Base
          low: 0.9
          mid: 1.2
          high: 1.5
          displayValue: $0.9B-$1.5B
          tone: neutral
          detail: Moderate conversion, improving support/software mix, procurement gates clear
        - label: Bull
          low: 1.8
          mid: 2.3
          high: 3
          displayValue: $1.8B-$3.0B
          tone: positive
          detail: Preferred Western wrapper plus repeatable autonomy and program-scale economics
    approximationNotes: >-
      Values are indicative fair-value ranges in USD billions based on explicit analytical assumptions rather than
      quoted market prices.
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: UForce scores well on urgency and proof, but weakly on disclosure and current valuation discipline.
    data:
      items:
        - label: Market tailwind
          value: 8/10
          score: 8
          tone: positive
          detail: EU, NATO, and U.S. policy all support more drone and counter-drone spend
        - label: Battlefield proof
          value: 8/10
          score: 8
          tone: positive
          detail: Combat-proven systems and wartime iteration are the strongest positive differentiators
        - label: Investor quality
          value: 7/10
          score: 7
          tone: positive
          detail: Lakestar and Shield Capital improve signaling and network access
        - label: Disclosure quality
          value: 3/10
          score: 3
          tone: risk
          detail: Audited revenue, margin, and customer data remain absent
        - label: Execution risk
          value: 4/10
          score: 4
          tone: risk
          detail: US expansion, rights clarity, and qualification burden are still unresolved
        - label: Valuation discipline
          value: 4/10
          score: 4
          tone: risk
          detail: Current price is plausible, but public evidence does not make it look cheap
    approximationNotes: Scores are an IC-style synthesis of the chapter evidence, not external ratings.
    claimRefs:
      - CV007
      - CV009
      - CV012
      - CV013
      - CV015
      - CV038
      - CV042
      - CV043
