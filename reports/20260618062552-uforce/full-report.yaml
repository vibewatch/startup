      - number: '1.2'
        title: Leadership, governance, and founder-market fit
        blocks:
          - type: paragraph
            body: >-
              The leadership mix is unusually policy-heavy for a seed-stage defense hardware platform. Oleg Rogynskyy is
              the founding chief executive and is presented as the repeat-startup operator who previously founded
              People.ai, while Oleksiy Honcharuk is both co-founder and board chairman and brings high-level Ukrainian
              government and unmanned-systems policy experience. UForce’s own company page and launch release state that
              Honcharuk advised the Commander of Ukraine’s Unmanned Systems Forces and chaired Aerorozvidka’s
              supervisory board, positioning him as the internal translator between battlefield operators and Western
              institutional buyers. Former UK Defence Secretary Ben Wallace appears in the leadership mix at launch, and
              a May 2026 announcement added former senior U.S. homeland security and cyber official Sean Plankey as U.S.
              CEO to drive American government engagement and manufacturing plans. The strategic upside is obvious: few
              startups combine frontline Ukrainian operator insight with British ministerial credibility and U.S.
              procurement access. The downside is equally clear: governance is concentrated in a handful of politically
              connected individuals, succession depth is undisclosed, and network access is a meaningful part of the
              moat.
