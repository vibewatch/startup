        title: Exhibits
        blocks:
          - type: callout
            title: The strongest positive is not just drones, but the learning loop behind them
            body: >-
              UForce is interesting because it packages combat learning, rapid iteration, and Western procurement access
              into one story. That is more defensible than a single-product thesis.
            calloutType: strength
