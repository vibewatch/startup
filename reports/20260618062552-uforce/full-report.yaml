      - number: '7.4'
        title: People, execution, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              UForce also carries an execution profile typical of fast-moving defence integrators: strong narrative
              momentum with thin public operating disclosure. The company is clearly moving quickly, as shown by U.S.
              leadership hiring, public promises on American production, and Companies House evidence of rapid
              governance and capital-structure change. But public materials do not disclose the hard numbers needed to
              underwrite scaling confidence: audited revenue, gross margin, working-capital needs, renewal rates, or
              top-customer concentration. That creates model risk because sovereign procurement cycles are long, payment
              milestones can be uneven, and hardware-plus-software manufacturing ramps often consume cash before they
              create it. Governance disclosure is also sparse relative to what larger Western buyers and later-stage
              investors often expect. The key people risk is not simply whether Sean Plankey is credible—he is—but
              whether the organisation below him can industrialise, localise, and comply across the UK, Europe, and the
              U.S. without losing speed or margin.
