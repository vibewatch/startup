              returning to the systems in repeated operations. The direct-government turnkey model also supports a
              plausible stickiness thesis once systems are integrated into doctrine, training, and support workflows.
              Still, none of this proves reorder cadence, contract renewal, or installed-base durability. The prudent
              reading is that UForce likely has real repeat usage where its systems are already operational, but the
