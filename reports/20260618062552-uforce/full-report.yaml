  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, export-control, and accountability risk
        blocks:
          - type: paragraph
            body: >-
              UForce’s highest non-technical risk is that it sits inside the most policy-sensitive part of the defence
              stack: exportable autonomous systems, software, and know-how. The UK regime does not just cover shipment
              of military hardware; it also covers controlled software, technology, and some brokering or third-country
              movement activity. That matters because UForce’s commercial pitch depends on taking Ukrainian combat
              learning, wrapping it in UK and U.S. entities, and then localising production across allied countries.
              Every extra manufacturing node, subcontractor, or transfer of technical data can create another licensing
              and compliance burden. The legal risk is compounded by autonomy politics. European parliamentary materials
              and Human Rights Watch both emphasize meaningful human control, accountability, and export guardrails.
              UForce may still be well positioned for allied demand, but buyers increasingly want more than battlefield
              proof: they want documentation, oversight, and a product story that can survive export-control review and
              public scrutiny.
            claimRefs:
