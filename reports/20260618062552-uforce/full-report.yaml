      - number: '4.3'
        title: $50 million is meaningful seed capital, but likely modest against the operating model
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy is where the gap between valuation and disclosure matters most. UForce is not presenting
              as a light software reseller. It describes a full-stack autonomous-systems business with manufacturing,
              software updates, testing, validation, integration, and field deployment across more than 15 locations,
              and the May 2026 U.S. CEO announcement explicitly ties the next phase to American government engagement,
              partnerships, and U.S.-based manufacturing. That operating shape carries heavy working-capital demands
              before cash conversion: inventory and component sourcing, localized assembly, export-control compliance,
              systems integration, testing, operator training, and support. UK filings reinforce that the corporate
              structure has been active, with multiple share allotments, a shortened accounting period, and a separate
              trading entity, but they still do not disclose the core private-company metrics investors would actually
              use to judge runway. External policy sources strengthen the demand case while also underscoring capital
              intensity. NATO funding, the EDF, and EDIP all point to substantial procurement and
              industrial-reinforcement pools for unmanned and counter-unmanned capability, but those programmes also
              reward scale, standards compliance, and local manufacturing depth. On balance, the $50 million seed is
              large for a seed round and probably enough to bridge immediate commercialization and U.S. market entry
              steps, yet it looks modest relative to the multi-country manufacturing, integration, and support burden
              implied by nine-figure bookings and serial production ambitions. Newer public policy and exercise sources
              reinforce that this is not just a demand story but an execution story: the Royal Navy's REPMUS notice
              centers interoperability on the path to operational service, Defense News reports daily jamming trials in
              the 2025 exercise, and current U.S. policy is shifting toward consumable drones and domestic production.
              European policy points in the same direction. EPRS and LEAP coverage suggest more joint procurement and
              industrial support are coming, but they also show that standards, sovereignty, and coordination politics
              will shape who captures the spend.
