      - number: '8.4'
        title: 'Recommendation: stay engaged, but only with hard valuation discipline'
        blocks:
          - type: paragraph
            body: >-
              The disciplined recommendation is research-more with medium confidence, high risk, and a stretched
              valuation stance. That is intentionally more constructive than avoid because the strongest positives are
              real: a battle-proven portfolio, an unusually fast wartime learning loop, credible Western investor
              sponsorship, and tailwinds from allied spending, interoperability work, and industrial-policy urgency. But
              it is also intentionally more skeptical than buy because almost every fact that would let a new investor
              call the round cheap remains private. UForce may yet grow into or beyond the price if the nine-figure
              bookings claim converts into recognized revenue, if autonomy and C2 attach produce better-than-hardware
              economics, and if U.S. expansion becomes contractive rather than merely promotional. Until then, the
              investment case depends less on another product demo and more on a diligence package that covers revenue
              quality, preference stack, rights to upstream platforms, and the precise path from exercises and pilots
              into repeatable programs. The company looks strategically important; it does not yet look transparently
              priced.
            claimRefs:
