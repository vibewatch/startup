      - number: '7.2'
        title: Operational, quality, and qualification risk
        blocks:
          - type: paragraph
            body: >-
              Battlefield validation gives UForce credibility, but it does not automatically satisfy Western sustainment
              and qualification standards. The strongest public proof is still exercise and war-zone performance rather
              than published acceptance metrics, reliability curves, or support commitments. REPMUS and Dynamic
              Messenger show serious interest from allied experimentation channels and expose systems to jamming-rich
              scenarios, yet they do not prove depot sustainment, export-document completeness, mission-abort rates, or
              service-level performance under peacetime procurement discipline. UForce’s own command-and-control story
              also increases complexity: a vendor-agnostic orchestration layer depends on integrations, adapters,
              payloads, and third-party sensors, so failures can arise at the interfaces even if a single platform works
              well. The result is a classic transition risk from wartime iteration to programmatic scale: if the company
              cannot document repeatable quality, Western buyers may admire the technology but still slow-roll
              production awards.
            claimRefs:
