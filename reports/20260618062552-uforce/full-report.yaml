            - Medium-High
            - Low
            - Later-stage investors and buyers may demand more controls
        - label: Adjacent critical-infrastructure compliance sprawl
          values:
            - Medium
            - Medium
            - Low-Medium
            - Diversifies TAM but adds assurance burden
    approximationNotes: >-
      Likelihood and residual-severity labels are qualitative rankings derived from cited policy, procurement, and
      company disclosures rather than actuarial loss probabilities.
    claimRefs:
