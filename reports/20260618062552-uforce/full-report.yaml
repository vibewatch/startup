      - number: '7.3'
        title: Sovereignty, partner, and upstream dependency risk
        blocks:
          - type: paragraph
            body: >-
              The next ranked risk is dependency: on upstream platforms, on jurisdiction-specific supply chains, and on
              sovereignty politics. Europe’s own policy direction is explicit that future drone capacity should be
              locally controlled, eligible for EU-backed programmes, and less dependent on non-European suppliers. The
              United States is moving in a parallel direction through foreign-drone restrictions and industrial-policy
              support for domestic production. UForce’s distributed footprint across allied countries can help it
              satisfy those demands, but only if it can show durable rights over the platforms it markets and real
              control over bills of materials, quality systems, and localisation. Public evidence still leaves those
              points fuzzy. UForce marketing uses one brand, while independent reporting around Magura still surfaces
              upstream platform names and separate manufacturer identities. That ambiguity is manageable at pilot stage,
              but it becomes material when sovereign buyers ask who owns the design, who can export it, and who
              guarantees long-term supply if one supplier, country, or political relationship changes.
