  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The round is real, but the underwriting file is still thin
        blocks:
          - type: paragraph
            body: >-
              UForce has cleared the first bar of valuation analysis: the round and the headline price are well
              corroborated. The company’s own launch materials, UK Defence Journal, and Orbital Today all support a $50
              million initial round and a valuation above $1 billion, while management also claims nine-figure 2025
              bookings, close to 500% bookings growth, a footprint across six allied countries, and more than 1,000
              professionals. That is enough to treat UForce as a serious wartime-to-Western-commercialization story
              rather than a slide-deck concept. It is not enough to underwrite the entry price with normal late-seed
              discipline. Public sources still do not disclose audited revenue, gross margin, burn, cash conversion,
              customer concentration, acceptance milestones, or whether software and sustainment economics are
              meaningfully separable from hardware and systems integration. Companies House filings confirm active
              capitalization and corporate activity, but not the economics behind the valuation. The core judgment is
              therefore asymmetric: the bullish narrative is easy to understand, but the missing financial file means
              the price must still be tested as a hypothesis rather than accepted as a bargain.
            claimRefs:
              - CV001
