    {
      "id": "sizing-lenses",
      "title": "Use multiple sizing lenses instead of pretending a clean SAM is public",
      "body": "Public evidence supports several sizing lenses, but not a single authoritative TAM/SAM/SOM stack for UForce’s exact wedge. The broadest lens is macro defence spend: SIPRI shows world military expenditure rising from $2.240 trillion in 2022 to $2.443 trillion in 2023 and $2.718 trillion in 2024, while European arms imports rose 155% between 2015-19 and 2020-24. Those numbers demonstrate budget and demand momentum, but they are far broader than attritable autonomous systems. A second lens is visible public programme money. NATO’s 2026 Civil Budget, Military Budget, and NSIP alone total more than €5.1 billion, while the EDF, EDIP, and EUDIS together make multi-billion-euro research, production, common-procurement, and startup pathways visible to vendors building interoperable autonomous capability. A third lens is adjacent segment demand: BCG’s European C-UAS work shows announced MoD spending rising from about $0.6 billion in 2025 to about $0.8 billion in 2029, with broader demand potentially exceeding $5-7 billion by 2029. The pyramid and range figures therefore show a ladder of public lenses rather than a fake-precision SAM. The investable conclusion is that UForce sits inside a large and clearly rising budget pool, but no public source cleanly isolates its obtainable share.",
