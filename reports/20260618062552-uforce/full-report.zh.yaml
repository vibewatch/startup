  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、出口管制与问责风险
        blocks:
          - type: paragraph
            body: >-
              UForce 最高的非技术风险在于，它处在防务技术栈中政策最敏感的部分：可出口自主系统、软件和专有知识。英国制度不只覆盖军事硬件运输，也覆盖受控软件、技术，以及部分经纪或第三国转移活动。这很重要，因为
              UForce 的商业推介依赖把乌克兰战斗经验拿出来，用英国和美国实体包起来，再在盟国之间本地化生产。每增加一个制造节点、分包商或技术数据转移，都可能带来新的许可和合规负担。法律风险又被自主政治放大。欧洲议会材料和
              Human Rights Watch 都强调有意义的人类控制、问责和出口护栏。UForce 可能仍然很适合盟友需求，但买家越来越想要的不只是战场证明：他们要文档、监督，以及经得起出口管制审查和公众审视的产品故事。
