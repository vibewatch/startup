  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对承销的影响
      - 精确尽调路径
      - 为什么公开代理指标不够
    rows:
      - - 2024 和 2025 审计收入
        - 无法用实际销售检验估值
        - 获取管理账、审计状态，以及从 bookings 到 GAAP/IFRS 收入的 bridge
        - Bookings 和任务数量不等于已确认收入
      - - 按硬件、软件和服务拆分的毛利率
        - 无法判断软件经济性能否抵消硬件强度
        - 要求按产品家族和支持线拆分 margin stack
        - 公开来源描述能力，不描述销货成本
      - - 现金余额和月度 burn
        - Runway 和融资依赖仍不可知
        - 要求最新现金、12 个月 burn 和 covenant 摘要
        - 仅 seed 规模无法揭示流动性
      - - 客户集中度和合同期限
        - 无法评估收入耐久性或政治集中风险
        - 要求 top-customer 收入占比、合同期限、续约基础和付款里程碑
        - 没有公开具名客户名单
      - - Backlog 质量和取消权
        - 如果取消或验收风险高，九位数 bookings 可能高估确定收入
        - 要求按阶段拆分 backlog、取消条款和出货 / 验收状态
        - 公开 bookings 说法没有合同级支撑
      - - 制造 capex 和营运资本画像
        - 无法判断本轮融资中有多少必须投向库存、工装或本地化组装
        - 要求场地级 capex 计划、供应商条款和库存周转
        - 地点数量本身不能说明现金效率
      - - 软件变现模型
        - 无法承销高毛利上行
        - 要求授权模型、attach rate、维护条款和独立 win-loss 数据
        - 产品存在不等于有定价权
      - - 出口管制和跨境合规成本
        - 美国 / 盟友扩张期间，可能拖慢交付并消耗现金
        - 要求许可证地图、合规人员和受限技术工作流
        - 政策来源指出负担，不说明 UForce 的实际成本基数
    notes: 每个缺口都直接映射到缺失的承销输入，而不是泛泛的好奇。仅靠公开分析，无法在没有公司材料的情况下补上这些缺口。
