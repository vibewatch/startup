      - number: '5.4'
        title: 信任、合规与扩张约束
        blocks:
          - type: paragraph
            body: >-
              主要产品风险不是公司缺少令人兴奋的系统，而是对机构买家来说，太多关键细节仍不透明。公开披露没有清楚区分哪些平台由 UForce 完全控制，哪些仍依赖 STE、FRDM 或 UGV Robotics 等
              legacy 制造商，因此独占性和 IP 所有权仍不确定。可靠性和支持披露也很薄：除公司说法和一个已披露的 Bucha
              价格区间外，公开信息很少涉及故障率、维护负担、任务中止率、训练负载或验收标准。合规又增加一层摩擦。英国出口管制覆盖军事物资、软件、技术和 B 类 UAV
              相关活动；美国政策则转向本土生产，并加强对外国无人机供应链的审视。最后，自主叙事有双刃剑效应：同样的人类脱离环路拦截逻辑支撑低成本防空，也会招来人权和学术批评者的伦理与问责担忧。这些不推翻产品论点，但意味着买家应该像尽调原始战场性能一样，严肃尽调治理、转让权和工业本地化。
