      - number: '8.3'
        title: 公开经济性不可审计，看多、基准与看空区间都由假设驱动
        blocks:
          - type: paragraph
            body: >-
              今天给 UForce
              估值，正确做法是使用明确的情景逻辑，而不是制造虚假精度。看空情境下，公司仍有真实技术和需求，但订单转化差，硬件和集成主导利润率，美国本地化放慢，主权客户继续测试而非放量。这就是一个战时成功故事仍可能相对当前轮次大幅折价的路径。基准情境下，订单转为重复性主权收入，软件和保障附着率随时间改善，本地化加互操作性做得足以让公司留在真实竞标中。这大致支撑今天的估值，但入场时并不显著喊出上行空间。看多情境需要更激进的结果：UForce
              成为久经战场验证的乌克兰系统面向西方的优先包装层，证明对上游关系拥有稳定控制权，并证明自主或 C2
              能在多域项目中承载更高价值、类似软件的经济性。投资人应比叙事动能更密切地盯住打破投资假设的信号，因为这类公司可能在市场质疑技术本身很久之前，就因采购摩擦、权利模糊或政策压力而被压缩价值。
