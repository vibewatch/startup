      - number: '7.4'
        title: 人员、执行与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              UForce 也带着快速防务集成商常见的执行画像：叙事动能强，公开运营披露薄。公司显然推进很快，美国领导层招聘、美国生产公开承诺，以及 Companies House
              关于治理和资本结构快速变化的记录都能说明这一点。但公开材料没有披露支撑规模化信心所需的硬数字：经审计收入、毛利率、营运资金需求、续约率或头部客户集中度。主权采购周期长，付款里程碑可能不均匀，硬件加软件的制造爬坡往往先吃现金、后创造现金，因此模型风险随之产生。相较大型西方买家和后期投资人通常期待的水平，治理披露也偏少。关键人物风险不只是
              Sean Plankey 是否可信——他可信——而是他下面的组织能否在英国、欧洲和美国同时工业化、本地化并合规，同时不丢速度或利润率。
