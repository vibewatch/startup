        title: 融资、规模信号与披露姿态
        blocks:
          - type: paragraph
            body: >-
              官方和独立来源在基本融资事实上相互印证。UForce 宣布完成 $50 million 种子轮，由 Lakestar 和 Shield Capital 领投，Ballistic Ventures 参投；UK
              Defence Journal、InVenture、Vestbee、Crunchbase 和 The Defender 的独立报道都重复了轮次规模和独角兽估值。Crunchbase 还把 UForce 列入
              2026 年 3 月新晋防务独角兽，并称它是一家成立一年的伦敦无人系统制造商。更难的问题是运营规模。发布稿称 2025 年订单额达九位数、订单额增长接近 500%、在六个盟国拥有超过 15 个地点、团队超过
              1,000 名专业人员，分布在 Kyiv、London 和 Silicon
              Valley。这些数据点方向上重要，因为它们暗示公司已有真实供应与集成足迹，而不是概念期载体；但这些仍是公司自称，缺少已提交账目、客户采购订单或披露股权表支撑。因此，公开证据对轮次和估值的支撑强于对收入质量、利润率或完全稀释后所有权的支撑。
