  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资真实存在，但承销材料仍然很薄
        blocks:
          - type: paragraph
            body: >-
              UForce 已经跨过估值分析的第一道门槛：融资和头部价格都有充分佐证。公司自己的发布材料、UK Defence Journal 和 Orbital Today 都支持其 $50 million 初始融资和超过
              $1 billion 的估值；管理层还声称 2025 年订单额达到九位数、订单增长接近 500%、足迹覆盖六个盟友国家，并拥有超过 1,000 名专业人员。这足以把 UForce
              视为一个严肃的从战时走向西方商业化的故事，而不是幻灯片概念。但按正常后期种子轮纪律，它还不足以支撑入场价格。公开来源仍未披露经审计收入、毛利率、烧钱速度、现金转化、客户集中度、验收里程碑，或软件和保障经济性是否能与硬件和系统集成有意义地分开。Companies
              House 备案确认公司资本化和公司活动活跃，但没有说明估值背后的经济性。因此核心判断是不对称的：看多叙事很容易理解，但缺失的财务档案意味着价格仍应作为假设检验，而不是直接当作便宜。
