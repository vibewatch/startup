      - number: '2.4'
        title: 增长驱动强，但转化仍被瓶颈卡住
        blocks:
          - type: paragraph
            body: >-
              需求侧很强。欧洲和英国政策如今公开承认，低成本无人机可以击败更精致昂贵的系统，盟国军队必须向乌克兰学习，工业基础也必须更快扩产。EU
              机构正在增加资金、初创公司准入路径、共同采购激励和无人机防御倡议；Orbital Today 和 The European 也都描述了由主权诉求驱动、转向欧洲本土 UAV、反 UAS
              和低成本自主平台项目的趋势。但采用并不顺滑。出口管制覆盖受控军事物资、软件和技术，这意味着即使没有机体跨境，自主和 C2
              转移也可能被许可证卡住。欧洲市场也碎片化：供应商要面对多个国家项目、本地制造预期，以及向可信标签、协调测试、通用数据格式和联合采购等重证明标准的转变。基础设施和机动性也是瓶颈的一部分，因为 NATO
              仍要为空军基地、燃料系统、海上基础设施和指挥系统提供资金；REPMUS 这类演习也需要实弹 / 实地试验场访问和作战部署后勤。最后，自主伦理尚未定型。Human Rights Watch
              的问责批评说明，买家可能要求更强的人类控制、审计和保证案例，才会让自主能力更接近杀伤链。
