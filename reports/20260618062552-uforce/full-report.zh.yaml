        - Blue UAS 定位、快速部署、GPS / 通信干扰韧性
        - 域覆盖窄于 UForce；此处没有海 / 陆 / 拦截广度的公开证据
      - - Helsing
        - 欧洲主权 AI 同行
        - 独立报道提到 €600M Series D 和约 €12B 估值
        - 寻求 AI 赋能自主能力和契合主权诉求系统的欧洲军方
        - 主权叙事强，也愿意从软件进入硬件
        - 本次运行中官网限流，独立报道占主要证据来源
      - - Rheinmetall
        - 主承包层在位者
        - 上市公司；国际系统供应商，在 Ukraine 侧有可见布局
        - 需要主承包集成和主权产业深度的大型防务项目
        - 分销能力、采购可信度、主承包层地位
        - 不太可能贴合 UForce 灵活的可消耗创业公司身份
      - - Palantir
        - 软件层相邻竞争者
        - 上市公司规模在定性上清晰，但本章证据聚焦防务产品，而非具体 IR 数字
        - 选择分析、决策和作战软件的防务组织
        - AI 赋能防务软件，并有长期前线部署叙事
        - 不是直接的可消耗硬件竞争者；更多争夺软件预算和工作流控制
    notes: 规模单元格区分了可量化信号和披露缺口。对于公开证据偏薄的私营同行，表中明确说明，而不是猜测。
