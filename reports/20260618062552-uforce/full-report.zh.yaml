      - number: '7.3'
        title: 主权、伙伴与上游依赖风险
        blocks:
          - type: paragraph
            body: >-
              排在其后的风险是依赖：依赖上游平台、特定司法辖区供应链，以及主权政治。欧洲自己的政策方向已经说得很清楚：未来无人机能力应由本地控制、符合欧盟支持项目资格，并降低对非欧洲供应商的依赖。美国也通过外国无人机限制和支持本土生产的产业政策，走向类似方向。UForce
              分布在盟友国家的布局有助于满足这些要求，但前提是它能证明对所营销平台拥有稳定权利，并真正掌控物料清单、质量体系和本地化。公开证据仍让这些点显得模糊。UForce 营销使用同一个品牌，但围绕 Magura
              的独立报道仍会出现上游平台名称和独立制造商身份。试点阶段可以管理这种模糊性；可一旦主权买家追问设计归谁、谁能出口、如果某个供应商、国家或政治关系变化谁保证长期供应，模糊性就会变成实质问题。
