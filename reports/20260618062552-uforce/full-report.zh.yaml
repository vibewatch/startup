  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 作战用户可见；机构付款方大多只能推断
        blocks:
          - type: paragraph
            body: >-
              UForce 的公开客户图景应比泛泛的“盟国军队”标签切得更细。最清晰的公开用户群体是乌克兰作战单位和操作者社区，他们在战时使用了底层系统。最清晰的公开付款方模式来自 Inventure 的 neoprime
              描述：UForce 是一家承包商，直接签政府合同，再用自有和分包能力组装交钥匙作战系统。这意味着用户、买家和付款方不是同一个主体：前线操作者选择并验证装备，但主权买家或部委才可能是合同对手方。第二类是
              UForce 正在推动采用的盟国国防部和军种部门，即便公开合同授予未披露。第三类是 NATO
              试验和训练生态，乌克兰操作者知识在这里转化为盟友互操作和作战原则学习。第四类是美国扩张公告中已点名的海上安全和关键基础设施相邻市场。第五类是本地制造、认证和系统级部署需要的渠道与集成伙伴。结果是一张拥有真实作战可信度、但公开账户命名有限的客户地图。
