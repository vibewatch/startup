      - CV020
      - CV021
      - CV023
      - CV033
      - CV039
      - CV040
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间说明：当前轮次可以自洽，但对新投资者还谈不上明显有吸引力。
    data:
      items:
        - label: 悲观
          low: 0.4
          mid: 0.55
          high: 0.7
          displayValue: $0.4B-$0.7B
          tone: risk
          detail: 转化偏弱、硬件占比高、本地化更慢
        - label: 基准
          low: 0.9
          mid: 1.2
          high: 1.5
          displayValue: $0.9B-$1.5B
          tone: neutral
          detail: 转化适中，保障 / 软件组合改善，采购门槛打通
        - label: 乐观
          low: 1.8
          mid: 2.3
          high: 3
          displayValue: $1.8B-$3.0B
          tone: positive
          detail: 西方包装受偏好，自主能力和项目规模经济性可复制
    approximationNotes: 数值是以十亿美元计的指示性公允价值区间，基于明确分析假设，而不是市场报价。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
