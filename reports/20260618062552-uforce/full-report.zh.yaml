      - number: '2.3'
        title: 买家是国防部、联盟通道和试验管线
        blocks:
          - type: paragraph
            body: >-
              UForce 的买家地图与其说由大众商业渠道决定，不如说由主权和联盟工作流塑造。核心买家是盟国国防部和由主承包商主导的项目：它们需要低成本空中、海上、地面和反 UAS
              能力，再加软件集成。互操作性、指挥结构和基础设施成为要求时，NATO 共同资金很重要；但部署往往仍通过各国部委和具体项目办公室推进。试验路线在这个市场里异常重要。REPMUS
              征集通知明确邀请产业界参与一条路径，目的在于推动系统完成开发并进入作战服役；Dynamic Messenger/REPMUS 2025 则把 3,800 名参与者、260 套系统、22 个国家、集成多域 C2
              问题和乌克兰直接作战经验带入 NATO 环境。这与 UForce 高度相关，因为它销售的是源自乌克兰的多域技术栈，差异化取决于证明互操作性和真实任务适配，而不是赢下一份纯纸面
              RFP。因此，买家地图和采用路径图强调国防部、项目办公室、试验场和联盟演习，而不是简单目录式采购。
