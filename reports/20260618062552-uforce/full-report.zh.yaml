  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 视角
      - 投资论点
      - 反论点
      - 可能改变判断的证据
    rows:
      - - 战场验证
        - UForce 汇集了已在乌克兰经受海、空、陆和 C2 测试的系统
        - 战场验证不自动等于西方资质、保障能力或毛利质量
        - 盟友买方给出的具名合同、复购订单和验收指标
      - - 投资人质量
        - Lakestar、Shield Capital 和盟友安全投资人提升可信度和渠道
        - 好投资人抹不掉披露缺口和运营复杂度
        - 投资人实际跟投支持，以及借其网络拿下的项目
      - - 西方包装
        - 英国和美国包装能让乌克兰技术更容易被盟友采购
        - 包装不等于对上游系统拥有持久权利
        - 按平台族披露的排他权、出口权和本地化权利
      - - 市场顺风
        - 欧盟、NATO 和美国政策都指向更多无人机和反无人机需求
        - 顺风也可能奖励资本更厚或更透明的同行
        - UForce 能把试点和演习转化为规模化授标的证据
      - - 经济性
        - 九位数订单额暗示真实需求和潜在规模
        - 没有公开收入、毛利率或烧钱数据，这些订单的质量仍未知
        - 按项目类型披露收入确认、毛利率和营运资金
    notes: 反论点不是否定公司，而是列出一名重视估值纪律的投资人为何不能把当前价格视为明显便宜。
