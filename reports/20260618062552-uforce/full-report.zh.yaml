      - number: '4.4'
        title: 估值证据强于经济性证据，因此这仍是尽调密集型承销案例
        blocks:
          - type: paragraph
            body: >-
              核心财务结论很直接：UForce 可能有真实需求和可信的政府合同收入模式，但公开证据尚不足以有把握承销收入质量、利润率路径或现金续航。最强的已验证数据点来自外部：$50 million
              种子轮和十亿美元估值。最弱的数据点恰恰是承销最需要的：经审计收入、订单额到收入的转化、客户集中度、付款里程碑、硬件与软件各自毛利率、烧钱速度和账上现金。Companies House
              增加了一个小但值得注意的不利信号，因为审阅时贸易实体页面显示 confirmation statement 逾期；这强化了更大的问题：披露卫生落后于估值头条。Orbital Today 的盈利性引用来自
              Resilience Media 的二手信息，方向上有意思，但远不足以修补证据缺口。谨慎投资者因此可以说，如果订单额真实、公司能把交钥匙合同转化为经常性保障和软件经济性，且美国 /
              盟友制造顺利爬坡，那么估值或许可以解释。但在拿出合同级、现金流和利润率数据前，诚实立场是：UForce
              作为战略防务叙事比作为完全可承销的财务模型更容易相信。政策背景还引入二阶风险：即便欧洲和美国持续增加无人机支出，买家也越来越想要可互操作、扎根本土且政治上可支持的供应链。EPRS
              明确把创新与有意义的人类控制、出口管制纪律配对；近期 EU 争论也显示，并非每个头条倡议都会顺滑转化为中央协调采购。
