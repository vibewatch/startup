  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律结构与运营模式
        blocks:
          - type: paragraph
            body: >-
              UForce 对外定位是一家位于英国的自主系统防务公司，2026 年 3 月 5
              日走出隐身状态，面向盟国军队商业化经实战验证的乌克兰无人能力。官方发布稿称，公司把空中、海上和地面系统以及指挥控制软件统一进一个面向西方政府买家的作战平台；UK Defence Journal 和
              Crunchbase 也独立描述了同一家伦敦防务初创公司，称其销售乌克兰战争中使用的无人系统。UK Companies House 记录显示，UFORCE GLOBAL LIMITED 于 2025 年 1
              月注册，UFORCE TRADING LIMITED 于 2025 年 5 月在同一伦敦地址注册；这更像控股加贸易结构，而不是松散经销网络。它的运营模式不是围绕单一无人机的纯 OEM：公司销售的组合横跨
              Magura 海上系统、打击和轰炸 UAV、地面机器人、遥控武器站，以及一个厂商中立的自主 / C2 层，用来为盟友采购整合异构平台。
