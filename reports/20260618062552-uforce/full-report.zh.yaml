  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: 公开验证从前线使用进入盟国试验，再走向本地化和采购；证据最大的断层出现在演习成功与具名授标之间。
    data:
      nodes:
        - id: f1
          label: 乌克兰作战使用
          detail: 战场任务和操作员选择构成初始验证层。
        - id: f2
          label: 公司披露任务规模
          detail: 150k+ 到 200k+ 次任务显示复现频率，但不显示客户数量。
        - id: f3
          label: NATO / REPMUS 验证
          detail: 乌克兰 OPFOR 角色和 Magura 验证形成面向盟国的证明。
        - id: f4
          label: 盟国采购关口
          detail: Royal Navy 背书和类似评估路径筛选系统。
        - id: f5
          label: 本地化与伙伴建设
          detail: 美国制造和集成伙伴关系让采购在政治上更容易。
        - id: f6
          label: 具名生产授标
          detail: 这一阶段的公开证据仍大体缺失。
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
    approximationNotes: 该流程为定性图，突出证据质量在哪里掉线。它不应被解读为披露了转化率的内部漏斗。
