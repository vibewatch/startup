  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: UForce 横跨多个竞争类别，而不是一个整齐的同业集合
        blocks:
          - type: paragraph
            body: >-
              UForce 的正确竞争集合天生混合。它的公开材料并未描述单一无人机 SKU，而是描述了一个组合：横跨 Magura 海上系统、空中打击无人机、地面机器人、拦截器，以及厂商中立的多域 C2
              stack。这意味着公司不只是在与战术无人机制造商竞争。它在自主加系统叙事上与 Anduril 和 Shield AI 重叠，在更宽的力量防护和多域防务采购上与 AeroVironment 和
              Rheinmetall 重叠，在小型韧性无人机上与 Skydio 重叠，在欧洲优先的 AI 防务定位上与 Helsing 重叠，在承诺决策优势和作战集成的软件层上与 Palantir
              重叠。实际含义是，买家会按任务用不同购买标准比较 UForce。遇到紧急海上或拦截问题，UForce
              可能像可消耗硬件供应商；遇到混合机队现代化问题，它更像软件赋能的集成商。这种弹性有价值，但也意味着公司暴露在比窄领域专家更多的替代路径下。
