      - number: '1.4'
        title: 里程碑、验证事件与不利背景
        blocks:
          - type: paragraph
            body: >-
              UForce 的早期里程碑更多集中在验证和规模，而不是漫长公司历史。公司于 2026 年 3 月走出隐身状态，公开把平台与数十万次战时任务绑定；随后在 2026 年 5 月宣布美国 CEO，并预期首批美国制造
              USV 将在 2026 年夏天下水，从而扩展叙事。产品页面进一步加深了这条线索：Magura 海上平台声称击中过十余艘军舰，UForce C2 至少管理了 150,000 次跨域任务，平台在 Siil 2025
              和 REPMUS 2025 战术红队评估中获胜。NATO 自己关于 Dynamic Messenger/REPMUS 的说明确认了演习规模，也确认乌克兰领导了 opposing force；即便 NATO
              未点名公司，这也给 UForce 的演习验证叙事提供了一定外部支撑。主要不利问题与其说是已披露丑闻，不如说是背景：Human Rights Watch 等自主武器批评者正加大对更接近自主杀伤链的军事系统的审视，而
              UForce 仍未披露经审计收入、具名客户名单或正式治理材料，无法抵消这类政策和声誉风险。
