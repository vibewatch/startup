  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 当前信号 / 规模线索
      - 暗示什么
      - 为什么关系到 UForce
      - 局限
    rows:
      - - Anduril
        - 2026 年官方宣布完成 $5B Series H 融资
        - 品类信念足够强时，顶级私募国防科技资本会支持超大轮融资
        - 解释了投资人为何可能容忍品类龙头的激进定价
        - Anduril 的资本厚度、制造雄心和机构成熟度都深得多
      - - Shield AI
        - 首页横幅提到以 $12.7B 估值融资 $2B；Hivemind 被包装为平台无关的自主系统
        - 技术栈可复用时，自主系统软件能拿到很高的战略溢价
        - 可作为 UForce 想围绕 C2 和自主系统主张的软件与 AI 层基准
        - Shield AI 的软件位置和资本深度比 UForce 更清晰
      - - AeroVironment
        - 55+ 个国家 50,000+ 次部署，加上公开年报历史
        - 公开市场奖励规模和披露，而不只是叙事
        - 对比凸显 UForce 目前提供的财务透明度很少
        - AeroVironment 是成熟上市老牌厂商，不是种子阶段集成商
      - - Palantir
        - 官方 2025 年 Q1 发布稿提到收入同比增长 39%，国防专用平台界面仍由软件驱动
        - 软件层可以按不同于硬件项目的基础估值
        - 提醒投资人：没有证据前，不要把 Palantir 式软件经济性过度加给 UForce
        - Palantir 是差异很大、披露充分得多的软件优先公司
      - - Skydio
        - 国家安全 sUAS 项目主打战术 ISR、基地安全、边境安全和 X10D 生存性
        - 面向具体任务的 sUAS 定位正在成为国防 GTM 的标准打法
        - 即便强势无人机厂商，也锚定用例、生存性和工作流，而不只是机体
        - Skydio 范围更窄，多域程度不及 UForce 的叙事
      - - 欧盟 / NATO 无人机市场背景
        - BCG、EC、EPRS 和 NATO 都指向更大、更标准化的无人机与反无人机需求
        - 市场背景足够强，能支撑多个赢家和溢价叙事
        - 解释了为何 UForce 在财务充分披露前，也可能具备战略重要性
        - 政策需求不保证某一家公司能获得超额经济性
    notes: 这组可比对象混合了私募轮次、公开市场披露标准、软件层参照和政策背景。它刻意匹配模型需要，而不是做一个虚假的单一倍数筛选。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-useful public valuation and model-reference comparables visible in the reviewed
        source pack plus net-new official pages; they are not an exhaustive list of every defense-tech peer or financing
        event.
