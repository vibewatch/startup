            body: >-
              公开来源能看到扩张机会，也能看到障碍。美国 CEO 公告点名政府合作、战略伙伴、本土制造、海上用例和关键基础设施集成这些下一步扩张表面。更广政策来源强化了这些并非假想市场：BCG
              认为欧洲军事和关键基础设施反无人机需求正快速扩大；EU 和 NATO 讨论也正在向联合采购、测试、互操作性和工业规模收敛。与此同时，采购摩擦相当大。英国出口管制规则覆盖军事物资、软件、技术和部分经纪活动；英国
              Defence Drone Strategy 强调更快但更标准驱动的采购；Inside Unmanned 强调可信标签、协调测试和数据互操作；ASIS
              则展示外国无人机限制如何在本土供应链接上前扰乱运营。这里就是证明与生产之间的风险。UForce 可能拥有可信战场和演习证明，但盟友买家越来越想要有文档、可许可、可本地化、政治上可支持的供应。由于具名外国
