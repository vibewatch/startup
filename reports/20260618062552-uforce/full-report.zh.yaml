      - number: '8.2'
        title: 可比框架更多支持战略相关性，而非干净的价格锚
        blocks:
          - type: paragraph
            body: >-
              真正让这个价格值得认真对待的理由，来自品类成形，而不是 UForce 已披露的单位经济。欧洲和 NATO 正把无人机与反无人机从小众装备转为基础安全设施；RAND、CSIS 和 BCG
              也都强化同一方向：低成本自主系统、韧性软件层、互操作性和工业规模，如今比精致的一次性平台更重要。在这一背景下，UForce
              的战场学习回路和以伦敦为基地的西方包装层具有战略价值。同业集合也解释了投资人为什么可能容忍较高的头部价格。Shield AI 的官方页面把自主软件与 2026 年融资横幅、$12.7 billion
              估值并列；Anduril 宣布完成 $5 billion Series H 融资；AeroVironment 展示成熟披露和已部署规模是什么样；Palantir 说明软件层如何配得上自己的防务溢价；Skydio
              则凸显国家安全 sUAS 供应商营销的是生存能力和任务专用工作流，而非商品化无人机。即便如此，可比公司不会自动让 UForce
              显得便宜。多数同业要么披露更多，要么规模大得多、资本基础更深，或以更明确的软件主导方式运行，而 UForce 尚未公开证明这一点。
