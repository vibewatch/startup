  - id: TV005
    title: 论点失效与否决触发项表
    columns:
      - 触发项
      - 门槛 / 可观察信号
      - 对论点的传导
      - 行动含义
    rows:
      - - 美国本地化停滞
        - 反复发布美国扩张信息后，仍没有可信的制造、合作伙伴或机构牵引
        - 削弱西方包装和规模叙事
        - 转为回避，直到证据改善
      - - 权利仍不清晰
        - 管理层无法证明对旗舰系统拥有出口、本地化或排他权
        - 组合广度不再是护城河，反而变成依赖风险
        - 将当前估值视为过度投机
      - - 演习到授标转化失败
        - 高曝光试验持续出现，但没有可重复项目浮现
        - 说明只有赞赏，没有采购拉动
        - 下调基准和牛市情景概率
      - - 自主系统政策反弹加剧
        - 有意义人类控制或供应商主权规则缩窄采用范围
        - 压缩可服务市场和倍数支撑
        - 围绕纯硬件经济性重新承销
      - - 财务披露继续关闭
        - 即使流程后期仍没有合同级桥表、毛利视角或优先权披露
        - 让有纪律的投资人无法测算下行
        - 不要领投，也避免追价
    notes: 每个触发项都应能在尽调或下一轮刷新中观察到，而不是抽象担忧。
    claimRefs:
