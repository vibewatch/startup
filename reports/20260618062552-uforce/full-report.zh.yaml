      - number: '4.3'
        title: $50 million 是有意义的种子资本，但相对运营模式可能偏少
        blocks:
          - type: paragraph
            body: >-
              资本充足性最能体现估值与披露之间的缺口。UForce 并未把自己呈现为轻软件转售商。它描述的是一家全栈自主系统公司，跨越 15 个以上地点进行制造、软件更新、测试、验证、集成和战场部署；2026 年 5 月美国
              CEO
              公告还明确把下一阶段与美国政府合作、伙伴关系和美国本土制造绑定。这种运营形态在现金转化前会带来沉重营运资本需求：库存和组件采购、本地化组装、出口管制合规、系统集成、测试、操作者培训和支持。英国备案强化了公司结构一直活跃这一点，包括多次配股、缩短会计期间和单独贸易实体；但这些仍未披露投资者真正会用来判断现金续航的核心私营公司指标。外部政策来源强化了需求侧，同时也凸显资本密集度。NATO
              资金、EDF 和 EDIP 都指向无人和反无人能力的大规模采购与工业强化资金池，但这些项目同样奖励规模、标准合规和本地制造深度。总体看，$50 million
              种子轮对种子期来说很大，也可能足以支撑即时商业化和美国市场进入步骤；但相对于九位数订单额和系列化生产雄心所暗示的多国制造、集成和支持负担，它显得偏少。更新的公共政策和演习来源进一步说明，这不只是需求故事，也是执行故事：Royal
              Navy 的 REPMUS 通知把互操作性放在通往作战服役的路径中心；Defense News 报道了 2025 年演习中的每日干扰试验；当前美国政策正转向可消耗无人机和本土生产。欧洲政策也指向同一方向。EPRS
              和 LEAP 报道暗示更多联合采购和工业支持将到来，但也显示标准、主权和协调政治会塑造谁能拿到支出。
