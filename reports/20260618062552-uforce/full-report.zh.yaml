  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 指示性估值区间
      - 概率信号
      - 关键观察点
    rows:
      - - 熊
        - 订单额无法顺畅转成收入；硬件 / 集成占比仍高；美国和欧盟本地化延误；政策审查增加摩擦
        - $0.4B-$0.7B
        - 公开经济性继续不透明，演习验证没有转成规模化授标
        - 收入转化、毛利率、具名复购合同
      - - 基准
        - 订单额转成主权客户收入；支持 / 软件附加率有所改善；采购关口缓慢但稳步打通
        - $0.9B-$1.5B
        - 公开信号仍为正但不完整，大致支撑今天的估值标记
        - 订单额到收入桥表、本地化里程碑、客户集中度
      - - 牛
        - UForce 成为战场验证乌克兰系统的首选西方包装；C2 / 自主系统经济性得到证明；盟友项目跨域放量
        - $1.8B-$3.0B
        - 需要证据证明 UForce 不只是经销商或集成商
        - 权利 / 排他性、软件附加、跨国复购授标
    notes: 区间是明确的分析情景，不是市场报价。它们用于显示当前价格有多大比例取决于公开证据尚未回答的假设。
