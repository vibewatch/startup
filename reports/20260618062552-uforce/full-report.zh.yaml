      - number: '1.2'
        title: 领导层、治理与创始人市场匹配
        blocks:
          - type: paragraph
            body: >-
              对一家种子期防务硬件平台来说，UForce 的领导层组合罕见地偏政策型。Oleg Rogynskyy 是创始 CEO，对外形象是曾创办 People.ai 的连续创业者；Oleksiy Honcharuk
              既是联合创始人也是董事会主席，带来乌克兰政府高层和无人系统政策经验。UForce 自己的公司页面和发布稿称，Honcharuk 曾为 Ukraine’s Unmanned Systems Forces
              指挥官提供建议，并担任 Aerorozvidka 监事会主席；他被放在战场操作者与西方机构买家之间的内部翻译者位置。英国前国防大臣 Ben Wallace 也出现在发布时的领导阵容中；2026 年 5
              月，公司宣布任命美国前高级国土安全与网络官员 Sean Plankey 为美国
              CEO，推动美国政府合作和制造计划。战略上行空间很明显：很少有初创公司能同时拿到乌克兰前线操作者洞察、英国部长级可信度和美国采购入口。下行风险同样清楚：治理集中在少数有政治连接的人手中，继任深度未披露，网络入口本身也是护城河的重要部分。
