  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重度
      - 威胁为何可信
      - 缓释 / 尽调问题
    rows:
      - - 经 Ukraine 战场验证的系统很难复制
        - 同行可以吸收战场经验，而不必购买 UForce
        - 高
        - Shield、Anduril、Helsing、Rheinmetall 和盟友买方都在快速把自主能力与 Ukraine 经验导入自己的栈
        - 询问哪些能力是排他的，哪些只是转售 / 集成关系，哪些拥有受保护的软件或制造权利
      - - 供应商无关 C2 创造粘性集成价值
        - 多栖使用可能一直很容易，难以形成锁定
        - 高
        - Shield 明确营销客户自有自主 IP，UForce 自己也宣传零定制开发集成
        - 索取流失数据、替换案例研究，以及 UForce C2 在试点部署后成为记录系统的证据
      - - 可消耗经济性胜过精贵系统
        - 大型主承包商可以把规模与低成本效应器结合，在制造端压价
        - 高
        - BCG、CSIS 和欧洲政策转向都支持规模化生产与产业深度
        - 测试冲突紧迫性常态化后，UForce 是否有主权组装、可重复供应商和利润率韧性
      - - 组合广度是一道护城河
        - 专业厂商可在各细分品类击败 UForce
        - 中
        - Skydio 在战术 sUAS 上产品化更深；Shield 的软件定位更清楚；主承包商的分销更强
        - 按任务映射胜率，并要求拿出证据证明跨域打包确实改变采购结果
      - - 政策通道可撬开采购
        - 政治通道未必能转化为长期合同
        - 中
        - 欧洲项目仍取决于标准、测试、出口管制和本地产业匹配度
        - 要求披露具名项目管线、本地合作伙伴结构，以及紧急战时渠道之外重复采购的证据
      - - 公司还早，披露薄可以接受
        - 披露不透明可能掩盖单位经济性偏弱或渠道依赖
        - 高
        - 与披露更充分的同行相比，公开证据中关于定价、已实现合同、客户集中度和排他性的内容很少
        - 在判断护城河耐久性之前，优先在资料室尽调定价、毛利、排他性、合同续约和渠道经济性
    notes: 这张登记表把真正的护城河驱动因素，与可被更大同行或主承包商用资本、采购通道或标准合规深度中和的叙事区分开。
