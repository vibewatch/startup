      - number: '3.2'
        title: 最危险的同行各自在不同轴线上取胜
        blocks:
          - type: paragraph
            body: >-
              Shield AI 是最清晰的自主软件同行，因为 Hivemind 明确是平台中立、军民两用，并为 OEM 和军事集成而设计；它竞争的是 UForce 销售厂商中立 C2
              与自主能力的那一部分，而不只是载具。Anduril 从相反方向竞争：广泛的自主防务定位，加上通过 Arsenal-1
              展开的显性制造论点；这很重要，因为采购赢家越来越不仅需要好软件，还需要批量交付能力。AeroVironment 和 Rheinmetall 在叙事上没那么贴近
              UForce，但它们重要，因为拥有装机基础、上市公司或挂牌公司可信度，以及更深的采购肌肉。Skydio 更窄，但围绕韧性小型 UAS 性能高度产品化，可能在战术 ISR 和基地安全工作流中挤压
              UForce。Palantir 是软件层相邻竞争者；买家选择分析、指挥和工作流骨干时，可能先把预算分给它，再购买新硬件。Helsing 则是欧洲本土主权叙事下的 AI 同行：按公开报道资本实力远强于
              UForce，越来越愿意从软件进入硬件，并且与欧洲工业自主叙事高度一致。
