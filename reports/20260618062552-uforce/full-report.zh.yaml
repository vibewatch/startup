  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
      - 对交易的影响
    rows:
      - - 订单额到收入
        - 从订单额到已确认收入和现金回款的合同级桥表
        - 区分标题需求和可收款经济性
        - CFO / 财务室；按地域抽样头部项目
        - 最高优先级
      - - 按技术栈层划分的毛利率
        - 硬件、软件、集成与保障的毛利画像
        - 决定 UForce 应被视为系统集成商，还是具备软件上行
        - 财务 + 运营复核，附队列样本
        - 最高优先级
      - - 客户集中度
        - 头部客户、付款里程碑，以及续约 / 复购历史
        - 揭示依赖和议价能力
        - 销售 / 合同尽调
        - 高
      - - 平台权利和排他性
        - 按旗舰系统列明出口、本地化和衍生作品权利
        - 检验 UForce 是否拥有护城河，还是在撮合他人的成功
        - 法务 + 产品尽调
        - 高
      - - 股权结构和优先权
        - 优先权堆栈、按比例认购权、清算条款和员工稀释
        - 即使标题估值不变，也会改变真实进入经济性
        - 法律文件和融资明细表
        - 高
      - - 质量 / 保障证明
        - 可靠性、任务中止、支持负载和演习到授标转化数据
        - 把战争验证桥接到西方采购质量
        - 运营和客户访谈尽调
        - 中高
    notes: 若要把建议从继续研究推向买入，而不只是确认这条故事值得关注，这些是最低限度的问题清单。
    claimRefs:
