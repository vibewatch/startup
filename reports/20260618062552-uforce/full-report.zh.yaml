      - number: '6.3'
        title: 耐久性由任务复用 proxy，而不是续约指标 proxy
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据远弱于公开采用证据。已审阅来源没有披露净收入留存、总收入留存、客户流失、合同期限、cohort 续约或满意度指标。因此，本章只能依赖重复使用 proxy，而不是财务式留存数据。最好的 proxy
              是作战复用：Magura 被描述为参与过数百次任务，U-C2
              声称在受干扰电子战环境中进行夜间多厂商蜂群协调，公司还称乌克兰采购体系内部重视操作者选择。这些点重要，因为它们暗示终端用户不只是看一次演示，而是在重复行动中回到这些系统。直接政府交钥匙模式也支撑一个可信粘性论点：一旦系统被嵌入
              doctrine、训练和支持工作流，粘性就会上升。不过，这些都没有证明复购节奏、合同续约或装机基础耐久性。谨慎解读是，UForce
              在系统已投入作战的地方很可能有真实重复使用，但这种使用的商业耐久性仍大多是私密信息。
