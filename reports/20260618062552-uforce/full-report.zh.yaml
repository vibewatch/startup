  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合宽度与买家待办任务
        blocks:
          - type: paragraph
            body: >-
              应该把 UForce 理解为围绕多个经战场验证的乌克兰系统搭建的产品组合包装，而不是一家围绕单一白纸设计载具建立的公司。它的公开材料持续把海上平台、轰炸与打击无人机、地面机器人、反 UAS
              效应器和共享指挥控制层打包成一个可出口给盟友买家的方案。这很重要，因为客户工作流不是简单买一架无人机：公司推销的是一个交钥匙作战系统，可本地化、集成并快速部署，用于海上拒止、分层反无人机防御、地面侦察和蜂群赋能打击行动。海上层仍是旗舰，因为
              Magura 拥有最强公开战斗记录；但空中和地面层扩大了销售包络，也强化了集成商论点。Bucha 也说明，并非每个产品同样成熟：UForce
              愿意把预系列或飞行测试阶段系统与已验证系统一起营销。因此，实际产品故事是一个成熟度不一的混合组合，由快速部署、互操作性和更低成本可消耗效果的承诺串在一起。
