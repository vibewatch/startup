      - number: '3.3'
        title: UForce 赢在低成本可消耗论点，但同行赢在披露和分销
        blocks:
          - type: paragraph
            body: >-
              几乎整个竞争集合的公开价格透明度都很差。UForce 自己的公开论证主要是定性：更便宜、可消耗、快速迭代的系统；更低成本的拦截概念；以及实用的战场反馈循环。Shield、Anduril、Palantir 和
              Rheinmetall 同样销售结果，而不是标价。Skydio 是包装清晰度上的例外，因为 X10D 页面披露了部署时间、速度、Blue UAS
              状态和传感器配置，尽管它仍未展示公开标价。换句话说，市场价格不透明，但产品包装并非同样不透明。因此，分销和采购入口变成决定因素。AeroVironment 和 Rheinmetall
              已经像成熟采购对手方。Shield AI 和 Anduril 则把更强资本化与更清晰自主品牌结合起来。欧洲当前政策方向会放大这一点：BCG、EPRS、Inside Unmanned、Orbital Today 和
              The European 都指向互操作性、本地生产、共同标准和更大的协同采购池。UForce
              的分布式盟友供应链和政策型领导层有帮助，但公司仍要证明，它能把这些要素转化为主权组装、可重复渠道和长期项目，而不是紧急一次性订单。
