      - number: '3.4'
        title: 只有当战斗验证和集成胜过资本与规模时，护城河才真实
        blocks:
          - type: paragraph
            body: >-
              UForce 最强的护城河主张，不是钱包最深，也不是披露的软件业务根基最强；而是它能比大型机构更快把真实乌克兰战场学习导入盟友采购。这很重要，因为公开记录显示，它覆盖海、空、陆、拦截和 C2，并声称能在 EW
              和混合机队条件下运行；许多对手也这么营销，但更少能如此直接绑定乌克兰作战经验。不过，如果护城河主要依赖打包其他上游产品、却没有持久独占性，它会很脆弱；如果买家决定把 Shield AI 或 Palantir
              的专业软件叠加到其他硬件上，也会削弱它。主权要求若偏向主承包商、合资企业和本地工厂，而不是分布式但仍由外部组装的网络，护城河同样脆弱。这里的不利证据很重要：EPRS
              认为无人机在战术上关键，但不会自动在战略上决定胜负，且仍易受反制。CSIS
              也把工业敏捷性定义为成功的核心决定因素。因此，持久版护城河不是“更好的无人机”，而是经战斗检验的集成、可信互操作、政策入口，以及按规模本地化并支持采购的能力。
