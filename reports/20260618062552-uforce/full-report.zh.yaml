      - number: '5.3'
        title: 战斗验证、迭代速度与工业化路线图
        blocks:
          - type: paragraph
            body: >-
              UForce 拥有许多西方防务初创公司仍缺少的真实优势：头部系统连着实战使用，被描述为迭代型而非精致昂贵型，并围绕可消耗效果定价，而不是围绕少数镀金资产。Magura 拥有最强独立证据，包括 REPMUS
              可见度，以及公开报道中乌克兰海军系统在每日干扰窗口中接受 NATO 部队测试。Nemesis 有奖项背书的战场验证；D21 至少有具体公开规格，而不是纯营销语言。公司还称供应链已横跨六个盟国，美国制造 USV
              应在 2026
              年夏天到位；这显示它有意把战时优势转化为西方产能。竞争差异化因此不在于披露新奇硬件物理学，而在于把经验证载具、更快更新循环和单一编排层组合成一个盟友买家能快速采用的作战包。挑战在于，各模块公开成熟度数据不均，尤其是
              Bucha、保障指标，以及从乌克兰生产移交到美国系列化制造的过程。
