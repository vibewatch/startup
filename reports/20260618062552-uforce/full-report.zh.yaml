companyProfile:
  summary: >-
    UForce 是一家总部在伦敦的防务科技公司，2025 年 1 月在英国正式注册成立，并于 2026 年 3 月公开发布。它把经实战验证的乌克兰自主系统整合进一个面向西方政府合同的平台，覆盖海、空、陆、反 UAS 和多域
    C2，背后有 Lakestar、Shield Capital 和 Ballistic Ventures 支持。公开证据支持 $50 million 种子轮、$1 billion
    估值，以及从战时能力走向盟友商业化的可信逻辑，但不足以证明经审计收入或合同质量可见度。
