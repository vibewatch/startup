  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 美国制造执行滑坡
        - 首批美国制造 USV 里程碑和场地就绪检查点
        - 到 2026 年 Q4 仍没有可信的量产就绪演示，或反复错过供应商资质节点
        - 下调美国扩张假设，并重新承销毛利率和时间表
      - - 出口权利模糊持续存在
        - 已签署的 OEM、IP 和出口权利确认
        - 重大西方订单之前，核心平台仍没有干净权利包
        - 视为集成商利润和本地化论点受损
      - - 可靠性证据始终不成熟
        - 正式测试、保障和验收指标发布
        - 更多 NATO / 部委试验后仍没有买方级可靠性包
        - 暂停对批量采购转化的信心
      - - 主权客户集中度变得极端
        - 头部客户占比和管线账龄
        - 一个国家或军种占近期订单 >40%，且付款周期长
        - 对估值和融资假设施加集中度折扣
      - - 政策偏好的需求未转成复购订单
        - REPMUS/Dynamic Messenger 或同类试验后的点名后续授标
        - 到 2027 年中仍看不到公开的试点转采购进展
        - 把演习曝光重新定义为营销，而不是商业牵引
      - - 本地化卡在国籍筛查
        - 美国或欧盟的部件来源与合规审查
        - 关键部件未通过目标项目的来源或资格审查
        - 在模型中计入预算重做成本和更慢的入市节奏
    notes: 触发项按外部可监测、且会影响投资判断来设计；它们不是法律违约事件，而是一旦出现就应重做承销假设的门槛事件。
