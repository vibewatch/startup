  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式看得懂，但硬财务披露看不清
        blocks:
          - type: paragraph
            body: >-
              公开记录在商业模式描述上很强，在可审计经济性上很弱。UForce 的发布材料和独立报道持续支持 $50 million 种子轮和超过 $1 billion 的估值；公司自己则称，进入 2026 年时已有九位数
              2025 年订单额、接近 500% 的增长、横跨六个盟国的分布式足迹，以及超过 1,000 名人员。这些是重要的牵引力信号，但不同于已提交收入、毛利或现金回款。最有用的机制细节来自 Inventure 对
              UForce 作为 “neoprime”
              的描述：公司直接与政府客户签合同，再用自有产品加分包组件交付交钥匙作战系统。这个模式意味着至少五条变现路径：直接平台销售、集成作战系统交付、指挥控制和自主软件、本地制造或许可安排，以及部署后的保障或培训。它也意味着收入确认可能由里程碑和验收驱动，而不是干净的经常性
              SaaS。因此，承销问题不在于 UForce 缺少可信收入模式，而在于公司只披露了需求存在，没有披露需求转化为经审计收入、利润率或现金生成。
