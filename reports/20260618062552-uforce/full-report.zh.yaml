        blocks:
          - type: paragraph
            body: >-
              最可支撑的采用故事从乌克兰内部开始，多方来源描述了系统的大量使用和很高任务量。公开数字并不完全一致：U-C2 声称管理超过 150,000 次战斗任务，美国 CEO 页面称支持超过 200,000
              次任务，Orbital Today 则重复 150,000-plus 数字。这足以显示真实作战复用，但不足以推导账户数量或机队利用率分母。乌克兰之外，具名证据更薄但并非空白。NATO 和 Defense News
              确认，乌克兰海军把真实作战经验带入 REPMUS/Dynamic Messenger 2025；UForce 自己的海上平台页面则称 Magura 在那里通过了对 NATO Blue Forces
