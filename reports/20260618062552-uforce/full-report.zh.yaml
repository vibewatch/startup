  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 建议从实战验证和市场顺风出发，再经过披露与执行筛选，最终落到继续研究立场。
    data:
      nodes:
        - id: n1
          label: 实战验证产品组合
          detail: 海、空、陆和 C2 系统已有战时验证，形成战略相关性
        - id: n2
          label: 西方包装 + 投资者
          detail: 英国和美国包装，加上可信投资者，提升准入和信号强度
        - id: n3
          label: 需求顺风
          detail: EU、NATO 和美国政策越来越奖励无人机、反无人机和产业规模
        - id: n4
          label: 披露和权利缺口
          detail: 收入质量、利润率、客户细节和平台权利证据仍然薄弱
        - id: n5
          label: 继续研究
          detail: 保持跟进，但没有扎实尽调包之前，不能说这个价格便宜
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
    approximationNotes: 这是投资决策逻辑图，不是公司发布的流程图。
