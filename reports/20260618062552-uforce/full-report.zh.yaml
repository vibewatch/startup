      - number: '2.2'
        title: 用多重规模视角，不假装公开市场有干净的 SAM
        blocks:
          - type: paragraph
            body: >-
              公开证据支持几种市场规模视角，但没有一个针对 UForce 精确切口的权威 TAM/SAM/SOM 体系。最宽的视角是宏观防务支出：SIPRI 显示，全球军费从 2022 年的 $2.240 trillion
              增至 2023 年的 $2.443 trillion 和 2024 年的 $2.718 trillion；欧洲武器进口在 2015-19 与 2020-24 之间增长
              155%。这些数字证明预算和需求动能，但远宽于可消耗自主系统。第二个视角是可见公共项目资金。仅 NATO 2026 年 Civil Budget、Military Budget 和 NSIP 合计就超过 €5.1
              billion；EDF、EDIP 和 EUDIS 也为建设可互操作自主能力的供应商展示了数十亿欧元级的研发、生产、共同采购和初创通道。第三个视角是相邻细分需求：BCG 关于欧洲 C-UAS 的研究显示，已宣布
              MoD 支出将从 2025 年约 $0.6 billion 增至 2029 年约 $0.8 billion，更广需求到 2029 年可能超过 $5-7
              billion。因此，金字塔和区间图展示的是一组公共视角阶梯，而不是伪精确的 SAM。可投资结论是，UForce 位于一个庞大且明确上升的预算池内，但没有公开来源能干净隔离它可获得的份额。
