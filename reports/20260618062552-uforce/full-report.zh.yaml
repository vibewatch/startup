      - number: '7.5'
        title: 缓释措施、监测指标与打破投资假设的触发点
        blocks:
          - type: paragraph
            body: >-
              缓释逻辑存在，但带条件。UForce 站在有利时间点上，因为
              NATO、英国、欧盟和美国都想增加无人和反无人能力；公司拿出的也是真实战时学习，而不是实验室演示。它还拥有一个说得通的本地化叙事、一位具备国土安全可信度的美国高管，以及与政策制定者正在资助的细分领域相匹配的产品组合——海上自主、反
              UAS 和
              C2。即便如此，投资人仍应把这些正面因素视为期权，而不是证明。核心监测问题是，受政策偏好的需求能否转成可签约、可授权、可保障的生产。打破投资假设的事件因此都能在运营上观察到：如果美国生产延误，如果独家权和出口权仍不清楚，如果从演训到重复订单没有公开路径，或如果质量证据始终没有成熟，叙事可以继续亮眼，但可投资业务会变弱。
