  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 公开证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 战略亮点很强，但定价取决于非公开尽调缺口
        - 只有管理层愿意尽早开放数据室，才继续跟进
      - - 信心
        - 中
        - 融资事实已获交叉印证，但经济性大多未披露
        - 不要承销过窄的估值区间
      - - 风险评级
        - 高
        - 执行、权利和自主系统政策风险都可能压缩价值
        - 预设高尽调负担和下行不对称
      - - 估值立场
        - 偏紧
        - 公开证据能证明其重要性，不能证明便宜
        - 看到收入质量证据之前，不要把本轮称为有吸引力
      - - 回报纪律
        - 需要明确下行保护
        - 情景测算显示存在上行，但公开披露不足以支撑下注
        - 争取里程碑纪律、结构性条款，或等待更晚切入点
      - - 最重要的下一步
        - 订单到现金桥表
        - 这一套材料能厘清收入质量、毛利率和烧钱速度
        - 没有它就不要领投
    notes: 本表只基于可公开复核的证据概括投资立场；它不能替代合同、股权结构或管理层尽调。
