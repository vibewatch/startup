  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 可能的客户旅程从乌克兰作战验证开始，经过盟国试验，再进入本地化采购和支持周期。
    data:
      items:
        - label: 战场验证
          detail: 系统通过乌克兰操作员群体的反复战时使用建立可信度。
        - label: 演习验证
          detail: NATO 和盟国试验渠道测试互操作、条令适配度和红队表现。
        - label: 采购筛选
          detail: 盟国部委或军种在任何规模化授标前，会设置背书、测试和市场接触关口。
        - label: 本地化与集成
          detail: 制造、出口管制、文档和系统集成工作到位后，方案才具备授标条件。
        - label: 列装与重复支持
          detail: 只有部署之后，买方才看得见维持保障、复购和续约经济性。
    approximationNotes: UForce 不发布真实客户生命周期图，因此该旅程是根据公开战场、演习和政策来源推断出的综合采购路径。
