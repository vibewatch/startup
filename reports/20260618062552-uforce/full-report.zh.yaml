      - number: '8.4'
        title: 建议：保持跟进，但必须严守估值纪律
        blocks:
          - type: paragraph
            body: >-
              有纪律的建议是
              research-more，置信度中等、风险高，估值立场偏紧。这有意比回避更建设性，因为最强的正面因素真实存在：经战场验证的产品组合、异常快速的战时学习回路、可信的西方投资人背书，以及盟友支出、互操作性工作和产业政策紧迫性带来的顺风。但它也有意比买入更谨慎，因为几乎所有能让新投资人称这轮便宜的事实仍是私有信息。如果九位数订单额说法转化为确认收入，如果自主和
              C2 附着带来优于硬件的经济性，如果美国扩张变成可签约而不只是宣传，UForce
              仍可能长进甚至超过当前价格。在此之前，投资案例不取决于另一次产品演示，而更取决于一套尽调材料：收入质量、清算优先权堆栈、上游平台权利，以及从演训和试点走向可重复项目的精确路径。公司看起来具有战略重要性；但它的定价还不够透明。
