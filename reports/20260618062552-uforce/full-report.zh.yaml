  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 先窄定义市场，再谈规模
        blocks:
          - type: paragraph
            body: >-
              UForce 最可辩护的边界，不是抽象的“军用无人机”。它自己的公开材料呈现的是一套 stack：覆盖可消耗的空中、海上和地面平台、反 UAS
              拦截器，以及面向盟国军队的厂商中立指挥控制层。这指向更窄的采购切口：受乌克兰战争作战经验塑造、寻求低成本自主系统、混合机队软件和反无人机工具的国防部与 NATO
              阵营买家。因此，市场定义表纳入平台、自主软件、拦截、集成和测试支出，同时排除广义有人平台预算、通用导弹、民用无人机和通用
              AI。这个区分很重要，因为公开市场报告经常把多种无人机类型、自主等级、终端用户和地区合并；不加调整地使用这些顶层数字，会显著高估 UForce 的真实可服务市场。NATO
              自己的支出定义也强化了这一点：部分相关支出并不在逐项无人机采购中，因为共同资金、信托基金、R&D 和联合采购服务都会支撑 UForce 这类系统竞争的部署环境。
