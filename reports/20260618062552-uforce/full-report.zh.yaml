  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 中点估值对订单转化、利润率组合和本地化成败最敏感，而不是只看品牌叙事。
    data:
      items:
        - label: 订单转化
          value: 0.9
          displayValue: ~$0.9B swing
          tone: high
          detail: 订单簿有多少变成确认收入和现金
        - label: 利润率组合
          value: 0.8
          displayValue: ~$0.8B swing
          tone: high
          detail: 硬件占比高的经济性，应拿低于软件 / 保障组合的倍数
        - label: 美国 / EU 本地化
          value: 0.7
          displayValue: ~$0.7B swing
          tone: high
          detail: 采购资格和主权信任取决于本地制造与合规
        - label: 软件 / C2 附加
          value: 0.6
          displayValue: ~$0.6B swing
          tone: medium
          detail: 有实质意义的自主能力和 C2 变现，会打开上行情景
        - label: 自主政策拖累
          value: 0.4
          displayValue: ~$0.4B swing
          tone: risk
          detail: 人类控制和供应主权约束可能压低采用速度和倍数支撑
    approximationNotes: 条形长度代表估值影响的方向性估计幅度，不是市场观测到的变化。
    claimRefs:
