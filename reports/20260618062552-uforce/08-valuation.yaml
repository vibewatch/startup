- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  - Deal impact
  rows:
  - - Bookings to revenue
    - Contract-level bridge from bookings to recognised revenue and cash receipts
    - Separates headline demand from collectible economics
    - CFO / finance room; sample top programs by geography
    - Highest priority
  - - Gross margin by stack layer
    - Hardware vs software vs integration vs sustainment margin profile
    - Determines whether UForce deserves system-integrator or software-upside framing
    - Finance + ops review with cohort examples
    - Highest priority
  - - Customer concentration
    - Top customers, payment milestones, and renewal / reorder history
    - Reveals dependency and bargaining power
    - Sales / contracts diligence
    - High
  - - Platform rights and exclusivity
    - Export, localisation, and derivative-work rights by flagship system
    - Tests whether UForce owns a moat or brokers someone else’s success
    - Legal + product diligence
    - High
  - - Cap table and preferences
    - Preference stack, pro-rata rights, liquidation terms, and employee dilution
    - Changes true entry economics even if headline valuation holds
    - Legal docs and financing schedules
    - High
  - - Quality / sustainment proof
    - Reliability, mission-abort, support-load, and exercise-to-award conversion data
    - Bridges war proof to Western procurement quality
    - Ops and customer-reference diligence
    - Medium-High
  notes: These are the minimum asks required to move the recommendation from research-more toward buy rather than simply to confirm interest in the story.
