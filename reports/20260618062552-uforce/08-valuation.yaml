- id: scenario-ranges-and-thesis-breaks
  title: Bull, base, and bear ranges are assumption-driven because public economics are not auditable
  body: 'The right way to value UForce today is to use explicit scenario logic instead of false precision. In the bear case, the company still has real technology and demand, but bookings convert poorly, hardware and integration dominate margins, localization slows in the United States, and sovereign customers continue to test rather than scale. That is how a wartime success story can still deserve a material discount to the current round. In the base case, bookings convert into repeat sovereign revenue, software and sustainment attach rates improve over time, and localization plus interoperability work well enough to keep the company in live competitions. That roughly supports today’s valuation but does not scream upside at entry. The bull case requires something more ambitious: UForce becomes a preferred Western packaging layer for battle-proven Ukrainian systems, proves durable control over upstream relationships, and demonstrates that autonomy or C2 can carry higher-value software-like
    economics across multi-domain programs. Investors should monitor thesis-break signals more closely than they monitor narrative momentum, because this is the type of company where procurement friction, rights ambiguity, or policy pressure can compress value long before the market questions the technology itself.'
