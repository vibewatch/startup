- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / observable
  - Transmission to thesis
  - Action implication
  rows:
  - - U.S. localization stalls
    - No credible manufacturing, partnership, or agency traction after repeated U.S. expansion messaging
    - Undercuts the Western-wrapper and scale narrative
    - Move to avoid until evidence improves
  - - Rights remain unclear
    - Management cannot document export, localization, or exclusivity rights over flagship systems
    - Turns portfolio breadth into dependency risk instead of moat
    - Treat current valuation as too speculative
  - - Exercise-to-award conversion fails
    - High-profile trials continue but no repeatable programs emerge
    - Suggests admiration without procurement pull-through
    - Mark down base and bull probabilities
  - - Autonomy-policy backlash intensifies
    - Meaningful-human-control or supplier-sovereignty rules narrow adoption scope
    - Compresses addressable market and multiple support
    - Re-underwrite around hardware-only economics
  - - Financial disclosure stays closed
    - No contract-level bridge, margin view, or preference disclosure even late in process
    - Prevents a disciplined investor from sizing downside
    - Do not lead and avoid price chasing
  notes: Each trigger is meant to be observable in diligence or in the next refresh cycle, not abstractly feared.
