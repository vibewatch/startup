- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Indicative valuation range
  - Probability signal
  - Key watchpoints
  rows:
  - - Bear
    - Bookings do not convert cleanly to revenue; hardware/integration mix stays heavy; U.S. and EU localization slip; policy scrutiny raises friction
    - $0.4B-$0.7B
    - Public economics stay opaque and exercise proof does not become scaled awards
    - Revenue conversion, gross margin, named repeat contracts
  - - Base
    - Bookings convert into sovereign revenue; support/software attach improves somewhat; procurement gates clear slowly but steadily
    - $0.9B-$1.5B
    - Public signals remain positive but incomplete, roughly supporting today’s mark
    - Bookings-to-revenue bridge, localization milestones, customer concentration
  - - Bull
    - UForce becomes a preferred Western wrapper for battle-proven Ukrainian systems; C2/autonomy economics prove meaningful; allied programs scale across domains
    - $1.8B-$3.0B
    - Requires evidence that UForce can own more than a reseller or integrator role
    - Rights/exclusivity, software attach, repeat multi-country awards
  notes: Ranges are explicit analytical scenarios rather than market quotes. They are designed to show how much of the current price depends on assumptions not yet answered by public evidence.
