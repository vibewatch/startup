- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Current signal / scale cue
  - What it suggests
  - Why it matters to UForce
  - Limitation
  rows:
  - - Anduril
    - Officially announced a $5B Series H raise in 2026
    - Top-tier private defense-tech capital will support very large rounds when category conviction is high
    - Shows why investors might tolerate aggressive pricing for category leaders
    - Anduril has far deeper capital, manufacturing ambition, and institutional maturity
  - - Shield AI
    - Home-page banner references a $2B raise at $12.7B valuation; Hivemind is sold as platform-agnostic autonomy
    - Autonomy software can command very large strategic premiums when the stack is reusable
    - Useful benchmark for the software and AI layer UForce wants to claim around C2 and autonomy
    - Shield AI’s software position and capital depth are more explicit than UForce’s
  - - AeroVironment
    - 50,000+ deployments in 55+ countries plus public annual-report history
    - Public markets reward scale and disclosure, not just narrative
    - Highlights how little financial transparency UForce currently provides by comparison
    - AeroVironment is a mature public incumbent, not a seed-stage integrator
  - - Palantir
    - Official Q1 2025 release cited 39% y/y revenue growth and defense-specific platform surfaces remain software-led
    - The software layer can be valued on a different basis from hardware programs
    - Reminds investors not to over-credit UForce with Palantir-like software economics without proof
    - Palantir is a very different, far more disclosed software-first company
  - - Skydio
    - National-security sUAS program markets tactical ISR, base security, border security, and X10D survivability
    - Mission-specific sUAS positioning is becoming a standard defense GTM pattern
    - Shows that even strong drone vendors anchor on use case, survivability, and workflows, not just airframes
    - Skydio is narrower in scope and less multi-domain than UForce’s pitch
  - - EU / NATO drone market context
    - BCG, EC, EPRS, and NATO all point to bigger, more standardised drone and counter-drone demand
    - The market backdrop is strong enough to support multiple winners and premium narratives
    - Supports why UForce can be strategically important before it is fully disclosed financially
    - Policy demand does not guarantee one company captures outsized economics
  notes: This comparable set mixes private rounds, public-market disclosure standards, software-layer references, and policy context. It is intentionally model-appropriate rather than a false one-multiple screen.
  enumerationScope:
    coverage: partial
    basis: Rows cover the most decision-useful public valuation and model-reference comparables visible in the reviewed source pack plus net-new official pages; they are not an exhaustive list of every defense-tech peer or financing event.
