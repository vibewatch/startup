  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Public-evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research-more
    - Strategic positives are strong, but pricing depends on private diligence gaps
    - Stay engaged only if management will open the data room early
  - - Confidence
    - Medium
    - Round facts are corroborated, but economics remain largely undisclosed
    - Do not underwrite a tight valuation band
  - - Risk rating
    - High
    - Execution, rights, and autonomy-policy risks can all compress value
    - Assume high diligence burden and downside asymmetry
  - - Valuation stance
    - Stretched
    - Public evidence supports significance, not cheapness
    - Require revenue-quality proof before calling the round attractive
  - - Return discipline
    - Need explicit downside protection
    - Scenario work shows upside exists, but not enough disclosed to rely on it
    - Seek milestone discipline, structure, or a later entry point
  - - Most important next step
    - Bookings-to-cash bridge
    - That single package would clarify revenue quality, margin, and burn
    - Do not lead without it
