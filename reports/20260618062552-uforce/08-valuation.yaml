- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Battlefield proof
    - UForce aggregates systems already tested in Ukraine across sea, air, land, and C2
    - Battlefield proof does not automatically equal Western qualification, sustainment, or margin quality
    - Named contracts, repeat orders, and acceptance metrics from allied buyers
  - - Investor quality
    - Lakestar, Shield Capital, and allied security investors improve credibility and access
    - Good investors do not erase disclosure gaps or operational complexity
    - Actual investor follow-on support and program wins tied to their networks
  - - Western wrapper
    - UK and U.S. packaging can make Ukrainian technology more procurable for allies
    - Packaging is not the same as owning durable rights over upstream systems
    - Disclosed exclusivity, export rights, and localization rights by platform family
  - - Market tailwind
    - EU, NATO, and U.S. policy all point toward more drone and counter-drone demand
    - Tailwinds may reward better-capitalized or more transparent peers instead
    - Evidence that UForce converts pilots and exercises into scaled awards
  - - Economics
    - Nine-figure bookings hint at real demand and possible scale
    - No public revenue, margin, or burn data means the quality of those bookings is unknown
    - Revenue recognition, gross-margin, and working-capital disclosure by program type
  notes: The anti-thesis is not a rejection of the company; it is the list of reasons a valuation-disciplined investor cannot treat the current price as obviously cheap.
