  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: A bookings-to-revenue-to-cash bridge for top programs plus gross margin by hardware, software, integration, and sustainment.
    whyItMatters: Without it, the current valuation cannot be tested against revenue quality or true cash generation.
    diligencePath: Request top-10 contract cohort data and finance-room schedules before advancing the round.
    relatedQuestionRefs:
    - QV028
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
    - TV004
  - type: private-evidence-only
    severity: material
    topic: rights-and-exclusivity
    missingEvidence: Platform-by-platform export rights, localization rights, exclusivity terms, and derivative-work ownership.
    whyItMatters: Portfolio breadth is central to the bull case, but it can be a dependency risk if rights are weak or revocable.
    diligencePath: Review product, supplier, and licensing agreements with legal counsel.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV002
    - TV005
  - type: missing-source
    severity: material
    topic: customer-quality
    missingEvidence: Named customer roster, program stage, payment milestones, and repeat-order history.
    whyItMatters: This is required to distinguish admired technology from repeatable procurement pull-through.
    diligencePath: Obtain customer references and a pipeline conversion funnel by region.
    relatedQuestionRefs:
    - QV028
    - QV030
    relatedTableRefs:
    - TV003
    - TV006
  - type: access-blocked
    severity: minor
    topic: procurement-transparency
    missingEvidence: Direct readable access to all underlying procurement-detail pages linked from public tender notices.
    whyItMatters: Blocked portals make independent verification harder, especially when buyers are sovereign entities.
    diligencePath: Collect official notice documents and buyer-side correspondence in diligence rather than relying only on portals.
    relatedQuestionRefs:
    - QV020
    relatedTableRefs:
    - TV005
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Liquidation preferences, pro-rata rights, option-pool size, and any unusual governance provisions.
    whyItMatters: Headline valuation alone can overstate the attractiveness of the actual entry economics.
    diligencePath: Review financing documents and cap-table models with counsel and the company finance team.
    relatedQuestionRefs:
    - QV028
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
