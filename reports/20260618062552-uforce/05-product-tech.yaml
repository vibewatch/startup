- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / line
  - Representative assets
  - Primary user job
  - Public maturity
  - Differentiation
  - Main diligence gap
  rows:
  - - Sea strike and denial
    - Magura, MV7, Mykola-3
    - Area denial, anti-surface strike, recon, resupply, sea-to-land launch
    - Battle-proven and NATO-exercised
    - Strongest combat record; EW resilience; multi-mission modularity
    - Public OEM and IP split remains unclear
  - - Air bombers and strike UAVs
    - Nemesis, R18, R34, R36
    - Bomber missions, precision strike, heavy-equipment attack
    - Nemesis and R18 combat-proven; R34/R36 next generation
    - Award-backed battlefield effect and rapid iteration
    - Little public reliability or sortie economics data
  - - Loitering / long-range one-way attack
    - Bucha and simplified Bucha variant
    - Low-cost group-launched strike and relay-enabled deep attack
    - Main model in flight test; simplified version pre-series
    - Mesh-network relay and short-rail launch concept
    - Full combat-trial status not yet public
  - - Ground robotics
    - D21, LIUT / Fury, D12, D14, D18, Predator
    - Recon, fire support, route security, remote weapons
    - Mixed maturity; D21 has public specifications
    - Attritable unmanned teaming and modular battle modules
    - Upstream ownership and deployed fleet size are opaque
  - - Counter-UAS and intercept
    - Manual, semi-autonomous, and fully autonomous interceptors; Sunray; Fortress integration
    - Layered counter-drone defense against Shahed-style threats
    - Operational concept is public; hardware detail is sparse
    - Integrated kill chain and U-C2 handoff logic
    - Autonomy governance and exportability need diligence
  - - Command and control software
    - U-C2, SICH, Ground Control
    - Mission planning, swarm control, multi-domain coordination
    - Battle-validated by company account
    - Vendor-agnostic integration across domains
    - No public API docs, uptime data, or formal interface standards
  notes: Maturity labels mix independent validation with company claims; they are not a substitute for program-level acceptance or reliability data.
