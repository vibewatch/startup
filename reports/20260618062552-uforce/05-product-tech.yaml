  evidenceGaps:
  - type: missing-source
    severity: material
    topic: upstream-dependency
    missingEvidence: Platform-by-platform disclosure of ownership, licensing, exclusivity, and manufacturing rights for Magura, FRDM-derived air systems, and UGV Robotics-derived land systems.
    whyItMatters: Without rights clarity, buyers cannot tell whether UForce is an OEM, a distributor, or an integration-and-packaging layer for each major line.
    diligencePath: Request cap-table-style product-rights schedules, license terms, manufacturing rights, and any exclusive territorial agreements by platform family.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: Mission-abort rates, MTBF, maintenance burden, training hours, and program acceptance criteria by product line.
    whyItMatters: Battlefield anecdotes do not substitute for sustainment and reliability data required by institutional procurement teams.
    diligencePath: Ask for test reports, after-action reliability statistics, maintenance logs, and formal customer acceptance metrics for sea, air, land, and intercept systems.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: developer-surface
    missingEvidence: Public or NDA-gated API documentation, interface-control documents, adapter specifications, and integration test procedures for U-C2.
    whyItMatters: Vendor-agnostic integration is central to the thesis, but buyers cannot independently verify integration depth or integration speed from public materials.
    diligencePath: Request interface-control documents, sandbox access, adapter libraries, and a live demonstration of third-party payload integration.
    relatedQuestionRefs:
    - QE020
    - QE024
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: us-localization
    missingEvidence: Site-level U.S. manufacturing plan, supplier transition map, domestic-content target, and timing for first U.S.-built USVs beyond the summer-2026 statement.
    whyItMatters: U.S. scale-up is a core part of the westernization story and directly affects compliance, margins, and delivery confidence.
    diligencePath: Ask for manufacturing site commitments, supplier localization roadmap, QA regime, and export-license handoff plan for U.S. production.
    relatedQuestionRefs:
    - QE015
    - QE023
    relatedTableRefs:
    - TE005
