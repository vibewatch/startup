- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / issue
  - Public status
  - Scope
  - Implication
  - Gap
  rows:
  - - UK export licensing for military goods and UAV-related trade activity
    - Explicitly required
    - Goods, software, technology, and some brokering / transfer activity by UK persons
    - Cross-border scale depends on licensing and transfer compliance
    - No product-specific licensing path is publicly disclosed
  - - UK drone-strategy demand for digital standards and rapid procurement
    - Policy tailwind
    - Allied military adoption and integration environments
    - Favors companies that can field interoperable systems quickly
    - UForce does not publish its own conformance standard set
  - - U.S. foreign-drone scrutiny and domestic-industrial push
    - Rising policy pressure
    - Supply chain, sourcing, and component provenance for U.S. market entry
    - Supports U.S. manufacturing rationale but increases localization burden
    - No detailed U.S. BOM localization plan is public
  - - Autonomy and human-control governance
    - Material external concern
    - Fully autonomous intercept and any human-out-of-loop lethal decisions
    - Ethics and accountability diligence may become a sales blocker
    - No public ruleset describing operator override or fail-safe policy
  - - Exercise-based validation under jamming
    - Positive signal but limited depth
    - REPMUS / Dynamic Messenger and company-claimed red-team evaluations
    - Supports maturity narrative beyond pure marketing
    - Still not a substitute for published reliability or sustainment statistics
  - - Developer / practitioner transparency
    - Weak public surface
    - Open documentation, integration kits, repositories, and community artifacts
    - Makes technical diligence harder for outside evaluators
    - Evidence is limited to procurement / experimentation surfaces rather than public docs
  notes: The table separates policy tailwinds from diligence blockers; a positive status does not remove the need for product-specific compliance review.
