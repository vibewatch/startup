- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Public role
  - Key dependency
  - Operational risk
  rows:
  - - Sensor and early-warning inputs
    - Radar, AWACS, acoustic, satellite, and visual feeds initiate the kill chain
    - External sensors and partner cueing systems
    - Coverage and handoff quality depend on non-UForce systems
  - - U-C2 orchestration layer
    - Allocates missions and coordinates mixed fleets from a single interface
    - Software integration adapters and operator workflows
    - Public openness claims are stronger than documented interface standards
  - - Platform autonomy layer
    - Runs USVs, UAVs, UGVs, and interceptors under one autonomy framework
    - Upstream vehicle firmware and payload compatibility
    - Performance may vary by inherited platform
  - - Communications and mesh layer
    - Supports swarm coordination and drone-to-drone relay, including Bucha group launches
    - Resilient comms links and EW mitigation
    - No public packet-loss, latency, or degradation metrics
  - - Effectors and payload modules
    - Strike, ISR, battle modules, and intercept payloads deliver mission effects
    - Weapon integration, safety controls, and operator doctrine
    - Export classification and lethal-autonomy scrutiny rise with payload sophistication
  - - Distributed manufacturing and sourcing layer
    - Supports localization, repair, assembly, and scale across allied countries
    - Upstream Ukrainian manufacturers and future U.S. sites
    - Rights transfer, BOM localization, and quality consistency remain unclear
  notes: This architecture table describes the public operating model, not a reverse-engineered system design or source-code-level software map.
