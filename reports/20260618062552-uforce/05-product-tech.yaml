- id: trust-compliance-and-scaling-risks
  title: Trust, compliance, and scaling constraints
  body: 'The main product risk is not that the company lacks exciting systems; it is that too many crucial details are still opaque for institutional buyers. Public disclosures do not cleanly separate which platforms are wholly controlled by UForce from which remain dependent on legacy manufacturers such as STE, FRDM, or UGV Robotics, so exclusivity and IP ownership remain uncertain. Reliability and support disclosures are also thin: there is little public information on failure rates, maintenance burden, mission-abort rates, training loads, or acceptance criteria beyond company claims and one disclosed Bucha price band. Compliance adds another layer of friction. UK export controls cover military goods, software, technology, and category-B UAV-related activity, while U.S. policy is moving toward domestic production and tighter scrutiny of foreign drone supply chains. Finally, the autonomy story cuts both ways: the same human-out-of-loop intercept logic that supports low-cost air defense
    also attracts ethical and accountability concerns from human-rights and academic critics. These do not invalidate the product thesis, but they do mean a buyer should diligence governance, transfer rights, and industrial localization with the same intensity as raw battlefield performance.'
