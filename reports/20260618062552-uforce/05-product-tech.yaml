- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow / threat
  - UForce solution
  - Claimed benefit
  - Limitation
  rows:
  - - Defend a coastline with limited capital
    - Conventional naval presence is expensive and slow to scale
    - Magura-led USV layer with sea-launched effects and U-C2 coordination
    - Area denial at far lower cost than traditional surface fleets
    - Public economics are mostly company framing rather than audited savings
  - - Run nightly multi-domain strike and ISR missions
    - Mixed fleets create control fragmentation in EW-contested battlespace
    - U-C2 unifies drones, USVs, UGVs, and payloads in one control plane
    - Faster mission allocation and swarm coordination across vendors
    - No public integration documentation for third-party technical review
  - - Counter Shahed-style inbound threats
    - Missile-defense intercepts are costly and inventory constrained
    - Layered intercept chain from warning to autonomous terminal kill
    - Lower-cost, scalable air defense concept
    - Policy, accountability, and rules-of-engagement questions remain open
  - - Equip a ground unit for route security and remote fire support
    - Humans must expose themselves to direct fire and reconnaissance risk
    - D21 plus remote battle modules and LIUT / Fury family
    - Attritable unmanned teaming for recon and support fires
    - Public sustainment and field-repair data are absent
  - - Shift wartime production into allied procurement channels
    - Frontline innovation is hard to translate into NATO / U.S. buying processes
    - UK legal wrapper, U.S. manufacturing plan, and exercise-led interoperability story
    - Quicker entry into allied procurement debates and pilots
    - Scaling requires compliance, localization, and upstream-rights clarity
  notes: Benefits are described in customer-workflow terms and rely heavily on company claims plus policy and exercise context, not on published contract outcomes.
