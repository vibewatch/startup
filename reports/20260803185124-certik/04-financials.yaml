- id: what-remains-unmodeled
  title: What Remains Unmodeled
  body: 'The largest diligence challenge is not the absence of growth signals; it is the absence of denominator data. Public sources do not disclose backlog, renewal, churn, gross margin, customer concentration, average audit duration, or attach rates from audit into monitoring and compliance. Even basic revenue estimates from company-profile sites are either inaccessible, methodology-light, or unsupported by audited filings. That means a realistic model still has to be built top-down from price bands, staffing assumptions, and product adoption hypotheses. The practical takeaway is straightforward: CertiK likely has a better business than a pure audit boutique because it sells more surfaces and can expand into recurring tools, but no outside observer should mistake that qualitative advantage for precision. Until management shares segment mix, margin profile, and cohort behavior, the financial chapter should be treated as a bounded inference exercise rather than a complete forecast.'
  claimRefs:
  - CI022
  - CI029
  - CI030
  - CI031
  - CI032
  - CI035
