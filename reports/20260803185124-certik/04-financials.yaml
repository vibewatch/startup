- id: growth-durability-and-public-market-story
  title: Growth Durability and Public-Market Story
  body: 'The bullish interpretation of CertiK''s financial story is that it used venture funding to expand from labor-heavy audits into a broader security platform with better expansion economics. Company-claimed metrics—20x revenue growth, 12x annual revenue growth, 4x year-over-year early-2022 revenue growth, and 2,300% Skynet booked-revenue growth—are obviously promotional, but directionally they fit the observed product expansion and financing cadence. If even partly accurate, they imply CertiK benefited from strong operating leverage during crypto''s infrastructure build-out. The 2026 IPO narrative builds on that platform framing: management and press coverage present the business as a candidate for the first public web3 cybersecurity listing, not as a single-cycle advisory firm. Still, that story faces real friction. Public controversies, missing audited statements, and the lack of segment disclosure leave investors unable to separate recurring software revenue from project services,
    or durable margins from bull-market uplift. Circle''s recent S-1/A also shows the disclosure standard that public investors now expect. The result is an appealing equity narrative that is still thinly evidenced at public-market quality.'
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI021
  - CI024
