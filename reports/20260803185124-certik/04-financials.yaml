  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: Revenue split across audits, monitoring, data products, compliance, and pentesting.
    whyItMatters: Without segment mix, CertiK cannot be valued confidently as software, services, or a hybrid.
    diligencePath: Request management revenue bridge and segment-level growth for the last eight quarters.
  - type: private-evidence-only
    severity: material
    topic: margin-profile
    missingEvidence: Gross margin, contribution margin, and utilization by service line.
    whyItMatters: Public pricing tells only the top-line story; value depends on delivery efficiency and recurring margin quality.
    diligencePath: Collect P&L cuts by product line and staffing model.
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Net revenue retention, logo retention, and renewal rates for Skynet or other subscription products.
    whyItMatters: Recurring-revenue claims matter far more if customers actually renew and expand.
    diligencePath: Request cohort tables for annual renewals, cross-sell, and churn drivers.
  - type: conflicting-data
    severity: minor
    topic: current-valuation
    missingEvidence: A newly priced round or formal filing that updates the 2022 valuation anchor.
    whyItMatters: Secondary press references to current value may lag reality in either direction.
    diligencePath: Confirm last internal 409A or most recent primary/secondary pricing in diligence.
