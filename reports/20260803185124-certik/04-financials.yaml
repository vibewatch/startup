chapter:
  number: 4
  title: Financials
  summary: CertiK looks like a venture-backed web3 security platform with meaningful product breadth and plausible recurring-revenue upside, but public data is still far too sparse to build a precise model or underwrite software-like unit economics with confidence.
sections:
- id: capital-history-and-disclosed-scale
  title: Capital History and Disclosed Scale
  body: 'CertiK''s public financial record is strongest on financing milestones and weakest on audited operating statements. The company itself disclosed that its late-2021 B2 round pushed total investment above $140 million, then said only a few months later that its B3 financing valued the company at $2 billion and lifted nine-month capital raised to $230 million. Independent press added useful confirmation and color: TechCrunch described the 2022 raise as an $88 million round that included Goldman Sachs, while 2026 reporting from Yahoo Finance and The Block framed CertiK as a repeat capital raiser with roughly $296 million raised since inception and a fresh multi-eight-figure Binance-backed follow-on. Taken together, the evidence supports a picture of a company that successfully financed rapid growth through the 2021-2022 cycle and still retained strategic investor support in 2026. What it does not provide is a clean current cap table, current cash balance, or updated priced-round valuation
    beyond the 2022 anchor.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI033
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: revenue-model-and-pricing-mechanics
  title: Revenue Model and Pricing Mechanics
  body: 'Public materials strongly suggest CertiK is no longer just an audit shop. The company''s own posts tie revenue growth to both its core audit business and product lines like Skynet, while current product surfaces show monetization across smart-contract audits, monitoring, compliance-led data tools, and pentesting. That matters because each line carries different revenue behavior. Audit work is still quote-based and likely lumpy, with pricing that depends on scope, urgency, chain, and specialist depth. Market benchmarks from Sherlock show the envelope: small contracts can clear at the low thousands, standard DeFi work often sits in the tens of thousands, and complex multi-chain or ZK-heavy scopes can exceed a quarter million dollars before follow-on remediation passes. Recurring monitoring and data products should be more repeatable and less dependent on one-time launch cycles. Compliance content and formal-verification framing also point toward higher-value institutional budgets
    where customers care about assurance continuity, not only a single PDF report.'
  claimRefs:
