- id: dependency-and-platform-risk
  title: Dependency and Platform Risk
  body: 'As CertiK expands from audits into APIs, scores, AI tools, and partner distribution, it picks up a different class of risk: dependency risk. Some of it is technical. CoinGecko data enriches Skynet. SkyInsights depends on credential security, uptime, and accurate entity attribution. Public skills and agent integrations increase reach, but also create more surfaces that can break, mislead users, or be abused. Some of it is commercial. OKX AI, Hub71, and YZi-style programs can accelerate adoption, yet they also make part of the growth story dependent on external ecosystems and subsidized channels that CertiK does not control. This is not necessarily a flaw—platform companies often need such channels—but it changes the risk map materially. A partner''s regulatory trouble, adoption shortfall, or reputation problem can now transmit into CertiK''s pipeline and brand. The deeper CertiK embeds into customer workflows and partner stacks, the stronger the moat can become, but also the more
    tightly downside becomes coupled to counterparties, data providers, and endpoint reliability.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
