- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Disclosure-process failure
    - Major public dispute over responsible disclosure or fund handling
    - Any repeat of a Kraken-scale controversy
    - Downgrade trust premium and revisit legal/process diligence immediately
  - - Regulatory compression
    - Key jurisdiction narrows acceptable assets or raises VASP requirements materially
    - Product restrictions hit core customer use cases or major pipeline segments
    - Reduce growth assumptions and reassess market breadth
  - - Channel quality failure
    - Hub71 / YZi / partner channels do not convert into durable paid accounts
    - Evidence of poor grant-to-paid or subsidy-to-renewal conversion
    - Lower expansion expectations and channel value in valuation
  - - Platform reliability / data-quality failure
    - Material API outage, score integrity issue, or market-data corruption
    - Repeated incidents or lack of remediation transparency
    - Treat platform moat claims as weaker and raise support-cost assumptions
  - - Reputation repair failure
    - Public-market or enterprise customers continue citing prior controversies as blockers
    - Loss analysis shows trust incidents driving major account slippage
    - Move recommendation toward track / research-more
  notes: Kill criteria focus on events that transmit directly into trust, distribution, or financeability rather than on generic industry volatility.
