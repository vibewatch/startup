  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: TR001-regulatory-scope
    missingEvidence: Customer-by-customer mapping of CertiK products to regulated activities, contractual carve-outs, and jurisdiction-specific approvals or restrictions.
    whyItMatters: Public regulator and legal materials show the framework direction, but not how CertiK operationalizes it across its full customer base.
    diligencePath: Request product compliance matrix by jurisdiction and customer segment.
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: Internal postmortems, legal claims history, and bug-bounty dispute metrics after Kraken and Huione.
    whyItMatters: The public narrative proves controversy, but not whether the underlying process risk is now genuinely controlled.
    diligencePath: Request incident register, remediation owner list, and evidence of process testing after August 2024.
  - type: private-evidence-only
    severity: material
    topic: channel-conversion
    missingEvidence: Conversion, renewal, and revenue-quality data for Hub71, YZi, OKX AI, and other partner-led channels.
    whyItMatters: Partner channels can look strategically important while contributing weak or low-durability revenue.
    diligencePath: Request channel-sourced bookings, conversion-to-paid, and 12-month retention by program.
  - type: missing-source
    severity: minor
    topic: platform-reliability
    missingEvidence: Public uptime history, SLA commitments, and API incident data for SkyInsights, public endpoints, and other platformized products.
    whyItMatters: The risk surface now depends heavily on product reliability rather than only on human-delivered audits.
    diligencePath: Collect SLOs, uptime reports, and platform postmortems.
