      - number: '1.3'
        title: 融资形成、投资人基础与阶段
        blocks:
          - type: paragraph
            body: >-
              CertiK 的融资路径显示，2021 年中至 2022 年初资本形成速度异常快，公司在数月内从约独角兽状态跃升至 20 亿美元估值。官方融资稿和 TechCrunch 报道都指向关键的 B3 轮；Tracxn
              则补充了 2022 年 4 月后续 Series B 融资，并把累计融资额提高到约 2.96 亿美元。投资人组合几乎和金额同样重要：Goldman Sachs、SoftBank、Advent 等传统金融名字，与
              Sequoia、Tiger Global、Coinbase Ventures 和 Binance 关联资本并列。2026 年 1 月，管理层又给阶段叙事加了两块拼图：明确称 Binance
              在追加八位数美元支票后已成为最大投资人，并提出战略性而非临近落地的 IPO 目标。这支撑后期私营 / IPO
              前公司的分类；但没有已审计财务报表、当前现金披露或已知二级交易条款，公开证据仍无法充分承销资本充足性或投资人抛压风险。
