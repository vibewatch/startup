      - number: '8.4'
        title: 退出准备度与最终尽调判断
        blocks:
          - type: paragraph
            body: >-
              最终估值判断是：CertiK
              更接近「值得继续做功课」，而不是「已经可以给高置信定价」。公司有足够的市场位置和产品宽度，理论上可以走向公开市场或吸引战略资本，但公开证据仍落后于野心。缺口并不花哨：经审计收入、经常性收入组合、利润率结构、客户集中度和股权结构权利。这些缺失会直接影响价格支撑和投资人回报，也关系到
              IPO 准备度，因为公开市场投资人奖励的不只是品类领导力，还有披露质量和治理信心。未来一轮如果低于 $2 billion
              参照点，或出现新的信任争议，都会迅速挑战溢价叙事。反过来，强经常性经济性和更清晰的权利可见度，也可能支撑更高出价。在此之前，正确姿态是有条件的兴趣：如果尽调包能补上核心缺口，或价格足以补偿这些缺口，就推进；如果管理层坚持让投资人不看更新证据就接受
              2022 年标题估值，就暂停。
