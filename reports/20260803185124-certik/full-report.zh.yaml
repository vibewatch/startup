  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              CertiK 把自己定位为总部位于纽约的 Web3 安全平台，而不是单一服务的审计公司。官方关于页面把公司根基放在 Columbia 和 Yale 的研究上，并称业务由两校教授于 2017
              年创立；主页则把叙事扩展成一整套工具，覆盖智能合约审计、形式化验证、渗透测试、监控、AML、KYC 和事件响应。平台化定位很关键，因为它把 CertiK
              从按项目交付的服务商，推向协议、交易所、钱包以及越来越多机构用户的经常性风险基础设施。World Economic Forum 和 CB Insights
              的独立资料大体支持身份和总部叙事，但对确切创立年份并不一致，对公司经营范围的描述也略有差异。最终的商业模式图景是清楚的：CertiK 在 Web3
              开发生命周期中变现信任和技术保障，但投资人若要做基准分析，仍需先校准外部资料中的不一致数据。
