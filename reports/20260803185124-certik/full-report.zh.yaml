  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: CertiK 最强的公开客户路径，是从上线安全切入，延伸到监控、信任背书，最终走向合规或平台级扩张。
    data:
      items:
        - label: 安全触发点
          description: 协议、钱包或交易所判断，上线、挂牌或托管信任需要独立安全审查。
        - label: 初始接触
          description: CertiK 通过审计、渗透测试、储备证明项目或生态补贴计划切入。
        - label: 公开信任界面
          description: 客户发布报告，或把用户和合作伙伴引向 Skynet 档案，形成外部证明。
        - label: 运营扩张
          description: 需求成熟后，账户可以叠加 Skynet、储备证明、合规工具或重复评估。
        - label: 机构 / 生态嵌入
          description: 最强的终态，是进入客户或渠道伙伴的持续风险、挂牌或合规工作流。
    approximationNotes: 旅程基于具名客户案例和产品界面综合而成，并非来自披露了转化率的转化漏斗。
    claimRefs:
      - CU001
      - CU010
      - CU012
      - CU014
      - CU019
      - CU022
      - CU031
  - id: FU002
    title: 采用与部署流程
    type: flow
    layout: wide
    summary: 具名客户证明显示，多个切入路径可以汇入持久信任或工作流集成。
    data:
      nodes:
        - id: launch
          label: 上线阶段审计
          detail: 项目从代码审计或形式化验证项目起步。
        - id: wallet
          label: 钱包 / 应用安全审查
          detail: 钱包使用 CertiK 做移动端或应用层审查，并获取公开信任信号。
        - id: exchange
          label: 交易所 / 储备验证
          detail: 交易所使用 CertiK 做安全框架或储备证明鉴证。
        - id: channel
          label: 渠道 / 生态入驻
          detail: 创业生态和孵化器把 CertiK 作为首选安全供应商引入。
        - id: publish
          label: 发布信任证据
          detail: 客户公开审计报告、Skynet 页面或公开验证结果。
        - id: expand
          label: 扩展到工作流
          detail: 后续接入监控、合规工具、重复评估或嵌入式数据集成。
      edges:
        - from: launch
          to: publish
          label: 报告与挂牌信任
        - from: wallet
          to: publish
          label: 公开安全证明
        - from: exchange
          to: publish
          label: 储备 / 平台信任
        - from: channel
          to: publish
          label: 补贴或引导式采用
        - from: publish
          to: expand
          label: 将证明转为重复工作流
    approximationNotes: 流程按证据排序，不是量化漏斗。公开材料展示了步骤，但没有披露转化率。
    claimRefs:
