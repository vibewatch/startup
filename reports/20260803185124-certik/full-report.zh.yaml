  summary: >-
    CertiK 是一家总部位于纽约的 Web3 安全平台，由与 Yale 和 Columbia 有关联的学者创立，业务已从智能合约审计扩展到形式化验证、监控、储备证明、AML / 合规和 AI
    安全工作流。公开证据支持这样一家公司画像：后期私营公司，机构叙事真实，历史估值锚为 20 亿美元，累计融资约 2.96 亿美元，并声称拥有数千家企业客户；但当前经营经济性和治理深度仍留下重大问题。
