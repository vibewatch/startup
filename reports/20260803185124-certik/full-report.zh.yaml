        blocks:
          - type: paragraph
            body: >-
              CertiK 的公开财务记录，最强在融资里程碑，最弱在已审计经营报表。公司自己披露，2021 年末 B2 轮把总投资推高到 1.4 亿美元以上；几个月后又称 B3 融资将公司估值推到 20
              亿美元，并把九个月融资额提高到 2.3 亿美元。独立媒体补充了有用确认和背景：TechCrunch 将 2022 年融资描述为一轮 8,800 万美元融资，参与方包括 Goldman Sachs；Yahoo
              Finance 和 The Block 的 2026 年报道则把 CertiK 描述为一家反复融资的公司，自成立以来融资约 2.96 亿美元，并获得 Binance
              支持的新一轮数千万美元后续投资。合在一起，这些证据支持一个画像：公司在 2021-2022 周期成功为快速增长融资，并在 2026 年仍保有战略投资人支持。它没有提供的，是干净的当前股权表、当前现金余额，或
