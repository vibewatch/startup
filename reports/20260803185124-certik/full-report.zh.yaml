  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与价格支撑
        blocks:
          - type: paragraph
            body: >-
              CertiK 的估值，标题叙事容易讲清，真正进入投资定价却难得多。标题故事很干净：上一轮公开定价是 March 2022 的 Series B3，估值 $2 billion；后续 IPO
              报道仍重复这个标记，二级数据库也显示公司融资底子厚、客户和产品覆盖面广。问题在于，标题下面的证据仍偏薄。本语料里唯一公开的经常性收入数字，是二级来源估算的
              ARR，不是经审计的管理层披露。这很关键：即便标题价格看似合理，投资人如果无法核对收入质量、服务与订阅组合、毛利率或留存，估值也会很脆。公开资料确实显示，CertiK 已从一次性审计扩到监控、合规和较新的 AI
              安全产品，上行故事还没断。但创投基金或 YZi 资助计划这类公开动作，更像生态信号，不足以证明核心经营业务自 2022 年以来已经重新上调定价。所以起点应该是：承认 $2 billion
              是真实历史，同时拒绝把它自动当成 2026 年的公允价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
