        - 规模大得多、业务更多元，且完全公开上市。
      - - Palo Alto Networks
        - 2026 年市值 / 2025 年收入
        - 约 30.7x 收入
        - 安全大平台参照，体现业务宽度和战略价值。
        - 成熟上市公司，财务经审计，且拥有 CertiK 未披露的规模。
      - - CyberArk
        - 2026 年市值 / 2024 年收入
        - 约 20.6x 收入
        - 高质量专业安全业务的有用基准。
        - 身份 / 安全组合不同，披露质量也好得多。
      - - Zscaler / SentinelOne
        - 2026 年市值 / 2025 年收入
        - 约 8.3x-9.3x 收入
        - 说明即便是有分量的安全软件公司，当增长或情绪没那么亢奋时，交易区间也会低很多。
        - 上市云安全模式仍不同于私营加密安全组合。
      - - CertiK 上一轮估值标记
        - 2022 年 $2B 估值 / 约 $87M ARR 代理值
        - 约 23.0x 隐含收入倍数
        - 帮助判断这个私营估值标记落在公开网络安全参照区间内还是之外。
        - ARR 来自二手资料且未经审计；股权结构权利未知。
    notes: 本表抓住本章使用的主要公开参照点；用途是搭框架，不是在声称这些公司在所有运营层面都可直接比较。
