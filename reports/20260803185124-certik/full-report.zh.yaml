        - id: hub71
          label: Hub71 / YZi 渠道
          detail: 创业生态和基于补助的获客路径。
          type: channel
        - id: github
          label: GitHub + 公开端点
          detail: 开发者和智能体分发触点。
          type: developer-signal
      edges:
        - from: vara
          to: certik
          label: 客户与产品约束
        - from: adgm
          to: certik
          label: 合规预期
        - from: coingecko
          to: certik
          label: 市场数据依赖
        - from: okx
          to: certik
          label: AI 渠道依赖
        - from: hub71
          to: certik
          label: 补贴型管线
        - from: github
          to: certik
          label: 公开分发 / 支持负担
    approximationNotes: 该图突出外部可见、最可能影响信任、增长或合规的关键依赖。
    claimRefs:
      - CR019
      - CR020
      - CR025
      - CR026
      - CR027
      - CR034
      - CR039
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论从真实市场证据出发，经披露缺口，最后落到价格纪律。
    data:
      nodes:
        - id: proof
          label: 真实品类证据
          detail: 融资历史、客户证据和产品宽度表明 CertiK 是一家已具规模的真实安全供应商。
        - id: proxy
          label: 部分收入代理指标
          detail: 二级市场 ARR 数据提供区间锚点，但没有审计级精度。
        - id: publicband
          label: 公开网络安全估值带
          detail: 公开可比公司显示，高质量安全公司能拿到高溢价倍数，但前提是透明度够。
        - id: discount
          label: 不透明折价
          detail: 利润率、留存和股权结构数据缺失，足以支持对私营公司的折扣。
        - id: risk
          label: 信任与执行风险
          detail: 声誉和披露挫折会同时压缩融资和退出选择。
        - id: call
          label: 继续研究 / 入场纪律
          detail: 只有证据改善，或定价给不确定性留出空间，才继续推进。
      edges:
        - from: proof
          to: proxy
          label: 规模形成区间锚点
        - from: proxy
          to: publicband
          label: 比较隐含倍数
        - from: publicband
          to: discount
          label: 按不透明度调整
        - from: discount
          to: call
          label: 价格纪律
        - from: risk
          to: call
          label: 保留下行护栏
    approximationNotes: 这条流程是基于章节证据合成的承销顺序，不是管理层流程图。
    claimRefs:
      - CV001
      - CV007
      - CV019
      - CV021
      - CV024
      - CV026
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 收入或倍数的小幅变化，都会显著改变公开证据能够支撑的企业价值。
    data:
      items:
        - label: $80M，10x
          value: 0.8
          detail: 谨慎基准到熊市设定下，以 US$ 十亿计的隐含企业价值。
          tone: negative
        - label: $80M，15x
          value: 1.2
          detail: 除非投资人给出强软件溢价，否则仍低于上一轮披露估值。
          tone: warning
        - label: $100M，15x
          value: 1.5
          detail: 如果经常性证据小幅改善，这是方向性的中点。
          tone: neutral
        - label: $100M，20x
          value: 2
          detail: 如果收入代理指标上调取整，且高溢价可比公司站得住，大致能支撑上一轮估值。
          tone: positive
        - label: $150M，20x
          value: 3
          detail: 牛市情形要求经常性规模显著强于当前公开记录能够证明的水平。
          tone: positive
    approximationNotes: 柱状图只是以十亿美元计、用收入 × 倍数推算的示意，不是 DCF，也不是管理层正式展望。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于公开证据，诚实答案是一组熊市、基准、牛市情形区间，而不是单一数字。
    data:
      items:
        - label: 熊市情形
          low: 0.4
          mid: 0.7
          high: 0.9
          detail: 收入实际更低或信任受损，会在更小基数上把倍数压到高个位数。
          tone: negative
        - label: 基准情形
          low: 0.8
          mid: 1.2
          high: 1.5
          detail: 收入接近代理指标，但不透明度让投资人不愿支付完整溢价估值。
          tone: warning
        - label: 牛市情形
          low: 1.8
          mid: 2.4
          high: 3
          detail: 经常性规模显著改善，且高溢价网络安全可比公司环境仍然友好。
          tone: positive
    approximationNotes: 区间是以十亿美元计的企业价值情景，绑定明确假设，不是当前定价的隐含值。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: CertiK 在品类相关性和产品宽度上得分最高，在透明度和回报可见度上最弱。
    data:
      items:
        - label: 市场相关度
          score: 8
          detail: 区块链安全仍然重要，公开可比公司也证明，投资人愿意为可信安全领导者付费。
          tone: positive
        - label: 产品宽度
          score: 8
          detail: 审计、监控、合规和 AI 安全，把上行故事从狭窄服务细分拓宽出去。
          tone: positive
        - label: 客户证据
          score: 7
          detail: 具名部署和案例研究是真实的，但收入归因仍不透明。
          tone: positive
        - label: 财务透明度
          score: 3
          detail: 经审计收入、利润率和经常性收入占比仍未公开。
          tone: negative
        - label: 估值支撑
          score: 5
          detail: 在激进假设下，上一轮估值说得通；但按当前证据，还没有被充分支撑。
          tone: warning
        - label: 回报可见度
          score: 4
          detail: 股权结构权利和稀释仍可能显著改变投资人结果。
          tone: negative
    approximationNotes: 评分是基于公开证据缺口和优势得出的定性 IC 式判断，不是管理层 KPI。
    claimRefs:
      - CV021
      - CV022
      - CV024
      - CV025
      - CV027
      - CV037
      - CV038
      - CV042
