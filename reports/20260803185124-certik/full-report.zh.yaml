      - number: '2.3'
        title: 买方分层、预算主人与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图高度异质，而这种异质性塑造了 CertiK 的 go-to-market
              经济性。早期协议和代币项目通常购买安全服务，以获得上线可信度、安抚投资人并降低发布风险；工程负责人和创始人往往直接拥有这些决策。成熟 DeFi
              团队、交易所和钱包会购买更宽的栈，可能包括持续监控、漏洞赏金、事件响应和合规工具。持牌 VASP 和面向机构的加密公司则走完全不同的采购路径，因为法务、风控、AML
              和监管相关方会进入购买中心。企业侧的许可链或代币化资产项目不那么在意零售信任徽章，更在意可审计性、形式化验证，以及能通过采购和合规审查的控制。CertiK
              的产品宽度因此重要：窄审计卖家只能捕获发布事件，平台型卖家可以随客户进入运营、监控和高监管负载的工作流。
