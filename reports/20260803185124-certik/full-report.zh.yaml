    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 产品套件沿客户路径展开：先做上线前加固，再进入持续监控、合规和调查。
    data:
      nodes:
        - id: build
          label: 构建协议 / 钱包 / 应用
          detail: 团队开发智能合约、应用逻辑和外围基础设施。
        - id: audit
          label: 执行代码安全审计
          detail: CertiK 在上线前评估代码并暴露漏洞。
        - id: pentest
          label: 加固链下界面
          detail: 渗透测试把审查扩展到 API、Web 应用和其他应用层资产。
        - id: launch
          label: 上线并展示信任信号
          detail: 项目可以把用户或合作伙伴引向 CertiK 公开信任界面。
        - id: monitor
          label: 持续监控项目
          detail: Skynet 跟踪项目状态、报告和持续风险信号。
        - id: comply
          label: 执行 AML / 交易监控
          detail: SkyInsights 支持地址和交易筛查，服务受监管或有风险意识的运营。
        - id: investigate
          label: 调查事件或代币
          detail: Skylens 和 Token Scan 帮助研究人员和开发者检查攻击路径或高风险资产。
      edges:
        - from: build
          to: audit
          label: 上线前审查
        - from: audit
          to: pentest
          label: 扩大安全范围
        - from: pentest
          to: launch
          label: 带着信任资产上线
        - from: launch
          to: monitor
          label: 上线后可见性
        - from: monitor
          to: comply
          label: 将风险控制落地到运营
        - from: comply
          to: investigate
          label: 升级可疑活动
    approximationNotes: 流程展示的是公开资料最能支撑的生命周期；个别客户可能只购买其中一部分模块。
