      - number: '2.2'
        title: 规模测算口径与市场量级
        blocks:
          - type: paragraph
            body: >-
              公开市场规模来源都同意，安全仍是 Web3 技术栈中增长更快的层之一；但它们并不一致地定义被统计的内容。最宽的商业研究口径把 2026 年市场价值放在约 28.6 亿美元，并指向 2030 年接近 68.4
              亿美元。更窄的审计公司口径把 2026 年机会收缩到约 10.2
              亿美元，因为它剔除了硬件和部分相邻安全软件。两个视角都有用。宽口径解释了为什么大企业、政策参与者和跨链基础设施提供商越来越关心这一领域。窄口径更接近那些仍以代码审查和信任背书起步变现的公司的实际收入池。对
              CertiK 来说，现实中位数应是一个 SAM：包括审计、渗透测试、链上监控、节点安全和合规分析，但不包括市场研究机构贴上 Web3 安全标签的每一类硬件或通用网络安全支出。
