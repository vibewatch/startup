      - number: '8.3'
        title: 情景分析与投资建议
        blocks:
          - type: paragraph
            body: >-
              对 CertiK 的建议，应框定为价格敏感型决策，而不是对公司质量给一个简单判决。牛市情景是：公司广泛的安全覆盖、庞大的公开证明基础和合规导向产品，确实转化成超过 $120 million
              的经常性收入引擎，而且韧性足以支撑优质网络安全倍数。基准情景更克制：CertiK 真实、重要，也可能很有价值，但披露仍太轻，投资人很难不打折就承销 2022
              年标题估值。熊市情景是：审计占比过高的经济模型，或新的信任损伤，把估值暴露为周期高点溢价，随后大幅压缩。这个结构指向一条有纪律的建议：继续尽调，把公司留在可投资名单上，但不要盲目锚定上一轮私营市场估值。实操上，上行应来自证据改善或入场价格纪律，而不是乐观插值。如果管理层能证明经审计经常性收入和客户耐久性，估值支撑会很快增强；如果不能，上一轮估值更多只是历史参照，不是当下真相。
