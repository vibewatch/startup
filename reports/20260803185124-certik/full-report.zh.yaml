  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              CertiK 所处市场的监管正在变得更具体，而不是更少。UAE 证据尤其重要，因为它展示了“Web3 机构化”现在在实践中意味着什么。VARA 围绕消费者保护和风险保障设计制度；ADGM
              则持续细化可接受资产标准、资本预期、AML 框架，甚至加密挖矿指引。CertiK 自己的 Hub71 内容证实，许可准备度和合规支持已经进入早期客户对话，而不只是企业采购环节。这为 SkyInsights
              和合规工具创造了真实机会，但也抬高了法律风险底线。CertiK 现在必须向这样的客户环境销售：范围免责声明、监管对齐和文档质量，和技术检测同样重要。Hunt 条款进一步强化了这种复杂性：CertiK
              是一个承担法律边界责任的平台运营方，不只是专业服务供应商。简言之，监管不再只是需求顺风；一旦产品、主张或客户预期偏离一致性，它也会成为执行负担和潜在责任来源。
