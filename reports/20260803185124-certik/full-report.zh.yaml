              SkyInsights。公司也似乎正在 AI-agent 开发者和市场中打开一个更新的分层，尤其通过 Skills 和 Skill Scanner。多样性的上行是，CertiK 可以参与 Web3
              生命周期的多个环节。代价是，公开证据必须按分层细分，而不能当作一个无差别客户故事处理。
