      - number: '8.2'
        title: 倍数逻辑与可比公司框架
        blocks:
          - type: paragraph
            body: >-
              压力测试 CertiK，最干净的办法是先把它隐含的私营市场倍数，与披露透明的上市网络安全公司对齐，再为不透明度打折。如果二级来源给出的 $87 million ARR 大方向没错，上一轮估值对应约 23x
              收入。这个倍数很高，但在网络安全板块并非数学上说不通：CrowdStrike、Palo Alto 等优质网络安全公司当前公开市场倍数更丰厚，CyberArk 也仍因身份安全质量拿到强估值；同时，23x 也高于
              SentinelOne 和 Zscaler 所代表区间的低端。这里的结论不是 CertiK
              配得上上市公司平均倍数，而是市场有时确实会为具备增长、任务关键性和经常性收入的安全龙头支付很高价格。真正决定结果的是折价问题。与上市可比公司不同，CertiK
              不披露经审计增长、利润率、留存或股权结构经济条款。Circle 的申报历史在这里有参考价值：它说明加密相关 IPO 窗口是开的，也说明真正走向公开市场需要多大披露强度。因此，CertiK
              可以用公开网络安全估值带作参照，但在披露追上来之前，仍应承受私营公司的折价。
