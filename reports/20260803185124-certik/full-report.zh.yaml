        title: 创始人、领导梯队与治理信号
        blocks:
          - type: paragraph
            body: >-
              公开领导层顶部学术色彩异常浓，下面则越来越偏运营。Ronghui Gu 和 Zhong Shao 以深厚形式化验证履历托住创始故事；Jason Jiang、Kang Li、Denise
              Benattar、Stefan Muehlbauer、Hudson Jameson 等高管显示公司有意补强商业化、企业安全运营、法律流程、公共事务和生态分发。这种组合支持一个判断：CertiK 正试图摆脱
              crypto-native 审计品牌，专业化为机构基础设施提供商。即便如此，按后期私营公司标准看，治理披露仍偏薄。公开材料没有给出当前董事会名单、委员会结构、投票动态，也没有详细解释接班规划。Ronghui Gu
              仍主导融资、政策和 IPO 相关沟通，关键人依赖已经是实质问题。关键人依赖本身不必然负面，但一旦市场环境、监管或另一场公开争议迫使管理层迅速重配领导层曝光度，执行敏感性会更高。
