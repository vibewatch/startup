  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值传导
      - 概率信号
    rows:
      - - 乐观
        - 经常性收入超过约 $120M，企业 / 合规收入占比上升；IPO 窗口保持开放，信任也维持稳定。
        - 若采用网络安全高端倍数，$1.8B-$3.0B 的支撑开始可信。
        - 有可能，但仍需要超出当前公开材料的证据。
      - - 基准
        - 收入接近当前代理值，增长延续，但披露仍不完整，投资人给予私营公司折价。
        - $0.8B-$1.5B 比 $2B 标示估值更容易辩护。
        - 这是今天公开证据最能支撑的情景。
      - - 悲观
        - 收入基数小于代理值暗示，或又一次信任事件削弱增长和定价权。
        - 如果基本面和情绪同时收缩，低于 $1B 的支撑就变得合理。
        - 关键承销指标仍未公开，不能排除。
