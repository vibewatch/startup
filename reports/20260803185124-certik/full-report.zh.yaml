  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多项风险会沿同一通道传导：信任受损会同时影响客户、融资和估值。
    data:
      nodes:
        - id: controversy
          label: 披露 / 声誉争议
          detail: Kraken 或 Huione 式事件会伤及信任。
          type: risk
        - id: reg_change
          label: 监管收紧
          detail: 司法辖区规则变化或监管趋严。
          type: risk
        - id: partner_issue
          label: 合作伙伴 / 平台问题
          detail: OKX AI、Hub71、CoinGecko 或公开端点出问题。
          type: risk
        - id: customers
          label: 客户转化 / 留存
          detail: 销售周期、续约和交叉销售附着率。
          type: business
        - id: costs
          label: 交付与合规成本
          detail: 额外测试、筛查和文档负担。
          type: business
        - id: financing
          label: 融资 / IPO 准备度
          detail: 以有吸引力的条款融资或上市的能力。
          type: business
        - id: valuation
          label: 估值质量
          detail: 平台故事的倍数和可信度。
          type: outcome
      edges:
        - from: controversy
          to: customers
          label: 信任侵蚀
        - from: controversy
          to: financing
          label: 公众审视
        - from: reg_change
          to: customers
          label: 适配范围变窄 / 审批变慢
        - from: reg_change
          to: costs
          label: 合规工作增加
        - from: partner_issue
          to: customers
          label: 分发变弱或体验断裂
        - from: partner_issue
          to: valuation
          label: 护城河叙事变弱
        - from: customers
          to: valuation
          label: 证据与耐久性
        - from: costs
          to: valuation
          label: 利润率压力
        - from: financing
          to: valuation
          label: 价格纪律与选择权
    approximationNotes: 该 DAG 映射公开风险路径，不是量化内部模型。
    claimRefs:
      - CR011
      - CR013
      - CR019
      - CR025
      - CR029
      - CR030
