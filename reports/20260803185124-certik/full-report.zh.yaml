  - id: TV005
    title: 打破论点与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 为何重要
      - 行动含义
    rows:
      - - 收入质量不达标
        - 经审计经常性收入显著低于公开代理值，或利润率太弱，撑不起高端倍数。
        - 会从根基上削弱软件化估值叙事。
        - 用更低收入和倍数区间重新承销。
      - - 新的信任争议
        - 又一次高曝光争议、与漏洞利用相关的反弹，或信誉事件打击品牌。
        - 会同时削弱获客和公开市场可选性。
        - 暂停，或扩大折价，直到影响可衡量。
      - - 降价轮或结构化融资
        - 新融资低于参考估值，或附带重偏好权利。
        - 即便运营稳定，也会重置价格支撑并改写回报计算。
        - 将上一轮标记视为过期，重建股权结构模型。
      - - 耐久性指标偏弱
        - NRR、流失率或集中度数据显示重复经济性脆弱。
        - 会显示 CertiK 更像项目驱动，而非平台型公司。
        - 下调目标倍数，重新审视建议。
      - - IPO 准备缺口持续
        - 尽管有公开市场野心，披露质量和治理仍过薄。
        - 会限制退出路径，并降低稀缺价值。
        - 倾向采用私营公司折价承销，并放慢尽调节奏。
    notes: 否决标准聚焦会直接打破高端倍数叙事的证据或事件，而不是普通市场波动。
    claimRefs:
      - CV025
      - CV026
      - CV038
      - CV039
      - CV041
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入与 ARR 桥接
        - 董事会批准的收入、ARR，以及服务与订阅组合。
        - 判断上一轮标记是否落在可支撑的收入框架内。
        - 索取 CFO 材料包或经审计财务摘录。
      - - 毛利率与现金状况
        - 毛利率、贡献利润率、现金消耗和续航期。
        - 区分高端软件经济性和高端叙事。
        - 索取财务尽调材料包。
      - - 留存与集中度
        - NRR、GRR、流失率、前十大客户占比，以及从审计到经常性产品的附加率。
        - 判断耐久性，以及平台叙事是否真实。
        - 索取客户分群表，并安排客户访谈。
      - - 股权结构权利
        - 优先权、清算顺位、期权池、按比例跟投权和附函。
        - 如果权利负担重，回报结果可能与企业价值大幅偏离。
        - 索取股权结构模型和领投方条款摘要。
      - - IPO 准备度与治理
        - 审计准备、法律工作流、内控，以及董事会对公开市场的态度。
        - 澄清 IPO 叙事是近期可选性，还是远期定位。
        - 索取治理检查清单和投行 / 律师准备度评估。
    notes: 这些请求是把合理区间转化为可投资价格所需的最低材料包。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV042
