        - CertiK 有机会从受认可的审计品牌，演进为服务 web3 和 AI agent 工作流的持续安全、监控与合规平台。
        - 经审计的经常性收入、强留存和企业客户占比证据。
        - 证据显示大部分收入仍来自一次性审计项目，或声誉继续限制向高端客户转化。
      - - 反方论点
        - 公司可能仍被按高端软件平台定价，但收入质量和耐久性还没有足够证据配得上这种待遇。
        - 续约弱、经常性收入低于预期，或融资低于上一轮标记的证据。
        - 经常性经济模型持久，以及权利结构比公开记录更清晰的证据。
    notes: 估值争议的关键不在于 CertiK 有没有需求，而在于这些需求到底有多持久、多像软件收入。
