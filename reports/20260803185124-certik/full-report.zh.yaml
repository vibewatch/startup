  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              CertiK 所处市场可以用两种很不同的方式界定。最宽口径下，Web3
              安全包括用于保护去中心化应用、节点、钱包、基础设施和受监管数字资产运营的软件、硬件和服务。这个口径纳入云端或本地工具、威胁情报、分析、咨询和合规。窄口径下，更相关的类别是智能合约审计和安全公司市场，预发布代码审查、修复、漏洞赏金和上线后监控，更贴近
              CertiK 当下的日常收入模式。这个区别很重要，因为它改变投资人对 TAM 的解读。宽口径市场规模可以说明生态方向，但仍可能夸大 CertiK 实际可捕获的支出部分。尽调中更合适的工作边界应是分层的：用广义
              Web3 安全理解品类背景，用以服务为主的审计、监控和合规预算判断今天真实采购行为。
            claimRefs:
              - CM001
              - CM003
