  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局形态与同业集合
        blocks:
          - type: paragraph
            body: >-
              CertiK
              周边竞争场很宽，结构上也碎片化。仅发现类来源就浮现几十个替代者，广义市场地图仍列出一大批具名公司，而不是一个集中的双寡头。但在实践中，对严肃协议和机构来说，心智名单会压缩成更小的一组品牌：CertiK、Quantstamp、Trail
              of Bits、OpenZeppelin、Consensys Diligence、Sigma Prime、Halborn 和 Hacken
              反复出现在排名、市场地图和买方指南中。这个同业篮子比长尾目录更重要，因为智能合约审计和监控的信任市场高度由声誉驱动。即便如此，竞争对手并不可互换。有些公司以深度安全工程或协议研究领先，有些靠生态标准工具或与
