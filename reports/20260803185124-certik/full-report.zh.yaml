  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 除自有研究引擎外，CertiK 还依赖监管机构、数据伙伴、渠道伙伴和公开分发触点。
    data:
      nodes:
        - id: certik
          label: CertiK 风险引擎
          detail: 中心节点，整合审计、API、评分和 AI 产品。
          type: product
        - id: vara
          label: VARA / UAE 规则
          detail: 受监管交易所和生态工作所处的监管环境。
          type: regulator
        - id: adgm
          label: ADGM / FSRA 规则
