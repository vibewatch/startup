      - number: '2.4'
        title: 驱动因素、约束与 ROI 逻辑
        blocks:
          - type: paragraph
            body: >-
              需求很容易解释：攻击损失仍然巨大、可见且反复发生。Immunefi 称，2025 年第一季度单季损失就超过 16 亿美元；CertiK 自己的 2026
              年上半年研究则认为，即便表面比较看起来更好，底层环境已经恶化。这些损失数据支撑了预防性审查和实时监控的 ROI
              逻辑。不过，价格数据也解释了买方为何仍会谨慎比价。简单合约的审计可以便宜，但复杂多链系统会很贵；紧急程度和特定链人才稀缺还会进一步抬价。与此同时，市场受制于资深审计师稀缺、方法碎片化，以及买方对品牌证书和真正穷尽式审查之间深度差异的怀疑。实践中，最耐久的提供商是能把发布期保障、上线后监控、合规情报，以及在投资人或交易所处的声誉连接起来的公司。今天
              CertiK 的战略逻辑在这个区域最强，但这恰好也是品类中竞争最激烈的部分。
