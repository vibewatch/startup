companyProfile:
  summary: CertiK is a New York-based web3 security platform founded by academics tied to Yale and Columbia that has expanded from smart-contract auditing into formal verification, monitoring, proof-of-reserves, AML/compliance, and AI-security workflows. Public evidence supports a late-stage private company with a real institutional narrative, a historical $2 billion valuation anchor, roughly $296 million of lifetime funding, and thousands of claimed enterprise customers, while leaving major questions open on current operating economics and governance depth.
  foundedDate: '2017-01-01'
  founders:
    - name: Ronghui Gu
      role: Co-founder & CEO
      background: Academic computer-security leader and the primary public face across CertiK's funding, policy, and IPO messaging.
      claimRefs: [CO001, CO003, CO013, CO032]
    - name: Zhong Shao
      role: Co-founder
      background: Academic co-founder anchoring the company's formal-verification and research pedigree.
      claimRefs: [CO001, CO003]
  foundingLocation: New York City, USA
  headquarters: New York City, USA
  productSummary: CertiK sells smart-contract audits, formal verification, penetration testing, Skynet monitoring, SkyInsights compliance and risk analytics, proof-of-reserves work, and newer AI-skill security tooling.
  customerFocus: Protocol teams, wallets, exchanges, custodians, financial institutions, and ecosystem programs that need web3 security assurance or ongoing risk monitoring.
  businessModel: Project-based audit and assurance revenue combined with recurring monitoring, compliance, analytics, and adjacent security-product monetization.
  stage: Late-stage private / pre-IPO
  fundingStatus: Last clear priced round was the March 2022 Series B3 at a $2B valuation; public databases indicate roughly $296M lifetime capital raised, and 2026 strategic activity added new investor and ecosystem signals without a newly disclosed priced round.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO007, CO009, CO010, CO021, CO029, CV001, CV003]
summary:
  headline: CertiK has enough category relevance, product breadth, and customer proof to justify continued diligence, but the current public record still supports research-more rather than paying the historical $2B mark on trust alone.
