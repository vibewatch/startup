chapter:
  number: 5
  title: Product & Technology
  summary: CertiK has evolved into a multi-module Web3 security platform with meaningful API, monitoring, and developer surfaces, but the public record still provides much better evidence of breadth than of deep reliability, roadmap discipline, or module-level operating maturity.
sections:
- id: suite-map-and-customer-workflow
  title: Suite Map and Customer Workflow
  body: CertiK no longer looks like a single-product auditor. The public surface now describes a suite that starts with code-security audits, extends through penetration testing and continuous monitoring, and then adds compliance, transaction-risk, and AI-security products. That breadth matters because it changes how the company fits into a customer workflow. An early-stage protocol or wallet can begin with a smart-contract audit, use pentesting to harden off-chain interfaces, expose itself to community scrutiny through Skynet scores, and later adopt SkyInsights for AML or transaction-monitoring workflows. The YZi partnership reinforces this bundled posture by packaging formal verification, Skynet boosting, and AI scanning as a combined support offer. Customer proof such as Gem Wallet's audit announcement shows the output is meant to operate as an external trust signal as much as an internal engineering deliverable. The practical takeaway is that CertiK is architecting itself as a lifecycle
    security layer for Web3 projects rather than just a one-time review provider.
  claimRefs:
  - CE001
  - CE003
  - CE006
  - CE022
  - CE026
  - CE027
  - CE031
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-and-developer-surface
  title: Architecture and Developer Surface
  body: 'The strongest technical evidence in the public set comes from CertiK''s API and GitHub surfaces. SkyInsights is clearly an authenticated enterprise API with a versioned base URL, explicit auth headers, standardized response codes, and endpoint families for labels, address risk, screening, and transaction risk. The GitHub-based CertiK Skills repo adds a second important layer: it turns CertiK data into agent-native tools with defined commands, script entrypoints, and public endpoints for Skynet Score, Skylens, and Token Scan. This is not just marketing copy. Skylens exposes trace, state, balance, nonce, and source-file operations; Token Scan exposes structured contract-risk checks; and SkyInsights is wired for credentialed operational screening. Together, these surfaces imply an architecture built from scoring engines, monitoring pipelines, authenticated compliance data, and lightweight developer adapters. That makes the suite far more integrable than a PDF-centric services business,
    but it also means the product story depends on API availability, data quality, and integration maintenance across several surfaces.'
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE030
  - CE032
  - CE035
  tableRefs:
  - TE003
  figureRefs:
  - FE001
  - FE003
- id: differentiation-trust-and-productization
  title: Differentiation, Trust Controls, and Productization
  body: CertiK's differentiation is not just that it has many products; it is that those products appear to share a common trust-and-intelligence layer. The homepage emphasizes formal verification and large-scale audit output, while SkyInsights focuses on structured risk labels and transaction monitoring. Skynet then packages that security posture into public rankings and market-facing research. The CoinGecko case study makes the design more concrete by showing Skynet fusing security data with external market data so users can evaluate risk and market context together. The 2026 prediction-markets report and AI-agent leaderboard show that CertiK can convert this underlying machinery into repeatable sector products, not only bespoke engagements. Trust controls deepen the story. Public SOC 2 Type II and ISO 27001 credentials, plus guidance about enterprise diligence expectations, suggest the company knows its buyers increasingly care about control environments around the product, not only vulnerability
    findings in the product. This all supports a platform thesis—but still one mediated through relatively high-level public evidence rather than deep engineering disclosures.
  claimRefs:
  - CE002
  - CE004
  - CE005
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE028
  - CE029
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: maturity-signals-and-technical-gaps
  title: Maturity Signals and Technical Gaps
  body: Public maturity signals are meaningful but uneven. On the positive side, CertiK exposes metrics for audit findings, monitored projects, active users, address labels, and incident detections; it publishes current docs; it maintains a developer-facing skills repository; and it keeps releasing adjacent products and vertical reports. Those are all signs of a living platform. The gaps are equally important. The public metric surfaces are not fully harmonized across properties, there is no detailed public roadmap for module-by-module releases, and this source set does not surface a status page, public SLA, or detailed reliability history. The result is a product-and-technology story that is broad, active, and credible, but still partially opaque where an enterprise diligence team would want deeper operating evidence. For diligence, the key question is no longer whether CertiK has product breadth; it is whether that breadth is matched by sufficiently mature operational discipline, observability,
    and release rigor underneath the marketing surface.
  claimRefs:
  - CE007
  - CE023
  - CE024
  - CE025
  - CE033
  - CE034
  - CE035
  tableRefs:
  - TE005
