  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: Public uptime history, status page, SLA commitments, and module-specific incident history.
    whyItMatters: API-centric and monitoring-centric products are only as strong as their operational reliability.
    diligencePath: Request status-page history, internal SLOs, support response metrics, and major incident postmortems by module.
  - type: private-evidence-only
    severity: material
    topic: product-adoption
    missingEvidence: Paid-user counts, active enterprise accounts, and retention by module.
    whyItMatters: Public metrics show breadth but do not reveal which products have durable commercial adoption.
    diligencePath: Request module-level customers, active usage, renewal, and attach-rate data.
  - type: missing-source
    severity: minor
    topic: roadmap
    missingEvidence: Dated release plan for SkyInsights, Skynet, Skills, and Skill Scanner.
    whyItMatters: Event-driven announcements do not substitute for roadmap discipline or predictable execution.
    diligencePath: Collect product roadmap, release notes cadence, and platform deprecation policy.
  - type: conflicting-data
    severity: minor
    topic: metric-consistency
    missingEvidence: Canonical definitions for monitored projects, assessed market cap, monthly active users, and other public counters across properties.
    whyItMatters: Inconsistent public counters can make scale look softer than it may be.
