  topStrengths:
    - >-
      CertiK has a real web3-security brand with product breadth spanning audits, monitoring, compliance,
      proof-of-reserves, and AI-security tooling.
    - >-
      The company has visible customer and channel proof across protocols, wallets, exchanges, and ecosystem partners
      rather than a purely theoretical market position.
    - >-
      Historical financing support is substantial, with a public $2B valuation anchor and roughly $296M of lifetime
      capital raised.
  topRisks:
    - >-
      Public valuation support still depends on an unaudited ARR proxy rather than audited recurring revenue, margin, or
      retention disclosure.
    - >-
      Brand and trust damage from Kraken-era controversy and other public criticism can directly impair enterprise
      procurement and IPO readiness.
    - >-
      Investor return math remains incomplete because liquidation preferences, dilution, and other cap-table rights are
      not publicly visible.
    - >-
      CertiK may still have more project-driven and crypto-cycle-sensitive economics than a premium software multiple
      implies.
  unresolvedGaps:
    - Need audited ARR or revenue, services-versus-subscription mix, and gross-margin disclosure.
    - Need NRR, GRR, churn, top-customer concentration, and attach-rate evidence to prove durable recurring economics.
    - Need cap-table rights, preferences, option-pool data, and any structured financing terms.
    - >-
      Need clearer evidence of IPO readiness, internal-controls maturity, and governance depth beyond ambition
      statements.
