  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current cash balance, burn rate, runway, and liquidation preferences for post-2022 investors.
    whyItMatters: Capital adequacy and downside protection cannot be underwritten from public evidence alone.
    diligencePath: Request cap table, financing documents, and monthly cash / burn bridge from management.
  - type: conflicting-data
    severity: minor
    topic: founding-year
    missingEvidence: A reconciled explanation of whether 2017 marks incorporation and 2018 marks commercial launch.
    whyItMatters: Benchmarking company age, execution speed, and employee growth requires a single canonical start date.
    diligencePath: Verify Delaware incorporation records and the earliest commercial contract or funding close.
    relatedQuestionRefs:
    - QO001
    - QO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board composition, observer rights, and any governance changes linked to the IPO path.
    whyItMatters: Board structure determines control, fundraising flexibility, and readiness for public-company processes.
    diligencePath: Request board deck cover pages, investor-rights summary, and governance org chart.
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Audited revenue, margin, and profitability figures supporting the company's rapid-growth claims.
    whyItMatters: The step from platform narrative to investable pre-IPO thesis depends on verified unit economics and quality of earnings.
    diligencePath: Request audited or reviewed financial statements, monthly ARR bridge, and customer cohort retention data.
  - type: conflicting-data
    severity: minor
    topic: scale-metrics
    missingEvidence: A reconciled metric dictionary for clients served, enterprise clients, assets secured, and vulnerabilities identified.
    whyItMatters: Different public metrics may use different denominators, making cross-period growth claims hard to compare.
    diligencePath: Ask management to define each KPI and map legacy disclosures to current KPI definitions.
