    - id: exchange
      label: Exchange / reserve verification
      detail: Exchanges use CertiK for security frameworks or proof-of-reserves attestation.
    - id: channel
      label: Channel / ecosystem onboarding
      detail: Startup ecosystems and incubators bring in CertiK as a preferred security vendor.
    - id: publish
      label: Publish trust evidence
      detail: Customers expose audit reports, Skynet pages, or public verification outcomes.
    - id: expand
      label: Expand into workflow
      detail: Monitoring, compliance tooling, repeated assessments, or embedded data integrations follow.
    edges:
