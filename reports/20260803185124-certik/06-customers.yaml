  - - Wallets
    - Security lead / product / company
    - App and wallet security assessment plus public trust signal
    - Gem Wallet and Bitget Wallet examples
    - Good public proof and downstream user trust
    - No wallet-customer revenue mix disclosed
  - - Exchanges / custodial venues
    - Risk, platform security, leadership
    - Proof of reserves, exchange audits, wallet security, compliance surfaces
    - Gate Dubai and OKX examples
    - High strategic value and institutional trust relevance
    - Few named examples with economics
  - - Institutional / compliance buyers
    - Compliance, AML, risk teams
    - SkyInsights screening, labeling, transaction-risk workflows
    - SkyInsights positioning and Hub71 compliance tool
    - Potentially recurring enterprise spend
    - No customer names or pricing tiers
  - - Ecosystem / incubator channels
    - Program managers, startup platforms, investors
    - Subsidized audits, compliance tool access, partner referrals
    - Hub71 and YZi programs
    - Seeds future customers efficiently
    - Conversion from program to paid account unknown
  - - AI-agent developers / marketplaces
    - Developers, enterprises, marketplaces
    - Skills, Skill Scanner, onchain agent security checks
    - OKX AI and Skill Scanner launch
    - New adjacent demand pool
    - Too new for durable adoption proof
  notes: Buyer, user, and payer often differ by module, so segmentation is based on the most supportable public workflow rather than a single CRM taxonomy.
