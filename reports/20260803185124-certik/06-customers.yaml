  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, contract length, and renewal rates by module or segment.
    whyItMatters: The chapter can prove adoption, but not whether the best accounts are sticky or expanding economically.
    diligencePath: Request cohort retention and logo-retention data for audits, Skynet, SkyInsights, and other recurring products.
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-TU003
    missingEvidence: Revenue share of top customers, top jurisdictions, and channel-dependent accounts, including the unnamed remainder outside TU003.
    whyItMatters: A few high-profile exchanges or ecosystem partners could dominate economics while the public logo set looks broad.
    diligencePath: Request top-10 customer revenue concentration and geography split.
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: satisfaction
    missingEvidence: Formal CSAT, NPS, or third-party review distributions across customer segments.
    whyItMatters: Testimonials are useful but inherently selected; they do not substitute for broader satisfaction evidence.
    diligencePath: Collect customer survey data or independent review-platform metrics.
  - type: missing-source
    severity: minor
    topic: program-conversion
    missingEvidence: Paid conversion rates from Hub71, YZi, or other subsidy and grant programs into long-term customers.
    whyItMatters: Channel optics can exaggerate revenue quality if subsidized accounts do not convert or renew.
    diligencePath: Request cohort conversion from ecosystem programs into paying and repeat accounts.
