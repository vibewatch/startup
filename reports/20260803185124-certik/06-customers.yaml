- id: durability-expansion-and-procurement-friction
  title: Durability, Expansion, and Procurement Friction
  body: 'The public record gives some reasons to believe customer relationships can extend over time, but not enough to underwrite retention with confidence. Testimonials mention at least one relationship dating back to 2018 and another account that used two audits plus Skynet, which suggests CertiK can expand from a launch review into repeated or ongoing services. Gem Wallet''s stated plan for future independent assessments reinforces that possibility. The product architecture also supports an expansion story on paper: audits can lead to monitoring, compliance products, proof-of-reserves work, or AI-security add-ons. Yet these are still mostly directional signals. There is no public NRR, GRR, churn, contract-length, or concentration data in this chapter''s corpus. Procurement also appears more complex as the company moves upmarket. CertiK''s own SOC 2 and ISO 27001 guidance makes clear that banks and enterprise buyers ask for control evidence during diligence, and Yahoo''s reporting shows
    trust controversies can become real account friction. That means the same brand that opens doors can also create questions in sensitive customer segments.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU028
  - CU029
  - CU030
  - CU031
  - CU035
