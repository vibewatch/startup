    - Reputational events can slow procurement in sensitive accounts
    - Could stretch sales cycles or reduce win rates
    - Request pipeline loss reasons after 2024-2026 controversies
  - - Compliance-tool distribution via Hub71 and similar channels
    - Channel conversion may be weaker than headline partnership optics
    - May overstate future recurring revenue
    - Request paid-conversion data from subsidy or grant programs
  - - AI-security products and OKX AI distribution
    - New segment may monetize slower than launch attention suggests
    - Could dilute focus without near-term revenue payoff
    - Request bookings and active-customer data for AI-adjacent products
  - - Proof-of-reserves and regulated workflows
    - Regulatory relationships may cluster around a few jurisdictions or anchor accounts
    - Regional concentration could raise renewal volatility
    - Request geographic revenue split and regulated-customer share
  notes: This table focuses on the commercial transmission of customer quality into durability and concentration risk, not just on logo prestige.
