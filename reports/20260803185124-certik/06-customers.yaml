  - TU005
- id: bottom-line-on-customer-quality
  title: Bottom Line on Customer Quality
  body: The best way to characterize CertiK's customer story is “broad, real, but only partially measurable.” The company clearly has real logos, named deployments, public testimonials, and product integrations that go beyond empty homepage branding. It also appears to reach customers at several points in the security lifecycle, from startups and wallets to exchanges and institutional compliance buyers. That breadth is strategically valuable because it lowers dependence on one narrow product motion. But the current public evidence is much better at proving presence than at proving durability or revenue quality. Investors can be reasonably confident that CertiK has meaningful market adoption; they cannot, from public sources alone, quantify how sticky the best accounts are, how concentrated the revenue base may be, or how much recurring spend exists beyond one-time audit work.
  claimRefs:
  - CU002
  - CU004
  - CU028
  - CU029
  - CU033
  - CU035
