chapter:
  number: 6
  title: Customers
  summary: CertiK has real and diverse customer proof across protocols, wallets, exchanges, and ecosystem channels, but public evidence still reveals much more about logo breadth and trust signaling than about retention, concentration, or recurring account economics.
sections:
- id: who-the-customers-are
  title: Who the Customers Are
  body: 'CertiK''s customer base is no longer best described as simply “projects needing an audit.” The public record points to several distinct segments: launch-stage protocols that need code review and listing credibility, wallets and exchanges that need deeper security assessment or proof-of-reserves work, institutional or compliance-led buyers that need AML and transaction-risk tooling, and ecosystem programs that want a trusted security vendor embedded into founder support. This mix matters because buyer, user, and payer are not the same across the suite. A protocol founder may buy an audit, a wallet operations team may use ongoing monitoring, and a compliance leader may procure SkyInsights. The company also appears to be opening a newer segment among AI-agent developers and marketplaces, especially through Skills and Skill Scanner. The upside of this diversity is that CertiK can participate across several parts of the Web3 lifecycle. The tradeoff is that public evidence has to be sorted
    carefully by segment rather than treated as one undifferentiated customer story.'
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU017
  - CU018
  - CU025
  - CU027
  - CU033
  tableRefs:
  - TU001
  - TU006
  figureRefs:
  - FU001
- id: named-customer-proof-and-adoption
  title: Named Customer Proof and Adoption Quality
  body: 'The strongest adoption evidence comes from named customer examples where CertiK''s work is visible and the customer articulates what was delivered. Gem Wallet provides one of the best examples because the outcome is specific: a published April 2026 assessment across iOS and Android, zero critical or high findings, six resolved medium issues, and a public live profile on Skynet. Gate Dubai offers another high-quality proof point because the scope is operational rather than purely narrative: CertiK verified liabilities with a Merkle-tree process and reserve control through on-chain transactions across ten in-scope assets. OKX shows account expansion rather than a single tactical engagement, covering exchange, wallet, smart-contract, and product-integration surfaces. Hub71 and YZi-style partnerships add a different sort of proof: not deep deployment detail, but evidence that CertiK is being used as an ecosystem infrastructure partner to source and shape future customers. Collectively,
    these examples support real adoption, but the evidence remains selective rather than systematic across the whole customer base.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
