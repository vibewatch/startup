figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: CertiK's strongest public customer path runs from launch security into monitoring, trust signaling, and eventually compliance or platform-level expansion.
  data:
    items:
    - label: Security trigger
      description: A protocol, wallet, or exchange decides that launch, listing, or custody trust requires independent security review.
    - label: Initial engagement
      description: CertiK enters through an audit, pentest, proof-of-reserves engagement, or ecosystem subsidy program.
    - label: Public trust surface
      description: The customer publishes the report or points users and partners to Skynet profiles, creating external proof.
    - label: Operational expansion
      description: Accounts can add Skynet, proof-of-reserves, compliance tooling, or repeated assessments as needs mature.
    - label: Institutional / ecosystem embed
      description: The strongest end-state is becoming part of a customer or channel partner's ongoing risk, listing, or compliance workflow.
  approximationNotes: The journey is synthesized from named customer examples and product surfaces rather than from a disclosed funnel with conversion rates.
  claimRefs:
  - CU001
  - CU010
  - CU012
  - CU014
  - CU019
  - CU022
  - CU031
