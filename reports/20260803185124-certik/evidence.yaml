evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current cash balance, burn rate, runway, and liquidation preferences for post-2022 investors.
    whyItMatters: Capital adequacy and downside protection cannot be underwritten from public evidence alone.
    diligencePath: Request cap table, financing documents, and monthly cash / burn bridge from management.
  - type: conflicting-data
    severity: minor
    topic: founding-year
    missingEvidence: A reconciled explanation of whether 2017 marks incorporation and 2018 marks commercial launch.
    whyItMatters: Benchmarking company age, execution speed, and employee growth requires a single canonical start date.
    diligencePath: Verify Delaware incorporation records and the earliest commercial contract or funding close.
    relatedQuestionRefs:
      - QO001
      - QO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board composition, observer rights, and any governance changes linked to the IPO path.
    whyItMatters: Board structure determines control, fundraising flexibility, and readiness for public-company processes.
    diligencePath: Request board deck cover pages, investor-rights summary, and governance org chart.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Audited revenue, margin, and profitability figures supporting the company's rapid-growth claims.
    whyItMatters: >-
      The step from platform narrative to investable pre-IPO thesis depends on verified unit economics and quality of
      earnings.
    diligencePath: Request audited or reviewed financial statements, monthly ARR bridge, and customer cohort retention data.
  - type: conflicting-data
    severity: minor
    topic: scale-metrics
    missingEvidence: >-
      A reconciled metric dictionary for clients served, enterprise clients, assets secured, and vulnerabilities
      identified.
    whyItMatters: Different public metrics may use different denominators, making cross-period growth claims hard to compare.
    diligencePath: Ask management to define each KPI and map legacy disclosures to current KPI definitions.
  - type: missing-source
    severity: material
    topic: certik-sam
    missingEvidence: >-
      A management-defined service-line revenue mix that separates audits, monitoring, pentesting, compliance, and
      advisory.
    whyItMatters: Without service-line mix, CertiK-specific SAM and SOM remain estimated rather than evidenced.
    diligencePath: Request segment revenue split, recurring versus project revenue, and buyer mix by customer cohort.
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: A reconciled category taxonomy across broad web3-security and narrow smart-contract-audit reports.
    whyItMatters: Different analyst methodologies produce materially different TAM numbers, which can distort valuation narratives.
    diligencePath: Normalize each source into common buckets before using TAM in valuation work.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: private-evidence-only
    severity: material
    topic: budget-owners
    missingEvidence: Win-rate and attach-rate data showing how often audit buyers later buy monitoring or compliance modules.
    whyItMatters: The bull case for a platform strategy depends on expansion economics, not just market size.
    diligencePath: Request cohort conversion data from first audit to multi-product deployment.
  - type: missing-source
    severity: minor
    topic: buyer-spend
    missingEvidence: Independent procurement datasets for enterprise blockchain security spend by vertical and geography.
    whyItMatters: Enterprise TAM assumptions are otherwise inferred from analyst narratives rather than observed budgets.
    diligencePath: Use procurement databases, RFP archives, and buyer interviews in a deeper diligence phase.
  - type: missing-source
    severity: material
    topic: quote-data
    missingEvidence: Live side-by-side quotes from CertiK and major competitors for comparable audit scopes.
    whyItMatters: >-
      Without actual quote data, pricing power is inferred from reputation and guides rather than observed market
      behavior.
    diligencePath: Solicit comparable bids from CertiK, Trail of Bits, OpenZeppelin, Quantstamp, and one low-cost alternative.
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: Pipeline win-rate, renewal, and attach-rate data by competitor and scope complexity.
    whyItMatters: Moat durability depends on actual conversion and expansion, not just public branding.
