  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Shape and Peer Set
        blocks:
          - type: paragraph
            body: >-
              The competitive field around CertiK is broad and structurally fragmented. Discovery sources alone surface
              dozens of substitutes, and broad market maps still identify a large pack of named firms rather than a
              concentrated duopoly. In practice, however, the field compresses into a much smaller set of top-of-mind
              brands for serious protocols and institutions: CertiK, Quantstamp, Trail of Bits, OpenZeppelin, Consensys
              Diligence, Sigma Prime, Halborn, and Hacken appear repeatedly across rankings, market maps, and buyer
              guides. That peer basket matters more than long-tail directories because the trust market for
              smart-contract audits and monitoring is heavily reputation-driven. Even so, the competitors are not
              interchangeable. Some lead with deep security engineering or protocol research, some with
              ecosystem-standard tooling or Ethereum proximity, and others with broader trust, compliance, and
              monitoring platforms. CertiK competes best when buyers want breadth and visible scale, not when they want
              only the narrowest specialist review.
