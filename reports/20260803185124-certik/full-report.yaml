  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital History and Disclosed Scale
        blocks:
          - type: paragraph
            body: >-
              CertiK's public financial record is strongest on financing milestones and weakest on audited operating
              statements. The company itself disclosed that its late-2021 B2 round pushed total investment above $140
              million, then said only a few months later that its B3 financing valued the company at $2 billion and
              lifted nine-month capital raised to $230 million. Independent press added useful confirmation and color:
              TechCrunch described the 2022 raise as an $88 million round that included Goldman Sachs, while 2026
              reporting from Yahoo Finance and The Block framed CertiK as a repeat capital raiser with roughly $296
              million raised since inception and a fresh multi-eight-figure Binance-backed follow-on. Taken together,
              the evidence supports a picture of a company that successfully financed rapid growth through the 2021-2022
              cycle and still retained strategic investor support in 2026. What it does not provide is a clean current
