      - number: '8.2'
        title: Multiple Logic and Comparable Frame
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to stress-test CertiK is to compare its implied private multiple with transparent public
              cybersecurity references, then adjust for opacity. If the secondary $87 million ARR figure is
              directionally right, the last mark implies about 23x revenue. That is demanding, but not mathematically
              absurd in a sector where premium cyber names like CrowdStrike and Palo Alto trade at far richer current
              public multiples and where CyberArk still commands a strong valuation for identity-security quality. It is
              also above the lower end of the range represented by SentinelOne and Zscaler. The lesson is not that
              CertiK deserves the public average; it is that the market will sometimes pay very high prices for security
              leaders with growth, mission-criticality, and recurring revenue. The discount question is therefore
              decisive. Unlike the public comps, CertiK does not publish audited growth, margins, retention, or
              cap-table economics. Circle’s filing history is useful here: it shows that the crypto-related IPO window
              is open, but it also shows how much disclosure a real public-market journey requires. CertiK can therefore
              be valued with public-cyber bands as reference points, yet still deserve a private-company haircut until
              disclosure catches up.
            claimRefs:
