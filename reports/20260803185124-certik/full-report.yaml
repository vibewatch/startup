      - number: '2.4'
        title: Drivers, Constraints, and ROI Logic
        blocks:
          - type: paragraph
            body: >-
              Demand is easy to explain: exploit losses remain large, visible, and recurring. Q1 2025 alone produced
              more than $1.6 billion of losses according to Immunefi, while CertiK's own H1 2026 work argues the
              underlying environment has worsened even when headline comparisons look better. Those loss figures support
              the ROI case for preventive review and real-time monitoring. Pricing data shows why buyers still shop
              carefully, though. Audits can be inexpensive for simple contracts yet expensive for complex, multi-chain
              systems; urgency and chain-specific talent scarcity create further premiums. Meanwhile, the market is
              constrained by scarce senior auditors, fragmented methods, and buyer skepticism about the depth difference
              between brand-name certificates and truly exhaustive review. In practice, the most durable providers are
              those that can connect launch-time assurance, post-launch monitoring, compliance intelligence, and
              reputation with investors or exchanges. That is the zone where CertiK has the strongest strategic logic
              today, but it also happens to be the most competitive part of the category.
