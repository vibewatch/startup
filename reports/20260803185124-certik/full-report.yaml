        blocks:
          - type: paragraph
            body: >-
              The public leadership bench is unusually academic at the top and increasingly operator-heavy beneath it.
              Ronghui Gu and Zhong Shao anchor the founding story through deep formal-verification credentials, while
              executives such as Jason Jiang, Kang Li, Denise Benattar, Stefan Muehlbauer, and Hudson Jameson show
              deliberate expansion into commercialization, enterprise security operations, legal process, public
              affairs, and ecosystem distribution. This mix supports the thesis that CertiK is trying to professionalize
              beyond crypto-native audit branding into an institutional infrastructure provider. Even so, governance
              disclosure remains thin by late-stage private-company standards. Public materials do not provide a current
              board roster, committee structure, voting dynamics, or any detailed explanation of succession planning.
              Ronghui Gu still dominates financing, policy, and IPO-facing communications, making key-person dependence
              material. That is not inherently negative, but it increases execution sensitivity if market conditions,
              regulation, or another public controversy force management to rebalance leadership visibility quickly.
