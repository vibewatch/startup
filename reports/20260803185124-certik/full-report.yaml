  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              CertiK sells into a market that can be framed two very different ways. In the broadest lens, web3 security
              includes software, hardware, and services used to secure decentralized applications, nodes, wallets,
              infrastructure, and regulated digital-asset operations. That framing captures cloud or on-prem tooling,
              threat intelligence, analytics, consulting, and compliance. In the narrower lens, the relevant category is
              the smart-contract-audit and security-firm market, where pre-launch code review, remediation, bug
              bounties, and post-launch monitoring sit much closer to CertiK's day-to-day revenue model. The distinction
              matters because it changes how investors should interpret TAM. A broad market number can describe the
              direction of travel for the ecosystem while still overstating the portion of spend CertiK can
              realistically capture. The right working boundary for diligence is therefore a layered one: broad web3
              security for category context, and services-led audit plus monitoring plus compliance budgets for actual
              purchasing behavior in practice today.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM008
              - CM029
