      - number: '2.3'
        title: Buyer Segments, Budget Owners, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is heterogeneous and that heterogeneity shapes CertiK's go-to-market economics. Early-stage
              protocols and token projects usually buy security to earn listing credibility, reassure investors, and
              reduce launch risk; engineering leaders and founders often own those decisions directly. Mature DeFi
              teams, exchanges, and wallets buy a wider stack that can include ongoing monitoring, bug bounties,
              incident response, and compliance tooling. Licensed VASPs and institution-facing crypto firms bring a
              different purchase path altogether, because legal, risk, AML, and regulatory stakeholders become part of
              the buying center. On the enterprise side, permissioned blockchain or tokenized-asset projects care less
              about retail trust badges and more about auditability, formal verification, and controls that survive
              procurement and compliance review. This is why CertiK's product breadth matters: a narrow audit-only
              seller captures the launch event, while a platform seller can grow with the customer into operations,
              monitoring, and regulation-heavy workflows.
