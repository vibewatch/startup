  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              CertiK operates in a part of the market where regulation is becoming more specific, not less. The UAE
              evidence is especially important because it shows what “institutionalizing Web3” now means in practice.
              VARA frames its regime around consumer protection and risk assurance, while ADGM keeps refining
              accepted-asset criteria, capital expectations, AML frameworks, and even crypto-mining guidance. CertiK's
              own Hub71 content confirms that licensing readiness and compliance support are already part of early-stage
              customer conversations, not only enterprise procurement. That creates real opportunity for products like
              SkyInsights and compliance tooling, but it also raises the legal-risk floor. CertiK now has to sell into
              customer environments where scope disclaimers, regulatory alignment, and documentation quality matter as
              much as technical detection. The Hunt terms reinforce this complexity: CertiK is a platform operator with
              legally bounded responsibilities, not just a professional-services vendor. In short, regulation is no
              longer just a tailwind for demand; it is also a source of execution burden and potential liability if
              products, claims, or customer expectations drift out of alignment.
            claimRefs:
