      - number: '3.4'
        title: Switching Costs, Multi-Homing, and Moat Risks
        blocks:
          - type: paragraph
            body: >-
              The biggest mistake in competitor analysis would be to assume audit buyers become permanently captive
              after one engagement. In reality, multi-homing is common: blue-chip protocols mix named firm audits with
              contests, bug bounties, and ongoing monitoring, and many teams rotate reviewers to reduce blind spots.
              That weakens hard lock-in for every major vendor, including CertiK. The firms that hold value best are
              those that keep selling after the initial report through infrastructure, compliance, live monitoring, or
              embedded workflow influence. This is why CertiK's platform expansion matters strategically. It raises
              switching friction somewhat, particularly if Skynet or other post-launch tools become operationally
              embedded. But the same strategy also creates exposure. If buyers come to view CertiK as the broad,
              default, or checkbox option, specialist brands can attack from above on rigor while cheaper alternatives
              undercut from below on price. Public post-audit-incident examples reinforce that no leading brand is
              reputation-proof.
