      - number: '7.4'
        title: Model Risk and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The final risk bucket is model risk: what can go wrong because outside observers still cannot see enough
              of the business. Public evidence strongly supports demand and strategic breadth, but it does not support
              precision on retention, concentration, or recurring-revenue quality. That matters because CertiK's
              valuation and financing options will increasingly depend on whether the market sees it as a durable
              security platform or as a volatile, reputation-sensitive services firm. Rising customer expectations also
              imply higher delivery costs: institution-grade testing, clearer reporting, more compliance work, and
              faster response to new threat vectors like deepfakes or key-management failures. The correct takeaway is
              not that the company is too risky to underwrite at all. It is that the main thesis-break triggers are
              observable: another major disclosure-process controversy, evidence of weak conversion from channels into
              recurring revenue, regulator-driven constraints on served assets or customer types, or proof that public
              trust signals are outrunning actual control discipline. Those are the indicators that should govern
              diligence and price discipline.
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR035
              - CR040
