      - number: '8.3'
        title: Scenario Analysis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              CertiK’s recommendation should be framed as a price-sensitive decision, not as a simple verdict on company
              quality. The bull case is that the company’s broad security footprint, large public proof base, and
              compliance-oriented products really do translate into a recurring revenue engine north of $120 million
              with enough durability to support premium cyber multiples. The base case is more modest: CertiK is real,
              relevant, and potentially valuable, but still too disclosure-light for investors to underwrite the full
              2022 headline mark without a discount. The bear case is that audit-heavy economics or renewed trust damage
              expose the valuation as a cycle-era premium that should compress sharply. That setup points to a
              disciplined recommendation: continue diligence, keep the company on the investable list, but do not anchor
              blindly to the last private mark. In practical terms, investors should look for upside to come from
              evidence improvement or entry price discipline rather than from optimistic interpolation. If management
              can substantiate audited recurring revenue and customer durability, valuation support improves quickly; if
              it cannot, the last mark remains more historical reference than present-tense truth.
            claimRefs:
