      - number: '7.2'
        title: Operational and Reputation Risk
        blocks:
          - type: paragraph
            body: >-
              The Kraken episode remains the clearest public proof that CertiK's biggest downside is often not raw
              technical incompetence but process discipline under pressure. CertiK itself admitted errors in judgment
              and communication; outside coverage shows how quickly the situation turned into an ethics and
              law-enforcement controversy. The Huione backlash matters for the same reason. It suggests that the market
              increasingly expects a security firm to screen who it works for, monitor how reports are used, and behave
              like a quasi-institutional gatekeeper. The company appears to have responded by tightening KYC, using
              outside experts, and involving outside counsel, but those fixes are evidence of a prior gap as much as of
              improvement. This risk is amplified because CertiK publishes trust surfaces at scale. When it is attached
              publicly to project scores, audit reports, or sector rankings, any future misstep can spread faster than
              it would for a quieter boutique auditor. Reputation here is not a soft issue; it directly affects
              willingness of exchanges, wallets, institutions, and even public investors to rely on the brand.
