  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Scope, and Business Model
        blocks:
          - type: paragraph
            body: >-
              CertiK presents itself as a New York-based Web3 security platform rather than a single-service audit
              house. The official about page roots the company in research from Columbia and Yale and says the business
              was founded in 2017 by professors from those institutions, while the homepage broadens the pitch into an
              all-in-one suite that spans smart-contract audits, formal verification, penetration testing, monitoring,
              AML, KYC, and incident response. That platform framing matters because it shifts CertiK from
              project-by-project services into recurring risk infrastructure for protocols, exchanges, wallets, and
              increasingly institutional users. Independent profile pages from the World Economic Forum and CB Insights
              generally support the identity and headquarters narrative, though they disagree on the exact founding year
              and use slightly different descriptions of the company's operating scope. The net result is a clear
              business-model picture: CertiK monetizes trust and technical assurance across the full lifecycle of Web3
              development, but investors still need to normalize inconsistent external profile data before using it in
              benchmarking analyses.
