      - number: '3.3'
        title: Capability, Pricing, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Competitive power in this market comes from more than audit counts. Official pages and buyer guides
              suggest three durable moats: technical depth, distribution, and trust carry. Technical depth shows up in
              protocol or infrastructure specialties, formal verification, and the ability to secure non-EVM or
              cryptographic systems. Distribution comes from libraries, tooling ecosystems, validator products,
              partnerships, and the ability to become the default security touchpoint across a protocol lifecycle. Trust
              carry shows up when a logo on an audit report materially improves fundraising, listings, or institutional
              procurement. That final point also explains pricing power. Public guides show an enormous quote range,
              from low-end token audits to premium multi-chain reviews exceeding six figures. Since most official
              competitors do not publish menu pricing, brand, scope complexity, and speed act as de facto pricing
              levers. CertiK has the clearest breadth story here, but OpenZeppelin and Consensys often have stronger
              ecosystem distribution, while Trail of Bits and Sigma Prime can command specialist depth premiums in
              practice.
