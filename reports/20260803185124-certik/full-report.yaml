            body: >-
              Public materials strongly suggest CertiK is no longer just an audit shop. The company's own posts tie
              revenue growth to both its core audit business and product lines like Skynet, while current product
              surfaces show monetization across smart-contract audits, monitoring, compliance-led data tools, and
