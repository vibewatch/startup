      - number: '1.3'
        title: Capital Formation, Investor Base, and Stage
        blocks:
          - type: paragraph
            body: >-
              CertiK's financing path shows unusually rapid capital formation between mid-2021 and early 2022, when the
              company moved from roughly unicorn status to a $2 billion valuation within months. Official funding posts
              and TechCrunch coverage align on the pivotal B3 round, while Tracxn adds the later April 2022 Series B
              financing and lifts lifetime capital raised to about $296 million. The investor mix matters almost as much
              as the amount: traditional finance names such as Goldman Sachs, SoftBank, and Advent sit alongside
              Sequoia, Tiger Global, Coinbase Ventures, and Binance-linked capital. In January 2026 management added two
              more pieces to the stage narrative: an explicit claim that Binance is now the largest investor following a
              follow-on eight-figure check, and an IPO ambition that is strategic rather than imminent. That supports a
              late-stage private / pre-IPO classification, but the absence of audited financial statements, current cash
              disclosures, or known secondary terms means public evidence still cannot fully underwrite capital adequacy
              or investor-overhang risk.
