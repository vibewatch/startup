        title: Who the Customers Are
        blocks:
          - type: paragraph
            body: >-
              CertiK's customer base is no longer best described as simply “projects needing an audit.” The public
              record points to several distinct segments: launch-stage protocols that need code review and listing
              credibility, wallets and exchanges that need deeper security assessment or proof-of-reserves work,
              institutional or compliance-led buyers that need AML and transaction-risk tooling, and ecosystem programs
              that want a trusted security vendor embedded into founder support. This mix matters because buyer, user,
              and payer are not the same across the suite. A protocol founder may buy an audit, a wallet operations team
              may use ongoing monitoring, and a compliance leader may procure SkyInsights. The company also appears to
              be opening a newer segment among AI-agent developers and marketplaces, especially through Skills and Skill
              Scanner. The upside of this diversity is that CertiK can participate across several parts of the Web3
              lifecycle. The tradeoff is that public evidence has to be sorted carefully by segment rather than treated
              as one undifferentiated customer story.
