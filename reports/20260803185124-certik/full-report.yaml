      - number: '1.4'
        title: Milestones, Scale Claims, and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              The strongest positive signal in CertiK's public narrative is the speed with which it turned an
              academic-security origin into a scaled commercial brand. Management has published successive jumps in
              clients served, vulnerabilities identified, and products launched, while 2024 and 2026 updates broaden the
              story into venture investing, enterprise monitoring, and regulatory positioning. Yet the same chronology
              also contains the company's most important diligence flags. Independent reporters and former clients have
              challenged the consistency and depth of CertiK audits; Kraken publicly accused the company of extortion
              after a bug-bounty dispute; and even the firm's own X account was compromised in a phishing incident.
              Those events do not erase product-market fit, but they do mean the company's path to an IPO or premium
              private valuation depends as much on credibility repair and control maturity as on raw audit volume. The
              milestone record therefore supports a balanced view: CertiK is clearly scaled, but not yet
              controversy-insulated.
