      - number: '2.2'
        title: Sizing Lenses and Market Magnitude
        blocks:
          - type: paragraph
            body: >-
              Public market-size sources agree that security remains one of the faster-growing layers of the web3 stack,
              but they do not agree on exactly what is being counted. The broadest commercial research lens puts 2026
              market value at roughly $2.86 billion with a path to nearly $6.84 billion by 2030. A narrower audit-firm
              lens shrinks the 2026 opportunity to around $1.02 billion, because it strips out hardware and some
              adjacent security software. Both views are useful. The broader lens explains why large enterprises, policy
              actors, and cross-chain infrastructure providers increasingly care about the space. The narrower lens is
              closer to the practical revenue pool for firms whose monetization still starts with code review and trust
              signaling. For CertiK, the realistic middle ground is a SAM that includes audits, pentesting, on-chain
              monitoring, node security, and compliance analytics, but not every hardware or generalized cybersecurity
              spend bucket labeled web3-security by market researchers.
