  evidenceGaps:
  - type: missing-source
    severity: material
    topic: quote-data
    missingEvidence: Live side-by-side quotes from CertiK and major competitors for comparable audit scopes.
    whyItMatters: Without actual quote data, pricing power is inferred from reputation and guides rather than observed market behavior.
    diligencePath: Solicit comparable bids from CertiK, Trail of Bits, OpenZeppelin, Quantstamp, and one low-cost alternative.
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: Pipeline win-rate, renewal, and attach-rate data by competitor and scope complexity.
    whyItMatters: Moat durability depends on actual conversion and expansion, not just public branding.
    diligencePath: Request CRM-based competitive-loss analysis and expansion cohorts.
  - type: conflicting-data
    severity: minor
    topic: incident-history
    missingEvidence: A normalized post-audit incident dataset with comparable definitions across firms.
    whyItMatters: Public lists often cherry-pick examples, so exploit-history comparisons can mislead.
    diligencePath: Reconstruct a common audit-vintage and incident methodology before ranking firms.
  - type: missing-source
    severity: minor
    topic: customer-concentration
    missingEvidence: Named enterprise or institutional customer overlaps among CertiK and the peer set.
    whyItMatters: Shared flagship accounts determine whether reference power is concentrated or diversified.
    diligencePath: Cross-reference public audit archives, testimonials, and sales references in diligence interviews.
