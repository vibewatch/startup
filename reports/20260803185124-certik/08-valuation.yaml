- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Revenue quality miss
    - Audited recurring revenue comes in materially below the public proxy or margins are too weak for premium multiples.
    - Would undermine the software-like valuation case at its foundation.
    - Re-underwrite using lower revenue and multiple bands.
  - - New trust controversy
    - Another high-profile dispute, exploit-linked backlash, or credibility event hits the brand.
    - Would weaken customer acquisition and public-market optionality simultaneously.
    - Pause or widen discount until impact is measurable.
  - - Down-round or structured financing
    - New capital is raised below the reference mark or with heavy preferences.
    - Would reset price support and change return math even if operations are stable.
    - Treat the last mark as stale and rebuild the cap-table model.
  - - Weak durability metrics
    - NRR, churn, or concentration data reveals fragile repeat economics.
    - Would show CertiK is more project-driven than platform-like.
    - Reduce target multiple and revisit recommendation.
  - - IPO-readiness gap persists
    - Disclosure quality and governance remain too thin despite public-market ambition.
    - Would limit exit pathways and reduce scarcity value.
    - Prefer private-discount underwriting and slower diligence cadence.
  notes: The kill criteria focus on evidence or events that would directly break the premium-multiple narrative, not on ordinary market volatility.
  claimRefs:
  - CV025
  - CV026
  - CV038
  - CV039
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited revenue and ARR bridge
    - Board-approved revenue, ARR, and services-versus-subscription mix.
    - Determines whether the last mark is inside a supportable revenue framework.
    - Request CFO pack or audited financial excerpt.
  - - Gross margin and cash profile
    - Gross margin, contribution margin, cash burn, and runway.
    - Separates premium software economics from premium narrative.
    - Request finance diligence packet.
  - - Retention and concentration
    - NRR, GRR, churn, top-10 customer share, and attach rates from audit to recurring products.
    - Determines durability and whether platform claims are real.
    - Request customer cohort tables and reference calls.
  - - Cap-table rights
    - Preferences, liquidation stack, option pool, pro rata rights, and side letters.
    - Return outcomes can diverge sharply from enterprise value if rights are heavy.
    - Request cap-table model and lead-investor term summaries.
  - - IPO readiness and governance
    - Audit preparedness, legal workstreams, internal controls, and board posture toward public markets.
    - Clarifies whether IPO talk is near-term optionality or distant positioning.
    - Request governance checklist and banker / counsel readiness assessment.
  notes: These asks are the minimum package required to convert a plausible range into an investable price.
