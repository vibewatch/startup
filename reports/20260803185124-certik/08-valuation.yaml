- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation read-through
  - Probability signal
  rows:
  - - Bull
    - Recurring revenue exceeds roughly $120M, enterprise/compliance mix rises, and trust remains stable while the IPO window stays open.
    - $1.8B-$3.0B support becomes credible using upper-end cyber multiples.
    - Possible, but it still requires proof beyond the current public package.
  - - Base
    - Revenue is near the current proxy, growth continues, but disclosure remains partial and investors apply a private-company discount.
    - $0.8B-$1.5B looks easier to defend than the full $2B headline mark.
    - Most supportable on public evidence today.
  - - Bear
    - Revenue base is smaller than the proxy implies or another trust event weakens growth and pricing power.
    - Sub-$1B support becomes plausible if both fundamentals and sentiment compress.
    - Cannot be dismissed because key underwriting metrics remain private.
