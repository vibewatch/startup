- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Core argument
  - What would strengthen it
  - What would weaken it
  rows:
  - - Thesis
    - CertiK can evolve from a respected audit brand into a recurring security, monitoring, and compliance platform for web3 and AI-agent workflows.
    - Audited recurring revenue, strong retention, and enterprise-mix evidence.
    - Proof that most revenue is still episodic audit work or that reputation keeps limiting upmarket conversion.
  - - Anti-thesis
    - The company may still be priced like a premium software platform without enough evidence that its revenue quality or durability deserves that treatment.
    - Evidence of weak renewals, lower-than-expected recurring revenue, or financing below the last mark.
    - Proof of durable recurring economics and cleaner rights visibility than the public record currently shows.
  notes: The valuation debate is less about whether CertiK has demand and more about how durable and software-like that demand really is.
