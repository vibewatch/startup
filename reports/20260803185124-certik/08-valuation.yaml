chapter:
  number: 8
  title: Valuation
  summary: CertiK's last public $2 billion mark is not absurd relative to premium cybersecurity multiples, but public evidence is still too thin on audited recurring revenue, margins, retention, and cap-table rights to accept that price uncritically; the right stance is research-more with entry discipline and explicit downside guardrails.
sections:
- id: valuation-context-and-price-support
  title: Valuation Context and Price Support
  body: 'CertiK is easier to price at the headline level than at the underwriting level. The headline story is clean: the last public priced round was the March 2022 Series B3 at $2 billion, later IPO reporting still repeats that mark, and secondary databases suggest the company has amassed a large funding base and broad customer/product reach. The underwriting problem is that the evidence under the headline remains thin. The only public recurring-revenue number in this corpus is a secondary ARR estimate, not audited management disclosure. That matters because even a plausible headline price can become fragile when investors cannot reconcile revenue quality, services-versus-subscription mix, gross margin, or retention. Public sources do show that CertiK has expanded beyond one-off audits into monitoring, compliance, and newer AI-security products, which keeps the upside case alive. But public activity such as the ventures fund or YZi grant program is better understood as ecosystem signal
    than as proof that the core operating business has re-priced upward since 2022. The right starting point is therefore to respect the $2 billion mark as real history while refusing to treat it as self-validating fair value in 2026.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
