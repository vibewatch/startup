  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-revenue-and-mix
    missingEvidence: Audited ARR or revenue, revenue bridge, services-versus-subscription mix, and gross-margin disclosure.
    whyItMatters: These metrics determine whether CertiK deserves a premium software multiple or a discounted services-heavy multiple.
    diligencePath: Request CFO-approved operating metrics and audited or reviewed financial statements.
  - type: private-evidence-only
    severity: material
    topic: cap-table-rights
    missingEvidence: Liquidation preferences, participation rights, option-pool size, anti-dilution provisions, and any structured financing features.
    whyItMatters: Enterprise value can overstate investor returns materially when private-company rights are heavy or uneven.
    diligencePath: Request cap-table model, financing documents, and lead-investor term summaries.
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, churn, top-customer concentration, and attach rates from audits into recurring products.
    whyItMatters: Without these data, the chapter cannot determine whether CertiK should be valued like a platform or a project-driven vendor.
    diligencePath: Request cohort tables, renewal dashboards, and customer reference calls.
  - type: missing-source
    severity: minor
    topic: ipo-readiness
    missingEvidence: Public evidence on internal-controls readiness, audited PCAOB workstreams, underwriting banks, or a concrete listing timeline.
    whyItMatters: IPO optionality is part of the bullish narrative, but it cannot be valued confidently without execution evidence.
    diligencePath: Request governance-readiness materials and legal / banker process updates.
