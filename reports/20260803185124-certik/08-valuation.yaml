- id: FV001
  title: Recommendation logic
  type: flow
  layout: wide
  summary: The recommendation flows from real market proof through disclosure gaps and finally into price discipline.
  data:
    nodes:
    - id: proof
      label: Real category proof
      detail: Funding history, customer proof, and product breadth indicate CertiK is a real scaled security vendor.
    - id: proxy
      label: Partial revenue proxy
      detail: Secondary ARR data provides a range anchor but not audited precision.
    - id: publicband
      label: Public cyber band
      detail: Public comps show that premium security multiples can be high, but only with transparency.
    - id: discount
      label: Opacity discount
      detail: Missing margin, retention, and cap-table data justify a private-company haircut.
    - id: risk
      label: Trust and execution risk
      detail: Reputational and disclosure setbacks can compress both financing and exit options.
    - id: call
      label: Research-more / entry discipline
      detail: Proceed only if evidence improves or pricing leaves room for uncertainty.
    edges:
    - from: proof
      to: proxy
      label: scale creates a range anchor
    - from: proxy
      to: publicband
      label: compare implied multiple
    - from: publicband
      to: discount
      label: adjust for opacity
    - from: discount
      to: call
      label: price discipline
    - from: risk
      to: call
      label: preserve downside guardrails
  approximationNotes: This flow is an underwriting sequence synthesized from chapter evidence, not a management process map.
