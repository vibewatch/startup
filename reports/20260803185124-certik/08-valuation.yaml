- id: exit-readiness-and-final-diligence
  title: Exit Readiness and Final Diligence
  body: 'The final valuation judgment is that CertiK is closer to “worth doing more work on” than to “ready for conviction pricing.” The company has enough market position and product breadth to plausibly reach the public market or attract strategic capital, but the public evidence is still behind the ambition. The biggest missing pieces are not exotic: audited revenue, recurring mix, margin profile, customer concentration, and cap-table rights. Those omissions directly affect both price support and investor returns. They also matter for IPO readiness, because public-market investors reward not just category leadership but disclosure quality and governance confidence. A future round below the $2 billion reference point, or a new trust controversy, would quickly challenge the premium narrative. Conversely, proof of strong recurring economics and cleaner rights visibility could justify paying more. Until then, the correct stance is conditional interest: advance if the diligence package closes
    the core gaps or if price compensates for them; pause if management insists that the 2022 headline mark should be accepted without updated proof.'
