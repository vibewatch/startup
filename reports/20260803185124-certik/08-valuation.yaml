- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation status
  - Why relevant
  - Main limitation
  rows:
  - - CrowdStrike
    - 2026 market cap vs 2026 revenue
    - ~42.9x sales
    - Premium cyber leader shows how far the public market will stretch for category winners.
    - Far larger, more diversified, and fully public.
  - - Palo Alto Networks
    - 2026 market cap vs 2025 revenue
    - ~30.7x sales
    - Large-platform reference for security breadth and strategic relevance.
    - Mature public company with audited financials and scale CertiK has not disclosed.
  - - CyberArk
    - 2026 market cap vs 2024 revenue
    - ~20.6x sales
    - Useful benchmark for a high-quality specialized security franchise.
    - Identity/security mix differs and disclosure quality is far better.
  - - Zscaler / SentinelOne
    - 2026 market cap vs 2025 revenue
    - ~8.3x-9.3x sales
    - Shows that even meaningful security software names can trade at much lower bands when growth or sentiment is less euphoric.
    - Public cloud-security models still differ from a private crypto-security mix.
  - - CertiK at last mark
    - 2022 $2B valuation vs ~$87M ARR proxy
    - ~23.0x implied sales
    - Helps frame whether the private mark sits inside or outside public cyber reference bands.
    - ARR is secondary and unaudited; cap-table rights are unknown.
  notes: These rows capture the main public reference points used in this chapter; they are a framing set, not a claim that the companies are directly comparable in every operational respect.
