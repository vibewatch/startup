    title: "Underwriting Discipline Mandates TRACK Over Speculative BUY"
    body: "While Corelight exhibits the hallmarks of a premier cybersecurity enterprise franchise—open-source community roots, adoption by elite incident response firms, and strategic backing from industry stalwarts—investing at an unconfirmed unicorn valuation without visibility into unit economics or cap table seniority poses asymmetric downside. Investors should maintain an active TRACK stance, conditioning any investment proposal on complete access to historical cohort retention, debt covenants, and audited GAAP financials."
