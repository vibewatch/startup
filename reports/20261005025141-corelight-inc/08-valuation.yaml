company:
  name: "Corelight, Inc."
chapter:
  number: 8
  title: "Valuation"
  summary: "Corelight demonstrates durable technical leadership and accelerating enterprise adoption in open NDR, anchored by its $150 million Series E round led by Accel with Cisco Investments and CrowdStrike Falcon Fund. However, because its post-money enterprise valuation and core SaaS financial metrics remain undisclosed private data, prudent investment discipline dictates a disciplined TRACK stance rather than BUY until comprehensive data room disclosures confirm unit economics and preference structures."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "Corelight's central investment thesis rests on its defensive technical moat as the commercial standard for the Zeek open-source network security monitoring platform. By translating raw wireline and cloud telemetry into structured, high-fidelity security evidence, Corelight provides critical network visibility for incident response and autonomous security operations. The platform's strategic relevance is evidenced by tier-one ecosystem backing: in April 2024, Corelight secured a $150 million Series E round led by initial capital partner Accel, featuring direct strategic participation from Cisco Investments and the CrowdStrike Falcon Fund. Furthermore, elite cybersecurity incident responders at Mandiant, CrowdStrike, and the Black Hat Network Operations Center rely on Corelight as their NDR platform of choice, creating powerful top-down enterprise credibility. At the time of the round, the company reported exceeding 40% year-over-year ARR growth and over 300% expansion in its AI and SaaS-driven detection solutions. Conversely, the anti-thesis centers on the complete lack of audited, publicly verifiable financial disclosures. Neither the exact post-money Series E valuation nor key operational SaaS metrics—such as annual recurring revenue (ARR), net revenue retention (NRR), gross margin percentage, or operating cash burn—are publicly reported. Enterprise valuation estimates circulating in secondary markets range widely between $1.0 billion and $1.5 billion, but these figures reflect analyst multiple inferences rather than confirmed transaction terms. Additionally, the presence of multiple equity rounds spanning Seed through Series E alongside institutional venture debt facilities creates an unverified liquidation preference stack and potential warrant overhang that could impair common and junior preferred returns in moderate exit scenarios."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV011"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV002"
  - id: "recommendation-and-valuation-discipline"
    title: "Recommendation Framework and Valuation Stance"
    body: "Evaluating Corelight within a price-sensitive investment framework yields a recommendation of TRACK with medium confidence, a high risk rating, and a valuation stance characterized as stretched. Corelight is undeniably an enterprise-grade technology franchise that solves acute SOC visibility constraints across hybrid and cloud infrastructures, actively protecting organizations that process over $1 billion in daily financial trades and defend 32 million utility consumers. Nevertheless, committing capital at an unverified $1.0B to $1.5B implied enterprise value without sight of audited gross margins, gross revenue retention, or the senior liquidation waterfall violates fundamental underwriting discipline. Third-party industry trackers estimate 2025 annualized revenue at approximately $98.2 million; applied against a $1.25 billion midpoint valuation mark, this implies a forward revenue multiple of approximately 12.7x. While premium multiples are justifiable for top-quartile pure-play cybersecurity platforms expanding at >40% annually, sustaining this multiple requires proof of >115% net revenue retention and efficient sales quota productivity. Candidate sentiment and employee feedback synthesized by industry platforms identify recurring friction regarding variable sales incentive reliability and inconsistent quota attainment, suggesting potential go-to-market friction in junior and mid-tier sales tiers. Upgrading this investment stance from TRACK to BUY requires full data room verification of audited subscription ARR, confirmed positive gross margins exceeding 70%, and clarity on cap table preference seniority."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV014"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenario-analysis-and-diligence-path"
    title: "Scenario Analysis, Exit Readiness, and Diligence Asks"
    body: "A three-case scenario model frames Corelight's potential risk-adjusted return distribution across a multi-year investment horizon. In the bull case, Corelight successfully leverages its generative AI innovations, Open NDR platform integrations with Cisco and CrowdStrike, and expanded enterprise footprint into a successful initial public offering (IPO) or marquee strategic acquisition by a platform consolidator like Cisco or Palo Alto Networks, commanding a valuation of $2.2 billion to $2.8 billion based on a 14.0x to 16.0x multiple on $160M+ mature ARR. In the base case, Corelight maintains steady 25% to 30% organic ARR growth within federal and Global 2000 accounts, reaching an orderly strategic exit or late-stage secondary recapitalization at $1.2 billion to $1.5 billion, representing 8.0x to 10.0x forward revenue. In the bear case, broader SIEM/XDR platform vendors commoditize standalone network telemetry, while macro IT budget tightening and quota execution challenges compress the realized multiple to 4.0x to 5.0x ARR, resulting in a down-round or structured recapitalization at $450 million to $600 million where junior equity suffers severe dilution or liquidation preference wipeouts. Diligence priorities prior to capital deployment must focus on five non-negotiable data room items: the fully diluted cap table with senior liquidation preferences and participation rights, the exact covenant package and interest terms on venture debt facilities, cohort-level net revenue retention and logo churn, customer concentration across federal government and financial services verticals, and audited GAAP financials."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV006"
      - "CV009"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV003"
