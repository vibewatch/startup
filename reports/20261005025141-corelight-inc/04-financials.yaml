company:
  name: "Corelight, Inc."
chapter:
  number: 4
  title: "Financials"
  summary: "Corelight operates an enterprise-grade open network detection and response (NDR) model driven by recurring software and sensor subscriptions, recording over 40% year-over-year ARR growth and 300% expansion in its AI and SaaS offerings for the fiscal year ending January 31, 2024. With $150 million in Series E funding secured in April 2024 and FedRAMP In Process status achieved in June 2026, the company possesses substantial balance-sheet liquidity, though private-company opacity leaves unit economics, gross margins, and net revenue retention unverified for institutional underwriting."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue Model, Pricing Mechanisms, and Delivery Streams"
    body: "Corelight monetizes its Open NDR platform through multi-tiered annual subscription contracts that blend software licenses, physical hardware appliances, and cloud-delivered software-as-a-service (SaaS) components [CI001]. The platform is engineered on the open-source Zeek network monitor and Suricata intrusion detection engine, coupling foundational telemetry parsing with proprietary threat-hunting and triage capabilities [CI002]. Customers deploy Corelight through three primary form factors: dedicated on-premises high-throughput hardware appliances scanning upwards of 100 gigabits per second, software virtual sensors operating across multi-cloud environments (AWS, Azure, and GCP), and the cloud-native Corelight Investigator analytics suite [CI001, CI002]. Pricing is structured primarily around monitored bandwidth throughput (gigabits per second or packets analyzed) and sensor counts, with additional subscription uplift for advanced behavioral analytics, machine learning detection models, and managed cloud fleet orchestration [CI001, CI007]. In federal and enterprise procurement, contracts are structured as multi-year term commitments, reinforced by specialized compliance certifications including FedRAMP In Process (Class C / Moderate) milestone status achieved in June 2026 [CI008]."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "commercial-traction-and-sales-efficiency"
    title: "Public Commercial Traction and Go-to-Market Proxies"
    body: "Because Corelight remains a venture-backed private enterprise, the company does not disclose audited GAAP statements, realized billings, or segment-level net retention rates [CI004, CI009]. However, verified corporate disclosures indicate robust top-line momentum: Corelight achieved more than 40% year-over-year growth in annual recurring revenue (ARR) and over 300% year-over-year growth in its AI- and SaaS-driven NDR solutions for its fiscal year ending January 31, 2024 [CI003, CI005]. Go-to-market (GTM) distribution is heavily amplified through platform alliances and strategic integrations with leading cybersecurity ecosystems, notably CrowdStrike, Cisco Investments, and Mandiant [CI005, CI006]. Corelight serves as an integrated NDR telemetry provider for CrowdStrike Falcon and Mandiant incident response engagements, providing an efficient co-selling and channel-referral pipeline that compresses enterprise sales cycles [CI005, CI006]. Independent secondary estimates from industry databases such as GetLatka project ARR at approximately $98.2 million based on a headcount base of over 400 personnel, though this benchmark remains an unverified third-party inference rather than an audited company filing [CI010]."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI003"
  - id: "cost-structure-and-capital-adequacy"
    title: "Cost Structure Drivers, Capital Adequacy, and Underwriting Verdict"
    body: "Corelight's underlying cost structure is governed by engineering headcount, hardware appliance manufacturing and logistics, cloud compute and bandwidth infrastructure across AWS, Azure, and GCP, and enterprise sales commissions [CI001, CI002]. Operating leverage depends upon shifting enterprise accounts from lower-margin physical hardware deployments toward high-margin cloud sensors and SaaS-based Investigator subscriptions [CI001, CI003]. From a balance sheet standpoint, Corelight's capital adequacy is anchored by its $150 million Series E financing closed on April 30, 2024, led by Accel with participation from strategic partners Cisco Investments and CrowdStrike Falcon Fund [CI005, CI006]. While this equity injection provides substantial runway to finance sales capacity, international expansion, and federal certification through 2026, external candidate and market evaluations highlight that absence of audited margins, opaque cash burn rates, and platform bundling by perimeter giants create underwriting risks that require direct data-room validation [CI004, CI009, CI011, CI012]."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI009"
      - "CI011"
      - "CI012"
