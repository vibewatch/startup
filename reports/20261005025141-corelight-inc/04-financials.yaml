    body: "Corelight's commercial go-to-market motion is uniquely reinforced by equity investments and commercial integration partnerships with cybersecurity incumbents Cisco Systems and CrowdStrike. By integrating open NDR telemetry directly into CrowdStrike Falcon and Cisco security architectures, Corelight benefits from co-selling motions and elite service deployments that dramatically reduce customer acquisition costs [CI005, CI006]."
