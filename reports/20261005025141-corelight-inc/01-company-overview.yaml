company:
  name: "Corelight, Inc."
chapter:
  number: 1
  title: "Company Overview"
  summary: "Corelight is a San Francisco-based, open-core network detection and response company commercializing technology rooted in the Zeek project. The assigned evidence confirms a $9.2 million Series A, a $150 million Series E, and current scale-up governance, but it does not establish cumulative funding, valuation, absolute revenue or ARR, customer count, or headcount."
sections:
  - id: "identity-and-business-model"
    title: "Identity, Origins, and Business Model"
    body: >-
      Corelight's commercial origin is the open-source Zeek network security project. Its
      company history says Vern Paxson, Robin Sommer, and Seth Hall formed a services
      business in 2013 after years of work on Zeek, then recruited Greg Bell as the model
      shifted toward an integrated product [CO001, CO002, CO004]. The company was
      incorporated in 2016, when the Corelight Sensor was launched, and current company
      materials describe it as a San Francisco-based open-core network detection and
      response business [CO003]. Its product proposition is to convert network and cloud
      activity into evidence for threat hunting, incident response, visibility, and
      analytics. The platform combines Zeek and Suricata-derived insights with proprietary
      collection, packet-capture, machine-learning, and search capabilities across virtual,
      software, cloud, and physical sensors [CO005].
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"

  - id: "leadership-and-governance"
    title: "Leadership, Governance, and Key-Person Exposure"
    body: >-
      Brian Dye is the current chief executive officer: Corelight's May 2026 announcement
      identifies him as CEO, while the 2020 transition announcement records his appointment
      from chief product officer to CEO and the board [CO007]. That 2020 transition also
      moved co-founder and former CEO Greg Bell to chief strategy officer and appointed
      Michele Bettencourt executive chairperson; the assigned evidence does not reconfirm
      those two roles as current in 2026 [CO009]. Governance was supplemented in May 2026
      by former Barracuda Networks CEO Hatem Naguib as a director and Tenable co-founder
      Jack Huffard as an advisor [CO008]. The founder lineage supplies unusual technical
      credibility, but the public evidence does not provide a complete current executive
      roster, board composition, committee structure, or succession plan. Diligence should
      therefore distinguish verified current roles from historical appointments rather
      than assume continuity [CO002, CO007, CO008, CO009].
    claimRefs:
      - "CO002"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"

  - id: "capital-and-scale"
    title: "Funding, Investors, and Observable Scale"
    body: >-
      The public capital record in the assigned evidence is incomplete but establishes two
      anchor rounds. Corelight says Accel led a $9.2 million Series A in 2017, and a
      company-issued April 2024 release says Accel led a $150 million Series E with Cisco
      Investments and CrowdStrike Falcon Fund participating [CO010, CO011]. The 2020
      company release also identifies Accel, General Catalyst, Insight Partners, and Osage
      University Partners as investment supporters [CO016]. These disclosures do not
      establish cumulative funding because intervening round sizes and instruments are not
      supplied. The Series E release reported more than 40% year-over-year ARR growth and
      300% year-over-year growth in AI- and SaaS-driven NDR solutions, but those are
      company-reported growth rates, not absolute ARR, GAAP revenue, or cash availability
      [CO012]. Official materials identify Global 2000 companies, government agencies,
      research universities, and operations across more than fifteen countries, yet do not
      disclose a customer count [CO013].
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO016"
    tableRefs:
      - "TO003"

  - id: "evidence-boundaries"
    title: "Evidence Boundaries and Diligence Priorities"
    body: >-
      The retained evidence does not support a current valuation, cumulative capital raised,
      debt balance, absolute revenue or ARR, customer count, or workforce count [CO014].
      A MarketResearch landing page says its paid report contains private-company sales and
      employee estimates and explains that such figures vary by source, but the fetched
      public text presents methodology rather than Corelight values; treating that page as
      a numeric datapoint would be unjustified [CO014]. Corelight describes a geographically
      distributed team and publishes diversity-oriented recruiting language, but neither
      retained page supplies headcount or an office list [CO006]. The only adverse signal
      in the assigned evidence is a Built In summary describing inconsistent quota
      attainment and perceived pay-alignment concerns. Built In explicitly says the summary
      is AI-generated and not verified internal data, so it is a low-confidence workforce
      lead, not proof of a broad operational problem [CO015]. The adverse search returned
      no retained result; that absence is not evidence that litigation, breaches, outages,
      or regulatory matters do not exist.
    claimRefs:
      - "CO006"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"

