callouts:
  - calloutType: "strength"
    title: "Technical lineage is unusually durable"
    body: "Corelight's commercial platform inherits a long-lived open-source network-monitoring base and extends it with integrated sensors and proprietary capabilities. That lineage may reduce category-education risk, but product differentiation and open-source governance still require separate technical diligence."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO004"
      - "CO005"

  - calloutType: "risk"
    title: "Headline growth cannot substitute for absolute economics"
    body: "The Series E announcement supplies growth percentages and investor names but not absolute ARR, revenue, margins, cash, valuation, debt, or capitalization terms. Investment underwriting should keep those fields null until company records close the gaps."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO014"

