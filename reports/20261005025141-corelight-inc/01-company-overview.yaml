  evidenceGaps:
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "governance"
      missingEvidence: "A current complete executive roster, board roster, committee assignments, succession plan, and confirmation of roles announced in 2020."
      whyItMatters: "Without a current governance roster, key-person concentration, oversight independence, and succession readiness cannot be assessed."
      diligencePath: "Request the current organization chart, board list, committee charters, biographies, and succession materials from the company data room."
      relatedQuestionRefs:
        - "QO003"
      relatedTableRefs:
        - "TO002"

    - type: "private-evidence-only"
      severity: "material"
      topic: "capitalization"
      missingEvidence: "A complete financing history, fully diluted capitalization table, post-money valuation, liquidation preferences, debt schedule, and investor rights."
      whyItMatters: "The disclosed Series A and Series E do not establish total capital raised, dilution, control, preference seniority, or cash available."
      diligencePath: "Obtain the capitalization table, certificates of incorporation, financing documents, debt agreements, and board approvals."
      relatedQuestionRefs:
        - "QO004"
        - "QO007"
        - "QO010"
      relatedTableRefs:
        - "TO001"
        - "TO003"

    - type: "private-evidence-only"
      severity: "material"
      topic: "private-metrics"
      missingEvidence: "Audited revenue, absolute ARR, growth bridge, customer count, retention, headcount, cash balance, and operating locations."
      whyItMatters: "Growth percentages and customer descriptors cannot establish present scale, unit economics, retention, or runway."
      diligencePath: "Request audited financials, ARR and retention schedules, customer cohorts, payroll roster, cash statements, and legal-entity location lists."
      relatedQuestionRefs:
