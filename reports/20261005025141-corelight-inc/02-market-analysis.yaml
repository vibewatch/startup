callouts:
  - calloutType: "insight"
    title: "The Strategic Boundary of Open-Source NDR"
    body: "Corelight's addressable opportunity relies on transforming the pervasive adoption of open-source Zeek into commercial enterprise subscriptions. Because Zeek is already widely deployed across sophisticated government and academic networks, Corelight can target organizations that have outgrown community maintenance but require vendor-backed performance and turnkey SIEM integration."
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM009"
  - calloutType: "risk"
    title: "Procurement Complexity and Sales Execution Friction"
    body: "Despite high enterprise demand for network visibility, Corelight faces operational constraints rooted in hardware appliance logistics, high-line-speed network integration, and variable quota attainment. Enterprise sales cycles can stretch past 12 months, creating revenue lumpiness that challenges private valuation multiples."
    claimRefs:
      - "CM010"
      - "CM015"
      - "CM016"
