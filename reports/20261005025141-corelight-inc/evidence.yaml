evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      A current complete executive roster, board roster, committee assignments, succession plan, and confirmation of
      roles announced in 2020.
    whyItMatters: >-
      Without a current governance roster, key-person concentration, oversight independence, and succession readiness
      cannot be assessed.
    diligencePath: >-
      Request the current organization chart, board list, committee charters, biographies, and succession materials from
      the company data room.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      A complete financing history, fully diluted capitalization table, post-money valuation, liquidation preferences,
      debt schedule, and investor rights.
    whyItMatters: >-
      The disclosed Series A and Series E do not establish total capital raised, dilution, control, preference
      seniority, or cash available.
    diligencePath: >-
      Obtain the capitalization table, certificates of incorporation, financing documents, debt agreements, and board
      approvals.
    relatedQuestionRefs:
      - QO004
      - QO007
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: private-metrics
    missingEvidence: >-
      Audited revenue, absolute ARR, growth bridge, customer count, retention, headcount, cash balance, and operating
      locations.
    whyItMatters: Growth percentages and customer descriptors cannot establish present scale, unit economics, retention, or runway.
    diligencePath: >-
      Request audited financials, ARR and retention schedules, customer cohorts, payroll roster, cash statements, and
      legal-entity location lists.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent legal, regulatory, outage, breach, and verified workforce records sufficient to assess adverse-event
      history.
    whyItMatters: An empty retained adverse-search result cannot establish that no incident, dispute, or control failure exists.
    diligencePath: >-
      Review litigation and regulatory databases, incident disclosures, customer references, insurer loss runs, and
      verified employee data.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: arr-breakdown-and-sam
    missingEvidence: >-
      Audited financial statements detailing Corelight's net ARR, software subscription versus hardware revenue split,
      and customer renewal rates.
    whyItMatters: >-
      External sizing relies on disparate third-party models ($10M-$100M IncFact vs $98.2M GetLatka) that cannot isolate
      precise market share.
    diligencePath: >-
      Request confidential GAAP revenue breakdown, customer cohort retention metrics, and ARR waterfall from company
      management data room.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-discounting
    missingEvidence: >-
      Specific list prices per Gbps or sensor appliance model, along with standard enterprise discount schedules and
      multi-year contract caps.
    whyItMatters: >-
      Direct commercial comparisons against proprietary vendors (Darktrace, Vectra) require precise TCO modeling rather
      than qualitative tier descriptions.
    diligencePath: >-
      Request customer procurement schedules, price books, and sample master services agreements during private data
      room diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-margins
    missingEvidence: >-
      Audited GAAP income statements, cash flow statements, and gross margin schedules separating SaaS software from
      hardware appliance manufacturing.
    whyItMatters: >-
      Essential for verifying underlying unit economics, gross margin expansion, and true cash burn rate ahead of
      underwriting.
    diligencePath: >-
      Request company financial model, historical audited financial statements, and COGS accounting breakdown from the
      data room.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion-cohorts
    missingEvidence: >-
      Net revenue retention (NRR), gross revenue retention (GRR), and customer renewal cohort schedules by customer
      tier.
    whyItMatters: >-
      Determines whether top-line ARR growth is sustained by organic expansion within existing accounts or solely
      reliant on new customer acquisition.
    diligencePath: Request cohort-based expansion analysis and historical churn schedules across enterprise and government segments.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: minor
    topic: debt-facilities-and-liquidation-stack
    missingEvidence: >-
      Detailed terms of any outstanding credit facilities or venture debt, plus preferred equity liquidation preferences
      across series.
    whyItMatters: >-
      Clarifies senior debt covenants, interest expense burdens, and downside structural protection for common equity
      holders.
    diligencePath: Review certificate of incorporation, loan agreements, and cap table ledger in the company data room.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cloud-throughput-benchmarks
    missingEvidence: >-
      Audited third-party throughput and packet drop benchmarks for Corelight virtual and cloud-native sensors in AWS,
      Azure, and GCP under 40Gbps+ burst loads.
    whyItMatters: >-
      Enterprise cloud migrations introduce packet mirroring latency and vCPU overhead that may diverge significantly
      from physical appliance FPGA throughput.
    diligencePath: >-
      Request customer proof-of-concept benchmark logs and cloud cost impact statements directly from the company data
      room.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: private-evidence-only
    severity: minor
    topic: proprietary-detection-accuracy
    missingEvidence: >-
      False positive and detection efficacy rates for Corelight's proprietary machine learning algorithms vs open-source
      Suricata signature rules.
    whyItMatters: >-
      Understanding the incremental value of proprietary behavioral detection beyond open-source rules is necessary to
      evaluate software pricing premiums.
    diligencePath: Conduct technical evaluation using synthetic adversary emulation traffic across isolated test networks.
    relatedQuestionRefs:
      - QE005
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: Audited net revenue retention (NRR), gross revenue retention (GRR), logo churn, and cohort expansion curves.
    whyItMatters: >-
      Without disclosed NRR/GRR metrics, the durability of Corelight's enterprise land-and-expand model cannot be
      verified independently.
    diligencePath: >-
      Request customer cohort retention schedules and annual churn reports directly from company management during
      confidential data room review.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: Comprehensive listing of production enterprise reference customers and contract values across commercial sectors.
    whyItMatters: >-
      Most enterprise defense, intelligence, and financial customers are bound by non-disclosure agreements, leaving
      public customer proof limited to a small sample of referenceable accounts.
    diligencePath: Obtain blinded reference calls or customer attribution lists across key vertical deployments in data room review.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive non-public litigation docket, state regulatory inquiry filings, and executed international customer
      Data Processing Agreements.
    whyItMatters: >-
      Public records establish baseline Delaware incorporation and privacy notices, but cannot definitively prove the
      complete absence of confidential commercial disputes or GDPR cross-border transfer challenges.
    diligencePath: >-
      Request legal disclosure schedule, outstanding demand letters, and sample EU customer DPAs during data room
      review.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: thesis-break-metrics
    missingEvidence: >-
      Audited gross churn, net retention rate (NRR), and annualized net cash burn metrics broken down by customer tier
      and deployment modality.
    whyItMatters: >-
      Without verifiable retention cohorts and cash burn schedules, investors cannot monitor quantitative thresholds
      that would trigger an immediate investment thesis break.
    diligencePath: Obtain audited GAAP financial statements and customer cohort retention schedules from management.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: blocking
    topic: valuation-gaps
    missingEvidence: >-
      Audited post-money enterprise valuation and complete capitalization table showing senior liquidation preferences
      from Seed through Series E.
    whyItMatters: >-
      Without exact valuation and preference stack data, underwriting potential returns and common share dilution is
      purely speculative.
    diligencePath: >-
      Review the company's confidential information memorandum (CIM), amended certificate of incorporation, and
      capitalization ledger in the secure data room.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
  - type: missing-source
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited GAAP financial statements disclosing actual subscription ARR, gross margins, CAC payback, and operating
      cash burn.
    whyItMatters: >-
      Third-party estimates like GetLatka ($98.2M) cannot substitute for audited revenue when establishing entry
      valuation multiples.
    diligencePath: >-
      Request two years of audited financial statements and quarterly board reporting packages from CFO and finance
      leadership.
    relatedQuestionRefs:
      - QV008
      - QV009
    relatedTableRefs:
      - TV003
  - type: private-evidence-only
    severity: material
    topic: debt-overhang
    missingEvidence: >-
      Executed loan and security agreement for venture debt facilities, specifying maturity schedule, financial
      covenants, and warrant rights.
    whyItMatters: >-
      Senior secured debt can impose stringent cash covenants or encumber IP assets, creating downside structural risk
      for equity holders.
    diligencePath: Examine credit agreements, UCC lien filings, and compliance certificates in legal diligence.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
  - type: private-evidence-only
    severity: material
    topic: retention-gaps
    missingEvidence: >-
      Customer cohort net revenue retention (NRR), gross retention (GRR), and logo churn data segmented by enterprise
      and public sector accounts.
    whyItMatters: Sustaining a premium valuation multiple requires quantitative verification of customer expansion dynamics.
    diligencePath: >-
      Analyze historical customer-level ARR waterfalls and subscription renewal contracts during commercial due
      diligence.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV002
