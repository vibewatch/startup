        title: Funding, Investors, and Observable Scale
        blocks:
          - type: paragraph
            body: >-
              The public capital record in the assigned evidence is incomplete but establishes two anchor rounds.
              Corelight says Accel led a $9.2 million Series A in 2017, and a company-issued April 2024 release says
              Accel led a $150 million Series E with Cisco Investments and CrowdStrike Falcon Fund participating [CO010,
