      - number: '6.3'
        title: Retention Dynamics, Expansion Friction, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              Corelight's commercial expansion strategy relies on a land-and-expand model wherein initial sensor
              deployments at key network chokepoints broaden into enterprise-wide sensor coverage, cloud traffic
              mirroring, and SaaS-driven investigative workflows. In 2024, the company claimed over 40% year-over-year
              ARR growth alongside 300% growth in its SaaS and AI-driven NDR revenue solutions. In March 2026, Corelight
              expanded monetizable software add-ons by launching Corelight Threat Intelligence powered by CrowdStrike.
              Despite these expansion vectors, Corelight's net revenue retention (NRR), gross revenue retention (GRR),
              and logo churn rates remain undisclosed private metrics. Significant adverse commercial signals emerge
              from practitioner and workforce feedback: sales incentive pay is characterized as volatile and
              inconsistent, with account executives facing steep quota attainment hurdles despite high $300,000
              on-target earnings (OTE) compensation packages. This variable compensation friction suggests commercial
              procurement friction and uneven sales execution when expanding outside established enterprise Zeek
              champions.
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Elite Ecosystem Validation
            body: >-
              Adoption of Corelight Open NDR by premier incident response providers—including CrowdStrike Services,
              Mandiant, and the Black Hat NOC—serves as definitive operational proof of network forensic depth and data
              fidelity during live breach investigations.
            calloutType: strength
            claimRefs:
