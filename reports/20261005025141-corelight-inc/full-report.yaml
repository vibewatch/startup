  - id: FE001
    title: Corelight Open NDR Platform Architecture Stack
    type: stack
    summary: >-
      Five-tier architectural stack illustrating data flow from network packet capture to downstream security operations
      workflows.
    data:
      layers:
        - label: Data Ingestion & Capture Layer
          detail: >-
            Physical TAPs, switch SPAN/mirror ports, and cloud VPC traffic mirroring feeding into hardware-accelerated
            NICs
        - label: Protocol Parsing & Flow Shunting Layer
          detail: >-
            Optimized Zeek engine parsing 35+ network protocols with dynamic FPGA flow shunting for uninteresting
            encrypted flows
        - label: Hybrid Detection & Intelligence Engine
          detail: >-
            Embedded Suricata signature analysis, proprietary ML behavioral detection, and CrowdStrike Falcon X IOC
            correlation
        - label: Evidence Transformation & Filtering Layer
          detail: >-
            Automated file deduplication, Elastic Common Schema (ECS) normalization, and traffic filtering to reduce
            export volumes
        - label: Streaming Export & Workflow Integration
          detail: >-
            High-throughput streaming into Kafka, Splunk, Elastic/Humio, CrowdStrike Falcon, and cloud SIEM/data lake
            repositories
        - label: Downstream Analytics & Incident Response
          detail: >-
            Investigation consoles, SOC triage, automated playbooks, and historical forensic exploration across SIEM/XDR
            tiers
    approximationNotes: >-
      Represents conceptual logical architecture derived from technical documentation and joint technology partner
      specifications.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    summary: >-
      Illustrates the typical enterprise lifecycle from open-source Zeek evaluation to multi-cloud NDR expansion and
      threat intelligence upsells.
    data:
      items:
        - label: 'Phase 1: Open-Source Discovery'
          stage: Open-Source Discovery
          user: Security Analyst / Threat Hunter
          action: Deploy open-source Zeek sensors on tap or span ports to inspect raw protocols
          touchpoints:
            - Open-source community forums
            - Zeek GitHub repositories
          painPoints: High engineering overhead, complex maintenance, and lack of turnkey commercial detections
        - label: 'Phase 2: Pilot & Technical Validation'
          stage: Pilot & Technical Validation
          user: SOC Lead / Security Architect
          action: Deploy Corelight physical or virtual sensor appliances on high-throughput network cores
          touchpoints:
            - Guided proof-of-concept
            - SIEM integration testing
          painPoints: Span/tap availability, procurement friction, and justifying hardware sensor capex
        - label: 'Phase 3: Enterprise Production Rollout'
          stage: Enterprise Production Rollout
          user: CISO / SOC Director
          action: Integrate Corelight telemetry across on-prem data centers and cloud VPCs into central SIEM
          touchpoints:
            - Enterprise Support SLAs
            - Dedicated Technical Account Manager
          painPoints: Multi-year budget approvals and establishing SIEM ingest cost containment filters
        - label: 'Phase 4: Multi-Cloud Sensor Scaling'
          stage: Multi-Cloud Sensor Scaling
          user: Cloud Security Architect
          action: Expand sensor fleet across AWS, Azure, and GCP environments via native virtual traffic mirroring
          touchpoints:
            - Cloud VPC mirroring configurations
            - Centralized sensor fleet management
          painPoints: Cross-cloud routing complexity and egress bandwidth costs
        - label: 'Phase 5: Managed Threat Hunting'
          stage: Managed Threat Hunting
          user: SOC Lead / Tier-2 Analyst
          action: Augment in-house SOC with 24/7 Managed NDR threat hunting and pre-configured response playbooks
          touchpoints:
            - Managed NDR service console
            - Proactive incident escalations
          painPoints: Integrating third-party triage recommendations into internal ticketing queues
        - label: 'Phase 6: Threat Intelligence & AI Upsell'
          stage: Threat Intelligence & AI Upsell
          user: Incident Response Team / Threat Hunter
          action: Expand into Corelight Investigator SaaS, SmartPCAP, and CrowdStrike Threat Intelligence
          touchpoints:
            - Corelight Threat Intelligence
            - SmartPCAP packet capture
          painPoints: Sales incentive volatility and quota misalignment during software expansion cycles
    claimRefs:
      - CU003
      - CU007
      - CU009
      - CU010
