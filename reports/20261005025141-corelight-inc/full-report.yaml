            body: >-
              While strategic backing from Cisco Investments and CrowdStrike Falcon Fund validates Corelight's Open NDR
              architecture, both partners maintain substantial internal security telemetry stacks, creating long-term
              channel friction and co-opetition risk if partner roadmaps prioritize native telemetry.
