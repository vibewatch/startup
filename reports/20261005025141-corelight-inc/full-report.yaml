      - number: '6.2'
        title: Adoption Trajectory and Named Customer Proof
        blocks:
          - type: paragraph
            body: >-
              Adoption of Corelight Open NDR has expanded from core open-source Zeek deployments in government research
              into commercial enterprise SOCs and managed response ecosystems. In enterprise production, global retail
              giant Carrefour deployed Corelight across its network of physical stores, corporate headquarters,
              multi-cloud clusters, and external partner connections. The deployment eliminated network visibility blind
              spots in environments where endpoint detection and response (EDR) agents could not be installed, enabling
              proactive threat hunting and custom detection engineering in their centralized SIEM. Furthermore, elite
              cybersecurity incident response and services teams—including CrowdStrike Services, Mandiant, and the Black
              Hat Network Operations Center (NOC)—rely on Corelight as their preferred network detection and response
              technology for mission-critical digital forensics. Independent practitioner reviews collected via Gartner
              Peer Insights corroborate high satisfaction across healthcare, manufacturing, and government deployments,
              emphasizing robust line-speed throughput and rapid alert triage. Nevertheless, verified named enterprise
              case studies remain sparse outside selective marketing releases, leaving broader pilot-to-production
              conversion rates unverified.
            claimRefs:
