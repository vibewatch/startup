              - CO013
              - CO014
      - number: '1.2'
        title: Leadership, Governance, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Brian Dye is the current chief executive officer: Corelight's May 2026 announcement identifies him as CEO,
              while the 2020 transition announcement records his appointment from chief product officer to CEO and the
              board [CO007]. That 2020 transition also moved co-founder and former CEO Greg Bell to chief strategy
              officer and appointed Michele Bettencourt executive chairperson; the assigned evidence does not reconfirm
              those two roles as current in 2026 [CO009]. Governance was supplemented in May 2026 by former Barracuda
              Networks CEO Hatem Naguib as a director and Tenable co-founder Jack Huffard as an advisor [CO008]. The
              founder lineage supplies unusual technical credibility, but the public evidence does not provide a
              complete current executive roster, board composition, committee structure, or succession plan. Diligence
              should therefore distinguish verified current roles from historical appointments rather than assume
              continuity [CO002, CO007, CO008, CO009].
            claimRefs:
