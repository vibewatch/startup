chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origins, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Corelight's commercial origin is the open-source Zeek network security project. Its company history says
              Vern Paxson, Robin Sommer, and Seth Hall formed a services business in 2013 after years of work on Zeek,
              then recruited Greg Bell as the model shifted toward an integrated product [CO001, CO002, CO004]. The
              company was incorporated in 2016, when the Corelight Sensor was launched, and current company materials
              describe it as a San Francisco-based open-core network detection and response business [CO003]. Its
              product proposition is to convert network and cloud activity into evidence for threat hunting, incident
              response, visibility, and analytics. The platform combines Zeek and Suricata-derived insights with
              proprietary collection, packet-capture, machine-learning, and search capabilities across virtual,
              software, cloud, and physical sensors [CO005].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO005
