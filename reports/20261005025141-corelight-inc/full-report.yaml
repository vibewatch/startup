  - id: TE002
    title: SOC Workflow and Use-Case Integration Table
    columns:
      - User Job
      - Legacy / Default Workflow
      - Corelight Solution
      - Measurable Operational Benefit
      - Technical Limitation / Boundary
    rows:
      - - Incident Investigation & Triage
        - Pivoting across disparate alert consoles; manual packet capture assembly in Wireshark
        - Suricata alerts correlated and embedded directly into structured Zeek session logs
        - Drastic reduction in alert fatigue and faster mean time to identify root causes
        - Does not replace endpoint process inspection or kernel memory forensics
      - - High-Speed Wire Threat Detection
        - Snort/Suricata on commodity servers suffering packet drops exceeding 20% at 10 Gbps
        - Hardware-optimized sensor pipeline processing 30,000 CPS at 16 Gbps with <0.05% packet loss
        - Elimination of blind spots and dropped intrusions during burst network traffic
        - Requires dedicated high-throughput network tapping and switch port mirroring
      - - SIEM Cost & Ingestion Management
        - Dumping unparsed raw PCAP or verbose logging into SIEMs, driving up indexing licensing fees
        - Content filtering and selective flow shunting to eliminate 20%+ of non-security traffic before export
        - Reduces daily SIEM indexing volume while preserving rich DNS/TLS handshake metadata
        - Aggressive filtering policies risk dropping low-and-slow anomalous telemetry if misconfigured
      - - Ecosystem Threat Hunting
        - Manual querying of external threat intelligence feeds and retroactive log searches
        - Native ingestion of CrowdStrike Falcon X IOCs directly into live network stream inspection
        - Real-time threat matching on active wire sessions without waiting for periodic SIEM batch queries
        - Limited to supported IOC types (domains, IPs, hashes) and active platform integrations
    notes: >-
      Workflow comparison based on Department of Defense proof-of-concept testing and joint CrowdStrike technical
      integration specifications.
    claimRefs:
      - CE003
      - CE004
      - CE007
      - CE008
      - CE011
  - id: TE003
    title: Technology and Operating Architecture Evaluation Table
    columns:
      - Architecture Layer
      - Component / Technology
      - Functional Role
      - Core Dependency
      - Technical Risk / Vulnerability
    rows:
      - - Packet Ingestion Layer
        - Network TAP / SPAN & Accelerated NIC
        - Captures raw wire traffic from 1G to 40G interfaces without disrupting production routing
        - Network switch mirroring and physical/virtual network tap infrastructure
        - Packet dropping under extreme burst conditions if hardware buffer sizing is exceeded
      - - Protocol Analysis Engine
        - Optimized Zeek (Bro) Core Runtime
        - Parses multi-protocol traffic (DNS, HTTP, TLS, SSH) into structured connection records
        - Open-source Zeek codebase maintenance and parser updates
        - Zero-day protocol parser bugs or memory vulnerabilities exposed to malformed network packets
      - - Intrusion Detection Engine
        - Integrated Suricata IDS
        - Executes signature rulesets against packet streams and correlates alerts with Zeek flows
        - Regular rule updates and threat signature feeds
        - Signature bypass via protocol evasion techniques or encrypted payload inspection limits
      - - Performance Optimization Layer
        - Flow Shunting & Hardware FPGA
        - Bypasses inspection of verified high-volume encrypted sessions after initial TLS handshake
        - FPGA NIC firmware and hardware flow-tracking tables
        - Malicious command-and-control covert channels hidden within shunted high-volume connections
      - - Data Export & Pipeline Layer
        - Streaming Exporters (Kafka, Splunk, Elastic)
        - Encapsulates logs into JSON/ECS and streams via TCP/TLS to central analytics tiers
        - Downstream message broker availability and enterprise network bandwidth
        - Backpressure and sensor disk buffer exhaustion if downstream log collectors experience outages
    notes: >-
      Evaluates architectural layers, dependencies, and operational risks documented across Corelight technical
      documentation and DoD pilot reports.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE009
      - CE012
