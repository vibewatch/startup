  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Overview and SOC Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Corelight provides an enterprise network detection and response (NDR) solution built upon open-core
              telemetry architectures, primarily Zeek (formerly Bro) and the Suricata intrusion detection engine. Rather
              than acting as a closed detection silo, Corelight sensors analyze live traffic across on-premises data
              centers, private clouds, and multi-cloud environments, parsing packet flows into high-fidelity behavioral
              logs and extracted file artifacts. In operational customer workflows, security operations center (SOC)
              analysts and threat hunters face severe alert fatigue caused by disparate, uncontextualized indicators.
              Corelight addresses this operational bottleneck by embedding Suricata signature alerts and
              machine-learning anomaly detections directly into comprehensive Zeek network evidence. Telemetry,
              extracted files, and flow indicators are natively streamed into downstream enterprise SIEM, data lake, and
              XDR platforms such as Splunk, Elastic, Kafka, and CrowdStrike Falcon. This open-architecture integration
              model allows incident responders to pivot seamlessly from atomic alerts to complete multi-protocol session
              context, significantly accelerating mean time to triage and investigation.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE008
              - CE011
      - number: '5.2'
        title: Operating Architecture and Hardware/Software Sensor Performance
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator between Corelight and raw open-source Zeek deployments lies in
              enterprise sensor engineering, hardware acceleration, and data volume management. Open-source Zeek running
              on commodity server hardware typically bottlenecks at 3 to 4 Gbps throughput, dropping up to 25% of
              packets under high-connection-per-second load, and repeatedly writes duplicate extracted files to local
              storage. Corelight sensors employ optimized packet capture pipelines with hardware-accelerated NICs and
              specialized flow processing capable of sustaining 10 Gbps to 25+ Gbps line-rate analysis. To conserve
              expensive downstream analytical license capacity and network bandwidth, Corelight incorporates advanced
              traffic filtering and dynamic flow shunting. Flow shunting inspects initial connection establishment and
              clear-text handshake metadata—such as TLS negotiation parameters—and then selectively bypasses high-volume
              encrypted byte streams while continuing to log session duration and packet counters. Independent
              evaluations conducted for the U.S. Department of Defense demonstrated that Corelight physical appliances
              sustained 30,000 connections per second at 16 Gbps throughput with packet loss remaining below 0.05%,
              delivering an average ingestion rate of 1.8 TB of Zeek logs daily into enterprise search tiers.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
