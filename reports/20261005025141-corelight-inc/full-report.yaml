      - number: '7.2'
        title: Operational Reliability, AI Governance, and Talent Retention
        blocks:
          - type: paragraph
            body: >-
              Operational efficacy in network detection and response requires sustained high-throughput packet
              processing without packet loss, latency spikes, or appliance failure under saturated enterprise line-rate
              conditions. Corelight mitigates packet inspection bottlenecks by deploying hybrid on-premise hardware
              sensors alongside cloud-native analyzers, supported by machine learning models spanning Random Forest,
              Convolutional Neural Networks, and clustering architectures. As generative AI workflows expand across
              Security Operations Centers (SOCs), Corelight has implemented strict model governance safeguards: the
              company commits that proprietary customer data is never transmitted to third-party large language models
              without customer authorization, and internal machine learning models are never trained using customer
              telemetry. On the organizational execution front, candidate and workforce feedback reveals potential
              operational friction within the sales organization. Account executives operate under high-variable
              compensation packages, with reported $150,000 base salaries and $300,000 on-target earnings, where
              inconsistent quota attainment and incentive volatility create turnover risks that could disrupt enterprise
              expansion.
            claimRefs:
