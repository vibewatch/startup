          - type: callout
            title: Sales Quota and Incentive Volatility
            body: >-
              Practitioner and employee compensation analyses indicate that high on-target earnings structures ($300k
              OTE) face inconsistent quota attainment in the field, signaling potential procurement drag, long sales
              cycles, or uneven enterprise expansion outside early-adopter Zeek accounts.
            calloutType: risk
            claimRefs:
