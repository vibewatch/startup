      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Leverage of the Open NDR Paradigm
            body: >-
              Corelight's primary product differentiation stems from its open-core heritage with Zeek and Suricata. By
              embracing an open telemetry standard rather than forcing proprietary data schemas, Corelight embeds itself
              into heterogeneous enterprise SOC architectures. This approach allows enterprise defenders to bring their
              own analytical backends—such as Splunk, Elastic, or CrowdStrike Falcon—avoiding vendor lock-in while
              leveraging community-developed detection packages.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
          - type: callout
            title: Operational Friction and Downstream Cost Considerations
            body: >-
              While Corelight appliances deliver robust wire-speed packet analysis, organizations face substantial
              ancillary costs. Enterprise NDR requires pervasive physical and cloud packet tap infrastructure.
              Furthermore, if advanced filtering policies are misconfigured, high-velocity Zeek log exports can create
              massive downstream SIEM indexing cost overruns or strain message bus infrastructure during sustained
              attack bursts.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Corelight categorizes its customer base into three primary enterprise segments: Fortune 500 global
              corporations, sovereign government defense and civilian agencies, and large higher-education and research
              institutions. The platform's commercial appeal centers on security operations centers (SOCs) and incident
              response (IR) teams facing advanced persistent threats across hybrid multi-cloud infrastructure. Buyers
              are typically Chief Information Security Officers (CISOs), Directors of Information Security, and SOC
              Managers seeking forensic-grade network evidence that survives endpoint tampering and bypasses host
              logging limitations. The technical users are threat hunters, security engineers, and tier-2/tier-3 SOC
              analysts who leverage structured Zeek telemetry and Suricata intrusion detection signatures to identify
              adversarial lateral movement and command-and-control communications. Despite enterprise traction,
              Corelight does not disclose audited customer counts, customer logo breakdowns, or annual recurring revenue
              (ARR) cohort distributions, creating an analytical gap regarding customer concentration and long-term
              durability across non-tier-one enterprises.
            claimRefs:
              - CU001
              - CU002
              - CU004
