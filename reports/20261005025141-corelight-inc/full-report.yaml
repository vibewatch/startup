      - number: '7.4'
        title: Financial Durability, Valuation Overhang, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              From a capitalization perspective, Corelight's $150 million Series E round in April 2024 provided
              substantial operational runway to accelerate AI innovation and international sales expansion. Third-party
              analyst estimates project Corelight's 2025 revenue at approximately $98.2 million in annual recurring
              revenue with roughly 417 employees. Nonetheless, as a venture-backed private enterprise, Corelight
              publishes no audited financial statements, leaving vital economic fundamentals—including GAAP gross
              margins, net cash burn, customer acquisition cost payback, and net revenue retention—unverified in the
              public domain. An investment thesis break would be triggered by verifiable evidence of platform
              co-opetition breakdown (such as CrowdStrike or Cisco launching direct open-NDR sensor replacements),
              annual ARR growth decelerating below 25%, or enterprise gross revenue retention dropping below 85%.
              Comprehensive confirmatory diligence must focus on private cap table liquidation preferences, customer
              cohort retention schedules, and audited enterprise gross margins.
