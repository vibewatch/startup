        title: Public Commercial Traction and Go-to-Market Proxies
        blocks:
          - type: paragraph
            body: >-
              Because Corelight remains a venture-backed private enterprise, the company does not disclose audited GAAP
              statements, realized billings, or segment-level net retention rates [CI004, CI009]. However, verified
              corporate disclosures indicate robust top-line momentum: Corelight achieved more than 40% year-over-year
              growth in annual recurring revenue (ARR) and over 300% year-over-year growth in its AI- and SaaS-driven
              NDR solutions for its fiscal year ending January 31, 2024 [CI003, CI005]. Go-to-market (GTM) distribution
              is heavily amplified through platform alliances and strategic integrations with leading cybersecurity
              ecosystems, notably CrowdStrike, Cisco Investments, and Mandiant [CI005, CI006]. Corelight serves as an
              integrated NDR telemetry provider for CrowdStrike Falcon and Mandiant incident response engagements,
              providing an efficient co-selling and channel-referral pipeline that compresses enterprise sales cycles
              [CI005, CI006]. Independent secondary estimates from industry databases such as GetLatka project ARR at
              approximately $98.2 million based on a headcount base of over 400 personnel, though this benchmark remains
              an unverified third-party inference rather than an audited company filing [CI010].
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI009
              - CI010
      - number: '4.3'
        title: Cost Structure Drivers, Capital Adequacy, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Corelight's underlying cost structure is governed by engineering headcount, hardware appliance
              manufacturing and logistics, cloud compute and bandwidth infrastructure across AWS, Azure, and GCP, and
              enterprise sales commissions [CI001, CI002]. Operating leverage depends upon shifting enterprise accounts
              from lower-margin physical hardware deployments toward high-margin cloud sensors and SaaS-based
              Investigator subscriptions [CI001, CI003]. From a balance sheet standpoint, Corelight's capital adequacy
              is anchored by its $150 million Series E financing closed on April 30, 2024, led by Accel with
              participation from strategic partners Cisco Investments and CrowdStrike Falcon Fund [CI005, CI006]. While
              this equity injection provides substantial runway to finance sales capacity, international expansion, and
              federal certification through 2026, external candidate and market evaluations highlight that absence of
              audited margins, opaque cash burn rates, and platform bundling by perimeter giants create underwriting
              risks that require direct data-room validation [CI004, CI009, CI011, CI012].
            claimRefs:
