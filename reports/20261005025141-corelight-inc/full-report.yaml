  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - TRACK
        - >-
          Strong technical validation and Series E capital co-investment, offset by absence of disclosed ARR and cap
          table terms.
        - Withhold term sheet until key commercial data room items are released.
      - - Confidence
        - Medium
        - >-
          High confidence on technical traction and partner proof; low confidence on private unit economics and margin
          structure.
        - Requires corroboration of audited financial statements and cohort retention.
      - - Risk Rating
        - High
        - Undisclosed liquidation stack, opaque burn rate, and venture debt overhang create structural risk.
        - Price protection and liquidation preference parity are mandatory conditions.
      - - Valuation Stance
        - Stretched
        - Implied $1.0B–$1.5B secondary valuation implies ~12.7x multiple on third-party estimated revenue (~$98.2M).
        - Refuse ungrounded premium multiples lacking audited net expansion evidence.
    notes: >-
      Assessment synthesizes verified public Series E financing disclosures, third-party revenue estimates, and private
      market data gaps.
