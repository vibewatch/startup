  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis Argument
      - Anti-Thesis Risk
      - Falsification Trigger
    rows:
      - - Technology & Moat
        - Zeek open-core architecture makes Corelight the de facto standard evidence platform for elite SOCs.
        - Proprietary XDR and next-gen SIEM suites may bundle native network sensors, marginalizing standalone NDR.
        - Displacement of Corelight telemetry from CrowdStrike Falcon or Cisco security architectures.
      - - Growth & Scale
        - Reported >40% YoY ARR growth and >300% growth in AI/SaaS NDR solutions demonstrate strong market traction.
        - Absence of disclosed baseline ARR, GRR, or NRR obscures organic enterprise retention.
        - Growth deceleration below 20% or flat enterprise account net expansion.
      - - Strategic Ecosystem
        - >-
          Strategic co-investments from Cisco Investments and CrowdStrike Falcon Fund align incentives with major
          distributors.
        - Corporate venture arms frequently invest without binding commercial distribution minimums or exclusivity.
        - Strategic partners launching competing native network telemetry capabilities.
      - - Capital Structure
        - Total equity capital raised exceeds $325M, backed by top-tier lead sponsor Accel.
        - Undisclosed liquidation preference stack from Series A through E may subordinate new capital.
        - Discovery of senior participating preferred terms or onerous debt covenants in data room review.
    notes: Falsification triggers define specific empirical operational signals that would break the investment thesis.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operational Assumptions
      - Implied Valuation Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - ARR scales past $180M at >35% CAGR; NRR stabilizes above 120%; AI SaaS NDR drives gross margins >75%.
        - $2.2B–$2.8B enterprise value via top-quartile cybersecurity IPO or strategic buyout (12x–15x EV/ARR).
        - Platform vendor commoditization; IPO window contraction; public multiple compression.
        - 25%
      - - Base Case
        - ARR grows at 20%–25% toward $130M–$150M; solid federal and enterprise retention; gross margins around 68%–72%.
        - $1.1B–$1.4B enterprise value via strategic M&A or growth private equity buyout (8x–9x EV/ARR).
        - Sales execution bottlenecks; extended enterprise procurement cycles; budget scrutiny.
        - 50%
      - - Bear Case
        - ARR growth decelerates below 10%; net churn rises; SIEM/XDR native telemetry replaces standalone NDR.
        - $450M–$600M enterprise value in a structured recapitalization or distressed sale (3.5x–4.5x EV/ARR).
        - Senior liquidation preference wipes out junior/common equity; credit facility restructuring.
        - 25%
    notes: >-
      Valuation multiples and probability signals reflect software cybersecurity comps and private market risk-adjusted
      return thresholds.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV009
      - CV011
      - CV014
