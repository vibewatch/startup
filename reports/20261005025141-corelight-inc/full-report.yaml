  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Architecture, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The enterprise cybersecurity landscape separates prevention mechanisms from active post-compromise
              detection. Corelight positions itself within Network Detection and Response (NDR), a category historically
              rooted in network traffic analysis (NTA) that transforms high-volume packets into structured telemetry for
              intrusion investigation. This market boundary explicitly includes enterprise spend on network security
              monitoring sensors, NDR cloud analytics, smart packet capture (PCAP) appliances, and open-core protocol
              parsing subscriptions across on-premises data centers and cloud VPCs. Conversely, the addressable boundary
              excludes perimeter next-generation firewalls (NGFW), endpoint detection agents (EDR), standalone security
              information and event management (SIEM) data lakes, and generic operational application performance
              monitoring (APM). The primary status-quo substitutes remain unmanaged open-source Zeek deployments, native
              cloud network logs (such as AWS VPC Flow Logs), and legacy signature-based intrusion detection systems
              (IDS) like basic Suricata or Snort.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses and Private Revenue Estimation Realities
        blocks:
          - type: paragraph
            body: >-
              Evaluating Corelight's addressable opportunity requires examining multiple sizing lenses, as private
              vendor disclosure limits direct segment revenue verification. Industry databases and market trackers
              evaluate Corelight's scale across differing statistical methodologies. IncFact classifies Corelight under
              NAICS code 541511 (Custom Computer Programming and Software Development Services) and estimates annual
              revenue within a broad statistical range of $10M to $100M for 2025. Concurrently, GetLatka models a point
              estimate of $98.2M in annual recurring revenue (ARR) for 2025 with 417 employees, while Tracxn identifies
              184 active competitors across the broad intelligence and analytics ecosystem. These private data
              limitations highlight the substantial divergence between top-down enterprise software classifications and
              bottom-up NDR adoption models, reinforcing that independent third-party point metrics remain statistical
              evaluations rather than audited financial results.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
