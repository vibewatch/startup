  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Compliance, and Data Privacy Exposure
        blocks:
          - type: paragraph
            body: >-
              Corelight operates as a Delaware corporation headquartered in San Francisco, California, subjecting its
              commercial operations to federal and state corporate governance standards. Because its Open NDR sensors
              capture, inspect, and analyze live enterprise network traffic across hybrid and multi-cloud environments,
              the company operates under stringent data protection frameworks, including the European Union General Data
              Protection Regulation (GDPR) and state privacy regulations. While Corelight maintains administrative,
              physical, and technical safeguards designed to secure personal data against unauthorized disclosure, its
              public privacy disclosures explicitly acknowledge that no operational security measures can wholly
              eliminate storage and transmission risks. In addition, enterprise deployments across international defense
              and financial services sectors require continuous compliance with United States export control
              classifications and cross-border data transfer mechanisms. A failure to enforce rigorous regional data
              boundary controls could result in substantial regulatory penalties, enterprise procurement delays, or
              customer breach liability.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
