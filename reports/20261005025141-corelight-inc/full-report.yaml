      - number: '5.3'
        title: Modular Product Portfolio, Ecosystem Ecosystem Integrations, and Open-Source Differentiators
        blocks:
          - type: paragraph
            body: >-
              Corelight packages its technology into modular physical appliances (AP 200, AP 1000, and AP 3000 series),
              virtual appliances, and cloud-native sensor instances orchestrated via centralized fleet management.
              Through strategic technology alliances with CrowdStrike, Cisco, and Mandiant, Corelight positions its
              network telemetry as ground truth evidence across joint detection architectures. For example, joint
              integrations with CrowdStrike Falcon X ingest endpoint indicators of compromise (IOCs) directly onto
              network sensors, performing real-time matching against wire traffic before SIEM ingestion. Corelight also
              maintains open-source developer tooling through active public repositories, publishing Elastic Common
              Schema (ECS) mapping templates, community ID flow-hashing libraries, and cloud deployment automation
              scripts. However, several operational limitations remain unaddressed in public documentation. Enterprise
              NDR deployments require substantial span/tap monitoring fabric, proprietary ML behavioral models remain
              opaque black boxes compared to open Zeek scripts, and long-term full packet capture retention requires
              external storage infrastructure. Technical due diligence must inspect formal third-party throughput
              benchmarks and verify data egress costs across hyperscaler cloud environments.
            claimRefs:
              - CE010
              - CE011
              - CE012
