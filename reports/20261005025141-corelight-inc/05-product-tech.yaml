chapter:
  number: 5
  title: "Product & Technology"
  summary: "Corelight delivers an open network detection and response (NDR) platform that transforms high-throughput hybrid network traffic into comprehensive structured evidence, pairing Zeek telemetry and Suricata intrusion detection with proprietary machine learning and deep SIEM/XDR integrations."
sections:
  - id: "product-overview-and-workflow"
    title: "Product Overview and SOC Workflow Integration"
    body: "Corelight provides an enterprise network detection and response (NDR) solution built upon open-core telemetry architectures, primarily Zeek (formerly Bro) and the Suricata intrusion detection engine. Rather than acting as a closed detection silo, Corelight sensors analyze live traffic across on-premises data centers, private clouds, and multi-cloud environments, parsing packet flows into high-fidelity behavioral logs and extracted file artifacts. In operational customer workflows, security operations center (SOC) analysts and threat hunters face severe alert fatigue caused by disparate, uncontextualized indicators. Corelight addresses this operational bottleneck by embedding Suricata signature alerts and machine-learning anomaly detections directly into comprehensive Zeek network evidence. Telemetry, extracted files, and flow indicators are natively streamed into downstream enterprise SIEM, data lake, and XDR platforms such as Splunk, Elastic, Kafka, and CrowdStrike Falcon. This open-architecture integration model allows incident responders to pivot seamlessly from atomic alerts to complete multi-protocol session context, significantly accelerating mean time to triage and investigation."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE002"
  - id: "architecture-and-sensor-engineering"
    title: "Operating Architecture and Hardware/Software Sensor Performance"
    body: "The core technical differentiator between Corelight and raw open-source Zeek deployments lies in enterprise sensor engineering, hardware acceleration, and data volume management. Open-source Zeek running on commodity server hardware typically bottlenecks at 3 to 4 Gbps throughput, dropping up to 25% of packets under high-connection-per-second load, and repeatedly writes duplicate extracted files to local storage. Corelight sensors employ optimized packet capture pipelines with hardware-accelerated NICs and specialized flow processing capable of sustaining 10 Gbps to 25+ Gbps line-rate analysis. To conserve expensive downstream analytical license capacity and network bandwidth, Corelight incorporates advanced traffic filtering and dynamic flow shunting. Flow shunting inspects initial connection establishment and clear-text handshake metadata—such as TLS negotiation parameters—and then selectively bypasses high-volume encrypted byte streams while continuing to log session duration and packet counters. Independent evaluations conducted for the U.S. Department of Defense demonstrated that Corelight physical appliances sustained 30,000 connections per second at 16 Gbps throughput with packet loss remaining below 0.05%, delivering an average ingestion rate of 1.8 TB of Zeek logs daily into enterprise search tiers."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "product-portfolio-and-ecosystem"
    title: "Modular Product Portfolio, Ecosystem Ecosystem Integrations, and Open-Source Differentiators"
    body: "Corelight packages its technology into modular physical appliances (AP 200, AP 1000, and AP 3000 series), virtual appliances, and cloud-native sensor instances orchestrated via centralized fleet management. Through strategic technology alliances with CrowdStrike, Cisco, and Mandiant, Corelight positions its network telemetry as ground truth evidence across joint detection architectures. For example, joint integrations with CrowdStrike Falcon X ingest endpoint indicators of compromise (IOCs) directly onto network sensors, performing real-time matching against wire traffic before SIEM ingestion. Corelight also maintains open-source developer tooling through active public repositories, publishing Elastic Common Schema (ECS) mapping templates, community ID flow-hashing libraries, and cloud deployment automation scripts. However, several operational limitations remain unaddressed in public documentation. Enterprise NDR deployments require substantial span/tap monitoring fabric, proprietary ML behavioral models remain opaque black boxes compared to open Zeek scripts, and long-term full packet capture retention requires external storage infrastructure. Technical due diligence must inspect formal third-party throughput benchmarks and verify data egress costs across hyperscaler cloud environments."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE001"
