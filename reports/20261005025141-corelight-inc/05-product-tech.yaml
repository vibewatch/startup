callouts:
  - calloutType: "insight"
    title: "Strategic Leverage of the Open NDR Paradigm"
    body: "Corelight's primary product differentiation stems from its open-core heritage with Zeek and Suricata. By embracing an open telemetry standard rather than forcing proprietary data schemas, Corelight embeds itself into heterogeneous enterprise SOC architectures. This approach allows enterprise defenders to bring their own analytical backends—such as Splunk, Elastic, or CrowdStrike Falcon—avoiding vendor lock-in while leveraging community-developed detection packages."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE012"
  - calloutType: "risk"
    title: "Operational Friction and Downstream Cost Considerations"
    body: "While Corelight appliances deliver robust wire-speed packet analysis, organizations face substantial ancillary costs. Enterprise NDR requires pervasive physical and cloud packet tap infrastructure. Furthermore, if advanced filtering policies are misconfigured, high-velocity Zeek log exports can create massive downstream SIEM indexing cost overruns or strain message bus infrastructure during sustained attack bursts."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
