  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类架构与相邻领域
        blocks:
          - type: paragraph
            body: >-
              企业网络安全格局把预防机制与攻陷后的主动检测区分开来。Corelight 将自身定位于网络检测与响应（NDR），这一品类历史上根植于
              网络流量分析（NTA），把海量数据包转成用于入侵调查的结构化遥测。这个市场边界明确包括企业在网络安全监控传感器、NDR 云分析、 智能数据包捕获（PCAP）设备，以及覆盖本地数据中心和云 VPC
              的开放核心协议解析订阅上的支出。相反，可服务边界排除边界侧 下一代防火墙（NGFW）、端点检测代理（EDR）、独立安全信息与事件管理（SIEM）数据湖，以及通用运维应用性能监控（APM）。
              当前最主要的替代方案仍是无人管理的开源 Zeek 部署、原生云网络日志（如 AWS VPC Flow Logs），以及基础 Suricata 或 Snort 等传统基于特征的入侵检测系统（IDS）。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角与私营公司收入估算的现实
        blocks:
          - type: paragraph
            body: >-
              评估 Corelight 的可服务机会需要结合多种规模视角，因为私营厂商披露有限，难以直接验证分部收入。行业数据库和市场追踪机构 采用不同统计方法评估 Corelight 的规模。IncFact 将
              Corelight 归入 NAICS 541511（定制计算机编程和软件开发服务），估计其 2025 年年收入处于 $10M 至 $100M 的宽泛统计区间。同时，GetLatka 以 417 名员工为基础，估算
              2025 年 ARR 的点值为 $98.2M； Tracxn 则在更宽泛的情报与分析生态中识别出 184 家活跃竞争者。这些私有数据限制凸显了自上而下的企业软件分类与自下而上的 NDR
              采用模型之间的巨大差异，也说明独立第三方点估计只是统计评价，而非经审计的财务结果。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM016
      - number: '2.3'
        title: 买方分层、采购流程与预算归属
        blocks:
          - type: paragraph
            body: >-
              Corelight 平台的采购主要由大型复杂企业、财富 500 强公司和政府国防机构中的技术安全负责人推动。主要经济买方通常是首席信息安全官 （CISO）或 IT
              安全与风险管理总监，他们掌控企业网络安全资本支出和运营支出预算。日常动手使用者包括安全运营中心（SOC）首席分析师、 事件响应人员和专业威胁猎手，负责分流告警并主动调查。多云复杂度上升、SIEM
              摄取成本高、合规要求或端点代理已显不足的事后修复审计， 都可能触发采用。同行评价显示，买方看重传感器快速的线速性能，以及能直接送入下游 SIEM 和数据湖平台的高保真元数据。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 宏观增长驱动与企业采用约束
        blocks:
          - type: paragraph
            body: >-
              三股结构性顺风正在加速 NDR 平台采用：企业安全架构转向零信任模型；无法运行传统 EDR 软件的非受管 IoT/OT 设备激增；以及 AI
              驱动的威胁搜寻扩张，而这需要丰富、结构化的网络遥测作为机器学习模型的燃料。但严重摩擦限制了市场速度。Corelight 的高接触式 企业部署要求安装物理设备，或使用能处理 100 Gbps 网络吞吐的虚拟
              TAP/SPAN 聚合器，导致概念验证（POC）评估周期拉长。 此外，员工和一线销售反馈显示激励兑现存在挑战：配额达成波动和较高的目标总收入（OTE）结构，反映出企业采购周期并不均匀。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 开源 NDR 的战略边界
            body: >-
              Corelight 的可服务机会依赖于把开源 Zeek 的广泛采用转成商业企业订阅。由于 Zeek 已广泛部署在成熟的政府和学术网络中， Corelight
              可以瞄准那些已经超出社区维护能力、但仍需要厂商支持的性能和开箱即用 SIEM 集成的组织。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM009
          - type: callout
            title: 采购复杂度与销售执行摩擦
            body: 尽管企业对网络可见性的需求很高，Corelight 仍受硬件设备物流、高线速网络集成和配额达成波动拖累。企业销售周期可能超过 12 个月，收入因此呈现不均匀性，给私营公司估值倍数带来挑战。
            calloutType: risk
            claimRefs:
              - CM010
              - CM015
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与可比群组
        blocks:
          - type: paragraph
            body: >-
              企业网络检测与响应（NDR）领域分为开放遥测专业厂商、专有封闭设备型 NDR 老牌厂商，以及从端点检测与响应（EDR）或 SIEM 扩展到网络流量分析的超大规模或平台安全厂商 [CP001,
              CP002]。Corelight 将自己定位为专有网络设备的开放核心替代方案，把高吞吐 网络数据包转成结构化 Zeek 日志和 Suricata 威胁告警 [CP001, CP005]。其主要可比对象包括
              Darktrace、Vectra AI 和 ExtraHop 等 专门网络安全平台，以及传统深度数据包检测设备 [CP001, CP002]。与此同时，CrowdStrike 和 Cisco
              等端点及云安全龙头是潜在的平台 替代者；它们采取与 Corelight 合作的混合策略，参与其公司融资，同时把其网络遥测嵌入各自的 SIEM 和 XDR 生态 [CP001, CP008]。
              商业厂商之外，现状替代方案仍是在普通硬件上自行构建开源 Zeek 和 Suricata 传感器 [CP001, CP007]。自托管开源方案虽省去软件 许可支出，但企业在尝试不依赖专用硬件加速、以 100G
              线速监控时，会承担大量基础设施开销、脚本维护债务和运营扩展障碍 [CP005, CP007]。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
      - number: '3.2'
        title: 能力与架构差异化
        blocks:
          - type: paragraph
            body: >-
              Corelight 的技术差异化来自高保真协议解析、双引擎检测和选择性数据包保留 [CP001, CP005]。Open NDR Platform 将 Zeek 与 Suricata
              结合运行，同时输出结构化行为元数据和基于特征的入侵告警 [CP001, CP005]。为解决传统全量数据包捕获（PCAP）方案 的高昂存储成本——企业网络每秒可产生 GB 级遥测——Corelight 集成
              Smart PCAP，这项索引技术保留用于入侵分析的取证数据包片段， 同时丢弃重复的海量流量 [CP001]。在大学科研骨干网和企业数据中心等高吞吐环境中，Corelight 部署 AP 5000 等硬件设备，
              可检测超过 100 Gbps 的网络互联 [CP001, CP005]。相比之下，专有竞争者高度依赖黑箱式行为分析和专有数据包传感器，把取证数据 锁进封闭的可视化控制台 [CP002,
              CP007]。Gartner Peer Insights 的客户评价对 Corelight 的线速性能和低摩擦策略管理反响积极， 也验证了其向 Microsoft Sentinel、Splunk 和 Google
              Cloud 等下游分析平台输送结构化遥测的能力 [CP002, CP004, CP005]。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
      - number: '3.3'
        title: 定价、锁定与分销护城河
        blocks:
          - type: paragraph
            body: >-
              NDR 品类的商业分销和企业锁定，取决于开放数据标准与专有工作流集成之间的平衡 [CP001, CP006]。Corelight 通过覆盖物理设备、虚拟传感器和云软件实例的企业订阅授权收费，同时提供 ET Pro
              威胁情报源和专门检测集合等模块化附加项 [CP005, CP006]。由于 Corelight 输出行业标准 Zeek 日志而非专有格式，客户更换可视化或 SIEM 层时几乎不会被数据锁定；但若离开
              Corelight 传感器集群， 仍要承担解析器定制、运营硬件维护和检测规则迁移等显著转换成本 [CP002, CP005, CP007]。Corelight 的市场打法偏激进：企业销售动作
              强调高目标总收入（OTE）结构，为客户经理设置底薪 $150,000、OTE $300,000 [CP003]。候选人情报档案中的反向反馈表明，由于 配额达成不均和薪酬透明度疑虑，激励兑现可能不稳定
              [CP003]。尽管如此，金融业知名 CISO 的顾问支持，以及云市场和合作伙伴生态带来的 分销杠杆，仍帮助 Corelight 抵御纯专有挑战者 [CP002, CP006, CP008]。
            claimRefs:
              - CP001
              - CP002
              - CP003
