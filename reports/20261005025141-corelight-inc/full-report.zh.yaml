      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 伙伴竞合与云渠道摩擦
            body: >-
              Cisco Investments 和 CrowdStrike Falcon Fund 的战略支持验证了 Corelight 的 Open NDR 架构，但两家伙伴都维护着庞大的内部安全遥测栈；
              如果伙伴路线图优先发展原生遥测，长期渠道摩擦和竞合风险就会增加。
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: callout
            title: 私有财务的确认性尽调要求
            body: 潜在投资者必须先审阅私有数据室中的经审计现金消耗、毛利率、客户集中度和历史销售配额达成情况，再考虑任何投资承诺；公开数据室仍严格缺少这些等价材料。
            calloutType: recommendation
