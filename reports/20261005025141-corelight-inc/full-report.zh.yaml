      - number: '5.2'
        title: 运营架构与硬件 / 软件传感器性能
        blocks:
          - type: paragraph
            body: >-
              Corelight 与原始开源 Zeek 部署的核心技术差异，在于企业级传感器工程、硬件加速和数据量管理。运行在普通服务器硬件上的开源 Zeek， 吞吐通常受限于 3 到 4
              Gbps；在每秒连接数很高的负载下最多丢失 25% 的数据包，并反复把重复提取文件写入本地存储。Corelight 传感器 使用优化的数据包捕获管线、硬件加速 NIC 和专用流处理，可维持 10 Gbps 至
              25+ Gbps 的线速分析。为节省昂贵的下游分析许可容量和网络带宽， Corelight 加入高级流量过滤和动态流分流。流分流先检查连接建立和明文握手元数据（如 TLS
              协商参数），再选择性绕过高流量的加密字节流， 同时继续记录会话时长和数据包计数。美国国防部开展的独立评估显示，Corelight 物理设备在 16 Gbps 吞吐下维持每秒 30,000 个连接， 丢包率低于
              0.05%，每天向企业搜索层摄取平均 1.8 TB 的 Zeek 日志。
            claimRefs:
              - CE005
