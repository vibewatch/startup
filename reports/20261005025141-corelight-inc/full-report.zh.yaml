              tone: positive
    approximationNotes: 风险评分综合了现有披露、战略投资结构及员工情绪的分析判断。
    claimRefs:
      - CR002
      - CR006
      - CR008
      - CR011
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这套决策流程把 Corelight 的技术与商业证据串成审慎的 TRACK 投资立场。
    data:
      nodes:
        - id: evidence-base
          label: 企业进展与战略支持
          detail: 开放 NDR 标准；Accel 领投 $150M E 轮，Cisco 与 CrowdStrike 参与；据报道 ARR 增长超过 40%。
        - id: operational-scale
          label: 关键任务级规模验证
          detail: 每日保护超过 $1B 的交易，并守护服务于 32M+ 用户的能源基础设施。
        - id: valuation-hurdle
          label: 估值与倍数审视
          detail: 按约 $98.2M 的收入估算推算，隐含估值为 $1.0B–$1.5B，对应约 12.7x 的远期倍数，但尚未经过审计验证。
        - id: gtm-friction
          label: 销售执行与激励信号
          detail: 综合反馈显示，配额达成度存在差异，激励机制的可靠性也令人担忧。
        - id: data-room-void
          label: 私有信息缺口
          detail: ARR 基数、NRR 客户队列、毛利率结构以及 A 至 E 轮清算优先权均未披露。
        - id: recommendation-gate
          label: 谨慎立场：TRACK
          detail: 在数据室核实财务利润率、债务契约和优先权条款前，不承诺 BUY。
      edges:
        - from: evidence-base
          to: operational-scale
        - from: operational-scale
          to: valuation-hurdle
        - from: valuation-hurdle
          to: gtm-friction
        - from: gtm-friction
          to: data-room-void
        - from: data-room-void
          to: recommendation-gate
    approximationNotes: 这套决策流程体现的是分类式投资判断阈值，而不是连续的量化概率。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV011
      - CV012
      - CV014
