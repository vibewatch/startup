chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源与商业模式
        blocks:
          - type: paragraph
            body: >-
              Corelight 的商业起点是开源 Zeek 网络安全项目。公司历史称，Vern Paxson、Robin Sommer 和 Seth Hall 在多年参与 Zeek 后，于 2013
              年成立服务业务；随着模式转向一体化产品，他们又招募了 Greg Bell [CO001, CO002, CO004]。 公司于 2016 年注册成立，同年推出 Corelight
              Sensor；现有公司材料将其描述为一家总部位于旧金山的开放核心网络检测与响应企业 [CO003]。其产品旨在把网络和云活动转成威胁搜寻、事件响应、可见性和分析所需的证据。平台在虚拟、软件、云和物理传感器上， 将
              Zeek 与 Suricata 派生的洞察，和专有采集、数据包捕获、机器学习及搜索能力结合起来 [CO005]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Brian Dye 是现任 CEO：Corelight 2026 年 5 月的公告确认了这一点；2020 年的交接公告记录了他从首席产品官升任 CEO 并进入董事会 [CO007]。同次交接还让联合创始人、前
              CEO Greg Bell 转任首席战略官，并任命 Michele Bettencourt 为执行主席； 但现有证据没有再次确认这两个职位在 2026 年仍然有效 [CO009]。2026 年 5 月，前
              Barracuda Networks CEO Hatem Naguib 出任董事，Tenable 联合创始人 Jack Huffard 出任顾问，进一步补充了治理层
              [CO008]。创始人谱系带来少见的技术可信度， 但公开证据没有提供完整的现任高管名单、董事会构成、委员会架构或继任计划。因此，尽调应区分已验证的现任职位与历史任命， 不能直接假定其延续 [CO002,
              CO007, CO008, CO009]。
            claimRefs:
              - CO002
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 融资、投资者与可观察规模
        blocks:
          - type: paragraph
            body: >-
              现有证据中的公开融资记录并不完整，但确认了两轮关键融资。Corelight 称 Accel 于 2017 年领投 $9.2 million 的 Series A；公司 2024 年 4 月发布的公告称，Accel
              领投 $150 million 的 Series E，Cisco Investments 和 CrowdStrike Falcon Fund 参与其中 [CO010, CO011]。公司 2020 年公告还将
              Accel、General Catalyst、Insight Partners 和 Osage University Partners 列为投资支持者
              [CO016]。由于没有提供中间轮次的规模和工具，这些披露不能证明累计融资额。 Series E 公告称 ARR 同比增长超过 40%，AI 和 SaaS 驱动的 NDR 解决方案同比增长
              300%；但这些是公司报告的增长率， 不是绝对 ARR、GAAP 收入或现金可用性 [CO012]。官方材料提到 Global 2000 企业、政府机构、研究型大学以及覆盖超过 15
              个国家的运营，但没有披露客户数 [CO013]。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO010
              - CO011
              - CO016
      - number: '1.4'
        title: 证据边界与尽调重点
        blocks:
          - type: paragraph
            body: >-
              留存证据不足以支持当前估值、累计融资额、债务余额、绝对收入或 ARR、客户数或员工数 [CO014]。MarketResearch
              的落地页称其付费报告包含私营公司的销售额和员工数估计，并解释这些数字会因来源而异；但抓取到的公开文本只呈现方法论， 没有 Corelight 的数值，把该页面当作数字数据点没有依据
              [CO014]。Corelight 描述了地域分散的团队，也发布了强调多元化的招聘文字， 但两页留存材料都没有提供员工数或办公地点清单 [CO006]。现有证据中唯一的负面信号，是 Built In
              摘要提到配额达成不一致和 薪酬匹配度疑虑。Built In 明确说明摘要由 AI 生成，且不是经过验证的内部数据，因此它只是低置信度的人力线索，不能证明存在广泛的 运营问题
              [CO015]。负面搜索没有返回留存结果；这种缺失不等于诉讼、泄露、宕机或监管事项不存在。
            claimRefs:
              - CO006
              - CO014
              - CO015
