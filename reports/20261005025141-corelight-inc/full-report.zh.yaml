        title: 展示项
        blocks:
          - type: callout
            title: 技术血统异常稳固
            body: Corelight 的商业平台继承了长期运行的开源网络监控基础，并在其上加入集成式传感器和专有能力。这一血统可能降低品类教育风险， 但产品差异化和开源治理仍需单独进行技术尽调。
            calloutType: strength
