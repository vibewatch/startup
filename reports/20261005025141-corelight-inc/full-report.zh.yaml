  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、合规与数据隐私风险
        blocks:
          - type: paragraph
            body: >-
              Corelight 是一家总部位于加州旧金山的特拉华州公司，其商业运营受联邦和州级公司治理标准约束。由于 Open NDR 传感器会在混合及多云环境
              中捕获、检查和分析企业实时网络流量，公司需要遵守严格的数据保护框架，包括欧盟《通用数据保护条例》（GDPR）和州隐私法规。Corelight
              维护行政、物理和技术防护措施，以保护个人数据不被未经授权披露；但其公开隐私披露明确承认，没有任何运营安全措施能彻底消除存储和传输风险。
              此外，国际国防和金融服务领域的企业部署，还要求持续遵守美国出口管制分类和跨境数据传输机制。若未能严格执行区域数据边界控制，可能导致 重大的监管处罚、企业采购延迟或客户泄露责任。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
