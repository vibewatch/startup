  - id: FM001
    title: 市场规模与受证据约束的机会层级
    type: pyramid
    summary: 将网络安全市场机会从全球整体支出拆解至已核实的私人厂商基准。
    data:
      items:
        - label: 可触达网络安全总市场
          value: Broad Enterprise Spend
          detail: 全球企业网络安全支出，覆盖边界防火墙、云基础设施和终端防护。
          tone: neutral
        - label: 网络检测与响应（NDR）SAM
          value: High-Growth Niche
          detail: 专注于网络流量分析、Zeek 元数据生成及 Smart PCAP 留存的细分市场。
          tone: positive
        - label: Corelight 规模视角（IncFact 评估）
          value: $10M - $100M Range
          detail: IncFact 统计评估估算：员工规模 100 至 500 人的公司，年收入在 $10M 至 $100M 之间。
          tone: neutral
        - label: Corelight 规模视角（GetLatka 模型）
          value: $98.2M ARR Estimate
          detail: 第三方私人公司运行率模型估算其 2025 年 ARR 为 $98.2M，员工人数为 417 人。
          tone: positive
        - label: Corelight 竞争格局（Tracxn）
          value: 184 Active Competitors
          detail: Tracxn 识别出的活跃竞争格局，包括 30 家获融资企业和 33 家已退出企业。
          tone: warning
        - label: 销售激励逆风（Built In）
          value: Quota Variability
          detail: 员工评价称激励机制薄弱且不可靠，并高度依赖 OTE，拖累 GTM 扩张。
          tone: negative
    approximationNotes: 所有数据均来自外部第三方模型和定性组织反馈，而非公司审计的 GAAP 披露。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM016
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 比较开放遥测可移植性与原生开箱即用调查深度，评估网络检测架构。
    data:
      xAxis: 开放遥测可移植性（序数尺度 1-10）
      yAxis: 开箱即用的自主检测与响应（序数尺度 1-10）
      points:
        - label: Corelight 开放 NDR 平台
          x: 9
          'y': 7
          detail: 将开放 Zeek/Suricata 数据格式与高吞吐硬件及模块化 C2 威胁检测结合。
        - label: 专有 NDR 既有厂商（Darktrace、Vectra）
          x: 3
          'y': 8
          detail: 开箱即用的自动化响应深入，但网络遥测格式封闭且专有。
        - label: 平台型 XDR 套件（Cisco、Palo Alto Networks）
          x: 4
          'y': 9
          detail: 覆盖终端与边界的统一安全范围广，但 Zeek 深层协议解析能力有限。
        - label: 现状 DIY 开源方案（Zeek / Suricata）
          x: 10
          'y': 2
          detail: 对开放遥测拥有最大控制权和数据所有权，但原生开箱即用工作流自动化极少。
        - label: 传统边界 IDS / IPS
          x: 5
          'y': 4
          detail: 仅按特征检查，不具备深层行为协议提取或 Smart PCAP 索引。
        - label: 云原生流日志分析器
          x: 6
          'y': 5
          detail: 使用 VPC 流日志，部署阻力低，但缺乏深层应用层协议检查。
    approximationNotes: 序数评分（1-10）根据公开产品文档，从数据可移植性、部署架构和自动化威胁分诊能力综合形成。
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP007
  - id: FI001
    title: Corelight 开放 NDR 商业变现流程
    type: flow
    summary: 展示客户遥测接入如何转化为分层订阅、合作伙伴分销及实际运营资本的商业转化流程。
    data:
      nodes:
        - label: 企业与联邦网络遥测（100+ Gbps）
        - label: 开放 NDR 传感器部署（硬件与云）
        - label: 遥测接入与 Smart PCAP 优化
        - label: 订阅合同（带宽与 SaaS 席位）
        - label: 战略生态联合销售（CrowdStrike、Cisco、Mandiant）
        - label: 经常性 ARR 扩张与运营资本
      edges:
        - from: Enterprise & Federal Network Telemetry (100+ Gbps)
          to: Open NDR Sensor Deployment (Hardware & Cloud)
        - from: Open NDR Sensor Deployment (Hardware & Cloud)
          to: Telemetry Ingestion & Smart PCAP Optimization
        - from: Telemetry Ingestion & Smart PCAP Optimization
          to: Subscription Contracts (Bandwidth & SaaS Seats)
        - from: Subscription Contracts (Bandwidth & SaaS Seats)
          to: Strategic Ecosystem Co-Sell (CrowdStrike, Cisco, Mandiant)
        - from: Strategic Ecosystem Co-Sell (CrowdStrike, Cisco, Mandiant)
          to: Recurring ARR Expansion & Operating Capital
    approximationNotes: 流程展示从产品架构和合作伙伴分销渠道推导出的商业模式变现路径。
    claimRefs:
      - CI001
      - CI002
