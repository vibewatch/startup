        - ARR 以 20%–25% 的速度增长至 $130M–$150M；联邦及企业客户留存稳健；毛利率约为 68%–72%。
        - 通过战略并购或成长型私募股权收购获得 $1.1B–$1.4B 企业价值（8x–9x EV/ARR）。
        - 销售执行瓶颈；企业采购周期拉长；预算审查趋严。
        - 50%
      - - 悲观情景
        - ARR 增长放缓至 10% 以下；净流失上升；SIEM/XDR 原生遥测取代独立 NDR。
        - 在结构化资本重组或困境出售中实现 $450M–$600M 企业价值（3.5x–4.5x EV/ARR）。
        - 高级清算优先权吞噬次级 / 普通股权；信贷额度重组。
        - 25%
    notes: 估值倍数和概率信号反映软件网络安全可比公司及私人市场风险调整后回报门槛。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV009
      - CV011
      - CV014
