  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品概览与 SOC 工作流集成
        blocks:
          - type: paragraph
            body: >-
              Corelight 提供企业级网络检测与响应（NDR）方案，依托以 Zeek（前身为 Bro）和 Suricata 入侵检测引擎为主的开放核心遥测架构。Corelight
              传感器不是封闭的检测孤岛，而是分析本地数据中心、私有云和多云环境中的实时流量，把数据包流解析成高保真的行为日志和提取文件。
              在客户的运营工作流中，安全运营中心（SOC）分析师和威胁猎手常因分散、缺少上下文的指标而严重告警疲劳。Corelight 把 Suricata 特征告警 和机器学习异常检测直接嵌入完整的 Zeek
              网络证据，解决这一运营瓶颈。遥测、提取文件和流量指标会原生流入 Splunk、Elastic、Kafka、 CrowdStrike Falcon 等下游企业 SIEM、数据湖和 XDR
              平台。开放架构集成让事件响应人员能从单点告警无缝切换到完整的多协议会话上下文， 显著缩短分流和调查的平均时间。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
