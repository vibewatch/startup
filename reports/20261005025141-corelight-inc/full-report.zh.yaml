              - CV014
      - number: '8.3'
        title: 情景分析、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              三种情景模型勾勒出 Corelight 在多年投资周期内经风险调整后的潜在回报分布。乐观情景下，Corelight 成功 把生成式 AI 创新、与 Cisco 和 CrowdStrike 的开放式 NDR
              平台集成，以及扩大的企业客户覆盖，转化为成功 IPO 或被 Cisco、Palo Alto Networks 等平台整合者进行标志性战略收购；以成熟期 $160M+ ARR 的 14.0x 至 16.0x
              倍数计，估值达到 $2.2B 至 $2.8B。基准情景下，Corelight 在联邦政府和 Global 2000 客户中维持 25% 至 30% 的有机 ARR
              增长，最终有序退出或在后期进行二次资本重组，估值为 $1.2B 至 $1.5B，对应 8.0x 至 10.0x 远期收入。悲观情景下，更广泛的 SIEM/XDR 平台厂商将独立网络遥测产品商品化，加上宏观 IT
              预算收紧和配额执行难题，把实际倍数压缩至 ARR 的 4.0x 至 5.0x，最终以 $450M 至 $600M 进行降价轮
              或结构化资本重组，初级股权遭遇严重稀释，或被清零的清算优先权吞噬。             
              资金投入前的尽调必须盯住五项不可妥协的数据室材料：包含高级清算优先权和参与权的完全摊薄股权结构表；创投债务工具的完整契约包及利息条款；按
              按客户队列划分的净收入留存率和客户流失；联邦政府及金融服务垂直领域的客户集中度；以及经审计的 GAAP 财务报表。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV009
              - CV011
              - CV014
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 投资评估纪律要求选择 TRACK，而非投机性 BUY
            body: >-
              Corelight 具备一流网络安全企业业务的典型特征——扎根开源社区、被顶尖事件响应机构采用，并得到行业老牌公司的战略支持——但在单位经济性和股权结构表优先级都不透明、独角兽估值又未经确认时投资，可能带来
              不对称的下行风险。投资者应保持积极的 TRACK 立场，任何投资方案都必须以完整查阅历史客户队列留存、债务契约和经审计 GAAP 财务报表为前提。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV011
              - CV014
