company:
  name: "Corelight, Inc."
chapter:
  number: 6
  title: "Customers"
  summary: "Corelight serves large enterprises and public-sector institutions including Fortune 500 corporations, major government defense and intelligence agencies, and multinational research universities, anchoring adoption on high-throughput Zeek network evidence. Production proof spans critical commercial references like Carrefour alongside elite incident response teams at Mandiant, CrowdStrike, and the Black Hat NOC. However, total paying customer accounts, net retention rates, and revenue concentration boundaries remain closely guarded private figures, while high sales incentive volatility signals friction in mid-market quota attainment."
sections:
  - id: "customer-segmentation"
    title: "Customer Base Segmentation and Buyer Personas"
    body: "Corelight categorizes its customer base into three primary enterprise segments: Fortune 500 global corporations, sovereign government defense and civilian agencies, and large higher-education and research institutions. The platform's commercial appeal centers on security operations centers (SOCs) and incident response (IR) teams facing advanced persistent threats across hybrid multi-cloud infrastructure. Buyers are typically Chief Information Security Officers (CISOs), Directors of Information Security, and SOC Managers seeking forensic-grade network evidence that survives endpoint tampering and bypasses host logging limitations. The technical users are threat hunters, security engineers, and tier-2/tier-3 SOC analysts who leverage structured Zeek telemetry and Suricata intrusion detection signatures to identify adversarial lateral movement and command-and-control communications. Despite enterprise traction, Corelight does not disclose audited customer counts, customer logo breakdowns, or annual recurring revenue (ARR) cohort distributions, creating an analytical gap regarding customer concentration and long-term durability across non-tier-one enterprises."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU008"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-proof"
    title: "Adoption Trajectory and Named Customer Proof"
    body: "Adoption of Corelight Open NDR has expanded from core open-source Zeek deployments in government research into commercial enterprise SOCs and managed response ecosystems. In enterprise production, global retail giant Carrefour deployed Corelight across its network of physical stores, corporate headquarters, multi-cloud clusters, and external partner connections. The deployment eliminated network visibility blind spots in environments where endpoint detection and response (EDR) agents could not be installed, enabling proactive threat hunting and custom detection engineering in their centralized SIEM. Furthermore, elite cybersecurity incident response and services teams—including CrowdStrike Services, Mandiant, and the Black Hat Network Operations Center (NOC)—rely on Corelight as their preferred network detection and response technology for mission-critical digital forensics. Independent practitioner reviews collected via Gartner Peer Insights corroborate high satisfaction across healthcare, manufacturing, and government deployments, emphasizing robust line-speed throughput and rapid alert triage. Nevertheless, verified named enterprise case studies remain sparse outside selective marketing releases, leaving broader pilot-to-production conversion rates unverified."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU011"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "retention-expansion-risks"
    title: "Retention Dynamics, Expansion Friction, and Adverse Signals"
    body: "Corelight's commercial expansion strategy relies on a land-and-expand model wherein initial sensor deployments at key network chokepoints broaden into enterprise-wide sensor coverage, cloud traffic mirroring, and SaaS-driven investigative workflows. In 2024, the company claimed over 40% year-over-year ARR growth alongside 300% growth in its SaaS and AI-driven NDR revenue solutions. In March 2026, Corelight expanded monetizable software add-ons by launching Corelight Threat Intelligence powered by CrowdStrike. Despite these expansion vectors, Corelight's net revenue retention (NRR), gross revenue retention (GRR), and logo churn rates remain undisclosed private metrics. Significant adverse commercial signals emerge from practitioner and workforce feedback: sales incentive pay is characterized as volatile and inconsistent, with account executives facing steep quota attainment hurdles despite high $300,000 on-target earnings (OTE) compensation packages. This variable compensation friction suggests commercial procurement friction and uneven sales execution when expanding outside established enterprise Zeek champions."
    claimRefs:
      - "CU007"
      - "CU009"
      - "CU010"
      - "CU012"
callouts:
  - calloutType: "strength"
    title: "Elite Ecosystem Validation"
    body: "Adoption of Corelight Open NDR by premier incident response providers—including CrowdStrike Services, Mandiant, and the Black Hat NOC—serves as definitive operational proof of network forensic depth and data fidelity during live breach investigations."
    claimRefs:
      - "CU004"
  - calloutType: "risk"
    title: "Sales Quota and Incentive Volatility"
    body: "Practitioner and employee compensation analyses indicate that high on-target earnings structures ($300k OTE) face inconsistent quota attainment in the field, signaling potential procurement drag, long sales cycles, or uneven enterprise expansion outside early-adopter Zeek accounts."
    claimRefs:
      - "CU010"
