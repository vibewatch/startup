  - id: FU001
    title: Gopuff Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Four core customer segments, their entry touchpoints, loyalty loops, and friction points within the Gopuff
      platform ecosystem.
    data:
      items:
        - id: stage-discovery
          label: App Download / Platform Entry
          actor: B2C convenience consumer
          description: >-
            Gen Z / millennial urban consumer discovers Gopuff via App Store, social media, or platform partner (Amazon
            UK, DoorDash, Uber Eats). Initial draw is 15–30 min delivery of snacks, beverages, and household essentials.
          channels:
            - App Store / Google Play
            - Social media / DTC ads
            - Platform partner routing
        - id: stage-first-order
          label: First Order
          actor: B2C convenience consumer
          description: >-
            Consumer completes first order; experiences speed and packaging; sees Fam upsell prompt offering free
            delivery and member savings ($7.99/month or $3.99 student rate at 1,000+ campuses).
          channels:
            - In-app Fam upsell
            - Post-order email
        - id: stage-fam-conversion
          label: Fam Subscription Signup
          actor: High-frequency B2C consumer
          description: >-
            Consumer converts to Fam membership. Fam members generate ~50% of all orders and save ~$20/month on average.
            Student Fam targets university campuses.
          channels:
            - In-app subscription flow
            - Student Fam landing page
        - id: stage-fam-retention
          label: Fam Retention Loop
          actor: Fam subscriber
          description: >-
            Free delivery on every order reinforces daily or weekly habit. Weekly Fam deals and early access to
            promotions deepen engagement; member savings compound against $7.99 fee over 3+ orders per month.
          channels:
            - Push notifications
            - Weekly deals digest
        - id: stage-brand-advertiser
          label: Brand Advertiser Onboarding
          actor: CPG brand / non-endemic advertiser
