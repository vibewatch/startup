      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical Integration as Durable Moat
            body: >-
              Gopuff's owned-inventory MFC model is structurally different from marketplace platforms: it captures
              product- category margins rather than intermediary fees, enabling the $4+ per-order contribution margin
              even as competitors burned out. The model also gives Gopuff real-time inventory control that eliminates
              most out-of-stock failures at order submission — a key driver of repeat-purchase behavior. With major
              q-commerce rivals having exited the US market entirely, this architecture is no longer easily replicable
              at national scale.
            calloutType: strength
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO041
          - type: callout
            title: Valuation Reset and Unconfirmed Profitability
            body: >-
              Gopuff's $8.5B current valuation is 43% below its 2021 peak, implying most investors from the 2021
              mega-rounds are underwater. The company has stated a path to free-cash-flow positivity but has not
              independently confirmed reaching that milestone for 2024 or 2025. Cash burn was approximately $400M in
              2023. Revenue has declined from an estimated $1.88B in 2021 to approximately $1.2B in 2023. The
              combination of declining revenue, high cumulative capital consumed, and unconfirmed profitability creates
              material diligence risk ahead of any liquidity event.
            calloutType: risk
            claimRefs:
