  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Labor misclassification enforcement and alcohol license compliance cluster at high likelihood and high severity;
      MFC unit-economics failure and partner termination risks sit at high severity with medium-to-high likelihood; IPO
      timing and dark-store zoning are elevated but secondary.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation Maturity
        - Residual Severity
      rows:
        - label: Labor misclassification enforcement (DC + MA)
          values:
            - label: High
              tone: negative
              detail: Two state AG actions already filed; third-state cascade pattern emerging.
            - label: Critical
              tone: negative
              detail: Retroactive back-pay and structural labor-cost increase if adverse rulings.
            - label: Low
              tone: negative
              detail: Appeal in progress; no structural settlement or corrective consent decree.
            - label: Critical
              tone: negative
              detail: No resolution pathway publicly committed; cascade risk unmitigated.
        - label: Alcohol license compliance (ABCC precedent)
          values:
            - label: Medium
              tone: warning
              detail: License paused by court; single market enforcement already demonstrated.
            - label: High
              tone: negative
              detail: License loss in a top-5 market is a material revenue event.
            - label: Medium
              tone: warning
              detail: Training programs and ID-scan technology deployed; compliance post-order only.
            - label: High
              tone: negative
              detail: Multi-state licensing obligation at scale; audit-based risk persists.
        - label: Cash burn and IPO timing uncertainty
          values:
            - label: High
              tone: negative
              detail: IPO not filed as of May 2026; $400M burn in 2023; runway depends on next capital event.
            - label: High
              tone: negative
              detail: Market-window closure forces additional private round at further compression.
            - label: Low
              tone: warning
              detail: New CFO and board additions signal readiness, but no S-1 filed.
            - label: High
              tone: negative
              detail: No audited profitability; contribution-profit claim unverified by third parties.
        - label: MFC unit-economics failure in low-density markets
          values:
            - label: Medium
              tone: warning
              detail: Prior expansion into under-density markets forced closures in 2022 and 2024.
            - label: High
              tone: negative
              detail: Fixed lease and labor costs are inescapable during demand troughs.
            - label: Medium
              tone: warning
              detail: Market-exit playbook exists; AI forecasting improving waste.
            - label: Medium
              tone: warning
              detail: No public per-MFC break-even data; residual density risk in newer markets.
        - label: Partner concentration (Starbucks, Amazon)
          values:
            - label: Low
              tone: positive
              detail: Both partnerships actively expanding as of May 2026.
            - label: High
              tone: negative
              detail: Termination of either would reduce order frequency and basket size simultaneously.
            - label: Low
              tone: warning
              detail: Contract terms not public; no disclosed minimum-term guarantees.
            - label: High
              tone: negative
              detail: Power asymmetry favors both partners; Gopuff has limited leverage on renewal.
        - label: Customer churn and service quality
          values:
            - label: High
              tone: negative
              detail: Trustpilot 1.4/5; 637+ PissedConsumer complaints on delivery accuracy.
            - label: Medium
              tone: warning
              detail: Elevated churn in impulse category with low switching friction.
            - label: Low
              tone: negative
              detail: No publicly disclosed improvement plan for customer-service response times.
            - label: Medium
              tone: warning
              detail: High competitor substitutability makes sustained poor reviews an ongoing churn driver.
    approximationNotes: >-
      Likelihood and maturity ratings are based on publicly available evidence; internal operational data, audit
      findings, and private litigation reserves not available for review.
    claimRefs:
      - CR001
      - CR003
      - CR011
      - CR014
      - CR018
      - CR021
      - CR022
      - CR026
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Legal and regulatory enforcement, MFC cost pressure, partner risk, and customer churn each feed into revenue and
      margin, which then flow through to IPO viability and valuation; execution and leadership concentration risk
      amplifies every other node.
    data:
      nodes:
        - id: legal
          label: Legal / Regulatory Enforcement
          detail: DC AG misclassification suit, MA citation, alcohol license compliance, cannabis uncertainty.
          tone: negative
        - id: labor_cost
          label: Labor Cost Step-Up
          detail: Reclassification ruling would raise per-delivery cost structurally.
          tone: negative
        - id: mfc_econ
          label: MFC Unit Economics Pressure
          detail: Fixed-cost base requires order density; density sensitive to churn and competition.
          tone: warning
        - id: partner
          label: Partner Concentration Risk
          detail: Starbucks and Amazon termination risk; Eldridge capital dependency.
          tone: warning
        - id: churn
          label: Customer Churn
          detail: Low Trustpilot score, delivery failures, strong competitor substitutability.
          tone: negative
        - id: revenue
          label: Revenue at Risk
          detail: License loss, churn, and partner exit each reduce top-line directly.
          tone: negative
        - id: margin
          label: Margin Compression
          detail: Labor cost increases and MFC fixed costs squeeze contribution margin.
          tone: negative
        - id: ipo
          label: IPO Viability
          detail: Adverse rulings, margin compression, or valuation decline could delay or cancel IPO.
          tone: warning
        - id: valuation
          label: Valuation
          detail: Already compressed from $15B to $8.5B; further litigation or partner loss would pressure further.
          tone: negative
        - id: exec
          label: Execution / Leadership Concentration
          detail: Co-CEO key-person risk and IPO-distraction amplify operational response lag.
          tone: warning
      edges:
        - from: legal
          to: labor_cost
          label: reclassification ruling
        - from: legal
          to: revenue
          label: license revocation
        - from: labor_cost
          to: margin
          label: cost step-up
        - from: mfc_econ
          to: margin
          label: fixed-cost absorption
        - from: partner
          to: revenue
          label: partner termination
        - from: churn
          to: revenue
          label: order-frequency decline
        - from: revenue
          to: ipo
          label: growth trajectory
        - from: margin
          to: ipo
          label: profitability path
        - from: ipo
          to: valuation
          label: public market re-rating
        - from: exec
          to: ipo
          label: readiness lag
        - from: exec
          to: legal
          label: response latency
    claimRefs:
      - CR001
      - CR002
      - CR011
      - CR014
      - CR021
      - CR026
      - CR030
      - CR033
      - CR034
      - CR038
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Gopuff's operating model depends on Starbucks for basket and brand, Amazon for marketplace demand, Eldridge for
      capital, independent-contractor drivers for last-mile delivery, and state regulators for the licenses that allow
      regulated-category delivery.
    data:
      nodes:
        - id: gopuff
          label: Gopuff
          detail: Operator of ~1,000-city instant-commerce network; vertically integrated MFC model.
          tone: neutral
        - id: starbucks
          label: Starbucks
          detail: Brand and basket anchor; Starbucks-trained baristas in MFCs; 80% cross-sell rate.
          tone: warning
        - id: amazon
          label: Amazon (UK)
          detail: Marketplace demand surface; Gopuff fulfills orders routed through Amazon.com UK.
          tone: warning
        - id: eldridge
          label: Eldridge Industries
          detail: Led $250M Series F in Nov 2025; anchor private capital provider.
          tone: warning
        - id: drivers
          label: Driver / Contractor Pool
          detail: Independent-contractor last-mile delivery; misclassification risk elevates cost if reclassified.
          tone: warning
        - id: regulators
          label: State Regulators (Alcohol / Cannabis)
          detail: Issue and revoke operating licenses; ABCC, state AGs, and liquor authorities.
          tone: negative
        - id: app_stores
          label: App Stores (Apple / Google)
          detail: Mobile distribution channel; 30% fee and age-verification policy exposure.
          tone: neutral
        - id: mfcs
          label: Micro-Fulfillment Centers
          detail: ~700+ dark stores providing owned-inventory fulfillment; high-fixed-cost infrastructure.
          tone: neutral
      edges:
        - from: starbucks
          to: gopuff
          label: brand partnership / baristas
        - from: amazon
          to: gopuff
          label: marketplace demand
        - from: eldridge
          to: gopuff
          label: capital ($250M)
        - from: drivers
          to: gopuff
          label: last-mile delivery
        - from: regulators
          to: gopuff
          label: license grant / revocation
        - from: app_stores
          to: gopuff
          label: mobile distribution
        - from: gopuff
          to: mfcs
          label: owns / operates
        - from: gopuff
          to: drivers
          label: dispatches / compensates
    claimRefs:
      - CR013
      - CR026
      - CR027
      - CR028
      - CR029
      - CR001
      - CR047
  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: standard
    summary: |
      Chain from evidence pillars (scale, unit economics, risk factors, valuation) to the TRACK recommendation.
    data:
      nodes:
        - id: scale
          label: 'Scale: sole surviving US+UK instant-commerce operator (>$5.25B raised, largest network)'
        - id: economics
          label: 'Unit economics: >$4/order contribution profit; advertising margin improving; FAM retention growing'
        - id: risk
          label: 'Risks: $5.25B preference stack; no audited P&L; cash burn history; fixed-cost model'
        - id: valuation
          label: 'Valuation: 9–11x EV/Revenue implied vs 2.3–4.6x for profitable public peers'
        - id: recommendation
          label: TRACK — improvements priced in; await S-1 and IPO price discovery
      edges:
        - from: scale
          to: recommendation
        - from: economics
          to: recommendation
        - from: risk
          to: recommendation
        - from: valuation
          to: recommendation
    approximationNotes: >
      Flow represents the logical chain from evidence to recommendation, not a DCF or quantitative weighting model. Node
      labels are summaries of chapter section findings.
    claimRefs:
      - CV044
      - CV001
      - CV038
      - CV041
      - CV020
  - id: FV002
    title: Valuation Sensitivity to EV/Revenue Multiple
    type: bar
    layout: standard
    summary: >
      Implied enterprise value at various EV/Revenue multiples applied to a $900M base-case revenue estimate,
      benchmarked against DoorDash and Instacart public multiples and the current private mark.
    data:
      items:
        - label: 2.3x (Instacart public)
          value: 2070
        - label: 4.0x (blended floor)
          value: 3600
        - label: 4.6x (DoorDash public)
          value: 4140
        - label: 6.0x (blended est.)
          value: 5400
        - label: 8.0x (modest premium)
          value: 7200
        - label: ~9.4x (current $8.5B mark)
          value: 8500
        - label: 12.0x (bull-case target)
          value: 10800
    approximationNotes: >
      All values in USD millions. Base revenue of $900M is the midpoint of the $800M–$1.0B range derived from
      third-party estimates; actual multiples should be recomputed against audited revenue when available. Current-mark
      bar uses the November 2025 $8.5B primary valuation directly.
    claimRefs:
      - CV020
      - CV017
      - CV018
      - CV024
      - CV027
