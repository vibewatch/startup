companyProfile:
  summary: >-
    Gopuff was founded in 2013 by Drexel University students Yakir Gola and Rafael Ilishayev in Philadelphia as a
    late-night hookah-and-essentials delivery service. It evolved into a vertically integrated instant- commerce
    platform that buys inventory wholesale, stocks it in proprietary micro-fulfillment centers, and delivers
    convenience, grocery, alcohol, and household products in 15–30 minutes across the US and UK. Unlike marketplace
    peers, Gopuff owns the inventory and fulfillment layer, monetizing through product margins, delivery fees, Gopuff
    Fam subscriptions, private-label goods, and retail-media advertising. The company has raised more than $5.25B and
    reset its valuation from a $15B 2021 peak to $8.5B in the November 2025 round while pivoting from hypergrowth to
    profitability discipline.
