          - type: callout
            title: Fixed-Cost MFC Network Amplifies Downside Risk in Underperforming Markets
            body: >
              Gopuff's 2022 closure of 76 distribution centers and layoff of 1,500 employees (10% of headcount),
              followed by a 2024 wave of hundreds more cuts, illustrates the downside leverage of owning fixed MFC
              infrastructure. While the model is highly profitable at high order density, underperforming geographies
              generate structural losses that require capital-intensive remediation — either via closure (destroying
              network coverage) or sustained subsidy. The Trustpilot adverse signal (2-hour waits, missing items,
              AI-chatbot support) suggests service quality degrades first in markets where MFC staffing and route
              density are below optimal thresholds.
