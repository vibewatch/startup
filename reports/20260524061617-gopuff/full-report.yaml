  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >
              Gopuff generates revenue through six distinct streams anchored in its vertically integrated
              micro-fulfillment model. The largest and most structural stream is product margin: Gopuff purchases
              consumer packaged goods wholesale and resells at retail prices, capturing an estimated 20–30% gross margin
              on product before delivery and warehouse overhead. Unlike marketplace models (e.g., DoorDash), Gopuff owns
              the inventory end-to-end, giving it direct margin capture but also full inventory-carrying risk. Each
              fulfillment center stocks approximately 4,000 SKUs spanning snacks, beverages, household goods, alcohol,
              and healthcare products. Delivery fees of approximately $1.95–$2.95 per order provide per-transaction
              revenue and are waived for Gopuff Fam subscribers. The Gopuff Fam subscription—$7.99 per month or $5.99
              per month paid annually, raised from $5.95 in 2023—generates recurring revenue; a discounted Student Fam
              tier at $3.99 per month is available at more than 1,000 college campuses. The retail media platform
              enables CPG brands to pay for sponsored in-app placements and, increasingly, non-endemic advertisers
              (e.g., Apple TV+, Noom) to target Gopuff's audience during the post-checkout delivery window—a roughly
              30-minute engagement window between purchase and arrival. Private-label products sold under the
              "Basically" brand carry above-average margins versus branded equivalents. Alcohol and regulated-product
              delivery through the BevMo and Liquor Barn banners adds compliance-fee layers atop standard product
              margins. Third-party estimates place Gopuff's total revenue at approximately $1.2 billion in 2023, a
              20–22% decline from 2022 (~$1.55 billion) and sharply below the 2021 peak (~$1.88 billion). Estimated
              2024–2025 revenue from analyst sources ranges from $700 million to $1 billion; the company has not
              publicly disclosed exact revenue figures.
