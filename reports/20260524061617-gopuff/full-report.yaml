  - id: FE001
    title: Gopuff Product and Technology Architecture Stack
    type: stack
    layout: standard
    summary: >
      Five-layer architecture spanning consumer interfaces, order and inventory management, fulfillment and routing,
      intelligence and personalization, and partner/monetization.
    data:
      layers:
        - label: Consumer Interfaces
          modules:
            - iOS app (Swift, 4.8/5, 237K+ ratings)
            - Android app (Kotlin, Google Play)
            - Desktop & mobile web (React/Redux, 2025 redesign with MFC livestream)
        - label: Order & Inventory Management
          modules:
            - OMS state machine (Pending→Confirmed→Preparing→Packed→Dispatched→Delivered)
            - Real-time inventory reservation (blocks stock before payment confirmation)
            - Payment processing (credit/debit, Apple Pay, Venmo, SNAP EBT)
        - label: Fulfillment & Routing
          modules:
            - MFC operations software — picking/packing workflow, item scanning
            - Kafka event-driven courier dispatch (Android Driver app, 4.1/5, 500K+ downloads)
            - Third-party linehaul carriers for inter-MFC inventory replenishment
        - label: Intelligence & Personalization
          modules:
            - Demand forecasting & replenishment ML (hyperlocal, proprietary)
            - Gopuff Ads AI/ML (1,000+ real-time variables, <50ms serving, 10-year training data)
            - Recommendation engine (personalized storefront, trending items, birthday offers)
        - label: Partner & Monetization Layer
          modules:
            - Gopuff Ads Platform (objective-based buying, Brand Shops, AdAdapted Add-It)
            - Powered by Gopuff / Storefronts API (Shopify integration, UPC SKU mapping)
            - Koddi incrementality measurement + The Trade Desk programmatic access
