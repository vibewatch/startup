  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - factor
      - direction
      - timing
      - implication for Gopuff
      - diligence ask
    rows:
      - - Urban density enabling micro-fulfillment hub viability
        - Tailwind
        - Medium term (2-4 years)
        - >-
          London's 9,648 people/km² and US metro density support 8+ deliveries/rider/hr at breakeven; Gopuff already has
          the largest dark store network in US/UK
        - Verify dark store coverage density vs. competitor rollout; confirm UK Mordor Intelligence hub economics
      - - Entrenched speed expectations (77% expect <2hr delivery)
        - Tailwind
        - Short term (already in market)
        - >-
          Consumers who have used Gopuff or peer platforms are conditioned to expect speed; churn to physical store
          declines over time
        - Track repeat order rate and FAM conversion; survey customer NPS vs. substitute services
      - - Amazon-Gopuff UK partnership (15-min delivery on Amazon.co.uk)
        - Tailwind
        - Short term
        - >-
          Validates Gopuff infrastructure quality; increases order volume without Gopuff absorbing customer acquisition
          cost
        - Confirm contract terms and revenue share; assess dependency concentration on Amazon as a distribution channel
      - - FAM membership program growth
        - Tailwind
        - Short term
        - Subscriptions raise order frequency; contribution profit improvement directly tied to membership
        - Request FAM subscriber count, monthly order frequency, and churn rate by cohort
      - - SNAP EBT acceptance nationwide
        - Tailwind
        - Short term
        - >-
          Expands SAM to 42M SNAP recipients; improves social equity positioning with cities that have challenged dark
          store zoning
        - Track SNAP order volume and basket size; confirm regulatory goodwill outcomes in contested zoning markets
      - - Brand partnership and advertising revenue
        - Tailwind
        - Medium term
        - >-
          Starbucks, Disney, Amazon, Tom Brady ventures use Gopuff for rapid product drops; high-margin incremental
          revenue stream
        - Request advertising revenue as % of total revenue; confirm contract pipeline and average deal size
      - - Gig worker misclassification regulation (DC AG lawsuit, MA citations)
        - Headwind
        - Short to medium term
        - >-
          Reclassification to employee status raises labor costs significantly; estimated 15-30% delivery cost increase
          if minimum wage and benefits apply
        - Monitor DC litigation outcome; model downside unit economics under employee-status scenario
      - - Dark store zoning opposition and regulation
        - Headwind
        - Short term
        - >-
          Community impact studies, buffer zones, and retail mix mandates slow new dark store openings and add
          compliance cost
        - Map pending zoning applications; identify cities where Gopuff faces material permit delays
      - - Post-pandemic demand normalization
        - Headwind
        - Already in market
        - >-
          US q-commerce CAGR at 7-8% vs. 65% during pandemic; addressable base is not growing fast enough to offset
          competitive pressure alone
        - >-
          Review monthly order volume trends since 2022; verify claimed "record revenue" aligns with stable to growing
          order counts not only rising basket size
      - - Competitor expansion (DoorDash DashMart +45% GMV YoY)
        - Headwind
        - Short to medium term
        - >-
          DoorDash's distribution leverage and existing Dasher network lower their cost to enter the c-store instant
