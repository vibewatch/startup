      - number: '8.2'
        title: Comparable Valuation Analysis — Public Peers, Private Rounds, and Q-Commerce Benchmarks
        blocks:
          - type: paragraph
            body: >
              Gopuff's implied EV/Revenue multiple at the $8.5 billion mark is approximately 9–11x based on estimated
              $800M–$1.0B annualized net revenue—a premium the public market has not awarded to any comparable delivery
              platform at scale as of May 2026. The two closest public peers, DoorDash and Instacart, trade at
              structurally lower multiples, though both have important distinctions from Gopuff's model.

              DoorDash (NASDAQ: DASH) trades at approximately 4.6x EV/Revenue on approximately $14.7 billion in LTM
              revenue as of 2026, with an enterprise value of roughly $67.6 billion. DoorDash's approximately 31%
              revenue growth rate, expanding EBITDA, and asset-light marketplace model justify a premium to pure
              delivery peers; nevertheless Gopuff's implied 9–11x is roughly double DoorDash's multiple despite
              DoorDash's materially larger scale, more visible profitability, and public-market liquidity premium. The
              structural distinction is important: DoorDash operates as a marketplace (connecting consumers,
              restaurants, and retailers) and does not warehouse inventory, whereas Gopuff's vertically integrated
              dark-store model owns the full supply chain.

              Instacart (NASDAQ: CART) trades at approximately 2.2–2.3x EV/Revenue on approximately $4.0 billion in LTM
              revenue and a roughly $9–10 billion market capitalisation as of May 2026. Instacart reported Q1 2026 GTV
              growth of 13% and total revenue growth of 14% year-over-year, with adjusted EBITDA of $300 million
              representing a 29% EBITDA margin; GAAP net income was $144 million, up 36% year-over-year. Instacart's
              grocery-plus-advertising model overlaps with Gopuff's retail media ambitions, but the
              pure-grocery-platform structure is less capital-intensive than Gopuff's network of owned fulfillment
              centers.

              Among q-commerce private peers, the landscape constitutes a cautionary dataset. Getir peaked at a $12
              billion valuation but by 2024 had retreated to its Turkish home market, exiting the US, UK, and most
              European countries while destroying the majority of the approximately $1.8 billion it raised. Gorillas,
              once valued above $1 billion in Europe, was acquired by Getir and subsequently wound down. European
              venture investors channeled an estimated $5.5 billion into q-commerce during the pandemic boom; most of
              that capital is impaired. Gopuff's survival as the last major standalone US and UK instant-commerce
              operator provides a market-clearing, scarcity-value premium, but that premium alone does not justify a
              4–5x multiple differential over profitable listed peers.

              A defensible blended multiple framework applies 5–8x EV/Revenue to Gopuff's revenue base, recognizing the
              advertising/media layer, the US market-leader scarcity premium, and a 30–40% private-company discount
              reflecting illiquidity and financial opacity. At $900M revenue and a 6x blended multiple, intrinsic value
              would approximate $5.4 billion—meaningfully below the $8.5 billion mark. The gap implies the current mark
              prices in either undisclosed revenue materially above public estimates or a rapid path to profitability
              and multiple re-rating that is not yet supported by published financials.
