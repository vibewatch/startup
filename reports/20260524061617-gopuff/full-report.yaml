      - number: '1.3'
        title: Capital History, Valuation, and Investor Map
        blocks:
          - type: paragraph
            body: >-
              Gopuff has raised over $5.25 billion in total funding since its founding, across a sequence of rounds that
              tracked the company's pandemic-era hypergrowth and subsequent reset. Early capital came from Anthos
              Capital in 2015–2016 during seed and Series A rounds. Valor Equity Partners and Accel entered in
              2017–2018. SoftBank Vision Fund became the dominant capital partner starting in 2019, participating in
              Series E ($750 million), Series F ($380 million), and both the March 2021 Series G ($1.15 billion) and
              July 2021 Series H ($1 billion at a $15 billion valuation). Fidelity, Baillie Gifford, Eldridge
              Industries, D1 Capital, and Blackstone also participated across the 2020–2021 rounds.


              The November 2025 round of $250 million — led by Eldridge Industries and Valor Equity Partners, with
              Baillie Gifford, George Ruan (Honey co-founder), Yakir Gabay, and the co-founders themselves also
              participating — set the current $8.5 billion valuation. This represents a 43 percent markdown from the
              2021 peak of $15 billion, and reflects both the recalibration of consumer-technology valuations and
              Gopuff's deliberate shift from growth-at-all-costs to a profitability-first posture. Eldridge investor
              Todd Boehly described Gopuff as "the last one standing" in its business model, suggesting the round was
              motivated partly by conviction that competitive consolidation has removed most major threats.


              The capital-efficiency ratio — approximately 1.55x valuation-to-funding — is modest, and the markdown from
              peak implies prior investors who entered above $8.5 billion are underwater on a market-to-market basis. No
              secondary transaction pricing or cap-table details are public. Total lifetime raising of $5.25–$5.5
              billion across sources is a reasonable estimate but has not been formally confirmed by the company in a
              public filing.
