            title: Data Room Required Before Financial Underwriting
            body: >
              All key financial metrics—net revenue, gross margin by stream, monthly burn, cash on hand, subscriber
              count, and EBITDA—are undisclosed for this private company. The company's claim of "record revenue and
              contribution profit" in 2025 is unaudited. Before committing, obtain: (1) audited FY2024 financials; (2)
