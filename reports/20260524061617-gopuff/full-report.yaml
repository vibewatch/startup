      - number: '8.3'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >
              Three scenarios bound the valuation range. All assume a 2026–2028 exit window via IPO or strategic sale; a
              delayed or failed exit would compress outcomes toward the bear case regardless of operational performance,
              as the preference stack accrues and investor patience erodes.

              The bull case requires Gopuff to accelerate revenue toward $1.2 billion or above in 2026–2027, demonstrate
              free cash flow positivity in at least two consecutive quarters before IPO, and access the public market at
              a 12–14x EV/Revenue multiple. At $1.2 billion revenue and 12x, exit value reaches approximately $14.4
              billion—a 69% premium to last-round mark. The critical re-rating assumption is that advertising/retail
              media revenue reaches 20%+ of net revenue, justifying a blended multiple materially above pure-delivery
              peers. Catalysts include a well-received S-1 with strong unit-economics disclosure, at least two
              profitable quarters, and a supportive consumer-tech public market environment in 2026–2027.

              The base case assumes revenue in the $900M–$1.0 billion range, improving but not yet free-cash- flow
              positive at the corporate level, and an IPO in 2027 at a 10–11x EV/Revenue multiple. At $950 million
              revenue and 10.5x, the exit value approximates $9.975 billion—essentially flat to the last-round mark.
              Late-round preferred holders achieve approximately par returns; common holders see modest upside. The
              principal execution risk in the base case is that the IPO price band is set below the $8.5 billion private
              mark once public investors discount with a liquidity preference, financial opacity, and
              preference-overhang lens.

              The bear case assumes revenue stagnation or decline below $800 million, renewed cash burn above $200
              million per year, and a strategic or distressed exit at $4–6 billion. At $5 billion, holders of preferred
              shares from the 2021 Series H at $15 billion face a near-complete capital loss on their invested
              principal, and common stockholders are effectively wiped out. Bear-case probability signals include:
              revenue growth reverting to zero or negative, failure of the SNAP EBT or advertising revenue streams to
              scale, prolonged management turnover, or a second consecutive year of cash burn above the 2023 level.
