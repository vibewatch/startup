      - number: '7.4'
        title: Partner and Dependency Risk — Amazon, Starbucks, Capital Concentration
        blocks:
          - type: paragraph
            body: >-
              Gopuff has built revenue and growth on two flagship brand partnerships—Amazon and Starbucks—and one anchor
              capital provider, Eldridge Industries. Each relationship is strategically valuable but introduces
              concentrated counterparty exposure.


              The Starbucks partnership, announced in 2024 and expanded in May 2025 to 24/7 specialty coffee delivery
              across Philadelphia and other markets, integrates Starbucks-trained baristas into Gopuff MFCs. Eighty
              percent of Starbucks delivery orders through Gopuff also include other Gopuff grocery items, making
              Starbucks both a customer acquisition driver and a basket-size lever. A partnership termination or
              renegotiation would therefore affect Gopuff's order frequency, basket economics, and brand association
              simultaneously. Starbucks is the larger and more powerful party; contract terms, exclusivity windows, and
              renewal conditions are not public.


              The Amazon partnership routes Gopuff's grocery fulfillment through the Amazon marketplace in the UK,
              positioning Amazon as the demand-generation surface that Gopuff supplies. Amazon has a history of using
              marketplace partnerships to acquire operational knowledge and then build competing in-house capabilities
              or renegotiate terms aggressively. Technical integration depth—inventory sync, routing APIs, shared
              customer data—makes a rapid pivot away from the partnership operationally expensive. Eldridge Industries
              leading the November 2025 round creates capital-provider concentration; any shift in Eldridge's investment
              strategy or portfolio priorities could limit Gopuff's ability to raise follow-on capital at acceptable
              terms.
