            title: Unit Economics Viable Only in Dense Urban Cores
            body: >
              Network-wide per-order EBITDA of approximately $0.88 (before fixed overhead) versus ~$3.00 at mature
              high-density sites illustrates the fundamental density dependency. Third-party failure analyses confirm
              that delivering sub-$15 orders profitably requires density thresholds achievable only in the densest urban
              neighborhoods. Gopuff burned through an estimated $400–$600 million in 2021 alone despite reaching ~$1.88
              billion in revenue; the model proved unprofitable at national scale. Retrenchment to core markets reduces
              the TAM the business can address.
            calloutType: risk
            claimRefs:
