      - number: '8.5'
        title: Recommendation, Exit Readiness, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Based on evidence gathered through May 2026, the chapter recommendation is TRACK at a confidence level of
              MEDIUM. Valuation stance is STRETCHED. Risk rating is HIGH.

              The private entry price of $8.5 billion is not justified on a public-market-comps basis absent clear
              evidence of either: (a) revenue materially above the $800M–$1.0B estimate, ideally approaching $1.2
              billion or more; or (b) EBITDA-positive operating results with a credible free-cash-flow timeline
              disclosed in an S-1 or equivalent document. The company has demonstrated genuine operational
              improvement—survivor premium in the US and UK instant-commerce category, improving contribution economics,
              partnerships with premier consumer brands, and the highest- quality CFO hire in its history. But these
              positives appear priced into the current mark or above it on a public-comps basis. A re-entry at IPO
              pricing, especially following S-1 disclosure of a clear financial trajectory, represents a more
              disciplined risk/return profile.

              Exit readiness is high in structural terms: the CFO appointment signals imminent IPO preparation, and the
              PitchBook indicator at 96%+ reflects market consensus that Gopuff is on track for a 2026–2027 public
              offering. However, no S-1 has been filed as of May 2026, no price range has been announced, and private
              financials remain opaque to outside investors. The thesis-break triggering a downgrade to AVOID includes:
              (1) renewed revenue decline below $700 million, (2) cash burn returning above $300 million per year, or
              (3) a primary round below $6 billion valuation, which would confirm market consensus on overvaluation and
              impair the IPO narrative.

              The primary diligence agenda before committing capital at the current private mark centres on six items:
              audited GAAP financial statements; FCF trajectory by quarter; advertising and SNAP revenue breakdown;
              preference waterfall model at various exit scenarios; unit economics by geography; and current headcount
              and labour cost structure following the 2024 restructuring. Without these inputs, an $8.5 billion private
              investment is fundamentally a momentum bet on IPO execution rather than a fundamentals-anchored valuation.
            claimRefs:
              - CV044
              - CV045
              - CV046
              - CV047
              - CV048
