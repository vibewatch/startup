      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Leadership Through Consolidation
            body: >
              Gopuff is the only remaining US and UK instant-commerce operator at scale following the exit or failure of
              every direct competitor including Gorillas, Getir (US/UK), Jokr, Fridge No More, and Buyk. This survivor
              premium is real, non-trivial to replicate, and provides a durable near-term moat in urban markets. The
              contribution-profit improvement above $4 per order suggests the vertically integrated model can work
              economically in high-density geographies.
            calloutType: strength
            claimRefs:
              - CV037
              - CV021
              - CV022
              - CV038
          - type: callout
            title: 'Preference Overhang: $5.25B+ Ahead of Common Equity'
            body: >
              With over $5.25 billion in total disclosed cumulative funding, Gopuff's liquidation preference stack means
              common stockholders—including employees holding options or RSUs—see no meaningful proceeds below
              approximately $10–12 billion on exit. At the current $8.5 billion mark, late-round preferred from the
              November 2025 round barely achieves par, and all 2021 round investors are underwater. Secondary-market
              shares traded at approximately an 84% discount to their Series-X implied level, reflecting this structural
              dynamic.
            calloutType: risk
            claimRefs:
              - CV041
              - CV010
              - CV015
              - CV001
          - type: callout
            title: 'TRACK: Await S-1 and IPO Price Discovery'
            body: >
              The TRACK recommendation reflects genuine operational improvement—survivor premium, improving contribution
              economics, and credible IPO signalling—set against an entry price that exceeds defensible public comps. No
              S-1 has been filed. Audited financials, FCF trajectory, and the advertising revenue breakdown are the
              three most critical data points needed to underwrite the premium. The disciplined entry point is IPO
              pricing, where financial transparency and public- market price discovery can anchor the multiple.
            calloutType: recommendation
            claimRefs:
              - CV043
              - CV044
              - CV045
              - CV048
