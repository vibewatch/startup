            body: >
              Gopuff's decision to own inventory and operate its own MFCs — rather than broker orders through
              third-party stores — creates structural advantages that compound over time: no substitutions, real-time
              stock visibility, closed-loop behavioral data for ML training, rapid private-label iteration, and a retail
