            title: Retail Media Is a Structural High-Margin Lever
            body: >
              Gopuff's in-house advertising platform, built out in 2023–2024, allows the company to monetize order
              frequency and post-checkout attention without incremental delivery cost. CPG ad spending on retail media
              networks is projected at $52–$61 billion in the US annually; Gopuff's targeted, high-intent audience is
