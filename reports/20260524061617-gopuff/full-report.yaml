      - number: '7.6'
        title: Execution Risk, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Gopuff's execution risk centers on three interlocking vulnerabilities: co-founder key-person
              concentration, IPO-preparation distraction, and the residual risk that profitability targets are pushed
              forward repeatedly without a clear structural change. Co-founders Yakir Gola and Rafael Ilishayev remain
              co-CEOs. The dual structure has advantages in speed and alignment but creates a single departure risk
              where losing either founder would trigger investor confidence questions and leadership vacuum. Neither has
              a clear successor publicly identified.


              IPO preparation—signaled by the CFO appointment in November 2025 and the Howard Schultz board seat in
              April 2026—consumes management attention and creates window-dependency risk. If the IPO market closes
              before filing, Gopuff would need to either raise another private round (likely at further valuation
              compression) or achieve cash-flow self-sufficiency faster than its current trajectory implies. The company
              has stated a "path to profitability" repeatedly since 2022 without producing audited evidence of
              company-wide EBITDA break-even. Each delay raises the question of whether the model is fundamentally
              constrained or whether the company is still executing toward a genuine inflection.


              Kill criteria for this thesis should be tied to observable, external events rather than company guidance:
              an adverse final ruling in the DC or MA misclassification case that requires retroactive back-pay at
              scale; loss of the Starbucks or Amazon partnership without a replacement of comparable basket and brand
              value; a further primary funding round priced at less than $6 billion; or a regulatory action that
              permanently revokes alcohol or cannabis delivery licenses in more than one top-five market. Each of these
              events individually would be cause for underwriting re-review; in combination they would represent a
              thesis-breaking scenario.
