      - number: '2.2'
        title: Market sizing lenses and TAM-SAM estimates
        blocks:
          - type: paragraph
            body: >-
              Multiple sizing lenses capture different layers of the opportunity. The broadest lens — global quick
              commerce market — stands at $73.93 billion in 2025 according to Coherent Market Insights and is projected
              to reach $582.59 billion by 2032 at a 34.3% CAGR, though this figure is Asia-Pacific dominated (India
              alone leading with 17% annual growth rates) and is not representative of Gopuff's US/UK geography.

              For the US market, which is Gopuff's primary geography, Coherent Market Insights sizes quick commerce at
              $8.78 billion in 2025, growing to $15.24 billion by 2032 at an 8.2% CAGR. MetricsCart similarly cites the
              US quick commerce market at $7.5 billion in 2023 with a projected $12.7 billion by 2030 at 8% CAGR. These
              estimates converge on a US quick commerce SAM of roughly $9-10 billion in 2026. Gopuff's GMV has been
              estimated by PlottData at $2.5 billion annually, implying a market share in the 25-30% range in the US
              pure-play instant delivery segment.

              The UK market is sized at $2.83 billion in 2025 by Mordor Intelligence, with 6.99% CAGR to $3.97 billion
              by 2030. Key UK revenue concentration is in London, with Scotland identified as the fastest-growing
              region. Gopuff operates in 16+ UK cities, including London, Birmingham, Manchester, Bristol, and Cardiff.

              A broader instant delivery lens from MarkWide Research puts the US instant delivery market at $38.7
              billion in 2026 at a 16.4% CAGR through 2035, but this includes all sub-two-hour delivery categories
              including food delivery platforms that are not direct comparables to Gopuff's owned-inventory model. North
              American quick commerce GMV across all platforms reached $22 billion in 2025 per PlottData (42% of the
              $52B global total), providing an upper-bound lens.

              Gopuff's SOM at the product level is more constrained: the company's revenue of $1.2 billion in 2023
              represents a rough gross revenue capture rate of 13-16% of its estimated GMV range. With 1.8 million
              active users as of 2023 data, the annual revenue per user implied by Business of Apps data and the
              company's own KPIs is roughly $667/year. The DemandSage data notes an average annual ARPU for quick
              commerce of $288.79 per user across the sector, underscoring that Gopuff's higher-than-average ARPU
              reflects its owned-inventory model's ability to capture retail margin, not just delivery fees.
