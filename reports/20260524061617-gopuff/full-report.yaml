  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: |
              Gopuff competes across four competitive categories: direct instant-delivery peers who
              operate owned fulfillment infrastructure, marketplace platform competitors who aggregate
              third-party retailer inventory, incumbent convenience retailers who have added delivery
              capability to existing store networks, and the status-quo alternative of personal
              convenience-store visits or next-day grocery delivery.

              **Direct owned-infrastructure peers** are Gopuff's most analogous competitors—companies
              that operate their own dark stores or micro-fulfillment centers (MFCs) to execute
              sub-30-minute delivery. In the US and UK, this category is now dominated by Gopuff itself
              after the 2022–2024 collapse of European dark-store operators Getir, Gorillas, Buyk,
              Fridge No More, Jiffy, and Zapp. DoorDash DashMart, with over 100 proprietary locations
              as of 2025, is the most credible remaining direct competitor in this category in the US.

              **Marketplace platform competitors** include Instacart (grocery aggregator with 21.6% US
              online grocery market share and $10B+ quarterly GTV as of Q1 2026) and Amazon Fresh.
              These platforms scale through retailer partnerships rather than owned inventory, giving
              them capital-efficient breadth but limiting delivery speed to typically 30–90 minutes
              except where Gopuff itself is a fulfillment partner (as in the Amazon UK arrangement
              effective July 2025).

              **Incumbent convenience competitors** are led by 7-Eleven's 7NOW delivery service, which
              spans 7,500+ stores in the US, targets $1B in annual North American sales by end of
              fiscal 2025, and achieves an average 28-minute delivery time. Unlike pure-play delivery
              apps, 7NOW leverages 7-Eleven's physical store footprint without requiring separate
              fulfillment infrastructure capital expenditure.

              **Status-quo substitutes** remain the largest competitive alternative in practice: the
              majority of US convenience and grocery purchases still occur via in-store visits or
              scheduled grocery delivery. Gopuff must continually justify the premium of immediacy
              against the low friction of walking to a nearby store.
