      - number: '4.3'
        title: Capital Adequacy and Financing History
        blocks:
          - type: paragraph
            body: >
              Gopuff has raised approximately $5.5 billion in total capital since its 2013 founding across multiple
              equity rounds; the detailed round-by-round chronology is covered in the Company Overview chapter. In
              November 2025, Gopuff closed a $250 million funding round led by Eldridge Industries and Valor Equity
              Partners, with participation from Baillie Gifford, Robinhood, Equalis Capital, George Ruan, Yakir Gabay,
              and the co-founders. The round implies an $8.5 billion post-money valuation—significantly below the 2021
              peak of $15 billion but sustained after years of deep restructuring. Simultaneous with the raise, Gopuff
              appointed Matt McBrady as Chief Financial Officer; McBrady brings experience from BlackRock's
              Multi-Strategy Hedge Fund program, Bain Capital, and two prior IPO processes (Axon, aQuantive). The
              company stated the capital will be directed toward AI investment, consumer-experience improvements, and
              infrastructure expansion. Monthly cash burn and exact cash on hand post-raise are not publicly disclosed.
              Gopuff's UK subsidiary (GOBRANDS UK HOLDINGS LTD, Companies House number 12793914) filed full annual
              accounts to December 31, 2024 on December 24, 2025, representing the only public financial filing for any
              Gopuff entity; these accounts cover the UK subsidiary only. A new charge (MR01) was registered against the
              UK entity on May 11, 2026, indicating active debt or financing obligations in the UK market. The capital
              efficiency ratio (valuation ÷ total raised) stands at approximately 1.55×, reflecting the steep valuation
              correction from peak.
