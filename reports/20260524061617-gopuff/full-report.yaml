  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Consumer App, Shopping Experience, and Product Surface
        blocks:
          - type: paragraph
            body: >
              Gopuff's primary consumer touchpoints are its iOS and Android apps and a substantially redesigned web
              experience launched in September 2025. The iOS app (GoBrands, Inc.) carries a 4.8/5 rating from over
              237,000 ratings on the Apple App Store and offers grocery delivery, alcohol (in eligible markets),
              household essentials, and private-label products from 500+ MFC locations across 1,000+ US and UK cities. A
              key UX differentiator is real-time local inventory display: the app or website queries the nearest MFC via
              IP-address detection before a user logs in, surfacing only what is physically in stock and eliminating the
              substitutions and out-of-stock surprises endemic to marketplace-model competitors. Gopuff claims a 99.5%
              order accuracy rate, attributing it directly to inventory ownership rather than brokered marketplace
              fulfillment.

              The September 2025 web redesign introduced a live MFC video stream, real-time item-by-item packing updates
              displaying the picker's name, AI-powered personalized recommendations driven by order history and
              location, and a hyperlocal heatmap showing community ordering trends. These features were described by
              co-CEO Yakir Gola as core to Gopuff's "instant in our DNA" positioning. The redesigned experience was
              initially desktop- and mobile-web-focused, with app feature parity planned in subsequent releases. The Fam
              subscription membership offers free delivery, exclusive low prices on essentials (company examples: $2
              organic eggs, milk, paper towels), a "Fam20" 20-minute delivery guarantee in select markets,
              birthday-specific offers, and weekly product drops. Payment options span credit/debit cards, Apple Pay,
              Venmo, and SNAP EBT for eligible groceries. The product catalog runs to approximately 4,000–5,000 SKUs per
              MFC, including national brands and Gopuff's own private-label portfolio.
