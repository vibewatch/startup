      - number: '1.5'
        title: Restructuring, Layoffs, and the Profitability Pivot
        blocks:
          - type: paragraph
            body: >-
              Gopuff's trajectory since mid-2022 is best understood as a forced repricing of the
              growth-versus-profitability trade-off that the entire q-commerce sector failed to solve before capital
              markets tightened. The company executed five rounds of workforce reductions between March 2022 and May
              2024, cutting approximately 3,850 roles: 450 in March 2022, 1,500 (10%) in July 2022, 250 in October 2022,
              roughly 100 in March 2023, and 600 (6%) in May 2024. Simultaneously, it closed 76 US warehouses in July
              2022 (approximately 12% of its network), exited Spain entirely in August 2022 (laying off all 186 Spanish
              employees), and wound down or consolidated its France and Luxembourg operations to focus European
              resources on the UK.


              CEO Yakir Gola publicly framed the pivot in the Financial Times and Bloomberg as a deliberate decision to
              "be the best in the world at instant delivery" rather than chase geographic breadth. He emphasized that
              Gopuff was burning approximately $400 million in 2023 and set a goal of free-cash-flow positivity by
              year-end 2024. The November 2025 funding materials cited "record financial performance" and a positive
              contribution margin above $4 per order, but full-year 2024 and 2025 free-cash-flow status has not been
              independently confirmed.


              The competitive landscape rewarded Gopuff's survival instincts. Major European and US q-commerce rivals —
              Getir, Gorillas, Flink, Jokr — all exited the US or shut down between 2022 and 2024. DoorDash's
              acquisition of Deliveroo and the retreat of most dedicated fast-delivery startups left Gopuff as the sole
              national-scale owned-inventory instant-delivery operator in the United States. Investor Todd Boehly's
              framing of Gopuff as "the last one standing" at the November 2025 close reflects this strategic
              positioning. The unresolved diligence question is whether the company has achieved sustainable unit
              economics — not just positive contribution margins — across its full MFC network, including allocated
              overhead and capex.
            claimRefs:
              - CO034
              - CO035
              - CO036
              - CO037
              - CO038
