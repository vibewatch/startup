      Tech stack details (Kafka, Databricks, React/Redux, Python, Ruby on Rails, Docker) are derived from third-party
      technical analysis and have not been officially confirmed by Gopuff. Layer ordering reflects data/control flow;
      actual microservices topology is proprietary.
