  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and scope definition
        blocks:
          - type: paragraph
            body: >-
              Gopuff's relevant market is defined by a specific behavioral trigger — the "instant need" — rather than by
              a broad grocery or retail category. A consumer running out of diapers at midnight, craving a snack while
              studying, or needing cold medicine before a morning flight is not served by a two-day Amazon shipment or a
              weekly grocery delivery slot. Gopuff positions itself as the digital replacement for the corner
              convenience store, operating exclusively from owned-inventory micro-fulfillment centers (dark stores) that
              hold 1,500-2,500 SKUs of snacks, beverages, household essentials, OTC pharmaceuticals, alcohol, and fresh
              food.

              The appropriate market boundary therefore includes instant-delivery platforms promising sub-30-minute
              fulfillment of everyday essentials (the "q-commerce" or quick commerce category), convenience store
              delivery via apps, and on-demand last-mile fulfillment of everyday items within urban and dense suburban
              geographies. It excludes standard same-day grocery delivery (45-90 minute windows), scheduled meal-kit
              subscriptions, bulk warehouse retail, and general e-commerce categories like apparel or electronics.

              The US convenience store sector is a $957 billion market as of 2025, but the addressable slice for instant
              digital delivery is far narrower. Approximately 152,000 physical US convenience stores exist — the digital
              equivalent Gopuff represents competes for impulse and urgency-driven spend from that base. The US quick
              commerce sub-segment is estimated at $8.78 billion in 2025, reflecting only those purchases made through
              instant-delivery platforms offering sub-two-hour fulfillment. The UK quick commerce market adds $2.83
              billion, bringing Gopuff's combined geographic addressable market to roughly $11.6 billion in 2025.

              Adjacent substitutes that set the market boundary's ceiling include traditional c-store walk-in purchases,
              same-day grocery delivery (Instacart, Ocado), marketplace aggregators (DoorDash DashMart, Uber Eats), and
              Amazon Fresh quick delivery. Gopuff's differentiation — owned inventory, no reliance on third-party
              retailer availability, 24/7 operation in most markets — defines a durable sub-segment rather than a niche,
              but its monetizable reach remains constrained to geography where micro-fulfillment density supports the
              delivery speed promise.
