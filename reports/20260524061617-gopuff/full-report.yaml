      - number: '2.5'
        title: Adoption constraints and adverse observations
        blocks:
          - type: paragraph
            body: >-
              Quick commerce faces structural profitability challenges that are well-documented and directly relevant to
              Gopuff's market trajectory. The StrangeMatter analysis of the Gorillas collapse illustrates the sector's
              failure mode: in 2021, $5.5 billion of venture capital flooded into European app-based grocery delivery,
              yet by 2025 most of those companies no longer exist. Gorillas, Fridge No More, Buyk, Jokr, and others
              closed or withdrew from their primary markets. The fundamental problem is unit economics: small basket
              sizes (averaging $10-20 across the industry), high last-mile labor costs, and underutilized dark stores
              during off-peak hours make per-order contribution margins negative without high order frequency.

              Regulatory pressure on gig worker classification is a material constraint. In March 2025, the DC Attorney
              General filed a lawsuit against Gopuff alleging misclassification of delivery workers as independent
              contractors since 2014, claiming this allowed the company to avoid minimum wage, overtime, sick leave, and
              workers' compensation obligations. Massachusetts's AG office also previously issued $6.2 million in
              citations against a national delivery service company over misclassification. If courts or regulators
              reclassify Gopuff's driver workforce, labor costs rise substantially, worsening unit economics at the
              delivery margin.

              Dark store zoning and neighborhood opposition constrain geographic expansion. FreightAmigo identifies 2025
              as a year of intensifying zoning rules for dark stores: classification ambiguity between warehouse and
              retail uses stalls permits; residential areas object to traffic, noise, and parking impacts from 24/7
              operations; and cities are imposing buffer zones, noise caps, and community impact study requirements. In
              commercial zones, some cities mandate that dark stores occupy no more than 20% of a commercial space,
              forcing Gopuff to operate hybrid or invest in standalone purpose-built facilities.

              Concentration risk in the competitive landscape is a double-edged finding. The market has consolidated to
              a small number of survivors — which validates Gopuff's endurance — but also means DoorDash DashMart is
              growing GMV at 45% annually per PlottData while Gopuff's GMV contracted by roughly 15% YoY in the same
              data. The CTOL Digital analysis notes Gopuff's $8.5 billion valuation in late 2025 is 43% below its 2021
              peak of $15 billion, and represents a massive discount from a rumored $40 billion internal valuation in
              2022. Most US quick commerce firms remain unprofitable, with Gopuff still reporting losses per
              DemandSage's FAQ.

              Demand normalization post-pandemic has dampened growth to 7-8% CAGR in the US versus triple-digit growth
              in 2020-2021. The sector's "second act" — which Gopuff's own $250M fundraise press positions itself within
              — requires the company to convert loyal repeat customers into high-frequency FAM members, expand
              high-margin SKUs (fresh food, private label, brand partnerships), and grow advertising revenue to offset
              thin per-order margins on commodity convenience items.
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM037
