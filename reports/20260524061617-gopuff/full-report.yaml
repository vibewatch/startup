      - number: '7.3'
        title: Operational Risk — MFC Unit Economics and Delivery Reliability
        blocks:
          - type: paragraph
            body: >-
              Gopuff's vertically integrated micro-fulfillment center (MFC) model is the core competitive asset, but it
              creates a high fixed-cost base that is sensitive to order density. Each MFC incurs lease obligations,
              warehouse labor, and last-mile delivery costs that must be spread over sufficient order volume before the
              center approaches contribution break-even. In low-density markets or during demand troughs, fixed costs
              are inescapable while variable revenue disappears. Gopuff's multiple rounds of warehouse closures and
              workforce reductions—10 percent of global headcount and closure of dozens of warehouses in July 2022,
              followed by a further 6 percent cut in May 2024—reflect the operational consequence of over-expansion into
              markets that could not support MFC economics. AI-driven demand forecasting reduced perishable waste by
              approximately 20 percent in pilot programs, which represents genuine efficiency progress, but it does not
              eliminate the fundamental density dependency.


              Customer-facing delivery quality remains a material operational risk. Gopuff's Trustpilot rating is 1.4
              out of 5 based on user reviews, with a "Bad" overall designation. Over 637 complaints appear on
              PissedConsumer covering incorrect deliveries, missing items, refund denials, and account suspension
              without recourse. Poor service quality directly accelerates customer churn in a category where DoorDash,
              Instacart, and Amazon same-day all compete for the same order occasion. Dark-store zoning resistance in
              dense urban markets adds a longer-term operational risk: several cities have enacted or considered
              restrictions on dark stores that would block new MFC openings or force relocations, raising site costs and
              slowing coverage expansion.
