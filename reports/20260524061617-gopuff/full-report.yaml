  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation History, Financing Context, and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              Gopuff's valuation arc traces the full cycle of q-commerce boom and correction. Founded in 2013 and
              bootstrapped until 2016, the company scaled through successive venture rounds, reaching unicorn status
              with its $750 million Series E in August 2019 led by SoftBank Vision Fund. Pandemic demand drove an
              extraordinary acceleration: the $380 million Series F in October 2020 (Accel, D1 Capital) valued the
              company at $3.9 billion, and within five months the March 2021 Series G ($1.15 billion led by SoftBank)
              tripled that to $8.9 billion. The July 2021 Series H—$1 billion led by a consortium including Blackstone,
              SoftBank, Fidelity, and Baillie Gifford—established the $15 billion peak that has served as the high-water
              mark ever since.

              The markdown cycle began as post-pandemic demand normalization exposed the unit-economics fragility common
              across the q-commerce category. Gopuff executed three rounds of workforce reductions: the July 2022 round
              cut approximately 1,500 employees (10% of global headcount) and closed 76 US warehouses; a smaller March
              2023 round removed approximately 100 staff; and a May 2024 round cut approximately 600 employees (6% of
              remaining staff) as the company publicly targeted free cash flow positivity by year-end 2024. Total
              disclosed layoffs from 2022 to 2024 exceeded 2,900 employees. Cash burn reached approximately $400 million
              in 2023 before the company claimed its "strongest financial performance in company history" in late 2025.

              The November 13, 2025 announcement of a $250 million raise at an $8.5 billion post-money valuation—led by
              Eldridge Industries and Valor Equity Partners with participation from Baillie Gifford, Equalis Capital,
              Robinhood, George Ruan (Honey co-founder), Yakir Gabay, and Gopuff's co-founders Yakir Gola and Rafael
              Ilishayev—confirmed a markdown of approximately 43% from the $15 billion peak. Bloomberg's reporting cites
              one person familiar with the matter, and the company confirmed the round via press release and official
              newsroom. Co-founder participation signals ongoing founder conviction. Simultaneously, Matt McBrady was
              named CFO; McBrady previously served as CIO of BlackRock's Multi-Strategy Hedge Fund program and helped
              guide both Axon and aQuantive through successful IPOs, making this hire a credible IPO preparation signal.

              Entry discipline demands attention to the capital structure. Total disclosed funding exceeds $5.25 billion
              across all rounds, implying a cumulative liquidation preference stack of roughly equivalent size. At the
              $8.5 billion mark, preferred investors from earlier higher-priced rounds hold claims senior to common
              stock; returns to common holders depend on an exit substantially above the preference pool.
              Secondary-market data shows Gopuff shares have traded at approximately an 84% discount relative to their
              Series-X (2021/2022) implied marks, underscoring broad market skepticism about near-term liquidity and
              exit value. The Prime Unicorn Index marked Gopuff down significantly during 2022–2023, well ahead of the
              formal round repricing.
