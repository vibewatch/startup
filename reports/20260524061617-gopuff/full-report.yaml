            title: Proprietary Architecture and Absent Certifications Are Material Due-Diligence Gaps
            body: >
              Gopuff's engineering surface is almost entirely proprietary: the GitHub organization contains only
              internal tooling, no SOC 2 or ISO 27001 certifications are publicly disclosed, and warehouse software
              architecture details are not available. For institutional investors or enterprise brand partners
              conducting security and technical due diligence, these absences require direct data-room access. The
              University of Michigan Tauber project (2024) also flagged unresolved MFC inbound-process standardization
              challenges, indicating that operational software tooling at the warehouse layer still has maturity gaps.
            calloutType: risk
            claimRefs:
              - CE020
