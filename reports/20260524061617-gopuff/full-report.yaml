      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: US + UK SAM is ~$11.6B in 2025, not the $73B global headline
            body: >-
              The global q-commerce TAM of $73.93B is Asia-Pacific dominated. Gopuff's geographic footprint — US and UK
              only after international market exits — maps to a combined narrow SAM of approximately $11.6B in 2025.
              Valuation underwriting should be anchored to this figure growing at 7-9% annually, not to the 34% global
              CAGR that reflects Indian and Chinese market growth Gopuff does not participate in.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: callout
            title: Worker misclassification litigation could reset unit economics
            body: >-
              The DC AG's March 2025 lawsuit and prior Massachusetts AG citations create material legal risk. If
              Gopuff's delivery workforce is reclassified from independent contractors to employees, delivery labor
              costs could rise 15-30%, which would require meaningful AOV increases or delivery fee hikes to maintain
              contribution margin. The company's response that it will "vigorously defend" the contractor model suggests
              no near-term resolution.
            calloutType: risk
            claimRefs:
              - CM037
              - CM038
          - type: callout
            title: Owned-inventory model is the durable differentiator in a consolidated market
            body: >-
              Every major pure-play q-commerce competitor in the US and UK has either closed, been acquired, or
              significantly retreated from the market (Gorillas, Getir, Jokr, Fridge No More, Buyk, Weezy). Gopuff has
              outlasted all of them by virtue of its vertically integrated model, which controls inventory availability,
              pricing margin, and delivery SLAs in a way marketplace aggregators cannot. This consolidation means
              Gopuff's $2.5B GMV position is far more defensible today than in 2021.
            calloutType: strength
            claimRefs:
