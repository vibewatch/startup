      - number: '4.2'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >
              Gopuff's cost structure is dominated by the fixed cost of owning and operating a network of
              micro-fulfillment centers (MFCs). Each MFC costs approximately $250,000 to launch and requires meaningful
              order density—measured in orders per driver-hour and orders per warehouse per day—before fixed overhead is
              recovered. Gopuff operates more than 200 MFCs in the US and UK as of 2026, down significantly from a peak
              of roughly 600 in 2021. Network-wide per-order EBITDA averaged approximately $0.88 before fixed overhead
              allocation, compared to approximately $3.00 EBITDA per order at mature, high-density warehouse locations—a
              3.4× variance illustrating the critical role of density. Last-mile delivery is performed by independent
              contractors rather than employees, reducing variable labor costs but creating ongoing legal classification
              exposure; the DC Attorney General filed suit against Gopuff in 2025 for worker misclassification, and
              Massachusetts regulators have challenged its alcohol compliance practices. The cost structure is therefore
              highly sensitive to order volume: fixed MFC costs do not flex with demand, making under-utilization in
              lower-density or newly launched markets disproportionately destructive to margins. Retail media revenue
              carries substantially higher gross margins than product delivery, making it a critical marginal-dollar
              lever. Exact current per-order economics, COGS, and contribution margin breakdowns are not publicly
              reported.
