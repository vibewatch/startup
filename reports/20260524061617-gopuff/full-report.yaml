      - number: '4.5'
        title: Financial Verdict and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >
              Gopuff's financial profile is characterized by high capital intensity, multi-stream revenue with uneven
              quality, and a trajectory from hypergrowth losses toward claimed contribution-level profitability. The
              November 2025 $250 million raise at $8.5 billion—56% below peak—signals sustained institutional conviction
              but also reflects the market's downward reassessment of instant-commerce economics. The fundamental
              structural challenge, documented adversarially by multiple analysts, is that last-mile delivery of sub-$15
              orders is profitable only in the densest urban areas: network-wide per-order economics historically lagged
              mature-site economics by ~3.4× ($0.88 vs. $3.00 EBITDA per order). Gopuff's 2021 estimated operating loss
              exceeded $400–$500 million despite strong revenue growth; the company subsequently laid off over 2,300
