      - number: '3.2'
        title: US Direct Competitor Profiles
        blocks:
          - type: paragraph
            body: |
              **Instacart (Maplebear Inc., NASDAQ: CART)** is the dominant US grocery delivery
              marketplace, operating in 5,500+ cities across North America and holding an estimated
              21.6% share of the US online grocery market as of 2025–2026. Instacart's business model
              is fundamentally different from Gopuff's: it is an asset-light marketplace that routes
              orders to in-store shoppers at partner retailers including Kroger, Albertsons, Costco,
              and over 1,500 retailers nationwide. In Q1 2026 Instacart surpassed $10 billion in Gross
              Transaction Value (GTV) and $1 billion in quarterly revenue for the first time, growing
              at 14% year-over-year. Its advertising platform, Carrot Ads, generated approximately
              $1.18 billion in 2024 (used by 7,500+ brands) and is projected to exceed $1.45 billion
              in 2025. Instacart's strategic advantage over Gopuff is breadth (17 million+ SKUs vs
              Gopuff's ~4,000 per MFC), retailer relationships, and technology scale; its structural
              weakness relative to Gopuff is slower delivery (30–90 minutes) and no control over
              in-store inventory.

              **DoorDash (NYSE: DASH)** holds 68% of US food delivery market share and generated
              $10.72 billion in revenue in 2024, dwarfing Gopuff's $1.2 billion. DoorDash's DashMart
              concept—proprietary first-party warehouse-stores for convenience items, launched in
              2020—now spans 100+ US locations and offers Gopuff-like instant delivery (15–60 minutes)
              of groceries, snacks, and household essentials. In September 2025 DoorDash unveiled
              DashMart Fulfillment Services, a turnkey retail logistics program allowing CVS, Party
              City, and other national brands to use DashMart infrastructure for end-to-end instant
              delivery, positioning DashMart as a platform competitor to Gopuff's B2B ambitions.
              DoorDash's 8 million active Dashers, 46.3 million active users, and DashPass subscription
              (26 million subscribers) create lock-in and order density that Gopuff's smaller network
              cannot match at scale.

              **Amazon (Fresh and Whole Foods)** is pivoting its grocery strategy away from physical
              Fresh stores (closing 14 UK stores in 2025, closing Go stores in the US) toward
              marketplace grocery delivery partnerships and Whole Foods expansion. Amazon partnered
              with Gopuff in the UK for a national rollout of sub-60-minute, and as fast as 15-minute,
              delivery in July 2025—a relationship that simultaneously validates Gopuff's MFC network
              strength and creates channel dependency risk. Amazon's same-day perishables delivery
              capability is expanding in the US in 2026, increasing pressure on Gopuff's convenience
              proposition for higher-basket grocery orders.

              **7-Eleven (7NOW)** leverages 7,500+ US store locations for on-demand delivery, targeting
              $1 billion in North American 7NOW sales by end of fiscal 2025—up 38% from FY2024's $725
              million. 7NOW achieves an average delivery time of approximately 28 minutes, relies on
              no additional fulfillment infrastructure capital, and already serves 24/7 in over 40 major
              US cities. Its 7NOW Gold Pass subscription ($5.95/month) directly competes with Gopuff's
              Fam membership. 7-Eleven's structural advantage is zero MFC capital cost; its limitation
              is store-proximity dependency and lower SKU breadth per location.
