      - number: '5.3'
        title: Private Label Portfolio and Assortment Intelligence
        blocks:
          - type: paragraph
            body: >
              Gopuff's private-label strategy is one of its most commercially significant technical differentiators.
              Because Gopuff owns its inventory and captures first-party behavioral data at every order, it can close
              the product-development loop far faster than traditional CPG companies or marketplace platforms that do
              not hold inventory. The flagship Basically brand launched in 2022 and has consistently ranked in the top
              ten most-ordered products on the platform. By 2024, private-label sales had grown 70% year-over-year, and
              approximately 20% of all Gopuff orders contained at least one private-label product, according to official
              company announcements.

              In 2024, Gopuff expanded the portfolio with Basically Premium — a higher-quality sub-brand offering
              thoughtfully formulated products with fewer artificial additives, including gluten-free beef sticks,
              premium coconut water, and aluminum-bottled spring water — and updated the visual identity for the entire
              Basically line. Separately, Crave Shoppe was launched in response to identified consumer demand for
              indulgent snack formats: the SKU roster includes dill pickle cotton candy, S'mores marshmallow-filled
              donuts, Ice Cream Bubbles, and edible cookie dough developed with co-manufacturer Whoa Dough. The private
              label function is led by a dedicated director and team who use platform order data and customer feedback
              to determine product concepts, enabling rapid iteration. Supplier terms, production sourcing, and per-SKU
              margin data are not publicly disclosed, creating a diligence gap around the true unit economics of
              private-label contribution. The vertical integration model (owned inventory + first-party data) is the
              technical mechanism enabling private-label velocity; Gopuff can test a new SKU, measure reorder rates
              within days, and iterate — an advantage that pure-marketplace competitors structurally cannot replicate.
