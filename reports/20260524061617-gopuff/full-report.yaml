        - >-
          App-ordered delivery of snacks, beverages, OTC, alcohol, household essentials delivered from dark stores in
          under 30 minutes
        - Scheduled grocery delivery, two-day e-commerce, meal kit subscriptions
        - Urban/suburban adults 18-44 ordering via mobile app; personal discretionary spend
        - Core direct market; $8.78B US in 2025; Gopuff is the largest US owned-inventory operator
      - - UK quick commerce (instant delivery <30 min)
        - Same-day sub-30-minute essentials delivery via micro-fulfillment centers in UK cities
        - Traditional supermarket delivery (Ocado, Tesco), Amazon Prime delivery (non-instant), click-and-collect
        - Urban UK adults in 16+ cities Gopuff serves; Amazon partnership expands reach
        - Second direct market; $2.83B in 2025; Gopuff operates largest instant-fulfillment network in UK
      - - US convenience store (physical)
        - In-store impulse and urgency purchases at ~152,000 physical c-stores
        - Physical foot traffic revenue flowing to c-store operators only
        - All ages; primary substitute when instant delivery unavailable or too slow
        - Upper-bound TAM context ($957B); digital delivery only a small share of this today
      - - Brand partnership / advertising revenue
        - Brands paying for product placement, sampling, launch campaigns, and app advertising on Gopuff platform
        - Third-party marketplace fees (DoorDash, Uber Eats)
        - CPG brands, beverages, entertainment, and consumer goods companies
        - Emerging high-margin segment; Starbucks, Disney, Amazon, Tom Brady ventures confirmed partners
      - - Membership (FAM subscriptions)
        - Recurring monthly/annual subscriber fees from FAM program members
        - One-time delivery fees from non-members
        - Loyal repeat customers; drives order frequency and retention
        - High-value segment; membership growth cited as key driver of record contribution profit
      - - 'Adjacent: same-day grocery / marketplace delivery'
        - Sub-2-hour grocery delivery via Instacart, DoorDash, Uber Eats, Amazon Fresh from third-party retailers
        - Owns-inventory dark store quick commerce (Gopuff's model)
        - Broader consumer grocery delivery budgets
        - Competitive overlap but different model; Gopuff does not depend on third-party retailer inventory
    notes: >-
      Market boundary focuses on owned-inventory instant-delivery operations. Broad convenience store TAM is a ceiling
      for digital displacement rather than a direct revenue pool. All dollar figures are estimated; UK figures from
      Mordor Intelligence 2025, US from Coherent Market Insights via DemandSage 2025.
