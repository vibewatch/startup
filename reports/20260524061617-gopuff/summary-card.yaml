  topStrengths:
    - >-
      Only remaining vertically integrated instant-commerce network at meaningful scale in the US and UK, after most
      dedicated q-commerce rivals exited or failed.
    - >-
      Owned-inventory micro-fulfillment model offers tighter control over assortment, speed, and inventory availability
      than marketplace-only peers.
    - >-
      Evidence of real operating improvement: contribution profit above $4 per order, retail-media expansion, and a new
      CFO with prior IPO experience.
    - >-
      Diverse monetization stack spanning merchandise margin, delivery fees, subscription, private label, and
      advertising rather than one take-rate stream.
  topRisks:
    - >-
      Current $8.5B valuation implies a premium multiple versus DoorDash and Instacart despite materially less financial
      disclosure and a less proven profit profile.
    - >-
      Capital intensity remains high because Gopuff owns inventory and operates a large MFC network whose fixed costs
      are difficult to absorb outside dense markets.
    - >-
      Preference-stack overhang from more than $5.25B of lifetime funding could materially compress common-equity
      outcomes unless exit value clears the current mark by a wide margin.
    - >-
      Regulatory and legal exposure spans worker classification, alcohol compliance, SNAP/EBT execution, and other city-
      or state-level operational rules.
    - >-
      Competition from better-capitalized marketplace incumbents such as DoorDash and Instacart can pressure customer
      economics without requiring them to own the same fixed infrastructure.
  unresolvedGaps:
    - Audited consolidated financials, especially net revenue, EBITDA, free cash flow, and cash runway
    - Full preference waterfall and investor rights by round, including any 2021 peak-round protections
    - Current Gopuff Fam subscriber count, churn, and revenue contribution
    - Current active-customer count and order-frequency/cohort-retention data
    - Geography-level unit economics and current headcount/labor-cost baseline after 2022–2024 restructurings
