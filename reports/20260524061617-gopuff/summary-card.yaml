summary:
  headline: >-
    Track: Gopuff has genuine category leadership as the last scaled vertically integrated quick-commerce platform in
    the US and UK, but today's $8.5B private mark already prices in much of the operational recovery while audited
    financials, free-cash-flow timing, and capital-structure overhang remain opaque.
