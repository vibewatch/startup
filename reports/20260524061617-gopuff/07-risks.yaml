- id: customer-competitive
  title: Customer and Competitive Risk — Churn and Market Position
  body: 'Gopuff operates in a quick-commerce segment where the three largest players—DoorDash, Instacart, and Amazon—are each
    larger, better-capitalized, and investing aggressively in the same delivery occasion. DoorDash expanded DashMart with
    45 percent year-over-year GMV growth targeting 600-plus cities. Instacart holds over $30 billion in annual GMV as the
    North American grocery marketplace leader. Amazon is committing $4 billion through 2026 to expand same-day and next-day
    services. Gopuff''s annual GMV contracted roughly 15 percent after post-pandemic overexpansion, and its competitive differentiation—owned
    inventory in owned dark stores with sub-30-minute delivery—is being replicated by incumbents with far greater distribution
    and brand reach.


    Customer satisfaction scores signal an elevated churn risk. A Trustpilot score of 1.4 out of 5 and a PissedConsumer complaint
    log of 637-plus reviews represent a systematic service-quality problem, not isolated incidents. Unhappy customers in an
    impulse-driven category with low switching friction will migrate to DoorDash or Instacart after one or two negative experiences.
    Gopuff''s response to this problem—FAM membership, private label expansion, AI personalization—may improve economics for
    retained customers but does little to re-acquire churned ones. Retention metrics, NRR, and cohort-level repeat-purchase
    rates are not publicly disclosed, making it impossible to determine whether the customer base is stabilizing or contracting.'
  claimRefs:
  - CR022
  - CR023
