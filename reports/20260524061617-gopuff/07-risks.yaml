  title: Dependency map
  type: dag
  layout: wide
  summary: Gopuff's operating model depends on Starbucks for basket and brand, Amazon for marketplace demand, Eldridge for
    capital, independent-contractor drivers for last-mile delivery, and state regulators for the licenses that allow regulated-category
    delivery.
