chapter:
  number: 7
  title: Risks
  summary: Gopuff's highest-severity risks are labor-law enforcement (active DC AG lawsuit, $6.2M MA citation), alcohol licensing
    compliance (license revocation precedent in Massachusetts), persistent cash burn against uncertain IPO timing, and partner
    concentration in Amazon and Starbucks. Valuation has compressed from $15B to $8.5B with no public third-party confirmation
    of company-wide profitability; kill criteria center on enforcement escalation, partner defection, or closure of the capital
    market before EBITDA break-even.
sections:
- id: legal-regulatory
  title: Legal and Regulatory Risk Is Gopuff's Highest-Severity Stack
  body: 'Gopuff operates in three regulated product verticals—alcohol, cannabis, and nicotine—each of which requires separate
    state-level licensing. The Massachusetts Alcoholic Beverages Control Commission (ABCC) revoked Gopuff''s retail and transportation
    alcohol licenses in May 2023 following 19 documented violations in which the company sold and delivered alcohol to underage
    Boston College students. ABCC investigators reported each incident to Gopuff management as it occurred; no sufficient
    corrective action was documented between violations. A court subsequently paused the revocation, but the enforcement episode
    confirms that a single state regulator can halt Gopuff''s highest-margin category in an entire market with little warning.
    The multi-state alcohol compliance burden is structurally high: Gopuff must maintain licenses across every jurisdiction
    it serves, train drivers to verify age, and pass periodic compliance audits. A repeat violation in a major market would
    be a material revenue event, not just a reputational one.


    The labor misclassification risk is equally live. In March 2025 the Washington D.C. Attorney General filed suit against
    GoBrands, Inc. and GB Logistics, LLC (Gopuff''s operating entities), alleging that delivery workers were illegally classified
    as independent contractors rather than employees. The complaint alleges Gopuff denied hundreds of DC workers minimum wage,
    overtime, paid sick leave, and unemployment-insurance contributions. Massachusetts has already acted: the state AG issued
    $6.2 million in citations in 2023 for misclassifying roughly 1,000 drivers, which Gopuff is appealing. Bloomberg Law confirmed
    the DC case active in 2025. The pattern—separate enforcement by two state attorneys general in less than two years—signals
    that multi-state cascade risk is real. If courts or regulators force employee reclassification, Gopuff''s per-delivery
    labor cost structure would change materially and the impact would be difficult to absorb without further raising prices
    or cutting coverage.'
