callouts:
- calloutType: risk
  title: Labor Misclassification Is the Single Most Actionable Near-Term Risk
  body: The combination of an active DC AG lawsuit and a pending Massachusetts $6.2M citation appeal, both filed within a
    24-month window, elevates the probability that at least one adverse ruling will occur before a Gopuff IPO. An adverse
    final judgment that requires employee reclassification would structurally increase per-delivery labor cost, compress contribution
    margin, and force a re-underwriting of the business model before the company can access public markets.
  claimRefs:
  - CR001
  - CR004
  - CR010
  - CR046
- calloutType: insight
  title: Contribution Profit ≠ Profitability — Key Metric Gap
  body: Gopuff's November 2025 press release cited positive contribution profit and record revenue, but offered no audited
    financials and did not address company-wide EBITDA. Contribution profit is calculated before corporate overhead, R&D,
    and central tech costs. The gap between contribution profit and EBITDA is the diligence question that most directly determines
    whether Gopuff can self-fund its IPO preparation or will require another private round.
  claimRefs:
  - CR018
  - CR020
  - CR043
  - CR044
- calloutType: recommendation
  title: Three Diligence Asks Before Any Capital Commitment
  body: 'Before committing capital, investors should obtain: (1) a multi-state misclassification exposure map with reserve
    estimates from outside counsel; (2) audited or reviewed financials showing company-wide EBITDA and MFC-level contribution
    margins by vintage and market density; (3) full contract terms for the Starbucks and Amazon partnerships including renewal
    windows, termination rights, and exclusivity clauses.'
  claimRefs:
  - CR001
  - CR011
  - CR026
  - CR028
  - CR044
