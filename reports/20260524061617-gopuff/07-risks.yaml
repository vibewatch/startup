  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: profitability
    missingEvidence: Audited or reviewed financial statements showing company-wide EBITDA, contribution margin by MFC vintage,
      and cash runway as of the most recent fiscal period.
    whyItMatters: Gopuff's profitability claims are company-issued and unaudited; the distinction between contribution profit
      and EBITDA is the single most important variable for assessing whether the business is self-sustaining or dependent
      on continued external capital.
    relatedQuestionRefs:
    - QR014
  - type: private-evidence-only
    severity: blocking
    topic: misclassification
    missingEvidence: Multi-state misclassification exposure map with outside counsel's estimate of aggregate back-pay liability
      across all active and potential enforcement jurisdictions.
    whyItMatters: The aggregate financial liability from misclassification enforcement across multiple states is unknown;
      it could be material enough to affect IPO pricing, covenant compliance, or capital raise terms.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: starbucks-partnership
    missingEvidence: Full contract terms for the Starbucks and Amazon partnerships, including renewal windows, termination
      rights, revenue share, exclusivity clauses, and penalty provisions.
    whyItMatters: Without contract visibility, it is not possible to assess the durability of revenue and basket economics
      dependent on these partnerships or the consequences of non-renewal.
  - type: missing-source
    severity: material
    topic: mfc-unit-economics
    missingEvidence: Per-market or per-MFC contribution margin data, break-even order density, and unit economics comparison
      by market vintage (legacy high-density versus newer lower-density markets).
    whyItMatters: The MFC model's risk profile varies sharply by local order density; without market-level data it is impossible
      to assess how much of the portfolio is contribution-positive versus contribution-negative.
    relatedQuestionRefs:
    - QR022
  - type: stale
    severity: material
    topic: alcohol-license
    missingEvidence: Current legal status of the Massachusetts court injunction pausing the ABCC alcohol license revocation,
      including whether the stay remains in place, has been lifted, or has been resolved by settlement.
    whyItMatters: If the court stay has been lifted without public reporting, Gopuff may have already lost or re-applied for
      Massachusetts alcohol delivery authorization, which would affect both compliance posture and revenue.
    relatedQuestionRefs:
    - QR021
  - type: missing-source
    severity: minor
    topic: customer-satisfaction
    missingEvidence: Gopuff's internal NRR, repeat-purchase cohort rates, or churn metrics by customer segment and market,
      needed to assess whether the customer base is stabilizing or contracting.
    whyItMatters: Trustpilot and PissedConsumer signals are directionally negative, but without cohort retention data it is
      impossible to determine whether churn is accelerating or contained to a vocal minority.
  - type: private-evidence-only
    severity: material
    topic: ipo-readiness
    missingEvidence: Evidence of public-company-ready financial controls, GAAP-compliant audit infrastructure, underwriter
      selection, and audited revenue figures required to calculate EV/Revenue multiples comparable to public peers Instacart
      and DoorDash.
    whyItMatters: Without audited financials and confirmed IPO controls, it is impossible to assess whether Gopuff can execute
      an S-1 on its stated 2026 timeline or how its valuation compares to public peers on a revenue-multiple basis.
    relatedQuestionRefs:
    - QR015
    - QR024
