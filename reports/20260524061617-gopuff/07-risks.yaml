- id: TR005
  title: Mitigation and kill criteria table
  layout: wide
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Labor misclassification enforcement cascade
    - DC or MA court ruling; additional AG filing in a third state
    - Final adverse judgment requiring retroactive back-pay, or third state AG suit filed within 12 months
    - 'Stop-and-reunderwrite: reclassification would change per-delivery cost structure fundamentally'
  - - Alcohol or cannabis license revocation in top-5 market
    - ABCC or state liquor authority administrative ruling; news of enforcement hearing
    - Permanent revocation (not paused) in any market generating >5% of regulated-category revenue
    - Thesis break in affected geography; assess cascade risk to other license renewals
  - - Starbucks or Amazon partnership termination
    - Partnership press release, contractual non-renewal, or absence from product UI
    - Official termination or confirmed non-renewal without a replacement partner of comparable GMV contribution
    - Immediate revenue and basket-size impact; re-model unit economics without partnership halo
  - - Valuation compression below $5B in next primary round
    - Lead investor pricing; secondary market transaction data
    - Primary equity round priced below $5B or secondary trades >40% below last primary
    - Signals investor loss of confidence in IPO path; assess burn rate against runway at new valuation
  - - IPO window closure requiring additional private capital
    - No S-1 filing by end of Q4 2026 combined with burn rate requiring capital within 12 months
    - Bridge round needed before IPO; financing terms would indicate negotiating leverage
    - Evaluate dilution risk and covenant structure; assess operational levers available to extend runway
  - - Customer satisfaction sustained below 1.5 stars on Trustpilot or >800 PissedConsumer complaints
    - Public review platform scores; complaint volume trend
    - Sustained 12-month average below 1.5 on Trustpilot or doubling of PissedConsumer volume
    - Indicator of structural service-quality failure; correlate against retention cohort data if available
  notes: Kill criteria are defined to be observable from public news, regulatory announcements, court records, and review
    platforms without requiring private company data access.
