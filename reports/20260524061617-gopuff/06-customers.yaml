company:
  name: Gopuff
chapter:
  number: 6
  title: Customers
  letter: U
  summary: |
    Gopuff's customer base spans three distinct payer/user tiers: (1) B2C convenience consumers
    (primarily Gen Z and millennials aged 24–34) in 1,000+ US cities and 16+ UK cities, of whom
    roughly 1.8 million were active in 2023 — down from a 2.6 million peak in 2021; (2) Gopuff
    Fam loyalty subscribers, who account for nearly 50% of all orders and anchor repeat usage
    through free delivery and discounted essentials; and (3) CPG and non-endemic brand
    advertisers buying sponsored placements, Brand Shops, and Koddi-powered measurement on the
    in-house ads platform launched in July 2024. Partnership customers (Amazon UK, Uber Eats,
    DoorDash) extend consumer reach via third-party channels. Key customer-side risks include a
    declining active user base since 2021, recurring service-quality complaints on Trustpilot and
    app stores, absence of public cohort retention or churn data, and lack of disclosed brand
    advertiser revenue concentration figures.

