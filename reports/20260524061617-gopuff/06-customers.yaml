callouts:
  - title: "Fam Order Share as a Loyalty Signal"
    body: >-
      Fam members generating ~50% of orders from what is likely a minority of users suggests
      extreme behavioral stratification: a loyal, high-frequency core supports the unit economics
      while a large non-subscribing base churns faster. Diligence should confirm the absolute
      subscriber count and per-cohort order frequency to determine whether Fam retention is
      self-sustaining or dependent on continuous discounting.
    calloutType: insight
    claimRefs: [CU010, CU032, CU034]
  - title: "Active User Decline Is the Primary Customer-Side Risk"
    body: >-
      The 31% drop in active users from 2021 to 2023 has not been publicly updated; the lack
      of a 2024–2025 user count is a material gap. Given the 2024 layoff round and continued
      warehouse closures, user-base further decline is plausible. Investors should treat the
      1.8M figure as a ceiling, not a floor, until management provides current MAU data.
    calloutType: risk
    claimRefs: [CU002, CU027, CU028, CU029]

