  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention gaps
      missingEvidence: >-
        Gopuff Fam subscriber count, Fam churn rate, cohort retention curves, and NRR/GRR for the
        B2C customer base. Gopuff discloses only aggregate order share (~50% from Fam) and average
        monthly savings ($20/month), not underlying subscriber counts or retention by cohort.
      whyItMatters: >-
        Without churn rate or cohort data, it is impossible to assess whether the apparent Fam
        loyalty translates into durable recurring revenue or merely masks heavy user concentration.
      diligencePath: >-
        Request Fam subscriber counts, monthly churn rates, annual cohort retention curves (12- and
        24-month), and Fam member LTV vs non-Fam LTV directly from management in due-diligence.
      relatedQuestionRefs: [QU008, QU025, QU026]
    - type: private-evidence-only
      severity: material
      topic: retention gaps
      missingEvidence: >-
        Average order value (AOV), order frequency, and basket composition segmented by Fam vs
        non-Fam users, by cohort vintage, and by geography. No public disclosure of these metrics.
      whyItMatters: >-
        AOV and frequency are the primary unit-economic drivers; without segmentation, it is
        unclear whether Fam drives incremental spend or merely attracts already-high-frequency users.
      diligencePath: >-
        Request internal cohort analytics showing AOV and order frequency by Fam status, vintage,
        and market; compare gross margin by Fam vs non-Fam order to assess true loyalty lift.
      relatedQuestionRefs: [QU008, QU009, QU013]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: revenue mix
      missingEvidence: >-
        Advertising revenue as a share of total Gopuff revenue (US and UK separately). No segment
        disclosure exists; total company revenue figures from third-party estimates suggest
        advertising is material but its exact magnitude and growth rate are unknown.
      whyItMatters: >-
        Advertising is structurally higher-margin than product delivery and may be the primary
        path to profitability; without knowing the split, the investment case is hard to underwrite.
      diligencePath: >-
        Request P&L by revenue line (delivery commerce, subscription, advertising, Powered by
        Gopuff fulfillment fees); review brand advertiser contract structure, renewal rates, and
        pricing power separately.
      relatedQuestionRefs: [QU011, QU024]
    - type: conflicting-data
      severity: minor
      topic: ads platform performance
      missingEvidence: >-
        Independent third-party verification of Gopuff's claimed ad platform performance metrics
        (25% CTR lift, 24% conversion lift, 30% lower CPC). All performance claims originate from
        Gopuff or partner-issued press releases; no independent audit or academic corroboration found.
      whyItMatters: >-
        Self-reported ad effectiveness metrics without independent validation may be selectively
        benchmarked or measured against a non-representative baseline period.
      diligencePath: >-
        Request raw advertiser campaign logs or third-party audit of platform performance; compare
        metrics against industry benchmarks from IAB or comparable RMN performance data.
      relatedQuestionRefs: [QU017]
    - type: stale
      severity: minor
      topic: active users
      missingEvidence: >-
        Active user count more recent than 2023 (1.8 million). No 2024 or 2025 user count has
        been publicly disclosed; market contraction through 2024 (layoffs, warehouse closures)
        suggests users may have further declined.
      whyItMatters: >-
        A materially lower 2025 active user count would indicate accelerating customer churn and
        would reduce the size of the audience for both Fam subscriptions and brand advertising.
      diligencePath: >-
        Request monthly active user trend from 2022 through Q1 2026, segmented by US and UK; also
        request reactivated and dormant user shares to understand gross vs net retention.
      relatedQuestionRefs: [QU019, QU022]

sections:
  - id: consumer-core-segment
    title: "B2C Consumer Segment: Demographics, Use Case, and Scale"
    body: |
      Gopuff's primary customer is the convenience-driven urban consumer — predominantly Gen Z and
      millennials aged 24–34 — who values on-demand access to snacks, beverages, household essentials,
      alcohol, and over-the-counter medicines delivered in 15–30 minutes without markup or
      substitution. The company's roots as a university-dorm delivery service at Drexel University
      in 2013 explain this demographic core, which it has retained as it scaled to over 1,000 US
      cities and 16+ UK cities. The Gopuff app has accumulated over 20 million cumulative downloads
      and counted approximately 1.8 million active shoppers in 2023 — down from a 2.6 million peak
      in 2021. This decline reflects the contraction of pandemic-era demand and the closure of
      76 US warehouses (12% of network) in 2022 plus additional 2024 workforce reductions.

      Gopuff also accepts SNAP EBT for eligible grocery items, extending reach to lower-income
      households typically underserved by premium delivery platforms. Its 500+ micro-fulfillment
      centers, co-located near target population centers, enable 24/7 operations including
      late-night convenience — a distinct behavioral occasion that non-grocery delivery
      platforms serve poorly. In the UK, a July 2025 national rollout of the Amazon–Gopuff
      partnership expanded consumer access to Amazon's existing customer base across 16+ cities,
      including London, Manchester, Birmingham, and Bristol, with delivery in under 60 minutes.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU024, CU027, CU031]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: fam-loyalty-program
    title: "Gopuff Fam Subscription: Loyalty Anchor and Retention Lever"
    body: |
      Gopuff Fam is the primary loyalty mechanism and the single clearest indicator of
      repeat-purchase durability. Fam members account for nearly 50% of all Gopuff orders, pay
      $7.99/month (or ~$5.99/month annually) for unlimited free delivery and always-on 30% price
      reductions on 100+ everyday essentials, and save an average of $20/month according to Gopuff.
      The program was first priced at $5.95/month at its 2018 launch; the 2022 fee increase to
      $7.99 did not visibly erode the order share metric, suggesting price-inelastic demand among
      core users. In September 2023, Gopuff launched Student Fam at $3.99/month — 50% below
      standard Fam — targeting the 1,000+ US college campuses that formed its original market.
      A student survey found 59% cited incentives and 51% cited lower prices as primary Gopuff
      usage drivers.

      The free-delivery benefit creates a loyalty loop: Fam members break even on the $7.99 monthly
      fee with roughly two deliveries per month (at the standard $3.95 delivery fee), creating a
      strong frequency-reinforcing incentive. Weekly deal drops (40%+ off trending brands every
      Monday) drive habitual re-engagement. UK Fam subscription revenue grew from £638K to £1.8M
      in 2023, signaling nascent but accelerating subscriber adoption in the international market.
      Material gaps remain: Gopuff does not disclose the absolute Fam subscriber count, individual
      cohort retention curves, or churn rate, making durable loyalty analysis dependent on
      management data requests.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013, CU023, CU032, CU034, CU035, CU039]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: brand-advertiser-customers
    title: "Brand Advertiser and B2B Customers: Retail Media Network and Powered by Gopuff"
    body: |
      Gopuff's second major payer segment is brands that buy advertising or logistics access.
      On the advertising side, CPG brands purchase sponsored product listings, Brand Shops
      (immersive shoppable experiences inside the Gopuff app), and programmatic inventory via
      The Trade Desk–Koddi integration. Named CPG brand advertisers include Chips Ahoy!,
      Hot Pockets, and Gatorade, who have reported ~20% higher average order value from
      Brand Shops. Non-endemic advertisers (Apple TV+, Hulu, AdoreMe, Noom) access
      Gopuff's majority Gen Z/millennial base via the Rokt post-checkout ad unit, achieving
      5% engagement in the first month. The in-house AI/ML ads platform, launched July 2024,
      uses 1,000+ real-time variables to deliver personalized placements in under 50 milliseconds;
      Gopuff reports 25% CTR improvement and 24% conversion lift since launch.

      The incremental measurement program with Koddi has matured from pilot to always-on service:
      by early 2026, Gopuff had already exceeded its full-year 2025 test volume, signaling growing
      brand-advertiser demand for closed-loop attribution. Gopuff also serves as the launch partner
      for The Trade Desk's programmatic retail media inventory integration, positioning it as an
      infrastructure hub for broader RMN ecosystems. On the logistics side, "Powered by Gopuff"
      (launched April 2024) enables CPG brands to offer 15-minute DTC delivery from white-label
      Shopify storefronts fulfilled by Gopuff's micro-fulfillment network; Mondelēz, Nestlé, Ben &
      Jerry's, and JM Smucker participated in the launch cohort. Advertising revenue is not
      separately disclosed, creating a key diligence gap.
    claimRefs: [CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022, CU033, CU037, CU038, CU040]
    tableRefs: [TU003]
    figureRefs: [FU002]

  - id: adoption-trajectory
    title: "Adoption Trajectory: Growth, Decline, and Partnership-Driven Recovery"
    body: |
      Gopuff's B2C adoption trajectory shows a pronounced pandemic-era spike and post-2021 retreat.
      Active users rose from 0.3M (2019) to 2.6M (2021) and fell to 1.8M by 2023 as demand
      normalized and the company closed hundreds of fulfillment centers. Total revenue followed the
      same arc: $200M (2019) → $1.88B (2021) → $1.2B (2023). Annual app downloads peaked and then
      moderated; 3.8 million downloads in 2023 continue to bring new users into the funnel, but net
      active users are declining. The UK market showed revenue growth (£42.8M → £78.1M, 2022–2023)
      driven by order volume and partnerships, while UK subscription revenue more than doubled.

      Partnership-channel expansion is the primary 2025–2026 growth vector. The Amazon UK national
      rollout (July 2025) routes Amazon.co.uk customers directly to Gopuff's fulfillment network
      across 16+ UK cities, materially widening addressable reach without new customer acquisition
      spend. Gopuff already operates via Uber Eats, DoorDash, and Deliveroo. On the brand-advertiser
      side, the Koddi measurement program's 2026 acceleration indicates a growing roster of active
      brand customers. No 2024–2026 active user figure has been publicly disclosed; the most recent
      confirmed count of 1.8M (2023) is now two years stale and should be treated as a floor rather
      than a current estimate given ongoing operational contraction.
    claimRefs: [CU002, CU003, CU005, CU007, CU022, CU023, CU024, CU025, CU029, CU040]
    tableRefs: [TU002]

  - id: customer-friction-and-risks
    title: "Customer Friction, Adverse Evidence, and Concentration Risks"
    body: |
      Consumer-facing service quality is a documented friction point. Trustpilot reviews from 2025
      and early 2026 show recurring themes: missing or incorrect items, delivery times exceeding
      two hours (vs the 15–30 minute promise), AI-only chat support that fails to resolve refund
      disputes, and account suspensions without clear recourse. App store ratings remain high
      (4.6–4.8/5), but the volume of detailed negative reviews about order accuracy and customer
      service suggest operational consistency problems that compound in low-density markets outside
      the company's core urban footprint. These friction patterns are consistent with the broader
      2022–2024 contraction: when order density is insufficient to support the dark-store model,
      delivery quality degrades and customer attrition accelerates.

      On concentration risk: Gopuff's B2C user base declined 31% from 2021 peak to 2023 without a
      visible floor, and no public churn or cohort data allows quantification of downside risk. The
      UK market has accumulated £187M+ in losses with no confirmed path to profitability. Brand
      advertiser concentration is unknown — if a small set of large CPG brands drives the majority
      of advertising revenue, Gopuff faces meaningful budget sensitivity during brand marketing
      downturns. Retail media budgets at large brands are under pressure: 27% of marketers ranked
      RMNs as a top channel in Q1 2025, down 4 percentage points from 2024. Geographic concentration
      in dense urban US metros is also inherent to the model; any further market exits would reduce
      the addressable consumer base directly.
    claimRefs: [CU026, CU027, CU028, CU029, CU030, CU031, CU036, CU037, CU038]
    tableRefs: [TU005]
    figureRefs: [FU003]

