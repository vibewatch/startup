      - number: '8.3'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >
              三个情景给估值范围定边界。所有情景都假设 2026–2028 年通过 IPO 或战略出售退出；若退出延迟或失败，无论运营表现如何，结果都会向悲观情景压缩，因为优先权堆叠继续累积，投资人耐心继续消耗。

              乐观情景要求 Gopuff 在 2026–2027 年把收入推向 $1.2 billion 或以上，IPO 前至少连续两个季度实现自由现金流转正，并以 12–14x EV/Revenue 倍数进入公开市场。收入
              $1.2 billion、倍数 12x 时，退出价值约 $14.4 billion，较上一轮标记溢价 69%。关键重估假设是广告 / 零售媒体收入达到净收入的
              20%+，从而支撑显著高于纯配送同业的混合倍数。催化剂包括：S-1 反响良好且披露强劲单位经济、至少两个盈利季度，以及 2026–2027 年消费科技公开市场环境支持。

              基准情景假设收入在 $900M–$1.0 billion 区间，公司层面改善但尚未实现自由现金流转正，并在 2027 年以 10–11x EV/Revenue 倍数 IPO。收入 $950 million、倍数
              10.5x 时，退出价值约 $9.975
              billion，基本与上一轮标记持平。后期优先股持有人约可按面值回收；普通股持有人有小幅上行。基准情景的主要执行风险是，公开市场投资人会用流动性折价、财务不透明和优先股悬压的视角重新定价，IPO 价格区间可能低于
              $8.5 billion 私募标记。

              悲观情景假设收入停滞或跌破 $800 million，现金消耗重新超过每年 $200 million，并以 $4–6 billion 进行战略性或困境退出。若退出估值为 $5 billion，2021 年 $15
              billion Series H 优先股持有人几乎损失全部投资本金，普通股持有人事实上归零。悲观情景概率上升的信号包括：收入增长回落至零或转负，SNAP EBT
              或广告收入流无法放大，管理层长期动荡，或现金消耗连续第二年超过 2023 年水平。
