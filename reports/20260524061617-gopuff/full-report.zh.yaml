      - number: '8.4'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              投资逻辑建立在四根支柱上。第一，Gopuff 是美国和英国唯一仍具规模的垂直整合即时零售网络：所有直接类比对象——Gorillas、Getir（美国 / 英国业务）、Jokr、Fridge No
              More、Buyk 等——都已失败或退出这些市场。幸存者溢价真实存在、复制难度不低，并在近期为城市 TAM 提供持久护城河。第二，单位经济已经可量化改善：每单贡献利润超过 $4，广告利润率贡献了约 150
              个基点的调整后毛利率改善，Gopuff FAM 项目带来的订阅留存增长也显示，底层垂直整合模式在高密度地区可以接近可持续。第三，$250 million 融资与 Matt McBrady 出任 CFO
              同时发生——他在 Axon 和 aQuantive 有直接 IPO 执行经验——加上 PitchBook VC Exit Predictor 概率超过
              96%，共同指向可信的近期退出准备。第四，高频消费合作伙伴（Starbucks、Amazon、Disney、Tom Brady）以及 SNAP EBT 全国受理，验证了平台触达能力，并拓宽了可服务客户基础。

              反向逻辑同样有证据支撑。第一，当前 9–11x EV/Revenue 隐含倍数要求一项 2026
              年没有任何可比上市配送公司能维持的溢价；重估需要要么出现尚未被任何公开财务披露反映的盈利拐点，要么出现一个不一定会到来的牛市环境。第二，$5.25 billion
              优先权堆叠形成结构性经济悬压：普通股持有人（包括员工）只有在退出估值远高于 $10–12 billion 时才有可观收益，恰恰在最需要盈利纪律的时点扭曲管理层激励。第三，垂直整合比 DoorDash 和
              Instacart 的平台模式承担更高固定成本；利润率杠杆只存在于高密度城市地区，不能随订单量线性扩张。第四，欧洲即时零售崩塌——Gorillas、Getir、Flink 等公司估计有 $5.5 billion
              VC 资本减值——是对该品类单位经济的结构性警告，不是暂时挫折，美国市场也无法免疫同样的需求常态化。第五，2022、2023、2024 年连续三轮裁员，2023 年 $400 million
              现金消耗，以及没有任何经审计财务披露，合在一起使外部无法独立验证公司的盈利说法。
