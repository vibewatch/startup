      - number: '7.5'
        title: 客户与竞争风险——流失和市场位置
        blocks:
          - type: paragraph
            body: >-
              Gopuff 所在的即时零售赛道里，三个最大玩家 DoorDash、Instacart 和 Amazon 都更大、资本更充足，并且都在积极投入同一配送场景。DoorDash 扩张 DashMart，GMV
              同比增长 45%，目标覆盖 600+ 城市。Instacart 作为北美食品杂货市场平台领导者，年 GMV 超过 $30B。Amazon 承诺到 2026 年投入
              $4B，扩张当日达和次日达服务。疫情后过度扩张之后，Gopuff 年 GMV 大约收缩 15%；其竞争差异——自有暗店库存、30 分钟内送达——正被分销和品牌触达强得多的既有巨头复制。


              客户满意度分数显示流失风险偏高。Trustpilot 1.4/5 分和 PissedConsumer 637+
              条投诉记录，代表系统性服务质量问题，而非孤立事件。冲动消费驱动、切换摩擦低的品类里，用户经历一两次负面体验后就会迁移到 DoorDash 或 Instacart。Gopuff 对此的应对——FAM
              会员、自有品牌扩张、AI 个性化——可能改善留存客户的经济性，但对重新获得已流失客户帮助有限。留存指标、NRR 和队列层面复购率没有公开披露，因此无法判断客户基数是在稳定还是继续收缩。
