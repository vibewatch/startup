      - number: '1.3'
        title: 融资历史、估值与投资人版图
        blocks:
          - type: paragraph
            body: >-
              Gopuff 自创立以来累计融资超过 $5.25B，一系列轮次对应了公司疫情期间的高速增长和之后的重估。早期资金来自 Anthos Capital，在 2015–2016 年参与种子轮和 Series
              A。Valor Equity Partners 与 Accel 于 2017–2018 年进入。SoftBank Vision Fund 从 2019 年开始成为主导资本伙伴，参与 Series
              E（$750M）、Series F（$380M），以及 2021 年 3 月 Series G（$1.15B）和 2021 年 7 月 Series H（$1B，估值 $15B）。Fidelity、Baillie
              Gifford、Eldridge Industries、D1 Capital 和 Blackstone 也参与了 2020–2021 年各轮融资。


              2025 年 11 月 $250M 轮由 Eldridge Industries 和 Valor Equity Partners 领投，Baillie Gifford、George Ruan（Honey
              联合创始人）、Yakir Gabay 和两位联合创始人也参与，确定当前估值为 $8.5B。这比 2021 年 $15B 峰值下调 43%，既反映消费者科技估值重校，也反映 Gopuff
              有意从不惜代价增长转向盈利优先。Eldridge 投资人 Todd Boehly 把 Gopuff 称为其商业模式中“the last one
              standing”，暗示此轮融资部分来自对竞争整合已清除多数主要威胁的判断。


              资本效率比约为估值 / 融资额 1.55x，水平不高；估值从峰值下调也意味着，按市值重估口径，此前以高于 $8.5B 估值进入的投资人处于账面亏损。二级交易定价和股权结构细节均未公开。不同来源给出的累计融资额在
              $5.25–$5.5B 之间，这是合理估计，但公司尚未在公开文件中正式确认。
