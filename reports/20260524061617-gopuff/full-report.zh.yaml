      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Gopuff 采用联席 CEO 架构，两位联合创始人 Yakir Gola 和 Rafael Ilishayev 继续掌握日常经营权。两人在 Philadelphia 的 Drexel University
              本科就读时相识，2013 年借来一辆面包车，从公寓出发做深夜便利品配送。两人同为 Israeli-American，创业直觉来自学生生活，这塑造了公司重速度、重运营强度、重创始人决策的文化。


              Starbucks 创始人、美国零售业最知名的品牌建设者之一 Howard Schultz 于 2026 年 4 月加入 Gopuff 董事会。Gopuff 将 Schultz
              的任命包装为对其“改变购物未来”愿景的信心背书。这个任命给董事会补上了全球消费品牌扩张、实体运营与客户体验平衡方面的经验，正好对应 Gopuff 下一阶段需要解决的问题。曾任职 BlackRock 的 Matt
              McBrady 在 2025 年 11 月轮次前后加入担任首席财务官，把机构金融纪律带进领导团队。


              联席 CEO 治理把决策集中在创始人手中，带来关键人风险，但也保留了运营敏捷性。除 Schultz 之外，Gopuff 尚未披露完整董事会组成或独立董事名单。公司为私营企业，以 GoBrands, Inc.
              运营，未提交公开财务文件，因此治理与资本结构细节需要通过直接尽调获取。经历 $5.25B 稀释性融资后，创始人持股比例未披露。
