      - number: '8.5'
        title: 建议、退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              基于截至 2026 年 5 月收集的证据，本章建议为观察，置信度为中等。估值立场为偏高，风险评级为高。

              $8.5 billion 的私募入场价若没有清晰证据支撑，就无法用公开市场可比公司来辩护。证据至少需要满足其一：（a）收入显著高于 $800M–$1.0B 估计，最好接近 $1.2 billion
              或以上；或（b）经营结果 EBITDA 为正，并在 S-1
              或同等文件中披露可信的自由现金流时间表。公司确实展现出运营改善：在美国和英国即时零售品类的幸存者溢价、改善的贡献经济、与顶级消费品牌的合作，以及史上质量最高的 CFO
              任命。但按公开可比公司口径，这些利好似乎已经被计入当前估值，甚至被透支。更有纪律的风险 / 回报配置，是在 IPO 定价时重新入场，尤其是在 S-1 披露清晰财务轨迹之后。

              从结构上看，退出准备度很高：CFO 任命释放出临近 IPO 准备的信号，PitchBook 指标 96%+ 也反映市场共识，即 Gopuff 正走在 2026–2027 年公开发行轨道上。但截至 2026 年 5
              月，公司尚未提交 S-1，尚未公布价格区间，私募财务数据对外部投资者仍不透明。触发降级至回避的投资逻辑破裂信号包括：（1）收入重新跌破 $700 million，（2）现金消耗回到每年 $300 million
              以上，或（3）新股轮估值低于 $6 billion，这将确认市场对高估值的共识并削弱 IPO 叙事。

              在当前私募标记下出资前，核心尽调清单集中在六项：经审计 GAAP 财务报表；按季度拆分的 FCF 轨迹；广告和 SNAP 收入拆分；不同退出情景下的优先权分配瀑布模型；按地区拆分的单位经济；以及 2024
              年重组后的当前员工数和劳动力成本结构。缺少这些输入，$8.5 billion 私募投资本质上是在押注 IPO 执行势能，而不是基于基本面的估值。
