      - number: '8.2'
        title: 可比估值分析——上市同业、私募轮次与即时零售基准
        blocks:
          - type: paragraph
            body: >
              在 $8.5 billion 标记下，Gopuff 隐含 EV/Revenue 倍数约为 9–11x，基于估计的 $800M–$1.0B 年化净收入。到 2026 年 5
              月，公开市场尚未给任何可比的规模化配送平台这样的溢价。最接近的两家上市同业 DoorDash 和 Instacart 的交易倍数结构性更低，尽管两者与 Gopuff 模型也有重要差异。

              DoorDash（NASDAQ: DASH）按约 $14.7 billion LTM 收入交易，EV/Revenue 约 4.6x，企业价值约 $67.6 billion。DoorDash 约 31%
              的收入增速、扩张中的 EBITDA，以及轻资产平台模式，足以让它相对纯配送同业享有溢价；即便如此，Gopuff 隐含 9–11x 仍大约是 DoorDash 倍数的两倍，而 DoorDash
              规模大得多、盈利路径更清晰，还拥有公开市场流动性溢价。结构差异很关键：DoorDash 是平台，连接消费者、餐厅和零售商，不囤库存；Gopuff 垂直整合的自有前置仓模式则掌握整条供应链。

              Instacart（NASDAQ: CART）按约 $4.0 billion LTM 收入交易，EV/Revenue 约 2.2–2.3x；截至 2026 年 5 月，市值约 $9–10
              billion。Instacart 报告 Q1 2026 GTV 同比增长 13%、总收入同比增长 14%，adjusted EBITDA 为 $300 million，对应 29% EBITDA
              margin；GAAP 净利润 $144 million，同比增长 36%。Instacart 的杂货 + 广告模型与 Gopuff 的零售媒体抱负有重叠，但纯杂货平台结构比 Gopuff
              自有履约中心网络资本强度更低。

              在即时零售私营同业中，这组样本更像警示数据。Getir 估值峰值 $12 billion，但到 2024 年已退回土耳其本土市场，退出美国、英国和多数欧洲国家，并毁掉其累计融资约 $1.8 billion
              的大部分。Gorillas 曾在欧洲估值超过 $1 billion，被 Getir 收购后又被逐步关停。疫情繁荣期，欧洲风投资金估计向即时零售投入 $5.5 billion；大部分资本已经减值。Gopuff
              作为美国和英国最后一家大型独立即时零售运营商存活下来，确实带来市场出清后的稀缺溢价；但仅靠这项溢价，无法支撑相对盈利上市同业 4–5x 的倍数差。

              较可辩护的混合倍数框架，是对 Gopuff 收入基数使用 5–8x EV/Revenue：承认广告 / 媒体层、美国市场龙头的稀缺溢价，同时扣除 30–40% 私营公司折价，以反映流动性不足和财务不透明。在收入
              $900M、混合倍数 6x 下，内在价值约 $5.4 billion，显著低于 $8.5 billion
              标记。差距意味着当前标记要么计入了远高于公开估计的未披露收入，要么计入了一条快速盈利和倍数重估路径，而公开财务数据尚未支持这一点。
