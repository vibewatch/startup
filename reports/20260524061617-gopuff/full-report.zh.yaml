  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: B2C 消费者细分：人口结构、使用场景与规模
        blocks:
          - type: paragraph
            body: >
              Gopuff 的核心客户是追求便利的城市消费者，主要是 24–34 岁的 Gen Z 和千禧一代。他们看重的是零食、饮料、家庭日用品、酒类和非处方药能在 15–30 分钟内送达，且没有加价或替代品。公司 2013
              年起家于 Drexel University 宿舍配送，这解释了其核心客群来源；即便后来扩张到美国 1,000 多个城市和英国 16+ 城市，这一客群仍被保留。Gopuff app 累计下载量超过
              20M，2023 年活跃购物者约 1.8M，低于 2021 年 2.6M 的峰值。下滑反映了疫情时期需求回落，也反映 2022 年关闭 76 个美国仓库（网络 12%）以及 2024 年进一步裁员的影响。


              Gopuff 还接受符合条件食品杂货的 SNAP EBT，把触达延伸到通常不被高端配送平台充分覆盖的低收入家庭。其 500+ 微型履约中心靠近目标人口中心，可支撑 24/7
              运营，包括深夜便利购物这一非食品杂货配送平台服务不足的独特行为场景。在英国，Amazon–Gopuff 合作于 2025 年 7 月全国铺开，把消费者触达扩展到 Amazon 既有客群，覆盖
              London、Manchester、Birmingham、Bristol 等 16+ 城市，配送时间低于 60 分钟。
