          - type: callout
            title: 贡献利润 ≠ 盈利——关键指标缺口
            body: >-
              Gopuff 在 2025 年 11 月新闻稿中提到正贡献利润和创纪录收入，但没有提供经审计财务报表，也没有回应公司整体 EBITDA。贡献利润在扣除公司总部开销、研发和中央技术成本之前计算。贡献利润与
              EBITDA 之间的缺口，是最直接决定 Gopuff 能否自筹 IPO 准备资金、还是需要另一轮私募融资的尽调问题。
