  - id: FE001
    title: Gopuff 产品与技术架构栈
    type: stack
    layout: standard
    summary: |
      五层架构覆盖消费者界面、订单与库存管理、履约与路径调度、智能与个性化，以及合作伙伴 / 变现。
    data:
      layers:
        - label: 消费者界面
          modules:
            - iOS 应用（Swift，4.8/5，237K+ 条评分）
            - Android 应用（Kotlin，Google Play）
            - 桌面端与移动网页（React/Redux，2025 年改版加入 MFC 直播）
        - label: 订单与库存管理
          modules:
            - OMS 状态机（Pending→Confirmed→Preparing→Packed→Dispatched→Delivered）
            - 实时库存预留（付款确认前锁定库存）
            - 支付处理（信用卡 / 借记卡、Apple Pay、Venmo、SNAP EBT）
        - label: 履约与路径调度
          modules:
            - MFC 运营软件 — 拣货 / 打包流程、商品扫描
            - Kafka 事件驱动配送员调度（Android Driver app，4.1/5，500K+ 次下载）
            - 第三方干线承运商，负责 MFC 间库存补货
        - label: 智能与个性化
          modules:
            - 需求预测与补货 ML（超本地，自研）
            - Gopuff Ads AI/ML（1,000+ 个实时变量，<50ms 投放响应，10 年训练数据）
            - 推荐引擎（个性化店面、趋势商品、生日优惠）
        - label: 合作伙伴与变现层
          modules:
            - Gopuff Ads Platform（目标导向购买、Brand Shops、AdAdapted Add-It）
            - Powered by Gopuff / Storefronts API（Shopify 集成、UPC SKU 映射）
            - Koddi 增量测量 + The Trade Desk 程序化入口
    approximationNotes: |
      技术栈细节（Kafka、Databricks、React/Redux、Python、Ruby on Rails、Docker）来自第三方技术分析，Gopuff 未正式确认。层级顺序反映数据 / 控制流；实际微服务拓扑为专有信息。
    claimRefs:
      - CE021
      - CE022
      - CE011
      - CE015
      - CE017
  - id: FE002
    title: Gopuff 客户订单流程 — 从点击 App 到送达门口
    type: flow
    layout: standard
    summary: |
      端到端订单生命周期：客户下单后，MFC 实时拣货，Kafka 调度分配配送员，最终送达门口，并提供实时透明功能。
    data:
      nodes:
        - id: customer-order
          label: 客户通过 App 或网页下单（IP 区域检测预先校验 MFC 可用性）
        - id: oms-reserve
          label: OMS 确认付款，并在最近 MFC 预留库存（实时锁货）
        - id: mfc-pick
          label: MFC 员工拣货并扫描商品；客户看到拣货员姓名和逐项更新
        - id: kafka-dispatch
          label: Kafka 调度服务通过 Driver app 把订单分配给可用配送员
        - id: courier-deliver
          label: 配送员从 MFC 取走封袋并送到门口（目标：15–30 分钟）
        - id: live-track
          label: 客户实时追踪：司机位置、车辆信息，网页可看 MFC 直播
      edges:
        - from: customer-order
          to: oms-reserve
          label: 付款 + 区域校验
        - from: oms-reserve
          to: mfc-pick
          label: 拣货队列分配
        - from: mfc-pick
          to: kafka-dispatch
          label: 已打包状态事件
        - from: kafka-dispatch
          to: courier-deliver
          label: 配送员接单
        - from: courier-deliver
          to: live-track
          label: 实时 GPS + 状态更新
