            body: >
              所有直接竞争者（包括 Gorillas、Getir（美国 / 英国）、Jokr、Fridge No More、Buyk）退出或失败后，Gopuff
              成为美国和英国唯一仍具规模的即时零售运营商。这项幸存者溢价真实存在、复制难度不低，并在近期为城市市场提供持久护城河。每单贡献利润提升至 $4 以上，说明垂直整合模式在高密度地区可以跑出经济性。
