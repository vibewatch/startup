      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重性
      rows:
        - label: 劳工错误分类执法（DC + MA）
          values:
            - label: 高
              tone: negative
              detail: 两个州总检察长已经起诉；第三州连锁扩散模式开始出现。
            - label: 极高
              tone: negative
              detail: 若判决不利，将追溯补薪，并结构性推高劳动力成本。
            - label: 低
              tone: negative
              detail: 上诉进行中；没有结构性和解或纠正性同意令。
            - label: 极高
              tone: negative
              detail: 未公开承诺解决路径；级联风险仍未缓释。
        - label: 酒类牌照合规（ABCC 先例）
