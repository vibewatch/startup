              detail: 若前 5 大市场牌照丢失，将构成重大收入事件。
            - label: 中
              tone: warning
              detail: 已部署培训项目和 ID 扫描技术；合规只发生在下单后。
            - label: 高
              tone: negative
              detail: 规模化后承担多州牌照义务；审计型风险仍在。
        - label: 烧钱与 IPO 时点不确定
          values:
            - label: 高
              tone: negative
              detail: 截至 2026 年 5 月未提交 IPO 文件；2023 年烧掉 $400M；现金跑道取决于下一次资本事件。
            - label: 高
              tone: negative
              detail: 市场窗口关闭会迫使公司以进一步压缩的估值再做一轮私募融资。
            - label: 低
              tone: warning
              detail: 新 CFO 和新增董事释放准备信号，但尚未提交 S-1。
            - label: 高
              tone: negative
              detail: 无经审计盈利能力；贡献利润说法未获第三方验证。
        - label: 低密度市场 MFC 单位经济模型失效
          values:
            - label: 中
              tone: warning
              detail: 此前扩张进入密度不足市场，导致 2022 和 2024 年被迫关站。
            - label: 高
              tone: negative
              detail: 需求低谷期，固定租约和人工成本躲不开。
            - label: 中
              tone: warning
              detail: 已有市场退出打法；AI 预测在改善损耗。
            - label: 中
              tone: warning
              detail: 无公开单 MFC 盈亏平衡数据；新市场仍有剩余密度风险。
        - label: 合作伙伴集中（Starbucks、Amazon）
          values:
            - label: 低
              tone: positive
              detail: 截至 2026 年 5 月，两个合作仍在积极扩张。
            - label: 高
              tone: negative
              detail: 任一合作终止，都会同时压低下单频次和客单价。
            - label: 低
              tone: warning
              detail: 合同条款未公开；未披露最低合作期限保证。
            - label: 高
              tone: negative
              detail: 议价权偏向这两个合作伙伴；Gopuff 续约筹码有限。
        - label: 客户流失与服务质量
          values:
            - label: 高
              tone: negative
              detail: Trustpilot 评分 1.4/5；PissedConsumer 上有 637+ 条配送准确性投诉。
            - label: 中
              tone: warning
              detail: 冲动消费品类流失偏高，切换阻力低。
            - label: 低
              tone: negative
              detail: 公司未公开披露改善客服响应时效的计划。
            - label: 中
              tone: warning
              detail: 竞争对手可替代性强，差评若持续，会长期推高流失。
    approximationNotes: 可能性和成熟度评级基于公开可得证据；内部运营数据、审计发现和私人诉讼准备金未供审查。
    claimRefs:
      - CR001
      - CR003
      - CR011
      - CR014
      - CR018
      - CR021
      - CR022
      - CR026
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 法律和监管执法、MFC 成本压力、合作伙伴风险和客户流失，都会传导到收入和利润率，再进一步影响 IPO 可行性和估值；执行与领导层集中风险会放大其他每个节点。
    data:
      nodes:
        - id: legal
          label: 法律 / 监管执法
          detail: DC AG 错误分类诉讼、MA 处罚通知、酒类牌照合规、大麻业务不确定性。
          tone: negative
        - id: labor_cost
          label: 劳动力成本跃升
          detail: 若重新分类裁定落地，单笔配送成本会结构性抬升。
          tone: negative
        - id: mfc_econ
          label: MFC 单位经济压力
          detail: 固定成本底座需要订单密度支撑；密度受流失和竞争影响。
          tone: warning
        - id: partner
          label: 合作伙伴集中风险
          detail: Starbucks 和 Amazon 存在终止风险；资本依赖 Eldridge。
          tone: warning
        - id: churn
          label: 客户流失
          detail: Trustpilot 评分低、配送失败、竞争替代性强。
          tone: negative
        - id: revenue
          label: 收入风险
          detail: 牌照丧失、客户流失、合作伙伴退出，都会直接压低收入。
          tone: negative
        - id: margin
          label: 利润率压缩
          detail: 劳动力成本上升和 MFC 固定成本挤压贡献利润率。
          tone: negative
        - id: ipo
          label: IPO 可行性
          detail: 不利裁决、利润率压缩或估值下行，都可能推迟或取消 IPO。
          tone: warning
        - id: valuation
          label: 估值
          detail: 已从 $15B 压缩到 $8.5B；若诉讼继续恶化或合作伙伴流失，估值还会承压。
          tone: negative
        - id: exec
          label: 执行 / 领导层集中
          detail: 联席 CEO 的关键人风险和 IPO 分心，会放大运营响应滞后。
          tone: warning
      edges:
        - from: legal
          to: labor_cost
          label: 重新分类裁定
        - from: legal
          to: revenue
          label: 牌照吊销
        - from: labor_cost
          to: margin
          label: 成本跃升
        - from: mfc_econ
          to: margin
          label: 固定成本吸收
        - from: partner
          to: revenue
          label: 合作伙伴终止
        - from: churn
          to: revenue
          label: 下单频次下降
        - from: revenue
          to: ipo
          label: 增长轨迹
        - from: margin
          to: ipo
          label: 盈利路径
        - from: ipo
          to: valuation
          label: 公开市场重估
        - from: exec
          to: ipo
          label: 准备滞后
        - from: exec
          to: legal
          label: 响应延迟
    claimRefs:
      - CR001
      - CR002
      - CR011
      - CR014
      - CR021
      - CR026
      - CR030
      - CR033
      - CR034
      - CR038
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Gopuff 的运营模型靠 Starbucks 撑住品牌和购物篮，靠 Amazon 带来市场需求，靠 Eldridge 提供资本，靠独立承包司机跑最后一公里，也靠州监管机构发放受监管品类配送所需的牌照。
    data:
      nodes:
        - id: gopuff
          label: Gopuff
          detail: 运营覆盖约 1,000 个城市的即时零售网络；采用垂直整合的 MFC 模式。
          tone: neutral
        - id: starbucks
          label: Starbucks
          detail: 品牌和购物篮锚点；MFC 内配备 Starbucks 培训的咖啡师；交叉销售率 80%。
          tone: warning
        - id: amazon
          label: Amazon (UK)
          detail: 市场需求入口；Gopuff 履约经 Amazon.com UK 导入的订单。
          tone: warning
        - id: eldridge
          label: Eldridge Industries
          detail: 2025 年 11 月领投 $250M Series F；核心私募资本提供方。
          tone: warning
        - id: drivers
          label: 司机 / 承包商池
          detail: 独立承包商承担最后一公里配送；若被重新分类，错误分类风险会推高成本。
          tone: warning
        - id: regulators
          label: 州监管机构（酒类 / 大麻）
          detail: 发放和吊销运营牌照；包括 ABCC、州 AG 和酒类监管机构。
          tone: negative
        - id: app_stores
          label: 应用商店（Apple / Google）
          detail: 移动分发渠道；面临 30% 费用和年龄验证政策敞口。
          tone: neutral
        - id: mfcs
          label: 微履约中心（MFC）
          detail: 约 700+ 家暗店，支撑自有库存履约；高固定成本基础设施。
          tone: neutral
      edges:
        - from: starbucks
          to: gopuff
          label: 品牌合作 / 咖啡师
        - from: amazon
          to: gopuff
          label: 市场需求
        - from: eldridge
          to: gopuff
          label: 资本（$250M）
        - from: drivers
          to: gopuff
          label: 最后一公里配送
        - from: regulators
          to: gopuff
          label: 牌照发放 / 吊销
        - from: app_stores
          to: gopuff
          label: 移动分发
        - from: gopuff
          to: mfcs
          label: 拥有 / 运营
        - from: gopuff
          to: drivers
          label: 派单 / 付酬
    claimRefs:
      - CR013
      - CR026
      - CR027
      - CR028
      - CR029
      - CR001
      - CR047
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: |
      从证据支柱（规模、单位经济、风险因素、估值）到“观察”建议的链条。
    data:
      nodes:
        - id: scale
          label: 规模：美国 + 英国唯一存活的即时零售运营商（累计融资 >$5.25B，网络最大）
        - id: economics
          label: 单位经济：单笔订单贡献利润 >$4；广告利润率改善；FAM 留存提升
        - id: risk
          label: 风险：$5.25B 优先股堆叠；无经审计 P&L；曾持续烧钱；固定成本模式
        - id: valuation
          label: 估值：隐含 EV/Revenue 为 9–11x，盈利上市可比公司为 2.3–4.6x
        - id: recommendation
          label: 观察 — 改善已计入价格；等待 S-1 和 IPO 定价发现
      edges:
        - from: scale
          to: recommendation
        - from: economics
          to: recommendation
        - from: risk
          to: recommendation
        - from: valuation
          to: recommendation
    approximationNotes: |
      流程展示从证据到建议的逻辑链，不是 DCF 或量化加权模型。节点标签概括各章节小节的发现。
    claimRefs:
      - CV044
      - CV001
      - CV038
      - CV041
      - CV020
  - id: FV002
    title: 估值对 EV/Revenue 倍数的敏感性
    type: bar
    layout: standard
    summary: |
      将不同 EV/Revenue 倍数套用于 $900M 基准收入估计，得到隐含企业价值；并与 DoorDash、Instacart 的上市倍数以及当前私募估值标记对照。
    data:
      items:
        - label: 2.3x（Instacart 上市倍数）
          value: 2070
        - label: 4.0x（混合底线）
          value: 3600
        - label: 4.6x（DoorDash 上市倍数）
          value: 4140
        - label: 6.0x（混合估计）
          value: 5400
        - label: 8.0x（温和溢价）
          value: 7200
        - label: ~9.4x（当前 $8.5B 标记）
          value: 8500
        - label: 12.0x（乐观情景目标）
          value: 10800
    approximationNotes: |
      所有数值均为百万美元。$900M 基准收入取自第三方估计 $800M–$1.0B 区间的中点；拿到经审计收入后，应重新计算实际倍数。当前估值柱直接使用 2025 年 11 月 $8.5B 新股估值。
    claimRefs:
      - CV020
      - CV017
      - CV018
      - CV024
      - CV027
  - id: FV003
    title: 按情景划分的估值 / 回报区间
    type: range
    layout: standard
    summary: |
      Gopuff 以百万美元计的乐观、基准、悲观退出估值区间，基于 TV003 中的情景假设。
    data:
      items:
        - label: 悲观低端
          low: 3000
          high: 4500
        - label: 悲观
          low: 4500
          high: 6000
        - label: 基准
          low: 8000
          high: 12000
        - label: 乐观
          low: 12000
          high: 16000
        - label: 乐观高端
          low: 15000
          high: 20000
    approximationNotes: |
      区间以百万美元计。上一轮新股融资估值为 $8.5B。悲观区间意味着 2021 年投资人面临本金全部损失；基准区间意味着上一轮投资人回报持平至小幅为正；乐观区间意味着较上一轮估值标记溢价 69–135%。所有数字均为情景测算示意。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV020
  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: |
      投委会可用评分，覆盖市场、单位经济、护城河、财务证据、风险、估值和证据质量维度（0–10 分）。
    data:
      items:
        - label: 市场机会
          value: 7
          max: 10
        - label: 产品 / 单位经济
          value: 5
          max: 10
        - label: 竞争护城河
          value: 6
          max: 10
        - label: 财务证据质量
          value: 3
          max: 10
        - label: 风险画像
          value: 3
          max: 10
        - label: 估值吸引力
          value: 2
          max: 10
        - label: 证据深度
          value: 5
          max: 10
    approximationNotes: |
      分数反映截至 2026 年 5 月，章节作者基于公开证据作出的判断。缺少经审计财务数据，财务证据质量得分较低；相较上市可比公司，估值倍数偏高，估值吸引力得分较低。分数不是可投资评级。
    claimRefs:
      - CV037
      - CV038
      - CV020
      - CV043
      - CV047
      - CV048
