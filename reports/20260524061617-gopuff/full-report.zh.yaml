      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >-
              Gopuff 核心用户是 18–34 岁的城市或郊区成年人。Business of Apps 证实，使用 Gopuff 的最大年龄段是 24–34 岁。DemandSage 数据显示，线上餐食配送——quick
              commerce 采用的直接行为预测指标——在 25–34 岁女性用户中渗透率最高，为 44.5%，同年龄段男性为 42.3%，55 岁后使用率明显下滑。这使 Gopuff 的主要用户群落在
              Millennials 和 Gen Z，两代人在 2025 年代表美国消费者支出的 32%（较 2020 年提升 8 个百分点，据 Numerator）。

              行为画像进一步强化了这个人口特征。按 Deliverect 数据，Gen Z 的食品配送 app 使用率为 63%，Millennials 为 51%。GoDaddy 的 2025 Consumer Pulse
              调查发现，54% 的 Gen Z 和 50% 的 Millennials 偏好避免人与人接触的购买方式——这正是 Gopuff 提供的无摩擦 app 到门模式。同一调查还发现，86% 的 Gen Z 和 76%
              的 Millennials 每月至少一次在线购买商品后路边或到店取货，其中 23–27% 每周这么做，说明便利预期已经习惯化，而不是偶发使用。

              预算主要来自个人可支配支出。不同于企业软件或医疗采购，Gopuff 的付款方是终端消费者，通常用借记卡 / 信用卡或数字钱包付款。Gopuff 扩大到全国接受 SNAP EBT（在 2025
              年融资轮宣布），打开了一个历史上很少被高端便利配送选项服务的低收入新客群。

              次级用户分层包括大学生（Gopuff 在 Drexel University 的原始滩头市场）、需要按需购买家居必需品的职场父母，以及深夜 /
              清晨无法到实体门店的消费者。品牌广告主代表另一个独立付款方分层——品牌向 Gopuff 付费，购买商品陈列、试用活动和触达其集中用户群的“drop”营销事件。

              在英国，Mordor Intelligence 的发现佐证了消费者为高端配送费付费的意愿：便利驱动的行为变化在短期内为英国市场 CAGR 贡献 1.5%，且 2024 年英国市场 55.55% 来自 10
              分钟内订单配送，表明用户对最快服务层有强需求。
