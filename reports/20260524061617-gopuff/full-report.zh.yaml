  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >
              Gopuff 的收入来自六条清晰的流，均锚定其垂直一体化微型履约模式。最大、最结构性的收入流是商品毛利：Gopuff 批发采购消费品，再按零售价转售，在计入配送和仓储管理费用前，估计捕获 20–30%
              商品毛利。不同于 marketplace 模式（例如 DoorDash），Gopuff 端到端持有库存，因此直接捕获毛利，但也承担完整库存持有风险。每个履约中心约备有 4,000 个
              SKU，覆盖零食、饮料、家居用品、酒类和医疗保健产品。每单约 $1.95–$2.95 的配送费提供交易收入，Gopuff Fam 订阅用户可免配送费。Gopuff Fam 订阅——每月 $7.99，或年付折算每月
              $5.99，较 2023 年 $5.95 上调——产生经常性收入；面向 1,000 多个大学校园提供每月 $3.99 的折扣 Student Fam 档位。零售媒体平台让 CPG 品牌为 app
              内赞助位付费，并越来越多地让非相关广告主（如 Apple TV+、Noom）在结账后配送窗口触达 Gopuff 受众——从购买到送达之间大约 30 分钟的互动窗口。以 "Basically"
              品牌销售的自有品牌产品，相比品牌同类商品毛利更高。通过 BevMo 和 Liquor Barn 门店品牌做酒类与受监管产品配送，在标准商品毛利之上增加合规费用层。第三方估计 Gopuff 2023 年总收入约
              $1.2B，较 2022 年（约 $1.55B）下降 20–22%，也显著低于 2021 年峰值（约 $1.88B）。分析师来源估计 2024–2025 年收入在 $700M 至 $1B
              之间；公司尚未公开披露精确收入数字。
