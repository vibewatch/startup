          - type: callout
            title: 观察：等待 S-1 和 IPO 价格发现
            body: >
              观察建议承认 Gopuff 确有运营改善——幸存者溢价、贡献经济改善、IPO 信号可信——但入场价格高于可辩护的公开市场可比估值。公司尚未提交 S-1。承销这项溢价最关键的三个数据点，是经审计财务、FCF
              轨迹和广告收入拆分。有纪律的入场点是 IPO 定价，届时财务透明度和公开市场价格发现可以为倍数定锚。
