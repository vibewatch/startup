      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 劳动错误分类是近期最具可操作性的单一风险
            body: >-
              活跃的 DC 总检察长诉讼，加上 Massachusetts 待决的 $6.2M 罚单上诉，且两者都发生在 24 个月窗口内，提高了 Gopuff IPO
              前至少出现一次不利裁决的概率。若最终不利判决要求改为雇员分类，将结构性抬高单次配送人工成本、压缩贡献利润率，并迫使公司在进入公开市场前重新承销业务模型。
            calloutType: risk
