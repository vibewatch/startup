      - number: '2.5'
        title: 采用约束与反向观察
        blocks:
          - type: paragraph
            body: >-
              Quick commerce 面临结构性盈利挑战，已有充分记录，也直接关系到 Gopuff 的市场轨迹。StrangeMatter 对 Gorillas 崩塌的分析展示了行业失效模式：2021 年，$5.5B
              风险资本涌入欧洲 app 食品杂货配送，但到 2025 年，其中多数公司已不复存在。Gorillas、Fridge No More、Buyk、Jokr 等关闭或撤出主要市场。根本问题是单位经济：客单价小（行业平均
              $10–20）、最后一公里人力成本高、暗店在非高峰时段利用不足，使每单贡献利润在没有高下单频次时为负。

              零工劳动者分类监管压力是实质约束。2025 年 3 月，DC Attorney General 对 Gopuff 提起诉讼，指控其自 2014
              年起将配送员错误分类为独立承包商，从而规避最低工资、加班费、病假和工伤赔偿义务。Massachusetts AG 办公室此前也曾因错误分类向一家全国配送服务公司开出 $6.2M 罚单。若法院或监管机构将
              Gopuff 司机队伍重新分类，劳动成本会大幅上升，压低配送环节单位经济。

              暗店 zoning 和社区反对限制地理扩张。FreightAmigo 将 2025 年识别为暗店 zoning 规则加速收紧的一年：仓储和零售用途分类模糊拖慢许可；住宅区反对 24/7
              运营带来的交通、噪音和停车影响；城市开始施加缓冲区、噪音上限和社区影响研究要求。在商业区，一些城市要求暗店占商业空间不超过 20%，迫使 Gopuff 采用混合运营或投资独立定制设施。

              竞争格局中的集中风险是一把双刃剑。市场已整合到少数幸存者——这验证了 Gopuff 的韧性——但也意味着 DoorDash DashMart 按 PlottData 数据以 45% 年增速扩大
              GMV，而同一数据中 Gopuff 的 GMV 同比收缩约 15%。CTOL Digital 分析指出，Gopuff 2025 年末 $8.5B 估值比 2021 年 $15B 峰值低 43%，也远低于 2022
              年传闻中的 $40B 内部估值。按 DemandSage FAQ，多数美国 quick commerce 公司仍未盈利，Gopuff 也仍在报告亏损。

              疫情后需求正常化将美国增长压低到 7–8% CAGR，而非 2020–2021 年的三位数增速。行业“第二幕”——Gopuff 自己的 $250M 融资新闻稿也把公司置于其中——要求公司把忠诚复购用户转化为高频
              FAM 会员，扩大高毛利 SKU（鲜食、自有品牌、品牌合作），并提高广告收入，以抵消大宗便利品薄弱的单均利润。
