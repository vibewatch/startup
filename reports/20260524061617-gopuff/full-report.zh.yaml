chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              GoBrands, Inc. 以 Gopuff 名义运营，总部位于
              Philadelphia，是一家即时零售公司，通过自有微型履约中心（MFC）网络销售便利与食品杂货商品——零食、饮料、家居必需品、非处方药和酒类。Gopuff
              的核心差异在于自有库存模式：不同于撮合第三方零售商订单的 marketplace 平台，Gopuff 批发采购库存，存放在专门搭建的暗店，并让受训员工在 90
              秒内完成拣货和打包，再交给独立配送骑手。垂直一体化把供应链压缩到一个运营主体，让公司可以承诺 15–30 分钟送达，而不依赖合作门店是否有货，也不承受代购员替换商品。


              每个 MFC 通常备有约 3,000 个 SKU，选址和规模围绕一到两英里内的服务客群设计。实时库存可视化消除了下单时大多数缺货失败。收入来自相对批发价的品类加价、固定配送费、Gopuff Fam
              会员订阅（免配送费或折扣配送）、Basically 和 Crave Shoppe 品牌下的自有品牌商品，以及面向 CPG 合作伙伴扩张的零售媒体广告渠道。公司在 2025 年 11
              月融资沟通中披露，单均贡献利润高于 $4。截至 2026 年，Gopuff 覆盖美国 500 多个城市和镇，并进入英国，是两个市场最大的全国性即时履约网络。


              产品最早源于 2013 年面向 Drexel University 学生的水烟与日用品配送服务。创始人很快意识到，能让即时配送在规模化时跑通经济账的架构，不是轻资产撮合，而是自有库存和超本地履约。这个判断经历了
              $5.25B 融资、全球扩张、收缩回美国和英国，以及五轮裁员，至今没有让公司放弃基于 MFC 的垂直一体化。
