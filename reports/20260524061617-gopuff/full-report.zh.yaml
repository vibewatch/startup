      - number: '1.5'
        title: 重组、裁员与盈利转向
        blocks:
          - type: paragraph
            body: >-
              Gopuff 自 2022 年中以来的轨迹，本质上是资本市场收紧后，整个 q-commerce 行业都没能解决的“增长还是盈利”权衡被迫重定价。2022 年 3 月至 2024 年 5
              月，公司进行了五轮裁员，合计约 3,850 个岗位：2022 年 3 月 450 人，2022 年 7 月 1,500 人（10%），2022 年 10 月 250 人，2023 年 3 月约 100
              人，2024 年 5 月 600 人（6%）。与此同时，公司在 2022 年 7 月关闭 76 个美国仓库（约占网络 12%），2022 年 8 月完全退出西班牙（裁掉全部 186
              名西班牙员工），并收缩或整合法国和卢森堡业务，把欧洲资源集中到英国。


              CEO Yakir Gola 在 Financial Times 和 Bloomberg 上把转向公开定义为有意选择“be the best in the world at instant
              delivery”，而不是追逐地理广度。他强调，Gopuff 2023 年烧钱约 $400M，并设定在 2024 年底实现自由现金流为正的目标。2025 年 11
              月融资材料提到“创纪录的财务表现”和单均贡献利润高于 $4，但 2024 与 2025 全年自由现金流状态尚未得到独立确认。


              竞争格局奖赏了 Gopuff 的生存本能。欧洲和美国主要 q-commerce 对手——Getir、Gorillas、Flink、Jokr——均在 2022 至 2024 年间退出美国或关闭。DoorDash
              收购 Deliveroo，再加上大多数专门做快速配送的初创公司撤退，使 Gopuff 成为美国唯一具有全国规模的自有库存即时配送运营商。投资人 Todd Boehly 在 2025 年 11 月交割时把
              Gopuff 描述为“the last one standing”，正反映这种战略位置。尚未解决的尽调问题是：公司是否已在整个 MFC
              网络上跑出可持续单位经济，而不仅仅是正的贡献利润——还要把已分摊的管理费用和资本开支计入。
