      - number: '7.6'
        title: 执行风险、终止标准与尽调请求
        blocks:
          - type: paragraph
            body: >-
              Gopuff 的执行风险集中在三个交织的脆弱点：联合创始人关键人集中、IPO 准备分散注意力，以及盈利目标不断后移却缺乏清晰结构性变化的残余风险。联合创始人 Yakir Gola 和 Rafael
              Ilishayev 仍担任联合 CEO。双负责人结构在速度和一致性上有优势，但也产生单点离任风险：任一创始人离开，都会触发投资者信心问题和领导层真空。两人都没有公开明确的继任者。


              IPO 准备——2025 年 11 月 CFO 任命和 2026 年 4 月 Howard Schultz 董事席位释放了这一信号——消耗管理层注意力，并带来窗口依赖风险。如果 IPO
              市场在提交前关闭，Gopuff 要么再次私募融资（估值很可能进一步压缩），要么比当前轨迹暗示得更快实现现金流自给。公司自 2022 年以来反复表述“盈利路径”，但没有拿出经审计证据证明公司整体 EBITDA
              盈亏平衡。每次延迟都会引发一个问题：模型是否受到根本约束，还是公司仍在走向真实拐点。


              本投资逻辑的终止标准应绑定可观察的外部事件，而不是公司指引：DC 或 MA 错误分类案件出现要求大规模追溯补发薪酬的不利终局裁决；失去 Starbucks 或 Amazon
              合作，且没有可比购物篮和品牌价值的替代；进一步新股融资价格低于 $6B；或监管行动永久撤销不止一个前五大市场的酒类或大麻配送许可证。上述任一事件单独发生，都应触发承销重新审查；若组合出现，则构成投资逻辑破裂情景。
