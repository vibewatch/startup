      - number: '4.6'
        title: 附录
        blocks:
          - type: callout
            title: 零售媒体是结构性高利润率杠杆
            body: >
              Gopuff 在 2023–2024 年建成自有广告平台，让公司在不增加配送成本的情况下，变现下单频次和结账后注意力。美国 CPG 在零售媒体网络上的广告支出预计每年为 $52B–$61B；Gopuff
              的目标用户购买意图强、下单近且速度快，与 Amazon 或 Instacart 形成差异。即便零售媒体只放大到收入的 5–10%，利润率画像也会明显改善。
            calloutType: strength
            claimRefs:
              - CI017
              - CI018
              - CI019
          - type: callout
            title: 单位经济性只有在高密度城市核心区才成立
            body: >
              全网单均 EBITDA 约 $0.88（分摊固定开销前），成熟高密度站点约 $3.00，凸显模型对密度的根本依赖。第三方失败分析也确认，要让低于 $15
              的订单配送盈利，必须达到只有最密集城市街区才可能实现的密度门槛。Gopuff 仅在 2021 年就估计烧掉 $400M–$600M，尽管收入达到约
              $1.88B；该模型在全国规模下被证明无法盈利。收缩至核心市场，会压缩业务可触达的 TAM。
            calloutType: risk
            claimRefs:
              - CI025
              - CI026
              - CI034
              - CI036
          - type: callout
            title: 财务承销前必须进入数据室
            body: >
              这家私营公司的所有关键财务指标——净收入、分收入流毛利率、月度烧钱、现金余额、订阅人数和 EBITDA——都未披露。公司声称 2025 年实现“创纪录收入和贡献利润”，但未经审计。投资前应取得：（1）经审计的
              FY2024 财务报表；（2）2025 年上半年管理账；（3）融资后现金余额和烧钱预测；（4）分部层面 P&L。Companies House 的英国子公司年度账目只覆盖部分业务，应与完整合并材料包一起阅读。
