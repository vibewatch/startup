  - id: FO002
    title: Gopuff 公司快照 — 价值链逻辑
    type: flow
    layout: standard
    summary: Gopuff 自有库存 MFC 模式如何把采购、履约和配送接成一条垂直整合链。
    data:
      nodes:
        - id: wholesale
          label: 批发采购
          detail: Gopuff 直接向 CPG 供应商和品牌采购库存
        - id: mfc
          label: 微型履约中心（400+）
          detail: 公司租赁前置仓，距客户 1-2 英里，存放约 3,000 个 SKU
        - id: pick-pack
          label: 员工拣货与打包（<90s）
          detail: 受训 MFC 员工在 90 秒内拣货并打包订单
        - id: courier
          label: 独立骑手网络
          detail: 零工骑手负责从 MFC 到客户门口的最后一公里配送
        - id: customer
          label: 客户（15–30 分钟送达）
          detail: 凭实时库存可见性在 15–30 分钟内完成订单
