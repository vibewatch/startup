  - id: TV005
    title: 投资逻辑破裂与终止触发器
    columns:
      - 触发项
      - 阈值 / 事件
      - 如何冲击投资逻辑
      - 行动含义
    rows:
      - - 收入下滑
        - 净收入连续两个季度低于 $700M
        - 需求模型失效；即时零售 TAM 叙事按当前形态无法成立
        - 下调至回避；停止考虑新增投资
      - - 现金消耗激增
        - 2024 年重组后，年度现金消耗仍回到 $300M 以上
        - FCF+ 路径继续延后；IPO 前融资风险升高
        - 要求更新财务；在下一轮新股定价时重评
      - - 低于 $6B 的降价融资
        - 新股轮投后估值低于 $6B
        - 证实估值过高判断；2021 年投资者账面亏损；管理层可信度受损
        - 下调至回避；既有仓位按市值重估
      - - 管理层离职
        - IPO 准备阶段 12 个月内，联席 CEO 或 CFO 离职
        - IPO 执行风险升高；投资者信心信号走弱
        - 重评 IPO 时间表；等待管理层连续性确认前维持观望
      - - IPO 撤回或延期至 2028 年以后
        - S-1 递交后撤回，或 IPO 延至 2028 年 Q4 以后
        - 流动性事件延后；资本市场通道和优先股堆叠动态恶化
        - 转为继续研究；要求董事会材料或老股市场数据
      - - 广告收入停滞
        - 到 2027 年底，零售媒体收入未达到净收入的 12%
        - 无法重估至高于配送业务的倍数；适用纯配送倍数（2–5x）
        - 用 DoorDash / Instacart 倍数重评估值；重新判定为合理 / 昂贵
    notes: |
      触发阈值是基于当前公开证据和配送行业类似先例的定性估计。经审计财务可得后，应重新校准这些阈值。
    claimRefs:
