        - 短期（已在市场中）
        - 用过 Gopuff 或同类平台的消费者已经被速度教育；转向实体店的流失会随时间下降
        - 跟踪复购率和 FAM 转化；调研客户 NPS 与替代服务对比
      - - Amazon-Gopuff 英国合作（Amazon.co.uk 15 分钟配送）
        - 顺风
        - 短期
        - 验证 Gopuff 基础设施质量；增加订单量，同时 Gopuff 不必承担获客成本
        - 确认合同条款和收入分成；评估 Amazon 作为分销渠道的依赖集中度
      - - FAM 会员计划增长
        - 顺风
        - 短期
        - 订阅抬高下单频次；贡献利润改善与会员渗透直接挂钩
        - 索取 FAM 订阅人数、月度下单频次和按队列划分的流失率
      - - 全国接受 SNAP EBT
        - 顺风
        - 短期
        - 把 SAM 扩至 42M SNAP 受益人；在曾质疑暗仓分区的城市，改善社会公平定位
        - 跟踪 SNAP 订单量和客单价；确认争议分区市场是否出现监管善意
      - - 品牌合作和广告收入
        - 顺风
        - 中期
        - Starbucks、Disney、Amazon、Tom Brady 旗下项目用 Gopuff 做快速新品投放；高毛利增量收入流
        - 索取广告收入占总收入比例；确认合同管线和平均交易规模
      - - 零工工人误分类监管（DC AG 诉讼、MA 罚单）
        - 逆风
        - 短至中期
        - 若重新分类为雇员，劳动成本会显著上升；如适用最低工资和福利，估计配送成本增加 15-30%
        - 跟踪 DC 诉讼结果；在雇员身份情景下建模下行单位经济性
      - - 暗仓分区反对和监管
        - 逆风
        - 短期
        - 社区影响研究、缓冲区和零售业态配比要求，会拖慢新暗仓开业并增加合规成本
        - 梳理待审分区申请；识别 Gopuff 面临实质许可延误的城市
      - - 疫情后需求正常化
        - 逆风
        - 已在市场中
        - 美国即时零售 CAGR 仅 7-8%，疫情期间为 65%；可触达基数增长不够快，单靠它无法抵消竞争压力
        - 复盘 2022 年以来月度订单量趋势；核验所谓“创纪录收入”是否对应稳定或增长的订单数，而不只是客单价上升
      - - 竞争对手扩张（DoorDash DashMart GMV 同比 +45%）
        - 逆风
        - 短至中期
        - DoorDash 的分销杠杆和现有 Dasher 网络降低其进入便利店即时配送的成本；Gopuff 自营库存形成差异化，但资本开支更重
        - 按城市比较暗仓经济性与 DoorDash DashMart 模式；评估 Gopuff 用户切换成本
    notes: >-
      时间判断基于 Mordor Intelligence 英国驱动因素分析、Gopuff 新闻室、CTOL Digital 估值分析、FreightAmigo 分区报告、StrangeMatter 即时零售失败案例分析，以及
