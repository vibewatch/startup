      - number: '6.4'
        title: 采用轨迹：增长、回落与伙伴驱动复苏
        blocks:
          - type: paragraph
            body: >
              Gopuff 的 B2C 采用轨迹显示出明显的疫情时期冲高和 2021 年后回撤。活跃用户从 0.3M（2019）升至 2.6M（2021），到 2023 年跌至
              1.8M，原因是需求正常化且公司关闭了数百个履约中心。总收入沿同一弧线变化：$200M（2019）→ $1.88B（2021）→ $1.2B（2023）。年度 app 下载量见顶后趋缓；2023 年 3.8M
              下载仍把新用户带入漏斗，但净活跃用户在下降。英国市场在 2022–2023 年收入增长（£42.8M → £78.1M），由订单量和合作伙伴推动；英国订阅收入也翻倍以上。


              伙伴渠道扩张是 2025–2026 年的主要增长向量。Amazon UK 全国铺开（2025 年 7 月）把 Amazon.co.uk 客户直接路由到 Gopuff 在 16+
              英国城市的履约网络，在不新增获客支出的情况下显著扩大可触达范围。Gopuff 已经通过 Uber Eats、DoorDash 和 Deliveroo 运营。品牌广告主侧，Koddi 测量项目在 2026
              年加速，说明活跃品牌客户名单在扩大。2024–2026 年活跃用户数没有公开披露；最近一次确认的 1.8M（2023）已滞后两年，考虑到持续运营收缩，应把它视为上限而非当前估计的下限。
