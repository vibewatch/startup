        - 预约制杂货配送、两日达电商、食材包订阅
        - 18–44 岁城市 / 郊区成年人，通过移动应用下单；个人可支配支出
        - 核心直接市场；2025 年美国规模 $8.78B；Gopuff 是美国最大的自有库存运营商
      - - 英国即时零售（<30 min 即时配送）
        - 英国城市中通过 MFC 提供的当日 30 分钟内日用品配送
