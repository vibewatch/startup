  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围定义
        blocks:
          - type: paragraph
            body: >-
              Gopuff 的相关市场不是宽泛的食品杂货或零售品类，而是一个具体行为触发点——“即时需求”。消费者半夜用完尿布、学习时想吃零食、早班机前需要感冒药，两天送达的 Amazon
              包裹或每周一次的食品杂货配送时段都解决不了。Gopuff 把自己定位为街角便利店的数字替代品，只通过自有库存微型履约中心（暗店）运营，库存包括 1,500–2,500 个
              SKU，覆盖零食、饮料、家居必需品、OTC 药品、酒类和鲜食。

              因此，合适的市场边界包括：承诺 30 分钟内履约日常必需品的即时配送平台（“q-commerce”或快速商务品类）、通过 app
              提供的便利店配送，以及城市和高密度郊区地理范围内日常商品的按需最后一公里履约。它不包括标准当日达食品杂货配送（45–90 分钟窗口）、预定 meal-kit
              订阅、批量仓储零售，也不包括服装或电子产品等一般电商品类。

              截至 2025 年，美国便利店行业规模为 $957B，但可被即时数字配送触达的部分要窄得多。美国约有 152,000 家实体便利店——Gopuff 所代表的数字等价物正从这个基数中争夺冲动型和紧急型支出。2025
              年美国 quick commerce 子市场估计为 $8.78B，仅反映通过提供两小时内履约的即时配送平台完成的购买。英国 quick commerce 市场再贡献 $2.83B，使 Gopuff 2025
              年合并地理可服务市场约为 $11.6B。

              决定市场边界上限的相邻替代品包括传统便利店到店购买、当日达食品杂货配送（Instacart、Ocado）、marketplace 聚合平台（DoorDash DashMart、Uber Eats）和 Amazon
              Fresh 快速配送。Gopuff 的差异化——自有库存、不依赖第三方零售商有货、在多数市场 24/7
              运营——定义的是一个耐久子市场，而不是小众市场；但其可变现覆盖仍受地理限制，只有微型履约密度足以支撑配送速度承诺的地区才跑得通。
