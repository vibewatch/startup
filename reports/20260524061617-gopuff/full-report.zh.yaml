        - 顺风
        - 中期（2-4 年）
        - 伦敦 9,648 人/km² 和美国都市区密度支撑在盈亏平衡点达到 8+ 单/骑手/小时；Gopuff 已拥有美国 / 英国最大的暗仓网络
        - 核验暗仓覆盖密度与竞争对手铺设节奏；确认 Mordor Intelligence 英国报告中的枢纽经济性
      - - 根深蒂固的速度预期（77% 期待 <2hr 配送）
