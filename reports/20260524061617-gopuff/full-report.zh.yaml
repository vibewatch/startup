      - number: '1.4'
        title: 运营规模、收购与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              在连续多轮风险资本推动下，Gopuff 从 2013 年单城学生配送服务，用十年时间扩张到美国数百个市场。2020 年 11 月，公司以约 $350M 收购
              BevMo!，扩大了西海岸实体零售足迹，也获得一个成熟酒类连锁，补强基于 MFC 的运营。2021 年 6 月收购 Liquor Barn 后，这一能力延伸到 Kentucky，加强了 Louisville 和
              Lexington 等波本带都会区的酒类配送覆盖。英国市场则通过 2021 年收购 Newcastle 即时配送初创公司 Fancy 进入，为 Gopuff 的国际运营打下基础。


              公司官方材料称 Gopuff 是“领先的 Instant Commerce 平台，最快 15 分钟把数千种日常商品送到用户手中”，并在“美国和英国运营数百个微型履约中心和全渠道零售门店”。其官网称，截至
              2025–2026 年，公司服务美国和英国 1,000 多个城市。第三方分析显示，2023 年 app 下载量为 3.8M，累计下载量超过 20M。2023 年月活用户约 1.8M，低于 2021 年约 2.6M
              的峰值。


              收入估计从 2021 年的 $1.88B 降至 2022 年约 $1.55B、2023 年 $1.2B，原因是公司收缩促销和市场。当前年化收入运行率估计区间为 $800M 至
              $1.2B，取决于来源和方法，既反映真实不确定性，也反映私营公司不披露的姿态。公司在 2025 年 11 月沟通中提到“创纪录的财务表现”，分析师解读为贡献利润里程碑，而不是相对 2021
              年收入峰值的营收纪录。Howard Schultz 于 2026 年 4 月加入董事会，以及 2026 年 4 月自有品牌 Crave Shoppe 烘焙产品上线，说明公司仍在投入产品和治理。
