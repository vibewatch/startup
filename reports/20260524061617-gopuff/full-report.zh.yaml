      - number: '5.2'
        title: MFC 运营平台与技术架构
        blocks:
          - type: paragraph
            body: >
              Gopuff 的运营技术围绕自有库存 MFC 模型专门打造。每个履约中心运行一套订单管理系统（OMS），通过幂等状态机跟踪订单从 Pending → Confirmed → Preparing → Packed
              → Dispatched → Delivered 或 Cancelled 的流转，并在每次状态转换设置前置条件保护（例如确认前完成支付验证；厨房准备前锁定库存）。第三方对 Gopuff
              架构的技术分析和可获得的工程文档显示，其事件驱动主干使用 Apache Kafka，在 OMS、库存预留服务和骑手调度服务之间做实时协调。据报道，每个 MFC 在系统层面独立运行，以局部化故障并防止级联失效。

              面向配送员的 Android 移动 app（Google Play 评分 4.1/5，下载量 500K+）把已确认订单推送给独立配送员；配送员到固定 MFC
              点位取货，从而消除市场平台模型的多站路线复杂度。面向消费者的前端技术栈使用 React 和 Redux；据第三方技术栈分析，iOS 和 Android app 分别用 Swift 和 Kotlin
              构建。后端服务运行 Python 和 Ruby on Rails，并用 Docker 容器化。需求预测被描述为一套自研 ML
              系统，负责超本地货盘优化和动态补货，但没有独立验证公开证明预测准确率或吞吐指标。University of Michigan Tauber Institute 曾与 Gopuff 合作推进 MFC
              入库流程标准化，并识别出空间利用和可扩展库存摆放的未解决挑战——这表明仓库运营工具在规模化下仍在完善。Gopuff 的 GitHub 组织（github.com/gopuff）主要包含内部工具（Azure
              app-insights logger、time-capsule 功能开关、CosmosDB CLI），没有面向客户的 SDK，确认其工程界面完全自研。
