      - CV046
      - CV047
      - CV013
      - CV012
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计 GAAP 财务
        - FY2023–FY2025 经审计收入、毛利率、贡献毛利率、EBITDA 和净利润
        - 任何 DCF 或收入倍数分析的核心输入；第三方估计跨度超过 $400M
        - 向公司索取（CFO/IR）；S-1 招股说明书中必须披露
      - - FCF 时间表
        - 按地域和渠道拆分的季度自由现金流桥，以及通往 FCF+ 的预测路径
        - 2023 年消耗 $400M 后，公司目标是在 2024 年底前达到 FCF+；公开信息尚未确认
        - 向公司索取；在 S-1 MD&A 中复核；用老股市场现金消耗披露交叉验证
      - - 广告 / 零售媒体收入
        - 广告收入占净收入比例；增速；贡献毛利率
        - 广告层是估值倍数上修的主要理由；声称改善约 150 bps，但未验证
        - 向公司索取；等待 S-1 收入分部拆分
      - - 优先股清算瀑布模型
        - 股权结构表，含各轮清算优先权、反稀释条款，以及 $6B / $8.5B / $12B 退出情景下的瀑布输出
        - $5.25B+ 优先股堆叠大幅压低 $12B 以下退出时的普通股回报
        - 向公司索取；在 S-1 资本结构表中做法律复核
      - - 按地域拆分的单位经济模型
        - 每个微型履约中心集群的贡献毛利率；FCF 为正与需补贴市场清单
        - 垂直模式需要订单密度；细颗粒地域数据能看清真正产现金的核心
        - 向公司索取；复核投资者董事会材料；用 409A 报告交叉验证
      - - 员工数与劳动力结构
        - 所有重组后截至 2026 年 Q1 的当前员工数；按职能拆分的单人成本
        - MFC 固定劳动力成本高；2022–2024 年裁员 2,900+ 人后，当前基线对经营杠杆模型至关重要
        - 向公司索取；通过 LinkedIn / 公开招聘信息交叉验证；等待 S-1 员工数披露
    notes: |
      尽调事项按估值重要性排序。第 1–3 项（财务、FCF、广告）应视为按当前估值进行任何私募投资前的阻断项。第 4–6 项对按股份类别和地域建模回报很重要。
    claimRefs:
      - CV048
      - CV010
      - CV041
      - CV013
