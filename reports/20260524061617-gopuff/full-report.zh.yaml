        - 开车去便利店或杂货店；或在平台型配送服务等待 1–2 小时并接受替换
        - 通过应用 / 网页下单；MFC 从自有库存拣货；配送员约 15–30 分钟送达
        - 99.5% 订单准确率（公司声称）；部分市场 15 分钟送达
        - 覆盖仅限 1,000+ 座城市；生鲜农产品选择因地点而异
      - - 管理可负担的定期杂货和必需品支出
        - 按次支付配送服务费；按单平台没有忠诚度优势
        - Fam 会员：免配送费、专享低价、每周优惠、Fam20 保证
        - 订阅免去单次配送费；300+ 种必需品享专享价
        - 需要承担订阅承诺（月费 / 年费）；权益范围限于美国 / 英国
      - - 用即时履约上线品牌 DTC 电商
        - 自建最后一公里物流，或使用 Amazon/Instacart；上线需数周到数月
        - Powered by Gopuff Storefronts：Shopify 应用通过 UPC 映射 SKU；IP 识别配送区域；MFC 履约
        - DTC 网站数天内上线；Tums/Jif 在 <60 分钟内售完分配库存（Big Game 活动）
        - 品牌必须已列入 Gopuff 目录；履约限于 Gopuff 配送区域
      - - 在购买点向高意向买家投放产品广告
        - 使用第三方广告网络，购买信号滞后，闭环测量有限
        - Gopuff Ads Platform：用 1,000+ 个实时变量做 AI 定向；Brand Shops；AdAdapted Add-It
        - Koddi 试点中 CTR 高 25%；转化高 24%；增量购买 40%+
        - 仅托管服务（计划自助）；托管活动需要 Gopuff 客户团队
