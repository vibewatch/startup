  - id: TE003
    title: Gopuff 技术与运营架构
    columns:
      - 层级 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - 消费者应用前端（React/Redux；iOS Swift；Android Kotlin）
        - 客户下单、浏览目录、实时追踪、Fam 会员管理
        - Apple App Store；Google Play Store；IP 地址区域识别服务
        - 应用商店政策变化可能限制酒类或 EBT 功能；面向集成方没有开源 SDK
      - - 订单管理系统（状态机、Kafka 事件总线）
        - 验证订单、确认库存预留、路由至 MFC 拣货队列、跟踪从下单到配送的生命周期
        - Apache Kafka（消息总线）；实时库存数据库（第三方分析称为 PostgreSQL/MongoDB）
        - 如果未完全复制，Kafka 单一消息总线可能成为 SPOF；容错能力未经外部审计
      - - MFC 运营软件（拣货 / 打包流程 + 配送员调度）
        - 协调仓库员工拣货、商品扫描、打包和配送员分配
        - 内部专有工具；基于 Android 的配送员应用（Gopuff Driver）
        - 完全封闭；架构和 SLA 违约数据未披露；依赖员工执行质量
      - - 需求预测与库存补货 ML
        - 预测每个 MFC 的单 SKU 需求；触发自动补货订单
        - 历史订单数据（10+ 年）；Databricks 或同等 ML 平台（据第三方来源）
        - 没有模型准确性的第三方审计；未公开披露预测误差率或 SKU 覆盖
      - - Gopuff Ads Platform（自建 AI/ML 广告投放）
        - 使用 1,000+ 个实时信号定向广告；<50ms 内投放；支持按目标购买
        - Koddi（增量测量）；The Trade Desk（程序化购买）；AdAdapted（Add-It）
        - 测量和程序化分发依赖 Koddi 与 Trade Desk；尚无自助 UI
      - - Powered by Gopuff API / Shopify 履约应用
        - 将合作伙伴 Shopify 网站的品牌 DTC 订单路由至最近的 Gopuff MFC，即时履约
        - Shopify 应用生态；通过 UPC 映射同步品牌 SKU 目录
        - 依赖 Shopify 生态；目录同步延迟可能向购物者显示错误库存
    notes: >
      技术栈细节（React/Redux、Python、Ruby on Rails、Docker、Kafka）来自第三方技术分析（educative.io、appscrip.com），Gopuff
      未在公开披露中正式确认。架构深度限于根据可用工程文档推断的设计；没有公开的 SOC 2 或内部审计报告。
