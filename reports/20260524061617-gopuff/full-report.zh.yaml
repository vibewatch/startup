        - TAM 上限背景（$957B）；数字配送今天只占其中小部分
      - - 品牌合作 / 广告收入
        - 品牌为 Gopuff 平台上的货架位置、试用、发布活动和应用广告付费
        - 第三方平台费用（DoorDash、Uber Eats）
        - CPG 品牌、饮料、娱乐和消费品公司
        - 新兴高毛利板块；Starbucks、Disney、Amazon、Tom Brady 旗下项目已确认合作
