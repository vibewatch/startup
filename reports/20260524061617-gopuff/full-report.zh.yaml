              Gopuff 当前 $8.5B 估值比 2021 年峰值低 43%，意味着多数参与 2021 年超级轮次的投资人已处于账面亏损。公司称已有实现自由现金流为正的路径，但尚未独立确认 2024 或 2025
              年达到该里程碑。2023 年现金消耗约 $400M。收入已从 2021 年估计 $1.88B 降至 2023 年约
              $1.2B。收入下滑、累计消耗资本高、盈利未经确认，这几项叠加，使任何流动性事件前的尽调风险都很实质。
