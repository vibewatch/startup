      - number: '7.3'
        title: 运营风险——MFC 单位经济性与配送可靠性
        blocks:
          - type: paragraph
            body: >-
              Gopuff 垂直整合的微型履约中心（MFC）模型是核心竞争资产，但它带来对订单密度敏感的高固定成本底座。每个 MFC
              都承担租赁义务、仓库人工和末端配送成本；订单量足够大之前，这些成本无法摊开，中心也难以接近贡献盈亏平衡。低密度市场或需求低谷期，固定成本躲不开，可变收入却消失。Gopuff 多轮关仓和裁员——2022 年 7
              月裁掉全球员工数 10%、关闭数十个仓库，2024 年 5 月又进一步裁撤 6%——反映了过度扩张到无法支撑 MFC 经济性的市场后的运营后果。AI 驱动的需求预测在试点中将易腐品损耗降低约
              20%，这是真实效率进步，但没有消除对密度的根本依赖。


              面向客户的配送质量仍是重大运营风险。Gopuff 的 Trustpilot 评分为 1.4/5，整体评级为“差”。PissedConsumer 上有 637+
              起投诉，涵盖错送、漏送、拒绝退款和账号被暂停且无申诉路径。服务质量差会直接加速客户流失；这一品类里，DoorDash、Instacart 和 Amazon same-day
              都在争夺同一类下单场景。高密度城市市场对暗店的分区法规抵制，也构成更长期的运营风险：多个城市已出台或考虑限制暗店，可能阻止新 MFC 开设或迫使搬迁，推高选址成本并拖慢覆盖扩张。
