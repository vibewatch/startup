        title: 消费者 App、购物体验与产品界面
        blocks:
          - type: paragraph
            body: >
              Gopuff 的主要消费者触点是 iOS 和 Android app，以及 2025 年 9 月上线的大幅改版网页体验。iOS app（GoBrands, Inc.）在 Apple App Store 上获得
              237,000 多个评分、4.8/5 分，提供食品杂货配送、酒类（在符合条件的市场）、家庭日用品和自有品牌产品，覆盖美国和英国 1,000+ 城市、500+ MFC 网点。关键 UX
              差异点是实时本地库存展示：用户登录前，app 或网站就通过 IP 地址检测查询最近的 MFC，只展示实物在库商品，消除市场平台型竞争对手常见的替代品和缺货意外。Gopuff 声称订单准确率为
              99.5%，并将其直接归因于自有库存，而非撮合式市场履约。

              2025 年 9 月网页改版加入了实时 MFC 视频流、按商品显示且带拣货员姓名的实时打包进度、由订单历史和位置驱动的 AI 个性化推荐，以及展示社区下单趋势的超本地热力图。联合 CEO Yakir Gola
              将这些功能描述为 Gopuff “instant in our DNA” 定位的核心。新版体验最初聚焦桌面和移动网页，app 端功能对齐计划在后续版本推出。Fam
              订阅会员提供免费配送、日用品专属低价（公司举例：$2 有机鸡蛋、牛奶、纸巾）、部分市场 “Fam20” 20 分钟送达保证、生日专属优惠和每周新品上架。支付选项覆盖信用卡 / 借记卡、Apple
              Pay、Venmo，以及符合条件食品杂货的 SNAP EBT。每个 MFC 的商品目录约有 4,000–5,000 个 SKU，包括全国性品牌和 Gopuff 自有品牌组合。
