      - number: '6.3'
        title: 品牌广告主与 B2B 客户：零售媒体网络和 Powered by Gopuff
        blocks:
          - type: paragraph
            body: >
              Gopuff 的第二大付费客户群，是购买广告或物流触达的品牌。广告侧，CPG 品牌购买赞助商品位、Brand Shops（Gopuff app 内沉浸式可购物体验），以及通过 The Trade
              Desk–Koddi 集成购买程序化库存。具名 CPG 品牌广告主包括 Chips Ahoy!、Hot Pockets 和 Gatorade；它们报告 Brand Shops 带来约 20%
              更高的平均订单价值。非本行业广告主（Apple TV+、Hulu、AdoreMe、Noom）通过 Rokt 结账后广告单元触达 Gopuff 以 Gen Z / 千禧一代为主的客群，首月实现 5%
              互动率。2024 年 7 月推出的自建 AI/ML 广告平台使用 1,000+ 实时变量，在 50 毫秒内投放个性化广告位；Gopuff 报告上线后 CTR 提高 25%、转化提高 24%。


              与 Koddi 合作的增量测量项目，已从试点成熟为常开服务：到 2026 年初，Gopuff 已超过 2025 全年测试量，显示品牌广告主对闭环归因的需求在增长。Gopuff 也担任 The Trade Desk
              程序化零售媒体库存集成的首发伙伴，把自己定位成更广泛 RMN 生态的基础设施枢纽。物流侧，“Powered by Gopuff”（2024 年 4 月推出）让 CPG 品牌可通过白标 Shopify
              Storefronts 提供 15 分钟 DTC 配送，履约由 Gopuff 的微型履约网络完成；Mondelēz、Nestlé、Ben & Jerry's 和 JM Smucker
              参与了首发队列。广告收入没有单独披露，这是关键尽调缺口。
