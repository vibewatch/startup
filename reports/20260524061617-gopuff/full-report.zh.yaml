      - number: '5.3'
        title: 自有品牌组合与货盘智能
        blocks:
          - type: paragraph
            body: >
              Gopuff 的自有品牌策略是其商业上最重要的技术差异点之一。因为 Gopuff 拥有库存，并在每笔订单捕获第一方行为数据，它能比传统 CPG 公司或不持有库存的市场平台更快闭合产品开发循环。旗舰品牌
              Basically 于 2022 年推出，并一直排在平台下单最多产品的前十。公司官方公告称，到 2024 年，自有品牌销售额同比增长 70%，约 20% 的 Gopuff 订单至少包含一件自有品牌产品。

              2024 年，Gopuff 扩大产品组合，推出 Basically Premium——一个品质更高的子品牌，提供配方更用心、人工添加剂更少的产品，包括无麸质牛肉棒、高端椰子水和铝瓶装泉水——并更新了整个
              Basically 系列的视觉识别。另一个方向是 Crave Shoppe，它响应已识别出的消费者对放纵型零食形态的需求：SKU 清单包括莳萝泡菜棉花糖、S'mores 棉花糖夹心甜甜圈、Ice Cream
              Bubbles，以及与代工方 Whoa Dough 开发的可食用曲奇面团。自有品牌职能由专门负责人和团队领导，团队用平台订单数据和客户反馈确定产品概念，从而快速迭代。供应商条款、生产采购和单 SKU
              利润率数据并未公开披露，使自有品牌贡献的真实单位经济性形成尽调缺口。垂直整合模型（自有库存 + 第一方数据）是支撑自有品牌速度的技术机制；Gopuff 可以测试新
              SKU、在数日内测量复购率并迭代，这是纯市场平台竞争对手在结构上无法复制的优势。
