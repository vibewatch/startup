      - number: '3.4'
        title: 护城河耐久性、差异化，以及 Gopuff 为什么活下来
        blocks:
          - type: paragraph
            body: >
              在 Getir、Gorillas、Buyk 和 Fridge No More 失败时，Gopuff 能活下来，归因于其商业模式的三个结构性差异。


              **第一，自有库存和垂直一体化提供了 marketplace 资助的暗店不具备的毛利耐久性。** Gopuff 自己采购库存，控制商品选择（每个 MFC 约 4,000 个
              SKU，针对高周转便利品优化），并自行定价——这让单均毛利不受第三方零售商或供应商协议挟制。欧洲暗店运营商大体复制了这个模式，但缺少 Gopuff 自 2013
              年创立以来积累十年的需求数据、供应商关系和地理密度学习。


              **第二，Gopuff 聚焦美国 / 英国，避开了致命的国际扩张陷阱。** Getir 和 Gorillas 同时进入 Germany、Netherlands、France、Italy、Spain
              和美国，以惊人速度烧钱，从未达到覆盖配送骑手和暗店成本所需的订单密度。Gopuff 在 2022 年后收缩——2022 年中关闭约 76 个美国仓库，并裁掉约 10%
              全球员工——过程痛苦，但它是理性的网络优化，而不是退出市场；公司称截至 2025 年末已处于历史最强财务位置。


              **第三，Gopuff 的零售媒体网络提供了纯物流运营商拿不到的差异化高毛利收入流。** Gopuff Ads（通过与 Rokt 合作提供结账后广告）让 Apple TV+、Hulu、Noom 等非 CPG
              品牌在“下单后炼狱”等待期触达客户——这个窗口无需额外配送基础设施。这类似 Instacart 的 Carrot Ads 成功路径（2024 年 $1.18B），只是规模更小。


              2025 年 7 月生效的 Amazon UK 全国合作，是对 Gopuff MFC 网络质量最强的外部验证：Amazon 明确选择 Gopuff 与 Morrisons、Co-op 和 Iceland
              并列作为其英国即时配送伙伴。这既带来增量收入和分销触达，也制造渠道依赖风险——如果 Amazon 选择自建竞争能力或更换配送伙伴，Gopuff 会受影响。


              主要竞争替代风险包括：DoorDash DashMart 快速扩张到 100 多个自有点位（用 DoorDash 大得多的客户基础和物流密度直接复制 Gopuff 模式）、Instacart
              的平台规模（Gopuff 若不大幅投入，无法匹敌其广度和技术优势），以及 7-Eleven 在高密城市市场的零资本开支优势。
