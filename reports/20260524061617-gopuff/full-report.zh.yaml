      - number: '7.4'
        title: 伙伴与依赖风险——Amazon、Starbucks、资本集中
        blocks:
          - type: paragraph
            body: >-
              Gopuff 的收入和增长建立在两个旗舰品牌合作——Amazon 与 Starbucks——以及一个锚定资本提供方 Eldridge Industries 之上。每段关系都具备战略价值，但也引入集中交易对手风险。


              Starbucks 合作于 2024 年宣布，并在 2025 年 5 月扩大到 Philadelphia 及其他市场的 24/7 特色咖啡配送，将接受 Starbucks 培训的咖啡师整合进 Gopuff
              MFC。通过 Gopuff 配送的 Starbucks 订单中，80% 还包含其他 Gopuff 食品杂货，使 Starbucks 同时成为获客驱动和客单价杠杆。若合作终止或重新谈判，将同时影响 Gopuff
              的下单频次、购物篮经济性和品牌联想。Starbucks 是更大、更强势的一方；合同条款、排他窗口和续约条件并未公开。


              Amazon 合作把 Gopuff 的食品杂货履约接入英国 Amazon 市场，Amazon 成为需求生成界面，由 Gopuff 供给履约。Amazon
              历来会借市场合作获取运营知识，然后自建竞争能力或强势重谈条款。技术集成深度——库存同步、路由 API、共享客户数据——让快速脱离合作在运营上代价高昂。Eldridge Industries 领投 2025 年
              11 月融资，形成资本提供方集中；如果 Eldridge 的投资策略或组合优先级变化，Gopuff 以可接受条款继续融资的能力可能受限。
