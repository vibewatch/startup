      - number: '5.4'
        title: 零售媒体平台与伙伴集成
        blocks:
          - type: paragraph
            body: >
              Gopuff 已搭建起垂直整合的零售媒体生态，用完全自建的技术层变现第一方购买数据和站内广告库存，取代过去使用的第三方广告平台。2024 年 7 月推出的 Gopuff Ads Platform 使用定制
              AI/ML 模型，处理 1,000 多个实时变量——包括单个购物者历史、时段、本地商品热度和购买倾向信号——并在 50 毫秒内投放广告位。平台围绕 Gopuff 积累 10+
              年的行为数据构建，相比更新的即时商业进入者具备历史训练优势。

              披露的 beta 测试结果包括相关性评分提高 50%、点击率提高 25%、转化提高 24%，平均每次点击成本较原第三方方案低 30%。2024 年 9 月，Gopuff 增加 Brand
              Shops（沉浸式品牌页面，据报道可使平均订单价值提高约 20%）和 AdAdapted Add-It 集成；后者让消费者在网页任意位置点击广告后，无需登录即可把商品加入 Gopuff 购物车，并在下一次打开
              app 时保留购物车。2025 年 4 月，Gopuff 与 Koddi 合作部署增量测量，试点显示每用户增量购买提升 40%+。2025 年 10 月，Gopuff 成为 The Trade Desk
              程序化站内零售媒体库存的首个零售伙伴——通过 Koddi 集成——品牌由此可通过 The Trade Desk 现有媒体采购界面，程序化购买 Gopuff 上的赞助商品位，并实现全漏斗活动统一。

              Powered by Gopuff 平台（2024 年 4 月推出）通过 Shopify app 把 Gopuff 的物流基础设施延伸至 CPG 品牌 DTC 网站：它按 UPC 把品牌 SKU 映射到
              Gopuff 目录，通过 IP 查询自动判断购物者是否在 Gopuff 配送区内，并把已确认订单路由到最近的 MFC，以 15 分钟履约。Ben &
              Jerry's、Nestlé、Unilever、Mondelēz、Haleon 等 20 多个品牌在上线时测试了 Storefronts。Tums 和 Jif 在 Big Game 活动期间使用该平台，不到 60
              分钟就卖完了分配库存。
