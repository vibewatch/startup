        - Gopuff 服务的 16+ 个英国城市中的城市成年人；Amazon 合作扩大触达
        - 第二个直接市场；2025 年 $2.83B；Gopuff 运营英国最大的即时履约网络
      - - 美国便利店（实体）
        - 约 152,000 家实体便利店内的冲动性和紧急购买
        - 只流向便利店运营商的实体客流收入
