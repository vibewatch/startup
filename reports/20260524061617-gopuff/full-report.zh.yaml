            body: >-
              出资前，投资者应拿到三项材料：（1）外部律师出具的多州员工 / 承包商错分风险地图，并附准备金估计；（2）经审计或审阅的财务报表，披露公司整体 EBITDA 以及按开设批次和市场密度拆分的 MFC
