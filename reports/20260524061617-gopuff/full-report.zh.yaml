      - number: '4.3'
        title: 资本充足性与融资历史
        blocks:
          - type: paragraph
            body: >
              自 2013 年成立以来，Gopuff 已在多轮股权融资中累计募资约 $5.5B；逐轮融资时间线见公司概况章节。2025 年 11 月，Gopuff 完成由 Eldridge Industries 和 Valor
              Equity Partners 领投的 $250M 融资，Baillie Gifford、Robinhood、Equalis Capital、George Ruan、Yakir Gabay
              以及联合创始人参投。该轮对应 $8.5B 的投后估值，显著低于 2021 年 $15B 的峰值，但在多年深度重组后仍得以维持。融资同时，Gopuff 任命 Matt McBrady 为首席财务官；McBrady
              曾任职于 BlackRock 的 Multi-Strategy Hedge Fund 项目、Bain Capital，并参与过两次 IPO 流程（Axon、aQuantive）。公司称资金将投向 AI
              投资、消费者体验改善和基础设施扩张。月度烧钱速度和融资后精确现金余额未公开披露。Gopuff 的英国子公司（GOBRANDS UK HOLDINGS LTD，Companies House 编号
              12793914）于 2025 年 12 月 24 日提交了截至 2024 年 12 月 31 日的完整年度账目，这是任何 Gopuff 实体唯一公开的财务文件；这些账目仅覆盖英国子公司。英国实体于 2026 年
              5 月 11 日登记了一项新的担保登记（MR01），显示英国市场存在活跃债务或融资义务。资本效率比率（估值 ÷ 累计融资）约为 1.55×，反映峰值后估值大幅回调。
