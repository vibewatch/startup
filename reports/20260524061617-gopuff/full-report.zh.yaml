  - id: FM004
    title: 采用漏斗 — 从即时需求到复购 FAM 会员
    type: flow
    layout: wide
    summary: Gopuff 的增长轨迹取决于能否把消费者从单次试用（急需触发首单）推向重复购买，再转化为付费 FAM 会员；同时，品牌合作和广告会加深用户基础变现。
    data:
      nodes:
        - id: n1
          label: 紧急需求触发
          detail: 消费者日用品用完、想吃深夜零食，或在非常规时段有即时家庭需求。
          tone: neutral
        - id: n2
          label: 下载 app 并完成首单
          detail: 消费者通过应用商店、推荐、社交媒体，或 Amazon/DoorDash/Uber Eats 集成发现 Gopuff。
          tone: positive
        - id: n3
          label: 15-30 分钟送达
          detail: 自有库存前置仓模式稳定履约；消费者感受到相对实体店的速度优势。
          tone: positive
        - id: n4
          label: 重复购买 — 便利形成习惯
          detail: 消费者为后续紧急需求再次下单；便利变成默认行为。
          tone: positive
        - id: n5
          label: 转化为 FAM 会员
          detail: 高频下单者选择订阅，以降低单次配送费；带动留存和下单频率。
          tone: positive
        - id: n6
          label: 品牌互动与推荐
          detail: 消费者接触品牌新品投放、Starbucks 商品或忠诚度权益；社交分享放大品牌触达。
          tone: positive
