      - number: '6.2'
        title: Gopuff Fam 订阅：忠诚锚点与留存杠杆
        blocks:
          - type: paragraph
            body: >
              Gopuff Fam 是主要忠诚机制，也是复购韧性最清晰的单一指标。Fam 会员贡献了接近 50% 的 Gopuff 订单，每月支付 $7.99（或按年约 $5.99/月），获得无限免费配送和 100+
              日常必需品长期 30% 降价；Gopuff 称会员平均每月节省 $20。该计划 2018 年推出时定价 $5.95/月；2022 年涨价至 $7.99
              后，订单份额指标没有明显被侵蚀，说明核心用户需求价格弹性较低。2023 年 9 月，Gopuff 推出 $3.99/月的 Student Fam，比标准 Fam 低 50%，面向其原始市场中的 1,000+
              美国大学校园。一项学生调查显示，59% 的受访者把激励、51% 把低价列为使用 Gopuff 的主要驱动。


              免费配送权益形成忠诚循环：按标准 $3.95 配送费计算，Fam 会员每月大约下两单即可覆盖 $7.99 月费，带来强烈的频次强化激励。每周优惠上新（每周一热门品牌 40%+ 折扣）推动习惯性再访问。英国 Fam
              订阅收入 2023 年从 £638K 增至 £1.8M，说明国际市场订阅采用仍早期但在加速。重要缺口仍在：Gopuff 不披露 Fam
              绝对订阅人数、单个队列留存曲线或流失率，耐久忠诚度分析必须依赖管理层数据请求。
