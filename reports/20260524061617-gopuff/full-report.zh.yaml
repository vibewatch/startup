      - number: '4.4'
        title: 盈利路径与利润率扩张
        blocks:
          - type: paragraph
            body: >
              Gopuff 披露的盈利路径靠四个相互依赖的杠杆支撑。第一，地理密度提升：公司退出低密度市场，转向单均贡献为正的高密度城市核心区（成熟站点单均 EBITDA 约 $3）。退出大多数欧洲市场、2022 年关闭 76
              个美国仓库，是这一转向的可见执行。第二，零售媒体扩张：面向 CPG 和非本行业品牌的广告业务，结构性利润率高于商品配送；eMarketer 预计美国更广义的零售媒体市场每年为
              $52B–$61B，提供结构性顺风。Gopuff 在 2023–2024
              年自建广告平台，以吃下更多广告利润栈，并降低对第三方广告技术的依赖。第三，品类组合优化：酒类、健康护理和自有品牌产品利润率高于平均水平；Gopuff 在产品和货盘扩张中强调这些品类。第四，AI
              驱动的运营杠杆：路线优化、个性化和履约中心吞吐量投资，目标是降低单次配送成本、提高下单频次。2025 年 11 月融资中的投资者表述称公司取得“盈利能力大幅提升”和“显著转型”。公司自身称 2025
              年实现“创纪录收入”和“贡献利润”。但缺少经审计财务报表，这些由公司声称的改善无法外部验证。第三方对 2025 年收入的估计为 $700M–$1B，与稳定化叙事相符，但较 2021
              年水平显著下降。没有任何独立来源确认公司整体 GAAP 盈利。
