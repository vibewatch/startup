          - type: callout
            title: 优先权悬压：$5.25B+ 排在普通股之前
            body: >
              累计披露融资总额超过 $5.25 billion，Gopuff 的清算优先权堆叠意味着普通股持有人（包括持有期权或 RSU 的员工）在退出估值低于约 $10–12 billion 时几乎拿不到有意义的回款。在当前
              $8.5 billion 标记下，2025 年 11 月轮的后期优先股勉强按面值收回，所有 2021 年轮次投资人都处于浮亏。二级市场股份相对其 Series-X 隐含水平约有 84%
              折价，正反映了这种结构性动态。
