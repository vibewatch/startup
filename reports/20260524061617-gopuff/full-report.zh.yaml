      - number: '7.2'
        title: 财务模型风险——烧钱、估值压缩与 IPO 不确定性
        blocks:
          - type: paragraph
            body: >-
              Gopuff 的财务画像带有三重叠加风险：持续现金消耗、估值大幅下修，以及尚未申报但越来越牵动管理层注意力的 IPO。据报道，2023 年收入约 $1.2B 时，现金消耗约
              $400M；这一数字在疫情后市场收缩后较上一年下降。Eldridge Industries 参与的 2025 年 11 月 $250M 融资按 $8.5B 估值宣布，确认 Gopuff
              在烧完早期储备后需要新资本。$8.5B 本身较 2021 年 $15B 峰值下调 43%；2026 年初的二级市场交易暗示估值低至 $6.26B，说明最新轮价格可能不是底部。


              Gopuff 自己在 2025 年 11 月新闻稿中提到“创纪录收入”、“正贡献利润”和“迄今最强财务状态”，但没有提供经审计财务报表或第三方验证。贡献利润与 EBITDA
              盈利的区别很重要：贡献利润不含公司总部开销、研发和中央成本，而 MFC
              模型固定成本很重。订单密度下降或人工成本上升（例如来自错误分类裁决），即使没有任何单一运营故障，也会压缩贡献利润率。多个独立来源都没有找到可信证据，证明 Gopuff 已在 2025 年或将在 2026
              年实现公司整体盈利。


              IPO 时间风险进一步加重财务图景。行业观察者估计 Gopuff 会在 2026 年尝试 IPO；Howard Schultz 于 2026 年 4 月加入董事会，Matt McBrady 从 BlackRock
              和 Bain Capital 加盟并在 2025 年 11 月出任 CFO，都是 IPO 准备信号。但公司尚未向 SEC 提交文件，市场波动事件或不利监管裁决都可能大幅推迟窗口，迫使公司再次私募融资或收缩运营。
