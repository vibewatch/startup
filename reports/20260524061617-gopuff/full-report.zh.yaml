      - number: '5.5'
        title: 信任、可靠性、合规与技术风险
        blocks:
          - type: paragraph
            body: >
              Gopuff 的信任和质量状态喜忧参半。积极的一面是，公司自有库存模型让 99.5% 订单准确率的说法具备可信度，因为 MFC 打包流程——客户可看到具名拣货员——建立了 gig
              经济市场平台模型缺乏的问责。消费者 iOS app 来自 237,000 多个评分的 4.8/5 分，也确认了用户情绪总体正面。但 2025–2026 年 Trustpilot
              评论呈现的故事没那么一致：反复出现的投诉包括漏送或错送、部分场景配送时间拉长到两小时，以及用户认为 AI 聊天机器人客服对解决订单问题无效。这个反向信号与 App Store
              评分存在张力，说明服务一致性可能存在分群差异。

              从合规角度看，Gopuff 有一套送酒流程，要求上门验龄，但监管合规细节（例如 TABC、ABC 许可证文件、各州配送法规）并未公开披露。Gopuff 没有公布 SOC 2 或 ISO 27001
              认证；任何企业或品牌伙伴做安全尽调时，这都是重要缺口。gopuff.com 上有隐私政策，但没有第三方审计报告可用，英国业务的 GDPR 范围也未公开记录。

              技术依赖风险包括：Powered by Gopuff 伙伴 Storefronts 依赖 Shopify app 生态；程序化零售媒体测量和分发依赖 Koddi 与 The Trade
              Desk；跨设施库存补货依赖第三方干线承运商。2022 年关闭 76 个 MFC 并裁员 1,500 人（员工数 10%），随后 2024 年又裁撤数百人，说明固定成本 MFC
              网络形成的运营杠杆是双刃剑：在高密度城市市场赚钱，在低密度地区则资本密集。GitHub 足迹（没有面向客户的
              SDK，主要是内部工具）显示，第三方开发者生态锁定并不是当前护城河，平台可迁移障碍更多来自运营切换成本，而非技术壁垒。
