      - number: '3.3'
        title: 欧洲和英国竞争对手画像与 Q-Commerce 崩塌
        blocks:
          - type: paragraph
            body: >
              2021–2024 年欧洲 q-commerce 初创潮，是 Gopuff 在全球最接近的结构性对照：自有库存暗店运营商，承诺 10–15 分钟配送。几乎全部失败。


              **Getir**（Turkey，2015 年创立）曾是欧洲最大的即时配送公司，2022 年 3 月由 Mubadala 领投 $768M Series E 后估值一度达到 $11.8B。峰值时，Getir 覆盖
              Turkey、英国、Germany、Netherlands、美国和多个欧盟市场，拥有 1,100 多个暗店、接近 40M app 下载量。2022 年 12 月，它以 $1.2B 收购
              Gorillas，试图整合市场。尽管累计融资超过 $2.3B，Getir 2023 日历年收入达到 $3.3B，却没有在任何地理市场实现 EBITDA 为正。2024 年 4 月，Getir
              宣布完全退出美国、英国和所有欧洲市场——裁员超过 6,000 人——并完全聚焦盈利的 Turkey 本土市场，在那里仍保持主导地位。


              **Gorillas**（Germany，2020 年 5 月创立）融资约 $1.4B，峰值估值达到 $3B，后于 2022 年底以 $1.2B 被 Getir 收购，估值缩水三分之二。Gorillas 曾在
              Germany、英国、Netherlands、France、Belgium、Italy、Spain 和美国运营暗店。Getir 2024 年 4 月决定退出国际市场后，Gorillas 于 2024 年 5
              月停止全部运营。其快速起落说明了一个模式：疫情期 VC 资金支撑暗店快速扩张，但疫情后购物行为正常化、配送骑手成本高、密度经济跑不出来，使少数高密城市核心区之外无法形成可持续单位经济。


              **Jiffy**（英国）曾在 London 运营快速食品杂货配送，后于 2022 年底至 2023 年初转向软件授权模式，退出直接配送业务。**Zapp**（英国）2022 年退出
              Netherlands，运营足迹显著收缩。**Buyk**（美国，New York）在 2022 年 3 月关闭，原因是俄罗斯投资人的资金通道被乌克兰相关制裁切断。**Fridge No
              More**（美国，New York）同样在 2022 年 3 月停止运营，未能获得新资本，也无法在融资环境收紧中维持单位经济。


              欧洲崩塌后，Gopuff 成为美国和英国唯一仍在运营自有库存即时配送网络的规模化幸存者。Getir 退出时，TechCrunch 的报道明确写道：“Today's news leaves easier
              waters for Gopuff in the U.S. and the U.K.” Gopuff 的生存因素——更早阶段的美国市场纪律、避免激进欧洲扩张，以及一个用十年搭建而非靠 VC
              冲刺堆出来的垂直一体化模式——让它的轨迹区别于失败的同类。
