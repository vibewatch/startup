      - number: '3.2'
        title: 美国直接竞争对手画像
        blocks:
          - type: paragraph
            body: >
              **Instacart（Maplebear Inc., NASDAQ: CART）** 是美国主导性的食品杂货配送 marketplace，覆盖北美 5,500 多个城市，截至 2025–2026
              年估计持有美国线上食品杂货市场 21.6% 份额。Instacart 的商业模式与 Gopuff 根本不同：它是轻资产 marketplace，把订单路由给 Kroger、Albertsons、Costco
              以及全国 1,500 多家合作零售商的店内代购员。2026 年 Q1，Instacart 的 Gross Transaction Value（GTV）首次超过 $10B，季度收入首次超过 $1B，同比增长
              14%。其广告平台 Carrot Ads 2024 年约产生 $1.18B 收入（被 7,500 多个品牌使用），预计 2025 年超过 $1.45B。相对 Gopuff，Instacart
              的战略优势是广度（17M+ SKU，而 Gopuff 每个 MFC 约 4,000 个）、零售商关系和技术规模；结构性弱点是配送更慢（30–90 分钟），且无法控制店内库存。


              **DoorDash（NYSE: DASH）** 持有美国食品配送 68% 市场份额，2024 年收入 $10.72B，体量远超 Gopuff 的 $1.2B。DoorDash 的 DashMart
              概念——2020 年推出的自有一方仓店，用于便利品——如今覆盖美国 100 多个点位，提供类似 Gopuff 的食品杂货、零食和家居必需品即时配送（15–60 分钟）。2025 年 9 月，DoorDash 推出
              DashMart Fulfillment Services，这是一套交钥匙零售物流项目，让 CVS、Party City 等全国品牌使用 DashMart 基础设施完成端到端即时配送，使 DashMart 成为
              Gopuff B2B 野心的平台型竞争者。DoorDash 的 8M 活跃 Dashers、46.3M 活跃用户和 DashPass 订阅（26M 订阅者）形成锁定效应和订单密度，Gopuff
              更小的网络无法在规模上匹敌。


              **Amazon（Fresh 和 Whole Foods）** 正把食品杂货战略从实体 Fresh 门店（2025 年关闭 14 家英国门店，并关闭美国 Go 门店）转向 marketplace
              食品杂货配送合作和 Whole Foods 扩张。2025 年 7 月，Amazon 与 Gopuff 在英国合作，进行全国性低于 60 分钟、最快 15 分钟配送——这段关系一方面验证 Gopuff 的 MFC
              网络强度，另一方面制造渠道依赖风险。Amazon 当日达生鲜配送能力 2026 年在美国扩张，会加大 Gopuff 在更高客单食品杂货订单上的便利性主张压力。


              **7-Eleven（7NOW）** 利用美国 7,500 多个门店点位做按需配送，目标到 2025 财年末北美 7NOW 销售额达到 $1B——较 FY2024 的 $725M 增长 38%。7NOW
              平均配送时间约 28 分钟，不依赖额外履约基础设施资本，并已在美国 40 多个主要城市提供 24/7 服务。其 7NOW Gold Pass 订阅（$5.95/月）直接与 Gopuff Fam
              会员竞争。7-Eleven 的结构性优势是零 MFC 资本成本；局限是依赖门店距离，且单点 SKU 广度更低。
