  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值历史、融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >
              Gopuff 的估值曲线把即时零售从狂热到修正的完整周期走了一遍。公司 2013 年创立，2016 年前一直靠自举资金运营；随后通过一轮轮风投注入扩张，并在 2019 年 8 月由 SoftBank Vision
              Fund 领投的 $750 million Series E 后跻身独角兽。疫情需求带来异常加速：2020 年 10 月 Series F 融资 $380 million（Accel、D1
              Capital）时，公司估值为 $3.9 billion；五个月后，2021 年 3 月 SoftBank 领投的 Series G（$1.15 billion）把估值推高三倍至 $8.9
              billion。2021 年 7 月 Series H 融资 $1 billion，由 Blackstone、SoftBank、Fidelity、Baillie Gifford
              等组成的财团领投，确立了此后的高点：$15 billion。

              疫情后需求常态化暴露了即时零售品类普遍存在的单位经济脆弱性，估值下调周期随之开始。Gopuff 进行了三轮裁员：2022 年 7 月裁掉约 1,500 名员工（全球员工数 10%）并关闭 76
              座美国仓库；2023 年 3 月的小规模裁员约 100 人；2024 年 5 月又裁掉约 600 人（剩余员工 6%），同时公司公开提出 2024 年底前实现自由现金流转正。2022–2024
              年披露的裁员总数超过 2,900 人。2023 年现金烧掉约 $400 million；到 2025 年底，公司称录得「公司史上最强财务表现」。

              2025 年 11 月 13 日，公司宣布以 $8.5 billion 投后估值融资 $250 million，由 Eldridge Industries 和 Valor Equity Partners
              领投，Baillie Gifford、Equalis Capital、Robinhood、Honey 联合创始人 George Ruan、Yakir Gabay 以及 Gopuff 联合创始人 Yakir
              Gola 和 Rafael Ilishayev 参投——这确认了相对 $15 billion 峰值约 43% 的估值下调。Bloomberg
              的报道引用了一名知情人士，公司也通过新闻稿和官方新闻室确认了该轮。联合创始人参投说明创始人仍有信心。与此同时，Matt McBrady 被任命为 CFO；McBrady 此前担任 BlackRock
              Multi-Strategy Hedge Fund 项目 CIO，并曾帮助 Axon 和 aQuantive 成功 IPO，因此这项任命是可信的 IPO 准备信号。

              入场纪律必须先看资本结构。各轮披露融资总额超过 $5.25 billion，意味着累计清算优先权堆叠大致同等规模。在 $8.5 billion
              估值下，早期高价轮优先股投资人对普通股有优先索取权；普通股持有人要获得回报，退出估值必须显著高于优先权池。二级市场数据显示，Gopuff 股份相对 Series-X（2021/2022）隐含估值约有 84%
              折价，显示市场对近期流动性和退出价值普遍怀疑。Prime Unicorn Index 在 2022–2023 年已大幅下调 Gopuff，早于正式融资轮重定价。
