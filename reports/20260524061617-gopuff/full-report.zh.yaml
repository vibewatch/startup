      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 美国 + 英国 SAM 2025 年约 $11.6B，而非全球 $73B 头条数字
            body: >-
              全球 q-commerce TAM $73.93B 由亚太主导。Gopuff 在退出国际市场后的地理足迹只剩美国和英国，对应 2025 年合并窄口径 SAM 约 $11.6B。估值测算应锚定这个数字及其每年
              7–9% 的增长，而不是反映印度和中国市场增长、Gopuff 并不参与的 34% 全球 CAGR。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: callout
            title: 劳动者错误分类诉讼可能重置单位经济
            body: >-
              DC AG 2025 年 3 月诉讼以及此前 Massachusetts AG 罚单构成实质法律风险。若 Gopuff 配送员从独立承包商重新分类为员工，配送劳动成本可能上升 15–30%，公司必须显著提高
              AOV 或配送费，才能维持贡献利润。公司回应称将“vigorously defend”承包商模式，说明短期内不会解决。
            calloutType: risk
            claimRefs:
              - CM037
              - CM038
          - type: callout
            title: 自有库存模式是在整合市场中的耐久差异化
            body: >-
              美国和英国每一家主要纯 q-commerce 竞争对手都已经关闭、被收购或大幅撤退（Gorillas、Getir、Jokr、Fridge No More、Buyk、Weezy）。Gopuff
              凭借垂直一体化模式活过了所有对手，这套模式控制库存可得性、定价毛利和配送 SLA，是 marketplace 聚合平台做不到的。市场整合意味着，Gopuff 今天 $2.5B GMV 的位置比 2021
              年更可防守。
            calloutType: strength
