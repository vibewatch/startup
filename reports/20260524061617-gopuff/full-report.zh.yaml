        - 资本充足的竞争者（Amazon 暗店、Walmart GoLocal）进入，并以相近密度复制垂直模式
      - - 单位经济模型改善：单均贡献利润 >$4；广告带来约 150 bps 利润率提升
        - 投资逻辑
        - 贡献利润回落到每单 $2 以下，或广告收入未能达到净收入 15%
      - - Matt McBrady 出任 CFO（曾参与 Axon、aQuantive IPO）；$250M 融资释放 IPO 准备信号
        - 投资逻辑
        - McBrady 在 12 个月内离职，或 IPO 推迟到 2027 年 Q4 之后
      - - 高频品牌合作（Starbucks、Amazon、Disney）；SNAP EBT 覆盖全美
        - 投资逻辑
        - 合作收入分成下滑；SNAP 交易量相对可触达低收入 TAM 不及预期
      - - 隐含 9–11x EV/收入倍数，相比 2–5x 交易的盈利上市可比公司缺乏支撑
        - 反向逻辑
        - S-1 披露 EBITDA 转正季度且收入超过 $1.2B，足以支撑部分重估
      - - $5.25B+ 优先股堆叠压在普通股之上；普通股要获得有意义回报，退出估值需高于 $12B
        - 反向逻辑
        - IPO 时优先股堆叠重组 / 转换，或公司以远高于 $12B 的估值退出
      - - 垂直整合的固定成本高于市场平台模式；利润率受密度约束
        - 反向逻辑
        - 公司在多数运营地区证明 EBITDA 利润率为正
      - - 欧洲即时零售失败样本（约 $5.5B 减值）警示品类单位经济模型
        - 反向逻辑
        - Gopuff 披露相较失败欧洲同行有结构性差异的单位经济模型
    notes: |
      投资逻辑和反向逻辑各行均为基于公开来源的证据化评估，时间截至 2026 年 5 月。缺少经审计财务，会同时抬高正反两面的不确定性。
