      - number: '2.2'
        title: 市场规模口径与 TAM-SAM 估计
        blocks:
          - type: paragraph
            body: >-
              多个规模口径对应机会的不同层级。最宽口径——全球 quick commerce 市场——据 Coherent Market Insights 估计，2025 年为 $73.93B，并预计到 2032 年达到
              $582.59B，CAGR 为 34.3%；但这个数字由亚太主导（仅印度就以 17% 的年增长率领先），不能代表 Gopuff 所在的美国 / 英国地理市场。

              美国是 Gopuff 的主要地理市场。Coherent Market Insights 估计，美国 quick commerce 2025 年规模为 $8.78B，到 2032 年以 8.2% CAGR 增至
              $15.24B。MetricsCart 也引用美国 quick commerce 市场 2023 年为 $7.5B，并预计 2030 年达到 $12.7B，CAGR 为 8%。这些估计共同指向：2026 年美国
              quick commerce SAM 约为 $9–10B。PlottData 估计 Gopuff 年 GMV 为 $2.5B，意味着其在美国纯即时配送细分市场份额约为 25–30%。

              英国市场由 Mordor Intelligence 估计 2025 年规模为 $2.83B，并以 6.99% CAGR 到 2030 年增至 $3.97B。英国收入关键集中在 London，Scotland
              被识别为增长最快地区。Gopuff 在英国 16 个以上城市运营，包括 London、Birmingham、Manchester、Bristol 和 Cardiff。

              MarkWide Research 从更宽的即时配送口径看，认为 2026 年美国即时配送市场规模为 $38.7B，并到 2035 年 CAGR 为
              16.4%；但该口径包括所有两小时内配送品类，也包括食品配送平台，不能与 Gopuff 自有库存模式直接比较。PlottData 显示，2025 年北美所有平台 quick commerce GMV 达
              $22B（全球 $52B 的 42%），可作为上限口径。

              在产品层面，Gopuff 的 SOM 更受约束：公司 2023 年 $1.2B 收入大致对应其估计 GMV 区间的 13–16% 毛收入捕获率。按 2023 年 1.8M 活跃用户计算，Business of
              Apps 数据和公司自身 KPI 隐含年用户收入约为 $667/年。DemandSage 数据指出，quick commerce 行业平均年 ARPU 为每用户 $288.79，这凸显 Gopuff 高于平均的
              ARPU 来自自有库存模式捕获零售毛利的能力，而不仅是配送费。
