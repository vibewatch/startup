  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Gopuff 的竞争横跨四类：运营自有履约基础设施的直接即时配送同行；聚合第三方零售商库存的 marketplace
              平台竞争者；在既有门店网络上增加配送能力的传统便利零售商；以及消费者亲自去便利店或选择次日食品杂货配送这一现状替代方案。


              **直接自有基础设施同行** 是最接近 Gopuff 的竞争者——这些公司运营自己的暗店或微型履约中心（MFC），执行 30 分钟内配送。在美国和英国，随着 2022–2024 年欧洲暗店运营商
              Getir、Gorillas、Buyk、Fridge No More、Jiffy 和 Zapp 崩塌，这一类如今主要由 Gopuff 自身占据。DoorDash DashMart 截至 2025 年拥有 100
              多个自有点位，是美国该类别中最可信的剩余直接竞争者。


              **Marketplace 平台竞争者** 包括 Instacart（食品杂货聚合平台，2026 年 Q1 拥有美国线上食品杂货 21.6% 份额和 $10B+ 季度 GTV）以及 Amazon
              Fresh。这些平台靠零售商合作扩张，而不是自有库存，因此资本效率更高、覆盖更广，但配送速度通常限制在 30–90 分钟，除非 Gopuff 本身是履约伙伴（如 2025 年 7 月生效的 Amazon UK
              安排）。


              **传统便利竞争者** 以 7-Eleven 的 7NOW 配送服务为首。7NOW 覆盖美国 7,500 多家门店，目标到 2025 财年末北美年销售额达到 $1B，平均配送时间 28 分钟。不同于纯配送
              app，7NOW 借助 7-Eleven 实体门店足迹，不需要单独投入履约基础设施资本开支。


              **现状替代方案** 在实践中仍是最大的竞争选项：美国多数便利品和食品杂货购买仍通过到店或预约食品杂货配送完成。Gopuff
              必须持续证明“即时性”的溢价值得用户支付，而不是让用户选择步行去附近门店这种低摩擦方式。
