  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险是 Gopuff 最高严重度的风险栈
        blocks:
          - type: paragraph
            body: >-
              Gopuff 经营三个受监管产品垂直——酒类、大麻和尼古丁——每一类都需要独立的州级许可。Massachusetts Alcoholic Beverages Control Commission（ABCC）在
              2023 年 5 月撤销了 Gopuff 的零售和运输酒类许可证，原因是有记录的 19 起违规：公司向未成年的 Boston College 学生销售并配送酒类。ABCC 调查人员在每次事件发生时都向
              Gopuff 管理层报告；违规之间没有记录显示公司采取了足够纠正行动。法院随后暂停了撤照，但这次执法事件确认，一个州监管机构几乎不需预警，就能让 Gopuff
              在整个市场暂停其最高利润率品类。多州酒类合规负担在结构上很高：Gopuff 必须在每个服务司法辖区维持许可证、培训司机验龄，并通过定期合规审计。若在主要市场再次违规，将是重大收入事件，而不只是声誉事件。


              劳动错误分类风险同样活跃。2025 年 3 月，Washington D.C. 总检察长起诉 GoBrands, Inc. 和 GB Logistics, LLC（Gopuff
              的运营实体），指控其把配送工人非法归类为独立承包人而非雇员。诉状称，Gopuff 拒绝向数百名 DC 工人支付最低工资、加班费、带薪病假和失业保险缴款。Massachusetts 已经采取行动：州总检察长在
              2023 年因错误分类约 1,000 名司机开出 $6.2M 罚单，Gopuff 正在上诉。Bloomberg Law 确认 DC 案件在 2025
              年仍活跃。不到两年内，两个州总检察长分别执法，这一模式说明多州级联风险真实存在。如果法院或监管方强制改为雇员分类，Gopuff 的单次配送人工成本结构会实质性改变，若不进一步提价或缩减覆盖范围，影响将难以吸收。
