      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 垂直一体化构成耐久护城河
            body: >-
              Gopuff 的自有库存 MFC 模式在结构上不同于 marketplace 平台：它拿到的是品类商品毛利，而不是中介费，因此在竞争对手烧尽资金时仍能做到单均贡献利润超过 $4。该模式还让 Gopuff
              实时控制库存，在下单环节消除大多数缺货失败，这是推动复购的关键。主要 q-commerce 对手已完全退出美国市场后，这套架构不再容易在全国规模上复制。
            calloutType: strength
            claimRefs:
