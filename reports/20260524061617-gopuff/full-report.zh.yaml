      - number: '6.5'
        title: 客户摩擦、反向证据与集中风险
        blocks:
          - type: paragraph
            body: >
              面向消费者的服务质量是有记录的摩擦点。2025 年和 2026 年初的 Trustpilot 评论反复出现几个主题：漏送或错送、配送时间超过两小时（相对于 15–30 分钟承诺）、只靠 AI
              聊天支持且无法解决退款争议，以及账号被暂停后缺少清晰申诉路径。应用商店评分仍高（4.6–4.8/5），但关于订单准确性和客服的详细负面评论数量，说明运营一致性存在问题，并会在公司核心城市足迹之外的低密度市场被放大。这些摩擦模式与
              2022–2024 年整体收缩一致：当订单密度不足以支撑暗店模型时，配送质量下降，客户流失加快。


              集中风险方面：Gopuff 的 B2C 用户数较 2021 年峰值到 2023 年下降 31%，还看不到明确底部；没有公开流失或队列数据，无法量化下行风险。英国市场累计亏损超过
              £187M，且没有确认的盈利路径。品牌广告主集中度未知——如果广告收入大部分由少数大型 CPG 品牌驱动，品牌营销下行周期中，Gopuff 会面对明显预算敏感性。大型品牌的零售媒体预算承压：2025 年
              Q1，27% 的营销人员把 RMN 列为首要渠道，较 2024 年低 4 个百分点。模型本身也天然集中在美国高密度城市都会区；任何进一步退出市场都会直接缩小可触达消费者基数。
