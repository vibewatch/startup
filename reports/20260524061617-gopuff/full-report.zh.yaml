    type: matrix
    layout: wide
    summary: 劳工错误分类执法和酒类牌照合规集中在高可能性、高严重性区域；MFC 单位经济模型失效和合作伙伴终止风险处在高严重性、中高可能性区域；IPO 时点和暗店分区风险也偏高，但属于次要风险。
