      - number: '4.2'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >
              Gopuff 的成本结构主要被自有并运营的微型履约中心（MFC）网络的固定成本撑大。每个 MFC 启动成本约
              $250,000，只有订单密度足够高——以每个司机小时订单数、每个仓库日订单数衡量——固定开销才摊得回来。截至 2026 年，Gopuff 在美国和英国运营 200 多个 MFC，已明显低于 2021 年约
              600 个的峰值。全网单均 EBITDA 在分摊固定开销前约为 $0.88，而成熟、高密度仓点单均 EBITDA 约为 $3.00，3.4×
              的差距凸显密度的关键作用。末端配送由独立承包人而非雇员完成，降低了可变人工成本，但持续带来用工分类法律风险；DC 总检察长在 2025 年起诉 Gopuff，指控其错误分类工人，Massachusetts
              监管方也挑战了其酒类合规做法。因此，成本结构对订单量高度敏感：MFC
              固定成本不会随需求收缩，低密度或新开市场一旦利用率不足，对利润率的破坏会被放大。零售媒体收入毛利率显著高于商品配送，是关键的边际收入杠杆。当前精确的单均经济性、COGS 和贡献利润率拆分并未公开披露。
