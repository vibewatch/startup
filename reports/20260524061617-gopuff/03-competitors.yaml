- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat Claim
  - Competitive Threat
  - Severity
  - Mitigation / Diligence Ask
  rows:
  - - Largest owned-MFC instant-delivery network in US/UK
    - DoorDash DashMart at 100+ locations scaling further; has DoorDash's $10.72B revenue base to fund expansion
    - High
    - Track DashMart location count growth quarterly; assess overlap with Gopuff metro footprint
  - - Amazon UK national delivery partnership validates MFC quality
    - Amazon could build own UK fulfillment or switch to rival; contract exclusivity unknown
    - Medium
    - Confirm partnership exclusivity terms, revenue sharing, and contract duration; assess Amazon's own UK fulfillment buildout
      timeline
  - - Owned inventory margins superior to marketplace competitors
    - Instacart/Amazon can scale nationally without capex; Gopuff carries inventory risk and capex burden competitors avoid
    - High
    - Disclose MFC-level COGS, gross margin per order; compare to Instacart reported contribution margin (~$0.35/order net)
  - - 7-Eleven's physical stores provide comparable speed at near-zero marginal cost
    - 7NOW achieves 28-min delivery with zero MFC build cost; Gold Pass directly competes with Fam membership
    - Medium
    - Assess Gopuff's 15-min speed advantage retention in overlapping markets; survey customer switch rate
  - - Retail media network (Gopuff Ads) as high-margin recurring revenue
    - Instacart Carrot Ads at $1.18B/yr 2024 (10x+ Gopuff scale) makes Gopuff a weak substitute for CPG advertisers; Instacart
      has broader audience
    - Medium
    - Disclose Gopuff Ads revenue, advertiser count, ROAS benchmarks vs. Instacart Carrot Ads
  - - Gopuff survived q-commerce collapse; remaining network is battle-tested
    - Gopuff valuation has fallen from $15B peak to $5.45B (May 2024 secondary); revenue declined from 2021 highs; company
      has not reached disclosed profitability
    - High
    - Disclose current EBITDA or adjusted EBITDA; confirm claims of 'strongest financial position' in company history with
      audited or reviewed financials
