- id: SP-eu-uk-comps
  title: European and UK Competitor Profiles and the Q-Commerce Collapse
  body: 'The 2021–2024 wave of European q-commerce startups represented Gopuff''s closest

    structural analogs globally: owned-inventory dark-store operators promising 10–15 minute

    delivery. Nearly all of them failed.


    **Getir** (Turkey, founded 2015) was the largest European instant-delivery company, once

    valued at $11.8 billion following a $768 million Series E in March 2022 led by Mubadala.

    At peak, Getir operated across Turkey, the UK, Germany, Netherlands, US, and multiple EU

    markets, with 1,100+ dark stores and close to 40 million app downloads. It acquired

    Gorillas in December 2022 for $1.2 billion as a consolidation play. Despite raising more

    than $2.3 billion in total, Getir generated $3.3 billion in calendar 2023 revenue but was

    not EBITDA-positive in any geography. In April 2024, Getir announced its complete exit

    from the US, UK, and all European markets—cutting more than 6,000 jobs—and refocused

    entirely on its profitable Turkish home market where it retains a dominant position.


    **Gorillas** (Germany, founded May 2020) raised approximately $1.4 billion and reached a

    $3 billion valuation at peak before being acquired by Getir at the end of 2022 for $1.2

    billion—a two-thirds write-down. Gorillas operated dark stores across Germany, the UK,

    Netherlands, France, Belgium, Italy, Spain, and the US. Following Getir''s April 2024

    international exit decision, Gorillas ceased all operations in May 2024. Its rapid rise

    and fall illustrated the pattern: pandemic-era VC funding enabled rapid dark-store

    expansion, but post-pandemic normalisation of shopping behaviour, high delivery rider

    costs, and inability to achieve density economics made sustainable unit economics

    impossible outside a handful of dense urban cores.


    **Jiffy** (UK) operated rapid grocery delivery in London before pivoting to a software

    licensing model in late 2022 and early 2023, exiting the direct delivery business.

    **Zapp** (UK) withdrew from the Netherlands in 2022 and its operational footprint

    shrank significantly. **Buyk** (US, New York) shut down in March 2022 after Russian

    investors'' funding access was cut off by Ukraine-related sanctions. **Fridge No More**

    (US, New York) also ceased operations in March 2022 after failing to secure new capital,

    unable to sustain unit economics in a tightening funding environment.


    The European collapse left Gopuff as the sole scaled survivor operating an owned-inventory

    instant-delivery network in the US and UK. The TechCrunch note from the time of Getir''s

    exit explicitly stated: "Today''s news leaves easier waters for Gopuff in the U.S. and

    the U.K." Gopuff''s survival factors—earlier-stage US market discipline, avoidance of

    aggressive European expansion, and a vertically integrated model built over a decade

    rather than funded in a VC sprint—differentiated its trajectory from the failed cohort.

    '
