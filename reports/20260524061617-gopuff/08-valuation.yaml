  evidenceGaps:
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "revenue"
      missingEvidence: >
        Audited GAAP revenue, gross margin, contribution margin, and net income for Gopuff
        for FY2023, FY2024, and FY2025.
      whyItMatters: >
        Third-party revenue estimates range from $700M to $1.2B—a $400M+ uncertainty band that
        drives a 4–6x swing in implied EV/Revenue multiple. All scenario valuations rest on this
        unverified input. The revenue figure is the single most important unknown in the analysis.
      diligencePath: >
        Request audited financial statements from company via CFO/IR; review mandatory disclosure
        in any eventual S-1 registration statement.
      relatedQuestionRefs: ["QV002"]

    - type: "private-evidence-only"
      severity: "minor"
      topic: "customer-retention"
      missingEvidence: >
        Quantitative customer retention rates, order frequency metrics, and Gopuff FAM
        membership subscriber count and growth rate as of 2025.
      whyItMatters: >
        FAM membership growth is cited as a key indicator of product-market fit improvement,
        but no quantitative metric has been publicly disclosed; absence limits verification
        of the subscription-revenue layer's contribution to blended multiple justification.
      diligencePath: >
        Request from company; triangulate via app download and review-volume data; await
        S-1 customer metrics disclosure.
      relatedQuestionRefs: ["QV029"]

    - type: "private-evidence-only"
      severity: "material"
      topic: "burn"
      missingEvidence: >
        Gopuff's quarterly free cash flow trajectory from Q1 2024 through Q1 2026 and a
        credible forward model for FCF+ timing.
      whyItMatters: >
        Company targeted FCF+ by end-2024 following $400M 2023 burn; confirmation or
        refutation is critical to bear-case probability assessment and the IPO timeline.
      diligencePath: >
        Request from company; review CFO investor communications; await S-1 cash flow statement.
      relatedQuestionRefs: ["QV030"]

    - type: "enumeration-incomplete"
