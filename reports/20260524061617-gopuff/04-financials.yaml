  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >
        Audited or management-reviewed income statement for FY2024 and FY2025 showing net revenue,
        gross profit, and operating loss/income by segment.
      whyItMatters: >
        Cannot underwrite valuation, revenue quality, or margin profile without confirmed revenue
        figures; third-party estimates vary by more than 40% across sources.
      diligencePath: >
        Request audited FY2024 financials and FY2025 management accounts from Gopuff's data room;
        reference UK subsidiary accounts at Companies House (FY2024 filed) for partial confirmation.
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: blocking
      topic: burn
      missingEvidence: >
        Monthly cash burn rate and current cash-on-hand position post-November 2025 funding round.
      whyItMatters: >
        Cannot calculate runway or assess whether the $250M raise is sufficient for the stated
        investment roadmap (AI, infrastructure, consumer experience) without cash flow data.
      diligencePath: >
        Request trailing 6-month monthly P&L and cash flow statements; request use-of-proceeds
        schedule for the $250M raise.
      relatedQuestionRefs:
        - QI024
      relatedTableRefs:
        - TI004
        - TI005

    - type: private-evidence-only
      severity: material
      topic: subscription
      missingEvidence: >
        Gopuff Fam total subscriber count, monthly churn rate, and subscription revenue line item.
      whyItMatters: >
        Subscription revenue represents a high-quality, recurring revenue stream; without the
        subscriber count, its scale and contribution to the profitability path cannot be assessed.
      diligencePath: >
        Request subscriber metrics from data room; triangulate against order-volume data and
        stated "nearly half of orders from Fam subscribers" to estimate subscriber base.
      relatedQuestionRefs:
        - QI025
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: material
      topic: margin
      missingEvidence: >
