  - id: cost-structure-unit-economics
    title: Cost Structure and Unit Economics
    body: >
      Gopuff's cost structure is dominated by the fixed cost of owning and operating a network of
      micro-fulfillment centers (MFCs). Each MFC costs approximately $250,000 to launch and requires
      meaningful order density—measured in orders per driver-hour and orders per warehouse per day—before
      fixed overhead is recovered. Gopuff operates more than 200 MFCs in the US and UK as of 2026, down
      significantly from a peak of roughly 600 in 2021. Network-wide per-order EBITDA averaged approximately
      $0.88 before fixed overhead allocation, compared to approximately $3.00 EBITDA per order at mature,
      high-density warehouse locations—a 3.4× variance illustrating the critical role of density. Last-mile
      delivery is performed by independent contractors rather than employees, reducing variable labor costs
      but creating ongoing legal classification exposure; the DC Attorney General filed suit against Gopuff
      in 2025 for worker misclassification, and Massachusetts regulators have challenged its alcohol
      compliance practices. The cost structure is therefore highly sensitive to order volume: fixed MFC
      costs do not flex with demand, making under-utilization in lower-density or newly launched markets
      disproportionately destructive to margins. Retail media revenue carries substantially higher gross
      margins than product delivery, making it a critical marginal-dollar lever. Exact current per-order
      economics, COGS, and contribution margin breakdowns are not publicly reported.
    claimRefs:
      - CI023
      - CI024
      - CI025
      - CI026
      - CI028
      - CI045
    tableRefs:
      - TI003
    figureRefs:
      - FI002

  - id: capital-adequacy
    title: Capital Adequacy and Financing History
    body: >
      Gopuff has raised approximately $5.5 billion in total capital since its 2013 founding across
      multiple equity rounds; the detailed round-by-round chronology is covered in the Company Overview
      chapter. In November 2025, Gopuff closed a $250 million funding round led by Eldridge Industries
      and Valor Equity Partners, with participation from Baillie Gifford, Robinhood, Equalis Capital,
      George Ruan, Yakir Gabay, and the co-founders. The round implies an $8.5 billion post-money
      valuation—significantly below the 2021 peak of $15 billion but sustained after years of deep
      restructuring. Simultaneous with the raise, Gopuff appointed Matt McBrady as Chief Financial Officer;
      McBrady brings experience from BlackRock's Multi-Strategy Hedge Fund program, Bain Capital, and two
      prior IPO processes (Axon, aQuantive). The company stated the capital will be directed toward AI
      investment, consumer-experience improvements, and infrastructure expansion. Monthly cash burn and
      exact cash on hand post-raise are not publicly disclosed. Gopuff's UK subsidiary (GOBRANDS UK
      HOLDINGS LTD, Companies House number 12793914) filed full annual accounts to December 31, 2024 on
      December 24, 2025, representing the only public financial filing for any Gopuff entity; these
      accounts cover the UK subsidiary only. A new charge (MR01) was registered against the UK entity on
      May 11, 2026, indicating active debt or financing obligations in the UK market. The capital
      efficiency ratio (valuation ÷ total raised) stands at approximately 1.55×, reflecting the steep
      valuation correction from peak.
    claimRefs:
