callouts:
  - calloutType: strength
    title: Retail Media Is a Structural High-Margin Lever
    body: >
      Gopuff's in-house advertising platform, built out in 2023–2024, allows the company to monetize
      order frequency and post-checkout attention without incremental delivery cost. CPG ad spending
      on retail media networks is projected at $52–$61 billion in the US annually; Gopuff's targeted,
      high-intent audience is differentiated from Amazon or Instacart by purchase recency and speed.
      If retail media scales to even 5–10% of revenue, the margin profile improves meaningfully.
    claimRefs:
      - CI017
      - CI018
      - CI019

  - calloutType: risk
    title: Unit Economics Viable Only in Dense Urban Cores
    body: >
      Network-wide per-order EBITDA of approximately $0.88 (before fixed overhead) versus ~$3.00 at
      mature high-density sites illustrates the fundamental density dependency. Third-party failure
      analyses confirm that delivering sub-$15 orders profitably requires density thresholds achievable
      only in the densest urban neighborhoods. Gopuff burned through an estimated $400–$600 million in
      2021 alone despite reaching ~$1.88 billion in revenue; the model proved unprofitable at national
      scale. Retrenchment to core markets reduces the TAM the business can address.
    claimRefs:
      - CI025
      - CI026
      - CI034
      - CI036

  - calloutType: recommendation
    title: Data Room Required Before Financial Underwriting
    body: >
      All key financial metrics—net revenue, gross margin by stream, monthly burn, cash on hand,
      subscriber count, and EBITDA—are undisclosed for this private company. The company's claim of
      "record revenue and contribution profit" in 2025 is unaudited. Before committing, obtain:
      (1) audited FY2024 financials; (2) management accounts for H1 2025; (3) post-raise cash
      balance and burn forecast; (4) segment-level P&L. The UK subsidiary annual accounts at Companies
      House cover only a portion of the business and should be read alongside a full consolidated package.
    claimRefs:
      - CI043
      - CI044

