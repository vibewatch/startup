  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Gopuff has not published audited financial statements. Revenue, GMV, and profitability figures are estimates
      from investigative journalism (The Hustle, The Information) and secondary analytics (Business of Apps, PlottData). Actual
      2024 and 2025 revenue, operating loss, and contribution profit are not publicly confirmed.
    whyItMatters: The gap between "record revenue and contribution profit" (company claim) and "$400M loss in 2023" (analyst
      estimate) is material for underwriting. Without audited financials, the profitability trajectory cannot be independently
      verified.
    diligencePath: Request audited or management-accounts financials for FY2023, FY2024, and YTD 2025 in pre-investment due
      diligence. Ask specifically for contribution margin per order, dark store-level P&L, and FAM subscriber economics.
    relatedQuestionRefs:
    - QM008
    - QM025
  - type: private-evidence-only
    severity: material
    topic: user-segments
    missingEvidence: Gopuff's active user count of 1.8 million and 20 million cumulative downloads are last confirmed for
      2023. FAM subscriber count, monthly order frequency by cohort, and churn rate are not publicly disclosed.
    whyItMatters: FAM membership growth is cited as a key driver of improved unit economics. Without subscriber count data,
      the sustainability of contribution profit improvement cannot be assessed.
    diligencePath: Request FAM subscriber count by quarter, average order frequency for members vs. non-members, and 12-month
      retention cohort data.
    relatedQuestionRefs:
    - QM013
    - QM026
    - QM027
    - QM028
    - QM029
    - QM030
  - type: conflicting-data
    severity: material
    topic: company-performance
    missingEvidence: Gopuff claims "record revenue" in November 2025 but the most recent public revenue estimate is $1.2B
      for 2023 (down 20% from 2022). It is unclear whether "record revenue" means exceeding the $1.88B 2021 peak or simply
      year-over-year improvement from a post-rationalization trough.
    whyItMatters: The interpretation of "record revenue" substantially affects addressable market positioning and valuation.
      A company at $1.5B annual run-rate has very different market implications than one that has recovered to or exceeded
      $2B+.
    diligencePath: Clarify "record revenue" claim — confirm against 2021 peak and request specific figure for most recent
      fiscal year.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: minor
    topic: legal-regulatory
    missingEvidence: The DC AG lawsuit against Gopuff was filed in March 2025 but the primary court filing and AG press release
      could not be retrieved directly (dcnewsnow.com returned 403). Only secondary reporting was confirmed.
    whyItMatters: Full case details — relief sought, scope of potential reclassification, timeline — would provide better
      inputs for modeling the labor cost headwind scenario.
    diligencePath: Review DC Superior Court docket for DC v. Gopuff. Request Gopuff's legal team status update on active employment
      litigation in diligence.
    relatedQuestionRefs:
    - QM022
