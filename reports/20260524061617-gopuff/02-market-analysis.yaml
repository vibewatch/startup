    - Urban/suburban adults 18-44 ordering via mobile app; personal discretionary spend
    - Core direct market; $8.78B US in 2025; Gopuff is the largest US owned-inventory operator
  - - UK quick commerce (instant delivery <30 min)
    - Same-day sub-30-minute essentials delivery via micro-fulfillment centers in UK cities
