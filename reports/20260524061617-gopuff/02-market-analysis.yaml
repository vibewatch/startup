- id: section-buyers
  title: Buyer and user segmentation
  body: 'The core Gopuff user is an urban or suburban adult aged 18-34. Business of Apps confirms that the largest age demographic
    using Gopuff is 24-34 year olds. DemandSage data shows that online meal delivery — a direct behavioral predictor for quick
    commerce adoption — peaks at 44.5% among female users aged 25-34 and 42.3% among male users in the same cohort, with sharp
    usage drop-off after age 55. This positions Gopuff''s primary user base as Millennials and Gen Z, two generations that
    represent 32% of US consumer spending as of 2025 (up 8 points from 2020 per Numerator).

    The behavioral profile reinforces this demographic focus. Gen Z''s food delivery app usage rate is 63% per Deliverect,
    compared to 51% for Millennials. GoDaddy''s 2025 Consumer Pulse survey found 54% of Gen Z and 50% of Millennials prefer
    purchasing methods that avoid human interaction — exactly the frictionless app-to-door model Gopuff offers. The same survey
    found 86% of Gen Z and 76% of Millennials purchase items online for curbside or in-store pickup at least once per month,
    and 23-27% do so weekly — reflecting a habituated convenience expectation rather than occasional use.

    Budget ownership is primarily personal discretionary spend. Unlike enterprise software or healthcare purchases, Gopuff''s
    payer is the end consumer, usually purchasing with a debit/credit card or digital wallet. Gopuff''s expansion to SNAP
    EBT acceptance nationwide (announced in the 2025 funding round) opens a new lower-income segment that has historically
    been underserved by premium convenience delivery options.

    Secondary user segments include college students (Gopuff''s original beachhead market at Drexel University), working parents
    seeking on-demand household essentials, and late-night / early-morning consumers who cannot access physical stores. Brand
    advertisers represent a distinct payer segment — brands pay Gopuff for product placement, sampling campaigns, and "drop"
    marketing events reaching its concentrated user base.

    In the UK, consumer willingness to pay premium delivery fees is corroborated by Mordor Intelligence''s finding that convenience-led
    behavior shift contributes 1.5% to UK market CAGR over the short term, and that 55.55% of the UK market in 2024 was from
    sub-10-minute order delivery — indicating strong demand for the fastest tier of service.'
