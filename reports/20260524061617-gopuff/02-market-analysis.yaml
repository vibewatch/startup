    - Physical foot traffic revenue flowing to c-store operators only
    - All ages; primary substitute when instant delivery unavailable or too slow
    - Upper-bound TAM context ($957B); digital delivery only a small share of this today
  - - Brand partnership / advertising revenue
    - Brands paying for product placement, sampling, launch campaigns, and app advertising on Gopuff platform
    - Third-party marketplace fees (DoorDash, Uber Eats)
    - CPG brands, beverages, entertainment, and consumer goods companies
    - Emerging high-margin segment; Starbucks, Disney, Amazon, Tom Brady ventures confirmed partners
  - - Membership (FAM subscriptions)
    - Recurring monthly/annual subscriber fees from FAM program members
    - One-time delivery fees from non-members
    - Loyal repeat customers; drives order frequency and retention
    - High-value segment; membership growth cited as key driver of record contribution profit
