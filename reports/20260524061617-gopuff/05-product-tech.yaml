    - type: private-evidence-only
      severity: material
      topic: MFC-operations
      missingEvidence: "Demand forecasting model accuracy (e.g., MAPE or fill-rate by SKU category), MFC throughput (orders per hour per facility), and operational SLA-breach rates."
