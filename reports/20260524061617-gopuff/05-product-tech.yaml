  - id: mfc-operations-and-technical-architecture
    title: MFC Operations Platform and Technical Architecture
    body: >
      Gopuff's operational technology is purpose-built around its owned-inventory MFC model.
      Each fulfillment center runs an order management system (OMS) that executes an idempotent
      state machine tracking orders through Pending → Confirmed → Preparing → Packed → Dispatched →
      Delivered or Cancelled states, with precondition guards at each transition (e.g., payment
      verified before confirmation; stock reserved before kitchen preparation begins). Third-party
      technical analysis of Gopuff's architecture and available engineering documentation describe
      an event-driven backbone using Apache Kafka for real-time coordination across the OMS,
      inventory reservation service, and courier dispatch service. Each MFC is reported to operate
      independently at the systems level to localize outages and prevent cascade failures.

      The courier dispatch mobile app for Android (4.1/5 rating, 500K+ downloads on Google Play)
      surfaces confirmed orders to independent couriers who pick up at a fixed MFC location,
      eliminating the multi-stop routing complexity of marketplace models. The consumer-facing
      frontend stack uses React and Redux; iOS and Android apps are built in Swift and Kotlin,
      respectively, per third-party tech-stack analysis. Backend services run Python and Ruby on
      Rails with Docker containerization. Demand forecasting is described as a proprietary ML
      system performing hyperlocal assortment optimization and dynamic replenishment, though no
      independent validation of forecast accuracy or throughput metrics has been published.
      The University of Michigan Tauber Institute engaged with Gopuff on MFC inbound-process
      standardization, identifying unresolved challenges in space utilization and scalable
      inventory placement — an indicator that warehouse operations tooling remains a work-in-progress
      at scale. Gopuff's GitHub organization (github.com/gopuff) contains primarily internal
      tooling (Azure app-insights logger, time-capsule feature flagging, CosmosDB CLI) with no
      customer-facing SDKs, confirming that the engineering surface is entirely proprietary.
