  - id: retail-media-and-partner-integrations
    title: Retail Media Platform and Partner Integrations
    body: >
      Gopuff has assembled a vertically integrated retail media ecosystem that monetizes its
      first-party purchase data and onsite ad inventory through an entirely in-house technology
      layer, replacing the third-party ad platforms it previously used. The Gopuff Ads Platform,
      launched in July 2024, uses custom AI/ML models that process more than 1,000 real-time
      variables — including individual shopper history, time of day, localized product popularity,
      and purchase propensity signals — to serve ad placements in under 50 milliseconds. The platform
      was built around Gopuff's 10+ years of accumulated behavioral data, giving it a historical
      training advantage over newer instant-commerce entrants.

      Reported beta-test outcomes include a 50% higher relevance score, 25% increase in click-through
      rates, 24% increase in conversions, and 30% lower average cost-per-click versus the prior
      third-party setup. In September 2024, Gopuff added Brand Shops (immersive brand pages that
      reportedly increase average order value by ~20%) and the AdAdapted Add-It integration, which
      allows consumers anywhere on the web to click an ad and add items to their Gopuff cart without
      logging in, with the cart persisting when they next open the app. In April 2025, Gopuff partnered
      with Koddi to deploy incrementality measurement, with a pilot showing 40%+ lift in incremental
      purchases per user. In October 2025, Gopuff became the first retail partner for The Trade Desk's
      programmatic onsite retail media inventory — integrated via Koddi — enabling brands to buy
      sponsored-product placements on Gopuff programmatically through The Trade Desk's existing
      media-buying interface and enabling full-funnel campaign unification.

      The Powered by Gopuff platform (launched April 2024) extends Gopuff's logistics infrastructure
      to CPG brand DTC websites via a Shopify app that maps brand SKUs to Gopuff's catalog by UPC,
      automatically detects whether a shopper is within a Gopuff delivery zone via IP lookup, and
      routes confirmed orders to the nearest MFC for 15-minute fulfillment. More than 20 brands
      including Ben & Jerry's, Nestlé, Unilever, Mondelēz, and Haleon tested Storefronts at launch.
      Tums and Jif used the platform during Big Game campaigns, selling through allocated inventory
      in under 60 minutes.
