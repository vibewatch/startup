  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: system-architecture
      missingEvidence: "Official Gopuff technical architecture documentation, engineering blog posts, or infrastructure case studies confirming the Kafka-based event-driven stack and OMS state-machine design."
      whyItMatters: "All current architecture evidence is third-party inferred; without confirmation the architecture diligence is incomplete and investor technical underwriting cannot rely on this."
      diligencePath: "Request engineering documentation in data room; review official Gopuff tech blog (if any) or LinkedIn engineering posts from Gopuff engineers; conduct technical interview with VP Engineering."
      relatedQuestionRefs: [QE012, QE017]

    - type: missing-source
      severity: material
      topic: compliance
      missingEvidence: "SOC 2 Type II or ISO 27001 certification reports, or any third-party security audit covering Gopuff's data handling, consumer PII, and payment security practices."
      whyItMatters: "Material gap for enterprise brand partners (Powered by Gopuff) and investor security due diligence; absence of public certifications creates unknown security posture risk."
      diligencePath: "Request certifications directly from Gopuff; check AWS/Google Cloud marketplace partner listings for any published compliance attestations."
      relatedQuestionRefs: [QE014]

    - type: private-evidence-only
      severity: material
      topic: Powered-by-Gopuff
      missingEvidence: "Updated active-brand count and GMV or revenue contribution for Powered by Gopuff Storefronts as of 2025–2026, beyond the 20+ brands disclosed at launch in April 2024."
      whyItMatters: "Without current traction data, the B2B platform revenue diversification thesis cannot be validated; the platform may have stalled or grown substantially since launch."
      diligencePath: "Request partner-count and revenue metrics from Gopuff in data room; search for press releases or CPG brand testimonials citing active Storefronts use in 2025–2026."
      relatedQuestionRefs: [QE021]

    - type: missing-source
      severity: minor
      topic: Fam-membership
      missingEvidence: "Updated Fam membership subscriber count, pricing structure, and any changes to the 'Fam20' guarantee or benefit tiers in 2025–2026."
      whyItMatters: "Fam drives subscriber economics and LTV; without updated penetration and pricing data the loyalty moat cannot be quantified."
      diligencePath: "Search for Gopuff press releases or investor-facing content on Fam subscriber counts in 2025 or 2026; check App Store 'What's New' notes for membership feature updates."
