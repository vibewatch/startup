  - id: trust-reliability-risks
    title: Trust, Reliability, Compliance, and Technical Risks
    body: >
      Gopuff's trust and quality posture is mixed. On the positive side, the company's owned-inventory
      model allows it to publish a 99.5% order accuracy claim, which is plausible given that the MFC
      packing workflow — with named pickers visible to customers — creates accountability that gig-
      economy marketplace models lack. The consumer iOS app's 4.8/5 rating from over 237,000 ratings
      confirms broadly positive user sentiment. However, Trustpilot reviews from 2025–2026 tell a
      less uniform story: recurring complaints include missing or incorrect items, delivery times
      that stretched to two hours in some instances, and frustration with AI-chatbot customer support
      that reviewers found unhelpful for resolving order issues. This adverse signal sits in tension
      with the App Store rating, suggesting segment-level variation in service consistency.

      From a compliance standpoint, Gopuff has an alcohol delivery workflow with age-verification
      at the doorstep, but regulatory compliance details (e.g., TABC, ABC permit documentation,
      state-specific delivery laws) are not publicly disclosed. Gopuff has not published SOC 2 or
      ISO 27001 certifications, which is a material gap for any enterprise or brand partner conducting
      security due diligence. A privacy policy exists on gopuff.com but no third-party audit report
      is available, and GDPR scope for UK operations is not publicly documented.

      Technical dependency risks include: reliance on the Shopify app ecosystem for Powered by Gopuff
      partner storefronts; dependence on Koddi and The Trade Desk for programmatic retail media
      measurement and distribution; and dependence on third-party linehaul carriers for inter-facility
      inventory replenishment. The 2022 decision to close 76 MFCs and cut 1,500 employees (10% of
      headcount), followed by a 2024 round of hundreds more layoffs, demonstrates that the fixed-cost
      MFC network creates operational leverage that cuts both ways: profitable in dense urban markets
      but capital-intensive in lower-density geographies. The GitHub footprint (no customer-facing
      SDKs, primarily internal tooling) indicates that third-party developer ecosystem lock-in is not
      a current moat, and that platform portability barriers depend on operational switching costs
      rather than technical ones.
    claimRefs:
      - CE004
      - CE024
      - CE025
      - CE026
      - CE037
