company:
  name: Gopuff
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Gopuff (GoBrands, Inc.) is the leading U.S.-UK instant-commerce company, founded in 2013 by Drexel University
    students Rafael Ilishayev and Yakir Gola, and built around an owned-inventory, micro-fulfillment-center model
    that promises delivery in as fast as 15–30 minutes. The company has raised over $5.25 billion in total funding,
    reached a $15 billion peak valuation in 2021, and reset to $8.5 billion after a $250 million November 2025 round
    led by Eldridge Industries and Valor Equity Partners. Multiple restructuring cycles — five rounds of layoffs since
    2022 and a full exit from continental Europe — reflect a hard pivot from hypergrowth to profitability, but Gopuff
    remains the last vertically integrated instant-delivery platform operating at national scale in the US and UK.

sections:
  - id: identity-and-model
    title: Identity, Product, and Business Model
    body: >-
      GoBrands, Inc., trading as Gopuff, is a Philadelphia-headquartered instant-commerce company that sells
      convenience and grocery products — snacks, beverages, household essentials, over-the-counter medications,
      and alcohol — from a proprietary network of micro-fulfillment centers (MFCs). Gopuff's core differentiator
      is its owned-inventory model: unlike marketplace platforms that broker orders from third-party retailers,
      Gopuff purchases inventory wholesale, stocks it in purpose-built dark stores, and deploys trained employees
      to pick and pack orders in under 90 seconds before handing them to independent delivery couriers. This
      vertical integration collapses the supply chain to a single operator, enabling the company's 15–30-minute
      delivery promise without relying on partner store availability or picker substitutions.


      Each MFC typically carries roughly 3,000 SKUs, sized and located within one to two miles of the customers it
      serves. Real-time inventory visibility eliminates most out-of-stock failures at order time. Revenue comes from
      product-category markups over wholesale prices, flat delivery fees, subscriptions through the Gopuff Fam
      membership (offering free or discounted delivery), private-label products under the Basically and Crave Shoppe
      brands, and an expanding retail-media advertising channel for CPG partners. The company reports contribution
      margins above $4 per order as of its November 2025 funding communications. As of 2026, Gopuff operates in
      over 500 US cities and towns plus the United Kingdom, making it the largest national instant-fulfillment
      network in both markets.


      The product originated as a hookah-and-essentials delivery service targeting Drexel University students in 2013.
      The founders quickly recognized that owned inventory and hyper-local fulfillment — not asset-light brokering —
      were the architecture that could make instant delivery economically viable at scale. That thesis has held
      through $5.25 billion in capital raised, a global expansion, a contraction back to the US and UK, and five
      rounds of workforce reductions, all without the company pivoting away from MFC-based vertical integration.
