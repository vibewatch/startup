  - id: scale-and-milestones
    title: Operating Scale, Acquisitions, and Milestone Timeline
    body: >-
      Gopuff scaled from a single-city student delivery service in 2013 to operations in hundreds of US markets
      within a decade, driven by successive rounds of venture capital. The BevMo! acquisition in November 2020 for
      approximately $350 million expanded the company's physical retail footprint on the West Coast and added an
      established alcohol chain that complemented MFC-based operations. The Liquor Barn acquisition in June 2021
      extended that capability into Kentucky, strengthening alcohol delivery coverage in bourbon-belt metros including
      Louisville and Lexington. The UK entry came through the acquisition of Newcastle-based instant-delivery startup
      Fancy in 2021, establishing the foundation for Gopuff's international operations.


      The company's own official materials describe Gopuff as the "leading Instant Commerce platform, bringing
      thousands of everyday products to customers in as fast as 15 minutes" and operating "hundreds of
      micro-fulfillment centers and omnichannel retail stores across the U.S. and U.K." Its homepage states
      delivery to over 1,000 US and UK cities as of 2025–2026. Third-party analytics put 2023 app downloads at
      3.8 million in the year and cumulative downloads above 20 million. Active monthly users in 2023 were
      approximately 1.8 million, down from a 2021 peak of roughly 2.6 million.


      Revenue estimated at $1.88 billion in 2021 declined to approximately $1.55 billion in 2022 and $1.2 billion
      in 2023 as the company pulled back from promotions and markets. Current annualized run-rate estimates range
      from $800 million to $1.2 billion depending on the source and methodology, reflecting both genuine uncertainty
      and the private company's non-disclosure posture. The company's own November 2025 communications referenced
      "record financial performance," which analysts interpreted as contribution-margin milestones rather than
      top-line records against the 2021 peak. Howard Schultz's April 2026 board appointment and the private-label
      Crave Shoppe baked-goods launch in April 2026 signal continued product and governance investment.
