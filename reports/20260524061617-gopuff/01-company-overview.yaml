  - id: founders-leadership-governance
    title: Founders, Leadership, and Governance
    body: >-
      Gopuff operates under a co-CEO structure with both co-founders, Yakir Gola and Rafael Ilishayev, retaining
      day-to-day executive authority. The two met as undergraduates at Drexel University in Philadelphia, where they
      borrowed a van and started making late-night convenience deliveries from their apartment in 2013. Their shared
      background — both are Israeli-American with entrepreneurial instincts rooted in student life — shaped
      a company culture that prizes speed, operational intensity, and founder-led decision-making.


      Howard Schultz, founder of Starbucks and one of the most recognized brand-builders in US retail, joined
      Gopuff's board of directors in April 2026. Schultz's appointment was framed by Gopuff as signaling conviction
      in its vision to transform the future of shopping. The hire adds board-level expertise in scaling consumer
      brands globally and managing the tension between physical operations and customer experience — areas directly
      relevant to Gopuff's next phase. Matt McBrady, formerly of BlackRock, joined as Chief Financial Officer
      around the November 2025 round, adding institutional-finance discipline to the leadership team.


      The co-CEO governance model concentrates decision-making in the founders, which creates key-person risk but
      also preserves operational agility. Gopuff has not disclosed full board composition or independent director
      names beyond Schultz. The company is private, operates as GoBrands, Inc., and has not filed public financials,
      so governance and capital-structure details require direct diligence access. Founder ownership stakes after
      $5.25 billion in dilutive rounds are undisclosed.
    claimRefs:
