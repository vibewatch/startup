companyProfile:
  summary: >-
    Gopuff was founded in 2013 by Drexel University students Yakir Gola and Rafael Ilishayev in Philadelphia
    as a late-night hookah-and-essentials delivery service. It evolved into a vertically integrated instant-
    commerce platform that buys inventory wholesale, stocks it in proprietary micro-fulfillment centers, and
    delivers convenience, grocery, alcohol, and household products in 15–30 minutes across the US and UK.
    Unlike marketplace peers, Gopuff owns the inventory and fulfillment layer, monetizing through product
    margins, delivery fees, Gopuff Fam subscriptions, private-label goods, and retail-media advertising.
    The company has raised more than $5.25B and reset its valuation from a $15B 2021 peak to $8.5B in the
    November 2025 round while pivoting from hypergrowth to profitability discipline.
  foundedDate: '2013-01-01'
  founders:
    - name: Yakir Gola
      role: Co-founder and Co-CEO
      background: Drexel University student entrepreneur who co-built Gopuff from a Philadelphia campus delivery service into a national instant-commerce operator.
      claimRefs: [CO001, CO010, CO011]
    - name: Rafael Ilishayev
      role: Co-founder and Co-CEO
      background: Drexel University student entrepreneur who co-founded Gopuff in Philadelphia and remains in day-to-day operating leadership.
      claimRefs: [CO001, CO010, CO012]
  foundingLocation: Philadelphia, Pennsylvania, US
  headquarters: Philadelphia, Pennsylvania, US
  productSummary: >-
    Instant delivery of convenience, grocery, alcohol, healthcare, and household products from Gopuff-owned
    micro-fulfillment centers carrying roughly 3,000–4,000 SKUs, with picking/packing done in-house and
    delivery promised in roughly 15–30 minutes.
  customerFocus: >-
    Primarily B2C urban and suburban convenience shoppers using Gopuff for late-night, top-up, and impulse
    purchases; secondarily CPG and non-endemic advertisers buying retail-media access to Gopuff's audience.
  businessModel: >-
    Vertically integrated owned-inventory model monetized through merchandise margin, delivery fees, Gopuff
    Fam subscriptions, private-label goods, alcohol/regulated-category economics, and a growing advertising
    and partner platform.
  stage: Private, late-stage
  fundingStatus: >-
    Latest primary financing was a $250M round announced in November 2025 at an $8.5B valuation, led by
    Eldridge Industries and Valor Equity Partners. Disclosed lifetime funding exceeds $5.25B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO007, CO017, CO020, CO045, CI002, CI007, CI011]

summary:
  headline: >-
    Track: Gopuff has genuine category leadership as the last scaled vertically integrated quick-commerce
    platform in the US and UK, but today's $8.5B private mark already prices in much of the operational
    recovery while audited financials, free-cash-flow timing, and capital-structure overhang remain opaque.
  overallScore: 5.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 8500
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 5250
    customerCount: null
    headcount: 5000
  topStrengths:
    - >-
      Only remaining vertically integrated instant-commerce network at meaningful scale in the US and UK,
      after most dedicated q-commerce rivals exited or failed.
    - >-
      Owned-inventory micro-fulfillment model offers tighter control over assortment, speed, and inventory
      availability than marketplace-only peers.
    - >-
      Evidence of real operating improvement: contribution profit above $4 per order, retail-media expansion,
      and a new CFO with prior IPO experience.
    - >-
      Diverse monetization stack spanning merchandise margin, delivery fees, subscription, private label,
      and advertising rather than one take-rate stream.
  topRisks:
    - >-
      Current $8.5B valuation implies a premium multiple versus DoorDash and Instacart despite materially less
      financial disclosure and a less proven profit profile.
    - >-
      Capital intensity remains high because Gopuff owns inventory and operates a large MFC network whose fixed
      costs are difficult to absorb outside dense markets.
    - >-
      Preference-stack overhang from more than $5.25B of lifetime funding could materially compress common-equity
      outcomes unless exit value clears the current mark by a wide margin.
    - >-
      Regulatory and legal exposure spans worker classification, alcohol compliance, SNAP/EBT execution, and other
      city- or state-level operational rules.
    - >-
      Competition from better-capitalized marketplace incumbents such as DoorDash and Instacart can pressure
      customer economics without requiring them to own the same fixed infrastructure.
  unresolvedGaps:
    - Audited consolidated financials, especially net revenue, EBITDA, free cash flow, and cash runway
    - Full preference waterfall and investor rights by round, including any 2021 peak-round protections
    - Current Gopuff Fam subscriber count, churn, and revenue contribution
    - Current active-customer count and order-frequency/cohort-retention data
    - Geography-level unit economics and current headcount/labor-cost baseline after 2022–2024 restructurings

