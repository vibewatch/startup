summary:
  headline: 观察：Gopuff 是美国和英国最后一个具备规模的垂直整合即时零售平台，品类领导地位真实；但当前 $8.5B 私募估值已经计入大部分经营修复，审计财务、自由现金流转正时间和资本结构包袱仍不透明。
