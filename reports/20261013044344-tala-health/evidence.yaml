evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-contracts-and-identities
    missingEvidence: >-
      Public disclosure of the identities, covered lives, and contract structures of the three major U.S. insurers
      reported as contracted partners.
    whyItMatters: >-
      Validating whether insurer agreements are pilot programs, enterprise master service agreements, or risk-bearing
      value-based arrangements directly impacts revenue quality and contract durability.
    diligencePath: >-
      Request customer references, anonymized payer contract exhibits, and member eligibility verification files under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: financial-run-rate-and-burn
    missingEvidence: Audited financial statements detailing ARR, net revenue, clinician gross margins, and monthly cash burn rate.
    whyItMatters: >-
      Without baseline GAAP financials or operating metrics, assessing whether a $100M capitalization provides adequate
      runway at a $1.2B valuation remains speculative.
    diligencePath: >-
      Obtain management financial model, historical monthly income statements, and bank balance verifications during
      confirmatory diligence.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: executive-leadership-roster
    missingEvidence: >-
      Complete executive leadership team roster beyond founder Ritankar Das, including Chief Medical Officer, Head of
      Compliance, and Chief Technology Officer.
    whyItMatters: >-
      Healthcare delivery platforms require seasoned clinical leadership and regulatory officers to navigate state
      corporate practice of medicine rules.
    diligencePath: >-
      Request executive organizational chart and bios for functional heads across clinical operations and legal
      compliance.
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: seed-valuation-mechanics
    missingEvidence: >-
      Detailed capitalization table reflecting post-money ownership percentages, liquidation preferences, and secondary
      transaction share.
    whyItMatters: >-
      A $100M seed round at a $1.2B valuation represents an unconventional structure where investor governance rights
      and anti-dilution terms materially alter common shareholder risk.
    diligencePath: >-
      Review certificate of incorporation, series seed preferred stock purchase agreement, and investor rights
      agreements.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-payer-contracts
    missingEvidence: >-
      Audited public disclosure of Tala Health's named health plan partners, active covered lives, and contractual
      reimbursement structures (PMPM vs performance withholds).
    whyItMatters: >-
      Tala's $1.2 billion seed valuation relies on claimed partnerships with major US payers, but absence of verifiable
      customer identities, contract values, or clinical ROI prevents independent commercial validation.
    diligencePath: >-
      Review customer contracts under non-disclosure agreement during management diligence, request actuarial
      performance guarantee reconciliations, and verify active covered lives rosters.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: competitor-contracting-outcomes
    missingEvidence: >-
      Audited member engagement rates, clinical outcome withhold releases, and enterprise retention rates for Tala
      Health and private peers.
    whyItMatters: >-
      Without verified retention and clinical withhold data, Tala $1.2B entry valuation relies on uncorroborated
      software gross margins rather than proven payer economics.
    diligencePath: >-
      Request customer references, sample payer Master Services Agreements with performance-withhold terms, and
      historical clawback/audit outcomes under NDA.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: undisclosed-financials
    missingEvidence: >-
      Audited financial statements detailing trailing revenue, cost of goods sold, gross margin, active covered lives,
      and net revenue retention.
    whyItMatters: >-
      Without historical financial metrics and verified unit economics, Tala Health's $1.2 billion valuation cannot be
      underwritten on fundamental cash flows.
    diligencePath: >-
      Request audited GAAP financials, cohort retention schedules, and insurer customer contracts under non-disclosure
      agreement during confirmatory diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: contracted-customer-volume
    missingEvidence: >-
      Disclosed payer partnership agreements or employer customer case studies verifying realized PMPM pricing and
      enrollment volume.
    whyItMatters: >-
      Stated list pricing of $3 to $6 PMPM cannot be converted into ARR or revenue run rate without confirmed contracted
      member counts and minimum volume commitments.
    diligencePath: >-
      Verify master services agreements (MSAs) with healthcare systems and insurers to inspect pricing tiers,
      performance guarantees, and termination rights.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
