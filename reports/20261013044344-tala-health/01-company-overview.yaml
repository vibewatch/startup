callouts:
  - calloutType: risk
    title: Capitalization Premium vs. Clinical Proof Asymmetry
    body: >-
      Securing a $1.2 billion post-money valuation at the seed stage creates intense pressure to deliver rapid
      commercial scale. Without verified public data on clinical accuracy, covered lives, or payer retention, Tala
      Health's valuation relies heavily on Titan Holdings' incubation track record rather than demonstrated GAAP unit
      economics.
    claimRefs:
      - CO005
      - CO006
      - CO008
      - CO012
