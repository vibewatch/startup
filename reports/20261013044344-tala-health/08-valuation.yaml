    title: Do not confuse financing with operating proof
    body: >-
      The $100 million financing and $1.2 billion valuation establish a transaction
      context, not revenue, ARR, cash available, unit economics, or independently
      verified customer value.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
  - calloutType: recommendation
    title: Minimum evidence before investment
    body: >-
      Require audited financials and capitalization, named customer references,
      covered-lives and renewal cohorts, contract payment mechanics, real-world
      clinical outcomes, safety escalation data, and a state-by-state compliance map.
    claimRefs:
      - CV006
      - CV008
      - CV011
      - CV014
      - CV015
      - CV016
