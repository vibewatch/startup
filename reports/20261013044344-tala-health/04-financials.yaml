callouts:
  - calloutType: "risk"
    title: "The PMPM Margin Trap and Outcomes Accountability"
    body: >
      While Tala Health lists $3 to $6 PMPM fees, digital health buyers in 2026 increasingly demand
      performance-based contracting and outcome verification. In an environment where employers face
      9% healthcare cost inflation, virtual care vendors that fail to demonstrate measurable cost
      reduction face severe contract churn and margin compression.
    claimRefs:
      - "CI001"
      - "CI011"
      - "CI012"
  - calloutType: "insight"
    title: "Capital Runway vs. Valuation Headroom"
    body: >
      Tala Health's $100 million seed round provides multi-year operating runway to build its engineering
      and clinical teams without immediate refinancing risk. However, entering at a $1.2 billion seed
      valuation leaves zero margin of safety, requiring flawless enterprise execution and tens of millions
      in ARR to support subsequent growth rounds.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI013"
