      - number: '8.2'
        title: 融资背景与证明负担
        blocks:
          - type: paragraph
            body: >-
              Tala 表示其已筹集由 Sofreh Capital 领投的 $100 million 种子资金，而融资概况与联合署名的投稿文章报告估值为 $1.2 billion。将这些披露数字相除可得 12 比 1
              的估值与融资额比率，但这只是进入价格背景，不得表述为 ARR 或收入倍数。该概况明确表示未披露 EV/Rev。Tala
              还表示已与两家美国最大的健康保险公司合作，但经审阅的公司公告既未点名，也未披露覆盖人数、部署状态、合同期限、续约、绩效保证或收入。仅凭公开证据无法据此得出可辩护的内在估值或可比公司估值。
