              Tala Health 列出的 PMPM 费用为 $3 至 $6，但 2026 年数字医疗买方越来越要求基于绩效的签约和结果验证。在雇主面临 9%
              医疗成本通胀的环境下，无法证明可量化成本下降的虚拟医疗供应商会遭遇严重的合同流失和利润率挤压。
