      - number: '6.2'
        title: 商业牵引力与客户披露
        blocks:
          - type: paragraph
            body: >
              尽管 Tala Health 在 2025 年末由 Sofreh Capital 领投完成一轮备受关注的 $100 million 融资，报告估值为 $1.2
              billion，但公司尚未公开点名任何一家生产环境企业客户、签约健康计划或自费保险雇主客户。公司公告描述了把自主 AI
              智能体部署到整个患者医疗旅程、并与领先美国医疗机构建立战略合作的宏大目标，但尚未发布商业案例研究或客户推荐。关键运营指标——包括合同覆盖会员数、活跃患者就诊量、年度经常性收入、毛收入留存率和净收入留存率——截至
              2026 年 10 月均完全未披露。缺乏透明客户披露，使外部尽调无法验证真实的产品市场匹配，也无法判断 Tala 的技术是否已经超越 Titan Holdings
              的内部孵化阶段。在披露经验证的合同量和可供核验的部署案例前，Tala Health 的客户牵引力只能被界定为未经证明的商业管线。
            claimRefs:
              - CU002
              - CU003
              - CU011
