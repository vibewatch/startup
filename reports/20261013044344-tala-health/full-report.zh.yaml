      - number: '7.4'
        title: 风险缓释架构、监测指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              为了守住企业价值并应对运营和监管暴露，Tala Health
              需要严格的机构级缓释措施和透明的运营治理。临床安全必须由高严重度症状的强制硬停止临床复核协议作为锚点，并持续进行同行评审的前瞻性临床审计。监管与账单都要求 Tala Health
              建立外部预账单合规审计，并严格分开自动分诊工作流与专业账单代码生成，以隔离《虚假申报法》执法风险。投资监测应跟踪明确的季度运营指标：监督临床人员离职率、异步问诊到医生升级的平均时间、独立 HIPAA 和 SOC2
              安全审计认证，以及经验证的健康计划试点转化率。更关键的是，投资者必须设立不可谈判的投资论点破坏式终止标准：州医疗委员会对 Tala Health
              医生网络采取任何正式执法行动；司法部因算法账单操纵发出任何传票；或在融资后 18 个月内未能将至少两个企业健康计划试点转化为多年期商业合同。
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR013
              - CR014
