  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 概念性展示从患者群体接入、PMPM 合同、AI 分诊、临床医生升级处理到毛利率实现的完整链路。
    approximationNotes: 成本拆分和毛利实现为基于数字医疗行业基准的示意性估算；Tala Health 尚未公布经审计的财务报表。
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI011
    data:
      nodes:
        - id: enrolled-population
          label: 已入组会员基数
          description: 保险公司和雇主 B2B 合同覆盖的会员
        - id: pmpm-contract
          label: 合同约定的 PMPM 接入
          description: 每位会员每月 $3 至 $6 的基础经常性收入
        - id: ai-triage
          label: 自主 AI 智能体分诊
          description: 压缩分诊时长并完成路由的数字化接入
        - id: clinician-care
          label: 临床医生升级处理与治疗
          description: 持牌临床医生提供诊断签字确认和护理服务
        - id: delivery-cogs
          label: 护理交付 COGS
          description: 临床人力、技术基础设施和合规成本
        - id: realized-gross-margin
          label: 实现毛利率
          description: 扣除交付成本和 SLA 调整后的净毛利
