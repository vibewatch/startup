  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与进入纪律
        blocks:
          - type: paragraph
            body: >-
              相较于按报告所称的 12 亿美元估值进行投资，建议继续研究。Tala
              拥有足够的资本与品类势能，值得继续尽调；但公开信息没有建立估值所需的经营分母：公司未披露收入倍数，融资概况未列明所有轮次参与者，也未公布其所称保险公司关系的合同经济性或经独立验证的结果。因此，估值相对于已证明的证据显得偏高，并非因为可寻址问题不够重要。进入应以已验证的收入质量、留存、结果、资本化条款，以及能防止估值重置的价格或结构为条件。
            claimRefs:
