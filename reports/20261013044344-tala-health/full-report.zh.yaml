    title: 市场规模视角
    type: pyramid
    summary: 从美国宏观医疗支出向下拆解至可触达的医疗 AI 软件细分市场，以及 Tala 未披露的商业覆盖范围。
    approximationNotes: >-
      宏观医疗支出（$4.9T）和软件占比（12%）源自 Menlo Ventures 2025 年报告。医疗 AI 软件 TAM（$1.4B）和提供商 SAM（$378M）反映 2025 年调查估计。支付方 SOM 层级是分析师根据
      14% 的支付方采用率约束得出的估算。Tala 的 ARR 未披露。
