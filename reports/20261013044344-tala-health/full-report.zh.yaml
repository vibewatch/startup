  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与付款方动态
        blocks:
          - type: paragraph
            body: >
              Tala Health 瞄准三类不同的机构客户：商业健康计划、自费保险企业雇主和医院医疗系统。健康保险公司和企业付款方被定位为 Tala 虚拟医疗导航与持续 AI
              分诊的主要商业买方，平台承诺缩短分诊时间并减少不必要的急诊使用。不过，商业采用存在明显摩擦。根据企业医疗 AI 市场数据，健康保险公司只占全部医疗人工智能支出的 5%，相当于美国整体市场每年约 $50
              million。相比之下，医院医疗系统贡献了 75% 的医疗 AI 支出（每年 $1 billion），临床记录和收入周期自动化在这里已经拥有既有 IT 预算。健康计划采购还受到平均 11.3
              个月销售周期的拖累。因此，Tala 的商业策略面临结构性逆风：它要把新颖的虚拟医疗层卖给医疗科技中行动最慢、资金最少的企业买方群体。
