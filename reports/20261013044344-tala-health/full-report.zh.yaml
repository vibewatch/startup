      - number: '8.3'
        title: 情景与可比背景
        blocks:
          - type: paragraph
            body: >-
              外部市场提供支持，但具有选择性。Rock Health 报告称，2026 年第一季度数字医疗领域 110 笔融资合计 $4.0 billion，其中 59% 的资本集中于 12
              笔巨型交易；该机构还描述了狭窄的公开退出窗口，并强调近期发行人的增长轨迹与财务纪律。Menlo Ventures 另行报告了广泛的医疗保健 AI 采用与支出，这验证了需求，却不能验证 Tala
              的执行。品类证据还显示，虚拟分诊可以改变寻求医疗的意愿；而 Stanford 的临床 AI
              综合研究警告，面向患者的系统仍需要真实世界结果与清晰的升级路径。因此，乐观、基准和悲观情景表达的是以证据为条件的估值方向，而非臆造的收入预测或无依据的概率百分比。
