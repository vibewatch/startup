              - CP011
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 基于绩效的合同留置款威胁早期收入增速
            body: >-
              PHTI 标准的基于绩效签约在机构中快速普及，正在消除企业医疗采购中的传统 PMPM 访问费。由于 Tala Health
              尚未公布经验证的临床结果指标或经审计的会员参与数据，签订要求大额付款留置的合同，会带来显著的收入确认不确定性和现金流波动。
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP010
          - type: callout
            title: 结构性切换成本在 EHR 集成，而非对话式 AI
            body: 生成式 AI 对话能力容易在竞争激烈的医疗导航工具中迅速商品化。可持续的竞争护城河几乎完全取决于深度双向 EHR 集成、临床工作流任务编排，以及能够锁定企业健康计划和临床网络的长期结构化数据积累。
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
              - CP011
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              Tala Health 主要通过与健康保险公司和企业雇主签订 B2B 合同实现平台商业化，将软件和临床服务定位为按人按月（PMPM）订阅，收费 $3 至
              $6。底层运营模式把专有人工智能智能体与持证临床人员结合起来，自动完成患者问诊、分诊和持续沟通，缩短医疗导航时间，同时试图获得类似软件的经常性利润率。与此同时，公司寻求接入区域医疗系统和临床服务网络，为实体诊断检查和专科医疗程序建立转诊管道。从更广泛的监管背景看，Centers
              for Medicare & Medicaid Services 提议更新 CY 2026 Medicare Physician Fee
              Schedule，扩大虚拟医疗编码和远程监测报销，为技术赋能医疗平台提供结构性顺风。不过，2026 年企业买方预计面临 9%
              的健康福利成本中位数趋势，雇主和商业付款方因此会审查供应商费用，并要求严格的结果问责，而不是被动的按人头固定费用。
            claimRefs:
