        title: 展示项
        blocks:
          - type: callout
            title: 未受监管的 AI 分诊中的临床责任
            body: 部署面向患者的自主症状评估会将重大医疗过失与临床责任转移至 Tala Health。在没有已发表的前瞻性验证研究或 FDA 批准的情况下，任何算法分诊失败都可能构成灾难性的企业责任。
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR013
          - type: callout
            title: 商业付款方的审慎态度暴露 12 亿美元估值风险
            body: 由于健康计划的 AI 采用率仅为 14%，企业采购周期平均为 6.6 至 8 个月，Tala Health 尚未验证的商业管线相对于其 12 亿美元种子轮投后估值面临严重的估值压缩风险。
            calloutType: insight
            claimRefs:
              - CR001
