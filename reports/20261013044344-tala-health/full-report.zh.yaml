      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本溢价与临床证据的不对称
            body: >-
              在种子阶段取得 $1.2 billion 的投后估值，会给公司快速实现商业规模带来巨大压力。在缺乏经验证的临床准确率、覆盖会员数或付款方留存率公开数据的情况下，Tala Health 的估值高度依赖 Titan
              Holdings 的孵化记录，而不是已经证明的 GAAP 单位经济。
            calloutType: risk
