chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与混合式医疗架构
        blocks:
          - type: paragraph
            body: >-
              Tala Health 是一家总部位于旧金山的数字医疗公司，成立初衷是解决美国医疗服务体系的结构性割裂与高昂行政开销。公司以 AI 驱动的医疗服务平台运作，正在开发一种混合式临床模式，把自主 AI
              软件智能体直接嵌入临床工作流。Tala 并不试图取代人类医疗服务提供者，而是部署临床 AI
              副驾驶，为持证医生分担行政分诊、问诊记录和患者长期沟通。这套混合架构希望缩短从症状出现到医疗问题解决的周转时间，同时减轻医疗服务人员的职业倦怠。不过，开展医疗服务必须持续符合各州的行医许可标准和临床责任框架。尽管
              Tala 将其软件定位为覆盖初级和专科医疗的综合医疗伙伴，但底层单位经济和技术自主程度仍由母孵化器严格控制。
            claimRefs:
              - CO001
              - CO002
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
