        title: 买方约束、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              雇主与付款方的采购标准提高了证明负担。Business Group on Health 预计，雇主将要求可衡量的结果、可用数据、透明度和更强的供应商问责；而 HIT Consultant 对 PHTI
              操作手册的介绍则描述了向参与费加结果挂钩的扣留付款转变。远程医疗报销已很普遍，但 HHS 与 CCHP 表明，执照、处方、同意、服务方式和付款规则因辖区而异。根据公开证据，Tala
              尚未准备好退出：市场正在奖励规模化证明，公司也未披露构建 IPO 或战略出售案例所需的财务纪律或经验证的经营轨迹。最终尽调应检验客户推荐、临床安全、州级运营合规、经审计指标，以及每一项优先权或稀释条款。
            claimRefs:
