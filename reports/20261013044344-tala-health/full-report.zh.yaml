      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 付款方销售周期与集中度风险
            body: 医疗系统占医疗 AI 支出的 75%，而健康保险公司只占企业 AI 预算的 5%，且要求漫长的 11.3 个月采购周期。Tala Health 依赖预期付款方合作关系，带来显著的收入时点脆弱性。
            calloutType: risk
            claimRefs:
              - CU004
              - CU005
              - CU013
          - type: callout
            title: 雇主整合供应商的压力
            body: 面对 2026 年 9% 成本趋势的企业雇主，正在主动淘汰缺乏可证明临床和财务结果的点解决方案。除非 Tala Health 能迅速发布经验证的客户结果数据，否则合同续签将受到高度审查。
            calloutType: insight
            claimRefs:
              - CU006
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与执业许可合规风险
        blocks:
          - type: paragraph
            body: >-
              运营一个把自主 AI 智能体与人类临床人员结合起来、直接面向患者的虚拟医疗平台，使 Tala Health
              暴露于严格的多层监管。远程医疗执业标准和临床人员许可要求由碎片化的联邦及州法律框架管理，这些框架要求逐州注册医生、严格的监督比例和严谨的知情同意流程。州医疗委员会积极监管跨州远程医疗服务，因此若 Tala
              Health 无法维持合规的专业公司结构，快速扩张地域就会遇到合规障碍。与此同时，联邦卫生机构和司法部加强了对数字医疗及临床软件供应商的《虚假申报法》执法，2025
              年医疗追偿金额创历史新高。软件公司因技术导致的合规失败、未经验证的账单代码建议和网络安全声明而面临更高风险。尽管 FDA
              目前对部分临床决策支持工具采取执法裁量，监管审查仍把确保算法可靠性、避免不良临床结果的大量责任转移给开发者。
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR011
      - number: '7.2'
        title: 临床安全与运营交付失效模式
        blocks:
          - type: paragraph
            body: >-
              Tala Health 的核心医疗服务架构依赖一套整合工作流：自主 AI 副驾驶先完成患者初始问诊、早期症状评估和专科转诊，再接入持证临床人员。这个面向患者的自主界面会带来严重的临床责任风险。AI
              临床决策工具虽然在理论基准上表现有希望，但真实世界部署在处理模糊症状时会遭遇边缘案例失效、幻觉和误分类错误。若自主问诊智能体未能识别非典型急性冠脉综合征或细微卒中迹象等关键急症症状，就可能造成灾难性的医疗事故责任。自主智能体与人类临床人员之间的运营交接还会引入延迟和沟通漏洞。面对高患者量和算法警报疲劳，监督医生可能降低诊断警觉性，不加批判地接受
              AI 分诊建议。Tala Health 尚未公开发布第三方前瞻性验证基准或临床错误日志，其安全协议的稳健性仍未得到验证。
            claimRefs:
              - CR002
              - CR008
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR008
              - CR012
              - CR013
      - number: '7.3'
        title: 商业付款方摩擦与控股公司依赖
        blocks:
          - type: paragraph
            body: >-
              Tala Health 的商业模式依赖商业付款方合同和自费保险雇主合作，以实现其 24/7 医疗服务平台的商业化。不过，企业健康计划采购惯性很强，评估直接面向患者的 AI
              医疗服务工具时，要经历漫长的临床风险委员会审议、精算审计和安全审查。行业研究显示，健康计划的 AI 采用明显落后于医院系统；付款方在授权网络覆盖前，会刻意审查临床有效性和投资回报保证。这种商业审议在 Tala
              Health 完成 $1.2 billion 估值种子轮后，带来严重的收入实现风险。商业摩擦之外，Tala Health 作为 Titan Holdings 子公司的组织治理也造成依赖。在 AI
              原生控股公司模式中，企业资本配置、共享工程基础设施和管理层注意力都会在兄弟企业之间产生结构性相互依赖。如果母公司的资本优先级转向其他投资组合企业，投资者就会暴露于集团内部资源竞争和潜在利益冲突。
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR014
