            body: >
              把 Tala Health 作为机构资产进行投资评估，必须承认其顶级财务支持与未经证明的商业基本面之间存在鲜明反差。虽然 $100 million
              的资本注入消除了近期资不抵债风险，并提供数年的现金缓冲期，但在标准市场倍数下，以 $1.2 billion 为早期种子企业定价，意味着未来年度经常性收入应远超 $50 million。在雇主采购从被动 PMPM
              费用转向绩效保证和临床风险共担的环境中，Tala Health 必须证明其 AI—临床人员混合模式能够带来可验证的医疗成本节约，同时不重演导致 Babylon Health
              倒闭的服务成本失控式膨胀。在经审计的客户合同、实际定价表和留存指标接受尽调检查之前，财务投资评估仍属推测性判断，风险很高。
            claimRefs:
