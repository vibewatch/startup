      - number: '6.3'
        title: 机构部署证明与试点证据
        blocks:
          - type: paragraph
            body: >
              Tala Health 的临床有效性和真实世界部署仍缺乏机构层面的证明。Tala 声称其 AI 副驾驶可在问诊、诊断和慢病护理中协助医生，但独立的临床 AI 评估揭示了真实医疗环境中的重大障碍。Stanford
              Medicine 和 Harvard 研究人员发表的学术研究显示，临床 AI 模型面对不完整患者信息和复杂临床不确定性时，性能会大幅下降，往往更接近医学生，而非经验丰富的主治医生。此外，超过 95% 的已发表医疗
              AI 研究依赖考试基准，而非真实患者数据，凸显真实世界验证的严重不足。Tala 进入的是一个拥挤的虚拟医疗市场，其中已有超过 265 家成熟远程医疗和数字医疗平台——例如 MDLive、Teladoc
              Health 和 PlushCare——与全国保险公司和雇主福利计划运营多年期签约网络。Tala 要取代这些根深蒂固的供应商，必须提供严格的临床证据，但这类证据尚未在生产环境中得到证明。
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU009
              - CU014
