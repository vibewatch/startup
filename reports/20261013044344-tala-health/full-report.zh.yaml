figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Tala Health 从孵化到商业化推广的关键时间顺序里程碑。
    data:
      items:
        - date: 2014-01
          label: Titan Holdings 成立
          detail: Ritankar Das 创立 Titan Holdings，在没有外部 LP 的情况下，打造覆盖医疗和金融的 AI 原生运营实体。
          tone: neutral
          claimRefs:
            - CO003
        - date: 2022-06
          label: 收购 Dascena
          detail: Titan Holdings 将算法疾病检测先驱 Dascena 出售给 CirrusDx，验证医疗 AI 孵化模式。
          tone: positive
          claimRefs:
            - CO003
        - date: 2024-01
          label: Forta Health 获 $55M 融资
          detail: Titan Holdings 旗下 Forta Health 融资 $55M，用于扩大 AI 定制的自闭症治疗。
          tone: positive
          claimRefs:
            - CO003
        - date: 2025-11
          label: Tala Health 亮相并获 $100M 种子融资
          detail: Tala Health 脱离 Titan Holdings，完成由 Sofreh Capital 和 Dr. P. Roy Vagelos 领投的 $100M 种子轮。
          tone: positive
          claimRefs:
            - CO005
            - CO006
        - date: 2025-11
          label: 三份商业保险公司合同
          detail: Tala 宣布与三家主要美国健康保险承保机构达成商业协议，提供 AI 智能体护理服务。
          tone: positive
          claimRefs:
            - CO007
        - date: 2025-12
          label: $1.2B 估值头条轮
          detail: USA Today 和科技媒体报道称投后估值为 $1.2B，成为数字医疗领域规模最大的种子轮之一。
          tone: neutral
          claimRefs:
            - CO005
            - CO008
        - date: 2026-01
          label: Stanford-Harvard 临床 AI 评估
          detail: 《State of Clinical AI》报告强调，临床 AI 模型面对现实世界不确定性时，性能会出现下滑。
          tone: warning
          claimRefs:
            - CO012
            - CO013
        - date: 2026-10
          label: 尽调审查与治理审计
          detail: 持续进行的尽调审查未披露的财务运行率、客户身份，以及是否符合临床实践标准。
          tone: neutral
          claimRefs:
            - CO009
            - CO016
