              - CU009
      - number: '6.4'
        title: 客户旅程与留存持久性
        blocks:
          - type: paragraph
            body: >
              Tala Health 的商业客户生命周期在买方导入、工作流集成和合同续签各环节都面临高采购壁垒。从首次接触付款方到投入生产，需要经过 11.3 个月的采购评估、临床风险审计和 EHR
              工作流技术集成。即使完成客户导入，合同留存仍受到前所未有的宏观经济审查。2026 年，大型自费保险雇主面临 9%
              的医疗成本中位数趋势，迫使福利负责人严格审计供应商合作，并终止无法证明临床改善或净财务回报的数字医疗项目。如果没有经审计的续约历史、客户群组或绩效保证记录，初始部署无法快速控制成本时，Tala
              将面临高流失风险。要建立可持续留存，Tala 必须从推测性的试点公告转向可验证的临床结果数据，满足日益严格的企业采购团队要求。
            claimRefs:
              - CU004
              - CU006
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
