        - from: delivery-cogs
          to: realized-gross-margin
  - id: FE001
    title: Tala Health 多智能体系统架构栈
    type: stack
    summary: 六层多智能体架构，覆盖用户交互、编排、临床推理、集成和监管治理。
    claimRefs:
      - CE002
      - CE003
      - CE014
    data:
      layers:
        - label: 第 1 层：对话式接入与互动
          detail: 面向患者的移动端和网页界面，提供全天候症状接入、自动动态提问和安全消息传递。
        - label: 第 2 层：多智能体编排与工作流路由
          detail: 工作流调度引擎将临床评估任务与运营、排班和行政流程分开。
        - label: 第 3 层：临床决策支持与病历综合
          detail: 微调临床模型自动生成 SOAP 就诊记录，并提出鉴别诊断建议。
        - label: 第 4 层：人在回路中的临床监督
          detail: 监督审查门户由持牌执业护士和医生核验病历、调整方案并发起视频护理。
        - label: 第 5 层：企业集成与预授权
          detail: 连接器支持 EHR 互操作、健康计划资格核验、自动影像排程和检验医嘱路由。
        - label: 第 6 层：安全、合规与审计轨迹
          detail: 符合 HIPAA 的数据隔离层维护访问控制、遥测日志和符合 FDA 要求的审计轨迹。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 端到端展示商业客户获取、临床副驾驶部署和支付方扩张阻力的客户旅程。
    data:
      items:
        - label: 采购与评估
          description: 医疗系统和商业支付方评估 AI 临床副驾驶能力。
          touchpoints:
            - 支付方 11.3 个月的采购周期
            - 安全与 HIPAA 合规审查
          tone: neutral
        - label: 临床工作流试点
          description: 将自主 AI 智能体集成到临床医生的分诊和文档流程中。
          touchpoints:
            - 医生工作流副驾驶测试
            - 现实世界不确定性验证
          tone: neutral
        - label: 生产环境部署
          description: 上线全天候虚拟护理，让患者可以联系持牌临床医生。
          touchpoints:
            - EHR 集成网关
            - 主动式患者分诊
          tone: positive
        - label: 结果验证
          description: 衡量临床决策准确性、转诊延迟和患者满意度。
          touchpoints:
            - 从症状到治疗的速度
            - 临床质量监督
          tone: positive
        - label: 合同续约审查
          description: 雇主和保险公司严格审查已证明的临床及财务 ROI。
          touchpoints:
            - 供应商淘汰审计
            - 已证明的医疗成本节省
          tone: risk
        - label: 支付方扩张与规模化
          description: 扩大商业健康计划会员和自保池的覆盖范围。
          touchpoints:
            - 精算风险保证
            - 多年期网络签约
          tone: neutral
