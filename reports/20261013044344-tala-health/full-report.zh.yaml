      - number: '4.3'
        title: 商业牵引力与资本充足性
        blocks:
          - type: paragraph
            body: >
              从资本结构看，Tala Health 对一家早期医疗科技创业公司而言拥有异常强的资产负债表。公司在 2025 年末完成 $100 million 种子轮融资，投后估值 $1.2 billion，由领投方
              Sofreh Capital 主导，并得到 Titan Holdings 和 Dr. P. Roy Vagelos
              支持。管理层表示，融资所得将用于扩大工程和临床团队、扩展专有模型架构，以及建立机构付款方关系。尽管现金缓冲充足，公开商业牵引指标仍然稀少。Dealroom 记录的美国月度网站访问量约为 2,300 次，而
              Tala Health
              尚未公开点名任何已签约商业健康计划、自费保险雇主赞助方或整合式医疗网络。此外，经审计的财务数据——包括确认收入、现金消耗率、毛利率、活跃覆盖会员数和净收入留存率——全部未披露，估值规模与经验证运营表现之间存在重大缺口。
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI009
              - CI014
