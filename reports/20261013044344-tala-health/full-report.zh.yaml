      - number: '4.2'
        title: 成本结构与服务经济性
        blocks:
          - type: paragraph
            body: >
              Tala Health 的核心单位经济问题是：自主 AI 分诊层能否从根本上改变传统远程医疗高度依赖人工的成本结构。纯软件企业的毛利率可超过
              75%，而临床医疗服务模式不可避免地承担临床人员直接薪酬、医疗事故责任和监管许可开销，使实际毛利率压低至 30% 至 50%。Tala Health 声称其 AI 副驾驶能把诊断时间从数周压缩到数小时，但
              Stanford Medicine 和 ARISE 网络的临床评估指出，临床 AI
              系统在处理诊断不确定性和狭窄评估之外的模糊患者表现时，性能会大幅下降。因此，持证人类临床人员必须持续参与高风险临床决策，带来长期可变服务成本。Babylon Health 的历史案例说明了这一系统性风险：该公司在
              2023 年进入资不抵债和清算前，曾达到 $2 billion 的市场估值；在未经证明的单位经济和脆弱付款方关系之上扩张高固定成本临床网络，可能重演同样的风险。
            claimRefs:
              - CI005
              - CI006
              - CI012
