        title: 医疗服务中的产品与服务定义
        blocks:
          - type: paragraph
            body: >-
              Tala Health 提供虚拟医疗和医疗导航平台，旨在引导患者从最初出现症状走到明确的临床解决方案。该服务不是无人辅助的消费者聊天机器人，而是把对话式 AI
              智能体与直接嵌入医疗工作流的持证执业护士和医生结合起来。患者可通过互动问诊应用 24/7 发起医疗服务，自主智能体会动态提问、访问获授权的医疗记录，并生成结构化 SOAP
              就诊记录。当医疗评估需要临床判断或实体干预时，患者会顺畅转交给网络临床人员，接受同步远程医疗或专科转诊，以降低付款方成本并加快医疗过程解决。
