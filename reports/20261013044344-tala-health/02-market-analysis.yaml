callouts:
  - calloutType: insight
    title: 'The Procurement Bifurcation: Payers Deliberate While Providers Accelerate'
    body: >-
      Healthcare IT procurement cycles are diverging dramatically across buyer classes. According to Menlo Ventures'
      2025 survey, health systems compressed buying cycles by 18% to 6.6 months and outpatient clinics to 4.7 months,
      driven by urgent clinician staffing shortages. In stark contrast, health plan payer procurement timelines
      lengthened to 11.3 months as insurers demand rigorous actuarial validation. For Tala Health, which targets
      commercial payers as its core commercial anchor, sales cycles are structurally protracted and subject to prolonged
      scrutiny.
    claimRefs:
      - CM007
      - CM008
  - calloutType: risk
    title: The Demise of Permissive PMPM Fees Mandates Outcome Verification
    body: >-
      Purchasers are rapidly dismantling the traditional Per Member Per Month (PMPM) digital health contracting
      paradigm. As highlighted by the Peterson Health Technology Institute (PHTI), employers and health plans are
      replacing passive eligibility-based access fees with two-stream contracts that tie payments to verified engagement
      and withhold significant fees pending clinical outcome proof. In an environment where 2026 employer health benefit
      costs are rising 9%, unproven platforms like Tala face severe commercial headwinds without audited
      return-on-investment benchmarks.
    claimRefs:
      - CM009
      - CM010
      - CM011
