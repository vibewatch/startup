  - id: TE002
    title: Clinical Workflow and Use-Case Comparison
    columns:
      - Clinical Workflow Job
      - Traditional Care Baseline
      - Tala Health Solution
      - Reported Efficiency Benefit
      - Technical & Clinical Limitation
    rows:
      - - Initial Symptom Triage
        - Unscheduled ER visit or delayed primary care appointment booking
        - 24/7 conversational intake mobile agent with Bayesian symptom exploration
        - Immediate symptom evaluation avoiding unnecessary low-acuity emergency visits
        - Risk of model over-confidence or misaligned acuity under diagnostic ambiguity
      - - Clinical Chart Encounter Notes
        - Manual 15-to-20 minute physician SOAP note authoring in EHR
        - Automated chart generation synthesizing patient history and intake dialogue
        - Significant reduction in clinician administrative documentation burden
        - Requires mandatory clinician verification to catch hallucinations or omissions
      - - Outpatient Specialist Referral
        - Manual faxing, phone calls, and delayed insurance prior authorizations
        - Automated insurance verification and electronic referral dispatch
        - Compressed elapsed cycle time between initial symptom and specialist review
        - Dependent on partner health plan API interoperability and network adequacy
      - - Post-Acute Patient Follow-Up
        - Sporadic manual phone outreach or unmonitored discharge instructions
        - Proactive conversational outreach agents tracking symptom resolution
        - Higher engagement and early detection of deteriorating clinical conditions
        - Patient drop-off or non-responsiveness to automated asynchronous messages
    notes: Workflow baseline comparisons derived from published digital triage studies and digital health market research; Tala-specific time savings lack independent audit.
    claimRefs:
      - CE001
      - CE004
      - CE010
      - CE011
  - id: TE003
    title: Technology Stack and Infrastructure Dependencies
    columns:
      - Architecture Layer
      - Core Functional Role
      - Underlying Technology Dependency
      - Technical & Governance Risk
    rows:
      - - Conversational Frontend
        - Patient interaction and dynamic intake dialogue
        - Multi-platform web and mobile client applications
        - Patient communication security and accessibility compliance
      - - Clinical Reasoning Engine
        - Differential diagnosis ranking and SOAP note draft creation
        - Proprietary fine-tuned medical large language models
        - Model drift, diagnostic hallucinations, and lack of public clinical trial data
      - - Operational Multi-Agent Dispatch
        - Scheduling, insurance pre-check, and task routing
        - Task-specific non-clinical autonomous software agents
        - Orchestration failures across asynchronous distributed task pipelines
      - - EHR & Payer Integration Hub
        - Bidirectional chart sync and claims pre-authorization
        - FHIR / HL7 clinical interfaces and payer clearinghouses
        - Brittle legacy EHR interfaces and variable health plan API availability
    notes: Architecture layers compiled from vendor product releases and industry research; foundational LLM provider agreements and fine-tuning datasets remain private.
    claimRefs:
      - CE003
      - CE006
      - CE008
      - CE014
figures:
  - id: FE001
    title: Tala Health Multi-Agent System Architecture Stack
    type: stack
    summary: Six-layer multi-agent architecture spanning user interaction, orchestration, clinical inference, integration, and regulatory governance.
    claimRefs:
      - CE002
      - CE003
      - CE014
    data:
      layers:
        - label: 'Layer 1: Conversational Intake & Engagement'
          detail: Patient-facing mobile and web interface providing 24/7 symptom intake, automated dynamic questioning, and secure messaging.
        - label: 'Layer 2: Multi-Agent Orchestration & Workflow Routing'
          detail: Workflow dispatch engine separating clinical evaluation tasks from operational, scheduling, and administrative processes.
        - label: 'Layer 3: Clinical Decision Support & Note Synthesis'
          detail: Fine-tuned clinical models generating automated SOAP encounter documentation and differential diagnosis recommendations.
        - label: 'Layer 4: Human-in-the-Loop Clinical Oversight'
          detail: Supervisory review portal where licensed nurse practitioners and physicians validate charts, adjust plans, and initiate video care.
        - label: 'Layer 5: Enterprise Integration & Pre-Authorization'
          detail: Connectors for EHR interoperability, health plan eligibility, automated imaging scheduling, and lab order routing.
        - label: 'Layer 6: Security, Compliance & Audit Trail'
          detail: HIPAA-compliant data isolation layer maintaining access controls, telemetry logging, and FDA-aligned audit trails.
callouts:
  - calloutType: insight
    title: Multi-Agent Architecture Decouples Clinical Reasoning from Operational Overhead
    body: Tala Health's division of labor between clinical LLMs and operational workflow agents enables specialized safety guardrails. While administrative agents handle scheduling and insurance pre-authorization with deterministic business logic, diagnostic agents operate under mandatory human clinician supervision, mitigating clinical liability.
    claimRefs:
      - CE003
      - CE004
  - calloutType: risk
    title: Absence of Prospective Clinical Trials Leaves Diagnostic Safety Unverified
    body: Despite raising $100 million at a $1.2 billion valuation, Tala Health has not published peer-reviewed prospective clinical trials demonstrating real-world triage accuracy or outcome improvements. In academic evaluations, medical LLMs exhibit sharp accuracy drops under uncertainty, representing a material diligence risk.
    claimRefs:
      - CE005
      - CE006
      - CE015
