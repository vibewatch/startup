- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Pricing / Contract Model
  - Contract Mechanism
  - Target Customers
  - Accountability Level
  - Strategic Diligence Implication
  rows:
  - - Legacy PMPM Access Fee
    - Fixed recurring subscription billed on total eligible covered members
    - Self-insured employers & commercial health plans
    - Low accountability; clawback clauses rarely enforced in practice
    - Faces widespread elimination by budget-constrained employers in 2026
  - - Two-Stream Performance Model (PHTI)
    - Lower base engagement fee plus substantial outcome-linked withhold
    - Value-based health plans & risk-bearing health systems
    - High accountability; withhold released only on verified clinical outcomes
    - Forces digital health vendors to put contract revenue at financial risk
  - - Per-Visit Episodic Fee
    - Fee-for-service per completed telehealth consultation or clinical referral
    - Direct-to-consumer and corporate episodic care programs
    - Medium accountability; costs scale with visits rather than outcomes
    - Incentivizes visit volume without reducing long-term healthcare spend
  - - Bundled Value-Based Shared Savings
    - Administrative fee combined with shared savings against total cost of care
    - Accountable Care Organizations (ACOs) & Medicare Advantage plans
    - High accountability; requires actuarial validation and EHR audit rights
    - High barrier to entry for early startups lacking multi-year actuarial proof
  notes: Contracting taxonomy adapted from the Peterson Health Technology Institute (PHTI) 2026 Performance-Based Contracting
    Playbook and Business Group on Health employer survey findings.
