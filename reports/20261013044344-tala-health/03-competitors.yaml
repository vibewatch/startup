callouts:
- calloutType: risk
  title: Performance-Based Contract Withholds Threaten Early Revenue Velocity
  body: The rapid institutional adoption of PHTI-standard performance-based contracting eliminates legacy PMPM access fees
    across enterprise healthcare purchasing. Because Tala Health has not yet published verified clinical outcome metrics or
    audited member engagement data, entering contracts requiring substantial payment withholds creates significant revenue
    recognition uncertainty and cash flow volatility.
  claimRefs:
  - CP008
  - CP009
  - CP010
- calloutType: insight
  title: Structural Switching Costs Reside in EHR Integration Rather Than Conversational AI
  body: Generative AI conversational capabilities are vulnerable to rapid commoditization across competitive care navigation
    tools. Sustainable competitive moats depend almost entirely on deep bi-directional EHR integration, clinical workflow
    task orchestration, and longitudinal structured data accumulation that lock in enterprise health plans and clinical networks.
  claimRefs:
  - CP006
  - CP007
  - CP011
