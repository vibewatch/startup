  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and Service Definition in Care Delivery
        blocks:
          - type: paragraph
            body: >-
              Tala Health delivers a virtual care and care navigation platform designed to guide patients from initial
              symptom onset to definitive clinical resolution. Rather than providing unassisted consumer chatbots, the
              service combines conversational AI agents with licensed nurse practitioners and physicians embedded
              directly into the care workflow. Patients initiate care 24/7 through an interactive intake application,
              where autonomous agents conduct dynamic clinical questioning, access authorized medical records, and
              synthesize structured SOAP encounter notes. When medical evaluation requires clinical judgment or physical
              intervention, patients are seamlessly transitioned to network clinicians for synchronous telehealth or
              specialist referrals, targeting lower payer costs and faster episode resolution.
            claimRefs:
              - CE001
              - CE002
              - CE004
