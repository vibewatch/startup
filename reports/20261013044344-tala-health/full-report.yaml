  - id: FE001
    title: Tala Health Multi-Agent System Architecture Stack
    type: stack
    summary: >-
      Six-layer multi-agent architecture spanning user interaction, orchestration, clinical inference, integration, and
      regulatory governance.
    claimRefs:
      - CE002
      - CE003
      - CE014
    data:
      layers:
        - label: 'Layer 1: Conversational Intake & Engagement'
          detail: >-
            Patient-facing mobile and web interface providing 24/7 symptom intake, automated dynamic questioning, and
            secure messaging.
        - label: 'Layer 2: Multi-Agent Orchestration & Workflow Routing'
          detail: >-
            Workflow dispatch engine separating clinical evaluation tasks from operational, scheduling, and
            administrative processes.
        - label: 'Layer 3: Clinical Decision Support & Note Synthesis'
          detail: >-
            Fine-tuned clinical models generating automated SOAP encounter documentation and differential diagnosis
            recommendations.
        - label: 'Layer 4: Human-in-the-Loop Clinical Oversight'
          detail: >-
            Supervisory review portal where licensed nurse practitioners and physicians validate charts, adjust plans,
            and initiate video care.
        - label: 'Layer 5: Enterprise Integration & Pre-Authorization'
          detail: >-
            Connectors for EHR interoperability, health plan eligibility, automated imaging scheduling, and lab order
            routing.
        - label: 'Layer 6: Security, Compliance & Audit Trail'
          detail: >-
            HIPAA-compliant data isolation layer maintaining access controls, telemetry logging, and FDA-aligned audit
            trails.
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end commercial customer journey illustrating buyer acquisition, clinical copilot deployment, and payer
      expansion friction.
    data:
