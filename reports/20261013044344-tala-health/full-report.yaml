      - number: '8.2'
        title: Financing context and proof burden
        blocks:
          - type: paragraph
            body: >-
              Tala says it raised $100 million in seed funding led by Sofreh Capital, while a financing profile and
              syndicated contributor article report a $1.2 billion valuation. Dividing those disclosed figures produces
              a 12-to-1 valuation-to- capital-raised ratio, but that is only an entry-price context and must not be
              presented as an ARR or revenue multiple. The profile explicitly says EV/Rev is not disclosed. Tala also
              says it has partnered with two of the largest U.S. health insurers, yet the reviewed company announcement
              does not name them or disclose covered lives, deployment status, contract duration, renewal, performance
              guarantees, or revenue. These omissions prevent a defensible intrinsic or comparable-company valuation
              from public evidence alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: Scenario and comparable context
        blocks:
          - type: paragraph
            body: >-
              The external market is supportive but selective. Rock Health reported $4.0 billion across 110
              digital-health financings in Q1 2026, with 59% of capital concentrated in twelve mega-deals; it also
              described a narrow public exit window and emphasized growth trajectories and financial discipline among
              recent issuers. Menlo Ventures separately reported broad healthcare-AI adoption and spending, which
              validates demand but not Tala's execution. Category evidence also shows that virtual triage can alter
              care-seeking intent, while Stanford's clinical-AI synthesis warns that patient-facing systems still need
              real-world outcomes and clear escalation pathways. Bull, base, and bear cases are therefore expressed as
              evidence-contingent valuation directions, not invented revenue forecasts or unsupported probability
              percentages.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Buyer constraints, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              Employer and payer purchasing standards raise the proof burden. Business Group on Health expects employers
              to demand measurable outcomes, usable data, transparency, and stronger vendor accountability, while HIT
              Consultant's account of the PHTI playbook describes a shift toward engagement fees plus outcome-linked
              payment withholds. Telehealth reimbursement is widespread, but HHS and CCHP show that licensure,
              prescribing, consent, modality, and payment rules vary by jurisdiction. Tala is not exit-ready on public
              evidence: the market is rewarding scaled proof, and the company has not disclosed the financial discipline
              or validated operating trajectory needed to frame an IPO or strategic-sale case. Final diligence should
              test customer references, clinical safety, state-level operating compliance, audited metrics, and every
              preference or dilution term.
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not confuse financing with operating proof
            body: >-
              The $100 million financing and $1.2 billion valuation establish a transaction context, not revenue, ARR,
              cash available, unit economics, or independently verified customer value.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
          - type: callout
            title: Minimum evidence before investment
            body: >-
              Require audited financials and capitalization, named customer references, covered-lives and renewal
              cohorts, contract payment mechanics, real-world clinical outcomes, safety escalation data, and a
              state-by-state compliance map.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV008
              - CV011
              - CV014
              - CV015
              - CV016
