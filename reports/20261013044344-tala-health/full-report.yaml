          - type: callout
            title: Capital Runway vs. Valuation Headroom
            body: >
              Tala Health's $100 million seed round provides multi-year operating runway to build its engineering and
              clinical teams without immediate refinancing risk. However, entering at a $1.2 billion seed valuation
              leaves zero margin of safety, requiring flawless enterprise execution and tens of millions in ARR to
              support subsequent growth rounds.
            calloutType: insight
