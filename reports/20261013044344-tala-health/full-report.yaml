      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Payer Sales Cycles and Concentration Risks
            body: >-
              While health systems represent 75% of healthcare AI spending, health insurers account for only 5% of
              enterprise AI budgets and require prolonged 11.3-month procurement cycles. Tala Health's reliance on
              prospective payer partnerships creates substantial revenue timing vulnerability.
            calloutType: risk
            claimRefs:
              - CU004
              - CU005
              - CU013
          - type: callout
            title: Employer Vendor Consolidation Pressures
            body: >-
              Corporate employers facing a 9% cost trend in 2026 are actively eliminating point solutions lacking
              demonstrable clinical and financial outcomes. Tala Health will face high contract renewal scrutiny unless
              it can rapidly publish verified customer outcome data.
            calloutType: insight
            claimRefs:
              - CU006
