              - CU006
              - CU007
              - CU009
      - number: '6.4'
        title: Customer Journey and Retention Durability
        blocks:
          - type: paragraph
            body: >
              The commercial customer lifecycle for Tala Health reflects steep procurement hurdles across buyer
              onboarding, workflow integration, and contract renewal. Moving from initial payer outreach to production
              deployment requires passing through an 11.3-month procurement evaluation, clinical risk audits, and
              technical EHR workflow integration. Even after onboarding, contract retention is subject to unprecedented
              macroeconomic scrutiny. In 2026, large self-insured employers face a median 9% healthcare cost trend,
              compelling benefit leaders to aggressively audit vendor partnerships and terminate digital health programs
              that fail to demonstrate measurable clinical improvement or net financial return. Without audited renewal
              history, customer cohorts, or performance guarantee track records, Tala faces high churn risk if initial
              deployments fail to deliver rapid cost containment. Establishing sustainable retention will require Tala
              to transition from speculative pilot announcements to verifiable clinical outcome data that satisfies
              increasingly demanding enterprise procurement teams.
            claimRefs:
              - CU004
              - CU006
              - CU012
              - CU013
