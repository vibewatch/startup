      - number: '5.2'
        title: Multi-Agent Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The technological foundation of Tala Health relies on a multi-agent software architecture that explicitly
              separates medical diagnostic reasoning from non-clinical operational tasks. Clinical agents evaluate
              reported symptom complexes against medical knowledge bases to propose differential diagnoses and draft
              encounter summaries for physician validation. Concurrently, discrete non-clinical agents handle
              administrative overhead, including health plan eligibility checks, prior authorization data collation,
              diagnostic imaging scheduling, and lab routing. This structural separation permits deterministic workflow
              automation for operational tasks while constraining stochastic generative models to draft proposals
              subject to mandatory clinician sign-off. All multi-agent telemetry and patient interactions are designed
              to log to HIPAA-compliant audit trails, preserving oversight across distributed care pipelines.
            claimRefs:
              - CE003
              - CE004
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
