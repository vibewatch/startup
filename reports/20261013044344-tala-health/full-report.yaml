      - Valuation and return logic
      - Key risks and downside triggers
      - Probability signal
    rows:
      - - Bull
        - >-
          Named payers scale deployments; audited revenue, retention, margins, and clinical outcomes demonstrate
          repeatability.
        - >-
          The current mark or a higher mark becomes supportable only if disclosed growth and unit economics benchmark
          credibly against scaled peers.
        - Safety failure, weak renewal, or inability to demonstrate medical-cost value breaks the case.
        - Possible but unsupported by current public company-specific evidence.
      - - Base
        - >-
          Tala converts some insurer access into measured pilots while buyers impose audit rights and outcome-linked
          economics.
        - >-
          A lower or milestone-tranched effective entry is preferable because the $1.2 billion mark lacks a public
          operating denominator.
        - Slow conversion, withheld payments, regulatory complexity, and further dilution constrain returns.
        - Most consistent with the mixed public evidence.
      - - Bear
        - >-
          Deployments remain unverified or fail to renew, clinical escalation controls disappoint, or financing terms
          amplify common-equity downside.
        - >-
          Value would be materially below the reported mark; a precise range is not supportable without financial
          statements and preference terms.
        - Loss of claimed partners, adverse safety evidence, compliance failure, or a down round breaks the thesis.
        - Material downside remains unresolved.
    notes: >-
      Scenarios are directional because revenue, cash burn, capitalization terms, and customer economics are not
      publicly disclosed; probability percentages and precise valuation ranges would be false precision.
    claimRefs:
