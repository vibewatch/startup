              - CU004
              - CU005
              - CU006
              - CU010
      - number: '6.2'
        title: Commercial Traction and Customer Disclosure
        blocks:
          - type: paragraph
            body: >
              Despite securing a high-profile $100 million financing round led by Sofreh Capital in late 2025 at a
              reported $1.2 billion valuation, Tala Health has not publicly named a single production enterprise
              customer, contracted health plan, or self-funded employer client. Company announcements describe broad
              ambitions to deploy autonomous AI agents across the entire patient care journey and forge strategic
              partnerships with leading U.S. healthcare institutions, yet no commercial case studies or client
              references have been published. Crucial operational metrics—including covered lives under contract, active
              patient encounter volume, annual recurring revenue, gross revenue retention, and net revenue
              retention—remain entirely undisclosed as of October 2026. This lack of transparent customer disclosure
              makes it impossible for external diligence to verify genuine product-market fit or assess whether Tala's
              technology has progressed beyond internal incubation at Titan Holdings. Until verified contract volumes
              and referenceable deployments are disclosed, Tala Health's customer traction must be characterized as an
              unproven commercial pipeline.
            claimRefs:
              - CU002
              - CU003
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU011
      - number: '6.3'
        title: Institutional Deployment Proof and Pilot Evidence
        blocks:
          - type: paragraph
            body: >
              Institutional proof of Tala Health's clinical efficacy and real-world deployment remains constrained.
              While Tala claims that its AI copilots assist doctors across intake, diagnosis, and chronic care,
              independent evaluations of clinical AI models highlight significant hurdles in live medical environments.
              Academic research published by Stanford Medicine and Harvard researchers demonstrates that clinical AI
              models experience steep performance drops when confronted with incomplete patient information and complex
              clinical uncertainty, often performing closer to medical students than experienced attending physicians.
              Furthermore, over 95% of published medical AI studies rely on exam benchmarks rather than real patient
              data, underscoring an acute deficit of real-world validation. Tala enters a crowded virtual care landscape
              where over 265 established telehealth and digital health platforms—such as MDLive, Teladoc Health, and
              PlushCare—already operate multi-year contracted networks with national insurers and employer benefit
              plans. Tala's ability to displace these entrenched providers will require rigorous clinical proof that has
              not yet been demonstrated in production environments.
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU009
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
