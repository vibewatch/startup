        title: Exhibits
        blocks:
          - type: callout
            title: The PMPM Margin Trap and Outcomes Accountability
            body: >
              While Tala Health lists $3 to $6 PMPM fees, digital health buyers in 2026 increasingly demand
              performance-based contracting and outcome verification. In an environment where employers face 9%
              healthcare cost inflation, virtual care vendors that fail to demonstrate measurable cost reduction face
              severe contract churn and margin compression.
            calloutType: risk
            claimRefs:
