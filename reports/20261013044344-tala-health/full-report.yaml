  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Tala Health sits at the intersection of agentic clinical workflows and digital
              virtual care orchestration. Defining this market boundary requires strictly separating autonomous care
              coordination from adjacent healthtech categories that address fundamentally different budgets. Included
              spend encompasses autonomous intake and triage, protocol-driven longitudinal patient routing, and
              asynchronous care management software that actively orchestrates episodes of care. In contrast, excluded
              spend covers core electronic health record (EHR) infrastructure, human clinician payroll, and horizontal
              generative AI scribing tools that merely document in-person visits without altering care pathways. Tala
              aims to bridge the historical divide between fragmented point solutions and overburdened clinical staff,
              but status-quo substitutes—primarily manual telephone triage, patient portals, and legacy telehealth
              vendors—remain deeply entrenched across major enterprise payers.
            claimRefs:
              - CM001
              - CM006
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM010
      - number: '2.2'
        title: 'Market Sizing: Macro Healthcare Spend, Enterprise AI TAM, and Addressable Segments'
        blocks:
          - type: paragraph
            body: >-
              While the broader United States healthcare economy represents a massive $4.9 trillion macro expenditure
              base, software spending accounts for only 12% of this total, demonstrating that top-line healthcare
              figures do not represent realistic software addressability. Rigorous market sizing must constrain this
              opportunity to enterprise software budgets where buyers demonstrate verifiable purchasing velocity.
              Enterprise healthcare AI spending hit $1.4 billion in 2025, nearly tripling 2024 investment levels and
              outpacing all other vertical enterprise software sectors. Care delivery and provider organizations
              represent a $378 million serviceable addressable market, led by 27% adoption among health systems.
              However, commercial payer adoption remains lower at 14%, reflecting a serviceable obtainable market for
              payer workflow orchestration between $100 million and $150 million. Tala Health entered this landscape
              with a $100 million round at an implied $1.2 billion valuation, placing it among eight healthcare AI
              unicorns despite having no disclosed commercial revenue.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM015
          - type: figure
