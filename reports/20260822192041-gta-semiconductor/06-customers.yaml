- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and the strongest named customer proof
  body: >-
    The cleanest public customer proof comes from named relationship milestones. In January 2023 GTA and Geely Technology signed a strategic cooperation agreement covering automotive-grade chip R&D, manufacturing, market application, and talent development; independent coverage adds that the partnership contemplated a CIDM alliance and joint laboratory around MCU, power devices, SoC, and PMIC. In November 2023 GTA and Zhongqi Chuangzhi moved from collaboration language into first-batch delivery language: independent sources describe strategic cooperation plus delivery of the first self-developed 1200V 20mΩ SiC MOSFET, explicitly tied to new-energy vehicle main-drive inverter and onboard power applications. In April 2026 GTA announced a project cooperation agreement with Infineon around embedded non-volatile memory and specialty-process capability upgrades at a seminar attended by more than 260 industry partners.


    These three cases matter for different reasons. Geely proves buyer relevance inside a major Chinese auto ecosystem. Zhongqi provides the strongest production-adjacent evidence because it includes actual product handoff and future roadmap cooperation. Infineon provides the highest-profile ecosystem validation, even if public disclosure is still partnership-oriented rather than commercial-volume oriented. Together they show that GTA is not relying only on abstract application claims. It has real named relationships across domestic auto, domestic SiC / virtual-IDM programs, and a global power-semiconductor leader.


    But the adoption record is still milestone-heavy. Public sources rarely disclose active customer counts, annual wafer volumes by account, production duration, renewal status, or expansion economics. Even where third-party media list additional names such as BYD Semiconductor, CRRC, State Grid, StarPower, Nexperia, Semtech, or Shanghai Belling, the evidence quality is weaker than for the Geely, Zhongqi, and Infineon cases. Investors should therefore treat the named roster as meaningful proof of customer pull, but not yet as proof of diversified recurring revenue.
