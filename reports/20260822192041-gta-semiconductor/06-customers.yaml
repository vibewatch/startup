- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Current evidence
  - Impact
  - Diligence path
  rows:
  - - One-stop subsystem attachment
    - 2026 seminar frames memory + control + drive + power platform
    - Could increase share of wallet within one customer program
    - Request revenue by customer across process families and subsystem content
  - - Shanghai localization and policy support
    - Local government and major-project context support automotive-chip ecosystem buildout
    - Can improve local buyer adoption and procurement comfort
    - Request pipeline split between policy-linked domestic accounts and commercial pull
  - - Automotive concentration
    - Public proof is heaviest in auto, SiC, and power use cases
    - A small number of anchor accounts may drive utilization
    - Request top-1, top-5, and top-10 customer share of revenue and wafers
  - - Anchor-account dependence
    - External reports repeatedly foreground Infineon and sometimes BYD-like anchors
    - Loss or delay of one major account could hit fab loading materially
    - Reconcile public partner claims with signed volume agreements
  - - Metric opacity
    - No public renewals, churn, or customer economics
    - Makes quality of customer base hard to underwrite
    - Request cohort dashboards, program status ladder, and aging of pipeline
  notes: Expansion logic is plausible, but concentration risk remains the key counterweight.
