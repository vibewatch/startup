- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - company solution
  - measurable benefit
  - limitation
  rows:
  - - Prototype specialty IC or PMIC quickly
    - Coordinate design, mask shop, fab, and shuttle manually
    - Mask turnkey plus MPW on selected BCD / HV CMOS platforms
    - Faster launch and lower upfront mask-sharing cost
    - Only certain process platforms are publicly listed for MPW
  - - Manufacture automotive control / power silicon
    - Qualify foundry and process against strict automotive requirements
    - Automotive-qualified fabs and specialty processes
    - Potentially lower localization risk and better fit for auto power/control
    - Qualification proof is described, not fully quantified publicly
  - - Integrate storage, control, drive, and power functions
    - Assemble multiple process capabilities across vendors
    - Solution-foundry roadmap combining memory and power/control blocks
    - Potential architectural simplification and partner consolidation
    - Commercial attachment model remains opaque
  - - Support industrial and energy power applications
    - Source mature-node power processes with reliability controls
    - Specialty power, discrete, and rail/new-energy applications support
    - Broader utilization and end-market adjacency
    - No public revenue mix or case studies by application
  notes: Customer workflow evidence is strongest for mask/MPW and automotive power use cases; it is weaker for monetization of the broader solution-foundry promise.
