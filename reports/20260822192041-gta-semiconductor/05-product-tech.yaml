- id: section-architecture
  title: 'Architecture and operating model: logic, power, discrete, mask, fab, and process-control layers'
  body: >-
    The public architecture is layered. At the front end, GTA's logic-technology page says the company has 90nm-to-28nm logic capability through technology licensing and independent development, and that the platform can incorporate BCD, HVCMOS, MCU, CIS, and eNVM. The same page gives more concrete detail for the 40nm and 65/55nm layers, including core voltages, threshold options, low-k dielectric, copper back-end integration, and specific automotive / power-management targets. On the specialty side, GTA's power and discrete pages position the platform around automotive power management, IGBT, MOSFET, SiC, BCD, and related mature-node analog and power devices.


    The manufacturing workflow wraps around those process layers. Fab-information pages show a multi-fab footprint across Lingang and Xuhui. Mask services add turnkey mask procurement, MPW shuttle programs, supplier audit requirements, secure data transmission, and access-control systems. In practice, this means the delivered 'product' is a chain: customer design requirements -> process selection -> mask / MPW support -> qualified fab execution -> application-specific wafer output.


    Roadmap evidence suggests the architecture is expanding in capability, not just scale. The 12-inch automotive-chip pilot line, the 2024 110nm ferroelectric memory announcement, and the 2026 seminar's storage roadmap (eFlash, SONOS, RRAM) imply that GTA is trying to make its platform more integrated and more defensible at the process-and-module level. The key public limitation is that there is no open PDK, no detailed design-rule download portal, and no public yield dataset, so architecture maturity must be inferred from descriptive pages and milestone announcements rather than audited operating data.
