chapter:
  number: 5
  title: Product & Technology
  summary: GTA Semiconductor's 'product' is a specialty-process manufacturing platform rather than a branded chip catalogue. Public evidence supports a broad stack spanning 90nm-28nm logic, BCD and HVCMOS power processes, discrete devices such as IGBT/MOSFET/SiC, mask-turnkey and MPW services, automotive-grade quality systems, and an emerging solution-foundry narrative that adds memory, control, drive, and power integration. The platform looks mature in core automotive/power manufacturing and quality workflows, but public disclosures remain thin on detailed PDKs, yield, field reliability, and customer-specific performance.
sections:
- id: section-definition
  title: What GTA actually delivers in customer-workflow terms
  body: >-
    GTA does not mainly sell a branded end-chip catalogue. In customer-workflow terms, it sells manufacturing capability: process platforms, mask and MPW services, fab capacity, automotive-grade quality systems, and increasingly a 'solution foundry' layer intended to help customers combine storage, control, drive, and power functions on qualified specialty processes. The official technology surfaces show two broad product families. First is the logic and specialty-process stack, which reaches from 90nm to 28nm and incorporates BCD, HVCMOS, MCU, CIS, and eNVM-related options. Second is the discrete and power stack, which supports applications such as automotive electronics, power management, new-energy inverters, OBC, DC-DC, and industrial control.


    This matters because the product definition determines every later diligence judgment. A buyer does not come to GTA for a finished EV inverter or packaged PMIC; the buyer comes with a device, platform, or process need and uses GTA to convert that need into qualified wafers. The mask-turnkey and MPW offerings make that workflow more concrete by showing how a customer can move from tape-out and process selection into prototype or shuttle manufacturing under GTA's control.


    The product boundary is therefore service-like but deeply technical. It includes fabs, process IP, supplier orchestration, IP-protected data handling, and quality systems, not just silicon layers. That is why architecture, trust controls, and people systems belong inside the product chapter rather than as adjacent operational detail.
