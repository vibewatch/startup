tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - module/asset/product line
  - user
  - status/maturity
  - differentiation
  - diligence gap
  rows:
  - - Logic technology (90nm-28nm)
    - Chip design teams needing logic + specialty integration
    - Publicly described; maturity mixed by node
    - Combines logic with BCD, HVCMOS, MCU, CIS, and eNVM options
    - No public PDK, yield, or node-by-node production volumes
  - - Specialty power / BCD platform
    - Automotive and industrial power designers
    - Core and mature
    - Automotive power-management relevance and integration with other specialty modules
    - No public device-level performance benchmarks or design-win list
  - - Discrete devices (IGBT / MOSFET / SiC)
    - Power-module and inverter-related designers
    - Core and mature in positioning; exact scale undisclosed
    - Aligns with EV and industrial electrification demand
    - No public wafer output by device family or field-reliability data
  - - Mask turnkey + MPW services
    - Prototype and shuttle customers
    - Operationally disclosed
    - Helps rapid launch, cost reduction, and IP-controlled tape-out flow
    - No public MPW volumes, cadence, or customer case studies
  - - 12-inch auto-chip pilot line
    - Automotive and MCU/control-related customers
    - Pilot line built and disclosed in 2023
    - Signals 12-inch auto-specific manufacturing capability
    - No current utilization or yield disclosure
  - - Embedded memory roadmap (eFlash / SONOS / RRAM / FeRAM)
    - Customers needing integrated storage in specialty nodes
    - Partly commercial, partly roadmap
    - Adds solution-foundry stickiness beyond plain wafers
    - No public customer adoption or revenue share disclosure
  notes: This matrix treats fabs, services, and process modules as product assets because GTA sells a manufacturing platform rather than a consumer-facing SKU set.
