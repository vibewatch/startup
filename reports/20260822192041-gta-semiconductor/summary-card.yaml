  topStrengths:
    - >-
      Strategic scarcity is real: China’s automotive, power, and mature-node localization goals create room for a scaled
      specialty foundry with auto-grade process credibility.
    - >-
      Official product breadth is meaningful across automotive power, discrete devices, logic, mask / MPW services, and
      an emerging one-stop memory + control + drive + power narrative.
    - >-
      Named customer and partner proof exists through Geely, Zhongqi Chuangzhi, and Infineon, which is stronger than a
      purely conceptual industrial story.
    - >-
      Public comps show that auto / power / specialty semiconductor platforms can support large valuations once
      economics and disclosure mature.
  topRisks:
    - >-
      Public revenue, gross margin, utilization, and customer-concentration denominators remain too weak to cleanly
      underwrite the rumored current private valuation.
    - >-
      The model is highly capital intensive, so further financing and dilution risk can impair returns even if the
      technology and market thesis are directionally correct.
    - >-
      Anchor-customer concentration and underutilization are the two fastest ways to damage equity value for a private
      foundry asset like GTA.
    - >-
      Auto-grade execution risk is severe: quality misses, safety or environmental incidents, or ramp delays would
      undermine both trust and economics.
    - >-
      Geopolitical, legal, and policy sensitivity create exogenous downside channels that may not be visible in standard
      bottom-up models.
  unresolvedGaps:
    - >-
      Full cap-table and preference-stack terms, including liquidation preferences, anti-dilution, debt, guarantees, and
      investor-side protections.
    - Audited revenue, gross margin, and utilization by fab, node, and specialty line.
    - Customer concentration, repeat-order behavior, anchor-program stage, and renewal / pipeline depth.
    - >-
      Quality, safety, environmental, and major customer-audit history needed to verify whether official control systems
      are translating into durable operating outcomes.
