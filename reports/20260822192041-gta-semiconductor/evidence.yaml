evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, voting rights, and shareholder percentages after the December 2025 changes.
    whyItMatters: >-
      Without the control map, investors cannot assess whether GTA is commercially autonomous or tightly steered by
      state or parent-company interests.
    diligencePath: Obtain the latest cap table, board roster, and shareholder agreement package during management diligence.
    relatedQuestionRefs:
      - QO005
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: latest-funding-terms
    missingEvidence: Cash amount, price per share, implied post-money valuation, and any secondary sellers for the December 2025 event.
    whyItMatters: >-
      The latest mark is central to valuation underwriting and determines whether the reported US$4B+ range is real or
      only inferred.
    diligencePath: Request the December 2025 term sheet, registry filing attachments, and updated investor schedule.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Revenue, gross margin, EBITDA or net loss, capex burden, backlog quality, and customer concentration.
    whyItMatters: >-
      The company is already large and capital intensive, so a valuation decision without operating metrics would be
      guesswork.
    diligencePath: >-
      Request audited financial statements, monthly operating KPIs, and top-customer revenue concentration for
      2024-2026.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: founder-lineage
    missingEvidence: >-
      Primary-source documentation of GTA's founding structure, legacy-asset transfers, and Zhang Rujing's formal role
      boundaries.
    whyItMatters: The origin story affects how investors interpret culture, IP lineage, and management continuity.
    diligencePath: >-
      Request incorporation-history documents, transaction records for legacy fab integration, and an official
      leadership biography pack.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO004
  - type: missing-source
    severity: material
    topic: gtasemi-market-share
    missingEvidence: No public source reviewed quantifies GTA's actual share of China's automotive-power or SiC foundry market.
    whyItMatters: >-
      Without a direct share measure, TAM/SAM growth does not automatically translate into company-level competitive
      position.
    diligencePath: Request customer/wafer share by process family, automotive program counts, and revenue mix by end market.
    relatedQuestionRefs:
      - QM021
      - QM025
  - type: conflicting-data
    severity: material
    topic: tam-methodology
    missingEvidence: >-
      A foundry-specific China auto/power/SiC market estimate that cleanly separates manufacturing spend from
      integrated-device and fabless revenue.
    whyItMatters: >-
      Current public estimates aggregate incompatible layers of the value chain, which can overstate or understate GTA's
      reachable market.
    diligencePath: >-
      Build a bottom-up wafer-demand model from customer programs, voltage classes, and qualified-node demand rather
      than relying on syndicated TAMs.
    relatedQuestionRefs:
      - QM005
      - QM007
      - QM021
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: design-win-funnel
    missingEvidence: >-
      Internal data on GTA's design-win funnel, qualification backlog, PPAP cycle times, and conversion from pilot to
      SOP.
    whyItMatters: >-
      Automotive qualification gates create timing risk between capacity build-out and monetization, and public market
      growth data cannot resolve that conversion.
    diligencePath: Request pipeline data by customer, process family, qualification stage, and expected SOP timing.
    relatedQuestionRefs:
      - QM015
      - QM016
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: missing-source
    severity: material
    topic: gtasemi-pricing-and-share
    missingEvidence: >-
      No public source reviewed discloses GTA's wafer pricing bands, gross margins, customer share, or competitive
      win/loss data against named peers.
    whyItMatters: >-
      Without pricing and share data, public competitor ranking is based on capability and disclosure surfaces rather
      than commercial outcomes.
    diligencePath: Request anonymized price corridors, gross-margin by process family, and win/loss records for auto-power programs.
    relatedQuestionRefs:
      - QP009
      - QP020
      - QP024
  - type: private-evidence-only
    severity: material
    topic: qualification-depth
    missingEvidence: >-
      Public pages mention automotive credentials but do not provide comparative ppm data, audit findings, or customer
      qualification-cycle durations across the peer set.
    whyItMatters: Automotive manufacturing trust is won on operating detail, not just certificate badges.
    diligencePath: >-
      Request VDA / customer audit summaries, field-failure metrics, qualification lead times, and requalification
      history.
    relatedQuestionRefs:
      - QP004
      - QP012
      - QP019
  - type: conflicting-data
    severity: moderate
    topic: capacity-risk
    missingEvidence: >-
      Independent experts disagree on whether Chinese mature-node expansion is a global overcapacity threat or a largely
      absorbable domestic buildout.
    whyItMatters: The answer materially changes whether GTA's new capacity is a moat amplifier or a margin risk.
    diligencePath: >-
      Model downside utilization using customer pipeline data, subsidy dependence, and peer pricing behavior instead of
      relying on macro commentary alone.
    relatedQuestionRefs:
      - QP018
      - QP022
      - QP025
  - type: missing-source
    severity: material
    topic: gtasemi-operating-financials
    missingEvidence: >-
      No public GTA source reviewed disclosed revenue, gross margin, operating cash flow, free cash flow, or EBITDA-like
      metrics.
    whyItMatters: >-
      Without operating financials, investors cannot assess revenue quality, operating leverage, or path to
      self-funding.
    diligencePath: Request monthly and annual P&L, segment mix, utilization history, and gross-margin bridge by process family.
    relatedQuestionRefs:
      - QI003
      - QI024
      - QI025
  - type: missing-source
    severity: material
    topic: gtasemi-capital-adequacy
    missingEvidence: >-
      No public source reviewed disclosed cash on hand, runway, debt covenants, committed capex, or subsidy/grant
      schedule.
    whyItMatters: >-
      Capital adequacy and next-round dependency are impossible to underwrite without current liquidity and obligation
      data.
    diligencePath: Request treasury summary, debt schedule, undrawn facilities, equipment purchase commitments, and grant terms.
    relatedQuestionRefs:
      - QI014
      - QI015
      - QI016
      - QI024
  - type: private-evidence-only
    severity: material
    topic: gtasemi-customer-economics
    missingEvidence: No public source reviewed disclosed top-customer concentration, customer advances, ASP, or contract structure.
