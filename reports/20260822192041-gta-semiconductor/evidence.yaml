      These are the variables that decide whether the company has premium automotive revenue or commodity foundry
      exposure.
    diligencePath: >-
      Request top-10 customer list, top-1/top-5 shares, advance-payment balances, ASP ranges, and program-specific
      pricing dynamics.
    relatedQuestionRefs:
      - QI004
