- id: scenario-logic-and-thesis-balance
  title: Bull, base, and bear cases hinge on utilization, concentration, and dilution
  body: >-
    The bull case is not hard to imagine. GTA could become one of the most valuable specialty auto / power foundry assets in China if it fills a large portion of planned capacity with sticky auto-grade programs, keeps quality intact, broadens one-stop attachment across memory, control, drive, and power, and avoids punitive financing terms. In that world, the current private mark could prove conservative rather than aggressive.


    The base case is more sober. It assumes the strategic story is broadly right, but that execution remains uneven, customer concentration remains meaningful, and capital intensity keeps the equity story from compounding cleanly. That scenario justifies a valuation range roughly around or slightly below recent private marks. It does not imply disaster; it implies that current investors need either attractive entry terms or strong confidence in private metrics.


    The bear case is not about technology failure alone. It is about the foundry model turning against equity holders: slower loading, price pressure from mature-node competition, heavier-than-expected dilution, a slip in anchor-customer demand, or a safety / geopolitical event that damages trust. Because the fixed-cost base is large, downside can materialize quickly even when the strategic narrative remains directionally compelling.
