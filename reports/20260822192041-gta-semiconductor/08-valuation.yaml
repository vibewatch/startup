- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table / preferences
    - Liquidation stack, anti-dilution, investor rights, debt, or side letters
    - Private structure can dominate common-equity outcomes
    - Lead investor / counsel review
  - - Revenue and gross margin
    - Audited revenue by fab / process / customer segment and gross-margin bridge
    - Need denominator for any serious valuation method
    - Finance diligence + audit package
  - - Utilization by line
    - Loading, yield ramp, and cost absorption on 8-inch, 12-inch, and SiC lines
    - Master driver of equity value for a foundry
    - Operations diligence
  - - Customer concentration
    - Top-1 / top-5 share, anchor-program stage, renewal outlook
    - Concentration can make current mark fragile
    - Commercial diligence
  - - Incident and quality history
    - Safety, environmental, audit, and major customer-quality events
    - Trust failures would compress valuation fast
    - EHS / quality diligence
  - - Policy and geopolitical exposure
    - Equipment, export-control, travel, and partner sensitivity map
    - Exogenous shocks may matter more than bottom-up models assume
    - Legal + geopolitical diligence
  notes: If these asks are answered well, recommendation can upgrade quickly; if not, price must do the work.
