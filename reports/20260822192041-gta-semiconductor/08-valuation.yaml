- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Major safety / environmental incident
    - Serious incident, regulator action, or prolonged output halt
    - Breaks trust and threatens auto-grade credibility
    - Immediate negative re-underwrite / potential pass
  - - Anchor-customer shock
    - Flagship program pause, volume cut, or lost design win
    - Hits loading, moat, and narrative at once
    - Raise discount rate or exit
  - - Financing stress
    - Punitive new round, heavy dilution, or delayed capex buildout
    - Weakens return path even if core asset is real
    - Re-cut valuation range downward
  - - Underutilization / margin disappointment
    - Persistent weak loading or low economic conversion on new lines
    - Turns strategic scarcity into weak equity economics
    - Move from track to pass unless price resets
  - - Geopolitical / legal escalation
    - Event materially affecting equipment access, talent mobility, or partner trust
    - Adds exogenous risk outside management control
    - Treat as thesis-break unless compensated by price
  notes: These are the fastest ways for a strategically attractive asset to become a poor investment.
