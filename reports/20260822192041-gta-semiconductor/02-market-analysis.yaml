callouts:
  - calloutType: insight
    title: "The right TAM is layered, not maximalist"
    body: >-
      GTA should not be valued against the whole semiconductor industry. The useful frame is automotive semiconductors,
      then power electronics, then automotive-grade SiC and mature-node control/power foundry demand where GTA's process
      mix is actually relevant.
    claimRefs:
      - CM001
      - CM006
      - CM017
      - CM034

  - calloutType: strength
    title: "Localization tailwinds are real"
    body: >-
      Chinese auto-chip substitution remained low enough in 2023 to imply significant localization headroom, while
      Shanghai and Lingang continue funding and prioritizing the exact categories of automotive, specialty-process, and
      SiC capacity GTA is building.
    claimRefs:
      - CM026
      - CM027

  - calloutType: risk
    title: "Market growth does not guarantee pricing power"
    body: >-
      The same China buildout that creates room for domestic share gains also risks mature-node oversupply and margin
      compression. GTA's challenge is turning a large market into qualified, profitable utilization.
    claimRefs:
      - CM024
      - CM025
      - CM038

