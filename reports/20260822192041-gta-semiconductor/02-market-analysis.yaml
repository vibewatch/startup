  - id: section-buyers-adoption
    title: Buyers, users, payers, and the automotive adoption path
    body: >-
      The buyer stack in GTA's market is multilayered. At the top are OEM platform engineering, powertrain, ADAS, and
      vehicle-electronics teams that set qualification requirements and platform roadmaps. Tier-one suppliers then own a
      large share of the practical integration work through traction inverters, onboard chargers, BMS, power modules,
      domain controllers, and safety systems. Future Market Insights and Coherent both emphasize OEM and tier-one
      control over semiconductor selection, while onsemi's traction-inverter materials show how supplier relationships
      extend into module architecture, bare-die packaging, and customization support rather than pure component selling.

      Qualification is the central adoption friction. Future Market Insights flags long qualification cycles as a direct
      market restraint, and UTMEL's AEC-Q100 sourcing guide explains why: automotive buyers rely on part-specific
      qualification evidence, temperature-grade suitability, and PPAP documentation rather than generic claims. That
      means switching suppliers is expensive and slow, especially for powertrain and safety-critical nodes. For GTA,
      this is strategically important because it cuts both ways: new entrants cannot quickly displace a qualified foundry,
      but GTA also cannot win high-value programs simply by adding capacity.

      The value-chain map therefore runs from materials and process technology to foundry capacity, then to chip design
      houses and module makers, and finally to OEM platforms and fleet or end-vehicle deployment. The payers are usually
      OEMs or tier-ones, but the economic trigger is downstream: better range, faster charging, higher reliability,
      lower system size, and supply assurance. Infineon, ST, and onsemi all market SiC around these system-level
      benefits, which is exactly the language a foundry like GTA has to satisfy if it wants premium automotive mix.
    claimRefs:
      - CM004
      - CM014
      - CM015
      - CM016
      - CM019
      - CM020
      - CM021
      - CM022
      - CM032
      - CM033
      - CM036
