  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：战略上可信，但价格纪律比欣赏更重要
        blocks:
          - type: paragraph
            body: >-
              喜欢 GTA 这家公司很容易；在任何价格上立刻出手则没那么容易。前文已经建立起一条连贯的战略 叙事：中国汽车和功率半导体需求庞大，成熟制程国产化有政策支持，GTA 的特色工艺宽度可见，
              具名客户证据存在，公司也融到足够资本，足以成为严肃玩家。这些事实解释了为什么后期私募估值 爬升到约低至中个位数十亿美元水平。但它们本身不能证明当前价格对财务投资人有吸引力。


              公开材料仍缺少从欣赏走向确信所需的核心分母：收入、毛利率、按产线拆分的利用率、重复客户 经济性、按账户拆分的集中度，以及真实的优先股堆叠。资本密集型晶圆代工尤其如此，因为股权
              回报高度依赖装载率、利润率稳定性和稀释纪律。换句话说，GTA 可能已经配得上战略稀缺性溢价， 但公开证据太薄，无法证明在传闻估值下，投资人已因集中、资本开支和执行风险获得足够补偿。


              因此，我的建议是观察 / 继续研究，而不是买入或放弃。这不是对资产的负面判断，而是说价格敏感 和证据敏感应主导决策。若私人尽调显示产线负荷强、经济性干净、优先权结构可控且锚定客户有韧性，
              投资案例可以迅速改善。若非如此，当前估值留下的容错空间就低于公开材料所能支撑的水平。
