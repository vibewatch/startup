  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Hua Hong / HHGrace
        - 中国直接同业
        - 公开双重上市晶圆代工厂；8 英寸 + 12 英寸策略
        - 中国特色 IC、功率分立器件、汽车、NEV
        - 在特色 IC + 功率分立器件框架下，最接近的中国公开可比公司
        - 不如 GTA 那样明显聚焦汽车；特色工艺覆盖更宽
      - - SMIC
        - 中国既有综合晶圆代工厂
        - 公开排名中中国最大的纯晶圆代工厂
        - 汽车叠加广泛主流晶圆代工需求
        - 规模、国家冠军地位、汽车服务资质
        - 范围宽于 GTA；不是狭义特色功率同业
      - - UMC
        - 全球规模基准
        - 12 座晶圆厂；每月 400,000+ 片 12 英寸等效晶圆；2025 年收入 US$7.6bn
        - 逻辑、eHV、eNVM、RF-SOI、BCD、汽车 IC
        - 大规模多元化产能布局和 IATF 覆盖
        - 特色功率定位不如 VIS/Tower/X-FAB 集中
      - - VIS
        - 特色模拟 / 功率基准
        - 公开上市特色晶圆代工厂；Fortune 提到其与 NXP 的 VSMC 扩产
        - BCD、UHV、SOI、汽车与工业功率
        - 特色功率技术栈和汽车服务项目非常明确
        - 8 英寸特色工艺集中度高，可能限制直接规模对比
      - - Tower Semiconductor
        - 特色模拟 / 功率基准
        - 全球特色晶圆代工厂，拥有多地功率平台
        - 汽车模拟、电源管理、成像、传感
        - 65/180nm BCD 至 700V，以及三座工厂保障连续供货的卖点
        - 在国产替代场景下，中国政策一致性较弱
      - - X-FAB
        - 以汽车为中心的特色晶圆代工厂
        - 6 座晶圆厂；约 4,500 名员工；巴黎上市
        - 汽车、工业、医疗、MEMS、SiC/GaN
        - 汽车质量体系扎实，并支持 SiC/GaN 工艺
        - 全球规模小于 UMC/GF；产能不在中国
      - - GlobalFoundries
        - 全球既有替代方
        - 据 Fortune 概述，三大洲有 14 个基地
        - 差异化关键芯片、汽车、功率、工业
        - AutoPro、BCD 双源制造、长生命周期支持
        - 公司重心宽于 GTA 的特色汽车定位
      - - onsemi、Infineon 与 ST
        - 相邻 IDM 替代方
        - 大型上市 IDM，拥有汽车和 SiC 产品组合
        - OEM 和 Tier-1 动力总成、逆变器、BMS、功率模块
        - 可用通过认证的器件加应用支持解决买方需求
        - 并非每家设计公司都能用它们直接替代纯晶圆代工
    notes: 各行混合了直接晶圆代工同业和相邻替代方，因为买方可以通过两条路径解决同一项汽车功率任务。
