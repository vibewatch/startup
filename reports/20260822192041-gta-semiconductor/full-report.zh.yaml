      - number: '8.4'
        title: 最终尽调问题和退出准备度让它成为应跟踪而非抢跑的标的
        blocks:
          - type: paragraph
            body: >-
              从尽调角度看，通向更强建议的路径很清楚。投资人需要股权结构表、优先股堆叠、经审计收入和 毛利率、产线级利用率、客户集中度、重复订单行为、事故历史，以及围绕 Infineon 的工作、围绕 Geely 的工作和
              Zhongqi 关联 SiC 项目等旗舰项目的当前阶段。没有这些项目，估值就会过度依赖叙事。


              从公开证据看，退出准备度也不完整。GTA 可能成长为 IPO 规模企业，但今天的公开材料还没有显示 经审计透明度或经济性，足以让外部投资人承销一次干净的近期上市退出。战略退出逻辑存在，因为
              汽车和功率半导体资产有价值；但中国的战略结果可能受政策影响，也未必为少数财务持有人最大化 价格。


              正确投资姿态是有准备地耐心等待。把公司留在名单上，但不要放弃尽调纪律。机会可以因为证据更好 或价格更好而变得更有吸引力。理想情况下，投资人希望两者兼得。
