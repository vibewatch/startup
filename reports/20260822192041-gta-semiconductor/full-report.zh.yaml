  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 中国直接同业：特色汽车和功率代工厂，而非无晶圆厂模拟芯片品牌
        blocks:
          - type: paragraph
            body: >-
              GTA 的直接竞争范围比普通创业数据库暗示的更窄。公司把自己定位为聚焦汽车的制造代工厂，并披露
              BCD、IGBT、MOSFET、SiC、嵌入式存储和混合信号工艺能力。因此，最接近的可比类别是销售汽车和功率制造产能的特色晶圆代工厂，而不是 Texas Instruments 或 Renesas
              这类封装芯片层面的品牌模拟厂商。CB Insights 和 PitchBook 都把 GTA 放在制造 / 半导体公司框架下；GTA 自己在 2026
              年研讨会上的表述则进一步指向围绕存储、控制、驱动和功率集成构建的解决方案型代工模式。


              在中国国内，华虹看起来是最接近的上市可比。HHGrace 明确称自己是全球领先纯晶圆代工厂，采用「8 英寸 + 12 英寸」加「特色 IC +
              功率分立」战略，并表示质量控制体系满足严格的汽车芯片制造要求。SMIC 也相关，但它是更宽口径的国家级纯晶圆代工厂，而不是特色汽车纯玩家：其汽车服务页面强调 IATF 16949、AEC-Q100 和 VDA
              6.3 认可，但公开描述仍把它放在更广的主流代工类别里。对重视本地汽车芯片替代和政策一致采购的中国客户来说，GTA、华虹和 SMIC 构成最实际的国内候选名单。


              国内机会真实存在，因为 Reuters 报道称 2023 年中国汽车芯片国产化率仍低于 10%。但同一政策推动也意味着，多家中国晶圆厂正在围绕重叠的功率、MCU 和汽车类别扩张。因此，最重要的问题不是 GTA
              是否有同业——显然有——而是其国内工艺组合、车规认证和生态定位是否足够强，能否避免沦为又一个成熟节点产能选项。
