      - number: '6.2'
        title: 采用轨迹和最强的具名客户证据
        blocks:
          - type: paragraph
            body: >-
              最干净的公开客户证据来自具名关系里程碑。2023 年 1 月，GTA 与 Geely Technology 签署战略 合作协议，覆盖车规芯片研发、制造、市场应用和人才培养；独立报道补充称，双方还考虑围绕
              MCU、功率器件、SoC 和 PMIC 建立 CIDM 联盟与联合实验室。2023 年 11 月，GTA 与 Zhongqi Chuangzhi 从合作表述推进到首批交付表述：独立来源描述了战略合作，以及首颗自研
              1200V 20mΩ SiC MOSFET 的交付，并明确对应新能源汽车主驱逆变器和车载电源应用。2026 年 4 月，GTA 在一场超过 260 家产业伙伴出席的研讨会上宣布，与 Infineon
              围绕嵌入式非易失性存储和特色 工艺能力升级签署项目合作协议。


              这三个案例各自重要。Geely 证明 GTA 切进了中国大型汽车生态。Zhongqi 提供了最接近量产的 证据，因为它包含实际产品交付和后续路线图合作。Infineon 带来最高知名度的生态验证，尽管
              公开披露仍偏伙伴关系，而不是商业规模。合在一起看，GTA 并不只依赖抽象应用主张；它在国内 汽车、国内 SiC / 虚拟 IDM 项目和全球功率半导体龙头之间，都有真实具名关系。


              但采用记录仍以里程碑为主。公开来源很少披露活跃客户数、按账户拆分的年度晶圆量、生产时长、 续约状态或扩张经济性。即使第三方媒体列出 BYD Semiconductor、CRRC、State
              Grid、StarPower、 Nexperia、Semtech 或 Shanghai Belling 等其他名字，证据质量也弱于 Geely、Zhongqi 和 Infineon
              三个案例。因此，投资人应把具名名单视为客户拉力的有意义证据，但还不能把它视为 多元化经常性收入的证明。
