  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: GTA 在客户工作流里实际交付什么
        blocks:
          - type: paragraph
            body: >-
              GTA 主要销售的不是自有品牌终端芯片目录。从客户工作流看，它卖的是制造能力：工艺平台、掩膜和 MPW
              服务、晶圆厂产能、车规质量体系，以及一个日益强化的「解决方案型代工」层，帮助客户在合格特色工艺上组合存储、控制、驱动和功率功能。官方技术界面显示两大产品家族。第一是逻辑和特色工艺栈，从 90nm 延伸到
              28nm，并包含 BCD、HVCMOS、MCU、CIS 和 eNVM 相关选项。第二是分立器件和功率栈，支持汽车电子、电源管理、新能源逆变器、OBC、DC-DC 和工业控制等应用。


              这一点重要，因为产品定义决定了后续所有尽调判断。买方找 GTA，不是为了采购成品 EV 逆变器或封装 PMIC；买方带着器件、平台或工艺需求来，让 GTA 把需求转化成合格晶圆。掩膜全流程和 MPW
              服务让这个工作流更具体：客户可以从流片和工艺选择，推进到由 GTA 控制的原型或穿梭片制造。


              因此，产品边界像服务，但技术属性很深。它包括晶圆厂、工艺 IP、供应商编排、受 IP 保护的数据处理和质量体系，而不只是硅层。这也是为什么架构、信任控制和人员体系应放在产品章节内部，而不是作为相邻运营细节处理。
