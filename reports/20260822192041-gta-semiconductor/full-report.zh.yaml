      - number: '1.2'
        title: 公开领导层、治理可见度和机构属性
        blocks:
          - type: paragraph
            body: >-
              以风险投资阶段公司标准看，GTA 公开领导层信息呈现出很强的机构色彩。本章最强的一手来源是公司网站 2026 年 1
              月的工作会议文章，文中点名华大半导体董事长孙杰作战略讲话，杨昆为党委书记兼总经理，徐燕为党委副书记并主持会议，童小丽为总会计师，邓红兵为纪检负责人。第一财经另称徐燕为副总经理、上海市人大代表，进一步说明公司进入了上海人才和产业政策讨论场景。

              同样重要的是公开信息没有披露什么。本章查阅的官方英文页面没有发布完整董事会名单、独立董事、投票权安排或创始人传记页。第三方中文媒体常把公司描述为由华大半导体联合其他上海国资关联主体发起；一篇 2025 年 12
              月文章还称公司整合了承袭自上海先进半导体的团队和技术基础。PitchBook 也记录了 2019 年对 Advanced Semiconductor Manufacturing Corp.
              的收购。合起来看，公开记录指向的是一个有国资支持、带传统制造根基的产业平台，而不是带有清晰创始人品牌和透明风险投资式领导页的常规创业公司。

              这种机构结构有战略价值：它让 GTA 更容易对接政策支持和资本。但它也留下治理尽调缺口。公开来源没有说明准确股权比例、董事会控制权，也没有说明 2025 年 12
              月的人事调整是否改变了治理影响力。公司已经达到数十亿美元私有市场规模，却仍在财务上不透明，这本身就是实质性尽调问题。
