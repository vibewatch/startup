      - number: '8.3'
        title: 公开可比公司支撑战略稀缺性，但也暴露披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开可比公司集合有两面性。一方面，2026 年公开市场上的特色半导体和汽车 / 功率半导体公司 价值很高。市值参考显示，X-FAB 约 $0.90B，VIS 约 $8.94B，Tower 约 $25.15B，
              GlobalFoundries 约 $26.36B，UMC 约 $45.99B，ON Semiconductor 约 $28.89B， STMicroelectronics 约
              $45.12B。在这个背景下，GTA 约 $4.2-4.4B 的估值从绝对值看并不 离谱。它远低于主要公开同行，只高于最小的公开特色代工参考标的。


              另一方面，这些同行公开、经过审计、有流动性，市场也更了解它们。其中几家公司还拥有 更广的客户基础、更长运营历史、更清晰的收入和利润率披露，以及围绕优先股堆叠更少的谜团。
              一家财务披露稀少的中国私人特色晶圆代工厂，不能仅仅因为赛道具有战略价值，就自动享受类似 公开市场的倍数。因此，可比公司集合同时支持两个结论：第一，品类有价值；第二，在私人尽调 证明相反之前，GTA
              仍应因不透明、集中和融资风险承受折价。


              这就是为什么我把 VIS 和 X-FAB 视为比 UMC 或 ST 更有用的边界标尺。UMC、ST、ON Semiconductor、Tower 和 GlobalFoundries 验证了汽车 / 功率 /
              特色半导体终端市场的重要性， 但它们不是干净的一对一估值锚。正确问题不是 GTA 是否有朝一日能值数十亿美元。它大概率可以。 正确问题是，当前进入价格是否已经假设了过多未来。
            claimRefs:
