      - number: '2.2'
        title: 规模测算视角：汽车半导体、功率电子和车规 SiC
        blocks:
          - type: paragraph
            body: >-
              公开的 2026 年市场估算给出一组可用但不完美的视角。Future Market Insights 将 2026 年全球汽车半导体市场定为 US$76.0B，Coherent Market Insights
              则给出 US$83.84B。两个估算方向足够一致，可以把 2026 年广义汽车电子机会定义在高双位数十亿美元区间。FMI 还拆解了市场结构：乘用车占 2026 年需求的 62.7%，动力总成占应用需求的
              31.0%，OEM 渠道占销售渠道需求的 73.0%。与此同时，Coherent 称功率电子单独占 2026 年汽车半导体市场的 35.7%，这让 GTA 的功率定位更像核心，而不是边缘。

              更具体的 SiC 视角规模更小，但在战略上更接近 GTA 的差异化。Fortune Business Insights 估算，2026 年全球车规 SiC 组件市场为 US$8.24B，到 2034 年增至
              US$31.91B，CAGR 为 21.3%；亚太在 2025 年已占 76.14%。onsemi 的 SiC 生态文章从供应商侧提供了更宽的交叉验证，预计整体 SiC 可服务市场（不只汽车）将从 2021 年的
              US$2B 增至 2026 年的 US$6.5B。合起来看，GTA 的车规 SiC 切口增长很快，但规模仍明显小于更广义的汽车半导体市场。

              因此，最现实的自上而下视角是分层，而不是单一口径：汽车半导体定义宽口径 TAM；功率电子和成熟节点汽车控制类别定义更近的 SAM；中国 / 亚洲中心的车规 SiC 加成熟节点代工需求，定义最可能的 SOM
              走廊。相比引用整个半导体产业，这个框架对 GTA 更紧、更有用。
