      - number: '4.4'
        title: 财务结论：战略资产，但企业披露不足
        blocks:
          - type: paragraph
            body: >-
              即便没有完整模型，公开证据也支持一个清楚的定性结论。GTA
              看起来是一家战略重要性高、融资充足的半导体制造平台，其经济性大概率由传统晶圆代工变量决定：产能利用率、合格产品组合、定价纪律、折旧和资本通道。上行情景是，国内本土化、汽车认证和更宽的解决方案型代工服务，带来高价值、黏性收入。下行情景是，中国成熟节点过剩、价格压力和不透明客户经济性，让利润率和现金转化弱于投资者预期，并持续更久。


              缺失披露是实质问题，不是表面问题。没有收入、毛利率、现金、债务、在手订单、产能利用率和集中度数据，投资者无法有信心判断收入质量、经营杠杆或下一轮融资依赖。公开同业文件只能提供类比，不能替代公司自己的证据。


              结果是，今天承销 GTA 时，更像是在承销产业政策基础设施，而不是标准风险投资软件公司。它可能值得战略性信心，但仅靠公开数据，还不值得精确的财务信心。
