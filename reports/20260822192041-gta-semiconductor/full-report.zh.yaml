companyProfile:
  summary: >-
    GTA Semiconductor 是上海积塔半导体有限公司对外使用的英文品牌身份。这家公司总部位于上海，成立于 2017 年 11 月，定位为特色晶圆代工平台。公开来源把公司放在汽车电子、工业控制、部分高端消费 /
    混合信号场景，以及 BCD、IGBT、MOSFET、SiC、PMIC、控制器、MEMS 相关制造等功率器件领域。官方页面称，上海多个基地合计目标产能为每月 300,000 片 200mm
    等效晶圆，并希望搭建覆盖存储、控制、驱动和功率的一站式平台。公开融资来源显示，公司已获得数十亿美元融资，后期私有市场估值约处于几十亿美元低到中段；但经审计收入、利润率、客户集中度和股权经济条款仍披露不足。
  foundedDate: '2017-11-01'
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: 面向汽车、工业和功率芯片的特色工艺晶圆制造，包括 BCD、PMIC、控制器、IGBT、MOSFET、SiC、逻辑以及相关混合信号 / 特色工艺平台，并提供掩膜、MPW、质量和解决方案型代工支持。
  customerFocus: 需要合格特色工艺制造而非成品终端产品的汽车芯片公司、Tier 1 供应商、工业控制和功率器件设计商，以及部分混合信号 / 消费电子相邻芯片团队。
  businessModel: 资本密集型晶圆代工模式，靠特色工艺晶圆制造、产能、质量体系，以及面向有汽车和工业可靠性要求的客户，在存储、控制、驱动和功率功能上逐步扩展子系统绑定来变现。
