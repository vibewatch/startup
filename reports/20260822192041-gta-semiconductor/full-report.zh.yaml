      - number: '6.4'
        title: 扩张驱动、集中风险与平衡后的客户判断
        blocks:
          - type: paragraph
            body: >-
              扩张逻辑在战略上连贯。GTA 希望客户购买的不只是单一成熟制程。2026 年研讨会描述了一站式 平台，横跨存储、控制、驱动和功率。应用页面把这套平台连接到汽车电源管理系统、逆变器、
              充电器和工业控制。若这种附着模型跑通，扩张可以来自同一子系统内多个芯片的导入，也可以来自 同一汽车或工业平台内多个工艺家族的导入。上海政策支持和本地汽车生态又提供了第二条扩张路径， 因为它们鼓励本地化供应链采用。


              主要制衡因素是集中度。第三方报告反复把 Infineon 描述为格外重要的锚定关系，也提示 BYD Semiconductor 等其他大型汽车 / SiC 账户同样具有实质意义。即使这些具体集中度比例尚未得到
              充分佐证，风险形态对特色晶圆代工厂仍很直观：少数高价值合格项目可能主导产能利用和经济性。 同行文件也说明，代工客户集中度常见到足以严肃对待。例如，Hua Hong 披露其前五大客户在 2025 年贡献 34.2%
              销售收入。GTA 可能高于也可能低于这一水平，但在管理层证明相反之前，投资人 应假设集中度可能不低。


              因此，平衡后的判断是正面但带条件。GTA 在对其特色代工战略最关键的细分市场中似乎确有客户 拉力，具名证据也强过纯营销叙事。但公开记录仍未说明生产账户层面的客户基础到底有多分散、
              多耐久、多具经济价值。估值和投资判断中，集中度与不透明度折扣必须始终放在前台。
