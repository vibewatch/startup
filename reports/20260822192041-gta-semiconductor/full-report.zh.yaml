chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营模式、设施和产品范围
        blocks:
          - type: paragraph
            body: >-
              GTA Semiconductor 官方英文网站把公司描述为「专注汽车 IC 的领先制造代工厂之一」，这一定位也出现在 CB Insights、PitchBook、Craft
              和多篇中国行业文章中。这个表述很关键，因为部分创业数据库会笼统把公司写成半导体「制造商和开发商」，容易误读成无晶圆厂模拟芯片设计公司。本章核验的证据指向的是特色工艺代工 /
              制造平台：公司为合作伙伴制造微控制器、模拟 IC、分立功率器件、MEMS 和嵌入式非易失存储器，而不是主要销售自有品牌的大规模芯片目录。

              运营版图明显以上海为中心。官方公司页面把企业联系地址放在浦东 / 临港云水路 600
              号，并另行披露临港和徐汇的晶圆厂基地。英文概览提到两个制造设施，分别位于上海自贸区临港新片区和徐汇区。官方产能披露也显示，公司已经具备全国级规模：每月 70,000 片 150mm 晶圆、每月 120,000 片
              200mm 晶圆，以及在建每月 60,000 片 300mm 晶圆，合计约每月 300,000 片 200mm 等效晶圆。2023 年较早的第三方报道提到含在建产能在内每月 280,000
              片晶圆，与后续官方扩产方向一致。

              对一家私营公司而言，GTA 的产品和工艺覆盖很宽。官方技术页面覆盖 BCD、HVCMOS、双极型、嵌入式 NVM、IGBT、MOSFET、TVS、FRD、SiC 和 MEMS
              工艺家族，服务汽车、工业控制、能源和高端消费电子。因此，公司更接近成熟节点汽车 / 功率代工同业，而不是 TI 或 Renesas 这类无晶圆厂模拟芯片厂商，尽管 GTA
              工艺制造出来的终端产品会落在模拟和电源管理这些应用类别上。
