      - CV016
      - CV017
      - CV021
      - CV022
      - CV028
      - CV029
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: GTA 是私人公司、资本密集，经济性披露仍少；用宽区间比给点目标更诚实。
    approximationNotes: 情景区间是分析估计，不是市场报价。回报区间只为敏感性分析，假设当前私募估值约 $4.4B 作为参照。
    data:
      items:
        - label: 悲观情景估值
          low: 1.8
          mid: 2.4
          high: 3
          unit: $B
          description: 产能装载、利润率或稀释不及预期。
        - label: 基准情景估值
          low: 3.2
          mid: 3.8
          high: 4.5
          unit: $B
          description: 战略逻辑成立，但集中度和不透明度仍在。
        - label: 乐观情景估值
          low: 5
          mid: 6
          high: 7
          unit: $B
          description: 产能利用率、客户和经济性拿出强有力的私下证据。
        - label: 相对 $4.4B 参照的隐含 MOIC（悲观）
          low: 0.4
          mid: 0.5
          high: 0.7
          unit: x
          description: 若估值标记跑在证据前面，下行风险就会出现。
        - label: 相对 $4.4B 参照的隐含 MOIC（基准）
          low: 0.7
          mid: 0.9
          high: 1
          unit: x
          description: 没有显著上行，只是公允结果。
        - label: 相对 $4.4B 参照的隐含 MOIC（乐观）
          low: 1.1
          mid: 1.4
          high: 1.6
          unit: x
          description: 只有私下确认执行质量后，才有合理上行。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV019
      - CV021
      - CV022
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 公开材料在市场相关性上得分高，但对价格支撑、财务透明度和尽调准备度的支撑较弱。
    approximationNotes: 数值是基于引用主张的序数综合，不是管理层报告指标。
    data:
      items:
        - label: 市场顺风
          value: Strong
          detail: 中国汽车 / 功率本地化和 SiC 需求真实存在
          tone: positive
        - label: 产品可信度
          value: Moderate-Strong
          detail: 特色工艺宽度和质量体系看得见
          tone: positive
        - label: 客户证据
          value: Moderate
          detail: 已有具名关系，但经济性仍不透明
          tone: warning
        - label: 财务透明度
          value: Weak
          detail: 没有经审计的公开收入、利润率或产能利用率披露
          tone: risk
        - label: 价格支撑
          value: Weak-Moderate
          detail: 当前标记也许有道理，但公开材料没有证明
          tone: risk
        - label: 尽调准备度
          value: Incomplete
          detail: 需要股权结构表、集中度、产能利用率和事故数据
          tone: risk
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV019
      - CV020
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV040
