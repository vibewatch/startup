            title: 错误竞争框架会夸大或扭曲 GTA 的护城河
            body: 如果把 GTA 当成封装模拟芯片厂商，与 TI 或 Renesas 对比，分析就会错过真正的竞争。实际运营竞争主要发生在特色晶圆代工厂和车规制造平台之间。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP024
              - CP028
          - type: callout
            title: 认证是必要条件，但不再构成差异化
            body: 许多对手如今都在宣传 IATF、VDA 或零缺陷式叙事。GTA 仍需要客户证据、连续性证据和经济性，而不只是资质，才能把质量信号转化为护城河。
            calloutType: risk
            claimRefs:
              - CP018
              - CP026
              - CP034
              - CP038
          - type: callout
            title: GTA 最好的优势是区域匹配叠加生态野心
            body: 本土化顺风和 2026 年解决方案型代工叙事，让 GTA 在中国具备一套可能差异化的故事。当客户更重视本土供应、汽车功率相关性和共同开发，而不是全球多元化时，这个故事最强。
            calloutType: insight
            claimRefs:
