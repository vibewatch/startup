  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及 GTA 实际切入的需求
        blocks:
          - type: paragraph
            body: >-
              GTA 的市场边界必须谨慎划定，因为这家公司很容易被错分。公司自己的技术和应用页面显示，它通过 BCD、IGBT、MOSFET、SiC、MEMS、MCU
              相关逻辑和嵌入式存储等工艺平台，服务汽车电子、工业控制、能源和高端消费电子。因此，相关市场不是「所有半导体」，甚至也不是完整的品牌模拟芯片市场。GTA
              销售的是工艺产能和制造能力，买方看重车规可靠性、功率效率、电压等级和长期晶圆供应。

              最清楚应纳入的支出池包括汽车功率电子、汽车 MCU 和控制 IC、模拟与混合信号汽车器件、分立功率器件、车规 SiC、用于汽车或工业控制的嵌入式存储，以及相邻的工业 /
              能源功率电子。买方不只有芯片设计团队，也包括 Tier 1 模组供应商、OEM 平台工程师、EV 系统集成商和动力总成架构师。Future Market Insights 明确把买方描述为 OEM 平台工程团队和
              Tier 1 电子供应商，他们评估性能、认证和长期供应承诺。

              被排除的支出同样重要。GTA 不是在争夺领先制程手机 AP、AI 训练 GPU、低于成熟节点汽车 / 功率区间的前沿逻辑，或其披露工艺组合看不出相关性的普通消费
              SoC。公司可能间接受益于整体半导体需求，但估值更受汽车和工业电气化约束，而不是由前沿计算周期主导。因此，本章采用多个规模测算视角，而不是引用一个被放大的半导体 TAM。
