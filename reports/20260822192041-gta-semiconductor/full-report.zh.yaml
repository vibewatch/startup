      - number: '1.5'
        title: 负面因素和仍待补齐的最大尽调缺口
        blocks:
          - type: paragraph
            body: >-
              GTA 的负面情景不是典型丑闻或欺诈故事，而是不透明、资本密集和行业环境可能转差的组合。最清楚的公司源头信号，来自 2026 年 1
              月工作会议措辞：管理层称经营形势「复杂严峻」，并强调增收减亏。这说明，即便经历多年产能建设和大额资本流入，GTA 可能仍未进入稳定盈利状态。

              外部市场分析让风险更具体。CSIS 和 EE Times 认为，中国扩张成熟节点半导体产能的速度，可能快于全球需求增长可以从容吸收的速度；这会让价格和产能利用率承压，而 GTA
              正落在汽车、模拟和功率节点这些类别上。IFRI 给出了更温和的反向观点：中国也许能在国内消化大量成熟节点产出，从而降低单纯由出口驱动的过剩概率。正确结论不是「过剩不存在」，而是 GTA
              的下行风险高度取决于国内汽车、工业和能源需求能否吸收新产能，同时不压缩利润率。

              另一个实质问题是披露缺失。本章查阅的官方材料没有披露收入、ARR、毛利率、烧钱速度、客户集中度，也没有完整董事会和所有权地图。公开报道也未披露 2025 年 12 月事件的现金金额或正式 post-money
              估值。对于一家隐含估值可能已超过 US$4B 的后期半导体平台，这些缺口足以让公司留在「继续研究 / 跟踪」类别，而不是进入高确定性承销案例。
