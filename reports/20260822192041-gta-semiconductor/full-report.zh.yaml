      - number: '3.3'
        title: 相邻替代者包括 IDM、既有合格供应商和现状本身
        blocks:
          - type: paragraph
            body: >-
              GTA 不只和其他晶圆代工厂竞争。汽车买方也可以通过直接销售合格功率和牵引逆变器产品的 IDM，解决很多同一类任务。onsemi 围绕 400V/800V
              架构、模组级集成和定制支持营销牵引逆变器方案。Infineon 营销系统级 EV 牵引逆变器收益，例如效率和续航。ST 把新一代 SiC 描述为把牵引逆变器收益从高端 EV
              带入更主流车型的路径。这些厂商即便不是直接晶圆代工替代品，也会争夺同一批 OEM 和 Tier 1 预算。


              另一个替代者是既有装机基础。汽车认证会把现状变成竞争对手，因为除非新供应商在供应、成本或性能上给出有意义优势，买方没有必要切换。Future Market Insights 和 UTMEL
              都强调，汽车选型依靠认证纪律、PPAP 以及具体器件或工艺证据，而不是泛泛承诺。因此，组合层面的多供应商策略可行，但到项目层面会更慢、更吃工程资源。


              这种动态对 GTA 是双刃剑。一旦赢下并认证某个平台，流失率应当较低。但切入新项目很难，尤其是面对已经具备质量记录、地理冗余和直接应用支持的既有供应商。因此，相邻 IDM 和既有晶圆代工厂都必须放进竞争地图。
