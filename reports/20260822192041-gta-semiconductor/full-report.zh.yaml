      - number: '7.4'
        title: 缓释措施看得见；否决条件必须具体
        blocks:
          - type: paragraph
            body: >-
              GTA 风险画像中令人鼓舞的一点，是风险并非无人管理。官方页面展示了围绕 ESH、质量、供应商 行为、IP 处理和培训的具名控制体系。上海政策支持、重大项目可见度、本地生态密度和战略客户
              伙伴关系，都为公司避免纯粹孤立执行提供了一定缓冲。这些都是有意义的缓释因素，相比更小或更 不透明的晶圆厂项目，应能降低随机失败概率。


              但可见缓释因素不能取代硬性的否决条件。投资人应预先锁定少数会打穿投资逻辑的事件：重大环境 或安全事故；关键特色产线出现严重利用不足或长期延误证据；锚定客户关系流失、暂停或缩小；无法
              在不接受不友好条款的情况下为下一阶段资本开支融资；或地缘政治 / 法律事件实质性损害人才流动、伙伴 信任或设备获取。上述触发项很重要，因为它们攻击的正是支撑乐观情景的信任和利用率基础。


              换句话说，只有纪律仍可衡量，GTA 才具备可投资性。正确尽调姿态不是「风险太高」，而是「风险 高到必须具体、频繁且不留情面地监控」。
