      - number: '4.2'
        title: 单位经济尚未披露，但同业文件显示这是由产能利用率和资本开支驱动的模式
        blocks:
          - type: paragraph
            body: >-
              GTA 没有发布单位经济栈，因此最好的公开方法，是用特色晶圆代工同业来框定经济性。华虹 2025 年年报和 Tower 2026 年季度公告显示出熟悉模式：高折旧、设备支出和营运资本需求主导损益表与现金流。华虹
              2025 年实现 US$2.402B 收入，但毛利只有 US$282.9M，仍录得净亏损，同时资本投资达到 US$1.814B。Tower 2026 年季度盈利状况更健康，但 US$156M 和 US$187M
              的资本开支仍吞掉季度收入的大块份额。


              这些可比公司很重要，因为它们指向大概率同样决定 GTA 经济性的变量：合格汽车组合、产能利用率、晶圆 ASP、良率、折旧负担、能源和材料成本，以及客户是否预付或承诺产能。Tower
              的结果尤其有启发性，因为客户预付款和未来产能承诺可以实质改变经营现金流。华虹则从反面提供启发：即便有增长和补贴支持，资本强度和借款仍可能让账面利润很薄。


              对 GTA 来说，公开单位经济几乎完全不可得。本次查阅的来源没有披露实际晶圆价格、NRE
              贡献、客户集中度、营运资本周转或现金转化。因此，对利润率路径的任何承销判断都必须保持有条件，并由尽调牵引，而不是假装模型已经完整。
