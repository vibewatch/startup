      - number: '2.3'
        title: 买方、用户、付款方和汽车采用路径
        blocks:
          - type: paragraph
            body: >-
              GTA 所在市场的买方栈是多层的。顶层是 OEM 平台工程、动力总成、ADAS 和车载电子团队，它们设定认证要求和平台路线图。随后，Tier 1
              供应商通过牵引逆变器、车载充电器、BMS、功率模块、域控制器和安全系统，承担大量实际集成工作。Future Market Insights 和 Coherent 都强调 OEM 与 Tier 1
              对半导体选型的控制；onsemi 的牵引逆变器材料则显示，供应商关系会延伸到模组架构、裸片封装和定制支持，而不是单纯销售元器件。

              认证是采用的核心摩擦。Future Market Insights 把漫长认证周期列为直接市场约束；UTMEL 的 AEC-Q100 采购指南解释了原因：汽车买方依赖具体器件的认证证据、温度等级适配和 PPAP
              文件，而不是泛泛承诺。这意味着更换供应商又贵又慢，尤其是在动力总成和安全关键节点上。对 GTA 来说，这一点具有双向战略意义：新进入者无法快速替代已认证代工厂，但 GTA 也不能只靠新增产能赢下高价值项目。

              因此，价值链从材料和工艺技术开始，延伸到代工产能，再到芯片设计公司和模组厂，最后到 OEM 平台以及车队或终端车辆部署。付款方通常是 OEM 或 Tier
              1，但经济触发点在下游：续航更好、充电更快、可靠性更高、系统尺寸更小、供应更有保障。Infineon、ST 和 onsemi 都围绕这些系统级收益营销 SiC；如果 GTA
              这类代工厂想获得高端汽车组合，也必须回应同样的话语体系。
