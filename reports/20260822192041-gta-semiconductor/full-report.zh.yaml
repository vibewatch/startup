      - number: '3.4'
        title: 护城河是区域性和捆绑式的，不像垄断
        blocks:
          - type: paragraph
            body: >-
              GTA 最强的正面情景，是一条捆绑式护城河。官方页面和 2026 年研讨会支持这样一组能力包：位于上海的本土产能、车规资质、宽功率 / 模拟 / 存储平台，以及向解决方案型代工服务推进，其中包括与
              Infineon 相关的合作协议。上海政策支持和较低的国内替代率进一步提高了本地客户继续寻找中国汽车芯片制造替代方案的概率。


              负面情景也很清楚。全球特色厂商已经披露重叠或更宽的功率工艺栈，而且常把这些工艺栈与多区域供应连续性、更细的汽车项目和更深的公开成熟度证据绑在一起。与此同时，CSIS
              警告中国成熟节点扩张可能造成过剩和利润率压力，尽管 IFRI 认为国内吸收或许会缓冲这种影响。如果负面情景占上风，产能本身就不再是护城河，而会变成定价问题。


              综合来看，GTA 的护城河真实存在，但有条件。它最适合重视本土化、汽车 /
              功率工艺相关性和国资支持执行力的中国中心客户；对更重视公开透明度、地理冗余和全球已验证汽车项目的跨国买方来说，这条护城河更弱。因此，公开证据支持把 GTA
              视为严肃的区域竞争者，但还不能称为已经清晰差异化的全球特色晶圆代工冠军。
