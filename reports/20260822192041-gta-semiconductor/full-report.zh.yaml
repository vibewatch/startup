  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管和治理风险更多由潜在暴露定义，而不是已披露案件
        blocks:
          - type: paragraph
            body: >-
              公开法律和治理图景喜忧参半。正面看，GTA 的官方法律声明、道德页面、ESH 页面和 2026 年 工作会议材料显示，管理层明确把 IP 所有权、中国法下争议处理、供应商合规、反贿赂、环境与
              职业安全合规、反腐责任列为正式运营要求，而不是边缘政策声明。这很重要，因为特色晶圆代工厂 位于客户 IP、敏感制造诀窍、危险材料和国家支持产业政策的交汇处。一家公司如果忽视治理，
              通常会在官网上隐藏这种忽视；GTA 则相反，反复把控制体系放到前台。


              更难的问题在于公开记录没有显示什么。本次抓取材料中没有发现 GTA 特定的重大公开环境处罚、 召回或败诉案例，但不能把这种缺席误读成健康证明。中国私人公司披露有限，2025-2026 年最可见
              的法律相邻公开事件，不是公司文件，而是关于 GTA IT 工程师 Xu Zewei 应美国请求在意大利被捕 的报道。这些指控仍有争议，文章本身也带有大量免责声明式二手来源，因此不能把它当成针对公司
              的既定事实。但它确实暴露出一条真实风险通道：即便源头行为存在争议或发生在核心晶圆厂运营之外， 地缘政治、网络和人员暴露仍可能落到半导体公司身上。


              因此，正确解读应保持谨慎。GTA 看起来确实搭起了治理脚手架。但残余法律和监管风险仍然重要， 因为公开结果证据薄，客户 IP 敏感，环境和安全义务是晶圆厂的内生责任，跨境政治风险也并非 管理层完全可控。
