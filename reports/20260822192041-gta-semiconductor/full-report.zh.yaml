      - number: '4.3'
        title: 资本充足性：历史融资巨大、建设可见，但当前现金状况不透明
        blocks:
          - type: paragraph
            body: >-
              GTA 最强的公开财务证据是资本形成，而不是经营表现。公司在 2021 年 11 月正式宣布 RMB 8B 战略融资。Reuters 和 AVCJ 后续报道了与汽车芯片扩张相关的又一轮融资，规模超过
              US$1.8B / 约 RMB 13.5B。CB Insights 估算历史总融资约 US$3.116B；PitchBook 则记录了 2025 年 12 月前后的后期 VC
              活动和一笔私有二级交易。Eastmoney 与 Sohu 关于 2025 年 12 月事件的报道称，注册资本增至 RMB 17.9B，并可见新增股东，但未公开该事件实际现金金额。


              资金用途比现金余额更容易推断。GTA 的 12 英寸汽车芯片先导线、纳入上海重大项目、智能工厂里程碑，以及 2026 年仍在推进的技术路线图，都指向晶圆厂、设备、自动化和工艺平台能力上的重投入。这与华虹年报和
              Tower 扩张评论所呈现的更广泛特色代工打法一致。


              无法靠公开信息承销的是当前现金续航期。本次查阅的来源没有说明 GTA 手头现金、月度烧钱、未提取授信、项目融资条款或债务服务情况。相比许多创业公司，GTA
              可能资金更充裕；但在产能利用率、现金生成和资本开支义务披露之前，把它视作依赖融资的公司仍是合理的。
