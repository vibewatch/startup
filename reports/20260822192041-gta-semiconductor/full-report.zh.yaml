      - number: '5.3'
        title: 信任、质量、安全、合规和人力资本系统都是产品的一部分
        blocks:
          - type: paragraph
            body: >-
              特色晶圆代工厂的产品本身就包含信任控制。GTA 的公开页面说得很清楚。应用页面称，其 徐汇晶圆厂是中国首家取得 VDA 6.3 A 级汽车 IC 供应商资质的晶圆代工厂，且徐汇晶圆厂在 2021 年通过 IATF
              16949。质量页面强调客户导向和零缺陷目标。ESH 页面写明与 ISO14001 和 ISO45001 对齐的管理体系承诺，并强调安全、污染预防和持续改进。商业道德页面把信任
              边界延伸到供应商行为和无冲突金属。光罩服务页面则加入 IP 保护、加密传输、安全 FTP 和 访问控制。


              第二层信任来自人力资本。制造公司公开招聘页面通常不会透露这么多；GTA 的页面却很有信息量： 公司同时做校园招聘和社会招聘，培训覆盖新员工导入、研发、质量与可靠性、制造、应用统计、先进
              工艺、半导体器件物理和领导力轨道；薪酬页面突出 ESOP、住房、保险、宿舍、班车和教育支持。 这些本身不能证明技术卓越，但能说明 GTA 把培训、留存和工艺纪律视为系统级支撑，而不是 人力资源的附属项。


              反向看，许多信任主张仍贴近营销口径。公开页面没有披露现场退货、缺陷 ppm、客户审计结果 或详细认证范围。因此，本章可以验证信任体系存在，但还不能验证这些体系已经产生的实际运营 结果。
