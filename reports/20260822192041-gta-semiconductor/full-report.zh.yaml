        - 验证 GTA 是否依赖受限的海外设备、晶圆或客户地域
      - - 中国成熟节点产能过剩风险
        - 负向 / 不确定
        - 当前 / 多年
        - 即使收入端需求仍健康，也可能压缩价格
        - 在较低利用率和本地价格竞争假设下测算利润率
      - - 上海 / 临港政策支持
        - 正向
        - 当前 / 多年
