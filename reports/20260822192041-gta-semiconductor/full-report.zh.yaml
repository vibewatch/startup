        - 区分政策托举的规模与真实独立盈利能力
    notes: 表中同时列入长期需求驱动与经营摩擦，因为二者都会影响估值。对 GTA 而言，关键问题不是市场是否增长，而是增长能否转成经过认证且有利润的产能利用率。
