      - number: '2.4'
        title: 增长驱动、采用约束和相互矛盾的中国政策背景
        blocks:
          - type: paragraph
            body: >-
              各来源对主要需求驱动的判断一致。IEA 预计 2026 年全球 EV 销量将达到 23 million 辆，占全部汽车销售的 28%；其中中国 EV 占比接近 60%，欧洲接近新车销量的三分之一。Coherent
              和 FMI 都把这一电气化趋势与功率电子、电池管理、电机控制、ADAS 和软件定义汽车算力需求上升联系起来。ST 和 Infineon 在器件层面表达了同样观点：牵引逆变器中的 SiC 能提升效率，支持
              400V/800V 系统，并帮助延长续航或压缩电池成本。对一家聚焦汽车功率和混合信号工艺的代工厂来说，这些都是强劲的长期顺风。

              但约束也真实存在。Coherent 强调地缘政治碎片化、供应链短缺和材料约束；Fortune 强调 SiC 产能扩张的成本、良率和资本强度；FMI 明确把认证周期和晶圆厂产能分配列为近期约束。GTA
              的策略因此更微妙：车规质量资质和本地政策支持是优势，但不能让公司免于行业共同面对的长爬坡期、良率学习和价格压力。

              中国政策背景因此呈现出有用的矛盾。Reuters 称 2023 年中国汽车芯片国产替代率仍低于 10%，意味着本土化空间很大。上海项目清单和临港集群叙事也强化了对 GTA 正在建设的成熟节点、汽车和 SiC
              产能的主动国家支持。但 CSIS 和 EE Times 警告，中国新增成熟节点产能的速度可能仍快于全球价格可吸收能力；IFRI
              则认为国内需求可能吸收大部分建设产能。实际含义是，市场增长大概率真实存在，但不会自动转化为利润。
