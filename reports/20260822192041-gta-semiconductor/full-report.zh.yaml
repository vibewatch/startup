      - number: '8.2'
        title: 乐观、基准和悲观情景取决于利用率、集中度和稀释
        blocks:
          - type: paragraph
            body: >-
              乐观情景并不难想象。如果 GTA 能用高粘性的车规项目填满计划产能的大部分，同时守住质量、把 存储、控制、驱动和功率的一站式附着做宽，并避开惩罚性融资条款，它可能成为中国最有价值的 特色汽车 /
              功率代工资产之一。在那个世界里，当前私募估值可能显得保守，而不是激进。


              基准情景更冷静。它假设战略故事大体正确，但执行仍不均衡，客户集中度仍有意义，资本密集度让 股权故事难以顺畅复利。这一情景支持一个大致围绕或略低于近期私募估值的估值区间。它并不意味着
              灾难，只意味着当前投资人要么需要有吸引力的进入条款，要么需要对私人指标有很强信心。


              悲观情景不只是技术失败。它是代工模式反噬股权持有人：装载放慢、成熟制程竞争带来价格压力、 稀释重于预期、锚定客户需求滑坡，或安全 / 地缘政治事件损害信任。由于固定成本基数很大，即便
              战略叙事仍有方向性吸引力，下行也可能迅速兑现。
