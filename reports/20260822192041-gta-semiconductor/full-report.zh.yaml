      - number: '1.4'
        title: 制造里程碑、技术扩展和战略合作
        blocks:
          - type: paragraph
            body: >-
              GTA 的里程碑显示，公司正从传统特色代工根基，走向更宽的 12 英寸和 SiC 驱动汽车平台。官方时间线在这里尤其有用，因为它记录的是可核验的产业进展，不是营销口号。2023 年 6 月，公司宣布 12
              英寸汽车芯片先导线成功贯通，并称 12 英寸 BCD 晶圆已在 2023 年 2 月首次进入生产，WAT 测试结果完全达标。同一公告把该产线定位为 90nm 到 40nm 汽车 MCU、模拟 IC 和 CIS
              制造载体。

              随后，GTA 把技术叙事扩到传统功率器件之外。2023 年 12 月，公司宣布与无锡舜铭联合开发 110nm 铁电存储产品，称密度和可靠性明显提升，并计划在 1Q24 量产。到 2025
              年，公司汽车电子芯片工厂获得中国电子「先进智能工厂」认定。2026 年 4 月，GTA 举办半导体创新大会，超过 260 名生态伙伴参与；公司借此强调解决方案导向的代工服务，并与 Infineon 围绕嵌入式
              NVM 和特色工艺升级签署合作协议。

              公共政策层进一步强化了这些运营里程碑。上海 2026 年重大项目清单仍包含 GTA 特色工艺生产线项目；上海 2025 年临港六周年回顾也把 GTA 视为帮助培育区域集成电路集群的锚点项目之一。换句话说，GTA
              不是停滞的传统晶圆厂；它仍处在主动扩产和生态搭建阶段，后续章节必须把这一点放在投资逻辑中心。
