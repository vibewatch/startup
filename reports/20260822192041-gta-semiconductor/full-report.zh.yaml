  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: GTA 的客户旅程通常从特定应用芯片需求开始，经过认证、首次交付和多工艺扩展后逐步加深。
    data:
      items:
        - label: 需求识别
          detail: 汽车 / 工业 / 功率应用需要适配的特色工艺
          tone: neutral
