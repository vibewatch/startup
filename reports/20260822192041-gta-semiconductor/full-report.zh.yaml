      - number: '5.2'
        title: 架构和运营模式：逻辑、功率、分立器件、掩膜、晶圆厂和工艺控制层
        blocks:
          - type: paragraph
            body: >-
              公开架构是分层的。前端看，GTA 的逻辑技术页面称，公司通过技术授权和自主开发具备 90nm 至 28nm 逻辑工艺能力，平台可整合 BCD、HVCMOS、MCU、CIS、eNVM。同一页面对 40nm 和
              65/55nm 层给出更具体细节，包括核心电压、阈值选项、low-k 介质、铜后段集成， 以及具体车规 / 电源管理目标。特色工艺侧，GTA 的功率与分立器件页面把平台定位在汽车
              电源管理、IGBT、MOSFET、SiC、BCD，以及成熟制程下的模拟和功率器件上。


              制造流程围绕这些工艺层展开。晶圆厂信息页面显示，GTA 在临港和徐汇形成多厂布局。光罩 服务叠加交钥匙光罩采购、MPW 拼车项目、供应商审核要求、安全数据传输和访问控制系统。
              实际上，交付的「产品」是一条链：客户设计需求 -> 工艺选择 -> 光罩 / MPW 支持 -> 合格 晶圆厂执行 -> 面向具体应用的晶圆产出。


              路线图证据显示，架构扩张的不只是规模，还有能力。12 英寸车规芯片试验线、2024 年 110nm 铁电存储公告，以及 2026 年研讨会提出的存储路线图（eFlash、SONOS、RRAM），都说明 GTA
              试图把平台做得更一体化，并在工艺和模块层更有防守性。公开材料的关键限制是：没有开放 PDK、没有详细设计规则下载入口，也没有公开良率数据集。因此，架构成熟度只能从描述性页面
              和里程碑公告推断，而不是靠经过审计的运营数据验证。
