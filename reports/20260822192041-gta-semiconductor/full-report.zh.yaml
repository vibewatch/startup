      - number: '6.3'
        title: 留存、重复使用，以及真正能证明的耐久性
        blocks:
          - type: paragraph
            body: >-
              GTA 的公开客户证据更能证明粘性的前提，而不是实测留存本身。汽车功率领域的特色晶圆代工关系 通常要经历认证投入、工艺对齐和漫长验证周期，之后才会进入量产爬坡；一旦导入设计，获批供应商 可能很有粘性。EET
              China 对汽车代工选择的讨论正强调这一点：客户的核心问题不再只是有没有 产能，而是晶圆代工厂能否长期稳定交付、通过系统认证，并支持持续的产品迭代。AEC-Q100 等认证
              框架和汽车可靠性流程进一步强化了采购摩擦。这套机制支持一个方向性判断：经常性关系可以 相当耐久。


              不过，GTA 没有公开披露净留存率（NRR）、总留存率（GRR）、流失率、合同期限、重复流片率、 客户生命周期或账户级扩张曲线。官网声称获得客户认可并突出质量体系，但没有发布续约、按客户 拆分的缺陷
              ppm、现场退货或钱包份额等结果指标。因此，公开留存分析必须保持诚实：耐久性来自 行业机制和具名的重复导向合作推断，不是一组已经展示的 KPI。


              最好的公开耐久性代理指标，是多阶段关系，而不是一次性客户名。Geely 超越了一般 MOU，延伸到 联合研发和制造对齐。Zhongqi 包含已交付器件和后续产品合作。Infineon 把 GTA 连接到更深的
              特色工艺和存储合作。这些都是正面信号，但仍不足以证明队列留存或经济扩张。因此，本章把合格 汽车项目中的留存视为可能偏正面，同时把硬性客户成功指标缺位列为重大尽调缺口。
