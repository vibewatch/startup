  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层、买方地图和真正付款方
        blocks:
          - type: paragraph
            body: >-
              GTA 不面向终端消费者销售。它真正服务的客户是芯片设计团队、IDM、模块厂商、汽车 Tier 1 供应商， 以及需要合格特色工艺制造来生产功率、控制、传感和混合信号器件的系统公司。官方应用和公司
              概览页面把需求框在汽车电子、工业控制、高端消费电子、轨道交通，以及逆变器、DC-DC 转换器、 OBC、充电桩、电源管理等新能源电力应用。也就是说，买方、用户和付款方常常不是同一方。整车 OEM
              可能提出要求，Tier 1 或设计公司负责芯片项目，GTA 则作为代工平台把设计转成合格晶圆并 收取费用。


              公开证据也显示，汽车买方位于客户叙事中心。GTA 反复突出 VDA 6.3 A 级汽车资质、IATF16949、 车规芯片制造经验，以及 SiC、IGBT、BCD、PMIC
              和控制器等工艺家族。这些不是泛泛的网页营销 细节，而是面向采购流程由质量和可靠性驱动的客户所释放的采购信号。公司叙事里显然也有工业 和部分高端消费客户，但最深的公开证据仍绑定在汽车功率和国产化应用场景上。


              实际含义是，分析 GTA 的客户基础，更应把它看作服务项目型账户的特色晶圆代工厂，而不是一张 宽泛的 SaaS 客户名单。客户质量取决于设计定点、认证进度、重复流片和量产启动后的粘性，而
              不是好看的用户数。因此，公开披露最强的是细分市场匹配度和具名战略账户，真正的客户数以及 按队列拆分的收入组合仍然薄弱。
