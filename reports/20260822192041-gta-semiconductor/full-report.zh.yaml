      - number: '3.2'
        title: 全球特色代工厂设定了工艺覆盖、汽车信任和供应连续性的基准
        blocks:
          - type: paragraph
            body: >-
              全球特色代工厂给出了最清楚的基准：汽车和功率客户今天能从非中国平台买到什么。Tower 推出 65nm 和 180nm BCD，支持最高 700V 电压，覆盖 8 英寸和 12
              英寸晶圆，并强调三座制造设施带来的运营灵活性。VIS 提供异常明确的特色功率栈：5V-120V BCD、200V-700V UHV 和 10V-200V SOI，同时汽车服务项目覆盖 0.8um 到 0.11um
              技术。X-FAB 更加以汽车为中心，强调所有晶圆基地均获得 IATF 16949 认证，并在 Texas 和 Dresden 晶圆厂具备专门的 SiC 与 GaN 能力。


              UMC 和 GlobalFoundries 的重要性在于另一点：它们把特色工艺能力与全球制造规模、业务连续性叙事结合起来。UMC 称其运营 12 座晶圆厂，每月超过 400,000 片 12
              英寸等效晶圆，并且所有晶圆厂都获得 IATF 16949 认证。GF 围绕 15+ 年汽车经验、数十万片晶圆出货以及美国 / 欧洲 / 亚洲布局营销 AutoPro；其 BCD 页面还明确宣传 5V-150V
              覆盖，并在美国、Dresden 和 Singapore 实现双来源制造。这些不只是制造事实，也是采购论据。


              对照这一基准，GTA 披露的技术重叠可信，尤其是在 BCD、功率分立、eNVM
              和汽车功率应用上；但其公开英文披露更薄。全球同业披露了更精确的工艺范围、更明确的汽车项目和更明显的地理冗余。这不意味着它们会在中国自动胜出，但确实说明，GTA
              当前公开竞争故事在区域相关性上更强，在已披露技术优越性上更弱。
