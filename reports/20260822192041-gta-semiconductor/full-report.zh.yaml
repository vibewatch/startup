    rows:
      - - 股权结构表 / 优先权
        - 清算顺位、反稀释、投资人权利、债务，或附函
        - 私募结构可能主导普通股回报
        - 领投方 / 律师审阅
      - - 收入与毛利率
        - 按晶圆厂 / 工艺 / 客户分层的经审计收入，以及毛利率拆解
        - 任何严肃估值方法都需要分母
        - 财务尽调 + 审计包
      - - 分产线稼动率
        - 8 英寸、12 英寸和 SiC 产线的负荷、良率爬坡与成本吸收
        - 晶圆代工股权价值的主驱动
        - 运营尽调
      - - 客户集中度
        - 第一大 / 前五大客户占比、锚定项目阶段、续约展望
        - 集中度可能让当前估值标记很脆
        - 商业尽调
      - - 事故与质量历史
        - 安全、环境、审计和重大客户质量事件
        - 信任失守会迅速压缩估值
        - EHS / 质量尽调
      - - 政策与地缘政治敞口
        - 设备、出口管制、出行与伙伴敏感性图谱
        - 外生冲击可能比自下而上模型假设得更重要
        - 法律 + 地缘政治尽调
    notes: 如果上述问题回答得好，投资建议可以很快上调；如果不能，就必须靠价格补偿。
    claimRefs:
      - CV032
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
