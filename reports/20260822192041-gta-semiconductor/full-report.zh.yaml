      - number: '7.2'
        title: 运营和依赖风险是代工模式咬得最深的地方
        blocks:
          - type: paragraph
            body: >-
              运营上，GTA 暴露在经典代工失效模式下：质量失误、良率或爬坡延误、环境或安全事故、光罩或 供应商延期，以及实体运营集中在少数晶圆厂。中文晶圆厂信息、光罩服务、质量和 ESH 页面都让 这些依赖清晰可见。GTA
              明确强调供应商认证、快速光罩交付、加密、防火墙隔离、安全 FTP、访问 控制、零缺陷质量、ISO14001/ISO45001 和安全第一管理。这些是真实缓释措施，但也等于承认哪些
              事情可能出错。公司之所以投入这些系统，是因为排期滑坡、数据泄露、工艺漂移、污染事件和客户 审核失败都会代价高昂。


              汽车客户组合会放大执行失误的惩罚。EET China 和 AEC-Q100 语境都说明，汽车买方关心长期稳定 交付和系统认证，而不只是今天有没有产能。这让每一次延误或质量异常都比认证要求较轻的消费电子
              流程更昂贵。与此同时，GTA 正在提高复杂度——SiC、12 英寸汽车线、嵌入式存储、多工艺子系统 附着——所以风险不只是维持现有晶圆厂运转，还要在加入更难技术和更新节点的同时维持运转。


              依赖风险会进一步放大运营问题。公开客户证据集中在少数具名关系上；设施集中在上海；本地政策 生态虽有支持，却也成为交付系统的一部分。这意味着，厂区问题、供应商中断、锚定客户延期或生态
              政策变化，都可能迅速传导到利用率、利润率和融资需求。
