      - number: '1.3'
        title: 融资历史、所有权信号和估值区间
        blocks:
          - type: paragraph
            body: >-
              GTA 的融资规模更像战略性国家平台，而不是普通私营芯片创业公司。公司在 2021 年 11 月正式宣布完成 RMB 8.0B
              战略融资，由现有股东华大半导体领投，参与方包括中国互联网投资基金、上汽系尚颀资本、小米长江产业基金、临港和浦东平台、中金系基金以及其他政策关联资本池。AVCJ 另追溯到 2019
              年一轮融资：上海集成电路产业投资基金以 RMB 1.8B 取得 45% 股权；随后其称 2021 年融资包含投资者集团投入 RMB 6.7B、华大投入 RMB 1.3B，与官方披露的 RMB 8.0B 完全一致。

              下一次明显抬升发生在 2023 年。Reuters 和 AVCJ 报道，GTA 完成约 RMB 13.5B（约 US$1.85B）融资，背后主要是国家引导、金融和战略投资者。Reuters
              将这轮融资解读为：在中国筹备更大半导体基金时，北京仍愿意持续支持国内汽车芯片制造。也就是说，GTA 不只是另一座成熟节点晶圆厂，而是连接汽车本土化和产业韧性的政策优先资产。

              到 2025 年 12 月，信息变得更模糊而不是更清楚。PitchBook 在 2025 年 12 月 9 日记录了后期 VC 事件和一笔私有二级交易。但 Eastmoney 与 Sohu
              的中国工商信息报道把该事件描述为增资扩股：新增股东，注册资本从约 RMB 16.907B 增至 RMB 17.906B，但未披露现金金额。CB Insights 估算历史总融资为
              US$3.116B；中文媒体给出的隐含估值约为 RMB 30.6B-31.0B（按汇率约 US$4.2B-4.4B）。正确的尽调姿态是：把 GTA
              视作一家确认获得大规模国资支持融资的后期私营公司，但其最新定价、二级交易条款和真实投后股权结构仍缺乏公开可见度。
