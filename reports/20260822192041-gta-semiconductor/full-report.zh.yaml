  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 投资测算区间对产能利用率、股权结构清洁度、客户多元化，以及投资人给不透明度打的折价最敏感。
    approximationNotes: 数值是方向性的十亿美元金额，表示各因素相对基准中点的拉动幅度，而不是经审计的独立科目。
    data:
      items:
        - label: 基准中点
          value: 3.8
        - label: 产能利用率上行
          value: 1.2
        - label: 更干净股权结构 / 更温和优先权
          value: 0.5
        - label: 客户更多元
          value: 0.5
        - label: 财务不透明折价
          value: -0.8
        - label: 集中度折价
          value: -0.7
        - label: 额外稀释折价
          value: -0.6
        - label: 执行 / 产能过剩折价
          value: -0.6
    claimRefs:
