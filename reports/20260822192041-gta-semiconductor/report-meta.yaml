companyProfile:
  summary: GTA Semiconductor is the English-branded public identity of Shanghai Jita Semiconductor (上海积塔半导体有限公司), a Shanghai-based specialty foundry platform founded in November 2017. Public sources position the company around automotive electronics, industrial control, selected high-end consumer / mixed-signal use cases, and power devices such as BCD, IGBT, MOSFET, SiC, PMIC, controllers, and MEMS-related manufacturing. Official pages describe a 300,000 200mm-equivalent wafers-per-month capacity target across Shanghai sites and a one-stop platform ambition spanning memory, control, drive, and power. Public financing sources indicate multi-billion-dollar funding and a late-stage private valuation around the low- to mid-single-digit billions of USD, but the company remains under-disclosed on audited revenue, margins, concentration, and cap-table economics.
  foundedDate: '2017-11-01'
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: Specialty-process wafer manufacturing for automotive, industrial, and power-oriented chips, including BCD, PMIC, controller, IGBT, MOSFET, SiC, logic, and related mixed-signal / specialty platforms, plus mask, MPW, quality, and solution-foundry support.
  customerFocus: Automotive chip companies, Tier 1 suppliers, industrial-control and power-device designers, and selected mixed-signal / consumer-adjacent chip teams needing qualified specialty-process manufacturing rather than finished end products.
  businessModel: Capital-intensive foundry model monetizing specialty-process wafer manufacturing, capacity, quality systems, and increasingly broader subsystem attachment across memory, control, drive, and power functions for customers with automotive and industrial reliability needs.
  stage: late-stage private
  fundingStatus: Public analyst and media sources indicate more than $3.1B of total funding and a late-stage private valuation roughly around $4.2B-$4.4B. Open sources do not reconcile the full preference stack, dilution protections, debt or project-finance structure, or current cash generation.
