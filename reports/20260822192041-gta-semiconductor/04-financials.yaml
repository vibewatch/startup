- id: section-capital-adequacy
  title: 'Capital adequacy: massive historical funding, visible buildout, opaque current cash position'
  body: >-
    The strongest public financial evidence on GTA is capital formation, not operating performance. The company officially announced an RMB 8 billion strategic financing in November 2021. Reuters and AVCJ later reported a subsequent raise of more than US$1.8 billion / roughly RMB 13.5 billion linked to automotive-chip expansion. CB Insights estimates total historical funding at about US$3.116 billion, while PitchBook records later-stage VC activity and a private secondary transaction around December 2025. Eastmoney and Sohu coverage of the December 2025 event say registered capital rose to RMB 17.9 billion and added shareholders were visible, but the actual cash amount of that event was not publicly disclosed.


    The use of funds is easier to infer than the cash balance. GTA's 12-inch automotive-chip pilot line, Shanghai major-project inclusion, smart-factory milestone, and continued 2026 technical roadmap all point toward heavy spend on fabs, equipment, automation, and process-platform capability. That is consistent with the broader specialty-foundry playbook illustrated by Hua Hong's annual report and Tower's expansion commentary.


    What cannot be underwritten publicly is current runway. No source reviewed states cash on hand, monthly burn, undrawn credit facilities, project-finance terms, or debt-service profile for GTA. The company may be well funded relative to many startups, but it is still reasonable to treat it as financing-dependent until utilization, cash generation, and capex obligations are disclosed.
