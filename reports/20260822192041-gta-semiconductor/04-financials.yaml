- id: section-unit-economics
  title: Unit economics are undisclosed, but peer filings show a utilization-and-capex-driven model
  body: >-
    GTA does not publish a unit-economics stack, so the best public approach is to bracket the economics using specialty-foundry peers. Hua Hong's 2025 annual report and Tower's 2026 quarterly releases show a familiar pattern: high depreciation, equipment spending, and working-capital demands dominate the P&L and cash-flow profile. Hua Hong generated US$2.402 billion of revenue in 2025 but only US$282.9 million of gross profit and still posted a net loss, while also spending US$1.814 billion on capital investments. Tower's 2026 quarters show a healthier profitability profile, but even there capital expenditures of US$156 million and US$187 million absorbed a large share of quarterly revenue.


    Those comparables matter because they point to the variables that likely determine GTA's economics as well: qualified automotive mix, utilization, wafer ASP, yield, depreciation burden, energy and materials cost, and the degree to which customers prepay or commit to capacity. Tower's results are particularly instructive because they show customer prepayments and future capacity commitments can materially alter operating cash flow. Hua Hong is instructive for the opposite reason: even with growth and subsidy support, capital intensity and borrowing can keep reported earnings thin.


    For GTA specifically, public unit economics remain almost entirely unavailable. No reviewed source discloses realized wafer pricing, NRE contribution, customer concentration, working capital turns, or cash conversion. As a result, any underwriting of margin path has to remain conditional and diligence-led rather than model-complete.
