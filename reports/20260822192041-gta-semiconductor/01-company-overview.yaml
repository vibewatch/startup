callouts:
  - calloutType: strength
    title: "Automotive-grade specialty foundry with real industrial scale"
    body: >-
      GTA is not a concept-stage chip startup. Official sources show multi-site Shanghai fabs, 12-inch automotive-chip
      build-out, broad process platforms spanning analog, power, MEMS, and eNVM, and continuing ecosystem partnerships
      with players such as Infineon.
