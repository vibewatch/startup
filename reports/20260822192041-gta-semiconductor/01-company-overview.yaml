  - calloutType: risk
    title: "Large funding, limited financial transparency"
    body: >-
      Even after very large disclosed financings and a probable multi-billion-dollar private valuation, GTA's public
      materials still do not disclose revenue, margins, burn, customer concentration, or a fully transparent board and
      cap table. That is the dominant diligence blocker at chapter-close.
    claimRefs:
      - CO023
      - CO024
      - CO040
      - CO041

  - calloutType: risk
    title: "Expansion thesis collides with mature-node overcapacity risk"
    body: >-
      GTA is expanding in precisely the mature-node automotive, analog, and power categories that outside analysts flag
      as vulnerable to Chinese capacity oversupply. Domestic demand may absorb part of that output, but the burden of
      proof is now on utilization and margin quality rather than on financing availability alone.
    claimRefs:
      - CO037
      - CO038
      - CO039

