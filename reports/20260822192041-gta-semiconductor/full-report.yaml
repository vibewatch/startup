      - number: '5.3'
        title: Trust, quality, safety, compliance, and human-capital systems are part of the product
        blocks:
          - type: paragraph
            body: >-
              For a specialty foundry, trust controls are part of the product itself. GTA's public pages make this
              clear. The applications page says its Xuhui fabs were the first foundry in China to obtain VDA 6.3 A-level
              automotive IC supplier qualification and that the Xuhui fabs passed IATF 16949 in 2021. The quality page
              stresses customer orientation and zero defect goals. The ESH page states management-system commitments
              aligned to ISO14001 and ISO45001 and emphasizes safety, pollution prevention, and continuous improvement.
              The business-ethics page extends the trust perimeter into supplier conduct and conflict-free metals.
              Mask-services pages add IP protection, encrypted transmission, secure FTP, and access control.


              A second trust layer is human capital. The public careers surfaces are unusually revealing for a
              manufacturing company: campus and social recruitment exist, training is structured into new-employee
              orientation, research and development, quality and reliability, manufacture, applied statistics, advanced
              process, semiconductor-device physics, and leadership tracks, and compensation pages highlight ESOP,
              housing, insurance, dormitory, shuttle bus, and education support. That does not prove technical
              excellence by itself, but it does show that GTA views training, retention, and process discipline as
              system-level enablers rather than HR afterthoughts.


              The adverse read is that many of these trust claims are still marketing-adjacent. Public pages do not
              disclose field returns, defect ppm, customer audit results, or detailed certification scope. So the
              chapter can verify the existence of trust systems, but not yet their realized operating outcomes.
