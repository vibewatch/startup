      - number: '8.3'
        title: Public comps support strategic scarcity, but they also expose the disclosure gap
        blocks:
          - type: paragraph
            body: >-
              The public comparable set cuts in both directions. On one hand, public specialty and auto/power
              semiconductor companies are very valuable in 2026. Market-cap references place X-FAB around $0.90B, VIS
              around $8.94B, Tower around $25.15B, GlobalFoundries around $26.36B, UMC around $45.99B, ON Semiconductor
              around $28.89B, and STMicroelectronics around $45.12B. Against that backdrop, a roughly $4.2-4.4B GTA mark
              does not look absurdly large in absolute terms. It sits well below major public peers and above only the
              smallest specialty public reference.


              On the other hand, those peers are public, audited, liquid, and much better understood. Several also have
              broader customer bases, longer operating histories, clearer revenue and margin disclosure, and lower
              mystery around preference stacks. A private Chinese specialty foundry with sparse financial disclosure
              should not automatically command a public-like multiple simply because the sector is strategically
              valuable. The comp set therefore supports two simultaneous conclusions: first, the category is valuable;
              second, GTA still deserves a discount for opacity, concentration, and financing risk until private
              diligence proves otherwise.


              That is why I treat VIS and X-FAB as more useful boundary markers than UMC or ST. UMC, ST, ON
              Semiconductor, Tower, and GlobalFoundries validate the end-market importance of auto / power / specialty
              semis, but they are not clean one-to-one valuation anchors. The right question is not whether GTA can ever
              be worth many billions. It probably can. The right question is whether the current entry price already
              assumes too much of that future.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
