      - number: '3.3'
        title: Adjacent substitutes include IDMs, incumbent qualified suppliers, and the status quo itself
        blocks:
          - type: paragraph
            body: >-
              GTA does not compete only with other foundries. Automotive buyers can also solve much of the same job
              through integrated device manufacturers that sell qualified power and traction-inverter products directly.
              onsemi markets traction-inverter solutions around 400V/800V architectures, module-level integration, and
              customization support. Infineon markets system-level EV traction-inverter gains such as efficiency and
              range. ST frames its newer SiC generation as a path to bring traction-inverter benefits from premium EVs
              into more mainstream segments. Those vendors compete for the same OEM and Tier-1 budgets even when they
              are not direct wafer-foundry substitutes.


              The other substitute is the installed base. Automotive qualification turns the status quo into a
              competitor because the buyer does not need to switch unless a new supplier offers a meaningful advantage
              in supply, cost, or performance. Future Market Insights and UTMEL both reinforce that automotive selection
              depends on qualification discipline, PPAP, and exact part or process evidence rather than generic claims.
              As a result, multi-homing is possible at the portfolio level, but it is slower and more engineering-heavy
              at the program level.


              This dynamic cuts both ways for GTA. Once it wins and qualifies a platform, churn should be low. But
              getting onto a new program is hard, especially against incumbents that already combine quality history,
              geographic redundancy, and direct application support. That is why adjacent IDMs and incumbent foundries
              both matter in the rivalry map.
