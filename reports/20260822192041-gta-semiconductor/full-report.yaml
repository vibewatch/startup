              Public evidence consistently ties GTA to Huada / CEC, Shanghai industrial funds, major municipal projects,
              and state-guided financing. That can be a source of resilience and capital access, but it also means
              governance and commercial decision rights cannot be inferred from normal venture heuristics.
            calloutType: insight
