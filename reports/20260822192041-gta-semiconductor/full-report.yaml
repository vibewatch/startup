      - number: '7.2'
        title: Operational and dependency risk is where the foundry model bites hardest
        blocks:
          - type: paragraph
            body: >-
              Operationally, GTA is exposed to the classic foundry failure modes: quality misses, yield or ramp
              slippage, environmental or safety incidents, mask or supplier delays, and concentration of physical
              operations in a small number of fabs. The Chinese fab-information, mask-services, quality, and ESH pages
              make these dependencies visible. GTA explicitly emphasizes supplier certification, fast mask delivery,
              encryption, firewall isolation, secure FTP, access control, zero-defect quality, ISO14001/ISO45001, and
              safety-first management. Those are real mitigants, but they are also admissions of what could go wrong. A
              company only invests in those systems because schedule slips, data leaks, process drift, contamination
              events, and customer-audit failures would be costly.


              The automotive customer mix increases the penalty for execution mistakes. EET China and AEC-Q100 context
              both reinforce that automotive buyers care about long-term stable delivery and system certification, not
              merely whether capacity exists today. This makes every delay or quality excursion more expensive than it
              would be in a lightly qualified consumer flow. At the same time, GTA is trying to deepen complexity—SiC,
              12-inch auto lines, embedded memory, multi-process subsystem attachment—so the risk is not just keeping
              existing fabs running, but doing so while adding harder technologies and newer nodes.


              Dependency risk compounds the operational picture. Public customer proof clusters around a handful of
              named relationships; facilities cluster in Shanghai; and the local policy ecosystem, while supportive,
              becomes part of the delivery system itself. That means a site problem, supplier disruption,
              anchor-customer delay, or ecosystem policy shift can transmit quickly into utilization, margin, and
              funding needs.
