      - number: '6.4'
        title: Expansion drivers, concentration risk, and the balanced customer verdict
        blocks:
          - type: paragraph
            body: >-
              The expansion case is strategically coherent. GTA wants customers to buy more than a single mature-node
              process. The 2026 seminar describes a one-stop platform spanning memory, control, drive, and power. The
              applications pages connect that platform to auto power-management systems, inverters, chargers, and
              industrial control. If that attachment model works, expansion can come from moving a customer across
              multiple chips in the same subsystem or across multiple process families inside one automotive or
              industrial platform. Shanghai policy support and the local automotive ecosystem add a second expansion
              vector by encouraging localized supply-chain adoption.


              The main counterweight is concentration. Third-party reports repeatedly frame Infineon as a uniquely
              important anchor relationship and suggest that other large automotive / SiC accounts such as BYD
              Semiconductor matter materially as well. Even if those specific concentration percentages are not fully
              corroborated, the shape of the risk is intuitive for a specialty foundry: a small number of high-value
              qualified programs can dominate utilization and economics. Peer filings reinforce that foundry customer
              concentration is common enough to take seriously. Hua Hong, for example, disclosed that its five largest
              customers represented 34.2% of sales revenue in 2025. GTA may or may not be more concentrated than that,
              but investors should assume concentration could be meaningful until management shows otherwise.


              The balanced verdict is therefore positive but qualified. GTA appears to have real customer pull in the
              segments that matter most to its specialty foundry strategy, and the named proof is stronger than a pure
              marketing narrative. Yet the public record still does not establish how diversified, durable, or
              economically valuable the customer base is across production accounts. That concentration-and-opacity
              discount should remain front and center in valuation and underwriting.
