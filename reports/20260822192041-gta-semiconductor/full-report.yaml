      - number: '3.4'
        title: Moat durability is regional and bundled, not monopoly-like
        blocks:
          - type: paragraph
            body: >-
              The best case for GTA is a bundled moat. Official pages and the 2026 seminar support a package of domestic
              Shanghai-based capacity, automotive-grade credentials, broad power/analog/memory platforms, and a move
              toward solution-foundry services including an Infineon-linked cooperation agreement. Shanghai policy
              support and low domestic replacement rates further improve the odds that local customers keep looking for
              China-based automotive chip manufacturing alternatives.


              The adverse case is also clear. Global specialists already disclose overlapping or broader power-process
              stacks, and they often pair those stacks with multi-region supply continuity, more detailed automotive
              programs, and deeper public proof of maturity. Meanwhile, CSIS warns that Chinese mature-node expansion
              can create overcapacity and margin stress, even as IFRI argues domestic absorption may soften that effect.
              If that adverse scenario dominates, capacity alone becomes less of a moat and more of a pricing problem.


              The synthesis is that GTA's moat is real but conditional. It is strongest for China-centric customers that
              value localization, automotive/power process relevance, and state-backed execution. It is weaker for
              multinational buyers that prioritize public transparency, geographic redundancy, and globally proven
              automotive programs. Public evidence therefore supports GTA as a serious regional contender, not yet a
              clearly differentiated global specialty-foundry champion.
