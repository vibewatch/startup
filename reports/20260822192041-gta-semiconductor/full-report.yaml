  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation, buyer map, and who actually pays
        blocks:
          - type: paragraph
            body: >-
              GTA does not sell to end consumers. Its relevant customers are chip design teams, IDMs, module makers,
              automotive Tier 1 suppliers, and system companies that need qualified specialty-process manufacturing for
              power, control, sensing, and mixed-signal devices. The official applications and company-overview pages
              frame demand around automotive electronics, industrial control, high-end consumer electronics, rail
              transit, and new-energy power applications such as inverters, DC-DC converters, OBC, charging piles, and
              power management. That means the buyer, user, and payer are often different. A vehicle OEM may set the
              requirement, a Tier 1 or design house may own the chip program, and GTA gets paid as the foundry platform
              converting that design into qualified wafers.


              Public evidence also suggests that automotive buyers sit at the center of the customer story. GTA
              repeatedly foregrounds VDA 6.3 A-level automotive qualification, IATF16949, automotive-chip manufacturing
              experience, and process families like SiC, IGBT, BCD, PMIC, and controllers. Those are not generic
              web-marketing details; they are procurement signals aimed at customers whose buying process is quality-
              and reliability-led. Industrial and selected high-end consumer customers clearly exist in the company
              narrative, but the deepest public proof is still tied to automotive power and localization use cases.


              The practical implication is that GTA's customer base should be analyzed more like a specialty foundry
              serving program-based accounts than like a broad SaaS logo list. Customer quality depends on design wins,
              qualification progress, repeat tape-outs, and stickiness after production start, not on vanity user
              counts. Public disclosure is therefore strongest on segment fit and named strategic accounts, but weak on
              actual customer counts and revenue mix by cohort.
