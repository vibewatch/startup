chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating model, facilities, and product scope
        blocks:
          - type: paragraph
            body: >-
              GTA Semiconductor's official English site describes the business as "one of the leading manufacturing
              foundries specializing in automotive IC," and that framing is consistent across CB Insights, PitchBook,
              Craft, and multiple Chinese industry articles. This matters because the company is sometimes loosely
              described in startup databases as a semiconductor "manufacturer and developer," which could be misread as
              a fabless analog-chip designer. The evidence reviewed for this chapter points to a specialty-process
              foundry / manufacturing platform: the company fabricates microcontrollers, analog ICs, discrete power
              devices, MEMS, and embedded non-volatile memory for partners, rather than marketing a large independent
              branded chip catalogue of its own.

              The operational footprint is clearly Shanghai-centered. Official company pages place the corporate contact
              point at No. 600 Yunshui Road in Pudong / Lingang and separately disclose fab sites in Lingang and Xuhui.
              The English overview cites two manufacturing facilities in the Shanghai Pilot Free Trade Zone Lingang
              Special Area and in Xuhui District. Official capacity disclosures also show a company already operating at
              national-scale: 70,000 150mm wafers per month, 120,000 200mm wafers per month, and 60,000 300mm wafers per
              month under construction, for 300,000 200mm-equivalent wafers per month overall. Earlier third-party
              reporting in 2023 cited 280,000 monthly wafers including under-construction capacity, which is
              directionally consistent with later official expansion.

              Product and process breadth is broad for a private company. GTA's official technical pages cover BCD,
              HVCMOS, bipolar, embedded NVM, IGBT, MOSFET, TVS, FRD, SiC, and MEMS process families serving automotive,
              industrial control, energy, and high-end consumer electronics. The company therefore sits closer to
              mature-node automotive/power foundry peers than to fabless analog vendors such as TI or Renesas, even
              though end products manufactured on GTA processes overlap those analog and power-management application
              categories.
