      - number: '2.4'
        title: Growth drivers, adoption constraints, and the contradictory China policy context
        blocks:
          - type: paragraph
            body: >-
              The main demand drivers are consistent across sources. The IEA expects global EV sales to reach 23 million
              in 2026, representing 28% of all car sales, with China nearing 60% EV share and Europe approaching
              one-third of new sales. Coherent and FMI both connect this electrification trend to rising demand for
              power electronics, battery management, motor control, ADAS, and software-defined-vehicle compute. ST and
              Infineon make the same point at the device level: SiC in traction inverters improves efficiency, supports
              400V/800V systems, and helps extend range or shrink battery cost. For a foundry focused on automotive
              power and mixed-signal processes, those are powerful secular tailwinds.

              But the constraints are also real. Coherent highlights geopolitical fragmentation, supply-chain shortages,
              and material constraints; Fortune emphasizes the cost, yield, and capital intensity of SiC capacity
              expansion; FMI explicitly cites qualification cycles and fab-capacity allocation as near-term restraints.
              This is where GTA's strategy becomes nuanced: its auto-grade quality credentials and local-policy backing
              are advantages, but they do not exempt it from the same long ramp times, yield learning, and pricing
              pressure that the broader industry faces.

              The China policy context is therefore contradictory in a useful way. Reuters says domestic substitution in
              Chinese auto chips was still below 10% in 2023, which implies large localization headroom. Shanghai's
              project list and Lingang cluster narrative reinforce the existence of active state support for exactly the
              kinds of mature-node, automotive, and SiC capacity GTA is building. Yet CSIS and EE Times warn that China
              may still be adding mature-node capacity faster than global pricing can absorb, while IFRI argues domestic
              demand may absorb much of that buildout. The practical implication is that market growth is likely real,
              but not automatically profitable.
