        title: Global specialty foundries set the benchmark on process breadth, automotive trust, and supply continuity
        blocks:
          - type: paragraph
            body: >-
              Global specialty foundries provide the clearest benchmark for what automotive and power customers can buy
              today from a non-China platform. Tower markets BCD at 65nm and 180nm, supports voltages up to 700V, spans
              8-inch and 12-inch wafers, and emphasizes three manufacturing facilities for operational flexibility. VIS
              offers an unusually explicit specialty power stack: 5V-120V BCD, 200V-700V UHV, and 10V-200V SOI,
              alongside an automotive service program covering 0.8um to 0.11um technologies. X-FAB is even more
              automotive-centered, highlighting IATF 16949 certification across all wafer sites and dedicated SiC and
              GaN capabilities in its Texas and Dresden fabs.


              UMC and GlobalFoundries matter for a different reason: they pair specialty-process capability with global
              manufacturing scale and business-continuity messaging. UMC says it operates 12 fabs with more than 400,000
              12-inch-equivalent wafers per month and IATF 16949 certification across all fabs. GF markets AutoPro
              around 15+ years of automotive experience, hundreds of thousands of wafers shipped, and a U.S./Europe/Asia
              footprint; its BCD pages explicitly market 5V-150V coverage with dual-sourced manufacturing across the
              U.S., Dresden, and Singapore. Those are not just manufacturing facts; they are procurement arguments.


              Against that benchmark, GTA's disclosed technical overlap is credible—especially in BCD, power discrete,
              eNVM, and automotive power applications—but its public English disclosure is thinner. Global peers
              disclose more exact process ranges, more explicit auto programs, and more obvious geographic redundancy.
              That does not make them automatic winners in China, but it does mean GTA's public competitive story is
              currently stronger on regional relevance than on disclosed technical superiority.
