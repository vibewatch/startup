      - number: '8.4'
        title: Final diligence asks and exit readiness keep this as a monitored, not rushed, idea
        blocks:
          - type: paragraph
            body: >-
              From a diligence perspective, the path to a stronger recommendation is very clear. Investors need the cap
              table, preference stack, audited revenue and gross margin, line-level utilization, customer concentration,
              repeat-order behavior, incident history, and the current stage of flagship programs such as
              Infineon-linked work, Geely-linked work, and Zhongqi-linked SiC programs. Without those items, valuation
              remains more narrative-driven than it should be.


              Exit readiness is also incomplete from public evidence. GTA may become an IPO-scale business, but the
              public file today does not show the audited transparency or economics that would let an outside investor
              underwrite a clean near-term public exit. Strategic exit logic exists because automotive and power
              semiconductor assets are valuable, but strategic outcomes in China can be policy-sensitive and may not
              maximize price for minority financial holders.


              The correct investment posture is therefore patience with preparedness. Keep the company on the list, but
              do not waive diligence discipline. The opportunity can get more attractive either through better evidence
              or a better price. Ideally, investors want both.
            claimRefs:
