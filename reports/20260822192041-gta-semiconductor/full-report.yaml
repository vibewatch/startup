      - number: '1.2'
        title: Public leadership, governance visibility, and institutional character
        blocks:
          - type: paragraph
            body: >-
              GTA's public leadership visibility is unusually institutional for a venture-scale company. The strongest
              primary source in this chapter is the January 2026 work-meeting article on the company website, which
              names Huada Semiconductor chairman Sun Jie as the senior figure delivering strategic remarks, Yang Kun as
              party secretary and general manager, Xu Yan as deputy party secretary and meeting host, Tong Xiaoli as
              chief accountant, and Deng Hongbing as discipline-inspection leader. Yicai separately identifies Xu Yan as
              a deputy general manager and a Shanghai Municipal People's Congress deputy, underscoring the company's
              role in Shanghai talent and industrial policy discussions.

              What is not visible is equally important. Official English pages reviewed for this chapter do not publish
              a full board roster, independent directors, voting rights, or a founder biography page. Third-party
              Chinese media often describe the company as being initiated by Huada Semiconductor together with other
              Shanghai state-linked actors, and one December 2025 article says the company integrated the legacy team
              and technology base of Shanghai Advanced Semiconductor. PitchBook also records a 2019 acquisition of
              Advanced Semiconductor Manufacturing Corp. Taken together, the public record points to a state-sponsored
              industrial platform with legacy manufacturing roots, not a conventional founder-branded startup with a
              transparent venture-style leadership page.

              That institutional structure is strategically useful—it aligns GTA with policy support and capital
              access—but it also creates governance diligence gaps. The exact equity stakes, board control rights, and
              whether December 2025 personnel changes altered governance influence are not publicly described in the
              sources reviewed. That is a real diligence issue because the company is already operating at
              multi-billion-dollar private scale while remaining financially opaque.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
