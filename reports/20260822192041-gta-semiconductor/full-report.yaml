      - number: '6.3'
        title: Retention, repeat usage, and what durability can actually be proven
        blocks:
          - type: paragraph
            body: >-
              GTA's public customer evidence is stronger on prerequisites for stickiness than on measured retention
              itself. Specialty foundry relationships in automotive power usually require qualification effort, process
              alignment, and long validation cycles before production ramps, which can make approved suppliers sticky
              once designed in. EET China's discussion of auto foundry selection emphasizes exactly this point: for
              customers, the core question is no longer simply whether capacity exists, but whether a foundry can
              deliver stably over time, pass system certification, and support ongoing product iteration. Qualification
              frameworks such as AEC-Q100 and related automotive reliability processes reinforce that procurement
              friction. That logic supports a directional view that recurring relationships can be durable.


              However, GTA does not publicly disclose NRR, GRR, churn, contract duration, tape-out repeat rates,
              customer lifetime, or account-level expansion curves. The official site claims customer recognition and
              highlights quality systems, but it does not publish outcome metrics such as renewals, defect ppm by
              customer, field returns, or share of wallet. As a result, public retention analysis must stay honest:
              durability is an inference from industry mechanics and named repeat-oriented collaborations, not a
              demonstrated KPI set.


              The best public durability proxy is the presence of multi-stage relationships rather than one-off logos.
              Geely extends beyond a generic MOU into joint R&D and manufacturing alignment. Zhongqi includes delivered
              devices and follow-on product cooperation. Infineon links GTA to deeper specialty-process and memory
              collaboration. Those are positive signs, but they still fall short of showing cohort retention or economic
              expansion. This chapter therefore treats retention as plausibly favorable in qualified automotive
              programs, while flagging the absence of hard customer-success metrics as a major diligence gap.
