      - number: '1.4'
        title: Manufacturing milestones, technology expansion, and strategic partnerships
        blocks:
          - type: paragraph
            body: >-
              GTA's milestones show a company moving from legacy specialty foundry roots into a broader 12-inch and
              SiC-driven automotive platform. The official chronology is especially useful here because it captures
              tangible industrial progress rather than marketing slogans. In June 2023 the company announced successful
              completion of its 12-inch automotive-chip pilot line, noting that 12-inch BCD wafers had first entered
              production in February 2023 and that the WAT test results fully met targets. The same release positioned
              the line as a vehicle for 90nm-to-40nm automotive MCU, analog IC, and CIS manufacturing.

              GTA then expanded its technology story beyond classical power devices. In December 2023 it announced a
              jointly developed 110nm ferroelectric-memory product with Wuxi Shunming, claiming meaningful density and
              reliability improvements and planned 1Q24 mass production. By 2025 the company won a China Electronics
              "advanced smart factory" designation for its automotive-electronics chip plant. In April 2026 GTA hosted a
              semiconductor innovation conference with more than 260 ecosystem participants, used the event to position
              itself around solution-oriented foundry services, and signed a cooperation agreement with Infineon around
              embedded NVM and specialty-process upgrading.

              The public-policy layer reinforces the operating milestones. Shanghai's 2026 major-project list still
              includes GTA's specialty-process production-line project, and Shanghai's 2025 Lingang six-year
              retrospective treats GTA as one of the anchor projects that helped seed the district's integrated-circuit
              cluster. In other words, GTA is not a static legacy fab; it remains in an active expansion and
              ecosystem-building phase that later chapters should treat as central to the investment case.
