              Eastmoney and Sohu coverage of the December 2025 event say registered capital rose to RMB 17.9 billion and
              added shareholders were visible, but the actual cash amount of that event was not publicly disclosed.


              The use of funds is easier to infer than the cash balance. GTA's 12-inch automotive-chip pilot line,
              Shanghai major-project inclusion, smart-factory milestone, and continued 2026 technical roadmap all point
              toward heavy spend on fabs, equipment, automation, and process-platform capability. That is consistent
              with the broader specialty-foundry playbook illustrated by Hua Hong's annual report and Tower's expansion
              commentary.


              What cannot be underwritten publicly is current runway. No source reviewed states cash on hand, monthly
              burn, undrawn credit facilities, project-finance terms, or debt-service profile for GTA. The company may
              be well funded relative to many startups, but it is still reasonable to treat it as financing-dependent
