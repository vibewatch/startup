  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'China direct peers: specialty auto and power foundries, not fabless analog brands'
        blocks:
          - type: paragraph
            body: >-
              GTA's direct competitive set is narrower than generic startup databases suggest. The company markets
              itself as an automotive-focused manufacturing foundry and discloses platforms including BCD, IGBT, MOSFET,
              SiC, embedded memory, and mixed-signal process capabilities. That means the nearest comparison class is
              specialty foundries that sell automotive- and power-oriented manufacturing capacity, not branded analog
              vendors like Texas Instruments or Renesas at the packaged-chip layer. CB Insights and PitchBook both place
              GTA in a manufacturing / semiconductor-company frame, and GTA's own 2026 seminar language pushes further
              toward a solution-foundry model built around storage, control, drive, and power integration.


              Inside China, Hua Hong looks like the closest public analog. HHGrace explicitly describes itself as a
              global leading pure-play foundry using an '8-inch + 12-inch' plus 'Specialty IC + Power Discrete' strategy
              and says its quality-control system satisfies strict automotive-chip manufacturing requirements. SMIC is
              also relevant, but as a broader national pure-play foundry rather than a specialty-auto pure play: its
              automotive-service page emphasizes IATF 16949, AEC-Q100, and VDA 6.3 recognition, yet public descriptions
              still place it in a wider mainstream foundry category. For Chinese customers prioritizing local automotive
              substitution and policy-aligned sourcing, GTA, Hua Hong, and SMIC form the most practical domestic
              shortlist.


              The domestic opportunity is real because Reuters reported auto-chip localization in China was still below
              10% in 2023. But that same policy push also means multiple Chinese foundries are expanding against
              overlapping power, MCU, and automotive categories. So the most important question is not whether GTA has
              peers—it clearly does—but whether its domestic process mix, auto qualification, and ecosystem positioning
              are strong enough to avoid becoming just another mature-node capacity option.
