  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: strategically credible, but price discipline matters more than admiration'
        blocks:
          - type: paragraph
            body: >-
              GTA is easier to like as a company than as an immediate investment at any price. Earlier chapters
              established a coherent strategic story: China auto and power semiconductor demand is large, mature-node
              localization has policy support, GTA has visible specialty-process breadth, named customer proof exists,
              and the company has raised enough capital to become a serious player. Those facts explain why late-stage
              private marks climbed to roughly the low- to mid-single-digit billions of U.S. dollars. They do not, by
              themselves, prove that the current price is attractive for a financial investor.


              The public file still lacks the core denominators required to move from admiration to conviction: revenue,
              gross margin, utilization by line, repeat-customer economics, concentration by account, and the real
              preference stack. That matters even more in a capital-intensive foundry where equity returns depend
              heavily on loading, margin stability, and dilution discipline. In other words, GTA may already deserve a
              strategic scarcity premium, but the public evidence is too thin to prove that investors are being paid
              enough for concentration, capex, and execution risk at the rumored mark.


              My recommendation is therefore Track / Research More rather than Buy or Pass. It is not a negative verdict
              on the asset. It is a statement that price sensitivity and evidence sensitivity should dominate the
              decision. If private diligence shows strong loading, clean economics, manageable preferences, and
              resilient anchor customers, the case can improve quickly. If not, the current valuation already leaves
              less margin for error than the public file would justify.
