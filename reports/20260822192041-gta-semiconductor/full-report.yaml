  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and what GTA actually sells into
        blocks:
          - type: paragraph
            body: >-
              GTA's market boundary has to be defined carefully, because the company is easy to misclassify. Its own
              technical and application pages show a specialty foundry serving automotive electronics, industrial
              control, energy, and high-end consumer electronics through process platforms such as BCD, IGBT, MOSFET,
              SiC, MEMS, MCU-related logic, and embedded memory. That means the relevant market is not "all
              semiconductors" and not even the full branded analog-chip market. GTA is selling process capacity and
              manufacturing capability into categories where buyers care about automotive-grade reliability, power
              efficiency, voltage class, and long-term wafer supply.

              The clearest included-spend buckets are automotive power electronics, automotive MCUs and control ICs,
              analog and mixed-signal automotive devices, discrete power devices, automotive-grade SiC, embedded memory
              used in automotive or industrial control, and adjacent industrial/energy power electronics. Included
              buyers are not only chip design teams; they also include tier-one module suppliers, OEM platform
              engineers, EV-system integrators, and powertrain architects. Future Market Insights explicitly describes
              buyers as OEM platform engineering teams and tier-one electronics suppliers evaluating performance,
              qualification, and long-term supply commitment.

              Excluded spend matters too. GTA is not competing for leading-edge smartphone APs, AI training GPUs,
              cutting-edge logic below the mature-node auto/power range, or commodity consumer SoCs where its disclosed
              process mix offers no evidence of relevance. The company may benefit indirectly from general semiconductor
              demand, but its valuation is more tightly governed by automotive and industrial electrification than by
              the frontier-compute cycle. This is why the chapter uses multiple sizing lenses rather than a single
              inflated semiconductor TAM.
