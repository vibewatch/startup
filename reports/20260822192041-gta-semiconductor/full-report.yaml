      - number: '1.5'
        title: Adverse considerations and the biggest remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not a classic scandal or fraud story; it is a combination of opacity, capital
              intensity, and a potentially difficult industry backdrop. The clearest company-originated signal is the
              January 2026 work-meeting language itself: management framed the environment as a "complex and severe"
              operating situation and emphasized increasing revenue while reducing losses. That suggests GTA had not yet
              reached a stable profitability posture even after very large capital inflows and years of capacity
              build-out.

              External market analysis makes the risk more concrete. CSIS and EE Times argue that China is expanding
              mature-node semiconductor capacity faster than global demand growth can comfortably absorb, putting
              pricing and utilization at risk in the exact automotive, analog, and power-node categories where GTA
              operates. IFRI offers a softer counter: China may consume much of its own mature-node output domestically,
              which could reduce the probability of simple export-led oversupply. The correct takeaway is not that
              overcapacity is fake, but that GTA's downside is tightly linked to how much domestic automotive,
              industrial, and energy demand can absorb new capacity without margin compression.

              The other material problem is missing disclosure. Official company materials reviewed for this chapter do
              not disclose revenue, ARR, gross margin, burn, customer concentration, or a complete board and ownership
              map. Public reports also do not disclose the cash amount or formal post-money valuation of the December
              2025 event. For a late-stage semiconductor platform that may already carry an implied US$4B+ valuation,
              those omissions are large enough to keep the company in the "research more / track" bucket rather than a
              clean high-conviction underwriting case.
            claimRefs:
              - CO023
              - CO037
              - CO038
              - CO039
              - CO040
              - CO041
              - CO045
