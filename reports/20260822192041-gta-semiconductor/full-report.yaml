      - number: '2.2'
        title: 'Sizing lenses: automotive semis, power electronics, and automotive-grade SiC'
        blocks:
          - type: paragraph
            body: >-
              Public 2026 market estimates give a usable but imperfect lens stack. Future Market Insights pegs the 2026
              global automotive semiconductor market at US$76.0 billion, while Coherent Market Insights places it at
              US$83.84 billion. Those estimates are directionally consistent enough to define a broad 2026
              automotive-electronics opportunity in the high-double-digit billions. FMI also breaks out the structure of
              that market: passenger vehicles represent 62.7% of 2026 demand, powertrains 31.0% of application demand,
              and OEM channels 73.0% of sales-channel demand. Coherent, meanwhile, says power electronics alone account
              for 35.7% of the 2026 automotive semiconductor market, making GTA's power-focused positioning more central
              than peripheral.

              The more specific SiC lens is smaller but strategically closer to GTA's differentiation. Fortune Business
              Insights values the global automotive-grade SiC components market at US$8.24 billion in 2026, growing to
              US$31.91 billion by 2034 at a 21.3% CAGR, with Asia Pacific already holding 76.14% of 2025 share. onsemi's
              SiC ecosystem article provides a broader cross-check from the supplier side, projecting the total SiC
              addressable market (not just automotive) from US$2 billion in 2021 to US$6.5 billion in 2026. Taken
              together, these sources imply that GTA's automotive SiC wedge is fast-growing but still materially smaller
              than the broader auto-semi market.

              The most realistic top-down view is therefore layered rather than singular: automotive semiconductors
              define the broad TAM, power electronics and mature-node auto control categories define the nearer SAM, and
              China/Asia-centric automotive-grade SiC plus mature-node foundry demand define the most plausible SOM
              corridor. That is a tighter and more useful sizing frame for GTA than quoting the whole semiconductor
              industry.
