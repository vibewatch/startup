callouts:
- calloutType: insight
  title: The wrong competitor frame inflates or distorts GTA's moat
  body: If GTA is compared against TI or Renesas as if it were a packaged analog vendor, the analysis misses the real rivalry. The operational contest is primarily among specialty foundries and auto-qualified manufacturing platforms.
  claimRefs:
  - CP001
  - CP002
  - CP024
  - CP028
- calloutType: risk
  title: Certificates are necessary but no longer differentiating
  body: Many rivals now market IATF, VDA, or zero-defect style messages. GTA still needs customer proof, continuity evidence, and economics—not just credentials—to convert quality signals into moat.
  claimRefs:
  - CP018
  - CP026
  - CP034
  - CP038
- calloutType: insight
  title: GTA's best edge is regional fit plus ecosystem ambition
  body: Localization tailwinds and the 2026 solution-foundry narrative give GTA a plausible differentiated story in China. That story is strongest when customers value domestic supply, automotive power relevance, and co-development over global diversification.
