  evidenceGaps:
  - type: missing-source
    severity: material
    topic: gtasemi-pricing-and-share
    missingEvidence: No public source reviewed discloses GTA's wafer pricing bands, gross margins, customer share, or competitive win/loss data against named peers.
    whyItMatters: Without pricing and share data, public competitor ranking is based on capability and disclosure surfaces rather than commercial outcomes.
    diligencePath: Request anonymized price corridors, gross-margin by process family, and win/loss records for auto-power programs.
    relatedQuestionRefs:
    - QP009
    - QP020
    - QP024
  - type: private-evidence-only
    severity: material
    topic: qualification-depth
    missingEvidence: Public pages mention automotive credentials but do not provide comparative ppm data, audit findings, or customer qualification-cycle durations across the peer set.
    whyItMatters: Automotive manufacturing trust is won on operating detail, not just certificate badges.
    diligencePath: Request VDA / customer audit summaries, field-failure metrics, qualification lead times, and requalification history.
    relatedQuestionRefs:
    - QP004
    - QP012
    - QP019
  - type: conflicting-data
    severity: moderate
    topic: capacity-risk
    missingEvidence: Independent experts disagree on whether Chinese mature-node expansion is a global overcapacity threat or a largely absorbable domestic buildout.
    whyItMatters: The answer materially changes whether GTA's new capacity is a moat amplifier or a margin risk.
    diligencePath: Model downside utilization using customer pipeline data, subsidy dependence, and peer pricing behavior instead of relying on macro commentary alone.
    relatedQuestionRefs:
    - QP018
    - QP022
    - QP025
