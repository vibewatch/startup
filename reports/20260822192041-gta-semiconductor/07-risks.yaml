- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations are visible; kill criteria must stay concrete
  body: >-
    The encouraging part of GTA's risk profile is that it is not unmanaged. Official pages show named control systems for ESH, quality, supplier conduct, IP handling, and training. Shanghai policy support, major-project visibility, local ecosystem density, and strategic customer partnerships all provide some buffer against pure execution isolation. Those are meaningful mitigants and should lower the probability of random failure relative to a much smaller or more opaque fab project.


    But visible mitigants do not remove the need for hard kill criteria. Investors should pre-commit to a small number of thesis-break events: a major environmental or safety incident; evidence of acute underutilization or prolonged delay on key specialty lines; loss, pause, or downsizing of an anchor customer relationship; inability to fund the next phase of capex without unattractive terms; or a geopolitical/legal event that materially impairs talent mobility, partner trust, or equipment access. These triggers matter because they attack the same trust and utilization foundations that make the bull case possible.


    In other words, GTA is investable only if discipline remains measurable. The right diligence stance is not “risks are too high,” but “risks are high enough that monitoring must be specific, frequent, and unforgiving.”
