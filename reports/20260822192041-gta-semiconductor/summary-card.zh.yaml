summary:
  headline: >-
    GTA Semiconductor
    似乎是中国汽车和功率半导体链条中战略相关性较高的特色晶圆代工资产之一，但公开记录不足以支撑当前私人估值，除非有更强的私下证据。基于公开信息，合理立场是继续研究：品类价值和战略稀缺性真实存在，但可承销的股权回报仍取决于产能加载、毛利率转化、客户集中度、稀释纪律，以及无重大事故的执行。
