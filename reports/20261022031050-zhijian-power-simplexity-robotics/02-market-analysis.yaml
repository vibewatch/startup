callouts:
  - calloutType: risk
    title: Category growth is not company demand
    body: >-
      Simplexity's small-batch and proof-of-concept status means category forecasts should
      not be capitalized as company revenue. Paid pilots, repeat deployments, uptime,
      intervention rates, and fully loaded customer ROI are the missing bridge.
    claimRefs: [CM002, CM012, CM013]
