        Named paid deployments, site counts, contract values, paid-versus-free pilot status,
        conversion rates, repeat orders, and deployment capacity by target segment.
      whyItMatters: >-
        Without a paid installed base and conversion assumptions, category forecasts cannot
        be translated into a defensible Simplexity SAM, SOM, or revenue ramp.
      diligencePath: >-
        Obtain a customer-level deployment ledger, contracts and invoices, pilot funnel,
        repeat-order history, and management's capacity plan; confirm a sample directly with customers.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002, TM003]
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        Underlying analyst methodologies, category definitions, base years, geographic
        splits, unit-price assumptions, and software-versus-hardware allocations.
      whyItMatters: >-
        The retained estimates use incompatible boundaries and cannot establish a
        company-specific addressable market or a reliable forecast range.
      diligencePath: >-
        Acquire the cited IDC, MarketsandMarkets, SkyQuest, CCID, and TrendForce reports
        and reconcile their taxonomies and denominators in a single sizing model.
      relatedQuestionRefs: [QM002, QM007, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-economics
      missingEvidence: >-
        Simplexity pricing, integration and service costs, uptime, intervention rate,
        throughput, safety acceptance, buyer budget owner, and customer payback period.
      whyItMatters: >-
        These metrics determine whether a general-purpose robot displaces labor,
        task-specific automation, or incumbent warehouse systems.
      diligencePath: >-
        Review pilot scorecards and total-cost-of-ownership models with plant and warehouse
        buyers, then compare results with incumbent automation bids.
      relatedQuestionRefs: [QM003, QM005, QM008]
      relatedTableRefs: [TM001, TM003]
    - type: missing-source
      severity: minor
      topic: standards-compliance
      missingEvidence: >-
        Simplexity's certification roadmap, safety case, test results, incident history,
        and named owner for compliance with emerging Chinese standards.
      whyItMatters: >-
        Standards and site-safety acceptance can delay deployment and add engineering,
        insurance, and service costs even when technical demonstrations succeed.
      diligencePath: >-
        Request the compliance matrix, third-party test reports, safety organization chart,
        incident log, and customer site-acceptance criteria.
      relatedQuestionRefs: [QM005, QM006]
