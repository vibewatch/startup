    columns: ["Argument", "Supporting evidence", "What would change the view"]
    rows:
      - ["Humanoid adoption may be entering external-sales commercialization.", "Morgan Stanley forecast cited by CNBC separates external sales from prototypes and internal use.", "Evidence that Simplexity has paid external deployments with repeat orders."]
      - ["Standards and safety frameworks can improve enterprise adoption.", "SESEC describes a lifecycle standards system; ISO 10218-1 defines robot safety scope and integration boundary.", "Independent certification, incident record, uptime, and customer acceptance evidence."]
      - ["Peer financing and public-market activity can create exit options.", "Sector reporting describes large peer financings and public-market filings.", "Comparable terms, audited revenue quality, and a documented path to liquidity for Simplexity."]
      - ["Market growth can be mistaken for company value.", "Market forecasts and peer disclosures do not disclose Simplexity revenue, margin, or ownership.", "A reconciled cap table, revenue ledger, margin bridge, and valuation methodology."]
    notes: "Peer and market data are directional comparables only; they are not a valuation of Simplexity Robotics."
    claimRefs: [CV002, CV006, CV007, CV010, CV011]
  - id: TV003
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "Paid industrial deployments scale, repeat orders emerge, and safety/integration diligence clears.", "Potential upside is supported only by verified revenue or a comparable revenue multiple; no numeric target is supportable now.", "Execution, safety, supply chain, and customer concentration.", "Low-to-medium: market evidence is positive, company evidence is missing."]
      - ["Base", "Pilots continue but conversion and unit economics remain uneven.", "Track or research-more; preserve capital until a price and revenue denominator are documented.", "Burn, dilution, preference overhang, and slow commercialization.", "Medium: consistent with the current evidence gap."]
      - ["Bear", "Commercial conversion lags forecasts or integration and safety requirements delay deployments.", "Downside can include a down round or impaired liquidity; no loss percentage is estimated without entry price.", "Multiple compression, financing need, and regulatory/customer blockers.", "Material: adverse evidence is limited, but the missing denominator is itself decision-relevant."]
      - ["Decision gate", "Management supplies cap table, customer contracts, revenue and margin bridge, safety metrics, and cash runway.", "Re-underwrite price, dilution, and return only after denominator and terms are verified.", "Incomplete or internally inconsistent data.", "Required before any buy recommendation."]
    notes: "Scenarios are qualitative because the assigned sources contain no Simplexity revenue, valuation, cash, or cap-table denominator; they are not probability-weighted financial forecasts."
    claimRefs: [CV003, CV004, CV008, CV012, CV013]
