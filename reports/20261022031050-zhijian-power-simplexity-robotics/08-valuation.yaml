chapter:
  number: 8
  title: Valuation
  summary: "Public evidence supports a fast-growing humanoid-robotics market and increasingly credible public comparables, but it does not disclose Simplexity Robotics' revenue, cap table, financing terms, or valuation basis. The appropriate stance is research-more: retain exposure only with price and diligence discipline, rather than underwrite a precise intrinsic value."
sections:
  - id: evidence-and-investment-call
    title: "Evidence and investment call"
    body: "Simplexity Robotics sits in a market where commercialization expectations have moved materially upward, but the available evidence is market-level rather than company-level. CNBC reports that Morgan Stanley expects 50,000 humanoid robots to ship in China in 2026, a $2 billion market this year, and a $15 billion market by 2030; the forecast excludes prototypes, pre-order trials, and internal-use units. That distinction matters: it separates external sales from demonstrations, but it still does not establish Simplexity's paid deployments, revenue, margin, or repeat orders. Public sector coverage also shows that comparable companies are raising large rounds, reporting revenue, or approaching public markets, yet those are comparables, not substitutes for a company-specific cap table. The investment call is therefore research-more, with high risk and an indeterminate valuation stance until the entry price and financing terms are verified. A buy decision would require named customers, audited or management revenue, financing documents, preference terms, and evidence that deployments convert into recurring commercial revenue."
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: "Thesis, anti-thesis, and price discipline"
    body: "The positive thesis is that sector adoption is moving from demonstrations toward factory, logistics, and retail use cases, while standards activity is becoming more formal. CNBC cites factory, logistics, unmanned-retail, and interactive-service rollouts in Morgan Stanley's field research; SESEC describes a 2026 Chinese standards system spanning foundational standards, intelligent computing, complete systems and integration, applications, and safety and ethics. The anti-thesis is that market forecasts can capitalize anticipated adoption before unit economics are proven, and safety standards do not prove a vendor's compliance or commercial success. ISO 10218-1 covers the robot as a machine and explicitly points to ISO 10218-2 for integration; it also excludes several use cases, including mobile platforms and public-access service robots. For Simplexity, price discipline should therefore be milestone-based: pay only against verified paid deployments, gross-margin evidence, safety/compliance ownership, and financing terms that do not create hidden preference or dilution overhang."
    claimRefs: [CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: "Scenarios, exit readiness, and diligence"
    body: "A scenario framework is more defensible than a point valuation because the assigned evidence does not disclose Simplexity's revenue base, cash burn, valuation, or financing terms. The bull case assumes the company converts technical capability into paid industrial deployments and benefits from the expanding external-sales market; the base case assumes pilots and partnerships remain difficult to translate into repeatable revenue; the bear case assumes commercialization lags the market narrative, while safety, integration, or funding requirements consume capital. Public comparable coverage is directionally useful: a sector article reports Galaxy General's claimed $151 million round and more than $330 million of total investment, while another report describes other Chinese robotics companies' disclosed revenue, margins, orders, and funding. These figures are not directly comparable to Simplexity because issuer, accounting basis, product mix, and stage differ. Exit readiness is not demonstrated. The next diligence gate is a data room tying price to a dated cap table, preference waterfall, customer contracts, deployment economics, safety evidence, and a cash runway model."
    claimRefs: [CV010, CV011, CV012, CV013]
    tableRefs: [TV003]
  - id: exhibits
    title: Exhibits
    body: "The exhibits preserve the distinction between market evidence, peer disclosures, and unresolved company-specific valuation inputs. No precise target return or intrinsic-value point estimate is presented because the retained sources do not provide a defensible Simplexity revenue, margin, cash, or cap-table denominator. This restraint is intentional: a peer financing headline can inform diligence questions, but it cannot establish a comparable multiple without matching stage, product mix, accounting basis, ownership, and preference terms. The reader should treat every scenario as a gate for evidence collection, not as a forecast."
    claimRefs: [CV004, CV010]
