evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, independent director information, safety ownership and senior-management roster.
    whyItMatters: Founder concentration and missing safety accountability affect execution resilience and deployment risk.
    diligencePath: >-
      Request the current organization chart, board materials, delegated authorities and safety/compliance ownership
      from management.
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: material
    topic: commercial-scale
    missingEvidence: Named customers, paid contracts, deployment sites, units delivered, uptime, repeat orders and renewal evidence.
    whyItMatters: PoC validation and small-batch production do not establish product-market fit or recurring economics.
    diligencePath: Obtain customer references, redacted contracts, site-level deployment logs and a paid-versus-free pilot bridge.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: funding
    missingEvidence: >-
      Round-by-round financing dates, post-money capitalization, ownership, liquidation preferences, debt and cash
      balance.
    whyItMatters: >-
      Headline funding and valuation figures cannot be translated into investor returns or available runway without
      terms and liquidity.
    diligencePath: >-
      Request signed financing summaries, cap table, debt schedule, latest bank balance and use-of-proceeds
      reconciliation.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: Current headcount, manufacturing staffing, attrition and senior engineering coverage.
    whyItMatters: The reported execution pace may depend on a small founder-centered team whose scalability is not yet visible.
    diligencePath: Request a dated employee census by function and location, hiring plan and key-person retention arrangements.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: company-sam-som
    missingEvidence: >-
      Named paid deployments, site counts, contract values, paid-versus-free pilot status, conversion rates, repeat
      orders, and deployment capacity by target segment.
    whyItMatters: >-
      Without a paid installed base and conversion assumptions, category forecasts cannot be translated into a
      defensible Simplexity SAM, SOM, or revenue ramp.
    diligencePath: >-
      Obtain a customer-level deployment ledger, contracts and invoices, pilot funnel, repeat-order history, and
      management's capacity plan; confirm a sample directly with customers.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Underlying analyst methodologies, category definitions, base years, geographic splits, unit-price assumptions, and
      software-versus-hardware allocations.
    whyItMatters: >-
      The retained estimates use incompatible boundaries and cannot establish a company-specific addressable market or a
      reliable forecast range.
    diligencePath: >-
      Acquire the cited IDC, MarketsandMarkets, SkyQuest, CCID, and TrendForce reports and reconcile their taxonomies
      and denominators in a single sizing model.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Simplexity pricing, integration and service costs, uptime, intervention rate, throughput, safety acceptance, buyer
      budget owner, and customer payback period.
    whyItMatters: >-
      These metrics determine whether a general-purpose robot displaces labor, task-specific automation, or incumbent
      warehouse systems.
    diligencePath: >-
      Review pilot scorecards and total-cost-of-ownership models with plant and warehouse buyers, then compare results
      with incumbent automation bids.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM008
    relatedTableRefs:
      - TM001
      - TM003
  - type: missing-source
    severity: minor
    topic: standards-compliance
    missingEvidence: >-
      Simplexity's certification roadmap, safety case, test results, incident history, and named owner for compliance
      with emerging Chinese standards.
    whyItMatters: >-
      Standards and site-safety acceptance can delay deployment and add engineering, insurance, and service costs even
      when technical demonstrations succeed.
    diligencePath: >-
      Request the compliance matrix, third-party test reports, safety organization chart, incident log, and customer
      site-acceptance criteria.
    relatedQuestionRefs:
