company:
  name: "Zhijian Power / 至简动力 / Simplexity Robotics"
chapter:
  number: 3
  title: Competitors
  summary: >-
    Zhijian Power enters a crowded Chinese embodied-robotics field where AgiBot,
    Unitree, UBTech, Galaxy General, 智平方, and other specialists are
    differentiating through shipment scale, industrial deployment, full-stack
    control, or capital access. Public evidence supports a high-intensity
    competitive landscape, but does not yet establish Zhijian Power's relative
    shipment, pricing, uptime, or customer-retention advantage.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The relevant competitive set is broader than humanoid start-ups alone.
      AgiBot and Unitree are visible scale and brand leaders in China, while
      UBTech emphasizes industrial humanoids and coordinated factory work.
      Galaxy General, 智平方, and Zhijian Power represent full-stack,
      model-led approaches with industrial ambitions. Leju addresses education
      and research as well as full-height platforms, and XPeng brings an
      automotive manufacturing and distribution option. Customers can also buy
      application-specific robots, retain conventional automation, or build
      integrations internally. That creates a substitution boundary: a
      general-purpose robot must justify flexibility against the reliability,
      throughput, and task economics of a dedicated machine.
    claimRefs: [CP002, CP003]
    tableRefs: [TP001]
  - id: profiles
    title: Peer profiles and differentiation
    body: >-
      Publicly reported peer evidence shows several distinct routes to
      differentiation. AgiBot's reported 2025 shipment volume and deployments
      in factories and service locations indicate a scale-and-scenario route.
      Unitree combines consumer visibility, international distribution, and
      reported profitability, although shipment estimates differ between
      independent reporting and the CEO's claim. UBTech's Walker line is
      positioned around automotive and logistics workflows, battery swapping,
      and multi-robot coordination. Galaxy General emphasizes a large
      industrial payload and retail footprint; 智平方 emphasizes a
      self-developed model and a large order; Leju remains more education and
      research oriented. These are materially different wedges rather than a
      single homogeneous peer group.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: buying-criteria
    title: Buying criteria, pricing, and switching
    body: >-
      The available pool does not provide comparable realized prices or
      contract terms for Zhijian Power and its peers. One public reference
      places Unitree's G1 starting price at $13,500, but that is a list price
      for a specific model and is not evidence of deployed-system economics.
      The better-supported buying criteria are task fit, reliability,
      integration with factory systems, operator dependence, supply access,
      and serviceability. A buyer may prefer application-specific equipment
      when a general-purpose platform cannot match its efficiency. Switching
      costs should rise with accumulated task data, workflow integration,
      custom end-effectors, and validated safety procedures, but no public
      source in this pool quantifies Zhijian Power's lock-in or renewal rates.
    claimRefs: [CP011, CP012, CP013, CP014]
    tableRefs: [TP003]
  - id: durability-risk
    title: Moat durability and displacement risk
    body: >-
      The industry's strongest apparent moats are manufacturing scale, access
      to real operating data, component and supply-chain control, and trusted
      deployment channels. They remain contestable. TrendForce describes a
      shift toward tangible user value and reports rapid scaling by leading
      vendors, while independent commentary warns that many demonstrations
      remain technology showcases rather than reliable industrial systems.
      Public reporting also identifies overcapacity and bubble risk as
      production expands faster than orders. For Zhijian Power, former
      Li Auto leadership and a world-model-plus-hardware thesis may aid
      recruiting and technical execution, but the pool does not prove that
      those assets translate into lower cost, safer operation, or durable
      customer preference. Incumbent response and dedicated-robot
      substitution therefore remain material risks.
    claimRefs: [CP015, CP016, CP017, CP018]
callouts:
  - calloutType: insight
    title: Scale is already a competitive variable
    body: >-
      The clearest public peer signal is not a feature checklist but the
      ability to manufacture, deploy, and learn at volume. AgiBot's reported
      shipments and Unitree's reported 2025 scale set a bar that Zhijian
      Power's public PoC disclosures do not yet match.
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Commercial proof remains the unresolved discriminator
    body: >-
      Public evidence identifies large orders, pilots, and deployment claims
      across peers, but the pool does not provide a comparable paid-vs-free
      status, uptime, repeat-order, or realized-price dataset for Zhijian
      Power.
    claimRefs: [CP014, CP018]
