chapter:
  number: 5
  title: "Product & Technology"
  summary: "Public evidence describes Zhijian Power as an embodied-AI robotics company combining a world-model/VLA approach with physical robot development, but the strongest technical detail available is an attributed LaST0 research paper rather than a company-controlled technical specification. The architecture is promising on paper, while deployment maturity, safety controls, integration interfaces, and production reliability remain materially unverified."
sections:
  - id: product-and-workflow
    title: "Product definition and customer workflow"
    body: "The public product description places Zhijian Power at the intersection of a robotics foundation model and robot bodies intended for industrial and service settings. A March 2026 Sina Finance report says the company planned to work on base-model training, robot-body development and iteration, data collection, and core algorithms, with expansion from factories into manufacturing and service scenarios. The same report describes LaST0 as combining a world model's physical prediction with a VLA fast/slow system. This gives a coherent workflow hypothesis: observe a physical scene, infer a temporally extended state, generate an action, collect embodied data, and improve the model. It does not establish a sellable SKU, a named customer workflow, a paid deployment, or a measured production benefit. The LaST0 project page lists demonstrations such as placing a dish on a rack, wiping a whiteboard, scooping popcorn into a bowl, and opening a pot to pick corn; these are useful task examples, not evidence that Zhijian Power has commercialized them."
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: "Architecture, operating model, and maturity"
    body: "The LaST0 paper provides the clearest public architecture description associated with the company's reported technical direction. It describes a latent spatio-temporal chain of thought that models future visual dynamics, 3D structure, and robot proprioception, with a low-frequency reasoning expert and a high-frequency acting expert implemented through a Mixture-of-Transformers design. The paper reports evaluation across 10 real-world tasks and states that mean success rates improved by 13%, 14%, and 14% over prior methods across tabletop, mobile, and dexterous manipulation categories. Those are paper-reported results, not a company deployment guarantee. The paper's project page lists demonstrations but no public API, integration specification, uptime record, manufacturing bill of materials, or service-level commitment. A March 2026 company profile additionally describes an intended data loop using on-device collection and human demonstrations, but it does not provide dataset size, labeling protocol, sim-to-real validation, or reproducibility artifacts. The resulting maturity assessment is research-prototype to early productization, not proven production infrastructure."
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-safety-and-implementation
    title: "Trust, safety, security, and implementation risk"
    body: "The available evidence supports a real technical risk surface but not a completed control framework. China’s 2026 standards system for humanoid robots and embodied intelligence covers data lifecycle, model training, inference, deployment, applications, safety, and ethics, while its published work includes embodied-model system requirements, data-quality specifications, trustworthiness requirements, evaluation guidelines, and full-lifecycle management. Separately, the translated Personal Information Protection Law requires security measures such as internal operating procedures, categorical management, encryption or de-identification, access control, training, incident plans, and periodic compliance audits for personal-information handling. These external requirements are not evidence that Zhijian Power complies with them. They define diligence gates for any robot system collecting images, voice, human demonstrations, or workplace telemetry. Public materials also do not verify collision testing, fail-safe behavior, cybersecurity architecture, incident reporting, component traceability, maintenance procedures, or deployment acceptance criteria. These gaps are especially important because the company narrative emphasizes real-world data collection and expansion from closed to more open environments."
    claimRefs: [CE010, CE011, CE012, CE013]
callouts:
  - calloutType: strength
    title: "Research architecture has a credible control rationale"
    body: "The dual-rate latent reasoning design directly targets the latency and physical-state representation problems that make general-purpose robot control difficult, and the paper reports results across tabletop, mobile, and dexterous tasks."
    claimRefs: [CE005, CE006, CE007]
  - calloutType: risk
    title: "Commercial maturity is not demonstrated"
    body: "The public record does not establish production deployments, named operating customers, reliability metrics, safety cases, integration interfaces, or an independently verified data flywheel."
    claimRefs: [CE003, CE008, CE009, CE013]
