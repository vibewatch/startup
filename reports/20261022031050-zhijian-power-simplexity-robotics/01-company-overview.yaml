company:
  name: "Zhijian Power / 至简动力 / Simplexity Robotics"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Simplexity Robotics is a Hangzhou-based embodied-AI startup founded in July 2025 by former Li Auto executives. Current public evidence describes a fast-financed, full-stack robotics company with two generations of hardware, small-batch production and PoC validation, but does not establish paying-customer scale, audited financial performance, or independently verified valuation."
sections:
  - id: identity-and-product
    title: "Identity, product and operating footprint"
    body: "Public reporting places Simplexity Robotics in Hangzhou and dates its establishment to July 2025. The founding group is identified as Jia Peng, Wang Kai and Wang Jiajia, all former Li Auto executives, with roles reported as CEO, chairman and COO respectively. The company describes a full-stack embodied-intelligence approach spanning models, control software and robotic hardware, with the LaST₀ foundation model, ManualVLA long-horizon task model and TwinRL real-world reinforcement-learning framework as named technology components. Its stated initial deployment path is deliberately controlled: factories, supermarkets and logistics operations precede more open environments. This is a coherent product thesis, but the public record remains mostly company- or media-reported rather than customer-verified."
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: founders-and-governance
    title: "Founders, leadership and key-person dependence"
    body: "The leadership team combines intelligent-driving research, technical leadership and mass-production experience at Li Auto, according to multiple reports. That background is relevant to a robotics company trying to move from model research to manufacturable systems, and the reported division of responsibilities covers technology, capital and operations. However, the retained evidence does not identify an independent board, non-founder executives, safety leadership, or governance controls. The company therefore appears founder-concentrated in the public record: the team is a strength for execution speed, while the lack of disclosed organizational depth is a diligence gap rather than evidence of a governance failure."
    claimRefs: [CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: "Financing, valuation and execution milestones"
    body: "Four independent or near-independent media accounts in the assigned pool describe five financing rounds completed in less than six months and approximately RMB 2 billion raised. One account reports a post-money valuation above US$1 billion, while the available evidence does not provide term sheets, ownership, liquidation preferences, debt, cash balance or audited revenue. The operational milestones are notable but early: the first self-developed prototype reportedly followed within 45 days of the first employee joining, two generations of embodiments were completed, and the first generation entered small-batch production and PoC validation. These milestones support an execution narrative, not commercial scale."
    claimRefs: [CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestone-and-evidence-boundaries
    title: "Milestones and evidence boundaries"
    body: "The timeline below distinguishes reported company milestones from external industry context. Simplexity's public milestones run from July 2025 formation through the 2026 funding, research and hardware-development disclosures. The wider sector is moving toward formal standards and commercial deployment, but those developments do not prove Simplexity compliance, customer adoption or production economics. Independent reporting also cautions that humanoid demonstrations may remain technology demonstrations and that reliable, safe and maintainable deployment is still a systems-engineering challenge. This is the central overview judgment: strong early sponsorship and technical ambition are visible; repeatable deployment, paid demand, safety performance and financial quality remain unverified."
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: "Execution signal"
    body: "The combination of a former Li Auto leadership team, reported five-round financing sequence and rapid transition from first employee to prototype indicates unusually fast early execution, although the evidence is not a substitute for customer or audited operating data."
    claimRefs: [CO006, CO009, CO011]
  - calloutType: risk
    title: "Scale remains unproven"
    body: "Small-batch production and PoC validation are the strongest disclosed commercialization markers; no retained source establishes named paying customers, recurring revenue, uptime, safety incidents, repeat orders or cash runway."
    claimRefs: [CO012, CO016]
