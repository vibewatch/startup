companyProfile:
  summary: >-
    Simplexity Robotics is a Hangzhou embodied-AI startup founded by former Li Auto executives. Public reporting
    describes a full-stack approach that combines foundation models, control software, data loops, and robot hardware,
    with initial workflows in factories, supermarkets, and logistics. The evidence supports technical and financing
    momentum, but not yet durable commercial scale.
