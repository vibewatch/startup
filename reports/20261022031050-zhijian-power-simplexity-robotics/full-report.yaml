          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model is capital intensive by design. 36Kr reports that the company chose
              on-device computing and a general-purpose body to collect, train, test, validate, and deploy data in the
              user's setting, while also noting that the choice carries a higher per-machine cost. The same source
              reports that the company develops and manufactures its stack in-house; Gasgoo says the funding is intended
              for model training, hardware R&D, data acquisition, and algorithm development. These are useful
              cost-driver signals, but neither source supplies bill of materials, labor content, cloud or edge-compute
              cost, warranty reserve, service burden, utilization, gross margin, or contribution margin. Workplace
              robotics also carries safety-engineering and maintenance exposure: OSHA notes that many accidents occur
              during programming, maintenance, testing, setup, or adjustment. The proper underwriting posture is to
              model these as diligence inputs, not to convert public descriptions into invented unit economics.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest financial signal is financing velocity. Gasgoo reports five rounds in six months and RMB 2
              billion of cumulative funding; 36Kr reports that the final round's post-money valuation exceeded US$1
              billion, while 10jqka likewise reports five rounds and RMB 2 billion. These figures are media-reported and
              are not accompanied in the reviewed pool by term sheets, a cap table, cash-on-hand disclosure, debt
              schedule, burn rate, or runway. The financing can fund a long product-development cycle, but funding
              raised is not cash available after fees, prior spending, restrictions, or investor-specific terms. The
              adverse case is also material: Business Times reports an NDRC warning about a bubble risk, more than 150
              humanoid-robot makers in China, and limited widespread household or factory adoption at the time of its
              report. SESEC documents an emerging standards and safety framework, while OSHA identifies workplace
              hazards and the absence of specific OSHA robotics standards. The verdict is research-more: capital access
              is a strength, while revenue quality, margin path, capital intensity, and next-round dependence remain
              unresolved.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing access is the clearest financial strength
            body: >-
              Five reported rounds in less than six months and RMB 2 billion of cumulative funding provide more
              development capacity than a typical early hardware startup, although the amount is not equivalent to
              available cash or revenue.
            calloutType: strength
            claimRefs:
              - CI009
              - CI010
          - type: callout
            title: Capital has not yet been translated into underwritable economics
            body: >-
              The reviewed evidence does not disclose revenue, realized pricing, margins, burn, runway, paid customers,
              backlog, or repeat orders; the next financing trigger and dilution terms therefore remain unknown.
            calloutType: risk
            claimRefs:
              - CI003
              - CI011
              - CI012
              - CI013
          - type: callout
            title: Financial diligence should precede valuation underwriting
            body: >-
              Treat the reported valuation as an unverified media claim until cap-table terms, revenue quality,
              deployment economics, cash position, and customer contracts are independently reviewed.
            calloutType: recommendation
            claimRefs:
              - CI010
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The public product description places Zhijian Power at the intersection of a robotics foundation model and
              robot bodies intended for industrial and service settings. A March 2026 Sina Finance report says the
              company planned to work on base-model training, robot-body development and iteration, data collection, and
              core algorithms, with expansion from factories into manufacturing and service scenarios. The same report
              describes LaST0 as combining a world model's physical prediction with a VLA fast/slow system. This gives a
              coherent workflow hypothesis: observe a physical scene, infer a temporally extended state, generate an
              action, collect embodied data, and improve the model. It does not establish a sellable SKU, a named
              customer workflow, a paid deployment, or a measured production benefit. The LaST0 project page lists
              demonstrations such as placing a dish on a rack, wiping a whiteboard, scooping popcorn into a bowl, and
              opening a pot to pick corn; these are useful task examples, not evidence that Zhijian Power has
              commercialized them.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE008
              - CE012
      - number: '5.2'
        title: Architecture, operating model, and maturity
        blocks:
          - type: paragraph
            body: >-
              The LaST0 paper provides the clearest public architecture description associated with the company's
              reported technical direction. It describes a latent spatio-temporal chain of thought that models future
              visual dynamics, 3D structure, and robot proprioception, with a low-frequency reasoning expert and a
              high-frequency acting expert implemented through a Mixture-of-Transformers design. The paper reports
              evaluation across 10 real-world tasks and states that mean success rates improved by 13%, 14%, and 14%
              over prior methods across tabletop, mobile, and dexterous manipulation categories. Those are
              paper-reported results, not a company deployment guarantee. The paper's project page lists demonstrations
              but no public API, integration specification, uptime record, manufacturing bill of materials, or
              service-level commitment. A March 2026 company profile additionally describes an intended data loop using
              on-device collection and human demonstrations, but it does not provide dataset size, labeling protocol,
              sim-to-real validation, or reproducibility artifacts. The resulting maturity assessment is
              research-prototype to early productization, not proven production infrastructure.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE013
      - number: '5.3'
        title: Trust, safety, security, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a real technical risk surface but not a completed control framework.
              China’s 2026 standards system for humanoid robots and embodied intelligence covers data lifecycle, model
              training, inference, deployment, applications, safety, and ethics, while its published work includes
              embodied-model system requirements, data-quality specifications, trustworthiness requirements, evaluation
              guidelines, and full-lifecycle management. Separately, the translated Personal Information Protection Law
              requires security measures such as internal operating procedures, categorical management, encryption or
              de-identification, access control, training, incident plans, and periodic compliance audits for
              personal-information handling. These external requirements are not evidence that Zhijian Power complies
              with them. They define diligence gates for any robot system collecting images, voice, human
              demonstrations, or workplace telemetry. Public materials also do not verify collision testing, fail-safe
              behavior, cybersecurity architecture, incident reporting, component traceability, maintenance procedures,
              or deployment acceptance criteria. These gaps are especially important because the company narrative
              emphasizes real-world data collection and expansion from closed to more open environments.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research architecture has a credible control rationale
            body: >-
              The dual-rate latent reasoning design directly targets the latency and physical-state representation
              problems that make general-purpose robot control difficult, and the paper reports results across tabletop,
              mobile, and dexterous tasks.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Commercial maturity is not demonstrated
            body: >-
              The public record does not establish production deployments, named operating customers, reliability
              metrics, safety cases, integration interfaces, or an independently verified data flywheel.
            calloutType: risk
            claimRefs:
              - CE003
              - CE008
              - CE009
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 客户与使用场景：方向明确，买方尚未可核验
        blocks:
          - type: paragraph
            body: >-
              公开报道把至简动力的目标场景描述为工厂和物流，但没有把场景描述连接到具体买方、地点、机器人型号、部署数量或合同状态。对工业机器人而言，使用者、付款者和决策者可能分别是产线运营、工厂信息化团队、系统集成商与集团采购；本章没有证据证明这些角色已经在至简动力的实际项目中被拆分或签约。因而，现阶段可以把工厂和物流视为公司声称的客户工作流方向，而不能把它们计为已验证客户细分。行业材料显示，具身智能公司正在向工业制造、物流等场景扩展，但同业案例不构成至简动力的客户证明。投资判断应要求逐项目提供客户身份、部署地点、生产/试点状态、验收标准与付款凭证。
              The available evidence identifies a target workflow, not a verified account. Buyer identity, user
              identity, payer identity, site identity, and procurement authority remain separate unknowns. A
              diligence-ready segment needs a named organization, a documented use case, an operational location, a
              contract or purchase order, and a status such as pilot or production. None of those fields is supplied for
              Simplexity in this pool. The sector comparison therefore provides context only; it cannot be used as
              customer attribution. This distinction prevents logos, partnership language, or broad application claims
              from being counted as recurring commercial adoption.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
      - number: '6.2'
        title: 采用轨迹与留存：融资进展不等于商业采用
        blocks:
          - type: paragraph
            body: >-
              本次分配的直接公司证据仅支持一项融资与定位叙述：报道指称公司在成立不到一年内连续完成五轮融资、累计约20亿元，并主攻工厂和物流。该信息不能替代收入、客户数、活跃设备、部署地点、利用率、复购、续约或净收入留存。技术论文列出与Simplexity
              Robotics关联的研究作者和现实机器人任务结果，但论文实验结果属于技术信号，不是客户部署或商业留存证据。行业报道中其他公司的订单、客户数和交付量也不能外推至至简动力。故本章将采用轨迹标为未证实，并把客户合同、验收和重复购买数据列为材料级缺口。
              Funding momentum is a financing signal, not a customer funnel. A credible adoption trajectory would show
              leads, pilots, conversions, active sites, utilization, paid volume, service burden, renewals, and
              expansion. The cited robotics paper improves the technical signal because it links the company to a
              research project and reports real-world tasks, but laboratory or benchmark success does not establish a
              paying deployment. The report therefore separates capital access, engineering evidence, and customer
              evidence. Missing denominators are material: a count of projects without paid status or time period cannot
              reveal growth, retention, or revenue quality. The current record supports interest in the company, but not
              durable commercial usage.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU010
      - number: '6.3'
        title: 命名客户、扩张与集中度：尚无公开证明
        blocks:
          - type: paragraph
            body: >-
              在本次成功预取且分配给本章的来源中，没有一份由客户、采购方、监管机构或独立评测者直接确认至简动力生产部署或采购结果的材料。至简动力的公开报道没有披露客户名称、试点到量产的转化率、单一客户收入占比、渠道伙伴、售后服务水平或停机/安全事件。与此同时，国家标准框架已经把应用开发、运行维护、安全与伦理纳入具身智能的全生命周期要求；这提高了未来客户验收和合规的证据门槛，而不是证明公司已经满足这些要求。对于工厂和物流客户，集中度、采购周期、系统集成依赖和现场安全责任都应在数据室中逐项核实。
              Named customer proof is the missing bridge between positioning and underwriting. The absence of a public
              customer name is not proof that no customer exists; it is an evidence limitation. The same limitation
              applies to concentration: without a revenue denominator, top-customer share and channel dependence cannot
              be calculated. Industrial buyers also require safety, maintenance, cybersecurity, and acceptance
              documentation before production use. Public standards describe those diligence surfaces, but they do not
              certify Simplexity. A buyer-quality data room should include references that can be independently
              contacted, signed commercial terms, acceptance records, incident logs, service-level commitments, and a
              cohort view of renewals. Until then, the expansion thesis remains an open question rather than a measured
              outcome.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 客户质量是当前主要承保缺口
            body: 融资和场景定位不能证明付费生产部署；在看到命名客户、合同、验收、利用率与续约队列前，不应把客户扩张或留存写入基准预测。
            calloutType: risk
            claimRefs:
              - CU005
              - CU007
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and compliance exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory risk is forward-looking rather than tied to a disclosed enforcement event. China’s 2026
              standards framework spans the full lifecycle of humanoid robots and embodied intelligence, including model
              training, inference, deployment, applications, safety, and ethics. That breadth increases the surface area
              for testing, data-governance, identity, and operational-compliance work as products move from
              demonstrations into factories. The available official-adjacent standards account says more than 120
              institutions participated and that an initial list of 52 standards was published, while also listing
              several items as drafting, pre-research, or under approval. This indicates an evolving rulebook rather
              than a settled compliance baseline. The company-specific diligence question is whether its
              data-collection, teleoperation, model deployment, and industrial-safety controls are already mapped to
              applicable requirements. No assigned source confirms a Zhijian Power license, certification, breach,
              recall, or enforcement action; that absence is an evidence gap, not proof of clean status.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR011
      - number: '7.2'
        title: Commercialization and operating execution
        blocks:
          - type: paragraph
            body: >-
              The most immediate operating risk is the gap between demonstrated capability and repeatable, safe
              production economics. A February 2026 local report describes a first industrial dual-arm robot with
              adaptive gripper and teleoperation data gloves as having entered sample testing and productization, and
              says the company is working to solve scale-up in real physical settings. That is useful evidence of a
              development milestone, but it is not evidence of paid production deployment, uptime, service cost,
              acceptance testing, or repeat orders. The same report frames the Suzhou innovation center and the Green
              Harmonic partnership as a route to connect research, manufacturing, and application; it does not disclose
              binding volumes or service-level obligations. Competitor reporting shows how quickly the category is
              moving toward large financings and orders, which raises execution and timing pressure without proving that
              Zhijian Power has comparable traction. Underwriting should therefore treat reliability, safety,
              installation time, maintenance burden, and customer acceptance as unresolved operating variables.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Partner, capital, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              The company’s disclosed route to commercialization appears dependent on an ecosystem of
              precision-component suppliers, local industrial infrastructure, and continued private financing. The
              reported Green Harmonic relationship is strategically logical because it combines general-model and
              application capability with harmonic-reducer manufacturing, but the public account does not establish
              exclusivity, pricing, capacity reservations, quality guarantees, or a second source. Category financing
              reports also describe a market where capital is concentrating in a small number of leaders and where peers
              are announcing very large rounds, deployments, and orders. That creates a financing and competitive risk:
              a young company may need to fund hardware iteration, data collection, field support, and compliance before
              revenue quality is visible. Public sources do not disclose Zhijian Power’s revenue, gross margin, burn,
              runway, debt, cap-table preferences, or customer concentration. A thesis-break should be tied to
              measurable failure to secure qualified production deployments, a material supplier interruption without a
              qualified substitute, or financing terms that materially dilute control before commercial proof.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The key risk is proof, not a disclosed incident
            body: >-
              Assigned evidence shows a productization-stage demonstration and an announced component partnership, but
              does not establish paid production deployments, safety performance, retention, or financial resilience.
              Those missing proofs should be treated as material underwriting risks.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Evidence and investment call
        blocks:
          - type: paragraph
            body: >-
              Simplexity Robotics sits in a market where commercialization expectations have moved materially upward,
              but the available evidence is market-level rather than company-level. CNBC reports that Morgan Stanley
              expects 50,000 humanoid robots to ship in China in 2026, a $2 billion market this year, and a $15 billion
              market by 2030; the forecast excludes prototypes, pre-order trials, and internal-use units. That
              distinction matters: it separates external sales from demonstrations, but it still does not establish
              Simplexity's paid deployments, revenue, margin, or repeat orders. Public sector coverage also shows that
              comparable companies are raising large rounds, reporting revenue, or approaching public markets, yet those
              are comparables, not substitutes for a company-specific cap table. The investment call is therefore
              research-more, with high risk and an indeterminate valuation stance until the entry price and financing
              terms are verified. A buy decision would require named customers, audited or management revenue, financing
              documents, preference terms, and evidence that deployments convert into recurring commercial revenue.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV014
              - CV013
      - number: '8.2'
        title: Thesis, anti-thesis, and price discipline
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that sector adoption is moving from demonstrations toward factory, logistics, and
              retail use cases, while standards activity is becoming more formal. CNBC cites factory, logistics,
              unmanned-retail, and interactive-service rollouts in Morgan Stanley's field research; SESEC describes a
              2026 Chinese standards system spanning foundational standards, intelligent computing, complete systems and
              integration, applications, and safety and ethics. The anti-thesis is that market forecasts can capitalize
              anticipated adoption before unit economics are proven, and safety standards do not prove a vendor's
              compliance or commercial success. ISO 10218-1 covers the robot as a machine and explicitly points to ISO
              10218-2 for integration; it also excludes several use cases, including mobile platforms and public-access
              service robots. For Simplexity, price discipline should therefore be milestone-based: pay only against
              verified paid deployments, gross-margin evidence, safety/compliance ownership, and financing terms that do
              not create hidden preference or dilution overhang.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point valuation because the assigned evidence does not
              disclose Simplexity's revenue base, cash burn, valuation, or financing terms. The bull case assumes the
              company converts technical capability into paid industrial deployments and benefits from the expanding
              external-sales market; the base case assumes pilots and partnerships remain difficult to translate into
              repeatable revenue; the bear case assumes commercialization lags the market narrative, while safety,
              integration, or funding requirements consume capital. Public comparable coverage is directionally useful:
              a sector article reports Galaxy General's claimed $151 million round and more than $330 million of total
              investment, while another report describes other Chinese robotics companies' disclosed revenue, margins,
              orders, and funding. These figures are not directly comparable to Simplexity because issuer, accounting
              basis, product mix, and stage differ. Exit readiness is not demonstrated. The next diligence gate is a
              data room tying price to a dated cap table, preference waterfall, customer contracts, deployment
              economics, safety evidence, and a cash runway model.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV012
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits preserve the distinction between market evidence, peer disclosures, and unresolved
              company-specific valuation inputs. No precise target return or intrinsic-value point estimate is presented
              because the retained sources do not provide a defensible Simplexity revenue, margin, cash, or cap-table
              denominator. This restraint is intentional: a peer financing headline can inform diligence questions, but
              it cannot establish a comparable multiple without matching stage, product mix, accounting basis,
              ownership, and preference terms. The reader should treat every scenario as a gate for evidence collection,
              not as a forecast.
            claimRefs:
              - CV004
              - CV010
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more'
            body: >-
              The retained evidence supports sector momentum, not a defensible Simplexity Robotics price. Require a
              dated cap table, financing terms, paid-customer evidence, revenue and margin data, and
              safety/commercialization metrics before upgrading the call.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV008
              - CV013
          - type: callout
            title: Primary valuation risk
            body: >-
              A large market forecast or peer financing headline can create a false precision trap when the
              company-specific denominator, dilution, liquidation preferences, and cash runway are unknown.
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV010
          - type: callout
            title: Scenario limitation
            body: >-
              The bull, base, and bear cases are qualitative decision scenarios, not probability-weighted financial
              forecasts, because no verified Simplexity revenue, valuation, or cash data is retained in this pool.
            calloutType: assumption
            claimRefs:
              - CV003
              - CV013
