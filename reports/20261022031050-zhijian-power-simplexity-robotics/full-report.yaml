  - id: FE001
    title: Reported LaST0 product architecture
    type: stack
    summary: >-
      The public paper describes a layered perception-to-reasoning-to-action architecture, while the data and deployment
      layers remain less evidenced.
    data:
      layers:
        - label: Embodied inputs
          detail: Inputs described by the paper for representing the physical scene and robot state.
          items:
            - label: Visual observations
              detail: Future visual dynamics are represented in the latent sequence.
            - label: 3D structure
              detail: The paper describes 3D geometric information.
            - label: Robot proprioception
              detail: The paper describes future robot-state representations.
        - label: Latent reasoning
          detail: A shared latent context connects slower temporal reasoning to faster action generation.
          items:
            - label: Low-frequency reasoning expert
              detail: Generates latent spatio-temporal chain-of-thought representations.
            - label: Shared latent context
              detail: Reasoning and acting experts coordinate through robotics-oriented latent representations.
        - label: Action execution
          detail: The acting pathway conditions immediate control on the latent representation and feedback.
          items:
            - label: High-frequency acting expert
              detail: Generates actions conditioned on the latent representations and feedback.
        - label: Operating loop
          detail: >-
            Company reporting describes data collection, while production safety and integration controls remain
            unverified.
          items:
            - label: Data collection
              detail: Company reporting describes planned data collection and training investment.
            - label: Safety and integration controls
              detail: Public evidence does not establish the production control implementation.
        - label: Training and evaluation
          detail: The paper reports benchmark evaluation, while the company's production evaluation protocol is not public.
          items:
            - label: Latent supervision
              detail: The paper describes latent representations and action-generation training.
            - label: Task benchmarks
              detail: Reported results cover tabletop, mobile, and dexterous manipulation categories.
        - label: Governance boundary
          detail: External standards and privacy law define controls that the company must evidence before scale deployment.
          items:
            - label: Safety and ethics
              detail: The 2026 standards framework includes safety and ethics across the lifecycle.
            - label: Privacy security
              detail: The legal reference lists encryption, de-identification, access control, and incident plans.
    approximationNotes: >-
      The figure is an evidence-bounded abstraction of the paper and company reporting; it is not a confirmed bill of
      materials or production architecture.
    claimRefs:
