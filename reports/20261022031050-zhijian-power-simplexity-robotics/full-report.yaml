        title: Financing, valuation and execution milestones
        blocks:
          - type: paragraph
            body: >-
              Four independent or near-independent media accounts in the assigned pool describe five financing rounds
              completed in less than six months and approximately RMB 2 billion raised. One account reports a post-money
              valuation above US$1 billion, while the available evidence does not provide term sheets, ownership,
