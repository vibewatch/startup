      - number: '1.2'
        title: Founders, leadership and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The leadership team combines intelligent-driving research, technical leadership and mass-production
              experience at Li Auto, according to multiple reports. That background is relevant to a robotics company
              trying to move from model research to manufacturable systems, and the reported division of
              responsibilities covers technology, capital and operations. However, the retained evidence does not
              identify an independent board, non-founder executives, safety leadership, or governance controls. The
              company therefore appears founder-concentrated in the public record: the team is a strength for execution
              speed, while the lack of disclosed organizational depth is a diligence gap rather than evidence of a
              governance failure.
