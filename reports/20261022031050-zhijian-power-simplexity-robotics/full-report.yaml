      - number: '3.3'
        title: Buying criteria, pricing, and switching
        blocks:
          - type: paragraph
            body: >-
              The available pool does not provide comparable realized prices or contract terms for Zhijian Power and its
              peers. One public reference places Unitree's G1 starting price at $13,500, but that is a list price for a
              specific model and is not evidence of deployed-system economics. The better-supported buying criteria are
              task fit, reliability, integration with factory systems, operator dependence, supply access, and
              serviceability. A buyer may prefer application-specific equipment when a general-purpose platform cannot
              match its efficiency. Switching costs should rise with accumulated task data, workflow integration, custom
              end-effectors, and validated safety procedures, but no public source in this pool quantifies Zhijian
              Power's lock-in or renewal rates.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The industry's strongest apparent moats are manufacturing scale, access to real operating data, component
              and supply-chain control, and trusted deployment channels. They remain contestable. TrendForce describes a
              shift toward tangible user value and reports rapid scaling by leading vendors, while independent
              commentary warns that many demonstrations remain technology showcases rather than reliable industrial
              systems. Public reporting also identifies overcapacity and bubble risk as production expands faster than
              orders. For Zhijian Power, former Li Auto leadership and a world-model-plus-hardware thesis may aid
              recruiting and technical execution, but the pool does not prove that those assets translate into lower
              cost, safer operation, or durable customer preference. Incumbent response and dedicated-robot substitution
              therefore remain material risks.
            claimRefs:
              - CP015
              - CP016
              - CP017
              - CP018
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is already a competitive variable
            body: >-
              The clearest public peer signal is not a feature checklist but the ability to manufacture, deploy, and
              learn at volume. AgiBot's reported shipments and Unitree's reported 2025 scale set a bar that Zhijian
              Power's public PoC disclosures do not yet match.
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: Commercial proof remains the unresolved discriminator
            body: >-
              Public evidence identifies large orders, pilots, and deployment claims across peers, but the pool does not
              provide a comparable paid-vs-free status, uptime, repeat-order, or realized-price dataset for Zhijian
              Power.
            calloutType: risk
            claimRefs:
              - CP014
              - CP018
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Simplexity is described as building embodied-intelligence products for factories, retail, logistics, and
              other commercial environments, with two generations of hardware, small-batch production, and
              proof-of-concept validation reported by Gasgoo and 36Kr. That evidence supports a hardware-plus-software
              commercialization hypothesis, not recognized revenue. The reviewed sources do not disclose a price list,
              contract structure, implementation fee, recurring software charge, usage fee, shipment revenue, backlog,
              or revenue-recognition policy. A company statement that funding will support model training, hardware R&D,
              data acquisition, and algorithm development indicates a development-heavy cost base, but it does not
              establish customer-funded economics or gross-profit contribution. List pricing, realized pricing, and any
              pilot-to-production conversion remain unverified.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
