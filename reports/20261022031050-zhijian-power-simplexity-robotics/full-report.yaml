              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyers, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Industrial and logistics deployments provide the clearest adoption path because operations leaders can
              compare a robot with labor, fixed automation, and existing mobile robots on throughput, uptime,
              integration cost, and safety. Peer evidence suggests real demand exists: a Geekplus-issued release reports
              roughly 950 end customers and a 78% large-customer repurchase rate, while an independent Chinese market
              roundup describes industrial use as the principal deployment front in 2026. That evidence validates buyer
              interest in warehouse and factory automation, not Simplexity's own commercial traction. For Simplexity,
              the likely sequence is a technical proof-of-concept, site integration and safety acceptance, a paid pilot,
              measured operating performance, and only then repeat-site or fleet rollout. Public evidence does not
              identify its payer, budget owner, pilot pricing, or conversion rate.
            claimRefs:
              - CM001
              - CM002
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Supply-side momentum is substantial: TrendForce expects 94% Chinese output growth in 2026 and projects
              Unitree and AgiBot to capture nearly 80% of shipments. That concentration is simultaneously a demand
              signal and a warning that scale benefits may accrue to a small number of manufacturers. Adoption still
              depends on moving beyond demonstrations. Independent experts cited by DirectIndustry describe many
              humanoids as mid-readiness systems requiring material work on reliability, safety, maintainability, and
              integration, and note that task-specific robots can remain more practical. China's 2026 standards
              framework adds lifecycle, application, data, safety, and ethics requirements across six areas. These
              constraints make paid deployments, uptime, intervention rates, service cost, certification, and repeat
              orders more valuation-relevant than top-down category forecasts or financing volume.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category growth is not company demand
            body: >-
              Simplexity's small-batch and proof-of-concept status means category forecasts should not be capitalized as
              company revenue. Paid pilots, repeat deployments, uptime, intervention rates, and fully loaded customer
              ROI are the missing bridge.
            calloutType: risk
            claimRefs:
              - CM002
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than humanoid start-ups alone. AgiBot and Unitree are visible
              scale and brand leaders in China, while UBTech emphasizes industrial humanoids and coordinated factory
              work. Galaxy General, 智平方, and Zhijian Power represent full-stack, model-led approaches with industrial
              ambitions. Leju addresses education and research as well as full-height platforms, and XPeng brings an
              automotive manufacturing and distribution option. Customers can also buy application-specific robots,
              retain conventional automation, or build integrations internally. That creates a substitution boundary: a
              general-purpose robot must justify flexibility against the reliability, throughput, and task economics of
              a dedicated machine.
            claimRefs:
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP015
      - number: '3.2'
        title: Peer profiles and differentiation
        blocks:
          - type: paragraph
            body: >-
              Publicly reported peer evidence shows several distinct routes to differentiation. AgiBot's reported 2025
              shipment volume and deployments in factories and service locations indicate a scale-and-scenario route.
              Unitree combines consumer visibility, international distribution, and reported profitability, although
              shipment estimates differ between independent reporting and the CEO's claim. UBTech's Walker line is
              positioned around automotive and logistics workflows, battery swapping, and multi-robot coordination.
              Galaxy General emphasizes a large industrial payload and retail footprint; 智平方 emphasizes a self-developed
              model and a large order; Leju remains more education and research oriented. These are materially different
              wedges rather than a single homogeneous peer group.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
