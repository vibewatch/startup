  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary should begin with closed or semi-structured commercial environments, not the
              entire embodied-AI or consumer-robotics category. Independent reporting says Simplexity prioritizes
              factories, retail stores, and logistics, while its hardware has reached small-batch production and
              proof-of-concept rather than disclosed scaled deployment. The practical included pool is therefore
              spending on mobile manipulation or humanoid hardware, perception and action software, systems integration,
              deployment, and ongoing support for those workflows. Fixed industrial automation, conventional AMRs that
              do not perform the same manipulation job, and unstructured household robotics are adjacencies or
              substitutes rather than automatic components of Simplexity's serviceable market. Buyers can also retain
              labor, redesign the workflow, or deploy task-specific machines; each substitute raises the ROI bar for a
              general-purpose system.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM015
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public estimates establish category momentum but not a clean TAM/SAM/SOM stack. IDC figures relayed by
              DirectIndustry put 2025 global humanoid volume at about 18,000 units and hardware revenue at approximately
              US$440 million. Broader estimates cited by the same publication include software and services and range
              from nearly US$3 billion currently to US$15 billion by 2030, while a separate forecast reaches US$35.4
              billion by 2033. A China-specific forecast exceeds RMB20 billion in 2026, and TrendForce expects Chinese
              output to rise 94% in 2026. These values differ by geography, category boundary, denominator, and forecast
              year. They are useful sensitivity markers, but none isolates the workflows Simplexity can serve, the
              portion buyers will procure, or the share the company can win.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
