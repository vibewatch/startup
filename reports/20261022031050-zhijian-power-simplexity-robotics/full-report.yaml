  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Public reporting places Simplexity Robotics in Hangzhou and dates its establishment to July 2025. The
              founding group is identified as Jia Peng, Wang Kai and Wang Jiajia, all former Li Auto executives, with
              roles reported as CEO, chairman and COO respectively. The company describes a full-stack
              embodied-intelligence approach spanning models, control software and robotic hardware, with the LaST₀
              foundation model, ManualVLA long-horizon task model and TwinRL real-world reinforcement-learning framework
              as named technology components. Its stated initial deployment path is deliberately controlled: factories,
              supermarkets and logistics operations precede more open environments. This is a coherent product thesis,
              but the public record remains mostly company- or media-reported rather than customer-verified.
