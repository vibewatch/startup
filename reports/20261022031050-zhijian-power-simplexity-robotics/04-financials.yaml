callouts:
  - calloutType: strength
    title: Financing access is the clearest financial strength
    body: "Five reported rounds in less than six months and RMB 2 billion of cumulative funding provide more development capacity than a typical early hardware startup, although the amount is not equivalent to available cash or revenue."
    claimRefs: [CI009, CI010]
  - calloutType: risk
    title: Capital has not yet been translated into underwritable economics
    body: "The reviewed evidence does not disclose revenue, realized pricing, margins, burn, runway, paid customers, backlog, or repeat orders; the next financing trigger and dilution terms therefore remain unknown."
    claimRefs: [CI003, CI011, CI012, CI013]
  - calloutType: recommendation
    title: Financial diligence should precede valuation underwriting
    body: "Treat the reported valuation as an unverified media claim until cap-table terms, revenue quality, deployment economics, cash position, and customer contracts are independently reviewed."
    claimRefs: [CI010, CI011, CI012]
