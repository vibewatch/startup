      - [Gross margin, null, low, "Hardware, compute, service, and warranty costs may compress margin", "Audited gross-margin bridge and BOM/service-cost allocation"]
      - [CAC or sales efficiency, null, low, "Long enterprise cycles can consume capital before conversion", "Fully loaded sales expense, cycle length, win rate, and payback by segment"]
      - [Burn and runway, null, low, "Financing dependence cannot be assessed from funding raised", "Monthly cash burn, cash balance, restricted cash, and 24-month runway case"]
      - [Utilization and uptime, null, low, "Robot productivity drives customer ROI and recurring support burden", "Installed-base utilization, uptime, incident, maintenance, and acceptance data"]
      - [Working capital, null, low, "Inventory and project milestones can absorb cash before collection", "Inventory turns, supplier terms, deposits, receivables aging, and milestone billing"]
      - [Capex and financing obligations, null, low, "In-house hardware and facilities may require additional capital", "Equipment leases, debt, project finance, purchase commitments, and capex plan"]
    notes: "All values are unavailable in the reviewed sources. The table preserves the distinction between unknown financial metrics and zero performance."
    claimRefs: [CI005, CI006, CI007, CI008, CI011, CI012, CI013, CI014]
