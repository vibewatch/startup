      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              公开估算能证明品类热度，却无法搭出清晰的 TAM/SAM/SOM。DirectIndustry 转述的 IDC 数据称，2025 年全球类人机器人销量约 18,000 台，硬件收入约 US$440
              million。同一媒体引用的更宽口径估算包含软件和服务，规模从当前近 US$3 billion 到 2030 年 US$15 billion；另一份预测则达到 2033 年 US$35.4
              billion。中国市场的一份预测称 2026 年规模超过 RMB20 billion，TrendForce 预计中国 2026 年产量增长
              94%。这些数字在地域、品类边界、分母和预测年份上都不同。它们可用于敏感性分析，但没有一个能拆出 Simplexity 可服务的工作流、买方会采购的部分，或公司能够赢得的份额。
