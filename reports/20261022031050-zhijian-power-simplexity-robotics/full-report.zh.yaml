      - number: '5.3'
        title: 信任、安全、安保与实施风险
        blocks:
          - type: paragraph
            body: >-
              现有证据显示存在真实的技术风险面，但没有证明控制框架已经完成。中国 2026
              年类人机器人和具身智能标准体系覆盖数据生命周期、模型训练、推理、部署、应用、安全和伦理；已发布工作还包括具身模型系统要求、数据质量规范、可信要求、评估指南和全生命周期管理。另据译文《个人信息保护法》，处理个人信息需要内部操作规程、分类管理、加密或去标识化、访问控制、培训、事件预案和定期合规审计等安全措施。这些外部要求不等于
              Zhijian Power
              已合规，而是对任何采集图像、语音、人工示范或工作场所遥测数据的机器人系统设定尽调门槛。公开材料也没有核实碰撞测试、失效安全行为、网络安全架构、事件报告、部件可追溯性、维护流程或部署验收标准。鉴于公司叙事强调现实世界数据采集并从封闭环境扩展到更开放环境，这些缺口尤其重要。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
