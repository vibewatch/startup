      - number: '3.3'
        title: 采购标准、定价与切换
        blocks:
          - type: paragraph
            body: >-
              现有来源没有提供 Zhijian Power 及其同业可比的成交价格或合同条款。一份公开资料给出 Unitree G1 起售价
              $13,500，但这只是特定型号的标价，不能证明部署系统的经济性。更有依据的采购标准包括任务匹配度、可靠性、与工厂系统的集成、对操作员的依赖、供应可得性和可维护性。当通用平台无法达到专用设备的效率时，买方可能偏好专用方案。随着任务数据积累、工作流集成、定制末端执行器和安全流程验证，切换成本应会上升；但没有公开来源量化
