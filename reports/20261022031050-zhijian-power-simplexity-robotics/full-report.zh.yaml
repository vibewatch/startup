      - number: '4.2'
        title: 成本结构与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              公开的运营模式从设计上就高度资本密集。36Kr 报道称，公司选择端侧计算和通用机身，在用户现场采集、训练、测试、验证并部署数据，同时承认这会带来更高的单机成本。同一来源称公司自研自产全栈；Gasgoo
              表示融资将用于模型训练、硬件研发、数据采集和算法开发。这些信息能提示成本驱动因素，但两份来源都没有提供物料清单、人工投入、云端或边缘计算成本、质保准备金、服务负担、利用率、毛利率或贡献毛利。工作场所机器人还暴露于安全工程和维护风险：OSHA
              指出，许多事故发生在编程、维护、测试、设置或调整期间。合理的投资判断方式是把这些当作尽调输入，而不是从公开描述中臆造单位经济性。
