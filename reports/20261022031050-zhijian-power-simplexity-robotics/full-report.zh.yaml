      - number: '4.3'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              最强的财务信号是融资速度。Gasgoo 报道称，公司六个月内完成五轮融资，累计 RMB 2 billion；36Kr 称最后一轮投后估值超过 US$1 billion，10jqka 也报道五轮融资和 RMB 2
              billion。这些数字来自媒体，现有来源池没有配套条款清单、股权结构表、现金披露、债务表、烧钱速度或现金续航。融资可以支撑漫长的产品开发周期，但扣除费用、既往支出、限制条件和投资人特定条款后，募资额不等于可用现金。下行情景同样重要：Business
              Times 报道 NDRC 警告泡沫风险，中国有超过 150 家类人机器人制造商，而截至报道时家庭或工厂尚未广泛采用。SESEC 记录了正在形成的标准与安全框架，OSHA 则指出工作场所危害以及缺少专门的
              OSHA 机器人标准。结论为继续研究：资本获取是优势，但收入质量、利润率路径、资本密集度和对下一轮融资的依赖仍未解决。
            claimRefs:
