  - id: FE001
    title: 已报道的 LaST0 产品架构
    type: stack
    summary: 公开论文描述了从感知到推理再到行动的分层架构，但数据层与部署层的证据较少。
    data:
      layers:
        - label: 具身输入
          detail: 论文描述了用于表示物理场景和机器人状态的输入。
          items:
            - label: 视觉观测
              detail: 未来视觉动态在潜在序列中表示。
            - label: 3D 结构
              detail: 论文描述了 3D 几何信息。
            - label: 机器人本体感知
              detail: 论文描述了未来机器人状态的表示。
        - label: 潜在推理
          detail: 共享潜在上下文将较慢的时间推理与较快的动作生成连接起来。
          items:
            - label: 低频推理专家
              detail: 生成潜在的时空思维链表示。
            - label: 共享潜在上下文
              detail: 推理专家与行动专家通过面向机器人的潜在表示协同。
        - label: 动作执行
          detail: 行动路径以潜在表示和反馈为条件生成即时控制。
          items:
            - label: 高频行动专家
              detail: 根据潜在表示和反馈生成动作。
        - label: 运行闭环
          detail: 公司报道描述了数据采集，但生产安全和集成控制仍未核实。
          items:
            - label: 数据采集
              detail: 公司报道描述了计划中的数据采集和训练投入。
            - label: 安全与集成控制
              detail: 公开证据无法证明生产控制已落地。
        - label: 训练与评估
          detail: 论文报告了基准评估，但公司的生产评估协议未公开。
          items:
            - label: 潜在监督
              detail: 论文描述了潜在表示和动作生成训练。
            - label: 任务基准
              detail: 报道结果覆盖桌面、移动和灵巧操作类别。
        - label: 治理边界
          detail: 在规模化部署前，公司必须证明外部标准和隐私法要求的控制措施。
          items:
            - label: 安全与伦理
              detail: 2026 年标准框架将安全和伦理纳入全生命周期。
            - label: 隐私安全
              detail: 法律参考资料列出加密、去标识化、访问控制和事故预案。
    approximationNotes: 该图是基于论文和公司报道、受证据边界约束的抽象，并非已确认的物料清单或生产架构。
