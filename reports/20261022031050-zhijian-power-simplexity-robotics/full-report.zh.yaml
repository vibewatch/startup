          - type: callout
            title: 核心风险是证据，而非已披露事件
            body: 分配到的证据显示公司处于产品化阶段，有演示和已宣布的零部件合作，但没有证明付费生产部署、安全表现、留存或财务韧性。这些缺失的证明应视为重大投资判断风险。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 证据与投资结论
        blocks:
          - type: paragraph
            body: >-
              Simplexity Robotics 所处市场的商业化预期已经明显上调，但现有证据只说明市场，不说明公司本身。CNBC 报道称，Morgan Stanley 预计中国 2026 年出货 50,000
              台类人机器人，当年市场规模为 $2 billion，2030 年为 $15 billion；该预测不包括原型机、预购试用和内部使用设备。这一区分很重要：它把外部销售与演示分开，但仍不能证明 Simplexity
              的付费部署、收入、利润率或重复订单。公开行业报道还显示，可比公司正在大额融资、报告收入或接近公开市场，但它们只是可比对象，不能替代公司自身的股权结构表。因此，在入场价格和融资条款核实前，投资结论为继续研究、风险高、估值立场不确定。做出买入决定还需要具名客户、经审计或管理层口径收入、融资文件、优先条款，以及部署能转化为经常性商业收入的证据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV014
              - CV013
      - number: '8.2'
        title: 投资论点、反论点与价格纪律
        blocks:
          - type: paragraph
            body: >-
              正面论点是，行业采用正从演示走向工厂、物流和零售用例，标准活动也日益正式。CNBC 引述 Morgan Stanley 实地研究中的工厂、物流、无人零售和互动服务落地；SESEC 描述了中国 2026
              年覆盖基础标准、智能计算、完整系统与集成、应用、安全和伦理的标准体系。反论点是，市场预测可能在单位经济性得到证明前就把预期采用资本化；安全标准也不能证明厂商合规或商业成功。ISO 10218-1
              覆盖作为机器的机器人，并明确指向用于集成的 ISO 10218-2；它还排除移动平台和公众可接触服务机器人等若干用例。因此，对 Simplexity
              应执行里程碑式价格纪律：只为已核实的付费部署、毛利证据、安全/合规责任归属，以及不会制造隐藏优先权或稀释悬垂的融资条款付费。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV010
              - CV011
      - number: '8.3'
        title: 情景、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              由于分配到的证据没有披露 Simplexity
              的收入基础、现金消耗、估值或融资条款，情景框架比点估值更稳妥。乐观情景假设公司把技术能力转化为付费工业部署，并受益于外部销售市场扩张；基准情景假设试点和合作仍难以转成可重复收入；悲观情景假设商业化落后于市场叙事，而安全、集成或融资要求持续消耗资本。公开可比公司报道具有方向参考价值：一篇行业文章称
              Galaxy General 宣布 $151 million 轮融资、累计投资超过 $330
              million；另一份报道介绍了其他中国机器人公司的收入、利润率、订单和融资披露。但发行人、会计口径、产品组合和阶段不同，这些数字不能直接与 Simplexity
              比较。退出准备度尚未证明。下一道尽调门槛是建立数据室，把价格与有日期的股权结构表、优先权瀑布、客户合同、部署经济性、安全证据和现金 runway 模型连起来。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV012
              - CV013
      - number: '8.4'
        title: 展示项
        blocks:
          - type: paragraph
            body: >-
              展示项保留了市场证据、同业披露和未解决的公司估值输入之间的区别。由于现有来源没有提供可信的 Simplexity
              收入、利润率、现金或股权结构表分母，本报告不提出精确目标回报或内在价值点估计。这种克制是有意的：同业融资头条可以帮助提出尽调问题，但只有阶段、产品组合、会计口径、持股和优先条款相匹配，才能建立可比倍数。读者应把每个情景视为证据收集门槛，而不是预测。
            claimRefs:
              - CV004
              - CV010
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议：继续研究
            body: 现有证据支持行业势头，不支持可信的 Simplexity Robotics 价格。升级结论前，应要求有日期的股权结构表、融资条款、付费客户证据、收入与利润率数据，以及安全/商业化指标。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV008
              - CV013
          - type: callout
            title: 主要估值风险
            body: 当公司自身分母、稀释、清算优先权和现金续航都未知时，大市场预测或同业融资头条可能制造虚假的精确感。
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV010
          - type: callout
            title: 情景局限
            body: 乐观、基准和悲观情景是定性决策情景，不是概率加权的财务预测，因为本来源池没有保留经核实的 Simplexity 收入、估值或现金数据。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV013
