      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 付费工业部署扩大，重复订单出现，且安全 / 集成尽调通过。
        - 上行空间只有在收入得到核实或存在可比收入倍数时才有依据；目前无法支持任何数值目标。
        - 执行、安全、供应链及客户集中度。
        - 低至中：市场证据积极，但公司证据缺失。
      - - 基准
        - 试点继续，但转化和单位经济性仍不均衡。
        - 跟踪或继续研究；在价格和收入分母得到记录前保留资本。
        - 消耗、稀释、优先权悬置及商业化缓慢。
        - 中：与当前证据缺口一致。
      - - 悲观
        - 商业转化落后于预测，或集成与安全要求推迟部署。
        - 下行可能包括下轮融资或流动性受损；没有入场价格就不估算亏损比例。
        - 倍数压缩、融资需求及监管 / 客户阻碍。
        - 重大：反向证据有限，但缺失分母本身就与决策有关。
      - - 决策闸门
        - 管理层提供股权结构表、客户合同、收入和利润率桥接表、安全指标及现金跑道。
        - 只有在核实分母和条款后，才重新评估价格、稀释和回报。
        - 数据不完整或内部不一致。
        - 任何买入建议前必须满足。
    notes: 由于指定来源没有 Simplexity 的收入、估值、现金或股权结构表分母，情景采用定性描述；它们不是按概率加权的财务预测。
    claimRefs:
      - CV003
      - CV004
      - CV008
      - CV012
      - CV013
