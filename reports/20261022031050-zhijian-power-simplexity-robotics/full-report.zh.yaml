        title: 同业画像与差异化
        blocks:
          - type: paragraph
            body: >-
              公开同业证据显示，差异化路径并不相同。AgiBot 据报道的 2025 年出货量及其在工厂和服务场所的部署，体现规模与场景路线。Unitree 兼具消费端知名度、国际分销和据报道的盈利能力，但独立报道与 CEO
              说法的出货估算不同。UBTech 的 Walker 系列聚焦汽车和物流工作流、电池更换及多机器人协同。Galaxy General 强调大工业负载和零售覆盖；智平方强调自研模型和大额订单；Leju
