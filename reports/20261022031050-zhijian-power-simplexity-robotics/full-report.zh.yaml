        title: 身份、产品与运营范围
        blocks:
          - type: paragraph
            body: >-
              公开报道将 Simplexity Robotics 定位于杭州，并称其成立于 2025 年 7 月。创始团队为 Jia Peng、Wang Kai 和 Wang Jiajia，均为前 Li Auto
              高管，分别担任 CEO、董事长和 COO。公司提出覆盖模型、控制软件和机器人硬件的具身智能全栈路线，已点名 LaST₀ 基础模型、ManualVLA 长时程任务模型和 TwinRL
              现实世界强化学习框架。其初始部署路径刻意保持受控：先进入工厂、超市和物流，再走向更开放的环境。这套产品逻辑是连贯的，但公开记录主要来自公司或媒体报道，尚未得到客户核验。
