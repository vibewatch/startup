              公开产品描述显示，Zhijian Power 位于机器人基础模型与面向工业和服务场景的机器人本体交叉处。Sina Finance 2026 年 3
              月报道，公司计划开展基座模型训练、机器人本体开发迭代、数据采集和核心算法工作，并从工厂扩展到制造和服务场景。同一报道称，LaST0 将世界模型的物理预测与 VLA
              快慢系统结合。由此可以提出一套连贯的工作流假设：观察物理场景、推断延展状态、生成动作、采集具身数据，再改进模型。但这不能证明存在可销售 SKU、具名客户工作流、付费部署或量化生产收益。LaST0
              项目页列出把碟子放上架子、擦白板、把爆米花舀进碗里、开锅取玉米等演示；这些是任务示例，不是 Zhijian Power 已完成商业化的证据。
