  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户与使用场景：方向明确，买方尚未可核验
        blocks:
          - type: paragraph
            body: >-
              公开报道把至简动力的目标场景描述为工厂和物流，但没有把场景描述连接到具体买方、地点、机器人型号、部署数量或合同状态。对工业机器人而言，使用者、付款者和决策者可能分别是产线运营、工厂信息化团队、系统集成商与集团采购；本章没有证据证明这些角色已经在至简动力的实际项目中被拆分或签约。因而，现阶段可以把工厂和物流视为公司声称的客户工作流方向，而不能把它们计为已验证客户细分。行业材料显示，具身智能公司正在向工业制造、物流等场景扩展，但同业案例不构成至简动力的客户证明。投资判断应要求逐项目提供客户身份、部署地点、生产/试点状态、验收标准与付款凭证。
              现有证据指向目标工作流，但不是已核实客户。买方、使用者、付款方、场地和采购权限分别未知。可供尽调的客户细分至少需要具名组织、书面用例、运营地点、合同或采购订单，以及试点或生产等状态；本来源池没有为
              Simplexity 提供任何这些字段。因此，行业比较只能提供背景，不能归因于客户。这一区分避免把品牌标识、合作措辞或宽泛应用口径算作经常性商业采用。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
