      - number: '3.4'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              行业目前最强的潜在壁垒是制造规模、获取真实运营数据的能力、零部件和供应链控制，以及受信任的部署渠道，但这些壁垒仍可被挑战。TrendForce
              描述了行业转向实际用户价值，并报道头部厂商快速扩张；独立评论则提醒，许多演示仍是技术展示而非可靠的工业系统。公开报道还指出，产量增速快于订单，带来产能过剩和泡沫风险。对 Zhijian Power 而言，前 Li
              Auto 管理层和世界模型加硬件的路线可能有助于招聘与技术执行，但现有来源不能证明这些资产会带来更低成本、更安全运行或持久客户偏好。因此，现有厂商的反应和专用机器人替代仍是重大风险。
