          note: 媒体报道金额；不等于手头现金
        - id: development
          label: 模型训练、硬件研发、数据、算法
          note: 据报道的资金计划用途
        - id: pilots
          label: 两代产品、小批量、PoC
          note: 据报道的开发 / 商业化里程碑
        - id: deployments
