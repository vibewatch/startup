      - number: '6.2'
        title: 采用轨迹与留存：融资进展不等于商业采用
        blocks:
          - type: paragraph
            body: >-
              本次分配的直接公司证据仅支持一项融资与定位叙述：报道指称公司在成立不到一年内连续完成五轮融资、累计约20亿元，并主攻工厂和物流。该信息不能替代收入、客户数、活跃设备、部署地点、利用率、复购、续约或净收入留存。技术论文列出与Simplexity
              Robotics关联的研究作者和现实机器人任务结果，但论文实验结果属于技术信号，不是客户部署或商业留存证据。行业报道中其他公司的订单、客户数和交付量也不能外推至至简动力。故本章将采用轨迹标为未证实，并把客户合同、验收和重复购买数据列为材料级缺口。
              融资势头是融资信号，不是客户漏斗。可信的采用轨迹应展示线索、试点、转化、活跃站点、利用率、付费量、服务负担、续约和扩张。所引机器人论文提高了技术信号，因为它把公司与研究项目联系起来并报告现实任务；但实验室或基准测试成功不能证明付费部署。因此，本报告把资本获取、工程证据和客户证据分开。分母缺失很关键：没有付费状态或时间区间的项目数量，无法揭示增长、留存或收入质量。现有记录支持市场对公司的兴趣，但不支持持久商业使用。
