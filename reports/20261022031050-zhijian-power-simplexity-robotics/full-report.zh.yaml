  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 有证据支持的风险主题按投资判断中的可能性和严重性定位；由于公司特定事故频率未公开，定位采用定性方式。
    data:
      columns:
        - 中
        - 高
        - 严重
        - 未核实
      rows:
        - label: 高可能性
          values:
            - —
            - 原型机到生产的可靠性；供应商集中度
            - —
            - —
        - label: 中等可能性
          values:
            - 出口管制暴露
            - 监管落地；数据治理；融资中断
            - 工业安全失效
            - —
        - label: 中高可能性
          values:
            - —
            - 数据治理落地
            - —
            - 未核实的客户转化
        - label: 低或未核实
          values:
            - —
            - 网络安全 / 隐私；客户转化
            - —
            - 未核实的公司特定事故
        - label: 低可能性
          values:
            - 若不存在受影响的依赖项，则为跨境管制
            - —
            - —
            - 没有记录在案的事故
        - label: 未解决的可能性
          values:
            - —
            - 供应商资格认证失败
            - —
            - 客户集中度未知
    approximationNotes: 定性定位反映留存的证据和明确的未知项；它不是统计概率估计，也不是事故记录。
