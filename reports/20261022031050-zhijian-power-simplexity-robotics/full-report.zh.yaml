        blocks:
          - type: paragraph
            body: >-
              公司披露的商业化路径似乎依赖精密零部件供应商、本地工业基础设施和持续的私募融资。报道中的 Green Harmonic
              关系在战略上合理，因为它把通用模型与应用能力和谐波减速器制造结合起来；但公开口径没有证明排他性、定价、产能预留、质量保证或第二供应源。品类融资报道还显示，资本正集中到少数头部公司，同业不断宣布超大额融资、部署和订单。这带来融资与竞争风险：年轻公司可能要在收入质量可见前，先为硬件迭代、数据采集、现场支持和合规投入资金。             
              公开来源没有披露 Zhijian Power
              的收入、毛利率、烧钱、现金续航、债务、股权优先条款或客户集中度。论点失效应与可量化事项绑定：无法获得合格生产部署、关键供应中断且没有合格替代，或在商业证据出现前融资条款已大幅稀释控制权。
            claimRefs:
