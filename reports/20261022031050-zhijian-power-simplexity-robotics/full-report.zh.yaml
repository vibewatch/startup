              的智能驾驶研究、技术领导和量产经验。这种背景适合一家试图把模型研究推进到可制造系统的机器人公司，已报道的分工覆盖技术、资本和运营。但现有证据没有披露独立董事会、非创始人高管、安全负责人或治理控制。因此，从公开记录看，公司明显由创始人主导：团队有利于快速执行，而组织深度未披露是尽调缺口，不等于治理失灵。
