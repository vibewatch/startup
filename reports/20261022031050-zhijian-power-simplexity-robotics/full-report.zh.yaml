      - number: '2.3'
        title: 买方、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              工业和物流部署提供了最清晰的采用路径，因为运营负责人可以从吞吐量、正常运行时间、集成成本和安全性等维度，把机器人与人工、固定自动化和现有移动机器人比较。同业证据表明真实需求存在：Geekplus
              发布的公告称其约有 950 个终端客户，大客户复购率为 78%；一份独立中国市场综述则称，工业应用是 2026 年的主要部署方向。这些证据验证的是买方对仓储和工厂自动化的兴趣，不是 Simplexity
              自身的商业进展。对 Simplexity 而言，最可能的顺序是技术 PoC、现场集成与安全验收、付费试点、量化运营表现，之后才是多站点或车队铺开。公开证据没有说明其付款方、预算负责人、试点定价或转化率。
            claimRefs:
              - CM001
              - CM002
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              供给端势头很强：TrendForce 预计中国 2026 年产量增长 94%，并预计 Unitree 和 AgiBot 将拿下近 80%
              的出货量。这种集中既是需求信号，也提醒规模收益可能流向少数制造商。采用仍取决于能否走出展示阶段。DirectIndustry
              引述的独立专家认为，许多类人机器人仍处于中等成熟度，需要大幅改善可靠性、安全性、可维护性和集成；专用机器人仍可能更实用。中国 2026
              年标准框架在六个领域增加了全生命周期、应用、数据、安全和伦理要求。因此，相比自上而下的品类预测或融资规模，付费部署、正常运行时间、人工介入率、服务成本、认证和重复订单更能影响估值。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 品类增长不等于公司需求
            body: Simplexity 仍处于小批量生产和概念验证阶段，因此不能把品类预测资本化为公司收入。付费试点、重复部署、正常运行时间、人工介入率和全口径客户 ROI，才是尚缺的桥梁。
            calloutType: risk
            claimRefs:
              - CM002
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集不只包括类人机器人初创公司。AgiBot 和 Unitree 是中国可见的规模与品牌领先者，UBTech 则强调工业类人机器人和工厂协同作业。Galaxy General、智平方和 Zhijian
              Power 代表以模型为核心的全栈工业路线。Leju 同时覆盖教育、研究和全尺寸平台，XPeng
              则带来汽车制造与分销能力。客户还可以购买专用机器人、继续使用传统自动化，或自行搭建集成方案。由此形成替代边界：通用机器人必须用灵活性，证明自己能胜过专用机器的可靠性、吞吐量和任务经济性。
