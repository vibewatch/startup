    title: 从证据到决策的路径
    type: flow
    summary: 市场采用证据与尚未解决的公司特定输入共同导向有条件的继续研究建议。
    data:
      nodes:
        - id: market
          label: 对外销售市场预测
          detail: 2026 年中国市场 $2B；2030 年 $15B
        - id: peers
          label: 同业融资与披露
          detail: 据报道存在大额轮次、收入、订单和公开市场活动
        - id: company
