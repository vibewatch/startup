  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资边界应从封闭或半结构化商业环境开始，而不是覆盖整个具身智能或消费机器人品类。独立报道称，Simplexity
              优先布局工厂、零售门店和物流；其硬件已进入小批量生产和概念验证，但尚未披露规模化部署。因此，实际应纳入的支出池包括移动操作或类人机器人硬件、感知与动作软件、系统集成、部署及持续支持。固定式工业自动化、不执行同类操作任务的传统
              AMR，以及非结构化家庭机器人，都是相邻领域或替代方案，不应自动算入 Simplexity 的可服务市场。买方还可以继续使用人工、重设计工作流，或部署专用机器；每一种替代方案都会抬高通用系统的 ROI 门槛。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
