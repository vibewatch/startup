            body: >-
              LaST0 论文提供了与公司所报道技术方向相关的最清晰公开架构描述。论文提出潜在时空思维链，用于建模未来视觉动态、3D 结构和机器人本体感知；并通过 Mixture-of-Transformers
              设计实现低频推理专家和高频动作专家。论文称其在 10 项现实世界任务上评估，在桌面、移动和灵巧操作类别中，平均成功率较既有方法分别提高 13%、14% 和
              14%。这些是论文报告的结果，不是公司部署保证。论文项目页列出演示，却没有公开 API、集成规格、正常运行记录、物料清单或服务等级承诺。公司 2026 年 3
              月画像还描述了通过端侧采集和人工示范建立数据闭环的计划，但没有提供数据集规模、标注协议、仿真到现实验证或可复现材料。因此，成熟度应评为研究原型到早期产品化，尚未证明是生产基础设施。
