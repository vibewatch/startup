chapter:
  number: 7
  title: Risks
  summary: "Public evidence points to meaningful regulatory, commercialization, partner-dependency, and financing risks, but does not substantiate a company-specific safety incident, outage, litigation, or customer concentration event. The highest-priority underwriting work is to verify production deployment, safety controls, supply commitments, cash runway, and the legal terms behind public cooperation and funding claims."
sections:
  - id: regulatory-and-compliance
    title: Regulatory and compliance exposure
    body: "The regulatory risk is forward-looking rather than tied to a disclosed enforcement event. China’s 2026 standards framework spans the full lifecycle of humanoid robots and embodied intelligence, including model training, inference, deployment, applications, safety, and ethics. That breadth increases the surface area for testing, data-governance, identity, and operational-compliance work as products move from demonstrations into factories. The available official-adjacent standards account says more than 120 institutions participated and that an initial list of 52 standards was published, while also listing several items as drafting, pre-research, or under approval. This indicates an evolving rulebook rather than a settled compliance baseline. The company-specific diligence question is whether its data-collection, teleoperation, model deployment, and industrial-safety controls are already mapped to applicable requirements. No assigned source confirms a Zhijian Power license, certification, breach, recall, or enforcement action; that absence is an evidence gap, not proof of clean status."
    claimRefs: [CR001, CR002, CR003, CR004, CR011]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: commercialization-and-operations
    title: Commercialization and operating execution
    body: "The most immediate operating risk is the gap between demonstrated capability and repeatable, safe production economics. A February 2026 local report describes a first industrial dual-arm robot with adaptive gripper and teleoperation data gloves as having entered sample testing and productization, and says the company is working to solve scale-up in real physical settings. That is useful evidence of a development milestone, but it is not evidence of paid production deployment, uptime, service cost, acceptance testing, or repeat orders. The same report frames the Suzhou innovation center and the Green Harmonic partnership as a route to connect research, manufacturing, and application; it does not disclose binding volumes or service-level obligations. Competitor reporting shows how quickly the category is moving toward large financings and orders, which raises execution and timing pressure without proving that Zhijian Power has comparable traction. Underwriting should therefore treat reliability, safety, installation time, maintenance burden, and customer acceptance as unresolved operating variables."
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-and-financial-resilience
    title: Partner, capital, and thesis-break risks
    body: "The company’s disclosed route to commercialization appears dependent on an ecosystem of precision-component suppliers, local industrial infrastructure, and continued private financing. The reported Green Harmonic relationship is strategically logical because it combines general-model and application capability with harmonic-reducer manufacturing, but the public account does not establish exclusivity, pricing, capacity reservations, quality guarantees, or a second source. Category financing reports also describe a market where capital is concentrating in a small number of leaders and where peers are announcing very large rounds, deployments, and orders. That creates a financing and competitive risk: a young company may need to fund hardware iteration, data collection, field support, and compliance before revenue quality is visible. Public sources do not disclose Zhijian Power’s revenue, gross margin, burn, runway, debt, cap-table preferences, or customer concentration. A thesis-break should be tied to measurable failure to secure qualified production deployments, a material supplier interruption without a qualified substitute, or financing terms that materially dilute control before commercial proof."
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or issue, Jurisdiction/status, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - ["Lifecycle safety, ethics, and deployment standards", "China; 2026 framework released, implementation work continuing", "Medium-high", "High", "Emerging; public sources describe standards work but not company mapping", "High", "Obtain the compliance matrix, applicable standards list, test reports, and accountable owner"]
      - ["Embodied-intelligence data and model governance", "China; data lifecycle and training/inference/deployment requirements are in scope", "Medium-high", "High", "Unknown", "High", "Review dataset provenance, consent/rights controls, retention, access logs, and deployment change controls"]
      - ["Robot identity, safety, and ethical operation", "China; identity-management and safe-development initiatives announced", "Medium", "High", "Unknown", "High", "Request product safety case, hazard analysis, emergency-stop validation, and incident-reporting process"]
      - ["Export-control or cross-border technology constraints", "Potentially multi-jurisdictional; no company-specific exposure confirmed", "Medium", "Medium-high", "Unknown", "Medium-high", "Map imported components, model/software dependencies, counterparties, and end-use screening"]
    notes: "Rows synthesize assigned regulatory and legal-policy material; company-specific licenses, certifications, enforcement status, and export exposure were not disclosed in the retained evidence, so residual exposure is an underwriting assessment rather than a reported incident."
    enumerationScope:
      coverage: sample
      basis: "Publicly identifiable regulatory and legal risk themes in the assigned 2026 refresh evidence, not a complete legal inventory."
    claimRefs: [CR001, CR002, CR003, CR004, CR011]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Prototype-to-production reliability gap", "High", "High", "Early; sample testing and productization reported", "High", "No public uptime, acceptance, failure-rate, or repeat-deployment data"]
      - ["Industrial safety or human-robot interaction failure", "Medium", "Critical", "Unknown", "High", "No retained incident, hazard-analysis, or independent certification evidence"]
      - ["Teleoperation/data-loop quality and scale bottleneck", "Medium-high", "High", "Early; teleoperation data capture described", "High", "Need data yield, labeling cost, edge cases, and model-release controls"]
      - ["Cybersecurity or privacy compromise in connected systems", "Medium", "High", "Unknown", "High", "No retained security architecture, penetration test, DPA, or incident disclosure"]
    notes: "Operational rows distinguish a reported development stage from unreported production performance; null public evidence is treated as an unresolved gap, not as zero incidents or zero risk."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Precision harmonic-reducer supply", "Green Harmonic; reported strategic component partner", "Potentially concentrated; no share or second-source data", "Capacity, quality, pricing, or qualification failure delays robot production", "High", "Verify contract, capacity reservation, QA rights, and qualified alternates", "High"]
      - ["Suzhou innovation-center and local ecosystem support", "Wuzhong industrial park / local government ecosystem", "Potentially location-dependent", "Facility, talent, or public-support assumptions do not translate into throughput", "Medium", "Underwrite standalone facility economics and continuity plan", "Medium-high"]
      - ["Private financing and strategic investors", "Undisclosed investors; category capital increasingly concentrated", "High until cap table and runway are verified", "Down-round, delayed financing, or restrictive terms constrain iteration", "High", "Obtain cash ledger, runway case, round documents, preferences, and board rights", "High"]
      - ["Industrial customers and pilot hosts", "Unnamed factories / application partners", "Unknown", "Pilot does not convert to paid repeat deployment", "High", "Request named customer list, contracts, acceptance criteria, revenue, renewals, and concentration schedule", "High"]
    notes: "The partner register uses public descriptions of roles and relationships; it does not infer exclusivity or contractual commitment where the source is silent."
    enumerationScope:
      coverage: partial
      basis: "Material dependencies visible in the assigned partnership, market, and financing evidence; private counterparties and contracts are not fully enumerated."
    claimRefs: [CR009, CR010, CR011, CR012]
