company:
  name: "Zhijian Power / 至简动力 / Simplexity Robotics"
chapter:
  number: 6
  title: Customers
  summary: "公开材料将至简动力定位为面向工厂和物流场景的具身智能公司，并报道其在2026年3月完成五轮融资、累计融资约20亿元；但本次分配到的证据没有披露可核验的客户名称、付费部署、订单金额、续约或留存指标。因此，客户商业化仍应按“场景定位已披露、采用质量未证实”处理。"
sections:
  - id: customer-segments
    title: "客户与使用场景：方向明确，买方尚未可核验"
    body: "公开报道把至简动力的目标场景描述为工厂和物流，但没有把场景描述连接到具体买方、地点、机器人型号、部署数量或合同状态。对工业机器人而言，使用者、付款者和决策者可能分别是产线运营、工厂信息化团队、系统集成商与集团采购；本章没有证据证明这些角色已经在至简动力的实际项目中被拆分或签约。因而，现阶段可以把工厂和物流视为公司声称的客户工作流方向，而不能把它们计为已验证客户细分。行业材料显示，具身智能公司正在向工业制造、物流等场景扩展，但同业案例不构成至简动力的客户证明。投资判断应要求逐项目提供客户身份、部署地点、生产/试点状态、验收标准与付款凭证。 The available evidence identifies a target workflow, not a verified account. Buyer identity, user identity, payer identity, site identity, and procurement authority remain separate unknowns. A diligence-ready segment needs a named organization, a documented use case, an operational location, a contract or purchase order, and a status such as pilot or production. None of those fields is supplied for Simplexity in this pool. The sector comparison therefore provides context only; it cannot be used as customer attribution. This distinction prevents logos, partnership language, or broad application claims from being counted as recurring commercial adoption."
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-quality
    title: "采用轨迹与留存：融资进展不等于商业采用"
    body: "本次分配的直接公司证据仅支持一项融资与定位叙述：报道指称公司在成立不到一年内连续完成五轮融资、累计约20亿元，并主攻工厂和物流。该信息不能替代收入、客户数、活跃设备、部署地点、利用率、复购、续约或净收入留存。技术论文列出与Simplexity Robotics关联的研究作者和现实机器人任务结果，但论文实验结果属于技术信号，不是客户部署或商业留存证据。行业报道中其他公司的订单、客户数和交付量也不能外推至至简动力。故本章将采用轨迹标为未证实，并把客户合同、验收和重复购买数据列为材料级缺口。 Funding momentum is a financing signal, not a customer funnel. A credible adoption trajectory would show leads, pilots, conversions, active sites, utilization, paid volume, service burden, renewals, and expansion. The cited robotics paper improves the technical signal because it links the company to a research project and reports real-world tasks, but laboratory or benchmark success does not establish a paying deployment. The report therefore separates capital access, engineering evidence, and customer evidence. Missing denominators are material: a count of projects without paid status or time period cannot reveal growth, retention, or revenue quality. The current record supports interest in the company, but not durable commercial usage."
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-risk
    title: "命名客户、扩张与集中度：尚无公开证明"
    body: "在本次成功预取且分配给本章的来源中，没有一份由客户、采购方、监管机构或独立评测者直接确认至简动力生产部署或采购结果的材料。至简动力的公开报道没有披露客户名称、试点到量产的转化率、单一客户收入占比、渠道伙伴、售后服务水平或停机/安全事件。与此同时，国家标准框架已经把应用开发、运行维护、安全与伦理纳入具身智能的全生命周期要求；这提高了未来客户验收和合规的证据门槛，而不是证明公司已经满足这些要求。对于工厂和物流客户，集中度、采购周期、系统集成依赖和现场安全责任都应在数据室中逐项核实。 Named customer proof is the missing bridge between positioning and underwriting. The absence of a public customer name is not proof that no customer exists; it is an evidence limitation. The same limitation applies to concentration: without a revenue denominator, top-customer share and channel dependence cannot be calculated. Industrial buyers also require safety, maintenance, cybersecurity, and acceptance documentation before production use. Public standards describe those diligence surfaces, but they do not certify Simplexity. A buyer-quality data room should include references that can be independently contacted, signed commercial terms, acceptance records, incident logs, service-level commitments, and a cohort view of renewals. Until then, the expansion thesis remains an open question rather than a measured outcome."
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
