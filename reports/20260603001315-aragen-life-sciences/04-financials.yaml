- id: cost-structure-and-capital-intensity
  title: Cost structure, working capital, and capital intensity
  body: 'The public cost surface shows a business with decent margins but very real operating leverage and balance-sheet demands. FY2024-25 EBITDA margin was 25.93%, while the standalone P&L shows employee benefits expense of about ₹443 crore and finance cost of roughly ₹31.7 crore. Using standalone totals, labor cost ran at around 26% of total income, which is consistent with a scientist-heavy CRDMO rather than an asset-light pure broker. Working capital is not trivial: standalone receivables were about ₹394 crore and inventories about ₹80 crore, partially offset by trade payables of about ₹138 crore, while current ratio sat near 1.63x. Capital intensity is the bigger issue. Aragen commissioned new manufacturing assets in FY2024-25, continued its Bangalore biologics build-out, and CRISIL still framed annual capex at roughly ₹400 crore. That is manageable, but only because EBITDA is already meaningful and the balance sheet has recently been supplemented with fresh equity.'
  claimRefs:
  - CI003
