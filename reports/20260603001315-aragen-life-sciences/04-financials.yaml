- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Latest public signal
  - Source vintage
  - Implication
  - Diligence ask
  rows:
  - - Fresh equity
    - INR 6,337.50 million secured during FY2025; Quadria invested $100 million at ~ $1.4 billion valuation
    - FY2025 annual report and Jan 2025 releases
    - Improves near-term funding flexibility and supports debt reduction plus capex
    - Provide exact fresh-cash receipt date, use-of-funds bridge, and post-money cap table
  - - Operating liquidity
    - CRISIL cited ₹300-400 crore cash accrual and ₹200 crore liquid surplus as of Mar 2024
    - Aug 2024 rating rationale
    - Supports current debt service but is stale for FY2026 underwriting
    - Provide FY2025 and current unrestricted cash, undrawn lines, and covenant headroom
  - - Annual capex load
    - CRISIL cited ~₹400 crore annual capex; official report confirms ongoing Bangalore and manufacturing expansion
    - Aug 2024 + FY2025 report
    - Capex remains meaningful relative to EBITDA
    - Provide remaining capex by project and committed-versus-discretionary split
  - - Debt stack
    - CRISIL listed ₹675.98 crore rated bank facilities, ₹200 crore NCD, proposed ₹200 crore term loan, and ₹50 crore CP
    - Aug 2024 rating rationale
    - Funding flexibility exists, but financing dependence is real
    - Provide current debt-maturity ladder, drawn balance, and refinancing plan
  - - Secured working capital
    - Working-capital loans and packing credit are secured on current assets with 3.30%-7.63% interest ranges
    - FY2025 annual report
    - Receivables and inventory are integral to funding model
    - Provide borrowing-base formulas, collateral headroom, and seasonal draw profile
  - - Charges and encumbrances
    - The Company Check listed ₹583.80 crore open charges and ₹768.38 crore satisfied charges
    - Late 2025 company-profile dataset
    - Security filings suggest meaningful lender footprint even after recent equity infusion
    - Reconcile ROC charges to current drawdowns and recently released security
  notes: Capital adequacy looks acceptable but not overfunded; several cells mix official, filing-style, and external-credit surfaces because the company does not publish a full treasury pack.
