- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Best public proxy today
  - Underwriting impact
  - Exact diligence path
  rows:
  - - Realized pricing by contract type
    - Needed to translate FTE/fee/program structure into gross profit
    - Official sources only disclose contract form, not price realization
    - Cannot underwrite price discipline or discount risk
    - Obtain anonymized pricing waterfalls for one discovery, one development, and one commercial account
  - - Sales cycle, CAC, and payback
    - Core GTM efficiency metric
    - Only proxy is management’s note that customer decisions were still slow in FY2025
    - Growth efficiency cannot be benchmarked
    - Request funnel, win-rate, and payback data for the last eight quarters
  - - Segment gross margins and backlog
    - Separates high-quality earnings from revenue mix noise
    - Public sources provide revenue and some mix hints but no segment P&L or backlog
    - Margin-expansion thesis is unproven
    - Request three-year segment P&Ls with bookings, backlog, and book-to-bill
  - - Biologics utilization and campaign economics
    - Determines whether Bangalore capex earns through to cash returns
    - Public sources confirm >50% growth and initial commercial orders only
    - Biologics upside remains narrative-heavy
    - Request site-level utilization, gross margin, and booked capacity by quarter
  - - Current unrestricted cash and covenant headroom
    - Needed to judge runway and refinancing risk
    - CRISIL liquidity snapshot is from Mar 2024; later disclosures do not publish cash balance
    - Capital-adequacy view is supportive but stale
    - Request monthly cash bridge, undrawn facilities, and covenant calculations to present date
  - - Remaining phase-two capex and timing
    - Material for debt needs and FCF timing
    - Company discloses a nearly $40 million project and FY26 commissioning target only
    - Hard to size incremental financing need
    - Request remaining project budget by tranche, contract status, and commissioning milestones
  notes: Every gap is tied to a specific underwriting blind spot; null or unknown means the metric is not public, not that it is immaterial.
