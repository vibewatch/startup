tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Revenue mechanism
  - Public scale or mix signal
  - Revenue-quality read
  - Diligence ask
  rows:
  - - Discovery services
    - FTE and fee-based contracts tied to chemistry, biology, and safety work
    - CRISIL says discovery including biologics was ~65% of FY2024 revenue
    - Recurring relationships and annual renewals support quality, but realized pricing is opaque
    - Break out discovery revenue by FTE, fee-based, and integrated-program share
  - - Small-molecule development and manufacturing
    - Drug substance, drug product, analytical, custom synthesis, and commercial API programs
    - FY2025 projects executed rose 30%; new customers and programs were added in CCS
    - Higher-value downstream work is scaling, but public gross margin by sub-line is unavailable
    - Provide segment revenue and gross margin by drug substance, drug product, and commercial supply
  - - Biologics development and manufacturing
    - Process development, analytics, GMP manufacturing, and California-to-Bangalore transfer
    - Management said biologics revenue grew >50% in FY2025 and CRISIL sized biologics at ~10% of FY2024 revenue
    - Fastest growth area, but current utilization and booking depth are not public
    - Share biologics revenue bridge, utilization, and campaign count by site
  - - Commercial API and advanced intermediates
    - Long-term manufacturing and supply supported by DMF and CMC capabilities
    - Commercial-manufacturing page emphasizes exclusive long-term API and intermediate supply
    - Potentially stickier and more scalable than project research, but customer concentration is undisclosed
    - Show top programs, contract tenor, and renewal rates for commercial supply accounts
  - - Other income and incentives
    - PLI claims, duty drawback, and fundraiser-linked interest benefits
    - Annual report explicitly cites these as additional income streams in FY2025
    - Helpful but non-core to normalized operating economics
    - Quantify one-off versus recurring share of reported other income and incentives
  notes: Rows enumerate the main monetization paths visible on public sources; missing segment margin data means mix quality can be judged directionally but not fully normalized.
