  title: Financials
  summary: 'Aragen’s public financial surface is stronger than that of most private CRDMOs: FY2024-25 revenue reached ₹1,845 crore with 25.9% EBITDA margin, customer concentration appears controlled, and CRISIL still described liquidity as strong entering FY2025. Revenue quality benefits from FTE and fee-based discovery work plus cross-sell into development and manufacturing, but segment margins, realized pricing, backlog, and biologics utilization remain undisclosed. The January 2025 Quadria infusion reduced near-term funding pressure, yet annual capex around ₹400 crore and secured working-capital borrowing mean capital intensity is still material.'
