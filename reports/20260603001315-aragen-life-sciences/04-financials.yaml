- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer
  - Public pricing basis
  - What is disclosed
  - What is still missing
  - Diligence ask
  rows:
  - - Discovery chemistry
    - FTE or fee-based
    - Official annual report and CRISIL both mention FTE and fee-based contracts
    - No price cards, utilization bands, or blended realization
    - Provide standard FTE rates, realized discounts, and utilization assumptions by client tier
  - - Integrated DS + DP
    - Program-based integrated workflow
    - Official page claims 2-3 months faster timelines and a 10-12 month dossier path
    - No indication of premium pricing versus sequential sourcing
    - Show win-rate uplift and pricing premium versus non-integrated deals
  - - Commercial API manufacturing
    - Long-term manufacturing and supply agreements
    - Official page emphasizes exclusive and long-term supply with DMF/CMC support
    - No disclosed take-or-pay, volume tiers, or pass-through logic
    - Provide contract archetypes with volume, minimums, and pass-through terms
  - - Biologics GMP manufacturing
    - Campaign-based clinical and commercial manufacturing
    - Official pages stress flexible single-use scale-up and California-to-Bangalore transfer
    - No batch pricing, yield guarantee, or capacity reservation terms
    - Share campaign pricing model, minimum batch economics, and tech-transfer pricing
  - - Digital and yield tools
    - Embedded productivity and yield uplift rather than standalone license fees
    - Digital pages describe OTIF, assay automation, and yield gains as service enhancers
    - No disclosure on how much of savings are retained versus passed to clients
