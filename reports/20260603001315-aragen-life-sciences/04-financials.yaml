  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sales-cycle-cac
    missingEvidence: Signed cohort-level funnel data covering RFP volume, win rate, average time from RFP to PO, onboarding lead time, and new-logo versus expansion mix.
    whyItMatters: Public commentary confirms slower decisions and more late-stage demand, but without cycle and conversion metrics it is impossible to underwrite sales efficiency or growth durability.
    diligencePath: Request the last eight quarters of qualified pipeline by stage, conversion rates, cycle-length distribution, and repeat-booking share by customer cohort.
    relatedQuestionRefs:
    - QI008
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: Program-level realization data showing list versus realized pricing, discount ladders, FTE utilization, change-order economics, and milestone acceptance rates.
    whyItMatters: Public sources describe contract form but not the economics that translate commercial wins into gross profit and cash.
    diligencePath: Ask management for anonymized pricing waterfalls for at least one discovery FTE contract, one fee-based integrated program, and one commercial-manufacturing account.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: biologics-utilization
    missingEvidence: Current utilization, batch count, booked capacity, yield profile, and customer concentration for the Bangalore biologics platform by phase and scale.
    whyItMatters: Public sources confirm new commercial orders and phase-two expansion, but not whether biologics capacity is filling fast enough to justify the capex pace.
    diligencePath: Request monthly utilization, booked campaigns, tech-transfer conversion, and gross-margin bridge for Morgan Hill and Bangalore combined.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: segment-margin-backlog
    missingEvidence: Segment-level gross margin, EBITDA, order backlog, book-to-bill, and cancellation data across discovery, small-molecule D&M, and biologics.
    whyItMatters: The public surface provides top-line growth and some mix hints, but not which segment is earning the margin or how much future revenue is already visible.
    diligencePath: Ask for three-year segment P&Ls, bookings/backlog, and utilization by business line with bridge reconciliations to consolidated revenue and EBITDA.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: closing-liquidity-runway
    missingEvidence: FY2024-25 closing unrestricted cash, committed undrawn facilities, debt-maturity ladder, covenant headroom, and management’s internal liquidity buffer targets.
    whyItMatters: CRISIL’s March 2024 liquidity snapshot is supportive, but underwriting FY2026 capital adequacy needs current cash and covenant headroom rather than a prior-year external point-in-time view.
    diligencePath: Request a monthly cash bridge from March 2024 to present, including debt drawdowns, capex payments, dividend cash outflow, and covenant calculations.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: minor
    topic: phase-two-capex-detail
    missingEvidence: Remaining Bangalore phase-two capex, timing by tranche, and what share is already contractually committed versus discretionary.
    whyItMatters: The disclosed expansion plan is material relative to EBITDA, so the remaining spend and timing change near-term financing dependence.
    diligencePath: Request the capex budget by project, committed purchase orders, expected commissioning milestones, and variance versus original build plan.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
sections:
- id: revenue-model-and-mix
  title: Revenue model and disclosed mix
  body: 'Aragen’s revenue model is closer to a diversified services portfolio than a single-program biotech bet. Official materials show monetization stretching from discovery work sold on FTE and fee-based terms into development, commercial API supply, and biologics manufacturing. The FY2024-25 annual report provides an unusually usable private-company surface: consolidated revenue reached ₹1,845 crore, EBITDA margin held near 26%, the company reported more than 400 customers, and no single customer exceeded 9% of revenue. That does not make the mix fully transparent. CRISIL’s FY2023-24 lens still matters because it identifies discovery as roughly two-thirds of revenue and biologics as about one-tenth, implying the revenue base remains discovery-heavy even as management pushes harder into later-stage manufacturing. The core positive for underwriting is that Aragen monetizes multiple handoff points in the molecule lifecycle rather than relying on one pricing model or one customer class.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
