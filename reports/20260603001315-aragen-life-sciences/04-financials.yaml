- id: commercial-motion-and-retention
  title: Commercial motion and sales-efficiency proxies
  body: 'Public GTM disclosure is thin, so the chapter has to rely on proxies rather than orthodox SaaS-style sales metrics. The strongest positive proxy is customer stickiness: CRISIL says Aragen retains 75-80% of customers, while the annual report says concentration is controlled and top-20 pharma revenue expanded. The second positive proxy is cross-sell. The company says development and manufacturing projects executed grew 30% in FY2024-25, and the first three commercial Bangalore biologics orders came from California teams, which suggests Aragen can convert discovery and process-development relationships into higher-value downstream work. The main weakness is that management simultaneously admits customer decision-making stayed slow and 2026 demand is still skewed toward better-funded Phase I/II programs. That means the sales funnel likely improved versus 2023-24, but public evidence still does not show cycle time, conversion, or CAC. Underwriting should therefore treat retention and
    cross-sell as genuine strengths but not as substitutes for funnel data.'
  claimRefs:
  - CI007
