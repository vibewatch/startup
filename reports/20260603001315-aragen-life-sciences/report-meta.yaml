summary:
  headline: >-
    Aragen is a credible scaled Indian CRDMO with improving disclosure and customer depth, but the
    last-round ~$1.4 billion benchmark already prices in much of the visible upside while execution,
    compliance, and utilization evidence remains incomplete.
