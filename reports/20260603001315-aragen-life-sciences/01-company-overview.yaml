  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: funding-history
      missingEvidence: Exact total primary capital raised across all equity rounds, including how much of the 2021 Goldman and 2025 Quadria transactions was secondary liquidity.
      whyItMatters: Total raised and the mix between primary and secondary capital determine dilution history, liquidity pressure, and how much dry powder remains before any IPO.
      diligencePath: Obtain the latest shareholder register, financing summary, and transaction term sheets from management or from MCA-filed shareholder resolutions.
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: material
      topic: fy2025-filings
      missingEvidence: Direct MCA-hosted FY2024-25 financial statements and annual return schedules were not directly retrievable during this run.
      whyItMatters: The annual report is useful, but MCA filings would give the canonical legal numbers for subsidiaries, debt, related-party transactions, and shareholding.
      diligencePath: Pull the FY2024-25 annual return and full financial statements from the MCA portal using the CIN and reconcile them to the website annual report.
    - type: conflicting-data
      severity: material
      topic: headcount
      missingEvidence: A single authoritative employee count at or near runDate.
      whyItMatters: Public sources range from 3,859 to about 4,500 employees, which affects productivity and cost-base calculations used later in valuation.
      diligencePath: Request the latest HRIS headcount or auditor-reviewed employee note from management and reconcile it to vendor datasets.
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Revenue concentration by top clients, especially among the top-20 pharma relationships Aragen highlights.
      whyItMatters: High concentration could materially change the quality of the 400+ client headline and the durability of reported retention.
      diligencePath: Ask management for top-10 customer concentration, average contract duration, and retention waterfall by segment.
    - type: private-evidence-only
      severity: minor
      topic: leadership-depth
      missingEvidence: Full senior-leadership reporting lines, succession plan, and tenure data beyond the publicly listed board and functional heads.
      whyItMatters: The leadership table is necessarily partial; deeper management-bench evidence is needed to judge succession resilience and whether execution is overly concentrated around a few visible executives.
      diligencePath: Request an org chart with tenure, succession coverage, and business-unit accountability for the top 25 leaders.
      relatedTableRefs:
        - TO002
    - type: private-evidence-only
      severity: minor
      topic: ipo-readiness
      missingEvidence: Formal IPO timeline, board mandates, and advisor roster beyond public press hints.
      whyItMatters: Institutional scale signals are visible, but timing and readiness determine whether the 2025 valuation should be treated as a pre-IPO or long-duration private benchmark.
      diligencePath: Request board materials or management commentary on listing readiness, governance upgrades, and expected listing venue.
sections:
  - id: identity-and-evolution
    title: Identity and Evolution
    body: >-
      Aragen's identity is unusually well documented for a private Indian CRDMO because the company publishes both a
      detailed historical timeline and a recent annual report. The legal entity was incorporated on 07 December 2000
      in Hyderabad, but the operating story the company highlights starts on 02 April 2001 when G V Sanjay Reddy
      established GVK BIO as an informatics company in Hyderabad [CO001][CO002]. Over time the business expanded from
      informatics into chemistry, biology, manufacturing, and then biologics through acquisitions and site additions
      [CO004][CO005][CO006]. The pivotal brand transition came in May 2021, when GVK BIO rebranded as Aragen to signal
      a broader end-to-end outsourcing proposition for global biopharma rather than a narrower legacy CRO identity
      [CO007]. That rebrand matters because later chapters rely on Aragen as the canonical entity name even though many
      older third-party sources, lenders, and investors still reference GVK Biosciences [CO001][CO007].
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO005
      - CO006
      - CO007
    tableRefs:
      - TO004
    figureRefs:
      - FO001
  - id: leadership-and-governance
    title: Leadership and Governance
    body: >-
      Public leadership disclosures show a company that remains founder-promoter influenced but is now governed through
      a broader institutional board. The board page lists chairman D S Brar, promoter-director G V Keshav Reddy,
      Goldman-backed director Rajat Sood, Quadria cofounder Amit Varma, independent industry veterans Robert Ruffolo,
      Ajay Srivastava, and Anita Ramachandran, plus MD and CEO Manni Kantipudi [CO003][CO031][CO032]. Manni's tenure
      dates back to 2007, which creates both continuity and some key-person dependence because he spans strategy,
      M&A, and culture across the whole organization [CO032][CO042]. The broader management team, however, is now
      explicitly segmented by function and business line — finance, commercial, discovery, development and
      manufacturing, biologics, digital, quality, and HR — which reduces single-threaded execution risk compared with a
      founder-only leadership model [CO033][CO042]. Governance processes also look more institutional than typical for
      a private company, with an audit committee and external auditors named as part of compliance oversight [CO030].
    claimRefs:
      - CO003
      - CO030
      - CO031
      - CO032
      - CO033
      - CO042
    tableRefs:
      - TO002
  - id: capital-valuation-and-investors
    title: Capital, Valuation, and Investors
    body: >-
      Aragen's ownership story has shifted from promoter-plus-PE backing to a more visibly institutional setup. In May
      2021 Goldman Sachs bought a significant minority stake from ChrysCapital and other existing shareholders,
      marking the first clearly visible global strategic-capital endorsement in the current era [CO008]. In January
      2025 Quadria Capital then invested $100 million at an approximate $1.4 billion valuation, largely as fresh
      capital with a smaller secondary component, and explicitly joined Goldman as the second strategic investor in the
      business [CO009][CO010]. The current board composition reflects that investor mix because Rajat Sood and Amit
      Varma now appear on the public board page [CO031][CO040]. The main limitation is that Aragen does not publicly
      disclose a full cap table, exact total primary capital raised, or the exact size of the secondary liquidity
      element in recent rounds, so the company should be treated as institutionally scaled and IPO-optional rather than
      already transparently IPO-ready [CO036][CO037][CO040].
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO031
      - CO036
      - CO037
      - CO040
    tableRefs:
      - TO003
    figureRefs:
      - FO002
  - id: footprint-capabilities-and-scale
    title: Footprint, Capabilities, and Scale
    body: >-
      Official materials position Aragen as a broad, integrated outsourcing platform rather than a single-service CRO or
      CDMO. The company describes itself as a concept-to-commercial CRDMO spanning small molecules, biologics, peptides,
      and related programmes for pharma, biotech, agrochemical, and animal-health customers [CO023]. The physical
      footprint supports that claim: Hyderabad remains the global headquarters, Morgan Hill anchors US biologics work,
      and the global-locations page lists campuses or offices across Hyderabad, Mallapur, Visakhapatnam, Bengaluru,
      Pune, Cambridge, and Morgan Hill, while the annual report simplifies this into six core operating campuses within
      1.6 million square feet of infrastructure [CO019][CO024][CO025][CO026][CO027]. Scale disclosures are also strong
      by private-company standards: Aragen says it has 4,500+ employees, 450+ PhDs, 290+ active clinical programmes,
      100+ INDs filed via its cell lines, and 400+ customers [CO014][CO015][CO016][CO017][CO020]. Quality and
      regulatory markers — ISO systems, USFDA-linked facilities, EDQM, PMDA, WHO, CDSCO, and AAALAC coverage — help
      explain why large pharma clients are willing to outsource complex programs to an India-headquartered platform
      [CO028][CO029].
    claimRefs:
      - CO014
      - CO015
      - CO016
      - CO017
      - CO019
      - CO020
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
    tableRefs:
      - TO001
    figureRefs:
      - FO003
  - id: disclosed-metrics-and-data-frictions
    title: Disclosed Metrics and Data Frictions
    body: >-
      Aragen discloses more operating information than many private peers, but several important metrics still require
      caution. The FY2024-25 annual report gives clean headline financials of ₹1,845 crore revenue, ₹478 crore EBITDA,
      and ₹180 crore profit after tax, which is strong enough to use as the canonical financial baseline for this run
      [CO011][CO012][CO013]. Customer-quality signals are also supportive because the company says it serves 400+
      customers, 15 of the top 20 large pharma companies, and maintains a repeat-customer rate above 90 percent
      [CO020][CO021][CO022][CO041]. The main friction comes from external data vendors: The Company Check lists 3,859
      employees and substantial charges, while Growjo supplies a lower headcount and an estimated revenue number that
      does not map cleanly to the official annual report [CO037][CO038][CO039]. The right analytical posture is to rely
      on company-reported FY2025 financials, use third-party directories only as directional triangulation, and carry
      unresolved diligence asks on exact headcount, cap-table detail, and customer concentration into later chapters
      [CO036][CO039][CO040].
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO020
      - CO021
      - CO022
      - CO036
      - CO037
      - CO038
      - CO039
      - CO040
      - CO041
