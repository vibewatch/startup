chapter:
  number: 1
  title: Company Overview
  summary: >-
    Aragen Life Sciences is a Hyderabad-headquartered CRDMO that evolved from GVK BIO into an integrated
    discovery-to-commercial manufacturing partner spanning small molecules, biologics, peptides, and related
    services. Official FY2024-25 revenue was ₹1,845 crore, while strategic minority investments from Goldman
    Sachs in 2021 and Quadria Capital in 2025 positioned the company around a $1.4 billion valuation, though
    public sources still diverge on precise headcount and cap-table detail.
