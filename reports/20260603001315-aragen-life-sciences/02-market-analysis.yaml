chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Aragen's addressable market is best defined as outsourced innovator services spanning discovery,
    development, and manufacturing rather than the whole Indian pharma market. Public sources agree that
    India is benefiting from China+1, cost advantages, and demand for complex modalities, but the headline
    India CRDMO market size varies widely from a narrow $3-3.5 billion lens to a broad $22.6 billion lens,
    while 2026 commentary increasingly argues that specialization, digital capability, and talent depth now
    matter more than scale alone.
