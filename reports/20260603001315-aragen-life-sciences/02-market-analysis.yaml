  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: india-market-definition
      missingEvidence: A standardized public definition that reconciles narrow innovator-services CRDMO estimates with broader outsourced-services market estimates for India.
      whyItMatters: Valuation can be materially overstated if a broad market estimate is treated as directly serviceable by integrated mid-market providers like Aragen.
      diligencePath: Obtain methodology notes from BCG, BlueWeave, and Frost or management's internal market map to normalize what each estimate includes.
    - type: private-evidence-only
      severity: material
      topic: aragen-sam
      missingEvidence: Aragen-specific serviceable available market by modality, geography, and phase of development.
      whyItMatters: Later valuation work needs a realistic SAM rather than only global or national market headlines.
      diligencePath: Request pipeline-stage revenue mix, geography mix, and modality mix from management to convert external TAMs into an Aragen-relevant SAM.
    - type: missing-source
      severity: material
      topic: budget-ownership
      missingEvidence: Public sponsor-level procurement data showing exactly which executive budget owners approve discovery versus late-stage manufacturing outsourcing.
      whyItMatters: Buyer mapping is central to sales-cycle analysis and affects the realism of adoption timing assumptions.
      diligencePath: Review public RFPs, procurement notices, or sponsor interviews and augment with customer calls.
    - type: private-evidence-only
      severity: minor
      topic: 2026-bookings
      missingEvidence: Audited 2026 order-intake or backlog data for Indian CRDMOs that would confirm whether the reset-year thesis is visible in bookings rather than only commentary.
      whyItMatters: The bearish 2026 scenario may be directionally right but is not yet corroborated by broad audited financial disclosures.
      diligencePath: Use quarterly investor calls from listed CRDMO peers and management pipeline commentary to validate whether contract timing has actually slipped.
sections:
  - id: market-boundary-and-substitutes
    title: Market Boundary and Substitutes
    body: >-
      The relevant market for Aragen is not the entire Indian pharmaceutical economy; it is the outsourced
      innovator-services layer that sits between sponsor R&D and commercial launch. Sector sources consistently define
      CRDMOs as integrated providers of discovery, development, and manufacturing rather than simple capacity vendors
      [CM001][CM002]. That means the included spend is sponsor-funded external work across discovery, preclinical and
      clinical development support, CMC, analytical services, and commercial manufacturing [CM002]. The excluded spend is
      equally important: in-house pharma R&D, end-market medicine sales, hospital budgets, and generic distribution are
      all part of the wider pharma ecosystem but not directly addressable outsourcing revenue for a company like Aragen
      [CM003]. This boundary also clarifies the status-quo substitute. The main substitute is not another CRDMO alone;
      it is a sponsor deciding to keep work in-house or to split work across specialized CROs and CDMOs instead of using
      an integrated partner [CM001][CM003].
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: sizing-lenses-and-contradictions
    title: Sizing Lenses and Contradictions
    body: >-
      Public market sizing is directionally bullish but numerically inconsistent. On the broadest lens, BlueWeave puts
      India's CRDMO market at $22.61 billion in 2024 and $53.53 billion by 2031 [CM004]. On a much narrower lens, BCG
      and IPSO describe the sector as only $3-3.5 billion today but capable of reaching $22-25 billion by 2035 [CM005].
      JM Financial and IBEF sit between those endpoints, both pointing to roughly $14 billion by 2028 [CM006][CM007].
      The most useful interpretation is not to pick one number blindly but to recognize that the estimates are describing
      different market boundaries and service mixes [CM008]. The same problem exists globally: JM cites a $197 billion to
      $302 billion CRDMO trajectory, PharmaSource says $220 billion in 2025 and $236 billion in 2026, and Mordor is even
      higher [CM009][CM010][CM011]. For later valuation work, these figures are better treated as a range of lenses than
      as one canonical TAM.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM009, CM010, CM011]
    tableRefs: [TM002]
    figureRefs: [FM002]
  - id: buyers-and-adoption-path
    title: Buyers, Users, and Adoption Path
    body: >-
      Buyer behavior in CRDMO is stage-specific. Early outsourcing is often driven by biotech founders, program leads,
      and R&D teams that lack scale or want to preserve capital, while late-stage outsourcing is more likely to be owned
      by CMC, tech-ops, procurement, and supply-chain leaders focused on speed, reliability, and commercial readiness
      [CM017][CM033]. That change in budget owner is one reason integrated vendors are rewarded more heavily as programs
      approach clinic and commercial scale [CM025][CM033]. Peer disclosures reinforce that broad buyer map: Syngene explicitly targets global pharma,
      biotech, animal health, and specialty chemical customers from early discovery to commercial supply, while WuXi and
      Lonza describe similar integrated, cross-border operating models [CM018][CM019][CM020]. This matters for Aragen
      because its sweet spot is the integrated part of the market where sponsors prefer fewer handoffs and one quality
      system across the molecule lifecycle [CM034]. In other words, Aragen's market is not only large because outsourcing
      is growing; it is large because a meaningful subset of buyers increasingly wants integrated partners rather than a
      chain of disconnected specialists [CM017][CM033][CM034].
    claimRefs: [CM017, CM018, CM019, CM020, CM033, CM034]
    tableRefs: [TM003]
    figureRefs: [FM003, FM004]
  - id: growth-drivers-and-constraints
    title: Growth Drivers and Constraints
    body: >-
      India's positive market narrative is built on several durable drivers: cost advantage, China+1 supply-chain
      diversification, rising demand for advanced modalities, a large generic and export base, and supportive policy
      frameworks [CM014][CM015][CM021][CM028][CM029][CM031]. Export and pharma-base data matter because they explain why
      India has the scientific labor pool and regulator-facing credibility to win more outsourced work [CM029][CM030].
      But the constraints are no longer trivial footnotes. BCG and YCP both highlight talent shortages, regulatory
      complexity, and input dependencies, while KPMG adds pricing pressure and import reliance [CM022][CM023][CM032].
      The 2026 bearish view pushes further, arguing that India may face a reset year if tariffs, reshoring, and slower
      decision cycles blunt near-term order flow [CM026]. The practical conclusion is that the sector still has strong
      growth odds, but the next winners are more likely to be specialized, digitally enabled, and compliance-strong
      platforms than generic scale players [CM024][CM025][CM027][CM035][CM036].
    claimRefs: [CM014, CM015, CM021, CM022, CM023, CM024, CM025, CM026, CM027, CM028, CM029, CM030, CM031, CM032, CM035, CM036]
    tableRefs: [TM004]
