    {
      "id": "supports-versus-pressures",
      "title": "What supports and what pressures the valuation",
      "body": "Several facts support the benchmark. Aragen is not a concept stock: it has disclosed revenue, positive EBITDA, broad customer reach, accelerating biologics growth, and a credible macro tailwind from diversified outsourcing. Broker and strategy research still describe Indian CRDMOs as structurally advantaged on cost, regulatory footprint, and China+1 demand, and public-market investors continue to pay real premiums for the best-positioned names. But the counterweights are equally important. Public commentary in late 2025 already warned that 2026 could be a reset year as tariffs, reshoring, and selective multiple fatigue reshape outsourcing flows. Jefferies' own public commentary also shows that public investors still punish weak execution and limited near-term triggers. Aragen's actual FY2024-25 margin came in below CRISIL's earlier expectation, and the company still has not disclosed the utilisation, cap-table, or quarterly operating detail that would justify private-market parity with the cleanest listed peers. That leaves the benchmark supported, but not comfortably underwritten, by public evidence alone.",
