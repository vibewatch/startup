    {
      "id": "scenario-ranges-and-return-math",
      "title": "Scenario ranges and return math",
      "body": "The right valuation output is a band, not a point estimate. In the bull case, Aragen can plausibly support roughly $1.5-1.8 billion if Bengaluru utilisation becomes visible, modality expansion converts into commercial volume, and the IPO path tightens enough to pull the company toward a 6.5-8.0x revenue frame. In the base case, the company holds quality and growth but remains partially discounted for private opacity, yielding roughly $1.1-1.4 billion. In the bear case, a sector reset, tariff noise, or slower site ramp moves the business toward 3.5-4.5x revenue and roughly $0.8-1.0 billion. Those bands matter because the entry benchmark was already $1.4 billion. At that price, the bull midpoint offers only modest gross upside, the base midpoint is roughly capital preservation, and the bear midpoint is a real capital-loss scenario. That asymmetry is why the recommendation must stay price-sensitive rather than simply quality-sensitive.",
