    "title": "Valuation",
    "summary": "Aragen's January 2025 ~$1.4 billion benchmark is supportable only as the upper edge of a fair public-data range. Disclosed FY2024-25 revenue and peer multiples argue that the benchmark is not obviously wrong, but private-company opacity, early biologics ramp proof, and a more selective 2026 sector backdrop leave limited upside for fresh capital without better diligence evidence or more investor-friendly terms."
  },
  "sections": [
    {
      "id": "benchmark-and-price-discipline",
      "title": "Benchmark and price discipline",
      "body": "The only clean public financing anchor is still the January 2025 Quadria transaction: $100 million at about a $1.4 billion valuation, mostly as fresh capital and explicitly framed around expansion to meet outsourcing demand. That benchmark is real, but it is not self-validating. Aragen's own FY2024-25 annual report now gives enough disclosed financial context to stress-test it: ₹1,845.11 crore of revenue, ₹478.47 crore of EBITDA, no single customer above 9% of revenue, and fresh equity earmarked for debt reduction and ongoing capex. Using a round ₹83 to the dollar, the January 2025 benchmark implies roughly 6.3x FY2024-25 revenue. That is neither obviously cheap nor obviously absurd; it sits in the middle of a wide public-comp range. The underwriting issue is therefore not whether the benchmark existed, but whether investors should still pay it after adjusting for private-company opacity, still-young biologics manufacturing proof, and a 2026 market context that has become more discriminating.",
