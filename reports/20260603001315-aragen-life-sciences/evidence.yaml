evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding-history
    missingEvidence: >-
      Exact total primary capital raised across all equity rounds, including how much of the 2021 Goldman and 2025
      Quadria transactions was secondary liquidity.
    whyItMatters: >-
      Total raised and the mix between primary and secondary capital determine dilution history, liquidity pressure, and
      how much dry powder remains before any IPO.
    diligencePath: >-
      Obtain the latest shareholder register, financing summary, and transaction term sheets from management or from
      MCA-filed shareholder resolutions.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: fy2025-filings
    missingEvidence: >-
      Direct MCA-hosted FY2024-25 financial statements and annual return schedules were not directly retrievable during
      this run.
    whyItMatters: >-
      The annual report is useful, but MCA filings would give the canonical legal numbers for subsidiaries, debt,
      related-party transactions, and shareholding.
    diligencePath: >-
      Pull the FY2024-25 annual return and full financial statements from the MCA portal using the CIN and reconcile
      them to the website annual report.
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A single authoritative employee count at or near runDate.
    whyItMatters: >-
      Public sources range from 3,859 to about 4,500 employees, which affects productivity and cost-base calculations
      used later in valuation.
    diligencePath: >-
      Request the latest HRIS headcount or auditor-reviewed employee note from management and reconcile it to vendor
      datasets.
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by top clients, especially among the top-20 pharma relationships Aragen highlights.
    whyItMatters: >-
      High concentration could materially change the quality of the 400+ client headline and the durability of reported
      retention.
    diligencePath: Ask management for top-10 customer concentration, average contract duration, and retention waterfall by segment.
  - type: private-evidence-only
    severity: minor
    topic: leadership-depth
    missingEvidence: >-
      Full senior-leadership reporting lines, succession plan, and tenure data beyond the publicly listed board and
      functional heads.
    whyItMatters: >-
      The leadership table is necessarily partial; deeper management-bench evidence is needed to judge succession
      resilience and whether execution is overly concentrated around a few visible executives.
    diligencePath: Request an org chart with tenure, succession coverage, and business-unit accountability for the top 25 leaders.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: ipo-readiness
    missingEvidence: Formal IPO timeline, board mandates, and advisor roster beyond public press hints.
    whyItMatters: >-
      Institutional scale signals are visible, but timing and readiness determine whether the 2025 valuation should be
      treated as a pre-IPO or long-duration private benchmark.
    diligencePath: >-
      Request board materials or management commentary on listing readiness, governance upgrades, and expected listing
      venue.
  - type: conflicting-data
    severity: material
    topic: india-market-definition
    missingEvidence: >-
      A standardized public definition that reconciles narrow innovator-services CRDMO estimates with broader
      outsourced-services market estimates for India.
    whyItMatters: >-
      Valuation can be materially overstated if a broad market estimate is treated as directly serviceable by integrated
      mid-market providers like Aragen.
    diligencePath: >-
      Obtain methodology notes from BCG, BlueWeave, and Frost or management's internal market map to normalize what each
      estimate includes.
  - type: private-evidence-only
    severity: material
    topic: aragen-sam
    missingEvidence: Aragen-specific serviceable available market by modality, geography, and phase of development.
    whyItMatters: Later valuation work needs a realistic SAM rather than only global or national market headlines.
    diligencePath: >-
      Request pipeline-stage revenue mix, geography mix, and modality mix from management to convert external TAMs into
      an Aragen-relevant SAM.
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Public sponsor-level procurement data showing exactly which executive budget owners approve discovery versus
      late-stage manufacturing outsourcing.
    whyItMatters: Buyer mapping is central to sales-cycle analysis and affects the realism of adoption timing assumptions.
    diligencePath: Review public RFPs, procurement notices, or sponsor interviews and augment with customer calls.
  - type: private-evidence-only
    severity: minor
    topic: 2026-bookings
    missingEvidence: >-
      Audited 2026 order-intake or backlog data for Indian CRDMOs that would confirm whether the reset-year thesis is
      visible in bookings rather than only commentary.
    whyItMatters: >-
      The bearish 2026 scenario may be directionally right but is not yet corroborated by broad audited financial
      disclosures.
    diligencePath: >-
      Use quarterly investor calls from listed CRDMO peers and management pipeline commentary to validate whether
      contract timing has actually slipped.
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized pricing, FTE or FFS rate cards, minimum batch commitments, and discount structures for Aragen and the
      closest peer set.
    whyItMatters: >-
      Public sites reveal contract models but not commercial terms, so buyers and investors cannot tell whether Aragen
      wins on price, responsiveness, or scope.
    diligencePath: >-
      Request recent quotes, master service agreement templates, and won-lost deal samples for Aragen, Sai, Syngene, and
      Piramal.
    relatedQuestionRefs:
      - QP015
      - QP016
      - QP025
  - type: private-evidence-only
    severity: material
    topic: switching-cost-benchmarks
    missingEvidence: >-
      Program-stage transfer timelines, validation costs, and failure rates when sponsors switch CRDMO partners from
      discovery into GMP supply.
    whyItMatters: >-
      Switching-cost claims are directionally clear, but the exact moat value depends on how expensive and risky
      transfer is for Aragen’s specific program mix.
    diligencePath: >-
      Review technology-transfer case studies, batch-comparability packages, and sponsor references from programs moved
      on or off Aragen.
    relatedQuestionRefs:
      - QP017
      - QP024
      - QP025
  - type: access-blocked
    severity: minor
    topic: jubilant-official-surfaces
    missingEvidence: >-
      A fetchable official Jubilant Biosys or Jubilant Pharmova capability page and downloadable annual report for this
      run.
    whyItMatters: >-
      Official Jubilant pages returned access-rejection responses during this run, so the chapter relies on reputable
      independent reporting for scale-up and FY26 positioning facts.
    diligencePath: >-
      Ask management or IR for the latest capability deck, annual report PDF, and site list, then refetch those direct
      URLs in the next refresh.
    relatedQuestionRefs:
      - QP007
      - QP024
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by top programs and by top customers across Aragen and key peers.
    whyItMatters: >-
      Published customer counts overstate moat if wallet share is concentrated in a handful of volatile programs or
      one-time scale-up projects.
    diligencePath: >-
      Request top-10 customer concentration, cohort retention, and cross-sell expansion data from management and compare
      it with peer disclosures.
    relatedQuestionRefs:
      - QP004
      - QP024
      - QP025
  - type: private-evidence-only
    severity: material
    topic: sales-cycle-cac
    missingEvidence: >-
      Signed cohort-level funnel data covering RFP volume, win rate, average time from RFP to PO, onboarding lead time,
      and new-logo versus expansion mix.
    whyItMatters: >-
      Public commentary confirms slower decisions and more late-stage demand, but without cycle and conversion metrics
      it is impossible to underwrite sales efficiency or growth durability.
    diligencePath: >-
      Request the last eight quarters of qualified pipeline by stage, conversion rates, cycle-length distribution, and
      repeat-booking share by customer cohort.
    relatedQuestionRefs:
      - QI008
      - QI023
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Program-level realization data showing list versus realized pricing, discount ladders, FTE utilization,
      change-order economics, and milestone acceptance rates.
    whyItMatters: >-
      Public sources describe contract form but not the economics that translate commercial wins into gross profit and
      cash.
    diligencePath: >-
      Ask management for anonymized pricing waterfalls for at least one discovery FTE contract, one fee-based integrated
      program, and one commercial-manufacturing account.
    relatedQuestionRefs:
      - QI022
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: material
    topic: biologics-utilization
    missingEvidence: >-
      Current utilization, batch count, booked capacity, yield profile, and customer concentration for the Bangalore
      biologics platform by phase and scale.
    whyItMatters: >-
      Public sources confirm new commercial orders and phase-two expansion, but not whether biologics capacity is
      filling fast enough to justify the capex pace.
    diligencePath: >-
      Request monthly utilization, booked campaigns, tech-transfer conversion, and gross-margin bridge for Morgan Hill
      and Bangalore combined.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI003
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: segment-margin-backlog
    missingEvidence: >-
      Segment-level gross margin, EBITDA, order backlog, book-to-bill, and cancellation data across discovery,
      small-molecule D&M, and biologics.
    whyItMatters: >-
      The public surface provides top-line growth and some mix hints, but not which segment is earning the margin or how
      much future revenue is already visible.
    diligencePath: >-
      Ask for three-year segment P&Ls, bookings/backlog, and utilization by business line with bridge reconciliations to
