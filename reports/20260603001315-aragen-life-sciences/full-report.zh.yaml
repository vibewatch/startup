      - number: '8.3'
        title: 情景区间与回报测算
        blocks:
          - type: paragraph
            body: >-
              正确的估值输出应是一段区间，而不是单点。乐观情景下，如果 Bengaluru 产能利用率变得可见、服务模态扩张转化为商业量、IPO 路径收紧到足以把公司拉向 6.5-8.0x 收入框架，Aragen 有理由支撑约
              $1.5-1.8B。基准情景下，公司守住质量和增长，但仍因私营不透明被部分折价，对应约 $1.1-1.4B。悲观情景下，行业重估、关税噪音或场地爬坡放慢，会把业务推向 3.5-4.5x 收入和约
              $0.8-1.0B。这些区间重要，因为入场基准已经是
              $1.4B。在这个价格上，乐观情景中点只提供温和账面上行，基准情景中点大致保本，悲观情景中点则是真实本金亏损场景。正因为这种不对称，建议必须保持价格敏感，而不只是质量敏感。
