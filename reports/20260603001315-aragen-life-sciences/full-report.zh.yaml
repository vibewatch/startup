  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 最新公开信号
      - 来源时间
      - 影响
      - 尽调问题
    rows:
      - - 新增股权融资
        - FY2025 获得 INR 6,337.50 million；Quadria 以约 $1.4 billion 估值投资 $100 million
        - FY2025 年报和 2025 年 1 月新闻稿
        - 提升近期资金灵活性，支持降债和资本开支
        - 提供新增现金到账准确日期、资金用途桥接表和投后股权结构表
      - - 经营流动性
        - CRISIL 引用截至 2024 年 3 月的 ₹300-400 crore 现金盈余和 ₹200 crore 流动性盈余
        - 2024 年 8 月评级理由
        - 支撑当前债务服务，但对 FY2026 承销已显陈旧
        - 提供 FY2025 及当前非受限现金、未提款额度和财务约束条款余量
      - - 年度资本开支负担
        - CRISIL 引用年度资本开支约 ₹400 crore；官方报告确认 Bangalore 和制造扩建仍在推进
        - 2024 年 8 月 + FY2025 报告
        - 相对 EBITDA，资本开支仍然不小
        - 按项目提供剩余资本开支，并拆分已承诺与可选部分
      - - 债务结构
        - CRISIL 列出 ₹675.98 crore 评级银行授信、₹200 crore NCD、拟议 ₹200 crore 定期贷款和 ₹50 crore CP
        - 2024 年 8 月评级理由
        - 仍有融资灵活性，但对融资的依赖真实存在
        - 提供当前债务到期阶梯、提款余额和再融资计划
      - - 有担保营运资本
        - 营运资本贷款和打包贷款以流动资产作担保，利率区间为 3.30%-7.63%
        - FY2025 年报
        - 应收和存货是融资模型的核心组成
        - 提供借款基数公式、抵押品余量和季节性提款曲线
      - - 抵押登记与权利负担
        - The Company Check 列示 ₹583.80 crore 未结清抵押和 ₹768.38 crore 已清偿抵押
        - 2025 年末公司画像数据集
        - 担保文件显示，即使最近注入股权后，贷方覆盖仍然不小
        - 将 ROC 抵押登记与当前提款及近期解除担保逐项调节
    notes: 资本充足性看起来可接受，但并未过度充裕；若干单元格混合了官方信息、类似备案的资料和外部信用信息，因为公司未发布完整资金管理资料包。
