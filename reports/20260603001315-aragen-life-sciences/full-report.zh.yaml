            body: >-
              Aragen 的股权故事已从发起人加 PE 支持，转向更显性的机构化结构。May 2021，Goldman Sachs 从 ChrysCapital
              和其他现有股东手中买入重要少数股权，这是当前阶段第一个清晰可见的全球战略资本背书 [CO008]。January 2025，Quadria Capital 又以约 $1.4 billion 估值投资 $100
              million，资金大部分为新股，另有较小老股成分，并明确作为第二家战略投资人加入 Goldman [CO009][CO010]。当前董事会结构反映了这组投资人组合，因为 Rajat Sood 和 Amit
              Varma 现在都出现在公开董事会页面 [CO031][CO040]。主要限制在于，Aragen 未公开完整股权结构表、累计新股融资总额，或近几轮老股流动性部分的准确规模；因此，应把公司视作已具机构化规模、具备
              IPO 可选性，而不是已经透明到可直接 IPO [CO036][CO037][CO040]。
