  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 为何重要
      - 当前最佳公开代理指标
      - 承销影响
      - 精确尽调路径
    rows:
      - - 按合同类型拆分的实际价格
        - 需要用它把 FTE / 收费 / 项目结构转成毛利
        - 官方资料只披露合同形式，不披露实际价格
        - 无法承销价格纪律或折扣风险
        - 获取一个发现账户、一个开发账户和一个商业账户的匿名定价瀑布
      - - 销售周期、CAC 与回本周期
        - 核心 GTM 效率指标
        - 唯一代理指标是管理层提到 FY2025 客户决策仍然偏慢
        - 无法对标增长效率
        - 索取过去八个季度的漏斗、赢单率和回本数据
      - - 分部毛利率与积压订单
        - 把高质量利润与收入结构噪音拆开
        - 公开资料提供收入和部分结构线索，但没有分部 P&L 或积压订单
        - 利润率扩张逻辑尚未验证
        - 索取三年分部 P&L，以及新增订单、积压订单和订单出货比
      - - 生物药利用率与生产批次经济性
        - 决定 Bangalore 资本开支能否转化为现金回报
        - 公开资料只确认 >50% 增长和首批商业订单
        - 生物药上行仍主要停留在叙事层面
        - 按季度索取基地级利用率、毛利率和已预订产能
      - - 当前非受限现金与财务约束条款余量
        - 判断现金跑道和再融资风险需要该指标
        - CRISIL 流动性快照来自 2024 年 3 月；后续披露未公布现金余额
        - 资本充足性视角偏支撑，但已经陈旧
        - 索取截至当前日期的月度现金桥接表、未提款额度和财务约束条款计算
      - - 二期剩余资本开支与时间安排
        - 对债务需求和 FCF 时间点有实质影响
        - 公司只披露一个近 $40 million 项目和 FY26 投产目标
        - 难以测算增量融资需求
        - 按批次索取剩余项目预算、合同状态和投产里程碑
    notes: 每个缺口都对应一个具体承销盲点；null 或 unknown 表示指标未公开，不代表不重要。
    claimRefs:
      - CI001
      - CI020
