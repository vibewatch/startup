        blocks:
          - type: paragraph
            body: >-
              公开 GTM 披露很薄，所以本章必须依赖代理指标，而不是标准 SaaS 式销售指标。最强的正面代理指标是客户粘性：CRISIL 称 Aragen 留住 75-80% 的客户，年报则称集中度可控、前 20
              大药企收入扩张。第二个正面代理指标是交叉销售。公司称 FY2024-25 执行的开发和制造项目增长 30%，前三个商业化 Bangalore 生物制剂订单来自 California 团队，说明 Aragen
              能把发现和工艺开发关系转化为更高价值的下游工作。主要弱点在于，管理层同时承认客户决策仍慢，2026 年需求仍偏向资金更充足的 Phase I/II 项目。也就是说，销售漏斗大概率较 2023-24
              改善，但公开证据仍看不到周期、转化率或 CAC。投资判断应把留存和交叉销售视为真实强项，但不能拿它们替代漏斗数据。
