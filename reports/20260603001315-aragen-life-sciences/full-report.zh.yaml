      - number: '7.2'
        title: 运营、质量与模态执行风险
        blocks:
          - type: paragraph
            body: >-
              运营风险现在集中在 Bangalore 生物制剂爬坡，以及 Aragen 在不丢失质量纪律的前提下把新模态工业化的能力。公开来源一致认为，该站点直到 late July 2025 首批 GMP
              批次前不久才完成确认；这意味着商业化生物制剂制造是近期能力，还不是经过长周期证明的能力。设施设计纸面上有吸引力——多台 2KL
              一次性生物反应器接入共用下游套件、声明滴度高，并可并行运行多个客户——但如果客户组合或批次表现不及预期，同样的特征也会制造排产、放行和技术转移复杂度。爬坡还实质依赖跨站点协调：管理层称前三个商业化
              Bangalore 订单来自 California 团队，因此 California 到印度的交接不是边缘案例，而是核心运营模型。只要质量体系保持紧、客户项目继续推进，这可以管理；但如果 Bangalore
              利用率波动大、技术转移滑坡，或第一个可见合规问题在 Aragen 仍证明这块新制造能力时落地，风险就会上升。
