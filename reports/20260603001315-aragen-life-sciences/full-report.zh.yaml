            body: >-
              近期资本充足性看起来可接受，但还看不出明显资本过剩。最强的公开支撑是 January 2025 Quadria 轮：官方来源称，公司以约 $1.4 billion 估值获得 $100 million
              融资，主要是新资金；年报则把这笔资金直接用于降债和持续资本开支。CRISIL 的 August 2024 理由也偏正面：它称流动性强，内部现金生成 为 ₹300-400 crore，年度债务义务为 ₹80-100
              crore，截至 March 2024 的流动盈余为 ₹200 crore。需要注意的是，CRISIL 也把约 ₹400 crore
              年度资本开支描述为部分由债务支持，并列出一组不小的评级融资工具：银行额度、NCD、拟议定期债务和商业票据。资产负债表附注进一步显示，营运资本贷款以流动资产作抵押，并受杠杆和覆盖率契约约束。含义很清楚：Aragen
              没有显露困境，但也不是只靠已披露自由现金流来支持增长。
