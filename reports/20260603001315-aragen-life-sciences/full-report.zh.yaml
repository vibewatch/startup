      - number: '7.5'
        title: 缓释措施、监控与否决标准
        blocks:
          - type: paragraph
            body: >-
              Aragen 确实有实质缓释面：公开可见的质量治理、第三方和监管审计痕迹、比许多私营同行更宽的客户基础、新增股本，以及横跨两大洲的生物制剂模式，都降低了单一坏事件直接击穿故事的概率。但剩余风险还在。现在最有价值的
              尽调不是再做泛泛的市场规模测算，而是拿到公开来源给不了的证据。管理层应能提供 2026 年 Form 483 及关闭文件，解释 California 到 Bangalore
              的技术转移在收率和放行上表现如何，量化前 5 / 前 10 大客户集中度和合同期限，并证明生物制剂产能利用率和利润率是否扩张得足够快，足以支撑资本开支
              计划。在这些可监控阈值厘清前，否决标准应保持严格。任何未解决的 FDA 观察项、Bangalore
              爬坡停滞、客户组合重新偏向试点、西方大型药企订单流走弱，或杠杆上升但吞吐量没有同步提升，都应把建议推向谨慎。本章最终给出的风险姿态是：风险可管理但实质存在。Aragen
              有足够证据保持可投，但披露不足以把执行风险视为已解决。
