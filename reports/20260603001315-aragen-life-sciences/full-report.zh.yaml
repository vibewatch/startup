  - id: TI001
    title: 收入来源表
    columns:
      - 收入流
      - 收入机制
      - 公开规模或结构信号
      - 收入质量判断
      - 尽调问题
    rows:
      - - 药物发现服务
        - 围绕化学、生物和安全性工作的 FTE 与收费制合同
        - CRISIL 称，包含生物药在内的发现业务约占 FY2024 收入的 65%
        - 持续客户关系和年度续约支撑收入质量，但实际价格不透明
        - 按 FTE、收费制和一体化项目占比拆分发现业务收入
      - - 小分子开发与制造
        - 原料药、制剂、分析、定制合成和商业 API 项目
        - FY2025 执行项目数增长 30%；CCS 新增客户和项目
        - 更高价值的下游工作在放量，但细分线毛利率未公开
        - 提供按原料药、制剂和商业供应拆分的分部收入与毛利率
      - - 生物药开发与制造
        - 工艺开发、分析、GMP 制造，以及从 California 到 Bangalore 的转移
        - 管理层称 FY2025 生物药收入增长 >50%，CRISIL 估算生物药约占 FY2024 收入的 10%
        - 增长最快的板块，但当前利用率和订单深度未公开
        - 按基地披露生物药收入桥、利用率和生产批次数量
      - - 商业 API 与高级中间体
        - 由 DMF 和 CMC 能力支撑的长期制造与供应
        - 商业制造页面强调排他性长期 API 与中间体供应
        - 可能比项目制研究更黏、更可扩张，但客户集中度未披露
        - 展示商业供应账户的头部项目、合同期限和续约率
      - - 其他收入与激励
        - PLI 申领、退税，以及与融资相关的利息收益
        - 年报明确将这些列为 FY2025 其他收入来源
        - 有帮助，但不是正常化经营经济性的核心
        - 量化已披露其他收入和激励中的一次性与经常性占比
    notes: 各行列出公开资料可见的主要变现路径；缺少分部利润率数据意味着结构质量只能方向性判断，不能完全正常化。
