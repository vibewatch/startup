      - number: '8.4'
        title: 估值支撑与压力
        blocks:
          - type: paragraph
            body: >-
              若干事实支撑这个基准。Aragen 不是概念股：它披露了收入、正 EBITDA、广泛客户触达、加速增长的生物制剂业务，以及多元化外包带来的可信宏观顺风。券商和战略研究仍认为，印度 CRDMO 在成本、监管足迹和
              China+1 需求上具备结构优势；公开市场投资人也继续给位置最好的公司支付真实溢价。但反向压力同样重要。2025 年底的公开评论已经警示，关税、回流和选择性倍数疲劳可能重塑外包流向，2026
              年或许成为重估年。Jefferies 的公开评论也显示，上市投资人仍会惩罚执行疲软和近端催化不足。Aragen FY2024-25 实际利润率低于 CRISIL
              早前预期，公司也仍未披露产能利用率、股权结构表或季度经营细节；这些才足以证明，它可以按最干净上市同业的水平获得私募市场平价。因此，公开证据能支撑这个基准，但还不足以让投资判断变得舒服。
