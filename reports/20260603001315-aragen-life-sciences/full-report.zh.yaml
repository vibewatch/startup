  - id: TV005
    title: 论点失效和否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - Bengaluru 利用率不达预期
        - 到 2026 年，商业利用率或已签订单仍不透明，或明显偏弱。
        - 生物制剂 capex 没有转化为产能吞吐，牛市情景就失去高倍数支撑。
        - 将估值参照下调到基准至熊市区间，并提高下行保护要求。
      - - 利润率没有跟上增长
        - 收入增长，但 EBITDA 利润率仍无法达到行业式 26-28% 区间。
        - 规模不再支撑 Syngene / Lonza 式倍数。
        - 视基准估值为偏紧，并按更低倍数重新承销。
      - - 监管执行恶化
        - 新基地爬坡期间出现任何重大且未解决的检查发现或质量问题。
        - 公开同业平价被打破，因为投资人会迅速惩罚执行滑坡。
        - 在修复证据可见前，切换到熊市区间。
      - - IPO 路径延后或条款变差
        - 公开上市路径仍含糊，或优先股结构和老股出售组合被证明对新投资人不友好。
        - 高溢价私募估值的流动性支撑显著变弱。
        - 要求更低入场价或更强优先条款。
      - - 关税 / 行业重估冲击需求
        - 美国关税、回流生产或 Biosecure 驱动的供应链转移，降低 RFP 转化或延后客户决策。
        - 行业顺风消退，压缩支撑 Aragen 的公开可比背景。
        - 在需求信号恢复前，使用情景区间的下半段。
    notes: 这些是与公开估值传导绑定的投资人否决标准，不是管理层经营目标。每一项都应在投钱前用私下尽调验证。
    claimRefs:
      - CV032
      - CV033
      - CV034
