      - number: '2.2'
        title: 规模口径与矛盾
        blocks:
          - type: paragraph
            body: >-
              公开市场规模口径方向上偏乐观，但数字彼此不一致。按最宽口径，BlueWeave 将印度 CRDMO 市场估为 2024 年 $22.61 billion、2031 年 $53.53 billion
              [CM004]。按窄得多的口径，BCG 和 IPSO 称该行业当前只有 $3-3.5 billion，但到 2035 年可达 $22-25 billion [CM005]。JM Financial 和 IBEF
              位于两端之间，都指向 2028 年约 $14 billion [CM006][CM007]。最有用的解读不是盲选一个数字，而是承认这些估算描述的是不同市场边界和服务组合 [CM008]。全球口径也有同样问题：JM
              引用 CRDMO 从 $197 billion 到 $302 billion 的轨迹，PharmaSource 称 2025 年 $220 billion、2026 年 $236 billion，Mordor
              还更高 [CM009][CM010][CM011]。后续估值更应把这些数字视作一组观察口径，而不是单一标准 TAM。
