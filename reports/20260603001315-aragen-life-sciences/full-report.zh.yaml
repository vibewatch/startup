  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已验证能力面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              作为私营 CRDMO，Aragen
              的公开产品能力面很宽。公司呈现的是一条连续能力带，横跨小分子发现、小分子开发与制造、制剂、肽发现、寡核苷酸化学和生物制剂，而不是一组彼此隔离的宣传册。发现侧，基础工作流把集成药物发现、化学、生物学和生物安全合在一起；化学页面则延伸到寡核苷酸、肽、PROTAC
              相邻化学、大环和其他专门工作 [CE001][CE002][CE003][CE004][CE005]。肽能力面披露得少见地具体：PeptARx 把化学、筛选和 DMPK
              放在同一体系内，定制合成和偶联页面显示公司支持 PNAs、肽-寡核苷酸构建物、PPMOs、DOTA 标记分子和其他复杂设计 [CE015][CE018][CE020]。主要警惕是成熟度不对称。公开证据在发现和非
              GMP 肽工作上最强，小分子 CMC 证据扎实，生物制剂 GMP 正在改善；但 GMP 寡核苷酸制造仍缺少专门公开证明，所以这些单元应被视作部分验证，而不是已经完全去风险化的当前能力
              [CE021][CE029][CE041]。
