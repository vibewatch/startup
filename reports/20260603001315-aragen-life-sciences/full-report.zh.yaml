    approximationNotes: 数值是结构性指数，不是已披露账户数；形状来自 pilot 到后续工作的评论、反复生物制剂转移，以及少量具名战略合作。
    claimRefs:
      - CU025
      - CU026
      - CU028
      - CU029
      - CU035
      - CU042
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: Aragen 能展示具名交易对手和阶段推进时，客户证据最强；只停留在推荐语时，证据最弱。
    data:
      columns:
        - 大型药企 / 企业客户
        - 新兴生物科技
        - 生物制剂转移群体
        - 非药企 / 公共卫生买方
      rows:
        - label: 具名交易对手
          values:
            - 高
            - 中
            - 高
            - 高
        - label: 独立佐证
          values:
            - 高
            - 中
            - 高
            - 中
        - label: 部署深度可见度
          values:
            - 中
            - 低
            - 高
            - 低到中
        - label: 重复业务可见度
          values:
            - 中
            - 低到中
            - 高
            - 低
    approximationNotes: 定性评级衡量公开证据质量，不代表内部账户价值；仅有推荐语的客群得分较低，因为外部更难验证部署阶段。
    claimRefs:
