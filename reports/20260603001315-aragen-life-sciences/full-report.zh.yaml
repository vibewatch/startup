  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 公开收入锚点
      - 公开倍数 / 隐含倍数
      - 为什么重要
      - 对 Aragen 的局限
    rows:
      - - Aragen 按 Jan-2025 基准隐含估值
        - FY2024-25 收入 ₹1,845.11 crore
        - ~6.3x 隐含销售额
        - 本章当前估值锚；更接近上市 CRDMO 龙头，而不是困境资产。
        - 私营公司披露更薄，也没有日度市场流动性。
      - - Syngene
        - FY2026 收入 ₹37.39 billion
        - 4.69x P/S（市销率）
        - 最接近的印度上市一体化发现到生产类比公司，并具备生物制剂 CDMO 广度。
        - 已上市、透明度更高，且已在公开市场经受检验。
      - - Piramal Pharma
        - FY2026 收入 ₹88.69 billion
        - 2.50x P/S（市销率）
        - 可作为印度多元化医药平台的下限参照，该平台带有 CDMO 敞口。
        - 不是纯 CRDMO；医院仿制药等业务削弱可比性。
      - - Lonza
        - 2025 收入 $8.24 billion
        - ~5.3x 市值 / 收入
        - 全球 CDMO 基准，显示有规模、高质量的外包生产可以获得什么交易水平。
        - 规模、业务多元化和流动性都远高于 Aragen。
      - - WuXi AppTec
        - 2026 TTM 收入 $6.49 billion
        - ~7.5x 市值 / 收入
        - 一体化全球 CRDMO 参照，具备真实规模和跨洲交付能力。
        - 受地缘政治和 Biosecure 敞口影响；规模和广度超过 Aragen。
      - - Laurus Labs
        - FY2026 收入 ₹68.13 billion
        - 10.96x P/S（市销率）
        - 显示印度投资人仍愿意为被视为 CRDMO 相邻的增长付高价。
        - 业务模式混合且执行波动较大，使这个基准噪音更高。
      - - Divi's Laboratories
        - FY2026 收入 ₹105.60 billion
        - 16.42x P/S（市销率）
        - 印度医药制造的同业顶级溢价，说明执行可信时公开市场的上行空间。
        - 溢价反映质量和业务组合，Aragen 目前无法直接获得。
    notes: 顺序从目标公司到最接近 / 最有决策价值的公开参照。倍数是公开市场快照，不是完全可比的公允价值。
    enumerationScope:
      coverage: partial
      basis: >-
        Selective public comp set anchored on Indian CRDMO-adjacent names plus two global leaders; includes the target
        benchmark row because Aragen is private and must be compared against multiple public analogues rather than a
        single perfect peer.
    claimRefs:
