  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 按公开可支撑的发生概率和影响，对 Aragen 剩余风险排序。
    data:
      columns:
        - 重大影响
        - 高影响
        - 中等影响
      rows:
        - label: 高概率
          values:
            - tone: negative
              label: 扩张期质量 / 合规松懈
            - tone: negative
              label: 发现需求偏软、客户组合偏 pilot
            - tone: neutral
              label: 治理细节仍不公开
        - label: 中等概率
          values:
            - tone: negative
              label: Bangalore 生物制剂爬坡利用不足
            - tone: negative
              label: 地缘政治 / 关税逆转 China-plus-one 顺风
            - tone: neutral
              label: 常规法律或税务事项
        - label: 低概率
          values:
            - tone: negative
              label: 与 2026 观察项相关的系统性执法事件
            - tone: negative
              label: 吞吐量到来前，capex 和杠杆先反噬
            - tone: neutral
              label: 重大尽调中，GVK 历史遗留问题重新浮现
    claimRefs:
      - CR001
      - CR007
      - CR017
      - CR018
      - CR021
      - CR022
      - CR036
      - CR037
      - CR047
      - CR048
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 质量、爬坡和需求风险如何传导到吞吐量、利润率和投资下行。
    data:
      nodes:
        - id: n1
          label: 2026 检查观察项
          description: 最近监管审查，细节未公开
        - id: n2
          label: Bangalore 爬坡复杂度
          description: 年轻 GMP 场地、共享下游套间、近期刚启动
        - id: n3
          label: Pilot 偏重的客户转化
          description: 新客户仍在从测试项目走向规模化工作
        - id: n4
          label: 技术转移依赖
          description: California 起源项目向 India GMP 产能供给
        - id: n5
