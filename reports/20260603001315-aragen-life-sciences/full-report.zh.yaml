      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              CRDMO 买方行为随阶段变化。早期外包常由缺少规模或想保留资本的生物科技创始人、项目负责人和 R&D 团队推动；后期外包更可能由 CMC、技术运营、采购和供应链负责人掌握，他们关注速度、可靠性和商业化就绪度
              [CM017][CM033]。预算所有者的变化，是一体化供应商在项目接近临床和商业规模时获得更高回报的原因之一 [CM025][CM033]。同行披露也印证了这个宽买方图谱：Syngene
              明确瞄准从早期发现到商业供应的全球药企、生物科技、动物健康和特种化学客户；WuXi 和 Lonza 也描述了类似的一体化、跨境运营模型 [CM018][CM019][CM020]。这对 Aragen
              很关键，因为它的甜蜜点在市场的一体化部分：申办方希望减少交接，并在分子生命周期里使用同一套质量体系 [CM034]。换句话说，Aragen
              的市场之所以大，不只是因为外包在增长；还因为相当一部分买方越来越想要一体化伙伴，而不是一串彼此断开的专业服务商 [CM017][CM033][CM034]。
