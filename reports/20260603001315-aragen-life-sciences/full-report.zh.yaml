companyProfile:
  summary: >-
    Aragen Life Sciences 是一家总部位于 Hyderabad 的私营 CRDMO，法律实体可追溯至 December 2000，运营起点则是 2001 年的 GVK
    BIO。公司从药物发现信息学起步，扩展为覆盖发现、开发和商业化生产的一体化平台，横跨小分子和生物制剂；印度核心园区之外，还在 California 的 Morgan Hill 布局生物制剂基地。公开材料称，公司服务 400+
    家客户，与前 20 大大型药企中的 15 家有合作，员工 4,500+ 人，FY2024-25 收入为 ₹1,845.11 crore。Goldman Sachs 于 2021 年买入重要少数股权，Quadria Capital 于
    January 2025 以约 $1.4 billion 估值投资 $100 million。
