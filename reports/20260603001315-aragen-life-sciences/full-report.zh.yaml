      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              印度的正面市场叙事由几项耐久驱动支撑：成本优势、China+1 供应链多元化、先进模态需求上升、庞大的仿制药和出口基础，以及支持性政策框架
              [CM014][CM015][CM021][CM028][CM029][CM031]。出口和制药基础数据很重要，因为它们解释了印度为什么具备科学劳动力池和面向监管的可信度，从而赢得更多外包工作
              [CM029][CM030]。但约束因素已不再是无关紧要的脚注。BCG 和 YCP 都强调人才短缺、监管复杂性和投入依赖，KPMG 则补充了定价压力和进口依赖 [CM022][CM023][CM032]。2026
              年的悲观看法更进一步，认为如果关税、回流和决策周期放慢压低近期订单流，印度可能迎来调整年
              [CM026]。实际结论是：行业仍有强增长概率，但下一批赢家更可能是专业化、数字化支撑、合规能力强的平台，而不是泛规模型玩家 [CM024][CM025][CM027][CM035][CM036]。
