      - CV053
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - Bengaluru / 模态利用率
        - 按基地和模态拆分的当前利用率、已签订单、放行指标和批次节奏。
        - 验证生物制剂和 ADC capex 是否真的足以支撑估值高于基准区间。
        - 管理层 + 基地尽调；要求月度运营看板和项目桥接。
      - - 资本结构和杠杆
        - Quadria 之后的净债务、契约余量和 capex 资金组合。
        - 决定股权价值应按公开龙头做基准，还是打上私募折价。
        - 财务尽调；取得最新账目、债务明细和契约证明。
      - - 客户持久性
        - 前 10 大客户集中度、合同期限、在手订单，以及收入从发现端转向生产端的路径。
        - 验证客户广度是持久质量，而不只是宽但浅的客户名录。
        - 商业尽调；要求队列分析和续约时间表。
      - - IPO / 退出路径
        - DRHP 状态、计划发行规模、一二级比例和估值预期。
        - 影响流动性支撑、稀释，以及有多少基准估值能在公开市场兑现。
        - 法务 + 投行尽调；取得申报草稿和股东协议。
      - - 条款和优先权
        - 清算瀑布、投资人权利，以及新老股东之间的任何不对称。
        - 将头部估值转化为新投资人的真实承销经济性。
        - 法务尽调；审阅 SHA、附函和董事会权利包。
    notes: 每一行都对应真实决策阻断点，不是泛泛尽调。缺失答案不妨碍本章发布，但应阻止激进定价。
    claimRefs:
      - CV045
      - CV050
      - CV051
      - CV052
