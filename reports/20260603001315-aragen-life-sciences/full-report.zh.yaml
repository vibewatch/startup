  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 能力 / 资产
      - 主要买方 / 用户
      - 公开成熟度 / 阶段
      - 公开差异化
      - 主要尽调缺口
    rows:
      - - 一体化药物发现
        - 生物科技和制药公司的药物发现负责人
        - 成熟
        - 化学、生物学、生物安全和数字化工作流纳入同一体系
        - 未公开定价或 SLA 披露
      - - 发现化学 + 寡核苷酸
        - 药物化学和转化化学团队
        - 发现阶段已成熟
        - 化学菜单宽，并列明 ASO、siRNA、miRNA 和适配体等寡核苷酸应用
        - 没有专门的公开 GMP 寡核苷酸页面
      - - PeptARx 多肽平台
        - 多肽疗法创新者
        - 发现 / 非 GMP 规模已成熟
        - 整合化学、筛选、DMPK、偶联物和 PNA 相关工作
        - 商业化或 GMP 多肽制造证据未公开
      - - 小分子开发与商业 API
        - CMC 和供应链负责人
