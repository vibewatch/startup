        - 调节调整后 EBITDA 与报告 EBITDA，并拆出分部贡献
      - - 流动比率（单体）
        - 由 10,195.77 / 6,263.67 推算为 1.63x
        - 中
        - 说明营运资本覆盖够用，但没有闲置冗余
        - 提供月度流动比率桥接表和财务约束条款定义
      - - 人均收入代理指标
        - 用 ₹1,845.11 crore / 4,500+ 推算，约为每名员工 ₹0.41 crore
        - 低
        - 对科学家占比较高的 CRDMO，是有用的粗略生产率代理指标
        - 披露可计费利用率、科研人员结构和每名可计费 FTE 收入
      - - 员工成本强度
        - 约为单体总收入的 26%
