  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与印度直接同行
        blocks:
          - type: paragraph
            body: >-
              Aragen 最接近的直接竞争，不是每一家能生产 API 的公司，而是更窄的一组印度 CRDMO：它们能把小分子项目从发现或早期开发推进到受监管制造，中间不需要反复交接。Aragen
              的公开表述以集成发现、下游开发、制造，以及明确的质量和 IP 控制为核心，这就是买方会拿来对标的基线 [CP001][CP002][CP004][CP005]。Syngene 在公开披露规模和模态广度上高于
              Aragen；Sai 和 Jubilant 更像是在按服务收费与放大流程中快速执行的挑战者 [CP006][CP008][CP010][CP013][CP022][CP023]。Piramal
              更宽、更全球化，但它也是一类不同的网络化 CDMO，而不是纯印度成本挑战者 [CP014][CP016]。Divi’s 和 Laurus
              主要在申办方更看重制造和定制合成深度、而不是发现牵引的一体化时，才进入同一购买讨论 [CP017][CP019][CP020]。因此，有用的竞争格局是分层的：多数小分子项目中，Aragen
              对阵印度本土一体化同行；后期供应中，对阵制造牵引型印度替代方案；最大或模态最多元的委托中，对阵全球既有巨头 [CP047][CP048][CP049][CP050]。
