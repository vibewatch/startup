chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与演进
        blocks:
          - type: paragraph
            body: >-
              Aragen 作为一家印度私营 CRDMO，身份资料披露得少见地充分：公司既发布详细历史时间线，也发布近期年报。法律实体于 07 December 2000 在 Hyderabad 注册，但公司强调的运营故事始于
              02 April 2001，当时 G V Sanjay Reddy 在 Hyderabad 创立信息学公司 GVK BIO
              [CO001][CO002]。随后，业务借助收购和新增基地，从信息学扩展到化学、生物学、制造，再进入生物制剂 [CO004][CO005][CO006]。关键品牌切换发生在 May 2021：GVK BIO
              更名为 Aragen，意在向全球生物医药客户传达更宽的端到端外包定位，而不是较窄的传统 CRO 身份 [CO007]。这次更名很重要，因为后续章节都把 Aragen
              作为标准实体名称；但许多较早的第三方来源、贷款方和投资人仍使用 GVK Biosciences [CO001][CO007]。
