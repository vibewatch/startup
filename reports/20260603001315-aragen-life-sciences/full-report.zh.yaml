      - number: '1.4'
        title: 布局、能力与规模
        blocks:
          - type: paragraph
            body: >-
              官方材料把 Aragen 定位为宽口径一体化外包平台，而不是单一服务 CRO 或 CDMO。公司自称是从概念到商业化的 CRDMO，覆盖小分子、生物制剂、肽以及面向药企、生物科技、农化和动物健康客户的配套项目
              [CO023]。实体布局支撑了这一说法：Hyderabad 仍是全球总部，Morgan Hill 支撑 US 生物制剂工作，全球地点页面列出
              Hyderabad、Mallapur、Visakhapatnam、Bengaluru、Pune、Cambridge 和 Morgan Hill 的园区或办公室；年报则把它简化为 6 个核心运营园区、1.6
              million square feet 基础设施 [CO019][CO024][CO025][CO026][CO027]。按私营公司标准，规模披露也很强：Aragen 称其拥有 4,500+ 名员工、450+ 名
              PhD、290+ 个活跃临床项目、经其细胞株提交的 100+ 个 IND，以及 400+ 家客户 [CO014][CO015][CO016][CO017][CO020]。质量和监管标志——ISO 体系、USFDA
              相关设施、EDQM、PMDA、WHO、CDSCO 和 AAALAC 覆盖——解释了为什么大型药企愿意把复杂项目外包给一家总部位于印度的平台 [CO028][CO029]。
