        title: 技术差异化、路线图与剩余产品技术风险
        blocks:
          - type: paragraph
            body: >-
              差异化案例靠的是一体化，而不是单一自有产品。Aragen 把印度规模的化学人才、少见明确的肽发现能力面、印度与 US 生物制剂网络，以及触及发现、制造和安全的数字工具组合在一起
              [CE006][CE015][CE020][CE029][CE039]。买方如果想从命中化合物生成一路到 CMC 和早期 GMP 都只找一个伙伴，这组组合就有意义
              [CE001][CE023][CE029]。不过，公开记录也提示了边界。一篇 2024 访谈暗示 Bangalore 生物制剂制造会早于后来官方 July 2025 GMP 启动到来，因此执行时点并非毫无摩擦
              [CE042]。同样，Quadria 支持的路线图要加深寡核苷酸、肽、ADCs 和 AI 或 ML，方向可信，但仍处于扩张阶段，不是证据充分的已装机能力 [CE043]。最后，最清晰的公开一线实践信号是 AI
              产品、化学信息学、数据管道和 DevOps 岗位招聘，而不是独立客户背书；所以部分数字化边缘仍依赖内部建设，而不是外部证明 [CE044]。未知项应直接点出，而不是假装不存在：公开证据仍没有展示专门的 GMP
              寡核苷酸细节，也没有展示 Bangalore 生物制剂投产后的常规外部验证 [CE041][CE042][CE043]。
