      - number: '5.2'
        title: 数字化与运营架构
        blocks:
          - type: paragraph
            body: >-
              Aragen 的支撑架构更像一组面向特定工作流的系统栈，连接发现、制造和合规，而不是单一软件平台。在发现环节，InCoRe 被定位为 DMTA 周期管理、客户数据共享和化学-生物学协作的连接层；计算团队则引用
              Schrodinger、Cresset、SARvision、DataWarrior、同源建模、隐性口袋分析和分子动力学模拟来指导设计 [CE007][CE008][CE010]。执行环节，Aragen
              称机器人化合物处理和测定自动化把人工数据处理减少 20% to 40%，并用 Smartsheet 做组合可视化和 OTIF 风险监测 [CE009][CE011][CE012]。工厂侧，Golden Batch
              Analytics 是最清晰的量化 AI 主张：Aragen 称批次历史模型能识别 CPPs，并将重复批次收率提高 3% to 5%
              [CE013][CE027]。限制在外部验证。这些运营主张很具体，但公开客户案例、基准数据或具名部署仍稀少，所以数字层看起来方向上有差异化，却仍主要来自公司自述 [CE014][CE043][CE044]。
