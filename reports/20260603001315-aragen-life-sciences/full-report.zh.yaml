      - number: '3.3'
        title: 定价、信任与切换成本
        blocks:
          - type: paragraph
            body: >-
              定价是市场最不透明的一环。对 Aragen、Syngene、Sai、Piramal、WuXi、Catalent、Patheon 或 Recipharm
              的主要官方页面复核后，没有一家发布买方可逐行比较的简单公开价目表；采购仍靠报价和谈判 [CP037]。公开证据更多指向合同风格。Sai 谈质量、定价、响应速度和端到端工作；Jubilant
              明确强调按服务收费需求，以及向 GMP 设施的无缝转移；Piramal 和 Catalent 强调一体化项目和临床供应执行；Patheon 强调灵活商业模式和协调的生命周期支持
              [CP012][CP015][CP022][CP030][CP031][CP038]。公开价格不透明，反而抬高了信任的重要性。行业来源称，申办方现在因为速度和可扩展性更偏好一体化伙伴，真正决策标准是熟悉度、质量体系、监管表现和交付可靠性，而不是公示费率
              [CP035][CP036]。同一组动态也制造了切换成本：内部建设能保留控制权，但当复杂度、全球监管负担或人手短缺压垮内部团队时，外部伙伴就会胜出 [CP034][CP039][CP040]。
