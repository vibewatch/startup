      - number: '8.5'
        title: 明确立场、尽调要求与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              明确立场是，2025 年 1 月基准只有作为公允区间上沿才仍然站得住；如果没有更好的 2026 年证明或更友好的投资条款，新资金按此进入显得偏贵。这并不意味着 Aragen
              这门生意缺乏吸引力，而是公开记录尚未显示 $1.4B 到乐观情景之间有足够增量上行，能补偿下行区间和私有信息缺口。因此，合适建议是跟踪或继续研究，置信度中等、尽调
              强度高。想按接近基准价格进入的投资人，应要求公司提供当前场地级产能利用率、头部客户合同期限、更新后的杠杆和债务契约数据，以及 IPO
              材料草稿，再把它当作上市可比公司定价。若数据干净，判断可以上调；若拿不到，或关税和执行压力扩大，基准应向悲观区间下修，而不是像它仍然显然有效一样顺延。
