  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              Aragen 的法律与合规面最值得关注之处，不是记录干净，而是公开记录本身有正反两面。公司可以指向当前质量体系叙事、一份 WHO 公开检查报告（被检查 API 站点 GMP 合规可接受），以及最近一次 USFDA
              审计无观察项关闭的公开说法。但同一公开记录仍迫使谨慎。EMA 对 GVK Biosciences 的转介仍是真实遗留伤疤：欧洲主管机构在发现用于仿制药研究的 Hyderabad 站点存在系统性 ECG
              数据操纵后，维持暂停建议。更近的情况是，一条 2026 Form 483 元数据列表显示存在新的检查观察项，尽管观察文本和整改情况并未公开。法律敞口也不为零。PACERMonitor 显示，California
              有一宗涉及 Aragen 实体的仲裁相关联邦案件，在驳回前经历了临时限制令程序；印度税务法庭裁定也确认，公开法律历史仍在日常经营中存在。因此，正确投资判断姿态不是“假设失败”，而是“在管理层拿出
              483、整改轨迹和更完整诉讼背景之前，假设尽调必不可少。”
