  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Aragen 的相关市场不是整个印度制药经济，而是位于申办方 R&D 与商业化上市之间的外包创新者服务层。行业来源一致把 CRDMO 定义为发现、开发和制造的一体化提供方，而不是简单产能供应商
              [CM001][CM002]。这意味着，纳入的支出是申办方资助的外部工作，覆盖发现、临床前和临床开发支持、CMC、分析服务及商业化生产 [CM002]。排除的支出同样重要：药企内部
              R&D、终端药品销售、医院预算和仿制药分销，都属于更广泛制药生态，但并不是 Aragen 这类公司可直接触达的外包收入 [CM003]。这个边界也讲清了现状替代方案。主要替代者不只是另一家
              CRDMO；还包括申办方决定把工作留在内部，或把工作拆给专业 CRO 和 CDMO，而不是使用一体化伙伴 [CM001][CM003]。
            claimRefs:
              - CM001
              - CM002
              - CM003
