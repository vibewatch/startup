              Aragen 披露的运营信息多于许多私营同行，但几个重要指标仍需谨慎。FY2024-25 年报给出清晰的头部财务数：₹1,845 crore 收入、₹478 crore EBITDA、₹180 crore
              税后利润，足以作为本轮分析的标准财务基线 [CO011][CO012][CO013]。客户质量信号也支持正面判断：公司称其服务 400+ 家客户、覆盖前 20 大大型药企中的 15 家，重复客户率高于 90%
              [CO020][CO021][CO022][CO041]。主要摩擦来自外部数据供应商：The Company Check 列出 3,859 名员工和大量抵押负担，Growjo
              则给出更低员工数和一个无法与官方年报清晰对应的估算收入 [CO037][CO038][CO039]。正确分析姿态是：以公司披露的 FY2025
              财务为准，第三方目录只作方向性三角验证，并把准确员工数、股权结构表细节和客户集中度这些未解尽调问题带入后续章节 [CO036][CO039][CO040]。
