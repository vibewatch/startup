  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 基准与价格纪律
        blocks:
          - type: paragraph
            body: >-
              唯一干净的公开融资锚点仍是 2025 年 1 月 Quadria 交易：以约 $1.4B 估值融资 $100M，主要为新增资本，并明确用于扩张以满足外包需求。这个基准真实存在，但不能自证合理。Aragen 自身
              FY2024-25 年报已经披露足够财务背景，可以压力测试：收入 ₹1,845.11 crore、EBITDA ₹478.47 crore、没有单一客户超过收入 9%，且新增股本指定用于降债和持续 资本开支。按
              $1 兑 ₹83 粗算，2025 年 1 月基准隐含约 6.3x FY2024-25
              收入。这个价格既非明显便宜，也非明显离谱；它落在宽阔的上市可比公司区间中部。因此投资判断不在于这个基准是否存在，而在于考虑私营公司不透明、仍偏早的生物制剂制造验证，以及 2026
              年市场更挑剔之后，投资人是否还应支付这个价格。
