        - 2025 年末评论也警告，关税和回流改变流向后，2026 年可能是重置年。
        - 证明管线和 RFP 转化在关税噪音下仍有韧性。
      - - 流动性 / 估值
        - 最终 IPO 可以打开流动性和公开市场定价发现路径。
        - 私人投资人仍缺少 DRHP 细节、优先股堆叠和精确的新老股比例。
        - 分享招股文件草案、股权结构表和股东权利摘要。
    notes: 各行把最强公开支撑与最大未解估值折扣并列；最右列是足以改变判断的尽调请求。
