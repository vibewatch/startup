      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层披露显示，公司仍受创始人 / 发起人影响，但治理已转向更宽的机构化董事会。董事会页面列出董事长 D S Brar、发起人董事 G V Keshav Reddy、Goldman 支持的董事 Rajat
              Sood、Quadria 联合创始人 Amit Varma、独立行业资深人士 Robert Ruffolo、Ajay Srivastava 和 Anita Ramachandran，以及董事总经理兼 CEO
              Manni Kantipudi [CO003][CO031][CO032]。Manni 的任期可追溯至 2007 年；他横跨全组织的战略、M&A 和文化，既带来连续性，也带来一定关键人依赖
              [CO032][CO042]。不过，更宽的管理团队现在已按职能和业务线清晰分层——财务、商务、发现、开发与制造、生物制剂、数字、质量和 HR——相比只有创始人驱动的领导模式，单线程执行风险更低
              [CO033][CO042]。治理流程也比典型私营公司更机构化：审计委员会和外部审计师都被纳入合规监督 [CO030]。
