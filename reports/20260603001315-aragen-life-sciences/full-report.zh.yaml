        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              Aragen 的财务画像优于平均不透明私营
              CRDMO，但透明度还不足以支撑干净的投资判断。正面看，公司披露了经审计收入、EBITDA、PAT、地域结构、客户集中度，以及足够多的资产负债表细节，可以看出当前流动性可管理。收入质量也好过一次性项目店，因为公开记录支持反复发生的
              FTE 或按费用计价发现工作、多年客户留存，以及向开发和制造的重复扩张。需要谨慎的是，几乎所有会驱动上行信心的变量仍是私有信息：实际成交价格、分部毛利率、在手订单、生物制剂产能利用率、CAC
              或回本周期，以及当前现金余量。因此，实际结论是有条件正面。Aragen 看起来有融资能力，战略位置也不错；但在管理层通过 NDA
              打开分部经济性和流动性资料包之前，任何假设利润率扩张或轻松自筹增长的乐观情景都仍未被证明。
