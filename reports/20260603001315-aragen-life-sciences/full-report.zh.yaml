      - number: '3.2'
        title: 全球既有巨头与能力广度
        blocks:
          - type: paragraph
            body: >-
              全球既有巨头定义了能力广度的上限。WuXi AppTec 在本章提供了最宽的公开端到端菜单，覆盖生物学、化学、测试、TIDES，并用一套全球质量体系交付全球项目 [CP025][CP026]。WuXi
              Biologics 和 Lonza 在生物制剂与先进模态上走得更远；Lonza 明确把自己定位为最早的 CDMO，并列出 API、HPAPI、剂型、生物偶联、细胞与基因治疗能力
              [CP027][CP028][CP029]。Patheon 和 Recipharm 提供另一类替代方案：从开发到商业化的宽口径伙伴，拥有全球站点、监管深度、无菌交付，以及先进生物制剂或剂型能力
              [CP031][CP032][CP033]。在这个背景下，当委托是来自印度的一体化小分子外包时，Aragen 有可信竞争力；但公开证据显示，它无法匹配 Lonza、WuXi、Patheon 或 Recipharm
              的全球模态覆盖 [CP001][CP002][CP025][CP028][CP031][CP032]。Syngene 和 Piramal 从印度侧缩小了这道差距，因为二者公开披露的规模更大、服务足迹也比
              Aragen 更多元 [CP006][CP008][CP014][CP015]。
