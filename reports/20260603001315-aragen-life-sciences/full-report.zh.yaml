      - number: '5.3'
        title: 设施、质量与信任控制
        blocks:
          - type: paragraph
            body: >-
              Aragen 能指向具名资产和面向监管的里程碑时，设施就绪度最强。小分子已覆盖原料药、制剂、分析开发和商业 API 制造；R&D、中试和商业资产共址，设计目标是把技术转移留在内部
              [CE021][CE022][CE025][CE026]。生物制剂方面，网络现在把 Morgan Hill 的发现和非 GMP 基地，与 Bangalore 的 GMP 套件配对；公开来源共同指向 50 L to
              2,000 L 当前规模、5,000 L 扩产意图、强化补料分批操作，以及 late July 2025 的首批 GMP 批次
              [CE029][CE031][CE032][CE033][CE034]。制剂制造设施取得 Telangana DCA GMP 认证后，口服固体、液体、外用制剂和膜剂的临床批次药品就绪度也提高了
              [CE035]。质量状态有文件支撑，但部分偏自证：Aragen 描述企业 QMS、广泛审计暴露、数字 QA 系统，以及大量 IP 和网络控制；WHO 2023 API 检查则提供了最具体的外部合规证据，同时显示
