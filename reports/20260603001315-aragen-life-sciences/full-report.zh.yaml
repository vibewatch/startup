  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与披露结构
        blocks:
          - type: paragraph
            body: >-
              Aragen 的收入模式更像多元服务组合，而不是单项目生物科技押注。官方材料显示，变现从按 FTE 和费用条款出售的发现工作，延伸到开发、商业 API 供应和生物制剂生产。FY2024-25
              年报提供了私营公司少见的可用公开面：合并收入达到 ₹1,845 crore，EBITDA 利润率接近 26%，公司报告客户超过 400 家，且没有单一客户超过收入的 9%。但这并不等于结构完全透明。CRISIL
              的 FY2023-24 视角仍重要，因为它指出发现业务约占收入三分之二，生物制剂约占十分之一，意味着尽管管理层更用力推后期制造，收入基底仍偏发现。支撑投资判断的核心正面因素是：Aragen
              在分子生命周期的多个交接点变现，而不是依赖单一计价模式或单一客户类别。
