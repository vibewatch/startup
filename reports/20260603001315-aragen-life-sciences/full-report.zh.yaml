  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 可支撑估值区间
      - 相对 $1.4B 基准的总倍数
      - 概率信号
      - 关键风险 / 证据门槛
    rows:
      - - 乐观
        - Bengaluru 利用率变得可见，模态结构扩张，IPO 路径更清晰，Aragen 的交易倍数接近高溢价可比上市公司，达到 6.5-8.0x 收入。
        - $1.5B-$1.8B
        - 1.07x-1.29x
        - 低中
        - 需要当前利用率、订单簿和退出准备度证据。
      - - 基准
        - 收入质量守住，利润率稳定，印度 CRDMO 顺风仍在，但 Aragen 仍承受私人公司折扣，估值为 5.0-6.5x 收入。
        - $1.1B-$1.4B
        - 0.79x-1.00x
        - 中高
        - 只有利用率、杠杆和 IPO 材料不恶化，该基准才站得住。
      - - 熊市
        - 行业重估、关税摩擦，或 Bengaluru 爬坡放慢，把投资人估值锚推向 3.5-4.5x 收入。
        - $0.8B-$1.0B
        - 0.57x-0.71x
        - 中
        - 只要出现利用率不达预期、利润率兑现偏弱，或流动性路径延后，下行空间就会拉大。
    notes: 区间是分析师透明估算，基于 FY2024-25 披露收入 ₹1845.11 crore，并采用 ₹83/$ 的取整汇率换算；不是管理层指引。
