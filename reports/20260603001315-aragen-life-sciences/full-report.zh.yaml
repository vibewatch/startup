  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 已披露规模、同业倍数、私募市场不透明和行业风险，如何共同决定估值立场。
    data:
      nodes:
        - id: benchmark
          label: Jan-2025 基准
          detail: 约 $1.4B，新增资本约 $100M。
        - id: revenue
          label: FY25 已披露规模
          detail: 收入 ₹1,845.11 crore，EBITDA 利润率约 25.9%。
        - id: comps
          label: 公开同业区间
          detail: 约 2.5x 到 16.4x sales；Aragen 接近中位。
        - id: supports
          label: 支撑因素
          detail: 客户宽度、生物制剂增长和 India CRDMO 顺风。
        - id: pressures
          label: 压力因素
          detail: 私有公司不透明、早期爬坡证据、关税 / 重置风险，以及缺失 IPO 条款。
        - id: call
          label: 当前判断
          detail: 跟踪 / 继续研究；只有接近公允价值顶部时，基准才站得住。
      edges:
        - from: benchmark
          to: comps
          label: 映射到约 6.3x sales
        - from: revenue
          to: comps
          label: 锚定倍数
        - from: supports
          to: call
          label: 把估值留在区间内
        - from: pressures
          to: call
          label: 阻止溢价立场
        - from: comps
          to: call
          label: 显示基准处在中游，并不便宜
        - from: benchmark
          to: call
          label: 价格敏感型建议
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV015
      - CV043
      - CV044
      - CV045
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Aragen 基于已披露 FY2024-25 收入，对不同收入倍数假设的估值敏感性。
    data:
      items:
        - label: 3.5x sales（熊市低位）
          value: 0.78
          detail: 行业重置或重大爬坡失手。
        - label: 4.5x sales（熊市高位）
          value: 1
          detail: 私有公司折价扩大，但业务底盘仍完整。
        - label: 6.3x sales（Jan-2025 基准）
          value: 1.4
          detail: Quadria 轮隐含的基准。
        - label: 6.5x sales（牛市低位）
          value: 1.44
          detail: 需要可见利用率和更清晰 IPO 路径。
        - label: 8.0x sales（牛市高位）
          value: 1.78
          detail: 需要接近公开市场溢价的信心，目前看不到。
    approximationNotes: 数值是分析师估计，基于 FY2024-25 已披露收入和约 ₹83/$ 汇率；它们是启发式股权价值输出，不是管理层指引。
    claimRefs:
      - CV015
      - CV046
      - CV047
      - CV048
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 熊市、基准、牛市三档估值区间，并明确相对 2025 年 1 月基准的中点假设。
    data:
      items:
        - label: 熊市情景
          low: 0.8
          mid: 0.89
          high: 1
          unit: USD bn
          detail: 行业重置或爬坡证据低于预期时，收入倍数 3.5x-4.5x。
        - label: 基准情景
          low: 1.1
          mid: 1.25
          high: 1.4
          unit: USD bn
          detail: 带有一定私有公司折价，收入倍数 5.0x-6.5x。
        - label: 牛市情景
          low: 1.5
          mid: 1.61
          high: 1.8
          unit: USD bn
          detail: 利用率、利润率和 IPO 准备度去风险后，收入倍数 6.5x-8.0x。
    approximationNotes: 中点用于对照 2025 年 1 月基准计算回报，应把它们视作情景锚点，而不是预测精度。
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 可用指标，概括估值锚、当前披露和相对公开市场支撑。
    data:
      items:
        - label: Jan-2025 基准
          value: $1.4B
          unit: USD
          detail: Quadria 少数股权投资；资金大多是新资本。
          tone: neutral
        - label: FY25 收入
          value: ₹1,845.11cr
          unit: null
          detail: FY2024-25 年报已披露。
          tone: positive
        - label: FY25 EBITDA 利润率
          value: ~25.9%
          unit: null
          detail: 为正，但仍低于 CRISIL 此前 28-29% 预期区间。
          tone: neutral
        - label: 隐含基准倍数
          value: ~6.3x
          unit: sales
          detail: 使用已披露 FY25 收入和约 ₹83/$ 汇率。
          tone: neutral
        - label: 最接近的印度上市可比公司
          value: Syngene 4.69x
          unit: P/S
          detail: 披露更好，但低于 Aragen 基准。
          tone: negative
        - label: 全球可比公司区间
          value: Lonza ~5.3x to WuXi ~7.5x
          unit: sales
          detail: 在任何私有公司折价前，Aragen 位于该区间内。
          tone: neutral
        - label: 当前立场
          value: Track / research-more
          unit: null
          detail: 需要利用率、杠杆和 IPO 条款证据，才能上调判断。
          tone: negative
    approximationNotes: 倍数结合直接公开市场数据输出和透明分析师计算；都不应被解读为已审计公允价值。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV015
      - CV016
      - CV021
      - CV024
      - CV050
