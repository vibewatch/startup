      - number: '3.4'
        title: 护城河耐久性与替代方案
        blocks:
          - type: paragraph
            body: >-
              因此，护城河问题不在于某个不可战胜的单点功能，而在于买方最能忍受哪一种取舍。Aragen 最强的耐久位置，是以印度为基地的一体化小分子能力栈，并叠加明确的质量和 IP
              叙事；这对既想要单一伙伴、又不想承担中国地缘政治风险或西方成本结构的申办方很重要 [CP047][CP052]。这道护城河真实存在，但并非攻不破。Sai 和 Jubilant 正在更用力推进快速周转发现、FFS
              执行和化学放大，Syngene 与 Piramal 则仍是披露更充分、规模更大的公开同行 [CP013][CP022][CP024][CP048][CP049]。Divi’s 和 Laurus
              等制造牵引型玩家，即使不是发现优先的替代者，仍能赢下后期或定制合成占比高的工作 [CP017][CP020][CP021][CP050]。反向证据同时强化机会与风险。对 WuXi
              的审查似乎在把需求导向印度供应商，但也说明大型 CRDMO 能嵌入得很深；项目成熟后，转移会非常痛 [CP041][CP042][CP043][CP044]。Catalent
              警告信给出相反教训：质量体系失灵时，受信任品牌也会很快失去可信度 [CP045][CP046]。
