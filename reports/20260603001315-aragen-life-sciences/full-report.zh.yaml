        blocks:
          - type: paragraph
            body: >-
              公开成本面显示，这家公司利润率不错，但经营杠杆和资产负债表需求都很真实。FY2024-25 EBITDA 利润率为 25.93%，单体 P&L 显示员工福利费用约 ₹443 crore、财务成本约 ₹31.7
              crore。按单体总额计算，劳动力成本约占总收入 26%，这符合科学家密集型 CRDMO 的特征，而不是轻资产纯经纪模式。营运资本并不轻：单体应收账款约 ₹394 crore、存货约 ₹80 crore，部分由约
              ₹138 crore 应付账款抵消，流动比率接近 1.63x。更大的问题是资本强度。Aragen 在 FY2024-25 投产新制造资产，继续建设 Bangalore 生物制剂基地；CRISIL
              仍将年度资本开支描述为约 ₹400 crore。这是可管理的，但前提只是 EBITDA 已有意义，且资产负债表最近得到新股补充。
