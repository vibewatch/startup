      - number: '8.2'
        title: 上市可比公司倍数
        blocks:
          - type: paragraph
            body: >-
              上市公司倍数给出的答案需要分层，不能单向判断。最接近的印度上市可比公司是 Syngene；其 2026 年 6 月收入页面按 FY2026 收入隐含约 4.7x 销售额。Piramal Pharma 低得多，约
              2.5x，反映多元化和较弱增长。全球龙头区间更宽：按公开市值 / 收入计算，Lonza 约 5.3x，WuXi 约 7.5x。Divi's 和 Laurus 交易倍数高得多，但锚定意义有限：Divi's
              内含同业最佳溢价，Laurus 的经营画像仍比纯粹 CRDMO 更混合。这使 Aragen 隐含约 6.3x
              落在广义同业中部。问题不是该基准高于所有上市同业，而是披露更薄的私营公司已经接近上市龙头，投资人若要继续加价，需要先看到产能利用率、利润率和退出路径的额外证明。
