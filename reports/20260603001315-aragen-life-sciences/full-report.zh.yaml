      - number: '7.3'
        title: 客户集中度、需求与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              Aragen 的客户风险，与其说是单一大客户集中，不如说是风险暴露成簇。年报披露，没有单一客户贡献超过 9% 收入，这是有用缓冲。但公司明显围绕全球大型药企和西方外包需求运转：公开材料和投资者报道反复提到 400
              多家客户、与全球前 20 大药企中 15 家建立关系，收入组合也越来越受头部药企账户牵引。需求还受 Aragen 无法控制的外部条件推动。Pharma Manufacturing 和 Business Today
              都写到 China+1 顺风：地缘政治风险、BIOSECURE 担忧和成本压力把项目从中国推走，客户先用试点测试印度，再扩大外包。顺风可能反转，也可能放慢。Aragen
              自己也说，发现业务资金仍在不均衡恢复，早期管线比 2022 年前更薄。落到经营上，客户数量多并不能消除集中风险：外包潮一旦停顿，关税或贸易政策开始咬利润，或头部药企试点迟迟不能放量，Bangalore
              的产能利用率和利润率杠杆可能比客户数量这个表层数字暗示得更快落空。
