      - number: '7.4'
        title: 资产负债表、竞争与人才风险
        blocks:
          - type: paragraph
            body: >-
              增长叙事下面压着财务和竞争风险。Aragen 显然不是困境平台：2025 年它以约 $1.4B 估值融资
              $100M，披露新增股本将用于降债和资本开支，同时仍有实质客户需求支撑。但同一组证据也说明，增长很吃资本。CRISIL 称，有机资本开支每年约 Rs 400
              crore，且会靠债务融资；公开公司数据聚合平台仍显示未结清抵押金额不小，利润和 EBITDA 趋势也不平滑。如果竞争格局不变，投资人还更容易接受这组风险，但事实并非如此。BCG 认为，印度 CRDMO
              机会还需要扩大人才队伍、理顺监管、强化本土供应链；BioProcess 则强调，Syngene 已在为西方客户准备规模大得多的 20kL 生物制剂产能。因此 Aragen
              必须同时招聘、培训、商业化并守住质量。公开备案和公司数据库只能看到部分治理信息，投资人仍缺董事会权利、债务契约和运营指标细节；这些细节才能说明，当前资本结构是真的韧性充足，还是只是在执行顺畅时勉强够用。
