        - 提供按收入而非账户数计算的队列留存
      - - 前 10 大客户集中度
        - FY2024 总收入的 32%
        - 中
        - 是有用的集中度和定价权代理指标
        - 按业务线提供 FY2025 前 10 大和前 20 大客户集中度
      - - 现金盈余对年度债务的覆盖
        - 按 CRISIL 的 ₹300-400 crore 现金盈余对 ₹80-100 crore 债务义务计算，为 3x-5x
        - 中
        - 说明在可选资本开支之前，债务服务可控
        - 提供 FY2025 实际经营现金流和债务服务现金流出
