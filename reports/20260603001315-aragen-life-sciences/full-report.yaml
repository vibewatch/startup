  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and compliance risk
        blocks:
          - type: paragraph
            body: >-
              Aragen's legal and compliance surface is strongest where the record is mixed rather than clean. The
              company can point to current quality-system messaging, a WHO public inspection report that found
              acceptable GMP compliance at the inspected API site, and a public claim that its most recent USFDA audit
              closed with no observations. But the same public record still forces caution. EMA's GVK Biosciences
              referral remains a real legacy scar: European authorities upheld suspension recommendations after
              identifying systematic ECG data manipulation at the Hyderabad site used for generic-drug studies. More
              recently, a 2026 Form 483 metadata listing indicates fresh inspection observations exist even though the
              observation text and remediation are not public. Legal exposure is also non-zero. PACERMonitor shows an
              arbitration-related federal case involving Aragen entities in California that required temporary
              restraining-order proceedings before dismissal, while an Indian tax tribunal order confirms that public
              legal history still exists in ordinary course. The right underwriting posture is therefore not “assume
              failure,” but “assume diligence is mandatory until management produces the 483, remediation trail, and
              fuller litigation context.”
