      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosures show a company that remains founder-promoter influenced but is now governed
              through a broader institutional board. The board page lists chairman D S Brar, promoter-director G V
              Keshav Reddy, Goldman-backed director Rajat Sood, Quadria cofounder Amit Varma, independent industry
              veterans Robert Ruffolo, Ajay Srivastava, and Anita Ramachandran, plus MD and CEO Manni Kantipudi
              [CO003][CO031][CO032]. Manni's tenure dates back to 2007, which creates both continuity and some
              key-person dependence because he spans strategy, M&A, and culture across the whole organization
              [CO032][CO042]. The broader management team, however, is now explicitly segmented by function and business
              line — finance, commercial, discovery, development and manufacturing, biologics, digital, quality, and HR
              — which reduces single-threaded execution risk compared with a founder-only leadership model
              [CO033][CO042]. Governance processes also look more institutional than typical for a private company, with
              an audit committee and external auditors named as part of compliance oversight [CO030].
