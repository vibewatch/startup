            body: >-
              Aragen’s enabling architecture is less a single software platform than a stack of workflow-specific
              systems connecting discovery, manufacturing, and compliance. In discovery, InCoRe is positioned as the
              connective tissue for DMTA cycle management, customer data sharing, and chemistry-biology collaboration,
              while the computational group cites Schrodinger, Cresset, SARvision, DataWarrior, homology modelling,
              cryptic-pocket analysis, and molecular-dynamics simulation to guide design [CE007][CE008][CE010]. In
              execution, Aragen says robotic compound handling and assay automation reduce manual data handling by 20%
              to 40%, and Smartsheet is used for portfolio visibility and OTIF risk monitoring [CE009][CE011][CE012]. On
              the plant side, Golden Batch Analytics is the clearest quantified AI claim: Aragen says batch-history
              models identify CPPs and can lift repetitive-batch yields by 3% to 5% [CE013][CE027]. The limitation is
              external verification. These are specific operational claims, but public customer case studies, benchmark
              data, or named deployments remain sparse, so the digital layer looks directionally differentiated yet
              still mostly company-asserted [CE014][CE043][CE044].
