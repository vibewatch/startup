      - number: '8.2'
        title: Public comparable multiples
        blocks:
          - type: paragraph
            body: >-
              Public multiples support a nuanced, not one-directional, answer. The closest Indian listed analogue is
              Syngene, whose June 2026 revenue page implies about 4.7x sales on FY2026 revenue. Piramal Pharma sits much
              lower at roughly 2.5x, reflecting diversification and softer growth. Global leaders span a wider band:
              Lonza screens around 5.3x and WuXi around 7.5x on public market-cap-to-revenue math. Divi's and Laurus
              trade much richer, but both are imperfect anchors because Divi's embeds a best-in-class premium and Laurus
              still carries a more mixed operating profile than a clean-play CRDMO. That puts Aragen's implied ~6.3x
              around the middle of the broad peer set. The problem is not that the benchmark is above every public peer;
              it is that a private company with thinner disclosure is already close enough to public leaders that
              investors need extra proof on utilisation, margins, and exit path before paying further up.
