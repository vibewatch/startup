    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Aragen valuation sensitivity to different revenue-multiple assumptions on the disclosed FY2024-25 revenue base.
    data:
      items:
        - label: 3.5x sales (bear low)
          value: 0.78
          detail: Sector reset or material ramp miss.
        - label: 4.5x sales (bear high)
          value: 1
          detail: Private discount widens but franchise still intact.
        - label: 6.3x sales (Jan-2025 benchmark)
          value: 1.4
          detail: Benchmark implied by the Quadria round.
        - label: 6.5x sales (bull low)
          value: 1.44
          detail: Needs visible utilisation and cleaner IPO path.
        - label: 8.0x sales (bull high)
          value: 1.78
          detail: Requires public-premium style confidence, not currently visible.
