    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Evolution
        blocks:
          - type: paragraph
            body: >-
              Aragen's identity is unusually well documented for a private Indian CRDMO because the company publishes
              both a detailed historical timeline and a recent annual report. The legal entity was incorporated on 07
              December 2000 in Hyderabad, but the operating story the company highlights starts on 02 April 2001 when G
              V Sanjay Reddy established GVK BIO as an informatics company in Hyderabad [CO001][CO002]. Over time the
              business expanded from informatics into chemistry, biology, manufacturing, and then biologics through
              acquisitions and site additions [CO004][CO005][CO006]. The pivotal brand transition came in May 2021, when
              GVK BIO rebranded as Aragen to signal a broader end-to-end outsourcing proposition for global biopharma
              rather than a narrower legacy CRO identity [CO007]. That rebrand matters because later chapters rely on
              Aragen as the canonical entity name even though many older third-party sources, lenders, and investors
              still reference GVK Biosciences [CO001][CO007].
