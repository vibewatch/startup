  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Bengaluru utilisation misses
        - Commercial utilisation or booked orders stay opaque or visibly weak through 2026.
        - Bull case loses its premium-multiple support because biologics capex is not translating into throughput.
        - Move valuation reference toward the base-to-bear band and increase required downside protection.
      - - Margin does not follow growth
        - Revenue grows but EBITDA margin still cannot reach sector-style 26-28% territory.
        - Scale no longer supports a Syngene/Lonza-like multiple.
        - Treat the benchmark as stretched and re-underwrite on lower multiples.
      - - Regulatory execution deteriorates
        - Any meaningful unresolved observation or quality issue emerges during the new-site ramp.
        - Public-peer parity breaks because investors penalise execution slippage fast.
        - Shift to the bear band until remediation evidence is visible.
      - - IPO path slips or terms worsen
        - Public-listing path remains vague, or preference stack and secondary mix prove unfriendly.
        - Liquidity support for a premium private valuation weakens materially.
        - Require lower entry price or stronger preferred terms.
      - - Tariff / sector reset bites demand
        - US tariff, reshoring, or Biosecure-driven supply-chain shifts reduce RFP conversion or delay client decisions.
        - Sector tailwind fades, compressing the public comp backdrop supporting Aragen.
        - Use the lower half of the scenario band until demand signals recover.
    notes: >-
      These are investor kill criteria tied to public valuation transmission, not management operating targets. Each
      should be tested with private diligence before capital is committed.
    claimRefs:
      - CV032
      - CV033
      - CV034
