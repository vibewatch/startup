      - number: '3.2'
        title: Global Incumbents and Capability Breadth
        blocks:
          - type: paragraph
            body: >-
              Global incumbents set the upper bound on breadth. WuXi AppTec presents the broadest public end-to-end menu
              in this chapter, spanning biology, chemistry, testing, TIDES, and worldwide delivery under one global
              quality system [CP025][CP026]. WuXi Biologics and Lonza go further on biologics and advanced modalities,
              with Lonza explicitly framing itself as the original CDMO and listing API, HPAPI, dosage-form,
              bioconjugate, and cell-and-gene-therapy capabilities [CP027][CP028][CP029]. Patheon and Recipharm add
              another class of alternative: very broad development-to-commercial partners with global sites, regulatory
              depth, sterile delivery, and advanced-bio or dosage-form expertise [CP031][CP032][CP033]. Against that
              backdrop, Aragen competes credibly when the mandate is integrated small-molecule outsourcing from India,
              but it does not match the worldwide modality spread of Lonza, WuXi, Patheon, or Recipharm on public
              evidence [CP001][CP002][CP025][CP028][CP031][CP032]. Syngene and Piramal narrow that gap from the Indian
              side because both disclose larger scale and more diversified service footprints than Aragen does publicly
              [CP006][CP008][CP014][CP015].
