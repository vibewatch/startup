      - number: '8.5'
        title: Explicit stance, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The explicit stance is that the January 2025 benchmark remains defensible only as the top end of a fair
              range, and looks stretched for fresh money without better 2026 proof or more investor-friendly terms. That
              does not mean Aragen is unattractive as a business. It means the public record does not yet show enough
              incremental upside between $1.4 billion and the bull case to compensate for the downside bands and the
              private-information gap. The appropriate recommendation is therefore track or research-more, with medium
              confidence and high diligence intensity. Investors who want to pay near the benchmark should demand
              current site-level utilisation, top-customer duration, updated leverage and covenant data, and draft IPO
              materials before treating the business like a public comparable. If those data arrive clean, the call can
              improve. If they do not, or if tariffs and execution pressure widen, the benchmark should be marked down
              toward the bear range rather than rolled forward as if it were still self-evidently current.
