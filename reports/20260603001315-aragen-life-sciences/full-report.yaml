      - number: '1.4'
        title: Footprint, Capabilities, and Scale
        blocks:
          - type: paragraph
            body: >-
              Official materials position Aragen as a broad, integrated outsourcing platform rather than a
              single-service CRO or CDMO. The company describes itself as a concept-to-commercial CRDMO spanning small
              molecules, biologics, peptides, and related programmes for pharma, biotech, agrochemical, and
              animal-health customers [CO023]. The physical footprint supports that claim: Hyderabad remains the global
              headquarters, Morgan Hill anchors US biologics work, and the global-locations page lists campuses or
              offices across Hyderabad, Mallapur, Visakhapatnam, Bengaluru, Pune, Cambridge, and Morgan Hill, while the
              annual report simplifies this into six core operating campuses within 1.6 million square feet of
              infrastructure [CO019][CO024][CO025][CO026][CO027]. Scale disclosures are also strong by private-company
              standards: Aragen says it has 4,500+ employees, 450+ PhDs, 290+ active clinical programmes, 100+ INDs
              filed via its cell lines, and 400+ customers [CO014][CO015][CO016][CO017][CO020]. Quality and regulatory
              markers — ISO systems, USFDA-linked facilities, EDQM, PMDA, WHO, CDSCO, and AAALAC coverage — help explain
              why large pharma clients are willing to outsource complex programs to an India-headquartered platform
              [CO028][CO029].
