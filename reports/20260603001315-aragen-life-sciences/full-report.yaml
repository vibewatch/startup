            body: >-
              Near-term capital adequacy looks acceptable, but not self-evidently overcapitalized. The strongest public
              support is the January 2025 Quadria round: official sources describe $100 million of funding at roughly a
              $1.4 billion valuation, primarily fresh capital, and the annual report ties that capital directly to debt
              reduction and ongoing capex. CRISIL’s August 2024 rationale is also constructive: it described liquidity
              as strong, cash accrual of ₹300-400 crore, annual debt obligations of ₹80-100 crore, and liquid surplus of
              ₹200 crore as of March 2024. The caveat is that CRISIL also described roughly ₹400 crore of annual capex
              as partly debt-funded and listed a meaningful rated stack of bank lines, NCDs, proposed term debt, and
              commercial paper. Balance-sheet notes reinforce that working-capital loans are secured on current assets
              and subject to leverage and coverage covenants. The implication is clear: Aragen is not showing distress,
