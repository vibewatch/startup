          unit: P/S
          detail: Lower than Aragen's benchmark despite better disclosure.
          tone: negative
        - label: Global comp range
          value: Lonza ~5.3x to WuXi ~7.5x
          unit: sales
          detail: Aragen sits inside this band before any private-company discount.
          tone: neutral
        - label: Current stance
          value: Track / research-more
          unit: null
          detail: Need utilisation, leverage, and IPO-term proof to improve the call.
          tone: negative
