      - number: '2.2'
        title: Sizing Lenses and Contradictions
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is directionally bullish but numerically inconsistent. On the broadest lens,
              BlueWeave puts India's CRDMO market at $22.61 billion in 2024 and $53.53 billion by 2031 [CM004]. On a
              much narrower lens, BCG and IPSO describe the sector as only $3-3.5 billion today but capable of reaching
              $22-25 billion by 2035 [CM005]. JM Financial and IBEF sit between those endpoints, both pointing to
              roughly $14 billion by 2028 [CM006][CM007]. The most useful interpretation is not to pick one number
              blindly but to recognize that the estimates are describing different market boundaries and service mixes
              [CM008]. The same problem exists globally: JM cites a $197 billion to $302 billion CRDMO trajectory,
              PharmaSource says $220 billion in 2025 and $236 billion in 2026, and Mordor is even higher
              [CM009][CM010][CM011]. For later valuation work, these figures are better treated as a range of lenses
              than as one canonical TAM.
            claimRefs:
