      - number: '1.3'
        title: Capital, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >-
              Aragen's ownership story has shifted from promoter-plus-PE backing to a more visibly institutional setup.
              In May 2021 Goldman Sachs bought a significant minority stake from ChrysCapital and other existing
              shareholders, marking the first clearly visible global strategic-capital endorsement in the current era
              [CO008]. In January 2025 Quadria Capital then invested $100 million at an approximate $1.4 billion
              valuation, largely as fresh capital with a smaller secondary component, and explicitly joined Goldman as
              the second strategic investor in the business [CO009][CO010]. The current board composition reflects that
              investor mix because Rajat Sood and Amit Varma now appear on the public board page [CO031][CO040]. The
              main limitation is that Aragen does not publicly disclose a full cap table, exact total primary capital
              raised, or the exact size of the secondary liquidity element in recent rounds, so the company should be
              treated as institutionally scaled and IPO-optional rather than already transparently IPO-ready
              [CO036][CO037][CO040].
