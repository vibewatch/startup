  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Aragen is not the entire Indian pharmaceutical economy; it is the outsourced
              innovator-services layer that sits between sponsor R&D and commercial launch. Sector sources consistently
              define CRDMOs as integrated providers of discovery, development, and manufacturing rather than simple
              capacity vendors [CM001][CM002]. That means the included spend is sponsor-funded external work across
              discovery, preclinical and clinical development support, CMC, analytical services, and commercial
              manufacturing [CM002]. The excluded spend is equally important: in-house pharma R&D, end-market medicine
              sales, hospital budgets, and generic distribution are all part of the wider pharma ecosystem but not
              directly addressable outsourcing revenue for a company like Aragen [CM003]. This boundary also clarifies
              the status-quo substitute. The main substitute is not another CRDMO alone; it is a sponsor deciding to
              keep work in-house or to split work across specialized CROs and CDMOs instead of using an integrated
              partner [CM001][CM003].
            claimRefs:
              - CM001
              - CM002
              - CM003
