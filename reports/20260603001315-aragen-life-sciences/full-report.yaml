        title: Customer mix and buyer base
        blocks:
          - type: paragraph
            body: >-
              Public customer breadth is credible, but the count is disclosed as a range rather than as one audited
              current figure. Independent and company-linked sources consistently place Aragen above 400 customers,
              while some collaboration releases still use over 450, so the safe read is a 400-450+ global base depending
              on source vintage. The mix is not limited to human therapeutics: reviewed sources show large pharma,
              biotech, agrochemical, animal-health, vaccine, academic, and diagnostic-type buyers. Independent reporting
              also shows the base is regionally skewed. BioProcess International described demand as predominantly
              Western big pharma, biotech, and animal health with a growing Asian base, while Digital Health News said
              the US contributes about 65% of revenue and Europe about 25%. That combination supports a broad buyer
              roster but also a geographically concentrated demand base. Anonymous Aragen Bioscience testimonials widen
              buyer-type coverage, yet named proof comes mainly from FMC, Serum, UTS, FAR, and Renaissance.
