  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: How disclosed scale, peer multiples, private-market opacity, and sector risk combine into the valuation stance.
    data:
      nodes:
        - id: benchmark
          label: Jan-2025 benchmark
          detail: ~$1.4B and ~$100M fresh capital.
        - id: revenue
          label: FY25 disclosed scale
          detail: ₹1,845.11 crore revenue and ~25.9% EBITDA margin.
        - id: comps
          label: Public peer band
          detail: Roughly 2.5x to 16.4x sales; Aragen screens near the middle.
        - id: supports
          label: Supportive factors
          detail: Customer breadth, biologics growth, and India CRDMO tailwinds.
        - id: pressures
          label: Pressuring factors
          detail: Private opacity, early ramp proof, tariff/reset risk, and missing IPO terms.
        - id: call
          label: Current call
          detail: Track / research-more; benchmark is defensible only near the top of fair value.
      edges:
        - from: benchmark
