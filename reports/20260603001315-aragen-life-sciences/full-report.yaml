      - number: '2.3'
        title: Buyers, Users, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Buyer behavior in CRDMO is stage-specific. Early outsourcing is often driven by biotech founders, program
              leads, and R&D teams that lack scale or want to preserve capital, while late-stage outsourcing is more
              likely to be owned by CMC, tech-ops, procurement, and supply-chain leaders focused on speed, reliability,
              and commercial readiness [CM017][CM033]. That change in budget owner is one reason integrated vendors are
              rewarded more heavily as programs approach clinic and commercial scale [CM025][CM033]. Peer disclosures
              reinforce that broad buyer map: Syngene explicitly targets global pharma, biotech, animal health, and
              specialty chemical customers from early discovery to commercial supply, while WuXi and Lonza describe
              similar integrated, cross-border operating models [CM018][CM019][CM020]. This matters for Aragen because
              its sweet spot is the integrated part of the market where sponsors prefer fewer handoffs and one quality
              system across the molecule lifecycle [CM034]. In other words, Aragen's market is not only large because
              outsourcing is growing; it is large because a meaningful subset of buyers increasingly wants integrated
              partners rather than a chain of disconnected specialists [CM017][CM033][CM034].
            claimRefs:
