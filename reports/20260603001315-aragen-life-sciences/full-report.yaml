      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Aragen’s financial profile is better than the average opaque private CRDMO, but not yet transparent enough
              for clean underwriting. Positively, the company discloses audited revenue, EBITDA, PAT, geography mix,
              customer concentration, and enough balance-sheet detail to see that liquidity is currently manageable.
              Revenue quality also looks better than a one-off project shop because the public record supports recurring
              FTE or fee-based discovery work, multi-year client retention, and repeat expansion into development and
              manufacturing. The caution is that almost every variable that would drive upside confidence remains
              private: realized pricing, segment gross margins, backlog, biologics utilization, CAC or payback, and
              current cash headroom. The practical verdict is therefore a conditional positive. Aragen appears
              financeable and strategically well positioned, but any bull case that assumes margin expansion or
              effortless self-funded growth should be treated as unproven until management opens the segment-economics
              and liquidity package under NDA.
