    analytical work, and commercial manufacturing for small molecules, plus biologics services covering cell-line
    development, protein expression, process and analytical development, QC, and GMP manufacturing. Public materials
    also highlight peptide and oligonucleotide chemistry and newer modality expansion.
  customerFocus: >-
    Global pharma, biotech, agrochemical, animal-health, vaccine, and selected academic or partner-led biologics
    customers, with public revenue and customer proof skewed toward US and European buyers.
  businessModel: >-
    Primarily fee-for-service and FTE-style discovery work that can expand into development, analytical, and
