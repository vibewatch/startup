      - number: '7.4'
        title: Balance-sheet, competition, and people risk
        blocks:
          - type: paragraph
            body: >-
              Financial and competitive risk sit underneath the growth story. Aragen is clearly not a distressed
              platform: it raised $100 million in 2025 at roughly a $1.4 billion valuation, disclosed fresh equity
              earmarked for debt reduction and capex, and still benefits from meaningful customer demand. But the same
              evidence also shows that growth is capital-hungry. CRISIL says organic capex runs around Rs 400 crore
              annually and would be debt-funded, while public company-data aggregators still show sizeable open charges
              and uneven profit and EBITDA trends. That would be easier to underwrite if competition were static, but it
              is not. BCG says India's CRDMO opportunity also requires workforce scaling, regulatory streamlining, and
              stronger domestic supply chains, while BioProcess highlights a much larger 20kL Syngene biologics
              footprint already being readied for Western customers. Aragen therefore has to hire, train, commercialize,
              and keep quality tight at the same time. Public filings and company databases provide only partial
              governance visibility, so investors are still missing the board-rights, covenant, and operating-metric
              detail that would show whether the current capital structure is comfortably resilient or simply adequate
              as long as execution remains smooth.
