  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Direct Indian Peers
        blocks:
          - type: paragraph
            body: >-
              The closest direct competition to Aragen is not every company that can manufacture an API. It is the
              narrower set of Indian CRDMOs that can take a small-molecule program from discovery or early development
              into regulated manufacturing without repeated handoffs. Aragen’s public surface centers on integrated
              discovery, downstream development, manufacturing, and explicit quality and IP controls, which is the
              baseline buyers will compare against [CP001][CP002][CP004][CP005]. Syngene sits above Aragen on publicly
              disclosed scale and modality breadth, while Sai and Jubilant look more like fast-moving execution
              challengers in fee-for-service and scale-up workflows [CP006][CP008][CP010][CP013][CP022][CP023]. Piramal
              is broader and more global, but it is also a different class of networked CDMO than a pure India-cost
              challenger [CP014][CP016]. Divi’s and Laurus belong in the same buying discussion mainly when the sponsor
              prioritizes manufacturing and custom-synthesis depth over discovery-led integration [CP017][CP019][CP020].
              The useful landscape, then, is a layered one: Aragen versus India-based integrated peers for most
              small-molecule programs, versus manufacturing-led Indian alternatives for later-stage supply, and versus
              global incumbents for the largest or most modality-diverse mandates [CP047][CP048][CP049][CP050].
