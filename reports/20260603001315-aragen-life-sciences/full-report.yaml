      - number: '7.2'
        title: Operational, quality, and modality-execution risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is now concentrated in the Bangalore biologics ramp and in Aragen's ability to
              industrialize newer modalities without losing quality discipline. Public sources agree that the site only
              finished qualification shortly before first GMP batches in late July 2025, which means commercial
              biologics manufacturing is recent, not yet a long-cycle proven capability. The facility design is
              attractive on paper—multiple 2KL single-use bioreactors feeding a common downstream suite, high stated
              titers, and the option to run several customers in parallel—but those same features create scheduling,
              release, and tech-transfer complexity if client mix or batch performance disappoints. The ramp also
              depends materially on cross-site coordination: management said the first three commercial Bangalore orders
              came from California teams, so the California-to-India handoff is not an edge case but a core operating
              model. That is manageable if quality systems remain tight and client programs continue advancing; it
              becomes risky if Bangalore utilization stays lumpy, if tech transfers slip, or if the first visible
              compliance issue lands while Aragen is still proving this new manufacturing surface.
