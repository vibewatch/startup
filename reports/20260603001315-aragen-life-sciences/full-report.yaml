      - number: '7.3'
        title: Customer concentration, demand, and geopolitical risk
        blocks:
          - type: paragraph
            body: >-
              Aragen's customer risk is better described as clustered exposure than single-name concentration. The
              annual report says no single customer exceeded 9% of revenue, which is a useful mitigant. Even so, the
              company is explicitly oriented around large global pharma and Western outsourcing demand: public materials
              and investor coverage consistently cite 400-plus customers, relationships with 15 of the top 20 pharma
              companies, and a revenue mix increasingly shaped by top-pharma accounts. Demand has also been helped by
              conditions that Aragen does not control. Pharma Manufacturing and Business Today both describe a
              China-plus-one tailwind, with customers testing India through pilots and then broadening outsourcing as
              geopolitical risk, BIOSECURE concerns, and cost pressure push work away from China. That tailwind can
              reverse or slow. Aragen itself says discovery funding is still recovering unevenly and the early pipeline
              is thinner than before 2022. In practice, that means customer breadth does not eliminate concentration
              risk: if the outsourcing wave pauses, if tariffs or trade policy bite, or if top-pharma pilots fail to
              mature, Bangalore utilization and margin leverage could disappoint faster than the customer-count headline
              suggests.
