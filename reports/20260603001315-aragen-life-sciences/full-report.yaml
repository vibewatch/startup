              conditions and a market where customers often test the water with pilots before scaling. That matters
              because the publicly visible base is concentrated where the budgets sit: Digital Health News said about
              90% of revenue comes from the US and Europe, and Business Today said 15 of the top 20 global pharma
              companies are customers while many are actively rebalancing China exposure into India. Those are useful
              quality signals, but they also mean macro pauses by Western innovators could hit demand
              disproportionately. Public sources still do not disclose top-customer revenue share, top-10 account
              tenure, or numeric renewals, and Business Today separately flagged quality-and-compliance discipline at
              scale as a strategic risk as more biologics work shifts to India.
