        - label: Base case
          low: 1.1
          mid: 1.25
          high: 1.4
          unit: USD bn
          detail: 5.0x-6.5x revenue with some private-company discount.
        - label: Bull case
          low: 1.5
          mid: 1.61
          high: 1.8
          unit: USD bn
          detail: 6.5x-8.0x revenue if utilisation, margins, and IPO readiness de-risk.
