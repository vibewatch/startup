        title: Disclosed Metrics and Data Frictions
        blocks:
          - type: paragraph
            body: >-
              Aragen discloses more operating information than many private peers, but several important metrics still
              require caution. The FY2024-25 annual report gives clean headline financials of ₹1,845 crore revenue, ₹478
              crore EBITDA, and ₹180 crore profit after tax, which is strong enough to use as the canonical financial
              baseline for this run [CO011][CO012][CO013]. Customer-quality signals are also supportive because the
              company says it serves 400+ customers, 15 of the top 20 large pharma companies, and maintains a
              repeat-customer rate above 90 percent [CO020][CO021][CO022][CO041]. The main friction comes from external
              data vendors: The Company Check lists 3,859 employees and substantial charges, while Growjo supplies a
              lower headcount and an estimated revenue number that does not map cleanly to the official annual report
              [CO037][CO038][CO039]. The right analytical posture is to rely on company-reported FY2025 financials, use
              third-party directories only as directional triangulation, and carry unresolved diligence asks on exact
              headcount, cap-table detail, and customer concentration into later chapters [CO036][CO039][CO040].
