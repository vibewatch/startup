      - number: '3.3'
        title: Pricing, Trust, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Pricing is the least transparent part of the market. None of the main official surfaces reviewed for
              Aragen, Syngene, Sai, Piramal, WuXi, Catalent, Patheon, or Recipharm publishes a simple list-price menu
              that a buyer can compare line by line, so procurement remains quote-based and negotiated [CP037]. Public
              evidence instead signals contract style. Sai talks in terms of quality, pricing, responsiveness, and
              end-to-end work; Jubilant explicitly highlights fee-for-service demand and seamless transfer into GMP
              facilities; Piramal and Catalent emphasize integrated projects and clinical-supply execution; Patheon
              stresses flexible business models and coordinated lifecycle support
              [CP012][CP015][CP022][CP030][CP031][CP038]. That lack of public price transparency raises the importance
              of trust. Industry sources say sponsors now favor integrated partners for speed and scalability, and that
              the real decision criteria are familiarity, quality systems, regulatory performance, and delivery
              reliability rather than posted tariffs [CP035][CP036]. Those same dynamics create switching costs:
              internal build preserves control, but external partners win when complexity, global regulatory burden, or
              staff scarcity overwhelm in-house teams [CP034][CP039][CP040].
