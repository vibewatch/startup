              India-scale chemistry talent, an unusually explicit peptide-discovery surface, an India-US biologics
              network, and digital tooling that touches discovery, manufacturing, and security
              [CE006][CE015][CE020][CE029][CE039]. That combination is meaningful for buyers wanting one partner from
