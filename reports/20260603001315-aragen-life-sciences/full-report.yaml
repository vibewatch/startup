companyProfile:
  summary: >-
    Aragen Life Sciences is a Hyderabad-based private CRDMO whose legal entity dates to December 2000 and whose
    operating origin traces to GVK BIO in 2001. The company has expanded from discovery informatics into an integrated
    platform spanning discovery, development, and commercial manufacturing across small molecules and biologics, with
    core Indian campuses complemented by a Morgan Hill biologics base in California. Public materials cite 400+
    customers, relationships with 15 of the top 20 large pharma companies, 4,500+ employees, and FY2024-25 revenue of
    ₹1,845.11 crore. Goldman Sachs bought a significant minority stake in 2021, and Quadria Capital invested $100
    million in January 2025 at an approximate $1.4 billion valuation.
  foundedDate: '2000-12-07'
  founders:
