  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed mix
        blocks:
          - type: paragraph
            body: >-
              Aragen’s revenue model is closer to a diversified services portfolio than a single-program biotech bet.
              Official materials show monetization stretching from discovery work sold on FTE and fee-based terms into
              development, commercial API supply, and biologics manufacturing. The FY2024-25 annual report provides an
              unusually usable private-company surface: consolidated revenue reached ₹1,845 crore, EBITDA margin held
              near 26%, the company reported more than 400 customers, and no single customer exceeded 9% of revenue.
              That does not make the mix fully transparent. CRISIL’s FY2023-24 lens still matters because it identifies
              discovery as roughly two-thirds of revenue and biologics as about one-tenth, implying the revenue base
              remains discovery-heavy even as management pushes harder into later-stage manufacturing. The core positive
              for underwriting is that Aragen monetizes multiple handoff points in the molecule lifecycle rather than
              relying on one pricing model or one customer class.
