  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Bengaluru / modality utilisation
        - Current utilisation, booked orders, release metrics, and batch cadence by site and modality.
        - Tests whether biologics and ADC capex really justify a move above the base range.
        - Management + site diligence; request monthly operating dashboard and programme bridge.
      - - Capital structure and leverage
        - Post-Quadria net debt, covenant headroom, and capex funding mix.
        - Determines whether equity value should be benchmarked like a public leader or at a private discount.
        - Finance diligence; obtain latest accounts, debt schedule, and covenant certificates.
      - - Customer durability
        - >-
          Top-10 customer concentration, contract duration, backlog, and revenue transition from discovery to
          manufacturing.
        - Validates whether customer breadth is durable quality rather than just a broad but shallow logo set.
        - Commercial diligence; request cohort analysis and renewal schedule.
      - - IPO / exit path
        - DRHP status, planned offer size, primary-secondary split, and valuation expectations.
        - Affects liquidity support, dilution, and how much of the benchmark can be realised in public markets.
        - Legal + banker diligence; obtain draft filing and shareholder agreements.
      - - Terms and preferences
        - Liquidation waterfall, investor rights, and any asymmetry between new and legacy shareholders.
        - Transforms headline valuation into real underwriting economics for a new investor.
        - Legal diligence; review SHA, side letters, and board-rights package.
    notes: >-
      Every row is tied to a real decision blocker, not generic diligence. Missing answers do not stop chapter
      publication but should stop aggressive pricing.
    claimRefs:
      - CV045
      - CV050
      - CV051
      - CV052
