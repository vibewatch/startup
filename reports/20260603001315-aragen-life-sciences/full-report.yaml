      - number: '2.4'
        title: Growth Drivers and Constraints
        blocks:
          - type: paragraph
            body: >-
              India's positive market narrative is built on several durable drivers: cost advantage, China+1
              supply-chain diversification, rising demand for advanced modalities, a large generic and export base, and
              supportive policy frameworks [CM014][CM015][CM021][CM028][CM029][CM031]. Export and pharma-base data
              matter because they explain why India has the scientific labor pool and regulator-facing credibility to
              win more outsourced work [CM029][CM030]. But the constraints are no longer trivial footnotes. BCG and YCP
              both highlight talent shortages, regulatory complexity, and input dependencies, while KPMG adds pricing
              pressure and import reliance [CM022][CM023][CM032]. The 2026 bearish view pushes further, arguing that
              India may face a reset year if tariffs, reshoring, and slower decision cycles blunt near-term order flow
              [CM026]. The practical conclusion is that the sector still has strong growth odds, but the next winners
              are more likely to be specialized, digitally enabled, and compliance-strong platforms than generic scale
              players [CM024][CM025][CM027][CM035][CM036].
