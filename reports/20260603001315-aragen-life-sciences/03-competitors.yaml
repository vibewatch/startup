    - No list pricing public
    - Flexible business models and 360° lifecycle coverage
    - Patheon page explicitly advertises flexible models
    - Thermo can bundle capabilities into strategic relationships
  - - Recipharm
    - No list pricing public
    - Broad technical menu and partner-led project design
    - Home page and brochure language sell tailored global expertise
    - Technical breadth matters more than public rate transparency
