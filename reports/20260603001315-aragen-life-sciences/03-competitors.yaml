  rows:
  - - Aragen
    - Indian integrated CRDMO
    - 400+ customers; 15/20 top pharma
    - Innovator pharma, biotech, animal health, agrochemical
    - Discovery to commercial small molecules; some biologics support
    - India-based integration plus explicit quality and IP messaging
    - Less disclosed global breadth than Syngene or global incumbents
  - - Syngene
    - Indian listed integrated CRDMO
    - Rs 3,642 Cr FY25; 8,235 workforce
    - Pharma, biotech, nutrition, animal health, specialty chemicals
    - Discovery to commercial; small and large molecules; next-gen modalities
    - Largest Indian public disclosure depth in this set
    - Higher scale and breadth also imply heavier enterprise complexity
  - - Sai
    - Indian listed pure-play CRDMO
    - 280+ customers; 3,400 employees
    - Global innovator pharma and biotech
    - NCE small-molecule discovery to commercial
    - Fast growth, quality and responsiveness messaging, FFS agility
    - Less public evidence of large-molecule breadth than Syngene or Lonza
  - - Piramal Pharma Solutions
    - Global CDMO
    - 4,700+ team; 15 sites; 500+ customers
    - Pharma innovators, biotech, academia
    - End-to-end development and manufacturing across lifecycle
    - Global network and high inspection count
    - Not a pure India-cost CRDMO
  - - Jubilant Biosys / Pharmova
    - India and Europe CRDMO
    - 5 sites; 1,300+ scientists; parent FY26 revenue Rs 8,280 Cr
    - Global pharma and biotech
    - Discovery, early scale-up, GMP transfer; parent also has sterile injectables
    - FFS-led growth and new Noida chemistry hub
    - Official capability pages were not fetchable in this run
  - - Divi’s Laboratories
    - Manufacturing-led custom synthesis and API
    - Top-3 API maker; 100+ countries
    - Big pharma API and custom synthesis buyers
    - Commercial API, intermediates, nutraceuticals, custom synthesis
    - Commercial manufacturing trust and scale
    - Discovery-led breadth is less visible
  - - Laurus Labs
    - Manufacturing-led CDMO and API
    - FY26 revenue Rs 6,813 Cr; CDMO 31% of mix
    - Pharma and custom NCE programs
    - Small-molecule CDMO with bio, ADC, peptide, and fermentation build-out
    - Rapid CDMO mix expansion
    - Heritage remains more manufacturing-led than discovery-led
  - - WuXi AppTec
    - Global integrated CRDMO
    - 38,000 employees; nearly $6B revenue
    - Global pharma, biotech, medtech
