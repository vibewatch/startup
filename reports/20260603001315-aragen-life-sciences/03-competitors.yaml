  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized pricing, FTE or FFS rate cards, minimum batch commitments, and discount structures for Aragen and the closest peer set.
    whyItMatters: Public sites reveal contract models but not commercial terms, so buyers and investors cannot tell whether Aragen wins on price, responsiveness, or scope.
    diligencePath: Request recent quotes, master service agreement templates, and won-lost deal samples for Aragen, Sai, Syngene, and Piramal.
    relatedQuestionRefs:
    - QP015
    - QP016
    - QP025
  - type: private-evidence-only
    severity: material
    topic: switching-cost-benchmarks
    missingEvidence: Program-stage transfer timelines, validation costs, and failure rates when sponsors switch CRDMO partners from discovery into GMP supply.
    whyItMatters: Switching-cost claims are directionally clear, but the exact moat value depends on how expensive and risky transfer is for Aragen’s specific program mix.
    diligencePath: Review technology-transfer case studies, batch-comparability packages, and sponsor references from programs moved on or off Aragen.
    relatedQuestionRefs:
    - QP017
    - QP024
    - QP025
  - type: access-blocked
    severity: minor
    topic: jubilant-official-surfaces
    missingEvidence: A fetchable official Jubilant Biosys or Jubilant Pharmova capability page and downloadable annual report for this run.
    whyItMatters: Official Jubilant pages returned access-rejection responses during this run, so the chapter relies on reputable independent reporting for scale-up and FY26 positioning facts.
    diligencePath: Ask management or IR for the latest capability deck, annual report PDF, and site list, then refetch those direct URLs in the next refresh.
    relatedQuestionRefs:
    - QP007
    - QP024
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by top programs and by top customers across Aragen and key peers.
    whyItMatters: Published customer counts overstate moat if wallet share is concentrated in a handful of volatile programs or one-time scale-up projects.
    diligencePath: Request top-10 customer concentration, cohort retention, and cross-sell expansion data from management and compare it with peer disclosures.
    relatedQuestionRefs:
    - QP004
    - QP024
    - QP025
sections:
- id: landscape-and-direct-peers
  title: Landscape and Direct Indian Peers
  body: 'The closest direct competition to Aragen is not every company that can manufacture an API. It is the narrower set of Indian CRDMOs that can take a small-molecule program from discovery or early development into regulated manufacturing without repeated handoffs. Aragen’s public surface centers on integrated discovery, downstream development, manufacturing, and explicit quality and IP controls, which is the baseline buyers will compare against [CP001][CP002][CP004][CP005]. Syngene sits above Aragen on publicly disclosed scale and modality breadth, while Sai and Jubilant look more like fast-moving execution challengers in fee-for-service and scale-up workflows [CP006][CP008][CP010][CP013][CP022][CP023]. Piramal is broader and more global, but it is also a different class of networked CDMO than a pure India-cost challenger [CP014][CP016]. Divi’s and Laurus belong in the same buying discussion mainly when the sponsor prioritizes manufacturing and custom-synthesis depth over discovery-led
    integration [CP017][CP019][CP020]. The useful landscape, then, is a layered one: Aragen versus India-based integrated peers for most small-molecule programs, versus manufacturing-led Indian alternatives for later-stage supply, and versus global incumbents for the largest or most modality-diverse mandates [CP047][CP048][CP049][CP050].'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
