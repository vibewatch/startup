callouts:
- calloutType: strength
  title: Aragen wins most clearly when buyers want India-based integration without China exposure
  body: The best-supported Aragen wedge is integrated small-molecule work from discovery into manufacturing combined with explicit quality and IP positioning. That is a narrower but cleaner battlefield than trying to out-breadth WuXi, Lonza, or Patheon on every modality.
  claimRefs:
  - CP001
  - CP002
  - CP004
  - CP005
  - CP047
  - CP052
- calloutType: risk
  title: Direct Indian challengers are getting faster, not smaller
  body: Sai and Jubilant are not just adjacent names on a market map. Their public releases show faster fee-for-service, chemistry scale-up, and FY26 expansion momentum, which means Aragen cannot rely on domestic fragmentation to protect discovery-stage share.
  claimRefs:
  - CP013
  - CP014
  - CP022
  - CP023
  - CP024
  - CP049
- calloutType: insight
  title: Competitive diligence must go beyond public pricing because rate cards are not public
  body: Public sources are good enough to map scope, trust signals, and likely buyer fit, but they do not reveal realized pricing, concentration, or transfer economics. The next diligence step has to be quote-level and cohort-level, not just website-level.
  claimRefs:
  - CP037
  - CP040
  - CP042
  - CP053
