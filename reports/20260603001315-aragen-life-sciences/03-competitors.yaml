  title: Pricing / contract model comparison
  columns:
  - Competitor
  - Public pricing disclosure
  - Contract model signal
  - Public evidence
  - Implication
  rows:
  - - Aragen
    - No list pricing public
    - Integrated scope sold via bilateral scoping
