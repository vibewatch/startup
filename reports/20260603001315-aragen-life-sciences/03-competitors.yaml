    - Commercial leverage likely comes from scope and trust rather than transparent tariffs
  - - Syngene
    - No list pricing public
    - Long-term collaborations and integrated supply
    - Investor pages stress collaboration durability and commercial supply
    - Scaled sponsors likely negotiate portfolio or platform contracts
  - - Sai
    - No list pricing public
    - Quality, pricing, responsiveness; end-to-end small-molecule work
