chapter:
  number: 3
  title: Competitors
  summary: Aragen competes most directly with India-based integrated small-molecule CRDMOs such as Syngene, Sai, Piramal, and Jubilant, while WuXi, Lonza, Patheon, Catalent, and Recipharm set the global upper bound on breadth. Public evidence suggests Aragen’s best wedge is India-based integrated execution with explicit quality and IP messaging, but pricing remains opaque and moat durability depends on whether sponsors value that mix more than Syngene or Piramal scale, Sai or Jubilant agility, or the modality depth of global incumbents.
