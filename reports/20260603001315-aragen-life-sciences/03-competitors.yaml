    - Relationship depth matters more than headline price
  - - Jubilant Biosys
    - No list pricing public
    - Fee-for-service discovery and seamless GMP transfer
    - Express Pharma cites FFS demand and Noida scale-up
    - Best fit for programs seeking flexible early-stage chemistry
  - - WuXi
    - No list pricing public
    - End-to-end platform with one quality system
    - Service pages stress integrated global delivery
    - Breadth can outweigh sticker-price sensitivity for complex programs
  - - Catalent
    - No list pricing public
    - Clinical supply and development-through-commercial support
    - Pharma Services page centers on risk reduction and milestone support
    - Late-stage buyers are buying reliability and supply continuity
