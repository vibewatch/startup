  - FP002
- id: pricing-trust-and-switching-costs
  title: Pricing, Trust, and Switching Costs
  body: 'Pricing is the least transparent part of the market. None of the main official surfaces reviewed for Aragen, Syngene, Sai, Piramal, WuXi, Catalent, Patheon, or Recipharm publishes a simple list-price menu that a buyer can compare line by line, so procurement remains quote-based and negotiated [CP037]. Public evidence instead signals contract style. Sai talks in terms of quality, pricing, responsiveness, and end-to-end work; Jubilant explicitly highlights fee-for-service demand and seamless transfer into GMP facilities; Piramal and Catalent emphasize integrated projects and clinical-supply execution; Patheon stresses flexible business models and coordinated lifecycle support [CP012][CP015][CP022][CP030][CP031][CP038]. That lack of public price transparency raises the importance of trust. Industry sources say sponsors now favor integrated partners for speed and scalability, and that the real decision criteria are familiarity, quality systems, regulatory performance, and delivery reliability
    rather than posted tariffs [CP035][CP036]. Those same dynamics create switching costs: internal build preserves control, but external partners win when complexity, global regulatory burden, or staff scarcity overwhelm in-house teams [CP034][CP039][CP040].'
  claimRefs:
  - CP012
  - CP015
  - CP022
  - CP030
  - CP031
  - CP034
  - CP035
  - CP036
  - CP037
  - CP038
  - CP039
  - CP040
  - CP041
  - CP042
  tableRefs:
  - TP003
  figureRefs:
  - FP003
- id: moat-durability-and-substitutes
  title: Moat Durability and Substitutes
  body: 'The moat question is therefore less about a single unbeatable feature and more about which trade-off a buyer dislikes least. Aragen’s strongest durable position is an India-based integrated small-molecule stack wrapped in explicit quality and IP messaging, which matters for sponsors that want one partner but do not want China geopolitical risk or a Western cost base [CP047][CP052]. That moat is real but not impregnable. Sai and Jubilant are pushing harder on fast-turn discovery, FFS execution, and chemistry scale-up, while Syngene and Piramal remain better-disclosed and larger public peers [CP013][CP022][CP024][CP048][CP049]. Manufacturing-led players such as Divi’s and Laurus can still win late-stage or custom-synthesis-heavy work even if they are not discovery-first substitutes [CP017][CP020][CP021][CP050]. The adverse evidence reinforces both opportunity and risk. WuXi scrutiny appears to be redirecting demand toward Indian vendors, but it also shows how deeply embedded large
    CRDMOs can become and how painful transfer can be once programs mature [CP041][CP042][CP043][CP044]. Catalent’s warning letter is the opposite lesson: a trusted brand can lose credibility quickly when quality systems fail [CP045][CP046].'
  claimRefs:
  - CP017
  - CP020
  - CP021
  - CP041
