  topStrengths:
    - >-
      Integrated discovery-to-commercial platform across small molecules and biologics, with credible breadth across
      Hyderabad, Bengaluru, and Morgan Hill.
    - >-
      Public disclosure is better than many private CRDMOs: FY2024-25 revenue was ₹1,845.11 crore with 25.9% EBITDA
      margin and no single customer above 9% of revenue.
    - >-
      Customer proof is broad enough to matter, including 400+ customers, 15 of the top 20 pharma companies, and repeat
      Morgan Hill-to-Bengaluru biologics transfers.
  topRisks:
    - >-
      Regulatory and quality overhang persists because the legacy EMA/GVK history still matters and the January 2026 FDA
      Form 483 details are not public.
    - >-
      Bengaluru biologics and newer-modality expansion still need utilization, batch-success, and margin proof while
      annual capex remains around ₹400 crore and partly debt-funded.
    - >-
      Public data are still thin on top-customer concentration, retention, net debt, covenants, and cap-table terms,
      limiting conviction at the last-round benchmark.
  unresolvedGaps:
    - The January 2026 FDA Form 483 text, remediation package, CAPA ownership, and follow-up inspection status.
    - Bengaluru utilization, batch cadence, first-pass quality, and site-level gross-margin bridge.
    - Top-10 customer concentration, renewal cadence, contract duration, and pilot-to-scale conversion data.
    - Post-Quadria cash, net debt, covenant headroom, shareholder rights, and IPO-readiness materials.
