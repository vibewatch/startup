callouts:
- calloutType: strength
  title: Breadth is real, especially where chemistry and early GMP connect
  body: The strongest verified edge is not one molecule class by itself but the combination of deep chemistry, a detailed peptide-discovery surface, and a newly qualified Bangalore biologics suite under one CRDMO umbrella.
  claimRefs:
  - CE001
  - CE015
  - CE029
  - CE032
- calloutType: insight
  title: Digital claims are unusually specific for a private CRDMO
  body: Aragen names concrete systems—InCoRe, Golden Batch Analytics, SciGenie, MES or e-BMR workflows, and explicit cyber controls—rather than relying only on generic AI marketing language.
  claimRefs:
  - CE010
  - CE013
  - CE014
  - CE038
  - CE039
  - CE044
- calloutType: risk
  title: Late-stage proof still lags the breadth of the menu
  body: Public evidence is thin for GMP oligonucleotide depth, routine post-start validation of Bangalore biologics operations, and external proof behind some digital-value claims, so diligence should not treat every modality cell as equally mature.
  claimRefs:
  - CE041
  - CE042
  - CE043
