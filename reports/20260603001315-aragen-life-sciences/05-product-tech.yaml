- id: FE001
  title: Aragen product architecture map
  type: stack
  summary: Aragen’s public stack runs from discovery services through CMC and GMP, with digital and trust controls acting as enabling rails.
  data:
    layers:
    - label: Customer outcome layer
      detail: Outsource hit finding, CMC handoff, or early GMP supply to a single CRDMO partner rather than stitching together multiple vendors.
    - label: Discovery layer
      detail: Integrated drug discovery, chemistry, biology, biosafety, and computational design for small-molecule programs.
    - label: Modality layer
      detail: Oligonucleotide chemistry, PeptARx peptide discovery, conjugates, and biologics discovery or cell-line services extend the menu beyond standard med-chem.
    - label: Development layer
      detail: Drug substance, drug product, analytical development, QbD, particle engineering, and process development bridge discovery into CMC.
    - label: Manufacturing layer
      detail: Commercial APIs, clinical-batch formulations, and Bangalore biologics GMP manufacturing provide the later-stage execution surface.
    - label: Enabling rails
      detail: InCoRe, computational tools, Golden Batch Analytics, QMS workflows, and cyber or IP controls support execution across the stack.
