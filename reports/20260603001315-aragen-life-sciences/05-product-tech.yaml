- id: differentiators-roadmap-and-risks
  title: Technical differentiation, roadmap, and remaining product-tech risk
  body: 'The differentiation case rests on integration rather than a single proprietary product. Aragen combines India-scale chemistry talent, an unusually explicit peptide-discovery surface, an India-US biologics network, and digital tooling that touches discovery, manufacturing, and security [CE006][CE015][CE020][CE029][CE039]. That combination is meaningful for buyers wanting one partner from hit generation through CMC and early GMP [CE001][CE023][CE029]. Still, the public record flags limits. A 2024 interview implied Bangalore biologics manufacturing would arrive sooner than the later official July 2025 GMP start, so execution timing has not been frictionless [CE042]. Likewise, the Quadria-backed roadmap to deepen oligos, peptides, ADCs, and AI or ML is credible but still expansion-stage rather than fully evidenced installed capacity [CE043]. Finally, the clearest public practitioner signal is hiring for AI-product, cheminformatics, data-pipeline, and DevOps work rather than independent
    customer references, so some of the digital edge still rests on internal build-out rather than external proof [CE044]. Unknowns should be called out directly instead of assumed away: public evidence still does not show dedicated GMP oligo detail or routine post-start external validation for Bangalore biologics [CE041][CE042][CE043].'
  claimRefs:
  - CE001
