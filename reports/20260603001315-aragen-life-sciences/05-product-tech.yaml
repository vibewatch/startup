- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - Aragen solution
  - Public benefit marker
  - Limitation / unknown
  rows:
  - - Advance a small-molecule program from hit to IND
    - Discovery, CMC, and supply steps often sit with multiple vendors
    - Integrated discovery plus development, DS, DP, and commercial manufacturing
    - Official DS+DP page markets a 10-to-12 month dossier path
    - Time gain is company-claimed rather than independently benchmarked
  - - Pressure-test a peptide lead quickly
    - Peptide chemistry, biology, and DMPK are often siloed
    - PeptARx integrates synthesis, screening, and DMPK under one roof
    - Official page says viable-path decisions should happen in weeks, not months
    - Public proof stops at discovery and non-GMP scale
  - - Move a biologics program from clone to clinical GMP
    - Tech transfer across multiple CDMOs can fragment development
    - Morgan Hill discovery and Bangalore GMP are presented as one in-house network
    - Official and trade sources point to in-house CLD, process, QC, and GMP handoff
    - Commercial launch history and post-start external validation remain sparse
  - - Produce clinical drug product in-house
    - Many CRDMOs offer API work but not in-house clinical drug product
    - Formulations facility now has Telangana DCA GMP for multiple dosage forms
    - Certification covers oral solids, liquids, topicals, and films
    - Public sources do not show commercial-volume drug-product supply
  - - Improve manufacturing yield and process control
    - CPP analysis can be slow and manual
    - Golden Batch Analytics applies ML to historical batch data
    - Official page claims 3% to 5% yield lift on repetitive batches
    - No named product or customer case study is public
  notes: Benefits are recorded only where a source discloses them; otherwise the table uses process description and marks the evidence gap directly.
