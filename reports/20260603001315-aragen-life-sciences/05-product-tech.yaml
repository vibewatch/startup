    - Quadria-backed capex earmarked for oligos, peptides, ADCs, biologics, and AI or ML
    - Announced
    - Supports modality-breadth roadmap more than already-installed proof
    - Trade coverage of the fundraise [CE043]
  - - Still open
    - Independent post-start validation for Bangalore GMP suite and dedicated GMP oligo proof
    - Unresolved
    - Keeps part of the roadmap and quality case in diligence territory
    - WHO scope limit and missing-source gaps [CE041][CE042]
  notes: Where the public timeline changed, the table records both the earlier projection and the later achieved milestone instead of smoothing the difference away.
