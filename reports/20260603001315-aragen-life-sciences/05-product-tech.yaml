sections:
- id: capability-surface
  title: Verified capability surface and customer workflow
  body: 'Aragen’s public product surface is broad for a private CRDMO. The company presents one continuum across small-molecule discovery, small-molecule development and manufacturing, formulations, peptide discovery, oligonucleotide chemistry, and biologics rather than a set of isolated brochures. On the discovery side, the base workflow combines integrated drug discovery, chemistry, biology, and biosafety, while the chemistry pages extend into oligonucleotides, peptides, PROTAC-adjacent chemistry, macrocycles, and other specialty work [CE001][CE002][CE003][CE004][CE005]. The peptide surface is unusually explicit: PeptARx packages chemistry, screening, and DMPK under one roof, and the custom-synthesis and conjugate pages show support for PNAs, peptide-oligonucleotide constructs, PPMOs, DOTA-labelled molecules, and other complex designs [CE015][CE018][CE020]. The main caveat is maturity asymmetry. Public evidence is strongest for discovery and non-GMP peptide work, solid for small-molecule
    CMC, and improving for biologics GMP; dedicated public proof for GMP oligonucleotide manufacturing remains absent, so those cells should be treated as partially verified rather than fully de-risked current capability [CE021][CE029][CE041].'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE015
  - CE018
  - CE020
  - CE021
  - CE029
  - CE041
