  - FE002
- id: digital-operating-architecture
  title: Digital and operating architecture
  body: 'Aragen’s enabling architecture is less a single software platform than a stack of workflow-specific systems connecting discovery, manufacturing, and compliance. In discovery, InCoRe is positioned as the connective tissue for DMTA cycle management, customer data sharing, and chemistry-biology collaboration, while the computational group cites Schrodinger, Cresset, SARvision, DataWarrior, homology modelling, cryptic-pocket analysis, and molecular-dynamics simulation to guide design [CE007][CE008][CE010]. In execution, Aragen says robotic compound handling and assay automation reduce manual data handling by 20% to 40%, and Smartsheet is used for portfolio visibility and OTIF risk monitoring [CE009][CE011][CE012]. On the plant side, Golden Batch Analytics is the clearest quantified AI claim: Aragen says batch-history models identify CPPs and can lift repetitive-batch yields by 3% to 5% [CE013][CE027]. The limitation is external verification. These are specific operational claims, but
    public customer case studies, benchmark data, or named deployments remain sparse, so the digital layer looks directionally differentiated yet still mostly company-asserted [CE014][CE043][CE044].'
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE027
  - CE043
  - CE044
  tableRefs:
  - TE003
  figureRefs: []
- id: facilities-quality-and-security
  title: Facilities, quality, and trust controls
  body: 'Facility readiness is strongest where Aragen can point to named assets and regulator-facing milestones. Small molecules already span drug substance, drug product, analytical development, and commercial API manufacturing, with co-located R&D, pilot, and commercial assets designed to keep tech transfer in-house [CE021][CE022][CE025][CE026]. For biologics, the network now pairs Morgan Hill’s discovery and non-GMP base with Bangalore’s GMP suite, and public sources converge on 50 L to 2,000 L current scale, 5,000 L expansion intent, intensified fed-batch operations, and first GMP batches in late July 2025 [CE029][CE031][CE032][CE033][CE034]. Drug-product readiness also improved when the formulations manufacturing facility obtained Telangana DCA GMP certification for clinical batches across oral solids, liquids, topicals, and films [CE035]. Quality posture is documented but partly self-referential: Aragen describes enterprise QMS, broad audit exposure, digital QA systems, and extensive
    IP and cyber controls, while the WHO 2023 API inspection provides the most concrete external compliance artifact and shows both acceptable GMP status and the limits of public inspection coverage [CE036][CE037][CE038][CE039][CE040][CE041].'
  claimRefs:
  - CE021
  - CE022
  - CE025
  - CE026
  - CE029
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
