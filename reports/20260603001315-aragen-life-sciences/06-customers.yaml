  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 account share, largest-customer share, and revenue concentration by customer tier or modality are not publicly disclosed.
    whyItMatters: Customer breadth sounds strong, but without account concentration the downside from one large biotech or pharma cutback cannot be underwritten.
    diligencePath: Request the current top-10 customer list with revenue share, tenure, modality, geography, and renewal status.
    relatedQuestionRefs:
    - QU027
    - QU028
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: No public NRR, GRR, churn, contract-length, or cohort-retention dataset was found for customers by segment.
    whyItMatters: Qualitative satisfaction is helpful, but renewal math is the cleanest test of account durability and expansion quality.
    diligencePath: Ask management for quarterly gross retention, net retention, logo churn, average contract term, and cohort renewal bridges for large pharma and biotech separately.
    relatedQuestionRefs:
    - QU021
    - QU028
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: The named customer roster is clearly a sample of public wins rather than an exhaustive list of active production customers.
    whyItMatters: Public confidentiality norms mean the named proof set likely understates real deployment depth, but it also limits external verification of breadth.
    diligencePath: Request a referenceable customer list by segment with stage, geography, and whether each account is pilot, recurring development, or commercial supply.
    relatedQuestionRefs:
    - QU003
    - QU018
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: buyer-segmentation-denominator
    missingEvidence: Public materials do not provide active customer counts by large pharma, biotech, agrochemical, academic, vaccine, or region.
    whyItMatters: Without segment denominators it is hard to tell whether named proof is representative or skewed toward marketing-friendly edge cases.
    diligencePath: Request the live customer book by buyer type, active program count, and revenue mix for the last twelve months.
    relatedQuestionRefs:
    - QU001
    - QU003
    - QU004
    relatedTableRefs:
    - TU001
  - type: missing-source
    severity: material
    topic: sales-cycle-cohort
    missingEvidence: Pilot-to-follow-on conversion rates, time-to-first-expansion, and win rates by customer segment are not publicly disclosed.
    whyItMatters: The qualitative pilot-to-follow-on story is encouraging, but underwriters still need conversion math to judge sales efficiency and concentration risk.
    diligencePath: Ask for funnel conversion by buyer type from first scope to pilot, pilot to master service agreement, and pilot to multi-program expansion.
    relatedQuestionRefs:
    - QU017
    - QU026
    relatedTableRefs:
    - TU006
sections:
- id: customer-mix-buyer-base
  title: Customer mix and buyer base
  body: 'Public customer breadth is credible, but the count is disclosed as a range rather than as one audited current figure. Independent and company-linked sources consistently place Aragen above 400 customers, while some collaboration releases still use over 450, so the safe read is a 400-450+ global base depending on source vintage. The mix is not limited to human therapeutics: reviewed sources show large pharma, biotech, agrochemical, animal-health, vaccine, academic, and diagnostic-type buyers. Independent reporting also shows the base is regionally skewed. BioProcess International described demand as predominantly Western big pharma, biotech, and animal health with a growing Asian base, while Digital Health News said the US contributes about 65% of revenue and Europe about 25%. That combination supports a broad buyer roster but also a geographically concentrated demand base. Anonymous Aragen Bioscience testimonials widen buyer-type coverage, yet named proof comes mainly from FMC,
    Serum, UTS, FAR, and Renaissance.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU005
  - CU006
  - CU007
  - CU008
  - CU020
  - CU045
  - CU046
  tableRefs:
  - TU001
- id: named-proof-sales-motion
  title: Named customer proof and sales motion
  body: 'Named proof is strongest when Aragen is part of an integrated program rather than a narrow fee-for-service task. FMC is the clearest long-duration non-pharma proof point: both Aragen and FMC describe a several-year relationship that was formalized into a broader multi-year strategic partnership spanning discovery chemistry, biology, and process development. FAR, Serum, Oragenics, and UTS broaden buyer-type coverage across early discovery, vaccine development, and academic-startup enablement. The strongest production-grade evidence sits with Renaissance Pharma, where Aragen transferred Daretabart from Morgan Hill development into Bengaluru commercial-scale GMP in nine months and external trade press repeated the same sequence. Sales motion also looks modular-to-integrated. BioProcess and Avid described buyers explicitly asking for bundled cell-line, process, pilot, and cGMP work, while Pharma Manufacturing said customers new to Indian outsourcing often started with pilot projects
    before moving to follow-on work. That pattern supports a land-and-expand model, but public funnel math is still absent.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU014
  - CU016
  - CU017
  - CU018
  - CU019
