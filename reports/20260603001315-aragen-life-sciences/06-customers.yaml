  figureRefs:
  - FU001
  - FU002
- id: durability-expansion-evidence
  title: Durability and expansion evidence
  body: 'Durability evidence is meaningful but mostly qualitative. The best hard proxy is repeat transfer behavior in biologics: Renaissance was described as the sixth program moving from Morgan Hill development into Bengaluru clinical or commercial supply, and Aragen separately said the first three commercial Bangalore orders originated from California teams. Those signals imply that once Aragen wins early biologics work, it can retain the program into later stages. Frost & Sullivan adds a broader but softer signal: the award write-up explicitly credited Aragen’s customer-value model with improved customer retention and an expanded base, and highlighted feedback-driven product managers, transparency, and flexible service delivery. Pharma Manufacturing supplied another commercial proxy by reporting pilot projects that were already turning into follow-on work. What remains missing is the quantitative renewal layer. No public source reviewed disclosed NRR, GRR, churn, contract length, or cohort
    retention by large pharma versus biotech, so durability still rests on case-study depth, buyer quotes, and transfer continuity rather than on a renewal dashboard.'
  claimRefs:
  - CU025
  - CU026
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU043
  - CU046
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: concentration-and-adverse-signals
  title: Concentration and adverse signals
  body: 'The adverse read is less about obvious churn and more about what public disclosure still omits. Aragen’s 2025 customer commentary said biotech funding was stabilizing but uneven, and that discovery funding remained thinner than pre-2022 levels. Pharma Manufacturing also described two years of post-COVID slump conditions and a market where customers often test the water with pilots before scaling. That matters because the publicly visible base is concentrated where the budgets sit: Digital Health News said about 90% of revenue comes from the US and Europe, and Business Today said 15 of the top 20 global pharma companies are customers while many are actively rebalancing China exposure into India. Those are useful quality signals, but they also mean macro pauses by Western innovators could hit demand disproportionately. Public sources still do not disclose top-customer revenue share, top-10 account tenure, or numeric renewals, and Business Today separately flagged quality-and-compliance
    discipline at scale as a strategic risk as more biologics work shifts to India.'
  claimRefs:
