figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public evidence suggests Aragen often wins scoped work first, then expands accounts into integrated and later-stage delivery.
  data:
    nodes:
    - label: Buyer identifies capability gap
      detail: Need appears in discovery, cell-line, process, or GMP supply; buyers increasingly want one partner that can span multiple stages.
      tone: neutral
    - label: Scoped pilot / module
      detail: New-to-India customers often start with a pilot or limited-scope program to test execution quality and speed.
      tone: warning
    - label: Integrated execution proves fit
      detail: Aragen links discovery, development, analytics, or partner-enabled manufacturing into one operating path.
      tone: positive
    - label: Expansion into follow-on work
      detail: Pilot projects convert into follow-on work and can widen from one workstream into multiple programs or broader scope.
      tone: positive
    - label: Tech transfer / later-stage supply
      detail: In biologics, Morgan Hill-originated programs can move into Bengaluru GMP manufacturing when the program matures.
      tone: neutral
    - label: Multi-program / long-term relationship
      detail: Several-year FMC work, repeated Morgan Hill-to-Bengaluru transfers, and Frost retention commentary imply durable account expansion when execution is strong.
      tone: positive
  approximationNotes: Stages are inferred from named customer examples and trade-press descriptions of Aragen’s land-and-expand motion; public sources do not disclose a formal CRM funnel.
