  rows:
  - - Large pharma
    - Top-20 pharma cohort; Renaissance
    - R&D, CMC, and biologics procurement teams
    - Integrated discovery, development, and commercial biologics supply
    - 15 of top 20 pharma in 2025-2026 reporting; 17 large-cap firms in 2024 interview
    - Validates quality bar and supports larger program sizes
    - No top-customer share or active-account denominator
  - - Emerging biotech
    - FAR Biotech; Aragen Bioscience testimonials
    - CSO and discovery leaders, assay and animal-study users
    - Integrated drug discovery, biologics discovery, preclinical support
    - BioProcess described a predominantly Western biotech base; pilot-to-follow-on motion is public
    - Growth engine for early programs and integrated discovery
    - No live biotech-customer count or cohort conversion by stage
  - - Agrochemical / crop science
    - FMC Corporation
    - Crop-science R&D leadership
    - Discovery chemistry, biology, and process development for agrochemical pipeline
    - Named several-year relationship formalized into a multi-year partnership
    - Diversifies demand beyond human therapeutics
    - No contract value, term, or share of total revenue
  - - Vaccine / public-health biologics
    - Serum Institute; Oragenics
    - Vaccine and translational biologics teams
    - Stable cell lines, HIV antibodies, and COVID vaccine cell-line development
    - Named collaborations show biologics platform relevance outside classic pharma
    - Extends proof into public-health and vaccine buyers
    - Commercial outcomes and recurring revenue not disclosed
  - - Academic / startup enablement
    - University of Technology Sydney
    - Research communities and startups needing biologics support
    - Expression technology plus downstream clinical-development access
    - Publicly framed as an Australian startup-enablement route
    - Creates feeder channel into early biologics programs
    - Converted customer count or revenue not disclosed
  - - Diagnostics / animal health / immunotherapy
    - Aragen Bioscience testimonials; Meditope Biosciences
    - Preclinical study sponsors and assay users
    - Animal studies, assay setup, purification, molecule expression
    - Public proof is mostly testimonial rather than named program milestone
    - Shows breadth of buyer archetypes at the Bay Area biologics unit
    - Deployment depth and retention remain unclear
