  title: Customers
  summary: 'Public evidence supports a broad and credible Aragen customer base across large pharma, biotech, agrochemical, vaccine, academic, and partner-led biologics routes, with the strongest named proof coming from FMC, Serum, UTS, FAR, Avid, and especially Renaissance Pharma. The clearest durability signals are qualitative—pilot-to-follow-on conversion, repeated Morgan Hill-to-Bengaluru biologics transfers, and Frost’s customer-retention commentary—while hard renewal and concentration metrics remain undisclosed. Net: customer breadth looks real and strategically valuable, but concentration and renewal underwriting still require management-only data.'
