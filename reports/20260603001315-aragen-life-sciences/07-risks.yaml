    {
      "id": "mitigations-monitoring-and-kill-criteria",
      "title": "Mitigations, monitoring, and kill criteria",
      "body": "Aragen does have real mitigation surfaces. Publicly visible quality governance, third-party and regulatory audit traces, a broader customer base than many private peers, fresh equity capital, and a dual-continent biologics model all reduce the chance that one bad event automatically breaks the story. But they do not eliminate residual risk. The highest-value diligence work now is not more generic market sizing; it is obtaining the evidence that public sources cannot provide. Management should be able to produce the 2026 Form 483 and closure package, explain how California-to-Bangalore tech transfers are performing on yield and release, quantify top-5 and top-10 customer concentration plus contract duration, and show whether biologics utilization and margin are scaling fast enough to justify the capex program. Until those monitorable thresholds are clarified, kill criteria should stay tight. Any sign of unresolved FDA observations, a stalled Bangalore ramp, renewed pilot-heavy customer mix, weakening order flow from Western large pharma, or leverage creeping up without matching throughput should move the recommendation toward caution. The chapter therefore closes with a manageable-but-material risk posture: Aragen has enough proof to stay investable, but not enough disclosure to treat execution risk as solved.",
