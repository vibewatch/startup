  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Aragen's main residual risks are not demand absence but execution slippage as it scales new biologics and advanced-modality capacity into a heavily regulated, geopolitically influenced outsourcing market. Public evidence shows meaningful mitigations—quality systems, fresh equity, customer breadth, and regulatory history that is mixed rather than catastrophic—but the risk stack still clusters around quality/compliance discipline, customer and policy concentration, capex and leverage, and whether the Bangalore ramp converts pilots into durable, profitable volume."
  },
  "sections": [
    {
      "id": "regulatory-legal-and-compliance-risk",
      "title": "Regulatory, legal, and compliance risk",
      "body": "Aragen's legal and compliance surface is strongest where the record is mixed rather than clean. The company can point to current quality-system messaging, a WHO public inspection report that found acceptable GMP compliance at the inspected API site, and a public claim that its most recent USFDA audit closed with no observations. But the same public record still forces caution. EMA's GVK Biosciences referral remains a real legacy scar: European authorities upheld suspension recommendations after identifying systematic ECG data manipulation at the Hyderabad site used for generic-drug studies. More recently, a 2026 Form 483 metadata listing indicates fresh inspection observations exist even though the observation text and remediation are not public. Legal exposure is also non-zero. PACERMonitor shows an arbitration-related federal case involving Aragen entities in California that required temporary restraining-order proceedings before dismissal, while an Indian tax tribunal order confirms that public legal history still exists in ordinary course. The right underwriting posture is therefore not “assume failure,” but “assume diligence is mandatory until management produces the 483, remediation trail, and fuller litigation context.”",
