companyProfile:
  summary: >-
    Flourish is a New York-based neuro-AI startup pursuing Cortex AI, a brain-inspired architecture intended to approach
    human-level intelligence with much lower power consumption. The company has assembled a high-credibility founding
    story around Thomas Reardon's Microsoft and CTRL-Labs track record, Rob Williams's Amazon operating background, and
    a June 2026 financing reportedly led by Jeff Bezos with Lux Capital, GV, and Catalio. However, Flourish remains a
    research organization rather than a commercial vendor: it has no disclosed product, no public customer roster, no
    reported revenue, and no public technical benchmark package, leaving underwriting dependent on team quality and
    thesis credibility rather than operating evidence.
