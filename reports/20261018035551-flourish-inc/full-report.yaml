      - number: '5.1'
        title: Product definition and maturity
        blocks:
          - type: paragraph
            body: >-
              Public reporting is consistent that Flourish is not selling a commercial platform today; it is funding a
              multiyear effort to build Cortex AI as a low-power, continuously learning alternative to transformer-heavy
              systems. The near-term product story is a staged one rather than a launch: the company says it is
              developing releasable intermediate models while using a much larger research program to hunt for a more
              fundamental architectural breakthrough. That makes the current diligence task less about feature
              completeness and more about whether the stated modules, workflow, and deployment path are specific enough
              to support the technical thesis without over-crediting roadmap claims.
