  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitute paths
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than "other neuro-AI startups." A buyer or investor looking for
              lower-cost intelligence can stay with the current transformer-and-GPU stack, adopt incumbent product
              surfaces such as Google DeepMind's Project Astra, back hardware-centric alternatives with stronger
              disclosure, or wait for a science-heavy architecture reset. Flourish's pitch is unusually ambitious
              because it does not promise an incrementally better model on current rails; it promises a new architecture
              that could move the power curve by an order of magnitude. That creates upside if the technical thesis
              works, but it also means the practical substitute today is the status quo rather than another public
              company selling the same thing.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP009
              - CP010
              - CP014
