      - number: '6.3'
        title: Durability and concentration remain thesis-driven because the first channel is still unnamed
        blocks:
          - type: paragraph
            body: >-
              Flourish's public narrative suggests two possible durability levers: differentiated low-power performance
              and strategic distribution through silicon or device partners. Neither is yet demonstrated in customer
              evidence. The Loihi 2 state-space-model paper shows that neuromorphic-style token processing can achieve
              large energy and latency improvements on benchmark tasks, which helps explain why Flourish is pursuing
              on-device and low-power use cases, but that benchmark is not a Flourish result or a customer validation
              event. At the same time, Wired's skeptical adviser quote and the company's own multi-year horizon
              underscore that expansion economics, renewal quality, and concentration risk cannot be verified yet. Even
              basic reference discovery is noisy: an unrelated Tennessee nonprofit appears in exact-name searches for
              Flourish Inc., which adds friction when tracing public records or procurement evidence.
            claimRefs:
