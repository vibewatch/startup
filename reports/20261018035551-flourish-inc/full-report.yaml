      - number: '5.3'
        title: Controls, deployment, and risk
        blocks:
          - type: paragraph
            body: >-
              The core risk is that the public narrative is ahead of the public proof. Flourish has described a
              major-chipmaker discussion, a path to pocket-sized devices, and a five-year horizon for a deeper
              architectural breakthrough, but the retained evidence does not yet show named partners, benchmark deltas
              versus transformer baselines, or disclosed product-security and governance controls. That matters because
              the likely commercialization paths for a general-purpose AI stack will eventually require more than
              scientific novelty: they will require operating robustness, documentation, and compliance discipline,
              especially if the technology reaches regulated or safety-sensitive deployments. Today those controls
              should be treated as open diligence items, not as established capabilities.
            claimRefs:
