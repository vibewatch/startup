      - number: '4.2'
        title: Cost structure is easier to infer than unit economics
        blocks:
          - type: paragraph
            body: >-
              Public evidence is much stronger on Flourish's capital intensity than on its future unit economics. The
              company is funding a research-heavy build: Wired reported around two dozen neuroscientists and AI
              researchers, a New York office with a built-in data center, and contemplated multimillion-dollar
              microscopy purchases. The upside case depends on a large energy-efficiency claim—roughly 20 to 50 watts
              instead of GPU-cluster scale power draw—but retained benchmark sources also warn that public model-compute
              estimates remain approximate, which limits how far an outsider can convert those claims into gross-margin
              or training-cost underwriting today. Market demand for neuromorphic and edge AI appears substantial, yet
              any European go-to-market path could still inherit GPAI transparency duties and, for regulated use cases,
              future high-risk compliance costs.
            claimRefs:
