  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the problem Flourish is trying to solve
        blocks:
          - type: paragraph
            body: |-
              The assigned evidence supports a tight market definition: Flourish is not pursuing
              a broad "all AI" opportunity, and it is not competing as a chip vendor, model
              hosting platform, or clinical brain-computer-interface company. Instead, its pitch
              sits at the architecture layer of AI efficiency, where buyers would pay for lower
              training and inference energy draw, less infrastructure strain, and potentially more
              continuous-learning capability without waiting for a new hardware generation. That
              boundary matters because it narrows the relevant spend pool to organizations already
              absorbing frontier-model infrastructure costs or trying to deploy powerful models
              under severe energy, cooling, or compliance constraints. The public record therefore
              supports a market thesis around compute-constrained AI development and deployment,
              not a generic software TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM012
