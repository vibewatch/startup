  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and operating thesis
        blocks:
          - type: paragraph
            body: >-
              Flourish is presented in independent coverage as a New York artificial-intelligence startup building
              Cortex AI around connectomics and other brain-inspired design principles rather than standard transformer
              scaling alone. The retained reporting consistently frames the business as pre-product and research-led:
              public evidence describes a lab seeking step-change energy efficiency and continuous learning, not a
              company with visible revenue, customers, or shipping software. That makes identity unusually clear while
              commercialization remains unusually opaque for a company already carrying a multi-billion-dollar paper
              valuation.
