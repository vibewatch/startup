          - type: paragraph
            body: >-
              The capital raise is the single clearest current fact pattern. Multiple retained reports say Flourish
              closed roughly $500 million at a $2.5 billion valuation in early June 2026, with Jeff Bezos writing about
              $100 million and Lux Capital, GV, and Catalio also participating. That syndicate is strategically
              important because it substitutes for missing traction evidence: the round is being sold to the market as a
              thesis and founder bet. Diligence therefore has to focus less on the headline amount and more on round
