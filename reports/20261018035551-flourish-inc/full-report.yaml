      - number: '2.2'
        title: Likely buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: |-
              Because Flourish's thesis is tied to infrastructure efficiency, the most plausible
              early customers are not small application teams but actors that already control large
              model-development or deployment budgets. The evidence points first to frontier labs
              and hyperscaler-style model platforms, where training-compute growth, training-cost
              inflation, and data-center scale are material enough to justify architecture-level
              experimentation. A second potential segment is regulated enterprise AI deployment,
              where an efficiency gain matters only if the model can also fit governance and
              assurance requirements. In that frame, the buyer is likely an R&D or platform leader,
              the user is a research or model-operations team, and the payer sits in infrastructure,
              platform, or transformation budgets rather than line-of-business SaaS spend. What the
              evidence does not show is an existing commercial motion for Flourish itself: the
              company remains pre-product, and no public pilot, pricing, or design-partner evidence
              appears in the assigned pool.
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM013
      - number: '2.3'
        title: Adoption drivers, constraints, and what public sizing still cannot prove
        blocks:
          - type: paragraph
            body: |-
              The supporting evidence shows a credible demand driver: frontier AI economics are
              being pushed by rapidly rising compute use, increasing training cost, and physical
              data-center scale. That creates room for a differentiated architecture thesis if
              Flourish can demonstrate real efficiency gains. The same evidence also highlights why
              adoption could be slow. Governance is tightening as AI deployment spreads, so buyers
              in regulated or high-risk settings cannot adopt a novel architecture on efficiency
              claims alone; they also need assurance around compliance, documentation, and model
              behavior. More importantly, the current public record does not support a defensible
              TAM/SAM/SOM ladder. It supports pressure lenses and buyer hypotheses, but not revenue
              forecasts, share assumptions, or a credible near-term SOM. Until Flourish publishes
              benchmark evidence, customer proof, or a commercial contract model, the market case
              remains strategically interesting but commercially under-specified.
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM009
              - CM011
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial pull remains unproven
            body: >-
              The assigned evidence validates the infrastructure pain point, but not yet a buying signal for Flourish
              itself. Public sources still describe a research lab with no product, no published benchmark, and no
              public pilot or pricing evidence, so the near-term opportunity is materially narrower than a headline
              AI-market narrative.
            calloutType: risk
            claimRefs:
