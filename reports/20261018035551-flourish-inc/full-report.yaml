      - number: '5.2'
        title: Operating model and differentiation
        blocks:
          - type: paragraph
            body: >-
              Flourish's differentiator is not a documented production stack; it is an operating model that couples
              expensive biological measurement with algorithm design. Wired describes neuroscientists and AI researchers
              working side by side, with microscopy, connectomics, and cortical-column studies intended to constrain
              what the model team builds next. The most supportable contrast with the broader neuromorphic field is
              therefore methodological: many public peers are shipping specialized silicon for narrow edge workloads,
              while Flourish says it wants algorithmic efficiency that could eventually run on more conventional
              hardware. That is differentiated, but it also means the company must prove that the neuroscience loop
              yields deployable model gains rather than only interesting research.
