        title: Capability, distribution, and pricing evidence
        blocks:
          - type: paragraph
            body: >-
              The evidence gap is not whether alternatives exist; it is whether Flourish can dislodge them before it has
              a public product. Project Astra already points to a buyer-visible assistant surface inside Gemini Live,
              Search, and future devices, while Cerebras has enough disclosure maturity to show up in SEC registration
              records. By contrast, Flourish is still described as a research lab without public pricing, customer
              proof, or a benchmarked commercial artifact. That makes current comparisons less about feature parity and
              more about who has a productized route to market versus who has a high-upside architecture thesis.
