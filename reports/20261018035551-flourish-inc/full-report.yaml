      - number: '3.3'
        title: Durability, switching cost, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The moat case today is talent- and thesis-led, not product-led. Independent coverage explicitly notes that
              neuromorphic computing has promised brain-like efficiency for years without displacing GPUs, and the
              retained public record still lacks public benchmarks or customer evidence that would force buyers to
              switch. Epoch AI also cautions that its public model dataset is non-exhaustive and limited by available
              disclosure, so the absence of a direct Flourish analogue in this evidence set is not proof that none
              exists. Rising data-center power demand strengthens the economic case for a low-power architecture, but
              regulated or mission-critical deployments face trust and governance hurdles that reward transparency.
              Until Flourish can pair its scientific pedigree with measurable commercial or technical proof, incumbents
              keep the advantage on buyer confidence and distribution.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP015
