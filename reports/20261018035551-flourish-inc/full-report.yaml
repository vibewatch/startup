  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation is still inferred from roadmap rather than observed accounts
        blocks:
          - type: paragraph
            body: >-
              The retained sources describe Flourish as a research lab working toward future products instead of an
              already deployed commercial platform. Wired says the company is pursuing near-term products on the path to
              a broader AI reinvention, while SiliconANGLE and Cryptobriefing both frame the company as pre-product.
              That leaves buyer, user, and payer segmentation as an inference exercise. The clearest disclosed
              commercialization path is an unnamed chipmaker relationship plus eventual deployment in devices people
              carry in their pockets, which points to OEM, edge-device, or assistant-platform partners before a
              conventional enterprise software sales motion. Project Astra provides a useful market comparator for how
              low-power assistant experiences can stage through limited testers before broad rollout, but it does not
              prove Flourish has an equivalent customer funnel or target segment selected.
