  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public valuation logic runs from a real market pain point to a proof gap that still overwhelms the current price.
    data:
      nodes:
        - id: pain
          label: AI power and compute pain
          summary: Industry training compute and costs are still compounding rapidly.
        - id: pedigree
          label: Founder pedigree + $500M backing
          summary: The round signals unusual investor appetite for the thesis.
        - id: proof-gap
          label: No public product, benchmark, or customer proof
          summary: Public evidence still frames Flourish as a research lab.
        - id: comp-bar
          label: Comparable bar already includes productization or deployed infra
          summary: Peers and adjacent programs show what commercialization evidence looks like.
        - id: asymmetry
          label: Current price embeds future proof
          summary: The reported $2.5B mark leaves more downside than upside if proof slips.
        - id: call
          label: 'Recommendation: research-more'
          summary: Wait for benchmark, partner proof, or materially better entry terms.
      edges:
        - from: pain
          to: pedigree
          label: Creates investor urgency
        - from: pedigree
          to: proof-gap
          label: Funds the thesis before proof
        - from: proof-gap
          to: comp-bar
          label: Raises the evidence bar
        - from: comp-bar
          to: asymmetry
          label: Makes price sensitivity critical
        - from: asymmetry
          to: call
          label: Supports waiting, not buying
    approximationNotes: Logical sequence only; it illustrates the decision chain rather than a quantitative scoring model.
    claimRefs:
