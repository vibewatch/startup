        title: Founders and scientific credibility
        blocks:
          - type: paragraph
            body: >-
              The core public underwriting case is the team. Thomas Reardon brings rare founder-market fit for this
              thesis: independent coverage ties him to Internet Explorer in the 1990s, a later
              computational-neuroscience PhD, and the CTRL-Labs exit to Meta. Rob Williams adds large-scale operator
              credibility from Amazon’s S-team. Publicly attributable technical support is thinner but still notable,
              with Ben Recht verifiable both as a UC Berkeley EECS professor and as a named Flourish adviser in retained
              reporting. Even so, the assigned pool does not disclose a full board roster, ownership map, or
              decision-rights structure.
