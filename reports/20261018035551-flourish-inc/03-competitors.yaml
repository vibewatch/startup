    approximationNotes: >-
      Ordinal 1-5 coordinates synthesize retained source evidence on present-day availability and the
      scale of architectural change; they are not measured benchmark scores.
    claimRefs: [CP001, CP003, CP007, CP009, CP014, CP015, CP016]
