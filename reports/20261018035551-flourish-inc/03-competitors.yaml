  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: benchmark-evidence
      missingEvidence: Independent benchmark or demo showing Cortex AI versus transformer baselines on power, accuracy, or continuous-learning performance.
      whyItMatters: Without technical proof, the chapter can position Flourish conceptually but cannot underwrite durable displacement.
      diligencePath: Request a reproducible benchmark packet, a public demo, or third-party lab validation.
      relatedQuestionRefs: [QP002, QP007]
    - type: private-evidence-only
      severity: material
      topic: commercialization-path
      missingEvidence: Public pricing, contract model, customer or design-partner names, and identification of the unnamed chipmaker.
      whyItMatters: Commercial readiness and go-to-market differentiation remain opaque even if the architecture thesis is real.
      diligencePath: Request the commercial roadmap, partner LOIs, and the first pricing or pilot documents.
      relatedQuestionRefs: [QP002, QP006]
    - type: missing-source
      severity: material
      topic: apples-to-apples-comparison
      missingEvidence: Buyer-side workload comparison across Flourish, existing GPU stacks, and alternative architecture vendors on total cost and deployment fit.
      whyItMatters: The retained sources support class-level positioning but not a procurement-grade switching decision.
      diligencePath: Run a controlled workload bake-off or collect actual pilot decision memos from prospective buyers.
      relatedQuestionRefs: [QP001, QP004, QP005]
