company:
  name: "Flourish Inc."
chapter:
  number: 7
  title: "Risks"
  summary: "Flourish's risk stack is dominated by science-to-product translation, commercialization opacity, and capital-intensity pressure rather than by a known public legal event. The public record still describes a pre-product research lab funded at a $2.5 billion valuation, while open-source evidence for round structure, benchmark superiority, counterparties, and customer proof remains thin or gated."
sections:
  - id: "ranked-risk-stack"
    title: "The thesis can break before regulation does"
    body: "The highest-probability downside is not a public enforcement action already in flight; it is that Flourish reaches commercialization too slowly for its research premise to compound into a durable product edge. Cryptobriefing's June 2026 profile still describes Flourish as a research lab with no commercial product, while DeepMind is already refining Project Astra with trusted testers and shipping adjacent capabilities into Gemini Live. That means Flourish is racing both the usual frontier-model compute curve and a commercialization clock set by much larger incumbents. Until the company can show that its claimed 20-50 watt operating target survives product-grade reliability, latency, and benchmark scrutiny, the most severe risks remain executional and scientific rather than purely legal."
    claimRefs: ["CR003", "CR004", "CR012", "CR015", "CR016"]
    figureRefs: ["FR001"]
  - id: "regulatory-and-disclosure-exposure"
    title: "Regulatory obligations are manageable; disclosure opacity is not"
    body: "The AI Act does not currently prove that Flourish is non-compliant, but it does create a clock that matters for any future GPAI rollout in Europe. The European Commission says GPAI rules became effective in August 2025, with AI Office enforcement starting on 2 August 2026 and stricter high-risk obligations following in 2027 or 2028 depending on use case. By itself, that is a normal planning problem. The sharper risk is that open sources still do not verify the financing architecture behind the June 2026 round: Caplight says filing documents are not displayed publicly and require access, and a previously cited Economic Times funding URL now resolves to generic Entrepreneur-site advertising copy rather than article-specific reporting. That leaves investors underwriting a very large valuation with limited public corroboration for terms, rights, or disclosure quality."
    claimRefs: ["CR001", "CR002", "CR006", "CR009", "CR010", "CR011"]
    tableRefs: ["TR001"]
  - id: "science-scale-and-operating-risk"
    title: "Biological inspiration still has to survive scale economics"
    body: "Flourish's differentiation thesis depends on translating connectomics into a commercially superior AI stack, but the independent technical evidence in this pool is more cautionary than confirmatory. Wikipedia's Drosophila connectome overview notes that available connectomes omit some forms of neuron-to-neuron communication and that cell and synapse counts vary across individuals, which underscores how much abstraction is still needed before biology becomes a production engineering advantage. At the same time, Epoch AI says frontier-model training compute has been growing 5x per year since 2020, training costs are climbing 3.5x annually, and total AI-chip compute stock is doubling roughly every seven months. Even if Cortex AI ultimately proves more efficient, Flourish still needs to show that the claimed power advantage is material at competitive scale, not only in a lab narrative."
    claimRefs: ["CR004", "CR007", "CR008", "CR012", "CR013", "CR014"]
    tableRefs: ["TR002"]
  - id: "dependency-monitoring-and-kill-criteria"
    title: "The diligence plan should focus on counterparties, proof packs, and explicit stop conditions"
    body: "Because there is no public customer proof, no public filing pack, and no disclosed cloud or chip counterparty in the assigned pool, the right mitigation is not optimism; it is a narrow diligence plan with kill criteria. Investors should require a benchmark package that compares Cortex AI against strong transformer baselines on capability, power, latency, and total cost of ownership; at least one named pilot or design partner with measurable deployment goals; and the actual round documents showing ownership, preferences, and any governance rights. If those materials do not arrive before the next financing event, or if they show only narrative support rather than technical or commercial proof, the valuation risk remains thesis-breaking rather than merely cosmetic."
    claimRefs: ["CR001", "CR002", "CR003", "CR005", "CR014", "CR016"]
    tableRefs: ["TR003"]
