      - number: '6.3'
        title: 首条渠道仍未具名，持久性与集中度仍由投资逻辑驱动
        blocks:
          - type: paragraph
            body: >-
              Flourish 的公开叙事暗示了两个可能的持久性杠杆：差异化的低功耗性能，以及通过硅片或设备合作伙伴实现战略分销。但客户证据尚未证明二者。Loihi 2 状态空间模型论文显示，神经形态式 token
              处理在基准任务上可以大幅改善能耗和延迟，这有助于解释 Flourish 为何追求端侧和低功耗用例，但该基准并非 Flourish 的结果，也不是客户验证事件。同时，Wired
              引述的怀疑态度顾问观点，以及公司自身的多年时间线，都说明扩张经济性、续约质量和集中度风险仍无法验证。即使是基本的参考对象检索也很嘈杂：对 Flourish Inc.
              进行精确名称搜索时会出现一家无关的田纳西州非营利组织，增加了追踪公开记录或采购证据的摩擦。
