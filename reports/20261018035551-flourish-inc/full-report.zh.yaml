  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Flourish 要解决的问题
        blocks:
          - type: paragraph
            body: >-
              Flourish 瞄准的不是宽泛的“所有 AI”机会，也不是芯片供应商、模型托管平台或临床脑机接口公司的市场。它要在 AI
              架构层提升能效，让买家少耗训练和推理能源、减轻基础设施压力，并在不等待新一代硬件的情况下获得更强的持续学习能力。相关支出主要来自已经承担前沿模型基础设施成本，或必须在严苛能耗、制冷和合规约束下部署强大模型的组织。由此，市场逻辑聚焦算力受限的
              AI 开发与部署，而不是泛化的软件 TAM。
