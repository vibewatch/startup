      - number: '5.3'
        title: 控制、部署与风险
        blocks:
          - type: paragraph
            body: >-
              核心风险在于，公开叙事领先于公开证明。Flourish 描述过与大型芯片厂商的讨论、通往口袋大小设备的路径，以及更深层架构突破的五年时间线，但现有证据尚未显示具名合作伙伴、相对于 Transformer
              基线的基准差异，或已披露的产品安全与治理控制。这一点很重要，因为通用 AI
              技术栈的可能商业化路径最终需要的不只是科学新颖性，还需要运营稳健性、文档和合规纪律，尤其是在技术进入受监管或安全敏感部署时。当前，这些控制应视为开放的尽调事项，而不是已建立的能力。
