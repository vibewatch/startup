companyProfile:
  summary: >-
    Flourish 是一家总部位于纽约的神经 AI 初创公司，正在开发 Cortex AI 这一脑启发式架构，目标是在大幅降低功耗的同时逼近人类级智能。公司的创始故事颇具可信度：Thomas Reardon 拥有 Microsoft
    和 CTRL-Labs 的经历，Rob Williams 曾在 Amazon 负责运营；据报道，2026 年 6 月的融资由 Jeff Bezos 领投，Lux Capital、GV 和 Catalio 参与。不过，Flourish
    仍是研究机构而非商业供应商：没有披露产品，没有公开客户名单，没有报道显示其有收入，也没有公开技术基准测试包。因此，投资判断依赖团队质量和投资逻辑的可信度，而不是经营证据。
