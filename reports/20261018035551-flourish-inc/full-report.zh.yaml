  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代路径
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合比“其他神经 AI 初创公司”更广。寻找低成本智能的买家或投资人，可以继续使用当前 Transformer 和 GPU 技术栈，采用 Google DeepMind 的 Project Astra
              等在位产品界面，支持披露更充分的硬件路线替代方案，或等待以科学研究为核心的架构重置。Flourish
              的主张格外激进，因为它不是在现有基础上承诺模型小幅变好，而是承诺一种可能将功耗曲线推进一个数量级的新架构。如果技术逻辑成立，这会带来上行空间；但也意味着今天最现实的替代方案是现状，而不是另一家销售同类产品的上市公司。
            claimRefs:
