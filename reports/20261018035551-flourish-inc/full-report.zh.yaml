      - number: '4.2'
        title: 成本结构比单位经济性更容易推断
        blocks:
          - type: paragraph
            body: >-
              公开证据对 Flourish 资本密集度的说明，远强于对未来单位经济性的说明。公司正在投入一项研究密集型建设：Wired 报道有约两打神经科学家和 AI
              研究员，纽约办公室内置数据中心，并考虑购买数百万美元的显微镜。上行情景取决于一项大幅能效主张——约 20 至 50 瓦，而不是 GPU
              集群级别的功耗——但现有基准来源也警告，公开的模型算力估算仍属大致估计，因此外部人士目前无法把这些主张充分转化为毛利率或训练成本的投资判断。神经形态和边缘 AI
              的市场需求似乎很大，但任何面向欧洲的市场路径仍可能承担 GPAI 透明度义务，以及受监管用例未来的高风险合规成本。
