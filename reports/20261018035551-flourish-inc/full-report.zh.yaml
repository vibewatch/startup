          to: pedigree
          label: 制造投资者紧迫感
        - from: pedigree
          to: proof-gap
          label: 在证明出现前为投资逻辑提供资金
        - from: proof-gap
          to: comp-bar
          label: 提高证据门槛
        - from: comp-bar
          to: asymmetry
          label: 让价格敏感度变得关键
        - from: asymmetry
          to: call
          label: 支持等待，而非买入
