      - number: '2.2'
        title: 潜在买家、预算负责人和采用路径
        blocks:
          - type: paragraph
            body: >-
              Flourish
              的投资逻辑与基础设施效率挂钩，因此最可能的早期客户不是小型应用团队，而是已经掌控大额模型开发或部署预算的机构。证据首先指向前沿实验室和超大规模云厂商式模型平台：训练算力增长、训练成本通胀和数据中心规模，足以支撑架构层面的试验。第二个潜在细分市场是受监管的企业
              AI 部署，但能效提升只有在模型同时满足治理和保证要求时才有意义。在这个框架下，买家可能是研发或平台负责人，用户是研究或模型运营团队，付款方来自基础设施、平台或转型预算，而非业务线 SaaS 支出。证据并未显示
              Flourish 自身已有商业推进：公司仍未推出产品，现有资料中也没有公开试点、定价或设计合作伙伴证据。
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
