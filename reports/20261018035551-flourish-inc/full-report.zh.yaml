        blocks:
          - type: paragraph
            body: >-
              合理的情景框架仍然很宽，因为即使公开的前沿模型数据集也带有很大的不确定区间，而 Flourish
              披露的信息远少于普通后期软件或基础设施公司。乐观情景需要独立技术验证，以及至少一个可信的商业化信号——合作伙伴、试点、设计赢单或达到收购方级别的里程碑——证明研究能走出实验室。基准情景是 Flourish
              在战略上仍有吸引力，但经济上无法定价，投资人只能观察而不能追逐。悲观情景不是投资逻辑不可能，而是证明来得太慢，赶不上 $2.5B 估值，迫使下一轮融资或估值重置。尽调还需要精确核实法律实体，因为公开网络上关于
              Flourish 的结果可能指向无关企业；在轮次条款和所有权仍未披露时，这是不可接受的。
