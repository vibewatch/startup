      - number: '3.3'
        title: 持久性、切换成本与反向证据
        blocks:
          - type: paragraph
            body: >-
              如今的护城河逻辑由人才和投资逻辑驱动，而非产品驱动。独立报道明确指出，神经形态计算多年来一直承诺类似大脑的能效，却没有取代 GPU；现有公开记录仍缺少能迫使买家切换的公开基准或客户证据。Epoch AI
              也提醒，其公开模型数据集并不完整，受可用披露限制，因此在这组证据中没有发现 Flourish
              的直接类比，并不能证明类比不存在。数据中心功耗上升强化了低功耗架构的经济逻辑，但受监管或关键任务部署面临信任和治理门槛，而透明度更高的方案更占优势。在 Flourish
              将科学履历与可量化的商业或技术证明结合起来之前，在买家信心和分销这两项指标上，在位企业仍占优。
