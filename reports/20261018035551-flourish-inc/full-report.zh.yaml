  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 投资逻辑可能先于监管失效
        blocks:
          - type: paragraph
            body: >-
              概率最高的下行情景不是已经启动的公开执法行动，而是 Flourish 商业化过慢，研究前提来不及累积成持久的产品优势。Cryptobriefing 2026 年 6 月的资料仍将 Flourish
              描述为没有商业产品的研究实验室；与此同时，DeepMind 已与可信测试者一起打磨 Project Astra，并将相邻能力交付到 Gemini Live。因此，Flourish
              既要追赶通常的前沿模型算力曲线，也要赶上由更大在位企业设定的商业化时钟。在公司证明其宣称的 20-50 瓦运行目标经得起产品级可靠性、延迟和基准测试审查之前，最严重的风险仍是执行和科学风险，而不只是法律风险。
            claimRefs:
              - CR003
              - CR004
              - CR012
              - CR015
              - CR016
