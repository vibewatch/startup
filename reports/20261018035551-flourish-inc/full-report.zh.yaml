      - number: '7.2'
        title: 监管义务可管理，披露不透明却不可接受
        blocks:
          - type: paragraph
            body: >-
              AI Act 目前不能证明 Flourish 不合规，但它为未来在欧洲推出 GPAI 设定了重要时间表。European Commission 表示，GPAI 规则于 2025 年 8 月生效，AI Office
              于 2026 年 8 月 2 日开始执法，更严格的高风险义务则根据用例在 2027 年或 2028 年跟进。单独看，这是一个正常的规划问题。更尖锐的风险在于，公开来源仍无法验证 2026 年 6
              月融资背后的融资架构：Caplight 称申报文件未公开展示，需要访问权限；此前引用的 Economic Times 融资 URL 现在解析到 Entrepreneur
              网站的通用广告文案，而不是文章专属报道。因此，投资人在公开佐证有限的情况下，对一个非常高的估值进行投资判断，条款、权利和披露质量都尚未充分确认。
            claimRefs:
              - CR001
