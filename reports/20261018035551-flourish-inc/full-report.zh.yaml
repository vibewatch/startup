      - number: '2.3'
        title: 采用驱动、约束与公开规模数据仍无法证明的事项
        blocks:
          - type: paragraph
            body: >-
              支持性证据显示了可信的需求驱动因素：算力使用量快速上升、训练成本增加以及数据中心的物理规模，正在推高前沿 AI 的经济压力。如果 Flourish
              能证明真实的效率提升，这就为差异化架构逻辑留下了空间。同一批证据也说明采用可能较慢。随着 AI
              部署扩散，治理要求正在收紧；受监管或高风险场景的买家不能只凭能效主张采用新架构，还需要合规、文档和模型行为方面的保证。更重要的是，当前公开记录不足以支撑有说服力的 TAM/SAM/SOM
              梯度。它支持压力视角和买家假设，却不支持收入预测、份额假设或可信的近期 SOM。在 Flourish 发布基准证据、客户证明或商业合同模式之前，市场逻辑在战略上有吸引力，但商业定义仍不充分。
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM009
              - CM011
              - CM013
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 商业需求牵引仍未得到证明
            body: 现有证据验证了基础设施痛点，但尚未验证 Flourish 自身的购买信号。公开来源仍将其描述为没有产品、没有已发布基准测试、也没有公开试点或定价证据的研究实验室，因此近期机会明显窄于泛 AI 市场叙事。
