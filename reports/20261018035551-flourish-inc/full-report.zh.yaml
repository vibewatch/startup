    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与运营逻辑
        blocks:
          - type: paragraph
            body: >-
              独立报道将 Flourish 描述为一家位于纽约的人工智能初创公司，围绕连接组学及其他脑启发式设计原则开发 Cortex AI，而不是单纯依靠标准 Transformer
              扩展。现有报道始终将其定位为尚未推出产品、由研究驱动的企业：公开证据显示，这是一家追求能效跃升和持续学习的实验室，而不是拥有可见收入、客户或已发货软件的公司。其身份因此异常清晰，但对一家账面估值已达数十亿美元的公司而言，商业化仍异常不透明。
