              也将商业化放在未来时态。这不能证明不存在私人客户，但意味着当前公开记录没有可供尽调团队联系的参考账户、部署分母或重复使用的队列信号。因此，本章必须把路线图主张与已证明的采用分开，并将缺失客户证明视为重大尽调缺口，而不是用
