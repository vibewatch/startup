        - 继续跟踪公司，但不要把当前公开记录视为按该价格买入本轮的充分依据。
      - - 置信度
        - medium
        - 核心融资和产品状态事实已得到交叉印证，但商业模式和技术证明仍然缺失。
      - - 风险评级
        - high
        - 在第三方验证性能或客户需求前，执行、证明和融资风险占主导。
      - - 估值立场
        - stretched
        - 报道中的 $2.5B 估值定价的是未来证明，而不是已展示的证明。
    notes: 截至 runDate 的快照仅使用指定来源池中保留的公开来源；没有公开的目标回报模型可以支持，因为收入、客户和轮次条款未披露。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV015
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据支持的结论
      - 什么会改变判断
    rows:
      - - 投资逻辑：AI 效率痛点真实存在
        - Epoch 称，自 2020 年以来，前沿模型训练算力每年增长 5×，训练成本每年上升 3.5×。
        - 如果 Cortex AI 经独立基准验证具备持久的能源或算力优势，就值得战略关注。
      - - 投资逻辑：投资人在押注创始人论点
        - 独立报道将 $500M 轮融资与 Jeff Bezos、Lux Capital、GV 和 Catalio 联系起来，显示出对一家尚无产品实验室的非同寻常融资支持。
        - 如果联合投资结构或治理条款得到披露，将更有把握判断该轮融资不只是声誉交易。
      - - 反向逻辑：证明仍然缺失
        - 公开报道仍称 Flourish 没有商业产品、没有展示过基准成绩，指定来源集中也没有客户或收入证明。
        - 外部基准、试点或已签署的设计合作方可将公司从概念推进到可投资尽调阶段。
      - - 反向逻辑：可比对象已经展示部署
        - Project Astra 已进入可信测试者产品化阶段，Groq 也已为 Bell 提供主权推理基础设施。
        - Flourish 需要证明其架构能跨过市场上已经可见的商业化门槛。
    notes: 可比对象只能用于方向性参考，不能直接等同估值，因为保留证据混合了研究原型、已部署的推理基础设施和市场数据。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Flourish 发布独立基准，获得可信的设计合作方或达到收购方标准的合作，并展示从研究走向产品的路径。
        - 只有出现证明后，支付报道中的 $2.5B 估值才可分析；但指定证据仍不足以支持上行估值区间或目标回报。
        - 基准无法泛化、合作方经济条件薄弱，或证明出现时市场窗口已经收窄。
        - 需要指定公开来源池中尚未出现的新证据。
      - - 基准
        - 公司保留顶级投资人和技术吸引力，但仍不披露客户、收入、轮次条款或外部性能数据。
        - 指定公开证据不足以支撑数值区间；在证明出现前，入场应以里程碑为条件，价格低于报道估值。
        - 投资人过度解读期权价值，下一项数据仍缺乏商业相关性。
        - 最符合当前证据。
      - - 悲观
        - 下一轮融资或内部估值在基准或客户证明出现前落地，或者治理 / 优先权安排比外部人假设的更有利于投资人。
        - 可以支持不投资的决定，但公开资料没有可辩护的估值下限；下轮融资或估值下调成为相关风险，而非精确的悲观情景价格。
        - 技术进展停滞、买方意愿降温，或稀释 / 优先权悬置直到尽调后期才暴露。
        - 如果证明和条款持续隐于下一次融资，风险会迅速上升。
    notes: 情景逻辑锚定于报道的 2026 年 6 月融资；保留来源没有披露收入、单位经济、股权结构条款和经基准验证的模型结果，因此不支持数值估值区间。
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV012
      - CV016
