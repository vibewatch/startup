          summary: The round signals unusual investor appetite for the thesis.
        - id: proof-gap
          label: 没有公开的产品、基准测试或客户证明
          summary: Public evidence still frames Flourish as a research lab.
        - id: comp-bar
          label: 可比对象已经具备产品化能力或已部署基础设施
          summary: Peers and adjacent programs show what commercialization evidence looks like.
        - id: asymmetry
          label: 当前价格已计入未来证明
          summary: The reported $2.5B mark leaves more downside than upside if proof slips.
        - id: call
          label: 建议：research-more
          summary: Wait for benchmark, partner proof, or materially better entry terms.
