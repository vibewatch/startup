  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 商业化路径仍停留在概念阶段
        blocks:
          - type: paragraph
            body: >-
              独立报道对这笔大额融资的描述基本一致：Flourish 以 $2.5B 估值完成 $500M 融资，Jeff Bezos 在增加初始承诺后出资约 $100M。但这些报道没有显示市场上存在正在运营的业务。现有来源将
              Flourish 描述为尚无收入、尚无产品的研究实验室，而不是已经交付 SaaS
              的公司。管理层勾勒了合理的未来变现路径——消费设备模型、硅片合作和源于研究的算法——但现有证据没有披露目录定价、具名设计合作伙伴、客户合同或实际收入。目前，收入模式仍是建立在管理层说法和投资人耐心上的路线图，而非商业证明。
