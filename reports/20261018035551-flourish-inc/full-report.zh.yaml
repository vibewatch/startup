        title: 尽调计划应聚焦交易对手、证明材料包与明确止损条件
        blocks:
          - type: paragraph
            body: >-
              由于指定资料中没有公开客户证明、公开申报材料包，也没有披露云或芯片交易对手，正确的缓释方式不是乐观，而是一份带有终止标准的狭窄尽调计划。投资人应要求一份基准测试包，比较 Cortex AI 与强
              Transformer
              基线的能力、功耗、延迟和总拥有成本；至少一个具有可衡量部署目标的具名试点或设计合作伙伴；以及显示所有权、优先权和任何治理权的实际轮次文件。如果这些材料在下一轮融资事件前仍未到位，或只提供叙事支持而非技术或商业证明，估值风险仍会击穿投资逻辑，而不只是表面瑕疵。
