      - number: '7.3'
        title: 生物启发仍需经受规模经济考验
        blocks:
          - type: paragraph
            body: >-
              Flourish 的差异化逻辑取决于能否把连接组学转化为商业上更优的 AI 技术栈，但这组资料中的独立技术证据更多是在提醒风险，而不是确认逻辑。Wikipedia
              的果蝇连接组概览指出，现有连接组遗漏了某些神经元之间的通信形式，而且细胞和突触数量因个体而异；这凸显出，在生物学成为生产工程优势之前，仍需要大量抽象工作。与此同时，Epoch AI 表示，自 2020
              年以来，前沿模型训练算力每年增长 5 倍，训练成本每年增长 3.5 倍，AI 芯片总算力存量大约每七个月翻倍。即使 Cortex AI 最终证明更高效，Flourish
              仍需证明其宣称的功耗优势在有竞争力的规模上具有实质意义，而不只存在于实验室叙事中。
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR012
              - CR013
              - CR014
