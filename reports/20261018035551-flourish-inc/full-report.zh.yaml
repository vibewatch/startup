        blocks:
          - type: paragraph
            body: >-
              这轮融资是目前最清晰的事实。多篇现有报道称，Flourish 于 2026 年 6 月初以 $2.5B 估值完成约 $500M 融资，Jeff Bezos 出资约 $100M，Lux Capital、GV 和
