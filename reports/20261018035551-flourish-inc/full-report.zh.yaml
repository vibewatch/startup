        blocks:
          - type: paragraph
            body: >-
              公开投资判断的核心是团队。Thomas Reardon 与这一投资逻辑的创始人—市场匹配度罕见：独立报道将他与 1990 年代的 Internet Explorer、后来取得的计算神经科学博士学位，以及
              CTRL-Labs 被 Meta 收购的退出联系起来。Rob Williams 则凭借 Amazon S-team 经历带来大规模运营可信度。可归因于具体人员的技术支持较少，但 Ben Recht 同时可核实为
              UC Berkeley EECS 教授，以及现有报道点名的 Flourish 顾问。即便如此，现有资料仍未披露完整董事会名单、股权图或决策权结构。
