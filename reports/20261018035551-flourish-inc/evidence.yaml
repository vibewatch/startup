evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, cap table, and explicit control-rights summary for founders and investors.
    whyItMatters: >-
      The current underwriting story depends heavily on founder pedigree and investor quality, so governance
      concentration and downside protections matter to risk assessment.
    diligencePath: >-
      Request the latest cap table, board-observer rights, voting agreements, and any side-letter governance provisions
      from management or lead investors.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: Verified revenue, customer count, design-partner names, pilot status, and pricing or commercialization milestones.
    whyItMatters: >-
      Without commercial evidence, the chapter can only underwrite the team and thesis, not demand validation or revenue
      conversion timing.
    diligencePath: >-
      Request customer pipeline materials, signed pilot documentation, pricing hypotheses, and internal revenue planning
      artifacts.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: benchmark-and-hardware-proof
    missingEvidence: >-
      Named chip-partner confirmation and benchmarked technical results versus transformer baselines at matched power or
      cost.
    whyItMatters: >-
      The investment case is explicitly tied to energy efficiency and continuous learning, but public evidence stops
      short of independently testable proof.
    diligencePath: >-
      Request benchmark decks, reproducible evaluation methodology, and any signed partner documentation covering
      hardware deployment timelines.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Public TAM, SAM, or SOM evidence tied to a named efficiency budget, buyer cohort, or third-party market model for
      architecture-level AI efficiency tools.
    whyItMatters: >-
      Without a supported spend denominator, valuation or adoption arguments can drift into generic AI TAM rhetoric that
      the current evidence does not justify.
    diligencePath: >-
      Collect public buyer budgets, procurement signals, or third-party market models that isolate
      architecture-efficiency spending rather than aggregate AI spend.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Public pilot, pricing, design-partner, or contract-model evidence showing who would buy Cortex AI and under what
      commercial terms.
    whyItMatters: >-
      The market case can be strategically interesting while still being commercially unproven, which is exactly the
      current state of the assigned evidence.
    diligencePath: >-
      Seek customer references, procurement pages, trial disclosures, product packaging, or benchmark-backed launch
      materials once Flourish exits research-only mode.
    relatedQuestionRefs:
      - QM003
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: blocking
    topic: benchmark-evidence
    missingEvidence: >-
      Independent benchmark or demo showing Cortex AI versus transformer baselines on power, accuracy, or
      continuous-learning performance.
    whyItMatters: >-
      Without technical proof, the chapter can position Flourish conceptually but cannot underwrite durable
      displacement.
    diligencePath: Request a reproducible benchmark packet, a public demo, or third-party lab validation.
    relatedQuestionRefs:
      - QP002
      - QP007
  - type: private-evidence-only
    severity: material
    topic: commercialization-path
    missingEvidence: Public pricing, contract model, customer or design-partner names, and identification of the unnamed chipmaker.
    whyItMatters: Commercial readiness and go-to-market differentiation remain opaque even if the architecture thesis is real.
    diligencePath: Request the commercial roadmap, partner LOIs, and the first pricing or pilot documents.
    relatedQuestionRefs:
      - QP002
      - QP006
  - type: missing-source
    severity: material
    topic: apples-to-apples-comparison
    missingEvidence: >-
      Buyer-side workload comparison across Flourish, existing GPU stacks, and alternative architecture vendors on total
      cost and deployment fit.
    whyItMatters: The retained sources support class-level positioning but not a procurement-grade switching decision.
    diligencePath: Run a controlled workload bake-off or collect actual pilot decision memos from prospective buyers.
    relatedQuestionRefs:
      - QP001
      - QP004
      - QP005
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, hiring plan, lab capex schedule, and any debt or project-finance obligations.
    whyItMatters: >-
      The size of the round alone does not reveal how long Flourish can fund a research-heavy program before another
      raise is required.
    diligencePath: >-
      Request a monthly cash bridge from financing close through the next 24 months, including headcount, lab equipment,
      compute, and facilities spend.
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Product packaging, price sheets, contract duration, pilot economics, and any design-partner or OEM commercial
      terms.
    whyItMatters: >-
      Revenue quality and gross-margin potential cannot be assessed while the commercialization path remains only
      conceptual.
    diligencePath: >-
      Request current commercial materials, draft MSAs or LOIs, and internal pricing assumptions for device, silicon, or
      software channels.
  - type: private-evidence-only
    severity: material
    topic: chip-partnership
    missingEvidence: >-
      Identity of the unnamed chip partner, expected non-recurring engineering costs, manufacturing commitments, and
      royalty or margin split.
    whyItMatters: >-
      Hardware-enablement economics could determine whether Flourish becomes capital-light software or a much heavier
      semiconductor-adjacent business.
    diligencePath: >-
      Review the chip-partner term sheet, hardware roadmap, and bill of materials assumptions for the first commercial
      deployment.
  - type: missing-source
    severity: material
    topic: efficiency-benchmark
    missingEvidence: >-
      Independent benchmark evidence showing that Cortex AI achieves a commercially relevant cost or energy advantage
      versus transformer baselines.
    whyItMatters: >-
      The future margin story depends on the power-efficiency thesis, but the retained public evidence remains
      aspirational rather than measured.
    diligencePath: Request prototype benchmark data, methodology, and any third-party replication or design-partner validation.
  - type: private-evidence-only
    severity: material
    topic: benchmark-gap
    missingEvidence: Public benchmarks comparing Cortex AI against transformer baselines on matched tasks, power, and data efficiency.
    whyItMatters: Without benchmark deltas, the product thesis cannot be underwritten as more than an ambitious research narrative.
    diligencePath: >-
      Request internal benchmark decks, evaluation methodology, and any third-party technical review of energy or
      data-efficiency claims.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: material
    topic: security-compliance-controls
    missingEvidence: >-
      Public documentation covering security architecture, privacy posture, incident response, model governance, or
      certifications.
    whyItMatters: >-
      Trust and compliance controls will influence whether Cortex AI can be deployed into enterprise or regulated
      environments.
    diligencePath: Request security whitepapers, privacy and governance documentation, audit history, and any certification roadmap.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: deployment-path
    missingEvidence: >-
      Named semiconductor partner, hardware integration plan, and milestone dates for shipping Cortex AI on edge or
      consumer devices.
    whyItMatters: >-
      The commercialization path currently depends on an unnamed external partner and therefore cannot be timed or
      costed from public evidence.
    diligencePath: Request partner LOIs or contracts, hardware milestones, and the target device-performance envelope.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: minor
    topic: architecture-detail
    missingEvidence: >-
      Official public technical documentation that explains architecture layers, APIs, system boundaries, or product
      manuals.
    whyItMatters: >-
      Current architecture analysis is reconstructed from media reporting rather than from a company-controlled
      technical artifact.
    diligencePath: >-
      Request architecture diagrams, technical blog posts, API docs, or product specification decks that can be shared
      in diligence.
    relatedQuestionRefs:
      - QE003
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: Named production customers, pilots, or design partners with deployment dates, use cases, and measurable outcomes.
    whyItMatters: Without a reference account, demand quality and deployment readiness cannot be tested independently.
    diligencePath: Request a customer reference list with at least one production deployment call and one pilot case study.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal timing, contract length, or satisfaction evidence.
    whyItMatters: Durability cannot be distinguished from one-time scientific interest without renewal data.
    diligencePath: Obtain cohort-level renewal and churn data or customer success dashboards from management.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: partner-dependence
    missingEvidence: >-
      Identity, exclusivity, economics, and deployment plan for the unnamed chip manufacturer or any other launch
      partner.
    whyItMatters: Early distribution concentration could dominate the first customer funnel and bargaining power.
    diligencePath: Ask management for the partner name, current stage, signed terms, and contingency path if that partner slips.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: public-customer-proof
    missingEvidence: A complete public or permissioned list of reference deployments, pilots, testimonials, or procurement records.
    whyItMatters: The assigned pool shows no named user evidence, so chapter-level customer proof remains incomplete.
    diligencePath: >-
      Expand diligence with customer references, marketplace records, and procurement databases once management provides
      identifiers.
    relatedQuestionRefs:
      - QU002
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: adverse-legal-monitoring
    missingEvidence: >-
      Current court, regulator, sanctions, or incident records showing either a clean slate or a concrete adverse event
      for Flourish and its founders.
    whyItMatters: >-
      The assigned public pool does not contain a direct litigation, enforcement, or outage record, so the current risk
      register may understate downside or miss a hidden blocker.
    diligencePath: >-
      Run named checks across PACER, Delaware, SEC, FTC, CFPB, sanctions, and equivalent EU databases, then compare
      results with company counsel representations.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: counterparty-disclosure
    missingEvidence: >-
      Cloud, chip, data, and manufacturing counterparties plus any exclusivity, capacity, pricing, or termination
      commitments.
    whyItMatters: >-
      Compute-supply and partner terms determine whether the low-power thesis survives commercialization and whether a
      single vendor can block launch timing.
    diligencePath: >-
      Request vendor list, signed commercial agreements, infrastructure cost model, and any concentration analysis used
      by management.
  - type: private-evidence-only
    severity: material
    topic: commercialization-proof
    missingEvidence: >-
      Named customer or design-partner list, pilot milestones, and production telemetry showing that research is
      converting into repeatable deployment.
    whyItMatters: >-
      Without user proof, the investment case remains anchored to scientific narrative and fundraising strength rather
      than operating evidence.
    diligencePath: >-
      Request pipeline data, pilot contracts, technical success criteria, and reference calls before underwriting any
      follow-on valuation.
  - type: missing-source
    severity: material
    topic: cap-table-terms
    missingEvidence: >-
      Public or diligenced documents showing ownership, preferences, investor rights, and round structure for the 2026
      financing.
    whyItMatters: The reported headline valuation is not enough to judge true entry economics or dilution risk.
    diligencePath: >-
      Request executed round documents, cap table, and any side-letter summary directly from the company or lead
      investors.
    relatedQuestionRefs:
      - QV001
      - QV002
      - QV008
  - type: private-evidence-only
    severity: material
    topic: technical-benchmark
    missingEvidence: >-
      Independent benchmark or third-party technical review showing whether Cortex AI materially improves efficiency or
      capability versus mainstream baselines.
    whyItMatters: Without benchmarked proof, the valuation still prices thesis rather than demonstrated differentiation.
    diligencePath: Request benchmark methodology, raw results, and an external reviewer or design partner who can validate them.
    relatedQuestionRefs:
      - QV003
      - QV004
      - QV007
      - QV008
  - type: missing-source
    severity: material
    topic: commercialization
    missingEvidence: >-
      Named pilots, customers, pricing, revenue, or partnership terms that connect the research program to an economic
      buyer.
    whyItMatters: Commercial proof is the clearest path to moving the recommendation above research-more.
    diligencePath: >-
      Ask for active pipeline, signed counterparties, pilot scopes, and any pricing or budget authority attached to
      them.
    relatedQuestionRefs:
      - QV003
      - QV005
      - QV008
  - type: enumeration-incomplete
    severity: minor
    topic: entity-verification
    missingEvidence: >-
      Verified legal-entity map covering the operating company, IP owner, financing vehicle, and any similarly named
      affiliates or unrelated entities.
    whyItMatters: >-
      Open-web name ambiguity can misdirect source collection and create avoidable diligence mistakes around the
      financing.
    diligencePath: >-
      Match charter documents, jurisdiction records, domains, and financing documents to a confirmed legal-entity list
      before underwriting valuation.
    relatedQuestionRefs:
      - QV009
