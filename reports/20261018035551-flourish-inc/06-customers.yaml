        - Medium
        - Comparable assistant products often validate in controlled cohorts first
        - Flourish tester program, pilot cohort, or reference-design count
    notes: >-
      The table mixes disclosed Flourish facts with one external comparator row to show how public adoption proof
      is typically surfaced before broad rollout.
    claimRefs: [CU001, CU005, CU006, CU008, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - No public production customer disclosed
        - Unknown
        - None named in retained 2026 reporting
        - Not disclosed
        - No deployment KPI disclosed
        - Absence in retained sources is not proof of absence; direct customer list is still required
      - - No public pilot or design partner disclosed
        - Unknown
        - Unnamed chipmaker negotiation for on-silicon embodiment
        - Pre-commercial discussion
        - Possible route to first deployment
        - Counterparty, stage gate, and economics are undisclosed
      - - No public user cohort or testimonial disclosed
        - Unknown
        - No review, procurement, or marketplace evidence in assigned pool
        - Not disclosed
        - No retention, satisfaction, or expansion evidence
        - Requires a named reference call, procurement record, or user quote
    notes: >-
      This is a public-proof table, not a claim of zero customers; it documents what the retained source pool does
      and does not reveal.
    enumerationScope:
      coverage: partial
      basis: >-
        Cross-checking the assigned 2026 profile sources plus the named comparator pages shows no public Flourish
        customer roster, no pilot list, and no reference deployments inside this worker pool.
    claimRefs: [CU004, CU006, CU008, CU011]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence implies a staged commercialization path from research output to silicon enablement to limited
      external validation before any broad customer expansion.
    data:
      items:
        - label: Research buildout
          touchpoints:
            - Around two dozen researchers had been hired by end-March 2026.
            - Wired visited while lab equipment was still arriving.
        - label: Prototype models
          touchpoints:
            - Near-term products were described as stepping stones to a broader AI reinvention.
            - No commercial product was disclosed in June 2026 profiles.
        - label: Silicon enablement
          touchpoints:
            - Flourish said it was negotiating with a major chip manufacturer.
            - Pocket-device embodiment was framed as a target rather than a shipped deployment.
        - label: Controlled external validation
          touchpoints:
            - Comparator programs like Project Astra use trusted testers and waitlists.
            - Flourish has not disclosed a comparable pilot cohort.
        - label: Production buyers
          touchpoints:
            - No named production customer or design partner appears in retained sources.
            - No usage, renewal, or satisfaction denominator is disclosed.
        - label: Expansion loop
          touchpoints:
            - Channel concentration could form around one silicon relationship.
            - Expansion remains thesis-driven until reference customers are named.
    approximationNotes: >-
      Sequence is inferred from disclosed roadmap and external comparators; it is not an observed Flourish funnel.
    claimRefs: [CU001, CU002, CU004, CU006, CU008, CU014, CU015]
callouts:
  - calloutType: risk
    title: Customer proof is still missing at the point where valuation already assumes success
    body: >-
      The public record supports a research thesis and a funding narrative, but not an operating customer story.
      Until Flourish identifies named deployments, pilot cohorts, or renewal data, customer durability has to be
      underwritten as a future milestone rather than a demonstrated asset.
    claimRefs: [CU001, CU006, CU014]
