        - 2026-06
        - Wired; SiliconANGLE; Cryptobriefing
        - Medium
        - No external reference account supports current demand claims
        - Full customer roster, pilot count, and use-case mix
      - - Team buildout
        - Around two dozen researchers; lab equipment still pending
        - 2026-03
        - Wired
        - Medium
        - Operating emphasis was research capacity, not scaled delivery
        - GTM headcount, support staffing, and field deployment capacity
      - - Channel dependence
        - Negotiating with unnamed major chip manufacturer
