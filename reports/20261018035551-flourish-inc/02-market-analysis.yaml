    title: Market sizing lens
    type: pyramid
    summary: >-
      Ordered layers show how broad AI adoption pressure narrows into the much smaller
      pre-product wedge Flourish is actually targeting.
    data:
      items:
        - label: Broad AI adoption context
          value: Adoption spreading
          note: Stanford HAI says AI is integrating rapidly into the global economy while governance lags.
          tone: neutral
          claimRefs: [CM007]
        - label: Frontier training compute growth
          value: 5x/year since 2020
          note: Epoch AI's trend for frontier language-model training compute.
          tone: opportunity
          claimRefs: [CM003]
        - label: Training cost inflation
          value: 3.5x annually
          note: Cost escalation creates demand for efficiency if savings are real.
          tone: opportunity
          claimRefs: [CM004]
        - label: Data-center scale ceiling
          value: 1.1M H100-equivalents
          note: Largest known AI data center scale shows how large the infrastructure burden already is.
          tone: warning
          claimRefs: [CM005]
        - label: Likely early budget owners
          value: Frontier labs, hyperscalers, and platform teams
          note: The plausible initial buyer set is far narrower than the overall AI market.
          tone: neutral
          claimRefs: [CM006]
        - label: Flourish's current commercial wedge
          value: 20-50 watts target; no product yet
          note: The company's current public thesis is a pre-product efficiency claim rather than a booked revenue stream.
          tone: risk
          claimRefs: [CM002, CM009, CM011]
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM007, CM009, CM011]
callouts:
  - calloutType: risk
    title: Commercial pull remains unproven
    body: >-
      The assigned evidence validates the infrastructure pain point, but not yet a buying
      signal for Flourish itself. Public sources still describe a research lab with no
      product, no published benchmark, and no public pilot or pricing evidence, so the
      near-term opportunity is materially narrower than a headline AI-market narrative.
    claimRefs: [CM009, CM010, CM011]
