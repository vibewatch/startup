  evidenceGaps:
    - type: missing-source
      severity: material
      topic: cap-table-terms
      missingEvidence: Public or diligenced documents showing ownership, preferences, investor rights, and round structure for the 2026 financing.
      whyItMatters: The reported headline valuation is not enough to judge true entry economics or dilution risk.
      diligencePath: Request executed round documents, cap table, and any side-letter summary directly from the company or lead investors.
      relatedQuestionRefs: [QV001, QV002, QV008]
    - type: private-evidence-only
      severity: material
      topic: technical-benchmark
      missingEvidence: Independent benchmark or third-party technical review showing whether Cortex AI materially improves efficiency or capability versus mainstream baselines.
      whyItMatters: Without benchmarked proof, the valuation still prices thesis rather than demonstrated differentiation.
      diligencePath: Request benchmark methodology, raw results, and an external reviewer or design partner who can validate them.
      relatedQuestionRefs: [QV003, QV004, QV007, QV008]
    - type: missing-source
      severity: material
      topic: commercialization
      missingEvidence: Named pilots, customers, pricing, revenue, or partnership terms that connect the research program to an economic buyer.
      whyItMatters: Commercial proof is the clearest path to moving the recommendation above research-more.
      diligencePath: Ask for active pipeline, signed counterparties, pilot scopes, and any pricing or budget authority attached to them.
      relatedQuestionRefs: [QV003, QV005, QV008]
    - type: enumeration-incomplete
      severity: minor
      topic: entity-verification
      missingEvidence: Verified legal-entity map covering the operating company, IP owner, financing vehicle, and any similarly named affiliates or unrelated entities.
      whyItMatters: Open-web name ambiguity can misdirect source collection and create avoidable diligence mistakes around the financing.
      diligencePath: Match charter documents, jurisdiction records, domains, and financing documents to a confirmed legal-entity list before underwriting valuation.
      relatedQuestionRefs: [QV009]
