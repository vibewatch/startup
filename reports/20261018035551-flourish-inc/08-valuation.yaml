  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence-backed takeaway, What would change the view]
    rows:
      - ["Thesis: AI-efficiency pain is real", "Epoch says frontier-model training compute has grown 5× per year since 2020 and training costs are climbing 3.5× annually.", "A durable energy or compute advantage for Cortex AI would deserve strategic attention if independently benchmarked."]
      - ["Thesis: investors are funding the founder thesis", "Independent reports tie the $500M round to Jeff Bezos, Lux Capital, GV, and Catalio, showing unusual financing support for a pre-product lab.", "A disclosed syndicate structure or governance terms would improve conviction that the round is more than a reputation trade."]
      - ["Anti-thesis: proof is still missing", "Public reporting still says Flourish has no commercial product, no demonstrated benchmark, and no customer or revenue proof in the assigned source set.", "An external benchmark, pilot, or signed design partner would move the company from concept to investable diligence."]
      - ["Anti-thesis: comparables already show deployment", "Project Astra is already in trusted-tester productization, and Groq is already powering sovereign inference infrastructure for Bell.", "Flourish needs evidence that its architecture can clear a commercialization bar already visible in the market."]
    notes: >-
      Comparable references are directional rather than valuation-equivalent because the retained
      evidence mixes research prototypes, deployed inference infrastructure, and market data.
    claimRefs: [CV001, CV003, CV006, CV009, CV010, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "Flourish publishes an independent benchmark, secures a credible design partner or acquirer-grade collaboration, and shows a path from research to product.", "Paying the reported $2.5B mark becomes analyzable only after proof, but the assigned evidence still cannot support an upside valuation range or target return.", "Benchmark fails to generalize, partner economics are weak, or the proof arrives after the market window narrows.", "Needs new evidence not yet visible in the assigned public pool."]
      - ["Base", "The company keeps elite investors and technical intrigue, but still does not disclose customers, revenue, round terms, or external performance data.", "No numeric range is supportable from the assigned public evidence; entry should be milestone-contingent and priced below the reported mark until proof exists.", "Investors over-interpret optionality, and the next data point still lacks commercial relevance.", "Best fit for current evidence."]
      - ["Bear", "The next financing or internal mark arrives before benchmark or customer proof, or governance/preferences prove more investor-favorable than outsiders assume.", "A no-invest decision is supportable, but no defensible valuation floor is public; a down round or mark-down becomes the relevant risk rather than a precise bear-case price.", "Technical progress stalls, buyer appetite cools, or dilution/preference overhang becomes visible only late in diligence.", "Rises quickly if proof and terms remain private into the next funding event."]
    notes: >-
      Scenario logic is anchored to the reported June 2026 financing; the retained sources do not
      support numeric valuation ranges because they omit revenue, unit economics, cap-table terms,
      and a benchmarked model outcome.
    claimRefs: [CV001, CV005, CV007, CV012, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public valuation logic runs from a real market pain point to a proof gap that still overwhelms the current price.
    data:
      nodes:
        - id: pain
          label: "AI power and compute pain"
          summary: "Industry training compute and costs are still compounding rapidly."
        - id: pedigree
          label: "Founder pedigree + $500M backing"
          summary: "The round signals unusual investor appetite for the thesis."
        - id: proof-gap
          label: "No public product, benchmark, or customer proof"
          summary: "Public evidence still frames Flourish as a research lab."
        - id: comp-bar
          label: "Comparable bar already includes productization or deployed infra"
          summary: "Peers and adjacent programs show what commercialization evidence looks like."
        - id: asymmetry
          label: "Current price embeds future proof"
          summary: "The reported $2.5B mark leaves more downside than upside if proof slips."
        - id: call
          label: "Recommendation: research-more"
          summary: "Wait for benchmark, partner proof, or materially better entry terms."
      edges:
        - from: pain
          to: pedigree
          label: "Creates investor urgency"
        - from: pedigree
          to: proof-gap
          label: "Funds the thesis before proof"
        - from: proof-gap
          to: comp-bar
          label: "Raises the evidence bar"
        - from: comp-bar
          to: asymmetry
          label: "Makes price sensitivity critical"
        - from: asymmetry
          to: call
          label: "Supports waiting, not buying"
    approximationNotes: >-
      Logical sequence only; it illustrates the decision chain rather than a quantitative scoring model.
    claimRefs: [CV001, CV003, CV006, CV010, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Maintain a research-more posture until Flourish produces independent benchmark proof, a
      named commercialization signal, or a materially more forgiving entry price.
    claimRefs: [CV003, CV012, CV015]
  - calloutType: risk
    title: Primary downside trigger
    body: >-
      A financing event or internal mark before technical or commercial proof would likely expose
      the current round as founder-premium pricing and increase down-round risk.
    claimRefs: [CV005, CV016]
