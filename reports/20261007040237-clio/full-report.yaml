  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Key risks and triggers
    rows:
      - - Bull
        - >-
          Current ARR quality, retention, margins, and vLex cross-sell verify strong post-deal growth with manageable
          integration costs.
        - >-
          Value above the $5B reference is supportable only if verified earnings-quality growth offsets private-market
          and execution risk; no precise range is supportable.
        - Not observable from public evidence; requires audited KPIs and transaction terms.
        - Fails if enterprise adoption or integration economics trail plan.
      - - Base
        - Scale persists, but current economics and capitalization remain private while the company stays pre-IPO.
        - Track the $5B last-mark reference without treating it as fair value or assigning a target return.
        - Best aligned with the available last-mark evidence, but no defensible numeric probability can be assigned.
        - Reassess on a priced round, tender, audited KPI package, or filing.
      - - Bear
        - >-
          Growth or retention slows, integration raises cash needs, preferences impair common economics, or
          private-software multiples compress.
        - >-
          A value below the $5B reference and a down-round outcome become plausible; the evidence does not support a
          precise downside floor.
        - Material because price validation, liquidity, and preference data are absent.
        - Trigger on a financing below the last mark, margin deterioration, or unresolved material resilience events.
    notes: >-
      Scenario values are deliberately directional: public sources do not disclose the current revenue denominator,
      audited margins, cash flow, preference stack, or a live transaction price needed for numerical ranges.
