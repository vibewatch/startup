chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Market Positioning
        blocks:
          - type: paragraph
            body: >-
              Founded in 2008 by Jack Newton, Clio has established itself as the preeminent cloud-based software
              operating system for the legal services sector. Headquartered in Burnaby within the greater Vancouver
              metropolitan area in Canada, the business has expanded globally to support hundreds of thousands of legal
              practitioners across more than 130 countries. Clio's unified platform spans legal practice management,
              client intake, document automation, court calendaring, billing, and specialized legal accounting. Through
              its continuous multi-product expansion and deep ecosystem of over 250 integrations with bar associations
              and third-party software vendors, the company powers critical operational workflows for solo
              practitioners, small-to-midsize law firms, and corporate legal departments. The corporate mission centers
              on transforming the legal experience for all stakeholders by modernizing legal operations and reducing
              friction across case lifecycles.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
