  - id: TV001
    title: Recommendation summary
    columns:
      - Field
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / research more
        - Scale evidence is meaningful, but the current mark is not validated by a later priced round.
        - Do not underwrite a new entry until price and operating evidence reconcile.
      - - Confidence
        - Medium
        - >-
          Eight assigned sources provide financing, scale, transaction, and control context, but key private-company
          inputs are absent.
        - Maintain a conditional view rather than a conviction call.
      - - Risk rating
        - High
        - Funding datasets conflict, current economics are undisclosed, and liquidity is absent.
        - Require a wider diligence margin and downside protection.
      - - Valuation stance
        - Unverified to stretched
        - $5.0B is a last-mark/model reference without a live bid, ask, spread, or subsequent price test.
        - Treat $5.0B as a negotiation anchor, not fair value.
      - - Decision implication
        - Price-sensitive hold
        - >-
          The 2024 $3.0B Series F and later $5.0B reference show mark expansion without a comparable current operating
          denominator.
        - Advance only with verified KPI growth, cap-table terms, and a defensible return path.
    notes: >-
      Assessments use public financing marks and disclosed historical operating evidence; no current audited financials,
      cap table, preference stack, or live secondary quote was available.
