      - number: '3.3'
        title: Pricing, Packaging, and Switching Economics
        blocks:
          - type: paragraph
            body: >-
              Pricing evidence is directionally useful but not fully consistent. RFP.wiki reported that Clio publicly
              listed four annual tiers at $49, $89, $119, and $149 per user per month, while a later July 2026
              comparison said only a starting price remained public; another June comparison likewise described higher
              tiers as quote-based. This may reflect a page or packaging change, not a stable rate card. MyCase and
              PracticePanther publish broader ladders, whereas Filevine is described as custom-quoted and Smokeball uses
              a configurator. An implementation guide further estimates that Clio's add-ons can lift total cost
              materially, but those figures are not audited realized prices. Switching is also costly: the same guide
              describes multi-month migrations, parallel operation, retraining, and incomplete transfer of custom
              fields, reports, portal history, and automations. Buyers should model total workflow replacement rather
              than compare entry prices alone.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Clio's durable advantage is breadth: a large integration surface, a multi-product platform, and capital to
              extend into AI, payments, larger firms, and international markets. Its July 2024 Series F announcement
              reported a $900 million raise at a $3 billion valuation and more than $200 million of ARR at that time;
              these historical company claims establish scale but do not reveal current retention or unit economics. The
              countervailing risk is segmentation. Simpler firms can prefer transparent, consolidated packages, while
              document-heavy, accounting-heavy, and plaintiff practices may choose specialists. Trust posture is visible
              through a company-operated Trust Centre and status page, but the assigned snapshots provide neither a
              quantified uptime history nor independent comparative security evidence. The moat case is therefore
              credible on ecosystem breadth, but unproven on relative retention, multi-homing, and migration outcomes.
            claimRefs:
              - CP002
              - CP003
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth Creates Optionality
            body: >-
              Clio reports more than 250 integrations and describes a platform that joins core firm workflows; this
              gives buyers more ways to preserve an existing stack than a narrowly packaged product, even though
              integration depth must be tested individually.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP009
          - type: callout
            title: List Price Is Not Total Cost
            body: >-
              Published observations of Clio's 2026 pricing conflict, and independent commentary identifies add-ons,
              implementation, and third-party tools as meaningful cost drivers. Procurement should require a written
              all-in quote and migration scope before comparing vendors.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Architecture, and Stream Diversification
        blocks:
          - type: paragraph
            body: >-
              Clio monetizes primarily through a cloud-based software-as-a-service subscription architecture paired with
              embedded financial transaction processing [CI001, CI002]. Originally established as an on-premise
              replacement bundling matter and time management for solo and small law practices, Clio expanded its core
              subscription tiers into Starter, Essentials, Advanced, and Complete packages, with entry pricing starting
              at $49 per user per month billed annually, while advanced and enterprise tiers remain quote-gated [CI002,
              CI003]. The company has steadily diversified its revenue composition beyond pure practice management
              software by integrating Clio Payments in late 2021, which now processes billions of dollars in annual
              legal transactions and contributes substantial transaction take-rate fee revenue [CI004, CI005]. Further
              platform expansion includes Clio Grow for intake CRM, Clio Accounting for integrated firm finances, Clio
              Draft for court forms, and newer AI productivity capabilities via Clio Duo [CI002, CI004, CI006]. However,
              the broader legal software pricing dynamic faces structural tension: empirical research indicates that
              while 71% of solo practitioners and 75% of small firms have adopted artificial intelligence tools to
              shorten matter completion times, only 31% to 32% of these smaller practices have realized revenue growth
              due to reliance on traditional billable-hour pricing models rather than value-based flat fees [CI007,
              CI008].
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
