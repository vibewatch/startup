      - number: '1.4'
        title: Operational Scale and Platform Evolution
        blocks:
          - type: paragraph
            body: >-
              Clio's operational scale has accelerated through transformative mergers, international expansion, and
              artificial intelligence product launches. Following its acquisition of UK case management software
              provider ShareDo in March 2025—now rebranded as Clio Operate—the company launched Clio for Enterprise to
              capture mid-market and large law firm clients. In October 2025, Clio introduced its Intelligent Legal Work
              Platform and flagship Clio Work environment, integrating generative AI with matter context. By November
              2025, Clio completed the US$1 billion purchase of vLex, unifying case management with global legal
              intelligence and legal databases. Consequently, Clio surpassed US$500 million in annual recurring revenue
              (ARR) in mid-2026, supported by an international team of more than 1,100 personnel across offices in North
              America, Europe, Australia, and Latin America. Despite this scale, public diligence must monitor intense
              competition across 958 market alternatives and ongoing enterprise contract adoption.
