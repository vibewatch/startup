      - number: '1.3'
        title: Capitalization, Valuation, and Stakeholder Profile
        blocks:
          - type: paragraph
            body: >-
              Clio has executed a highly deliberate financing strategy that pairs substantial growth equity with
              non-dilutive credit facilities. In July 2024, the company completed a landmark US$900 million Series F
              financing round led by New Enterprise Associates at a US$3 billion post-money valuation, featuring
              participation from Goldman Sachs Asset Management, Sixth Street Growth, CapitalG, and Tidemark alongside
              long-standing backers TCV and JMI Equity. In November 2025, Clio closed an additional US$500 million
              Series G equity round that raised its valuation to US$5 billion, concurrently securing a US$350 million
              conventional debt facility underwritten by Blackstone and Blue Owl Capital. This blended capital structure
              directly funded the US$1 billion acquisition of vLex while providing substantial balance sheet liquidity
              for ongoing research and strategic add-ons. Nevertheless, key terms including liquidation preference
              seniority, governance voting thresholds, and credit covenants remain private.
            claimRefs:
