  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - - Thesis
        - Clio disclosed more than $200M ARR and more than 1,000 US mid-sized firms in its 2024 Series F release.
        - Current audited ARR, retention, margin, and organic-growth evidence at or above the historical trajectory.
      - - Thesis
        - Oakley says vLex sold to Clio at a $1B valuation and that the combined platform exceeds $5B.
        - >-
          Verified integration synergies, enterprise renewal evidence, and profitable cross-sell would strengthen the
          case.
      - - Anti-thesis
        - Independent data providers disagree materially on Series G proceeds and cumulative funding.
        - A company-provided financing schedule and fully diluted capitalization table would resolve the discrepancy.
      - - Anti-thesis
        - The current price reference is not a live market quote and has not been graded against a later priced round.
        - A priced primary round, documented tender, or transaction with disclosed terms would improve price discovery.
    notes: >-
      This table separates issuer and partner claims from independent market-data caveats; company and investor
      statements are not treated as independent verification.
