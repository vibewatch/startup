figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological evolution of Clio from cloud legal software pioneer to scaled US$5B intelligent legal workflow
      platform.
    data:
      items:
        - label: Company Founded
          date: '2008'
          detail: Jack Newton co-founds Clio in Vancouver to pioneer cloud practice management for law firms.
          tone: neutral
        - label: Series B Financing
          date: 2012-01
          detail: Raises US$6M Series B round to expand cloud infrastructure and product development.
          tone: positive
        - label: Series E & Unicorn Status
          date: 2021-04
          detail: Secures US$110M Series E growth equity round, attaining unicorn status.
          tone: positive
        - label: Series F Growth Round
          date: 2024-07
          detail: Raises US$900M at a US$3B valuation led by NEA to accelerate international and AI expansion.
          tone: positive
        - label: ShareDo Acquisition
          date: 2025-03
          detail: Acquires UK-based case management provider ShareDo, rebranded as Clio Operate for enterprise firms.
          tone: positive
        - label: Intelligent Platform Launch
          date: 2025-10
          detail: Introduces Intelligent Legal Work Platform and flagship Clio Work unified AI workspace.
          tone: positive
        - label: Series G & vLex Acquisition
          date: 2025-11
          detail: Completes US$1B acquisition of vLex and closes US$500M Series G funding at US$5B valuation.
          tone: positive
        - label: US$500M ARR Milestone
          date: 2026-05
          detail: Surpasses US$500M in annual recurring revenue driven by enterprise adoption and AI workflows.
          tone: positive
