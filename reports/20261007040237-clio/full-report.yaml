      - number: '1.2'
        title: Executive Leadership and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Executive leadership remains anchored by CEO and co-founder Jack Newton, who has guided the company's
              trajectory for over eighteen years from early product-market fit to late-stage institutional scale. In
              2025, Clio expanded its executive tier with key appointments, including Chief Product Officer John Foreman
              to lead the Intelligent Legal Work Platform roadmap, and regional general managers overseeing North
              American and international operations. In parallel with its Series F financing, Tony Florence, Co-CEO of
              New Enterprise Associates (NEA), joined Clio's Board of Directors, providing experienced growth equity
              oversight. Following the US$1 billion acquisition of vLex, former vLex executives including co-founder
              Lluis Faus joined Clio to direct legal content strategy and database integration. However, formal
              governance transparency remains limited in public disclosures, as full board committee charters,
              independent director rosters, and formal succession planning frameworks are not publicly enumerated.
            claimRefs:
