        - Intake, basic matter management, time billing, client payments
        - Core foundational customer tier across US/Canada/UK
        - Monthly/annual SaaS subscription plus payment processing fees
        - High exposure to AI workflow disruption and fee stagnation
      - - Small Law Firms (2-19 attorneys)
        - Managing partner or firm administrator
        - Collaborative practice management, Grow AI lead capture, calendaring, accounting
        - Dominant volume share across 130 countries
        - Multi-seat SaaS tier, add-on modules (Draft, Grow AI)
        - Low pricing adjustments despite high AI tool experimentation
      - - Mid-Sized Law Firms (20-199 attorneys)
        - Executive committee, IT director, COO
        - Clio Manage, multi-office practice management, court filing integrations, BI
        - 1,000+ mid-sized law firms in the United States alone
        - High-ACV annual enterprise commitments, customized onboarding
        - Disclosure of ACV expansion and module attach rates missing
      - - Enterprise Legal & Large Practices (200+ users)
        - CIO, General Counsel, C-suite procurement
        - Clio Operate, Vincent legal research (vLex), governance, Salesforce integration
        - Emerging upmarket tier targeted by specialized enterprise GTM
        - Custom contract value, dedicated support, partner co-sell
        - Verification of renewal rates and standalone large-firm churn
    notes: >-
      Customer segments synthesized from official company releases, Series F announcements, and legal technology
      adoption data. Disaggregated ARR breakdown by customer segment is not publicly reported.
    claimRefs:
