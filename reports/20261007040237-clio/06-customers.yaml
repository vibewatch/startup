callouts:
  - calloutType: insight
    title: The AI Productivity vs Revenue Capture Disconnect
    body: >-
      While legal AI adoption among small law firms has reached 75%, the failure of over 70% of these firms to grow
      revenue highlights a structural risk in legal software: efficiency gains under hourly billing models accrue to
      clients unless firms transition to value-based or fixed-fee pricing.
    claimRefs:
      - CU010
      - CU011
      - CU012
  - calloutType: risk
    title: Partner Channel Operational Dependencies
    body: >-
      As Clio relies increasingly on indirect channel partners and resellers to penetrate international markets and
      upmarket segments, manual partner portal overhead and attribution disputes create friction in partner-sourced
      customer acquisition.
    claimRefs:
      - CU013
      - CU014
