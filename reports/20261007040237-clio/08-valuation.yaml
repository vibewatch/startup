company:
  name: "Clio"
chapter:
  number: 8
  title: "Valuation"
  summary: "Clio has a credible scale and platform-expansion case, but the public record supports only a track / research-more recommendation at the $5 billion reference mark. Conflicting Series G and cumulative-funding figures, the absence of a live private-market quote, and missing current operating and preference data make a precise valuation range or target return indefensible."
sections:
  - id: "price-and-financing-evidence"
    title: "Price and financing evidence"
    body: >-
      The strongest current price reference is QuantLogix's $5.0 billion estimate, aligned
      to what it describes as the last disclosed Series G mark, rather than a continuously
      traded price. QuantLogix explicitly says no later priced round has tested its estimate
      and that its June 2026 secondary indication has no bid, ask, or spread. Funding
      datasets also conflict: FundedIQ records a $500 million Series G and $610 million
      raised across two recorded rounds, while QuantLogix reports $2.2 billion raised and
      describes an $850 million Series G. The providers agree only on the broad timing of
      the latest financing in November 2025. Clio's own older benchmark is a $900 million
      Series F at a $3 billion valuation. These records establish financing momentum, but
      not a clean current cap table, fully reconciled proceeds, or an investable price.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV001]
  - id: "thesis-and-scenarios"
    title: "Thesis, anti-thesis, and scenario logic"
    body: >-
      The thesis rests on demonstrated historical scale and a broader platform: Clio
      disclosed more than $200 million of ARR and more than 1,000 US mid-sized firms at
      the 2024 financing, while Oakley says the vLex transaction occurred at a $1 billion
      valuation and that the combined business exceeds $5 billion. The anti-thesis is that
      these facts do not disclose current organic growth, retention, gross margin, cash
      generation, integration costs, or preference seniority. The fetched Trust Centre
      confirms a dated SOC 2 Type II report, but the assigned status-page text provides no
      historical incident detail suitable for resilience underwriting. Bull, base, and
      bear outcomes therefore use qualitative gates rather than false numerical
      probabilities or unsupported terminal multiples. A higher value requires verified
      post-acquisition growth and durable economics; the base case tracks the last mark;
      and the bear case captures a down-round or multiple-compression outcome below it.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV002, TV003]
  - id: "decision-and-diligence"
    title: "Decision, exit readiness, and diligence gates"
    body: >-
      The recommendation is track / research more, with medium confidence, high risk, and
      an unverified-to-stretched valuation stance. Clio's financing history, disclosed ARR
      scale, mid-market reach, and vLex expansion support continued monitoring, but they do
      not justify underwriting a purchase at the $5 billion reference without current
      audited operating data and security terms. Exit readiness is also incomplete:
      QuantLogix reports that Clio remains private and has no public S-1, so neither an IPO
      timetable nor a liquid price can be assumed. The decision should improve only after
      reconciliation of the Series G proceeds, delivery of the fully diluted cap table and
      preference stack, verification of current ARR quality and cash generation, and
      evidence that vLex integration improves enterprise retention. Thesis-break triggers
      are a financing below the last mark, deterioration in retention or margins,
      integration-driven cash strain, or material resilience issues not offset by tested
      controls.
    claimRefs: [CV004, CV006, CV007, CV008, CV009, CV011, CV013, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Field", "Assessment", "Evidence basis", "Decision implication"]
    rows:
      - ["Recommendation", "Track / research more", "Scale evidence is meaningful, but the current mark is not validated by a later priced round.", "Do not underwrite a new entry until price and operating evidence reconcile."]
      - ["Confidence", "Medium", "Eight assigned sources provide financing, scale, transaction, and control context, but key private-company inputs are absent.", "Maintain a conditional view rather than a conviction call."]
      - ["Risk rating", "High", "Funding datasets conflict, current economics are undisclosed, and liquidity is absent.", "Require a wider diligence margin and downside protection."]
      - ["Valuation stance", "Unverified to stretched", "$5.0B is a last-mark/model reference without a live bid, ask, spread, or subsequent price test.", "Treat $5.0B as a negotiation anchor, not fair value."]
      - ["Decision implication", "Price-sensitive hold", "The 2024 $3.0B Series F and later $5.0B reference show mark expansion without a comparable current operating denominator.", "Advance only with verified KPI growth, cap-table terms, and a defensible return path."]
    notes: "Assessments use public financing marks and disclosed historical operating evidence; no current audited financials, cap table, preference stack, or live secondary quote was available."
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV007, CV009, CV010, CV011]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Lens", "Evidence-backed argument", "What would change the view"]
    rows:
      - ["Thesis", "Clio disclosed more than $200M ARR and more than 1,000 US mid-sized firms in its 2024 Series F release.", "Current audited ARR, retention, margin, and organic-growth evidence at or above the historical trajectory."]
      - ["Thesis", "Oakley says vLex sold to Clio at a $1B valuation and that the combined platform exceeds $5B.", "Verified integration synergies, enterprise renewal evidence, and profitable cross-sell would strengthen the case."]
      - ["Anti-thesis", "Independent data providers disagree materially on Series G proceeds and cumulative funding.", "A company-provided financing schedule and fully diluted capitalization table would resolve the discrepancy."]
      - ["Anti-thesis", "The current price reference is not a live market quote and has not been graded against a later priced round.", "A priced primary round, documented tender, or transaction with disclosed terms would improve price discovery."]
    notes: "This table separates issuer and partner claims from independent market-data caveats; company and investor statements are not treated as independent verification."
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV007, CV011, CV012, CV013, CV014]
  - id: "TV003"
    title: "Bull, base, and bear scenarios"
    columns: ["Case", "Assumptions", "Valuation / return logic", "Probability signal", "Key risks and triggers"]
    rows:
      - ["Bull", "Current ARR quality, retention, margins, and vLex cross-sell verify strong post-deal growth with manageable integration costs.", "Value above the $5B reference is supportable only if verified earnings-quality growth offsets private-market and execution risk; no precise range is supportable.", "Not observable from public evidence; requires audited KPIs and transaction terms.", "Fails if enterprise adoption or integration economics trail plan."]
      - ["Base", "Scale persists, but current economics and capitalization remain private while the company stays pre-IPO.", "Track the $5B last-mark reference without treating it as fair value or assigning a target return.", "Best aligned with the available last-mark evidence, but no defensible numeric probability can be assigned.", "Reassess on a priced round, tender, audited KPI package, or filing."]
      - ["Bear", "Growth or retention slows, integration raises cash needs, preferences impair common economics, or private-software multiples compress.", "A value below the $5B reference and a down-round outcome become plausible; the evidence does not support a precise downside floor.", "Material because price validation, liquidity, and preference data are absent.", "Trigger on a financing below the last mark, margin deterioration, or unresolved material resilience events."]
    notes: "Scenario values are deliberately directional: public sources do not disclose the current revenue denominator, audited margins, cash flow, preference stack, or a live transaction price needed for numerical ranges."
    claimRefs: [CV004, CV006, CV007, CV008, CV009, CV010, CV011, CV013, CV015, CV016]
