        - id: "decision"
          label: "Track / research more"
          detail: "Advance only if verified economics and terms create a defensible return path."
    approximationNotes: "The flow is qualitative and ordered; it does not assign probabilities, derive a valuation, or imply that the evidence inputs share a numeric scale."
    claimRefs: [CV004, CV006, CV011, CV013, CV015, CV016]
callouts:
  - calloutType: "recommendation"
    title: "Price discipline controls the call"
    body: "The company can be attractive while the security is unattractive: the $5 billion reference is insufficient without current KPI quality, seniority, dilution, and liquidity terms."
    claimRefs: [CV004, CV006, CV008, CV009, CV011]
