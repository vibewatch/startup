  evidenceGaps:
    - type: "conflicting-data"
      severity: "material"
      topic: "financing discrepancy"
      missingEvidence: "Primary financing documents reconciling Series G primary proceeds, secondary components, acquisition financing, and cumulative capital raised."
      whyItMatters: "The difference between the reported $500 million and $850 million round sizes affects dilution, cash availability, and interpretation of the $5 billion mark."
      diligencePath: "Obtain the Series G closing set, capitalization table, funds-flow memorandum, and management reconciliation to each public figure."
      relatedQuestionRefs: [QV003, QV006]
    - type: "private-evidence-only"
      severity: "material"
      topic: "capital structure"
      missingEvidence: "Fully diluted ownership, liquidation preferences, participation rights, anti-dilution provisions, debt terms, and employee-option overhang."
      whyItMatters: "Headline enterprise value does not determine investor proceeds when seniority, dilution, and debt are unknown."
      diligencePath: "Review the charter, investor-rights agreements, debt documents, option ledger, and pro forma waterfall at the proposed entry price."
      relatedQuestionRefs: [QV006]
    - type: "private-evidence-only"
      severity: "material"
      topic: "operating economics"
      missingEvidence: "Current audited ARR bridge, organic growth, gross margin, NRR and GRR, cash flow, customer concentration, and vLex integration costs."
      whyItMatters: "Without a current operating denominator and earnings-quality evidence, no defensible forward multiple or target return can be calculated."
      diligencePath: "Request audited financials, monthly KPI cohorts, revenue-quality bridge, customer concentration schedule, and standalone versus combined integration plan."
      relatedQuestionRefs: [QV002, QV005, QV008]
    - type: "missing-source"
      severity: "material"
      topic: "exit and liquidity"
      missingEvidence: "A verified IPO timetable, tender terms, recurring secondary-market depth, or another transaction with disclosed security terms."
      whyItMatters: "A last-round mark cannot establish realizable exit value, timing, or liquidity."
      diligencePath: "Review board-approved exit planning, banker materials, tender documentation, secondary indications with spreads, and any confidential filing status."
      relatedQuestionRefs: [QV002, QV007]
    - type: "enumeration-incomplete"
      severity: "minor"
      topic: "comparable set"
      missingEvidence: "A current, model-consistent set of public legal-software multiples and disclosed private or M&A transactions with comparable growth and margin profiles."
      whyItMatters: "The broad IT funding median, historical Clio rounds, and vLex transaction do not establish a normalized trading or transaction multiple."
      diligencePath: "Build a banker-verified comparable set after current Clio revenue, growth, margin, and security terms are available."
      relatedQuestionRefs: [QV004, QV008]
