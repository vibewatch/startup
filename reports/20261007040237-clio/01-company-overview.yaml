chapter:
  number: 1
  title: "Company Overview"
  summary: "Clio is a cloud-based legal technology market leader that has scaled to US$500M+ in ARR and a US$5B valuation backed by NEA, TCV, and Goldman Sachs, transforming from practice management into an enterprise legal operating system via strategic acquisitions including vLex and ShareDo."
sections:
  - id: corporate-identity-and-mission
    title: Corporate Identity and Market Positioning
    body: "Founded in 2008 by Jack Newton, Clio has established itself as the preeminent cloud-based software operating system for the legal services sector. Headquartered in Burnaby within the greater Vancouver metropolitan area in Canada, the business has expanded globally to support hundreds of thousands of legal practitioners across more than 130 countries. Clio's unified platform spans legal practice management, client intake, document automation, court calendaring, billing, and specialized legal accounting. Through its continuous multi-product expansion and deep ecosystem of over 250 integrations with bar associations and third-party software vendors, the company powers critical operational workflows for solo practitioners, small-to-midsize law firms, and corporate legal departments. The corporate mission centers on transforming the legal experience for all stakeholders by modernizing legal operations and reducing friction across case lifecycles."
    claimRefs:
      - CO001
      - CO002
      - CO003
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Executive Leadership and Governance Structure
    body: "Executive leadership remains anchored by CEO and co-founder Jack Newton, who has guided the company's trajectory for over eighteen years from early product-market fit to late-stage institutional scale. In 2025, Clio expanded its executive tier with key appointments, including Chief Product Officer John Foreman to lead the Intelligent Legal Work Platform roadmap, and regional general managers overseeing North American and international operations. In parallel with its Series F financing, Tony Florence, Co-CEO of New Enterprise Associates (NEA), joined Clio's Board of Directors, providing experienced growth equity oversight. Following the US$1 billion acquisition of vLex, former vLex executives including co-founder Lluis Faus joined Clio to direct legal content strategy and database integration. However, formal governance transparency remains limited in public disclosures, as full board committee charters, independent director rosters, and formal succession planning frameworks are not publicly enumerated."
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO010
      - CO014
    tableRefs:
      - TO002
  - id: capitalization-and-ownership
    title: Capitalization, Valuation, and Stakeholder Profile
    body: "Clio has executed a highly deliberate financing strategy that pairs substantial growth equity with non-dilutive credit facilities. In July 2024, the company completed a landmark US$900 million Series F financing round led by New Enterprise Associates at a US$3 billion post-money valuation, featuring participation from Goldman Sachs Asset Management, Sixth Street Growth, CapitalG, and Tidemark alongside long-standing backers TCV and JMI Equity. In November 2025, Clio closed an additional US$500 million Series G equity round that raised its valuation to US$5 billion, concurrently securing a US$350 million conventional debt facility underwritten by Blackstone and Blue Owl Capital. This blended capital structure directly funded the US$1 billion acquisition of vLex while providing substantial balance sheet liquidity for ongoing research and strategic add-ons. Nevertheless, key terms including liquidation preference seniority, governance voting thresholds, and credit covenants remain private."
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO007
      - CO013
    tableRefs:
      - TO003
  - id: operational-scale-and-milestones
    title: Operational Scale and Platform Evolution
    body: "Clio's operational scale has accelerated through transformative mergers, international expansion, and artificial intelligence product launches. Following its acquisition of UK case management software provider ShareDo in March 2025—now rebranded as Clio Operate—the company launched Clio for Enterprise to capture mid-market and large law firm clients. In October 2025, Clio introduced its Intelligent Legal Work Platform and flagship Clio Work environment, integrating generative AI with matter context. By November 2025, Clio completed the US$1 billion purchase of vLex, unifying case management with global legal intelligence and legal databases. Consequently, Clio surpassed US$500 million in annual recurring revenue (ARR) in mid-2026, supported by an international team of more than 1,100 personnel across offices in North America, Europe, Australia, and Latin America. Despite this scale, public diligence must monitor intense competition across 958 market alternatives and ongoing enterprise contract adoption."
    claimRefs:
      - CO005
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO014
    figureRefs:
      - FO001
