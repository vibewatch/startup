      severity: material
      topic: architecture
      missingEvidence: >-
        Current production architecture diagrams, service and data boundaries, hosting and
        subprocessor inventory, tenancy model, capacity tests, and AI model-evaluation controls.
      whyItMatters: >-
        Product-layer evidence cannot establish scalability, isolation, data governance, or
        failure containment in the production environment.
      diligencePath: >-
        Request an architecture review with engineering leadership plus current diagrams,
        dependency inventories, capacity tests, and model-governance documentation.
      relatedQuestionRefs: [QE003]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: >-
        Component-level uptime history, incident and severity log, recovery-time and
        recovery-point performance, backup-restore tests, and status-page history.
      whyItMatters: >-
        A public status URL and the absence of an incident in retained text do not establish
        availability, operational resilience, or disaster-recovery effectiveness.
      diligencePath: >-
        Obtain the prior 24 months of incident records, service-level performance,
        post-incident reviews, and witnessed backup and disaster-recovery test results.
      relatedQuestionRefs: [QE005]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: >-
        The full SOC 2 report, control exceptions, penetration-test scope and remediation,
        data-residency map, subprocessor list, and enterprise permission test results.
      whyItMatters: >-
