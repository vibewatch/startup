    title: "Decoupling Law Firm Revenue from Headcount via Legal AI"
    body: "Data from the 2025 Clio Legal Trends Report indicates a structural shift in legal practice economics: growing law firms nearly doubled their revenue over four years while increasing matter volume by only 50%, utilizing AI automations to drive higher realized revenue per matter without proportional hiring."
    claimRefs:
      - "CM002"
      - "CM003"
  - calloutType: "risk"
    title: "Adoption Friction from Generic AI Substitution and Hourly Billing"
    body: "The commercial upside of legal-specific software is contested by two distinct headwinds: adoption of legal-specific AI tools declined from 58% to 40% as practitioners substitute free generic LLMs, while 45% of heavy AI-adopting firms have been forced to restructure traditional hourly billing models that penalize task automation."
    claimRefs:
      - "CM002"
      - "CM014"
