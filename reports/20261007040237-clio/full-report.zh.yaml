      - number: '4.3'
        title: 资本结构、融资依赖与投资判断结论
        blocks:
          - type: paragraph
            body: >-
              Clio 获得了大量机构资本支持，包括 2024 年 7 月由 New Enterprise Associates 领投、CapitalG、Sixth Street Growth 和 Goldman Sachs
              Asset Management 参与的 US$900 million Series F，估值 US$3 billion；随后又完成 US$500 million Series G，估值 US$5
              billion，并取得由 Blackstone 和 Blue Owl Capital 共同牵头的 US$350 million 授信额度 [CI012, CI014, CI015]。累计融资超过 US$1.7
              billion，资产负债表资本极其充足、现金跑道很长，近期偿付能力风险已基本消除
              [CI014]。但投资判断有两个关键结构性保留：第一，后期融资中相当一部分是向早期投资者、创始人和员工购买二级股份，为其提供流动性，而非增加运营跑道所需的资产负债表现金 [CI016]。第二，vLex 和
              ShareDo 等大型收购带来持续整合工作和资本投入承诺，需要在 Clio 现有 400,000 名法律专业人士基础上持续交叉销售 [CI011, CI014]。投资方应先取得经审计的支付 take
              rate、队列毛留存和准确债务契约条款，再确定终值估值倍数。
            claimRefs:
              - CI011
              - CI012
              - CI014
              - CI015
              - CI016
