              Clio 的客户基础扎根于广泛的个人及小型律所市场，同时积极扩展到中端市场和多办公室法律业务。公司称服务覆盖 130 多个国家的超过 150,000 名法律专业人士，并获得全球超过 100
              家律师协会和法律学会的正式认可，包括美国全部 50 个州律师协会。在中端市场，Clio 已进入超过 1,000 家拥有 20 名或更多律师的律所，采购决策从个人律师转向律所行政人员、管理合伙人和 IT
