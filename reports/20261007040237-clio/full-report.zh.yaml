          - type: callout
            title: 不要把相互冲突的融资数据正常化
            body: 在一级融资文件核对轮次规模、一级所得以及任何与收购相关的融资之前，$500 million 和 $850 million 的 Series G 记录应继续作为明确差异保留。
            calloutType: risk
            claimRefs:
