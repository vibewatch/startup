    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与市场定位
        blocks:
          - type: paragraph
            body: >-
              Clio 由 Jack Newton 于 2008 年创立，已成为法律服务行业领先的云端软件操作系统。公司总部位于加拿大大温哥华地区的 Burnaby，业务已扩展至全球，服务覆盖 130
              多个国家的数十万名法律从业者。Clio 的统一平台涵盖法律事务管理、客户接待、文档自动化、法院日历、计费和专业法律会计。公司持续扩展多产品，并与律师协会及第三方软件供应商建立超过 250
              个集成，支撑个人执业者、中小律所和企业法务部门的关键运营工作流。公司使命是通过现代化法律运营、减少案件全生命周期中的摩擦，改善所有利益相关者的法律体验。
