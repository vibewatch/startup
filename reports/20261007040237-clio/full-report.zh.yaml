      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 生成式 AI 责任与职业责任边界
            body: >-
              Clio 快速整合 Vincent AI 和 GPT-5.6，使律师客户面临显著职业责任暴露。虽然 Clio 对模型供应商执行零留存政策，但法院会让执业律师对虚假引文或不准确法律文书承担严格责任。如果 Clio
              的 AI 工具产生重大错误，律所将面临制裁风险，平台信任也会受损。
            calloutType: risk
            claimRefs:
              - CR001
              - CR007
              - CR008
          - type: callout
            title: 内部金融科技与支付整合的双刃剑
            body: >-
              Clio 在 2026 年 8 月终止 LawPay 集成并引导律所转向 Clio Payments 和 Stripe，可以获取更高支付 take rate，但也同时增加金融交易对手风险。围绕 LawPay
              搭建运营工作流的个人及精品律所会遇到摩擦，从而加快对竞争平台的评估。
            calloutType: insight
            claimRefs:
