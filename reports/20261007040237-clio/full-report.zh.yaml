        - 公司提供的融资明细和完全稀释股权结构表可以消除这一差异。
      - - 反论点
        - 当前价格参考不是实时市场报价，也未根据后续定价轮进行分级验证。
        - 定价的一级融资轮、有记录的要约收购或披露条款的交易将改善价格发现。
