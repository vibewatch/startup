            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: 投资论点、反论点与情景逻辑
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在已证明的历史规模和更广泛的平台之上：Clio 在 2024 年融资时披露 ARR 超过 $200 million、美国中型律所超过 1,000 家；Oakley 称 vLex 交易按 10 US$1
              billion 估值完成，合并后业务超过 US$5 billion。反论点是，这些事实没有披露当前有机增长、留存、毛利率、现金创造、整合成本或优先权级别。抓取的 Trust Centre 确认了一份有日期的
              SOC 2 Type II
              报告，但指定状态页文本没有适合做韧性投资判断的历史事件细节。因此，乐观、基准和悲观结果采用定性门槛，而非虚假的数值概率或无依据的终值倍数。更高估值需要经验证的收购后增长和持久经济性；基准情景跟踪最近一次估值标记；悲观情景则计入低于该标记的下轮融资或倍数压缩结果。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: 决策、退出准备度与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              建议为继续跟踪 / 进一步研究，信心中等、风险高，估值判断处于未经验证至偏高区间。Clio 的融资历史、已披露的 ARR 规模、中端市场触达和 vLex
              扩张支持继续观察，但在缺少最新经审计经营数据和证券条款的情况下，不足以按 $5 billion 参考估值评估买入。退出准备度也不完整：QuantLogix 报告称 Clio 仍为非上市公司，且没有公开
              S-1，因此不能假定 IPO 时间表或可交易价格。只有在核对 Series G 募资所得、取得完全稀释后的股权结构表及优先股堆叠、验证当前 ARR 质量和现金创造能力，并证明 vLex
              整合能改善企业客户留存后，决策依据才应改善。触发论点失效的因素包括低于上次估值的融资、留存率或利润率恶化、整合导致的现金压力，以及未经测试的控制措施无法抵消的重大韧性问题。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV015
              - CV016
          - type: figure
