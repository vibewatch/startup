      - number: '3.3'
        title: 定价、套餐与迁移经济学
        blocks:
          - type: paragraph
            body: >-
              定价证据有方向性参考价值，但并不完全一致。RFP.wiki 报道 Clio 公开列出四个年度档位，分别为每用户每月 $49、$89、$119 和 $149；而 2026 年 7
              月较晚的比较称公开信息只剩起始价格，另一份 6 月比较也称更高档位按报价确定。这可能反映页面或套餐变化，而不是稳定价目表。MyCase 和 PracticePanther 公布了更宽的价格梯度，Filevine
              按定制报价，Smokeball 则使用配置器。实施指南进一步估计，Clio
              增值模块可能显著抬高总成本，但这些数字并非经审计的实际成交价。迁移同样代价高昂：同一指南描述了数月迁移、并行运行、再培训，以及自定义字段、报告、门户历史和自动化的不完整转移。买方应建模完整工作流替换，而不只是比较入门价格。
