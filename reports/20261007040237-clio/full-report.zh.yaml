            body: >-
              CEO 兼联合创始人 Jack Newton 仍是管理核心；从早期找到产品市场契合到后期机构化扩张，他已带领公司超过 18 年。2025 年，Clio 扩充高管层，任命 John Foreman
              为首席产品官，负责 Intelligent Legal Work Platform 路线图，并增设负责北美及国际业务的区域总经理。Series F 融资期间，New Enterprise
              Associates（NEA）联席 CEO Tony Florence 加入董事会，带来成长股权监督经验。Clio 以 US$1 billion 收购 vLex 后，vLex 联合创始人 Lluis Faus
              等前高管加入 Clio，负责法律内容战略和数据库整合。不过，公开披露中的正式治理透明度仍有限：完整的董事会委员会章程、独立董事名单和正式继任规划框架均未公开列明。
