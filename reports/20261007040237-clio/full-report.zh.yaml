      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              法律软件的采用动态会随律所规模、专业角色和内部预算治理而明显分化。在个人及精品律所（1 至 10
              名法律专业人士）中，经济买方与日常终端用户通常是同一人：创始管理合伙人或个人律师掌握可支配运营现金流，并直接以节省时间、客户计费便利性和合规保护评估软件 [CM003,
              CM005]。这一细分的采购周期很快，通常通过自助试用和月度信用卡付费完成，但价格敏感度仍高 [CM005, CM012]。中型律所（11 至 99
              名法律专业人士）的采购权转向正式管理委员会、业务组负责人或专职法律行政人员 [CM007, CM008]。中端市场买方看重跨部门协同、案件承载能力扩张和正式合规认证，例如年度 SOC 2 Type II
              审计；目前 60% 的中型律所已执行 AI 部署政策 [CM007, CM013]。大型律所（100+ 名律师）和企业法务部门则采用结构化 RFP、专门 IT
              安全审查及首席信息官审批，系统必须深度接入既有文档管理库和企业案件管理套件 [CM001, CM002]。所有层级共同的运营催化剂是客户服务预期：79% 的法律专业人士称在执业中使用
              AI，成长型律所积极采用自动预约咨询、数字化入职和透明的在线支付，以提高案件吞吐量而不增加律师人数 [CM002, CM003, CM005]。
            claimRefs:
