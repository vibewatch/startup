        title: 展示项
        blocks:
          - type: callout
            title: 价格纪律决定结论
            body: 公司可能有吸引力，但其证券未必有吸引力：如果缺少当前 KPI 质量、受偿顺位、稀释和流动性条款，$5 billion 参考估值并不足够。
            calloutType: recommendation
            claimRefs:
              - CV004
