      - number: '3.4'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Clio 的持久优势在于广度：庞大的集成面、多产品平台，以及向 AI、支付、大型律所和国际市场扩张的资本。其 2024 年 7 月 Series F 公告披露融资 $900 million、估值 $3
              billion，当时 ARR 超过 $200
              million；这些历史公司口径证明了规模，但未揭示当前留存或单位经济。反向风险在于细分化：更简单的律所可能偏好透明的统一套餐，而文档密集、会计密集和原告业务律所可能选择专业供应商。公司运营的 Trust
              Centre 和状态页让信任姿态可见，但指定快照既没有量化正常运行历史，也没有独立的可比安全证据。因此，壁垒在生态广度上可信，但在相对留存、多平台并用和迁移结果上未经证明。
