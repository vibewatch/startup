figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Clio 从云端法律软件先驱发展为规模化的 US$5B 智能法律工作流平台的时间演进。
    data:
      items:
        - label: 公司成立
          date: '2008'
          detail: Jack Newton 在 Vancouver 共同创办 Clio，开创面向律师事务所的云端业务管理。
          tone: neutral
        - label: Series B 融资
          date: 2012-01
          detail: 完成 US$6M 的 Series B 融资，用于扩展云基础设施和产品开发。
          tone: positive
        - label: Series E 与独角兽地位
          date: 2021-04
          detail: 获得 US$110M 的 Series E 成长股权融资，达到独角兽地位。
          tone: positive
        - label: Series F 成长轮
          date: 2024-07
          detail: 在 NEA 领投下以 US$3B 估值融资 US$900M，加速国际化和 AI 扩张。
          tone: positive
        - label: 收购 ShareDo
          date: 2025-03
          detail: 收购英国案件管理提供商 ShareDo，并为企业律师事务所重新命名为 Clio Operate。
          tone: positive
        - label: 智能平台上线
          date: 2025-10
          detail: 推出 Intelligent Legal Work Platform 及旗舰产品 Clio Work 统一 AI 工作空间。
          tone: positive
        - label: Series G 与收购 vLex
          date: 2025-11
          detail: 完成对 vLex 的 US$1B 收购，并完成 US$500M 的 Series G 融资，估值 US$5B。
          tone: positive
        - label: US$500M ARR 里程碑
          date: 2026-05
          detail: 在企业采用和 AI 工作流推动下，年度经常性收入超过 US$500M。
          tone: positive
    approximationNotes: 里程碑日期和融资指标反映已确认的新闻公告及公司披露时间线。
    claimRefs:
      - CO001
      - CO005
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从全球法律科技支出的宽泛市场逐层收窄至 Clio 可触达并已获取的 ARR 规模。
    approximationNotes: TAM 反映分析师对全球法律软件和技术的宽泛预测；SAM 代表核心云端法律业务管理、账单和客户接入；SOM 反映 Clio 在 2026 年已验证的 US$500M ARR 里程碑。
    claimRefs:
      - CM001
      - CM009
      - CM010
    data:
      items:
        - label: 'TAM: 全球法律技术支出'
          value: 30000
          unit: USD M
          detail: 覆盖律师事务所和法律部门全部软件、法律 AI、基础设施及 IT 支出的全球宽泛市场
        - label: 'SAM: 云端法律业务管理与运营'
          value: 5000
          unit: USD M
          detail: 面向云端业务管理、客户接入 CRM、法律会计和嵌入式支付的可触达市场
        - label: 'SAM Segment: 中端市场云端机会'
          value: 1200
          unit: USD M
          detail: 中型律师事务所的可触达云端业务管理支出，其中 43% 仍依赖传统本地部署系统
        - label: 'SAM Segment: 个体与小型业务云端支出'
          value: 2500
          unit: USD M
          detail: 已高比例采用的层级：71% 至 74% 的业务已转向云端运营平台
        - label: 'SOM: Clio 已验证的年度经常性收入'
          value: 500
          unit: USD M
          detail: Clio 在 2026 年于 130+ 个国家实现的实际 ARR 规模，约占 SAM 的 10%
        - label: SOM Pre-Series G Scale Benchmark
          value: 200
          unit: USD M
          detail: Series F、Series G 融资及收购 vLex 之前达到的历史规模基准
  - id: FP001
    title: 竞争定位：广度与定价透明度
    type: quadrant
    summary: 有证据支持的序数定位显示，Clio 在产品广度上领先，而公开定价的竞争对手在透明度上领先。
    data:
      points:
        - label: Clio
          x: 5
          'y': 2
          detail: 平台广度大，拥有 250+ 个集成；高端价格可见性相互矛盾。
        - label: MyCase
          x: 4
          'y': 5
          detail: 整合业务工作流，并完整公开留存套餐层级。
        - label: PracticePanther
          x: 3
          'y': 5
          detail: 通用业务广度较大，所有留存套餐均已公开。
        - label: CosmoLex
          x: 3
          'y': 4
          detail: 以会计为核心，公开基础套餐，但附加成本尚未解决。
        - label: Smokeball
          x: 4
          'y': 3
          detail: 文件自动化能力深，配有配置器，价格取决于合同。
        - label: Filevine
          x: 4
          'y': 1
          detail: 原告业务工作流深，采用定制且未公开的定价。
    approximationNotes: 分析师仅依据已分配证据给出的 1（低）至 5（高）序数评分；x 衡量工作流 / 生态广度，y 衡量公开定价透明度。评分不是供应商绩效指标。
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP013
  - id: FI001
    title: Clio 收入模型桥接
    type: waterfall
    summary: 示意性瀑布模型展示客户法律事务活动如何转化为经常性软件订阅、支付处理费和平台毛利。
    data:
      items:
        - label: 客户流入事务
          value: 100
        - label: 接入与 CRM 转化
          value: 25
        - label: 业务管理 SaaS
          value: 45
        - label: 嵌入式支付规模
          value: 20
        - label: 服务交付成本
          value: -22
        - label: 平台净毛利
          value: 68
    approximationNotes: 示意性相对指数以 100 个基准单位归一化，用于展示软件许可、交易处理和交付 COGS 的变现转化。
    claimRefs:
      - CI001
      - CI004
      - CI005
  - id: FE001
    title: 有证据支持的产品架构图
    type: stack
    summary: 按产品层展示留存的公开证据，并刻意排除未经验证的基础设施和数据流假设。
    data:
      layers:
        - label: 法律工作流层
          detail: 公司描述的客户接入、事务、账单、支付和会计界面。
          items:
            - label: 客户接入与事务管理
              detail: 公司描述的核心运营工作流
            - label: 账单、支付与会计
              detail: 多产品平台中列出的财务界面
        - label: 文件工作流层
          detail: 用于创建、管理和审阅法律文件的已上线及持续扩展工具。
          items:
            - label: 文件管理系统
              detail: 最近上线的 V1，正在推进面向大型律师事务所的扩展
            - label: Clio Draft
              detail: Word 模板、问卷、条件逻辑和电子签名
        - label: 数据连接层
          detail: 复用事务数据并连接工作流界面的产品连接。
          items:
            - label: Clio Manage 数据连接
              detail: 事务数据可以填充 Draft 模板
            - label: 共享工作流上下文
              detail: 产品论点围绕相互连接的事务记录组织法律工作
        - label: 生态层
          detail: 扩展公司描述的产品套件的第三方连接能力。
          items:
            - label: 集成市场
              detail: 2024 年宣称拥有超过 250 个集成
            - label: 专业应用
              detail: 竞争对手撰写的比较强调可配置的外部工具集
        - label: 产品交付层
          detail: 公开招聘信息体现研究、设计、工程、测试和迭代活动。
          items:
            - label: 跨职能研发
              detail: 产品、设计和工程被描述为并列的研发支柱
            - label: 从业者反馈
              detail: 招聘文本描述直接用户研究和 V1 后迭代
        - label: 信任与运营层
          detail: 公开治理界面，但底层运营证据仍有限。
          items:
            - label: Trust Centre
              detail: SOC 2 报告通知及受控文件请求
            - label: 公开状态界面
              detail: 状态 URL 存在；留存细节不足以分析可靠性
    approximationNotes: 分层是分析师对产品关系的综合判断，而非公司发布的基础设施图；不代表任何托管、网络、存储或模型服务拓扑。
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE007
      - CE012
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 客户从 Grow AI 获取线索，到核心业务管理、账单及合作伙伴渠道扩张的端到端进程。
    claimRefs:
      - CU005
      - CU007
      - CU013
      - CU014
      - CU015
    data:
      items:
        - label: 线索获取与分诊
          touchpoints:
            - 网站聊天代理
            - 非工作时间电话接入
            - 自动线索冲突检查
          summary: Prospective clients contact firm; Grow AI screens lead qualifications and captures after-hours inquiries.
          segment: Solo & Small Firms
        - label: 咨询与签约
          touchpoints:
            - 自动预约咨询
            - 自动接入跟进短信
            - 委托函生成
          summary: Qualified prospects are booked into attorney calendars; firm only pays upon successful client conversion.
          segment: All Segments
        - label: 核心事务管理
          touchpoints:
            - Clio Manage 案件文件
            - 文件管理与起草
            - 法院表格提交集成
          summary: Active case data seamlessly transfers from Grow to Manage with full contact and matter history.
          segment: Boutique & Mid-Market
        - label: 账单与价值兑现
          touchpoints:
            - 工时跟踪日志
            - Clio Accounting 账簿
            - 集成支付处理
          summary: Invoicing and payment automation; firm captures fees though small firms face hourly billing friction.
          segment: All Segments
        - label: 支持与规模化留存
          touchpoints:
            - 应用内 Agent Maven 聊天
            - Salesforce 升级处理
            - 知识库自助服务
          summary: Self-serve support autonomously resolves routine questions, escalating complex inquiries to specialists.
          segment: All Segments
        - label: 渠道与高端市场扩张
          touchpoints:
            - 经销商合作伙伴门户
            - Salesforce 联合销售归因
            - 企业版 Operate 推广
          summary: Channel sales operations drive multi-office expansion and integration of acquired legal AI capabilities.
          segment: Mid-Market & Enterprise
    approximationNotes: 工作流阶段和触点综合自 Clio Grow AI 文档、支持案例及合作伙伴运营规范。
  - id: FR001
    title: 风险热力图：核心风险维度的剩余暴露
    type: matrix
    summary: 从监管、技术和商业运营维度评估剩余风险严重性及缓释成熟度。
    data:
      columns:
        - 缓释成熟度
        - 剩余暴露
        - 主要监测触发因素
      rows:
        - label: 法律 AI 输出准确性
          values:
            - 发展中
            - 高
            - 案件摘要与引文中的幻觉率
        - label: 公有云与多区域韧性
          values:
            - 已建立
            - 中
            - SLA 宕机事件与灾难恢复演练
        - label: 医疗 PHI / HIPAA 合规
          values:
            - 已建立
            - 中
            - 监管违规通知与 BAA 遵循情况
        - label: 会计同步与数据完整性
          values:
            - 成熟
            - 中
            - 对账差异与 Plaid 银行数据源中断
        - label: 生态合作伙伴弃用
          values:
            - 成熟
            - 低
            - 第三方连接器终止与 API 弃用
        - label: 商业定价不透明导致的流失
          values:
            - 发展中
            - 中
            - 中端市场赢单率与单人事务所迁移至 MyCase
    approximationNotes: 该矩阵基于当前控制措施、审计披露和专家复核分析，评估截至 2026 年的剩余风险状况。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR006
      - CR007
      - CR008
      - CR010
      - CR011
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 该建议从私募市场参考估值出发，依次经过证明、不确定性和尽调关卡，最终落到跟踪 / 继续研究的决策。
    data:
      nodes:
        - id: reference-mark
          label: $5B 参考估值
          detail: 这是上一轮融资 / 模型参考值，而不是持续交易形成的价格。
        - id: financing-conflict
          label: 融资记录冲突
          detail: 不同独立数据集中的 Series G 和累计融资金额并不一致。
        - id: scale-proof
          label: 历史规模证据
          detail: 发行方证据支持历史 ARR 和中端市场覆盖范围。
        - id: platform-expansion
          label: vLex 扩张
          detail: 合作伙伴证据支持平台规模更大，但尚未验证整合经济性。
        - id: diligence-gates
          label: 私有证据关卡
          detail: 当前 KPI、股权结构条款、流动性和韧性历史仍不完整。
        - id: decision
          label: 跟踪 / 继续研究
          detail: 只有在经验证的经济性和条款构成可辩护的回报路径时，才推进。
    approximationNotes: 该流程是定性且有序的；它不分配概率、不推导估值，也不表示各项证据输入共享同一数值尺度。
    claimRefs:
      - CV004
      - CV006
      - CV011
      - CV013
      - CV015
      - CV016
