  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别定义与支出范围
        blocks:
          - type: paragraph
            body: >-
              法律事务软件和运营自动化市场已从零散的桌面工具转向面向法律专业人士的综合云端操作系统。过去，律所软件支出分散在本地会计系统、独立文字处理模板和本地日历工具中。2026
              年，可服务支出边界由统一云平台定义，这些平台把前台获客与后台事务管理、计费、法律会计、合规及领域专用生成式 AI 工作流结合起来 [CM001, CM002]。在这一边界内，SaaS
              订阅覆盖案件跟踪、文档自动化、法院截止日期日历、利益冲突检查、客户沟通门户及工时计费管理 [CM003]。此外，按交易收费的嵌入式法律支付处理和电子法院申报费用，已成为平台获取客户钱包份额的重要组成部分
              [CM004, CM005]。相反，通用 ERP（如 SAP 或 Oracle Financials）、消费者法律文档门户（如 LegalZoom 或 Rocket
              Lawyer）、第三方法律流程外包（LPO），以及通用电子表格和通信工具等标准化商业软件，均严格排除在市场范围外 [CM002,
              CM006]。现代云端事务管理的现状替代方案仍是手工电子表格、纸质案件文件和传统本地客户端—服务器数据库的组合，在相当一部分中型律所中仍主导运营 [CM007, CM008]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM007
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与 SOM 约束
        blocks:
          - type: paragraph
            body: >-
              评估 Clio 的可服务市场，需要从多个受约束的规模视角拆解宏观法律科技支出，而不能只依赖单一自上而下的估算。最宽口径下，行业分析师估计全球法律软件、AI 工具和专业法律科技解决方案的 TAM 每年约 US$30
              billion，覆盖全球各层级律所、企业内部法务部门和政府法律部门 [CM009]。但这一宽口径 TAM 还包含大量硬件、定制企业部署、传统研究订阅和云端事务管理平台无法直接替代的通用 IT
              基础设施。将范围收窄至 Clio 的 SAM，即全球中小型及商业律所的云端事务管理、客户接待 CRM、法律计费和嵌入式法律支付，得到约 US$5.0 billion 的年可服务市场 [CM001, CM007,
              CM009]。Clio 以 2026 年 5 月披露的 US$500 million ARR 为锚点；结合有机加速、对 vLex 的 US$1 billion 收购和 US$5 billion Series G
              估值，其 SOM 相当于核心 SAM 的约 10% [CM001, CM010, CM011]。云端采用率的地区差异显著影响规模上限：个人及小型律所中有 71% 至 74% 已转向云端事务管理平台，但中型律所只有
              57% 将核心工作流迁移到云端；集成复杂度和传统基础设施惯性仍限制着可争取空间 [CM007, CM008]。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
