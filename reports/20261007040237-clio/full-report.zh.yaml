  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与收入流多元化
        blocks:
          - type: paragraph
            body: >-
              Clio 主要通过云端 SaaS 订阅和嵌入式金融交易处理变现 [CI001, CI002]。公司最初以本地部署替代方案起家，为个人及小型律所捆绑案件和工时管理；之后将核心订阅扩展为
              Starter、Essentials、Advanced 和 Complete 套餐，年度计费的入门价为每用户每月 $49，高级及企业档位仍需报价 [CI002, CI003]。Clio 在 2021 年末接入
              Clio Payments 后，收入构成逐步超越纯事务管理软件；该服务如今每年处理数十亿美元法律交易，并贡献可观的按交易量计费收入 [CI004, CI005]。平台还扩展出用于接待 CRM 的 Clio
              Grow、用于律所财务整合的 Clio Accounting、用于法院表格的 Clio Draft，以及通过 Clio Duo 提供的新一代 AI 生产力能力 [CI002, CI004,
              CI006]。但法律软件定价仍有结构性张力：实证研究显示，71% 的个人执业者和 75% 的小型律所采用 AI 缩短案件完成时间，但这些小型机构中只有 31% 至 32%
              实现收入增长，因为仍依赖传统按小时计费而非按价值收取固定费用 [CI007, CI008]。
            claimRefs:
              - CI001
