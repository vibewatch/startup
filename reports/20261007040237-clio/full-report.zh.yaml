  - id: TV003
    title: 乐观、基准和悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险与触发因素
    rows:
      - - 乐观
        - 当前 ARR 质量、留存率、利润率和 vLex 交叉销售验证交易后的强劲增长，整合成本可控。
        - 只有在经验证的盈利质量增长抵消私募市场和执行风险时，$5B 参考值以上的价值才站得住；无法支持精确区间。
        - 从公开证据无法观察；需要经审计 KPI 和交易条款。
        - 若企业采用率或整合经济性落后于计划，则失效。
      - - 基准
        - 规模延续，但当前经济数据和资本结构仍属非公开，公司仍处于 IPO 前阶段。
        - 跟踪 $5B 上一估值参考值，但不将其视为公允价值，也不设定目标回报。
        - 与现有上一估值证据最相符，但无法赋予可辩护的数值概率。
        - 在定价轮、要约收购、经审计 KPI 数据包或申报文件出现时重新评估。
      - - 悲观
        - 增长或留存放缓，整合推高现金需求，优先权侵蚀普通股经济利益，或私募软件倍数压缩。
        - 低于 $5B 参考值的估值和下行轮结果变得可能；证据不支持精确的下行底线。
        - 价格验证、流动性和优先权数据缺失，因此这一风险很重要。
        - 若融资低于上一估值、利润率恶化或重大韧性事件仍未解决，则触发。
    notes: 情景估值刻意保持方向性：公开来源没有披露当前收入分母、经审计利润率、现金流、优先股堆叠或数值区间所需的实时交易价格。
