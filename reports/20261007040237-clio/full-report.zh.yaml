      - number: '3.2'
        title: 能力、分销与工作流适配
        blocks:
          - type: paragraph
            body: >-
              Clio 最明显的分销资产是公司自报的超过 250 个集成。这种广度可以降低连接律所既有工具的成本，但独立实施指南警告，集成深度差异很大，可能从可靠的双向同步到浅层导入不等。MyCase
              强调统一体验和公开套餐；Smokeball 强调自动记录工时和文档自动化；Filevine 强调原告及人身伤害工作流；CosmoLex
              强调嵌入式法律会计。这些定位没有绝对优劣：工作流适配度会随律所规模、执业领域及管理第三方应用的意愿而变化。Clio 自己的 AI 定价分析也把平台集成描述为相对于零散点工具的取舍，这一战略性主张不应当作独立基准。
            claimRefs:
