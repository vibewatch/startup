      - number: '2.4'
        title: 宏观增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              法律科技市场受根本性结构顺风推动，首要动力是人工智能快速融入日常法律服务交付。成长型律所的收入在四年观察窗口内接近翻倍，而案件量只增加 50%，说明软件自动化和法律 AI
              让从业者无需同比增加人员，就能提高计费额并扩大承载能力 [CM002, CM003]。消费者和商业客户也越来越要求远程数字化互动、灵活在线支付和快速处理案件，使现代事务管理平台成为竞争定位的必需品 [CM005,
              CM007]。不过，商业和运营约束仍压低市场加速幅度。首要逆风是垂直软件独占性的削弱：行业调查显示，只有 40% 的法律专业人士使用专门法律 AI，低于 2024 年的
              58%；由于免费层门槛低且通用能力广泛，ChatGPT、Claude 和 Gemini 等通用 AI 正在大量替代垂直工具 [CM002]。此外，法律行业长期依赖按小时计费，也会抵触软件带来的效率提升：在广泛采用
              AI 的律所中，20% 表示难以达到传统可计费小时目标，促使 45% 转向固定费用或按结果收费的定价结构
              [CM002]。最后，转换成本依旧很高：跨平台迁移历史案件记录、多年信托会计账簿和机构案件上下文会带来重大摩擦；30% 的中型律所将工作流集成困难列为采用新软件的首要障碍 [CM007, CM014]。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM007
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 借助法律 AI，让律所收入与人数脱钩
            body: >-
              2025 年 Clio Legal Trends Report 的数据显示，法律执业经济正在发生结构性变化：成长型律所四年内收入接近翻倍，但案件量只增加 50%，依靠 AI
              自动化提高每宗案件的实际收入，而无需同比招聘。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: 通用 AI 替代与按小时计费造成采用摩擦
            body: 法律专用软件的商业上行空间受到两股逆风夹击：法律专用 AI 的采用率从 58% 降至 40%，因为从业者转向免费通用 LLM；重度采用 AI 的律所中有 45% 被迫重构会惩罚任务自动化的传统按小时计费模式。
            calloutType: risk
            claimRefs:
              - CM002
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方选择不止是直接事务管理供应商。独立的 2026 年比较将 Clio 与 MyCase、PracticePanther 的通用事务管理，Smokeball 的文档密集型工作，Filevine 的原告诉讼以及
              CosmoLex 的会计导向需求进行比较。同一任务也可以由点工具、通用 AI、围绕办公软件组建的内部技术栈，或计费、文档和通信彼此割裂的现状来完成。Clio
              自有材料描述了覆盖接待、案件、文档、支付、会计和集成的平台，但指定证据并未披露每家竞争者可比的私营公司收入、融资或装机量。因此，本画像把未披露的规模视为未知，而不是用臆造的精确度给供应商排名。
            claimRefs:
