              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格与融资证据
        blocks:
          - type: paragraph
            body: >-
              当前最有力的价格参考是 QuantLogix 的 $5.0 billion 估算，对应其所称最近披露的 Series G 标记，而不是持续交易的价格。QuantLogix
              明确表示，没有更晚的定价轮来检验该估算，其 2026 年 6 月二级市场指示价没有 bid、ask 或 spread。融资数据库也相互冲突：FundedIQ 记录 $500 million Series G
              和两轮合计 $610 million 融资，而 QuantLogix 报告累计融资 $2.2 billion，并称 Series G 为 $850 million。各方只在最近融资发生于 2025 年 11
              月这一宽泛时间点上达成一致。Clio 自己较早的基准是 $900 million Series F、$3 billion
              估值。这些记录证明融资势头，但不能形成干净的当前股权结构表、完全核对的资金流入或可投资价格。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
