      - number: '7.3'
        title: 伙伴生态依赖、商业摩擦与平台集中度
        blocks:
          - type: paragraph
            body: >-
              Clio 向高端市场扩张并进行多产品规模化，会带来集中的伙伴依赖和商业模式摩擦。平台依赖超过 250 个第三方软件集成，使用户律所暴露于集成弃用、同步错误和伙伴重新谈判风险 [CR005, CR008,
              CR009]。一个重要运营案例是 Clio 长期使用的 LawPay 支付集成于 2026 年 8 月 31 日终止，推动客户转向 Clio Payments 和 Stripe 等第三方网关
              [CR008]。同样，Clio 于 2026 年 2 月推出原生总账模块 Clio Accounting，通过 Plaid 提供银行连接；但复杂的多实体业务仍高度依赖 QuickBooks Online
              外部同步，映射差异需要持续人工对账 [CR003, CR010]。商业上，Clio 在 2026 年把高档 Core、Signature 和 Elite 套餐改为销售报价，同时只公布 Starter
              定价（$49/user/month），造成企业买方摩擦和客户成本不确定性 [CR008, CR011]。未捆绑的增值模块，如 Clio Grow CRM、HIPAA 合规和 Vincent AI
              席位，可能抬高总拥有成本，把价格敏感的个人及精品律所推向透明的挑战者 [CR003, CR008, CR011]。
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
