            title: 合作伙伴渠道的运营依赖
            body: Clio 越来越依赖间接渠道伙伴和经销商进入国际市场及高端细分市场；手工伙伴门户工作和归因争议，会给伙伴来源的客户获客带来摩擦。
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与司法辖区合规漏洞
        blocks:
          - type: paragraph
            body: >-
              Clio 在 130 多个国家管理关键客户案件数据、信托会计记录和敏感健康信息，因此暴露于复杂的司法辖区合规要求和监管审查。在美国，医疗相关案件记录必须严格遵守 HIPAA；但 Clio 没有外部正式 HIPAA
              认证，而是依靠年度内部自评、证明审查，以及只在部分付费美国增值档位提供的不可协商标准 BAA [CR001, CR002]。对于加拿大客户数据，Clio 按 PIPEDA
              运营，并将静态数据保存在加拿大服务器环境中，但承认生成式 AI 响应处理可能临时将数据传输到加拿大境外 [CR001]。此外，Clio 提供专门信托会计模块，帮助律所遵守 ABA Model Rule 1.15
              及不列颠哥伦比亚和安大略法律学会规则，但明确声明不提供法律或监管建议，因此最终法定和受托责任仍由客户律所承担 [CR001, CR003]。公司维持 SOC 2 Type II
              审计报告以证明安全与访问控制，但随着隐私法规演进及全球法律司法辖区扩大云端采用，剩余合规摩擦仍然重大 [CR004, CR005]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营韧性、数据保护与法律 AI 执行
        blocks:
          - type: paragraph
            body: >-
              作为律所的关键操作系统，Clio 必须持续可用，并具备抵御灾难性数据丢失或网络入侵的强大逻辑防护。Clio 以 99.9% 正常运行时间服务等级协议、镜像数据中心、每日备份以及传输中和静态加密支撑核心事务管理服务
              [CR001, CR006]。但 Clio 明确建议订阅者保留律所数据的独立本地备份，说明公开云故障转移配置仍存在灾难恢复局限 [CR001]。随着 Clio Work、Clio Grow AI 和
              Vincent AI 推出生成式 AI 工具，运营风险显著上升；这些工具由 GPT-5.6 等前沿基础模型驱动 [CR007, CR008]。接入生成式 AI
              会引入严重的法律专属漏洞，包括自动案件摘要中的幻觉、跨案件上下文泄漏、法院引文错误和提示注入威胁 [CR007, CR008]。虽然 Clio 与第三方 AI
              模型供应商签署零数据留存协议，并限制训练使用客户查询，但核验模型输出仍是重大运营负担，且直接落到从业者工作流上 [CR001, CR007]。
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
