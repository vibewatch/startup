              尽管 ARR 增长迅速、核心事务管理粘性强，Clio 在客户分层中仍面临关键的持久性和变现挑战。行业数据揭示小型律所的变现缺口扩大：75% 使用 AI 工具，但成功通过 AI
              采用带动律所收入增长的不足三分之一。问题很大程度源于计费惯性：部署 AI 后，86% 的个人执业者和 78% 的小型律所没有改变按小时计费模式，实际上把效率收益让给客户，却没有捕获利润。同时，Clio
