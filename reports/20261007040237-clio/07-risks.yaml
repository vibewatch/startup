callouts:
  - calloutType: "risk"
    title: "Generative AI Liability and Professional Responsibility Boundaries"
    body: "Clio's rapid integration of Vincent AI and GPT-5.6 creates meaningful professional responsibility exposure for attorney clients. While Clio enforces zero-retention policies with model providers, courts hold practicing lawyers strictly liable for fictitious citations or inaccurate legal pleadings. Should Clio's AI tools produce material inaccuracies, law firms face sanction risk, threatening platform trust."
    claimRefs:
      - "CR001"
      - "CR007"
      - "CR008"
  - calloutType: "insight"
    title: "The Double-Edged Sword of In-House Fintech and Payment Consolidation"
    body: "By terminating its LawPay integration in August 2026 and steering firms toward Clio Payments and Stripe, Clio captures higher payment take-rates but simultaneously increases financial counterparty risk. Solo and boutique practices that built operating workflows around LawPay experience operational friction, accelerating evaluation of competing platforms."
    claimRefs:
      - "CR008"
      - "CR010"
