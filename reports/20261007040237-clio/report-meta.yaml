companyProfile:
  summary: >-
    Clio is a Burnaby-based legal software platform founded in 2008 that combines practice management, client intake,
    document automation, billing, payments, accounting, and AI-enabled workflows for law firms ranging from solo
    practitioners to mid-market and larger enterprise practices. The company says it serves more than 150,000 legal
    professionals across more than 130 countries and more than 1,000 mid-sized U.S. firms, while its latest disclosed
    financing marks it at roughly US$5 billion.
