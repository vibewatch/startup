evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-capital-structure
    missingEvidence: >-
      Complete committee charter details, independent director roster, and covenant terms of the US$350M Blackstone and
      Blue Owl debt facility.
    whyItMatters: >-
      Debt seniority, liquidity constraints, and independent board oversight are critical to evaluating downside
      protection at a US$5B valuation.
    diligencePath: >-
      Request confidential credit agreements, corporate bylaws, board committee rosters, and capitalization tables
      during formal sponsor diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: executive-leadership-enumeration
    missingEvidence: Comprehensive corporate officer roster beyond primary executive announcements and public platform filings.
    whyItMatters: >-
      Understanding operational bench strength across product, regional GMs, and legal strategy is necessary to assess
      key-person dependence on the CEO.
    diligencePath: >-
      Review internal organizational charts, management biographies, and equity incentive plans during management
      meetings.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: Comparable current revenue, funding, customer-count, and segment-retention data for each private competitor.
    whyItMatters: Without like-for-like scale data, strategic staying power and investment capacity cannot be ranked responsibly.
    diligencePath: >-
      Request management win-loss files and obtain current competitor financing and customer references through primary
      diligence.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: A dated Clio rate card and realized all-in quotes that reconcile conflicting 2026 public-tier observations.
    whyItMatters: The current evidence cannot distinguish a permanent packaging change from page-level or timing differences.
    diligencePath: >-
      Obtain dated written quotes for representative firm sizes and reconcile included modules, services, and contract
      terms.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: lock-in
    missingEvidence: >-
      Cohort churn, multi-homing, implementation duration, partner-access economics, and migration-success data by firm
      segment.
    whyItMatters: These measures determine whether ecosystem breadth creates durable retention or merely raises administration cost.
    diligencePath: >-
      Review renewal cohorts, lost-deal notes, integration telemetry, and reference calls with firms that switched in
      both directions.
    relatedQuestionRefs:
      - QP010
  - type: missing-source
    severity: minor
    topic: operational-transparency
    missingEvidence: Independent comparative security assessments and a quantified Clio incident and uptime history.
    whyItMatters: A current status surface and company-issued audit notice do not establish relative resilience.
    diligencePath: >-
      Obtain the audit report under NDA, export incident history, and benchmark controls against shortlisted
      competitors.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: audited-unit-economics
    missingEvidence: >-
      Audited breakdown of software gross margin, payments net take rate, cohort net revenue retention (NRR), and CAC
      payback.
    whyItMatters: >-
      Without segmented gross margins and cohort retention data, underwriters cannot verify whether payments growth
      carries healthy contribution margins or evaluate long-term SMB churn vulnerability.
    diligencePath: >-
      Request confidential disclosure of audited GAAP financial statements, gross margin bridge between software
      subscriptions and transaction fees, and trailing 24-month retention cohorts.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: >-
      Current production architecture diagrams, service and data boundaries, hosting and subprocessor inventory, tenancy
      model, capacity tests, and AI model-evaluation controls.
    whyItMatters: >-
      Product-layer evidence cannot establish scalability, isolation, data governance, or failure containment in the
      production environment.
    diligencePath: >-
      Request an architecture review with engineering leadership plus current diagrams, dependency inventories, capacity
      tests, and model-governance documentation.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Component-level uptime history, incident and severity log, recovery-time and recovery-point performance,
      backup-restore tests, and status-page history.
    whyItMatters: >-
      A public status URL and the absence of an incident in retained text do not establish availability, operational
      resilience, or disaster-recovery effectiveness.
    diligencePath: >-
      Obtain the prior 24 months of incident records, service-level performance, post-incident reviews, and witnessed
      backup and disaster-recovery test results.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: security
    missingEvidence: >-
      The full SOC 2 report, control exceptions, penetration-test scope and remediation, data-residency map,
      subprocessor list, and enterprise permission test results.
    whyItMatters: >-
      The Trust Centre confirms an assurance artifact exists but does not expose enough evidence to evaluate control
      design, exceptions, or remediation quality.
    diligencePath: >-
      Execute the Trust Centre access process and review assurance reports and remediation evidence with security
      leadership under NDA.
  - type: private-evidence-only
    severity: material
    topic: retention-and-cohort-durability
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and annual logo churn broken down by firm size
      tiers and product modules.
    whyItMatters: >-
      Without verified retention cohorts, durability cannot be confirmed independently, particularly given the
      small-firm AI revenue gap.
    diligencePath: >-
      Request confidential SaaS cohort data, gross renewal rates, and payment take-rate metrics during confirmatory
      diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-deployments
    missingEvidence: >-
      Comprehensive deployment metrics and contract values for enterprise and mid-market law firm customers beyond
      self-selected public case studies.
    whyItMatters: >-
      Public testimonials (such as Rosenberg Perry & Associates) represent sample deployments rather than an exhaustive
      audit of client adoption across Clio's 1,000+ mid-sized firms.
    diligencePath: >-
      Inspect anonymized customer master agreement rosters, ARR distribution by account, and reference calls with
      mid-market firm administrators.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: multi-cloud-failover-and-rto
    missingEvidence: >-
      Audited Recovery Time Objectives (RTO), Recovery Point Objectives (RPO), and independent validation of
      active-active multi-cloud failover capabilities beyond single-cloud availability zones.
    whyItMatters: >-
      Law firms require high assurance of continuous operational availability during major public cloud regional outages
      to protect statutory court filing deadlines.
    diligencePath: >-
      Request Clio's comprehensive business continuity and disaster recovery test reports, including simulated AWS
      region failover logs.
    relatedQuestionRefs:
      - QR003
  - id: GR001
    type: missing-source
    severity: material
    topic: ai-hallucination-benchmark-metrics
    missingEvidence: >-
      Empirical benchmark evaluation error and hallucination rates for Vincent AI and Clio Work across
      multi-jurisdictional legal research tasks.
    whyItMatters: >-
      Attorneys face severe court sanctions and malpractice claims if AI-generated legal citations, case law summaries,
      or statutory interpretations prove fictitious.
    diligencePath: >-
      Inquire whether Clio maintains and publishes an empirical red-teaming report and hallucination rate scorecard
      across supported jurisdictional databases.
    relatedQuestionRefs:
      - QR004
  - id: GR002
    type: private-evidence-only
    severity: minor
    topic: payment-take-rate-and-processing-metrics
    missingEvidence: >-
      Detailed breakdown of transaction volume, merchant take-rates, and net revenue retention within Clio Payments
      following the August 2026 LawPay integration termination.
    whyItMatters: >-
      Payment processing represents a key margin driver, and forced gateway migration may impact boutique firm churn
      rates.
    diligencePath: >-
      Review internal management reporting on Clio Payments gross payment volume (GPV), merchant fee margins, and
      payment-related customer churn.
    relatedQuestionRefs:
      - QR006
  - type: conflicting-data
    severity: material
    topic: financing discrepancy
    missingEvidence: >-
      Primary financing documents reconciling Series G primary proceeds, secondary components, acquisition financing,
      and cumulative capital raised.
    whyItMatters: >-
      The difference between the reported $500 million and $850 million round sizes affects dilution, cash availability,
      and interpretation of the $5 billion mark.
    diligencePath: >-
      Obtain the Series G closing set, capitalization table, funds-flow memorandum, and management reconciliation to
      each public figure.
    relatedQuestionRefs:
      - QV003
      - QV006
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: >-
      Fully diluted ownership, liquidation preferences, participation rights, anti-dilution provisions, debt terms, and
      employee-option overhang.
    whyItMatters: Headline enterprise value does not determine investor proceeds when seniority, dilution, and debt are unknown.
    diligencePath: >-
      Review the charter, investor-rights agreements, debt documents, option ledger, and pro forma waterfall at the
      proposed entry price.
    relatedQuestionRefs:
      - QV006
  - type: private-evidence-only
    severity: material
    topic: operating economics
    missingEvidence: >-
      Current audited ARR bridge, organic growth, gross margin, NRR and GRR, cash flow, customer concentration, and vLex
      integration costs.
    whyItMatters: >-
      Without a current operating denominator and earnings-quality evidence, no defensible forward multiple or target
      return can be calculated.
    diligencePath: >-
      Request audited financials, monthly KPI cohorts, revenue-quality bridge, customer concentration schedule, and
      standalone versus combined integration plan.
    relatedQuestionRefs:
      - QV002
      - QV005
      - QV008
  - type: missing-source
    severity: material
    topic: exit and liquidity
    missingEvidence: >-
      A verified IPO timetable, tender terms, recurring secondary-market depth, or another transaction with disclosed
      security terms.
    whyItMatters: A last-round mark cannot establish realizable exit value, timing, or liquidity.
    diligencePath: >-
      Review board-approved exit planning, banker materials, tender documentation, secondary indications with spreads,
      and any confidential filing status.
    relatedQuestionRefs:
      - QV002
      - QV007
  - type: enumeration-incomplete
    severity: minor
    topic: comparable set
    missingEvidence: >-
      A current, model-consistent set of public legal-software multiples and disclosed private or M&A transactions with
      comparable growth and margin profiles.
    whyItMatters: >-
      The broad IT funding median, historical Clio rounds, and vLex transaction do not establish a normalized trading or
      transaction multiple.
    diligencePath: >-
      Build a banker-verified comparable set after current Clio revenue, growth, margin, and security terms are
      available.
    relatedQuestionRefs:
      - QV004
      - QV008
