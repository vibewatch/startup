  topStrengths:
    - Broad legal-workflow platform spanning practice management, documents, payments, accounting, and AI.
    - Large installed base with reported scale above US$500M ARR and more than 150,000 legal professionals.
    - Strong brand, integration ecosystem, and institutional financing support continued expansion.
  topRisks:
    - Valuation is stretched and public funding records still conflict on the latest round economics.
    - Current margins, retention, cap-table terms, and preference stack remain undisclosed.
    - Enterprise expansion and integrations add execution risk, especially around vLex and newer product surfaces.
    - Public resilience evidence remains thin on incident history and failover specifics.
  unresolvedGaps:
    - Current audited operating metrics remain unavailable, including gross margin, NRR or GRR, and cash conversion.
    - Capital-structure detail remains incomplete, especially debt terms, liquidation preferences, and seniority.
    - Current standalone headcount and the post-vLex integration cost profile are not publicly disclosed with precision.
    - >-
      Enterprise proof remains thinner than SMB proof, especially on repeatable Operate adoption and legal AI
      monetization.
    - Public resilience evidence still does not show enough incident detail to underwrite disaster recovery confidence.
