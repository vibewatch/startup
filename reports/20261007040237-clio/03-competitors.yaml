company:
  name: "Clio"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Clio's breadth and integration ecosystem differentiate it from simpler
    practice-management rivals, while specialist products compete on focused
    workflows and transparent packaging. The assigned evidence also shows that
    public price observations conflict by date, so realized pricing, competitor
    scale, and switching behavior remain diligence items rather than settled facts.
sections:
  - id: "competitive-landscape"
    title: "Competitive Landscape and Buyer Alternatives"
    body: >-
      The buyer's choice is wider than a list of direct practice-management
      vendors. Independent 2026 comparisons place Clio against MyCase and
      PracticePanther for general practice management, Smokeball for
      document-heavy work, Filevine for plaintiff litigation, and CosmoLex for
      accounting-led requirements. The same job can also be met by point
      solutions, general-purpose AI, an internal stack assembled around office
      software, or the status quo of disconnected billing, documents, and
      communication. Clio's company-issued material describes a platform spanning
      intake, matters, documents, payments, accounting, and integrations, but the
      assigned evidence does not disclose comparable private-company revenue,
      funding, or installed-base figures for every rival. The profile therefore
      treats undisclosed scale as unknown rather than ranking vendors with invented
      precision.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP005"
      - "CP006"
      - "CP009"
      - "CP011"
      - "CP012"
    tableRefs:
      - "TP001"
    figureRefs:
      - "FP001"
  - id: "capability-and-distribution"
    title: "Capability, Distribution, and Workflow Fit"
    body: >-
      Clio's strongest observable distribution asset is its company-reported
      ecosystem of more than 250 integrations. That breadth can lower the cost of
      connecting a firm's existing tools, although an independent implementation
      guide warns that integration depth varies and may range from reliable
      two-way synchronization to shallow imports. MyCase emphasizes a consolidated
      experience and published packaging; Smokeball emphasizes automatic time
      capture and document automation; Filevine emphasizes plaintiff and
      personal-injury workflows; and CosmoLex emphasizes embedded legal
      accounting. These are not universally superior or inferior positions:
      workflow fit changes with firm size, practice area, and willingness to
      administer third-party applications. Clio's own AI pricing analysis also
      frames platform integration as a tradeoff against fragmented point
      solutions, a strategic claim that should not be mistaken for an independent
      benchmark.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP005"
      - "CP006"
      - "CP009"
    tableRefs:
      - "TP002"
  - id: "pricing-and-switching"
    title: "Pricing, Packaging, and Switching Economics"
    body: >-
      Pricing evidence is directionally useful but not fully consistent. RFP.wiki
      reported that Clio publicly listed four annual tiers at $49, $89, $119, and
      $149 per user per month, while a later July 2026 comparison said only a
      starting price remained public; another June comparison likewise described
      higher tiers as quote-based. This may reflect a page or packaging change,
      not a stable rate card. MyCase and PracticePanther publish broader ladders,
      whereas Filevine is described as custom-quoted and Smokeball uses a
      configurator. An implementation guide further estimates that Clio's add-ons
      can lift total cost materially, but those figures are not audited realized
      prices. Switching is also costly: the same guide describes multi-month
      migrations, parallel operation, retraining, and incomplete transfer of
      custom fields, reports, portal history, and automations. Buyers should model
      total workflow replacement rather than compare entry prices alone.
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP010"
      - "CP016"
    tableRefs:
      - "TP003"
  - id: "moat-and-displacement"
    title: "Moat Durability and Displacement Risk"
    body: >-
      Clio's durable advantage is breadth: a large integration surface, a
      multi-product platform, and capital to extend into AI, payments, larger
      firms, and international markets. Its July 2024 Series F announcement
      reported a $900 million raise at a $3 billion valuation and more than
      $200 million of ARR at that time; these historical company claims establish
      scale but do not reveal current retention or unit economics. The countervailing
      risk is segmentation. Simpler firms can prefer transparent, consolidated
      packages, while document-heavy, accounting-heavy, and plaintiff practices
      may choose specialists. Trust posture is visible through a company-operated
      Trust Centre and status page, but the assigned snapshots provide neither a
      quantified uptime history nor independent comparative security evidence.
      The moat case is therefore credible on ecosystem breadth, but unproven on
      relative retention, multi-homing, and migration outcomes.
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP010"
      - "CP011"
      - "CP012"
      - "CP013"
      - "CP014"
      - "CP015"
callouts:
  - calloutType: "strength"
    title: "Breadth Creates Optionality"
    body: >-
      Clio reports more than 250 integrations and describes a platform that joins
      core firm workflows; this gives buyers more ways to preserve an existing
      stack than a narrowly packaged product, even though integration depth must
      be tested individually.
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP009"
  - calloutType: "risk"
    title: "List Price Is Not Total Cost"
    body: >-
      Published observations of Clio's 2026 pricing conflict, and independent
      commentary identifies add-ons, implementation, and third-party tools as
      meaningful cost drivers. Procurement should require a written all-in quote
      and migration scope before comparing vendors.
    claimRefs:
      - "CP007"
      - "CP008"
      - "CP010"
      - "CP016"
