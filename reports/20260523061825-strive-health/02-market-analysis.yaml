    "number": 2,
    "title": "Market Analysis",
    "summary": "Strive Health's market is best understood as the operating layer around value-based kidney care rather than generic dialysis reimbursement: upstream CKD identification, risk-bearing nephrology support, dialysis-transition planning, transplant coordination, and payer-provider enablement. Public sources support a large need base of roughly 35.5 million to 37 million U.S. adults with CKD and sizable kidney-related Medicare spending, but market size depends heavily on whether the lens is patient prevalence, public Medicare claims, or broader company-defined unmanaged spend. Adoption is helped by nephrologist-led CKCC structures, home-dialysis and transplant incentives, and Medicare Advantage/commercial buyer demand, yet constrained by tighter CMS economics, provider attrition, dialysis market power, and limited public visibility into vendor-level monetization."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary, included spend, and substitutes",
      "body": "Value-based kidney care is not the entire renal market and it is not synonymous with dialysis reimbursement. The defensible boundary for Strive includes four connected layers: upstream CKD identification and risk stratification; high-touch care coordination that sits alongside nephrologists and PCPs; risk-bearing nephrology operations inside CMS or payer contracts; and downstream dialysis-transition, home-dialysis, and transplant navigation. CMS describes the KCC/CKCC structure as a coordinated model for Medicare fee-for-service patients with stage 4-5 CKD, ESRD, or transplant status, while Strive's own partner pages and media kit show the commercial market extending that same operating model to Medicare Advantage, Medicaid, commercial plans, nephrology groups, health systems, and physician partners. That framing matters because it keeps the chapter focused on operating and contracting layers where Strive can earn value, not on the entire dialysis facility revenue pool or every generic chronic-care software category.\n\nThe clearest public evidence for why the boundary matters comes from the split between disease burden and paid-market structure. Official sources put the adult CKD population in the mid-30 millions, yet the treated ESKD population is only a small fraction of that total and CKCC/KCC aligned beneficiaries are smaller still. Public Medicare spending lenses also vary sharply by what is included: older-adult CKD claims, ESKD-specific spend, dialysis facility payments, or broader kidney-disease totals. Company sources then go further, using unmanaged-spend figures above $400 billion that are directionally useful but not directly comparable to Medicare-only baselines. Treating all of those numbers as the same TAM would overstate certainty.\n\nThe legacy substitutes are likewise broader than a simple list of startup competitors. Status-quo kidney care is still anchored in fragmented fee-for-service nephrology follow-up, dialysis-provider operating models, and general payer case-management programs. Specialty kidney-care platforms only create incremental economic value if they coordinate across those silos better than the default stack. Strive's nephrology and payor materials repeatedly position the company as the connective layer rather than as a dialysis owner or a thin analytics widget, which supports defining the market around integrated, value-based kidney operations rather than around undifferentiated renal reimbursement.",
