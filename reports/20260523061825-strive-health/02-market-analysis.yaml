      "id": "drivers-and-constraints",
      "title": "Growth drivers, adoption constraints, and evidence gaps",
      "body": "The strongest demand drivers are upstream need and policy-backed care redesign. Public health sources still show a huge undiagnosed CKD population, while CMS's own KCC evaluation shows measurable clinical improvements when providers receive incentives to intervene earlier: higher home-dialysis use, more living donor transplants, more preemptive waitlisting, and better optimal ESRD starts. NKF's 2026 rule comments push in the same direction by advocating for home dialysis access, Kidney Disease Education, and Medical Nutrition Therapy. Strive's March 2026 resource center post adds a market-level narrative on top of that evidence, emphasizing early cardiometabolic intervention, SGLT2 adoption, and cross-specialty collaboration. Taken together, these sources support a market where upstream kidney management is becoming more clinically credible and more strategically important to payers and nephrologists.\n\nThe main constraint is that policy support does not equal easy economics. KCC's own evaluation says the model did not significantly reduce total Part A/B payments and instead increased Medicare spending by $304.8 million, largely because of incentive payments. CMS and outside legal/policy summaries responded by tightening the model: KCF participation is sunset, graduated/professional/global CKCC tracks extend through 2027 but face additional benchmark discounts, transplant bonuses disappear in 2026, and CKD quarterly capitation is cut by half. Avalere's participant data show that the number of KCF practices and CKCC entities fell sharply even as aligned beneficiaries ticked up, with stakeholders pointing to downside risk and documentation burden. In other words, adoption drivers are real, but the public evidence does not yet show a frictionless or obviously high-margin market.\n\nA second structural constraint sits outside CMS: dialysis-provider concentration and MA economics. The PMC pricing study argues that MA enrollment after dialysis initiation became more relevant after the 21st Century Cures Act and could rise further, but it also finds that large dialysis organizations negotiated materially higher MA prices than FFS Medicare. That makes Medicare Advantage a double-edged sword for kidney-care vendors and plans alike: more beneficiaries can enter managed models, but medical-loss economics are harder when downstream dialysis prices stay elevated. Staffing shortages at smaller or rural clinics add another execution constraint. The unresolved diligence questions therefore sit less on whether kidney care matters and more on exactly how much of this spend a vendor like Strive can capture, at what margins, and through which buyer mix under tighter 2026-2027 reimbursement terms.",
