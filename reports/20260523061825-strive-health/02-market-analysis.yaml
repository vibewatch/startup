    {
      "id": "sizing-lenses",
      "title": "TAM, SAM, and SOM through prevalence and spend lenses",
      "body": "The broadest sizing lens is patient prevalence. CDC's March 2026 report estimates 37 million U.S. adults, or 14% of adults, have CKD, while NIDDK summarizes the population at 35.5 million. Those are close enough to bracket the true population need, and both sources also show that CKD is deeply underdiagnosed. That supports a large upstream opportunity for identification, education, and care coordination, but it does not automatically translate into vendor revenue because many patients will never enter a risk-bearing kidney contract. The more economically relevant sub-layers are much smaller: NIDDK reports a treated ESKD population a little above 808,000, CMS's own value-based model data show about 257,000 aligned KCC beneficiaries by PY2025, and Strive's disclosed current served base is 145,000-plus people.\n\nThe spend lens is equally important and more contradictory. Official public baselines show nearly $77 billion of Medicare spending for beneficiaries 66+ with CKD excluding ESKD in 2021, plus another $52.3 billion of Medicare-related ESKD spend. CMS separately expects to pay about $6 billion to 7,600 ESRD facilities under the CY2026 ESRD PPS, and the official CKCC infographic still describes ESKD as over 7% of Medicare spending despite representing only 1% of beneficiaries. Strive's 2026 media kit then cites approximately $156.7 billion, or one in four Medicare dollars, spent on people with kidney disease, and pairs that with a much larger $456 billion unmanaged-spend estimate. The right interpretation is not that one source is obviously wrong; it is that each source draws a different market boundary.\n\nFor SOM, public evidence supports only a constrained lens. Strive's 145,000-plus served patients and roughly $5 billion of spend under management show real operating scale, but they still imply a served share well below 1% of the national CKD population. That gap is why the current market looks simultaneously large and early: the disease burden is massive, yet the actual contracted and coordinated population remains narrow relative to total prevalence. The practical takeaway is that any Strive TAM story should present multiple lenses at once and preserve the boundary differences instead of collapsing them into one oversized headline number.",
