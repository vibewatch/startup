summary:
  headline: >-
    Strive has real kidney-care scale, channel breadth, and product relevance, but the public record still cannot bridge
    its September 2025 ~$1.8 billion mark to disclosed revenue, margin, renewal, and post-reset economics, so the right
    public-only posture remains research-more.
