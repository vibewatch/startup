  topStrengths:
    - >-
      Real operating scale is visible in public evidence: Strive says it serves more than 145,000 people, works with
      more than 6,500 providers, and has expanded into all 50 states.
    - >-
      The product thesis is more concrete than many private care-enablement stories because public materials
      consistently describe CareMultiplier, Kidney Heroes, nephrology workflow integration, and externally surfaced
      outcome studies rather than generic AI marketing.
    - >-
      Named customer and channel proof spans payers, health systems, nephrology groups, and a Medicare-focused
      primary-care channel, which lowers the risk that Strive is only a single- buyer or single-channel narrative.
    - >-
      Capital access has been substantial, culminating in a $550 million Series D and at least $939.5 million of
      disclosed lifetime capital, which gives the company room to keep scaling.
  topRisks:
    - >-
      Public sources do not disclose recognized revenue, take rates, gross margin, burn, runway, or NRR, so managed
      spend and patient counts still cannot be translated into economics with confidence.
    - >-
      The 2026 Kidney Care Choices reset reduces capitation payments and removes the transplant bonus, creating real
      reimbursement pressure for labor-heavy kidney value-based care models.
    - >-
      Strive's model relies on high-touch care teams and workflow integration, which raises execution,
      operating-leverage, and margin risk if reimbursement or renewal quality weakens.
    - >-
      Public diligence still cannot see payer concentration, top-account share, renewal cohorts, contract duration, or
      the detailed terms of the Hercules debt tranche.
    - >-
      Security and control depth are under-disclosed beyond accreditation and certification claims, leaving investors
      without an independent public control package or breach-testing record.
  unresolvedGaps:
    - >-
      Management still needs to bridge medical spend and patient counts to recognized revenue, gross profit, and
      contribution margin by channel.
    - >-
      Public sources do not disclose payer or provider renewal cohorts, logo count, customer concentration, or contract
      duration.
    - >-
      The Hercules debt tranche still lacks public detail on interest rate, maturity, covenants, collateral, and how it
      interacts with the preference stack.
    - >-
      Public evidence still does not quantify Strive's exposure mix to post-2026 reimbursement resets or show unit
      economics after the new benchmark discounts and lower CKD payments.
    - No audited cash balance, burn, runway, or margin disclosures were found in the reviewed public record.
