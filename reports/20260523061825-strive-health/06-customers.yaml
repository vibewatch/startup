tables:
- id: TU001
  title: Customer segmentation table
  notes: Segmentation is based on public buyer, user, and payer roles rather than undisclosed revenue split. Member and patient counts are not treated as customer counts.
  columns:
  - Segment
  - Buyer / user / payer
  - Representative public proof
  - Primary use case
  - Strategic value / gap
  rows:
  - - Health plans
    - 'Buyer: plan leadership; users: members and local clinicians; payer: plan'
    - Humana, Regence, Medical Mutual, and Zing
    - Value-based kidney care for Medicare Advantage, commercial, or mixed lines of business
    - Strongest named payer proof, but revenue split and renewal economics are private
  - - Health systems
    - 'Buyer: health-system executives; users: care teams and patients; payer: system / risk arrangement'
    - SSM Health and Bon Secours Mercy Health
    - System-level kidney-care collaboration, care-center buildout, and whole-person care delivery
    - Clear logo proof, but limited current operating metrics by account
  - - Independent nephrology groups
    - 'Buyer: practice leadership; users: nephrologists and office teams; payer: risk contracts shared with payors'
    - NANI, Michigan Kidney Consultants, Midwest Nephrology Associates
    - CKCC and Medicare Advantage risk participation with embedded workflow support
    - Best evidence for workflow integration, but account economics remain private
  - - Primary-care Medicare channel
    - 'Buyer: Medicare-focused primary-care organization; users: Oak Street clinicians and referred patients; payer: channel / MA economics'
    - Oak Street Health
    - Route late-stage CKD and ESKD patients into specialized kidney-care support
    - Useful channel diversification, but public retention and economics are undisclosed
  - - Government-aligned kidney entities
    - 'Buyer: provider entities participating in CMS models; users: nephrologists and care teams; payer: Medicare risk model'
    - CKCC footprint described by Echo and nephrologist pages
    - Use nephrologist-centered risk models to delay disease progression and reduce cost
    - Program scale is visible, but named-customer roster is incomplete
  - - Patient-support layer
    - 'Buyer: institutional customer; users: patients and families; payer: underlying customer contract'
    - Patients page plus payer and provider announcements
    - 24/7 support, education, outreach, and care coordination
    - Important service layer, but not evidence of separate paying customers
