  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-disclosure
    missingEvidence: Customer-level NRR, GRR, logo churn, renewal rates, and average contract length by payer, health-system, and nephrology-group segment.
    whyItMatters: Durability is the biggest unresolved question in the customer chapter because deployment proof does not automatically imply sticky economics.
    diligencePath: Request cohort retention tables, sample master-service agreements, and renewal calendars for Humana, Zing, Medical Mutual, and major provider channels.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-disclosure
    missingEvidence: Top-customer revenue share, top-10 payer concentration, and revenue mix by payer versus provider channel.
    whyItMatters: A broad testimonial roster can still mask economic concentration if one or two national payers dominate revenue.
    diligencePath: Request customer concentration schedules from finance and contract owners, including current revenue and contribution margin by top account.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: independent-satisfaction-benchmark
    missingEvidence: Independent customer-reference data, benchmarked satisfaction studies, or third-party review surfaces with methodology.
    whyItMatters: The only quantitative satisfaction datapoint found in public materials is company-reported, which limits confidence in durability and service quality claims.
    diligencePath: Collect customer-reference calls or third-party satisfaction studies segmented by payer, health-system, and nephrology-group account type.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: minor
    topic: complaint-signal
    missingEvidence: Systematic complaint, escalation, or failed-deployment data beyond scattered anecdotal patient posts.
    whyItMatters: The adverse search recovered only anecdotal outreach confusion, so public evidence is too thin to rule in or rule out broader messaging or onboarding friction.
    diligencePath: Ask for complaint logs, grievance rates, escalation volumes, and examples of corrective actions for outreach or onboarding issues.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-count-disclosure
    missingEvidence: Distinct contracted-customer count by payer, health-system, medical-group, and primary-care channel rather than member or patient counts.
    whyItMatters: Member and patient counts measure served populations, but investors still need actual logo count and active-account count to judge breadth and concentration.
    diligencePath: Request a current customer roster with start date, status, line of business, geography, and active covered lives or patients for each account.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
    - TU006
