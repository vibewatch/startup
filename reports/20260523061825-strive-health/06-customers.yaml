- id: TU006
  title: Public visibility and diligence-gap table
  notes: This table intentionally separates what public sources prove from what remains private, so the chapter does not smuggle hidden assumptions into the customer readout.
  columns:
  - Topic
  - What public sources prove
  - What remains undisclosed
  - Why it matters
  - Concrete diligence ask
  rows:
  - - Distinct customer count
    - Named logos and large served-population counts are real
    - Active logo count and current customer roster
    - Customer breadth and concentration cannot be inferred from patient counts alone
    - Request active-customer roster with status and line of business
  - - Retention and renewals
    - Humana and Zing have public expansion signals
    - NRR, GRR, churn, renewal rates, average term
    - Expansion anecdotes do not replace cohort retention evidence
    - Request cohort retention tables and renewal calendars
  - - Concentration
    - Customer mix spans payer and provider channels
    - Top-customer revenue share and payer mix by revenue
    - A broad roster can still mask economic concentration
    - Request top-10 customer concentration schedule
  - - Satisfaction quality
    - Company-reported patient satisfaction is positive
    - Methodology, sample size, independent benchmark
    - Weak benchmarkability lowers confidence in durability claims
    - Request survey methodology and third-party reference checks
  - - Channel economics
    - Oak Street, Bon Secours, SSM, NANI, and CKCC show real deployment channels
    - Per-account revenue, margin, and implementation cost
    - Different channels may scale very differently economically
    - Request account-level unit-economics snapshots by channel
  - - Adverse evidence
    - Only anecdotal outreach confusion surfaced publicly
    - Systematic complaint or failed-deployment data
    - Public silence does not prove zero friction
    - Request grievance logs and escalation examples by account
