- id: TU005
  title: Expansion and concentration risk table
  notes: Expansion drivers are public and credible, but concentration risk remains mostly an absence-of-disclosure problem rather than a documented failure today.
  columns:
  - Expansion driver
  - Concentration / execution risk
  - Impact
  - Diligence path
  rows:
  - - Humana multi-state expansion from a 2020 starting relationship
    - One named payer expansion does not reveal broader payer retention or economics
    - Positive durability signal but not enough to underwrite the whole book
    - Request revenue history and savings-share performance for Humana by year and state
  - - Zing existing-partnership expansion across six states
    - Public sources do not say whether growth came from renewal, cross-sell, or a larger base contract
    - Shows repeat business, but not yet how sticky or profitable that business is
    - Request contract-amendment history and member-growth bridge by state
  - - Medical Mutual multi-line-of-business rollout
    - A single-state payer can still become concentrated if scope expands faster than the rest of the customer book
    - Broadens product/channel fit beyond one MA cohort
    - Request Ohio revenue share and contribution margin relative to other named accounts
  - - Nephrology workflow integration through NANI and CKCC footprints
    - Integration can be sticky, but public sources do not show how often these relationships renew or churn
    - Supports a credible provider-channel moat if economics work
    - Request provider-partner renewal rates, implementation costs, and expansion cadence by practice
  - - Health-system and primary-care channels through SSM, Bon Secours, and Oak Street
    - Public evidence is strong on launch framing and weak on current operating depth
    - Potentially diversifies the book beyond health-plan risk
    - Request live-account scorecards, outcome refreshes, and current patient volumes by channel
  - - Undisclosed top-customer share
    - A few national payers could still dominate revenue despite the broad logo roster
    - Concentration could materially affect renewal and margin risk
    - Request top-customer schedule and pipeline dependence by logo
