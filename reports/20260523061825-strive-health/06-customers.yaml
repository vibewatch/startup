- id: named-customer-proof-and-freshness
  title: Named customer proof and freshness
  body: 'Named proof is stronger here than in many private-company customer chapters. Humana is the cleanest payer proof because three public sources line up on the same 2024 expansion, the five-state footprint, the 2020 relationship starting point, and the specific care services delivered. Regence and Medical Mutual add additional health-plan confirmation with disclosed member counts and clear deployment scopes. Zing is important not because it is the largest named account in public materials, but because the 2025 release explicitly calls the move an expansion of an existing partnership, which is rare public evidence of repeat business.


    On the provider side, SSM Health, Bon Secours Mercy Health, NANI, and Oak Street show that Strive is not limited to payer contracting. SSM and Bon Secours show health-system collaboration; NANI shows deep nephrology workflow integration and global-risk governance; Oak Street shows a Medicare-focused primary-care channel for advanced-kidney patients. The company-about page and nephrologist page add testimonial proof from additional groups such as Michigan Kidney Consultants and Midwest Nephrology Associates. The caveat is freshness and depth. Some logos remain publicly visible in 2026, but many deployments are still described through one announcement, one quote, or one case-study style narrative rather than through ongoing current-operating disclosures.'
