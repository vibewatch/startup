- id: deployment-path-and-expansion-motion
  title: Deployment path and expansion motion
  body: 'The public record suggests a repeatable deployment pattern. First, Strive signs a value-based arrangement with either a payer, health system, or nephrology group. Second, it integrates data and workflow around local clinicians, usually through Kidney Heroes teams, analytics, and care-management support. Third, it uses that embedded model to expand into additional states, lines of business, or adjacent channels. Humana is the clearest example because the 2024 agreement explicitly builds on a 2020 starting relationship. Zing is the clearest freshness signal because the 2025 announcement is framed as an expansion of an existing relationship across six states. Medical Mutual broadens the playbook by spanning Medicare Advantage, individual, and commercial group lines in one state rather than only one MA population.


    Provider-side deployments follow the same logic. NANI and the broader CKCC footprint show Strive integrating into nephrology workflows and risk governance; Oak Street shows a primary-care referral and support channel; and Bon Secours plus SSM show system-level adoption. That combination implies Strive''s expansion path is less about pure software-seat growth and more about contracting plus workflow penetration. The chapter can therefore underwrite a credible land-and-expand motion. What it cannot underwrite from public evidence alone is whether these expansions materially improve retention, wallet share, or unit economics over time.'
