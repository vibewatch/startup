- id: durability-concentration-and-disclosure-gaps
  title: Durability, concentration, and disclosure gaps
  body: 'Durability is where the public record thins out sharply. The strongest public retention signal is not a disclosed NRR or renewal table; it is the fact that Humana and Zing both announced expansions of existing relationships. That is useful, but it is still anecdotal relative to what an investor would normally want. None of the reviewed public materials disclose NRR, GRR, logo churn, renewal cadence, average contract length, top-customer revenue share, or payer mix by revenue. Even customer count is under-disclosed because the company prefers to publish served-patient and provider-partner totals rather than distinct active-account totals.


    Satisfaction evidence has the same shape. The company-reported 94% patient satisfaction figure is directionally positive, but the methodology is not public and no independent benchmark surfaced in this run. The adverse search likewise found only a low-confidence anecdotal thread about confusing outreach rather than a formal complaint pattern or a documented failed deployment. The right conclusion is therefore balanced rather than bearish. Public evidence is strong enough to prove real customer adoption across multiple channels, yet it is still too thin to clear the hardest underwriting questions on retention, concentration, and renewal economics. Those remain explicit diligence asks, not hidden assumptions.'
