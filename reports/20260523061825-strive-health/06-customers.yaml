figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public sources imply a six-stage customer journey that starts with a risk-bearing buyer, adds data and workflow integration, and only later earns public proof of expansion.
  data:
    items:
    - label: Channel fit identified
      detail: A payer, health system, nephrology group, or Medicare-focused primary-care channel identifies kidney-care cost and outcome pressure.
    - label: Value-based contract signed
      detail: The buyer adopts a risk-bearing or value-based arrangement rather than a narrow referral-only relationship.
    - label: Data and workflow integration
      detail: CareMultiplier, practice workflows, and local coordination are integrated around existing clinicians and administrators.
    - label: Kidney Heroes activation
      detail: High-touch clinical teams launch outreach, education, medication support, and care coordination for covered populations.
    - label: Regional or channel expansion
      detail: Public proof often reappears only when the relationship expands across new geographies, lines of business, or adjacent channels.
    - label: Renewal economics stay private
      detail: Even after expansion announcements, public materials usually stop short of disclosing NRR, concentration, contract value, or renewal cadence.
  approximationNotes: The stages summarize the public contracting and deployment pattern across Humana, NANI, Regence, Medical Mutual, Oak Street, and Zing rather than a single disclosed account playbook.
  claimRefs:
  - CU004
  - CU007
  - CU012
  - CU018
  - CU021
  - CU023
  - CU034
  - CU037
  - CU040
