      - number: '2.3'
        title: Buyer and channel segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided because value-based kidney care is sold through contracts, not just software
              seats. CMS and its participating Kidney Contracting Entities are one buyer class: the KCE structure
              requires nephrologists or nephrology practices plus transplant providers, can optionally include dialysis
              facilities, and increasingly relies on integrated kidney care organizations for operations, education, and
              analytics. That makes nephrology groups both users and channel owners. Strive's nephrologist page
              explicitly leans into that structure by saying nephrologists are in the driver's seat of new value-based
              models, including CKCC and Medicare Advantage full-risk arrangements.


              Health plans form the second major buyer class. Strive's payor page is explicit that the offering targets
              commercial, Medicare Advantage, and Medicaid plans, and the 2024 Humana expansion announcement shows how
              that looks in practice: a multi-state agreement for most Humana Medicare Advantage HMO and PPO members
              with kidney disease, covering interdisciplinary care, dialysis-access planning, transplant coordination,
              medication management, and social services. The CKD Spotlight dashboard adds a useful market signal here
              because it is built from national multi-payer claims and segments CKD diagnosis and management by payer
              and geography, reinforcing that payers have enough data and enough spend concentration to treat kidney
              care as a distinct management category rather than as a generic case-management problem.


              Health systems and provider organizations are the third buyer/channel class, while integrated kidney care
              organizations sit across the stack as operating enablers. Strive's media kit says the company is a
              full-service solution for providers, health systems, payors, and patients, and Echo's CKCC launch
              announcement showed the same channel logic earlier: Strive working with 260 nephrology providers in 27
              groups, while also courting commercial payers, health systems, and medical groups. The important market
              implication is that adoption does not move through one procurement path. Some contracts are payer-led,
              some are nephrology-led, and some rely on co-selling or operating partnerships between specialists and
              plans.
