      - number: '5.2'
        title: 'Technology and operating architecture: data aggregation, risk scoring, workflow integration'
        blocks:
          - type: paragraph
            body: >-
              The most specific public technical description comes from Strive's CareMultiplier materials and
              provider-integration content. Those sources say CareMultiplier aggregates and standardizes data from many
              or even hundreds of sources, runs kidney-specific predictive models, and feeds actionable outputs into a
              proprietary care-management workflow suite and EMR-connected processes. The model outputs named publicly
              include dialysis-crash risk, admission and readmission risk, disease-progression risk, and identification
              of undiagnosed kidney disease. Strive also says the platform can trigger around-the-clock alerts and
              population-level dashboards so clinicians can act before expensive events occur.


              The architecture that emerges from those sources is not an API-first developer product; it is a
              human-in-the-loop operating stack. Data comes in from partner environments, CareMultiplier standardizes
              and scores it, provider-integration teams connect the outputs to EMR and workflow processes, and Kidney
              Heroes or partner clinicians execute interventions. The integration playbook is unusually explicit on
              process even if it is light on software internals: proactive provider outreach, in-person practice visits,
              standardized communication channels, role setting, interoperability goals, and compliant EMR integration
              are all documented publicly. Strive also makes aggressive deployment claims, including integrating partner
              data in under two weeks and standing up a new partner model in 90 days.


              That combination of analytics plus workflow design is a real differentiator, but it also reveals the
              chapter's main technical constraint. Strive discloses outcomes and operating claims, not deep system
              documentation. Public materials do not expose APIs, data schemas, model cards, uptime commitments, or
              incident-history surfaces. As a result, the operating architecture is intelligible at the business-process
              level and still partially opaque at the software-engineering level.
