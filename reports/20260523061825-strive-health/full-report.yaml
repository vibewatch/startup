          detail: Opaque economics plus reimbursement pressure push Strive toward the lower end of the corridor
        - label: Base case band
          low: 1500
          high: 2100
          unit: USD M
          detail: Current mark can work if take rates, margins, and renewals are confirmed privately
        - label: Bull case band
          low: 2300
