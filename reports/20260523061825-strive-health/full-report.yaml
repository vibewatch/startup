  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Shows how policy, operating, security, and partner shocks flow through Strive’s model into renewals, margins, and
      valuation.
    data:
      nodes:
        - id: policy
          label: CMS policy reset
          detail: Benchmark discounts, capitation cuts, and transplant-bonus removal
        - id: economics
          label: Contract economics
          detail: Net savings thresholds and risk-pool economics tighten
        - id: operations
          label: Care-team execution
          detail: Hiring, integration, and field consistency drive real-world outcomes
        - id: security
          label: Security and privacy controls
          detail: BAA, risk-analysis, and breach readiness shape trust
        - id: outcomes
          label: Clinical and cost outcomes
          detail: Progression, hospitalization, dialysis starts, and satisfaction
        - id: renewals
          label: Customer renewals
          detail: Payer and provider partners decide whether to expand or retrench
        - id: margin
          label: Gross-profit path
          detail: Labor intensity and shared-savings capture determine contribution margin
        - id: capital
          label: Capital flexibility
          detail: Debt terms and remaining liquidity shape the pace of response
        - id: valuation
          label: Valuation support
          detail: Growth quality and durability determine multiple support
      edges:
        - from: policy
          to: economics
        - from: economics
          to: margin
        - from: operations
          to: outcomes
        - from: security
          to: renewals
        - from: outcomes
          to: renewals
        - from: renewals
          to: margin
        - from: capital
          to: operations
        - from: capital
          to: valuation
        - from: margin
          to: valuation
        - from: policy
          to: renewals
    approximationNotes: The map is a synthesized causal view from public sources, not a company-published operating model.
