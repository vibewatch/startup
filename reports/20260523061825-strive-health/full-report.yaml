  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model and monetization: risk-bearing kidney contracts, not a software seat'
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to Strive making money by sitting inside value-based kidney contracts rather than
              by selling a standalone software seat. Strive's payor page says the company is accountable for quality
              outcomes and financial performance for members with chronic kidney disease and end-stage kidney disease
              across commercial, Medicare Advantage, and Medicaid populations. Its nephrologist page says CKCC and
              Medicare Advantage full-risk contracts are core use cases, while the NANI partnership announcement says
              the parties will jointly pursue and manage global risk payment models. Humana's 2024 announcement adds a
              concrete payer-channel example: a multi-state Medicare Advantage agreement for kidney-disease members.
              Taken together, those sources support a monetization model built from care-management operations, embedded
              analytics, and upside/downside performance economics.


              The same source pack also shows why medical spend under management is not revenue. Public Strive-related
              disclosures moved from roughly $600 million of medical spend in the 2022 CKCC launch context, to more than
              $2.5 billion in a 2023 Business Wire announcement, to nearly $5 billion in 2025-2026 company and news
              coverage. Those numbers are meaningful because they signal budget responsibility and the breadth of
              populations under management. They are not the same as recognized revenue, however, because the spend
              denominator includes downstream medical claims paid across attributed populations rather than dollars
              retained by Strive. Without disclosed take rates, capitation PMPMs, admin-service fees, or shared-savings
              splits, investors cannot convert spend under management into top-line revenue with confidence.


              That leaves pricing transparency thin. None of the reviewed official, partner, or trade sources disclosed
              list pricing, realized PMPMs, or the exact allocation of upside and downside by channel. The defensible
              conclusion is that Strive monetizes through payer and provider contracts that bundle clinical operations,
              technology, and financial accountability, while the exact revenue-recognition mechanics remain private.
