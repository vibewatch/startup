      - number: '3.2'
        title: 'Direct platform peers: Monogram, Somatus, Interwell, and Evergreen'
        blocks:
          - type: paragraph
            body: >-
              Among the direct platforms, Monogram and Somatus look most like scaled payer-facing alternatives to
              Strive, but they reach that position differently. Monogram’s public pack is centered on in-home
              multispecialty care and health-plan partnerships. It disclosed a $375 million round in 2023, broad
              strategic backing from payer and investor stakeholders, and a footprint that at that time covered 34
              states and nearly 4,000 cities. Humana and Aetna partnership materials reinforce that Monogram wins
              through plan relationships, home visits, and transplant-evaluation coordination, not through nephrologist
              ownership or a hard dialysis footprint.


              Somatus is the more openly scaled peer in the current public dataset. It now says it serves more than
              500,000 patients across all 50 states and DC, manages more than $14 billion in healthcare costs, and
              contracts with more than 100 nephrology practices and 5,500 providers. Importantly, Somatus also disclosed
              stronger public home-dialysis and transplant outcomes than most peers, which matters because those are
              exactly the outcomes Strive uses in its own sales story.


              Interwell is different again. The 2022 merger combined Fresenius contracting infrastructure, a large
              nephrologist network, and Cricket’s analytics and engagement stack into one entity. That makes Interwell
              the clearest nephrologist-first platform peer, especially because later reporting shows continued payer
              expansion and Oak Street adjacency. Evergreen is smaller in public scale but strategically notable because
              it offers nephrology practices an operational on-ramp from chronic-care-management economics into broader
              value-based care, including new Phamily-enabled AI workflows.
