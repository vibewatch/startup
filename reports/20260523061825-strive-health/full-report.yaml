      - number: '8.2'
        title: Direct comps bracket plausibility, but not a point estimate
        blocks:
          - type: paragraph
            body: >-
              The comparable set is directionally useful and mechanically imperfect. Oak Street is the strongest
              precedent because it shows what a scaled, capitated, value-based care asset can fetch when revenue is
              disclosed and a strategic buyer can diligence the model deeply. CVS paid about $10.6 billion enterprise
              value for Oak Street after Oak Street had already reported $2.16 billion of 2022 revenue and $2.13 billion
              of capitated revenue. That is far more disclosure than Strive provides today, which is exactly why Oak
              Street is informative but not directly portable. On the public side, Alignment, DaVita, and Fresenius show
              another important reality: large, disclosed healthcare operators often trade around modest sales or
              revenue-value relationships even when strategically relevant. Alignment's market cap and low-1x sales
              signal, DaVita's roughly revenue-sized market cap despite profitable integrated kidney care, and
              Fresenius's large revenue base relative to market value all argue against assuming that a private kidney
              platform automatically deserves a premium public multiple.

              Private kidney peers keep the current Strive mark from looking absurd, but they do not make it proven.
              Somatus disclosed a 2022 round above a $2.5 billion valuation, Monogram disclosed a large 2023 funding
              round and broad geographic reach, and Interwell disclosed very large covered-life and
              cost-under-management targets after its merger. Those facts show real investor appetite for kidney
              value-based care. They also come with serious comparability limits. The disclosed private marks are older,
              the business models mix provider networks, in-home delivery, or incumbent infrastructure differently, and
              none of those peer disclosures solve Strive's own missing revenue bridge. The comp set therefore supports
              a corridor of plausibility, not clean proof that the September 2025 mark was fair.
