companyProfile:
  summary: >-
    Strive Health is a Denver-based, founder-led private value-based kidney care company founded in 2018 by Chris
    Riopelle and Will Stokes. Public materials describe a bundled operating model that combines CareMultiplier analytics
    and workflow tooling with Kidney Heroes care teams, nephrology enablement, and payer/provider partnerships for CKD
    and ESKD populations, and the company now says it serves more than 145,000 people across all 50 states. The company
    has clearly reached meaningful operating scale and capital access, but public disclosure still stops short of
    recognized revenue, gross margin, renewal, and debt-term detail.
