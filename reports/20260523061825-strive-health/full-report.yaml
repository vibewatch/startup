      - number: '7.2'
        title: Operational, quality, and trust risk
        blocks:
          - type: paragraph
            body: >-
              Strive is not a light-touch software vendor, so the main operating risk is execution density. The
              company’s own materials say its model works by embedding local integration, care coordination,
              interoperability, and a nurse-practitioner-led care team into nephrology and payer workflows. That can be
              a strength when the organization is disciplined, but it also means quality and margin are vulnerable to
              staffing lag, inconsistent provider adoption, and weak handoffs between analytics and the actual care
              team. Public outcome claims and peer-reviewed signals are directionally strong, yet they do not erase the
              fact that Strive has to keep reproducing those results while scaling nationally and while reimbursement
              conditions get tougher.


              The security and trust layer is similar. Publicly, Strive can point to HITRUST certification, NCQA
              accreditations, and a privacy policy that outlines collection, service-provider use, and transfer rights.
              Regulators, however, care about the harder operating details beneath those labels. HHS says business
              associates handling ePHI need appropriate administrative, physical, and technical safeguards, a
              foundational risk analysis, and timely breach notification. HIPAA Journal’s 2026 enforcement summary shows
              OCR is still leaning into risk-analysis and risk-management failures. The underwriting implication is
              balanced rather than alarmist: this run did not surface a confirmed Strive-specific OCR action or breach
              disclosure, but it also did not surface the kind of independent control evidence that would let an
              investor underwrite cyber and privacy risk as solved.
