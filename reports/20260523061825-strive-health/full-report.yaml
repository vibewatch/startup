  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and public scale
        blocks:
          - type: paragraph
            body: >-
              Strive's customer base is best understood through who bears risk and who owns workflow. The company is not
              selling a narrow point solution to one buyer. Its public surfaces split the market into payors, health
              systems, and nephrologists, while the patient-facing layer sits underneath as the served population rather
              than the paying customer. That framing matters because the evidence recovered in this run consistently
              shows Strive entering through value-based kidney-care economics, then embedding care teams and workflow
              support around local clinicians. In other words, the payer may fund the model, the provider may
              operationalize it, and the member or patient is the end user, but the commercial relationship is still
              with institutional customers.


              The public scale signals are real but easy to misread. Strive disclosed more than 121,000 served patients,
              more than 6,500 provider partners, and all-50-state reach by September 2024. Those numbers support
              national deployment reach, yet they are not the same thing as the number of paying customers. The source
              set never converts patient volume into a distinct logo count, nor does it break revenue by channel. That
              leaves a clear public takeaway: Strive has meaningful customer breadth across payer and provider channels,
              but investors still need private diligence to understand how many active accounts actually sit underneath
              the served-population numbers.
