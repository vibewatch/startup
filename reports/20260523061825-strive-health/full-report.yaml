      - Core assumptions
      - Indicative EV range
      - Return logic
      - Probability signal
      - Key failure mode
    rows:
      - - Bear
        - >-
          Public diligence never closes the revenue and margin gap, KCC resets pressure economics, and downstream
          dialysis pricing limits shared savings
        - USD 900M to 1300M
        - Entry only works as downside-protected exposure rather than premium-growth equity
        - Management avoids disclosure, renewal quality is opaque, or policy sensitivity looks high
        - Thin margins or senior claims absorb most upside
      - - Base
        - >-
          Private diligence shows real take rates, manageable care-delivery margins, and durable payer/provider renewals
          under current policy terms
        - USD 1500M to 2100M
        - Current round can be defensible, but only with limited margin-of-safety and disciplined entry terms
        - Revenue bridge is credible, gross margins hold, and policy exposure is diversified
        - Economics prove merely adequate rather than premium
      - - Bull
        - >-
          Management discloses strong revenue quality, resilient contribution margins, high renewal rates, and
