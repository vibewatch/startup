    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Bear, base, and bull enterprise-value bands for Strive as of runDate. These are public-only underwriting bands,
      not management marks.
    data:
      items:
        - label: Bear case band
          low: 900
          high: 1300
