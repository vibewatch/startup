            title: Spend under management is not revenue
            body: >-
              The most common public shortcut in kidney value-based care is to confuse medical spend or member counts
              with company revenue. That shortcut is especially dangerous here because Strive has not disclosed take
              rates or gross margins.
            calloutType: risk
