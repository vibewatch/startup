      - number: '1.2'
        title: Founders, Leadership Bench, and Governance Signals
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is one of the clearer strengths in Strive’s profile. Chris Riopelle did not enter
              kidney care from generic SaaS or payer-ops backgrounds; company materials say he spent a decade at Gambro
              and DaVita, ultimately leading a roughly $1 billion division before later serving as COO of LaVie Care
              Centers and CEO of NorthStar Anesthesia. That mix matters because Strive’s problem set sits at the
              intersection of nephrology operations, risk-bearing care delivery, post-acute complexity, and
              provider-network execution. The public origin story also shows why the product posture emphasizes patient
              navigation and earlier action rather than purely actuarial risk scoring. Will Stokes remains listed as
              co-founder and advisor, suggesting the founding bench persists even as the operating structure
              professionalizes.


              Strive’s leadership roster now looks much more like a scaled operating company than a startup improvising
              around a charismatic founder. The current public team includes Paul Marchetti as President, Jen Browne as
              COO, Orin McIntosh as CFO, Keith Bellovich as Chief Nephrologist, Tom Hawkes as CTO, Michele Paige as
              Chief Growth Officer, Sumair Akhtar as Chief Clinical Officer, Jon Kweller as General Counsel, Dave
              Thornton as Chief People Officer, and Amit Trivedi as Chief Actuary. The April 2025 executive-team
              expansion is especially notable because Marchetti arrived from CarelonRx and other large managed-care and
              provider-network settings, while Browne’s background spans quality, risk adjustment, disease management,
              and Optum-scale population health. That suggests Strive is consciously adding leaders who understand both
              specialty-care delivery and payer-style operating systems.


              Governance remains only partially transparent because Strive is private and does not publish a full board
              roster on the pages reviewed. Still, several signals are visible. Riopelle has accumulated regional and
              national recognition, including Denver Business Journal and EY honors, and Fierce Healthcare reported that
              NANI made an equity investment alongside venture backers in 2021, which implies strategic partner
              alignment beyond standard customer contracting. The main diligence caveat is that public sources reveal a
              strong executive bench but not enough about board independence, committee structure, or founder voting
              control to assess governance rigor with confidence.
