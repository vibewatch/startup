  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Reimbursement reset overwhelms the model
        - Channel mix and contract economics disclosure
        - >-
          Management cannot show enough non-KCC or sufficiently profitable post-reset business to offset 2026 policy
          cuts
        - Downgrade the thesis because policy risk is a direct earnings risk, not just headline noise
      - - Outcome claims stop converting into renewals
        - Independent cohort and customer-level performance
        - Hospitalization, progression, or total-cost metrics fail to hold in newer markets or under tighter economics
        - Treat growth as less durable and assume valuation support should compress
      - - Security or privacy control failure
        - Incident notices, customer trust reviews, or regulator scrutiny
        - Any material breach, OCR inquiry, or control lapse that hits procurement or partner trust
        - Pause conviction until management shows containment, remediation, and customer retention
      - - Partner concentration proves higher than public optics suggest
        - Top-account share and renewal calendar
        - Any single payer or provider channel is too large without strong terms or diversification
        - Apply a higher haircut to renewal certainty and terminal value
      - - Debt terms constrain flexibility
        - Debt summary and liquidity runway
        - Covenants, maturity, or collateral terms force slower hiring or reduce downside tolerance
        - Treat the raise as less protective than the headline amount implies
      - - People and launch discipline slip
        - Retention, vacancy, launch, and implementation metrics
        - Leadership churn rises or field execution weakens while growth hiring remains elevated
        - Assume operating leverage is deteriorating and lower confidence in scaling assumptions
    notes: >-
      Kill criteria are monitorable thresholds for underwriting discipline, not management guidance or a forecast of
      what will happen.
