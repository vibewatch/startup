      - number: '3.4'
        title: What actually differentiates Strive, and how durable is it?
        blocks:
          - type: paragraph
            body: >-
              On public evidence alone, Strive’s best wedge is not simple size. Somatus discloses the larger current
              managed-population number, Monogram has heavyweight payer investors and national in-home reach, Interwell
              owns the clearest nephrologist-governance story, and DaVita or Fresenius have the deepest physical and
              channel assets. Strive instead looks strongest where buyer breadth and implementation speed matter
              together. Its public materials show meaningful payer range, nephrologist support, and a kidney-specific AI
              platform that claims unusually fast partner onboarding. That combination can matter for plans or provider
              groups that want a kidney-specialty operating layer without taking on incumbent dialysis alignment.


              The durability question is less settled. Public pricing is mostly opaque across the peer set, so outside
              investors cannot see who has the best real economics. Several competitors also position themselves as
              extensions of nephrologists or home-based teams, which suggests that switching costs may be lower than
              headline marketing implies and that multi-homing may remain common. Finally, the current reimbursement
              scaffolding runs through 2026, while the more transplant-inclusive next generation is still proposed
              rather than locked. The net result is a market where Strive clearly belongs in the top competitive tier,
              but where moat claims should be framed as conditional on partner retention, contract economics, and the
              next policy cycle rather than as already settled fact.
