  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape shape: direct peers, incumbents, adjacencies, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The kidney value-based care landscape is no longer a simple Strive-versus-one-vendor comparison.
              Independent market analysis says the field is still anchored by a concentrated dialysis base dominated by
              DaVita and Fresenius, while newer payment models and Medicare Advantage growth are pulling nephrology
              practices, payers, dialysis chains, and MSO-style partners into more risk-bearing relationships. In
              practice that creates at least four rival classes for Strive: direct specialty platforms such as Monogram,
              Somatus, Interwell, and Evergreen; incumbents such as DaVita Integrated Kidney Care and the Fresenius
              ecosystem; adjacent care-delivery channels such as Oak Street or home-health partners; and the status quo
              of payer case-management or nephrology-practice internal build.


              Strive is not out of place in that set, but neither is it alone. Stout’s market map places Strive among
              multiple converging entrants rather than in a category of one, and several competitors publicly describe
              almost the same buyer promise: earlier intervention, multidisciplinary care, fewer hospitalizations, more
              home-dialysis uptake, more transplant readiness, and lower total cost of care. The real differentiation
              therefore shifts away from the generic marketing language and toward harder questions: which platform owns
              the payer relationship, which one controls nephrologist workflow, which one has physical care-delivery
              assets, and which one can actually implement analytics quickly enough to matter. Those are the lenses used
              for the rest of this chapter.
