  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Value-based kidney care is not the entire renal market and it is not synonymous with dialysis
              reimbursement. The defensible boundary for Strive includes four connected layers: upstream CKD
              identification and risk stratification; high-touch care coordination that sits alongside nephrologists and
              PCPs; risk-bearing nephrology operations inside CMS or payer contracts; and downstream
              dialysis-transition, home-dialysis, and transplant navigation. CMS describes the KCC/CKCC structure as a
              coordinated model for Medicare fee-for-service patients with stage 4-5 CKD, ESRD, or transplant status,
              while Strive's own partner pages and media kit show the commercial market extending that same operating
              model to Medicare Advantage, Medicaid, commercial plans, nephrology groups, health systems, and physician
              partners. That framing matters because it keeps the chapter focused on operating and contracting layers
              where Strive can earn value, not on the entire dialysis facility revenue pool or every generic
              chronic-care software category.


              The clearest public evidence for why the boundary matters comes from the split between disease burden and
              paid-market structure. Official sources put the adult CKD population in the mid-30 millions, yet the
              treated ESKD population is only a small fraction of that total and CKCC/KCC aligned beneficiaries are
              smaller still. Public Medicare spending lenses also vary sharply by what is included: older-adult CKD
              claims, ESKD-specific spend, dialysis facility payments, or broader kidney-disease totals. Company sources
              then go further, using unmanaged-spend figures above $400 billion that are directionally useful but not
              directly comparable to Medicare-only baselines. Treating all of those numbers as the same TAM would
              overstate certainty.


              The legacy substitutes are likewise broader than a simple list of startup competitors. Status-quo kidney
              care is still anchored in fragmented fee-for-service nephrology follow-up, dialysis-provider operating
              models, and general payer case-management programs. Specialty kidney-care platforms only create
              incremental economic value if they coordinate across those silos better than the default stack. Strive's
              nephrology and payor materials repeatedly position the company as the connective layer rather than as a
              dialysis owner or a thin analytics widget, which supports defining the market around integrated,
              value-based kidney operations rather than around undifferentiated renal reimbursement.
