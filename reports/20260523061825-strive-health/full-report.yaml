      - number: '4.2'
        title: Unit economics and what the public record still cannot prove
        blocks:
          - type: paragraph
            body: >-
              Public unit-economics visibility is materially weaker than public operating-scale visibility. Strive's
              media kit and Series D materials give a credible scale snapshot: more than 145,000 people served, more
              than 6,500 provider partners, nearly $5 billion of annual medical spend under management, and more than
              770 employees by early 2026. Those are useful underwriting proxies because they show Strive is not a tiny
              pilot vendor. They still do not answer the core finance questions that matter most for venture
              underwriting: recognized revenue, gross margin, EBITDA, free cash flow, monthly burn, runway, CAC,
              payback, renewal rates, or net revenue retention.


              The public model description suggests why. Strive repeatedly describes itself as an extension of the
              provider office, with nurse-practitioner-led and multidisciplinary care teams wrapped around data and
              workflow tools. The provider-integration piece specifically says Strive serves as an extension of a
              provider's office, and the nephrologist materials emphasize support for CKCC and full-risk contracts. That
              points to a service-heavy cost base in which clinician payroll, care coordination, implementation,
              provider onboarding, and analytics development all matter. It also implies margins are likely determined
              less by classic software hosting efficiency and more by care-team productivity, contract design, and how
              quickly technology can reduce avoidable utilization.


              Outcome evidence may strengthen revenue quality without revealing unit economics. Strive's 2025
              resource-center summary of peer-reviewed research says stage 3b CKD patients in its program saw a 77.2%
              reduction in CKD progression rate and stage 4 patients saw a 65.2% reduction. That type of evidence can
              make payer renewals and provider alignment more plausible. But public readers still do not get the
              contract math behind those outcomes. The correct stance is therefore to use public scale and outcome
              disclosures as quality signals while treating all margin, take-rate, and profitability conclusions as open
              diligence items rather than as solved facts.
