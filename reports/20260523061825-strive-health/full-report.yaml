      - Key limitation
    rows:
      - - Strive Health
        - Reported September 2025 round; $550M financing with nearly $5B spend under management
        - Reported at about $1.8B valuation
        - Direct current entry mark under review
        - Revenue, margin, and debt-term disclosure are still missing
      - - Oak Street Health / CVS
        - 2022 revenue $2.16B and capitated revenue $2.13B before sale
        - Acquired for about $10.6B EV at $39 per share
        - Strongest value-based care control-value precedent
        - Disclosed capitated primary-care economics make it more transparent than Strive
      - - Alignment Healthcare
        - Market cap about $3.38B and roughly 0.81x sales signal in May 2026
        - Public market value-based care reference
        - Shows what disclosed value-based care operators can command publicly
        - Different payer mix and far more disclosure than Strive
      - - DaVita
        - 2025 revenue $13.643B and May 2026 market cap about $12.74B
        - Public incumbent kidney-care context comp
        - Useful for understanding what profitable kidney scale looks like in public markets
        - Hard assets and dialysis footprint make it a strategic context comp, not a like-for-like startup comp
      - - Fresenius Medical Care
        - 2025 revenue €19.63B and May 2026 market cap about $11.62B
        - Public global kidney-care incumbent context comp
        - Reinforces that large kidney platforms do not automatically carry premium public multiples
        - Global dialysis and manufacturing mix are structurally different from Strive
      - - Somatus
        - 2022 official Series E disclosed $325M-plus financing and 150k-plus members in 34 states
        - Valuation disclosed above $2.5B in 2022
        - Closest disclosed private kidney-platform valuation reference above Strive's mark
        - Older mark with different business mix and a different rate environment
      - - Monogram Health
        - 2023 official funding press disclosed $375M and reach across 34 states and nearly 4,000 cities
        - Large private funding signal without reviewed public valuation disclosure
        - Useful peer for investor appetite and geographic reach
        - Funding size is not the same as an explicit comparable valuation mark
      - - Interwell Health
        - Official merger materials targeted more than 270k covered lives and $11B costs under management by 2025
        - Strategic scale reference; no clean reviewed standalone valuation anchor in this chapter
        - Shows how large nephrology-network platforms can become after consolidation
        - Merger-backed platform with incumbent infrastructure is structurally different from Strive
