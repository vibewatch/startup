      - number: '5.4'
        title: Roadmap, maturity, and unresolved technical opacity
        blocks:
          - type: paragraph
            body: >-
              Public maturity signals are substantial. By early 2026 Strive claimed 145,000-plus patients, 6,500-plus
              provider partners, nationwide reach, and 770-plus employees, which is too much operating scale to dismiss
              as a pilot story. The September 2025 Series D announcement also tied fresh capital directly to AI-driven
              tools, deeper payer-provider partnerships, and multi-specialty expansion. The March 2026 Strive On Live
              recap sharpens that roadmap by discussing AI-enabled population identification, compliance concerns, and
              cardiometabolic collaboration. Outside the product pages, hiring signals reinforce the same direction:
              public job postings point to AI engineering, data infrastructure, and engineering leadership needs rather
              than a frozen platform.


              Those are all signs of a product stack that is still being actively built and broadened. They also suggest
              Strive is trying to extend from kidney-only management toward a more multi-specialty, whole-person care
              architecture without abandoning nephrology as the center of gravity. That is strategically sensible
              because CKD outcomes are tightly linked to diabetes, hypertension, and cardiovascular disease, and
              Strive's workflow pages already emphasize coordination across specialties.


              The unresolved issue is that maturity is easier to see in operations than in documentation.
              Developer-signal exists, but it is mostly indirect through hiring pages, not through a public
              documentation surface, release notes, or a visible developer ecosystem. The public record therefore
              supports a nuanced conclusion: Strive looks mature as a deployed care-and-tech platform, but still
              relatively opaque as a software platform. That does not invalidate the product thesis; it simply means the
              technical moat and reliability story should be underwritten with private diligence rather than public
              marketing alone.
