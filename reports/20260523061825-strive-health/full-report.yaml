chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Care Model
        blocks:
          - type: paragraph
            body: >-
              Strive Health is a Denver-based company founded in 2018 to re-architect kidney care around earlier
              intervention, coordinated multidisciplinary support, and risk-bearing economics rather than the legacy
              system’s focus on late-stage dialysis. Authoritative company materials name Chris Riopelle and Will Stokes
              as co-founders, anchor the mission in the phrase "Redefining care. Elevating life," and repeatedly frame
              the business as a national leader in value-based kidney care. The core thesis is that kidney disease is
              too often detected late, managed in fragmented silos, and paid for through incentives that reward
              downstream intensity instead of upstream prevention. Riopelle’s personal origin story — seeing a close
              friend nearly reach kidney failure — appears consistently across Strive’s media kit, anniversary post, and
              independent local coverage, giving the founding narrative more credibility than a generic mission
              statement.


              The business model described across the homepage, media kit, and product pages has three tightly coupled
              elements. First, Strive deploys high-touch Kidney Heroes teams led by nurse practitioners and supported by
              nurses, social workers, dietitians, case managers, and care coordinators. Second, it embeds with local
              nephrologists, PCPs, health systems, and payors rather than replacing them. Third, it uses CareMultiplier,
              a kidney-specific machine-learning and predictive-analytics platform, to identify high-risk patients,
              surface care gaps, and prompt earlier interventions. Management presents the offering as a full-service
              solution spanning commercial plans, Medicare Advantage, traditional Medicare, health systems, physician
              groups, and CMS-linked programs. That is strategically important because it means Strive is not a
              single-contract point solution; it is trying to own the operating layer around value-based kidney care.


              The company’s positioning claims are strong but not entirely neutral. Strive calls itself the nation’s
              leader in value-based kidney care, and its materials cite 145,000-plus patients, 6,500-plus provider
              partners, and nearly $5 billion of medical spend under management. Those scale claims are corroborated
              across multiple 2024-2026 official releases and independent trade coverage. The stronger analytical
              takeaway is that Strive appears to have crossed from pilot-stage kidney-navigation vendor into a national
              specialty-care platform with meaningful operating reach, though public disclosures still emphasize
              operational metrics rather than revenue or profitability.
