  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Public product modules and the kidney-care workflow they are built to serve
        blocks:
          - type: paragraph
            body: >-
              Strive's product surface is narrower than a broad digital-health suite but broader than a single analytics
              tool. The official solutions pages consistently bundle four named components: Population Health, Kidney
              Heroes, CareMultiplier, and Strive Care Partners. Taken together, they define a workflow that starts with
              identifying kidney-risk patients earlier, moves through high-touch clinical outreach, and then supports
              nephrologists, health systems, and payors inside value-based arrangements. The public pages do not market
              a software seat in isolation; instead they present software, staffing, and contracting support as one
              coordinated delivery model.


              That workflow emphasis is visible in the user jobs each module covers. Population Health focuses on
              proactive patient identification, education, and progression management before kidneys fail. Kidney Heroes
              are the operational layer: nurse-practitioner-led, multispecialty teams that act as care extenders for
              nephrologists while coordinating with PCPs and other specialists. Strive Care Partners is the
              nephrologist-facing risk-enablement wrapper for CKCC and Medicare Advantage full-risk models.
              CareMultiplier sits behind those services as the kidney-specific data and predictive layer that feeds
              interventions to care teams. Humana's multi-state announcement adds concrete workflow detail by naming
              medication management, dialysis access planning, transplant coordination, and social services as part of
              the delivered service.


              The practical implication is that Strive sells into payer/provider workflows, not around them. Product
              maturity therefore depends less on flashy standalone features and more on whether these modules actually
              reinforce each other at the point of care. Public evidence suggests they do, especially for preventative
              kidney management and nephrology support. The trade-off is that outside readers get a strong care-model
              description but much less transparent module-level documentation than they would expect from enterprise
              software sold as a separate platform.
