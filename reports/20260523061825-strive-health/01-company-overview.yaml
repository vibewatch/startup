- id: capital-base-and-stakeholders
  title: Funding History, Capital Base, and Strategic Stakeholders
  body: 'Strive’s funding trajectory shows a company that moved from growth capital into true scale capital. The public record is strongest from 2021 onward: a $140 million Series B led by CapitalG in March 2021, a $166 million Series C led by NEA in May 2023, and a September 2025 Series D consisting of $300 million in equity plus $250 million in debt. Independent coverage by Fierce Healthcare, MedCity News, MobiHealthNews, Yahoo Finance, and HLTH aligns with the company’s own announcement that the Series D valued Strive at approximately $1.8 billion. The investor syndicate is also telling. NEA remained the lead equity sponsor, while CVS Health Ventures, CapitalG, Echo Health Ventures, Town Hall Ventures, Redpoint, BlackRock affiliates, and Hercules Capital all participated in the 2025 capital stack. This is a blend of venture, strategic healthcare, technology, asset-management, and specialty credit capital — a useful sign that Strive is being underwritten as both a care-delivery platform
    and an increasingly data-rich healthcare-infrastructure asset.


    The disclosed funding trail implies substantial cumulative capital. Because Strive said total funding stood at $223.5 million after the Series B, and later disclosed the Series C and D amounts, public materials support a minimum lifetime capital figure of roughly $939.5 million, including debt, and at least $689.5 million of equity. That is important for two reasons. First, it gives Strive a much larger capital cushion than many narrow digital-health companies. Second, it confirms the business has required significant financing to build national provider integration, care teams, analytics infrastructure, and multi-line contracting capabilities.


    Stakeholder depth extends beyond investors. Humana expanded a multi-state Medicare Advantage relationship in 2024, SSM formed a joint venture back in 2020, and CKCC-related nephrology relationships made Strive the largest non-dialysis participant at launch in 2022. The cumulative picture is of a company that has been able to convert funding momentum into institutional trust from both capital providers and strategic operating partners. The open question is whether that trust also translates into durable unit economics, because the public dataset highlights medical spend and clinical outcomes far more than recognized revenue or profitability.'
