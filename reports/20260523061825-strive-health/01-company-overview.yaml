- id: milestones-scale-and-caveats
  title: Milestones, Scale Signals, and Public Diligence Caveats
  body: 'From a diligence perspective, Strive’s milestones read like a steady progression from regional kidney-care redesign to national platform status. The founding narrative starts in 2015 with Riopelle’s exposure to a friend’s kidney emergency, converts into company formation in 2018, and then becomes institutional through the 2020 SSM joint venture, the 2021 Series B, the 2022 CKCC expansion, the 2023 Series C, and the 2024 expansion to all 50 states. By early 2026, the media kit describes a company with 770-plus employees, 145,000-plus people served, more than 6,500 providers, and nearly $5 billion of managed medical spend. It also claims strong outcomes — 20% lower total kidney-care cost, 41% fewer hospitalizations, higher optimal dialysis starts, higher home dialysis adoption, and 94% patient satisfaction. Those are the metrics most central to Strive’s sales narrative and valuation support.


    There are two important caveats. First, public financial transparency remains thin. Even after a landmark Series D, the company’s public materials still do not disclose audited GAAP revenue, profitability, gross margin, or cash burn. Investors therefore appear to be underwriting Strive primarily on growth, operating scale, strategic relevance, and outcome claims rather than on fully transparent financial statements. Second, the external policy environment has turned less forgiving. Avalere and Jones Day both describe 2025 CMS changes to the Kidney Care Choices model as responses to provider attrition, tighter economics, and roughly $304 million of net losses in the model. Because Strive has built real scale in CMS-aligned and nephrology-linked value-based care, those changes are not abstract sector noise; they are a direct operating headwind if benchmark discounts, bonuses, or reimbursement mechanics continue to tighten.


    Overall, the company-overview evidence supports a positive but qualified conclusion. Strive has genuine national reach, unusually strong founder-market fit, blue-chip backers, and a differentiated kidney-care operating model. But it is still a private, capital-intensive company operating inside a policy-sensitive market where public evidence on profitability and governance remains incomplete.'
