  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited GAAP revenue, gross margin, EBITDA / operating loss, and cash balance or runway disclosures.
    whyItMatters: These are necessary to judge whether Strive's scale and outcome claims convert into durable economic performance at a $1.8B valuation.
    diligencePath: Request lender materials, board packets, and monthly management reporting tied to the 2025 Series D and Hercules debt package.
    relatedQuestionRefs:
    - QO032
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Full current board composition, committee structure, and investor governance rights.
    whyItMatters: Private-company governance quality affects control, financing flexibility, and downside protection for new investors.
    diligencePath: Request the cap table, investor rights agreement, board observer rights, and a current org/board chart.
    relatedQuestionRefs:
    - QO008
    - QO020
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A single, current headcount figure after the January 2026 media kit.
    whyItMatters: Public sources cite 700+ employees in September 2025 and 770+ in January 2026, but no later verified update exists.
    diligencePath: Confirm active FTE count, clinical-versus-corporate split, and post-Series-D hiring plan with HR or diligence data room.
    relatedQuestionRefs:
    - QO017
  - type: stale
    severity: material
    topic: regulatory-risk
    missingEvidence: Updated economics for each CKCC / CMS-linked contract after the 2025 KCC revisions.
    whyItMatters: Public policy summaries identify tighter benchmarks and weaker economics, but they do not quantify direct P&L exposure for Strive.
    diligencePath: Request contract-level gross margin by program and a sensitivity analysis under revised 2026-2027 CMS assumptions.
    relatedQuestionRefs:
    - QO034
  - type: missing-source
    severity: minor
    topic: early-funding-history
    missingEvidence: A primary source itemizing Strive's pre-Series-B funding rounds and exact dates.
    whyItMatters: The public record is sufficient for minimum disclosed capital but not for a fully precise early-round chronology.
    diligencePath: Request historical financing schedule from the company or retrieve charter / Form D / board-consent records from counsel.
    relatedQuestionRefs:
    - QO018
    - QO022
    - QO023
    relatedTableRefs:
    - TO003
    - TO004
  - type: missing-source
    severity: minor
    topic: category-leadership-proof
    missingEvidence: A third-party market-share or rankings source that independently tests Strive's self-described category-leader position against peer kidney-care platforms.
    whyItMatters: The company repeatedly uses leadership language, but public evidence is stronger on scale and outcomes than on an externally benchmarked competitive ranking.
    diligencePath: Request market-share analyses, payer contract counts versus peers, or an independent nephrology-market study to validate category leadership.
    relatedQuestionRefs:
    - QO035
