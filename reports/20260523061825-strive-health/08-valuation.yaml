  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence in favor
      - Anti-thesis
      - What would change the view
    rows:
      - - Scale and relevance
        - Strive has real payer and provider breadth plus meaningful population scale in kidney care
        - Scale without revenue disclosure can still hide weak unit economics
        - Show recognized revenue, gross profit, and cohort retention by channel
      - - Kidney-specific positioning
        - The company is clearly inside the top tier of kidney value-based care entrants
        - The market is crowded and peers disclose comparable or larger managed-population signals
        - Prove superior renewal, implementation speed, or margin performance versus peers
      - - Financing quality
        - The round size and investor mix imply strong external confidence
        - Forty-five percent of gross proceeds came from debt, which can overstate equity cushion
        - Disclose debt terms, security package, and any preference overhang
      - - Public comp support
        - Oak Street and Somatus show large values are possible in value-based care and kidney platforms
        - Oak Street had disclosed revenue and Somatus' last disclosed mark is older and differently structured
        - Provide enough financial disclosure to move Strive from narrative comp to analyzable comp
      - - Public market discipline
        - Alignment, DaVita, and Fresenius provide grounded valuation context
        - Public comps generally trade on disclosed economics at much tighter multiples than private scarcity stories
        - Show that Strive deserves a durable premium rather than a temporary private-market premium
      - - Current anti-thesis
        - Strive may be a strategically good company bought at an under-proven price
        - Private diligence could still validate the mark if take rates and margins are strong
        - Open the revenue bridge, renewal cohorts, and contribution margins before asking for conviction
    notes: >-
      The anti-thesis is intentionally price-sensitive. A company can remain strategically compelling while still being too
      hard to underwrite at the disclosed entry valuation.
