runDate: '2026-05-23'
company:
  name: Strive Health
chapter:
  number: 8
  title: Valuation
  summary: >-
    Strive's September 2025 ~$1.8B valuation is strategically plausible but not tightly priceable from public evidence. The
    company looks relevant on payer reach, provider breadth, and kidney-care positioning, yet the record still omits the
    revenue, take-rate, margin, and cap-table data needed to prove that the price is fair rather than stretched. The most
    defensible public conclusion is research-more: bracket the valuation with scenario ranges and direct comps, but do not
    underwrite the mark as fully supported until private diligence bridges managed spend to recognized revenue and gross
    profit.
sections:
  - id: priceability-and-evidence-quality
    title: Priceability starts with disclosed economics, and those are still missing
    body: >-
      The headline round is easy to repeat and hard to underwrite. Strive's official September 2025 financing announcement
      and contemporaneous coverage support a $550 million Series D made up of $300 million of equity and $250 million of
      debt, with outside coverage placing the round at roughly a $1.8 billion valuation. Public materials also support
      that this is not a tiny vendor: Strive says it serves more than 145,000 people with kidney disease, works with more
      than 6,500 provider partners, operates across all 50 states, and manages nearly $5 billion of annual medical spend.
      Those are meaningful relevance signals. They are not enough to prove valuation. The same public record still does
      not disclose recognized revenue, gross margin, EBITDA, realized PMPMs, shared-savings splits, or the debt terms and
      preference stack that determine what the headline valuation means for common-equity upside.

      That distinction matters because medical spend under management and patient counts are not transferable valuation
      denominators. Spend under management is a claims pool, not Strive's retained top line. Patient counts are also poor
      stand-ins for value unless investors can see payer mix, take rate, contract duration, nurse-practitioner intensity,
      and whether economics come from shared savings, admin fees, or some hybrid structure. Public evidence therefore says
      two things at once. First, Strive clearly matters in kidney value-based care. Second, the company is not publicly
      disclosed enough to support a precise EV-revenue or EV-EBITDA judgment. The right analytic posture is to use the
      current mark as a bracketed scenario input rather than as a proven fair price.
    claimRefs:
