  - id: thesis-breaks-and-final-diligence
    title: The thesis survives only if private diligence closes a short list of decisive gaps
    body: >-
      The decisive next step is not another narrative source; it is a disclosure package. Investors need management to show
      how medical spend converts into recognized revenue, gross profit, and cash generation by contract type. They also
      need the sensitivity of that economics stack to KCC resets, downstream dialysis pricing, and the relative weight of
      Medicare, Medicare Advantage, commercial, and Medicaid channels. Without that bridge, even a strategically strong
      company can be a poor investment at a rich entry price. The latest round's debt component raises the bar further,
      because the debt terms and any liquidation preference stack determine whether the headline mark maps cleanly to fresh
      equity upside.

      The decisive kill criteria are equally concrete. The thesis breaks quickly if management cannot show durable renewal rates,
      if current gross-margin logic depends on policy assumptions that already worsened in 2026, or if the company cannot
      separate differentiated economics from sheer medical-spend scale. A secondary break comes from capital structure: if
      debt covenants, liquidation preferences, or other senior claims absorb too much upside, the company can remain
      operationally interesting while still being an unattractive entry. That is why the final diligence asks are
      financial and contractual rather than philosophical. Strive has likely done enough to earn a deeper look. It has not
      yet done enough publicly to turn the September 2025 price into a clean yes.
    claimRefs:
