callouts:
  - calloutType: recommendation
    title: Current posture
    body: >-
      Strive looks strategically important enough to merit diligence, but the September 2025 ~$1.8B price is still a
      research-more situation rather than a clean buy. Public evidence supports corridor thinking, not point-price
      conviction.
    claimRefs:
      - CV035
      - CV043
      - CV044
  - calloutType: risk
    title: Spend under management is not revenue
    body: >-
      The most common public shortcut in kidney value-based care is to confuse medical spend or member counts with company
      revenue. That shortcut is especially dangerous here because Strive has not disclosed take rates or gross margins.
    claimRefs:
      - CV009
      - CV010
      - CV036
  - calloutType: assumption
    title: What has to be true for the current mark to work
    body: >-
      For the current valuation to be fair, Strive must show that payer and provider renewals are durable, that channel
      margins hold after the 2026 reimbursement reset, and that debt terms do not absorb too much upside.
    claimRefs:
      - CV040
      - CV041
      - CV046
