figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation chain runs from strategic relevance through missing economics and policy pressure to a
      research-more decision rather than a clean buy or avoid.
    data:
      nodes:
        - id: scale
          label: Strategic relevance is real
          detail: Strive has meaningful payer and provider breadth plus large managed-population signals
        - id: private-mark
          label: Private mark is meaningful
          detail: The September 2025 round was large and reported around a $1.8B valuation
        - id: opaque-economics
          label: Economics remain opaque
          detail: Revenue, take rate, gross margin, and EBITDA are still undisclosed publicly
        - id: policy-reset
          label: 2026 reimbursement reset matters
          detail: Kidney model economics tightened while the company still has to prove resilience
        - id: comp-corridor
          label: Comps bracket a corridor, not a point price
          detail: Oak Street, public comps, and kidney peers inform plausibility but do not prove fairness
        - id: recommendation
          label: Research-more
          detail: Current mark may be conditionally fair, but only after private diligence closes the core gaps
      edges:
        - from: scale
          to: private-mark
          label: Relevance helped attract capital
        - from: private-mark
          to: opaque-economics
          label: Size does not solve disclosure
        - from: opaque-economics
          to: policy-reset
          label: Missing margins raise sensitivity
        - from: policy-reset
          to: comp-corridor
          label: Scenario work beats precision
        - from: comp-corridor
          to: recommendation
          label: Corridor is not proof
    approximationNotes: >-
      This is a decision map, not a financial model. It shows why positive company signals still end in a research-more
      posture when economics disclosure is weak.
    claimRefs:
      - CV001
      - CV010
      - CV014
      - CV035
      - CV038
      - CV044
