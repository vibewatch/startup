  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Why it matters
      - Action implication
    rows:
      - - Revenue bridge never closes
        - Management cannot reconcile managed spend to recognized revenue and gross profit by channel
        - The core valuation denominator remains unknown
        - Walk away or require a materially lower entry price
      - - Policy exposure is too concentrated
        - A large share of economics depends on post-reset KCC-like terms without commercial or MA offset
        - 2026 model tightening can compress value fast
        - Cut valuation range and reframe as policy-sensitive care-ops exposure
      - - Renewal quality disappoints
        - Payer or nephrology renewals, cohort outcomes, or contribution margins weaken in newer vintages
        - The scarcity-premium thesis depends on durable partner economics
        - Move from research-more to avoid if slippage is structural
      - - Capital structure is less favorable than headline pricing implies
        - Debt covenants, liens, or liquidation preferences absorb a large portion of incremental upside
        - Headline valuation can overstate value to new common-equity investors
        - Re-underwrite from the security layer, not the headline mark
      - - Public comps rerate lower while Strive stays opaque
        - Public analogs weaken and Strive still provides no financial disclosure
        - Private optimism loses its comp support when public discipline tightens further
        - Demand a larger discount or stop the process
    notes: >-
      These are kill triggers, not routine watch items. Each one directly attacks the assumptions that would make the
      current valuation band supportable.
