  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-bridge
      missingEvidence: A board-grade bridge from medical spend under management to recognized revenue and gross profit by channel.
      whyItMatters: Without a real revenue denominator the current valuation cannot be tested with precision.
      diligencePath: Request audited or board-approved historical actuals plus current run-rate by payer and provider cohort.
      relatedQuestionRefs:
        - QV004
        - QV005
        - QV022
        - QV030
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: blocking
      topic: capital-stack
      missingEvidence: Debt maturity, pricing, collateral, covenants, liquidation preferences, and a full cap-table waterfall.
      whyItMatters: The headline round valuation may overstate value available to new common-equity investors.
      diligencePath: Obtain financing agreements, cap table, and an exit waterfall model from finance and legal teams.
      relatedQuestionRefs:
        - QV002
        - QV029
        - QV027
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: material
      topic: comparable-coverage-gap-tv004
      missingEvidence: Renewal rates, cohort retention, and contribution margins by payer, nephrology group, and geography, plus enough disclosed financial detail to turn mixed peer references into tighter like-for-like comps.
      whyItMatters: A premium valuation only works if partner economics are durable and improving, and the current comparable set stays only partially comparable until Strive opens those economics.
      diligencePath: Review customer cohorts, renewal history, contract-level performance packs, and management's own internal peer set with disclosed revenue and margin bridges.
      relatedQuestionRefs:
        - QV022
        - QV023
        - QV025
        - QV026
        - QV027
      relatedTableRefs:
        - TV003
        - TV004
        - TV006
    - type: private-evidence-only
      severity: material
      topic: policy-exposure-mix
      missingEvidence: Revenue and margin exposure to CKCC, Medicare Advantage, commercial, Medicaid, and any other policy-sensitive channels after the 2026 reset.
      whyItMatters: The reimbursement change set in 2026 can materially alter the defendable valuation corridor.
      diligencePath: Request a 2026 to 2027 scenario pack that ties policy exposure directly to gross profit and renewal assumptions.
      relatedQuestionRefs:
        - QV015
        - QV019
        - QV020
        - QV021
      relatedTableRefs:
        - TV003
