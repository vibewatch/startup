        - Upside requires Strive to earn a scarcity premium over low-multiple public analogs
        - Cohort and renewal data show unusual durability and strategic buyers remain interested
        - Public comps stay muted while Strive never proves premium economics
    notes: >-
      These are scenario bands, not precise appraisal marks. They are anchored to evidence quality, reimbursement pressure,
      private-kidney comp context, and public-market discipline rather than to invented undisclosed revenue multiples.
