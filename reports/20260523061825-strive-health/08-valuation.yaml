      - CV017
      - CV037
      - CV039
      - CV040
      - CV042
      - CV045
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue bridge
        - Board-grade bridge from medical spend under management to recognized revenue by payer and provider channel
        - Converts scale claims into an actual valuation denominator
        - CFO and finance workstream; deliver historical actuals plus current run-rate
      - - Gross margin and contribution margin
        - Gross profit, contribution margin, and care-team cost intensity by contract type
        - Determines whether Strive is a premium platform or labor-heavy services business
        - CFO and operations review; tie to channel-specific economics
      - - Renewal and cohort quality
        - Renewal rates, retention, and gross-profit durability by payer, nephrology group, and geography
        - Tests whether growth is sticky enough to deserve a premium multiple
        - Commercial and customer-success diligence with cohort cut by vintage
      - - Policy exposure map
        - Share of members, revenue, and margin exposed to CKCC, MA, commercial, and Medicaid terms after the 2026 reset
        - Shows how much of current value depends on reimbursement assumptions already under pressure
        - Strategy and finance team; provide scenario pack and downside sensitivities
      - - Capital stack and debt terms
        - Debt maturity, pricing, security, covenants, and any liquidation preferences or ratchets above new money
        - Headline valuation does not equal fresh-equity attractiveness without seniority clarity
        - Legal and finance diligence with full cap table and waterfall model
      - - Exit readiness
        - Evidence of strategic buyer interest, sponsor appetite, and disclosure readiness for a public process
        - Clarifies whether upside depends on a realistic exit path or on narrative expansion alone
        - CEO and CFO diligence with banker materials, board slides, and timing assumptions
    notes: >-
      These asks are the minimum package required to convert today's public-only scenario work into a real underwriting
      decision.
    claimRefs:
      - CV008
      - CV010
      - CV037
      - CV042
