evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited GAAP revenue, gross margin, EBITDA / operating loss, and cash balance or runway disclosures.
    whyItMatters: >-
      These are necessary to judge whether Strive's scale and outcome claims convert into durable economic performance
      at a $1.8B valuation.
    diligencePath: >-
      Request lender materials, board packets, and monthly management reporting tied to the 2025 Series D and Hercules
      debt package.
    relatedQuestionRefs:
      - QO032
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Full current board composition, committee structure, and investor governance rights.
    whyItMatters: >-
      Private-company governance quality affects control, financing flexibility, and downside protection for new
      investors.
    diligencePath: Request the cap table, investor rights agreement, board observer rights, and a current org/board chart.
    relatedQuestionRefs:
      - QO008
      - QO020
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A single, current headcount figure after the January 2026 media kit.
    whyItMatters: >-
      Public sources cite 700+ employees in September 2025 and 770+ in January 2026, but no later verified update
      exists.
    diligencePath: >-
      Confirm active FTE count, clinical-versus-corporate split, and post-Series-D hiring plan with HR or diligence data
      room.
    relatedQuestionRefs:
      - QO017
  - type: stale
    severity: material
    topic: regulatory-risk
    missingEvidence: Updated economics for each CKCC / CMS-linked contract after the 2025 KCC revisions.
    whyItMatters: >-
      Public policy summaries identify tighter benchmarks and weaker economics, but they do not quantify direct P&L
      exposure for Strive.
    diligencePath: Request contract-level gross margin by program and a sensitivity analysis under revised 2026-2027 CMS assumptions.
    relatedQuestionRefs:
      - QO034
  - type: missing-source
    severity: minor
    topic: early-funding-history
    missingEvidence: A primary source itemizing Strive's pre-Series-B funding rounds and exact dates.
    whyItMatters: The public record is sufficient for minimum disclosed capital but not for a fully precise early-round chronology.
    diligencePath: >-
      Request historical financing schedule from the company or retrieve charter / Form D / board-consent records from
      counsel.
    relatedQuestionRefs:
      - QO018
      - QO022
      - QO023
    relatedTableRefs:
      - TO003
      - TO004
  - type: missing-source
    severity: minor
    topic: category-leadership-proof
    missingEvidence: >-
      A third-party market-share or rankings source that independently tests Strive's self-described category-leader
      position against peer kidney-care platforms.
    whyItMatters: >-
      The company repeatedly uses leadership language, but public evidence is stronger on scale and outcomes than on an
      externally benchmarked competitive ranking.
    diligencePath: >-
      Request market-share analyses, payer contract counts versus peers, or an independent nephrology-market study to
      validate category leadership.
    relatedQuestionRefs:
      - QO035
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent kidney-specific TAM or SAM model that reconciles public Medicare baselines with vendor-defined
      unmanaged-spend estimates across payer types and disease stages.
    whyItMatters: >-
      Without a shared boundary, valuation narratives can swing from a narrow care-management vendor to a massive
      specialty-spend platform even when the underlying evidence is unchanged.
    diligencePath: >-
      Request Strive's internal market model, payer-mix assumptions, and disease-stage boundary definitions, then
      benchmark them against public nephrology and payer analyses.
    relatedQuestionRefs:
      - QM018
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: strive-som
    missingEvidence: >-
      Public revenue, contract lives, and spend-under-management splits by CMS, MA, commercial, Medicaid, nephrology,
      and health-system channels.
    whyItMatters: >-
      Strive's current patient count shows operating reach, but it does not reveal how much of the company-specific TAM
      is monetized or at what unit economics.
    diligencePath: >-
      Ask management for segment-level contract lives, PMPM or savings-share economics, renewal rates, and current
      revenue mix by buyer class.
    relatedQuestionRefs:
      - QM025
      - QM026
    relatedTableRefs:
      - TM002
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: payer-segmentation
    missingEvidence: >-
      Payer-by-payer and CBSA-level CKD diagnosis and quality extracts from CKD Spotlight plus comparable public
      procurement or contract disclosures from plans.
    whyItMatters: >-
      The buyer map is directionally clear, but public sources still do not quantify payer-segment share or regional
      penetration precisely enough to produce a clean SAM split.
    diligencePath: >-
      Download the CKD Spotlight dataset and reconcile it with payer press releases, state Medicaid documents, and
      Strive contract disclosures before sizing segment-level opportunity.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >-
      Per-member fees, shared-savings corridors, stop-loss terms, and realized savings splits for Strive and the main
      peer set.
    whyItMatters: >-
      Without actual economics, the public market map can rank capability breadth but cannot underwrite margin
      durability or buyer ROI with confidence.
    diligencePath: >-
      Request anonymized payer contracts or cohort-level economics from diligence management and normalize them to PMPM,
      savings-share, and medical-loss impacts.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: private-peer-financials
    missingEvidence: Current revenue, profitability, and valuation detail for Monogram, Somatus, Interwell, and Evergreen.
    whyItMatters: >-
      Disclosed patient counts and funding rounds are helpful but do not reveal whether any peer has stronger unit
      economics or a more durable capital position than Strive.
    diligencePath: >-
      Request recent investor decks, board materials, or lender packets for the private peer set and reconcile them to
      public fundraising and scale statements.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: post-2026-reimbursement
    missingEvidence: >-
      Finalized post-2026 federal framework for CKCC successors and any transplant-inclusive payment implementation
      timeline.
    whyItMatters: >-
      Platform strategies that lean on home dialysis, optimal starts, or transplant incentives could reprice quickly if
      CMS or commercial follow-on models change.
    diligencePath: >-
      Track final CMS rulemaking, CMMI successor-model notices, and commercial payer updates tied to kidney risk
      contracts before investment committee sign-off.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: channel-conflict
    missingEvidence: >-
      Exclusive terms, renewal structures, and non-compete or referral restrictions in payer, nephrology, and
      home-health partnerships across the peer set.
    whyItMatters: >-
      The moat debate hinges on whether payers and practices can multi-home or switch platforms without major
      contractual friction.
    diligencePath: >-
      Collect representative partner agreements from Strive, nephrology groups, and payer customers and review
      exclusivity, ownership, termination, and referral provisions.
    relatedQuestionRefs:
      - QP022
      - QP023
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
