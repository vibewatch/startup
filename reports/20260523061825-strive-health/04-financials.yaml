callouts:
- calloutType: risk
  title: Managed spend under management is the wrong number to treat as revenue
  body: The most repeated public scale metric is nearly $5 billion of annual medical spend under management, but that is a claims-denominator figure. Without disclosed take rates or fee schedules, public investors cannot turn it into recognized revenue with confidence.
  claimRefs:
  - CI010
  - CI026
  - CI035
- calloutType: insight
  title: Capital access is strong, but capital adequacy is still only partially knowable
  body: Strive has raised unusually large cumulative capital for a kidney-care platform and added debt on top of equity in Series D. That supports continued scale-up, yet public readers still cannot see cash on hand, burn, runway, or debt covenants.
  claimRefs:
  - CI019
  - CI020
  - CI022
  - CI044
