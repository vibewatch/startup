- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - What public proxy exists
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited revenue
    - Needed to tie contract volume to actual top-line scale
    - Managed spend, people served, and providers served
    - Blocks precise revenue multiple or margin bridge
    - Obtain audited financial statements and revenue by channel
  - - Gross margin
    - Shows whether care delivery plus tech can scale economically
    - Service-heavy model description and headcount
    - Blocks view on software leverage versus labor drag
    - Request gross margin by payer and provider contract type
  - - EBITDA / profitability
    - Determines self-funding capacity under tighter reimbursement
    - Large financing rounds and national scale
    - Prevents judgment on whether fundraising reflects growth choice or structural losses
    - Request EBITDA bridge, adjusted definitions, and trend by quarter
  - - Cash balance / runway
    - Needed to judge capital adequacy after the debt-backed Series D
    - Cumulative funding disclosed, but no cash visibility
    - Cannot size dilution risk or urgency of next round
    - Request current cash, restricted cash, and monthly burn scenario model
  - - Debt terms and covenants
    - Debt can create hidden downside even when capital raised looks ample
    - Debt amount and lender identity are public
    - Cannot model interest burden or covenant risk
    - Review executed credit agreement and covenant model
  - - Contract take rates / PMPMs
    - Revenue cannot be derived from managed spend without take rates
    - Contract channels are visible, prices are not
    - Blocks monetization bridge and cohort economics
    - Request pricing schedules and realized PMPMs by cohort
  - - Retention / NRR
    - Shows whether the platform compounds inside existing accounts
    - No public renewal cohort data
    - Blocks quality-of-revenue assessment
    - Request gross and net retention by payer and provider cohort
  - - CAC / payback
    - Needed to judge whether growth is capital efficient
    - Public scale and investor interest imply demand, not acquisition efficiency
    - Blocks sales-efficiency analysis
    - Request pipeline conversion, sales cycle, and payback analysis
  - - Contribution margin by contract type
    - Necessary to separate good growth from structurally loss-making growth
    - Outcome claims and headcount signal model complexity
    - Blocks channel prioritization and margin strategy evaluation
    - Request contract-level unit economics net of care-team cost and support overhead
  - - Working-capital timing
    - Shared-savings models can create receivable timing and reserve complexity
    - No public cash-conversion data
    - Blocks short-term liquidity stress testing
    - Request receivables aging, reserves policy, and cash-conversion cycle by channel
  notes: 'This is the chapter''s key diligence table: it identifies the exact private metrics missing from the public record and the specific documents or analyses needed to close each gap.'
