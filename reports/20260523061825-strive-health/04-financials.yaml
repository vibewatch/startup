- id: external-economics-and-underwriting
  title: External economics and the right public-underwriting stance
  body: |-
    The external economics around kidney value-based care put real limits on how bullish a public-only financial read can be. CMS's second KCC evaluation report says the model improved several quality markers but still increased Medicare spending by $304.8 million, mostly because of incentive payments. CMS then tightened the model for performance year 2026: quarterly CKD capitation is cut by 50%, the Kidney Transplant Bonus is eliminated, and the Kidney Care First track ends at the close of 2025 while CKCC continues through 2027 under tougher terms. Avalere adds another financial warning sign, reporting that KCF practices fell from 30 to 15 and CKCC entities from 100 to 75 even as aligned beneficiaries rose to about 257,000 by PY2025. Fierce's contemporaneous coverage framed those changes explicitly as an effort to improve model sustainability.

    Downstream dialysis economics complicate the picture further. The PMC study on Medicare Advantage dialysis pricing found that MA plans paid 27% more than fee-for-service Medicare on average and that larger dialysis chains commanded higher markups. For Strive, that matters because payer savings pools can get squeezed if upstream coordination lowers utilization but downstream dialysis prices remain elevated. In other words, Strive does not control all of the economics inside the kidney cost stack it is trying to manage.

    The practical underwriting implication is that public evidence supports scenario ranges, not precise models. Investors can see substantial capital raised, meaningful operating scale, and nontrivial clinical-outcome support. They cannot see audited revenue, profitability, gross margin, cash burn, runway, debt terms, realized pricing, take rates, retention, or cohort-level contribution margins. The financial verdict is therefore favorable on strategic relevance and access to capital, but still constrained by missing private numbers and a reimbursement environment that has become less forgiving in 2026.
