    - Unknown savings-share split, PMPM, or fee floor
    - Payor page confirms channel but not pricing
    - Cannot model revenue per member publicly
  - - Medicare Advantage payer contract
    - null
    - Humana agreement proves channel, not economics
    - Unknown performance guarantees, stop-loss, or upside share
    - Humana and payor materials confirm MA reach
    - Need contract-level economics before valuing growth
  - - CKCC / nephrology risk contract support
    - null
    - Public sources describe full-risk and CKCC support, not admin-fee schedules
    - Unknown practice fee, shared-savings split, or downside sharing
    - Nephrologist, NANI, and SCP materials confirm structure
    - Gross-profit path depends on care-team efficiency and risk mechanics
  - - Shared-savings / performance upside
    - null
    - Publicly framed as outcome-linked economics, but not numerically disclosed
    - Unknown benchmark methodology, timing, and clawback mechanics
    - KCC and partner materials imply performance-based upside
    - Revenue timing may be lumpy and benchmark-sensitive
  - - Standalone software / analytics pricing
    - null
    - No evidence of separate public SKU pricing
    - Unknown whether any software-only contracts exist
    - Company sources bundle analytics into broader care model
    - Suggests limited ability to value Strive on pure SaaS multiples alone
  - - Debt capital cost
    - null
    - Debt amount is public; coupon and covenant package are not
    - Unknown rate, amortization, maturity, and security package
    - Series D press and trade coverage confirm only the headline debt size
    - Fixed-charge burden cannot be modeled publicly
  notes: Nulls mean the metric is not publicly disclosed, not that the price is zero. The absence of pricing data is itself a material diligence finding for this chapter.
