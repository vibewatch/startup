  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, and board-approved runway view.
    whyItMatters: Without cash and burn data, capital adequacy cannot be translated into an actual liquidity runway.
    diligencePath: Request the latest board deck, monthly cash report, and forecast bridge that ties current cash to base, downside, and stretch operating plans.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Facility agreement, term sheet, amortization schedule, security package, and covenant definitions for the Hercules debt.
    whyItMatters: Debt can tighten flexibility even when headline funding looks large, especially if covenants or amortization accelerate cash needs.
    diligencePath: Obtain the executed credit agreement and management covenant model, then test downside compliance and debt-service coverage under lower savings realization.
    relatedQuestionRefs:
    - QI027
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: pricing-and-unit-economics
    missingEvidence: By-channel pricing, realized take rates, retention cohorts, NRR, CAC, payback, and contribution margin by contract type.
    whyItMatters: The public record proves business relevance but not whether growth converts into durable, attractive unit economics.
    diligencePath: Request cohort-level contract analytics by payer and provider channel, including PMPMs, shared-savings splits, renewal rates, and fully loaded care-team cost per covered life.
    relatedQuestionRefs:
    - QI028
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-profitability
    missingEvidence: Audited revenue, gross margin, adjusted EBITDA, and cash-flow statements for the last two fiscal years and current year-to-date period.
    whyItMatters: Public claims about scale and outcomes cannot substitute for actual financial statements when underwriting dilution risk or valuation support.
    diligencePath: Request audited or board-approved financial statements plus a revenue bridge that ties managed spend, covered lives, and contract mix to recognized revenue and gross profit.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI003
    - TI005
