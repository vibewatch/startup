- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit of monetization
  - Current public value/status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Payer value-based contracts
    - Population-level kidney care contracts with accountability for quality and financial performance
    - Covered member / contract
    - Commercial, Medicare Advantage, and Medicaid channels are explicit
    - Potentially recurring if renewals hold, but economics vary with medical-cost performance
    - Show PMPMs, savings-share rates, renewal terms, and downside corridors by payer cohort
  - - Nephrologist risk-enablement contracts
    - CKCC, MA full-risk, and global-risk support for nephrology groups
    - Attributed beneficiary / practice contract
    - CKCC and MA full-risk are explicit; NANI and SCP materials show global-risk alignment
    - Likely sticky once embedded, but policy changes can alter economics
    - Provide practice-level admin fees, risk-share allocations, and retention data
  - - Embedded clinical operations
    - Nurse-practitioner-led care teams and multidisciplinary support delivered as an extension of partner workflows
    - Care-team deployment / covered life
    - High-touch support model is explicit, but no standalone service price is public
    - Service-heavy delivery can support differentiation but cap margins if staffing rises faster than savings
    - Provide clinician-to-member ratios, labor costs, and contribution margin by channel
  - - Technology and analytics enablement
    - CareMultiplier and workflow tooling bundled into kidney-care partnerships
    - Bundled into contract economics rather than public standalone SKU
    - Technology is central to sales story but no software-only list price is disclosed
    - Can improve gross profit over time if automation offsets labor intensity
    - Disclose software allocation, implementation fees, and attach rate for AI modules
  - - Managed medical spend under management
    - Total medical spend across attributed populations under Strive-supported arrangements
    - Claims denominator, not Strive top line
    - Public disclosures rose from about $600M to $2.5B to nearly $5B
    - Useful scale signal but poor revenue proxy without take-rate disclosure
    - Bridge managed spend to recognized revenue and gross profit by contract type
  notes: Table distinguishes actual monetization channels from non-revenue scale denominators. Managed spend under management is included because it drives investor perception, but it should not be modeled as revenue without contract-level take rates.
