    - Need post-money valuation and use-of-proceeds detail by function
  - - Series C
    - $166M led by NEA with CVS Health Ventures and other new investors
    - May 2023
    - Showed continued investor appetite and strategic-healthcare interest
    - Need terms, liquidation preferences, and board rights
  - - Series D
    - $300M equity + $250M debt = $550M total
    - Sep 2025
    - Largest financing and clearest sign of capital intensity
    - Need to separate equity cushion from debt obligations
  - - Implied latest valuation
    - ~$1.8B in trade coverage
    - Sep 2025
    - Useful external valuation anchor for fundraising momentum
    - Not disclosed in company release and not a public-market mark
  - - Minimum lifetime disclosed capital
    - '>= $939.5M incl. debt / >= $689.5M equity-only'
    - Through Sep 2025
    - Best public capital floor that can be supported from disclosed rounds
    - Still excludes undisclosed seed detail and any nonpublic facilities
  - - Cash on hand
    - null
    - Current
    - Critical to actual runway and adequacy assessment
    - Request current cash, restricted cash, and liquidity covenants
  - - Monthly burn
    - null
    - Current
    - Burn determines how quickly the equity cushion is consumed
    - Request monthly P&L and cash waterfall
  - - Runway months
    - null
    - Current
    - Runway indicates whether a new round is likely before margin inflection
    - Request forecast scenarios tied to hiring and contract growth
  - - Planned use of latest funds
    - AI, deeper partnerships, and broader care-service expansion
    - Sep 2025
    - Shows management priorities and likely spend drivers
    - Need budget allocation by R&D, clinical ops, and G&A
  - - Debt obligations
    - $250M Hercules-led tranche; pricing and covenants undisclosed
    - Sep 2025
    - Adds fixed-charge risk and reduces the quality of headline capital versus all equity
    - Request facility agreement, covenant model, and amortization schedule
  - - Next-round trigger
    - null
    - Current
    - Public sources do not reveal which milestones would force another raise
    - Request board financing plan and downside covenant triggers
  notes: The chronology of rounds lives in Company Overview; this table focuses on what the stack says about present capital adequacy and what remains unknowable publicly.
