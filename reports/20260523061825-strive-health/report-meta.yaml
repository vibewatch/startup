companyProfile:
  summary: >-
    Strive Health is a Denver-based, founder-led private value-based kidney care
    company founded in 2018 by Chris Riopelle and Will Stokes. Public materials
    describe a bundled operating model that combines CareMultiplier analytics and
    workflow tooling with Kidney Heroes care teams, nephrology enablement, and
    payer/provider partnerships for CKD and ESKD populations, and the company now
    says it serves more than 145,000 people across all 50 states. The company has
    clearly reached meaningful operating scale and capital access, but public
    disclosure still stops short of recognized revenue, gross margin, renewal, and
    debt-term detail.
  founders:
    - name: Chris Riopelle
      role: Co-Founder
      background: >-
        Former Gambro and DaVita operator with roughly a decade in kidney care and
        experience leading an approximately $1 billion division at DaVita.
      claimRefs: [CO002, CO006]
    - name: Will Stokes
      role: Co-Founder and Advisor
      claimRefs: [CO002, CO008]
  foundingLocation: Denver, Colorado
  headquarters: Denver, Colorado
  productSummary: >-
    Strive sells a high-touch value-based kidney care operating model rather than
    a clean standalone software SKU: CareMultiplier data, risk scoring, and workflow
    tools are paired with Kidney Heroes care teams, nephrology support, dialysis-
    transition planning, transplant coordination, and payer/provider workflow integration.
  customerFocus: >-
    Health plans, health systems, physician groups, and nephrology practices across
    commercial, Medicare Advantage, Medicaid, Medicare, CKCC, and related risk-bearing
    kidney-care arrangements.
  businessModel: >-
    Public evidence points to monetization through flexible value-based kidney-care
    arrangements with payers, provider organizations, and nephrology groups, combining
    care delivery, analytics, and contract-operating support instead of selling simple
    per-seat software.
  stage: Late-stage private
  fundingStatus: >-
    September 2025 Series D financing combined $300 million of equity and $250 million
    of debt for a $550 million round at about a $1.8 billion valuation; disclosed rounds
    imply at least $939.5 million of lifetime capital including debt.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO006, CO007, CO011, CO014, CO015, CO019, CO020, CO024, CE001, CE003, CE005, CE012, CE034, CU001, CU028, CI019, CI030]
summary:
  headline: >-
    Strive has real kidney-care scale, channel breadth, and product relevance, but the
    public record still cannot bridge its September 2025 ~$1.8 billion mark to disclosed
    revenue, margin, renewal, and post-reset economics, so the right public-only posture
    remains research-more.
