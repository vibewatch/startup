- id: SE003
  title: 'Trust, quality, and clinical validation: strong evidence, but some of it is aging'
  body: 'Trust and quality claims are a meaningful part of Strive''s product story because the company sits inside regulated care workflows and handles sensitive patient data. Public company materials repeatedly cite two programmatic controls: NCQA accreditation for case management and population health, and HITRUST certification for CareMultiplier. The supporting source set is reasonably detailed on what those attestations mean. The NCQA announcement explains how Strive separates higher-intensity case management from broader population-health support and ties both programs to continuity of care, patient education, and planned modality selection. The HITRUST announcement links CareMultiplier to a formal security-control framework and explicitly references privacy, compliance, and information-risk management.


    Clinical-validation evidence is also stronger than a typical private care-enablement company''s public record. Strive''s 2025 research summary and the AJMC article report slower eGFR decline for enrolled stage 3b and stage 4 CKD patients. The Duke HV-EQ case example adds more structured external packaging around downstream outcomes, including optimal dialysis starts, home-modality adoption, total-cost-of-care reduction, and hospitalization improvement. The media kit layers on company-reported engagement and satisfaction metrics. Taken together, these sources support the claim that Strive has a validated care model rather than only a marketing narrative.


    The caveat is freshness and externality. The most detailed NCQA and HITRUST explanations recovered in this run are older company-authored posts from 2021-2022, while 2025-2026 materials mostly restate the claims rather than linking to current registries or scoped attestations. That does not mean the controls are false. It means public procurement-grade evidence is thinner than the headline claims suggest, so diligence should verify current certification scope and renewals directly.'
