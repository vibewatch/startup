- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Strive solution
  - Source-backed benefit
  - Limitation / caveat
  rows:
  - - Payor kidney management
    - Claims-based case management often misses early kidney-risk identification and care fragmentation
    - Population Health plus Kidney Heroes plus CareMultiplier risk stratification
    - Public sources claim earlier intervention and lower total cost of care
    - No public PMPM, savings-share, or renewal economics
  - - Nephrologist risk participation
    - Practices need analytics, staffing, and operational help to succeed in CKCC / MA risk models
    - Strive Care Partners embeds complete-care resources, analytics, and governance support
    - Partner sources say workflows are integrated into practice and designed for value-based success
    - Public materials do not disclose exact workflow burden or quality-score mechanics
  - - Health-system kidney service line
    - Systems need kidney-specific infrastructure without increasing provider burden
    - Flexible turnkey model with predictive analytics and streamlined care delivery
    - Health-system page says the model fits workflows and extends reach
    - No public implementation ROI by health system cohort
  - - Patient transition planning
    - Late identification can lead to crash dialysis, poor modality planning, and delayed transplant coordination
    - Whole-person workflow adds medication management, dialysis access planning, transplant coordination, and social services
    - Humana and NCQA-linked sources support planned-transition language
    - Public evidence does not show longitudinal workflow completion rates
  - - Practice onboarding
    - New care-model vendors can add communication friction and duplicate data requests
    - Proactive outreach, site visits, EMR integration, standardized communication, interoperability goals
    - Integration resources describe a formal playbook for adoption
    - Deployment claims are company-authored and not independently benchmarked
  notes: Workflow rows focus on where Strive says it inserts itself into payer/provider operations. Benefits are source-backed, but most deployment-quality metrics remain private.
