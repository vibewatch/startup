  evidenceGaps:
  - type: missing-source
    severity: material
    topic: technical-opacity
    missingEvidence: Public API references, interface schemas, data-residency architecture, uptime targets, and incident-disclosure materials for CareMultiplier.
    whyItMatters: Without operational documentation, buyers and investors can validate workflow claims but not platform reliability, portability, or governance depth.
    diligencePath: Request architecture diagrams, interface inventories, security whitepapers, uptime history, and customer implementation runbooks from product and security leadership.
    relatedQuestionRefs:
    - QE024
    - QE025
  - type: stale
    severity: material
    topic: trust-opacity
    missingEvidence: Current external verification for NCQA and HITRUST scope, effective dates, and any renewals beyond the older company announcements.
    whyItMatters: Trust claims matter in payer/provider procurement, and aged certification announcements are weaker than current registry or attestation evidence.
    diligencePath: Obtain current certification letters, scope statements, and registry screenshots from compliance leadership or directly from the relevant registries.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: implementation-sla
    missingEvidence: Contract-level implementation timelines, integration SLAs, staffing ratios by market, and realized deployment metrics beyond company-authored examples.
    whyItMatters: The product story depends on rapid workflow fit, but public materials do not show whether delivery speed and staffing scale hold across heterogeneous partners.
    diligencePath: Request anonymized implementation scorecards, integration timelines, customer references, and renewal/expansion data by channel.
