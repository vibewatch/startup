summary:
  headline: Strive 已有真实肾脏护理规模、渠道广度和产品相关性，但公开记录仍无法把 2025 年 9 月约 $1.8 billion 估值锚连到已披露收入、利润率、续约和重置后经济性；只看公开信息，姿态仍应是继续研究。
