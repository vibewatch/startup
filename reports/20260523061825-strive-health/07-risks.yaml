  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: reimbursement-exposure-disclosure
    missingEvidence: Contract-level mix showing what share of Strive revenue, covered lives, and gross profit is exposed to
      CKCC, Medicare Advantage, commercial, and other channels after the 2026 KCC reset.
    whyItMatters: The public source set proves policy churn but not how much of Strive’s economics actually move with the
      changed benchmark discounts, capitation, and bonus structure.
    diligencePath: Request current book-of-business mix by reimbursement model plus scenario analysis that isolates revenue
      and margin exposure to the 2026 KCC changes.
    relatedQuestionRefs:
    - QR005
    - QR015
    - QR025
    - QR029
    relatedTableRefs:
    - TR001
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: partner-concentration-and-renewal
    missingEvidence: Top-customer concentration, contract duration, renewal cadence, and net retention data by payer and provider
      channel.
    whyItMatters: Named logos do not tell an investor whether Strive is diversified by revenue or whether one payer or nephrology
      relationship dominates underwriting risk.
    diligencePath: Request top-10 customer revenue share, renewal schedule, termination rights, and any minimum-volume or
      downside-risk provisions by major channel.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR028
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: debt-terms-and-covenants
    missingEvidence: The Hercules facility agreement or lender deck with interest rate, maturity, covenants, collateral, amortization,
      and draw conditions.
    whyItMatters: A large venture-debt tranche can accelerate growth, but it can also constrain hiring pace, M&A, and tolerance
      for policy-driven margin compression.
    diligencePath: Request the debt summary schedule, covenant package, current debt balance, liquidity runway, and downside-case
      covenant compliance analysis.
    relatedQuestionRefs:
    - QR015
    - QR028
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: security-control-depth
    missingEvidence: Independent SOC reports, recent penetration-test summaries, BAA templates, incident-response metrics,
      and any regulator or customer security questionnaires.
    whyItMatters: Public trust signals such as HITRUST, NCQA, and privacy-policy language reduce concern, but they do not
      show how deeply the organization manages live operational risk across data exchange and care delivery workflows.
    diligencePath: Request the latest security package, risk register, BAA terms, breach tabletop outputs, and any customer
      security-review findings or remediation plans.
    relatedQuestionRefs:
    - QR010
    - QR012
    - QR014
    - QR026
    relatedTableRefs:
