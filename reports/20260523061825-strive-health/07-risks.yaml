- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, monitoring, and kill criteria
  body: |-
    The right way to underwrite Strive from public evidence is to treat mitigation as necessary but not yet sufficient. There are real mitigants in the source pack: CKCC survives through 2027 instead of ending immediately; Strive has credible scale, public payer and provider proof, outcome evidence, HITRUST and NCQA badges, and enough capital to keep investing. But each mitigation is paired with an unresolved diligence burden. Survival of CKCC is not the same as attractive unit economics. Public outcomes are not the same as independent, contract-level renewal proof. Certifications are not the same as a current operational control package. A large debt-backed raise is not the same as covenant-free flexibility.

    That framing leads to clear kill criteria. If management cannot quantify channel exposure to the 2026 reimbursement reset, the thesis should weaken quickly because policy risk is no longer abstract. If independent cohorts fail to replicate hospitalization, progression, or cost claims under current economics, the renewal story breaks. If a material privacy or security incident forces notices or triggers regulator scrutiny, procurement and trust can deteriorate far faster than headline growth suggests. And if leadership or workforce scaling slips while debt remains opaque, investors should assume execution risk is rising, not falling. The chapter therefore ends with a qualified view: Strive still looks strategically relevant, but the residual risk stack is high enough that the investment case depends on management proving concentration, post-reset resilience, and control depth in diligence rather than in marketing materials.
