- id: partner-capital-and-people-risk
  title: Partner, capital, and people risk
  body: |-
    Public evidence says Strive is now large enough that partner dependence matters more than pure product novelty. The company’s disclosed reference set clusters around a handful of visible payer and provider channels: Humana, NANI, Oak Street, Aetna, Blues plans, and a broader provider base that Strive says exceeds 6,500 organizations or clinicians. That is enough to prove real market penetration, but not enough to prove concentration is benign. Public materials do not show the revenue weight of any one payer, nephrology group, or health-system relationship. At the same time, Stout and the Medicare Advantage dialysis-pricing study show that incumbents such as DaVita and Fresenius still sit inside a concentrated kidney ecosystem where downstream economics can remain stubborn even when upstream coordination improves.

    Capital and people risk compound that dependence. Strive’s 2025 round mixed $300 million of equity with $250 million of Hercules-led debt, and management says the money is meant to deepen partnerships, expand specialties, and accelerate AI investment. That is bullish only if the organization can convert spending into repeatable outcomes and renewals faster than policy and channel pressure compress margins. The company also appears to be scaling a relatively compact executive bench over a 700-plus-person workforce. Public sources show material hiring across clinical, technical, data, operations, and strategy roles, plus leadership additions at the president and COO levels. That is exactly the kind of profile that can create great operating leverage or painful inconsistency depending on onboarding discipline, retention, and how much the company still depends on a few senior leaders to keep the machine aligned.
