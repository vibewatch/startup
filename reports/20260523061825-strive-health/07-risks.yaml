    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: independent-cohort-validation
    missingEvidence: Customer-level or channel-level outcome replication showing that the public cost and progression claims
      continue to hold across newer geographies and contract types after the reimbursement reset.
    whyItMatters: The bullish case depends on Strive proving that care-team and analytics intensity still produce savings
      and quality gains when policy economics tighten and the company scales into new specialties and markets.
    diligencePath: Request independent cohort analyses by payer and provider channel, broken out by hospitalization, total
      cost of care, dialysis starts, transplant metrics, and renewal outcomes.
