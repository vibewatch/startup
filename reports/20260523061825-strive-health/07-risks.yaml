chapter:
  number: 7
  title: Risks
  summary: Strive’s risk profile is dominated by reimbursement reset, labor-heavy execution, partner concentration, and under-disclosed
    control depth rather than by a lack of market relevance. Public evidence supports a credible scaled operator with real
    mitigants, but the thesis still breaks quickly if post-2026 kidney-care economics, independent outcome replication, security
    controls, or concentration data fail in diligence.
sections:
- id: reimbursement-and-regulatory-risk
  title: Reimbursement reset and regulatory risk
  body: |-
    The biggest risk to the Strive thesis is not whether kidney value-based care exists as a concept. It is whether the economics of participating in that market still work after the 2026 Kidney Care Choices reset. CMS, legal alerts, and Avalere all point in the same direction: Kidney Care First ends early, CKCC survives but under harsher benchmark discounts, the transplant bonus disappears, and CKD capitation is cut in half. The second CMS evaluation makes the policy motive explicit by showing that quality improved in several areas while Medicare spending still rose by $304.8 million, mostly because of incentive payments. That combination creates real policy-churn risk for every operator whose story depends on kidney-risk contracts staying generous enough to fund intensive care management.

    Strive is especially exposed because its public positioning repeatedly ties the business to risk-bearing arrangements with Medicare, Medicare Advantage plans, and nephrology groups operating in CKCC-like environments. The company can plausibly absorb policy tightening if it is diversified into commercial and MA economics that still reward outcomes, but public sources do not quantify that mix. What investors can say from public evidence is narrower: Strive operates in the part of kidney care where CMS is explicitly trying to squeeze sustainability, and its most visible public payer and provider relationships are exactly the kinds of channels that feel policy resets quickly. The mitigation is not that policy is stable; it is that CMS chose to keep CKCC running through 2027 instead of shutting the model entirely, which leaves room for scaled operators to prove they can still win under tighter terms.
