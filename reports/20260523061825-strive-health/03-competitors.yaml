- id: incumbents-and-channel-power
  title: 'Incumbents and channel power: DaVita and Fresenius still own the hardest assets'
  body: |-
    The most serious strategic pressure on Strive does not come only from the direct platforms. It comes from incumbents that can combine value-based contracting with physical access, referral pathways, and durable provider relationships. DaVita’s public materials are unusually explicit here: it claims more than $5 billion in costs under management, more than 220,000 CKD and ESKD patients managed, 2,300-plus physician partnerships, 32,000-plus home-dialysis patients, and 120,000-plus transplants over twenty years. Even if those metrics are company-framed, they point to a competitive reality that software-first peers cannot easily replicate.

    Fresenius, even after contributing Fresenius Health Partners to Interwell, still matters because its ecosystem continues to emphasize home dialysis, transplant access, interoperability, and health-plan collaboration. Becker’s reporting on the Cigna relationship illustrates the underlying power: access to a national dialysis-center footprint and home options can be bundled into payer contracts in ways that make procurement and patient-routing easier for buyers.

    That same scale creates a second-order risk. Home Health Care News treated the DaVita-Elara move as evidence that kidney incumbents are pushing further into the home and also flagged renewed antitrust concerns. For Strive, the implication is straightforward: incumbent response is not hypothetical. Large operators can extend from dialysis into adjacent home-health and value-based partnerships while using existing patient touchpoints and provider economics to defend share.
