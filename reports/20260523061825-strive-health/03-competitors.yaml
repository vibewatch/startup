- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or risk
  - Threat class
  - Evidence
  - Severity
  - What it means for Strive
  - Diligence ask
  rows:
  - - Kidney-specific AI and fast deployment
    - Platform peer response
    - Strive claims 150B+ data points plus sub-two-week integration and 90-day launch; peers also market analytics
    - medium
    - Helpful wedge, but not obviously unique once Interwell, Somatus, and Evergreen AI claims are included
    - Request implementation case studies with realized savings and onboarding timelines
  - - Incumbent physical footprint
    - Incumbent response
    - DaVita and Fresenius pair VBC claims with dialysis-center access, home options, transplant infrastructure, and large physician networks
    - high
    - Hardest asset gap versus Strive; can influence referrals and payer procurement
    - Test whether payers or provider groups view non-dialysis alignment as offsetting advantage
  - - Nephrologist governance and practice ownership
    - Platform peer moat
    - Interwell and some Somatus structures look more physician-owned or JV-oriented than Strive or Monogram
    - high
    - Could make nephrology-channel retention stickier than pure payer-led offerings
    - Review ownership, governance, and renewal terms inside representative nephrology partnerships
  - - Multi-homing and extension models
    - Switching-cost risk
    - Several peers present as extensions of nephrologists or home teams rather than exclusive replacements
    - medium
    - Switching costs may be lower than headline marketing implies
    - Ask customers whether they run multiple kidney programs concurrently and under what conditions
  - - Opaque economics
    - Underwriting risk
    - Public pricing and realized margins are mostly undisclosed across the entire set
    - high
    - Capability comparisons alone cannot prove moat if economics are weak or buyer ROI is fragile
    - Obtain anonymized contracts, cohort savings data, and gross-margin bridges
  - - Policy dependence beyond 2026
    - External risk
    - Current kidney VBC models continue through 2026, while more transplant-inclusive successors remain proposed
    - medium
    - Home and transplant-led positioning may reprice if successor models change
    - Track CMMI successor notices and major commercial renewals before close
  notes: Register mixes company-specific and market-structure risks because moat durability in kidney value-based care depends as much on channel control and policy as on product breadth.
