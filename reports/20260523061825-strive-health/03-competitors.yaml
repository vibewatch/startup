  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Per-member fees, shared-savings corridors, stop-loss terms, and realized savings splits for Strive and the main peer set.
    whyItMatters: Without actual economics, the public market map can rank capability breadth but cannot underwrite margin durability or buyer ROI with confidence.
    diligencePath: Request anonymized payer contracts or cohort-level economics from diligence management and normalize them to PMPM, savings-share, and medical-loss impacts.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: private-peer-financials
    missingEvidence: Current revenue, profitability, and valuation detail for Monogram, Somatus, Interwell, and Evergreen.
    whyItMatters: Disclosed patient counts and funding rounds are helpful but do not reveal whether any peer has stronger unit economics or a more durable capital position than Strive.
    diligencePath: Request recent investor decks, board materials, or lender packets for the private peer set and reconcile them to public fundraising and scale statements.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: post-2026-reimbursement
    missingEvidence: Finalized post-2026 federal framework for CKCC successors and any transplant-inclusive payment implementation timeline.
    whyItMatters: Platform strategies that lean on home dialysis, optimal starts, or transplant incentives could reprice quickly if CMS or commercial follow-on models change.
    diligencePath: Track final CMS rulemaking, CMMI successor-model notices, and commercial payer updates tied to kidney risk contracts before investment committee sign-off.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: channel-conflict
    missingEvidence: Exclusive terms, renewal structures, and non-compete or referral restrictions in payer, nephrology, and home-health partnerships across the peer set.
    whyItMatters: The moat debate hinges on whether payers and practices can multi-home or switch platforms without major contractual friction.
    diligencePath: Collect representative partner agreements from Strive, nephrology groups, and payer customers and review exclusivity, ownership, termination, and referral provisions.
    relatedQuestionRefs:
    - QP022
    - QP023
    relatedTableRefs:
    - TP004
