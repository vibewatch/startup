  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局形态：直接同行、既有巨头、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              肾病基于价值照护格局已经不再是 Strive 对单一供应商的简单比较。独立市场分析称，这个领域仍由 DaVita 和 Fresenius 主导的集中透析基础盘锚定，同时新支付模型和 Medicare
              Advantage 增长正把肾脏科诊所、支付方、透析连锁和 MSO 式伙伴拉进更多承担风险的关系。实际竞争中，Strive 至少会遇到四类对手：Monogram、Somatus、Interwell 和
              Evergreen 等直接专科平台；DaVita Integrated Kidney Care 和 Fresenius 生态等既有巨头；Oak Street
              或居家健康伙伴等相邻照护交付渠道；以及支付方案例管理或肾脏科诊所内部自建的现状方案。


              Strive 在这组对手中并不突兀，但也不是孤身一类。Stout 的市场地图把 Strive
              放在多个正在汇合的新进入者之中，而不是一个独立品类；几个竞争对手公开描述的买方承诺几乎相同：更早干预、多学科照护、更少住院、更多家庭透析采用、更多移植准备，以及更低总照护成本。因此，真正的差异化会离开通用营销话术，转向更硬的问题：哪家平台拥有支付方关系，哪家控制肾脏科医生工作流，哪家有实体照护交付资产，哪家能把分析足够快地落地到真正产生影响。这些就是本章其余部分采用的视角。
