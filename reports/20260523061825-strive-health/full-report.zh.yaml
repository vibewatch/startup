      - 机制
      - 变现单位
      - 当前公开数值 / 状态
      - 收入质量判断
      - 尽调问题
    rows:
      - - 支付方价值医疗合同
        - 面向人群的肾病照护合同，对质量和财务表现负责
        - 覆盖会员 / 合同
        - 明确覆盖商业保险、Medicare Advantage 和 Medicaid 渠道
        - 若续约稳住，可能具备经常性；但经济性随医疗成本表现波动
        - 按支付方队列展示 PMPM、节省分成比例、续约条款和下行区间
      - - 肾脏科医生风险赋能合同
        - 为肾脏专科集团提供 CKCC、MA 全风险和整体风险支持
        - 归因受益人 / 诊所合同
        - 明确有 CKCC 和 MA 全风险；NANI 和 SCP 材料显示整体风险对齐
        - 一旦嵌入，可能有粘性；但政策变化会改变经济性
        - 提供诊所层面的管理费、风险分成分配和留存数据
      - - 嵌入式临床运营
        - 由执业护士牵头的照护团队和多学科支持，作为合作方工作流的延伸交付
        - 照护团队部署 / 覆盖人群
        - 高接触支持模式明确，但没有公开的独立服务价格
        - 服务密集型交付能支撑差异化，但如果人员增长快于节省，毛利率会被压住
        - 按渠道提供临床人员 / 会员比例、人工成本和贡献毛利
      - - 技术和分析赋能
        - CareMultiplier 和工作流工具打包进肾病照护合作
        - 纳入合同经济性，而不是公开独立 SKU
        - 技术是销售叙事核心，但未披露纯软件标价
        - 如果自动化抵消人力密度，长期可改善毛利
        - 披露软件收入分配、实施费和 AI 模块挂载率
      - - 管理下医疗支出
        - Strive 支持安排下归因人群的总医疗支出
        - 理赔分母，不是 Strive 收入
        - 公开披露从约 $600M 增至 $2.5B，再到近 $5B
        - 是有用规模信号；但没有 take rate 披露，不能很好代理收入
        - 按合同类型把管理支出桥接到确认收入和毛利
    notes: 表格区分实际变现渠道和非收入规模分母。纳入管理下医疗支出，是因为它影响投资者感知；但若没有合同 层面的 take rate，不应把它建模为收入。
