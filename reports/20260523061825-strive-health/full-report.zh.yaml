      - number: '1.3'
        title: 融资历史、资本基础与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              Strive 的融资轨迹显示，公司已从成长资本阶段进入真正的规模资本阶段。公开记录从 2021 年以后最扎实：2021 年 3 月 CapitalG 领投 $140 million Series B，2023 年
              5 月 NEA 领投 $166 million Series C，2025 年 9 月 Series D 则由 $300 million 股权加 $250 million 债务组成。Fierce
              Healthcare、MedCity News、MobiHealthNews、Yahoo Finance 和 HLTH 的独立报道，与公司自己的公告一致：Series D 对 Strive 的估值约为 $1.8
              billion。投资人组合也说明问题。NEA 继续担任主要股权赞助方，CVS Health Ventures、CapitalG、Echo Health Ventures、Town Hall
              Ventures、Redpoint、BlackRock 关联方和 Hercules Capital 都参与了 2025
              年资本结构。这是一组风险投资、战略医疗、科技、资产管理和专科信贷资本的混合体——有用的信号是，市场既把 Strive 当作照护交付平台，也把它当作数据含量越来越高的医疗基础设施资产来承做。


              已披露融资路径显示，累计资本相当可观。Strive 曾称 Series B 后总融资为 $223.5 million，后来又披露 Series C 和 D 金额；因此公开材料支持一个下限：含债务在内的累计资本约
              $939.5 million，其中股权至少 $689.5 million。这一点重要有两个原因。第一，Strive
              的资本缓冲远大于许多窄口径数字健康公司。第二，这确认了公司为了搭建全国医疗服务方集成、照护团队、分析基础设施和多条线合同能力，确实需要大量融资。


              利益相关方深度不止投资人。Humana 在 2024 年扩大了多州 Medicare Advantage 合作，SSM 早在 2020 年成立合资公司，CKCC 相关肾脏科关系让 Strive 在 2022
              年项目启动时成为最大的非透析参与方。累计图景是：公司已经能够把融资动能转化为资本提供方和战略运营伙伴的机构信任。开放问题是，这种信任能否转化为持久的单位经济，因为公开数据集更突出医疗支出和临床结果，而不是已确认收入或盈利能力。
