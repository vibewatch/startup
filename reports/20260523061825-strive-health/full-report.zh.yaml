      - number: '2.2'
        title: 通过患病率和支出视角看 TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              最宽的规模测算视角是患者患病率。CDC 2026 年 3 月报告估计，美国有 37 million 成年人，即 14% 的成年人患有 CKD；NIDDK 则把这一人群概括为 35.5
              million。两个数字足够接近，可以为真实人群需求划出区间；两个来源也都显示 CKD
              严重诊断不足。这支撑了上游识别、教育和照护协调的巨大机会，但它不会自动转化为供应商收入，因为许多患者永远不会进入承担风险的肾病合同。更有经济意义的子层要小得多：NIDDK 报告已治疗 ESKD 人群略高于
              808,000，CMS 自己的基于价值模型数据显示，到 PY2025 对齐 KCC 受益人约 257,000，而 Strive 披露的当前服务基础为超过 145,000 人。


              支出视角同样重要，也更矛盾。官方公开基线显示，2021 年 Medicare 为 66 岁以上 CKD（不含 ESKD）受益人支出近 $77 billion，另有 $52.3 billion Medicare
              相关 ESKD 支出。CMS 还单独预计，CY2026 ESRD PPS 下将向 7,600 家 ESRD 机构支付约 $6 billion；官方 CKCC 信息图仍称 ESKD 虽只代表 1% 的受益人，却占
              Medicare 支出超过 7%。Strive 2026 年媒体资料包随后引用约 $156.7 billion，即每四个 Medicare 美元中就有一美元花在肾病人群上，并把它与更大的 $456 billion
              未管理支出估计放在一起。正确解读不是某个来源显然错了，而是每个来源画的市场边界不同。


              对 SOM 而言，公开证据只能支持受限视角。Strive 服务超过 145,000 名患者、管理约 $5 billion 支出，说明已有真实运营规模；但相对全国 CKD 人群，其服务份额仍远低于
              1%。这个缺口解释了为什么当前市场看起来既巨大又早期：疾病负担极大，但实际签约并被协调的人群，相对总患病率仍然很窄。实际结论是，任何 Strive TAM
              叙事都应同时呈现多个视角，并保留边界差异，而不是把它们压成一个过大的标题数字。
