  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Strive 方案
      - 有来源支撑的收益
      - 限制 / 注意事项
    rows:
      - - 支付方肾病管理
        - 基于理赔的个案管理常漏掉早期肾病风险识别，也处理不好照护碎片化
        - Population Health 加 Kidney Heroes，再叠加 CareMultiplier 风险分层
        - 公开资料称可更早干预，并降低总照护成本
        - 没有公开 PMPM、节约分成或续约经济性
      - - 肾脏科医生参与风险模式
        - 诊所要在 CKCC / MA 风险模型中跑通，需要分析、人员和运营支持
        - Strive Care Partners 嵌入完整照护资源、分析和治理支持
        - 合作方资料称，工作流已嵌入诊所，并按价值医疗成功要求设计
        - 公开材料没有披露具体工作流负担或质量评分机制
      - - 医疗体系肾病服务线
        - 医疗体系需要肾病专用基础设施，同时不增加提供方负担
        - 灵活的交钥匙模式，配预测分析和精简照护交付
        - 医疗体系页面称，该模式贴合工作流并扩大触达
        - 没有按医疗体系队列拆分的公开实施 ROI
      - - 患者过渡规划
        - 识别太晚会导致紧急透析、治疗方式规划不足，以及移植协调延误
        - 全人照护工作流加入用药管理、透析通路规划、移植协调和社会服务
        - Humana 和 NCQA 相关来源支撑计划性过渡表述
        - 公开证据没有显示纵向工作流完成率
      - - 诊所入驻
        - 新的照护模式供应商可能增加沟通摩擦和重复数据请求
        - 主动触达、现场访问、EMR 集成、标准化沟通、互操作目标
        - 集成资源描述了一套正式采用手册
        - 部署主张来自公司自身，未经过独立基准对比
    notes: 工作流各行聚焦 Strive 声称自己插入支付方 / 提供方运营的位置。收益有来源支撑，但多数部署质量指标仍未公开。
