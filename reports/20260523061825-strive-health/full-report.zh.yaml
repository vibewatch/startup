      - number: '2.4'
        title: 增长驱动、采用约束与证据缺口
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动来自上游需求和政策支持的照护重构。公共卫生来源仍显示，未诊断 CKD 人群庞大；CMS 自己的 KCC
              评估则显示，当服务方获得更早干预的激励时，临床指标会改善：家庭透析使用率更高、活体供肾移植更多、预防性等待名单登记更多、最佳 ESRD 启动更好。NKF 对 2026
              年规则的评论也指向同一方向，主张扩大家庭透析可及性、肾病教育和医学营养治疗。Strive 2026 年 3 月资源中心文章在这些证据上叠加了市场层叙事，强调早期心代谢干预、SGLT2
              采用和跨专科协作。合在一起，这些来源支持一个判断：上游肾病管理在临床上更可信，也对支付方和肾脏科医生更具战略意义。


              主要约束在于，政策支持不等于经济性容易跑通。KCC 自己的评估称，该模型没有显著降低 Part A/B 总付款，反而让 Medicare 支出增加 $304.8 million，主要原因是激励付款。CMS
              和外部法律 / 政策摘要随后收紧模型：KCF 参与安排终止，graduated/professional/global CKCC 轨道延续至 2027 年但面对额外基准折扣，移植奖金在 2026 年取消，CKD
              季度按人头付费被砍半。Avalere 的参与方数据显示，KCF 诊所数量和 CKCC
              实体数量大幅下降，即便对齐受益人小幅上升；利益相关方指向下行风险和文件负担。换句话说，采用驱动是真实的，但公开证据还没有证明这是一个无摩擦、显然高毛利的市场。


              第二个结构性约束在 CMS 之外：透析服务方集中度和 MA 经济性。PMC 定价研究认为，21st Century Cures Act 后，透析启动后的 MA
              加入变得更重要，未来还可能继续上升；但研究也发现，大型透析组织谈出了显著高于按服务收费 Medicare 的 MA 价格。这让 Medicare Advantage
              对肾病照护供应商和计划都成了一把双刃剑：更多受益人可以进入管理式模型，但如果下游透析价格居高不下，医疗损失经济性会更难。小型或农村诊所的人员短缺又增加了执行约束。因此，未解决的尽调问题，不在于肾病照护是否重要，而在于像
              Strive 这样的供应商究竟能抓住多少支出、利润率多少，以及在 2026-2027 年更紧报销条款下通过哪种买方组合实现。
