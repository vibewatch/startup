      - number: '2.3'
        title: 买方与渠道分层
        blocks:
          - type: paragraph
            body: >-
              买方图谱是多边的，因为基于价值肾病照护卖的是合同，而不只是软件席位。CMS 及其参与的 Kidney Contracting Entities 是一类买方：KCE
              结构要求有肾脏科医生或肾脏科诊所加上移植服务方，可选择性纳入透析机构，并越来越依赖整合肾病照护组织来承担运营、教育和分析。这让肾脏科团体既是用户，也是渠道所有者。Strive
              的肾脏科医生页面直接顺着这个结构展开，称肾脏科医生在新的基于价值模型中坐在驾驶位，包括 CKCC 和 Medicare Advantage 全风险安排。


              健康计划构成第二大买方类别。Strive 的支付方页面明确表示，产品面向商业、Medicare Advantage 和 Medicaid 计划；2024 年 Humana
              扩张公告展示了实际形态：面向大多数患有肾病的 Humana Medicare Advantage HMO 和 PPO 会员，签订多州协议，覆盖跨学科照护、透析通路规划、移植协调、用药管理和社会服务。CKD
              Spotlight 仪表盘在这里提供了一个有用的市场信号，因为它来自全国多支付方理赔数据，并按支付方和地区拆分 CKD
              诊断与管理，强化了一个判断：支付方拥有足够的数据和支出集中度，可以把肾病照护作为一个独立管理类别，而不是普通个案管理问题。


              医疗系统和医疗服务组织是第三类买方 / 渠道，整合肾病照护组织则跨在整个栈上，充当运营赋能方。Strive 的媒体资料包称，公司为服务方、医疗系统、支付方和患者提供全服务解决方案；Echo 的 CKCC
              启动公告更早展现了同样的渠道逻辑：Strive 与 27 个团体的 260
              名肾脏科服务方合作，同时也争取商业支付方、医疗系统和医疗集团。重要的市场含义是，采用路径不会只走一条采购通道。有些合同由支付方牵头，有些由肾脏科牵头，还有些依赖专科医生与计划之间的联合销售或运营合作。
