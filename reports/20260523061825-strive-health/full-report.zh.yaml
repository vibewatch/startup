        - 仍缺少收入、利润率和债务条款披露
      - - Oak Street Health / CVS
        - 出售前 2022 年收入 $2.16B，按人头付费收入 $2.13B
        - 以每股 $39、约 $10.6B EV 被收购
        - 最强的价值医疗控制权价值先例
        - 已披露按人头付费初级护理经济账，比 Strive 更透明
      - - Alignment Healthcare
        - 2026 年 5 月市值约 $3.38B，销售倍数信号约 0.81x
        - 公开市场价值医疗参照
        - 显示已披露经济账的价值医疗运营商在公开市场能拿到什么水平
        - 支付方组合不同，披露远多于 Strive
      - - DaVita
        - 2025 年收入 $13.643B，2026 年 5 月市值约 $12.74B
        - 公开存量肾脏护理背景可比
        - 有助于理解有利润的肾脏护理规模在公开市场是什么样
        - 硬资产和透析网点让它更像战略背景可比，而不是同类创业公司可比
      - - Fresenius Medical Care
        - 2025 年收入 €19.63B，2026 年 5 月市值约 $11.62B
        - 公开全球肾脏护理存量背景可比
        - 进一步说明，大型肾脏平台不会自动获得高公开市场倍数
        - 全球透析与制造业务组合，结构上不同于 Strive
      - - Somatus
        - 2022 年官方 Series E 披露 $325M 以上融资，在 34 个州覆盖 150k 以上成员
        - 2022 年披露估值超过 $2.5B
        - 最接近、且高于 Strive 标价的已披露私有肾脏平台估值参照
        - 标价较早，业务组合和利率环境也不同
      - - Monogram Health
        - 2023 年官方融资新闻披露 $375M，并覆盖 34 个州、近 4,000 个城市
        - 大型私募融资信号，但没有经本章核查的公开估值披露
        - 可用于观察投资者胃口和地理覆盖
        - 融资规模不等于明确的可比估值标价
      - - Interwell Health
        - 官方合并材料目标到 2025 年覆盖超过 270k 人群、管理成本 $11B
        - 战略规模参照；本章没有干净、已核查的独立估值锚
        - 显示肾病网络平台整合后能做多大
        - 由合并支撑、带存量基础设施的平台，结构上不同于 Strive
    notes: 本表比较直接和相邻参照，用来框住 Strive 2025 年 9 月标价。它刻意混合：有些行是估值锚，有些行是规模或公开市场纪律参照。
