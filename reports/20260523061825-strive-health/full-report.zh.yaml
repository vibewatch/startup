      - number: '6.3'
        title: 部署路径与扩张动作
        blocks:
          - type: paragraph
            body: >-
              公开记录显示出一种可重复的部署模式。第一，Strive 与支付方、医疗系统或肾脏科团体签下价值医疗安排。第二，它围绕本地临床医生集成数据和工作流，通常依靠 Kidney Heroes
              团队、分析和护理管理支持。第三，它利用这个嵌入式模型扩展到更多州、业务线或相邻渠道。Humana 是最清晰的例子，因为 2024 年协议明确建立在 2020 年起步关系之上。Zing 是最新鲜的信号，因为
              2025 年公告被表述为在六个州扩张既有关系。Medical Mutual 则拓宽了打法：它在一个州内同时覆盖 Medicare Advantage、个人和商业团体业务线，而不是只覆盖一个 MA 人群。


              服务方部署遵循同样逻辑。NANI 和更广泛的 CKCC 足迹显示，Strive 能嵌入肾脏科工作流和风险治理；Oak Street 显示基层护理转诊和支持渠道；Bon Secours 加 SSM
              则证明系统级采用。这个组合意味着，Strive
              的扩张路径不太像纯软件席位增长，更像合约加工作流渗透。因此，本章可以支撑一个可信的落地后扩张动作。单靠公开证据还无法承保的是，这些扩张是否会随时间实质改善留存、钱包份额或单位经济。
