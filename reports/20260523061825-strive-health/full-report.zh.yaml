  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张或风险
      - 威胁类型
      - 证据
      - 严重程度
      - 对 Strive 意味着什么
      - 尽调问题
    rows:
      - - 肾病专用 AI 和快速部署
        - 平台同业反应
        - Strive 声称拥有 150B+ 数据点、两周内集成和 90 天启动；同业也在营销分析能力
        - 中
        - 是有帮助的切入口，但纳入 Interwell、Somatus 和 Evergreen 的 AI 主张后，独特性并不明显
        - 要求提供落地案例研究，包括已实现节省和上线时间线
      - - 在位者实体网点
        - 在位者反应
        - DaVita 和 Fresenius 把 VBC 主张与透析中心入口、居家选项、移植基础设施和大型医生网络捆在一起
        - 高
        - 相比 Strive，这是最难补的资产缺口；能影响转诊和支付方采购
        - 验证支付方或医疗服务方集团是否把非透析导向视为可抵消的优势
      - - 肾脏科医生治理和诊所所有权
        - 平台同业护城河
        - Interwell 和部分 Somatus 结构看起来比 Strive 或 Monogram 更偏医生持有或 JV 导向
        - 高
        - 可能让肾脏专科渠道留存比纯支付方主导产品更有粘性
        - 审查代表性肾脏专科合作中的所有权、治理和续约条款
      - - 多栖部署和延伸模式
        - 切换成本风险
        - 多个同业把自己定位为肾脏科医生或居家团队的延伸，而不是排他替代
        - 中
        - 切换成本可能低于营销口径暗示
        - 询问客户是否并行运行多个肾病项目，以及在什么条件下这样做
      - - 经济性不透明
        - 投资测算风险
        - 整组公司几乎都未披露公开价格和已实现利润率
        - 高
        - 如果经济性弱或买方 ROI 脆弱，仅靠能力对比无法证明护城河
        - 获取匿名合同、队列节省数据和毛利率桥接
      - - 2026 年后的政策依赖
        - 外部风险
        - 现行肾病 VBC 模型延续到 2026 年，更纳入移植的后续模型仍停留在提案阶段
        - 中
        - 如果后续模型改变，以居家和移植为主的定位可能被重新定价
        - 交易完成前，跟踪 CMMI 后续通知和重大商业续约
    notes: 风险登记表同时纳入公司特定风险和市场结构风险，因为肾病价值医疗的护城河耐久性不只取决于产品宽度， 也取决于渠道控制和政策。
