      - number: '3.4'
        title: Strive 真正的差异化是什么，能持续多久？
        blocks:
          - type: paragraph
            body: >-
              只看公开证据，Strive 最好的切入口并不是单纯规模。Somatus 披露的当前在管人群更大，Monogram 有重量级支付方投资人和全国上门触达，Interwell
              拥有最清晰的肾脏科医生治理故事，DaVita 或 Fresenius 则有最深的实体和渠道资产。Strive
              看起来最强的地方，是买方广度和实施速度同时重要的场景。公开材料显示，公司拥有有意义的支付方覆盖、肾脏科医生支持，以及一个声称能极快完成伙伴上线的肾病专用 AI
              平台。这种组合可能吸引希望获得肾病专科运营层、但不想承接既有透析结盟的计划或医疗服务方团体。


              持久性问题还没有定论。同行之间的公开定价大多不透明，所以外部投资人看不到谁的真实经济性最好。多个竞争对手也把自己定位成肾脏科医生或居家团队的延伸，这说明切换成本可能低于营销标题暗示，多归属也可能继续常见。最后，当前报销脚手架运行到
              2026 年，而更纳入移植的下一代模型仍是提案，并未锁定。净结果是，Strive 显然属于市场第一梯队，但护城河主张应以伙伴留存、合同经济性和下一轮政策周期为条件，而不是被表述为既成事实。
