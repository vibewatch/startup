      - number: '8.4'
        title: 只有私下尽调补上几个决定性缺口，投资逻辑才站得住
        blocks:
          - type: paragraph
            body: >-
              决定性的下一步不是再找一个叙事来源，而是披露包。投资人需要管理层按合同类型展示，医疗支出如何转化为确认收入、毛利和现金生成。投资人还需要看到这套经济栈对 KCC 重置、下游透析定价，以及
              Medicare、Medicare Advantage、商业险和 Medicaid
              渠道相对权重的敏感性。没有这座桥，即便战略上很强的公司，也可能在昂贵入场价下变成糟糕投资。最新一轮的债务部分进一步抬高门槛，因为债务条款和任何清算优先权堆叠，决定标题估值能否干净映射到新股上行。

              决定性终止标准同样具体。如果管理层无法证明持久续约率，如果当前毛利率逻辑依赖已经在 2026
              年变差的政策假设，或者如果公司无法把差异化经济与单纯医疗支出规模分开，投资逻辑会迅速破裂。资本结构会带来次级破裂：如果债务契约、清算优先权或其他优先索取权吸走太多上行，公司可以仍然有运营吸引力，却不是一个有吸引力的入场点。这就是为什么最终尽调问题是财务和合同问题，而不是哲学问题。Strive
              大概率已经足以赢得更深入研究；但它公开披露仍不足以把 Sep 2025 价格变成干净的“是”。
