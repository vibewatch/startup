  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 重要性
      - 行动含义
    rows:
      - - 收入桥始终无法闭合
        - 管理层无法按渠道把管理医疗支出与确认收入、毛利对齐
        - 核心估值分母仍未知
        - 退出，或要求入场价格大幅降低
      - - 政策敞口过于集中
        - 经济账很大一部分依赖重置后的 KCC 类条款，且没有商业或 MA 业务抵消
        - 2026 年模型收紧可能快速压缩价值
        - 下调估值区间，并重构为政策敏感的护理运营敞口
      - - 续约质量不及预期
        - 新批次中，支付方或肾病科续约、队列结果或贡献利润率转弱
        - 稀缺性溢价逻辑取决于合作伙伴经济账能否持久
        - 若滑坡具有结构性，从继续研究降至回避
      - - 资本结构不如标题定价所暗示的有利
        - 债务契约、留置权或清算优先权吸收大部分增量上行
        - 标题估值可能夸大新普通股投资者可获得的价值
        - 从证券层级重新承销，不从标题标价出发
      - - 公开可比公司重估下行，而 Strive 仍不透明
        - 公开类比标的走弱，Strive 仍不给财务披露
        - 公开市场纪律进一步收紧时，私募乐观情绪会失去可比支撑
        - 要求更大折扣，或停止流程
    notes: 这些是否决触发项，不是常规观察项。每一项都会直接攻击支撑当前估值区间的假设。
    claimRefs:
      - CV014
      - CV017
      - CV037
      - CV039
      - CV040
      - CV042
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入桥
        - 按支付方和服务提供方渠道，将管理医疗支出桥接到确认收入的董事会级材料
        - 把规模主张转成实际估值分母
        - CFO 和财务工作流；交付历史实际数加当前收入运行率
      - - 毛利率和贡献利润率
        - 按合同类型披露毛利、贡献利润率和护理团队成本强度
        - 判断 Strive 是高溢价平台，还是重人力服务业务
        - CFO 和运营复核；绑定到各渠道经济账
      - - 续约和队列质量
        - 按支付方、肾病科集团和地理区域披露续约率、留存和毛利耐久性
        - 检验增长是否足够粘，能否支撑溢价倍数
        - 商业与客户成功尽调，队列按年份切分
      - - 政策敞口图
        - 2026 年重置后，暴露于 CKCC、MA、商业和 Medicaid 条款的成员、收入和利润率占比
        - 显示当前价值有多少押在已承压的报销假设上
        - 战略和财务团队；提供情景包和下行情景敏感性
      - - 资本结构和债务条款
        - 债务期限、定价、担保、契约，以及高于新资金的任何清算优先权或反稀释调节
        - 若不厘清优先级，标题估值不等于新股权有吸引力
        - 法务和财务尽调，提供完整股权结构表和瀑布模型
      - - 退出准备度
        - 战略买家兴趣、财务赞助方胃口，以及公开流程披露准备度的证据
        - 厘清上行空间是来自现实退出路径，还是只靠叙事扩张
        - CEO 和 CFO 尽调，附投行材料、董事会材料和时间假设
    notes: 这些问题是把今天仅基于公开信息的情景工作，转成真正承销决策所需的最低材料包。
    claimRefs:
      - CV008
      - CV010
      - CV037
      - CV042
      - CV045
      - CV046
