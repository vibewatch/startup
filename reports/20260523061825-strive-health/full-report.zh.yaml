      - number: '8.2'
        title: 直接可比公司能框出合理性，但不能给出点估计
        blocks:
          - type: paragraph
            body: >-
              可比公司集合在方向上有用，机械上并不完美。Oak Street 是最强先例，因为它显示，一个有规模、按人头付费的价值医疗资产，在收入披露且战略买方能够深入尽调模型时，可能拿到什么价格。Oak Street
              已经报告 $2.16 billion 的 2022 年收入和 $2.13 billion 的人头付费收入后，CVS 以约 $10.6 billion 企业价值收购了它。这比 Strive
              目前提供的披露多得多，也正是为什么 Oak Street 有参考意义但不能直接迁移。公开市场一侧，Alignment、DaVita 和 Fresenius
              又提示了另一个重要现实：大型、已披露的医疗运营商即便具备战略相关性，通常也围绕较温和的销售额或收入-价值关系交易。Alignment 的市值和低个位数 1x 销售额信号、DaVita
              尽管有盈利的整合肾病护理但市值大约与收入同量级、Fresenius 庞大收入基数相对于市值，都反对直接假设私营肾病平台自动应享受高溢价公开倍数。

              私营肾病同行让 Strive 当前估值不显得荒唐，但不能证明它成立。Somatus 披露 2022 年融资后估值超过 $2.5 billion，Monogram 披露过一轮大型 2023
              年融资和广泛地理覆盖，Interwell
              在合并后披露了非常大的覆盖生命数和管理成本目标。这些事实显示，投资人确实愿意押注肾病价值医疗。但它们也有严重可比性限制。已披露的私营估值较旧，业务模型在服务方网络、居家交付或既有基础设施上的混合方式不同，而且这些同行披露都没有解决
              Strive 自己缺失的收入桥。因此，可比集合支撑的是一个合理性走廊，而不是 Sep 2025 估值公允的干净证据。
