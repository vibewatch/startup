      - number: '4.3'
        title: 资本历史、投资人组合与资本充足性
        blocks:
          - type: paragraph
            body: >-
              融资时间线本身已经出现在公司概况里；财务层面的问题，是这组序列说明了什么资本需求。公开来源支持这样一条阶梯：2021 年 $140 million Series B，2023 年 $166 million
              Series C，2025 年 $550 million Series D，其中包含 $300 million 股权和 $250 million 债务。只使用已披露轮次金额，可得出一个下限：含债务在内累计资本约
              $939.5 million，其中股权至少 $689.5 million。最新轮次还拓宽了资本结构。股权投资人包括 NEA、CVS Health Ventures、CapitalG、Echo Health
              Ventures、Town Hall Ventures、Redpoint，以及 BlackRock 管理的基金或账户；债务部分由 Hercules Capital 领投。


              这个组合有两层意义。第一，外部投资人似乎不把 Strive 看成小众照护导航创业公司；公司融资方式更像一个已有规模的医疗运营平台，带有软件杠杆和战略渠道重要性。第二，债务部分意味着，如果分析师把全部 $550
              million 都当成永久风险资本，标题融资额会高估股权缓冲。最新总融资约 45.5% 来自债务而非股权。公开来源称，募集资金将用于 AI 投资、多专科扩张，以及更深入的支付方 - 服务方伙伴关系，但没有披露
              Hercules 融资工具的借款利率、期限、摊还或契约。


              因此，资本充足性方向上正面，但还不能完全承做。Strive 显然已经融到足够资金继续全国扩张，贷款方背景也可信：Hercules 的 SEC 备案业绩稿显示，2026 年 Q1 承诺额创纪录、季度放款
              $706.4 million，可用流动性超过 $1.0
              billion。即便如此，账上现金、月度烧钱速度、现金跑道和下一轮融资的内部里程碑都没有公开。该业务看起来也更偏营运资本密集，而不是固定资产密集：有强证据显示公司承担劳动密集型照护运营和实施工作，但没有类似证据显示其拥有透析诊所或其他硬资产
              capex，使其看起来像 DaVita 或 Fresenius。
