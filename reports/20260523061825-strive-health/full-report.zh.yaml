      - - 独立软件 / 分析定价
        - null
        - 没有证据显示单独公开 SKU 定价
        - 是否存在纯软件合同未知
        - 公司来源把分析能力打包进更宽的照护模式
        - 说明仅用纯 SaaS 倍数给 Strive 估值的空间有限
      - - 债务资本成本
        - null
        - 债务金额公开；票息和契约条款包未公开
        - 利率、摊还、到期日和担保包未知
        - Series D 新闻稿和行业报道只确认债务规模这个大数
        - 无法用公开信息建模固定费用负担
    notes: null 值表示该指标未公开披露，不是价格为零。定价数据缺失本身就是本章的重大尽调发现。
