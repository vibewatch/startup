              耐久性是公开记录明显变薄的地方。最强的公开留存信号不是披露的 NRR 或续约表，而是 Humana 和 Zing 都宣布扩张既有关系。这有用，但相对于投资人通常想看的材料，仍然只是轶事。已审阅的公开材料没有披露
