      - number: '5.4'
        title: 路线图、成熟度与未解的技术不透明
        blocks:
          - type: paragraph
            body: >-
              公开成熟度信号相当充分。到 2026 年初，Strive 声称服务 145,000 多名患者、拥有 6,500 多个服务方合作伙伴、覆盖全国，并有 770 多名员工，这样的运营规模已经不能再当作试点故事。Sep
              2025 的 Series D 公告也把新增资本直接指向 AI 驱动工具、更深的支付方-服务方合作和多专科扩张。Mar 2026 的 Strive On Live 回顾进一步收紧路线图，谈到 AI
              赋能的人群识别、合规顾虑和心代谢协作。产品页面之外，招聘信号也指向同一方向：公开岗位显示公司需要 AI 工程、数据基础设施和工程领导力，而不是一个冻结的平台。


              这些都说明产品栈仍在持续建设和扩展。它们也暗示，Strive 试图从只做肾病管理，延伸到更偏多专科、全人护理的架构，同时不放弃肾脏科这个重心。这个策略是合理的，因为 CKD
              结果与糖尿病、高血压和心血管疾病紧密相连，而 Strive 的工作流页面已经强调跨专科协调。


              未解决的问题是，成熟度在运营里比在文档里更容易看到。开发者信号存在，但主要通过招聘页面间接出现，而不是来自公开文档界面、发布说明或可见的开发者生态。因此，公开记录支持一个有层次的结论：Strive
              作为已部署的护理加技术平台看起来成熟；作为软件平台，仍然相对不透明。这不推翻产品逻辑，只意味着技术护城河和可靠性故事不能只靠公开营销材料背书，而要靠私下尽调承保。
