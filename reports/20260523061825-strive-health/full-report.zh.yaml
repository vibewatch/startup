      - number: '5.3'
        title: 信任、质量与临床验证：证据强，但部分已经变旧
        blocks:
          - type: paragraph
            body: >-
              信任和质量主张是 Strive 产品叙事的重要部分，因为公司嵌在受监管的护理流程里，也处理敏感患者数据。公司公开材料反复引用两项程序性控制：NCQA 的病例管理和人群健康认证，以及 CareMultiplier
              的 HITRUST 认证。配套来源对这些背书的含义解释得较细。NCQA 公告说明，Strive
              如何区分更高强度的病例管理和更广泛的人群健康支持，并把两项计划都连到护理连续性、患者教育和预先规划的治疗模式选择。HITRUST 公告则把 CareMultiplier
              接到正式的安全控制框架，并明确提到隐私、合规和信息风险管理。


              临床验证证据也强于典型私营护理赋能公司的公开记录。Strive 的 2025 年研究摘要和 AJMC 文章报告称，已入组的 3b 期和 4 期 CKD 患者 eGFR 下降更慢。Duke HV-EQ
              案例又围绕下游结果给出更结构化的外部包装，包括优化透析起始、居家治疗模式采用、总护理成本下降和住院改善。媒体资料包还叠加了公司报告的参与度和满意度指标。合在一起，这些来源支撑了一个判断：Strive
              有经过验证的护理模型，不只是营销叙事。


              但问题在于新鲜度和外部性。本轮检索找到的最详细 NCQA 和 HITRUST 解释，是 2021-2022 年公司自己发布的旧文章；2025-2026
              年材料大多重述这些主张，而不是链接到当前注册库或认证范围。这不代表控制是假的，而是说明采购级公开证据比标题主张更薄，尽调应直接核验当前认证范围和续期情况。
