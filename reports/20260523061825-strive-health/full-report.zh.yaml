      - number: '4.4'
        title: 外部经济性与正确的公开承做姿态
        blocks:
          - type: paragraph
            body: >-
              肾病基于价值照护周围的外部经济性，对公开资料下的乐观财务解读形成真实限制。CMS 第二份 KCC 评估报告称，该模型改善了几个质量指标，但仍让 Medicare 支出增加 $304.8
              million，主要因为激励付款。随后 CMS 收紧 2026 绩效年模型：CKD 季度按人头付费砍 50%，肾移植奖金取消，Kidney Care First 轨道在 2025 年底结束，CKCC
              则在更严条款下持续到 2027 年。Avalere 又补充了另一个财务警讯：KCF 诊所从 30 家降到 15 家，CKCC 实体从 100 个降到 75 个，即便对齐受益人到 PY2025 升至约
              257,000。Fierce 同期报道明确把这些变化描述为提升模型可持续性的努力。


              下游透析经济性进一步让图景复杂化。PMC 关于 Medicare Advantage 透析定价的研究发现，MA 计划平均支付价格比按服务收费 Medicare 高 27%，大型透析连锁能够拿到更高加价。对
              Strive 来说，这很重要，因为如果上游协调降低了使用量，但下游透析价格仍然高企，支付方节省池会被挤压。换句话说，Strive 并不控制它试图管理的肾病成本栈里的全部经济性。


              实际承做含义是，公开证据支持情景区间，而不是精确模型。投资人能看到大量资本已到位、有意义的运营规模，以及不小的临床结果支持。看不到的是经审计收入、盈利能力、毛利率、现金消耗、现金跑道、债务条款、实际定价、抽成率、留存，或队列层面的贡献利润率。因此，财务结论在战略相关性和资本获取上偏正面，但仍受缺失的私有数字，以及
              2026 年变得更不宽松的报销环境约束。
