        - 把评分洞察转成电话、上门、教育和跨提供方协调
        - 临床人员配置、本地工作流和合作方响应速度
        - 人在回路模式可个性化干预时点
        - 规模经济性取决于公开不可见的人员生产率
      - - 合规与安全层
        - 用 NCQA 认证照护项目和 HITRUST 认证平台主张支撑信任
        - 当前认证、审计和治理流程
        - 这是支付方和提供方采购时的重要信号
        - 公开渠道不易查到当前详细范围
