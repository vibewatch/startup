      - - 月度烧钱
        - null
        - 当前
        - 烧钱速度决定股权缓冲被消耗得多快
        - 索取月度 P&L 和现金流瀑布表
      - - 现金跑道月数
        - null
        - 当前
        - 现金跑道显示利润率拐点前是否可能还要融资
