      - number: '3.3'
        title: 既有巨头与渠道权力：DaVita 和 Fresenius 仍掌握最难复制的资产
        blocks:
          - type: paragraph
            body: >-
              Strive 面临的最严峻战略压力不只来自直接平台。压力还来自既有巨头：它们能把基于价值合同、实体可及性、转诊路径和持久医疗服务方关系组合起来。DaVita 的公开材料在这点上异常直接：公司声称管理超过 $5
              billion 成本，管理超过 220,000 名 CKD 和 ESKD 患者，拥有 2,300 多个医生合作关系、32,000 多名家庭透析患者，以及二十年里超过 120,000
              例移植。即便这些指标由公司框定，它们也指向一个软件优先同行难以复制的竞争现实。


              Fresenius 即便已把 Fresenius Health Partners 注入 Interwell，仍然重要，因为它的生态继续强调家庭透析、移植可及性、互操作性和健康计划协作。Becker’s 对
              Cigna 关系的报道说明了底层权力：全国透析中心足迹和居家选项，可以被打包进支付方合同，让买方更容易采购，也更容易安排患者流向。


              同样的规模也制造了二阶风险。Home Health Care News 把 DaVita-Elara 动作视为证据，说明肾病既有巨头正在进一步进入居家场景，并同时提示新的反垄断担忧。对 Strive
              来说，含义很直接：既有玩家反应不是假设。大型运营商可以从透析延伸到相邻居家健康和基于价值伙伴关系，同时利用既有患者触点和医疗服务方经济性守住份额。
