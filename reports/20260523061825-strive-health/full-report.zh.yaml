    分析与工作流工具、Kidney Heroes 照护团队、肾脏科赋能，以及面向 CKD 和 ESKD 人群的支付方 / 医疗服务方合作打包成一套运营模式；公司现在称，已在美国全部 50 个州服务超过 145,000
