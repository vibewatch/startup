      - number: '8.3'
        title: 当前估值在基准情景下有条件地合理，但尚未被证明
        blocks:
          - type: paragraph
            body: >-
              情景法比合成收入倍数练习更站得住，因为缺失的输入不是一个小数点，而是整条变现桥。悲观情景假设，2026 年之后的肾病政策收紧、下游透析定价压力和劳动密集护理交付，阻碍 Strive
              把规模转化为强利润率或持久续约。在这个世界里，公司更像一个不透明的护理运营资产，而不是高溢价技术赋能平台，纯公开估值区间会明显低于上一轮。基准情景更窄：Strive
              继续增长，支付方需求仍然真实，私下尽调显示公司确实能赚到足够抽成率和贡献利润率，使当前估值可辩护。这可以支撑围绕当前价格的估值区间，但只能有条件成立。乐观情景需要的不只是更多会员，而是披露收入质量、证明利润率能扛住
              2026 年报销重置，并证明 Strive 相比已经披露收入和盈利的公开类比公司应享有稀缺性溢价。

              这个框架导向的不是英勇目标价，而是务实建议。仅凭公开证据，Strive 不是应回避的标的；公司有真实战略相关性、同行地位和可信客户问题。但在已披露的 Sep 2025
              估值上，它也不是高确信买入，因为价格支撑的证据质量仍弱。最好的公开答案是继续研究，中等置信度，估值立场介于偏高到有条件合理。直白说，价格可能跑得通，但管理层仍需证明为什么跑得通。在收入桥、利润率、续约和清偿顺位数据拿出来之前，当前估值只能框区间，不能直接押注。
