  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 公开产品模块及其服务的肾病照护工作流
        blocks:
          - type: paragraph
            body: >-
              Strive 的产品边界比一整套数字健康套件窄，但比单一分析工具宽。官方解决方案页面反复把四个具名组件打包在一起：Population Health、Kidney Heroes、CareMultiplier 和
              Strive Care
              Partners。合在一起看，流程先更早识别肾病风险患者，再进入高接触度临床外展，最后把肾脏科医生、医疗系统和支付方接入价值医疗安排。公开页面并不单卖一个软件席位，而是把软件、人员和合约支持做成一套协同交付模型。


              这种流程重心能从各模块承接的用户任务里看出来。Population Health 聚焦肾衰竭前的主动患者识别、教育和进展管理。Kidney Heroes
              是运营层：由执业护士牵头的多专科团队，作为肾脏科医生的护理延伸，同时与 PCP 和其他专科医生协同。Strive Care Partners 面向肾脏科医生，包住 CKCC 和 Medicare
              Advantage 全风险模型下的风险赋能。CareMultiplier 则在这些服务背后，作为肾病专用的数据和预测层，把干预信号推给护理团队。Humana
              的多州公告进一步补齐了具体流程，点名药物管理、透析通路规划、移植协调和社会服务都是交付服务的一部分。


              实际含义是，Strive
              卖进支付方和服务方的既有流程，而不是绕开这些流程。产品成熟度因此不取决于炫目的独立功能，而取决于这些模块能否在护理现场彼此加固。公开证据显示它们确实能做到，尤其是在预防性肾病管理和肾脏科支持上。代价是，外部读者能看到扎实的护理模型叙述，却看不到像独立企业软件平台那样透明的模块级文档。
