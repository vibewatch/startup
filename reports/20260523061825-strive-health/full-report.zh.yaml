      - number: '7.3'
        title: 合作方、资本与人员风险
        blocks:
          - type: paragraph
            body: >-
              公开证据说明，Strive 现在已经大到合作方依赖比单纯产品新颖性更重要。公司披露的参考集合集中在少数可见支付方和服务方渠道：Humana、NANI、Oak Street、Aetna、Blues 计划，以及
              Strive 称超过 6,500 个组织或临床医生的更广泛服务方基础。这足以证明真实市场渗透，但不足以证明集中度温和。公开材料没有显示任何单一支付方、肾脏科团体或医疗系统关系的收入权重。与此同时，Stout 和
              Medicare Advantage 透析定价研究表明，DaVita 和 Fresenius 等既有巨头仍处在集中的肾病生态里，即便上游协调改善，下游经济也可能依旧顽固。


              资本和人员风险会放大这种依赖。Strive 的 2025 年融资混合了 $300 million 股权和 $250 million Hercules 牵头债务，管理层称资金将用于深化合作、扩展专科并加速 AI
              投资。只有当组织能比政策和渠道压力压缩利润更快地把支出转化为可重复结果和续约，这才是利好。公司也似乎在 700
              多人团队之上扩充一个相对紧凑的高管班子。公开来源显示，公司在临床、技术、数据、运营和战略岗位上都有大量招聘，并在总裁和 COO
              层面补强领导力。这种画像可能创造很强的运营杠杆，也可能因入职纪律、留存，以及公司仍多大程度依赖少数高管来保持机器对齐，而带来痛苦的不一致。
