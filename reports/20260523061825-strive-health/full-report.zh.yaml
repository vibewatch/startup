  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与公开规模
        blocks:
          - type: paragraph
            body: >-
              理解 Strive
              的客户基础，要先看谁承担风险、谁拥有工作流。公司并不是把一个狭窄单点方案卖给某个买方。它在公开界面把市场拆成支付方、医疗系统和肾脏科医生；面向患者的一层则位于其下，是被服务人群，而不是付费客户。这个框架很关键，因为本轮找到的证据持续显示，Strive
              先从价值导向肾病护理的经济模型切入，再围绕本地临床医生嵌入护理团队和工作流支持。换句话说，支付方可能出钱，服务方可能落地运营，会员或患者是最终用户，但商业关系仍然指向机构客户。


              公开规模信号真实存在，但很容易被误读。Strive 披露，到 Sep 2024 已服务 121,000 多名患者、拥有 6,500 多个服务方合作伙伴，并覆盖全美 50
              个州。这些数字支持全国部署能力，却不等于付费客户数量。来源集从未把患者规模转换成不同 logo 数，也没有按渠道拆收入。因此，公开材料能给出的明确结论是：Strive
              在支付方和服务方渠道都有实质客户宽度，但投资人仍需通过私下尽调弄清，服务人群数字背后到底有多少活跃账户。
