      - 依赖
      - 运营收益
      - 关键风险
    rows:
      - - 合作方数据摄取
        - 汇聚并标准化多源数据，拼成单一肾病患者视图
        - 合作方数据访问和标准化
        - 为分诊和风险评分提供更丰富的纵向上下文
        - 公开资料没有暴露 schema 和接口细节
      - - 预测分析模型
        - 为病情进展、紧急透析、入院、再入院和未诊断 CKD 生成风险评分
        - 模型训练数据、特征工程和临床治理
        - 支持更早干预，让照护团队更聚焦
        - 没有公开敏感度、特异度或模型卡披露
      - - 照护管理工作流套件
        - 向照护团队和合作方工作流推送任务、仪表盘和告警
        - 内部软件加 EMR / 流程集成
        - 把分析转成运营动作，而不是停留在被动报告
        - 没有公开发布说明、可用性历史或功能文档
      - - EMR / 提供方集成
        - 标记高风险患者并共享信息，减少频繁手工索要病历
        - 提供方认可和合规 EMR 连接
        - 降低诊所负担，并支持持续沟通
        - 没有公开互操作标准或支持系统列表
