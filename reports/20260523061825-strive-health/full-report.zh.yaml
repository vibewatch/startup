      - number: '3.2'
        title: 直接平台同行：Monogram、Somatus、Interwell 与 Evergreen
        blocks:
          - type: paragraph
            body: >-
              在直接平台中，Monogram 和 Somatus 最像已经放量、面向支付方的 Strive 替代方案，但两者到达这一位置的路径不同。Monogram 的公开资料包围绕上门多专科照护和健康计划合作展开。公司在
              2023 年披露 $375 million 融资，拥有支付方和投资人利益相关方的广泛战略支持，当时覆盖 34 个州和近 4,000 个城市。Humana 和 Aetna 合作材料进一步说明，Monogram
              靠计划关系、上门访问和移植评估协调取胜，而不是靠拥有肾脏科医生或硬透析足迹。


              在当前公开数据集中，Somatus 是更明确已经放量的同行。公司现在称，服务美国全部 50 个州和 DC 超过 500,000 名患者，管理超过 $14 billion 医疗成本，并与超过 100 家肾脏科诊所和
              5,500 名医疗服务方签约。重要的是，Somatus 还披露了比多数同行更强的公开家庭透析和移植结果；这很关键，因为这些恰好也是 Strive 自己销售故事使用的结果。


              Interwell 又不同。2022 年合并把 Fresenius 的合同基础设施、大型肾脏科医生网络，以及 Cricket 的分析和互动栈合到一个实体里。这让 Interwell
              成为最清楚的肾脏科医生优先平台同行，特别是后续报道还显示其继续扩展支付方并靠近 Oak Street。Evergreen
              在公开规模上更小，但战略上值得注意，因为它为肾脏科诊所提供一条从慢病管理经济性进入更广基于价值照护的运营坡道，包括新的 Phamily 赋能 AI 工作流。
