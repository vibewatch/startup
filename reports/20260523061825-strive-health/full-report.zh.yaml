  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可定价性始于已披露经济数据，而这些数据仍然缺失
        blocks:
          - type: paragraph
            body: >-
              标题融资容易复述，却难以承保。Strive 官方 Sep 2025 融资公告和同期报道支持一轮 $550 million 的 Series D，其中 $300 million 是股权、$250 million
              是债务，外部报道把本轮估值放在大约 $1.8 billion。公开材料还支持一个判断：这不是一家很小的供应商。Strive 称服务 145,000 多名肾病患者、与 6,500 多个服务方合作伙伴合作、覆盖全美
              50 个州，并管理近 $5 billion 年度医疗支出。这些都是有意义的相关性信号，却不足以证明估值。同一份公开记录仍未披露确认收入、毛利率、EBITDA、已实现
              PMPM、共享节省分成，或决定标题估值对普通股上行意味着什么的债务条款和优先股堆叠。

              这个区别很关键，因为管理医疗支出和患者数不能直接拿来做估值分母。管理支出是理赔池，不是 Strive
              留存的收入。除非投资人能看到支付方组合、抽成率、合同期限、执业护士强度，以及经济收益来自共享节省、管理费还是某种混合结构，否则患者数也不是好的价值替代指标。因此，公开证据同时说明两件事。第一，Strive
              在肾病价值医疗中显然重要。第二，公司公开披露不足，无法支撑精确的 EV-revenue 或 EV-EBITDA 判断。正确的分析姿态，是把当前估值标记作为带区间的情景输入，而不是已经证明的公允价格。
