      - number: '1.4'
        title: 里程碑、规模信号与公开尽调保留项
        blocks:
          - type: paragraph
            body: >-
              从尽调视角看，Strive 的里程碑像是一条从区域性肾病照护重构走向全国平台地位的稳步路径。创始叙事始于 2015 年 Riopelle 目睹朋友遭遇肾病急症，2018 年转化为公司成立，随后通过 2020 年
              SSM 合资公司、2021 年 Series B、2022 年 CKCC 扩张、2023 年 Series C，以及 2024 年覆盖美国全部 50 个州，逐步机构化。到 2026 年初，媒体资料包描述的公司已有
              770 多名员工、服务超过 145,000 人、超过 6,500 个医疗服务方，以及近 $5 billion 在管医疗支出。公司还声称结果强劲——总肾病照护成本低 20%、住院少
              41%、最佳透析启动率更高、家庭透析采用率更高，以及 94% 患者满意度。这些指标最支撑 Strive 的销售叙事和估值。


              这里有两个重要保留项。第一，公开财务透明度仍然薄。即使完成标志性的 Series D，公司公开材料仍不披露经审计的 GAAP
              收入、盈利能力、毛利率或现金消耗。因此，投资人看起来主要基于增长、运营规模、战略相关性和结果主张来承做 Strive，而不是基于完全透明的财务报表。第二，外部政策环境已经变得没那么宽松。Avalere 和
              Jones Day 都把 2025 年 CMS 对 Kidney Care Choices 模型的调整，描述为对服务方退出、更紧经济性以及模型约 $304 million 净损失的回应。Strive 已经在
              CMS 对齐、肾脏科连接的基于价值照护中做出真实规模，所以这些调整不是抽象的行业噪音；如果基准折扣、奖金或报销机制继续收紧，它们就是直接的运营逆风。


              总体而言，公司概况证据支持一个正面但有条件的结论。Strive
              确实拥有全国触达、异常强的创始人与市场匹配、蓝筹支持者，以及差异化的肾病照护运营模式。但它仍是一家私营、资本密集型公司，所在市场又受政策高度影响；公开证据在盈利能力和治理上仍不完整。
