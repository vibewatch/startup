  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现：承担风险的肾病合同，而不是软件席位
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Strive 赚钱靠的是嵌入基于价值肾病合同，而不是出售独立软件席位。Strive 的支付方页面称，公司要为商业、Medicare Advantage 和 Medicaid 人群中 CKD 与
              ESKD 成员的质量结果和财务表现负责。肾脏科医生页面称，CKCC 和 Medicare Advantage 全风险合同是核心用例；NANI 合作公告则称，各方将共同追求并管理全球风险支付模型。Humana
              2024 年公告给出了一个具体支付方渠道案例：面向肾病成员的多州 Medicare Advantage 协议。合在一起，这些来源支撑的变现模式，来自照护管理运营、嵌入式分析，以及上下行绩效经济性。


              同一组来源也说明，医疗支出管理规模不是收入。Strive 相关公开披露从 2022 年 CKCC 启动背景下约 $600 million 医疗支出，移动到 2023 年 Business Wire 公告中的超过
              $2.5 billion，再到 2025-2026 年公司和新闻报道中的近 $5
              billion。这些数字有意义，因为它们显示预算责任和在管人群广度。但它们不等于已确认收入，因为支出分母包括归因人群下游支付的医疗理赔，而不是 Strive 留下来的美元。如果没有披露抽成率、按人头
              PMPM、管理服务费或共享节省拆分，投资人无法有把握地把在管支出转换成收入。


              因此，定价透明度仍然薄。所审阅的官方、伙伴或行业来源，没有披露标价、实际 PMPM，或各渠道上下行收益分配的精确规则。可辩护的结论是，Strive
              通过支付方和医疗服务方合同变现，把临床运营、技术和财务责任打包；但具体收入确认机制仍属私有信息。
