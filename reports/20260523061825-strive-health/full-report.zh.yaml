  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议链条从战略相关性出发，穿过缺失的经济性和政策压力，最终落到继续研究，而不是清晰买入或回避。
    data:
      nodes:
        - id: scale
          label: 战略相关性真实
          detail: Strive 拥有有意义的支付方和提供方覆盖，也有大规模管理人群信号
        - id: private-mark
          label: 私募估值有分量
          detail: 2025 年 9 月融资规模较大，据报道估值约 $1.8B
        - id: opaque-economics
          label: 经济性仍不透明
          detail: 收入、分成率、毛利率和 EBITDA 仍未公开披露
        - id: policy-reset
          label: 2026 年报销重置很关键
          detail: 肾病模型经济性收紧，公司仍需要证明韧性
        - id: comp-corridor
          label: 可比公司框出的是区间，不是点价
          detail: Oak Street、公开可比公司和肾病同行帮助判断合理性，但不能证明公平
        - id: recommendation
          label: 继续研究
          detail: 当前估值可能有条件地合理，但必须等私下尽调补齐核心缺口
      edges:
        - from: scale
          to: private-mark
          label: 相关性帮助吸引资本
        - from: private-mark
          to: opaque-economics
          label: 规模不能解决披露问题
        - from: opaque-economics
          to: policy-reset
          label: 利润率缺失会放大敏感性
        - from: policy-reset
          to: comp-corridor
          label: 情景分析优于假精确
        - from: comp-corridor
          to: recommendation
          label: 区间不是证明
    approximationNotes: 这是一张决策图，不是财务模型。它解释了为什么公司信号积极，但经济性披露薄弱时，结论仍是继续研究。
