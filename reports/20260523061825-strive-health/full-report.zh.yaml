  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              基于价值的肾病照护并不等于整个肾脏病市场，也不等同于透析报销。Strive 可辩护的市场边界包括四个相连层次：上游 CKD 识别和风险分层；与肾脏科医生和 PCP 并行的高接触照护协调；CMS
              或支付方合同内承担风险的肾脏科运营；以及下游透析过渡、家庭透析和移植导航。CMS 将 KCC/CKCC 结构描述为面向 Medicare 按服务收费患者的协调模型，覆盖 4-5 期 CKD、ESRD
              或移植状态；Strive 自己的伙伴页面和媒体资料包则显示，商业市场把同一运营模式延伸到 Medicare
              Advantage、Medicaid、商业计划、肾脏科团体、医疗系统和医生伙伴。这个框架很重要，因为它让本章聚焦在 Strive 能创造价值的运营和合同层，而不是整个透析机构收入池，或每一种通用慢病管理软件类别。


              为什么边界重要，最清楚的公开证据来自疾病负担与付费市场结构之间的分裂。官方来源把成人 CKD 人群放在 3,000 多万中段，但已治疗 ESKD 人群只占总数一小部分，CKCC/KCC 对齐受益人更少。公开
              Medicare 支出视角也会因纳入口径而大幅不同：老年 CKD 理赔、ESKD 专项支出、透析机构付款，或更广义的肾病总额。公司来源又走得更远，使用超过 $400 billion
              的未管理支出数字；这些数字方向上有用，但不能直接与仅 Medicare 的基线相比。把所有这些数字都当成同一个 TAM，会夸大确定性。


              传统替代方案也比一张创业公司竞品名单更宽。现状下的肾病照护仍锚定在碎片化的按服务收费肾脏科随访、透析服务方运营模式，以及普通支付方案例管理项目上。专科肾病照护平台只有在比默认组合更好地跨这些孤岛协调时，才会创造增量经济价值。Strive
              的肾脏科和支付方材料反复把公司定位为连接层，而不是透析所有者或轻薄分析工具；这支持把市场定义在整合式、基于价值的肾病运营周围，而不是无差别肾病报销周围。
