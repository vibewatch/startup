      - number: '4.2'
        title: 单位经济与公开记录仍无法证明的部分
        blocks:
          - type: paragraph
            body: >-
              公开单位经济可见度明显弱于公开运营规模可见度。Strive 的媒体资料包和 Series D 材料给出可信的规模快照：到 2026 年初，服务超过 145,000 人，拥有超过 6,500
              个医疗服务方伙伴，管理近 $5 billion 年度医疗支出，员工超过 770 人。这些都是有用的承做代理指标，因为它们显示 Strive
              不是一个很小的试点供应商。但它们仍没有回答风险投资承做最关心的核心财务问题：已确认收入、毛利率、EBITDA、自由现金流、月度烧钱速度、现金跑道、CAC、回本周期、续约率，或净收入留存率。


              公开模式描述解释了原因。Strive 反复把自己描述为医疗服务方办公室的延伸，用执业护士带队的多学科照护团队包住数据和工作流工具。服务方集成材料特别称，Strive 是服务方办公室的延伸；肾脏科医生材料则强调对
              CKCC
              和全风险合同的支持。这指向一个服务较重的成本基础，临床人员薪酬、照护协调、实施、服务方上线和分析开发都会影响经济性。它也意味着，利润率可能不主要由经典软件托管效率决定，而更多由照护团队生产率、合同设计，以及技术多快能减少可避免使用来决定。


              结果证据可能强化收入质量，却不揭示单位经济。Strive 2025 年资源中心对同行评审研究的总结称，其项目中的 3b 期 CKD 患者 CKD 进展率下降 77.2%，4 期患者下降
              65.2%。这类证据可以让支付方续约和服务方协同更可信。但公开读者仍看不到这些结果背后的合同数学。因此，正确姿态是把公开规模和结果披露作为质量信号，同时把所有利润率、抽成率和盈利能力结论都当作开放尽调项，而不是已解决事实。
