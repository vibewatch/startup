chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与照护模式
        blocks:
          - type: paragraph
            body: >-
              Strive Health 总部在 Denver，成立于 2018 年，目标是围绕更早干预、协调式多学科支持和承担风险的经济模型，重构肾病照护，而不是沿着传统体系把重点放在晚期透析上。权威公司材料把 Chris
              Riopelle 和 Will Stokes
              列为联合创始人，把使命锚定在「重新定义照护，提升生命质量」这句话上，并反复把公司描述为基于价值肾病照护的全国领导者。核心判断是：肾病往往发现太晚、管理被割裂在不同孤岛里，支付激励又奖励下游强干预，而不是上游预防。Riopelle
              的个人创业缘起——看到一位密友几乎走到肾衰竭——在 Strive 的媒体资料包、周年帖子和独立本地报道中反复出现，使这套创始故事比普通使命宣言更可信。


              主页、媒体资料包和产品页描述的商业模式由三个紧密耦合的部分组成。第一，Strive 部署高接触的 Kidney Heroes
              团队，由执业护士带队，护士、社工、营养师、个案经理和照护协调员提供支持。第二，公司嵌入本地肾脏科医生、PCP、医疗系统和支付方，而不是替代他们。第三，公司使用 CareMultiplier
              这个面向肾病的机器学习和预测分析平台，识别高风险患者、暴露照护缺口，并推动更早干预。管理层把这套产品描述为一套全服务解决方案，覆盖商业计划、Medicare Advantage、传统
              Medicare、医疗系统、医生团体和 CMS 相关项目。这一点有战略意义，因为 Strive 不是单一合同下的点状解决方案；它想拿下基于价值肾病照护周围的运营层。


              公司的定位主张很强，但并不完全中性。Strive 称自己是美国基于价值肾病照护的领导者，材料引用了超过 145,000 名患者、超过 6,500 个医疗服务方伙伴，以及近 $5 billion
              的在管医疗支出。多个 2024-2026 年官方发布和独立行业报道相互印证这些规模说法。更强的分析结论是，Strive
              似乎已经从试点阶段的肾病导航供应商，跨到有实质运营触达的全国性专科照护平台；但公开披露仍更强调运营指标，而不是收入或盈利能力。
