      - number: '5.2'
        title: 技术与运营架构：数据聚合、风险评分、流程集成
        blocks:
          - type: paragraph
            body: >-
              公开材料里最具体的技术描述，来自 Strive 的 CareMultiplier 资料和服务方集成内容。这些来源称，CareMultiplier
              会从许多乃至数百个来源聚合并标准化数据，运行肾病专用预测模型，再把可执行输出送入自研护理管理流程套件和连接 EMR
              的流程。公开点名的模型输出包括透析崩溃风险、入院和再入院风险、疾病进展风险，以及未诊断肾病识别。Strive 还称，平台可以触发全天候警报和人群级仪表盘，让临床医生在高成本事件发生前行动。


              这些来源拼出的架构，不是 API 优先的开发者产品，而是一套有人参与的运营栈。数据从合作方环境进入，CareMultiplier 负责标准化和评分，服务方集成团队把输出接到 EMR 和工作流，Kidney
              Heroes 或合作临床医生再执行干预。虽然软件内部细节不多，集成手册对流程却写得异常明确：主动触达服务方、到诊所现场拜访、标准化沟通渠道、角色设定、互操作目标，以及合规的 EMR
              集成，都有公开记录。Strive 还提出了激进的部署主张，包括两周内完成合作方数据集成、90 天内搭起新的合作模型。


              分析加流程设计的组合确实构成差异化，但也暴露了本章最核心的技术约束。Strive 披露的是结果和运营主张，不是深入的系统文档。公开材料没有暴露 API、数据
              schema、模型卡、可用性承诺或事故历史界面。因此，运营架构在业务流程层面可理解，在软件工程层面仍部分不透明。
