  - id: TI005
    title: 公开财务缺口表
    columns:
      - 未披露的私有指标
      - 为何重要
      - 已有公开代理指标
      - 对投资判断的影响
      - 具体尽调路径
    rows:
      - - 经审计收入
        - 需要用它把合同量和实际收入规模对上
        - 管理支出、服务人数和服务提供方数量
        - 阻碍精确计算收入倍数或搭建利润率桥
        - 取得经审计财务报表和按渠道拆分的收入
      - - 毛利率
        - 显示照护交付加技术是否能有经济性地放大
        - 服务重的模式描述和员工数
        - 看不清软件杠杆能否抵消人工拖累
        - 索取按支付方和提供方合同类型拆分的毛利率
      - - EBITDA / 盈利能力
        - 决定报销收紧时的自我造血能力
        - 大额融资轮和全国规模
        - 无法判断融资是增长选择，还是结构性亏损所迫
        - 索取 EBITDA 桥、调整口径以及季度趋势
      - - 现金余额 / 现金跑道
        - 需要用它判断债务支持的 Series D 后资本是否充足
        - 累计融资已披露，但现金余额看不见
        - 无法量化稀释风险或下一轮融资紧迫性
        - 索取当前现金、受限现金和月度烧钱情景模型
      - - 债务条款和契约
        - 即便融资看似充足，债务也可能埋下下行风险
        - 债务金额和贷款方身份已公开
        - 无法建模利息负担或契约风险
        - 审阅已签署的信贷协议和契约模型
      - - 合同抽成率 / PMPM
        - 没有抽成率，就无法从管理支出推导收入
        - 合同渠道可见，价格不可见
        - 阻碍货币化桥和队列经济性分析
        - 索取定价表和按队列拆分的实际 PMPM
      - - 留存 / NRR
        - 显示平台能否在现有账户内复利增长
        - 没有公开续约队列数据
        - 阻碍收入质量评估
        - 索取按支付方和提供方队列拆分的总留存率与净留存率
      - - CAC / 回本周期
        - 需要用它判断增长是否资本高效
        - 公开规模和投资人兴趣只能说明需求，不能说明获客效率
        - 阻碍销售效率分析
        - 索取漏斗转化、销售周期和回本周期分析
      - - 按合同类型拆分的贡献毛利
        - 必须用它区分优质增长和结构性亏损增长
        - 成效主张和员工数显示模式复杂
        - 阻碍渠道优先级和利润率策略评估
        - 索取扣除照护团队成本和支持性开销后的合同级单位经济性
      - - 营运资本节奏
        - 共享节约模式可能带来应收款节奏和准备金复杂性
        - 没有公开现金转换数据
        - 阻碍短期流动性压力测试
        - 索取按渠道拆分的应收账款账龄、准备金政策和现金转换周期
    notes: 这是本章的核心尽调表：它点出公开记录中缺失的具体私有指标，以及补齐每个缺口所需的文件或分析。
    claimRefs:
      - CI011
      - CI022
      - CI030
      - CI035
      - CI036
      - CI044
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerates the highest-impact private financial metrics still missing from the public record and the document
        path required to close each gap.
  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 在工作流中的作用
      - 公开成熟度 / 状态
      - 差异化
      - 关键尽调缺口
    rows:
      - - Population Health
        - 支付方、医疗体系、医疗集团、肾脏科医生
        - 提前识别有风险的肾病患者，协调干预，并在危机事件发生前把患者留在计划内路径上
        - 当前核心解决方案
        - 把预测分析和高接触临床支持配在一起，而不是泛化的个案管理
        - 没有公开的模块级定价、SLA 或按渠道拆分
      - - Kidney Heroes
        - 肾脏科医生、PCP、专科医生、患者
        - 由 NP 牵头的照护延伸人员，在本地工作流中执行触达、教育、协调和随访
        - 当前核心解决方案
        - 多专科人员配置明确聚焦肾病，并可按市场定制
        - 公开资料未披露人员配比和生产率指标
      - - CareMultiplier
        - Strive 临床团队和合作提供方
        - 汇聚合作方数据，评估风险，并把洞察推送到工作流套件、仪表盘和告警中
        - 当前核心技术平台
        - 肾病专用预测模型直接连到临床动作，而不是只做分析报告
        - 没有公开模型卡、API 或详细架构文档
      - - Strive Care Partners
        - 独立肾脏科医生和肾脏科团体
        - 用分析、工作流、临床资源和合同支持，帮助参与 CKCC 和 MA 风险
        - 当前肾脏病平台
        - 围绕肾脏科医生主导的价值医疗，包上一层技术和运营支持
        - 公开证据对工作流定位很强，但经济性和合同机制有限
      - - 提供方集成工具包
        - 诊所和合作方运营团队
        - 入驻、EMR 集成、角色设定、互操作规划和沟通节奏
        - 当前赋能能力
        - 明确的集成手册比许多照护赋能同行公开材料更成熟
        - 没有公开部署评分卡或参考架构包
    notes: 各行把公开产品面总结为工作流交付资产，而不是单独定价的软件 SKU。公开材料强调一体化运营，因此用部署语言描述成熟度。
    claimRefs:
