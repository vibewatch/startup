  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 报销重置与监管风险
        blocks:
          - type: paragraph
            body: >-
              Strive 逻辑里最大的风险，不是肾病价值医疗这个概念是否存在，而是 2026 年 Kidney Care Choices 重置之后，参与这个市场的经济模型是否仍然跑得通。CMS、法律提示和 Avalere
              都指向同一个方向：Kidney Care First 提前结束，CKCC 保留下来但基准折扣更严，移植奖金消失，CKD 人头付费减半。CMS 第二次评估把政策动机说得更明白：多个质量领域改善了，但
              Medicare 支出仍增加 $304.8 million，主要来自激励付款。对所有依赖肾病风险合约保持足够慷慨、以资助高强度护理管理的运营商来说，这个组合都会带来真实的政策波动风险。


              Strive 尤其暴露，因为它的公开定位反复把业务绑定到 Medicare、Medicare Advantage 计划和在 CKCC 类环境中运营的肾脏科团体等承担风险的安排。如果公司已经多元化到商业险和 MA
              经济模型，且这些模型仍奖励结果，它或许能吸收政策收紧，但公开来源没有量化这个组合。投资人能从公开证据得出的结论更窄：Strive 运营在 CMS
              明确试图挤压可持续性的肾病护理环节，而它最可见的公开支付方和服务方关系，恰好就是会迅速感受到政策重置的渠道。缓释因素不是政策稳定，而是 CMS 选择让 CKCC 运行到 2027
              年，而不是彻底关停这个模型，这给规模化运营商留下空间，证明自己在更紧条件下仍能胜出。
