      - number: '1.2'
        title: 创始人、领导班底与治理信号
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配度，是 Strive 画像中更清楚的优势之一。Chris Riopelle 不是从通用 SaaS 或支付方运营背景切入肾病照护；公司材料称，他在 Gambro 和 DaVita
              工作十年，最终负责一个约 $1 billion 的部门，之后又担任 LaVie Care Centers 的 COO 和 NorthStar Anesthesia 的 CEO。这种经历组合很关键，因为
              Strive 要解决的问题落在肾脏科运营、承担风险的照护交付、急性后期复杂性和医疗服务方网络执行的交叉点上。公开创业故事也解释了为什么产品姿态强调患者导航和更早行动，而不是纯粹的精算风险评分。Will
              Stokes 仍被列为联合创始人兼顾问，说明即便运营结构在专业化，创始班底仍在。


              Strive 现在的领导层更像一家已经放量的运营公司，而不是围绕魅力型创始人即兴搭建的创业公司。当前公开团队包括总裁 Paul Marchetti、COO Jen Browne、CFO Orin
              McIntosh、首席肾脏科医生 Keith Bellovich、CTO Tom Hawkes、首席增长官 Michele Paige、首席临床官 Sumair Akhtar、总法律顾问 Jon
              Kweller、首席人力官 Dave Thornton，以及首席精算师 Amit Trivedi。2025 年 4 月高管团队扩容尤其值得注意：Marchetti 来自 CarelonRx
              等大型管理式医疗和服务方网络场景，Browne 的背景横跨质量、风险调整、疾病管理和 Optum 级别的人群健康。这说明 Strive 正有意识地补进既懂专科照护交付、又懂支付方式运营系统的领导者。


              治理仍然只部分透明，因为 Strive 是私营公司，所审阅页面没有发布完整董事会名单。不过，仍能看到几个信号。Riopelle 已获得区域和全国认可，包括 Denver Business Journal 和 EY
              的荣誉；Fierce Healthcare 报道称，NANI 在 2021
              年与风险投资方一起进行了股权投资，说明除了标准客户合同，公司还有战略伙伴协同。主要尽调保留项是：公开来源能看出强执行班底，却不足以判断董事会独立性、委员会结构或创始人投票控制，从而无法有把握评估治理严谨度。
