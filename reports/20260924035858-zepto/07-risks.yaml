- dimension: unverifiedSource
  reason: This refresh uses prefetched cache evidence whose URLs are not all recorded in the local fetch log trail.
chapter:
  number: 7
  title: Risks
  summary: Zepto's risks cluster around profitability, regulation, execution quality, and dependency on an increasingly complex delivery stack; the cache shows real scale, but it also shows where the model is under stress.
sections:
- id: regulatory-and-governance-risk
  title: Regulatory and governance risk
  body: 'The public evidence set contains enough friction to treat Zepto as a real diligence risk, not just a high-growth story. TechCrunch says the IPO filing disclosed summonses from India''s Enforcement Directorate around foreign investments and shareholding structure, while other sources keep the governance picture incomplete. The company is not in crisis, but the file clearly shows that legal and governance visibility is still only partial.


    That matters because the company is trying to move from private growth mode to public accountability at the same time that it is still refining its capital structure. The cache also shows critics pointing to pricing practices and dark-pattern concerns, which can become a customer-protection or reputational issue even if they do not immediately become a hard legal blocker. The right conclusion is not that Zepto is impaired; it is that the listing path adds a layer of scrutiny that the current public record does not fully resolve.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
- id: operational-risk
  title: Operational and quality risk
  body: 'The operational risks are more immediate. The Economic Times report on Zepto Cafe describes a real staffing and sourcing problem, and the broader technical case studies show how much the company depends on tightly coordinated search, inventory, and dispatch layers. Once the network is large, even a small operational miss can become visible in customer service, delivery times, or stock quality.


    That is why the report treats Cafe, peak-hour fulfilment, and service reliability as first-class risks rather than footnotes. Zepto has already proven that it can scale demand; the harder question is whether it can keep the promise intact when the system is under load, when staff are scarce, or when suppliers delay product flows. The best evidence in the cache says this is not a hypothetical issue. It is already happening in at least one customer-facing surface.'
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
- id: dependency-risk
  title: Partner and dependency risk
  body: 'Zepto also depends on partners and platforms that it does not fully control. Its cloud and data stack is increasingly sophisticated, its delivery promise depends on gig workers and local supply chains, and its monetization model depends on brands that are willing to pay for visibility and repeat orders. That dependency is normal for quick commerce, but it means the company cannot simply ship code and assume the business model is insulated.


    The valuation reset adds one more wrinkle. A lower mark can help the equity story, but it also makes execution expectations more demanding because the company must now justify itself on a more realistic base. In other words, the risk is not only that the company underperforms. It is that a crowded market, a complex operating stack, and a partially opaque control structure all interact at once, making any single misstep more consequential than it would be for a simpler consumer app.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
