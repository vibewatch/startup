- id: TI002
  title: Pricing / monetization table
  columns:
  - Lever
  - Observed posture
  - Value to Zepto
  - Risk or caveat
  rows:
  - - Low-fee thresholds
    - App-store listing stresses low or no delivery fees above minimum baskets
    - Drives conversion and repeat orders
    - Easy for competitors to match
  - - Membership / club offers
    - Invite-only or paid membership products appear in public commentary
    - Improves retention and frequency
    - Needs enough savings to feel sticky
  - - Retail media
    - Sponsored placements and supplier-funded visibility
    - High-margin incremental revenue
    - Ad adoption can lag operations
  - - Cafe monetization
    - Prepared food and beverages add a second basket type
    - Raises order frequency
    - Operationally more complex
  - - Service monetization
    - Warehousing and logistics layers can be monetized separately
    - Turns cost centers into services
    - Still tied to throughput and utilization
  notes: Pricing moves quickly in quick commerce, so the table focuses on persistent monetization levers rather than one-off promotional prices.
  claimRefs:
  - CI001
  - CI007
  - CI008
  - CI009
