chapter:
  number: 6
  title: Customers
  summary: Zepto's customer base is primarily urban, time-sensitive, and frequency-driven, but the platform is also learning to monetize brands and repeat shoppers through membership, Cafe, and broad assortment.
sections:
- id: customer-base
  title: Who uses Zepto and why
  body: 'The customer story in the cache is not simply "people who buy groceries online." It is more specific than that. Zepto wins when the shopper is time-constrained, urban, and willing to pay for immediacy or convenience. That includes busy households, young professionals, caregivers, and impulse buyers who value speed enough to trade off against a slightly more curated assortment or a smaller basket.


    The app-store listing, the LinkedIn profile, and the case-study sources all point in the same direction: the customer is buying minutes, not just products. That is why the company can add Cafe, fashion, home goods, and electronics without losing the core use case. The expansion is meaningful because it increases frequency and basket size, but the underlying buyer remains the same: a person or household that prefers immediate fulfillment over a scheduled delivery model.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
- id: adoption-trajectory
  title: Customer growth and adoption trajectory
  body: 'The adoption evidence is strong enough to show product-market fit, even if it is not strong enough to pin down exact retention curves. Public descriptions point to 50+ cities, 45,000+ products, 1,139 stores, 47.97 million annual transacting users, and roughly 1.75 million orders per day on average in FY26. Those are not vanity numbers; they imply a service that is being used frequently enough to justify a dense operating network.


    The reason this matters is that customer growth in quick commerce is not the same as app downloads. The app can be attractive because it promises speed, but repeat usage only happens when the basket arrives reliably, the stock is there, and the delivery promise holds up often enough to become habitual. Zepto''s growth trajectory suggests that it has crossed that threshold in its main urban markets, but the public cache still leaves the detailed retention math open.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU010
- id: proof-points-and-gaps
  title: Brand proof points and remaining customer gaps
  body: 'The customer proof is not limited to end users. Zepto also has a visible brand and merchant layer: the app listing names a large set of FMCG and consumer brands, and several case-study sources describe the company as increasingly valuable to brands that want rapid local distribution and measurable visibility. That matters because it turns the customer relationship into a two-sided system: consumers create traffic, and brands pay for access to that traffic.


    The remaining gap is that the cache does not disclose the detailed customer retention metrics that would let us separate a genuinely sticky user base from a heavily promoted one. It is clear that Zepto has a large audience and that the promise resonates, but the exact churn, repeat-frequency, and cohort-level economics are still obscured. The report therefore treats user count and order count as strong evidence of scale, while still preserving a diligence gap around the deeper customer-quality metrics.'
  claimRefs:
  - CU008
  - CU009
  - CU011
  - CU012
