companyProfile:
  summary: >-
    Zepto is India's quick-commerce leader, built around a dark-store network that delivers groceries and convenience
    goods in minutes and now extends into Cafe, retail media, and broader everyday commerce. Founded in 2021 by Aadit
    Palicha and Kaivalya Vohra, the company has grown into a large pre-IPO platform with a still-partial governance
    picture and a valuation that reset to $4.5B in 2026 after peaking at $7B in 2025.
