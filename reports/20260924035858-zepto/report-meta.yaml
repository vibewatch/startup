  topStrengths:
    - Real operating scale with tens of millions of annual transacting users and more than 1,100 stores
    - Improving monetization stack through ads, services, and Cafe rather than a single grocery margin line
    - Fresh valuation reset that is friendlier than the 2025 peak
    - Deep repeat-backer support from large growth investors
  topRisks:
    - Losses and burn remain material, so profitability is not solved
    - Governance, voting-control, and debt details are still only partially visible
    - Competition is now parent-backed and capital intensive
    - Cafe and other operations can become fragile under staffing or sourcing pressure
  unresolvedGaps:
