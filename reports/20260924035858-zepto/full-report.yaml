  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization stack
        blocks:
          - type: paragraph
            body: >-
              Zepto's revenue model has become broader than simple grocery gross margin. The cache shows a mix of
              product sales, delivery-related economics, retail media or advertising, platform services, and Zepto Cafe.
              That matters because the business is trying to pull several levers at once: grow basket size, increase
              frequency, sell attention to brands, and monetize the same customer traffic in more than one way.


              The public app and profile pages reinforce that shift. Zepto is no longer just a grocery runner; it is
              becoming an everyday convenience platform with category breadth and brand-funded monetization layered on
              top. From a diligence perspective, the important point is that the company is now partially insulated from
              pure transaction margin because it can earn from suppliers and advertisers as well as consumers. That does
              not make the business profitable, but it does make the revenue stack more resilient than a one-line
              delivery fee model.
            claimRefs:
              - CI001
              - CI004
              - CI007
              - CI008
      - number: '4.2'
        title: Funding path and valuation resets
        blocks:
          - type: paragraph
            body: >-
              The financing path remains one of the clearest signals in the file. Clay, Tracxn, and TechCrunch all show
              a company that has raised more than $2B in disclosed capital through a long sequence of late-stage rounds.
              The headline events are easy to track: the $340M Series G at a $5B valuation, the $450M Series H at a $7B
              valuation, and then the August 2026 pre-IPO placement that reset the public valuation narrative to about
              $4.5B.


              That sequence is not contradictory; it reflects a company that has grown into a more mature capital
              structure while negotiating the tradeoff between private-market marks and listing readiness. The valuation
              reset is especially important for the current thesis because it changes the upside math even if operating
              performance remains strong. A lower valuation with higher scale is usually easier to underwrite than the
              reverse, which is why the current report treats valuation as improved versus the 2025 peak, even though
              the business is still very capital intensive.
            claimRefs:
              - CI002
              - CI003
              - CI005
              - CI011
      - number: '4.3'
        title: Unit economics and remaining gaps
        blocks:
          - type: paragraph
            body: >-
              The problem is that scale has not yet translated into clean profitability. The cached evidence points to a
              large operating base, more than 47 million transacting users, 640 million-plus orders, and heavy losses
              that remain material in the latest filing-era summaries. The company is clearly improving throughput and
              monetization, but it still burns enough capital that the exact path to durable margin expansion remains
              the main diligence question.


              One reason the report stays cautious is that public sources do not agree on the exact FY26 revenue figure.
              Some summaries are closer to the low-$2B range, while others cite a lower INR amount. The right way to
              handle that disagreement is to treat revenue as a range and preserve the discrepancy as an evidence gap
              rather than forcing a single false number. The same logic applies to cohort-level contribution margins and
              debt terms: they are important, but they are not yet publicly visible enough to be presented as settled
              facts.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI009
              - CI010
              - CI012
