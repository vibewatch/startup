        title: Exhibits
        blocks:
          - type: callout
            title: Category scale is real
            body: >-
              The refreshed cache shows a business that has already crossed the threshold from startup story to
              operating system: store density, annual transacting users, repeat financing, and IPO preparation all point
              in the same direction.
            calloutType: strength
            claimRefs:
              - CO006
