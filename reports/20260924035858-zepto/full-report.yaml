  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: What market Zepto actually serves
        blocks:
          - type: paragraph
            body: >-
              Zepto is not best understood as a generic e-commerce marketplace. The evidence in the cache points to a
              narrower Indian quick-commerce market built around immediate grocery and convenience demand in dense urban
              neighborhoods. That market boundary matters because it clarifies what Zepto is really competing against:
              kirana stores, instant delivery apps, scheduled grocery services, and large e-commerce platforms that are
              trying to move closer to the same use case.


              The app-store listing and the third-party case studies make the same point in different language. Zepto's
              promise is minutes, not days; a large part of the customer value proposition is saving time and avoiding a
              second trip to the store. That is why the company can expand from groceries into cafe, electronics,
              apparel, and household essentials without abandoning the underlying market definition. Those categories
              are adjacencies that deepen basket size and frequency, not a signal that the market has become generic
              retail. The right market boundary is therefore speed-enabled urban convenience, not total grocery retail.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              The cached evidence is intentionally noisy on size, which is exactly why this market should be treated as
              a sizing range rather than a single number. TechCrunch cites Morgan Stanley's view that quick commerce
              could reach $42B by 2030, while Bernstein's note puts the same market at $100B over a decade. Elsewhere,
              market-overview sources keep pointing to very low online grocery penetration and to a still-fragmented
              retail base. The spread between those figures is not a bug; it is the reason this market remains
              investable but hard to benchmark cleanly.


              Buyer segmentation is also more layered than a consumer-only lens implies. The direct consumer is the
              shopper using Zepto for speed and convenience. The payer can be the same consumer, but brand partners and
              advertisers increasingly matter because the company is layering retail media and category expansion on top
              of the base grocery transaction. For diligence, that means Zepto sits at the intersection of household
              convenience spending, impulse spending, and brand-funded attention, which is more nuanced than simple
              grocery GMV math.
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: Drivers, constraints, and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The adoption drivers in this market are easy to name and hard to execute: urban density, time pressure,
              reliable inventory visibility, and a sufficiently dense store network to keep delivery times inside a few
              minutes. When those conditions line up, the model can win repeat behavior quickly because the customer is
              buying convenience, not just products. The same mechanism also explains why quick commerce grows faster in
              major cities than in low-density catchments.


              The constraints are equally clear. Unit economics tighten when density falls, assortment widens too
              quickly, or service quality slips under peak loads. That is why the market still requires a lot of
              capital, even after it has proven demand. The unresolved question is not whether the market exists; it
              does. The unresolved question is how much of the market Zepto can economically own, city by city, before
              margins, competition, and marketing intensity compress returns. That exact SAM/SOM answer is still missing
              from the public cache, so the report preserves it as a diligence gap rather than guessing.
            claimRefs:
              - CM007
              - CM008
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Sizing is a range, not a single number
            body: >-
              The cache gives enough evidence to conclude that the market is real and still early, but not enough to
              pretend there is one universally accepted TAM. That is why range thinking is the right model here.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM012
          - type: callout
            title: The hardest question is share, not demand
            body: >-
              Demand exists; the diligence question is how much of that demand Zepto can capture profitably once
              density, marketing, and competitor responses are fully priced in.
