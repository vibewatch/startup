  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              Zepto's consumer product is broader than a grocery app, but the key product idea is still the same: make
              it easy to get high-frequency household items in minutes. The app-store listing, LinkedIn page, and case
              studies all describe a surface that includes groceries, fresh produce, beverages, personal care,
              electronics, fashion, home items, and Zepto Cafe. That breadth matters because the company is not trying
              to own one basket; it is trying to own the moment when a customer wants something quickly.


              That also means the product workflow is intentionally simple from the user's perspective and highly
              complex behind the scenes. Search, browse, inventory visibility, payment, and last-mile allocation all
              have to feel instant even though the underlying data moves through several operational layers. The user
              experience is the same on every screen: find the item, see that it is available, pay quickly, and get the
              order delivered before the user has a chance to switch apps. This chapter therefore treats product and
              infrastructure as one system rather than two separate topics.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Architecture and data stores
        blocks:
          - type: paragraph
            body: >-
              The AWS case studies are the clearest technical sources in the cache. They describe a progression from a
              monolithic storefront and Aurora-backed transactional system toward a more distributed architecture using
              DynamoDB for order-state handling, OpenSearch Optimized instances for search, and a broader AWS stack that
              includes EKS, MSK, S3, and streaming-driven microservices. In other words, the company has been treating
              scale as a database and infrastructure problem, not just a hiring problem.


              MongoDB and other technical writeups reinforce the same picture: Zepto's search and catalog layers needed
              lower latency, and the company pursued architecture changes to get it. The important diligence point is
              not that the stack is exotic; it is that it is intentionally layered for a workload where inventory,
              price, and search freshness change all the time. That kind of workload is expensive to run and expensive
              to simplify, which is why the technology chapter is inseparable from the financial and risk chapters.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: What the stack means for diligence
        blocks:
          - type: paragraph
            body: >-
              The technical takeaway is that Zepto has already solved the obvious startup problem and moved on to the
              harder one: keeping a large, high-velocity commerce system responsive while the business keeps adding new
              surfaces. The company cannot afford slow search, stale stock data, or payment/order-state confusion when
              it is processing millions of orders and trying to maintain a minutes-level promise. That is why the
              engineering articles talk about latency reduction, throughput gains, and cost savings rather than about
              novelty.


              This also tells you something about defensibility. Competitors can copy the app design and the category
              mix, but copying a tuned search stack, a store-level inventory system, and a migration path away from
              monolithic bottlenecks takes time and operational discipline. The report does not treat technology as a
              moat by itself, because every software moat erodes if the company cannot keep shipping. But it does treat
              technology as a real operational edge, especially because the cache shows Zepto continuing to invest in it
              while the market around it gets more crowded.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
