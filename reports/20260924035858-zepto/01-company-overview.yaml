chapter:
  number: 1
  title: Company Overview
  summary: 'Zepto remains India''s scaled quick-commerce leader: a Bengaluru-based, dark-store-driven grocery and convenience platform that has kept growing through 2026, but with valuation reset, governance opacity, and cash-intensive execution still shaping the diligence case.'
sections:
- id: identity-and-product
  title: Identity, product, and footprint
  body: 'Zepto is an Indian quick-commerce company built around a dark-store model rather than a traditional marketplace model. The latest cached sources consistently describe it as a platform for groceries, fresh produce, household essentials, personal care, electronics, apparel, and Zepto Cafe, with the promise that many everyday items can arrive in minutes. That positioning matters because it explains why the company keeps widening assortment while still treating speed as the core value proposition.


    The company''s public identity has also stabilized around Bengaluru, even though some older materials still reference Mumbai as the origin point. The LinkedIn profile, Wikipedia page, and Tracxn profile all anchor the business in India, founded in 2021 by Aadit Palicha and Kaivalya Vohra. The operational footprint is no longer a startup pilot: public descriptions now refer to 50+ cities, 45,000+ products, and a network of more than 1,000 stores. For diligence purposes, that combination of urban density and assortment breadth is the core fact pattern behind every later chapter in this report.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO009
- id: leadership-and-governance
  title: Leadership and governance
  body: 'The founders remain the most visible human capital in the company. Public profiles still identify Aadit Palicha and Kaivalya Vohra as the founding pair, while the Tracxn company page also surfaces a six-member board that includes founders, a finance leader, and two independent directors. That is useful because Zepto is already large enough that governance, not just growth, is now part of the investment story.


    At the same time, the public record is incomplete. The exact board voting structure, the latest shareholder agreements, and any founder control arrangements are not disclosed in the cached sources. Public materials also give mixed signals on day-to-day leadership: some sources name Aadit Palicha as CEO, while others emphasize the founders collectively. The safest conclusion is not that the leadership picture is unclear, but that the public evidence only supports a partial governance map. That is enough for a refreshed report, but not enough to pretend the cap table or control structure is fully visible.'
  claimRefs:
  - CO001
  - CO004
  - CO007
  - CO012
- id: funding-and-scale
  title: Funding, valuation, and operating scale
  body: 'Zepto''s capital stack remains one of the most obvious strengths in the file. Clay and Tracxn both show cumulative funding in the low-$2.3B range, and the latest disclosed valuation moved from $7B in October 2025 to a lower $4.5B pre-IPO placement in August 2026. That reset is not a failure signal by itself; it is more consistent with a company that is trying to widen domestic ownership while keeping the path to listing open.


    The scale figures are equally important. TechCrunch''s 2026 filing-era coverage and the cached IPO-platform summary point to roughly 47.97 million annual transacting users, 1,139 stores, and more than 640 million orders in FY26. Those numbers matter because they anchor the business in a real operating system rather than a narrative-only growth story. In practical terms, Zepto is now large enough that store density, gross margin progression, and the cost of keeping orders on time are the main diligence variables, not whether the model can attract demand at all.'
  claimRefs:
  - CO005
  - CO006
  - CO008
  - CO009
  - CO010
