evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A primary source or a current employee roster that states exact full-time headcount.
    whyItMatters: The public profile ranges are wide enough that headcount remains a useful but not decisive diligence metric.
    diligencePath: Wait for the next statutory filing or a current company disclosure that lists total employees.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Shareholder agreement, board voting rights, and any founder control arrangements.
    whyItMatters: >-
      Control structure determines how much post-IPO strategic flexibility the founders and institutional investors
      actually retain.
    diligencePath: Review the final listing documents and any updated cap-table disclosure before underwriting the IPO story.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: A city-level addressable-market model or internal penetration analysis.
    whyItMatters: >-
      Without city-level SAM and SOM, the report can size the market only by lens rather than by actual share
      opportunity.
    diligencePath: Build a city-by-city cohort model from store density, basket frequency, and local population data.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: share-gap
    missingEvidence: A city-by-city competitor share map or transaction-level market-share dataset.
    whyItMatters: Without local share data, the report can only talk about competitive positioning, not exact dominance.
    diligencePath: Use a third-party market-tracking dataset or a store-level census for the top Indian metros.
    relatedQuestionRefs:
      - QP007
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: unit-economics-gap
    missingEvidence: A cohort-level contribution-margin schedule and formal debt / credit-facility disclosure.
    whyItMatters: >-
      Without these figures the report can assess scale and monetization, but not the exact path to durable
      profitability.
    diligencePath: >-
      Wait for the final IPO filing package or a lender disclosure that separates service economics from commerce gross
      margin.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
