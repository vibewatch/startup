- calloutType: insight
  title: Sizing is a range, not a single number
  body: The cache gives enough evidence to conclude that the market is real and still early, but not enough to pretend there is one universally accepted TAM. That is why range thinking is the right model here.
  claimRefs:
  - CM005
  - CM006
  - CM012
- calloutType: risk
  title: The hardest question is share, not demand
  body: Demand exists; the diligence question is how much of that demand Zepto can capture profitably once density, marketing, and competitor responses are fully priced in.
