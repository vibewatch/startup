- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Model
  - Current strength
  - Zepto implication
  rows:
  - - Blinkit
    - Quick commerce inside a listed platform
    - Deep parent balance sheet and broad urban reach
    - Pressure on price and city expansion
  - - Swiggy Instamart
    - Quick commerce inside a super-app
    - Cross-sell and user traffic from the parent app
    - Threatens share in urban basket frequency
  - - BigBasket BB Now
    - Grocery-led quick commerce
    - Established grocery brand and parent resources
    - Competes on trust and assortment
  - - Amazon / Flipkart minutes
    - Marketplace-led quick commerce
    - Huge consumer traffic and logistics muscle
    - Can compress any easy category advantage
  - - Zepto
    - Standalone quick commerce
    - Fast execution and store density focus
    - Needs speed plus margin discipline to hold share
  notes: This table is a strategic competitor profile, not a market-share census; the rows summarize the strongest public comparison set visible in the cached sources.
