  - BigBasket / Amazon / Flipkart
  rows:
  - - Ten-minute promise
    - Core brand promise
    - Strong but not unique
    - Imitating more aggressively
  - - Dark-store density
    - Primary operating moat
    - Also heavily funded
    - Building or expanding
  - - Assortment breadth
    - Groceries + Cafe + non-grocery
    - Broadening categories
    - Broad catalogs, weaker instant focus
  - - Retail media / ads
    - Growing monetization layer
    - Emerging across peers
    - More developed on parent platforms
  - - Engineering depth
    - Search, inventory, and routing work visible
    - Comparable scale work
    - Often more distributed architecture
  - - Standalone focus
    - High
    - Lower because of parent priorities
    - Lower because of broader businesses
  notes: Capability comparisons are directional and derived from the public cache rather than a formally benchmarked feature checklist.
  claimRefs:
  - CP005
  - CP006
  - CP007
  - CP008
  - CP010
- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Dimension
  - Zepto
  - Peers
  - Diligence takeaway
  rows:
  - - Delivery-fee posture
    - App-store listing emphasizes low-fee / no-fee thresholds
    - Peers also push free-delivery and promo thresholds
    - Price parity is easy to copy
  - - Membership / loyalty
    - Zepto Club and related offers
    - Super-app and grocery competitors also use memberships
    - Retention tools matter more than headline fees
  - - Promo intensity
    - High when defending frequency
    - Equally high in category-wide battles
    - Margins can compress quickly
  - - Basket expansion
    - Cafe and non-grocery categories
    - Some competitors also extend into adjacent needs
    - Adjacency is useful but not unique
  - - Brand monetization
    - Retail media and partner funding
    - Also growing among larger platforms
    - Second-order monetization is important for margin
  notes: The table focuses on packaging and monetization posture because exact consumer pricing changes frequently and is not fully stable in the cache.
