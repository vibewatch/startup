chapter:
  number: 8
  title: Valuation
  summary: Zepto's valuation case improved after the 2026 reset, but the right call still depends on whether the company can convert scale into cleaner margins before the IPO narrative hardens.
sections:
- id: thesis
  title: Bull case and valuation support
  body: 'The bull case is straightforward: Zepto has already scaled to a level where the market cannot dismiss it as a tiny venture experiment, and the valuation reset gives new investors a more reasonable entry point than the 2025 peak. Clay, Tracxn, and Multiples all show a company with multi-billion-dollar backing, a real operating footprint, and a current valuation that is lower than the previous private-market mark. That combination is usually what makes an IPO story survive the transition from narrative to underwriting.


    The support for that thesis is not only financial. The company''s app, store network, and customer metrics all point to a business that has genuine demand and repeat usage. If management can keep improving monetization through ads, services, and Cafe while keeping fulfillment stable, the equity case can still look attractive relative to the growth rate. In other words, the bull case is not that Zepto is cheap in isolation; it is that the company may now be cheap enough relative to its scale and operating momentum for the market to keep believing in it.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV007
- id: anti-thesis
  title: What keeps the valuation from being easy
  body: 'The anti-thesis is equally clear. Losses remain material, some public sources disagree on the exact revenue figure, and the company still needs to prove that more scale turns into more margin rather than only more growth. The valuation reset helps, but it does not answer the core question: how much of the operating engine can be monetized before category competition and logistics cost erase the upside.


    Governance and regulatory opacity also matter for valuation because they influence the discount rate. When a company is heading toward a public listing with an ongoing regulatory inquiry, incomplete voting-control visibility, and a partially opaque cap table, investors usually ask for a wider margin of safety. That is why the report does not treat the 2026 valuation reset as a simple upgrade. It treats it as a better starting point for underwriting, but still one that has to clear execution and disclosure hurdles before it deserves a premium.'
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV010
- id: scenarios-and-call
  title: Scenario framing and recommendation
  body: 'A practical way to think about Zepto is in scenarios. In the bull case, margins improve as ads, services, and Cafe become more meaningful, and the market gives the company credit for scale plus monetization. In the base case, growth remains strong but the valuation settles around a fair multiple because losses and competition stay visible. In the bear case, the company has to spend too much on promotions, compliance, and operations, and the public-market narrative compresses quickly.


    The current evidence set is consistent with a cautious positive call rather than an aggressive one. The valuation is no longer stretched the way it looked at the 2025 peak, but the company still has to prove itself on profitability and governance. That is why the final recommendation lands on buy rather than strong-buy, with medium confidence and a fair valuation stance. The upside is real; the margin of error is not yet huge enough to pretend the underwriting is easy.'
  claimRefs:
  - CV007
  - CV008
  - CV009
  - CV011
  - CV012
