  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁在使用 Zepto 及其动因
        blocks:
          - type: paragraph
            body: >-
              留存资料中的客群画像绝非宽泛的“线上买菜群体”，其定位远比这更加具体。只有当消费者身处都市、时间紧迫，并愿意为即时性或便利性付费时，Zepto
              才能打赢。这涵盖了忙碌家庭、年轻白领、看护照料者以及冲动型买家，他们对速度的渴求足以抵消选品范围稍窄或单次购物篮偏小的不便。


              应用商店详情页、LinkedIn 主页及案例来源皆指向同一点：用户买的是时间，而不单是商品。这也是公司能在不脱离核心场景的前提下切入 Cafe、服饰、家居百货和 3C
              数码的原因。品类扩张能拉动购买频次与客单价，意义重大；但底层买家始终如一：即相比定时履约模式更青睐即刻送达的个人或家庭。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: 用户增长与渗透轨迹
        blocks:
          - type: paragraph
            body: >-
              业务渗透数据已足够印证产品契合市场需求（PMF），即便它尚不足以准确勾勒精细的留存曲线。公开资料明确提及覆盖 50+ 座城市、45,000+ 款商品、1,139 家门店、47.97 million
              年度交易用户，以及 FY26 日均约 1.75 million 笔订单。这些并非虚荣指标，它们证明该服务的消费频次足以支撑起一张高密度的运营网络。


              这之所以关键，在于即时零售的用户增长不能等同于 App 下载量。凭借极速送达的口号吸引下载不难，但只有在货品送达靠谱、现货供应稳定、履约承诺屡屡兑现进而养成习惯时，复购才会发生。Zepto
              的增长曲线表明它已在核心城市市场跨过了这道门槛，但公开留存资料仍未给出精细的留存测算数据。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
      - number: '6.3'
        title: 品牌佐证与未解的客群数据缺口
        blocks:
          - type: paragraph
            body: >-
              客群维度的有力证据不仅限于终端消费者。Zepto 还构建起清晰的品牌与商家阵列：应用页面列出了大量快消（FMCG）及大众消费品牌，数篇案例研究也指出，品牌方渴望获得本地快速分销与可量化曝光，Zepto
              的渠道价值因而日益凸显。这催生出双边协同效应：消费者提供活跃流量，品牌方则为触达流量慷慨买单。


              未解缺口在于，留存资料未披露详细的用户留存指标，导致外界难以将真实具备黏性的用户与重度补贴促成的羊毛党剥离开来。Zepto
              坐拥庞大客群且价值主张深入人心已是不争事实，但流失率、复购频次与分群维度的微观经济模型依然缺乏透明度。因此，报告将用户数与订单量视作印证规模的坚实依据，同时在更深层的客群质量指标上恪守尽调缺口。
            claimRefs:
              - CU008
              - CU009
              - CU011
              - CU012
      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 用户痛点真实且反复出现
            body: Zepto 解决的不是假想的便利伪需求；留存数据揭示出一种高频复现的城市痛点，其体量庞大到足以支撑起密集的仓配物流体系。
            calloutType: strength
