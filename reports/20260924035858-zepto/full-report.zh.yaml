      - - 乐观情景
        - 广告与增值服务扩张速度跑赢成本增速
        - 具备吸引力
        - 买入 / 加仓
      - - 基准情景
        - 保持高增长态势，利润率缓步改善
        - 合理
        - 买入 / 持有
      - - 悲观情景
        - 高额补贴促销不减，亏损压力依然沉重
        - 偏高
        - 观察 / 回避
      - - 乐观情景敏感性分析
        - 头部核心城市品类份额进一步拉大
        - 打开溢价估值空间
        - 享有向上期权价值
      - - 基准情景敏感性分析
        - IPO 落地且股权稀释可控
        - 均衡
        - 上市后继续持有
      - - 悲观情景敏感性分析
        - 监管风波或执行失误进一步放大估值折价
        - 估值倍数面临下修
        - 降仓避险
    notes: 情景测算表采用定性估值表述，原因在于缓存数据未提供公认一致的二级市场可比公司组合。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV011
