  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现栈
        blocks:
          - type: paragraph
            body: >-
              Zepto 的收入模式已拓展至单纯的生鲜进销差价之外。留存记录显示其收入由商品销售、配送端费用、零售媒体或广告、平台服务费以及 Zepto Cafe
              共同构成。这一转变颇具战略意义，因为业务正试图同时撬动多根杠杆：做大客单价、提高复购频次、向品牌方销售用户注意力，并用多元途径盘活同一批客流的价值。


              公开的应用端与公司档案进一步印证了这层演变。Zepto
              已不再只是生鲜跑腿工具，而是正转变为兼具选品深度和品牌赞助变现能力的日常便利平台。站在尽调视角，核心要点在于公司摆脱了对纯交易毛利率的完全依赖，能够从供应商与广告主以及消费者端同步获利。这虽未直接带来盈利，但相比单薄依靠配送费的模式，其收入底盘显然更具抗风险能力。
            claimRefs:
              - CI001
              - CI004
              - CI007
              - CI008
      - number: '4.2'
        title: 融资路径与估值重置
        blocks:
          - type: paragraph
            body: >-
              融资历程仍是案头材料中最清晰的信号之一。Clay、Tracxn 与 TechCrunch 均显示，公司凭借密集的后期融资，已累计斩获超过 $2B 披露资本。关键节点历历在目：按 $5B 估值完成的 $340M G
              轮融资、按 $7B 估值完成的 $450M H 轮融资，以及 2026 年 8 月将公开估值锚点重置为约 $4.5B 的 Pre-IPO 配售。


              这一连串事件并不矛盾，它折射出一边走向成熟资本结构、一边在私募估值预期与上市筹备之间平衡取舍的企业状态。这次估值重置对当下的投资逻辑尤为关键，因为即便经营表现保持强劲，它也重塑了潜在上涨空间的测算基准。在估值更低的同时拥有更高规模，通常比相反情况更容易通过投资立项核准；因此本报告认为其估值相较
              2025 年高点有所改善，即便这门生意依然高度依赖资金投入。
            claimRefs:
              - CI002
              - CI003
              - CI005
              - CI011
      - number: '4.3'
        title: 单均经济模型（UE）与尚存缺口
        blocks:
          - type: paragraph
            body: >-
              症结在于规模尚未转化为清晰的盈利成果。留存证据勾勒出庞大的运营底盘：超过 47 million 交易用户、640 million
              起以上订单，以及最新上市申报期摘要中依然显眼的巨额亏损。公司在吞吐量与变现效率上确有提升，但烧钱规模依然使得毛利率持久扩张的具体路径成为核心尽调关切。


              报告保持审慎的另一原因在于，公开来源对 FY26 具体收入数字存在分歧。部分测算倾向于 $2B
              低位区间，另有来源则给出更低的印度卢比（INR）金额。妥善应对该分歧的办法是将收入视作区间，把口径冲突作为证据缺口保留，而非强行拼凑一个失真的单一数字。同样的逻辑也适用于用户分群贡献利润率以及债务条款：这些指标非常关键，但目前公开透明度不足，尚无法视作定论。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI009
              - CI010
              - CI012
