  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Zepto 究竟服务什么市场
        blocks:
          - type: paragraph
            body: >-
              理解 Zepto 不能套用宽泛的综合电商平台视角。留存证据表明，它切入的是一个更聚焦的印度即时零售市场，紧扣高密度城市社区对生鲜百货和便利商品的即时需求。界定这一市场边界十分关键，因为它厘清了 Zepto
              的真正竞争对手：社区杂货店（kirana）、即时配送应用、定时生鲜配送服务，以及试图靠拢该场景的传统大型电商平台。


              应用商店详情页与第三方案例研究用不同措辞表达了同一要点：Zepto 的承诺是分钟级送达，而非以天计算；客户价值主张很大程度上来自节省时间与免除跑第二趟商店的麻烦。这也解释了为何公司能从生鲜百货横向拓展至
              Cafe、3C
              数码、服饰和家居日用，却并未脱离原有的市场定义。这些品类是拉升客单价与购买频次的相邻品类，并不意味着该市场已泛化为普通零售。因此，更准确的市场边界是由速度驱动的城市即时便利零售，而非泛生鲜零售总额。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场测算视角与买方客群细分
        blocks:
          - type: paragraph
            body: >-
              留存证据在市场规模上充斥着各方口径，这恰恰说明该市场应当用区间而非单一数值来衡量。TechCrunch 引用 Morgan Stanley 的预测，称即时零售市场到 2030 年规模可能达到
              $42B；Bernstein 的研报则测算同一市场在十年内可达
              $100B。在其他渠道，行业概览资料不断指出线上生鲜渗透率极低、零售底盘依然高度分散。这些数字间的宽幅差异并非数据缺陷，恰恰解释了为何该赛道极具投资吸引力却难以标准化对标。


              买方客群细分同样比单纯从消费者切入更加立体。直接消费者是看重速度与便利而使用 Zepto
              的购物人群；付款方可以是该消费者，但品牌合作伙伴与广告主正变得愈发重要，因为公司在基础生鲜交易之上叠加了零售媒体和品类扩张。落实到尽调，Zepto
              恰好卡在家庭日常便利支出、冲动消费以及品牌付费注意力这三者的交汇点，这远比单纯做生鲜 GMV 算术更为丰富。
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: 驱动因素、制约瓶颈与未决的规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              该市场的渗透驱动因素容易总结却极难落地：城市人口密集度、时间紧迫感、可靠的实时库存可视性，以及足够密集的门店网络以保证几分钟内送达。一旦这些条件凑齐，该模式就能迅速拉动复购，因为客户买的是便利而不仅是商品。同样的逻辑也解释了为何即时零售在中心大城市的增速远快于低密度外围区域。


              制约瓶颈同样显而易见。一旦密度下降、品类扩张过快或在高峰负荷下服务质量下滑，单均经济模型便会迅速收紧。正因如此，即使需求已被充分验证，该市场依然极其消耗资本。尚未化解的核心疑问不在于市场是否存在——答案显然是肯定的；悬而未决的问题在于，在利润率受压、竞争加剧和营销白热化挤压回报之前，Zepto
              究竟能在多大程度上按城市逐一拿下经济上跑得通的份额。这一精确的 SAM/SOM 答案在公开留存中依然缺失，因此报告将其保留为尽调缺口，而非主观臆测。
            claimRefs:
              - CM007
              - CM008
              - CM012
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 市场规模是个区间，而非单一数值
            body: 留存数据足以证明该市场真实存在且处于早期，但不足以支撑任何公认的单一 TAM。正因如此，区间推演才是合理的分析模型。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM012
          - type: callout
            title: 最难的命题是份额，而非需求
            body: 需求毋庸置疑；尽调的核心命题在于，一旦将网点密度、营销开支以及竞对反击充分计入成本，Zepto 究竟能盈利性地拿下多少需求份额。
            calloutType: risk
            claimRefs:
