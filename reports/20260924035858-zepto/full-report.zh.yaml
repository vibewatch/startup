companyProfile:
  summary: >-
    Zepto 是印度即时零售领头羊，依托前置仓网络在几分钟内送达生鲜百货与便利商品，目前业务已延伸至 Cafe、零售媒体以及更广泛的日常电商。公司由 Aadit Palicha 与 Kaivalya Vohra 于 2021
    年创立，现已长成大型 Pre-IPO 平台；治理画像仍未完全公开，估值在 2025 年触及 $7B 高点后，于 2026 年重置为 $4.5B。
