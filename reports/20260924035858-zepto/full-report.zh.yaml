  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与用户交互路径
        blocks:
          - type: paragraph
            body: >-
              Zepto 的 C 端产品早已超越纯生鲜软件，但其核心构想始终如一：让用户在数分钟内轻松买到高频家庭用品。应用商店列表、LinkedIn 主页和案例研究共同勾勒出一个横跨生鲜果蔬、酒水饮料、个护美妆、3C
              数码、服饰、家居百货以及 Zepto Cafe 的庞大界面。这一品类跨度非同小可，因为公司的意图并非占据某个特定购物篮，而是垄断用户“急需某物”的即时心智。


              这也决定了其产品逻辑在用户端极尽简明，在后台却极度繁复。搜索、浏览、库存实时呈现、支付结算与最后一公里运力调度，都必须给人以无缝即时的体感，哪怕底层数据流要穿透数个操作层。用户在每个界面上的体验高度一致：找到商品、确认有货、迅速付款，并在用户还来不及切出应用前完成履约送达。因此，本章将产品与基础设施视作同一套系统，而非割裂拆解。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: 系统架构与底层数据存储
        blocks:
          - type: paragraph
            body: >-
              AWS 案例研究是留存数据中最具含金量的技术文献。它们详细记录了系统如何从最初单体式商城及基于 Aurora 的事务系统，演进为借助 DynamoDB 维护订单状态、采用 OpenSearch
              优化型实例支撑搜索，并依托涵盖 EKS、MSK、S3 和流式驱动微服务的更广泛 AWS 技术栈的分散式架构。换句话说，公司始终将规模扩张看作数据库与底层基建工程，而非单纯的人力堆砌。


              MongoDB 等技术专文也印证了同样逻辑：Zepto
              的搜索与目录层急需压降延迟，为此团队坚决重构了架构。尽调关注的核心并不在于技术栈有多猎奇，而在于针对库存、价格与搜索即时性时刻变动的业务负载进行了针对性分层。这类工作负载不仅运行开销高昂，简化难度也极大，这正是技术章节同财务及风险章节密不可分的原因所在。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: 技术栈对尽调的实际指引
        blocks:
          - type: paragraph
            body: >-
              技术维度的核心结论在于，Zepto
              已跨越了初创期的基础瓶颈，转而攻坚更深层次的硬仗：在不断叠加新业务场景的同时，确保庞大而高速运转的交易系统始终敏捷响应。在日均处理数百万级订单且需坚守分钟级承诺的前提下，公司承受不起搜索迟缓、库存数据失真或支付及订单状态错乱的代价。这也是为何工程文章通篇聚焦于时延压降、吞吐量爬坡与成本节省，而非玩弄新概念。


              这也从侧面反映了业务防守壁垒。竞对可以抄袭 UI
              界面和选品组合，但要复制一套精细打磨的搜索栈、仓店级库存体系，并走通摆脱单体架构瓶颈的迁移路径，需要耗费大量时间与执行纪律。报告并未将技术本身孤立视作护城河，毕竟若无法持续交付迭代，任何软件壁垒都会瓦解；但在周边战火愈演愈烈之际，留存资料证实
              Zepto 仍在持续重投技术，因此技术理应被视作一项货真价实的运营优势。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
