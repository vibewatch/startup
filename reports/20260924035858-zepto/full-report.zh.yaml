  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与治理风险
        blocks:
          - type: paragraph
            body: >-
              公开证据库中积累的负面杂音，已足以让人将 Zepto 视作货真价实的尽调风险点，而非一味沉浸在高增长叙事中。TechCrunch 报道称，IPO 招股材料披露了印度执法局（Enforcement
              Directorate）就外商投资及股权架构发出的传票，而其他渠道的治理画像也依然残缺不全。公司并未深陷危机，但档案清晰表明，其合规与治理维度的透明度仍仅是局部可见。


              这之所以关键，是因为公司正试图从私募时期的野蛮生长模式，切换至接受公众审视的上市状态，而此时其资本结构仍在微调。留存记录还显示，外界批评直指其定价手段与“隐形陷阱”（dark
              patterns）设计担忧，这类问题即便短期内未酿成不可逾越的法律壁垒，也会发酵为消费者保护或品牌声誉危机。理性的研判并非认定 Zepto 遭遇硬伤，而是上市路径所引发的严格审视，在现有公开记录中尚未完全冰释。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营与服务质量风险
        blocks:
          - type: paragraph
            body: >-
              运营端的隐患更加迫在眉睫。The Economic Times 报道指出了 Zepto Cafe
              在人员招聘与货源采购上的现实难题，而更广泛的技术案例研究也揭示了公司何等依赖搜索、库存和派单系统的严密协同。网点规模一旦做大，任何细微的运营偏差都会在客户服务、配送时效或商品保质期上放大显现。


              正因如此，报告将 Cafe、高峰时段履约和履约稳定性列为一级风险，而非一笔带过的附注。Zepto
              已经证明自身拉动需求的能力；真正的考验在于面对系统高负荷运转、人力短缺或供应商延期发货时，公司能否始终守住履约承诺。留存证据中的最坚实事实表明这绝非杞人忧天：它已在至少一个面向用户的业务前端真实发生。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: 合作伙伴与外部依赖风险
        blocks:
          - type: paragraph
            body: >-
              Zepto
              同样依赖自身无法完全掌控的合作伙伴和外部平台。其云原生与数据技术栈愈发精密，配送承诺靠零工骑手和本地供应链支撑，商业化模式则仰仗愿意为曝光和复购买单的品牌方。这种外部依赖虽是即时零售行业的常态，但也意味着公司无法仅靠发布几行代码，就指望商业模式自带防火墙。


              估值重置又添了一层变数。调低估值虽有助于提振二级市场吸引力，但由于公司必须在一个更加务实的基准上证明自身价值，执行预期反而变得更加严苛。换言之，风险不仅在于公司业绩不及预期，更在于竞争赛道拥挤、运营体系复杂与控制权架构部分模糊相互交织，使任何单点闪失的波及效应都远甚于普通
              C 端应用。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 上市路径推高审视门槛
            body: 最关键的风险并非孤立事件，而是合规审视、治理不透明与运营复杂度在公司推进公开上市的关口集中爆发。
            calloutType: risk
