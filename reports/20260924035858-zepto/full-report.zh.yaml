chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品与业务版图
        blocks:
          - type: paragraph
            body: >-
              Zepto 是一家印度即时零售企业，核心采用前置仓模式而非传统平台撮合模式。最新留存来源一致将其描述为覆盖日用百货、生鲜果蔬、家庭必需品、个人护理、3C 数码、服饰以及 Zepto Cafe
              的平台，主打许多日常用品数分钟内送达。这一定位至关重要，它解释了为何公司在持续扩充品类的同时，仍将配送速度作为核心价值主张。


              公司的公开总部与运营核心已稳定在 Bengaluru，尽管部分早期资料仍将 Mumbai 视作起点。LinkedIn 资料、Wikipedia 页面与 Tracxn 档案均将企业锚定在印度，由 Aadit
              Palicha 和 Kaivalya Vohra 于 2021 年创立。其运营版图已不再是初创期试点：公开口径目前提及覆盖 50+ 座城市、45,000+ 款商品，以及超过 1,000
              家门店的网络。落实到尽调视角，城市密集度与品类广度的结合，是支撑本报告后续每个章节的核心事实底座。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
      - number: '1.2'
        title: 领导团队与治理结构
        blocks:
          - type: paragraph
            body: >-
              两位创始人仍是公司最显性的人才资产。公开资料依然将 Aadit Palicha 和 Kaivalya Vohra 标示为创始双人组，而 Tracxn 公司主页还披露了一个包含创始人、财务负责人及两位独立董事在内的
              6 人董事会。这一信息颇有价值，因为 Zepto 的体量已足够庞大，治理问题与业务增长一样，都已成为投资判断的一部分。


              与此同时，公开记录并不完整。董事会的准确投票架构、最新股东协议以及任何创始人控制权安排，在留存来源中均未公开。关于日常管理，公开资料也释放了混杂信号：部分来源将 Aadit Palicha 列为
              CEO，其他来源则笼统强调创始人集体。最稳妥的结论并非管理层图景混乱，而是公开证据仅能勾勒出局部的治理图谱。这足以支撑一份更新版报告，但不足以让人断言其股权结构表或控制权架构已完全透明。
            claimRefs:
              - CO001
              - CO004
              - CO007
              - CO012
      - number: '1.3'
        title: 融资历程、估值与运营规模
        blocks:
          - type: paragraph
            body: >-
              Zepto 的资本结构仍是尽调档案中最显眼的优势之一。Clay 与 Tracxn 均显示其累计融资处于 $2.3B 低位区间，最新披露估值则从 2025 年 10 月的 $7B，调整至 2026 年 8 月
              Pre-IPO 配售时的 $4.5B 较低水平。这一估值重置本身并非失败信号，更符合一家在保持上市路径畅通的同时、试图扩大本土持股比例的企业的行为特征。


              规模数据同样关键。TechCrunch 2026 年关于上市文件的报道及留存的 IPO 平台摘要显示，公司在 FY26 拥有约 47.97 million 年度交易用户、1,139 家门店，以及超过 640
              million 笔订单。这些数字的分量在于，它们把这门生意锚定在一个真实的运营实体上，而非单纯讲叙事的增长故事。落实到实操视角，Zepto
              的体量已使门店密度、毛利率走势以及保障准时履约的成本成为尽调的核心变量，而不再是该模式到底能否吸引需求。
            claimRefs:
              - CO005
              - CO006
              - CO008
              - CO009
              - CO010
