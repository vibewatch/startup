  title: Product architecture map
  type: stack
  layout: wide
  summary: Publicly visible Clio architecture layers intake, core practice management, drafting, payments, AI, integrations,
    and enterprise orchestration on top of a shared workflow system.
  approximationNotes: This stack is a synthesis of public product, docs, and release materials. It does not claim hidden internal
    services or databases.
  data:
    layers:
    - id: engagement
      label: Client acquisition and intake layer
      detail: Grow forms, websites, booking, email marketing, Local Services Ads, and conflict checks bring prospects into
        the workflow.
    - id: core-record
      label: Core practice-management system of record
      detail: Manage holds cases, contacts, deadlines, tasks, documents, communications, reporting, billing, and trust-aware
        workflows.
    - id: document
      label: Document automation layer
      detail: Draft turns client and matter data into templates, questionnaires, court forms, and e-signature packages.
    - id: payments
      label: Billing and payments layer
      detail: Bills, reminders, client portal payments, text requests, payment plans, accounting sync, and trust protections
        sit inside the finance workflow.
    - id: ai
      label: AI action and legal-work layer
      detail: Manage AI / Duo executes context-aware actions in core workflows while newer Work and Vincent releases push
        research and drafting into adjacent surfaces.
    - id: ecosystem
