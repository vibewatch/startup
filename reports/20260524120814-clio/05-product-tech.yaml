      detail: App Directory listings, Add to Clio OAuth flow, region-specific developer portals, and SSO examples extend the
        core platform into partner tools.
    - id: enterprise
      label: Enterprise orchestration layer
      detail: Operate extends the stack upmarket with large-firm workflow orchestration and single-pane-of-glass control across
        complex legal operations.
    - id: trust
      label: Trust and reliability substrate
      detail: Identity, SSO, MFA, encryption, session logging, AI-action logs, backups, AWS geo-redundancy, compliance attestations,
        and public status surfaces support the entire stack.
