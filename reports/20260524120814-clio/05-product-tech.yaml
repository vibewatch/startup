- id: enterprise-expansion-and-roadmap-signals
  title: Enterprise expansion and roadmap signals
  body: 'Roadmap evidence suggests Clio is widening both horizontally and upmarket at the same time. The press archive and
    third-party 2025 coverage show a product narrative moving beyond classic small-firm practice management into Clio Work,
    Vincent, Legal Pad, document-management integrations, Clio for Word, Draft AI in Canada, and a 40+ integration push, while
    Operate brings a ShareDo-derived orchestration layer into North America for large-firm workflows. That matters because
    the product story is no longer “Manage plus add-ons”; it is becoming a platform story that spans intake, matter work,
    drafting, payments, AI assistance, legal-intelligence retrieval, and enterprise operational control. The upside is clear:
    more ACV expansion opportunities and a bigger share of the legal workflow. The risk is equally clear: launch density can
    outpace customer change capacity, and public materials still do not disclose how fast these additions become repeatable,
    low-friction implementations. In other words, the roadmap looks ambitious and coherent, but public evidence does not yet
    prove that every new surface is equally mature or equally easy to deploy.'
  claimRefs:
  - CE035
  - CE036
  - CE037
  - CE038
  - CE040
  - CE041
  - CE045
  - CE046
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: product-tech-verdict
  title: Product-tech verdict and diligence priorities
  body: The product-tech verdict is positive but not frictionless. Clio’s publicly visible strengths are breadth, workflow
    coherence, and enough technical surface to support a credible ecosystem and enterprise story without resorting to pure
    marketing copy. Manage, Grow, Payments, and Draft appear mature enough to underwrite as real production modules. The company
    also appears unusually willing to expose security controls and enough developer detail to attract third-party builders.
    The diligence caution is that the newest and most strategic layers—Manage AI, Clio Work, Vincent, and Operate—sit where
    transparency is weakest and implementation complexity is highest. That does not negate the platform thesis, but it does
    shift the next diligence step away from generic demos and toward trust packets, enterprise rollout evidence, app-ecosystem
    usage metrics, and official reliability data. If those private materials are strong, chapter 5 becomes a moat chapter.
    If they are weak, Clio risks becoming a company with many product surfaces but uneven operational proof behind the newest
    ones.
  claimRefs:
  - CE019
  - CE027
  - CE031
  - CE037
  - CE040
  - CE041
  - CE045
  - CE046
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / surface
  - Primary user
  - What it does
  - Status / maturity
  - Differentiation signal
  - Diligence gap
  rows:
  - - Clio Manage
    - Law firms / legal staff
    - Practice-management system of record across cases, deadlines, documents, billing, communications, and trust-aware payments
      workflow
    - Mature current core surface
    - Broadest current workflow breadth and 300+ integration story around core data
    - No directly retrievable Manage API reference in this run to verify every object or webhook surface
  - - Clio Grow
    - Intake teams / firms
    - Client intake, CRM, forms, conflict checks, appointment booking, marketing, and lead-to-matter conversion
    - Mature current module
    - Upstream workflow capture that syncs into Manage
    - Public evidence is strong on features but not on adoption by segment or attach rate
  - - Clio Payments
    - Billing / finance workflows
    - Integrated bills, portal/text payments, payment plans, trust accounting protections, and accounting sync
    - Mature current module
    - Payments are embedded inside Clio Manage subscriptions rather than separate third-party checkout
    - Public sources do not disclose TPV, take rate, chargebacks, or margin profile
  - - Clio Draft
    - Lawyers / paralegals / admins
    - AI document automation, templates, court forms, questionnaires, e-signature, and secure cloud document access
    - Mature but still expanding
    - Deep document workflow with 50-state forms and direct Manage data flow
    - Public evidence does not quantify template-conversion accuracy or workflow failure rates
  - - Manage AI / Clio Duo
    - Legal staff using Manage
    - Task execution, summaries, document extraction, invoice drafting, client-update prompts, and audit-logged AI actions
      inside the workflow
    - Developing and actively expanding
    - Matter-aware action layer embedded in core workflow rather than separate chatbot
    - No public model-vendor, retention-default, or benchmark packet in retained sources
  - - Developer platform and App Directory
    - Integration partners / IT teams
    - Open API, OAuth-based Add to Clio flow, region-specific developer portals, SSO example app, and marketplace distribution
    - Mature platform surface with active community signal
    - Mix of docs, GitHub sample, Slack/community references, and a large app directory
    - Public metrics stop at counts and docs; usage, error rates, and partner health are private
  - - Clio for Enterprise / Operate
    - Large law firms and complex legal teams
    - Large-firm orchestration, cross-system workflow control, low-code/no-code configuration, and “single pane of glass”
      operations
    - Earlier in North American rollout than SMB core
    - Extends Clio beyond practice management into large-firm operating orchestration
    - Implementation duration, services burden, and real post-go-live adoption evidence are not public
  notes: Covers every major product surface explicitly required in the runtime brief as of 2026-05-24; maturity is an analyst
    judgment based on current pages, docs, and release cadence rather than a company-published lifecycle taxonomy.
