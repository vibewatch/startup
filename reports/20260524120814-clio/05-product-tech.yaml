- id: trust-ai-governance-and-reliability
  title: Trust, AI governance, and reliability posture
  body: 'Clio’s trust posture is stronger on control categories than on technical specificity. The security page is unusually
    detailed for a private SaaS vendor: it names 24/7/365 monitoring, SAML SSO, MFA, TLS 1.2+, AES-256, backups, geo-redundancy
    on AWS, data escrow, quarterly restore tests, SOC 1 Type II, SOC 2 Type II, annual penetration tests, and support for
    GDPR, PCI DSS, HIPAA obligations, and PIPEDA. It also makes a stronger-than-average set of AI assurances, including that
    customer data is not used to train models, remains region-specific, and is controlled by existing permissions; the Duo
    launch adds explicit claims about cited references, audit logging, prompt-injection guardrails, and AI-action traceability.
    The weak spot is not the absence of any control language; it is the gap between control language and independent auditability.
    Clio’s own public status page is minimal, while third-party monitors document recent incidents and acknowledgement lag.
    That means public diligence can defend a reasonable security-control posture, but cannot yet independently underwrite
    SLO discipline, AI model governance depth, or incident-response quality with the same confidence.'
  claimRefs:
