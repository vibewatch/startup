- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Legacy friction
  - Clio surface
  - Automation / AI layer
  - Measurable or stated benefit
  - Limitation
  rows:
  - - Capture and qualify a new matter
    - Manual intake notes, missed follow-ups, weak conversion visibility
    - Clio Grow
    - Forms, appointment booking, automated stages, conflict checks
    - Customer quote cites no-show reduction from 20-25% to <5%
    - Public proof is mostly company-page evidence
  - - Stand up a live matter
    - Separate intake and matter systems create re-entry
    - Grow -> Manage sync
    - Lead data flows into Manage when leads convert
    - Less retyping and faster matter opening
    - Public docs do not quantify sync failure rates
  - - Coordinate daily case work
    - Manual calendaring and task entry
    - Clio Manage
    - AI extracts court-document dates and surfaces reminders
    - Reduced manual entry and fewer missed deadlines
    - No public error-rate or false-positive rate for AI calendaring
  - - Generate documents from existing client data
    - Repeated drafting and manual clause edits
    - Clio Draft
    - AI template conversion, questionnaires, autofill, e-signature
    - Draft claims up to 80% time saved
    - No public benchmark set by matter type or complexity
  - - Bill and collect from clients
    - Slow invoice cycles, fragmented payment channels, trust-account risk
    - Manage + Clio Payments
    - AI draft invoices, reminders, portal/text payments, payment plans
    - Clio says clients can pay by credit, debit, eCheck, QR/tap to pay
    - No public TPV, take rate, or collections-conversion data
  - - Run large-firm cross-system work
    - Layered legacy systems and poor visibility across practices
    - Clio Operate / Enterprise
    - Low-code/no-code orchestration and single-pane workflow control
    - Operate claims large gains in lifecycle and matter-creation efficiency
    - Implementation and services burden are not public
  notes: Rows emphasize user jobs and the product step that addresses each one. Stated benefits come from retained public
    sources and should not be treated as independently audited ROI.
