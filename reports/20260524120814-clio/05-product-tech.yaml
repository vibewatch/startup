- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in operating model
  - Public evidence
  - Key dependency
  - Implementation risk
  rows:
  - - Firm-facing workflow UI (Manage)
    - Holds cases, contacts, deadlines, messages, billing, and documents in the day-to-day system of record
    - Current Manage landing page
    - Identity, permissions, and clean data entry
    - Workflow sprawl can create broad rollout/change-management burden
  - - Upstream intake / CRM (Grow)
    - Captures leads before they become clients or matters
    - Current Grow landing page
    - Forms, websites, booking, marketing sources
    - Lead quality and sync hygiene determine downstream value
  - - Document automation layer (Draft)
    - Converts intake and matter data into templates, forms, questionnaires, and signature packets
    - Current Draft page plus Canada launch press
    - Current form libraries and clean field mapping
    - Template quality and jurisdiction updates are opaque publicly
  - - Billing / payments layer
    - Turns work into payable bills and manages trust-aware payment flows
    - Current Payments page plus Manage page
    - Card and bank rails, accounting sync, compliance controls
    - Public margin, dispute, and processor dependency detail is missing
  - - AI action layer (Manage AI / Duo)
    - Pulls matter context, summarizes work, drafts actions, and executes selected tasks inside the workflow
    - Manage page plus Duo launch release
    - Permissioning, cited references, audit logging, model governance
    - No public model-vendor, retention-default, or eval packet
  - - Integration and marketplace layer
    - Connects Clio with partner tools and distribution through app listings
    - Manage page, App Directory, Developer Hub
    - OAuth, Add to Clio callback flow, region-specific portals
    - App-count breadth does not prove app quality or active usage
  - - Public API and docs layer
    - Lets developers create apps, connect accounts, paginate data, and handle auth constraints
    - API overview, Add to Clio guide, Grow API docs, GitHub sample
    - Stable docs, auth flows, endpoint compatibility by region
    - Current directly retrievable Manage API detail was weaker than Grow detail
  - - Enterprise orchestration layer (Operate)
    - Coordinates complex workflows and cross-system visibility for large firms
    - Enterprise page and Operate launch release
    - Migration work, low-code configuration, large-firm process design
    - Rollout evidence is still company-led and limited publicly
  notes: This table describes the visible operating model only. It intentionally avoids claiming hidden internal databases,
    message buses, or model orchestration that were not disclosed in retained sources.
