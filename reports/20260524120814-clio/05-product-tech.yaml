  evidenceGaps:
  - type: missing-source
    severity: material
    topic: ai-governance-details
    missingEvidence: A current legal-product page that names Clio’s model vendors, retention defaults, prompt-attack evaluation
      method, and the exact AI audit-log schema for Manage AI / Duo / Clio Work.
    whyItMatters: Without those details, investors can see control claims but cannot independently test how much AI risk is
      mitigated versus merely described.
    diligencePath: Request the current AI trust packet or trust-center documentation for legal products, including model vendors,
      retention settings, redaction policy, and audit-log field definitions.
    relatedQuestionRefs:
    - QE009
    relatedTableRefs:
    - TE004
  - type: access-blocked
    severity: material
    topic: release-cadence
    missingEvidence: An easily accessible, machine-readable product changelog or release-notes feed for Clio’s legal products.
    whyItMatters: Roadmap intensity is visible through press and marketing, but release cadence and regression risk are harder
      to audit without a clean changelog trail.
    diligencePath: Ask Clio for an authenticated release-notes export or customer-facing changelog covering Manage, Grow,
      Payments, Draft, Work, Vincent, and Operate.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: enterprise-implementation
    missingEvidence: Neutral implementation benchmarks for Clio Operate and Clio for Enterprise, including deployment duration,
      services effort, migration burden, and realized adoption by workflow.
    whyItMatters: Enterprise rollout risk can dominate ROI when products rely on layered integrations, process redesign, or
      long migration windows.
    diligencePath: Request implementation case studies with timeline, professional-services scope, dependency map, and post-go-live
      adoption metrics from at least two large-firm deployments.
    relatedQuestionRefs:
    - QE023
    - QE024
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: manage-api-coverage
    missingEvidence: A directly retrievable current Clio Manage API reference or webhook guide equivalent to the accessible
      Grow API documentation.
    whyItMatters: Public docs clearly signal an API surface, but the most detailed directly retrievable object-level documentation
      in this run came from Grow rather than Manage.
    diligencePath: Request the current Manage API reference, webhook docs, and auth or rate-limit policies in exportable form,
      then compare them to Grow coverage.
    relatedQuestionRefs:
    - QE011
    - QE012
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: ecosystem-activity
    missingEvidence: Operational metrics for ecosystem usage such as active app installs, API call volume, webhook volume,
      partner quality distribution, or attach by firm segment.
    whyItMatters: Integration count alone does not prove that the ecosystem is healthy, sticky, or strategically defensible.
    diligencePath: Request app-partner cohort metrics, top integration categories by active usage, API growth, and churn or
      suspension rates for partners and customers.
    relatedQuestionRefs:
    - QE010
    - QE013
    - QE024
    relatedTableRefs:
    - TE001
    - TE003
  - type: missing-source
    severity: material
    topic: reliability-slo
    missingEvidence: Official component-level uptime history, SLO commitments, and acknowledgement latency data rather than
      a minimal region picker plus third-party outage aggregation.
    whyItMatters: Third-party monitors show signal, but investors need official reliability baselines to judge operational
      discipline and customer risk.
    diligencePath: Request twelve months of component-level uptime, incident severity breakdown, detection-to-acknowledgement
      times, and postmortems for major or repeated incidents.
    relatedQuestionRefs:
    - QE020
    - QE021
    relatedTableRefs:
    - TE004
