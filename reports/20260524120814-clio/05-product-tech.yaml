- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: Clio’s public workflow starts with lead capture, converts that lead into a matter, executes work inside Manage
    and Draft, then moves into billing, payments, and ongoing client updates.
  approximationNotes: This is a workflow synthesis from current product pages; real-world implementations may skip or reorder
    steps depending on firm size and practice area.
  data:
    nodes:
    - id: lead
      label: Lead capture
      detail: Grow forms, websites, ads, and appointment booking capture prospect information.
    - id: qualify
      label: Qualification and conflict check
      detail: Grow dashboards, stages, and conflict checks qualify a lead before matter creation.
    - id: matter
      label: Matter creation in Manage
      detail: Converted lead data syncs into the practice-management system of record.
    - id: work
      label: Work execution and drafting
      detail: Manage runs day-to-day tasks while Draft uses matter data for templates, forms, questionnaires, and signatures.
    - id: billing
      label: Billing and review
      detail: Time, expenses, AI-assisted invoice drafts, routing, and reminders prepare collections.
    - id: payment
      label: Client payment and trust flow
      detail: Clients pay by portal, text, QR, card, debit, eCheck, or payment plan inside trust-aware workflows.
    - id: followup
      label: Reporting and client follow-up
      detail: Reports, payment notifications, client updates, and ongoing communications feed the next cycle.
