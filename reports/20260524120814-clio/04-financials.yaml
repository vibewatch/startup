  rows:
  - - Core practice-management subscription
    - Per-user recurring software subscription
    - USD per user per month
    - Official list pricing starts at $49/user/month; higher tiers and enterprise quotes increase ARPU
    - High recurring core; pricing power visible but realized discounts undisclosed
    - Request plan-level customer mix, logo retention, seat expansion, and discount waterfall
  - - Payments processing
    - Transaction fees attached to bills, trust requests, portal payments, eCheck, text, tap to pay, and payment plans
    - Processing-rate plus volume
    - Official pages market fixed processing rates and integrated collections, but Clio does not disclose TPV or realized take rate
    - Recurring workflow adjacency with lower likely margin than software
    - Request annual TPV, blended take rate, chargebacks, losses, and payments gross margin
  - - AI upsell
    - Manage AI / Duo features layered into Clio Manage and enterprise workflow
    - Per-seat or quote-led module
    - Public pages position AI as monetizable productivity and invoice-generation layer; public revenue contribution not disclosed
    - Potential ARPU and retention expansion driver; actual attach unknown
    - Request AI attach rate, pricing by cohort, and retention uplift versus non-AI users
  - - Intake / CRM / growth modules
    - Grow and related funnel tooling bundled or sold above core tiers
    - Standalone or bundled subscription
    - Pricing page shows Grow included in higher-end paths or sold separately by sales contact
    - Useful expansion module; realized mix unknown
    - Request attach rate by firm size and gross retention of multi-product accounts
  - - Enterprise / legal-intelligence products
    - Clio for Enterprise, Clio Operate, Vincent / vLex legal intelligence
    - Quote-led contracts
    - Enterprise page and JMI materials show explicit large-firm motion and legal-intelligence expansion after vLex
    - Larger ACVs but longer sales cycles and support burden
    - Request enterprise ACV, sales cycle, services intensity, and renewal profile
  notes: Separates visible monetization mechanisms from undisclosed realized mix; current value/status is limited to public list pricing, company statements, and benchmark inference.
