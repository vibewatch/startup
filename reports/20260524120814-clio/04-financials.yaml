- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - NRR by segment
    - Shows whether payments, AI, and enterprise modules truly deepen expansion
    - Not publicly disclosed
    - 'Material: cannot test land-and-expand quality'
    - Request NRR bridge by SMB, mid-market, enterprise, and AI-attached cohorts
  - - CAC payback
    - Needed to judge whether sales-led enterprise growth is efficient
    - Not publicly disclosed
    - 'Material: no sales-efficiency underwriting'
    - Request CAC payback, sales cycle, and win-rate by channel
  - - Blended and segment gross margin
    - Separates software quality from payments and service burden
    - Not publicly disclosed
    - Blocking for margin-path analysis
    - Request gross margin split for subscriptions, payments, AI, and professional services
  - - Cash balance and monthly burn
    - Core input to runway and downside planning
    - Not publicly disclosed
    - Blocking for capital-adequacy math
    - Request treasury snapshot, trailing 12-month burn, and monthly cash bridge
  - - Payments volume / TPV and realized take rate
    - Key to valuing payments as a revenue and profit contributor
    - Not publicly disclosed
    - 'Material: payments economics remain conceptual'
    - Request annual TPV, net take rate, processor fees, losses, and chargeback rates
  - - Revenue mix by stream
    - Needed to separate subscription durability from transaction-driven growth
    - Not publicly disclosed
    - 'Material: revenue quality not fully observable'
    - Request audited or management revenue split by product and customer segment
  - - Debt terms and covenants
    - Determines refinancing and downside risk from the $350M facility
    - Headline size disclosed; terms undisclosed
    - 'Material: leverage risk not underwritten'
    - Provide debt agreement, covenant tests, maturity ladder, and collateral package
  - - Enterprise pricing and services intensity
    - Upmarket growth can add ACV but also implementation burden
    - Public pages are quote-led only
    - Minor to material depending on mix
    - Request ACV bands, implementation revenue, services margin, and renewal profile
  notes: These are explicit diligence blockers, not generic wish-list items; each one maps to a private dataset or contract package that management could provide quickly.
