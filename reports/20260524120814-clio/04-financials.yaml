  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly net burn, operating cash flow, and management runway scenario after the vLex acquisition and Series G close.
    whyItMatters: Capital adequacy cannot be underwritten from financing headlines alone when the company also added debt and completed a billion-dollar acquisition.
    diligencePath: Request the latest board cash deck, treasury report, trailing-twelve-month cash-flow statement, and base/downside runway model.
    relatedQuestionRefs:
    - QI021
    - QI022
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix-and-tpv
    missingEvidence: Revenue split by subscriptions, payments, AI, enterprise/legal-intelligence, services, and any other material stream plus annual payments volume and realized take rate.
    whyItMatters: Without revenue mix and TPV, the ARR headline cannot be converted into a margin or valuation-quality judgment.
    diligencePath: Request a management revenue bridge by stream, payments KPI pack, and monthly TPV / net revenue schedule.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Blended gross margin plus segment gross margins for software subscriptions, payments, AI, and services or implementation work.
    whyItMatters: The key debate in software-plus-payments businesses is whether lower-margin transaction revenue is broadening or diluting enterprise value.
    diligencePath: Request audited or management gross-margin reporting by product family and a cost-of-revenue allocation methodology.
    relatedQuestionRefs:
    - QI025
    - QI029
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-and-cac
    missingEvidence: NRR, logo churn, cohort retention, CAC payback, and sales-efficiency metrics split by SMB, mid-market, and enterprise accounts.
    whyItMatters: Cross-sell and enterprise-expansion narratives are impossible to validate without retention and payback data.
    diligencePath: Request a cohort dashboard, sales-funnel summary, and board metrics for CAC payback and NRR by segment.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: Debt agreement documents or a lender presentation describing maturity, pricing, covenant tests, permitted liens, and collateral for the US$350 million facility.
    whyItMatters: The facility could be benign growth capital or a meaningful downside constraint depending on covenant structure and amortization.
    diligencePath: Request the executed credit agreement, amendment history, covenant calculations, and lender term sheet.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
