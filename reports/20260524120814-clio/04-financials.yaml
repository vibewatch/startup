chapter:
  number: 4
  title: Financials
  summary: 'Clio now presents as a profitable, roughly US$500 million ARR legal-software platform whose monetization stack blends seat subscriptions, payments, AI, and enterprise/legal-intelligence upsells. Public evidence supports strong revenue quality and capital access, but underwriting still breaks on missing private metrics: revenue mix, gross margin, payments volume, cash balance, burn, runway, NRR, CAC payback, and debt terms remain undisclosed.'
sections:
- id: revenue-model-and-traction
  title: Revenue model and public traction
  body: 'Clio''s public revenue model is broader than a classic legal-practice subscription. The company still anchors pricing around per-user software tiers, but official pages now layer payments, AI, accounting, intake, document automation, and enterprise/legal-intelligence modules around the core system. That matters because the latest company-announced financial milestone is much larger than the historical legal-tech baseline: Clio said it surpassed US$500 million of ARR in 2026 while remaining profitable and accelerating. TechCrunch and Sacra both reinforce the same direction of travel, describing a jump from roughly US$200 million of ARR in 2024 to over US$400 million by late 2025 and about US$500 million by 2026. Public traction signals also line up with a platform story rather than a single-feature tool. Clio says it serves hundreds of thousands of legal professionals in 130+ countries, and its app directory still advertises 250+ integrations. The practical financial read-through
    is that Clio''s top line likely combines recurring software seats, transaction-fee revenue from payments, and higher-ARPU upsells into AI and enterprise workflows, but the company does not publicly disclose what share each stream contributes.'
