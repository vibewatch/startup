  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR trajectory
    - About $200M in 2024, about $433M est. at end-2025, and $500M+ by 2026
    - Medium
    - Shows velocity and multiple compression
    - Reconcile ARR definitions, bridge 2024 to 2026 by stream, and provide quarterly net adds
  - - Profitability status
    - Company says profitable and accelerating; Sacra says EBITDA positive
    - Medium
    - Supports capital adequacy but not margin quality
    - Provide audited EBITDA, operating cash flow, and reconciliation to GAAP or management reporting
  - - Annual list price per seat
    - $588 to $1,788 at the public/independent endpoints
    - Medium
    - Frames base software ARPU corridor before enterprise and payments
    - Provide realized ASP by segment and discount structure
  - - Embedded-payments take-rate benchmark
    - 2.5% to 3.5% benchmark range for vertical SaaS
    - Medium
    - Helps bound monetization logic where Clio TPV is undisclosed
    - Provide realized gross and net take rate plus chargeback/loss rate
  - - Payments gross-margin benchmark
    - 40% to 60% benchmark range
    - Medium
    - Shows why payments can grow revenue faster than gross profit
    - Provide Clio Payments gross margin and processor pass-through economics
  - - Pure software gross-margin benchmark
    - 75% to 85% benchmark range
    - Medium
    - Frames likely margin difference between subscriptions and payments
    - Provide software-only gross margin and services burden
  - - NRR / expansion
    - Not publicly disclosed
    - Low
    - Key test of platform stickiness and cross-sell quality
    - Provide NRR by SMB, mid-market, enterprise, and AI-attached cohorts
  - - CAC payback
    - Not publicly disclosed
    - Low
    - Critical for judging sales efficiency as enterprise motion expands
    - Provide blended and segment-level CAC payback and pipeline conversion
  - - Blended gross margin
    - Not publicly disclosed
    - Low
    - Required to underwrite payments mix and AI economics
    - Provide gross margin by product family and cost-of-revenue bridge
  - - Revenue mix by stream
    - Not publicly disclosed
    - Low
    - Needed to separate software, payments, AI, and services quality
    - Provide revenue split for subscriptions, payments, AI, services, and enterprise/legal-intelligence modules
  notes: Known values combine company statements and third-party benchmarks; every undisclosed field maps to a concrete diligence request rather than a placeholder null.
