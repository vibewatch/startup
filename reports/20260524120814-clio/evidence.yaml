evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-roster
    missingEvidence: A current board roster showing directors, observers, committees, and any investor-designated seats.
    whyItMatters: >-
      Chapter 1 can identify Tony Florence and a historical Rian Gauvreau board role, but not the full governance
      structure that would matter in an investment or control review.
    diligencePath: >-
      Request the latest board deck cover page, board consent package, or investor-rights summary from the company/data
      room.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: current-headcount
    missingEvidence: A dated 2025 or 2026 standalone employee-count disclosure from the company or a credible independent data source.
    whyItMatters: >-
      The public source set still relies on the 1,100+ employee figure tied to the July 2024 Series F period, which is
      stale for a rapidly growing company.
    diligencePath: >-
      Check a current press kit, hiring materials, or management diligence Q&A for a run-date headcount figure and
      geography split.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: founding-location
    missingEvidence: >-
      A primary-source statement that explicitly names Burnaby (or another city) as the founding location, not merely
      the present headquarters.
    whyItMatters: >-
      The user flagged Burnaby as a fact to verify, but current retained primary sources clearly establish headquarters
      rather than original founding locality.
    diligencePath: >-
      Look for an older founder interview, archived about page, or incorporation record that ties the 2008 founding
      event to a specific city.
    relatedQuestionRefs:
      - QO026
  - type: conflicting-data
    severity: material
    topic: payments-launch-year
    missingEvidence: >-
      A canonical dated product announcement or historical product page establishing whether Clio Payments launched in
      2021 or 2022.
    whyItMatters: >-
      The exact chronology matters for assessing how quickly Clio built its fintech wedge and how much runway exists in
      payments monetization.
    diligencePath: >-
      Fetch archived Clio Payments launch materials or an original press release and reconcile it against secondary
      profiles.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: security-posture
    missingEvidence: Concrete, Clio-specific security findings or remediation history rather than summary vendor-risk posture.
    whyItMatters: >-
      The public adverse evidence shows monitoring exists but does not substantively quantify security weaknesses,
      limiting how much operational-risk weight can be placed on it.
    diligencePath: Request trust-center materials, recent penetration-test summaries, or security questionnaires under NDA.
    relatedQuestionRefs:
      - QO027
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-economics
    missingEvidence: >-
      Ownership percentages, liquidation preferences, debt terms, and any veto or consent rights for major investors and
      financing partners.
    whyItMatters: >-
      The public stakeholder map identifies the visible syndicate but does not reveal economic concentration, control
      rights, or dilution from the vLex and debt transactions.
    diligencePath: Review the cap table, financing documents, and shareholder-rights summary in the diligence room.
    relatedQuestionRefs:
      - QO022
      - QO024
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: >-
      A fuller founder and leadership roster with current board tie-ins and role histories for every disclosed
      executive.
    whyItMatters: >-
      The leadership table is intentionally partial and focused on chapter-1 decision makers, so readers should not
      mistake it for an exhaustive governance or management listing.
    diligencePath: Refresh the company leadership page, org chart, and board materials before final investment memo drafting.
    relatedQuestionRefs:
      - QO007
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: lpms-sam
    missingEvidence: >-
      Publicly comparable revenue or seat-count data for cloud legal practice management software by firm-size cohort
      and geography.
    whyItMatters: >-
      Without a narrower practice-management revenue baseline, any Clio-specific SAM or SOM would be mostly synthetic
      and easy to overstate.
    diligencePath: >-
      Request category sizing from paid analyst reports or management materials that break out practice management,
      intake, and payments revenue by region and customer size.
    relatedQuestionRefs:
      - QM004
      - QM026
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: in-house-buyer-count
    missingEvidence: >-
      A directly published national count of in-house counsel or corporate legal department seats in the retained public
      source set.
    whyItMatters: >-
      The ACC tracker explains the calculation logic but does not provide a single clean national number in the retained
      excerpt, making enterprise-buyer sizing less precise.
    diligencePath: >-
      Pull the underlying ACC table export or Harbor/ACC membership survey detail and reconcile it with BLS occupational
      data.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: legal-ai-market-size
    missingEvidence: A standardized methodology that applies the same category boundary across legal AI market reports.
    whyItMatters: >-
      Analyst estimates range from roughly USD 1.75 billion to USD 5.03 billion for 2025, which is too wide to collapse
      into one valuation input without boundary error.
    diligencePath: >-
      Compare paid report scopes side-by-side and normalize whether each estimate includes only legal AI software,
      broader legal ops AI, or services and consulting.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: clio-segment-mix
    missingEvidence: Current Clio segment mix by solo/small, mid-sized, large-law, and corporate legal department revenue or ARR.
    whyItMatters: >-
      The buyer map is supportable, but the lack of current segment revenue mix blocks a defensible Clio-specific
      penetration and expansion model.
    diligencePath: >-
      Ask management for current customer counts, ACV, retention, and revenue mix by segment, plus the attach rates for
      payments, CRM, and AI modules.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-opacity
    missingEvidence: >-
      Realized seat, implementation, and discount economics for LEAP, Filevine, Centerbase, Practical Law, and
