- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - What public evidence shows
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Payments and billing attach
    - KB&A, Burr Law, and review sources repeatedly cite billing and collections improvements
    - Could lift ARPU, but no public retention or payments-attach disclosure by cohort
    - Potentially strong expansion vector in SMB and boutique accounts
    - Request payments attach, TPV, and renewal / expansion by payments-enabled cohort
  - - AI / Clio Work workflow depth
    - Williams and Hamilton plus mid-sized report evidence show AI and drafting workflows deepening usage
    - AI enthusiasm does not equal durable paid retention without cohort data
    - Important cross-sell and up-sell lever, especially in modernizing firms
    - Request AI attach, paid conversion, and renewal delta versus non-AI accounts
  - - Enterprise / Operate move
    - Operate launch and Leigh Day reference show a real upmarket land-and-expand motion
    - Named large-firm proof remains thin and contract economics undisclosed
    - Could materially expand ACV if repeatable
    - Request named enterprise customers, ACV bands, and services intensity
  - - Academic pipeline
    - 200+ law schools and 27,000+ student matters create future-user familiarity
    - Academic usage may be discounted or free, so conversion to ARR is unclear
    - Strategic top-of-funnel and training moat rather than immediate revenue proof
    - Request post-graduation conversion, referral, or bar-partner attribution data
  - - Bar-association channel
    - ABA, Missouri, NYC, and Louisville pages show recommendation + discount pathways
    - These pages are acquisition channels, not usage or retention audits
    - Useful SMB distribution support but not concentration mitigation on their own
    - Request lead volume, conversion, and churn for bar-sourced cohorts
  - - Customer concentration disclosure
    - No retained public source discloses top-customer share or concentration by revenue
    - Could hide enterprise dependence or partner-channel concentration
    - Material underwriting gap
    - Request top-10 customer revenue share, largest-customer share, and channel concentration
  - - Contract durability
    - No retained public source discloses contract term, renewal cadence, or enterprise commit structure
    - Prevents clean churn and concentration underwriting
    - Material underwriting gap
    - Request average contract length and renewal profile by segment and product line
  notes: Expansion drivers are supported by customer stories and product surfaces, while concentration and contract rows are explicit public-disclosure gaps rather than inferred strengths.
