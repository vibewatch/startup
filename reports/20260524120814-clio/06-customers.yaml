- id: named-customer-proof
  title: Named customer proof and reference quality
  body: 'Clio has real named customer proof, but investors should separate “named and useful” from “independently underwritten.” The best SMB and mid-market proof is company-curated and concrete: Burr Law reports 40% revenue growth, Williams and Hamilton describes dramatic reductions in drafting and billing friction, and KB&A reports faster collections and onboarding with Clio Payments. Institutional proof is also unusually strong for legal tech. GW Law and OU Law both describe operational use through the Academic Access Program, and Price Mediation shows nonprofit deployment with quantified workflow benefits. Enterprise proof exists but is thinner. Leigh Day gives Clio a named large-firm customer reference for Operate, yet the biggest efficiency metrics are presented at documented-deployment level rather than explicitly tied only to Leigh Day. Independent corroboration mostly confirms that these organizations exist and fit the claimed segment; it does not usually verify the ROI numbers.
    That makes the named proof credible enough to establish real adoption, but not enough to underwrite customer durability or expansion without management data.'
