company:
  name: Clio
chapter:
  number: 6
  title: Customers
  summary: Clio has credible public customer proof across solo and small firms, boutiques, mid-sized firms, law-school clinics, legal-aid organizations, and an emerging large-firm Operate motion, with the strongest named outcomes concentrated in company-curated case studies and review surfaces. Public satisfaction signals are positive and channel breadth is real, but the chapter cannot underwrite NRR, GRR, contract durability, or customer concentration because those metrics remain undisclosed in the retained source set.
sections:
- id: segment-mix-and-reach
  title: Segment mix and customer reach
  body: 'Clio’s public customer story is broad, but the evidence breaks into very different layers. At the top of the funnel, the company claims a very large footprint: 400,000+ legal professionals, 130+ countries, and coverage from solo firms to teams of 500+, plus in-house and government legal teams. That establishes breadth, not account economics. The more decision-useful segmentation evidence comes from the surfaces Clio has built around the core product: a customer-story index with explicit firm-size filters, a solo-and-small report, a mid-sized report, bar-association partnerships, a law-school program, and a legal-aid offering. Together those sources show a company whose buyer map is not just “small law firms” anymore. The public proof set spans owner-operated practices, boutique and mid-sized firms, larger legal teams, law-school clinics, and nonprofit legal-aid organizations. The catch is that the strongest count data are still company-wide user metrics rather than disclosed customer-logo
    counts or revenue mix by segment.'
