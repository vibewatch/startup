- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: wide
  summary: Clio’s public deployment motion appears to move from broad legal-market reach into core workflow adoption, then toward payments, AI, and enterprise layers where available proof is more selective.
  data:
    nodes:
    - id: market-reach
      label: Broad market reach
      detail: 400,000+ legal professionals, 130+ countries, and 100+ bar approvals create a very wide top of funnel.
    - id: core-stack
      label: Core workflow landing
      detail: Practice management, billing, documents, and client communication remain the default landing zone across solo, small, and many mid-sized firms.
    - id: payments
      label: Payments / billing expansion
      detail: Customer stories repeatedly quantify faster collections, quicker billing, and less admin once payments are activated.
    - id: ai
      label: AI and advanced workflow
      detail: Mid-sized-firm AI adoption and stories like Williams and Hamilton show workflow expansion beyond admin into drafting and strategy.
    - id: enterprise
      label: Enterprise orchestration
      detail: Operate targets larger firms where deployments promise better lifecycle control, but public named proof is still limited.
    edges:
    - from: market-reach
      to: core-stack
      label: Awareness converts into initial product adoption
    - from: core-stack
      to: payments
      label: Collections and billing pain create first expansion vector
    - from: core-stack
      to: ai
      label: Workflow familiarity supports AI and drafting add-ons
    - from: payments
      to: ai
      label: Deeper workflow integration raises switching costs
    - from: ai
      to: enterprise
      label: Complexity and governance needs push larger firms upmarket
  approximationNotes: The flow reflects public product and customer-proof sequencing, not measured conversion rates between stages.
