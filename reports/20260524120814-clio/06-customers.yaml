- id: satisfaction-repeat-usage-and-retention-visibility
  title: Satisfaction, repeat usage, and retention visibility
  body: 'Public satisfaction signals are good. Clio’s homepage cites a 4.7/5 score from 12,000+ reviews, its own reviews page claims a 9.1 Capterra NPS with nine in ten customers recommending the product, GetApp shows 1,726 verified reviews with strong value-for-money and ease-of-use scores, and TrustRadius surfaces recurring praise for billing, timekeeping, and API integrations. Those are useful directional indicators of product satisfaction and repeat workflow value. They are not substitutes for retention. None of the retained public sources disclose NRR, GRR, logo churn, or contract duration, and even the richer review surfaces mostly speak to usability and pricing sentiment rather than renewal economics. The adverse evidence that does exist is narrower: GetApp and an accounting adviser both flag price friction and feature gating for some cohorts. That pushes the chapter’s retention verdict into the “positive satisfaction, unresolved durability” bucket rather than a clean retention-underwritten
    conclusion.'
  claimRefs:
  - CU040
  - CU041
  - CU042
  - CU043
  - CU044
  - CU045
  - CU047
  - CU051
