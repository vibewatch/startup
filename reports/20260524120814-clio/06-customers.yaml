- id: TU003
  title: Named customer proof table
  columns:
  - Customer / organization
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / evidence freshness
  - Limitation
  rows:
  - - Burr Law
    - SMB law firm
    - Core practice-management and billing workflow
    - Production customer story
    - 40% revenue growth in one year; doubled headcount; current story
    - Outcome is company-curated and not independently audited
  - - Williams and Hamilton
    - Solo law firm
    - Clio Work for drafting, research, and billing workflow
    - Production customer story
    - Hours-to-seconds document creation and near-instant billing; current story
    - Single-firm company story without independent ROI validation
  - - KB&A
    - Boutique / mid-sized firm
    - Clio Payments deployment inside practice-management workflow
    - Production customer story
    - 5-minute setup; 20 days faster payments; 14 hours per month saved; current story
