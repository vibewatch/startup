  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Segmented NRR, GRR, logo churn, and customer cohort-retention tables by product line and firm size.
    whyItMatters: Public review scores show satisfaction, but investors cannot tell whether customers renew, expand, or churn without retention disclosures.
    diligencePath: Ask management for cohort-retention tables, renewal waterfalls, and product-level expansion metrics for the last 8 quarters.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU026
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: contract-duration
    missingEvidence: Average contract term, renewal cadence, and multi-year commitment structure for SMB, mid-market, and enterprise cohorts.
    whyItMatters: Contract shape determines how quickly customer issues become churn and whether large-firm expansion is durable or services-heavy.
    diligencePath: Request standard order forms, renewal provisions, and average term-length by segment and product line.
    relatedQuestionRefs:
    - QU019
    - QU021
    - QU026
    relatedTableRefs:
    - TU004
    - TU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue share, largest-customer share, and channel concentration by source of acquisition.
    whyItMatters: Without concentration data, investors cannot test whether enterprise wins meaningfully change downside exposure or partner-channel dependence.
    diligencePath: Request customer concentration schedules and acquisition-channel mix from finance and go-to-market systems.
    relatedQuestionRefs:
    - QU022
    - QU026
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: enterprise-proof
    missingEvidence: More named large-firm references, enterprise ACV bands, and evidence that Operate metrics hold across multiple deployments rather than one named reference and aggregate launch claims.
    whyItMatters: The upmarket motion may be meaningful, but public evidence is still too thin to determine repeatability or renewal quality.
    diligencePath: Request 3–5 named enterprise references, implementation timelines, services intensity, and renewal outcomes for Operate accounts.
    relatedQuestionRefs:
    - QU010
    - QU016
    - QU024
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: channel-monetization
    missingEvidence: Data showing how law-school, clinic, legal-aid, and bar-association channels convert into paid accounts or lower acquisition cost.
    whyItMatters: These channels look strategically valuable, but their direct revenue contribution is impossible to judge from public materials.
    diligencePath: Ask for sourced-pipeline conversion rates, paid-conversion cohorts, and LTV/CAC by channel.
    relatedQuestionRefs:
    - QU004
    - QU017
    - QU023
    relatedTableRefs:
    - TU001
    - TU005
  - type: access-blocked
    severity: minor
    topic: complaint-surface-depth
    missingEvidence: Stable direct access to additional complaint-heavy review surfaces such as BBB, Trustpilot, or Capterra raw pages for broader adverse sampling.
    whyItMatters: The chapter can show some price-friction evidence, but complaint breadth is still narrower than the positive review surface.
    diligencePath: Re-run complaint-surface review from a browser or vendor account and preserve dated screenshots or exports for the diligence file.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU004
acknowledgedWarnings:
- dimension: figureType
