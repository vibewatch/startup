tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / strategic value
  - Gap
  rows:
  - - Solo firms
    - Buyer and payer are typically the owner-operator; users are attorneys and staff
    - End-to-end practice management, billing, intake, and client communication
    - Homepage explicitly markets solo firms; solo-and-small report and stories like Williams and Hamilton show practical fit
    - Public sources do not disclose solo logo count or solo retention separately
  - - Small firms
    - Managing partner or firm administrator buys; lawyers and admins use daily
    - Standardized workflows, collaboration, billing, and collections
    - Customer-story filters span 2–5 and 6–10 firms; Burr Law and other SMB case studies show production use
    - No public ACV, cohort retention, or attach-rate disclosure
  - - Mid-sized firms
    - Managing partners, ops leaders, and finance teams buy; lawyers and staff use
    - Practice management, payments, billing flexibility, and AI adoption
    - Clio says 1,000+ mid-sized firms rely on it; 2025 report highlights strong AI and pricing-model adoption in this cohort
    - Public sources do not disclose enterprise-to-mid-market split, renewal rate, or seat expansion
  - - Large legal teams / enterprise
    - Firm leadership, IT, and operations teams buy; multi-office legal teams use
    - Governance, workflow orchestration, AI, and cross-system visibility via Operate
    - Operate launch and Leigh Day reference show a real upmarket motion beyond SMB
    - Named large-firm customer references and contract economics remain sparse
  - - Law schools and clinics
    - Faculty and clinic administrators sponsor use; students and clinic staff use
    - Practice-readiness training and live clinic case-management workflows
    - 200+ law schools, 95%+ U.S. coverage, and named proof at GW Law and OU Law create a meaningful institutional channel
    - Academic access may be discounted or free, so monetization is unclear
  - - Legal-aid / nonprofit organizations
    - Program leaders, grant managers, and attorneys use
    - Eligibility screening, grant tracking, reporting, and case transfer
    - Dedicated Clio for Legal Aid surfaces plus Price Mediation proof show a distinct public-interest segment
    - Public sources do not show paid penetration, average contract value, or renewal data
  - - Government / in-house legal teams
    - Legal ops or department leaders likely sponsor use
    - Workflow management and legal AI on a shared platform
    - May 2026 ARR press claims adoption by in-house counsel and government legal teams
    - No named government deployment or procurement record was retained in this chapter
  notes: Mixes company-wide footprint claims with named customer proof and channel evidence; scale cells describe public evidence strength, not customer-count precision.
