  - - Price Mediation
    - Nonprofit mediation organization
    - Drafting questionnaires and affordable-service workflow
    - Production customer story
    - Drafting time cut >50%; 51% caseload increase; current story
    - Proof is strong on workflow outcomes but does not show contract economics
  - - GW Law
    - Law-school clinics
    - Clinical case management and student workflow training
    - Production institutional deployment
    - 50,000+ annual service hours and 20+ practice areas through Clio; current story and current school page
    - Institutional use may not map to paid commercial ARR
  - - Leigh Day / Clio Operate
    - Large law firm / enterprise
    - Workflow orchestration and enterprise operations
    - Named production reference with platform-level deployment metrics
    - Named customer quote plus documented deployments showing 40% shorter lifecycles and 80%+ faster matter creation; 2026 launch window
    - Launch materials do not attribute every metric exclusively to Leigh Day
  notes: All six rows are public named proofs, but most quantified ROI statements come from company-curated stories or launch materials; external pages mainly corroborate the organization rather than the claimed outcome.
