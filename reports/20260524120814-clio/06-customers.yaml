figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public evidence suggests Clio’s journey starts with bar, community, and market education channels, then deepens from core practice management into payments, AI, and enterprise workflow expansion.
  data:
    nodes:
    - id: discover
      label: Discover and shortlist
      detail: Bar-association discounts, legal-industry reports, review platforms, and word of mouth create initial awareness in solo, small, and mid-sized firms.
    - id: initial-adopt
      label: Initial core adoption
      detail: Customers adopt the core practice-management stack for matters, billing, documents, and client communication.
    - id: finance-attach
      label: Finance and collections attach
      detail: Payments, billing, and accounting workflows deepen daily use and improve cash-collection speed.
    - id: workflow-depth
      label: Workflow and AI expansion
      detail: Drafting, AI, and Clio Work extend usage from administration into substantive legal workflow.
    - id: institutional
      label: Institutional and channel expansion
      detail: Law schools, clinics, and legal-aid programs add future-user familiarity and adjacent public-interest use cases.
    - id: upmarket
      label: Enterprise orchestration
      detail: Operate and enterprise messaging move the customer journey toward multi-office governance and complex workflow control.
  approximationNotes: This journey map synthesizes channel, product, and named-customer evidence; it illustrates public adoption surfaces rather than an observed median timeline or measured drop-off rate.
  claimRefs:
