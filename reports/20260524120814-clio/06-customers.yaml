- id: expansion-vectors-and-concentration-risk
  title: Expansion vectors, concentration risk, and what remains unknown
  body: The best-supported expansion vectors are workflow depth and channel breadth. Named proof repeatedly centers on payments, billing, drafting, AI-assisted work, and operational control, which suggests Clio can expand accounts after initial adoption through finance, automation, and enterprise orchestration layers. Academic and legal-aid programs also matter because they create future-user familiarity and adjacent segments beyond private law firms, while bar-association partnerships reduce acquisition friction in the SMB core. What public evidence does not show is equally important. There is no retained public disclosure on top-customer concentration, enterprise contract length, renewal cadence, or segment-level retention. Public named proof is also skewed toward SMB, mid-market, and institutional references rather than revenue-weighted large-firm accounts. So the customer chapter supports a real land-and-expand story, but not a fully underwritten conclusion on concentration or churn.
    Investors should treat those as diligence asks, not as solved facts.
