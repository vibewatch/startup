- id: direct-suite-competition
  title: 'Direct suite competition: SMB through midmarket'
  body: 'Among direct suites, the clearest segmentation is by price posture and workflow specialization. MyCase and PracticePanther are the most obvious public-price challengers to Clio''s SMB base: both publish lower annual entry points than Clio while still marketing payments, client communication, and core case-management functionality. Smokeball and LEAP compete less on lowest sticker price and more on document-heavy productivity, Microsoft 365 familiarity, and automation depth. Filevine and Centerbase push farther toward customization, operations control, and process-heavy firms that are willing to tolerate sales-led procurement instead of self-serve packaging. That means Clio''s direct risk is not that one rival perfectly matches every feature, but that each rival wins a narrower buyer story more cleanly: lower price, stronger document automation, deeper customization, or tighter accounting operations. The detailed matrix and pricing table therefore matter more than generic feature-counting,
    because the buying battle changes by segment.'
