- id: adjacent-ai-and-substitutes
  title: AI and legal-operations encroachment above the core stack
  body: 'The most important encroachment risk is above Clio''s historical core, not below it. Thomson Reuters is using Practical Law and CoCounsel to combine research, drafting, and document analysis, while Relativity is deepening review, investigations, regulatory response, and breach workflows. Those tools do not replace routine billing, intake, or trust accounting, but they are precisely the kinds of workflows that matter in larger firms and corporate legal departments, where budget authority is larger and AI willingness is rising. That matters because mid-sized adoption is no longer hypothetical: Law Times reported a jump from 19% to 93% AI usage in one year for mid-sized firms, and Clio''s own trend release said AI usage across legal professionals reached 79%. Internal build remains the quieter substitute. Microsoft 365, SharePoint, and Power Automate can cover document storage, permissions, and workflow assembly for firms with legal-ops resources, even if they lack packaged legal accounting
    and client-experience layers.'
