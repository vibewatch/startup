- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Risk / moat factor
  - Primary threat source
  - Severity
  - Why it matters
  - Current read
  - Mitigation / diligence ask
  rows:
  - - SMB price compression
    - MyCase and PracticePanther
    - High
    - Lower published entry prices can narrow Clio's lead in owner-operated firms
    - Material risk
    - Track discounting, add-on attachment, and small-firm win rates versus transparent rivals
  - - Document-heavy specialization
    - Smokeball and LEAP
    - Medium
    - Firms with heavy forms, templates, and document-driven work may value specialization over generality
    - Meaningful but segment-specific
    - Validate Clio Draft and automation adoption in document-heavy cohorts
  - - Midmarket customization gap
    - Filevine and Centerbase
    - High
    - Ops-heavy firms can pay more for configurable workflows, reporting, and service-led deployment
    - Most important direct upmarket risk
    - Request implementation timelines, admin tooling, and reference wins or losses in 20-200 lawyer firms
  - - AI feature commoditization
    - Every named direct peer plus Thomson Reuters and Relativity
    - High
    - AI is now common enough that it no longer separates vendors on its own
    - Active compression of feature moat
    - Focus diligence on grounded outcomes, governance, and adoption rather than feature-count marketing
  - - Research / review encroachment
    - Thomson Reuters and Relativity
    - Medium
    - These platforms can capture higher-value workflows inside larger firms even when Clio retains core PM
    - Adjacency risk above core SMB
    - Measure overlap between Clio enterprise pipeline and knowledge-work budgets
  - - Payments parity
    - MyCase, PracticePanther, Smokeball, LEAP, Centerbase
    - Medium
    - Integrated payments are widespread, so Clio must win on execution and economics rather than availability alone
    - Real but manageable
    - Ask for payment adoption, collections lift, and attach-rate data by segment
  - - Internal-build alternative
    - Microsoft 365 + SharePoint + Power Automate
    - Medium
    - Firms with IT depth may choose control and existing seats over packaged legal software
    - Credible in ops-mature firms
    - Compare internal build total cost with migration, trust accounting, and support costs of legal suites
  - - Switching-cost durability
    - Migration tooling across the category
    - Medium
    - Migration help lowers friction over time and can weaken installed-base moat
    - Moat still present, not permanent
    - Review churn drivers, data portability, and implementation failure rates across core competitors
  notes: Severity is a qualitative underwriting judgment derived from public competitor, review, and market-adoption evidence as of 2026-05-24; mitigation cells are diligence asks rather than claims of internal execution.
