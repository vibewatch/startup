  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-opacity
    missingEvidence: Realized seat, implementation, and discount economics for LEAP, Filevine, Centerbase, Practical Law, and RelativityOne.
    whyItMatters: Without realized pricing, the public comparison can rank transparency but cannot model true midmarket or enterprise total cost of ownership.
    diligencePath: Request live quotes, implementation statements of work, and three customer invoices across SMB, midmarket, and enterprise cohorts.
    relatedQuestionRefs:
    - QP014
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-rate-and-churn
    missingEvidence: Segmented win-loss, churn, and migration-out data for Clio versus MyCase, PracticePanther, Smokeball, Filevine, and Centerbase.
    whyItMatters: Public product pages show packaging, but they do not reveal where Clio is actually losing share or defending pricing by segment.
    diligencePath: Obtain CRM win-loss reports, churn reason codes, and partner or implementation reference calls for the last 12 months.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: ai-attachment-and-usage
    missingEvidence: Actual activation, usage, and ROI data for Clio Manage AI versus AI modules from MyCase, Smokeball, LEAP, Filevine, Thomson Reuters, and Relativity.
    whyItMatters: AI is now table stakes in public messaging, so the real competitive question is which vendor turns AI into recurring usage and retention.
    diligencePath: Request product-analytics dashboards, AI attach rates by segment, and customer references showing measurable workflow outcomes.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: migration-burden
    missingEvidence: Measured implementation timelines, data-portability quality, and failed-migration rates across the direct competitive set and internal-build alternatives.
    whyItMatters: Switching cost is central to moat durability, but public marketing only proves that vendors know migration matters, not whether they execute cleanly.
    diligencePath: Collect implementation retrospectives, professional-services scopes, and customer support escalations from recent migrations into and out of Clio.
    relatedQuestionRefs:
    - QP024
    - QP026
    relatedTableRefs:
    - TP004
