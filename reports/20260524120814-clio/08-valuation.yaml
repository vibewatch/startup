- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence anchor
  - What would change the view
  rows:
  - - 'Pro-thesis: scale and momentum are real'
    - Official sources support >US$200M ARR in 2024, >US$500M ARR in 2026, and profitability at scale.
    - Downgrade if later disclosures show the ARR step-up was driven by low-margin mix or one-time effects rather than durable software expansion.
  - - 'Pro-thesis: Clio now has a stronger enterprise and legal-data moat'
    - ShareDo and Operate move Clio upmarket while vLex and Vincent deepen the AI and legal-content stack.
    - Upgrade only after enterprise references, paid Vincent penetration, and post-vLex expansion are shown in cohort detail.
  - - 'Anti-thesis: US$5B already prices in a lot of the upside'
    - The current 10x ARR framing sits well above the selected public-comp median and above most current workflow-software multiples.
    - A lower entry price or audited premium metrics would narrow that gap.
  - - 'Anti-thesis: disclosure quality is still below what a premium private entry should require'
    - Public sources still do not disclose gross margin, NRR, GRR, revenue mix, debt covenants, or liquidation preferences.
    - A buy call needs audited unit economics, retention, and seniority detail rather than another narrative milestone.
  notes: The table separates company-quality positives from price and evidence objections so the recommendation stays explicitly price-sensitive.
