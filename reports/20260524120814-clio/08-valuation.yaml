  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: Full cap table, liquidation-preference stack, anti-dilution terms, warrant coverage, and debt covenants for the 2025 financing and vLex equity component.
    whyItMatters: A headline US$5B valuation can still produce poor common-equity economics if seniority, debt, or structured terms sit ahead of new investors.
    diligencePath: Request the financing deck, debt term sheet, waterfall model, and legal closing documents before underwriting any headline return math.
    relatedQuestionRefs:
    - QV003
    - QV027
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Segment revenue mix, blended and segment gross margins, NRR, GRR, CAC payback, payments take rate, and AI attach or upsell metrics.
    whyItMatters: Those are the metrics that separate a premium software multiple from a lower-margin payments or services multiple.
    diligencePath: Request the board metric pack and cohort bridge by software, payments, content, and AI products for 2024 through 2026.
    relatedQuestionRefs:
    - QV018
    - QV019
    - QV029
    - QV031
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: enterprise-ai-proof
    missingEvidence: Paid enterprise customer references, Operate cross-sell metrics, Vincent seat penetration, and post-vLex expansion or renewal data.
    whyItMatters: The bull case depends on enterprise and AI monetization becoming repeatable and not just impressive launch messaging.
    diligencePath: Run reference calls with large-firm buyers, review enterprise pipeline conversion, and inspect product-usage cohorts for Vincent and Operate.
    relatedQuestionRefs:
    - QV007
    - QV008
    - QV025
    - QV028
    relatedTableRefs:
    - TV006
  - type: access-blocked
    severity: material
    topic: secondary-price-discovery
    missingEvidence: Clean secondary-market clearing data, mutual-fund mark history with methodology, or signed term-sheet evidence of where a real trade would clear.
    whyItMatters: Public teaser pages mention valuation but do not provide enough transaction detail to confirm that outside buyers would actually clear at US$5B.
    diligencePath: Request broker indications, recent tender or secondary terms, and any fund-mark support tied to the 2025 round.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 public comp coverage
    missingEvidence: Broader legal-tech-specific public comps or directly comparable public legal workflow names remain limited, so the comparable table uses the closest disclosed workflow platforms rather than a perfectly matched universe.
    whyItMatters: The comp table is intentionally partial and investors should treat it as a framing set, not as a mathematically exhaustive peer basket.
    diligencePath: Refresh the public comp set when any direct legal-workflow or legal-AI platform becomes publicly traded or discloses better financials.
    relatedQuestionRefs:
    - QV009
    - QV023
    relatedTableRefs:
    - TV004
