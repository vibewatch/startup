- id: thesis-breakers-and-final-diligence
  title: Thesis-breakers and final diligence asks
  body: 'The final underwriting question is not whether Clio is attractive as a company. It is whether the investor is being paid for what still has to be proven. The buy-upgrade path is evidence-sensitive: either price must come down into a cleaner comp-supported zone, or diligence must show that Clio really does have premium software economics, durable expansion, and a capital structure that does not subordinate new investors to hidden seniority. The thesis-breakers are equally concrete. If renewal and expansion data deteriorate once the platform broadens into AI, content, and enterprise; if Operate and Vincent adoption prove slower or more bespoke than launch messaging implies; if payments or content mix drags margins below what the market expects from premium software; or if public comp multiples compress again, then the 2025 Series G already looks like the price peak rather than a staging point. The diligence agenda should therefore focus less on storytelling and more on audited unit
    economics, cap-table mechanics, and proof that the enterprise-and-AI motion is repeatable.'
