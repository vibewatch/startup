- id: comparable-valuation-bridge
  title: Comparable valuation bridge
  body: 'The cleanest public comp frame for Clio is not generic SMB SaaS and not pure legal-content vendors alone. It is a mixed set of vertical or professional workflow platforms that sit inside regulated or mission-critical operating loops and sometimes layer AI, payments, or trusted data on top. Veeva, Procore, Guidewire, Thomson Reuters, Intapp, and Toast are all imperfect, but the set is directionally useful because it captures the market''s willingness to pay for deeply embedded workflow platforms with varying disclosure quality, margin structures, and end-market regulation. On current public data, those comps span roughly 1.8x to 8.7x EV-sales, with the median near 5x. That does not mean Clio deserves only 5x: Clio is growing faster than many of them, claims profitability, and has a sharper AI and embedded-payments narrative. But public comps are also more transparent, and private companies usually carry an illiquidity and information discount rather than a premium. That is the crux
    of the chapter. Clio may deserve to trade toward the high end of the public workflow range if its retention, margin, and enterprise proof are exceptional; it is hard to justify a fresh 10x headline entry without seeing that proof.'
