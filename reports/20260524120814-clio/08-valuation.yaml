- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Retention or expansion weakness
    - Cohorts fail to show premium NRR or GRR once enterprise and AI products broaden
    - Breaks the case that Clio deserves a premium multiple above disclosed public comps.
    - Do not upgrade; require cohort data before adding exposure.
  - - Margin disappointment
    - Diligence shows blended margins closer to a payments or mixed-software model than premium SaaS
    - Collapses the argument that a 7x-10x style multiple is justified.
    - Reset valuation bridge toward the lower scenario band.
  - - Enterprise adoption proves bespoke not repeatable
    - Operate or Vincent wins reference logos but not scalable pipeline conversion
    - Turns the enterprise and AI story into narrative rather than durable ARR leverage.
    - Hold or step away until paid usage and renewal proof is supplied.
  - - Capital structure is more investor-unfriendly than the headline suggests
    - Debt covenants, preferences, or ratchets materially subordinate new money
    - Can destroy realized return even if enterprise value holds near the mark.
    - Pause underwriting until the full waterfall is reviewed.
  - - Public comp multiple compression resumes
    - Workflow-software comps reset lower without offsetting Clio growth outperformance
    - Shrinks the supportable private valuation band quickly.
    - Treat as thesis-break for any buy case above the comp bridge.
  notes: Every trigger is observable from diligence materials or future disclosures and links directly to valuation support rather than generic operating risk.
