- id: financing-context-and-evidence-quality
  title: Financing context and evidence quality
  body: 'The valuation story has two distinct legs. First, the 2024 Series F was a scale-up financing: Clio raised US$900 million at US$3 billion and paired the round with a message around integrated payments, AI, international reach, and more than US$200 million of ARR. Second, the 2025 Series G was a strategic-combination financing: US$500 million of new equity, a US$350 million debt facility, and a US$1 billion vLex acquisition that also included stock consideration for Oakley. That distinction matters because the headline valuation rise from US$3 billion to US$5 billion was not just a mark-up on the same business; it was a mark-up on a more ambitious, more levered, and more complex platform narrative. Public evidence also remains materially thinner than the headline valuation suggests. Clio tells the market it is profitable and scaling, but public sources still do not disclose gross margin, NRR, GRR, payments take rate, revenue mix, debt covenants, or liquidation preferences. Open secondary-market
    pages surface only teaser information and incomplete histories, so they do not independently validate the round price. That combination argues for treating the 2025 financing as a strong signal of investor confidence, but not as sufficient evidence that US$5 billion is automatically a fair entry for new capital.'
