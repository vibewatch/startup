- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Key assumptions
  - Implied EV band
  - Headline return logic
  - Probability signal
  rows:
  - - Bull
    - ARR compounds toward ~US$700M-US$800M, retention clears premium thresholds, enterprise adoption is repeatable, and mix still looks software-led despite payments and content.
    - US$6.0B-US$7.2B
    - Only modest-to-good upside from a US$5B entry; better for existing 2024 investors than for new 2025 money.
    - Requires proof that Clio belongs near the top of current workflow-software multiples.
  - - Base
    - Clio remains a winner, but disclosure stays partial and the market treats it as a premium vertical platform rather than a category-exception private asset.
    - US$4.0B-US$5.0B
    - Flat to limited upside at the current headline mark.
    - Most consistent with current public evidence.
  - - Bear
    - Enterprise and AI monetization land slower than hoped, revenue mix looks lower-margin than premium SaaS, or public-comp multiples compress again.
    - US$2.5B-US$3.5B
    - Meaningful downside from the current mark even without a business failure.
    - A repricing case, not a bankruptcy case.
  notes: Bands are enterprise-value ranges based on public comp logic and market-discipline sources; they do not attempt cap-table waterfall math because seniority terms are undisclosed.
