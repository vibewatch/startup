- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Cross-border privacy / confidentiality
    - New privacy notice, regulator inquiry, or missing enterprise AI controls
    - Any material privacy incident involving privileged data, or inability to produce AI/DPA controls for enterprise buyers
    - Pause underwriting until incident scope, contract controls, and remediation are reviewed.
  - - Legal-payments workflow migration
    - Customer-visible disruption around LawPay sunset
    - Support spike, bar-association warnings, or evidence of trust-reconciliation errors after 31 Aug 2026
    - Require migration dashboards and customer references before underwriting payments upside.
  - - Reliability and cloud concentration
    - Repeat incident cadence
    - Two multi-hour incidents in six months, or one incident that materially affects payments or client communication
    - Downgrade conviction and require postmortems plus DR evidence.
  - - Incumbent / AI-native encroachment
    - Competitive win pattern shifts against Clio
    - Clear evidence that CoCounsel, Lexis-Harvey, or Harvey are winning secure legal-workflow adoption while Clio roadmap slips
    - Treat as thesis-break for premium multiple assumptions.
  - - vLex integration + enterprise execution
    - Strategic distraction or margin pressure
    - No credible integration milestones, or enterprise rollout stalls while leverage rises
    - Require a narrower base-case and de-emphasize platform-expansion upside.
  - - Transparency and retention opacity
    - Another major financing or strategic milestone without cohort disclosure
    - Clio continues to market scale without providing retention, concentration, or governance detail in diligence
    - Keep the investment in research-more / track territory rather than upgrading conviction.
  notes: Every trigger is monitorable from future public disclosures, customer diligence, or operational reporting. This table is designed to translate residual risk into a yes/no diligence agenda.
