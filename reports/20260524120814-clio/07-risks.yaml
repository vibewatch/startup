- id: reliability-security-risk
  title: Reliability, security, and platform dependency
  body: 'Officially, Clio’s current operating surface looks healthy: the US status page was green at fetch time and showed 100% uptime across the most visible services for the recent reporting window. Public resilience language also includes AWS multi-region durability, backups, quarterly restoration testing, and region-specific hosting choices. Those are constructive signs, but they do not remove concentration risk. The public dependency picture still clusters heavily around AWS for infrastructure, Azure AI for model processing, Stripe for payments, and Bandwidth for messaging. Because Clio sits in the middle of legal work, even modest incidents can spill quickly into attorney workflow: matter access, billing, payment collection, client communication, and court-adjacent task execution all depend on the same cloud surface. Independent trackers matter here because they show that outages are not hypothetical. Multiple 2025-2026 incidents reached hours rather than minutes, including January
    2026 latency and email-delivery problems. Public review surfaces also show that customer frustration appears not just around downtime but around support responsiveness, pricing friction, and change fatigue, which can amplify the effect of any operational stumble. The main unresolved issue is that public material does not show multi-cloud failover or equivalent hard recovery commitments.'
