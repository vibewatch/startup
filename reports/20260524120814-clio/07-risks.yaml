- id: mitigations-and-kill-criteria
  title: Mitigations, residual exposure, and kill criteria
  body: 'Clio does have credible mitigants. The public security stack is mature for a private SaaS company, the company is transparent enough to publish live status pages and a detailed subprocessor list, and the firm has enough capital to absorb real operating investment. Those strengths prevent this chapter from collapsing into a simple “avoid” call. The problem is residual exposure, not absence of mitigation. Privacy controls are only as strong as Clio’s contract terms and customer deployment practices in the jurisdictions that matter most. Payments risk will stay elevated until the LawPay sunset is absorbed without trust-account confusion or support spikes. Reliability risk will stay elevated until investors see either cleaner incident trends or more concrete disaster-recovery evidence. Strategic risk will stay elevated until Clio shows that vLex integration and Operate expansion are improving, not distracting from, the core platform while legal-AI incumbents keep moving. The most monitorable
    kill criteria are therefore concrete and external: repeated multi-hour incidents, visible payment-workflow disruption, new privacy or confidentiality notices, or a clear pattern that rival full-stack legal-AI routes are winning secure enterprise adoption faster than Clio’s roadmap can respond.'
