  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disaster-recovery-architecture
    missingEvidence: Enterprise disaster-recovery architecture, recovery-time objectives, and any multi-cloud or regional-failover commitments beyond the public AWS geo-redundancy language.
    whyItMatters: Repeated workflow outages can directly stop billing, client messaging, and court-facing work for firms that treat Clio as their operating system.
    diligencePath: Request the latest DR runbook, recovery test summaries, customer SLA schedules, and any board-level incident postmortem materials.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: retention-opacity
    missingEvidence: Cohort-level NRR, GRR, gross churn, customer concentration, payment-volume concentration, and migration-retention data tied to major product changes.
    whyItMatters: Public growth headlines do not show whether enterprise expansion, pricing changes, or payment-workflow changes are harming underlying customer durability.
    diligencePath: Request board decks or data-room exports with cohort retention, concentration by customer and processor, and migration-support ticket trends.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: governance-succession
    missingEvidence: Documented CEO succession planning, board committee charters for risk and audit, and executive depth for the vLex and Operate programs.
    whyItMatters: Clio remains visibly founder-led while attempting a debt-backed integration and further enterprise expansion, so leadership continuity matters to execution quality.
    diligencePath: Request the governance package, succession memo, org charts for key product and integration leaders, and minutes from recent risk reviews.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: enterprise-ai-contracts
    missingEvidence: Customer-facing contract language for AI-vendor audit rights, prompt retention, subprocessor change notice periods, and customer approval workflows.
    whyItMatters: Public security claims are useful but do not substitute for the contractual controls enterprise buyers will require when privileged data touches AI or subprocessors.
    diligencePath: Review the enterprise MSA, DPA, AI addendum, and any redline history for recent regulated-customer deals.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: dependency-register-completeness
    missingEvidence: The full current vendor inventory, concentration by spend or traffic, and service-specific SLA terms for payment, messaging, and AI vendors.
    whyItMatters: The public subprocessor list is helpful but it is not the same as a ranked internal critical-vendor register with incident exposure or failover commitments.
    diligencePath: Request the internal critical-vendor register and compare it against the public subprocessor list and recent incident tickets.
    relatedQuestionRefs:
    - QR018
    - QR030
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: lawpay-transition-impact
    missingEvidence: Actual customer adoption, support-load, churn, trust-account reconciliation errors, and alternative payment-path outcomes tied to the LawPay sunset.
    whyItMatters: Legal-payments configuration mistakes can become both operational disruptions and ethics-compliance failures for the firms Clio serves.
    diligencePath: Request product migration dashboards, customer communications, support escalation metrics, and incident trends before and after 31 August 2026.
    relatedQuestionRefs:
    - QR014
    - QR029
    relatedTableRefs:
    - TR003
    - TR005
