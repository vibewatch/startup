      - number: '1.3'
        title: Capital history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Clio’s financing path is unusually well documented for a private legal-tech company. The July 2024 Series
              F round brought in US$900 million at a US$3 billion valuation, led by NEA with Goldman Sachs Asset
              Management, Sixth Street Growth, CapitalG, and Tidemark joining the round, while TCV, JMI Equity, OMERS,
              and T. Rowe Price-advised funds/accounts remained in the syndicate. Multiple retained sources also tie
              that financing to a step-up in operating scale: more than US$200 million of ARR, profitability, 1,100+
              employees, 1,000+ mid-sized US firms, and expanding payments and AI ambitions. Publicly available
              materials then move the company forward again by late 2025, when JMI and Clio-linked press materials
              describe a US$500 million Series G at a US$5 billion valuation alongside the US$1 billion vLex
              acquisition. The practical read-through is that Clio has attracted a syndicate of crossover and
              software-growth investors willing to fund both organic product expansion and strategic M&A, but public
              materials still stop short of disclosing current ownership percentages, control terms, or a full
              board-rights matrix.
