      - number: '8.2'
        title: Financing context and evidence quality
        blocks:
          - type: paragraph
            body: >-
              The valuation story has two distinct legs. First, the 2024 Series F was a scale-up financing: Clio raised
              US$900 million at US$3 billion and paired the round with a message around integrated payments, AI,
              international reach, and more than US$200 million of ARR. Second, the 2025 Series G was a
              strategic-combination financing: US$500 million of new equity, a US$350 million debt facility, and a US$1
              billion vLex acquisition that also included stock consideration for Oakley. That distinction matters
              because the headline valuation rise from US$3 billion to US$5 billion was not just a mark-up on the same
              business; it was a mark-up on a more ambitious, more levered, and more complex platform narrative. Public
              evidence also remains materially thinner than the headline valuation suggests. Clio tells the market it is
              profitable and scaling, but public sources still do not disclose gross margin, NRR, GRR, payments take
              rate, revenue mix, debt covenants, or liquidation preferences. Open secondary-market pages surface only
              teaser information and incomplete histories, so they do not independently validate the round price. That
              combination argues for treating the 2025 financing as a strong signal of investor confidence, but not as
              sufficient evidence that US$5 billion is automatically a fair entry for new capital.
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV044
              - CV045
              - CV049
              - CV054
              - CV055
              - CV056
      - number: '8.3'
        title: Comparable valuation bridge
        blocks:
          - type: paragraph
            body: >-
              The cleanest public comp frame for Clio is not generic SMB SaaS and not pure legal-content vendors alone.
              It is a mixed set of vertical or professional workflow platforms that sit inside regulated or
              mission-critical operating loops and sometimes layer AI, payments, or trusted data on top. Veeva, Procore,
              Guidewire, Thomson Reuters, Intapp, and Toast are all imperfect, but the set is directionally useful
              because it captures the market's willingness to pay for deeply embedded workflow platforms with varying
              disclosure quality, margin structures, and end-market regulation. On current public data, those comps span
              roughly 1.8x to 8.7x EV-sales, with the median near 5x. That does not mean Clio deserves only 5x: Clio is
              growing faster than many of them, claims profitability, and has a sharper AI and embedded-payments
              narrative. But public comps are also more transparent, and private companies usually carry an illiquidity
              and information discount rather than a premium. That is the crux of the chapter. Clio may deserve to trade
              toward the high end of the public workflow range if its retention, margin, and enterprise proof are
              exceptional; it is hard to justify a fresh 10x headline entry without seeing that proof.
            claimRefs:
