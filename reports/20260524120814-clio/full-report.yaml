  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Retention or expansion weakness
        - Cohorts fail to show premium NRR or GRR once enterprise and AI products broaden
        - Breaks the case that Clio deserves a premium multiple above disclosed public comps.
        - Do not upgrade; require cohort data before adding exposure.
      - - Margin disappointment
        - Diligence shows blended margins closer to a payments or mixed-software model than premium SaaS
        - Collapses the argument that a 7x-10x style multiple is justified.
        - Reset valuation bridge toward the lower scenario band.
      - - Enterprise adoption proves bespoke not repeatable
        - Operate or Vincent wins reference logos but not scalable pipeline conversion
        - Turns the enterprise and AI story into narrative rather than durable ARR leverage.
        - Hold or step away until paid usage and renewal proof is supplied.
      - - Capital structure is more investor-unfriendly than the headline suggests
        - Debt covenants, preferences, or ratchets materially subordinate new money
        - Can destroy realized return even if enterprise value holds near the mark.
        - Pause underwriting until the full waterfall is reviewed.
      - - Public comp multiple compression resumes
        - Workflow-software comps reset lower without offsetting Clio growth outperformance
        - Shrinks the supportable private valuation band quickly.
        - Treat as thesis-break for any buy case above the comp bridge.
    notes: >-
      Every trigger is observable from diligence materials or future disclosures and links directly to valuation support
      rather than generic operating risk.
    claimRefs:
      - CV037
      - CV038
      - CV040
      - CV049
      - CV050
      - CV051
      - CV057
      - CV058
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Cap table and debt stack
        - Preference waterfall, anti-dilution, warrants, and debt covenants
        - Headline EV is not realized return without seniority clarity.
        - Finance lead plus counsel; review signed closing docs and waterfall model.
      - - Revenue mix and gross margin
        - Software, payments, content, and AI contribution plus blended and segment margins
        - The comp bridge changes materially if Clio is a mixed-margin platform rather than premium software.
        - CFO diligence pack and audited segment bridge.
      - - Retention quality
        - NRR, GRR, cohort churn, and expansion by product and customer segment
        - Premium multiples depend on durable expansion, not just logo count or top-line growth.
        - Board metrics pack and cohort exports.
      - - Enterprise proof
        - Operate pipeline conversion, reference calls, and post-vLex enterprise renewals
        - The bull case depends on repeatable upmarket adoption.
        - Sales leadership review and customer references.
      - - AI attach and monetization
        - Paid Vincent usage, attach rates, pricing, and usage-based economics
        - The legal-AI moat only matters if it becomes monetized, retained, and margin-accretive.
        - Product and GTM review with usage dashboards.
      - - Secondary and exit readiness
        - Recent secondary indications, banker feedback, and IPO or strategic-preparation materials
        - Needed to judge whether US$5B is a financeable mark or just a negotiated primary-round print.
        - Board observer materials and broker checks.
    notes: These asks are prioritized around valuation-moving unknowns rather than broad diligence hygiene.
    claimRefs:
      - CV049
      - CV054
      - CV055
      - CV056
      - CV057
