      - number: '5.2'
        title: Architecture, integrations, and developer surface
        blocks:
          - type: paragraph
            body: >-
              Clio exposes enough public technical surface to describe an operating model, but not enough to
              reverse-engineer internal architecture. The visible stack is a workflow platform centered on Manage data,
              with upstream intake APIs in Grow, a document-automation layer in Draft, a payments layer attached to
              billing and trust accounting, and an ecosystem layer reached through the App Directory, open API,
              OAuth-based “Add to Clio” flow, and developer portals. Public docs and the GitHub sample matter because
              they show concrete implementation primitives rather than marketing abstractions: region-specific
              endpoints, cursor-based pagination, 401 or 403 or 429 handling, SSO with Clio Identity, and a documented
              callback flow that begins and ends within Clio Manage. That is enough to support a specific
              product-architecture map and a clear dependency view. It is not enough to support deeper claims about
              event buses, databases, queueing, model orchestration, or internal service boundaries. The diligence
              conclusion is that Clio does have a meaningful builder surface and a real integration ecosystem, but the
              most important architecture risk is still hidden: how reliably these layers stay synchronized as the
              company adds AI actions, new integrations, and larger-firm workflow complexity.
