      - number: '7.3'
        title: Competition and dependency transmission
        blocks:
          - type: paragraph
            body: >-
              The hardest strategic risk to underwrite is not a single feature gap but a full-stack squeeze. Clio is
              trying to own more of the legal workflow through AI, vLex, payments, and the Operate enterprise push, yet
              the incumbents and AI-native challengers are also consolidating. Thomson Reuters is no longer defending
              legacy research with static databases alone; it markets CoCounsel at million-user scale and has already
              folded the former Casetext route into its core platform. LexisNexis is doing the same by linking its legal
              content to Harvey workflows, while Harvey itself markets directly to leading law firms as a secure
              professional AI workspace. This matters because legal buyers increasingly want fewer systems that combine
              matter context, trusted content, drafting, and workflow automation. Public evidence also shows Clio’s own
              vendor dependencies are not cosmetic. AWS, Azure AI, Stripe, Bandwidth, and the legacy LawPay path all sit
              on the transmission path from product promise to customer experience. If any one of those edges weakens
              during Clio’s upmarket push, the effect can propagate into collections, delivery quality, or enterprise
              credibility faster than a normal SaaS integration hiccup.
