  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, privacy, and payments risk
        blocks:
          - type: paragraph
            body: >-
              Clio’s public posture on trust and compliance is stronger than a generic SMB SaaS vendor’s, but the
              company operates inside a profession whose customers are themselves regulated custodians of privileged
              data and client money. Clio says AI data is not used to train external models, publishes encryption and
              regional-hosting commitments, and publicly claims GDPR, PIPEDA, PCI DSS, HIPAA, and SOC attestations. That
              is real mitigation, not marketing fluff. The risk is that these safeguards do not remove the customer-side
              legal burden: Clio’s own terms place lawful use responsibility on subscribers, its privacy policy still
              contemplates cross-border transfers, and its subprocessor list shows reliance on external vendors for
              hosting, AI, payments, and messaging. Canadian expansion makes that more complex because Clio’s own
              guidance points customers to PIPEDA and Quebec Law 25, while Quebec’s statute requires privacy-impact
              assessments and adequate-protection findings before data moves outside Québec. Payments adds a parallel
              obligation. Trust-account rules treat fee flow and ledger timing as ethics issues, so the announced LawPay
              integration sunset turns a previously familiar compliance workflow into a migration risk rather than a
              mere product update.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR009
