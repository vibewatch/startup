      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder identity is reasonably well corroborated. Clio’s own materials and later coverage support a 2008
              founding by Jack Newton and Rian Gauvreau, and the live leadership page still identifies Newton as Chief
              Executive Officer and founder. That same page also shows an executive bench built for scaled SaaS
              operations rather than a founder-only organization: Ronnie Gurion is COO, Curt Sigfstead is CFO, Jonathan
              Watson is CTO, and Clio now lists enterprise-facing roles such as GM, US Enterprise and GM for Clio
              Operate. Governance visibility is only partial, however. The July 2024 Series F materials clearly
              establish that NEA co-CEO Tony Florence joined the board, and LawNext reported that co-founder Rian
              Gauvreau had left the company in 2021 while remaining on the board. What is not public in the retained
              primary-source set is a current, complete board roster with committee structure or ownership-linked
              governance rights. That keeps key-person dependence centered on Newton and leaves board-composition
              diligence unfinished despite otherwise strong evidence on executive continuity.
