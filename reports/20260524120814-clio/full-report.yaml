      - number: '4.3'
        title: Likely unit economics and margin drivers
        blocks:
          - type: paragraph
            body: >-
              Clio does not publish CAC, payback, NRR, gross margin, or transaction volume, so the unit-economics case
              has to be reconstructed from product mechanics and public benchmarks. Those benchmarks suggest a familiar
              software-plus-payments profile. Stripe's 2025 vertical SaaS benchmark says payment attach rates are rising
              quickly, while WindsorDrake argues that embedded-fintech leaders often derive 30% to 40% of revenue from
              payments and other financial services, with take rates of roughly 2.5% to 3.5% and payment gross margins
              below pure software gross margins. BILL's results show how large transaction and float lines can become
              inside a workflow platform, even when the business still reports strong overall gross margins. For Clio,
              that implies a likely mix of high-margin seat subscriptions and lower-margin but high-retention payments
              revenue. Shopify's 2025 free-cash-flow performance reinforces the broader lesson that integrated
              software-plus-payments businesses can remain cash generative at scale. What remains unknowable in public
              is where Clio itself sits on that spectrum. There is no public disclosure of blended gross margin, revenue
              mix, payments volume, NRR, or CAC payback, so any hard underwriting model would still need management
              data-room access.
