      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              The buyer map is fragmented by firm size and by whether the legal team sits inside a law firm or a broader
              enterprise. In solo practices the owner is usually the buyer, daily user, and economic payer, so adoption
              is highly sensitive to visible ROI in intake, billing, and collections. Small firms are similar, but they
              more often split usage across lawyers and support staff and can justify modest software budgets when
              workflow gains are obvious. Mid-sized firms are operationally different. Clio's 2025 mid-market materials
              say these firms invest about 2% of expenses in software, use many more billing rates, and are more willing
              than smaller firms to experiment with flat fees or subscriptions. Yet only 38% use legal practice
              management software, suggesting that the budget exists even when the stack remains fragmented.


              Upmarket, the purchase path becomes committee-driven. Clio now markets directly to large law firms and
              corporate legal departments, framing the value around standardizing operations, controlling spend, and
              generating faster, defensible answers. CLOC's 2026 data reinforces that buying logic: technology strategy,
              financial management, and vendor management have become core legal-ops priorities, while outside-counsel
              spend is no longer the automatic pressure valve. MyCase's 2025 AI analysis also shows that firms with 51
              or more lawyers adopt legal-specific generative-AI tools at roughly double the rate of sub-50-lawyer
              firms, reflecting stronger IT support, governance capacity, and integration budgets. The practical
              implication for Clio is that there is no single "legal buyer." Sales motion must match the segment:
              owner-operator ROI for solo and small firms, integration and margin logic for mid-sized firms, and
              governance plus standardization for enterprise buyers.
