      - number: '4.4'
        title: Capital adequacy, debt, and growth spending
        blocks:
          - type: paragraph
            body: >-
              The public financing record suggests Clio is not capital-constrained for routine operations, but it is
              also no longer a simple bootstrapped SaaS cash-flow story. Clio's 2024 Series F priced the business at
              US$3 billion, and the 2025 vLex transaction plus Series G lifted the valuation to US$5 billion. JMI says
              the 2025 package included US$500 million of fresh primary equity and a US$350 million debt facility
              alongside the US$1 billion vLex acquisition. Management also continues to describe the company as
              profitable. Put together, that points to strong near-term operating solvency. The harder question is
              capital allocation discipline. The latest public capital appears aimed at enterprise expansion, AI product
              buildout, and M&A, not at proving that the core law-firm SaaS engine can fund itself without external
              financing. Public sources still do not disclose cash on hand, burn, runway, or debt covenants. That means
              investors can see headline firepower but cannot test downside resilience, refinancing risk, or the actual
              cash cost of integrating vLex and expanding enterprise go-to-market.
