  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Clio has crossed the threshold where valuation discipline matters more than admiration. The company now
              looks like a real category leader: the official record supports a move from more than US$200 million of
              ARR in 2024 to more than US$500 million in 2026, management says the business is profitable, and the
              platform increasingly spans payments, AI, research, and enterprise workflow. Those are buyable company
              traits. They are not automatically a buyable price. The current valuation context matters: the 2024 Series
              F set a US$3 billion anchor and the 2025 Series G reset that to US$5 billion just as Clio absorbed vLex
              and added debt. At the official 2026 ARR milestone, that is roughly a 10x ARR valuation, which is above
              the median public workflow-software comp set and already discounts a lot of the enterprise and AI upside
              that still needs harder proof. The chapter recommendation is therefore TRACK with medium confidence, high
              risk, and a stretched valuation stance. The right stance is not that Clio lacks quality; it is that new
              money at US$5 billion is underwriting nearly flawless execution with too little public disclosure margin
              for error.
            claimRefs:
              - CV001
              - CV003
              - CV009
