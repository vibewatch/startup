      - number: '8.4'
        title: Bull, base, and bear underwriting
        blocks:
          - type: paragraph
            body: >-
              The scenario logic is straightforward. The bull case assumes Clio turns the 2025 and 2026 narrative into
              auditable proof: enterprise adoption holds up, Vincent and vLex increase paid attach, margins look
              software-like despite payments, and retention clears the premium thresholds that market-data sources still
              reward. In that world, the current price can work, but even then the upside from a US$5 billion starting
              point is more moderate than the company-quality story might suggest. The base case is less forgiving and,
              in this chapter, more realistic: Clio is a real winner, yet the public evidence does not clear the bar for
              paying a premium to premium comps. That points to a fairer underwriting zone around US$3.5 billion to
              US$5.0 billion, not a confident chase above it. The bear case is not operational collapse; it is
              repricing. If Clio's mix or margins look more like a blended software plus payments platform than pure
              premium SaaS, if enterprise ramp is slower than hoped, or if AI competition compresses willingness to pay,
              then a 5x-style multiple can still produce very material downside from the current headline entry.
            claimRefs:
              - CV036
              - CV037
