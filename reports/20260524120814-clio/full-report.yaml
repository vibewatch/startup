      - number: '3.4'
        title: Switching costs, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Clio's moat is real, but it is narrower than a simple market-share story suggests. The durable pieces are
              workflow breadth, ecosystem depth, and the operational pain of moving billing, documents, client
              communication, and intake all at once. Even competitors market migration help and onboarding because
              replacing a core practice-management system is disruptive. The weak spots are equally visible in public
              sources. AI is now table stakes across direct suites and adjacents, so Clio cannot rely on AI branding
              alone. Payments are also widespread, which means the better differentiation question is whether Clio turns
              payments, accounting, and ecosystem data into better execution than rivals do. Adverse review sources
              sharpen the risk: SelectHub highlights integration bugs, slow loading, and complaints about
              payment-processing costs, while CounselStack says firms most often leave because of price, complexity,
              missing built-in accounting, or specialized-practice gaps. The underwriting conclusion is moderate moat
              durability, not winner-take-all defensibility. That leaves Clio defensible only if platform breadth
              converts into visible operating ROI.
            claimRefs:
              - CP036
