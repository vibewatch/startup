              broader legal-intelligence platform. That said, chapter-1 diligence should not treat the public story as
              frictionless. Retained sources disagree on whether Clio Payments launched in 2021 or 2022, public
              security-monitoring sources expose only summary-level posture, and IsDown logged a May 2026 outage that it
              marked as never acknowledged. Those do not overturn the growth narrative, but they do argue for focused
              follow-up on operating resilience, governance transparency, and the exact chronology of Clio’s fintech
