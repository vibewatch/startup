              The milestone record shows a company widening along several axes at once: product breadth, customer
              segment, capital access, and AI depth. The 2024 Series F announcement positioned Clio as the legal
              operating system, pushed its disclosed scale above US$200 million of ARR, and highlighted payments, AI,
