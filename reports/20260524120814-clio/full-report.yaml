      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers all connect to monetizable workflow pain. Solo and small firms see
              immediate upside from intake and payments tooling: Clio links digital intake to higher leads, conversions,
              and revenue, while LawPay and 8am show that integrated payments improve collection speed and revenue
              capture. Mid-sized firms face a different pressure set. They want AI productivity and pricing flexibility,
              but fragmented point tools leave data trapped across billing, documents, research, and client
              communications. Law Times summarized the issue well: mid-sized firms can support non-billable ops roles,
              which makes AI easier to introduce, yet the absence of a central practice-management hub limits full
              automation value. At the enterprise end, CLOC and Thomson Reuters both show a legal function under rising
              compliance, cybersecurity, and workload pressure, which makes software a capacity lever rather than a
              discretionary experiment.


              The constraint set is equally clear. Pricing models are in transition, but not finished: Thomson Reuters
              said 90% of legal dollars still flow through hourly billing even as AI spreads, so firms must unlearn
              revenue models that reward time rather than outcomes. Ethics, privacy, and confidentiality are not
              abstract objections. ABA Formal Opinion 512 requires lawyers using generative AI to address competence,
              confidentiality, candor, supervision, and fee reasonableness, while Wolters found ethics/data privacy and
              training were the top reported barriers to implementation. Secretariat added cost and hallucinations to
              the list, and CLOC showed that legal departments are responding by formalizing AI oversight rather than
              rolling out tools informally. For Clio, that means market growth should continue, but adoption speed will
              depend on how well products combine ROI proof, secure data handling, change management, and cross-workflow
              integration.
