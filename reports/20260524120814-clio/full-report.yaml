  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core suite coverage and operating workflow
        blocks:
          - type: paragraph
            body: >-
              Clio’s strongest public product fact pattern is not a single feature but a connected workflow. Manage
              anchors the system of record for cases, contacts, deadlines, documents, billing, payments, and client
              communication; Grow sits upstream to capture and qualify leads; Draft sits downstream to turn firm data
              into reusable templates, questionnaires, forms, and e-signature packets. The practical product judgment is
              that Clio is trying to remove re-entry and context switching across the law-firm lifecycle rather than win
              as a best-of-breed point tool in only one step. Public claims on the current Manage, Grow, Draft, and
              Payments surfaces are concrete enough to describe real workflow touchpoints: intake forms sync into
              matters, draft invoices can be AI-assisted, payment requests travel by text or portal, and document data
              can flow from Manage into Draft templates. Those linkages matter more than headline “AI” branding because
              they show where Clio’s product breadth can translate into operational stickiness. They also explain why
              implementation risk rises with product breadth: the more Clio promises across intake, billing,
              communications, and drafting, the more buyers depend on clean data flow, permissions, and rollout
              discipline across modules.
