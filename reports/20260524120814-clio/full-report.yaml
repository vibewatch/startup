  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and segment positioning
        blocks:
          - type: paragraph
            body: >-
              Clio sits in a three-layer competitive field rather than a single one-to-one comparison set. The direct
              layer is cloud legal practice-management software for law firms: MyCase, PracticePanther, Smokeball, LEAP,
              Filevine, and Centerbase all market combinations of case or matter management, billing, documents, and
              increasingly AI. The adjacent layer is made up of legal-intelligence and enterprise-review vendors such as
              Thomson Reuters and Relativity, which do not replace front-office practice management cleanly but can
              displace the higher-value research, drafting, review, and compliance workflows that justify upmarket
              spend. The substitute layer is status quo plus internal build: firms already paying for Microsoft 365 can
              assemble SharePoint and Power Automate into a workable document-and-workflow backbone, especially when
              they care more about control than out-of-box legal specialization. Clio's own positioning is broader than
              in earlier SMB-only narratives because the current public surface spans $49 self-serve plans, 250+
              integrations, Manage AI, and an enterprise page for large firms.
