      - number: '2.2'
        title: Sizing lenses and demand signals
        blocks:
          - type: paragraph
            body: >-
              Public market sizing should be read as a set of contradictory lenses, not a clean TAM/SAM/SOM formula. For
              broad legal technology, Grand View estimated a 2025 market of US$28.7 billion, Precedence put 2025 at
              US$29.8 billion, and Mordor put 2025 at US$34.2 billion before stepping to US$38.7 billion in 2026. The
              spread is not random noise: Grand View explicitly includes law societies, judiciaries, corporate legal
              departments, private law firms, legal-aid providers, and product developers, while Precedence and Mordor
              publish different segment mixes and forecast windows. Legal AI is even less settled. Grand View's 2025
              market value is about US$1.75 billion, MarketsandMarkets says US$3.11 billion, Fortune Business Insights
              says US$4.02 billion, and Market Research Future says roughly US$5.03 billion. The right conclusion is not
              that one estimate is "correct"; it is that buyers are already spending on overlapping categories whose
              definitions diverge sharply.


              Adoption data is more coherent than spend estimates. Clio's 2025 solo/small-firm report shows broad
              interest but cautious deployment: only 8% of solo lawyers and 4% of small firms have adopted AI widely or
              universally, even though more than 80% expect AI use to rise. Mid-sized firms are much further along: Clio
              said adoption rose from 19% to 93% in one year, with over half using AI widely or universally. In-house
              demand also looks durable. CLOC said 83% of legal departments expected demand to rise in 2025, and its
              2026 release said 85% of departments now have dedicated AI oversight or resources. For valuation, that
              makes Clio's market attractive not because one analyst prints a giant TAM, but because every segment is
              being pushed toward workflow software, AI, or both.
