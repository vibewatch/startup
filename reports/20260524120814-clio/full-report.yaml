    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and current footprint
        blocks:
          - type: paragraph
            body: >-
              Clio presents itself as the operating system for law firms: a cloud-based platform that combines client
              intake, matter management, document workflows, billing, payments, accounting, and newer AI-enabled work
              tools in one product family. The company’s own current web surfaces point to a larger footprint than its
              2024 financing materials: the homepage and About page show 400,000+ legal professionals using Clio across
              130+ countries, while the app directory advertises 300+ app integration partners. The older Series F
              materials still matter because they anchor how quickly Clio scaled: in July 2024 the company was
              describing itself as used by 150,000+ legal professionals, in 130+ countries, with 250+ integrations and
              over US$200 million of ARR. That makes the key overview judgment straightforward: Clio is no longer best
              described as only a small-firm practice-management vendor. Its public narrative now spans solo lawyers,
              teams of 500+, big-law and corporate legal teams, and AI-centered workflows, even though some operating
              details such as a refreshed standalone headcount are not publicly updated in the retained source set.
