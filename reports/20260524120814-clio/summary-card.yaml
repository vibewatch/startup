summary:
  headline: >-
    Clio is a scaled, profitable legal-workflow leader with genuine product breadth and customer reach, but the current
    US$5 billion valuation (about 10x ARR) and persistent disclosure gaps support only a track stance.
  overallScore: 6.3
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
