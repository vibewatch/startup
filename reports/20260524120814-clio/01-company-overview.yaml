company:
  name: Clio
chapter:
  number: 1
  title: Company Overview
  summary: Clio is a 2008-founded legal software company led by co-founder Jack Newton, with its public contact surface anchored in Burnaby, British Columbia and its current website showing 400,000+ legal professionals across 130+ countries and 300+ app partners. Public financing materials document a jump from a US$900 million Series F at a US$3 billion valuation in July 2024 to a disclosed US$500 million Series G at a US$5 billion valuation by late 2025, but current headcount, full board composition, and some product-timeline details remain incomplete in public sources.
sections:
- id: identity-and-footprint
  title: Identity, product, and current footprint
  body: 'Clio presents itself as the operating system for law firms: a cloud-based platform that combines client intake, matter management, document workflows, billing, payments, accounting, and newer AI-enabled work tools in one product family. The company’s own current web surfaces point to a larger footprint than its 2024 financing materials: the homepage and About page show 400,000+ legal professionals using Clio across 130+ countries, while the app directory advertises 300+ app integration partners. The older Series F materials still matter because they anchor how quickly Clio scaled: in July 2024 the company was describing itself as used by 150,000+ legal professionals, in 130+ countries, with 250+ integrations and over US$200 million of ARR. That makes the key overview judgment straightforward: Clio is no longer best described as only a small-firm practice-management vendor. Its public narrative now spans solo lawyers, teams of 500+, big-law and corporate legal teams, and AI-centered
    workflows, even though some operating details such as a refreshed standalone headcount are not publicly updated in the retained source set.'
  claimRefs:
