- id: milestones-risks-and-open-items
  title: Milestones, risks, and open diligence items
  body: 'The milestone record shows a company widening along several axes at once: product breadth, customer segment, capital access, and AI depth. The 2024 Series F announcement positioned Clio as the legal operating system, pushed its disclosed scale above US$200 million of ARR, and highlighted payments, AI, and international expansion. The 2025 mid-sized law-firm report reinforced segment traction, showing 93% AI adoption in that cohort and reiterating that more than 1,000 mid-sized firms rely on Clio. The late-2025 vLex acquisition and Series G round indicate a deliberate move from workflow software toward a broader legal-intelligence platform. That said, chapter-1 diligence should not treat the public story as frictionless. Retained sources disagree on whether Clio Payments launched in 2021 or 2022, public security-monitoring sources expose only summary-level posture, and IsDown logged a May 2026 outage that it marked as never acknowledged. Those do not overturn the growth narrative,
    but they do argue for focused follow-up on operating resilience, governance transparency, and the exact chronology of Clio’s fintech stack.'
