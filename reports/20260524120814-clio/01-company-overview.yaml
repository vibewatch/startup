- id: leadership-and-governance
  title: Leadership and governance
  body: 'Founder identity is reasonably well corroborated. Clio’s own materials and later coverage support a 2008 founding by Jack Newton and Rian Gauvreau, and the live leadership page still identifies Newton as Chief Executive Officer and founder. That same page also shows an executive bench built for scaled SaaS operations rather than a founder-only organization: Ronnie Gurion is COO, Curt Sigfstead is CFO, Jonathan Watson is CTO, and Clio now lists enterprise-facing roles such as GM, US Enterprise and GM for Clio Operate. Governance visibility is only partial, however. The July 2024 Series F materials clearly establish that NEA co-CEO Tony Florence joined the board, and LawNext reported that co-founder Rian Gauvreau had left the company in 2021 while remaining on the board. What is not public in the retained primary-source set is a current, complete board roster with committee structure or ownership-linked governance rights. That keeps key-person dependence centered on Newton and leaves
    board-composition diligence unfinished despite otherwise strong evidence on executive continuity.'
  claimRefs:
  - CO001
  - CO002
  - CO014
  - CO032
  - CO033
  - CO034
  tableRefs:
  - TO002
- id: capital-history-and-stakeholders
  title: Capital history and stakeholder map
  body: 'Clio’s financing path is unusually well documented for a private legal-tech company. The July 2024 Series F round brought in US$900 million at a US$3 billion valuation, led by NEA with Goldman Sachs Asset Management, Sixth Street Growth, CapitalG, and Tidemark joining the round, while TCV, JMI Equity, OMERS, and T. Rowe Price-advised funds/accounts remained in the syndicate. Multiple retained sources also tie that financing to a step-up in operating scale: more than US$200 million of ARR, profitability, 1,100+ employees, 1,000+ mid-sized US firms, and expanding payments and AI ambitions. Publicly available materials then move the company forward again by late 2025, when JMI and Clio-linked press materials describe a US$500 million Series G at a US$5 billion valuation alongside the US$1 billion vLex acquisition. The practical read-through is that Clio has attracted a syndicate of crossover and software-growth investors willing to fund both organic product expansion and strategic
    M&A, but public materials still stop short of disclosing current ownership percentages, control terms, or a full board-rights matrix.'
  claimRefs:
