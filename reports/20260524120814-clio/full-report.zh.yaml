      - number: '8.3'
        title: 可比估值桥
        blocks:
          - type: paragraph
            body: >-
              对 Clio 来说，最干净的公开可比框架不是泛 SMB SaaS，也不只是纯法律内容供应商，而是一组嵌入受监管或任务关键运营回路的垂直 / 专业工作流平台；它们有时还叠加
              AI、支付或可信数据。Veeva、Procore、Guidewire、Thomson Reuters、Intapp 和 Toast
              都不完美，但这个集合方向上有用，因为它捕捉了市场愿意给深度嵌入工作流平台多少估值，同时这些公司在披露质量、利润率结构和终端市场监管上各不相同。按当前公开数据，这些可比公司的 EV-sales 大约在 1.8x 到
              8.7x 之间，中位数接近 5x。这不是说 Clio 只配 5x：Clio 增速快过其中许多公司，声称盈利，并有更锋利的 AI
              与嵌入支付叙事。但公开可比公司也更透明，而私营公司通常应有流动性和信息折价，不该有溢价。本章核心就在这里。若留存、利润率和企业客户证据都异常出色，Clio
              也许应该向公开工作流区间高端交易；但在看不到这些证据前，很难为新的 10x 头部入场价辩护。
