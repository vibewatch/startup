        title: 监管、隐私和支付风险
        blocks:
          - type: paragraph
            body: >-
              从公开材料看，Clio 在信任与合规上的姿态强于普通 SMB SaaS 厂商，但它服务的是一个特殊行业：客户本身就是受监管的受托人，保管特权数据和客户资金。Clio 称 AI
              数据不会用于训练外部模型，公开承诺加密和区域托管，并对外宣称符合 GDPR、PIPEDA、PCI DSS、HIPAA 以及 SOC
              认证。这些是实质缓释，不是营销话术。风险在于，这些保障措施不能消除客户侧法律负担：Clio
              自己的条款把合法使用责任放在订阅者身上，隐私政策仍预计跨境传输，子处理方名单也显示，托管、AI、支付和消息环节都依赖外部供应商。加拿大扩张让问题更复杂。Clio 自己的指南把客户引向 PIPEDA 和
              Quebec Law 25，而 Québec 法律要求，数据离开 Québec 前必须完成隐私影响评估，并确认保护充分性。支付又叠加一条义务。信托账户规则把费用流和账本时点视为职业伦理问题，因此已宣布的
              LawPay 集成下线，会把过去熟悉的合规工作流变成迁移风险，而不只是一次产品更新。
