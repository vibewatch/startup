  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与细分定位
        blocks:
          - type: paragraph
            body: >-
              Clio 处在三层竞争场，而不是单一一对一比较集。直接层是面向律所的云端法律执业管理软件：MyCase、PracticePanther、Smokeball、LEAP、Filevine 和 Centerbase
              都在销售案件或事项管理、计费、文档，以及越来越多 AI 的组合。相邻层由 Thomson Reuters 和 Relativity
              等法律智能和企业审阅供应商组成；它们不能干净替代前台执业管理，却会抢走更高价值的研究、起草、审阅和合规工作流，这些正是支撑上行市场支出的部分。替代层则是现状加内部自建：已经为 Microsoft 365
              付费的律所，可以把 SharePoint 和 Power Automate 拼成可用的文档与工作流骨干，尤其是在它们更看重控制权而不是开箱即用的法律专门化时。Clio 自己的定位也比早期只讲 SMB
              的叙事更宽，因为当前公开表面覆盖 US$49 自助套餐、250+ 个集成、Manage AI，以及面向大型律所的企业页面。
