  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Clio 已经跨过了一个门槛：估值纪律比欣赏公司更重要。公司如今像真正的品类领导者：官方记录支持年经常性收入（ARR）从 2024 年超过 US$200 million 增至 2026 年超过 US$500
              million，管理层称业务已经盈利，平台也越来越覆盖支付、AI、研究和企业工作流。这些都是值得买的公司特质，但不自动等于值得买的价格。当前估值背景很关键：2024 年 Series F 给出 US$3
              billion 锚点，2025 年 Series G 在 Clio 吸收 vLex 并增加债务时把锚点抬到 US$5 billion。按官方 2026 年 ARR 里程碑计算，这大约是 10x ARR
              估值，高于公开工作流软件可比公司的中位数，也已经折进了大量仍需更硬证据的企业化和 AI 上行空间。因此，本章建议为观察，置信度中，风险高，估值立场偏高。正确姿态不是说 Clio 没有质量，而是说 US$5
              billion 的新钱在承销近乎无瑕的执行，而公开披露留给错误的余地太小。
