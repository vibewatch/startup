      - number: '7.2'
        title: 可靠性、安全与平台依赖
        blocks:
          - type: paragraph
            body: >-
              按官方口径，Clio 当前运行面看起来健康：抓取时美国状态页为绿色，最近报告窗口内最显眼服务均显示 100% 正常运行时间。公开韧性表述还包括 AWS
              多区域耐久性、备份、季度恢复测试和按地区选择托管。这些都是正面信号，但不能消除集中度风险。公开依赖仍高度集中在 AWS 基础设施、Azure AI 模型处理、Stripe 支付和 Bandwidth
              消息。Clio
              位于法律工作的中枢，即便事故不大，也会迅速外溢到律师工作流：事项访问、计费、收款、客户沟通以及法院相关任务执行，都靠同一片云端表面支撑。独立跟踪器很重要，因为它们说明宕机并非假设。2025–2026
              年多起事故不是几分钟，而是持续数小时，包括 2026 年 1
              月的延迟和邮件投递问题。公开评论渠道也显示，客户不满不只围绕停机，还包括支持响应、价格摩擦和变化疲劳，这会放大任何运营失误的影响。最大的未解问题是，公开材料没有展示多云故障转移，或等同强度的硬恢复承诺。
