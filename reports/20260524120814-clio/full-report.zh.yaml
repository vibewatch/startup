      - number: '2.2'
        title: 规模测算视角与需求信号
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据应被看成一组彼此矛盾的观察镜头，而不是干净的 TAM/SAM/SOM 公式。广义法律科技方面，Grand View 估计 2025 年市场为 US$28.7 billion，Precedence
              给出 US$29.8 billion，Mordor 给出 2025 年 US$34.2 billion，并在 2026 年升至 US$38.7 billion。差异并非随机噪音：Grand View
              明确纳入律师协会、司法机构、企业法务部门、私营律所、法律援助机构和产品开发商，而 Precedence 与 Mordor 使用不同的细分组合和预测窗口。Legal AI 更不稳定。Grand View 的
              2025 年市场值约为 US$1.75 billion，MarketsandMarkets 给出 US$3.11 billion，Fortune Business Insights 给出 US$4.02
              billion，Market Research Future 则约为 US$5.03 billion。正确结论不是某一个估计“正确”，而是买方已经在重叠品类上花钱，而这些品类定义分歧很大。


              采用数据比支出估计更一致。Clio 的 2025 年独立律师 / 小型律所报告显示，兴趣广泛但部署谨慎：即便超过 80% 预计 AI 使用会上升，只有 8% 的独立律师和 4% 的小型律所广泛或全面采用
              AI。中型律所走得更远：Clio 称采用率一年内从 19% 升至 93%，超过半数广泛或全面使用 AI。企业法务需求也看起来稳固。CLOC 称 83% 的法务部门预计 2025 年需求会上升，2026 年发布则称
              85% 的部门现在已有专门 AI 监督或资源。对估值而言，Clio 的市场有吸引力，并不是因为某个分析师给出一个巨大 TAM，而是因为每个细分市场都被推向工作流软件、AI，或两者兼有。
