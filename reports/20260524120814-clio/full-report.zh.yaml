  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 有向图展示隐私、支付、可靠性和战略竞争风险如何传导到客户信任、留存、ARR 增长和估值。
    data:
      nodes:
        - id: privacy-miss
          label: 跨境隐私或保密失误
          detail: PIPEDA / 魁北克义务或部署控制，在受监管客户工作流中失效
        - id: lawpay-sunset
          label: LawPay 迁移中断
          detail: 旧有支付工作流中断，或造成信托账户混乱
        - id: service-incident
          label: 反复服务事件
          detail: 宕机或性能退化冲击访问、计费、支付或沟通
        - id: incumbent-ai
          label: 现有厂商 / AI 原生法律栈胜出
          detail: Thomson Reuters、Lexis-Harvey 或 Harvey 拿下安全法律工作流预算
        - id: customer-trust
          label: 客户信任流失
          detail: 律所开始质疑可靠性、保密性或工作流连续性
        - id: collections-friction
          label: 收款与现金流摩擦
          detail: 支付中断拖慢计费和补款
        - id: retention-pressure
          label: 留存 / 扩张压力
          detail: 更高支持负担或竞争流失会体现在队列中
        - id: arr-growth
          label: ARR 增长放缓
          detail: 新销售和扩张相对计划走弱
        - id: valuation-pressure
          label: 估值与治理压力
          detail: 高溢价私募市场叙事失去支撑
      edges:
        - from: privacy-miss
          to: customer-trust
        - from: lawpay-sunset
          to: collections-friction
        - from: service-incident
          to: customer-trust
        - from: incumbent-ai
          to: retention-pressure
        - from: customer-trust
          to: retention-pressure
        - from: collections-friction
          to: retention-pressure
        - from: retention-pressure
          to: arr-growth
        - from: arr-growth
          to: valuation-pressure
    approximationNotes: 该 DAG 是定性图，省略了反馈回路，例如 ARR 增长放缓进一步削弱人才留存或支持能力。它只展示一阶传导路径。
