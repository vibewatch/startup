  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据锚点
      - 什么会改变判断
    rows:
      - - 正向逻辑：规模和动能真实存在
        - 官方来源支持 2024 年年经常性收入（ARR）>US$200M、2026 年 >US$500M，且已在规模化阶段盈利。
        - 如果后续披露显示 ARR 跃升来自低利润率组合或一次性因素，而不是可持续的软件扩张，则下调。
      - - 正向逻辑：Clio 现在有更强的企业级和法律数据护城河
        - ShareDo 和 Operate 推动 Clio 上探市场，vLex 和 Vincent 加深 AI 与法律内容栈。
        - 只有在企业客户推荐、Vincent 付费渗透率以及 vLex 后扩张以队列细节呈现后，才上调。
      - - 反向逻辑：US$5B 已经计入大量上行
        - 当前 10x ARR 的框架明显高于所选公开可比公司的中位数，也高于多数当前工作流软件倍数。
        - 更低进入价格或经审计的溢价指标会收窄这一差距。
      - - 反向逻辑：披露质量仍低于溢价私募进入应有标准
        - 公开来源仍未披露毛利率、NRR、GRR、收入结构、债务契约或清算优先权。
        - 买入判断需要经审计的单位经济、留存和优先级细节，而不是又一个叙事里程碑。
    notes: 该表把公司质量的正面因素同价格和证据反对意见拆开，因此建议保持明确的价格敏感性。
