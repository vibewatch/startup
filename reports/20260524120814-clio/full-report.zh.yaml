  - id: TV005
    title: 投资逻辑破裂和终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 留存或扩张疲弱
        - 企业级和 AI 产品拓宽后，队列无法显示溢价 NRR 或 GRR
        - 打破 Clio 应获得高于已披露公开可比公司的溢价倍数这一判断。
        - 不上调；增加敞口前要求队列数据。
      - - 利润率不及预期
        - 尽调显示混合利润率更接近支付或混合软件模式，而非溢价 SaaS
        - 推翻 7x-10x 风格倍数合理的论证。
        - 将估值桥接重置到更低情景区间。
      - - 企业级采用被证明是定制项目而非可复制
        - Operate 或 Vincent 赢得参考客户，但无法带来可规模化的管线转化
        - 企业级和 AI 故事从可持续 ARR 杠杆变成叙事。
        - 先持有或退出，直到提供付费使用和续约证明。
      - - 资本结构比表面信息显示得更不利于投资人
        - 债务契约、优先权或棘轮条款实质性压低新资金地位
        - 即使企业价值维持在当前标记附近，也可能摧毁实际回报。
        - 暂停承销，直到完整瀑布经过复盘。
      - - 公开可比公司倍数再次压缩
        - 工作流软件可比公司下调，而 Clio 增长跑赢不足以抵消
        - 可支撑的私有估值区间会迅速收缩。
        - 对任何高于可比公司桥接的买入情景，都视为投资逻辑破裂。
    notes: 每个触发项都可从尽调材料或未来披露中观察，并直接连接到估值支撑，而不是泛泛的经营风险。
    claimRefs:
      - CV037
      - CV038
      - CV040
      - CV049
      - CV050
      - CV051
      - CV057
      - CV058
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和债务堆叠
        - 优先权瀑布、反稀释、认股权证和债务契约
        - 没有优先级清晰度，名义 EV 不等于实际回报。
        - 财务负责人加法律顾问；复盘已签署交割文件和瀑布模型。
      - - 收入结构和毛利率
        - 软件、支付、内容和 AI 贡献，以及混合和分部利润率
        - 如果 Clio 是混合利润率平台，而不是溢价软件，可比公司桥接会大幅变化。
        - CFO 尽调包和经审计的分部桥接。
      - - 留存质量
        - NRR、GRR、队列流失，以及按产品和客户分部拆分的扩张
        - 溢价倍数依赖可持续扩张，而不只是 logo 数或收入增长。
        - 董事会指标包和队列导出。
      - - 企业级证明
        - Operate 管线转化、推荐访谈和 vLex 后企业续约
        - 乐观情景依赖可复制的上探市场采用。
        - 销售领导层复盘和客户推荐。
      - - AI 挂钩和变现
        - Vincent 付费使用、挂钩率、定价和按量计费经济性
        - 法律 AI 护城河只有在变现、留存且增厚利润率后才有意义。
        - 产品和 GTM 复盘，配合使用仪表盘。
      - - 老股交易和退出准备
        - 近期老股指示价、投行反馈，以及 IPO 或战略准备材料
        - 需要判断 US$5B 是可融资标记，还是只是谈判出来的新股轮定价。
        - 董事会观察员材料和经纪人核查。
    notes: 这些要求围绕会移动估值的未知项排序，而不是泛泛的尽调基本项。
    claimRefs:
      - CV049
      - CV054
      - CV055
      - CV056
      - CV057
