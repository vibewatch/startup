    sections:
      - number: '1.1'
        title: 身份、产品与当前覆盖
        blocks:
          - type: paragraph
            body: >-
              Clio 把自己定义为律所操作系统：一个云端平台，把客户接洽、案件管理、文档工作流、计费、支付、会计和新的 AI 工作工具放进同一产品族。公司当前网页显示的规模已大于 2024 年融资材料：主页和 About
              页显示，Clio 在 130+ 个国家被 400,000+ 名法律专业人士使用，应用目录则宣称有 300+ 个应用集成伙伴。旧的 Series F 材料仍然重要，因为它给出了 Clio 扩张速度的锚点：2024
              年 7 月，公司称有 150,000+ 名法律专业人士使用，覆盖 130+ 个国家，拥有 250+ 个集成，ARR 超过 US$200 million。因此，公司概况层面的关键判断很直接：Clio
              不再只是小型律所执业管理供应商。它的公开叙事已经覆盖独立律师、500+ 人团队、大型律所和企业法务团队，以及以 AI 为中心的工作流；不过，独立员工数等部分运营细节，在本次保留来源中还没有更新。
