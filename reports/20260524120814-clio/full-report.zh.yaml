      - number: '7.4'
        title: 人员、治理与跨境执行风险
        blocks:
          - type: paragraph
            body: >-
              Clio 的规模故事很亮眼，但同一组事实也抬高了执行负担。公司一边完成 US$1 billion 的 vLex 收购、拿到 US$500 million 新股权融资和 US$350 million
              债务工具，一边把 Clio Operate 推向北美企业市场，同时继续加深加拿大本地化。单看每一步都合理；放在一起，就是一组集成、招聘、支持和治理需求的组合。公开材料中，创始人兼 CEO Jack Newton
              仍高度绑定 Clio 的外部形象，这有利于连续性，但关键人物风险也仍然显著。已审阅的公开材料也没有披露详细 CEO
              接班计划、董事会层面的风险委员会结构，或外部投资人在承销这种扩张时通常想看的留存和集中度指标。评论场并不灾难，但确实显示客户对成本、退款处理和支持速度敏感。这点很重要：一家私营公司可以给出很强的头部估值，同时外部人仍看不清企业扩张、产品打包或支付变化是否在重要队列里埋下隐藏流失。
