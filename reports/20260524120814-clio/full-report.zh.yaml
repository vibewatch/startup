  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与公开牵引
        blocks:
          - type: paragraph
            body: >-
              Clio 的公开收入模型比传统法律执业订阅更宽。公司仍围绕按用户计费的软件层级锚定价格，但官方页面现在把支付、AI、会计、接洽、文档自动化，以及企业 /
              法律智能模块叠在核心系统周围。这很重要，因为最新的公司公布财务里程碑已经大幅高于历史法律科技基线：Clio 称其在 2026 年突破 US$500 million
              ARR，同时保持盈利并加速增长。TechCrunch 和 Sacra 都强化了同一方向，描述 ARR 从 2024 年约 US$200 million 跳到 2025 年末超过 US$400 million，并在
              2026 年约达 US$500 million。公开牵引信号也更像平台故事，而不是单功能工具。Clio 称其服务 130+ 个国家的数十万法律专业人士，应用目录仍宣称 250+ 个集成。实际财务读法是，Clio
              的收入顶线很可能混合了经常性软件席位、支付带来的交易费收入，以及 AI 和企业工作流的更高 ARPU 增购；但公司没有公开披露各收入流占比。
