      - number: '2.3'
        title: 买方、用户与付款方地图
        blocks:
          - type: paragraph
            body: >-
              买方地图按律所规模、法律团队是否位于律所内部还是更大的企业内部而碎片化。独立执业场景下，所有者通常同时是买方、日常用户和经济付款方，因此采用高度依赖获客、计费和收款上的可见
              ROI。小型律所类似，但使用更常分散在律师和支持人员之间；只要工作流收益清楚，就能为适度软件预算找到理由。中型律所在运营上不同。Clio 的 2025 年中端市场材料称，这些律所将约 2%
              的费用投入软件，使用更多计费费率，也比小型律所更愿意尝试固定费用或订阅。但只有 38% 使用法律执业管理软件，说明预算存在，栈却仍然碎片化。


              往高端走，采购路径变成委员会驱动。Clio 现在直接面向大型律所和企业法务部门营销，把价值讲成标准化运营、控制支出，以及更快产出可辩护答案。CLOC 2026
              年数据强化了这一购买逻辑：技术战略、财务管理和供应商管理已成为法律运营的核心优先级，外部律师支出不再是默认泄压阀。MyCase 2025 年 AI 分析也显示，51 名及以上律师的律所采用法律专用生成式 AI
              工具的比例约为 50 人以下律所的两倍，反映出更强的 IT 支持、治理能力和集成预算。对 Clio 的实际含义是，不存在单一“法律买方”。销售动作必须匹配细分市场：独立和小型律所要看经营者能直接看到的
              ROI，中型律所要集成和利润逻辑，企业买方要治理加标准化。
