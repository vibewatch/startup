      - number: '5.3'
        title: 信任、AI 治理与可靠性姿态
        blocks:
          - type: paragraph
            body: >-
              Clio 的信任姿态在控制类别上强于技术具体性。安全页面对一家私营 SaaS 供应商而言详尽得少见：列出 24/7/365 监控、SAML SSO、MFA、TLS 1.2+、AES-256、备份、AWS
              上的地理冗余、数据托管、季度恢复测试、SOC 1 Type II、SOC 2 Type II、年度渗透测试，并支持 GDPR、PCI DSS、HIPAA 义务和 PIPEDA。它还给出一组强于平均水平的 AI
              保证，包括客户数据不用于训练模型、保持特定地区存放，并受现有权限控制；Duo 发布又增加了关于引用来源、审计日志、提示注入护栏和 AI
              动作可追踪性的明确主张。弱点不是没有控制语言，而是控制语言与独立可审计性之间有缺口。Clio
              自己的公开状态页很简略，第三方监控则记录了近期事件和确认滞后。这意味着公开尽调可以支持合理的安全控制姿态，但还不能以同等信心独立承销 SLO 纪律、AI 模型治理深度或事件响应质量。
