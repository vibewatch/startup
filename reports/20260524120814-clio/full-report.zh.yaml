        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开财务结论好于披露质量。Clio 看起来已经从细分法律 SaaS 供应商跨过门槛，成为规模化平台：有可信的经常性收入、嵌入式支付邻接、明确的企业扩张，以及该品类少见的深厚资本可得性。按隐含倍数看，公司不如
              2024 年那么紧绷，因为 ARR 增速快于估值增速。话虽如此，仅靠公开证据，本章无法完成完整承销。关键阻碍是精确收入组合、支付量、实际 抽成率、混合及分部毛利率、NRR、CAC
              回本周期、现金余额、月度烧钱、现金跑道和债务条款。低端定价批评也重要，因为它暗示最小律所群体的价格敏感度可能高于 Clio 标题增长故事所暗示的水平。因此，实际尽调结论是平衡的：Clio
              可能有足够资本继续投入，但投资人仍需要私有运营数据来判断，支付和 AI 是否在比支持、上线辅导、收款和集成复杂度更快地扩大客户终身价值。
