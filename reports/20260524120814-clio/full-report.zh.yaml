  - id: FE001
    title: 产品架构地图
    type: stack
    layout: wide
    summary: 公开可见的 Clio 架构，把进件、核心执业管理、起草、支付、AI、集成和企业编排叠在共享工作流系统之上。
    approximationNotes: 这个技术栈综合了公开产品、文档和发布材料；并不声称掌握隐藏内部服务或数据库。
    data:
      layers:
        - id: engagement
          label: 客户获取与进件层
          detail: Grow 表单、网站、预约、电子邮件营销、Local Services Ads 和冲突检查，把潜在客户带入工作流。
        - id: core-record
          label: 核心执业管理记录系统
          detail: Manage 承载案件、联系人、截止日期、任务、文档、沟通、报告、账单和支持信托账户的工作流。
        - id: document
          label: 文档自动化层
          detail: Draft 把客户和案件数据转成模板、问卷、法院表格和电子签名包。
        - id: payments
          label: 账单与支付层
          detail: 账单、提醒、客户门户支付、短信请求、付款计划、会计同步和信托保护，都嵌在财务工作流里。
        - id: ai
          label: AI 动作与法律工作层
          detail: Manage AI / Duo 在核心工作流中执行上下文感知动作；新的 Work 和 Vincent 发布则把研究和起草推向相邻界面。
        - id: ecosystem
          label: API 与生态层
          detail: App Directory 列表、Add to Clio OAuth 流程、按地区划分的开发者门户和 SSO 示例，把核心平台延伸到合作伙伴工具。
        - id: enterprise
          label: 企业编排层
          detail: Operate 把技术栈向高端市场延展，用大型律所工作流编排和单一控制台管理复杂法律运营。
        - id: trust
          label: 信任与可靠性底座
          detail: 身份、SSO、MFA、加密、会话日志、AI 动作日志、备份、AWS 地理冗余、合规认证和公开状态页支撑整个技术栈。
