      - number: '8.2'
        title: 融资背景与证据质量
        blocks:
          - type: paragraph
            body: >-
              估值故事有两条不同主线。第一，2024 年 Series F 是规模化融资：Clio 以 US$3 billion 估值融资 US$900 million，并把这轮融资与集成支付、AI、国际覆盖和超过
              US$200 million ARR 的叙事绑定。第二，2025 年 Series G 是战略组合融资：US$500 million 新股权、US$350 million 债务工具，以及 US$1 billion
              的 vLex 收购；交易还包括给 Oakley 的股票对价。这个区别很重要，因为头部估值从 US$3 billion 升至 US$5
              billion，并不只是同一业务上的加价；它是在一个更雄心勃勃、更有杠杆、更复杂的平台叙事上加价。公开证据也明显薄于头部估值所暗示的水平。Clio
              告诉市场自己盈利且在扩张，但公开来源仍未披露毛利率、NRR、GRR、支付抽成率、收入结构、债务契约或清算优先权。开放的二级市场页面只给出预告式信息和不完整历史，因此无法独立验证轮次价格。这个组合支持把 2025
              年融资视为投资人信心的强信号，但不足以证明 US$5 billion 自动就是新资金的公平入场价。
            claimRefs:
              - CV001
