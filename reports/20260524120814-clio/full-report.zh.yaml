      - number: '8.5'
        title: 投资逻辑破坏条件与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              最终承销问题不是 Clio 作为公司是否有吸引力，而是投资人是否因那些仍待证明的事项获得了足够补偿。买入升级路径高度依赖证据：要么价格降到更干净、由可比公司支撑的区间，要么尽调证明 Clio
              确实具备高端软件经济性、持久扩张能力，以及不会让新投资人被隐藏高级权利压后的资本结构。投资逻辑的破坏条件同样具体。如果平台扩展到 AI、内容和企业后，续约和扩张数据恶化；如果 Operate 和 Vincent
              的采用慢于发布话术，或更依赖定制；如果支付或内容组合把利润率拖到低于市场对高端软件的预期；或者如果公开可比倍数再次压缩，那么 2025 年 Series G
              就已经像价格峰值，而不是下一阶段起点。尽调清单因此应少听故事，多看已审计单位经济、股权结构机制，以及企业化 + AI 动作可复制的证据。
