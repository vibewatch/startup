      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强采用驱动都连着可变现的工作流痛点。独立律师和小型律所能从接洽和支付工具中马上看到上行空间：Clio 把数字接洽与更多线索、更高转化和更多收入相连，LawPay 与 8am
              则显示集成支付能加快收款、提升收入捕获。中型律所面对另一组压力。它们想要 AI 生产力和定价灵活性，但碎片化点工具把数据锁在计费、文档、研究和客户沟通各处。Law Times
              对问题的概括很到位：中型律所有能力支持非计费运营岗位，因此更容易引入 AI；但缺少中心化执业管理枢纽，会限制完整自动化价值。在企业端，CLOC 和 Thomson Reuters
              都显示法律职能承受越来越高的合规、网络安全和工作量压力，因此软件是容量杠杆，不是可有可无的实验。


              约束同样清楚。定价模型在转换，但还没有完成：Thomson Reuters 称，即便 AI 扩散，90%
              的法律美元仍流经小时计费，因此律所必须摆脱按时间而非结果收费的收入模型。伦理、隐私和保密也不是抽象反对意见。ABA Formal Opinion 512 要求使用生成式 AI
              的律师处理胜任能力、保密、坦诚、监督和收费合理性；Wolters 则发现伦理 / 数据隐私和培训是实施中被报告最多的障碍。Secretariat 又把成本和幻觉加入清单，CLOC 显示法务部门正通过正式化 AI
              监督来回应，而不是非正式铺开工具。对 Clio 而言，市场增长应会持续，但采用速度取决于产品能否同时拼好 ROI 证明、安全数据处理、变革管理和跨工作流集成。
