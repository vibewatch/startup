              创始人身份有较充分交叉验证。Clio 自有材料和后续报道都支持 Jack Newton 与 Rian Gauvreau 在 2008 年创立公司，现有领导层页面仍列明 Newton
              为首席执行官（CEO）和创始人。同一页面也显示，Clio 的高管班底已面向规模化 SaaS 运营，而不是只有创始人：Ronnie Gurion 任 COO，Curt Sigfstead 任
              CFO，Jonathan Watson 任 CTO，公司还列出美国企业业务 GM 和 Clio Operate GM 等面向企业市场的岗位。但治理透明度只到一半。2024 年 7 月 Series F
