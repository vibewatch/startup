  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Clio 的可服务市场窄于“法律服务”，但宽于传统案件管理。最能自洽的边界包括云端律所执业管理套件、客户接洽和 CRM、计费和支付工作流，以及更新的法律 AI
              层：它在律所和法务部门内部自动化起草、研究、文档审阅和合规工作。当企业法律运营工具由同一法律买方采购，或能减少同一类工作流瓶颈时，合同生命周期管理、eDiscovery
              和合规软件等相邻品类也会被触及。同样重要的是排除项：全部法律服务费、纯人工咨询服务、通用办公生产力软件，以及永远不会转化为法律工作流采购的大型企业 IT 预算。


              公开买方宇宙数据支持把这里视作工作流市场，而不是单一支出池。ABA 统计，截至 2024 年 1 月，美国活跃律师有 1,322,649 名；BLS 统计 2024 年律师岗位为 864,800 个，其中 51%
              在法律服务业。ACC 的追踪数据又把企业法务视为从总数中扣除律所和政府律师后的剩余买方类别。这对 Clio
              很重要，因为整套栈中的购买逻辑会变化：独立律师和小型律所通常为减少线索流失、更快收款而购买；中型律所为统一碎片化系统而购买；大型律所或企业法务部门则为治理、标准化和可辩护的 AI 工作流而购买。因此，第 2
              章的市场框架应是“面向律所和法务部门的法律工作流软件”，而不是所有与法律执业相关的支出。
            claimRefs:
