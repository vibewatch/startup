        - Williams and Hamilton 以及中型律所报告证据显示，AI 和起草流程正在加深使用
        - 没有群组数据，AI 热情不等于持久付费留存
        - 重要交叉销售和向上销售杠杆，尤其适用于正在现代化的律所
        - 要求 AI 附加率、付费转化，以及相对非 AI 账户的续约差异
      - - 企业 / Operate 上探
        - Operate 发布和 Leigh Day 案例显示，真实的高端市场先落地再扩张动作已经出现
        - 具名大型律所证明仍然单薄，合同经济性未披露
        - 如果可复制，可能显著扩大 ACV
        - 要求具名企业客户、ACV 区间和服务强度
