      - number: '8.4'
        title: 乐观、基准与悲观承销
        blocks:
          - type: paragraph
            body: >-
              情景逻辑很直接。乐观情景假设 Clio 把 2025 和 2026 年叙事变成可审计证据：企业客户采用站得住，Vincent 和 vLex
              提高付费附加率，尽管有支付业务，利润率仍像软件公司，留存也越过市场数据来源仍会奖励的溢价门槛。在这个世界里，当前价格可以跑通；但即便如此，以 US$5 billion
              起步，上行也比公司质量故事暗示的更温和。基准情景更不宽容，本章也认为更现实：Clio 是真正赢家，但公开证据还不足以支撑向高端可比公司支付溢价。更合理的承销区间应在 US$3.5 billion 到 US$5.0
              billion 左右，而不是自信追高。悲观情景不是运营崩盘，而是重定价。如果 Clio 的业务组合或利润率更像软件加支付的混合平台，而不是纯高端 SaaS；如果企业爬坡慢于预期；或者如果 AI
              竞争压缩付费意愿，那么 5x 式倍数仍可能让当前头部入场价出现非常实质的下行。
