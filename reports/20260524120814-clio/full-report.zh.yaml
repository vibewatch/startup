    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 隐含 EV 区间
      - 名义回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - ARR 复合增长接近 ~US$700M-US$800M，留存越过溢价门槛，企业级采用可复制；尽管有支付和内容，收入组合仍像软件主导。
        - US$6.0B-US$7.2B
        - 从 US$5B 进入只有温和到不错的上行；对 2024 年既有投资人比对 2025 年新资金更有利。
        - 需要证明 Clio 应靠近当前工作流软件倍数的顶部。
      - - 基准
        - Clio 仍是赢家，但披露继续不完整，市场把它视为溢价垂直平台，而不是类别例外的私有资产。
        - US$4.0B-US$5.0B
        - 以当前名义估值标记进入，回报持平到上行有限。
        - 与当前公开证据最一致。
      - - 悲观
