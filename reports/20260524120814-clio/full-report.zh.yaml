        title: 直接套件竞争：SMB 到中端市场
        blocks:
          - type: paragraph
            body: >-
              在直接套件里，最清楚的分层来自价格姿态和工作流专门化。MyCase 和 PracticePanther 是 Clio SMB 基础盘最明显的公开价格挑战者：两者公布的年度入门价都低于
              Clio，同时仍营销支付、客户沟通和核心案件管理功能。Smokeball 和 LEAP 不太靠最低标价竞争，更多靠文档密集型生产力、Microsoft 365 熟悉度和自动化深度竞争。Filevine 和
              Centerbase 则进一步走向定制化、运营控制，以及愿意忍受销售主导采购而非自助包装的流程密集型律所。这意味着 Clio
              的直接风险不是某个对手完美匹配全部功能，而是每个对手都能更干净地赢下一个更窄买方故事：更低价格、更强文档自动化、更深定制化，或更紧密会计运营。因此，详细矩阵和定价表比泛泛数功能更重要，因为购买战场会随细分市场变化。
