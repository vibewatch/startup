      - number: '4.3'
        title: 可能的单位经济性与利润率驱动
        blocks:
          - type: paragraph
            body: >-
              Clio 不披露 CAC、回本周期、NRR、毛利率或交易量，所以单位经济性只能从产品机制和公开基准反推。这些基准指向熟悉的软件加支付画像。Stripe 2025 年垂直 SaaS
              基准称支付附着率在快速上升；WindsorDrake 认为，嵌入式金融科技龙头常有 30% 到 40% 收入来自支付和其他金融服务，              抽成率约 2.5% 到
              3.5%，支付毛利率低于纯软件毛利率。BILL 的业绩显示，交易和浮存金条线在工作流平台内部可以做得很大，即便公司整体仍报告强劲毛利率。对 Clio
              而言，这意味着收入组合很可能由高毛利席位订阅和毛利较低但留存较高的支付收入构成。Shopify 2025 年自由现金流表现强化了更广泛的经验：集成软件加支付业务达到规模后仍可产生现金。公开资料仍无法回答的是
              Clio 自己落在这条光谱的哪里。没有公开披露混合毛利率、收入组合、支付量、NRR 或 CAC 回本周期，任何硬承销模型仍需要进入管理层数据室。
