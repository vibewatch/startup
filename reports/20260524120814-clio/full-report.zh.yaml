        - id: unknown-retention
          label: NRR 与流失未披露
          detail: 公开来源没有显示扩张能否抵消客户流失
        - id: unknown-payback
          label: CAC 回本未披露
          detail: 没有公开的销售效率桥，能拆分 SMB 和企业销售打法
        - id: underwriting-limit
