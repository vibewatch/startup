      - number: '3.3'
        title: AI 与法律运营在核心栈上方侵蚀
        blocks:
          - type: paragraph
            body: >-
              最重要的侵蚀风险在 Clio 历史核心之上，而不是之下。Thomson Reuters 正借 Practical Law 和 CoCounsel 把研究、起草和文档分析组合起来，Relativity
              则加深审阅、调查、监管响应和数据泄露工作流。这些工具不会替代日常计费、接洽或信托账户会计，但它们正是大型律所和企业法务部门看重的工作流；这些买方预算权更大，对 AI
              的接受度也在上升。中型市场采用不再是假设，这一点很关键：Law Times 报道，中型律所 AI 使用率一年内从 19% 跳到 93%；Clio 自己的趋势发布也称法律专业人士 AI 使用率达到
              79%。内部自建仍是更安静的替代品。对于拥有法律运营资源的律所，Microsoft 365、SharePoint 和 Power Automate
              可以覆盖文档存储、权限和工作流组装，即便它们缺少打包好的法律会计和客户体验层。
