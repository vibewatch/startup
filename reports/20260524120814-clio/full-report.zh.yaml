      - number: '7.3'
        title: 竞争与依赖传导
        blocks:
          - type: paragraph
            body: >-
              最难承销的战略风险，不是某一个功能缺口，而是全栈挤压。Clio 试图通过 AI、vLex、支付和 Operate 企业化推进，吃下更多法律工作流；但既有巨头和 AI 原生挑战者也在整合。Thomson
              Reuters 不再只靠静态数据库防守传统法律研究；它以百万用户规模推广 CoCounsel，并已把原 Casetext 路线并入核心平台。LexisNexis 也在把法律内容接入 Harvey
              工作流；Harvey 则直接面向头部律所，营销自己是安全的专业 AI 工作空间。关键在于，法律买方越来越想要更少系统，把事项语境、可信内容、起草和工作流自动化合在一起。公开证据也说明，Clio
              自己的供应商依赖并非表面问题。AWS、Azure AI、Stripe、Bandwidth 和旧 LawPay 路径都位于从产品承诺到客户体验的传导链上。Clio
              上攻高端市场时，只要其中任一边缘变弱，影响就可能比普通 SaaS 集成小故障更快传导到回款、交付质量或企业可信度。
