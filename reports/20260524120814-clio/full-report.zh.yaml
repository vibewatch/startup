  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: Clio 的公开工作流从线索捕获开始，把线索转成案件，在 Manage 和 Draft 内执行工作，再进入账单、支付和持续客户更新。
    approximationNotes: 这是基于当前产品页综合出的工作流；真实部署可能会按律所规模和执业领域跳过或重排步骤。
    data:
      nodes:
        - id: lead
          label: 线索捕获
          detail: Grow 表单、网站、广告和预约捕获潜在客户信息。
        - id: qualify
          label: 资格筛选与冲突检查
          detail: Grow 仪表盘、阶段和冲突检查先筛选线索，再创建案件。
        - id: matter
          label: 在 Manage 中创建案件
          detail: 转换后的线索数据同步进执业管理记录系统。
        - id: work
          label: 工作执行与起草
          detail: Manage 负责日常任务，Draft 则用案件数据生成模板、表格、问卷和签名。
        - id: billing
          label: 开票与审核
          detail: 工时、费用、AI 辅助发票草稿、流转和提醒，为收款做准备。
        - id: payment
          label: 客户支付与信托账户流程
          detail: 客户在支持信托账户的工作流内，通过门户、短信、二维码、银行卡、借记卡、eCheck 或付款计划支付。
        - id: followup
          label: 报告与客户跟进
          detail: 报告、付款通知、客户更新和持续沟通进入下一轮循环。
      edges:
        - from: lead
          to: qualify
          label: 进件数据进入分诊
        - from: qualify
          to: matter
          label: 合格线索转化
        - from: matter
          to: work
          label: 核心法律工作开始
        - from: work
          to: billing
          label: 工作转成可开票产出
        - from: billing
          to: payment
          label: 客户收到账单或请求
        - from: payment
          to: followup
          label: 收款和报告闭环
        - from: followup
          to: matter
          label: 状态更新和后续动作流入进行中案件
