              人团队，并包括企业法务和政府法律团队。这确立的是广度，不是账户经济性。更能帮助决策的分层证据来自 Clio
              围绕核心产品搭建的表面：带有明确律所规模筛选的客户故事索引、独立律师和小型律所报告、中型律所报告、律师协会合作、法学院项目和法律援助产品。这些来源合在一起显示，公司买方地图不再只是“小型律所”。公开证据覆盖业主经营型执业、精品所和中型律所、更大法律团队、法学院诊所，以及非营利法律援助组织。问题是，最强的计数数据仍是公司层面的用户指标，而不是披露的客户数或按细分市场的收入组合。
