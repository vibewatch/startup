        - 即便业务没有失败，当前标记也有明显下行。
        - 这是重定价情景，不是破产情景。
    notes: 区间是基于公开可比公司逻辑和市场纪律来源的企业价值范围；由于优先级条款未披露，不尝试计算股权结构瀑布。
