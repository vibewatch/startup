              年离开公司但留任董事会。本次保留的一手来源没有披露当前完整董事名单、委员会结构或与所有权挂钩的治理权利。关键人依赖因此仍集中在 Newton 身上；尽管高管连续性证据较强，董事会构成尽调仍未完成。
