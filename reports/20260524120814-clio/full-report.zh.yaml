  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心套件覆盖与运营工作流
        blocks:
          - type: paragraph
            body: >-
              Clio 最强的公开产品事实不是单一功能，而是一条连通的工作流。Manage 锚定案件、联系人、截止日期、文档、计费、支付和客户沟通的记录系统；Grow 在上游捕捉并筛选线索；Draft
              在下游把律所数据转成可复用模板、问卷、表单和电子签名包。实际产品判断是，Clio 想减少律所生命周期中的重复录入和上下文切换，而不是只在某一步作为最佳单点工具取胜。当前 Manage、Grow、Draft 和
              Payments 表面上的公开主张足够具体，可以描述真实工作流触点：接洽表单同步到案件事项，草稿发票可由 AI 辅助，付款请求通过短信或门户发送，文档数据可从 Manage 流入 Draft
              模板。这些连接比标题式“AI”品牌更重要，因为它们显示 Clio 的产品广度可以在哪里转化为运营黏性。它们也解释了为什么产品越宽，实施风险越高：Clio
              承诺覆盖接洽、计费、沟通和起草越多，买方就越依赖跨模块的干净数据流、权限和推出纪律。
