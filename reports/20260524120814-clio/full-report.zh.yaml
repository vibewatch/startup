      - number: '5.2'
        title: 架构、集成与开发者表面
        blocks:
          - type: paragraph
            body: >-
              Clio 暴露的公开技术表面足以描述运营模型，但不足以反向拆出内部架构。可见栈是以 Manage 数据为中心的工作流平台：Grow 里的上游 客户接洽 API、Draft
              里的文档自动化层、连接计费和信托账户会计的支付层，以及通过 App Directory、开放 API、基于 OAuth 的 “Add to Clio” 流程和开发者门户触达的生态层。公开文档和 GitHub
              示例重要，因为它们给出具体实施原语，而不是营销抽象：按地区区分的端点、基于游标的分页、401 / 403 / 429 处理、使用 Clio Identity 的 SSO，以及一个从 Clio Manage
              内开始并结束的回调流程。这足以支撑具体产品架构图和清晰依赖视图；但不足以支撑关于事件总线、数据库、队列、模型编排或内部服务边界的更深主张。尽调结论是，Clio
              确实有有意义的开发者接口面和真实集成生态，但最重要的架构风险仍藏在内部：公司加入 AI 动作、新集成和更大律所工作流复杂度时，这些层能否可靠保持同步。
