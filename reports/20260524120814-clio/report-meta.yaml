companyProfile:
  summary: >-
    Clio is a legal-software company founded in 2008 by Jack Newton and Rian Gauvreau. The
    company now presents itself as a cloud-based legal operating system spanning intake, matter
    management, document workflows, billing, payments, accounting, drafting, and newer AI or
    enterprise layers. As of the current public record, Clio says it serves 400,000+ legal
    professionals across 130+ countries, surpassed US$500 million of ARR while profitable in May
    2026, and had reached a US$5 billion valuation in its November 2025 Series G while acquiring
    vLex.
  foundedDate: "2008-01-01"
  founders:
    - name: Jack Newton
      role: CEO and co-founder
      claimRefs: [CO001, CO002]
    - name: Rian Gauvreau
      role: Co-founder; board member as of 2024 reporting
      claimRefs: [CO001, CO032]
  foundingLocation: null
  headquarters: Burnaby, British Columbia
  productSummary: >-
    Clio sells an integrated legal-workflow stack centered on Clio Manage, Clio Grow, Clio Draft,
    Clio Payments, accounting, and newer AI or enterprise products such as Manage AI, Vincent,
    and Clio Operate.
  customerFocus: >-
    Solo practitioners, small firms, mid-sized law firms, large law firms, in-house counsel, and
    government legal teams.
  businessModel: >-
    Seat-based subscription SaaS with monetization layered through payments, drafting,
    accounting, AI-assisted workflows, and enterprise or legal-intelligence upsells.
  stage: Late-stage private (Series G)
  fundingStatus: >-
    US$500 million Series G at a US$5 billion valuation in November 2025, announced alongside the
    US$1 billion vLex acquisition; public materials also reference a US$350 million debt facility.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO004, CO005, CO006, CO025, CO026, CO028, CO029, CV010]
summary:
  headline: >-
    Clio is a scaled, profitable legal-workflow leader with genuine product breadth and customer
    reach, but the current US$5 billion valuation (about 10x ARR) and persistent disclosure gaps
    support only a track stance.
  overallScore: 6.3
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 5000
    revenueRunRateUsdM: null
    arrUsdM: 500
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: null
    customerCount: null
    headcount: 1100
  topStrengths:
    - Broad workflow coverage across intake, matter management, drafting, billing, payments, accounting, and AI-enabled legal work.
    - "Public scale signals are meaningful: 400,000+ legal professionals, 130+ countries, and more than US$500 million of ARR at profitability."
    - Customer proof spans solo, SMB, mid-sized, academic, nonprofit, government, and emerging enterprise legal segments.
    - vLex, Vincent, and Clio Operate create a credible path into higher-value legal-data and enterprise workflows.
  topRisks:
    - The US$5 billion Series G anchor implies roughly 10x ARR, above the selected public-comp median despite thinner disclosure than public peers.
    - Public evidence still does not disclose gross margin, NRR, GRR, revenue mix, debt covenants, or liquidation preferences.
    - Clio faces intensifying legal-AI and enterprise-workflow competition from Thomson Reuters, LexisNexis or Harvey, and more specialized workflow vendors.
    - Trust-account and payment-workflow changes, cross-border privacy obligations, and concentration on key vendors create real operating and compliance risk.
    - Independent outage logs and the LawPay integration sunset show workflow-disruption risk in software embedded deeply in billing and client communication.
  unresolvedGaps:
    - Current board composition, committee structure, and succession planning are not fully disclosed in retained public sources.
    - Audited unit economics remain unavailable, including gross margin, NRR or GRR, CAC payback, revenue mix, and payments take rate.
    - Capital-structure detail remains incomplete, especially debt-facility terms, liquidation preferences, and current ownership or seniority.
    - Current standalone headcount and the post-vLex integration cost profile are not publicly disclosed with enough precision.
    - Enterprise proof remains thinner than SMB proof, especially on named renewals, repeatable Operate adoption, and Vincent monetization.
    - Public resilience evidence still does not show multi-cloud failover or enough incident detail to underwrite disaster recovery confidence.

