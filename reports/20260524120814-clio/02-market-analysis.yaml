'chapter':
  'number': 2
  'title': 'Market Analysis'
  'summary': 'Clio''s market is best framed as legal workflow software for law firms and legal departments: practice management, intake, payments, and the faster-growing legal-AI layer. Public TAM estimates vary widely by boundary, but the consistent adoption pattern is that solo and small firms buy for revenue capture, mid-sized firms buy to integrate fragmented stacks, and enterprise legal teams buy for governance and workload absorption while privacy, ethics, and change management slow deployment.'
'sections':
- 'id': 'market-boundary-and-scope'
  'title': 'Market boundary and scope'
  'body': |-
    Clio's addressable market is narrower than "legal services" and broader than classic case-management alone. The most defensible boundary includes cloud law-practice-management suites, client intake and CRM, billing and payments workflow, and the newer legal-AI layer that automates drafting, research, document review, and compliance work inside law firms and legal departments. It also touches adjacent corporate-legal-ops categories such as contract lifecycle management, eDiscovery, and compliance software when those tools are bought by the same legal buyer or reduce the same workflow bottlenecks. What should be excluded is equally important: total legal fees, purely human advisory services, generic office productivity software, and broad enterprise IT budgets that never convert into a legal-workflow purchase.

    Public buyer-universe data supports treating this as a workflow market rather than a single spend pool. The ABA counted 1,322,649 active US lawyers as of January 2024, while BLS counted 864,800 lawyer jobs in 2024 and said 51% were in legal services. ACC's tracker separately treats in-house counsel as the residual buyer class once law-firm and government lawyers are removed from the total. That matters for Clio because the buying logic changes across the stack: solo and small firms often buy to reduce intake leakage and get paid faster, mid-sized firms buy to unify fragmented systems, and enterprise law firms or corporate legal departments buy for governance, standardization, and defensible AI-enabled workflows. The market frame for chapter 2 is therefore "legal workflow software for law firms and legal departments," not all spending attached to the practice of law.
