callouts:
  - calloutType: strength
    title: "Structural Defense Tailwind from Federal Supply Chain Mandates"
    body: "Statutory prohibitions against Chinese-manufactured UAS hardware in the FY24 NDAA, coupled with the FCC's Covered List additions, have created a protected domestic market for NDAA-compliant, Blue UAS-cleared manufacturers. PDW's early commitment to domestic component sourcing protects it from the supply chain shocks that disrupted competitors."
    claimRefs:
      - CP002
      - CP005
      - CP015
  - calloutType: risk
    title: "Capital Disparity Against Multi-Domain Defense Tech Primes"
    body: "Despite raising a $110 million Series B and securing an $820 million conditional loan commitment from the DoD, PDW remains substantially smaller than Anduril ($61 billion valuation, $2.2 billion revenue) and incumbent defense primes, creating long-term risk if larger players replicate PDW's tactical airframe envelope."
    claimRefs:
