companyProfile:
  summary: >-
    Performance Drone Works is a Huntsville-based defense robotics manufacturer that sells the C100 tactical quadcopter,
    AM-FPV attritable platform, and CORE mission software to military and public-safety buyers. The company has
    converted early drone-racing and special-operations roots into a Blue UAS-cleared domestic production base, but it
    still depends heavily on Army programs and undisclosed private capital terms.
  headquarters: Huntsville, Alabama
  productSummary: >-
    Tactical small uncrewed aircraft systems, attritable multirotor platforms, mission software, payload integration,
    and related training/support services.
  customerFocus: U.S. Army tactical formations, special operations, allied defense buyers, and adjacent public-safety agencies.
  businessModel: >-
    Federal defense procurement contracts, bundled hardware and payload sales, component and spares orders, software,
    and training.
  stage: Series B
  fundingStatus: >-
    More than $110 million in Series B financing, plus a conditional OSC loan commitment of up to $820 million for
    domestic manufacturing expansion.
