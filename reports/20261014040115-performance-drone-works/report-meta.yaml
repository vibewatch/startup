  topStrengths:
    - Verified U.S. Army adoption across multiple combatant commands.
    - Domestic manufacturing scale at Drone Factory 01 with Blue UAS compliance.
    - Strong capital backing from Series B investors and conditional federal debt capacity.
  topRisks:
    - Private revenue, margin, backlog, and burn-rate disclosure remain absent.
    - Customer concentration remains heavy in Army experimentation and modernization programs.
    - Domestic supply-chain and production ramp execution are not independently verified.
    - Labor and regulatory scrutiny could distract management during scale-up.
  unresolvedGaps:
    - Current revenue, backlog, gross margin, and burn-rate disclosure remain absent from public sources.
    - Headcount, organizational structure, and post-CEO-transition operating accountability are not publicly reconciled.
    - Official and third-party funding histories conflict, leaving cap-table and preference-stack analysis incomplete.
    - >-
      Customer concentration and repeat-order quality are not yet visible enough to separate program momentum from
      durable platform adoption.
    - >-
      Factory economics, supplier bottlenecks, and actual monthly output conversion have not been independently
      verified.
