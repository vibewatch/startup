      - number: '7.2'
        title: Regulatory Compliance, Clearances, and Labor Disputes
        blocks:
          - type: paragraph
            body: >-
              Regulatory positioning represents both a critical commercial moat and a persistent execution hazard for
              Performance Drone Works. The company markets its flagship C100 platform as Blue UAS cleared and fully
              compliant with strict National Defense Authorization Act procurement mandates. Nonetheless, broader
              institutional shifts introduce material transition risks, particularly as the Department of Defense
              transfers administrative oversight of the Blue UAS Cleared List from the Defense Innovation Unit to the
              Defense Contract Management Agency under emerging military drone dominance policies. Audit delays or
              evolving cybersecurity criteria during this DCMA handover could temporarily disrupt program
              authorizations. Concurrently, public federal labor records disclose an active unfair labor practice charge
              filed in November 2025 with National Labor Relations Board Region 10 in Huntsville, alleging coercive
              employee rules and unilateral modifications to working terms. Sustained workforce unrest or adverse
              administrative findings could jeopardize federal contractor labor certifications and complicate aggressive
              facility hiring goals.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.3'
        title: Operational Scalability, Manufacturing Ramp, and Technical Reliability
        blocks:
          - type: paragraph
            body: >-
              The operational scaling of Drone Factory 01 represents PDW's central industrial commitment and its largest
              operational bottleneck. Managing a 90,000 square foot facility and scaling the local workforce toward a
              projected 500 personnel introduces acute manufacturing complexity, especially while maintaining tight
              quality engineering standards. The C100 airframe demands rigorous operational specifications, including an
              IP54 environmental ingress rating, a 40.3 mph top speed, and 74 minutes of endurance while carrying
              sensitive electro-optical and infrared payload packages. While the platform incorporates advanced
              vision-based navigation and beyond-line-of-sight communications to counter electronic warfare threats in
              GPS-denied combat theaters, scaling hardware yields without proportional scrap or field failures remains
              unproven at monthly run-rates of hundreds of systems. Company disclosures acknowledge reliance on an
              expanding vendor base to reduce supply chain exposure, but internal component yields and factory delivery
              cadences remain unverified by external technical telemetry.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR013
      - number: '7.4'
        title: Customer Concentration, Supplier Dependencies, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Commercial durability is heavily exposed to single-customer concentration and Tier-1 component
              availability. Public disclosures indicate that over $15 million in direct sales and contracts—and upwards
              of $20 million in aggregate commitments—depend on U.S. Army allocations, specifically tied to the
              Transformation in Contact initiative. Although board oversight from retired SOCOM Commander General Tony
              Thomas strengthens Pentagon relationships, federal budget shifts, continuing resolution delays, or
              tactical reallocations could instantly imperil backlog conversion. On the procurement side, strategic
              supplier relationships such as the $3.75 million purchase order placed with Unusual Machines for AM-FPV
              domestic motor and airframe components underscore heavy reliance on a nascent domestic supply base.
              Coupled with significant capital requirements for manufacturing equipment and working capital, any
              disruption in Army delivery schedules or tier-one parts shipments serves as an immediate thesis-break
              trigger requiring close diligence tracking.
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR012
              - CR014
