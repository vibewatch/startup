chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Base, and Tactical Mission
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works (PDW) operates as a private defense robotics and autonomy hardware manufacturer
              headquartered at 3414 Governors Drive SW in Huntsville, Alabama, where it develops man-packable, modular
              tactical uncrewed aerial systems (sUAS) for frontline military and public-safety operations. The
              enterprise was founded in 2018 by combat veterans and drone racing engineers seeking to translate
              high-speed agile robotics insights into ruggedized tactical platforms capable of operating in heavily
              contested, GPS-denied combat environments. Rather than pursuing commercial enterprise drone services or
              large-scale strategic airframes, PDW focuses strictly on tactical small uncrewed systems, highlighted by
              the flagship C100 Group 2 multi-mission quadcopter, the AM-FPV attritable multicopter platform, and the
              CORE mission software operating suite. PDW positions itself around American domestic engineering and
              manufacturing sovereignty, achieving full National Defense Authorization Act (NDAA) compliance and Defense
              Innovation Unit (DIU) Blue UAS certification to directly counter Chinese supply-chain dependencies across
              Western defense forces.
            claimRefs:
