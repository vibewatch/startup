  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Operational Boundary
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works operates in the rapidly evolving tactical unmanned aerial systems sector,
              specifically targeting the Department of Defense Group 2 and Group 1 man-packable category. The company's
              primary platform, the C100, is engineered as a rucksack-portable quadcopter capable of delivering
              single-operator air support with a 10-pound payload capacity and up to 74 minutes of operational
              endurance. The operational boundary of this market includes squad-level intelligence, surveillance, and
              reconnaissance (ISR), tactical electronic warfare payloads, encrypted communications relay, and organic
              precision cargo delivery. It explicitly excludes large-scale, runway-dependent Group 3 to Group 5 unmanned
              platforms such as strategic fixed-wing aircraft or medium-altitude long-endurance drones. In operational
              doctrine, PDW's systems substitute for legacy crewed observation helicopters, vulnerable line-of-sight
              radio masts, and commercial drones that lack electronic resilience. By offering an open, modular payload
              architecture and Blue UAS-cleared flight avionics, PDW positions the C100 as an attritable yet highly
              capable unit-level capability designed to survive and operate effectively within heavily contested
              electromagnetic environments.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: Market Sizing Lenses and Expenditure Context
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for defense robotics requires analyzing macroeconomic defense allocations
              alongside specialized tactical procurement lines. Global military spending expanded 9.4% in real terms to
              reach $2,718 billion in 2024, with the United States representing $997 billion or roughly 37% of the
              worldwide total. Across the 32 member nations of NATO, combined defense expenditures surpassed $1,506
              billion, driven by heightened European defense modernization outlays following peer-conflict observations
              in Eastern Europe. While these aggregate defense figures establish a highly supportive spending climate,
              the total addressable market for company-level tactical drones cannot be evaluated using broad defense
              aerospace figures alone. Tactical sUAS procurement is governed by designated line-item appropriations,
              urgent operational requirements, and programmatic initiatives such as the U.S. Army Directed Requirement
              for Company-Level sUAS. Independent research isolating exact Group 2 tactical multirotor spending from
              broader aerospace procurement remains scarce in public disclosures, necessitating a disciplined sizing
              pyramid that links top-line national defense budgets to initial verified awards.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
