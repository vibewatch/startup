      - number: '1.3'
        title: Capitalization History, Defense Commitments, and Industrial Scaling
        blocks:
          - type: paragraph
            body: >-
              PDW has transitioned from an early-stage robotics innovator backed by RSE Ventures into a heavily
              capitalized defense industrial scale-up. In March 2026, the company completed a Series B financing round
              exceeding $110 million to accelerate production scaling, expand autonomous software engineering, and
              broaden modular payload integration. This institutional private capital was complemented by a conditional
              loan commitment of up to $820 million from the Department of War Office of Strategic Capital (OSC) to
              finance nationwide domestic manufacturing expansion for critical autonomous defense technologies.
              Industrial execution is centered on Drone Factory 01 (DF01), an advanced 90,000-square-foot facility in
              Huntsville officially opened in August 2025. DF01 establishes internal design-to-delivery capability
              supporting planned monthly output run-rates of 350 C100 airframes and 5,000 AM-FPV attritable munitions,
              while creating over 500 regional advanced manufacturing jobs with an estimated local economic impact
              exceeding $81 million annually.
