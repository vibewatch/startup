      - number: '4.2'
        title: Cost Structure, Supplier Commitments, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The cost profile of Performance Drone Works is shaped by high-spec domestic hardware manufacturing,
              defense-grade sensor integration, and strict compliance with the National Defense Authorization Act (NDAA)
              and Blue UAS frameworks. Unlike commercial drone assemblers that leverage low-cost overseas consumer
              supply chains, PDW must procure non-Chinese flight controllers, encrypted radios, thermal optics, and
              propulsion components. A strategic purchase order of $3.75 million placed with Unusual Machines
              underscores substantial working capital commitments required to secure domestic drone components for the
              AM-FPV attritable platform. Facility overhead represents another major expenditure layer following the
              commissioning of Drone Factory 01, a 90,000-square-foot production facility in Huntsville, Alabama,
              designed to output 350 C100 platforms and 5,000 AM-FPV munitions monthly while supporting a full-time
              workforce of approximately 350 employees. Because audited bills of materials and labor overhead absorption
              rates are not public, gross margin performance cannot be independently calculated, posing a material
              unknown for institutional underwriting.
            claimRefs:
