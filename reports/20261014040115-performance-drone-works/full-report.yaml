      - number: '6.2'
        title: Adoption Trajectory and Procurement Milestones
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Performance Drone Works shows rapid contract growth within U.S. Army
              experimentation and modernization programs between late 2024 and 2026. The initial procurement milestone
              occurred in December 2024 with a $15.3 million contract to deliver C100 Group 2 systems across three major
              unified combatant commands. Momentum expanded in September 2025 with an additional $20.9 million award
              under the Army’s Transformation in Contact initiative, specifically funding C100 platforms equipped with
              modular Multi-Mission Payloads. To support this expanding pipeline of defense orders, PDW opened Drone
              Factory 01 in August 2025 with an ambitious production target of 350 C100 quadcopters and 5,000 AM-FPV
              attritable munitions monthly. Upstream supply agreements, such as a $3.75 million component order with
              Unusual Machines and automated procurement risk management with Z2Data, illustrate the operational scale
              required to service these delivery commitments.
            claimRefs:
              - CU002
              - CU004
              - CU008
              - CU009
              - CU010
              - CU011
