      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Strategic Supervision
        blocks:
          - type: paragraph
            body: >-
              PDW operates under founder-led executive management augmented by senior defense flag officer governance
              and specialized hardware engineering talent. Chief Executive Officer and co-founder Ryan Gury leads
              strategic vision and product design, drawing directly from high-performance aerial robotics backgrounds
              alongside Chief Strategy Officer and co-founder Trevor Smith. The executive suite is supported by Chief
              Financial Officer Tom Inman, Chief Technology Officer Dylan Hamm, Chief Operating Officer and President
              James Slider, and newly appointed Chief Revenue Officer Shawn Hall, alongside Chief of Staff Greg Farmer
              overseeing operational testing. Governance is anchored by Board Chairman General (Ret.) Raymond A. "Tony"
              Thomas, former Commander of U.S. Special Operations Command (USSOCOM) and Joint Special Operations Command
              (JSOC), providing strategic defense procurement alignment, operational credibility, and high-level
              Department of Defense stakeholder access. Although leadership demonstrates deep technical competence and
              elite military alignment, operating key-person reliance remains concentrated in co-founder Ryan Gury for
              platform vision and General Thomas for defense customer relationships.
