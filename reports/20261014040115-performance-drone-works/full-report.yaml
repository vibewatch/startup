      - number: '1.4'
        title: Operational Milestones, Program Contracts, and Regulatory Oversight
        blocks:
          - type: paragraph
            body: >-
              PDW has validated its tactical systems through major U.S. Army program wins while experiencing early
              industrial regulatory scrutiny. In December 2024, the company secured more than $15.3 million in U.S. Army
              contracts to field the C100 across U.S. Indo-Pacific Command, European Command, and Central Command under
              the Directed Requirement for Company-Level sUAS. In September 2025, PDW was awarded an additional $20.9
              million contract to supply C100 systems and multi-mission payloads under the Army Transformation in
              Contact initiative. Strategic supply relationships include a $3.75 million purchase order placed with
              Unusual Machines in December 2025 to procure domestic, NDAA-compliant components for scaling the AM-FPV
              munition program. Concurrently, rapid manufacturing expansion has introduced regulatory friction: in
              November 2025, an unfair labor practice charge was filed against PDW with National Labor Relations Board
              (NLRB) Region 10 in Huntsville under case 10-CA-375313, alleging coercive work rules and unilateral
              changes in terms of employment during production ramp-up.
