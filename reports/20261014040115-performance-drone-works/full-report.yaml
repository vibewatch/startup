              - CU005
              - CU011
      - number: '6.3'
        title: Named Customer Proof and Operational Field Deployments
        blocks:
          - type: paragraph
            body: >-
              Publicly verifiable customer deployments indicate that Performance Drone Works has successfully advanced
              from bench testing to active operational evaluation with frontline warfighters. Initial C100 deliveries
              were fielded to seven U.S. Army PM UAS units to gather direct soldier feedback in complex tactical
              scenarios. Under subsequent contract iterations, deployment expanded to elite operational formations,
              specifically the 18th Airborne Corps and U.S. Army Special Operations Command, where multi-mission
              payloads enabled electronic warfare, signals intelligence, and beyond-line-of-sight communication
              capabilities. By May 2026, the U.S. Army officially confirmed that the PDW C-100 operates alongside the
              Anduril Ghost-X in active unit formations, establishing PDW as one of only five vendors in the Army’s
              diversified company-level small uncrewed aircraft portfolio.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
      - number: '6.4'
        title: Retention Durability, Procurement Friction, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite rapid contract momentum, Performance Drone Works carries significant customer concentration and
              procurement durability risks. The business is heavily exposed to single-customer risk within the U.S.
              Army, where purchasing is currently tied to emergent modernization budgets like Transformation in Contact
              rather than cemented, multi-year programs of record. Furthermore, public federal contracting databases
              track zero matched prime federal contract awards, indicating that revenue flows through Other Transaction
              Authorities, consortium agreements, or prime integrator pass-throughs that offer lower long-term
              visibility. Because government defense purchases do not follow commercial SaaS renewal mechanics, public
              disclosures contain zero audited net revenue retention, software renewal, or fleet utilization metrics,
              leaving future recurring revenue visibility highly constrained.
            claimRefs:
              - CU010
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High Customer Concentration in Experimental Army Formations
            body: >-
              Verified customer adoption remains overwhelmingly concentrated in U.S. Army Transformation in Contact
              formations and early operational evaluations. While the Army has deployed C100 units across multiple
              combatant commands, public databases record zero direct federal prime contract awards, indicating heavy
              reliance on OTAs, subcontracting vehicles, and non-program-of-record funding streams.
            calloutType: risk
            claimRefs:
              - CU002
              - CU006
              - CU010
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk & Threat Landscape
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works operates in an environment characterized by rapid capital deployment, intense
              military operational demand, and structural defense hardware scaling risks. The company achieved major
              milestones by securing over $110 million in Series B financing and launching Drone Factory 01 in
              Huntsville, Alabama to achieve a rated monthly capacity of 350 C100 reconnaissance quadcopters and 5,000
              attritable multirotor munitions. Furthermore, front-line fielding across multiple combatant commands
              validates military demand for NDAA-compliant tactical sUAS platforms. However, external market reviews and
              defense technology benchmarks highlight severe underlying vulnerabilities in customer concentration,
              domestic supply chain dependencies, and manufacturing execution. The company is transitioning from early
              venture-backed prototyping into high-rate military production, where schedule slippage, component
              shortages, or margin erosion can rapidly imperil enterprise value.
            claimRefs:
              - CR004
              - CR007
              - CR009
              - CR012
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
