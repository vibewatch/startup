        title: Exhibits
        blocks:
          - type: callout
            title: Critical Customer Concentration in U.S. Army Modernization
            body: >-
              Over $20 million in disclosed defense awards are tied directly to U.S. Army tactical initiatives; budget
              reallocations or procurement pauses represent an existential volume risk.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
          - type: callout
            title: Domestic Supply Chain Constraints on High-Rate Munition Production
            body: >-
              Sustaining a target run rate of 5,000 AM-FPV munitions monthly relies heavily on specialized domestic
              component suppliers like Unusual Machines, making vendor scaling a gating factor.
            calloutType: insight
            claimRefs:
              - CR005
