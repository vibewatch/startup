chapter:
  number: 6
  title: Customers
  summary: Performance Drone Works demonstrates validated defense customer adoption anchored in U.S. Army Transformation in Contact initiatives and multi-theater combatant command deployments, securing over $36 million in cumulative announced contracts. However, the company exhibits extreme customer concentration within Department of Defense experimentation programs, zero verified public prime contract database awards, and an absence of disclosed commercial software retention or renewal metrics.
sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Buyer Profiles
    body: Performance Drone Works focuses its commercial go-to-market efforts almost exclusively on military, defense, and national security buyers. The company’s core customer base is segmented into frontline tactical combat units, elite special operations commands, and theater-level joint combatant commands requiring uncrewed aerial reconnaissance in contested electronic warfare environments. While the company markets its C100 and attritable multirotor systems as solutions capable of closing the preparedness gap for public safety and first responder organizations, verified adoption is overwhelmingly concentrated within the U.S. Department of Defense. Within the defense sector, the primary institutional buyer is the U.S. Army Project Manager for Uncrewed Aircraft Systems, acting under directed requirements for company-level tactical reconnaissance.
    claimRefs:
      - CU001
      - CU002
      - CU014
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-contract-growth
    title: Adoption Trajectory and Procurement Milestones
    body: The adoption trajectory of Performance Drone Works shows rapid contract growth within U.S. Army experimentation and modernization programs between late 2024 and 2026. The initial procurement milestone occurred in December 2024 with a $15.3 million contract to deliver C100 Group 2 systems across three major unified combatant commands. Momentum expanded in September 2025 with an additional $20.9 million award under the Army’s Transformation in Contact initiative, specifically funding C100 platforms equipped with modular Multi-Mission Payloads. To support this expanding pipeline of defense orders, PDW opened Drone Factory 01 in August 2025 with an ambitious production target of 350 C100 quadcopters and 5,000 AM-FPV attritable munitions monthly. Upstream supply agreements, such as a $3.75 million component order with Unusual Machines and automated procurement risk management with Z2Data, illustrate the operational scale required to service these delivery commitments.
    claimRefs:
      - CU002
      - CU004
      - CU008
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: named-customer-deployments
    title: Named Customer Proof and Operational Field Deployments
    body: Publicly verifiable customer deployments indicate that Performance Drone Works has successfully advanced from bench testing to active operational evaluation with frontline warfighters. Initial C100 deliveries were fielded to seven U.S. Army PM UAS units to gather direct soldier feedback in complex tactical scenarios. Under subsequent contract iterations, deployment expanded to elite operational formations, specifically the 18th Airborne Corps and U.S. Army Special Operations Command, where multi-mission payloads enabled electronic warfare, signals intelligence, and beyond-line-of-sight communication capabilities. By May 2026, the U.S. Army officially confirmed that the PDW C-100 operates alongside the Anduril Ghost-X in active unit formations, establishing PDW as one of only five vendors in the Army’s diversified company-level small uncrewed aircraft portfolio.
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU007
    tableRefs:
      - TU003
  - id: retention-durability-and-concentration-risk
    title: Retention Durability, Procurement Friction, and Concentration Risks
    body: Despite rapid contract momentum, Performance Drone Works carries significant customer concentration and procurement durability risks. The business is heavily exposed to single-customer risk within the U.S. Army, where purchasing is currently tied to emergent modernization budgets like Transformation in Contact rather than cemented, multi-year programs of record. Furthermore, public federal contracting databases track zero matched prime federal contract awards, indicating that revenue flows through Other Transaction Authorities, consortium agreements, or prime integrator pass-throughs that offer lower long-term visibility. Because government defense purchases do not follow commercial SaaS renewal mechanics, public disclosures contain zero audited net revenue retention, software renewal, or fleet utilization metrics, leaving future recurring revenue visibility highly constrained.
    claimRefs:
      - CU010
      - CU012
      - CU013
