      working capital outflows without disclosed gross margin offsets.
    diligencePath: Review supplier Master Services Agreements and component pricing schedules under NDA.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: manufacturing-throughput
