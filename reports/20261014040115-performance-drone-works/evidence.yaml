evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited financial statements confirming GAAP revenue, gross margin, operating cash burn, and backlog conversion.
    whyItMatters: Without financial disclosures, valuation multiples and long-term operating self-sustainability cannot be priced.
    diligencePath: >-
      Request audited financial statements, historical defense contract margins, and 24-month cash flow forecasts during
      formal diligence.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: Full cap-table roster identifying all Series A and Series B syndicate equity holders and ownership percentages.
    whyItMatters: >-
      Minority voting rights, liquidation preference stacks, and investor protective covenants affect governance
      stability.
    diligencePath: Review comprehensive cap table and Series B investor rights agreement under standard diligence NDA.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-granularity
    missingEvidence: >-
      Independent market research publications isolating company-level Group 1 and Group 2 tactical drone SAM and SOM
      from aggregate defense aerospace budgets.
    whyItMatters: >-
      Broad top-line military expenditure figures overstate addressable opportunities for specialized man-packable
      quadcopters, creating analytical uncertainty in valuation modeling.
    diligencePath: >-
      Request DoD program executive office budget line items for small unmanned aerial systems and verify contract
      ceiling allocations across tactical units.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: realized-system-pricing
    missingEvidence: >-
      Audited per-unit average selling prices, mission bundle pricing schedules, and gross margin disclosures for C100
      and AM systems.
    whyItMatters: >-
      Without realized unit pricing data, it is impossible to evaluate whether PDW wins defense contracts on
      cost-efficiency or whether price competition from rivals will compress hardware margins.
    diligencePath: Review unredacted DoD contract line-item number (CLIN) data or confidential institutional investor disclosures.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: osc-loan-closing-timeline
    missingEvidence: >-
      Definitive financial close documentation, interest terms, and milestone disbursement criteria for the $820 million
      conditional OSC loan commitment.
    whyItMatters: >-
      If the conditional loan fails to clear due diligence or faces delays, PDW's plans to scale upstream domestic
      component manufacturing and supply competitors will be severely constrained.
    diligencePath: >-
      Track Department of Defense Office of Strategic Capital public transaction closing notices and corporate debt
      filings.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-recognition-and-cash-burn
    missingEvidence: >-
      Audited income statements detailing realized hardware deliveries, recurring software license revenue, gross
      margins, and monthly operating cash burn.
    whyItMatters: >-
      Institutional underwriting cannot establish unit profitability, operating break-even milestones, or intrinsic
      business valuation without historical revenue recognition data.
    diligencePath: >-
      Request audited FY2024-FY2025 financial statements and quarterly management accounts during confidential data room
      diligence.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: federal-procurement-tracking
    missingEvidence: Reconciled contract award and payment records between public DOD announcements and federal spending databases.
    whyItMatters: >-
      Defense Tech Base reflects zero matched federal contract awards, making it impossible to verify the conversion
      rate of announcement figures into disbursed cash.
    diligencePath: >-
      Cross-reference FPDS and USASpending award transaction IDs against Army Contracting Command Redstone Arsenal
      contract files.
    relatedQuestionRefs:
      - QI006
  - type: conflicting-data
    severity: material
    topic: supply-chain-cogs-commitments
    missingEvidence: >-
