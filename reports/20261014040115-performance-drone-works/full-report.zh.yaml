      - number: '1.4'
        title: 运营里程碑、项目合同与监管监督
        blocks:
          - type: paragraph
            body: >-
              PDW 通过赢得美国陆军重大项目，验证了其战术系统，但早期工业监管审查也随之而来。2024 年 12 月，公司在“连级 sUAS 定向需求”项目下获得超过 $15.3M
              的美国陆军合同，向美国印太司令部、欧洲司令部和中央司令部部署 C100。2025 年 9 月，PDW 又获得 $20.9M 合同，在 Army Transformation in Contact 计划下供应
              C100 系统和多任务载荷。战略供应关系包括 2025 年 12 月向 Unusual Machines 下达的 $3.75M 采购订单，用于采购扩张 AM-FPV 弹药项目所需的美国本土、符合 NDAA
              的组件。与此同时，制造业快速扩张带来监管摩擦：2025 年 11 月，国家劳资关系委员会（NLRB）亨茨维尔第 10 区针对 PDW 提起不公平劳动行为指控，案件编号
              10-CA-375313，称公司在产能爬坡期间实施胁迫性工作规则并擅自改变雇佣条款。
