chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营基地与战术使命
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works（PDW）是一家私营国防机器人和自主硬件制造商，总部位于阿拉巴马州亨茨维尔 Governors Drive SW 3414
              号。公司开发可由士兵携带、模块化的战术无人机系统（sUAS），服务前线军事和公共安全行动。企业由作战老兵和无人机竞速工程师于 2018
              年创立，目标是把高速敏捷机器人经验转化为坚固的战术平台，使其能在高度受限、GPS 拒止的作战环境中运行。PDW 不做商业企业级无人机服务，也不追求大型战略级飞行器，而是专注于战术小型无人系统，核心产品包括旗舰
              C100 Group 2 多任务四旋翼机、AM-FPV 可消耗多旋翼平台和 CORE 任务软件套件。PDW
              以美国本土工程和制造主权为定位，已实现《国防授权法案》（NDAA）全面合规并取得国防创新部门（DIU）Blue UAS 认证，直接应对西方国防力量对中国供应链的依赖。
            claimRefs:
