      - number: '1.3'
        title: 资本化历史、国防承诺与工业扩张
        blocks:
          - type: paragraph
            body: >-
              PDW 已从 RSE Ventures 支持的早期机器人创新企业，转型为资本充足的国防工业扩张企业。2026 年 3 月，公司完成超过 $110M 的 Series B
              融资，用于加快生产扩张、扩大自主软件工程能力并拓展模块化载荷集成。与此同时，战争部战略资本办公室（OSC）有条件承诺提供最高 $820M 的贷款，为关键自主国防技术的全国本土制造扩张提供资金。工业执行以
              Drone Factory 01（DF01）为核心：这座位于亨茨维尔、面积 90,000 平方英尺的先进工厂于 2025 年 8 月正式启用。DF01 建立了从设计到交付的内部能力，计划月产 350 架 C100
              机体和 5,000 架 AM-FPV 可消耗弹药，并创造超过 500 个区域先进制造岗位；预计每年带来的当地经济影响超过 $81M。
