      - number: '2.3'
        title: 买方、使用者与预算分层
        blocks:
          - type: paragraph
            body: >-
              战术自主无人机的客户群可分为不同军种司令部、特种作战组织、盟国国防部和国内公共安全机构。在美国陆军内部，采购权主要由陆军项目执行办公室（PEO）Soldier 和 PEO Aviation
              掌握，资金来自专项采购和运营账户。PDW 已在这一细分市场获得超过 $15.3M 的合同，在陆军定向需求下为 INDOPACOM、EUCOM 和 CENTCOM
              的前线部队配备设备，验证了产品与市场的匹配度。主要终端用户是战斗班组长和排级操作员，他们需要快速部署而不能承受繁重后勤。USSOCOM 内还存在一个高价值客户细分，其采购依靠 Major Force
              Program 11 资金，为特种隐蔽任务配备套件。除联邦国防机构外，战术执法团队、SWAT 部队和急救人员也是相邻市场，主要由市政预算和国土安全部拨款工具资助，并需要安全、通过 NDAA 认证的态势感知系统。
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 采用驱动因素、资本强度与市场约束
        blocks:
          - type: paragraph
            body: >-
              自主战术多旋翼机的采用，受到严格联邦合规要求和电子战韧性作战需求的推动。《国防授权法案》（NDAA）以及国防部 Blue UAS
              框架设定了严格的本土采购要求，实际上把中国制造商和不合规的商用无人机制造商排除在政府采购之外。2025 年，在行政指导下，Blue UAS
              认证框架的监督从国防创新部门转交国防合同管理局，以加快军用无人机列装。然而，要把有利的监管顺风转化为持续营收，还必须克服高资本需求和供应链约束。PDW 扩建了位于亨茨维尔、面积 90,000 平方英尺的
              Drone Factory 01，目标是达到每月 350 架 C100 和 5,000 架 AM-FPV
              弹药的产能。以这一规模扩展本土组装，会带来显著的营运资金敞口和对本土组件供应商的运营依赖；专用电机、飞控处理器和传感器的瓶颈可能限制交付进度。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 监管壁垒推动国防市场准入
            body: >-
              《国防授权法案》（NDAA）的限制和 Blue UAS 认证框架，构成了针对商用四旋翼机既有厂商的关键进入壁垒。外国制造、不合规的商用无人机被系统性禁止进入美国军事设施和联邦业务流程，为 PDW
              这类获认证的本土制造商创造了受保护的市场环境。
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
          - type: callout
            title: 项目集中度与资本瓶颈
            body: >-
              PDW 已凭借超过 $15M 的美国陆军订单和面积 90,000 平方英尺的制造扩张展现初步牵引力，但仍面临显著的项目集中风险。商业可行性取决于能否把 Transformation in Contact
              等试验性举措转化为多年期正式项目，同时为高产量制造建立本土供应链。
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM012
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 格局：PDW 横跨战术国防、可消耗弹药与本土 sUAS 替代方案
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works 面对的不是单一、同质化的竞争类别。相反，PDW 将旗舰 C100 多任务 sUAS 和 AM-FPV
              可消耗弹药，放在不断演变的战术国防主承包商、风险投资支持的自主系统供应商和传统商用无人机替代品之间竞争。联邦监管环境为 PDW 提供了明显的结构性顺风：FY24 NDAA 中的 American Security
              Drone Act 禁止联邦资金采购中国制造的无人机；FCC 还把外国制造的无人机及其组件广泛加入 Covered List，阻止新的外国无人机硬件进入联邦工作流程。在这一仅限本土采购的环境中，PDW 直接面对
              Anduril Industries 等风险投资支持的国防科技同行；Anduril 于 2026 年以 $61B 估值融资 $5B。Skydio 在遭遇中国供应链制裁后启动了 $3.5B、为期五年的
              SkyForge 计划，以实现关键组件本土化。与此同时，Neros 为其 Archer 可消耗无人机获得了 $500M 的陆军 IDIQ 合同，目标是每周生产 1,200 架。PDW 虽已凭借超过 $15.3M
              的美国陆军 Transformation in Contact 合同，以及国防部战略资本办公室 $820M 的有条件贷款承诺取得强劲势头，但仍必须面对资产负债表规模和国防平台多元化远胜于自己的对手。
