            title: 高产量弹药生产面临的本土供应链约束
            body: 要维持每月 5,000 架 AM-FPV 弹药的目标产速，高度依赖 Unusual Machines 等专业本土组件供应商，因此供应商扩张会成为产能放量的门槛。
            calloutType: insight
            claimRefs:
              - CR005
