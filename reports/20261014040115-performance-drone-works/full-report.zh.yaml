              Trillium 军用级双传感器云台，例如 HD40-LV 和 HD40-XV，配备稳定可见光变焦和长波红外传感器；系统另配独立固定式第一人称视角飞行摄像头 [CE004, CE007]。自主导航由 PDW
              CORE 地面控制软件和任务规划器管理，软件已到 1.4 版，具备视觉惯性里程计和基于视觉的 GPS 拒止环境定位能力 [CE001, CE004]。为提高部队战备，PDW 推出了 PDW SIM
              合成飞行模拟器，把现实 3D 地理空间地形与符合物理规律的飞行动力学及 ATAK 战术界面结合起来；该模拟器可把飞行训练时长降低约 50%，成本降低 88%，同时模拟信号衰减和电池限制 [CE008,
