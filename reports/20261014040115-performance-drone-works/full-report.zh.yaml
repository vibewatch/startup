  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与运营边界
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works 所处的是快速演变的战术无人机系统领域，具体瞄准国防部 Group 2 和 Group 1 的单兵可携带类别。公司主力平台 C100
              是一款可装入背包的四旋翼机，能够由单名操作员提供空中支援，载荷能力为 10 磅，续航最长 74
              分钟。该市场的运营边界包括班组级情报、监视与侦察（ISR）、战术电子战载荷、加密通信中继，以及有机精确货物投送；明确不包括依赖跑道的大型 Group 3 至 Group 5
              无人平台，例如战略固定翼飞机或中高空长航时无人机。按作战条令，PDW 的系统可替代传统有人观察直升机、易受攻击的视距无线电桅杆，以及缺乏电子韧性的商用无人机。PDW 通过开放式模块化载荷架构和已获 Blue
              UAS 认证的飞控航电，将 C100 定位为一种可消耗但能力很强的单位级能力，能够在高度受限的电磁环境中存活并有效运行。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: 市场规模测算视角与支出背景
        blocks:
          - type: paragraph
            body: >-
              测算国防机器人可服务市场，需要同时分析宏观国防拨款和专门的战术采购条线。全球军费在 2024 年按实际口径增长 9.4%，达到 $2,718B；其中美国为 $997B，约占全球总额的 37%。北约 32
              个成员国的国防支出合计超过
              $1,506B，东欧观察到同类冲突后，欧洲国防现代化支出增加，推动了这一增长。虽然这些总量级国防数字说明支出环境非常有利，但不能只用宽泛的国防航空航天数据来评估连级战术无人机的总可服务市场。战术 sUAS
              采购受指定项目拨款、紧急作战需求和美国陆军“连级 sUAS 定向需求”等计划性举措约束。公开披露中，尚缺少把 Group 2
              战术多旋翼支出从更广泛航空航天采购中单独剥离出来的独立研究，因此需要建立一套审慎的规模测算金字塔，把国家国防预算顶线连接到最初已验证的订单。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
