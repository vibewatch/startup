      - number: '3.3'
        title: 制造规模、资本深度与供应链壁垒的持久性
        blocks:
          - type: paragraph
            body: >-
              PDW 采取激进的本土制造战略，试图建立可防守的生产壁垒。2025 年 8 月，公司在阿拉巴马州亨茨维尔启用 Drone Factory 01，这座面积 90,000 平方英尺的工厂设计月产 350 架 C100
              四旋翼机和 5,000 套 AM-FPV 系统。为支持这一规模，PDW 获得 Ondas Inc 的 $35M 战略投资；该公司后来又与 Hanwha Asset Management 和 Booz Allen
              Ventures 共同领投 PDW 于 2026 年 3 月完成的 $110M Series B。为缓解中国监管部门切断电池供应商、导致 Skydio 等对手受影响时暴露的供应链瓶颈，PDW
              提前采购本土组件，并向 Unusual Machines（NYSE American：UMAC）下达 $3.75M 订单，采购符合 NDAA 的 FPV 无人机部件。更重要的是，五角大楼战略资本办公室于 2026
              年 7 月 31 日有条件承诺提供最高 $820M 的贷款，专门用于扩大 Group 1 和 Group 2 无人机关键子组件——包括推进、电力和视觉系统——的本土制造。如果最终落地，该设施将使 PDW
              能够成为其他本土无人机制造商的一级组件供应商。不过，风险仍然显著：$820M OSC 融资仍是需经过广泛尽调的有条件债务承诺，而 Anduril 等资本雄厚的竞争者年收入持续达到数十亿美元，使 PDW
              容易受到陆军项目拨款变化和长期采购集中度的影响。
