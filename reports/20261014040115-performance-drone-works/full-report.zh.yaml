      - number: '6.3'
        title: 指名客户验证与实地运营部署
        blocks:
          - type: paragraph
            body: >-
              可公开验证的客户部署表明，Performance Drone Works 已从台架测试推进到前线作战人员参与的实际运营评估。最初交付的 C100 被部署到美国陆军 7 个 PM UAS
              部队，以收集士兵在复杂战术场景中的直接反馈。在后续合同迭代中，部署扩大到精锐作战编队，具体包括第 18 空降军和美国陆军特种作战司令部；多任务载荷使其具备电子战、信号情报和超视距通信能力。到 2026 年 5
              月，美国陆军正式确认 PDW C-100 与 Anduril Ghost-X 一同在现役部队编制中运行，使 PDW 成为陆军多元化连级小型无人机组合中仅有的五家供应商之一。
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
      - number: '6.4'
        title: 留存持久性、采购摩擦与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管合同势头迅猛，Performance Drone Works 仍面临显著的客户集中度和采购持久性风险。公司高度暴露于美国陆军单一客户风险，而当前采购依赖 Transformation in Contact
              等新兴现代化预算，并非已经固化的多年期正式项目。此外，联邦采购数据库记录的直接联邦主合同订单为零，说明收入可能通过其他交易授权、联盟协议或主集成商转包流转，长期可见度较低。政府国防采购并不遵循商业 SaaS
              的续约机制，公开披露中也没有经审计的净收入留存率、软件续订或机队利用率指标，因此未来经常性收入的可见度受到很大限制。
            claimRefs:
              - CU010
              - CU012
              - CU013
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 实验性陆军编队中的客户高度集中
            body: >-
              已验证的客户采用仍高度集中于美国陆军 Transformation in Contact 编队和早期运营评估。虽然陆军已在多个战斗司令部部署 C100，公开数据库却记录不到直接联邦主合同订单，说明公司严重依赖
              OTA、分包工具和非正式项目资金流。
            calloutType: risk
            claimRefs:
              - CU002
              - CU006
              - CU010
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 管理层风险与威胁格局
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works 所处环境具有资本快速投入、军事运营需求强劲和国防硬件扩张风险的特征。公司完成超过 $110M 的 Series B 融资，并在阿拉巴马州亨茨维尔启用 Drone
              Factory 01，目标月产能为 350 架 C100 侦察四旋翼机和 5,000 架可消耗多旋翼弹药，由此实现重大里程碑。此外，公司在多个战斗司令部实现前线列装，也验证了军方对符合 NDAA 的战术 sUAS
              平台存在需求。然而，外部市场评估和国防科技基准显示，客户集中度、本土供应链依赖和制造执行都存在严重脆弱性。公司正从早期风险投资支持的原型开发转向高产量军用生产；此时任何进度延误、组件短缺或利润率侵蚀，都可能迅速危及企业价值。
            claimRefs:
              - CR004
              - CR007
              - CR009
              - CR012
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR009
              - CR012
      - number: '7.2'
        title: 监管合规、认证与劳资争议
        blocks:
          - type: paragraph
            body: >-
              监管定位既是 Performance Drone Works 的关键商业壁垒，也是持续存在的执行风险。公司将旗舰 C100 平台宣传为已通过 Blue UAS
              认证，并完全符合严格的《国防授权法案》采购要求。不过，更广泛的机构变化带来重大过渡风险，尤其是国防部正依据新兴军用无人机主导政策，把 Blue UAS Cleared List
              的行政监督从国防创新部门移交给国防合同管理局。DCMA 交接期间的审计延迟或网络安全标准变化，可能暂时扰乱项目授权。与此同时，公开联邦劳工记录显示，国家劳资关系委员会亨茨维尔第 10 区于 2025 年 11
              月对公司提起不公平劳动行为指控，称公司实施胁迫性员工规则并单方面修改工作条款。持续的劳资动荡或不利的行政裁决，可能危及联邦承包商劳工认证，并使激进的工厂招聘目标更难实现。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.3'
        title: 运营扩张、制造爬坡与技术可靠性
        blocks:
          - type: paragraph
            body: >-
              Drone Factory 01 的运营扩张是 PDW 最重要的工业承诺，也是最大的运营瓶颈。管理一座 90,000 平方英尺的设施，并把当地员工规模扩张到预计 500
              人，会带来尖锐的制造复杂性，尤其是在保持严格质量工程标准的同时。C100 机体需要满足严格的运营规格，包括 IP54 环境防护等级、40.3 mph 最高速度，以及搭载敏感光电和红外载荷时 74
              分钟的续航。平台采用基于视觉的先进导航和超视距通信，以应对 GPS
              拒止战区的电子战威胁；但在每月数百套系统的产量下，能否在不成比例增加报废或现场故障的情况下提高硬件良率，仍未经验证。公司披露承认依赖不断扩大的供应商体系来降低供应链敞口，但内部组件良率和工厂交付节奏仍缺乏外部技术遥测验证。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR013
      - number: '7.4'
        title: 客户集中、供应商依赖与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              商业持久性高度暴露于单一客户集中度和一级组件供应情况。公开披露显示，超过 $15M 的直接销售和合同，以及总额超过 $20M 的承诺，都依赖美国陆军拨款，且具体绑定 Transformation in
              Contact 计划。退役 SOCOM 司令 Tony Thomas 将军参与董事会监督，强化了五角大楼关系，但联邦预算变化、持续决议延迟或战术资源重新分配，都可能立即危及订单转化。在采购端，PDW 与
              Unusual Machines 等供应商建立战略关系，并下达 $3.75M 采购订单采购 AM-FPV
              的本土电机和机体组件，凸显了公司对尚处早期的本土供应基础的高度依赖。再加上制造设备和营运资金的巨大需求，陆军交付计划或一级零部件运输出现任何中断，都会成为需要密切跟踪的即时论点破坏触发器。
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 美国陆军现代化中的关键客户集中
            body: 已披露的国防订单超过 $20M，且直接绑定美国陆军战术计划；预算重新分配或采购暂停会带来生死攸关的规模风险。
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
