  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、合同模式与变现
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works 主要通过联邦国防采购合同实现技术变现，把专有无人机机体与关键任务载荷、专业传感器套件和地面指挥站打包销售。已披露的美国陆军合同材料显示，核心 C100
              多任务四旋翼机是以集成任务套装而非裸机单独销售。比如，Redstone Arsenal 授予的一份固定总价陆军合同采购了 40 套 C100X MRD Mission Bundle、80 套 Next
              Vision Raptor 光电/红外传感器系统和 17 个 UXV 地面控制站，总对价为 $15.26M，意味着每套系统平均实现约 $381,500。除初始机体采购外，PDW 还通过替换部件、CORE
              自主环境等任务软件更新，以及认证高级教官开展的操作员培训课程获得后续收入。然而，公开记录没有把持续性软件许可收入与一次性硬件采购分开，外部分析师因此仍无法看清收入来源的真实持久性和质量。
