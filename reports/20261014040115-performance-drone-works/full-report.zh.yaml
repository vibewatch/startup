      - number: '1.2'
        title: 执行层、治理结构与战略监督
        blocks:
          - type: paragraph
            body: >-
              PDW 采用创始人主导的管理模式，同时引入高级国防将领治理经验和专业硬件工程人才。首席执行官兼联合创始人 Ryan Gury 负责战略愿景和产品设计；他与首席战略官兼联合创始人 Trevor Smith
              都有高性能空中机器人背景。管理团队还包括首席财务官 Tom Inman、首席技术官 Dylan Hamm、首席运营官兼总裁 James Slider，以及新任首席营收官 Shawn Hall；参谋长 Greg
              Farmer 负责运营测试。董事会由主席、美国特种作战司令部（USSOCOM）和联合特种作战司令部（JSOC）前司令 Raymond A. “Tony”
              Thomas（退役上将）领衔，为公司提供国防采购协同、作战可信度和接触国防部高层利益相关方的渠道。管理层技术能力深厚，且与精英军事体系高度契合，但关键人物依赖仍集中在负责平台愿景的联合创始人 Ryan
              Gury，以及负责国防客户关系的 Thomas 将军身上。
            claimRefs:
