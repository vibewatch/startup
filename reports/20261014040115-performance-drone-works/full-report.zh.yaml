        title: 战术 UAS 产品架构与 C100 平台
        blocks:
          - type: paragraph
            body: >
              Performance Drone Works（PDW）开发可由士兵携带、可消耗的无人机系统，专门应对受限的前线环境 [CE001]。公司的旗舰硬件平台 C100 是一款可单兵携带、重载的 Group 2
              战术四旋翼机，约自 2021 年起开发 [CE002]。机体可折叠，收纳后占用长 24 英寸、宽 15 英寸、高 8 英寸的背包空间，并能在两分钟内展开；C100 将战术班组机动与持久在线多任务能力结合起来
              [CE003, CE004]。搭载情报、监视与侦察（ISR）载荷时，续航最长 74 分钟；针对不同作战载荷，最长飞行时间为 50 至 75 分钟，最高速度达每小时 40.3 英里（65 km/h）[CE004,
              CE005, CE006]。机体具备 IP54 环境防护等级，飞行高度上限为 3,660 米（12,000 英尺），据报道声学特征低于同类战术四旋翼机 [CE002,
              CE005]。为确保战术生存能力和通信安全，C100 采用 DIU Blue UAS 认可的飞控航电以及 AES-256 加密数据链路 [CE004]。
