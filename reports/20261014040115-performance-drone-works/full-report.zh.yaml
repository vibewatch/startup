  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议立场
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works 的国防科技画像颇具吸引力，核心驱动力是前线军方对可消耗、可单兵携带自主飞行器的迫切需求。投资论点建立在国防部采购势头已经得到验证的基础上：公司已获得超过
              $15.3M 的美国陆军销售额，在 Transformation in Contact 计划下向多个全球战斗司令部供应 C100 sUAS。然而，反方论点指出估值高度不确定、财务不透明；私募市场估计的 $730M
              投后估值，无法与经审计的收入运行率、客户订单积压或交付利润率相互验证。因此，在取得经验证的财务报表和合同单位经济性、机构投资者能够进行尽调之前，我们给出“继续研究”的建议，置信度为中等，风险评级为高，估值立场为未知。
            claimRefs:
              - CV003
              - CV004
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV012
      - number: '8.2'
        title: 融资背景、倍数与股权结构表纪律
        blocks:
          - type: paragraph
            body: >-
              据报道，Performance Drone Works 于 2026 年 3 月完成 Series B 风险融资，筹资超过 $110M，隐含私募估值基准接近 $730M。根据已识别的国防合同订单，其累计收入介于
              $15M 至 $35M，按此计算，公司估值对应的企业收入倍数为过去销售额的 20x 至 45x。相比之下，成熟国防主承包商的交易倍数为收入的 1.5x 至 2.5x，公开交易的商用无人机制造商为收入的 3x 至
              6x，因此这一价格处于极高溢价水平。虽然国防科技同行会因自主软件、战术无线电集成和 Blue UAS
              合规而获得风险投资溢价，但进入纪律要求保持谨慎。由于公开资料没有披露清算优先权、优先债务负担或转换条款，没有专有数据室验证，就很难评估下行风险。
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV011
              - CV013
      - number: '8.3'
        title: 情景分析：乐观、基准与悲观回报画像
        blocks:
          - type: paragraph
            body: >-
              为评估不同国防采购路径下投资者可能获得的结果，我们以三至五年的持有期为框架，评估了三种运营情景。乐观情景下，C100 从试验性的 Transformation in Contact
              采购转为长期、多年度的正式项目，Drone Factory 01 将产能提升至每月 350 架四旋翼无人机和 5,000 枚 AM-FPV 弹药，按 15 倍至 22 倍收入计算，企业估值可能达到 $1.5B 至
              $2.2B。基准情景预计营级采购稳步增加， 带来每年 $40M 至 $60M 的国防销售额，支撑 $600M 至 $850M
              的估值。相反，悲观情景假设采购延迟、预算重新分配，以及国产零部件成本上升导致利润率承压， 企业价值收缩至 $200M 至 $350M。亨茨维尔单一工厂的制造集中度进一步放大下行风险。
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV013
      - number: '8.4'
        title: 建议逻辑、尽调触发项与退出准备度
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works 的综合决策逻辑，在已验证的技术能力和军方关系与治理、监管摩擦之间权衡。运营层面，PDW 已建立起坚实的技术护城河，包括 Blue UAS 认证、Doodle
              Labs 加密网状通信和 UXV Technologies 控制器互操作性；Tony Thomas 将军担任董事会主席，则进一步强化了这一优势。 但第 10
              区国家劳资关系委员会仍有一宗未结的不公平劳动行为指控，且工厂毛利率未披露，这些因素带来实质摩擦。要做出最终投资决策，还需完成三项确认性尽调： 审计单元层面的贡献利润率、厘清 NLRB
              指控的处理结果，以及核实未来国防拨款法案是否将其永久列入具体预算项目。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV012
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 入场纪律要求财务披露
            body: 尽管 Performance Drone Works 已展现出亮眼的战场采用情况和国产制造规模，机构投资者仍应保持“继续研究”立场，直到公司在保密审阅下提供经审计的单元利润率、 现金消耗率和清算优先权层级。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV012
              - CV014
          - type: callout
            title: 估值压制与劳工风险
            body: 按隐含的 $730M Series B 投后估值计算，如果合同增长停滞，估值倍数压缩将构成实质下行风险；NLRB 第 10-CA-375313 号案件持续带来的劳工审查会进一步放大这一风险。
            calloutType: risk
            claimRefs:
              - CV008
              - CV013
