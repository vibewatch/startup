      - number: '3.2'
        title: 产品差异化：C100 的续航和模块化架构对比竞品战术平台
        blocks:
          - type: paragraph
            body: >-
              PDW 的核心战术差异化来自 C100 sUAS：这是一款可装入背包的 Group 2 四旋翼平台，面向前线远征行动。C100 搭载载荷时最长飞行时间为 74 分钟，声学特征较低，并可在 10
              分钟内快速部署。C100 重约 21.4 磅，最大载荷为 10 磅，机体承载上限可达 30 磅，因此显著超过较轻的班组侦察四旋翼机。平台采用 DIU Blue UAS 认可的飞控航电，并配备 AES-256
              加密数据链路，以适应受限电磁环境。PDW 强调开放架构的模块化能力，可热插拔集成多种传感器套件，包括 Trillium HD40-LV EO/IR 云台、Next Vision Raptor
              双摄像系统，以及电子战或通信载荷。2026 年 7 月，在 Project Convergence Capstone 6 中，陆军士兵展示了集成 Picatinny Common Lethality
              Integration Kit（CLIK）和空投迫击炮弹转换套件的 C100，验证了该平台在标准 ISR 之外执行武装打击和动能任务的能力。此外，PDW 将可消耗打击产品组合扩展到 AM Attritable
              Multirotor 平台，并在 2026 年 3 月推动其（可更换 5 英寸、7 英寸和 10 英寸机臂配置）进入全速生产。不过，Anduril 的自主旋翼机和 Skydio 的 AI
              驱动视觉自主平台，仍会从软件深度和自主导航上挑战 PDW。
