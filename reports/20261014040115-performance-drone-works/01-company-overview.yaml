callouts:
  - calloutType: strength
    title: Domestic Defense Hardware and Sovereign Manufacturing Footprint
    body: PDW has successfully positioned itself as an American sovereign defense manufacturer with Blue UAS certification, NDAA compliance, and a dedicated 90,000-square-foot automated production facility in Huntsville. By securing multi-theater U.S. Army program contracts and high-volume component pipelines, the company possesses rare physical production scaling capacity in an industry historically constrained by prototype assembly.
    claimRefs:
      - CO001
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
  - calloutType: risk
    title: Private Cap-Table Opacity and Production Execution Hazards
    body: While headline financing figures are substantial—including over $110M in Series B equity and a conditional $820M federal loan commitment—detailed cap-table rights, valuation multiples, and GAAP financial performance remain strictly undisclosed. Concurrently, an open NLRB labor compliance charge and aggressive monthly targets (5,000 AM-FPV airframes) introduce operational execution risks.
    claimRefs:
      - CO002
      - CO008
      - CO012
      - CO016
