company:
  name: Performance Drone Works
chapter:
  number: 1
  title: Company Overview
  summary: Performance Drone Works (PDW) is a Huntsville-based tactical defense robotics manufacturer scaling American-made small uncrewed aircraft systems including the C100 multi-mission quadcopter and the AM-FPV attritable platform. Founded in 2018 from Drone Racing League roots, the company raised over $110 million in Series B financing, commissioned the 90,000-square-foot Drone Factory 01, and secured major U.S. Army program awards while navigating early labor compliance scrutiny and conditional federal loan commitments.
sections:
  - id: corporate-identity-and-mission
    title: Corporate Identity, Operating Base, and Tactical Mission
    body: Performance Drone Works (PDW) operates as a private defense robotics and autonomy hardware manufacturer headquartered at 3414 Governors Drive SW in Huntsville, Alabama, where it develops man-packable, modular tactical uncrewed aerial systems (sUAS) for frontline military and public-safety operations. The enterprise was founded in 2018 by combat veterans and drone racing engineers seeking to translate high-speed agile robotics insights into ruggedized tactical platforms capable of operating in heavily contested, GPS-denied combat environments. Rather than pursuing commercial enterprise drone services or large-scale strategic airframes, PDW focuses strictly on tactical small uncrewed systems, highlighted by the flagship C100 Group 2 multi-mission quadcopter, the AM-FPV attritable multicopter platform, and the CORE mission software operating suite. PDW positions itself around American domestic engineering and manufacturing sovereignty, achieving full National Defense Authorization Act (NDAA) compliance and Defense Innovation Unit (DIU) Blue UAS certification to directly counter Chinese supply-chain dependencies across Western defense forces.
    claimRefs:
      - CO001
      - CO004
      - CO007
      - CO010
    tableRefs:
      - TO001
    figureRefs: []
  - id: executive-governance-and-leadership
    title: Executive Leadership, Governance Structure, and Strategic Supervision
    body: PDW operates under founder-led executive management augmented by senior defense flag officer governance and specialized hardware engineering talent. Chief Executive Officer and co-founder Ryan Gury leads strategic vision and product design, drawing directly from high-performance aerial robotics backgrounds alongside Chief Strategy Officer and co-founder Trevor Smith. The executive suite is supported by Chief Financial Officer Tom Inman, Chief Technology Officer Dylan Hamm, Chief Operating Officer and President James Slider, and newly appointed Chief Revenue Officer Shawn Hall, alongside Chief of Staff Greg Farmer overseeing operational testing. Governance is anchored by Board Chairman General (Ret.) Raymond A. "Tony" Thomas, former Commander of U.S. Special Operations Command (USSOCOM) and Joint Special Operations Command (JSOC), providing strategic defense procurement alignment, operational credibility, and high-level Department of Defense stakeholder access. Although leadership demonstrates deep technical competence and elite military alignment, operating key-person reliance remains concentrated in co-founder Ryan Gury for platform vision and General Thomas for defense customer relationships.
    claimRefs:
      - CO003
      - CO005
      - CO006
      - CO009
    tableRefs:
      - TO002
    figureRefs: []
  - id: capital-structure-and-scale-expansion
    title: Capitalization History, Defense Commitments, and Industrial Scaling
    body: PDW has transitioned from an early-stage robotics innovator backed by RSE Ventures into a heavily capitalized defense industrial scale-up. In March 2026, the company completed a Series B financing round exceeding $110 million to accelerate production scaling, expand autonomous software engineering, and broaden modular payload integration. This institutional private capital was complemented by a conditional loan commitment of up to $820 million from the Department of War Office of Strategic Capital (OSC) to finance nationwide domestic manufacturing expansion for critical autonomous defense technologies. Industrial execution is centered on Drone Factory 01 (DF01), an advanced 90,000-square-foot facility in Huntsville officially opened in August 2025. DF01 establishes internal design-to-delivery capability supporting planned monthly output run-rates of 350 C100 airframes and 5,000 AM-FPV attritable munitions, while creating over 500 regional advanced manufacturing jobs with an estimated local economic impact exceeding $81 million annually.
    claimRefs:
      - CO002
      - CO008
      - CO011
      - CO012
    tableRefs:
      - TO003
    figureRefs: []
  - id: operational-milestones-and-labor-compliance
    title: Operational Milestones, Program Contracts, and Regulatory Oversight
    body: 'PDW has validated its tactical systems through major U.S. Army program wins while experiencing early industrial regulatory scrutiny. In December 2024, the company secured more than $15.3 million in U.S. Army contracts to field the C100 across U.S. Indo-Pacific Command, European Command, and Central Command under the Directed Requirement for Company-Level sUAS. In September 2025, PDW was awarded an additional $20.9 million contract to supply C100 systems and multi-mission payloads under the Army Transformation in Contact initiative. Strategic supply relationships include a $3.75 million purchase order placed with Unusual Machines in December 2025 to procure domestic, NDAA-compliant components for scaling the AM-FPV munition program. Concurrently, rapid manufacturing expansion has introduced regulatory friction: in November 2025, an unfair labor practice charge was filed against PDW with National Labor Relations Board (NLRB) Region 10 in Huntsville under case 10-CA-375313, alleging coercive work rules and unilateral changes in terms of employment during production ramp-up.'
    claimRefs:
      - CO013
      - CO014
      - CO015
      - CO016
    tableRefs: []
    figureRefs:
      - FO001
