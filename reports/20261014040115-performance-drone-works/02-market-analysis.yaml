callouts:
  - calloutType: insight
    title: Regulatory Moats Drive Defense Market Access
    body: National Defense Authorization Act (NDAA) restrictions and the Blue UAS certification framework create a critical barrier to entry against commercial quadcopter incumbents. Foreign-manufactured and non-compliant commercial drones are systematically banned from U.S. military installations and federal operations, granting a protected market environment to certified domestic manufacturers like PDW.
    claimRefs:
      - CM010
      - CM011
  - calloutType: risk
    title: Program Concentration and Capital Bottlenecks
    body: While PDW has demonstrated initial traction with over $15 million in U.S. Army awards and a 90,000-square-foot manufacturing expansion, the company faces significant program concentration risk. Commercial viability depends on converting experimental initiatives like Transformation in Contact into multi-year programs of record while securing domestic supply chains for high-rate production.
    claimRefs:
      - CM007
      - CM008
      - CM012
      - CM013
