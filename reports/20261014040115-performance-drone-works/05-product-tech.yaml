callouts:
  - calloutType: "strength"
    title: "Operational Moat via Modular Blue UAS Architecture"
    body: >
      PDW's dual qualification under DIU Blue UAS and the U.S. Army's Company-Level Directed Requirement establishes high regulatory friction for competitors. By combining modular payload compatibility with a man-packable 74-minute endurance profile, the C100 satisfies strict defense procurement mandates that exclude foreign-sourced commercial off-the-shelf alternatives [CE004, CE005, CE011].
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE011"

  - calloutType: "risk"
    title: "Factory Scaling Bottlenecks and Supplier Dependencies"
    body: >
      While Drone Factory 01 establishes an ambitious nameplate run-rate of 350 C100s and 5,000 AM-FPVs per month, sustaining this volume requires an entirely domestic, NDAA-compliant supply base. Reliance on emerging tier-1 domestic suppliers like Unusual Machines exposes PDW to component yield, quality control, and working capital risks before full-rate capacity is proven in production [CE010, CE012, CE013].
    claimRefs:
      - "CE010"
      - "CE012"
      - "CE013"

