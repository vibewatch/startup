callouts:
  - calloutType: strength
    title: Transformational Debt Facility Validates National Security Strategic Role
    body: The $820 million conditional loan commitment from the DOD Office of Strategic Capital provides extraordinary non-dilutive capital potential to scale domestic component manufacturing, insulating the company from immediate venture funding cycles.
    claimRefs:
      - CI012
      - CI013
  - calloutType: risk
    title: Severe Opacity Around Realized Commercial Revenue and Cash Burn
    body: Despite high-profile program selections and facility expansion announcements, public evidence lacks verified gross margin, recurring software revenue, or cash burn figures, while independent defense registries track zero matched federal procurement spending.
    claimRefs:
      - CI009
      - CI010
      - CI014
