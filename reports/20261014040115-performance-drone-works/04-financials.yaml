        - Supplier corporate disclosure via Greenville Online (SI010)
      - - CORE & SIM Software Suite
        - Bundled tactical operating software
        - List pricing undisclosed; embedded within mission system procurement
        - Whether software entails recurring annual maintenance fees is undisclosed
        - PDW product documentation and industry coverage (SI003, SI008)
