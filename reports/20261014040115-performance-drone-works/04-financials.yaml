      - - Army C100X Mission Bundle Package
        - Firm-fixed-price federal contract
        - Implied average package cost of $381,500 across 40 mission systems
        - Package includes 80 EO/IR sensors and 17 GCS units; unit airframe cost undefined
        - DoD contract announcement via 256 Today (SI004)
      - - Transformation in Contact Allocation
        - Directed requirement prime procurement
        - Disclosed aggregate sales value over $15.3M across INDOPACOM, EUCOM, CENTCOM
