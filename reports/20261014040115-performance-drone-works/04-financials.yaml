  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-recognition-and-cash-burn
      missingEvidence: Audited income statements detailing realized hardware deliveries, recurring software license revenue, gross margins, and monthly operating cash burn.
      whyItMatters: Institutional underwriting cannot establish unit profitability, operating break-even milestones, or intrinsic business valuation without historical revenue recognition data.
      diligencePath: Request audited FY2024-FY2025 financial statements and quarterly management accounts during confidential data room diligence.
      relatedQuestionRefs:
        - QI008
    - type: missing-source
      severity: material
      topic: federal-procurement-tracking
      missingEvidence: Reconciled contract award and payment records between public DOD announcements and federal spending databases.
      whyItMatters: Defense Tech Base reflects zero matched federal contract awards, making it impossible to verify the conversion rate of announcement figures into disbursed cash.
      diligencePath: Cross-reference FPDS and USASpending award transaction IDs against Army Contracting Command Redstone Arsenal contract files.
      relatedQuestionRefs:
        - QI006
    - type: conflicting-data
      severity: material
      topic: supply-chain-cogs-commitments
      missingEvidence: Disclosed bill of materials breakdown and supplier purchase agreement payment milestones for C100 and AM-FPV platforms.
      whyItMatters: Significant purchase orders such as the $3.75 million Unusual Machines commitment demonstrate material upfront working capital outflows without disclosed gross margin offsets.
      diligencePath: Review supplier Master Services Agreements and component pricing schedules under NDA.
      relatedQuestionRefs:
        - QI007
