    rows:
      - - C100 Tactical UAS Bundles
        - Firm-Fixed-Price Prime Contracts
        - Per complete mission bundle (airframe + payloads + GCS)
        - $15.26M initial Army contract (40 bundles); $20M follow-on reported
        - High program backing, but lumpy transaction timing
        - Delivery milestones and progress payment schedules
      - - AM-FPV Attritable Munitions
        - Volume Munition Production Contracts
        - Per attritable multirotor unit
        - Factory tooling sized for up to 5,000 units/month; initial orders pending
        - High volume potential, low unit price realization
        - Unit ASP, batch order volume, and government inventory pipeline
      - - Payload Integration & Spares
        - Component and Payload Options
        - Per optical/EW/tether module or replacement kit
        - Bundled with Raptor EO/IR systems and Trillium gimbals
        - High-margin expansion on existing fleet deployments
        - Attach rate per airframe and replacement cycle data
      - - Software & Simulation Training
        - Software updates and Master Trainer courses
        - Per system license and seat / training session
        - CORE 1.4 update released; SIM training environment operational
        - Potentially recurring, but currently bundled into hardware
        - Separation of software subscription revenue from hardware contracts
    notes: Factual synthesis of disclosed U.S. defense contract awards, hardware bundles, software delivery, and unverified commercial services as of October 2026.
