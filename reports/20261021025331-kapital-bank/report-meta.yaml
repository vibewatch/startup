  topStrengths:
    - Integrated regulated-bank and finance-operations product breadth addresses multiple SME workflows.
    - Reported balance-sheet, lending, deposit, invoice, and customer scale indicate meaningful operating reach.
    - >-
      An HR A+ stable bank rating and company-reported profitability are constructive, though not full
      equity-underwriting evidence.
  topRisks:
    - >-
      Intercam closing, sanctions-linked compliance review, asset quality, and integration remain incompletely
      evidenced.
    - >-
      Audited consolidated revenue, margins, cash generation, credit vintages, fraud losses, liquidity, and runway are
      unavailable.
    - Public evidence does not close remediation of the reported identity-document cloud exposure.
    - Ownership, liquidation preferences, board oversight, and investor protections remain undisclosed.
  unresolvedGaps:
    - >-
      Obtain audited consolidated financials, revenue-stream definitions, cash generation, regulatory capital, debt, and
      runway.
    - Verify current credit vintages, delinquencies, charge-offs, recoveries, fraud losses, and concentration schedules.
    - >-
      Confirm Intercam closing terms, regulatory conditions, acquired-asset perimeter, remediation findings, and
      integration KPIs.
    - >-
      Review the fully diluted cap table, liquidation preferences, board and committee structure, voting rights, and
      covenants.
    - >-
      Verify security-incident containment, notifications, regulator disposition, forensic findings, and independent
      remediation testing.
