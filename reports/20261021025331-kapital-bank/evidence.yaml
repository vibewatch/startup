  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: >-
      Audited consolidated income statements, cash flow, segment margins, regulatory capital, credit vintages, losses,
      and fraud performance.
    whyItMatters: >-
      Operating scale and a management profitability claim do not establish sustainable equity cash generation or
      downside protection.
    diligencePath: >-
      Obtain audited group financials, regulatory returns, monthly management accounts, cohort loss curves, and a
      quality-of-earnings review.
