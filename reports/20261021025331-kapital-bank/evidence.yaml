evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, committee mandates, shareholder percentages, voting rights, and founder or investor control
      provisions.
    whyItMatters: >-
      Without this evidence, oversight quality, key-person dependence, related-party controls, and investor protections
      cannot be assessed.
    diligencePath: >-
      Obtain the current corporate chart, board and committee materials, stock ledger, cap table, shareholder agreement,
      and voting-rights schedule.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Audited consolidated revenue, revenue mix, recurring-revenue definition, profitability bridge, cash balance, debt
      schedule, burn, and runway.
    whyItMatters: >-
      Funding and company profitability claims cannot establish operating cash generation, liquidity, or sustainable
      earnings.
    diligencePath: >-
      Review audited consolidated statements, monthly management accounts, bank statements, debt agreements, and a
      revenue-to-cash reconciliation.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: >-
      Kapital's incident response, closure date, affected-person count, notification record, forensic findings, and any
      regulator disposition.
    whyItMatters: >-
      The retained adverse report establishes an exposure allegation but not remediation quality, realized harm, or
      residual liability.
    diligencePath: >-
      Request the incident report, cloud audit logs, notification evidence, regulator correspondence, penetration-test
      results, and remediation attestation.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: Intercam
    missingEvidence: >-
      Transaction closing evidence, acquired legal entities and liabilities, integration KPIs, customer overlap, and
      post-close asset-quality performance.
    whyItMatters: The announced acquisition could alter Kapital's regulatory, compliance, credit, and capital profile.
    diligencePath: >-
      Obtain executed closing documents, regulator approvals, purchase accounting, integration dashboards, AML
      remediation plans, and acquired-book performance.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Eligible-SME counts by geography and segment, product penetration, average revenue per business, and a
      methodology-consistent TAM/SAM/SOM bridge.
    whyItMatters: >-
      Without common denominators, the disclosed funding and operating-volume metrics cannot support a market-share
      estimate or market-size valuation premium.
    diligencePath: >-
      Request management's segment-by-geography customer and revenue model, then reconcile it to public SME census and
      banking-regulator data.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: conflicting-sizing
    missingEvidence: >-
      A primary financial statement that confirms the currency, unit, period, and perimeter behind the published MXN
      6,291 billion loan-portfolio figure.
    whyItMatters: >-
      The anomalous published scale could materially overstate company reach and invalidates comparisons until
      reconciled.
    diligencePath: >-
      Reconcile the figure against Kapital's audited bank statements and regulatory balance-sheet filings for the same
      reporting date.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Procurement roles, budget ownership, conversion cohorts, switching timelines, willingness to pay, and retention by
      SME segment.
    whyItMatters: >-
      Public product language identifies eligible users but does not prove who controls budget, how adoption expands, or
      whether integrated usage persists.
    diligencePath: >-
      Review CRM cohorts and interview customers across credit-led, deposit-led, and foreign-exchange-led acquisition
      paths.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM006
    relatedTableRefs:
      - TM003
  - type: access-blocked
    severity: minor
    topic: access-limited
    missingEvidence: Substantive fetched text from the allocated Reuters/TradingView and Extruct pages.
    whyItMatters: >-
      Their assigned pages could not support claims about acquisition scope or competitive market estimates from the
      prefetched text.
    diligencePath: >-
      In a later authorized run, retrieve the original Reuters item and a readable primary or independent
      competitive-market source.
    relatedQuestionRefs:
      - QM001
      - QM007
  - type: missing-source
    severity: material
    topic: competitive-pricing
    missingEvidence: Comparable current rates, fees, terms, minimums, discounts, and realized total cost for Kapital and Konfio.
    whyItMatters: Without normalized pricing, product breadth cannot establish customer value or margin durability.
    diligencePath: Obtain current term sheets, fee schedules, and anonymized realized contracts for matched SME cohorts.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Retention, product attach, migration time, multi-homing, and cohort-level churn for Kapital customers.
    whyItMatters: An integrated interface is not proof of durable lock-in or pricing power.
