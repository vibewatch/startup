            - Unknown
            - High
            - Unknown
        - label: Integrated-platform resilience
          values:
            - Unknown
            - High
            - Unknown
        - label: Governance visibility
          values:
            - Unknown
            - Medium
            - Weak in public evidence
    approximationNotes: >-
      Qualitative categories synthesize cited evidence and gaps; they are not numerical
      probabilities, benchmark scores, or proof that an unrecorded incident did not occur.
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR009
      - CR013
      - CR015
callouts:
  - calloutType: risk
    title: Primary thesis-break condition
    body: >-
      An adverse AML finding affecting transferred assets, failure to obtain final approvals,
      or integration capital needs materially beyond disclosed support would invalidate the
      assumption that Kapital can acquire scale without importing disproportionate compliance
      and balance-sheet risk.
    claimRefs:
      - CR001
      - CR003
      - CR005
  - calloutType: insight
    title: Constructive signal, limited scope
    body: >-
      The HR A+ stable rating is a useful dated external credit signal, but it does not answer
      the missing portfolio-vintage, fraud, concentration, or holding-company liquidity questions.
    claimRefs:
      - CR009
