schemaVersion: report-v2
artifact: risks
slug: kapital-bank
runDate: 2026-10-21
company:
  name: Kapital Bank
chapter:
  number: 7
  title: Risks
  summary: >-
    The most consequential risk is execution around the Intercam transaction: the acquired
    assets follow U.S. money-laundering sanctions, the deal was conditional on approvals and
    final agreements, and retained public evidence does not close post-acquisition asset-quality
    or integration questions. A dated HR A+ stable rating is constructive, but it does not
    substitute for portfolio vintages, fraud data, concentration disclosures, or group-level
    liquidity evidence.
sections:
  - id: risk-posture
    title: Risk posture and ranking
    body: >-
      Kapital's risk profile is dominated by a high-impact integration and compliance event
      rather than by a demonstrated operating failure. Yucatan Magazine and Reuters reported
      that the proposed Intercam asset acquisition followed U.S. sanctions that identified
      Intercam as a primary money-laundering concern; the transaction was still conditional in
      the retained reporting. Kapital had engaged K2 Integrity and said it was coordinating with
      U.S. and Mexican authorities, which are meaningful mitigations but not evidence that asset
      screening, approvals, migration, or customer remediation are complete. The investment view
      should therefore treat transaction completion without adverse findings as a milestone, not
      as a settled fact. The residual ranking below uses "unknown" wherever the assigned public
      evidence cannot support a probability.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
    figureRefs:
      - FR001
  - id: regulatory-legal
    title: Regulatory, legal, and compliance exposure
    body: >-
      The core legal risk is inherited exposure from acquiring selected operations of a
      sanctioned institution. The retained reports distinguish the allegations against Intercam
      from Kapital itself, so they do not support an accusation that Kapital committed the
      alleged conduct. They do support enhanced diligence on customer files, beneficial
      ownership, correspondent relationships, transaction history, and the exact perimeter of
      assets transferred. The announced use of K2 Integrity and regulatory engagement lowers,
      but does not eliminate, the possibility of delayed approval, excluded assets, remediation
      costs, or restrictions imposed after review. The official governance URL was successfully
      prefetched through an archive, but its reviewed text exposed only contact information; board
      and committee evidence remains a public-evidence gap rather than proof of weak governance.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR015
    tableRefs:
      - TR001
  - id: operating-financial
    title: Operational, credit, and financial-model risk
    body: >-
      The platform combines accounts, payments, payroll, expense controls, cards, and credit,
      increasing the number of operational and control surfaces that must work together. Public
      scale indicators are substantial but unevenly defined: Contxto reported more than 33,000
      guaranteed loans and more than 100 thousand financed clients, while its separate
      "funds raised" figure is neither revenue nor cash available. PromptLoop's 500-employee
      count is undated and cannot be treated as current headcount. Reuters reported a financing
      round giving access to up to $100 million and a further $100 million investment tied to the
      Intercam closing; those are financing and transaction commitments, not runway. Without
      vintage loss curves, fraud splits, liquidity, and consolidated burn, downside cannot be
      quantified reliably.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
    tableRefs:
      - TR002
  - id: dependencies-triggers
    title: Dependencies, monitoring, and thesis-break triggers
    body: >-
      Kapital depends on regulators to approve the transaction, on counterparties and advisers
      to define a clean asset perimeter, and on external capital to absorb integration demands.
      The March 2026 HR A+ stable rating is the freshest dated credit signal in the assigned
      evidence, but the rating page provides no portfolio-level underwriting detail and applies
      to the named rated entity, not automatically to every holding-company obligation. Monitor
      final approvals, K2 review scope, excluded or remediated accounts, integration cost, capital
      ratios, liquidity, loss vintages, fraud losses, and customer concentration. Thesis-break
      triggers are an adverse AML finding affecting transferred assets, approval failure, capital
      support materially beyond the announced amount, or deterioration in the rating/outlook
      without adequate disclosed remediation.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR006
      - CR009
    tableRefs:
      - TR003
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or rule
      - Evidence and status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure and diligence path
    rows:
      - - Intercam transaction approval
        - Retained reporting described the acquisition as subject to approvals and final agreements.
        - Medium; the transaction was announced but conditional in the retained evidence.
        - High
        - Partial; Kapital reported authority engagement.
        - Obtain final approval orders, signed perimeter schedules, conditions, and closing evidence.
      - - Inherited AML and sanctions exposure
        - Intercam was identified in retained reporting as a U.S. primary money-laundering concern.
        - Unknown; no retained source quantifies tainted assets within the proposed perimeter.
        - High
        - Partial; K2 Integrity was engaged to review assets.
        - Review KYC files, beneficial owners, correspondent activity, exclusions, and remediation costs.
      - - Cross-border regulatory coordination
        - Kapital said it was working with U.S. and Mexican authorities on compliance.
        - Medium; multiple authorities and jurisdictions remain involved.
        - High
        - Partial; engagement is disclosed, outcomes are not.
        - Require regulator correspondence, conditions precedent, and named accountable executives.
      - - Governance and oversight visibility
        - The reviewed official governance-page text exposed contact details but not board or committee materials.
        - Unknown
        - Medium
        - Weak in public evidence.
        - Obtain current board, committee charters, ownership map, AML reporting lines, and meeting cadence.
    notes: >-
      Partial public-source register as of 2026-10-21; likelihood labels are analytical
      classifications, not disclosed probabilities, and null evidence is shown as unknown.
    enumerationScope:
      coverage: partial
      basis: >-
        Material regulatory and legal issues visible in the eight-source assigned pool,
        excluding unsupported allegations and unavailable private transaction documents.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR015
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Public evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Unresolved gap
    rows:
      - - Failure across an integrated financial-operations stack
        - An external directory describes accounts, payroll, transfers, expense controls, cards, and credit in one platform.
        - Unknown
        - High because banking and credit workflows are interdependent.
        - Unknown; no retained control or incident report supports a stronger judgment.
        - Obtain uptime, incident, disaster-recovery, security-audit, and control-testing evidence.
      - - Credit losses or fraud outpace disclosed economics
        - Contxto reported loan and client scale, but the assigned pool has no vintage, delinquency, charge-off, or fraud split.
        - Unknown
        - High
        - Unknown
        - Obtain monthly cohorts by product, geography, borrower size, fraud type, and collection channel.
      - - Integration capacity is overstretched
        - PromptLoop lists 500 employees without a date; Reuters reported a large acquisition and associated capital investment.
        - Medium during integration, subject to verification.
        - High
        - Partial; announced financing provides capacity but not execution proof.
        - Reconcile current headcount, key-person retention, migration plans, integration budget, and control ownership.
    notes: >-
      Public operating evidence is incomplete and differently dated; "unknown" avoids treating
      absence of a recorded incident as proof of operational safety.
    claimRefs:
      - CR005
      - CR011
      - CR012
      - CR013
      - CR014
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Failure scenario
      - Severity
      - Current mitigation
      - Residual exposure and monitor
    rows:
      - - Regulatory approvals
        - Mexican and U.S. authorities
        - Approval is delayed, narrowed, conditioned, or denied.
        - High
        - Kapital reported constructive compliance engagement.
        - Monitor written approvals, conditions, timing, and any business restrictions.
      - - Asset-perimeter diligence
        - Intercam sellers, K2 Integrity, and integration teams
        - Problem customers or transactions enter the acquired perimeter or require costly remediation.
        - High
        - Third-party asset review was announced.
        - Monitor exclusions, false-negative testing, remediation backlog, and post-close alerts.
      - - Capital and credit standing
        - Equity/debt providers and HR Ratings
        - Integration absorbs more than announced support or credit standing deteriorates.
        - High
        - Up to $100 million financing access, a planned $100 million bank investment, and HR A+ stable.
        - Monitor funded versus available capital, covenants, liquidity, capital ratios, and rating actions.
    notes: >-
      Announced financing access and investment are not cash available or runway; the rating is
      dated 2026-03-24 and should be refreshed if a later action exists.
    claimRefs:
      - CR002
      - CR004
      - CR005
      - CR006
      - CR009
