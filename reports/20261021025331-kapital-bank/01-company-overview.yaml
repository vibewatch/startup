company:
  name: "Kapital Bank"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Kapital Bank is a Mexico-founded Series C financial platform that combines
    banking infrastructure with software for SMEs and also operates in Colombia.
    Public sources support a September 2025 $1.3 billion valuation and indicate
    substantial subsequent scale, but consolidated revenue, ownership, governance,
    and security-remediation evidence remain material diligence gaps.
sections:
  - id: "identity-and-operating-footprint"
    title: "Identity and operating footprint"
    body: >-
      Kapital Bank was founded in Mexico in 2021 and is classified by Tracxn as a
      Series C company. Its retained official governance page gives a Mexico City
      address, while independent reporting says the company also operates in
      Colombia. The business is best described as a regulated financial-services
      and software platform: retained sources attribute banking, credit, investment,
      and financial-management capabilities to it, with an emphasis on SMEs.
      Current scale is less certain. Tracxn reports 3,646 employees as of September
      30, 2026, while a separate 2024 operating account reported more than 100,000
      financing clients and more than 33,000 guaranteed loans. These are different
      populations and vintages, so they should not be combined into a single
      customer or activity metric.
    claimRefs: [CO001, CO002, CO003, CO004, CO012, CO013, CO014]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      The disclosed founder-led operating team is concentrated around René Saul,
      identified as co-founder and CEO, and Fernando Sandoval, identified as
      co-founder and CFO. Saul is the public voice for the company's banking-license
      and proprietary-software strategy and has described the group as profitable,
      but that statement is company-claimed and is not a substitute for audited
      consolidated accounts. Public governance evidence is materially thinner than
      leadership evidence: the retained official governance page resolved only to
      an address in the fetched text and did not disclose board membership,
      committees, shareholder percentages, or control rights. The resulting
      key-person and oversight assessment therefore remains provisional pending
      primary corporate records and a management-provided governance package.
    claimRefs: [CO005, CO006, CO010]
    tableRefs: [TO002]
  - id: "capital-and-strategic-milestones"
    title: "Capital, ownership signals, and strategic milestones"
    body: >-
      Kapital crossed the unicorn threshold in September 2025: LatamList reported
      an $86 million Series C led by Tribe Capital and Pelion Ventures, and Reuters
      reported a valuation above $1.3 billion. Tracxn later reported $307 million
      raised across 12 rounds; that database total may mix equity and debt and does
      not establish cash available, fully diluted ownership, or liquidation
      preferences. The company's regulated-infrastructure strategy included the
      2023 purchase of Banco Autofin. Reuters also reported an agreement to acquire
      selected Intercam brokerage, asset-management, and operating-banking assets,
      alongside a planned $100 million investment into Kapital's banking operations.
      The timeline is strategically coherent, but transaction completion,
      integration performance, and the cap table remain unverified in the retained
      evidence.
    claimRefs: [CO007, CO008, CO009, CO011, CO015]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: "risk-signals-and-diligence-boundaries"
    title: "Risk signals and diligence boundaries"
    body: >-
      The strongest adverse signal is a Cybernews investigation that attributed an
      exposed cloud-storage bucket containing 1,674,324 files, primarily voter IDs
      and identity-verification selfies, to Kapital. The publication said the
      bucket remained open on December 6, 2024 after disclosure attempts. This is
      an independent allegation, not a regulator's final finding, and the retained
      pool contains no later company response, remediation confirmation, affected-
      person count, or enforcement outcome. Separately, Reuters noted that Intercam
      had been targeted by U.S. sanctions as a primary money-laundering concern
      while Mexican officials said evidence had not been supplied to them. Those
      facts heighten compliance-integration diligence but do not establish
      wrongdoing by Kapital. Revenue, ownership, board oversight, and incident
      closure remain the principal evidence boundaries for this overview.
    claimRefs: [CO015, CO016]
