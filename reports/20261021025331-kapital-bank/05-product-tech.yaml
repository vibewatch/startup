  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public API documentation, repository activity, package metrics, engineering talks, status history, or another practitioner-community execution proxy.
      whyItMatters: Product breadth cannot be translated into engineering maturity, integration effort, release cadence, or reliability without a public technical surface.
      diligencePath: Request API and integration documentation, twelve months of release and incident history, architecture review materials, and engineering delivery metrics.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: architecture
      missingEvidence: Verified service boundaries, hosting topology, vendor dependencies, data lineage, recovery objectives, capacity metrics, and component ownership.
      whyItMatters: The public operating model does not establish scalability, resilience, migration complexity, or concentration in third-party services.
      diligencePath: Conduct a technical architecture review with system diagrams, dependency inventory, recovery tests, capacity results, and named owners.
      relatedQuestionRefs: [QE003, QE004, QE008]
      relatedTableRefs: [TE003]
    - type: stale
      severity: material
      topic: security-remediation
      missingEvidence: Current containment, affected-party notification, regulator disposition, forensic findings, and independently tested remediation for the reported cloud exposure.
      whyItMatters: Identity-document exposure creates privacy, fraud, regulatory, and trust risk that control descriptions alone cannot close.
      diligencePath: Obtain the incident report, regulator correspondence, notification record, remediation evidence, access-log analysis, and an independent retest.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: security-assurance
      missingEvidence: Current security and privacy certifications, penetration-test scope and results, encryption and access-control evidence, model governance, and control-effectiveness metrics.
      whyItMatters: Company-described compliance components do not establish that software, cloud, and AI controls operate effectively.
      diligencePath: Review current audit reports, penetration tests, control exceptions, model inventory, validation results, false-positive rates, and remediation tracking.
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: material
      topic: intercam-integration
      missingEvidence: Transaction closing status, integration milestones, system migration plan, product rationalization, data conversion controls, and post-migration service levels.
      whyItMatters: The proposed assets broaden the product perimeter and may increase operational, compliance, and technical complexity.
