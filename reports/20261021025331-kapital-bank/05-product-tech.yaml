schemaVersion: "report-v2"
artifact: product-tech
slug: kapital-bank
runDate: "2026-10-21"
company:
  name: Kapital Bank
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Kapital publicly describes an integrated SME operating and banking workspace that combines
    capital, cash-flow visibility, invoicing, payroll, loan management, and compliance tooling.
    The retained evidence supports the breadth of that product surface but not the underlying
    architecture, service levels, certifications, or Intercam integration plan; a reported
    exposure of identity documents makes independent security remediation evidence a material
    diligence requirement.
sections:
  - id: product-scope-and-workflow
    title: Product scope and customer workflow
    body: >-
      Kapital's public product definition is broader than a lending application. The company says
      it provides capital to small and medium-sized businesses while exposing operations, cash
      flows, loan management, payroll, benefits, and invoicing in one environment. Independent
      coverage of a management interview similarly describes a single place where an SME can see
      the real-time status of its money, and reports more than 300 million invoices processed
      through the digital platform. Those statements support an integrated finance-operations
      workflow, but they do not disclose active-user frequency, invoice uniqueness, workflow-level
      adoption, or realized customer outcomes. Cybernews separately reported that the Kapital
      Business application had exceeded 100,000 Google Play downloads; downloads establish
      distribution, not active use, retention, or production depth.
    claimRefs: [CE001, CE002, CE003, CE004, CE014]
    tableRefs: [TE001, TE002]
  - id: architecture-maturity-and-integration
    title: Architecture, maturity, and integration
    body: >-
      The observable operating model has four public elements: customer-facing financial
      workflows, electronic-invoice data, AI-enabled analysis and automation, and a regulated-bank
      and compliance substrate. Kapital says its controls use KYC, customer-risk assessment,
      transaction monitoring, restricted-party screening, and Mexican SAT invoice data. It also
      described AI analysis tools as an investment direction rather than a delivered feature set.
      The proposed Intercam transaction would add brokerage, asset-management, and operational
      banking assets, and the announced $100 million investment is earmarked for operations,
      compliance, and technology infrastructure. Definitive agreements, remaining approvals,
      migration sequence, data lineage, system boundaries, capacity, recovery objectives, and
      service levels remain undisclosed, so the architecture map is a sourced operating model
      rather than a verified technical design.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-security-and-control-gaps
    title: Trust, security, and control gaps
    body: >-
      Kapital's acquisition release describes a comprehensive AML/CFT control stack and says K2
      Integrity was engaged to vet the Intercam assets. An external credit-rating page also lists
      KPTL Mexico Bank at HR A+ with a stable outlook as of March 24, 2026, which is relevant to the
      regulated operating base but is not evidence of product security, availability, or software
      quality. The strongest adverse evidence is Cybernews' report that a misconfigured cloud
      bucket attributed to Kapital exposed 1,674,324 files, mostly voter IDs and identity-verification
      selfies, and remained open as of December 6, 2024 after repeated disclosure attempts. The
      retained evidence does not establish subsequent containment, notification, regulator
      findings, or control remediation. Underwriting therefore requires independent proof of
      remediation, penetration testing, access-control review, incident governance, and current
      security or privacy attestations.
    claimRefs: [CE008, CE009, CE011, CE012, CE013]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or asset
      - Primary user
      - Public maturity signal
      - Differentiation indicated by evidence
      - Diligence gap
    rows:
      - [SME capital and loans, Business owner or finance lead, Operating product, Capital embedded with operating-finance visibility, Underwriting workflow and product-level loss performance]
      - [Financial operations workspace, Finance and operations teams, Publicly described as operating, One environment for cash flow loan payroll benefit and invoice workflows, Feature-level usage and realized customer outcomes]
      - [Invoice data and processing, Finance and risk teams, More than 300 million invoices reported as processed, Transaction context from Mexican electronic-invoice data, Unique-invoice denominator throughput and data lineage]
      - [AI analysis and automation, Business and compliance teams, Mix of described controls and planned tools, Analysis applied to SME finance and compliance workflows, Model inventory accuracy validation and human oversight]
      - [Intercam brokerage asset-management and banking assets, Existing and prospective banking clients, Proposed acquisition subject to execution and approvals, Broader product and regulated-asset perimeter, Closing status migration plan and post-integration controls]
    notes: >-
      Statuses are limited to the retained public evidence; no private roadmap, architecture
      documentation, usage telemetry, or product-level performance data was available.
    claimRefs: [CE001, CE002, CE004, CE005, CE006, CE008]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current workflow problem
      - Kapital solution described publicly
      - Measurable public signal
      - Limitation
    rows:
      - [Monitor liquidity, Fragmented view of money and operations, Real-time financial visibility in one platform, None disclosed for active usage, Interview-based product description]
      - [Manage finance operations, Separate loan payroll benefit and invoice workflows, Integrated operations and cash-flow workspace, More than 300 million invoices reportedly processed, Period denominator and unique-invoice count not disclosed]
      - [Access business capital, SMEs lack efficient access to bank credit, Capital and loan products linked to operating data, "More than 33,000 guaranteed loans reported in the Contxto article", Loan vintage approval denominator and loss performance absent]
      - [Complete identity and transaction controls, KYC and transaction-risk review across banking activity, KYC risk assessment monitoring screening and SAT-data checks, Control components described but no tested effectiveness metric, No retained certification audit or false-positive rate]
      - [Adopt the mobile service, Access business finance from a distributed interface, Kapital Business application, "More than 100,000 Google Play downloads reported by Cybernews", Downloads do not show active use retention or satisfaction]
    notes: >-
      Metrics are publisher-reported or company-quoted and are not normalized to a common period or
      denominator; null performance fields require product analytics and control-testing evidence.
    claimRefs: [CE001, CE002, CE003, CE004, CE008, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Publicly evidenced role
      - Key dependency
      - Principal risk
    rows:
      - [Customer experience, Operations cash-flow loan payroll benefit and invoice visibility, Reliable identity account and workflow orchestration, Breadth is described without service-level or adoption evidence]
      - [Invoice and transaction data, SAT invoice data supports customer counterparty and transaction screening, Data permission quality lineage and freshness, Incomplete or mis-scoped data could impair decisions and monitoring]
      - [Analytics and automation, AI-enabled analysis and process automation, Model governance validation and human escalation, Public sources do not disclose model inventory accuracy or monitoring]
      - [Compliance controls, KYC customer-risk assessment transaction monitoring and restricted-party screening, Current sanctions data case management and trained operators, Company descriptions are not independent control-effectiveness tests]
      - [Regulated bank and acquired assets, Banking brokerage and asset-management operating perimeter, Regulatory approvals core migration and reconciled records, Integration complexity and inherited operational risk]
      - [Cloud data protection, Storage and processing of identity-verification documents, Least-privilege access encryption logging and incident response, Reported bucket exposure lacks public remediation evidence]
    notes: >-
      This is an evidence-bounded operating model, not a verified software architecture; interfaces,
      vendors, hosting topology, recovery objectives, certifications, and ownership boundaries are
      not disclosed in the retained sources.
    claimRefs: [CE002, CE004, CE005, CE006, CE008, CE011]
figures:
  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      Public evidence supports a layered operating model, while technical interfaces and assurance
      details remain diligence gaps.
    data:
      layers:
        - label: Customer operations
          items:
            - Cash-flow visibility
            - Loan management
            - Payroll and benefits
            - Invoicing
          detail: Publicly described product surface; feature adoption and service levels are undisclosed.
        - label: Banking and product services
          items:
            - SME capital
            - Operational banking
            - Proposed brokerage
            - Proposed asset management
          detail: Intercam additions remain transaction- and integration-dependent.
        - label: Data
          items:
            - SAT electronic invoices
            - Customer records
            - Counterparty records
            - Transaction records
          detail: Public sources do not document lineage, consent boundaries, retention, or data quality.
        - label: Analytics and automation
          items:
            - AI-enabled analysis
            - Workflow automation
            - Customer risk assessment
          detail: Delivered capabilities and roadmap items are not fully separated publicly.
        - label: Compliance controls
          items:
            - KYC due diligence
            - Transaction monitoring
            - Restricted-party screening
            - AML and CFT protocols
          detail: Control design is company-described; independent effectiveness evidence is absent.
        - label: Trust and infrastructure
          items:
            - Regulated-bank operating base
            - Cloud storage
            - Identity-document handling
            - Incident response
          detail: A reported cloud exposure makes remediation and assurance evidence material.
    approximationNotes: >-
      Layer ordering is analytical and does not claim the company's actual deployment topology or
      data-flow direction.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011, CE013]
callouts:
  - calloutType: strength
    title: Integrated SME workflow is the clearest product thesis
    body: >-
      Kapital combines access to capital with operational and finance visibility rather than
      presenting credit as a standalone endpoint, but public evidence does not yet quantify
      workflow adoption or customer-level outcomes.
    claimRefs: [CE001, CE002, CE003, CE004]
  - calloutType: risk
    title: Security remediation is not publicly closed
    body: >-
      The retained adverse report describes a material identity-document exposure; current
      remediation, affected-party notification, regulator disposition, and independent assurance
      remain unverified.
    claimRefs: [CE011, CE012]
