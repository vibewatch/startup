      - number: '4.2'
        title: Public traction is meaningful but mostly company-reported
        blocks:
          - type: paragraph
            body: >-
              Contxto reported that, at the end of 2024, Kapital had raised more than MXN 10 billion in funds, granted
              more than 33,000 guaranteed loans, provided more than MXN 22 billion of financing to over 100,000 clients,
              reached a MXN 6.291 billion loan portfolio and processed more than 300 million invoices. A later funding
              article reported a $3 billion balance sheet, more than 300,000 business customers and company-confirmed
              profitability; Wikipedia repeats the scale figures. These are strong signals of throughput and
              balance-sheet expansion, but they are not a substitute for audited consolidated revenue, average balances,
              cohort performance or a reconciliation between group, bank and platform metrics.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Unit economics cannot yet be underwritten
        blocks:
          - type: paragraph
            body: >-
              Public volume does not reveal economic quality. The retained sources do not quantify net interest margin,
              fee take rates, funding cost, interchange economics, credit losses, fraud, servicing cost, customer
              acquisition cost or payback. That prevents a reliable bridge from customer activity to gross profit and
              makes the reported profitability milestone difficult to normalize across the regulated bank and the wider
              group. Management should provide product-level revenue recognition, monthly average balances, net
              charge-offs by vintage, deposit and wholesale funding costs, contribution margin after servicing, and
              acquisition cost by channel. Until then, scale should be treated as evidence of activity rather than proof
              of durable unit economics.
            claimRefs:
              - CI010
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI010
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Fresh capital and a stable rating do not resolve runway
        blocks:
          - type: paragraph
            body: >-
              Tech Funding News and Crowdfund Insider reported a Series C of up to $100 million, with proceeds directed
              toward the AI-enabled platform and regional expansion. Crowdfund Insider also reported a planned $100
              million investment to strengthen operations after the Intercam asset acquisition, while highlighting
              credit-cycle, covenant and cash-flow stress considerations. HR Ratings lists KPTL México Bank at HR A+
              with a stable outlook as of March 24, 2026, which is a useful current external credit signal but not
              evidence of holdco liquidity. No retained source discloses cash on hand, monthly burn, unrestricted
              liquidity, debt covenants or a consolidated runway. The investment case therefore depends on management
              evidence separating regulated-bank capital from deployable parent-company cash.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised is not cash available
            body: >-
              The reported Series C and historical financing demonstrate access to capital, but they do not establish
              unrestricted cash, burn or runway; bank regulatory capital and acquisition commitments may constrain
              deployment.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Kapital's public product definition is broader than a lending application. The company says it provides
              capital to small and medium-sized businesses while exposing operations, cash flows, loan management,
              payroll, benefits, and invoicing in one environment. Independent coverage of a management interview
              similarly describes a single place where an SME can see the real-time status of its money, and reports
              more than 300 million invoices processed through the digital platform. Those statements support an
              integrated finance-operations workflow, but they do not disclose active-user frequency, invoice
              uniqueness, workflow-level adoption, or realized customer outcomes. Cybernews separately reported that the
              Kapital Business application had exceeded 100,000 Google Play downloads; downloads establish distribution,
              not active use, retention, or production depth.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
