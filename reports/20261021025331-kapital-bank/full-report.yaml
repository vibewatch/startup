              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE008
              - CE014
      - number: '5.2'
        title: Architecture, maturity, and integration
        blocks:
          - type: paragraph
            body: >-
              The observable operating model has four public elements: customer-facing financial workflows,
              electronic-invoice data, AI-enabled analysis and automation, and a regulated-bank and compliance
              substrate. Kapital says its controls use KYC, customer-risk assessment, transaction monitoring,
              restricted-party screening, and Mexican SAT invoice data. It also described AI analysis tools as an
              investment direction rather than a delivered feature set. The proposed Intercam transaction would add
              brokerage, asset-management, and operational banking assets, and the announced $100 million investment is
              earmarked for operations, compliance, and technology infrastructure. Definitive agreements, remaining
              approvals, migration sequence, data lineage, system boundaries, capacity, recovery objectives, and service
              levels remain undisclosed, so the architecture map is a sourced operating model rather than a verified
              technical design.
            claimRefs:
