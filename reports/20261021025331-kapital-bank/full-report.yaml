      - number: '1.4'
        title: Risk signals and diligence boundaries
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse signal is a Cybernews investigation that attributed an exposed cloud-storage bucket
              containing 1,674,324 files, primarily voter IDs and identity-verification selfies, to Kapital. The
              publication said the bucket remained open on December 6, 2024 after disclosure attempts. This is an
              independent allegation, not a regulator's final finding, and the retained pool contains no later company
              response, remediation confirmation, affected- person count, or enforcement outcome. Separately, Reuters
              noted that Intercam had been targeted by U.S. sanctions as a primary money-laundering concern while
              Mexican officials said evidence had not been supplied to them. Those facts heighten compliance-integration
              diligence but do not establish wrongdoing by Kapital. Revenue, ownership, board oversight, and incident
              closure remain the principal evidence boundaries for this overview.
            claimRefs:
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulated infrastructure is a strategic differentiator
            body: >-
              The Banco Autofin acquisition gave Kapital a banking-license pathway, while management attributes
              profitability and growth to combining that license with proprietary software.
            calloutType: strength
            claimRefs:
              - CO007
              - CO010
          - type: callout
            title: Security remediation is not publicly closed
            body: >-
              The retained evidence contains a detailed independent exposure allegation but no subsequent remediation
              confirmation, regulator outcome, or quantified affected-customer count.
            calloutType: risk
            claimRefs:
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than Latin American fintech and broader than stand-alone SME lending.
              Kapital's current public offer combines banking, credit, investment, and foreign exchange, while
              third-party descriptions emphasize financial visibility and tools for small and medium-sized businesses.
              The core boundary is therefore an SME financial-operations platform in Mexico, with Colombia as a reported
              geographic adjacency. Included spend should be limited to business deposits, payments, working-capital
              credit, treasury or investment products, foreign exchange, and software-enabled financial administration.
              Consumer savings, institutional interbank treasury, and unrelated retail banking should not be counted as
              core addressable spend. Status-quo substitutes remain incumbent banks, separate lenders, spreadsheets,
              accountants, and disconnected invoicing or treasury tools rather than only other neobanks.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM013
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The allocated sources do not provide a bottom-up count of eligible SMEs, average revenue per business,
              product penetration, or a methodology-consistent market estimate. They instead provide non-comparable
              indicators: Latin American fintech funding, Kapital-reported funds raised, financing volume, loan count,
              client reach, loan-portfolio size, and invoices processed. These measures establish activity, not TAM.
              Contxto reports 2024 regional fintech funding of $2.4 billion after 71.4% year-on-year growth, but capital
              supplied to fintech companies is not customer spending. It also reports more than MXN 22 billion of
              financing and more than 100,000 beneficiaries over an unspecified "last year." The reported MXN 6,291
              billion loan portfolio is retained verbatim but treated as low-confidence because its unit or
              transcription cannot be reconciled from the available text.
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM011
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is most plausibly the SME owner or finance leader, while daily users are treasury,
              accounting, and operations staff; this role mapping is an inference from the integrated banking and
              financial-visibility workflow rather than a disclosed procurement study. The payer is the business holding
              the account, taking credit, investing liquidity, or exchanging currency. Kapital's published eligibility
              language expressly includes individuals, individuals with business activity, and legal entities or SMEs
              for its investment product, while excluding development banks, multiple-banking institutions, other
              financial entities, and foreign institutions. Adoption should begin with a narrow trigger such as credit,
              cash visibility, or yield on idle funds, then expand only if the platform can replace fragmented workflows
              without imposing unacceptable switching, data, or underwriting friction.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
              - CM013
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The principal growth case is the combination of historically underserved SMEs, greater technology
              adoption, and a regulated banking license. Contxto attributes sector growth to technology and attention to
              underserved segments, while Kapital's CEO argues that SMEs value the safety and soundness of a banking
              license alongside fintech agility. The same logic creates execution constraints: regulated processes can
              improve trust but increase compliance intensity; credit-led acquisition adds asset-quality and capital
              requirements; and an all-in-one proposition must prove integration value against incumbent banks and
              inexpensive status-quo tools. The evidence pool does not quantify switching cost, budget ownership, cohort
              retention, or willingness to pay. Until those items and comparable customer denominators are disclosed,
              observed financing and invoice throughput should support traction diligence, not a top-down valuation
              multiple.
            claimRefs:
              - CM005
              - CM007
              - CM009
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size remains an underwriting gap
            body: >-
              No retained source supplies eligible-SME counts, product penetration, average revenue per customer, or a
              methodology-consistent TAM/SAM/SOM. Request a geography-by-segment customer and revenue bridge before
              applying a market-size premium.
            calloutType: risk
            claimRefs:
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and peer set
        blocks:
          - type: paragraph
            body: >-
              The competitive baseline is broader than another SME lender. Kapital began as a fintech, acquired Banco
              Autofin, and now targets SMEs through a regulated bank model; Forbes also describes coverage of business
              individuals, non-bank financial institutions, and selected wealth customers. The same report says Kapital
              serves more than 300,000 customers across Mexico, Colombia, the United States, Puerto Rico, and Spain.
              Konfio is the best-evidenced direct challenger: it already provides SME credit and is awaiting a
              banking-license decision intended to add deposits and payment management. Incumbent banks, standalone
              lenders, supplier credit, owner funding, personal cards, and internal multi-provider workflows remain
              material alternatives because the cited Konfio evidence identifies these as ways underserved SMEs obtain
              or manage finance. Two assigned pages on kapital.bank concern an Azerbaijani bank in PASHA Holding, not
              the Mexican company at kapital.com, and are excluded from peer scoring.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
              - CP011
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.2'
        title: Capability and positioning
        blocks:
          - type: paragraph
            body: >-
              Kapital's documented differentiation is breadth rather than an exclusive credit product. Retained
              reporting lists business credit, digital accounts, investments, multi-currency treasury, foreign exchange,
              and financial technology, while management presents the bank license as the trust and funding layer
              beneath fintech-style delivery. Konfio already combines loans, a business card, payment terminals, and
              management tools, and its proposed banking model would combine credit, payments, and deposits. That
              direction narrows the regulated-stack gap and makes execution, underwriting, service quality, and
              distribution more important than license possession alone. The positioning map is an analyst ordinal view
              of product breadth and buyer overlap, not an independent benchmark: only named capabilities in retained
              sources inform the scores, and unsupported categories are explicitly marked.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.3'
        title: Pricing, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Comparable pricing is the largest competitive blind spot. The retained pages describe product bundles and,
              for Konfio, fixed-rate unsecured lending, but do not provide a common annual percentage rate, fee
              schedule, realized discount, contract duration, or total cost basis for Kapital and Konfio. The pricing
              table therefore records contract mechanisms and unknowns rather than inventing a winner. Integrated
              accounts, credit, payments, and treasury can create workflow-level switching cost because cash visibility
              and operating data sit in one environment, but no assigned source quantifies retention, migration effort,
              or multi-homing. Kapital management itself says other players are moving toward SMEs. The durable moat
              thesis therefore depends on superior data-driven underwriting, service execution, and cross-border breadth
              continuing to outpace convergence by Konfio and incumbent banks.
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP012
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: License convergence weakens a static moat thesis
            body: >-
              Konfio's pending banking license could narrow Kapital's regulated-stack advantage. Underwriting quality,
              integrated workflow adoption, service execution, and cross-border capability must carry the moat if
              regulated access converges.
            calloutType: risk
            claimRefs:
              - CP009
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is diversified, but monetization is opaque
        blocks:
          - type: paragraph
            body: >-
              Kapital presents an integrated SMB banking proposition rather than a single-product software subscription.
              Its Y Combinator profile describes multi-treasury services, foreign exchange, accounts, payroll and global
              payments, an employee-expense dashboard with prepaid cards, and a flexible credit card. Contxto separately
              describes the strategy as combining a regulated bank with fintech delivery after the Banco Autofin
              acquisition. These products plausibly create interest income, interchange, foreign-exchange spread and
              transaction or account fees, but the retained evidence does not disclose realized prices, fee schedules,
              yields or revenue mix. The model therefore has several potential monetization engines without enough data
              to judge their relative quality, recurrence or sensitivity to rates.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI015
