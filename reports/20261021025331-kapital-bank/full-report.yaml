              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The disclosed founder-led operating team is concentrated around René Saul, identified as co-founder and
              CEO, and Fernando Sandoval, identified as co-founder and CFO. Saul is the public voice for the company's
              banking-license and proprietary-software strategy and has described the group as profitable, but that
              statement is company-claimed and is not a substitute for audited consolidated accounts. Public governance
              evidence is materially thinner than leadership evidence: the retained official governance page resolved
              only to an address in the fetched text and did not disclose board membership, committees, shareholder
              percentages, or control rights. The resulting key-person and oversight assessment therefore remains
              provisional pending primary corporate records and a management-provided governance package.
            claimRefs:
              - CO005
              - CO006
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO010
      - number: '1.3'
        title: Capital, ownership signals, and strategic milestones
        blocks:
          - type: paragraph
            body: >-
              Kapital crossed the unicorn threshold in September 2025: LatamList reported an $86 million Series C led by
              Tribe Capital and Pelion Ventures, and Reuters reported a valuation above $1.3 billion. Tracxn later
              reported $307 million raised across 12 rounds; that database total may mix equity and debt and does not
              establish cash available, fully diluted ownership, or liquidation preferences. The company's
              regulated-infrastructure strategy included the 2023 purchase of Banco Autofin. Reuters also reported an
              agreement to acquire selected Intercam brokerage, asset-management, and operating-banking assets,
              alongside a planned $100 million investment into Kapital's banking operations. The timeline is
              strategically coherent, but transaction completion, integration performance, and the cap table remain
              unverified in the retained evidence.
            claimRefs:
              - CO007
