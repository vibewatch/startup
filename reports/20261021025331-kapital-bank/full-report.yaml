chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Kapital Bank was founded in Mexico in 2021 and is classified by Tracxn as a Series C company. Its retained
              official governance page gives a Mexico City address, while independent reporting says the company also
              operates in Colombia. The business is best described as a regulated financial-services and software
              platform: retained sources attribute banking, credit, investment, and financial-management capabilities to
              it, with an emphasis on SMEs. Current scale is less certain. Tracxn reports 3,646 employees as of
              September 30, 2026, while a separate 2024 operating account reported more than 100,000 financing clients
              and more than 33,000 guaranteed loans. These are different populations and vintages, so they should not be
              combined into a single customer or activity metric.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO012
              - CO013
              - CO014
