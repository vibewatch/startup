  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and jobs to be done
        blocks:
          - type: paragraph
            body: >-
              Kapital's evidenced core customer is the Latin American small or midsize business rather than a consumer
              banking cohort. TechCrunch reported that the company was founded to give small businesses financial
              visibility similar to that available to large enterprises, while Contxto described a combined operating
              and financing proposition for SMEs in Mexico and Colombia. The practical buyer is likely an owner or
              finance operator, while users may include treasury, accounting, and operations staff; the public sources
              do not separate those roles or identify who signs and pays. The customer job spans real-time visibility
              into cash flow and business operations, credit access, and finance administration. A 2026 branded article
              adds that Kapital analyzes operating cash flow and invoicing to assess credit capacity, but this
              company-aligned account is evidence of positioning, not an independently measured customer outcome.
              Historical references to Peru and acquired bank customers widen the footprint without proving a current
              segment mix.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU008
              - CU014
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU006
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU011
              - CU014
      - number: '6.2'
        title: Adoption trajectory and quality of proof
        blocks:
          - type: paragraph
            body: >-
              The strongest quantified adoption evidence is cohort-level rather than account-level. TechCrunch reported
              80,000 small-business customers across Mexico, Colombia, and Peru in 2023 and said Banco Autofin brought
              65,000 existing customers when acquired. Contxto later reported more than 33,000 guaranteed loans, more
              than 100,000 clients receiving over MXN 22 billion in financing, and more than 300 million invoices
              processed. Those figures are not a clean funnel: they mix businesses, acquired bank customers, loans,
              financing value, and invoices, and the Contxto text uses "in the last year" without a publication date in
              the retained record. They therefore show breadth of activity, not conversion, active usage, or retention.
              The announced Intercam transaction could add brokerage, asset-management, and operating-banking
              relationships, but the August 2025 release described a proposed deal subject to definitive agreements and
              approvals. No acquired customer count or overlap was disclosed, so it should not be added to Kapital's
              customer base.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU013
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence does not report NRR, GRR, churn, renewal rates, contract length, cohort
              retention, satisfaction, or product penetration. It also does not quantify revenue concentration by
              customer, channel dependence, or the overlap between legacy Kapital, Banco Autofin, and prospective
              Intercam relationships. This prevents a durable customer-economics conclusion even though product breadth
              creates a plausible land-and-expand mechanism. The company says it can connect payments, operations,
              cash-flow visibility, underwriting, and additional client offerings, but public sources do not show
              whether customers adopt multiple products or remain active after credit repayment. Named reference quality
              is also weak: none of the substantive retained sources names an end customer, gives a deployment status,
              or attributes a measured outcome to a customer. Diligence should obtain account-level cohorts by
              origination channel and geography, product attach rates, renewal or repeat-borrowing behavior, top-10
              revenue exposure, and post-acquisition migration metrics before treating reported scale as durable
              adoption.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not yet durability
            body: >-
              Reported cohorts, loans, and invoices establish activity but cannot be combined into an active-customer
              funnel. Named references, retention cohorts, product attach, and customer concentration remain
              private-evidence diligence items.
            calloutType: risk
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and ranking
        blocks:
          - type: paragraph
            body: >-
              Kapital's risk profile is dominated by a high-impact integration and compliance event rather than by a
              demonstrated operating failure. Yucatan Magazine and Reuters reported that the proposed Intercam asset
              acquisition followed U.S. sanctions that identified Intercam as a primary money-laundering concern; the
              transaction was still conditional in the retained reporting. Kapital had engaged K2 Integrity and said it
              was coordinating with U.S. and Mexican authorities, which are meaningful mitigations but not evidence that
              asset screening, approvals, migration, or customer remediation are complete. The investment view should
              therefore treat transaction completion without adverse findings as a milestone, not as a settled fact. The
              residual ranking below uses "unknown" wherever the assigned public evidence cannot support a probability.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and compliance exposure
        blocks:
          - type: paragraph
            body: >-
              The core legal risk is inherited exposure from acquiring selected operations of a sanctioned institution.
              The retained reports distinguish the allegations against Intercam from Kapital itself, so they do not
              support an accusation that Kapital committed the alleged conduct. They do support enhanced diligence on
              customer files, beneficial ownership, correspondent relationships, transaction history, and the exact
              perimeter of assets transferred. The announced use of K2 Integrity and regulatory engagement lowers, but
              does not eliminate, the possibility of delayed approval, excluded assets, remediation costs, or
              restrictions imposed after review. The official governance URL was successfully prefetched through an
              archive, but its reviewed text exposed only contact information; board and committee evidence remains a
              public-evidence gap rather than proof of weak governance.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
      - number: '7.3'
        title: Operational, credit, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The platform combines accounts, payments, payroll, expense controls, cards, and credit, increasing the
              number of operational and control surfaces that must work together. Public scale indicators are
              substantial but unevenly defined: Contxto reported more than 33,000 guaranteed loans and more than 100
              thousand financed clients, while its separate "funds raised" figure is neither revenue nor cash available.
              PromptLoop's 500-employee count is undated and cannot be treated as current headcount. Reuters reported a
              financing round giving access to up to $100 million and a further $100 million investment tied to the
              Intercam closing; those are financing and transaction commitments, not runway. Without vintage loss
              curves, fraud splits, liquidity, and consolidated burn, downside cannot be quantified reliably.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Dependencies, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Kapital depends on regulators to approve the transaction, on counterparties and advisers to define a clean
              asset perimeter, and on external capital to absorb integration demands. The March 2026 HR A+ stable rating
              is the freshest dated credit signal in the assigned evidence, but the rating page provides no
              portfolio-level underwriting detail and applies to the named rated entity, not automatically to every
              holding-company obligation. Monitor final approvals, K2 review scope, excluded or remediated accounts,
              integration cost, capital ratios, liquidity, loss vintages, fraud losses, and customer concentration.
              Thesis-break triggers are an adverse AML finding affecting transferred assets, approval failure, capital
              support materially beyond the announced amount, or deterioration in the rating/outlook without adequate
              disclosed remediation.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break condition
            body: >-
              An adverse AML finding affecting transferred assets, failure to obtain final approvals, or integration
              capital needs materially beyond disclosed support would invalidate the assumption that Kapital can acquire
              scale without importing disproportionate compliance and balance-sheet risk.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR005
          - type: callout
            title: Constructive signal, limited scope
            body: >-
              The HR A+ stable rating is a useful dated external credit signal, but it does not answer the missing
              portfolio-vintage, fraud, concentration, or holding-company liquidity questions.
            calloutType: insight
            claimRefs:
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The current public reference point is a reported $2.0 billion valuation following a $130 million financing
              that combined equity and debt. A year earlier, Reuters reported a $1.3 billion valuation and access to up
              to $100 million, so the latest headline mark represents a roughly 54% increase; that calculation is a
              comparison of reported marks, not a verified change in enterprise value or equity value. The financing
              mix, fully diluted capitalization, liquidation preferences, debt terms, and proceeds available to the
              operating group remain undisclosed in the retained evidence. Kapital also says it is profitable, but the
              claim is not accompanied here by audited consolidated earnings, cash generation, or segment economics. The
              appropriate decision is therefore to track and research more. Entry at or above the headline mark should
              require a verified cap table, audited consolidated performance, credit-vintage quality, and confirmation
              that the Intercam transaction has closed on acceptable terms.
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Scale evidence and upside case
        blocks:
          - type: paragraph
            body: >-
              The upside case rests on operating scale rather than on a public valuation multiple. LatAm Republic
              reported more than MXN 93 billion of assets at the end of the second quarter of 2026, a MXN 30 billion
              credit portfolio growing 220% year over year, and MXN 62 billion of traditional deposits growing 234%. It
              also reported more than 300,000 customers and 3,700 employees. An earlier Contxto account reported more
              than 33,000 guaranteed loans, more than 100,000 financing clients, and financing in excess of MXN 22
              billion, although the article did not provide an audited denominator or a directly comparable valuation
              basis. These indicators can support a bull case if diligence verifies profitable growth, asset quality,
              and durable deposit economics. They cannot by themselves establish revenue, cash flow, or an investable
              valuation range.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Downside, scenarios, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The most consequential downside is execution and compliance around the Intercam assets. Reuters reported
              that Intercam was among firms targeted by U.S. sanctions as primary money-laundering concerns, while
              Mexican officials said the United States had not provided supporting evidence. Kapital's release said the
              acquisition remained subject to definitive agreements and customary approvals and paired it with a planned
              $100 million investment in banking operations. That amount is a proposed operating investment, not
              evidence of unrestricted cash available to shareholders. HR Ratings assigned KPTL Mexico Bank an HR A+
              rating with a stable outlook on March 24, 2026, which is a positive credit signal but not an equity
              valuation. A possible IPO within three years is explicitly conditional on market conditions, so it is an
              exit option rather than a committed liquidity event. Scenario probabilities and target returns cannot be
              quantified responsibly from the retained public evidence.
            claimRefs:
              - CV007
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: Comparable discipline and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              No retained source provides a clean public-company, private-round, or M&A multiple that is comparable on
              revenue, earnings, assets, credit quality, and capital structure. The search pool also contained a
              kapital.bank strategy page focused on retail-banking leadership and a micro segment; it was treated as a
              namesake result rather than evidence about the Mexico- and Colombia-focused Kapital reviewed here.
              Kapital's fetched governance page exposed only an office address, so it did not resolve ownership, board
              committees, or preference overhang. Final diligence should obtain the fully diluted cap table and
              preference waterfall; audited consolidated income, cash flow, and regulatory capital; credit vintages,
              losses, and fraud splits; the latest HR Ratings report and covenant package; Intercam closing documents
              and integration KPIs; and a valuation bridge showing the return at proposed entry prices. Failure to
              verify profitable consolidated growth, clean asset quality, or a credible liquidity path is a thesis-break
              condition.
            claimRefs:
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Treat $2.0 billion as a reported financing mark, not a validated entry value. Reopen the recommendation
              only after audited consolidated economics, the preference waterfall, current credit quality, and Intercam
              closing evidence are available.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
