  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The evidence chain moves from a $2.0B headline reference through scale proof and unresolved quality risks to a
      track-and-verify decision.
    data:
      nodes:
        - id: headline-mark
          label: $2.0B reported valuation
          detail: $130M financing combined equity and debt
        - id: scale-proof
          label: Material banking scale
          detail: Assets, credit, deposits, and customers expanded
        - id: earnings-proof
          label: Earnings proof incomplete
          detail: Profitability is company-claimed; audited consolidation is absent
        - id: transaction-risk
          label: Intercam conditions remain
          detail: Closing, approvals, compliance, and integration require verification
        - id: exit-option
          label: IPO is optional
          detail: Three-year consideration depends on market conditions
        - id: entry-discipline
          label: No public price endorsement
          detail: Require cap table, audited economics, and asset-quality evidence
        - id: recommendation
          label: Track / research more
          detail: Reassess only after recommendation-critical diligence
    approximationNotes: >-
      Ordered qualitative logic only; node order does not imply conversion, probability, or value-proportional
      magnitude.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV010
      - CV011
      - CV012
      - CV014
      - CV016
