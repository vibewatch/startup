      - number: '5.3'
        title: Trust, security, and control gaps
        blocks:
          - type: paragraph
            body: >-
              Kapital's acquisition release describes a comprehensive AML/CFT control stack and says K2 Integrity was
              engaged to vet the Intercam assets. An external credit-rating page also lists KPTL Mexico Bank at HR A+
              with a stable outlook as of March 24, 2026, which is relevant to the regulated operating base but is not
              evidence of product security, availability, or software quality. The strongest adverse evidence is
              Cybernews' report that a misconfigured cloud bucket attributed to Kapital exposed 1,674,324 files, mostly
              voter IDs and identity-verification selfies, and remained open as of December 6, 2024 after repeated
              disclosure attempts. The retained evidence does not establish subsequent containment, notification,
              regulator findings, or control remediation. Underwriting therefore requires independent proof of
              remediation, penetration testing, access-control review, incident governance, and current security or
              privacy attestations.
            claimRefs:
