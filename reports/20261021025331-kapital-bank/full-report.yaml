  - id: FP001
    title: Competitive positioning by product breadth and buyer overlap
    type: quadrant
    summary: >-
      Analyst ordinal positions show Kapital and Konfio as the closest integrated SME-finance alternatives, while
      fragmented substitutes overlap on narrower jobs.
    data:
      xAxis:
        label: Financial-operations breadth (ordinal)
        min: 1
        max: 5
        low: Single-purpose
        high: Integrated stack
        description: Analyst score from named capabilities in retained sources
        scale: ordinal
      yAxis:
        label: Overlap with Kapital's target job (ordinal)
        min: 1
        max: 5
        low: Peripheral
        high: Direct
        description: Analyst score from target segment and use-case overlap
        scale: ordinal
      points:
        - label: Kapital
          x: 5
          'y': 5
          note: 'Baseline: credit, banking, treasury, FX, and technology'
        - label: Konfio
          x: 4
          'y': 5
          note: Direct SME peer; bank license pending in retained evidence
        - label: Traditional bank
          x: 4
          'y': 4
          note: Broad regulated incumbent; no named benchmark retained
        - label: Standalone SME lender
          x: 2
          'y': 4
          note: High credit overlap, narrower documented stack
        - label: Supplier finance
          x: 1
          'y': 3
          note: Working-capital substitute, not an operating platform
        - label: Owner funds / personal card
          x: 1
          'y': 2
          note: Status quo cited for firms without business credit
    approximationNotes: >-
      Scores are evidence-backed ordinal analyst judgments, not market shares, customer rankings, or independent
      benchmarks; unsupported provider capabilities were not inferred.
    claimRefs:
      - CP013
      - CP014
      - CP015
  - id: FI001
    title: Customer activity to gross-profit evidence bridge
    type: flow
    summary: >-
      Public evidence supports the product and activity stages, but pricing, losses and servicing costs break the bridge
      before gross profit.
    data:
      nodes:
        - id: customer-activity
          label: SMB financial activity
          detail: Accounts, payments, payroll, expenses, invoices and borrowing.
        - id: platform-products
          label: Kapital products
          detail: Multi-treasury, FX, prepaid cards, credit cards and business financing.
        - id: public-volume
          label: Reported activity
          detail: Loan, financing, invoice and customer scale is publicly reported.
        - id: gross-revenue
          label: Gross revenue
          detail: Interest, interchange, spreads and fees are plausible but not quantified by stream.
        - id: direct-costs
          label: Direct costs
          detail: Funding, credit loss, fraud, processing and servicing costs are not disclosed.
        - id: gross-profit
          label: Gross profit
          detail: Company-reported profitability cannot be reconciled to product contribution margins.
    approximationNotes: >-
      This is a qualitative sequence, not a quantified waterfall; it does not estimate conversion rates, revenue or
      margin.
    claimRefs:
      - CI001
      - CI004
      - CI009
      - CI010
      - CI015
  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      Public evidence supports a layered operating model, while technical interfaces and assurance details remain
      diligence gaps.
    data:
      layers:
        - label: Customer operations
          items:
            - Cash-flow visibility
            - Loan management
            - Payroll and benefits
            - Invoicing
          detail: Publicly described product surface; feature adoption and service levels are undisclosed.
        - label: Banking and product services
          items:
            - SME capital
            - Operational banking
            - Proposed brokerage
            - Proposed asset management
          detail: Intercam additions remain transaction- and integration-dependent.
        - label: Data
          items:
            - SAT electronic invoices
            - Customer records
            - Counterparty records
            - Transaction records
          detail: Public sources do not document lineage, consent boundaries, retention, or data quality.
        - label: Analytics and automation
          items:
            - AI-enabled analysis
            - Workflow automation
            - Customer risk assessment
          detail: Delivered capabilities and roadmap items are not fully separated publicly.
        - label: Compliance controls
          items:
            - KYC due diligence
            - Transaction monitoring
            - Restricted-party screening
            - AML and CFT protocols
          detail: Control design is company-described; independent effectiveness evidence is absent.
        - label: Trust and infrastructure
          items:
            - Regulated-bank operating base
            - Cloud storage
            - Identity-document handling
            - Incident response
          detail: A reported cloud exposure makes remediation and assurance evidence material.
    approximationNotes: Layer ordering is analytical and does not claim the company's actual deployment topology or data-flow direction.
    claimRefs:
