      - ["Credit-seeking SMEs", "Business borrower; user and payer not separated", "Working-capital and guaranteed-loan access", "More than 100,000 clients in an undated Contxto period", "Credit relationship and data-driven underwriting", "No approval, utilization, repeat-borrowing, or loss denominator"]
      - ["Banco Autofin acquired base", "Existing bank customers; segment mix not disclosed", "Legacy banking relationship", "65,000 customers at the September 2023 acquisition", "Installed base for cross-sell", "No retained, migrated, active, or product-attach count"]
      - ["Prospective Intercam relationships", "Brokerage, asset-management, and banking clients", "Broader financial-services access", "No customer count disclosed", "Potential product and client-offering expansion", "Closing status, overlap, migration, and retention are not quantified"]
    notes: "Sources report unlike populations and vintages; rows are segments or cohorts, not additive customer counts."
    claimRefs: [CU001, CU003, CU004, CU006, CU008, CU009]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Reported value
      - Period / date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - ["Kapital small-business customer base", "80,000", "2023", TechCrunch, Medium, "Demonstrates multi-country customer acquisition", "Active status, beginning base, and retention"]
      - ["Banco Autofin customers at acquisition", "65,000", "September 2023", TechCrunch, Medium, "Adds an acquired installed base", "Overlap, segment mix, and migrated-active count"]
      - ["Guaranteed loans granted", "More than 33,000", "Last year; source date unavailable", Contxto, Low, "Shows financing throughput", "Applications, unique borrowers, repeat loans, and exact period"]
      - ["Clients benefiting from financing", "More than 100,000", "Last year; source date unavailable", Contxto, Low, "Suggests broad credit reach", "Unique active clients and overlap with the 2023 cohorts"]
      - ["Invoices processed", "More than 300 million", "Last year; source date unavailable", Contxto, Low, "Indicates platform data volume", "Unique businesses, invoice value, and processing definition"]
    notes: "Values are source-reported and not normalized; Contxto's relative period lacks a retained publication date."
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
  - id: TU003
    title: Named customer proof table
    columns:
      - Publicly identified customer / cohort
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - ["Kapital's 80,000 small-business cohort", SMEs, "Financial visibility and business operations", "Reported as customers; active status not disclosed", "80,000 customers in 2023", "No named company, outcome, or retention evidence"]
      - ["Banco Autofin's 65,000-customer base", "Acquired bank customers", "Legacy banking services", "Existing customers at acquisition", "65,000 customers reported in September 2023", "No migration, overlap, activity, or cross-sell result"]
      - ["Contxto's more-than-100,000 client cohort", "Financing clients", "Guaranteed loans and financing", "Reported as beneficiaries; production definition absent", "More than MXN 22 billion in financing", "Undated relative period and no named customer"]
    notes: "Partial inventory of customer cohorts in the assigned evidence; no retained source identifies a named end customer or measured customer-specific outcome."
    enumerationScope:
      coverage: partial
      basis: "Customer or deployment examples disclosed by the retained prefetched sources reviewed through 2026-10-21."
    claimRefs: [CU003, CU004, CU006, CU013]
