company:
  name: Kapital Bank
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports Kapital's focus on Latin American SMEs and documents several
    cohort-level adoption markers, including 80,000 small businesses in 2023 and more than
    100,000 financing clients in a later but undated report. It does not identify named end
    customers or disclose retention, concentration, contract, or post-acquisition overlap data.
sections:
  - id: customer-segments-and-jobs
    title: Customer segments and jobs to be done
    body: >-
      Kapital's evidenced core customer is the Latin American small or midsize business rather
      than a consumer banking cohort. TechCrunch reported that the company was founded to give
      small businesses financial visibility similar to that available to large enterprises,
      while Contxto described a combined operating and financing proposition for SMEs in Mexico
      and Colombia. The practical buyer is likely an owner or finance operator, while users may
      include treasury, accounting, and operations staff; the public sources do not separate
      those roles or identify who signs and pays. The customer job spans real-time visibility
      into cash flow and business operations, credit access, and finance administration. A 2026
      branded article adds that Kapital analyzes operating cash flow and invoicing to assess
      credit capacity, but this company-aligned account is evidence of positioning, not an
      independently measured customer outcome. Historical references to Peru and acquired bank
      customers widen the footprint without proving a current segment mix.
    claimRefs: [CU001, CU002, CU004, CU008, CU014, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-customer-proof
    title: Adoption trajectory and quality of proof
    body: >-
      The strongest quantified adoption evidence is cohort-level rather than account-level.
      TechCrunch reported 80,000 small-business customers across Mexico, Colombia, and Peru in
      2023 and said Banco Autofin brought 65,000 existing customers when acquired. Contxto later
      reported more than 33,000 guaranteed loans, more than 100,000 clients receiving over MXN
      22 billion in financing, and more than 300 million invoices processed. Those figures are
      not a clean funnel: they mix businesses, acquired bank customers, loans, financing value,
      and invoices, and the Contxto text uses "in the last year" without a publication date in
      the retained record. They therefore show breadth of activity, not conversion, active usage,
      or retention. The announced Intercam transaction could add brokerage, asset-management,
      and operating-banking relationships, but the August 2025 release described a proposed deal
      subject to definitive agreements and approvals. No acquired customer count or overlap was
      disclosed, so it should not be added to Kapital's customer base.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      The assigned public evidence does not report NRR, GRR, churn, renewal rates, contract
      length, cohort retention, satisfaction, or product penetration. It also does not quantify
      revenue concentration by customer, channel dependence, or the overlap between legacy
      Kapital, Banco Autofin, and prospective Intercam relationships. This prevents a durable
      customer-economics conclusion even though product breadth creates a plausible
      land-and-expand mechanism. The company says it can connect payments, operations, cash-flow
      visibility, underwriting, and additional client offerings, but public sources do not show
      whether customers adopt multiple products or remain active after credit repayment. Named
      reference quality is also weak: none of the substantive retained sources names an end
      customer, gives a deployment status, or attributes a measured outcome to a customer.
      Diligence should obtain account-level cohorts by origination channel and geography,
      product attach rates, renewal or repeat-borrowing behavior, top-10 revenue exposure, and
      post-acquisition migration metrics before treating reported scale as durable adoption.
    claimRefs: [CU010, CU011, CU012, CU013, CU015]
