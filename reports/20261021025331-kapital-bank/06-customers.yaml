        - id: data-connection
          label: "Connect operating data"
          detail: "Platform analyzes cash flow and invoicing information."
          touchpoints: ["Invoices", "Financial data"]
        - id: credit-assessment
          label: "Assess credit capacity"
          detail: "Company describes data-driven underwriting for business credit."
          touchpoints: ["Underwriting", "Risk assessment"]
        - id: financing
          label: "Use financing"
          detail: "Public reporting describes guaranteed loans and financing clients."
          touchpoints: ["Loan", "Working capital"]
        - id: ongoing-management
          label: "Manage finances"
          detail: "Customer proposition combines visibility with day-to-day financial operations."
          touchpoints: ["Payments", "Cash management"]
        - id: broader-services
          label: "Expand into broader services"
          detail: "Intercam assets and planned investment could broaden offerings after closing."
          touchpoints: ["Brokerage", "Asset management", "Operational banking"]
    approximationNotes: "Qualitative sequence assembled from product descriptions; no stage conversion, duration, retention, or attach rate is publicly evidenced."
    claimRefs: [CU002, CU011, CU014]
callouts:
  - calloutType: risk
    title: Scale is not yet durability
    body: >-
      Reported cohorts, loans, and invoices establish activity but cannot be combined into an
      active-customer funnel. Named references, retention cohorts, product attach, and customer
      concentration remain private-evidence diligence items.
    claimRefs: [CU010, CU012, CU013, CU015]
