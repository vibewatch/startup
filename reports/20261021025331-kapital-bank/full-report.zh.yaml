    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              Kapital Bank 于 2021 年在墨西哥成立，Tracxn 将其归类为 Series C
              公司。保留的官方治理页面给出了墨西哥城地址，独立报道则称公司也在哥伦比亚运营。更准确的定位是受监管的金融服务与软件平台：保留来源将银行、信贷、投资和财务管理能力归于该公司，重点服务
              SME。当前规模仍不确定。Tracxn 报告截至 September 30, 2026 有 3,646 名员工；另一份 2024 年运营账户则称融资客户超过 100,000 名、担保贷款超过 33,000
              笔。这是不同人群、不同时间点的数据，不应合并成单一客户数或业务活动指标。
