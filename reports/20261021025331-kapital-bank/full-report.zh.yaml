        title: 展示材料
        blocks:
          - type: callout
            title: 市场规模仍是投资判断缺口
            body: 没有保留来源提供符合条件的 SME 数量、产品渗透率、单客平均收入或方法一致的 TAM/SAM/SOM。应用市场规模溢价前，应索取按地域和细分市场拆分的客户与收入桥接表。
            calloutType: risk
            claimRefs:
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与同业集合
        blocks:
          - type: paragraph
            body: >-
              竞争基线不只是另一家 SME 贷款机构。Kapital 起初是一家金融科技公司，收购 Banco Autofin 后转向受监管银行模式服务 SME；Forbes
              还称其覆盖企业个人、非银行金融机构和部分财富客户。同一报道称 Kapital 在墨西哥、哥伦比亚、美国、波多黎各和西班牙服务超过 300,000 名客户。Konfio 是证据最充分的直接挑战者：它已经提供 SME
              信贷，并等待银行牌照决定，目标是增加存款和支付管理。传统银行、独立贷款机构、供应商信用、所有者出资、个人卡以及内部多服务商流程仍是重要替代方案，因为引用的 Konfio 证据将它们列为服务不足的 SME
              获取或管理融资的方式。分配到的两个 kapital.bank 页面涉及 PASHA Holding 旗下的阿塞拜疆银行，而非 kapital.com 的墨西哥公司，因此不纳入同业评分。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
              - CP011
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
