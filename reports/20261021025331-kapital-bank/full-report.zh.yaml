            - 部分
        - label: 整合资本超支
          values:
            - Unknown
            - 高
            - 部分
        - label: 信贷损失与欺诈不透明
          values:
            - Unknown
            - 高
            - Unknown
        - label: 一体化平台韧性
          values:
            - Unknown
            - 高
            - Unknown
        - label: 治理可见性
          values:
            - Unknown
            - 中
            - 公开证据薄弱
    approximationNotes: 定性类别综合已引用证据和缺口；它们不是数值概率、基准分数，也不能证明没有发生未记录的事件。
