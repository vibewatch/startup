              - CP010
              - CP012
              - CP015
      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 牌照趋同削弱静态护城河逻辑
            body: Konfio 待定的银行牌照可能缩小 Kapital 的受监管技术栈优势。如果受监管准入趋同，护城河就必须由授信质量、一体化工作流采用、服务执行和跨境能力来支撑。
            calloutType: risk
            claimRefs:
