      - number: '8.4'
        title: 可比纪律与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              没有保留来源提供在收入、盈利、资产、信贷质量和资本结构上可比的上市公司、私募轮次或并购倍数。搜索池还包含一个 kapital.bank
              战略页面，重点是零售银行领导力和微型细分市场；该页面被视为同名结果，而不是本报告所审阅的墨西哥和哥伦比亚业务证据。Kapital
              抓取到的治理页面只显示办公地址，未解决所有权、董事会委员会或优先权负担。最终尽调应取得完全摊薄股权结构表和优先权瀑布；经审计的合并损益、现金流和监管资本；信贷批次、损失和欺诈拆分；最新 HR Ratings
              报告和契约包；Intercam 交割文件和整合 KPI；以及显示拟议入场价格回报的估值桥接表。若无法验证盈利的合并增长、干净的资产质量或可信的流动性路径，就构成论点失效条件。
            claimRefs:
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
