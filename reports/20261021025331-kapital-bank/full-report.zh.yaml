              - CM011
              - CM016
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方最可能是 SME
              所有者或财务负责人，日常用户则是资金、会计和运营人员；这一角色映射来自一体化银行和财务可视化工作流的推断，并非已披露的采购研究。付款方是持有账户、获得信贷、投资流动性或进行货币兑换的企业。Kapital
              公布的资格说明明确将个人、有经营活动的个人以及法人或 SME
              纳入其投资产品范围，同时排除开发银行、多银行机构、其他金融实体和外国机构。采用应从信贷、现金可视化或闲置资金收益等窄触发点开始，只有当平台能在不造成不可接受的切换、数据或授信摩擦的情况下替代割裂流程，才应进一步扩展。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
              - CM013
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              增长逻辑主要来自长期服务不足的 SME、技术采用提升和受监管银行牌照的结合。Contxto 将行业增长归因于技术和对服务不足群体的关注；Kapital CEO 则认为，SME
              看重银行牌照带来的安全稳健，同时希望保留金融科技的灵活性。同一逻辑也带来执行约束：受监管流程可以提升信任，却会提高合规强度；信贷驱动的获客增加资产质量和资本要求；一体化方案则必须证明整合价值，才能胜过传统银行和低成本的现有工具。证据池没有量化切换成本、预算归属、客户队列留存或付费意愿。在这些信息和可比客户分母披露之前，已观察到的融资与开票吞吐量只能支持牵引力尽调，不能直接支撑自上而下的估值倍数。
            claimRefs:
              - CM005
              - CM007
              - CM009
              - CM011
              - CM012
              - CM013
              - CM016
