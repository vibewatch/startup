            body: >-
              当前公开参考点是已披露的 $2.0 billion 估值，对应一笔混合股权与债务的 $130 million 融资。一年前，Reuters 报道估值为 $1.3 billion、可获得最高 $100
              million，因此最新公开估值约增长
              54%；该计算只是对已披露估值的比较，并非经验证的企业价值或股权价值变化。保留证据没有披露融资构成、完全摊薄资本化、清算优先权、债务条款或可供运营集团使用的资金。Kapital
              还称公司已盈利，但这里没有配套的经审计合并利润、现金生成或分部经济数据。因此，合适的决策是继续跟踪并进一步研究。在该公开估值或更高价格入场前，应要求经验证的股权结构表、经审计的合并业绩、信贷批次质量，以及确认
              Intercam 交易已按可接受条款完成。
