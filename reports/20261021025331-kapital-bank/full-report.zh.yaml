      - number: '1.4'
        title: 风险信号与尽调边界
        blocks:
          - type: paragraph
            body: >-
              最强的不利信号来自 Cybernews 的调查：该调查将一个暴露在外的云存储桶归属于 Kapital，桶内有 1,674,324 个文件，主要是选民身份证件和身份验证自拍照。该媒体称，在尝试披露问题后，存储桶截至
              December 6, 2024 仍处于开放状态。这是独立指控，不是监管机构的最终认定；保留资料中也没有后续公司回应、整改确认、受影响人员数量或执法结果。另据 Reuters，Intercam
              曾因被视为主要洗钱风险而受到美国制裁；墨西哥官员则表示美国并未向其提供证据。这些事实提高了合规整合尽调的优先级，但不能证明 Kapital
              存在不当行为。收入、所有权、董事会监督和事件收尾仍是本概览的主要证据边界。
            claimRefs:
              - CO015
              - CO016
      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 受监管基础设施构成战略差异化
            body: 收购 Banco Autofin 为 Kapital 提供了银行牌照路径；管理层则将盈利和增长归因于把该牌照与自有软件结合。
            calloutType: strength
            claimRefs:
              - CO007
              - CO010
          - type: callout
            title: 安全整改尚未公开收尾
            body: 保留证据包含一项详细的独立暴露指控，但没有后续整改确认、监管结果或量化的受影响客户数。
            calloutType: risk
            claimRefs:
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场窄于拉丁美洲金融科技，宽于单一 SME 借贷。Kapital 当前公开提供银行、信贷、投资和外汇服务，第三方描述则强调为中小企业提供财务可视化和工具。因此，核心边界应定义为墨西哥的 SME
              财务运营平台，哥伦比亚是已报道的地域延伸。可计入的支出应限于企业存款、支付、营运资金信贷、资金管理或投资产品、外汇，以及软件支持的财务管理。消费者储蓄、机构间银行资金管理和无关的零售银行业务不应计入核心可触达支出。现有替代方案包括传统银行、独立贷款机构、电子表格、会计师以及彼此割裂的开票或资金管理工具，而不只是其他数字银行。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM013
              - CM014
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              分配到的来源没有提供符合条件的 SME 自下而上数量、单个企业平均收入、产品渗透率或方法一致的市场估算。它们提供的是不可比指标：拉丁美洲金融科技融资、Kapital
              报告的募资额、融资规模、贷款笔数、客户触达、贷款组合规模和已处理发票数。这些指标能证明业务活动，却不能证明 TAM。Contxto 报告 2024 年区域金融科技融资为 $2.4 billion，同比增幅
              71.4%，但流向金融科技公司的资本不是客户支出。该报道还称，过去一个未指明的“上一年”里，融资额超过 MXN 22 billion，受益人超过 100,000 名。报道中的 MXN 6,291 billion
              贷款组合原样保留，但由于现有文本无法核对其单位或转录准确性，置信度较低。
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
