            body: 将 $2.0 billion 视为已披露的融资估值，而不是已验证的入场价值。只有在取得经审计的合并经济数据、优先权瀑布、当前信贷质量和 Intercam 交割证据后，才应重新评估建议。
            calloutType: recommendation
