      - number: '3.2'
        title: 能力与定位
        blocks:
          - type: paragraph
            body: >-
              Kapital 已有记录的差异化在于广度，而不是独占性的信贷产品。保留报道列出企业信贷、数字账户、投资、多币种资金管理、外汇和金融科技；管理层则把银行牌照定位为金融科技式交付背后的信任和资金层。Konfio
              已将贷款、企业卡、支付终端和管理工具结合起来，其拟议银行模式还将整合信贷、支付和存款。这会缩小受监管技术栈差距，使执行、授信、服务质量和分销比单纯拥有牌照更重要。定位图是分析师对产品广度和买方重合度的序数判断，不是独立基准：评分只采用保留来源中点名的能力，不受支持的类别会明确标注。
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.3'
        title: 定价、锁定效应与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              可比定价是最大的竞争盲区。保留页面描述了产品组合；对于 Konfio，还提到固定利率无抵押贷款，但没有为 Kapital 和 Konfio
              提供统一的年化百分比利率、收费表、实际折扣、合同期限或总成本口径。因此，定价表记录合同机制和未知项，不擅自判定赢家。账户、信贷、支付和资金管理整合在一个环境中，可能形成工作流层面的切换成本，因为现金可视化和运营数据集中在同一处；但分配来源没有量化留存、迁移成本或多平台使用。Kapital
              管理层自己也表示，其他参与者正在转向 SME。持久护城河最终取决于数据驱动授信、服务执行和跨境广度能否持续跑赢 Konfio 与传统银行的趋同。
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
