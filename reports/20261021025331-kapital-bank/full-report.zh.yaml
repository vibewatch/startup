      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              已披露的创始人主导团队主要由联合创始人兼 CEO René Saul 和联合创始人兼 CFO Fernando Sandoval 组成。Saul
              是公司银行牌照和自研软件战略的公开发声者，并称集团已实现盈利；但这是公司自述，不能替代经审计的合并账目。治理证据明显少于领导层证据：保留的官方治理页面在抓取文本中只解析出地址，没有披露董事会成员、委员会、股东持股比例或控制权。因此，关键人物依赖和监督机制的判断仍属初步结论，需等待公司原始记录和管理层提供的治理材料。
