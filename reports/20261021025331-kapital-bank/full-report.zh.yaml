  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式多元，但变现不透明
        blocks:
          - type: paragraph
            body: >-
              Kapital 展现的是一体化 SMB 银行方案，而非单一产品软件订阅。其 Y Combinator
              资料描述了多账户资金管理服务、外汇、账户、薪资和全球支付、配备预付卡的员工费用仪表盘，以及灵活的信用卡。Contxto 另将 Banco Autofin
              收购后的战略描述为把受监管银行与金融科技交付结合起来。这些产品可能带来利息收入、交换费、外汇点差以及交易或账户费用，但保留证据没有披露实际价格、收费表、收益率或收入结构。因此，模式拥有多个潜在变现引擎，却没有足够数据判断它们的相对质量、经常性或利率敏感度。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
