  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链从 $2.0B 的标题估值参考出发，经过规模证明和未解决的质量风险，最终指向跟踪并验证的决策。
    data:
      nodes:
        - id: headline-mark
          label: 报告估值 $2.0B
          detail: $130M 融资由股权和债务组成
        - id: scale-proof
          label: 具备实质规模的银行业务
          detail: 资产、信贷、存款和客户均有所扩张
        - id: earnings-proof
          label: 盈利证明不完整
          detail: 盈利能力由公司自称；缺少经审计的合并口径
        - id: transaction-risk
          label: Intercam 条件仍在
          detail: 交割、审批、合规和整合都需要验证
        - id: exit-option
          label: IPO 是可选项
          detail: 三年内的考虑取决于市场条件
        - id: entry-discipline
          label: 没有公开价格背书
          detail: 要求提供股权结构表、经审计的经济数据和资产质量证据
        - id: recommendation
          label: 跟踪 / 继续研究
          detail: 仅在完成建议所需的关键尽调后重新评估
    approximationNotes: 仅为有序的定性逻辑；节点顺序不代表转化、概率或与价值成比例的规模。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV010
      - CV011
      - CV012
      - CV014
      - CV016
