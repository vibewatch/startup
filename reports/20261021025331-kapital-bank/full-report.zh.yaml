      - number: '8.3'
        title: 下行、情景与退出准备度
        blocks:
          - type: paragraph
            body: >-
              最重要的下行风险是围绕 Intercam 资产的执行和合规。Reuters 报道，Intercam 是被美国制裁列为主要洗钱风险的机构之一；墨西哥官员则称美国没有提供支持性证据。Kapital
              公告称，收购仍取决于最终协议和惯常审批，并配套计划向银行业务投资 $100 million。该金额是拟议的运营投资，不是股东可支配非受限现金的证据。HR Ratings 于 March 24, 2026 给予
              KPTL Mexico Bank HR A+ 评级、展望稳定，这是积极的信用信号，但不是股权估值。未来三年内可能 IPO
              明确取决于市场条件，因此是退出选项，而不是已承诺的流动性事件。仅凭保留的公开证据，无法负责任地量化情景概率和目标回报。
            claimRefs:
              - CV007
              - CV011
              - CV012
              - CV013
