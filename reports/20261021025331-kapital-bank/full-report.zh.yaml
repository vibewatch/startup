      - number: '8.2'
        title: 规模证据与上行逻辑
        blocks:
          - type: paragraph
            body: >-
              上行逻辑建立在运营规模上，而不是公开估值倍数上。LatAm Republic 报道称，截至 2026 年第二季度末，资产超过 MXN 93 billion，信贷组合为 MXN 30 billion，同比增长
              220%，传统存款为 MXN 62 billion，同比增长 234%。该报道还称客户超过 300,000 名、员工 3,700 名。更早的 Contxto 报道称担保贷款超过 33,000 笔、融资客户超过
              100,000 名、融资额超过 MXN 22
              billion，但文章没有提供经审计的分母或可直接比较的估值口径。如果尽调验证盈利增长、资产质量和持久存款经济，这些指标可以支撑乐观情景；但它们本身不能证明收入、现金流或可投资的估值区间。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
