      - number: '1.3'
        title: 资本、所有权信号与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              Kapital 于 2025 年 9 月跨过独角兽门槛：LatamList 报道由 Tribe Capital 和 Pelion Ventures 领投的 $86 million Series C，Reuters
              报道其估值超过 $1.3 billion。随后 Tracxn 报告 12 轮融资累计 $307
              million；该数据库总额可能混合了股权和债务，不能证明可用现金、完全摊薄后的所有权或清算优先权。公司的受监管基础设施战略包括 2023 年收购 Banco Autofin。Reuters
              还报道，Kapital 已达成协议，拟收购 Intercam 的部分经纪、资产管理和运营银行资产，并计划向 Kapital 的银行业务投入 $100
              million。时间线在战略上连贯，但保留证据仍未验证交易完成情况、整合表现和股权结构表。
