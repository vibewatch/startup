        - 盈利增长经审计；信贷批次质量良好；Intercam 顺利交割；IPO 窗口打开
        - 估值可能获得高于 $2.0B 的支撑，但公开数据不足以计算区间或回报
        - 整合或信贷恶化
        - 仅为有条件情景；没有可审计的公开概率
      - - 基准
        - 在合并利润率、优先权安排和整合 KPI 仍属非公开信息的情况下，规模继续增长
        - 将 $2.0B 视为标题估值参考，而非有证据支持的入场价格；谈判时要求以证据为基础的下行保护
        - 为未经验证的盈利质量付费
        - 与当前混合证据最为一致
      - - 悲观
        - 监管摩擦、收购资产质量偏弱、利润率承压或流动性延迟
        - 可能出现下轮融资或资本减值；公开信息中没有可辩护的估值底线
        - 合规、资产质量和再融资
        - 审批失败、评级承压或无法验证盈利能力时触发
    notes: 这些情景是有条件的决策框架，不是预测；当来源输入缺失时，不虚构概率、估值区间或目标回报。
