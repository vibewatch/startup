            - 事件响应
          detail: 有报道称云端暴露，因此整改和保障证据十分重要。
    approximationNotes: 层级顺序是分析性的，不声称公司的实际部署拓扑或数据流向。
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE013
  - id: FU001
    title: 有证据支撑的客户旅程与拟议扩展面
    type: journey-map
    summary: 这是一条从金融数据可视化走向信贷和更广泛服务的定性旅程，不代表已测量的转化率。
    data:
      nodes:
        - id: visibility-need
          label: 识别可视化或流动性需求
          detail: SME 希望集中查看运营和现金流。
          touchpoints:
            - Business operations
            - Cash-flow view
        - id: data-connection
          label: 接入运营数据
          detail: 平台分析现金流和开票信息。
          touchpoints:
            - Invoices
            - Financial data
        - id: credit-assessment
          label: 评估信贷能力
          detail: 公司描述了数据驱动的商业信贷评估。
          touchpoints:
            - Underwriting
            - Risk assessment
        - id: financing
          label: 使用融资
          detail: 公开报道描述了担保贷款和融资客户。
          touchpoints:
            - Loan
            - Working capital
        - id: ongoing-management
          label: 管理财务
          detail: 客户方案把可视化与日常财务运营结合起来。
          touchpoints:
            - Payments
            - Cash management
        - id: broader-services
          label: 扩展到更广泛的服务
          detail: 交割后，Intercam 资产和计划中的投资可能扩大服务范围。
          touchpoints:
            - Brokerage
            - Asset management
            - Operational banking
    approximationNotes: 这条定性序列根据产品描述拼接而成；公开证据没有支持任何阶段转化、周期、留存或附加率。
    claimRefs:
      - CU002
      - CU011
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 这是对可能性、影响和缓释成熟度的定性、基于证据的判断；对于指定公开来源不支持概率的地方，保留未知状态。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
