  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: profitability
      missingEvidence: >-
        Audited consolidated income statements, cash flow, segment margins,
        regulatory capital, credit vintages, losses, and fraud performance.
      whyItMatters: >-
        Operating scale and a management profitability claim do not establish
        sustainable equity cash generation or downside protection.
      diligencePath: >-
        Obtain audited group financials, regulatory returns, monthly management
        accounts, cohort loss curves, and a quality-of-earnings review.
      relatedQuestionRefs: [QV004]
    - type: missing-source
      severity: material
      topic: comparable-set
      missingEvidence: >-
        Comparable-company or transaction metrics aligned on revenue, earnings,
        assets, credit quality, capital structure, and valuation date.
      whyItMatters: >-
        Without comparable denominators, neither a valuation range nor a target
        return can be defended from the reported headline marks.
      diligencePath: >-
        Build a banker-supported comp set from audited peers and disclosed
        transactions, then reconcile every multiple to Kapital's audited metrics.
      relatedQuestionRefs: [QV007]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Fully diluted ownership, liquidation preferences, debt covenants, board
        committees, reserved matters, and the post-Intercam legal structure.
      whyItMatters: >-
