schemaVersion: "report-v2"
artifact: financials
slug: kapital-bank
runDate: "2026-10-21"
company:
  name: Kapital Bank
chapter:
  number: 4
  title: Financials
  summary: >-
    Kapital's public evidence shows a broad banking model spanning treasury, payments,
    cards and credit, plus company-reported profitability and material operating scale.
    Underwriting remains constrained because realized pricing, consolidated revenue,
    margins, credit losses, cash, burn and runway are not quantified in the retained
    evidence.
sections:
  - id: revenue-model
    title: Revenue model is diversified, but monetization is opaque
    body: >-
      Kapital presents an integrated SMB banking proposition rather than a single-product
      software subscription. Its Y Combinator profile describes multi-treasury services,
      foreign exchange, accounts, payroll and global payments, an employee-expense
      dashboard with prepaid cards, and a flexible credit card. Contxto separately
      describes the strategy as combining a regulated bank with fintech delivery after
      the Banco Autofin acquisition. These products plausibly create interest income,
      interchange, foreign-exchange spread and transaction or account fees, but the
      retained evidence does not disclose realized prices, fee schedules, yields or
      revenue mix. The model therefore has several potential monetization engines without
      enough data to judge their relative quality, recurrence or sensitivity to rates.
    claimRefs: [CI001, CI002, CI003, CI004, CI015]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: operating-scale
    title: Public traction is meaningful but mostly company-reported
    body: >-
      Contxto reported that, at the end of 2024, Kapital had raised more than MXN 10
      billion in funds, granted more than 33,000 guaranteed loans, provided more than MXN
      22 billion of financing to over 100,000 clients, reached a MXN 6.291 billion loan
      portfolio and processed more than 300 million invoices. A later funding article
      reported a $3 billion balance sheet, more than 300,000 business customers and
      company-confirmed profitability; Wikipedia repeats the scale figures. These are
      strong signals of throughput and balance-sheet expansion, but they are not a
      substitute for audited consolidated revenue, average balances, cohort performance
      or a reconciliation between group, bank and platform metrics.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012]
    tableRefs: [TI002]
  - id: unit-economics
    title: Unit economics cannot yet be underwritten
    body: >-
      Public volume does not reveal economic quality. The retained sources do not quantify
      net interest margin, fee take rates, funding cost, interchange economics, credit
      losses, fraud, servicing cost, customer acquisition cost or payback. That prevents a
      reliable bridge from customer activity to gross profit and makes the reported
      profitability milestone difficult to normalize across the regulated bank and the
      wider group. Management should provide product-level revenue recognition, monthly
      average balances, net charge-offs by vintage, deposit and wholesale funding costs,
      contribution margin after servicing, and acquisition cost by channel. Until then,
      scale should be treated as evidence of activity rather than proof of durable unit
      economics.
    claimRefs: [CI010, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Fresh capital and a stable rating do not resolve runway
    body: >-
      Tech Funding News and Crowdfund Insider reported a Series C of up to $100 million,
      with proceeds directed toward the AI-enabled platform and regional expansion.
      Crowdfund Insider also reported a planned $100 million investment to strengthen
      operations after the Intercam asset acquisition, while highlighting credit-cycle,
      covenant and cash-flow stress considerations. HR Ratings lists KPTL México Bank at
      HR A+ with a stable outlook as of March 24, 2026, which is a useful current external
      credit signal but not evidence of holdco liquidity. No retained source discloses
      cash on hand, monthly burn, unrestricted liquidity, debt covenants or a consolidated
      runway. The investment case therefore depends on management evidence separating
      regulated-bank capital from deployable parent-company cash.
    claimRefs: [CI013, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Capital raised is not cash available
    body: >-
      The reported Series C and historical financing demonstrate access to capital, but
      they do not establish unrestricted cash, burn or runway; bank regulatory capital
      and acquisition commitments may constrain deployment.
    claimRefs: [CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and monetization visibility
    columns:
      - Stream
      - Mechanism
      - Economic unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - [Multi-treasury and FX, "Accounts, wires, payroll, services payments and foreign exchange", "Fee or spread per transaction/account", "Product offered; realized pricing undisclosed", "Potentially recurring but volume- and rate-sensitive", "Monthly active accounts, balances, transaction volume, fee schedule and realized take rate"]
      - [Corporate expenses, "Dashboard and prepaid cards for employee spending controls", "Interchange and possible program fees", "Product offered; economics undisclosed", "Usage-linked with potential account retention benefit", "Purchase volume, active cards, interchange yield, rewards and processing cost"]
      - [Credit card and business lending, "Revolving or amortizing credit plus guaranteed loans", "Net interest income after funding and losses", "Material loan activity reported; yields and losses undisclosed", "Recurring but credit- and funding-cost sensitive", "APR/yield, funding cost, vintage losses, fraud, recoveries and risk-adjusted margin"]
      - [Financial operations platform, "Invoice processing and real-time finance visibility", "Possible software, account or bundled service fees", "Large invoice throughput reported; software pricing undisclosed", "Could deepen retention, but standalone revenue is unproven", "Contracts, attach rates, standalone fees, retention and support cost"]
    notes: >-
      Mechanisms are derived from retained product descriptions; realized prices, revenue
      recognition and stream mix are unavailable and must not be read as reported revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI006, CI007, CI009, CI015]
  - id: TI002
    title: Public operating and financial signals
    columns:
      - Metric
      - Period
      - Reported value
      - Evidence status
      - Underwriting implication
    rows:
      - [Funds raised, "End of 2024", "More than MXN 10 billion", "Contxto report; denomination preserved", "Not equivalent to cash on hand or revenue"]
      - [Guaranteed loans granted, "Prior year reported in 2025 article", "More than 33,000", "Contxto report", "Shows origination activity but not approval rate or losses"]
      - [Client financing, "Prior year reported in 2025 article", "More than 100,000 clients; more than MXN 22 billion", "Contxto report", "Shows reach and disbursement, not outstanding principal or yield"]
      - [Loan portfolio, "End of 2024", "MXN 6.291 billion", "Contxto report", "Material balance-sheet exposure requires vintage and loss data"]
      - [Invoices processed, "Prior year reported in 2025 article", "More than 300 million", "Contxto report", "High activity signal; monetized volume is unknown"]
      - [Balance sheet, "Reported September 2025", "$3 billion", "Tech Funding News; echoed as AUM by Wikipedia", "Metric definition and group perimeter require reconciliation"]
      - [Business customers, "Reported September 2025", "More than 300,000 across the United States, Mexico and Colombia", "Tech Funding News; repeated by Wikipedia", "Large claimed footprint without activity or concentration disclosure"]
      - [Profitability, "Reported September 2025", "Company-confirmed profitable", "Third-party article relaying company statement", "Needs audited net income, perimeter and normalization"]
    notes: >-
      Values retain each source's metric name, period and denominator; they mix operating
      throughput, balance-sheet and company-claimed measures and are not additive.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012]
  - id: TI003
    title: Unit economics and capital adequacy diligence
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Required evidence
    rows:
      - [Realized pricing and revenue mix, null, Low, "Determines recurrence and sensitivity to rates or transaction volume", "Product-level revenue, realized fee schedules, yields and revenue-recognition policy"]
      - [Net interest margin and funding cost, null, Low, "Separates lending spread from balance-sheet growth", "Monthly average assets and liabilities, deposit beta, wholesale cost and NIM"]
      - [Credit losses and fraud, null, Low, "Tests whether origination growth creates durable risk-adjusted returns", "Vintage delinquency, net charge-offs, recoveries, fraud and reserve coverage"]
      - [CAC and payback, null, Low, "Tests sales efficiency and channel dependence", "Fully loaded CAC by channel, activation, contribution margin and payback"]
      - ["Cash, burn and runway", null, Low, "Determines financing dependence outside regulated-bank capital", "Holdco cash, restricted cash, monthly burn, covenants, commitments and downside runway"]
    notes: >-
      Null means the metric was not quantified in the retained public evidence, not zero;
      each row states the management evidence needed to close the gap.
    claimRefs: [CI010, CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Customer activity to gross-profit evidence bridge
    type: flow
    summary: >-
      Public evidence supports the product and activity stages, but pricing, losses and
      servicing costs break the bridge before gross profit.
    data:
      nodes:
        - id: customer-activity
          label: SMB financial activity
          detail: Accounts, payments, payroll, expenses, invoices and borrowing.
        - id: platform-products
          label: Kapital products
          detail: Multi-treasury, FX, prepaid cards, credit cards and business financing.
        - id: public-volume
          label: Reported activity
          detail: Loan, financing, invoice and customer scale is publicly reported.
        - id: gross-revenue
          label: Gross revenue
          detail: Interest, interchange, spreads and fees are plausible but not quantified by stream.
        - id: direct-costs
          label: Direct costs
          detail: Funding, credit loss, fraud, processing and servicing costs are not disclosed.
        - id: gross-profit
          label: Gross profit
          detail: Company-reported profitability cannot be reconciled to product contribution margins.
    approximationNotes: >-
      This is a qualitative sequence, not a quantified waterfall; it does not estimate
      conversion rates, revenue or margin.
    claimRefs: [CI001, CI004, CI009, CI010, CI015]
