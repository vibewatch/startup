artifact: company-overview
slug: factory
runDate: 2026-10-18
company:
  name: Factory
chapter:
  number: 1
  title: Company Overview
  summary: >
    Factory is a 2023-founded, late-stage private software company positioning Droids as autonomous agents for the full software-development lifecycle, with public evidence showing cloud, on-premises, and air-gapped deployment options and rapid 2026 product expansion. The clearest verified financing datapoints are a $150 million Series C at a $1.5 billion valuation in April 2026 and an unlabelled $200 million round at a $5 billion valuation in September 2026 that took total funding to over $400 million. Public evidence in the assigned pool is still thin on ARR, recognized revenue, headcount, headquarters city, board composition, and exact round structure for the September financing.
sections:
  - id: identity-and-positioning
    title: Identity and positioning
    body: >
      Factory presents itself as an agent-native software-development platform rather than a point coding assistant, with Droids spanning coding, review, testing, documentation, incident response, and deployment workflows. The strongest corroborated positioning evidence is consistent across the company announcement, independent September 2026 reporting, and third-party reviews: Factory is selling a full-stack enterprise software-delivery system with model routing and deployment flexibility across cloud, self-hosted, and fully air-gapped environments. That positioning supports a one-line business model of enterprise software sold around autonomous development workflows, but the assigned source pool does not verify a current headquarters city, so the chapter keeps that identity field as an explicit gap rather than reusing earlier background.
    claimRefs:
      - CO001
      - CO002
      - CO012
      - CO013
    tableRefs:
      - TO001
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance exposure
    body: >
      The current public record in the assigned pool is founder-centric. Independent reporting and reviews consistently identify Matan Grinberg and Eno Reyes as the founders, with DevOps adding the most concrete background detail: Grinberg was pursuing a physics Ph.D. at UC Berkeley and Reyes was working as a machine-learning engineer when they connected and built the first demo. That supports credible founder-market fit around technical depth and product vision, but it does not substitute for a verified executive roster or board map. Because the available evidence centers so tightly on the founders and product narrative, governance opacity and key-person dependence remain material diligence issues rather than resolved company facts.
    claimRefs:
      - CO007
      - CO014
    tableRefs:
      - TO002
  - id: funding-scale-and-stakeholders
    title: Funding, scale, and stakeholder picture
    body: >
      Public financing evidence shows two major 2026 valuation marks. Beri reported the April 2026 Series C at $150 million and a $1.5 billion valuation, while the September 2026 company announcement and independent coverage reported a further $200 million financing at a $5 billion valuation that lifted total funding to over $400 million. The September announcement named a broad investor syndicate, but DevOps explicitly noted that the company did not identify the round as a Series D or specify whether the $5 billion mark was pre-money or post-money. Public scale signals are also asymmetric: Factory claims hundreds of thousands of developers and multiple blue-chip customers, and independent articles repeat named enterprise adopters, yet revenue, ARR, headcount, contract terms, and cap-table detail remain undisclosed in the assigned pool.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO006
      - CO008
      - CO009
      - CO012
    tableRefs:
      - TO003
  - id: milestone-velocity-and-open-questions
    title: Milestone velocity and open questions
    body: >
      Factory’s 2026 product cadence is easier to verify than its financial disclosure. The official product feed documents launches across analytics, desktop, QA, routing, security review, incident response, AutoWiki, and Agent Effectiveness, while the September financing announcement ties those launches to a broader “software factory” thesis. Independent reviews also sharpen the operating caveat: Factory appears most credible when customers have disciplined ticketing, integration, and governance processes, but coordination overhead and token-based spending become practical drawbacks for smaller teams or low-complexity work. The result is a company with strong momentum and product breadth, but one whose commercial efficiency and governance quality still require direct diligence rather than extrapolation from launch velocity.
    claimRefs:
      - CO010
      - CO011
      - CO013
      - CO014
    figureRefs:
      - FO001
