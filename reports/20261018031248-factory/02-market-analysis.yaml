    - Key differentiator for larger and regulated buyers
  - - Status-quo substitute set
    - Manual engineer coordination plus fragmented review, QA, docs, and reliability tools
    - Non-software operating budgets
    - Existing engineering labor and point-tool owners
    - Important baseline because buyers can stay with current process
