    - Engineering managers, DevEx, platform teams
    - Primary adoption wedge called out in reviews
  - - Security and deployment control layer
    - SSO, SCIM, audit logging, zero-data-retention, on-prem, air-gapped, data residency
    - Consumer coding assistants without governance controls
