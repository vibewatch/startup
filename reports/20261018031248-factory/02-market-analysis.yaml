company:
  name: Factory
chapter:
  number: 2
  title: Market Analysis
  summary: Factory is pursuing the market for governed, enterprise-scale software-development automation rather than consumer autocomplete, with a land-and-expand path from developer pilots to quoted business and enterprise deployments. The assigned evidence supports real demand for multi-agent workflows, governance, and deployment control, but it does not isolate an independent TAM/SAM/SOM or show paid-seat conversion with underwriting precision.
sections:
- id: market-boundary-and-substitutes
  title: Factory's market boundary is governed SDLC automation, not editor autocomplete
  body: The assigned sources consistently frame Factory as a platform for autonomous or agent-native software development across the software delivery lifecycle, not as a narrow code-completion widget. Official pages and independent reviews emphasize planning, coding, testing, review, incident response, documentation, and deployment support across desktop, terminal, web, Slack, and CI/CD, which pushes the relevant spend pool beyond assistant seats toward a broader 'software factory' control plane. That framing matters because the closest substitutes are not only GitHub Copilot-style tools, but also manual ticket-to-PR workflows, fragmented point tools for review and reliability, and internal platform-engineering processes that already own governance and release quality.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM008
  - CM009
  tableRefs:
  - TM001
- id: buyer-map-and-adoption-path
  title: The buyer path moves from developer experimentation into platform, security, and enterprise budgets
  body: 'Factory''s commercial and deployment packaging implies a classic bottoms-up-to-enterprise motion. Public list pricing starts with individual and small-team tiers, but the higher-value surfaces are the quoted Business and Enterprise offers that bundle SSO, SCIM, audit logging, zero-data-retention, dedicated compute, on-premise deployment, and data residency. Those controls shift the economic buyer away from an individual developer and toward engineering leadership, platform teams, security, procurement, and regulated-environment stakeholders. Adoption also appears to depend on existing workflow maturity: multiple reviews say the product works best when teams already run disciplined ticketing, code review, and CI/CD processes, while cost predictability and review overhead remain material friction for lighter-weight teams.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM010
  - CM013
  - CM014
  tableRefs:
  - TM003
  figureRefs:
  - FM001
- id: sizing-lenses-drivers-and-gaps
  title: The market is attractive, but the evidence supports sizing by constrained lenses instead of a generic TAM
  body: 'The strongest growth signals in the assigned pool are categorical rather than fully quantifiable: the company says hundreds of thousands of developers already use Factory, independent reviewers place it with enterprise engineering organizations and complex codebases, and commentary around the September 2026 financing round describes a shift from single-user copilots toward continuously operating software factories. Public product releases such as Router, Agent Effectiveness, AutoWiki, incident response, automated security review, and QA further suggest the company is widening the spend envelope from code generation into workflow orchestration and measurable ROI. Even so, the evidence stops short of an investable TAM/SAM/SOM because there is no independent seat count, conversion funnel, ARR disclosure, or segment-level spend decomposition in the assigned pool.'
  claimRefs:
  - CM008
  - CM009
  - CM011
  - CM012
  - CM015
  tableRefs:
  - TM002
