      - number: '1.4'
        title: 里程碑速度与待解问题
        blocks:
          - type: paragraph
            body: >
              与财务披露相比，Factory 的 2026 年产品节奏更容易验证。官方产品信息流记录了分析、桌面端、QA、路由、安全审查、事件响应、AutoWiki 和 Agent Effectiveness 等产品发布；9
              月融资公告又把这些发布纳入更广义的“软件工厂”论点。独立评测进一步明确了运营层面的限制：当客户拥有严格的工单、集成和治理流程时，Factory 最有说服力；但对小团队或低复杂度工作，协调开销和基于 token
              的支出会成为现实负担。因此，公司势头强、产品覆盖广，但商业效率和治理质量仍需直接尽调，不能从发布速度外推。
