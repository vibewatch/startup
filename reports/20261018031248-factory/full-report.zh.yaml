      - number: '3.2'
        title: 公开证据中的 Factory 差异化
        blocks:
          - type: paragraph
            body: >-
              资料池显示，Factory 最强的差异化不在原始编码质量，而在工作流覆盖、部署灵活性和渠道触达。Factory 6
              月的产品定位称，平台在一个闭环中覆盖分流、构建、测试、审查、安全、发布和监控；其产品界面强调模型路由、可调自治程度，以及在终端、IDE、浏览器、Slack 和工作流工具中的执行。2026 年产品信息流还显示
              Router、Automated Security Review、Incident Response、Analytics、AutoWiki、Droid Computers 和 Desktop App
              等相邻能力陆续上线，支持平台正在超越狭窄编码助手的判断。


              Wipro 2026 年 1 月的公告具有战略意义，因为它带来了轻量工具通常缺少的分销能力和企业可理解性。Wipro 表示将把 Factory 部署到数万名工程师，并为多个行业的客户打包启用 Factory
              的解决方案。结合 Factory 自己的具名客户名单，当前公开图景是：公司试图靠主权部署、编排深度和大型企业采用取胜，而不是押注单一基准或 IDE 切入口。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
