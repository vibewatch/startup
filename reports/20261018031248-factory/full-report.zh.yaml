      - number: '1.2'
        title: 创始人、管理层与治理暴露
        blocks:
          - type: paragraph
            body: >
              当前资料池中的公开记录以创始人为中心。独立报道和评测一致将 Matan Grinberg 与 Eno Reyes 认定为创始人；DevOps 提供了最具体的背景细节：Grinberg 当时在 UC
              Berkeley 攻读物理学博士，Reyes 任机器学习工程师，两人相识后搭出了第一个
              demo。这说明团队在技术深度和产品愿景上具备可信的创始人与市场匹配，但不能替代经过验证的高管名单或董事会图谱。由于现有证据高度集中在创始人和产品叙事上，治理不透明及关键人依赖仍是重要尽调问题，而不是已解决的公司事实。
