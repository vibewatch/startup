chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >
              Factory 将自己定位为原生智能体的软件开发平台，而不是单点编码助手；其 Droids 覆盖编码、审查、测试、文档、事件响应和部署流程。公司公告、2026 年 9
              月独立报道及第三方评测的定位证据高度一致：Factory
              销售的是一套全栈企业软件交付系统，既能路由模型，也能在云端、自托管和完全隔离环境中灵活部署。这一定位足以概括为围绕自主开发流程销售企业软件，但资料池没有验证当前总部城市，因此本章保留这一明确缺口，不沿用早期资料。
            claimRefs:
              - CO001
              - CO002
              - CO012
              - CO013
