      - number: '1.3'
        title: 融资、规模与利益相关方
        blocks:
          - type: paragraph
            body: >
              公开融资证据显示 2026 年出现两次重大估值标记。Beri 报道 2026 年 4 月 Series C 融资 $150 million、估值 $1.5 billion；2026 年 9
              月公司公告及独立报道则披露，进一步完成 $200 million 融资、估值达到 $5 billion，累计融资超过 $400 million。9 月公告列出了广泛的投资者组合，但 DevOps
              明确指出，公司没有把该轮标为 Series D，也没有说明 $5 billion 是投前还是投后估值。公开规模信号并不对称：Factory
              声称已有数十万开发者和多家蓝筹客户，独立文章也反复提到具名企业采用者；但收入、ARR、员工数、合同条款和资本结构细节仍未在资料池中披露。
