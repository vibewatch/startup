        title: 市场有吸引力，但应以受约束的视角测算，而不是套用泛化 TAM
        blocks:
          - type: paragraph
            body: >-
              资料池中最强的增长信号是类别性的，而非完全量化的：公司称已有数十万开发者使用 Factory；独立评测将其置于企业工程组织和复杂代码库场景；围绕 2026 年 9 月融资的评论则称，市场正从单用户 copilot
              转向持续运行的软件工厂。Router、Agent Effectiveness、AutoWiki、事件响应、自动安全审查和 QA 等公开发布，也表明公司正把支出边界从代码生成拓展到工作流编排和可衡量的
              ROI。即便如此，资料池没有独立席位数、转化漏斗、ARR 披露或分部支出拆分，证据还不足以支撑可投资的 TAM/SAM/SOM。
