    title: 产品架构图
    type: stack
    summary: 公开证据将 Factory 描述为分层编排栈，覆盖上下文接入、协调、按角色执行、验证和部署界面。
    data:
      layers:
        - label: 上下文接入
          detail: 工单、协作、代码和监控系统提供工作简报及企业记忆输入。
          modules:
            - Linear / Jira 工单
            - GitHub 仓库和拉取请求
            - Notion 和内部文档
            - Slack 以及 Sentry 或 Datadog 信号
          outputs:
            - 已路由的任务上下文
        - label: 协调
          detail: Missions 或协调器将目标拆解为按角色划分的工作项和交接。
          modules:
            - 工单拆解
            - 并行任务路由
            - 交接排序
          outputs:
            - 范围明确的工作计划
        - label: 执行 Droids
          detail: 专用智能体处理代码审查、测试、文档、知识和可靠性任务。
          modules:
            - Code Droid
            - Review Droid
            - Test / Docs Droids
            - Knowledge / Reliability Droids
          outputs:
            - 差异、测试、审查和文档
        - label: 验证与政策
          detail: 公开描述强调自动化审查、安全检查、可审计性和价值衡量。
          modules:
            - PR 质量审查
            - 安全分析
            - 审计日志和用量追踪
            - Agent Effectiveness
          outputs:
            - 可供审批的变更集
        - label: 人工治理
          detail: 企业运营人员仍需围绕智能体闭环设定审批阈值、权限和部署边界。
          modules:
            - 审批关卡
            - 模型与自主性控制
            - 账户和支持责任
          outputs:
            - 治理型发布决策
        - label: 部署界面
          detail: 同一产品系列覆盖开发者界面和主权运行时选项销售。
          modules:
            - Desktop / CLI / SDK
            - 云端和本地后台智能体
            - Droid Computers
            - 本地部署 / 气隙环境运行时
          outputs:
            - 企业运营界面
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据指向一条由试点带动、受治理的扩张路径，从企业评估走向规模化部署。
    data:
      items:
        - label: 识别企业适配度
          actor: 买方
          stage: 细分资格评估
          touchpoints:
            - 大型或遗留代码库
            - 需要在现有工具内自主完成工作
        - label: 验证治理要求
          actor: 安全 / 平台团队
          stage: 采购关卡
          touchpoints:
            - 审计轨迹和审批
            - 本地部署或气隙环境部署
            - 凭证及 CI / 仓库控制
        - label: 开展有边界的试点
          actor: 工程团队
          stage: 评估
          touchpoints:
            - 稳定的代码库
            - 工单规范审计
            - 每个 PR 都有人审查
        - label: 证明生产环境实用性
          actor: 交付团队
          stage: 生产部署
          touchpoints:
            - 跨终端、IDE、网页和 CI/CD 的多工具执行
            - 点名的生产环境客户背书和一份大规模案例研究
        - label: 扩展到更多团队和仓库
          actor: 平台负责人
          stage: 扩张
          touchpoints:
            - Teams 或 Enterprise 合同
            - 更多席位、专用算力和更严格的治理
        - label: 评估续约与集中度
          actor: 财务 / 采购团队
          stage: 续约
          touchpoints:
            - ROI 和 token 支出可见性
            - 仍缺少 NRR、流失率和客户集中度披露
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在估值支撑、token 经济性和治理证明，而不是产品是否存在。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解措施成熟度
        - label: 剩余严重程度
      rows:
        - label: 估值支撑缺口
          note: 融资额和定价的增长速度快于公开单位经济性披露。
          values:
            - label: 高
              tone: adverse
            - label: 高
              tone: adverse
            - label: 中
              tone: warning
            - label: 高
              tone: adverse
        - label: Token 支出波动
          note: 按用量定价很灵活，但若团队不主动治理工作负载范围，支出可能超出预期。
          values:
            - label: 高
              tone: adverse
            - label: 高
              tone: adverse
            - label: 中
              tone: warning
            - label: 高
              tone: adverse
        - label: 合规证明缺口
          note: 存在受监管部署的主张，但指定来源集中没有一手审计材料。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: adverse
            - label: 中
              tone: warning
            - label: 高
              tone: adverse
        - label: 审查与质量负担
          note: 对于不简单的工作，人工合并权限仍是运营模式的一部分。
          values:
            - label: 高
              tone: adverse
            - label: 高
              tone: adverse
            - label: 中
              tone: warning
            - label: 高
              tone: adverse
        - label: 多模型依赖面
          note: 路由降低了对单一供应商的锁定，但增加了 API、政策和故障模式的复杂性。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: adverse
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
        - label: 客户集中度不透明
          note: 点名客户的 logo 已公开，但合同组合和续约质量未披露。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: adverse
            - label: 低
              tone: neutral
            - label: 高
              tone: adverse
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR007
      - CR011
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这一建议基于真实的企业牵引力、不完整的投资判断数据，以及需要私下尽调才能证明合理的估值跃升。
    data:
      nodes:
        - id: proof
          label: 企业证明
          value: Named customers and reported broad usage
          note: 大型企业似乎已在近似生产环境中使用 Factory。
        - id: growth
          label: 增长信号
          value: Fast revenue narrative
          note: 公开证据包含 2026 年 3 月的外部收入估计，以及公司声称的加速增长。
        - id: model
          label: 商业模式
          value: $20/mo entry plus token usage
          note: 消费量放大价值，但也带来支出和利润率波动。
        - id: markup
          label: 估值重置
          value: $300M → $1.5B → $5B
          note: 估值加价速度超过了新增公开基本面披露的速度。
        - id: gap
          label: 投资判断缺口
          value: No disclosed absolute revenue, profitability, EV/Revenue, or full terms
          note: 当前公开记录无法完全支撑最新的私募价格。
        - id: call
          label: 建议
          value: research-more / stretched / high risk
          note: 只有在私下尽调更扎实或入场点更好时才推进。
      edges:
        - from: proof
          to: growth
          label: 支持关注
        - from: growth
          to: model
          label: 引出规模问题
        - from: model
          to: markup
          label: 抑制溢价
        - from: markup
          to: gap
          label: 迫使进行投资判断检验
        - from: gap
          to: call
          label: 推导当前立场
    approximationNotes: 这是分析性的决策流程，不是加权评分模型。
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV011
      - CV012
      - CV016
