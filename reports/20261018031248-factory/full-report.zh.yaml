          - type: paragraph
            body: >-
              反方论点同样清楚。公开来源没有披露任何融资轮的绝对收入、盈利能力或 EV/Revenue，最好的公开收入信号仍是叠加在公司自述加速之上的外部估算。同时，Factory 自身的商业模式让投资人暴露于 token
              和计算密集度：自主工作负载可以创造真实企业价值，但当用量增速快于路由效率时，也会压缩软件利润率。独立评测进一步强调了 token
              定价、支出可预测性弱，以及需要人工签字而非自主上线生产。这些问题在价格合理的融资轮中可管理，但在 $5 billion 的入场点更难吸收。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 什么会改变估值判断
        blocks:
          - type: paragraph
            body: >-
              公开记录支持情景思考，而不是虚假的精确性。若 Factory
              的内部数字证明收入规模显著高于当前可见水平，具名客户是在扩张而非仅试点，且融资条款足够干净、普通股上行空间没有被优先股堆叠过度挤压，则乐观情景成立。基准情景是公司真实、战略上重要，但仍不透明，无法在公开市场中有把握地定价。悲观情景很直接：如果增长正常化、模型成本持续偏重，或下一轮融资披露激进结构，当前估值可能迅速向此前的私有市场估值压缩。在私人尽调回答这些问题之前，入场纪律比叙事势头更重要。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV012
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: Factory 可能配得上溢价式公司叙事，但公开证据不足以支撑溢价价格
            body: 最强的公开证据证明了 traction 和投资人热情，但还不足以证明收入质量、利润持久性或融资干净程度，无法有把握地评估 $5 billion 入场点。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV016
          - type: callout
            title: 上行案例依赖非公开尽调，而不是下一条公开头条
            body: 若要从继续研究升级，管理层需要开放 ARR、毛利率、留存、客户扩张和优先权条款，而不是简单再公布一次估值或产品发布。
            calloutType: assumption
            claimRefs:
              - CV007
              - CV009
              - CV016
