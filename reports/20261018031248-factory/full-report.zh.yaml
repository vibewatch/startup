  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              公开证据支持混合变现模式，而不是简单的按席位收费 SaaS。2026 年第三方价格评测一致描述了每月 $20、$100 和 $200 的入门层级，同时强调实际使用还会产生额外的 token
              消耗，较大团队则转入定制化 Business 和 Enterprise 合同。公司官方材料进一步表明，Factory 销售的是具备治理能力的企业平台，提供专用计算、隔离部署和模型路由控制，因此其 ACV
              包装可能高于个人开发者工具。仍缺少的是实际成交价格：保留的公开来源均未披露折扣、承诺额度、实施费，或发票增长中席位与模型消耗各占多少。
