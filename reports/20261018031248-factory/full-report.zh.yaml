      - number: '3.3'
        title: 持久性、切换成本与压缩风险
        blocks:
          - type: paragraph
            body: >-
              资料池也说明了这一类别为何可能迅速压缩。Digital Applied 称，Factory 以协调器优先的工作流处理琐碎修复和探索性任务时会增加开销；MindStudio
              则认为，人仍需掌握规划和审查，因为没有节点时，智能体不能可靠推断意图或维护代码库。因此，部分买方会把 Factory 留作现有助手周围的编排层，而不是彻底替换它们，尤其是那些已有强大内部工具的团队。


              公开商业证据同样不完整。Makerstack 提供了标价比较，但资料池没有披露实际企业价格、超额用量消耗、续约表现，或客户究竟是转向 Factory，还是把它叠加在 Cursor、Copilot
              或内部系统之上。因此，在受监管、多工具、治理要求高的场景，护城河看起来确实存在；但在轻量助手、内部构建或多重使用已经捕获足够多相同工作流、且无需承担协调成本的地方，Factory 仍容易被商品化。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: Factory 竞争的是架构，而不是某一个品牌
            body: 现有证据显示，买方面对的是企业编排、编辑器原生辅助、自主单智能体委托、swarm 式试验和内部流程成熟度之间的选择。
            calloutType: insight
            claimRefs:
              - CP005
              - CP008
              - CP014
          - type: callout
            title: 产品故事之外，公开证明更薄
            body: 公开来源描述了广泛的工作流覆盖和具名企业，但尚未提供足够的买方证据来证明实际价格、多重使用情况或基准化质量结果能够形成持久的竞争分离。
            calloutType: risk
            claimRefs:
