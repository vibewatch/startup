      - number: '2.2'
        title: 买方路径从开发者试用延伸到平台、安全和企业预算
        blocks:
          - type: paragraph
            body: >-
              Factory 的商业和部署包装暗示了一条典型的自下而上走向企业的路径。公开标价从个人和小团队层级起步，但高价值功能集中在报价制的 Business 和 Enterprise 方案，包含
              SSO、SCIM、审计日志、零数据保留、专用计算、本地部署和数据驻留。这些控制把经济买方从单个开发者转向工程管理层、平台团队、安全、采购及受监管环境的利益相关方。采用似乎还取决于现有流程成熟度：多篇评测称，团队已有严格的工单、代码审查和
              CI/CD 流程时，产品效果最好；而成本可预测性和审查开销仍会卡住轻量团队。
            claimRefs:
