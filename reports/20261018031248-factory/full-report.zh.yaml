  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Factory 的市场边界是受治理的软件开发生命周期自动化，而非编辑器自动补全
        blocks:
          - type: paragraph
            body: >-
              资料池一致将 Factory 描述为覆盖软件交付生命周期的自主或原生智能体开发平台，而不是狭窄的代码补全组件。官方页面和独立评测强调，它在桌面端、终端、网页、Slack 及 CI/CD
              中支持规划、编码、测试、审查、事件响应、文档和部署，因此相关支出池不再只是助手席位，而是更广义的“软件工厂”控制平面。这个定义很关键：最接近的替代方案不仅有 GitHub Copilot
              一类工具，也包括人工从工单到 PR 的流程、审查和可靠性领域的零散工具，以及已经掌握治理和发布质量的内部平台工程流程。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
