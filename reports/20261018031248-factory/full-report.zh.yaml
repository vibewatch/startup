  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              资料池中的竞争集合按架构划分，而不是逐一对标品牌。              Factory 被定位为“软件工厂”和企业协调层；相邻替代方案包括 Cursor、GitHub Copilot
              等编辑器原生助手，Devin 等委托式单智能体产品，OpenClaw 等多智能体集群流程，以及内部管理的工单、规划和审查这一现状。买方因此往往可以多重使用：保留 IDE 助手或内部流程，同时试用 Factory
              做更长周期的编排。


              这一点很重要，因为最可信的在位方案仍是现有开发者流程。MindStudio 的软件工厂说明和 Digital Applied
              的评测都把规划、工单卫生和审查节点视为前提，而不是可有可无的润色。换言之，软件交付已经工单化、有治理且集成繁多的团队最容易为 Factory 找到理由；主要追求单人编辑速度的团队，则有采用路径更简单的替代方案。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
