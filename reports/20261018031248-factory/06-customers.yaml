  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-durability
      missingEvidence: Net revenue retention, gross retention, churn, renewal rates, and contract length by customer cohort.
      whyItMatters: These metrics are required to distinguish logo acquisition from durable recurring revenue and to underwrite expansion quality.
      diligencePath: Request cohort retention tables, renewal summaries, and standard contract-term examples from management or existing investors.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue mix, sector exposure, public-sector versus commercial split, and any partner- or marketplace-led concentration.
      whyItMatters: A few very large enterprise accounts could explain the logo set while leaving the revenue base concentrated and expansion-sensitive.
      diligencePath: Request the top-10 customer concentration table, ARR by sector, and channel mix for direct versus partner-sourced contracts.
      relatedQuestionRefs: [QU005]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: More customer-authored case studies or procurement records that show scope, start date, and measured outcomes for named deployments.
      whyItMatters: The current named-customer table proves market resonance, but much of it is still logo-level proof rather than independently described production usage.
      diligencePath: Collect customer-authored case studies, conference talks, or procurement records for the logos already named in public sources.
      relatedQuestionRefs: [QU002]
      relatedTableRefs: [TU003]
