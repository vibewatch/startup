schemaVersion: "report-v2"
artifact: customers
slug: factory
runDate: 2026-10-18
company:
  name: Factory
chapter:
  number: 6
  title: Customers
  summary: >-
    Factory has credible enterprise adoption proof: its September 2026 financing post names
    major customers including Nvidia, Blackstone, RBC, Palo Alto Networks, Adobe, and
    T-Mobile, while independent recaps add June 2026 production references and one
    large-scale 2,700-seat deployment example. The missing pieces are durability and
    concentration economics: public evidence still does not disclose paying-account counts,
    renewal behavior, NRR/GRR, contract duration, or top-customer exposure.
sections:
  - id: enterprise-buyer-profile
    title: Enterprise buyer profile and segmentation
    body: >-
      Public evidence consistently places Factory with enterprise engineering buyers rather
      than solo developers. Factory's Claude Marketplace listing describes "governed
      autonomous engineering" across the software lifecycle, while Makerstack's June 2026
      review says the paid ladder starts with individual plans but that serious deployment
      shifts to Teams and Enterprise tiers with SSO, SAML/SCIM, audit logging, and
      on-premise options. Independent reviews also frame the best-fit user as engineering
      organizations with large or legacy codebases that want agents to work inside existing
      tools instead of forcing a new editor or delivery workflow. Net-new category sources
      reinforce that enterprise buyers in this segment evaluate governance, credential
      control, CI/repository checks, and traceability as procurement gates, which supports
      Factory's positioning but does not by itself prove realized retention.
    claimRefs: [CU001, CU002, CU005, CU007, CU009, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-adoption-proof
    title: Named adoption proof is real but still mostly logo-level
    body: >-
      Factory does have better public customer proof than many agentic-coding peers. The
      company's September 2026 financing post says customers include Nvidia, Blackstone,
      Royal Bank of Canada, Palo Alto Networks, Adobe, and T-Mobile, and that Factory is
      used by "hundreds of thousands of developers." Independent September 2026 coverage
      adds a June 2026 production-customer list that includes NVIDIA, Adobe, EY, Palo Alto
      Networks, Adyen, Blackstone, Wipro, and Comarch, plus one specific 2,700-seat
      deployment across 400 microservices. That is meaningful evidence of production usage,
      but much of the named proof is still company-issued or recap-style reporting rather
      than customer-authored case studies with contract scope, renewal history, or budget
      detail. The public record therefore supports real enterprise adoption without fully
      underwriting how broad or sticky that adoption is.
    claimRefs: [CU003, CU004, CU006, CU008, CU010, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration remain under-disclosed
    body: >-
      The biggest diligence gap is not whether Factory can win logos; it is whether those
      logos convert into durable, diversified contracts. Public sources still do not disclose
      NRR, GRR, churn, renewal rates, contract length, or customer concentration, and even
      favorable third-party reviews describe the product as something teams should pilot on
      stable codebases before broader rollout. Makerstack also notes that billing layers
      token usage on top of seat prices, which makes budgeting less predictable than flat
      subscriptions and creates another friction point for expansion. Taken together, the
      evidence supports a pilot-to-production motion with credible enterprise fit, but not a
      clean read on renewal quality, land-and-expand depth, or exposure to a handful of very
      large accounts.
    claimRefs: [CU008, CU009, CU010, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Individual developer / power user
        - Buyer=user=payer; self-serve Pro / Plus / Max
        - Personal agent use across CLI, Desktop, and SDK
        - Makerstack pricing ladder lists Pro, Plus, and Max tiers
        - Entry wedge and experimentation surface, but not the core proof set
        - No disclosed conversion from individual plans into enterprise accounts
      - - Engineering team
        - Engineering manager or team lead buys; engineers use; company pays
        - Team-scale Droids in existing tools and ticket workflows
        - Makerstack and NeuronFeed describe engineering-org deployment and existing-tool fit
        - Primary land motion into organizations deploying agents across teams
        - No public seat counts, renewal rates, or team-level expansion data
      - - Enterprise / regulated organization
        - Central platform, security, and procurement stakeholders buy; developers use
        - Governed autonomous engineering, on-prem, air-gapped, audit-heavy environments
        - Official post, Claude Marketplace, and reviews emphasize governance and deployment flexibility
        - Core strategic value appears to be enterprise infrastructure spend, not solo productivity
        - Public evidence does not separate regulated-industry mix or contract value by segment
      - - Marketplace / channel procurement
        - Existing Anthropic customer or enterprise procurement team buys; engineering teams use
        - Claude Marketplace procurement path and partner-led evaluation
        - Claude Marketplace page says existing Anthropic commitments can be applied
        - Lowers procurement friction for buyers already standardized on Anthropic
        - No public disclosure on channel mix or conversion from marketplace interest to production
    notes: >-
      Mixes company-issued product positioning with independent reviews; null contract data means the
      public record does not disclose segment revenue, conversion, or renewal behavior.
    claimRefs: [CU001, CU002, CU005, CU007, CU009, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Developer usage surface
        - hundreds of thousands of developers
        - "2026-09-15"
        - Factory financing post
        - company-claimed
        - Suggests broad usage reach at large businesses
        - Paying account count, active-seat definition, and customer count are undisclosed
      - - Named official customer set
        - 6 named businesses (Nvidia, Blackstone, RBC, Palo Alto Networks, Adobe, T-Mobile)
        - "2026-09-15"
        - Factory financing post
        - company-claimed
        - Current official proof extends beyond generic logo walls
        - No contract size, deployment scope, or retention data per account
      - - Independent production-customer recap
        - 8 named organizations in production or active daily use
        - 2026-09-15 recap of June 2026 launch
        - EneraLabs and ByteIota
        - medium
        - Supports that adoption is not just pilot-stage marketing
        - Customer list overlap and exact production definitions are not independently reconciled
      - - Largest disclosed deployment example
        - 2,700 seats / 400 microservices / 30% incidents auto-resolved / zero compliance findings across 3 audits
        - 2026-09-15 recap of June 2026 case study
        - EneraLabs
        - medium
        - Shows at least one production-scale enterprise implementation
        - Customer name, contract value, retention, and economic impact are not disclosed
    notes: >-
      Public adoption metrics mix official claims with third-party recaps; where source rows report usage
      breadth, the paying-account denominator and renewal economics remain undisclosed.
    claimRefs: [CU003, CU004, CU006, CU008, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - NVIDIA
        - Large technology / AI infrastructure
        - Running a software factory / autonomous agents in daily development work
        - Production per independent June 2026 launch recap; active customer per Sep 2026 official post
        - Named reference in both official and third-party sources
        - No seat count, spend, contract duration, or customer-authored case study
      - - Adobe
        - Enterprise software
        - Creative software development with autonomous agents
        - Production per independent recap; active customer per official Sep 2026 post
        - Repeated named customer proof across public sources
        - No disclosed KPI, rollout scope, or renewal history
      - - Palo Alto Networks
        - Cybersecurity enterprise
        - Droids running in production / software-factory deployment
        - Production per independent recap; active customer per official Sep 2026 post
        - Supports fit with security-sensitive engineering environments
        - Public evidence is still logo-level, not a customer-authored deployment story
      - - Blackstone
        - Financial services / alternative asset manager
        - Building self-improving software factories with Factory
        - Active customer per official Sep 2026 post
        - Shows resonance with a regulated buyer profile
        - Use case and deployment depth are not publicly detailed
      - - T-Mobile
        - Telecom
        - Building self-improving software factories with Factory
        - Active customer per official Sep 2026 post
        - Indicates cross-vertical reach beyond pure software vendors
        - No public evidence on production scope, outcomes, or commercial value
    notes: >-
      Public named proof is partial and skewed toward marquee logos; where deployment status is shown, it is
      still mostly company-issued or recap-level evidence rather than customer-authored case studies.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to publicly named customers and case-study references visible in the assigned prefetched
        source pool as of the 2026-10-18 run.
    claimRefs: [CU003, CU004, CU012, CU013]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence points to a governed, pilot-led expansion path from enterprise evaluation to scaled deployment.
    data:
      items:
        - label: Identify enterprise fit
          actor: Buyer
          stage: Segment qualification
          touchpoints:
            - Large or legacy codebase
            - Need for autonomous work inside existing tools
        - label: Validate governance requirements
          actor: Security / platform
          stage: Procurement gate
          touchpoints:
            - Audit trails and approvals
            - On-prem or air-gapped deployment
            - Credential and CI / repository controls
        - label: Run a bounded pilot
          actor: Engineering team
          stage: Evaluation
          touchpoints:
            - Stable codebase
            - Ticket hygiene audit
            - Human review on every PR
        - label: Prove production usefulness
          actor: Delivery team
          stage: Production deployment
          touchpoints:
            - Multi-tool execution across terminal, IDE, web, and CI/CD
            - Named production references and one large-scale case study
        - label: Expand to more teams and repos
          actor: Platform owner
          stage: Expansion
          touchpoints:
            - Teams or Enterprise contracts
            - Additional seats, dedicated compute, and tighter governance
        - label: Underwrite renewal and concentration
          actor: Finance / procurement
          stage: Renewal
          touchpoints:
            - ROI and token-spend visibility
            - Still-missing NRR, churn, and customer concentration disclosure
    claimRefs: [CU001, CU002, CU007, CU010, CU011, CU012]
callouts:
  - calloutType: strength
    title: Named enterprise proof is above average for this category
    body: >-
      Factory's public customer evidence is stronger than many agentic-coding startups: it has repeated named
      references, a current official customer set, and one specific large-scale deployment example.
    claimRefs: [CU003, CU004, CU006]
  - calloutType: risk
    title: Durability still rests on inference, not disclosed customer economics
    body: >-
      The chapter can support real adoption, but not the renewal quality of that adoption: public sources do not
      disclose NRR, churn, contract length, or top-customer concentration.
    claimRefs: [CU008, CU009, CU012]
