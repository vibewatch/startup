      relatedQuestionRefs: [QE009]
    - type: private-evidence-only
      severity: material
      topic: reliability-metrics
      missingEvidence: Task-level success rollback escalation and human-override rates by droid role deployment mode or customer cohort.
      whyItMatters: Named customers and case studies show demand but do not show whether the orchestration loop is reliably correct in production.
