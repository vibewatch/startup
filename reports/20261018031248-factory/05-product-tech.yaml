schemaVersion: report-v2
artifact: product-tech
slug: factory
runDate: 2026-10-18
company:
  name: Factory
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Factory's public product evidence describes a multi-agent enterprise software-development platform with
    role-scoped Droids, Desktop/CLI/SDK surfaces, and deployment options that extend from SaaS to
    air-gapped environments. The narrative is coherent across official pages and independent reviews, but
    public proof on role-level reliability, control scope, and grassroots developer signal remains thinner
    than the company and investor messaging.
sections:
  - id: product-surface
    title: Product surface and user workflow
    body: >-
      Factory is publicly positioned as a "software factory" rather than a narrow IDE copilot, with the
      core workflow centered on delegating scoped engineering work to specialized Droids across the software
      development lifecycle. Official and reviewer materials align on the user-facing surfaces: Desktop,
      CLI, SDK, and ticket- or chat-triggered workflows that pull context from systems such as Linear, Jira,
      Slack, GitHub, and documentation tools. That makes the product easier to place in enterprise
      engineering operations than in individual-developer toolchains, and it also explains why commercial
      packaging is a mix of seat tiers and usage-sensitive agent execution rather than a flat editor
      subscription. The net effect is a product that appears purpose-built for managed, reviewable delivery
      work inside existing operating systems for software teams, not for lightweight autocomplete or
      one-off personal coding tasks.
    claimRefs: [CE001, CE002, CE003, CE004, CE009]
    tableRefs: [TE001, TE002]
  - id: operating-model
    title: Architecture, deployment, and roadmap
    body: >-
      Public evidence describes Factory as an orchestration stack with a coordinator or Missions layer on
      top of role-scoped execution Droids, plus a knowledge or memory layer that carries forward repo and
      organizational context between tasks. Official materials also show meaningful deployment and control
      breadth: SaaS, on-premises, and air-gapped environments are all explicitly named, while enterprise
      plan materials enumerate admin controls, auditability, identity integration, and data-handling
      features. Freshness evidence is also credible: the 2026 product timeline publicly references Factory
      2.0, Factory Router, Agent Effectiveness, Droid Computers, and Desktop-app releases, which suggests
      the product is still expanding beyond a static launch configuration. What remains missing is the
      technical denominator behind those claims: public sources do not show latency, recovery, or role-level
      success metrics for the orchestration loop.
    claimRefs: [CE002, CE005, CE006, CE007, CE008, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: diligence-view
    title: Differentiation and technical risks
    body: >-
      Factory's differentiation is strongest where enterprise buyers care about coordination and control:
      multi-agent role separation, ticket-system entry points, and sovereign deployment options all show up
      repeatedly across the evidence set. The main product risk is that public proof still skews toward
      company, investor, and favorable-review narratives rather than audited operating data, so diligence
      has to focus on whether real customer environments achieve reliable review quality, acceptable
      rollback rates, and usable security controls at scale. Independent reviewers also warn that the
      coordinator model carries friction when tickets are weak or tasks are too trivial to justify
      orchestration overhead. In other words, Factory looks more like an enterprise execution layer than a
      commodity coding agent, but the implementation burden and proof burden both remain material.
    claimRefs: [CE006, CE007, CE010, CE011, CE012]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / product line
      - User
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Code / execution Droids, Engineers and forward-deployed teams, Core public surface, Specialized agents take scoped engineering work end to end instead of one generic assistant, No public acceptance or rollback rate by task type]
      - [Review / test / docs Droids, Reviewers QA and documentation owners, Publicly described by reviewers and partner sources, Role separation is meant to keep review and verification independent from code generation, Need customer evidence on override frequency and failure escalation]
      - [Knowledge / memory layer, Multi-repo engineering teams, Publicly described architectural component, Reuses repo docs and ticket history as shared context across tasks, No public index freshness or scale metrics]
      - [Missions / coordinator layer, Engineering managers and project owners, Publicly positioned in 2026, Decomposes long-horizon work into parallel tracks and handoffs, Need proof on dependency handling and recovery from failed branches]
      - [Deployment and admin plane, Platform admins and security teams, Sold in Team and Enterprise packaging, Combines sovereign deployment with identity policy and audit controls, Trust-center artifacts and control scope are not public in this evidence set]
    notes: >-
      Rows combine official product packaging with partner and reviewer descriptions; maturity reflects
      publicly visible evidence rather than audited production telemetry.
    claimRefs: [CE002, CE003, CE005, CE006, CE007, CE008]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - [Ticketed feature delivery, Team works from Jira or Linear with review gates, Coordinator routes scoped work to role-specific Droids and posts status back to the ticket, Strong fit for managed delivery workflows already centered on ticket systems, Quality depends on clear acceptance criteria and disciplined reviews]
      - [Legacy codebase change or migration, Engineer needs repo context docs tests and multi-service changes, Knowledge plus code test and review Droids share context across repos and handoffs, Public messaging repeatedly targets large or messy codebases rather than toy demos, No public benchmark split by codebase size complexity or language]
      - [Incident and reliability work, On-call or platform team reacts to monitoring alerts and incidents, Reliability-oriented Droids can operate from Slack and monitoring context instead of only an editor, Shows product scope beyond code generation into operational response, No public MTTR false-positive or pager-noise metric in the assigned evidence]
      - [Regulated or sovereign deployment, Security or platform team must control data path and runtime, Enterprise packaging offers on-prem or air-gapped deployment with admin and identity controls, Addresses procurement blockers for regulated customers, Compliance scope is asserted publicly but not evidenced with certificates here]
    notes: >-
      Benefits reflect public claims and reviewer observations; the evidence set lacks customer-level
      denominators for ROI, error rates, and long-run operating cost.
    claimRefs: [CE001, CE003, CE004, CE006, CE009, CE010, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Context ingestion, Builds the initial work brief from tickets repos docs and monitoring context, Linear or Jira plus GitHub Notion Slack and observability tools, Missing or low-quality upstream context can degrade every downstream agent step]
      - [Coordinator / Missions, Plans work sequencing and parallelization across Droids, Well-scoped tasks acceptance criteria and explicit handoff boundaries, Adds overhead on trivial work and can amplify poor ticket hygiene]
      - [Execution Droids, Perform code review test docs and reliability actions in scoped roles, Sandboxed runtime model routing and repo/toolchain access, Public evidence does not quantify per-role success rollback or human-override rates]
      - [Validation and governance, Applies review security auditability and spend visibility around each change, Org policy controls audit trails and approval process, Public sources name controls but do not expose control mappings or audit evidence]
      - [Deployment surfaces, Exposes Desktop CLI SDK cloud local Droid Computers and sovereign hosting choices, Compute allocation and enterprise packaging, Real cost and operational fit depend on usage intensity as well as seat tier]
    notes: >-
      This operating model is reconstructed from public descriptions rather than internal architecture
      diagrams, so layer boundaries should be validated directly in product diligence.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE010, CE011]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence describes Factory as a layered orchestration stack spanning context intake,
      coordination, role-specific execution, validation, and deployment surfaces.
    data:
      layers:
        - label: Context intake
          detail: Ticketing collaboration code and monitoring systems provide the work brief and enterprise memory inputs.
          modules:
            - Linear / Jira tickets
            - GitHub repos and pull requests
            - Notion and internal docs
            - Slack plus Sentry or Datadog signals
          outputs:
            - Routed task context
        - label: Coordination
          detail: Missions or a coordinator decompose objectives into role-scoped work items and handoffs.
          modules:
            - Ticket decomposition
            - Parallel task routing
            - Handoff sequencing
          outputs:
            - Scoped work plans
        - label: Execution Droids
          detail: Specialized agents handle code review test docs knowledge and reliability tasks.
          modules:
            - Code Droid
            - Review Droid
            - Test / Docs Droids
            - Knowledge / Reliability Droids
          outputs:
            - Diffs tests reviews and documentation
        - label: Validation and policy
          detail: Public descriptions emphasize automated review security checks auditability and value measurement.
          modules:
            - PR-quality review
            - Security analysis
            - Audit logging and usage tracking
            - Agent Effectiveness
          outputs:
            - Approval-ready change set
        - label: Human governance
          detail: Enterprise operators still define approval thresholds permissions and deployment boundaries around the agent loop.
          modules:
            - Approval gates
            - Model and autonomy controls
            - Account and support ownership
          outputs:
            - Governed release decision
        - label: Deployment surfaces
          detail: The same product family is sold across developer surfaces and sovereign runtime options.
          modules:
            - Desktop / CLI / SDK
            - Cloud and local background agents
            - Droid Computers
            - On-premises / air-gapped runtime
          outputs:
            - Enterprise operating surface
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE008, CE011]
callouts:
  - calloutType: strength
    title: Enterprise operating model is the product
    body: >-
      The strongest public evidence is not a single benchmark but the combination of ticket-driven
      orchestration, multi-surface agent access, and sovereign deployment packaging built for large teams.
    claimRefs: [CE001, CE003, CE006]
  - calloutType: risk
    title: Public proof is still thinner than the control story
    body: >-
      Factory's trust and maturity narrative is credible enough to merit diligence, but the assigned
      evidence does not independently quantify error rates, rollback rates, or security-control scope.
    claimRefs: [CE007, CE011, CE012]
  - calloutType: recommendation
    title: Underwrite implementation discipline, not just model quality
    body: >-
      Buyers should pressure-test ticket hygiene, approval flows, and admin controls because reviewer
      evidence suggests the coordinator model pays off only when those operating assumptions are already in
      place.
    claimRefs: [CE004, CE010]
