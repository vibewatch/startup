      severity: material
      topic: compliance-scope
      missingEvidence: Certificate copies or trust-center artifacts that show the scope and recency of SOC 2 ISO 42001 GDPR Zero Data Retention and air-gapped controls.
      whyItMatters: Security and sovereign-deployment language is central to the product pitch and buyers need scope boundaries rather than a feature checklist.
      diligencePath: Request current trust-center documents scope statements pen-test summaries and deployment diagrams for the exact enterprise tier being evaluated.
      relatedQuestionRefs: [QE005]
