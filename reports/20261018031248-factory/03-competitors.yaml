    title: "Factory competes against architectures, not one logo"
    body: "The assigned evidence points to a buyer decision among enterprise orchestration, editor-native assistance, autonomous single-agent delegation, swarm-style experimentation, and internal process maturity."
    claimRefs: ["CP005", "CP008", "CP014"]
  - calloutType: "risk"
    title: "Public proof is thinner than the product story"
    body: "Public sources describe broad workflow coverage and named enterprises, but they do not yet provide enough buyer-side evidence on realized pricing, multi-homing, or benchmarked quality outcomes to prove durable competitive separation."
    claimRefs: ["CP011", "CP012"]
