schemaVersion: report-v2
artifact: risks
slug: factory
runDate: 2026-10-18
company:
  name: Factory
chapter:
  number: 7
  title: Risks
  summary: >-
    Factory's highest public risks are not product-existence risks but execution,
    governance, and underwriting risks: a fast valuation step-up, token-spend
    volatility, review-heavy autonomy, and legal/compliance proof that still
    relies heavily on company or reviewer narration. The evidence supports real
    mitigation investment in routing, validation, and sovereign deployment, but
    public diligence still lacks primary compliance artifacts,
    customer-concentration data, and audited unit economics.
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      Factory's public posture improved materially in 2026, but the risk mix
      also sharpened. Company and independent coverage place Factory at a $5
      billion September 2026 valuation after an April 2026 $1.5 billion mark,
      with more than $400 million raised overall, which raises the execution bar
      well faster than public disclosure of ARR, burn, margin, or renewal
      durability. At the same time, reviewers consistently frame Factory as a
      token-metered, review-heavy operating model rather than a low-friction
      seat tool, so misuse can show up as spend creep, review drag, or weak ROI
      before product-market risk is the main issue. The heatmap and registers
      below therefore rank financial discipline, legal/compliance proof, and
      operating-model reliability above pure feature risk.
    claimRefs: [CR001, CR002, CR005, CR013, CR014]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: legal-and-assurance
    title: Legal, regulatory, and assurance exposure
    body: >-
      The legal and regulatory issue is less "Factory lacks controls" than
      "public proof is thinner than the enterprise positioning." Company and
      analyst-style sources describe air-gapped or on-prem deployments,
      automated security review, and a broad validation layer, but the assigned
      evidence still surfaces compliance through marketing or reviewer
      descriptions rather than primary certificates, trust-center exports,
      incident records, or regulator and court materials. That matters because
      AI-generated-code ownership, licensing, and derivative-work questions
      remain unsettled, and regulated buyers will want direct evidence that
      governance claims survive procurement, audit, and incident handling. Until
      that primary evidence is reviewed, the residual exposure is best treated
      as high for investment underwriting even if product mitigations are
      directionally credible.
    claimRefs: [CR008, CR009, CR010, CR015]
    tableRefs: [TR002]
  - id: operating-model-and-dependencies
    title: Operating-model and dependency risks
    body: >-
      Factory's multi-agent thesis is differentiated, but it adds coordination
      and dependency surface. Independent reviews say the coordinator pattern
      works best for disciplined ticketed workflows and stable repos, while
      trivial work or weak ticket hygiene can make the dispatch overhead feel
      expensive. The same reviews also argue that human merge authority remains
      necessary because long-running autonomy is still unreliable on non-trivial
      work. Model independence reduces single-vendor lock-in, yet it does not
      erase exposure to routing failures, external-model price moves, or
      integration outages across Jira, GitHub, Slack, and monitoring systems.
      In practice, this means Factory's risk profile resembles an engineering
      operating system: valuable when governed tightly, but operationally
      brittle if controls are thin.
    claimRefs: [CR003, CR006, CR007, CR011]
    tableRefs: [TR003]
  - id: commercial-and-financing
    title: Commercial and financing risk
    body: >-
      Commercial proof exists, but it is still skewed toward named logos and
      platform breadth rather than hard durability metrics. Public materials and
      reviews cite major enterprises such as Nvidia, Adobe, Palo Alto Networks,
      MongoDB, EY, and Zapier, yet the assigned evidence does not disclose
      concentration, contract length, renewal, gross margin, or burn. That
      leaves a classic late-stage software underwriting gap: investors can see
      brand-name adoption and rapid capital access, but not whether the revenue
      base is diversified, efficient, or durable enough to justify the step-up
      in price. Factory's own Router claims and validation workflow help the
      mitigation case, but without audited customer and unit-economics evidence,
      the thesis-break triggers remain measurable but unresolved.
    claimRefs: [CR001, CR004, CR005, CR012, CR014]
callouts:
  - calloutType: risk
    title: Public proof still trails valuation acceleration
    body: >-
      The September 2026 financing and $5 billion valuation show market
      confidence, but public evidence still does not disclose the customer,
      renewal, ARR, margin, and burn metrics needed to test whether that
      confidence is durable.
    claimRefs: [CR001, CR002, CR014]
  - calloutType: recommendation
    title: Underwrite governance before growth
    body: >-
      Diligence should prioritize primary compliance artifacts, incident
      handling records, token-spend controls, and customer-concentration data
      before relying on modeled upside from faster adoption.
    claimRefs: [CR004, CR005, CR015]
  - calloutType: assumption
    title: Model independence is a hedge, not an escape
    body: >-
      Factory's router and multi-model posture reduce single-vendor lock-in, but
      they add routing, integration, and assurance complexity that must be
      monitored like platform infrastructure risk.
    claimRefs: [CR003, CR011]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule / case / issue
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - ["AI-generated-code IP, licensing, and derivative-work uncertainty", "Multi-jurisdiction", "Public issue remains unsettled in assigned evidence", "Medium", "High", "Human review gates and customer-controlled deployment options reduce but do not remove liability.", "High", "Review customer indemnities, OSS policy, outside-counsel analysis, and insurer exclusions for generated code."]
      - ["Security/compliance proof for regulated deployments", "US, EU, and regulated sectors", "Company and reviewer claims are visible, but primary certificates and trust-center artifacts are not in the assigned evidence", "Medium", "High", "Factory highlights air-gapped, on-prem, and validation-layer controls.", "Medium-high", "Request SOC 2, ISO 42001, GDPR/DPA artifacts, audit scopes, and customer security questionnaires."]
      - ["Litigation, enforcement, and incident-record visibility gap", "US and EU", "Assigned evidence does not contain court, regulator, or incident-log materials, so absence cannot be proven", "Unknown", "Medium-high", "No source-backed mitigation beyond general product-control claims is visible here.", "High", "Run court/regulator searches, request incident register and major-customer security reviews, and inspect breach-notification procedures."]
    notes: Public severity ranking from the assigned prefetched evidence; "Unknown" means the source set does not establish a reliable rate, not that the risk is negligible.
    enumerationScope:
      coverage: partial
      basis: Severity-ranked legal and assurance risks synthesized from the assigned public source set dated 2026-01 through 2026-09.
    claimRefs: [CR009, CR010, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Code quality still depends on strong human review and CI discipline", "High", "High", "Medium", "High", "Need defect-escape, rollback, and post-merge quality metrics by customer cohort."]
      - ["Coordinator overhead can outweigh value on trivial or weakly specified work", "High", "Medium", "Medium", "Medium", "Need ticket-quality standards, cycle-time data, and downgrade rules for low-complexity tasks."]
      - ["Multi-model routing and external API complexity introduce failure modes", "Medium", "High", "Medium", "Medium-high", "Need router SLOs, fallback behavior, and outage history across supported models."]
      - ["Security-validation narrative is stronger than primary public audit evidence", "Medium", "High", "Medium", "High", "Need primary certificates, incident postmortems, and evidence that controls operate at customer scale."]
    notes: Qualitative risk levels reflect source-backed operating caveats and visible mitigations; residual exposure stays elevated where public proof is mostly narrative.
    claimRefs: [CR003, CR006, CR007, CR008, CR011, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - ["Frontier-model providers", "Claude, GPT, Gemini, and open-weight ecosystem", "Inference and routing substrate", "Not publicly quantified", "Model outage, price shock, policy change, or quality drift degrades delivery economics or reliability", "High", "Model-independent routing and Router optimization reduce single-provider lock-in.", "Medium-high"]
      - ["Workflow system integrations", "GitHub, GitLab, Jira, Linear, Slack, Sentry, PagerDuty, Notion", "Context, triggers, and handoffs", "High workflow dependence", "Integration failure or degraded metadata quality breaks coordinator context and task routing", "Medium-high", "Native integrations and knowledge indexing keep the platform close to existing systems.", "Medium"]
      - ["Enterprise customer base and capital market support", "Large named customers plus late-stage investors", "Revenue proof and financing support", "Commercial concentration is opaque", "A few large accounts slow expansion or renewal while valuation expectations stay elevated", "High", "Named logos, >$400M total funding, and spend-optimization features support the mitigation case.", "High"]
    notes: Concentration reflects what the assigned evidence explicitly discloses; where it is not quantified, residual exposure remains elevated rather than assumed away.
    claimRefs: [CR001, CR003, CR004, CR005, CR012, CR014]
