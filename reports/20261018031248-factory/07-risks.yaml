  evidenceGaps:
    - type: missing-source
      severity: material
      topic: assurance-proof-gap
      missingEvidence: Primary SOC 2 and ISO 42001 artifacts, DPA/privacy materials, customer security questionnaires, and any material incident register or postmortem history.
      whyItMatters: Regulated-deployment claims are central to the investment case, but public narrative alone does not prove audit scope, operating effectiveness, or incident handling maturity.
      diligencePath: Request the trust-center package, latest audit reports, redlined security questionnaire responses, and a list of security or availability incidents for the last 24 months.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001, TR002]
    - type: private-evidence-only
      severity: material
      topic: disclosure-gap
      missingEvidence: Customer concentration, NRR or renewal data, contract length, ARR, gross margin, burn, and token-cost-to-revenue efficiency metrics.
      whyItMatters: Without these numbers, investors cannot test whether logo quality and valuation momentum translate into diversified and efficient revenue.
      diligencePath: Request cohort revenue, top-customer concentration, renewal and expansion data, gross-margin bridge, and monthly burn versus committed runway.
      relatedQuestionRefs: [QR007, QR008]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
      topic: benchmark-opacity
      missingEvidence: Independent production-quality benchmarks, defect-escape rates, rollback rates, and customer-specific ROI evidence tied to merged output rather than demos.
      whyItMatters: Human-review-heavy autonomy can still look productive while moving defects or review cost downstream.
      diligencePath: Ask for customer references with before-and-after engineering metrics, defect and rollback data, and side-by-side trial results against incumbent tools.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR002]
    - type: stale
      severity: minor
      topic: funding-and-valuation
      missingEvidence: Post-financing disclosure showing how new capital changed hiring pace, go-to-market productivity, and cost controls after the September 2026 round.
      whyItMatters: A rapid valuation step-up is less risky if the new capital is already translating into durable operating metrics rather than just headline scale.
