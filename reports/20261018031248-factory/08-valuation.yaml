company:
  name: "Factory"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Factory's September 2026 $200 million raise at a $5 billion valuation confirms strong enterprise demand and market enthusiasm for autonomous software-development platforms, but public evidence still falls well short of what an outside investor would need to underwrite that price with conviction. The investable question is now price sensitivity rather than company legitimacy, so the supportable near-term call remains research-more with a stretched valuation stance until private diligence fills the revenue-quality, margin, retention, and financing-term gaps.
sections:
  - id: "investment-call"
    title: "The call is about price, not whether Factory is real"
    body: >-
      Factory has crossed the threshold from speculative concept to credible enterprise platform: public disclosures confirm a September 2026 step-up to a $5 billion valuation, a named roster of large customers, and continued financing support from blue-chip investors. That is enough to justify continued diligence. It is not enough to justify paying the current mark from public evidence alone. The same record that proves traction still omits disclosed absolute revenue, profitability, EV/Revenue, retention, and financing terms, so the recommendation has to stay explicitly price-sensitive. At today's disclosed valuation, the prudent stance is research-more rather than conviction buy.
    claimRefs: ["CV001", "CV002", "CV006", "CV009", "CV016"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "upside-support"
    title: "Why the upside case deserves serious diligence"
    body: >-
      The bullish case is not hard to articulate. Factory says it serves hundreds of thousands of developers at large enterprises, independent write-ups confirm a rapid valuation climb over the last year, and Sacra's March 2026 annualized revenue estimate implies the company had already moved beyond toy-scale experimentation before the latest round. Category investors are also paying for a view that software-delivery platforms can expand from code generation into review, testing, documentation, incident response, and broader operational workflows. If management can prove that the adoption signals translate into durable contracted ARR, clean gross margins, and strong expansion, Factory could still grow into an aggressive late-2026 mark.
    claimRefs: ["CV002", "CV007", "CV008", "CV009", "CV014"]
    tableRefs: ["TV002"]
  - id: "underwriting-gap"
    title: "What still blocks conviction underwriting"
    body: >-
      The anti-thesis is equally clear. Public sources do not disclose absolute revenue, profitability, or EV/Revenue for any round, and the best public revenue signal is still an external estimate layered on top of company-claimed acceleration. Meanwhile, Factory's own business model exposes investors to token and compute intensity: autonomous workloads can create real enterprise value, but they can also compress software margins when usage scales faster than routing efficiency. Independent reviews reinforce that caution by highlighting token-based pricing, weak spend predictability, and the need for human sign-off rather than autonomous ship-to-production. Those are all manageable issues in a well-priced round; they are harder to absorb at a $5 billion entry point.
    claimRefs: ["CV010", "CV011", "CV012", "CV013", "CV015", "CV016"]
  - id: "scenario-discipline"
    title: "What would move the valuation view"
    body: >-
      The public record supports scenario thinking, not false precision. A bull case exists if Factory's internal numbers validate substantially higher revenue scale than what is currently visible, if named customers are expanding rather than merely piloting, and if financing terms are clean enough that common-equity upside is not already overburdened by preferences. The base case is that the company is real, strategically relevant, and still too opaque to price confidently in public. The bear case is straightforward: if growth normalizes, model costs remain heavy, or the next financing discloses aggressive structure, the current mark can compress quickly toward prior private valuations. Until private diligence answers those points, entry discipline matters more than narrative momentum.
    claimRefs: ["CV004", "CV005", "CV006", "CV013", "CV016"]
    tableRefs: ["TV003"]
