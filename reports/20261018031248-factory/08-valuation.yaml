          value: "Fast revenue narrative"
          note: "Public evidence includes a March 2026 external revenue estimate and company-claimed acceleration."
        - id: "model"
          label: "Business model"
          value: "$20/mo entry plus token usage"
          note: "Consumption scales value, but it also introduces spend and margin volatility."
        - id: "markup"
          label: "Valuation reset"
          value: "$300M → $1.5B → $5B"
          note: "The mark-up outran the pace of new public fundamental disclosure."
        - id: "gap"
          label: "Underwriting gap"
          value: "No disclosed absolute revenue, profitability, EV/Revenue, or full terms"
          note: "The current public record cannot fully support the latest private price."
        - id: "call"
          label: "Recommendation"
          value: "research-more / stretched / high risk"
          note: "Proceed only with stronger private diligence or a better entry point."
      edges:
        - from: "proof"
          to: "growth"
          label: "supports interest"
        - from: "growth"
          to: "model"
          label: "raises scale question"
        - from: "model"
          to: "markup"
          label: "tempers premium"
        - from: "markup"
          to: "gap"
          label: "forces underwriting test"
        - from: "gap"
          to: "call"
          label: "drives current stance"
    approximationNotes: "This is an analytical decision flow, not a weighted scoring model."
    claimRefs: ["CV006", "CV007", "CV009", "CV011", "CV012", "CV016"]
callouts:
  - calloutType: "recommendation"
    title: "Factory may deserve a premium company narrative, but not a premium price on public evidence alone"
    body: "The strongest public evidence proves traction and investor enthusiasm; it does not yet prove enough absolute revenue quality, margin durability, or financing cleanliness to underwrite a $5 billion entry point with confidence."
    claimRefs: ["CV001", "CV012", "CV016"]
  - calloutType: "assumption"
    title: "The upside case depends on nonpublic diligence, not another public headline"
    body: "An upgrade from research-more would need management to open the hood on ARR, gross margin, retention, customer expansion, and preference terms rather than simply producing another valuation mark or product announcement."
    claimRefs: ["CV007", "CV009", "CV016"]
