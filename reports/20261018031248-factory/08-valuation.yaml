      - ["Risk rating", "high", "Rapid mark-up, margin exposure, and missing term detail widen downside if growth or market multiples soften."]
      - ["Valuation stance", "stretched", "The $5 billion mark outruns what the current public record can support on disclosed fundamentals."]
      - ["Decision implication", "price-sensitive follow-up only", "Advance only if private diligence proves ARR quality, gross margin, NRR, and a manageable preference stack."]
