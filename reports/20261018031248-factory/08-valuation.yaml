    title: "Thesis / anti-thesis table"
    columns:
      - "Side"
      - "Argument"
      - "What would change the view"
    rows:
      - ["Thesis", "Named enterprise customers and a large reported developer footprint suggest Factory has moved beyond experimental deployments.", "Independent customer references, expansion metrics, and concentration data would strengthen conviction."]
      - ["Thesis", "Successive financings and broad product scope imply Factory is being bought as software-delivery infrastructure, not just an IDE add-on.", "Board-ready ARR, gross margin, and retention data could make that infrastructure thesis financeable at a premium."]
      - ["Anti-thesis", "Public evidence still omits absolute revenue, profitability, EV/Revenue, and the latest round's financing structure.", "Audited revenue bridge, margin disclosure, and full financing terms would reduce underwriting uncertainty materially."]
      - ["Anti-thesis", "Token-priced autonomous workloads and category exuberance create meaningful multiple-compression risk if growth normalizes.", "A materially lower entry price or proof of durable unit economics would soften this concern."]
    notes: "The table separates support for the company from support for the current price; both matter in this chapter."
    claimRefs: ["CV009", "CV010", "CV012", "CV014", "CV016"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Private diligence proves revenue far above the March 2026 external estimate, strong expansion among named enterprises, and healthy gross margins despite heavy agent usage.", "No public valuation range is supportable; a premium entry could work only if confidential operating data validates durable growth and software-like economics.", "Execution slippage, customer concentration, and financing structure can still cap upside.", "Would require management to disclose strong ARR quality, NRR, and margin evidence."]
      - ["Base", "Factory is strategically relevant and still scaling fast, but the public record remains incomplete on revenue quality, profitability, and round terms.", "No defensible valuation range or target return can be calculated from the public evidence; the current mark needs nonpublic proof.", "Multiple compression, weak spend predictability, and opaque terms can all impair returns.", "Best fit with the current public evidence set."]
      - ["Bear", "Growth slows, model costs remain heavy, or a later financing reveals aggressive preferences or weak customer expansion.", "A down-round or return impairment becomes plausible, but the available evidence does not support a precise downside value.", "Down-round risk, liquidation overhang, and compressed public comp multiples.", "Would be triggered by weak diligence answers or macro AI-software multiple reset."]
    notes: "No numeric scenario range or target return is assigned because public evidence does not disclose ARR, profitability, NRR, burn, or a full cap-table."
    claimRefs: ["CV006", "CV007", "CV010", "CV012", "CV016"]
