- calloutType: insight
  title: This looks like a platform P&L, not a simple seat business
  body: Factory’s revenue logic appears to combine seat access, usage-linked compute, and high-control enterprise packaging, so margin quality will depend on routing efficiency and contract structure as much as on user growth.
  claimRefs:
