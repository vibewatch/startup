company:
  name: Factory
chapter:
  number: 4
  title: Financials
  summary: Factory’s public monetization surface is visible enough to map a hybrid seat-plus-usage enterprise model and to confirm major financing step-ups in 2026, but public evidence still does not disclose the revenue, margin, contract, or runway data needed for full underwriting. The chapter therefore leans on list pricing, reported growth proxies, and financing disclosures while treating revenue quality and capital adequacy as still only partially verified.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization
  body: 'Public evidence supports a hybrid monetization model rather than a simple per-seat SaaS story. Third-party pricing reviews in 2026 consistently described entry tiers at $20, $100, and $200 per month, while also stressing that meaningful usage carries additional token-based consumption and that larger teams move into custom Business and Enterprise contracts. Official company materials reinforce that Factory is selling a governable enterprise platform with dedicated compute, air-gapped deployment, and model-routing controls, which suggests higher-ACV packaging than an individual developer tool. What is still missing is realized pricing: none of the retained public sources disclose discounting, commit levels, implementation fees, or how much invoice growth comes from seats versus model consumption.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI010
  - CI015
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: cost-structure-and-unit-economics
  title: Cost structure and unit economics
  body: The strongest public clues on unit economics are directional, not underwritable. Factory and secondary coverage describe model routing as a cost-control lever, including a company claim that Router cut token spend by more than 60% while preserving performance, which would matter if inference is a major cost of goods sold. Reviews also describe sandboxed cloud environments, specialized droids, and enterprise governance controls, all of which imply meaningful infrastructure and support costs alongside model spend. However, the same public record stops short of disclosing recognized revenue, gross margin, CAC, payback, NRR, customer concentration, or services mix. That leaves public diligence able to explain the cost drivers and commercialization shape, but not to prove the underlying unit economics.
  claimRefs:
  - CI004
  - CI007
  - CI009
  - CI011
  - CI012
  - CI013
  - CI015
  - CI016
  tableRefs:
  - TI003
- id: capital-adequacy-and-underwriting-verdict
  title: Capital adequacy and underwriting verdict
  body: 'Factory’s financing momentum is clear in public sources: the company announced a $200 million round at a $5 billion valuation in September 2026, after the $150 million Series C at a $1.5 billion valuation in April, and said total funding now exceeds $400 million. That step-up likely reduces immediate financing pressure and gives management room to keep funding research, product, and go-to-market expansion. But financing history is not the same as capital adequacy. The retained sources do not disclose current cash, monthly burn, runway, debt obligations, or the contract-quality metrics that would show whether fresh capital buys durable operating leverage or merely funds continued growth-at-any-cost. The financial verdict is therefore mixed: the company has real financing access and visible enterprise demand, but public evidence remains too thin on revenue quality, margin conversion, and runway to clear underwriting diligence.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI012
  - CI013
  - CI014
  - CI016
tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Individual subscriptions
    - Self-serve access to Pro / Plus / Max plans
    - Per user per month plus usage allowance
    - $20 / $100 / $200 public list prices in 2026
    - List pricing is corroborated by third-party reviews, but realized ASP is not disclosed.
    - Provide active paid users by tier, discount policy, and realized ASP by cohort.
  - - Business / Enterprise contracts
    - Custom seat, governance, and deployment package for teams
    - Custom contract / seat and platform bundle
    - Business and Enterprise described as contact-sales products with higher-control features
    - Packaging is public; ACV, contract length, and pilot-to-production conversion are not.
    - Provide ACV distribution, contract term, renewal rate, and implementation scope by segment.
  - - Usage-linked model consumption
    - Token-based agent usage and per-model weighting on top of seat access
    - Usage-weighted compute consumption
    - Public reviews say invoices rise with token consumption and model mix
    - Mechanism is public, but effective take rate and gross margin are undisclosed.
    - Provide customer-level usage, effective price per token-equivalent, and gross margin by model mix.
  - - Enterprise deployment / control add-ons
    - Dedicated compute, on-prem, air-gapped, support, and governance controls
    - Custom enterprise add-on / platform fee
    - Public packaging shows these controls as higher-tier capabilities
    - Supports an enterprise-platform narrative, but attach rate and margin contribution are unknown.
    - Provide attach rates, support burden, and margin contribution for deployment and governance add-ons.
  notes: Mixes public list pricing, packaging descriptions, and inferred invoice mechanics; realized pricing, attach rates, and accounting treatment are not publicly disclosed.
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI015
- id: TI002
  title: Pricing / monetization table
  columns:
  - Plan / surface
  - Price / contract
  - Publicly described packaging
  - What remains unknown
  rows:
  - - Pro
    - $20/mo
    - Desktop / CLI / SDK access and base usage allowance
    - Usage caps, overage economics, and realized net price after promotions or discounts.
  - - Plus
    - $100/mo
    - Roughly 5x usage plus Droid Computers
    - Incremental margin after extra compute and how many customers actually upgrade.
  - - Max
    - $200/mo
    - Roughly 10x usage and early access features
    - Whether the plan behaves like a margin-positive power-user tier or a subsidized expansion path.
  - - Business
    - Contact sales
    - Up to 150 members plus SSO / SAML / SCIM and audit controls
    - Seat minimums, services content, implementation fees, and average contract duration.
  - - Enterprise
    - Contact sales
    - Unlimited members, dedicated compute, on-prem deployment, customer-managed encryption, SLAs
    - ACV, multi-year commit levels, support intensity, and revenue-recognition profile.
  notes: All prices are public list or reviewer-reported values from 2026 snapshots; none of the retained sources disclose realized pricing, discounting, or revenue recognition.
  claimRefs:
  - CI006
  - CI007
  - CI008
- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue scale proxy
    - ~$60M annualized by March 2026, according to third-party reporting; recognized revenue undisclosed
    - medium
    - Shows commercial traction if accurate, but does not establish booked or recognized revenue quality.
    - Provide monthly recurring / recognized revenue bridge and accounting policy by revenue stream.
  - - Growth cadence
    - Revenue reportedly doubled month-over-month for six consecutive months into spring 2026
    - medium
    - Explains valuation step-up, but needs cohort and retention proof to be trusted.
    - Provide cohort retention, expansion, and customer-count bridge supporting the reported growth.
  - - List-pricing realization
    - null
    - low
    - List price does not show discounting, commit levels, or expansion behavior.
    - Provide realized ASP, contract mix, and discount bands by tier.
  - - Gross margin
    - null
    - low
    - Needed to judge whether seat and usage growth converts into durable profit.
    - Provide gross margin by deployment type and by model-routing mix.
  - - Token-spend efficiency lever
    - '>60% token-spend reduction from Router (company-claimed)'
    - medium
    - Potentially important gross-margin and customer-ROI lever if borne out in production.
    - Provide before/after token cost data and customer-level realized savings.
  - - CAC / payback
    - null
    - low
    - Critical for testing whether aggressive GTM expansion is efficient.
    - Provide fully loaded CAC, payback, win rates, and segment split.
  - - Cash / burn / runway
    - null
    - low
    - Fresh financing does not prove capital sufficiency without cash and burn disclosure.
    - Provide cash balance, monthly burn, runway, and any debt or project-finance obligations.
  - - Customer concentration / contract quality
    - null
    - low
    - Named logos do not reveal whether revenue is concentrated, piloted, or durable.
    - Provide top-10 concentration, NRR, pilot-to-production conversion, and contract term distribution.
  notes: Null values mark metrics not disclosed in the retained public sources; the non-null growth entries are third-party reported rather than audited company financials.
