evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Board-ready ARR, recognized revenue, gross margin, burn, runway, and current headcount.
    whyItMatters: >-
      These metrics are necessary to evaluate whether the September 2026 $5 billion valuation is supported by underlying
      business performance.
    diligencePath: Request the latest board deck, KPI pack, and hiring / headcount report tied to the September 2026 financing.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A current executive roster, board composition, committee structure, and any founder-specific control rights.
    whyItMatters: >-
      Without a verified leadership and board map, diligence cannot test succession risk, governance quality, or
      concentrated decision rights.
    diligencePath: >-
      Obtain the latest board materials, cap table, and an official leadership page or financing memo that names current
      executives and directors.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: >-
      Full cap-table detail, secondary transactions, debt / credit facilities, and customer concentration by ARR or
      contract value.
    whyItMatters: >-
      Publicly named investors and logo customers are not enough to assess control rights, preference stack, or revenue
      concentration risk.
    diligencePath: Request the capitalization table, financing documents, debt schedule, and top-customer cohort report.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent TAM/SAM/SOM studies or internal segment data tying buyer segments to paid seats, ACV, or usage
      conversion.
    whyItMatters: >-
      Without segment spend and conversion data, the chapter can describe the market shape but cannot underwrite the
      reachable market or expansion efficiency.
    diligencePath: >-
      Request cohort-level customer counts, paid-seat distribution, ACV by segment, and any board or investor
      market-sizing materials.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: pricing-entry
    missingEvidence: >-
      A first-party pricing page or quote that explicitly states whether any BYOK or zero-dollar entry path is still
      available.
    whyItMatters: >-
      Bottom-of-funnel entry terms affect how easily Factory can seed pilots before asking for team or enterprise
      budgets.
    diligencePath: >-
      Capture the current official pricing page, sales quote template, or product documentation that reconciles free,
      BYOK, and metered usage terms.
    relatedQuestionRefs:
      - QM003
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Signed enterprise price cards, overage mechanics, token-burn ranges by workflow, and common discount structures
      for Factory and close peers.
    whyItMatters: >-
      List prices do not show what large customers really pay or whether workflow automation produces economic leverage
      after usage charges.
    diligencePath: Request anonymized order forms or pilot invoices from Factory and at least two peer vendors.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: multi-homing-and-switching
    missingEvidence: >-
      Customer evidence on seat overlap, tool replacement versus augmentation, renewal behavior, and migrations into or
      away from Factory.
    whyItMatters: >-
      Competitive durability depends on whether buyers consolidate onto Factory or simply layer it beside existing
      assistants and internal tooling.
    diligencePath: Ask reference customers for deployment architecture, seat overlap, and renewal narratives.
  - type: missing-source
    severity: material
    topic: benchmark-outcomes
    missingEvidence: >-
      A buyer-side benchmark or controlled pilot comparing code quality, review overhead, and delivery speed across
      Factory, Cursor, Devin, Copilot, and internal build.
    whyItMatters: The assigned evidence supports positioning claims but not objective superiority on output quality or ROI.
    diligencePath: Run the same ticket set through multiple tools and measure security findings, human rework, and cycle time.
  - type: missing-source
    severity: material
    topic: recognized-revenue-and-gross-margin
    missingEvidence: Monthly recognized revenue, ARR, gross margin, and revenue-recognition policy by stream.
    whyItMatters: List pricing and reported growth do not show whether Factory converts demand into durable, high-margin revenue.
    diligencePath: >-
      Request board or lender reporting with monthly revenue bridge, gross margin by deployment type, and accounting
      treatment for usage and services.
    relatedQuestionRefs:
      - QI003
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-and-contract-quality
    missingEvidence: CAC, payback, win rates, ACV distribution, pilot-to-production conversion, NRR, and customer concentration.
    whyItMatters: >-
      The company may have fast logo growth without efficient acquisition or durable expansion, which would change
      underwriting sharply.
    diligencePath: Request cohort-level pipeline and renewal data plus top-customer concentration and contract-term schedules.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Current cash balance, monthly burn, runway, and any debt or project-finance obligations.
    whyItMatters: Fresh funding does not prove capital adequacy without knowing how quickly the business consumes cash.
    diligencePath: Request treasury snapshot, budget-versus-actual burn, runway sensitivity, and financing covenant package.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: pricing-realization-and-model-cost-mix
    missingEvidence: Realized ASP, discount schedules, overage economics, and per-model cost/revenue mix.
    whyItMatters: Public list pricing reveals packaging but not whether usage-heavy customers are attractive or dilutive.
    diligencePath: Request sampled invoices or pricing schedules with realized usage charges and model-routing cost waterfall.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer-signal proxy such as repository activity package downloads forum traffic or equivalent
      practitioner telemetry for Factory.
    whyItMatters: >-
      The chapter cannot benchmark grassroots technical adoption or bottoms-up engagement without some community or
      usage signal outside named customers.
    diligencePath: >-
      Request internal telemetry or public community evidence that quantifies active technical users repeat usage by
      surface and adoption outside flagship enterprise accounts.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Task-level success rollback escalation and human-override rates by droid role deployment mode or customer cohort.
    whyItMatters: >-
      Named customers and case studies show demand but do not show whether the orchestration loop is reliably correct in
      production.
    diligencePath: >-
      Ask for cohort metrics covering acceptance rates rollback rates incident auto-resolution precision and SLA
      adherence for real enterprise deployments.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: compliance-scope
    missingEvidence: >-
      Certificate copies or trust-center artifacts that show the scope and recency of SOC 2 ISO 42001 GDPR Zero Data
      Retention and air-gapped controls.
    whyItMatters: >-
      Security and sovereign-deployment language is central to the product pitch and buyers need scope boundaries rather
      than a feature checklist.
    diligencePath: >-
      Request current trust-center documents scope statements pen-test summaries and deployment diagrams for the exact
      enterprise tier being evaluated.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: Net revenue retention, gross retention, churn, renewal rates, and contract length by customer cohort.
    whyItMatters: >-
      These metrics are required to distinguish logo acquisition from durable recurring revenue and to underwrite
      expansion quality.
    diligencePath: >-
      Request cohort retention tables, renewal summaries, and standard contract-term examples from management or
      existing investors.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer revenue mix, sector exposure, public-sector versus commercial split, and any partner- or
      marketplace-led concentration.
    whyItMatters: >-
      A few very large enterprise accounts could explain the logo set while leaving the revenue base concentrated and
      expansion-sensitive.
    diligencePath: >-
      Request the top-10 customer concentration table, ARR by sector, and channel mix for direct versus partner-sourced
      contracts.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      More customer-authored case studies or procurement records that show scope, start date, and measured outcomes for
      named deployments.
    whyItMatters: >-
      The current named-customer table proves market resonance, but much of it is still logo-level proof rather than
      independently described production usage.
    diligencePath: >-
      Collect customer-authored case studies, conference talks, or procurement records for the logos already named in
      public sources.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: assurance-proof-gap
    missingEvidence: >-
      Primary SOC 2 and ISO 42001 artifacts, DPA/privacy materials, customer security questionnaires, and any material
      incident register or postmortem history.
    whyItMatters: >-
      Regulated-deployment claims are central to the investment case, but public narrative alone does not prove audit
      scope, operating effectiveness, or incident handling maturity.
    diligencePath: >-
      Request the trust-center package, latest audit reports, redlined security questionnaire responses, and a list of
      security or availability incidents for the last 24 months.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: disclosure-gap
    missingEvidence: >-
      Customer concentration, NRR or renewal data, contract length, ARR, gross margin, burn, and token-cost-to-revenue
      efficiency metrics.
    whyItMatters: >-
      Without these numbers, investors cannot test whether logo quality and valuation momentum translate into
      diversified and efficient revenue.
    diligencePath: >-
      Request cohort revenue, top-customer concentration, renewal and expansion data, gross-margin bridge, and monthly
      burn versus committed runway.
    relatedQuestionRefs:
      - QR007
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: benchmark-opacity
    missingEvidence: >-
      Independent production-quality benchmarks, defect-escape rates, rollback rates, and customer-specific ROI evidence
      tied to merged output rather than demos.
    whyItMatters: Human-review-heavy autonomy can still look productive while moving defects or review cost downstream.
    diligencePath: >-
      Ask for customer references with before-and-after engineering metrics, defect and rollback data, and side-by-side
      trial results against incumbent tools.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR002
  - type: stale
    severity: minor
    topic: funding-and-valuation
    missingEvidence: >-
      Post-financing disclosure showing how new capital changed hiring pace, go-to-market productivity, and cost
      controls after the September 2026 round.
    whyItMatters: >-
      A rapid valuation step-up is less risky if the new capital is already translating into durable operating metrics
      rather than just headline scale.
    diligencePath: >-
      Request board KPI packs from the two quarters after the round, including hiring efficiency, token-cost trends, and
      pipeline-to-revenue conversion.
    relatedQuestionRefs:
      - QR006
      - QR008
  - type: private-evidence-only
    severity: material
    topic: financing terms
    missingEvidence: Full cap-table, liquidation preferences, investor rights, and any side-letter economics behind the latest round.
    whyItMatters: >-
      A strong business can still produce weak common-equity outcomes if the preference stack or governance structure is
      investor-unfriendly.
    diligencePath: Request the latest financing documents, cap table, and board-rights summary during management diligence.
    relatedQuestionRefs:
      - QV007
      - QV008
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Board-ready ARR, recognized revenue, gross margin, burn, runway, NRR, and cohort expansion data.
    whyItMatters: >-
      The current valuation can only be judged fairly if the company can prove both scale and quality of revenue under
      autonomous-workload cost pressure.
    diligencePath: >-
      Request monthly management reporting and a revenue-quality bridge tying bookings, ARR, recognized revenue, and
      gross margin.
    relatedQuestionRefs:
      - QV002
      - QV008
  - type: missing-source
    severity: material
    topic: customer expansion proof
    missingEvidence: Independent customer references or documented expansion metrics across named enterprise accounts.
    whyItMatters: >-
      The upside case depends on proving that adoption is expanding inside large customers rather than remaining
      headline-level proof points.
    diligencePath: Ask for two to three reference calls plus anonymized account-level expansion, usage, and churn data.
    relatedQuestionRefs:
      - QV003
      - QV008
