      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Factory’s financing momentum is clear in public sources: the company announced a $200 million round at a
              $5 billion valuation in September 2026, after the $150 million Series C at a $1.5 billion valuation in
              April, and said total funding now exceeds $400 million. That step-up likely reduces immediate financing
              pressure and gives management room to keep funding research, product, and go-to-market expansion. But
              financing history is not the same as capital adequacy. The retained sources do not disclose current cash,
              monthly burn, runway, debt obligations, or the contract-quality metrics that would show whether fresh
              capital buys durable operating leverage or merely funds continued growth-at-any-cost. The financial
              verdict is therefore mixed: the company has real financing access and visible enterprise demand, but
              public evidence remains too thin on revenue quality, margin conversion, and runway to clear underwriting
              diligence.
