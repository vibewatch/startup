        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The strongest public clues on unit economics are directional, not underwritable. Factory and secondary
              coverage describe model routing as a cost-control lever, including a company claim that Router cut token
              spend by more than 60% while preserving performance, which would matter if inference is a major cost of
              goods sold. Reviews also describe sandboxed cloud environments, specialized droids, and enterprise
              governance controls, all of which imply meaningful infrastructure and support costs alongside model spend.
              However, the same public record stops short of disclosing recognized revenue, gross margin, CAC, payback,
              NRR, customer concentration, or services mix. That leaves public diligence able to explain the cost
              drivers and commercialization shape, but not to prove the underlying unit economics.
