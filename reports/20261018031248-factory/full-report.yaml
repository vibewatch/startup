      - number: '5.3'
        title: Differentiation and technical risks
        blocks:
          - type: paragraph
            body: >-
              Factory's differentiation is strongest where enterprise buyers care about coordination and control:
              multi-agent role separation, ticket-system entry points, and sovereign deployment options all show up
              repeatedly across the evidence set. The main product risk is that public proof still skews toward company,
              investor, and favorable-review narratives rather than audited operating data, so diligence has to focus on
              whether real customer environments achieve reliable review quality, acceptable rollback rates, and usable
              security controls at scale. Independent reviewers also warn that the coordinator model carries friction
              when tickets are weak or tasks are too trivial to justify orchestration overhead. In other words, Factory
