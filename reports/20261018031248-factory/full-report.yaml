              - CO004
              - CO006
              - CO008
              - CO009
      - number: '1.4'
        title: Milestone velocity and open questions
        blocks:
          - type: paragraph
            body: >
              Factory’s 2026 product cadence is easier to verify than its financial disclosure. The official product
              feed documents launches across analytics, desktop, QA, routing, security review, incident response,
              AutoWiki, and Agent Effectiveness, while the September financing announcement ties those launches to a
              broader “software factory” thesis. Independent reviews also sharpen the operating caveat: Factory appears
              most credible when customers have disciplined ticketing, integration, and governance processes, but
              coordination overhead and token-based spending become practical drawbacks for smaller teams or
              low-complexity work. The result is a company with strong momentum and product breadth, but one whose
              commercial efficiency and governance quality still require direct diligence rather than extrapolation from
              launch velocity.
            claimRefs:
