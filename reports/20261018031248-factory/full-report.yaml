      - number: '1.3'
        title: Funding, scale, and stakeholder picture
        blocks:
          - type: paragraph
            body: >
              Public financing evidence shows two major 2026 valuation marks. Beri reported the April 2026 Series C at
              $150 million and a $1.5 billion valuation, while the September 2026 company announcement and independent
              coverage reported a further $200 million financing at a $5 billion valuation that lifted total funding to
              over $400 million. The September announcement named a broad investor syndicate, but DevOps explicitly
              noted that the company did not identify the round as a Series D or specify whether the $5 billion mark was
              pre-money or post-money. Public scale signals are also asymmetric: Factory claims hundreds of thousands of
              developers and multiple blue-chip customers, and independent articles repeat named enterprise adopters,
              yet revenue, ARR, headcount, contract terms, and cap-table detail remain undisclosed in the assigned pool.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
              - CO012
