        title: Founders, leadership, and governance exposure
        blocks:
          - type: paragraph
            body: >
              The current public record in the assigned pool is founder-centric. Independent reporting and reviews
              consistently identify Matan Grinberg and Eno Reyes as the founders, with DevOps adding the most concrete
              background detail: Grinberg was pursuing a physics Ph.D. at UC Berkeley and Reyes was working as a
              machine-learning engineer when they connected and built the first demo. That supports credible
              founder-market fit around technical depth and product vision, but it does not substitute for a verified
              executive roster or board map. Because the available evidence centers so tightly on the founders and
              product narrative, governance opacity and key-person dependence remain material diligence issues rather
              than resolved company facts.
