chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >
              Factory presents itself as an agent-native software-development platform rather than a point coding
              assistant, with Droids spanning coding, review, testing, documentation, incident response, and deployment
              workflows. The strongest corroborated positioning evidence is consistent across the company announcement,
              independent September 2026 reporting, and third-party reviews: Factory is selling a full-stack enterprise
              software-delivery system with model routing and deployment flexibility across cloud, self-hosted, and
              fully air-gapped environments. That positioning supports a one-line business model of enterprise software
              sold around autonomous development workflows, but the assigned source pool does not verify a current
              headquarters city, so the chapter keeps that identity field as an explicit gap rather than reusing earlier
              background.
            claimRefs:
              - CO001
              - CO002
              - CO012
              - CO013
