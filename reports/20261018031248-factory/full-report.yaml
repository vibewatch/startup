              2026 financing post says customers include Nvidia, Blackstone, Royal Bank of Canada, Palo Alto Networks,
              Adobe, and T-Mobile, and that Factory is used by "hundreds of thousands of developers." Independent
              September 2026 coverage adds a June 2026 production-customer list that includes NVIDIA, Adobe, EY, Palo
              Alto Networks, Adyen, Blackstone, Wipro, and Comarch, plus one specific 2,700-seat deployment across 400
              microservices. That is meaningful evidence of production usage, but much of the named proof is still
              company-issued or recap-style reporting rather than customer-authored case studies with contract scope,
              renewal history, or budget detail. The public record therefore supports real enterprise adoption without
              fully underwriting how broad or sticky that adoption is.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU008
              - CU010
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU008
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU012
              - CU013
      - number: '6.3'
        title: Durability, expansion, and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The biggest diligence gap is not whether Factory can win logos; it is whether those logos convert into
              durable, diversified contracts. Public sources still do not disclose NRR, GRR, churn, renewal rates,
              contract length, or customer concentration, and even favorable third-party reviews describe the product as
              something teams should pilot on stable codebases before broader rollout. Makerstack also notes that
              billing layers token usage on top of seat prices, which makes budgeting less predictable than flat
              subscriptions and creates another friction point for expansion. Taken together, the evidence supports a
              pilot-to-production motion with credible enterprise fit, but not a clean read on renewal quality,
              land-and-expand depth, or exposure to a handful of very large accounts.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named enterprise proof is above average for this category
            body: >-
              Factory's public customer evidence is stronger than many agentic-coding startups: it has repeated named
              references, a current official customer set, and one specific large-scale deployment example.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU006
          - type: callout
            title: Durability still rests on inference, not disclosed customer economics
            body: >-
              The chapter can support real adoption, but not the renewal quality of that adoption: public sources do not
              disclose NRR, churn, contract length, or top-customer concentration.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              Factory's public posture improved materially in 2026, but the risk mix also sharpened. Company and
              independent coverage place Factory at a $5 billion September 2026 valuation after an April 2026 $1.5
              billion mark, with more than $400 million raised overall, which raises the execution bar well faster than
              public disclosure of ARR, burn, margin, or renewal durability. At the same time, reviewers consistently
              frame Factory as a token-metered, review-heavy operating model rather than a low-friction seat tool, so
              misuse can show up as spend creep, review drag, or weak ROI before product-market risk is the main issue.
              The heatmap and registers below therefore rank financial discipline, legal/compliance proof, and
              operating-model reliability above pure feature risk.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR009
              - CR010
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR011
              - CR014
              - CR015
      - number: '7.2'
        title: Legal, regulatory, and assurance exposure
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory issue is less "Factory lacks controls" than "public proof is thinner than the
              enterprise positioning." Company and analyst-style sources describe air-gapped or on-prem deployments,
              automated security review, and a broad validation layer, but the assigned evidence still surfaces
              compliance through marketing or reviewer descriptions rather than primary certificates, trust-center
              exports, incident records, or regulator and court materials. That matters because AI-generated-code
              ownership, licensing, and derivative-work questions remain unsettled, and regulated buyers will want
              direct evidence that governance claims survive procurement, audit, and incident handling. Until that
              primary evidence is reviewed, the residual exposure is best treated as high for investment underwriting
              even if product mitigations are directionally credible.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR011
              - CR015
      - number: '7.3'
        title: Operating-model and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Factory's multi-agent thesis is differentiated, but it adds coordination and dependency surface.
              Independent reviews say the coordinator pattern works best for disciplined ticketed workflows and stable
              repos, while trivial work or weak ticket hygiene can make the dispatch overhead feel expensive. The same
              reviews also argue that human merge authority remains necessary because long-running autonomy is still
              unreliable on non-trivial work. Model independence reduces single-vendor lock-in, yet it does not erase
              exposure to routing failures, external-model price moves, or integration outages across Jira, GitHub,
              Slack, and monitoring systems. In practice, this means Factory's risk profile resembles an engineering
              operating system: valuable when governed tightly, but operationally brittle if controls are thin.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR012
              - CR014
      - number: '7.4'
        title: Commercial and financing risk
        blocks:
          - type: paragraph
            body: >-
              Commercial proof exists, but it is still skewed toward named logos and platform breadth rather than hard
              durability metrics. Public materials and reviews cite major enterprises such as Nvidia, Adobe, Palo Alto
              Networks, MongoDB, EY, and Zapier, yet the assigned evidence does not disclose concentration, contract
              length, renewal, gross margin, or burn. That leaves a classic late-stage software underwriting gap:
              investors can see brand-name adoption and rapid capital access, but not whether the revenue base is
              diversified, efficient, or durable enough to justify the step-up in price. Factory's own Router claims and
              validation workflow help the mitigation case, but without audited customer and unit-economics evidence,
              the thesis-break triggers remain measurable but unresolved.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public proof still trails valuation acceleration
            body: >-
              The September 2026 financing and $5 billion valuation show market confidence, but public evidence still
              does not disclose the customer, renewal, ARR, margin, and burn metrics needed to test whether that
              confidence is durable.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR014
          - type: callout
            title: Underwrite governance before growth
            body: >-
              Diligence should prioritize primary compliance artifacts, incident handling records, token-spend controls,
              and customer-concentration data before relying on modeled upside from faster adoption.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR015
          - type: callout
            title: Model independence is a hedge, not an escape
            body: >-
              Factory's router and multi-model posture reduce single-vendor lock-in, but they add routing, integration,
              and assurance complexity that must be monitored like platform infrastructure risk.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The call is about price, not whether Factory is real
        blocks:
          - type: paragraph
            body: >-
              Factory has crossed the threshold from speculative concept to credible enterprise platform: public
              disclosures confirm a September 2026 step-up to a $5 billion valuation, a named roster of large customers,
              and continued financing support from blue-chip investors. That is enough to justify continued diligence.
              It is not enough to justify paying the current mark from public evidence alone. The same record that
              proves traction still omits disclosed absolute revenue, profitability, EV/Revenue, retention, and
              financing terms, so the recommendation has to stay explicitly price-sensitive. At today's disclosed
              valuation, the prudent stance is research-more rather than conviction buy.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV009
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
              - CV016
      - number: '8.2'
        title: Why the upside case deserves serious diligence
        blocks:
          - type: paragraph
            body: >-
              The bullish case is not hard to articulate. Factory says it serves hundreds of thousands of developers at
              large enterprises, independent write-ups confirm a rapid valuation climb over the last year, and Sacra's
              March 2026 annualized revenue estimate implies the company had already moved beyond toy-scale
              experimentation before the latest round. Category investors are also paying for a view that
              software-delivery platforms can expand from code generation into review, testing, documentation, incident
              response, and broader operational workflows. If management can prove that the adoption signals translate
              into durable contracted ARR, clean gross margins, and strong expansion, Factory could still grow into an
              aggressive late-2026 mark.
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV010
              - CV012
              - CV014
              - CV016
      - number: '8.3'
        title: What still blocks conviction underwriting
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is equally clear. Public sources do not disclose absolute revenue, profitability, or
              EV/Revenue for any round, and the best public revenue signal is still an external estimate layered on top
              of company-claimed acceleration. Meanwhile, Factory's own business model exposes investors to token and
              compute intensity: autonomous workloads can create real enterprise value, but they can also compress
              software margins when usage scales faster than routing efficiency. Independent reviews reinforce that
              caution by highlighting token-based pricing, weak spend predictability, and the need for human sign-off
              rather than autonomous ship-to-production. Those are all manageable issues in a well-priced round; they
              are harder to absorb at a $5 billion entry point.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: What would move the valuation view
        blocks:
          - type: paragraph
            body: >-
              The public record supports scenario thinking, not false precision. A bull case exists if Factory's
              internal numbers validate substantially higher revenue scale than what is currently visible, if named
              customers are expanding rather than merely piloting, and if financing terms are clean enough that
              common-equity upside is not already overburdened by preferences. The base case is that the company is
              real, strategically relevant, and still too opaque to price confidently in public. The bear case is
              straightforward: if growth normalizes, model costs remain heavy, or the next financing discloses
              aggressive structure, the current mark can compress quickly toward prior private valuations. Until private
              diligence answers those points, entry discipline matters more than narrative momentum.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV012
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Factory may deserve a premium company narrative, but not a premium price on public evidence alone
            body: >-
              The strongest public evidence proves traction and investor enthusiasm; it does not yet prove enough
              absolute revenue quality, margin durability, or financing cleanliness to underwrite a $5 billion entry
              point with confidence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV016
          - type: callout
            title: The upside case depends on nonpublic diligence, not another public headline
            body: >-
              An upgrade from research-more would need management to open the hood on ARR, gross margin, retention,
              customer expansion, and preference terms rather than simply producing another valuation mark or product
              announcement.
            calloutType: assumption
            claimRefs:
              - CV007
              - CV009
              - CV016
