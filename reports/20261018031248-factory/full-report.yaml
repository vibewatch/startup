              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a hybrid monetization model rather than a simple per-seat SaaS story. Third-party
              pricing reviews in 2026 consistently described entry tiers at $20, $100, and $200 per month, while also
              stressing that meaningful usage carries additional token-based consumption and that larger teams move into
              custom Business and Enterprise contracts. Official company materials reinforce that Factory is selling a
              governable enterprise platform with dedicated compute, air-gapped deployment, and model-routing controls,
              which suggests higher-ACV packaging than an individual developer tool. What is still missing is realized
              pricing: none of the retained public sources disclose discounting, commit levels, implementation fees, or
              how much invoice growth comes from seats versus model consumption.
