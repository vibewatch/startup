  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              Factory is publicly positioned as a "software factory" rather than a narrow IDE copilot, with the core
              workflow centered on delegating scoped engineering work to specialized Droids across the software
              development lifecycle. Official and reviewer materials align on the user-facing surfaces: Desktop, CLI,
              SDK, and ticket- or chat-triggered workflows that pull context from systems such as Linear, Jira, Slack,
              GitHub, and documentation tools. That makes the product easier to place in enterprise engineering
              operations than in individual-developer toolchains, and it also explains why commercial packaging is a mix
              of seat tiers and usage-sensitive agent execution rather than a flat editor subscription. The net effect
              is a product that appears purpose-built for managed, reviewable delivery work inside existing operating
              systems for software teams, not for lightweight autocomplete or one-off personal coding tasks.
            claimRefs:
