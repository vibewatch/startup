  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Factory's market boundary is governed SDLC automation, not editor autocomplete
        blocks:
          - type: paragraph
            body: >-
              The assigned sources consistently frame Factory as a platform for autonomous or agent-native software
              development across the software delivery lifecycle, not as a narrow code-completion widget. Official pages
              and independent reviews emphasize planning, coding, testing, review, incident response, documentation, and
              deployment support across desktop, terminal, web, Slack, and CI/CD, which pushes the relevant spend pool
              beyond assistant seats toward a broader 'software factory' control plane. That framing matters because the
              closest substitutes are not only GitHub Copilot-style tools, but also manual ticket-to-PR workflows,
              fragmented point tools for review and reliability, and internal platform-engineering processes that
              already own governance and release quality.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
      - number: '2.2'
        title: The buyer path moves from developer experimentation into platform, security, and enterprise budgets
        blocks:
          - type: paragraph
            body: >-
              Factory's commercial and deployment packaging implies a classic bottoms-up-to-enterprise motion. Public
              list pricing starts with individual and small-team tiers, but the higher-value surfaces are the quoted
              Business and Enterprise offers that bundle SSO, SCIM, audit logging, zero-data-retention, dedicated
              compute, on-premise deployment, and data residency. Those controls shift the economic buyer away from an
              individual developer and toward engineering leadership, platform teams, security, procurement, and
              regulated-environment stakeholders. Adoption also appears to depend on existing workflow maturity:
              multiple reviews say the product works best when teams already run disciplined ticketing, code review, and
              CI/CD processes, while cost predictability and review overhead remain material friction for lighter-weight
              teams.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM013
              - CM014
