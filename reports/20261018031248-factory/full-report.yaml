        title: Architecture, deployment, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Public evidence describes Factory as an orchestration stack with a coordinator or Missions layer on top of
              role-scoped execution Droids, plus a knowledge or memory layer that carries forward repo and
              organizational context between tasks. Official materials also show meaningful deployment and control
              breadth: SaaS, on-premises, and air-gapped environments are all explicitly named, while enterprise plan
              materials enumerate admin controls, auditability, identity integration, and data-handling features.
              Freshness evidence is also credible: the 2026 product timeline publicly references Factory 2.0, Factory
              Router, Agent Effectiveness, Droid Computers, and Desktop-app releases, which suggests the product is
              still expanding beyond a static launch configuration. What remains missing is the technical denominator
              behind those claims: public sources do not show latency, recovery, or role-level success metrics for the
              orchestration loop.
