      - number: '2.3'
        title: The market is attractive, but the evidence supports sizing by constrained lenses instead of a generic TAM
        blocks:
          - type: paragraph
            body: >-
              The strongest growth signals in the assigned pool are categorical rather than fully quantifiable: the
              company says hundreds of thousands of developers already use Factory, independent reviewers place it with
              enterprise engineering organizations and complex codebases, and commentary around the September 2026
              financing round describes a shift from single-user copilots toward continuously operating software
              factories. Public product releases such as Router, Agent Effectiveness, AutoWiki, incident response,
              automated security review, and QA further suggest the company is widening the spend envelope from code
              generation into workflow orchestration and measurable ROI. Even so, the evidence stops short of an
              investable TAM/SAM/SOM because there is no independent seat count, conversion funnel, ARR disclosure, or
              segment-level spend decomposition in the assigned pool.
            claimRefs:
