      nodes:
        - id: users
          label: Consumer attention
          detail: "Public user estimates vary by period and source; current cohort data unavailable."
        - id: inventory
          label: News inventory and pageviews
          detail: "Inline, video, and SmartView formats are described in assigned reporting."
        - id: ads
          label: Advertising sales
          detail: "Described as the main revenue source; realized yield and take rate undisclosed."
        - id: publisher-share
          label: Publisher revenue share
          detail: "Revenue sharing is described, but contract terms and content costs are not public."
        - id: subscriptions
          label: SmartNews+
          detail: "Subscription milestone announced; price, churn, and net revenue unavailable."
        - id: gross-profit
          label: Gross profit
          detail: "No public gross-margin or contribution-profit series was found in the assigned pool."
    claimRefs: [CI001, CI002, CI003, CI011]
callouts:
  - calloutType: risk
    title: The key missing number is cash runway, not historical funding
    body: "Historical equity and debt proceeds demonstrate financing access, but they do not establish cash available today. A current balance sheet, debt schedule, and monthly burn are required before underwriting capital adequacy."
    claimRefs: [CI009, CI010, CI011, CI012]
  - calloutType: recommendation
    title: "Financial stance: research-more"
    body: "Proceed only with a data-room request for revenue recognition, cohort monetization, publisher economics, margins, cash, and debt terms; do not anchor valuation to the 2021 financing mark or an estimated 2025 revenue figure."
    claimRefs: [CI006, CI008, CI011, CI016]
