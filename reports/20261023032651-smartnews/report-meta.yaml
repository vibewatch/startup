companyProfile:
  summary: >-
    SmartNews is a Japan-founded mobile news-discovery company operating a free consumer product with algorithmic
    ranking, editorial curation, publisher distribution, and advertising. The platform has a substantial historical
    footprint and ongoing product investment, but current audience durability, financial performance, and governance
    terms are not publicly established.
