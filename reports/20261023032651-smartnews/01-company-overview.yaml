company:
  name: SmartNews
chapter:
  number: 1
  title: Company Overview
  summary: SmartNews is a Japan-founded news-discovery company that paired algorithmic curation with publisher relationships and expanded into the United States. The evidence supports meaningful historical scale and a still-active advertising product, but current private-company financials, user metrics, and governance disclosures remain limited.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      SmartNews was founded in Japan in 2012 by Ken Suzuki and Kaisei Hamamoto and operates a mobile news-discovery platform. The product combines machine-learning ranking, editorial curation, publisher distribution, and advertising rather than charging readers for the core service. Sources place the company in Tokyo and San Francisco and describe availability across Japan, the United States, and other markets. The current operating model is therefore a two-sided media platform: readers receive curated information while advertisers and publishers participate in the monetization and distribution system. The company describes its mission as delivering quality information to people who need it, while third-party accounts emphasize the practical differentiation of fast loading, offline-oriented use, and politically diverse discovery.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-capital-and-governance
    title: Leadership, capital, and governance
    body: The founders remain central to the historical identity of SmartNews, but the leadership record also shows key-person and transition risk. TechCrunch reported that widespread layoffs preceded a 2023 change in which co-founder Kaisei Hamamoto became CEO after Ken Suzuki departed; the same account described a new CTO arrival during the transition. Funding evidence is directionally consistent on a large private-company financing history and a $2 billion valuation mark in 2021, but the exact total raised differs by provider and should not be treated as audited. Tracxn reports $410 million and GetLatka reports $427.8 million across six rounds, while TechCrunch separately reported nearly $500 million of venture funding and a debt round of just under $70 million in 2024. These differences make cap-table, debt, dilution, and current valuation terms material diligence gaps.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: milestones-and-current-evidence
    title: Milestones and current evidence
    body: >-
      SmartNews has a clear sequence from a 2012 launch, to a U.S. product in 2014, to major Japanese adoption and a 2019 unicorn valuation, followed by a $2 billion 2021 financing mark and subsequent contraction. Historical evidence is stronger than current scale evidence: Rest of World documented 20 million monthly active users claimed for 2019 and 500 employees across two main offices, while TechCrunch later reported falling downloads, estimated worldwide daily and monthly active users, layoffs, and the company's refusal to disclose its own numbers. The May 2025 company release shows ongoing product investment in self-serve advertising and geographic targeting, and claims more than 3,000 publisher partners. That confirms operating activity, not profitability or present user retention. The most decision-relevant conclusion is that SmartNews has durable product and partner infrastructure, but its present trajectory requires refreshed primary financial and cohort evidence.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
