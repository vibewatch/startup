callouts:
  - calloutType: strength
    title: "Real product and distribution infrastructure"
    body: "The evidence supports a long-lived product, international operating footprint, publisher relationships, and an active advertising platform rather than a merely aspirational concept."
    claimRefs: [CO002, CO003, CO014, CO015]
  - calloutType: risk
    title: "Current scale and governance are not sufficiently disclosed"
    body: "Historical valuation and user figures are not substitutes for current financial statements, retention cohorts, debt terms, or a complete leadership and board record."
    claimRefs: [CO006, CO009, CO010, CO013, CO016]
  - calloutType: recommendation
    title: "Treat the $2B mark as historical until refreshed"
    body: "Proceed only with a diligence plan that reconciles financing definitions, current users, revenue quality, debt, and post-transition governance."
    claimRefs: [CO009, CO010, CO013, CO016]
