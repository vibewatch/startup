  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ['Find important news quickly', 'Open app and browse channels', 'Curated category homepage and machine-learning ranking', 'Faster discovery is the stated product objective', 'No current independent time-to-value or engagement measure']
      - ['Compare viewpoints', 'Read politics from one preferred source', 'News From All Sides labels and toggles among partisan sources', 'Viewpoint breadth is a product differentiator', 'Balance does not prove accuracy or persuasion']
      - ['Read on constrained mobile connections', 'Load publisher pages with slow or cluttered layouts', 'SmartView presents a fast reading surface', 'Lower reading friction is reported', 'Current latency and offline guarantees are unverified']
      - ['Publish and monetize content', 'Send selected articles into a distribution channel', 'Partner feed, SmartFormat validation, ads, and sponsored links', 'Adds a defined syndication workflow', 'Commercial terms and traffic quality are not disclosed']
      - ['Access public emergency information', 'Search fragmented government documents', 'Information hubs and manually assembled public data', 'Centralizes time-sensitive information', 'Current source freshness and operational ownership are unknown']
    notes: Benefits are product hypotheses or reported design goals unless a source provides a measured outcome; no conversion rate or service-level metric is inferred.
    claimRefs: [CE002, CE006, CE007, CE008, CE009, CE011]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence ask]
    rows:
      - ['Content supply', 'Publisher feeds and partner relationships', 'Thousands of publishers and source credibility', 'Concentration, licensing, feed breakage, and source-quality controls']
      - ['Ingestion and normalization', 'Collect and prepare articles and structured information', 'Publisher formats and public data documents', 'Schema drift, duplicate content, and provenance validation']
      - ['Ranking and recommendation', 'Select and order stories', 'Machine-learning models and quality features', 'Model drift, filter bubbles, bias, and explainability']
      - ['Editorial control', 'Monitor curation standards and exceptional content', 'Human curators and policy procedures', 'Staffing scalability and inconsistent interventions']
      - ['Reader delivery', 'Present categories, ads, and reading views', 'Mobile apps, SmartView, and analytics', 'Availability, latency, privacy, and ad quality']
      - ['Advertising protection', 'Analyze creatives and landing pages and centralize blocking rules', 'AppHarbr and programmatic demand partners', 'Supplier evidence lacks an independent control audit or quantified effectiveness']
      - ['Public-service operations', 'Build emergency and health information hubs', 'Government agencies and manually collected documents', 'Freshness, validation, and incident response']
    notes: This is an evidence-bounded operating model assembled from public product descriptions; SmartNews has not publicly documented a complete software or infrastructure architecture in the retained sources.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011]
figures:
  - id: FE001
    title: SmartNews product architecture map
    type: stack
    summary: Public evidence supports a layered curation and delivery workflow, while infrastructure and control-plane details remain diligence gaps.
    data:
      layers:
        - label: Content and supply
          detail: Publisher and public-information inputs feed the discovery workflow.
          modules:
            - name: Publisher network
              detail: "SmartNews says its network includes over 3,000 media partners."
            - name: Public information
              detail: "Reported hubs used government data for COVID-19, vaccine, and disaster information."
        - label: Curation and control
          detail: Machine-learning ranking is paired with human editorial intervention.
          modules:
            - name: Machine-learning ranking
              detail: "Reported priorities include political balancing, diversification, and quality-oriented discovery."
            - name: Human curation
              detail: "A human team reportedly monitored standards and flagged inappropriate images."
        - label: Reader and monetization
          detail: Mobile reading and publisher-ad surfaces connect delivery to revenue.
          modules:
            - name: Mobile reading
              detail: "SmartView is described as a fast, clutter-free reading layer."
            - name: Publisher and ad surfaces
              detail: "Publisher feeds, ads, sponsored links, analytics, and supplier-described ad-quality controls connect distribution to monetization."
        - label: Source validation
          detail: Publisher formats and public documents require normalization and provenance checks.
          modules:
            - name: Feed validation
              detail: "RebelMouse describes SmartFormat Validator requirements for publisher feeds."
        - label: Quality safeguards
          detail: Ranking and human review are intended to manage quality and viewpoint risks.
          modules:
            - name: Editorial standards
              detail: "Rest of World reported human monitoring and inappropriate-image flags."
        - label: Measurement
          detail: Analytics and referral tracking connect content distribution to publisher feedback.
          modules:
            - name: Traffic analytics
              detail: "Publisher guidance describes SmartView analytics and Google Analytics referral tracking."
    approximationNotes: "Layer order is an analytical representation of documented workflow components, not a disclosed SmartNews infrastructure diagram."
    claimRefs: [CE003, CE006, CE007, CE008, CE009, CE010, CE011]
callouts:
  - calloutType: strength
    title: Differentiated information workflow
    body: >-
      SmartNews has a more specific product thesis than undifferentiated article aggregation: machine-learning discovery is combined with viewpoint diversity, publisher supply, fast reading, and public-information use cases.
    claimRefs: [CE002, CE006, CE007, CE012]
  - calloutType: risk
    title: Current technical proof is thin
    body: Public sources do not establish present-day uptime, latency, security controls, privacy governance, model evaluation, release cadence, or roadmap delivery; the 2023 user decline and delayed overhaul make current product health a material diligence item.
    claimRefs: [CE014, CE015, CE016, CE017]
