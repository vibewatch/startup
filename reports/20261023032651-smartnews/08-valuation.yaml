callouts:
  - calloutType: recommendation
    title: Price-sensitive recommendation
    body: Research-more. The reported IPO reference is materially below the 2021 private mark, but it is not a completed price and the public record cannot yet establish revenue quality, cash runway, dilution, or preferences.
    claimRefs: [CV001, CV004, CV013, CV015]
  - calloutType: risk
    title: Primary diligence blocker
    body: The largest decision risk is not simply multiple compression; it is the absence of a verified bridge from operating performance and capital structure to common-equity value.
    claimRefs: [CV007, CV008, CV015, CV016]
