      - number: '1.3'
        title: Milestones and current evidence
        blocks:
          - type: paragraph
            body: >-
              SmartNews has a clear sequence from a 2012 launch, to a U.S. product in 2014, to major Japanese adoption
              and a 2019 unicorn valuation, followed by a $2 billion 2021 financing mark and subsequent contraction.
              Historical evidence is stronger than current scale evidence: Rest of World documented 20 million monthly
              active users claimed for 2019 and 500 employees across two main offices, while TechCrunch later reported
              falling downloads, estimated worldwide daily and monthly active users, layoffs, and the company's refusal
              to disclose its own numbers. The May 2025 company release shows ongoing product investment in self-serve
              advertising and geographic targeting, and claims more than 3,000 publisher partners. That confirms
              operating activity, not profitability or present user retention. The most decision-relevant conclusion is
              that SmartNews has durable product and partner infrastructure, but its present trajectory requires
              refreshed primary financial and cohort evidence.
