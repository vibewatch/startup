  - id: FI001
    title: Publicly evidenced revenue-to-profit bridge
    type: flow
    summary: >-
      SmartNews converts consumer attention and publisher distribution into advertising and other monetization, but
      public evidence does not quantify the intermediate economics or gross profit.
    data:
      nodes:
        - id: users
          label: Consumer attention
          detail: Public user estimates vary by period and source; current cohort data unavailable.
        - id: inventory
          label: News inventory and pageviews
          detail: Inline, video, and SmartView formats are described in assigned reporting.
        - id: ads
          label: Advertising sales
          detail: Described as the main revenue source; realized yield and take rate undisclosed.
        - id: publisher-share
          label: Publisher revenue share
          detail: Revenue sharing is described, but contract terms and content costs are not public.
        - id: subscriptions
          label: SmartNews+
          detail: Subscription milestone announced; price, churn, and net revenue unavailable.
        - id: gross-profit
          label: Gross profit
          detail: No public gross-margin or contribution-profit series was found in the assigned pool.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI011
  - id: FE001
    title: SmartNews product architecture map
    type: stack
    summary: >-
      Public evidence supports a layered curation and delivery workflow, while infrastructure and control-plane details
      remain diligence gaps.
    data:
      layers:
        - label: Content and supply
          detail: Publisher and public-information inputs feed the discovery workflow.
          modules:
            - name: Publisher network
              detail: SmartNews says its network includes over 3,000 media partners.
            - name: Public information
              detail: Reported hubs used government data for COVID-19, vaccine, and disaster information.
        - label: Curation and control
          detail: Machine-learning ranking is paired with human editorial intervention.
          modules:
            - name: Machine-learning ranking
              detail: Reported priorities include political balancing, diversification, and quality-oriented discovery.
            - name: Human curation
              detail: A human team reportedly monitored standards and flagged inappropriate images.
        - label: Reader and monetization
          detail: Mobile reading and publisher-ad surfaces connect delivery to revenue.
          modules:
            - name: Mobile reading
              detail: SmartView is described as a fast, clutter-free reading layer.
            - name: Publisher and ad surfaces
              detail: >-
                Publisher feeds, ads, sponsored links, analytics, and supplier-described ad-quality controls connect
                distribution to monetization.
        - label: Source validation
          detail: Publisher formats and public documents require normalization and provenance checks.
          modules:
            - name: Feed validation
              detail: RebelMouse describes SmartFormat Validator requirements for publisher feeds.
        - label: Quality safeguards
          detail: Ranking and human review are intended to manage quality and viewpoint risks.
          modules:
            - name: Editorial standards
              detail: Rest of World reported human monitoring and inappropriate-image flags.
        - label: Measurement
          detail: Analytics and referral tracking connect content distribution to publisher feedback.
          modules:
            - name: Traffic analytics
              detail: Publisher guidance describes SmartView analytics and Google Analytics referral tracking.
    approximationNotes: >-
      Layer order is an analytical representation of documented workflow components, not a disclosed SmartNews
      infrastructure diagram.
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: Customer journey from discovery to monetization
    type: journey-map
    summary: >-
      SmartNews converts publisher supply into reader discovery and advertising value, with premium subscriptions as an
      unproven expansion loop.
    data:
      items:
        - label: Publisher supply
          title: Publisher supply
          detail: 3,000+ publisher relationships and named premium sources feed the platform.
          touchpoints:
            - Publisher feeds
            - SmartView
            - Editorial curation
        - label: Reader discovery
          title: Reader discovery
          detail: Readers browse personalized, local, topic, and political news in a free app.
          touchpoints:
            - App Store
            - Local channels
            - News From All Sides
        - label: Repeat engagement
          title: Repeat engagement
          detail: Rewards, notifications, saved stories, and location-based content are intended to encourage recurring use.
          touchpoints:
            - Reading missions
            - Notifications
            - Travel and local feeds
        - label: Advertising monetization
          title: Advertising monetization
          detail: Advertisers reach readers through in-app and programmatic inventory.
          touchpoints:
            - SmartNews Ads
            - Programmatic demand
            - Ad-quality controls
        - label: Premium expansion
          title: Premium expansion
          detail: SmartNews+ offers curated premium business and economy content; commercial conversion is undisclosed.
          touchpoints:
            - SmartNews+
            - 50+ media companies
            - Unknown pricing and retention
        - label: Renewal and expansion proof
          title: Renewal and expansion proof
          detail: Public sources do not establish publisher renewal, advertiser repeat spend, or reader cohort durability.
          touchpoints:
            - Renewal terms
            - Cohort retention
            - Top-partner concentration
