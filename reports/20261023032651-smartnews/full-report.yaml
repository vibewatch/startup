  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and product proof are offset by audience, financing, and price uncertainty, leading to a research-more
      recommendation.
    data:
      nodes:
        - id: scale
          label: Historical scale and product differentiation
          note: Publisher relationships, algorithmic curation, advertising, and subscription initiatives are documented.
        - id: proof
          label: Current operating proof incomplete
          note: Public revenue is estimated and current user cohorts are not disclosed.
        - id: risk
          label: Audience and AI-displacement risk
          note: Third-party reporting describes falling downloads and users.
        - id: price
          label: Proposed IPO value is uncompleted
          note: Japan Times reports about ¥50 billion/$317 million, subject to change.
        - id: structure
          label: Debt, dilution, and preferences unverified
          note: Public sources do not provide a complete cap table or preference stack.
        - id: recommendation
          label: Research-more
          note: Require primary financial, transaction, and capitalization evidence before investing.
      edges:
        - from: scale
          to: proof
        - from: proof
          to: risk
        - from: risk
          to: price
        - from: price
          to: structure
        - from: structure
          to: recommendation
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV013
      - CV015
