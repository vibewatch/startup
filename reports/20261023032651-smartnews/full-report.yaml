  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included activity, and substitutes
        blocks:
          - type: paragraph
            body: >-
              SmartNews is best bounded as a mobile news-discovery and aggregation service, not as a newsroom, a general
              social network, or the whole digital-advertising market. Included activity comprises consumer access to
              curated publisher articles, local and topical discovery, publisher distribution through
              SmartNews-compatible feeds, and advertising inventory sold against that attention. Independent reporting
              describes a model built on publisher partnerships, personalized feeds, fast article delivery, and
              advertising, while the current app listing emphasizes local, political, travel, sports, and health
              discovery. Excluded activity includes publishers' own reporting costs, subscriptions sold outside
              SmartNews, broad search and social advertising, and unrelated entertainment inventory. Direct publisher
              sites and apps, Google News, Apple News, Flipboard, NewsBreak, social and video feeds, search, and the
              status quo of habitual offline or bookmarked news consumption are substitutes. This boundary prevents
              national internet use or total digital ad spend from being mislabeled as SmartNews TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports several non-additive lenses, not a precise TAM/SAM/SOM. Reuters Institute
              reports a 123 million Japanese population and 86% internet penetration, while DataReportal reports 107
              million internet users and 87.0% penetration at the end of 2025. The one-point difference should be
              preserved because the retrieved pages do not provide a common methodology. DataReportal also reports 99.0
              million social-media user identities, but explicitly warns that identities may not equal unique people.
              Platform comparators are likewise heterogeneous: LINE's 99.0 million figure is monthly active users,
              whereas YouTube's 78.5 million is potential advertising reach, not MAU. These values establish a large
              connected audience but cannot be summed or treated as SmartNews demand. Company-specific evidence is
              older: TechCrunch reported Sensor Tower estimates of roughly 5 million worldwide SmartNews MAU in Q1-Q3
              2023, down 30% year over year per quarter. Pixalate's April 2025 quality ranking indicates monetizable
              programmatic inventory, but not spend, impressions, share, or revenue.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
      - number: '2.3'
        title: Users, buyers, payers, and adoption paths
        blocks:
          - type: paragraph
            body: >-
              Consumers are the users but generally not the payer: the app listing presents free access, rewards, local
              information, topic customization, and publisher breadth as reasons to adopt. Brands, agencies, and demand
              partners are the economic buyers because both independent profiles and historical reporting identify
              advertising as the principal revenue model. Publishers occupy the supply side. RebelMouse's implementation
              guide says a publisher applies to the SmartNews Partner Program, provides a validated SmartNews feed,
              decides which content to forward, and can insert advertising or sponsored links. That process makes
              publisher integration effort and editorial control part of adoption, not merely audience scale.
              SmartNews's own advertising material sells a trusted, engaged, affluent audience, but supplies no audience
              denominator in the retrieved text. The adoption path therefore requires simultaneous reader utility,
              publisher willingness to supply content, and advertiser proof of safe, measurable inventory; weakness on
              any side limits the other two.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Category drivers include high Japanese internet penetration, mobile-first news habits, local utility, a
              broad publisher catalog, and advertiser demand for contextual inventory. SmartNews can deepen use when
              curation reduces search costs and publisher integrations provide breadth that a single outlet cannot.
              Trust is also an operating requirement: GeoEdge's supplier-authored case study says AppHarbr centralized
              ad-quality controls across demand partners while supporting advertising growth, and Pixalate ranked
              SmartNews first among Google Play apps in its April 2025 Japan Publisher Trust Index. Neither source
              proves market share or independent financial performance. Constraints are more material than a broad
              audience estimate suggests. TechCrunch reported 2023 user declines; Wisp, a disclosed competitor,
              criticizes ad load, ranking opacity, and clickbait, so that review is useful disconfirming evidence but
              not an independent benchmark. Publisher feed work, platform privacy changes, ad-safety operations, and
              competition from device-native, search, and social products can raise switching and acquisition costs.
              Valuation should therefore be gated on current cohorts, geography-level monetization, advertiser
              concentration, publisher economics, and a reconciled active-user series.
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM009
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size cannot yet anchor valuation
            body: >-
              National digital-audience values are broad context, while the latest assigned company-specific active-user
              evidence is a declining 2023 third-party estimate. A current cohort file, advertiser-spend bridge, and
              publisher-economics schedule are required before converting category scale into SmartNews SAM, SOM, or a
              market-share assumption.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic substitutes
        blocks:
          - type: paragraph
            body: >-
              SmartNews is not competing only with another news app. Its own former CEO framed the competitive job as
              replacing mobile-game time, while independent reporting places the product against Google News, NewsBreak,
              Flipboard and social platforms that distribute breaking news. The market therefore spans direct
              aggregators, editorial bundles, social/video discovery, and the status quo of search or publisher apps.
              SmartNews entered the U.S. with publisher partnerships, machine-learning personalization, fast loading and
              advertising, and later emphasized a politically balanced “News From All Sides” experience. That
              combination is differentiated, but most components are reproducible by scaled platforms with larger
              distribution.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP009
      - number: '3.2'
        title: Buyer-facing capability trade-offs
        blocks:
          - type: paragraph
            body: >-
              The practical buying criteria are low setup, breadth, control over sources, political transparency,
              offline speed, and a credible path to monetization without degrading the reading experience. SmartNews is
              strongest on frictionless, free, mobile browsing and publisher breadth. Google News is the lowest-friction
              substitute; Apple News adds editorial curation and a paid publication bundle; Flipboard emphasizes visual
              magazines; Feedly and Inoreader trade setup effort for source control; Ground News and AllSides make bias
              transparency more explicit. The comparison is directional rather than a benchmark: the
              competitor-comparison source is vendor-authored and is not treated as independent proof. Pricing is also
              unsettled: that comparison says SmartNews has no ad-free tier, while the current Apple listing shows two
              ad-free in-app purchases at $3.99 and $4.99.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
              - CP015
      - number: '3.3'
        title: Durability, distribution, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              SmartNews has real distribution assets: publisher relationships, a recognizable balanced-news proposition,
              and evidence of ad-quality performance in Japan. Yet durability is constrained by dependence on app-store
              and platform discovery, advertising demand, and continued user engagement. TechCrunch reported that
              estimated worldwide daily active users averaged about 1.7 million in Q1–Q3 2023 and declined 28% year over
              year per quarter, while downloads and retention also weakened. The same reporting describes tight
              competition from Threads, Mastodon, Bluesky, Artifact, TikTok, Flipboard and Substack. A possible 2026
              Tokyo listing is only reported market intelligence, and Bloomberg says timing and valuation could change;
              it does not establish a competitive advantage. The key underwriting question is whether publisher supply
              and political-balance positioning can produce durable, monetizable engagement before scaled platforms copy
              the experience.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits summarize public positioning and explicitly preserve unknowns across direct apps, editorial
              bundles, source-controlled readers, social distribution, and publisher status quo. Pricing is list or
              publicly described plan pricing, not realized revenue or margin. Capability cells describe product
              surfaces rather than measured performance, and unsupported cells are marked unknown rather than inferred.
              This distinction matters because a free plan, a large publisher count, or a bias label does not prove
              engagement, conversion, or durable economics.
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: SmartNews has a positioning wedge, not a closed moat
            body: >-
              The balanced-news proposition and fast offline-oriented experience can win a segment, but distribution,
              publisher supply, and ad monetization are exposed to scaled substitutes.
            calloutType: insight
            claimRefs:
              - CP002
              - CP009
              - CP012
          - type: callout
            title: Retention is the most important competitive unknown
            body: >-
              Public third-party estimates show material 2023 usage and download declines, while current MAU, cohort
              retention, and engagement economics remain insufficiently disclosed.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              SmartNews monetizes a free consumer news product primarily through advertising, with publisher revenue
              sharing and additional licensing or subscription initiatives. TechCrunch reported that the company sold
              inline and video ads, shared revenue with publishers, and said advertising was its principal model; the
              same account reported that more than 70% of pageviews came through SmartView First in 2021. Rest of World
              likewise described advertising as the main revenue source and observed inline and video ads on category
              pages. This supports a two-sided monetization mechanism, but not realized take rate, advertiser retention,
              contribution margin, or the split between Japan and the United States. A later company newsroom lists
              SmartNews+ subscription milestones and self-serve advertising launches, but those announcements are
              product signals, not recognized revenue. Official list or product pricing should therefore not be treated
              as ARR, and the public record does not establish a dependable revenue mix.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
      - number: '4.2'
        title: Traction, sales efficiency, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Public traction is directionally mixed. The 2021 TechCrunch financing report said the company had more
              than 3,000 publishing partners, approximately 500 employees globally, and 20 million monthly active users
              in 2019, while the 2024 TechCrunch review cited Sensor Tower estimates of roughly 1.7 million worldwide
              daily active users and roughly 5 million monthly active users during Q1–Q3 2023, with year-over-year
              declines. GetLatka presents $104.5 million of 2025 revenue as an estimate and explicitly says SmartNews
              has not published its own revenue. These figures are not directly comparable across source, period,
              geography, or methodology, so they do not establish CAC payback, ad yield, ARPU, retention, or sales
              efficiency. A financial model should treat user and revenue estimates as scenario inputs until management
              supplies reconciled cohorts, channel economics, and revenue recognition schedules.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI011
              - CI012
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              SmartNews has raised substantial equity capital historically, but the public evidence also points to debt
              financing and a long gap since the last disclosed equity round. TechCrunch reported a $230 million Series
              F at a $2 billion valuation in September 2021 and a debt round of just under $70 million in January 2024.
              Tracxn separately lists a $69.3 million venture-debt round on January 9, 2024, while Preqin describes JPY
              10 billion of venture debt and gives no public revenue or operating-income series for fiscal years
              2020–2024. These records establish financing dependency and debt exposure, not cash on hand or runway:
              proceeds may have been spent, restricted, refinanced, or offset by liabilities. Cash balance, debt
              covenants, amortization, liquidation preferences, dilution, and the next financing trigger remain
              underwriting blockers.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial profile is investable only as a conditional diligence case. The positive evidence is a
              functioning ad-supported distribution network, a long-standing publisher base, and repeated access to
              equity and debt capital. The adverse evidence is a material decline in reported third-party user metrics,
              2023 layoffs and leadership disruption, and the absence of company-published revenue, cash-flow,
              gross-margin, or profitability data. Nearview Media also warns publishers that SmartNews's SmartFormat can
              prioritize SmartNews monetization and that in-app views may be mistaken for publisher-site traffic; that
              is a partner-side warning about measurement and commercial terms, not proof of accounting misconduct. The
              central financial test is whether paid demand, publisher economics, and user engagement support durable
              contribution margin after content, distribution, privacy, and sales costs. Until management provides
              audited or board-quality statements, cohort retention, advertiser concentration, and debt terms, valuation
              should remain unanchored and the recommendation should be research-more.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The key missing number is cash runway, not historical funding
            body: >-
              Historical equity and debt proceeds demonstrate financing access, but they do not establish cash available
              today. A current balance sheet, debt schedule, and monthly burn are required before underwriting capital
              adequacy.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: callout
            title: 'Financial stance: research-more'
            body: >-
              Proceed only with a data-room request for revenue recognition, cohort monetization, publisher economics,
              margins, cash, and debt terms; do not anchor valuation to the 2021 financing mark or an estimated 2025
              revenue figure.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI008
              - CI011
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product delivered in the reader and publisher workflow
        blocks:
          - type: paragraph
            body: >-
              SmartNews delivers a free mobile news-discovery experience that aggregates articles from a large publisher
              network, organizes them into topical or local channels, and presents a fast reading surface. Its stated
              mission is quality information, while the practical customer workflow is discovery, selection, reading,
              and return visits; advertisers and publishers participate in the same distribution loop. Rest of World
              describes the U.S. product as a curated homepage with category tabs and a “News From All Sides” politics
              feature that labels partisan sources and lets readers toggle among them. SmartNews’ own corporate site
              says its network includes over 3,000 media partners and over 400,000 articles delivered daily, but these
              are company claims rather than independently audited service-level metrics.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
