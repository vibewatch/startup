    type: timeline
    summary: >-
      The timeline shows SmartNews's movement from Japanese launch to international expansion, unicorn financing,
      leadership transition, and current advertising-product investment.
    data:
      items:
        - date: '2012'
          label: Company founded and product launched
          details: SmartNews was founded by Ken Suzuki and Kaisei Hamamoto in Japan.
          tone: positive
          claimRefs:
            - CO001
        - date: '2014'
          label: U.S. launch
          details: The English-language app launched in the United States.
          tone: positive
          claimRefs:
            - CO002
        - date: '2016'
          label: Japanese scale milestone
          details: >-
            Rest of World reported more than 5 million monthly active users in Japan and roughly $50 million raised by
            early 2016.
          tone: positive
          claimRefs:
            - CO011
        - date: '2019'
          label: Unicorn valuation
          details: Japan Post-led financing pushed the reported valuation above $1 billion.
          tone: positive
          claimRefs:
            - CO008
        - date: '2021'
          label: $2B valuation mark
          details: TechCrunch reported a 2021 valuation of $2 billion following the company's financing.
          tone: positive
          claimRefs:
            - CO009
        - date: '2023'
          label: Layoffs and CEO transition
          details: TechCrunch reported widespread layoffs and Kaisei Hamamoto taking the CEO role after Ken Suzuki's departure.
          tone: negative
          claimRefs:
            - CO006
        - date: '2024'
          label: Debt financing reported
          details: >-
            TechCrunch reported a debt round of just under $70 million; Tracxn dates a venture-debt round to January
            2024.
          tone: neutral
          claimRefs:
            - CO010
        - date: '2025'
          label: Advertising platform expansion
          details: SmartNews announced self-serve ads for SMBs and map-based radius targeting.
          tone: positive
          claimRefs:
            - CO014
    approximationNotes: >-
      Dates and values are reproduced from the cited sources; the timeline does not infer current valuation, user scale,
      or financial performance.
