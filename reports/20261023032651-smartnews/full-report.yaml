      - number: '5.3'
        title: Maturity, differentiation, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              SmartNews has evidence of international deployment and product differentiation, including a U.S. launch in
              2014, availability in more than 150 countries in Rest of World’s 2021 account, local-news expansion to
              thousands of U.S. cities, and public-information hubs. Its differentiation is therefore more than a
              generic news feed: political viewpoint labeling, offline or fast reading, publisher distribution, local
              information, and a quality-oriented mission are recurring product elements. However, the technology moat
              is not fully demonstrated by public materials. TechCrunch reported falling downloads and active-user
              estimates in 2023, delayed product iteration, and a planned “Project Atlas” overhaul that had not yet
              launched at the time of reporting. Current release cadence, reliability, incident history, security
              posture, privacy governance, model evaluations, and roadmap delivery need direct diligence.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
              - CE017
      - number: '5.4'
        title: Product evidence exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate reader-facing capabilities, publisher-operating requirements, and technical
              dependencies. They intentionally preserve the distinction between documented capability and an unresolved
              diligence question: public descriptions can show what a product surface is designed to do, but they do not
              prove current adoption, service reliability, model accuracy, or defensibility. This distinction matters
              because SmartNews operates across publisher supply, ranking, editorial review, mobile delivery,
              advertising, and public-service information, so a weakness in any one layer can affect trust and
              monetization even when the user interface remains available.
            claimRefs:
              - CE002
              - CE007
              - CE010
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiated information workflow
            body: >-
              SmartNews has a more specific product thesis than undifferentiated article aggregation: machine-learning
              discovery is combined with viewpoint diversity, publisher supply, fast reading, and public-information use
              cases.
            calloutType: strength
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE012
          - type: callout
            title: Current technical proof is thin
            body: >-
              Public sources do not establish present-day uptime, latency, security controls, privacy governance, model
              evaluation, release cadence, or roadmap delivery; the 2023 user decline and delayed overhaul make current
              product health a material diligence item.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE016
              - CE017
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and value exchange
        blocks:
          - type: paragraph
            body: >-
              SmartNews serves two linked customer groups rather than one conventional buyer. Readers receive a free
              discovery product organized around premium publishers, local information, rewards, and topic or
              location-based feeds. Publishers supply content and can use SmartNews distribution, SmartView,
              advertising, and referral analytics. Advertisers are the monetizing demand side: the available evidence
              describes advertising partnerships and revenue sharing with publishers, while SmartNews+ introduces a
              subscription path. The strongest current segmentation is therefore reader, publisher, and advertiser, with
              a separate premium-reader experiment. SmartNews describes more than 3,000 publisher partners, while Axios
              independently reports direct relationships with more than 3,000 publishers and a revenue-share
              arrangement. These figures describe supply-side relationships, not active paying customers or retained
              users. Japan remains a core geographic reader market, but the Reuters Institute's 123 million population
              and 86% internet-penetration figures are market denominators rather than evidence of SmartNews adoption.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU015
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU015
              - CU016
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is substantial but uneven in time basis and source quality. Historical reporting
              describes availability in more than 150 countries, 20 million monthly active users in 2019, and more than
              5 million monthly active users in Japan by early 2016; these figures are not current run-rate disclosures.
              More recent reporting is adverse: TechCrunch cites Sensor Tower estimates of about 1.7 million worldwide
              daily active users and roughly 5 million monthly active users during Q1–Q3 2023, with year-over-year
              declines, while SmartNews declined to comment and did not disclose its own figures. Axios says the company
              still does not disclose its U.S. audience and only places the app in SimilarWeb's estimated top 50 U.S.
              iOS news apps. The evidence supports reach, but not retention, cohort durability, or a current denominator
              for expansion.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is strongest on the publisher side and weakest on reader monetization. The app
              listing names Bloomberg, The Atlantic, USA Today, TIME, Reuters, AP, and other publishers, but a logo or
              source list does not establish a paid deployment, contractual size, or renewal. SmartNews's NewsArc launch
              says it was built with hundreds of publishers, and the official business page describes more than 3,000
              trusted media partners. A partner case study reports millions of readers and SmartNews's use of AppHarbr
              across programmatic demand partners, but it is partner-issued evidence and should not be treated as an
              independent retention benchmark. User reviews provide broad satisfaction and concrete complaints about
              disruptive advertising, location prompts, and personalization limits. No public source in this pool
              establishes NRR, GRR, churn, contract length, top-customer share, advertiser concentration, or publisher
              renewal rates; those are material diligence gaps.
            claimRefs:
              - CU003
              - CU005
              - CU011
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU005
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad supply-side proof
            body: >-
              SmartNews has repeated evidence of a large publisher network and named content relationships, which
              supports product breadth and reader acquisition.
            calloutType: strength
            claimRefs:
              - CU001
              - CU004
              - CU005
          - type: callout
            title: Retention and concentration remain unverified
            body: >-
              Public evidence does not establish current cohorts, renewal, advertiser concentration, top-publisher
              dependence, or paid conversion; adverse third-party usage estimates increase the diligence priority.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile and thesis breaks
        blocks:
          - type: paragraph
            body: >
              SmartNews's highest-priority risk is execution. Rest of World reports that more than 100 employees were
              laid off in 2023, including about 120 U.S.-based staff, while TechCrunch reports falling downloads and
              active users, delayed product work, and a leadership transition. These are observable indicators of a
              difficult reset rather than proof that the current operation is failing. The monitorable thesis break is a
              renewed decline in active users or another material reduction before the company demonstrates durable
              product delivery and monetization. A second risk is monetization concentration: the business has
              historically relied on advertising, while public third-party profiles provide estimates rather than
              audited company revenue. The investment implication is to require current cohort, margin, and cash-flow
              evidence before treating reported scale as durable value.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR010
              - CR014
      - number: '7.2'
        title: Legal, regulatory, and content-governance exposure
        blocks:
          - type: paragraph
            body: >
              Aggregation creates a structural rights and trust risk. The U.S. Copyright Office's summary of Associated
              Press v. Meltwater states that the court rejected a fair-use defense where an automated service captured
              and republished article excerpts commercially, and that the use directly harmed an established licensing
              market. The case is not a finding against SmartNews, but it is a relevant precedent for a platform that
              curates and monetizes publisher content. Japan's June 2026 draft AI Basic Plan identifies increasingly
              serious technical, social, national-security, copyright, and cyberattack risks, and calls for
              institutional, technical, and organizational governance responses. SmartNews's own site says it evaluates
              publishers and articles, while the ExchangeWire partner case study describes real-time blocking of
              malicious and deceptive ads. Those controls mitigate ad-quality exposure, but the assigned evidence does
              not establish their completeness across jurisdictions. Diligence should therefore test rights agreements,
              takedown performance, privacy practices, algorithmic accountability, and incident logs.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
      - number: '7.3'
        title: Dependency, financial, and mitigation discipline
        blocks:
          - type: paragraph
            body: >
              SmartNews remains exposed to dependencies that are difficult to price from public information. Preqin
              describes a January 2024 JPY 10 billion venture-debt round and says the company explores subscriptions,
              but does not disclose public operating revenue in the profile. Tracxn records a $69.3 million venture-debt
              round and a $2 billion valuation as of December 31, 2021; GetLatka separately labels its $104.5 million
              June 2025 revenue figure an estimate. These records are not interchangeable with audited revenue, cash
              available, or current valuation. The practical risk is financing and margin compression if advertising
              weakens while product investment and publisher relationships continue. Monitoring should focus on debt
              terms, runway, ad concentration, subscription conversion, gross margin, and publisher churn. Until those
              measures are disclosed, valuation and downside triggers remain evidence gaps rather than precise
              forecasts.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A renewed material decline in active users or another major execution reset before current cohort, margin,
              and cash-flow evidence improves would invalidate the recovery thesis.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR005
          - type: callout
            title: Evidence boundary
            body: >-
              Public funding, revenue, and valuation profiles are useful directional records, but they do not establish
              audited revenue, cash available, debt capacity, or current enterprise value.
            calloutType: assumption
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment judgment
        blocks:
          - type: paragraph
            body: >-
              SmartNews has a differentiated distribution asset: its product combines algorithmic curation, publisher
              relationships, advertising, and subscription experiments. The historical case for scale is real, but it is
              not a current underwriting case. Rest of World reported that the company reached a $2 billion valuation in
              2021 and had previously reported 20 million monthly active users in 2019, while TechCrunch later described
              falling downloads and approximately 1.7 million worldwide daily active users between Q1 and Q3 2023. The
              October 2026 Japan Times report is the decisive fresh price signal: a potential December Tokyo IPO is
              being discussed around ¥50 billion ($317 million), with timing and valuation explicitly subject to change.
              That is roughly 84% below the 2021 $2 billion mark, but the report is not a completed transaction or a
              prospectus. The thesis therefore has upside if SmartNews can prove durable monetization and a credible
              public-market path, but the anti-thesis is that weaker reach, AI-driven substitution, and incomplete
              disclosure make the old private mark unreliable.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV013
              - CV015
      - number: '8.2'
        title: Price, financing, and comparability
        blocks:
          - type: paragraph
            body: >-
              The financing record shows why valuation discipline matters. Tracxn reports $410 million across eight
              rounds. Preqin separately reports a January 2024 JPY 10 billion venture-debt round and says the total
              amount raised reached JPY 25.1 billion, but its profile is subscriber-limited and its displayed financial
              series is sparse. GetLatka labels its $104.5 million annual revenue figure as an estimate, not
              company-reported revenue. These partial records do not provide a clean capitalization, revenue, or cash
              bridge. Public comparables can anchor market context, not prove a SmartNews multiple: CompaniesMarketCap
              reports The New York Times at $11.19 billion market capitalization in October 2026, while Macrotrends
              reports $2.825 billion of 2025 revenue. Mercari's investor-relations page illustrates the fuller
              financial, securities, stock, and governance disclosure available from a listed Japanese
              consumer-technology company. These companies' scale, business mix, disclosure, and liquidity differ from
              SmartNews, so a direct revenue or user multiple would be false precision.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              A scenario framework should be treated as an underwriting decision tree, not a forecast. The bull case
              requires a completed listing or equivalent financing near the reported ¥50 billion reference, evidence
              that advertising and SmartNews+ subscriptions offset traffic pressure, and disclosure that debt,
              preferences, and dilution do not absorb the apparent equity value. The base case is a private-company hold
              or delayed listing while management proves stable users, revenue quality, and cash runway; the bear case
              is a failed or repriced process after further audience erosion, with debt and liquidation preferences
              increasing downside. The Japan Times report says SmartNews failed to find a buyer at its target valuation
              and that deliberations remain ongoing; that is adverse evidence against treating the proposed IPO value as
              an assured floor. Its report also names Mitsubishi UFJ Morgan Stanley Securities and Nomura Holdings as
              lead managers, a readiness signal that still falls short of a filed transaction. Exit readiness is
              therefore conditional: request the draft or filed prospectus, audited FY2024-FY2025 statements, monthly
              active-user and retention cohorts, current cap table, debt agreements, preference stack, advertiser
              concentration, and board-approved IPO timetable. A thesis break is a materially lower completed price,
              continued user contraction without compensating monetization, or inability to evidence liquidity through
              the next financing or listing window.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Research-more. The reported IPO reference is materially below the 2021 private mark, but it is not a
              completed price and the public record cannot yet establish revenue quality, cash runway, dilution, or
              preferences.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV015
          - type: callout
            title: Primary diligence blocker
            body: >-
              The largest decision risk is not simply multiple compression; it is the absence of a verified bridge from
              operating performance and capital structure to common-equity value.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV015
              - CV016
