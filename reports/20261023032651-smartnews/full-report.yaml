chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              SmartNews was founded in Japan in 2012 by Ken Suzuki and Kaisei Hamamoto and operates a mobile
              news-discovery platform. The product combines machine-learning ranking, editorial curation, publisher
              distribution, and advertising rather than charging readers for the core service. Sources place the company
              in Tokyo and San Francisco and describe availability across Japan, the United States, and other markets.
              The current operating model is therefore a two-sided media platform: readers receive curated information
              while advertisers and publishers participate in the monetization and distribution system. The company
              describes its mission as delivering quality information to people who need it, while third-party accounts
              emphasize the practical differentiation of fast loading, offline-oriented use, and politically diverse
              discovery.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: Leadership, capital, and governance
        blocks:
          - type: paragraph
            body: >-
              The founders remain central to the historical identity of SmartNews, but the leadership record also shows
              key-person and transition risk. TechCrunch reported that widespread layoffs preceded a 2023 change in
              which co-founder Kaisei Hamamoto became CEO after Ken Suzuki departed; the same account described a new
              CTO arrival during the transition. Funding evidence is directionally consistent on a large private-company
              financing history and a $2 billion valuation mark in 2021, but the exact total raised differs by provider
              and should not be treated as audited. Tracxn reports $410 million and GetLatka reports $427.8 million
              across six rounds, while TechCrunch separately reported nearly $500 million of venture funding and a debt
              round of just under $70 million in 2024. These differences make cap-table, debt, dilution, and current
              valuation terms material diligence gaps.
