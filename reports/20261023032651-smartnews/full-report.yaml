      - number: '5.2'
        title: Curation, distribution, and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The public record indicates a hybrid operating model rather than a purely automated recommender.
              Machine-learning systems rank or curate stories, publisher feeds supply the content inventory, and human
              curators monitor standards or handle exceptional public-information work. Rest of World reports that
              SmartNews ranked political balancing and diversification as algorithmic priorities, while a human team
              flagged inappropriate images; it also reports manual collection of government data for pandemic and
              vaccine information hubs. Publisher implementation evidence from RebelMouse describes a SmartNews Partner
              Program, SmartFormat feed validation, SmartView, sponsored links, publisher ads, and analytics tracking. A
              2026 supplier case study adds an AppHarbr layer that analyzes ad creatives and landing pages and
              centralizes controls across demand partners. These details support a concrete workflow architecture, but
              they do not establish the underlying cloud stack, model design, latency, uptime, privacy controls, or
              independent security testing.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
