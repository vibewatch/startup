company:
  name: SmartNews
chapter:
  number: 6
  title: Customers
  summary: SmartNews has credible reach across readers and publishers, with a free, ad-led product spanning Japan, the United States, and other markets. Evidence supports named publisher supply and meaningful historical adoption, but current audience, retention, paid conversion, and customer concentration remain insufficiently disclosed.
sections:
  - id: customer-segments-and-value
    title: Customer segments and value exchange
    body: >-
      SmartNews serves two linked customer groups rather than one conventional buyer. Readers receive a free discovery product organized around premium publishers, local information, rewards, and topic or location-based feeds. Publishers supply content and can use SmartNews distribution, SmartView, advertising, and referral analytics. Advertisers are the monetizing demand side: the available evidence describes advertising partnerships and revenue sharing with publishers, while SmartNews+ introduces a subscription path. The strongest current segmentation is therefore reader, publisher, and advertiser, with a separate premium-reader experiment. SmartNews describes more than 3,000 publisher partners, while Axios independently reports direct relationships with more than 3,000 publishers and a revenue-share arrangement. These figures describe supply-side relationships, not active paying customers or retained users.
      Japan remains a core geographic reader market, but the Reuters Institute's 123 million population and 86% internet-penetration figures are market denominators rather than evidence of SmartNews adoption.
    claimRefs: [CU001, CU002, CU004, CU015, CU016]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      Adoption evidence is substantial but uneven in time basis and source quality. Historical reporting describes availability in more than 150 countries, 20 million monthly active users in 2019, and more than 5 million monthly active users in Japan by early 2016; these figures are not current run-rate disclosures. More recent reporting is adverse: TechCrunch cites Sensor Tower estimates of about 1.7 million worldwide daily active users and roughly 5 million monthly active users during Q1–Q3 2023, with year-over-year declines, while SmartNews declined to comment and did not disclose its own figures. Axios says the company still does not disclose its U.S. audience and only places the app in SimilarWeb's estimated top 50 U.S. iOS news apps. The evidence supports reach, but not retention, cohort durability, or a current denominator for expansion.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU012]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named proof, expansion, and concentration
    body: >-
      Named customer proof is strongest on the publisher side and weakest on reader monetization. The app listing names Bloomberg, The Atlantic, USA Today, TIME, Reuters, AP, and other publishers, but a logo or source list does not establish a paid deployment, contractual size, or renewal. SmartNews's NewsArc launch says it was built with hundreds of publishers, and the official business page describes more than 3,000 trusted media partners. A partner case study reports millions of readers and SmartNews's use of AppHarbr across programmatic demand partners, but it is partner-issued evidence and should not be treated as an independent retention benchmark. User reviews provide broad satisfaction and concrete complaints about disruptive advertising, location prompts, and personalization limits. No public source in this pool establishes NRR, GRR, churn, contract length, top-customer share, advertiser concentration, or publisher renewal rates; those are material diligence gaps.
    claimRefs: [CU003, CU005, CU011, CU013, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
