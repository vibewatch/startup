callouts:
  - calloutType: strength
    title: Broad supply-side proof
    body: "SmartNews has repeated evidence of a large publisher network and named content relationships, which supports product breadth and reader acquisition."
    claimRefs: [CU001, CU004, CU005]
  - calloutType: risk
    title: Retention and concentration remain unverified
    body: "Public evidence does not establish current cohorts, renewal, advertiser concentration, top-publisher dependence, or paid conversion; adverse third-party usage estimates increase the diligence priority."
    claimRefs: [CU009, CU010, CU013]
