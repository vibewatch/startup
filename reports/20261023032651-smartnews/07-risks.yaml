    claimRefs: [CR001, CR006, CR010, CR014]
callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: A renewed material decline in active users or another major execution reset before current cohort, margin, and cash-flow evidence improves would invalidate the recovery thesis.
    claimRefs: [CR002, CR003, CR005]
  - calloutType: assumption
    title: Evidence boundary
    body: Public funding, revenue, and valuation profiles are useful directional records, but they do not establish audited revenue, cash available, debt capacity, or current enterprise value.
    claimRefs: [CR010, CR011, CR012, CR013]
