callouts:
  - calloutType: risk
    title: Market size cannot yet anchor valuation
    body: >-
      National digital-audience values are broad context, while the latest assigned
      company-specific active-user evidence is a declining 2023 third-party estimate. A current
      cohort file, advertiser-spend bridge, and publisher-economics schedule are required before
      converting category scale into SmartNews SAM, SOM, or a market-share assumption.
    claimRefs: [CM006, CM007, CM008, CM016]
