- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Recognized revenue and ARR by segment
    - Without these, monetization quality remains anecdotal
    - Request audited revenue bridge by API, marketing products, film/media, and creator subscriptions.
  - - Gross margin and compute cost by product
    - Cannot judge software quality or scale economics
    - Request COGS split, cloud partner commitments, and contribution margin per asset type.
  - - Cash balance, burn, and runway
    - Cannot assess financing dependency or timing of next raise
    - Request board cash dashboard, monthly burn bridge, and 12-18 month forecast.
  - - Contract quality and retention
    - Cannot underwrite durability or land-and-expand dynamics
    - Request renewal, churn, NRR/GRR, and cohort behavior by segment.
  - - Enterprise pricing realization
    - List-price visibility is mostly consumer-side only
    - Review sample MSAs, order forms, and discount schedules.
  notes: These are the key blockers separating a credible commercialization story from a finance-grade investment
    case.
