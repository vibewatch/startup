  - FI004
- id: capital-adequacy-and-private-market-opacity
  title: Capital adequacy and private-market opacity
  body: 'On capital access alone, HiDream looks strong. Multiple contemporary reports agree on a RMB 1.5 billion
    Series C and more than RMB 2.1 billion raised across a short recent window, with funds earmarked for omni-modal
    or world-model development. That is exactly the kind of financing pattern expected from a company still investing
    aggressively in model capability and commercialization. The harder question is adequacy, not access. Public
    sources do not disclose cash on hand, monthly burn, runway months, debt obligations, or the exact timing of
    future fundraising needs. Worse, private-market databases are inconsistent or too sparse: InforCapital shows
    a much smaller funding history, while PitchBook, Tracxn, and Caplight provide little usable current underwriting
    detail in this retrieved set. The result is a capital story that looks robust on headlines but still lacks the
    transparency needed for a clean forward cash model. The wider 2026 AI-unicorn environment also appears supportive,
    which may have improved financing receptivity, but macro venture appetite cannot replace company-level disclosure.'
  claimRefs:
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI041
  - CI042
