  - - Enterprise realized ASP
    - Not public
    - low
    - Critical for judging whether API and workflow revenue can support compute-heavy delivery
    - Provide average contract value, minimum commit, and pricing waterfall.
  - - Gross margin
    - Not public
    - low
    - Core determinant of software quality in an inference-heavy business
    - Provide gross margin by segment and compute partner.
  - - Contribution margin per generated asset
    - Not public
    - low
    - Determines whether volume growth creates or destroys value
    - Provide per-image/per-video contribution analysis including moderation and refund rates.
  - - HiBurst economic proxy
    - '>1M videos annually; GMV > RMB100M'
    - medium
    - Shows workflow activity, but must not be mistaken for HiDream revenue
    - Bridge GMV to HiDream take-rate or software revenue.
  - - Architectural cost advantage
    - Reported training cost 10%-20% of industry average
    - medium
    - Could materially improve model economics if repeatable in production
    - Provide audited or management-grade compute cost comparisons and serving-cost impact.
