- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The positive case is real: HiDream has multiple monetization surfaces, visible product activity, and extraordinary
    fundraising momentum for a young private AI company. The negative case is just as real: the public record still
    cannot verify revenue scale, revenue mix, gross margin, retention, runway, or the extent to which growth depends
    on ongoing external capital. That means the company may be commercially promising while remaining financially
    under-documented. For an institutional investor, the practical implication is not to dismiss HiDream but to
    demand a bridge from top-of-funnel activity to revenue recognition and cash generation. Until management provides
    that bridge, any precise model of revenue quality or margin expansion remains speculative.'
  claimRefs:
  - CI031
  - CI032
  - CI033
  - CI034
  - CI035
