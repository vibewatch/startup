  topStrengths:
    - 国资、银行系和影视产业资本围绕清晰的多模态 AI 平台命题组成强战略财团。
    - 开源发布、基准曝光、第三方托管和可见企业 / API 分发信号，构成真实产品证明。
    - API、媒体工作流和创作者工具覆盖面较广，让 HiDream 不只是单点功能 demo 故事。
  topRisks:
