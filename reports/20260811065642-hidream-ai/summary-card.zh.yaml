    - 当前估值只有在战略合作和活跃度指标转化为高质量经常性变现时才站得住。
    - 2026 年 AI 资本市场仍开放但更挑剔；若增长证明落后于估值，不透明公司下行更大。
    - 开源分发和激进生态扩张可能扩大触达，同时削弱稀缺性和定价权。
  unresolvedGaps:
    - 准确 post-money 估值、清算优先权、反稀释保护，以及任何内部二级出售压力仍未披露。
    - 尚无公开收入桥，把用户、关键客户或 API 调用量连接到经常性企业收入、留存或毛利率。
    - 没有管理层财务、现金流细节和算力成本披露，DCF 级模型仍无法建立。
    - 与 Shanghai Film 和 Huace 的战略渠道合作，还需要合同价值和续约证据，才能支撑溢价估值。
