- id: diligence-asks-and-thesis-breaks
  title: Diligence asks, thesis-breaks, and exit readiness
  body: 'The remaining work is practical, not philosophical. Investors need the exact post-money valuation, the preference stack, a revenue bridge by segment, retention data, gross-margin evidence, and enough cash-flow detail to determine whether this is a software-like business or a capital-hungry world-model lab with software wrappers. The strategic upside case is visible: partnerships with Shanghai Film and Huace can help HiDream turn benchmark credibility into proprietary content workflows, while open-source distribution broadens developer reach. The risk is that those same signals prove easier to market than to monetize. Without filing-grade disclosure, any future crossover financing or IPO-style process will still face questions on dilution, earnings quality, and whether user or API activity converts into durable enterprise cash flow. That is why the call remains research-more, not avoid: there is something worth underwriting here, but the next step is a diligence pack, not a leap
    of faith. Price still needs proof.'
