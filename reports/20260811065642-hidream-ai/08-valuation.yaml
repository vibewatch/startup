tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Real company, incomplete price support, and no public revenue-quality bridge.
    - Advance diligence only if management can open the financial and cap-table package.
  - - Confidence
    - medium
    - Funding, product, and benchmark evidence are visible, but the valuation case still leans on indirect proof.
    - Treat any underwriting as provisional until disclosure quality improves.
  - - Risk rating
    - high
    - Valuation depends on undisclosed economics in a more selective 2026 AI funding market.
    - Demand strong downside protections or defer entry.
  - - Valuation stance
    - stretched
    - Unicorn-plus pricing is visible, but public support for intrinsic value is thinner than support for market enthusiasm.
    - Do not pay a scarcity premium without proof of monetization quality.
  - - Decision implication
    - price-sensitive diligence case
    - If the exact post-money is only slightly above $1B and revenue quality is strong, the range could be defensible; at materially richer terms, evidence is currently too thin.
    - Use diligence results to decide whether to track, negotiate, or walk.
  notes: This table is intentionally price-sensitive rather than company-quality-only. The central issue is whether the visible unicorn narrative is backed by enough public economics to justify entry.
