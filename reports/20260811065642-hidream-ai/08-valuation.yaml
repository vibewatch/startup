- id: TV005
  title: Comparable valuation table
  enumeration: true
  enumerationScope:
    coverage: partial
    basis: The set focuses on visible listed software or creative-media businesses with public revenue data plus adjacent image or video workflows. It is illustrative rather than exhaustive because HiDream has no public financials and few direct public analogues.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Adobe
    - 2026 market cap / 2025 revenue
    - $108.5B / $23.76B = ~4.6x revenue
    - Large creative-software incumbent with generative-AI exposure and monetized creative workflows.
    - Far larger, more diversified, and more profitable than HiDream.
  - - C3 AI
    - 2026 market cap / 2025 revenue
    - $1.61B / $0.30B = ~5.4x revenue
    - Public pure-play AI software name; useful for software-style AI sentiment.
    - Not a media-generation company and growth has already slowed.
  - - Duolingo
    - 2026 market cap / 2025 revenue
    - $6.41B / $1.03B = ~6.2x revenue
    - High-growth subscription platform that shows the upper end of public software multiples with clear monetization.
    - Language learning is more legible and recurring than multimodal media AI.
  - - Kuaishou
    - 2026 market cap / 2023 revenue
    - $23.53B / $16.01B = ~1.5x revenue
    - China consumer-content platform with video economics and distribution scale.
    - Much broader ad and platform business; not a foundation-model company.
  - - Shutterstock
    - 2026 market cap / 2025 revenue
    - $0.21B / $0.98B = ~0.2x revenue
    - Directly relevant on creative-asset monetization and licensing sensitivity.
    - Public market is pricing structural pressure and weak growth, not frontier AI upside.
  - - Getty Images
    - 2026 market cap / 2026 TTM revenue
    - $0.18B / $0.98B = ~0.18x revenue
    - Important rights-and-licensing analogue for image businesses exposed to IP questions.
    - Getty is a mature asset-licensing platform, not a high-growth model developer.
  notes: Public creative-media multiples are far below private AI funding medians. That gap is the core reason HiDream’s undisclosed revenue base matters so much.
