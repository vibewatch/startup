- id: financing-context-and-valuation-history
  title: Financing context and valuation history
  body: The latest funding round is substantial on any local or global AI basis. HiDream closed a RMB 1.5 billion Series C in late July 2026, and multiple sources say the company raised more than RMB 2.1 billion across three rounds in roughly three months, entering unicorn status in the process. The syndicate matters almost as much as the amount. National and provincial state-backed funds, bank capital, and film or TV strategics suggest investors see HiDream as both strategic infrastructure and an applied media-technology platform. That combination can support a valuation premium versus a generic creator app. But valuation history is still sparse. The public record does not show exact pre-money or post-money marks for earlier rounds, lifetime capital raised, or the preference structure beneath the latest round. That means the headline mark proves market clearing, not intrinsic value. For underwriting, valuation history is informative but incomplete.
