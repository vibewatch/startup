- id: TV006
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation / return logic
  - Probability signal
  rows:
  - - Bear
    - HiDream remains opaque on revenue quality, pricing pressure intensifies, and the market starts valuing generative-media businesses closer to public creative or lower-tier AI comps.
    - ~$0.6B-$0.9B. The unicorn floor breaks if the company cannot prove software-like economics or if financing conditions tighten before a larger strategic exit path appears.
    - No financial disclosure, weak enterprise conversion evidence, or signs of a down-round / structurally dilutive raise.
  - - Base
    - HiDream converts benchmark and strategic momentum into enough commercial proof to defend the unicorn floor, but still does not show the clean economics needed for a scarcity premium.
    - ~$0.9B-$1.3B. This range treats the current mark as roughly defendable only near the low end and only if later diligence fills in revenue-quality gaps.
    - Continued strategic adoption plus no obvious negative surprise, but still no audited revenue bridge.
  - - Bull
    - HiDream discloses strong recurring enterprise revenue, clear margin improvement, and repeatable conversion from open-source and film/media workflows into durable contracts.
    - ~$1.5B-$2.4B. A premium above the current floor requires growth quality that starts to look more like a category leader than a promising but opaque frontier-media lab.
    - Audited financials, retention proof, cap-table clarity, and evidence that world-model or film workflows are monetizing at scale.
  notes: DCF is intentionally not used as the primary method here. The public record still lacks revenue, margin, burn, capex, and working-capital inputs robust enough to support a finance-grade discounted cash-flow model.
