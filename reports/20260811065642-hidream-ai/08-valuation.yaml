- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Supporting evidence
  - What would change the view
  rows:
  - - HiDream is more than a demo lab
    - The company has a fresh RMB 1.5B round, 200+ APIs, 100+ key accounts, open-source releases, and film/media strategic investors.
    - Verified recurring revenue and retention would upgrade this from plausible to underwritten.
  - - Strategic capital may add real channel value
    - Shanghai Film, Huace, and state-backed investors can open industrial use cases and data partnerships that generic labs do not have.
    - Need revenue attribution, deployment case studies, and proof those ties produce durable contracts.
  - - Open-source and benchmark proof create optionality
    - HiDream-O1-Image reached leading open-source positions and third-party distribution surfaces already exist.
    - Need evidence that open adoption converts into paid enterprise or API monetization rather than only mindshare.
  - - The current mark may still be ahead of fundamentals
    - No public revenue, ARR, margin, or burn disclosure exists, while the public comp set trades far below private AI funding multiples.
    - A full financial package could justify the premium; absent that, the discount should stay.
  - - Funding momentum is not the same as intrinsic value
    - 2026 sector evidence shows capital is still available for winners but more selective, and past GenAI leaders have still stalled or recapitalized.
    - A cleaner capital stack and visible unit economics would reduce dependence on financing optics.
  notes: The anti-thesis is not that HiDream lacks product quality. It is that price support still depends too heavily on inferred economics.
