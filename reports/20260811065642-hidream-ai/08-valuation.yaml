  rows:
  - - 2023 formation period
    - No public valuation disclosed
    - Registry records show a Beijing operating entity established on 2023-03-02, but no early financing mark is visible in the public set.
    - Useful as operating-company anchor, not as valuation evidence.
  - - Prior three-month financing burst before Series C
    - More than RMB 2.1B recent total, but round-by-round valuation details are not public
    - Seedtable, The SaaS News, Media OutReach, and TMTPost all point to three rounds within roughly three months.
    - Momentum is clear; earlier marks and dilution are not.
  - - 2026-07-27 Series C
    - Unicorn / >$1B
    - RMB 1.5B raised, strategic syndicate disclosed, exact post-money not disclosed.
    - Confirms current market appetite and a unicorn floor, but not a precise fair value.
  - - 2026-08 public underwriting position
    - No cleaner mark than unicorn-plus
    - The public record still lacks exact valuation, lifetime total raised, or preference terms after the round.
    - Any investor must bridge the missing economics in diligence before treating the mark as investable.
  notes: History is intentionally sparse because the public record is sparse. The main takeaway is not a timeline of exact marks; it is that fundraising visibility outruns valuation transparency.
