- id: peer-classes-and-capability-differences
  title: Peer classes and capability differences
  body: The competitor field splits into at least three classes. First are premium global workflow or model players
    such as Runway and Google Veo, which compete on control, reliability, and enterprise-acceptable trust posture.
    Second are Chinese video-native rivals such as Kling and Hailuo, which compete more directly on short-video
    creation, API availability, and cost-sensitive domestic creator demand. Third are the hybrid or routing layers,
    including vivago itself, that increasingly package several upstream models into one experience. HiDream’s image-model
    story compares well in public benchmarks, especially in open source, but its broader multimodal position is
    still less established than the brand implies. It does not yet show the same public enterprise-control stack
    as Veo, nor the same obvious mass distribution loop as ByteDance- or Kuaishou-linked rivals. That makes feature
    breadth real, but competitive fit highly segment-specific.
