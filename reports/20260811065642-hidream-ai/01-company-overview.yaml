  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-and-cap-table
    missingEvidence: A current board roster, committee map, and full post-Series-C cap table with ownership percentages
      and investor rights.
    whyItMatters: The public record supports founder identity and round participants but not the actual control
      framework or dilution stack behind the new unicorn valuation.
    diligencePath: Request the latest organizational chart, board materials, and cap table from management or lead
      investors.
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-confirmed current employee count and function split.
    whyItMatters: Registry snapshots show inconsistent insured-person figures and do not support a clean staffing
      or burn-rate inference.
    diligencePath: Ask for the current employee roster by function and month-end headcount bridge versus insured-person
      filings.
  - type: missing-source
    severity: minor
    topic: leadership-roster
    missingEvidence: Public biographies for the broader executive team beyond Tao Mei and Wang Ke.
    whyItMatters: Founder strength is evident, but later underwriting needs a more complete view of execution depth
      and succession risk.
    diligencePath: Collect executive bios from management, investor materials, or later company disclosures.
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: metric-definition
    missingEvidence: Definitions and cohort detail behind professional users, enterprise customers, key accounts,
      and API-call volumes.
    whyItMatters: The public narrative contains multiple scale metrics that likely measure different things, which
      can materially alter the company-overview interpretation.
    diligencePath: Ask for metric definitions, time windows, paying versus non-paying splits, and customer concentration
      for each headline KPI.
