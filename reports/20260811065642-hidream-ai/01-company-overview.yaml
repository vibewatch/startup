- id: founder-anchor-governance-and-org-opacity
  title: Founder anchor, legal entity structure, and governance opacity
  body: The clearest public leadership anchor is Tao Mei. The official site, Baidu profile, and IEEE author page
    all identify him as founder and CEO, and independent biographical sources tie him to prior senior roles at JD.com
    and Microsoft Research. That background helps explain the company’s dual emphasis on large-model research and
    applied commercialization. Public governance detail, however, is much thinner than the founder biography. The
    official site signals Wang Ke as co-founder and COO, while registry records show Wang Ke as manager and legal
    representative for the Beijing operating entity, with Tao Mei listed as director and apparent actual controller
    or beneficial owner. Qichacha further shows that the Beijing company is wholly owned by a Hefei holding entity,
    which is directionally consistent with the city-backed capital story but still not a substitute for a clean
    cap table or board roster. Public evidence does not disclose a current board list, committee structure, or decision-rights
    framework, so underwriting still depends heavily on a founder-centric interpretation of the organization.
  claimRefs:
  - CO002
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
