company:
  name: HiDream.ai
chapter:
  number: 1
  title: Company Overview
  summary: HiDream.ai is a Beijing-registered multimodal AI company founded in March 2023 around Tao Mei and a research-heavy
    team, with visible products in enterprise APIs, marketing, film, and consumer creation. Public evidence supports
    a July 2026 RMB 1.5 billion Series C, more than RMB 2.1 billion raised across three quick rounds, and unusually
    deep state-backed plus media-industry capital support, but public governance detail, headcount, and audited
    financial disclosure remain thin.
sections:
- id: identity-products-and-operating-scope
  title: Identity, product surface, and operating scope
  body: 'HiDream.ai’s official materials frame the company as a global multimodal generative AI platform rather
    than a single-model lab. The About page says the company was founded in March 2023 to build multimodal foundation
    models and AI applications, while the homepage pushes a broader “where AI meets creativity” identity that spans
    text, image, video, and 3D. The product set matters because it already divides into monetizable surfaces rather
    than a pure research narrative. HiHarness is positioned as an enterprise MaaS layer with 200-plus APIs, 100-plus
    key accounts, and 500-plus billion API calls; HiBurst targets marketing workflows; Zhenzan targets professional
    film production; vivago is the mass-market creator app; and HiDreamFans points at offline holographic marketing
    hardware. That breadth supports the idea that HiDream is trying to become a full-stack visual-AI operating layer.
    It also explains why the company markets “native omni-modal world models”: its current product set already ties
    model development to marketing, entertainment, and creator use cases where temporal and spatial consistency
    matter commercially.'
  claimRefs:
