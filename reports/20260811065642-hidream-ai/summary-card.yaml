  topStrengths:
    - >-
      Strong strategic syndicate combining state-backed, bank-affiliated, and film-industry capital around a clear
      multimodal AI platform thesis.
    - >-
      Real product proof through open-source releases, benchmark visibility, third-party hosting, and visible
      enterprise/API distribution signals.
    - >-
      Broad commercial surface area across APIs, media workflows, and creator tools that makes HiDream more than a
      single-feature demo story.
  topRisks:
    - >-
      Public evidence still does not disclose audited revenue, margins, burn, retention, or cap-table terms, making
      precise price support impossible.
    - >-
      The current valuation can only be defended if strategic partnerships and activity metrics convert into
      high-quality recurring monetization.
    - >-
      2026 AI capital markets remain open but more selective, increasing downside for opaque companies if growth proof
      lags valuation.
    - >-
      Open-source distribution and aggressive ecosystem expansion may broaden reach while simultaneously reducing
      scarcity and pricing power.
  unresolvedGaps:
    - >-
      Exact post-money valuation, liquidation preferences, anti-dilution protections, and any insider secondary overhang
      remain undisclosed.
    - >-
      No public revenue bridge yet links users, key accounts, or API calls to recurring enterprise revenue, retention,
      or gross margin.
    - >-
      A DCF-grade model is still impossible without management financials, cash-flow detail, and compute-cost
      disclosure.
    - >-
      Strategic channel partnerships with Shanghai Film and Huace still need contract-value and renewal evidence before
      they can justify a premium valuation.
