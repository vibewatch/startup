evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-and-cap-table
    missingEvidence: >-
      A current board roster, committee map, and full post-Series-C cap table with ownership percentages and investor
      rights.
    whyItMatters: >-
      The public record supports founder identity and round participants but not the actual control framework or
      dilution stack behind the new unicorn valuation.
    diligencePath: Request the latest organizational chart, board materials, and cap table from management or lead investors.
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-confirmed current employee count and function split.
    whyItMatters: >-
      Registry snapshots show inconsistent insured-person figures and do not support a clean staffing or burn-rate
      inference.
    diligencePath: Ask for the current employee roster by function and month-end headcount bridge versus insured-person filings.
  - type: missing-source
    severity: minor
    topic: leadership-roster
    missingEvidence: Public biographies for the broader executive team beyond Tao Mei and Wang Ke.
    whyItMatters: >-
      Founder strength is evident, but later underwriting needs a more complete view of execution depth and succession
      risk.
    diligencePath: Collect executive bios from management, investor materials, or later company disclosures.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: metric-definition
    missingEvidence: Definitions and cohort detail behind professional users, enterprise customers, key accounts, and API-call volumes.
    whyItMatters: >-
      The public narrative contains multiple scale metrics that likely measure different things, which can materially
      alter the company-overview interpretation.
    diligencePath: >-
      Ask for metric definitions, time windows, paying versus non-paying splits, and customer concentration for each
      headline KPI.
  - type: private-evidence-only
    severity: material
    topic: sam-by-segment
    missingEvidence: What is HiDream.ai’s bottom-up serviceable available market by segment and geography?
    whyItMatters: >-
      Public sources provide only broad market studies and company product descriptions, not a defensible bottom-up SAM
      by workflow or region.
    diligencePath: >-
      Request internal segment sizing by API, marketing, film/media, and consumer creation with assumptions and geo
      splits.
  - type: private-evidence-only
    severity: material
    topic: paying-customer-definition
    missingEvidence: How much of the reported 40K enterprise-customer footprint is paying, active, and recurring?
    whyItMatters: >-
      Public materials cite enterprise-customer scale but do not disclose paying-account definitions, activity
      thresholds, or retention.
    diligencePath: Obtain customer cohort data, paid-account counts, and segment revenue contribution.
  - type: missing-source
    severity: minor
    topic: workflow-production-status
    missingEvidence: Which specific film, media, and marketing workflows are fully commercial versus pilot-stage?
    whyItMatters: >-
      Public partnership announcements are directional but do not quantify production deployment, budget size, or
      renewal behavior.
    diligencePath: Review live deployments, case studies, ACVs, and renewal/expansion data by segment.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: What are current inference-unit economics and compliance costs by product line?
    whyItMatters: >-
      Public market sources describe price competition and regulation, but HiDream discloses no segment-level gross
      margin or compliance-cost data.
    diligencePath: Request contribution margin by product, compute supplier mix, and compliance tooling cost stack.
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Named public win/loss case studies comparing HiDream directly against Runway, Veo, Kling, or other peers in live
      buying processes.
    whyItMatters: >-
      Without real selection outcomes, the competitive narrative leans on positioning, benchmarks, and packaging rather
      than proven conversion advantage.
    diligencePath: Request deal-level win/loss analysis, reference calls, and customer alternatives considered.
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Comparable enterprise/API price cards, discounting norms, and support terms across HiDream and major rivals.
    whyItMatters: >-
      Competitive price power cannot be underwritten cleanly when the public record mixes self-serve subscriptions with
      third-party clip estimates.
    diligencePath: Obtain enterprise proposals, pricing sheets, and margin by product line.
  - type: missing-source
    severity: minor
    topic: competitor-controls
    missingEvidence: Uniform public evidence for compliance, admin controls, and support SLAs across every direct competitor.
    whyItMatters: Enterprise buyers often choose on trust and support more than on raw model quality.
    diligencePath: Collect security, compliance, and admin-product documentation for key peers.
  - type: private-evidence-only
    severity: material
    topic: channel-embedment
    missingEvidence: Data showing how deeply HiDream is embedded in partner distribution or film-production workflows.
    whyItMatters: >-
      Partnership announcements are helpful, but distribution moat depends on recurring workflow embedment, not logos
      alone.
    diligencePath: Request active deployment counts, renewal data, and partner-sourced revenue by account.
  - type: private-evidence-only
    severity: material
    topic: recognized-revenue
    missingEvidence: Recognized revenue, ARR, and revenue mix by product and segment.
    whyItMatters: >-
      Without an audited or management-grade revenue bridge, list prices and activity metrics can be badly
      over-interpreted.
    diligencePath: Request audited revenue by segment plus management ARR definition and reconciliation.
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin, contribution margin, and compute cost by product line.
    whyItMatters: >-
      An inference-heavy multimodal company can look like software on the surface while still having weak unit economics
      underneath.
    diligencePath: Request COGS split, cloud commitments, and contribution analysis per image/video/API unit.
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash balance, monthly burn, and runway months.
    whyItMatters: Capital adequacy cannot be underwritten from fundraising headlines alone.
    diligencePath: Request current cash dashboard, monthly burn bridge, and 12-18 month operating plan.
  - type: missing-source
    severity: minor
    topic: enterprise-price-cards
    missingEvidence: Publicly verifiable enterprise/API list pricing or sample order forms.
    whyItMatters: Most of the visible pricing is consumer-facing, so enterprise monetization quality is hard to assess.
    diligencePath: Obtain sample MSAs, rate cards, and negotiated pricing examples.
  - type: private-evidence-only
    severity: material
    topic: reliability-and-support
    missingEvidence: Uptime, latency, failed-job, moderation, and support SLA metrics across HiHarness and vivago.
    whyItMatters: Feature breadth alone does not establish enterprise or consumer workflow reliability.
    diligencePath: Request service-level dashboards, incident history, and support staffing by product line.
  - type: private-evidence-only
    severity: material
    topic: video-and-world-model-production-readiness
    missingEvidence: >-
      Production-grade evidence that world-model or broader video capabilities are commercially live beyond roadmap
      framing.
    whyItMatters: A large share of the valuation narrative rests on omni-modal ambition rather than only image-generation success.
    diligencePath: Request customer deployments, benchmark data, and roadmap milestones for video/audio/world-model products.
  - type: missing-source
    severity: minor
    topic: enterprise-trust-artifacts
    missingEvidence: Public trust-center materials, certifications, DPA terms, and enterprise security documentation.
    whyItMatters: Enterprise conversion often depends on assurance posture as much as on model quality.
    diligencePath: Collect trust-center docs, audit reports, and security review packets.
  - type: private-evidence-only
    severity: material
    topic: hardware-product-economics
    missingEvidence: Unit economics, maintenance burden, and adoption data for HiDreamFans or any physical deployment product.
    whyItMatters: Offline hardware can carry very different operational risk from software/API products.
    diligencePath: Request bill of materials, support model, deployment counts, and gross-margin assumptions.
  - type: private-evidence-only
    severity: material
    topic: paid-account-quality
    missingEvidence: Active paid creator counts, enterprise paying-account counts, and partner-sourced revenue splits.
    whyItMatters: Headline user and customer numbers cannot be underwritten without knowing who pays and how much.
    diligencePath: Request cohort-level paid-account metrics by product, geography, and channel.
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal cadence, contract length, and app-subscription retention.
    whyItMatters: Customer durability determines whether visible adoption turns into software-quality revenue.
    diligencePath: Request retention dashboards, cohort curves, and contract analytics.
  - type: missing-source
    severity: minor
    topic: named-enterprise-case-studies for TU003 named customer proof table
    missingEvidence: >-
      Independent public case studies with ACV, ROI, or production throughput for named enterprise customers beyond
      strategic partners.
    whyItMatters: Partnership headlines are helpful but do not replace customer reference quality.
    diligencePath: Collect named customer references, deployment summaries, and procurement outcomes.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-and-channel-dependence
    missingEvidence: Revenue concentration by top customer, partner, app store, and geography.
    whyItMatters: Creator-led and partner-led growth can create hidden concentration and policy risk.
    diligencePath: Request top-10 customer concentration, app-store fee exposure, and channel mix by revenue.
  - type: private-evidence-only
    severity: material
    topic: compliance-status for TR001 regulatory and legal risk register
    missingEvidence: >-
      Algorithm filing / security assessment status, content-labeling implementation details, and regulator-facing audit
      workflow.
    whyItMatters: The laws are clear, but underwriting depends on whether HiDream has operationalized them.
    diligencePath: Request filing packets, internal control matrices, and policy owners.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: trust-center-and-security-program
    missingEvidence: >-
      Public or private enterprise trust packet, DPA, SLA, certification roadmap, vulnerability-management process, and
      incident logs.
    whyItMatters: Enterprise conversion and liability exposure depend on assurance readiness.
    diligencePath: >-
      Review security architecture, certifications plan, incident playbooks, and customer security questionnaire
      responses.
  - type: private-evidence-only
    severity: material
    topic: unit-economics-under-compliance-pressure
    missingEvidence: Contribution margin by product, gross margin trend, support cost, moderation cost, and compute cost curve.
    whyItMatters: Price competition plus compliance overhead can destroy economics before demand disappears.
    diligencePath: Request product-level margin bridge and scenario analysis.
  - type: private-evidence-only
    severity: material
    topic: partner-and-customer-concentration
    missingEvidence: Revenue concentration, deployment value, and renewal dependency by strategic partner and major customer.
    whyItMatters: Narrative can overstate diversification if a few logos dominate real economics.
    diligencePath: Request top-customer and top-partner concentration by ARR, usage, and pipeline.
  - type: missing-source
    severity: minor
    topic: incident-and-enforcement-history
    missingEvidence: >-
      Independent public incident reports, enforcement actions, or customer-reported outages tied directly to HiDream
      products.
    whyItMatters: The absence of public negatives may reflect limited disclosure rather than low operational risk.
    diligencePath: Run deeper legal and incident database searches and ask management for incident history.
  - type: private-evidence-only
    severity: material
    topic: cap-table-gap
    missingEvidence: Exact post-money valuation, liquidation preferences, anti-dilution terms, and any insider secondary sale details.
    whyItMatters: A headline unicorn valuation can still produce poor new-money economics if the stack above common is heavy.
    diligencePath: Request the signed term sheet, cap table, and preference waterfall from management or counsel.
    relatedQuestionRefs:
      - QV001
      - QV027
      - QV030
    relatedTableRefs:
      - TV003
      - TV008
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap for TV005 comparable bridge
    missingEvidence: >-
      Revenue by segment, ARR or equivalent recurring-revenue bridge, gross margin, burn, runway, and customer
      concentration.
    whyItMatters: >-
      Without these, the valuation case cannot distinguish software-like economics from activity without cash conversion
      or connect HiDream cleanly to the comparable valuation table.
    diligencePath: >-
      Obtain management financials, audited statements if available, and a KPI bridge tying users and API activity to
      revenue.
    relatedQuestionRefs:
      - QV006
      - QV017
      - QV018
      - QV019
    relatedTableRefs:
      - TV005
      - TV006
      - TV008
  - type: private-evidence-only
    severity: material
    topic: partnership-monetization
    missingEvidence: >-
      Contract values, renewal rates, deployment scope, and attributable revenue from Shanghai Film, Huace, and related
      strategic channels.
    whyItMatters: Strategic investors add valuation support only if they create durable cash flow or data advantages.
    diligencePath: Review partnership contracts, case studies, and revenue attribution for strategic accounts.
    relatedQuestionRefs:
      - QV004
      - QV020
      - QV029
    relatedTableRefs:
      - TV004
      - TV008
  - type: missing-source
    severity: material
    topic: dcf-supportability
    missingEvidence: Any public or privately shareable cash-flow, capex, and working-capital inputs robust enough to support a DCF.
    whyItMatters: A DCF is the cleanest way to test downside and dilution tolerance, but the current record does not support one.
    diligencePath: >-
      Build the model only after receiving a finance package with historical and forecast P&L, cash flow, and capex
      assumptions.
    relatedQuestionRefs:
      - QV017
      - QV018
    relatedTableRefs:
      - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Retention, cohort, payback, and conversion data behind enterprise customers, key accounts, and API-call claims.
    whyItMatters: Activity without retention or monetization quality cannot justify premium valuation multiples.
    diligencePath: Request cohort tables, net retention, minimum commits, and account-level concentration analysis.
    relatedQuestionRefs:
      - QV005
      - QV019
      - QV027
    relatedTableRefs:
      - TV001
      - TV008
