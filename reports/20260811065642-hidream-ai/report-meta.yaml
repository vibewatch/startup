companyProfile:
  summary: >-
    HiDream.ai, formally Beijing Zhixiang Future Technology Co., Ltd., is a Beijing-based multimodal AI company founded in March 2023 around Tao Mei and an operating team spanning research and commercialization. Public evidence shows a broad product stack across foundation models, enterprise APIs, marketing workflows, film-production tools, and creator products, plus a July 2026 RMB 1.5 billion Series C that pushed the company into unicorn territory after more than RMB 2.1 billion of recent financing. The investment case is supported by benchmark credibility, open-source distribution, and unusually strategic state-backed and media-industry capital. The underwriting challenge is economic transparency: public sources still do not disclose the revenue quality, margins, burn, or preference structure needed to treat the current valuation as fully de-risked.
  foundedDate: '2023-03-02'
  founders:
    - name: Tao Mei
      role: Founder and CEO
      background: Former JD.com vice president and former Microsoft Research leader with strong research and commercialization credentials.
      claimRefs: [CO012, CO013]
    - name: Wang Ke
      role: Co-founder / COO signal; legal representative and manager of the Beijing operating entity
      background: Public sources link Wang Ke to operating execution and entity-level management, though exact scope remains under-disclosed.
      claimRefs: [CO014, CO015]
