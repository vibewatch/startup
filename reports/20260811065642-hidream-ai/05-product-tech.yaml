- id: trust-compliance-and-roadmap-balance
  title: Trust, compliance, and roadmap balance
  body: Trust and compliance are the main counterweights to HiDream’s product excitement. China’s generative-AI
    rules and synthetic-media labeling framework clearly apply to public-facing image, video, and audio services,
    so products like vivago and HiHarness need lawful-data, user-agreement, privacy, complaint-handling, and labeling
    capabilities. HiDream at least publishes a global privacy page for vivago, but the reviewed source set does
    not show a mature public trust center, third-party certifications, detailed moderation metrics, or enterprise
    assurance artifacts. The roadmap picture is also uneven. Public releases show rapid iteration—I1, E1, O1, O1-Dev,
    prompt agents, and vivago 2.0—but the clearest proofs are still around image generation, editing, and creator
    tooling. Claims about broader omni-modal world models, video synergy, or future unlimited-length video remain
    strategically interesting but less substantiated as customer-ready product reality. That leaves HiDream with
    a compelling product thesis and a still-open governance and reliability diligence burden.
  claimRefs:
  - CE030
  - CE034
  - CE035
  - CE036
  - CE037
