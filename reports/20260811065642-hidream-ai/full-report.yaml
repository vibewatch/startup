  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              HiDream.ai clears the first test of a serious late-stage AI company: the business is real enough that
              state-backed funds, bank-affiliated capital, film-industry strategics, open-source developers, and
              third-party infrastructure partners are all visible in the public record. The problem is the second test,
              which matters more for valuation. Public evidence does not disclose audited revenue, ARR, gross margin,
              burn, retention, or liquidation terms, so the market is asking investors to underwrite a unicorn-plus
              price mostly from financing momentum, product benchmarks, and activity proxies. Those are helpful, but
              they are not enough for a buy call. The recommendation is therefore Research More. If diligence surfaces
              high-quality recurring enterprise revenue and margin proof, the call can move up quickly; if not, the
              current mark is best treated as a story that still needs economic verification. In other words, the
              opportunity is investable only after evidence improves, not because excitement is high.
            claimRefs:
