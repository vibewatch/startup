      - number: '5.2'
        title: Core technical architecture
        blocks:
          - type: paragraph
            body: >-
              The strongest public technical disclosure is still image-centric, but it is unusually rich for a private
              AI company. HiDream-I1 is documented as a 17B-parameter open-source image foundation model built on a
              sparse Diffusion Transformer with dynamic MoE components and separate image/text encoding before unified
              interaction. HiDream-O1-Image takes a different architectural step by using a pixel-level Unified
              Transformer without external VAEs or disjoint text encoders. That choice matters because management and
              outside coverage explicitly connect UiT to better efficiency and to future image-video synergy. The repos
              also make the company’s product philosophy legible: one architecture should cover generation, editing,
              personalization, long-text rendering, and storyboard-like tasks, while a prompt agent handles latent
              reasoning around layout and physical logic. Public evidence does not prove that this already yields a true
              world-model in production, but it does show a serious attempt to reduce modular handoffs between
              modalities and tasks.
