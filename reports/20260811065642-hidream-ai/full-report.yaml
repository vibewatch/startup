  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      HiDream’s risk vectors are correlated: policy, trust, partner, and competition issues all flow into conversion
      quality, cost structure, and valuation tolerance together.
    data:
      nodes:
        - id: reg
          label: Regulatory obligations
          detail: China AI, data, and cybersecurity rules apply to public-facing multimodal products.
        - id: trust
          label: Thin assurance packaging
          detail: Enterprise trust evidence is not publicly mature.
        - id: partner
          label: Partner concentration
          detail: Marquee strategic relationships carry more narrative weight than disclosed recurring economics.
        - id: competition
          label: Price pressure
          detail: Video-AI competition can force discounting and faster release cycles.
        - id: controls
          label: Higher control cost
          detail: More moderation, rights review, logging, and support effort is required.
        - id: conversion
          label: Slower conversion quality
          detail: Enterprises and partners hesitate or convert at lower quality.
        - id: margin
          label: Margin stress
          detail: Support and compliance costs rise while pricing power is uncertain.
        - id: valuation
          label: Valuation pressure
          detail: Revenue quality and risk discounts worsen at financing time.
      edges:
        - from: reg
          to: controls
          label: Adds governance and labeling burden
        - from: trust
          to: conversion
          label: Procurement friction increases
        - from: partner
          to: conversion
          label: Narrative can outrun broad deployment
        - from: competition
          to: margin
          label: Discounting lowers contribution margin
        - from: controls
          to: margin
          label: Compliance cost rises
        - from: controls
          to: conversion
          label: More friction in release and review
        - from: conversion
          to: valuation
          label: Revenue quality weakens
        - from: margin
          to: valuation
          label: Lower cash-generation credibility
        - from: reg
          to: valuation
          label: Enforcement risk tightens underwriting
        - from: partner
          to: valuation
          label: Concentration discount persists
    claimRefs:
      - CR012
      - CR021
      - CR026
      - CR028
      - CR031
      - CR039
      - CR040
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      HiDream depends on regulators, compute ecosystems, app surfaces, strategic customers, and open-source users whose
      decisions can change commercial outcomes quickly.
    data:
      nodes:
        - id: hidream
          label: HiDream products
          detail: HiHarness, vivago, and multimodal workflow surfaces.
        - id: cac
          label: CAC / PRC regulators
          detail: Set AI, data, cybersecurity, and labeling expectations.
        - id: compute
          label: Compute ecosystem
          detail: Inference cost and availability depend on broader infrastructure.
        - id: apps
          label: App/web surfaces
          detail: Distribution and payment rails for creator acquisition.
        - id: partners
          label: Strategic partners
          detail: BlueFocus, Shanghai Film, Huace, and similar logos shape commercial proof.
        - id: oss
          label: Open-source ecosystem
          detail: Forks and downstream use broaden adoption but reduce control.
        - id: buyers
          label: Enterprise buyers
          detail: Require assurance, support, and repeatable deployment evidence.
      edges:
        - from: cac
          to: hidream
          label: Rules and enforcement posture
        - from: compute
          to: hidream
          label: Cost and uptime inputs
        - from: apps
          to: hidream
          label: Distribution and monetization
        - from: partners
          to: hidream
          label: Proof and concentration
        - from: oss
          to: hidream
          label: Adoption and misuse spillover
        - from: hidream
          to: buyers
          label: Must convert capability into trusted deployment
    claimRefs:
      - CR019
      - CR020
      - CR026
      - CR027
      - CR034
      - CR035
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Flow from financing momentum and product proof to a research-more recommendation constrained by missing economics.
    data:
      nodes:
        - id: capital
          label: RMB 1.5B Series C
          detail: Confirms market appetite and strategic backing.
          tone: positive
        - id: proof
          label: Benchmarks + open-source proof
          detail: HiDream has visible product credibility.
          tone: positive
        - id: channels
          label: API / key-account proxies
          detail: Commercial activity signals are visible.
          tone: positive
        - id: gap1
          label: No public revenue bridge
          detail: No audited revenue, ARR, or retention proof.
          tone: warning
        - id: gap2
          label: No cap-table clarity
          detail: Exact post-money and preferences are not public.
          tone: warning
        - id: market
          label: 2026 market more selective
          detail: Capital still flows, but evidence thresholds are rising.
          tone: warning
        - id: price
          label: Unicorn-plus price
          detail: Supportable only if later disclosure is strong.
          tone: neutral
        - id: call
          label: RESEARCH MORE
          detail: Interesting company; incomplete price support.
          tone: warning
      edges:
        - from: capital
          to: price
          label: supports
        - from: proof
          to: price
          label: supports
        - from: channels
          to: price
          label: supports
        - from: gap1
          to: call
          label: constrains
        - from: gap2
          to: call
          label: constrains
        - from: market
          to: call
          label: tightens bar
        - from: price
          to: call
          label: requires proof
    approximationNotes: Conceptual synthesis only. The flow explains decision logic rather than forecasting a causal valuation model.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV009
      - CV014
      - CV030
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Revenue multiple required to justify the unicorn floor at different hypothetical revenue levels.
    data:
      items:
        - label: $50M revenue
          value: 20
          unit: x revenue
          detail: Implied multiple required for a $1B valuation floor.
        - label: $75M revenue
          value: 13.3
          unit: x revenue
          detail: Still well above most public creative-software references.
        - label: $100M revenue
          value: 10
          unit: x revenue
          detail: Needs strong scarcity or growth-quality proof.
        - label: $125M revenue
          value: 8
          unit: x revenue
          detail: Closer to premium software territory, but still demanding.
        - label: $150M revenue
          value: 6.7
          unit: x revenue
          detail: Approaches the high end of selected public software comparables.
    approximationNotes: >-
      This figure does not claim HiDream has any of these revenue levels. It shows how sensitive the unicorn floor is to
      an undisclosed revenue number.
    claimRefs:
      - CV003
      - CV024
      - CV030
      - CV032
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Bear, base, and bull valuation bands relative to the publicly visible unicorn floor.
    data:
      items:
        - label: Bear
          low: 600
          mid: 750
          high: 900
          unit: $M equity value
          detail: Opaque economics plus multiple compression.
        - label: Base
          low: 900
          mid: 1100
          high: 1300
          unit: $M equity value
          detail: Current floor roughly defendable only with cleaner commercial proof.
        - label: Bull
          low: 1500
          mid: 1900
          high: 2400
          unit: $M equity value
          detail: Requires audited recurring revenue and margin proof.
        - label: Public unicorn floor
          low: 1000
          mid: 1000
          high: 1000
          unit: $M valuation status
          detail: Exact post-money not disclosed; floor shown for orientation only.
    approximationNotes: >-
      Ranges are judgment bands, not a mark-to-model output. They are designed to frame diligence discipline rather than
      replace a data-room model.
    claimRefs:
      - CV003
      - CV035
      - CV036
      - CV037
      - CV038
      - CV043
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of HiDream across product proof, disclosure quality, valuation support, and risk.
    data:
      items:
        - label: Product proof
          value: 8/10
          note: Benchmarks, open-source releases, and multimodal product breadth are real.
        - label: Commercial proxies
          value: 6/10
          note: API and user-scale indicators are visible, but they remain company-framed.
        - label: Investor support
          value: 8/10
          note: The Series C syndicate is unusually strategic and well-capitalized.
        - label: Disclosure quality
          value: 3/10
          note: Public revenue, margin, burn, and cap-table data are still thin.
        - label: Valuation support
          value: 4/10
          note: The price clears in market terms, but intrinsic-value support is incomplete.
        - label: Risk load
          value: 3/10
          note: Selective capital markets and undisclosed economics keep downside meaningful.
    approximationNotes: >-
      Scores are judgmental synthesis, not an algorithm. Lower scores reflect missing valuation support rather than weak
      model capability.
    claimRefs:
      - CV004
      - CV006
      - CV009
      - CV014
      - CV029
      - CV030
      - CV041
      - CV042
      - CV043
