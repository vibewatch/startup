  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk stack
        blocks:
          - type: paragraph
            body: >-
              HiDream’s risk profile is not dominated by one existential red flag; it is dominated by several correlated
              medium-high exposures that could become critical together. The most important are regulatory compliance
              across multimodal public-facing generation, enterprise trust under-disclosure, competitive price pressure,
              and concentration risk in strategic counterparties versus durable recurring revenue. These are more
              important than simple demand risk because public evidence already supports adoption breadth, benchmark
              credibility, and financing access. The problem is that none of those strengths automatically prove safe,
              sticky, or efficiently monetized growth. A company can have strong model reputation and still lose value
              if compliance costs rise, buyers hesitate on trust packaging, or creator and partner channels monetize
              below expectation. That is why the right risk lens for HiDream is residual severity after visible
              mitigation, not raw theoretical danger. Correlation across these risks is the core underwriting
              concern.         No single mitigant clears the stack today on its own.
            claimRefs:
