companyProfile:
  summary: >-
    HiDream.ai, formally Beijing Zhixiang Future Technology Co., Ltd., is a Beijing-based multimodal AI company founded
    in March 2023 around Tao Mei and an operating team spanning research and commercialization. Public evidence shows a
    broad product stack across foundation models, enterprise APIs, marketing workflows, film-production tools, and
    creator products, plus a July 2026 RMB 1.5 billion Series C that pushed the company into unicorn territory after
    more than RMB 2.1 billion of recent financing. The investment case is supported by benchmark credibility,
    open-source distribution, and unusually strategic state-backed and media-industry capital. The underwriting
    challenge is economic transparency: public sources still do not disclose the revenue quality, margins, burn, or
    preference structure needed to treat the current valuation as fully de-risked.
