        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              HiDream’s cost base appears much more like an AI-software and inference company than a traditional
              asset-heavy manufacturer, but that does not make it cheap. Compute intensity, model-refresh cadence,
              moderation or policy controls, creator-support operations, and channel fees are the likely recurring cost
              centers. Market-level evidence also shows why this matters: the infrastructure layer around generative AI
              is much larger than the foundation-model revenue layer, and third-party commentary argues that standalone
              video generation can become uneconomic without stronger downstream monetization. HiDream may have a real
              architectural advantage if the reported UiT efficiency gains hold, yet public evidence is still too thin
              to convert that narrative into gross-margin confidence. No reviewed source provides contribution margin by
              image, video minute, enterprise customer, or subscription cohort. The financial question is therefore not
