      - number: '7.2'
        title: Regulatory, legal, and trust exposure
        blocks:
          - type: paragraph
            body: >-
              The heaviest documented obligations come from China’s AI, cybersecurity, and data laws. The Interim
              Measures clearly cover public-facing text, image, audio, and video generation in China. The Data Security
              Law and Cybersecurity Law add baseline duties around secure operation, logging, incident response, and
              risk assessment. For HiDream, multimodality matters because each additional output type widens the misuse
              and compliance surface. Open-source licensing and commercial-friendly messaging accelerate adoption, but
              they also raise expectations around provenance, rights hygiene, and downstream use. The public record does
              show privacy and terms pages, plus visible licensing transparency on GitHub and Hugging Face. What it does
              not show is the enterprise trust package that larger customers usually want: public certifications, DPA
              flow, SLA posture, or incident transparency. As a result, the regulatory and legal stack is legible, while
