  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product suite and user jobs
        blocks:
          - type: paragraph
            body: >-
              HiDream’s public product story is broader than a single benchmark-winning model. Official materials list
              five product lines—HiHarness, HiBurst, Zhenzan, vivago, and HiDreamFans—spanning enterprise APIs,
              marketing workflows, film or professional content workflows, creator tools, and even offline retail
              hardware. That breadth matters because it reveals how management wants the model stack consumed. HiHarness
              is the clearest enterprise surface, framed around hundreds of APIs, key-account adoption, and large call
              volume. vivago is the clearest self-serve creator surface, packaging multi-model access, templates, and
              agentic editing. HiDreamFans extends the thesis into offline customer-acquisition tooling, while HiBurst
              and Zhenzan anchor the marketing and media workflows that strategic investors appear to care about. The
              unifying job-to-be-done is not just image generation. It is faster multimodal content production across
              creators, marketers, and media operators, with a long-term ambition to turn the same core model estate
              into a broader omni-modal workflow platform.
