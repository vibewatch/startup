    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Exact valuation comes with heavy preferences
        - >-
          Multiple liquidation preferences, punitive anti-dilution, or a large insider secondary overhang appear in
          diligence.
        - A superficially acceptable headline mark can become unattractive for new common or late preferred investors.
        - Re-cut upside net of overhang before proceeding.
      - - Revenue quality is weaker than activity metrics imply
        - Management cannot bridge key accounts, API calls, or user counts to recurring paying revenue and retention.
        - Breaks the argument that strategic and product proof justify a software-like premium.
        - Shift to bear case or pause.
      - - Pricing pressure outruns model advantage
        - HiDream must keep discounting to win usage while margins stay unproven.
        - Turns benchmark wins into low-quality growth rather than durable cash flow.
        - Do not pay unicorn-plus multiples without offsetting margin evidence.
      - - Strategic partnerships do not convert into monetization
        - Film/media logos remain narrative assets instead of contract or cohort proof.
        - Eliminates a key reason to underwrite a premium over generic open-source labs.
        - Lower valuation band and defer entry.
      - - Exit process starts before disclosure catches up
        - A crossover or IPO-style process begins without filing-grade financial and cap-table detail.
        - Public or quasi-public investors will apply a disclosure discount or walk.
        - Stay research-more until the package improves.
    notes: >-
      Each trigger is chosen because it can be checked in diligence or from later disclosures and because it directly
      changes valuation support, not just general company quality.
