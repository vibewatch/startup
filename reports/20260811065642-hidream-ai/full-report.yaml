      - number: '1.3'
        title: Capital base, investor mix, and scale signals
        blocks:
          - type: paragraph
            body: >-
              The company’s July 2026 financing cadence is the strongest late-stage signal in the public record.
              Multiple sources agree that HiDream.ai closed a RMB 1.5 billion Series C in late July and exceeded RMB 2.1
              billion of cumulative financing across three rounds completed in about three months. The investor mix is
              unusually telling. The round combined national and provincial state-backed funds, bank-affiliated capital,
              and media-industry investors such as Shanghai Film New Vision Fund and Huace Film & TV. That mix implies
              investors are underwriting HiDream less as a generic app startup and more as domestic AI infrastructure
              with direct industrial application paths. Public scale signals exist, but they are uneven. The financing
              press release cites more than 50 million professional users and more than 40,000 enterprise customers
              across 100-plus countries, while the homepage foregrounds 100-plus key accounts and 500-plus billion API
              calls. Those are all useful indicators of commercial activity, but they are still company-framed numbers
              without audited financials, cohort detail, or a reliable headcount disclosure.
