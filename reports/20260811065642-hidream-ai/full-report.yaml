      - number: '7.3'
        title: Operational, dependency, and execution risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, HiDream looks less exposed to hardware-supply drama than to reliability, compute economics,
              and commercialization quality. The company’s own homepage claims 500+ billion API calls and 100+ key
              accounts, which means outages, abuse-control failures, or weak support tooling would have material
              downstream effects. The compute environment in China is improving, but that does not eliminate cost or
              availability risk; it mostly changes where pressure appears. Price competition in Chinese video AI remains
              intense, and public category evidence still points to immature ARR at the sector level. Strategic
              partnerships with BlueFocus, Shanghai Film, and Huace create valuable proof, but they also highlight
              dependency on turning a few important relationships into repeatable commercial programs. The human
              bottleneck is therefore executional: security, compliance, customer success, solution architecture, and
              legal coordination need to mature in step with model and product ambition. Scale can magnify small process
              weaknesses quickly.
            claimRefs:
