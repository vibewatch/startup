  - id: TV008
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Exact post-money and cap table
        - >-
          Precise valuation, share classes, liquidation preferences, anti-dilution mechanics, and any insider secondary
          terms
        - Determines whether the round is actually attractive for a new investor at the headline price.
        - Finance + legal diligence in the data room.
      - - Revenue quality bridge
        - >-
          Segment revenue, customer concentration, retention, renewal, churn, and the link from API or user activity to
          paid usage
        - Without it, valuation rests on activity proxies rather than monetization quality.
        - Management Q&A plus finance workstream.
      - - Margin and compute economics
        - >-
          Gross margin by segment, GPU commitments, hosting costs, and evidence that model efficiency improvements
          survive real-world deployment
        - Tests whether HiDream is becoming software-like or staying capital-hungry.
        - Technical diligence plus CFO model review.
      - - Partnership monetization
        - >-
          Contract values, deployment scope, and renewal evidence for Shanghai Film, Huace, and related strategic
          channels
        - Shows whether strategic investors are real revenue channels or primarily narrative support.
        - BD / product diligence with contract review.
      - - IPO / crossover readiness
        - Filing-grade disclosures, governance package, board structure, and controls posture
        - A higher future mark or exit depends on investors believing the business can withstand public-market scrutiny.
        - Legal, audit, and governance diligence.
    notes: >-
      These asks are the shortest route from a compelling narrative to an underwritable asset. The current
      recommendation should not change until most of them are answered.
