  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Defining the real market boundary
        blocks:
          - type: paragraph
            body: >-
              HiDream should not be underwritten against the full generative-AI headline market without boundary logic.
              Public evidence shows a more specific commercial footprint: enterprise APIs through HiHarness,
              marketing-production software through HiBurst, entertainment workflows through Zhenzan, and creator
              subscriptions through vivago. Those surfaces all sit inside multimodal visual-generation markets, but they
              do not cover most text-only copilots, search agents, or infrastructure hardware revenues that inflate
              generic TAM charts. The practical implication is that HiDream participates in at least three adjacent
              layers at once: foundation-model capability, developer/API enablement, and end-user application revenue.
              That layered position is attractive because it widens monetization options, but it also complicates
              sizing. The correct market frame is therefore multimodal content-generation workflows, especially image,
              video, audio, and creative-orchestration software, rather than ‘all AI’ or a narrow image-model benchmark
              niche.
