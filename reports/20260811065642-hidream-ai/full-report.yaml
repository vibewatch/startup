      - CU023
      - CU024
      - CU031
      - CU032
      - CU039
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: standard
    summary: >-
      Public demand starts from visible product or partnership surfaces and only later becomes recurring spend if trust
      and results hold.
    data:
      nodes:
        - id: surface
          label: Public surface
          detail: Users or counterparties discover vivago, HiHarness, or HiDream partnership activity.
        - id: trial
          label: Trial / evaluation
          detail: Creator tests free or low-cost features; partner or enterprise evaluates workflow fit.
        - id: value
          label: Task success
          detail: A useful video, asset, or workflow output proves basic value.
        - id: paid
          label: Paid conversion or strategic rollout
          detail: User buys a plan or partner decides to operationalize cooperation.
        - id: repeat
          label: Repeat usage / renewal
          detail: Only repeat use or deployment can turn headline adoption into durable customer quality.
      edges:
        - from: surface
          to: trial
        - from: trial
          to: value
        - from: value
          to: paid
        - from: paid
          to: repeat
