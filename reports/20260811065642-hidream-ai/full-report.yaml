  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Where HiDream actually competes
        blocks:
          - type: paragraph
            body: >-
              HiDream is not competing in one clean lane. Public evidence places it simultaneously in image-model
              benchmarking, open-source developer mindshare, creator-platform software, and emerging film/marketing
              workflow tooling. That mixed position matters because the reference set changes by buyer. On the image
              side, HiDream competes with both closed and open model leaders on quality. On the creator side, vivago
              competes with simple consumer tools and with aggregators that route to multiple best-in-class models. On
              the enterprise and film side, the company competes against workflow platforms, internal build-outs, and
              vendors with stronger compliance or distribution. The result is a company with many avenues to relevance
              but no single protected beachhead yet visible in public sources. Its sharpest public edge remains
              visual-model quality plus open-source credibility, not ownership of the dominant demand channel. This also
              means comparisons that treat HiDream as merely another image model or merely another video app miss how
              management is trying to ladder users from benchmark awareness into software usage and then into
              industry-specific workflows.
            claimRefs:
