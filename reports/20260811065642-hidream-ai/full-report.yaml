  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - risk
      - monitorable trigger
      - threshold/event
      - action implication
    rows:
      - - Regulatory compliance gap
        - Evidence of enforcement, delisting, takedown, or missing filing readiness
        - Any material enforcement action or inability to show operating controls
        - Pause underwriting until compliance readiness is demonstrated
      - - Enterprise trust gap
        - Trust artifacts remain absent while enterprise push continues
        - No DPA, certifications roadmap, security packet, or SLA posture for large accounts
        - Assume slower B2B conversion and lower-quality revenue mix
      - - Price compression / margin stress
        - Commercial growth comes with heavier discounts or rising support burden
        - Repeated price cuts, creator-heavy mix, or no margin evidence despite volume growth
        - Reduce revenue-quality assumptions and apply higher risk discount
      - - Strategic-counterparty concentration
        - Revenue or deployment value clusters in a few logo partnerships
        - Top-partner concentration remains high without broad named customer expansion
        - Treat customer story as concentrated and fragile
      - - Cross-border and data-governance gap
        - Global usage expands without localized data or policy controls
        - Management cannot map data flows, regional controls, or incident obligations
        - Raise compliance discount and limit underwriting confidence
