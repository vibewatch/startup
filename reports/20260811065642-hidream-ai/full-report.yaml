      - number: '3.3'
        title: Pricing, packaging, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging support a nuanced read. HiDream can point to accessible self-serve pricing through
              vivago and to a broad creator feature set, but the product’s own differentiation partly comes from
              packaging third-party models. That is attractive for acquisition because users want choice and fast
              results, yet it raises the chance that buyers will multi-home rather than lock into HiDream’s stack.
              Third-party comparisons suggest Chinese video rivals compete aggressively on per-clip price, while premium
              Western stacks often compete on higher-end quality or control. Just as important, public sources do not
              provide a clean apples-to-apples enterprise list-price comparison for the major rivals, which limits hard
              conclusions about sustainable pricing power. In practice, the current market appears fluid: users route by
              task, price, and reliability, and that behavior keeps switching costs lower than in mature software
              categories. That dynamic usually rewards the company that best simplifies orchestration, support, and
              repeat workflow value instead of merely posting the newest model score.
