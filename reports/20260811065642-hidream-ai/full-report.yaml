      - number: '2.2'
        title: Sizing lenses are useful but not interchangeable
        blocks:
          - type: paragraph
            body: >-
              Available market studies confirm a large and fast-growing backdrop, but they disagree sharply because they
              measure different things. Grand View’s 2026 estimate is USD 29.6 billion, Fortune’s is USD 161 billion,
              and ResearchAndMarkets carves out only USD 4.1 billion for foundation-model revenues in 2024 while
              assigning far more value to platforms and hardware. For HiDream, that spread is not noise; it is the
              signal that the market must be decomposed before it can be valued. A company selling both models and
              applications should not be benchmarked only to the narrow foundation-model pool, yet it also should not
              inherit hardware revenues or every text-generation workload. The usable takeaway is that demand is clearly
              expanding and that software/application capture is real, but precise SAM/SOM still needs bottom-up work by
              workflow, geography, and buyer budget. Until then, range-based sizing is more honest than a single heroic
              TAM number.
