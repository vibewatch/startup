      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              HiDream’s moat story is credible but still conditional. Open-source image leadership can strengthen
              developer reputation; media partnerships can open differentiated use cases; and multimodal/world-model
              branding helps attract capital and attention. The adverse side is equally important. Open source can speed
              imitation, routing layers depend on upstream model access, and public partnerships do not prove durable
              customer capture. Meanwhile, category ARR appears modest relative to the amount of experimentation and
              capital flowing into video AI, suggesting the market is becoming crowded before standards are set. That
              combination usually compresses vendor power unless one player controls distribution, embeds deeply into
              workflow, or produces obviously superior outcomes. HiDream may reach that status later, but today’s public
              evidence supports a competitive position that is promising and expanding rather than entrenched and
              defensible. A stronger conclusion would require actual customer selections, expansion behavior, and
              evidence that film or marketing partners cannot easily replace HiDream with other models routed through
              similar workflow shells.
