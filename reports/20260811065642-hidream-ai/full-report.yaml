      - number: '8.3'
        title: Comparables, scenario ranges, and the DCF gap
        blocks:
          - type: paragraph
            body: >-
              The valuation triangulation is straightforward in principle and frustrating in practice. Public creative
              and software comps span roughly 0.2x to 6.2x revenue in the current market, while AI fundraising datasets
              still describe private rounds at much richer 24x-plus median revenue multiples. HiDream sits between those
              worlds: it has stronger technical and strategic signals than a declining stock-image platform, but far
              less public financial proof than the kind of enterprise software business that sustains a premium public
              multiple. Because HiDream has not disclosed revenue or ARR publicly, a classical DCF is not defensible.
              The only responsible method is scenario analysis: ask what evidence would justify the unicorn floor, what
              evidence would support a higher band, and what failures would collapse the premium. At a $1 billion floor,
              the required revenue multiple ranges from roughly 20x at $50 million of revenue to 6.7x at $150 million,
              which shows just how sensitive the mark is to a single missing number.
