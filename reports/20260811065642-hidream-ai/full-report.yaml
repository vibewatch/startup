  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Residual risk clusters around compliance execution, trust under-disclosure, competition-led margin pressure, and
      partner concentration rather than simple product demand.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
