    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product surface, and operating scope
        blocks:
          - type: paragraph
            body: >-
              HiDream.ai’s official materials frame the company as a global multimodal generative AI platform rather
              than a single-model lab. The About page says the company was founded in March 2023 to build multimodal
              foundation models and AI applications, while the homepage pushes a broader “where AI meets creativity”
              identity that spans text, image, video, and 3D. The product set matters because it already divides into
              monetizable surfaces rather than a pure research narrative. HiHarness is positioned as an enterprise MaaS
              layer with 200-plus APIs, 100-plus key accounts, and 500-plus billion API calls; HiBurst targets marketing
              workflows; Zhenzan targets professional film production; vivago is the mass-market creator app; and
              HiDreamFans points at offline holographic marketing hardware. That breadth supports the idea that HiDream
              is trying to become a full-stack visual-AI operating layer. It also explains why the company markets
              “native omni-modal world models”: its current product set already ties model development to marketing,
              entertainment, and creator use cases where temporal and spatial consistency matter commercially.
