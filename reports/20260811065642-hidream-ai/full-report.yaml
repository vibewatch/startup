      - number: '7.4'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              HiDream does have mitigating factors. It is unusually transparent for a young model company about product
              scope, open-source licensing, and parts of the technical stack. China’s compute build-out and the
              company’s strong capital access also reduce near-term survival risk. Still, the decisive missing evidence
              is operational proof: trust artifacts, retention-grade customer quality, concentration disclosure, and
              unit economics that hold under compliance and pricing pressure. Investors should therefore monitor a short
              list of public and private triggers. If the company can show enterprise trust materials, stable conversion
              from strategic pilots to production, and no evidence of margin collapse, several current discounts would
              narrow. If instead regulatory requirements harden, partner concentration rises, or pricing pressure forces
              uneconomic growth, the thesis should be cut quickly. This is a risk stack that is manageable only if
              monitored actively and cleared with evidence, not optimism. The bar for confidence should rise with every
              financing round, especially as the company moves from proof to scale.
            claimRefs:
