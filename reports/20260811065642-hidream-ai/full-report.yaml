            body: >-
              HiDream’s customer base should be segmented by access surface, not by one aggregate headline. Public
              evidence points to at least five distinct customer groups: enterprise API teams using HiHarness, marketers
              and commerce operators using HiBurst-style workflows, film or media institutions working through strategic
              cooperation, creator or prosumer users entering through vivago, and potentially offline retail operators
              targeted by HiDreamFans. The buyer-user-payer split is different in each segment. Creators often self-pay
