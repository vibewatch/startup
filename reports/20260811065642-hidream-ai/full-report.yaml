  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      HiDream attracts customers through creator, partner, and enterprise entry points that eventually require proof of
      workflow value before durable monetization.
    data:
      items:
        - stage: Discovery
          actors:
            - Creator
            - Developer
            - Partner scout
          touchpoints:
            - vivago web/mobile
            - official homepage
            - news and partnerships
          emotion: Curiosity is driven by free plans, creator tools, and partnership headlines
          label: Discovery
        - stage: First successful output
          actors:
            - Creator
            - Marketing operator
            - Technical evaluator
          touchpoints:
            - image/video generation
            - templates
            - API demo
          emotion: Value is proven when a user gets one useful content or integration result
          label: First successful output
        - stage: Paid or strategic commitment
          actors:
            - Subscriber
            - Team owner
            - Media counterpart
          touchpoints:
            - subscriptions
            - credits
            - strategic cooperation
          emotion: Users or partners decide whether the product is worth deeper commitment
          label: Commitment
        - stage: Workflow embedding
          actors:
            - Paid creator
            - Enterprise team
            - Media production team
          touchpoints:
            - repeat generation
            - campaign use
            - production workflow
          emotion: Stickiness forms only if outputs become part of regular work
          label: Embedding
        - stage: Expansion or churn
          actors:
            - Budget owner
            - Partner
            - Subscriber
          touchpoints:
            - renewal
            - higher usage
            - more seats or projects
          emotion: Customer quality depends on retention, not on one-off adoption
          label: Expansion or churn
