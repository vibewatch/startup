- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Free plan and daily credits
    - Large creator top-of-funnel may convert poorly
    - Inflates usage without proving durable revenue
    - Request funnel metrics from free user to subscriber to heavy user
  - - Tiered subscriptions and credits
    - Consumer spend can be volatile and refund-sensitive
    - Raises churn and support risk
    - Review refunds, chargebacks, and net revenue after channel fees
  - - AI-agent upsell inside vivago
    - Power-user features may lift ARPU but serve a narrower audience
    - Upsell may be real but concentrated
    - Request attach rates for Chat Agent and HiDreamClaw features
  - - Media partnerships
    - Revenue may cluster around a few strategic counterparties
    - Lumpy deployment can distort customer-quality view
    - Request partner-sourced revenue, deployment counts, and renewal terms
  - - Enterprise API and workflow adoption
    - Trust and procurement friction may slow larger contracts
    - Enterprise mix may underperform the narrative
    - Review security packets, SLA posture, and pipeline stage conversion
  - - Cross-border marketing workflows
    - Platform/ecosystem dependence can increase concentration and policy risk
    - Channel changes can disrupt demand quickly
    - Map channel dependence by geography and platform
  notes: HiDream has multiple visible expansion loops, but the current source set suggests most of them still need
    proof of stickiness and economic quality.
