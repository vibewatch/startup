- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer/user/payer
  - use case
  - scale
  - revenue/strategic value
  - gap
  rows:
  - - Enterprise API / HiHarness
    - Product or IT owner / developers / company budget
    - Integrate multimodal generation into products and workflows
    - 100+ key accounts publicly claimed
    - Potentially highest-value recurring B2B layer
    - No disclosed paying-account count or contract size.
  - - Marketing / commerce operators
    - Brand or agency lead / operators / marketing budget
    - Bulk content, campaign assets, short-form promotional video
    - HiBurst activity plus BlueFocus cooperation
    - Connects models to monetizable marketing workflows
    - Named paying-customer list not public.
  - - Film / media institutions
    - Studio or media group / production teams / corporate budget
    - IP development, AI content production, marketing, standards, labs
    - Named Shanghai Film and Huace strategic proofs
    - Strategically valuable for premium workflows and sector credibility
    - Commercial scale and recurring spend undisclosed.
  - - Creators / prosumers
    - Individual user / same / self-pay or free plan
    - Text-to-video, image-to-video, templates, AI-assisted creation
    - Web + iOS + Android surfaces with public pricing
    - Largest visible top-of-funnel and clearest public monetization rail
    - Retention and paid conversion unavailable.
  - - Business SMB users
    - Owner or marketer / creator-user / SMB budget
    - Promo videos, product visuals, avatar content
    - Business Wire use cases for retailers and brands
    - Could bridge from consumer product into higher-value commercial use
    - No named SMB case studies or spend data.
  notes: This segmentation separates strategic proofs from self-serve adoption and enterprise API usage, because
    they imply very different customer quality and margin profiles.
