  - FU004
- id: retention-durability-and-evidence-gaps
  title: Retention, durability, and evidence gaps
  body: The largest gap in the customer chapter is durability. Public sources show that HiDream can attract users
    and partners, yet they do not show whether those users stay, expand, and produce high-quality revenue. The App
    Store rating is directionally positive, and the detailed vivago product page describes free plans, multiple
    tiers, credits, and agent upsell paths, all of which imply a deliberate product-led funnel. But these signals
    still do not reveal paid conversion, churn, cohort behavior, NRR, or contract length. Nor do they reveal how
    much of the claimed enterprise base is active or strategically important. Even the strongest visible named proofs—BlueFocus,
    Shanghai Film, and Huace—do not disclose revenue contribution or renewal cadence. The result is a customer story
    with breadth and momentum but with limited public evidence on repeat economics. For diligence purposes, that
    means the next questions should focus on cohort quality rather than just customer-count magnitude.
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU029
  - CU031
  - CU033
  - CU037
  - CU039
  - CU040
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: expansion-and-concentration-risk
  title: Expansion and concentration risk
  body: 'HiDream has several plausible expansion loops, but each comes with concentration risk. A free or low-cost
    creator funnel can expand into subscriptions, credits, and heavier agent usage. Media and marketing partnerships
    can expand into higher-value deployment if workflows go live at scale. Enterprise API adoption can grow if trust
    and support clear procurement hurdles. The adverse side is that each loop is fragile in a young category. Creator
    demand can churn quickly, partner-driven revenue can be lumpy, and enterprise conversion can stall if assurance
    packaging remains thin. Broader market evidence reinforces the caution: the AI video sector is still early in
    monetization, and Chinese winners often rely on distribution and price rather than on long-proven retention.
    That does not negate HiDream’s adoption progress; it simply means current public evidence supports customer
    momentum more than customer durability. The underwriting task is to separate breadth from stickiness.'
  claimRefs:
