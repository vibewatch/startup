- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named proof
  body: The company’s public adoption narrative has enough substance to take seriously, but not enough detail to
    underwrite cleanly. Financing coverage repeatedly claims more than 50 million professional users, more than
    40,000 enterprise customers, and reach across over 100 countries and regions. Those numbers suggest scale rather
    than a pre-commercial experiment, and they are reinforced by visible creator surfaces, app-store pricing, and
    HiBurst activity claims. Named proof is strongest in partnerships. BlueFocus is the clearest marketing-sector
    proof. Shanghai Film and Huace show HiDream has broken into film and TV institutions at a strategic level. These
    are meaningful because they indicate actual workflow interest from large sector participants. At the same time,
    they are not the same thing as public procurement case studies with contract value, seat expansion, or recurring
    usage. So the public record supports real adoption and serious strategic counterparties, but it still leans
    more toward ecosystem proof than toward classic enterprise customer disclosure.
  claimRefs:
  - CU004
  - CU005
  - CU012
  - CU013
  - CU014
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
