company:
  name: HiDream.ai
chapter:
  number: 6
  title: Customers
  summary: 'HiDream.ai has credible public adoption signals across creators, enterprise APIs, and strategic media/marketing
    partnerships, with BlueFocus, Shanghai Film, and Huace standing out as named institutional proof. The main gap
    is durability: public evidence does not yet show how many customers pay meaningfully, renew, or concentrate
    revenue, so the customer story is stronger on breadth and momentum than on retention quality.'
sections:
- id: segmentation-and-entry-surfaces
  title: Segmentation and entry surfaces
  body: 'HiDream’s customer base should be segmented by access surface, not by one aggregate headline. Public evidence
    points to at least five distinct customer groups: enterprise API teams using HiHarness, marketers and commerce
    operators using HiBurst-style workflows, film or media institutions working through strategic cooperation, creator
    or prosumer users entering through vivago, and potentially offline retail operators targeted by HiDreamFans.
    The buyer-user-payer split is different in each segment. Creators often self-pay or experiment via free credits.
    Enterprise usage likely starts with technical users while budgets sit with product or IT owners. Media partnerships
    can mix capital, co-development, and future workflow deployment. This matters because headline figures like
    “40,000 enterprise customers” and “50 million professional users” almost certainly bundle together very different
    behaviors, price points, and contract qualities. The cleanest public acquisition channel is vivago, because
    it is visible across web and mobile, shows pricing tiers, and can convert free experimentation into paid plans
    or credits.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU006
  - CU008
