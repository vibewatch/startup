- id: growth-drivers-and-constraints
  title: Growth drivers and constraints
  body: The demand side is strong. Stanford documents rapid population and organizational adoption, while multiple
    market studies point to sustained double-digit or higher growth across software and marketing use cases. Competition
    is equally strong. Global leaders like Runway and Veo compete on quality and creative control, while Chinese
    video labs compete aggressively on price, speed, and platform distribution. HiDream therefore benefits from
    a fast-growing category but operates in a brutally contested one. Two constraints stand out. First, Chinese
    regulation and synthetic-media labeling can slow distribution or increase compliance cost for public-facing
    video and audio products. Second, model economics remain heavily exposed to compute and platform layers that
    are much larger than application revenues. The bullish case is that HiDream can use open-source, workflow packaging,
    and strategic investors to climb into commercial budgets quickly; the skeptical case is that the company still
    has to prove segment leadership, compliance execution, and durable unit economics within its real serviceable
    market. That is especially relevant for a private Chinese company whose public disclosures still emphasize milestones
    and partnerships more than recurring segment economics, retention cohorts, or margin history.
