- id: buyer-user-payer-segmentation
  title: Buyer, user, and payer segmentation
  body: 'HiDream’s product stack spans multiple buyer archetypes. In enterprise API deployments, the user may be
    an application team while the payer is a product, IT, or platform budget owner. In marketing workflows, creators
    and operators use the tooling but brand, e-commerce, or agency leaders usually own spend. In entertainment,
    producers and studio leads pay for workflow acceleration while artists, editors, or animation teams are the
    day-to-day users. vivago adds a self-serve subscription tier where the user and payer can collapse into one
    creator account. This segmentation matters because adoption triggers differ: enterprises care about integration,
    reliability, and governance; marketers care about asset velocity and ROI; studios care about controllability
    and fidelity; consumers care about breadth, templates, and price. HiDream’s advantage is that one model base
    can feed all four surfaces, but success in one segment does not guarantee dominance in the others.'
