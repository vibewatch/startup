tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Foundation-model licensing and API inference
    - Usage-based API revenue, model licensing, workflow inference sold via HiHarness
    - GPU sales, cloud infrastructure resale, text-only copilots
    - Enterprise product/IT teams
    - Core because HiHarness commercializes model access.
  - - Marketing and commerce content software
    - Creative generation, campaign assets, product imagery, ad-video workflows via HiBurst
    - Generic martech suites without creation layer
    - Brand, e-commerce, and agency budgets
    - High relevance because HiBurst maps directly to spend pools.
  - - Film / media production tooling
    - Previs, concept art, video generation, animation or production acceleration via Zhenzan
    - The full global box office, streaming subscriptions, or camera hardware
    - Studios, producers, media groups
    - High relevance given Shanghai Film and Huace linkages.
  - - Creator subscription software
    - vivago subscriptions, template packs, creator-tool upsell
    - General social-media ad spend or gaming spend
    - Individual creators / small teams
    - Relevant as a distribution and data surface, but lower ARPU.
  - - World-model R&D option value
    - Future simulation and richer multimodal control if commercialized
    - Treating speculative world-model value as present revenue
    - Strategic investors / future enterprise buyers
    - Strategically important but not yet a clean current-market bucket.
  notes: The boundary deliberately excludes most text-only AI, hardware, and generic cloud spend while preserving
    HiDream’s mixed model-plus-application position.
