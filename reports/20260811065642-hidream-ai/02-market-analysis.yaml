- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Rapid user adoption of GenAI
    - positive
    - now
    - Lowers education burden for creator products and pilots
    - What share of vivago users convert to paid?
  - - Enterprise experimentation at 88% adoption
    - positive
    - now
    - Improves odds of API and workflow trials
    - How many of the 40K enterprise customers are paying and active?
  - - Media / entertainment demand
    - positive
    - now-to-medium term
    - Supports Zhenzan and film partnerships
    - Which production workflows are live versus pilot?
  - - Chinese price advantage in video AI
    - positive/negative
    - now
    - Can accelerate demand but compress margins
    - What is contribution margin by generated minute or image?
  - - Vertical integration by rival platforms
    - negative
    - now
    - Distribution-rich rivals may outscale standalone labs
    - How does HiDream access distribution without owning a giant content app?
  - - Synthetic-content labeling and GenAI rules
    - negative
    - now
    - Raises compliance, moderation, and provenance costs
    - What watermarking, review, and policy tooling is already deployed?
  - - Compute dependence
    - negative
    - ongoing
    - Hardware/platform economics can limit gross margin
    - What are current inference costs and supplier dependencies?
  - - Open-source/community traction
    - positive
    - now
    - May widen developer adoption and brand awareness
    - How much pipeline or revenue originates from open-source users?
  notes: The same force can help demand and hurt economics; pricing is the clearest example.
