  - id: TV007
    title: 论点破裂和终止触发器表
    columns:
      - 触发器
      - 阈值
      - 如何传导到论点
      - 行动含义
    rows:
      - - 确切估值附带重优先权
        - 尽调发现多倍清算优先权、惩罚性反稀释，或大量内部人二级出售悬顶。
        - 表面可接受的名义估值，可能对新普通股或后期优先股投资人变得没有吸引力。
        - 继续推进前，扣除悬顶后重新切分上行空间。
      - - 收入质量弱于活动指标暗示
        - 管理层无法把重点客户、API 调用或用户数桥接到经常性付费收入和留存。
        - 会打破战略和产品证明足以支撑软件式溢价的论点。
        - 转向熊情景或暂停。
      - - 价格压力跑赢模型优势
        - HiDream 必须持续打折才能赢得用量，而利润率仍未被证明。
        - 把基准胜利变成低质量增长，而不是长期现金流。
        - 没有抵消性利润率证据，就不要支付独角兽以上倍数。
      - - 战略合作无法转化为变现
        - 电影 / 媒体标志仍只是叙事资产，而不是合同或客群证明。
        - 拿掉了相对普通开源实验室给溢价的关键理由。
        - 下调估值区间，推迟进入。
      - - 披露追上前就启动退出流程
        - 在没有申报级财务和股权结构细节时，就启动 crossover 或类 IPO 流程。
        - 公开或准公开市场投资人会打披露折扣，或直接退出。
        - 在材料改善前维持继续研究。
    notes: 每个触发器都可在尽调或后续披露中核查，而且会直接改变估值支撑，而不只是泛泛影响公司质量。
