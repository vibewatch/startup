      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              HiDream 的产品栈横跨多种买方原型。企业 API 部署里，用户可能是应用团队，付款方则是产品、IT
              或平台预算负责人。营销工作流里，创作者和运营人员使用工具，但品牌、电商或代理商负责人通常掌握预算。娱乐领域，制片人和片厂负责人为工作流加速付费，艺术家、剪辑师或动画团队才是日常用户。vivago
              增加了自助订阅层，用户和付款方可能合并为一个创作者账号。分层很重要，因为采用触发点不同：企业重视集成、可靠性和治理；营销方重视素材速度和 ROI；片厂重视可控性和保真度；消费者重视广度、模板和价格。HiDream
              的优势是同一个模型底座可以喂给四个入口，但一个细分市场的成功并不保证在其他市场占优。
