      - number: '8.2'
        title: 融资背景与估值历史
        blocks:
          - type: paragraph
            body: >-
              最新一轮融资无论放在本土还是全球 AI 语境里都很大。HiDream 在 2026 年 7 月下旬完成 RMB 1.5 billion Series C 轮，多个来源称公司约三个月内三轮合计融资超过 RMB
              2.1 billion，并在此过程中跻身独角兽。财团的重要性几乎不亚于金额。国家级、省级国资基金、银行资本以及影视战略方同时出现，说明投资人既把 HiDream
              看作战略基础设施，也看作应用型媒体科技平台。资本组合能支撑其相对普通创作者应用的估值溢价。但估值历史仍然稀疏。公开记录没有显示早期轮次的准确投前或投后估值、累计融资额，也没有披露最新一轮之下的优先权结构。因此，该估值只能证明市场愿意出清，不等于内在价值。用于承销时，估值历史有参考价值，但不完整。
