      - number: '8.4'
        title: 尽调清单、投资逻辑失效点与退出准备度
        blocks:
          - type: paragraph
            body: >-
              剩下的工作是实操问题，不是哲学问题。投资人需要准确的投后估值、优先股堆叠、按分部拆开的收入桥、留存数据、毛利率证据，以及足够的现金流细节，才能判断这到底是类软件业务，还是一个套着软件外壳、极耗资本的世界模型实验室。战略上行空间已经可见：与
              Shanghai Film 和 Huace 的合作能帮助 HiDream
              把基准可信度转成专有内容工作流；开源分发也能扩大开发者触达。风险在于，战略信号可能比变现更容易营销。没有监管文件级别的披露，未来任何交叉轮融资或 IPO 式流程仍会面临问题：稀释、盈利质量，以及用户或 API
