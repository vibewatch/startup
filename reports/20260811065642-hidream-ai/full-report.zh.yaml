  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险并不集中在简单的产品需求，而是卡在合规执行、信任披露不足、竞争带来的利润率压力和合作伙伴集中度上。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
