chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品触点与运营范围
        blocks:
          - type: paragraph
            body: >-
              HiDream.ai 的官方材料把公司定义为全球多模态生成式 AI 平台，而不是单一模型实验室。About 页面称，公司成立于 2023 年 3 月，目标是打造多模态基础模型和 AI 应用；首页则强化「AI
              与创意相遇」这一更宽的身份，覆盖文本、图像、视频和 3D。产品集很关键，因为它已经拆成可变现入口，而不只是研究叙事。HiHarness 定位在企业 MaaS 层，拥有 200 多个 API、100 多个重点客户和
              5000 多亿次 API 调用；HiBurst 面向营销工作流；Zhenzan 面向专业影视制作；vivago 是大众创作者应用；HiDreamFans
              指向线下全息营销硬件。这样的宽度支撑了一个判断：HiDream 正试图成为全栈视觉 AI
              操作层。它也解释了公司为何营销「原生全模态世界模型」：现有产品集已经把模型开发接到营销、娱乐和创作者场景，而这些场景中，时间和空间一致性直接影响商业价值。
