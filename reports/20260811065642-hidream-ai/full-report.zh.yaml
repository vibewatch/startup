  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: HiDream 的几类风险彼此勾连：政策、信任、伙伴和竞争问题，会一起传导到转化质量、成本结构和估值容忍度。
    data:
      nodes:
        - id: reg
          label: 监管义务
          detail: 中国的 AI、数据和网络安全规则适用于面向公众的多模态产品。
        - id: trust
          label: 保障材料薄弱
          detail: 面向企业的信任证据，公开披露还不成熟。
        - id: partner
          label: 伙伴集中度
          detail: 头部战略关系比已披露的经常性经济指标更能撑叙事。
        - id: competition
          label: 价格压力
          detail: 视频 AI 竞争可能逼出折扣和更快的发布节奏。
        - id: controls
          label: 更高控制成本
          detail: 需要投入更多审核、权利审查、日志记录和支持。
        - id: conversion
          label: 转化质量走弱
          detail: 企业和合作伙伴会犹豫，或以更低质量转化。
        - id: margin
          label: 利润率承压
          detail: 支持和合规成本上升，定价权却不确定。
        - id: valuation
          label: 估值压力
          detail: 融资时，收入质量和风险折价都会变差。
      edges:
        - from: reg
          to: controls
          label: 增加治理和标识负担
        - from: trust
          to: conversion
          label: 采购摩擦上升
        - from: partner
          to: conversion
          label: 叙事可能跑在广泛部署前面
        - from: competition
          to: margin
          label: 折扣压低贡献利润率
        - from: controls
          to: margin
          label: 合规成本上升
        - from: controls
          to: conversion
          label: 发布和审核摩擦增加
        - from: conversion
          to: valuation
          label: 收入质量走弱
        - from: margin
          to: valuation
          label: 现金生成可信度下降
        - from: reg
          to: valuation
          label: 执法风险让投资审查更严
        - from: partner
          to: valuation
          label: 集中度折价延续
    claimRefs:
      - CR012
      - CR021
      - CR026
      - CR028
      - CR031
      - CR039
      - CR040
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: HiDream 依赖监管机构、算力生态、应用触点、战略客户和开源用户；这些外部方一变，商业结果也会很快改变。
    data:
      nodes:
        - id: hidream
          label: HiDream 产品
          detail: HiHarness、vivago 和多模态工作流界面。
        - id: cac
          label: CAC / PRC 监管机构
          detail: 设定 AI、数据、网络安全和标识要求。
        - id: compute
          label: 算力生态
          detail: 推理成本和可用性取决于更广泛的基础设施。
        - id: apps
          label: App / Web 触点
          detail: 创作者获客要靠这些分发和支付通道。
        - id: partners
          label: 战略合作伙伴
          detail: BlueFocus、Shanghai Film、Huace 等客户标识塑造商业证明。
        - id: oss
          label: 开源生态
          detail: 分叉和下游使用扩大采用面，但削弱控制力。
        - id: buyers
          label: 企业买家
          detail: 需要保障、支持和可重复部署证据。
      edges:
        - from: cac
          to: hidream
          label: 规则和执法姿态
        - from: compute
          to: hidream
          label: 成本与可用性变量
        - from: apps
          to: hidream
          label: 分发和变现
        - from: partners
          to: hidream
          label: 证明和集中度
        - from: oss
          to: hidream
          label: 采用和滥用外溢
        - from: hidream
          to: buyers
          label: 必须把能力转成可信部署
    claimRefs:
      - CR019
      - CR020
      - CR026
      - CR027
      - CR034
      - CR035
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从融资势头和产品证明，推导到受经济性缺口约束的「继续研究」建议。
    data:
      nodes:
        - id: capital
          label: RMB 1.5B C 轮融资
          detail: 证实市场胃口和战略背书。
          tone: positive
        - id: proof
          label: 基准测试 + 开源证明
          detail: HiDream 的产品可信度看得见。
          tone: positive
        - id: channels
          label: API / 大客户代理指标
          detail: 商业活动信号可见。
          tone: positive
        - id: gap1
          label: 没有公开收入桥接
          detail: 没有审计收入、ARR 或留存证明。
          tone: warning
        - id: gap2
          label: 股权结构不清晰
          detail: 确切投后估值和优先权条款未公开。
          tone: warning
        - id: market
          label: 2026 年市场更挑剔
          detail: 资本仍在流动，但证据门槛在升高。
          tone: warning
        - id: price
          label: 独角兽以上价格
          detail: 只有后续披露足够强，才撑得住。
          tone: neutral
        - id: call
          label: 继续研究
          detail: 公司值得看；价格支撑不完整。
          tone: warning
      edges:
        - from: capital
          to: price
          label: 支撑
        - from: proof
          to: price
          label: 支撑
        - from: channels
          to: price
          label: 支撑
        - from: gap1
          to: call
          label: 约束
        - from: gap2
          to: call
          label: 约束
        - from: market
          to: call
          label: 抬高门槛
        - from: price
          to: call
          label: 需要证明
    approximationNotes: 仅为概念综合。该流程解释决策逻辑，不预测因果估值模型。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV009
      - CV014
      - CV030
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在不同假设收入水平下，要支撑独角兽估值底线所需的收入倍数。
    data:
      items:
        - label: $50M 收入
          value: 20
          unit: x revenue
          detail: 要达到 $1B 估值底线所隐含的倍数。
        - label: $75M 收入
          value: 13.3
          unit: x revenue
          detail: 仍明显高于多数公开创意软件可比公司。
        - label: $100M 收入
          value: 10
          unit: x revenue
          detail: 需要强稀缺性或增长质量证明。
        - label: $125M 收入
          value: 8
          unit: x revenue
          detail: 更接近高溢价软件区间，但要求仍高。
        - label: $150M 收入
          value: 6.7
          unit: x revenue
          detail: 接近所选公开软件可比公司的高端。
    approximationNotes: 本图并不声称 HiDream 达到其中任何收入水平。它说明独角兽估值底线对未披露收入数字有多敏感。
    claimRefs:
      - CV003
      - CV024
      - CV030
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 相对于公开可见独角兽估值底线的悲观、基准和乐观估值带。
    data:
      items:
        - label: 悲观
          low: 600
          mid: 750
          high: 900
          unit: $M equity value
          detail: 经济性不透明，加上倍数压缩。
        - label: 基准
          low: 900
          mid: 1100
          high: 1300
          unit: $M equity value
          detail: 当前底线只有拿出更干净的商业证明，才大致守得住。
        - label: 乐观
          low: 1500
          mid: 1900
          high: 2400
          unit: $M equity value
          detail: 需要审计后的经常性收入和利润率证明。
        - label: 公开独角兽底线
          low: 1000
          mid: 1000
          high: 1000
          unit: $M valuation status
          detail: 未披露确切投后估值；底线仅供定位参考。
    approximationNotes: 区间是判断带，不是模型定价结果。它们用于框定尽调纪律，而不是替代数据室模型。
    claimRefs:
      - CV003
      - CV035
      - CV036
      - CV037
      - CV038
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按 IC 视角给 HiDream 打分，覆盖产品证明、披露质量、估值支撑和风险。
    data:
      items:
        - label: 产品证明
          value: 8/10
          note: 基准测试、开源发布和多模态产品覆盖面都真实存在。
        - label: 商业代理指标
          value: 6/10
          note: API 和用户规模指标看得见，但仍由公司叙事框定。
        - label: 投资人支持
          value: 8/10
          note: C 轮财团战略性强，资金实力也不寻常。
        - label: 披露质量
          value: 3/10
          note: 公开收入、利润率、烧钱速度和股权结构数据仍薄。
        - label: 估值支撑
          value: 4/10
          note: 价格在市场口径下能通过，但内在价值支撑不完整。
        - label: 风险负荷
          value: 3/10
          note: 资本市场更挑剔，经济性又未披露，下行风险仍不小。
    approximationNotes: 分数是判断性综合，不是算法。低分反映估值支撑缺失，而不是模型能力弱。
    claimRefs:
      - CV004
      - CV006
      - CV009
      - CV014
      - CV029
      - CV030
      - CV041
      - CV042
      - CV043
