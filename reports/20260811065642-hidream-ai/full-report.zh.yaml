      - number: '7.2'
        title: 监管、法律与信任暴露
        blocks:
          - type: paragraph
            body: >-
              最重的有据义务来自中国 AI、网络安全和数据法律。《暂行办法》明确覆盖中国境内面向公众的文本、图像、音频和视频生成。《数据安全法》和《网络安全法》又增加了安全运行、日志、事件响应和风险评估等基线职责。对
              HiDream 来说，多模态很重要，因为每增加一种输出类型，滥用和合规暴露面都会变宽。开源许可和商业友好信息会加速采用，但也提高了外界对来源、权利清洁度和下游使用的期待。公开记录确实显示了隐私和条款页面，以及
              GitHub 和 Hugging Face 上可见的许可透明度。它没有显示的是大型客户通常想要的企业信任包：公开认证、DPA 流程、SLA
              姿态或事件透明度。因此，监管和法律栈可读，但缓释成熟度只部分可读。这种错配会形成可见尽调折价。
