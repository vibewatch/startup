  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 支持证据
      - 什么会改变判断
    rows:
      - - HiDream 不只是演示实验室
        - 公司刚完成 RMB 1.5B 融资，已有 200+ 个 API、100+ 个重点客户、开源发布，以及电影 / 媒体战略投资方。
        - 经验证的经常性收入和留存，会把这个判断从合理推断提升为可写进投资模型的结论。
      - - 战略资本可能带来真实渠道价值
        - Shanghai Film、Huace 和国资背景投资方能打开产业用例和数据合作，普通实验室很难拿到。
        - 需要收入归因、部署案例，以及这些关系能产出长期合同的证据。
      - - 开源和基准证明带来期权价值
        - HiDream-O1-Image 已进入开源前列，第三方分发入口也已经存在。
        - 还需要证明开源采用能转化为付费企业客户或 API 变现，而不只是声量。
      - - 当前估值可能仍跑在基本面前面
        - 公司没有公开收入、ARR、利润率或现金消耗，而上市可比公司的交易倍数远低于私募 AI 融资倍数。
        - 完整财务包可以解释溢价；拿不到之前，折价应当保留。
      - - 融资动能不等于内在价值
        - 2026 年行业证据显示，赢家仍能拿到资本，但资金更挑剔；过去的生成式 AI 领军者也可能停滞或被重组融资。
        - 更干净的资本结构和可见的单位经济模型，会降低对融资观感的依赖。
    notes: 反论点不是 HiDream 缺乏产品质量，而是估值支撑仍过度依赖推断出来的经济性。
