  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: HiDream 实际在哪里竞争
        blocks:
          - type: paragraph
            body: >-
              HiDream 并不是在一条清晰赛道里竞争。公开证据把它同时放在图像模型基准测试、开源开发者心智、创作者平台软件，以及新兴影视 /
              营销工作流工具中。这样的混合位置很重要，因为参照系会随买方变化。图像侧，HiDream 在质量上与闭源和开源模型领导者竞争。创作者侧，vivago
              与简单消费工具以及能路由到多种最佳模型的聚合器竞争。企业和影视侧，公司对手包括工作流平台、内部自建方案，以及合规或分发更强的供应商。结果是，公司有很多获得相关性的路径，但公开来源尚未显示单一受保护滩头阵地。它最尖锐的公开优势仍是视觉模型质量加开源可信度，而不是掌握主导需求渠道。这也意味着，把
              HiDream 只当作又一个图像模型或又一个视频应用来比较，会错过管理层如何试图把用户从基准测试认知，导向软件使用，再导向行业特定工作流。
