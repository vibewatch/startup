            body: >-
              客户章节最大的缺口是耐久性。公开来源显示 HiDream 能吸引用户和合作伙伴，但没有显示这些用户是否会留下、扩张，并贡献高质量收入。App Store 评分方向上积极，vivago
              详细产品页描述了免费套餐、多个层级、点数和智能体增购路径，暗示公司有意设计产品驱动漏斗。但这些信号仍不揭示付费转化、流失、队列行为、净留存率（NRR）或合同期限，也不揭示所谓企业客户基础中有多少是活跃或战略上重要的。即便最强的可见具名证明——BlueFocus、Shanghai
              Film 和 Huace——也没有披露收入贡献或续约节奏。结果是，客户故事有广度和势头，但关于重复经济性的公开证据有限。尽调上，下一组问题应聚焦队列质量，而不只是客户数量大小。
