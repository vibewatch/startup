      - number: '5.4'
        title: 信任、合规与路线图平衡
        blocks:
          - type: paragraph
            body: >-
              信任和合规是 HiDream 产品兴奋感的主要反向权重。中国生成式 AI 规则和合成媒体标识框架显然适用于面向公众的图像、视频和音频服务，因此 vivago 和 HiHarness
              这类产品需要合法数据、用户协议、隐私、投诉处理和标识能力。HiDream 至少为 vivago
              发布了全球隐私页面，但已审阅来源集合没有显示成熟的公开信任中心、第三方认证、详细审核指标或企业保证材料。路线图图景也不均衡。公开发布显示迭代很快——I1、E1、O1、O1-Dev、提示词智能体和 vivago
              2.0——但最清晰的证明仍围绕图像生成、编辑和创作者工具。关于更广全模态世界模型、视频协同或未来无限长度视频的主张，在战略上很有意思，但作为客户可用产品现实，证据还不够。这让 HiDream
              拥有有吸引力的产品逻辑，同时留下治理和可靠性尽调负担。
