            body: >-
              HiDream 的客户基础应按接入入口分层，而不是按一个总量标题来读。公开证据指向至少五类不同客户：使用 HiHarness 的企业 API 团队，使用 HiBurst
              式工作流的营销和电商运营方，通过战略合作进入的影视或媒体机构，经由 vivago 进入的创作者或专业消费者用户，以及可能被 HiDreamFans
              瞄准的线下零售运营方。每个细分里的买方、用户和付款方都不同。创作者往往自付，或通过免费点数试用。企业使用可能从技术用户开始，预算在产品或 IT
              负责人手里。媒体合作可能混合资本、共同开发和未来工作流部署。这很重要，因为「40,000 家企业客户」和「50 million
              专业用户」等头部数字几乎肯定把行为、价格点和合同质量都很不同的群体打包在一起。最干净的公开获客渠道是 vivago，因为它在网页和移动端都可见，展示定价层级，并能把免费试验转化为付费套餐或点数。
