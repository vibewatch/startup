      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              需求侧很强。Stanford 记录了个人和组织采用的快速上升，多个市场研究也指向软件和营销用例的持续双位数或更高增长。竞争同样强。Runway、Veo
              等全球领导者拼质量和创意控制，中国视频实验室则在价格、速度和平台分发上激烈竞争。因此，HiDream
              受益于快速增长的品类，但也身处残酷争夺之中。两个约束尤其突出。第一，中国监管和合成媒体标识规则会拖慢面向公众的视频与音频产品分发，或推高合规成本。第二，模型经济性仍重度暴露在算力和平台层，而这些层的规模远大于应用收入。乐观情景是，HiDream
              能靠开源、工作流包装和战略投资者快速进入商业预算；怀疑情景是，公司仍需在真实可服务市场内证明细分领导力、合规执行和持久单位经济性。对一家公开披露仍更强调里程碑和合作、而不是经常性细分经济性、留存队列或毛利率历史的中国私营公司来说，这一点尤其重要。
