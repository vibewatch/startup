  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 界定真实市场边界
        blocks:
          - type: paragraph
            body: >-
              不能不加边界逻辑地用整个生成式 AI 头部市场来承销 HiDream。公开证据显示，它的商业覆盖更具体：通过 HiHarness 做企业 API，通过 HiBurst 做营销生产软件，通过 Zhenzan
              做娱乐工作流，通过 vivago 做创作者订阅。这些业务入口都处在多模态视觉生成市场内，但并不覆盖大多数纯文本 copilot、搜索智能体，或那些抬高通用 TAM
              图表的基础设施硬件收入。实际含义是，HiDream 同时参与至少三层相邻市场：基础模型能力、开发者 / API
              赋能，以及终端用户应用收入。这样的分层位置有吸引力，因为它扩大了变现选项，但也让测算更复杂。因此，正确的市场框架是多模态内容生成工作流，尤其是图像、视频、音频和创意编排软件，而不是「全部
              AI」或狭窄的图像模型基准测试利基。
