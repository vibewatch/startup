      - number: '1.2'
        title: 创始人锚点、法律实体结构与治理不透明
        blocks:
          - type: paragraph
            body: >-
              公开层面最清晰的领导锚点是 Tao Mei。官网、Baidu 资料和 IEEE 作者页都将其列为创始人兼 CEO，独立传记来源也把他与 JD.com 和 Microsoft Research
              的过往高管经历联系起来。这一背景有助于解释公司为何同时强调大模型研究和应用商业化。不过，公开治理细节比创始人履历薄得多。官网显示 Wang Ke 为联合创始人兼 COO，工商记录则显示 Wang Ke
              是北京运营实体的经理和法定代表人，Tao Mei 列为董事，并似乎是实际控制人或受益所有人。Qichacha
              还显示，北京公司由一家合肥控股实体全资持有，这与地方城市资本支持的叙事方向一致，但仍不能替代清晰的股权结构表或董事会名单。公开证据没有披露当前董事会名单、委员会结构或决策权框架，因此投资判断仍高度依赖以创始人为中心来理解组织。
