      - number: '3.2'
        title: 同业类别与能力差异
        blocks:
          - type: paragraph
            body: >-
              竞争者至少分成三类。第一类是 Runway、Google Veo 等高端全球工作流或模型玩家，它们拼控制力、可靠性和企业可接受的信任姿态。第二类是 Kling、Hailuo
              等中国视频原生对手，它们更直接地竞争短视频创作、API 可用性和价格敏感的国内创作者需求。第三类是混合或路由层，包括 vivago 本身，这些产品越来越多地把几个上游模型包装成一个体验。HiDream
              的图像模型故事在公开基准测试中表现不错，尤其是在开源领域；但它更广的多模态位置，仍没有品牌暗示得那么稳固。它还没有展示出 Veo 那样的公开企业控制栈，也没有 ByteDance 或 Kuaishou
              相关对手那样明显的大众分发循环。因此，功能广度是真实的，但竞争适配高度取决于细分市场。
