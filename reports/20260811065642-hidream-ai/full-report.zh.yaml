      - number: '8.3'
        title: 可比公司、情景区间与 DCF 缺口
        blocks:
          - type: paragraph
            body: >-
              估值三角测算原则上简单，落地却很别扭。当前市场里，公开市场创意和软件可比公司的收入倍数大约在 0.2x 到 6.2x；AI 融资数据集仍显示，私募轮次的收入倍数中位数高得多，超过 24x。HiDream
              夹在两者之间：技术和战略信号强于下行中的图库平台，但公开财务证明远少于能够支撑公开市场溢价倍数的企业软件公司。HiDream 没有公开披露收入或 ARR，经典 DCF
              就站不住脚。唯一负责任的方法是情景分析：问清什么证据能支撑独角兽底价，什么证据能支撑更高区间，什么失败会压垮溢价。在 $1 billion 底价下，如果收入为 $50 million，需要的收入倍数约
              20x；如果收入为 $150 million，则约 6.7x。估值对一个缺失数字极其敏感。
