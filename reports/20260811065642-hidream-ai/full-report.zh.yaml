companyProfile:
  summary: >-
    HiDream.ai，正式名称为 Beijing Zhixiang Future Technology Co., Ltd.，是一家总部在北京的多模态 AI 公司。公司于 2023 年 3 月由 Tao Mei
    及一支横跨研究与商业化的运营团队创立。公开证据显示，公司产品栈覆盖基础模型、企业 API、营销工作流、影视制作工具和创作者产品；2026 年 7 月，RMB 1.5B 的 C 轮把公司推入独角兽阵营，近期融资总额超过 RMB
    2.1B。投资逻辑由基准测试可信度、开源分发，以及罕见的战略性国资与传媒产业资本共同支撑。尽调难点在经济透明度：公开来源仍未披露收入质量、毛利率、烧钱速度或优先股结构，无法证明当前估值的风险已充分出清。
