  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险栈
        blocks:
          - type: paragraph
            body: >-
              HiDream
              的风险画像不是由一个生死级红旗主导，而是由几项相关的中高暴露主导；它们叠加时可能变成关键风险。最重要的是面向公众的多模态生成监管合规、企业信任披露不足、竞争性价格压力，以及战略交易对手相对于持久经常性收入的集中风险。这些比简单需求风险更重要，因为公开证据已经支持采用广度、基准测试可信度和融资能力。问题在于，这些优势都不会自动证明增长安全、有粘性或能高效变现。即使模型声誉很强，如果合规成本上升、买方因信任包装犹豫，或创作者和合作伙伴渠道变现低于预期，公司仍可能损失价值。因此，看
              HiDream 风险的正确镜头，是可见缓释后的剩余严重程度，而不是原始理论风险。风险之间的相关性是核心投资判断担忧。今天还没有单一缓释因素能独自清掉整组风险。
