        title: 资本基础、投资者组合与规模信号
        blocks:
          - type: paragraph
            body: >-
              公司 2026 年 7 月的融资节奏，是公开记录中最强的后期信号。多个来源一致显示，HiDream.ai 在 7 月下旬完成 RMB 1.5B 的 C 轮融资，并在约三个月内完成三轮融资，累计超过 RMB
              2.1B。投资者组合格外有信息量。本轮集合了国家和省级国资基金、银行系资本，以及 Shanghai Film New Vision Fund、Huace Film & TV
              等传媒产业投资者。这样的组合意味着，投资人判断 HiDream 时，更像是在投具有直接产业应用路径的国产 AI 基础设施，而不是普通应用初创公司。公开规模信号存在，但不均衡。融资新闻稿称公司拥有 5000
              多万专业用户、4 万多家企业客户，覆盖 100 多个国家；首页则突出 100 多个重点客户和 5000 多亿次 API
