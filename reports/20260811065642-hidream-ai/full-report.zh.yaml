  - id: TV006
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
    rows:
      - - 熊
        - HiDream 的收入质量仍不透明，价格压力加剧，市场开始按更接近上市创意公司或低层级 AI 可比公司的方式给生成式媒体业务定价。
        - ~$0.6B-$0.9B。若公司无法证明软件式经济性，或更大规模战略退出路径出现前融资环境收紧，独角兽下限会被打穿。
        - 没有财务披露、企业转化证据弱，或出现降价轮 / 结构性稀释融资迹象。
      - - 基准
        - HiDream 把基准和战略动能转化为足够商业证据，守住独角兽下限，但仍拿不出稀缺性溢价所需的干净经济性。
        - ~$0.9B-$1.3B。该区间认为当前估值只在低端大致可守，且前提是后续尽调补齐收入质量缺口。
        - 战略采用持续推进，且没有明显负面意外；但仍没有经审计收入桥。
      - - 牛
        - HiDream 披露强劲经常性企业收入、清晰利润率改善，以及开源和电影 / 媒体工作流向长期合同的可复制转化。
        - ~$1.5B-$2.4B。要高于当前下限拿溢价，增长质量必须开始更像品类龙头，而不是有前景但不透明的前沿媒体实验室。
        - 经审计财务、留存证明、股权结构清晰，以及世界模型或电影工作流实现规模化变现的证据。
    notes: 这里故意不把 DCF 作为主要方法。公开记录仍缺少足够扎实的收入、利润率、burn、capex 和营运资本输入，撑不起财务级折现现金流模型。
