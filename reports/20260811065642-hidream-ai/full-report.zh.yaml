      - number: '2.2'
        title: 市场测算口径有用，但不能互换
        blocks:
          - type: paragraph
            body: >-
              现有市场研究确认了一个庞大且快速增长的背景，但彼此差异很大，因为它们测量的东西不同。Grand View 对 2026 年的估计是 USD 29.6 billion，Fortune 是 USD 161
              billion，ResearchAndMarkets 则只给 2024 年基础模型收入切出 USD 4.1 billion，同时把更多价值放在平台和硬件上。对 HiDream
              来说，这种分散不是噪音；它提示市场必须先拆解，才能估值。一家同时卖模型和应用的公司，不应只对标狭窄的基础模型池，但也不应继承硬件收入或所有文本生成负载。可用结论是，需求显然在扩张，软件 /
              应用捕获也真实存在；但精确的 SAM/SOM 仍需要按工作流、地理和买方预算做自下而上的工作。在那之前，区间式测算比一个英雄式 TAM 数字更诚实。
