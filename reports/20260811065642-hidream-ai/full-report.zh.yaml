  - id: TV008
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 确切投后估值和股权结构
        - 精确估值、股份类别、清算优先权、反稀释机制，以及任何内部人二级交易条款
        - 决定该轮按名义价格对新投资人是否真的有吸引力。
        - 数据室里的财务 + 法律尽调。
      - - 收入质量桥
        - 分部收入、客户集中度、留存、续约、流失，以及 API 或用户活动与付费用量之间的联系
        - 没有这条桥，估值靠的是活动代理指标，而不是变现质量。
        - 管理层问答加财务工作流。
      - - 利润率和算力经济性
        - 分部毛利率、GPU 承诺、托管成本，以及模型效率提升能经受真实部署的证据
        - 检验 HiDream 是在变得软件化，还是仍然吃资本。
        - 技术尽调加 CFO 模型复核。
      - - 合作伙伴变现
        - Shanghai Film、Huace 及相关战略渠道的合同金额、部署范围和续约证据
        - 说明战略投资人是真实收入渠道，还是主要撑叙事。
        - BD / 产品尽调，配合合同审查。
      - - IPO / crossover 准备度
        - 申报级披露、治理包、董事会结构和控制体系状态
        - 未来更高估值或退出，取决于投资人是否相信业务经得起公开市场审视。
        - 法律、审计和治理尽调。
    notes: 这些问题是从动人叙事走向可承销资产的最短路径。多数问题答清前，当前建议不应改变。
