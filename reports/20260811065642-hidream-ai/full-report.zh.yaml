              视频协同联系起来。代码库也让公司的产品哲学可读：一个架构应覆盖生成、编辑、个性化、长文本渲染和类似分镜的任务，同时由提示词智能体处理围绕布局和物理逻辑的潜在推理。公开证据不能证明这已经在生产中产出真正世界模型，但确实显示公司严肃尝试减少模态和任务之间的模块化交接。
