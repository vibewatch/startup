  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              HiDream.ai 通过了严肃后期 AI
              公司第一道测试：业务真实到足以让国资基金、银行系资本、影视产业战略方、开源开发者和第三方基础设施伙伴都在公开记录中出现。问题在第二道测试，而这道测试对估值更关键。公开证据没有披露经审计收入、ARR、毛利率、烧钱速度、留存或清算条款，因此市场几乎要求投资人主要靠融资势能、产品基准和活跃度代理指标来承销一个独角兽以上的价格。融资势能、产品基准和活跃度代理指标有用，但还不足以支持买入。因此建议是继续研究。如果尽调拿到高质量经常性企业收入和毛利证明，评级可以很快上调；如果拿不到，当前估值最好先看作一个仍需经济性验证的故事。换句话说，只有证据变强之后，这个机会才可投；不能因为市场热度高就投。
