        title: 产品套件与用户任务
        blocks:
          - type: paragraph
            body: >-
              HiDream 的公开产品故事宽于单个基准测试获胜模型。官方材料列出五条产品线——HiHarness、HiBurst、Zhenzan、vivago 和 HiDreamFans——覆盖企业
              API、营销工作流、影视或专业内容工作流、创作者工具，甚至线下零售硬件。这样的宽度很重要，因为它揭示了管理层希望模型栈如何被消费。HiHarness 是最清晰的企业入口，围绕数百个
              API、重点客户采用和大调用量来表述。vivago 是最清晰的自助创作者入口，包装多模型访问、模板和智能体编辑。HiDreamFans 把逻辑延伸到线下获客工具，HiBurst 和 Zhenzan
              则锚定战略投资者似乎在意的营销和媒体工作流。统一的待完成任务不只是图像生成，而是为创作者、营销人员和媒体运营方加速多模态内容生产，并长期把同一个核心模型资产变成更广的全模态工作流平台。
