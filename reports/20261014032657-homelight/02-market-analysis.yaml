callouts:
  - calloutType: "insight"
    title: "Commission Referral Economics Under RESPA"
    body: "HomeLight's core agent matching business relies on a 33% referral fee paid by the closing agent rather than an upfront consumer fee. While legal under RESPA Section 8(c)(3) cooperative brokerage exemptions, this mechanism relies on standard 2.5% to 3.0% gross listing commissions and shifts economic costs directly into closing settlement funds."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM004"
  - calloutType: "risk"
    title: "Liquidity Tradeoffs Between Speed and Realized Price"
    body: "HomeLight addresses the timing mismatch in home transitions through two distinct mechanisms with contrasting pricing: Buy Before You Sell charges a predictable 2.4% flat fee while preserving open-market upside, whereas Simple Sale offloads properties to cash buyers in 10 days at steep historical valuation discounts between 10% and 50%."
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
