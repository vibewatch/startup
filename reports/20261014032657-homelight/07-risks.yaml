callouts:
  - calloutType: risk
    title: Key Thesis-Break Triggers and Kill Criteria
    body: >-
      Diligence mandates monitoring three critical break points: (1) an adverse class certification or summary judgment
      in Hopkins v. HomeLight under the TCPA establishing class-wide statutory damages, (2) an escalation in 120-day
      unsold home buyouts requiring balance-sheet capital deployment in excess of warehouse covenants, and (3) a formal
      CFPB inquiry or enforcement action reclassifying digital broker-to-broker referral splits under RESPA Section 8.
    claimRefs:
      - CR001
      - CR003
      - CR010
      - CR013
