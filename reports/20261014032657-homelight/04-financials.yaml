callouts:
- calloutType: risk
  title: Balance Sheet Dependency in 120-Day Liquidation Scenarios
  body: While HomeLight's Buy Before You Sell model shifts primary mortgage origination to external lending partners, HomeLight commits to purchasing unsold departing residences at Loan Payoff Value after 120 days. In a severe regional housing downturn, programmatic inventory buyout obligations could rapidly strain HomeLight's warehouse facilities and debt covenants.
  claimRefs:
  - CI006
  - CI007
- calloutType: insight
  title: Wholesale Lender Distribution Mitigates Direct Customer Acquisition Cost
  body: By packaging Buy Before You Sell as an embedded liquidity program for more than 40 wholesale and retail mortgage lenders, HomeLight bypasses high consumer acquisition costs and recruits loan officers as zero-marginal-cost originators, establishing a defensible B2B2C distribution channel.
  claimRefs:
  - CI004
  - CI005
  - CI010
