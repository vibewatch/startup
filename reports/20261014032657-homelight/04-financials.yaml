  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margin-breakdown
    missingEvidence: Audited GAAP income statements disclosing net revenue by line (agent matching referral vs BBYS program fees vs title/mortgage services), gross margins, and customer acquisition costs.
    whyItMatters: Prevents institutional assessment of revenue quality, business-line unit margins, and profitability path across disparate business models.
    diligencePath: Request management financial pack under NDA covering fiscal years 2024 through 2026 with product-level revenue and contribution margin breakdown.
  - type: private-evidence-only
    severity: blocking
    topic: bbys-warehouse-and-default-risk
    missingEvidence: Historical cohort performance on Buy Before You Sell, including frequency of client properties failing to sell within 120 days, forced-purchase loss rates, and debt facility covenant headroom.
    whyItMatters: Exposes the company to significant balance sheet inventory absorption and capital impairment during residential housing turnover slowdowns.
    diligencePath: Request warehouse debt facility credit agreements, lender borrowing base certificates, and historical aging schedules for all Buy Before You Sell collateral.
  - type: missing-source
    severity: material
    topic: simple-sale-investor-discount
    missingEvidence: Realized discount percentages and average haircut relative to fair market value accepted by sellers utilizing Simple Sale investor cash offers.
    whyItMatters: Determines whether Simple Sale represents a competitive alternative to traditional listings or a predatory liquidity route during market distress.
    diligencePath: Perform transaction sample study comparing HomeLight Simple Sale accepted offers against automated valuation model benchmarks and subsequent retail resales.
  - type: private-evidence-only
    severity: material
    topic: referral-split-and-lender-take-rate
    missingEvidence: Contractual referral fee split schedules across participating brokerages and lender channel revenue-sharing terms.
    whyItMatters: Determines net platform retention and pricing power amidst increasing regulatory and competitive pressure on buyer/seller agent commissions.
    diligencePath: Review master service agreements and partner commission schedules for top 20 lender and agent brokerage relationships.
