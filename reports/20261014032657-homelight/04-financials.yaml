  title: Financials
  summary: HomeLight monetizes residential real estate through agent commission referrals, a 2.4% to 2.9% Buy Before You Sell bridge fee, investor cash marketplace transactions, and ancillary settlement services. While the platform has unlocked over $884 million in consumer equity and secured a $40 million BlackRock venture debt facility in April 2026, opaque GAAP revenue, undisclosed unit margins, and balance sheet inventory buyout exposure at 120 days remain critical underwriting blockers.
sections:
- id: revenue-streams-and-pricing-architecture
  title: Revenue Streams & Platform Pricing Architecture
  body: HomeLight operates a multi-stream transaction platform designed to monetize residential real estate transactions through software-enabled brokerage referrals, specialized liquidity products, and integrated settlement services. Historically founded as a real estate agent matching marketplace, HomeLight monetizes consumer agent introductions by charging participating brokerages a referral fee calculated as a percentage of the agent's gross commission upon closing. While HomeLight provides free matching services to home sellers and buyers without listing fees, partner agents contractually agree to remit a portion of their gross commission at settlement under cooperative brokerage agreements permissible under Section 2607 of the Real Estate Settlement Procedures Act. To expand beyond referral commissions, HomeLight launched Buy Before You Sell, which has become its primary transactional product. Buy Before You Sell charges a standard flat program fee of 2.4% of the departing residence's
    sale price across most states, rising to 2.9% in Florida and assessing an additional $1,500 title fee in specific Illinois counties due to local title search regulations. Complementing these programs, Simple Sale provides an off-market cash offer route where HomeLight charges no explicit seller program fee or repair costs, instead capturing economic value through investor pricing spreads relative to fair market value.
