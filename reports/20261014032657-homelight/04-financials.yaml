  - - Buy Before You Sell (BBYS)
    - Transaction program fee collected at settlement of departing home
    - 2.4% flat fee (2.9% in FL; $1,500 title fee in Chicago counties)
    - Unlocked $884M+ equity across 47 states with 40+ lenders
    - Asset-backed programmatic fee; liquidity dependent
    - What is the realized gross margin after financing carry and title costs?
  - - Simple Sale Cash Marketplace
    - Investor marketplace facilitation / wholesale cash offers
    - Spread below open-market value paid by investor network
    - Network of hundreds of pre-approved cash buyers nationwide
    - High certainty; zero fee to seller but price concession
    - What is the average realized discount to fair market value on investor sales?
  - - Cash Close / Trade-In
    - Guaranteed purchase price with upside pass-through less flat fee
    - Guaranteed purchase price minus flat program fee
    - Predecessor model integrated into Buy Before You Sell platform
    - Balance-sheet intensive; potential inventory exposure
    - What inventory carrying volume or relisting losses remain from cash close?
  - - Home Loans & Settlement Services
    - Mortgage origination fees, title processing, and escrow closing
    - Per-loan origination points and title settlement fees
    - Integrated with BBYS and lender distribution ecosystem
    - Cyclical lending margin; interest rate sensitive
    - What percentage of BBYS buyers originate their new mortgage through HomeLight?
