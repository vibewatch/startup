        - id: node-1
          label: 消费者线索与发现
          description: 买房者或卖家通过经纪人搜索或 BBYS 净值门户进入平台
        - id: node-2
          label: 经纪人与贷款方匹配
          description: 平台将线索分配给当地顶尖经纪人或合作贷款经纪人
        - id: node-3
          label: AI 承保与净值释放
          description: 算法审批在 0% 桥接利息下释放最高 90% CLTV / $2M
        - id: node-4
          label: 无售房条件购房与搬迁
          description: 买家提交中标报价并搬入新房
        - id: node-5
          label: 待售房出售（120 天市场窗口）
          description: 原住宅腾空布置后在公开市场出售
        - id: node-6
          label: HomeLight 变现结算
          description: 收取 2.4%-2.9% BBYS 费用及经纪人转介佣金
        - id: node-7
          label: 附带业务与产权扩展
          description: 通过产权、托管和抵押贷款服务获取额外利润
    approximationNotes: 根据公开产品指南和条款，展示平台的典型工作流及多元收入变现机制。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI010
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构堆栈，展示从用户触点经过数据分析、交易逻辑到资本结算的流程。
    approximationNotes: 架构层级综合公开产品集成、贷款方门户和运营披露。
    claimRefs:
      - CE012
      - CE013
    data:
      layers:
        - label: 第 1 层：全渠道消费者与合作伙伴接入
          detail: 用于客户入驻的网页门户、移动网页、贷款合作伙伴联合品牌落地页和 API 集成。
          modules:
            - landing-pages.homelight.com
            - lenders.homelight.com
            - homes.homelight.com
            - 消费者接入问卷
        - label: 第 2 层：经纪人匹配与市场引擎
          detail: 基于 27M+ 条历史交易记录，通过算法路由将买家和卖家匹配给 28,000+ 名顶尖经纪人。
          modules:
            - 交易分析引擎
            - 经纪人表现指数
            - 线索分发网关
        - label: 第 3 层：Simple Sale 现金报价市场
          detail: 联合 iBuyer 和机构投资者，将卖家匹配给全现金买家，在两分钟内快速生成报价。
          modules:
            - 投资者竞价网络
            - 房产规格接入
            - 现金报价比较服务
        - label: 第 4 层：Buy Before You Sell（BBYS）金融引擎
          detail: 自动估值与房屋净值垫资平台，提供最高达 90% CLTV 的备用报价，并排除 DTI 比率。
          modules:
            - 房屋净值计算服务
            - 备用报价生成器
            - 24 小时自动承保
        - label: 第 5 层：数字抵押贷款与产权 / 托管交割
          detail: Home Loans 发起引擎与 Closing Services 部门，负责数字产权、托管和结算流程。
          modules:
            - Eave 数字承保
            - 21 天交割保证模块
            - 集成式托管与产权平台
        - label: 第 6 层：资本工具、银行业务与监管合规
          detail: '仓储贷款工具、多州经纪人牌照（CA DRE #01900940）及 NMLS 贷款合规（#1529229）。'
          modules:
            - 仓储信贷工具
            - 州级经纪人牌照模块
            - NMLS 合规系统
            - 电汇验证
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 覆盖消费者接入、算法匹配经纪人、房屋净值释放承保、无条件购房和最终交易变现的六阶段生命周期。
    data:
      items:
        - label: 1. 发现与线索接入
          touchpoints:
            - 房屋估值工具
            - 在线搜索问卷
            - 卖方 / 买方初始接入
        - label: 2. 算法匹配经纪人
          touchpoints:
            - 分析 40M+ 笔交易的业绩算法
            - 本地头部经纪人推荐
            - 专属电话咨询
        - label: 3. 过桥融资承保
          touchpoints:
            - AI 房产估值算法
            - 贷款方合作伙伴加入 Buy Before You Sell 项目
            - 最高 70%-90% 的房屋净值释放审批
        - label: 4. 无条件购房
          touchpoints:
            - 无条件购房报价
            - 首付贷款资金
            - 原住房完成交割前的 0% 利率过桥贷款
        - label: 5. 原住房处置
          touchpoints:
            - 21 天内挂牌空置房
            - 公开市场布置与定价优化
            - 120 天清算窗口或备用买断
        - label: 6. 结算与平台变现
          touchpoints:
            - 交割结算
            - 经纪人支付的、相当于毛佣金 33% 的转介费
            - HomeLight 收取的 2.4% 固定 BBYS 交易费
    approximationNotes: 截至 2026 年，该阶段流程综合了 HomeLight 经纪人匹配和 Buy Before You Sell 项目文档中的标准运营路径。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU008
