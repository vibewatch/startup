      - number: '5.4'
        title: 技术差异化、数据优势与地域覆盖
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的技术差异化建立在专有交易数据集和专业化企业对消费者（B2B2C）合作分销模式之上。Zillow 或 Realtor.com 等竞争门户
              主要向本地经纪人出售邮编广告曝光，不论交易表现如何；HomeLight 的匹配引擎则依靠 27 million 笔交易中的客观历史成交记录。 由于经纪人不需要支付预付挂牌费才能出现在目录中，HomeLight
              把变现与已成交量绑定，在托管结算成功后收取行业标准 33% 的 经纪对经纪推荐费。


              在过桥融资领域，HomeLight 把 Buy Before You Sell 嵌入按揭发起人的既有销售工作流，而不是试图绕过贷款经纪人，以此形成差异化。 贷款经纪人使用 BBYS
              门户解锁借款人净值并扩大贷款量，同时不放弃主要购房按揭。截至 2026 年，HomeLight 称其合作伙伴网络覆盖 超过 28,000 名房地产经纪人和 22,000 名贷款经纪人，累计释放客户净值超过
              $884 million。该产品目前全国可用，但 Alaska、 Massachusetts 和 New York 除外，反映出选择性的司法辖区许可和各州放贷限制。
            claimRefs:
              - CE002
