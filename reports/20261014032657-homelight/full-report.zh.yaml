  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：低佣金网络与科技经纪商
        blocks:
          - type: paragraph
            body: >-
              住宅房地产交易市场主要分为三类竞争者：佣金折扣推荐平台、垂直整合的数字经纪商，以及传统独立经纪公司。HomeLight 作为混合 交易市场，把卖家连接到超过 30,000
              名合作房地产经纪人和贷款机构组成的网络。在核心经纪人匹配领域，HomeLight 直接面对 Clever Real Estate、Ideal Agent 等低佣金推荐网络以及数字经纪商 Redfin
              的激烈竞争。Clever Real Estate 在 19,000 名大型 全国品牌顶尖经纪人的网络中协商统一 1.5% 挂牌佣金；Redfin 则使用受薪内部经纪人在主要都市提供 1.5% 至 2.0%
              的挂牌费率； HomeLight 连接的传统全服务经纪人通常收取 2.5% 至 3.0% 的标准佣金。Houwzer 等区域折扣经纪商进一步把挂牌费压低到 1.0%。 因此，HomeLight
              不靠卖家预付佣金节省来竞争，而是依赖匹配算法速度和交易流动性选项。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
