      - number: '8.2'
        title: 公开与私人市场估值可比及倍数压缩
        blocks:
          - type: paragraph
            body: >-
              将 HomeLight 与公开和私人市场房地产科技可比公司对标，可以看到住宅科技商业模式的估值倍数差异。Opendoor Technologies、Offerpad Solutions 上市时市销率分别为
              3.0x 和 2.3x；Redfin、Compass 则分别为 6.7x 和 11.0x。2022 年后的市场严厉惩罚了承担直接库存风险和波动持有成本的资产负债表沉重型 iBuying
              模式，投资者严格区分资本密集型运营商与轻资产交易平台。HomeLight 的混合架构处于中间估值区间：Buy Before You Sell 收取固定 2.4% 费用（佛罗里达州为
              2.9%），提供备用保障报价而非立即买入；房屋公开市场挂牌最长 120 天，营销失败时才纳入账面。这种或有结构使其在正常市场下避免永久库存，相较纯 i买方
              可享有企业价值倍数溢价。但其业绩仍与交易量和按揭利率变化高度相关，无法获得纯企业 SaaS 常见的两位数收入倍数。成熟交易毛利对应 2.5x 至 3.5x 收入倍数。
