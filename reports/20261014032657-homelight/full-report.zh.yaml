  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与双边平台结构
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的商业生态围绕四类不同交易对手构建，并让它们在推荐、金融和市场交易界面上互动：住宅房屋卖家和买家、持牌房地产
              经纪人、机构抵押贷款机构和贷款经纪人，以及第三方现金投资者。在消费者侧，房屋卖家有两条截然不同的处置路径：传统算法经纪人 匹配，以及 Simple Sale 现金买断市场。使用经纪人匹配的卖家不向
              HomeLight 直接支付软件费；公司在成交时从匹配挂牌经纪人的 总佣金中抽取 33% 推荐费。相反，使用 Simple Sale 的卖家最快 10 天即可从预先批准的房地产投资者处获得全现金报价，以牺牲
              公开市场估值上行空间换取成交速度和消除或有条件。在企业和中介侧，持牌房地产经纪人及批发贷款经纪人是关键分销合作伙伴。 经纪人借助 HomeLight 获取合格的本地卖家挂牌并提供创新融资项目；抵押贷款机构则整合
              HomeLight 的 Buy Before You Sell 过桥方案，为换房买家消除债务收入比（DTI）摩擦和卖房或有条件。
