            body: >-
              评估 HomeLight 的整体风险，关键在于权衡高影响法律敞口与运营缓释措施。风险热力图显示，TCPA 集体诉讼敞口和 BBYS 库存回购负债的剩余严重性最高。电话营销合规体系仍在完善，BBYS
              承保流程也尚未经过长期房地产下行周期的公开检验。为守住投资资本，尽调必须持续跟踪明确的论点失效触发条件。第一，Hopkins v. HomeLight
              若获得集体认证且法定赔偿敞口不受约束，将直接威胁流动性。第二，BBYS 120 天库存回购若激增并超过仓储信贷阈值，将说明承保失灵。第三，若 CFPB
              正式执法，认定数字经纪商的转介费分成无效，核心经纪人匹配引擎的单位经济效益将被瓦解。
