      - number: '2.2'
        title: 市场规模视角：佣金池、净值流动性与估值区间
        blocks:
          - type: paragraph
            body: >-
              评估 HomeLight 的可服务市场，需要分别衡量经纪佣金和消费者房屋净值流动性等不同经济池，而不能只依赖一个宽泛的交易总额指标。 宏观上，National Association of Realtors 把
              2026 年 7 月美国现房成交中位价定为 $434,100，据此估算美国现房交易池约为 $1.8 trillion 至 $2.0 trillion，全年成交量为 4.0 million 至 4.5
              million 套。在这部分交易量中，住宅经纪总佣金池 约为每年 $70 billion 至 $80 billion，假设综合总佣金率为 5.0% 至 5.5%。HomeLight
              通过在交易交割时向合作经纪人收取约 33% 的推荐费，覆盖佣金池中估算 $15 billion 至 $25 billion、可由数字渠道触达的部分。同时，HomeLight 通过 Buy Before You
              Sell 覆盖卖家每年 $50 billion 至 $100 billion 的离开住宅净值需求；据称该项目已在全国交易中释放累计超过 $884 million 的净值，并促成每年超过 $1 billion
              的平台业务量。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
