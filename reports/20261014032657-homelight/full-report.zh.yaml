      - number: '4.4'
        title: 财务承销结论与机构数据缺口
        blocks:
          - type: paragraph
            body: >-
              从机构投资判断看，HomeLight 明确解决了有或条件购房者的摩擦，证明了产品与市场匹配，但基础财务透明度缺失。由于 HomeLight 仍是风险资本支持的私营公司，公司没有披露 GAAP
              收入、收入成本、各产品线毛利率或净经营收入。外部无法独立判断平台收入中有多少来自 高毛利的经纪人推荐佣金，有多少来自低毛利的过桥融资费或产权服务。此外，虽然 HomeLight 于 2026 年 4 月获得的
              $40 million BlackRock 风险债务证明其能获得非稀释性资本，但仓储借款额度、库存持有期以及 120 天购房实际损失率缺少经审计披露，构成重大投资
              判断障碍。经纪人对推荐费拖累的反弹，以及依据电话营销法规提起的法律程序，进一步放大运营不确定性。在 HomeLight 提供按业务单元 拆分的经审计 GAAP
              财务报表并披露过桥客户群表现之前，机构投资者必须把收入质量视为未验证，并将公司按资本敏感型混合平台建模， 而不是轻资产 proptech 市场。
            claimRefs:
