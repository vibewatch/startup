        title: 身份、覆盖范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              HomeLight 成立于 2012 年。2026 年 8 月的一份第三方资料称，公司是一家总部位于亚利桑那州 Scottsdale 的私营企业，另列有 San Francisco、New
              York、Seattle 和 Coppell 办公室。它不只是经纪人目录：官方页面介绍了经纪人匹配、找房与贷款连接、 Simple Sale 现金报价撮合、Buy Before You Sell
              房屋净值获取、Home Loans 以及交割服务。因此，现有证据更支持把 HomeLight
              看作交易编排平台，而不是单一产品市场。产品覆盖面带来多个潜在收入触点，但公开材料没有披露各产品当前收入、附加率或经审计的交易量。
