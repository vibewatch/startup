      - number: '5.5'
        title: 合规控制、平台可靠性与运营风险
        blocks:
          - type: paragraph
            body: >-
              运营一个覆盖推荐经纪、按揭发起和房地产收购的一体化 proptech 平台，会带来显著的监管和运营风险。HomeLight 建立了正式的监管 合规基础设施：在 California
              作为持牌企业房地产经纪商运营，房地产部门牌照号为 #01900940；同时通过 HomeLight Home Loans, Inc. 作为持牌抵押贷款机构运营，NMLS ID 为
              #1529229。这些牌照框架要求严格遵守《房地产结算程序法》（RESPA），防止关联 经纪、产权和放贷实体之间出现非法回扣或无正当服务对应的推荐费分成。


              从平台风险看，HomeLight 最紧迫的运营弱点是 Buy Before You Sell 内含的 120 天库存兜底。如果获批的离开住宅在 120 天内没有 在公开市场售出，HomeLight
              必须按贷款结清价值直接买入该房产。在房价下跌、按揭利率上升或区域流动性冻结的环境中，这项义务可能 把 HomeLight 从轻资产软件平台变成持有库存、承担持有成本和潜在清算损失的重资产地产公司。Better
              Business Bureau 留存的消费者 投诉记录显示三年内共有 26 起投诉，主要集中在激进的线索分发和沟通摩擦，说明公司需要持续治理消费者获客漏斗。
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE014
      - number: '5.6'
        title: 重点展品
        blocks:
          - type: callout
            title: 从线索生成转向资本整合型交易平台
            body: >-
              HomeLight 的核心产品从经纪人推荐目录走向资本整合型交易平台，是一次有意为之的转型。它把 Buy Before You Sell 净值解锁、数字按揭承销以及产权 /
              托管服务，公司捕获更高的总交易价值，同时引入库存兜底负债和对贷款机构资产负债表的依赖。
            calloutType: insight
            claimRefs:
              - CE001
              - CE006
              - CE010
          - type: callout
            title: Buy Before You Sell 的 120 天库存兜底负债
            body: >-
              Buy Before You Sell 的关键技术和运营风险在于：如果离开住宅在 120 天内无法在公开市场售出，HomeLight 按合同必须以贷款结清价值 买入该房产。在房市走弱或流动性不足时，这一机制会让
              HomeLight 的资产负债表暴露于被迫收购房产和剩余处置损失。
            calloutType: risk
            claimRefs:
              - CE007
