  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              HomeLight 处于住宅房地产经纪、按揭融资和数字消费者线索生成这三个强监管领域的交叉地带。公司的法律风险主要来自围绕电话营销 做法的在审集体诉讼。在 Hopkins v. HomeLight
              案中，原告在美国华盛顿西区联邦地区法院提起诉讼，指控 HomeLight 持续向登记 在全国禁止呼叫登记册上的电话号码拨打未经授权的营销电话并发送自动短信。2026 年 7 月，联邦法院驳回 HomeLight
              的撤诉动议， 允许集体诉讼进入证据开示阶段，并在《电话消费者保护法》（TCPA）下带来潜在法定责任风险：每次故意违规的赔偿额为 $500 至 $1,500。除电话营销诉讼外，HomeLight
              的核心变现模式也持续受到行业审查。行业批评者和竞争性消费者倡导平台称，HomeLight 是一家纸面房地产经纪商，从经纪人总佣金中收取 25% 推荐费，可能与《房地产结算程序法》（RESPA）第 8
              条的反回扣禁令相冲突。 HomeLight 则依据 12 U.S.C. 2607(c)(3) 的合作经纪豁免为该结构辩护；但 CFPB 对数字比价平台的指引仍在演变，监管重新解释始终是 持续威胁。
            claimRefs:
