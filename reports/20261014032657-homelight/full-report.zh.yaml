      - number: '2.3'
        title: 交易参与者中的买方、用户与合作伙伴分层
        blocks:
          - type: paragraph
            body: >-
              HomeLight 运营着一个多边交易平台，围绕四类核心市场参与者形成不同的买方、用户和付款方关系：搬迁中的房主、住宅房地产经纪人、
              抵押贷款发起人及机构房地产投资者。对搬迁中的房主，核心价值在于消除卖房或有条件，并提取离开住宅最高 90% CLTV 的净值， 从而实现同步购房；成交时收取固定 2.4%
              项目费。对房地产经纪人，HomeLight 是表外获客和工作流引擎，在成交时按 33% 的佣金 推荐分成变现。抵押贷款经纪人把 HomeLight
              当作分销伙伴，将离开住宅的负债从借款人的债务收入比计算中剔除，从而为超过 22,000 名参与贷款经纪人解锁按揭审批。最后，机构现金买家利用 HomeLight Simple Sale，在最短 10
              天内买入折价住宅库存， 无需承担零售营销开销。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
              - CM008
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
