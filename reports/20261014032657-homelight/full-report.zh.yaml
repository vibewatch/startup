          - type: callout
            title: 多平台使用与卖家低切换摩擦
            body: >-
              经纪人匹配门户不向消费者收取预付费用，也不要求排他协议，因此潜在卖家会在 HomeLight、Clever、Redfin 和本地经纪人目录之间 广泛多平台使用。HomeLight
              没有自有挂牌库存或独家消费者锁定，只能持续通过付费搜索广告获取卖家意向，使核心推荐引擎暴露于 数字营销通胀和搜索引擎算法变化之下。
