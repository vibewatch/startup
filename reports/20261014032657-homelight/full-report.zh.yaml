      - number: '7.3'
        title: 合作伙伴依赖、网络摩擦与资本结构
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的多产品分销模式高度依赖独立房地产经纪人与抵押贷款发起人的网络口碑。公司称其全国网络超过 30,000 名房地产经纪人和 22,000
              名贷款专员。不过，这一合作伙伴渠道容易受到经济和结构性压力冲击。全美房地产经纪人协会（NAR）佣金和解后，房地产佣金面临持续下压。合作经纪人按合同须从佣金总收入中向 HomeLight 支付 25%
              的推荐费，同时让 HomeLight 免于经纪业务责任；他们可能越来越抗拒分成，或绕开平台归因。此外，客服记录也显示合作协调存在问题：Better Business Bureau 三年内记录了 26
              起客户投诉，主要涉及不请自来的销售联系以及 Pro 订阅层级的计费纠纷。从资本结构看，HomeLight 转向风险债务为运营融资，并于 2026 年 4 月从 BlackRock 获得 $40 million
              债务额度。这笔债务负担出现在公司 2024 年 8 月 Series D 延伸轮投后股权估值下调至 $1.13 billion 之后；该估值低于 2022 年 $1.7 billion
              的峰值，压缩了契约缓冲，也提高了再融资敏感度。
