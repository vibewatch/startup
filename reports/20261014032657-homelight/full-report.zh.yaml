              - CE007
              - CE008
      - number: '5.3'
        title: 运营架构、软件栈与放贷整合
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的运营架构由六层技术栈组成，把面向消费者的网页入口与交易承销逻辑和后台金融基础设施连接起来。顶层入口层通过专门的
              网页端点获取买家和卖家，包括主要消费者门户、landing-pages.homelight.com 上的定向获客漏斗、homes.homelight.com 上的 本地挂牌信息流，以及
              lenders.homelight.com 上的专门合作伙伴入口。线索数据随后流入专有交易分析和经纪人匹配引擎，查询历史 MLS 成交记录和表现指数，以优化经纪人分配。


              下游交易层负责金融承销和交割执行。HomeLight 于 2019 年收购数字抵押贷款初创公司 Eave, Inc. 后，整合了专有自动承销算法， 可在 24 小时内给出初步按揭承诺，并保证在 21
              天内完成贷款交割。对 Buy Before You Sell 交易，金融承销引擎直接与外部抵押银行 和经纪公司的贷款经纪人连接，支持全国超过 22,000 名参与贷款经纪人。由 HomeLight Closing
              Services 部门管理的结算层协调 数字产权审查、托管资金拨付和电汇验证，在统一数字工作流中把融资、产权保险和经纪佣金闭环整合。
