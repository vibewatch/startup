      - number: '3.5'
        title: 重点展品
        blocks:
          - type: callout
            title: 推荐佣金模式的结构性不对称
            body: >-
              HomeLight 与折扣推荐平台为房屋卖家提供了根本不同的经济交易。Clever Real Estate 等低佣金竞争者协商明确的 1.5% 挂牌费，
              把总节省直接让给房主，同时要求经纪人让出利润率。相比之下，HomeLight 保留传统的 2.5% 至 3.0% 佣金结构，在后台通过 未披露、受 RESPA
              豁免保护的经纪人推荐费从合作伙伴变现。这样做能维持全额收费经纪人的积极性，但也让价格敏感型卖家暴露在 低成本替代方案面前。
            calloutType: insight
            claimRefs:
              - CP001
