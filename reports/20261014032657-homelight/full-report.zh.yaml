  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与平台定价架构
        blocks:
          - type: paragraph
            body: >-
              HomeLight 运营一个多收入流交易平台，依靠软件驱动的经纪推荐、专业流动性产品和一体化结算服务，从住宅房地产交易中变现。公司
              最初是房地产经纪人匹配市场，后来在成交时按经纪人总佣金的一定比例向参与的经纪公司收取推荐费，从消费者经纪人介绍中变现。 HomeLight
              向房屋卖家和买家免费提供匹配服务，不收挂牌费，但合作经纪人依据《房地产结算程序法》第 2607 条允许的合作经纪协议， 在结算时按合同向 HomeLight 交出部分总佣金。为了超越推荐佣金，HomeLight
              推出 Buy Before You Sell，现已成为其主要交易产品。 Buy Before You Sell 在大多数州按离开住宅售价收取标准 2.4% 固定项目费；Florida 为
              2.9%，Illinois 特定县因当地产权检索规定 另收 $1,500 产权费。Simple Sale 则提供场外现金报价路径，不向 HomeLight 收取明确的卖家项目费或维修费，而是通过投资者报价相对
              公平市场价值的价差获取经济价值。
