      - number: '1.2'
        title: 管理层覆盖与治理透明度
        blocks:
          - type: paragraph
            body: >-
              创始人 Drew Uher 仍任 CEO，这使创始人连续性成为战略和外部信誉的重要因素。HomeLight 官方领导团队页面还列出了运营、技术、 财务、法务、产品、销售、人才、营销及各业务线负责人。Sumant
              Sridharan 负责运营，Mike Abner 负责技术，Ankur Jain 负责财务， Alex Jee 负责法务和公司秘书事务，Homes 与 Closing Services
              则分别由专门的总裁负责。这个多产品平台的管理团队职能覆盖 较广的管理团队。不过，现有来源没有说明董事、委员会构成、投资人董事会权利、受益所有权、继任计划或高管留任条款。因此，治理实力
              和创始人依赖仍是待尽调问题，而非已验证结论。
