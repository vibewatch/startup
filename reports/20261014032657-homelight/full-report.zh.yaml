  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户工作流整合
        blocks:
          - type: paragraph
            body: >-
              HomeLight 提供一体化住宅交易平台，旨在把传统上割裂的买卖房屋步骤串起来。公司 2012 年以算法驱动的房地产经纪人匹配起家，
              随后有计划地把软件和服务目录扩展到相邻的高价值交易阶段。如今，产品覆盖四大支柱：核心 Agent Matching、Simple Sale 现金报价 撮合、Buy Before You Sell
              房屋净值过桥融资，以及结合 Closing Services 产权和托管能力的 HomeLight Home Loans。


              Agent Matching 是 HomeLight 顶部漏斗的获客和推荐变现引擎。公司不以雇佣经纪人的传统经纪商形式运营，而是分析超过 27 million
              笔历史住宅成交、经纪人成交率、挂牌价到成交价表现及客户评价，把消费者连接到所在微型市场中表现出色的独立经纪人。Simple Sale 面向更看重交易确定性和速度、而非最高总成交价的卖家，把数百家机构现金买家和
              iBuyer 汇聚到一个程序化市场。房主提交基本房产 信息后，最快两分钟即可收到多份无条件现金报价，从而绕开传统公开市场的布置、摄影和开放日摩擦。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
