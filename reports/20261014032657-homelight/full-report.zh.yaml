      - number: '6.2'
        title: 采用轨迹与批发渠道扩张
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的采用轨迹体现出一次重大战略转型：从纯消费者线索生成目录，转向一体化交易和嵌入式金融平台。历史上，消费者增长 由搜索引擎曝光和自动房屋估值计算器推动；公司文件称，这些工具已连接超过 1
              million 名生命周期客户，并促成 2,456,300 多次 买卖家与本地房地产专业人士的介绍。不过，交易变现日益转向 Buy Before You Sell（BBYS），这是为解决有或条件换房买家的流动性
              锁定而推出的净值解锁过桥融资机制。BBYS 覆盖 47 个州，允许获批借款人解锁现有房屋 70% 至 90% 的净值（最高 $2 million， 初始利率
              0%），从而对下一套房提交无或有条件购房报价。HomeLight 称，截至 2024 年 8 月已释放超过 $655 million 净值， 并在进入 2026 年时把累计释放净值扩大到超过 $884
              million。这一金融扩张由超过 40 家批发和零售贷款机构的机构合作支撑， 覆盖超过 10,000 名活跃贷款经纪人和 28,000 名顶尖房地产经纪人。
            claimRefs:
              - CU005
