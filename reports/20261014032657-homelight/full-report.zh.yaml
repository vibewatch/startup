  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、服务架构与交易范围
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的可服务市场涵盖数万亿美元规模的美国住宅房地产交易生态，具体聚焦消费者与行业专业人士交换资金、咨询服务和结算文件的 高摩擦交易环节。HomeLight
              不以传统全服务经纪商的方式竞争，而是把平台分成三层主要交易服务：数字房地产经纪人推荐匹配、通过 Buy Before You Sell 提供短期过桥及消除或有条件的融资，以及通过 Simple Sale
              为困境卖家或急售卖家撮合流动性。Disclosures.io 等数字工作流工具在 On-Market 阶段集中分发披露文件并跟踪潜在买家活动，帮助经纪人持续触达。相反，市场边界明确排除长期住宅
              按揭本金偿还、实体房产翻新、物业管理及持续性的多户住宅资产运营等更广泛住房支出，因为这些业务需要专门的成交后运营基础设施。
