      - number: '4.2'
        title: 资本充足性、债务工具与资产负债表风险
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的资本结构逐步演变，以支撑其接近资产负债表的过桥产品所需的流动性。不同于纯软件市场，Buy Before You Sell 使公司 暴露于潜在的库存承接风险。根据公开项目指南，搬入新房的客户有
              21 天挂牌出售旧房，并可在公开市场上最多出售 120 天。如果房产 在 120 天清算窗口内没有售出，HomeLight 承诺先按 Loan Payoff Value
              直接买入房屋，再重新挂牌。为了给过桥垫款和持续运营 提供资金，HomeLight 把股权融资与信贷工具结合起来。2024 年 8 月，HomeLight 完成由 Zeev Ventures 领投、Stereo
              Capital 和 Menlo Ventures 参与的 $20 million Series D 增发轮，使自成立以来累计筹集的股权和债务资本超过 $412 million。随后在 2026 年 4
              月，HomeLight 从 BlackRock 获得 $40 million 风险债务工具。虽然这些信贷工具提供中期营运资金和仓储容量，但机构 承销需要更细的披露，包括借款成本、工具契约、垫款率，以及
              HomeLight 累计释放的 $884 million 房屋净值对应的违约频率。
