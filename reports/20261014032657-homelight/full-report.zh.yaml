  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这套分步决策架构把宏观房地产环境、B2B 批发业务进展、信用风险和估值重置串联到最终推荐。
    data:
      nodes:
        - label: 宏观与住房背景
          detail: 抵押贷款利率高企、利率锁定效应压低转售速度；NAR 之后，佣金规则也在变化。
        - label: B2B 批发渠道转向
          detail: 公司退出资产负债表零售抵押贷款业务，转而依靠覆盖 46 个州的 40+ 家贷款方合作伙伴扩大先买后卖业务。
        - label: 运营规模与网络
          detail: 28k+ 经纪人网络、22k+ 名贷款专员和超过 $884M 的已释放房屋净值，显示市场需求存在。
        - label: 信用、资本与法律拖累
          detail: 仓储贷款条款未披露、120 天强制买入兜底以及 2026 年 TCPA 集体诉讼，都会放大下行风险。
        - label: 估值标记重置
          detail: 2024 年 8 月 D-III 轮融资将投后股权定价为 $1.13B，较 2022 年 $1.7B 的峰值低 34%。
        - label: 推荐：继续研究
          detail: 在 BBYS 亏损队列、仓储贷款条款和分项利润率披露并经审计前，保持克制立场。
      edges:
        - from: Macro & Housing Backdrop
          to: B2B Wholesale Channel Pivot
          label: 必然要求
        - from: B2B Wholesale Channel Pivot
          to: Operational Scale & Network
          label: 产生
        - from: Operational Scale & Network
          to: Credit, Capital & Legal Overhang
          label: 携带
        - from: Credit, Capital & Legal Overhang
          to: Valuation Mark Reset
          label: 计入定价
        - from: Valuation Mark Reset
          to: 'Recommendation: Research-More'
          label: 得出结论
    approximationNotes: null
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV011
      - CV012
