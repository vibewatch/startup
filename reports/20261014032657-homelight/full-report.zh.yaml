      - number: '3.2'
        title: 平台能力比较：匹配、流动性与放贷
        blocks:
          - type: paragraph
            body: >-
              HomeLight 相比纯经纪人目录形成实质产品差异的地方，在于其多产品交易栈。Clever Real Estate 或 Ideal Agent 只专注于把买卖双方 匹配给第三方经纪人，而 HomeLight
              还整合了自有融资和流动性解决方案。HomeLight 的旗舰差异化产品是 Buy Before You Sell （BBYS）：它以 0% 利率解锁最高 $2M
              房屋净值，让买家消除卖房或有条件，在挂牌出售现住房之前购买下一套房。如果离开住宅在 120 天后仍未在公开市场售出，HomeLight 保证按 Loan Payoff Value
              买入该房产以提供流动性。此外，HomeLight 还提供 Simple Sale， 这是一个即时现金报价市场，把房主直接连接到预先批准的房地产投资者，并在 10 天内完成交割。相比之下，Redfin 已收缩其表内
              iBuying，折扣网络则依靠第三方投资者推荐链接，不承担承销义务。
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP012
      - number: '3.3'
        title: 佣金经济性、推荐费与项目定价
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的经济机制与折扣竞争者明显不同。HomeLight 向卖家免费提供消费者经纪人匹配服务，在成交时从匹配经纪人赚取的总佣金 中收取未披露比例。该安排依据《房地产结算程序法》（RESPA，12
              U.S.C. 2607）第 8 条的合作经纪推荐例外构建。由于推荐费 来自卖家支付的佣金池，匹配经纪人在经济上缺乏把标准 2.5% 至 3.0% 挂牌费打折的动力。相反，HomeLight 通过透明的消费者
              项目费把 Buy Before You Sell 变现：大多数州收取离开住宅售价的 2.4%（Florida 为 2.9%，Illinois 特定县另收 $1,500 产权费）。在 Simple Sale
              中，HomeLight 宣传零项目费，但卖家承担相对公平市场价值的隐性折价，而公司营销页面没有披露该折价。
            claimRefs:
              - CP002
              - CP007
              - CP009
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP007
              - CP009
              - CP013
      - number: '3.4'
        title: 护城河持久性、切换成本与商品化压力
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的竞争护城河容易受到消费者多平台使用和搜索营销依赖的影响。房屋卖家在线提交匹配请求不产生金钱切换成本，因此潜在 搬迁者经常同时向 HomeLight、Clever Real Estate
              和本地门户申请推荐。HomeLight 没有自有挂牌库存或黏性买家工作流，其经纪人 匹配推荐引擎持续承受获客压力。不过，HomeLight 通过抵押贷款机构网络打造了防御性分销锁定。它与全国超过 22,000
              名贷款经纪人 合作，把 Buy Before You Sell 定位为合作伙伴赋能工具，帮助抵押贷款发起人从借款人债务收入比中剔除离开住宅的按揭负债并赢得购房贷款。 Alaska、Massachusetts 和
              New York 的监管限制虽然压缩了地域覆盖，但这一 B2B2C 贷款渠道形成了纯折扣挂牌门户难以迅速复制的分销护城河。
            claimRefs:
              - CP001
