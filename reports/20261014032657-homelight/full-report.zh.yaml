  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、资本历史与 2022 年后的估值重置
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的投资逻辑正在变化：公司正从纯房地产经纪人推荐引擎，转向批发式、多产品住宅交易生态。公司成立于 2012 年，最初靠 25% 至 33% 的佣金分成匹配模式产生现金流。然而，2019 年收购
              Eave 后，公司意识到直接发放抵押贷款的资本密集度和合作伙伴摩擦，于 2024 年有意退出零售贷款，将旗舰产品 Buy Before You Sell 融入独立抵押贷款机构和头部经纪人的 B2B
              能力。此举消除了渠道冲突，也让 HomeLight 能在 46 个州借助第三方贷款专员作为无偿获客力量。

              从资本化看，截至 2026 年，HomeLight 通过股权和债务轮次累计融资超过 $412 million。公司在 2022 年 6 月完成 $60 million Series D 融资后，投后股权估值达到
              $1.7 billion 峰值。但在更广泛的房地产科技估值倍数压缩和高利率环境下，HomeLight 于 2024 年 8 月将估值重置，以 Zeev Ventures 领投、Stereo Capital 和
              Menlo Ventures 参与的 $20 million Series D-III 延伸轮，完成 $1.13 billion 投后估值。相较 2022 年峰值，表面估值约下调 34%。2026 年 4
              月，HomeLight 又从 BlackRock 获得 $40 million 风险债务，用于扩大平台和交易自动化。资本结构虽体现出顶级机构支持，但 2022
              年后的估值说明，投资者关注点已从不设上限的增长转向资本效率、单位经济和流动性纪律。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
