      - number: '6.3'
        title: 持久性、评价情绪与集中度风险
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的平台覆盖广，机构合作伙伴采用度也高，合作方包括 The Loan Store、Luminate Home Loans（及其子公司 NEO Home Loans）和 American
              Pacific Mortgage 等重要抵押贷款机构，但客户留存和关系持久性仍面临明显阻力。经纪人端，HomeLight 于 2022 年 10 月把强制成交推荐费从 25% 提高到 33%，与 Zillow
              的激进抽成率相似，压低经纪人的净佣金率，由此带来平台外线索 流失和资深高产经纪人抵触的结构性风险。在消费者侧，争议记录和客户评价聚合平台持续出现有关数据变现和激进外呼营销的投诉。 Better Business
              Bureau 记录显示，截至 2026 年 2 月的前三年内有 26 起消费者投诉，主要指向消费者为房屋估值或 Simple Sale 咨询提交联系方式后收到未经请求的电话和短信。此外，消费者诉讼（包括 2026
              年在 Washington 提起、仍在进行的联邦《电话消费者 保护法》（TCPA）集体诉讼）凸显了 HomeLight 数字线索生成漏斗的法律和运营脆弱性。
