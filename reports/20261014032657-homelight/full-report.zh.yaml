      - number: '5.2'
        title: 交易工作流、Buy Before You Sell 与方案交付
        blocks:
          - type: paragraph
            body: >-
              住宅房地产的核心运营难题是有或条件的换房交易：准备购买新房的房主通常需要从离开住宅中释放的房屋净值支付首付，但贷款机构 设定严格的债务收入比（DTI）上限，阻止借款人同时背负两笔按揭。HomeLight 通过旗舰
              Buy Before You Sell（BBYS）项目解决这一 结构性摩擦；该项目相当于由软件驱动的新型过桥融资工具。


              在 BBYS 运营流程中，HomeLight 用自动估值算法评估房主的离开住宅，并在最短 24 小时内批准净值垫款。该项目允许借款人以 0% 利率解锁现有房屋最高 90% 的综合贷款价值比（CLTV）及最高 $2
              million 的房屋净值，直接把资金用于目标房屋首付。关键在于， HomeLight 会对离开住宅发出正式备用买入报价，使合作按揭贷款机构能够从客户 DTI 计算中剔除现有房屋的按揭债务。新房交割后，
              卖家按合同有 21 天时间把空置的离开住宅挂牌，并在 120 天内完成出售，同时向 HomeLight 支付最终成交价 2.4% 的固定项目费 （Florida 为 2.9%）。
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
