      - number: '8.4'
        title: 退出准备度、流动性悬置与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的退出准备度受资本化历史、私人治理结构和未解决运营或有事项限制。累计融资超过 $412 million
              后，公司优先股各轮次带有大量清算优先权；普通股股东和初级期权池在获得资本收益前仍面对显著优先级悬置。2024 年 8 月 Series D-III 延伸轮的稀释约为 2%（$20 million 对应 $1.13
              billion 的投后估值），普通股股东和初级期权池在实现有意义的资本收益前仍面对显著的优先级悬置。2026 年 4 月引入 $40 million
              风险债务，也带来严格现金流和偿债义务，限制房地产下行期间的运营空间。法律和监管审查进一步增加近期流动性事件摩擦。2026 年联邦 TCPA 集体诉讼指控未经请求的营销通信，公司还因引导消费者转向 33%
              佣金分成的经纪人推荐而受审查。IPO 必须披露 BBYS 客户群损失严重度、仓储债务契约阈值和法律准备金。投入资本前，尽调须核实 BBYS 强制收购频率是否超过发起量 3%、高级贷款方契约是否将流动性限制在
              $30 million 以下，以及 NAR 后佣金压力是否导致经纪公司放弃推荐费协议。
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV011
              - CV013
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 立场依据：为何继续研究胜过直接买入或回避
            body: >-
              HomeLight 通过批发式嵌入分销和庞大经纪人网络展现运营差异化，因此不应回避。不过，单位层面损失严重度、仓储额度和与贷款机构的利润分成仍属私密信息；在 $1.13 billion
              估值投入新资本，尾部风险尚无法量化。投资者应继续研究，直到获得经审计的客户群指标。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV014
          - type: callout
            title: 仓储债务契约与住宅清算折价下的估值敏感性
            body: >-
              Buy Before You Sell 承诺房屋 120 天后仍未售出时按贷款清偿价值买入，使 HomeLight 暴露于停滞市场的尾部风险。若房价下跌超过权益缓冲，HomeLight
              必须亏损吸收并处置住宅抵押品，可能违反仓储信贷契约，或被迫进行紧急股权稀释融资。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
