  - id: TV002
    title: 正 / 反论点表
    columns:
      - 论点支柱
      - 核心论据
      - 证据与驱动因素
      - 哪些情况会改变判断（致命触发点）
    rows:
      - - B2B 批发转型
        - 取消自营零售贷款中间环节、与 40+ 家贷款机构合作后，竞争对手会变成分销渠道。
        - Buy Before You Sell 已覆盖 46 个州和 10,000+ 名贷款经纪人。
        - 贷款方流失、合作伙伴去中介化，或批发收入分成压缩利润率。
      - - 附带条件的交易被打破
        - 在无需双重抵押贷款资格审查的情况下释放最高 90% 的 CLTV 房屋净值，形成黏性的消费者价值主张。
        - 计划收取 2.4% 固定费用（FL 为 2.9%），120 天后按贷款结清价值提供备用报价。
        - 被迫购房占成交量超过 3%，导致资产负债表上的库存积压。
      - - NAR 后佣金压力
        - NAR 和解变化及买方经纪人佣金压缩，威胁核心经纪人匹配转介收入。
        - 经纪人面临费用压力；33% 转介费可能引发抵制或去中介化。
        - 参与经纪人网络降至 20,000 以下，或经纪人普遍拒绝支付转介费。
      - - 资本与信贷强度
        - 债务依赖和桥接融资使平台暴露于利率波动和仓储融资流动性不足。
        - 累计融资 $412M+，包括 2026 年 BlackRock 的 $40M 债务；仓储契约未披露。
        - 流动性挤压、债务契约违约，或待售房产清算折扣激增。
    notes: 论点基于已核实的 HomeLight 计划机制、市场披露和竞争摩擦点。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设与驱动因素
      - 估值 / 回报逻辑
      - 概率信号
      - 下行 / 退出触发点
    rows:
      - - 乐观情景
        - B2B 贷款机构渠道加速；BBYS 交易量增至原来的三倍；降息重振住房流动性；违约率低于 0.5%。
        - 退出估值 $2.2B - $2.8B（以 $1.13B 为基准回报 2.0x - 2.5x）；平台 $500M+ 跑动率对应 EV / 收入 4.0x - 5.0x。
        - 20%
        - 快速公开上市（IPO），或被大型贷款机构 / 门户战略收购（如 Rocket、CoStar）。
      - - 基准情景
        - 贷款机构在 46 个州稳步采用；核心转介收入趋稳；BBYS 带来小幅正单位利润。
        - $1.1B - $1.4B 估值（以 $1.13B 为基准回报 0.9x - 1.2x）；$400M 跑动率对应 EV / 收入 2.5x - 3.0x。
        - 50%
        - 私有持有期延长；二级流动性以小幅折扣实现；最终并购或赞助方收购。
      - - 悲观情景
        - 高利率持续；住房周转仍低迷；库存被迫购入激增；TCPA / 监管处罚。
        - $450M - $650M 估值（下轮融资或资本重组；损失 40% - 60%）；清算优先权形成悬置。
        - 30%
        - 仓储信贷挤压；高级优先权抹去普通 / 次级股权；困境资产出售。
      - - 下行底线
        - 严重信贷冲击、批发合作伙伴反弹，或未清算住宅桥接库存出现灾难性损失。
        - 资产回收 / 清算价值低于 $250M（回报低于 0.25x）。
        - 低（尾部低于 10%）
        - BlackRock 风投债务违约；仓储贷款方对质押住宅抵押品进行止赎。
    notes: 估值区间参照历史 $1.7B 峰值、2024 年 8 月 $1.13B 重置估值和公开可比公司的交易倍数建模。
    claimRefs:
      - CV004
      - CV009
      - CV010
      - CV014
