      - number: '4.3'
        title: 商业牵引力与合作伙伴分销经济性
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的市场进入依靠嵌入式 B2B2C 合作网络，而不是直接面向消费者投放广告来推动交易量。公司通过与超过 40 家全国性批发和 零售抵押贷款机构合作分销 Buy Before You
              Sell，包括 The Loan Store 和 Luminate Home Loans。通过直接接入贷款机构的贷款发起 工作流，HomeLight
              帮助贷款经纪人消除客户的卖房或有条件，并将离开住宅的按揭负债从债务收入比计算中剔除。该渠道协同使 HomeLight 将 Buy Before You Sell 覆盖扩展到 47 个州，调动超过 22,000
              名获批贷款经纪人和 28,000 名房地产经纪人。平台披露称， HomeLight 服务的年交易量达数十亿美元，覆盖超过 1 million 名生命周期客户，并已释放超过 $884 million
              的离开住宅净值。不过， 合作伙伴分销也带来法律和运营摩擦：HomeLight 持续面临监管和合规风险，包括 2026 年依据《电话消费者保护法》针对未经请求营销
              通信提起的联邦集体诉讼，以及竞争平台围绕佣金分成安排提出的反垄断审查。
            claimRefs:
