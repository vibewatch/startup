      - number: '2.4'
        title: 采用驱动因素、监管框架与关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              HomeLight 一体化平台的采用由住房市场结构、消费者对交易确定性的需求以及经纪人争夺稀缺房源的竞争共同推动，但仍受到重大监管 约束和估值权衡的影响。HomeLight
              推荐费模式是否合法，直接取决于《房地产结算程序法》第 8(c)(3) 条规定的合作经纪豁免： 该豁免允许持牌经纪人分成费用，但禁止无正当服务对应的结算服务回扣。不过，市场采用受到明显地域限制：由于当地放贷监管，
              Buy Before You Sell 在 Alaska、Massachusetts 和 New York 不可用；Chicago 的市政交割规则还会增加强制产权检索费。此外， 消费者通过 Simple Sale
              接受即时现金报价会面临显著定价摩擦，因为历史上现金投资者报价相对公开市场估值折价 10% 至 50%。 要评估 HomeLight 的持久单位经济性，还需要解决业务线毛利率和仓储债务能力等私有披露缺口。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
      - number: '2.5'
        title: 重点展品
        blocks:
          - type: callout
            title: RESPA 下的佣金推荐经济性
            body: >-
              HomeLight 的核心经纪人匹配业务依靠成交经纪人支付 33% 的推荐费，而不是向消费者预收费用。该机制在 RESPA 第 8(c)(3) 条 的合作经纪豁免下合法，但依赖标准的 2.5% 至 3.0%
              总挂牌佣金，并把经济成本直接转入成交结算资金。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM004
          - type: callout
            title: 速度与实际成交价之间的流动性权衡
            body: >-
              HomeLight 通过两种定价逻辑相反的机制解决房屋搬迁中的时间错配：Buy Before You Sell 收取可预期的 2.4% 固定费，同时保留 公开市场的上行空间；Simple Sale 则在 10
              天内把房产转给现金买家，历史估值折价幅度为 10% 至 50%。
            calloutType: risk
            claimRefs:
              - CM005
