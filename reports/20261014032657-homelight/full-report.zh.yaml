      - number: '7.2'
        title: 运营执行与 Buy Before You Sell 库存看跌期权风险
        blocks:
          - type: paragraph
            body: >-
              运营上，HomeLight 的旗舰增长项目——Buy Before You Sell（BBYS）——引入了不同于纯软件市场的资产负债表风险。BBYS 向房屋卖家收取离开住宅售价 2.4%
              的固定项目费（Florida 提高至 2.9%，Chicago 地区特定县另收 $1,500）。核心运营失败模式集中在 流动性和市场清算摩擦上。如果登记房屋在 120 天内无法在公开市场售出，HomeLight
              按合同承诺在重新挂牌前以指定的 Loan Payoff Value 买入房屋。在按揭利率偏高或区域需求收缩的宏观环境中，一批未售库存看跌期权可能迫使 HomeLight 吸收实体住宅库存，挤压
              仓储信贷额度并消耗营运资金。关键是，HomeLight 没有公开披露历史客户群违约率、被迫买入频率或平均持有期损失。此外，地域限制 进一步凸显本地法律复杂性：BBYS 在 Alaska、Massachusetts
              和 New York 完全不可用。消费者获客环节，评价平台记录了这样的 消费者摩擦：房屋估值咨询触发未经请求的多经纪人外呼，而不是直接现金报价。
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR011
              - CR015
