      - number: '8.3'
        title: 情景分析：乐观、基准与悲观回报结果
        blocks:
          - type: paragraph
            body: >-
              为评估当前 $1.13 billion 参考估值下的风险调整回报，我们以 36 个月的投资判断周期建模三种运营情景。在乐观情景（概率 20%）中，随着利率回落，住宅房地产交易速度加快，HomeLight 超过
              10,000 名贷款专员和 28,000 名经纪人组成的网络将被贷款机构广泛采用。Buy Before You Sell 发起量快速增长，违约率和库存吸收率维持在 0.5% 以下。在此条件下，平台年化运行收入达到
              $500 million，借助 IPO 或大型住房门户的溢价战略收购，退出估值可达 $2.2 billion 至 $2.8 billion，相当于入场估值 $1.13 billion 的 2.0x 至 2.5x
              回报。

              在基准情景（概率 50%）中，按揭周转温和改善，B2B 贷款机构渠道以稳健速度采用。核心经纪人匹配业务持续产生现金，但全国房地产经纪人协会和解后佣金受到适度挤压。BBYS 保持正的运营贡献利润率，120
              天库存接管率控制在 2.0% 以下。HomeLight 产生约 $400 million 的运行率收入，对应估计 $1.1 billion 至 $1.4 billion 的企业价值（资本回报 0.9x 至
              1.2x），最终可能通过私募股权资本重组或战略赞助方收购退出。在悲观情景（概率 30%）中，房地产锁定期延长，交易数量受到压制；当地房价降温则推动 120
              天后的被迫买入增加。库存持有成本叠加营销纠纷带来的法律负债，压低利润率，企业价值估计降至 $450 million 至 $650 million，并造成初级股权严重稀释。
