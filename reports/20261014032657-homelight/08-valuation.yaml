- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Thesis Pillar
  - Core Argument
  - Evidence & Drivers
  - What Would Change View (Kill Trigger)
  rows:
  - - B2B Wholesale Pivot
    - Disintermediating proprietary retail lending to partner with 40+ lenders turns competitors into distribution channels.
    - Buy Before You Sell deployed across 46 states and 10,000+ loan officers.
    - Lender attrition, partner disintermediation, or margin compression from wholesale revenue sharing.
  - - Contingency Disruption
    - Unlocking up to 90% CLTV home equity without dual-mortgage qualification creates a sticky consumer value proposition.
    - Program charges 2.4% flat fee (2.9% in FL) and backup offers at loan payoff value after 120 days.
    - Forced-purchase frequency exceeding 3% of volume, causing inventory overhang on balance sheet.
  - - Post-NAR Commission Pressure
    - NAR settlement changes and buyer agent commission compression threaten core agent-matching referral revenues.
    - Agents face fee pressure; 33% referral fee may trigger pushback or disintermediation.
    - Drop in participating agent network below 20,000 or systemic agent refusal to pay referral fees.
  - - Capital & Credit Intensity
    - Debt dependence and bridge financing expose platform to interest rate volatility and warehouse illiquidity.
    - Cumulative $412M+ raised including $40M BlackRock debt in 2026; warehouse covenants undisclosed.
    - Liquidity squeeze, debt covenant breach, or spike in departing property liquidation discounts.
  notes: Arguments reflect verified HomeLight program mechanics, market disclosures, and competitive friction points.
