callouts:
- calloutType: recommendation
  title: 'Stance Justification: Why Research-More Trumps a Directional Buy or Avoid'
  body: HomeLight exhibits clear operational differentiation through its wholesale embedded distribution and vast agent network,
    precluding an avoid recommendation. However, because unit-level loss severities, warehouse lines, and margin splits with
    lenders remain private, committing fresh capital at a $1.13 billion valuation carries unquantified tail risk. Investors
    should maintain a disciplined research-more posture until audited cohort metrics are provided.
  claimRefs:
  - CV001
  - CV003
  - CV006
  - CV014
- calloutType: risk
  title: Valuation Sensitivity to Warehouse Debt Covenants and Residential Liquidation Discounts
  body: Buy Before You Sell's commitment to purchase homes that fail to sell after 120 days at loan payoff value exposes HomeLight
    to tail risk in stagnant housing markets. If home price depreciation outpaces equity buffers, HomeLight must absorb and
    liquidate residential collateral at a loss, potentially breaching warehouse credit covenants or forcing emergency equity
    dilutive financing.
  claimRefs:
  - CV007
  - CV008
  - CV009
