  - CV006
  - CV007
  - CV008
  - CV011
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key Assumptions & Drivers
  - Valuation / Return Logic
  - Probability Signal
  - Downside / Exit Triggers
  rows:
  - - Bull Case
    - B2B lender channel accelerates; BBYS volume triples; rate cuts revive housing mobility; low default rates (<0.5%).
    - $2.2B - $2.8B exit valuation (2.0x - 2.5x return on $1.13B basis); 4.0x - 5.0x EV/revenue on $500M+ platform run-rate.
    - 20%
    - Rapid public listing (IPO) or strategic acquisition by mega-lender/portal (e.g., Rocket, CoStar).
  - - Base Case
    - Steady lender adoption across 46 states; core referral revenue stabilizes; BBYS delivers modest positive unit margins.
    - $1.1B - $1.4B valuation (0.9x - 1.2x return on $1.13B basis); 2.5x - 3.0x EV/revenue on $400M run-rate.
    - 50%
    - Extended private holding; secondary liquidity at modest discount; eventual M&A or sponsor buyout.
  - - Bear Case
    - High interest rates persist; housing turnover remains depressed; inventory forced purchases spike; TCPA/regulatory penalties.
    - $450M - $650M valuation (down-round or recapitalization; 40% - 60% loss); liquidation preference overhang.
    - 30%
    - Warehouse credit squeeze; senior preference wipeout of common/junior equity; distressed asset sale.
  - - Downside Floor
    - Severe credit shock, wholesale partner revolt, or catastrophic loss on unliquidated residential bridge inventory.
    - Asset-recovery / liquidation value under $250M (<0.25x return).
    - Low (<10% tail)
    - Default on BlackRock venture debt; warehouse lender foreclosure on pledged residential collateral.
  notes: Valuation ranges modeled against historical $1.7B peak, $1.13B August 2024 reset, and public comp trading multiples.
