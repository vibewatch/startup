evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-stakeholder-enumeration
    missingEvidence: >-
      A complete director roster, committee structure, beneficial ownership table, investor rights schedule, and
      executive retention package.
    whyItMatters: >-
      Public executive titles do not establish voting control, board oversight, succession readiness, or investor
      influence.
    diligencePath: >-
      Request the current cap table, charter, voting agreements, board and committee minutes, and executive employment
      and retention agreements.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited revenue, ARR where applicable, gross margin, EBITDA, cash flow, cash balance, and product-line
      contribution data.
    whyItMatters: Funding raised and transaction value do not establish recurring revenue, profitability, cash burn, or liquidity.
    diligencePath: Obtain audited statements and monthly management accounts reconciled by product, geography, and legal entity.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-terms
    missingEvidence: >-
      Financing documents supporting the reported total raised, valuation, investor rights, debt maturity, interest,
      security, covenants, and warrants.
    whyItMatters: >-
      Reported funding is not cash available, and headline valuation does not reveal liquidation preferences or
      common-equity value.
    diligencePath: >-
      Reconcile the cap table and cash ledger to signed equity and debt documents, including the reported BlackRock
      facility.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Independently verified definitions and time series for active agents, lenders, clients, transaction value,
      retention, and concentration.
    whyItMatters: >-
      Company-displayed cumulative or annual metrics cannot establish active demand, cohort quality, or revenue
      conversion without denominators.
    diligencePath: >-
      Request cohort exports and counterparty registers, then reconcile them to closed transactions and recognized
      revenue.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: consumer-complaints
    missingEvidence: >-
      Complaint incidence by product and transaction cohort, consent logs, opt-out performance, resolution time, and
      repeat-contact rates.
    whyItMatters: >-
      Raw complaints identify failure modes but cannot quantify prevalence or financial exposure without a customer
      denominator.
    diligencePath: Audit CRM consent records and complaint tickets against product-level transaction cohorts and resolution outcomes.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: revenue-breakdown-by-product
    missingEvidence: >-
      Audited financial statements or segment disclosures detailing HomeLight's net revenue, gross margin, and
      transaction take-rates across agent matching, Buy Before You Sell, and title/closing services.
    whyItMatters: >-
      Without product-level revenue decomposition, investors cannot determine whether platform gross profit is driven by
      high-margin software/referral take-rates or capital-intensive bridge lending spreads.
    diligencePath: >-
      Request confidential management financial exhibits or audited income statements detailing business-line revenue
      and direct cost of goods sold for 2024-2026.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: regional-regulatory-costs
    missingEvidence: >-
      Empirical data on unit economics and legal compliance costs across states with restrictive real estate licensing
      or title requirements such as New York, Massachusetts, and Cook County, Illinois.
    whyItMatters: >-
      State-specific exclusions and mandated title insurance fees directly constrain geographical TAM and compress
      contribution margins in major metropolitan markets.
    diligencePath: >-
      Interview regional title attorneys and evaluate state-by-state licensing filings for HomeLight Home Loans and
      Disclosures.io.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: material
    topic: competitor-conversion-economics
    missingEvidence: >-
      Audited referral take rates and agent lead-to-close conversion rates comparing HomeLight against Clever Real
      Estate and Ideal Agent.
    whyItMatters: >-
      Without closed-transaction conversion data and exact agent referral splits, relative channel efficiency and
      customer acquisition ROI cannot be independently verified.
    diligencePath: >-
      Request cohort-level partner agent close rates and average referral fees collected per transaction across top 20
      metropolitan markets.
    relatedQuestionRefs:
      - QP004
  - type: missing-source
    severity: material
    topic: simple-sale-discount-rates
    missingEvidence: >-
      Disclosed average discount to fair market value on completed Simple Sale cash transactions versus traditional MLS
      listings.
    whyItMatters: >-
      Assessing seller value trade-offs and investor margins across Simple Sale requires empirical realized transaction
      pricing.
    diligencePath: >-
      Obtain matched-pair historical sales records comparing Simple Sale cash purchase prices to subsequent investor
      resale values.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margin-breakdown
    missingEvidence: >-
      Audited GAAP income statements disclosing net revenue by line (agent matching referral vs BBYS program fees vs
      title/mortgage services), gross margins, and customer acquisition costs.
    whyItMatters: >-
      Prevents institutional assessment of revenue quality, business-line unit margins, and profitability path across
      disparate business models.
    diligencePath: >-
      Request management financial pack under NDA covering fiscal years 2024 through 2026 with product-level revenue and
      contribution margin breakdown.
  - type: private-evidence-only
    severity: blocking
    topic: bbys-warehouse-and-default-risk
    missingEvidence: >-
      Historical cohort performance on Buy Before You Sell, including frequency of client properties failing to sell
      within 120 days, forced-purchase loss rates, and debt facility covenant headroom.
    whyItMatters: >-
      Exposes the company to significant balance sheet inventory absorption and capital impairment during residential
      housing turnover slowdowns.
    diligencePath: >-
      Request warehouse debt facility credit agreements, lender borrowing base certificates, and historical aging
      schedules for all Buy Before You Sell collateral.
  - type: missing-source
    severity: material
    topic: simple-sale-investor-discount
    missingEvidence: >-
      Realized discount percentages and average haircut relative to fair market value accepted by sellers utilizing
      Simple Sale investor cash offers.
    whyItMatters: >-
      Determines whether Simple Sale represents a competitive alternative to traditional listings or a predatory
      liquidity route during market distress.
    diligencePath: >-
      Perform transaction sample study comparing HomeLight Simple Sale accepted offers against automated valuation model
      benchmarks and subsequent retail resales.
  - type: private-evidence-only
    severity: material
    topic: referral-split-and-lender-take-rate
    missingEvidence: Contractual referral fee split schedules across participating brokerages and lender channel revenue-sharing terms.
    whyItMatters: >-
      Determines net platform retention and pricing power amidst increasing regulatory and competitive pressure on
      buyer/seller agent commissions.
    diligencePath: >-
      Review master service agreements and partner commission schedules for top 20 lender and agent brokerage
      relationships.
  - type: private-evidence-only
    severity: material
    topic: buy-before-you-sell-inventory-risk
    missingEvidence: >-
      Audited cohort data on Buy Before You Sell 120-day forced purchase frequencies, loan payoff realization values,
      and warehouse credit facility loss ratios.
    whyItMatters: >-
      Without forced purchase frequency and loss performance data, underwriters cannot assess balance sheet
      vulnerability under real estate price correction scenarios.
    diligencePath: >-
      Request historical BBYS transaction logs from 2023-2026 showing the percentage of departing residences acquired by
      HomeLight after 120 days and subsequent net sale proceeds.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: minor
    topic: agent-matching-algorithm-validation
    missingEvidence: >-
      Independent benchmark evaluation or algorithmic audit of HomeLight's agent recommendation scoring methodology
      against broad MLS transaction outcomes.
    whyItMatters: >-
      Agent matching differentiation relies on analyzing 27M+ transactions, but match quality conversion and referral
      fee impact on agent selection are not externally auditable.
    diligencePath: >-
      Review internal match conversion telemetry, agent acceptance rates by market, and consumer repeat engagement
