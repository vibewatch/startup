    whyItMatters: >-
      Agent dissatisfaction with high 33% take-rates could drive partner churn or off-platform circumvention, impairing
      platform monetization durability.
    diligencePath: >-
      Obtain agent cohort retention curves, repeat transaction frequency per active agent, and survey data on agent
      commission negotiation trends.
  - type: private-evidence-only
    severity: material
    topic: buy-before-you-sell-performance
    missingEvidence: >-
      Audited cohort metrics disclosing the proportion of Buy Before You Sell properties bought out by HomeLight at Loan
      Payoff Value and net carrying costs incurred prior to final liquidation.
    whyItMatters: >-
      If regional housing market turnover slows, high 120-day buyout put volumes could rapidly tie up balance-sheet cash
      and breach warehouse debt covenants.
    diligencePath: >-
      Obtain confidential credit performance reports, warehouse facility borrowing base certificates, and historical
      foreclosure or liquidation loss rates.
