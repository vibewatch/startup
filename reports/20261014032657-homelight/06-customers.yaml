callouts:
  - calloutType: "insight"
    title: "B2B2C Channel Shift Transforms Platform Unit Economics"
    body: "HomeLight's strategic expansion into wholesale lending via Buy Before You Sell fundamentally alters its customer acquisition dynamics. Rather than relying entirely on direct consumer ad spend and organic search matching, HomeLight leverages over 10,000 partner loan officers and 28,000 agents as zero-CAC distribution nodes, monetizing through a 2.4% flat transaction fee while insulating the core business against standalone lead-generation volatility."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU007"
      - "CU008"
  - calloutType: "risk"
    title: "Telemarketing Friction and Legal Exposure Threaten Lead Generation"
    body: "Persistent consumer complaints regarding aggressive call distribution and an active 2026 federal TCPA class-action lawsuit highlight structural friction in HomeLight's consumer lead intake. Unsolicited outreach and multi-agent distribution undermine consumer trust, presenting ongoing brand and regulatory compliance risks across its core referral matching business."
    claimRefs:
