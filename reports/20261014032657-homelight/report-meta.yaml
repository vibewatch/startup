companyProfile:
  summary: >-
    HomeLight is a private residential real-estate technology company founded in 2012 and headquartered in Scottsdale,
    Arizona. It combines agent matching, Simple Sale cash-offer routing, Buy Before You Sell bridge financing, home
    loans, and closing services into a transaction-orchestration platform monetized through referral fees, program fees,
    and ancillary settlement services.
