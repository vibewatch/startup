            body: >-
              HomeLight's multi-product distribution model relies heavily on network goodwill across independent real
              estate agents and mortgage originators. The company claims a network exceeding 30,000 real estate agents
              and 22,000 loan officers nationwide. However, this partner channel is vulnerable to economic and
              structural pressure. Following the nationwide National Association of Realtors (NAR) commission
              settlement, real estate commissions have faced downward compression. Partner agents, who are contractually
