  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Customer Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              HomeLight delivers an integrated residential transaction platform designed to streamline the traditionally
              disjointed steps of buying and selling a home. Founded in 2012 around algorithmic real estate agent
              matching, the company has methodically broadened its software and services catalog into adjacent
              high-value transaction stages. Today, the product footprint encompasses four primary product pillars: core
              Agent Matching, Simple Sale cash-offer routing, Buy Before You Sell bridge equity financing, and HomeLight
              Home Loans paired with Closing Services title and escrow capabilities.


              Agent Matching serves as HomeLight's top-of-funnel customer acquisition and referral monetization engine.
              Rather than operating as a traditional brokerage with employed agents, the software analyzes more than 27
              million historical residential sales transactions, agent close rates, list-to-sale price performance, and
              client reviews to connect consumers with high-performing independent agents in their local micro-market.
              Simple Sale addresses sellers prioritizing transaction certainty and speed over maximum gross proceeds by
              aggregating hundreds of institutional cash buyers and iBuyers into a single programmatic marketplace. By
              submitting basic property specifications, homeowners can receive multiple competing non-contingent cash
              offers in as little as two minutes, bypassing traditional open-market staging, photography, and open-house
              friction.
            claimRefs:
              - CE001
