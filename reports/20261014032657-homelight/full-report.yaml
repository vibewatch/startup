  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Service Architecture, and Transaction Scope
        blocks:
          - type: paragraph
            body: >-
              The addressable market for HomeLight encompasses the multi-trillion-dollar US residential real estate
              transaction ecosystem, specifically isolating high-friction transactional events where consumers and
              industry professionals exchange capital, advisory services, and settlement documentation. Rather than
              competing as a traditional full-service brokerage, HomeLight structures its platform across three primary
              transactional layers: digital real estate agent referral matching, short-term bridge and
              contingency-elimination financing via Buy Before You Sell, and liquidity matching for distressed or
              expedited sellers via Simple Sale. Digital workflow management tools, such as the Disclosures.io suite,
              capture agent engagement during the On-Market phase by centralizing disclosure distribution and tracking
              prospective buyer activity. Conversely, the market boundary explicitly excludes broader housing
              expenditures such as long-term residential mortgage principal servicing, physical property renovations,
              property management, and ongoing multifamily asset operational management, which require dedicated
              post-close operational infrastructure.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
              - CM013
              - CM014
      - number: '2.2'
        title: 'Market Sizing Lenses: Commission Pool, Equity Liquidity, and Valuation Bounds'
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for HomeLight requires evaluating distinct economic pools across brokerage
              commissions and consumer home equity liquidity rather than relying on a single broad gross transaction
              volume metric. At the macro level, the National Association of Realtors established the national median
              existing-home sale price at $434,100 in July 2026, which benchmarks the total US existing-home transaction
              pool at approximately $1.8 trillion to $2.0 trillion across 4.0 million to 4.5 million annual sales.
              Across this transactional volume, the gross residential brokerage commission pool represents approximately
              $70 billion to $80 billion annually, assuming a blended 5.0% to 5.5% gross commission structure. HomeLight
              addresses the estimated $15 billion to $25 billion digital referral-accessible segment of this commission
              pool by collecting a referral fee of approximately 33% from partner agents upon transaction closing.
              Simultaneously, HomeLight addresses between $50 billion and $100 billion in annual departing homeowner
              equity demand through its Buy Before You Sell program, where it has unlocked over $884 million in
              cumulative equity across nationwide transactions while facilitating over $1 billion in annual platform
              business volume.
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM011
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
