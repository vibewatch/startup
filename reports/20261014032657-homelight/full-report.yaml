            body: >-
              HomeLight's operating architecture is organized into a six-tier technical stack that integrates
              consumer-facing web intake portals with transactional underwriting logic and backend financial
              infrastructure. The top intake tier captures buyers and sellers through dedicated web endpoints, including
              the primary consumer portal, targeted acquisition funnels at landing-pages.homelight.com, localized
              listing feeds at homes.homelight.com, and specialized partner gateways at lenders.homelight.com. Lead data
              is routed into the proprietary transaction analytics and agent matching engine, which queries historical
              MLS sales records and performance indexes to optimize agent assignment.


              Downstream transactional tiers orchestrate financial underwriting and closing execution. Following the
              2019 acquisition of digital mortgage startup Eave, Inc., HomeLight integrated proprietary automated
              underwriting algorithms that deliver preliminary mortgage commitments in 24 hours and guarantee loan
              closings within 21 days. For Buy Before You Sell transactions, the financial underwriting engine
              interfaces directly with loan officers at external mortgage banks and brokerages, supporting over 22,000
              participating loan officers nationwide. The settlement tier, managed through HomeLight's Closing Services
              division, coordinates digital title examination, escrow disbursement, and wire verification, creating a
              closed-loop environment that unites financing, title insurance, and broker commissions under a unified
              digital workflow.
