      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Return Outcomes'
        blocks:
          - type: paragraph
            body: >-
              To evaluate the risk-adjusted return profile at the current $1.13 billion reference valuation, we model
              three operating scenarios across a thirty-six-month underwriting horizon. In the Bull Case (20%
              probability), residential real estate transaction velocity accelerates as interest rates ease, driving
              widespread lender adoption across HomeLight's network of over 10,000 loan officers and 28,000 agents. Buy
              Before You Sell origination volume expands rapidly while default and inventory-absorption rates remain
              below 0.5%. Under these conditions, annual platform run-rate revenue reaches $500 million, supporting an
              exit valuation of $2.2 billion to $2.8 billion (a 2.0x to 2.5x return on the $1.13 billion entry mark) via
              an initial public offering or a premium strategic acquisition by a major housing portal.


              In the Base Case (50% probability), mortgage turnover improves modestly while B2B lender channel adoption
              proceeds at a measured pace. The core agent matching business maintains steady cash generation, offset by
              moderate commission compression following the landmark National Association of Realtors settlement. BBYS
              delivers positive operating contribution margin with manageable 120-day inventory take-ins under 2.0%.
              HomeLight generates approximately $400 million in run-rate revenue, yielding an estimated enterprise
              valuation of $1.1 billion to $1.4 billion (0.9x to 1.2x capital return), leading to a private equity
              recapitalization or strategic sponsor buyout. In the Bear Case (30% probability), prolonged housing
              lock-in suppresses transaction counts, while cooling local home prices trigger an uptick in forced
              purchases past 120 days. Inventory carrying costs, coupled with legal liabilities from marketing disputes,
              compress margins, resulting in an estimated enterprise valuation of $450 million to $650 million and
              severe junior equity dilution.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV014
      - number: '8.4'
        title: Exit Readiness, Liquidity Overhang, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              HomeLight's exit readiness is constrained by its capitalization history, private governance structure, and
              unresolved operational contingencies. Having accumulated over $412 million in aggregate funding, HomeLight
              carries substantial liquidation preferences across senior preferred stock series. While dilution in the
              August 2024 Series D-III round was modest at approximately 2% ($20 million against a $1.13 billion
              post-money valuation), common shareholders and junior option pools face a considerable seniority overhang
              before realizing meaningful capital gains. Furthermore, the introduction of $40 million in venture debt
              from BlackRock in April 2026 imposes strict cash-flow and debt-service obligations, limiting operational
              latitude during cyclical housing downturns.


              Legal and regulatory scrutiny introduces additional friction to near-term liquidity events. HomeLight
              faces consumer and industry headwinds, exemplified by a 2026 federal Telephone Consumer Protection Act
              (TCPA) class action lawsuit alleging unsolicited marketing communications, as well as ongoing scrutiny
              over steering consumers away from independent cash buyers toward 33% commission-split agent referrals. A
              public listing (IPO) would demand full disclosure of cohort loss severities under Buy Before You Sell,
              warehouse debt covenant thresholds, and legal reserves. Consequently, before committing capital, diligence
              must verify three mandatory thesis-break triggers: first, whether BBYS forced-purchase frequency exceeds
              3% of originations; second, whether senior lender covenants restrict liquidity below $30 million; and
              third, whether post-NAR commission pressures cause participating brokerages to abandon referral fee
              agreements.
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV011
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Stance Justification: Why Research-More Trumps a Directional Buy or Avoid'
            body: >-
              HomeLight exhibits clear operational differentiation through its wholesale embedded distribution and vast
              agent network, precluding an avoid recommendation. However, because unit-level loss severities, warehouse
              lines, and margin splits with lenders remain private, committing fresh capital at a $1.13 billion
              valuation carries unquantified tail risk. Investors should maintain a disciplined research-more posture
              until audited cohort metrics are provided.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV014
          - type: callout
            title: Valuation Sensitivity to Warehouse Debt Covenants and Residential Liquidation Discounts
            body: >-
              Buy Before You Sell's commitment to purchase homes that fail to sell after 120 days at loan payoff value
              exposes HomeLight to tail risk in stagnant housing markets. If home price depreciation outpaces equity
              buffers, HomeLight must absorb and liquidate residential collateral at a loss, potentially breaching
              warehouse credit covenants or forcing emergency equity dilutive financing.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
