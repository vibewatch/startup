      - number: '5.5'
        title: Compliance Controls, Platform Reliability, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Operating a unified proptech platform spanning referral brokerage, mortgage origination, and real estate
              acquisition introduces substantial regulatory and operational risk exposures. HomeLight maintains formal
              regulatory compliance infrastructure, operating as a licensed corporate real estate broker in California
              under Department of Real Estate license #01900940 and as a licensed mortgage lender under HomeLight Home
              Loans, Inc. (NMLS ID #1529229). These licensing frameworks require strict adherence to the Real Estate
              Settlement Procedures Act (RESPA), preventing illegal kickbacks or unearned referral fee splits across
              affiliated brokerage, title, and lending entities.


              From a platform risk perspective, HomeLight's most acute operational vulnerability lies in the 120-day
              inventory backstop inherent in Buy Before You Sell. If an approved departing residence fails to clear the
              open market within 120 days, HomeLight must purchase the property directly at loan payoff value. In an
              environment of declining home values, rising mortgage interest rates, or regional liquidity freezes, this
              obligation threatens to transform HomeLight from an asset-light software platform into an asset-heavy
              property holding company carrying inventory carrying costs and potential liquidation losses. Consumer
              complaint records maintained by the Better Business Bureau reflect 26 total filings over three years,
              primarily focused on lead distribution aggressiveness and communication friction, underscoring the ongoing
              governance required across its consumer acquisition funnels.
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE014
