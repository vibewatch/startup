      - number: '3.2'
        title: 'Platform Capability Comparison: Matching, Liquidity, and Lending'
        blocks:
          - type: paragraph
            body: >-
              Where HomeLight establishes material product differentiation against pure-play agent directories is its
              multi-product transaction stack. Unlike Clever Real Estate or Ideal Agent, which focus exclusively on
              matching buyers and sellers to third-party agents, HomeLight integrates proprietary financing and
              liquidity solutions. HomeLight's flagship differentiator is its Buy Before You Sell (BBYS) program, which
              unlocks up to $2M in home equity at 0% interest, allowing buyers to eliminate home sale contingencies and
              purchase their next home before listing their departing property. If the departing residence remains
              unsold on the open market after 120 days, HomeLight guarantees liquidity by purchasing the property at
              Loan Payoff Value. Furthermore, HomeLight provides Simple Sale, an instant cash-offer marketplace that
              connects homeowners directly with pre-approved real estate investors for a 10-day close. In contrast,
              competitors like Redfin have retrenched from balance-sheet iBuying, and discount networks rely on
              third-party investor referral links without underwriting commitments.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP012
      - number: '3.3'
        title: Commission Economics, Referral Fees, and Program Pricing
        blocks:
          - type: paragraph
            body: >-
              The economic mechanics underpinning HomeLight contrast sharply with discount competitors. HomeLight's
              consumer agent-matching service is free to the seller, with HomeLight monetizing transactions by
              collecting an undisclosed percentage of the gross commission earned by the matched agent upon closing.
              This arrangement is legally structured under the cooperative brokerage referral exception of Section 8 of
              the Real Estate Settlement Procedures Act (RESPA, 12 U.S.C. 2607). Because the referral fee is paid from
              the seller-funded commission pool, matched agents are economically disincentivized from discounting their
              standard 2.5% to 3.0% listing fee. Conversely, HomeLight monetizes Buy Before You Sell through a
              transparent consumer program fee of 2.4% of the departing residence sale price (2.9% in Florida, with an
              additional $1,500 title fee in specific Illinois counties). In Simple Sale, HomeLight advertises zero
              program fees, but sellers absorb an implicit discount against fair market value that remains unpublished
              on company marketing pages.
            claimRefs:
              - CP002
              - CP007
              - CP009
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP007
              - CP009
              - CP013
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Commoditization Pressures
        blocks:
          - type: paragraph
            body: >-
              HomeLight's competitive moat is vulnerable to consumer multi-homing and search marketing dependence.
              Because home sellers incur zero monetary switching costs when submitting matching requests online,
              prospective movers frequently request referrals across HomeLight, Clever Real Estate, and local portals
              simultaneously. Lacking proprietary listing inventory or sticky buyer workflows, HomeLight's
              agent-matching referral engine operates under persistent customer acquisition pressure. However, HomeLight
              has engineered defensive distribution lock-in through its mortgage lender network. By partnering with more
              than 22,000 loan officers nationwide, HomeLight positions Buy Before You Sell as a partner enablement tool
              that mortgage originators use to remove departing mortgage liabilities from borrower debt-to-income ratios
              and win purchase loans. While regulatory exclusions in Alaska, Massachusetts, and New York restrict
              geographic reach, this B2B2C lender channel creates a differentiated distribution moat that pure-play
              discount listing portals cannot readily duplicate.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
              - CP010
              - CP011
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Asymmetry in Referral Commission Models
            body: >-
              HomeLight and discount referral platforms operate fundamentally divergent economic bargains for home
              sellers. Low-commission competitors such as Clever Real Estate negotiate explicit 1.5% listing fees,
              passing gross savings directly to the homeowner while demanding agent margin concessions. In contrast,
              HomeLight preserves traditional 2.5% to 3.0% commission structures, capturing partner monetization on the
              back-end via undisclosed RESPA-exempt broker referral fees. While this preserves full-fee agent
              enthusiasm, it leaves price-sensitive sellers vulnerable to lower-cost alternatives.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP009
          - type: callout
            title: Multi-Homing Behavior and Low Seller Switching Friction
            body: >-
              Because agent-matching portals do not charge consumers upfront fees or impose exclusivity agreements,
              prospective home sellers exhibit extensive multi-homing across HomeLight, Clever, Redfin, and local broker
              directories. Lacking proprietary listing inventory or exclusive consumer lock-in, HomeLight must
              continually acquire seller intent via paid search advertising, exposing the core referral engine to
              digital marketing inflation and search engine algorithm shifts.
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams & Platform Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              HomeLight operates a multi-stream transaction platform designed to monetize residential real estate
              transactions through software-enabled brokerage referrals, specialized liquidity products, and integrated
              settlement services. Historically founded as a real estate agent matching marketplace, HomeLight monetizes
              consumer agent introductions by charging participating brokerages a referral fee calculated as a
              percentage of the agent's gross commission upon closing. While HomeLight provides free matching services
              to home sellers and buyers without listing fees, partner agents contractually agree to remit a portion of
              their gross commission at settlement under cooperative brokerage agreements permissible under Section 2607
              of the Real Estate Settlement Procedures Act. To expand beyond referral commissions, HomeLight launched
              Buy Before You Sell, which has become its primary transactional product. Buy Before You Sell charges a
              standard flat program fee of 2.4% of the departing residence's sale price across most states, rising to
              2.9% in Florida and assessing an additional $1,500 title fee in specific Illinois counties due to local
              title search regulations. Complementing these programs, Simple Sale provides an off-market cash offer
              route where HomeLight charges no explicit seller program fee or repair costs, instead capturing economic
              value through investor pricing spreads relative to fair market value.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI009
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
