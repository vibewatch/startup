      - number: '5.4'
        title: Technology Differentiation, Data Advantage, and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              HomeLight's technological differentiation is anchored in its proprietary transaction dataset and
              specialized business-to-business-to-consumer (B2B2C) partner distribution model. While competing portals
              such as Zillow or Realtor.com rely primarily on selling zip-code advertising impressions to local agents
              regardless of transaction performance, HomeLight's matching engine relies on objective historical closing
              records across 27 million transactions. Because agents do not pay upfront listing fees to appear in the
              directory, HomeLight aligns monetization with closed volume, collecting an industry-standard 33%
              broker-to-broker referral fee upon successful escrow settlement.


              In the bridge financing category, HomeLight differentiates itself by embedding Buy Before You Sell
              directly into the mortgage originator's existing sales workflow rather than attempting to disintermediate
              the loan officer. Loan officers utilize the BBYS portal to unlock borrower equity and expand loan volume
              without forfeiting the primary purchase mortgage. As of 2026, HomeLight reports a partner network spanning
              more than 28,000 real estate agents and 22,000 loan officers, having unlocked more than $884 million in
              cumulative customer equity. The product is currently available nationwide with the exception of Alaska,
              Massachusetts, and New York, reflecting selective jurisdictional licensing and state-specific mortgage
              lending constraints.
