            body: >-
              HomeLight was founded in 2012 and is described by an August 2026 third-party profile as a private company
              headquartered in Scottsdale, Arizona, with additional listed offices in San Francisco, New York, Seattle,
              and Coppell. Its offering is broader than an agent directory: official pages describe agent matching, home
