      - number: '7.2'
        title: Operational Execution and Buy Before You Sell Inventory Put Exposure
        blocks:
          - type: paragraph
            body: >-
              Operationally, HomeLight's flagship growth initiative—the Buy Before You Sell (BBYS) program—introduces
              balance-sheet risk distinct from pure software marketplaces. Under BBYS, HomeLight charges home sellers a
              flat program fee of 2.4% of the departing residence's sale price (escalating to 2.9% in Florida and adding
              a $1,500 fee in specific Chicago-area counties). The core operational failure mode centers on liquidity
              and market-clearing friction. If an enrolled home fails to sell on the open market within 120 days,
              HomeLight contractually commits to purchase the home at the designated Loan Payoff Value before relisting
              it on the open market. In a shifting macroeconomic environment characterized by elevated mortgage rates or
              regional demand contraction, a cluster of unsold inventory puts could force HomeLight to absorb physical
              housing inventory, stressing warehouse credit lines and consuming working capital. Crucially, HomeLight
              does not publicly disclose historical cohort default rates, forced-purchase frequencies, or average
              holding period losses. Furthermore, geographic restrictions underscore localized legal complexity: BBYS
              remains entirely unavailable in Alaska, Massachusetts, and New York. On the consumer acquisition front,
              review platforms document consumer friction where home valuation inquiries trigger unsolicited multi-agent
              outreach rather than direct cash offers.
            claimRefs:
              - CR007
