  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Capital History, and Post-2022 Valuation Reset
        blocks:
          - type: paragraph
            body: >-
              HomeLight presents an evolving investment case centered on its structural pivot from a pure real-estate
              agent referral engine to a wholesale, multi-product residential transaction ecosystem. Founded in 2012,
              the company initially generated cash flow through a 25% to 33% commission-share matching model. However,
              realizing the capital intensity and partner friction of direct mortgage origination following its 2019
              Eave acquisition, HomeLight intentionally stepped back from retail lending in 2024 to reposition its
              flagship Buy Before You Sell financing as an embedded B2B capability for independent mortgage lenders and
              top agents. This strategic maneuver eliminated channel conflict and allowed HomeLight to leverage
              third-party loan officers as an uncompensated customer acquisition force across forty-six states.


              From a capitalization perspective, HomeLight has raised over $412 million in cumulative lifetime financing
              across equity and debt rounds through 2026. The company reached a peak post-money equity valuation of $1.7
              billion following a $60 million Series D injection in June 2022. However, amid broader proptech multiple
              compression and elevated interest rates, HomeLight reset its valuation mark in August 2024, closing a $20
              million Series D-III extension led by Zeev Ventures with participation from Stereo Capital and Menlo
              Ventures at a $1.13 billion post-money valuation. This represented an approximate 34% headline valuation
              reset from its 2022 peak. In April 2026, HomeLight bolstered its liquidity structure by securing $40
              million in venture debt from BlackRock to scale its platform and transaction automation. While the capital
              structure reflects high-tier institutional backing, the post-2022 mark underscores that investor
              enthusiasm has shifted from unbridled growth to capital efficiency, unit economics, and liquidity
              discipline.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
      - number: '8.2'
        title: Public and Private Valuation Comparables and Multiple Compression
        blocks:
          - type: paragraph
            body: >-
              Benchmarking HomeLight against public and private proptech comparables illustrates the divergent valuation
              multiples assigned across residential technology business models. Historical public comps such as Opendoor
              Technologies and Offerpad Solutions went public at price-to-sales multiples of 3.0x and 2.3x respectively,
              while tech-enabled brokerages and marketplaces like Redfin and Compass debuted at 6.7x and 11.0x. However,
              the post-2022 market environment has harshly penalized balance-sheet-heavy iBuying models that carry
              direct inventory risk and volatile carrying costs. Investors now strictly distinguish between
              capital-intensive balance-sheet operators and asset-light transaction platforms.


              HomeLight's hybrid architecture places it in an intermediate valuation band. Unlike traditional iBuyers
              that purchase homes directly onto their balance sheets, HomeLight's Buy Before You Sell product charges a
              flat 2.4% fee (2.9% in Florida) while placing a backup guarantee offer rather than executing an immediate
              outright purchase. Because the client's home is listed vacant on the open market for up to 120 days,
              HomeLight only absorbs the property onto its books if open-market marketing fails. This contingent
              structure allows HomeLight to avoid permanent holding inventory in normal market conditions, justifying an
              enterprise value multiple premium over pure iBuyers. Nevertheless, because HomeLight's financial
              performance remains tightly tied to overall transaction volume and mortgage rate velocity, public market
              comparable trading suggests that HomeLight cannot command the double-digit revenue multiples typical of
              pure-play enterprise SaaS. An implied 2.5x to 3.5x revenue multiple on mature transaction gross profit
              represents a disciplined, market-clearing appraisal.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
