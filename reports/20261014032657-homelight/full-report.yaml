  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              HomeLight operates in an intensely regulated intersection of residential real estate brokerage, mortgage
              financing, and digital consumer lead generation. The company's legal profile is headlined by active
              class-action litigation regarding telemarketing practices. In Hopkins v. HomeLight, filed in the U.S.
              District Court for the Western District of Washington, plaintiffs allege persistent, unauthorized
              marketing phone calls and automated text messages to telephone numbers registered on the National Do Not
              Call Registry. In July 2026, the federal court denied HomeLight's motion to dismiss, allowing the class
              action to proceed into discovery and raising potential statutory exposure under the Telephone Consumer
              Protection Act (TCPA), where damages range from $500 to $1,500 per willful violation. Beyond telemarketing
              litigation, HomeLight faces recurring industry scrutiny regarding its core monetization model. Industry
              critics and competing consumer advocacy platforms assert that HomeLight operates as a paper real estate
              brokerage collecting 25% referral fees from gross agent commissions in potential tension with Real Estate
              Settlement Procedures Act (RESPA) Section 8 anti-kickback prohibitions. While HomeLight defends the
              structure under the cooperative brokerage exemption of 12 U.S.C. 2607(c)(3), evolving CFPB guidance on
              digital comparison-shopping platforms keeps regulatory reinterpretation as an ongoing threat.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
