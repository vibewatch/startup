      - number: '5.2'
        title: Transaction Workflows, Buy Before You Sell, and Solution Delivery
        blocks:
          - type: paragraph
            body: >-
              The core operational challenge of residential real estate is the contingent move-up transaction:
              homeowners seeking to purchase a new residence typically need the unlocked home equity from their
              departing property to fund their down payment, yet lenders enforce strict debt-to-income (DTI) caps that
              prevent carrying two simultaneous mortgages. HomeLight addresses this structural friction through its
              flagship Buy Before You Sell (BBYS) program, which acts as a modern software-enabled bridge financing
              facility.


              Under the BBYS operating workflow, HomeLight evaluates the homeowner's departing property using automated
              valuation algorithms and issues an equity advance approval in as little as 24 hours. The program enables
              the borrower to unlock up to 90% combined loan-to-value (CLTV) and up to $2 million of their existing home
              equity at a 0% interest rate, deploying those proceeds directly toward the down payment on the target
              home. Crucially, HomeLight issues a formal backup purchase offer on the departing residence, allowing
              partner mortgage lenders to omit the existing home's mortgage debt from the client's DTI calculation. Once
              closed on the new home, the seller is contractually afforded 21 days to list their vacant departing
              residence on the open market and 120 days to complete a sale, paying HomeLight a flat program fee of 2.4%
              of the final sale price (2.9% in Florida).
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
              - CE008
