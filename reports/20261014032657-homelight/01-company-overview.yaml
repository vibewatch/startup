company:
  name: "HomeLight"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    HomeLight is a private residential real-estate technology company founded in
    2012 whose current product set spans agent matching, cash-offer routing,
    Buy Before You Sell, home loans, and closing services. An August 2026
    third-party profile reports $412.5 million raised and a latest reported
    valuation of $1.13 billion, but current revenue, profitability, ownership,
    and financing terms remain unsupported by the assigned public evidence.
sections:
  - id: "identity-and-platform"
    title: "Identity, Footprint, and Operating Model"
    body: >-
      HomeLight was founded in 2012 and is described by an August 2026
      third-party profile as a private company headquartered in Scottsdale,
      Arizona, with additional listed offices in San Francisco, New York,
      Seattle, and Coppell. Its offering is broader than an agent directory:
      official pages describe agent matching, home search and lending
      connections, Simple Sale cash-offer routing, Buy Before You Sell equity
      access, Home Loans, and closing services. The assigned evidence therefore
      supports viewing HomeLight as a transaction-orchestration platform rather
      than a single-product marketplace. That breadth creates several possible
      revenue touchpoints, but the public material does not disclose current
      revenue by product, attach rates, or audited transaction volume.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership Coverage and Governance Visibility"
    body: >-
      Founder Drew Uher remains Chief Executive Officer, making founder
      continuity important to strategy and external credibility. HomeLight's
      official leadership page also names operating, technology, finance, legal,
      product, sales, talent, marketing, and business-line leaders. Sumant
      Sridharan covers operations, Mike Abner technology, Ankur Jain finance,
      and Alex Jee legal and corporate-secretary responsibilities, while
      dedicated presidents oversee Homes and Closing Services. This is a
      functionally broad management bench for a multi-product platform.
      However, the assigned sources do not identify directors, committee
      composition, investor board rights, beneficial ownership, succession
      plans, or executive retention terms. Governance strength and founder
      dependence therefore remain diligence questions rather than verified
      conclusions.
    claimRefs:
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capital-and-milestones"
    title: "Capital History, Reported Valuation, and Milestones"
    body: >-
      The August 2026 investment profile supplies the only consolidated capital
      history in the assigned pool. It reports financing rounds from seed
      through a 2024 Series D extension, labels total raised to date at $412.5
      million, and gives $1.13 billion as the latest valuation in August 2024.
      It also reports $40 million of venture debt from BlackRock in April 2026.
      These are third-party reported figures, not audited financial statements
      or financing documents. The profile does not establish how much of the
      total is equity versus debt, what capital remains available, or the
      covenants, liquidation preferences, warrants, and ownership effects of
      the financings. The chronology demonstrates repeated access to capital
      while leaving present liquidity and control economics unresolved.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "scale-and-adverse-signals"
    title: "Reported Scale and Adverse Operating Signals"
    body: >-
      HomeLight's landing page displays three unaudited scale indicators:
      30,000-plus top agents and lenders, 1 million-plus happy clients, and more
      than $1 billion of transactions each year. A third-party profile separately
      reports 517 employees for 2026 Q1. These metrics use different
      populations and should not be combined into a funnel or treated as proof
      of retained customers or revenue. Adverse evidence also warrants care.
      Houwzer, a competitor, argues that agent referrals are funded from agent
      commission and that the precise referral percentage is not published to
      sellers. BBB's complaints profile listed 26 complaints over three years
      and three over twelve months, while BBB itself warns that it does not
      verify third-party submissions. The complaints are signals for consent,
      service, and disclosure diligence, not incidence rates without a customer
      denominator.
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO015"
      - "CO016"
callouts:
  - calloutType: "insight"
    title: "Broad platform, unsegmented economics"
    body: >-
      HomeLight has multiple transaction touchpoints, but the assigned evidence
      does not disclose revenue, margin, attach rate, or cohort economics by
      product; platform breadth should not be mistaken for proven operating
      leverage.
    claimRefs:
      - "CO003"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
  - calloutType: "risk"
    title: "Consumer signals lack a denominator"
    body: >-
      BBB complaints and a competitor's pricing critique identify concrete
      diligence topics, but neither source establishes complaint incidence or
      customer-level economics across HomeLight's full transaction base.
    claimRefs:
      - "CO015"
      - "CO016"
