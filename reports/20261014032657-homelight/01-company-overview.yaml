  evidenceGaps:
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "leadership-and-stakeholder-enumeration"
      missingEvidence: >-
        A complete director roster, committee structure, beneficial ownership
        table, investor rights schedule, and executive retention package.
      whyItMatters: >-
        Public executive titles do not establish voting control, board
        oversight, succession readiness, or investor influence.
      diligencePath: >-
        Request the current cap table, charter, voting agreements, board and
        committee minutes, and executive employment and retention agreements.
      relatedQuestionRefs:
        - "QO008"
      relatedTableRefs:
        - "TO002"
        - "TO003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "financial-performance"
      missingEvidence: >-
        Audited revenue, ARR where applicable, gross margin, EBITDA, cash flow,
        cash balance, and product-line contribution data.
      whyItMatters: >-
        Funding raised and transaction value do not establish recurring
        revenue, profitability, cash burn, or liquidity.
      diligencePath: >-
        Obtain audited statements and monthly management accounts reconciled by
        product, geography, and legal entity.
      relatedQuestionRefs:
        - "QO004"
      relatedTableRefs:
        - "TO001"
    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-terms"
      missingEvidence: >-
        Financing documents supporting the reported total raised, valuation,
        investor rights, debt maturity, interest, security, covenants, and
        warrants.
      whyItMatters: >-
        Reported funding is not cash available, and headline valuation does not
        reveal liquidation preferences or common-equity value.
      diligencePath: >-
        Reconcile the cap table and cash ledger to signed equity and debt
        documents, including the reported BlackRock facility.
      relatedQuestionRefs:
        - "QO003"
        - "QO008"
      relatedTableRefs:
        - "TO001"
        - "TO003"
    - type: "missing-source"
      severity: "material"
      topic: "operating-scale"
      missingEvidence: >-
        Independently verified definitions and time series for active agents,
        lenders, clients, transaction value, retention, and concentration.
      whyItMatters: >-
        Company-displayed cumulative or annual metrics cannot establish active
        demand, cohort quality, or revenue conversion without denominators.
      diligencePath: >-
        Request cohort exports and counterparty registers, then reconcile them
        to closed transactions and recognized revenue.
      relatedQuestionRefs:
        - "QO004"
      relatedTableRefs:
        - "TO001"
        - "TO003"
    - type: "missing-source"
      severity: "minor"
      topic: "consumer-complaints"
      missingEvidence: >-
        Complaint incidence by product and transaction cohort, consent logs,
        opt-out performance, resolution time, and repeat-contact rates.
      whyItMatters: >-
        Raw complaints identify failure modes but cannot quantify prevalence or
        financial exposure without a customer denominator.
      diligencePath: >-
        Audit CRM consent records and complaint tickets against product-level
        transaction cohorts and resolution outcomes.
      relatedQuestionRefs:
        - "QO007"
