callouts:
  - calloutType: insight
    title: Transition from Lead Generation to Capital-Integrated Transaction Platform
    body: >-
      HomeLight's core product evolution reflects a deliberate transition from an agent referral directory into a
      capital-integrated transaction platform. By bundling Buy Before You Sell equity unlocks, digital mortgage
      underwriting, and title/escrow services, the company captures higher gross transaction value while simultaneously
      introducing inventory backstop liabilities and lender balance-sheet dependencies.
    claimRefs:
      - CE001
      - CE006
      - CE010
  - calloutType: risk
    title: The 120-Day Inventory Backstop Liability in Buy Before You Sell
    body: >-
      A critical technical and operational risk in the Buy Before You Sell product is the contractual obligation for
      HomeLight to purchase the departing residence at loan payoff value if it fails to sell on the open market within
      120 days. In a softening or illiquid housing market, this mechanism exposes HomeLight's balance sheet to forced
      property acquisitions and residual disposition losses.
    claimRefs:
      - CE007
      - CE011
      - CE014
