callouts:
  - calloutType: "insight"
    title: "Structural Asymmetry in Referral Commission Models"
    body: "HomeLight and discount referral platforms operate fundamentally divergent economic bargains for home sellers. Low-commission competitors such as Clever Real Estate negotiate explicit 1.5% listing fees, passing gross savings directly to the homeowner while demanding agent margin concessions. In contrast, HomeLight preserves traditional 2.5% to 3.0% commission structures, capturing partner monetization on the back-end via undisclosed RESPA-exempt broker referral fees. While this preserves full-fee agent enthusiasm, it leaves price-sensitive sellers vulnerable to lower-cost alternatives."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP009"
  - calloutType: "risk"
    title: "Multi-Homing Behavior and Low Seller Switching Friction"
    body: "Because agent-matching portals do not charge consumers upfront fees or impose exclusivity agreements, prospective home sellers exhibit extensive multi-homing across HomeLight, Clever, Redfin, and local broker directories. Lacking proprietary listing inventory or exclusive consumer lock-in, HomeLight must continually acquire seller intent via paid search advertising, exposing the core referral engine to digital marketing inflation and search engine algorithm shifts."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP014"
