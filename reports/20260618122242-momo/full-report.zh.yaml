      - - 合规 / 信任领先
        - PCI DSS v4.0 和生物识别推广
        - 银行和同业在 Circular 41 下快速升级 KYC
        - 中
        - 如果所有人都达到同一基线，监管优势会收窄
        - 测试生物识别之后的欺诈损失趋势和开户转化
      - - 商户和合作伙伴网络
        - 大型商户基础和银行合作伙伴关系
        - VietQR 让受理互联互通
        - 高
        - 受理所有权从钱包品牌转向通道接入
        - 衡量独家商户项目相对通用 QR 受理的差异
      - - 分销习惯强度
        - MoMo 使用频次领先 Cimigo 样本
        - Zalo 社交图谱和银行工资账户关系
        - 高
        - 分销，而非原始功能，是抢走频次最快的路径
        - 对比 ZaloPay 的 CAC、唤醒成本和促销强度
      - - 品类生存能力
        - Moca 退出证明弱经济性会迫使收缩
        - 独立钱包利润率压力
        - 中
        - 反面先例显示，较弱玩家可能消失或整合
        - 在更低促销支出、更低支付抽佣率下压力测试 MoMo
    notes: 严重程度衡量未来 12-24 个月 MoMo 面临的竞争耐久性风险，依据公开证据，而非量化模拟。尽调问题聚焦需要哪些非公开经营数据，才能确认这种耐久性。
