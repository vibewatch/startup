        title: 留存、重复使用与满意度：习惯信号强，正式披露弱
        blocks:
          - type: paragraph
            body: >-
              MoMo 可能受益于真实习惯循环，但公开披露远未达到投资者想要的指标。应用自有表面和 Google Play 列表展示了重复使用行为——好友转账、账单支付、线下商户 QR
              支付，以及储蓄、贷款、保险、投资等后续金融动作。支持基础设施也可见，服务办公室分布在胡志明市、河内和岘港，并有热线、邮件和自助渠道。不过，在审阅资料中，仍没有公开 NRR、GRR、流失、续约、合同期限或精确
              MAU 披露。最好的留存代理反而是负面代理：CafeF 引用的 Decision Lab 数据显示，2024 年 Q4，MoMo
              的金融科技平台渗透率和「最常用应用」份额均环比下滑，年长用户越来越转向银行应用。这并不能证明留存差，但确实说明注册用户规模不能被误读为明确粘性。正确解读是：MoMo 有许多结构性理由留住用户，但尚无公开
              cohort 证据证明这些习惯有多持久。
