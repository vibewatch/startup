      - number: '3.3'
        title: 既有机构与相邻玩家：银行超级应用、Apple Pay 与定价姿态
        blocks:
          - type: paragraph
            body: >-
              最严重的非钱包压力来自既有银行。VPBank NEO 公开营销免费 QR 转账、即时开户、线上储蓄和数字信用卡开卡；Techcombank 的 SME
              工作流则显示，银行可以把支付和信贷融合成两分钟申请、五分钟初步批准。FiinGroup 称 Techcombank 的微型 SME 和小型商业贷款同比增长近
              97%，这一点重要，因为银行能通过存款、贷款利差和银行卡变现客户关系，而电子钱包做不到。Apple Pay
              是更薄的竞争者，但仍值得关注，因为它让银行发卡凭证更容易用于线下和线上商户，而无需完整的钱包关系。公开定价披露也偏向既有机构。银行和 Apple
              可以清楚告诉用户，转账或钱包使用免费；钱包商户定价通常通过销售合同处理，并不公开发布。这种不透明不会阻断采用，但会让外部人更难证明单靠支付可以形成持久经济优势。
