      - number: '5.3'
        title: 架构、部署模型与关键依赖
        blocks:
          - type: paragraph
            body: >-
              我们找到的最强公开技术披露，是 MoMo 2022 年关于其贷款决策引擎的工程文章；这可能低估了 2026 年完整平台，但仍揭示了公司的运营模型。MoMo 描述了一套基于 GCP 的微服务栈，采用 gRPC 和
              REST 接口，BigTable 与 BigQuery 分别承载实时和历史工作负载，批处理由 Airflow 和 Spark 编排，实时流通过 Pub/Sub 或 Kafka
              在混合云和本地部署之间传递。NVIDIA 的独立合作方证据还显示，MoMo 在 Google Cloud 中使用 NVIDIA GPU 做聊天机器人、eKYC 和推荐引擎，并在生产 AI serving 中使用
              Triton 和 TensorRT。商户文档在商业侧强化了同一模式：开户流程 API-first，凭证从测试迁移到生产，M4B
              管理运营数据和技术密钥。简言之，披露的技术栈更像一个拥有共享数据、集成和风险轨道的平台业务，而不是单用途钱包应用。
