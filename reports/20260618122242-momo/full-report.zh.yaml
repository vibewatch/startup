      - number: '5.5'
        title: 信任、安全、安保、隐私与合规控制
        blocks:
          - type: paragraph
            body: >-
              信任是 MoMo 产品设计的核心部分，这方面的公开证据强于正常运行时间或经济模型证据。消费者端表面强调五层 AI 安全、异常交易检测、牌照和直接支持渠道。更重要的是，近期外部证据显示 MoMo
              显著升级了生物识别控制，而不是只依赖静态 KYC。iProov 和本地新闻把 Dynamic Liveness 上线与 AI 欺诈压力、SBV Decision 2345
              联系起来；后者明确允许在高风险在线支付场景中使用生物识别和基于 FIDO 的认证。Circular 41 和 2025 年 PDPL 又进一步抬高门槛，把电子钱包验证、留存、风险管理和数据保护义务收紧到 2026
              年。PCI DSS 仍是银行卡数据控制的基线框架，而 FIDO 和 VinCSS
              材料展示了无密码栈在实践中可能的样子。主要开放尽调问题是，公开信任信号很宽，但在我们审阅的证据集中，独立审计的正常运行时间和更广泛认证细节仍有限。
