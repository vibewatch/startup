      - number: '7.3'
        title: 运营、网络安全与服务质量风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，MoMo 面对的是一个规模很大、欺诈密度也很高的消费者入口。越南网络损失和诈骗数据都很严峻，当前诈骗越来越依赖心理操纵，而不是直接攻破系统；因此，保护信任不只是拦截恶意流量那么简单。MoMo
              已经落地了真实缓释措施——采用 iProov 的动态活体检测、AI
              欺诈筛查，以及公司披露的异常交易提醒——但同一批来源也说明了这些控制为什么必要：攻击面在扩大，金融行业又是优先目标。公司还承受隐私和可靠性敞口，因为它收集并关联广泛的个人数据类别，eKYC、推荐、决策等关键 AI
              功能也托管在云上。如果生物识别产生误判，如果数据事件触发客户通知，或云与模型服务故障打断开户注册或支付，商业冲击很可能先表现为用户摩擦、客服成本和声誉损失，而不是法律层面的即时崩塌。公开应用商店证据显示，用户基数已经足够大，服务问题会很快浮出水面。
