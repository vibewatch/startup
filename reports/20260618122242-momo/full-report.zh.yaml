      - number: '8.3'
        title: 融资背景、稀释不确定性与估值姿态
        blocks:
          - type: paragraph
            body: >-
              公开融资事实在 2021 年轮次最扎实，而在新投资者今天最关心的位置最薄弱。佐证最充分的事实很直接：Series E 融资 $200 million，MoMo 跨过 $2 billion 估值门槛，Mizuho
              持有约 7.5%，并把公司定位为战略性数字金融分发资产。GetLatka 的 $2.3 billion 估计是最干净的当前数字锚点，但它仍是第三方估计，不是披露的股权结构标记。更广泛的公开融资汇总显示，累计融资约
              $430 million 至 $434 million；这个方向性信息很重要，因为它意味着即使不考虑新一轮，现有优先权堆栈也可能已有实质规模。


              关键缺失事实全是条款清单：当前股权结构、清算优先权结构、反稀释保护、2026 年流程是新股还是老股，以及当前现金 / 跑道。这些遗漏重要，因为 MoMo
              在十多年吸收亏损和品类补贴后才刚刚实现盈利。若投资者在没有优先权透明度的情况下以 >$2 billion 入场，可能是在用缺乏吸引力的证券条款承销一家公允公司。因此，公开估值姿态是公允，而不是便宜。
            claimRefs:
