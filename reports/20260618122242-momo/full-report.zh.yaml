  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 玩家
      - 用户可见定价
      - 商户定价披露
      - 包装 / 合同模式
      - 已包含能力
      - 含义
    rows:
      - - MoMo
        - 核心消费者支付通常靠促销拉动；公开费率表不是定位重点
        - 引用的公开来源未清晰列出商户 MDR
        - 基于应用的超级应用，配套合作金融产品
        - 支付加贷款、储蓄、保险、投资
        - 捆绑宽度比明确价格领先更重要
      - - ZaloPay
        - 公开网关更强调支付方式选择，而非明确用户费用
        - 商户定价看起来按支持方式协议约定
        - 网关 + 钱包 + Zalo 分销的包装
        - 钱包、VietQR、银行卡、Apple Pay、BNPL
        - 灵活包装支撑商户，但公开经济性不透明
      - - VNPay / VNPay-QR
        - 引用来源中没有简单公开的终端用户收费卡
        - 商户入驻由销售推动，不是菜单式定价
        - 基础设施 / 网关合同模式
        - QR、银行应用受理、银行卡、钱包功能
        - 优势是触达和嵌入式分销，不是公开标价透明
      - - Viettel Money
        - 官网强调免费转账且无维护费
        - 引用来源未公开发布网关定价
        - 钱包 + 移动货币 + 电信分销
        - 转账、支付、充值、网关、移动货币
        - 对用户价格友好，尤其在银行卡密集度低的城市群体之外
      - - 银行超级应用
        - 免费 QR 转账很明确；储蓄可付利息；银行卡和贷款定价因产品而异
        - 银行产品逐项披露定价，而不是作为单一钱包 MDR 披露
        - 嵌入金融产品的主账户关系
        - 转账、存款、银行卡、信用、储蓄
        - 银行能用更宽的资产负债表经济性补贴支付行为
      - - Apple Pay
        - Apple 称不向用户收费
        - 商户成本落在现有收单方 / 银行卡受理体系里
        - 支持银行卡上的轻量叠加层
        - 非接触式、线上、应用内银行卡结账
        - 让银行卡通道更方便，但不替代银行关系
    notes: 越南钱包的公开竞品定价异常不透明。因此，本表比较消费者可见费用和包装逻辑；当公开证据缺失时，将商户经济性标为合同驱动或未披露。
