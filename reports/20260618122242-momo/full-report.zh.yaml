      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              推大越南无现金经济的同一组力量，也在压缩简单钱包经济。结构性顺风很清楚：政策支持非现金支付、全国 QR
              标准化、低价移动连接、高智能手机普及率，以及习惯在超级应用内交易的年轻消费群体。这些驱动因素支持交易频次继续提升，也支持钱包作为相邻金融服务分销渠道的使用。但市场成熟会改变增长的价值。当银行转账免费、银行应用能跑在同一套
              QR 轨道上时，钱包不能只靠「数字便利」立足。2026 年监管制度又叠加一层摩擦和保护。Circular 41
              提高了开户、生物识别、数据留存和交易控制方面的合规义务。信任是另一项实质约束：诈骗损失已大到让监管者和平台都从事后拦截欺诈，转向行为干预。结果是，规模仍然重要，但盈利性增长越来越来自相邻的商户和 SME
              工作流，而不是补贴驱动的消费者结账。
