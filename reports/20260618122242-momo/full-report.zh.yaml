chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              MoMo 由 M_Service Joint Stock Company 运营，2007 年在越南胡志明市注册成立。MoMo 电子钱包品牌于 2010 年 10 月正式上线，是越南首个基于 SIM
              卡的移动钱包；2014 年，随着超级应用模式成形，MoMo 转向智能手机应用。公司法定名称为 M_Service JSC，总部位于胡志明市。MoMo
              自称是越南领先的移动钱包和金融超级应用，通过单一应用提供支付、点对点转账、账单支付、QR
              支付、消费贷款、储蓄、保险、投资、游戏充值、外卖点餐和商户工具。商业模式主要靠支付商户扣率（MDR）0.5%–2.0%、金融产品分销佣金（保险、贷款、投资基金），以及合作品牌广告和促销展示费变现。MoMo
              从一开始就把自己定位为越南庞大未开户和银行服务不足人群的普惠金融入口。核心价值主张是让 30+ million 用户、超过 140,000 个商户受理点和 50 多家银行合作网络，通过一个应用触达金融服务。
