  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 方向
      - 论点
      - 重要性
      - 什么会改变判断
    rows:
      - - 正方
        - MoMo 仍是越南领先的钱包 / 超级 App，拥有 30M+ 用户，并有 50% 高段到 60% 市占率信号。
        - 规模是交叉销售更高利润率金融服务的前提。
        - 相邻产品增速高于纯支付，同时份额持续高于 55%。
      - - 正方
        - FY2024 盈利表明公司可能正在走出补贴时代。
        - 一个盈利的品类领导者，比纯烧钱钱包更应获得信用。
        - 经审计证明利润并非一次性或促销驱动。
      - - 正方
        - 越南金融科技仍有 SME 金融和约 $90B 信贷缺口带来的空间。
        - 未来价值取决于能否走出已饱和的消费者 QR 支付。
        - 证据显示 SME 贷款和商户工具正在成为实质收入贡献者。
      - - 反方
        - 随着银行 App 和 VietQR 普及，消费者钱包增长接近饱和。
        - 在成熟支付层里，份额提升更难，定价权也更弱。
        - 即便银行 App 替代加剧，增量用户增长和变现仍然强劲。
      - - 反方
        - ZaloPay 正从庞大的 VNG 生态基础上快速增长。
        - 如果 ZaloPay 持续跑赢 MoMo，MoMo 的溢价倍数应被压缩。
        - ZaloPay 增长显著放缓，或 MoMo 证明更优留存和变现。
      - - 反方
        - MoMo 经历十多年亏损后，近期才实现盈利。
        - 市场可能过度外推一个刚形成的盈利状态。
        - 连续两年披露利润耐久性，且激励强度下降。
    notes: 多头论点成立，但不再建立在绿地钱包采用上，而是建立在变现质量、监管执行，以及品类成熟时守住份额的能力上。
    claimRefs:
      - CV006
      - CV010
      - CV011
      - CV013
      - CV014
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 隐含估值区间
      - 概率
      - 相对 $2.0B 进入价的回报判断
    rows:
      - - 牛市
        - 收入接近约 $700M，钱包份额保持在 55% 以上，SME 金融起量，MoMo 获得 7x-8x 式的溢价增长倍数。
        - $3.2B-$3.5B
        - 25%
        - 约 1.6x-1.75x 总 MOIC，具吸引力
      - - 基准
        - 收入达到约 $550M，份额维持在约 50%，贷款和商户变现温和改善，市场给予约 4.5x-5x。
        - $2.3B-$2.5B
        - 55%
        - 仅为温和回报，约 1.15x-1.25x 总 MOIC
      - - 熊市
        - ZaloPay 和银行拿到份额，增长跌破 10%，Circular 41 拖慢开户注册，倍数压缩至约 3x。
        - $1.4B-$1.6B
        - 20%
        - 下行至约 0.7x-0.8x 总 MOIC
    notes: 概率加权价值约为 $2.5B。这组情景更支持耐心，而不是急迫出手。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 估值 / 市值
      - 规模标记
      - 与 MoMo 的相关性
      - 注意事项
    rows:
      - - MoMo
        - 2021 年隐含约 $2.3B；2026 年仍在测试 >$2B
        - 30M+ 用户；2024 年首次盈利
        - 正在评估的锚定案例
        - 私营公司，财务披露有限
      - - GCash
        - ~$5B
        - ~94M 用户
        - 最好的规模化东南亚钱包类比；显示私募溢价价值有可能成立
        - 公开来源里的收入和利润率可比性有限
      - - VNLife / VNPay
        - 探索退出估值 >$1B
        - 越南大型支付生态
        - 作为本地战略可比公司，有助于检验平台相关性
        - 探索退出不等于已成交价格
      - - Dana
        - ~$1.13B
        - 号称注册用户约 200M / QR 网络很强
        - 说明区域钱包即便用户规模很大，估值也可能明显低于 GCash
        - 市场和所有权结构不同
      - - Sea Limited
        - 上市市值 ~$54.9B
        - Q1 FY26 收入 ~$7.1B
        - 上市超级应用 / 金融科技邻近标尺
        - 业务组合比 MoMo 宽得多
      - - Nubank
        - 上市市值 ~$61.9B
        - Q1 FY26 收入 ~$4.97B
        - 证明规模化金融科技一旦盈利，可以拿到溢价估值
        - 银行业务主导的模式与钱包超级应用结构不同
      - - Paytm
        - 上市市值 ~$7.4B
        - 印度大型钱包 / 支付平台
        - 可作为支付占比较高金融科技公司的上市下行到中性情景可比对象
        - 印度市场结构和监管差异很大
    notes: 这是一组不完整的可比公司，目的在于框定 MoMo 的估值区间，而不是算出单一公式答案。东南亚私营钱包公司的收入披露仍然薄弱，因此可比公司更适合做合理性校验，不适合精确定价。
    enumerationScope:
      coverage: partial
      basis: >-
        The rows intentionally cover the most decision-relevant private SEA wallet, local Vietnam, and listed fintech /
        super-app anchors retained in public evidence, not every possible regional payments company.
    claimRefs:
