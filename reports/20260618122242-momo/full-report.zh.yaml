      - number: '3.4'
        title: 转换成本、锁定、多栖使用与合作方入口
        blocks:
          - type: paragraph
            body: >-
              公开行为数据表明，支付层存在转换成本，但并不高。The Investor 对 Cimigo 研究的总结称，90% 的越南用户会在同一服务上跨超级应用多栖使用，56%
              会经常套利返现、折扣码或忠诚度积分。这意味着，当促销、便利性或嵌入式分发变化时，支付频次可以快速迁移。MoMo 仍受益于更强的习惯，因为 Cimigo 发现其每周使用 4.16 次，远高于 ZaloPay 的
              1.5 次。但 VietQR
              和免费银行转账让底层轨道保持可迁移。商户越来越能通过银行应用、钱包应用或银行卡叠层触达用户，而无需押注一个排他受理标准。因此，真正的锁定层不是「我能不能付款？」，而是「付款背后还放着什么？」MoMo
              的贷款、储蓄、保险和投资分销在这里重要；ZaloPay 的社交分发楔子重要；VNPay 的银行和商户集成重要；只要主账户关系仍在银行手里，银行就保有经济优势。
