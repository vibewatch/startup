    layout: standard
    summary: MoMo 的估值最受三件事牵动：收入倍数是否克制、份额能否守住，以及 2026 年融资条款是否干净。
    data:
      items:
        - label: 收入倍数扩张 / 收缩
          value: 0.8
          unit: USD bn
          note: 牛市与熊市情景之间最大的摆动因素
        - label: 相对 ZaloPay / 银行的市场份额稳定性
          value: 0.6
          unit: USD bn
          note: 份额能否守住，决定增长还能不能配得上溢价
        - label: SME 金融变现成效
          value: 0.4
          unit: USD bn
          note: 消费支付饱和之后，撬动上行空间的关键桥梁
        - label: Circular 41 开户摩擦
          value: 0.3
          unit: USD bn
          note: 可能同时压低增长和新用户质量
        - label: 优先权 / 稀释压力
          value: 0.3
          unit: USD bn
          note: 企业价值未必改变，但新资金对应的股权价值会大幅变化
