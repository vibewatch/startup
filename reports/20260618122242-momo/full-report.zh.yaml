      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >-
              MoMo 的用户群不是单一买方类别。核心消费者层是城市和半城市智能手机用户，他们围绕便利、促销和日常服务广度，频繁做出小额决策。商户层不同：SME 需要判断，相比免费银行转账和银行应用 QR，MoMo
              是否能提高转化、营销触达或收款效率。第三层付款方位于上游：保险公司、贷款机构、财富管理机构和其他金融机构为分销付费，因为 MoMo
              聚合用户注意力，并掌握合规支付轨道。即便在银行账户渗透率已大幅上升的国家，银行服务不足或信用档案薄的人群仍有战略重要性；该群体小于 MoMo
              早年，但对普惠型产品仍足够重要。多栖使用同样关键。越南用户通常同时保留多个超级应用和钱包，份额更多取决于频次和习惯，而不是排他性。ZaloPay 的对手规模证明，即便 MoMo
              在头部认知上领先，这一分层仍在竞争中。
