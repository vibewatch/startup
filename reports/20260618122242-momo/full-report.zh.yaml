      - number: '1.3'
        title: 融资历史、估值与投资者
        blocks:
          - type: paragraph
            body: >
              MoMo 五轮融资累计约 $434M。Series C（$100M，2019 年 1 月，Warburg Pincus 领投）支持公司扩展到更广泛的金融服务。Series D（$100M，2021 年 1 月，由
              Goodwater Capital 和 Warburg Pincus 领投，Affirma Capital、Kora Management、Macquarie Capital、Tybourne Capital
              Management 参投）加速超级应用建设。标志性的 Series E（$200M，2021 年 12 月，Mizuho Bank 领投，Ward Ferry Management、Goodwater
              Capital、Kora Management 参投）让公司估值超过 $2B，并赋予其独角兽地位，使 MoMo 成为越南第四家独角兽。GetLatka 数据显示，Series E 估值约为 $2.3B。2026
              年 4 月，MoMo 聘请 Jefferies 和 Morgan Stanley 探索以据报高于 $2B 的估值引入新投资者，并已收到战略和财务投资者兴趣；商议仍处早期，交易并不确定。IPO
              不在近期议程内。公开资料未披露重大二级交易或债务工具。
