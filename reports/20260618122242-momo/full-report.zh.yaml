      - number: '8.4'
        title: 牛 / 基准 / 熊情形与可比公司三角校验
        blocks:
          - type: paragraph
            body: >-
              情景分析比任何单一可比公司更有信息量。牛市情形下，MoMo 收入复合增长至约 $700 million，份额守在 55% 以上，把 SME
              金融邻近业务转化为质量更高的增长层，并重新拿到接近高增长金融科技上沿的溢价倍数。对应估值约 $3.2 billion 至 $3.5 billion。基准情形下，收入达到约 $550 million，份额维持在约
              50%，公司按纪律化的 4.5x 至 5x 收入框架交易，对应约 $2.3 billion 至 $2.5 billion。熊市情形下，Circular 41 带来的获客摩擦、银行 App 替代和 ZaloPay
              份额提升会同时压缩增长和倍数，把价值拉低至约 $1.4 billion 至 $1.6 billion。


              可比公司能支持方向，但不能给出精度。GCash 约 $5 billion 估值、约 9,400 万用户，说明有规模的东南亚钱包仍能拿到溢价私募估值。VNLife / VNPay 的 >$1 billion 和
              Dana 的约 $1.13 billion，有助于框定区域私募样本。公开可比公司体量更大、结构也不同，但仍能告诉投资者，市场愿意为有规模的金融科技 / 超级 App 敞口支付什么价格：Sea 和 Nubank
              仍是数百亿美元级上市公司，而 Paytm 位于个位数十亿美元区间。合在一起，这些可比公司支持 MoMo 是真实独角兽，但不一定支持其在 2021 年标记之上仍是明确便宜货。
