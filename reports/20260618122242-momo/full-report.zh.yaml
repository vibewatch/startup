  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序、传导与论点破裂点
        blocks:
          - type: paragraph
            body: >-
              MoMo 的下行最好理解为传导问题，而非单一二元事件。公司仍是市场领导者，并自 2024 年起盈利，但其运营模型位于支付监管、大众市场欺诈、合作银行承销、云端托管决策，以及银行应用和 VietQR
              持续竞争的交汇处。这意味着，监管收紧会拖慢获客，隐私或网络安全失败会侵蚀信任，合作方或基础设施问题会迅速外溢到收入、利润率和融资。公开记录支持四个最高层级剩余风险：Circular 41
              和新数据框架带来的合规摩擦，系统性欺诈和隐私暴露，对银行和 Google Cloud 交付核心服务的依赖，以及银行应用替代带来的经济压力和近期盈利耐久性证据有限。若 MoMo 失去或实质损害 SBV
              许可，发生重大网络或隐私事件并摧毁用户信任，合作方驱动的贷款经济显著恶化，或竞争把钱包重新推回持续补贴驱动增长，投资论点就会破裂。
