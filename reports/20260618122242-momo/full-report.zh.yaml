companyProfile:
  summary: >
    MoMo（M_Service Joint Stock Company）是越南领先的移动电子钱包和金融科技超级应用，成立于 2007 年，并于 2010 年公开上线。MoMo
    总部位于胡志明市，起步于简单的手机充值服务，已成长为覆盖越南 30M+ 注册用户的综合金融平台。该平台每季度处理超过 5.5B 笔交易（2025 年 Q1），并在 FY2024 首次实现全年盈利，估算收入为 $482M。2026 年
    4 月，MoMo 据报正以超过 $2B 的估值探索引入新投资者，顾问为 Jefferies 和 Morgan Stanley，延续其独角兽地位。
  foundedDate: '2007-01-01'
  founders:
    - name: Nguyen Manh Tuong
      role: CEO 兼联合创始人
      background: 2007 年共同创立 M_Service JSC；带领 MoMo 完成五轮融资、跻身独角兽，并首次实现盈利。
      claimRefs:
        - CO012
    - name: Nguyen Ba Diep
      role: 联合创始人（副董事长 / SVP）
