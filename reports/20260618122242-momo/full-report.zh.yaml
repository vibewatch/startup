      - number: '6.2'
        title: 采用轨迹与使用广度
        blocks:
          - type: paragraph
            body: >-
              最持久的采用信号是规模，而不是完美披露。Reuters 报道的 2026 年材料称，MoMo 服务超过 30M 用户；更早的独立报道则给出超过 31M 注册用户。2024 年 10 月 MoMo
              高管访谈补充了我们找到的最具体广度统计：超过 50,000 家企业、70 多家银行和金融机构，以及约 300,000 个支付受理点。使用强度也有意义。Mission Media 和 Digital in Asia
              都引用了仅 2025 年 Q1 5.5B 笔交易的数据，这一规模大到难以支持「只有沉睡 logo 用户」的论点。话虽如此，采用数据仍需谨慎解读。公开材料对注册用户和交易笔数的披露，远强于活跃用户或 cohort
              行为。因此，安装基数庞大但分母不完整：我们能看到规模、广度和向小企业的持续产品扩张，却无法把这些数字精确桥接到 MAU、交易用户占比或按分层划分的重复频次。
