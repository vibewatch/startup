      - number: '5.4'
        title: 路线图信号与差异化
        blocks:
          - type: paragraph
            body: >-
              MoMo
              的产品技术差异化建立在两个复利资产上：广度和数据。广度意味着应用可以把用户从简单支付或转账意图，推进到更高价值的金融工作流，而不需要新登录、新开户漏斗或新分发渠道。数据重要，是因为重复的支付和互动事件可以喂给推荐、风险评分和欺诈模型。NVIDIA
              案例研究指向大规模推荐训练和推理，MoMo 自己的产品表面也持续向 AI 驱动的个性化倾斜。路线图信号也指向外部，而非内部。App Store 列表强调跨境 QR
              受理，投资页面显示扩张的市场型方法，信用卡和股票页面则显示 MoMo 乐于为受监管合作方充当分销中间件。关键尽调注意事项在于，公开披露对产品广度远比模块经济更丰富。战略图景清楚；按模块拆分的精确变现并不清楚。
