      - number: '8.2'
        title: 建议、信心与入场纪律
        blocks:
          - type: paragraph
            body: >-
              合适的公开市场结论是观察名单 / 有条件买入。抽象来看，MoMo 并不明显高估：公司有真实规模、真实产品广度、可信的 2024 年盈利里程碑，2026 年投资者流程也仍指向高于 2021
              年独角兽标记的兴趣。但这些并不自动意味着，在超过 $2 billion 的名义价格上还能获得有吸引力的回报。按现有公开锚点测算，概率加权价值约为 $2.5 billion，基准情形集中在约 $2.3
              billion 至 $2.5 billion。如果新一轮包含优先清算权、老股减持渗漏或激进治理条款，安全边际就太薄。


              实际姿态是中等信心、高风险、公允估值。类股票问题不是 MoMo 是否是一家真实公司；它显然是。问题是，新投资者是否为饱和风险、ZaloPay
              加速、监管摩擦和条款不透明获得了足够补偿。若结构不更清晰，新资金要么应瞄准约 $2.0 billion 的更干净有效入场价，要么要求明确下行保护。因此，结论是有条件买入，而不是买入。
            claimRefs:
