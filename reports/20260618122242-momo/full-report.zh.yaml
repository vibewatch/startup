      - number: '4.3'
        title: 资本充足性、融资历史与监管压力
        blocks:
          - type: paragraph
            body: >-
              最好的公开资本锚点仍是 2021 年 12 月的 Series E。Vietnam News、Fintech News Singapore、VIR 和 Mizuho 都支持同一组核心事实：MoMo 融资
              $200M，跨过 $2B 估值门槛，并称资金将深化金融服务渗透、商户扩张、生态投资和农村触达。GetLatka 之外的公开摘要通常把累计融资放在五轮约 $430M 至 $434M，而 GetLatka 的
              $228M 数字似乎低估了早期历史。这个差异应保留，而不是平均抹平。


              2026 年图景在战略可选性上更好，在资产负债表透明度上更差。Reuters 转发的报道称，管理层正在以高于 $2B 的估值探索新投资者，但交易并不确定，IPO 也不迫近。自 2024 年起盈利，可能降低了
              MoMo 相对长期投资期的融资依赖，但公开资料仍未披露现金余额、烧钱、runway、债务或或有义务。Circular 41
              还通过生物识别开户、数据留存、交易限额和钱包余额限制，提高持续成本和控制负担。因此，公开记录支持耐久性改善，但不支持得出偿付能力或 runway 结论。
