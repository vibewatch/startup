      - number: '8.5'
        title: 退出准备度、论点破裂点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              MoMo 近期退出菜单看起来比其战略价值暗示的更窄。最新公开报道称 IPO 不在近期议程上，这意味着投资者要把战略出售、结构化老股交易或更长期持有，视为 2026 至 2030 年更现实的结果。像
              Mizuho、区域银行，或寻求支付和金融分发触达的大型平台这样的战略买家，比近期上市更容易想象。GCash 是一个有用对照：Globe 的公开投资者关系基础设施已经提到 Mynt 披露活动，暗示其上市准备路径比
              MoMo 当前展示的更明确。


              因此，尽调纪律才是决定性变量。如果 MoMo 钱包份额流失快于预期，如果 ZaloPay 按当前增速继续复合增长，如果 2026
              年融资失败或附带惩罚性条款，如果生物识别显著拖慢开户，或如果盈利只是一段短周期而非可持续状态，投资论点就会破裂。在 MoMo 从观察名单进入买入之前，管理层需要展示当前股权结构、优先权堆栈、经审计
              FY2024-FY2025 财务、队列质量指标，以及正在进行的投资者流程的精确结构。
