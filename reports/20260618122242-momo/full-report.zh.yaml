        blocks:
          - type: paragraph
            body: >-
              MoMo 最好的客户证明不是漂亮的 logo 页面，而是实时交易表面积。CGV 是最干净的例子：MoMo 暴露直接购票，并在当前页面列出 91 个 CGV 网点，这是生产环境集成正在运行的硬证据。FWD
              同样强，因为关系不只是公告；MoMo 和 FWD 仍展示一条运行中的保费支付流，需要保单标识符，因此看起来是真实的经常性客户任务，而非单纯活动。CVS 更进一步，把 MoMo
              变成证券账户的分销和资金层，包含应用内开户、入金，以及后续保证金和新基金模式等功能扩张。KFC 有用但作为支付证明较弱：Retail Technology Innovation Hub 文章显示其在 227
              个网点部署，但披露用例是 AI 评论管理，而不是结账经济。合在一起，证明集真实且具全国相关性，但仍是局部而非穷尽；MoMo 对应用内能做什么的披露，远多于哪些具名客户贡献最多收入。
