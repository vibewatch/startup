      - number: '3.2'
        title: 直接对手画像：ZaloPay、VNPay/VNLife、Viettel Money 与 ShopeePay
        blocks:
          - type: paragraph
            body: >-
              ZaloPay 是 MoMo 最清晰的直接对手，因为它把消费者钱包行为与 Zalo 的特权分发结合起来。Saigon Times 报道，ZaloPay 2025 年收入达到 VND 1.11T，同比增长
              47%；其金融科技分部仍亏损约 VND 490B，意味着 VNG 仍在为规模和学习买单，而不是收割利润。战略要点在分发：VNG 公开报告和 Digital in Asia 都显示 Zalo 拥有全国级触达，因此
              ZaloPay 重新激活用户的成本低于独立钱包。VNPay 则不同。Tech in Asia 和 Fintech News 将 VNLife 描述为独角兽级母公司，2019 年融资 US$300M，2021
              年又融资超过 US$250M；其核心资产不是消费者超级应用习惯循环，而是嵌入银行的 QR 和支付基础设施。Viettel Money 在城市钱包心智中更小，但其电信版图、mobile-money 层和全国
              200,000 个支持点，让它在农村和政府相邻走廊中具有战略重要性。ShopeePay 则最好被理解为相邻的电商钱包：在 Shopee 流量已集中的地方有用，但尚未成为 MoMo 和 ZaloPay
              追求的广义越南金融目的地。
