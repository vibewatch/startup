  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户工作流与模块范围
        blocks:
          - type: paragraph
            body: >-
              MoMo 的产品定义最好理解为工作流所有者，而不只是储值钱包。官方表面描述的是一条单一消费者旅程：从身份和绑定资金来源开始，再处理转账、账单、充值、票务、旅行和商户 QR
              等日常资金任务。同一个应用随后试图捕获下一笔金融决策：储蓄、股票、信用卡激活或投资配置。这很重要，因为 MoMo
              的差异化不是某个高级功能，而是一扇入口、一个支付表面和一层信任机制在多类资金任务中的复用。公开证据还显示，该工作流意在与银行应用和银行卡保持互操作，而不是强制封闭钱包循环。Universal receive
              QR、支持 Visa 作为资金来源、多来源支付流，都指向同一战略：即便底层资金来自银行、银行卡或合作方产品，也要掌握用户交互层。
