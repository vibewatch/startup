      - number: '7.4'
        title: 合作伙伴、依赖与模型风险
        blocks:
          - type: paragraph
            body: >-
              MoMo 的业务不是闭环运转。支付触达依赖绑定银行账户、卡组织、商户受理伙伴和生态集成；信贷邻近业务依赖外部资金方和银行伙伴；AI 与数据工作负载也明显依赖 Google Cloud 基础设施。Mizuho
              的披露尤其有信息量：该行持有约 7.5% 股份，把 MoMo 定位为战略性分发资产，并称 Vietcombank 使用 MoMo 的评分模型开展信用筛查和放贷决策，因为 MoMo 本身没有放贷牌照。这种结构降低了
              MoMo 的资产负债表强度，但也意味着承保经济性、服务连续性和变现都要与交易对手共享，而这些对手的激励未必一致。竞争压力进一步放大这种依赖。银行 App 和 VietQR 正在抹平基础转账的功能差距，Moca
              退出说明市场可能突然整合，公开盈利证据也仍然很新，投资者不能假设当前模式已经具备结构性自融资能力。如果合作银行重新定价，如果 Google Cloud 韧性不及预期，或融资无法按可接受条款完成，MoMo
              的估值和增长率都会变得脆弱。
