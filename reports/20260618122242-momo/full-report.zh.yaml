      - number: '3.5'
        title: 护城河耐久性、商品化风险与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              在越南消费者金融科技中，MoMo 的护城河仍是整体最强组合：最大活跃品牌、30M+ 用户基数、最广公开产品范围、主要独立钱包中首个盈利信号，以及通过 PCI DSS v4.0
              和生物识别加固展现的合规领先。但这条护城河越来越有条件。ZaloPay 可以更久亏损，因为 VNG 在更大生态内为其供血，也因为 Zalo 给它低成本分发。即使消费者钱包互动转移，VNPay
              仍有关联性，因为它嵌在银行和商户基础设施里。银行超级应用威胁最重要的经济层，因为它们能把存款、利息和信贷接到同一套 QR 与转账行为上。Moca 被 Grab
              吸收后退出，是该类别最清晰的反向事件：没有独特分发或经济模型，单靠规模不够。尽调含义很直接：MoMo 不是因为缺功能而落败；如果功能广度变得容易复制，而分发或银行经济进一步远离钱包，它就会变脆弱。
