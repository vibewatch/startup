      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: TV005
    title: 论点破裂与止损触发因素表
    columns:
      - 触发因素
      - 为什么会打破论点
      - 监测信号
      - 立即行动
    rows:
      - - ZaloPay 在 2026-2027 年继续比 MoMo 更快复合增长
        - MoMo 将失去「品类领导地位足够持久、值得溢价倍数」这一假设
        - ZaloPay 的活跃用户、TPV 和收入增速持续跑赢 MoMo 可见的经营信号
        - 重切熊市情景，停止按溢价入场条款承销
      - - 2026 年投资者进程失败，或只能以惩罚性条款完成
        - 证实价格发现疲弱，或存在隐藏优先权包袱
        - 没有交易、下轮融资结构，或新资金条款异常优先
        - 从观察名单转为回避，直到证券条款披露
      - - Circular 41 明显伤害开户或激活
        - 成熟市场里，论点的增长支柱会被削弱
        - 转化率下滑、异常队列上升，或新增用户停滞
        - 下调增长假设并压缩倍数
      - - 盈利能力重新倒退为补贴驱动增长
        - 「成熟赢家」叙事整体失效
        - 促销激增、亏损扩大，或收入增长与利润率脱钩
        - 把 MoMo 视为质量较低的支付分销商
      - - 银行 App 和 VietQR 比预期更快吸收日常使用场景
        - MoMo 的参与度护城河变窄，变现杠杆下降
        - 用户频次走弱，同时商户和金融服务采用滞后
        - 下调基准情景，只关注有下行保护的结构
    notes: 这些是经营层面的止损标准，不是泛泛而谈的风险。任何一个出现，都足以让 MoMo 从公允变成缺乏吸引力。
    claimRefs:
      - CV005
      - CV017
      - CV020
      - CV022
      - CV023
      - CV036
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 尽调要求
      - 为什么构成阻塞
      - 最佳负责人
      - 好结果是什么
    rows:
      - - 当前股权结构和完整优先权栈
        - 如果不知道优先级、清算和反稀释条款，就无法给有效入场价定价
        - CFO / 主承销银行
        - 完整的完全稀释后股权，以及拟议轮次下的清算瀑布
      - - 经审计的 FY2024-FY2025 财务报表，加上 2026 年月度管理账
        - 公开披露的盈利能力和收入仍不是申报级事实
        - CFO / 审计师
        - 经审计报表，加上月度收入、毛利、opex 和现金桥
      - - 当前投资者进程的交易结构
        - 一级和二级占比会同时改变回报潜力和资产负债表价值
        - 主承销银行 / 董事会
        - 募资用途、卖方名单和投后股权影响清晰
      - - 队列、MAU、留存和变现质量指标
        - 在饱和的钱包市场里，注册用户本身不够
        - 增长 / 产品分析
        - 按激活、频次、产品附加和活跃用户净收入拆分队列
      - - Circular 41 下的监管和开户指标
        - 如果生物识别摩擦过高，增长假设会很快失效
        - 合规 / 运营
        - 前后转化率、误拒率和人工审核吞吐量
      - - ZaloPay / 银行 App 竞争记分卡
        - 最大估值威胁是份额和参与度被压缩，而不是需求消失
        - 战略 / 企业发展
        - 月度份额、支付量、商户和用户频次对比
    notes: 如果管理层不能快速、连贯地提供这六项材料，即便表面估值看起来稳定，MoMo 也应继续留在观察名单。
    claimRefs:
      - CV023
      - CV034
      - CV035
      - CV036
      - CV043
