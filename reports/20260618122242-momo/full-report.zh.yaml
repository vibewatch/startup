      - number: '1.5'
        title: 公司里程碑
        blocks:
          - type: paragraph
            body: >
              MoMo 的增长分为四个清晰阶段：创立期（2007–2013），M_Service 搭建基于 SIM
              的支付轨道；智能手机转向期（2014–2018），应用上线并通过早期融资铺设市场扩张；超级应用建设期（2019–2021），三轮融资合计
              $400M，支持产品多元化并达成独角兽地位；盈利与资本市场期（2022–2026），MoMo 转盈，并开始在维持 $2B+ 估值的基础上探索新资本。监管里程碑包括 2023 年获得 PCI DSS v4.0
              认证（越南首家达成该认证的金融科技公司），以及 MoMo 为遵守 SBV Decision 2345 部署 iProov Dynamic Liveness 生物识别认证。2026 年 4 月通过
              Jefferies 和 Morgan Stanley 探索投资者，是最近的头条事件，表明管理层有意释放价值并为持续增长融资。
