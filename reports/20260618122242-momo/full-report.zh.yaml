        title: 规模、牵引力与关键指标
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 4 月，MoMo 服务超过 30M 用户，仅 2025 年 Q1 就处理 5.5B 笔交易，体现越南无现金支付普及的规模。收入从 2022 年的 $355M 增至 2024 年的
              $482M；2024 年也是公司多年烧钱增长后首次实现全年净利润。2025 年初，MoMo 在越南电子钱包市场份额约 56%，活跃钱包渗透率为 69%。MoMo 的商户网络覆盖全国 140,000
