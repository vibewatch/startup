      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              最干净的自上而下锚点是数字支付流水，而不是泛化的「金融科技市场」收入数字。Bain/Google/Temasek 为越南数字支付走势提供最宽视角，本地市场文章则给出钱包份额、QR
              扩张和用户行为的更细证据。证据支持分层判断：一个庞大的全国数字支付 TAM；一个更窄的移动钱包 SAM，排除 MoMo 无法完全变现的银行卡和银行主导流水；以及一个最好用 MoMo 已实现收入和用户规模近似的
              SOM，因为公开 GMV 和 take-rate 数据缺失。矛盾不应被平均抹平，而应保留。公开金融科技估算相差超过一个数量级，取决于发布方指的是交易金额、行业收入，还是包含贷款和 SME
              基础设施的一篮子口径。这很重要，因为宽松的市场规模捷径，会让 MoMo 看起来要么已触顶，要么严重低渗透。因此，本章同时保留宽口径 TAM 视角和相互矛盾的金融科技估算区间，并把精确变现转换视为明确证据缺口。
