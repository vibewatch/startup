  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、变现表面与收入质量注意事项
        blocks:
          - type: paragraph
            body: >-
              MoMo 看起来比纯转账钱包财务更强，因为公开产品表面不止支付。近期公司、合作方和媒体来源描述的平台覆盖商户结账、账单缴费、贷款、保险、投资、分期和面向商户的营销工具。这很重要，因为免费 P2P
              和日常钱包层看起来主要承担互动和习惯养成，变现更可能落在商户、账单方、品牌和金融合作伙伴身上。Mizuho 自己的 MoMo
              画像在这里尤其有用：它明确把贷款、保险、分期、优惠券和数字营销列为该应用商业角色的一部分。SCMP 还补充称，管理层正进一步推进线下消费和商户解决方案。


              收入质量问题在披露，不在规模。GetLatka 的 $482M 2024 年估算和 $355M 2022 年估算给出方向性收入曲线，多篇 2026 年文章也确认 2024
              年开始盈利。但公开记录仍未披露按收入流拆分的确认收入、2023 年官方收入、GMV、cohort 行为或已实现 take-rate 桥。因此，正确结论不是 MoMo 缺少变现，而是 MoMo
              拥有几条合理变现路径，但其组合和会计处理仍属私有信息。
