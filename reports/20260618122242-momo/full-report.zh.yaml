      - number: '4.4'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              正确的财务结论是：商业模式广度正面，变现质量中等，承销可行性需要谨慎。MoMo 已不再只是一个追逐补贴的消费者钱包。其公开表面现在包括商户解决方案、金融产品分销、分期和 AI 驱动的互动工具；2024
              年转向盈利，是模型可以成熟的重要证据。从这个意义上说，收入质量好于纯免手续费 P2P 钱包所暗示的水平。


              谨慎来自仍未公开的信息。收入仍是第三方估算，收入流组合未披露，利润率缺失，合作方主导信贷产品的损失拨备不清楚，现金或 runway 数据不可得。反向来源也重要：Vietdata 和 CafeF
              都认为，越南钱包经济承受重营销压力，也受到银行免费提供类似数字功能的挤压。合在一起，公开证据支持 MoMo 已进入更健康曲线阶段的结论，但不支持投资者在没有 data room
              的情况下承销利润率耐久性或资产负债表充足性。
