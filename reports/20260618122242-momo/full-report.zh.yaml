      - number: '7.5'
        title: 人才、执行、缓释措施与尽调问题
        blocks:
          - type: paragraph
            body: >-
              MoMo 已经足够大，人才风险的核心不再是团队太薄，而是组织能否让专业人才和合规能力跟上快速扩张的产品组合。公开来源显示，公司员工超过 2,000 人，Nguyen Manh Tuong
              仍保持活跃创始人能见度，产品栈覆盖支付、信贷、储蓄、投资、欺诈防御和伙伴分发服务。广度是优势，也把法律、安全、数据、客服和伙伴运营的执行负荷拉高。公开材料没有给投资者足够的内部指标，无法高置信度承销剩余人才与执行风险：未披露云故障切换架构，没有公开信贷损失桥，没有监管往来文件，也没有详细服务水平报告。因此，缓释论据要靠尽调要求和否决标准，而不是乐观假设。管理层应能证明
              SBV 就绪的控制、数据传输合规、按伙伴拆分的信贷表现、事件响应纪律，以及围绕创始人主导信任叙事的继任深度。如果这些材料薄弱或相互矛盾，即使表面增长仍完好，风险评级也应上调。
