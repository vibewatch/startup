        title: 产品地图、商户表面与广度护城河
        blocks:
          - type: paragraph
            body: >-
              对一个越南钱包而言，MoMo 的公开模块地图异常宽。今天清晰可见的消费者端模块包括核心支付、可互操作的 QR 收款与付款、与 CVS
              合作的股票投资、多合作方投资市场、合作方发行的信用卡，以及面向商户的开户。商户侧很重要，因为它显示 MoMo 不只是在卖消费者应用；它还通过 M4B 暴露
              API、仪表盘、测试凭证、生产密钥流程和企业账户层。这种架构提高了 MoMo
              添加新可变现模块的概率，而无需让用户重新学习新的产品表面。广度也支撑双边网络效应：用户有更多理由保留应用，商户则获得更多结账、资金来源和营销选项。因此，护城河不在任何单一
              SKU，而在一个账户能否在支付、受理、借贷、储蓄、投资和绑卡消费之间持续复利。
