      claimRefs:
        - CO013
  foundingLocation: Ho Chi Minh City, Vietnam
  headquarters: Ho Chi Minh City, Vietnam
  productSummary: |
    移动电子钱包和金融科技超级应用，在单一移动应用内提供 P2P 支付、商户 QR 支付、账单支付、电信充值、小额贷款、保险分销、储蓄、股票交易、游戏充值、外卖点餐和旅行预订。
  customerFocus: |
    主要用户：18–45 岁越南城市智能手机用户。次要用户：SME 商户，以及 B2B 金融服务分销合作方（银行、保险公司、贷款机构、证券公司）。
  businessModel: |
    交易手续费收入（商户支付 MDR 0.5–2.0%）、分销金融产品（保险、贷款、投资）的佣金收入、品牌合作方广告和促销展示费，以及国际汇款手续费收入。
