      - number: '2.5'
        title: 规模测算与数据缺口
        blocks:
          - type: paragraph
            body: >-
              这个市场的主要分析风险是假精确。公开来源很多，但常常用「钱包份额」或「金融科技市场规模」这类宽泛标签描述不同分母、不同年份和不同市场边界，诱使人把不兼容数字做平均。对 MoMo
              而言，最大的剩余盲点是变现质量：没有公开 GMV 序列，没有披露 take rate，也没有活跃用户 cohort
              披露，投资者无法把消费者支付流水转成可靠收入桥。区域数据也偏弱。多数公开评论集中在胡志明市和河内，但真正影响未来获客效率的问题，是这些枢纽之外还有多少未渗透空间，以及农村现金行为是结构性持续，还是只是被低估。因此，本章保留相互矛盾的估算，把收入作为最干净的公开
              SOM 代理，并记录搭建更精确估值级市场模型所需的缺失私有输入。
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、既有机构、相邻玩家、替代品与现状选项
        blocks:
          - type: paragraph
            body: >-
              MoMo 的竞争场域远比独立钱包排名更宽。直接同行仍是 ZaloPay、VNPay/VNLife、Viettel Money 和 ShopeePay，但更强的结构性替代品是银行超级应用、Apple Pay
              等银行卡叠层，以及消费者继续使用工资账户银行应用加 VietQR 的选择。越南标准化 QR 受理后，核心变化在于支付受理越来越像轨道级基础设施，而不是钱包专有地产。KaadxPay 把 VietQR
              描述为跨参与银行和主要钱包运行的统一商户标准；Indochine Counsel 则显示监管者正在通过 Circular 41
              收紧开户和中介支付控制。这意味着，对许多消费者而言，「什么都不做」是可信选项：保留既有银行应用，用免费转账或 QR 支付，只在促销或捆绑服务值得时才打开钱包。在这一背景下，MoMo
              仍领先头部份额，但竞争问题不再是谁先把支付数字化，而是在基础资金流动商品化后，谁能掌握日常频次、商户分销和相邻金融产品。
