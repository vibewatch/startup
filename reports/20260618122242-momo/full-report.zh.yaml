  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              分析 MoMo，应把它放进越南数字支付和金融分销栈，而不是所有打着「fintech」标签的头条数字里。应纳入的相关支出，是能在应用内发起、结算或交叉销售的经常性消费者资金流动和商业活动：点对点转账、账单支付、商户
              QR
              结账、充值、分期还款，以及储蓄、保险、贷款或投资产品分销。排除清单同样重要。从未触达数字界面的现金、独立银行卡经济、纯银行存款，以及基础设施软件或加密交易等无关金融科技垂直领域，可能影响生态，但不会直接转化为
              MoMo 收入。VietQR 和 NAPAS 也很关键，因为它们把受理层压平：能接入标准化 QR
              的商户，就能被多家银行应用和钱包触达。钱包差异化因此不再主要靠专有受理网络，而是靠用户习惯、信任、商户覆盖、交叉销售和金融助手定位。
            claimRefs:
