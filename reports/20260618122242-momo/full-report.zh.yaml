  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 按买方、用户、付款方、地域与垂直场景划分客户
        blocks:
          - type: paragraph
            body: >-
              MoMo 的客户地图是双边的，但仍明显由消费者主导。主要用户是越南个人消费者：下载应用、绑定银行账户或资金来源，并用应用处理转账、账单、充值、票务、旅行和 QR
              购物等日常资金任务。不过，付款方并不总是同一个消费者。连锁商户、品牌、保险公司、券商和其他嵌入式金融合作方常常承担受理、分销或产品经济；银行则仍是资金轨道，让 MoMo
              在高度银行化的市场中保持相关性。公开证据也指向一个广泛但尚未完全全国化的足迹：越南数字可触达基数已经巨大，但金融科技价值仍集中在胡志明市周边的南部，北部、中部和湄公河走廊仍是扩张空白。从人口结构看，可触达市场是大众市场，而非利基市场，约
              40% 人口位于 18–44 岁年龄段，超过五分之四人口已在线。从垂直场景看，最强公开证明集中在日常消费者支出和嵌入式金融——影院、保险、股票、便利零售、餐饮服务和商户 mini-app
              工具——而不是大型已披露企业合同。
