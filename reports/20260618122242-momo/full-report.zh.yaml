            body: >
              M_Service JSC 由一支深耕本地金融科技的核心高管团队领导。董事长 Thomas Anthony Michael 负责董事会层面监督，CEO 兼副董事长 Nguyen Manh Tuong
              是公司联合创始人，自创立以来一直带队。总裁 Do Quang Thuan 负责运营管理。联合创始人 Nguyen Ba Diep 担任政府、公共事务与法律高级副总裁，在监管关系中扮演关键角色。CFO
              Manisha Shah 负责财务战略。领导层结构明显稳定，Tuong 和 Diep 这对创始组合在公司成立 15 年后仍占据高级管理岗位。关键人风险集中在 Nguyen Manh Tuong
              身上；他的愿景和政府关系一直是 MoMo 获得监管许可、推进商业扩张的核心。近年未有公开披露的重大高管离职。Series E 后，Mizuho Bank 持有 M_Service JSC 约 7.5%
              股份。除高管团队外，完整董事会构成未公开，是治理透明度缺口。
