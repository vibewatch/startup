      - number: '4.2'
        title: 公开牵引力、GTM 代理与成本结构
        blocks:
          - type: paragraph
            body: >-
              公开牵引力真实存在，但不应被过度解读为单位经济模型。最强的可见规模标记是 30M+ 用户、2021 年融资时约 31M 用户，以及 2025 年 Q1 的 5.5B 笔交易。这些数据证明 MoMo
              已成为越南主要的支付和金融分销表面；按年约 $16 的简单每用户收入代理，也显示其相对大众市场钱包已有实质变现。与此同时，这些镜头仍不完整。没有公开 GMV，没有披露活跃用户分母，没有 ATV，没有留存 CAC
              或回收期指标，也没有报告 blended take rate。因此，销售效率仍是推断值，而非实测值。


              成本结构更容易做方向性描述，难以量化。MoMo 现在投入 AI 驱动的产品开发和欺诈防护；iProov 与 Circular 41 表明，生物识别身份和反欺诈控制不是可选项。Vietdata
              对该类别的负面研究也很重要：它认为钱包渗透率竞赛通过重营销和低质量竞争耗干了市场领导者的资金。这与 MoMo
              历史亏损曲线相符，也符合一个超级应用多年买习惯、再实现盈利的逻辑。因此，可能的成本栈包括技术、合规、欺诈工具、合作方集成、员工，以及仍然实质存在的商户或用户激励，即便精确组合仍是私有信息。
