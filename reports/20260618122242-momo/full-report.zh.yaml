  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              MoMo 的多头论点并不难讲清楚。公开来源一致把它定位为越南领先的钱包 / 消费金融超级 App：用户超过 3,000 万，拥有全国最大钱包份额，并在 2024
              年首次公开实现盈利。市场领导地位重要，因为钱包本质上是分发业务：最好的资产不只是支付量，而是把信贷、保险、投资、商户营销和 SME 工具交叉销售给庞大存量用户的权利。Mission Media 对 2026
              年的判断在方向上有帮助：越南金融科技仍是数十亿美元级市场，但下一段真实跑道在 SME 金融和嵌入式商业工具，而不是再一轮补贴驱动的消费者 QR 拉新。


              反向论点同样重要。消费者钱包采用率正在成熟，银行和 VietQR 已经压缩日常转账的功能差距，ZaloPay 也借助庞大的 VNG 生态重新加速。Vietdata
              的负面研究也必须纳入，因为它显示这个品类在盈利出现前摧毁了多少价值：头部玩家多年靠营销购买习惯，直到最近才收窄亏损。因此，MoMo
              的估值不应简单套用赢家通吃的科技倍数。它是一家有规模、但仍受监管的支付分发商；上行空间越来越取决于它能否比银行、ZaloPay 和基础设施型对手更好地变现金融服务。
