      - number: '6.5'
        title: 扩张与集中度：先落地再扩张可见，但集中度仍不透明
        blocks:
          - type: paragraph
            body: >-
              MoMo 的扩张逻辑连贯。它通过低摩擦的日常支付任务获取或重新激活用户，再尝试把用户推进到保费支付、股票入金、储蓄或贷款等更高价值行为。合作方侧也适用同一模式：MoMo 不只是一个钱包按钮，也是带有
              mini-app 工具和嵌入式金融分销的商户与品牌表面。话虽如此，三项反向约束很重要。第一，随着银行应用改善、免费转账把转账任务商品化、QR 从护城河变成标准，核心支付正快速成熟。第二，Circular 41
              让新用户开户和合规更难，尤其会影响较弱运营商和边际
              cohort。第三，集中度仍基本不可见。公开材料未披露头部客户集中度、渠道集中度，或来自商户与金融合作方的经济占比。因此，上行情形是单用户更深变现和区域扩张，但承销缺口在于，少数渠道或合作方是否已经主导这条路径。
