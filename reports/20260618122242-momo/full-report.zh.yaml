      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              越南钱包的法律边界正在收紧，并直接影响 MoMo 的增长模型。Circular 41 要求自 2026 年 1 月 1
              日起，新开钱包必须进行现场生物识别验证，禁止在服务商网点存取现金，并要求更严格审查合法资金来源，同时向央行报告可疑钱包。这些义务对有规模的既有玩家可管理，但仍会增加开户摩擦、人员成本、审计负担，并在身份核验或关联银行流程失灵时制造更多故障点。合规负担进一步上升，因为越南仍处于
              FATF 加强监测之下，且 2025 年 Personal Data Protection Law 及相关网络安全框架增加了跨境传输评估、日志记录、本地化、事件报告和可能严厉的收入挂钩罚款。对 MoMo
              而言，其消费者应用可见的敏感数据量，以及 CIC 泄露事件证明即便国家关联金融数据基础设施也会大规模失效，都会放大风险。公开证据没有显示 MoMo 违规；问题在于，失败带来的罚款和信任后果已经变得更严重。
