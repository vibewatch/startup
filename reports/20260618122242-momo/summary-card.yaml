summary:
  headline: >
    MoMo is Vietnam's undisputed #1 digital wallet with 56–60% market share, first profitable year in FY2024, and
    confirmed unicorn status — a strong position but facing intensifying competition from ZaloPay, regulatory friction,
    and a 4.8x revenue multiple that offers limited upside at the current $2B+ valuation.
  overallScore: 6.8
