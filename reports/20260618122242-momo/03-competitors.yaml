- id: moat-durability-and-risk
  title: Moat durability, commoditization risk, and adverse competitor evidence
  body: 'MoMo’s moat is still the strongest overall bundle in Vietnam consumer fintech: the largest active brand, a 30 million-plus user base, broadest public product scope, first-profitability signal among the major standalone wallets, and a visible compliance lead through PCI DSS v4.0 and biometric hardening. But the moat is becoming more conditional. ZaloPay can stay loss-making longer because VNG funds it inside a larger ecosystem and because Zalo gives it low-cost distribution. VNPay remains relevant even if consumer wallet engagement shifts because its position is embedded in bank and merchant infrastructure. Bank super-apps threaten the most important economic layer because they can attach deposits, interest, and credit to the same QR and transfer behavior. Moca’s withdrawal after Grab absorption is the clearest adverse event in the category: scale without a distinct distribution or economics model is not enough. The implication for diligence is straightforward: MoMo is not losing
    because it lacks features; it is vulnerable if feature breadth becomes easy to copy while distribution or bank economics move further away from wallets.'
