chapter:
  number: 3
  title: Competitors
  summary: MoMo still leads Vietnam wallets on scale and breadth, but competition has shifted from basic payment rails to distribution, trust, and attached financial products. ZaloPay remains the sharpest direct threat because of Zalo distribution, VNPay matters as bank-embedded QR infrastructure, and bank super-apps increasingly compress wallet differentiation by combining free transfers, deposits, and credit.
sections:
- id: competitive-landscape
  title: 'Landscape: Direct peers, incumbents, adjacents, substitutes, and the status quo'
  body: 'MoMo competes in a much wider field than standalone wallet rankings suggest. The direct peer set remains ZaloPay, VNPay/VNLife, Viettel Money, and ShopeePay, but the stronger structural substitutes are bank super-apps, card overlays such as Apple Pay, and the consumer choice to simply keep using a salary-account banking app plus VietQR. The core change since Vietnam standardized QR acceptance is that payment acceptance is increasingly rail-level infrastructure rather than proprietary wallet real estate. KaadxPay describes VietQR as a unified merchant standard that works across participating banks and major wallets, while Indochine Counsel shows the regulator tightening onboarding and intermediary-payment controls under Circular 41. That means the “do nothing” option is credible for many consumers: keep the incumbent bank app, pay by free transfer or QR, and only open a wallet when promotions or bundled services justify it. Against that backdrop, MoMo still leads headline share,
    but the competitive question is no longer who can digitize payments first; it is who can own daily frequency, merchant distribution, and adjacent financial products once basic payment movement is commoditized.'
