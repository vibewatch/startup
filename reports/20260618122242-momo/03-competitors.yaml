- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Player
  - User-visible pricing
  - Merchant pricing disclosure
  - Packaging / contract model
  - Included capabilities
  - Implication
  rows:
  - - MoMo
    - Core consumer payments typically promotion-led; public fee schedule not central to positioning
    - Merchant MDR not clearly posted in cited public sources
    - App-based super-app with partner financial products
    - Payments plus loans, savings, insurance, investing
    - Bundle breadth matters more than explicit price leadership
  - - ZaloPay
    - Public gateway emphasizes method choice over explicit user fees
    - Merchant pricing appears agreement-based by supported method
    - Gateway + wallet + Zalo-distribution packaging
    - Wallet, VietQR, cards, Apple Pay, BNPL
    - Flexible packaging supports merchants, but economics are opaque publicly
  - - VNPay / VNPay-QR
    - No simple public end-user fee card in cited sources
    - Merchant onboarding is sales-led rather than menu-priced
    - Infrastructure / gateway contract model
    - QR, bank-app acceptance, cards, wallet features
    - Strength is reach and embedded distribution, not posted pricing transparency
  - - Viettel Money
    - Official site highlights free transfers and no maintenance fee
    - Gateway pricing not publicly posted in cited sources
    - Wallet + mobile money + telco distribution
    - Transfers, payments, top-ups, gateway, mobile money
    - Price-friendly for users, especially outside card-heavy urban cohorts
  - - Bank super-apps
    - Free QR transfers are explicit; savings can pay interest; card and loan pricing varies by product
    - Bank product pricing is visible product-by-product, not as a single wallet MDR
    - Primary-account relationship with embedded financial products
    - Transfers, deposits, cards, credit, savings
    - Banks can subsidize payment behavior with broader balance-sheet economics
  - - Apple Pay
    - Apple says it charges users no fee
    - Merchant cost sits with existing acquirer / card acceptance
    - Thin overlay on supported bank cards
    - Contactless, online, in-app card checkout
    - Makes card rails more convenient without replacing the bank relationship
  notes: Public competitor pricing is unusually opaque in Vietnam wallets. This table therefore compares consumer-visible fees and packaging logic, while marking merchant economics as contract-led or undisclosed where public evidence is absent.
