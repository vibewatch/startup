- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Supporting evidence
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Largest wallet scale and brand
    - 30M+ users, ~56% share, first profitability signal
    - ZaloPay and bank apps chip away at frequency
    - High
    - Scale helps, but share is no longer enough if usage can multi-home
    - Track active-user frequency, not just registrations
  - - Broadest product suite
    - Loans, savings, insurance, investing sit inside the app
    - Feature copying and bank bundling
    - High
    - Payments alone are easy to commoditize; attach products drive lock-in
    - Request product-level attach-rate and repeat-usage data
  - - Compliance / trust lead
    - PCI DSS v4.0 and biometric rollout
    - Banks and peers upgrade KYC quickly under Circular 41
    - Medium
    - Regulatory edge can narrow if everyone reaches the same baseline
    - Test fraud-loss trends and onboarding conversion after biometrics
  - - Merchant and partner network
    - Large merchant base and bank partnerships
    - VietQR makes acceptance interoperable
    - High
    - Acceptance ownership shifts from wallet brand to rail access
    - Measure exclusive merchant programs versus generic QR acceptance
  - - Distribution habit strength
    - MoMo usage frequency leads Cimigo sample
    - Zalo social graph and bank salary-account relationships
    - High
    - Distribution, not raw features, is the fastest way to steal frequency
    - Benchmark CAC, reactivation cost, and promo intensity versus ZaloPay
  - - Category survivability
    - Moca exit proves weak economics can force retrenchment
    - Standalone-wallet margin pressure
    - Medium
    - Adverse precedent shows weaker players can disappear or consolidate
    - Stress-test MoMo under lower promo spend and lower payments take rate
  notes: Severity reflects competitive durability risk to MoMo over the next 12-24 months, based on public evidence rather than a quantified simulation. Diligence asks focus on the non-public operating data needed to confirm durability.
