tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Player
  - Category
  - Scale / funding
  - Target customer
  - Product scope
  - Distribution / GTM
  - Regulatory posture
  - Constraint
  rows:
  - - MoMo
    - Direct peer / leader
    - 30M+ users; ~56% wallet share; first profitable FY2024
    - Mass-market consumers, merchants, financial-product users
    - Wallet, transfers, bills, QR, lending, savings, insurance, investing
    - App-led super-app; partner distribution with banks and merchants
    - PCI DSS v4.0 and biometric hardening; licensed incumbent
    - Most exposed where payments are commoditized and bank economics dominate
  - - ZaloPay
    - Direct peer
    - VND1.11T 2025 revenue; active users +40%; still loss-making
    - Urban consumers, social-app users, online/offline merchants
    - Wallet, gateway, VietQR, cards, Apple Pay, BNPL, lending/savings distribution
    - Embedded in Zalo ecosystem plus merchant/gateway sales
    - Zion JSC holds 2026 intermediary-payment license
    - Profitability still weaker than MoMo; market-share metrics vary by methodology
  - - VNPay / VNLife
    - Direct peer / infrastructure
    - US$300M (2019) + >US$250M (2021); 22M users; 150K+ merchants
    - Banks, merchants, bill-pay users, QR consumers
    - QR network, payment gateway, bank-app enablement, wallet functions
    - Bank-embedded distribution through VNPay QR and partner apps
    - SBV-compliant gateway; PCI DSS level 1 on official site
    - Less super-app engagement than MoMo; more infrastructure than habit loop
  - - Viettel Money
    - Direct peer / rural specialist
    - Nationwide telco-backed reach; 200K support points
    - Rural users, telco customers, mobile-money users
    - Transfers, bill pay, wallet, mobile money, gateway
    - Viettel network, agent footprint, telecom touchpoints
    - eKYC and mobile-money onboarding visible on official flows
    - Less visible urban lifestyle distribution than MoMo or ZaloPay
  - - ShopeePay
    - Adjacent wallet
    - Meaningful e-commerce share; not disclosed as broad super-app leader
    - Shopee shoppers and promotion-driven commerce users
    - Checkout wallet, top-up, bills, QR use cases
    - Embedded in Shopee traffic and campaigns
    - Operates as licensed wallet ecosystem participant
    - Distribution is strong inside Shopee but weaker outside commerce context
  - - Bank super-apps (VPBank / Techcombank cluster)
    - Incumbent substitute
    - Large deposit bases; bank-app preference rising in Q4 2024
    - Primary-account holders, payroll users, SMEs, young professionals
    - Free transfers, QR pay, savings, cards, credit, lending
    - Bank branch + salary-account + app cross-sell
    - Full banking licenses and direct deposit economics
    - Less promotional excitement, but superior economics and trust for many users
  - - Apple Pay / bank-card overlay
    - Adjacent substitute
    - Growing merchant and bank acceptance, no standalone wallet base disclosed
    - iPhone users with supported cards
    - Contactless checkout, in-app and online card payment
    - Rides on existing bank-card relationships and merchant acceptance
    - Operates through partner banks and card rails
    - No native lending/savings marketplace or merchant-reward ecosystem
  notes: Rows compare strategic role rather than a single like-for-like denominator. Funding, revenue, and user figures come from mixed public vintages; where public data is missing, the table states the limitation instead of forcing precision.
