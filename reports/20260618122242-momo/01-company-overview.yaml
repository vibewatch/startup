callouts:
  - calloutType: strength
    title: "First-Mover Advantage in Vietnam's Digital Wallet Market"
    body: >
      MoMo launched Vietnam's first mobile wallet in 2010 and has compounded that head start into a
      56% e-wallet market share, 140,000+ merchant network, and 30+ million users. Its PCI DSS v4.0
      certification and iProov biometric partnership signal compliance maturity that smaller rivals
      cannot easily replicate, creating a durable regulatory moat.
    claimRefs:
      - CO002
      - CO020
      - CO021
      - CO022
      - CO023

  - calloutType: risk
    title: "Key-Person Concentration in CEO Nguyen Manh Tuong"
    body: >
      MoMo's regulatory relationships, investor confidence, and strategic vision are heavily
      concentrated in co-founder and CEO Nguyen Manh Tuong. No public succession plan exists.
      This creates material key-person risk in a market where regulatory trust is critical to
      maintaining the e-wallet license and expanding financial-product distribution agreements.
    claimRefs:
      - CO040
      - CO041

  - calloutType: insight
    title: "April 2026 Investor Exploration Signals Capital-Light Path to Exit"
    body: >
      The engagement of Jefferies and Morgan Stanley in April 2026 at a >$2B valuation, combined
      with the explicit statement that an IPO is not imminent, suggests MoMo is pursuing a secondary
      strategic sale or structured equity raise rather than a public offering. This has implications
      for liquidity timing and governance complexity for existing investors.
    claimRefs:
      - CO014
      - CO036

