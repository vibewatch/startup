company:
  name: MoMo
chapter:
  number: 1
  title: Company Overview
  summary: >
    MoMo (operated by M_Service Joint Stock Company, founded 2007, HQ Ho Chi Minh City) is Vietnam's
    dominant fintech super-app: 56% e-wallet market share, 30+ million users, $482M revenue in 2024,
    and its first full-year profit that year. In April 2026 MoMo engaged Jefferies and Morgan Stanley
    to explore new investors at a reported valuation above $2 billion, affirming unicorn status first
    established at the December 2021 Series E ($200M led by Mizuho Bank at $2B+).

sections:
  - id: company-identity
    title: Identity, Headquarters, and Business Model
    body: >
      MoMo is operated by M_Service Joint Stock Company, incorporated in Ho Chi Minh City, Vietnam
      in 2007. The MoMo electronic wallet brand was officially launched in October 2010 as Vietnam's
      first SIM-card-based mobile wallet, then transitioned to a smartphone app in 2014 as the super-app
      model took shape. The company's legal name is M_Service JSC and it is headquartered in Ho Chi Minh
      City. MoMo describes itself as Vietnam's leading mobile wallet and financial super-app, offering
      payments, peer-to-peer transfers, bill payments, QR payments, consumer lending, savings, insurance,
      investment, gaming top-ups, food ordering, and merchant tools through a single application. The
      business model derives revenue primarily from merchant discount rates (MDR) of 0.5%–2.0% on
      payments, commissions on financial product distribution (insurance, loans, investment funds), and
      advertising and promotional placement fees from partner brands. MoMo positioned itself from the
      outset as a financial-inclusion vehicle for Vietnam's large unbanked and under-banked population.
      Its core value proposition is one-app access to financial services for 30+ million users, over
      140,000 merchant acceptance points, and partnerships with more than 50 banks.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO025
      - CO030
      - CO031
    tableRefs:
      - TO001
    figureRefs:
      - FO003

  - id: leadership-governance
    title: Founders, Leadership, and Governance
    body: >
      M_Service JSC is led by a core executive team with deep local fintech roots. Chairman Thomas
      Anthony Michael provides board-level oversight while CEO and Vice Chairman Nguyen Manh Tuong
      co-founded the company and has led it since inception. President Do Quang Thuan handles
      operational management. Co-founder Nguyen Ba Diep serves as Senior Vice President for
      Government, Public Affairs and Legal, playing a key role in regulatory relationships. CFO
      Manisha Shah oversees financial strategy. The leadership structure has been notably stable,
      with the founding duo of Tuong and Diep still occupying senior executive roles more than
      15 years after founding. Key-person risk is concentrated in Nguyen Manh Tuong, whose vision
      and government relationships have been central to MoMo's regulatory approvals and commercial
      expansion. No material leadership departures have been publicly disclosed in recent years.
      Mizuho Bank holds approximately 7.5% of M_Service JSC shares following the Series E. Full
      board composition beyond the executive leadership team is not publicly disclosed, representing
      a governance transparency gap.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO007
      - CO042
      - CO011
      - CO044
    tableRefs:
      - TO002
    figureRefs:
      - FO002

  - id: funding-valuation
    title: Funding History, Valuation, and Investors
    body: >
      MoMo has raised approximately $434 million across five rounds. The Series C ($100M, January 2019,
      led by Warburg Pincus) funded expansion into broader financial services. The Series D ($100M,
      January 2021, led by Goodwater Capital and Warburg Pincus with Affirma Capital, Kora Management,
      Macquarie Capital, and Tybourne Capital Management) accelerated super-app development. The
      landmark Series E ($200M, December 2021, led by Mizuho Bank with Ward Ferry Management, Goodwater
      Capital, and Kora Management) valued the company at over $2 billion and conferred unicorn status,
      making MoMo Vietnam's fourth unicorn. GetLatka data suggests the Series E valuation is
      approximately $2.3 billion. In April 2026, MoMo engaged investment banks Jefferies and Morgan
      Stanley to explore bringing in new investors at a reported valuation above $2 billion, having
      received interest from both strategic and financial investors; deliberations are at an early stage
      and no transaction is certain. An IPO is not on the near-term agenda. No material secondary
      transactions or debt instruments are publicly disclosed.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO043
      - CO036
    tableRefs:
      - TO003

  - id: traction-metrics
    title: Scale, Traction, and Key Metrics
    body: >
      MoMo serves more than 30 million users as of April 2026 and processed 5.5 billion transactions
      in Q1 2025 alone, reflecting the scale of Vietnam's cashless payment adoption. Revenue reached
      $482 million in 2024, up from $355 million in 2022, and 2024 marked the company's first
      full-year net profit after years of cash-burn-led growth. The company holds approximately 56%
      e-wallet market share in Vietnam with 69% active wallet penetration as of early 2025.
      MoMo's merchant network spans more than 140,000 acceptance points nationwide. The company
      employs approximately 2,300 people. Annual revenue per user in 2024 was approximately $16 based
      on $482M revenue and 30M+ users. The State Bank of Vietnam's broader cashless push has been
      a significant tailwind: non-cash transaction volumes grew 43.4% year-on-year, QR code payment
      values surged 128% in 2025, and 87% of Vietnamese adults now hold bank accounts.
    claimRefs:
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO045
    figureRefs:
      - FO001

  - id: milestones-chronology
    title: Company Milestones
    body: >
      MoMo's growth spans four distinct phases: the founding era (2007–2013) when M_Service built
      SIM-based payment rails; the smartphone pivot (2014–2018) when the app launched and early
      funding set up market expansion; the super-app build-out (2019–2021) when three funding rounds
      totalling $400M funded product diversification and unicorn status was reached; and the
      profitability and capital-markets phase (2022–2026) when MoMo turned profitable and began
      exploring new capital at a maintained $2B+ valuation. Regulatory milestones include PCI DSS
      v4.0 certification in 2023 (first Vietnamese fintech to achieve this) and MoMo's deployment
      of iProov Dynamic Liveness biometric authentication in compliance with SBV Decision 2345.
      The April 2026 investor exploration through Jefferies and Morgan Stanley is the most recent
      headline event, signalling management's intent to realize value and fund continued growth.
    claimRefs:
      - CO022
      - CO023
      - CO046
      - CO028
      - CO034
    tableRefs:
      - TO004

