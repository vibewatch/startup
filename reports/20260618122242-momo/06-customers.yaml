chapter:
  number: 6
  title: Customers
  summary: 'MoMo’s customer story is strongest on breadth and embedded-finance expansion: public sources support 30M+ registered users, 5.5B Q1 2025 transactions, and live proof with CGV, FWD, CVS, and KFC. The main diligence weakness is durability rather than reach—exact MAU, churn, NRR/GRR, and concentration are undisclosed, while late-2024 survey data show bank apps gaining ground and new biometric rules adding 2026 onboarding friction.'
