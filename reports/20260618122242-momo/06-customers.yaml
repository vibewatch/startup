sections:
- id: customer-segmentation
  title: Customer segmentation by buyer, user, payer, geography, and vertical
  body: 'MoMo’s customer map is two-sided but still clearly consumer-led. The primary user is an individual Vietnamese consumer who downloads the app, links a bank account or funding source, and uses the app for daily money jobs such as transfers, bills, top-ups, tickets, travel, and QR purchases. The payer, however, is not always that same consumer. Merchant chains, brands, insurers, brokers, and other embedded-finance partners often underwrite acceptance, distribution, or product economics, while banks remain the funding rails that let MoMo stay relevant even in a highly banked market. Public evidence also points to a broad but not fully nationalized footprint: Vietnam’s digital addressable base is already huge, yet fintech value remains concentrated in the south around Ho Chi Minh City, leaving northern, central, and Mekong corridors as expansion whitespace. Demographically, the addressable market is mass-market rather than niche, with roughly 40% of the population in the 18-44 band and
    more than four-fifths already online. Vertically, the strongest public proof clusters around everyday consumer spend and embedded finance—cinema, insurance, stocks, convenience retail, food-service, and merchant mini-app tooling—rather than large disclosed enterprise contracts.'
  claimRefs:
  - CU005
  - CU006
  - CU008
  - CU009
  - CU010
  - CU011
  - CU023
  - CU024
  - CU034
  - CU039
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory
  title: Adoption trajectory and usage breadth
  body: 'The most durable adoption signal is scale, not perfect disclosure. Reuters-reported 2026 materials say MoMo serves more than 30 million users, while earlier independent reporting put the figure at more than 31 million registered users. The October 2024 MoMo executive interview adds the most concrete breadth statistics we found: over 50,000 businesses, more than 70 banks and financial institutions, and about 300,000 payment acceptance points. Usage intensity is also meaningful. Mission Media and Digital in Asia both cite 5.5 billion transactions in Q1 2025 alone, which is far too large to support a “dormant-logo user base only” thesis. That said, adoption should be read with care. Public materials are much stronger on registered users and transaction counts than on active users or cohort behavior. The result is a large installed base with incomplete denominators: we can see scale, breadth, and continued product expansion into small businesses, but we cannot precisely bridge those
    numbers into MAU, transacting-user share, or repeat frequency by segment.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU012
  - CU013
  - CU026
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof
  title: 'Named customer proof: strongest where live surfaces exist'
  body: 'MoMo’s best customer proof is not a glossy logo page; it is live transactional surface area. CGV is the cleanest example: MoMo exposes direct ticket booking and lists 91 CGV locations on the current page, which is hard evidence of a live production integration. FWD is similarly strong because the relationship is not just announced; both MoMo and FWD still show an operating premium-payment flow that requires policy identifiers and therefore looks like a real recurring customer task, not a mere campaign. CVS goes even deeper by turning MoMo into a distribution and funding layer for brokerage accounts, with in-app account opening, funding, and later feature expansion such as margin and a new fund model. KFC is useful but weaker as payment proof: the Retail Technology Innovation Hub article shows deployment across 227 locations, but the disclosed use case is AI review management rather than checkout economics. Taken together, the proof set is real and nationally relevant, but it remains
    partial rather than exhaustive; MoMo still discloses far more about what can be done in-app than about which named customers drive the most revenue.'
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU036
  - CU037
  - CU040
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-durability
  title: 'Retention, repeat usage, and satisfaction: strong habit signals, weak formal disclosure'
  body: 'MoMo likely benefits from genuine habit loops, but public disclosure stops well short of the metrics investors would want. The app’s own surfaces and Google Play listing show repeat-use behaviors—friend transfers, bill payments, QR pay at offline merchants, and follow-on financial actions such as savings, loans, insurance, and investing. Support infrastructure is also visible, with service offices in Ho Chi Minh City, Hanoi, and Da Nang plus hotline, email, and self-help channels. However, there is still no public NRR, GRR, churn, renewal, contract-length, or exact MAU disclosure in the reviewed set. The best retention proxies are actually adverse ones: Decision Lab data cited by CafeF shows MoMo’s fintech-platform penetration and “most-used app” share both fell quarter over quarter in Q4 2024, while older users increasingly shifted to bank apps. That does not prove poor retention, but it does show that registered-user scale alone should not be mistaken for unambiguous stickiness.
    The right interpretation is that MoMo has many structural reasons to retain users, but not yet the public cohort evidence to prove how durable those habits are.'
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU032
  - CU033
  - CU041
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration
  title: 'Expansion and concentration: land-and-expand is visible, but concentration remains opaque'
  body: 'MoMo’s expansion logic is coherent. It acquires or reactivates a user through a low-friction daily payment job, then tries to move that user into higher-value behaviors such as insurance-premium payment, stock funding, savings, or loans. The same pattern applies on the partner side: MoMo is not only a wallet button, but also a merchant and brand surface with mini-app tooling and embedded-finance distribution. That said, three adverse constraints matter. First, core payments are maturing fast as bank apps improve, free transfers commoditize the transfer job, and QR becomes a standard rather than a moat. Second, Circular 41 makes new-user onboarding and compliance harder, especially for weaker operators and marginal cohorts. Third, concentration is still largely invisible. Public materials do not disclose top-customer concentration, channel concentration, or the share of economics coming from merchants versus financial partners. So the upside case is deeper monetization per user and
    regional expansion, but the underwriting gap is whether a few channels or partners already dominate that path.'
  claimRefs:
  - CU007
  - CU011
  - CU012
  - CU030
  - CU031
  - CU034
  - CU035
  - CU036
  - CU038
  - CU039
  - CU040
  tableRefs:
  - TU005
tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary jobs-to-be-done
  - Scale indicator
  - Geography / channel
  - Revenue / strategic value
  - Public gap
  rows:
  - - Mass-market consumers
    - Buyer=user=payer in the base wallet flow; funding often comes from linked banks or cards
    - P2P transfers, bills, top-ups, travel, tickets, QR merchant payments
    - '>30M users; 5.5B Q1 2025 transactions'
    - App-led, urban-first but national
    - Daily-frequency anchor for all cross-sell
    - No exact MAU, cohort retention, or transacting-user share disclosed
  - - SMEs and merchant chains
    - Merchant operator and cashier use the acceptance surface; end customer pays; merchant or brand funds acceptance or marketing
    - Accept QR payments, drive in-app conversion, use merchant or mini-app tooling
    - 50,000 businesses; ~300,000 acceptance points
    - Offline retail, services, food, entertainment
    - Expands checkout reach and merchant distribution
    - No disclosed active-merchant cohort, MDR, or merchant retention
  - - Embedded-finance partners
    - Insurer, broker, lender, or bank distributes products through MoMo; end user consumes the service
    - Premium collection, investing, savings, lending, settlement
    - 70+ banks and financial institutions; named FWD and CVS proof
    - In-app distribution plus linked-bank rails
    - Higher-value monetization beyond basic wallet use
    - Partner revenue share, renewal, and attach-rate data are undisclosed
  - - Brands and mini-app partners
    - Brand buyer; MoMo user is end user; brand funds engagement or distribution
    - Mini apps, promotions, loyalty, customer-service tooling
    - Developer SDK/API support; KFC 227-site AI deployment
    - Partner-led acquisition and re-engagement
    - Makes MoMo a distribution and engagement layer, not just checkout
    - Brand GMV, retention, and monetization are undisclosed
  notes: Rows synthesize company, partner, and independent sources; scale mixes registered users, merchant counts, and named partner proof rather than audited revenue segmentation.
