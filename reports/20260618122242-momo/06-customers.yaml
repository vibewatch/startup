evidenceGaps: &id005
- type: enumeration-incomplete
  severity: material
  topic: named-customer-roster
  missingEvidence: A complete attributable list of MoMo’s top merchants, partner brands, and embedded-finance customers with live status and commercial importance.
  whyItMatters: The chapter can prove selected live integrations, but it still cannot tell investors which named accounts actually matter most to usage, revenue, or concentration.
  diligencePath: Request the top 25 merchant and partner accounts by GMV, revenue contribution, active-user reach, and current contract status, with flags for pilot versus scaled production.
  relatedQuestionRefs:
  - QU010
  - QU024
  relatedTableRefs:
  - TU003
- type: private-evidence-only
  severity: material
  topic: retention-metrics
  missingEvidence: Exact MAU, transacting-user share, NRR, GRR, churn, renewal, and contract-length data by customer segment or module.
  whyItMatters: Without true cohort and retention metrics, registered-user scale and survey proxies cannot be converted into a durable recurring-revenue judgment.
  diligencePath: Request monthly transacting users, DAU/MAU, 90-day retention, repeat-payment cohorts, and merchant or partner renewal metrics for the last four completed quarters.
  relatedQuestionRefs:
  - QU007
  - QU015
  - QU016
  relatedTableRefs:
  - TU004
- type: private-evidence-only
  severity: material
  topic: concentration-and-economics
  missingEvidence: Top-customer concentration, top-partner concentration, channel mix, take rates, and attach rates for higher-value finance modules.
  whyItMatters: MoMo’s upside depends on whether deeper modules monetize broadly or are concentrated in a few partners or user cohorts that could unwind.
  diligencePath: Request top-10 customer, top-10 partner, and top-bank dependency tables plus revenue, GMV, and take-rate mix by payments, insurance, investing, and lending modules.
  relatedQuestionRefs:
  - QU021
  - QU022
  relatedTableRefs:
