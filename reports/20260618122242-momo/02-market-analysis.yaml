    severity: minor
    topic: rural-cash-persistence
    missingEvidence: A recent nationally representative split of rural versus urban cash usage and bank-app substitution behavior.
    whyItMatters: Public market notes repeatedly say cash persists outside major cities, but the precise remaining acquisition pool is still vague.
    diligencePath: Pull SBV, NAPAS, or bank-channel data that breaks payment mode by province or urbanicity.
