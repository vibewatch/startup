  rows:
  - - Urban consumers 18-45
    - Individual user
    - Same individual
    - Individual via linked bank account or wallet balance
    - Daily transfers, bills, top-ups, checkout
    - Household discretionary spend
    - Convenience, promotions, breadth of services
  - - Underbanked / thin-file consumers
    - Individual user
    - Same individual
    - Individual; sometimes cash-in origin
    - Entry-level payments and financial access
    - Household liquidity manager
    - Easy onboarding and perceived trust
  - - SME merchants
    - Owner / finance lead
    - Store staff and customers
    - Merchant business
    - Collections, QR acceptance, promotions
    - Owner or operations budget
    - Higher conversion or cheaper collections vs alternatives
  - - Financial institutions
    - Partner BD / product lead
    - End consumer through MoMo
    - Insurer, lender, fund manager
    - Distribution, CAC reduction, in-app conversion
    - Partner distribution / marketing budget
    - Access to MoMo user base and compliance-ready rails
  - - Cross-border / SME finance users
    - Business operator
    - Finance team or owner
    - Business or licensed partner
    - Settlement, working capital, treasury
    - Owner / finance budget
    - Pain from FX, cash-flow gaps, or bank process friction
  notes: Buyer, user, and payer diverge by segment. MoMo monetizes most cleanly where the app controls both payment intent and a higher-value upstream distribution relationship.
