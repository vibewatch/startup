  - type: private-evidence-only
    severity: material
    topic: momo-som-proxy
    missingEvidence: Public GMV, take rate, active-wallet denominator, and revenue mix by payment versus financial-services distribution.
    whyItMatters: Without these inputs, public TAM and SAM numbers cannot be translated into a valuation-grade SOM bridge for MoMo.
    diligencePath: Request monthly TPV/GMV, take-rate bridge, MAU, and cohort retention from management or investors.
    relatedQuestionRefs:
