- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Type
  - Timing
  - Implication for MoMo
  - Diligence ask
  rows:
  - - Cashless-policy push and national QR rollout
    - Driver
    - Now through 2030
    - Expands non-cash habits but benefits all scaled players
    - Confirm where MoMo still has a proprietary distribution edge
  - - 43.4% non-cash volume growth and 128.15% QR value growth
    - Driver
    - 2025-2026
    - Supports higher transaction frequency and merchant normalization
    - Check whether MoMo monetizes growth or only processes it
  - - High bank-account and digital-bank penetration
    - Mixed
    - Current
    - Reduces behavior-change cost but weakens pure-wallet differentiation
    - Test retention when users can do the same job in a bank app
  - - Free bank transfers and universal VietQR
    - Constraint
    - Current
    - Compresses switching costs and shifts value toward services
    - Measure take-rate resilience versus bank-led alternatives
  - - Circular 41 biometric and KYC requirements
    - Constraint
    - From Jan 2026
    - Raises onboarding friction and compliance cost while favoring scaled incumbents
    - Request onboarding funnel conversion before and after Jan 2026
  - - Fraud and trust concerns
    - Constraint
    - Current
    - Can slow usage and raise prevention spend
    - Request fraud-loss, warning, and false-positive metrics
  - - SME credit gap and business-finance demand
    - Driver
    - 2026 onward
    - Creates new adjacency beyond consumer checkout
    - Assess MoMo distribution economics with lenders and insurers
  - - Competitive scale at ZaloPay, VNPay, ViettelPay
    - Constraint
    - Current
    - Prevents easy share expansion and keeps subsidy pressure alive
    - Compare CAC, MAU frequency, and merchant concentration across players
  notes: Drivers and constraints are paired because several tailwinds for category adoption also reduce the value of simple wallet rails. The key diligence question is where MoMo still captures differentiated economics.
