- id: buyer-segmentation
  title: Buyer and User Segmentation
  body: 'MoMo''s user base is not a single buyer class. The core consumer layer is urban and semi-urban smartphone users who make frequent low-ticket decisions based on convenience, promotions, and breadth of everyday services. The merchant layer is different: SMEs decide whether the app increases conversion, marketing reach, or collections efficiency relative to free bank transfers and bank-app QR. A third payer layer sits upstream: insurers, lenders, wealth managers, and other financial institutions pay for distribution because MoMo aggregates user attention and compliant payment rails. The underbanked or thin-file segment remains strategically important even in a country where bank-account penetration has risen sharply; it is smaller than in MoMo''s early years, but still large enough to matter for inclusion-led products. Multi-homing is also crucial. Vietnamese users routinely keep several super apps and wallets alive at once, which means share is more about frequency and habit than
    about exclusivity. Rival scale at ZaloPay proves this segmentation remains contested even if MoMo leads headline awareness.'
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
  - CM036
  - CM037
  - CM038
