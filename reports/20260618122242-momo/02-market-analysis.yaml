  claims:
  - id: CM001
    statement: 'MoMo''s relevant market is broader than stored-value wallets: it includes consumer transfers, bill pay, merchant QR checkout, and financial-service distribution inside one app rather than all fintech revenue in Vietnam.'
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM005
    - SM017
    - SM018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM001
  - id: CM002
    statement: The market boundary for this chapter excludes cash-only transactions, standalone bank-account balances, pure card issuing/acquiring economics, and non-payment fintech verticals whose monetization does not depend on MoMo distribution.
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM001
    - SM002
    - SM018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM002
  - id: CM003
    statement: Status-quo substitutes for MoMo are cash, bank-app transfers over NAPAS 247, bank-app QR payments over VietQR, and card payments at merchants that do not require a wallet relationship.
    type: third-party-reported
    topic: substitutes
    sourceRefs:
    - SM001
    - SM002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM003
  - id: CM004
    statement: Because VietQR and NAPAS 247 are increasingly interoperable across banks and wallets, acceptance is becoming rail-level infrastructure while competition shifts toward user experience, merchant distribution, and attached financial services.
    type: inferred
    topic: market-structure
    sourceRefs:
    - SM002
    - SM006
    - SM019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM004
  - id: CM005
    statement: Multiple independent market commentaries describe Vietnam consumer wallets as a mature or saturated battleground, with the next leg of fintech growth moving toward SME finance and cross-border infrastructure.
    type: third-party-reported
    topic: market-maturity
    sourceRefs:
    - SM011
    - SM012
    - SM019
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM004
    - QM023
  - id: CM006
    statement: MoMo publicly positions itself as a “financial assistant with AI” rather than a single-purpose wallet, which widens the addressable product set from payments into saving, lending, insurance, and financial guidance.
    type: company-claimed
    topic: market-boundary
    sourceRefs:
    - SM005
    - SM017
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QM001
    - QM009
  - id: CM007
    statement: 'A reasonable top-down TAM anchor for MoMo is Vietnam''s digital-payments flow base: the Bain/Google/Temasek e-Conomy lens implies roughly $150B of digital payment value in 2024 and a path to $300-400B by 2030, which is much larger than published broad-fintech revenue estimates.'
    type: estimated
    topic: market-size
    sourceRefs:
    - SM026
    - SM027
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM005
  - id: CM008
    statement: 'Vietnam''s payments base is still growing quickly: Mission Media cites 43.4% year-on-year growth in non-cash transaction volume and a 128.15% rise in QR-code payment value in 2025.'
    type: third-party-reported
    topic: adoption
    sourceRefs:
    - SM011
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM017
  - id: CM009
    statement: Using the payment-flow lens, a defensible 2024-2026 SAM for mobile wallets is roughly $40-60B, or a minority slice of total digital payments where consumer and merchant wallet behavior is observable rather than assuming MoMo can monetize all fintech spend.
    type: estimated
    topic: market-size
    sourceRefs:
    - SM001
    - SM009
    - SM013
    - SM026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM006
  - id: CM010
    statement: MoMo's present SOM is better expressed through realized scale proxies such as roughly $482M of 2024 revenue and 30M-plus users because public sources do not disclose the company's wallet GMV, take rate, or active-wallet transaction denominator.
    type: estimated
    topic: market-size
    sourceRefs:
    - SM005
    - SM013
    - SM025
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM007
  - id: CM011
    statement: 'Published Vietnam fintech market estimates conflict sharply: Digital in Asia cites $3.42B in 2025 growing to $7.78B by 2030, Mission Media cites $4.33B in 2026 growing to $8.85B by 2031, and a separate Mission Media SME article cites $19.8B in 2025 growing to $60.4B by 2032.'
    type: conflicting
    topic: market-size
    sourceRefs:
    - SM011
    - SM012
    - SM013
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM008
    contradictsClaimRefs:
    - CM012
  - id: CM012
    statement: 'The most likely reason those fintech estimates diverge is market-boundary definition: some publishers appear to measure broad fintech revenues, others count transaction value or include SME finance, wealth, and infrastructure layers beyond consumer wallets.'
    type: inferred
    topic: market-size
    sourceRefs:
    - SM011
