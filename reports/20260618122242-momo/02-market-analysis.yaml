- id: market-gaps
  title: Sizing and Data Gaps
  body: 'The main analytical risk in this market is false precision. Public sources are plentiful, but they often describe different denominators, different years, and different market boundaries while using the same loose labels such as “wallet share” or “fintech market size.” That creates a temptation to average incompatible numbers. For MoMo specifically, the largest remaining blind spot is monetization quality: there is no public GMV series, no disclosed take rate, and no active-user cohort disclosure that would let an investor translate consumer-payment flows into a dependable revenue bridge. Regional data are also weak. Most public commentary focuses on Ho Chi Minh City and Hanoi, yet the real question for future acquisition efficiency is what remains underpenetrated outside those hubs and whether rural cash behavior is structurally persistent or just under-measured. The chapter therefore keeps contradictory estimates visible, uses revenue as the cleanest public SOM proxy, and records
    the missing private inputs required for a more precise valuation-grade market model.'
  claimRefs:
  - CM031
  - CM032
  - CM033
  - CM034
  - CM035
tables:
- id: TM001
  title: Market definition table
  columns:
  - Category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters for MoMo
  rows:
  - - Consumer payments
    - P2P transfers, bill pay, phone top-ups, in-app checkout
    - Offline cash that never digitizes
    - Consumer user; merchant or biller receives
    - Core daily-frequency behavior that keeps MoMo top-of-mind
  - - Merchant acceptance
    - Wallet-funded QR checkout, merchant collections, marketing-linked payments
    - Standalone POS acquiring or card interchange not routed through MoMo
    - Merchant budget owner; consumer user
    - Determines whether MoMo converts traffic into merchant economics
  - - Financial distribution
    - Insurance, lending, savings, investment products sold or triggered in-app
    - Off-platform financial balances not sourced by MoMo
    - Financial institution payer; consumer user
    - Higher-margin layer that matters more as transfer rails commoditize
  - - Cross-border / SME adjacencies
    - SME settlement, treasury, remittance-linked use cases
    - Institutional FX or banking revenue with no MoMo role
    - Business payer; regulated partner
    - Defines upside beyond saturated consumer wallet growth
  - - Status-quo substitutes
    - Bank-app transfers, bank-app QR, cards, cash
    - N/A
    - Consumers and merchants choose among substitutes
    - Explains why wallet share does not equal full control of payment behavior
  notes: Boundary uses product and monetization logic rather than one publisher market definition. Included rows describe spend or workflow where MoMo can influence initiation, conversion, or financial distribution.
