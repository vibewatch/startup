  - type: private-evidence-only
    severity: material
    topic: merchant-segmentation-depth
    missingEvidence: Merchant count split by enterprise size, vertical, active acceptance rate, and revenue contribution.
    whyItMatters: The disclosed partner totals show footprint but not where MoMo still has easy share gains or profitable merchant concentration.
    diligencePath: Ask for merchant cohort data by SME versus enterprise, QR-only versus service-bundled, and monthly active merchants.
