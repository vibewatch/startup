company:
  name: MoMo
chapter:
  number: 2
  title: Market Analysis
  summary: MoMo operates inside a large and still-growing Vietnam cashless-payments market, but the easy wallet-rail advantage has narrowed as bank transfers become free and VietQR standardizes acceptance. The best public sizing view layers a broad digital-payments TAM over a narrower wallet-flow SAM and treats MoMo's disclosed revenue as the cleanest SOM proxy, while preserving contradictory public fintech estimates and open data gaps around GMV, merchant quality, and regional adoption.
sections:
- id: market-boundary
  title: Market Definition and Boundary
  body: 'MoMo should be analysed inside Vietnam''s digital-payments and financial-distribution stack, not inside every headline number attached to “fintech.” The relevant included spend is recurring consumer money movement and commerce that can be initiated, settled, or cross-sold inside the app: peer-to-peer transfers, bill payments, merchant QR checkout, top-ups, installment repayment, and distribution of savings, insurance, lending, or investment products. The right exclusion list is equally important. Cash that never touches a digital interface, standalone card economics, pure banking deposits, and unrelated fintech verticals such as infrastructure software or crypto trading may influence the ecosystem but they do not translate directly into MoMo revenue. VietQR and NAPAS also matter because they flatten the acceptance layer: a merchant that can take standardized QR becomes reachable by many bank apps and wallets. That makes wallet differentiation less about proprietary acceptance and
    more about user habit, trust, merchant coverage, cross-sell, and financial-assistant positioning.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM039
  tableRefs:
  - TM001
- id: market-sizing
  title: 'Market Sizing: TAM, SAM, and SOM'
  body: 'The cleanest top-down anchor is digital-payment flow, not a generic “fintech market” revenue number. Bain/Google/Temasek provide the broadest lens for Vietnam''s digital-payments trajectory, while local market writeups provide lower-level evidence on wallet share, QR expansion, and user behavior. The evidence supports a layered view: a large national digital-payments TAM, a narrower mobile-wallet SAM that excludes card and bank-led flows MoMo cannot fully monetize, and a SOM best proxied by MoMo''s realized revenue and user scale because public GMV and take-rate data are missing. Contradictions should be preserved rather than averaged away. Public fintech estimates differ by more than an order of magnitude depending on whether the publisher means transaction value, sector revenue, or a bundle that includes lending and SME infrastructure. That matters because a loose market-size shortcut can make MoMo look either capped or massively underpenetrated. The chapter therefore keeps both
    the broad TAM lens and the contradictory fintech-estimate range visible, while treating precise monetization conversion as an explicit evidence gap.'
  claimRefs:
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM031
  - CM032
  - CM033
