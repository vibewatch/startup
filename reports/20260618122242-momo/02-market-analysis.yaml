    - SM013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM008
    - QM009
  - id: CM013
    statement: MoMo share data must be time- and metric-qualified because sources cite about 56% share in early 2025, nearly half of total e-wallet transactions on a public-service metric, and 68% share in a 2023 Connected Consumer usage survey.
