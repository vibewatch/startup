      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The same forces that expand Vietnam's cashless economy also compress simple wallet economics. Structural
              tailwinds are clear: policy support for non-cash payments, national QR standardization, cheap mobile
              connectivity, high smartphone adoption, and a young consumer base that is comfortable transacting inside
              super apps. Those drivers support continued growth in transaction frequency and in the use of wallets as
              distribution channels for adjacent financial services. But maturation changes what growth is worth. When
              bank transfers become free and bank apps can ride the same QR rails, a wallet cannot rely on “digital
              convenience” alone. The 2026 regulatory regime adds another layer of friction and protection. Circular 41
              raises compliance obligations around onboarding, biometrics, data retention, and transaction controls.
              Trust is another material constraint: scam losses are large enough that both regulators and platforms are
              shifting from reactive fraud blocking toward behavioral intervention. The result is a market where scale
              still matters, but profitable growth increasingly comes from adjacent merchant and SME workflows rather
              than subsidized consumer checkout.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
