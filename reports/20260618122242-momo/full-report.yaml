      - number: '1.4'
        title: Scale, Traction, and Key Metrics
        blocks:
          - type: paragraph
            body: >
              MoMo serves more than 30 million users as of April 2026 and processed 5.5 billion transactions in Q1 2025
              alone, reflecting the scale of Vietnam's cashless payment adoption. Revenue reached $482 million in 2024,
              up from $355 million in 2022, and 2024 marked the company's first full-year net profit after years of
              cash-burn-led growth. The company holds approximately 56% e-wallet market share in Vietnam with 69% active
              wallet penetration as of early 2025. MoMo's merchant network spans more than 140,000 acceptance points
              nationwide. The company employs approximately 2,300 people. Annual revenue per user in 2024 was
              approximately $16 based on $482M revenue and 30M+ users. The State Bank of Vietnam's broader cashless push
              has been a significant tailwind: non-cash transaction volumes grew 43.4% year-on-year, QR code payment
              values surged 128% in 2025, and 87% of Vietnamese adults now hold bank accounts.
