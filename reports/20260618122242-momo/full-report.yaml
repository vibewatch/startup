      - number: '3.2'
        title: 'Direct rival profiles: ZaloPay, VNPay/VNLife, Viettel Money, and ShopeePay'
        blocks:
          - type: paragraph
            body: >-
              ZaloPay is MoMo’s clearest direct rival because it combines consumer-wallet behavior with privileged
              distribution through Zalo. Saigon Times reports ZaloPay generated VND 1.11 trillion of 2025 revenue, up
              47% year on year, while its fintech segment remained loss-making at roughly VND 490 billion, implying VNG
              is still funding scale and learning rather than harvesting profit. The strategic point is distribution:
              public VNG reporting and Digital in Asia both show Zalo sits at national-scale reach, giving ZaloPay a
              cheaper way to re-activate users than a standalone wallet can. VNPay is different. Tech in Asia and
              Fintech News describe VNLife as a unicorn-scale parent that raised US$300 million in 2019 and more than
              US$250 million in 2021; its core asset is not a consumer super-app habit loop but bank-embedded QR and
              payment infrastructure. Viettel Money is smaller in urban wallet mindshare, yet its telco footprint,
              mobile-money layer, and 200,000 nationwide support points make it strategically important in rural and
              government-adjacent corridors. ShopeePay, meanwhile, is best understood as an adjacent commerce wallet:
              useful where Shopee traffic is already concentrated, but not yet the broad Vietnam finance destination
              that MoMo and ZaloPay aspire to be.
