            body: >-
              MoMo’s product-tech differentiation rests on two compounding assets: breadth and data. Breadth means the
              app can move a user from a simple pay or transfer intent into higher-value financial workflows without
              requiring a new login, new onboarding funnel, or new distribution channel. Data matters because those
