      - number: '1.3'
        title: Funding History, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >
              MoMo has raised approximately $434 million across five rounds. The Series C ($100M, January 2019, led by
              Warburg Pincus) funded expansion into broader financial services. The Series D ($100M, January 2021, led
              by Goodwater Capital and Warburg Pincus with Affirma Capital, Kora Management, Macquarie Capital, and
              Tybourne Capital Management) accelerated super-app development. The landmark Series E ($200M, December
              2021, led by Mizuho Bank with Ward Ferry Management, Goodwater Capital, and Kora Management) valued the
              company at over $2 billion and conferred unicorn status, making MoMo Vietnam's fourth unicorn. GetLatka
              data suggests the Series E valuation is approximately $2.3 billion. In April 2026, MoMo engaged investment
              banks Jefferies and Morgan Stanley to explore bringing in new investors at a reported valuation above $2
              billion, having received interest from both strategic and financial investors; deliberations are at an
              early stage and no transaction is certain. An IPO is not on the near-term agenda. No material secondary
              transactions or debt instruments are publicly disclosed.
