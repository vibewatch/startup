      - number: '7.5'
        title: People, execution, mitigations, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              MoMo is large enough that people risk is less about a thin bench and more about whether the organization
              can keep specialist talent and compliance capability aligned with a rapidly widening product set. Public
              sources show more than 2,000 employees, active founder visibility from Nguyen Manh Tuong, and a product
              stack spanning payments, lending, savings, investments, fraud defense, and partner-distributed services.
              That breadth is a strength, but it also increases execution load across legal, security, data, support,
              and partner operations. The public file does not give investors the internal metrics needed to underwrite
              residual people and execution risk with high confidence: there is no disclosed cloud failover
              architecture, no public lending-loss bridge, no regulator correspondence, and no detailed service-level
              reporting. The mitigation case therefore depends on diligence asks and kill criteria rather than optimism.
              Management should be able to evidence SBV-ready controls, data-transfer compliance, lending performance by
              partner, incident response discipline, and succession depth around the founder-led trust narrative. If
              those materials are weak or inconsistent, the risk rating should move up even if headline growth remains
              intact.
