      - number: '1.5'
        title: Company Milestones
        blocks:
          - type: paragraph
            body: >
              MoMo's growth spans four distinct phases: the founding era (2007–2013) when M_Service built SIM-based
              payment rails; the smartphone pivot (2014–2018) when the app launched and early funding set up market
              expansion; the super-app build-out (2019–2021) when three funding rounds totalling $400M funded product
              diversification and unicorn status was reached; and the profitability and capital-markets phase
              (2022–2026) when MoMo turned profitable and began exploring new capital at a maintained $2B+ valuation.
              Regulatory milestones include PCI DSS v4.0 certification in 2023 (first Vietnamese fintech to achieve
              this) and MoMo's deployment of iProov Dynamic Liveness biometric authentication in compliance with SBV
              Decision 2345. The April 2026 investor exploration through Jefferies and Morgan Stanley is the most recent
              headline event, signalling management's intent to realize value and fund continued growth.
