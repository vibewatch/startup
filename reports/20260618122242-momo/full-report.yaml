      - number: '4.2'
        title: Public traction, GTM proxies, and cost structure
        blocks:
          - type: paragraph
            body: >-
              Public traction is real but should not be over-read as unit economics. The strongest visible scale markers
              are 30-plus million users, roughly 31 million users at the time of the 2021 raise, and 5.5 billion Q1 2025
              transactions. Those data prove that MoMo has become a major payments and financial-distribution surface in
              Vietnam, and the simple revenue-per-user proxy of roughly $16 per year suggests meaningful monetization
              relative to a mass-market wallet. At the same time, these are still incomplete lenses. There is no public
              GMV, no disclosed active-user denominator, no ATV, no retained CAC or payback metric, and no reported
              blended take rate. Sales efficiency therefore remains inferential rather than measured.


              Cost structure is easier to describe directionally than numerically. MoMo is now investing in AI-led
              product development and fraud protection; iProov and Circular 41 show that biometric identity and
              anti-fraud controls are not optional. Vietdata's adverse category work is also important: it argues that
              the wallet penetration race drained money from market leaders through heavy marketing and low-quality
              competition. That aligns with MoMo's historical loss profile and with the logic of a super-app that spent
              years buying habit before reaching profitability. The likely cost stack is therefore technology,
              compliance, fraud tooling, partner integrations, staff, and still-material merchant or user incentives,
              even if the exact mix is private.
