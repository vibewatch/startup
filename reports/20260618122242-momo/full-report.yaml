      - number: '2.5'
        title: Sizing and Data Gaps
        blocks:
          - type: paragraph
            body: >-
              The main analytical risk in this market is false precision. Public sources are plentiful, but they often
              describe different denominators, different years, and different market boundaries while using the same
              loose labels such as “wallet share” or “fintech market size.” That creates a temptation to average
              incompatible numbers. For MoMo specifically, the largest remaining blind spot is monetization quality:
              there is no public GMV series, no disclosed take rate, and no active-user cohort disclosure that would let
              an investor translate consumer-payment flows into a dependable revenue bridge. Regional data are also
              weak. Most public commentary focuses on Ho Chi Minh City and Hanoi, yet the real question for future
              acquisition efficiency is what remains underpenetrated outside those hubs and whether rural cash behavior
              is structurally persistent or just under-measured. The chapter therefore keeps contradictory estimates
              visible, uses revenue as the cleanest public SOM proxy, and records the missing private inputs required
              for a more precise valuation-grade market model.
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct peers, incumbents, adjacents, substitutes, and the status quo'
        blocks:
          - type: paragraph
            body: >-
              MoMo competes in a much wider field than standalone wallet rankings suggest. The direct peer set remains
              ZaloPay, VNPay/VNLife, Viettel Money, and ShopeePay, but the stronger structural substitutes are bank
              super-apps, card overlays such as Apple Pay, and the consumer choice to simply keep using a salary-account
              banking app plus VietQR. The core change since Vietnam standardized QR acceptance is that payment
              acceptance is increasingly rail-level infrastructure rather than proprietary wallet real estate. KaadxPay
              describes VietQR as a unified merchant standard that works across participating banks and major wallets,
              while Indochine Counsel shows the regulator tightening onboarding and intermediary-payment controls under
              Circular 41. That means the “do nothing” option is credible for many consumers: keep the incumbent bank
              app, pay by free transfer or QR, and only open a wallet when promotions or bundled services justify it.
              Against that backdrop, MoMo still leads headline share, but the competitive question is no longer who can
              digitize payments first; it is who can own daily frequency, merchant distribution, and adjacent financial
              products once basic payment movement is commoditized.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
