  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >-
              MoMo should be analysed inside Vietnam's digital-payments and financial-distribution stack, not inside
              every headline number attached to “fintech.” The relevant included spend is recurring consumer money
              movement and commerce that can be initiated, settled, or cross-sold inside the app: peer-to-peer
              transfers, bill payments, merchant QR checkout, top-ups, installment repayment, and distribution of
              savings, insurance, lending, or investment products. The right exclusion list is equally important. Cash
              that never touches a digital interface, standalone card economics, pure banking deposits, and unrelated
              fintech verticals such as infrastructure software or crypto trading may influence the ecosystem but they
              do not translate directly into MoMo revenue. VietQR and NAPAS also matter because they flatten the
              acceptance layer: a merchant that can take standardized QR becomes reachable by many bank apps and
              wallets. That makes wallet differentiation less about proprietary acceptance and more about user habit,
              trust, merchant coverage, cross-sell, and financial-assistant positioning.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM039
