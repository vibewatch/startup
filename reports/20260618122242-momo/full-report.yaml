      - number: '4.3'
        title: Capital adequacy, financing history, and regulatory pressure
        blocks:
          - type: paragraph
            body: >-
              The best public capital anchor remains the December 2021 Series E. Vietnam News, Fintech News Singapore,
              VIR, and Mizuho all support the same core facts: MoMo raised $200 million, crossed the $2 billion
              valuation threshold, and said the money would deepen financial-services penetration, merchant expansion,
              ecosystem investment, and rural reach. Public summaries outside GetLatka usually place lifetime funding
              around $430 million to $434 million across five rounds, while GetLatka's $228 million figure appears to
              undercount the earlier history. That discrepancy should be preserved rather than averaged away.


              The 2026 picture is better on strategic optionality than on balance-sheet transparency. Reuters-syndicated
              reporting says management is exploring new investors at above a $2 billion valuation, but no deal is
              certain and no IPO is imminent. Profitability since 2024 likely lowers financing dependence versus MoMo's
              long investment phase, yet there is still no public disclosure of cash on hand, burn, runway, debt, or
              contingent obligations. Circular 41 also raises the ongoing cost and control burden through biometric
              onboarding, data retention, transaction limits, and restrictions around wallet balances. So the public
              record supports durability improving, but it does not support a solvency or runway conclusion.
