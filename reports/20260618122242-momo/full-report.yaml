      - number: '8.3'
        title: Financing context, dilution uncertainty, and valuation posture
        blocks:
          - type: paragraph
            body: |-
              Public financing facts are strongest at the 2021 round and weakest exactly where new investors care
              most today. The best-corroborated facts are straightforward: $200 million was raised in Series E,
              MoMo crossed the $2 billion valuation mark, and Mizuho took approximately 7.5% while positioning the
              company as a strategic digital-finance distribution asset. GetLatka's $2.3 billion estimate is the
              cleanest current numeric anchor, but it is still a third-party estimate rather than a disclosed cap-table
              mark. Broader public funding summaries suggest total capital raised around $430 million to $434 million,
              which is directionally important because it implies a meaningful existing preference stack even before a
              new round is considered.

              The key missing facts are all term-sheet facts: current cap table, liquidation preference structure,
              anti-dilution protections, whether the 2026 process is primary or secondary, and current cash / runway.
              Those omissions matter because MoMo only recently reached profitability after more than a decade of loss
              absorption and category subsidy. An investor paying >$2 billion without preference transparency could be
              underwriting a fair company at unattractive security terms. That is why the public valuation stance is
              fair rather than cheap.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV034
              - CV035
              - CV036
      - number: '8.4'
        title: Bull / base / bear cases and comparable triangulation
        blocks:
          - type: paragraph
            body: >-
              The scenario work is more informative than any single comp. In the bull case, MoMo compounds toward

              roughly $700 million revenue, sustains share above 55%, converts SME-finance adjacency into a higher-

              quality growth layer, and regains a premium multiple closer to the upper end of high-growth fintechs.

              That gets to about $3.2 billion to $3.5 billion. In the base case, revenue reaches roughly $550 million,

              share remains around 50%, and the company trades on a disciplined 4.5x to 5x revenue framework, giving

              about $2.3 billion to $2.5 billion. In the bear case, acquisition friction from Circular 41, bank-app

              substitution, and ZaloPay share gains compress growth and the multiple simultaneously, taking value down

              toward $1.4 billion to $1.6 billion.


              Comparables support direction but not precision. GCash at ~$5 billion for ~94 million users shows that

              scaled Southeast Asian wallets can still command premium private values. VNLife / VNPay at >$1 billion

              and Dana at ~$1.13 billion help frame the regional private set. Public comps are much larger and
              structurally

              different, but they still tell investors what the market pays for scaled fintech / super-app exposure:

              Sea and Nubank remain multi-tens-of-billions public companies, while Paytm sits in a single-digit-billion

              bracket. Together those comps support MoMo as a real unicorn, but not necessarily as a clear bargain above

              its 2021 mark.
