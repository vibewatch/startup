  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation by buyer, user, payer, geography, and vertical
        blocks:
          - type: paragraph
            body: >-
              MoMo’s customer map is two-sided but still clearly consumer-led. The primary user is an individual
              Vietnamese consumer who downloads the app, links a bank account or funding source, and uses the app for
              daily money jobs such as transfers, bills, top-ups, tickets, travel, and QR purchases. The payer, however,
              is not always that same consumer. Merchant chains, brands, insurers, brokers, and other embedded-finance
              partners often underwrite acceptance, distribution, or product economics, while banks remain the funding
              rails that let MoMo stay relevant even in a highly banked market. Public evidence also points to a broad
              but not fully nationalized footprint: Vietnam’s digital addressable base is already huge, yet fintech
              value remains concentrated in the south around Ho Chi Minh City, leaving northern, central, and Mekong
              corridors as expansion whitespace. Demographically, the addressable market is mass-market rather than
              niche, with roughly 40% of the population in the 18-44 band and more than four-fifths already online.
              Vertically, the strongest public proof clusters around everyday consumer spend and embedded
              finance—cinema, insurance, stocks, convenience retail, food-service, and merchant mini-app tooling—rather
              than large disclosed enterprise contracts.
