      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The right financial verdict is positive on business model breadth, moderate on monetization quality, and
              cautious on underwriteability. MoMo is no longer just a consumer wallet chasing subsidies. Its public
              surface now includes merchant solutions, financial-product distribution, installments, and AI-enabled
              engagement tools, and the move to profitability in 2024 is a meaningful proof point that the model can
              mature. In that sense, revenue quality is better than a pure fee-free P2P wallet would imply.


              The caution comes from what remains private. Revenue is still a third-party estimate, stream mix is not
              disclosed, margins are absent, loss provisions for partner-led credit products are unclear, and cash or
              runway data are unavailable. Adverse sources also matter: Vietdata and CafeF both argue that Vietnamese
              wallet economics have been pressured by heavy marketing and by banks offering similar digital utilities
              for free. Taken together, the public evidence supports a conclusion that MoMo has reached a healthier
              phase of the curve, but not a conclusion that investors can underwrite margin durability or balance-sheet
              sufficiency without a data room.
