      - number: '8.5'
        title: Exit readiness, thesis-breaks, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              MoMo's near-term exit menu looks narrower than its strategic value might suggest. The freshest public

              reporting says an IPO is not on the near-term agenda, which points investors toward strategic sale,

              structured secondary, or longer hold as the realistic 2026 to 2030 outcomes. A strategic buyer such as

              Mizuho, a regional bank, or a larger platform seeking payments and financial-distribution reach is easier

              to imagine than a near-term public listing. GCash is a helpful contrast: Globe's public investor-relations

              infrastructure already references Mynt disclosure activity, implying a more explicit path to
              listing-readiness

              than MoMo currently shows.


              That makes diligence discipline the decisive variable. The thesis breaks if MoMo loses wallet share faster

              than expected, if ZaloPay keeps compounding at current growth rates, if 2026 fundraising fails or arrives

              with punitive terms, if biometrics meaningfully slow onboarding, or if profitability proves to be a short

              cycle rather than a durable state. Before MoMo can move from watchlist to buy, management needs to show a

              current cap table, preference stack, audited FY2024-FY2025 financials, cohort-quality metrics, and the
              exact

              structure of the live investor process.
