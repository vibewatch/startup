      - number: '3.4'
        title: Switching costs, lock-in, multi-homing, and partner access
        blocks:
          - type: paragraph
            body: >-
              Public behavior data suggests switching costs are real but not very high at the payment layer. The
              Investor’s summary of Cimigo research says 90% of Vietnamese users multi-home across super apps for the
              same service and 56% regularly arbitrage cashback, discount codes, or loyalty points. That means payment
              frequency can move quickly when promotions, convenience, or embedded distribution change. MoMo still
              benefits from superior habit strength because Cimigo found it used 4.16 times per week, far ahead of
              ZaloPay’s 1.5 times. But VietQR and free bank transfers keep the underlying rails portable. Merchants can
              increasingly reach users through bank apps, wallet apps, or card overlays without committing to one
              exclusive acceptance standard. As a result, the genuine lock-in layer is not “can I pay?” but “what else
              sits behind the payment?” MoMo’s loans, savings, insurance, and investment distribution matter here;
              ZaloPay’s social-distribution wedge matters; VNPay’s bank and merchant integrations matter; and banks keep
              an economic edge wherever the primary account relationship remains with them.
