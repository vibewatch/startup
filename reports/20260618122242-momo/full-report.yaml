            body: >
              M_Service JSC is led by a core executive team with deep local fintech roots. Chairman Thomas Anthony
              Michael provides board-level oversight while CEO and Vice Chairman Nguyen Manh Tuong co-founded the
              company and has led it since inception. President Do Quang Thuan handles operational management.
              Co-founder Nguyen Ba Diep serves as Senior Vice President for Government, Public Affairs and Legal,
              playing a key role in regulatory relationships. CFO Manisha Shah oversees financial strategy. The
              leadership structure has been notably stable, with the founding duo of Tuong and Diep still occupying
              senior executive roles more than 15 years after founding. Key-person risk is concentrated in Nguyen Manh
