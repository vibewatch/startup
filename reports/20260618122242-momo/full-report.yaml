      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >-
              The cleanest top-down anchor is digital-payment flow, not a generic “fintech market” revenue number.
              Bain/Google/Temasek provide the broadest lens for Vietnam's digital-payments trajectory, while local
              market writeups provide lower-level evidence on wallet share, QR expansion, and user behavior. The
              evidence supports a layered view: a large national digital-payments TAM, a narrower mobile-wallet SAM that
              excludes card and bank-led flows MoMo cannot fully monetize, and a SOM best proxied by MoMo's realized
              revenue and user scale because public GMV and take-rate data are missing. Contradictions should be
              preserved rather than averaged away. Public fintech estimates differ by more than an order of magnitude
              depending on whether the publisher means transaction value, sector revenue, or a bundle that includes
              lending and SME infrastructure. That matters because a loose market-size shortcut can make MoMo look
              either capped or massively underpenetrated. The chapter therefore keeps both the broad TAM lens and the
              contradictory fintech-estimate range visible, while treating precise monetization conversion as an
              explicit evidence gap.
            claimRefs:
              - CM007
