            body: >-
              MoMo’s expansion logic is coherent. It acquires or reactivates a user through a low-friction daily payment
              job, then tries to move that user into higher-value behaviors such as insurance-premium payment, stock
              funding, savings, or loans. The same pattern applies on the partner side: MoMo is not only a wallet
              button, but also a merchant and brand surface with mini-app tooling and embedded-finance distribution.
              That said, three adverse constraints matter. First, core payments are maturing fast as bank apps improve,
              free transfers commoditize the transfer job, and QR becomes a standard rather than a moat. Second,
              Circular 41 makes new-user onboarding and compliance harder, especially for weaker operators and marginal
              cohorts. Third, concentration is still largely invisible. Public materials do not disclose top-customer
              concentration, channel concentration, or the share of economics coming from merchants versus financial
              partners. So the upside case is deeper monetization per user and regional expansion, but the underwriting
