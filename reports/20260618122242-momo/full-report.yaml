      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The legal perimeter around Vietnamese wallets is tightening in ways that directly affect MoMo's growth
              model. Circular 41 requires in-person biometric verification for new wallet openings from 1 January 2026,
              prohibits cash deposit and withdrawal at provider locations, and requires tighter review of legitimate
              funding sources plus suspicious-wallet reporting to the State Bank. Those obligations are manageable for a
              scaled incumbent, but they still add onboarding friction, staffing cost, audit burden, and more points of
              failure when identity checks or linked-bank flows misfire. The compliance load rises further because
              Vietnam remains under FATF increased monitoring and because the 2025 Personal Data Protection Law and
              related cybersecurity framework add cross-border transfer assessments, logging, localization,
              incident-reporting, and potentially severe revenue-based fines. For MoMo specifically, the risk is
              amplified by the amount of sensitive data visible in its consumer apps and by the fact that the CIC breach
              showed even state-linked financial data infrastructure can fail at massive scale. Public evidence does not
              show that MoMo is out of compliance; the issue is that the penalty and trust consequences of failure have
              become more severe.
            claimRefs:
