      - number: '3.3'
        title: 'Incumbents and adjacents: bank super-apps, Apple Pay, and pricing posture'
        blocks:
          - type: paragraph
            body: >-
              The most serious non-wallet pressure comes from incumbent banks. VPBank NEO openly markets free QR
              transfers, instant onboarding, online savings, and digital credit-card origination, while Techcombank’s
              SME workflow shows how a bank can fuse payments and credit with two-minute applications and five-minute
              preliminary approvals. FiinGroup says Techcombank’s micro-SME and small-commercial lending grew nearly 97%
              year on year, which matters because banks can monetize customer relationships through deposits, lending
              spread, and cards in ways e-wallets cannot. Apple Pay is a thinner competitor, but it still matters
              because it makes bank-card credentials easier to use at offline and online merchants without requiring a
              full wallet relationship. Public pricing disclosure also favors incumbents. Banks and Apple can clearly
              tell users that transfers or wallet use are free, while wallet merchant pricing is usually handled through
              sales contracts and not posted publicly. That opacity does not block adoption, but it makes it harder for
              an outsider to prove a durable economic advantage from payments alone.
            claimRefs:
