      - number: '6.4'
        title: 'Retention, repeat usage, and satisfaction: strong habit signals, weak formal disclosure'
        blocks:
          - type: paragraph
            body: >-
              MoMo likely benefits from genuine habit loops, but public disclosure stops well short of the metrics
              investors would want. The app’s own surfaces and Google Play listing show repeat-use behaviors—friend
              transfers, bill payments, QR pay at offline merchants, and follow-on financial actions such as savings,
              loans, insurance, and investing. Support infrastructure is also visible, with service offices in Ho Chi
              Minh City, Hanoi, and Da Nang plus hotline, email, and self-help channels. However, there is still no
              public NRR, GRR, churn, renewal, contract-length, or exact MAU disclosure in the reviewed set. The best
              retention proxies are actually adverse ones: Decision Lab data cited by CafeF shows MoMo’s
              fintech-platform penetration and “most-used app” share both fell quarter over quarter in Q4 2024, while
              older users increasingly shifted to bank apps. That does not prove poor retention, but it does show that
              registered-user scale alone should not be mistaken for unambiguous stickiness. The right interpretation is
              that MoMo has many structural reasons to retain users, but not yet the public cohort evidence to prove how
              durable those habits are.
