chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >
              MoMo is operated by M_Service Joint Stock Company, incorporated in Ho Chi Minh City, Vietnam in 2007. The
              MoMo electronic wallet brand was officially launched in October 2010 as Vietnam's first SIM-card-based
              mobile wallet, then transitioned to a smartphone app in 2014 as the super-app model took shape. The
              company's legal name is M_Service JSC and it is headquartered in Ho Chi Minh City. MoMo describes itself
              as Vietnam's leading mobile wallet and financial super-app, offering payments, peer-to-peer transfers,
              bill payments, QR payments, consumer lending, savings, insurance, investment, gaming top-ups, food
              ordering, and merchant tools through a single application. The business model derives revenue primarily
              from merchant discount rates (MDR) of 0.5%–2.0% on payments, commissions on financial product distribution
              (insurance, loans, investment funds), and advertising and promotional placement fees from partner brands.
              MoMo positioned itself from the outset as a financial-inclusion vehicle for Vietnam's large unbanked and
              under-banked population. Its core value proposition is one-app access to financial services for 30+
              million users, over 140,000 merchant acceptance points, and partnerships with more than 50 banks.
