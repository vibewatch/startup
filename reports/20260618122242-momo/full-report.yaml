  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking, transmission, and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              MoMo's downside is best understood as a transmission problem rather than a single binary event. The
              company remains the market leader and has been profitable since 2024, but its operating model sits at the
              intersection of payments regulation, mass-market fraud, partner-bank underwriting, cloud-hosted
              decisioning, and constant competition from bank apps and VietQR. That means a regulatory tightening can
              slow acquisition, a privacy or cyber failure can erode trust, and a partner or infrastructure issue can
              spill quickly into revenue, margin, and fundraising. The public record supports four top-tier residual
              risks: compliance friction from Circular 41 and the new data framework, systemic fraud and privacy
              exposure, dependence on banks and Google Cloud for core service delivery, and economics pressure from
              bank-app substitution plus limited proof that recent profitability is durable. The thesis breaks if MoMo
              loses or materially impairs its SBV permissions, if a major cyber or privacy incident destroys user trust,
              if partner-driven lending economics deteriorate sharply, or if competition pushes the wallet back into
              sustained subsidy-led growth.
            claimRefs:
