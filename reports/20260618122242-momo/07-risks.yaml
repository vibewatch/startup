- id: partner-dependency-and-model-risk
  title: Partner, dependency, and model risk
  body: 'MoMo''s business does not operate as a closed loop. Its payments reach depends on linked bank accounts, card networks, merchant acceptance partners, and ecosystem integrations; its lending adjacency depends on external funders and bank partners; and its AI and data workloads visibly depend on Google Cloud infrastructure. Mizuho''s disclosures are especially revealing: the bank owns an approximately 7.5% stake, frames MoMo as a strategic distribution asset, and says Vietcombank conducts credit screening and lending decisions using MoMo''s scoring model because MoMo itself lacks the lending license. That structure lowers balance-sheet intensity for MoMo, but it also means underwriting economics, service continuity, and monetization are shared with counterparties whose incentives may diverge. Competitive pressure compounds that dependence. Bank apps and VietQR are eroding the feature gap for basic transfers, Moca''s exit showed the market can consolidate abruptly, and public profitability
    evidence is still young enough that investors cannot assume the current model is structurally self-funding. If partner banks reprice, if Google Cloud resilience disappoints, or if fundraising fails to close on acceptable terms, MoMo''s valuation and growth rate would be vulnerable.'
