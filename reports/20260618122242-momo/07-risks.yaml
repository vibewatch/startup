- id: operational-cybersecurity-and-service-risk
  title: Operational, cybersecurity, and service-quality risk
  body: 'Operationally, MoMo runs a very large and fraud-heavy consumer surface. Vietnam''s cyber-loss and scam statistics are severe, and current scams increasingly rely on psychological manipulation rather than direct system compromise, which makes trust protection harder than simply blocking malicious traffic. MoMo has deployed real mitigations—dynamic liveness with iProov, AI-based fraud screening, and company-reported abnormal-transaction warnings—but the same sources show why those controls are necessary: the attack surface is growing and the financial sector is a preferred target. The company also carries privacy and reliability exposure because it collects and links broad personal-data categories and because critical AI functions such as eKYC, recommendation, and decisioning are cloud hosted. If biometric verification yields false positives, if a data incident forces customer notification, or if a cloud or model-serving failure interrupts onboarding or payments, the commercial impact
    would likely appear first as user friction, support cost, and reputation loss rather than immediate legal collapse. Public app-store evidence shows the user base is large enough that service issues would surface quickly.'
