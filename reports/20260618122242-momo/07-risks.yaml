  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register
    missingEvidence: Complete SBV correspondence, license amendment history, private litigation, and unpublished enforcement interactions touching MoMo’s wallet, lending-adjacent, and data-processing activities.
    whyItMatters: The public register captures the most visible legal risks but cannot prove whether MoMo has hidden remediation items or narrow license-scope disputes.
    diligencePath: Request current licenses, external legal memo, regulator audit findings, and management certifications covering Circular 41, PDPL, AML, and incident reporting.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: lending-loss-rates
    missingEvidence: Vintage-level approval, NPL, charge-off, fraud-loss, and partner take-rate data for MoMo-routed lending products.
    whyItMatters: Without partner-lending performance data, investors cannot judge whether the wallet’s financial-services upside is attractive or merely headline growth masking weak credit economics.
    diligencePath: Request monthly cohort packs from each lending partner, loss waterfalls, underwriting overrides, and risk-sharing mechanics.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: resilience-and-cloud-bcp
    missingEvidence: Historical incident log, postmortems, RTO/RPO targets, failover design, and third-party assurance over cloud and identity infrastructure resilience.
    whyItMatters: Public proof of scale does not substitute for evidence that MoMo can keep payments, onboarding, and fraud controls available through infrastructure shocks.
    diligencePath: Request SRE dashboards, incident-review samples, business continuity test records, and architecture review focused on Google Cloud concentration.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: material
    topic: cross-border-data-architecture
    missingEvidence: Jurisdiction-by-jurisdiction data-flow diagram, localization exceptions, transfer-impact assessments, and evidence that app-store disclosed data categories map cleanly to PDPL filings.
    whyItMatters: MoMo’s privacy and security burden is large enough that unclear storage and transfer design could become both a compliance and trust problem under the new framework.
    diligencePath: Request the data inventory, transfer registers, vendor list, and most recent internal or external PDPL readiness assessment.
    relatedQuestionRefs:
    - QR028
