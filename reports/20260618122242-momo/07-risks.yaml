- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - SBV / privacy compliance failure
    - Regulator notice, license amendment, or privacy enforcement action
    - Any formal SBV restriction on wallet operations or PDPL enforcement with material fines
    - Treat as thesis-break unless management can show rapid remediation and limited customer impact.
  - - Onboarding friction from biometric KYC
    - New-wallet conversion and manual-review queue
    - Sustained post-2026 conversion drop greater than 10 percentage points or review backlog above internal SLA
    - Cut growth assumptions and re-rate acquisition efficiency.
  - - Trust-damaging cyber or fraud event
    - Public incident, scam-loss spike, or breach disclosure
    - Major incident requiring user notification, prolonged transaction disruption, or visible user-flight signal
    - Move to defensive stance until incident governance and user-retention data are verified.
  - - Lending / fraud economics deterioration
    - NPL, fraud-loss, or partner-approval trend
    - Partner lenders tighten materially, fraud-loss rates spike, or take-rate support depends on higher subsidies
    - Re-underwrite financial-services upside and reduce valuation multiple.
  - - Competition and fee compression
    - Penetration / preference trends versus bank apps and ZaloPay
    - MoMo loses category leadership or repeated share declines coincide with lower monetization
    - Assume wallet moat is narrowing and prioritize platform-utility proof over user-count optics.
  - - Capital and dependency stress
    - Fundraise outcome or infrastructure incident
    - 2026 investor process fails with no credible alternative, or core cloud outage exposes lack of failover
    - Raise cost-of-capital and execution-risk assumptions; require contingency plan before new capital is committed.
  notes: These triggers are designed to convert public risk factors into monitorable underwriting checkpoints rather than vague caution statements.
