  topStrengths:
    - "#1 digital wallet in Vietnam with 56–60% market share and 30M+ registered users, providing durable network effect advantages"
    - "First profitable year in FY2024 ($482M estimated revenue) ends decade of losses and validates super-app economics"
    - "Broadest product suite in Vietnam fintech: payments, lending, savings, insurance, investment, e-commerce — creating data flywheel and switching costs"
    - "Compliance moat: PCI DSS v4.0 (2023, first Vietnamese fintech app) and iProov biometric deployment (2025) ahead of regulatory requirements"
    - "Strong institutional backing: Warburg Pincus, Goodwater Capital, Mizuho Bank, Goldman Sachs, Standard Chartered — with April 2026 investor exploration confirming $2B+ valuation floor"
  topRisks:
    - "ZaloPay competitive threat: leveraging Zalo's 77.8M MAU social graph could rapidly expand wallet user base at MoMo's expense"
    - "Circular 41/2025: mandatory in-person biometric KYC from January 2026 introduces friction for new user acquisition at a critical growth stage"
