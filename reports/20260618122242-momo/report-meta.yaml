companyProfile:
  summary: >
    MoMo (M_Service Joint Stock Company) is Vietnam's leading mobile e-wallet and fintech super-app, founded in 2007
    and launched publicly in 2010. Headquartered in Ho Chi Minh City, MoMo has grown from a simple mobile top-up
    service into a comprehensive financial platform serving 30M+ registered users across Vietnam. The platform processes
    over 5.5 billion transactions per quarter (Q1 2025) and achieved its first full-year profitability in FY2024,
    generating an estimated $482M in revenue. In April 2026, MoMo was reported to be exploring new investors at a
    valuation exceeding $2 billion, with advisors Jefferies and Morgan Stanley, confirming continued unicorn status.
  foundedDate: '2007-01-01'
  founders:
    - name: Nguyen Manh Tuong
      role: CEO and Co-founder
      background: Co-founded M_Service JSC in 2007; has led MoMo through five funding rounds to unicorn status and first profitability.
      claimRefs:
        - CO012
    - name: Nguyen Ba Diep
      role: Co-founder (Vice Chairperson / SVP)
      background: Co-founded M_Service JSC alongside CEO Nguyen Manh Tuong in 2007; remains in senior leadership.
      claimRefs:
        - CO013
  foundingLocation: Ho Chi Minh City, Vietnam
  headquarters: Ho Chi Minh City, Vietnam
  productSummary: >
    Mobile e-wallet and fintech super-app offering P2P payments, QR merchant payments, bill payments, telecoms
    top-ups, micro-lending, insurance distribution, savings, stock trading, gaming top-ups, food ordering, and
    travel booking — all within a single mobile application.
  customerFocus: >
    Primary: Vietnamese urban smartphone users aged 18–45. Secondary: SME merchants and B2B financial service
    distribution partners (banks, insurers, lenders, securities firms).
  businessModel: >
    Transaction fee revenue (MDR 0.5–2.0% on merchant payments), commission income from distributed financial products
    (insurance, lending, investment), advertising and promotional placement fees from brand partners, and
    international remittance fee income.
  stage: Series E (profitable since FY2024; exploring secondary/pre-IPO investor round in 2026)
  fundingStatus: "$200M Series E (Dec 2021, Mizuho Bank lead); total raised ~$434M; exploring new investors at >$2B valuation as of April 2026 via Jefferies + Morgan Stanley. No IPO announced."
