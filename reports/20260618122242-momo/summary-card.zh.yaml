  topStrengths:
    - '越南 #1 数字钱包，市场份额 56–60%，注册用户 30M+，网络效应优势较持久'
    - FY2024 首次全年盈利（估计收入 $482M），结束十年亏损，也验证了超级应用经济性
    - 越南 fintech 中产品套件最宽：支付、贷款、储蓄、保险、投资、电商——共同形成数据飞轮和切换成本
    - 合规护城河：PCI DSS v4.0（2023 年，越南首个 fintech app）和 iProov 生物识别部署（2025 年）走在监管要求前面
    - 机构背书强：Warburg Pincus、Goodwater Capital、Mizuho Bank、Goldman Sachs、Standard Chartered——2026 年 4 月投资者接触也确认 $2B+ 估值底线
  topRisks:
    - ZaloPay 竞争威胁：借助 Zalo 77.8M MAU 社交图谱，可能快速扩大钱包用户数并挤压 MoMo
    - Circular 41/2025：2026 年 1 月起强制线下生物识别 KYC，在关键增长阶段给新客获取增加摩擦
    - 银行竞争：国有和私营银行推出免费数字钱包，还能赚取存款利息，经济性更优，挑战独立钱包价值主张
    - 收入集中：高度依赖 MDR 交易费，容易受 VietQR 互联互通和银行零费率竞争冲击
    - 估值不确定：没有经审计财务；$482M 收入来自 GetLatka 估计；cap table、优先权结构和利润率未披露
  unresolvedGaps:
    - 经审计财务报表不可得——收入、毛利率、EBITDA 和现金余额未验证
    - Series E 后 cap table 和清算优先权结构未披露——经济一致性和下行保护未知
    - 活跃用户与注册用户比例未披露——30M 注册用户可能显著高估月活参与度
    - Series E 条款以及 Mizuho 约 7.5% 持股的经济权利未公开
    - 新投资者轮次（2026 年 4 月接触）尚未完成——交易价值、结构和稀释未知
    - MoMo 小额贷款组合的 NPL（不良贷款）比例未披露
