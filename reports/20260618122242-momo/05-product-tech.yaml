- id: architecture-and-delivery
  title: Architecture, deployment model, and critical dependencies
  body: 'The strongest public technical disclosure we found is MoMo’s 2022 engineering post on its lending decision engine, which likely understates the full 2026 platform but still reveals the company’s operating model. MoMo described a GCP-based microservice stack with gRPC and REST interfaces, BigTable and BigQuery for split real-time and historical workloads, batch jobs orchestrated with Airflow and Spark, and real-time flows carried through Pub/Sub or Kafka across a hybrid cloud and on-premise estate. Separate public partner evidence from NVIDIA adds that MoMo uses NVIDIA GPUs in Google Cloud for chatbots, eKYC, and recommendation engines, with Triton and TensorRT in production AI serving. Merchant documentation reinforces the same pattern on the commercial side: onboarding flows are API-first, credentials move from test to production, and M4B manages operational data and technical keys. In short, the disclosed stack looks like a platform business with shared data, integration, and
    risk rails rather than a single-purpose wallet application.'
