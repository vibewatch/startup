- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / framework
  - What public evidence shows
  - Status / timing
  - Scope implication
  - Remaining gap
  rows:
  - - SBV licensing and user-facing trust messaging
    - FAQ says MoMo is licensed and regulated by the State Bank of Vietnam
    - Current public message
    - Licensing is part of user trust and legal operation
    - Public chapter did not re-collect the primary license document itself
  - - Decision 2345 online-payment security
    - Decision requires stronger authentication, biometrics, FIDO methods, device binding, and logs
    - Effective 2024-07-01
    - Raises baseline for higher-risk online-payment flows
    - Implementation detail by use case is not public
  - - Dynamic Liveness biometrics
    - iProov rollout protects tens of millions of users against deepfake-style fraud
    - Rolled out by 2025
    - Adds stronger remote identity assurance
    - Public metrics on fraud reduction are not disclosed
  - - Circular 41 e-wallet controls
    - Circular 41 tightens opening, verification, retention, and risk-management duties
    - Key provisions from 2026-01-01
    - Raises ongoing compliance burden for wallet operations
    - Operational cost impact is not public
  - - PDPL 2025
    - PDPL adds finance-sector and AI/cloud obligations plus sanctions
    - Effective 2026-01-01
    - Expands privacy-by-design and transfer-assessment obligations
    - MoMo’s exact PDPL program is not public
  - - PCI DSS baseline
    - PCI DSS is the card-data control baseline for entities processing cardholder data
    - Ongoing framework
    - Important for any card-linked MoMo flow
    - No current public attestation artifact was re-fetched here
  - - FIDO2-capable vendor ecosystem
    - VinCSS and FIDO materials show certified passwordless infrastructure options
    - Current market capability
    - Relevant for phishing-resistant authentication paths
    - Direct MoMo deployment details were not publicly confirmed in reviewed sources
  - - Support operations
    - MoMo discloses in-app help, hotline, email, and physical service locations
    - Current
    - Support is part of trust and issue resolution
    - No public SLA for support response time found
  notes: This table mixes company disclosures, partner evidence, and legal frameworks to show trust controls; it does not imply that every framework listed is independently audited at the same evidence depth.
