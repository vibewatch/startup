company:
  name: MoMo
chapter:
  number: 5
  title: Product & Technology
  summary: MoMo’s product-tech moat comes from owning the daily payment workflow and then reusing the same identity, funding, QR, and data rails to distribute richer financial products. Public technical evidence is strongest around API-led merchant onboarding, a GCP-based lending and AI stack, and a visible 2025 biometric hardening push, while independently audited uptime, broader certification scope, and module-level economics remain less transparent.
sections:
- id: customer-workflow
  title: Customer workflow and module scope
  body: 'MoMo’s product definition is best understood as a workflow owner, not just a stored-value wallet. Its official surfaces describe a single consumer journey that starts with identity and linked funding, then handles day-to-day payment jobs such as transfers, bills, top-ups, ticketing, travel, and merchant QR. The same app then tries to capture the next financial decision: savings, stocks, credit-card activation, or investment allocation. That matters because MoMo’s differentiation is not one premium feature; it is the reuse of one front door, one payment surface, and one trust layer across many money tasks. Public evidence also shows the workflow is meant to stay interoperable with bank apps and cards rather than forcing a closed wallet loop. Universal receive QR, Visa-as-funding-source support, and multi-source payment flows all point to a strategy of owning the user interaction layer even when underlying funds come from banks, cards, or partner products.'
  claimRefs:
