tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user job
  - Publicly evidenced assets
  - Key dependencies
  - Public maturity
  - Differentiation angle
  - Diligence gap
  rows:
  - - Core wallet & linked funding
    - Store value, move money, pay everyday bills
    - Wallet, bank linking, bill pay, top-up, travel and ticket payments
    - Banks, cards, SBV licensing, app stores
    - Mature
    - Daily-frequency anchor for all other modules
    - No public take-rate disclosure by transaction type
  - - QR payments & receive QR
    - Pay or accept money across stores, peers, and informal commerce
    - Universal receive QR, merchant QR acceptance, Visa-funded QR payments
    - Merchant network, bank app interoperability, Visa/card rails
    - Mature
    - Interoperable rails reduce onboarding friction
    - Public acceptance metrics are directional, not audited
  - - Merchant tools / M4B
    - Onboard merchants and manage business operations
    - Merchant profile, test credentials, production keys, dashboards, marketing, finance controls
    - M4B portal, developer docs, merchant verification
    - Growth
    - Makes MoMo more than a consumer wallet
    - Dashboard feature depth is not fully public
  - - Investment marketplace
    - Allocate idle cash into savings, funds, gold, or yield products
    - Sàn Đầu Tư, BVBank savings, partner fund houses, Túi Thần Tài
    - Partner banks, fund managers, product approvals
    - Growth
    - Keeps savings and investing inside the app
    - AUM, retention, and economics are undisclosed
  - - Stock investing
    - Open brokerage account and trade domestic stocks
    - CVS integration, free onboarding, small-ticket trading, multi-source funding
    - CVS, market hours, bank and wallet funding sources
    - Growth
    - Adds higher-engagement investing workflow
    - Public disclosure does not show active traders or balances
  - - Credit cards / consumer credit
    - Open a card, use a virtual card, defer payment
    - Online card application, virtual card issuance, partner-bank approval flow
    - Partner banks, KYC, OTP, face verification
    - Growth
    - Credit workflow rides existing MoMo identity and usage history
    - Credit loss, approval, and economics are not public
  - - AI / recommendation / risk layer
    - Personalize offers and control fraud or credit risk
    - Recommendations, lending DE, eKYC AI, chatbot AI, unusual-transaction detection
    - Google Cloud, NVIDIA, MoMo data pipelines
    - Mature in core use cases
    - Data flywheel supports cross-sell and risk control
    - Current full-stack architecture detail is only partially public
  - - Trust & support layer
    - Keep users transacting safely and resolve issues
    - 5-layer AI security, hotline, in-app help, biometric upgrade, regulatory messaging
    - iProov, SBV rules, PCI baseline, support operations
    - Mature
    - Trust signaling is part of conversion and retention
    - No independently audited uptime or ISO 27001 confirmation found
  notes: Public maturity reflects how concretely the module is documented in currently reviewed sources, not MoMo internal revenue contribution or technical sophistication.
