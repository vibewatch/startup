- id: product-map
  title: Product map, merchant surface, and breadth moat
  body: 'MoMo’s public module map is unusually broad for a Vietnam wallet. Consumer-facing modules clearly visible today include core payments, interoperable QR receive and pay, stock investing with CVS, a multi-partner investment marketplace, partner-issued credit cards, and merchant-facing onboarding. The merchant side is important because it shows MoMo is not only selling a consumer app; it is also exposing APIs, dashboards, testing credentials, production-key workflows, and a business account layer through M4B. That architecture raises the probability that MoMo can add new monetizable modules without retraining the user on a new product surface. Breadth also supports two-sided network effects: users get more reasons to keep the app installed, and merchants get more checkout, funding-source, and marketing options. The moat is therefore less about any single SKU and more about whether one account can keep compounding across pay, accept, borrow, save, invest, and card-linked commerce.'
