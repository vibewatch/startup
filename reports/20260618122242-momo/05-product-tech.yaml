  evidenceGaps:
  - type: missing-source
    severity: material
    topic: uptime-reliability
    missingEvidence: An independently audited uptime or SLA history for core payments, QR acceptance, and support responsiveness.
    whyItMatters: Product breadth only becomes durable if the core transaction loop is highly reliable; without audited uptime evidence, investors cannot separate marketing confidence from operational proof.
    diligencePath: Request board or ops-review materials showing monthly uptime, incident counts, MTTR, and wallet or payment service availability for the last 12 months.
    relatedQuestionRefs:
    - QE015
    - QE025
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: A current public attestation package showing broader certifications such as ISO 27001 scope, PCI DSS version status, or equivalent ISMS evidence tied to MoMo operations.
    whyItMatters: Trust messaging is a moat only if it can be tied to current, scoped, independently assessed controls rather than general brand statements.
    diligencePath: Request the latest external certification list, scoping statement, assessor names, validity dates, and any remediation exceptions.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: module-economics
    missingEvidence: Unit economics by product module, including take rates, credit loss or approval metrics, merchant-tool monetization, and cross-border QR volumes.
    whyItMatters: The strategic breadth is visible, but capital allocation and moat durability depend on whether higher-value modules actually monetize better than pure payments.
    diligencePath: Request cohort retention, contribution margin, loss-rate, take-rate, and revenue-mix data by major module for the last four quarters.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: stale
    severity: minor
    topic: current-architecture-detail
    missingEvidence: A post-2022 public engineering update that confirms how much of the disclosed lending architecture still represents the broader 2026 production stack.
    whyItMatters: Architecture analysis is stronger when recent evidence confirms that key dependencies, interfaces, and data flows have not materially changed.
    diligencePath: Request an updated architecture deck or current engineering blog post covering production services, observability, data-governance, and fraud-stack evolution.
    relatedQuestionRefs:
    - QE009
    - QE010
    relatedTableRefs:
    - TE003
