  - TE005
- id: trust-security-and-compliance
  title: Trust, safety, security, privacy, and compliance controls
  body: Trust is a central part of MoMo’s product design, and the public evidence here is stronger than for uptime or economics. Consumer-facing surfaces emphasize five-layer AI security, unusual-transaction detection, licensing, and direct support channels. More importantly, recent external evidence shows MoMo materially upgraded biometric controls instead of relying only on static KYC. iProov and local news coverage tie the Dynamic Liveness rollout to AI-fraud pressure and to SBV Decision 2345, which explicitly allows biometric and FIDO-based authentication for higher-risk online-payment scenarios. Circular 41 and the 2025 PDPL then raise the bar again by tightening e-wallet verification, retention, risk management, and data-protection obligations into 2026. PCI DSS remains the baseline card-data control framework, while FIDO and VinCSS materials show what a passwordless stack could look like in practice. The main open diligence issue is that public trust signaling is broad, but independently
    audited uptime and broader certification detail remain limited in the reviewed evidence set.
