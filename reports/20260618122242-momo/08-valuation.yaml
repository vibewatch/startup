summary: >-
  MoMo merits a watchlist / conditional-buy posture rather than an aggressive buy at a
  headline price above $2 billion. The bullish case is real: category leadership in
  Vietnam wallets, first public profitability in 2024, broad product breadth, and a still-open
  SME-finance runway. The anti-thesis is equally real: Vietnam consumer-wallet usage is nearing
  saturation, ZaloPay is accelerating from a large VNG ecosystem base, MoMo only recently exited
  a decade-plus loss era, and any new round could carry undisclosed preference or dilution terms.
  A probability-weighted public-market and private-comp triangulation supports roughly $2.5 billion
  fair value, which leaves limited margin of safety unless entry terms improve materially.
