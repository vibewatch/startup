      - FV003
  - id: exit-readiness-and-final-asks
    title: Exit readiness, thesis-breaks, and final diligence asks
    body: |-
      MoMo's near-term exit menu looks narrower than its strategic value might suggest. The freshest public
      reporting says an IPO is not on the near-term agenda, which points investors toward strategic sale,
      structured secondary, or longer hold as the realistic 2026 to 2030 outcomes. A strategic buyer such as
      Mizuho, a regional bank, or a larger platform seeking payments and financial-distribution reach is easier
      to imagine than a near-term public listing. GCash is a helpful contrast: Globe's public investor-relations
      infrastructure already references Mynt disclosure activity, implying a more explicit path to listing-readiness
      than MoMo currently shows.

      That makes diligence discipline the decisive variable. The thesis breaks if MoMo loses wallet share faster
      than expected, if ZaloPay keeps compounding at current growth rates, if 2026 fundraising fails or arrives
      with punitive terms, if biometrics meaningfully slow onboarding, or if profitability proves to be a short
      cycle rather than a durable state. Before MoMo can move from watchlist to buy, management needs to show a
      current cap table, preference stack, audited FY2024-FY2025 financials, cohort-quality metrics, and the exact
      structure of the live investor process.
    claimRefs:
      - CV004
      - CV005
      - CV020
      - CV023
      - CV033
      - CV034
      - CV035
      - CV037
      - CV043
      - CV044
      - CV045
    tableRefs:
      - TV005
      - TV006
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - View
      - Support
      - What would upgrade the call
    rows:
      - - Recommendation
        - watchlist / conditional buy
        - Real market leadership, first public profitability in 2024, and credible investor interest above $2B
        - Effective entry at or below ~$2.0B, or explicit downside protection with clean seniority terms
      - - Confidence
        - medium
        - 2021 round facts and 2026 investor-process facts are well corroborated
        - Audited FY2024-FY2025 financials plus cap-table transparency
      - - Risk rating
        - high
        - Saturation, ZaloPay acceleration, bank-app substitution, and regulatory friction are all material
        - Proof that profit, retention, and onboarding economics remain durable through 2026
      - - Valuation stance
        - fair
        - Probability-weighted value is roughly $2.5B and base case is only modestly above the 2021 mark
        - Entry terms that lower effective paid price or protect downside
      - - Target return / hold period
        - 1.8x-2.2x gross over 4-5 years
        - Best exit path is strategic sale or secondary rather than imminent IPO
        - Clearer evidence of IPO readiness or a strategic buyer path
      - - Entry discipline
        - Avoid paying simply for the headline $2B+ narrative
        - Public term opacity could erase modest upside
        - Cap table, preference stack, and transaction structure
    notes: >-
      MoMo is investable in principle but not obviously attractive at an undifferentiated headline price above
      $2 billion. Terms matter as much as enterprise value.
    claimRefs:
      - CV004
      - CV005
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Point
      - Why it matters
      - What would change the view
    rows:
      - - Thesis
        - MoMo remains Vietnam's leading wallet / super-app with 30M+ users and high-50s to 60% market share signals.
        - Scale is the prerequisite for cross-selling higher-margin financial services.
        - Sustained share above 55% while adjacent products grow faster than pure payments.
      - - Thesis
        - FY2024 profitability suggests the company may be exiting the subsidy era.
        - A profitable category leader deserves more credit than a pure cash-burn wallet.
        - Audited proof that profit is not one-off or promotion-driven.
      - - Thesis
        - Vietnam fintech still has runway via SME finance and a ~$90B credit gap.
        - Future value depends on moving beyond saturated consumer QR payments.
        - Evidence that SME lending and merchant tools are becoming material revenue contributors.
      - - Anti-thesis
        - Consumer wallet growth is nearing saturation as bank apps and VietQR spread.
        - Share gains get harder and pricing power gets worse in a mature payments layer.
        - Incremental user growth and monetization remain strong despite higher bank-app substitution.
      - - Anti-thesis
        - ZaloPay is growing quickly from a large VNG ecosystem base.
        - If ZaloPay keeps outgrowing MoMo, MoMo's premium multiple should compress.
        - ZaloPay growth slows materially or MoMo proves superior retention and monetization.
      - - Anti-thesis
        - MoMo only recently reached profitability after a decade-plus loss period.
        - The market may be extrapolating a young profit state too aggressively.
        - Two years of disclosed profit durability and lower incentive intensity.
    notes: >-
      The long case is real but no longer rests on greenfield wallet adoption. It rests on monetization quality,
      regulatory execution, and defending share while the category matures.
    claimRefs:
      - CV006
      - CV010
      - CV011
      - CV013
      - CV014
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Implied valuation range
      - Probability
      - Return view versus $2.0B entry
    rows:
      - - Bull
        - Revenue approaches ~$700M, wallet share stays above 55%, SME finance scales, and MoMo earns an 7x-8x-style premium growth multiple.
        - $3.2B-$3.5B
        - 25%
        - Attractive at roughly 1.6x-1.75x gross MOIC
      - - Base
        - Revenue reaches ~$550M, share stays around 50%, lending and merchant monetization improve modestly, and the market applies ~4.5x-5x.
        - $2.3B-$2.5B
        - 55%
        - Only modest at roughly 1.15x-1.25x gross MOIC
      - - Bear
        - ZaloPay and banks gain share, growth slips below 10%, Circular 41 slows onboarding, and multiple compresses toward ~3x.
        - $1.4B-$1.6B
        - 20%
        - Downside to roughly 0.7x-0.8x gross MOIC
    notes: >-
      Probability-weighted value is about $2.5B. The scenario set supports patience more than urgency.
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Valuation / market cap
      - Scale marker
      - Relevance to MoMo
      - Caveat
    rows:
      - - MoMo
        - ~$2.3B 2021 implied; >$2B still being tested in 2026
        - 30M+ users; first profitability in 2024
        - Anchor case under review
        - Private company with limited financial disclosure
      - - GCash
        - ~$5B
        - ~94M users
        - Best scaled SEA wallet analog; shows premium private value is possible
        - Revenue and margin comparability are limited in public sources
      - - VNLife / VNPay
        - '>$1B explored exit value'
        - Large Vietnam payments ecosystem
        - Helpful local strategic comp for platform relevance
        - Exit exploration is not the same as closed price
      - - Dana
        - ~$1.13B
        - ~200M claimed registered users / strong QR network
        - Shows regional wallet values can sit well below GCash despite large user numbers
        - Different market and ownership structure
      - - Sea Limited
        - ~$54.9B public market cap
        - Q1 FY26 revenue ~$7.1B
        - Public super-app / fintech adjacency benchmark
        - Much broader business mix than MoMo
      - - Nubank
        - ~$61.9B public market cap
        - Q1 FY26 revenue ~$4.97B
        - Public proof that scaled fintech profitability can command premium value
        - Banking-led model is structurally different from a wallet super-app
      - - Paytm
        - ~$7.4B public market cap
        - Large India wallet / payments platform
        - Useful public downside-to-midcase comp for payments-heavy fintechs
        - India market structure and regulation differ materially
    notes: >-
      This is a partial comparable set designed to bracket MoMo's valuation rather than produce a single formulaic answer.
      Private SEA wallet revenue disclosure remains weak, so comparables are better for sanity-checking than precise pricing.
    enumerationScope:
      coverage: partial
      basis: The rows intentionally cover the most decision-relevant private SEA wallet, local Vietnam, and listed fintech / super-app anchors retained in public evidence, not every possible regional payments company.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Why it breaks the thesis
      - Monitoring signal
      - Immediate action
    rows:
      - - ZaloPay keeps compounding much faster than MoMo through 2026-2027
        - MoMo loses the assumption that category leadership is durable enough to deserve a premium multiple
        - ZaloPay active-user, TPV, and revenue growth continue to outpace MoMo's visible operating signals
        - Recut bear case and stop underwriting premium entry terms
      - - 2026 investor process fails or clears only at punitive terms
        - Confirms weak price discovery or hidden preference overhang
        - No deal, down-round structure, or unusually senior new money
        - Move from watchlist to avoid until security terms are disclosed
      - - Circular 41 materially hurts onboarding or activation
        - Weakens the growth leg of the thesis in a maturing market
        - Conversion declines, exception queues rise, or user additions stall
        - Cut growth assumptions and compress multiple
      - - Profitability reverses back to subsidy-led growth
        - The entire 'matured winner' narrative breaks
        - Promotions surge, losses widen, or revenue growth decouples from margin
        - Treat MoMo as a lower-quality payments distributor
      - - Bank apps and VietQR absorb everyday use cases faster than expected
        - MoMo's engagement moat narrows and monetization leverage falls
        - User frequency weakens while merchant and financial-service take-up lags
        - Lower base case and focus only on downside-protected structures
    notes: >-
      These are operational kill criteria rather than generic risks. Any one of them can move MoMo from fair to unattractive.
    claimRefs:
      - CV005
      - CV017
      - CV020
      - CV022
      - CV023
      - CV036
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Diligence ask
      - Why it is blocking
      - Best owner
      - What good looks like
    rows:
      - - Current cap table and full preference stack
        - Effective entry cannot be priced without seniority, liquidation, and anti-dilution terms
        - CFO / lead banker
        - Full as-converted ownership and waterfall through the proposed round
      - - Audited FY2024-FY2025 financials plus monthly 2026 management accounts
        - Public profitability and revenue are still not filing-grade facts
        - CFO / auditor
        - Audited statements plus monthly revenue, gross profit, opex, and cash bridge
      - - Transaction structure for the live investor process
        - Primary versus secondary mix changes both return potential and balance-sheet value
        - Lead banker / board
        - Clear use of proceeds, seller list, and post-money ownership impact
      - - Cohort, MAU, retention, and monetization-quality metrics
        - Registered users alone are insufficient in a saturated wallet market
        - Growth / product analytics
        - Cohorts by activation, frequency, product attach, and net revenue per active user
      - - Regulatory and onboarding metrics under Circular 41
        - Growth assumptions fail quickly if biometric friction is too high
        - Compliance / operations
        - Before-and-after conversion, false-reject rates, and manual-review throughput
      - - ZaloPay / bank-app competitive scorecard
        - The biggest valuation threat is share and engagement compression, not demand disappearance
        - Strategy / corp dev
        - Monthly share, payment volume, merchant, and user-frequency comparison
    notes: >-
      If management cannot supply these six asks quickly and coherently, MoMo should remain a watchlist name even if the headline valuation looks stable.
    claimRefs:
      - CV023
      - CV034
      - CV035
      - CV036
      - CV043
