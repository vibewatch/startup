    topic: revenue-quality
    missingEvidence: Audited FY2024-FY2025 financials, stream-level revenue mix, MAU / cohort data, and monetization-quality metrics.
    whyItMatters: The central debate is not whether MoMo has scale, but whether the profit inflection is durable enough to support a premium multiple.
