sections:
  - id: thesis-anti-thesis
    title: Investment thesis and anti-thesis
    body: |-
      The long case for MoMo is not hard to state. Public sources consistently place it as Vietnam's
      leading wallet / consumer-finance super app with more than 30 million users, the largest wallet
      share in the country, and first public profitability in 2024. Market leadership matters because
      wallets are distribution businesses: the best asset is not just payment volume, but the right to
      cross-sell lending, insurance, investing, merchant marketing, and SME tools into a large installed
      base. Mission Media's 2026 framing is directionally helpful here: Vietnam fintech remains a
      multi-billion-dollar market, but the next real runway is SME finance and embedded business tools,
      not another round of subsidized consumer QR acquisition.

      The anti-thesis is equally important. Consumer wallet adoption is maturing, banks and VietQR have
      collapsed the feature gap for routine transfers, and ZaloPay is re-accelerating from a large VNG
      ecosystem base. Vietdata's adverse work also matters because it shows how much value the category
      destroyed before profitability emerged: leaders spent years buying habit through marketing and only
      recently narrowed losses. MoMo's valuation therefore should not be treated as a simple winner-take-all
      tech multiple. It is a scaled but still-regulated payments distributor whose upside increasingly
      depends on monetizing financial services better than banks, ZaloPay, and infrastructure-led rivals.
    claimRefs:
      - CV006
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
    tableRefs:
      - TV002
    figureRefs:
      - FV004
  - id: recommendation-and-entry-discipline
    title: Recommendation, confidence, and entry discipline
    body: |-
      The right public-market verdict is watchlist / conditional buy. MoMo is not obviously overvalued in
      the abstract: the company has real scale, real product breadth, a credible 2024 profitability
      milestone, and a 2026 investor process that still points to interest above the 2021 unicorn mark.
      But none of that automatically means attractive returns at a headline price above $2 billion. Using
      the available public anchors, the probability-weighted value lands around $2.5 billion, and the base
      case centers on roughly $2.3 billion to $2.5 billion. That leaves too little margin of safety if the
      new round includes senior preferences, secondary leakage, or aggressive governance terms.

      The practical posture is medium confidence, high risk, fair valuation stance. The stock-equivalent
      question is not whether MoMo is a real company; it plainly is. The question is whether a new investor
      gets paid enough for saturation risk, ZaloPay acceleration, regulatory friction, and term opacity.
      Without clearer structure, a fresh ticket should target either a cleaner effective entry around $2.0
      billion or explicit downside protection. That is why the call is conditional buy rather than buy.
    claimRefs:
      - CV004
      - CV005
      - CV031
      - CV034
      - CV035
      - CV036
      - CV041
      - CV042
      - CV043
      - CV044
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-context-and-overhang
    title: Financing context, dilution uncertainty, and valuation posture
    body: |-
      Public financing facts are strongest at the 2021 round and weakest exactly where new investors care
      most today. The best-corroborated facts are straightforward: $200 million was raised in Series E,
      MoMo crossed the $2 billion valuation mark, and Mizuho took approximately 7.5% while positioning the
      company as a strategic digital-finance distribution asset. GetLatka's $2.3 billion estimate is the
      cleanest current numeric anchor, but it is still a third-party estimate rather than a disclosed cap-table
      mark. Broader public funding summaries suggest total capital raised around $430 million to $434 million,
      which is directionally important because it implies a meaningful existing preference stack even before a
      new round is considered.

      The key missing facts are all term-sheet facts: current cap table, liquidation preference structure,
      anti-dilution protections, whether the 2026 process is primary or secondary, and current cash / runway.
      Those omissions matter because MoMo only recently reached profitability after more than a decade of loss
      absorption and category subsidy. An investor paying >$2 billion without preference transparency could be
      underwriting a fair company at unattractive security terms. That is why the public valuation stance is
      fair rather than cheap.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV008
      - CV009
      - CV034
      - CV035
      - CV036
  - id: scenarios-and-comparable-set
    title: Bull / base / bear cases and comparable triangulation
    body: |-
      The scenario work is more informative than any single comp. In the bull case, MoMo compounds toward
      roughly $700 million revenue, sustains share above 55%, converts SME-finance adjacency into a higher-
      quality growth layer, and regains a premium multiple closer to the upper end of high-growth fintechs.
      That gets to about $3.2 billion to $3.5 billion. In the base case, revenue reaches roughly $550 million,
      share remains around 50%, and the company trades on a disciplined 4.5x to 5x revenue framework, giving
      about $2.3 billion to $2.5 billion. In the bear case, acquisition friction from Circular 41, bank-app
      substitution, and ZaloPay share gains compress growth and the multiple simultaneously, taking value down
      toward $1.4 billion to $1.6 billion.

      Comparables support direction but not precision. GCash at ~$5 billion for ~94 million users shows that
      scaled Southeast Asian wallets can still command premium private values. VNLife / VNPay at >$1 billion
      and Dana at ~$1.13 billion help frame the regional private set. Public comps are much larger and structurally
      different, but they still tell investors what the market pays for scaled fintech / super-app exposure:
      Sea and Nubank remain multi-tens-of-billions public companies, while Paytm sits in a single-digit-billion
      bracket. Together those comps support MoMo as a real unicorn, but not necessarily as a clear bargain above
      its 2021 mark.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
