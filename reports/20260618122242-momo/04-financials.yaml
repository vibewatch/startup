evidenceGaps: &id004
- type: private-evidence-only
  severity: material
  topic: revenue-recognition
  missingEvidence: Recognized revenue by stream, revenue-recognition policy, and direct-versus-partner mix.
  whyItMatters: Without stream-level recognition detail, the analyst cannot distinguish durable recurring revenue from lower-quality pass-through or promotion-led activity.
  diligencePath: Request audited FY2024-FY2025 statements plus a stream-level revenue bridge and revenue-recognition memo.
  relatedQuestionRefs:
  - QI006
  relatedTableRefs:
  - TI001
  - TI002
- type: private-evidence-only
  severity: material
  topic: margin-disclosure
  missingEvidence: Gross margin, EBITDA margin, hosting cost, lending-loss provisions, working capital, and capex disclosure.
  whyItMatters: These inputs determine whether profitability is durable or the result of temporarily lower promotions and slower investment.
  diligencePath: Request a management P&L with gross-margin bridge, opex breakdown, provisions schedule, and cash-flow statement.
  relatedQuestionRefs:
  - QI013
  - QI015
  relatedTableRefs:
  - TI003
  - TI005
- type: private-evidence-only
  severity: blocking
  topic: liquidity
  missingEvidence: Current cash balance, monthly burn, runway, and any debt or contingent-liability schedule.
  whyItMatters: Capital adequacy cannot be underwritten from the 2021 round and a 2026 investor process headline alone.
  diligencePath: Request treasury balances, 18-month runway model, debt schedule, and board financing plan.
  relatedQuestionRefs:
  - QI020
  - QI021
  relatedTableRefs:
  - TI004
  - TI005
- type: private-evidence-only
  severity: material
  topic: unit-economics
  missingEvidence: GMV, active-user cohorts, average transaction value, CAC, payback, and realized take rate.
  whyItMatters: Without these metrics, sales efficiency and monetization quality remain qualitative rather than underwriteable.
  diligencePath: Request monthly dashboard exports for GMV, MAU, paid users, CAC, payback, and blended take rate by revenue stream.
  relatedQuestionRefs:
  - QI010
  - QI011
  - QI012
  relatedTableRefs:
  - TI003
- type: missing-source
  severity: material
  topic: audited-financials
  missingEvidence: Audited MoMo standalone or consolidated financial statements for FY2024-FY2025.
  whyItMatters: The current revenue series is third-party estimated and prevents a clean view on margins, cash conversion, and financing needs.
  diligencePath: Obtain the audited financial package used with existing investors or lenders and reconcile it against headline press numbers.
  relatedQuestionRefs:
  - QI001
  - QI026
  relatedTableRefs:
  - TI005
