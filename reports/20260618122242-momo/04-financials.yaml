chapter:
  number: 4
  title: Financials
  summary: 'MoMo''s public financial profile is materially better than a pure subsidized wallet story: third-party revenue estimates point to roughly $482 million of 2024 revenue, multiple 2026 sources confirm a first profitable year in 2024, and the revenue surface spans merchant payments, bill pay, financial-product distribution, and merchant-marketing tools. The unresolved issue is disclosure quality rather than business-model absence: there are still no audited public accounts, no stream-level mix, no GMV or take-rate bridge, and no cash or runway disclosure, so the chapter can support a positive-but-cautious verdict rather than a full underwriting model.'
