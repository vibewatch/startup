    severity: material
    topic: morphi-specific-sam
    missingEvidence: Named target verticals, pipeline counts, pricing assumptions, and deployment-conversion rates sufficient
      to isolate Morphi’s SAM or SOM.
    whyItMatters: Without pipeline and pricing data, market analysis can only frame category opportunity, not the company’s
      realistically obtainable share.
    diligencePath: Request Morphi’s GTM plan, vertical prioritization memo, pipeline funnel, pilot conversion data, and pricing
      deck.
