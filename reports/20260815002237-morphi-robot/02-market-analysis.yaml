callouts:
- calloutType: insight
  title: The real market is narrower than the headline TAM
  body: Morphi’s plausible near-term market is not “all home robots” or even “all humanoids.” It is a subset of Chinese manufacturing
    and semi-structured commercial deployments where buyers already tolerate robotics capex and where data loops can improve
    quickly.
  claimRefs:
  - CM024
  - CM025
  - CM026
  - CM036
- calloutType: risk
  title: Published market estimates measure different things
  body: Some sources model hardware revenue, some units shipped, and some labor-displacement value. Treating those figures
    as interchangeable would overstate certainty and can easily lead to valuation inflation at seed stage.
  claimRefs:
  - CM006
  - CM008
  - CM009
  - CM010
  - CM035
- calloutType: strength
  title: China’s supply chain and policy stack create a real local advantage
  body: China’s robot density, EV-derived supply chains, and policy support make it a better launch market for Morphi than
    most western jurisdictions, even if those same dynamics later sharpen geopolitical bifurcation.
