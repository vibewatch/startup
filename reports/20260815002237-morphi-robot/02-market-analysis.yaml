- id: section-buyers
  title: Buyer, User, and Budget-Owner Segmentation
  body: 'The highest-conviction buyer segment for Morphi is industrial manufacturing, especially factories where workflow

    variation, labor tightness, or safety conditions make fixed automation less economical. In these settings, the

    likely budget owners are VP Manufacturing, plant operations, industrial engineering, or CFO-controlled capital

    equipment budgets. IDC reports that more than 80% of users evaluating humanoids plan deployments in palletizing,

    handling, picking, and machine tending over the next three years, while Goldman and IFR both argue that

    structured environments are the logical first commercialization zone.


    A second buyer segment is semi-structured commercial operations—hotels, mixed-use apartments, facility services,

    retail guidance, and related environments. KrASIA’s description of Morphi’s data collection strategy matters

    here: the company is already using cleaners in commercial and mixed-use settings to gather embodied data. That

    implies Morphi sees value in tasks that are less structured than factory cells but still repetitive enough to

    train around. In those environments the budget owner is more likely facilities management, operations, or pilot

    innovation teams rather than industrial capex committees.


    The long-term consumer/home market should be treated as a narrative adjacency, not a base-case buyer segment.

    1X is already positioning home humanoids in beta form, and Hill Dickinson highlights the privacy, liability, and

    public-trust issues that intensify as robots move into households. Morphi’s current public evidence points to

    a bridge strategy: learn in manufacturing and semi-structured service environments first, then expand only if

    reliability, safety, and generalization improve materially.'
