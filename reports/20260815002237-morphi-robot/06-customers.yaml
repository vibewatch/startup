- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Likely journey from prospect to repeat deployment for a Morphi-type industrial customer; most steps remain unvalidated
    publicly for Morphi itself.
  data:
    items:
    - label: Awareness
      detail: Industrial buyer hears Morphi’s manufacturing-first embodied-AI thesis through investors, media, or robotics
        ecosystem references.
    - label: Technical evaluation
      detail: Automation and plant teams assess whether humanoid deployment can do a task fixed automation or labor currently
        covers.
    - label: Pilot / data-access agreement
      detail: Customer or site partner allows Morphi to collect data, test tasks, and refine models in a semi-structured environment.
    - label: Operational validation
      detail: Site evaluates safety, uptime, support burden, and ROI before agreeing to expand beyond experimentation.
    - label: Referenceable production deployment
      detail: Customer becomes a named lighthouse account with measurable output, hours, or task-volume proof.
    - label: Expansion loop
      detail: More tasks, more lines, more sites, then adjacent environments and eventual broader generalization.
