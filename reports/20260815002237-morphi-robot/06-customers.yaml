- id: section-retention
  title: Durability, Retention, and Procurement Friction
  body: 'Morphi provides no public NRR, GRR, churn, renewal, reference satisfaction, or multi-site expansion data. That

    leaves retention entirely unproven. In robotics, retention usually emerges only after a customer survives several

    difficult gates: pilot approval, site preparation, safety validation, integration, stable operation, and ROI

    review. BMW’s multi-month Figure trial, GXO’s shift from proof-of-concept to multi-year RaaS with Agility, and

    Apptronik’s still-early Mercedes pilot all show that customer adoption is a staged procurement process rather

    than a simple “signed customer” event.


    For Morphi, this means that even a future named pilot would not resolve durability risk by itself. The real proof

    would be repeat purchase, multi-line or multi-site expansion, stable uptime, and customer willingness to provide

    public references. None of that is visible yet. The likely procurement friction is high: factory customers need

    workflow fit, safety confidence, integration support, and a credible path to ROI before they scale embodied-

    intelligence deployments beyond experimentation.


    Until Morphi discloses renewal or expansion behavior, the only defensible position is that retention and

    satisfaction are unknown, not promising.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  tableRefs:
  - TU004
- id: section-expansion
  title: Expansion Logic, Concentration Risk, and Customer Verdict
  body: 'Morphi’s most plausible expansion loop runs from one constrained manufacturing or semi-structured site into more

    tasks, then more sites, then adjacent verticals, and only later toward broader home-like environments. That

    expansion logic is consistent with the company’s technical narrative, but it is still unvalidated by public

    customer evidence. The biggest customer risk is therefore concentration by default: if Morphi’s first real

    commercial account exists but is not publicly disclosed, investors have no way to know whether the business is

    diversified or effectively single-customer.


    Procurement friction and geopolitics compound that risk. Industrial customers require long validation cycles, and

    Reuters/IEEE coverage of U.S. restrictions on Chinese robots suggests that some western government-adjacent or

    security-sensitive buyers could remain closed regardless of technical quality. At the same time, China’s supply-

    chain density and manufacturing demand create a large domestic opportunity if Morphi can prove value inside a

    limited number of lighthouse sites.


    The verdict is straightforward: Morphi’s likely customer profile is understandable, but its actual customer base,

    adoption quality, and expansion durability are not yet public. This chapter therefore grades the customer story as

    strategically plausible but evidentially weak.'
