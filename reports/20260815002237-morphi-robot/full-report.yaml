  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Modules, and Current Maturity
        blocks:
          - type: paragraph
            body: >-
              Morphi does not yet present the market with a clean public SKU catalogue. Instead, the official site
              describes

              a stack of product assets: a self-developed general-purpose humanoid body, an embodied foundation model, a

              high-efficiency data-collection system, and a cross-scenario generalization engine. That language matters

              because it frames Morphi as a platform builder rather than as a single robot-body vendor. The same site
              says

              these components are meant to work together through a “generate-understand-decide” architecture and a data

              flywheel so that robots can move, manipulate, and interact naturally in the real world.


              Public recruiting language adds the strongest available maturity signal. Morphi’s Feishu careers site says
              the

              company’s technical barriers span perception, body design, motion control, VLA, large-scale data training,
              and

              infrastructure, and explicitly says the team is not building laboratory demos but aiming at scalable
              delivery

              from day one. That is directionally consistent with Crunchbase’s manufacturing-first description and with

              founder Huang Qingqiu’s explanation that Morphi is collecting data in semi-structured environments before

              attempting the full generality required for household robotics.


              The limitation is that none of this resolves product maturity at the artifact level. There is still no
              public

              robot name, no mechanical specification sheet, no sensor BOM, no degrees-of-freedom disclosure, and no
              public

              customer deployment. Morphi should therefore be described as a full-stack embodied-intelligence platform
              in

              development, not as a commercially specified humanoid product line.
