      - number: '8.2'
        title: Comparable Valuation Framework
        blocks:
          - type: paragraph
            body: >-
              Morphi cannot be valued cleanly on revenue or EBITDA because the company has not disclosed a revenue base.
              The right frame is a milestone-and-comparable framework: how much the market is paying for founder
              pedigree, ecosystem backing, manufacturing readiness, customer proof, and technical differentiation across
              embodied-AI peers. That framework immediately shows why Morphi is controversial. The company sits far
              below the hottest headline valuation marks attached to global leaders, but it also sits far above what
              many earlier-stage robot companies historically raised before they accumulated multi-site deployments,
              audited unit economics, or clear platform evidence.


              The comp set therefore cuts both ways. Unitree, Figure, and Physical Intelligence illustrate how large
              winners can become if investors believe a company will own a crucial layer of the robotics stack. Agility,
              1X, and Boston Dynamics remind investors that commercialization maturity, hardware execution, and
              strategic value have not always required immediate unicorn pricing. Morphi's current mark is best
              interpreted as a premium China-option bet rather than as proven fair value.
