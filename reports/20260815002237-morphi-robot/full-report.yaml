  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Likely Customer Segments, Buyer / User / Payer, and Current Visibility
        blocks:
          - type: paragraph
            body: >-
              Morphi’s publicly stated customer wedge is manufacturing, not the home. That matters because it defines
              the

              likely buyer stack even in the absence of named accounts. The most plausible initial buyer is a factory,

              warehouse, or industrial-operations organization evaluating embodied automation for tasks that are
              repetitive,

              physically awkward, or poorly served by fixed automation. The user is more specific than the buyer: plant

              operators, automation engineers, line supervisors, and integration teams would be the direct operational
              users,

              while the payer would likely be plant management, operations leadership, or a corporate automation budget
              owner.


              Morphi’s founder also says the company is collecting data in hotels and mixed residential-commercial
              apartment

              environments. Those locations may represent pilot partners, data partners, or proto-customers, but the
              public

              record does not disclose whether they are paying customers, co-development sites, or merely
              data-collection

              venues. That distinction matters. A site that helps collect data is not equivalent to a production
              customer with

              referenceable ROI, renewal intent, and expansion potential.


              The critical conclusion is that Morphi’s customer base is still hypothetical from the outside. Public
              sources are

              sufficient to infer who the first customers probably are, but insufficient to verify who they actually
              are.

              Investors should resist turning manufacturing-first positioning into assumed customer traction.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
