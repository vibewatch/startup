      - number: '2.2'
        title: 'Market Sizing: Multiple Lenses, Contradictions, and Practical Bounds'
        blocks:
          - type: paragraph
            body: >-
              The humanoid-robot market is large enough to attract meaningful capital, but published estimates are not

              directly comparable because they answer different questions. MarketsandMarkets publishes explicit hardware

              revenue forecasts: global humanoid robot market size of $5.41 billion in 2026 rising to $50.27 billion by

              2035, and a China-specific market expanding from $0.40 billion in 2025 to $2.80 billion by 2030. Goldman

              Sachs Research offers both a conservative and an expansive framing: its “AI accelerant” report sets a base
              case

              of at least $6 billion over a 10–15 year horizon, while a blue-sky scenario reaches $154 billion by 2035
              if

              design, affordability, and public acceptance barriers are solved. Goldman’s separate 2035 article places
              the

              global market at $38 billion by 2035 and argues that structured manufacturing is the first durable demand
              zone.


              IDC measures the market in units rather than revenue, projecting more than 510,000 global humanoid
              shipments by

              2030 at nearly 95% CAGR and noting that 2025 shipments only just exceeded 18,000 units, with more than 85%
              of

              those deployments concentrated in demonstrations, education, data collection, and guided-tour scenarios.
              That is

              important because it shows how early the market still is: investors may be discussing trillion-dollar
              labor

              substitution narratives, but most current shipments are not yet scaled factory labor replacements.


              For Morphi, the relevant sizing lens is narrower than the broadest industry TAM. The company has no public

              customer list, no SKU disclosure, and no shipment data, so any true SAM or SOM must be
              evidence-constrained.

              The most defensible near-term market is Chinese manufacturing and semi-structured commercial pilots where
              buyers

              already accept robotics capex, where China’s supply chain and policy support are strongest, and where the
              closed

              loop between deployment data and model improvement can operate most efficiently.
