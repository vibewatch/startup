      - number: '6.3'
        title: Durability, Retention, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Morphi provides no public NRR, GRR, churn, renewal, reference satisfaction, or multi-site expansion data.
              That

              leaves retention entirely unproven. In robotics, retention usually emerges only after a customer survives
              several

              difficult gates: pilot approval, site preparation, safety validation, integration, stable operation, and
              ROI

              review. BMW’s multi-month Figure trial, GXO’s shift from proof-of-concept to multi-year RaaS with Agility,
              and

              Apptronik’s still-early Mercedes pilot all show that customer adoption is a staged procurement process
              rather

              than a simple “signed customer” event.


              For Morphi, this means that even a future named pilot would not resolve durability risk by itself. The
              real proof

              would be repeat purchase, multi-line or multi-site expansion, stable uptime, and customer willingness to
              provide

              public references. None of that is visible yet. The likely procurement friction is high: factory customers
              need

              workflow fit, safety confidence, integration support, and a credible path to ROI before they scale
              embodied-

              intelligence deployments beyond experimentation.


              Until Morphi discloses renewal or expansion behavior, the only defensible position is that retention and

              satisfaction are unknown, not promising.
            claimRefs:
              - CU021
