  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Headline Valuation View
        blocks:
          - type: paragraph
            body: >-
              Morphi's headline round price is the central valuation fact: the company reportedly raised roughly
              $147-$148 million in July 2026 at about a $1 billion / RMB 7 billion post-money mark. That is an
              extraordinary outcome for a startup founded in August 2025 and still publicly pre-revenue. The valuation
              is not irrational in the context of 2026 humanoid-robot enthusiasm, China's industrial-policy push, and
              the signaling value of Alibaba and Tencent as backers. But it does mean investors are paying for future
              category leadership rather than present operating proof.


              On public evidence alone, the most defensible call is track / research-more at the current price. Morphi
              may yet justify this level if it can prove repeat factory deployment, show that its data flywheel improves
              field performance, and deliver a native model that matters in production rather than only in demos. Until
              then, the valuation behaves more like option premium than underwritten fair value.
            claimRefs:
