      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and China-Specific Edge
        blocks:
          - type: paragraph
            body: >-
              China’s structural advantages are the strongest argument for Morphi’s market relevance. MERICS says China
              has

              the world’s largest installed base of industrial robots and benefits from deep EV, electronics, battery,
              and

              component supply chains that transfer directly into embodied-AI commercialization. IFR adds that China’s

              manufacturing sector already operates around 2 million industrial robots and accounted for 54% of annual
              global

              industrial-robot installations, while its 15th Five-Year Plan places AI-powered robotics at the center of

              industrial strategy. MIT Technology Review extends the point: China’s EV incumbents are moving into
              humanoids

              because perception, batteries, supply chains, and automation know-how already overlap.


              But demand drivers do not erase adoption constraints. Gasgoo argues that current embodied-intelligence
              models

              still fail outside their training distributions and require bespoke adaptation at each factory or home.
              MERICS

              says Chinese humanoids remain too expensive for widespread deployment and likely need costs to fall by at
              least

              half. IFR explicitly cautions that universal humanoid factory helpers and household adoption are not near-
              to

              medium-term outcomes; traditional industrial robots retain the edge in high-speed precision settings.
              RAN’s

              coverage of MIIT’s six-pillar standard system and Hill Dickinson’s liability/privacy analysis both
              reinforce that

              safety and governance are not afterthoughts—they are gating variables for adoption.


              The last constraint is geopolitical. US News/Reuters and IEEE both report that bipartisan US lawmakers
              moved to

              restrict federal use of Chinese ground robots in 2026. Morphi is currently China-focused, so the immediate

              commercial impact is limited, but the broader lesson is that the market may bifurcate by jurisdiction long

              before it matures by technology. That matters for valuation because it caps how easily a Chinese
              embodied-AI

              startup can turn early technical success into globally fungible demand.
