              certification list, no security update policy, no vulnerability-disclosure program, no uptime /
              reliability

              reporting, and no public statement on how physical safety, teleoperation fallback, or field incident
              handling are

              managed. For an embodied-AI company, that is a material diligence gap rather than a cosmetic omission.
