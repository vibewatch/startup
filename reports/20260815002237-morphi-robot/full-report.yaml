      - number: '1.3'
        title: Funding, Valuation, and Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              Morphi’s financing has been unusually large for a company this young. Crunchbase News lists Morphi Robot
              as one

              of July 2026’s new unicorns, stating that the company raised a $147 million seed round led by Alibaba
              Group and

              Tencent at a $1 billion valuation. KrASIA, citing a 36Kr interview with CTO Huang Qingqiu, states that
              Morphi had

              raised more than RMB 1 billion (about USD 148 million) in angel funding. 36Kr’s broader article on

              Huawei-affiliated embodied-AI founders gives a similar renminbi-denominated framing: Morphi (rendered as
              Moqi

              Intelligence) completed over RMB 1 billion in angel financing with both Alibaba and Tencent participating
              at a

              post-money valuation of RMB 7 billion. Across those sources, the exact round label differs—seed versus
              angel—but

              the amount and valuation are directionally consistent enough to treat the financing event as a roughly

              $147-$148 million first institutional round at about US$1 billion / RMB 7 billion post-money.


              What is more notable than the raw number is who financed it. Alibaba and Tencent are not passive financial
              names

              in China’s embodied-intelligence race: both sit atop cloud, consumer, industrial, ecosystem, and
              distribution

              networks that can influence compute access, ecosystem partnerships, application integration, and later
              customer

              introductions. MERICS argues that embodied AI in China is becoming tightly intertwined with industrial
              policy, EV

              supply chains, and localization ambitions. In that context, Alibaba/Tencent backing gives Morphi brand

              legitimacy, fundraising momentum, and optionality well beyond what a normal seed company would enjoy.


              The adverse view is that this financing scale may be pulling valuation forward ahead of operating proof.
              Gasgoo

              notes that Morphi’s angel rounds alone surpassed RMB 1 billion—roughly a traditional hard-tech Series B
              financing

              scale—while the company still lacks public product releases or commercial disclosures. That does not
              invalidate

              the round; it does mean investors should evaluate Morphi as a high-expectations seed company rather than a

              de-risked industrial robotics operator.
