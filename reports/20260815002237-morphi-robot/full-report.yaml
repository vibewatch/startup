      - number: '8.4'
        title: Investment Decision and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The practical investment question is not whether Morphi is interesting. It clearly is. The question is
              whether a new investor should accept a $1 billion seed mark before seeing the materials that would
              normally bridge story into underwriting: full cap-table terms, factory pipeline quality, native-model
              evaluation data, entity and IP ownership, and key-person retention arrangements. Those items determine
              whether Morphi is merely a hot financing event or the early formation of a durable platform.


              The public record therefore supports disciplined engagement, not a chase. Morphi should move up the stack
              only if private diligence proves that repeat orders, technical differentiation, and ownership hygiene are
              stronger than the current evidence suggests. If those checks fail, the valuation should be treated as
              stretched and potentially reset-prone. The burden is therefore not to predict perfection, but to prove
              that Morphi is materially further along than the public record implies.
            claimRefs:
              - CV010
              - CV011
