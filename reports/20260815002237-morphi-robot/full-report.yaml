  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Morphi competes first against private humanoid specialists rather than against the entire automation
              industry.

              The most relevant direct peers are Figure, Agility, Apptronik, 1X, Unitree, Agibot, and—at a broader
              enterprise

              level—UBTECH. These companies all pursue general-purpose or semi-general-purpose embodied robots operating
              in

              human environments, but they differ sharply on where they enter the market: Figure and 1X now emphasize
              home

              assistance narratives, Agility centers warehouse and logistics operations, Apptronik emphasizes
              manufacturing,

              warehouse, and retail, Unitree offers low-price developer and research hardware, Agibot emphasizes scaled

              Chinese manufacturing deployment, and UBTECH spans enterprise and service robotics.


              Incumbent substitutes remain just as important as direct peers. For factories and warehouses, the real
              buyer

              choice is often not “Morphi versus Figure” but “humanoid robot versus fixed industrial automation, cobots,
              AMRs,

              or more human labor.” That matters because competitors with public deployment proof can argue they deserve
              pilot

