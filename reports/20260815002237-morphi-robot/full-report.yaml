            body: >-
              Morphi’s strongest differentiation claim is data-system quality. Huang’s background building
              autonomous-driving

              data infrastructure at Huawei is directly relevant to Morphi’s closed-loop approach, and the recruiting
              page’s

              emphasis on perception, body design, motion control, VLA, and large-scale data training implies the
              company is

              trying to own the full embodied stack rather than integrate third-party pieces superficially. If that
              works,

              the moat is not simply a robot body but a faster generalization loop across tasks and scenarios.


              The main dependency risk is that this architecture still appears to rely on a broader ecosystem whose
              frontier is

              moving fast. Figure, NVIDIA, OpenVLA, and π0 all illustrate how quickly open or semi-open VLA tooling is

              improving. That raises the burden of proof for Morphi: it must show that its private data and operating
              loop

              compound faster than public-model baselines plus commodity hardware. There is also a market-access
              dependency:

              Reuters and IEEE coverage of proposed U.S. restrictions on Chinese robots means that even technically
