      - number: '5.2'
        title: Closed-Loop Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The best public technical description of Morphi comes from Huang Qingqiu’s KrASIA/36Kr interview. Huang
              says

              Morphi’s core advantage is not a marketing label around “AGI for robots,” but a closed-loop system for

              embodied data. In his description, Morphi collects data with lightweight wearable devices, aggressively
              filters

              for quality, classifies and retrieves data for task-specific learning, automatically labels ground truth,

              evaluates models at scale, and then re-collects the data where performance is weak. That is a direct
              carryover

              from autonomous-driving data engineering into robotics and is the company’s most concrete architecture
              claim.


              Morphi’s narrative also places it inside the broader VLA and robotics-foundation-model race. Figure’s
              Helix,

              NVIDIA Isaac GR00T, OpenVLA, and the Hugging Face / Physical Intelligence π0 ecosystem all show where the
              state

              of the art is moving: toward language-conditioned action models, simulation-assisted training,
              cross-embodiment

              data, and deployment tooling that turns robot behavior updates into repeatable software workflows. Morphi
              has

              not publicly said it uses any one of these exact frameworks. It has, however, said that it is already
              doing

              post-training on physical robots, pretraining on top of open-source models, and planning a native model by
              the

              end of 2026. The most defensible interpretation is that Morphi’s current stack likely depends on external

              open-model baselines and internal data infrastructure simultaneously.


              That architecture can be sketched with moderate confidence at the layer level—body, sensing and control,

              embodied model, data collection and evaluation, and deployment feedback loop—but not at the implementation

              detail level. There is no public benchmark table, no latency profile, no published model size, no
              simulation

              stack disclosure, and no public explanation of compute or inference topology.
