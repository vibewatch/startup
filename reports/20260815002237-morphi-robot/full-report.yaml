      - number: '4.2'
        title: Cost Structure, GTM Motion, and Unit-Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests humanoid-robot economics remain dominated by hardware complexity, deployment
              labor,

              warranty risk, and the cost of repeated model iteration. Agibot’s product pages provide unusually concrete
              cost

              proxies: A2 Lite is manufactured under automotive-grade principles with 92 inspection checkpoints per
              unit, and

              its warranty covers one year or 3,000 cumulative operating hours. A2 Ultra claims up to 2,000 hours of
              walking

              validation including 360 hours of continuous operation without anomalies. None of those disclosures
              provide

              dollar COGS, but they clearly imply non-trivial QA, support, and reserve costs that sit below any posted
              list

              price.


              Deployment tooling matters because it is one of the few ways a humanoid company can improve gross-margin
              path

              before hardware commoditizes. Agibot’s Genie Studio markets integrated model training, quantization,

              deployment, data collection, validation, and remote monitoring. Its related industrial case study with

              Longcheer says a live consumer-electronics line went from project start to production in four months and
              that

              production-line integration itself was completed in 36 hours, with 24/7 operation and under 4% downtime
              loss.

              The exact financial terms are undisclosed, but the business implication is clear: if deployment can be
              turned

              from bespoke engineering into repeatable configuration, services margin and sales efficiency improve
              materially.


              GTM motion also looks much closer to enterprise automation than to consumer electronics. Figure’s BMW
              proof,

              Agility’s Digit-plus-Arc workflow stack, and Apptronik’s manufacturing/warehouse positioning all point
              toward

              long-cycle direct sales, high customer education cost, and site-specific integration burden. Morphi’s own

              manufacturing-first focus means traditional SaaS CAC/payback metrics are not the right first lens. The
              right

              questions are pilot-to-rollout conversion, deployment labor per site, gross margin after warranty and
              support,

              and whether software/data attach can eventually offset hardware margin compression.
