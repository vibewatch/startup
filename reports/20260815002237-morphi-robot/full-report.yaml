      - number: '3.4'
        title: Switching Costs, Lock-In, and Morphi’s Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Switching costs in humanoid robotics will come from three places: systems integration, task-specific data,
              and

              safety or workflow validation inside the customer site. Agility is the clearest published example because
              Arc is

              explicitly positioned as the layer connecting Digit to broader warehouse automation. Apptronik likewise
              frames

              Apollo as a deployable platform rather than a one-off robot, and Figure’s home + Helix narrative points
              toward a

              vertically integrated stack. Once customers start tuning workflows, validating safety, and generating task
              data,

              swapping platforms will become harder than the current pilot-heavy market implies.


              Morphi’s putative moat is its closed-loop data system. That could become meaningful if Morphi’s training
              loop

              improves generalization faster than better-funded rivals. But today this is still a claim, not a
              demonstrated

              market fact. Morphi lacks the public deployment volume of Agibot, the enterprise proof of Agility, the
              capital

              scale of Figure or Apptronik, and the explicit price signal of Unitree. Those gaps create four competitive
              risks:

              commercialization lag, funding-arms-race risk, hardware commoditization, and geopolitical segmentation for
              Chinese

              vendors.


              The most constructive interpretation is that Morphi is trying to win a different layer of the stack: the
              quality

              of embodied data and adaptation speed rather than first-wave brand recognition. The burden of proof,
              however,

              remains on Morphi to show that its data loop translates into superior economics or capability once real
              buyers are

              involved.
