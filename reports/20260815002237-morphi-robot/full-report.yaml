            body: >-
              Morphi is one of the rare seed-stage robotics companies whose public technical narrative directly matches
              its founders’ prior operating history. Huang Qingqiu built autonomous-driving data systems at Huawei and
              is now applying the same closed-loop philosophy to embodied intelligence, while Gao Wenli contributes
