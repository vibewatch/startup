        title: Workflow, Deployment Path, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Morphi’s public workflow starts with industrial and semi-structured environments rather than with the
              home.

              Crunchbase describes manufacturing as the near-term focus. Huang adds that Morphi is also collecting data
              in

              hotels and mixed residential-commercial apartment environments to broaden robot exposure without
              pretending that

              household generalization is solved. That suggests a workflow in which Morphi first identifies a
              constrained

              scenario, gathers demonstration and interaction data, performs post-training and pretraining updates, and
              then

              iterates toward broader task coverage.


              The company’s public roadmap is still sparse but not empty. 36Kr reporting places the founding in 2025.
              The

              official site and privacy/cookie materials were live by March 2026. Crunchbase recorded the July 2026
              funding

              step-up. KrASIA’s August 2026 interview says Morphi has already completed post-training on physical
              robots,

              is doing pretraining on open-source models, and expects to begin training its own native model near the
              end of

              2026 once enough data is accumulated. Those are meaningful stage markers, but they are not deployment
              proof.


              Peer evidence helps define the maturity bar Morphi has not yet crossed. Figure publicly demonstrates
              high-rate

              upper-body VLA control and BMW production contribution, while Agibot publishes one-click deployment
              tooling,

              Longcheer line integration, and simulation-first rollout claims. Morphi’s roadmap therefore reads as
              technically

              coherent but still pre-proof: the next milestone is not another narrative statement but a publicly
              evidenced

              product or deployment artifact.
