  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing, and Monetization Logic
        blocks:
          - type: paragraph
            body: >-
              Morphi has not publicly disclosed a product catalogue, price sheet, contract model, or revenue line item.

              What it has disclosed indirectly is a commercialization sequence. Crunchbase News says Morphi is focused
              first

              on manufacturing and only ultimately on a general-purpose home robot. KrASIA’s interview with founder
              Huang

              Qingqiu explains why: Morphi is building a closed-loop learning system and collecting data in
              semi-structured

              environments before trying to generalize into the home. Financially, that means the company’s likely first

              revenue is not consumer robot sales; it is some combination of enterprise pilot contracts, hardware
              deployment

              revenue, commissioning and integration services, and possibly scenario-specific data or software services.


              Because Morphi does not publish its own pricing, peers are the best public monetization proxies. Unitree’s
              G1

              establishes a low-end public humanoid price anchor at $13.5K. Agibot provides richer evidence of a layered

              revenue model: X2 is listed at $24,240 and A2 Lite at $44,560; the A2 Ultra has no public price but is
              already

              framed as a commercial B2B deployment product; add-ons such as group control, skill packs, and VR control
              kits

              require additional payment; and the business-cooperation page explicitly markets not only robot SKUs but
              also

              “Integrated Data-solution for Embodied AI” and “Data Service.” That combination—hardware, services, and

              software/data attach—is likely the economically relevant template for Morphi if its closed-loop thesis
              turns

              into sellable customer value.


              The important caution is that proxy pricing is not Morphi pricing. List price is not realized ASP,
              software

              attach does not prove software scale, and manufacturing-first focus does not prove signed factory revenue.

              Still, the available evidence supports a practical view: Morphi’s near-term monetization should be modeled
              as

              enterprise robotics infrastructure with optional future home upside, not as an immediately scalable
              consumer

              device business.
