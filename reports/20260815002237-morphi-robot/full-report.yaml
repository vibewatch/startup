      - number: '8.3'
        title: Bull / Base / Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The scenario model should stay simple because Morphi's denominator is still private. In the bull case, the
              company wins meaningful factory deployment, proves that its closed-loop training system compounds faster
              than rival approaches, and ships a native model that matters for real commercial tasks. In that world,
              Morphi can plausibly become one of a handful of China humanoid leaders, making an $8-15 billion outcome
              conceivable over the next cycle. In the base case, deployment works in constrained settings but remains
              niche, and the company grows into a respectable industrial robotics business without clearly dominating
              the stack.


              The bear case is equally real. If the data-flywheel thesis does not create meaningful separation, if
              hardware-first peers win the Chinese market, or if IP and geopolitical constraints narrow commercial
              optionality, Morphi's current entry price leaves little protection. That is why probability-weighted logic
              matters more than absolute TAM enthusiasm.
            claimRefs:
              - CV007
              - CV008
              - CV009
