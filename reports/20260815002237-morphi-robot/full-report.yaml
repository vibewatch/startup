        title: Pricing, Packaging, and GTM Distribution
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is low across the sector, and that by itself is a competitive factor. Unitree
              is the

              outlier because it publishes a concrete G1 price and detailed spec sheet, making it the clearest price
              signal in

              the market. 1X publishes a strategic consumer price aspiration around $20K through third-party profiles,
              but not

              a broad commercial price card. Agility gives economic framing rather than list price, comparing Digit
              economics

              against human labor and keeping contract details private. Figure and Apptronik emphasize capability,
              deployment,

              and platform language rather than public pricing.


              Morphi is even less transparent: there is no public SKU, no price, and no named contract model. That is
              normal

              for an early-stage robotics company, but in competitive terms it means buyers cannot yet benchmark Morphi
              against

              better-known alternatives. The category’s GTM models are diverging: Agility and Apptronik lean into
              enterprise

              integration and service-heavy deployments, Figure straddles enterprise proof and consumer aspiration, 1X
              blends

              home narrative with enterprise use cases, while Unitree pushes more price-visible hardware into the
              market.


              If humanoid hardware commoditizes faster than embodied intelligence software, the competitors with the
              best data,

              integration stack, and customer proof will retain pricing power. If not, low-price hardware leaders like
              Unitree

              can pull the entire category toward margin compression before Morphi has time to establish a
              differentiated lane.
