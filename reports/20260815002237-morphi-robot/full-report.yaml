      - number: '6.4'
        title: Expansion Logic, Concentration Risk, and Customer Verdict
        blocks:
          - type: paragraph
            body: >-
              Morphi’s most plausible expansion loop runs from one constrained manufacturing or semi-structured site
              into more

              tasks, then more sites, then adjacent verticals, and only later toward broader home-like environments.
              That

              expansion logic is consistent with the company’s technical narrative, but it is still unvalidated by
              public

              customer evidence. The biggest customer risk is therefore concentration by default: if Morphi’s first real

              commercial account exists but is not publicly disclosed, investors have no way to know whether the
              business is

              diversified or effectively single-customer.


              Procurement friction and geopolitics compound that risk. Industrial customers require long validation
              cycles, and

              Reuters/IEEE coverage of U.S. restrictions on Chinese robots suggests that some western
              government-adjacent or

              security-sensitive buyers could remain closed regardless of technical quality. At the same time, China’s
              supply-

              chain density and manufacturing demand create a large domestic opportunity if Morphi can prove value
              inside a

              limited number of lighthouse sites.


              The verdict is straightforward: Morphi’s likely customer profile is understandable, but its actual
              customer base,

              adoption quality, and expansion durability are not yet public. This chapter therefore grades the customer
              story as

              strategically plausible but evidentially weak.
