  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and geopolitical risk
        blocks:
          - type: paragraph
            body: >-
              Morphi is building into a regulatory environment that is becoming more structured, not less. China’s first

              national humanoid robotics and embodied-AI standard system now covers the industrial chain and lifecycle,

              including application, safety, ethics, data lifecycle, model training, and deployment processes. TC260’s
              2026 AI

              ethics-safety guidance goes further by emphasizing privacy, security, human oversight, audit logs,
              incident

              reporting, and risk assessment across the AI lifecycle. For Morphi, that means the compliance burden is
              likely to

              expand in parallel with product ambition: every new deployment scenario creates more data, safety, and
              governance

              responsibilities.


              Morphi’s public legal disclosure remains thin. The privacy route exists, but the public surface is not
              rich enough

              to demonstrate mature governance, certification, or incident controls. That is especially important
              because the

              company’s research narrative explicitly depends on real-world data collection in semi-structured
              environments.

              Collecting embodied data from factories, hotels, or mixed residential-commercial sites can create privacy,

              consent, workplace-monitoring, and security obligations that are materially harder than a lab-only
              robotics

              program.


              Geopolitics adds a second legal layer. By 2026, U.S. lawmakers had already introduced legislation
              targeting

              Chinese robots in government use, and subsequent coverage framed the issue as part of a broader
              technology-

              sovereignty push. Even if Morphi never sells to U.S. federal agencies, the signal can spill into
              enterprise

              procurement, insurance, or diligence behavior in western markets.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
