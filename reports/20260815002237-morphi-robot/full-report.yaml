  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Morphi is not pursuing the entire robotics sector; it is pursuing the embodied-intelligence subset where a

              robot must move through human-built environments, perceive cluttered scenes, manipulate objects, and adapt
              to

              changing tasks. That boundary includes humanoid or semi-humanoid robot hardware, embedded control and
              model

              software, deployment integration, data-collection and labeling loops, and maintenance or service
              contracts. It

              excludes fixed-arm industrial robots that already dominate highly structured high-speed work, warehouse
              AMRs

              without dexterous manipulation, and software-only AI systems without physical embodiment. The question is
              not

              whether those categories are valuable—they are—but whether Morphi’s closed-loop-learning approach is aimed
              at

              them. Public evidence says it is not.


              The company’s own positioning narrows the boundary further. Crunchbase frames Morphi as
              manufacturing-first with

              a long-term home-robot ambition, while KrASIA describes Morphi collecting embodied data in hotels,
              mixed-use

              apartments, and other commercial environments. That combination implies a market entry sequence running
              from

              structured factory workflows into semi-structured service settings and only later into household autonomy.

              Buyers in those early segments are not consumers; they are manufacturing operators, facilities teams, and
              pilot

              programs seeking either labor substitution or differentiated service experiences.


              Status-quo substitutes remain formidable. In manufacturing, the substitutes are human labor, fixed
              industrial

              robots, cobots, and purpose-built automation cells. In service environments, substitutes include human
              staff,

              cleaning robots, concierge kiosks, delivery bots, and other narrow-service machines. Morphi only wins if a

              generalist embodied system can deliver flexibility that offsets higher capital cost and higher deployment

              complexity than those substitutes.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM024
              - CM025
              - CM026
              - CM027
