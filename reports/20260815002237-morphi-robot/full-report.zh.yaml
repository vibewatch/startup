  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: Morphi Robot $1B 种子轮估值下的投资决策逻辑，展示关键决策节点。
    data:
      nodes:
        - id: seed-valuation
          label: 种子轮 $1B（2026 年 7 月）
          detail: 中国具身 AI 初创公司最受关注的早期估值标记；Alibaba + Tencent 参投
        - id: factory-bet
          label: 制造业优先部署假设
          detail: 结构化工厂环境相比消费者场景更能降低早期商业收入风险
        - id: data-flywheel
          label: 闭环数据飞轮
          detail: 可穿戴设备 + 自动标注 + 评估闭环；核心差异化主张
        - id: model-risk
          label: 原生模型风险
          detail: 目标是 2026 年底；投资时仍未验证
        - id: bear-case
          label: 熊市（35%）：未能打出差异化
          detail: 数据飞轮没有跑通；开源模型和既有巨头压缩价值；0-0.3x
        - id: base-case
          label: 基准（45%）：细分场景商业成功
          detail: 工厂部署跑通，但只部分兑现；2-4x；$2-4B 估值
        - id: bull-case
          label: 牛市（20%）：中国人形机器人龙头
          detail: 工厂场景加后续家庭可选性；8-15x；$8-15B 估值
      edges:
        - from: seed-valuation
          to: factory-bet
          label: 核心商业假设
        - from: seed-valuation
          to: data-flywheel
          label: 技术差异化
        - from: factory-bet
          to: base-case
          label: 部分兑现
        - from: factory-bet
          to: bull-case
          label: 随扩张全面兑现
        - from: data-flywheel
          to: model-risk
          label: 必须在 2026 年底前验证
        - from: model-risk
          to: bear-case
          label: 原生模型失败
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
      - CV009
