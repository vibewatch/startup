      - number: '3.2'
        title: 同行画像与相对准备度
        blocks:
          - type: paragraph
            body: >-
              Figure 是最强的资本与野心参照。其官网现在用 Figure 03 营销家庭辅助，而更早的 F.02 叙事聚焦 BMW 制造场景。Humanoid Index 给 Figure 的估值是 $39
              billion，员工超过 800 人，状态为试点——远超 Morphi 的公开成熟度。Agility 是最强的商业企业参照：其解决方案页面突出 Digit、Arc 工作流控制，以及
              Amazon、GXO、Schaeffler 等具名客户引用；Humanoid Index 将其标为商业化状态，融资超过 $641M。

              Apptronik 是美国最清晰的制造与仓储同行。Apollo 被定位为面向制造、仓储和零售工作的灵活人形平台，Humanoid Index 报告其处于早期商业状态，有 Mercedes-Benz
              部署伙伴，估值超过 $5.5B。1X 更接近家庭辅助光谱的一端：其融资公告把 NEO 与家庭辅助绑定，同时服务物流和安保企业客户；Humanoid Index 强调其目标价格为 $20K。Unitree
              是最强的价格破坏威胁：G1 页面公布 $13.5K 标价和明确规格，比那些不公开价格的同行激进得多。

