              - CV008
              - CV009
      - number: '8.2'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >-
              Morphi 不能用收入或 EBITDA 干净估值，因为公司没有披露收入基础。正确框架是“里程碑 + 可比公司”：市场愿意为具身 AI
              同业的创始人履历、生态背书、制造准备度、客户证明和技术差异化付多少钱。这个框架马上解释了为什么 Morphi
              有争议。它远低于全球领导者拿到的最热头部估值标记，但也远高于许多更早期机器人公司在积累多站点部署、经审计单位经济或清晰平台证据之前的历史融资水平。

              可比组因此两面都能解释。Unitree、Figure 和 Physical Intelligence 说明，只要投资人相信一家公司会掌握机器人栈的关键层，大赢家可以长到多大。Agility、1X 和 Boston
              Dynamics 则提醒投资人，商业化成熟度、硬件执行和战略价值，并不总是需要一开始就给独角兽定价。Morphi 当前估值，最适合解读为带溢价的中国期权押注，而不是已证明的公允价值。
            claimRefs:
              - CV003
              - CV004
