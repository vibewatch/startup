  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、定价与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Morphi 没有公开产品目录、价格表、合同模式或收入科目。它间接披露的是商业化顺序。Crunchbase News 称，Morphi 先聚焦制造业，最终才是通用家庭机器人。KrASIA
              对创始人黄青丘的访谈解释了原因：Morphi
              正在搭建闭环学习系统，在半结构化环境中采集数据，然后再尝试泛化到家庭。财务上，这意味着公司最早的收入大概率不是消费级机器人销售，而是企业试点合同、硬件部署收入、调试与集成服务，以及可能的场景特定数据或软件服务的某种组合。

              Morphi 不公布自身定价，因此同行是最好的公开变现代理。Unitree 的 G1 给出了 $13.5K 的低端公开人形机器人价格锚。Agibot 提供了更丰富的分层收入模型证据：X2 标价
              $24,240，A2 Lite 标价 $44,560；A2 Ultra 没有公开价格，但已经被描述为商业 B2B 部署产品；群控、技能包、VR 控制套件等附加项需要额外付费；商业合作页面还明确营销机器人 SKU
              之外的「Integrated Data-solution for Embodied AI」和「Data Service」。如果 Morphi 的闭环论点能变成可销售的客户价值，这种硬件、服务、软件 /
              数据附加的组合，很可能就是经济上相关的模板。

              关键提醒是，代理定价不是 Morphi 定价。标价不是实际 ASP，软件附加不等于软件规模化，先做制造业也不等于已经签下工厂收入。不过，现有证据支持一个务实看法：Morphi
              近期变现应建模为企业机器人基础设施，带有未来家庭场景可选项，而不是马上可规模化的消费电子业务。
