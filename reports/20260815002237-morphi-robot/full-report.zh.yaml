      - number: '6.4'
        title: 扩张逻辑、集中度风险与客户结论
        blocks:
          - type: paragraph
            body: >-
              Morphi
              最合理的扩张循环，是从一个受约束的制造业或半结构化场地出发，先扩到更多任务，再扩到更多站点，然后进入相邻垂直领域，最后才走向更接近家庭的广泛环境。这个扩张逻辑与公司的技术叙事一致，但公开客户证据尚未验证。最大的客户风险因此是默认集中：如果
              Morphi 已经有第一个真实商业账户但未公开披露，投资人无法判断业务是否多元，还是实际等同于单一客户。

              采购摩擦和地缘政治会叠加这一风险。工业客户需要漫长验证周期；Reuters / IEEE
              关于美国限制中国机器人的报道也提示，一些西方政府相邻或安全敏感买方可能无论技术质量如何都不会开放。同时，中国供应链密度和制造业需求带来大型国内机会，前提是 Morphi 能在少数灯塔场地证明价值。

              结论很直接：Morphi 的可能客户画像可以理解，但实际客户基础、采用质量和扩张持久性尚未公开。因此，本章把客户故事评为战略上合理、证据上薄弱。
