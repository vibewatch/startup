      - number: '6.3'
        title: 持久性、留存与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Morphi 没有公开 NRR、GRR、流失、续约、参考满意度或多站点扩张数据，留存因此完全未被证明。在机器人行业，留存通常要等客户闯过几道难关后才会出现：试点批准、场地准备、安全验证、集成、稳定运行和 ROI
              复盘。BMW 对 Figure 的多月试用、GXO 从概念验证转向与 Agility 的多年 RaaS，以及 Apptronik 仍早期的 Mercedes
              试点，都说明客户采用是分阶段采购流程，而不是一个简单的“签约客户”事件。

              对 Morphi
              来说，即便未来出现具名试点，也不能单独消除持久性风险。真正的证明是复购、多产线或多站点扩张、稳定在线率，以及客户愿意公开背书。这些目前都不可见。可能的采购摩擦很高：工厂客户在把具身智能部署从实验扩大之前，需要工作流匹配、安全信心、集成支持和可信
              ROI 路径。

              在 Morphi 披露续约或扩张行为之前，唯一稳妥的判断是：留存和满意度未知，而不是前景良好。
