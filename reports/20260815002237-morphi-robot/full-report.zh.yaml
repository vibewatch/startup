      - number: '3.3'
        title: 定价、包装与市场进入渠道
        blocks:
          - type: paragraph
            body: >-
              整个行业的公开定价透明度都很低，这本身就是竞争因素。Unitree 是例外，因为它公布了具体 G1 价格和详细规格表，成为市场上最清晰的价格信号。1X 通过第三方画像公布过约 $20K
              的战略性消费者价格目标，但没有广泛商业价目表。Agility 给出经济性框架而非标价，把 Digit 经济性与人工对比，同时保留合同细节。Figure 和 Apptronik
              更强调能力、部署和平台语言，而不是公开定价。

              Morphi 更不透明：没有公开 SKU、价格或具名合同模式。这对早期机器人公司来说正常，但放到竞争层面，意味着买方还无法把 Morphi
              与知名度更高的替代方案做基准比较。这个类别的市场进入模式正在分化：Agility 和 Apptronik 倾向企业集成和重服务部署，Figure 横跨企业验证与消费者野心，1X
              把家庭叙事与企业用例混合，Unitree 则把价格更可见的硬件推向市场。

              如果人形硬件比具身智能软件更快商品化，那么拥有最好数据、集成栈和客户验证的竞争者会保住定价权。否则，Unitree 这类低价硬件领导者会在 Morphi 来得及建立差异化赛道之前，就把整个类别拉向利润率压缩。
