      - number: '7.2'
        title: 运营、安全与技术风险
        blocks:
          - type: paragraph
            body: >-
              Morphi 的产品叙事把几件难事绑在一起：自研人形机器人硬件、具身基础模型、闭环学习、高效真实世界数据采集和跨场景泛化。单拎任何一项都很难。让一家种子阶段公司同时推进这些事项，会叠加失败模式。Morphi
              的招聘语言在这里有参考价值，因为它暴露了难点在哪里：感知、本体设计、运动控制、VLA、大规模数据训练和基础设施都在成为活跃工作流。这是技术野心信号，也是运营风险信号。

              物理场景放大了安全和可靠性风险。闭环学习有吸引力，因为它承诺靠部署数据快速改进；但它也意味着学习系统暴露在嘈杂、变化的真实世界行为里，而不是边界整齐的基准测试。Figure、Agility、Apptronik
              等公开同业都说明，有意义的商业证明需要时间、受约束任务和运营方监督。Morphi 还没有发布在线率、小时数、cycle time 或无事故生产使用的同等证据。

              最大的技术风险不是 Morphi 做不出演示，而是公司能做出有能力的演示，却无法把它变成可靠、可支持、多站点运营。模型承诺和现场可靠性之间的这道缝，正是机器人项目常常断裂的地方。
