chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与公司足迹
        blocks:
          - type: paragraph
            body: >-
              Morphi Robot
              对外以墨奇智能亮相，是一家具身智能机器人公司，想做全栈软硬件平台，而不是狭义零部件供应商。官网称，公司聚焦具身智能机器人，自研范围覆盖通用人形本体、具身基础模型、数据采集系统和跨场景泛化引擎。它的顶层愿景很大，也明显面向消费者：官网称
              Morphi 想打造能理解并适应真实世界的机器人，采用「生成—理解—决策」架构，靠数据飞轮迭代，最终把通用人形机器人从实验室带进数百万家庭。这个愿景与 1X、Figure、Agibot
              等后期玩家的行业叙事一致，但 Morphi 的商业化进度早于它们很多。

              公开文件也显示，Morphi 的公司足迹尚未统一。Crunchbase News 称这家公司位于南京。但 Morphi 的招聘站点租户名称是 Shanghai Morphi Wanxiang
              Intelligent Technology Co., Ltd.；官网页脚和隐私政策文案则标注 Shenzhen Morphi Intelligent Technology Co.,
              Ltd.，并列出深圳湾生态科技园通信地址。最合理的解读是，Morphi 可能在中国多地使用多个法律实体或运营基地，同时在国际上用同一个产品品牌对外呈现。尽调时，投资人应把总部、IP
              归属和员工所属实体视为需要一手文件确认的问题，而不能默认品牌自然对应单一法律壳。

              阶段显然还是种子 / 天使期，而不是增长期。公开来源一致称，公司在 2026 年中成立不到一年，创立于 2025
              年，尚未推出产品，仍在搭建原生具身模型栈。公开信息没有披露收入、客户数量、董事会构成或经营指标。大愿景、重融资、低经营披露——这组组合，是本报告后续分析的核心框架。
