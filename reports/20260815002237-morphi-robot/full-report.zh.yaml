      - number: '1.2'
        title: 创始人、领导层谱系与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Morphi 最有实质信息量的公开领导层证据，来自中文报道及其翻译稿对创始人履历的描述。36Kr 称，创始人为黄青丘和高文立。黄青丘是信号更强的技术人物：KrASIA 翻译 36Kr 访谈时写到，他曾是
              Huawei Genius Youth，2020 年加入 Huawei 汽车业务，后负责自动驾驶 AI，工作覆盖 LiDAR 感知、传感器融合系统和 Huawei 更广泛的辅助驾驶栈，并从零搭建 Huawei
              的自动驾驶数据工程系统。这段经历与 Morphi 宣称的技术路线高度相关，因为 Morphi
              的论点不是自己已经解出了通用机器人智能，而是从自动驾驶迁移过来的闭环数据基础设施，可以让学习速度快过只依赖遥操作演示的对手。

              高文立看起来提供运营与商业化上的平衡。36Kr 称，高文立在 Huawei 任职十一年，覆盖研发、产品管理和海外区域管理。公开材料没有明确写出高文立的 CEO
              头衔，但履历强烈暗示，他带来的是跨职能执行、产品化和国际化运营经验，补足黄青丘的数据与自治技术背景。公开证据还显示，团队仍在招募高级运营人才：36Kr 报道，Morphi 聘请曾任 Horizon
              Robotics 具身智能运营负责人的林天威，来牵头具身运营方向。

              反面是关键人集中度极高。公开信息没有识别出更宽的高管梯队、具名董事会、独立董事或披露的继任安排。因此，Morphi 依赖少数刚从 Huawei
              系统离开的高管，把自动驾驶经验转化为机器人执行能力。这种创始人与市场的匹配是优势，但在种子阶段，也意味着技术、运营和融资风险都紧紧系在少数人身上。
