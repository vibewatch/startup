      - number: '4.3'
        title: 公开牵引信号与缺失的财务证据
        blocks:
          - type: paragraph
            body: >-
              Morphi
              的公开牵引披露几乎全是定性信息。公司有大额融资事件、创始人履历和连贯产品论点，但没有公开具名客户、出货量、收入、订单积压，也没有利用率或部署统计。这与那些披露并不完美的机器人同行在公开市场展示的信息，有实质差别。Symbotic
              的 2025 10-K 披露约 $22.5 billion 订单积压、预期收入确认节奏、净亏损和 $1.245 billion 现金余额。Serve Robotics 的 2025 10-K 披露收入仅 $2.7
              million，净亏损 $101.4 million，现金 $106.2 million，流动资源 $233.4 million，并补充披露了广告、车队数据变现和软件授权等收入野心。

              这些文件并不让 Symbotic 或 Serve 成为 Morphi
              的直接经营可比公司。它们确立的是：在机器人行业承销收入质量和资本充足性，需要什么证据标准。没有客户数量、合同模式、订单价值、现金、烧钱速度和毛利率数据，Morphi
              的财务故事就只能停留在叙事代理上。即便有关于中国成本基础或投资人热情的正面第三方信号，也无法解决核心问题：公开信息仍不足以判断 Morphi
              更接近高毛利的软件驱动型机器人平台，还是由风险资本补贴的资本密集型试点业务。

              对投资人来说，数据缺席本身就是结论。Morphi 应被视为一个承销前尽调标的，其公开财务证据门槛尚未达到。
