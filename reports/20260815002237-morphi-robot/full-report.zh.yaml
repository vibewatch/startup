      - number: '6.2'
        title: 具名客户证明与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Morphi 目前没有公开具名客户证明。在已审阅的 Morphi 材料中，没有找到客户标识、工厂名称、引用语、部署里程碑、出货 / 部署数量、运行小时数或结果指标。这不代表 Morphi
              没有试点；它只意味着外部投资人今天无法验证任何试点。

              把同业基准放进来，缺口更清楚。BMW 与 Figure 提供了公开可见、由运营方确认的最强人形机器人制造业证明：BMW 称 Figure 02 参与生产超过 30,000 辆 BMW X3，搬运超过 90,000
              件钣金部件，并累计约 1,250 个运行小时。Figure 自己的新闻索引显示，这一关系延续到 2026，F.03 进入 BMW，另有 Catalyst Brands 协议。Agility
              的公开页面和第三方部署追踪把 Digit 关联到 GXO、Amazon、Toyota、Mercado Libre 和 Schaeffler 等具名运营方；GXO 也反复被称为首个商业化人形机器人 RaaS
              部署。Apptronik 与 Mercedes 的关系仍处于试点阶段，但至少有名字。Agibot 的 Longcheer 部署更进一步，把人形机器人工作绑定到电子制造的具体产线环境。即便 1X
              主打消费家庭叙事，也继续提到物流和安保领域的企业客户。

              在这个格局下，Morphi 的采用轨迹还无法衡量。因此，本章把同业具名客户证明视为 Morphi 最终必须达到的基准，而不是 Morphi 已经达到的证据。
