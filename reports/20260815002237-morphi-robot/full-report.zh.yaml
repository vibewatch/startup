  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              Morphi 所处的监管环境正在变得更有结构，而不是更松散。中国首个国家级人形机器人和具身 AI 标准体系已经覆盖产业链和生命周期，包括应用、安全、伦理、数据生命周期、模型训练和部署流程。TC260 的 2026
              AI 伦理安全指南更进一步，强调 AI 生命周期中的隐私、安全、人类监督、审计日志、事故报告和风险评估。对 Morphi
              来说，合规负担大概率会与产品野心同步扩张：每增加一个部署场景，就会增加数据、安全和治理责任。

              Morphi
              的公开法律披露仍然薄。隐私路由存在，但公开表面不足以证明成熟治理、认证或事故控制。这一点尤其重要，因为公司的研究叙事明确依赖在半结构化环境采集真实世界数据。从工厂、酒店或混合住宅-商业场地采集具身数据，可能产生隐私、同意、职场监控和安全义务，难度明显高于只在实验室做机器人项目。

              地缘政治增加了第二层法律风险。到 2026 年，美国议员已经提出针对政府使用中国机器人的立法；后续报道也把这一议题放进更广的技术主权推动中。即使 Morphi
              从不卖给美国联邦机构，这个信号也可能外溢到西方市场的企业采购、保险或尽调行为。
