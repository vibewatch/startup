      - number: '5.4'
        title: 差异化、依赖与信任 / 合规缺口
        blocks:
          - type: paragraph
            body: >-
              Morphi 最强的差异化主张是数据系统质量。Huang 曾在 Huawei 搭建自动驾驶数据基础设施，这与 Morphi 的闭环路径直接相关；招聘页面强调感知、本体设计、运动控制、VLA
              和大规模数据训练，也暗示公司想掌握完整具身栈，而不是浅层拼接第三方组件。如果跑通，护城河就不只是机器人本体，而是跨任务、跨场景更快泛化的循环。

              主要依赖风险在于，这套架构看起来仍要站在更大生态上，而生态前沿推进很快。Figure、NVIDIA、OpenVLA 和 π0 都说明，开放或半开放 VLA 工具正在快速改善。这提高了 Morphi
              的证明门槛：公司必须证明，自己的私有数据和运营闭环能比公共模型基线加通用硬件复合得更快。还有市场准入依赖：Reuters 和 IEEE
              关于美国拟限制中国机器人的报道意味着，即便技术上成功，中国平台也可能面对被切分的终端市场。

              信任与合规披露很薄。Morphi 的网页包暴露了 Shenzhen 法人、MIIT 备案、隐私路由和 Cookie
              同意逻辑，说明网站治理达到基线。但公开资料没有安全认证清单、没有安全更新政策、没有漏洞披露计划、没有在线率 / 可靠性报告，也没有说明如何管理物理安全、远程操控兜底或现场事故处理。对一家具身 AI
              公司来说，这是实质性尽调缺口，不是表面缺项。
