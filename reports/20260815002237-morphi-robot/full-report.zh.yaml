      - number: '4.2'
        title: 成本结构、市场进入打法与单位经济代理
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，人形机器人经济性仍主要受硬件复杂度、部署人力、质保风险和反复模型迭代成本驱动。Agibot 产品页提供了少见的具体成本代理：A2 Lite 按汽车级原则制造，每台有 92
              个检测点，质保覆盖一年或累计 3,000 小时运行。A2 Ultra 声称最多完成 2,000 小时行走验证，其中包括 360 小时连续无异常运行。这些披露都没有给出美元
              COGS，但清楚暗示，在任何公开标价之下，都压着不低的质检、支持和准备金成本。

              部署工具很重要，因为在人形硬件商品化之前，它是少数能改善毛利率路径的抓手之一。Agibot 的 Genie Studio 营销集成模型训练、量化、部署、数据采集、验证和远程监控。其与 Longcheer
              的工业案例研究称，一条真实消费电子产线从项目启动到投产用了四个月，产线集成本身在 36 小时内完成，并实现 24/7 运行、停机损失低于
              4%。具体财务条款未披露，但商业含义很清楚：如果部署能从定制工程变成可重复配置，服务利润率和销售效率会显著改善。

              市场进入打法也更像企业自动化，而不是消费电子。Figure 的 BMW 验证、Agility 的 Digit + Arc 工作流栈，以及 Apptronik 的制造 /
              仓储定位，都指向长周期直销、高客户教育成本和站点特定集成负担。Morphi 自己先做制造业，意味着传统 SaaS 的 CAC /
              回本周期指标不是第一视角。更该问的是试点到放量的转化、单站点部署人力、扣除质保和支持后的毛利率，以及软件 / 数据附加最终能否抵消硬件利润率压缩。
