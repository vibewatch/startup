  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、模块与当前成熟度
        blocks:
          - type: paragraph
            body: >-
              Morphi 还没有向市场提供清晰的公开 SKU 目录。官网描述的是一组产品资产：自研通用人形本体、具身基础模型、高效数据采集系统和跨场景泛化引擎。这种语言很重要，因为它把 Morphi
              定位为平台搭建者，而不是单一机器人本体供应商。同一官网称，这些组件要通过「生成—理解—决策」架构和数据飞轮协同，让机器人能在真实世界中自然移动、操作和互动。

              公开招聘语言提供了目前最强的成熟度信号。Morphi 的 Feishu
              招聘站称，公司的技术壁垒覆盖感知、本体设计、运动控制、VLA、大规模数据训练和基础设施，并明确表示团队不是在做实验室演示，而是从第一天就瞄准规模化交付。这与 Crunchbase
              对其先做制造业的描述一致，也与创始人黄青丘的解释一致：Morphi 在半结构化环境中采集数据，然后才尝试达到家庭机器人所需的完整通用性。

              局限在于，这些信息都没有把产品成熟度落到具体工件层面。公开信息中仍没有机器人名称、机械规格表、传感器 BOM、自由度披露，也没有公开客户部署。因此，Morphi
              应被描述为一个开发中的全栈具身智能平台，而不是商业规格已经明确的人形产品线。
