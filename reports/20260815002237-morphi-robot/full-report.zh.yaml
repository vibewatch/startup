      - number: '2.4'
        title: 增长驱动因素、采用约束与中国特有优势
        blocks:
          - type: paragraph
            body: >-
              中国的结构性优势，是 Morphi 市场相关性最强的论据。MERICS 称，中国拥有全球最大的工业机器人装机基础，并受益于深厚的 EV、电子、电池和零部件供应链，这些能力可以直接迁移到具身 AI 商业化中。IFR
              补充称，中国制造业已经运行约 2 million 台工业机器人，占全球年度工业机器人安装量的 54%；同时，第十五个五年规划把 AI 驱动机器人置于产业战略中心。MIT Technology Review
              进一步延展了这个观点：中国 EV 头部企业正在进入人形机器人，因为感知、电池、供应链和自动化经验已经重叠。

              但需求驱动不能抹掉采用约束。Gasgoo 认为，当前具身智能模型在训练分布之外仍会失效，并且每到一家工厂或一个家庭都需要定制适配。MERICS
              称，中国人形机器人对大规模部署来说仍太贵，成本可能至少要下降一半。IFR 明确提醒，通用人形工厂助手和家庭采用并不是近中期结果；在高速精密场景里，传统工业机器人仍有优势。RAN 对 MIIT
              六支柱标准体系的报道，以及 Hill Dickinson 的责任 / 隐私分析，都强化了同一点：安全与治理不是事后补丁，而是采用能否发生的门槛变量。

              最后一项约束是地缘政治。US News/Reuters 与 IEEE 均报道，2026 年美国两党议员推动限制联邦使用中国地面机器人。Morphi
              目前聚焦中国，因此即时商业影响有限；但更宽的启示是，市场可能在技术成熟之前就先按司法辖区分裂。这会影响估值，因为它限制了中国具身 AI 初创公司把早期技术成功转化为全球可替代需求的能力。
