      - number: '7.3'
        title: 伙伴、客户、制造与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Morphi 对这么年轻的公司来说，依赖栈异常密集。资本重要，因为人形机器人既吃硬件也吃数据；客户证明重要，因为融资胃口往往跟着可见部署里程碑走；制造重要，因为即便具身 AI
              软件够好，硬件成本、供应质量或现场支持负担失控也会拖垮产品。Morphi 的 $147 million 种子轮很大，但把硬件迭代、数据采集、招聘和未来制造规模考虑进去，并不明显过度。

              客户和伙伴集中度目前无法量化。上一章已经说明 Morphi
              没有公开具名客户证明，这意味着投资人无法判断商业学习是广泛发生，还是依赖一个隐藏灯塔账户。制造和供应链也有同样问题：公开披露没有指出关键供应商、合同制造商、零部件瓶颈或现场服务伙伴。

              战略投资方 Alibaba 和 Tencent 是有意义的正面因素，但也带来依赖风险。如果市场对 Morphi 的信心部分来自投资人信号，那么后续支持或生态客户引介一旦放缓，融资和商业化可能同时受冲击。在早期具身
              AI 公司里，这些依赖往往相关，而不是彼此独立。
