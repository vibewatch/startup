        - 高
        - 无法判断下一轮融资紧迫性
        - 提供基准 / 下行跑道期情景
      - - 计划资金用途
        - 推断：具身模型训练、数据闭环建设、招聘和制造试点
        - 中
        - 资金投向决定推进速度和风险曲线
        - 提供董事会批准的经营计划和资本开支承诺
      - - 下一轮触发条件
        - 大概率绑定具名部署、收入验证和单位经济性可见度
        - 中
        - 说明当前轮次是过桥资金，还是可支撑较长周期的资本底座
        - 提供下一轮募资或战略融资所需里程碑
      - - 债务 / 项目融资义务
        - 未找到公开披露
        - 中
        - 隐性负债会很快压缩跑道期
        - 按主体提供全部债务、担保和客户融资义务
