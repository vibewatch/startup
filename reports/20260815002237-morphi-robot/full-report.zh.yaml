      - number: '1.3'
        title: 融资、估值与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              以公司年龄看，Morphi 的融资规模异常大。Crunchbase News 将 Morphi Robot 列为 2026 年 7 月新晋独角兽之一，称公司完成由 Alibaba Group 和 Tencent
              领投的 $147 million 种子轮，估值 $1 billion。KrASIA 援引对 CTO 黄青丘的 36Kr 访谈称，Morphi 已完成超过 RMB 1 billion（约 USD 148
              million）的天使轮融资。36Kr 关于 Huawei 系具身 AI 创始人的更长文章也给出类似人民币口径：Morphi（文中写作 Moqi Intelligence）完成超过 RMB 1 billion
              天使轮融资，Alibaba 和 Tencent 均参与，投后估值 RMB 7 billion。不同来源对轮次标签写法不同——种子轮与天使轮并存——但金额和估值方向足够一致，可以把这次融资事件视为约
              $147-$148 million 的首次机构轮，投后约 US$1 billion / RMB 7 billion。

              比绝对金额更值得注意的是出资人。Alibaba 和 Tencent 在中国具身智能竞赛中不是被动财务投资方：两者坐拥云、消费、工业、生态和分发网络，可能影响算力获取、生态合作、应用集成和后续客户引荐。MERICS
              认为，中国的具身 AI 正与产业政策、EV 供应链和国产化目标深度交织。在这个背景下，Alibaba/Tencent 的支持给了 Morphi 品牌背书、融资动能和战略可选项，远超普通种子期公司。

              反向视角是，这种融资规模可能在经营证据出现之前先把估值拉到了前面。Gasgoo 指出，仅 Morphi 的天使轮融资就超过 RMB 1 billion——大致相当于传统硬科技 Series B
              轮融资规模——但公司仍没有公开产品发布或商业披露。这并不否定该轮融资；它意味着投资人应把 Morphi 当作一个预期很高的种子期公司，而不是已经去风险的工业机器人运营商。
