      - number: '5.3'
        title: 工作流、部署路径与路线图
        blocks:
          - type: paragraph
            body: >-
              公开信息里，Morphi 的工作流先从工业和半结构化环境切入，而不是家庭。Crunchbase 将制造业描述为近期重点。Huang 还表示，Morphi
              也在酒店和混合住宅-商业公寓环境采集数据，用来扩大机器人接触面，而不是假装已经解决家庭泛化。由此看，Morphi
              的流程大概率是：先识别受约束的场景，采集示范和交互数据，完成后训练与预训练更新，再迭代到更广的任务覆盖。

              公司的公开路线图仍然稀疏，但并非空白。36Kr 报道称公司成立于 2025。官网及隐私 / Cookie 材料已在 March 2026 上线。Crunchbase 记录了 July 2026
              的融资跃升。KrASIA 的 August 2026 采访称，Morphi 已经在物理机器人上完成后训练，正在基于开源模型做预训练，并预计在积累足够数据后，于 2026
              年底前后开始训练自己的原生模型。这些是有意义的阶段标记，但不是部署证明。

              同业证据有助于界定 Morphi 尚未跨过的成熟度门槛。Figure 公开展示高频上半身 VLA 控制和 BMW 生产贡献；Agibot 则发布一键部署工具、Longcheer
              产线集成以及仿真优先的落地主张。因此，Morphi 的路线图在技术上自洽，但仍处于证明前：下一座里程碑不是再讲一遍叙事，而是拿出公开可核验的产品或部署物证。
