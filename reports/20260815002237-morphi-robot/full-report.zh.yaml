      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              Morphi
              在叙事上容易融资，在财务上很难承销。乐观情景是连贯的：顶级战略投资人、来自自动驾驶的创始人与市场匹配、先制造业的顺序选择，以及可能在硬件之上创造更高价值数据和部署软件的闭环学习论点。悲观情景是，这些要素都还没有证明收入模型、利润率结构或自我融资扩张路径。

              同行公开证据最能支持三点结论。第一，人形硬件本身不太可能成为持久高毛利业务；软件、数据、部署工具和可重复运营都很重要。第二，即便有真实部署或公开文件的公司，仍然资本密集。第三，Unitree
              这类低成本硬件锚，提高了原始机器人本体在 Morphi 充分商业化之前就遭遇利润率压力的概率。Morphi
              仍可能变得有价值，但以今天的公开记录看，它应被估为一个早期、披露很少的机器人基础设施赌注，而不是已经去风险的运营公司。

              阻塞尽调问题很直接：具名试点、已入账或已签约收入、产品与服务层级定价、毛利率桥、现金余额、烧钱速度、现金跑道、法律实体财务映射，以及任何数据或软件附加的经济性。在这些信息给出之前，轮次规模只是投资人兴趣的信号，不是财务质量的证明。
