  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值概览
        blocks:
          - type: paragraph
            body: >-
              Morphi 的轮次价格是估值中最关键的事实：公司据报道在 July 2026 融资约 $147-$148 million，投后估值约 $1 billion / RMB 7 billion。对于一家成立于
              August 2025、公开层面仍处于收入前的创业公司来说，这是异常结果。放在 2026 年人形机器人热潮、中国产业政策推动，以及 Alibaba 和 Tencent
              作为投资方的信号价值下，这个估值并非不理性。但它意味着投资人买的是未来品类领导权，而不是当前经营证明。

              仅看公开证据，当前价格下最稳妥的判断是观察 / 继续研究。Morphi
              未来仍可能证明这一水平合理，前提是它能证明工厂可重复部署，证明数据飞轮改善现场表现，并交付一个在生产中有意义、而不只在演示里有效的原生模型。在此之前，这个估值更像期权溢价，而不是可承销的公允价值。
            claimRefs:
              - CV001
              - CV002
          - type: table
            tableRef: TV001
            claimRefs:
