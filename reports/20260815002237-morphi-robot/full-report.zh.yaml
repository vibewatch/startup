  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Morphi
              追的不是整个机器人行业，而是具身智能子集：机器人必须在人类建成环境中移动，感知杂乱场景，操作物体，并适应变化中的任务。这个边界包括人形或半人形机器人硬件、嵌入式控制与模型软件、部署集成、数据采集和标注闭环，以及维护或服务合同。它不包括已经主导高度结构化高速作业的固定臂工业机器人、不具备灵巧操作的仓库
              AMR，也不包括没有物理本体的软件 AI 系统。问题不是这些类别有没有价值——它们当然有——而是 Morphi 的闭环学习路线是否瞄准它们。公开证据显示，并不是。

              公司自己的定位进一步收窄了边界。Crunchbase 将 Morphi 描述为先做制造业、长期有家庭机器人野心；KrASIA 则描述 Morphi
              在酒店、商住混合公寓和其他商业环境中采集具身数据。这组信息意味着，它的市场进入顺序大概率是从结构化工厂流程，走向半结构化服务场景，最后才进入家庭自治。早期细分市场的买方不是消费者，而是制造业运营方、设施团队，以及希望做劳动力替代或差异化服务体验的试点项目。

              现状替代品仍很强。在制造业，替代方案是人工、固定工业机器人、协作机器人和专用自动化单元。在服务环境中，替代方案包括人工员工、清洁机器人、礼宾自助终端、配送机器人和其他窄服务机器。只有当通用具身系统交付的灵活性足以抵消更高资本成本和更高部署复杂度时，Morphi
              才能胜过这些替代品。
