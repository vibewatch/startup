    sections:
      - number: '6.1'
        title: 可能客户细分、买方 / 用户 / 付款方与当前可见度
        blocks:
          - type: paragraph
            body: >-
              Morphi
              公开宣称的客户楔子是制造业，不是家庭。这一点很重要，因为即便没有具名账户，它也界定了可能的买方组合。最合理的初始买方是工厂、仓库或工业运营组织，评估具身自动化能否处理重复、体力别扭或固定自动化难以覆盖的任务。用户比买方更具体：工厂操作员、自动化工程师、产线主管和集成团队会是直接运营用户；付款方大概率是工厂管理层、运营负责人或企业自动化预算负责人。

              Morphi
              创始人还表示，公司正在酒店和混合住宅-商业公寓环境采集数据。这些地点可能是试点伙伴、数据伙伴或原型客户，但公开记录没有披露它们是付费客户、共创场地，还是仅仅是数据采集点。这个区分很关键。帮助采集数据的场地，不等于拥有可引用
              ROI、续约意愿和扩张潜力的生产客户。

              关键结论是，从外部看，Morphi 的客户基础仍是假设。公开来源足以推断第一批客户大概是谁，但不足以验证他们到底是谁。投资人不应把“制造业优先”的定位直接等同于已有客户牵引。
