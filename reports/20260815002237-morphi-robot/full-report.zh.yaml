      - number: '2.3'
        title: 买方、用户与预算所有者分层
        blocks:
          - type: paragraph
            body: >-
              Morphi 最高确定性的买方细分市场是工业制造业，尤其是那些流程变化、用工紧张或安全条件让固定自动化不够经济的工厂。在这些场景里，可能的预算所有者是制造副总裁、工厂运营、工业工程团队，或由 CFO
              控制的资本设备预算。IDC 报告称，超过 80% 正在评估人形机器人的用户计划在未来三年把部署放在码垛、搬运、拣选和上下料；Goldman 与 IFR 也都认为，结构化环境是合乎逻辑的第一商业化区域。

              第二类买方是半结构化商业运营方——酒店、商住混合公寓、设施服务、零售导览及相关环境。KrASIA 对 Morphi
              数据采集策略的描述在这里很关键：公司已经用商业和混合用途场景中的清洁人员采集具身数据。这意味着，Morphi
              看到了那些不如工厂单元结构化、但重复度足以围绕其训练的任务价值。在这些环境里，预算所有者更可能是设施管理、运营或试点创新团队，而不是工业资本开支委员会。

              长期消费者 / 家庭市场应被视为叙事邻近项，而不是基准买方细分。1X 已经在以测试版形态定位家庭人形机器人，Hill Dickinson 也强调，机器人进入家庭后隐私、责任和公众信任问题会加剧。Morphi
              当前公开证据指向的是一条桥接策略：先在制造业和半结构化服务环境中学习，只有当可靠性、安全性和泛化能力显著改善后，再扩展到家庭。
