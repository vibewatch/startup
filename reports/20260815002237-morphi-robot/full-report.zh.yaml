  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接同行、既有厂商与替代品
        blocks:
          - type: paragraph
            body: >-
              Morphi 首先面对的是民营人形机器人专门公司，而不是整个自动化行业。最相关的直接同行包括 Figure、Agility、Apptronik、1X、Unitree、Agibot，以及在更宽企业层面上的
              UBTECH。这些公司都在追求能在人类环境中运行的通用或半通用具身机器人，但市场切入点差异很大：Figure 和 1X 现在强调家庭辅助叙事，Agility 聚焦仓储和物流运营，Apptronik
              强调制造、仓储和零售，Unitree 提供低价开发者和研究硬件，Agibot 强调中国制造业规模部署，UBTECH 则覆盖企业和服务机器人。

              既有替代品和直接同行同样重要。对工厂和仓库来说，真实买方选择往往不是「Morphi 对 Figure」，而是「人形机器人对固定工业自动化、协作机器人、AMR
              或更多人工」。这一点很关键，因为已经有公开部署证据的竞争者，可以证明自己比这些替代品更值得拿到试点预算；Morphi 仍必须先证明自己有资格进入预算讨论。

              这个类别也按地缘政治聚集。Forbes 的制造商调查和 MIT Technology Review 对中国 EV
              的分析都显示，领导力集中在美国和中国。这种集中既提高创新速度，也加大战略竞争；这也解释了为什么投资人会同时资助多支看似重叠的团队，而不是只押注一个明确赢家。
