      - number: '7.4'
        title: 人员、治理、缓释措施与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              Morphi
              的人员风险，与其说是绝对人数，不如说是判断力集中。年轻机器人项目通常依赖少数创始人和技术负责人来决定架构、场景选择、安全姿态、招聘和资本配置。早期这能加速进展，但如果团队过度扩张或关键技术负责人离开，也会提高脆弱性。Morphi
              的公开招聘足迹显示，公司在具身智能、机器人硬件、控制和基础设施上都有广泛需求，意味着用人缺口既宽又急。

              公司的公开实体图景尚未理清，进一步强化治理风险。前文发现，媒体、招聘和网页 / 法律痕迹分别指向 Nanjing、Shanghai 和 Shenzhen。这不证明有问题，但围绕 IP
              所有权、雇佣实体、合同签署和跨实体控制，确实产生了尽调问题。公司可以在成长中消化这种模糊；也可能在融资、采购或争议解决时被它绊倒。

              正确反应不是预设失败，而是定义具体否决条件。如果客户证明迟迟不出现，如果公司无法展示安全的生产可靠性，如果实体 / IP 控制仍然混乱，或如果商业牵引可见前融资动能恶化，Morphi 投资逻辑都应明显降级。
