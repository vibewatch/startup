      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              情景模型应保持简单，因为 Morphi 的分母仍是私有信息。乐观情景下，公司拿下有意义的工厂部署，证明闭环训练系统比竞品路线复合更快，并交付一个能支撑真实商业任务的原生模型。在那个世界里，Morphi
              有机会成为少数中国人形机器人领导者之一，下一个周期出现 $8-15 billion 结果并非不可想象。基准情景下，部署能在受约束场景中跑通，但仍偏小众，公司成长为体面的工业机器人业务，却没有明确主导整条栈。

              悲观情景同样现实。如果数据飞轮逻辑没有拉开有意义差距，如果硬件优先的同业赢下中国市场，或如果 IP 和地缘政治约束压窄商业可选空间，Morphi 当前入场价格几乎没有保护。因此，按概率加权思考，比绝对 TAM
              热情更重要。
            claimRefs:
              - CV007
