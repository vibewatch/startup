      - number: '2.2'
        title: 市场规模：多重口径、矛盾与实际边界
        blocks:
          - type: paragraph
            body: >-
              人形机器人市场足够大，能吸引有分量的资本，但已发布估算并不能直接横向比较，因为它们回答的是不同问题。MarketsandMarkets 给出明确硬件收入预测：全球人形机器人市场规模从 2026 年的 $5.41
              billion 增至 2035 年的 $50.27 billion；中国市场从 2025 年的 $0.40 billion 增至 2030 年的 $2.80 billion。Goldman Sachs
              Research 同时给出保守和扩张口径：其「AI accelerant」报告设定的基准情景，是 10–15 年周期内至少 $6 billion；如果设计、可负担性和公众接受度障碍被解决，蓝天情景到 2035
              年可达 $154 billion。Goldman 另一篇 2035 年文章则把全球市场放在 2035 年 $38 billion，并认为结构化制造业是第一个持久需求区。

              IDC 用出货量而不是收入衡量市场，预计 2030 年全球人形机器人出货量超过 510,000 台，CAGR 接近 95%；同时指出 2025 年出货量刚刚超过 18,000 台，其中超过 85%
              集中在演示、教育、数据采集和导览场景。这一点很重要，因为它说明市场仍处在极早期：投资人也许在讨论万亿美元劳动力替代叙事，但当前大多数出货还没有成为规模化工厂劳动力替代品。

              对 Morphi 而言，相关规模口径要比最宽泛的行业 TAM 更窄。公司没有公开客户名单、SKU 披露或出货数据，因此任何真正的 SAM 或 SOM
              都必须受证据约束。近期最有防守性的市场，是中国制造业和半结构化商业试点：买方已经接受机器人资本开支，中国供应链和政策支持最强，部署数据与模型改进之间的闭环也最容易高效运转。
