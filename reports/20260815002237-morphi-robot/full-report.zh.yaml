      - number: '1.4'
        title: 技术论点、产品状态与早期里程碑
        blocks:
          - type: paragraph
            body: >-
              Morphi 的产品仍在成形，但技术论点异常明确。KrASIA 对黄青丘的访谈描述的是一家围绕数据工程搭起来的公司，而不是靠炫目的模型分类讲故事。黄青丘称，Morphi
              已经搭建数据飞轮：用轻量可穿戴设备采集具身数据，强筛质量，按任务训练需求做分类和检索，自动标注真实标签，大规模评估模型，再回到现场补采弱项数据。他明确认为，行业需要一个类似自动驾驶的闭环数据系统，公司之间的差异会来自这个闭环里的成千上万项工程细节。

              这个世界观也解释了公司的市场进入顺序。Crunchbase 称 Morphi 先聚焦制造业，但最终想做通用家庭机器人。黄青丘自己的说法解释了为什么家庭终局仍然很远：具身模型还缺少应对复杂真实家庭的泛化能力，所以
              Morphi 正在酒店、商住混合公寓和其他半结构化环境中采集数据，让机器人扩大暴露面，又不需要马上达到完整的消费级可用性。他称，公司已经通过后训练在物理机器人上搭建系统能力，目前正在开源模型上做预训练，并预计在
              2026 年底附近、数据积累足够后，从零开始训练原生模型。

              同样重要的是缺失的里程碑：本报告审阅的公开来源没有找到已发布的机器人 SKU、具名商业客户、出货量或经过基准验证的生产部署。相比之下，Figure 和 Agility 等同行已经引用了真实制造或物流部署，中国同行
              Agibot 和 Unitree 也公开讨论本体放量和商业化。Morphi 现在的里程碑图景，因此是资本形成加技术系统建设，而不是产品市场验证。
