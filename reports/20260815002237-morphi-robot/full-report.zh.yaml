      - number: '3.4'
        title: 切换成本、锁定效应与 Morphi 护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              人形机器人的切换成本会来自三处：系统集成、任务特定数据，以及客户现场内部的安全或工作流验证。Agility 是最清晰的公开案例，因为 Arc 被明确定位为连接 Digit 与更广仓库自动化的层。Apptronik
              同样把 Apollo 描述为可部署平台，而不是一次性机器人；Figure 的家庭 + Helix 叙事则指向垂直集成栈。客户一旦开始调校工作流、验证安全并生成任务数据，换平台就会比当前以试点为主的市场看起来更难。

              Morphi 名义上的护城河是闭环数据系统。如果 Morphi 的训练闭环能比资金更足的对手更快改善泛化，这可能变得有意义。但今天它仍是一个主张，不是已经验证的市场事实。Morphi 缺少 Agibot
              的公开部署规模、Agility 的企业验证、Figure 或 Apptronik 的资本体量，以及 Unitree
              的明确价格信号。这些缺口带来四类竞争风险：商业化滞后、融资军备竞赛、硬件商品化，以及中国厂商面对的地缘政治分割。

              最建设性的解读是，Morphi 试图赢下技术栈中不同的一层：具身数据质量和适应速度，而不是第一波品牌声量。但证明责任仍在 Morphi 身上；它必须在真实买方参与后，证明数据闭环能转化为更好的经济性或能力。
