      - number: '8.4'
        title: 投资决策与尽调要求
        blocks:
          - type: paragraph
            body: >-
              实际投资问题不是 Morphi 是否有意思。它显然有。问题是，新投资人是否应在看到关键材料之前接受 $1 billion 种子轮估值：完整股权结构表条款、工厂管线质量、原生模型评估数据、实体与 IP
              所有权、关键人留任安排。这些项目决定 Morphi 只是一次热门融资事件，还是一个耐久平台的早期成形。

              公开记录因此支持有纪律地接触，而不是追高。只有当私人尽调证明复购、技术差异化和所有权卫生强于当前证据时，Morphi
              才应上调优先级。如果这些检查失败，这个估值应被视为偏高且可能重置。负担不在于预测完美，而在于证明 Morphi 实际进展显著领先于公开记录所暗示的阶段。
