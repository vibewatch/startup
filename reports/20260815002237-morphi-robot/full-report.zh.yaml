      - number: '4.4'
        title: 资本充足性、融资依赖与外部风险
        blocks:
          - type: paragraph
            body: >-
              Morphi 披露的融资——约 $147-$148 million、估值约 $1 billion——对于一家 2025
              年成立的公司来说很惊人，但这些信息不足以估算现金跑道。公司没有披露账上现金、月度烧钱速度、员工规模、资本开支承诺、债务或制造试点付款条件。投资人因此知道轮次规模，却不知道现金消耗速度。

              行业类比显示，真正商业化开始之后，烧钱仍可能长期居高不下。Symbotic 在 2025 财年仍报告 $91 million 年度净亏损，尽管它有巨额订单积压和超过十亿美元的现金头寸。Serve Robotics
              在 2025 年收入只有 $2.7 million，却通过直接发行和 ATM 发行计划募集约 $261 million 总收益。这不意味着 Morphi
              会准确走上其中任何一条路；但它说明，机器人公司在商业模式自我造血之前，可能消耗非常大的资金。

              Alibaba 和 Tencent 让 Morphi 的融资位置强于典型种子期硬科技初创公司。它们提供可信度、生态可选项，以及潜在的云、工业或分发关系。但战略投资人不能消除外部风险。Gasgoo 明确把具身 AI
              竞赛描述为成本越来越高、风险越来越大。MERICS 称，中国人形机器人比西方同行便宜，但对广泛部署而言仍太贵，成本可能至少要下降一半。与此同时，Reuters 和 IEEE
              报道的美国立法动作会限制政府使用中国机器人，提示地缘政治即使在底层技术改进时，也会收窄可变现终端市场。
