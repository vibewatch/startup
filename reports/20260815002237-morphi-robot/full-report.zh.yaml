      - number: '5.2'
        title: 闭环架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              关于 Morphi，公开资料里最完整的技术描述来自 Huang Qingqiu 接受 KrASIA/36Kr 采访。Huang 表示，Morphi 的核心优势不是给“机器人
              AGI”贴营销标签，而是一套面向具身数据的闭环系统。按他的说法，Morphi
              用轻量穿戴设备采集数据，强筛质量，按任务学习来分类和检索数据，自动标注真值，大规模评估模型，再到表现薄弱处重新采集数据。这套做法把自动驾驶的数据工程直接搬进机器人，也是公司最具体的架构主张。

              Morphi 的叙事也把自己放进 VLA 与机器人基础模型竞赛。Figure 的 Helix、NVIDIA Isaac GR00T、OpenVLA 以及 Hugging Face / Physical
              Intelligence π0 生态都指向前沿方向：语言条件动作模型、仿真辅助训练、跨本体数据，以及把机器人行为更新变成可重复软件流程的部署工具。Morphi
              没有公开说过自己使用上述任何具体框架；但公司表示已经在物理机器人上做后训练，基于开源模型做预训练，并计划在 2026 年底前后训练原生模型。最稳妥的理解是，Morphi
              现阶段很可能同时依赖外部开放模型基线和内部数据基础设施。

              这个架构在层级上可以中等把握地勾勒出来——本体、感知与控制、具身模型、数据采集与评估、部署反馈环；但实现细节还看不清。公开资料里没有基准测试表、没有延迟画像、没有模型规模、没有仿真栈披露，也没有计算或推理拓扑说明。
