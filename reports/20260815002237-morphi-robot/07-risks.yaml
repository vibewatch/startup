  title: The biggest risk is correlated failure, not one lawsuit
  body: Morphi’s technical, customer, and financing risks reinforce each other. Weak proof can make the next round harder;
    a harder round can slow product maturation; slower maturation can delay customer proof again.
  claimRefs:
