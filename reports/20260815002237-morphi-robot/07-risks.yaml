- id: section-people-kill
  title: People, governance, mitigations, and thesis-break triggers
  body: 'Morphi’s people risk is less about absolute headcount and more about concentration of judgment. Young robotics

    programs typically rely on a small number of founders and technical leads to decide architecture, scenario

    selection, safety posture, hiring, and capital allocation. That can accelerate progress early, but it also raises

    fragility if the team overreaches or if key technical leaders leave. Morphi’s public hiring footprint shows broad

    demand across embodied intelligence, robotics hardware, control, and infrastructure, implying a staffing problem

    that is both wide and urgent.


    Governance risk is reinforced by the company’s unresolved public entity picture. Earlier chapters found evidence

    pointing to Nanjing, Shanghai, and Shenzhen across media, recruiting, and web/legal traces. That does not prove a

    problem, but it does create real diligence questions around IP ownership, employment entities, contracting, and

    cross-entity control. A company can outgrow that ambiguity; it can also stumble on it during fundraising,

    procurement, or dispute resolution.


    The right response is not to assume failure, but to define concrete kill criteria. The Morphi thesis should weaken

    sharply if customer proof fails to emerge, if the company cannot show safe production reliability, if entity/IP

    control remains messy, or if financing momentum deteriorates before commercial traction becomes visible.'
