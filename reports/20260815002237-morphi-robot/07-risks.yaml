  title: Safety and privacy burden will rise with real-world data collection
  body: Closed-loop learning in factories, hotels, and mixed-use environments may be strategically powerful, but it creates
    privacy, oversight, and incident-governance obligations that Morphi has not yet disclosed in depth.
