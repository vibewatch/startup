- id: section-dependency-financial
  title: Partner, customer, manufacturing, and financial-model risk
  body: 'Morphi’s dependency stack is unusually dense for such a young company. Capital matters because humanoid robotics

    is hardware-intensive and data-intensive; customer proof matters because financing appetite often follows visible

    deployment milestones; and manufacturing matters because even good embodied-AI software can fail if hardware cost,

    supply quality, or field-support burden are poorly controlled. Morphi’s $147 million seed round is large, but it

    is not obviously excessive once hardware iteration, data collection, hiring, and eventual manufacturing scale are

    considered.


    Customer and partner concentration are currently unquantifiable. The previous chapter established that Morphi has

    no public named-customer proof, which means investors cannot tell whether commercial learning is broad-based or

    dependent on one hidden lighthouse account. The same issue applies to manufacturing and supply chain: no public

    disclosures identify key suppliers, contract manufacturers, component bottlenecks, or field-service partners.


    Strategic investors Alibaba and Tencent are meaningful positives, but they also create dependency risk. If market

    belief in Morphi partly depends on investor signaling, then a slowdown in follow-on support or ecosystem customer

    introductions could hit fundraising and commercialization at the same time. In early embodied-AI companies, these

    dependencies are often correlated rather than independent.'
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
