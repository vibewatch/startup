company:
  name: Morphi Robot
chapter:
  number: 1
  title: Company Overview
  summary: 'Morphi Robot (墨奇智能, also rendered in Chinese reporting as Moqi Intelligence) is a China-based embodied

    intelligence startup founded in 2025 by former Huawei autonomous-driving leaders Huang Qingqiu and Gao Wenli.

    Public evidence shows a multi-city corporate footprint spanning a Nanjing headquarters descriptor in funding

    coverage, a Shanghai recruiting entity, and a Shenzhen website/privacy entity. The company is still pre-product

    and financially opaque, but by July-August 2026 it had already raised roughly RMB 1 billion / $147-$148 million

    from Alibaba and Tencent at about a $1 billion valuation, with its core thesis centered on closed-loop learning,

    proprietary data collection, and manufacturing-first deployment before eventual expansion toward general-purpose

    home robots.'
sections:
- id: section-identity
  title: Identity, Mission, and Corporate Footprint
  body: 'Morphi Robot presents itself publicly as 墨奇智能, an embodied intelligence robotics company building a full-stack

    hardware-and-software platform rather than a narrow component supplier. The official website says the company is

    focused on embodied intelligent robots, with in-house development spanning a general-purpose humanoid body, an

    embodied foundation model, a data-collection system, and a cross-scenario generalization engine. Its top-level

    vision is expansive and consumer-facing: the site says Morphi wants to create robots that can understand and adapt

    to the real world, use a generate-understand-decide architecture, iterate through a data flywheel, and ultimately

    move general-purpose humanoid robots from the lab into millions of homes. That vision aligns with late-stage

    sector narratives from 1X, Figure, and Agibot, but Morphi is earlier than all three in commercialization.


    Public documentation also reveals that Morphi’s corporate footprint is not yet cleanly unified. Crunchbase News

    describes the startup as Nanjing-based. Morphi’s careers site, however, is operated under the tenant name

    Shanghai Morphi Wanxiang Intelligent Technology Co., Ltd., while the website footer and privacy-policy copy

    identify Shenzhen Morphi Intelligent Technology Co., Ltd. and list a Shenzhen Bay Ecological Technology Park

    correspondence address. The most plausible reading is that Morphi is operating with multiple legal entities or

    operating bases across China while presenting a single product brand internationally. For diligence purposes,

    investors should treat headquarters, IP ownership, and employee-entity allocation as unresolved points requiring

    primary documents rather than assuming the brand maps cleanly to one legal shell.


    Stage is clearly seed / angel rather than growth. Public sources consistently describe the company as less than

    one year old in mid-2026, founded in 2025, pre-product, and still building its native embodied model stack. No

    public revenue, customer count, board composition, or operating metrics are disclosed. That combination—large

    ambition, heavy funding, but limited operating disclosure—is the central framing for the rest of the report.'
