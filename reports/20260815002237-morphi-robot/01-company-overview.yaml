  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters-and-entity-map
    missingEvidence: A complete legal-entity tree showing which entity owns IP, employs R&D staff, signs customer contracts,
      and serves as operating headquarters.
    whyItMatters: Public sources split among Nanjing, Shanghai, and Shenzhen descriptors, which affects diligence on tax,
      labor, IP ownership, and regulatory exposure.
    diligencePath: Request SAIC business-registration extracts, articles of association, cap-table documents, and intercompany
      service/IP agreements for all Morphi-branded entities.
    relatedQuestionRefs:
    - QO002
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Revenue, ARR, customer count, pilot count, headcount, and any disclosed production or deployment KPIs.
    whyItMatters: Without baseline operating metrics, investors cannot judge whether Morphi is still pure R&D or already converting
      capital into commercial learning loops.
    diligencePath: Request current operating dashboard, customer-pipeline report, headcount by function and location, and
      monthly cash-burn summary.
    relatedQuestionRefs:
    - QO013
    - QO014
    - QO016
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: material
    topic: product-roadmap
    missingEvidence: Public product sheet or internal roadmap with robot form factor, BOM targets, safety envelope, and milestone
      dates for manufacturing pilots and home trials.
    whyItMatters: Morphi has raised a unicorn-scale seed round but still has no public SKU or benchmarked deployment proof,
      making roadmap credibility a central underwriting question.
    diligencePath: Request engineering roadmap, prototype status, simulation and field-test metrics, and customer pilot timeline
      by scenario.
    relatedQuestionRefs:
    - QO016
    - QO019
    - QO025
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: minor
    topic: governance-and-cap-table
    missingEvidence: Board composition, investor rights, liquidation preferences, founder vesting, and any protective provisions
      tied to Alibaba and Tencent financing.
    whyItMatters: At seed stage, governance terms can materially affect later financing flexibility and founder retention
      even before revenue exists.
    diligencePath: Request board consents, investor rights agreement, pro forma cap table, and financing documents from the
      latest round.
    relatedQuestionRefs:
    - QO008
    - QO012
    relatedTableRefs:
    - TO002
