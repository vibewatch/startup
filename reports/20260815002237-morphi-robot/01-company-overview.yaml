callouts:
- calloutType: strength
  title: Founder-market fit is unusually tight for closed-loop robotics learning
  body: Morphi is one of the rare seed-stage robotics companies whose public technical narrative directly matches its founders’
    prior operating history. Huang Qingqiu built autonomous-driving data systems at Huawei and is now applying the same closed-loop
    philosophy to embodied intelligence, while Gao Wenli contributes product and operating experience from an 11-year Huawei
    tenure.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO027
  - CO029
- calloutType: risk
  title: Capital formation is far ahead of product-market proof
  body: By mid-2026 Morphi had already reached roughly $1 billion valuation and more than RMB 1 billion of financing without
    a publicly released robot SKU, named customer, or disclosed revenue base. That creates substantial expectation risk if
    manufacturing pilots, model generalization, or commercialization velocity lag the valuation curve.
  claimRefs:
  - CO020
  - CO021
  - CO022
  - CO025
  - CO036
- calloutType: insight
  title: Manufacturing first, home later is a pragmatic sequencing choice
  body: Crunchbase frames Morphi as manufacturing-first with a home-robot endgame, and Huang’s comments explain why. Structured
    industrial or semi-structured commercial environments create cleaner data loops and clearer ROI, while homes remain the
    hardest generalization challenge in embodied AI.
  claimRefs:
  - CO030
  - CO031
  - CO032
  - CO039
