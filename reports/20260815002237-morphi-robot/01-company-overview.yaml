- id: section-technology
  title: Technology Thesis, Product Status, and Early Milestones
  body: 'Morphi’s product status is still formative, but its technical thesis is unusually explicit. KrASIA’s interview

    with Huang describes a company built around data engineering rather than flashy model taxonomy. Huang says Morphi

    has constructed a data flywheel: collect embodied data with lightweight wearable devices, filter it aggressively

    for quality, classify and retrieve it for task-specific training, automatically label ground truth, evaluate

    models at scale, and then go back into the field to collect more data where results are weak. He explicitly

    argues that the industry needs a closed-loop data system similar to autonomous driving and that differences

    between companies will come from thousands of engineering details inside that loop.


    That worldview helps explain the company’s apparent go-to-market sequencing. Crunchbase says Morphi is focused

    first on manufacturing but ultimately wants a general-purpose home robot. Huang’s own comments explain why the

    home endgame is distant: embodied models still lack the generalization needed for messy real-world households, so

    Morphi is collecting data from hotels, mixed-use residential and commercial apartments, and other semi-structured

    environments that can broaden the robot’s exposure without requiring full consumer readiness. He says the company

    has already used post-training to build system capability on physical robots, is now doing pretraining on top of

    open-source models, and expects to begin training a native model from scratch near the end of 2026 once it has

    accumulated enough data.


    The company’s missing milestone is equally important: no public source reviewed here identifies a released robot

    SKU, named commercial customer, shipped unit count, or benchmarked production deployment. By contrast, peers such

    as Figure and Agility already cite live manufacturing or logistics deployments, and Chinese peers such as Agibot

    and Unitree have publicly discussed scaling bodies and commercialization. Morphi’s milestone picture today is

    therefore capital formation plus technical-system building—not product-market proof.'
