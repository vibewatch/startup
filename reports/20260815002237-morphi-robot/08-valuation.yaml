    - Policy heat inflates marks
    - Capital can outrun underlying demand and create reset risk when IPO or commercial windows narrow
  - - Native model roadmap
    - A successful native model could make Morphi more than a hardware assembler
    - Native model misses differentiation
    - Open-source or better-capitalized competitors may neutralize the moat before Morphi scales
