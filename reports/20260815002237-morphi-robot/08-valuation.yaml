  - - Manufacturing-first deployment
    - Factories are more structured, measurable, and monetizable than home environments
    - Commercial proof remains pilot-only
    - Without repeat orders, factory focus is a story about wedge selection rather than revenue formation
  - - Alibaba / Tencent backing
    - Strategic investors can help talent, ecosystem access, and future fundraising resilience
    - Strategic backing substitutes for customer proof
    - Prestige capital does not prove margins, retention, or product-market fit
  - - China policy tailwind
