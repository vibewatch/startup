      items:
      - Generate
      - Understand
      - Decide
    - label: Embodied model layer
      detail: Self-developed embodied foundation model plus post-training on physical robots and pretraining on open-source
        models.
      items:
      - Embodied foundation model
      - Post-training on physical robots
      - Open-source pretraining base
      - Planned native model
    - label: Data and evaluation layer
      detail: Founder-described closed-loop pipeline for data collection, filtering, retrieval, auto-labeling, evaluation,
