callouts:
- calloutType: strength
  title: Morphi’s public story is unusually specific about the learning loop
  body: Many early humanoid companies market broad ambition. Morphi’s founder instead describes a concrete collect-filter-label-evaluate-recollect
    system derived from autonomous-driving data engineering. That specificity is the strongest technical asset visible publicly
    today.
  claimRefs:
  - CE007
  - CE020
  - CE022
- calloutType: risk
  title: Narrative detail still falls short of product proof
  body: No public SKU, benchmark, certification list, support policy, or named deployment accompanies Morphi’s architecture
    claims. Investors should treat the company as technically legible but still pre-proof.
  claimRefs:
  - CE010
  - CE024
  - CE026
  - CE028
  - CE032
- calloutType: insight
  title: The real race is data loop plus deployment workflow, not just robot form factor
  body: 'Figure Helix, GR00T, OpenVLA, π0, and Agibot’s deployment tooling all point to the same frontier: better embodied
    data, faster sim-to-real iteration, and repeatable rollout. Morphi’s value depends on whether its private loop compounds
    faster than this fast-moving baseline.'
