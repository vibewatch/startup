  figureRefs:
  - FP001
- id: section-profiles
  title: Peer Profiles and Relative Readiness
  body: 'Figure is the strongest capital-and-ambition benchmark. Its website now markets Figure 03 for home help, while

    its earlier F.02 narrative centered on manufacturing at BMW. Humanoid Index pegs Figure at a $39 billion

    valuation with 800+ employees and pilot status—far beyond Morphi’s public maturity. Agility is the strongest

    commercial-enterprise benchmark: its solutions page foregrounds Digit, Arc workflow controls, and named customer

    references from Amazon, GXO, and Schaeffler, while Humanoid Index marks it as commercial with $641M+ raised.


    Apptronik is the clearest manufacturing-and-warehouse peer in the US. Apollo is positioned as a flexible

    humanoid platform for manufacturing, warehouse, and retail work, and Humanoid Index reports early commercial

    status, a Mercedes-Benz deployment partner, and a $5.5B+ valuation. 1X sits closer to the home-assistance end

    of the spectrum: its funding release ties NEO to home assistance while supporting enterprise clients in logistics

    and guarding, and Humanoid Index highlights a target $20K price point. Unitree is the strongest price-disruption

    threat: its G1 page publishes a $13.5K list price and explicit specs, which is radically more aggressive than

    peers that keep pricing private.


    Chinese peers matter most for Morphi. Agibot’s Humanoid Index profile calls it a market leader by 2025 shipment

    volume and manufacturing-focused, while UBTECH’s official site continues to present enterprise and service breadth.

    Relative to those peers, Morphi has a clear narrative but limited public proof of commercial readiness.'
