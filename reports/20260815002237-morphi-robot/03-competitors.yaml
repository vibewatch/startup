callouts:
- calloutType: risk
  title: Unitree is the most obvious price-destruction threat
  body: Unitree’s published $13.5K G1 price creates a concrete downward anchor for the category. If low-cost Chinese hardware
    becomes good enough, Morphi will need software, data, or services differentiation to defend margin.
  claimRefs:
  - CP014
  - CP023
  - CP032
- calloutType: strength
  title: Morphi may be competing on data quality rather than first-wave publicity
  body: Unlike peers leading with price, home demos, or named deployments, Morphi’s public story is that its advantage comes
    from a closed-loop data system. That can be valuable—but only if it later produces visibly better generalization or deployment
    economics.
  claimRefs:
  - CP018
  - CP026
  - CP035
- calloutType: insight
  title: The market is splitting by role, not just by geography
  body: Figure and 1X are pushing consumer-home narratives; Agility and Apptronik are enterprise-heavy; Unitree is price-visible;
    Agibot is manufacturing-scale; Morphi is data-thesis-led. Buyers will likely choose across these roles before one platform
    standard emerges.
