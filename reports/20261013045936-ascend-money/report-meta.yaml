  topStrengths:
    - Large Thai consumer footprint and broad regional reach through TrueMoney.
    - Strong strategic sponsorship from CP Group, Ant Group, and MUFG.
    - Multiple monetization paths beyond payments, including lending and wealth distribution.
  topRisks:
    - Audited financials, current revenue, and current Series D valuation remain undisclosed.
    - Credit, reserve, and underwriting quality are opaque relative to lending ambitions.
    - Virtual-bank execution and regulatory approval introduce multi-year uncertainty.
    - Channel concentration and competitive pressure could compress payment economics.
  unresolvedGaps:
