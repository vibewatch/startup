      - number: '5.3'
        title: Distributed Systems and Multi-Cloud Architecture
        blocks:
          - type: paragraph
            body: >-
              To support high-concurrency payment volumes and real-time ledger accounting, Ascend Money operates a
              distributed multi-cloud platform executing over 400 production microservices. The backend application
              layer is predominantly constructed in Spring Boot, interfacing with web presentation applications built on
              NextJS and React. Infrastructure lifecycle automation is orchestrated through Terraform and Ansible across
              multi-cloud environments, while edge ingress, distributed denial-of-service mitigation, and content
              acceleration are delegated to Cloudflare. Data persistence and streaming pipelines leverage Apache Kafka
              for asynchronous event queues, Debezium for change data capture, InfluxDB for time-series metrics, and
              Looker Studio for analytics, backed by relational MySQL and Oracle clusters alongside MongoDB document
              stores. Platform engineering teams enforce continuous delivery and software quality via automated Jenkins
              pipelines, SonarQube static analysis, and Thanos-backed multi-cluster observability.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
