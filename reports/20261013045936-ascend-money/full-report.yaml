  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Spend Allocation
        blocks:
          - type: paragraph
            body: >-
              Ascend Money operates primarily within the retail electronic payments, digital credit, and basic consumer
              financial services sectors of Southeast Asia. The company's core commercial engine is TrueMoney, which
              encompasses an integrated mobile wallet application and an extensive network of physical merchant and
              agent touchpoints. Defined by its customer utility, TrueMoney captures everyday transaction throughput
              including point-of-sale QR purchases, utility bill settlements, peer-to-peer transfers, and mobile phone
              top-ups. This transaction surface deliberately incorporates micro-merchant acquiring and merchant
              settlement across informal retail stalls, corporate convenience chains, and digital e-commerce merchants.
              However, the business model explicitly excludes large-scale corporate treasury services, institutional
              interbank wire clearing, and formal enterprise resource planning payment rails, maintaining focus on
              mass-market consumers and small-to-medium enterprises. In addition to payment throughput, Ascend Money's
              market boundary encompasses specialized retail credit and micro-wealth adjacencies, specifically
              nano-finance credit through Ascend Nano and mutual fund distribution through Ascend Wealth. The primary
              status-quo substitute across the company's operating territories remains physical cash, supplemented by
              national instant-payment schemes such as Thailand's PromptPay network and conventional commercial bank
              mobile applications.
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
