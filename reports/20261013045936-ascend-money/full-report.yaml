      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity cannot be established from public marketing or financing announcements. The diligence
              plan should convert each material exposure into a monitorable condition: obtain the operative licence and
              supervisory timetable; reconcile product permissions by entity and country; test business-continuity,
              cyber, fraud, and complaint controls; review loan vintages and reserves; and map partner contracts and
              regulated-capital obligations. Monthly monitoring should track authorization milestones, severe incidents,
              fraud and credit losses, agent liquidity, complaints, partner concentration, and unrestricted liquidity.
              The thesis should be paused if launch slips without regulator-supported explanation, if severe incidents
              expose ineffective remediation, if loss cohorts breach the approved risk appetite, if a critical partner
              can terminate without replacement, or if available capital falls below the board-approved buffer. These
              are diligence triggers, not claims that any event has occurred.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
