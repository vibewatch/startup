      - number: '5.2'
        title: Consumer and Merchant Payment Workflows
        blocks:
          - type: paragraph
            body: >-
              The platform's transaction workflows address everyday offline retail transactions, high-frequency utility
              bill payments, and cross-border migrant remittances. At physical checkout points, consumers utilize
              barcode scanning, dynamic QR codes, or contactless Tap-to-Pay across major retail networks including
              7-Eleven, Makro, and Lotus's, eliminating the necessity of physical bank cards or cash handling. For
              unbanked and micro-entrepreneur segments, TrueMoney integrates Ascend Nano credit lines directly at
              checkout through Pay Next and Pay Next Extra revolving facilities, granting rapid digital loans up to
              20,000 THB or five times monthly income based on alternative behavioral scoring. Meanwhile, cross-border
              remittance workflows under TrueMoney Transfer enable overseas workers in Thailand to execute formal,
              lower-cost transfers directly to families in Myanmar and Cambodia, terminating through localized partner
              bank networks or physical agent locations.
