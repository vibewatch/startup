chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Scale, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Ascend Money is a premier Southeast Asian financial technology company headquartered in Bangkok, Thailand.
              Founded in 2013 as a digital technology business under True Corporation before joining Charoen Pokphand
              Group (CP Group), the company operates TrueMoney, a comprehensive digital payment and financial services
              application that enables everyday transactions, peer-to-peer transfers, mobile top-ups, bill payments,
              digital lending, wealth management, and micro-insurance. Ascend Money has expanded its geographical
              presence across six regional markets: Thailand, Myanmar, Cambodia, Indonesia, Vietnam, and the
              Philippines. The company reports serving over 50 million registered customers across these markets
              supported by an extensive hybrid network of 88,000 registered physical TrueMoney agents. In its domestic
              market of Thailand alone, the platform boasts 30 million active users, representing pervasive penetration
              into consumer daily commerce and digital payments.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO011
