      - number: '7.2'
        title: Operational, credit, fraud, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The operating surface is broad and high-volume. Historical disclosures described more than 50 million
              users, 88,000 agents, and US$14 billion of 2020 payment volume, while later reporting cited 32 million
              TrueMoney users in Thailand. Scale can diversify transactions, but it also expands uptime, fraud,
              identity, cash-agent, data-protection, and customer-remediation obligations. Ascend Money also describes
              alternative-data lending for underserved borrowers, and a 2025 report said more than half of credit
              applicants were first-time formal borrowers. The assigned pool contains no current uptime,
              material-incident, fraud-loss, vintage, charge-off, or reserve metrics. That absence is a disclosure gap,
              not proof that no incidents or losses occurred. Investment review should require independently testable
              controls and performance data before underwriting operational or credit resilience.
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR011
              - CR015
