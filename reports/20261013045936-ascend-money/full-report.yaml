      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Ascend Money operates under dual executive leadership backed by top-level conglomerate governance.
              Suphachai Chearavanont serves as Founder and Chairman of the Board of Ascend Money while simultaneously
              holding executive leadership as CEO of CP Group and Chairman of True Corporation. This dual positioning
              provides Ascend Money with structural commercial access to Thailand's largest retail distribution network,
              including CP All's nationwide 7-Eleven store chain and True Corporation's telecommunications
              infrastructure, but also introduces significant key-person dependence on conglomerate alignment.
              Day-to-day corporate operations are steered by Co-Presidents Monsinee Nakapanant and Tanyapong
              Thamavaranukupt. Nakapanant leads corporate strategy, regional expansion, and strategic partnerships,
              whereas Thamavaranukupt oversees financial product development, digital lending under Ascend Nano, and
              payments innovation. This leadership matrix ensures continuity across banking partnerships and operational
              scaling.
