  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Profiles
        blocks:
          - type: paragraph
            body: >-
              Ascend Money structures its customer reach across four distinct operational customer segments spanning
              urban consumer digital wallets, rural cash-in agent networks, cross-border remittance corridors, and
              micro-merchant payment acceptance points. At the foundation of its consumer franchise is the TrueMoney
              Wallet application, which targets smartphone-equipped retail consumers across Thailand with bill payment,
              mobile top-up, and merchant checkout workflows. Complementing this digital footprint, Ascend Money deploys
              an extensive offline network of 88,000 registered physical agents across six Southeast Asian countries,
              providing high-touch cash-in, cash-out, and over-the-counter remittance services to unbanked and
              cash-reliant populations who lack formal bank relationships. For cross-border migrant workers, the
              platform operates targeted international corridors connecting Thailand with Myanmar and Cambodia, creating
              specialized remittance touchpoints that address underserved labor populations. Furthermore, the company
              engages micro and SME merchants through digital QR code payment acceptance and working capital solutions,
              linking everyday convenience retail into its transaction ecosystem.
            claimRefs:
              - CU001
