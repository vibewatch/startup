      - number: '5.4'
        title: Security Controls, Regulatory Compliance, and Resilience
        blocks:
          - type: paragraph
            body: >-
              Transaction integrity and identity verification are governed by the TrueMoney Secure framework, which
              incorporates biometric facial verification technology alongside 24/7 real-time fraud monitoring and
              end-to-end data encryption. Client-side security is anchored in native mobile runtimes, developed in Swift
              and Objective-C for iOS and Kotlin and Java for Android, ensuring hardened local storage and tamper
              resistance. Credit operations under Ascend Nano operate within regulatory rate ceilings and underwriting
              rules enforced by the Bank of Thailand, requiring continuous compliance monitoring and audit controls.
              However, managing more than 400 microservices across heterogeneous cloud providers introduces significant
              architectural complexity, including inter-service network latency, potential cascading failure domains
              during nationwide commercial traffic peaks, and third-party dependency risks across external banking
              switches and telecommunications gateways.
            claimRefs:
              - CE002
              - CE008
              - CE009
              - CE010
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-Cloud Scalability and Event-Driven Decoupling
            body: >-
              Ascend Money's operation of over 400 microservices decoupled via Apache Kafka and Debezium change data
              capture allows independent scaling of payment, lending, and remittance modules across multi-cloud
              environments, isolating transaction spikes during major commercial campaigns.
            calloutType: strength
            claimRefs:
              - CE002
              - CE005
              - CE006
          - type: callout
            title: Distributed Complexity and Regulated Underwriting Governance
            body: >-
              Operating a 400-microservice architecture across multi-cloud infrastructure creates substantial
              operational overhead, where cross-cloud configuration drift and inter-service network latency represent
              ongoing resilience challenges under Bank of Thailand financial supervisory expectations.
            calloutType: risk
            claimRefs:
              - CE002
