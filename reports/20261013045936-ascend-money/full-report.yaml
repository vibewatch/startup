      - number: '2.3'
        title: Buyer Segmentation, Workflow Integration, and Adoption Paths
        blocks:
          - type: paragraph
            body: >-
              Ascend Money addresses a differentiated customer landscape that spans unbanked mass-market consumers,
              digitally native urban spenders, micro-entrepreneurs, and cross-border migrant workers. For unbanked and
              underbanked consumers, adoption is mediated through an offline network of 88,000 registered TrueMoney
              agents across Southeast Asia. These local agents act as human automated teller machines, enabling
              individuals without formal bank accounts to convert cash into digital balances for utility bill payments,
              phone top-ups, and family transfers. For urban and banked consumers, adoption is driven by the TrueMoney
              Wallet mobile application, where integration into the Charoen Pokphand Group retail network provides
              ubiquitous everyday utility. In Thailand, consumers frequently interact with TrueMoney at thousands of
              7-Eleven convenience stores and retail counters, anchoring the wallet into daily discretionary spending.
              For small business owners and street vendors, TrueMoney delivers accessible merchant acquiring without the
              prohibitive terminal costs or underwriting delays associated with traditional commercial bank
              point-of-sale hardware. Furthermore, Ascend Money provides a specialized cross-border financial lifeline
              for Cambodian and Myanmarese migrant workers residing in Thailand, enabling in-app and agent-assisted
              remittances to their home countries. Budget ownership rests directly with individual household earners and
              micro-business operators who prioritize lower transaction friction, immediate settlement, and reliable
              accessibility.
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
