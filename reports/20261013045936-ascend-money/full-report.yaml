      - number: '6.4'
        title: Retention Durability, Channel Dependence, and Competitive Friction
        blocks:
          - type: paragraph
            body: >-
              Despite expansive top-line customer numbers, Ascend Money exhibits notable customer concentration and
              retention durability risks. The platform's offline customer acquisition and cash-loading capabilities
              depend heavily on CP Group's 7-Eleven convenience store infrastructure, creating substantial structural
              channel concentration where commercial renegotiations or parent-group strategy shifts could directly alter
              user friction. Concurrently, competitive pressure within Thailand is intensifying from transit-linked
              ecosystems such as Rabbit Line Pay and commercial banking applications led by Siam Commercial Bank, which
              leverage Thailand's real-time PromptPay rail to capture everyday transaction volume. Most critically from
              a diligence standpoint, Ascend Money does not disclose cohort retention, net revenue retention (NRR), or
              active merchant churn rates. This leaves uncertainty regarding whether historical wallet users demonstrate
              recurring monetization or whether transaction activity remains concentrated in low-margin bill payments
              and captive 7-Eleven retail purchases.
            claimRefs:
              - CU003
              - CU007
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution Channel and Retail Network Concentration
            body: >-
              Ascend Money's retail traction in Thailand remains heavily anchored to CP Group's 7-Eleven network,
              creating substantial channel dependence. While the convenience store footprint provides unmatched physical
              top-up reach, changes in commercial terms or competitive pressure from commercial banks' PromptPay
              infrastructure could constrain TrueMoney's margins and independent user acquisition.
            calloutType: risk
            claimRefs:
              - CU002
              - CU003
              - CU007
          - type: callout
            title: Cross-Border Remittances as an Underserved User Acquisition Funnel
            body: >-
              By connecting TrueMoney's Thai wallet infrastructure with regional financial institutions such as KBZ Bank
              in Myanmar, Ascend Money establishes high-utility transaction corridors for migrant workers. This corridor
              provides sticky, recurring transaction volumes and differentiates TrueMoney from domestic-only digital
              wallet competitors.
            calloutType: insight
            claimRefs:
