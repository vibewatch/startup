      - number: '7.3'
        title: Partner dependencies and financial capacity
        blocks:
          - type: paragraph
            body: >-
              Strategic sponsorship is simultaneously a mitigation and a concentration vector. The 2021 round involved
              Bow Wave, Charoen Pokphand Group, and Ant Group; later sources report a US$195 million 2024 investment led
              by MUFG, while virtual-bank coverage highlights Ant backing and CP-linked retail distribution. These
              relationships can supply capital, technology, reach, and credibility, but the assigned evidence does not
              disclose exclusivity, termination rights, data-sharing obligations, service-level commitments, or revenue
              concentration. Nor do reported funding amounts establish cash available, burn, regulated capital, or
              runway. Geographic disclosure also changed from six countries in 2021 to seven in a 2024 article without
              an entity-by-entity reconciliation. The appropriate residual view is medium-high until contracts, legal
              entities, capital allocation, and contingency arrangements are examined.
            claimRefs:
