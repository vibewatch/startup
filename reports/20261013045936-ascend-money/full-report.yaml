  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Strategic dimension
      - Core thesis (bull arguments)
      - Core anti-thesis (bear arguments)
      - What would change the view
    rows:
      - - Ecosystem distribution
        - >-
          Dominant consumer footprint with 30M active users and seamless integration across 7-Eleven and CP Group retail
          channels
        - Heavy dependence on parent conglomerate retail network; captive user volume may mask organic fintech retention
        - Disclosure of independent merchant acquiring GMV and cohort retention outside CP Group ecosystem
      - - Virtual banking upside
        - >-
          Consortium partnership with Ant Group positions Ascend to secure BoT virtual banking licence and capture
          deposit franchise
        - >-
          Virtual banks face steep regulatory capital mandates and typically require 3-8 years to achieve positive
          operating net income
        - >-
          Formal grant of BoT virtual bank licence, published Tier 1 capital ratios, and clear path to operating
          breakeven
      - - Credit monetization
        - >-
          High-margin digital lending (20B baht portfolio) leveraging alternative consumer transaction data for
          underbanked borrowers
        - Elevated NPL ratio of 7.5% poses severe credit loss risks in an inflationary or macro slowdown environment
        - Vintage default curves showing stable loss rates below 5% and provable risk-adjusted net interest margins
      - - Financing & sponsor support
        - >-
          Strategic balance sheet backing from MUFG ($195M Series D) and Ant Group validates long-term regional
          potential
        - >-
          Series D valuation and cap table terms remain undisclosed, creating dilution and preference overhang risks for
          new investors
        - Full cap-table transparency, verified Series D share price, and pari-passu liquidation preference terms
    notes: >-
      Thesis and anti-thesis drivers synthesized from strategic disclosures, consortium announcements, and digital
      banking risk analysis.
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating & regulatory assumptions
      - Valuation / return logic
      - Key risks & failure triggers
      - Probability signal
    rows:
      - - Bull Case
        - >-
          Secures BoT virtual bank licence; expands digital lending with NPLs <6%; scales cross-border remittances
          across 7 SEA markets
        - >-
          Valuation expands to $2.5B-$3.0B (3.0x-4.0x implied revenue); path to domestic or regional IPO within 24-36
          months
        - Execution delays in virtual bank rollout; regulatory caps on consumer loan interest rates
        - 25% (conditional on BoT licence award and audited revenue expansion)
      - - Base Case
        - >-
          Operates primarily as payments and nano-finance wallet; virtual bank takes 4+ years to break even; modest
          Southeast Asian growth
        - >-
          Valuation holds at $1.5B-$1.8B anchor (flat to slight step-up vs 2021); modest IRR of 8-12% for late-stage
          entry
        - >-
          Continued market saturation in Thailand (97% mobile banking penetration); margin compression from bank payment
          rails
        - 55% (reflects current operating reality and fintech multiples)
      - - Bear Case
        - >-
          Fails to win virtual bank licence; digital loan NPLs spike above 10%; Series D terms impose severe liquidation
          preference overhang
        - >-
          Down-round revaluation to $800M-$1.0B (multiple compression toward 0.8x-1.5x); capital impairment for common
          equity
        - Significant credit write-offs in Ascend Nano; aggressive pricing competition from incumbent commercial banks
        - 20% (driven by credit volatility and absence of banking licence)
    notes: >-
      Valuation ranges are derived from private financing marks, public digital lending multiples (0.8x-3.6x revenue),
      and digital banking breakeven benchmarks; return projections are illustrative.
