      - number: '6.3'
        title: Named Deployments, Channel Proof, and Strategic Partners
        blocks:
          - type: paragraph
            body: >-
              Commercial proof for Ascend Money centers on prominent enterprise sponsorships, financial institution
              collaborations, and institutional regulatory milestones. The primary physical distribution anchor in
              Thailand is Charoen Pokphand Group's nationwide network of 7-Eleven convenience stores, which function as
              universal cash top-up and retail transaction hubs for TrueMoney users. For cross-border remittances,
              Ascend Money established a direct partnership with KBZ Bank and its KBZPay mobile wallet in Myanmar,
              enabling formal international remittances from Thailand directly into Myanmar bank accounts and digital
              wallets for migrant worker families. Building on this transactional traction, Ascend Money partnered with
              Ant International in a consortium that secured selection by the Bank of Thailand for a virtual banking
              licence. In preparation for commercial digital banking operations, Ascend Money actively recruits
              specialized corporate compliance and governance leadership in Bangkok to meet central bank risk management
              and consumer protection standards.
            claimRefs:
