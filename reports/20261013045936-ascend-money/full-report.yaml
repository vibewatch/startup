      - number: '6.2'
        title: Adoption Trajectory and Regional Wallet Scale
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of TrueMoney reflects rapid customer acquisition driven by smartphone penetration
              and strategic retail partnerships. Ascend Money reports over 50 million registered customers across six
              regional markets, with Thailand representing its primary core market comprising over 30 million active
              users. By 2021, independent market estimates from Boku indicated that TrueMoney captured approximately 53%
              of the mobile wallet market share in Thailand, outpacing competing independent wallets through early mover
              advantage and widespread distribution. Payment volume growth expanded aggressively during the cashless
              adoption push of 2019 to 2020, where total regional payment volume reached $14 billion, backed by an 84%
              annual payment volume expansion within Thailand. Ascend Money leadership publicly targeted reaching 35
              million users in Thailand, representing roughly half of the country's population, while managing over 400
              microservices across a multi-cloud infrastructure to sustain peak transaction throughput.
            claimRefs:
