              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal perimeter
        blocks:
          - type: paragraph
            body: >-
              Reporting in 2025 placed an Ascend Money-led consortium among three groups selected for Thailand's
              virtual-bank program and described a one-year setup period before a potential 2026 launch. The same
              reporting described non-transferable licences, capital thresholds, risk-management practices,
              cybersecurity, and consumer protection as conditions. Those reports are useful evidence of the regulatory
              path, but they are not a current regulator decision or proof that the bank launched by the run date. The
              risk is therefore not an alleged violation; it is approval, readiness, and launch execution across a
              platform already spanning payments, remittance, lending, investments, and insurance. Residual severity
              remains high until primary licence documents, entity-level permissions, capital plans, and supervisory
              milestones are produced. A missed licence milestone or a material restriction on lending or deposit-taking
              would weaken the expansion thesis.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR012
