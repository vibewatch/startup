      - number: '1.3'
        title: Capitalization History, Ownership Structure, and Strategic Backing
        blocks:
          - type: paragraph
            body: >-
              The capitalization trajectory of Ascend Money reflects substantial institutional and strategic backing
              from global financial institutions and industrial leaders. In September 2021, the company achieved unicorn
              status after securing $150 million in Series C financing led by Bow Wave Capital Management alongside CP
              Group and Ant Group, establishing a post-money valuation benchmark of $1.5 billion. In June 2024, Ascend
              Money completed a $195 million Series D investment round led by Japan's largest financial group,
              Mitsubishi UFJ Financial Group (MUFG), via MUFG Bank, with participation from Finnoventure Private Equity
              Trust I managed by Krungsri Finnovate. Across three primary funding events, Ascend Money has raised $345
              million in total equity funding. Strategic investors Ant Group and MUFG provide technical and banking
              capabilities, while CP Group remains the controlling corporate shareholder.
            claimRefs:
