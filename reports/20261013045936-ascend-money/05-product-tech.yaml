callouts:
  - calloutType: strength
    title: "Multi-Cloud Scalability and Event-Driven Decoupling"
    body: "Ascend Money's operation of over 400 microservices decoupled via Apache Kafka and Debezium change data capture allows independent scaling of payment, lending, and remittance modules across multi-cloud environments, isolating transaction spikes during major commercial campaigns."
    claimRefs:
      - "CE002"
      - "CE005"
      - "CE006"
  - calloutType: risk
    title: "Distributed Complexity and Regulated Underwriting Governance"
    body: "Operating a 400-microservice architecture across multi-cloud infrastructure creates substantial operational overhead, where cross-cloud configuration drift and inter-service network latency represent ongoing resilience challenges under Bank of Thailand financial supervisory expectations."
    claimRefs:
      - "CE002"
      - "CE010"
      - "CE014"
