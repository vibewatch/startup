callouts:
  - calloutType: risk
    title: Sovereign Payment Rails Limit Payment Processing Take Rates
    body: >-
      The explosive adoption of Bank of Thailand PromptPay—processing over 74 million daily transactions with zero
      consumer transfer fees—effectively eliminates standalone payment processing margins, forcing TrueMoney to rely on
      lending and wealth cross-selling for unit economic viability.
    claimRefs:
      - CP008
      - CP010
  - calloutType: strength
    title: CP Group Retail and Agent Network Forms Defensible Distribution Moat
    body: >-
      TrueMoney maintains a significant offline onboarding and cash-in advantage over regional pure-play superapps via
      exclusive CP Group retail integration across 7-Eleven outlets and an expansive footprint of 88,000 regional agents
      across six Southeast Asian markets.
    claimRefs:
      - CP002
      - CP004
