    rows:
      - - "Bull Case"
        - "Secures BoT virtual bank licence; expands digital lending with NPLs <6%; scales cross-border remittances across 7 SEA markets"
        - "Valuation expands to $2.5B-$3.0B (3.0x-4.0x implied revenue); path to domestic or regional IPO within 24-36 months"
        - "Execution delays in virtual bank rollout; regulatory caps on consumer loan interest rates"
        - "25% (conditional on BoT licence award and audited revenue expansion)"
      - - "Base Case"
        - "Operates primarily as payments and nano-finance wallet; virtual bank takes 4+ years to break even; modest Southeast Asian growth"
        - "Valuation holds at $1.5B-$1.8B anchor (flat to slight step-up vs 2021); modest IRR of 8-12% for late-stage entry"
        - "Continued market saturation in Thailand (97% mobile banking penetration); margin compression from bank payment rails"
        - "55% (reflects current operating reality and fintech multiples)"
      - - "Bear Case"
        - "Fails to win virtual bank licence; digital loan NPLs spike above 10%; Series D terms impose severe liquidation preference overhang"
        - "Down-round revaluation to $800M-$1.0B (multiple compression toward 0.8x-1.5x); capital impairment for common equity"
        - "Significant credit write-offs in Ascend Nano; aggressive pricing competition from incumbent commercial banks"
        - "20% (driven by credit volatility and absence of banking licence)"
