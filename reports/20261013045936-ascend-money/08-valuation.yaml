callouts:
  - calloutType: "risk"
    title: "Valuation opacity and preference overhang in Series D"
    body: "While Ascend Money raised $195 million from MUFG Bank in June 2024, the absence of an announced post-money valuation means public price discovery remains anchored to its September 2021 valuation of $1.5 billion. Late-stage capital infusions structured without public valuation marks often incorporate downside protections or liquidation preferences that dilute common equity holders in downside scenarios."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV012"
  - calloutType: "recommendation"
    title: "Conditioning capital commitment on audited portfolio disclosures"
    body: "Investors should resist underwriting Ascend Money purely on headline user numbers. Diligence must establish verified unit economics for TrueMoney Wallet, loan-loss provisioning adequacy for its 20 billion baht lending portfolio with a 7.5% NPL ratio, and realistic capital commitment schedules for the Bank of Thailand virtual bank consortium."
    claimRefs:
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV014"
