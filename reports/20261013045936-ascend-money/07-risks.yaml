  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-risk
      missingEvidence: >-
        Current regulator-issued licence, conditions, legal-entity permissions, renewal
        dates, supervisory matters, litigation, and enforcement records by jurisdiction.
      whyItMatters: >-
        Public articles cannot establish whether the reported virtual-bank process reached
        launch or whether every product is currently authorized in each operating market.
      diligencePath: >-
        Obtain the regulator decision, licence pack, entity chart, compliance register,
        external counsel memorandum, and management certification of open matters.
      relatedQuestionRefs: [QR001, QR010]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: operating-evidence-gap
      missingEvidence: >-
        Current uptime, severe-incident, cyber-control, fraud-loss, complaint,
        remediation, and business-continuity evidence.
      whyItMatters: >-
        User and agent scale increases the potential customer and regulatory impact of a
        control failure, while public silence cannot establish incident-free performance.
      diligencePath: >-
        Review independent assurance reports, incident and complaint logs, recovery tests,
        penetration-test remediation, and board risk reporting for the last 24 months.
      relatedQuestionRefs: [QR002, QR005]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: credit-risk
      missingEvidence: >-
        Loan vintages, delinquency and roll rates, charge-offs, fraud losses, reserves,
        funding mix, underwriting overrides, and model-validation results.
      whyItMatters: >-
        Alternative-data lending to thin-file borrowers cannot be risk-rated from product
        availability or applicant mix alone.
      diligencePath: >-
        Obtain monthly cohort tapes, audited loss and reserve reconciliations, funding
        covenants, model governance, and stress tests segmented by product and country.
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: partner-dependency
      missingEvidence: >-
        Partner contracts, revenue and transaction concentration, service dependencies,
        data-sharing terms, termination rights, and tested replacement plans.
      whyItMatters: >-
        Strategic partners may mitigate growth and execution risk while also creating
        single points of failure or constraints on strategic flexibility.
      diligencePath: >-
        Build a dependency register from executed contracts and quantify exposure,
        switching time, transition cost, and contingency capacity for each critical party.
      relatedQuestionRefs: [QR004]
      relatedTableRefs: [TR003]
    - type: stale
      severity: material
      topic: virtual-bank
      missingEvidence: >-
        Primary confirmation of the virtual-bank authorization, any conditions, operational
        launch date, and current supervisory status as of 2026-10-13.
      whyItMatters: >-
        The retained reports describe a prospective 2026 launch rather than a verified
        operating status at the chapter run date.
      diligencePath: >-
        Obtain the latest Bank of Thailand and Ministry of Finance records plus management's
        dated launch evidence and reconcile them to the licensed legal entity.
      relatedQuestionRefs: [QR010]
      relatedTableRefs: [TR001]
