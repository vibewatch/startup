chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营规模与商业模式
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 是一家总部位于泰国曼谷的东南亚领先金融科技公司。公司 2013 年成立时是 True Corporation 旗下的数字科技业务，后加入 Charoen Pokphand
              Group（CP Group）。 公司运营 TrueMoney，这是一款覆盖日常交易、点对点转账、手机充值、账单支付、数字借贷、财富管理和小额保险的综合数字支付与金融服务应用。 Ascend Money
              已进入泰国、缅甸、柬埔寨、印度尼西亚、越南和菲律宾六个区域市场。公司披露在这些市场服务超过 5000 万注册客户，并由 88,000 家注册实体 TrueMoney 代理商组成的广泛混合网络提供支持。
              仅在泰国本土，平台就拥有 3000 万活跃用户，已深度进入消费者的日常商业和数字支付场景。
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO011
