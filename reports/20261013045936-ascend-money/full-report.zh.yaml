              - CR015
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 投资否决标准
            body: 若监管产品上线无合理解释地未达预期、发生严重事故且补救无效、信贷损失超出核准风险偏好、失去不可替代的战略依赖，或资本低于董事会核准的缓冲水平，应暂停投资论点。
            calloutType: risk
            claimRefs:
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与建议
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 在东南亚拥有颇具吸引力的消费金融科技版图，核心是 TrueMoney 平台：在泰国服务超过 3000 万活跃用户，历史上覆盖该地区 5000 万注册账户。公司背靠 Charoen
              Pokphand Group 的零售主导地位和 Ant Group 的技术能力，年交易额超过 $14 billion，并已成功部署超过 400
              个生产环境微服务。但我们的投资立场明确是“需要进一步研究”：估值偏高，风险评级高。核心矛盾在于分发规模确实可观，但财务透明度严重不足：Ascend Money
              尚未公布经审计财务报表、分部收入拆分或信贷拨备明细。此外，尽管业务受益于庞大的客户交易参与度，泰国移动银行渗透率已达
              97%，纯支付变现空间受限，也加剧了与资本充足的商业银行之间的竞争。在单位经济未获验证、且支付流水能否产生可持续经营利润仍不清楚之前，基于最新公开投后估值锚点为股权定价仍为时过早。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV014
              - CV015
