      - number: '1.3'
        title: 资本化历程、股权结构与战略支持
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 的资本化历程体现出全球金融机构和产业巨头的有力支持。2021 年 9 月，公司完成由 Bow Wave Capital Management 领投、CP Group 和 Ant
              Group 参与的 1.5 亿美元 C 轮融资，成为独角兽，投后估值达到 15 亿美元。 2024 年 6 月，公司完成 1.95 亿美元 D 轮融资，由日本最大金融集团 Mitsubishi UFJ
              Financial Group（MUFG）通过 MUFG Bank 领投，Krungsri Finnovate 管理的 Finnoventure Private Equity Trust I 参与。
              三次主要融资合计带来 3.45 亿美元股权资金。Ant Group 和 MUFG 提供技术及银行能力，CP Group 仍是控股企业股东。
