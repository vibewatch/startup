  - id: FE001
    title: 产品架构图
    type: stack
    summary: TrueMoney 平台的六层架构栈，涵盖客户端界面、边缘安全、核心微服务、事件流、数据持久化和平台自动化。
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE009
    approximationNotes: null
    data:
      layers:
        - label: 客户端与呈现层
          description: 面向消费者的原生移动客户端，以及面向零售代理的专用界面
          modules:
            - TrueMoney Wallet iOS 应用（Swift、Objective-C）
            - TrueMoney Wallet Android 应用（Kotlin、Java）
            - TrueMoney 商户与零售代理移动门户
            - Web 消费者服务（NextJS、React）
        - label: 边缘与外围安全
          description: 边缘网络交付、威胁缓解与认证网关
          modules:
            - Cloudflare CDN 与 DDoS 防护
            - API 网关与流量限流
            - TrueMoney 安全生物识别人脸核验
            - 多因素认证与会话令牌服务
        - label: 微服务业务核心
          description: 处理核心金融交易和借贷业务的分布式微服务集群
          modules:
            - 400+ Spring Boot 微服务
            - 电子钱包余额与交易分类账服务
            - Ascend Nano 信贷评估引擎
            - 公用事业账单聚合与合作伙伴支付路由
        - label: 事件流与变更数据捕获
          description: 异步消息骨干与实时运营遥测
          modules:
            - Apache Kafka 分布式事件流
            - Debezium 变更数据捕获管道
            - InfluxDB 时间序列指标采集
            - Looker Studio 数据分析与报告
        - label: 持久化与分布式数据层
          description: 维护交易状态和文档存储的多模型数据库存储
          modules:
            - MySQL 关系型交易数据库
            - Oracle 企业数据库集群
            - 用于非结构化负载的 MongoDB 文档存储
            - 多云安全对象存储
        - label: 平台工程与 DevSecOps 层
          description: 基础设施自动化、持续交付与统一可观测性平台
          modules:
            - Terraform 基础设施即代码
            - Ansible 配置管理
            - Jenkins CI/CD 流水线自动化
            - SonarQube 静态安全分析
            - Thanos 多云可观测性平台
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 可视化展示 TrueMoney 在消费者与代理触点上的用户获取、参与、交叉销售和留存场景。
    data:
      items:
        - label: 1. 现金充值与开户
          touchpoints:
            - 7-Eleven 现金充值柜台
            - 当地 TrueMoney 实体代理
            - 通过 PromptPay 银行转账
          detail: 无银行账户或使用智能手机的用户注册 TrueMoney 钱包，并在合作便利店或代理处存入现金。
        - label: 2. 日常生活缴费交易
          touchpoints:
            - 手机话费充值
            - 公用事业账单支付
            - 点对点转账
          detail: 用户通过固定的非可选支付和点对点转账建立交易频率。
        - label: 3. 商户零售结账
          touchpoints:
            - 零售店内 QR 支付
            - 在线电商结账
            - CP Group 零售店
          detail: 无现金支付扩展至日常杂货、便利店和电商购物。
        - label: 4. 跨境汇款
          touchpoints:
            - TrueMoney Transfer 应用
            - KBZPay 缅甸通道
            - 区域代理汇款
          detail: 外来务工人员以低成本向东南亚各国边境另一侧的家人银行账户和钱包汇款。
        - label: 5. 金融产品交叉销售
          touchpoints:
            - Ascend Nano 小额贷款
            - Ascend Wealth 共同基金
            - TrueMoney 小额保险
          detail: 活跃钱包用户凭交易历史获得小额贷款、储蓄收益和保险产品。
        - label: 6. 虚拟银行过渡
          touchpoints:
            - 财团数字银行应用
            - 中小企业信贷评估
            - 一体化数字存款
          detail: 预计 2026 年过渡到完整虚拟银行服务，提供正式的计息账户。
