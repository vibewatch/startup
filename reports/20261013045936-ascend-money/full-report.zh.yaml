      - number: '2.3'
        title: 买方分层、工作流整合与采用路径
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 面向无银行账户的大众消费者、数字原生城市消费者、小微创业者和跨境劳工。对银行服务不足的人群，采用主要靠东南亚 88,000 家注册 TrueMoney 代理商组成的线下网络。
              这些本地代理商像人工 ATM，让没有正式银行账户的人把现金转成数字余额，用于缴纳公用事业账单、手机充值和家庭转账。 城市及有银行账户的消费者通过 TrueMoney Wallet 应用使用服务，而 Charoen
              Pokphand Group 的零售网络提供日常场景。在泰国，消费者经常在数千家 7-Eleven 门店和零售柜台使用 TrueMoney。 对小企业主和街边摊主，TrueMoney
              提供易用的商户收单，避免传统商业银行销售点硬件的高昂终端成本和漫长审核。
              平台也为居住在泰国的柬埔寨和缅甸移民工人提供跨境金融通道，让其通过应用或代理商向本国汇款。预算由家庭收入者和微型企业经营者直接掌握，他们看重低交易摩擦、即时结算和稳定可得性。
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM014
          - type: table
            tableRef: TM003
