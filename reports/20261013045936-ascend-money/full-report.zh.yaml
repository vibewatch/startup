      - number: '1.4'
        title: 运营演进、战略合作与区域监管约束
        blocks:
          - type: paragraph
            body: >-
              自 2013 年起，Ascend Money 从本土钱包子公司演变为多元化区域金融服务商。Ant Group 于 2016 年成为战略伙伴后，平台扩张明显提速，2020 年六个东南亚国家的支付规模达到 140
              亿美元。 国际商户收单合作进一步加深商业进展，包括 Worldpay 将 TrueMoney 接入泰国境内结算的主要替代支付方式。 但在高增长前沿市场扩张，也带来实质监管与合规风险。Ascend Money
              在缅甸运营 TrueMoney 代理网络和汇款通道，而 FATF 仍对该国发布高风险行动呼吁，美国财政部也执行与缅甸相关的经济制裁。 这些监管阻力要求更严格的反洗钱控制，并限制跨境运营。
