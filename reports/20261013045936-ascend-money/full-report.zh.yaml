      - 核心正论（看多理由）
      - 核心反论（看空理由）
      - 哪些事实会改变判断
    rows:
      - - 生态分发
        - 以 3,000 万活跃用户占据主导消费触达，并与 7-Eleven 和 CP Group 零售渠道无缝整合
        - 高度依赖母集团零售网络；被绑定的用户规模可能掩盖金融科技业务的自然留存
        - 披露 CP Group 生态之外的独立商户收单 GMV 和队列留存
      - - 虚拟银行上行空间
        - 与 Ant Group 的财团合作使 Ascend 有望拿到 BoT 虚拟银行牌照并获取存款业务
        - 虚拟银行面临严格的监管资本要求，通常需要 3-8 年才能实现经营净利润为正
        - 正式获发 BoT 虚拟银行牌照、公布一级资本充足率，并明确实现经营盈亏平衡的路径
      - - 信贷变现
        - 利用消费者替代交易数据，向银行服务不足的借款人提供高毛利数字贷款（20B 泰铢资产组合）
        - NPL 比率高达 7.5%，在通胀或宏观放缓环境下带来严重信用损失风险
        - 分期违约曲线显示损失率稳定低于 5%，且风险调整后净息差有据可证
      - - 融资与发起方支持
        - MUFG（$195M D 轮）与 Ant Group 提供战略资产负债表支持，验证了长期区域潜力
        - D 轮估值与股权结构表条款仍未披露，新投资者面临稀释和优先权悬置风险
        - 完整的资本结构透明度、经验证的 D 轮股价，以及同等顺位清算优先权条款
    notes: 正论与反论驱动因素综合了战略披露、财团公告和数字银行风险分析。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营与监管假设
      - 估值 / 回报逻辑
      - 主要风险与失败触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 拿到 BoT 虚拟银行牌照；将 NPL 控制在 <6% 并扩大数字借贷；在 7 个东南亚市场扩大跨境汇款
        - 估值扩大至 $2.5B-$3.0B（隐含收入倍数 3.0x-4.0x）；24-36 个月内在本土或区域上市
        - 虚拟银行上线执行延迟；监管机构限制消费贷款利率
        - 25%（以获得 BoT 牌照并经审计收入增长为条件）
      - - 基准情景
        - 主要经营支付和小额金融钱包；虚拟银行需要 4+ 年实现盈亏平衡；东南亚业务温和增长
        - 估值维持在 $1.5B-$1.8B 锚点（相较 2021 年持平或小幅上升）；后期进入的 IRR 温和，为 8-12%
        - 泰国市场继续饱和（移动银行渗透率 97%）；银行支付通道挤压利润率
        - 55%（反映当前运营现实与金融科技倍数）
      - - 悲观情景
        - 未能拿到虚拟银行牌照；数字贷款 NPL 飙升至 10% 以上；D 轮条款造成严重清算优先权悬置
        - 下轮融资估值下调至 $800M-$1.0B（倍数压缩至约 0.8x-1.5x）；普通股股本受损
        - Ascend Nano 大额核销；现有商业银行激烈价格竞争
        - 20%（由信用波动和缺少银行牌照驱动）
    notes: 估值区间来自私有融资估值、公开数字借贷收入倍数（0.8x-3.6x）和数字银行盈亏平衡基准；回报预测仅供示意。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV010
      - CV011
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Ascend Money 从 2013 年到 2026 年的发展中，公司的关键、融资、规模、合作与监管里程碑。
    data:
      items:
        - label: 2013：公司成立
          date: '2013'
          details: 成立为 True Corporation 旗下金融科技子公司，解决泰国数字支付选择有限的问题。
          tone: neutral
          claimRefs:
            - CO001
            - CO011
        - label: 2016：与 Ant Group 合作及种子轮
          date: '2016-11-01'
          details: Ant Group 开展战略合作并进行种子投资，使 Ascend Money 与 Alipay 技术架构对齐。
          tone: positive
          claimRefs:
            - CO004
            - CO011
        - label: 2020：支付规模加速
          date: '2020'
          details: 六个东南亚市场的年度总支付额达到 US$14B，泰国增长 84%。
          tone: positive
          claimRefs:
            - CO005
        - label: 2021：独角兽 C 轮融资
          date: '2021-09-27'
          details: 在 $1.5B 估值下，由 Bow Wave Capital Management 领投，CP Group 和 Ant Group 共同参与，获得 $150M C 轮融资。
          tone: positive
          claimRefs:
            - CO002
            - CO006
        - label: 2023：用户规模里程碑
          date: '2023'
          details: TrueMoney 钱包在 6 个区域国家达到 50M 注册用户，并拥有 88,000 个实体代理触点。
          tone: positive
          claimRefs:
            - CO001
            - CO005
        - label: 2024：MUFG $195M D 轮融资
          date: '2024-06-27'
          details: MUFG Bank 和 Krungsri Finnovate 投资 $195M D 轮，以扩大数字普惠金融和消费借贷。
          tone: positive
          claimRefs:
            - CO003
            - CO004
        - label: 2025：Worldpay APM 合作与区域 QR 扩张
          date: '2025-07-03'
          details: 在东盟数字金融扩张之际，Worldpay 将 TrueMoney 接入泰国境内商户收单。
          tone: positive
          claimRefs:
            - CO012
            - CO013
        - label: 2026：FATF 对缅甸加强制裁与 AML 审查
          date: '2026-10-13'
