      - number: '2.2'
        title: 市场规模、支付量与可寻址机会
        blocks:
          - type: paragraph
            body: >-
              评估 Ascend Money 的可寻址市场，必须区分支付总额与可变现交易利润池。2020 年，公司在六个区域市场实现 140 亿美元支付总额，同比增长 84%。 泰国贡献约 70%
              的支付总额，并在消费者电子钱包交易中取得估计约 70% 的国内市场份额。东南亚总可寻址市场超过 6 亿人，其中成年人口大部分历史上无法使用正规商业银行基础设施。 Ascend Money
              的可服务市场围绕泰国、印度尼西亚、菲律宾、越南、柬埔寨和缅甸的现金数字化转型；仅在泰国，公司就触达 3000 万活跃用户，覆盖有银行账户及无银行账户的成年人口。
              但竞争性定价和支付轨道商品化限制了将交易总量转化为持久企业价值的能力。东南亚有 126 家活跃金融科技竞争者，包括 Grab 以及 GCash、Flip 等区域同行。 因此，Ascend Money
              的可获取市场不只取决于处理商户支付量，还取决于通过借贷、财富管理和保险分销实现高毛利转化。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM009
              - CM010
              - CM011
              - CM015
