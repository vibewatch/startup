            body: >-
              与区域金融科技同行相比，Ascend Money 资本充足性和股东支持突出。公司 2021 年 9 月由 Bow Wave Capital Management 联合 CP Group、Ant Group 领投
              1.5 亿美元 C 轮，估值 15 亿美元并成为独角兽。 2024 年 6 月，MUFG 和 Finnoventure Private Equity Trust I 领投 1.95 亿美元投资，使累计股权融资达到
              3.45 亿美元。 这笔资金可支持资产负债表借贷扩张，并满足其待决泰国央行虚拟银行牌照申请的监管资本要求。 但从投资评估角度看，公司财务状况尚未得到证明，且尚无审计依据。公开财务披露不足，无法确认 2023
              年经营盈利转型能否在东南亚信用风险上升时持续。 从代理商协助支付钱包转为全牌照虚拟银行，还会带来严格的监管准备金要求、资产负债表利率风险和更高合规成本。 在认可高于历史 15
              亿美元基准的股权估值前，承保方应要求完整数据室，审阅经审计分部财务、贷款损失准备方法和 CP Group 关联方转移协议。
