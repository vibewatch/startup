  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 按顺序展开的尽调链路：把用户规模、战略支持、估值阻力和信贷逆风串起来，最终指向“继续研究”的建议。
    data:
      nodes:
        - label: 1. 规模与本土市场领先地位
          detail: 泰国有超过 30M 名活跃用户，区域代理商 88,000 家，年 TPV 处理额超过 $14B。
        - label: 2. 战略性企业支持
          detail: CP Group、Ant Group 和 MUFG（$195M Series D）的支持，为公司提供分销渠道和资本支持。
        - label: 3. 虚拟银行催化剂与上行空间
          detail: 与 Ant Group 组成财团竞标 Bank of Thailand 虚拟银行牌照，有望建立存款业务基础。
        - label: 4. 定价与估值阻力
          detail: 最近一次公开估值锚点为 $1.5B（2021 Series C）；2024 Series D 条款仍未披露，且没有公开财务报表。
        - label: 5. 信贷质量与盈利能力逆风
          detail: 数字贷款组合的 NPL 比率为 7.5%，而全球数字银行通常需要 3-8 年才能实现盈利。
        - label: 6. 尽调立场与结论
          detail: 立场：继续研究；估值：偏高；风险：高；投资前必须审计财务状况和资本表。
    approximationNotes: 逻辑推进综合研判定性与定量证据；各节点代表决策阶段，而非数值序列。
    claimRefs:
