  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与支出分配
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 主要处于东南亚零售电子支付、数字信贷和基础消费者金融服务领域。公司的核心商业引擎是 TrueMoney，包含移动钱包应用以及广泛的实体商户和代理商触点。 TrueMoney
              围绕用户效用覆盖日常交易，包括销售点二维码购物、公用事业账单结算、点对点转账和手机充值，也将小微商户收单与商户结算延伸到非正式零售摊位、连锁便利店和电商商户。
              但商业模式明确排除大型企业资金管理、机构间银行电汇清算和正式企业资源规划支付轨道，聚焦大众消费者及中小企业。 除支付外，市场边界还包括 Ascend Nano 纳米金融信贷和 Ascend Wealth
              共同基金分销等零售信贷及小额财富管理业务。各市场的主要替代方案仍是现金，辅以泰国 PromptPay 等国家即时支付系统和传统商业银行移动应用。
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
