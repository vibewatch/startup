          - type: callout
            title: 跨境汇款是服务不足用户的获客漏斗
            body: >-
              Ascend Money 将 TrueMoney 泰国钱包与缅甸 KBZ Bank 等区域金融机构连接，为移民工人建立高效用交易通道。该通道带来黏性较高、可重复的交易量，使 TrueMoney
              区别于只做本土市场的钱包竞争者。
            calloutType: insight
            claimRefs:
              - CU004
              - CU008
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律边界
        blocks:
          - type: paragraph
            body: >-
              2025 年报道将 Ascend Money 牵头的财团列为泰国虚拟银行计划入选的三组之一，并称潜在 2026 年上线前需要一年筹备期。
              同一报道将不可转让牌照、资本门槛、风险管理、网络安全和消费者保护列为条件。这些报道能证明监管路径，但不是当前监管决定，也不能证明银行已在运行日之前上线。
              因此风险不是涉嫌违规，而是公司在支付、汇款、借贷、投资和保险均已铺开的基础上，能否获批、准备就绪并执行上线。
              在拿到主体级牌照文件、权限、资本计划和监管里程碑前，剩余风险仍高。牌照里程碑失期，或借贷、吸收存款受到实质限制，都会削弱扩张逻辑。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
              - CR012
              - CR015
      - number: '7.2'
        title: 运营、信用、欺诈与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营面广且交易量大。历史披露称用户超过 5000 万、代理商 88,000 家、2020 年支付量 140 亿美元；后续报道则称泰国 TrueMoney 用户为 3200 万。
              规模能分散交易，但也扩大了可用性、欺诈、身份、现金代理、数据保护和客户补救义务。 Ascend Money 还描述面向服务不足借款人的替代数据借贷，2025 年报道称超过一半信贷申请者是首次使用正规金融的借款人。
              指定证据池没有当前可用性、重大事件、欺诈损失、贷款账龄、核销或准备金指标。这是披露缺口，不代表没有发生事件或损失。 投资审查应在评估运营或信用韧性前，要求可独立测试的控制和表现数据。
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.3'
        title: 伙伴依赖与财务能力
        blocks:
          - type: paragraph
            body: >-
              战略支持既是缓释因素，也是集中度来源。2021 年融资涉及 Bow Wave、Charoen Pokphand Group 和 Ant Group；后续来源称 2024 年 MUFG 领投 1.95
              亿美元投资，虚拟银行报道则强调 Ant 支持和 CP 关联零售分销。 这些关系能提供资本、技术、触达和信誉，但指定证据未披露排他性、终止权、数据共享义务、服务水平承诺或收入集中度。
              已报道的融资金额也不能证明可用现金、烧钱速度、受监管资本或资金续航。地域披露还从 2021 年的六国变为 2024 年文章中的七国，尚未逐主体核对。
              在审阅合同、法人实体、资本分配和应急安排前，合理的剩余风险判断为中高。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
          - type: table
            tableRef: TR003
