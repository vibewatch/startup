              商户收单业务中，泰国数字钱包和二维码支付的标准商户收单折扣率为每笔 1.5% 至 2.5%；但企业伙伴的实际净 take-rate 会因双边批量返利和联合营销补贴而大幅折价。 Ascend Money 深度接入
              CP Group 关联方，尤其是全国 7-Eleven、Lotus's 大卖场和 True Corporation 移动电信渠道，以较低实体渠道开销获取稳定交易量。
              这能带来独立金融科技同行无法复制的获客效率，但也引入未披露的关联方转移定价，使给予关联门店网络的商户让利压低平台实际支付处理毛利率。
