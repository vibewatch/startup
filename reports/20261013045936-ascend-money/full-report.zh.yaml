      - number: '1.2'
        title: 管理层、治理结构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 采用双首长管理，由顶层企业集团治理支持。Suphachai Chearavanont 是 Ascend Money 创始人兼董事会主席，同时担任 CP Group 首席执行官和 True
              Corporation 董事长。 这一双重身份让 Ascend Money 能接入泰国最大的零售分销网络，包括 CP All 的全国 7-Eleven 门店和 True Corporation
              的电信基础设施，但也使公司高度依赖集团协同。 联席总裁 Monsinee Nakapanant 和 Tanyapong Thamavaranukupt 负责日常经营。Nakapanant
              负责公司战略、区域扩张和战略合作；Thamavaranukupt 负责金融产品、Ascend Nano 数字借贷和支付创新。 这套管理矩阵有助于维持银行合作和运营扩张的连续性。
