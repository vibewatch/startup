      - number: '7.4'
        title: 缓释措施、监测与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              仅凭公开营销或融资公告，无法确认缓释措施成熟度。尽调计划应把每项重大暴露转为可监测条件：取得有效牌照和监管时间表；按主体及国家核对产品权限；测试业务连续性、网络安全、欺诈和投诉控制；审阅贷款 vintage
              与准备金；梳理伙伴合同和监管资本义务。 每月应监测授权里程碑、严重事件、欺诈和信用损失、代理商流动性、投诉、伙伴集中度及不受限流动性。 若上线无监管支持的解释而延误，严重事件暴露出补救无效，损失 cohort
              超过批准的风险偏好，关键伙伴可在无替代方案时终止，或可用资本跌破董事会批准的缓冲，均应暂停投资论点。 这些是尽调触发条件，不是声称任何事件已经发生。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR008
              - CR012
