        title: 成本结构、毛利与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              TrueMoney 的成本主要来自银行交换费、网关清算支出、代理商现金分发佣金和技术基础设施维护。平台运营整整十年后才于 2023 年实现整体经营盈利，历史成本基线长期被获客促销、支付网关交换费和合规成本推高。
              泰国活跃用户每月平均交易支出约 3,000 至 4,000 泰铢（约 $85 至 $115），交易频率高但便利店零售和小额支付的平均客单价不高。 因此支付毛利结构性偏薄，估计为 25% 至
              35%。管理层公开承认，2023 年高毛利金融服务仅占公司利润 10%，并将 2025 年提升至 50% 作为明确目标。 要实现这一扩张，必须大力扩大微型借贷和财富分销；这些业务在计提信用违约准备前的毛利通常超过
              60%。 但经审计的贷款损失准备、各期逾期率和获客成本仍属严格保密的私有数据，承保方无法独立核验当前资产组合健康度。
