      - number: '3.3'
        title: 变现模式与国家支付轨道去中介化
        blocks:
          - type: paragraph
            body: >-
              PromptPay 国家支付轨道的快速扩张，彻底改变了泰国数字支付经济性。在泰国央行支持下，PromptPay 每日处理超过 7400 万笔交易，零售消费者转账不收费，实际上把实时数字支付变成公共免费服务
              [CP008]。 这套基础设施大幅压低独立支付处理 take-rate，使数字钱包无法在国内消费者点对点转账上收取传统交换费或交易费 [CP010]。 因此 Ascend Money
              将变现引擎转向轻资产负债表信贷中介和财富管理分销，以守住利润利差 [CP007]。邻近市场也出现类似路径：GoTo Financial 在 2025 年通过 GoPay Pinjam 和 GoPay Later
              扩大放贷，实现财务扭转，说明消费者信贷是支付轨道商品化后的主要变现引擎 [CP006, CP011]。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
