callouts:
  - calloutType: strength
    title: Dominant Thai Domestic Position Backed by Conglomerate Distribution
    body: >-
      Ascend Money maintains an exceptional competitive moat in Thailand through its deep integration with Charoen
      Pokphand Group's retail ecosystem, spanning 7-Eleven convenience stores and True Corporation's telecommunications
      infrastructure, serving 30 million active users in Thailand alone.
    claimRefs:
      - CO001
      - CO003
      - CO007
  - calloutType: risk
    title: Cross-Border Regulatory Bottlenecks in Sanctioned Regional Corridors
    body: >-
      While Ascend Money targets regional remittance and agent networks across six Southeast Asian nations, operations
      connected to Myanmar encounter severe regulatory headwinds from FATF high-risk calls for action and active U.S.
      Treasury sanctions, requiring stringent AML/CFT compliance and constraining cross-border expansion.
    claimRefs:
      - CO001
      - CO014
      - CO015
