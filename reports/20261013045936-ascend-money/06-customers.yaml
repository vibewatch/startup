callouts:
  - calloutType: "risk"
    title: "Distribution Channel and Retail Network Concentration"
    body: "Ascend Money's retail traction in Thailand remains heavily anchored to CP Group's 7-Eleven network, creating substantial channel dependence. While the convenience store footprint provides unmatched physical top-up reach, changes in commercial terms or competitive pressure from commercial banks' PromptPay infrastructure could constrain TrueMoney's margins and independent user acquisition."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU007"
  - calloutType: "insight"
    title: "Cross-Border Remittances as an Underserved User Acquisition Funnel"
    body: "By connecting TrueMoney's Thai wallet infrastructure with regional financial institutions such as KBZ Bank in Myanmar, Ascend Money establishes high-utility transaction corridors for migrant workers. This corridor provides sticky, recurring transaction volumes and differentiates TrueMoney from domestic-only digital wallet competitors."
    claimRefs:
      - "CU004"
      - "CU008"
