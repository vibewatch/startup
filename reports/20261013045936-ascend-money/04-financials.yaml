    - 10% in 2023 (targeting 50% by 2025)
    - medium
    - Critical inflection indicator proving payment utility subsidizes higher-margin financial products
    - Review audited segment gross margin and operating profit contributions from lending vs payments.
  - - Annualized Payment Volume (GTV)
    - $14 billion (reported for 2020)
    - medium
    - Establishes baseline commercial throughput across regional e-wallet and agent channels
