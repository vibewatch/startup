- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / Service
  - Contract / Pricing Structure
  - List vs Realized Pricing
  - Discounts / Unknowns
  - Source & Verification
  rows:
  - - TrueMoney Merchant QR Acceptance
    - Standard merchant discount rate (MDR) on QR payment transactions
    - List MDR estimated at 1.5% - 2.5%; realized MDR compressed for enterprise partners
    - Bilateral retail merchant interchange agreements and partner fee waivers remain undisclosed
    - Ascend Money official service overview and industry payment processing standards
  - - TrueMoney Consumer Bill & Utility Payments
    - Flat fee per bill payment or percentage markup on select premium utility providers
    - Standard bill payment listed free or nominal 5-15 THB fee; subsidized by billers
    - Biller commission sharing arrangements and partner concessions undisclosed
    - Official consumer wallet disclosure and user documentation
  - - Ascend Nano Personal Micro-Credit
    - Stated annual percentage rate (APR) capped by Bank of Thailand regulatory ceilings
    - List maximum APR up to 25% - 33% under regulatory guidelines; realized yields depend on repayment
    - Effective annualized delinquency penalties and collection fee concessions undisclosed
    - Bank of Thailand lending framework and Ascend Nano platform service filings
  - - Cross-Border Remittances & FX
    - FX spread markup over interbank exchange rates plus flat corridor transfer fee
    - Disclosed retail FX spread and corridor charges; wholesale interbank clearing cost undisclosed
    - Corridor-specific agent split and partner settlement discounts unreleased
    - Ascend Money regional remittance announcements and partner documentation
  notes: Pricing structures reflect published consumer schedules and standard retail merchant processing terms; bilateral enterprise partner concessions are private.
