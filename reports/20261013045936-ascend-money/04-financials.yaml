  - - Customer Acquisition Cost (CAC) Proxy
    - null
    - low
    - Underwrites marketing payback and distribution leverage via 7-Eleven retail touchpoints
    - Request customer acquisition expenditures broken down by organic, retail, and paid media.
  - - Net Credit Loss Provisioning Rate
    - null
    - low
    - Determines underwriting risk and capital preservation for Ascend Nano micro-lending portfolios
    - Inspect historical loan delinquency matrices, 30/60/90-day DPD ratios, and recovery rates.
  notes: Disclosed unit economic metrics versus unreleased private operating data; null fields require data-room management confirmation.
