    title: "Dual Online-Offline Distribution Moat"
    body: "Ascend Money pairs its TrueMoney digital wallet with an expansive offline network of 88,000 agents and thousands of CP Group retail outlets, enabling deep penetration across unbanked populations that pure-play software competitors struggle to access."
    claimRefs:
      - "CM004"
      - "CM006"
      - "CM007"
  - calloutType: "risk"
    title: "High Geographic Concentration in Domestic Thailand"
    body: "With approximately 70% of payment volume originating in Thailand, Ascend Money remains heavily exposed to local regulatory policy and PromptPay interbank competition, while regional markets present intense competition from 126 active fintech rivals."
    claimRefs:
