artifact: financials
slug: rain
runDate: 2026-10-15
company:
  name: Rain
chapter:
  number: 4
  title: Financials
  summary: >
    Rain shows unusually strong public top-line momentum for an infrastructure company — a $250 million Series C at a
    $1.95 billion valuation, more than $3 billion of annualized payment volume, and an expanding product surface across
    cards, wallets, and payouts. The underwriting problem is that nearly every decision-grade input below volume remains
    undisclosed in the assigned evidence pool: public sources do not reveal realized pricing, revenue run rate, gross
    margin, burn, cash runway, reserve terms, or partner concentration, so the financing looks like strategic time to
    scale rather than proof of durable unit economics.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and traction proxies
    body: |
      Public evidence shows Rain monetizing a full-stack enterprise payments workflow rather than a single card feature. The company markets one integration for card issuing and publishes a new wallet layer that ties virtual accounts, cards, and payouts to the same balance, while partner announcements show third parties using Rain as the underlying issuance and settlement operator. That gives Rain multiple logical monetization surfaces — program setup, card economics, wallet and payout usage, and enterprise service revenue — but only the operating footprint is visible publicly. The most concrete traction signals remain company-reported: more than $3 billion of annualized payment volume, more than 200 partners, 30x active-card growth, and 38x payment-volume growth over the prior year.
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008, CI009, CI010, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-cost-structure
    title: Unit economics and cost structure
    body: |
      Rain’s public product pages support the core economic story: direct network membership, daily stablecoin settlement with Visa, and a claim of lower collateral requirements than traditional issuers. Those features plausibly improve working-capital efficiency for Rain or its partners, and they strengthen the product’s enterprise value proposition. They still do not disclose the economics that matter for underwriting. The evidence pool provides no current public take-rate schedule, no by-product revenue mix, no gross-margin disclosure, and no reconciliation from payment volume to retained revenue after network fees, funding costs, losses, support, and partner revenue share. As TechFlow notes, payment growth therefore demonstrates activity, not proven operating leverage.
    claimRefs: [CI004, CI005, CI006, CI013, CI014]
    tableRefs: [TI003]
  - id: capital-needs-and-financing-dependency
    title: Capital needs and financing dependency
    body: |
      The January 2026 Series C clearly strengthened Rain’s ability to keep expanding: independent coverage says the round will fund licensed-market expansion, product deepening, acquisitions, and broader enterprise sales. That matters because Rain’s model appears capital-aware even if the exact burden is not public. The company is still building regulated and operational infrastructure across cards, wallets, cross-border payouts, and now a proposed national trust bank. The trust-bank application could eventually internalize custody, reserve management, and stablecoin issuance, but today it is only an application, remains subject to OCC review and public comment, and is described by Rain as a multi-year initiative. In practice, the funding round buys time and strategic flexibility, not proof that the business can self-fund its next phase.
    claimRefs: [CI001, CI011, CI012, CI015, CI016]
  - id: financial-verdict-and-blockers
    title: Financial verdict and blockers
    body: |
      Financially, Rain looks like a high-potential infrastructure platform with strong distribution momentum and a credible product reason for enterprise adoption, but the public evidence is still one layer too shallow for valuation underwriting. The visible data supports volume growth and product breadth, not revenue quality. Without disclosed revenue run rate, net take rate, gross margin by product, customer or partner concentration, burn, cash, runway, and reserve requirements, it is impossible to judge whether the $1.95 billion valuation is pricing durable software-like economics or simply rewarding strategic positioning in stablecoin payments. The result is a cautiously positive operating view paired with a research-more financial verdict.
    claimRefs: [CI003, CI005, CI013, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - ["Card issuing infrastructure", "Enterprise partners launch global credit, debit, and prepaid programs through Rain's issuing stack.", "Program fees / interchange share / implementation fees", "Live product; one integration and one operating model across key regions are publicly marketed.", "Medium — product is visible, realized economics are not.", "Provide current enterprise contracts showing take rate, revenue share, reserve terms, and loss allocation."]
      - ["Embedded wallets", "Rain Wallets add stablecoin storage and funding accounts that connect directly to cards, virtual accounts, and payouts.", "Wallet platform fees / spread / attach revenue", "Non-custodial wallets are available now; custodial wallets and earning features are planned before end-2026.", "Medium — launch and functionality are public, monetization is not.", "Disclose wallet pricing, funded-wallet counts, and attach rate to card or payout products."]
      - ["Payouts and offramps", "Partners can move wallet balances to local bank accounts through Rain's payout rails.", "Per-transfer fees / FX spread", "Product is publicly described as part of the unified stack, but corridor pricing is not public.", "Low-to-medium — capability is public, economics are opaque.", "Share corridor-level pricing, banking-partner costs, and gross margin by payout corridor."]
      - ["Partner-branded card programs", "Rain powers branded enterprise or SMB cards while the partner keeps customer ownership and underwriting.", "Revenue-share or service-fee contract", "Stewards plans a branded SMB card with Rain managing issuance and settlement; launch is targeted for early Q1 2027 subject to approvals.", "Medium — partner proof exists, commercial split is undisclosed.", "Provide implementation fees, minimum commitments, and ongoing servicing economics for branded partner programs."]
    notes: "Public sources establish the visible product surfaces but not realized pricing; 'current value/status' distinguishes live functionality from planned launches and should not be read as disclosed revenue."
    claimRefs: [CI004, CI007, CI008, CI009, CI010]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Card issuing platform economics", "No public list price; public evidence only supports that Rain reduces intermediaries and settles with Visa daily using stablecoins.", "Realized program pricing, interchange retention, funding costs, reserve requirements, and partner revenue share are undisclosed.", "Rain card-issuing page; TechFlow analysis"]
      - ["Wallet product", "No public list price; functionality is described but monetization is not.", "Unknown wallet fees, custody pricing, or revenue share for future earning products.", "PRNewswire launch; Cointrust coverage"]
      - ["Payouts / offramps", "No public corridor schedule or disclosed FX spread.", "Unknown realized economics by geography, banking partner, or volume tier.", "PRNewswire launch; Cointrust coverage"]
      - ["Working-capital efficiency claim", "Publicly marketed as 'Up to 60% lower collateral requirements compared to traditional card issuers'.", "Claim is directional marketing, not a contract schedule; actual reserve covenants and collateral mechanics remain undisclosed.", "Rain card-issuing page"]
    notes: "This table records only what the assigned evidence pool makes public. Missing list prices and realized economics are evidence gaps, not zero-cost assumptions."
    claimRefs: [CI005, CI007, CI009, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Annualized payment volume", ">$3B annualized", "Medium", "Demonstrates throughput and enterprise adoption momentum.", "Reconcile annualized payment volume to recognized revenue and retained gross profit."]
      - ["Partner count", ">200 partners", "Medium", "Indicates breadth of distribution but not concentration or spend quality.", "Break out active revenue-generating partners, top-10 concentration, and churn."]
      - ["Active card base growth", "+30x YoY", "Medium", "Shows fast adoption but not the absolute baseline or monetization per card.", "Provide absolute active-card counts, cohort retention, and spend per active card."]
      - ["Annualized payment-volume growth", "+38x YoY", "Medium", "Signals operating velocity but not contribution margin.", "Show period definitions, absolute starting base, and margin by growth cohort."]
      - ["Collateral efficiency claim", "Up to 60% lower collateral requirements", "Medium", "Suggests working-capital advantage relative to legacy issuers.", "Provide actual reserve formulas and collateral requirements by program type."]
      - ["Revenue run rate", null, "Low", "Core denominator for valuation and underwriting.", "Disclose current revenue run rate and recognized revenue policy by product."]
      - ["Gross margin by product", null, "Low", "Determines whether payment volume can translate into durable software-like economics.", "Provide gross margin split for issuing, wallets, payouts, and ancillary services."]
      - ["Cash balance / burn / runway", null, "Low", "Series C adequacy cannot be assessed without current liquidity and burn.", "Disclose cash, monthly burn, debt or project-finance obligations, and runway."]
      - ["Customer / partner concentration", null, "Low", "A few oversized programs could make the growth story fragile.", "Provide revenue and volume concentration for the largest customers and channels."]
    notes: "Null values mark genuinely undisclosed public inputs in the assigned evidence pool; they are diligence requests, not implied zeros."
    claimRefs: [CI002, CI003, CI005, CI013, CI014, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "Rain's public materials support a unified stablecoin payments workflow, but the retained economics at each step remain mostly private."
    data:
      nodes:
        - id: user-funding
          label: "Funds enter partner app"
          detail: "Users or businesses receive funds through virtual accounts or onramps exposed inside a partner workflow."
        - id: wallet-balance
          label: "Wallet / stablecoin balance"
          detail: "Rain Wallets centralize storage, card funding, and money movement from a single balance."
        - id: card-program
          label: "Rain-issued card program"
          detail: "Partners launch branded consumer or business card programs through Rain's issuing stack."
        - id: network-settlement
          label: "Daily network settlement"
          detail: "Rain says it settles card transactions with Visa daily using stablecoins instead of legacy multi-day cycles."
        - id: payout-rail
          label: "Spend or payout rail"
          detail: "Balances can be spent at merchant locations or moved to local bank accounts through payout infrastructure."
        - id: retained-economics
          label: "Rain retained economics"
          detail: "Public evidence does not reveal the take rate, revenue split, reserve cost, fraud loss, or support cost that converts volume into gross profit."
      edges:
        - from: user-funding
          to: wallet-balance
          label: "funding"
        - from: wallet-balance
          to: card-program
          label: "card funding"
        - from: card-program
          to: network-settlement
          label: "network clearing"
        - from: network-settlement
          to: payout-rail
          label: "spend or local payout"
        - from: payout-rail
          to: retained-economics
          label: "fees net of partner and operating costs"
    approximationNotes: "The sequence is product-mechanism evidence, not a quantified margin waterfall; public sources describe the steps but not the realized economics at each node."
    claimRefs: [CI004, CI005, CI007, CI009, CI014]
callouts:
  - calloutType: strength
    title: "Credible product breadth, still limited financial visibility"
    body: "Cards, wallets, payouts, and partner-issued programs together make Rain look like a real platform rather than a single-feature issuer."
    claimRefs: [CI004, CI007, CI009, CI010]
  - calloutType: risk
    title: "Volume is visible; retained revenue is not"
    body: "Public sources support throughput and fundraising, but not the take rate, gross margin, burn, or concentration needed to underwrite the valuation."
    claimRefs: [CI001, CI003, CI013, CI014, CI016]
  - calloutType: recommendation
    title: "Ask for a board-style financial package before underwriting"
    body: "The next diligence round should request revenue recognition, gross margin by product, reserve formulas, concentration, cash, burn, and runway by major program."
    claimRefs: [CI013, CI014, CI016]
