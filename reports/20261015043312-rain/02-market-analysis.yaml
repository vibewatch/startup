      - Buyer/payer
      - Relevance
    rows:
      - ["Stablecoin card issuing and spend", "Compliant consumer and business card programs, rewards, settlement, and card-funded purchases linked to stablecoin balances", "Generic card spend not powered by Rain infrastructure or traditional card issuing with no stablecoin leg", "Fintechs, platforms, enterprises; payments or product teams fund implementation", "Core wedge where Rain promises faster launch, fewer intermediaries, and better economics"]
      - ["Wallet-centric money movement", "Receive, hold, send, spend, onramp, offramp, and payout flows inside one partner application", "Standalone self-custody software or wallets with no payment orchestration layer", "Platforms, neobanks, and app builders; product and compliance teams pay for rollout", "October 2026 wallet launch expands the monetizable workflow beyond card spend"]
      - ["Cross-border treasury and payouts", "Virtual accounts, local-currency payouts, and cross-border settlement for enterprise or platform disbursement flows", "General correspondent banking activity outside Rain-enabled programs", "Enterprises and payment platforms; treasury and operations teams own the budget", "Cross-border use cases explain why reach, licensed footprint, and partner banks matter"]
      - ["Compliance and operating layer", "Fraud, disputes, reporting, orchestration, and regulated launch support bundled with payment rails", "Speculative trading activity or protocol volume that never enters regulated payment programs", "Banks, regulated fintechs, and enterprise operators; compliance and risk teams influence spend", "This layer helps explain why Rain sells infrastructure access rather than undifferentiated transaction volume"]
    notes: "Rows define the monetizable workflow boundary for this chapter; excluded items are intentionally outside Rain's supported enterprise payments wedge."
    claimRefs: [CM001, CM002, CM003, CM007]
