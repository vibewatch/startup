    title: TAM, SAM, SOM, and sizing lens table
    columns:
      - Publisher
      - Year / period
      - Geography / lens
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["AlleyWatch interview with Rain CEO", "2024", "Global stablecoin activity", "$27.6T processed", "n/a", "Company-cited macro transaction-volume statistic relayed in interview", "low", "Measures broad stablecoin throughput, not enterprise card-and-wallet infrastructure spend"]
      - ["AlleyWatch interview with Rain CEO", "2030 outlook", "Projected stablecoin market", "$3.7T", ">10x versus current baseline", "Company-cited forward market projection with no public method in the interview", "low", "Appears to use a different denominator from the 2024 transfer-volume figure, so it is not directly comparable"]
      - ["Rain / PR Newswire", "Jan 2026", "Current Rain platform throughput", ">$3B annualized transactions and 200+ partners", "n/a", "Company-reported realized operating scale", "medium", "Shows current adoption, not Rain's addressable market ceiling or unit economics"]
      - ["Rain / FTA / product pages / wallet launch coverage", "2026", "Distribution footprint proxies", "175M merchants, 150+ countries, 2.5B+ reachable people", "n/a", "Acceptance, country, and reach metrics taken from public operating and launch materials", "medium", "Reach and merchant acceptance are enablement proxies, not paying customers or contracted revenue"]
    notes: "The table mixes macro market proxies with Rain's own throughput and reach metrics because public evidence does not disclose a clean SAM or SOM for the niche."
    claimRefs: [CM004, CM005, CM006, CM008, CM012]
