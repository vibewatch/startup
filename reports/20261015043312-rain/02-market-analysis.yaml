      - ["Large enterprises", "Treasury, finance, or embedded-finance owner", "Employees, contractors, or platform participants", "Corporate payments or treasury budget", "Cross-border disbursements, spend controls, and working-capital-sensitive settlement", "Treasury plus operations", "Daily settlement and lower collateral needs versus legacy issuer setups"]
