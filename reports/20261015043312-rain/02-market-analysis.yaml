          tone: positive
          claimRefs: [CM008]
        - label: Current Rain throughput
          value: 3
          unit: B USD annualized transactions
          valueNote: Realized platform scale and the closest public proxy for actual penetration
          tone: positive
          claimRefs: [CM006]
    approximationNotes: >-
      These layers are evidence-backed adoption proxies with different units and time bases;
      they are shown together because public sources do not isolate a comparable SAM or SOM
      for Rain's enterprise stablecoin payments niche.
    claimRefs: [CM004, CM005, CM006, CM008, CM012, CM013]
callouts:
  - calloutType: insight
    title: Large base layer, narrow monetizable wedge
    body: >-
      The public case for market size is strongest when framed as migration of enterprise
      payment workflows onto stablecoin rails, not as capture of the whole stablecoin economy.
    claimRefs: [CM001, CM004, CM012]
  - calloutType: risk
    title: Regulatory leverage expands the market only if approvals clear
    body: >-
      Rain's licensed-footprint ambitions and trust-bank application could widen buyer demand,
      but the legal and approval timeline means those benefits should be underwritten as
      contingent rather than immediate.
    claimRefs: [CM010, CM011]
