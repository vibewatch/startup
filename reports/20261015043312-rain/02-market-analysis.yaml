artifact: market-analysis
slug: rain
runDate: 2026-10-15
company:
  name: Rain
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Rain is pursuing a narrow but expanding wedge inside the broader stablecoin economy:
    enterprise infrastructure that lets banks, fintechs, platforms, and large enterprises
    launch card, wallet, payout, and cross-border money-movement programs without stitching
    together multiple providers. Public sizing evidence supports strong adoption tailwinds and
    real platform throughput, but it does not isolate a clean source-backed SAM or SOM for
    Rain's specific monetizable niche.
sections:
  - id: market-boundary
    title: Market boundary and included workflows
    body: >-
      Rain's public product and partner materials consistently define the target market as
      enterprise stablecoin payments infrastructure rather than general-purpose consumer
      crypto. The included workflow is broad inside that boundary: card issuing, wallet
      balances, fiat onramps and offramps, payouts, rewards, and cross-border movement of
      funds, all presented as one integration and one operating model for regulated launch and
      scale. That framing matters because it narrows the investable question from "how large
      are stablecoins?" to "how much enterprise spend will migrate to orchestrated stablecoin
      payment programs?" It also clarifies what should be excluded from market sizing:
      speculative token trading, protocol-level activity that never touches card or payout
      flows, and generic merchant acceptance that Rain does not intermediate. The October 2026
      wallet launch expands the included workflow from spend enablement into the full
      receive-hold-send-spend cycle, which widens the addressable product surface without
      proving that Rain captures the whole stablecoin economy.
    claimRefs: [CM001, CM002, CM003, CM007]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Public sizing lenses are directional, not investable TAM
    body: >-
      The public numerics around Rain are useful, but they mix fundamentally different
      denominators. Rain's CEO told AlleyWatch that stablecoins processed $27.6T in 2024 and
      that the market could grow more than 10x to $3.7T by 2030; those statements point to a
      large secular tailwind, but they do not disclose methodology and are not directly
      comparable to each other. The more concrete lens is Rain's own disclosed platform
      throughput and distribution footprint: more than $3B in annualized transactions, more
      than 200 partners, cards accepted at 175 million merchant locations, reach into more
      than 150 countries, and a claim that partner programs can touch 2.5 billion-plus people.
      Those figures show real adoption and large potential distribution, but they still do not
      isolate a priced SAM or realistic near-term SOM for Rain's specific product mix. The
      right reading is that public evidence supports a large and fast-growing base layer, while
      the monetizable slice remains proxy-based.
    claimRefs: [CM004, CM005, CM006, CM008, CM012]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-and-constraints
    title: Buyers, budget owners, adoption drivers, and constraints
    body: >-
      The most credible buyer set is enterprise and platform operators that need to launch or
      upgrade compliant money movement, not retail end users choosing a wallet app. Public
      materials point to buyers across enterprises, banks, fintechs, neobanks, and software
      platforms, with economic ownership likely split among payments, treasury, product, and
      compliance leaders depending on the workflow. Adoption drivers are operational rather
      than ideological: daily stablecoin settlement with Visa, lower collateral requirements,
      fewer intermediaries, global launch coverage from one integration, and built-in
      compliance, dispute, and reporting operations. The constraints are equally concrete.
      Rain still needs licensed-market expansion, card-network and partner dependencies remain
      structural, and the proposed OCC trust-bank path sits inside an active legal challenge,
      which reinforces that regulatory leverage can expand the addressable market only on a
      multi-year timeline. Investors therefore need to underwrite adoption pacing, not just
      top-down stablecoin enthusiasm.
    claimRefs: [CM002, CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
