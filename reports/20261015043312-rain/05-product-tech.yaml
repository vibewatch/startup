    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - ["Card issuing", "Fintech, enterprise, and program managers", "Live public core", "One integration, direct network posture, and stablecoin settlement aimed at lower collateral and faster launch", "Realized economics, processor dependencies, and interchange splits are not public."]
      - ["Embedded wallets", "Partner product teams and end users", "Non-custodial live; custodial and earning features roadmap for 2026", "Passkey / one-time-code onboarding and support for 12 blockchains", "Custody model by jurisdiction and monetization of wallet balances are not public."]
      - ["Virtual accounts, onramps, offramps, and payouts", "Operations, treasury, and cross-border payment flows", "Presented as live workflow components", "Single balance can move from incoming funds to spend or local-currency payout inside partner apps", "Named banking partners, corridor coverage, and FX economics are only partially public."]
      - ["Controls and regulated custody layer", "Program operators and compliance teams", "Platform controls described as live; trust-bank expansion pending approval", "Compliance, fraud, disputes, and reporting sit inside the platform while the charter path could internalize custody and reserves", "No public SLA, certification list, or regulator-approved custody architecture is in the assigned pool."]
    notes: "Matrix reflects only the assigned prefetched sources; maturity labels distinguish live public modules from roadmap statements and pending approvals."
    claimRefs: [CE002, CE003, CE004, CE005, CE007, CE011, CE012]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Rain solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Launch a global card program", "Traditional issuers add intermediaries and longer regional setup cycles", "Rain offers one integration and operating model for credit, debit, and prepaid card programs", "Official page claims 8-12 week launch windows and stablecoin settlement that lowers collateral needs", "No public implementation case study in the assigned pool verifies time-to-launch in production."]
      - ["Receive and store stablecoin balances in-app", "Partners usually stitch a wallet provider to separate payment rails", "Embedded wallets become the central balance for receiving, holding, and managing stablecoins", "Users can sign in with passkeys or one-time codes instead of seed-phrase onboarding", "The assigned pool does not show official API references, auth flows, or supported developer SDKs."]
      - ["Spend wallet balances globally", "Wallet funds often need a separate card program before users can transact offline or online", "Rain wallet balances can fund Rain-issued cards accepted at 175 million merchant locations", "Card usage extends stablecoin balances into everyday merchant acceptance", "The pool does not show pricing, underwriting rules, or per-market card availability."]
      - ["Cash out or move funds cross-border", "Users often leave the product to find payout partners or local bank rails", "Rain pairs wallet balances with offramps, payouts, and Western Union-linked cross-border capability", "Funds can move from receipt to local-currency bank payout within the partner experience", "Corridor coverage, payout speeds, and partner-level service guarantees are not public in the assigned evidence."]
    notes: "Benefits are limited to claims explicitly stated in public sources; unverified production metrics stay as diligence gaps rather than inferred outcomes."
    claimRefs: [CE002, CE004, CE006, CE007, CE009, CE013, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Partner integration layer", "Embeds Rain into merchant or fintech applications through one integration", "Rain-controlled APIs, launch support, and partner implementation resources", "Public marketing asserts simplicity, but the assigned pool does not include official developer docs or a public sandbox."]
      - ["Wallet and custody layer", "Holds stablecoin balances and exposes non-custodial access today with custodial roadmap later", "Supported blockchains, wallet UX, key-management design, and future custodial stack", "Public evidence confirms features, but not custody controls, reserve design, or jurisdiction-by-jurisdiction eligibility."]
      - ["Card and settlement layer", "Turns balances into card spend, with virtual and physical cards and mobile-wallet provisioning", "Visa / Mastercard connectivity, processors, and stablecoin settlement workflow", "Economics and settlement claims are public, but processor architecture and exception handling are not."]
      - ["Money movement layer", "Connects virtual accounts, onramps, rewards, offramps, and payouts around the same balance", "Bank partners, payout partners, and local rail coverage", "Cross-border functionality is strategically important, but corridor depth and failure handling are not public."]
      - ["Control and regulatory layer", "Wraps compliance, fraud, disputes, reporting, and prospective trust-bank functions around product usage", "Partner-bank infrastructure today and OCC approval for the proposed trust-bank structure", "The charter framework is under litigation, so some future control-plane assumptions depend on external approvals."]
    notes: "This architecture table reconstructs the operating model from public product pages and launch coverage; it is not a substitute for official technical documentation."
    claimRefs: [CE002, CE003, CE004, CE005, CE007, CE011, CE012, CE013]
