schemaVersion: "report-v2"
artifact: product-tech
slug: rain
runDate: 2026-10-15
company:
  name: Rain
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Rain's public product evidence describes a stablecoin-native payments stack that starts with card issuing and now centers on embedded wallets, virtual accounts, and payouts delivered through one partner integration. The strongest evidence supports real product breadth and differentiated network connectivity, but the public technical diligence surface is still thin because the assigned pool does not include official API docs, certification evidence, or uptime commitments."
sections:
  - id: delivered-workflow
    title: Delivered workflow and product modules
    body: |-
      Rain's public product story is coherent at the workflow level even though the technical surface remains light on implementation detail. The official card-issuing page frames Rain as a one-integration platform for global card programs, while the 2026 wallet launch coverage expands that same stack into a single balance that can receive funds, hold stablecoins, fund card spend, and cash out through payouts. That matters because the product is not just "stablecoin cards"; the reviewed evidence consistently describes a business-to-business infrastructure layer that lets partners embed cards, wallets, rewards, onramps, offramps, and payouts without rebuilding the operating model for each region or product module.
    claimRefs: [CE001, CE002, CE004, CE005, CE007, CE009, CE013, CE014]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, deployment, and public maturity signals
    body: |-
      The architecture implied by the assigned sources is operational rather than deeply technical: partner applications connect once, wallet balances become the center of record for stablecoin funds, Rain-issued cards expose spending, and payout rails move value back to local bank accounts. Public maturity signals are strongest around go-to-market readiness, not developer depth. Rain's official page claims 8-12 week launch timelines, daily Visa settlement with stablecoins, virtual and physical card support, and mobile-wallet provisioning, while third-party launch coverage confirms that non-custodial wallets are live today and custodial wallets remain roadmap. By contrast, the only GitHub-surface evidence in the pool is a third-party API Evangelist profile that explicitly says the listing is still a stub, so public developer proof does not yet match the breadth of the product pitch.
    claimRefs: [CE003, CE006, CE008, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: controls-and-technical-risk
    title: Controls, regulatory dependencies, and diligence gaps
    body: |-
      Rain does present controls as part of the product, but the evidence is high-level. The official page says compliance, fraud, disputes, and reporting are handled within the platform, and launch coverage says partner-bank infrastructure supports KYC and AML workflows. That is enough to establish control-plane intent, not enough to underwrite operating resilience or regulated-custody readiness. The sharpest current product-technology risk in the assigned pool is regulatory dependency: crypto.news reports that Rain's proposed national trust bank would sit in a separate OCC-supervised subsidiary and that the charter regime is already under legal challenge. For diligence, the biggest remaining gaps are missing official API documentation, absent public certification or uptime evidence, and no detailed public disclosure on how custody, reserve management, and jurisdiction-specific controls change as the wallet roadmap expands.
    claimRefs: [CE011, CE012]
tables:
