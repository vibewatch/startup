  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: developer-surface
      missingEvidence: "Official API references, authentication model detail, sandbox access, webhook coverage, and implementation docs for the one-integration claim."
      whyItMatters: "The public materials prove product breadth but do not let diligence test integration complexity, developer readiness, or partner engineering effort."
      diligencePath: "Request current developer documentation, sample payloads, auth flows, SDK coverage, and a live partner implementation walkthrough."
      relatedQuestionRefs: [QE004]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: reliability-controls
      missingEvidence: "Public uptime history, status-page evidence, incident-response commitments, privacy/security certifications, and service-level guarantees."
      whyItMatters: "Control-plane claims are directionally positive, but without reliability and assurance evidence the team cannot underwrite production-readiness for regulated payment flows."
      diligencePath: "Request SOC 2 or equivalent assurance artifacts, public or private uptime data, incident runbooks, and customer SLA commitments."
      relatedTableRefs: [TE001, TE003]
    - type: missing-source
      severity: material
      topic: custody-and-jurisdiction
      missingEvidence: "A public matrix showing which jurisdictions, partners, and use cases support non-custodial wallets, future custodial wallets, stablecoin earning, and trust-bank services."
      whyItMatters: "Rain's roadmap increasingly depends on custody, reserve, and regulatory choices that can change the product's operational design and addressable customer set."
      diligencePath: "Request a jurisdiction-by-jurisdiction product and licensing matrix tied to wallet mode, payout corridors, reserve management, and rollout timing."
