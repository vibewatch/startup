callouts:
  - calloutType: "strength"
    title: "Principal-membership distribution wedge"
    body: "Rain's strongest public differentiator is not just a generic crypto API; it is the combination of card-network membership, stablecoin-native settlement, and enterprise distribution relationships that lets partners launch cards and wallets through one infrastructure layer."
    claimRefs: ["CO001", "CO009", "CO010"]
  - calloutType: "risk"
    title: "Valuation outruns disclosure depth"
    body: "The $1.95 billion Series C valuation is easy to quote, but the assigned source set still does not surface revenue, margins, headcount, full board composition, or partner concentration — leaving investors to underwrite a fast-scaling story with incomplete economic visibility."
    claimRefs: ["CO007", "CO013", "CO014"]
