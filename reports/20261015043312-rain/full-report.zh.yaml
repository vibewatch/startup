  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入的工作流
        blocks:
          - type: paragraph
            body: >-
              Rain
              的公开产品和合作伙伴材料始终把目标市场定义为企业稳定币支付基础设施，而非通用消费级加密业务。在这一边界内，纳入的工作流很广：发卡、钱包余额、法币入金和出金、出款、奖励以及跨境资金流转，统一通过一次集成和一套运营模式服务于受监管的上线和规模化。这个界定很关键，因为它把可投资问题从“稳定币有多大”缩小为“有多少企业支付支出会迁移到编排式稳定币支付项目”。它也说明市场规模测算应排除哪些内容：投机性代币交易、不触及卡或出款流程的协议层活动，以及
              Rain 并不经手的通用商户受理。2026 年 10 月推出钱包后，纳入的工作流从消费支出扩展到完整的收款—持有—发送—消费周期，扩大了可服务的产品面，但并不能证明 Rain 能捕获整个稳定币经济。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 公开规模测算只是方向性指标，不是可投资 TAM
        blocks:
          - type: paragraph
            body: >-
              Rain 周围的公开数字有参考价值，但混用了本质不同的分母。Rain CEO 告诉 AlleyWatch，2024 年稳定币处理了 $27.6T，市场到 2030 年可能增长超过 10x、达到 $3.7T；
              这些说法指向很大的长期顺风，却没有披露方法，也不能直接相互比较。更具体的视角来自 Rain 自己披露的平台吞吐量和分销覆盖：年化交易额超过 $3B、合作伙伴超过 200 家、卡片可在 175 million
              个商户地点使用、覆盖超过 150 个国家，并称合作伙伴项目可触达超过 2.5 billion-plus 人。这些数字说明已有真实采用和庞大的潜在分销，但仍未拆出 Rain 特定产品组合的有价格依据的 SAM
              或近期现实 SOM。正确的解读是：公开证据支持一个庞大且快速增长的底层市场，而可变现部分仍主要依靠代理指标。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM012
