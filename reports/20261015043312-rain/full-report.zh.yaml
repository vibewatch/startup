      - number: '4.4'
        title: 财务结论与阻碍因素
        blocks:
          - type: paragraph
            body: >
              从财务角度看，Rain
              是一个潜力很高的基础设施平台，分销势头强劲，也有可信的企业采用理由；但公开证据仍浅了一层，无法支撑估值判断。可见数据支持交易量增长和产品覆盖面，却不能证明收入质量。收入运行率、净费率、按产品拆分的毛利率、客户或合作伙伴集中度、烧钱速度、现金、现金
              runway 和储备要求均未披露，因此无法判断 19.5 亿美元估值买到的是持久的类软件经济性，还是仅仅奖励了 Rain 在稳定币支付中的战略定位。结论是运营判断谨慎偏正面，但财务结论仍是继续研究。
