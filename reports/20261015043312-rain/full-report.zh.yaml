      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 底层市场很大，可变现切入口很窄
            body: 市场规模的公开论据，最有力的表述是企业支付工作流迁移到稳定币轨道，而不是 Rain 能捕获整个稳定币经济。
            calloutType: insight
