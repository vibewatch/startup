chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Rain 将自己定位为稳定币支付的企业基础设施，而不是面向消费者的金融科技品牌。官网、产品页面和 2026 年 1 月的融资公告都把公司描述为一套统一的卡、钱包、入金 /
              出金、出款及跨境资金流转技术栈，让合作伙伴无需逐国重建支付运营体系，就能嵌入稳定币功能。指定来源池中的独立综合判断大体支持这一定位，也将公司创立时间标为 2021
              年、总部设在纽约市。因此，后续章节最稳妥的基本判断是：Rain 是一家总部位于纽约、服务 B2B 的稳定币支付基础设施公司，其核心商业切入口是主会员制发卡与结算编排，而非零售钱包。
