            - CM008
        - label: 公开声称的覆盖范围
          value: 2.5
          unit: B people
          valueNote: 合作伙伴项目的覆盖代理，不是付费客户数
          tone: positive
          claimRefs:
            - CM008
        - label: 当前地域覆盖
          value: 150
          unit: + countries
          valueNote: 与 Visa 支持的项目覆盖相关的公开声明
          tone: positive
          claimRefs:
            - CM008
        - label: Rain 当前处理量
          value: 3
          unit: B USD annualized transactions
          valueNote: 已实现的平台规模，是实际渗透率最接近的公开代理指标
          tone: positive
          claimRefs:
            - CM006
    approximationNotes: 这些层是有证据支持、但单位和时间口径不同的采用度代理指标；之所以并列展示，是因为公开来源没有单独给出 Rain 企业稳定币支付细分市场可比的 SAM 或 SOM。
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM008
      - CM012
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序数坐标将指定证据转化为相对地图，比较全栈稳定币覆盖广度与企业合作伙伴的实施简易度。
    data:
      xAxis:
        label: 稳定币生命周期覆盖广度
        min: 1
        max: 5
        lowLabel: narrow feature set
        highLabel: full-stack cards, wallets, and money movement
        description: Evidence-backed ordinal score from the assigned source set, not market-share rank.
      yAxis:
        label: 合作伙伴实施简易度
        min: 1
        max: 5
        lowLabel: fragmented multi-vendor deployment
        highLabel: single-integration deployment
        description: Evidence-backed ordinal score from the assigned source set, not a measured onboarding time.
      points:
        - label: Rain
          x: 5
          'y': 5
          detail: 指定来源一致将 Rain 定位为一次集成即可覆盖卡、钱包、虚拟账户、支付和稳定币结算。
          note: 高覆盖广度和简易度来自产品打包密度，而非消费者品牌。
        - label: 法币优先的消费平台
          x: 2
          'y': 4
          detail: AInvest 称 Brex 和 Ramp 正在增加稳定币功能，但在指定样本中，稳定币仍只是法币优先工作流的延伸。
          note: 对企业买家很简单，但现有证据显示其完整稳定币生命周期覆盖更窄。
        - label: 传统发行方堆栈
          x: 1
          'y': 2
          detail: Rain 将传统项目与仅支持法币、受银行限制、上线更慢且需数日结算的流程作对比。
          note: 现有方案仍有较强熟悉度，但指定证据将这一路径描述为更碎片化。
        - label: 外部钱包 + Rain 服务
          x: 4
          'y': 4
          detail: Cointrust 称，合作伙伴可以保留第三方钱包，并将其连接到 Rain 卡、奖励、入金通道和支付功能。
          note: 这一路径保留既有钱包投入，同时继续使用 Rain 的关键支付功能。
        - label: Thredd + Bakkt 概念
          x: 3
          'y': 2
          detail: Digital Transactions 报道称，这只是稳定币结算信用卡处理的概念验证（PoC）。
          note: 这是有意义的相邻方案，但指定来源尚未将其呈现为生产级全栈替代方案。
        - label: 内部多供应商自建
          x: 5
          'y': 1
          detail: 指定证据反复将 Rain 的替代方案描述为：跨供应商拼接钱包、发卡、结算和支付功能。
          note: 架构控制力最大，但集成负担也最高。
    approximationNotes: 坐标是根据来源支持的产品范围和实施描述作出的序数判断，不是经审计的基准分数。
    claimRefs:
      - CP001
      - CP003
      - CP006
      - CP013
      - CP014
      - CP016
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: Rain 的公开材料支持统一的稳定币支付工作流，但每一步的留存经济性大多仍不公开。
    data:
      nodes:
        - id: user-funding
          label: 资金进入合作伙伴应用
          detail: 用户或企业通过合作伙伴工作流内提供的虚拟账户或入金通道收款。
        - id: wallet-balance
          label: 钱包 / 稳定币余额
          detail: Rain Wallets 用单一余额集中管理存储、卡充值和资金移动。
        - id: card-program
          label: Rain 发行的卡项目
          detail: 合作伙伴通过 Rain 的发卡堆栈推出品牌化消费者卡或商业卡项目。
        - id: network-settlement
          label: 每日网络结算
          detail: Rain 称其每天使用稳定币与 Visa 结算卡交易，而非沿用需数日的传统周期。
        - id: payout-rail
          label: 消费或支付通道
          detail: 余额可在商户处消费，也可通过支付基础设施转入本地银行账户。
        - id: retained-economics
          label: Rain 的留存经济性
          detail: 公开证据没有披露将交易量转化为毛利的抽成率、收入分成、准备金成本、欺诈损失或支持成本。
      edges:
        - from: user-funding
          to: wallet-balance
          label: 资金注入
        - from: wallet-balance
          to: card-program
          label: 卡充值
        - from: card-program
          to: network-settlement
          label: 网络清算
        - from: network-settlement
          to: payout-rail
          label: 消费或本地支付
        - from: payout-rail
          to: retained-economics
          label: 扣除合作伙伴及运营成本后的费用
    approximationNotes: 该顺序是产品机制证据，不是量化利润瀑布；公开来源描述了步骤，却没有说明每个节点实现的经济性。
    claimRefs:
      - CI004
      - CI005
      - CI007
      - CI009
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Rain 的公开堆栈从合作伙伴嵌入和资金接入，延伸到钱包、卡、支付和控制层。
    data:
      layers:
        - label: 合作伙伴嵌入
          detail: 合作伙伴只需集成一次 Rain，就能在自己的应用或项目中提供该产品。
          modules:
            - 项目设计与上线支持
            - 合作伙伴品牌卡和钱包体验
          outputs:
            - 嵌入式稳定币支付界面
        - label: 资金接入
          detail: 虚拟账户和支付入金通道将余额导入 Rain 工作流。
          modules:
            - 虚拟账户
            - 支付入金通道
          outputs:
            - 稳定币入金余额
        - label: 钱包核心
          detail: 非托管钱包现已上线，托管钱包仍在路线图中。
          modules:
            - Passkey 或一次性验证码访问
            - 支持 12 个区块链网络
          outputs:
            - 接收、持有和发送稳定币
        - label: 消费与奖励
          detail: 钱包余额为 Rain 发行的卡及相关奖励产品提供资金。
          modules:
            - 虚拟卡和实体卡
            - Apple Pay 和 Google Pay 开通
          outputs:
            - 大规模商户受理
        - label: 资金转出与支付
          detail: 同一余额可通过出金通道和支付轨道转出平台。
          modules:
            - 出金通道
            - 全球支付
            - 连接 Western Union 的提现能力
          outputs:
            - 本地货币银行支付
        - label: 控制与监管扩张
          detail: 控制功能被描述为内置，但信托银行路径仍依赖外部审批。
          modules:
            - 合规、欺诈、争议和报告
            - 拟议的 OCC 监管信托银行子公司
          outputs:
            - 项目级控制与监管依赖
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE011
      - CE012
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Rain 的客户旅程从企业集成开始，随着更多资金流转步骤进入同一合作伙伴体验而扩展。
    data:
      items:
        - label: 合作伙伴选择 Rain 作为基础设施层
          actor: 企业、新银行、平台、开发者或 AI agent 构建者
          touchpoints:
            - 一次集成即可提供卡、钱包、奖励、虚拟账户和支付功能
            - 购买决策由合作伙伴的产品、运营和资金团队作出，而非终端用户
        - label: 首次发卡部署
          stage: 获客
          touchpoints:
            - Rain 发行的卡可在全球超过 175 million 个商户地点使用
            - 对终端用户而言，稳定币结算大多在幕后完成
        - label: 钱包成为核心账户
          stage: 扩展
          touchpoints:
            - 非托管钱包现已可用
            - 托管钱包和收益功能计划于 2026 年晚些时候推出
        - label: 资金流入与存储深化使用
          stage: 扩展
          touchpoints:
            - 虚拟账户和入金通道将余额直接放入钱包
            - 用户可在 12 条区块链上持有 USDC、USDT 和其他受支持资产
        - label: 在合作伙伴应用内消费、发送和本地支付
          stage: 运营
          touchpoints:
            - 钱包余额可支持卡消费
            - 出金通道和支付功能让合作伙伴把使用转化为本地货币提现流程
        - label: 渠道驱动扩展至新垂直项目
          stage: 扩展
          touchpoints:
            - Stewards 展示了一个由合作伙伴拥有、使用 Rain 发卡和结算的 SMB 金融工作流
            - 即使合作伙伴保留自己的客户关系，Rain 也能赢得更多钱包份额
    approximationNotes: 该图是根据引用来源构建的工作流模型，不是经过测量的漏斗或队列转化图。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在当前证据集中，共享合约安全、章程 / 法律不确定性和合作伙伴依赖是三大最高剩余风险集群。
    data:
      columns:
        - label: 可能性
          note: 数值越高，说明留存证据越直接显示风险正在发生或持续。
        - label: 影响
          note: 影响反映风险兑现后对客户、监管或商业结果的下行压力。
        - label: 缓释成熟度
          note: 成熟度越低，说明留存来源描述了意图或架构，却没有独立验证的控制结果。
      rows:
        - label: 共享合约安全影响范围
          note: 基于 2026 年 8 月过时 Rain 合约在多个下游项目中的漏洞利用事件。
          values:
            - label: 高
              tone: high
              note: 最近已发生的事件暴露了可重复利用的共享代码。
            - label: 高
              tone: high
              note: 用户资金损失和合作伙伴品牌损害已经出现。
            - label: 中
              tone: medium
              note: 易受攻击的合约已升级，但留存证据中没有审计或赔偿政策来闭环。
        - label: OCC 章程与法律框架不确定性
          note: 基于 Rain 待决的信托银行申请，以及同期围绕 OCC 框架的诉讼。
          values:
            - label: 中高
              tone: high
              note: 审批尚未完成且诉讼仍在进行，但尚无证据表明申请会被否决。
            - label: 高
              tone: high
              note: 延误或不利裁决可能拖慢牌照、准备金策略和企业销售。
            - label: 中
              tone: medium
              note: 独立银行结构和新增资本有所帮助，但审批仍取决于外部机构。
        - label: 网络 / 供应商 / 合作伙伴依赖
          note: 基于对 Visa、Mastercard、Western Union 及第三方托管 / 转换供应商的依赖。
          values:
            - label: 中
              tone: medium
              note: 这些依赖具有结构性，但留存证据没有显示所有交易对手都高度集中。
            - label: 高
              tone: high
              note: 任何重大退出或中断都会迅速冲击结算、受理或分销。
            - label: 中
              tone: medium
              note: 双网络成员资格和广泛合作伙伴关系缓解了部分单点故障风险。
        - label: 虚拟账户责任与冻结风险
          note: 基于 Rain 关于虚拟账户及合作伙伴控制资金流的法律条款。
          values:
            - label: 中
              tone: medium
              note: 合同明确规定冻结和暂停权利，但触发频率未披露。
            - label: 中
              tone: medium
              note: 访问中断或有争议的损失会迅速造成客户和合作伙伴摩擦。
            - label: 中低
              tone: medium
              note: 存在合作银行结构，但缺少赔偿和补偿证据。
        - label: 稳定币发行方 / 分叉 / 不支持资产风险
          note: 基于 Rain 的明确披露：不支持的资产可能丢失，发行方或区块链事件可能损害赎回能力。
          values:
            - label: 中
              tone: medium
              note: 条款将这些风险视为真实运营条件，而非遥远的假设。
            - label: 高
              tone: high
              note: 赎回受阻、链故障或不支持资产损失都可能直接损害客户资金。
            - label: 低
              tone: high
              note: 留存证据显示有披露，但没有经审计的恢复控制或资产级应急方案。
        - label: 规模驱动的合作伙伴集中与损失吸收不明
          note: 基于 Rain 声称的规模，以及留存披露中缺少合作伙伴构成或事件后补偿信息。
          values:
            - label: 中
              tone: medium
              note: 集中度可能可控，但当前证据集没有量化。
            - label: 高
              tone: high
              note: 集中的合作伙伴或无资金支持的补偿事件，可能把增长转化为资产负债表压力。
            - label: 低中
              tone: medium
              note: 新增资本有所帮助，但集中度和准备金覆盖仍大多未披露。
    approximationNotes: 热力图评级根据引用证据综合而成，并非来自第三方风险模型；它展示的是相对剩余严重性，而非精确概率估计。
    claimRefs:
      - CR001
      - CR002
      - CR008
      - CR010
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 已验证的规模和产品扩张确实存在，但单位经济性缺失、监管复杂度上升，迫使推荐保持入场纪律。
    data:
      nodes:
        - id: scale
          label: 已验证的规模证据
          detail: C 轮估值 $1.95B；年化交易量 >$3B；200+ 个合作伙伴。
          tone: positive
        - id: breadth
          label: 产品广度正在增加
          detail: 卡、钱包、支付和更广网络覆盖扩大了战略范围。
          tone: positive
        - id: opacity
          label: 变现仍不透明
          detail: 没有公开的留存收入、利润率、烧钱速度或优先股堆叠披露。
          tone: adverse
        - id: competition
          label: 竞争可能压低价格
          detail: 在缺乏经济性证据时，替代堆栈会削弱增长叙事的价值。
          tone: warning
        - id: regulation
          label: 监管路径增加时间风险
          detail: OCC 信托银行审查和正在进行的诉讼提高了执行不确定性。
          tone: warning
        - id: recommendation
          label: 推荐仍为继续研究
          detail: 在进行投资评估前，要求披露经济性或提供更好的价格 / 条款。
          tone: adverse
      edges:
        - from: scale
          to: breadth
          label: 验证市场相关性
        - from: breadth
          to: opacity
          label: 提高证据门槛
        - from: opacity
          to: competition
          label: 削弱定价信心
        - from: competition
          to: regulation
          label: 保持下行风险敞口
        - from: regulation
          to: recommendation
          label: 迫使入场保持纪律
    approximationNotes: null
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV011
      - CV012
      - CV013
