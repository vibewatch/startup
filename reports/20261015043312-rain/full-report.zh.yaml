      - number: '1.3'
        title: 融资、规模信号与关键利益相关方
        blocks:
          - type: paragraph
            body: >-
              Rain 的融资历程异常集中。指定来源支持四轮已披露股权融资：2022 年 600 万美元种子轮、2025 年 3 月 2450 万美元 A 轮、2025 年 8 月约 5800 万美元 B 轮，以及 2026
              年 1 月 2.5 亿美元 C 轮。C 轮将当前公开估值锚定在 19.5 亿美元，并把公开披露的累计融资推高至 3.38 亿美元以上。公开规模指标颇为亮眼——年化交易额超过 30 亿美元、合作伙伴超过 200
              家、项目覆盖超过 150 个国家——但这些主要仍是公司披露的运营信号，不能替代留存收入、单位经济性或客户集中度。就尽调而言，利益相关方图谱更适合被理解为风险投资方、网络关系和具名分销伙伴的组合，它们解释了
              Rain 的渠道和势头，却还不能证明估值背后的经济性已经得到充分评估。
