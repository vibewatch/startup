      - number: '1.4'
        title: 里程碑与当前观察点
        blocks:
          - type: paragraph
            body: >-
              本章的里程碑轨迹显示，Rain 正从发卡扩展为更完整的支付与托管技术栈。TechFlow 的评测指出，公司通过 2025 年收购 Uptop 和 Fern、2026 年收购 Ansa 来扩展能力；2026 年
              10 月的报道则显示，Rain 推出嵌入式钱包，并分别申请全国信托银行牌照。这些动作很重要，因为它们表明 Rain 希望掌握更多企业稳定币工作流：从钱包余额和发卡，到储备管理以及可能的稳定币发行。同一份 10
              月牌照申请也带来一个现实的监管观察点：申请尚处早期，拟议银行将是独立子公司，而 OCC 的信托银行框架已经在法院受到挑战。因此，扩张是真实的，但执行和监管复杂度也同样真实。
