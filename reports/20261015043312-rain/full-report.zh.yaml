            title: 监管杠杆只有在审批通过后才会扩大市场
            body: Rain 扩大持牌覆盖和申请信托银行牌照，可能带来更多买方需求，但法律和审批周期意味着这些收益应按有条件、而非即时收益来评估。
            calloutType: risk
