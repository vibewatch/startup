  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与牵引力代理指标
        blocks:
          - type: paragraph
            body: >
              公开证据显示，Rain 变现的是完整的企业支付工作流，而不是单一发卡功能。公司营销的是一次集成即可发卡，并发布了新的钱包层，把虚拟账户、卡和出款连接到同一余额；合作伙伴公告则显示，第三方把 Rain
              作为底层发卡和结算运营方。这为 Rain 提供了多个合理的变现面——项目搭建、卡业务经济性、钱包和出款使用，以及企业服务收入——但公开可见的只有运营规模。最具体的牵引力信号仍来自公司披露：年化支付额超过 30
              亿美元、合作伙伴超过 200 家、活跃卡增长 30 倍、支付量同比增长 38 倍。
            claimRefs:
