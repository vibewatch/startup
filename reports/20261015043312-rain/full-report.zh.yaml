          - type: callout
            title: 替代路径可能是拆分供应商，而非一个完美对手
            body: 指定来源表明，Rain 更可能受到相邻处理商、卡组织和法币优先消费平台的压力——这些平台会把稳定币功能做成标配——而不是面对一个当前拥有完全相同全栈能力的明显复制者。
            calloutType: risk
