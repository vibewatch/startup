      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >
              2026 年 1 月的 C 轮明显增强了 Rain 继续扩张的能力：独立报道称，这轮融资将用于扩张持牌市场、深化产品、收购和扩大企业销售。这很重要，因为即使具体负担尚未公开，Rain
              的模式看起来也需要留意资本。公司仍在建设覆盖卡、钱包、跨境出款以及拟议全国信托银行的受监管运营基础设施。信托银行申请未来可能把托管、储备管理和稳定币发行纳入内部，但目前它仍只是申请，须经 OCC
              审查和公众评论，Rain 也将其描述为一项多年计划。实际上，这轮融资买到的是时间和战略灵活性，而不是证明业务可以自我供给下一阶段所需资金。
