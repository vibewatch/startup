  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律和监管敞口重大、正在发生，且仅部分得到缓释
        blocks:
          - type: paragraph
            body: >-
              Rain 的法律状况比常规金融科技合规清单更复杂，因为公司一边运营与稳定币相关的支付基础设施，一边试图加入联邦监管的信托银行层。Rain 自己的虚拟账户条款称，Rain 不是银行；合作银行的 FDIC
              保险不保护用户免受 Rain 失败影响；稳定币仍处于不确定且执行不一致的监管环境中。这些基础披露如今与新的牌照流程交汇：crypto.news 和 KuCoin 都报道，Rain 拟议的全国信托银行仍需 OCC
              批准和公众评论，周边牌照框架也已遭社区银行家在法院挑战。实际含义是，管理层可以描述一条可信的缓释路径，但在审批、时间表和获准活动公开前，投资者不应把信托银行结果当作已经完成。
