      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，Rain 尚未做好退出准备，因为把平台活动转化为可分配盈利能力所需的数据仍然缺失。在接近上一轮价格入场前，投资者应要求按主要客户提供 cohort
              消费和留存收入、扣除网络费、融资成本和欺诈成本后的贡献毛利、当前烧钱速度和现金 runway，以及 C
              轮确切的优先权和稀释结构。此次更新还提出第二条尽调线：管理层应说明信托银行计划是增量期权，还是新的资金黑洞。即使没有精确估值数学，论点破坏触发器也很清楚：合作伙伴启用速度放缓、TPV 提高但留存经济性很薄、OCC
              路径出现不利监管进展，或融资事件低于 2026 年 1 月基准。
            claimRefs:
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
