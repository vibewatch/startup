        blocks:
          - type: paragraph
            body: >-
              公开领导层证据仍以创始人为中心。Farooq Malik 一贯被介绍为联合创始人兼 CEO；Charles Yoo-Naut（部分来源写作 Charles Naut）则以联合创始人兼 CTO
              身份负责技术方向。两人的背景分别覆盖 Malik 的资金管理和机构金融经验，以及 Yoo-Naut 在 Microsoft、PlaybookHR 和 Intuit 的产品与工程经历，这有助于解释 Rain
              为何走向受监管、企业级的金融基础设施。同时，治理透明度仍然有限：审阅材料没有提供完整的公开董事会名单；当前来源中最显眼的非创始人高管任命，是 Brandon Soto 拟任独立 Rain National
              Trust Bank 实体的 CEO，但仍须经过 OCC 审查。即使运营范围继续扩大，关键人物和治理层面的尽调仍有重要缺口。
