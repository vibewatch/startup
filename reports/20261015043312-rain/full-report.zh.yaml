      - number: '3.3'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Rain 的护城河看起来仍由执行驱动，而非永久性的结构优势。AInvest 认为 Visa 和 Mastercard 自身的稳定币业务可能使部分基础设施功能商品化；Digital Transactions
              报道称，Thredd 和 Bakkt 已在测试自己的稳定币结算处理项目。Rain 的应对方式是扩大范围和控制力：C 轮公告称公司将扩展持牌市场并深化能力；crypto.news 称 Rain
              已申请信托银行牌照，可能让托管、储备管理和稳定币发行更靠近其技术栈。若获批，这一策略可能强化差异化，但同一报道也指出，牌照申请正处于围绕 OCC
              框架的诉讼中，因此监管执行仍是竞争风险的一部分，而不是已经确定的优势。
            claimRefs:
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 目前可见的护城河是打包能力
            body: 官方和第三方来源反复传达的最强信息是，Rain 销售的是集成密度：卡、钱包、虚拟账户、出款和稳定币结算由一个合作关系统一协调，而不是拆成一组孤立产品。
            calloutType: strength
            claimRefs:
