      - number: '4.2'
        title: 单位经济性与成本结构
        blocks:
          - type: paragraph
            body: >
              Rain 的公开产品页面支撑其核心经济叙事：直接拥有网络会员资格、与 Visa 进行每日稳定币结算，以及声称比传统发卡方需要更低的抵押。这些功能可能改善 Rain
              或其合作伙伴的营运资金效率，也增强产品对企业的价值主张。但它们仍没有披露投资判断真正关心的经济性。证据池没有当前公开的费率表、按产品拆分的收入结构或毛利率，也没有说明支付量扣除网络费、融资成本、损失、支持成本和合作伙伴分成后，如何转化为留存收入。正如
              TechFlow 所指出，支付增长证明的是活动量，而不是未经证实的经营杠杆。
            claimRefs:
