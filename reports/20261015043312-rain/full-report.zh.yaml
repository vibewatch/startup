      - 核心假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Rain 证明卡、钱包和支付扩张能转化为高留存企业收入，并且合规执行干净利落。
        - 只有披露显示留存经济性持久、稀释可控时，才有理由按上一轮附近或略高的价格出价。
        - 定价承压、资金成本拖累，以及变现慢于预期。
        - 需要投资级披露，但公开来源目前尚未见到。
      - - 基准
        - 增长延续，但变现证据仍不完整；新产品范围在带来机会的同时也增加成本。
        - 入场应要求相对上一轮折价，或获得异常强的下行保护，而不是按势头定价。
        - 集中度不透明、优先股堆叠未知，以及范围扩大带来的执行成本。
        - 这与当前公开记录最为一致。
      - - 悲观
        - TPV 上升，但留存经济性仍薄弱；竞争对手压低价格，或章程流程带来延误和成本。
        - 相对上一轮大幅折价，或不入场，才是正确立场；下轮融资风险上升。
        - 监管延误、合作伙伴上线延期，或贡献利润率疲弱。
        - 缺失披露、不利的章程进展，或融资价格重置至低于 2026 年 1 月水平，都将发出这一信号。
