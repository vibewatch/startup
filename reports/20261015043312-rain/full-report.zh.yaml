      - number: '2.3'
        title: 买方、预算负责人、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              最可信的买方是需要推出或升级合规资金流转的企业和平台运营方，而不是选择钱包应用的零售终端用户。公开材料指向企业、银行、金融科技公司、新银行和软件平台等买方；根据具体工作流，经济决策权可能分散在支付、资金管理、产品和合规负责人之间。采用驱动因素是运营层面的，而非意识形态层面的：与
              Visa 进行每日稳定币结算、更低的抵押要求、更少的中间环节、一次集成即可覆盖全球上线，以及内置合规、争议处理和报告运营。约束同样具体。Rain 仍需扩展持牌市场，卡组织和合作伙伴依赖是结构性的，而拟议的 OCC
              信托银行路径正处在诉讼挑战中，这说明监管杠杆只有经过多年推进才能扩大可服务市场。因此，投资者需要评估采用节奏，而不只是相信自上而下的稳定币热潮。
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
