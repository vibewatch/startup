  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与替代路径
        blocks:
          - type: paragraph
            body: >-
              Rain 与其说是消费品牌，不如说是钱包、交易所、新银行、平台和金融科技公司所使用的基础设施层，帮助它们通过熟悉的卡网络让用户消费稳定币。UCard Radar
              将这一模式概括为卡即服务加稳定币结算基础设施，并列出一批有公开归属的合作伙伴项目，因此 Rain 的可比对象不仅包括稳定币原生同业，也包括传统发卡处理技术栈和内部自建方案。AInvest
              也指出，市场正从加密原生基础设施扩大到开始增加稳定币功能的法币优先消费平台。由于 Rain 在 2026 年 10
              月推出钱包后，产品面不再局限于发卡，实际竞争者如今还包括钱包优先、支付和多供应商替代方案，而不只是卡项目管理商。
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP002
          - type: table
            tableRef: TP001
            claimRefs:
