            body: >-
              更新后的公开记录确认，Rain 2026 年 1 月的 C 轮重置了公司的外部参考点：多家媒体报道 $250 million 融资、$1.95 billion 估值和超过 $338 million
              的公开累计融资。这些报道把融资与可见的运营势头联系起来，而不是仅仅依赖稳定币概念，引用了超过 $3 billion 的年化交易量、超过 200 家合作伙伴，以及 Western Union、Nuvei 和
              KAST 等具名关系。此后，2026 年 10 月的证据又通过新钱包基础设施和新的企业合作关系扩大了业务范围，但这些新增事项增加了投资者需要评估的内容，并不能证明 1 月估值偏保守。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: 什么阻碍上一轮融资成为可充分评估的估值
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是 Rain 是否与产品市场相关，而是公开记录是否显示规模能转化为持久的留存经济性。Rain 的官方材料围绕每日稳定币结算和较低抵押需求，提出了强有力的效率论点；独立的 10
              月分析则认为，公开披露仍未把支付增长与留存收入、客户盈利能力或定价权连接起来。这一缺口很重要，因为 Rain 同时也在扩大监管和执行范围：已宣布的全国信托银行可能增强公司对托管和储备管理的控制，但申请仍需 OCC
              批准，并处于围绕牌照框架的诉讼中。换句话说，上行逻辑是可见的，但决定 $1.95 billion 是否合理的投资判断变量大多仍属私密信息。
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 建议、情景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              因此，建议应对价格敏感，而不是只看公司质量。如果 Rain 能证明卡、钱包、出款和合作伙伴扩张都会转化为高留存、高贡献度的企业关系，而不只是更高的支付总量，乐观情景就成立。基准情景更保守：Rain
              继续增长，但由于经济性、集中度和优先股堆叠细节仍未披露，投资者仍需要相对上一轮的折价或异常强的条款保护。悲观情景则是产品覆盖和牌照野心推高运营成本的速度超过留存毛利，而竞争者压低价格。基于今日公开证据，正确姿态是继续研究，而不是买入；任何入场判断都应先从下行纪律出发，而不是外推当前势头。
            claimRefs:
              - CV005
              - CV007
              - CV010
