      - number: '3.2'
        title: 差异化、落地路径与切换成本
        blocks:
          - type: paragraph
            body: >-
              指定证据中 Rain 最清晰的差异化在于打包。公司和第三方描述称，合作伙伴可以从一个平台获得钱包、卡、虚拟账户和出款；如果不想全程使用 Rain
              Wallets，也可以保留外部钱包服务商。官方发卡页面又把这一信息延伸到运营层面，声称可采用单一的区域上线模式、与 Visa
              进行每日稳定币结算，并比传统发卡结构需要更少抵押。这并不会消除替代方案，而是意味着买方可以在全栈采购、叠加在现有钱包技术栈上的部分 Rain
              部署，或更分散的内部自建之间选择。买方越看重上线速度、营运资金效率和更少的供应商交接，Rain 当前的方案看起来就越有吸引力。
            claimRefs:
              - CP001
