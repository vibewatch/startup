schemaVersion: report-v2
artifact: customers
slug: rain
runDate: 2026-10-15
company:
  name: Rain
chapter:
  number: 6
  title: Customers
  summary: >-
    Rain has credible enterprise adoption signals, including named counterparties,
    triple-digit organizational breadth, and a fresh partner-led card program, but
    public customer proof remains denominator-heavy and retention disclosure is still
    effectively absent. The evidence supports a land-and-expand infrastructure model
    built around one partner integration, not yet a clean view of durable recurring
    usage or concentration risk.
sections:
  - id: served-segments
    title: Who buys Rain and who ultimately uses it
    body: >-
      Rain is selling infrastructure, not a branded end-user financial app. The public
      evidence consistently positions the buyers as enterprises, neobanks, platforms,
      developers, and now AI-agent builders, while the ultimate users are the
      partner's own customers, contractors, employees, or business cardholders inside
      that partner experience. That matters because the commercial motion is
      enterprise/API-led: once a partner is integrated, Rain can widen the
      relationship from card issuance into wallets, payouts, virtual accounts, and
      rewards without forcing the partner to replace every existing vendor at once.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU013
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-signals
    title: Adoption proof is real, but the denominator is still fuzzy
    body: >-
      The chapter pool contains enough evidence to show that Rain has progressed
      beyond a pre-launch narrative. Public materials point to global card
      acceptance, triple-digit organizational reach, named enterprise logos, and a
      May 2026 external article citing more than $3 billion of annualized transaction
      volume with 38x growth. The problem is comparability: the sources mix
      "organizations," "enterprise partners," and named logos without disclosing how
      many are live production customers, pilots, channel relationships, or broader
      signed accounts.
    claimRefs:
      - CU003
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU016
    tableRefs:
      - TU002
      - TU003
  - id: expansion-model
    title: Expansion logic comes from widening the partner workflow
    body: >-
      Rain's October 2026 wallet launch is important less as a stand-alone product
      than as a proof that the company is trying to own more of the customer money
      lifecycle. The wallet becomes the account that connects card spend,
      on/offramps, payouts, and virtual accounts, and Rain explicitly says partners
      can either adopt that full stack or keep an existing wallet provider while
      adding Rain services around it. The Stewards program shows how that model can
      move into new vertical channels: Rain supplies issuance and settlement while
      the partner keeps customer ownership, underwriting, and distribution.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU012
      - CU013
    calloutRefs: []
  - id: durability-and-friction
    title: Durability and concentration remain the underwriting gap
    body: >-
      The allowed source pool does not establish whether Rain's public customer proof
      is durable in the way an investor would want to underwrite at a large
      valuation. No source here discloses NRR, GRR, churn, renewal rates, contract
      length, or top-customer exposure, and the freshest adverse evidence emphasizes
      regulatory architecture rather than customer retention. The October trust-bank
      filing is strategically relevant because it shows why enterprise customers may
      want a federally supervised custody and reserve structure, but it also
      highlights that today's programs still depend on outside custodians,
      third-party issuers, and an OCC process that is now being challenged in court.
    claimRefs:
      - CU014
      - CU015
      - CU016
callouts:
  - calloutType: strength
    title: One integration expands the wallet share of workflow
    body: Rain's strongest customer pattern is not just card issuing; it is the ability to start with one integration and widen into wallets, payouts, virtual accounts, and rewards while still interoperating with a partner's existing wallet stack.
    claimRefs:
      - CU002
      - CU004
      - CU006
  - calloutType: insight
    title: Stewards is better evidence of channel expansion than present-day revenue
    body: The Stewards announcement is useful because it shows Rain entering a verticalized SMB-finance workflow, but the program is still targeted for early Q1 2027 and remains subject to technical, compliance, and third-party approvals.
    claimRefs:
      - CU012
      - CU013
  - calloutType: risk
    title: Public customer quality still outruns public retention disclosure
    body: Rain can point to recognizable logos and growth anecdotes, but the current public record still does not reconcile live production customers, partner counts, retention, or concentration in a way that supports a durability conclusion.
    claimRefs:
      - CU011
      - CU014
      - CU015
      - CU016
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Enterprise remittance and global-payments brands
        - Buyer = product/treasury/ops; user = sender or recipient; payer = partner platform
        - Stablecoin settlement, cross-border spend, and payout workflows
        - Western Union named as a client in external coverage
        - High-reference logo for regulated money movement
        - No public contract scope, geography, or renewal detail
      - - Payment processors and fintech platforms
        - Buyer = platform product/engineering; user = end customers inside partner apps; payer = platform
        - Embed cards, wallets, and movement of funds in one integration
        - Nuvei and Kast named in external coverage; wallet launch aimed at partners
        - Broadens distribution through existing customer bases
        - Production-versus-pilot mix is undisclosed
      - - Neobanks, developers, and AI-agent builders
        - Buyer = product/engineering teams; user = account holders or software agents; payer = platform
        - API-led card, wallet, and payout infrastructure
        - Company materials explicitly list these segments
        - Expands TAM beyond classic fintech card programs
        - No named production deployments in the pool for this subsegment
      - - Channel partners serving SMB finance programs
        - Buyer = financing platform; user = qualified small businesses; payer = partner and borrower flows
        - Branded business card linked to approved capital access
        - Stewards program targets early Q1 2027 launch
        - Shows vertical/channel expansion beyond pure crypto-native platforms
        - Still subject to integration, compliance, and approval milestones
    notes: Public evidence mixes company-issued and third-party descriptions; null economics such as contract value, take rate, and renewal cadence remain undisclosed.
    claimRefs:
      - CU001
      - CU002
      - CU011
      - CU012
      - CU013
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Enterprise partners
        - ">200"
        - "2026-05-04"
        - Startup Fortune
        - Medium
        - Suggests broad enterprise pipeline and partner count
        - Not clear how many are live customers versus pilots, signings, or ecosystem partners
      - - Organizations trusted worldwide
        - ">100"
        - "2026-10-13"
        - Rain wallet launch release
        - Medium
        - Confirms current triple-digit organizational breadth
        - '"Organization" is not defined and may not be comparable to "enterprise partners"'
      - - Annualized transaction volume
        - ">$3B"
        - "2026-05-04"
        - Startup Fortune
        - Medium
        - Indicates meaningful throughput if representative of current run rate
        - No take rate, revenue conversion, or active-account denominator
      - - Annualized transaction volume growth
        - 38x
        - "2026-05-04"
        - Startup Fortune
        - Medium
        - Supports a rapid-adoption narrative
        - Starting base, cohort mix, and durability are undisclosed
    notes: This table preserves each source's own metric wording rather than normalizing unlike denominators; it should not be read as a reconciled customer cohort model.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU016
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / partner
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - Western Union
        - Global remittance / cross-border payments
        - Named by Startup Fortune as a Rain client using stablecoin-settlement infrastructure
        - Undisclosed
        - High-signal enterprise reference logo
        - No public contract scope, geography, or outcome metric
      - - Nuvei and Kast
        - Payments / fintech platforms
        - Named by Startup Fortune as clients in Rain's enterprise base
        - Undisclosed
        - Shows platform relevance beyond a single flagship account
        - No evidence in this pool that separates pilot from scaled production
      - - Stewards
        - SMB finance platform
        - Stewards-branded business card using Rain issuance and settlement infrastructure
        - Planned / pre-launch
        - Partner release provides a concrete use case and target launch window
        - Still subject to technical integration, compliance requirements, and approvals
    notes: Enumeration is partial because the pool contains only publicly named relationships, not a full customer roster; production status is only recorded when the source states it directly.
    enumerationScope:
      coverage: partial
      basis: Publicly named customer and partner relationships visible in the assigned 2026 source pool rather than a complete customer ledger.
    claimRefs:
      - CU011
      - CU012
      - CU013
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Rain's customer journey starts with an enterprise integration and expands as more money-movement steps move into the same partner experience.
    data:
      items:
        - label: Partner selects Rain as infrastructure layer
          actor: Enterprise, neobank, platform, developer, or AI-agent builder
          touchpoints:
            - One integration can expose cards, wallets, rewards, virtual accounts, and payouts
            - Buying decision sits with partner product, ops, and treasury teams rather than the end user
        - label: Initial card-issuing deployment
          stage: Land
          touchpoints:
            - Rain issues cards accepted at more than 175 million merchant locations worldwide
            - Stablecoin settlement stays mostly behind the scenes for the end user
        - label: Wallet becomes the core account
          stage: Expand
          touchpoints:
            - Non-custodial wallets are available now
            - Custodial wallets and earning features are planned for later in 2026
        - label: Money-in and storage deepen usage
          stage: Expand
          touchpoints:
            - Virtual accounts and onramps put balances directly into the wallet
            - Users can hold USDC, USDT, and other supported assets across 12 blockchains
        - label: Spend, send, and local payout inside the partner app
          stage: Operate
          touchpoints:
            - Wallet balances can fund card spend
            - Offramps and payouts let partners convert usage into local-currency cash-out flows
        - label: Channel-led expansion into new vertical programs
          stage: Expand
          touchpoints:
            - Stewards shows a partner-owned SMB-finance workflow using Rain issuance and settlement
            - Rain can win more wallet share even when the partner keeps its own customer relationship
    approximationNotes: This figure is a workflow model derived from the cited sources, not a measured funnel or cohort conversion chart.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU012
