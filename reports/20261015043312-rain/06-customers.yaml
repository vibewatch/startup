  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: Public NRR, GRR, churn, renewal, contract-length, cohort, or customer-satisfaction data tied to Rain's current enterprise base.
      whyItMatters: Without durability metrics, recognizable logos and throughput anecdotes do not establish recurring usage quality or renewal strength.
      diligencePath: Request a customer KPI pack covering logo count, live accounts, GRR, NRR, gross churn, renewal cadence, and cohort behavior by product line.
      relatedQuestionRefs:
        - QU009
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Customer or partner concentration data such as top-5 customer TPV share, top-partner revenue share, or channel mix by product.
      whyItMatters: A single large remittance, processor, or channel relationship could drive the headline adoption story while leaving the revenue base fragile.
      diligencePath: Ask management for customer concentration, TPV concentration, and revenue concentration by customer and partner for the last four quarters.
