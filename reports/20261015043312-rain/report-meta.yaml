companyProfile:
  summary: >-
    Rain is a New York-based enterprise stablecoin-payments infrastructure company founded in 2021 by Farooq Malik and
    Charles Yoo-Naut. It started with card issuing and has expanded into embedded wallets, payouts, and cross-border
    money movement, positioning itself as a one-integration payments layer for fintechs, banks, platforms, and large
    enterprises. The public record shows meaningful partner and product momentum, but it still leaves revenue, gross
    margin, headcount, board composition, and customer concentration materially undisclosed.
