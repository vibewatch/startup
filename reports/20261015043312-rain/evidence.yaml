    whyItMatters: >-
      The public materials prove product breadth but do not let diligence test integration complexity, developer
      readiness, or partner engineering effort.
    diligencePath: >-
      Request current developer documentation, sample payloads, auth flows, SDK coverage, and a live partner
      implementation walkthrough.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: reliability-controls
    missingEvidence: >-
