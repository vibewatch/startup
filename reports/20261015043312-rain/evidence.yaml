evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Revenue run rate, gross margin, burn, cash runway, and take-rate disclosure by product line.
    whyItMatters: >-
      Those metrics are necessary to test whether the $1.95 billion valuation is supported by retained economics rather
      than only payment-volume growth.
    diligencePath: >-
      Request management reporting for revenue, gross profit, burn, and cohort economics by cards, wallets, payouts, and
      settlement services.
    relatedQuestionRefs:
      - QO004
      - QO005
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Full current board roster, investor rights, preference stack, debt, and any secondary components across the
      financing history.
    whyItMatters: >-
      Governance and liquidation rights affect control, downside protection, and the real economics attached to the
      disclosed round sizes and valuation.
    diligencePath: >-
      Obtain the cap table, board observer agreements, term sheets, and any debt or secondary documentation from the
      latest financing package.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: regulatory footprint
    missingEvidence: >-
      Jurisdiction-by-jurisdiction license inventory and the expected approval path for the proposed trust-bank
      subsidiary.
    whyItMatters: >-
      Rain's value proposition depends on compliant global rollout, and regulatory timing can change both geography
      expansion and cost structure.
    diligencePath: >-
      Request a current regulatory matrix covering licenses held, licenses applied for, sponsor-bank dependencies, and
      milestones tied to the OCC process.
    relatedQuestionRefs:
      - QO006
      - QO007
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: >-
      Customer-level or partner-level payment volume, renewal, and profitability data, especially for marquee
      relationships such as Western Union and Nuvei.
    whyItMatters: >-
      Reported partner count and geographic reach do not show whether growth is diversified or dependent on a small
      number of large programs.
    diligencePath: >-
      Request top-customer concentration, NRR/churn, cohort spend retention, and partner-level gross-profit contribution
      data.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Public or diligence-room disclosure tying Rain's priced products to a segmentable SAM and a realistic near-term
      SOM by geography, product, and buyer type.
    whyItMatters: >-
      Without monetizable market segmentation, investors can only infer opportunity from broad stablecoin activity and
      Rain's current throughput.
    diligencePath: >-
      Request internal market maps, pipeline segmentation, pricing by product, and revenue contribution by cards,
      wallets, payouts, and cross-border programs.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Customer procurement evidence showing which executive function actually owns the budget and ROI threshold for Rain
      deployments by segment.
    whyItMatters: >-
      Budget ownership drives sales-cycle length, expansion motion, and whether adoption behaves like infrastructure
      spend, treasury tooling, or embedded-finance product investment.
    diligencePath: >-
      Review customer case studies, procurement records, and enterprise references that break out buyer title,
      evaluation criteria, and payback period.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: current-traction
    missingEvidence: >-
      More recent throughput and partner metrics than the January 2026 funding release, especially after the October
      2026 wallet expansion.
    whyItMatters: >-
      The public adoption story may have changed materially between the Series C announcement and the later product
      expansion.
    diligencePath: >-
      Request post-Series-C operating metrics, partner additions, and product-attach data tied to wallet, payout, and
      card usage.
    relatedQuestionRefs:
      - QM002
      - QM007
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: >-
      Signed pricing schedules, interchange splits, minimum volume commitments, and sample contract terms for Rain and
      modular alternatives.
    whyItMatters: >-
      Without comparable commercial terms, it is hard to judge whether Rain wins on economics or primarily on product
      breadth and launch simplicity.
    diligencePath: >-
      Request Rain pricing schedules or customer contracts and benchmark them against issuer, processor, and
      wallet-provider quotes for the same target geography.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: incumbent-feature-parity
    missingEvidence: >-
      Direct product pages or launch documents for Brex, Ramp, Visa, Mastercard, Thredd, and Bakkt showing stablecoin
      feature scope and customer availability.
    whyItMatters: >-
      The assigned pool confirms direction of competition, but it does not provide like-for-like source-backed detail
      for every matrix cell.
    diligencePath: >-
      Collect official product pages and launch notes for the named alternatives before treating the current capability
      matrix as exhaustive.
    relatedQuestionRefs:
      - QP001
      - QP006
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Current revenue run rate, take rate by product, recognized revenue policy, and gross margin by major product line.
    whyItMatters: >-
      These are the minimum inputs needed to determine whether Rain's multi-product payment volume converts into durable
      retained revenue and software-like gross profit.
    diligencePath: >-
      Request the latest board deck or monthly financial package with revenue by product, contra-revenue treatment,
      gross margin bridge, and trailing-twelve-month cohort economics.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Cash balance, monthly burn, debt or project-finance obligations, reserve requirements, and runway after the Series
      C.
    whyItMatters: >-
      The $250 million raise cannot be evaluated as adequate capital without knowing current liquidity, fixed
      obligations, and the cash burden of geographic and regulatory expansion.
    diligencePath: >-
      Request current cash, monthly burn, debt schedule, reserve formulas by program, and a 12-month operating plan with
      base and downside cases.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Customer, channel, and partner concentration; contribution margin by major program; and cohort retention or NRR
      for enterprise accounts.
    whyItMatters: >-
      Volume concentration can make growth look stronger than it is and materially changes the risk of pricing pressure,
      credit exposure, and renewal economics.
    diligencePath: >-
      Request top-customer and top-partner concentration, gross profit by program cohort, and renewal or expansion
      behavior for the largest accounts.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reserve-terms
    missingEvidence: Executed commercial pricing schedules and post-Series-C reserve or collateral covenants for Rain-issued programs.
    whyItMatters: >-
      Marketing claims about lower collateral and faster settlement do not establish the actual working-capital burden
      or pricing power in customer contracts.
    diligencePath: >-
      Review sample customer agreements, reserve schedules, and network-funding arrangements for at least one mature
      program and one newly launched partner.
    relatedQuestionRefs:
      - QI003
      - QI005
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: developer-surface
    missingEvidence: >-
      Official API references, authentication model detail, sandbox access, webhook coverage, and implementation docs
