schemaVersion: report-v2
artifact: valuation
slug: rain
runDate: 2026-10-15
company:
  name: Rain
chapter:
  number: 8
  title: Valuation
  summary: >-
    Rain shows unusually strong scale signals for a young stablecoin infrastructure company,
    including a disclosed $250 million Series C at a $1.95 billion valuation, more than $3
    billion of annualized transaction volume, and expanding product breadth across cards,
    wallets, and payouts. The public record still does not disclose retained revenue, gross
    margin, burn, concentration, or preference terms well enough to defend that price, so the
    evidence-based call remains research-more with high risk and a stretched valuation stance.
sections:
  - id: financing-context
    title: Financing context and what the market is paying for
    body: >-
      The refreshed public record confirms that Rain's January 2026 Series C reset the external
      reference point for the company: multiple outlets reported a $250 million round at a $1.95
      billion valuation and more than $338 million of total disclosed funding. Those same reports
      tied the financing to visible operating momentum rather than a purely conceptual stablecoin
      thesis, citing more than $3 billion of annualized transaction volume, more than 200 partners,
      and named relationships including Western Union, Nuvei, and KAST. Since then, October 2026
      evidence has broadened the scope story further through new wallet infrastructure and a new
      enterprise partnership, but those additions increase the set of things an investor must
      underwrite rather than proving the January valuation was conservative.
    claimRefs: [CV001, CV002, CV003, CV005, CV006]
    tableRefs: [TV002]
  - id: underwriting-the-price
    title: What keeps the last round from being fully underwritable
    body: >-
      The central valuation problem is not whether Rain has product-market relevance; it is whether
      the public record shows that scale converts into durable retained economics. Rain's official
      materials make a strong efficiency argument around daily stablecoin settlement and lower
      collateral needs, while independent October analysis argues that public disclosures still do
      not connect payment growth to retained revenue, customer profitability, or pricing power.
      That gap matters because Rain is also widening regulatory and execution surface area: the
      announced national trust bank could improve control of custody and reserve management, but the
      application still needs OCC approval and sits inside an active legal dispute over the charter
      framework. In other words, the upside case is visible, but the underwriting variables that
      determine whether $1.95 billion is fair remain mostly private.
    claimRefs: [CV004, CV007, CV008, CV009, CV010, CV011]
    figureRefs: [FV001]
  - id: scenarios-and-entry-discipline
    title: Recommendation, scenarios, and entry discipline
    body: >-
      The recommendation should therefore stay price-sensitive rather than company-quality-sensitive.
      A bull case exists if Rain can show that card, wallet, payout, and partner expansion all feed
      into high-retention, high-contribution enterprise relationships instead of merely larger gross
      payment volumes. The base case is more conservative: Rain keeps growing, but investors still
      need a discount to the last round or unusually strong term protection because economics,
      concentration, and preference stack detail remain undisclosed. The bear case is that product
      breadth and charter ambition raise operating cost faster than retained gross profit while
      competitors compress pricing. On today's public evidence, the right posture is research-more,
      not buy, and any entry case should start from downside discipline rather than momentum
      extrapolation.
    claimRefs: [CV005, CV007, CV010, CV012, CV013, CV014]
    tableRefs: [TV001, TV003]
  - id: final-diligence-asks
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Rain is not exit-ready on public evidence alone because the data needed to translate platform
      activity into distributable earnings power is still missing. Before underwriting an entry near
      the last round, investors should demand cohort spend and retained revenue by major customer,
      contribution margin after network, funding, and fraud costs, current burn and runway, and the
      exact Series C preference and dilution stack. The refresh also raised a second diligence track:
      management should show whether the trust-bank initiative is additive optionality or a new
      capital sink. Thesis-break triggers are clear even without precise valuation math: slowed
      partner activation, evidence of thin retained economics despite higher TPV, adverse regulatory
      movement on the OCC path, or a financing event below the January 2026 benchmark.
    claimRefs: [CV007, CV011, CV012, CV013, CV014]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - What would change the view
    rows:
      - [Recommendation, research-more, "Strong scale signals but insufficient public unit-economics disclosure.", "Board-level retained revenue and contribution data."]
      - [Confidence, medium, "The evidence is directionally consistent, but core financial underwriting inputs remain private.", "Audited or investor-grade disclosure that reconciles volume to retained economics."]
      - [Risk rating, high, "Regulatory, execution, and monetization risks are still material at the current reference price.", "Cleaner OCC path plus proof that added scope expands profit, not just surface area."]
      - [Valuation stance, stretched, "The last disclosed price assumes economics the public record does not yet prove.", "A meaningful entry discount or new disclosure that supports sustained profitability."]
      - ["Decision implication", "Do not anchor on the last round as fair value.", "Public evidence supports diligence continuation, not price acceptance.", "Preference protection, downside structure, or a repriced round."]
      - ["Target return / hold / exit", "Not supportable from public evidence yet.", "No public revenue, margin, or cap-table data supports a precise return model.", "Management disclosure on retained revenue, margin, dilution, and likely exit path."]
    notes: >-
      Public evidence supports a qualitative recommendation framework, not a precise target-return
      model, because retained revenue, contribution margin, burn, and preference terms remain
      undisclosed.
    claimRefs: [CV007, CV011, CV012, CV013]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Rain has demonstrated real enterprise demand through a disclosed $250 million Series C, over $3 billion of annualized transaction volume, and 200-plus partners.", "Independent evidence that those customers produce durable retained revenue rather than low-margin pass-through volume."]
      - [Thesis, "Product breadth now extends beyond card issuing into wallets, payouts, and broader card-network reach, which could deepen switching costs.", "Proof that broader scope raises contribution margin and retention rather than support burden."]
      - [Anti-thesis, "Public materials still do not show retained revenue, gross margin, burn, or concentration well enough to defend a $1.95 billion mark.", "Investor-grade disclosure that bridges TPV and partner growth to recurring retained earnings."]
      - [Anti-thesis, "The trust-bank push and new partner launches expand regulatory and execution complexity before economics are proven.", "Evidence that the charter path is de-risked and that announced launches become monetized, compliant programs on schedule."]
    notes: >-
      Arguments are synthesized from public sources only; they are intentionally framed as
      underwriting conditions rather than absolute company-quality judgments.
    claimRefs: [CV001, CV003, CV005, CV007, CV011, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Rain proves that card, wallet, and payout expansion converts into high-retention enterprise revenue with clean compliance execution.", "Can justify paying around or modestly above the last round only if disclosure shows durable retained economics and manageable dilution.", "Pricing compression, funding-cost drag, and slower-than-expected monetization.", "Requires investor-grade disclosure that does not yet appear in public sources."]
      - [Base, "Growth continues, but monetization evidence remains partial and new product scope adds cost alongside opportunity.", "Entry should require a discount to the last round or unusually strong downside protections rather than momentum pricing.", "Opaque concentration, unknown preference stack, and execution cost from broader scope.", "Most consistent with the current public record."]
      - [Bear, "TPV rises but retained economics stay thin, competitors compress pricing, or the charter process adds delay and cost.", "A material discount to the last round or no entry becomes the right stance; down-round risk rises.", "Regulatory delay, partner rollout slippage, or weak contribution margins.", "Would be signaled by missing disclosures, adverse charter developments, or a financing reset below January 2026 pricing."]
    notes: >-
      Scenarios are qualitative and relative to the last disclosed round because public sources do
      not disclose enough revenue, margin, or cap-table detail to support a precise valuation range.
    claimRefs: [CV007, CV009, CV010, CV011, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Verified scale and product expansion are real, but missing unit economics and added
      regulatory complexity force an entry-disciplined recommendation.
    data:
      nodes:
        - id: scale
          label: Verified scale proof
          detail: "Series C at $1.95B; >$3B annualized volume; 200+ partners."
          tone: positive
        - id: breadth
          label: Product breadth is increasing
          detail: "Cards, wallets, payouts, and wider network reach expand strategic scope."
          tone: positive
        - id: opacity
          label: Monetization is still opaque
          detail: "No public retained revenue, margin, burn, or preference-stack disclosure."
          tone: adverse
        - id: competition
          label: Competition can compress price
          detail: "Alternative stacks reduce the value of growth narratives without economics proof."
          tone: warning
        - id: regulation
          label: Regulatory path adds timing risk
          detail: "OCC trust-bank review and a live lawsuit raise execution uncertainty."
          tone: warning
        - id: recommendation
          label: Recommendation stays research-more
          detail: "Require economics disclosure or better price/terms before underwriting."
          tone: adverse
      edges:
        - from: scale
          to: breadth
          label: validates market relevance
        - from: breadth
          to: opacity
          label: raises the bar for proof
        - from: opacity
          to: competition
          label: weakens pricing confidence
        - from: competition
          to: regulation
          label: keeps downside live
        - from: regulation
          to: recommendation
          label: forces entry discipline
    approximationNotes: null
    claimRefs: [CV003, CV005, CV007, CV011, CV012, CV013]
