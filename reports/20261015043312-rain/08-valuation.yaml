  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retained-revenue-and-margin
      missingEvidence: Retained revenue, gross margin, contribution margin after network/funding/fraud costs, and cohort spend by major customer.
      whyItMatters: These are the core variables needed to test whether the $1.95 billion valuation is supported by durable earnings power instead of gross payment throughput.
      diligencePath: Request the current board deck or financing model that bridges TPV, active programs, and customer cohorts to retained revenue, gross margin, and contribution margin.
      relatedQuestionRefs: [QV006]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: The exact Series C cap table, liquidation preference stack, dilution impact, secondary components, and any debt or structured capital linked to expansion plans.
      whyItMatters: Entry discipline depends on downside protection and ownership outcomes, not only on the headline post-money valuation.
      diligencePath: Request the latest cap table, financing documents, investor rights summary, and any debt or warehouse facilities tied to settlement or charter plans.
    - type: missing-source
      severity: material
      topic: customer-quality-and-concentration
      missingEvidence: Net revenue retention, top-customer concentration, live-program conversion rates, and evidence that announced partnerships convert into recurring monetized usage.
      whyItMatters: Partner logos and rollout announcements do not by themselves show durability, bargaining power, or customer-level profitability.
      diligencePath: Ask for cohort views by launch year, top-five customer mix, churn, and monetization by product line for cards, wallets, payouts, and ancillary services.
