schemaVersion: "report-v2"
artifact: risks
slug: rain
runDate: 2026-10-15
company:
  name: Rain
chapter:
  number: 7
  title: Risks
  summary: >-
    Rain's highest-ranked risk is no longer theoretical: Blockaid reported that an outdated
    Rain Solana contract enabled a roughly $1.1 million drain across multiple downstream card
    programs in August 2026, demonstrating real shared-infrastructure blast radius. The second
    cluster is regulatory and counterparty dependence: Rain is pursuing a national trust bank
    while that charter path is under litigation, and its product/economic story still depends
    on networks, custodians, and partners that Rain does not fully control.
sections:
  - id: legal-and-regulatory-exposure
    title: Legal and regulatory exposure is material, live, and only partly mitigated
    body: >-
      Rain's legal posture is broader than a routine fintech compliance checklist because the
      company is operating stablecoin-linked payment infrastructure while also trying to add a
      federally supervised trust-bank layer. Rain's own virtual-account terms say Rain is not
      a bank, that FDIC coverage at its bank partner does not protect against Rain's failure,
      and that stablecoins still face an uncertain, inconsistently applied regulatory landscape.
      Those baseline disclosures now intersect with a fresh charter process: crypto.news and
      KuCoin both report that Rain's proposed national trust bank still needs OCC approval and
      a public-comment process, and that the surrounding charter framework is already being
      challenged in court by community bankers. The practical implication is that management can
      describe a credible mitigation path, but investors should not underwrite the trust-bank
      outcome as complete until approvals, timing, and permitted activities are public.
    claimRefs: [CR003, CR006, CR007, CR008, CR016]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-and-security-risk
    title: The August 2026 exploit shows shared-contract security and service-interruption risk
    body: >-
      The August 2026 incident is the clearest evidence that Rain's operational risk is not
      hypothetical. Blockaid reported that an outdated Rain contract let an attacker grant
      itself withdrawal rights and drain roughly $1.1 million from multiple Rain-powered
      programs, with at least two of four deployments on the same vulnerable code base
      exploited. That matters because Rain's commercial pitch depends on turning complex card
      issuance, compliance, and settlement into a shared platform; the same shared architecture
      can also concentrate failure when a contract version, blockchain dependency, or provider
      workflow breaks. Rain's virtual-account terms further show that parts of the user stack
      can be suspended or frozen without prior notice for AML, sanctions, or suspicious-activity
      reasons, and that unsupported assets or fork events can leave users with losses that Rain
      does not promise to absorb.
    claimRefs: [CR001, CR002, CR004, CR005, CR009, CR012, CR013]
    tableRefs: [TR002]
  - id: dependency-and-model-risk
    title: Network, partner, and balance-sheet dependencies remain core underwriting questions
    body: >-
      Rain is scaling quickly enough that partner or network failures would have a wide customer
      footprint: the company said in January 2026 that it had over 200 partners, more than
      $3 billion in annualized transactions, a 30x increase in active card base, and a 38x
      increase in annualized payment volume. Yet the same materials show why execution risk is
      still elevated. Rain says it handles card programs through a single platform, but the
      stack still depends on Visa and Mastercard memberships, Western Union for payout reach,
      licensed third-party providers for custody and conversion, and external regulatory approval
      for expansion into additional licensed markets. The Series C gives Rain capital to invest
      in mitigation, but the remaining thesis-break questions are concentration, incident-loss
      absorption, and whether regulatory approvals arrive before counterparties or customers
      demand a more bank-like control environment.
    claimRefs: [CR009, CR010, CR011, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Jurisdiction / dependency
      - Current status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - OCC trust-bank approval challenged by live litigation
        - U.S. federal banking / OCC
        - Application filed; public comment and OCC review still pending while ICBA litigation challenges the charter framework
        - High
        - High
        - Separate-capitalized-bank structure and experienced proposed bank CEO
        - Approval timing, permitted activities, or economics could change materially before launch
        - Obtain the public OCC filing, counsel memo on ICBA case scenarios, and approval critical path by milestone
      - - Stablecoin regulatory reclassification or issuer-rule changes
        - U.S. federal and state stablecoin oversight
        - Rain's own terms say regulation is uncertain and may change asset acceptance or usability
        - Medium
        - High
        - Diversified product stack and planned licensed-market expansion funded by Series C
        - Rule changes could restrict supported assets, acceptance, or partner launch timing
        - Request market-by-market license matrix, supported-asset approval process, and regulator engagement log
      - - Customer-liability mismatch in non-bank virtual-account flows
        - Rain virtual-account service with bank and provider partners
        - Terms say FDIC protection applies to bank-partner deposits only and not to Rain failure or non-deposit products
        - Medium
        - Medium
        - Use of custodial bank accounts and partner controls
        - Users and partners may still push loss, disclosure, or reputational claims back to Rain after disruptions
        - Review indemnities, insurance, claims history, and partner SLAs for virtual-account and stablecoin products
    notes: >-
      Ordered by severity using cited evidence as of 2026-10-15; likelihood and residual-exposure
      labels are analyst judgments anchored on the named sources, and unverified mitigants are
      kept as diligence paths rather than treated as cleared facts.
    enumerationScope:
      coverage: sample
      basis: >-
        Three highest-salience regulatory and legal risks identifiable from the assigned fetched
        sources for October 2026; not a full legal inventory of every jurisdiction or product.
    claimRefs: [CR003, CR006, CR007, CR008, CR014, CR016]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Shared-contract exploit affecting multiple downstream programs
        - High
        - High
        - Medium
        - A single outdated deployment can still create ecosystem-wide user-loss and reputational damage
        - No retained source discloses Rain's reimbursement, insurance, or postmortem control commitments after the August 2026 incident
      - - Fraud, AML, or suspicious-activity freezes interrupt customer access
        - Medium
        - Medium
        - Medium
        - Rain and its providers can freeze funds or suspend service before a dispute is resolved
        - Need freeze-rate, reinstatement, and false-positive metrics by product and partner
      - - Unsupported stablecoin, fork, or issuer outage causes fund loss or delayed redemption
        - Medium
        - High
        - Low
        - Rain's terms explicitly disclaim support for every blockchain outcome and stablecoin issuer failure mode
        - Need asset-by-asset support policy, issuer concentration, and historical incident log
      - - Shared-operations pitch outpaces actual security/process controls
        - Medium
        - High
        - Low
        - Marketing claims about built-in risk functions are not yet matched by retained audit, insurance, or uptime evidence
        - Request SOC / incident-response materials, partner SLAs, and control attestations
    notes: >-
      Severity and mitigation-maturity labels summarize the current evidence set rather than a
      third-party audit; missing operational telemetry is deliberately called out in the gap column.
    claimRefs: [CR001, CR002, CR004, CR005, CR009, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Card-network access
        - Visa and Mastercard
        - Core issuance, acceptance, and settlement rails
        - High but undisclosed by share
        - Membership restriction, policy change, or settlement disruption weakens Rain's core value proposition
        - High
        - Dual-network principal memberships and daily stablecoin settlement workflow
        - Still exposed because the product promise depends on continued network access and economics
      - - Custody, conversion, and fiat-rail operations
        - Licensed third-party providers and bank partners
        - Custody of fiat/stablecoins, exchange flows, AML controls, and fund freezes
        - High but undisclosed by provider
        - Provider outage, compliance action, or offboarding interrupts customer access or cash movement
        - High
        - Rain structures services through partners and says customer funds sit in custodial accounts
        - Investors still lack provider concentration, SLA, and contingency details
      - - Distribution and payout ecosystem
        - Western Union, Kast, RedotPay, and other partners
        - Customer distribution, cash payouts, and wallet/card adoption channels
        - Medium but undisclosed by TPV / revenue
        - A large partner underperforms, offboards, or renegotiates economics after an incident
        - Medium
        - Broad partner count and fresh capital to support expansion
        - No retained source quantifies partner concentration or switching costs
    notes: >-
      Concentration is directional because the assigned evidence does not disclose partner-level
      TPV, revenue mix, or contractual minimums; those omissions are themselves central diligence items.
    claimRefs: [CR010, CR011, CR012, CR013, CR014, CR015]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Shared-contract security, charter/legal uncertainty, and partner dependence are the three
      highest residual-risk clusters in the current evidence set.
    data:
      columns:
        - label: Likelihood
          note: Higher values reflect how directly the retained evidence shows the risk occurring or persisting.
        - label: Impact
          note: Impact reflects customer-loss, regulatory, or commercial downside if the risk crystallizes.
        - label: Mitigation maturity
          note: Lower maturity means the retained sources describe intent or architecture but not independently verified control outcomes.
      rows:
        - label: Shared-contract security blast radius
          note: Based on the August 2026 exploit of an outdated Rain contract across multiple downstream programs.
          values:
            - label: High
              tone: high
              note: Recent realized incident with repeatable shared-code exposure.
            - label: High
              tone: high
              note: User-fund loss and partner-brand damage were already observed.
            - label: Medium
              tone: medium
              note: Vulnerable contracts were upgraded, but no retained audit or reimbursement policy closes the loop.
        - label: OCC charter and legal-framework uncertainty
          note: Based on Rain's pending trust-bank application and contemporaneous litigation over the OCC framework.
          values:
            - label: Medium-High
              tone: high
              note: Approval is pending and litigation is active, but denial is not yet evidenced.
            - label: High
              tone: high
              note: Delay or adverse rulings could slow licensing, reserves strategy, and enterprise sales.
            - label: Medium
              tone: medium
              note: Separate-bank structure and fresh capital help, but approval remains external.
        - label: Network / provider / partner dependence
          note: Based on reliance on Visa, Mastercard, Western Union, and third-party custody/conversion providers.
          values:
            - label: Medium
              tone: medium
              note: Dependencies are structural, though not all counterparties are concentrated in the retained evidence.
            - label: High
              tone: high
              note: Any major offboarding or outage would hit settlement, acceptance, or distribution quickly.
            - label: Medium
              tone: medium
              note: Dual-network memberships and partner breadth mitigate some single-point failure risk.
        - label: Virtual-account liability and freeze risk
          note: Based on Rain's legal terms for virtual accounts and partner-controlled fund flows.
          values:
            - label: Medium
              tone: medium
              note: Contractual freeze and suspension rights are explicit, but trigger frequency is undisclosed.
            - label: Medium
              tone: medium
              note: Access interruptions or disputed losses can create customer and partner friction quickly.
            - label: Medium-Low
              tone: medium
              note: Partner-bank structure exists, but indemnity and reimbursement evidence is missing.
        - label: Stablecoin issuer / fork / unsupported-asset exposure
          note: Based on Rain's explicit disclosures that unsupported assets can be lost and issuer/blockchain events can impair redemption.
          values:
            - label: Medium
              tone: medium
              note: The terms contemplate these risks as real operating conditions, not remote hypotheticals.
            - label: High
              tone: high
              note: Loss of redemption, chain failure, or unsupported-asset loss can impair customer funds directly.
            - label: Low
              tone: high
              note: Retained evidence shows disclosures but not audited recovery controls or asset-level contingency plans.
        - label: Scale-driven partner concentration and loss-absorption ambiguity
          note: Based on Rain's claimed scale and the absence of retained disclosure on partner mix or post-incident reimbursement.
          values:
            - label: Medium
              tone: medium
              note: Concentration may be manageable, but the current evidence set does not quantify it.
            - label: High
              tone: high
              note: A concentrated partner or unfunded reimbursement event could convert growth into balance-sheet stress.
            - label: Low-Medium
              tone: medium
              note: Fresh capital helps, but concentration and reserve coverage remain largely undisclosed.
    approximationNotes: >-
      Heatmap ratings are synthesized from the cited evidence and are not sourced from a third-party
      risk model; they visualize relative residual severity, not precise probability estimates.
    claimRefs: [CR001, CR002, CR008, CR010, CR014]
callouts:
  - calloutType: risk
    title: Shared smart-contract security is the current top kill criterion
    body: >-
      Rain already experienced a real multi-program exploit, so a repeat contract or settlement-layer
      incident without clear evidence of stronger controls or loss containment would justify pausing underwriting.
    claimRefs: [CR001, CR002, CR009]
  - calloutType: insight
    title: The charter can mitigate risk, but it cannot yet be counted as achieved
    body: >-
      The trust-bank strategy may reduce custody and reserve-fragmentation risk over time, but the
      current evidence still shows pending approval, public-comment exposure, and active litigation around the framework.
    claimRefs: [CR007, CR008, CR016]
  - calloutType: recommendation
    title: Underwrite concentration and loss-absorption before underwriting growth
    body: >-
      Before leaning on Rain's growth claims, investors should demand partner concentration, indemnity,
      insurance, and incident-reimbursement evidence so the downside of scale is measurable rather than assumed.
    claimRefs: [CR010, CR011, CR014]
