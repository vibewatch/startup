      - number: '4.2'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >
              Rain’s public product pages support the core economic story: direct network membership, daily stablecoin
              settlement with Visa, and a claim of lower collateral requirements than traditional issuers. Those
              features plausibly improve working-capital efficiency for Rain or its partners, and they strengthen the
              product’s enterprise value proposition. They still do not disclose the economics that matter for
              underwriting. The evidence pool provides no current public take-rate schedule, no by-product revenue mix,
              no gross-margin disclosure, and no reconciliation from payment volume to retained revenue after network
              fees, funding costs, losses, support, and partner revenue share. As TechFlow notes, payment growth
              therefore demonstrates activity, not proven operating leverage.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI005
              - CI013
              - CI014
              - CI016
      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >
              The January 2026 Series C clearly strengthened Rain’s ability to keep expanding: independent coverage says
              the round will fund licensed-market expansion, product deepening, acquisitions, and broader enterprise
              sales. That matters because Rain’s model appears capital-aware even if the exact burden is not public. The
              company is still building regulated and operational infrastructure across cards, wallets, cross-border
              payouts, and now a proposed national trust bank. The trust-bank application could eventually internalize
              custody, reserve management, and stablecoin issuance, but today it is only an application, remains subject
              to OCC review and public comment, and is described by Rain as a multi-year initiative. In practice, the
              funding round buys time and strategic flexibility, not proof that the business can self-fund its next
              phase.
            claimRefs:
              - CI001
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and blockers
        blocks:
          - type: paragraph
            body: >
              Financially, Rain looks like a high-potential infrastructure platform with strong distribution momentum
              and a credible product reason for enterprise adoption, but the public evidence is still one layer too
              shallow for valuation underwriting. The visible data supports volume growth and product breadth, not
              revenue quality. Without disclosed revenue run rate, net take rate, gross margin by product, customer or
              partner concentration, burn, cash, runway, and reserve requirements, it is impossible to judge whether the
              $1.95 billion valuation is pricing durable software-like economics or simply rewarding strategic
              positioning in stablecoin payments. The result is a cautiously positive operating view paired with a
              research-more financial verdict.
            claimRefs:
              - CI003
              - CI005
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Credible product breadth, still limited financial visibility
            body: >-
              Cards, wallets, payouts, and partner-issued programs together make Rain look like a real platform rather
              than a single-feature issuer.
            calloutType: strength
            claimRefs:
              - CI004
              - CI007
              - CI009
              - CI010
          - type: callout
            title: Volume is visible; retained revenue is not
            body: >-
              Public sources support throughput and fundraising, but not the take rate, gross margin, burn, or
              concentration needed to underwrite the valuation.
            calloutType: risk
            claimRefs:
              - CI001
              - CI003
              - CI013
              - CI014
              - CI016
          - type: callout
            title: Ask for a board-style financial package before underwriting
            body: >-
              The next diligence round should request revenue recognition, gross margin by product, reserve formulas,
              concentration, cash, burn, and runway by major program.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered workflow and product modules
        blocks:
          - type: paragraph
            body: >-
              Rain's public product story is coherent at the workflow level even though the technical surface remains
              light on implementation detail. The official card-issuing page frames Rain as a one-integration platform
              for global card programs, while the 2026 wallet launch coverage expands that same stack into a single
              balance that can receive funds, hold stablecoins, fund card spend, and cash out through payouts. That
              matters because the product is not just "stablecoin cards"; the reviewed evidence consistently describes a
              business-to-business infrastructure layer that lets partners embed cards, wallets, rewards, onramps,
              offramps, and payouts without rebuilding the operating model for each region or product module.
            claimRefs:
