              - CU013
      - number: '6.3'
        title: Expansion logic comes from widening the partner workflow
        blocks:
          - type: paragraph
            body: >-
              Rain's October 2026 wallet launch is important less as a stand-alone product than as a proof that the
              company is trying to own more of the customer money lifecycle. The wallet becomes the account that
              connects card spend, on/offramps, payouts, and virtual accounts, and Rain explicitly says partners can
              either adopt that full stack or keep an existing wallet provider while adding Rain services around it. The
              Stewards program shows how that model can move into new vertical channels: Rain supplies issuance and
              settlement while the partner keeps customer ownership, underwriting, and distribution.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU012
              - CU013
      - number: '6.4'
        title: Durability and concentration remain the underwriting gap
        blocks:
          - type: paragraph
            body: >-
              The allowed source pool does not establish whether Rain's public customer proof is durable in the way an
              investor would want to underwrite at a large valuation. No source here discloses NRR, GRR, churn, renewal
              rates, contract length, or top-customer exposure, and the freshest adverse evidence emphasizes regulatory
              architecture rather than customer retention. The October trust-bank filing is strategically relevant
              because it shows why enterprise customers may want a federally supervised custody and reserve structure,
              but it also highlights that today's programs still depend on outside custodians, third-party issuers, and
              an OCC process that is now being challenged in court.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: One integration expands the wallet share of workflow
            body: >-
              Rain's strongest customer pattern is not just card issuing; it is the ability to start with one
              integration and widen into wallets, payouts, virtual accounts, and rewards while still interoperating with
              a partner's existing wallet stack.
            calloutType: strength
            claimRefs:
              - CU002
              - CU004
              - CU006
          - type: callout
            title: Stewards is better evidence of channel expansion than present-day revenue
            body: >-
              The Stewards announcement is useful because it shows Rain entering a verticalized SMB-finance workflow,
              but the program is still targeted for early Q1 2027 and remains subject to technical, compliance, and
              third-party approvals.
            calloutType: insight
            claimRefs:
              - CU012
              - CU013
          - type: callout
            title: Public customer quality still outruns public retention disclosure
            body: >-
              Rain can point to recognizable logos and growth anecdotes, but the current public record still does not
              reconcile live production customers, partner counts, retention, or concentration in a way that supports a
              durability conclusion.
            calloutType: risk
            claimRefs:
              - CU011
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure is material, live, and only partly mitigated
        blocks:
          - type: paragraph
            body: >-
              Rain's legal posture is broader than a routine fintech compliance checklist because the company is
              operating stablecoin-linked payment infrastructure while also trying to add a federally supervised
              trust-bank layer. Rain's own virtual-account terms say Rain is not a bank, that FDIC coverage at its bank
              partner does not protect against Rain's failure, and that stablecoins still face an uncertain,
              inconsistently applied regulatory landscape. Those baseline disclosures now intersect with a fresh charter
              process: crypto.news and KuCoin both report that Rain's proposed national trust bank still needs OCC
              approval and a public-comment process, and that the surrounding charter framework is already being
              challenged in court by community bankers. The practical implication is that management can describe a
              credible mitigation path, but investors should not underwrite the trust-bank outcome as complete until
              approvals, timing, and permitted activities are public.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
