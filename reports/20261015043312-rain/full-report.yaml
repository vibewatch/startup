      - number: '5.3'
        title: Controls, regulatory dependencies, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Rain does present controls as part of the product, but the evidence is high-level. The official page says
              compliance, fraud, disputes, and reporting are handled within the platform, and launch coverage says
              partner-bank infrastructure supports KYC and AML workflows. That is enough to establish control-plane
              intent, not enough to underwrite operating resilience or regulated-custody readiness. The sharpest current
              product-technology risk in the assigned pool is regulatory dependency: crypto.news reports that Rain's
              proposed national trust bank would sit in a separate OCC-supervised subsidiary and that the charter regime
              is already under legal challenge. For diligence, the biggest remaining gaps are missing official API
              documentation, absent public certification or uptime evidence, and no detailed public disclosure on how
              custody, reserve management, and jurisdiction-specific controls change as the wallet roadmap expands.
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who buys Rain and who ultimately uses it
        blocks:
          - type: paragraph
            body: >-
              Rain is selling infrastructure, not a branded end-user financial app. The public evidence consistently
              positions the buyers as enterprises, neobanks, platforms, developers, and now AI-agent builders, while the
              ultimate users are the partner's own customers, contractors, employees, or business cardholders inside
              that partner experience. That matters because the commercial motion is enterprise/API-led: once a partner
              is integrated, Rain can widen the relationship from card issuance into wallets, payouts, virtual accounts,
              and rewards without forcing the partner to replace every existing vendor at once.
