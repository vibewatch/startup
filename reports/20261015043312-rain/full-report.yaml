              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR010
              - CR014
      - number: '7.2'
        title: The August 2026 exploit shows shared-contract security and service-interruption risk
        blocks:
          - type: paragraph
            body: >-
              The August 2026 incident is the clearest evidence that Rain's operational risk is not hypothetical.
              Blockaid reported that an outdated Rain contract let an attacker grant itself withdrawal rights and drain
              roughly $1.1 million from multiple Rain-powered programs, with at least two of four deployments on the
              same vulnerable code base exploited. That matters because Rain's commercial pitch depends on turning
              complex card issuance, compliance, and settlement into a shared platform; the same shared architecture can
              also concentrate failure when a contract version, blockchain dependency, or provider workflow breaks.
              Rain's virtual-account terms further show that parts of the user stack can be suspended or frozen without
              prior notice for AML, sanctions, or suspicious-activity reasons, and that unsupported assets or fork
              events can leave users with losses that Rain does not promise to absorb.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR009
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR009
              - CR012
      - number: '7.3'
        title: Network, partner, and balance-sheet dependencies remain core underwriting questions
        blocks:
          - type: paragraph
            body: >-
              Rain is scaling quickly enough that partner or network failures would have a wide customer footprint: the
              company said in January 2026 that it had over 200 partners, more than $3 billion in annualized
              transactions, a 30x increase in active card base, and a 38x increase in annualized payment volume. Yet the
              same materials show why execution risk is still elevated. Rain says it handles card programs through a
              single platform, but the stack still depends on Visa and Mastercard memberships, Western Union for payout
              reach, licensed third-party providers for custody and conversion, and external regulatory approval for
              expansion into additional licensed markets. The Series C gives Rain capital to invest in mitigation, but
              the remaining thesis-break questions are concentration, incident-loss absorption, and whether regulatory
              approvals arrive before counterparties or customers demand a more bank-like control environment.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Shared smart-contract security is the current top kill criterion
            body: >-
              Rain already experienced a real multi-program exploit, so a repeat contract or settlement-layer incident
              without clear evidence of stronger controls or loss containment would justify pausing underwriting.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR009
          - type: callout
            title: The charter can mitigate risk, but it cannot yet be counted as achieved
            body: >-
              The trust-bank strategy may reduce custody and reserve-fragmentation risk over time, but the current
              evidence still shows pending approval, public-comment exposure, and active litigation around the
              framework.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
              - CR016
          - type: callout
            title: Underwrite concentration and loss-absorption before underwriting growth
            body: >-
              Before leaning on Rain's growth claims, investors should demand partner concentration, indemnity,
              insurance, and incident-reimbursement evidence so the downside of scale is measurable rather than assumed.
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR011
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and what the market is paying for
        blocks:
          - type: paragraph
            body: >-
              The refreshed public record confirms that Rain's January 2026 Series C reset the external reference point
              for the company: multiple outlets reported a $250 million round at a $1.95 billion valuation and more than
              $338 million of total disclosed funding. Those same reports tied the financing to visible operating
              momentum rather than a purely conceptual stablecoin thesis, citing more than $3 billion of annualized
              transaction volume, more than 200 partners, and named relationships including Western Union, Nuvei, and
              KAST. Since then, October 2026 evidence has broadened the scope story further through new wallet
              infrastructure and a new enterprise partnership, but those additions increase the set of things an
              investor must underwrite rather than proving the January valuation was conservative.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: What keeps the last round from being fully underwritable
        blocks:
          - type: paragraph
            body: >-
              The central valuation problem is not whether Rain has product-market relevance; it is whether the public
              record shows that scale converts into durable retained economics. Rain's official materials make a strong
              efficiency argument around daily stablecoin settlement and lower collateral needs, while independent
              October analysis argues that public disclosures still do not connect payment growth to retained revenue,
              customer profitability, or pricing power. That gap matters because Rain is also widening regulatory and
              execution surface area: the announced national trust bank could improve control of custody and reserve
              management, but the application still needs OCC approval and sits inside an active legal dispute over the
              charter framework. In other words, the upside case is visible, but the underwriting variables that
              determine whether $1.95 billion is fair remain mostly private.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Recommendation, scenarios, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation should therefore stay price-sensitive rather than company-quality-sensitive. A bull
              case exists if Rain can show that card, wallet, payout, and partner expansion all feed into
              high-retention, high-contribution enterprise relationships instead of merely larger gross payment volumes.
              The base case is more conservative: Rain keeps growing, but investors still need a discount to the last
              round or unusually strong term protection because economics, concentration, and preference stack detail
              remain undisclosed. The bear case is that product breadth and charter ambition raise operating cost faster
              than retained gross profit while competitors compress pricing. On today's public evidence, the right
              posture is research-more, not buy, and any entry case should start from downside discipline rather than
              momentum extrapolation.
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Rain is not exit-ready on public evidence alone because the data needed to translate platform activity
              into distributable earnings power is still missing. Before underwriting an entry near the last round,
              investors should demand cohort spend and retained revenue by major customer, contribution margin after
              network, funding, and fraud costs, current burn and runway, and the exact Series C preference and dilution
              stack. The refresh also raised a second diligence track: management should show whether the trust-bank
              initiative is additive optionality or a new capital sink. Thesis-break triggers are clear even without
              precise valuation math: slowed partner activation, evidence of thin retained economics despite higher TPV,
              adverse regulatory movement on the OCC path, or a financing event below the January 2026 benchmark.
            claimRefs:
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
