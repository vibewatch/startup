      - number: '6.2'
        title: Adoption proof is real, but the denominator is still fuzzy
        blocks:
          - type: paragraph
            body: >-
              The chapter pool contains enough evidence to show that Rain has progressed beyond a pre-launch narrative.
              Public materials point to global card acceptance, triple-digit organizational reach, named enterprise
              logos, and a May 2026 external article citing more than $3 billion of annualized transaction volume with
              38x growth. The problem is comparability: the sources mix "organizations," "enterprise partners," and
              named logos without disclosing how many are live production customers, pilots, channel relationships, or
              broader signed accounts.
            claimRefs:
              - CU003
              - CU007
