chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Rain presents itself as enterprise infrastructure for stablecoin-powered payments rather than a consumer
              fintech brand. Across its homepage, product pages, and January 2026 financing announcement, the company
              describes a single stack for cards, wallets, on/off-ramps, payouts, and cross-border money movement that
              lets partners embed stablecoin functionality without rebuilding payments operations country by country.
              Independent synthesis in the assigned pool broadly matches that positioning and also dates the company to
              2021 with headquarters in New York City. The most defensible ground-truth framing for later chapters is
              therefore a New York-based, B2B stablecoin-payments infrastructure company whose core commercial wedge is
              principal-member card issuance and settlement orchestration rather than a retail wallet.
            claimRefs:
              - CO001
              - CO002
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO009
              - CO013
      - number: '1.2'
        title: Leadership concentration and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence remains founder-centric. Farooq Malik is consistently presented as co-founder
              and CEO, while Charles Yoo-Naut (also rendered Charles Naut in some sources) anchors the technical side as
              co-founder and CTO. Their backgrounds combine treasury and institutional-finance exposure on Malik's side
              with product and engineering experience across Microsoft, PlaybookHR, and Intuit on Yoo-Naut's side, which
              helps explain Rain's product direction toward regulated, enterprise-grade financial plumbing. At the same
              time, governance visibility is still thin: the reviewed materials do not provide a full public board
              roster, and the most visible non-founder executive addition in the current source set is Brandon Soto as
              the proposed CEO of the separate Rain National Trust Bank entity, subject to OCC review. That leaves
              meaningful key-person and governance diligence still open even as operational scope expands.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO013
      - number: '1.3'
        title: Capital formation, scale signals, and key stakeholders
        blocks:
          - type: paragraph
            body: >-
              Rain's capital story is unusually compressed. Assigned sources support four disclosed equity rounds: a $6
              million seed in 2022, a $24.5 million Series A in March 2025, an approximately $58 million Series B in
              August 2025, and a $250 million Series C in January 2026. The Series C set the current public valuation
              anchor at $1.95 billion and pushed disclosed lifetime funding above $338 million. Public scale metrics are
              directionally impressive — more than $3 billion of annualized transactions, over 200 partners, and program
              reach across more than 150 countries — but they are still mainly company-disclosed operating signals
              rather than a substitute for retained revenue, unit economics, or customer concentration. For diligence
              purposes, the stakeholder map is therefore best read as a mix of venture sponsors, network relationships,
              and named distribution partners that explain access and momentum, not yet proof that the economics
              underneath the valuation are fully underwritten.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO013
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO015
      - number: '1.4'
        title: Milestones and current watchpoints
        blocks:
          - type: paragraph
            body: >-
              The chapter's milestone pattern shows Rain broadening from card issuing into a fuller payments and custody
              stack. TechFlow's review points to capability expansion through the 2025 Uptop and Fern acquisitions and
              the 2026 Ansa acquisition, while October 2026 coverage shows Rain launching embedded wallets and
              separately applying for a national trust bank charter. Those moves matter because they suggest Rain wants
              to own more of the enterprise stablecoin workflow, from wallet balances and card issuance to reserve
              management and possible stablecoin issuance. The same October charter filing also adds a live regulatory
              watchpoint: the application is early, the proposed bank would be a separate subsidiary, and the OCC's
              trust-bank framework is already being challenged in court. Expansion is therefore real, but so is
              execution and regulatory complexity.
            claimRefs:
              - CO011
              - CO012
              - CO014
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO006
              - CO007
