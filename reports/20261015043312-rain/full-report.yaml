  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included workflows
        blocks:
          - type: paragraph
            body: >-
              Rain's public product and partner materials consistently define the target market as enterprise stablecoin
              payments infrastructure rather than general-purpose consumer crypto. The included workflow is broad inside
              that boundary: card issuing, wallet balances, fiat onramps and offramps, payouts, rewards, and
              cross-border movement of funds, all presented as one integration and one operating model for regulated
              launch and scale. That framing matters because it narrows the investable question from "how large are
              stablecoins?" to "how much enterprise spend will migrate to orchestrated stablecoin payment programs?" It
              also clarifies what should be excluded from market sizing: speculative token trading, protocol-level
              activity that never touches card or payout flows, and generic merchant acceptance that Rain does not
              intermediate. The October 2026 wallet launch expands the included workflow from spend enablement into the
              full receive-hold-send-spend cycle, which widens the addressable product surface without proving that Rain
              captures the whole stablecoin economy.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: Public sizing lenses are directional, not investable TAM
        blocks:
          - type: paragraph
            body: >-
              The public numerics around Rain are useful, but they mix fundamentally different denominators. Rain's CEO
              told AlleyWatch that stablecoins processed $27.6T in 2024 and that the market could grow more than 10x to
              $3.7T by 2030; those statements point to a large secular tailwind, but they do not disclose methodology
              and are not directly comparable to each other. The more concrete lens is Rain's own disclosed platform
              throughput and distribution footprint: more than $3B in annualized transactions, more than 200 partners,
              cards accepted at 175 million merchant locations, reach into more than 150 countries, and a claim that
              partner programs can touch 2.5 billion-plus people. Those figures show real adoption and large potential
              distribution, but they still do not isolate a priced SAM or realistic near-term SOM for Rain's specific
              product mix. The right reading is that public evidence supports a large and fast-growing base layer, while
              the monetizable slice remains proxy-based.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM012
              - CM013
      - number: '2.3'
        title: Buyers, budget owners, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The most credible buyer set is enterprise and platform operators that need to launch or upgrade compliant
              money movement, not retail end users choosing a wallet app. Public materials point to buyers across
              enterprises, banks, fintechs, neobanks, and software platforms, with economic ownership likely split among
              payments, treasury, product, and compliance leaders depending on the workflow. Adoption drivers are
              operational rather than ideological: daily stablecoin settlement with Visa, lower collateral requirements,
              fewer intermediaries, global launch coverage from one integration, and built-in compliance, dispute, and
              reporting operations. The constraints are equally concrete. Rain still needs licensed-market expansion,
              card-network and partner dependencies remain structural, and the proposed OCC trust-bank path sits inside
              an active legal challenge, which reinforces that regulatory leverage can expand the addressable market
              only on a multi-year timeline. Investors therefore need to underwrite adoption pacing, not just top-down
              stablecoin enthusiasm.
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM009
              - CM010
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Large base layer, narrow monetizable wedge
            body: >-
              The public case for market size is strongest when framed as migration of enterprise payment workflows onto
              stablecoin rails, not as capture of the whole stablecoin economy.
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM012
          - type: callout
            title: Regulatory leverage expands the market only if approvals clear
            body: >-
              Rain's licensed-footprint ambitions and trust-bank application could widen buyer demand, but the legal and
              approval timeline means those benefits should be underwritten as contingent rather than immediate.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute paths
        blocks:
          - type: paragraph
            body: >-
              Rain competes less as a consumer brand than as an infrastructure layer for wallets, exchanges, neobanks,
              platforms, and fintechs that want users to spend stablecoins through familiar card rails. UCard Radar
              characterizes the model as card-as-a-service plus stablecoin settlement infrastructure and lists a broad
              set of publicly attributable partner programs, which makes Rain comparable not only to stablecoin-native
              peers but also to incumbent issuer-processor stacks and internal builds. AInvest also frames the field as
              widening from crypto-native infrastructure toward fiat-first spend platforms that are now adding
              stablecoin features. Since Rain's October 2026 wallet launch pushes the product surface beyond card
              issuing alone, the practical competitor set now includes wallet-first, payments, and multi-vendor
              alternatives rather than only card program managers.
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP002
          - type: table
            tableRef: TP001
            claimRefs:
              - CP008
              - CP010
              - CP012
              - CP014
      - number: '3.2'
        title: Differentiation, implementation path, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Rain's clearest differentiator in the assigned evidence is bundling. Company and third-party descriptions
              say partners can get wallets, cards, virtual accounts, and payouts from one platform, while still keeping
              an external wallet provider if they do not want Rain Wallets end to end. The official card-issuing page
              extends that message into operations by claiming a single regional launch model, daily stablecoin
              settlement with Visa, and lower collateral requirements than traditional issuer structures. That does not
              eliminate substitutes; it means buyers can choose between a full-stack purchase, a partial Rain deployment
              layered onto an existing wallet stack, or a more fragmented internal build. The more a buyer values launch
              speed, working-capital efficiency, and fewer vendor handoffs, the stronger Rain's offer appears in the
              current source set.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP013
              - CP014
              - CP016
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Rain's moat still looks execution-led rather than permanently structural. AInvest argues that Visa and
              Mastercard's own stablecoin work can commoditize some infrastructure functions, while Digital Transactions
              reports that Thredd and Bakkt are already testing a stablecoin-settlement processing program of their own.
              Rain is responding by widening scope and control: its Series C release says the company will expand
              licensed markets and deepen capabilities, and crypto.news says Rain has applied for a trust bank charter
              that could bring custody, reserve management, and stablecoin issuance closer to its stack. That strategy
              could strengthen differentiation if approved, but the same article places the charter inside an active
              lawsuit over the OCC framework, so regulatory execution is still part of the competitive risk rather than
              a settled advantage.
            claimRefs:
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Bundling is the visible moat today
            body: >-
              The strongest recurring message across official and third-party sources is that Rain sells integration
              density: cards, wallets, virtual accounts, payouts, and stablecoin settlement coordinated through one
              partner relationship rather than as separate point products.
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP005
          - type: callout
            title: The displacement path is likely unbundling, not a single perfect rival
            body: >-
              The assigned sources suggest Rain is more likely to face pressure from adjacent processors, networks, and
              fiat-first spend platforms making stablecoin functions table stakes than from one obvious clone with an
              identical full stack today.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and traction proxies
        blocks:
          - type: paragraph
            body: >
              Public evidence shows Rain monetizing a full-stack enterprise payments workflow rather than a single card
              feature. The company markets one integration for card issuing and publishes a new wallet layer that ties
              virtual accounts, cards, and payouts to the same balance, while partner announcements show third parties
              using Rain as the underlying issuance and settlement operator. That gives Rain multiple logical
              monetization surfaces — program setup, card economics, wallet and payout usage, and enterprise service
              revenue — but only the operating footprint is visible publicly. The most concrete traction signals remain
              company-reported: more than $3 billion of annualized payment volume, more than 200 partners, 30x
              active-card growth, and 38x payment-volume growth over the prior year.
            claimRefs:
              - CI001
