          and cost.
        - A material discount to the last round or no entry becomes the right stance; down-round risk rises.
        - Regulatory delay, partner rollout slippage, or weak contribution margins.
        - >-
          Would be signaled by missing disclosures, adverse charter developments, or a financing reset below January
          2026 pricing.
    notes: >-
      Scenarios are qualitative and relative to the last disclosed round because public sources do not disclose enough
      revenue, margin, or cap-table detail to support a precise valuation range.
    claimRefs:
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
