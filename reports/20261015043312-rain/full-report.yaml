      - number: '5.2'
        title: Architecture, deployment, and public maturity signals
        blocks:
          - type: paragraph
            body: >-
              The architecture implied by the assigned sources is operational rather than deeply technical: partner
              applications connect once, wallet balances become the center of record for stablecoin funds, Rain-issued
              cards expose spending, and payout rails move value back to local bank accounts. Public maturity signals
              are strongest around go-to-market readiness, not developer depth. Rain's official page claims 8-12 week
              launch timelines, daily Visa settlement with stablecoins, virtual and physical card support, and
              mobile-wallet provisioning, while third-party launch coverage confirms that non-custodial wallets are live
              today and custodial wallets remain roadmap. By contrast, the only GitHub-surface evidence in the pool is a
              third-party API Evangelist profile that explicitly says the listing is still a stub, so public developer
              proof does not yet match the breadth of the product pitch.
