              - CO012
              - CO014
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Principal-membership distribution wedge
            body: >-
              Rain's strongest public differentiator is not just a generic crypto API; it is the combination of
              card-network membership, stablecoin-native settlement, and enterprise distribution relationships that lets
              partners launch cards and wallets through one infrastructure layer.
            calloutType: strength
            claimRefs:
              - CO001
