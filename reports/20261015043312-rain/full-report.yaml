  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal coordinates translate the assigned evidence into a relative map of full-stack stablecoin breadth versus
      implementation simplicity for enterprise partners.
    data:
      xAxis:
        label: Stablecoin lifecycle breadth
        min: 1
        max: 5
        lowLabel: narrow feature set
        highLabel: full-stack cards, wallets, and money movement
        description: Evidence-backed ordinal score from the assigned source set, not market-share rank.
      yAxis:
        label: Partner implementation simplicity
        min: 1
        max: 5
        lowLabel: fragmented multi-vendor deployment
        highLabel: single-integration deployment
        description: Evidence-backed ordinal score from the assigned source set, not a measured onboarding time.
      points:
        - label: Rain
          x: 5
          'y': 5
          detail: >-
            Assigned sources consistently pitch Rain as one integration across cards, wallets, virtual accounts,
            payouts, and stablecoin settlement.
          note: High breadth and simplicity are driven by bundle density rather than a consumer brand.
        - label: Fiat-first spend platforms
          x: 2
          'y': 4
          detail: >-
            AInvest says Brex and Ramp are adding stablecoin features, but stablecoins remain an extension to fiat-first
            workflows in the assigned pool.
          note: Simple for corporate buyers, but narrower on full stablecoin lifecycle breadth in current evidence.
        - label: Traditional issuer stack
          x: 1
          'y': 2
          detail: >-
            Rain contrasts legacy programs with fiat-only, bank-restricted flows, longer launches, and multi-day
            settlement.
          note: Incumbent familiarity remains strong, but the assigned evidence frames this path as more fragmented.
        - label: External wallet + Rain services
          x: 4
          'y': 4
          detail: >-
            Cointrust says partners can keep a third-party wallet and connect it to Rain cards, rewards, onramps, and
            payouts.
          note: This path preserves prior wallet investment while still using Rain for key payment functions.
        - label: Thredd + Bakkt concept
          x: 3
          'y': 2
          detail: Digital Transactions reports only a proof of concept for stablecoin-settled credit card processing.
          note: Meaningful adjacency, but not yet presented as a production full-stack alternative in assigned sources.
        - label: Internal multi-vendor build
          x: 5
          'y': 1
          detail: >-
            The assigned evidence repeatedly frames the alternative to Rain as stitching together wallet, issuing,
            settlement, and payout functions across providers.
          note: Maximum architectural control comes with the highest integration burden.
    approximationNotes: >-
      Coordinates are ordinal judgments derived from source-backed product scope and implementation descriptions, not
      audited benchmark scores.
    claimRefs:
      - CP001
      - CP003
      - CP006
      - CP013
      - CP014
      - CP016
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Rain's public materials support a unified stablecoin payments workflow, but the retained economics at each step
      remain mostly private.
    data:
      nodes:
        - id: user-funding
          label: Funds enter partner app
          detail: Users or businesses receive funds through virtual accounts or onramps exposed inside a partner workflow.
        - id: wallet-balance
          label: Wallet / stablecoin balance
          detail: Rain Wallets centralize storage, card funding, and money movement from a single balance.
        - id: card-program
          label: Rain-issued card program
          detail: Partners launch branded consumer or business card programs through Rain's issuing stack.
        - id: network-settlement
          label: Daily network settlement
          detail: Rain says it settles card transactions with Visa daily using stablecoins instead of legacy multi-day cycles.
        - id: payout-rail
          label: Spend or payout rail
          detail: Balances can be spent at merchant locations or moved to local bank accounts through payout infrastructure.
        - id: retained-economics
          label: Rain retained economics
          detail: >-
            Public evidence does not reveal the take rate, revenue split, reserve cost, fraud loss, or support cost that
            converts volume into gross profit.
      edges:
        - from: user-funding
          to: wallet-balance
          label: funding
        - from: wallet-balance
          to: card-program
          label: card funding
        - from: card-program
          to: network-settlement
          label: network clearing
        - from: network-settlement
          to: payout-rail
          label: spend or local payout
        - from: payout-rail
          to: retained-economics
          label: fees net of partner and operating costs
    approximationNotes: >-
      The sequence is product-mechanism evidence, not a quantified margin waterfall; public sources describe the steps
      but not the realized economics at each node.
    claimRefs:
      - CI004
      - CI005
      - CI007
      - CI009
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Rain's public stack runs from partner embed and funding intake through wallet, card, payout, and control layers.
    data:
      layers:
        - label: Partner embed
          detail: Partners integrate Rain once and expose the product inside their own app or program.
          modules:
            - Program design and launch support
            - Partner-branded card and wallet experiences
          outputs:
            - Embedded stablecoin payment interface
        - label: Funding intake
          detail: Virtual accounts and payment onramps feed balances into the Rain workflow.
          modules:
            - Virtual accounts
            - Payment onramps
          outputs:
            - Stablecoin-funded balance
        - label: Wallet core
          detail: Non-custodial wallets are live now, with custodial wallets still on the roadmap.
          modules:
            - Passkey or one-time-code access
            - Support for 12 blockchain networks
          outputs:
            - Receive, hold, and send stablecoins
        - label: Spend and rewards
          detail: Wallet balances fund Rain-issued cards and related rewards products.
          modules:
            - Virtual and physical cards
            - Apple Pay and Google Pay provisioning
          outputs:
            - Merchant acceptance at scale
        - label: Money-out and payout
          detail: The same balance can move off-platform through offramps and payout rails.
          modules:
            - Offramps
            - Global payouts
            - Western Union-linked cash-out capability
          outputs:
            - Local-currency bank payout
        - label: Controls and regulated expansion
          detail: Control features are described as built in, while the trust-bank path remains a pending external dependency.
          modules:
            - Compliance, fraud, disputes, and reporting
            - Proposed OCC-supervised trust-bank subsidiary
          outputs:
            - Program-level controls and regulatory dependency
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE011
      - CE012
      - CE013
      - CE014
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Rain's customer journey starts with an enterprise integration and expands as more money-movement steps move into
      the same partner experience.
    data:
      items:
        - label: Partner selects Rain as infrastructure layer
          actor: Enterprise, neobank, platform, developer, or AI-agent builder
          touchpoints:
            - One integration can expose cards, wallets, rewards, virtual accounts, and payouts
            - Buying decision sits with partner product, ops, and treasury teams rather than the end user
        - label: Initial card-issuing deployment
          stage: Land
          touchpoints:
            - Rain issues cards accepted at more than 175 million merchant locations worldwide
            - Stablecoin settlement stays mostly behind the scenes for the end user
        - label: Wallet becomes the core account
          stage: Expand
          touchpoints:
            - Non-custodial wallets are available now
            - Custodial wallets and earning features are planned for later in 2026
        - label: Money-in and storage deepen usage
          stage: Expand
          touchpoints:
            - Virtual accounts and onramps put balances directly into the wallet
            - Users can hold USDC, USDT, and other supported assets across 12 blockchains
        - label: Spend, send, and local payout inside the partner app
          stage: Operate
          touchpoints:
            - Wallet balances can fund card spend
            - Offramps and payouts let partners convert usage into local-currency cash-out flows
        - label: Channel-led expansion into new vertical programs
          stage: Expand
          touchpoints:
            - Stewards shows a partner-owned SMB-finance workflow using Rain issuance and settlement
            - Rain can win more wallet share even when the partner keeps its own customer relationship
    approximationNotes: This figure is a workflow model derived from the cited sources, not a measured funnel or cohort conversion chart.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU012
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Shared-contract security, charter/legal uncertainty, and partner dependence are the three highest residual-risk
      clusters in the current evidence set.
    data:
      columns:
        - label: Likelihood
          note: Higher values reflect how directly the retained evidence shows the risk occurring or persisting.
        - label: Impact
          note: Impact reflects customer-loss, regulatory, or commercial downside if the risk crystallizes.
        - label: Mitigation maturity
          note: >-
            Lower maturity means the retained sources describe intent or architecture but not independently verified
            control outcomes.
      rows:
        - label: Shared-contract security blast radius
          note: Based on the August 2026 exploit of an outdated Rain contract across multiple downstream programs.
          values:
            - label: High
              tone: high
              note: Recent realized incident with repeatable shared-code exposure.
            - label: High
              tone: high
              note: User-fund loss and partner-brand damage were already observed.
            - label: Medium
              tone: medium
              note: Vulnerable contracts were upgraded, but no retained audit or reimbursement policy closes the loop.
        - label: OCC charter and legal-framework uncertainty
          note: Based on Rain's pending trust-bank application and contemporaneous litigation over the OCC framework.
          values:
            - label: Medium-High
              tone: high
              note: Approval is pending and litigation is active, but denial is not yet evidenced.
            - label: High
              tone: high
              note: Delay or adverse rulings could slow licensing, reserves strategy, and enterprise sales.
            - label: Medium
              tone: medium
              note: Separate-bank structure and fresh capital help, but approval remains external.
        - label: Network / provider / partner dependence
          note: Based on reliance on Visa, Mastercard, Western Union, and third-party custody/conversion providers.
          values:
            - label: Medium
              tone: medium
              note: Dependencies are structural, though not all counterparties are concentrated in the retained evidence.
            - label: High
              tone: high
              note: Any major offboarding or outage would hit settlement, acceptance, or distribution quickly.
            - label: Medium
              tone: medium
              note: Dual-network memberships and partner breadth mitigate some single-point failure risk.
        - label: Virtual-account liability and freeze risk
          note: Based on Rain's legal terms for virtual accounts and partner-controlled fund flows.
          values:
            - label: Medium
              tone: medium
              note: Contractual freeze and suspension rights are explicit, but trigger frequency is undisclosed.
            - label: Medium
              tone: medium
              note: Access interruptions or disputed losses can create customer and partner friction quickly.
            - label: Medium-Low
              tone: medium
              note: Partner-bank structure exists, but indemnity and reimbursement evidence is missing.
        - label: Stablecoin issuer / fork / unsupported-asset exposure
          note: >-
            Based on Rain's explicit disclosures that unsupported assets can be lost and issuer/blockchain events can
            impair redemption.
          values:
            - label: Medium
              tone: medium
              note: The terms contemplate these risks as real operating conditions, not remote hypotheticals.
            - label: High
              tone: high
              note: Loss of redemption, chain failure, or unsupported-asset loss can impair customer funds directly.
            - label: Low
              tone: high
              note: Retained evidence shows disclosures but not audited recovery controls or asset-level contingency plans.
        - label: Scale-driven partner concentration and loss-absorption ambiguity
          note: >-
            Based on Rain's claimed scale and the absence of retained disclosure on partner mix or post-incident
            reimbursement.
          values:
            - label: Medium
              tone: medium
              note: Concentration may be manageable, but the current evidence set does not quantify it.
            - label: High
              tone: high
              note: A concentrated partner or unfunded reimbursement event could convert growth into balance-sheet stress.
            - label: Low-Medium
              tone: medium
              note: Fresh capital helps, but concentration and reserve coverage remain largely undisclosed.
    approximationNotes: >-
      Heatmap ratings are synthesized from the cited evidence and are not sourced from a third-party risk model; they
      visualize relative residual severity, not precise probability estimates.
    claimRefs:
      - CR001
      - CR002
      - CR008
      - CR010
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Verified scale and product expansion are real, but missing unit economics and added regulatory complexity force an
      entry-disciplined recommendation.
    data:
      nodes:
        - id: scale
          label: Verified scale proof
          detail: Series C at $1.95B; >$3B annualized volume; 200+ partners.
          tone: positive
        - id: breadth
          label: Product breadth is increasing
          detail: Cards, wallets, payouts, and wider network reach expand strategic scope.
          tone: positive
        - id: opacity
          label: Monetization is still opaque
          detail: No public retained revenue, margin, burn, or preference-stack disclosure.
          tone: adverse
        - id: competition
          label: Competition can compress price
          detail: Alternative stacks reduce the value of growth narratives without economics proof.
          tone: warning
        - id: regulation
          label: Regulatory path adds timing risk
          detail: OCC trust-bank review and a live lawsuit raise execution uncertainty.
          tone: warning
        - id: recommendation
          label: Recommendation stays research-more
          detail: Require economics disclosure or better price/terms before underwriting.
          tone: adverse
      edges:
        - from: scale
          to: breadth
          label: validates market relevance
        - from: breadth
          to: opacity
          label: raises the bar for proof
        - from: opacity
          to: competition
          label: weakens pricing confidence
        - from: competition
          to: regulation
          label: keeps downside live
        - from: regulation
          to: recommendation
          label: forces entry discipline
    approximationNotes: null
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV011
      - CV012
      - CV013
