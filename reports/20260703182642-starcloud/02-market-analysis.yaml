- calloutType: insight
  title: The first market is edge processing, not orbital hyperscale
  body: Public deployment evidence clusters around local processing, relay-enabled analytics, and secure storage. None of the reviewed sources shows a disclosed market where buyers are already committing large training clusters to orbit.
  claimRefs:
