- id: buyers-workflows-and-adoption-path
  title: Buyer segmentation, workflows, and adoption path
  body: The public evidence points to four buyer clusters. First are Earth-observation and sensing operators that want to process data before downlink. Second are defense and national-security users that value Earth-independent resilience, secure relay, and multi-sensor fusion. Third are sovereign or regulated cloud buyers who may eventually value off-Earth storage or secure processing. Fourth are hyperscalers and AI-platform providers, but these appear to be future channel or infrastructure buyers rather than immediate-volume customers. The adoption path is also becoming clearer. Kepler’s and Aethero’s materials emphasize distributed edge processing, hosted workloads, and smaller-scale services first. Starcloud-2’s own page mirrors that pattern, promising a GPU cluster, persistent storage, and secure access for both in-space and terrestrial users. The public Crusoe partnership then extends the path one step further by pointing toward limited commercial cloud capacity in orbit by 2027. In
    other words, the market seems to progress from demo hardware to hosted payloads, then to selective cloud workloads, and only later—if launch economics cooperate—to something resembling large-scale orbital infrastructure.
