- id: growth-constraints-and-market-verdict
  title: Growth constraints, contradictory signals, and market verdict
  body: 'The largest mistake in this market would be to confuse technical possibility with near-term adoption. Public sources show several real constraints. Regulatory reviews remain unsettled, especially for very large constellations that require waivers or new policy interpretation. Launch economics remain a gating variable for Starcloud’s biggest vision because giant orbital clusters still assume heavy-lift capacity and much lower cost per kilogram than is commercially routine today. Optical networking, interoperability, and operational reliability are also dependencies rather than solved commodities. Finally, orbital compute still competes against a status quo that keeps improving: ground cloud, managed ground stations, and increasingly capable edge hardware on ordinary satellites. Contradictory signals therefore need to be preserved. The category has credible early demand and real deployments, but public evidence is still dominated by pilots, edge workloads, and architecture announcements—not
    recurring disclosed revenue at scale. The market verdict for diligence purposes is that orbital compute is an investable emerging category with real buyer pain, but one that remains too immature for broad TAM-driven underwriting without bottom-up contract evidence.'
