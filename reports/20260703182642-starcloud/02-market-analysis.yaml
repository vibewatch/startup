chapter:
  number: 2
  title: Market Analysis
  summary: Starcloud is targeting an emerging orbital-compute market whose most credible near-term use cases are edge processing, secure data handling, and relay-enabled in-orbit analytics rather than giant AI training clusters. Public evidence shows clear demand drivers—AI power scarcity, downlink bottlenecks, and sovereign resilience—but also major adoption constraints around regulation, launch economics, and workflow switching. The market is real, but still pre-scale and poorly bounded by conventional TAM narratives.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: 'The correct market boundary for Starcloud is not “all data centers” and not even “all space infrastructure.” The more defensible boundary is orbital compute infrastructure: platforms that process, store, or relay data in orbit closely enough to change the workflow relative to downlink-first ground processing. That definition includes Starcloud’s own spacecraft roadmap, Axiom’s orbital data center nodes, Kepler’s optical-relay-plus-compute fabric, and adjacent off-Earth storage efforts such as Lonestar. It excludes ordinary terrestrial colocation, generic hyperscale cloud, and pure satellite imaging software that does not move compute into orbit. This distinction matters because the status quo substitute is already strong. AWS and related ground-cloud workflows can ingest and process satellite data within minutes after downlink, which means orbital compute must win on latency, bandwidth efficiency, resilience, sovereignty, or future energy economics—not on novelty alone. Starcloud’s
    own public positioning helps clarify the boundary: it markets infrastructure for compute in space, not a vertical application. That makes the company part of a new infrastructure layer rather than part of the end-application market built on top of that layer.'
