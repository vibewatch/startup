  evidenceGaps:
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: A public market estimate that isolates orbital compute from broader space infrastructure or generic AI infrastructure.
    whyItMatters: Without a bounded TAM, valuation arguments can become circular and hype-driven.
    diligencePath: Build a bottoms-up model from named workload classes, likely contracts, and launch cadence.
    relatedQuestionRefs:
    - QM021
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: A Starcloud-specific near-term serviceable market estimate based on workloads it can deliver before Starship-scale economics.
    whyItMatters: The company’s long-range vision can obscure what it can sell in the next two to three years.
    diligencePath: Model the Starcloud-2 and Starcloud-3 addressable workload set by power, orbit, and link constraints.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: minor
    topic: pricing-gap
    missingEvidence: Public willingness-to-pay data for sovereign cloud or hosted in-orbit compute workloads.
    whyItMatters: Demand interest does not directly translate into contract pricing or margin support.
    diligencePath: Request LOIs or pilot contracts with list price, committed usage, and duration.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: minor
    topic: sales-cycle-gap
    missingEvidence: Documented procurement-cycle length for defense, EO, or enterprise orbital-compute contracts.
    whyItMatters: Go-to-market timing affects cash burn and the plausibility of near-term revenue.
    diligencePath: Request sales pipeline stages and median days from first meeting to signed pilot or production contract.
    relatedQuestionRefs:
    - QM024
  - type: stale
    severity: material
    topic: adoption-gap
    missingEvidence: A credible 2030-or-earlier estimate of what fraction of AI demand can be shifted into orbit.
    whyItMatters: Category narratives currently over-index on aspiration relative to workload portability.
    diligencePath: Benchmark likely orbital workloads against terrestrial alternatives by latency, bandwidth, and energy economics.
    relatedQuestionRefs:
    - QM025
