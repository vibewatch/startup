callouts:
- calloutType: strength
  title: The company has a real hardware milestone, not just a rendering
  body: Starcloud-1 gives the company technical credibility that many space-infrastructure narratives lack. The open question is how quickly that proof can be generalized into a repeatable commercial platform.
  claimRefs:
  - CE003
  - CE004
  - CE015
  - CE027
- calloutType: risk
  title: Trust and reliability disclosure trail the ambition of the architecture
  body: Public materials describe how the system should work, but not yet how reliably it works over time or under enterprise controls. That gap will matter more as the buyer base moves beyond demos.
  claimRefs:
  - CE019
  - CE022
  - CE033
  - CE034
