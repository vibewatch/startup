- id: architecture-and-workflow
  title: Architecture, workflow, and why the technical thesis is differentiated
  body: 'Starcloud’s technical narrative is unusually specific for an early-stage company. The white paper lays out a hardware-heavy architecture based on solar generation, deployable radiators for passive cooling, dense compute modules, and optical links. Public workflow materials then connect that infrastructure to concrete jobs: processing EO or SAR data in orbit, running AI models locally, transmitting higher-value outputs rather than raw data, and offering resilient off-Earth storage or cloud services. The key differentiator is not merely “AI in space.” Other companies are also putting accelerated compute in orbit. The differentiator is that Starcloud is trying to marry data-center-class silicon, training-oriented ambition, and infrastructure economics in one stack. That is why Starcloud looks more like a future orbital utility than like a narrow edge-compute appliance. It also explains why dependencies matter so much: if cooling, power, optical links, or launch economics break, the
    product promise weakens quickly.'
  claimRefs:
  - CE011
  - CE012
