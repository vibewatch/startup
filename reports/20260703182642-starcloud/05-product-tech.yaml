company:
  name: Starcloud
chapter:
  number: 5
  title: Product & Technology
  summary: 'Starcloud has moved beyond concept into one meaningful in-orbit proof point: Starcloud-1 operated an H100-class GPU and executed AI workloads in space. The public roadmap then steps to Starcloud-2 commercial payloads and Starcloud-3 heavy-lift scale, supported by a clear thermal-and-power narrative in the company’s white paper. The architecture is differentiated, but public reliability, trust, and customer-integration details remain sparse.'
sections:
- id: product-definition-and-assets
  title: Product definition and module map
  body: Starcloud’s product is best understood as orbital compute infrastructure rather than as a single SaaS application or a single satellite payload. Public materials consistently describe a roadmap of assets—Starcloud-1 through Starcloud-4—that progressively move from proof-of-concept into commercial missions and then into larger-scale orbital infrastructure. Starcloud-1 is the clearest proof point because it was launched, carried an H100 GPU, and was used to execute AI workloads in orbit. Starcloud-2 is the first explicitly commercial mission, positioned around a GPU cluster, storage, and continuous access. Starcloud-3 then shifts the story to infrastructure economics with a multi-ton, 200-kilowatt-class spacecraft. Starcloud-4 remains more conceptual in public disclosures. This asset ladder matters because it shows the company is not selling a static product; it is selling a staged migration path from orbital edge compute into a future space-based data-center layer. That is compelling,
    but it also means most of the value-bearing product remains future-dated.
  claimRefs:
