callouts:
- calloutType: insight
  title: Fast capital formation followed a real hardware milestone
  body: Starcloud’s public story is stronger than a typical pre-revenue moonshot because launch and in-orbit workload evidence preceded the March 2026 unicorn round. The gap is not whether the team can ship a demo; it is whether demos convert into recurring, disclosure-grade commercial metrics.
  claimRefs:
  - CO010
  - CO016
  - CO018
  - CO035
- calloutType: risk
  title: Regulatory permission is not a footnote
  body: The 88,000-satellite filing is itself a strategic asset, but it also concentrates Starcloud’s execution path into one unusually visible regulatory process that third parties are already contesting.
  claimRefs:
  - CO025
  - CO027
  - CO028
