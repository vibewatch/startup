- id: founders-and-operating-team
  title: Founders, operating team, and governance visibility
  body: 'Founder-market fit is the strongest publicly observable asset in Starcloud’s profile. Philip Johnston’s background blends finance, strategy, and space-market exposure; Ezra Feilden’s background is rooted in deployable spacecraft structures and power systems; and Adi Oltean brings both SpaceX networking context and hyperscale GPU-operations experience from Microsoft. Public team pages also show that Starcloud is not simply a three-founder concept vehicle: it has already added senior personnel with SpaceX, Helion, Amazon LEO, Rocket Lab, Astranis, and U.S. Space Force backgrounds. That mix directly matches the technical and go-to-market problems the company needs to solve—satellite bus design, thermal management, manufacturing, defense partnerships, and commercial business development. Governance visibility is thinner. The Series A introduced at least one clear board-level change, with Benchmark’s Chetan Puttagunta taking a seat, but Starcloud does not publicly disclose a full board
    roster, voting control structure, or observer list. The careers page showed twelve open roles on the report date, which supports the view that Starcloud is scaling hardware and operations, but public headcount is still not disclosed. Overall, the team story is strong; the governance story is still sparse.'
