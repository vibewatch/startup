- id: funding-and-public-milestones
  title: Funding history, milestone credibility, and scale signals
  body: 'Starcloud’s March 2026 financing created the public-company-style attention that now defines the name. TechCrunch and SpaceNews both reported a $170 million Series A at a $1.1 billion valuation led by Benchmark and EQT Ventures, with total funding of about $200 million. Those numbers are highly material because the raise landed only months after the first hardware milestone: the November 2025 Starcloud-1 launch with an NVIDIA H100 GPU in orbit. Public sources then extended the milestone from a launch event into a workload event, reporting Gemma inference and NanoGPT training in orbit. That sequence—technical proof first, capital formation second—helps explain why investors tolerated a speed-to-unicorn narrative despite minimal public revenue disclosure. At the same time, milestone credibility should be separated from business-model credibility. Public sources do show launch, power-class plans, and facility plans; they do not yet show a mature bookings base, disclosed revenue, or
    a broad customer roster. Y Combinator’s page adds useful but still company-claimed traction clues—high-value LOIs and booked launches—without bridging the final gap to repeatable cash flows.'
