- id: regulatory-and-disclosure-boundary
  title: Regulatory posture, competitive context, and disclosure limits
  body: 'The biggest difference between Starcloud and a conventional AI infrastructure startup is that scale depends on public authorities as much as on customer demand. The FCC’s March 2026 public notice accepted Starcloud’s application to deploy up to 88,000 satellites, but acceptance for filing is not approval. The filing itself described sun-synchronous operations between 600 and 850 kilometers, optical intersatellite links, and a request for multiple rule waivers. Independent commentary quickly highlighted the regulatory burden this creates. Secure World Foundation argued that a constellation of that scale is precedent-setting and should not be authorized without phased demonstrations and system-level analysis of disposal, collision, and interference risk. Greenberg Traurig separately wrote that orbital data center proposals are emerging faster than the FCC’s purpose-built framework, leaving applicants dependent on waivers and case-by-case interpretation. Competitive context reinforces
    the point: Axiom and Kepler already have public orbital compute and optical-relay initiatives, so Starcloud is not alone, but it is making one of the boldest scale claims in the category. The company’s public disclosures are therefore credible enough to support a serious diligence process, but nowhere near complete enough to support underwriting without management access.'
