- id: peer-profiles-and-proof
  title: Peer profiles and current proof points
  body: 'Among the direct peers, Kepler and Axiom stand out on currently disclosed operating proof. Kepler has a working optical-relay constellation, public compute capability across ten satellites, and a disclosed customer count. Axiom has live orbital-data-center nodes, ISS heritage, and an overt security-and-sovereignty narrative that fits defense and institutional buyers. Aethero is smaller scale but important because it demonstrates a modular compute-as-a-service route with NVIDIA Jetson systems and multiple software customers. Lonestar is different again: its proof is about resilient storage and off-Earth continuity rather than about high-density AI training. Starcloud’s own proof remains compelling but narrower. It has the first H100-in-orbit milestone and public AI inference/training claims, but its next commercial platform is still a future mission. That means the company is strongest on narrative differentiation and long-range ambition, while several peers are stronger on presently
    disclosed operationalization.'
