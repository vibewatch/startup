callouts:
- calloutType: insight
  title: Starcloud leads more on ambition than on disclosed operating proof
  body: The public competitive gap is not whether Starcloud has an interesting architecture. It does. The gap is that peers like Kepler and Axiom currently disclose more day-two operating context for buyers.
  claimRefs:
  - CP013
  - CP015
  - CP017
  - CP035
- calloutType: risk
  title: The buyer can assemble alternatives from multiple layers
  body: A customer does not need a Starcloud-like company to solve every space-data problem. Relay players, edge-compute providers, resilient-storage providers, and terrestrial cloud workflows already cover parts of the job.
  claimRefs:
