  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: peer-revenue-gap
    missingEvidence: Recurring revenue and gross-margin disclosures for Starcloud and the core peer set.
    whyItMatters: Without economics, competitive durability is being inferred from architecture and announcements alone.
    diligencePath: Request peer revenue estimates and Starcloud management benchmark deck.
    relatedQuestionRefs:
    - QP021
  - type: private-evidence-only
    severity: minor
    topic: peer-retention-gap
    missingEvidence: Public retention or renewal data across orbital-compute peers.
    whyItMatters: Customer proof without renewal or expansion data may overstate durability.
    diligencePath: Ask management for replacement-rate and renewal benchmarks by peer class.
    relatedQuestionRefs:
    - QP022
  - type: missing-source
    severity: minor
    topic: starcloud-2-gpu-gap
    missingEvidence: Installed GPU count and exact hardware mix for Starcloud-2.
    whyItMatters: The competitive comparison changes meaningfully if Starcloud-2 is a small hosted node versus a sizable cluster.
    diligencePath: Request system architecture sheet for Starcloud-2.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: minor
    topic: trust-gap
