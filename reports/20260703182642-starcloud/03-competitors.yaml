chapter:
  number: 3
  title: Competitors
  summary: Starcloud competes in a fragmented orbital-compute landscape rather than in a winner-take-all market today. Kepler and Axiom currently show stronger public operating proof and trust posture, while Aethero and Lonestar attack narrower edge-compute or resilience segments. Starcloud’s clearest differentiation remains its H100-in-orbit milestone and much bolder scale ambition, but public customer proof and pricing remain thinner than the vision.
sections:
- id: landscape-and-direct-peers
  title: 'Landscape: direct peers, adjacents, and substitutes'
  body: 'The competitive set around Starcloud should be split into at least three layers. The direct peer layer contains companies that are explicitly building compute or storage infrastructure in orbit: Axiom, Kepler, Aethero, and Lonestar all qualify, even though their architectures differ. The adjacent layer contains optical-relay and space-network players such as Space Compass or software-layer partnerships such as Sophia-on-Kepler, where compute rides another operator’s infrastructure. The substitute layer contains terrestrial and hybrid workflows—AWS Ground Station and conventional cloud processing—that may satisfy the same customer job without any orbital cloud dependency. That structure matters because buyers do not choose between identical products. A defense or sovereign customer may compare Starcloud against Axiom more directly, an edge-processing customer may compare it against Kepler or Aethero, and a resilience buyer may compare it against Lonestar or a terrestrial backup design.
    Starcloud therefore competes as much on architectural framing and future roadmap credibility as on current feature parity. This is not a winner-take-all market yet; the buyer can assemble alternatives from multiple layers.'
