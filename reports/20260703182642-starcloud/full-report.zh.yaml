            body: >-
              Starcloud 的商业化路径可见，但仍很窄。Crusoe
              是真实资产，因为它提供了一条从轨道硬件进入可识别云工作负载的可信路径。同一事实也带来伙伴集中。如果少数交易对手承载了公开验证故事的大部分，那么这些关系中的任何滑坡都会产生过大的信号影响。围绕先进 GPU
              的供应商集中又叠加一层风险，对轨道网络生态和发射准入的依赖也是如此。商业证据仍足够早，投资人应在更好披露出现前假设客户集中。融资风险也自然来自这个结构。公开来源没有披露收入、ARR
              或毛利率，但路线图意味着随着任务和设施扩张，资本强度会持续上升。在这类业务里，客户多元化不足和里程碑延迟不会彼此隔离；它们会直接推高现金消耗持续时间和新增融资需求。因此，即便 2026 年 3
              月融资规模很大，商业和融资风险仍应位于最高层级。
