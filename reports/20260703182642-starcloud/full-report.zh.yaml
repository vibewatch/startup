  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和替代方案
        blocks:
          - type: paragraph
            body: >-
              Starcloud 正确的市场边界不是“所有数据中心”，甚至也不是“所有太空基础设施”。更站得住脚的边界是轨道计算基础设施：在轨处理、存储或中继数据，并足以改变先下传再地面处理流程的平台。这个定义包括
              Starcloud 自身的航天器路线图、Axiom 的轨道数据中心节点、Kepler 的光中继加计算织网，以及 Lonestar
              等相邻的地外存储项目。它不包括普通地面托管、通用超大规模云，也不包括没有把计算搬入轨道的纯卫星影像软件。这个区分很重要，因为现状替代方案已经很强。AWS
              及配套地面云流程可以在下传后数分钟内摄取并处理卫星数据，这意味着轨道计算必须赢在时延、带宽效率、韧性、主权或未来能源经济性上，而不能只靠新鲜感。Starcloud
              自身的公开定位也帮助厘清边界：它卖的是太空计算基础设施，不是垂直应用。因此，公司属于一个新的基础设施层，而不是该层之上的终端应用市场。
