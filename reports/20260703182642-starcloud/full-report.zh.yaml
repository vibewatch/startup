  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价表面和收入质量
        blocks:
          - type: paragraph
            body: >-
              Starcloud 的公开来源确实指向一个真实收入模式，但只停留在架构层面。管理层和伙伴材料暗示至少三条变现路径：向航天器和载荷运营商销售托管轨道计算；通过 Crusoe
              等伙伴运行未来云工作负载；最终像太空数据中心运营商一样租赁或销售基础设施容量。问题不在缺少想法，而在缺少已兑现经济性。已审阅公开来源没有披露收入、ARR、已签年度合同价值或总预订额。定价也大多不透明。少数公开数字不是合同价格，而是愿景经济性：管理层关于在有利发射成本假设下达到约每千瓦时
              5 美分的表述，以及白皮书基于工程假设给出的、低得多的等效能源成本估算。这些数字有助于搭建情景，但不是价格兑现或利润率的证明。唯一硬商业信号是 LOI、一个具名云伙伴，以及管理层关于托管载荷需求的说法。
