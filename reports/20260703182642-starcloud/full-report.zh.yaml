chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品命题和当前路线图
        blocks:
          - type: paragraph
            body: >-
              Starcloud 仍处很早期，但公开材料把公司定义得异常具体：它称自己正在太空建设数据中心，以支撑 AI 的未来。官网和白皮书把核心命题落在三个 Starcloud
              认为地面基础设施无法足够快解决的约束上——电力供应、冷却和许可。公司认为，轨道基础设施可以利用持续太阳能、被动辐射冷却，以及不受地面土地使用和地方审批限制的模块化架构。这仍是公司声称的命题，不是已验证的商业结果，但官网、白皮书和
              2026 年 3 月之后的新闻报道口径一致。硬件路线图也异常清晰。公开页面描述了已完成的 Starcloud-1 演示，计划到 2027 年全面运行的 Starcloud-2
              商业任务，以及意在把业务从公斤级演示推向数据中心经济性的 Starcloud-3 航天器。同一条公开路线图现在已经不止一颗演示卫星，还延伸到制造、设施建设和长期星座申请；因此，身份章节构成后续所有章节的事实底座。
