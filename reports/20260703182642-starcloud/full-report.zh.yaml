  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和模块地图
        blocks:
          - type: paragraph
            body: >-
              Starcloud 的产品最好理解为轨道计算基础设施，而不是单一 SaaS 应用或单一卫星载荷。公开材料持续描述一条由资产组成的路线图——从 Starcloud-1 到
              Starcloud-4——逐步从概念验证走向商业任务，再走向更大规模的轨道基础设施。Starcloud-1 是最清楚的验证点，因为它已发射、搭载 H100 GPU，并用于在轨执行 AI
              工作负载。Starcloud-2 是第一个明确商业化的任务，围绕 GPU 集群、存储和持续访问定位。Starcloud-3 则把故事切换到基础设施经济性，采用多吨级、200 千瓦级航天器。Starcloud-4
              在公开披露中仍更偏概念。这条资产阶梯很重要，因为它说明公司卖的不是静态产品，而是从轨道边缘计算迁移到未来太空数据中心层的分阶段路径。这个叙事有吸引力，但也意味着大部分承载价值的产品仍在未来。
