companyProfile:
  summary: >-
    Starcloud 是一家总部位于华盛顿州雷德蒙德的轨道数据中心公司，由 Philip Johnston、Ezra Feilden 和 Adi Oltean 领导。公司正沿着分阶段路线推进：Starcloud-1 已公开搭载
    NVIDIA H100 并在轨运行 AI 工作负载；随后是具备商业载荷能力的 Starcloud-2，以及规模大得多的 Starcloud-3 基础设施构想。Starcloud 的商业叙事是为地球观测、主权、国防和 AI
    基础设施工作负载提供太空计算、存储，并在之后提供云式容量。2026 年 3 月的公开报道确认，公司完成由 Benchmark 和 EQT 领投的 $170 million A 轮融资，估值 $1.1
    billion；但收入、客户广度、可靠性和融资结构的公开披露仍很薄。
