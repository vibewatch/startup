            body: >-
              公开记录让 Starcloud 更像硬件和基础设施项目，而不是软件公司。成本驱动因素包括发射、发电、冷却硬件、屏蔽、GPU、制造和设施。2026 年 3 月 SpaceNews
              报道和招聘页都强化了这一判断：Starcloud 正在招聘热、机械、设施和电力职能，同时规划专用 Woodinville
              设施。白皮书提供了更多工程细节，包括成本平衡表，以及围绕屏蔽和电力的假设，但这些仍是内部估算，不是经审计经济性。这意味着单位经济性桥梁仍缺少最关键的数值：毛利率、贡献利润率、利用率，以及按任务回收成本的情况。管理层称
              Starcloud-2 应通过托管载荷覆盖自身成本，这在方向上令人鼓舞；但在合同结构和任务级 P&L 披露之前，投资人无法区分有前景的工作负载密度和已经充分降险的经济性。
