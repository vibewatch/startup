      - number: '2.3'
        title: 买方分层、工作流和采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据指向四类买方。第一类是希望在下传前处理数据的地球观测和传感运营商。第二类是重视地外韧性、安全中继和多传感器融合的国防与国家安全用户。第三类是主权或受监管云买方，他们未来可能看重地外存储或安全处理。第四类是超大规模云厂商和
              AI 平台提供商，但它们看起来更像未来渠道或基础设施买方，而非近期大批量客户。采用路径也越来越清楚。Kepler 和 Aethero
              的材料首先强调分布式边缘处理、托管工作负载和较小规模服务。Starcloud-2 自己的页面也复制了这个模式，承诺为太空内和地面用户提供 GPU 集群、持久化存储和安全访问。公开的 Crusoe
              合作又把路径往前推了一步，指向到 2027 年在轨提供有限商业云容量。换句话说，市场似乎从演示硬件推进到托管载荷，再到选择性云工作负载；只有在发射经济性配合之后，才会走向类似大规模轨道基础设施的形态。
