            title: 最早市场是边缘处理，不是轨道超大规模计算
            body: 公开部署证据集中在本地处理、中继赋能分析和安全存储。已审阅来源没有显示一个已披露市场，证明买方已经承诺把大型训练集群放到轨道上。
