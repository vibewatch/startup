      - number: '8.4'
        title: 最终判断：跟踪公司，但暂不按当前标价承销
        blocks:
          - type: paragraph
            body: >-
              最终判断是跟踪 / 继续研究，中等置信度，风险评级很高。这不是否定 Starcloud
              的技术雄心，而是承认：公开来源中，用来支撑十亿美元级基础设施估值的证据包仍不完整。投资论点真实到值得继续做功课，因为公司踩在强劲的 AI
              计算顺风上，也已经跨过一个异常艰难的技术里程碑。反论点在当前价格下更强，因为商业化、可靠性、监管时点和资本结构仍然过于不透明。Starcloud
              提升可投资性的最快方式，是披露客户经济性、可靠性数据和更清晰的监管工作计划。投资案例恶化最快的路径，则是在保持同样溢价预期的同时错过可见里程碑。在这些缺口补上之前，合适姿态是克制的好奇，而不是激进承销。接下来，投资人应希望证据密度跑得比估值预期更快。
