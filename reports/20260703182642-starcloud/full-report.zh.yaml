  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险是最先触发的命题闸门
        blocks:
          - type: paragraph
            body: >-
              最清楚的头号风险是监管。Starcloud 追求的不是普通卫星申请，也不是熟悉的云计算许可。它试图建立一个新的运营类别：星座规模的分布式轨道数据中心。FCC 受理了最多 88,000
              颗卫星的申请，但受理不是批准，公告也明确显示豁免是路径的一部分。Secure World Foundation
              的评论很重要，因为它不是泛泛怀疑；它认为该申请具有先例意义，应通过分阶段、基于演示的方法处理，而不是立即全规模授权。Greenberg Traurig
              的法律分析从另一个角度强化了同一点：法律框架仍在演化，因此新颖性本身就是风险。这意味着监管时点不是背景问题，而是几乎所有商业假设都必须穿过的第一道闸门。因此，本章把监管延迟、豁免复杂性和管辖权模糊排在多数其他风险之前，因为这些因素能在任何技术弱点出现在现场之前，就拖慢收入时点。
