      - number: '2.2'
        title: 受证据约束的规模测算视角和需求驱动因素
        blocks:
          - type: paragraph
            body: >-
              已审阅来源没有给出一套干净的 TAM/SAM/SOM 结构，把轨道计算从更广泛的 AI
              或太空基础设施市场中剥离出来，因此唯一站得住脚的测算方法，是使用受约束的视角。最强的驱动视角是地面稀缺性：Scientific American 概述 IEA 分析称，数据中心用电需求预计到 2030
              年将增长超过一倍；Starcloud 白皮书则认为，电力、冷却水和许可正在日益阻挡吉瓦级 AI 建设。第二个视角是工作负载痛点：多个来源称，地球观测、RF/SAR
              处理和其他边缘工作负载会产生原始数据量和时延压力，使在轨计算在巨型训练集群可行之前就具备吸引力。第三个视角是部署证据：Starcloud、Axiom、Kepler、Lonestar 和 Aethero
              都有已发射或活跃硬件主张，这比纯靠白皮书搭起来的市场具体得多。因此，该品类有真实需求信号，但没有公开财务边界来支撑精确 TAM
              算术。正确解读应是“供给受限、机会真实、收入披露尚不成熟”，而不是“已验证的超大规模市场”。
