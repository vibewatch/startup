        title: 当前价格买的是未来证明，不是已披露的当前经济性
        blocks:
          - type: paragraph
            body: >-
              起点很简单：Starcloud 2026 年 3 月 Series A 的报道估值约为
              $1.1B，但公开材料没有披露收入、毛利率或客户质量数据，而这些通常决定投资人能否判断这个价格是否克制。这不等于估值不理性，而是说估值主要买的是期权价值。投资人押注的是一条未来路径：轨道计算变得具备战略意义，Starcloud
              保持足够的技术领先，后续任务证明业务能以经济方式扩张。Starcloud-1
              是一个真实的验证点，公司因此值得被认真看待。但公开记录仍更像里程碑故事，而不是财务模型。因此，当前决策必须对价格敏感。公司可以很令人兴奋，同时也仍然难以按当前标价承销。
