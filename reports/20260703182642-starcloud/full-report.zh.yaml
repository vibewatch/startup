        blocks:
          - type: paragraph
            body: >-
              Starcloud 的技术野心既是吸引力，也是风险。公司已经用 Starcloud-1
              做成了真实事情，相比纯概念阶段团队降低了技术风险。但它还没有证明一次任务可以变成工业化平台。白皮书把热控制、辐射冷却、太阳能和紧密系统集成放在架构核心。这些不是表面设计选择，而是商业案例的基础。如果这些系统在更长任务中的表现低于计划，经济性命题会迅速变弱。发射和任务运营也一样。Starcloud-2
              和更重的 Starcloud-3 构想，在很短时间内压缩了多个困难过渡，而公开来源仍没有披露正常运行时间、MTBF
              或长时遥测。公开信任和合规披露也很薄。对主权、国防和企业买方来说，缺失的信任界面不是外观问题，而是运营准备度的一部分。结果是，它的风险画像更接近航空航天制造项目，而不是典型软件创业公司。
