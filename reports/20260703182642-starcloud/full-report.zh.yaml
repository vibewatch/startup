              和合作转成经常性工作负载，证明 Starcloud-2
              成本回收，并缩小发射经济性理论与真实客户合同之间的差距，它可能演变为高价值基础设施层。它也可能多年消耗资本，却不披露投资人通常需要用来校准十亿美元估值的信息。用于尽调时，关键阻塞点不是“Starcloud
