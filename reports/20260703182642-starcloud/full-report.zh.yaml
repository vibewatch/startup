      - number: '1.2'
        title: 创始人、运营团队和治理能见度
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配度，是 Starcloud 公开画像里最强的可观察资产。Philip Johnston 的背景结合了金融、战略和航天市场经验；Ezra Feilden 扎根于可展开航天器结构和电力系统；Adi
              Oltean 则同时带来 SpaceX 网络背景和 Microsoft 超大规模 GPU 运营经验。公开团队页面还显示，Starcloud 并不是一个三位创始人的概念载体：公司已经补进具有
              SpaceX、Helion、Amazon LEO、Rocket Lab、Astranis 和 U.S. Space Force
              背景的资深人员。这个组合直接对应公司必须解决的技术和商业落地问题——卫星平台设计、热管理、制造、国防合作，以及商业业务开发。治理能见度则更薄。A 轮融资至少带来一个清晰的董事会层面变化：Benchmark 的
              Chetan Puttagunta 获得席位；但 Starcloud 没有公开完整董事名单、投票控制结构或观察员名单。报告日的招聘页显示 12 个开放岗位，支持 Starcloud
              正在扩张硬件和运营能力的判断，但公开员工数仍未披露。整体看，团队故事很强；治理故事仍稀疏。
