      - number: '1.4'
        title: 监管姿态、竞争语境和披露边界
        blocks:
          - type: paragraph
            body: >-
              Starcloud 与传统 AI 基础设施创业公司最大的不同，是规模扩张不仅取决于客户需求，也同样取决于公共主管机构。FCC 2026 年 3 月的公告受理了 Starcloud 最多部署 88,000
              颗卫星的申请，但受理不等于批准。申请文件本身描述了 600 至 850 公里太阳同步轨道运行、光学星间链路，并请求多项规则豁免。独立评论很快指出了由此产生的监管负担。Secure World Foundation
              认为，如此规模的星座具有先例意义，不应在没有分阶段演示、没有对处置、碰撞和干扰风险做系统级分析的情况下获批。Greenberg Traurig 另行写道，轨道数据中心方案出现得快于 FCC
              为其量身搭建监管框架的速度，申请人只能依赖豁免和个案解释。竞争语境也强化了这一点：Axiom 和 Kepler 已经有公开的轨道计算和光中继计划，因此 Starcloud
              并不孤单，但它提出了品类里最大胆的规模主张之一。因此，公司的公开披露足以支持严肃尽调，却远不足以在没有管理层访问的情况下支撑投资判断。
