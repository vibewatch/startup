  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层及其聘用 Starcloud 完成的任务
        blocks:
          - type: paragraph
            body: >-
              Starcloud
              的公开材料描述了两类宽泛用户：需要在下传前处理大量原始数据的太空内用户，以及可能看重地外主权云或韧性备份服务的地面用户。这些高层分类可以拆成更具体的客户任务。地球观测和传感运营商是最清楚的早期匹配，因为它们在轨产生数据，并有即时的时延和带宽痛点。国防或政府用户构成第二个细分，因为韧性和安全本地处理很重要。云或
              AI 基础设施伙伴构成第三个细分，因为它们可以把 Starcloud
              当作未来容量延伸，而不是终端应用。最后，主权或受监管企业是一个长期细分，它们对独立存储和连续性的重视，可能超过对在轨推理的重视。这个分层方向上很强，但仍主要基于产品定位和伙伴公告，而不是披露的客户账本。这个区分应让尽调聚焦证据，而不是可服务市场叙事。
