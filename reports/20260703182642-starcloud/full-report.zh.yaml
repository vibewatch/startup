  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、相邻玩家和替代方案
        blocks:
          - type: paragraph
            body: >-
              Starcloud 周围的竞争集合至少应拆成三层。直接同业层包括明确在轨建设计算或存储基础设施的公司：Axiom、Kepler、Aethero 和 Lonestar 都符合，即便它们的架构不同。相邻层包括
              Space Compass 等光中继和太空网络玩家，或 Sophia-on-Kepler 这类软件层合作，其中计算搭载在另一家运营商的基础设施上。替代层包括地面和混合工作流——AWS Ground Station
              和传统云处理——它们可能在不依赖任何轨道云的情况下满足同一客户任务。这个结构很重要，因为买方并不是在相同产品之间选择。国防或主权客户可能更直接地把 Starcloud 与 Axiom 比较，边缘处理客户可能把它与
              Kepler 或 Aethero 比较，韧性买方可能把它与 Lonestar 或地面备份设计比较。因此，Starcloud
              的竞争不只发生在当前功能平价上，也发生在架构叙事和未来路线图可信度上。这个市场还不是赢者通吃；买方可以从多个层级拼出替代方案。
