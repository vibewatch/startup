      - number: '2.4'
        title: 增长约束、矛盾信号和市场结论
        blocks:
          - type: paragraph
            body: >-
              这个市场最大的错误，是把技术可能性误认为近期采用。公开来源显示了几项真实约束。监管审查仍未落定，尤其是需要豁免或新政策解释的超大型星座。发射经济性仍是 Starcloud
              最大愿景的闸门变量，因为巨型轨道集群仍假定重型运力，以及远低于当下商业常态的每公斤成本。光网络、互操作性和运营可靠性也还是依赖项，并非已经解决的商品。最后，轨道计算仍在与持续改善的现状竞争：地面云、托管地面站，以及普通卫星上越来越强的边缘硬件。因此，矛盾信号必须保留下来。该品类有可信的早期需求和真实部署，但公开证据仍以试点、边缘工作负载和架构公告为主，而不是大规模、经披露的经常性收入。用于尽调的市场结论是：轨道计算是一个具备真实买方痛点、值得投资研究的新兴品类；但如果没有自下而上的合同证据，它仍太不成熟，无法用宽泛
              TAM 逻辑支撑投资判断。
