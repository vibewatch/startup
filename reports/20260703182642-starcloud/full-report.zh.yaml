      - number: '8.2'
        title: 可比分析应混合 AI 基础设施、数据中心经济性和里程碑可比对象
        blocks:
          - type: paragraph
            body: >-
              没有任何直接可比公司能干净套到 Starcloud 身上，因此可比组必须有意混合。CoreWeave 有参考价值，因为它说明：一旦客户验证、产品宽度和信息披露都已到位，公开市场可以怎样奖励 AI
              原生云基础设施。Crusoe 也有参考价值，因为它说明：平台和客户故事更成熟时，私人资本愿意为大规模、重资本开支的 AI 基础设施买单。Digital Realty 和 Equinix
              的价值在另一个层面：不是因为它们的倍数可以直接迁移，而是它们的文件展示了耐久型基础设施经济性在实践中长什么样——经常性收入、客户分散度、正常运行时间和合同可见性。Axiom、Lonestar
              等相邻的太空基础设施项目，则适合作为里程碑参照。它们提醒投资人，轨道数据基础设施可以是真实的，即便还没有商业成熟。这个混合可比组导向一个结论：Starcloud
              应通过情景和里程碑估值，而不是假装一个单一同业倍数能解决问题。
