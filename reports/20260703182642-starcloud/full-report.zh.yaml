        - 客户数、ACV、期限、续约和集中度
        - 缺少这些，收入质量无法做投资测算
        - 向 CEO / CFO 索取
      - - 任务可靠性
        - 遥测、正常运行时间、故障日志和认证结果
        - 缺少这些，技术风险大多仍是叙事
        - 向 CTO / 工程团队索取
      - - 监管工作计划
        - 律师备忘录、豁免追踪表、分阶段审批策略
        - 这是价值兑现的主要时间闸门
        - 向律师 / CEO 索取
      - - 融资结构
        - 股权结构表、清算优先权和未来资本计划
        - 需要这些来检验当前价格下的稀释和下行
        - 向 CFO / 法务索取
    notes: 这些是从跟踪转向主动投资测算前所需的最低尽调问题。
    claimRefs:
      - CV031
      - CV040
