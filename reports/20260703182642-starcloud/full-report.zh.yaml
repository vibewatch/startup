      - number: '8.3'
        title: 牛市、基准和熊市情景都取决于里程碑顺序
        blocks:
          - type: paragraph
            body: >-
              牛市情景概念上很直观，执行上却很难。Starcloud 需要监管推进、Starcloud-2
              商业任务成功、更广泛的具名客户验证，以及经常性轨道经济性存在的早期证据。如果这些事项按顺序落地，今天的估值可能会像是在新基础设施层里抢下一个战略滩头。基准情景没那么戏剧化：公司仍具战略吸引力，也会继续获得关注，但由于经济性披露不足，估值支撑大多仍停留在里程碑层面。熊市情景也容易描述：监管放慢、任务时间表滑坡，或客户验证仍然单薄，同时投资人对投机型基础设施的热情收缩。换句话说，估值争论与其说关乎电子表格，不如说关乎里程碑排序。因此，在现阶段，情景分析是唯一站得住脚的公开市场式方法。
