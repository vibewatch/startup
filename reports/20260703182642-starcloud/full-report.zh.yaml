      - number: '5.3'
        title: 成熟度、依赖项和运营准备度
        blocks:
          - type: paragraph
            body: >-
              成熟度画像是混合的。Starcloud 明显不再是 PPT 概念，因为 Starcloud-1
              已经飞行并执行工作负载。但按照商业基础设施买方通常定义成熟度的方式，产品还不成熟。公开材料没有正常运行时间记录，没有发布
              MTBF，没有披露长时辐射测试数据，也没有公开面向客户的开发者或集成界面。公司自己的招聘和设施信号显示，它正在攻克该攻克的问题——热系统、电力、软件、GNC、制造——但这些只是工作推进中的信号，不是问题已解决的证明。依赖项也异常集中。Starcloud
              依赖 NVIDIA 硬件、SpaceX 发射准入、光中继或网络生态，以及未来云或载荷伙伴。Kepler、Aethero 和 AWS 的公开伙伴材料强化了周边生态正在快速演化这一点，这能帮助
              Starcloud，也会抬高互操作性和买方预期的门槛。结果是一套技术上可行、但在当前阶段运营上仍脆弱的平台。
