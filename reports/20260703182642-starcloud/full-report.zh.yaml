        title: 同业画像和当前验证点
        blocks:
          - type: paragraph
            body: >-
              在直接同业中，Kepler 和 Axiom 在当前披露的运营验证上更突出。Kepler 拥有运行中的光中继星座、覆盖 10 颗卫星的公开计算能力，以及披露的客户数。Axiom 拥有在轨数据中心节点、ISS
              经验，以及契合国防和机构买方的明确安全与主权叙事。Aethero 规模更小，但重要性在于它用 NVIDIA Jetson 系统和多个软件客户，展示了一条模块化计算即服务路线。Lonestar
              又不同：它的验证点是韧性存储和地外连续性，而不是高密度 AI 训练。Starcloud 自身的验证依然有吸引力，但更窄。它拥有首个 H100 在轨里程碑和公开 AI 推理 /
              训练主张，但下一代商业平台仍是未来任务。这意味着公司在叙事差异化和长期野心上最强，而若干同业在当前披露的运营化程度上更强。
