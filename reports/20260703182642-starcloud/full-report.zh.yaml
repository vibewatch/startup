  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 该建议认可技术可能性，但在当前价格下，不认可现阶段的投资核保就绪度。
    data:
      nodes:
        - id: v1
          label: 真实技术验证
          detail: Starcloud-1 让这个故事不再停留在概念层面。
          tone: positive
        - id: v2
          label: AI 需求顺风
          detail: 算力短缺叠加能源需求，撑起一个大机会。
          tone: positive
        - id: v3
          label: 经济性披露稀少
          detail: 公开信息没有收入、利润率或客户质量基线，投资测算缺少抓手。
          tone: risk
        - id: v4
          label: 监管与任务风险
          detail: 商业化节奏取决于审批，也取决于后续任务能否跑成。
          tone: risk
        - id: v5
          label: $1.1B 入场价位
          detail: 当前价格预设了未来要兑现大量执行成果。
          tone: neutral
        - id: v6
          label: 跟踪 / 继续研究
          detail: 继续保持接触，但今天不能按当前价格做投资测算。
          tone: neutral
      edges:
        - from: v1
          to: v5
          label: 支撑关注
        - from: v2
          to: v5
          label: 支撑战略溢价
        - from: v3
          to: v6
          label: 挡住买入
        - from: v4
          to: v6
          label: 风险仍高
        - from: v5
          to: v6
          label: 要求纪律
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV021
      - CV024
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 公开经济性没有披露，敏感性只能看里程碑，不能看收入倍数。
    data:
      items:
        - label: 悲观：里程碑延误
          value: 400
          note: 执行和时间表明显转弱时的示意支撑区间
        - label: 基准：战略期权
          value: 900
          note: 进展延续但经济性仍稀少时的示意区间
        - label: 当前公开估值
          value: 1100
          note: March 2026 报道估值
        - label: 乐观：品类龙头路径
          value: 1800
          note: 仅在 Starcloud-2、客户和监管都降风险后才具示意意义
    claimRefs:
      - CV001
      - CV017
      - CV018
      - CV019
      - CV020
      - CV024
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 这些区间是方向性的估值情景，不是精确公允价值。
    data:
      items:
        - label: 乐观情景
          low: 1500
          mid: 1800
          high: 2200
          unit: $M
          detail: 需要监管往前走、Starcloud-2 跑成、客户面扩大，并拿出越来越多可重复经济性证据
          tone: positive
        - label: 基准情景
          low: 800
          mid: 1000
          high: 1200
          unit: $M
          detail: 公司仍有战略相关性，但估值主要还在给里程碑期权定价
          tone: neutral
        - label: 悲观情景
          low: 300
          mid: 500
          high: 700
          unit: $M
          detail: 监管或任务受挫，会在商业证明成熟前推高融资风险
          tone: risk
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 这组 KPI 把最终判断摊开：Starcloud 在野心上得分高，但当前投资证据得分低。
    data:
      items:
        - label: 市场机会
          value: Strong
          tone: positive
          detail: AI 基础设施需求增长真实存在，也有战略重要性。
        - label: 技术验证
          value: Moderate
          tone: positive
          detail: Starcloud-1 很重要，但可重复性仍未证明。
        - label: 客户验证
          value: Weak
          tone: risk
          detail: 公开客户证据可信，但范围窄，看不到留存。
        - label: 财务透明度
          value: Weak
          tone: risk
          detail: 没有公开收入、利润率或 cap table 细节支撑估值。
        - label: 监管可见度
          value: Weak
          tone: risk
          detail: 高度依赖豁免的 FCC 路径，仍是关键闸门。
        - label: 估值支撑
          value: Weak
          tone: risk
          detail: 当前价格走在已披露基本面前面。
    claimRefs:
      - CV002
      - CV004
      - CV021
      - CV022
      - CV023
      - CV024
      - CV040
