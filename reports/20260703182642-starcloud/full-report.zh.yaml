      - number: '1.3'
        title: 融资历史、里程碑可信度和规模信号
        blocks:
          - type: paragraph
            body: >-
              Starcloud 2026 年 3 月的融资，把这个名字推到了类似公众公司的关注度。TechCrunch 和 SpaceNews 均报道，公司完成 $170 million A 轮融资，估值 $1.1
              billion，由 Benchmark 和 EQT Ventures 领投，累计融资约 $200 million。这些数字很关键，因为融资发生在第一个硬件里程碑之后仅数月：2025 年 11 月
              Starcloud-1 发射，并把一块 NVIDIA H100 GPU 送入轨道。随后公开来源把里程碑从发射事件延展为工作负载事件，报道其在轨运行 Gemma 推理和 NanoGPT
              训练。这个顺序——先有技术验证，再完成资本形成——解释了为什么在公开收入披露极少的情况下，投资人仍接受了快速成为独角兽的叙事。同时，应把里程碑可信度和商业模式可信度分开。公开来源确实显示了发射、功率级规划和设施计划；但还没有显示成熟的订单基础、披露收入或广泛客户名单。Y
              Combinator 页面给出了有用但仍属公司声称的进展线索——高价值 LOI 和已预订发射——但尚未跨过通往可重复现金流的最后一道缺口。
