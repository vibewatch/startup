companyProfile:
  summary: >-
    Starcloud is a Redmond, Washington-based orbital data-center company led by
    Philip Johnston, Ezra Feilden, and Adi Oltean. The company is building a
    staged roadmap from Starcloud-1, which publicly flew an NVIDIA H100 and ran
    AI workloads in orbit, toward Starcloud-2 commercial payload capacity and a
    much larger Starcloud-3 infrastructure concept. Starcloud's commercial pitch
    is to provide in-space compute, storage, and later cloud-style capacity for
    Earth-observation, sovereign, defense, and AI-infrastructure workloads.
    Public March 2026 coverage confirmed a $170 million Series A at a $1.1
    billion valuation led by Benchmark and EQT, but public disclosure remains
    thin on revenue, customer breadth, reliability, and financing structure.
  founders:
    - name: Philip Johnston
      role: Co-founder and CEO
      background: >-
        Published background includes McKinsey work on satellite projects for
        national space agencies.
      claimRefs: [CO004, CO007]
    - name: Ezra Feilden
      role: Co-founder and CTO
      background: >-
        Published background includes Airbus Defence & Space, SSTL, Oxford Space
        Systems, and Lunar Pathfinder work.
      claimRefs: [CO005, CO008]
    - name: Adi Oltean
      role: Co-founder and Chief Engineer
      background: >-
        Published background includes SpaceX Starlink beam-tracking work and
        roughly twenty years on Microsoft GPU clusters.
      claimRefs: [CO006, CO009]
  foundingLocation: Redmond, Washington, USA
  headquarters: Redmond, Washington, USA
  productSummary: >-
    Orbital compute infrastructure spanning demonstration satellites,
    customer-hosted payload capacity, future GPU clusters, persistent storage,
    and a longer-term vision for space-based cloud and data-center services.
  customerFocus: >-
    Earth-observation and sensing operators, sovereign or resilient IT buyers,
    defense and government payload users, and cloud / AI infrastructure
    partners.
  businessModel: >-
