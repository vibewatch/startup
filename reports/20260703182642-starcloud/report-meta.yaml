  topStrengths:
    - >-
      Starcloud-1 gives the company a meaningful technical proof point: an
      H100-class GPU operated in orbit and executed AI workloads.
    - >-
      The company sits inside a credible long-run AI-infrastructure tailwind and
      articulates a differentiated orbital-compute thesis.
    - >-
      Benchmark and EQT led a very large Series A, showing sophisticated
      investor appetite for the opportunity.
    - >-
      The roadmap from Starcloud-2 through Starcloud-4 is unusually explicit for
      an early deep-tech company and provides concrete milestones to track.
    - >-
      Early commercial signal exists through Crusoe, hosted-payload demand, and
      concrete EO-style workload examples.
  topRisks:
    - >-
      The FCC path is novel, waiver-heavy, and exposed to adverse commentary,
      making regulatory timing the first major thesis gate.
    - >-
      Technical and operational risk remain high because one successful mission
      does not yet prove fleet reliability, trust controls, or long-duration
      performance.
    - >-
      Public customer and financial disclosure remain sparse, so the investment
      case still relies more on optionality than on durable economics.
    - >-
      The business is capital-intensive and likely to need more financing before
      public evidence supports mature infrastructure-style underwriting.
    - >-
      Partner, supplier, and launch dependencies remain concentrated, especially
      around commercialization channels and advanced compute hardware.
  unresolvedGaps:
    - >-
      Customer count, contract value, renewal, and concentration data by segment.
    - >-
      Mission telemetry, uptime, qualification results, and reliability evidence
      for current and planned hardware.
    - >-
      Detailed regulatory workplan, waiver strategy, and likely approval path for
      the constellation vision.
    - >-
      Cap table, liquidation preferences, and forward capital plan needed to test
      dilution and downside.
    - >-
      Security, trust, and compliance documentation suitable for sovereign,
      defense, or enterprise buyers.
