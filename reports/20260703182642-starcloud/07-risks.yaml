    - QR005
    - QR024
    - QR025
    - QR027
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: Mission telemetry, reliability statistics, and fault reports for Starcloud-1 or later hardware.
    whyItMatters: Without these materials, the hardware risk remains largely narrative-driven.
    diligencePath: Request telemetry summaries, qualification reports, and post-mission reviews.
