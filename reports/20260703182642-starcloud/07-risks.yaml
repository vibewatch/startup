- id: partner-customer-and-financing-risks
  title: Partner concentration, commercialization fragility, and financing needs can amplify the downside
  body: Starcloud’s commercialization path is visible, but it is still narrow. Crusoe is a genuine asset because it offers a credible route from orbital hardware into recognizable cloud workloads. That same fact also creates partner concentration. If a small number of counterparties carry a large share of the public proof story, then any slip in those relationships has outsized signaling impact. Supplier concentration around advanced GPUs adds another layer, as does dependence on orbital networking ecosystems and launch access. Commercial evidence remains early enough that investors should assume customer concentration until better disclosure appears. Financing risk follows naturally from that setup. Public sources do not disclose revenue, ARR, or gross margin, yet the roadmap implies continuing capital intensity as missions and facilities scale. In this kind of business, weak customer diversification and delayed milestones do not stay isolated; they push directly into burn duration and
    the need for additional financing. That is why the commercial and financing risks belong in the top tier even though the March 2026 round was large.
  claimRefs:
