  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-gap
    missingEvidence: Active customer count and production-vs-pilot split.
    whyItMatters: Without account counts and stages, penetration and concentration cannot be underwritten.
    diligencePath: Request customer list with segment, stage, and ACV band.
    relatedQuestionRefs:
    - QU021
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, renewal, or cohort data.
    whyItMatters: Named logos do not prove durable revenue.
    diligencePath: Request renewal and expansion data by cohort.
    relatedQuestionRefs:
    - QU022
  - type: private-evidence-only
    severity: material
    topic: contract-value-gap
    missingEvidence: Contract values, minimum commitments, and term length for named customers.
    whyItMatters: Customer proof without economics is not enough to benchmark valuation.
    diligencePath: Request ACV, committed capacity, and term for Crusoe and hosted-payload customers.
    relatedQuestionRefs:
    - QU023
  - type: missing-source
    severity: minor
    topic: complaint-gap
    missingEvidence: Independent customer reviews, failed pilots, or complaint data.
    whyItMatters: The current public record could be biased toward partner announcements.
    diligencePath: Search procurement records, mission-postmortem commentary, and customer references.
    relatedQuestionRefs:
