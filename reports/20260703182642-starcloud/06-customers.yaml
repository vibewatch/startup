chapter:
  number: 6
  title: Customers
  summary: Starcloud’s public customer story is credible but narrow. The clearest proof consists of the Crusoe partnership, a Capella Space imagery workload example, and management’s claim of hosted payload demand from Department of Defense and Earth observation customers for Starcloud-2. Those signals show real interest, but they do not yet amount to a diversified, retention-visible production customer base.
sections:
- id: segments-and-jobs
  title: Customer segments and the jobs they hire Starcloud to do
  body: 'Starcloud’s public materials describe two broad user groups: in-space users that need to process large volumes of raw data before downlink, and terrestrial users that may value sovereign cloud or resilient backup services beyond Earth. Those high-level categories can be broken down into more specific customer jobs. Earth-observation and sensing operators are the clearest early fit because they generate data in orbit and have immediate latency and bandwidth pain. Defense or government users form a second segment because resilience and secure local processing matter. Cloud or AI infrastructure partners form a third segment because they can use Starcloud as a future capacity extension rather than as an end application. Finally, sovereign or regulated enterprises are a long-range segment that may care more about independent storage and continuity than about on-orbit inference. This segmentation is directionally strong, but still mostly based on product positioning and partner announcements
    rather than on a disclosed customer book. That distinction should keep diligence focused on evidence rather than on addressable-market storytelling.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU018
  - CU022
  - CU023
  - CU024
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof-and-adoption-surface
  title: Named customer proof, adoption surface, and reference quality
  body: The named proof that does exist is meaningful. Crusoe is the strongest public reference because it publicly committed to deploy Crusoe Cloud on a Starcloud satellite and to offer limited GPU capacity from space by early 2027. CNBC’s Capella Space example is also valuable because it ties Starcloud to a concrete imagery-processing workflow instead of a generic future promise. SpaceNews adds another useful signal by saying hosted payload demand from Department of Defense and Earth observation customers could cover Starcloud-2 development cost. But that evidence remains narrow and uneven. Some references are partner-authored, some are media-reported management claims, and some customers are not publicly named at all. The chapter therefore has enough proof to say the company is engaging real workloads, but not enough proof to say it has already built a diversified production customer base.
  claimRefs:
  - CU004
  - CU005
