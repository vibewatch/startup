- id: retention-concentration-and-expansion
  title: Retention visibility, concentration risk, and expansion path
  body: 'The biggest limitation in Starcloud’s customer story is not absence of interest; it is absence of durability data. No reviewed source disclosed customer count, retention, renewal, contract duration, or customer satisfaction. That means every positive signal has to be discounted for concentration risk. The public narrative is dominated by one named cloud partner, one named workload example, and a handful of unnamed demand references. This is exactly what early-stage infrastructure often looks like, but it matters for underwriting. On the positive side, the expansion path is coherent: EO inference or hosted payload work can turn into recurring orbital cloud capacity, and Crusoe can help bridge the software gap for future workloads. On the negative side, the same structure implies partner dependence and procurement friction, especially in defense or sovereign segments that will demand higher trust and more compliance evidence before scaling.'
  claimRefs:
