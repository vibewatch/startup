- id: customer-verdict-and-diligence-asks
  title: Customer verdict and diligence asks
  body: The customer verdict is “proof of interest, not proof of scale.” That is a better outcome than pure speculation, but it is still a long way from the kind of evidence an investor would need to underwrite a billion-dollar valuation confidently. The positive case is that Starcloud has a named partner, a named workload example, a coherent expansion path, and enough public demand clues to justify further diligence. The negative case is that all of the standard durability metrics are missing. The fastest way to improve the customer chapter would be to disclose account counts by segment, contract stage, annual value, and retention behavior; to add more named production references; and to clarify the share of demand that is partner-mediated versus direct. Until then, Starcloud’s customer evidence should be treated as early traction, not as a scaled customer franchise. The current record is strong enough to keep researching, but not strong enough to assume durable customer scale.
