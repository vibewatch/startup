  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: verified revenue
    missingEvidence: Verified 2025 or 2026 revenue, ARR, or contract-to-revenue bridge.
    whyItMatters: Without revenue quality, the current valuation cannot be benchmarked to fundamentals.
    diligencePath: Request audited or board-level monthly revenue bridge.
    relatedQuestionRefs:
    - QI021
  - type: private-evidence-only
    severity: material
    topic: burn and runway
    missingEvidence: Current burn rate and runway months after the Series A.
    whyItMatters: Capital adequacy is the core financial diligence issue for a hardware-heavy business.
    diligencePath: Request operating plan, burn trajectory, and minimum cash policy.
    relatedQuestionRefs:
    - QI022
  - type: private-evidence-only
    severity: material
    topic: gross margin
    missingEvidence: Mission-level or service-level gross margin disclosure.
    whyItMatters: A growth thesis without unit economics can hide structurally uneconomic deployments.
    diligencePath: Request costed P&L for Starcloud-1 and Starcloud-2 scenarios.
    relatedQuestionRefs:
    - QI023
  - type: private-evidence-only
    severity: material
    topic: backlog conversion
    missingEvidence: LOI and partnership conversion into signed recurring revenue.
    whyItMatters: Public demand signals are not enough to underwrite forward revenue.
    diligencePath: Request signed contract pipeline and booked-capacity rollforward.
    relatedQuestionRefs:
    - QI024
  - type: private-evidence-only
    severity: minor
    topic: debt and obligations
    missingEvidence: Debt, project finance, or vendor financing obligations.
    whyItMatters: Off-balance-sheet obligations can materially change dilution and solvency risk.
    diligencePath: Request full financing schedule and covenant package.
    relatedQuestionRefs:
    - QI025
