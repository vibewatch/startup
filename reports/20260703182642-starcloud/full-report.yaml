            body: >-
              The risk picture is not hopeless. Starcloud has mitigants: a real in-orbit proof mission, an active hiring
              effort, outside ecosystem support, and at least one meaningful commercial partner. Those matter because
              they differentiate the company from pure speculation. Still, none of them neutralizes the core sequence
              risk in front of the business. For underwriting purposes, the right posture is to watch for a small set of
              external signals that can rapidly change the case. Positive signals would include a clearer regulatory
              workplan, a successful Starcloud-2 deployment on time, broader named customer proof, and public evidence
              of reliability or trust controls. Negative signals would include FCC pushback, a schedule slip that
              materially extends the proof gap, or continued inability to document a diversified customer base. That is
              why the risk verdict is “high residual risk with real technical promise.” The company is not obviously
              broken; it is simply at the stage where the wrong miss in the next 12 to 18 months can rerate the entire
