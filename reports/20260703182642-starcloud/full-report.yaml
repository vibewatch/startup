      - number: '4.2'
        title: Cost structure, unit economics, and what remains missing
        blocks:
          - type: paragraph
            body: >-
              The public record makes Starcloud look much more like a hardware-and-infrastructure program than like a
              software company. Cost drivers include launch, power generation, cooling hardware, shielding, GPUs,
              manufacturing, and facilities. The March 2026 SpaceNews coverage and the careers page both reinforce that
              interpretation: Starcloud is staffing thermal, mechanical, facilities, and power functions while planning
              a dedicated Woodinville facility. The white paper provides additional engineering color, including
              cost-balance tables and assumptions around shielding and power, but these remain internal estimates rather
              than audited economics. That means the unit-economics bridge is still missing its most important values:
              gross margin, contribution margin, utilization, and cost recovery by mission. Management’s statement that
              Starcloud-2 should more than cover its own cost through hosted payloads is directionally encouraging, but
              until contract structure and mission-level P&L are disclosed, investors cannot distinguish between
              promising workload density and fully de-risked economics.
