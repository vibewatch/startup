      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fast capital formation followed a real hardware milestone
            body: >-
              Starcloud’s public story is stronger than a typical pre-revenue moonshot because launch and in-orbit
              workload evidence preceded the March 2026 unicorn round. The gap is not whether the team can ship a demo;
              it is whether demos convert into recurring, disclosure-grade commercial metrics.
            calloutType: insight
