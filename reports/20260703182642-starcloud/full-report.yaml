      - number: '3.3'
        title: Switching costs, distribution power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              No reviewed source shows the peer set competing on transparent list pricing, which means the more durable
              competitive variables are trust, partner access, and workflow fit. Axiom’s moat is institutional
              credibility and standards posture. Kepler’s moat is existing optical-relay infrastructure and disclosed
              customer traction. Aethero’s moat is modularity and speed for lower-power edge compute. Lonestar’s moat is
              resilience positioning. Starcloud’s moat claims are different: first-H100 flight heritage, a founder team
              that spans spacecraft and hyperscale compute, and the willingness to optimize for a much larger future
              compute envelope. Those are meaningful claims, but they are not absolute lock-in. Buyers can multi-home
              across relay, edge processing, and ground cloud; large cloud or defense users may also internal-build once
              the category is validated. The competitive question is therefore whether Starcloud can turn first-mover
              technical data into contracts before better-capitalized or more institutionally trusted players catch up.
            claimRefs:
              - CP017
              - CP018
              - CP019
              - CP020
              - CP021
