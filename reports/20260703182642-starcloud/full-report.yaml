  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The current price is paying for future proof, not disclosed present economics
        blocks:
          - type: paragraph
            body: >-
              The starting point is simple: Starcloud was reported at about a $1.1 billion valuation in its March 2026
              Series A, but public materials do not disclose the revenue, gross margin, or customer-quality data that
              would normally help an investor decide whether that price is disciplined. That does not mean the valuation
              is irrational. It means the valuation is primarily paying for optionality. Investors are buying a future
              path in which orbital compute becomes strategically important, Starcloud remains technically ahead enough
              to matter, and later missions prove that the business can scale economically. The company has earned the
              right to be taken seriously because Starcloud-1 was a genuine proof point. But the public record still
              looks like a milestone story more than a financial model. That is why the present decision must be
              price-sensitive. The company can be exciting and still be too hard to underwrite at the current mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
              - CV021
              - CV024
              - CV026
              - CV027
          - type: table
            tableRef: TV001
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV040
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV017
              - CV021
              - CV025
              - CV026
              - CV027
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV021
              - CV024
              - CV040
      - number: '8.2'
        title: Comparable analysis should mix AI infrastructure, data-center economics, and milestone comps
        blocks:
          - type: paragraph
            body: >-
              No direct comparable fits Starcloud cleanly, so the comp set must be deliberately mixed. CoreWeave is
              useful because it shows how public markets can reward AI-native cloud infrastructure once customer proof,
              product breadth, and disclosure are already present. Crusoe is useful because it shows that private
              capital will fund capex-heavy AI infrastructure at large scale when the platform and customer story are
              more developed. Digital Realty and Equinix are useful in a different way: not because their multiples
              transfer, but because their filings show what durable infrastructure economics look like in
              practice—recurring revenue, customer diversification, uptime, and contractual visibility. Adjacent
              space-infrastructure programs such as Axiom and Lonestar are then helpful as milestone references. They
              remind investors that orbital data infrastructure can be real without yet being commercially mature. This
              mixed comp set leads to one conclusion: Starcloud should be valued through scenarios and milestones, not
              by pretending a single peer multiple solves the problem.
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
