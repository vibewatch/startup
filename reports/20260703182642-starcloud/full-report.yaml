chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product thesis, and current roadmap
        blocks:
          - type: paragraph
            body: >-
              Starcloud’s public materials define the company in unusually concrete terms for such an early-stage
              startup: it says it is building data centers in space to support the future of AI. The homepage and white
              paper frame the core thesis around three constraints Starcloud believes terrestrial infrastructure cannot
              solve quickly enough—electricity availability, cooling, and permitting. The company argues that orbital
              infrastructure can use continuous solar energy, passive radiative cooling, and a modular architecture that
              is unconstrained by terrestrial land use and local approvals. That is still a company-claimed thesis
              rather than a proven commercial outcome, but the message is consistent across the homepage, white paper,
              and later March 2026 press coverage. The hardware roadmap is also unusually visible. Public pages describe
              a completed Starcloud-1 demonstration, a Starcloud-2 commercial mission intended to be fully operational
              by 2027, and a Starcloud-3 spacecraft intended to move the business from kilogram-scale demos toward
              data-center economics. The same public roadmap now extends beyond one demonstration satellite and into
              manufacturing, facility buildout, and a long-range constellation filing, which is why the identity chapter
              matters as the ground truth for every later chapter.
