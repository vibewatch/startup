              - CV029
              - CV030
              - CV039
          - type: table
            tableRef: TV006
            claimRefs:
              - CV031
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Starcloud may deserve attention without yet deserving the current price
            body: >-
              The company has enough technical proof to stay on the diligence list, but not enough economic disclosure
              to turn a reported $1.1B mark into a comfortable underwriting decision.
            calloutType: insight
            claimRefs:
              - CV001
              - CV003
              - CV021
              - CV024
              - CV026
          - type: callout
            title: The main downside is not that the vision is false; it is that the valuation outruns disclosed fundamentals
            body: >-
              If milestones slip before customer economics and reliability evidence improve, the company can remain
              interesting while the investment case still weakens materially.
            calloutType: risk
            claimRefs:
              - CV019
