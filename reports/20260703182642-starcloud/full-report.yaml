  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk are the first thesis gates
        blocks:
          - type: paragraph
            body: >-
              The clearest top risk is regulatory. Starcloud is not pursuing an ordinary satellite filing or a familiar
              cloud-computing permit. It is trying to establish a new operating category: distributed orbital data
              centers at constellation scale. The FCC accepted the filing for up to 88,000 satellites, but acceptance is
              not approval, and the public notice makes clear that waivers are part of the path. Secure World
              Foundation’s comments matter because they are not generic skepticism; they argue that the filing is
              precedent-setting and should be handled through a phased, demonstration-based approach rather than through
              immediate full-scale authorization. Greenberg Traurig’s legal analysis reinforces the same point from
              another angle: the legal framework is still evolving, so novelty itself is a risk. This means regulatory
              timing is not a background issue. It is the first gate through which nearly every commercial assumption
              must pass. The chapter therefore ranks regulatory delay, waiver complexity, and jurisdiction ambiguity
              ahead of most other risks because those factors can slow revenue timing before any technical weakness is
              visible in the field.
            claimRefs:
