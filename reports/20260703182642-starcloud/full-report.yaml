  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The correct market boundary for Starcloud is not “all data centers” and not even “all space
              infrastructure.” The more defensible boundary is orbital compute infrastructure: platforms that process,
              store, or relay data in orbit closely enough to change the workflow relative to downlink-first ground
              processing. That definition includes Starcloud’s own spacecraft roadmap, Axiom’s orbital data center
              nodes, Kepler’s optical-relay-plus-compute fabric, and adjacent off-Earth storage efforts such as
              Lonestar. It excludes ordinary terrestrial colocation, generic hyperscale cloud, and pure satellite
              imaging software that does not move compute into orbit. This distinction matters because the status quo
              substitute is already strong. AWS and related ground-cloud workflows can ingest and process satellite data
              within minutes after downlink, which means orbital compute must win on latency, bandwidth efficiency,
              resilience, sovereignty, or future energy economics—not on novelty alone. Starcloud’s own public
              positioning helps clarify the boundary: it markets infrastructure for compute in space, not a vertical
              application. That makes the company part of a new infrastructure layer rather than part of the
              end-application market built on top of that layer.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM014
              - CM027
              - CM029
              - CM030
