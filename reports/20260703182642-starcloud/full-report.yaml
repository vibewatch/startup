            body: >-
              Starcloud’s technical ambition is part of the attraction and part of the risk. The company has already
              done something real with Starcloud-1, which lowers technology risk versus pure concept-stage teams. But it
              has not yet shown that one mission can become an industrial platform. The white paper makes thermal
              control, radiative cooling, solar power, and tight systems integration central to the architecture. Those
              are not superficial design choices; they are the foundation of the business case. If those systems perform
              below plan in longer missions, the economic thesis weakens quickly. The same is true for launch and
              mission operations. Starcloud-2 and the heavier Starcloud-3 concept compress multiple difficult
              transitions into a short period, while public sources still do not disclose uptime, MTBF, or long-duration
              telemetry. Public trust and compliance disclosure is also thin. For sovereign, defense, and enterprise
              buyers, a missing trust surface is not a cosmetic issue—it is part of operational readiness. The result is
              a risk profile closer to an aerospace manufacturing program than to a typical software startup.
