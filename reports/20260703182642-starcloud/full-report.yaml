  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitive set around Starcloud should be split into at least three layers. The direct peer layer
              contains companies that are explicitly building compute or storage infrastructure in orbit: Axiom, Kepler,
              Aethero, and Lonestar all qualify, even though their architectures differ. The adjacent layer contains
              optical-relay and space-network players such as Space Compass or software-layer partnerships such as
              Sophia-on-Kepler, where compute rides another operator’s infrastructure. The substitute layer contains
              terrestrial and hybrid workflows—AWS Ground Station and conventional cloud processing—that may satisfy the
              same customer job without any orbital cloud dependency. That structure matters because buyers do not
              choose between identical products. A defense or sovereign customer may compare Starcloud against Axiom
              more directly, an edge-processing customer may compare it against Kepler or Aethero, and a resilience
              buyer may compare it against Lonestar or a terrestrial backup design. Starcloud therefore competes as much
              on architectural framing and future roadmap credibility as on current feature parity. This is not a
              winner-take-all market yet; the buyer can assemble alternatives from multiple layers.
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP012
              - CP031
              - CP032
              - CP033
