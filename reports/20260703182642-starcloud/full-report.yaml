      - number: '4.3'
        title: Capital adequacy, financing dependency, and peer context
        blocks:
          - type: paragraph
            body: >-
              The March 2026 Series A clearly bought Starcloud time, but public evidence does not show how much. The
              $170 million raise at a $1.1 billion valuation is large by deep-tech startup standards and was explicitly
              tied to Starcloud-3, R&D, and production-line setup. Yet there is no disclosed cash balance, runway,
              monthly burn, or next-round trigger. That matters because the roadmap is financing-heavy by design.
              Hardware scale-up, constellation development, heavy-lift launch dependency, and sovereign/cloud
              credibility all require capital before they reliably produce recurring revenue. Public AI-infrastructure
              comparables illustrate the general point. Crusoe’s Series E and CoreWeave’s public listing show that
              energy-first AI infrastructure businesses can attract large capital bases, but only alongside meaningfully
              larger operating footprints and customer disclosure than Starcloud currently offers. Digital Realty and
              Equinix provide the other benchmark: mature data-center operators live under audited reporting regimes
              that are still far away from Starcloud’s current disclosure level.
