  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and the jobs they hire Starcloud to do
        blocks:
          - type: paragraph
            body: >-
              Starcloud’s public materials describe two broad user groups: in-space users that need to process large
              volumes of raw data before downlink, and terrestrial users that may value sovereign cloud or resilient
              backup services beyond Earth. Those high-level categories can be broken down into more specific customer
              jobs. Earth-observation and sensing operators are the clearest early fit because they generate data in
              orbit and have immediate latency and bandwidth pain. Defense or government users form a second segment
              because resilience and secure local processing matter. Cloud or AI infrastructure partners form a third
              segment because they can use Starcloud as a future capacity extension rather than as an end application.
              Finally, sovereign or regulated enterprises are a long-range segment that may care more about independent
              storage and continuity than about on-orbit inference. This segmentation is directionally strong, but still
              mostly based on product positioning and partner announcements rather than on a disclosed customer book.
              That distinction should keep diligence focused on evidence rather than on addressable-market storytelling.
