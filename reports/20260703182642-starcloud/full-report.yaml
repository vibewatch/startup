      - number: '3.4'
        title: Competitive verdict and what would change the view
        blocks:
          - type: paragraph
            body: >-
              The public record supports a nuanced verdict. Starcloud does not look like an undifferentiated copycat:
              its H100 milestone and explicit training-scale thesis clearly stand apart. But it also does not yet look
              like the undisputed leader. Kepler and Axiom appear better de-risked on current operational proof, while
              Aethero and Lonestar show that narrower, modular, or resilience-first architectures can find buyers
              without betting on Starship-era economics. Big Tech entry risk remains material, and much of the segment
              is converging on NVIDIA-based edge platforms. The practical implication is that Starcloud’s competitive
              advantage still depends on time. If Starcloud-2 turns public partnerships and LOIs into real recurring
              workloads before the field catches up, the differentiation thesis strengthens materially. If not, the
              company risks becoming one more ambitious name in a category where trust, channels, and execution cadence
              matter more than the elegance of the long-range architecture. That time-sensitive race is the single most
              important competitive lens for the next refresh.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
              - CP035
