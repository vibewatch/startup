        - Counsel memo, waiver tracker, phased-approval strategy
        - This is the main timing gate on value realization
        - Request from counsel / CEO
      - - Financing structure
        - Cap table, liquidation preferences, and future capital plan
        - Needed to test dilution and downside at the current price
        - Request from CFO / legal
    notes: These are the minimum diligence asks required before moving from track to an active underwriting posture.
    claimRefs:
      - CV031
      - CV040
