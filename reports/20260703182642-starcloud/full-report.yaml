companyProfile:
  summary: >-
    Starcloud is a Redmond, Washington-based orbital data-center company led by Philip Johnston, Ezra Feilden, and Adi
    Oltean. The company is building a staged roadmap from Starcloud-1, which publicly flew an NVIDIA H100 and ran AI
    workloads in orbit, toward Starcloud-2 commercial payload capacity and a much larger Starcloud-3 infrastructure
    concept. Starcloud's commercial pitch is to provide in-space compute, storage, and later cloud-style capacity for
    Earth-observation, sovereign, defense, and AI-infrastructure workloads. Public March 2026 coverage confirmed a $170
    million Series A at a $1.1 billion valuation led by Benchmark and EQT, but public disclosure remains thin on
    revenue, customer breadth, reliability, and financing structure.
