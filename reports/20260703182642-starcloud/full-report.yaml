      - number: '2.2'
        title: Evidence-constrained sizing lenses and demand drivers
        blocks:
          - type: paragraph
            body: >-
              No reviewed source provided a clean TAM/SAM/SOM stack that isolates orbital compute from the broader AI or
              space-infrastructure markets, so the only defensible sizing method is to use constrained lenses. The
              strongest driver lens is terrestrial scarcity: Scientific American, summarizing IEA analysis, said
              data-center electricity demand is expected to more than double by 2030, while Starcloud’s white paper
              argued that power, cooling water, and permitting increasingly block gigawatt-scale AI buildouts. A second
              lens is workload pain: multiple sources say Earth-observation, RF/SAR processing, and other edge workloads
              create raw-data volumes and latency pressures that make in-orbit compute attractive before giant training
              clusters are practical. A third lens is deployment evidence: Starcloud, Axiom, Kepler, Lonestar, and
              Aethero all have launched or active hardware claims, which is far more concrete than a market built purely
              from white papers. The category therefore has real demand signals, but not a public financial envelope
              that would justify precise TAM arithmetic. The right interpretation is “supply-constrained opportunity
              with immature revenue disclosure,” not “proven hyperscale market.”
