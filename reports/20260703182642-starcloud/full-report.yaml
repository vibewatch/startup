      - number: '5.3'
        title: Maturity, dependencies, and operational readiness
        blocks:
          - type: paragraph
            body: >-
              The maturity profile is mixed. Starcloud is clearly beyond slideware because Starcloud-1 flew and executed
              workloads. But the product is not yet mature in the way a commercial infrastructure buyer would normally
              define maturity. There is no public uptime record, no published MTBF, no disclosed long-duration radiation
              test data, and no public customer-facing developer or integration surface. The company’s own hiring and
              facilities signals show that it is working on the right problems—thermal systems, power, software, GNC,
              manufacturing—but those are signals of work in progress, not proof that the work is solved. Dependencies
              are also unusually concentrated. Starcloud depends on NVIDIA hardware, SpaceX launch access, optical-relay
              or networking ecosystems, and future cloud or payload partners. Public partner material from Kepler,
              Aethero, and AWS reinforces that the surrounding ecosystem is evolving quickly, which can help Starcloud
              but also raise the bar for interoperability and buyer expectations. The result is a platform that is
              technically plausible but still operationally fragile at this stage.
