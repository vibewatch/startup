            claimRefs:
              - CV001
              - CV017
              - CV018
              - CV019
              - CV020
              - CV024
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV035
              - CV036
              - CV037
      - number: '8.4'
        title: 'Final call: track the company, but do not underwrite the current mark yet'
        blocks:
          - type: paragraph
            body: >-
              The final call is track / research-more with medium confidence and a very high risk rating. That is not a
              dismissal of Starcloud’s technical ambition. It is a recognition that the evidence bundle needed to
              support a billion-dollar infrastructure valuation is still incomplete in public sources. The investment
              thesis is real enough to keep working on because the company sits in a powerful AI-compute tailwind and
              has already crossed one unusually hard technical milestone. The anti-thesis is stronger at the current
              price because commercialization, reliability, regulatory timing, and capital structure remain too opaque.
              The fastest way for Starcloud to improve its investability would be to disclose customer economics,
              reliability data, and a clearer regulatory workplan. The fastest way for the case to deteriorate would be
              to miss visible milestones while keeping the same premium price expectations. Until those gaps close, the
              right posture is disciplined curiosity rather than aggressive underwriting. Investors should want evidence
              density to rise faster than valuation expectations from here.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV028
              - CV031
              - CV038
              - CV040
