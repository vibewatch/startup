  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing surfaces, and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Starcloud’s public sources do point to a real revenue model, but only at the architecture level.
              Management and partner materials imply at least three monetization paths: selling hosted orbital compute
              to spacecraft and payload operators, running future cloud workloads through partners like Crusoe, and
              eventually leasing or selling infrastructure capacity more like a space-based data center operator. The
              problem is not absence of ideas; it is absence of realized economics. No reviewed public source disclosed
              revenue, ARR, signed annual contract value, or gross bookings. Pricing is also mostly opaque. The few
              public numbers are not contract prices but aspirational economics: a management quote about reaching
              roughly five cents per kilowatt-hour under favorable launch-cost assumptions and a white-paper estimate of
              far lower equivalent energy costs under engineering assumptions. Those figures are useful for scenario
              framing, but they are not proof of price realization or margin. The only hard commercial signals are LOIs,
              one named cloud partner, and management claims about hosted-payload demand.
