  topStrengths:
    - Starcloud-1 给公司提供了有分量的技术证明：一颗 H100 级 GPU 已在轨运行，并执行了 AI 工作负载。
    - 公司踩在可信的长期 AI 基础设施顺风里，也提出了差异化的轨道计算逻辑。
    - Benchmark 与 EQT 领投了大额 Series A，说明成熟投资人对这个机会有真实兴趣。
    - 从 Starcloud-2 到 Starcloud-4 的路线图，对早期深科技公司来说少见地具体，后续有清晰里程碑可跟踪。
    - 早期商业信号已经出现，包括 Crusoe、托管载荷需求，以及具体 EO 风格工作负载案例。
  topRisks:
    - FCC 路径新、豁免要求重，也暴露在反向评论下，监管节奏因此成为第一道重大逻辑关口。
    - 技术与运营风险仍高；一次成功任务还不能证明星座级可靠性、信任控制或长周期表现。
    - 公开客户和财务披露仍稀疏，投资逻辑目前更依赖选择权，而不是可持续经济性。
    - 业务资本开支很重；在公开证据足以支撑成熟基础设施式承销前，公司可能还要继续融资。
    - 合作伙伴、供应商与发射依赖仍集中，商业化渠道和先进算力硬件尤其如此。
  unresolvedGaps:
    - 按细分市场披露的客户数、合同金额、续约与集中度数据。
    - 当前和规划硬件的任务遥测、在线率、鉴定结果与可靠性证据。
    - 支撑星座愿景的详细监管工作计划、豁免策略与可能获批路径。
