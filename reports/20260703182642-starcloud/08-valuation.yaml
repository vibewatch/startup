    severity: material
    topic: mission-gap
    missingEvidence: Mission-reliability data and Starcloud-2 operating milestones.
    whyItMatters: The scenario framework turns on whether technical proof becomes a repeatable commercial platform.
    diligencePath: Request telemetry, qualification reports, and Starcloud-2 milestone tracker.
