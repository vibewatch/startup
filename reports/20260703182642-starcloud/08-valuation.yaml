- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Regulatory path deteriorates
    - Waiver strategy stalls or phased approvals do not progress
    - Delays commercialization and weakens option value
    - Move from track to pass until path resets
  - - Starcloud-2 milestone slips
    - Commercial mission timing moves materially out
    - Pushes customer proof and financing needs outward
    - Re-cut scenarios and assume dilution risk
  - - Customer proof does not broaden
    - No additional named production-like accounts emerge
    - Concentration and revenue-quality concerns rise
    - Reduce conviction in bull and base cases
  - - Trust / reliability package remains absent
    - No meaningful operating evidence appears before scaled selling
    - Enterprise ramp assumptions become harder to defend
    - Treat valuation premium as unsupported
  notes: These triggers translate high-level uncertainty into monitorable investment-control points.
