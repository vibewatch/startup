- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - CoreWeave
    - Public AI cloud platform
    - Publicly listed since March 2025
    - Closest scaled AI-cloud proof point
    - Already far more mature, terrestrial, and disclosed than Starcloud
  - - Crusoe
    - Private AI infrastructure company
    - Series E at over $10B valuation in October 2025
    - Shows investor appetite for capex-heavy AI infrastructure
    - Earth-based business with much broader operating proof
  - - Digital Realty
    - Public data-center REIT
    - 5,000+ customers with annualized recurring revenue disclosure
    - Useful benchmark for durable infrastructure economics
    - Not an early deep-tech or orbital compute company
  - - Equinix
    - Public interconnection and colocation operator
    - 10,500+ customers, >90% recurring revenue, 99.9999%+ uptime
    - Best benchmark for reliability and recurring-revenue quality
    - Mature operating model makes direct valuation transfer inappropriate
  - - Axiom orbital data center efforts
    - Adjacent orbital infrastructure program
    - Strategic milestone reference, not disclosed standalone valuation
    - Shows serious strategic interest in orbital data infrastructure
    - No clean standalone economic data for valuation
  - - Lonestar lunar data infrastructure
    - Early space-data milestone reference
    - Raised $6.6M and achieved technical milestones
    - Useful downside check on how early adjacent programs still are
    - Too small and different to anchor valuation directly
  notes: The comparable set is intentionally mixed because no single public company cleanly matches Starcloud’s stage and business model.
