- id: scenario-framework-and-entry-discipline
  title: Bull, base, and bear cases all hinge on milestone sequencing
  body: 'The bull case is conceptually straightforward but operationally hard. Starcloud needs regulatory progress, a successful Starcloud-2 commercial mission, broader named customer proof, and early evidence that recurring orbital economics exist. If those things land in sequence, today’s valuation could look like a strategic foothold in a new infrastructure layer. The base case is less dramatic. In that path, the company remains strategically interesting and continues to attract attention, but valuation support stays mostly milestone-based because the economics remain under-disclosed. The bear case is also easy to describe: regulation slows, mission timing slips, or customer proof stays thin while investor enthusiasm for speculative infrastructure compresses. In other words, the valuation debate is less about a spreadsheet and more about milestone sequencing. That is why scenario analysis is the only defensible public-market-style approach at this stage.'
