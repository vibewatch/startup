  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics-gap
    missingEvidence: Revenue, gross margin, customer concentration, and renewal data.
    whyItMatters: These are the minimum inputs needed to test whether the current valuation is supportable.
    diligencePath: Request audited or management financial package plus customer cohort data.
    relatedQuestionRefs:
    - QV003
    - QV024
    - QV025
    - QV026
  - type: private-evidence-only
    severity: material
    topic: capital-structure-gap
    missingEvidence: Cap table, preference stack, and future capital plan.
    whyItMatters: Dilution and downside are impossible to model cleanly without financing structure details.
    diligencePath: Request cap table, financing docs, and forward capital plan.
    relatedQuestionRefs:
    - QV020
    - QV026
    - QV030
