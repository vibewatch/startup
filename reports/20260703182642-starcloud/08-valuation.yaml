- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Customer economics
    - Customer count, ACV, term, renewal, and concentration
    - Without this, revenue quality cannot be underwritten
    - Request from CEO / CFO
  - - Mission reliability
    - Telemetry, uptime, failure logs, and qualification results
    - Without this, technical risk remains mostly narrative
    - Request from CTO / engineering
  - - Regulatory workplan
    - Counsel memo, waiver tracker, phased-approval strategy
    - This is the main timing gate on value realization
    - Request from counsel / CEO
  - - Financing structure
    - Cap table, liquidation preferences, and future capital plan
    - Needed to test dilution and downside at the current price
    - Request from CFO / legal
  notes: These are the minimum diligence asks required before moving from track to an active underwriting posture.
