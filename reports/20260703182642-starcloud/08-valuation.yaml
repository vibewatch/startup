company:
  name: Starcloud
chapter:
  number: 8
  title: Valuation
  summary: Starcloud is interesting enough to keep on the worklist, but not disclosed enough to underwrite at a reported $1.1 billion valuation. The company has one real technical milestone, sits inside a credible AI-infrastructure tailwind, and could become a category-creation asset if Starcloud-2 and regulation go well. But the current public price looks ahead of disclosed fundamentals, so the right stance is track / research-more with very high risk.
sections:
- id: price-context-and-what-the-market-is-paying-for
  title: The current price is paying for future proof, not disclosed present economics
  body: 'The starting point is simple: Starcloud was reported at about a $1.1 billion valuation in its March 2026 Series A, but public materials do not disclose the revenue, gross margin, or customer-quality data that would normally help an investor decide whether that price is disciplined. That does not mean the valuation is irrational. It means the valuation is primarily paying for optionality. Investors are buying a future path in which orbital compute becomes strategically important, Starcloud remains technically ahead enough to matter, and later missions prove that the business can scale economically. The company has earned the right to be taken seriously because Starcloud-1 was a genuine proof point. But the public record still looks like a milestone story more than a financial model. That is why the present decision must be price-sensitive. The company can be exciting and still be too hard to underwrite at the current mark.'
  claimRefs:
