- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Starcloud has real technical novelty and one meaningful in-orbit proof point
    - Additional recurring-demand proof would strengthen the thesis materially
  - - AI-compute demand growth supports long-run category creation
    - Macro demand alone is insufficient without customer conversion and economics
  - - Orbital compute could create a new infrastructure layer with scarce strategic value
    - If regulation or mission execution slips, scarcity becomes optionality without monetization
  - - Public valuation already assumes premium future execution
    - A lower price or higher disclosure could make the risk-reward more investable
  notes: The anti-thesis is not that Starcloud is impossible; it is that the current valuation outruns disclosed fundamentals.
