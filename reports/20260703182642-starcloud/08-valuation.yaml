- id: how-to-think-about-comparables
  title: Comparable analysis should mix AI infrastructure, data-center economics, and milestone comps
  body: 'No direct comparable fits Starcloud cleanly, so the comp set must be deliberately mixed. CoreWeave is useful because it shows how public markets can reward AI-native cloud infrastructure once customer proof, product breadth, and disclosure are already present. Crusoe is useful because it shows that private capital will fund capex-heavy AI infrastructure at large scale when the platform and customer story are more developed. Digital Realty and Equinix are useful in a different way: not because their multiples transfer, but because their filings show what durable infrastructure economics look like in practice—recurring revenue, customer diversification, uptime, and contractual visibility. Adjacent space-infrastructure programs such as Axiom and Lonestar are then helpful as milestone references. They remind investors that orbital data infrastructure can be real without yet being commercially mature. This mixed comp set leads to one conclusion: Starcloud should be valued through scenarios
    and milestones, not by pretending a single peer multiple solves the problem.'
