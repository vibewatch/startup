- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Regulatory progress, successful Starcloud-2, broader named customers, early recurring economics
    - Valuation expands because Starcloud begins to look like a category leader rather than a concept
    - Execution still difficult but improving
    - Requires multiple hard milestones landing in sequence
  - - Base
    - Company preserves strategic interest but still lacks full economic disclosure
    - Valuation support remains milestone-based and roughly holds only if progress continues
    - Disclosure gap keeps buyers cautious
    - Most plausible if milestones are mixed but directionally positive
  - - Bear
    - Regulatory delay, mission slip, or no customer-breadth improvement
    - Valuation rerates because optionality weakens faster than proof improves
    - Dilution and multiple-compression risk rise
    - Triggered by visible delays or failed commercialization handoffs
  notes: The scenario table is qualitative because public evidence does not support a precise DCF or revenue-multiple model yet.
