evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue disclosure
    missingEvidence: Verified 2025 or 2026 revenue, ARR, or signed-bookings conversion data.
    whyItMatters: Without revenue quality data, the Series A price cannot be benchmarked against any realized commercial base.
    diligencePath: Request board deck or data-room revenue bridge plus signed-contract conversion evidence.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: customer count
    missingEvidence: Named active customer count, deployment status, and contract profile.
    whyItMatters: Commercial maturity and concentration cannot be underwritten from one public partnership alone.
    diligencePath: Request customer list with pilot/production flags and annual contract value bands.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: Total employee headcount and function mix.
    whyItMatters: Hiring velocity is only a proxy for execution capacity and burn.
    diligencePath: Request current org chart and headcount by engineering, operations, and go-to-market.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: board governance
    missingEvidence: Full board roster, observer rights, and voting control terms.
    whyItMatters: Governance concentration and investor protections affect future financing flexibility.
    diligencePath: Request charter documents and current board / observer list.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: founding date
    missingEvidence: Primary incorporation record or definitive company statement resolving 2023 vs 2024 origins.
    whyItMatters: The age-of-company narrative is used in investor signaling and should be precise.
    diligencePath: Pull state incorporation filings or signed cap-table history from counsel.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: >-
      A public market estimate that isolates orbital compute from broader space infrastructure or generic AI
      infrastructure.
    whyItMatters: Without a bounded TAM, valuation arguments can become circular and hype-driven.
    diligencePath: Build a bottoms-up model from named workload classes, likely contracts, and launch cadence.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: >-
      A Starcloud-specific near-term serviceable market estimate based on workloads it can deliver before Starship-scale
      economics.
    whyItMatters: The company’s long-range vision can obscure what it can sell in the next two to three years.
    diligencePath: Model the Starcloud-2 and Starcloud-3 addressable workload set by power, orbit, and link constraints.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: minor
    topic: pricing-gap
    missingEvidence: Public willingness-to-pay data for sovereign cloud or hosted in-orbit compute workloads.
    whyItMatters: Demand interest does not directly translate into contract pricing or margin support.
    diligencePath: Request LOIs or pilot contracts with list price, committed usage, and duration.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: minor
    topic: sales-cycle-gap
    missingEvidence: Documented procurement-cycle length for defense, EO, or enterprise orbital-compute contracts.
    whyItMatters: Go-to-market timing affects cash burn and the plausibility of near-term revenue.
    diligencePath: Request sales pipeline stages and median days from first meeting to signed pilot or production contract.
    relatedQuestionRefs:
      - QM024
  - type: stale
    severity: material
    topic: adoption-gap
    missingEvidence: A credible 2030-or-earlier estimate of what fraction of AI demand can be shifted into orbit.
    whyItMatters: Category narratives currently over-index on aspiration relative to workload portability.
    diligencePath: Benchmark likely orbital workloads against terrestrial alternatives by latency, bandwidth, and energy economics.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: peer-revenue-gap
    missingEvidence: Recurring revenue and gross-margin disclosures for Starcloud and the core peer set.
    whyItMatters: Without economics, competitive durability is being inferred from architecture and announcements alone.
    diligencePath: Request peer revenue estimates and Starcloud management benchmark deck.
    relatedQuestionRefs:
      - QP021
  - type: private-evidence-only
    severity: minor
    topic: peer-retention-gap
    missingEvidence: Public retention or renewal data across orbital-compute peers.
    whyItMatters: Customer proof without renewal or expansion data may overstate durability.
    diligencePath: Ask management for replacement-rate and renewal benchmarks by peer class.
    relatedQuestionRefs:
      - QP022
  - type: missing-source
    severity: minor
    topic: starcloud-2-gpu-gap
    missingEvidence: Installed GPU count and exact hardware mix for Starcloud-2.
    whyItMatters: The competitive comparison changes meaningfully if Starcloud-2 is a small hosted node versus a sizable cluster.
    diligencePath: Request system architecture sheet for Starcloud-2.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: minor
    topic: trust-gap
    missingEvidence: Complete security, compliance, and quality-control stack for Starcloud.
    whyItMatters: Trust posture is a key differentiator in sovereign and defense workflows.
    diligencePath: Request trust-center, certification, and secure-ops documentation.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: minor
    topic: contract-lockin-gap
    missingEvidence: Contract length, minimum commits, and exclusivity terms for Starcloud customers or launch partners.
    whyItMatters: Lock-in and switching-cost analysis remains qualitative without contract structure.
    diligencePath: Review pilot and launch-partner agreements in diligence.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: verified revenue
    missingEvidence: Verified 2025 or 2026 revenue, ARR, or contract-to-revenue bridge.
    whyItMatters: Without revenue quality, the current valuation cannot be benchmarked to fundamentals.
    diligencePath: Request audited or board-level monthly revenue bridge.
    relatedQuestionRefs:
      - QI021
  - type: private-evidence-only
    severity: material
    topic: burn and runway
    missingEvidence: Current burn rate and runway months after the Series A.
    whyItMatters: Capital adequacy is the core financial diligence issue for a hardware-heavy business.
    diligencePath: Request operating plan, burn trajectory, and minimum cash policy.
    relatedQuestionRefs:
      - QI022
  - type: private-evidence-only
    severity: material
