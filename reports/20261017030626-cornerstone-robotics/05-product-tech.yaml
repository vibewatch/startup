    claimRefs: [CE001, CE002, CE003, CE006, CE007, CE009, CE010, CE015]
callouts:
  - calloutType: strength
    title: Full-stack control is the clearest supported differentiator
    body: >-
      Company and partner disclosures consistently describe Sentire as developed
      in-house across hardware, software, algorithms, imaging, energy, and
      manufacturing, which is more concrete than vague "AI robotics" marketing.
    claimRefs: [CE003, CE004, CE005]
  - calloutType: insight
    title: Product readiness is stronger than public utilization proof
    body: >-
      Regulatory approvals, pilot data, and training infrastructure indicate a
      real clinical product, but public materials still under-disclose installed
      base, ongoing usage density, and service performance after go-live.
    claimRefs: [CE001, CE007, CE008, CE009, CE013]
  - calloutType: risk
    title: Market expansion still depends on unproven external surfaces
    body: >-
      The Medtronic partnership improves distribution reach, but public evidence
      still does not establish a U.S. pathway, cyber/privacy posture, or hard
      price-performance proof for buyers.
    claimRefs: [CE010, CE011, CE014]
