schemaVersion: report-v2
artifact: product-tech
slug: cornerstone-robotics
runDate: 2026-10-17
company:
  name: Cornerstone Robotics
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Cornerstone Robotics has brought the Sentire minimally invasive surgical
    system, with public evidence showing regulatory clearance in China, the
    European Union, and Singapore plus ongoing clinical-validation and
    distribution work. The strongest support is for full-stack in-house
    development, vertical integration, and clinical/regulatory momentum; the
    weakest areas are public proof of cybersecurity, uptime/service performance,
    U.S. regulatory pathway, and realized cost advantage.
sections:
  - id: delivered-system-and-maturity
    title: Delivered system and current maturity
    body: >-
      Sentire is presented as Cornerstone Robotics' endoscopic robotic-assisted
      surgery platform for minimally invasive procedures rather than a broad
      hospital software stack or general-purpose robot. Across company, partner,
      and independent coverage, the publicly supported maturity story is
      concrete: the platform is already approved in China, the European Union,
      and Singapore for general, gynecologic, thoracic, and urologic
      procedures, while external materials also reference pilot and registration
      case volume. That means the company is no longer at prototype stage, but
      the public record still says more about approvals and trials than about
      scaled hospital utilization, field uptime, or economic outcomes after
      deployment.
    claimRefs: [CE001, CE007, CE011, CE012]
    tableRefs: [TE001]
  - id: architecture-and-operating-model
    title: Architecture and operating model
    body: >-
      Cornerstone's core technical narrative is vertical integration. Company
      and partner disclosures consistently describe Sentire as developed
      in-house across hardware, control software, advanced algorithms, imaging,
      and energy systems, with manufacturing concentrated in a large China
      facility and engineering distributed across three R&D hubs. Product-level
      feature disclosures point to an immersive surgeon console, dual-console
      training capability, real-time feedback, anti-fog visibility, and an
      integrated cold light source. Taken together, that suggests a tightly
      controlled product stack aimed at performance consistency and supply-chain
      resilience, though it does not yet provide the deep technical artifact set
      a buyer would need for full independent validation.
    claimRefs: [CE002, CE003, CE004, CE005, CE006]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-training-and-scale-up
    title: Deployment, training, and scale-up path
    body: >-
      Deployment readiness appears to depend on a three-part model: regulatory
      approvals, surgeon training infrastructure, and channel leverage through
      partners. Independent and secondary sources describe a 55-patient pilot
      study, further prospective evaluation work, a UK clinical-evaluation
      footprint with Portsmouth Hospitals University NHS Trust, and a global
      surgeon-training program with CUHK Medical School. The 2026 Medtronic
      partnership extends that model commercially by giving Medtronic rights to
      distribute Sentire in select approved ex-U.S. markets. This improves
      route-to-market credibility, but it also means scale-up still depends on
      approved geographies, reference sites, and partner execution rather than
      on publicly demonstrated standalone demand density.
    claimRefs: [CE007, CE008, CE009, CE010, CE013]
    tableRefs: [TE002]
  - id: differentiation-and-unresolved-technical-risk
    title: Differentiation and unresolved technical risk
    body: >-
      The supported differentiation case is narrower than the marketing story.
      Third-party descriptions do support claims that Sentire is intended to be
      more accessible or lower cost than the historical single-platform market,
      and the approvals plus in-house stack give that positioning some
      credibility. However, the assigned evidence does not publish list price,
      per-procedure economics, hospital ROI, cybersecurity architecture, data
      governance controls, uptime metrics, or a U.S. regulatory pathway. The
      result is a product that looks clinically and technically credible, but
      still requires deeper diligence on security, service reliability, and the
      economics behind its accessibility thesis.
    claimRefs: [CE001, CE003, CE010, CE011, CE014]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset / product line
      - Buyer / user
      - Status / maturity
      - Supported differentiation
      - Diligence gap
    rows:
      - - Sentire endoscopic surgical system
        - Hospitals and minimally invasive surgeons
        - Approved in China, the EU, and Singapore; used across multiple soft-tissue specialties
        - Multi-market approval footprint and multispecialty clinical use claims
        - Public deployment count, utilization, and repeat-purchase data are undisclosed
      - - Surgeon console and dual-console setup
        - Lead surgeon and trainer / mentor
        - Publicly described architecture; positioned for varying surgeon preferences and clinical needs
        - Dual-console capability broadens the disclosed console configuration
        - No public use-case breakdown, workflow telemetry, setup-time benchmarks, or usability comparisons
      - - In-house control, imaging, and energy stack
        - Engineering, clinical, and quality teams
        - Claimed in production platform today
        - Vertical integration across hardware, software, algorithms, imaging, and energy
        - No public technical datasheet or subsystem-level specification pack
      - - Manufacturing and supply-chain base
        - Operations and quality teams
        - Publicly described as operating at 30,000 square meters in China
        - Internal control over integration, quality, and supply resilience
        - Supplier concentration, component sourcing, and yields are not disclosed
    notes: >-
      Compiled from official, partner, and independent public sources; maturity
      reflects disclosed approvals, trials, and operating claims rather than
      audited deployment metrics.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Cornerstone solution
      - Measurable benefit
      - Limitation
    rows:
      - - Introduce robotic MIS capability in new hospitals or regions
        - Hospitals evaluate a historically dominant platform that the study description associates with high cost
        - Sentire is positioned as a more accessible robotic platform with approved-market distribution support
        - Public sources consistently frame market access and affordability as the value proposition
        - No public price list, TCO model, or hospital ROI evidence
      - - Perform minimally invasive soft-tissue procedures
        - Surgeons need precise robotic control across general, gynecologic, thoracic, and urologic cases
        - Sentire provides an endoscopic robotic-assisted platform already approved for those specialties in named markets
        - Multi-market approvals and 55-patient pilot evidence support procedure breadth
        - Public sources do not quantify conversion from trial success to routine utilization
      - - Train new robotic surgeons and proctors
        - Adoption requires supervised learning and reference-site support
        - Dual-console architecture, UK evaluation activity, and a CUHK-linked training program support onboarding
        - Public sources describe both training infrastructure and real-world evaluation sites
        - No public graduation, utilization, or retention metrics for trained surgeons
      - - Expand into approved ex-U.S. markets
        - Commercial scale normally requires distributors and local regulatory clearance
        - Medtronic can distribute Sentire in select approved markets outside the U.S.
        - The partner already gives Sentire a named route-to-market in approved geographies
        - The public record does not establish U.S. clearance timing or direct-sales traction without Medtronic
    notes: >-
      Benefits reflect explicitly disclosed approvals, study descriptions, and
      partner positioning; blank economics or adoption metrics remain diligence
      asks rather than implied performance.
    claimRefs: [CE001, CE002, CE007, CE008, CE009, CE010, CE013, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Control software and advanced algorithms
        - Translate surgeon input into stable robotic motion with real-time feedback
        - Cornerstone's in-house engineering stack
        - No public benchmark package, failure-rate data, or independent performance testing
      - - Mechanical architecture and robotic arms
        - Execute minimally invasive motions in confined anatomy
        - Internal hardware design plus manufacturing execution
        - Public materials describe the system only at a high level, not through detailed specifications
      - - Imaging, visibility, and energy platform
        - Provide visualization and procedural support during surgery
        - Integrated cold light source, anti-fog visibility, and proprietary imaging / energy modules
        - No public optical-performance, latency, or consumables disclosures
      - - Manufacturing and vertical integration
        - Control integration quality and supply-chain resilience
        - 30,000-square-meter China facility and company-controlled subsystem development
        - Supplier concentration, yields, and service-parts readiness are undisclosed
      - - Clinical validation, training, and distribution layer
        - Convert technical capability into usable market footprint
        - Clinical studies, surgeon training, approved-market regulatory clearances, and Medtronic distribution
        - Adoption still depends on approvals, partner execution, and reference-site performance
    notes: >-
      This architecture table combines explicit technical disclosures with the
      operating layers needed to deploy the product; it is not a substitute for
      a confidential design-history file or hospital IT diligence pack.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE010]
