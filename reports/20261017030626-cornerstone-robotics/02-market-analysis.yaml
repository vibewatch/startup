  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: >-
        Independent market sizing or company data for eligible procedure volume, hospital counts,
        system placements, ASP, utilization, service revenue, and reimbursement by geography
      whyItMatters: >-
        Without consistent denominators and unit economics, a monetary TAM/SAM/SOM would be
        speculative and cannot anchor valuation or market-share assumptions.
      diligencePath: >-
        Request the board market model and reconcile its hospital, procedure, conversion, price, and
        utilization assumptions to regulatory approvals and audited commercial data.
      relatedQuestionRefs:
        - QM002
        - QM008
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: adoption-economics
      missingEvidence: >-
        Customer-level procurement cycle, total cost of ownership, training cost, service levels,
        utilization, clinical outcomes, and return on investment
      whyItMatters: >-
        These measures determine which approved hospitals can economically adopt Sentire and how
        quickly regulatory access converts into recurring demand.
      diligencePath: >-
        Review anonymized tenders, contracts, implementation plans, utilization cohorts, service
        records, and customer ROI studies across China, Europe, and Singapore.
      relatedQuestionRefs:
        - QM008
      relatedTableRefs:
        - TM003
    - type: missing-source
      severity: material
      topic: distribution-scope
      missingEvidence: >-
        Exact countries, launch sequencing, service obligations, economics, and performance targets
        covered by the Medtronic distribution agreement
      whyItMatters: >-
        The agreement is the strongest current channel signal, but select approved markets is too
        vague to determine the actual serviceable geography or timing.
      diligencePath: >-
        Inspect the executed distribution agreement and country launch plan, then reconcile covered
        markets to approvals, local reimbursement, service capacity, and sales forecasts.
      relatedQuestionRefs:
        - QM006
