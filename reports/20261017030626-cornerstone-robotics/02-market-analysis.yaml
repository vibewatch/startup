figures:
  - id: FM001
    title: Evidence-constrained serviceable-market filters
    type: pyramid
    summary: >-
      The supportable opportunity narrows through six evidence filters before it becomes a
      commercially reachable market for Sentire.
    data:
      items:
        - label: Minimally invasive surgery demand
          displayValue: Not quantified
          detail: Broad demand context; not all procedures are suitable for robotic assistance
        - label: Robotic-assisted surgery opportunity
          displayValue: Company says adoption is in single digits
          detail: Directional headroom without an independent denominator
        - label: Sentire-approved procedure scope
          displayValue: Four disclosed specialty groups
          detail: General, gynecologic, thoracic, and urologic procedures
        - label: Current approved geography
          displayValue: China, EU, Singapore
          detail: Publicly documented market approvals as of the run date
        - label: Economically adoptable hospitals
          displayValue: Not quantified
          detail: Requires capital, clinical evidence, training, service, and interoperability fit
        - label: Reachable Medtronic channel wedge
          displayValue: Select approved non-U.S. markets
          detail: Exact countries, launch sequence, placements, and economics remain undisclosed
    approximationNotes: >-
      Layer order represents successive scope filters, not value-proportional widths; missing
      monetary values are not estimated from the investment amount or adoption claim.
    claimRefs:
      - CM003
      - CM005
      - CM006
      - CM014
      - CM016
callouts:
  - calloutType: insight
    title: Channel evidence is stronger than market-size evidence
    body: >-
      Medtronic's investment and distribution rights validate strategic interest in the category,
      but they do not disclose Cornerstone's system demand, revenue, market share, or cash position.
    claimRefs:
      - CM003
      - CM004
      - CM013
      - CM014
  - calloutType: risk
    title: Public SOM remains unquantified
    body: >-
      A bottom-up SOM requires approved-market hospital counts, eligible procedures, pricing,
      placement conversion, utilization, service revenue, and margin data that are absent from the
      assigned evidence.
    claimRefs:
      - CM006
      - CM014
      - CM016
