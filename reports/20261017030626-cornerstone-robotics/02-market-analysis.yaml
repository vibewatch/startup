        - Surgeons requiring training
        - New capital program
        - Building capability from training through first procedures
        - Not disclosed
        - Affordable total cost, training capacity, and reference evidence
      - - Academic and training institutions
        - Program or institution leadership
        - Surgeons, trainees, and proctors
        - Education or partnership budget
        - Surgeon training and clinical familiarization
        - Not disclosed
        - Access to systems and repeatable training workflows
      - - Medtronic-covered non-U.S. accounts
        - Hospitals reached through local Medtronic teams
