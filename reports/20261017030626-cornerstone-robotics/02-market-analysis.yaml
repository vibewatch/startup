        - Surgeons and operating-room teams
        - Hospital capital and operating budgets
        - Launching a robotic soft-tissue surgery program
        - Not disclosed; likely multi-stakeholder
        - Approval, clinical evidence, training, service, and capital fit
      - - Existing robotic-surgery hospitals
        - Service-line and hospital leadership
        - Experienced robotic surgeons
        - Hospital replacement or expansion budget
        - Adding or replacing a platform
        - Capital committee and surgical leadership
        - Portfolio choice, workflow fit, support, and switching economics
      - - Hospitals new to robotic surgery
