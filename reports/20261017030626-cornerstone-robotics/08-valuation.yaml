    "number": 8,
    "title": "Valuation",
    "summary": "Cornerstone Robotics has real strategic and financing momentum: FierceBiotech reported about $200 million of 2026 financing, and the company announced an approximately US$700 million Medtronic investment plus select-market distribution rights outside the U.S. But the assigned public evidence still does not disclose revenue, installed-base, gross margin, post-money valuation, or preference terms, so the prudent call remains research-more with high risk and valuation unknown."
  },
  "sections": [
    {
      "id": "recommendation-and-price-discipline",
      "title": "Recommendation and price discipline",
      "body": "The clearest positive signal in the assigned pool is strategic validation. FierceBiotech reported fresh 2026 financing, while Cornerstone and Medtrade describe a September 2026 Medtronic transaction that brings approximately US$700 million of strategic capital and ex-U.S. distribution rights in select approved markets. Those facts matter because they can widen channel reach and accelerate commercialization. They do not, however, reveal revenue, gross margin, installed-base scale, current post-money valuation, or liquidation preferences. That missing price context is decisive: public evidence supports continued diligence, not a conviction buy or a precise entry multiple.",
      "claimRefs": ["CV001", "CV002", "CV003", "CV010", "CV011"],
      "tableRefs": ["TV001"],
      "figureRefs": ["FV001"]
    },
    {
      "id": "thesis-versus-antithesis",
      "title": "Thesis versus anti-thesis",
      "body": "The investable upside case is understandable. Company-controlled and third-party sources consistently describe an in-house platform, regulatory progress across China, the EU, and Singapore, and clinical/training relationships that could support a differentiated APAC and Europe commercialization path. The anti-thesis is just as important: independent and company-issued sources still show an early market where robotic-surgery penetration remains low, approvals stay regional, and public commercial disclosure is thin. Even recent hospital-use announcements and U.K. trial activity look more like proof of motion than proof of durable scale economics.",
      "claimRefs": ["CV004", "CV005", "CV006", "CV007", "CV008", "CV009", "CV012", "CV013"],
      "tableRefs": ["TV002"]
    },
    {
      "id": "scenarios-exit-readiness-and-diligence",
      "title": "Scenarios, exit readiness, and diligence asks",
      "body": "The right way to frame valuation today is through conditional scenarios rather than false precision. A bull case needs evidence that the Medtronic partnership turns approvals into repeat placements, recurring procedure economics, and broader market coverage. The base case is that Cornerstone keeps progressing while public disclosure remains incomplete, leaving the company financeable but not cleanly priceable from outside evidence. The bear case is that commercialization stays narrower than the strategic headline implies while competition remains crowded and the next round absorbs more downside protection than common-equity buyers expect. Exit readiness is therefore incomplete until management opens the operating and capital-structure data room. Until then, downside protection and entry discipline matter more than narrative momentum because the public record still shows strategic intent more clearly than durable operating leverage.",
      "claimRefs": ["CV001", "CV007", "CV008", "CV009", "CV010", "CV011", "CV012", "CV013"],
      "tableRefs": ["TV003"]
    }
  ],
