callouts:
  - calloutType: "strength"
    title: "Institutional proof now spans more than one market"
    body: >-
      Retained sources now point to named adoption surfaces in Hong Kong,
      Singapore, Taiwan, and CUHK-linked clinical settings rather than only a
      generic commercialization claim.
    claimRefs: ["CU005", "CU007", "CU008", "CU009", "CU010"]
  - calloutType: "risk"
    title: "Durability remains largely unproven in public"
    body: >-
      None of the retained sources disclose placements by cohort, renewals,
      NRR/GRR, contract terms, or revenue concentration, so public customer proof
      still cannot be translated into durable commercial economics.
    claimRefs: ["CU011", "CU012"]
  - calloutType: "insight"
    title: "Medtronic is both the biggest accelerant and the clearest concentration risk"
    body: >-
      The Medtronic deal is Cornerstone's most credible scale channel, but it
      also means outside observers still cannot tell how much eventual demand will
      come from direct hospital selling versus one strategic partner.
    claimRefs: ["CU002", "CU003", "CU014"]
