company:
  name: "Cornerstone Robotics"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Cornerstone Robotics now has visible institutional adoption proof across Hong
    Kong, Singapore, Taiwan, and CUHK-linked clinical settings, plus a major
    Medtronic channel partnership that could accelerate approved-market access.
    But the public record still leans on training programs, pilot evidence, and
    first-use announcements rather than installed-base counts, renewals, or
    customer concentration disclosure.
sections:
  - id: "visible-customer-segments"
    title: "Visible customer segments are institutional, surgeon-led, and still high-touch"
    body: >-
      The public evidence shows three main adoption surfaces for Sentire: hospital
      systems and surgical departments that would ultimately buy and deploy the
      robot, academic or clinical-validation institutions that generate evidence
      and surgeon familiarity, and channel partners that can widen access once a
      market is approved. Cornerstone's own product materials speak most clearly
      to the end user rather than the economic buyer, emphasizing smoother control,
      precision, reliability, and confidence for surgeons performing minimally
      invasive procedures. What remains opaque is who pays, on what contract
      structure, and whether current deployments are purchased systems, evaluations,
      or partner-supported programs, so segmentation is still stronger on user and
      access surface than on disclosed revenue mix.
    claimRefs: ["CU001", "CU003", "CU009", "CU013"]
    tableRefs: ["TU001"]
  - id: "named-adoption-proof"
    title: "Named adoption proof now spans hospitals, training networks, and channel expansion"
    body: >-
      Customer proof is more concrete than a logo page, but it is still early in
      the commercialization curve. AsiaBizToday reported a first Singapore
      installation at Woodlands Hospital under NHG for training, workflow
      adaptation, and system evaluation. Cornerstone's LinkedIn page adds very
      fresh company-controlled proof of clinical use at Hong Kong Baptist Hospital
      plus a five-console IRCAD-Taiwan training network built for dual-console and
      remote mentoring. Medbot and a Veeva trial entry extend the picture back to
      CUHK and Prince of Wales Hospital clinical-validation work. Together, these
      sources show real institutional touchpoints across geographies, but many are
      still training, pilot, or first-use milestones rather than recurring
      production fleets.
    claimRefs: ["CU004", "CU005", "CU006", "CU007", "CU008", "CU009", "CU010"]
    tableRefs: ["TU002", "TU003"]
    figureRefs: ["FU001"]
  - id: "durability-expansion-and-concentration"
    title: "The Medtronic partnership is the clearest expansion lever, but durability evidence remains thin"
    body: >-
      The most economically meaningful commercial signal in the retained evidence
      is the Medtronic partnership: both sides describe an approximately US$700
      million investment plus distribution rights for Sentire in approved markets
      outside the U.S., turning Medtronic into Cornerstone's clearest route to
      broader hospital reach. That matters because Medtronic says global
      robot-assisted surgery adoption remains in the single digits, so hospitals
      still need enablement, training, and service confidence before broad rollout.
      The same partnership also creates concentration risk, because the public
      record does not break out direct versus partner-led orders, installed-base
      counts, renewals, or top-account exposure. Independent coverage also notes
      that specific hospital deployment sites are not broadly disclosed, reinforcing
      that public durability data lags the regulatory and partnership momentum.
    claimRefs: ["CU002", "CU003", "CU011", "CU012", "CU013", "CU014"]
