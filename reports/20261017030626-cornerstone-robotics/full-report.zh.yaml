      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              可投资的上行情形不难理解。公司控制的来源和第三方来源都将其描述为内部开发的平台，已在中国、欧盟和新加坡取得监管进展，并拥有可能支撑亚太和欧洲差异化商业化路径的临床及培训关系。反论点同样重要：独立来源和公司来源仍显示这是一个早期市场，机器人手术渗透率仍低、批准仍是区域性的，公开商业披露也很薄。即使近期医院使用公告和英国试验活动，也更像是证明业务在推进，而不是证明具备持久的规模经济。
            claimRefs:
              - CV004
