              - CI003
              - CI004
              - CI005
              - CI008
              - CI013
              - CI016
      - number: '4.2'
        title: 商业进展和成本结构主要通过运营代理指标体现
        blocks:
          - type: paragraph
            body: >-
              最强的公开进展信号是监管里程碑、医院启动、培训部署和独立装机记录，而不是已报告收入。截至 2026 年 10 月，DEPLOY
              列出一个型号、一个地区内两次经验证的部署，说明平台已进入现场，但相对于公司的战略目标，这仍只是有限的装机数据点。LinkedIn
