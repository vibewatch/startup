        - Medtronic 渠道权转化为经过验证的多市场部署、经常性手术收入，并进一步披露装机量和利润率。
        - 只有这样，才有理由认为估值应高于此前的私募价格；当前公开来源池没有披露为该溢价定价所需的基准。
        - 执行滞后、监管扩张延迟，以及规模化导致的利润率稀释。
        - 如果 Cornerstone 披露部署量、使用量和交易后的商业指标，情景会改善。
      - - 基准
        - 获批和合作伙伴关系继续扩展，但公开披露仍以战略信息为主，经济性信息有限。
        - 公司仍具备融资能力和战略吸引力，但外部投资者应继续保持“继续研究”立场，并要求以更完整披露为基础审慎入场。
        - 资本密集度、医院放量延迟和优先权悬置仍不透明。
        - 与当前证据集最为吻合。
      - - 悲观
        - 商业化范围仍小于宣传所暗示的水平，竞争拥挤且市场渗透率低，压缩议价能力。
        - 在没有收入证明或清晰条款的情况下，新资本可能以持平甚至下行的经济条件进入，或附带削弱普通股上行空间的保护条款。
        - 部署缓慢、已获批市场采用有限，以及下一轮融资中的下行条款。
        - 如果 Medtronic 公告后披露仍然稀薄，或市场进入仍局限于少数地区，该情景会增强。
    notes: 这些是有条件的投资判断情景，不是预测结果；由于缺少公开估值输入，表格采用情景逻辑，而不是编造数字价格目标。
