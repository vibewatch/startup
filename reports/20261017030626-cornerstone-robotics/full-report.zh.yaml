              协议明确限于美国以外、系统已经获批的部分市场，而现有公开来源没有披露美国监管路径或时间表。因此，近期最重要的法律或监管担忧不是本池中有记录的执法行动，而是扩张上限：如果管理层无法展示超出现有披露司法辖区的可信逐国批准计划，大额战略估值所隐含的商业上行空间可能跑在产品公开批准覆盖之前。第二个警示是披露质量。公开来源对制造覆盖规模存在分歧，这一点很重要，因为监管机构、分销商和医院最终评估的是制造可靠性、服务能力和上市后质量纪律，而不只是醒目的批准信息。
