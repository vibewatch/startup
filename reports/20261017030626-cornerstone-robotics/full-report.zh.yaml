companyProfile:
  summary: >-
    Cornerstone Robotics 是一家总部位于香港的手术机器人公司，正在打造微创手术平台 Sentire。公开证据支持其于 2019 年成立，并已在中国、欧盟和新加坡获得批准；公司还在 2026 年 9 月宣布与
    Medtronic 达成战略投资和分销安排。公司似乎将直接装机、培训、售后支持和合作伙伴主导的市场进入结合起来，但收入、估值、现金、装机基数和控制权仍基本不透明。
