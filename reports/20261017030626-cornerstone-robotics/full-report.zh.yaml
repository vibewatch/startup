              亿美元战略资本和部分获批市场的美国以外分销权。这些事实很重要，因为它们可以扩大渠道触达并加快商业化。但它们没有揭示收入、毛利率、装机规模、当前投后估值或清算优先权。缺失的价格背景具有决定性：公开证据支持继续尽调，而不是坚定买入或给出精确入场倍数。
            claimRefs:
