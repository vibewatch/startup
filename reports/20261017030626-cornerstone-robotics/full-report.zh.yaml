chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营覆盖
        blocks:
          - type: paragraph
            body: >-
              Cornerstone Robotics 成立于 2019 年 9 月，总部位于香港。核心产品 Sentire
              是内窥镜机器人辅助手术平台，公司材料称其核心部件、软件、算法、成像和能量技术均为内部开发。公司还称拥有三个全球研发中心、六个业务中心，以及位于中国、面积 30,000
              平方米的制造设施。这些说法足以支撑其作为产品公司的可信身份和较大的运营覆盖，但主要仍来自公司自身。现有证据没有提供经审计的制造产能、产品成本、装机系统数量或完整的逐地运营名单，因此不能仅凭厂房面积推断规模。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
      - number: '1.2'
        title: 监管与商业拐点
        blocks:
          - type: paragraph
            body: >-
              Sentire 于 2024 年 9 月获得中国 NMPA 批准，随后于 2026 年 5 月获得欧盟 CE 认证和新加坡 HSA 批准，可用于普通、妇科、胸科和泌尿科手术。2026 年 9
              月，Cornerstone 和 PR Newswire 刊载公司公告称，Medtronic 将进行约 7
              亿美元战略投资，并获得美国以外部分已获批准市场的分销权。公告使用将来时很关键：现有来源支持的是已宣布的投资和渠道协议，而不是 Cornerstone
              已经拿到现金或交易已经交割。官网还保留着宽泛的、仅限演示用途的监管免责声明，说明产品可用性仍取决于具体司法辖区和产品，而非全球通用。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.3'
        title: 融资阶段与封面指标
        blocks:
          - type: paragraph
            body: >-
              融资证据较多，但无法完全勾稽。Cornerstone 的历史记录显示，2021 年完成超过 7,500 万美元的 B 轮融资，2023 年完成超过 9,000 万美元的 B+ 轮融资，2025 年 1 月完成超过
              7,000 万美元的 C 轮融资，2025 年 11 月又完成约 2 亿美元融资。另据 Tracxn，Cornerstone 四轮共募资 4.59 亿美元，并将公司标为 D
              轮阶段。由于来源口径不同，且未披露交割状态或可勾稽的融资桥接，这些数字不应与已宣布的 Medtronic 投资相加。Tracxn 报告的 63
              名员工可作为规模指标，但收入、毛利率、客户数、装机、估值和可用现金仍无证据支持。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO013
      - number: '1.4'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Cornerstone 2026 年 9 月的公告称 Kwok Wai Samuel Au 教授为创始人兼 CEO，Medbot 也独立将创始归于他，并描述其在 CUHK 和 Intuitive Surgical
              的手术机器人经历。Tracxn 则称 Zerui Wang
              为创始人或联合创始人，形成尚未解决的归属冲突，不能据此建立可靠的第二位高管画像。现有证据没有列出董事会或独立董事，没有说明高管职能分工，也没有披露主要融资轮附带的权利。因此，从公开信息看，公司似乎由创始人主导，但实际控制权、继任深度，以及产品、监管、制造和商业化职责是否分布在一支稳定的管理团队中，均无法确定。
            claimRefs:
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO014
              - CO015
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 头条融资额不是商业化指标
            body: 现有证据支持大额融资公告和多项监管批准，但没有披露收入、手术量、医院装机、毛利率，或已宣布的 Medtronic 交易实际收到的现金。估值时应将这些数量分开处理。
            calloutType: risk
            claimRefs:
              - CO006
              - CO008
              - CO013
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻接领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的市场边界比全球医疗机器人更窄。Sentire 是用于微创软组织手术的内窥镜手术系统，已披露的获批范围涵盖普通、妇科、胸科和泌尿科手术。当前监管覆盖中国、欧盟和新加坡；Medtronic
              的权利仅限于系统已获批准的部分非美国市场。因此，纳入范围是开展这些获批手术所需的医院资本设备、器械、培训和服务。美国、未获支持的专科、康复机器人，以及所有微创手术都会转为机器人辅助手术的假设均排除在外。现状替代方案包括传统微创手术，以及继续使用
              Medtronic Hugo 等现有机器人平台。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有来源没有提供可信货币化 TAM/SAM/SOM 所需的分母。Cornerstone 称全球机器人辅助手术渗透率仍为个位数，但 TechNode 正确指出，公告没有为这一数字提供引用的市场来源。约 7 亿美元的
              Medtronic 投资是强烈的战略信号，不是终端市场收入或 Cornerstone
              可用现金，也不能换算成手术需求。因此，稳妥的规模测算应先从获批地域出发，缩小到明确专科，再缩小到能够承担采购、培训、服务和流程变更成本的医院。公开价格、装机、手术量、报销、利用率和服务经济性仍缺失，因此 SOM
              应明确标为未量化，而不是从宽泛的品类预测中推算。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM014
              - CM016
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              实际买方是医院或医疗系统，外科医生和手术室团队是用户。TechNode
              直接列出决策标准：资本成本、临床证据、医生培训、服务支持和互操作性。销售会涉及外科负责人、采购、财务、临床治理和培训团队等多方；现有来源没有指出一个普遍适用的预算负责人。采用从市场批准和专科覆盖开始，经由试用和医生培训推进，并要求具备装机和支持能力。Cornerstone
              2024 年的培训项目及 Medtronic 的分销权覆盖了其中部分环节，但都不能证明购买转化、系统利用率或可复制的医院 ROI。
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM011
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              主要驱动因素是更广泛的多专科批准、全球医疗科技分销渠道，以及 Cornerstone 称可加强集成、质量和供应韧性的垂直整合产品策略。已报告的开发证据包括超过 250
              例临床病例；公司还称拥有三个研发中心、六个业务中心和一座 30,000 平方米的制造设施。约束同样重要：逐国监管、资本审批、培训、服务准备度、现有装机基数，以及未披露的经济性。欧洲和东南亚是合理的扩张走廊，但
              Medtronic 覆盖的具体国家并未公开。因此，估值可以计入监管和渠道的期权价值，但在拿到装机、利用率、价格和利润率证据前，不应计入精确的市场份额、收入规模或商业效率。
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM011
              - CM012
              - CM014
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 渠道证据强于市场规模证据
            body: Medtronic 的投资和分销权验证了其对这一品类的战略兴趣，但没有披露 Cornerstone 的系统需求、收入、市场份额或现金状况。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM013
              - CM014
          - type: callout
            title: 公开 SOM 仍未量化
            body: 自下而上的 SOM 需要获批市场的医院数量、适用手术、价格、装机转化、利用率、服务收入和利润率数据，而现有证据均未提供。
            calloutType: risk
            claimRefs:
              - CM006
              - CM014
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代集合
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的是广泛的替代集合，而非单一的正面对手。Cornerstone 面对组合型现有厂商、传统标杆手术机器人、专科机器人挑战者，以及传统微创手术这一现状方案。2026 年最大的变化是 Medtronic 约
              7 亿美元战略投资及其在美国以外获批市场分销 Sentire 的权利，这使 Cornerstone 从单独的平台故事转向有渠道支持的组合产品。独立数据库和供应商资料还将 Cornerstone
              放在一个拥挤赛道中，竞争者包括 Intuitive、CMR Surgical、Medical Microinstruments 和 PROCEPT
              BioRobotics；公司是在不断扩大的全球市场中竞争，而不是进入一片真空。
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
              - CP013
