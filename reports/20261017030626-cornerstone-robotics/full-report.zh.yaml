      - number: '8.3'
        title: 情景、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              当前估值应采用条件情景，而不是制造虚假的精确度。乐观情景需要证据证明 Medtronic 合作能将批准转化为重复装机、经常性手术经济性和更广泛的市场覆盖。基准情景是 Cornerstone
              继续推进，但公开披露仍不完整，公司可以融资，却无法依据外部证据清晰定价。悲观情景是商业化比战略头条所暗示的更窄，竞争仍然拥挤，而下一轮融资要求的下行保护超过普通股买方预期。因此，在管理层开放运营和资本结构数据室之前，退出准备度并不完整。在此之前，下行保护和入场纪律比叙事动能更重要，因为公开记录对战略意图的展示仍强于对持久运营杠杆的展示。
