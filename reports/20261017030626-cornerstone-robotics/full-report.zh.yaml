          note: 经常性收入组成在商业上可行，但定价和规模仍未披露。
        - id: n6
          label: 毛利
          value: Undisclosed
          unit: margin
          note: 自主研发和制造是正面因素，但保留的来源没有披露毛利率或服务成本数据。
    approximationNotes: 这是机制图，不是量化漏斗；它保留公开顺序，不虚构转化率或利润率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI008
      - CI013
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从外科医生界面到底层运营和商业化层的公开技术栈。
    data:
      layers:
        - label: 临床界面
          detail: 沉浸式手术控制台，已披露支持双控制台。
          modules:
            - 沉浸式控制台
            - 双控制台能力
            - 实时反馈
        - label: 机器人执行
          detail: 用于在微创手术中实现精准运动的内窥镜机器人平台。
          modules:
            - 医生侧机械臂
            - 震颤过滤
            - 运动控制技术
        - label: 可视化层
          detail: 公司材料描述的集成式可视化组件。
          modules:
            - 防雾可视化
            - 集成冷光源
            - 实时视觉支持
        - label: 能源与质量层
          detail: 自有组件和质量控制支持持续运行。
          modules:
            - 专有能源平台
            - 自有核心组件
            - 持续运行质量声明
        - label: 临床验证层
          detail: 试验和研究证据塑造手术信任并支持扩张。
          modules:
            - 55 名患者试点研究
            - 前瞻性评估
            - 英国评估
        - label: 监管与商业层
          detail: 批准和合作伙伴分销决定产品当前能扩展到哪里。
          modules:
            - 中国 / 欧盟 / 新加坡批准
            - Medtronic 获批市场分销
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
      - CE007
      - CE009
      - CE010
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 可见的采用路径从验证和培训节点延伸到医院首次部署，再进入合作伙伴主导的分销扩张。
    data:
      items:
        - label: 临床验证
          detail: CUHK 和 Prince of Wales Hospital 构成早期证据生成的支点。
          touchpoints:
            - Prince of Wales 55 名患者试点
            - 面向更广泛胃肠道和泌尿外科手术的前瞻性评估
        - label: 外科医生培训
          detail: 在广泛披露装机情况之前，Cornerstone 已建立正式培训体系。
          touchpoints:
            - 与 CUHK Medical School 合作的 Global Robotic Surgeon Training Program
            - 培训带来的医院转化尚无公开量化数据
        - label: 远程指导网络
          detail: IRCAD-Taiwan 通过多控制台连接，把采用范围从单一地点扩展出去。
          touchpoints:
            - 一套 Sentire 系统和五个控制台
            - 跨台湾多个城市的双控制台远程连接
        - label: 首家明确披露的东南亚医院
          detail: NHG 旗下的 Woodlands Hospital 是最清晰的新加坡验证点。
          touchpoints:
            - 培训和工作流适配
            - 多家医院团队参与评估
        - label: 最新香港临床使用
          detail: Hong Kong Baptist Hospital 是资料池中最新明确披露的实际使用案例。
          touchpoints:
            - 已完成首例手术
            - 证据仍由公司掌握
        - label: 规模化市场进入
          detail: Medtronic 是从试点走向更大客户覆盖最清晰的公开路径。
          touchpoints:
            - US$700 million 战略投资
            - 美国以外部分市场的分销权
    claimRefs:
      - CU002
      - CU005
      - CU007
      - CU008
      - CU010
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最大的剩余风险不在核心产品是否有效，而在规模化执行：新市场监管进度、稀薄的独立运营数据和合作伙伴集中度仍未得到实质解决。
    data:
      columns:
        - label: 可能性
          note: 基于所引用公开证据的定性判断。
        - label: 影响
          note: 对商业化、投资判断或论点持久性的影响。
        - label: 剩余严重性
          note: 扣除公开来源中当前可见的缓释措施后的净风险。
      rows:
        - label: 新市场监管延误
          note: 已披露中国、欧盟和新加坡的批准，但没有美国路径。
          values:
            - label: 中高
              tone: warning
              note: 现有批准说明公司具备相应能力，但进一步扩张市场仍需要披露具体路径。
            - label: 高
              tone: risk
              note: 延误会限制 TAM 扩张，并拉长商业化时间。
            - label: 高
              tone: critical
              note: 如果管理层无法展示下一优先市场的定日期申报路线图，这将构成否决标准。
        - label: 制造与质量执行集中度
          note: 公开来源指向垂直整合生产，但产能披露并不一致。
          values:
            - label: 中
              tone: warning
              note: 自有控制有助于执行，但也会集中执行风险。
            - label: 高
              tone: risk
              note: 质量或服务故障会直接损害推广可信度。
            - label: 中高
              tone: risk
              note: 在产能、良率和服务数据完成审计前，剩余风险仍处于高位。
        - label: 独立上市后表现数据稀薄
          note: 公开证据更强调上市、培训和产品声明，而不是现场 KPI。
          values:
            - label: 高
              tone: risk
              note: 截至目前，正常运行时间、召回和利用率数据都存在这一缺口。
            - label: 高
              tone: critical
              note: 这削弱了对运营杠杆和服务负担假设的信心。
            - label: 高
              tone: critical
              note: 如果尽调无法取得站点层面的运行时间和使用证据，这将构成否决标准。
        - label: Medtronic 渠道依赖
          note: 这笔战略投资也让一个大型合作伙伴集中负责外部市场分销。
          values:
            - label: 中
              tone: warning
              note: 交易对手质量很强，但执行仍取决于合作伙伴的投入程度和激励。
            - label: 高
              tone: risk
              note: 表现不佳会直接影响全球推广预期。
            - label: 高
              tone: risk
              note: 在明确披露生产地点和复购节奏前，剩余风险仍处于高位。
        - label: 培训驱动的商业化模式
          note: 英国培训课程和 IRCAD-Taiwan 远程培训基础设施有所帮助，但也意味着不小的赋能工作。
          values:
            - label: 中高
              tone: warning
              note: 早期医疗科技采用往往卡在临床带教和支持环节。
            - label: 中高
              tone: warning
              note: 外科医生赋能缓慢会推迟利用率提升和转化。
            - label: 中高
              tone: warning
              note: 只有当培训吞吐量转化为重复部署时，剩余风险才会下降。
        - label: 财务模型不透明
          note: 公开证据显示融资能力强，但看不到收入、利润率或现金消耗。
          values:
            - label: 高
              tone: risk
              note: 缺失的指标是当前尽调缺口，不是理论问题。
            - label: 高
              tone: critical
              note: 没有这些指标，就无法清晰评估估值和下行保护。
            - label: 高
              tone: critical
              note: 如果下一轮尽调仍缺少收入、利润率和股权结构明细，这将构成否决标准。
    approximationNotes: 定性单元格总结所引用的证据和公开信息缺口；该图不代表数值概率或基准化损失率。
    claimRefs:
      - CR002
      - CR003
      - CR008
      - CR010
      - CR011
      - CR012
      - CR013
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 战略势头确实存在，但经济数据和资本结构披露不足，因此推荐仍停留在继续研究。
    data:
      nodes:
        - id: n1
          label: 战略资本
          note: Medtronic 约 US$700 million 的投资，加上美国以外部分市场的分销权。
          tone: positive
        - id: n2
          label: 监管覆盖
          note: 2024 年中国获批，以及 2026 年欧盟和新加坡获批，支持更广泛的市场进入。
          tone: positive
        - id: n3
          label: 商业化基础设施
          note: 2026 年约 $200 million 的融资、英国临床工作和临床培训合作，显示建设仍在推进。
          tone: neutral
        - id: n4
          label: 证据仍然稀薄
          note: 公开来源没有披露收入、毛利率或装机基数规模。
          tone: risk
        - id: n5
          label: 市场拥挤
          note: 机器人手术渗透率仍然较低，Tracxn 列出 265 家活跃竞争者。
          tone: risk
        - id: n6
          label: 推荐
          note: 继续研究；在管理层披露运营和融资细节前，维持高风险判断，估值保持未知。
          tone: risk
      edges:
        - from: n1
          to: n2
          relationship: 支持更广泛的触达
        - from: n2
          to: n3
          relationship: 支撑商业化落地
        - from: n3
          to: n4
          relationship: 但不能证明经济性
        - from: n4
          to: n5
          relationship: 而这在拥挤的品类中更重要
        - from: n5
          to: n6
          relationship: 因此要保持价格纪律
    approximationNotes: 该流程是根据指定来源池整理出的分析逻辑链，不是量化估值模型。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
