      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把 Medtronic 头条当作公开估值锚
            body: Medtronic 交易是有意义的战略验证，但不等于已披露的投后估值或清晰的普通股入场价。在收入、装机、毛利率和融资条款公开之前，外部最稳妥的判断是继续研究，而不是买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV010
              - CV011
          - type: callout
            title: 投资论点失效触发条件
            body: 如果 Medtronic 合作没有转化为可验证的装机或重复手术活动；如果获批市场触达相较预期仍然狭窄；或如果下一轮融资显示优先股堆叠过重、给新普通股投资者留下的上行空间很小，投资论点就应明显弱化。
            calloutType: assumption
            claimRefs:
