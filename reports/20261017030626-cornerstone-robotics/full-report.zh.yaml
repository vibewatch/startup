            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP008
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
              - CP013
      - number: '3.2'
        title: 能力、产品组合与买方比较
        blocks:
          - type: paragraph
            body: >-
              Cornerstone
              最有证据支撑的产品差异化不是价格，而是一组具体的能力和工作流主张：在中国、欧盟和新加坡获得多个软组织专科批准；沉浸式及双控制台工作流；实时反馈；全栈内部开发；以及近期的远程培训和快速对接演示。相比之下，Medtronic
              证据强调 Hugo 及相关数字手术工具的生态广度、渠道触达和服务基础设施。公开价格是比较中最薄弱的一环：现有官方或独立资料均未披露 Sentire
              的标价、实际售价、折扣或合同经济性，因此本章只能比较商业组合和买方影响，不能比较精确 ROI。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP009
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP010
              - CP012
      - number: '3.3'
        title: 转换成本、锁定与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              公开层面最有力的护城河论据是集成控制加新的渠道杠杆，而不是已被证明的装机锁定。Cornerstone 称核心硬件、软件、算法、成像和能量系统均为内部开发；Medtronic
              交易则为其进入获批国际市场提供更快路径。这应有助于医生采用和医院建立信心，但现有证据仍没有披露装机基数、长期耗材绑定或多年服务经济性，无法证明强锁定。因此竞争风险是双向的：Medtronic 可以扩大
              Sentire 的触达，但也在继续建设 Hugo；独立资料仍认为市场足够拥挤，若买方将机器人系统视为越来越可替代，Cornerstone 的差异化可能被压缩。
            claimRefs:
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 分销杠杆改善快于产品广度变化
            body: Medtronic 协议最重要的意义在于，它为 Sentire 增加了渠道触达和生态背景，而不要求 Cornerstone 先证明自己能够独自搭建这套分销体系。
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP012
          - type: callout
            title: 公开护城河证明仍薄于公开产品证明
            body: 现有证据支持监管批准和技术集成主张，但仍未显示公开的定价能力、装机锁定，或针对已点名同行的持久胜负数据。
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式结构清晰，但公开经济性不清晰
        blocks:
          - type: paragraph
            body: >-
              公开证据支持以硬件为主、以 Sentire 手术系统为核心的商业化模式，收入最可能来自首次系统装机、后续手术，以及配套服务、培训和支持。2026 年 9 月的 Medtronic
              交易是最清晰的商业披露：Cornerstone 称 Medtronic 将投资约 7 亿美元，并获得在 Sentire 已获批准的部分非美国市场进行分销的权利。由此，Cornerstone Cornerstone
              可以依托直接医院关系和全球战略伙伴渠道扩张，采用混合模式变现。但支撑投资判断所需的经济核心仍缺失：现有来源没有披露单套系统标价、实际 ASP、维护价格、每例手术耗材收入、收入确认政策或分销商分成。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
              - CI016
