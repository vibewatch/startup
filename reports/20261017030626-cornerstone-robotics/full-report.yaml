              - CE015
      - number: '5.3'
        title: Deployment, training, and scale-up path
        blocks:
          - type: paragraph
            body: >-
              Deployment readiness appears to depend on a three-part model: regulatory approvals, surgeon training
              infrastructure, and channel leverage through partners. Independent and secondary sources describe a
              55-patient pilot study, further prospective evaluation work, a UK clinical-evaluation footprint with
              Portsmouth Hospitals University NHS Trust, and a global surgeon-training program with CUHK Medical School.
              The 2026 Medtronic partnership extends that model commercially by giving Medtronic rights to distribute
              Sentire in select approved ex-U.S. markets. This improves route-to-market credibility, but it also means
              scale-up still depends on approved geographies, reference sites, and partner execution rather than on
              publicly demonstrated standalone demand density.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
      - number: '5.4'
        title: Differentiation and unresolved technical risk
        blocks:
          - type: paragraph
            body: >-
              The supported differentiation case is narrower than the marketing story. Third-party descriptions do
              support claims that Sentire is intended to be more accessible or lower cost than the historical
              single-platform market, and the approvals plus in-house stack give that positioning some credibility.
              However, the assigned evidence does not publish list price, per-procedure economics, hospital ROI,
              cybersecurity architecture, data governance controls, uptime metrics, or a U.S. regulatory pathway. The
              result is a product that looks clinically and technically credible, but still requires deeper diligence on
              security, service reliability, and the economics behind its accessibility thesis.
            claimRefs:
              - CE001
              - CE003
              - CE010
              - CE011
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Full-stack control is the clearest supported differentiator
            body: >-
              Company and partner disclosures consistently describe Sentire as developed in-house across hardware,
              software, algorithms, imaging, energy, and manufacturing, which is more concrete than vague "AI robotics"
              marketing.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE005
          - type: callout
            title: Product readiness is stronger than public utilization proof
            body: >-
              Regulatory approvals, pilot data, and training infrastructure indicate a real clinical product, but public
              materials still under-disclose installed base, ongoing usage density, and service performance after
              go-live.
            calloutType: insight
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE009
              - CE013
          - type: callout
            title: Market expansion still depends on unproven external surfaces
            body: >-
              The Medtronic partnership improves distribution reach, but public evidence still does not establish a U.S.
              pathway, cyber/privacy posture, or hard price-performance proof for buyers.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Visible customer segments are institutional, surgeon-led, and still high-touch
        blocks:
          - type: paragraph
            body: >-
              The public evidence shows three main adoption surfaces for Sentire: hospital systems and surgical
              departments that would ultimately buy and deploy the robot, academic or clinical-validation institutions
              that generate evidence and surgeon familiarity, and channel partners that can widen access once a market
              is approved. Cornerstone's own product materials speak most clearly to the end user rather than the
              economic buyer, emphasizing smoother control, precision, reliability, and confidence for surgeons
              performing minimally invasive procedures. What remains opaque is who pays, on what contract structure, and
              whether current deployments are purchased systems, evaluations, or partner-supported programs, so
              segmentation is still stronger on user and access surface than on disclosed revenue mix.
            claimRefs:
              - CU001
              - CU003
              - CU009
              - CU013
          - type: table
