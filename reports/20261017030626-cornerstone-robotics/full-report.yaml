chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Cornerstone Robotics was founded in September 2019 and is headquartered in Hong Kong. Its core product is
              Sentire, an endoscopic robotic-assisted surgery platform that company materials describe as developed
              in-house, including core components, software, algorithms, imaging, and energy technologies. The company
              also says it has three global R&D hubs, six business centres, and a 30,000-square-meter manufacturing
              facility in China. Those claims establish a credible product-company identity and a meaningful operating
              footprint, but they remain predominantly company-issued. The assigned evidence does not provide audited
              manufacturing capacity, product cost, installed-system counts, or a complete location-by-location
              operating roster, so scale should not be inferred from facility size alone.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
      - number: '1.2'
        title: Regulatory and commercial inflection
        blocks:
          - type: paragraph
            body: >-
              Sentire received China NMPA approval in September 2024, followed by EU CE certification and Singapore HSA
              approval in May 2026 for general, gynecologic, thoracic, and urologic procedures. In September 2026,
              Cornerstone and PR Newswire carried the company's announcement that Medtronic would make an approximately
              US$700 million strategic investment and receive distribution rights in select approved markets outside the
              United States. The future-tense wording matters: the retained sources support an announced investment and
              channel agreement, not cash already available to Cornerstone or a closed transaction. The homepage also
              retains a broad demonstration-only regulatory disclaimer, underscoring that availability remains
              jurisdiction- and product-specific rather than global.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.3'
        title: Financing stage and cover metrics
        blocks:
          - type: paragraph
            body: >-
              Financing evidence is substantial but not fully reconcilable. Cornerstone's history records a Series B of
              more than US$75 million in 2021, a Series B+ of more than US$90 million in 2023, a Series C of more than
              US$70 million in January 2025, and an approximately US$200 million round in November 2025. Separately,
              Tracxn reports US$459 million raised over four rounds and labels the company Series D. These figures
              should not be added to the announced Medtronic investment because the sources use different scopes and do
              not disclose closing status or a reconciled financing bridge. Tracxn's reported 63 employees is a useful
              scale indicator, but revenue, gross margin, customer count, placements, valuation, and cash available
              remain unsupported.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO013
      - number: '1.4'
        title: Leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Cornerstone's September 2026 release identifies Professor Kwok Wai Samuel Au as Founder and CEO, and
              Medbot independently attributes the founding to him while describing prior surgical-robotics experience at
              CUHK and Intuitive Surgical. Tracxn instead names Zerui Wang as founder or co-founder, creating an
              unresolved attribution conflict rather than a reliable second executive profile. The retained evidence
              does not name a board, list independent directors, describe executive functional ownership, or disclose
              rights attached to major financing rounds. The company therefore appears publicly founder-led, but the
              evidence cannot determine actual control, succession depth, or whether product, regulatory, manufacturing,
              and commercialization responsibilities are distributed across a durable management team.
