              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU005
              - CU007
              - CU008
              - CU010
              - CU014
      - number: '6.3'
        title: The Medtronic partnership is the clearest expansion lever, but durability evidence remains thin
        blocks:
          - type: paragraph
            body: >-
              The most economically meaningful commercial signal in the retained evidence is the Medtronic partnership:
              both sides describe an approximately US$700 million investment plus distribution rights for Sentire in
              approved markets outside the U.S., turning Medtronic into Cornerstone's clearest route to broader hospital
              reach. That matters because Medtronic says global robot-assisted surgery adoption remains in the single
              digits, so hospitals still need enablement, training, and service confidence before broad rollout. The
              same partnership also creates concentration risk, because the public record does not break out direct
              versus partner-led orders, installed-base counts, renewals, or top-account exposure. Independent coverage
              also notes that specific hospital deployment sites are not broadly disclosed, reinforcing that public
              durability data lags the regulatory and partnership momentum.
            claimRefs:
              - CU002
              - CU003
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional proof now spans more than one market
            body: >-
              Retained sources now point to named adoption surfaces in Hong Kong, Singapore, Taiwan, and CUHK-linked
              clinical settings rather than only a generic commercialization claim.
            calloutType: strength
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
          - type: callout
            title: Durability remains largely unproven in public
            body: >-
              None of the retained sources disclose placements by cohort, renewals, NRR/GRR, contract terms, or revenue
              concentration, so public customer proof still cannot be translated into durable commercial economics.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
          - type: callout
            title: Medtronic is both the biggest accelerant and the clearest concentration risk
            body: >-
              The Medtronic deal is Cornerstone's most credible scale channel, but it also means outside observers still
              cannot tell how much eventual demand will come from direct hospital selling versus one strategic partner.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory scope is real, but the next leg of expansion is still under-documented
        blocks:
          - type: paragraph
            body: >-
              Cornerstone has crossed meaningful regulatory hurdles: public sources reviewed in this assigned pool
              support NMPA approval in China, CE Mark approval in the EU, and Singapore HSA approval for Sentire. That
              reduces binary platform-validity risk, but it does not remove market-expansion risk. The Medtronic
              agreement is explicitly limited to select markets outside the U.S. where the system is already market
              approved, and the assigned public source set does not disclose a U.S. regulatory pathway or timetable. The
              strongest near-term legal or regulatory concern is therefore not a documented enforcement action in this
              pool, but an expansion ceiling: if management cannot show a credible country-by-country approval plan
              beyond the currently disclosed jurisdictions, the commercial upside implied by a large strategic valuation
              can outrun the product's public approval footprint. A second caution is disclosure quality. Public sources
              disagree on the scale of the manufacturing footprint, which matters because regulators, distributors, and
              hospitals ultimately underwrite manufacturing reliability, service capacity, and post-market quality
              discipline, not just headline approvals.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
              - CR008
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
              - CR008
      - number: '7.2'
        title: Operational de-risking is still mostly self-reported
        blocks:
          - type: paragraph
            body: >-
              The company has assembled several mitigation signals: it says Sentire is built entirely in-house, has
              multiple core technologies under direct control, uses vertical integration to improve supply-chain
              resilience, and has been running a UK clinical investigation with Portsmouth Hospitals University NHS
              Trust since 2025. LinkedIn updates also show recent clinical use at Hong Kong Baptist Hospital,
              remote-training work with IRCAD-Taiwan, and product marketing around more than 20 integrated safety
              mechanisms. Those are useful signals, but they are not a substitute for independent post-market operating
              data. In the assigned public pool, there are still no disclosed uptime, recall, field-failure,
              service-response, or installed-base metrics that would let an investor separate a promising launch story
              from a repeatable operations machine. That makes manufacturing quality, deployment support, and training
              scalability the most important operational diligence line items. If the company cannot reconcile plant
              capacity, field-service coverage, and real-world utilization with auditable data, the commercialization
              story remains narrative-heavy even after clear regulatory progress.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.3'
        title: The Medtronic deal helps, but dependency and underwriting risk remain high
        blocks:
          - type: paragraph
            body: >-
              The September 2026 Medtronic partnership is the clearest external validation in the public record: it
              brings a roughly US$700 million strategic investment and distribution rights in select approved markets
              outside the U.S. That can accelerate reach, but it also creates a new dependency risk because public
              commercialization outside China can become tightly linked to one strategic partner's prioritization and
              performance. Adoption evidence is also still anchored to a small set of named hospitals and training
              institutions rather than a clearly disclosed installed base. Financially, the public source set shows
              repeated fundraising success, but it still does not disclose the revenue, margin, service attach, or
              cash-burn data needed to underwrite how much capital intensity remains between regulatory wins and scaled
              deployment. The practical kill criteria are therefore measurable: if Medtronic does not convert into named
              production sites and repeat orders, if management cannot provide verifiable utilization and service KPIs,
              or if the cap table and operating model remain opaque through the next financing discussion, the downside
              case stays dominated by execution risk rather than technology risk.
            claimRefs:
              - CR002
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR010
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The clearest positive signal in the assigned pool is strategic validation. FierceBiotech reported fresh
              2026 financing, while Cornerstone and Medtrade describe a September 2026 Medtronic transaction that brings
              approximately US$700 million of strategic capital and ex-U.S. distribution rights in select approved
              markets. Those facts matter because they can widen channel reach and accelerate commercialization. They do
              not, however, reveal revenue, gross margin, installed-base scale, current post-money valuation, or
              liquidation preferences. That missing price context is decisive: public evidence supports continued
              diligence, not a conviction buy or a precise entry multiple.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable upside case is understandable. Company-controlled and third-party sources consistently
              describe an in-house platform, regulatory progress across China, the EU, and Singapore, and
              clinical/training relationships that could support a differentiated APAC and Europe commercialization
              path. The anti-thesis is just as important: independent and company-issued sources still show an early
              market where robotic-surgery penetration remains low, approvals stay regional, and public commercial
              disclosure is thin. Even recent hospital-use announcements and U.K. trial activity look more like proof of
              motion than proof of durable scale economics.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The right way to frame valuation today is through conditional scenarios rather than false precision. A
              bull case needs evidence that the Medtronic partnership turns approvals into repeat placements, recurring
              procedure economics, and broader market coverage. The base case is that Cornerstone keeps progressing
              while public disclosure remains incomplete, leaving the company financeable but not cleanly priceable from
              outside evidence. The bear case is that commercialization stays narrower than the strategic headline
              implies while competition remains crowded and the next round absorbs more downside protection than
              common-equity buyers expect. Exit readiness is therefore incomplete until management opens the operating
              and capital-structure data room. Until then, downside protection and entry discipline matter more than
              narrative momentum because the public record still shows strategic intent more clearly than durable
              operating leverage.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not treat the Medtronic headline as a public valuation anchor
            body: >-
              The Medtronic transaction is meaningful strategic validation, but it is not the same thing as a disclosed
              post-money valuation or a clean common-equity entry price. Until revenue, placements, gross margin, and
              financing terms are opened up, the most defensible outside view is research-more rather than buy.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV010
              - CV011
          - type: callout
            title: Thesis-break triggers
            body: >-
              The thesis should weaken materially if the Medtronic partnership does not translate into verifiable
              placements or recurring procedure activity, if approved-market reach stays narrow relative to
              expectations, or if the next financing reveals a heavy preference stack that leaves little upside for new
              common-equity investors.
            calloutType: assumption
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
