              - CP009
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP010
              - CP012
      - number: '3.3'
        title: Switching costs, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The strongest public moat argument is integration control plus new channel leverage, not a proven
              installed-base lock. Cornerstone states that core hardware, software, algorithms, imaging, and energy
              systems are built in-house, while the Medtronic deal gives it a faster route into approved international
              markets. That should help with surgeon adoption and hospital confidence, but the retained evidence still
              does not show disclosed installed-base counts, long-term consumables attachment, or multiyear service
              economics that would demonstrate hard lock-in. Competitive risk is therefore two-sided: Medtronic can
              expand Sentire's reach, but it is also continuing to build Hugo, and independent profiles still frame the
              market as crowded enough that Cornerstone's differentiation can be compressed if buyers treat robotic
              systems as increasingly substitutable.
            claimRefs:
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution leverage improved faster than product breadth changed
            body: >-
              The Medtronic agreement matters most because it adds channel reach and ecosystem context to Sentire
              without requiring Cornerstone to prove that it can build that distribution stack alone.
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP012
          - type: callout
            title: Public proof of moat is still thinner than public proof of product
            body: >-
              The retained evidence supports approvals and technical integration claims, but it still does not show
              disclosed pricing power, installed-base lock-in, or durable win-loss data against named peers.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is legible in structure but not in disclosed economics
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a hardware-led commercialization model centered on the Sentire surgical system,
              with revenue most plausibly flowing from initial system placement, follow-on procedures, and associated
              service, training, and support. The September 2026 Medtronic deal is the clearest commercial disclosure:
              Cornerstone says Medtronic will invest about US$700 million and gain rights to distribute Sentire in
              select non-U.S. markets where it is already approved. That implies a hybrid model in which Cornerstone can
              monetize both direct hospital relationships and channel-led expansion through a global strategic partner.
              What remains missing is the economic core required for underwriting: no retained source in this pool
              discloses list price per system, realized ASP, maintenance pricing, per-procedure consumable revenue,
              revenue-recognition policy, or distributor take rates.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
              - CI016
