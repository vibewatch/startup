              - CI013
              - CI016
      - number: '4.2'
        title: Commercial traction and cost structure are visible mainly through operating proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction signals are regulatory milestones, hospital launches, training deployments,
              and independent deployment records rather than reported revenue. DEPLOY lists one model and two verified
              deployments across one region as of October 2026, which is meaningful evidence that the platform is in the
              field but still a limited installed-base datapoint relative to the company's strategic ambitions. LinkedIn
              posts add qualitative proof of activity, including clinical use at Hong Kong Baptist Hospital and a
              remote-training installation with one system and five consoles in Taiwan, but those are adoption proxies
              rather than monetized usage metrics. On the cost side, company-controlled sources consistently emphasize
              full-stack in-house development, three global R&D hubs, six business centres, and a 30,000-square-meter
              manufacturing facility in China, all of which point to a capital-intensive operating model with
              potentially meaningful fixed overhead and service obligations.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI013
              - CI016
      - number: '4.3'
        title: Capital adequacy improved optically, but cash underwriting is still blocked
        blocks:
          - type: paragraph
            body: >-
              The announced Medtronic investment is large enough to matter strategically, but it does not by itself make
              Cornerstone underwritable on cash sufficiency because the retained sources do not disclose whether the
              full amount has closed, how much is primary capital versus other consideration, what the use-of-proceeds
              plan is, or whether any debt, milestone, or distribution obligations sit alongside it. Public third-party
              funding datasets also disagree materially: DEPLOY shows US$270.0 million raised, Medbot says over RMB 1.8
              billion (about US$250 million), and Tracxn reports US$459 million. Those inconsistencies are manageable
              for narrative context but not precise enough for valuation bridgework or runway analysis. Absent cash
              balance, burn, working-capital, and capex disclosure, the prudent view is that financing dependency has
              likely decreased after the Medtronic announcement but cannot be quantified.
            claimRefs:
              - CI001
              - CI008
              - CI010
              - CI011
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
              - CI015
      - number: '4.4'
        title: 'Financial verdict: promising distribution leverage, unresolved unit-economics proof'
        blocks:
          - type: paragraph
            body: >-
              Financially, Cornerstone looks more like a late-stage platform company with improving commercial leverage
              than a business that has yet proved revenue quality in public. The bullish case is straightforward:
              regulatory approvals across China, Europe, and Singapore plus a large Medtronic partnership can accelerate
              placements without Cornerstone having to build every ex-China commercial lane alone. The cautious case is
              just as clear: public evidence still does not show price realization, recurring mix, margin profile,
              customer concentration, backlog, burn, or payback. That means the chapter can support a view on revenue
              mechanism and capital intensity direction, but not on current earnings quality or self-funded durability.
              The next diligence step should therefore focus on management-provided commercial cohort data rather than
              more generic market narratives.
            claimRefs:
              - CI002
              - CI005
              - CI008
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel leverage improved faster than disclosure quality
            body: >-
              The Medtronic partnership materially strengthens Cornerstone's route-to-market narrative, but public
              disclosures still stop short of the economics needed to judge revenue quality or self-funded scale.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI015
          - type: callout
            title: Commercial proof is still proxy-heavy
            body: >-
              Installed-base, hospital-launch, and training signals show real activity, but revenue, gross margin, and
              cash-runway data remain undisclosed or inconsistent across public datasets.
            calloutType: risk
            claimRefs:
              - CI008
              - CI010
              - CI011
              - CI014
