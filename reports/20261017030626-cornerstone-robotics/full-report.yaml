              - CP008
              - CP013
      - number: '3.2'
        title: Capability, packaging, and buyer comparison
        blocks:
          - type: paragraph
            body: >-
              Cornerstone's best-substantiated product differentiation is not price but a specific cluster of capability
              and workflow claims: China, EU, and Singapore approvals across multiple soft-tissue specialties; immersive
              and dual-console workflow; real-time feedback; full-stack in-house development; and recent remote-training
              and fast-docking demonstrations. By contrast, the Medtronic evidence emphasizes ecosystem breadth, channel
              reach, and service infrastructure around Hugo and related digital surgery tools. Public pricing is the
              weakest part of the comparison set: none of the retained official or independent surfaces discloses
              Sentire list price, realized selling price, discounting, or contract economics, so the chapter can only
              compare commercial packaging and buyer implications rather than precise ROI.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
