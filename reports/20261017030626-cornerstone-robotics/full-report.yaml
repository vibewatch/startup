  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered system and current maturity
        blocks:
          - type: paragraph
            body: >-
              Sentire is presented as Cornerstone Robotics' endoscopic robotic-assisted surgery platform for minimally
              invasive procedures rather than a broad hospital software stack or general-purpose robot. Across company,
              partner, and independent coverage, the publicly supported maturity story is concrete: the platform is
              already approved in China, the European Union, and Singapore for general, gynecologic, thoracic, and
              urologic procedures, while external materials also reference pilot and registration case volume. That
              means the company is no longer at prototype stage, but the public record still says more about approvals
              and trials than about scaled hospital utilization, field uptime, or economic outcomes after deployment.
            claimRefs:
              - CE001
              - CE007
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Cornerstone's core technical narrative is vertical integration. Company and partner disclosures
              consistently describe Sentire as developed in-house across hardware, control software, advanced
              algorithms, imaging, and energy systems, with manufacturing concentrated in a large China facility and
              engineering distributed across three R&D hubs. Product-level feature disclosures point to an immersive
              surgeon console, dual-console training capability, real-time feedback, anti-fog visibility, and an
              integrated cold light source. Taken together, that suggests a tightly controlled product stack aimed at
              performance consistency and supply-chain resilience, though it does not yet provide the deep technical
              artifact set a buyer would need for full independent validation.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
