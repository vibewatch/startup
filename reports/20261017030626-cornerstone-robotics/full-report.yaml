      - number: '6.2'
        title: Named adoption proof now spans hospitals, training networks, and channel expansion
        blocks:
          - type: paragraph
            body: >-
              Customer proof is more concrete than a logo page, but it is still early in the commercialization curve.
              AsiaBizToday reported a first Singapore installation at Woodlands Hospital under NHG for training,
              workflow adaptation, and system evaluation. Cornerstone's LinkedIn page adds very fresh company-controlled
              proof of clinical use at Hong Kong Baptist Hospital plus a five-console IRCAD-Taiwan training network
              built for dual-console and remote mentoring. Medbot and a Veeva trial entry extend the picture back to
              CUHK and Prince of Wales Hospital clinical-validation work. Together, these sources show real
              institutional touchpoints across geographies, but many are still training, pilot, or first-use milestones
              rather than recurring production fleets.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
