        title: Exhibits
        blocks:
          - type: callout
            title: Headline capital is not a commercialization metric
            body: >-
              The assigned evidence supports large financing announcements and multiple regulatory approvals, but it
              does not disclose revenue, procedure volume, hospital placements, gross margin, or cash actually received
              from the announced Medtronic transaction. Valuation work should keep those quantities separate.
            calloutType: risk
            claimRefs:
              - CO006
              - CO008
              - CO013
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a narrower boundary than global medical robotics. Sentire is an endoscopic surgical
              system for minimally invasive soft-tissue procedures, with disclosed approval coverage in general,
              gynecologic, thoracic, and urologic surgery. Its current regulatory footprint comprises China, the
              European Union, and Singapore, while Medtronic's rights are limited to select non-U.S. markets where the
              system is approved. The included market is therefore hospital capital equipment, instruments, training,
              and service needed to run those approved procedures. Excluded are the United States, unsupported
              specialties, rehabilitation robotics, and any assumption that all minimally invasive surgery converts to
              robotic assistance. Status-quo substitutes include conventional minimally invasive surgery and continued
              use of incumbent robotic platforms such as Medtronic's Hugo.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The source pool does not contain the denominators required for a credible monetary TAM/SAM/SOM.
              Cornerstone says robotic-assisted surgery adoption remains in single digits globally, but TechNode
              correctly notes that the release supplies no cited market source for that figure. The roughly US$700
              million Medtronic investment is a strong strategic signal, not end-market revenue or cash available to
              Cornerstone, and it cannot be converted into procedure demand. A defensible sizing stack therefore starts
              with approved geographies, narrows to named specialties, then narrows again to hospitals able to fund
              acquisition, training, service, and workflow change. Public pricing, placements, procedure volume,
              reimbursement, utilization, and service economics remain missing, so SOM is explicitly unquantified rather
              than inferred from a broad category forecast.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM014
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The practical buyer is a hospital or health system, while surgeons and operating-room teams are the users.
              TechNode identifies the decision criteria directly: capital cost, clinical evidence, physician training,
              service support, and interoperability. Those criteria imply a multi-stakeholder sale involving surgery
              leadership, procurement, finance, clinical governance, and training teams; the allocated sources do not
              identify a single universal budget owner. Adoption begins with market approval and specialty coverage,
              proceeds through trials and surgeon training, and requires installation and support capacity.
              Cornerstone's 2024 training initiative and Medtronic's distribution rights address parts of this path, but
              neither proves purchasing conversion, system utilization, or a repeatable hospital ROI.
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM011
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The principal drivers are broader multi-specialty approval, a global medtech distribution channel, and a
              vertically integrated product strategy that Cornerstone says improves control over integration, quality,
              and supply resilience. Reported development evidence includes more than 250 clinical cases, while the
              company describes three R&D hubs, six business centres, and a 30,000-square-meter manufacturing facility.
              The constraints are equally material: country-by-country regulation, capital approval, training, service
              readiness, incumbent installed bases, and undisclosed economics. Europe and Southeast Asia are plausible
              expansion corridors, but the exact Medtronic-covered countries are not public. Valuation should therefore
              credit regulatory and channel option value while withholding credit for precise market share, revenue
              scale, or commercial efficiency until placement, utilization, pricing, and margin evidence is produced.
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM011
              - CM012
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel evidence is stronger than market-size evidence
            body: >-
              Medtronic's investment and distribution rights validate strategic interest in the category, but they do
              not disclose Cornerstone's system demand, revenue, market share, or cash position.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM013
              - CM014
          - type: callout
            title: Public SOM remains unquantified
            body: >-
              A bottom-up SOM requires approved-market hospital counts, eligible procedures, pricing, placement
              conversion, utilization, service revenue, and margin data that are absent from the assigned evidence.
            calloutType: risk
            claimRefs:
              - CM006
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and alternative set
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a broad alternative set rather than a single-head-to-head matchup.
              Cornerstone competes against portfolio incumbents, legacy benchmark surgical robots, specialty robotic
              challengers, and the status quo of conventional minimally invasive surgery. The biggest 2026 change is
              Medtronic's approximately US$700 million strategic investment plus distribution rights for Sentire in
              approved markets outside the U.S., because that moves Cornerstone from a standalone platform story toward
              a channel-backed portfolio offering. Independent databases and supplier profiles also place Cornerstone in
              a crowded field that includes Intuitive, CMR Surgical, Medical Microinstruments, and PROCEPT BioRobotics,
              so the company is competing in a widening global field rather than entering a vacuum.
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
              - CP013
