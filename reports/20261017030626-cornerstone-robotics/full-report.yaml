  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual-risk cluster is not core product validity but scale execution: new-market regulatory timing,
      thin independent operating data, and partner concentration all remain materially unresolved.
    data:
      columns:
        - label: Likelihood
          note: Qualitative judgment grounded in the cited public evidence.
        - label: Impact
          note: Impact on commercialization, underwriting, or thesis durability.
        - label: Residual severity
          note: Net of the mitigations currently visible in public sources.
      rows:
        - label: New-market regulatory delay
          note: Public approvals are disclosed for China, the EU, and Singapore, but not a U.S. path.
          values:
            - label: Medium-High
              tone: warning
              note: Existing approvals show capability, but further market expansion still needs disclosed pathways.
            - label: High
              tone: risk
              note: Delay would cap TAM expansion and stretch commercialization timing.
            - label: High
              tone: critical
              note: Kill criterion if management cannot show a dated filing roadmap for next-priority markets.
        - label: Manufacturing and quality execution concentration
          note: Public sources point to vertically integrated production and inconsistent capacity disclosure.
          values:
            - label: Medium
              tone: warning
              note: In-house control can help, but it concentrates execution risk.
            - label: High
              tone: risk
              note: Quality or service failures would directly impair rollout credibility.
            - label: Medium-High
              tone: risk
              note: Residual risk stays elevated until capacity, yield, and service data are audited.
        - label: Thin independent post-market performance data
          note: Public evidence emphasizes launches, training, and product claims more than field KPIs.
          values:
            - label: High
              tone: risk
              note: This gap persists today across uptime, recall, and utilization data.
            - label: High
              tone: critical
              note: It weakens confidence in operational leverage and service burden assumptions.
            - label: High
              tone: critical
              note: Kill criterion if diligence cannot obtain site-level uptime and usage evidence.
        - label: Medtronic channel dependency
          note: The strategic investment also centralizes external-market distribution in one large partner.
          values:
            - label: Medium
              tone: warning
              note: Counterparty quality is strong, but execution still depends on partner attention and incentives.
            - label: High
              tone: risk
              note: Underperformance would directly affect global rollout expectations.
            - label: High
              tone: risk
              note: Residual risk remains high until named production sites and reorder cadence are visible.
        - label: Training-heavy commercialization model
          note: >-
            UK training sessions and IRCAD-Taiwan remote-training infrastructure help, but they imply nontrivial
            enablement work.
          values:
            - label: Medium-High
              tone: warning
              note: Early-stage medtech adoption often bottlenecks on proctoring and support.
            - label: Medium-High
              tone: warning
              note: Slow surgeon enablement can delay utilization and conversion.
            - label: Medium-High
              tone: warning
              note: Residual risk falls only when training throughput converts into repeat deployments.
        - label: Financial-model opacity
          note: Public evidence shows fundraising strength, but not revenue, margin, or burn visibility.
          values:
            - label: High
              tone: risk
              note: The missing metrics are current, not theoretical, diligence gaps.
            - label: High
              tone: critical
              note: Valuation and downside protection cannot be underwritten cleanly without them.
            - label: High
              tone: critical
              note: Kill criterion if the next diligence round still lacks revenue, margin, and cap-table detail.
    approximationNotes: >-
      Qualitative cells summarize cited evidence and public-information gaps; the figure does not imply numeric
      probabilities or benchmarked loss rates.
    claimRefs:
      - CR002
      - CR003
      - CR008
      - CR010
      - CR011
      - CR012
      - CR013
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic momentum is real, but missing economic and capital-structure disclosure keeps the recommendation at
      research-more.
    data:
      nodes:
        - id: n1
          label: Strategic capital
          note: Approximately US$700 million from Medtronic plus select-market distribution rights outside the U.S.
          tone: positive
        - id: n2
          label: Regulatory footprint
          note: China approval in 2024 and EU plus Singapore approvals in 2026 support broader market access.
          tone: positive
        - id: n3
          label: Commercialization scaffolding
          note: >-
            About $200 million of 2026 financing, U.K. clinical work, and clinical-training partnerships show continued
            build-out.
          tone: neutral
        - id: n4
          label: Proof still thin
          note: Public sources do not disclose revenue, gross margin, or installed-base scale.
          tone: risk
        - id: n5
          label: Crowded market
          note: Robotic-surgery penetration remains low and Tracxn lists 265 active competitors.
          tone: risk
        - id: n6
          label: Recommendation
          note: >-
            Research more; keep risk high and valuation unknown until management discloses operating and financing
            detail.
          tone: risk
      edges:
        - from: n1
          to: n2
          relationship: supports broader reach
        - from: n2
          to: n3
          relationship: enables commercialization setup
        - from: n3
          to: n4
          relationship: but does not prove economics
        - from: n4
          to: n5
          relationship: which matters more in a crowded category
        - from: n5
          to: n6
          relationship: therefore keep price discipline
    approximationNotes: The flow is an analytical logic chain drawn from the assigned source pool; it is not a quantified valuation model.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
