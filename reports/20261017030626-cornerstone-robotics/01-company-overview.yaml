company:
  name: Cornerstone Robotics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Cornerstone Robotics is a Hong Kong surgical-robotics company whose Sentire platform has progressed from a 2019
    founding to approvals in China, the European Union, and Singapore. A September 2026 release announced an
    approximately US$700 million Medtronic strategic investment and distribution arrangement, but the assigned public
    evidence does not establish that the investment has closed or disclose revenue, placements, valuation, control
    rights, or a complete leadership bench.
sections:
  - id: identity-product-and-operating-footprint
    title: Identity, product, and operating footprint
    body: >-
      Cornerstone Robotics was founded in September 2019 and is headquartered in Hong Kong. Its core product is
      Sentire, an endoscopic robotic-assisted surgery platform that company materials describe as developed in-house,
      including core components, software, algorithms, imaging, and energy technologies. The company also says it has
      three global R&D hubs, six business centres, and a 30,000-square-meter manufacturing facility in China. Those
      claims establish a credible product-company identity and a meaningful operating footprint, but they remain
      predominantly company-issued. The assigned evidence does not provide audited manufacturing capacity, product
      cost, installed-system counts, or a complete location-by-location operating roster, so scale should not be
      inferred from facility size alone.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: regulatory-and-commercial-inflection
    title: Regulatory and commercial inflection
    body: >-
      Sentire received China NMPA approval in September 2024, followed by EU CE certification and Singapore HSA
      approval in May 2026 for general, gynecologic, thoracic, and urologic procedures. In September 2026, Cornerstone
      and PR Newswire carried the company's announcement that Medtronic would make an approximately US$700 million
      strategic investment and receive distribution rights in select approved markets outside the United States.
      The future-tense wording matters: the retained sources support an announced investment and channel agreement,
      not cash already available to Cornerstone or a closed transaction. The homepage also retains a broad
      demonstration-only regulatory disclaimer, underscoring that availability remains jurisdiction- and
      product-specific rather than global.
    claimRefs: [CO004, CO005, CO006, CO007, CO016]
    figureRefs: [FO001]
  - id: financing-stage-and-cover-metrics
    title: Financing stage and cover metrics
    body: >-
      Financing evidence is substantial but not fully reconcilable. Cornerstone's history records a Series B of more
      than US$75 million in 2021, a Series B+ of more than US$90 million in 2023, a Series C of more than US$70 million
      in January 2025, and an approximately US$200 million round in November 2025. Separately, Tracxn reports
      US$459 million raised over four rounds and labels the company Series D. These figures should not be added to the
      announced Medtronic investment because the sources use different scopes and do not disclose closing status or a
      reconciled financing bridge. Tracxn's reported 63 employees is a useful scale indicator, but revenue, gross
      margin, customer count, placements, valuation, and cash available remain unsupported.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: leadership-governance-and-key-person-risk
    title: Leadership, governance, and key-person risk
    body: >-
      Cornerstone's September 2026 release identifies Professor Kwok Wai Samuel Au as Founder and CEO, and Medbot
      independently attributes the founding to him while describing prior surgical-robotics experience at CUHK and
      Intuitive Surgical. Tracxn instead names Zerui Wang as founder or co-founder, creating an unresolved attribution
      conflict rather than a reliable second executive profile. The retained evidence does not name a board, list
      independent directors, describe executive functional ownership, or disclose rights attached to major financing
      rounds. The company therefore appears publicly founder-led, but the evidence cannot determine actual control,
      succession depth, or whether product, regulatory, manufacturing, and commercialization responsibilities are
      distributed across a durable management team.
    claimRefs: [CO014, CO015]
    tableRefs: [TO002]
callouts:
  - calloutType: risk
    title: Headline capital is not a commercialization metric
    body: >-
      The assigned evidence supports large financing announcements and multiple regulatory approvals, but it does not
      disclose revenue, procedure volume, hospital placements, gross margin, or cash actually received from the
      announced Medtronic transaction. Valuation work should keep those quantities separate.
    claimRefs: [CO006, CO008, CO013, CO016]
