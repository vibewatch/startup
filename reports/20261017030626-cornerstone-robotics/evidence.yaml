evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founder-leadership
    missingEvidence: A company-verified founder roster, complete current executive team, board composition, and succession plan.
    whyItMatters: >-
      Conflicting founder attribution and a missing governance roster prevent assessment of key-person dependence and
      control.
    diligencePath: Obtain the current org chart, board register, executive biographies, and incorporation records.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Revenue, gross margin, customer count, installed systems, procedure volume, valuation, and current cash.
    whyItMatters: Financing announcements and approvals do not establish commercial adoption, unit economics, or runway.
    diligencePath: >-
      Request audited financials, a placement-level KPI export, procedure logs, and the latest board-approved cash
      forecast.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      A reconciled financing bridge, cap table, liquidation preferences, governance rights, and proof of Medtronic
      transaction closing.
    whyItMatters: >-
      Announced capital, lifetime funding, cash available, ownership, and control are distinct quantities with different
      downside implications.
    diligencePath: >-
      Review executed financing documents, bank evidence of proceeds, the current cap table, and all investor side
      letters.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: regulatory
    missingEvidence: A documented U.S. FDA pathway and product-specific explanation of the broad homepage regulatory disclaimer.
    whyItMatters: >-
      Market availability cannot be inferred across jurisdictions from approvals in China, the European Union, and
      Singapore.
    diligencePath: Request the regulatory matrix by product, indication, geography, submission status, and expected decision date.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent market sizing or company data for eligible procedure volume, hospital counts, system placements, ASP,
      utilization, service revenue, and reimbursement by geography
    whyItMatters: >-
      Without consistent denominators and unit economics, a monetary TAM/SAM/SOM would be speculative and cannot anchor
      valuation or market-share assumptions.
    diligencePath: >-
      Request the board market model and reconcile its hospital, procedure, conversion, price, and utilization
      assumptions to regulatory approvals and audited commercial data.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Customer-level procurement cycle, total cost of ownership, training cost, service levels, utilization, clinical
      outcomes, and return on investment
    whyItMatters: >-
      These measures determine which approved hospitals can economically adopt Sentire and how quickly regulatory access
      converts into recurring demand.
    diligencePath: >-
      Review anonymized tenders, contracts, implementation plans, utilization cohorts, service records, and customer ROI
      studies across China, Europe, and Singapore.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: distribution-scope
    missingEvidence: >-
      Exact countries, launch sequencing, service obligations, economics, and performance targets covered by the
      Medtronic distribution agreement
    whyItMatters: >-
      The agreement is the strongest current channel signal, but select approved markets is too vague to determine the
      actual serviceable geography or timing.
    diligencePath: >-
      Inspect the executed distribution agreement and country launch plan, then reconcile covered markets to approvals,
      local reimbursement, service capacity, and sales forecasts.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Installed-base counts, instrument attach rates, service renewal terms, and buyer-level multi-homing behavior for
      Sentire deployments.
    whyItMatters: >-
      Without these data, moat durability and replacement risk remain partly qualitative rather than underwritten by
      usage economics.
    diligencePath: >-
      Request installed-base cohort data, service contract structure, and hospital win-loss notes from management or
      distributors.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Customer quotes, procurement records, or distributor materials showing Sentire list price, discount range, and
      contract model versus alternatives.
    whyItMatters: Commercial positioning can only be assessed qualitatively when public sources omit price and realized economics.
    diligencePath: Collect hospital tender documents, distributor decks, or customer references with disclosed commercial terms.
  - type: private-evidence-only
    severity: material
    topic: pricing-and-margin
    missingEvidence: >-
      System list price, realized ASP, distributor discount structure, service pricing, and gross margin by revenue
      stream.
    whyItMatters: >-
      Without monetization and margin detail, the chapter can describe revenue mechanics but not revenue quality or
      contribution margin.
    diligencePath: >-
      Request the current price book, distributor agreement economics, and a last-twelve-month revenue and gross-margin
      bridge by product and geography.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding-and-cash
    missingEvidence: >-
      A reconciled round-by-round funding ledger, current unrestricted cash balance, and confirmation of whether the
      announced Medtronic capital has closed.
    whyItMatters: >-
      Conflicting public funding totals make it unsafe to infer runway or post-money capitalization from external
      databases alone.
    diligencePath: >-
      Request the cap table, financing close memo, current cash balance, and a bridge from historical proceeds to
      present liquidity.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Sales cycle length, customer concentration, backlog, utilization per installed system, CAC, and payback.
    whyItMatters: >-
      These operating metrics determine whether approvals and launches are converting into durable economics or simply
      proving technical viability.
    diligencePath: >-
      Request cohort data for placements, bookings-to-revenue conversion, procedure utilization by cohort, and fully
      loaded CAC/payback by market.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: cybersecurity-and-privacy
    missingEvidence: >-
      Public documentation of cybersecurity controls, privacy architecture, hospital-network certifications, and update
      / patching responsibilities.
    whyItMatters: >-
      Hospitals buying connected robotic systems need evidence that safety and data-governance risks are controlled
      beyond clinical-performance claims.
    diligencePath: >-
      Request the product security architecture, privacy impact materials, SBOM / vulnerability process, and any
      third-party security or compliance certifications.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: material
    topic: service-reliability
    missingEvidence: >-
      Uptime metrics, field-failure history, maintenance response times, spare-parts model, and recall / incident
      reporting for deployed systems.
    whyItMatters: >-
      Product credibility depends not just on approvals and trials but on whether hospitals can keep systems available
      and safe in routine use.
    diligencePath: >-
      Request fleet uptime dashboards, service SLAs, complaint / CAPA summaries, and post-market surveillance data by
      installed site.
    relatedQuestionRefs:
      - QE004
      - QE006
      - QE007
  - type: private-evidence-only
    severity: material
    topic: health-economics
    missingEvidence: >-
      Public list pricing, procedure-level economics, utilization benchmarks, and ROI evidence supporting the lower-cost
      / accessibility thesis.
    whyItMatters: >-
      Without economics, the accessibility narrative remains strategic positioning rather than underwritable buyer
      value.
    diligencePath: >-
      Request system pricing, consumables pricing, training costs, payback cases, and win/loss analyses versus incumbent
      platforms.
    relatedQuestionRefs:
      - QE005
      - QE007
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: us-regulatory-path
    missingEvidence: A public FDA pathway, U.S. trial plan, or commercialization timeline for Sentire.
    whyItMatters: >-
      The Medtronic partnership improves approved-market distribution, but it does not prove access to the largest
      reference market for global robotic surgery.
    diligencePath: >-
      Request the U.S. regulatory strategy, predicate / de novo rationale, planned trial design, and expected submission
      milestones.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: practitioner-signal
    missingEvidence: >-
      Independent surgeon-community, developer-signal, or practitioner-forum evidence validating service, integration,
      or day-two operating experience.
    whyItMatters: Public product and press materials are stronger on approvals than on operator experience after deployment.
