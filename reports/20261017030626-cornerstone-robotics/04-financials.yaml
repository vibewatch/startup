      - ["Employee footprint", "201-500 employees on LinkedIn; 63 employees on Tracxn as of Aug 26", "Low", "Conflicting headcount signals limit operating-expense inference", "Provide current FTE count by function and fully loaded monthly payroll"]
      - ["Manufacturing footprint", "30,000-square-meter facility in China", "High", "Supports vertical integration story but implies capex and plant utilization questions", "Provide plant utilization, annual capacity, and capitalized equipment schedule"]
      - ["Public pre-deal funding total", "US$250M to US$459M depending on source", "Medium", "Conflicting baseline makes cash bridgework unreliable", "Provide round-by-round primary proceeds and current unrestricted cash"]
      - ["Gross margin / payback / CAC", null, "Unavailable", "These are the core metrics for underwriting a hardware-plus-service model", "Provide gross margin by revenue stream, sales cycle, CAC, payback, and service gross margin"]
    notes: "Unavailable metrics remain null because the retained sources do not publish them; conflicting public values are shown as ranges or side-by-side disclosures rather than harmonized estimates."
    claimRefs: ["CI005", "CI007", "CI008", "CI009", "CI010", "CI011", "CI014", "CI015"]
