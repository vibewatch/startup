company:
  name: Cornerstone Robotics
chapter:
  number: 7
  title: Risks
  summary: >-
    Cornerstone Robotics' main investment risks are not that the platform lacks
    any regulatory or partner traction, but that public evidence still
    concentrates in company-issued commercialization claims, a single large
    distribution partner, and thin disclosed operating metrics. The public
    record supports real approvals, training infrastructure, and a major
    Medtronic deal, yet it still leaves high residual exposure around
    new-market expansion, manufacturing-quality execution, and financial
    underwriting.
sections:
  - id: regulatory-and-legal-exposure
    title: Regulatory scope is real, but the next leg of expansion is still under-documented
    body: >-
      Cornerstone has crossed meaningful regulatory hurdles: public sources
      reviewed in this assigned pool support NMPA approval in China, CE Mark
      approval in the EU, and Singapore HSA approval for Sentire. That reduces
      binary platform-validity risk, but it does not remove market-expansion
      risk. The Medtronic agreement is explicitly limited to select markets
      outside the U.S. where the system is already market approved, and the
      assigned public source set does not disclose a U.S. regulatory pathway or
      timetable. The strongest near-term legal or regulatory concern is
      therefore not a documented enforcement action in this pool, but an
      expansion ceiling: if management cannot show a credible country-by-country
      approval plan beyond the currently disclosed jurisdictions, the commercial
      upside implied by a large strategic valuation can outrun the product's
      public approval footprint. A second caution is disclosure quality. Public
      sources disagree on the scale of the manufacturing footprint, which
      matters because regulators, distributors, and hospitals ultimately
      underwrite manufacturing reliability, service capacity, and post-market
      quality discipline, not just headline approvals.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR006
      - CR007
      - CR008
      - CR014
    tableRefs:
      - TR001
  - id: operational-rollout-and-quality-risk
    title: Operational de-risking is still mostly self-reported
    body: >-
      The company has assembled several mitigation signals: it says Sentire is
      built entirely in-house, has multiple core technologies under direct
      control, uses vertical integration to improve supply-chain resilience, and
      has been running a UK clinical investigation with Portsmouth Hospitals
      University NHS Trust since 2025. LinkedIn updates also show recent
      clinical use at Hong Kong Baptist Hospital, remote-training work with
      IRCAD-Taiwan, and product marketing around more than 20 integrated safety
      mechanisms. Those are useful signals, but they are not a substitute for
      independent post-market operating data. In the assigned public pool, there
      are still no disclosed uptime, recall, field-failure, service-response,
      or installed-base metrics that would let an investor separate a promising
      launch story from a repeatable operations machine. That makes
      manufacturing quality, deployment support, and training scalability the
      most important operational diligence line items. If the company cannot
      reconcile plant capacity, field-service coverage, and real-world
      utilization with auditable data, the commercialization story remains
      narrative-heavy even after clear regulatory progress.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR015
      - CR016
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: partner-and-financial-dependency
    title: The Medtronic deal helps, but dependency and underwriting risk remain high
    body: >-
      The September 2026 Medtronic partnership is the clearest external
      validation in the public record: it brings a roughly US$700 million
      strategic investment and distribution rights in select approved markets
      outside the U.S. That can accelerate reach, but it also creates a new
      dependency risk because public commercialization outside China can become
      tightly linked to one strategic partner's prioritization and performance.
      Adoption evidence is also still anchored to a small set of named
      hospitals and training institutions rather than a clearly disclosed
      installed base. Financially, the public source set shows repeated
      fundraising success, but it still does not disclose the revenue, margin,
      service attach, or cash-burn data needed to underwrite how much capital
      intensity remains between regulatory wins and scaled deployment. The
      practical kill criteria are therefore measurable: if Medtronic does not
      convert into named production sites and repeat orders, if management
      cannot provide verifiable utilization and service KPIs, or if the cap
      table and operating model remain opaque through the next financing
      discussion, the downside case stays dominated by execution risk rather
      than technology risk.
    claimRefs:
      - CR002
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
    tableRefs:
      - TR003
