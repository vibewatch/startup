companyProfile:
  summary: >-
    Cornerstone Robotics is a Hong Kong-based surgical robotics company building the Sentire minimally invasive surgery
    platform. Public evidence supports a 2019 founding, approvals in China, the European Union, and Singapore, and a
    September 2026 announced strategic investment and distribution arrangement with Medtronic. The business appears to
    combine direct system placements, training, after-sales support, and partner-led market access, but public
    disclosures still leave revenue, valuation, cash, installed base, and control rights largely opaque.
  foundedDate: '2019-09-01'
  founders:
    - name: Professor Kwok Wai Samuel Au
      role: Founder and CEO
      background: Medbot describes prior surgical-robotics work at CUHK and roughly ten years at Intuitive Surgical.
      claimRefs:
        - CO014
        - CO015
  foundingLocation: Hong Kong
  headquarters: Hong Kong
  productSummary: >-
    Sentire is an endoscopic robotic-assisted surgery platform for minimally invasive procedures, with public claims
    around in-house hardware, software, algorithms, imaging, and energy technologies.
  customerFocus: >-
    Hospitals, surgical departments, training institutions, and partner-led markets approved for soft-tissue robotic
    surgery.
  businessModel: System placements, service, training, and distributor-led expansion in approved non-U.S. markets.
  stage: late-stage private
  fundingStatus: >-
