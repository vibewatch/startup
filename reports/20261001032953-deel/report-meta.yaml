companyProfile:
  summary: >-
    Deel is a private, disclosed global employment platform founded in 2019 and built around employer-of-record,
    contractor management, global payroll, and compliance workflows for distributed workforces. The company reports more
    than 40,000 customer companies, operates across more than 150 countries, and has layered new mobility,
    field-services, and AI workflow products on top of its core payroll infrastructure. Public evidence still leaves
    audited margins, retention, and full cap-table economics unresolved.
