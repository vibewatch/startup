callouts:
  - calloutType: "insight"
    title: "Direct Global Payroll Expansion Multiplies Deel's Addressable Spend"
    body: "Expanding beyond Employer of Record into direct payroll processing for companies with existing legal entities unlocks a $40 billion annual addressable market—roughly eight times the size of the standalone EOR market. Because direct payroll currently represents only 15% of Deel's revenue, penetration of enterprise customer subsidiaries represents the company's highest-velocity organic expansion vector."
    claimRefs:
      - "CM003"
      - "CM004"
  - calloutType: "risk"
    title: "Cross-Border Regulatory Enforcement Creates Both Driver and Liability"
    body: "Heightened regulatory scrutiny regarding worker misclassification and statutory employment obligations in key jurisdictions forces distributed organizations to adopt automated compliance platforms. However, operational complexity in shift-based environments and precedent liabilities exceeding $100 million illustrate the material compliance exposure that Deel assumes on behalf of its global clients."
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM012"
