evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: Audited GAAP P&L statement, product-line gross margin breakdown, and exact revenue run-rate schedule.
    whyItMatters: >-
      Deel is a private company reporting over $1B in ARR, but audited product gross margins (EOR vs SaaS) are critical
      to evaluating true software economics.
    diligencePath: >-
      Review audited annual financial statements and independent CPA review reports during pre-commitment data room
      inspection.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: founder-and-executive-roster
    missingEvidence: Comprehensive organizational chart and cap table equity allocation across executive officers and board members.
    whyItMatters: >-
      Full executive team breadth and board governance composition determine key-person resilience and executive
      succession planning.
    diligencePath: Obtain formal corporate governance roster, board minutes, and executive employment agreements from legal counsel.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: institutional-cap-table
    missingEvidence: >-
      Complete shareholder ledger including secondary market transactions, founder share classes, and exact pro-rata
      rights.
    whyItMatters: >-
      Evaluates voting control covenants, liquidation preferences, and alignment across historical institutional venture
      investors.
    diligencePath: Inspect updated stock ledger and investor rights agreement in the confidential diligence repository.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-diligence-gap
    missingEvidence: >-
      Audited GAAP gross margin breakdown across EOR, contractor management, and SaaS payroll lines, alongside cohort
      NRR waterfalls.
    whyItMatters: >-
      Direct payroll and EOR have fundamentally different gross margin profiles (SaaS software vs legal pass-through),
      affecting long-term platform valuation multiples.
    diligencePath: >-
      Request confidential disclosure of audited segmental gross margins and logo/dollar retention cohort analyses
      during formal institutional diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: churn-and-diy-entity-migration
    missingEvidence: >-
      Granular enterprise cohort retention data and customer migration rates from EOR to client-owned direct legal
      entities.
    whyItMatters: >-
      Determines whether high-headcount accounts permanently remain on Deel or inevitably transition off once entity
      setup costs amortize.
    diligencePath: Request customer logo churn broken down by entity transition versus competitor loss in management diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited GAAP gross margin breakdown by product line distinguishing pure software SaaS revenue from high-touch
      Employer of Record (EOR) employment liabilities and passthrough labor costs.
    whyItMatters: >-
      Headline 85% gross margin estimates reflect blended platform fees but omit in-country entity overhead and foreign
      legal liability, obscuring true long-term software cash conversion.
    diligencePath: >-
      Request audited GAAP financial statements and unit gross margin schedules by product line during confirmatory
      underwriting.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Audited balance sheet detailing cash and cash equivalents, outstanding credit facilities, and liquidity reserves
      against secondary discount overhang.
    whyItMatters: >-
      While Deel claims three consecutive years of operating profitability, private market secondary discounts of 17%
      and supply-demand imbalances highlight investor uncertainty over balance sheet strength.
    diligencePath: Inspect certified bank statements, credit facility covenants, and board-level cash flow statements.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: security and compliance
    missingEvidence: >-
      Current SOC reports, ISO 27001 certificate and scope, penetration-test summary, subprocessor inventory, data-flow
      diagrams, and control exceptions.
    whyItMatters: >-
      Company assertions identify frameworks but do not establish certification scope, operating effectiveness, or
      unresolved exceptions.
    diligencePath: >-
      Review the current trust-center package under NDA with security leadership and map every relevant control and
      exception to products, entities, and subprocessors.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability and performance
    missingEvidence: >-
      Twelve months of uptime, severity-tagged incidents, recovery performance, payroll correction rates, API latency
      and availability, integration failure rates, and error budgets.
    whyItMatters: >-
      The product handles payroll and employment workflows where processing failures can create financial, legal, and
      employee-impact consequences.
    diligencePath: >-
      Obtain production SLO dashboards and incident postmortems, then reconcile them with support tickets, payroll
      corrections, and customer credits.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: developer experience
    missingEvidence: >-
      Public or diligence-room API reference, authentication model, sandbox, versioning and deprecation policy, rate
      limits, changelog, SDK coverage, and developer adoption metrics.
    whyItMatters: >-
      Current hiring evidence shows investment in developer experience but does not demonstrate documentation
      completeness or integration maturity.
    diligencePath: >-
      Request developer-portal access and test representative hire, worker-data, payroll, and webhook flows in a sandbox
      with failure and retry scenarios.
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: acquisition integration
    missingEvidence: >-
      Module-by-module inventory of acquired backends, migration milestones, shared identity and data layers, duplicate
      services, and retirement dates.
    whyItMatters: >-
      Backend coexistence can create inconsistent controls, duplicated data, release coupling, and uneven customer
      experiences.
    diligencePath: >-
      Review the target architecture and migration program with engineering, including dependencies, completed cutovers,
      rollback plans, and customer-impact metrics.
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: Customer cohort net revenue retention (NRR) and logo churn rates
    missingEvidence: Audited multi-year cohort retention waterfalls segmenting net expansion by customer size and vintage.
    whyItMatters: >-
      Without segmented NRR, it is impossible to verify whether expansion in enterprise accounts offsets elevated
      startup churn.
    diligencePath: Request confidential management data room disclosure of gross and net revenue retention by annual customer cohort.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: minor
    topic: Sample enumeration of verified public customer case studies
    missingEvidence: Comprehensive census of all enterprise customer contract values and integration architectures.
    whyItMatters: Public case studies reflect a self-selected success sample and may conceal stalled multi-country ERP rollouts.
    diligencePath: Cross-reference customer references with procurement logs and certified Workday/NetSuite partner listings.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory legal risk register
    missingEvidence: >-
      Audited quantitative litigation reserves and comprehensive insurance policy schedules covering Case
      3:25-cv-02166-VC and global employment misclassification claims.
    whyItMatters: >-
      Without formal reserve disclosure, investors cannot evaluate balance sheet protection against potential treble
      damages or regulatory settlement obligations.
    diligencePath: >-
      Request legal audit letters, loss contingency accounting notes, and commercial insurer reservation of rights
      letters during confirmatory diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: third-party-aggregator-exposure
    missingEvidence: >-
      Detailed country-by-country breakdown of EOR headcount deployed through owned legal entities versus third-party
      local partner aggregators.
    whyItMatters: >-
      Direct entity ownership drives structural gross margins, compliance consistency, and IP protection, whereas
      aggregator reliance introduces counterparty margin take and operational vulnerability.
    diligencePath: >-
      Require management to provide an audited entity coverage schedule showing active employee headcount and customer
      concentration by legal entity.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: >-
      Audited income statement, cash-flow statement, gross margin by product, revenue recognition policy, retention
      cohorts, and customer concentration.
    whyItMatters: >-
      ARR and profitability claims cannot establish cash quality, durable expansion, or an appropriate valuation
      multiple without these records.
    diligencePath: >-
      Obtain audited statements, management accounts, bank reconciliations, and cohort-level ARR waterfalls through a
      controlled data room.
    relatedQuestionRefs:
      - QV002
      - QV005
      - QV007
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Current fully diluted cap table, preferred rights, debt, option pool, acquisition consideration, transfer
      restrictions, and liquidation waterfall.
    whyItMatters: >-
      Headline post-money valuation does not determine ownership, dilution, preference overhang, or downside proceeds
      for a new investor.
    diligencePath: >-
      Reconcile the charter, stock ledger, financing documents, debt schedule, option grants, and pro forma liquidation
      waterfall with company counsel.
    relatedQuestionRefs:
      - QV001
      - QV008
  - type: missing-source
    severity: material
    topic: price-discovery
    missingEvidence: >-
      A recent arm's-length secondary transaction with disclosed date, size, security class, price, transfer approval,
      and buyer-seller relationship.
    whyItMatters: Database marks and a historical primary round do not establish a current executable entry price or downside floor.
    diligencePath: >-
      Request broker confirmations and completed trade documents, then normalize security rights before comparing
      prices.
    relatedQuestionRefs:
      - QV004
      - QV005
      - QV006
  - type: missing-source
    severity: material
    topic: comparable-valuation
    missingEvidence: >-
      Current public-company and private-transaction benchmarks with consistent revenue definitions, margins, growth,
      and valuation dates.
    whyItMatters: A competitor count is not a valuation comparable, and unlike business models cannot support a defensible multiple.
    diligencePath: >-
      Build a dated peer set from filings and transaction documents, separating software revenue from payroll
      pass-through and services.
    relatedQuestionRefs:
      - QV003
      - QV005
