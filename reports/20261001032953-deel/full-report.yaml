  - id: TV002
    title: Thesis and anti-thesis table
    columns:
      - lens
      - evidence-based argument
      - what would change the view
    rows:
      - - thesis
        - Deel reported more than $1B ARR, three consecutive profitable years, and a first $100M revenue month in 2025.
        - >-
          Audited results showing weak cash conversion, low gross margin, or non-recurring revenue would weaken the
          thesis.
      - - thesis
        - >-
          Deel said its global payroll processing engine was live in 55+ countries, indicating investment in owned
          operating infrastructure.
        - >-
          Evidence that coverage depends materially on third parties or does not improve retention and margin would
          weaken the moat claim.
      - - anti-thesis
        - Tracxn maps 965 active competitors, while the source pool lacks comparable revenue, margin, or valuation data.
        - Independent peer economics and transaction multiples showing a durable premium would improve price support.
      - - anti-thesis
        - >-
          Forge warns that private-market price data may use very limited inputs and may not represent an executable
          market price.
        - >-
          A recent arm's-length secondary block with disclosed size, security, and transfer terms would improve price
          discovery.
    notes: >-
      Company operating statements are identified as company-issued; Tracxn and Forge provide independent market context
      but not audited operating corroboration.
