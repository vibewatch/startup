      - number: '2.3'
        title: Buyer Personas, Procurement Workflows, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics and budget ownership vary significantly across customer scale. Early-stage
              venture-backed startups adopt Deel via founder or Head of Talent approval to onboard distributed engineers
              across multiple continents within days, bypassing foreign entity setup. In mid-market growth companies
              employing 100 to 1,000 workers, budget authority shifts to VPs of People and CFOs seeking to remediate
              contractor misclassification risk and unify fragmented international benefits. At enterprise scale,
              procurement engages Chief Human Resources Officers, Global Payroll Directors, and Corporate Controllers
              who require deep bi-directional ERP integration, customized security governance, and multi-country
              consolidated reporting. Additionally, specialized 24/7 operational workforces, such as data center shift
              operations, trigger procurement by infrastructure leads who must maintain strict statutory shift rest
              intervals and prevent downtime incidents.
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Adoption Catalysts, Regulatory Enforcement, and Diligence Constraints
        blocks:
          - type: paragraph
            body: >-
              Market growth is propelled by permanent structural shifts toward distributed knowledge work and tightening
              cross-border regulatory enforcement. Labor authorities across North America, Europe, and Latin America
              have intensified misclassification crackdowns, resulting in high-profile enforcement actions and
              settlements exceeding $100 million. Operating complex 24/7 technical workforces in jurisdictions like
              Germany and France imposes rigid statutory rest periods and night-work premiums, turning compliance into
              an operational prerequisite for mission-critical uptime. However, adoption encounters material frictions:
              aggressive acquisition-driven expansion has created user interface integration hurdles and customer
              support scaling bottlenecks. Furthermore, enterprise migration involves substantial switching costs, and
              the absence of disclosed audited gross margins across product lines leaves long-term unit economics
              subject to ongoing diligence.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Direct Global Payroll Expansion Multiplies Deel's Addressable Spend
            body: >-
              Expanding beyond Employer of Record into direct payroll processing for companies with existing legal
              entities unlocks a $40 billion annual addressable market—roughly eight times the size of the standalone
              EOR market. Because direct payroll currently represents only 15% of Deel's revenue, penetration of
              enterprise customer subsidiaries represents the company's highest-velocity organic expansion vector.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: Cross-Border Regulatory Enforcement Creates Both Driver and Liability
            body: >-
              Heightened regulatory scrutiny regarding worker misclassification and statutory employment obligations in
              key jurisdictions forces distributed organizations to adopt automated compliance platforms. However,
              operational complexity in shift-based environments and precedent liabilities exceeding $100 million
              illustrate the material compliance exposure that Deel assumes on behalf of its global clients.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Global Employment Architecture and Direct Competitor Landscape
        blocks:
          - type: paragraph
            body: >
              The competitive landscape for global employment and payroll divides across distinct architectural models
              rather than pure price competition. Deel's core business model originated in contractor management and
              expanded into international Employer of Record (EOR), multi-country payroll, and lightweight HRIS across
              150+ countries. In the direct global EOR segment, Deel's primary competitors are Remote, Rippling, Papaya
              Global, Multiplier, and legacy provider Globalization Partners (G-P). Buyers evaluate alternatives based
              on legal entity ownership, implementation speed, domestic payroll cohesion, and total operational cost.


              Direct competitor architectures exhibit critical divergences. While Deel operates an owned-entity network
              of 110+ to 130+ direct legal entities supplemented by partner networks, Remote emphasizes an
              owned-entity-first model across 75+ countries to ensure direct IP assignment and uniform service delivery.
              In contrast, Rippling approaches global expansion from a unified domestic HR, IT device management, and
              finance spine, positioning international EOR and global payroll as modular extensions on an existing
              system of record. Legacy enterprise providers such as G-P emphasize enterprise compliance guarantees but
              maintain higher quote-based fee structures.


              Beyond full-stack EOR providers, status-quo alternatives, internal entity formation, and specialized
              payroll aggregators form an active ceiling on pricing power. Growing international enterprises frequently
              evaluate whether to retain an EOR provider or establish foreign direct entities once local headcount
              exceeds 15 to 25 employees in a given jurisdiction. In addition, small-business domestic platforms like
              Gusto outsource international employment to Remote, creating indirect channel distribution while defending
              domestic payroll turf.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
