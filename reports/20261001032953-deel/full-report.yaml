    title: Recommendation logic
    type: flow
    summary: >-
      The decision moves from a verified financing mark and company-issued scale claims through evidence-quality and
      downside gaps to a research-more stance.
    data:
      nodes:
        - id: round-mark
          label: $17.3B Series E mark
          detail: The October 2025 financing is the clearest observed price reference.
        - id: scale-claims
          label: Company-issued scale proof
          detail: Deel reported more than $1B ARR, sustained profitability, and 40,000+ customer companies.
        - id: operating-moat
          label: Owned infrastructure claim
          detail: The company said its payroll engine was live in more than 55 countries.
        - id: evidence-limit
          label: Independent evidence limit
          detail: Public market-data sources confirm the round mark but not audited operating economics.
        - id: downside-gap
          label: No defensible public floor
          detail: Current cap-table rights, executable secondary pricing, and downside cash economics are unavailable.
        - id: decision
          label: Research more
          detail: Set entry price and return targets only after financial, legal, and cap-table diligence.
