      - number: '5.2'
        title: Owned payroll infrastructure connected to an expanding ecosystem
        blocks:
          - type: paragraph
            body: >-
              The clearest public architecture thesis is vertical integration: a16z reports that Deel built global
              payroll from the engine through the application layer and uses owned infrastructure to reduce handoffs,
              standardize country data, and expose a unified workforce view. Around that core, Deel says customers can
              connect through more than 110 integrations and APIs, while a current product-design role identifies APIs,
              developer experience, a Partners Portal, an App Store, internal operations tooling, and Ops Connect as
              distinct connectivity surfaces. Celigo independently demonstrates that Deel can sit inside payroll, time,
              onboarding, performance, self-service, and expense workflows. Public evidence therefore supports a layered
              operating model, but not the actual service topology, data model, API availability, latency, or
              fault-isolation characteristics.
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE009
