  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A modular product surface organized around the worker lifecycle
        blocks:
          - type: paragraph
            body: >-
              Deel presents one customer surface for hiring, managing, paying, and equipping international workers, but
              the underlying offer is a portfolio rather than a single workflow. Its current materials place Contractor,
              Employer of Record, Payroll, Global HRIS, mobility, benefits, equity, talent, performance, IT
              provisioning, and managed services along a customer's progression from first overseas hire to global
              enterprise. That modularity gives buyers multiple entry points and a path to consolidate adjacent systems
              without requiring a full-suite replacement on day one. An independent software review confirms the basic
              cross-border payroll and compliance positioning, though it provides little technical validation. The
              resulting product advantage is breadth plus a common worker-data context; the corresponding risk is uneven
              maturity across modules assembled through internal development and acquisitions.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE015
          - type: table
            tableRef: TE001
