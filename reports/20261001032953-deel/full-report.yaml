              - CO005
              - CO009
              - CO013
      - number: '1.2'
        title: Leadership Architecture, Governance, and Key-Person Dynamics
        blocks:
          - type: paragraph
            body: >-
              Deel operates under executive leadership led by Co-founder and Chief Executive Officer Alex Bouaziz and
              Co-founder and Chief Revenue Officer Shuo Wang. Both founders maintain technical backgrounds from MIT and
              previously launched and exited startups before founding Deel. Executive governance has emphasized owning
              every inch of the operating chain, driving an engineering-centric philosophy that prioritizes owned local
              legal entities over outsourced third-party administrative brokers. Early executive operations were scaled
              alongside former Chief Operating Officer Dan Westgarth, who helped institutionalize operational speed and
              client escalation protocols. Key-person dependence remains centered on Bouaziz, who actively drives
              product strategy, fundraising, and enterprise escalation resolution, while Wang oversees commercial
              expansion and revenue operations across global enterprise accounts.
            claimRefs:
              - CO001
              - CO003
