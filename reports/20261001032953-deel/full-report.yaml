              - CO001
              - CO009
              - CO010
              - CO013
      - number: '1.4'
        title: Product Evolution, Platform Scope, and Operational Milestones
        blocks:
          - type: paragraph
            body: >-
              Deel's platform has evolved systematically from contractor compliance and digital agreements into a
              multi-product global employment suite spanning Employer of Record, Contractor of Record, Global Payroll,
              Deel IT device lifecycle management, and mobility visa services. Pricing transparency is maintained
              through published benchmark tiers, including $49 per contractor monthly, $29 per employee monthly for
              global payroll, and $599 per employee monthly for standard EOR services. While Deel benefits from
              automated compliance workflows and broad multi-currency settlement rails, competitive vulnerabilities
              persist. Budget-conscious early-stage startups frequently evaluate lower-cost alternatives like Remote,
              while enterprises scrutinize workforce platform boundaries against broader IT providers like Rippling. In
              2026, Deel expanded into operationally complex environments with Deel Field Services and announced
              embedded AI agents across payroll and HR operations.
