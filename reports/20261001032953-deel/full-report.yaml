  - id: FO001
    title: Deel Corporate Evolution and Platform Milestone Timeline
    type: timeline
    summary: >-
      Key corporate, financing, and product milestones from founding in 2019 through enterprise scaling and AI agent
      launches in 2026.
    data:
      items:
        - date: 2019-01
          label: Founding and YC Launch
          detail: Alex Bouaziz and Shuo Wang establish Deel and complete Y Combinator to solve global contractor compliance.
          tone: positive
        - date: 2019-09
          label: Initial EOR Deployment
          detail: Expands beyond contractor agreements to launch formal Employer of Record services in Canada and the UK.
          tone: positive
        - date: 2020-05
          label: Series A Financing
          detail: Raises $14 million led by Andreessen Horowitz to build out the proprietary international payroll platform.
          tone: positive
        - date: 2020-09
          label: Series B Financing
          detail: Secures $30 million led by Spark Capital following rapid remote-work adoption during the pandemic.
          tone: positive
        - date: 2021-04
          label: Series C Unicorn Milestone
          detail: Closes $156 million Series C led by YC Continuity at a $1.25 billion valuation.
          tone: positive
        - date: 2021-10
          label: Series D Growth Round
          detail: Raises $425 million co-led by Coatue and DST Global at a $5.5 billion valuation.
          tone: positive
        - date: 2022-05
          label: Strategic Extension Round
          detail: Secures $50 million investment led by Emerson Collective at a $12 billion valuation.
          tone: positive
