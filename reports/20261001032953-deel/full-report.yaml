      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Owned Infrastructure Drives Margin Expansion Beyond Traditional EOR
            body: >-
              Deel's direct ownership of more than 250 local legal entities enables it to internalize compliance margins
              and avoid margin splitting with third-party in-country partners, supporting an estimated 85% gross margin
              profile.
            calloutType: insight
            claimRefs:
              - CI007
              - CI008
          - type: callout
            title: Secondary Market Valuation Disconnect Highlights Underwriting Uncertainty
            body: >-
              A 17% discount in secondary trading relative to the $17.3 billion Series E benchmark, coupled with
              supply-demand imbalances and lack of segmented audited margins, presents downside risk for late-stage
              investors.
            calloutType: risk
