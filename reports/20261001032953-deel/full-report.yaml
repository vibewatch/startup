chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding History, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Deel was founded in 2019 by Alex Bouaziz and Shuo Wang following their personal operational frustrations
              with international hiring barriers and regulatory friction. Emerging from Y Combinator, the company
              originally established a platform for cross-border contractor management before launching Employer of
              Record (EOR) services to employ international personnel without requiring foreign subsidiary setup. Over
              the subsequent seven years, Deel expanded into an integrated operating system for global employment
              covering over 150 countries. The corporate platform automates the entire payroll stack through vertically
              integrated software that handles onboarding, local payroll, statutory benefits, tax filings, and
              multi-currency disbursement in 120+ currencies. In 2026, Deel introduced agentic workflow automations and
              specialized shift compliance across its global workforce infrastructure.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO010
              - CO015
          - type: table
            tableRef: TO001
