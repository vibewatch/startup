      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical Integration as Infrastructure Moat
            body: >-
              Deel's foundational thesis—that owning every inch of the international employment and banking rails is
              necessary to guarantee service level agreements—fundamentally distinguishes it from traditional legacy
              payroll providers that rely on third-party in-country brokers. By controlling over 250 local legal
              entities worldwide and engineering direct integrations into domestic payment and clearing systems, Deel
              achieves software-level unit margins while maintaining real-time auditability across diverse labor
              jurisdictions.
            calloutType: insight
            claimRefs:
              - CO003
              - CO004
              - CO010
          - type: callout
            title: Competitive Escalation and Specialized Legal Exposure
            body: >-
              As the global employment and HR tech market matures, competitive rivalry has intensified beyond standard
              software marketing into active intellectual property and trade-secret litigation, such as Rippling's
              lawsuit against Deel. Simultaneously, as Deel expands into high-consequence on-site operations and data
              center shift management, strict statutory rest intervals, overtime multipliers, and worker
              reclassification liabilities demand substantial legal oversight across disparate international regulatory
              regimes.
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
              - CO014
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Deel operates at the convergence of three distinct spend categories: cross-border contractor management,
              Employer of Record (EOR) infrastructure, and direct multi-country payroll processing. The market boundary
              is fundamentally defined by software automation and regulatory risk intermediation rather than physical
              staffing agency placement. Included spend encompasses foreign worker gross wages, localized statutory tax
              withholdings, mandatory benefits administration, and software subscription fees. Conversely, permanent
              commercial real estate leases, localized corporate entity formation fees, and specialized enterprise ERP
              financial licensing are excluded from platform spend. Historically, organizations addressed international
              expansion through cumbersome status-quo substitutes: establishing local corporate subsidiaries at costs
              exceeding $50,000 per country, engaging expensive legacy staffing agencies, or making unvetted
              international wire transfers that triggered severe misclassification exposure.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
      - number: '2.2'
        title: 'Market Sizing Lenses: EOR, Global Payroll, and Spend Boundaries'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Deel's addressable market requires distinct analytical lenses rather than a single monolithic
              estimate. The global Employer of Record services market represented a $3.2 billion base in 2023 and is
              projected to expand at a 15% to 20% compound annual growth rate to $6.0 billion by 2027. Within this core
              EOR segment, Deel holds an estimated 15% to 20% market share, generating over $800 million in ARR by early
              2026. However, direct global payroll processing for enterprises with existing international subsidiaries
              expands the serviceable market eightfold to roughly $40 billion annually. Although direct payroll
              currently contributes only 15% of Deel's revenue, it positions the platform to compete directly with
              legacy providers such as ADP and Workday. Meanwhile, broader contractor payment volume across global
              knowledge work represents $1.4 trillion in annual liquidity, though Deel captures only transactional
              software and FX spread fees.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
              - CM014
