      - number: '1.3'
        title: Capitalization History, Valuation Progression, and Stakeholder Mapping
        blocks:
          - type: paragraph
            body: >-
              Deel has secured $945 million in cumulative equity funding across successive financing rounds led by
              top-tier venture capital and institutional investors. After securing seed capital and a $14 million Series
              A led by Andreessen Horowitz in May 2020, Deel raised a $30 million Series B led by Spark Capital in
              September 2020. In April 2021, the company achieved unicorn status with a $156 million Series C led by YC
              Continuity at a $1.25 billion valuation, followed by a $425 million Series D in October 2021 co-led by
              Coatue and DST Global at a $5.5 billion valuation. In May 2022, Emerson Collective led a $50 million
              strategic round valuing Deel at $12 billion. Most recently, in October 2025, Deel closed a $300 million
              Series E co-led by Ribbit Capital and Andreessen Horowitz, establishing a $17.3 billion post-money
              valuation.
            claimRefs:
              - CO009
              - CO013
          - type: table
            tableRef: TO003
