    rows:
      - ["Experience layer", "HRIS, payroll, contractor, EOR, IT, and AI workflows", "Shared worker and company context", "Different product surfaces may remain inconsistent"]
      - ["Connectivity layer", "APIs, integrations, App Store, Partners Portal, and developer experience", "External systems, documentation, mappings, and partner quality", "Unknown API coverage, versioning, observability, and error budgets"]
      - ["Workflow and automation layer", "Onboarding, approvals, time capture, compliance prompts, and support automation", "Correct customer inputs plus human review for exceptions", "Automation can scale incorrect data or policy interpretation"]
      - ["Payroll application and engine", "Country calculations, payroll cycles, corrections, and normalized reporting", "Local rules, accurate records, banking rails, and cutoff discipline", "No independent accuracy, latency, or resilience benchmark"]
      - ["Employment infrastructure", "Owned entities and trusted EOR partners provide local delivery", "Country-specific entity, partner, contract, and benefits coverage", "Service quality and control may vary by delivery model"]
      - ["Governance and trust controls", "Roles, approval chains, audit logs, privacy, and security programs", "Control implementation and certification scope", "Only company-asserted certification evidence is present in the assigned pool"]
      - ["Acquired product backends", "Accelerate payroll, talent, compensation, and IT capability", "Post-acquisition data and code integration", "Temporary backend coexistence can create fragmentation and migration risk"]
    notes: "This is an evidence-bounded operating model, not a representation of Deel's internal service topology; unobserved implementation details are deliberately omitted."
    claimRefs: ["CE004", "CE005", "CE006", "CE010", "CE011", "CE012"]
