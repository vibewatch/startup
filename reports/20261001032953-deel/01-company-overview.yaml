callouts:
  - calloutType: "insight"
    title: "Vertical Integration as Infrastructure Moat"
    body: "Deel's foundational thesis—that owning every inch of the international employment and banking rails is necessary to guarantee service level agreements—fundamentally distinguishes it from traditional legacy payroll providers that rely on third-party in-country brokers. By controlling over 250 local legal entities worldwide and engineering direct integrations into domestic payment and clearing systems, Deel achieves software-level unit margins while maintaining real-time auditability across diverse labor jurisdictions."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO010"
  - calloutType: "risk"
    title: "Competitive Escalation and Specialized Legal Exposure"
    body: "As the global employment and HR tech market matures, competitive rivalry has intensified beyond standard software marketing into active intellectual property and trade-secret litigation, such as Rippling's lawsuit against Deel. Simultaneously, as Deel expands into high-consequence on-site operations and data center shift management, strict statutory rest intervals, overtime multipliers, and worker reclassification liabilities demand substantial legal oversight across disparate international regulatory regimes."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO014"
      - "CO016"
