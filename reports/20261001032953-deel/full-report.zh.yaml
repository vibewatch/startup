  - id: FI001
    title: 收入模型拆解与传导
    type: waterfall
    summary: 单个标准名义雇主（EOR）席位月度单位经济效益测算，展示从平台毛账单到营业利润率的传导路径。
    data:
      items:
        - label: 平台毛服务费
          value: 599
        - label: 本地实体与法务间接成本
          value: -45
        - label: 银行及外汇支付处理成本
          value: -25
        - label: 毛贡献额
          value: 529
        - label: 平台工程与 AI 工具成本
          value: -110
        - label: 营业净利率代理值
          value: 419
    approximationNotes: 基于报告的 85% 毛利率特征及共享基础设施开销，测算标准 EOR 席位（官方目录价 599 美元）的月度单位经济效益。
    claimRefs:
      - CI004
      - CI007
      - CI008
  - id: FE001
    title: 基于确凿证据的产品架构栈
    type: stack
    summary: 分层梳理公开可证的产品、连接性、工作流、薪资以及雇佣基础设施。
    data:
      layers:
        - label: 客户与运营人员交互层
          detail: 面向 HR 管理员、财务、业务主管、员工、开发者、合作伙伴及 Deel 运营团队的交互界面。
          items:
            - label: 全球 HR 与薪资应用
              detail: 涵盖合同工、EOR、薪资、HRIS、全球调配、福利、股权、绩效管理及 IT 资产。
            - label: AI 辅助运营
              detail: 涵盖 Deel AI、Ops Connect、客户支持助手及企业专属劳动力洞察。
        - label: 连接与工作流层
          detail: 用于连接外部系统并编排任务流程的接口体系。
          items:
            - label: API、应用商店与合作伙伴门户
              detail: Deel 招聘资料中所述的面向开发者与合作伙伴的分发渠道。
            - label: 系统集成与自动化
              detail: 连接 HR、ERP、ATS、安全、工时、入职、绩效及报销系统的对接能力。
        - label: 知识与赋能层
          detail: 为外部开发者与内部运营人员提供文档支持及本地化产品知识沉淀。
          items:
            - label: 开发者文档
              detail: 重点投入建设的 API、系统集成及开发者工作流内容。
            - label: 产品知识库
              detail: 通过发版说明、应用内指引及可复用指南沉淀产品专业知识。
        - label: 处理与控制层
          detail: 将劳动力事件转化为受控薪资发放与合规雇佣动作的核心系统。
          items:
            - label: 薪资引擎与标准化国家数据
              detail: 官方提及的从引擎底层贯穿至应用层的端到端处理能力。
            - label: 审批流、审计日志与合规更新
              detail: 人工审批与客户履责仍是内控环境不可或缺的组成部分。
        - label: 信任与治理层
          detail: 依托安全合规框架与审批权限控制，管控敏感劳动力及薪资数据。
          items:
            - label: 基于角色的审批与审计线索
              detail: 公司资料描述了审批链与审计就绪型日志。
            - label: 认证与隐私计划
              detail: 控制有效性仍有待审查底层审计工作底稿。
        - label: 本地交付基础设施
          detail: 国家层面的法律与运营基石。
          items:
            - label: 自有实体与薪酬基础设施
              detail: 公司控股实体与自研薪酬引擎被列为核心差异化优势。
            - label: 合作伙伴与收购后台
              detail: 合作伙伴交付与过渡期收购系统带来了不确定的外部依赖。
    approximationNotes: 概念性架构仅基于公开描述；不构成对内部服务边界、部署拓扑或控制有效性的断言。
    claimRefs:
      - CE004
      - CE006
      - CE010
      - CE011
      - CE012
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从最初的跨国独立承包商入职，到深度的多国薪酬集成与模块扩展的企业多阶段旅程。
    data:
      items:
        - label: 1. 跨境承包商获取
          detail: 解决紧急自由职业者入职与合规跨境合同的最初自助服务切入点。
          touchpoints:
            - 自助生成合同
            - W-8BEN / W-8BEN-E 税务表单收集
            - 多币种数字钱包注资
        - label: 2. 跨国承包商支付自动化
          detail: 统一分布式承包商群体的经常性发票对账与批量付款。
          touchpoints:
            - 批量付款审批
            - 本地银行出款通道
            - 承包商错误分类筛查
        - label: 3. 全职 EOR 人才扩张
          detail: 无需设立复杂的海外法人实体即可雇佣关键跨国全职团队成员。
          touchpoints:
            - Deel 自有境内法律实体雇主支持
            - 法定养老金与健康福利管理
            - 本地化劳动法雇佣合同
        - label: 4. 多国薪酬整合
          detail: 在单一管理界面下统一自有实体的薪酬计算处理与法定税务合规。
          touchpoints:
            - 税前至税后净额直接薪酬引擎计算
            - 本地税务机关申报
            - 集中式全球薪酬日历
        - label: 5. HRIS 与核心 ERP 系统集成
          detail: 将双向薪酬与人员编制同步嵌入企业核心记录系统。
          touchpoints:
            - Workday 官方认证的双向薪酬连接器
            - NetSuite 总账薪酬实际发生额同步
            - 单点登录与基于角色的访问控制
        - label: 6. 平台扩展与实体用工运营
          detail: 将平台覆盖范围扩展至全球 IT 设备物流、商务移民及轮班工作合规。
          touchpoints:
            - Deel IT 设备采购与回收
            - 全球商务签证与人员流动办理
            - 外勤 EOR 全天候轮班休息时段跟踪
    claimRefs:
      - CU003
      - CU006
      - CU008
      - CU012
