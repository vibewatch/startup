  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 决策路径从经过验证的融资估值基准与公司发布的规模主张出发，穿透证据质量与下行情景缺口，最终得出“进一步深入研究”的审慎立场。
    data:
      nodes:
        - id: round-mark
          label: $17.3B Series E 估值
          detail: 2025年10月的融资是所观察到的最明确价格参考。
        - id: scale-claims
          label: 官方规模佐证
          detail: 据 Deel 报告，ARR 超过 $1B，持续盈利，客户企业达 40,000+ 家。
        - id: operating-moat
          label: 自有基础设施主张
          detail: 公司称其薪酬引擎已在超过 55 个国家上线运行。
        - id: evidence-limit
          label: 独立证据局限
          detail: 公开市场数据来源证实了该轮估值，但无法证实经审计的运营财务数据。
        - id: downside-gap
          label: 缺乏公开估值底线
          detail: 当前股权结构表权益、可执行的二级市场定价以及下行现金经济模型均未公开。
        - id: decision
          label: 进一步深入研究
          detail: 仅在完成财务、法律与股权结构表尽调后，再行设定入场价格与回报目标。
    approximationNotes: 这是一个定性决策链；不估算转化率、概率或估值区间。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
      - CV013
      - CV016
