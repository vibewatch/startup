      - number: '1.5'
        title: 展品
        blocks:
          - type: callout
            title: 垂直整合构成基础设施护城河
            body: >-
              Deel 的核心立论在于：必须全面掌控跨国雇佣与银行结算链条的每一个环节，才能确保服务级别协议（SLA）的兑现。这一理念使其与依赖第三方本地中介的传统薪资服务商形成根本区隔。通过在全球控制 250
              多个本地法人实体，并自主研发与各国本土支付及清算系统的直接集成，在保持对多国劳工管辖区实时可审计性的同时，实现了软件级别的单位毛利率。
            calloutType: insight
            claimRefs:
              - CO003
              - CO004
              - CO010
          - type: callout
            title: 竞争升级与专项法律风险敞口
            body: >-
              全球雇佣与人力资源科技市场步入成熟期，行业竞争已超越常规软件营销范畴，升级为知识产权与商业机密层面的直接法律诉讼（例如 Rippling 起诉 Deel）。与此同时，Deel
              进军高责任现场运营与数据中心排班管理领域，面对不同国家的异构监管体系，严格的法定休息间隔、加班倍率与员工重新分类责任，都需要大量的法律合规把控。
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
              - CO014
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Deel
              的业务处于三项不同预算支出的交汇点：跨国合同工管理、名义雇主（EOR）基础设施以及多国直接薪资核算。其市场边界本质上由软件自动化与监管风险隔离界定，而非实体劳务派遣机构的人才派驻。平台涵盖的支出包括海外员工税前工资、本地法定预扣税、强制性福利管理以及软件订阅费用；相反，长期商业地产租赁、本地法人实体设立规费以及专业企业
              ERP 财务授权费用，则不属于平台支出范畴。过去，企业跨国扩张往往依赖繁琐的替代方案：在单一国家耗费超过 $50,000
              设立海外子公司、聘用收费昂贵的传统人力派遣机构，或直接用未经合规审查的国际电汇支付报酬，从而带来严重的员工分类错误法律风险。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
      - number: '2.2'
        title: 市场测算视角：EOR、全球薪资与支出边界
        blocks:
          - type: paragraph
            body: >-
              判断 Deel 的目标市场，不能只看一个总量，而要分层测算。全球名义雇主（EOR）服务市场 2023 年规模为 $3.2 billion，预计将以 15% 至 20% 的复合年增长率增至 2027 年的 $6.0
              billion。核心 EOR 市场中，Deel 的估算份额为 15% 至 20%，到 2026 年初 ARR 已超过 $800 million。对于已设海外子公司的企业，跨国直接薪资处理把可服务市场扩至每年约
              $40 billion，约为独立 EOR 市场的八倍。直接薪资目前仅占 Deel 收入的 15%，却让平台能与 ADP 和 Workday 等传统厂商正面竞争。全球知识工作者的合同工支付规模更达每年 $1.4
              trillion，但 Deel 只能收取交易软件费和外汇点差。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
              - CM014
