      - number: '7.4'
        title: 财务模型风险、缓解架构与投资逻辑失效诱因
        blocks:
          - type: paragraph
            body: >-
              Deel 营收增长强劲，但单位定价始终敏感，组织扩张也有风险。名义雇主（EOR）定价为每名员工每月 $599，合同工席位每月
              $49；一体化软件与自建实体网络支撑了这一溢价。高价却会拖累预算敏感型初创企业的留存：企业进入降本周期，客户可能转向 Native Teams、Multiplier 等更便宜的 EOR 服务商。Deel
              要在数百个法定司法管辖区服务超过 40,000 家客户，运营节奏必须极快。内部强调快速上线功能、每季度动态调整优先级，并由高管直接把控产品。这样的速度拓宽了全球福利、IT
              设备配置等新垂直产品，却也挤压客户成功团队的响应能力；跨多国开展复杂企业级交付时，质量可能下滑。潜在投资者出资前应设否决条件：未决 RICO 诉讼出现不利判决或大额和解；核心市场监管机构就 Deel
              防范合同工身份误分类的措施采取执法行动；经审计毛利率跌破 SaaS 行业可持续基准。
            claimRefs:
              - CR008
              - CR009
              - CR014
              - CR015
      - number: '7.5'
        title: 专题图表
        blocks:
          - type: callout
            title: 用工分类诉讼与实体护城河脆弱性
            body: >-
              相较早期聚合服务商，Deel 旗下 150+ 家自建实体网络提供了可观的法律保护，但北美与西欧持续推进的法定用工重分类审查仍构成生死攸关的风险敞口。一旦出现单个不利判例，判定 Deel 承包商分类评估无效，或否定
              EOR 责任转嫁机制，便可能触发追溯性薪酬税补缴重核并冲击客户留存。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              投资建议为继续研究，置信度中，风险评级高，公开证据口径下估值偏高。乐观看法有充分支撑：Deel 宣布以 $17.3 billion 估值完成 $300 million 的 Series E
              轮融资；此前公司称其已突破 $1 billion 年经常性收入（ARR）、连续三年实现盈利，并在 2025 年 9 月创下首个单月营收超 $100 million 的纪录。当前官网亦称拥有超过 40,000
              家客户企业。但这些经营指标均由公司自行披露，指定公开证据未提供经审计的盈利能力、毛利率、留存率、现金流或股权稀释数据。因此，新投资不应单凭融资轮次的表面估值作出投资决策；决策必须保持价格敏感，并以非公开财务和股权结构表尽调为前提。
