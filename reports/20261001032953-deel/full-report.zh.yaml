  - number: 4
    title: 财务状况
    sections:
      - number: '4.1'
        title: 营收来源、定价体系与变现模式
        blocks:
          - type: paragraph
            body: >
              Deel 的收入模型在架构上与传统人力资源 SaaS
              服务商截然不同，除单人席位订阅费外，还根据员工人数、跨国地理分布以及法人实体数量进行变现。该平台毛利最高、扩张最快的引擎是名义雇主（EOR）业务，标准版收取每人每月 $599
              的周期性平台费，包含定制条款的企业级服务收费最高可达每人每月 $899。这笔周期性平台费涵盖了通过 Deel
              自持实体完成的法定雇佣、员工入职、法定合规与薪资发放，但不包含由客户全额承担的税前工资、雇主端薪资税和当地强制性福利——这些法定成本通常会在基准薪资之上再增加 13% 至 40%。除 EOR 外，Deel
              按照每名合同工每月 $49 收取跨国合同工管理费；在客户已自行设立法人实体的国家，则按每名员工每月 $29 计收跨国直接薪资核算费。为了做大漏斗顶端转化，Deel 针对 200 人以内的企业免费提供免费版 HR
              平台（Deel HR），将基础员工档案管理打造成内生漏斗，引导客户购买高客单价的跨境雇佣与合同工合规模块。在竞标采购环境中，Deel 每月 $599 的标准 EOR 定价高于 Rippling（其 EOR
              插件每月约 $499），与 Papaya Global 的标价持平，但 Deel 拥有更扎实的底层自持实体基础。
            claimRefs:
              - CI004
              - CI005
