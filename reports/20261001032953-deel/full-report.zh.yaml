      - number: '8.2'
        title: 融资背景与可比性
        blocks:
          - type: paragraph
            body: >-
              三份指定的市场数据来源均认可 $17.3 billion 的 Series E 估值，但其统计的累计融资总额恰恰说明：绝不能把公开数据库当成股权结构表。Tracxn 报告 8 轮融资共计 $986
              million；FundedIQ 档案仅收录了已披露的 $300 million Series E；Forge 虽然列出 $17.3 billion
              投后估值，却另行警告其定价数据可能基于非常有限的输入信息。这种差异属于统计口径冲突，不能证明其中任一总额代表 Deel 账面的可用现金。Tracxn 虽梳理出包括 Remote、Oyster 和
              Multiplier 在内的 965 家活跃竞争对手，但收录信源未提供可比公司的营收、利润率或交易倍数。这套市场竞争图谱仅能证明竞争存在，无法构成独立估值基准。
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
