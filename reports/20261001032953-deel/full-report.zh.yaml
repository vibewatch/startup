      - number: '3.3'
        title: 定价透明度、隐性加价与护城河持久度
        blocks:
          - type: paragraph
            body: >
              全球劳动力管理行业的定价模式呈现两极分化，一类是公开透明的挂牌价，另一类则是针对大型企业的不透明询价制。Deel 公布的标准公开定价包括：EOR 每人每月 $599、合同工每人每月
              $49、名义承包商（COR）每人每月 $325，以及自持实体全球薪资每人每月 $29。Deel HR 针对 200 人以内的团队免费开放，为捕获早期企业客户建立了强大的获客杠杆。


              然而，客户尽调暴露出大量隐性收费环节，使得实际综合用工成本比平台基础费用高出 30% 至 60%。这些隐性成本包括：占用营运资金的强制性一个月税前工资押金；跨境薪水发放时 0.6% 至 2.0%
              的外汇（FX）点差；以及在法国、巴西、印度等强监管市场中，每月 $50 至 $150 不等的属地化合规附加费。此外，跨国派遣与签证代办业务每月还会向每位员工额外收取 $300 至 $500。


              迁移成本呈现出显著的不对称性。合同工管理在不同平台间迁移仅需适度的行政手续；但迁移 EOR 员工则牵涉法定合同主体变更（novation）、属地化离职与重新入职流程，以及法定福利迁移。一旦客户的 EOR
              员工规模超过 10 人，这道合同变更门槛便会形成极强的客户锁定效应。尽管如此，基础薪资软件的大宗商品化、风投系新势力的大幅价格战，以及跨国团队成熟后转向自行设立法人实体的趋势，仍在持续削弱其护城河深度。
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP014
              - CP015
              - CP016
