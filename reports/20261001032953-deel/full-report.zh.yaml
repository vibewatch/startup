      - number: '2.3'
        title: 买方画像、采购工作流与预算归属
        blocks:
          - type: paragraph
            body: >-
              不同规模客户的采购机制与预算归属存在显著差异。在获得风投支持的早期初创企业中，采购通常由创始人或人才负责人直接拍板，几天内即可完成跨大洲分布式工程师的入职流程，省去设立海外实体的环节。在员工规模为 100 至
              1,000 人的中型成长期企业中，预算审批权转至人力副总裁（VP of
              People）与首席财务官（CFO），核心诉求在于化解合同工分类错误风险并统一分散的跨国福利体系。到了大型企业层级，采购决策由首席人力资源官（CHRO）、全球薪资总监及财务总监（Corporate
              Controller）主导，重点考察深度的 ERP 双向集成、定制化安全治理及多国合并报表能力。此外，针对数据中心轮班作业等 24/7
              关键现场运营团队，基础设施负责人也会介入采购，核心诉求是严格保障法定轮班休息间隔，防止停机故障发生。
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 采用催化剂、监管执法与尽调约束
        blocks:
          - type: paragraph
            body: >-
              分布式知识型工作的常态化结构变迁，叠加跨国监管执法的持续收紧，共同驱动市场扩张。北美、欧洲和拉丁美洲的劳工主管机构加大对雇佣性质判定的打击力度，开出多起备受关注的罚单，和解金额超过 $100
              million。在德国和法国等司法辖区运营复杂的 24/7
              技术团队，面临极为严苛的法定休息时间和夜班补贴规定，使得合规成为保障关键业务连续性的前置条件。但产品推广依然面临实质性阻碍：激进的并购式扩张带来了前端用户界面的整合难题，也造成了客户支持服务的扩容瓶颈。此外，大型企业迁移面临极高的切换成本，加之各产品线缺乏经审计的毛利率披露，长期单位经济模型仍有待持续尽调核实。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 直接全球薪资业务拓展使 Deel 的目标支出空间成倍放大
            body: >-
              Deel 从名义雇主（EOR）拓展到为已有海外实体的企业处理直接薪资，打开了每年 $40 billion 的潜在市场，约为独立 EOR 市场的八倍。直接薪资目前仅占 Deel 收入的
              15%，向大型企业客户的海外子公司渗透，因而成为公司增长最快的内生扩张路径。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: 跨国监管执法兼具驱动引擎与法律责任双重属性
            body: >-
              重点司法辖区对雇佣性质错误与法定用工义务的监管日趋严厉，倒逼分布式团队采用自动化合规平台。然而，轮班环境的运营复杂度以及超过 $100 million 的先例赔偿金额，也暴露出 Deel
              代替全球客户承担的重大合规法律敞口。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 全球雇佣技术架构与直接竞争格局
        blocks:
          - type: paragraph
            body: >
              全球雇佣与薪资核算的竞争格局分化为截然不同的架构路线，而非单纯的价格比拼。Deel 的核心商业模式始于合同工管理，随后拓展至跨越 150+ 个国家的名义雇主（EOR）、多国薪资核算与轻量级 HRIS。在直接全球
              EOR 赛道中，Deel 的主要竞品包括 Remote、Rippling、Papaya Global、Multiplier 以及老牌服务商 Globalization
              Partners（G-P）。买方在方案比选时，主要权衡法人实体自持程度、交付上线速度、本土薪资整合度以及整体运营成本。


              直接竞品在底层架构上存在关键分歧。Deel 运营着由 110+ 至 130+ 个自持法人实体构成并辅以合作伙伴的网络，而 Remote 则在 75+
              个国家坚守自持实体优先策略，以确保知识产权直接归属并保证服务交付的一致性。相比之下，Rippling 依托本土 HR、IT 设备管理和财务的统一中枢切入全球化，将跨国 EOR
              与全球薪资视作核心记录系统之上的模块化延伸。以 G-P 为代表的传统企业级服务商主打合规担保，但维持着较高的询价制收费模式。


              除全栈 EOR 服务商外，企业内部自行设立实体、现状替代方案及专业薪资聚合商，对行业定价权构成了实质上限。处于成长期的大型跨国企业，一旦在特定司法管辖区的本地员工规模超过 15 至 25
              人，往往会重新评估是继续沿用 EOR 服务商，还是直接在当地设立外资实体。此外，Gusto 等服务于小微企业的本土平台将跨国雇佣业务转包给 Remote，既借此建立分销渠道，又守住了本土薪资核心腹地。
            claimRefs:
