      - number: '5.3'
        title: 工作流自动化仍高度依赖客户内部管控与操作规范
        blocks:
          - type: paragraph
            body: >-
              Deel 的产品兼具软件自动化、名义雇主法定资质与线下运营服务。其针对现场作业 EOR 的业务指引明确界定了权责边界：Deel
              负责履行业务范围内的法定雇主职责及薪资税务处理，而排班合规性、工时审批、日常管理及工作场所安全义务仍由客户自行承担。工时追踪功能虽能记录班次、执行提交与审批流程，并将其转化为符合各国规定的薪资计算规则，但准确计算的前提依然仰赖客户的正确输入。据
              a16z 报告，自动化机制已将一线人员从具体经办人转变为审核复核者，AI 聊天机器人亦将客服工单量削减了
              50%；然而这只是表明杠杆效率的方向性证据，并非经第三方独立评测的服务级别产出。虽然官网宣称的业务规模彰显了生产环境的成熟度，但现有材料中并未包含系统可用性历史、事故分类统计、灾备恢复目标、API
              性能指标或经独立测试的核算准确率基准。
            claimRefs:
              - CE010
