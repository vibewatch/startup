              - CO009
              - CO010
              - CO013
      - number: '1.4'
        title: 产品演进、平台范畴与运营里程碑
        blocks:
          - type: paragraph
            body: >-
              Deel 的平台从最初的合同工合规与电子协议，系统化演进为涵盖名义雇主（EOR）、名义承包商（COR）、全球薪资、Deel IT
              设备全生命周期管理及人员流动签证服务的多产品全球雇佣套件。公司公开基准价格，保持定价透明，包括每名合同工每月 $49、全球薪资每名员工每月 $29，以及标准 EOR 服务每名员工每月 $599。虽然 Deel
              受益于自动化合规工作流与广泛的多币种结算通道，但竞争劣势依然存在。注重预算的早期初创企业经常评估 Remote 等低成本替代方案，而大型企业则对照 Rippling 等更广泛的 IT
              服务商审视其劳动力平台边界。2026 年，Deel 推出 Deel Field Services 进军运营复杂的现场工作环境，并宣布在薪资核算与人事运营中全面嵌入 AI Agent。
