        label: 平台与 HRIS 业务广度（从单一垂直方案到统一劳动力套件）
        min: 0
        max: 10
      yAxis:
        label: 法人实体直接归属与掌控（从合作伙伴网络到全自营直属基础设施）
        min: 0
        max: 10
      points:
        - label: Deel
          x: 7.5
          'y': 8.5
          description: 覆盖全球的综合劳动力平台，拥有 110 多个自建实体，兼具合同工管理与免费 HRIS。
        - label: Rippling
          x: 9.5
          'y': 5.5
          description: 占据优势地位的一体化 HR/IT/财务平台，采用自建与合作混合的跨国实体架构。
        - label: Remote
          x: 4.5
          'y': 9
          description: 专注直雇模式的用工专家，主打自营法人实体与知识产权保护屏障。
        - label: Papaya Global
          x: 6
          'y': 4
          description: 企业级薪资与分析引擎，主要依托当地本土合作伙伴网络开展运营。
        - label: Multiplier
          x: 5
          'y': 6
          description: 区域挑战者，在亚太新兴市场及全球范围内提供高性价比定价。
        - label: Gusto
          x: 7
          'y': 2
          description: 美国本土薪资龙头，依赖与 Remote 合作提供跨国 EOR 覆盖。
        - label: 传统自建实体（DIY Entity）
          x: 2
          'y': 10
          description: 直接在当地自建企业法人，控制力绝对自主但完全缺乏开箱即用的软件整合。
