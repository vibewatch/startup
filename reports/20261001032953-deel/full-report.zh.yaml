    title: 乐观、基准与悲观情景分析表
    columns:
      - 情景
      - 核心假设
      - 估值与回报逻辑
      - 核心风险
      - 概率指示
    rows:
      - - 乐观
        - ARR 保持独立增长，现金盈利能力经审计确认，客户留存稳固，且基础设施构筑利润率优势。
        - 仅在经核实的前瞻财务数据确立具备投资价值的回报率后，高于 173 亿美元的估值溢价方可成立。
        - 增长质量存疑、跨司法管辖区执行风险，以及缺乏支撑的退出窗口期。
        - 无法根据现有的公开证据进行量化。
      - - 基准
        - 规模主张大体成立，但经审计的利润率、客户留存率及股权架构经济细节仍无法获取。
        - 仅将 173 亿美元作为参考，在保密尽调补全信息缺口前暂缓确定入场价格。
        - 为偏重人力服务、摊薄严重或难以转化为现金的增长支付过高溢价。
        - 当前最稳妥的研判立场，因现有证据仅支持规模而不支持高价。
      - - 悲观
        - 客户留存下滑、合规事件频发、利润率不及预期，或一级市场流动性持续枯竭。
        - 缺少近期二级交易与清算条款，尚无公开的下行托底估值能够成立。
        - 估值乘数压缩、清算优先权压顶、运营复杂性过高以及退出时间推迟。
        - 由尽调未达预期所触发，而非人为赋予虚构概率。
    notes: 由于数据源缺乏经审计的财务预测基准、经核实的可比乘数、概率证据或当前可执行的二级市场报价，本情景分析仅做定性评估。
