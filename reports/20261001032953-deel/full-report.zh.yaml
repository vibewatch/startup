      - number: '5.5'
        title: 展品
        blocks:
          - type: callout
            title: 核心护城河源于垂直一体化运营，而非表层 UI 的宽度
            body: 现有证据支持其从薪资引擎到顶层应用的自研模型，并辅以本地雇佣基础设施；这种架构能有效减少供应商之间的转手交接，并对跨国员工数据进行规范化整合。
            calloutType: strength
            claimRefs:
              - CE004
              - CE011
          - type: callout
            title: 生态互联仍是一项产品整合工程
            body: Deel 的招聘材料显示，开发者、合作伙伴、运营团队和客户目前所体验的系统版本各不相同，而被收购公司的后台也早于统一代码库迁移存在。
            calloutType: risk
            claimRefs:
              - CE005
              - CE007
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群结构划分与买方画像
        blocks:
          - type: paragraph
            body: >
              Deel 的客户基础已覆盖超过 40,000 家企业，客群结构正从早期的远程优先型软件初创公司，转向多元化的中型市场客户及跨国企业集团。核心采购决策人包括首席人力资源官（CHRO）、人力运营副总裁（VP of
              People
              Operations）、总法律顾问及首席财务官（CFO），核心诉求在于统一管控分布式薪资发放、跨国合同工合作关系及雇佣合规。客户早期采用主要集中在科技与软件行业，但目前新客签约已迅速扩展至专业服务、金融机构、教育培训以及机器人制造等领域。


              大企业客户群呈现出两种截然不同的运作类型：一类是利用合同工支付自动化在新兴市场快速扩张的高成长科技公司；另一类则是将属地化多国薪资深度整合至 NetSuite、Workday 等核心 ERP
              系统中的大型跨国集团。合同工管理虽然仍是自助转化的获客抓手，但大客户合作则日益依赖重度投入的大客户专属服务、认证级 ERP 系统集成，以及覆盖数十个运营司法辖区的本土化合规落地能力。
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU006
              - CU008
              - CU012
      - number: '6.2'
        title: 客户采用路径与企业级系统部署
        blocks:
          - type: paragraph
            body: >
              企业客户对 Deel 的采用路径，展现出从单一国家远程合同工结算向一体化多国薪资底座的结构性升级。Deel 并不直接替代企业本土的核心系统，而是与 Workday、NetSuite
              等主流企业核心记录系统并行运作，充当跨国薪资计算、法定税费扣缴与免设实体合规招聘的全球落地执行引擎。


              在复杂大企业客户的实际生产部署中，Deel 带来了显著的运营效率提升。大客户反馈其合同工入职周期最多缩短了
              5x，将过去分散的多国本地薪资代理商统一整合至可穿透审计的单一界面，每年节约了可观的管理费用开支。然而，该平台的采用高度受制于知识型工作者招聘的宏观周期；一旦客户缩减员工编制，就会直接拉低基于席位计费的月度
              SaaS 订阅费及薪资处理流水。
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU004
      - number: '6.3'
        title: 标杆客户部署案例与运营成效
        blocks:
          - type: paragraph
            body: >
              多起经核实的企业客户落地实践，证实了 Deel 适配不同企业运营模式的交付能力。全球金融服务机构 Barings 通过将 Deel 的全球薪资基础设施直接接入 Workday，在 18
              个国家整合了原本两家老牌薪资供应商，实现了双向数据实时同步，并获得了清晰穿透的整体用工成本视图。在软件行业，ServicePower
              借此在其海外子公司彻底废除了手工纸质薪资流程，不仅削减了管理开销，还将合同工入职周期压缩至一个月以内。


              同样，Supercoder、Taktile 和 Pudu Tech 等跨国科技企业均借助 Deel
              自持的法人实体，在未设立海外法人的情况下，于欧洲、亚太及拉美地区招募并部署专业研发和运营人员。这些实际部署不仅量化证明了设立实体周期的大幅缩短与行政管理人员的精简，但客户在应对复杂的本地专项劳动法、轮班补贴以及工会法定要求时，依然会面临持续的管辖区合规挑战。
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
