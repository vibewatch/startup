      - number: '5.2'
        title: 依托自持薪资基础设施连通不断扩大的外部生态
        blocks:
          - type: paragraph
            body: >-
              公开资料中最清晰的架构主张是垂直整合：据 a16z 报告，Deel 从底层引擎到顶层应用全栈自建了全球薪资系统，靠自持基础设施减少业务交接环节、规范多国数据格式，并输出统一的劳动力全景视图。围绕这一核心，Deel
              宣称客户可通过 110+ 种集成接口与 API 实现互联，而其最新的产品设计招聘需求将 API、开发者体验、合作伙伴门户、应用商店（App Store）、内部运营工具及 Ops Connect
              明确列为独立的互联模块。Celigo 亦从第三方视角证实，Deel
              能无缝嵌入薪资、工时、入职、绩效、自助服务及报销等多种业务工作流。因此，现有公开证据能够佐证其分层运营模式，却无法证实其真实的服务拓扑架构、数据模型、API 可用性、响应延迟或故障隔离特性。
