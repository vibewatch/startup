      - number: '8.4'
        title: 退出就绪度与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              Forge 报告称媒体曾讨论 2026 年 IPO
              的可能性，但也表明官方尚未确认明确日期。这使得退出时间表仅是一项悬而未决的期权，不能作为投资研判的基本假设。出资前，尽职调查需理清完全稀释后的股权结构明细、各项优先权利、债务与收购对价、员工期权稀释及所有转让限制；随后核验经审计的收入确认方式、分产品毛利率、经营性现金流、客户留存率与集中度。其运营模式同样需要重点审视：Deel
              自身说明各司法管辖区的用工法规存在重大差异，而一则公司招聘启事显示其团队规模达 7,000 人、分布于 100
              多个国家。这些事实固然反映了业务规模，却也意味着庞大的执行与合规暴露面，须经监管记录、服务质量与单位经济效益等证据逐一核验。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 专题图表
        blocks:
          - type: callout
            title: 上一轮估值并非当前公允价值
            body: $17.3 billion 的 Series E 轮估值是有据可查的融资参考，但指定信源均未提供包含交易规模、证券类别与转让条款的现行可执行老股交易价格。唯有在获取这些条款与经审计的财务数据后，方可启动价格谈判。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV013
              - CV016
          - type: callout
            title: 融资数据库统计口径存在分歧
            body: >-
              Tracxn 统计的 8 轮共计 $986 million 与 FundedIQ 仅记录 1 轮的 $300
              million，并非可相互替代的募资金额或可用现金衡量口径。两者分歧应查验原始融资协议予以核对，而非简单取平均值。
            calloutType: risk
            claimRefs:
              - CV009
