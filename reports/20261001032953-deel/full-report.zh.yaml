      - number: '6.4'
        title: 客户留存韧性、扩张动态与集中度风险
        blocks:
          - type: paragraph
            body: >
              Deel 商业模式的持久力取决于能否通过交叉销售外延模块拉升平均客单价（ACV），涵盖合同工管理、EOR
              雇佣、全球薪资、设备调配及移民支持等。尽管自助式合同工账户因初创企业倒闭和项目结项而面临较高的毛客户流失率（gross logo churn），但多国 EOR
              和全球薪资账户一旦嵌入企业的财务核算工作流中，就会表现出极高的净收入留存率（NRR）以及坚固的替换门槛。


              尽管具备这种扩张势头，Deel 仍面临显著的客户集中度风险，极易受到科技行业用工需求萎缩的冲击。由于科技企业在高毛利 EOR
              客户中占据了过高比重，科技行业的招聘冻结或裁员潮会直接挤压平台的资金结算总量与席位管理费收入。此外，来自 Rippling、Remote
              等新锐平台以及传统薪资厂商的激烈价格战正在蚕食其核心软件毛利率；而在实体作业场景中，轮班制用工与复杂的劳工合规要求，也让客户合同面临更高的监管审查风险与运营连带责任。
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: 展品
        blocks:
          - type: callout
            title: 直面知识型用工萎缩冲击与科技客户流失风险
            body: >-
              Deel 客户规模的迅猛扩张在很大程度上由全球科技行业催化。虽然多国大型企业薪资服务协议能够带来高黏性的
              ARR，但其数以千计的早期软件初创客户极易受到裁员、倒闭及招聘冻结的冲击，这会直接削减按席位计费的订阅收入与薪资结算流水。
            calloutType: risk
            claimRefs:
              - CU001
              - CU013
              - CU014
          - type: callout
            title: 与企业核心 ERP 集成构成核心留存护城河
            body: >-
              Deel 获得 Workday 和 NetSuite
              的官方认证集成，助其从同质化的合同工支付工具跃升为不可或缺的薪资核心基础设施。全球薪资实发数与税金扣缴的双向实时同步一旦深植于企业总账系统中，客户的系统替换成本便会急剧攀升。
            calloutType: insight
            claimRefs:
              - CU006
              - CU008
              - CU012
  - number: 7
    title: 风险分析
    sections:
      - number: '7.1'
        title: 监管与法律风险框架
        blocks:
          - type: paragraph
            body: >-
              Deel 建立了覆盖 150+
              个自持法人实体的跨国合规架构，但在其全球运营网络中，不同国家和地区劳动法的巨大差异仍是首要的系统性隐患。其合规主张的核心，在于为企业客户隔离常设机构（PE）风险并规避员工雇佣性质误分类的行政处罚。然而，北美、欧盟和拉美的监管机构不断收紧对零工经济与远程合同工身份认定的执法审查。尽管
              Deel 部署了与 Queen's University 联合开发的属地化分类算法，覆盖 15 个司法辖区，能以超过 90%
              的准确率对照当地法院判例界定劳动关系，但算法分类无法完全免除税务机关激进的重新定性或追溯征收法定税费的追责风险。此外，向数据中心和零售运营等实体作业场景拓展，引入了严苛的法定排班要求。在德国，《工时法》（Arbeitszeitgesetz）强制要求班次之间保证
              11 小时连续休息时间，并对夜班工人实施强制健康监护，违规单次最高可处 15,000 欧元罚款。在法国，EOR 运营必须遵从 Portage Salarial
              行业劳资集体协议，对周日加班、奖金加成及最低工资标准做出了刚性限制，导致企业客户无法随意自定合同条款。在美国联邦法院审理中悬而未决的
              RICO（反敲诈勒索及腐败组织法）民事诉讼更带来了灾难性的下行风险——若原告证实其存在系统性规避国内用工法规的行为，Deel 将面临巨额赔偿。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
