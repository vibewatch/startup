    columns:
      - 视角
      - 基于证据的论据
      - 改变观点的触发条件
    rows:
      - - 正方论点
        - 据 Deel 报告，ARR 超过 $1B，已连续三年盈利，且在 2025 年首次实现单月收入 $100M。
        - 经审计业绩若显示现金转化率疲软、毛利率偏低或非经常性收入占比较高，将削弱该论点。
      - - 正方论点
        - Deel 称其全球薪资处理引擎已在 55 多个国家上线，表明其对自营运营基础设施的持续投入。
        - 若有证据表明业务覆盖高度依赖第三方，或者未能有效改善留存率与利润率，将削弱其护城河主张。
      - - 反方论点
        - Tracxn 追踪到 965 家活跃竞品，而现有数据源缺乏可比的收入、利润率或估值数据。
        - 若有独立第三方同业经营数据与交易乘数证明其具备持久溢价能力，将增强估值支撑。
      - - 反方论点
        - Forge 提示，私募市场价格数据可能基于极有限的参考依据，未必代表可执行的市场交易价格。
        - 近期若出现交易规模、证券类型及转让条款清晰披露的独立第三方老股大宗交易，将改善价格发现。
    notes: 公司经营声明均标明为公司自述；Tracxn 与 Forge 提供了独立的市场背景，但不构成经审计的运营佐证。
