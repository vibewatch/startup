      - number: '7.2'
        title: 运营、基础设施与安全失效模式
        blocks:
          - type: paragraph
            body: >-
              在法人实体覆盖局限与非标薪酬结构的交汇处，Deel 的运营韧性遭遇严峻考验。虽然 Deel
              积极在海外新设全资子公司，但在尚未完成直接注册的司法辖区，仍需依赖第三方本地合作伙伴聚合商提供名义雇主服务。相比完全自持的基础设施，这种外包合作模式削弱了运营管控力度，侵蚀毛利率，并使知识产权归属链条更加复杂化。与此同时，Deel
              的软件架构是围绕标准化的月度周期性发薪和固定合同工席位构建的。一旦企业客户尝试推行与产出或里程碑挂钩的复杂安排（例如兼职高管聘用、收入分成、绩效奖金结算等），平台的标准化工作流往往难以有效支持。运营经办人员经常不得不退回线下签署补充协议、利用
              Excel 表格追踪并走线下审批，来处理部分交付、争议纠纷解决或追回条款（clawback）。这种流程断层不仅带来了实际交付风险，拉高了账单纠纷率，也引发了追求统一合同治理的成熟企业客户的不满。
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR014
              - CR015
      - number: '7.3'
        title: 交易对手方、银行网络与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Deel 的商业模式高度依赖外部支付中介、区域银行网络及新近收购的软件基础设施。平台在全球 150+ 个国家以约 100
              种货币发放数十亿美元的薪资，需要与国际清算网络、外汇经纪商以及属地付款通道保持不间断连接。银行间清算截止时间、代理行业务去风险化（de-risking）以及跨国资本管制，给时效要求极高的薪资代发承诺带来了持续的流动性时间差风险。为了支持各本土企业薪资，Deel
              在英国、巴西和非洲等地依赖并购获得的 PaySpace 等老旧引擎，需要持续推进遗留系统现代化以避免架构分化。此外，金融科技服务靠赚取外汇（FX）点差与支付底座变现，为 Deel 贡献了预估 25% 至 30%
              的总营收。这种收入结构集中度使公司收益直接暴露于跨国手续费率下调与汇率波动的风险之下。Deel 近期向数字资产结算通道的拓展（包括超过 $250 million 的稳定币薪资结算，以及依托 Stripe
              技术栈推出的 DLUSD Wallet），在全球加密货币转账法规持续演进的背景下，引入了额外的监管与合规风险敞口。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
