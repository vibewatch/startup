figures:
  - id: FO001
    title: Deel 企业演进与平台发展里程碑时间线
    type: timeline
    summary: 梳理自 2019 年创立起，历经企业级规模化扩张，至 2026 年推出 AI Agent 的重大企业、融资与产品里程碑。
    data:
      items:
        - date: 2019-01
          label: 创立并入选 YC
          detail: Alex Bouaziz 与 Shuo Wang 创立 Deel 并完成 Y Combinator 孵化，着力解决全球合同工合规问题。
          tone: positive
        - date: 2019-09
          label: 初步推出 EOR 业务
          detail: 突破合同工协议业务范畴，在加拿大和英国正式推出名义雇主（EOR）服务。
          tone: positive
        - date: 2020-05
          label: A 轮融资
          detail: 完成由 Andreessen Horowitz 领投的 1,400 万美元融资，用于搭建专有跨国薪资平台。
          tone: positive
        - date: 2020-09
          label: B 轮融资
          detail: 疫情期间远程办公需求激增，完成由 Spark Capital 领投的 3,000 万美元融资。
          tone: positive
        - date: 2021-04
          label: C 轮融资晋升独角兽
          detail: 完成由 YC Continuity 领投的 1.56 亿美元 C 轮融资，估值达 12.5 亿美元。
          tone: positive
        - date: 2021-10
          label: D 轮成长期融资
          detail: 完成由 Coatue 与 DST Global 联合领投的 4.25 亿美元融资，估值达 55 亿美元。
          tone: positive
        - date: 2022-05
          label: 战略追加轮融资
          detail: 获得由 Emerson Collective 领投的 5,000 万美元投资，估值达 120 亿美元。
          tone: positive
        - date: 2025-06
          label: 竞品商业秘密诉讼
          detail: Rippling 对 Deel 提起诉讼，指控其存在商业间谍行为并盗用商业秘密。
          tone: negative
        - date: 2025-10
          label: Series E 融资与 $1B ARR
          detail: 在 ARR 突破 10 亿美元后，完成由 Ribbit Capital 与 a16z 领投的 3 亿美元融资，估值达 173 亿美元。
          tone: positive
        - date: 2026-03
          label: The Big Deel 2026 与 AI 劳动力
          detail: 推出主动式 AI 劳动力（AI Workforce）、ChatGPT 集成、Deel Mobility 全球调配记录系统及全新改版移动端应用。
          tone: positive
        - date: 2026-06
          label: 推出 Deel 外勤服务（Field Services）
          detail: 面向全球 110 多个国家的复杂运营行业，部署现场 EOR 与劳动力管理。
          tone: positive
    approximationNotes: 里程碑日期参考企业官方公告与公开申报材料；竞品诉讼事项反映法院立案时间线。
