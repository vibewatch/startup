      - number: '8.3'
        title: 摒弃虚假精确性的情景推演
        blocks:
          - type: paragraph
            body: >-
              情景推演框架特意以里程碑为导向，因为公开记录无法支撑精确的概率或估值区间。乐观情景需要独立证实几点：ARR 持续复合增长、经审计的盈利确实转化为现金流，且 Deel
              自建薪资基础设施能构筑持久的留存与利润率优势；唯有满足这些前提，相比上一轮融资给出溢价才算合理。基准情景仅将 $17.3 billion
              视作融资参考而非公允价值，在厘定入场价格前，需等待经审计的财务数据与最新股权结构表。悲观情景的触发因素包括：客户留存疲软、服务过重导致利润率承压、发生重大合规危机，或二级市场流动性匮乏。在缺乏经验证的下行经济指标或清算条款前，公开证据无法推导出估值底线。
            claimRefs:
              - CV001
              - CV002
              - CV003
