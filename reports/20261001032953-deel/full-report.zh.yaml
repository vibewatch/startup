chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业身份、创立历史与商业模式
        blocks:
          - type: paragraph
            body: >-
              Alex Bouaziz 与 Shuo Wang 在经历跨国招聘壁垒和监管摩擦的运营痛点后，于 2019 年创立 Deel。从 Y Combinator
              孵化后，公司最初搭建了跨国合同工管理平台，随后推出名义雇主（EOR）服务，让客户无需设立海外子公司即可聘用国际员工。在此后 7 年间，Deel 扩展为覆盖 150
              多个国家的全球雇佣综合操作系统。该平台依托垂直整合软件实现全套薪资流程自动化，统一处理入职、本地薪资、法定福利、税务申报以及支持 120+ 种货币的多币种发放。2026 年，Deel
              又在其全球劳动力基础设施中引入了 Agent 工作流自动化与专项排班合规功能。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO010
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO005
              - CO009
              - CO013
      - number: '1.2'
        title: 领导架构、公司治理与关键人物动态
        blocks:
          - type: paragraph
            body: >-
              Deel 的高管团队由联合创始人兼首席执行官 Alex Bouaziz 和联合创始人兼首席营收官 Shuo Wang 领衔。两位创始人均拥有 MIT 技术背景，并在创立 Deel
              之前已有创办并退出初创企业的经历。管理层治理强调全面掌控业务运营链条的每一个环节，秉持以工程为核心的理念，优先设立自持本地法人实体，而非外包给第三方行政代理中介。早期高管层与前首席运营官 Dan
              Westgarth 共同拓展业务，后者协助建立了制度化的运营响应速度与客户升级响应机制。公司的关键人物依赖仍集中在 Bouaziz 身上，他直接主导产品战略、融资与企业级重大问题协调，而 Shuo Wang
              则负责全球大客户的商业化扩张与营收运营。
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO014
      - number: '1.3'
        title: 资本历史、估值演进与股东图谱
        blocks:
          - type: paragraph
            body: >-
              Deel 通过由顶级风投机构和机构投资者领投的多轮融资，累计斩获 $945 million 股权融资。在获得种子轮资金并在 2020 年 5 月完成由 Andreessen Horowitz 领投的 $14
              million Series A 之后，Deel 于 2020 年 9 月完成由 Spark Capital 领投的 $30 million Series B。2021 年 4 月，公司以 $1.25
              billion 估值完成由 YC Continuity 领投的 $156 million Series C，跻身独角兽行列；同年 10 月又完成由 Coatue 和 DST Global 联合领投的 $425
              million Series D，估值达到 $5.5 billion。2022 年 5 月，Emerson Collective 领投 $50 million 战略融资，为 Deel 估值 $12
              billion。最新一轮融资发生在 2025 年 10 月，Deel 完成由 Ribbit Capital 与 Andreessen Horowitz 联合领投的 $300 million Series
              E，投后估值确立为 $17.3 billion。
            claimRefs:
              - CO009
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
