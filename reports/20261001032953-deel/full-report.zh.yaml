      - number: '5.4'
        title: 差异化壁垒具备说服力，但平台大一统与信任背书落后于官方叙事
        blocks:
          - type: paragraph
            body: >-
              Deel 的防御壁垒依托于自建薪资结算通道、本地化雇佣覆盖网络、模块化应用、运营专业积淀及外部集成的合力。据 a16z 报告，一系列并购大幅扩充了其原生薪资与 IT
              实力，但也指出公司处于过渡期，被收购公司的后台在合并至统一代码库前仍会独立运行一段时间。Deel
              自身的互联团队招聘材料也坦陈，开发者、合作伙伴、运营支持人员和终端客户目前接触到的实际上是平台的不同版本；平台尚未真正统一，仍是路线图目标，而非既成事实。在合规信任证据上同样存在信息不对称：Deel 虽宣称符合
              SOC 1、SOC 2、SOC 3、GDPR 和 ISO 27001
              认证并提供随时可供审计的日志，但现有资料库中并未包含底层审计报告、认证范围明细、渗透测试结论、次级处理方管控记录或历史安全事件清单。因此，技术尽调应将“一体化综合平台”这一论断视为逻辑合理且已商业化落地的设想，同时对其内部控制有效性和各模块间的一致性保留最终评判。
            claimRefs:
