chapter:
  number: 8
  title: Valuation
  summary: >-
    Deel's October 2025 Series E established a $17.3 billion last-round valuation, while the company said it had surpassed $1 billion of ARR and reached three consecutive years of profitability. Those are meaningful scale signals, but public evidence does not disclose audited margins, retention, a current fully diluted cap table, or a reliable market-clearing secondary price, so the defensible stance is research more rather than buy.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is research more, with medium confidence, high risk, and a stretched-on-public-evidence valuation stance. The positive case is substantial: Deel announced a $300 million Series E at a $17.3 billion valuation after saying it had surpassed $1 billion in annual recurring revenue, reached three consecutive years of profitability, and recorded its first $100 million revenue month in September 2025. Its current website also claims more than 40,000 customer companies. Yet these operating metrics are company-issued, and the assigned public evidence does not provide audited profitability, gross margin, retention, cash-flow, or dilution data. A new investment therefore should not be underwritten from the headline round mark alone; the decision should remain price-sensitive and contingent on private financial and cap-table diligence.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV013
      - CV015
      - CV016
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-context-and-comparability
    title: Financing context and comparability
    body: >-
      Three assigned market-data sources agree on the $17.3 billion Series E mark, but their funding totals demonstrate why public databases should not be treated as a cap table. Tracxn reports $986 million across eight rounds, FundedIQ records only the disclosed $300 million Series E in its profile, and Forge lists a $17.3 billion post-money valuation while separately warning that its pricing data may rely on very limited inputs. The difference is a coverage conflict, not proof that one total represents cash available to Deel. Tracxn also maps 965 active competitors, including Remote, Oyster, and Multiplier, but the source pool supplies no comparable revenue, margin, or transaction multiples. That market map establishes competition, not an independent valuation benchmark.
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV016
    tableRefs:
      - TV002
  - id: scenarios-without-false-precision
    title: Scenarios without false precision
    body: >-
      The scenario framework is deliberately milestone-based because the public record cannot support precise probabilities or valuation ranges. A bull case requires independent confirmation that ARR continues to compound, audited profitability converts to cash, and Deel's owned payroll infrastructure creates durable retention and margin advantages; only then could a premium to the last round be justified. The base case treats $17.3 billion as a financing reference, not fair value, and waits for audited economics and a current cap table before setting an entry price. The bear case is triggered by weak retention, service-heavy margins, material compliance failures, or an illiquid secondary market. Without verified downside economics or liquidation terms, public evidence cannot establish a valuation floor.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV012
      - CV013
      - CV016
    tableRefs:
      - TV003
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Forge reports that media discussed a possible 2026 IPO, but it also states that no official date has been confirmed. That makes exit timing an unresolved option rather than an underwriting assumption. Before investment, diligence should reconcile the fully diluted ownership schedule, all preferred rights, debt and acquisition consideration, employee option dilution, and any transfer restrictions; then verify audited revenue recognition, gross margin by product, operating cash flow, customer retention, and concentration. The operating model also deserves specific scrutiny: Deel itself explains that employment rules vary materially by jurisdiction, while a company job posting describes a 7,000-person team across more than 100 countries. Those facts indicate scale, but also a large execution and compliance surface that should be tested through regulatory, service-quality, and unit-economics evidence.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV013
      - CV014
      - CV016
