  - id: TV002
    title: Thesis and anti-thesis table
    columns:
      - lens
      - evidence-based argument
      - what would change the view
    rows:
      - - thesis
        - Deel reported more than $1B ARR, three consecutive profitable years, and a first $100M revenue month in 2025.
        - Audited results showing weak cash conversion, low gross margin, or non-recurring revenue would weaken the thesis.
      - - thesis
        - Deel said its global payroll processing engine was live in 55+ countries, indicating investment in owned operating infrastructure.
        - Evidence that coverage depends materially on third parties or does not improve retention and margin would weaken the moat claim.
      - - anti-thesis
        - Tracxn maps 965 active competitors, while the source pool lacks comparable revenue, margin, or valuation data.
        - Independent peer economics and transaction multiples showing a durable premium would improve price support.
      - - anti-thesis
        - Forge warns that private-market price data may use very limited inputs and may not represent an executable market price.
        - A recent arm's-length secondary block with disclosed size, security, and transfer terms would improve price discovery.
    notes: >-
      Company operating statements are identified as company-issued; Tracxn and Forge provide independent market context but not audited operating corroboration.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV007
      - CV011
      - CV013
  - id: TV003
    title: Bull, base, and bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation and return logic
      - key risks
      - probability signal
    rows:
      - - bull
        - Independent ARR growth, audited cash profitability, durable retention, and infrastructure-led margin advantage.
        - A premium to $17.3B is supportable only after verified forward economics establish an investable return.
        - Growth quality, execution across jurisdictions, and an unsupported exit window.
        - Not quantifiable from the assigned public evidence.
      - - base
        - Scale claims broadly hold, but audited margins, retention, and cap-table economics remain unavailable.
        - Use $17.3B only as a reference and defer entry pricing until private diligence closes the gaps.
        - Paying for growth that is service-heavy, dilutive, or difficult to convert into cash.
        - Most defensible current posture because evidence supports scale but not price.
      - - bear
        - Retention weakens, compliance incidents rise, margins disappoint, or private liquidity remains thin.
        - No public downside floor is supportable without current secondary trades and liquidation terms.
        - Multiple compression, preference overhang, operating complexity, and delayed exit.
        - Triggered by failed diligence rather than assigned a fabricated probability.
    notes: >-
      Scenarios are qualitative because the source pool contains no audited forecast base, verified comparable multiples, probability evidence, or current executable secondary quote.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV012
      - CV013
      - CV016
