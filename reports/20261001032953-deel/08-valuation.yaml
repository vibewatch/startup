  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-quality
      missingEvidence: >-
        Audited income statement, cash-flow statement, gross margin by product, revenue recognition policy, retention cohorts, and customer concentration.
      whyItMatters: >-
        ARR and profitability claims cannot establish cash quality, durable expansion, or an appropriate valuation multiple without these records.
      diligencePath: >-
        Obtain audited statements, management accounts, bank reconciliations, and cohort-level ARR waterfalls through a controlled data room.
      relatedQuestionRefs:
        - QV002
        - QV005
        - QV007
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >-
        Current fully diluted cap table, preferred rights, debt, option pool, acquisition consideration, transfer restrictions, and liquidation waterfall.
      whyItMatters: >-
        Headline post-money valuation does not determine ownership, dilution, preference overhang, or downside proceeds for a new investor.
      diligencePath: >-
        Reconcile the charter, stock ledger, financing documents, debt schedule, option grants, and pro forma liquidation waterfall with company counsel.
      relatedQuestionRefs:
        - QV001
        - QV008
    - type: missing-source
      severity: material
      topic: price-discovery
      missingEvidence: >-
        A recent arm's-length secondary transaction with disclosed date, size, security class, price, transfer approval, and buyer-seller relationship.
      whyItMatters: >-
        Database marks and a historical primary round do not establish a current executable entry price or downside floor.
      diligencePath: >-
        Request broker confirmations and completed trade documents, then normalize security rights before comparing prices.
      relatedQuestionRefs:
        - QV004
        - QV005
        - QV006
    - type: missing-source
      severity: material
      topic: comparable-valuation
      missingEvidence: >-
        Current public-company and private-transaction benchmarks with consistent revenue definitions, margins, growth, and valuation dates.
      whyItMatters: >-
        A competitor count is not a valuation comparable, and unlike business models cannot support a defensible multiple.
      diligencePath: >-
        Build a dated peer set from filings and transaction documents, separating software revenue from payroll pass-through and services.
      relatedQuestionRefs:
        - QV003
        - QV005
