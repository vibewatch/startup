callouts:
  - calloutType: recommendation
    title: Last-round valuation is not current fair value
    body: >-
      The $17.3 billion Series E is a documented financing reference, but no assigned source provides a current executable secondary price with transaction size, security class, and transfer terms. Price negotiation should begin only after those terms and audited economics are available.
    claimRefs:
      - CV001
      - CV012
      - CV013
      - CV016
  - calloutType: risk
    title: Funding databases measure different coverage
    body: >-
      Tracxn's $986 million across eight rounds and FundedIQ's $300 million across one recorded round are not interchangeable measures of cash raised or cash available. The discrepancy should be reconciled against primary financing documents rather than averaged.
    claimRefs:
      - CV009
      - CV010
