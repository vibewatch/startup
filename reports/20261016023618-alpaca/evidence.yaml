evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-debt-terms
    missingEvidence: >-
      Full cap table, preferred terms, liquidation stack, and debt documents behind the $40 million line of credit and
      July 2026 debt financing.
    whyItMatters: >-
      Public raise headlines establish valuation momentum but do not show dilution, downside protection, or lender
      control risk.
    diligencePath: Request the Series D financing documents, current cap table, and executed credit agreements from management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: account-scale-disclosure
    missingEvidence: >-
      A reconciled management KPI pack defining live brokerage accounts, partner count, and lifetime financing totals
      across all public materials.
    whyItMatters: >-
      Later market, customer, and valuation chapters will overstate confidence if they treat one public scale figure as
      canonical without reconciliation.
    diligencePath: >-
      Ask management to bridge the 7M, 9M+, and 10M+ account claims and to explain whether $320M, $400M, and $435M use
      different debt/equity definitions.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: financial-performance-disclosure
    missingEvidence: Audited or management-prepared FY2025 / FY2026 revenue, gross margin, burn, and retention metrics.
    whyItMatters: >-
      The overview can confirm fundraising and operating breadth, but not the quality of revenue or self-clearing
      economics that underpin valuation.
    diligencePath: Request the board deck or management financial package used in the latest financing process.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-roster-completeness
    missingEvidence: A complete current board and executive roster with committee assignments and independent-director representation.
    whyItMatters: >-
      The assigned pool shows founders, one new board seat, and regulated-subsidiary officers, but not the full
      governance picture.
    diligencePath: Request the current board deck, board observer list, and executive organization chart.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sam-som-definition
    missingEvidence: >-
      Segment-level pipeline, partner GMV, attach rates by asset class, and geography-specific conversion data needed to
      isolate Alpaca's SAM and SOM.
    whyItMatters: >-
      Public evidence supports demand and current footprint, but not the narrower market capture assumptions needed for
      underwriting valuation.
    diligencePath: Request management cohort data by segment and geography, plus partner revenue mix and active-account distribution.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: partner-scale
    missingEvidence: >-
      Reconciled definitions and measurement dates for the 200-plus versus 300-plus partner counts and the 7 million
      versus 9 million account counts.
    whyItMatters: >-
      The public figures use different labels and vintages, so they cannot be treated as a single audited penetration
      series.
    diligencePath: >-
      Request dated management KPI schedules defining active partners, funded accounts, open accounts, and geographic
      inclusion rules.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Named budget owners, contract structures, pricing model by module, and implementation payback periods across
