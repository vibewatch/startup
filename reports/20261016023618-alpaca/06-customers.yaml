figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Alpaca acquires both direct API traders and institutional partners, then expands accounts by
      moving them into broader asset classes, geographies, and operating models.
    data:
      items:
        - label: Direct trader or developer discovery
          tone: neutral
          actor: Retail quant, developer, or small trading team
          stage: Discovery
          channel: Review sites, docs, and API-first positioning
          touchpoints:
            - BrokerChooser review
            - SmartAsset overview
            - Trading API and paper trading
        - label: Embedded partner diligence
          tone: neutral
          actor: Fintech, neobank, or platform product team
          stage: Evaluation
          channel: Broker API and customer-reference pages
          touchpoints:
            - Account opening and KYC
            - Market data and execution
            - Local currency trading
        - label: Launch on Alpaca rails
          tone: positive
          actor: Broker-dealer, fintech, or wealth platform
          stage: Deployment
          channel: Self-clearing, custody, and omnibus models
          touchpoints:
            - Clearing and settlement
            - OmniSub or omnibus structures
            - Back-office reporting
        - label: End-customer account growth
          tone: positive
          actor: End investors inside partner apps
          stage: Scale
          channel: Multi-country partner distribution
          touchpoints:
            - Millions of brokerage accounts
            - 40+ country reach
            - Fractional and 24/5 trading
        - label: Cross-sell into new products
          tone: positive
          actor: Existing partners and active traders
          stage: Expansion
          channel: Asset and feature expansion
          touchpoints:
            - Options and fixed income
            - High-yield cash
            - Securities lending
        - label: Support and concentration test
          tone: risk
          actor: Customer success, operations, and procurement teams
          stage: Durability
          channel: Ongoing service quality and commercial review
          touchpoints:
            - Outage and latency complaints
            - Limited public renewal data
            - Unknown top-customer concentration
    approximationNotes: >-
      Journey stages are analytical synthesis from assigned evidence, not a disclosed company funnel
      with conversion rates.
    claimRefs: [CU001, CU005, CU009, CU010, CU012, CU013]
callouts:
  - calloutType: insight
    title: B2B2C infrastructure appears to be the real customer core
    body: >-
      Public evidence repeatedly points to Alpaca's highest-value customers being institutional or
      partner platforms, while the direct trader surface helps prove product quality and expand end
      account volume.
    claimRefs: [CU001, CU002, CU007, CU011]
  - calloutType: risk
    title: Public customer quality still depends on private diligence
    body: >-
      Logos, testimonials, and broad account counts are strong acquisition proof, but the company
      does not publicly show renewals, churn, concentration, or cohort economics that would prove
      durability.
    claimRefs: [CU012, CU013]
