company:
  name: Alpaca
chapter:
  number: 6
  title: Customers
  summary: >-
    Alpaca shows real customer adoption across two surfaces: direct API traders and a larger
    embedded-finance/infrastructure base spanning brokers, banks, wealth platforms, and
    tokenization partners. The strongest public proof is breadth of named references and repeated
    partner-count disclosures, but retention, concentration, and denominator-quality remain
    materially under-disclosed.
sections:
  - id: customer-surface
    title: Customer surface spans both direct traders and embedded-finance partners
    body: >-
      Alpaca is not selling to a single buyer archetype. Official broker materials position the
      company as infrastructure for broker-dealers, banks, investment advisors, treasury
      management, fintech startups, crypto exchanges, and tokenization platforms, while
      third-party reviews still describe a direct API brokerage for developers, quantitative
      traders, and other algorithmic users. That combination matters because it implies the
      self-clearing stack does double duty: it is both a standalone trading product and the
      operating rail beneath partner-branded investing experiences. Independent customer proof from
      OpenBanking Tracker and SmartAsset reinforces that Alpaca's revenue opportunity likely comes
      more from B2B2C distribution than from pure retail brokerage economics.
    claimRefs: [CU001, CU002, CU006, CU007, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is broad, but public scale metrics do not fully reconcile
    body: >-
      Public adoption evidence is directionally strong but numerically uneven. Alpaca's
      clearing-focused page cites support for 150+ global businesses, its Broker API page cites
      200+ partners in 40+ countries, TechFundingNews reports more than 300 partners across over
      40 countries, and refresh-period company-issued materials move end-account language from over
      7 million brokerage accounts to over 9 million. The pattern points to meaningful growth, yet
      readers still do not get a dated bridge by customer segment, production status, or revenue
      contribution. That means the chapter can underwrite reach and momentum, but not precise
      customer-count comparability or concentration-adjusted quality of revenue.
    claimRefs: [CU003, CU004, CU005, CU010]
    tableRefs: [TU002]
  - id: named-customer-evidence
    title: Named references show production use cases and cross-sell potential
    body: >-
      Alpaca does have better named-customer proof than many infrastructure vendors. On the
      official site, Midas, GoTyme Bank, Dime!, Composer, Woodstock, Ondo Finance, Abyan Capital,
      and ZAD all describe live use cases ranging from local-market access and easier integration
      to local-currency trading and tokenized equities. Independent evidence adds eToro (US),
      Public.com, and Sarwa. The implication is that Alpaca is not dependent on one narrow use
      case: the same platform is being sold into retail trading apps, regional brokerages,
      tokenization platforms, and specialized wealth products. That diversity is strategically
      attractive, even though the public sample is still curated and likely biased toward best-case
      references.
    claimRefs: [CU006, CU008, CU009]
    tableRefs: [TU003]
  - id: durability-and-gaps
    title: Durability remains the least-proven part of the customer story
    body: >-
      The weak link in Alpaca's public customer evidence is durability. BrokerChooser's 2026 review
      still recommends Alpaca to developers and algorithmic traders, but it also highlights
      intermittent outages, execution or message delays, thin support, and limited breadth as
      recurring complaints for some direct users. More importantly, the reviewed public sources do
      not disclose NRR, GRR, churn, contract length, or top-customer concentration. As a result,
      public evidence supports adoption and category breadth, but not whether partner relationships
      are sticky, expanding, or concentrated in a handful of large fintech and institutional
      accounts.
    claimRefs: [CU012, CU013]
