    claimRefs: [CV001, CV003, CV004, CV006, CV007, CV008, CV009, CV016]
callouts:
  - calloutType: recommendation
    title: Decision threshold
    body: >-
      Advance only after audited ARR, gross margin, cash use, partner concentration,
      debt covenants, and preference terms show that the $1.15 billion mark can
      produce an acceptable diluted return without relying on public-market multiple
      expansion.
    claimRefs: [CV001, CV002, CV006, CV016]
