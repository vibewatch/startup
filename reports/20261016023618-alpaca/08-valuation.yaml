company:
  name: Alpaca
chapter:
  number: 8
  title: Valuation
  summary: >-
    Alpaca's January 2026 Series D set a $1.15 billion valuation while subsequent
    reporting described additional financing and Sacra estimated $200 million of
    ARR. The resulting public-data valuation signal is potentially reasonable for
    a fast-growing infrastructure platform, but audited economics, debt terms,
    preference overhang, and directly comparable transactions remain unavailable,
    supporting a research-more recommendation with high risk and a stretched stance.
sections:
  - id: investment-view
    title: Investment view and decision
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and a
      stretched valuation stance at the last disclosed $1.15 billion financing mark.
      The thesis is that a self-clearing, API-first platform with more than 300
      organizational partners, coverage in more than 40 countries, and company-reported
      revenue growth above 100% can compound into a valuable brokerage infrastructure
      layer. The anti-thesis is that revenue exposure to trading activity, regulatory
      capital needs, and price competition can impair both growth quality and margins.
      Public evidence does not establish audited ARR, gross margin, cash generation,
      customer concentration, or liquidation preferences, so the financing headline
      cannot by itself support a buy decision or a target return.
    claimRefs: [CV001, CV002, CV003, CV004, CV007, CV008, CV009, CV016]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: financing-and-comparables
    title: Financing context and comparable references
    body: >-
      Alpaca announced a $150 million Series D at a $1.15 billion valuation in
      January 2026 and a separate $40 million line of credit. Crypto Briefing later
      reported $135 million of equity within a $435 million financing package, but
      the available article does not disclose a new valuation or enough terms to
      reconcile the package with the January round. Sacra estimates $200 million of
      ARR in July 2026; pairing that estimate with the January mark produces an
      illustrative 5.75x valuation-to-ARR ratio, not a verified transaction multiple.
      Robinhood's $4.932 billion TTM revenue, 20.51x price-to-sales ratio, and $93.49
      billion market capitalization provide a public market reference, but its
      consumer brokerage mix, scale, profitability, and public liquidity make it an
      imperfect direct comparable for Alpaca's private B2B infrastructure model.
    claimRefs: [CV001, CV002, CV005, CV006, CV010, CV011, CV016]
  - id: scenarios
    title: Bull, base, and bear underwriting
    body: >-
      Scenario analysis should remain conditional because the public record does not
      support a defensible equity-value range. The bull case requires audited ARR at
      or above Sacra's estimate, durable growth, improving self-clearing economics,
      diversified partner revenue, and limited preference seniority. The base case
      treats the $1.15 billion mark as unproven but potentially supportable after
      confirming revenue quality, margin, capital requirements, and debt terms. The
      bear case is triggered by lower audited ARR, material customer concentration,
      sustained cash consumption, heavier regulatory capital needs, or pricing
      pressure. Those triggers affect both the multiple and the capital required,
      making false precision less useful than explicit diligence thresholds.
    claimRefs: [CV006, CV007, CV008, CV009, CV013, CV014, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Product breadth, self-clearing scale, institutional memberships, and named
      customer references are constructive strategic signals, but they do not prove
      IPO or acquisition readiness. An exit underwrite requires audited financials,
      cohort retention, revenue concentration, regulatory-capital history, loss and
      fraud exposure, debt covenants, and the full preference stack. It also requires
      private transaction references closer to brokerage infrastructure than
      Robinhood. The view should improve only if verified economics support the
      current mark without aggressive multiple expansion; it should deteriorate if
      audited ARR materially trails the external estimate, one partner drives a
      disproportionate share of revenue, or the financing stack creates substantial
      senior claims. Until those items are resolved, liquidity timing and target
      return cannot be responsibly quantified.
    claimRefs: [CV002, CV003, CV012, CV013, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision field, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Research more, "Growth and scale signals exist, but core financial and cap-table evidence is private.", "Do not underwrite a purchase until the named diligence conditions are met."]
      - [Confidence, Medium, "Financing terms and operating scale are reported, while audited economics are absent.", "Treat the conclusion as conditional rather than conviction-rated."]
      - [Risk rating, High, "Regulatory capital, market-activity exposure, competition, and financing opacity remain material.", "Require downside protection and explicit thesis-break triggers."]
      - [Valuation stance, Stretched, "The $1.15B mark is only illustratively 5.75x Sacra's estimated $200M ARR.", "Demand audited ARR and quality-of-revenue proof before accepting the mark."]
      - [Return and exit, Not supportable publicly, "No verified cap table, net debt, cash flow, preference stack, or exit timetable is available.", "Model ownership, dilution, and exit proceeds only after data-room review."]
    notes: "Assessments use the January 2026 financing mark and clearly identified company claims or third-party estimates; they are not audited valuation conclusions."
    claimRefs: [CV001, CV002, CV006, CV007, CV008, CV009, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "More than 300 organizational partners across more than 40 countries indicate broad distribution.", "Partner-level revenue and retention showing weak monetization or concentration would weaken the thesis."]
      - [Thesis, "Company-reported revenue more than doubled year over year.", "Audited results showing materially lower growth or low-quality pass-through revenue would weaken the thesis."]
      - [Thesis, "Company reports 600,000+ daily orders self-cleared during April-May 2025.", "Evidence that volume does not translate into attractive contribution economics would weaken the thesis."]
      - [Anti-thesis, "Self-clearing regulatory capital can rise with volume and volatility.", "A multi-year capital plan with ample buffers and improving returns on regulatory capital would reduce this concern."]
      - [Anti-thesis, "Well-funded infrastructure competitors and incumbent APIs can create pricing pressure.", "Verified pricing power and rising gross margin despite competition would reduce this concern."]
      - [Anti-thesis, "Trading activity and crypto adoption expose revenue to cyclical market participation.", "Contracted minimums and diversified recurring platform fees would reduce cyclicality."]
    notes: "The thesis uses company-issued scale claims; the anti-thesis uses Sacra's independent risk analysis and requires data-room verification."
    claimRefs: [CV003, CV004, CV007, CV008, CV009, CV013]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Explicit assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Audited ARR meets or exceeds the $200M estimate; growth remains strong; margins improve; concentration and preference seniority are limited.", "A value above the $1.15B mark may be supportable, but no public range or target return is defensible without audited cash flow and ownership terms.", "Execution across products and jurisdictions; regulatory-capital scaling.", "Positive if audited economics corroborate external estimates and company growth claims."]
      - [Base, "ARR is near the external estimate, but margin, cash use, concentration, debt, and preferences remain only partially resolved.", "Treat $1.15B as a diligence anchor rather than fair value; price and structure must compensate for unresolved private-company evidence.", "Multiple compression; slower growth; dilution; delayed liquidity.", "Current public evidence most strongly supports this conditional case."]
      - [Bear, "Audited ARR trails the estimate, one or more partners are concentrated, capital needs rise, or competition compresses take rates.", "The January mark is not supportable; require a lower price, stronger preferences, or no investment.", "Down round, continuing capital calls, regulatory constraint, and weak exit proceeds.", "Triggered by failed financial, concentration, capital, or cap-table diligence."]
    notes: "No probability percentages or valuation ranges are assigned because the available public evidence lacks audited financials, net debt, cap-table terms, and comparable private transactions."
    claimRefs: [CV001, CV006, CV007, CV008, CV009, CV016]
