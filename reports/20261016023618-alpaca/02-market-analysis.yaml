          note: Reported drivers of demand for regulated infrastructure
    approximationNotes: >-
      The layers are separate sizing and constraint lenses with preserved source
      units, not a mathematically nested TAM-SAM-SOM conversion.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM012
callouts:
  - calloutType: insight
    title: Demand is broadening beyond neobroker launch kits
    body: >-
      The strongest 2026 demand signal is the convergence of tokenization,
      AI-built financial products, and institution-grade brokerage
      outsourcing—not simply more retail trading apps.
    claimRefs:
      - CM011
      - CM012
  - calloutType: risk
    title: Regulation can close demand channels faster than product can open them
    body: >-
      Cross-border brokerage demand can be real and still become unreachable if
      local regulators tighten access rules or if tokenized products trigger
      narrower eligibility and disclosure requirements.
    claimRefs:
      - CM015
      - CM016
