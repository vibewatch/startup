schemaVersion: report-v2
artifact: market-analysis
slug: alpaca
runDate: 2026-10-16
company:
  name: Alpaca
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Alpaca is selling brokerage infrastructure rather than a consumer brokerage
    product, with demand pulled by institutions that want regulated multi-asset
    rails without building their own clearing and custody stack. Public evidence
    supports broad market tailwinds in tokenization, AI-native financial
    applications, and cross-border embedded investing, but it does not cleanly
    expose Alpaca's SAM or conversion economics by buyer segment.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Alpaca's addressable market is best defined as brokerage infrastructure:
      APIs and operational rails that let a regulated intermediary or fintech
      embed investing, custody, clearing, onboarding, funding, and market-data
      workflows without standing up its own full broker-dealer stack. The cited
      product surfaces consistently target institutions, fintech apps, banks,
      wealth platforms, crypto exchanges, and tokenization platforms rather than
      positioning Alpaca as a direct retail destination. That boundary matters
      because the relevant substitutes are not only other brokerage APIs, but
      also internal buildouts and legacy outsourced clearing relationships. The
      practical spend bucket therefore includes regulated trading
      infrastructure, compliance-heavy workflow automation, and multi-asset
      enablement, while excluding end-customer acquisition budgets and any
      market a partner cannot legally access.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Sizing lenses, demand drivers, and why the market is expanding
    body: >-
      Public TAM data is incomplete, so the most defensible approach is to use
      multiple evidence-constrained operating lenses rather than a single
      inflated market estimate. Company-controlled pages published one week
      apart cite 200+ versus 300+ partner organizations and 7 million versus
      9 million accounts, while a March interview summary reports 300+ partners,
      9 million accounts, and 45 countries. Those figures show meaningful
      penetration but are not directly reconcilable without denominator and
      measurement-date definitions. Additional demand signals include more than
      $1.5 billion of assets under custody backing tokenized equities and nearly
      fourfold growth in monthly active API users over six months. Demand
      expansion is tied to institutions outsourcing regulatory complexity and
      to tokenization and AI-native applications needing programmable,
      regulated brokerage rails.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-frictions
    title: Buyers, budget ownership, and adoption constraints
    body: >-
      The clearest buyer pattern is B2B2C: Alpaca sells to product, brokerage,
      or innovation teams inside financial institutions and fintech platforms,
      while the ultimate users are those partners' retail investors, advisors,
      traders, or crypto-native customers. Public evidence is strong on segment
      breadth and workflow fit, but weaker on exact budget line items and deal
      economics, so budget ownership has to be inferred from product
      positioning. Adoption can still be slowed by market-access frictions that
      are outside Alpaca's product roadmap. The most visible current example is
      China's tightening on offshore brokerage access, which shows that a
      meaningful cross-border demand pool can be constrained by regulator
      action. Product-level disclosures also show that tokenized equities,
      options, and extended-hours trading carry legal, liquidity, or suitability
      constraints that partners must underwrite before adoption.
    claimRefs:
      - CM013
      - CM014
      - CM015
      - CM016
    tableRefs:
      - TM003
tables:
  - id: TM001
    title: Market definition and scope boundary
    columns:
      - Segment / category
      - Included spend / workflow
      - Excluded or out-of-scope spend
      - Buyer / payer
      - Relevance
    rows:
      - - Embedded investing / Broker API
        - Account opening, KYC, funding, custody, clearing, reporting, and order routing for partner apps
        - Consumer brokerage brand marketing and non-brokerage banking features not listed on the cited API surfaces
        - Fintech or bank product team / partner platform budget
        - Core current market
      - - Trading API wedge
        - Execution, market data, OAuth connectivity, and automation for active traders or developer-led products
        - Full partner compliance stack when only trading access is needed
        - Developer-led trading product / direct trading economics
        - Entry wedge and status-quo substitute to legacy broker integrations
      - - Tokenized equities rails
        - Instant mint-redemption workflows, 24/7 API access, and regulated brokerage connectivity for tokenized exposure
        - Direct issuer equity rights, voting, and dividend entitlements
        - Crypto exchange or tokenization platform / digital-asset product budget
        - Fast-growing adjacency
      - - Cross-border local-currency access
        - Local currency trading, global market access, and onboarding for partners serving non-U.S. users
        - Jurisdictions where local regulatory restrictions block distribution
        - Regional brokerage or embedded-finance team / expansion budget
        - Important growth corridor with policy sensitivity
    notes: >-
      Exclusions are inferred from omitted product scope or explicit disclosures
      in the cited sources; they are not a full competitive taxonomy.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM015
  - id: TM002
    title: Evidence-constrained sizing lenses
    columns:
      - Lens
      - Publisher / year
      - Geography
      - Value
      - Growth / change
      - Methodology and limitation
    rows:
      - - Official partner-count lens
        - Alpaca Broker API page / current at access
        - Global
        - 200+ global institutions and fintechs; 40+ countries
        - n/a
        - Company-controlled current page; scope and measurement date are not disclosed
      - - January account-count lens
        - Alpaca Markets / January 6, 2026
        - Global
        - 7M+ brokerage accounts; hundreds of institutions; 40+ countries
        - n/a
        - Company-controlled award post; conflicts with a later January company release
      - - January organization-count lens
        - Business Wire company release / January 14, 2026
        - Global
        - 300+ organizations; 40+ countries; 9M+ accounts
        - Revenue more than doubled year over year
        - Company-issued scale package; denominator definitions are not disclosed
      - - March interview-summary lens
        - Fintech Blueprint / March 5, 2026
        - Global
        - 300+ partners; 45 countries; 9M accounts
        - n/a
        - Editorial summary of a CEO interview; not independently audited
      - - Tokenization subsegment lens
        - FinTech Global / July 17, 2026
        - Global
        - $1.5B+ tokenized-equity assets under custody
        - Monthly active API users nearly 4x in six months
        - Company-specific tokenization activity; useful as adjacency demand, not TAM
      - - Policy-constrained offshore-access lens
        - KR-Asia and CNBC / 2026
        - China / Hong Kong
        - HKD 200-250B affected Hong Kong assets
        - Two-year phaseout for affected brokers in KR-Asia
        - Quantifies a threatened demand pool, not Alpaca revenue
    notes: >-
      This table intentionally mixes broad TAM, current served footprint, and
      constraint lenses because public sources do not expose a clean Alpaca
      SAM/SOM by segment, geography, or attach rate.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM016
  - id: TM003
    title: Buyer and budget-owner map
    columns:
      - Segment
      - Buyer
      - User
      - Payer / budget owner
      - Workflow
      - Adoption trigger
    rows:
      - - Neobanks and consumer fintechs
        - Product or embedded-investing lead
        - Retail investors
        - Platform GM or product budget
        - Launch U.S. or global investing inside an existing app
        - Faster launch without building broker-dealer and clearing operations
      - - Broker-dealers and wealth platforms
        - Brokerage operations or platform lead
        - Advisors, traders, and end-clients
        - Brokerage P&L or operations budget
        - Multi-asset trading, custody, reporting, and portfolio workflows
        - Add options, fixed income, lending, or local-currency features
      - - Crypto exchanges and tokenization platforms
        - Digital-asset or market-structure lead
        - Crypto-native investors
        - Exchange or platform innovation budget
        - Tokenized equities, mint-redemption, and 24-7 access
        - Bridge on-chain users to regulated brokerage rails
      - - Banks and treasury-management channels
        - Embedded-finance or product innovation lead
        - Depositors, treasury users, or retail clients
        - Innovation or partnership budget
        - Cash sweep, brokerage, and investing add-ons
        - Grow wallet share without a ground-up brokerage build
      - - Developers and algorithmic traders
        - Developer, trader, or small-team founder
        - Active trader or strategy operator
        - Direct subscription or trading-economics budget
        - API-based execution, data, and automation
        - Need programmable access and test environments quickly
    notes: >-
      Buyer and payer roles are inferred from partner-facing product
      positioning, named customer examples, and workflow descriptions because
      public procurement records are not available.
    claimRefs:
      - CM003
      - CM013
      - CM014
