  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sam-som-definition
      missingEvidence: Segment-level pipeline, partner GMV, attach rates by asset class, and geography-specific conversion data needed to isolate Alpaca's SAM and SOM.
      whyItMatters: Public evidence supports demand and current footprint, but not the narrower market capture assumptions needed for underwriting valuation.
      diligencePath: Request management cohort data by segment and geography, plus partner revenue mix and active-account distribution.
      relatedQuestionRefs:
        - QM008
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: partner-scale
      missingEvidence: Reconciled definitions and measurement dates for the 200-plus versus 300-plus partner counts and the 7 million versus 9 million account counts.
      whyItMatters: The public figures use different labels and vintages, so they cannot be treated as a single audited penetration series.
      diligencePath: Request dated management KPI schedules defining active partners, funded accounts, open accounts, and geographic inclusion rules.
      relatedQuestionRefs:
        - QM002
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: budget-ownership
      missingEvidence: Named budget owners, contract structures, pricing model by module, and implementation payback periods across customer segments.
      whyItMatters: Buyer identity is inferable from positioning, but budget authority and ROI timing determine sales friction and long-term expansion potential.
      diligencePath: Obtain sample customer contracts, pricing schedules, and reference calls across fintech, broker-dealer, and crypto-exchange segments.
      relatedQuestionRefs:
        - QM003
