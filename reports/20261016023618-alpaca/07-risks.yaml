        - "Medium"
        - "High"
        - "Partial"
        - "Residual exposure is medium-high until postmortems and trend data show incident frequency is falling."
      - - "Self-clearing throughput and control complexity at scale"
        - "Medium"
        - "Medium-High"
        - "Moderate"
        - "Residual exposure is medium because Alpaca cites 600,000+ daily self-cleared orders and 99.99% uptime, but those same scale claims raise the blast radius of control failure."
      - - "Security and privacy control drift during product and geography expansion"
        - "Medium"
        - "High"
        - "Moderate"
        - "Residual exposure is medium until diligence verifies how certifications map to new tokenization, prime-brokerage, and partner integrations."
    notes: >-
      Mitigation maturity is judged only from retained public evidence; it does
      not substitute for internal incident, audit, or vendor-management data.
    claimRefs: [CR005, CR006, CR007, CR009, CR014]
  - id: "TR003"
    title: "Partner / dependency risk register"
    columns:
      - "Dependency"
      - "Counterparty / role"
      - "Concentration"
      - "Failure scenario"
      - "Severity"
      - "Mitigation / residual exposure"
    rows:
      - - "Partner-distribution dependence"
        - "Fintech apps and institutions including named platforms such as eToro (US), Public.com, Kraken, and Bybit"
        - "Unknown"
        - "A large partner churns, is regulated, or scales down and Alpaca loses flow, brand leverage, or cross-sell opportunity."
        - "High"
        - "Mitigation: broad partner count and multi-product offering; residual exposure stays medium-high without partner revenue and account concentration."
      - - "Prime-brokerage build-out"
        - "Institutional clients, financing providers, and securities-lending ecosystem"
        - "Unknown"
        - "Institutional expansion consumes capital and operating attention faster than demand materializes."
        - "High"
        - "Mitigation: an equity round and line of credit were announced; residual exposure remains high without proceeds, availability, covenant, economics, utilization, and capital-ratio disclosure."
      - - "Trading-volume and market-cycle sensitivity"
        - "End-user market activity across equities, options, and crypto"
        - "Structural"
        - "Weaker retail or crypto activity compresses order flow, margin demand, and API monetization."
        - "High"
        - "Mitigation: product diversification and international expansion; residual exposure remains high because public evidence still points to activity-linked revenue."
      - - "Cross-border regulatory rollout"
        - "Local regulators and license regimes in target markets"
        - "Structural"
        - "Delayed approvals block local-product launches or force slower, partner-dependent expansion."
        - "Medium-High"
        - "Mitigation: stated licensing push and local presence investments; residual exposure is medium-high until the live approval matrix is disclosed."
    notes: >-
      Concentration is marked unknown where the assigned source pool names
      counterparties or scale but does not disclose revenue or account-share
      exposure.
    claimRefs: [CR005, CR008, CR009, CR010, CR011, CR012, CR013]
