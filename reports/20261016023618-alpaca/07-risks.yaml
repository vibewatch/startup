slug: "alpaca"
runDate: "2026-10-16"
company:
  name: "Alpaca"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Alpaca's risk profile is led by demonstrated regulatory-control failures and
    customer-facing reliability incidents, not by abstract startup uncertainty.
    The clearest mitigants are its self-clearing infrastructure, security
    certifications, and announced financing, but public evidence still leaves
    capital adequacy, partner concentration, and cross-border licensing progress
    under-disclosed.
sections:
  - id: "ranked-risk-view"
    title: "Ranked risk view"
    body: >-
      The highest-severity risks are the ones already visible in public records:
      two disclosed regulatory events at Alpaca Securities, including a 2026
      FINRA censure and fine tied to untimely and inaccurate trade reporting and
      a 2024 SEC cease-and-desist and fine tied to off-channel communications
      and recordkeeping failures. That history matters more because Alpaca is
      simultaneously widening product scope into tokenization, prime brokerage,
      margin, securities lending, and cross-border licensing, all of which raise
      the compliance and supervisory burden. Recent 2026 incident logs add a
      separate operational signal: market-data, order-processing, and
      account-position disruptions reached customer-facing workflows, including a
      temporary shutdown of notional and fractional opening trades during an
      October outage. The public mitigation case is real but incomplete:
      Alpaca cites       self-clearing memberships, security certifications, and announced
      financing, yet the residual exposure remains high until diligence confirms
      that controls, capital, and partner governance are scaling with the
      platform's ambitions.
    claimRefs: [CR001, CR002, CR003, CR006, CR008, CR009, CR010, CR014]
    figureRefs: [FR001]
  - id: "regulatory-and-legal-exposure"
    title: "Regulatory and legal exposure"
    body: >-
      Regulatory exposure is the chapter's top risk because it is supported by
      primary-source enforcement history rather than generic fintech caution.
      BrokerCheck lists two disclosed regulatory events for Alpaca Securities,
      and the disclosed facts span both execution controls and firm-wide
      supervision. In March 2026, FINRA censured and fined the firm after
      finding untimely reporting on roughly 1.87 million transactions,
      inaccurate reports on more than 2 million transactions, and supervisory
      systems not reasonably designed for compliance. The earlier SEC action
      shows a different but equally serious failure mode: widespread
      off-channel communications and recordkeeping breakdowns that likely
      impaired regulatory investigations. Product expansion adds fresh legal
      complexity rather than closing this risk; Alpaca's own disclosures say
      tokenization is geographically restricted, does not convey direct equity
      ownership, and depends on third parties, while management says new
      proceeds are being used to secure additional licenses.
    claimRefs: [CR001, CR002, CR003, CR004, CR009]
    tableRefs: [TR001]
  - id: "operational-and-platform-resilience"
    title: "Operational and platform resilience"
    body: >-
      Operational risk is elevated because public incidents and prior sanctions
      both point to scale-sensitive control weaknesses. ServiceAlert's recent
      log shows disruptions across market data, order processing, reporting, and
      account-position retrieval in September and October 2026, with one vendor
      market-data outage severe enough that Alpaca disabled notional and
      fractional opening trades to avoid stale-price execution. That history
      sits awkwardly beside Alpaca's own claim of 99.99% uptime and 600,000+
      daily orders self-cleared, because higher throughput and a broader product
      set increase the cost of failure even when reliability is usually strong.
      The company does present meaningful mitigants, including in-house
      self-clearing, DTCC/FICC/OCC memberships, ISO 27001 and SOC 2 Type II
      controls, and public language about reinforcing cybersecurity and platform
      resilience. Still, those mitigants are only partially proven publicly
      until diligence reviews postmortems, vendor redundancy, exception rates,
      and evidence that incident response is improving faster than product
      complexity.
    claimRefs: [CR005, CR006, CR007, CR009, CR014]
    tableRefs: [TR002]
  - id: "dependency-financial-and-diligence-gates"
    title: "Dependency, financial, and diligence gates"
    body: >-
      Alpaca's dependency risk is less about a single visible supplier and more
      about the accumulation of counterparties, regulators, and activity-linked
      economics. Independent and company sources both show a partner-facing
      model spanning hundreds of institutions and millions of brokerage
      accounts, with named relationships that include fintech apps and digital
      asset exchanges. That breadth is a growth advantage, but it also means a
      compliance failure, partner loss, or outage can propagate through other
      brands and jurisdictions quickly. Financial-model risk also remains
      material: Sacra explicitly warns that self-clearing requires regulatory
      capital that rises with trading volume and volatility, while revenue
      exposure to trading activity and crypto-linked demand can compress during
      weaker markets. The underwriting decision should therefore hinge on four
      diligence gates: current broker-dealer capital ratios and line-of-credit
      covenants, partner concentration by revenue and accounts, the live
      cross-border license matrix, and incident-performance data after the
      recent 2026 disruptions.
    claimRefs: [CR005, CR008, CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
