callouts:
  - calloutType: "risk"
    title: "Thesis-break trigger"
    body: >-
      Another material supervisory action or a repeat customer-facing outage
      during the prime-brokerage and tokenization expansion would indicate that
      Alpaca's controls are not scaling with product scope.
    claimRefs: [CR002, CR003, CR006, CR008]
  - calloutType: "recommendation"
    title: "Highest-priority diligence asks"
    body: >-
      Before underwriting upside, request current net-capital and liquidity data
      for Alpaca Securities, top-partner concentration, a cross-border license
      tracker, and the full postmortem plus remediation evidence for the 2026
      incidents.
    claimRefs: [CR009, CR010, CR012]
