companyProfile:
  summary: >-
    Alpaca is a California-based, API-first brokerage infrastructure company that evolved from a 2015 data and
    machine-learning startup into a self-clearing broker-dealer offering brokerage, trading, custody, clearing,
    cash-management, lending, and tokenization workflows for fintechs, neobanks, digital-asset platforms, and
    institutional partners. Public 2026 materials show a fast-growing private company with broad partner reach and
    repeated financing support, but they also leave several scale, economics, and controls questions unresolved.
