  topStrengths:
    - Self-clearing and direct market memberships increase operational control and may improve economics.
    - Broad partner reach and multi-asset product breadth give Alpaca several ways to embed in customer workflows.
    - Public growth and financing momentum indicate meaningful platform demand.
  topRisks:
    - Regulatory and supervisory failures show that controls have not been fully de-risked at scale.
    - Public disclosures conflict on account counts and lifetime financing, limiting confidence in headline metrics.
    - Cap-table, debt, and partner-concentration opacity make downside protection hard to underwrite.
  unresolvedGaps:
    - Audited or management-prepared FY2025/FY2026 financials are still needed to confirm ARR, gross margin, and burn.
    - >-
      Partner and revenue concentration, especially among major distribution channels, remains insufficiently
      quantified.
    - Full cap-table, preferred terms, and debt covenants are still needed to assess dilution and downside protection.
    - Jurisdiction-by-jurisdiction licensing progress and postmortem evidence for 2026 incidents remain incomplete.
