schemaVersion: report-v2
artifact: product-tech
slug: alpaca
runDate: 2026-10-16
company:
  name: Alpaca
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Alpaca delivers a broad brokerage-infrastructure stack rather than a single trading API:
    public product surfaces span account onboarding, funding, execution, clearing, tokenization,
    securities lending, cash management, and IPO access. The strongest evidence for technical
    differentiation is Alpaca's self-clearing posture and expanding direct market memberships,
    while the biggest open diligence questions are around independently verified tokenization
    scale, internal reliability architecture, and implementation/SLA depth.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Public materials consistently position Alpaca as brokerage infrastructure for partners
      that need more than order routing alone. The official Broker API page shows the company
      wrapping onboarding, funding, orders, documents, corporate actions, and real-time event
      feeds into an embeddable stack, while independent review coverage frames the same surface
      as brokerage-as-a-service infrastructure for fintechs and neobanks launching trading
      quickly. Product breadth also appears to be expanding beyond core equities rails: the
      current launch surface includes local-currency trading, fully paid securities lending,
      high-yield cash, 24/5 trading, omnibus sub-accounting, tokenization, and IPO allocation
      workflows. Crowdfund Insider's description of the new IPO-access feature is notable
      because it says the product reuses the existing Broker API order endpoint and Server-Sent
      Events, which suggests Alpaca is extending one core operating surface rather than shipping
      standalone point solutions.
    claimRefs: [CE001, CE002, CE004, CE005, CE008, CE013]
    tableRefs: [TE001, TE002]
  - id: operating-stack
    title: Operating stack, technical maturity, and control points
    body: >-
      Alpaca's public differentiation is as much operational as functional. Official pages say
      the company is self-clearing, exposes REST/FIX/OpenAPI-style developer surfaces plus SDKs,
      and reports measurable operating claims including 600,000+ daily self-cleared orders,
      1.5ms order processing on OMS v2, and 99.99% uptime. The clearest third-party corroboration
      is PostTrade 360's report that FICC and OCC memberships extend direct clearing from
      equities into options and Treasuries, reducing dependence on outside clearing brokers.
      Hiring signals also indicate continuing platform work underneath the customer surface:
      Alpaca is recruiting a senior technical product manager specifically to own platform
      maturity, CI/CD adoption, cost attribution, and infrastructure portability for new
      regions. That combination implies a real internal platform program, but the public record
      still lacks detailed disclosure on topology, redundancy design, vendor dependencies,
      incident budgets, or production SLOs.
    claimRefs: [CE003, CE007, CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-control-risks
    title: Differentiation, compliance posture, and technical risk
    body: >-
      Alpaca's strongest externally visible moat is owning more of the regulated workflow than a
      pure API front-end. Direct clearing memberships, broad asset coverage, and product modules
      such as tokenization, securities lending, and IPO access give partners more reasons to keep
      multiple workflows on one vendor. The company also markets a meaningful compliance wrapper,
      citing ISO 27001:2022, SOC 2 Type II, GDPR, EU-US DPF, CSA Level 1, and ICO standards.
      Still, some differentiation claims are not independently validated. Alpaca's 94% share of
      tokenized U.S. stocks and ETFs and $480M of tokenized assets under custody currently appear
      in a syndicated company press release rather than an arm's-length market study, and the same
      official surfaces stress that tokenized assets are speculative, geographically restricted,
      and issued by third parties rather than Alpaca itself. For diligence, that means tokenization
      is strategically interesting but not yet independently de-risked as a durable technical moat.
    claimRefs: [CE005, CE006, CE007, CE010, CE014, CE015]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / product line
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Broker API, Fintechs and institutional partners, Live core surface, "Embeds onboarding, funding, trading, reporting, and multiple asset classes into one partner stack", "Need partner-level implementation time, pricing, and SLA detail"]
      - [Trading API, Active traders and developer-built apps, Live core surface, "Developer-first API with SDKs, market data, backtesting hooks, OAuth, and commission-free trading positioning", "No public throughput tiers or error-budget disclosure by customer cohort"]
      - [Instant Tokenization Network, Tokenization partners and global end users, Live but geographically constrained, "24/7 API access and instant in-kind mint/redemption on tokenized equities", "Independent validation of adoption, issuer dependencies, and regulatory durability remains limited"]
      - [High Yield Cash, Broker partners and trading-account end users, Live add-on module, "Account-level cash yield feature integrated into brokerage workflow", "Need unit economics, program-bank concentration, and take-rate disclosure"]
      - [Fully Paid Securities Lending / Stock Lending, Broker partners and active investors, Live add-on module, "Creates an ancillary revenue surface and retention feature inside the same broker stack", "Need attach rate, borrower demand, and partner economics"]
      - [US IPO Access, Broker partners serving retail investors, New 2026 launch, "Reuses the existing Broker API workflow for conditional IPO orders and real-time updates", "Need allocation reliability, underwriter coverage, and international eligibility constraints"]
    notes: >-
      Status is based on public launch language rather than verified customer penetration; null
      economics and maturity details remain open diligence asks.
    claimRefs: [CE001, CE004, CE005, CE006, CE008]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Alpaca solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Launch a brokerage app quickly", "A fintech typically needs separate vendors for onboarding, custody, execution, and reporting", "Broker API packages onboarding, funding, trading, documents, and reporting in one embeddable stack", "OpenBankingTracker says partners can launch trading in days", "Independent proof of median implementation time is absent"]
      - ["Serve global investors in local hours", "Cross-border brokers usually need local funding and extended-hours routing workarounds", "Alpaca markets 24/5 trading and local-currency trading in 15+ currencies", "Broader addressable geography without building local market rails from scratch", "No public data on FX spreads, local-market exclusions, or country-by-country rollout depth"]
      - ["Offer retail IPO participation", "Retail brokers often rely on manual workflows or do not support primary issuance at all", "US IPO Access uses the normal Broker API endpoint plus SSE updates and automated journaling", "Faster rollout than standing up a new operational flow", "Need evidence on allocation fill rates, cancellations, and failed-order handling"]
      - ["Expose tokenized U.S. equity access", "Most brokers do not support 24/7 tokenized exposure", "Instant Tokenization Network adds tokenized-equity workflows with 24/7 API access", "Potential product differentiation for global partners and digital-asset platforms", "Third-party issuance, geographic restrictions, and unsettled regulation cap confidence"]
    notes: >-
      Benefits summarize public positioning and cited third-party descriptions; public sources do
      not disclose realized partner outcomes, conversion rates, or support burden.
    claimRefs: [CE001, CE002, CE006, CE008, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - ["Developer interfaces", "REST APIs, FIX, SDKs, OAuth, SSE, and OpenAPI support expose the platform to partners and developer-built apps", "Public SDK/documentation quality and client-side integration work", "No public versioning/deprecation policy or developer-error-rate metrics"]
      - ["Onboarding and account lifecycle", "Near-instant account opening, KYC as a service, KYB/business-account workflows, and document delivery", "Regulatory compliance operations and identity/risk controls", "Conversion friction, fraud loss rates, and manual-review burden are undisclosed"]
      - ["Trading and market-access services", "Order entry, order management, market data, advanced order types, options support, and 24/5 routing", "OMS v2, exchange/market-center connectivity, and after-hours liquidity", "Marketing-level latency and uptime claims are not independently audited in the public set"]
      - ["Clearing, custody, and post-trade", "Self-clearing and direct memberships across DTCC, FICC, and OCC keep more processing in-house", "Membership continuity, treasury operations, and settlement/risk infrastructure", "Operational failures or membership constraints would hit multiple products at once"]
      - ["Trust, security, and compliance", "ISO 27001:2022, SOC 2 Type II, GDPR, EU-US DPF, CSA Level 1, ICO, and broker/dealer or MSB entities provide assurance wrappers", "Internal controls, audit cadence, and regulator-facing compliance programs", "No public incident history, pen-test summary, or control-exception disclosure"]
    notes: >-
      Architecture is reconstructed from public surfaces and hiring materials; private vendor,
      topology, redundancy, and SRE details are not disclosed.
    claimRefs: [CE002, CE003, CE007, CE009, CE010, CE011]
