            - Node SDK
        - label: Brokerage workflows
          detail: Core account and trade lifecycle
          items:
            - Onboarding and KYC
            - Funding and cash movement
            - Order entry and monitoring
            - Corporate actions
            - Documents API
            - Market data and news
        - label: Value-added product modules
          detail: Publicly launched extensions on top of the core broker stack
          modules:
            - High Yield Cash
            - Fully Paid Securities Lending
            - Local Currency Trading
            - 24/5 Trading
            - US IPO Access
            - Instant Tokenization Network
            - OmniSub sub-accounting
        - label: Market and custody infrastructure
          detail: In-house control points that reduce third-party clearing dependence
          items:
            - Self-clearing broker-dealer
            - DTCC membership
            - FICC membership
            - OCC membership
            - Crypto/MSB entities
        - label: Trust and compliance controls
          detail: Public assurance wrappers around the platform
          outputs:
            - ISO 27001:2022
            - SOC 2 Type II
            - GDPR
            - EU-US DPF
            - CSA Level 1
            - ICO standards
    claimRefs: [CE002, CE007, CE009, CE010, CE011]
callouts:
  - calloutType: strength
    title: Self-clearing deepens product control
    body: >-
      The clearest moat signal is not just broad API coverage but direct ownership of clearing,
      custody, and post-trade processing across more asset classes, which can improve economics
      and make Alpaca harder to replace module by module.
    claimRefs: [CE007, CE009]
  - calloutType: risk
    title: Tokenization story is strategically interesting but lightly verified
    body: >-
      Tokenization is a visible differentiator, yet the strongest adoption metrics are still
      company-issued and the official disclosures emphasize third-party issuance, jurisdictional
      limits, and meaningful product risk.
    claimRefs: [CE006, CE014]
