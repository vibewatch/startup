          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV016
      - number: '8.2'
        title: 融资背景与可比参考
        blocks:
          - type: paragraph
            body: >-
              Alpaca 于 2026 年 1 月宣布以 $1.15 billion 估值完成 $150 million Series D，并获得独立的 $40 million 信贷额度。Crypto Briefing
              随后报道，$435 million 融资方案中包含 $135 million 股权，但现有文章没有披露新估值，也没有足够条款将该方案与 1 月轮次对账。Sacra 估算 2026 年 7 月 ARR 为 $200
              million；将这一估算与 1 月估值结合，可得到示意性的 5.75x 估值 / ARR 比率，而不是经过验证的交易倍数。Robinhood 的 $4.932 billion TTM 收入、20.51x
              市销率和 $93.49 billion 市值可作为公开市场参考，但其消费者经纪业务构成、规模、盈利能力和公开市场流动性，使其并不是 Alpaca 私有 B2B 基础设施模式的完美直接可比对象。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV010
              - CV011
              - CV016
      - number: '8.3'
        title: 乐观、基准与悲观情景评估
        blocks:
          - type: paragraph
            body: >-
              情景分析应保持条件性，因为公开记录不足以支持可辩护的股权价值区间。乐观情景要求经审计 ARR 达到或超过 Sacra 的估算、增长持久、自清算经济性改善、合作伙伴收入多元化且优先级有限。基准情景将 $1.15
              billion 估值视为尚未证实但在确认收入质量、利润率、资本要求和债务条款后可能成立。悲观情景由更低的经审计
              ARR、重大客户集中度、持续现金消耗、更高的监管资本需求或定价压力触发。这些触发因素同时影响倍数和所需资本，因此明确的尽调阈值比虚假的精确度更有用。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调事项
        blocks:
          - type: paragraph
            body: >-
              产品广度、自清算规模、机构会员资格和点名客户参考都是积极的战略信号，但不能证明公司已准备好 IPO
              或并购退出。退出评估需要经审计财务报表、队列留存、收入集中度、监管资本历史、损失和欺诈敞口、债务契约及完整的优先股堆叠；还需要更接近经纪基础设施、而非 Robinhood
              的私人交易参考。只有在经过验证的经济性无需激进倍数扩张就能支撑当前估值时，观点才应改善；如果经审计 ARR
              明显低于外部估算、某一合作伙伴贡献了不成比例的收入，或融资结构形成大量优先受偿债权主张，观点就应恶化。在这些问题解决前，无法负责任地量化流动性时间和目标回报。
            claimRefs:
              - CV002
              - CV003
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 决策阈值
            body: 只有在经审计 ARR、毛利率、现金使用、合作伙伴集中度、债务契约和优先权条款证明 $1.15 billion 估值无需依赖公开市场倍数扩张也能产生可接受的稀释后回报时，才应推进。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV016
