  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 1—5 的序数评分总结经审阅证据所记录的地域广度和技术栈控制力，不是市场份额或绩效指标。
    data:
      xAxis:
        label: 地域与交易场所广度
        min: 1
        max: 5
        lowLabel: Narrow / single-region
        highLabel: Multi-region / multi-venue
      yAxis:
        label: 技术栈控制与监管所有权
        min: 1
        max: 5
        lowLabel: Outsourced / partial
        highLabel: Self-clearing / full-stack
      points:
        - label: Alpaca
          x: 4
          'y': 5
          detail: 40 多个国家、自行清算会员资格和多个相邻基础设施模块
        - label: Upvest
          x: 3
          'y': 3
          detail: 欧洲客户分发和牌照较强，但审阅的来源池未显示类似 Alpaca 的自行清算深度
        - label: DriveWealth
          x: 3
          'y': 2
          detail: 已点名的白标竞争者，但指定来源池缺少更深入的控制力和定价细节
        - label: Saxo Bank
          x: 4
          'y': 2
          detail: 多资产经纪商和白标替代方案，但关于技术栈所有权的已审阅证据较少
        - label: Interactive Brokers
          x: 5
          'y': 3
          detail: 公开市场在位者，产品规模广泛，但指定来源池关于嵌入式基础设施的细节有限
        - label: 内部自建
          x: 1
          'y': 5
          detail: 理论控制力最高，但买方要承担经纪交易商设立、托管和清算整合的全部负担
    approximationNotes: 坐标是基于引用来源中记录的地域、交易场所覆盖和受监管基础设施控制力作出的有证据支持的序数判断，不代表隐含的基准评分。
