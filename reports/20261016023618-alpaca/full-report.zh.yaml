            body: >-
              公开记录中已经显现的风险具有最高严重度：Alpaca Securities 有两起披露的监管事件，包括 2026 年因交易报告不及时且不准确而受到 FINRA 谴责并罚款，以及 2024
              年因场外沟通和记录保存失败而受到 SEC 停止并终止令并罚款。这段历史之所以更重要，是因为 Alpaca 同时将产品范围扩展到代币化、主经纪、保证金、证券借贷和跨境牌照，所有这些都会提高合规和监督负担。2026
              年近期事故日志还给出独立的运营信号：市场数据、订单处理和账户持仓中断进入面向客户的工作流，包括一次 10 月事故期间暂时关闭名义金额和碎股开仓交易。公开缓解措施确实存在但并不完整：Alpaca
              提到自清算会员资格、安全认证和已宣布的融资，但在尽调确认控制、资本和合作伙伴治理是否跟上平台野心之前，剩余风险敞口仍然很高。
