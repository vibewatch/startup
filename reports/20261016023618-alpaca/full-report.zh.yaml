  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的可服务市场最好定义为经纪基础设施：API
              和运营通道，让受监管中介或金融科技公司无需搭建完整的经纪交易商体系，就能嵌入投资、托管、清算、开户、入金和市场数据工作流。被引用的产品页面持续面向机构、金融科技应用、银行、财富平台、加密交易所和代币化平台，而不是把
              Alpaca 定位为直接面向零售客户的目的地。这个边界很重要，因为替代方案不仅是其他经纪
              API，也包括内部自建和传统外包清算关系。因此，实际支出池包括受监管交易基础设施、合规密集型工作流自动化和多资产能力建设，但不包括终端客户获客预算，也不包括合作伙伴无法合法进入的市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
      - number: '2.2'
        title: 市场规模视角、需求驱动因素与扩张原因
        blocks:
          - type: paragraph
            body: >-
              公开 TAM 数据不完整，因此最稳妥的做法是采用多组受证据约束的运营视角，而不是给出一个被夸大的单一市场估算。公司控制的页面相隔一周发布，分别提到 200+ 和 300+ 个合作伙伴组织、7 million 和
              9 million 个账户；3 月的一份访谈摘要则报告 300+ 个合作伙伴、9 million 个账户和 45
              个国家。这些数字显示出有意义的渗透，但没有分母和测量日期定义就无法直接对账。其他需求信号包括支撑代币化股票的托管资产超过 $1.5 billion，以及六个月内月活跃 API
              用户增长近四倍。需求扩张来自机构将监管复杂性外包，也来自代币化和 AI 原生应用对可编程、受监管经纪通道的需求。
            claimRefs:
