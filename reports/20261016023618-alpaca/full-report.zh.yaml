      - number: '2.3'
        title: 买方、预算归属与采用约束
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方模式是 B2B2C：Alpaca
              向金融机构和金融科技平台内部的产品、经纪或创新团队销售，而最终用户是这些合作伙伴的零售投资者、顾问、交易员或加密原生客户。公开证据能充分说明细分覆盖和工作流匹配，但对具体预算科目和交易经济性的说明较弱，因此预算归属只能从产品定位推断。采用仍可能受到
              Alpaca
              产品路线图之外的市场准入摩擦拖累。当前最明显的例子是中国收紧离岸经纪准入，说明一个有意义的跨境需求池也会受到监管行动限制。产品披露还显示，代币化股票、期权和延长交易时段都带有法律、流动性或适当性约束，合作伙伴在采用前必须评估这些风险。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM013
              - CM014
      - number: '2.4'
        title: 展品
        blocks:
          - type: callout
            title: 需求正在超越数字券商启动套件
            body: 2026 年最强的需求信号，是代币化、AI 构建的金融产品与机构级经纪外包的汇合，而不只是更多零售交易应用。
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
          - type: callout
            title: 监管可能比产品打开渠道更快地关闭需求渠道
            body: 跨境经纪需求可以真实存在，但如果当地监管机构收紧准入规则，或代币化产品触发更窄的资格和披露要求，这些需求仍可能无法触达。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局覆盖平台、白标通道、成熟上市厂商与内部自建
        blocks:
          - type: paragraph
            body: >-
              相关买方并不是只在 Alpaca 和另一家零售经纪商之间做选择。已审阅来源显示，决策集合还包括区域性嵌入式投资专家、白标基础设施供应商、规模化上市厂商，以及内部组装更多技术栈的选项。FinanceMagnates
              将 Alpaca 与收购 WealthKernel 并推出欧洲股票业务后的 Upvest 直接比较，同一报道还点名 DriveWealth 和 Saxo Bank
              为其他白标竞争者。OpenBankingTracker 和 Alpaca 自己的网站也明确显示，公司在向数字银行、金融科技公司和全球平台销售，因此本地牌照、分发能力和运营信任与终端交易功能同样重要。
