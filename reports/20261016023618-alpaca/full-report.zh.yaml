        title: 融资、规模与利益相关方
        blocks:
          - type: paragraph
            body: >-
              公开融资证据显示，Alpaca 仍在积极融资，同时扩大战略投资者范围。2026 年 1 月，公司宣布以 $1.15 billion 估值完成 $150 million 的 Series D，获得 $40
              million 信贷额度，并为 Drive Capital 新增一个董事席位。2026 年 7 月，Alpaca 又宣布融资 $135 million，并称包括债务在内的披露融资总额已达 $435
              million，主要来自 Kraken 母公司 Payward 和 BMO。相同融资材料也说明，后续章节必须谨慎处理规模数据：Alpaca 在不同官方页面同时报告 7 million、9 million-plus
              和 10 million-plus 个经纪账户，并给出不同融资总额。因此，在将其作为估值的标准输入前，实际规模、资本结构和稀释经济性仍需管理层对账。
