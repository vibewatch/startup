            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR008
          - type: callout
            title: 最高优先级尽调事项
            body: 在评估上行空间前，应索取 Alpaca Securities 当前的净资本和流动性数据、头部合作伙伴集中度、跨境牌照跟踪表，以及 2026 年事故的完整事后复盘和整改证据。
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR010
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资观点与决策
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，信心中等、风险高；按最近披露的 $1.15 billion 融资估值看，估值偏高。投资逻辑是：一家拥有 300 多个组织合作伙伴、覆盖 40 多个国家、公司报告收入增长超过 100% 的自清算
              API 优先平台，可能复合成长为有价值的经纪基础设施层。反向逻辑是，收入暴露于交易活动、监管资本需求和价格竞争，可能同时损害增长质量和利润率。公开证据尚未证明经审计
              ARR、毛利率、现金生成、客户集中度或清算优先权，因此融资规模本身不足以支持买入决策或目标回报。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV016
