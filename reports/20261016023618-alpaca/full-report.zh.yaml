      - number: '3.2'
        title: Alpaca 以技术栈控制力、广度和开发者导向形成差异化
        blocks:
          - type: paragraph
            body: >-
              Alpaca 最清晰的差异化并不只是更便宜的经纪 API，而是对受监管技术栈拥有更强控制。公司称已凭借 DTCC、FICC 和 OCC 会员资格实现完全自清算；当前产品面覆盖 Broker
              API、代币化、高收益现金、24/5 交易、证券借贷和 omnibus 子账户核算。Lex 访谈显示，这套架构是对通过传统供应商拼接经纪交易商搭建、托管和清算之痛点的有意回应；Alpaca
              先赢得自动化交易者，之后再扩大 Broker API 需求。BrokerChooser 的认可和 Nasdaq 数据公告也强化了其围绕执行、基础设施信任和开发者工作流，而非消费者品牌分发的定位。
            claimRefs:
              - CP002
