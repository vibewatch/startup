  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 视角
      - 有证据支持的论点
      - 哪些情况会改变判断
    rows:
      - - 投资逻辑
        - 在超过 40 个国家拥有 300 多家机构合作伙伴，说明分发覆盖广泛。
        - 若合作伙伴层面的收入和留存显示变现能力弱或集中度高，投资逻辑将被削弱。
      - - 投资逻辑
        - 公司披露的收入同比增长超过一倍。
        - 若经审计结果显示增长明显更低，或收入主要是低质量的转手收入，投资逻辑将被削弱。
      - - 投资逻辑
        - 公司称 2025 年 4—5 月每天自行清算的订单超过 600,000 笔。
        - 若证据显示交易量无法转化为有吸引力的贡献利润，投资逻辑将被削弱。
      - - 反向逻辑
        - 自行清算所需的监管资本可能随交易量和波动性上升。
        - 如果多年资本计划留有充足缓冲，且监管资本回报率不断改善，这一担忧会减轻。
      - - 反向逻辑
        - 资金充足的基础设施竞争者和现有 API 可能带来定价压力。
        - 即使面对竞争，若经验证的定价权和毛利率仍在提升，这一担忧会减轻。
      - - 反向逻辑
        - 交易活动和加密资产采用率使收入暴露于周期性的市场参与度变化。
        - 合同约定的最低收费和多元化的经常性平台费用会降低周期性。
    notes: 投资逻辑采用公司宣称的规模；反向逻辑采用 Sacra 的独立风险分析，并需要数据室验证。
