chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Alpaca 将自己定位为 API 优先的经纪基础设施，而非面向消费者的经纪商。当前最有力的产品证据来自 About 页面、经纪产品页面和独立的 OpenBankingTracker 评测：Alpaca
              销售经纪、交易、加密和市场数据 API，让金融科技公司、数字银行、平台及机构客户能够在股票、ETF、期权、固定收益和加密资产上推出投资功能。公司仍以技术为身份根基：管理层称，业务始于 2015
              年的数据与机器学习初创公司，先打造 MarketStore，随后转向受监管的经纪基础设施。运营上，Alpaca 称总部位于加州，并以全球分布式团队运营，在 25 个国家拥有 250
              多名员工；但这一人数仍是公司自述，本资料池没有独立更新的佐证。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
