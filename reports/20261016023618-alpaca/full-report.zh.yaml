      - number: '1.2'
        title: 领导层、治理与监管体系
        blocks:
          - type: paragraph
            body: >-
              创始人延续性是公司故事的重要组成部分：Alpaca 仍将 Yoshi Yokokawa 和 Hitoshi Harada 认定为运营创始人，分别担任 CEO 和
              CPO。治理信息更多出现在融资和监管材料中，而非独立的董事会页面。2026 年 1 月的 Series D 将 Drive Capital 联合创始人 Chris Olsen 加入董事会；FINRA
              文件则披露了受监管子公司的负责人，包括总裁 David Dusseault 以及 COO / Principal Operations Officer Zachary
              Diaz。更广义的护城河来自牌照和市场结构进展：Alpaca Securities 于 2018 年成为注册美国经纪交易商，Alpaca Crypto 于 2022 年成为在 FinCEN 注册的
              MSB；公司称其在 2023 年获得 DTCC 批准、2024 年转为完全自清算，并于 2025 年取得 OCC、FICC 和 Nasdaq 会员资格。
            claimRefs:
