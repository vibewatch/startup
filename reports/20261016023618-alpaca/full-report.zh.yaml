        title: 持久性取决于自清算能否胜过本地分发或议价价格
        blocks:
          - type: paragraph
            body: >-
              护城河看起来有意义，但并非牢不可破。Sacra 对 2026 年 7 月 ARR 的估算仍显示 Alpaca 远小于 Interactive Brokers 等上市厂商；FinanceMagnates 则显示
              Upvest 带着新资本、每年 100 million-plus 的订单量和嵌入欧洲零售金融的客户阵容进入 2026 年。这一点很重要，因为已审阅的公开来源仍未提供
              Alpaca、Upvest、DriveWealth 或 Saxo 之间可直接比较的 B2B 合作伙伴定价。换句话说，Alpaca
              在自清算、跨境编排和广泛产品模块决定胜负的场景中最强；在本地封装、成熟厂商关系或价格主导采购占上风的场景中最脆弱。
