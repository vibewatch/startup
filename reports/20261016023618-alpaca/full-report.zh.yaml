        title: 收入模式与变现范围
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的公开财务故事不是纯 SaaS 订阅叙事，而是通过交易流、余额和运营服务变现的经纪基础设施模式。独立来源和公司控制的来源都将 Alpaca 描述为自清算经纪交易商，其 Broker API
              为金融科技合作伙伴打包开户、KYC、托管、清算、入金和报告；第三方分析还将订单流支付、佣金、保证金利息和 API 使用费列为明确收入项。官方产品页面还显示 Broker API 和 Trading API
              都提供高收益现金及证券借贷产品；除订单流外，Alpaca 也能从闲置现金和可借证券中变现。关键尽调限制是：这些公开页面都没有披露实际 take
              rate、附加率、按产品划分的贡献利润，或软件式经常性费用与受市场成交量影响的收入之间的构成。
