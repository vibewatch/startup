      - 概率信号
    rows:
      - - 乐观
        - 经审计的 ARR 达到或超过 $200M 估计值；增长保持强劲；利润率改善；集中度和优先权级别有限。
        - 估值可能有理由高于 $1.15B，但在缺少经审计现金流和持股条款的情况下，没有公开估值区间或目标回报能够站得住脚。
        - 跨产品和跨司法辖区执行；监管资本扩张。
        - 如果经审计的经济数据印证外部估计和公司宣称的增长，则信号为正面。
      - - 基准
        - ARR 接近外部估计，但利润率、现金使用、集中度、债务和优先权问题仍只得到部分解决。
        - 将 $1.15B 视为尽调锚点，而非公允价值；价格和结构必须补偿尚未解决的非公开公司证据缺口。
        - 估值倍数压缩；增长放缓；稀释；流动性延迟。
        - 当前公开证据最有力地支持这一有条件情景。
      - - 悲观
        - 经审计的 ARR 低于估计值，或一个及以上合作伙伴高度集中、资本需求上升、竞争压低费率。
        - 1 月估值无法支持；要求更低价格、更强的优先权，或不投资。
        - 下轮融资、持续资本调用、监管约束和低迷的退出所得。
        - 由财务、集中度、资本或股权结构表尽调未通过触发。
    notes: 由于现有公开证据缺少经审计财务数据、净债务、股权结构条款和可比私募交易，因此不设定概率百分比或估值区间。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV009
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Alpaca 的公开发展路径始于 2015 年的数据和机器学习业务，到 2026 年已成为一家自行清算、获得全球融资的经纪基础设施平台。
    data:
      items:
        - date: '2015'
          label: 创立与技术起源
          detail: Yoshi Yokokawa 和 Hitoshi Harada 创立了公司；公司最初从事数据库和机器学习业务，并打造了 MarketStore。
        - date: '2018'
          label: 美国经纪交易商注册
          detail: Alpaca Securities 成为在 FINRA 和 SEC 注册的美国经纪交易商。
        - date: '2022'
          label: 加密实体注册
          detail: Alpaca Crypto 成为在 FinCEN 注册的货币服务企业。
        - date: '2023'
          label: DTCC 批准
          detail: Alpaca 称其清算实体已获 DTCC 批准，扩大了市场结构覆盖范围。
        - date: '2024'
          label: 转向完全自行清算
          detail: 管理层称 Alpaca 于 2024 年转向完全自行清算。
        - date: '2025'
          label: 监管会员资格与认可扩大
          detail: Alpaca 称其于 2025 年新增 OCC、FICC 和 Nasdaq 会员资格，CB Insights 还在 2025 年 10 月将其列入 Fintech 100。
        - date: 2026-01
          label: D 轮融资与董事会扩张
          detail: $150M D 轮融资，估值 $1.15B；另有 $40M 信用额度，以及 Drive Capital 的 Chris Olsen 获得一个董事席位。
        - date: 2026-07
          label: 后续融资与扩张推进
          detail: 新增 $135M 融资使披露的累计融资达到 $435M（含债务）；公司同时强调了印度、英国 / 欧盟和全球股票业务的扩张里程碑。
    approximationNotes: null
    claimRefs:
