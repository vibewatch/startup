              Alpaca 的公开规模代理指标足以说明商业吞吐量有意义，但不足以评估持久的单位经济性。2026 年 1 月融资公告称，公司覆盖 40 多个国家的 300 多个组织并支持数百万经纪账户；Broker API
              页面则单独宣传 40 多个国家的 200 多个合作伙伴，以及 2025 年 4 月至 5 月每日自清算 600,000-plus 笔订单、99.99% 的正常运行时间。Sacra 进一步估计，2025 年底
