      - number: '1.4'
        title: 里程碑与风险观察点
        blocks:
          - type: paragraph
            body: >-
              里程碑路径具备可信度：Alpaca 从 2015 年的基础设施初创公司发展为受监管的自清算经纪交易商，产品范围不断扩大，持续推进全球扩张，并反复获得私人融资。经纪产品页面还显示出可观吞吐量：管理层称，2025 年
              4 月至 5 月期间每日自清算订单超过 600,000 笔，自 2025 年 1 月起正常运行时间达到 99.99%。但合规记录使其无法成为一条纯粹的基础设施上行故事。FINRA BrokerCheck
              显示两起最终监管事件，包括 2024 年 SEC 针对场外沟通的停止并终止令 / 谴责及 $400,000 罚款，以及 2026 年 FINRA 针对交易报告问题的谴责和 $300,000
              罚款。这些披露并不否定产品护城河，却提高了对控制、报告纪律和进一步扩张准备度的尽调优先级。
