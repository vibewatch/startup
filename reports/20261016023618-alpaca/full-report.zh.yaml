      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开资本信号是，Alpaca 在扩展产品和监管范围的同时持续叠加融资，而不是依靠透明披露的经营现金流自筹资金。公司于 2026 年 1 月正式宣布以 $1.15 billion 估值完成 $150
              million Series D，并获得 $40 million 信贷额度；资金用于当地牌照、机构交易能力、代币化相关基础设施、网络安全和平台韧性。独立报道随后称，2026 年 $435 million
              融资方案中包含额外 $135 million
              股权融资。这一顺序符合资本密集型基础设施路线：自清算、多资产扩张和国际牌照可能改善长期利润率，但在管理层披露现金余额、月度烧钱速度、监管资本要求以及债务或契约条款前，近期资本需求仍会维持高位。
            claimRefs:
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: 收入质量风险与财务结论
        blocks:
          - type: paragraph
            body: >-
              收入质量看起来有希望，但仅凭公开证据尚不足以评估。支持利润率逻辑的最好证据是 Alpaca 的自清算姿态：官方页面和 2025
              年评测都将减少对第三方清算商的依赖及成本有效的交易视为结构性优势。最大的反向因素是合作伙伴经济性不透明。Cointelegraph 报道称，在 Binance 渠道上，Binance 将拿走 Alpaca
              订单流支付费用的 50%，以及扣除用户利息后的剩余股票借贷利润的 65%，这说明 Alpaca 报告的规模可能伴随显著的收入分成抵减。公开来源也没有披露实际定价、毛利率、CAC /
              回本周期、销售周期、客户集中度、烧钱速度或现金跑道。因此，财务结论是：Alpaca 可能拥有可信的多元收入引擎和合理的自清算护城河，但当前公开证据仍不足以评估利润率路径或融资独立性。
            claimRefs:
              - CI011
              - CI015
              - CI016
