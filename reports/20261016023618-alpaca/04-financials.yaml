  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: margin-and-burn
      missingEvidence: Management or audited financial statements showing gross profit, operating expenses, cash balance, and monthly burn for FY2025 and FY2026.
      whyItMatters: Public topline and funding disclosures do not show whether self-clearing is already producing attractive gross margins or simply increasing capital intensity.
      diligencePath: Request FY2025 and YTD FY2026 P&L, cash-flow statement, balance sheet, and regulatory-capital schedules by legal entity.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: CAC, payback, implementation cost, sales cycle, and retention data by partner segment and geography.
      whyItMatters: A large partner footprint does not establish efficient customer acquisition or durable recurring economics.
      diligencePath: Request cohort data for partner acquisition, onboarding cost, gross retention, net retention, and time-to-live for enterprise accounts.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Revenue, gross profit, and assets under custody contribution from Binance and the rest of the top-10 partners.
      whyItMatters: Cointelegraph's disclosed Binance revenue split shows that scale can coexist with weak economics if major partners capture most of the margin.
      diligencePath: Request top-partner concentration tables, revenue-share schedules, minimum-commitment terms, and renewal or termination rights.
