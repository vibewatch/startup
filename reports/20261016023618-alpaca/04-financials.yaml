schemaVersion: "report-v2"
artifact: financials
slug: alpaca
runDate: 2026-10-16
company:
  name: Alpaca
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a diversified brokerage-infrastructure revenue model built on
    self-clearing execution, lending, cash-management, and API fees, and it shows the company
    kept raising capital through 2026 to fund global licensing, institutional product build-out,
    and resilience spending. What remains missing for underwriting is the realized economics:
    public sources do not disclose gross margin, burn, CAC/payback, partner concentration, or
    the split between marketing claims and recurring revenue.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization surface
    body: |-
      Alpaca's public financial story is not a pure SaaS subscription narrative; it is a
      brokerage-infrastructure model that monetizes transaction flow, balances, and operating
      services. Independent and company-controlled sources both describe Alpaca as a self-clearing
      broker-dealer whose Broker API bundles onboarding, KYC, custody, clearing, funding, and
      reporting for fintech partners, while third-party analysis adds payment-for-order-flow,
      commission fees, margin interest, and API usage fees as explicit revenue lines. Official
      product surfaces also show high-yield cash and securities-lending products on both Broker
      API and Trading API, which implies Alpaca can monetize idle cash and lendable securities in
      addition to order flow. The key underwriting limitation is that none of these public
      surfaces disclose realized take rates, attach rates, contribution margin by product, or
      the mix between software-like recurring fees and market-volume-sensitive revenue.
    claimRefs: [CI001, CI009, CI010, CI011, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics-proxies
    title: Traction and unit-economics proxies
    body: |-
      Alpaca has enough public scale proxies to suggest meaningful commercial throughput, but not
      enough to underwrite durable unit economics. The January 2026 funding announcement says the
      company worked with more than 300 organizations across 40-plus countries and supported
      millions of brokerage accounts, while the Broker API page separately markets 200-plus
      partners in 40-plus countries and 600,000-plus daily orders self-cleared in April-May 2025
      with 99.99% uptime since January 2025. Sacra goes further, estimating roughly $123 million
      of ARR at year-end 2025 and $200 million by July 2026. That is enough to establish strong
      top-line momentum and heavy platform usage, but it is still not enough to answer whether
      growth is driven by a diversified partner base, high-quality recurring fees, tokenization
      volumes, or a few concentrated distribution relationships.
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financing-dependency
    title: Capital adequacy and financing dependency
    body: |-
      The clearest public capital signal is that Alpaca continued stacking financing alongside
      product and regulatory expansion rather than self-funding that expansion from transparently
      disclosed operating cash flow. The company officially announced a $150 million Series D at
      a $1.15 billion valuation and a $40 million line of credit in January 2026, with proceeds
      earmarked for local licenses, institutional trading capabilities, tokenization-adjacent
      infrastructure, cybersecurity, and platform resilience. Independent reporting later
      described an additional $135 million of equity inside a $435 million 2026 financing package.
      That sequence is consistent with a capital-intensive infrastructure roadmap: self-clearing,
      multi-asset expansion, and international licensing can plausibly improve long-run margins,
      but they also keep near-term capital needs elevated until management discloses cash balance,
      monthly burn, regulatory capital requirements, and debt or covenant terms.
    claimRefs: [CI012, CI013, CI016]
  - id: revenue-quality-risks-and-verdict
    title: Revenue quality risks and financial verdict
    body: |-
      Revenue quality looks promising but not yet underwritable from public evidence alone. The
      best support for a margin thesis is Alpaca's self-clearing posture: official pages and the
      2025 review both frame reduced reliance on third-party clearers and cost-effective trading as
      a structural advantage. The best counterweight is partner-economics opacity. Cointelegraph
      reports that Binance will take 50% of Alpaca's payment-for-order-flow fees and 65% of
      remaining stock-lending profit after user interest on Binance's channel, which shows that
      Alpaca's reported scale may carry meaningful revenue-sharing offsets. Public sources also do
      not disclose realized pricing, gross margin, CAC/payback, sales cycle, customer
      concentration, burn, or cash runway. The financial verdict is therefore that Alpaca likely
      has a credible multi-line revenue engine and a plausible self-clearing moat, but current
      public evidence is still insufficient to underwrite margin path or financing independence.
    claimRefs: [CI011, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Order-flow economics
        - PFOF and execution-related economics tied to partner and end-user trading activity
        - Fee share on routed volume
        - Sacra identifies PFOF as a revenue stream; Binance terms disclosed by Cointelegraph show Alpaca shares that revenue with at least one major channel partner
        - Publicly evidenced mechanism, but realized net take rate is undisclosed
        - Provide net revenue yield by asset, geography, and largest partner
      - - Securities lending
        - Stock-lending or fully paid securities lending economics shared across Alpaca, partners, and end users
        - Lending spread / profit share
        - Official 2025 product releases show lending on Broker API and Trading API; Cointelegraph says Binance receives 65% of remaining profit after user interest
        - Revenue line is confirmed, but contribution margin and utilization are undisclosed
        - Provide lendable asset base, utilization, and net spread after partner and user payouts
      - - Cash-management yield
        - High-yield cash / FDIC sweep economics on uninvested balances
        - Net interest spread or program fee
        - Official pages market configurable high-yield cash with FDIC sweep coverage, but no public APY pass-through or spread disclosure
        - Product is real, monetization quantum is not public
        - Provide average cash balances, APY paid to users, and net interest margin retained
      - - API / platform fees
        - Enterprise or usage-based fees for brokerage-infrastructure services
        - Contract minimums, setup fees, or usage fees
        - Sacra says API usage fees are part of the model; no public list pricing was found
        - Third-party-reported only
        - Provide standard contract structure, minimums, and share of revenue from software-like fees
      - - Margin, commissions, and other trading fees
        - Margin interest, commission fees, and other transaction economics
        - Spread / commission / financing revenue
        - Sacra cites commission fees and margin interest; official surfaces show the product breadth but not realized economics
        - Revenue stream is plausible and partially evidenced, but not quantified
        - Provide asset mix, margin balances, and effective yield by product
    notes: >-
      Public evidence confirms the existence of multiple revenue streams, but not their realized
      mix or margin contribution; rows separate evidenced mechanisms from undisclosed economics.
    claimRefs: [CI009, CI010, CI011, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price or unit
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Trading API equities and options
        - Commission-free execution for eligible flows
        - List pricing is public; realized economics depend on PFOF, margin, and partner routing mix
        - No public disclosure of net yield per order or customer cohort
        - OpenBanking Tracker; Sacra
      - - Broker API high-yield cash
        - Competitive APY; up to $1M FDIC insurance on one official page and up to $2.5M on another
        - Public marketing discloses the customer benefit, not Alpaca's retained spread
        - APY, bank-partner economics, and realized take rate are undisclosed
        - Alpaca Broker API page; Alpaca homepage
      - - Broker API / Trading API stock lending
        - End users can earn passive income on eligible securities
        - Public product feature; realized revenue depends on lendable inventory and payout split
        - No public utilization, rebate, or take-rate disclosure
        - Alpaca 2025 review; Alpaca homepage; Cointelegraph
      - - Broker API platform bundle
        - No public list price found
        - Only the product scope is public; realized pricing appears contract-based
        - Minimums, setup fees, enterprise discounts, and partner rev-share terms are not public
        - Alpaca Broker API page; OpenBanking Tracker
    notes: >-
      This table distinguishes public product marketing from realized economics; "price or unit"
      often remains qualitative because Alpaca does not publish a standard enterprise price book.
    claimRefs: [CI001, CI009, CI010, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR / revenue scale proxy
        - Sacra estimates $123M ARR at end-2025 and $200M ARR in July 2026; company separately said revenue more than doubled YoY in January 2026
        - Medium
        - Establishes strong growth momentum but still mixes company statements with third-party estimates
        - Reconcile FY2025 and FY2026 revenue, ARR, and deferred-revenue bridge to audited statements
      - - Self-cleared order throughput
        - 600000+
        - High
        - Platform throughput is a leading indicator for monetizable trading activity and operating leverage potential
        - Provide order mix by asset class, geography, and partner tier
      - - Partner / distribution scale
        - Hundreds of partners across 40+ countries; official surfaces disagree on whether the current count is 200+ or 300+
        - Medium
        - Distribution breadth matters for concentration risk and international operating leverage
        - Provide top-10 partner revenue share and cohort retention by partner archetype
      - - Gross margin
        - null
        - Low
        - Gross margin is the core test of whether self-clearing actually improves economics
        - Provide gross profit by execution, custody, cash, lending, and software components
      - - CAC / payback / sales cycle
        - null
        - Low
        - Enterprise brokerage infrastructure can look attractive on volume while still consuming heavy sales and onboarding spend
        - Provide CAC, payback, implementation time, and win rates by segment
      - - Burn / runway / regulatory capital headroom
        - null
        - Low
        - Repeated financing and a line of credit imply capital intensity, but public sources do not quantify cash sufficiency
        - Provide cash balance, monthly burn, regulatory capital minima, LOC lender, covenants, and maturity
      - - Binance channel economics
        - 50% of PFOF fees and 65% of remaining stock-lending profit after user interest go to Binance on the disclosed program
        - Medium
        - Shows that volume growth can coexist with diluted unit economics if distribution partners capture the economics
        - Quantify Binance revenue share as a percent of total revenue and gross profit
    notes: >-
      Null values mean the metric was not publicly disclosed in the assigned evidence pool; they are
      intentional diligence gaps rather than zeroes.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI008, CI013, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a layered revenue model that starts with partner distribution,
      flows through self-clearing infrastructure, and monetizes transaction, lending, and cash
      balances before gross profit is offset by revenue-sharing and infrastructure spend.
    data:
      nodes:
        - id: partner-distribution
          label: Partner distribution
          value: Hundreds of partners in 40+ countries
          note: Official sources differ on current partner count, but both show broad B2B reach.
        - id: self-clearing-stack
          label: Self-clearing infrastructure
          value: KYC, custody, clearing, funding, reporting
          note: Broker API bundles regulated operations that partners would otherwise need to source separately.
        - id: monetizable-activity
          label: Monetizable activity
          value: 600000+ daily orders self-cleared
          note: Throughput proxy disclosed for April-May 2025.
        - id: transaction-revenue
          label: Transaction revenue
          value: PFOF, commissions, margin interest, API usage fees
          note: Sacra provides the most explicit public list of these revenue lines.
        - id: balance-and-lending
          label: Balance and lending revenue
          value: High-yield cash and securities lending
          note: Official surfaces show both products across Broker API and Trading API.
        - id: gross-profit-modifiers
          label: Gross-profit modifiers
          value: Revenue sharing plus licensing, cyber, and resilience spend
          note: Binance rev-share and 2026 use-of-funds disclosures show why topline alone is not enough to underwrite margin.
      edges:
        - from: partner-distribution
          to: self-clearing-stack
          label: embeds
        - from: self-clearing-stack
          to: monetizable-activity
          label: powers
        - from: monetizable-activity
          to: transaction-revenue
          label: generates
        - from: transaction-revenue
          to: balance-and-lending
          label: expands into
        - from: balance-and-lending
          to: gross-profit-modifiers
          label: netted by
    claimRefs: [CI001, CI003, CI009, CI010, CI011, CI013, CI016]
