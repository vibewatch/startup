company:
  name: Alpaca
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Alpaca has grown from a 2015 data and machine-learning startup into a
    California-headquartered, self-clearing brokerage infrastructure provider
    with broad regulatory reach and two 2026 financings that kept it private
    but well-funded. The strongest evidence also flags two diligence caveats
    that later chapters should reuse as ground truth: official scale
    disclosures drift across public surfaces, and FINRA BrokerCheck shows
    recent regulatory penalties that complicate the moat narrative.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Alpaca presents itself as API-first brokerage infrastructure rather than a
      consumer brokerage. The strongest current product evidence combines the
      About page, broker product page, and independent OpenBankingTracker
      review: Alpaca sells broker, trading, crypto, and market-data APIs that
      let fintechs, neobanks, platforms, and institutional clients launch
      investing features across stocks, ETFs, options, fixed income, and
      crypto. The company also still roots its identity in technology:
      management says the business began in 2015 as a data and machine-learning
      startup that built MarketStore before evolving into regulated brokerage
      infrastructure. Operationally, Alpaca says it is headquartered in
      California and runs as a globally distributed company with more than 250
      employees in 25 countries, but that workforce figure remains
      company-claimed rather than independently refreshed in this pool.
    claimRefs: [CO001, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-governance-and-regulatory-stack
    title: Leadership, governance, and regulatory stack
    body: >-
      Founder continuity is a meaningful part of the company story: Alpaca
      still identifies Yoshi Yokokawa and Hitoshi Harada as its operating
      founders, with Yokokawa as CEO and Harada as CPO. Governance visibility
      improves in financing and regulatory materials rather than on a
      standalone board page. The January 2026 Series D added Drive Capital
      co-founder Chris Olsen to the board, while FINRA filings expose
      regulated-subsidiary operators such as President David Dusseault and COO
      / Principal Operations Officer Zachary Diaz. The broader moat claim comes
      from licensing and market-structure progress. Alpaca Securities became a
      registered U.S. broker-dealer in 2018, Alpaca Crypto became a
      FinCEN-registered MSB in 2022, and the company says it layered on DTCC
      approval in 2023, a shift to fully self-clearing in 2024, and OCC, FICC,
      and Nasdaq memberships in 2025.
    claimRefs: [CO002, CO006, CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: funding-scale-and-stakeholders
    title: Funding, scale, and stakeholders
    body: >-
      Public financing evidence shows a company that is still raising
      aggressively while broadening its strategic investor set. In January
      2026, Alpaca announced a $150 million Series D at a $1.15 billion
      valuation, a $40 million line of credit, and a new board seat for Drive
      Capital. In July 2026, Alpaca announced another $135 million raise and
      said disclosed financing now totaled $435 million inclusive of debt
      primarily from Payward, the parent of Kraken, and BMO. The same funding
      materials also show why later chapters should treat scale figures
      carefully. Alpaca simultaneously reports 7 million, 9 million-plus, and
      10 million-plus brokerage-account counts across official surfaces,
      alongside different funding totals, which means exact live scale, capital
      structure, and dilution economics still need management reconciliation
      before they are reused as canonical valuation inputs.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-risk-watchpoints
    title: Milestones and risk watchpoints
    body: >-
      The milestone path is credible: Alpaca moved from a 2015 infrastructure
      startup into a regulated self-clearing broker-dealer with widening
      product breadth, global expansion steps, and repeated private financing
      support. The broker product page also suggests meaningful throughput,
      with management claiming more than 600,000 daily orders self-cleared in
      April-May 2025 and 99.99% uptime since January 2025. But the compliance
      record prevents a clean infrastructure-only upside story. FINRA
      BrokerCheck shows two final regulatory events, including a 2024 SEC
      cease-and-desist/censure with a $400,000 penalty over off-channel
      communications and a 2026 FINRA censure with a $300,000 fine over
      trade-reporting issues. Those disclosures do not invalidate the product
      moat, but they do raise diligence priority around controls, reporting
      discipline, and readiness for further scale.
    claimRefs: [CO008, CO015, CO016]
    figureRefs: [FO001]
