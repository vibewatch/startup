figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Alpaca’s public path runs from a 2015 data and machine-learning origin
      to a 2026 self-clearing, globally financed brokerage-infrastructure
      platform.
    data:
      items:
        - date: "2015"
          label: Founding and technical origin
          detail: >-
            Founded by Yoshi Yokokawa and Hitoshi Harada; the company started
            as a database and machine-learning business and built MarketStore.
        - date: "2018"
          label: U.S. broker-dealer registration
          detail: >-
            Alpaca Securities became a registered U.S. broker-dealer with
            FINRA and the SEC.
        - date: "2022"
          label: Crypto-entity registration
          detail: Alpaca Crypto became a FinCEN-registered money services business.
        - date: "2023"
          label: DTCC approval
          detail: >-
            Alpaca says the clearing entity was approved by DTCC, extending its
            market-structure reach.
        - date: "2024"
          label: Transition to fully self-clearing
          detail: Management says Alpaca transitioned to fully self-clearing in 2024.
        - date: "2025"
          label: Regulatory memberships and recognition broadened
          detail: >-
            Alpaca says it added OCC, FICC, and Nasdaq memberships in 2025,
            and CB Insights named it to the Fintech 100 in October 2025.
        - date: 2026-01
          label: Series D and board expansion
          detail: >-
            $150M Series D at a $1.15B valuation, plus a $40M line of credit
            and a board seat for Drive Capital’s Chris Olsen.
        - date: 2026-07
          label: Follow-on financing and expansion push
          detail: >-
            $135M additional financing brought disclosed funding to $435M
            inclusive of debt, while the company highlighted India, UK/EU, and
            global-equities expansion milestones.
    approximationNotes: null
    claimRefs: [CO001, CO003, CO006, CO007, CO008, CO009, CO010]
callouts:
  - calloutType: strength
    title: Self-clearing is the clearest structural moat
    body: >-
      The most defensible part of the overview is not brand or consumer
      distribution; it is the regulated operating stack that moved from
      broker-dealer registration to DTCC approval, self-clearing, and
      additional market memberships.
    claimRefs: [CO006, CO008, CO015]
  - calloutType: risk
    title: Canonical scale metrics still need reconciliation
    body: >-
      Later chapters should not reuse a single public account-count or
      funding-total number without qualification, because Alpaca’s own 2026
      surfaces present materially different scale disclosures.
    claimRefs: [CO010, CO011, CO012, CO013, CO014]
