      - number: '3.2'
        title: Alpaca differentiates on stack control, breadth, and developer orientation
        blocks:
          - type: paragraph
            body: |-
              Alpaca's clearest differentiation is not simply a cheaper brokerage API; it is tighter control over the
              regulated stack. The company says it is fully self-clearing with DTCC, FICC, and OCC memberships, and
              its current product surface spans Broker API, tokenization, high-yield cash, 24/5 trading, securities
              lending, and omnibus sub-accounting. The Lex interview suggests this architecture was a deliberate
              response to the pain of stitching together broker-dealer setup, custody, and clearing through legacy
              providers, and that Alpaca first won automated traders before expanding to broader Broker API demand. The
              BrokerChooser recognition and Nasdaq data announcement reinforce a positioning built around execution,
              infrastructure trust, and developer workflow rather than consumer-brand distribution.
            claimRefs:
