  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: |-
              Alpaca's public financial story is not a pure SaaS subscription narrative; it is a
              brokerage-infrastructure model that monetizes transaction flow, balances, and operating
              services. Independent and company-controlled sources both describe Alpaca as a self-clearing
              broker-dealer whose Broker API bundles onboarding, KYC, custody, clearing, funding, and
              reporting for fintech partners, while third-party analysis adds payment-for-order-flow,
              commission fees, margin interest, and API usage fees as explicit revenue lines. Official
              product surfaces also show high-yield cash and securities-lending products on both Broker
              API and Trading API, which implies Alpaca can monetize idle cash and lendable securities in
              addition to order flow. The key underwriting limitation is that none of these public
              surfaces disclose realized take rates, attach rates, contribution margin by product, or
              the mix between software-like recurring fees and market-volume-sensitive revenue.
            claimRefs:
              - CI001
              - CI009
              - CI010
              - CI011
              - CI015
