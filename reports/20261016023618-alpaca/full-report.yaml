      - number: '1.3'
        title: Funding, scale, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence shows a company that is still raising aggressively while broadening its
              strategic investor set. In January 2026, Alpaca announced a $150 million Series D at a $1.15 billion
              valuation, a $40 million line of credit, and a new board seat for Drive Capital. In July 2026, Alpaca
              announced another $135 million raise and said disclosed financing now totaled $435 million inclusive of
              debt primarily from Payward, the parent of Kraken, and BMO. The same funding materials also show why later
              chapters should treat scale figures carefully. Alpaca simultaneously reports 7 million, 9 million-plus,
              and 10 million-plus brokerage-account counts across official surfaces, alongside different funding totals,
              which means exact live scale, capital structure, and dilution economics still need management
              reconciliation before they are reused as canonical valuation inputs.
