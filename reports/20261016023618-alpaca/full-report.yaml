        title: Operating stack, technical maturity, and control points
        blocks:
          - type: paragraph
            body: >-
              Alpaca's public differentiation is as much operational as functional. Official pages say the company is
              self-clearing, exposes REST/FIX/OpenAPI-style developer surfaces plus SDKs, and reports measurable
              operating claims including 600,000+ daily self-cleared orders, 1.5ms order processing on OMS v2, and
              99.99% uptime. The clearest third-party corroboration is PostTrade 360's report that FICC and OCC
              memberships extend direct clearing from equities into options and Treasuries, reducing dependence on
              outside clearing brokers. Hiring signals also indicate continuing platform work underneath the customer
              surface: Alpaca is recruiting a senior technical product manager specifically to own platform maturity,
              CI/CD adoption, cost attribution, and infrastructure portability for new regions. That combination implies
              a real internal platform program, but the public record still lacks detailed disclosure on topology,
              redundancy design, vendor dependencies, incident budgets, or production SLOs.
