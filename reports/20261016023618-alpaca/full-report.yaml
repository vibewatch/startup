      - number: '3.3'
        title: Durability depends on where self-clearing beats local distribution or negotiated price
        blocks:
          - type: paragraph
            body: |-
              The moat looks meaningful, but not unassailable. Sacra's July 2026 ARR estimate still leaves Alpaca far
              smaller than public incumbents such as Interactive Brokers, and FinanceMagnates shows Upvest entering
              2026 with fresh capital, 100 million-plus annual order volume, and a client roster embedded in European
              retail finance. That matters because the reviewed public sources still do not provide directly comparable
              B2B partner pricing for Alpaca, Upvest, DriveWealth, or Saxo. In other words, Alpaca appears strongest
              where self-clearing, cross-border orchestration, and broad product modules are decisive, and most exposed
              where local wrappers, incumbent relationships, or price-led procurement dominate the buying decision.
            claimRefs:
              - CP007
