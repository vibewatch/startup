      - number: '5.3'
        title: Differentiation, compliance posture, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Alpaca's strongest externally visible moat is owning more of the regulated workflow than a pure API
              front-end. Direct clearing memberships, broad asset coverage, and product modules such as tokenization,
              securities lending, and IPO access give partners more reasons to keep multiple workflows on one vendor.
              The company also markets a meaningful compliance wrapper, citing ISO 27001:2022, SOC 2 Type II, GDPR,
              EU-US DPF, CSA Level 1, and ICO standards. Still, some differentiation claims are not independently
              validated. Alpaca's 94% share of tokenized U.S. stocks and ETFs and $480M of tokenized assets under
              custody currently appear in a syndicated company press release rather than an arm's-length market study,
              and the same official surfaces stress that tokenized assets are speculative, geographically restricted,
              and issued by third parties rather than Alpaca itself. For diligence, that means tokenization is
              strategically interesting but not yet independently de-risked as a durable technical moat.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Self-clearing deepens product control
            body: >-
              The clearest moat signal is not just broad API coverage but direct ownership of clearing, custody, and
              post-trade processing across more asset classes, which can improve economics and make Alpaca harder to
              replace module by module.
            calloutType: strength
            claimRefs:
