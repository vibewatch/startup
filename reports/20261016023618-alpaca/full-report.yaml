      - number: '1.4'
        title: Milestones and risk watchpoints
        blocks:
          - type: paragraph
            body: >-
              The milestone path is credible: Alpaca moved from a 2015 infrastructure startup into a regulated
              self-clearing broker-dealer with widening product breadth, global expansion steps, and repeated private
              financing support. The broker product page also suggests meaningful throughput, with management claiming
              more than 600,000 daily orders self-cleared in April-May 2025 and 99.99% uptime since January 2025. But
              the compliance record prevents a clean infrastructure-only upside story. FINRA BrokerCheck shows two final
              regulatory events, including a 2024 SEC cease-and-desist/censure with a $400,000 penalty over off-channel
              communications and a 2026 FINRA censure with a $300,000 fine over trade-reporting issues. Those
              disclosures do not invalidate the product moat, but they do raise diligence priority around controls,
              reporting discipline, and readiness for further scale.
