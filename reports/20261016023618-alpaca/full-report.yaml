  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Alpaca's addressable market is best defined as brokerage infrastructure: APIs and operational rails that
              let a regulated intermediary or fintech embed investing, custody, clearing, onboarding, funding, and
              market-data workflows without standing up its own full broker-dealer stack. The cited product surfaces
              consistently target institutions, fintech apps, banks, wealth platforms, crypto exchanges, and
              tokenization platforms rather than positioning Alpaca as a direct retail destination. That boundary
              matters because the relevant substitutes are not only other brokerage APIs, but also internal buildouts
              and legacy outsourced clearing relationships. The practical spend bucket therefore includes regulated
              trading infrastructure, compliance-heavy workflow automation, and multi-asset enablement, while excluding
              end-customer acquisition budgets and any market a partner cannot legally access.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
      - number: '2.2'
        title: Sizing lenses, demand drivers, and why the market is expanding
        blocks:
          - type: paragraph
            body: >-
              Public TAM data is incomplete, so the most defensible approach is to use multiple evidence-constrained
              operating lenses rather than a single inflated market estimate. Company-controlled pages published one
              week apart cite 200+ versus 300+ partner organizations and 7 million versus 9 million accounts, while a
              March interview summary reports 300+ partners, 9 million accounts, and 45 countries. Those figures show
              meaningful penetration but are not directly reconcilable without denominator and measurement-date
              definitions. Additional demand signals include more than $1.5 billion of assets under custody backing
              tokenized equities and nearly fourfold growth in monthly active API users over six months. Demand
              expansion is tied to institutions outsourcing regulatory complexity and to tokenization and AI-native
              applications needing programmable, regulated brokerage rails.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
