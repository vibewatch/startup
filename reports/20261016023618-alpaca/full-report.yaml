              - CM012
      - number: '2.3'
        title: Buyers, budget ownership, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer pattern is B2B2C: Alpaca sells to product, brokerage, or innovation teams inside
              financial institutions and fintech platforms, while the ultimate users are those partners' retail
              investors, advisors, traders, or crypto-native customers. Public evidence is strong on segment breadth and
              workflow fit, but weaker on exact budget line items and deal economics, so budget ownership has to be
              inferred from product positioning. Adoption can still be slowed by market-access frictions that are
              outside Alpaca's product roadmap. The most visible current example is China's tightening on offshore
              brokerage access, which shows that a meaningful cross-border demand pool can be constrained by regulator
              action. Product-level disclosures also show that tokenized equities, options, and extended-hours trading
              carry legal, liquidity, or suitability constraints that partners must underwrite before adoption.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand is broadening beyond neobroker launch kits
            body: >-
              The strongest 2026 demand signal is the convergence of tokenization, AI-built financial products, and
              institution-grade brokerage outsourcing—not simply more retail trading apps.
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
          - type: callout
            title: Regulation can close demand channels faster than product can open them
            body: >-
              Cross-border brokerage demand can be real and still become unreachable if local regulators tighten access
              rules or if tokenized products trigger narrower eligibility and disclosure requirements.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans platforms, white-label rails, incumbents, and internal build
        blocks:
          - type: paragraph
            body: |-
              The relevant buyer does not choose only between Alpaca and another retail broker. The reviewed sources
              show a wider decision set that includes regional embedded-investing specialists, white-label
              infrastructure providers, scaled public incumbents, and the option to assemble more of the stack
              internally. FinanceMagnates places Alpaca directly against Upvest after the WealthKernel acquisition and
              European-equities launch, while the same report names DriveWealth and Saxo Bank as additional white-label
              competitors. OpenBankingTracker and Alpaca's own site also make clear that Alpaca is selling into
              neobanks, fintechs, and global platforms, so local licenses, distribution, and operational trust matter
              as much as end-user trading features.
