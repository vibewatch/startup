              - CO014
      - number: '1.2'
        title: Leadership, governance, and regulatory stack
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is a meaningful part of the company story: Alpaca still identifies Yoshi Yokokawa and
              Hitoshi Harada as its operating founders, with Yokokawa as CEO and Harada as CPO. Governance visibility
              improves in financing and regulatory materials rather than on a standalone board page. The January 2026
              Series D added Drive Capital co-founder Chris Olsen to the board, while FINRA filings expose
              regulated-subsidiary operators such as President David Dusseault and COO / Principal Operations Officer
              Zachary Diaz. The broader moat claim comes from licensing and market-structure progress. Alpaca Securities
              became a registered U.S. broker-dealer in 2018, Alpaca Crypto became a FinCEN-registered MSB in 2022, and
              the company says it layered on DTCC approval in 2023, a shift to fully self-clearing in 2024, and OCC,
              FICC, and Nasdaq memberships in 2025.
