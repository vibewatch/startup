      - - Trading-volume and market-cycle sensitivity
        - End-user market activity across equities, options, and crypto
        - Structural
        - Weaker retail or crypto activity compresses order flow, margin demand, and API monetization.
        - High
        - >-
          Mitigation: product diversification and international expansion; residual exposure remains high because public
          evidence still points to activity-linked revenue.
      - - Cross-border regulatory rollout
        - Local regulators and license regimes in target markets
        - Structural
        - Delayed approvals block local-product launches or force slower, partner-dependent expansion.
        - Medium-High
        - >-
          Mitigation: stated licensing push and local presence investments; residual exposure is medium-high until the
          live approval matrix is disclosed.
    notes: >-
      Concentration is marked unknown where the assigned source pool names counterparties or scale but does not disclose
      revenue or account-share exposure.
    claimRefs:
      - CR005
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Growth and scale signals exist, but core financial and cap-table evidence is private.
        - Do not underwrite a purchase until the named diligence conditions are met.
      - - Confidence
        - Medium
        - Financing terms and operating scale are reported, while audited economics are absent.
        - Treat the conclusion as conditional rather than conviction-rated.
      - - Risk rating
        - High
        - Regulatory capital, market-activity exposure, competition, and financing opacity remain material.
        - Require downside protection and explicit thesis-break triggers.
      - - Valuation stance
        - Stretched
        - The $1.15B mark is only illustratively 5.75x Sacra's estimated $200M ARR.
        - Demand audited ARR and quality-of-revenue proof before accepting the mark.
      - - Return and exit
        - Not supportable publicly
        - No verified cap table, net debt, cash flow, preference stack, or exit timetable is available.
        - Model ownership, dilution, and exit proceeds only after data-room review.
    notes: >-
      Assessments use the January 2026 financing mark and clearly identified company claims or third-party estimates;
      they are not audited valuation conclusions.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV008
      - CV009
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - - Thesis
        - More than 300 organizational partners across more than 40 countries indicate broad distribution.
        - Partner-level revenue and retention showing weak monetization or concentration would weaken the thesis.
      - - Thesis
        - Company-reported revenue more than doubled year over year.
        - Audited results showing materially lower growth or low-quality pass-through revenue would weaken the thesis.
      - - Thesis
        - Company reports 600,000+ daily orders self-cleared during April-May 2025.
        - Evidence that volume does not translate into attractive contribution economics would weaken the thesis.
      - - Anti-thesis
        - Self-clearing regulatory capital can rise with volume and volatility.
        - >-
          A multi-year capital plan with ample buffers and improving returns on regulatory capital would reduce this
          concern.
      - - Anti-thesis
        - Well-funded infrastructure competitors and incumbent APIs can create pricing pressure.
        - Verified pricing power and rising gross margin despite competition would reduce this concern.
      - - Anti-thesis
        - Trading activity and crypto adoption expose revenue to cyclical market participation.
        - Contracted minimums and diversified recurring platform fees would reduce cyclicality.
    notes: >-
      The thesis uses company-issued scale claims; the anti-thesis uses Sacra's independent risk analysis and requires
      data-room verification.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV013
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited ARR meets or exceeds the $200M estimate; growth remains strong; margins improve; concentration and
          preference seniority are limited.
        - >-
          A value above the $1.15B mark may be supportable, but no public range or target return is defensible without
          audited cash flow and ownership terms.
        - Execution across products and jurisdictions; regulatory-capital scaling.
        - Positive if audited economics corroborate external estimates and company growth claims.
      - - Base
        - >-
          ARR is near the external estimate, but margin, cash use, concentration, debt, and preferences remain only
          partially resolved.
        - >-
          Treat $1.15B as a diligence anchor rather than fair value; price and structure must compensate for unresolved
          private-company evidence.
        - Multiple compression; slower growth; dilution; delayed liquidity.
        - Current public evidence most strongly supports this conditional case.
      - - Bear
        - >-
          Audited ARR trails the estimate, one or more partners are concentrated, capital needs rise, or competition
          compresses take rates.
        - The January mark is not supportable; require a lower price, stronger preferences, or no investment.
        - Down round, continuing capital calls, regulatory constraint, and weak exit proceeds.
        - Triggered by failed financial, concentration, capital, or cap-table diligence.
    notes: >-
      No probability percentages or valuation ranges are assigned because the available public evidence lacks audited
      financials, net debt, cap-table terms, and comparable private transactions.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV009
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Alpaca’s public path runs from a 2015 data and machine-learning origin to a 2026 self-clearing, globally financed
      brokerage-infrastructure platform.
    data:
      items:
        - date: '2015'
          label: Founding and technical origin
          detail: >-
            Founded by Yoshi Yokokawa and Hitoshi Harada; the company started as a database and machine-learning
            business and built MarketStore.
        - date: '2018'
          label: U.S. broker-dealer registration
          detail: Alpaca Securities became a registered U.S. broker-dealer with FINRA and the SEC.
        - date: '2022'
          label: Crypto-entity registration
          detail: Alpaca Crypto became a FinCEN-registered money services business.
        - date: '2023'
          label: DTCC approval
          detail: Alpaca says the clearing entity was approved by DTCC, extending its market-structure reach.
        - date: '2024'
          label: Transition to fully self-clearing
          detail: Management says Alpaca transitioned to fully self-clearing in 2024.
        - date: '2025'
          label: Regulatory memberships and recognition broadened
          detail: >-
            Alpaca says it added OCC, FICC, and Nasdaq memberships in 2025, and CB Insights named it to the Fintech 100
            in October 2025.
        - date: 2026-01
          label: Series D and board expansion
          detail: >-
            $150M Series D at a $1.15B valuation, plus a $40M line of credit and a board seat for Drive Capital’s Chris
            Olsen.
        - date: 2026-07
          label: Follow-on financing and expansion push
          detail: >-
            $135M additional financing brought disclosed funding to $435M inclusive of debt, while the company
            highlighted India, UK/EU, and global-equities expansion milestones.
    approximationNotes: null
