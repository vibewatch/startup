chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Alpaca presents itself as API-first brokerage infrastructure rather than a consumer brokerage. The
              strongest current product evidence combines the About page, broker product page, and independent
              OpenBankingTracker review: Alpaca sells broker, trading, crypto, and market-data APIs that let fintechs,
              neobanks, platforms, and institutional clients launch investing features across stocks, ETFs, options,
              fixed income, and crypto. The company also still roots its identity in technology: management says the
              business began in 2015 as a data and machine-learning startup that built MarketStore before evolving into
              regulated brokerage infrastructure. Operationally, Alpaca says it is headquartered in California and runs
              as a globally distributed company with more than 250 employees in 25 countries, but that workforce figure
              remains company-claimed rather than independently refreshed in this pool.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
