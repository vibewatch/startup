  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-opacity
      missingEvidence: Directly comparable partner pricing, implementation fees, and volume tiers for Alpaca, Upvest, DriveWealth, and Saxo white-label offerings.
      whyItMatters: Without commercial terms, it is hard to judge whether Alpaca's broader stack offsets cheaper local or incumbent alternatives.
      diligencePath: Request current rate cards or redacted partner proposals and map them to a common unit such as per funded account, per order, or platform minimums.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: multi-homing-and-concentration
      missingEvidence: Partner retention, multi-homing behavior, and revenue concentration by top customers and geography.
      whyItMatters: Distribution durability depends on whether partners stay on Alpaca's rails or can negotiate away the moat by splitting flow across competing providers.
      diligencePath: Request cohort retention by partner vintage, top-10 revenue concentration, and examples of customers that replaced or expanded away from third-party infrastructure.
      relatedQuestionRefs: [QP006, QP007]
