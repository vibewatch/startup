  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-statements
    missingEvidence: Big-Four-audited consolidated financial statements, segment revenue, gross margin, and a cash-flow statement, none of which Merama publishes despite citing audited results.
    whyItMatters: The entire revenue-quality and margin case rests on company-claimed figures that cannot be independently corroborated without the audited package.
    diligencePath: Request the audited consolidated statements, the auditor's opinion, and a brand-level revenue and margin bridge in a data room.
    relatedQuestionRefs:
    - QI015
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: A reconciled capital schedule distinguishing equity issued from refinanced debt to resolve the $445 million versus more-than-$520 million lifetime-raised discrepancy.
    whyItMatters: Conflicting cumulative figures mean even Merama's capital history is not cleanly reconciled in public, complicating dilution and leverage analysis.
    diligencePath: Build a round-by-round capitalization schedule and confirm which debt facilities were refinanced rather than additive.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash on hand, monthly burn, runway, use-of-funds breakdown, and covenant terms on the $170 million reais-denominated facility.
    whyItMatters: Without liquidity and covenant data, capital adequacy and refinancing risk in a high-Selic environment cannot be assessed.
    diligencePath: Request a treasury report, use-of-funds plan, and the facility agreements with covenant and maturity detail.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  acknowledgedWarnings:
  - dimension: tableNotes
    reason: The revenue, pricing, unit-economics, capital-adequacy and gaps tables are built from company-claimed figures and analyst derivations for a private company, and each already carries an explanatory notes line stating that limitation.
