- id: unit-economics-and-margins
  title: Unit economics, margins, and efficiency proxies
  body: 'Merama''s profitability claims are unusually strong for an e-commerce aggregator and stand in sharp contrast to the losses that sank global peers. The company reported EBITDA of more than $100 million across its business units at the end of 2023 and said EBITDA in the first quarter of 2024 grew organically by more than 150% versus the same period a year earlier, all while emphasizing cash-flow-generation initiatives. Against reported 2023 sales above $600 million, an EBITDA above $100 million implies a blended EBITDA margin in the mid-teens, which would be healthy for a consumer-goods operator and far better than the deeply negative margins that characterized Thrasio and other roll-ups before their distress. Merama attributes this to synergies and economies of scale across the portfolio, with each unit operating independently within its niche while drawing on shared resources.


    The efficiency proxies that a diligence team would normally triangulate, however, are simply not public. Merama does not disclose customer-acquisition cost, payback period, contribution margin, gross margin, inventory turns, or channel-level economics. Because the brands sell heavily through Mercado Libre and Amazon as well as their own direct channels, a large share of variable cost is marketplace fees, advertising and fulfillment that Merama has not broken out. The working-capital intensity of the model is also high: financing inventory and growth for partner brands is a core part of Merama''s value proposition, which is precisely why it has layered on debt facilities rather than relying on equity alone. Without disclosed working-capital cycles or cash-conversion metrics, the durability of the reported EBITDA — and how much of it converts to free cash flow after inventory and debt service — cannot be verified externally.


    The net read on unit economics is that Merama''s headline margin figures, if accurate and audited, would place it among the healthier operators in a battered category, but the complete absence of public unit-economic detail means the quality and sustainability of those margins remain a primary diligence blocker rather than a settled fact.'
