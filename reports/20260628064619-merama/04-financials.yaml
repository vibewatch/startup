company:
  name: Merama
chapter:
  number: 4
  title: Financials
  summary: 'Merama is a house-of-brands operator whose financial profile rests almost entirely on company-disclosed figures: it reported sales above $600 million in 2023 (up from more than $250 million in 2021), EBITDA above $100 million, and Q1 2024 EBITDA growing more than 150% organically, with results it says are audited by a Big Four firm. But the consolidated statements are private, unit economics and runway are undisclosed, lifetime capital raised is reported inconsistently ($445 million versus more than $520 million), and the model leans increasingly on reais-denominated debt into a high-rate Brazilian environment, leaving revenue quality, margin durability and capital adequacy only partly underwritable from public evidence.'
sections:
- id: revenue-model-and-streams
  title: Revenue model, streams, and recognition
  body: 'Merama makes money as a house-of-brands operator: it takes substantial, often majority, stakes in category-leading online consumer brands, consolidates them as autonomous business units, and earns the operating revenue those brands generate across wellness, beauty, home, baby and sports categories. The model is explicitly an acquire-grow-and-integrate one — Merama buys majority positions in e-commerce retailers, scales them over a three-to-five-year horizon, and may then acquire them outright or not. Consolidated revenue is therefore the sum of brand-level sales rather than a platform take-rate, which means Merama recognizes the full gross sales of the brands it controls rather than a thin marketplace commission. That distinction matters for diligence: top-line growth can come from acquiring another brand (inorganic) or from growing the brands already owned (organic), and Merama has stressed the organic component, reporting organic growth of more than two times the prior year in 2023.


    The reported scale is substantial for a five-year-old private company. Merama said that at the end of 2023 it recorded sales of more than $600 million, up from a company-claimed figure above $250 million of merchandise in 2021, with the increase described as more than a doubling of organic sales. The single largest revenue contributor is Growth Supplements, the Brazilian sports-nutrition brand Merama acquired in April 2025, which on its own carries more than $400 million in annual sales — a figure that, if consolidated, would dominate the portfolio''s revenue and concentrate it heavily in one brand and one country. Secondary brands such as Mercadazo in Mexico and Oceane in Brazil add omnichannel and beauty revenue, but Merama does not publish a brand-by-brand revenue bridge, so the mix is inferred rather than disclosed.


    The recognition and quality questions that remain are material. Merama states its results are audited by a Big Four firm, which is a meaningful quality signal, but it does not publish those audited statements, segment revenue, or the split between consolidated and equity-accounted brands where stakes are minority. For underwriting, the revenue streams are directionally credible and large, but the absence of a public, segmented, externally available financial package means every revenue-quality judgment below is conditional on management disclosure.'
