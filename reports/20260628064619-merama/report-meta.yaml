  topStrengths:
    - >-
      Claimed 2023 sales above US$600 million and EBITDA above US$100 million
      would make Merama one of the rare aggregator-style operators with real
      scale and reported profitability.
    - >-
      The company has moved from a diffuse roll-up to a more focused portfolio
      anchored by category leaders such as Growth Supplements, Mercadazo, and
      Océane.
    - >-
      Merama's operating model combines capital, proprietary BI and marketplace
      tooling, international expansion support, and working-capital management
      rather than simple financial engineering.
    - >-
      Investor support remains credible, spanning SoftBank Latin America Fund,
      Advent International, Balderton, Monashees, Valor, and Marcel Telles.
    - >-
      Exposure to Latin America's two largest ecommerce markets gives Merama a
      meaningful platform if execution and integration remain disciplined.
  topRisks:
    - >-
      Public disclosure is still too thin: no audited consolidated statements,
      no brand-level revenue bridge, no cap-table waterfall, and no public debt
      covenant package.
    - >-
      The model is increasingly debt-funded, and the larger 2025
      reais-denominated facility raises refinancing and interest-rate risk in a
      high-Selic environment.
    - >-
      Revenue appears concentrated in a handful of brands, especially Growth
      Supplements, while distribution is concentrated in marketplace channels
      Merama does not control.
    - >-
      Global category precedent is poor: Thrasio-style aggregators destroyed
      equity when leverage and integration complexity met a tougher rate and
      demand cycle.
    - >-
      Multi-country consumer, privacy, and ecommerce compliance obligations add
      legal and execution overhead without public evidence of strong disclosure
      around controls or incident history.
  unresolvedGaps:
    - >-
      Big-Four-audited consolidated statements plus a brand-by-brand revenue,
      margin, and ownership bridge.
    - >-
      Current cash, burn, runway, covenant package, and maturity schedule for
      the BTG/Citi/Itaú debt facility.
    - >-
      A reconciled capital table separating additive financing from refinanced
      debt and showing current preference-stack economics.
    - >-
      Brand-level retention, repeat-purchase, active-customer, and cohort data,
      especially for Growth Supplements, Mercadazo, and Océane.
    - >-
      Channel-level marketplace economics and a clean measure of how dependent
      Merama remains on Mercado Libre and Amazon for sell-through.
