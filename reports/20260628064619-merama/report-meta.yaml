  foundingLocation: Mexico City, Mexico
  headquarters: Mexico City, Mexico and São Paulo, Brazil
  productSummary: >-
    Merama does not sell one software product; it operates a brand-building
    stack that combines capital, marketplace expertise, BI tooling,
    cross-border expansion, supply-chain optimization, and direct ownership of
    consumer brands sold through Mercado Libre, Amazon, and owned storefronts.
  customerFocus: >-
    End consumers buying wellness, beauty, home, baby, and sports products
    through owned brands, with Amazon and Mercado Libre acting as crucial
    channel gatekeepers rather than end customers.
  businessModel: >-
    Acquire or partner with leading ecommerce brands, inject working capital and
    operational tooling, grow them through marketplaces and D2C channels, and
    monetize through consolidated brand sales and eventual value creation at the
    brand level.
  stage: Growth (equity + debt)
