  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      Shows how Merama moves from strong operating claims to a track call once disclosure, debt, and category-risk gates
      are applied.
    data:
      nodes:
        - id: n1
          label: Claimed operating proof
          detail: '>$600M sales, >$100M EBITDA, >150% organic Q1 2024 EBITDA growth'
          tone: positive
        - id: n2
          label: Market tailwind
          detail: Latin America ecommerce still growing quickly through 2027
          tone: positive
        - id: n3
          label: Disclosure gate
          detail: Audited public statements, brand bridge, and cap-table terms are missing
          tone: warning
        - id: n4
          label: Capital structure gate
          detail: 2025 round was mostly debt; rate and covenant exposure matter
          tone: warning
        - id: n5
          label: Category precedent gate
          detail: Thrasio and Una show how aggregator equity can reset when leverage or growth disappoints
          tone: warning
        - id: n6
          label: 'Current call: TRACK / CONDITIONAL'
          detail: Good enough to monitor, not transparent enough to buy
          tone: warning
      edges:
        - from: n1
          to: n2
          label: Supports upside
        - from: n2
          to: n3
          label: Still needs proof
        - from: n3
          to: n4
          label: Terms matter
        - from: n4
          to: n5
          label: Stress against precedents
        - from: n5
          to: n6
          label: Result
    approximationNotes: The figure is a decision framework rather than a financial model.
    claimRefs:
      - CV006
      - CV011
      - CV016
      - CV018
      - CV026
      - CV027
