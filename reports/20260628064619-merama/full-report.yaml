      - number: '4.4'
        title: Financial verdict, comparables, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict on Merama is split cleanly between an encouraging headline and an unverifiable
              substructure. On the headline, Merama reports the rarest thing in its category: real scale combined with
              positive EBITDA and cash-flow focus, with sales above $600 million, EBITDA above $100 million, and
              continued organic EBITDA growth into 2024, all said to be Big-Four audited. If those figures hold up under
              data-room scrutiny, Merama is a fundamentally different financial proposition from the loss-making
              aggregators that collapsed, and its mid-teens implied margin would be defensible. On the substructure,
              however, the absence of public consolidated statements, segment revenue, unit economics, working-capital
              metrics, cash, burn and runway means none of the headline can be independently corroborated, and the
              conflicting lifetime-raised figures signal that even the capital history is not cleanly reconciled in
              public.


              For comparable context, the platform economics that govern Merama's brands are visible only through
              Mercado Libre's public filings, which show a large, growing, and increasingly logistics-heavy marketplace:
              as a NASDAQ-listed company, Mercado Libre files audited 10-K statements that quantify the take rates,
              advertising and fulfillment costs its third-party sellers — including Merama's brands — bear. Those
              filings are a useful external anchor for the cost pressures Merama faces but are not a substitute for
              Merama's own numbers. Merama operates across Mexico, Brazil, Colombia, Chile, Peru and the United States,
              so its consolidated economics blend several currencies and tax regimes, adding complexity that public
              reporting does not resolve.


              The diligence blockers are therefore specific and high-priority: obtain the Big-Four-audited consolidated
              financial statements and the auditor's opinion; secure a brand-level revenue, margin and ownership-stake
              bridge; reconcile the $445 million versus more-than-$520 million lifetime-raised figures into a single
              capital schedule distinguishing equity from refinanced debt; obtain cash, burn, runway and covenant terms
              on the $170 million reais-denominated facility; and stress-test debt service against a sustained
              high-Selic scenario. Until these are answered, the financial case is credible but conditional, and revenue
              quality, margin durability and capital adequacy each carry a material evidence gap.
            claimRefs:
              - CI029
              - CI031
              - CI032
              - CI033
              - CI034
              - CI040
