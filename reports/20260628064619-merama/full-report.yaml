      - number: '6.4'
        title: Expansion depends on cross-sell within brands and on marketplace infrastructure outside Merama's control
        blocks:
          - type: paragraph
            body: >-
              Merama's expansion path is not a classic SaaS land-and-expand motion; it is a commerce operating model
              built on broadening assortment, adding categories, and improving merchandising, fulfillment, and
              conversion inside owned brands. Growth's catalog breadth across proteins, creatine, vitamins, snacks,
              apparel, and clinical products supports a repeat basket and upsell logic. Oceane's assortment across
              makeup, skincare, hair, gifting, and wellness does the same in beauty. Mercadazo's multi-brand assortment
              shows another expansion path: own-brand breadth across home, fitness, toys, beauty, and tools. But those
              expansion loops run through platforms Merama does not fully control. Mercado Libre's filings say sellers
              use its marketplace, logistics, payments, ad products, and storefront tools to reach millions of
              consumers, with more than half of Envios shipments handled via fulfillment centers and Mexican SMEs often
              treating the platform as a primary income source. Amazon's selling-partner documentation makes the same
              dependence legible from another angle: listings, inventory, price updates, and fulfillment workflows are
              administered through platform APIs and fulfillment services. In practice, that means Merama can improve
              conversion and assortment inside its brands, yet still remain exposed to marketplace policy changes, ad
              economics, fee changes, fulfillment conditions, or ranking shifts on the two largest regional channels.
              Expansion is therefore real, but it is not sovereign.
