  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who pays, uses, and buys across Merama's brands
        blocks:
          - type: paragraph
            body: >-
              Merama is not selling a single software product to a homogeneous account base; it is operating a portfolio
              of consumer brands whose ultimate economic customer is the end shopper. That means buyer, user, and payer
              usually collapse into the same household consumer on direct-to-consumer storefronts such as Growth and
              Oceane, while the intermediary role of Amazon, Mercado Libre, Liverpool, and other marketplaces changes
              the economics of the relationship. On marketplaces, the end customer still chooses and pays for the
              product, but the platform controls the listing standards, inventory visibility, checkout surfaces,
              fulfillment interfaces, ad placement, and often post-purchase messaging. Merama therefore has two customer
              layers to manage at once: end consumers who repeat-purchase branded goods, and channel partners whose
              tooling and logistics determine whether those customers can be reached efficiently. This distinction
              matters because Growth, Oceane, and Mercadazo serve different baskets and purchase cadences: Growth is a
              replenishment-heavy nutrition catalog, Oceane is a beauty and skincare assortment with gifting and
              repeat-use features, and Mercadazo is a broader general-merchandise storefront where the transaction is
              more episodic and category-specific. Merama's own description of partnering with category leaders across
              Brazil, Mexico, Colombia, Chile, and Peru reinforces that the portfolio is organized around consumer
              brands, not around a contracted B2B account roster, so customer quality must be judged brand by brand and
              channel by channel rather than by a single company-wide customer-count claim.
            claimRefs:
              - CU001
