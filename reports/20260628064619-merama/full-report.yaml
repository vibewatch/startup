      - number: '2.2'
        title: Market sizing across multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No single number captures Merama's market, so it is best triangulated across several lenses. The broadest
              lens is total Latin American e-commerce: PCMI reports the region exceeding $509 billion in 2023, up about
              27% year over year, with a compound annual growth rate of roughly 23% through 2026, while AMI/PCMI
              projects regional volume growing about 22% between 2023 and 2026 to more than $700 billion. A narrower
              retail lens from eMarketer shows retail e-commerce of about $191 billion in 2025, growing 12.2% that year,
              which it calls the fastest pace of any region in the world and roughly 1.5 times the global average.


              The geographic lens concentrates the opportunity sharply. AMI sizes Brazil at about $216 billion of
              e-commerce in 2022 and Mexico at about $56 billion, with Colombia, Chile, Argentina, and Peru each an
              order of magnitude smaller; eMarketer adds that Argentina, Brazil, and Mexico together account for roughly
              84.5% of regional retail e-commerce sales. Because Merama is dual-headquartered in Brazil and Mexico, the
              two markets that matter most to it are also the two largest, which is strategically favorable but also
              concentrates its macro and currency exposure.


              The addressable lens is the most important for underwriting and the least precise. Merama's serviceable
              market is the retail-goods e-commerce spend in its specific consumer categories in Brazil and Mexico, a
              fraction of the $191 billion regional retail total. Its obtained share is anchored by Growth Supplements'
              reported $400 million-plus in annual sales plus the rest of its roughly six brands, implying a
              serviceable-obtainable position in the low single-digit billions at most. The gap between the $700 billion
              headline and the realistic obtainable market is the single most important framing in this chapter.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
