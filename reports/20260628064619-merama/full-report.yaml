      - number: '1.4'
        title: Portfolio, scale, and leading brands
        blocks:
          - type: paragraph
            body: >-
              Merama's scale narrative is real but should be read carefully because most figures are company-claimed. At
              launch in April 2021 it described a 40-person team drawn from Amazon, Mercado Libre and Facebook; by the
              December 2021 unicorn round public coverage cited more than 180 employees and a portfolio of about 20
              brands across Mexico, Brazil, Chile, Colombia and Peru; and the company said it would sell more than $250
              million of merchandise in its first year while remaining highly profitable. By mid-2023, after a workforce
              reduction, headcount was reported to remain above 400 employees, and by 2025 the company had narrowed
              operational focus to roughly six leading brands.


              The portfolio's anchor is Growth Supplements, a Brazilian sports-nutrition brand that Merama describes as
              the largest in Latin America and the fourth largest in the world, with annual sales above $400 million;
              Merama reports that the brand grew more than tenfold over roughly three years of partnership and that its
              founder remains CEO with plans to expand production, logistics and international reach. Mercadazo is an
              omnichannel brand in Mexico selling across Amazon, Liverpool and Mercado Libre, supported by a
              data-intelligence platform that Merama says identifies, acquires and launches hundreds of SKUs each year.
              Oceane is a Brazilian beauty brand. The company says these six brands are the focus of its current
              working-capital and manufacturing investment.


              The key diligence point is denominator discipline. Merama has clearly built a meaningful,
              revenue-generating portfolio with at least one very large brand, but the strategic pivot from 20-plus
              brands to six both concentrates the portfolio's value into a handful of names and removes most of the
              brand-level disclosure that would let an outside analyst verify consolidated revenue, profitability or
              growth. The single most important brand, Growth Supplements, was only acquired in 2025, so the portfolio's
              composition is recent and still evolving.
            claimRefs:
              - CO028
              - CO029
              - CO030
              - CO031
              - CO032
              - CO033
              - CO034
              - CO035
              - CO036
      - number: '1.5'
        title: Milestones, retrenchment, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Merama's chronology is unusually compressed and well-documented for its financing events, which makes the
              timeline a reliable backbone for later chapters. The founding in December 2020, the April 2021 $160
              million round, the September 2021 $225 million Series B, the December 2021 $60 million unicorn follow-on,
              the April 2024 J.P. Morgan facility, and the April 2025 $215 million round and Growth Supplements
              acquisition are all corroborated across company announcements, investor posts, law-firm deal notices and
              tier-one technology and finance reporting.


              The most important adverse signal is the 2023 retrenchment. In late June 2023, Reuters reported and
              Merama's CEO confirmed that the company had cut nearly 10% of its staff, which the CEO framed as a
              strategic refocus on brands generating more than $15 million in revenue rather than a pure cost-saving
              exercise, leaving headcount above 400. The cut landed during an 82% year-on-year collapse in Latin
              American venture funding and alongside layoffs at other regional unicorns, and it coincides with the
              strategic narrowing from 20-plus brands to six. The CEO's claim that the company was cash-flow positive
              with a healthy runway is a company statement that has not been independently verified.


              A second adverse theme is disclosure opacity. The post-2021 valuation has never been publicly quantified
              beyond "more than $1 billion," cumulative capital-raised figures conflict across sources, brand-level
              economics are not disclosed, and governance details are thin. None of these are evidence of wrongdoing,
              but together they mean the headline unicorn narrative rests heavily on company-claimed figures. Diligence
              should treat the financing chronology as solid ground and the consolidated financial and governance
              picture as materially incomplete.
