      - number: '2.3'
        title: Buyers, segments, and channels
        blocks:
          - type: paragraph
            body: >-
              The end buyer in Merama's market is the Latin American online consumer, and the population base is large
              and increasingly connected. DataReportal reports that at the start of 2025 Brazil had about 183 million
              internet users out of a population of roughly 212 million, an 86% penetration rate, while Mexico had about
              110 million internet users out of roughly 131 million people, an 83% penetration rate. That installed base
              of connected consumers is the demand pool every Merama brand ultimately sells into.


              The critical structural feature is that those consumers are reached overwhelmingly through a small number
              of platforms. Mercado Libre is the dominant marketplace across the region, and Amazon is the principal
              challenger; analyst work by Matteo Ceurvels estimates that Mercado Libre and Amazon together will capture
              roughly two-thirds of the $54 billion in incremental Latin American retail e-commerce sales expected over
              the two years to 2028, with Walmart the only other meaningful share-gainer. Mercado Libre's scale is
              reinforced by enormous capital commitments: it announced about $4.6 billion of investment in Mexico in
              2026 and roughly R$57 billion in Brazil, expanding to dozens of distribution centers and the largest
              logistics footprint of any regional platform.


              For Merama this creates a two-sided segmentation. On the demand side its brands serve mass-market and
              aspirational consumers in categories such as sports nutrition (Growth Supplements), beauty (Oceane), and
              omnichannel general merchandise (Mercadazo), which sells across Amazon, Liverpool, and Mercado Libre. On
              the supply side Merama's real counterparties are brand founders who own the customer relationship but lack
              capital and technology. The budget owner for a Merama purchase decision is therefore split: the consumer
              controls the retail spend, but the platforms control discovery and fulfillment, leaving brands and
              aggregators to compete for margin in between. A nearly $19 billion white-space opportunity outside Mercado
              Libre and Amazon is the room in which Merama's brands must grow.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
          - type: table
            tableRef: TM003
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM021
              - CM028
              - CM022
          - type: figure
            figureRef: FM003
            claimRefs:
              - CM015
              - CM016
              - CM021
              - CM033
      - number: '2.4'
        title: Growth drivers, constraints, and sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The demand-side tailwinds for Merama's market are genuine. Latin American e-commerce is growing faster
              than any other region, driven by deepening internet and smartphone penetration, the rise of real-time
              payment rails such as Pix in Brazil and SPEI in Mexico, expanding banking penetration, and growing
              cross-border purchasing, all of which PCMI cites as structural drivers. Rising e-commerce penetration of
              total retail, projected to top 10% in Argentina, Brazil, Colombia, Mexico, and Uruguay by 2029, means the
              online channel is still in a secular expansion phase rather than a saturated one.


              The constraints, however, are equally structural and matter more for an aggregator than for a marketplace.
              Platform concentration means Merama's brands depend on Mercado Libre and Amazon for discovery,
              advertising, and fulfillment, which compresses margin and creates dependence on counterparties that are
              also potential competitors through private label and first-party retail. Macroeconomic volatility,
              including currency depreciation and high interest rates in Brazil and Mexico, raises the cost of the
              working-capital debt that funds Merama's model, and the 2023 regional funding collapse showed how quickly
              capital can withdraw. Category regulation, such as Brazil's ANVISA rules for supplements that govern
              Growth Supplements, adds compliance cost and launch friction.


              Finally, the sizing evidence itself is contradictory and should be preserved rather than smoothed. The
              PCMI total-commerce figure and the eMarketer retail figure differ by more than 2.5 times because they
              measure different scopes; growth rates range from eMarketer's 12.2% retail pace to PCMI's 22-23%
              total-commerce CAGR; and no public source isolates the specific consumer-product categories and
              geographies that constitute Merama's true serviceable market. The honest conclusion is that the market is
              large and growing, but the precise addressable and obtainable figures for a brand aggregator remain a
              material diligence gap.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
