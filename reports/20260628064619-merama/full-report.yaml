              Public sources consistently show that Merama is not selling a single consumer app or a thin financial
              wrapper. It is selling a strategic operating package to leading ecommerce brands: equity partnership,
              working capital, cross-border expansion, marketing and BI support, product/category expansion, and
              proprietary tools intended to automate parts of the operating workflow. That package sits between brand
