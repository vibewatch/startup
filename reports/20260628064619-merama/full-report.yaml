        - Legal counsel and financing data room
      - - >-
          Show working-capital turns, operating cash flow, and channel concentration by Mercado Libre, Amazon, DTC, and
          other marketplaces
        - High
        - Cash conversion and platform dependency determine whether EBITDA is truly valuable to equity holders
        - FP&A model and channel dashboards
    notes: These asks are the minimum package required to move from a monitoring call to an underwritten valuation decision.
    claimRefs:
      - CV027
      - CV040
      - CV041
      - CV042
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Tracks Merama from its December 2020 founding through rapid 2021 unicorn financing, a 2023 retrenchment, and a
      2025 debt-led round and Growth Supplements acquisition.
    data:
      items:
        - date: 2020-12
          label: Founding
          detail: Five co-founders incorporate Merama with dual HQ in Mexico City and São Paulo.
          tone: positive
        - date: 2021-04
          label: $160M seed/Series A
          detail: Raises $60M equity plus $100M debt at over $200M valuation, led by Valor, Monashees and Balderton.
          tone: positive
        - date: 2021-09
          label: $225M Series B
          detail: Advent and SoftBank co-lead the largest LatAm Series B to date at about $850M.
          tone: positive
        - date: 2021-12
          label: Unicorn at $1.2B
          detail: A $60M follow-on makes Merama one of the region's fastest unicorns and launches Merama Labs.
          tone: positive
        - date: 2023-06
          label: ~10% layoffs
          detail: Cuts staff in a strategic refocus during an 82% drop in LatAm venture funding.
          tone: warning
        - date: 2024-04
          label: $80M J.P. Morgan debt
          detail: Secures a working-capital debt facility, shifting toward debt-led financing.
          tone: neutral
        - date: 2025-04
          label: $215M round + Growth
          detail: Raises $45M equity and $170M debt and acquires Growth Supplements at a >$1B valuation.
          tone: positive
        - date: '2025'
          label: Focus on ~6 brands
          detail: Completes the pivot from 20-plus brands to roughly six category leaders.
          tone: neutral
