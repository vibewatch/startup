            title: The headline market is huge; the addressable market is not
            body: >-
              Latin American e-commerce is heading toward roughly $700 billion in total commerce by 2026, but Merama's
              serviceable market is the retail-goods slice in its specific consumer categories in Brazil and Mexico, a
              small fraction of that headline and gated by Mercado Libre and Amazon.
            calloutType: insight
