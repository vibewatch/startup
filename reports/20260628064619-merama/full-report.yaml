companyProfile:
  summary: >-
    Merama is a private Latin American ecommerce holding company founded in late 2020 and built around taking
    substantial stakes in category-leading online brands, supplying working capital, operating expertise, and
    proprietary technology to accelerate growth. The company now emphasizes a smaller set of leading brands rather than
    a broad roll-up, with Growth Supplements, Mercadazo, and Océane as the clearest public anchors. Merama has raised a
    mix of equity and debt from major regional and global investors, remains valued above US$1 billion on management
    statements, and claims uncommon profitability for the aggregator category. The investment case is real, but
    disclosure quality remains far below what a high-confidence underwriting call would require.
