      - number: '1.2'
        title: Founders, leadership, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Merama was started in December 2020 by five co-founders with complementary operating and consulting
              backgrounds. Sujay Tyle is the co-founder and CEO and is by far the most visible figure; he previously
              co-founded and led Frontier Car Group, which sold to OLX/Naspers for roughly $700 million in 2019, and he
              held a Venture Partner role at Balderton Capital, one of Merama's earliest backers. Felipe Delgado serves
              as CFO and president and previously led Beetmann Energy; Olivier Scialom is COO and was co-founder and COO
              of the Mexican e-commerce company Petsy; Renato Andrade was an associate partner at McKinsey; and
              Guilherme Nosralla was head of growth at Wildlife Studios.


              The founding team's pedigree is a genuine strength: it combines a repeat e-commerce founder with a
              successful exit, a finance leader, an operations leader who has built marketplaces in the region, a
              top-tier strategy consultant, and a growth specialist from one of Brazil's best-known gaming companies.
              That spread of skills maps well onto the company's actual job, which is acquiring stakes in brands and
              then professionalizing their finance, operations, technology and growth functions.


              The main governance caveat is key-person concentration around Sujay Tyle. He is the public face of every
              funding announcement, the quoted spokesperson on strategy and layoffs, and the founder whose prior exit
              anchors investor confidence. The relationship with Balderton, where Tyle was simultaneously a Venture
              Partner and a portfolio CEO, is a related-party feature that diligence should map explicitly. Public
              sources do not disclose a full board roster, independent directors, or the governance rights held by
              Advent, SoftBank and the debt syndicate, which is a material transparency gap for a company that has
              raised hundreds of millions of dollars.
            claimRefs:
