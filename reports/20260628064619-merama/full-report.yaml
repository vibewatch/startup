      - number: '6.5'
        title: 'Customer verdict: real consumer adoption, incomplete durability disclosure, meaningful concentration risk'
        blocks:
          - type: paragraph
            body: >-
              The public record supports a clear but bounded conclusion. Merama owns brands that reach real consumers,
              and the evidence is stronger than mere branding or fundraising rhetoric: Growth has scale, Oceane has
              external review density, and Mercadazo has an operating storefront with documented delivery and returns
              rules plus a multi-year market history. That is enough to reject the idea that Merama is a pure roll-up
              narrative without consumer traction. At the same time, the portfolio is not yet publicly underwritten on
              the dimensions that matter most for investment durability: Merama does not disclose active customers,
              repeat purchase, order frequency, channel mix, or top-brand revenue share by customer type. The adverse
              evidence is also meaningful. Growth's and Oceane's complaint surfaces prove ongoing purchase volume but
              also show that service quality and repurchase intent differ materially by brand. Mercadazo's lack of broad
              third-party review depth makes it the least transparent of the three named adoption cases. Finally, the
              company remains structurally dependent on external channels — especially Mercado Libre and Amazon — for
              discovery, logistics, and inventory orchestration. The resulting customer thesis is therefore positive on
              existence of demand, cautious on retention visibility, and explicit that brand concentration plus channel
              concentration are the main risks that a diligence process still needs to quantify.
            claimRefs:
              - CU032
