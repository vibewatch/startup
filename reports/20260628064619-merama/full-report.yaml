      - number: '8.3'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              The financing chronology matters because the valuation signal is mixed. Merama raised $160 million in 2021
              through a combined equity-and-debt round, then a $225 million Series B in September 2021 at an $850
              million valuation, then a $60 million follow-on in December 2021 that pushed the public mark to $1.2
              billion and total capital raised to $445 million. In April 2024 it added an $80 million five-year J.P.
              Morgan credit line, backed by management's claims of audited results and profitability. In April 2025 it
              raised another $215 million, but only $45 million was equity while $170 million was debt used both to
              refinance the earlier facility and to fund the Growth Supplements acquisition.


              That sequence supports two opposing readings. The constructive reading is that Merama had earned the right
              to use cheaper debt because it was already profitable and because working-capital finance is more
              efficient than repeated equity dilution for a house-of-brands operator. The adverse reading is that the
              company could not command a meaningful clean-equity re-rating: after several years of scale building, the
              new public valuation language was merely that Merama remained above $1 billion, not that it had materially
              surpassed the 2021 unicorn mark. On public evidence alone, the latest round looks more like balance-sheet
              engineering plus acquisition finance than a clear market-clearing price discovery event.


              This is why entry discipline matters. A valuation above $1 billion can be defended only conditionally: if
              the claimed EBITDA is real, if the debt package is manageable at Brazilian rates, and if Growth
              Supplements integration lifts rather than dilutes portfolio quality. But because investors do not know
              liquidation preferences, ratchets, warrants, covenants, or the true common-equity waterfall, the current
              public mark is not a clean common-stock equivalent. That uncertainty pushes the recommendation toward
              track rather than buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV022
              - CV023
              - CV024
