      Growth has the strongest scale proof, Oceane the strongest third-party review density, and Mercadazo the weakest
      external repeat-purchase visibility.
    data:
      columns:
        - scale proof
        - third-party customer proof
        - durability visibility
        - channel breadth
      rows:
        - label: Growth Supplements
          values:
            - '>$400M annual sales disclosed'
            - Strong complaint-platform data
            - 'Moderate: third-party service metrics but no cohorts'
            - Primarily official storefront in reviewed evidence
        - label: Océane
          values:
            - No public revenue disclosed
            - Verified reviews plus complaint record plus external retail surfaces
            - 'Mixed: third-party review density but weaker repurchase signal than Growth'
            - DTC plus Amazon Brazil and Beleza na Web observed
        - label: Mercadazo
          values:
            - No public revenue disclosed
            - Editorial operating proof and trust checks, but sparse public review depth
            - 'Low: no public repeat-purchase metric located'
            - Own store plus named marketplace presence
