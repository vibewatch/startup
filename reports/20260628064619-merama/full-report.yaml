      - number: '5.4'
        title: Trust, quality, compliance, and product risk
        blocks:
          - type: paragraph
            body: >-
              Trust evidence exists, but it is uneven and mostly operational rather than deeply technical. At the holdco
              level, Merama has a multi-jurisdiction privacy notice covering data processing, transfer, and data-subject
              rights across Mexico, Brazil, the United States, Chile, and Colombia. At the storefront level, Mercadazo
              warns users about pirate sites and declares its webstore the only official store. At the portfolio-brand
              level, public service-quality signals differ materially: Growth Supplements posts strong
              consumer-resolution metrics on Reclame Aqui, while Oceane's complaint metrics are weaker and
              verified-review commentary mentions app gaps and intermittent stockouts. The key diligence risk is that
              these public trust signals are not the same thing as independent software assurance. The reviewed sources
              did not surface Merama SOC 2, ISO 27001, PCI, public incident reporting, or a technical trust center, so
              compliance visibility is legal and customer-service-led rather than engineering-led. For diligence
              purposes, this means service quality can be triangulated publicly, while system resilience still requires
              management disclosure.
