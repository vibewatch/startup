  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and category structure
        blocks:
          - type: paragraph
            body: >-
              Merama sits inside the e-commerce brand-aggregator (or "roll-up") category, a model that buys or takes
              stakes in third-party online consumer brands and then centralizes capital, technology, marketing and
              supply-chain functions to scale them. The competitive set is best understood in five layers. The first is
              direct regional peers that apply the same aggregator thesis to Latin America: Valoreo, a Mexico-founded
              acquirer, and Quinio, a Mexican aggregator with a similar acquire-and-scale model. The second is global
              aggregators whose footprint touches the region or sets the category template: Thrasio, the original US
              Amazon roll-up; Razor Group, the Berlin-based global consolidator that has rolled up several peers; and
              Perch, the leading US Amazon aggregator now owned by Razor. The third layer is the marketplaces themselves
              — Mercado Libre and Amazon — which are not aggregators but are the distribution gatekeepers every
              aggregator depends on and could disintermediate. The fourth is the status-quo alternative: a successful
              brand founder simply self-funding growth or taking conventional venture or bank financing instead of
              selling a stake. The fifth is internal build, where a marketplace or a large CPG incumbent replicates the
              operating playbook in-house.


              The defining feature of the landscape as of 2026 is that the category has been through a brutal
              correction. The model was built on cheap capital and pandemic-era e-commerce acceleration; when both
              reversed, the most aggressive consolidators failed. Thrasio, once valued near $10 billion, filed for
              Chapter 11 in February 2024 and emerged that June only after cutting roughly $495 million of debt. Una
              Brands, the pan-Asian aggregator, publicly shifted from buying brands to selling them in 2024. Razor Group
              absorbed Valoreo, Perch, Factory14 and Stryze in a wave of distressed consolidation. The practical effect
              for Merama is paradoxical: the field of direct competitors is thinner than it was in 2021, but the
              surviving evidence base now treats the aggregator model itself as the primary risk rather than any single
              rival.


              For underwriting purposes, Merama's competitive position therefore turns less on head-to-head feature
              parity and more on whether its specific variant — selective minority and majority stakes in a handful of
              category-leading brands, a Latin America-only focus, and a working-capital-plus-technology operating model
              — avoids the over-leverage and over-breadth that sank the global roll-ups. That question recurs through
              the capability, pricing and moat analysis below.
            claimRefs:
