      - number: '4.3'
        title: Capital adequacy, financing dependency, and macro exposure
        blocks:
          - type: paragraph
            body: >-
              Merama's capital strategy has shifted decisively from growth equity toward working-capital debt, and the
              full round-by-round chronology is set out in the Company Overview chapter; here the focus is the financing
              structure and its adequacy. The pivotal facts are that in April 2024 Merama secured an $80 million
              five-year credit line from J.P. Morgan, selected through a competitive process and backed by
              Big-Four-audited results, and that in April 2025 it raised $215 million comprising $45 million of equity
              and $170 million of debt at a valuation it says remains above $1 billion. The $45 million of equity came
              from existing backers Advent International, SoftBank, Valor Capital, Balderton and Monashees plus new
              investor Marcel Telles, while the $170 million reais-denominated revolving credit line led by BTG Pactual,
              Citi and Itaú refinanced the earlier J.P. Morgan facility and funded the Growth Supplements acquisition.
              Lifetime capital raised is reported inconsistently across sources, spanning $445 million cited in 2021
              coverage and more than $520 million cited in 2025, a discrepancy that diligence must reconcile against
              actual equity issued versus refinanced debt.


              The adequacy question cannot be answered from public data because Merama discloses neither cash on hand,
              monthly burn, runway, nor a use-of-funds breakdown, and its next-round trigger is unknown. What is visible
              is a clear and growing reliance on debt: the company has deliberately funded working capital with
              reais-denominated revolving credit rather than dilutive equity, which preserves ownership but introduces
              refinancing and currency risk. The 2025 round refinanced the 2024 J.P. Morgan facility into a larger bank
              syndicate, so debt obligations have grown in absolute terms even as the company reports profitability.


              The macro backdrop sharpens this exposure. Brazil's Selic policy rate ended 2024 around 12.25% and rose
              toward roughly 15% in 2025, one of the highest real-rate environments among major economies. Fitch Ratings
              warned in February 2026 that prolonged elevated real rates have reduced Brazilian corporates' financial
              cushions, with median EBITDA interest coverage falling from about 4.8 times in 2021 to roughly 2.4 times
              by 2025 and a gradual easing pace likely to prolong pressure on cash flows. For a company carrying a $170
              million reais-denominated revolving facility, this is the single most important financial risk: the same
              debt-led working-capital model that distinguishes Merama from equity-only peers is also the lever that, at
              high rates, most threatens its cash flow and refinancing path. The capital-adequacy and gaps tables below
              map what is known, what is missing, and the exact diligence path for each.
