      - number: '7.4'
        title: >-
          The current underwriting hinge is execution discipline: fewer brands, better controls, and explicit kill
          criteria
        blocks:
          - type: paragraph
            body: >-
              The best argument in Merama’s favor is that the company appears to have learned from the first wave of
              aggregator exuberance. Public materials now talk about six lead brands, a holding-company posture, and
              sustainable growth rather than endless category land grabs. That strategic narrowing is directionally
              positive. But it does not erase execution concentration; it intensifies it. A roughly 300-person
              organization with more than 20 brands and a central tech-and-data platform still has to allocate
              inventory, marketing, pricing, and operational attention across multiple countries and categories while
              preserving service quality. The public record does not disclose marketplace concentration, lender
              covenants, inventory turns, returns, or chargebacks, so the residual risk sits exactly where a roll-up
              usually fails: not in the headline market size, but in the hidden conversion of capital into reliable
              sell-through.


              That is why the kill criteria should be hard and monitorable. If public or diligence data show that one or
              two marketplaces dominate GMV, if complaints and delivery slippage keep rising at flagship brands, if new
              debt mainly refinances old debt instead of funding productive growth, or if fraud and compliance incidents
              start to show up more visibly, the thesis breaks faster than the headline revenue story suggests. The
              mitigation path is straightforward but evidence-intensive: show audited brand-level cash generation, prove
              platform diversification where possible, demonstrate that the central operating stack improves delivery
              and returns, and surface legal/compliance controls beyond a privacy notice. Until then, Merama looks
              investable only as a disciplined operating turnaround inside a good market—not as a free option on endless
              roll-up expansion.
