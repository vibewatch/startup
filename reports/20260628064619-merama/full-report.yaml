              public storefront shows active category breadth, while third-party reporting ties Merama to rapid brand
              launches, channel expansion, and product incubation. The strongest evidence is therefore at the workflow
              and brand-asset level, not at the internal code or infrastructure level. Public evidence also suggests the
              product is modular: capital, channel expertise, and operating playbooks can be applied unevenly by brand,
