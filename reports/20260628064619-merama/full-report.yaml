  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: IC-style scoring for Merama based on public evidence only.
    data:
      items:
        - label: Market opportunity
          score: 8/10
          note: Latin American ecommerce remains one of the fastest-growing regions globally
        - label: Operating proof
          score: 6/10
          note: Reported scale and EBITDA are strong, but still private-company claims
        - label: Unit-economics evidence
          score: 4/10
          note: Public CAC, gross margin, cash-conversion, and channel economics remain absent
        - label: Capital structure
          score: 4/10
          note: 2025 round was mostly debt, increasing refinancing and rate sensitivity
        - label: Competitive positioning
          score: 6/10
          note: Focused house-of-brands model is differentiated, but platform competition is intense
        - label: Valuation discipline
          score: 5/10
          note: Current public mark is conditionally defensible, not obviously cheap
        - label: Exit readiness
          score: 4/10
          note: A strategic or private path looks more realistic than IPO from current disclosure levels
        - label: Evidence quality
          score: 4/10
          note: Recommendation still depends on data-room material not public evidence
