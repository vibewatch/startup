      - number: '8.2'
        title: Recommendation, Confidence, and Risk Rating
        blocks:
          - type: paragraph
            body: >-
              The recommendation for Merama is TRACK / CONDITIONAL rather than buy, pass, or avoid. It is not a pass
              because the company appears materially stronger than the failed aggregator archetype: it claims real
              scale, positive EBITDA, a narrower brand set, and enough lender confidence to refinance into a larger
              syndicate. It is not a buy because the current public valuation cannot be cleanly underwritten from public
              evidence. A buyer today would be paying for a private structure whose most important variables — audited
              statements, common-equity terms, debt covenants, brand concentration, working-capital drag, and
              channel-level economics — remain hidden.


              Confidence is low-to-medium. The central operating claims are plausible and corroborated across several
              reports, but they are still company-originated numbers in a private structure. Risk is high rather than
              critical because the business now appears more mature and profitable than the sector's collapses, but the
              financing structure, currency/rate exposure, and concentration risk remain substantial. The valuation
              stance is stretched but not absurd: if one takes the public claims at face value, a valuation just above
              $1 billion implies roughly 1.7x 2023 sales and roughly 10x EBITDA; if those claims prove optimistic, if
              EBITDA does not convert to cash, or if preference terms protect only the latest investors, the true
              common-equity value could be meaningfully lower.


              The monitoring threshold for an upgrade is concrete. Merama would move closer to BUY only if diligence
              receives the Big-Four-audited statements, a brand-level revenue and EBITDA bridge including Growth
              Supplements, and the covenant and pricing package for the BTG/Citi/Itaú debt line. Without those, the
              correct action is to track the company and wait for either better evidence or a more compelling entry
              price.
            claimRefs:
