      - number: '3.3'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Aggregators do not compete on a public per-unit price the way SaaS vendors do; the relevant "price" is the
              deal structure offered to a brand founder and the operating capabilities bundled with it. Here Merama's
              differentiation is real but narrow. Where Thrasio and Perch built their model on buying brands outright —
              taking full ownership and the full downside of inventory and debt — Merama deliberately took substantial
              but often partial stakes, frequently leaving founders in place as operators, as it did with Growth
              Supplements. Quinio and Valoreo sit closer to the outright-acquisition model, while Razor/Perch is now an
              explicitly buyout-and-automate consolidator leaning on AI and large-language-model tooling to automate its
              consumer-to-manufacturer operations. On capabilities, the buying criteria that matter to a brand founder
              are access to working capital, proprietary growth and marketplace-intelligence technology, cross-border
              and omnichannel expansion, marketing and business-intelligence support, and regional regulatory and
              logistics knowledge. Merama claims all five, with a specifically Latin American lens across Brazil,
              Mexico, Colombia, Chile and Peru that the global players cannot match.


              Distribution power is the decisive comparison, and it cuts against every aggregator equally. None of these
              companies owns its primary demand channel: they all sell through Mercado Libre, Amazon and, increasingly,
              their own direct-to-consumer and omnichannel storefronts. That makes multi-homing the norm and switching
              costs for a marketplace low — a brand can be replicated, undercut or de-prioritized by the platform that
              hosts it. Merama's partial answer is to anchor on brands with genuine offline and direct demand, such as
              Growth Supplements' own logistics and production ambitions and Mercadazo's omnichannel presence across
              Amazon, Liverpool and Mercado Libre, which lessens but does not remove platform dependence. The capability
              matrix and pricing-model table below make these comparisons explicit and mark cells where public evidence
              is thin.


              The pricing and packaging comparison also exposes the model's core tension. The aggregator promise to a
              founder is liquidity plus scale; the aggregator's own economics depend on cheap capital and operating
              leverage across many brands. When capital turns expensive — as it has in Brazil and Mexico's high-rate
              environment — the outright-buyout players carry the most stranded risk, which is precisely why Thrasio,
              Una and the original Razor targets retrenched. Merama's stake-based, fewer-brands variant is a hedge
              against that tension, but it concentrates exposure into a small number of brands, trading breadth risk for
              depth risk.
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
              - CP037
