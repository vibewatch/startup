  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Legal, regulatory, and macro risk sit above the operating story because Merama spans multiple jurisdictions
          while selling into consumer-facing channels
        blocks:
          - type: paragraph
            body: >-
              The highest-severity public risk is not a single lawsuit already in motion, but a stack of obligations
              that can become expensive as the company grows faster than its disclosure surface. Merama publicly exposes
              only a narrow legal stack: a cross-border privacy notice, a jobs-page fraud warning, and press materials.
              That is enough to show the company spans multiple legal entities and at least five privacy regimes,
              including a Mexican SOFOM entity, but it is not enough to show a complete storefront-terms, returns,
              chargeback, or regulator-correspondence posture across every brand. For an investor, that gap matters
              because Merama is not a software company selling a single subscription agreement; it is a multi-brand
              operator selling physical goods into Mexico, Brazil, and other LATAM markets where privacy, shipping,
              refunds, and advertising standards are enforced at the storefront level. PROFECO’s own monitoring
              framework makes clear that privacy, contactability, payment security, shipping, and return disclosures are
              not optional nice-to-haves for Mexican online retail.


              The second part of the risk stack is macro-regulatory rather than company-specific. Brazil remains one of
              Merama’s most important operating markets, and the public evidence still describes rates as restrictive
              and financially constraining for corporates. Fitch and Focus both point to a long period of elevated real
              rates; BCB keeps rates and transmission channels at the center of policy communication. Merama’s model is
              unusually exposed to that backdrop because working capital, inventory, logistics, and brand investment all
              absorb cash before revenue is realized. In other words, even if e-commerce demand remains healthy, the
              legal and macro frame can still compress flexibility: privacy or consumer-protection mistakes create
              remediation cost, while rates and FX move the carrying cost of inventory and debt at the same time.
            claimRefs:
