      - number: '6.2'
        title: Adoption proof exists at the brand level, not as a disclosed group KPI
        blocks:
          - type: paragraph
            body: >-
              The strongest proof that Merama serves real customers is not a portfolio-level active-customer metric —
              Merama does not publish one — but a set of brand-level adoption signals. Growth Supplements is the
              clearest scaled proof point: Merama's 2025 acquisition announcement describes the brand as the largest
              sports-nutrition company in Latin America, with annual sales above $400 million and a business that had
              multiplied more than tenfold over three years of partnership. That is materially stronger evidence than a
              logo wall because it ties a named brand to commercial scale. Oceane offers a different kind of proof: its
              own storefront spans makeup, skincare, hair, and wellness lines, and third-party review surfaces show an
              active flow of verified and spontaneous post-purchase feedback rather than static marketing copy.
              Mercadazo adds a Mexican house-of-brands case where the storefront, editorial coverage, and transaction
              policies point to a functioning consumer commerce operation with multiple private labels, delivery
              promises, and a documented returns framework. The adoption trajectory across the three named brands is
              therefore uneven but real: Growth shows the strongest sales-scale proof, Oceane shows the strongest
              third-party review density, and Mercadazo shows a broader category reach with weaker third-party
              repeat-purchase transparency. What is missing is the bridge from these individual proof points to a
              Merama-wide installed base, order frequency, or active-buyer curve, so the chapter treats portfolio
              adoption as credible but only partially measured.
