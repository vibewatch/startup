- id: growth-drivers-and-constraints
  title: Growth drivers, constraints, and sizing gaps
  body: 'The demand-side tailwinds for Merama''s market are genuine. Latin American e-commerce is growing faster than any other region, driven by deepening internet and smartphone penetration, the rise of real-time payment rails such as Pix in Brazil and SPEI in Mexico, expanding banking penetration, and growing cross-border purchasing, all of which PCMI cites as structural drivers. Rising e-commerce penetration of total retail, projected to top 10% in Argentina, Brazil, Colombia, Mexico, and Uruguay by 2029, means the online channel is still in a secular expansion phase rather than a saturated one.


    The constraints, however, are equally structural and matter more for an aggregator than for a marketplace. Platform concentration means Merama''s brands depend on Mercado Libre and Amazon for discovery, advertising, and fulfillment, which compresses margin and creates dependence on counterparties that are also potential competitors through private label and first-party retail. Macroeconomic volatility, including currency depreciation and high interest rates in Brazil and Mexico, raises the cost of the working-capital debt that funds Merama''s model, and the 2023 regional funding collapse showed how quickly capital can withdraw. Category regulation, such as Brazil''s ANVISA rules for supplements that govern Growth Supplements, adds compliance cost and launch friction.


    Finally, the sizing evidence itself is contradictory and should be preserved rather than smoothed. The PCMI total-commerce figure and the eMarketer retail figure differ by more than 2.5 times because they measure different scopes; growth rates range from eMarketer''s 12.2% retail pace to PCMI''s 22-23% total-commerce CAGR; and no public source isolates the specific consumer-product categories and geographies that constitute Merama''s true serviceable market. The honest conclusion is that the market is large and growing, but the precise addressable and obtainable figures for a brand aggregator remain a material diligence gap.'
