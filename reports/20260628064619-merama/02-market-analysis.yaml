chapter:
  number: 2
  title: Market Analysis
  summary: Merama operates inside Latin America's fast-growing e-commerce market, anchored by Brazil and Mexico, which together dominate regional online retail. Independent estimates put Latin American e-commerce on a strong double-digit growth path toward roughly $700 billion in total commerce by 2026, but the addressable market for a brand aggregator is far narrower than the headline and is structurally gated by Mercado Libre and Amazon, who capture most platform spend.
sections:
- id: market-definition-and-boundary
  title: Market definition and boundary
  body: 'Merama''s market is best defined in two nested layers. The outer layer is Latin American e-commerce, the total value of goods and services sold online across the region; the inner, addressable layer is the subset that a consumer-brand holding company can actually monetize, namely first-party and marketplace sales of physical consumer products in categories like sports nutrition, beauty, and home goods, concentrated in Brazil and Mexico where Merama is headquartered and where its largest brands sell.


    The boundary matters because the two largest public estimates measure different things. Payments and Commerce Market Intelligence (PCMI) sizes total Latin American e-commerce, which includes travel, online gaming, and delivery apps alongside retail goods, and reports the market exceeding $509 billion in 2023. eMarketer, by contrast, measures retail e-commerce only and put the 2025 figure at about $191 billion. Both are credible, but they are not interchangeable: a brand aggregator''s opportunity lives inside the retail-goods slice, not the broader digital-commerce total, so later chapters should treat the retail figure as the relevant denominator and the PCMI total as context.


    The relevant adjacencies and substitutes are also worth naming. Merama''s brands compete against unmanaged direct sellers, traditional offline retail, private-label and platform-owned brands, and the marketplaces themselves when they move into first-party retail. The status-quo substitute for many Latin American consumer brands is simply selling unaided through Mercado Libre or Amazon without a holding-company partner, which is exactly the gap Merama claims to fill with capital, technology, and cross-border expansion.'
