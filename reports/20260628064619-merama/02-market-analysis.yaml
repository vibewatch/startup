- id: buyers-segments-and-channels
  title: Buyers, segments, and channels
  body: 'The end buyer in Merama''s market is the Latin American online consumer, and the population base is large and increasingly connected. DataReportal reports that at the start of 2025 Brazil had about 183 million internet users out of a population of roughly 212 million, an 86% penetration rate, while Mexico had about 110 million internet users out of roughly 131 million people, an 83% penetration rate. That installed base of connected consumers is the demand pool every Merama brand ultimately sells into.


    The critical structural feature is that those consumers are reached overwhelmingly through a small number of platforms. Mercado Libre is the dominant marketplace across the region, and Amazon is the principal challenger; analyst work by Matteo Ceurvels estimates that Mercado Libre and Amazon together will capture roughly two-thirds of the $54 billion in incremental Latin American retail e-commerce sales expected over the two years to 2028, with Walmart the only other meaningful share-gainer. Mercado Libre''s scale is reinforced by enormous capital commitments: it announced about $4.6 billion of investment in Mexico in 2026 and roughly R$57 billion in Brazil, expanding to dozens of distribution centers and the largest logistics footprint of any regional platform.


    For Merama this creates a two-sided segmentation. On the demand side its brands serve mass-market and aspirational consumers in categories such as sports nutrition (Growth Supplements), beauty (Oceane), and omnichannel general merchandise (Mercadazo), which sells across Amazon, Liverpool, and Mercado Libre. On the supply side Merama''s real counterparties are brand founders who own the customer relationship but lack capital and technology. The budget owner for a Merama purchase decision is therefore split: the consumer controls the retail spend, but the platforms control discovery and fulfillment, leaving brands and aggregators to compete for margin in between. A nearly $19 billion white-space opportunity outside Mercado Libre and Amazon is the room in which Merama''s brands must grow.'
