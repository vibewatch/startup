  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: sam
    missingEvidence: A category- and geography-specific sizing of online sales of sports nutrition, beauty, and home goods in Brazil and Mexico that maps directly to Merama's portfolio.
    whyItMatters: Without a category-level serviceable market figure, Merama's true addressable opportunity and implied share cannot be estimated with precision.
    diligencePath: Commission or obtain category-level e-commerce data for Merama's specific verticals in Brazil and Mexico.
    relatedQuestionRefs:
    - QM007
    - QM023
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: sizing-conflict
    missingEvidence: A reconciled view that aligns total-commerce and retail-only e-commerce estimates onto a common scope and base year.
    whyItMatters: The headline market figures differ by more than 2.5 times, so applying the wrong lens would materially overstate Merama's opportunity.
    diligencePath: Normalize PCMI, AMI, and eMarketer figures to a single retail-goods scope and base year before sizing Merama's market.
    relatedQuestionRefs:
    - QM008
    - QM022
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: regulation
    missingEvidence: Primary ANVISA documentation and any country-specific supplement, cosmetics, or import regulation affecting Merama's categories.
    whyItMatters: Regulatory friction directly affects launch speed and margin in Merama's largest category, sports nutrition.
    diligencePath: Review ANVISA registration requirements and cosmetics regulation for Brazil and import rules for Mexico.
    relatedQuestionRefs:
    - QM018
    relatedTableRefs:
    - TM004
tables:
- id: TM001
  title: Market definition table
  columns:
  - dimension
  - in scope
  - out of scope / adjacency
  - note
  rows:
  - - Outer market
    - Total Latin American e-commerce (all verticals)
    - Offline retail
    - Context layer, not Merama's monetizable market
  - - Addressable market
    - Retail e-commerce of physical consumer goods in Brazil and Mexico
    - Travel, gaming, delivery apps, financial services
    - The slice a brand aggregator can monetize
  - - Categories
    - Sports nutrition, beauty, home and general merchandise
    - Services, groceries-only, pure marketplaces
    - Matches Merama's actual brand portfolio
  - - Geography
    - Brazil and Mexico primarily; Colombia, Chile, Peru secondary
    - Argentina (volatile), rest of world
    - Concentrated in the two largest markets
  - - Channel
    - Marketplaces (Mercado Libre, Amazon, Liverpool) plus brand D2C
    - Pure offline distribution
    - Discovery and fulfillment gated by platforms
  - - Substitute
    - Holding-company partnership (Merama model)
    - Selling unaided on marketplaces; outright acquisition roll-ups
    - Defines the competitive status quo
  notes: Scope rows are analytical boundaries derived from market-research and company sources; the addressable market is a reasoned subset, not a directly published figure.
