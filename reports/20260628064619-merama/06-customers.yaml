  data:
    nodes:
    - id: n1
      label: Discover brand or category need
      description: Consumer enters via nutrition, beauty, home, or wellness intent.
    - id: n2
      label: Choose channel
      description: Shopper decides between brand DTC storefront and external marketplace or retailer surface.
    - id: n3
      label: View listing and price
      description: Content, ranking, promotions, and assortment are partly controlled by the marketplace when the sale is off-site.
    - id: n4
      label: Checkout and payment
      description: Consumer pays through brand checkout or platform-managed flows.
    - id: n5
      label: Fulfillment and delivery
      description: Operational experience depends on warehouse, carrier, and marketplace logistics conditions.
    - id: n6
      label: Support, review, and complaint loop
      description: Verified reviews and complaint platforms reveal whether post-purchase experience supports repurchase.
    - id: n7
      label: Repeat purchase or category expansion
