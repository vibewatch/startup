  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: portfolio-retention
    missingEvidence: Brand-level and portfolio-level repeat-purchase cohorts, active-buyer definitions, and monthly reorder rates.
    whyItMatters: Without cohort retention, Merama's customer durability cannot be compared across brands or tied to contribution-margin quality.
    diligencePath: Request monthly buyer cohorts by brand and channel, including first-order month, repeat order rate, and 6/12-month retention.
    relatedQuestionRefs:
