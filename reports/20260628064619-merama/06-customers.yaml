  - type: missing-source
    severity: material
    topic: channel-mix
    missingEvidence: Brand-level GMV, order volume, ad spend, and contribution margin split by DTC, Amazon, Mercado Libre, Liverpool, and other channels.
    whyItMatters: The core concentration risk is channel dependence, but the public record does not disclose how much revenue or margin sits on any one platform.
    diligencePath: Request channel P&Ls and GMV mix by brand, plus top-platform share of sales and fulfillment costs.
    relatedQuestionRefs:
    - QU016
    - QU022
    - QU025
