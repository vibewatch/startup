- id: retention-repeat-and-satisfaction
  title: Durability evidence is third-party and brand-specific, with no disclosed portfolio retention
  body: 'Durability is the weakest publicly disclosed part of the Merama customer story. There is no public NRR, GRR, churn, reorder rate, cohort table, or brand-level active-customer retention disclosure from Merama itself, so customer stickiness has to be inferred from downstream signals. Growth''s third-party complaint record is comparatively strong for a mass-market consumer brand: over the trailing six months captured in this run, it posted an 8.9/10 reputation score on Reclame Aqui, answered 100% of complaints, resolved 93.5%, and 84.5% of reviewed complainants said they would buy again. Oceane''s picture is more mixed but still clearly active: verified-review surfaces emphasize ease of use, product quality, and logistics speed, yet complaint data show lower resilience than Growth, with a 7.0/10 six-month reputation score, 80% resolution, and only 57.3% willingness to repurchase among respondents. Those differences matter for Merama because they imply that not all scaled brands in
    the portfolio have equally durable consumer relationships even before channel fees or ad spend are considered. Mercadazo has operating and trust signals, but it lacks a comparable public satisfaction dataset, leaving a material blind spot in repeat-purchase underwriting. The net result is that demand durability can be supported for Growth, partially supported for Oceane, and only weakly supported for Mercadazo, while the portfolio-level retention story remains undisclosed.'
