company:
  name: Merama
chapter:
  number: 6
  title: Customers
  summary: Merama's real customers are the end consumers buying from owned brands such as Growth Supplements, Oceane, and Mercadazo, but its economic dependence runs through external channels that control discovery, listings, fulfillment, payments, and advertising. Public proof of adoption exists at the brand level — Growth's >$400 million annual sales, Oceane's verified-review and complaint footprints, and Mercadazo's multi-brand Mexican storefront with multi-year operating history — while group-level retention and concentration remain opaque because Merama does not disclose brand-level customer counts, repeat purchase, NRR/GRR, or channel mix. The chapter therefore underwrites customer demand as real but brand-specific, and flags durability and concentration risk as concentrated in a handful of scaled brands and marketplace dependencies rather than in a disclosed enterprise customer roster.
sections:
- id: customer-segmentation-and-economic-buyer
  title: Who pays, uses, and buys across Merama's brands
  body: 'Merama is not selling a single software product to a homogeneous account base; it is operating a portfolio of consumer brands whose ultimate economic customer is the end shopper. That means buyer, user, and payer usually collapse into the same household consumer on direct-to-consumer storefronts such as Growth and Oceane, while the intermediary role of Amazon, Mercado Libre, Liverpool, and other marketplaces changes the economics of the relationship. On marketplaces, the end customer still chooses and pays for the product, but the platform controls the listing standards, inventory visibility, checkout surfaces, fulfillment interfaces, ad placement, and often post-purchase messaging. Merama therefore has two customer layers to manage at once: end consumers who repeat-purchase branded goods, and channel partners whose tooling and logistics determine whether those customers can be reached efficiently. This distinction matters because Growth, Oceane, and Mercadazo serve different baskets
    and purchase cadences: Growth is a replenishment-heavy nutrition catalog, Oceane is a beauty and skincare assortment with gifting and repeat-use features, and Mercadazo is a broader general-merchandise storefront where the transaction is more episodic and category-specific. Merama''s own description of partnering with category leaders across Brazil, Mexico, Colombia, Chile, and Peru reinforces that the portfolio is organized around consumer brands, not around a contracted B2B account roster, so customer quality must be judged brand by brand and channel by channel rather than by a single company-wide customer-count claim.'
