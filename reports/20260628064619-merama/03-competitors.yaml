- id: competitor-profiles
  title: Competitor profiles, scale, and funding
  body: 'The direct regional peers are smaller and more fragile than Merama. Valoreo was founded in 2020 in Mexico City by Martin and Stefan Florea, Alexander Grüll, Cedrik Hoffmann and Miguel Oehling, with the same thesis of acquiring and scaling category-leading online brands and providing entrepreneurs an exit. It raised an early round of roughly $50 million from Kaszek, Upper90, FJ Labs, Angel Ventures and Presight Capital, but rather than scaling independently it was acquired by Germany''s Razor Group in late 2022 as part of a $70 million L Catterton-led financing of Razor. Valoreo therefore no longer competes as an independent regional champion; its assets now sit inside a global consolidator. Quinio, the other Mexican peer, is led by co-founder and CEO Juan Carlos Gavito and raised about $40 million of equity and debt in 2022 from Northgate Capital, Cometa, Dila Capital, AlleyCorp and others. Quinio explicitly describes its model as a tropicalized version of the US and European aggregator playbook, focused on home and kitchen, health and wellness, and maternity and baby categories, and says it operates across five countries and has doubled the sales of acquired brands.


    The global aggregators set the category''s cautionary template. Thrasio, founded in 2018, became one of Amazon''s top-five sellers with products reaching an estimated one in two US households, but it over-expanded on cheap debt and filed for Chapter 11 bankruptcy in February 2024 carrying roughly $855 million of funded debt; it eliminated about $495 million of that debt, took $90 million of new financing, and emerged in June 2024 under a new CEO, Stephanie Fox, with an explicit pivot to profitability and its best brands. Una Brands, a Singapore-based aggregator founded in 2021, raised more than $100 million and bought 20-plus brands before reversing course in 2024, selling stakes in several subsidiaries and cutting its losses sharply as it moved from buyer to seller. Razor Group, founded in Berlin in 2020, is the survivor-consolidator: it acquired Perch — the leading US Amazon aggregator — together with Valoreo, Factory14 and Stryze, manages more than 40,000 products, and has targeted more than $1 billion in revenue, backed by a Series D that Presight Capital led and the separate $70 million L Catterton round.


    Against this field Merama looks comparatively well-capitalized and regionally focused but is not immune to the same forces. Its 2023 layoffs and its own pivot from roughly 20 brands to about six echo the retrenchment seen across the category, and its growing reliance on reais-denominated debt is the same lever that broke Thrasio. The profile table and positioning map below summarize scale, funding and differentiation across the set.'
