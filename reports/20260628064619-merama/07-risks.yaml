- id: TR001
  title: Regulatory / legal risk register
  columns:
  - rule / case / obligation
  - jurisdiction
  - status
  - likelihood
  - severity
  - mitigation
  - residual exposure
  - diligence path
  rows:
  - - Cross-border privacy and data-rights obligations across Merama entities
    - Mexico / Brazil / US / Chile / Colombia
    - Public privacy notice exists, but public evidence stops mostly at the notice layer
    - medium
    - high
    - Merama publishes a group privacy notice and rights-request workflows across jurisdictions
    - medium-high
    - Request DPA templates, deletion logs, complaint history, and brand-level privacy/control owners.
  - - Mexican consumer-disclosure, payment-security, shipping, and return obligations for online stores
    - Mexico
    - PROFECO monitoring framework is active and directly relevant to any Mexican storefronts or brands
    - medium-high
    - high
    - Public portfolio brands do have visible storefronts and customer channels, reducing pure ghost-store risk
    - medium-high
    - Test flagship storefronts against PROFECO criteria and collect recent refund, return, and cancellation policy snapshots.
  - - Marketplace listing, restricted-goods, and catalog-approval compliance
    - Amazon / Mercado Libre
    - Operationally ongoing because listings, restrictions, and approvals are mediated by marketplace APIs and policies
    - high
    - high
    - Merama runs a central operating model and can programmatically manage listings through marketplace tooling
    - high
    - Request brand-by-brand account-health, suspension, restricted-listing, and approval-escalation data.
  - - Brand impersonation or collection fraud using Merama’s name
    - Brazil / cross-border digital channels
    - Merama publicly warns that it does not solicit Pix transfers or Telegram communication
    - medium
    - moderate
    - Public anti-fraud warning is already live on Merama’s jobs page
    - medium
    - Request fraud-incident history, takedown workflow, and whether any customer or candidate losses have been recorded.
  notes: Rows are ordered by residual severity and focus on public legal/compliance obligations most likely to affect diligence or underwriting.
