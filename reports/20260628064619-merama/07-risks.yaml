- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Debt-funded working capital turns into refinancing dependence
    - New facilities, lender diligence, or audited cash-flow bridge
    - Debt grows faster than brand-level cash generation for two consecutive reporting periods or new money mainly repays old money
    - Treat the model as balance-sheet-led rather than operating-led and pause underwriting.
  - - Marketplace concentration becomes a single-node thesis risk
    - Private GMV / revenue mix by channel and seller account health
    - Any one marketplace contributes an overwhelming majority of GMV with weak contractual protection or poor health metrics
    - Re-rate partner risk upward and haircut durability of margins and growth.
  - - Service quality degrades at flagship brands
    - Complaint trends, OTIF data, returns, and cancellations
    - Complaint volumes, non-delivery, or defect categories keep rising without a matching improvement in resolution speed
    - Assume the central operating stack is not compounding quality and reduce conviction on scale benefits.
  - - Roll-up precedent starts to rhyme with Thrasio
    - Leverage, inventory turns, and acquisition cadence
    - Merama resumes aggressive expansion before proving cash conversion on the current six-brand focus
    - Frame the company as vulnerable to the same category failure mode that forced Thrasio into Chapter 11.
  - - Compliance or fraud incidents surface beyond the current warning layer
    - Regulator notices, chargeback spikes, scam reports, or legal diligence
    - Public complaints, regulator correspondence, or candidate/customer loss events show the anti-fraud and compliance stack is not keeping pace
    - Pause the process until controls, restitution history, and remediation ownership are validated.
  notes: These kill criteria are intentionally observable so that diligence can falsify the thesis instead of merely describing risks.
