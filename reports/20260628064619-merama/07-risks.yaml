figures:
- id: FR001
  title: Risk heatmap
  type: matrix
  layout: wide
  summary: Merama’s heaviest residual exposure clusters where debt-funded working capital, platform dependence, and compliance obligations overlap.
  data:
    columns:
    - Likelihood
    - Impact
    - Mitigation maturity
    - Residual severity
    rows:
    - label: Privacy / consumer compliance
      values:
      - label: medium
        tone: warning
        detail: The obligation set is visible but the public compliance stack is thin.
      - label: high
        tone: negative
        detail: A multi-brand consumer operator can multiply remediation cost across storefronts.
      - label: medium
        tone: warning
        detail: Merama publishes privacy rights and warnings, but little else publicly.
      - label: medium-high
        tone: warning
        detail: Residual exposure comes from disclosure depth rather than a known active case.
    - label: Marketplace / API dependence
      values:
      - label: high
        tone: negative
        detail: Amazon and Mercado Libre workflows are structurally embedded in the model.
      - label: high
        tone: negative
        detail: Policy or API shifts can hit multiple brands simultaneously.
      - label: medium
        tone: warning
        detail: Central tooling helps scale but also centralizes failure modes.
      - label: high
        tone: negative
        detail: Residual exposure stays high because platform rules remain external.
    - label: Logistics and service quality
      values:
      - label: medium-high
        tone: warning
        detail: Complaint data already show delivery and post-purchase friction at key brands.
      - label: high
        tone: negative
        detail: Operational misses transmit directly into refunds, reputation, and inventory turns.
      - label: low-medium
        tone: warning
        detail: Public mitigation evidence is still mostly qualitative.
      - label: high
        tone: negative
        detail: This is the clearest day-two operational risk in the public record.
    - label: Debt + rates + FX
      values:
      - label: high
        tone: negative
        detail: Merama keeps using debt while Brazil’s rate backdrop remains restrictive.
      - label: critical
        tone: negative
        detail: Working-capital models fail quickly when refinancing closes before inventory converts.
      - label: medium
        tone: warning
        detail: Portfolio narrowing helps, but does not remove macro sensitivity.
      - label: high
        tone: negative
        detail: Residual exposure is the main reason the model can resemble Thrasio on the downside.
    - label: Execution / central platform bandwidth
      values:
      - label: medium
        tone: warning
        detail: A ~300-person, multi-brand platform can still be too thin for the task.
      - label: moderate
        tone: warning
        detail: Execution misses would likely show up in slower cash conversion before insolvency.
      - label: medium
        tone: neutral
        detail: The six-brand focus is a real mitigation if management stays disciplined.
      - label: medium
        tone: warning
        detail: Residual exposure depends on data, process, and allocation quality that public sources do not quantify.
