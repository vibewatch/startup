- id: operational-partner-risk
  title: Operational risk is really platform, logistics, and service-quality concentration disguised as a house-of-brands model
  body: 'Merama’s public story emphasizes technology, working capital, and growth levers, but the concrete operating dependencies sit outside the company. Amazon exposes orders, payments, inventory, and listings through SP-API; Mercado Libre has the same logic through its developer platform; and major marketplace filings show how much service quality depends on third-party carriers and cross-border payment mechanics. That matters because Merama does not own the rules of the marketplaces its brands use. Approval flows can change, restricted-category enforcement can tighten, API behavior can evolve, logistics fees can be repriced, and foreign-exchange controls can complicate supplier payments. None of those shocks need to be existential individually; they become serious when they hit several brands at once.


    The public customer signal inside the portfolio already points in that direction. Growth Supplements and Oceane both have visible complaint pools around non-delivery, delay, defects, or misleading-advertising allegations. Those pages do not prove systemic failure, but they do show that operational quality at scale is not frictionless. Merama’s own positioning depends on central expertise improving demand planning, fulfillment, and pricing, so recurring delivery and service noise at flagship brands directly pressures the core thesis that a centralized operator can make marketplace-native brands more reliable, not just larger. If those issues persist while Mercado Libre and Amazon keep raising logistics and service expectations, Merama risks owning the downside of customer experience without owning the underlying platform rules.'
