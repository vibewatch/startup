  evidenceGaps:
  - type: missing-source
    severity: material
    topic: brand-level legal and consumer terms
    missingEvidence: Brand-by-brand terms of sale, return policies, chargeback data, and formal consumer-remedy workflows across Merama storefronts.
    whyItMatters: A privacy notice alone does not prove the full legal/compliance stack for a multi-brand consumer operator.
    diligencePath: Request current terms, refunds/returns playbooks, and any recent consumer complaints or escalations for each lead brand.
    relatedQuestionRefs:
    - QR004
  - type: missing-source
    severity: material
    topic: channel concentration
    missingEvidence: GMV or revenue mix by Amazon, Mercado Libre, Shopee, Liverpool, owned sites, and offline channels.
    whyItMatters: Without channel concentration, it is impossible to size the true dependence on any single marketplace or fee regime.
    diligencePath: Request the last 12 months of GMV and net revenue by channel and the top seller-account concentration by brand.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: blocking
    topic: debt covenants and maturity ladder
    missingEvidence: Facility terms, collateral, covenants, borrowing base mechanics, maturities, and refinancing triggers on Merama’s debt stack.
    whyItMatters: Debt-funded working capital is the core financial risk in this model, and covenant or maturity pressure can break the thesis before growth does.
    diligencePath: Obtain executed debt agreements, latest compliance certificates, and monthly liquidity forecasts.
    relatedQuestionRefs:
    - QR028
  - type: missing-source
    severity: material
    topic: litigation and regulator correspondence
    missingEvidence: Any public or private lawsuits, regulatory complaints, recalls, or formal notices involving Merama or its lead brands.
    whyItMatters: The absence of obvious public cases is not the same as a clean legal history across multiple consumer brands and jurisdictions.
    diligencePath: Run legal diligence by entity and brand, including complaint databases, recall searches, and counsel confirmations.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: portfolio service metrics
    missingEvidence: Brand-level returns, cancellations, chargebacks, stockouts, OTIF, and complaint-resolution trends.
    whyItMatters: Complaint pages indicate friction, but only operating metrics show whether Merama’s central stack is improving or degrading service quality.
    diligencePath: Request monthly KPI dashboards for the six lead brands covering fulfillment, returns, customer satisfaction, and working-capital turns.
    relatedQuestionRefs:
    - QR030
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory / legal risk register coverage
    missingEvidence: A fuller register of non-public disputes, regulator interactions, and brand-level contract terms.
    whyItMatters: The public legal register is enough to rank risk, but not enough to declare the chapter exhaustive.
    diligencePath: Supplement the public register with counsel memos, litigation searches, and brand-level policy audits.
    relatedQuestionRefs:
    - QR004
    - QR029
    relatedTableRefs:
    - TR001
