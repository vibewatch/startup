    whyItMatters: >-
      Merama handles ecommerce operations and customer data, so legal/privacy text alone is not enough to underwrite
      reliability or security maturity.
    diligencePath: >-
      Ask for trust-center materials, audits, pentest summaries, uptime SLOs, and incident-response governance for
