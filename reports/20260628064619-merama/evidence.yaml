evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Audited consolidated revenue, gross margin, EBITDA and cash-flow statements tied to an official financial package
      rather than company press statements.
    whyItMatters: >-
      Merama's revenue, profitability and cash-flow-positive claims drive the entire investment case but are not
      independently verified in public sources.
    diligencePath: Request audited consolidated financial statements and a brand-level revenue and margin bridge from management.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: >-
      A reconciled capital schedule showing each equity round, each debt facility, refinancings, and a single defensible
      lifetime total raised.
    whyItMatters: >-
      Public cumulative figures span $445 million in 2021 and more than $520 million in 2025 and do not reconcile
      cleanly once refinanced debt is considered.
    diligencePath: Obtain the round-by-round capitalization table and the terms and maturities of each debt facility.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: The exact post-2021 priced valuation and security terms from the April 2025 round.
    whyItMatters: >-
      Merama only says its valuation is "more than $1 billion," which prevents any precise valuation or dilution
      analysis.
    diligencePath: Request the 2025 subscription documents, share count and post-money valuation from management or lead investors.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      A current board roster, independent-director list and a map of governance rights held by Advent, SoftBank and the
      debt syndicate.
    whyItMatters: >-
      Governance disclosure is thin for a company that has raised hundreds of millions of dollars, limiting any
      assessment of control and downside protection.
    diligencePath: >-
      Request the board composition, investor-rights agreement summary and any related-party policy covering the CEO's
      Balderton role.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: portfolio
    missingEvidence: >-
      The complete current list of Merama's roughly six brands with ownership stakes, since only three are consistently
      named in public sources.
    whyItMatters: >-
      Without the full brand list and stakes, portfolio concentration and the value attributable to each brand cannot be
      precisely assessed.
    diligencePath: Request the full brand roster, ownership percentages and brand-level revenue from management.
    relatedQuestionRefs:
      - QO019
      - QO027
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: material
    topic: sam
    missingEvidence: >-
      A category- and geography-specific sizing of online sales of sports nutrition, beauty, and home goods in Brazil
      and Mexico that maps directly to Merama's portfolio.
    whyItMatters: >-
      Without a category-level serviceable market figure, Merama's true addressable opportunity and implied share cannot
      be estimated with precision.
    diligencePath: Commission or obtain category-level e-commerce data for Merama's specific verticals in Brazil and Mexico.
    relatedQuestionRefs:
      - QM007
      - QM023
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: sizing-conflict
    missingEvidence: >-
      A reconciled view that aligns total-commerce and retail-only e-commerce estimates onto a common scope and base
      year.
    whyItMatters: >-
      The headline market figures differ by more than 2.5 times, so applying the wrong lens would materially overstate
      Merama's opportunity.
    diligencePath: >-
      Normalize PCMI, AMI, and eMarketer figures to a single retail-goods scope and base year before sizing Merama's
      market.
    relatedQuestionRefs:
      - QM008
      - QM022
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: regulation
    missingEvidence: >-
      Primary ANVISA documentation and any country-specific supplement, cosmetics, or import regulation affecting
      Merama's categories.
    whyItMatters: Regulatory friction directly affects launch speed and margin in Merama's largest category, sports nutrition.
    diligencePath: Review ANVISA registration requirements and cosmetics regulation for Brazil and import rules for Mexico.
    relatedQuestionRefs:
      - QM018
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: moderate
    topic: internal-build
    missingEvidence: >-
      Public evidence on whether Mercado Libre, Amazon or a large CPG incumbent intends to replicate the aggregator
      operating playbook in-house in Latin America.
    whyItMatters: >-
      Internal build by a marketplace or incumbent could disintermediate Merama's value proposition to brand founders,
      but no concrete signal of such intent was found.
    diligencePath: Monitor marketplace seller-services expansion and incumbent M&A for in-house brand-building initiatives.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: competitor-financials
    missingEvidence: >-
      Current audited revenue, gross margin and profitability figures for Valoreo, Quinio, Una Brands and Merama, all of
      which are private and disclose little.
    whyItMatters: >-
      Without comparable financials the competitive ranking relies on funding announcements and qualitative claims
      rather than verified performance.
    diligencePath: Seek private financial data rooms or third-party estimates for each competitor's revenue and margins.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: financial-statements
    missingEvidence: >-
      Big-Four-audited consolidated financial statements, segment revenue, gross margin, and a cash-flow statement, none
      of which Merama publishes despite citing audited results.
    whyItMatters: >-
      The entire revenue-quality and margin case rests on company-claimed figures that cannot be independently
      corroborated without the audited package.
    diligencePath: >-
      Request the audited consolidated statements, the auditor's opinion, and a brand-level revenue and margin bridge in
      a data room.
    relatedQuestionRefs:
      - QI015
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: >-
      A reconciled capital schedule distinguishing equity issued from refinanced debt to resolve the $445 million versus
      more-than-$520 million lifetime-raised discrepancy.
    whyItMatters: >-
      Conflicting cumulative figures mean even Merama's capital history is not cleanly reconciled in public,
      complicating dilution and leverage analysis.
    diligencePath: >-
      Build a round-by-round capitalization schedule and confirm which debt facilities were refinanced rather than
      additive.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, monthly burn, runway, use-of-funds breakdown, and covenant terms on the $170 million
      reais-denominated facility.
    whyItMatters: >-
      Without liquidity and covenant data, capital adequacy and refinancing risk in a high-Selic environment cannot be
      assessed.
    diligencePath: Request a treasury report, use-of-funds plan, and the facility agreements with covenant and maturity detail.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: internal-stack
    missingEvidence: >-
      Merama-owned architecture diagrams, service inventory, engineering stack disclosures, or technical docs for the
      internal operating platform.
    whyItMatters: >-
      Without internal architecture evidence, investors cannot distinguish durable in-house software from lighter
      operational playbooks layered over third-party channels.
    diligencePath: >-
      Request architecture review materials, service ownership maps, deployment model, and examples of the tools Merama
      says power and automate brands.
    relatedQuestionRefs:
      - QE018
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Public status page, incident history, SOC 2, ISO 27001, PCI, or equivalent third-party assurance for
