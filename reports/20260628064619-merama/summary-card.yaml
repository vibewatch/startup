summary:
  headline: >-
    Merama looks stronger than many global aggregator failures, but thin public disclosure, debt-funded expansion, and
    brand/platform concentration keep the recommendation at TRACK with medium confidence and a stretched valuation
    stance.
  overallScore: 6.2
  recommendation: track
