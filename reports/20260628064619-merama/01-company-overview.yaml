- id: funding-valuation-and-capital-history
  title: Funding, valuation, and capital history
  body: 'Merama capitalized at extraordinary speed. In April 2021, just five months after incorporation, it announced $160 million comprising $60 million of seed and Series A equity and $100 million of debt at a valuation well above $200 million, co-led by Valor Capital, Monashees and Balderton, with TriplePoint Capital leading the debt and the CEOs of Uala, Loggi, Rappi and Madeira Madeira investing. Five months later, in September 2021, it closed a $225 million all-equity Series B co-led by Advent International and SoftBank at a valuation of approximately $850 million, which it described as the largest Series B equity round ever raised in Latin America and more than three times oversubscribed. In December 2021 a $60 million follow-on from Advent and SoftBank lifted the valuation to $1.2 billion, making Merama one of the fastest unicorns in the region''s history at roughly twelve months old.


    The capital history then shifts from pure growth equity toward debt-led working capital. The company secured an $80 million facility from J.P. Morgan in April 2024, and in April 2025 it announced a $215 million round comprising $45 million of equity and $170 million of debt at a valuation the company says remains above $1 billion. The equity came from existing backers Advent, SoftBank, Monashees, Valor and Balderton plus new investor Marcel Telles, the 3G Capital founder, while the $170 million reais-denominated revolving credit line was led by BTG Pactual, Citi and Itaú and refinanced the earlier J.P. Morgan facility. The same round funded the acquisition of Growth Supplements.


    The unresolved issue is the cumulative capital-raised figure. TechCrunch reported total funding of $445 million ($345 million equity plus $100 million debt) at the December 2021 unicorn round, and Contxto reported in 2025 that Merama had raised more than $520 million in venture capital and debt over five years, while some public summaries cite higher cumulative figures. These totals do not cleanly reconcile because debt facilities have been refinanced rather than simply added, and because the post-2021 valuation has not been publicly quantified beyond "more than $1 billion." Later chapters should treat the round-by-round equity figures as reliable and the single lifetime "total raised" number as a diligence-sensitive estimate.'
