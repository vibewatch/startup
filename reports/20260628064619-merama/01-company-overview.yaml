  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited consolidated revenue, gross margin, EBITDA and cash-flow statements tied to an official financial package rather than company press statements.
    whyItMatters: Merama's revenue, profitability and cash-flow-positive claims drive the entire investment case but are not independently verified in public sources.
    diligencePath: Request audited consolidated financial statements and a brand-level revenue and margin bridge from management.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: A reconciled capital schedule showing each equity round, each debt facility, refinancings, and a single defensible lifetime total raised.
    whyItMatters: Public cumulative figures span $445 million in 2021 and more than $520 million in 2025 and do not reconcile cleanly once refinanced debt is considered.
    diligencePath: Obtain the round-by-round capitalization table and the terms and maturities of each debt facility.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: The exact post-2021 priced valuation and security terms from the April 2025 round.
    whyItMatters: Merama only says its valuation is "more than $1 billion," which prevents any precise valuation or dilution analysis.
    diligencePath: Request the 2025 subscription documents, share count and post-money valuation from management or lead investors.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, independent-director list and a map of governance rights held by Advent, SoftBank and the debt syndicate.
    whyItMatters: Governance disclosure is thin for a company that has raised hundreds of millions of dollars, limiting any assessment of control and downside protection.
    diligencePath: Request the board composition, investor-rights agreement summary and any related-party policy covering the CEO's Balderton role.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: portfolio
    missingEvidence: The complete current list of Merama's roughly six brands with ownership stakes, since only three are consistently named in public sources.
    whyItMatters: Without the full brand list and stakes, portfolio concentration and the value attributable to each brand cannot be precisely assessed.
    diligencePath: Request the full brand roster, ownership percentages and brand-level revenue from management.
    relatedQuestionRefs:
    - QO019
    - QO027
    relatedTableRefs:
    - TO004
