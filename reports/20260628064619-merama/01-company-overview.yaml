company:
  name: Merama
chapter:
  number: 1
  title: Company Overview
  summary: Merama is a Latin American e-commerce brand holding company founded in December 2020 and headquartered jointly in Mexico City and São Paulo. Public evidence supports a real, fast-capitalized business that reached a $1.2 billion unicorn valuation in December 2021 and raised a further $215 million in April 2025, but the model has visibly retrenched from 20-plus brands to roughly six, cut staff in 2023, and reports conflicting cumulative capital-raised totals that diligence must reconcile.
sections:
- id: identity-product-and-business-model
  title: Identity, product, and business model
  body: 'Merama is a Latin American e-commerce holding company that does not sell a single product line of its own so much as it assembles and operates a portfolio of leading online consumer brands. The company describes its core activity as partnering with e-commerce champions across Latin America, taking a substantial stake in those brands, and then supplying them with working capital, proprietary technology and software, marketing and business-intelligence support, cross-border and direct-to-consumer expansion, and cost optimization. In its own words it aims to be "the best and largest online group of brands in Latin America," operating across Brazil, Mexico, Colombia, Chile and Peru.


    The business model was deliberately positioned against the first wave of Amazon aggregators. Where Thrasio, Perch and others bought dozens of brands outright, Merama said from the outset that it would work with very few partners, would not always purchase companies outright, and would instead identify the top one or two sellers in major categories and partner selectively by buying a stake. That selectivity is now the defining feature of the company: by 2025 Merama had narrowed from more than two dozen brands to roughly six leading brands, recasting itself as a holding company for category leaders rather than a high-volume roll-up.


    For underwriting purposes the identity is clear enough to reuse in later chapters, but two facts deserve emphasis. First, Merama is a dual-headquarters company split between Mexico City and São Paulo, which shapes its regulatory, currency and talent exposure across the region''s two largest e-commerce markets. Second, the company is privately held and discloses very little audited financial detail, so most scale and profitability statements are company-claimed rather than independently verified.'
