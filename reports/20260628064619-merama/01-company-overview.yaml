- id: portfolio-scale-and-brands
  title: Portfolio, scale, and leading brands
  body: 'Merama''s scale narrative is real but should be read carefully because most figures are company-claimed. At launch in April 2021 it described a 40-person team drawn from Amazon, Mercado Libre and Facebook; by the December 2021 unicorn round public coverage cited more than 180 employees and a portfolio of about 20 brands across Mexico, Brazil, Chile, Colombia and Peru; and the company said it would sell more than $250 million of merchandise in its first year while remaining highly profitable. By mid-2023, after a workforce reduction, headcount was reported to remain above 400 employees, and by 2025 the company had narrowed operational focus to roughly six leading brands.


    The portfolio''s anchor is Growth Supplements, a Brazilian sports-nutrition brand that Merama describes as the largest in Latin America and the fourth largest in the world, with annual sales above $400 million; Merama reports that the brand grew more than tenfold over roughly three years of partnership and that its founder remains CEO with plans to expand production, logistics and international reach. Mercadazo is an omnichannel brand in Mexico selling across Amazon, Liverpool and Mercado Libre, supported by a data-intelligence platform that Merama says identifies, acquires and launches hundreds of SKUs each year. Oceane is a Brazilian beauty brand. The company says these six brands are the focus of its current working-capital and manufacturing investment.


    The key diligence point is denominator discipline. Merama has clearly built a meaningful, revenue-generating portfolio with at least one very large brand, but the strategic pivot from 20-plus brands to six both concentrates the portfolio''s value into a handful of names and removes most of the brand-level disclosure that would let an outside analyst verify consolidated revenue, profitability or growth. The single most important brand, Growth Supplements, was only acquired in 2025, so the portfolio''s composition is recent and still evolving.'
