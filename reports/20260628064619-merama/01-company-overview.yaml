- id: milestones-and-adverse-signals
  title: Milestones, retrenchment, and adverse signals
  body: 'Merama''s chronology is unusually compressed and well-documented for its financing events, which makes the timeline a reliable backbone for later chapters. The founding in December 2020, the April 2021 $160 million round, the September 2021 $225 million Series B, the December 2021 $60 million unicorn follow-on, the April 2024 J.P. Morgan facility, and the April 2025 $215 million round and Growth Supplements acquisition are all corroborated across company announcements, investor posts, law-firm deal notices and tier-one technology and finance reporting.


    The most important adverse signal is the 2023 retrenchment. In late June 2023, Reuters reported and Merama''s CEO confirmed that the company had cut nearly 10% of its staff, which the CEO framed as a strategic refocus on brands generating more than $15 million in revenue rather than a pure cost-saving exercise, leaving headcount above 400. The cut landed during an 82% year-on-year collapse in Latin American venture funding and alongside layoffs at other regional unicorns, and it coincides with the strategic narrowing from 20-plus brands to six. The CEO''s claim that the company was cash-flow positive with a healthy runway is a company statement that has not been independently verified.


    A second adverse theme is disclosure opacity. The post-2021 valuation has never been publicly quantified beyond "more than $1 billion," cumulative capital-raised figures conflict across sources, brand-level economics are not disclosed, and governance details are thin. None of these are evidence of wrongdoing, but together they mean the headline unicorn narrative rests heavily on company-claimed figures. Diligence should treat the financing chronology as solid ground and the consolidated financial and governance picture as materially incomplete.'
