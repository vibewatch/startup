  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 谁为 Merama 旗下品牌付费、使用和购买
        blocks:
          - type: paragraph
            body: >-
              Merama 不是向同质账户群销售单一软件产品；它运营的是一组消费品牌，最终经济客户是终端购物者。这意味着在 Growth 和 Oceane 这类 DTC
              店铺里，买方、用户和付款方通常都落在同一个家庭消费者身上；Amazon、Mercado Libre、Liverpool 等 marketplace 的中介角色则改变了关系经济性。在 marketplace
              上，终端客户仍然选择并支付产品，但平台控制 listing 标准、库存可见度、结账界面、履约接口、广告位，且往往控制购后消息触达。因此，Merama
              必须同时管理两层客户：会复购品牌商品的终端消费者，以及其工具和物流决定能否高效触达这些消费者的渠道伙伴。这个区别重要，因为 Growth、Oceane 和 Mercadazo
              对应不同购物篮和购买节奏：Growth 是高补货属性的营养品目录，Oceane 是带礼赠和重复使用特征的美妆护肤 assortment，Mercadazo
              则是更宽的综合商品店铺，交易更偏阶段性和品类驱动。Merama 自称与 Brazil、Mexico、Colombia、Chile 和 Peru 的品类领导者合作，也强化了组合围绕消费品牌组织，而不是围绕已签约
              B2B 账户名单组织。因此，客户质量必须按品牌、按渠道判断，不能靠一个公司层面的客户数量说法概括。
