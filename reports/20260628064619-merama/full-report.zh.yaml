    title: 估值敏感性
    type: bar
    layout: wide
    summary: Merama 在不同证据和融资组合下的示意估值区间。
    data:
      items:
        - label: 经审计 EBITDA + 整合顺利 + 利率下降
          value: 1.9
        - label: 经审计 EBITDA + 高利率债务拖累
          value: 1.5
