  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Merama 最重的剩余敞口集中在三件事交叠处：债务支持的营运资金、平台依赖和合规义务。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 隐私 / 消费者合规
          values:
            - label: 中
              tone: warning
              detail: 义务范围看得见，但公开合规栈很薄。
            - label: 高
              tone: negative
              detail: 多品牌消费运营商一旦整改，成本会在多个店铺间放大。
            - label: 中
              tone: warning
              detail: Merama 公开了隐私权利和提示，但除此之外披露很少。
            - label: 中高
              tone: warning
              detail: 剩余敞口来自披露深度，而不是已知进行中的案件。
        - label: 电商平台 / API 依赖
          values:
            - label: 高
              tone: negative
              detail: Amazon 和 Mercado Libre 的工作流已经结构性嵌入该模式。
            - label: 高
              tone: negative
              detail: 政策或 API 变化可能同时冲击多个品牌。
            - label: 中
              tone: warning
              detail: 中央工具有助于规模化，也会把故障模式集中起来。
            - label: 高
              tone: negative
              detail: 平台规则仍由外部决定，所以剩余敞口维持高位。
        - label: 物流和服务质量
          values:
            - label: 中高
              tone: warning
              detail: 投诉数据已经显示，关键品牌在配送和购买后体验上存在摩擦。
            - label: 高
              tone: negative
              detail: 运营失误会直接传导到退款、声誉和库存周转。
            - label: 中低
              tone: warning
              detail: 公开缓释证据仍以定性描述为主。
            - label: 高
              tone: negative
              detail: 这是公开记录中最清楚的投后运营风险。
        - label: 债务 + 利率 + 外汇
          values:
            - label: 高
              tone: negative
              detail: 巴西利率环境仍偏紧，Merama 仍在使用债务。
            - label: 关键
              tone: negative
              detail: 库存还没转成现金时，如果再融资窗口关闭，营运资金模型会很快失灵。
            - label: 中
              tone: warning
              detail: 收窄品牌组合有帮助，但不能消除宏观敏感性。
            - label: 高
              tone: negative
              detail: 剩余敞口是该模式在下行情形下可能像 Thrasio 的主要原因。
        - label: 执行 / 中央平台带宽
          values:
            - label: 中
              tone: warning
              detail: 约 300 人的多品牌平台，面对这项任务仍可能显得人手偏薄。
            - label: 中等
              tone: warning
              detail: 执行偏差大概率会先表现为现金转换变慢，而不是直接破产。
            - label: 中
              tone: neutral
              detail: 如果管理层保持纪律，聚焦六个品牌确实能缓释风险。
            - label: 中
              tone: warning
              detail: 剩余敞口取决于数据、流程和资源分配质量；公开资料无法量化。
    approximationNotes: null
    claimRefs:
