            body: >-
              信任证据存在，但分布不均，且多数是运营层面而非深度技术层面。Holdco 层面，Merama 有一份跨司法辖区隐私通知，覆盖 Mexico、Brazil、United States、Chile 和
              Colombia 的数据处理、传输和数据主体权利。店铺层面，Mercadazo 提醒用户防范盗版网站，并声明其网店是唯一官方店。组合品牌层面，公开服务质量信号差异很大：Growth Supplements 在
              Reclame Aqui 上有强劲的消费者解决指标，Oceane 的投诉指标更弱，已验证评论也提到 app 缺口和间歇性缺货。关键尽调风险在于，这些公开信任信号不等于独立软件
              assurance。已审阅来源没有浮现 Merama 的 SOC 2、ISO
              27001、PCI、公开事故报告或技术信任中心，因此合规可见度由法务和客服驱动，而不是工程驱动。尽调上，这意味着服务质量可以公开三角验证，系统韧性仍需要管理层披露。
