      - number: '1.4'
        title: 投资组合、规模与头部品牌
        blocks:
          - type: paragraph
            body: >-
              Merama 的规模叙事真实存在，但需要谨慎阅读，因为多数数字来自公司口径。2021 年 4 月启动时，公司称团队 40 人，成员来自 Amazon、Mercado Libre 和 Facebook；到 2021
              年 12 月独角兽轮，公开报道提到员工超过 180 人，品牌组合约 20 个，覆盖墨西哥、巴西、智利、哥伦比亚和秘鲁；公司还称第一年商品销售额将超过 $250 million，并保持高度盈利。到 2023
              年中裁员后，报道显示员工仍超过 400 人；到 2025 年，公司已把运营重点收窄到约六个头部品牌。


              投资组合的锚点是 Growth Supplements。它是巴西运动营养品牌，Merama 称其为拉美最大、全球第四大，年销售额超过 $400 million；Merama
              报告称，该品牌在约三年合作期内增长超过十倍，创始人仍担任 CEO，并计划扩张生产、物流和国际覆盖。Mercadazo 是墨西哥全渠道品牌，通过 Amazon、Liverpool 和 Mercado Libre
              销售；Merama 称其由数据智能平台支持，该平台每年识别、收购并推出数百个 SKU。Oceane 是巴西美妆品牌。公司称，这六个品牌是当前营运资本和制造投资的重点。


              关键尽调点是分母纪律。Merama 显然已经搭出一个有收入、至少拥有一个超大品牌的有意义组合，但从 20 多个品牌转向 6
              个品牌，既把组合价值集中到少数名字上，也移除了大部分品牌层面披露，外部分析师因此无法验证合并收入、盈利或增长。最重要的单一品牌 Growth Supplements 直到 2025
              年才被收购，因此组合构成很新，仍在变化。
