      - number: '2.2'
        title: 多重视角下的市场规模
        blocks:
          - type: paragraph
            body: >-
              没有单一数字能概括 Merama 的市场，最好用多个视角交叉定位。最宽的视角是拉美电商总量：PCMI 报告 2023 年该地区超过 $509 billion，同比增长约 27%，到 2026 年复合年增长率约
              23%；AMI/PCMI 则预计 2023 至 2026 年区域规模增长约 22%，超过 $700 billion。eMarketer 的较窄零售视角显示，2025 年零售电商约 $191
              billion，当年增长 12.2%；它称这是全球所有地区中最快的增速，约为全球平均水平的 1.5 倍。


              地域视角把机会压得很集中。AMI 估算 2022 年巴西电商约 $216 billion，墨西哥约 $56 billion；哥伦比亚、智利、阿根廷和秘鲁各自小一个数量级。eMarketer
              补充称，阿根廷、巴西和墨西哥合计约占区域零售电商销售额的 84.5%。Merama 双总部位于巴西和墨西哥，最重要的两个市场也正是最大的两个市场；这在战略上有利，但也集中其宏观和汇率风险。


              可服务视角对承销最重要，也最不精确。Merama 的可服务市场，是其特定消费品类在巴西和墨西哥的零售商品电商支出，只是 $191 billion 区域零售总量的一部分。其已取得份额以 Growth
              Supplements 报告的 $400 million 以上年销售额为锚，再加上其余约六个品牌，意味着最多只是低个位数十亿美元级的可服务可获得位置。$700 billion
              头条数字与现实可获得市场之间的差距，是本章最重要的框架。
