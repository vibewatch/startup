      - number: '1.2'
        title: 创始人、领导层与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Merama 于 2020 年 12 月由五位联合创始人创办，背景横跨运营与咨询。Sujay Tyle 是联合创始人兼 CEO，也是迄今最有能见度的人物；他此前联合创立并领导 Frontier Car
              Group，后者 2019 年以约 $700 million 出售给 OLX/Naspers，他还曾在 Merama 早期支持者 Balderton Capital 担任 Venture
              Partner。Felipe Delgado 担任 CFO 兼总裁，此前领导 Beetmann Energy；Olivier Scialom 是 COO，曾任墨西哥电商公司 Petsy 的联合创始人兼
              COO；Renato Andrade 曾任 McKinsey 副合伙人；Guilherme Nosralla 曾任 Wildlife Studios 增长负责人。


              创始团队履历是真正的优势：一位有成功退出经历的连续电商创始人、一位财务负责人、一位在当地搭过 marketplaces
              的运营负责人、一位顶级战略咨询顾问，以及一位来自巴西知名游戏公司的增长专家。这组能力正好对应公司的实际任务：买入品牌股权，再把品牌的财务、运营、技术和增长职能专业化。


              主要治理保留项是围绕 Sujay Tyle 的关键人集中。他是每次融资公告的公共面孔，是战略与裁员报道中的被引述发言人，也是用过往退出支撑投资者信心的创始人。Tyle 同时曾是 Balderton 的
              Venture Partner 和其投资组合 CEO，这一关系方特征需要在尽调中明确绘制。公开来源没有披露完整董事会名单、独立董事，或 Advent、SoftBank
              和债务银团持有的治理权；对于一家已融资数亿美元的公司，这是重要透明度缺口。
