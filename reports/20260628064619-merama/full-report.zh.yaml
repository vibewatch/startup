      - number: '4.2'
        title: 单位经济、利润率与效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Merama 的盈利主张对电商聚合商来说异常强，也与压垮全球同行的亏损形成鲜明对照。公司报告称，2023 年底各业务单元 EBITDA 超过 $100 million，并称 2024 年一季度 EBITDA
              较上年同期内生增长超过 150%，同时强调现金流生成举措。对照 2023 年报告销售额超过 $600 million，超过 $100 million 的 EBITDA 意味着混合 EBITDA
              利润率在十几个百分点中段；这对消费品运营商来说健康，远好于 Thrasio 和其他 roll-ups 陷入困境前的深度负利润率。Merama
              将其归因于组合内协同和规模经济，各单元在自身细分中独立运营，同时调用共享资源。


              但尽调团队通常会交叉验证的效率代理指标，公开市场完全看不到。Merama 不披露获客成本、回收期、贡献利润率、毛利率、库存周转，或渠道层面经济性。由于这些品牌重度通过 Mercado Libre 和 Amazon
              销售，同时也使用自有直接渠道，变动成本中很大一部分是 marketplace 费用、广告和履约，而 Merama 没有拆出。该模式的营运资本强度也高：为合作品牌提供库存和增长融资，是 Merama
              价值主张的核心部分；这也正是它一层层加上债务授信，而不是只依赖股权的原因。没有披露营运资本周期或现金转换指标，外部无法验证报告 EBITDA 的耐久性，也无法判断库存和债务服务后有多少能转成自由现金流。


              对单位经济的净判断是：如果 Merama 的头条利润率数字准确且经审计，它会位于一个受重创品类中较健康的运营商之列；但公开单位经济细节完全缺失，使这些利润率的质量和可持续性仍是首要尽调阻塞点，而不是已定事实。
