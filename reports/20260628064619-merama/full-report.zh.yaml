  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Merama
              的市场最好拆成两层嵌套来定义。外层是拉美电商，即整个地区线上销售商品和服务的总价值；内层、也是可服务市场，是消费品牌控股公司实际能变现的部分，也就是运动营养、美妆、家居用品等实体消费品品类的一方销售和
              marketplace 销售，集中在巴西和墨西哥——Merama 总部所在地，也是其最大品牌销售地。


              边界很重要，因为两个最大的公开估算衡量的不是同一件事。Payments and Commerce Market
              Intelligence（PCMI）测算的是拉美电商总量，范围包括旅行、线上游戏和配送应用，也包括零售商品，并报告 2023 年市场超过 $509 billion。相比之下，eMarketer
              只衡量零售电商，并把 2025 年数字放在约 $191 billion。两者都可信，但不能互换：品牌聚合商的机会在零售商品切片里，而不是更宽的数字商业总量里。因此，后续章节应把零售数字作为相关分母，把 PCMI
              总量作为背景。


              相关邻近市场和替代方案也值得点名。Merama 旗下品牌与无人管理的直接卖家、传统线下零售、自有品牌和平台自营品牌竞争；当 marketplaces
              进入一方零售时，平台本身也是竞争者。许多拉美消费品牌的现状替代方案，就是不借助控股公司伙伴，直接通过 Mercado Libre 或 Amazon 独立销售；Merama
              声称用资本、技术和跨境扩张填补的，正是这个缺口。
            claimRefs:
              - CM001
