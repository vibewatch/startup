      - number: '7.4'
        title: 当前承保铰链是执行纪律：更少品牌、更好控制，以及明确 kill criteria
        blocks:
          - type: paragraph
            body: >-
              支持 Merama
              的最好论点，是公司似乎从第一波聚合商亢奋里学到了东西。公开材料现在谈六个主品牌、控股公司姿态和可持续增长，而不是无尽品类圈地。战略收窄方向上是正面的。但它没有消除执行集中；反而强化了集中。一个约 300 人、拥有
              20 多个品牌和中心技术与数据平台的组织，仍必须在多个国家和品类之间分配库存、营销、定价和运营注意力，同时守住服务质量。公开记录没有披露 marketplace 集中度、贷款人 covenant、库存周转、退货或
              chargeback，因此剩余风险正落在 roll-up 通常失败的地方：不在表面市场规模，而在资本能否隐性转换为可靠 sell-through。


              因此，kill criteria 应该硬且可监控。如果公开或尽调数据显示一两个 marketplace 主导
              GMV，如果旗舰品牌投诉和配送滑坡继续上升，如果新增债务主要用于再融资旧债而不是支持生产性增长，或欺诈与合规事件开始更明显出现，thesis
              会比表面收入故事暗示的更快破裂。缓释路径直接但证据密集：展示经审计的品牌级现金生成，在可行处证明平台多元化，证明中心运营栈改善配送和退货，并披露超出隐私通知的法律 / 合规控制。在此之前，Merama
              只像一个好市场里的、有纪律的运营 turnaround 投资标的，而不是无限 roll-up 扩张的免费期权。
