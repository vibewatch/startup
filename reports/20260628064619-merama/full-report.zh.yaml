companyProfile:
  summary: >-
    Merama 是一家拉美私营电商控股公司，成立于 2020 年底。公司围绕入股品类领先线上品牌搭建业务，用营运资本、运营能力和自有技术推动增长。相比宽口径 roll-up，公司现在更强调少数头部品牌，公开锚点最清晰的是 Growth
    Supplements、Mercadazo 和 Océane。Merama 从区域和全球大型投资者处融资，资金结构混合股权与债务；管理层称估值仍高于 US$1
    billion，并声称在聚合商品类里少见地实现盈利。投资故事成立，但披露质量远低于高置信承销所需水平。
