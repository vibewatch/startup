  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、收入流与确认
        blocks:
          - type: paragraph
            body: >-
              Merama
              以品牌集团运营商身份赚钱：它取得品类头部线上消费品牌的大额、且常常是多数股权，把它们作为自主业务单元合并，并赚取这些品牌在健康、美妆、家居、母婴和运动品类产生的经营收入。这个模式明确是收购、增长、整合——Merama
              买入电商零售商的多数股权，在三到五年周期内扩张，再可能全资收购，也可能不收。合并收入因此是品牌层面销售额之和，而不是平台抽佣；这意味着 Merama 确认其控制品牌的完整总销售额，而非薄薄的
              marketplace 佣金。这个区别对尽调很重要：收入增长可以来自新收购品牌（外生），也可以来自已拥有品牌增长（内生）；Merama 强调了内生成分，并报告 2023 年内生增长超过上一年的两倍。


              对一家成立五年的私营公司来说，报告规模相当可观。Merama 称 2023 年底销售额超过 $600 million，高于 2021 年公司口径中超过 $250 million
              的商品销售额；增幅被描述为内生销售额翻了一倍以上。最大单一收入贡献者是巴西运动营养品牌 Growth Supplements，Merama 于 2025 年 4 月收购了它；该品牌自身年销售额超过 $400
              million——如果并表，它将主导组合收入，并让收入高度集中在一个品牌和一个国家。墨西哥 Mercadazo、巴西 Oceane 等次级品牌贡献全渠道和美妆收入，但 Merama
              不发布逐品牌收入桥，因此收入结构只能推断，不能视作披露。


              仍未解决的确认与质量问题很重要。Merama 称其业绩由 Big Four
              审计，这是有意义的质量信号；但它不公开这些经审计报表、分部收入，也不披露在少数股权场景下合并品牌与权益法核算品牌的拆分。承销时，收入流方向上可信且规模很大，但缺少公开、分部化、外部可获得的财务包，意味着下文所有收入质量判断都取决于管理层披露。
