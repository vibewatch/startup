      - number: '3.4'
        title: 护城河耐久性与负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              Merama 的候选护城河包括资本获取、自有品牌建设技术和数据、区域监管与物流能力，以及拥有自带需求的品类头部品牌。每一项都真实，但都可被挑战。资本获取只有在 Merama
              能比对手更便宜地融到股权和债务时才是护城河；品类历史显示，资本具有周期性，过度依赖资本是最常见的失败原因。自有技术和 marketplace 情报确实存在，但正日益商品化——Razor 公开用 AI 和 LLM
              自动化运营，Quinio 也营销自己的技术栈，因此软件优势本身不太可能持久。区域聚焦是 Merama
              最可防守的优势：对巴西和墨西哥支付、物流、税务、补剂监管的深度理解，以及与区域创始人的关系，柏林或波士顿的整合者很难复制；这也部分解释了全球玩家为什么靠收购进入该地区（Razor 买下
              Valoreo），而不是自建。以 Growth Supplements 为锚、拥有具备独立需求的品牌，是最具体的护城河，因为它降低了纯平台依赖。


              但负面证据很充分，而且覆盖整个品类。Thrasio 破产是最清晰的信号：一家估值曾接近 $10 billion、远大于 Merama 的公司，被 Merama
              现在试图避免的同样过度杠杆和过度铺开拖垮，说明在这个品类里，单纯规模无法带来持久护城河。Una Brands 从买方转向卖方，以及 Valoreo、Perch、Factory14 和 Stryze 被吸收入
              Razor，都显示整合方向反了过来——多数独立聚合商成了收购目标，而不是持久 franchise。对 Merama
              来说，尽调含义是：其护城河一部分是周期性的（资本），一部分正在商品化（技术），只有一部分具备耐久性（区域深度和品牌所有权）；而其转向约六个品牌，在更广泛品类已经证明「无纪律的广度」致命之时，也抬高了单一品牌集中风险。下方风险登记表把每项护城河主张映射到其主要威胁和具体尽调问题。
