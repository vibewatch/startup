      - number: '2.3'
        title: 买方、细分与渠道
        blocks:
          - type: paragraph
            body: >-
              Merama 市场里的终端买方是拉美线上消费者，人口基数庞大，联网程度持续提高。DataReportal 报告称，2025 年初巴西约 212 million 人口中有约 183 million
              互联网用户，渗透率 86%；墨西哥约 131 million 人口中有约 110 million 互联网用户，渗透率 83%。这批已联网消费者，就是每个 Merama 品牌最终销售进入的需求池。


              关键结构特征在于，触达这些消费者高度依赖少数平台。Mercado Libre 是整个地区的主导 marketplace，Amazon 是主要挑战者；Matteo Ceurvels 的分析工作估算，到 2028
              年前两年，拉美零售电商增量销售预计为 $54 billion，其中约三分之二将由 Mercado Libre 和 Amazon 合计拿走，Walmart 是唯一另一个有意义的份额获得者。Mercado Libre
              的规模由巨额资本投入进一步强化：它宣布 2026 年在墨西哥投资约 $4.6 billion，在巴西投资约 R$57 billion，扩张到数十个配送中心，并拥有区域平台中最大的物流足迹。


              对 Merama 而言，这形成了双边细分。需求侧，旗下品牌服务大众市场和向上消费人群，品类包括运动营养（Growth Supplements）、美妆（Oceane）和全渠道综合商品（Mercadazo），后者通过
              Amazon、Liverpool 和 Mercado Libre 销售。供给侧，Merama 真正的交易对手是拥有客户关系但缺资本和技术的品牌创始人。因此，一次 Merama
              购买决策的预算所有者被拆开：消费者控制零售支出，平台控制发现与履约，品牌和聚合商夹在中间争夺利润。Mercado Libre 和 Amazon 之外近 $19 billion 的空白机会，就是 Merama
              旗下品牌必须增长的空间。
