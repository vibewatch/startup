      - number: '8.2'
        title: 建议、信心与风险评级
        blocks:
          - type: paragraph
            body: >-
              对 Merama 的建议是 TRACK / CONDITIONAL，而不是 buy、pass 或 avoid。它不是 pass，因为公司看起来明显强于失败聚合商原型：它声称有真实规模、正
              EBITDA、更窄品牌组，并有足够贷款人信心进入更大银团再融资。它也不是 buy，因为当前公开估值无法用公开证据干净承保。今天买入，等于为一个私有结构付费，而其中最重要变量——经审计报表、普通股条款、债务
              covenant、品牌集中度、营运资本拖累和渠道级经济性——仍被隐藏。


              信心为低到中。核心运营说法可信，且被多篇报道交叉佐证，但它们仍是私有结构里由公司提供的数字。风险是高而非关键，因为业务现在看起来比该行业倒塌案例更成熟、更盈利，但融资结构、货币 /
              利率暴露和集中风险仍然很大。估值立场偏拉伸但不荒谬：若按公开说法照单全收，略高于 $1 billion 的估值意味着约 1.7x 2023 年销售额和约 10x EBITDA；如果这些说法过于乐观，如果
              EBITDA 不能转换成现金，或优先条款只保护最新投资人，真实普通股价值可能显著更低。


              升级的监控门槛很具体。只有尽调拿到 Big Four 审计报表、包含 Growth Supplements 的品牌级收入和 EBITDA 桥表，以及 BTG/Citi/Itaú 债务额度的 covenant
              和定价包，Merama 才会更接近 BUY。没有这些，正确动作就是跟踪公司，等待更好证据或更有吸引力的入场价格。
