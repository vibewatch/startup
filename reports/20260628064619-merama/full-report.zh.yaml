      - number: '6.3'
        title: 韧性证据来自第三方且按品牌分化，没有披露组合留存
        blocks:
          - type: paragraph
            body: >-
              韧性是 Merama 客户故事里公开披露最弱的一环。Merama 自身没有公开 NRR、GRR、churn、复购率、cohort
              表或品牌级活跃客户留存披露，因此客户粘性只能从下游信号推断。对大众消费品牌而言，Growth 的第三方投诉记录相对强：在本次运行捕捉到的过去六个月里，它在 Reclame Aqui 上拿到 8.9/10
              声誉分，100% 回复投诉，93.5% 解决，84.5% 的受访投诉者表示会再次购买。Oceane 的图景更混合但仍明显活跃：已验证评论表面强调易用性、产品质量和物流速度，但投诉数据显示韧性低于
              Growth，六个月声誉分为 7.0/10，解决率 80%，受访者复购意愿只有 57.3%。这些差异对 Merama
              很重要，因为它们意味着，即便不考虑渠道费用或广告支出，组合里并非所有规模化品牌都有同等耐久的消费者关系。Mercadazo
              有运营和信任信号，但缺乏可比的公开满意度数据集，给复购承保留下重大盲点。净结果是：Growth 的需求韧性可以得到支持，Oceane 得到部分支持，Mercadazo
