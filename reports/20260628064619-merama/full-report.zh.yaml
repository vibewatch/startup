      - number: '1.3'
        title: 融资、估值与资本历史
        blocks:
          - type: paragraph
            body: >-
              Merama 资本化速度异常快。2021 年 4 月，成立仅五个月后，公司宣布融资 $160 million，包括 $60 million 种子轮和 Series A 股权，以及 $100 million
              债务，估值远高于 $200 million；Valor Capital、Monashees 和 Balderton 共同领投股权，TriplePoint Capital 领投债务，Uala、Loggi、Rappi
              和 Madeira Madeira 的 CEO 也参与投资。五个月后，2021 年 9 月，公司完成 $225 million 全股权 Series B，由 Advent International 和
              SoftBank 共同领投，估值约 $850 million；公司称这是拉美史上最大 Series B 股权融资，认购超过三倍。2021 年 12 月，Advent 和 SoftBank 追加 $60
              million，把估值推高至 $1.2 billion，使成立约十二个月的 Merama 成为该地区历史上最快的独角兽之一。


              此后，资本历史从纯增长股权转向债务主导的营运资本。公司 2024 年 4 月从 J.P. Morgan 获得 $80 million 授信，并在 2025 年 4 月宣布 $215 million 融资，其中
              $45 million 为股权、$170 million 为债务；公司称估值仍高于 $1 billion。股权来自现有投资者 Advent、SoftBank、Monashees、Valor 和
              Balderton，以及新投资者、3G Capital 创始人 Marcel Telles；$170 million 雷亚尔计价循环信贷由 BTG Pactual、Citi 和 Itaú 牵头，并置换此前
              J.P. Morgan 授信。同一轮资金还支持了 Growth Supplements 收购。


              未解决的问题是累计融资总额。TechCrunch 在 2021 年 12 月独角兽轮报道中称总融资为 $445 million（$345 million 股权加 $100 million 债务），Contxto
              2025 年报道称 Merama 五年内通过风险资本和债务融资超过 $520 million，而一些公开摘要引用了更高的累计数字。这些总额无法干净对齐，因为债务授信被再融资，而不是简单相加；且 2021
              年后的估值除了「超过 $1 billion」之外没有公开量化。后续章节应把逐轮股权数字视为可靠，把单一生命周期「总融资」数字视为尽调敏感估计。
