      - number: '3.3'
        title: 能力、定价与分发对比
        blocks:
          - type: paragraph
            body: >-
              聚合商不像 SaaS 供应商那样按公开单价竞争；真正的「价格」是给品牌创始人的交易结构，以及随之打包的运营能力。在这里，Merama 的差异化真实但狭窄。Thrasio 和 Perch
              的模式建立在全资买下品牌上——拿下完整所有权，也承担库存和债务的全部下行；Merama 则有意持有大额但常常是部分股权，并经常让创始人留任运营者，Growth Supplements 就是例子。Quinio 和
              Valoreo 更接近全资收购模式，而 Razor/Perch 如今明确是一个 buyout-and-automate 整合者，依靠 AI 和大语言模型工具自动化其
              consumer-to-manufacturer 运营。在能力上，品牌创始人真正看重的购买标准，是营运资本可得性、自有增长和 marketplace
              情报技术、跨境与全渠道扩张、营销和商业智能支持，以及区域监管和物流知识。Merama 声称五项全有，并且具备覆盖巴西、墨西哥、哥伦比亚、智利和秘鲁的特定拉美视角，这是全球玩家无法匹配的。


              分发权力是决定性对比，而且同等压制所有聚合商。这些公司没有一家拥有自己的主要需求渠道：它们都通过 Mercado Libre、Amazon，以及越来越多的自有 D2C
              和全渠道店铺销售。这让多平台经营成为常态，也让 marketplace 切换成本很低——平台可以复制、压价或降低其托管品牌的优先级。Merama 的部分回答，是锚定真正拥有线下和直接需求的品牌，例如 Growth
              Supplements 自身的物流和生产扩张计划，以及 Mercadazo 覆盖 Amazon、Liverpool 和 Mercado Libre
              的全渠道存在；这会降低但无法消除平台依赖。下方能力矩阵和定价模型表把这些对比说清，并标记公开证据薄弱的单元格。


              定价与包装对比也暴露了该模式的核心张力。聚合商给创始人的承诺是流动性加规模；聚合商自身经济性则依赖廉价资本，以及跨多品牌的运营杠杆。当资本变贵——巴西和墨西哥的高利率环境已经如此——全资收购玩家背负最多搁浅风险，这正是
              Thrasio、Una 和 Razor 原始目标公司收缩的原因。Merama 基于股权、少品牌的变体，是对这种张力的对冲，但它也把敞口集中到少数品牌上，用广度风险换深度风险。
