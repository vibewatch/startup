  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资 thesis 与反向 thesis
        blocks:
          - type: paragraph
            body: >-
              Merama 的 bull case 从一个简单事实开始：它看起来好于仍活着的中位电商聚合商。公开来源称，公司 2023 年结束时销售额超过 $600 million，EBITDA 超过 $100
              million；管理层还称结果由 Big Four 审计，且 2024 年 Q1 EBITDA 有机增长超过 150%。如果这些说法能通过 data room 复核，Merama 就不是靠希望估值的未盈利
              roll-up；它是一家有规模的运营公司，按当前公开标记交易在低个位数销售倍数和低十几倍 EBITDA 倍数附近。对披露稀疏的私营公司而言，这不便宜，但相对其报告规模，也不明显荒谬。


              第二根支柱是市场背景。Latin America 仍是全球增长最快的电商地区之一：EMARKETER 预测 2025 年区域零售电商销售额为 $191.25 billion，并称该地区增速到 2027
              年仍领先全球；PCMI 和 AMI 则把更广的电商与支付机会描述为到 2026 年仍在复合增长。Merama 自己的模型比 US 和 Europe
              第一波聚合商更有选择性；它反复描述的策略是持有品类领导者的大额或多数股权，提供营运资本，并使用跨境运营栈，而不是买下数百个小 Amazon listing。Growth Supplements 收购又增加一个
              proof point：仅 anchor brand 就被描述为年销售额超过 $400 million，即便精确合并桥表未公开，在集团层面也会有实质意义。


              反向 thesis 是，Merama 仍没有拿出足以支撑穿越周期付价的公开证据集。2025 年融资结构主要是债务，不是股权；2025 年公开估值措辞只说公司仍高于 $1
              billion，最好也只是大致持平，最差则低于 2021 年底 $1.2 billion 公开标记；早期裁员加上转向更少、更大品牌，说明最初扩张模型需要修正。更广品类记录偏负面：Thrasio 申请
              Chapter 11 并重组债务，Una Brands 2024 年削减收入并出售资产但仍亏损，Brazil 高利率压迫任何依赖债务为库存和收购融资的运营商。Merama
              可能是该品类的幸存者之一，但该品类已经证明，没有现金转换的规模会摧毁股权价值。
