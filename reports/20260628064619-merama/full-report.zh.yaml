      - number: '6.5'
        title: 客户结论：真实消费者采用、韧性披露不完整、集中风险有实质意义
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个清晰但有边界的结论。Merama 拥有能触达真实消费者的品牌，证据强于单纯品牌叙事或融资话术：Growth 有规模，Oceane 有外部评论密度，Mercadazo
              有运转中的店铺、成文配送和退货规则，以及多年市场历史。这足以否定 Merama 只是一个没有消费者 traction 的纯 roll-up 故事。但同时，组合尚未在投资韧性最关键的维度上被公开承保：Merama
              不披露活跃客户、复购、订单频率、渠道组合，或按客户类型拆分的头部品牌收入占比。反向证据也有分量。Growth 和 Oceane
              的投诉表面证明持续购买量存在，也显示服务质量和复购意愿按品牌差异很大。Mercadazo
              缺乏广泛第三方评论深度，使它成为三个具名采用案例里最不透明的一个。最后，公司在发现、物流和库存编排上仍结构性依赖外部渠道，尤其是 Mercado Libre 和 Amazon。因此，客户 thesis
              对需求存在性为正面，对留存可见度谨慎，并明确品牌集中加渠道集中是尽调仍需量化的主要风险。
