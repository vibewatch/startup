        - id: n1
          label: 声称的运营证据
          detail: '>$600M 销售额、>$100M EBITDA、2024 年 Q1 内生 EBITDA 增长 >150%'
          tone: positive
        - id: n2
          label: 市场顺风
          detail: 拉美电商到 2027 年仍在快速增长
          tone: positive
        - id: n3
          label: 披露闸门
          detail: 缺少经审计公开报表、品牌桥接和股权结构表条款
          tone: warning
        - id: n4
          label: 资本结构闸门
          detail: 2025 年融资主要是债务；利率和契约敞口很重要
          tone: warning
        - id: n5
          label: 品类先例闸门
          detail: Thrasio 和 Una 显示，杠杆或增长不及预期时，聚合器股权可能重估
          tone: warning
        - id: n6
          label: 当前判断：跟踪 / 有条件
          detail: 足够进入监控，不够透明到可以买入
          tone: warning
      edges:
        - from: n1
          to: n2
          label: 支撑上行情形
        - from: n2
          to: n3
          label: 仍需证明
        - from: n3
          to: n4
          label: 条款关键
        - from: n4
          to: n5
          label: 对照先例做压力测试
        - from: n5
          to: n6
          label: 结果
