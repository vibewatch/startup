            body: >-
              Merama 的时间线异常压缩，融资事件记录也很充分，因此可作为后续章节的可靠骨架。2020 年 12 月成立、2021 年 4 月 $160 million 融资、2021 年 9 月 $225 million
              Series B、2021 年 12 月 $60 million 独角兽追加融资、2024 年 4 月 J.P. Morgan 授信，以及 2025 年 4 月 $215 million 融资和 Growth
              Supplements 收购，都得到公司公告、投资者帖子、律所交易通知，以及一线科技和财经报道交叉印证。


              最重要的负面信号是 2023 年收缩。2023 年 6 月下旬，Reuters 报道且 Merama CEO 确认，公司裁掉近 10% 员工；CEO 将其表述为战略上聚焦年收入超过 $15 million
              的品牌，而非单纯降本，裁后员工仍超过 400 人。这次裁员发生在拉美风险融资同比暴跌 82% 期间，也与其他区域独角兽裁员同步，并且与从 20 多个品牌收窄到 6 个品牌的战略转向重合。CEO
              称公司现金流为正、runway 健康，但这仍是公司表述，尚未得到独立验证。


              第二个负面主题是披露不透明。2021 年后的估值除了「超过 $1
              billion」之外从未公开量化；累计融资数字在不同来源间冲突；品牌层面经济性没有披露；治理细节也很薄。这些都不是不当行为证据，但合在一起意味着，独角兽头衔叙事高度依赖公司口径数字。尽调应把融资时间线视为坚实地面，把合并财务和治理图景视为重大不完整。
