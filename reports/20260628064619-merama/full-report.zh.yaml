              Amazon、Mercado Libre、Shopee 和 DTC 扩张。Amazon 的 Selling Partner API 和 Listings Items API，加上 Mercado Libre
              的开发者门户，说明这些渠道围绕 listing、库存、定价和 app 安全开放了真实的程序化接口。这一点重要，因为组合公司跨这些渠道扩张时，即使 Merama
