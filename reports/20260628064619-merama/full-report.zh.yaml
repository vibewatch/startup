      - number: '7.3'
        title: 财务模型风险就是 roll-up 本身：债务支持的营运资本会把增长故事放大成再融资故事
        blocks:
          - type: paragraph
            body: >-
              Merama 最强的公开运营事实，也是最清晰的模型风险：公司从一开始就混用股权和债务来购买股权、支持营运资本，并投入品牌。这不是围绕软件利润率画像的附带融资，而是内嵌在运营模型里。2021 年启动时已经包含
              $100 million 债务，Series B 部分被描述为用于偿还债务和补充营运资本，2025 年融资包又在新股权之外增加 $170 million
              债务。管理层称这些资本会投向营运资本、品牌定位、物流能力，以及既有单元内部的
              M&A。当需求上升、库存周转健康、贷款人继续支持时，这套模型可以运转。增长放慢、库存老化、承运成本上升，或利率高位持续长于预期时，它就会变危险。


              因此，Thrasio 先例不是松散类比；它是该品类的相关下行案例。Thrasio 在达到巨大规模、头部卖家地位和广泛零售分销之后，仍需要 Chapter 11 重组债务。Merama 并不相同——它在 Latin
              America 运营更少、更大的品牌，而不是 United States 数百个 Amazon
              卖家——但传导路径足够相似，必须重视：收购热情、重库存增长、债务支持的营运资本和运营复杂度，都可能跑在底层品牌现金转换前面。Quinio 和 Valoreo 等 LATAM 同行进一步确认，债务和
              marketplace 依赖是该模型的常态，不是例外。因此，正确的承保问题不是“市场能不能增长？”，而是“Merama 能否让品牌级现金生成跑赢平台、物流和融资拖累？”
