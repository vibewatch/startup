    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: Merama 是私营公司，最新条款未披露，因此使用较宽的估值区间。
    data:
      items:
        - label: 牛市情形（$B）
          low: 1.4
          high: 2
        - label: 基准情形（$B）
          low: 0.9
          high: 1.3
        - label: 熊市情形（$B）
          low: 0.25
          high: 0.7
        - label: 当前公开标记（$B+）
          low: 1
          high: 1.2
