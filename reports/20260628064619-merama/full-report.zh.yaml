      - - 整合失手
        - 收购后 Growth Supplements 无法维持规模，或稀释集团利润率
        - 同时削弱规模与盈利能力论点
        - 下调牛市情景，并提高熊市情景权重
      - - 渠道挤压
        - Mercado Libre / Amazon 带来的平台费、物流费或广告成本压力，明显压缩品牌经济性
        - 即便收入守住，也会侵蚀现金转化
        - 将已报告 EBITDA 视为更不耐久，并扩大相对公开市场标记的折价
    notes: 触发项聚焦会改变价值、且可监测的事件，而不是泛泛的经营顾虑。
    claimRefs:
      - CV009
      - CV013
      - CV022
      - CV023
      - CV033
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 问题
      - 优先级
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 提供 Big Four 审计的合并报表及审计意见
        - 关键
        - 决定已披露销售额和 EBITDA 能否作为估值锚点
        - 管理层数据室和审计师确认
      - - 提供品牌层面的收入、毛利率、EBITDA 和所有权桥接表，包括 Growth Supplements
        - 关键
        - 显示集中度、合并口径，以及 EBITDA 是否集中在单一品牌
        - CFO 材料包和收购明细
      - - 披露债务条款：定价、到期、契约、抵押品、货币敞口和再融资条件
        - 关键
        - 2025 年结构以债务为主，因此股权价值取决于偿债能力和契约余量
        - 融资协议和司库备忘录
      - - 将 2021 年以来所有融资轮次梳理成清晰的股权结构表和清算瀑布表
        - 高
        - 若嵌入清算优先权或棘轮条款，公开估值标记无法揭示普通股价值
        - 法律顾问和融资数据室
      - - 按 Mercado Libre、Amazon、DTC 和其他市场平台展示营运资本周转、经营现金流和渠道集中度
        - 高
        - 现金转化和平台依赖决定 EBITDA 对股东是否真正有价值
        - FP&A 模型和渠道仪表盘
    notes: 这些问题是从监测电话推进到可承销估值决策所需的最低材料包。
    claimRefs:
      - CV027
      - CV040
      - CV041
      - CV042
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 追踪 Merama 从 2020 年 12 月成立，到 2021 年快速完成独角兽融资、2023 年收缩，再到 2025 年以债务为主的融资和收购 Growth Supplements。
    data:
      items:
        - date: 2020-12
          label: 成立
          detail: 五位联合创始人成立 Merama，在墨西哥城和 São Paulo 设双总部。
          tone: positive
        - date: 2021-04
          label: $160M 种子 / Series A
          detail: 融资 $60M 股权和 $100M 债务，估值超过 $200M，由 Valor、Monashees 和 Balderton 领投。
          tone: positive
        - date: 2021-09
          label: $225M Series B
          detail: Advent 和 SoftBank 共同领投当时 LatAm 最大的 Series B，估值约 $850M。
          tone: positive
        - date: 2021-12
          label: $1.2B 独角兽
          detail: 追加 $60M 融资让 Merama 成为该地区最快跻身独角兽的公司之一，并推出 Merama Labs。
          tone: positive
        - date: 2023-06
          label: 裁员约 10%
          detail: LatAm 风投资金下降 82% 期间，公司战略重新聚焦并裁员。
          tone: warning
        - date: 2024-04
          label: $80M J.P. Morgan 债务
          detail: 获得一笔营运资本债务额度，融资结构转向以债务为主。
          tone: neutral
        - date: 2025-04
          label: $215M 融资 + Growth
          detail: 融资 $45M 股权和 $170M 债务，并以 >$1B 估值收购 Growth Supplements。
          tone: positive
        - date: '2025'
          label: 聚焦约 6 个品牌
          detail: 完成从 20 多个品牌到约六个品类领导品牌的转向。
          tone: neutral
    claimRefs:
