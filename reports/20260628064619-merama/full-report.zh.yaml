      - number: '7.2'
        title: 运营风险本质上是平台、物流和服务质量集中，只是披着 house-of-brands 模型外衣
        blocks:
          - type: paragraph
            body: >-
              Merama 的公开故事强调技术、营运资本和增长杠杆，但具体运营依赖在公司外部。Amazon 通过 SP-API 开放订单、支付、库存和 listing；Mercado Libre 通过开发者平台走同一逻辑；主要
              marketplace 文件也显示服务质量在多大程度上依赖第三方承运商和跨境支付机制。这一点重要，因为 Merama 并不拥有旗下品牌所用 marketplace
              的规则。审批流程可能改变，受限品类执法可能收紧，API 行为可能演进，物流费可能重定价，外汇管制也可能让供应商付款复杂化。这些冲击单个看未必致命；一旦同时打到多个品牌，就会变得严重。


              组合内部的公开客户信号已经指向这个方向。Growth Supplements 和 Oceane
              都有围绕未送达、延迟、缺陷或误导性广告指控的可见投诉池。这些页面不能证明系统性失灵，但确实说明规模化运营质量并非无摩擦。Merama
              自身定位依赖中心化经验改善需求规划、履约和定价，因此旗舰品牌反复出现配送和服务噪音，会直接压迫“中心化运营商能让 marketplace-native 品牌更可靠，而不只是更大”的核心
              thesis。如果这些问题持续，而 Mercado Libre 和 Amazon 继续提高物流与服务预期，Merama 就可能承担客户体验下行，却不掌握底层平台规则。
