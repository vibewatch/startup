  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与品类结构
        blocks:
          - type: paragraph
            body: >-
              Merama
              位于电商品牌聚合商（或「roll-up」）品类中，这一模式收购或入股第三方线上消费品牌，再集中资本、技术、营销和供应链职能来扩张品牌。竞争集最好分为五层。第一层是把同一聚合商论点用于拉美的直接区域同行：墨西哥起家的收购方
              Valoreo，以及商业模式相似、同样收购并扩张品牌的墨西哥聚合商 Quinio。第二层是业务触达该地区或定义品类模板的全球聚合商：最早的美国 Amazon roll-up
              Thrasio；总部柏林、已整合多家同行的全球整合者 Razor Group；以及如今归 Razor 所有的美国头部 Amazon 聚合商 Perch。第三层是 marketplaces 本身——Mercado
              Libre 和
              Amazon——它们不是聚合商，却是每个聚合商依赖的分发守门人，也可能去中介化。第四层是现状替代方案：成功品牌创始人自己为增长融资，或选择传统风险资本、银行融资，而不是出售股权。第五层是内部自建，即
              marketplace 或大型 CPG 既有企业在内部复制这套运营打法。


              截至 2026 年，这个格局的定义性特征是品类经历了残酷调整。该模式建立在廉价资本和疫情期间电商加速之上；两者逆转后，最激进的整合者失败。Thrasio 曾估值接近 $10 billion，2024 年 2
              月申请 Chapter 11，直到当年 6 月削减约 $495 million 债务后才走出重组。泛亚洲聚合商 Una Brands 2024 年公开从买品牌转向卖品牌。Razor Group
              在一波困境整合中吸收了 Valoreo、Perch、Factory14 和 Stryze。对 Merama 的实际影响带有悖论：直接竞争者比 2021
              年少了，但现存证据基础现在把聚合商模式本身视为首要风险，而不是某个单一对手。


              因此，承销 Merama 的竞争位置，不再主要看点对点功能是否齐平，而是看它的具体变体——在少数品类头部品牌中选择性持有少数或多数股权、只聚焦拉美、以营运资本加技术作为运营模型——能否避开压垮全球
              roll-ups 的过度杠杆和过度铺开。这个问题会在下文能力、定价和护城河分析中反复出现。
