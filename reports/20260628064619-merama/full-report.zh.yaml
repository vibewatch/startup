  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 仅基于公开证据，对 Merama 做 IC 风格评分。
    data:
      items:
        - label: 市场机会
          score: 8/10
          note: 拉美电商仍是全球增长最快的地区之一
        - label: 运营证据
          score: 6/10
          note: 披露的规模和 EBITDA 很强，但仍是私营公司的口径声明
        - label: 单位经济证据
          score: 4/10
          note: 公开 CAC、毛利率、现金转换和渠道经济性仍缺失
        - label: 资本结构
          score: 4/10
          note: 2025 年融资主要是债务，提高了再融资和利率敏感性
        - label: 竞争定位
          score: 6/10
          note: 聚焦型品牌矩阵模式有差异化，但平台竞争激烈
        - label: 估值纪律
          score: 5/10
          note: 当前公开标记在有条件前提下说得通，但不明显便宜
        - label: 退出准备度
          score: 4/10
          note: 按当前披露水平，战略出售或私有路径比 IPO 更现实
        - label: 证据质量
          score: 4/10
          note: 推荐结论仍取决于尽调资料室材料，而不是公开证据
