    data:
      nodes:
        - id: n1
          label: 资本基础
          detail: 来自 Advent 和 SoftBank 的成长股权，加上 BTG、Citi 和 Itaú 的巴西雷亚尔计价债务。
          tone: positive
        - id: n2
