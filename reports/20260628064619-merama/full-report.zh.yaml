  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管和宏观风险压在运营故事之上，因为 Merama 横跨多个司法辖区，同时通过面向消费者的渠道销售
        blocks:
          - type: paragraph
            body: >-
              公开风险里严重度最高的，不是某一场已经启动的诉讼，而是一组义务叠加；当公司增长快于披露表面时，这组义务会变得昂贵。Merama
              公开暴露的法律栈很窄：跨境隐私通知、招聘页面欺诈警示和新闻材料。这足以显示公司横跨多个法律实体和至少五套隐私制度，包括一个 Mexican SOFOM
              实体；但不足以显示每个品牌完整的店铺条款、退货、chargeback 或监管沟通状态。对投资人而言，这个缺口重要，因为 Merama 不是销售单一订阅协议的软件公司；它是多品牌运营商，在
              Mexico、Brazil 和其他 LATAM 市场销售实物商品，而这些市场的隐私、运输、退款和广告标准都在店铺层面执行。PROFECO 自己的监测框架明确说明，对 Mexican
              在线零售而言，隐私、可联系性、支付安全、配送和退货披露不是可有可无的加分项。


              风险栈的第二部分是宏观监管，而非公司特定。Brazil 仍是 Merama 最重要的运营市场之一，公开证据仍把利率描述为限制性强、对企业财务形成约束。Fitch 和 Focus 都指向实际利率长期高位；BCB
              也把利率和传导渠道放在政策沟通中心。Merama
              的模型对这种背景异常敏感，因为营运资本、库存、物流和品牌投入都先于收入实现而消耗现金。换句话说，即便电商需求保持健康，法律和宏观框架仍会压缩灵活性：隐私或消费者保护失误会带来整改成本，而利率和 FX
              会同时抬高库存与债务的持有成本。
