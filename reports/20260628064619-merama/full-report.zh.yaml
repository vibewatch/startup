      - number: '2.4'
        title: 增长驱动、约束与规模缺口
        blocks:
          - type: paragraph
            body: >-
              Merama 所在市场的需求侧顺风确实存在。拉美电商增速快于任何其他地区，背后是互联网和智能手机渗透加深、巴西 Pix 和墨西哥 SPEI 等实时支付轨道崛起、银行渗透率扩大，以及跨境购买增加；PCMI
              均把这些列为结构性驱动。到 2029 年，阿根廷、巴西、哥伦比亚、墨西哥和乌拉圭的电商占零售总额比例预计将超过 10%，这意味着线上渠道仍处于长期扩张阶段，而非饱和状态。


              但约束同样是结构性的，而且对聚合商比对 marketplace 更重要。平台集中意味着 Merama 旗下品牌依赖 Mercado Libre 和 Amazon
              获得发现、广告和履约，这会压缩利润，并让公司依赖也可能通过自有品牌和一方零售成为竞争者的交易对手。巴西和墨西哥的汇率贬值、高利率等宏观波动，会抬高支撑 Merama 模式的营运资本债务成本；2023
              年区域融资崩塌也显示，资本可以很快撤走。品类监管，例如巴西 ANVISA 对 Growth Supplements 所在补剂市场的规则，会增加合规成本和上市摩擦。


              最后，市场规模证据本身相互矛盾，应保留差异，而不是抹平。PCMI 的总商业数字与 eMarketer 的零售数字相差超过 2.5 倍，因为两者衡量范围不同；增长率从 eMarketer 的 12.2%
              零售增速，到 PCMI 的 22-23% 总商业 CAGR 不等；也没有公开来源单独拆出构成 Merama
              真实可服务市场的特定消费品类和地域。诚实结论是：市场庞大且在增长，但品牌聚合商的精确可服务和可获得数字仍是重大尽调缺口。
