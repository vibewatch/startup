      - number: '8.4'
        title: Bull / Base / Bear 情景分析
        blocks:
          - type: paragraph
            body: >-
              Bull case 给 Merama 估值约 $1.4-2.0 billion。这个结果假设公司报告的 2023 年销售额和 EBITDA 被经审计报表验证，Growth Supplements
              整合不破坏利润率，债务额度在 Brazil 利率下仍可服务，Merama 证明一个集中在六个品牌风格的组合能以快于区域电商增长的速度复合。在这个世界里，2025
              年融资是通往价值创造的桥，而不是缺失股权需求的替代品；公司因为更像一个盈利的区域品牌运营商，获得相对困境聚合商 comps 的溢价。


              Base case 是 $0.9-1.3 billion，基本是维持标记情景。这里，公开说法方向正确，但不够干净，无法支撑 step-up。增长继续，但债务吸收的现金比多头预期更多；市场增长收益被 Mercado
              Libre、Amazon、Shopee、Shein 和其他跨境卖家竞争加剧部分抵消；投资人继续因公司仍为私有而施加披露折价。这个 base case 是今天建议的锚，因为它大体框住当前公开估值语言，而不假设英雄式
              upside。


              Bear case 是 $0.25-0.7 billion。它不需要欺诈或崩盘；只需要 EBITDA
              被高估、现金转换弱、债务条款收紧、品牌整合变慢，或未来融资低于公开独角兽标记中的若干组合。该行业已经展示了聚合商数学破裂时会发生什么。Thrasio 走到破产保护，Una Brands
              不得不收缩并出售资产，即便更成功的整合者也强调技术、纪律和整合，而不是无限收购速度。对 Merama 而言，最重要的摇摆变量是 EBITDA 质量、利息负担，以及最新优先条款是否掩盖了普通股更弱的价值。
