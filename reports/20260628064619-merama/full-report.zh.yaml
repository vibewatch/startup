  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Merama 实际向品牌交付什么
        blocks:
          - type: paragraph
            body: >-
              公开资料一致显示，Merama 卖的不是单一消费者 app，也不是一层薄薄的金融包装。它向领先电商品牌出售一套战略运营包：股权合作、营运资本、跨境扩张、营销与 BI 支持、产品 /
              品类扩张，以及旨在自动化部分运营流程的自有工具。这套东西夹在品牌创始人与终端渠道之间。创始人继续经营业务，Merama 加入资本、渠道 know-how 和中心化 playbook。最具体、消费者可见的证据是
              Mercadazo：公开店铺显示品类仍在活跃扩展，第三方报道则把 Merama
              与快速品牌推出、渠道扩张和产品孵化联系起来。因此，最强证据在工作流和品牌资产层面，不在内部代码或基础设施层面。公开证据也显示产品是模块化的：资本、渠道经验和运营 playbook
              可以按品牌不均匀投入，这有利于灵活性，却很难从组合外部做 benchmark。
