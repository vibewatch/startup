      - number: '8.3'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >-
              融资时间线重要，因为估值信号混合。Merama 2021 年通过股债结合轮融资 $160 million，随后在 2021 年 9 月以 $850 million 估值完成 $225 million Series
              B，再在 2021 年 12 月追加 $60 million，把公开标记推到 $1.2 billion，总融资额达到 $445 million。2024 年 4 月，公司增加一笔 $80 million、五年期
              J.P. Morgan 信贷额度，背后支撑是管理层关于经审计结果和盈利能力的说法。2025 年 4 月，公司又融资 $215 million，但其中只有 $45 million 是股权，$170 million
              是债务，用于再融资此前额度并支持 Growth Supplements 收购。


              这条序列支持两种相反解读。正面解读是，Merama 已经因为盈利而获得使用更便宜债务的资格，而且对 house-of-brands
              运营商而言，营运资本融资比反复股权稀释更高效。负面解读是，公司无法拿到有意义的干净股权重估：在多年规模建设后，最新公开估值语言只是 Merama 仍高于 $1 billion，而不是明显超过 2021
              年独角兽标记。仅看公开证据，最新一轮更像资产负债表工程加收购融资，而不是清晰的市场出清价格发现事件。


              因此，入场纪律很重要。超过 $1 billion 的估值只能有条件地 defend：如果声称的 EBITDA 为真，如果债务包在 Brazil 利率环境下可管理，如果 Growth Supplements
              整合提升而非稀释组合质量。但投资人不知道 liquidation preference、ratchet、warrant、covenant 或真实普通股
              waterfall，当前公开标记并不是干净的普通股等价物。这种不确定性把建议推向 track，而不是 buy。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
