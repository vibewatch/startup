      - number: '3.2'
        title: 竞争者画像、规模与融资
        blocks:
          - type: paragraph
            body: >-
              直接区域同行比 Merama 更小，也更脆弱。Valoreo 由 Martin 和 Stefan Florea、Alexander Grüll、Cedrik Hoffmann 与 Miguel Oehling 于
              2020 年在 Mexico City 创立，论点同样是收购并扩张品类头部线上品牌，为创业者提供退出。它早期从 Kaszek、Upper90、FJ Labs、Angel Ventures 和 Presight
              Capital 融资约 $50 million，但没有独立扩张，而是在 2022 年底被德国 Razor Group 收购，成为 Razor 由 L Catterton 领投的 $70 million
              融资的一部分。因此，Valoreo 已不再作为独立区域冠军竞争；其资产现在位于全球整合者内部。另一家墨西哥同行 Quinio 由联合创始人兼 CEO Juan Carlos Gavito 领导，2022 年从
              Northgate Capital、Cometa、Dila Capital、AlleyCorp 等处获得约 $40 million 股权和债务融资。Quinio
              明确称自己的模式是美国和欧洲聚合商打法的热带化版本，聚焦家居厨具、健康保健、孕产和婴幼儿品类，并称业务覆盖五个国家，已让被收购品牌销售额翻倍。


              全球聚合商构成了该品类的警示模板。Thrasio 成立于 2018 年，曾成为 Amazon 前五大卖家之一，产品估计触达二分之一美国家庭，但它靠廉价债务过度扩张，2024 年 2 月在背负约 $855
              million 有息债务时申请 Chapter 11；公司削减约 $495 million 债务，拿到 $90 million 新融资，并于 2024 年 6 月在新 CEO Stephanie Fox
              领导下走出重组，明确转向盈利和最佳品牌。Una Brands 是一家新加坡聚合商，成立于 2021 年，融资超过 $100 million，收购 20 多个品牌后在 2024
              年反向转身，出售多家子公司股权，并在从买方转向卖方时大幅削减亏损。Razor Group 2020 年成立于柏林，是幸存的整合者：它收购了美国头部 Amazon 聚合商 Perch，以及
              Valoreo、Factory14 和 Stryze，管理超过 40,000 个产品，并以超过 $1 billion 收入为目标；资金背后包括 Presight Capital 领投的 Series
              D，以及单独的 $70 million L Catterton 轮。


              放在这个竞争场里，Merama 资本相对充足，也更聚焦区域，但并不免疫于同样的力量。它 2023 年裁员，并从约 20 个品牌转向约 6
              个品牌，本身就呼应了整个品类的收缩；它对雷亚尔计价债务的依赖加深，也正是压垮 Thrasio 的同一杠杆。下方画像表和定位图总结了这个竞争集的规模、融资和差异化。
