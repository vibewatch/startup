      - number: '8.5'
        title: 可比估值、退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Merama 的可比组必须匹配模型，而不是机械套用公开市场。MercadoLibre 是最干净的公开质量锚，因为它是 Latin America 主导商业生态，因此可作为 Merama
              旗下品牌所依赖渠道的增长和物流强度 proxy；但它不是直接估值可比：MercadoLibre 是有规模的公开 marketplace 和 fintech 平台，资本结构、软件含量和流动性都很不同。更相关的运营
              comps 是品类同行和相邻 roll-up——Thrasio 代表下行，Una Brands 代表 reset economics，Razor/Perch 和 Valoreo 代表持续整合，Quinio
              是较小的 Latin American benchmark。


              这些可比支持谨慎退出判断。仅凭公开证据，Merama 尚未 IPO-ready，因为它仍未发布公开投资人需要的财务包、cap-table
              条款或品牌级披露。短期内，战略出售或大型私募融资比公开上市更可能。该品类也失去了一部分叙事溢价：到 2025-2026 年，市场奖励能证明纪律的运营商，惩罚只依赖杠杆和收购速度的公司。


              因此，最终尽调要求具体而非探索性。投资人需要经审计报表和 EBITDA 桥表、完整债务文件、一张调和 2021 年以来所有股权和债务轮次的明细表、品牌级营运资本指标，以及按 Mercado
              Libre、Amazon、DTC 和其他 marketplace 拆分的渠道集中度。在这些问题回答前，Merama 仍是一家值得密切跟踪的公司，但不是一个可以仅凭公开证据有把握承保估值的公司。
