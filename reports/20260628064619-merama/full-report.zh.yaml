      - number: '4.4'
        title: 财务结论、可比公司与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Merama 的财务结论分成两层：表面数字很有吸引力，底层结构却无法核验。先看表面，Merama 报出了同类公司里最罕见的组合：真正规模、正 EBITDA、重视现金流，销售额超过 $600
              million，EBITDA 超过 $100 million，2024 年有机 EBITDA 继续增长，并称这些结果由 Big Four 审计。若这些数字能经受 data room 核查，Merama
              的财务属性就和已经倒下的亏损型聚合商完全不同，其中十几个点的隐含利润率也说得通。问题在底层：公开材料没有合并报表、分部收入、单位经济、营运资本指标、现金、burn 和
              runway，表面数字无法独立交叉验证；终身融资额口径也互相冲突，说明连资本历史在公开口径里都没有对齐。


              可比背景只能从 Mercado Libre 的公开披露里看见 Merama 品牌所处的平台经济。Mercado Libre 是 NASDAQ 上市公司，提交经审计的 10-K，披露 take
              rate、广告和履约成本；Merama 旗下品牌这类第三方卖家都要承受这些成本。这些文件能为 Merama 面临的成本压力提供外部锚点，但不能替代 Merama 自己的数字。Merama 覆盖
              Mexico、Brazil、Colombia、Chile、Peru 和 United States，合并经济性混合多种货币和税制，公开披露无法消化这层复杂度。


              因此，尽调卡点具体且优先级高：拿到 Big Four 审计的合并财务报表和审计意见；取得品牌级收入、利润率和持股比例桥表；把 $445 million 与超过 $520 million
              的终身融资额调成一张资本表，并区分股权与再融资债务；拿到 $170 million 巴西雷亚尔计价融资的现金、burn、runway 和 covenant 条款；并在 Selic
              长期高位情景下压力测试偿债能力。这些问题未回答前，财务故事可信但有条件，收入质量、利润率韧性和资本充足性都留着重大证据缺口。
