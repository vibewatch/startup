      - number: '6.4'
        title: 扩张取决于品牌内 cross-sell，也取决于 Merama 无法控制的 marketplace 基础设施
        blocks:
          - type: paragraph
            body: >-
              Merama 的扩张路径不是典型 SaaS land-and-expand；它是一个商业运营模型，靠在自有品牌内拓宽 assortment、增加品类，并改善 merchandising、履约和转化。Growth
              在蛋白、肌酸、维生素、零食、服饰和临床产品上的目录宽度支撑复购篮子和 upsell 逻辑。Oceane 在彩妆、护肤、头发、礼赠和 wellness 上的 assortment
              在美妆里起到同样作用。Mercadazo 的多品牌 assortment 展示了另一条扩张路径：家居、健身、玩具、美妆和工具等自有品牌宽度。但这些扩张循环要经过 Merama 无法完全控制的平台。Mercado
              Libre 的文件称，卖家使用其 marketplace、物流、支付、广告产品和店铺工具触达数百万消费者，超过一半 Envios 包裹通过 fulfillment centers 处理，Mexican SMEs
              也常把平台当作主要收入来源。Amazon 的 selling-partner 文档从另一个角度让这种依赖变得清晰：listing、库存、价格更新和履约工作流都通过平台 API 和履约服务管理。实践中，这意味着
              Merama 可以提升旗下品牌的转化和 assortment，但仍暴露于 marketplace 政策变化、广告经济性、费率变化、履约条件或两大区域渠道的排名变化。扩张是真实的，但并不主权。
