      - number: '5.3'
        title: 成熟度、路线图，以及从聚合商转向品牌控股公司
        blocks:
          - type: paragraph
            body: >-
              Merama 作为运营商看起来比作为公开软件平台更成熟。公开记录显示，公司从 2021 年的精选合作 thesis，演进到 2025 年聚焦六个更大品牌、更独立业务单元、且只在既有垂直平台内做 M&A
              的结构。Growth Supplements 是当前最清晰的路线图标记：Merama 支持的报道把该品牌与更多 SKU、生产、物流能力和潜在国际扩张联系起来。Contxto 的报道也显示，Merama
              不再主要把自己描述成中心化聚合商，而是一个优化少数更强资产的 holdco。缺失的是软件发布级成熟度证据。路线图通过收购、品牌集中和资本配置变化可见，而不是通过产品 changelog、uptime
