      - number: '4.3'
        title: 资本充足性、融资依赖与宏观敞口
        blocks:
          - type: paragraph
            body: >-
              Merama 的资本策略已明确从增长股权转向营运资本债务；完整逐轮时间线见公司概览章节，这里聚焦融资结构及其充足性。关键事实是，2024 年 4 月 Merama 从 J.P. Morgan 获得 $80
              million 五年期授信，该授信通过竞争流程选定，并由 Big-Four 审计结果支持；2025 年 4 月，公司又融资 $215 million，其中 $45 million 为股权、$170 million
              为债务，估值据称仍高于 $1 billion。$45 million 股权来自现有支持者 Advent International、SoftBank、Valor Capital、Balderton 和
              Monashees，以及新投资者 Marcel Telles；$170 million 雷亚尔计价循环信贷由 BTG Pactual、Citi 和 Itaú 牵头，置换此前 J.P. Morgan 授信，并为
              Growth Supplements 收购提供资金。生命周期融资额在不同来源中不一致，范围从 2021 年报道引用的 $445 million，到 2025 年引用的超过 $520
              million；尽调必须把实际发行股权与再融资债务对齐，才能解释这个差异。


              公开数据无法回答资本是否充足，因为 Merama 不披露账上现金、月度烧钱、runway
              或资金用途拆分，下一轮融资触发条件也未知。能看到的是，公司对债务的依赖清晰且加深：它有意用雷亚尔计价循环信贷而非稀释性股权来支持营运资本，这保住所有权，但引入再融资和汇率风险。2025 年融资把 2024 年
              J.P. Morgan 授信置换进更大的银行银团，因此即便公司报告盈利，债务义务的绝对规模也已经上升。


              宏观背景让这个敞口更尖锐。巴西 Selic 政策利率 2024 年底约 12.25%，2025 年升向约 15%，处于主要经济体中最高的实际利率环境之一。Fitch Ratings 2026 年 2
              月警告，长期高企的实际利率已经削弱巴西企业财务缓冲，中位数 EBITDA 利息覆盖率从 2021 年约 4.8 倍降至 2025 年约 2.4 倍，而渐进降息节奏可能延长现金流压力。对于一家背着 $170
              million 雷亚尔计价循环授信的公司，这是最重要的单一财务风险：同一个债务主导的营运资本模型，让 Merama
              区别于只靠股权的同行；但在高利率下，它也是最威胁现金流和再融资路径的杠杆。下方资本充足性和缺口表会列出已知、缺失内容，以及每项的确切尽调路径。
