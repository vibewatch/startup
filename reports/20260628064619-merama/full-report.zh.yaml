chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Merama
              是一家拉美电商控股公司。它与其说在卖自有单一产品线，不如说在拼出并运营一个头部线上消费品牌组合。公司把核心业务定义为与拉美各地的电商冠军合作，取得这些品牌的大额股权，再向它们提供营运资本、自有技术和软件、营销与商业智能支持、跨境和直达消费者扩张，以及成本优化。按公司自己的说法，它希望成为「拉美最好、最大的线上品牌集团」，业务覆盖巴西、墨西哥、哥伦比亚、智利和秘鲁。


              这个商业模式一开始就有意区别于第一波 Amazon 聚合商。Thrasio、Perch 等公司一次性买下数十个品牌；Merama
              从一开始就表示会与很少的合作伙伴合作，不一定总是全资收购公司，而是识别大品类中排名第一或第二的卖家，并通过买入股权进行选择性合作。这种选择性现在成了公司的定义特征：到 2025 年，Merama
              已从二十多个品牌收窄到约六个头部品牌，把自己重新定位为品类领导者控股公司，而不是高频收购的 roll-up。


              承销时，这一身份已经足够清晰，后续章节可以复用，但有两点值得强调。第一，Merama 是双总部公司，分布在 Mexico City 和 São
              Paulo，这让它同时暴露在拉美两大电商市场的监管、汇率和人才环境中。第二，公司为私营，几乎不披露经审计的财务细节，因此多数规模和盈利表述来自公司口径，而非独立验证。
