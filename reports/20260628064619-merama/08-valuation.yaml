- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Dimension
  - Investment thesis
  - Anti-thesis / what would change the view
  rows:
  - - Operating proof
    - Claims of >$600M sales and >$100M EBITDA suggest Merama is one of the few profitable category operators
    - Need audited statements and cash-conversion proof; otherwise headline EBITDA may overstate equity value
  - - Portfolio strategy
    - Selective majority-stake approach in category leaders is more disciplined than mass Amazon roll-ups
    - Earlier layoffs and narrowing to bigger brands imply the first model needed repair
  - - Market backdrop
    - Latin American ecommerce is still growing quickly across Brazil, Mexico, and Argentina
    - Growth increasingly accrues to Mercado Libre, Amazon, and other scaled ecosystems that can squeeze smaller operators
  - - Financing structure
    - Debt can be efficient if profitability is real and inventory turns are strong
    - 2025 round was mostly debt, so refinancing and interest-cost risk matter more than in pure-equity stories
  - - Category evidence
    - Razor/Valoreo and Quinio show there is still strategic value in consolidation
    - Thrasio bankruptcy and Una Brands resets show aggregator failure modes are real, not theoretical
  - - Valuation signal
    - Current mark can be defended if EBITDA is durable and Growth integrates well
    - Public language only says >$1B in 2025, which is not a clear step-up from the 2021 unicorn mark
  notes: The table contrasts the strongest public-supporting evidence with the specific diligence item or market event that would rebut it.
