- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Ask
  - Priority
  - Why it matters
  - Owner / diligence path
  rows:
  - - Provide the Big-Four-audited consolidated statements plus auditor opinion
    - Critical
    - Determines whether reported sales and EBITDA can be trusted as the valuation anchor
    - Management data room and auditor confirmation
  - - Provide a brand-level revenue, gross margin, EBITDA, and ownership bridge including Growth Supplements
    - Critical
    - Shows concentration, consolidation method, and whether EBITDA is concentrated in one brand
    - CFO package plus acquisition schedules
  - - 'Disclose debt terms: pricing, maturities, covenants, collateral, currency exposure, and refinancing conditions'
    - Critical
    - The 2025 structure was mostly debt, so equity value depends on debt service and covenant headroom
    - Facility agreements and treasury memo
  - - Reconcile all rounds since 2021 into a clean cap-table and waterfall schedule
    - High
    - Public marks do not reveal common-equity value if liquidation preferences or ratchets are embedded
    - Legal counsel and financing data room
  - - Show working-capital turns, operating cash flow, and channel concentration by Mercado Libre, Amazon, DTC, and other marketplaces
    - High
    - Cash conversion and platform dependency determine whether EBITDA is truly valuable to equity holders
    - FP&A model and channel dashboards
  notes: These asks are the minimum package required to move from a monitoring call to an underwritten valuation decision.
