- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Status / metric
  - Why it matters
  - Relevance to Merama
  - Key limitation
  rows:
  - - MercadoLibre
    - $84.92B market cap as of Jun-2026; public platform leader
    - Best public anchor for regional ecommerce scale, logistics intensity, and channel economics
    - High for channel context; low for direct valuation
    - Marketplace/fintech platform, not a private leveraged brand aggregator
  - - Thrasio
    - Filed Chapter 11; restructuring reduced $495M of debt
    - Defines downside path when roll-up leverage and acquisition math break
    - High for adverse category precedent
    - US Amazon-heavy model and bankruptcy process make it an imperfect operational match
  - - Una Brands
    - 2024 revenue down 28% to $30.9M; loss before tax $4.8M; sold brands
    - Shows post-boom reset economics even after restructuring and portfolio sales
    - Moderate as a cross-region aggregator reset comp
    - APAC-focused and much smaller than Merama
  - - Razor / Perch
    - Razor bought Perch and said combined platform could exceed $1B topline in the medium term
    - Scaled consolidator reference for tech-enabled operating leverage and sector consolidation
    - Moderate for scaled-roll-up strategy
    - Private valuation undisclosed and geographic mix differs materially
  - - Valoreo
    - Raised one of LatAm aggregator space's largest seed rounds and was later acquired by Razor
    - Regional model-appropriate reference for acquisition appetite and exit optionality
    - Moderate as a LatAm-specific comp
    - Sale multiple and current standalone economics are private
  - - Quinio
    - $40M equity-and-debt raise and expected $50M ARR in 2022
    - Smaller Mexico-based comparator helps anchor how much larger Merama became
    - Moderate for regional benchmarking
    - Far earlier-stage and much smaller than Merama
  notes: 'Coverage is intentionally partial: public-market anchors, distressed precedents, and private rounds are all needed because no perfect like-for-like public Merama comp exists.'
