- id: bull-base-bear-scenarios
  title: Bull / Base / Bear Scenario Analysis
  body: 'The bull case values Merama at roughly $1.4-2.0 billion. That outcome assumes the company''s reported 2023 sales and EBITDA are validated by audited statements, Growth Supplements integrates without breaking margins, the debt line remains serviceable despite Brazilian rates, and Merama shows that a concentrated six-brand-style portfolio can compound faster than regional ecommerce growth. In this world the 2025 financing was a bridge to value creation rather than a substitute for missing equity demand, and the company earns a premium to distressed aggregator comps because it looks more like a profitable regional brand operator.


    The base case is $0.9-1.3 billion, which is essentially a hold-the-mark scenario. Here the public claims prove directionally right, but not clean enough to justify a step-up. Growth continues, but debt absorbs more cash than bulls expect; market growth benefits are partly offset by intensifying competition from Mercado Libre, Amazon, Shopee, Shein, and other cross-border sellers; and investors keep applying a disclosure discount because the company remains private. That base case is the anchor for today''s recommendation because it broadly brackets the current public valuation language without assuming heroic upside.


    The bear case is $0.25-0.7 billion. It does not require fraud or collapse; it requires only some combination of EBITDA overstatement, weak cash conversion, tighter debt terms, slower brand integration, or a future financing below the public unicorn mark. The sector has already shown what happens when aggregator math breaks. Thrasio reached bankruptcy protection, Una Brands had to shrink and sell assets, and even the more successful consolidators emphasize technology, discipline, and consolidation rather than unlimited acquisition pace. For Merama, the most important swing variables are EBITDA quality, interest burden, and whether the latest preferred terms obscure weaker value for common equity.'
