company:
  name: Merama
chapter:
  number: 8
  title: Valuation
summary: 'Merama''s valuation case is investable in concept but not yet fully underwritable in public. The positive side is unusual for the ecommerce-aggregator category: Merama says 2023 sales topped $600 million, EBITDA exceeded $100 million, Q1 2024 EBITDA grew more than 150% organically, and Growth Supplements adds a brand said to exceed $400 million in annual sales. Latin American ecommerce is still growing quickly, and Merama now looks more like a concentrated operator of a few category leaders than a spray-and-pray Amazon roll-up.


  The negative side is what keeps the call from upgrading to buy. The April 2025 round delivered only $45 million of equity against $170 million of debt, while public valuation language moved from $1.2 billion in late 2021 to merely "above $1 billion" in 2025, implying little clear mark-up despite added scale. Public audited statements, brand-level bridges, cash conversion, covenant terms, and cap-table preferences are absent. Category evidence is mixed-to-adverse: Thrasio filed Chapter 11, Una Brands shrank revenue and sold assets, and Brazil''s high-rate environment raises the cost of Merama''s debt-led model.


  The recommendation is TRACK / CONDITIONAL with low-to-medium confidence, a high risk rating, and a stretched-but-not-absurd valuation stance. The current public mark can be rationalized only if the reported EBITDA is durable, converts to cash after working capital and interest, and the 2025 structure did not mask common-equity weakness through private preference terms. Until audited financials, debt terms, and brand-level economics are opened, the right posture is to monitor rather than chase.'
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'Merama''s bull case starts with the simple fact that it looks better than the median ecommerce aggregator left standing. Public sources say the company ended 2023 with more than $600 million in sales and more than $100 million in EBITDA, while management also said the results were audited by a Big Four firm and that Q1 2024 EBITDA grew more than 150% organically. If those claims survive data-room review, Merama is not a pre-profit roll-up valued on hope; it is a scaled operating company trading around a low-single-digit sales multiple and around a low-teens EBITDA multiple at the current public mark. That is not cheap for a private company with sparse disclosure, but it is also not obviously irrational relative to the reported scale.


    The second pillar is market context. Latin America remains one of the fastest-growing ecommerce regions globally: EMARKETER forecasts $191.25 billion of regional retail ecommerce sales in 2025 with the region leading global growth through 2027, while PCMI and AMI frame the broader ecommerce and payments opportunity as still compounding through 2026. Merama''s own model is more selective than first-wave aggregators in the US and Europe; it has repeatedly described a strategy of taking substantial or majority stakes in category leaders, funding working capital, and using a cross-border operating stack rather than buying hundreds of tiny Amazon listings. The Growth Supplements acquisition adds another proof point: the anchor brand alone is described as generating more than $400 million in annual sales, which would be material at group level even if the exact consolidation bridge is private.


    The anti-thesis is that Merama still has not produced the public evidence set that would justify paying through the cycle. The 2025 financing structure was mostly debt, not equity; the public valuation wording in 2025 only said the company remained above $1 billion, which is at best roughly flat and at worst below the $1.2 billion public mark from late 2021; and earlier layoffs plus a pivot toward fewer, larger brands suggest the initial expansion model needed correction. The broader category record is adverse: Thrasio filed for Chapter 11 and restructured debt, Una Brands cut revenue and sold assets in 2024 while still losing money, and Brazil''s elevated rates pressure any operator that relies on debt to fund inventory and acquisitions. Merama may be one of the category''s survivors, but the category has already shown that scale without cash conversion can destroy equity value.'
