- id: comparables-exit-readiness-and-final-asks
  title: Comparable Valuation, Exit Readiness, and Final Diligence Asks
  body: 'The comparable set for Merama has to be model-aware rather than mechanically public-market based. MercadoLibre is the cleanest public quality anchor because it is the dominant Latin American commerce ecosystem and therefore a useful proxy for the growth and logistics intensity of the channels Merama''s brands rely on, but it is not a direct valuation comp: MercadoLibre is a scaled public marketplace and fintech platform with very different capital structure, software content, and liquidity. The more relevant operating comps are category peers and adjacent roll-ups — Thrasio for downside, Una Brands for reset economics, Razor/Perch and Valoreo for ongoing consolidation, and Quinio as a smaller Latin American benchmark.


    Those comparables support a cautious exit view. Merama is not IPO-ready from public evidence because it still does not publish the financial package, cap-table terms, or brand-level disclosures that public investors would need. A strategic sale or a large private financing is more plausible in the near term than a public listing. The category has also lost some narrative premium: by 2025-2026, the market rewarded operators that proved discipline and punished those that relied on leverage and acquisition velocity alone.


    The final diligence asks are therefore specific rather than exploratory. Investors need the audited statements and EBITDA bridge, full debt documentation, a schedule reconciling all equity and debt rounds since 2021, brand-level working-capital metrics, and channel concentration by Mercado Libre, Amazon, DTC, and other marketplaces. Until those are answered, Merama remains a company worth following closely but not a valuation one can underwrite with conviction from public evidence alone.'
