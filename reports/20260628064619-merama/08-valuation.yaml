- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Audit quality failure
    - Audited statements show materially lower EBITDA or weak operating cash flow versus public narrative
    - Breaks the main support for the current public valuation
    - Move from track to avoid until a lower entry price is available
  - - Financing reset
    - Next equity round prices below the public unicorn mark or arrives alongside covenant stress
    - Signals the 2025 structure masked weaker equity demand
    - Re-underwrite on down-round terms and preference stack, not headline valuation
  - - Debt-service pressure
    - Brazil rates stay elevated and interest burden absorbs cash that was assumed to fund growth
    - Turns working-capital leverage from advantage into constraint
    - Cut valuation range and stress-test liquidity under a slower-growth case
  - - Integration miss
    - Growth Supplements fails to sustain scale or dilutes group margins after acquisition
    - Undercuts the scale-and-profitability thesis simultaneously
    - Reduce bull case and re-weight bear case probability
  - - Channel squeeze
    - Marketplace fee, logistics, or ad-cost pressure from Mercado Libre / Amazon materially compresses brand economics
    - Erodes cash conversion even if topline holds
    - Treat reported EBITDA as less durable and widen discount to public mark
  notes: Triggers focus on monitorable events that change value, not generic operating concerns.
