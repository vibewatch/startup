  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-package
    missingEvidence: Publicly available audited consolidated financial statements, brand-level revenue and EBITDA bridge, and operating cash-flow detail for Merama remain unavailable.
    whyItMatters: The recommendation depends on whether reported EBITDA is real, durable, and cash-convertible after working capital and interest.
    diligencePath: Request the Big-Four-audited statements, auditor opinion, and a brand-level bridge including Growth Supplements.
    relatedQuestionRefs:
    - QV005
    - QV021
    - QV032
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: capital-structure-terms
    missingEvidence: Liquidation preferences, ratchets, warrants, pro-rata rights, and the full common-equity waterfall for the 2025 financing are not public.
    whyItMatters: A headline valuation above $1 billion can materially overstate common-equity value when preferred protections are hidden.
    diligencePath: Obtain the term sheets, capitalization table, and post-money waterfall model from counsel and finance.
    relatedQuestionRefs:
    - QV022
    - QV032
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: debt-covenants-and-cash-conversion
    missingEvidence: Pricing, covenant headroom, collateral, and true operating cash conversion under the BTG/Citi/Itaú facility remain undisclosed.
    whyItMatters: Merama's 2025 round was mostly debt, so equity value depends heavily on debt service and liquidity resilience in a high-rate Brazil environment.
    diligencePath: Review facility agreements, treasury reporting, FX hedging policy, and monthly cash conversion by brand.
    relatedQuestionRefs:
    - QV015
    - QV016
    - QV026
    - QV032
    relatedTableRefs:
    - TV003
    - TV005
    - TV006
  - type: missing-source
    severity: moderate
    topic: comparable-coverage
    missingEvidence: Private transaction multiples and current standalone financials for Razor, Valoreo, Quinio, and Merama are largely unavailable in public.
    whyItMatters: The comparable table necessarily mixes public platform anchors, distressed precedents, and private operator snapshots rather than clean like-for-like trading multiples.
    diligencePath: Seek private investor materials or M&A data for regional operator transactions and compare on revenue, EBITDA, and debt rather than headline valuation alone.
    relatedQuestionRefs:
    - QV027
    - QV031
    relatedTableRefs:
    - TV004
