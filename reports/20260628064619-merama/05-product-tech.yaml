- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Merama solution
  - Measurable benefit proxy
  - Limitation
  rows:
  - - Select a category-leading brand partner
    - Founder searches for capital, know-how, and expansion support
    - Merama buys a stake and becomes strategic operator
    - Public model keeps founders involved while adding capital and playbooks
    - No public conversion rate from pipeline to signed partnership
  - - Expand to more channels
    - Brand adds marketplaces and DTC surfaces one by one
    - Merama layers marketplace expertise, cross-border expansion, and DTC support
    - More channels are explicitly evidenced at Mercadazo
    - No public channel-level GMV split or retention by channel
  - - Launch a new product or brand line
    - Opportunity identification, sourcing, listing, and first-customer acquisition
    - Merama says it can move from opportunity to launch quickly through operating support
    - Mercadazo reported 2-3 month launch cycles in 2021
    - No public launch economics or failure-rate disclosure
  - - Improve demand planning, pricing, and marketing
    - Brand operator relies on spreadsheets and fragmented vendor tools
    - Merama markets BI, customer segmentation, journeys, pricing, and KPI improvement
    - Company describes data-based optimization as a core lever
    - No public description of models, automation thresholds, or data freshness
  - - Operate a brand storefront
    - Consumer browses and buys on DTC site while brand manages fulfillment and service
    - Portfolio sites such as Mercadazo and Oceane keep direct-to-consumer touchpoints live
    - Brand can own merchandising and customer relationship instead of only marketplace shelf space
    - User experience quality varies by brand, with Oceane reviews noting app gaps and some stockouts
  - - Manage trust issues and complaints
    - Consumer needs delivery, refund, or support resolution
    - Brand-level service teams respond through storefront and complaint channels
    - Growth shows strong resolution metrics on Reclame Aqui
    - Public trust evidence is brand-by-brand rather than standardized at Merama holdco level
  notes: This workflow table mixes founder, operator, and end-customer jobs because Merama sells a brand-operating workflow rather than a single end-user SaaS seat.
