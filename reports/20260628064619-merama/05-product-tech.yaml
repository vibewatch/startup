- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Strategic partnership + ownership stake
    - Brand founders
    - Live and core since launch
    - Founder stays in seat while Merama adds capital and operating support
    - No public standard term sheet, control rights, or post-deal operating cadence disclosed
  - - Working capital and inventory support
    - Brand operator / finance lead
    - Live and repeatedly described in 2021 and 2025 sources
    - Lets portfolio brands fund inventory and growth without relying only on dilution
    - No public visibility on underwriting logic, repayment structure, or concentration by brand
  - - Marketplace expansion playbook
    - Brand GM / ecommerce lead
    - Mature and repeatedly evidenced
    - Explicit know-how across Amazon, Mercado Libre, Shopee, and other channels
    - Merama does not publish channel connectors, API abstractions, or marketplace-specific SLA metrics
  - - DTC storefront operation
    - End customer / brand team
    - Live via portfolio sites such as Mercadazo
    - Lets Merama-owned brands keep direct storefront control alongside marketplace sales
    - Public evidence is brand-specific rather than holdco-wide, so consistency across the portfolio is unclear
  - - Marketing, BI, pricing, and demand-planning support
    - Brand operator / growth team
    - Live and central to value proposition
    - Combines operator know-how with data-driven decision support
    - No public KPI dashboard definitions, data model, or attribution methodology disclosed
  - - Product incubation / launch engine
    - Brand operator / category lead
    - Operational but publicly under-documented
    - Merama says it can identify and launch hundreds of new items at low cost
    - No public success-rate, launch failure-rate, or time-to-scale disclosure beyond anecdotal examples
  - - Independent business-unit holdco model
    - Portfolio CEOs / Merama leadership
    - Current 2025 operating stance
    - Narrower focus on six stronger brands reduces sprawl versus broad roll-up peers
    - Exact governance split between central Merama and each business unit is not public
  notes: Rows reflect public operating modules and assets; Merama does not publicly document the underlying internal software modules in equivalent detail.
