- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Publicly evidenced role
  - Dependency
  - Risk
  rows:
  - - Merama holdco operating layer
    - Allocates capital, selects brands, and pushes common playbooks
    - Central leadership and business-unit coordination
    - Public sources do not disclose operating-system internals or service ownership boundaries
  - - Brand DTC surfaces
    - Mercadazo and other brands provide direct merchandising and purchase surfaces
    - Brand storefront software, support, fulfillment, and catalog ops
    - Quality consistency differs across brands and public stack details are sparse
  - - Marketplace execution layer
    - Portfolio brands sell on Amazon, Mercado Libre, Shopee, and other channels
    - External marketplace rules, search/ranking, seller auth, and listing standards
    - Any policy or API change on key channels can disrupt merchandising and fulfillment flows
  - - Marketplace developer interfaces
    - Amazon SP-API and Mercado Libre APIs enable listing, inventory, pricing, and app workflows
    - Third-party API schemas, permissions, and rate limits
    - Merama does not disclose whether it built reusable middleware or per-brand integrations
  - - Data and product-incubation layer
    - Merama says it uses a data-intelligence platform to identify and launch low-cost new items
    - Internal analytics, catalog operations, and research inputs
    - No public evidence on model quality, data rights, or launch economics
  - - Working-capital and inventory layer
    - Capital supports inventory, product innovation, and expansion
    - Debt/equity providers plus supply and logistics execution
    - Capital discipline and inventory turns are critical but not publicly quantified by brand
  - - Privacy and customer-service layer
    - Legal disclosures and complaint channels handle data rights and service issues
    - Merama privacy program and each brand’s support stack
    - Public evidence favors legal and service surfaces over technical security assurance
  notes: This is an operating-architecture table synthesized from channel disclosures, marketplace docs, and brand surfaces; Merama does not publish a code-level systems diagram.
