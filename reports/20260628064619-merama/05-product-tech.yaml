chapter:
  number: 5
  title: Product & Technology
  summary: 'Merama''s delivered product is best understood as a brand-operating system: minority/majority brand partnerships, working capital, channel expansion, product incubation, and brand-level operating playbooks layered across marketplaces and owned storefronts. Public evidence verifies current focus on six core brands and explicit dependence on Amazon, Mercado Libre, Shopee, and DTC surfaces, but reviewed sources do not disclose Merama-owned API docs, status pages, release notes, or third-party security attestations. The result is an operating model with real commercial breadth and visible consumer-quality signals, but only partial public transparency on the internal software stack.'
sections:
- id: brand-operating-system-and-deliverable
  title: What Merama actually delivers to brands
  body: 'Public sources consistently show that Merama is not selling a single consumer app or a thin financial wrapper. It is selling a strategic operating package to leading ecommerce brands: equity partnership, working capital, cross-border expansion, marketing and BI support, product/category expansion, and proprietary tools intended to automate parts of the operating workflow. That package sits between brand founders and end channels. The founder keeps running the business, while Merama adds capital, channel know-how, and centralized playbooks. The most concrete customer-visible proof is Mercadazo, where the public storefront shows active category breadth, while third-party reporting ties Merama to rapid brand launches, channel expansion, and product incubation. The strongest evidence is therefore at the workflow and brand-asset level, not at the internal code or infrastructure level. Public evidence also suggests the product is modular: capital, channel expertise, and operating playbooks
    can be applied unevenly by brand, which is helpful for flexibility but hard to benchmark from outside the portfolio.'
