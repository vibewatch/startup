- id: operating-architecture-and-platform-dependencies
  title: Operating architecture and external platform dependencies
  body: 'The reviewed public surface supports an operating-architecture reading more than a software-architecture reading. Merama clearly orchestrates brands across external marketplaces, owned storefronts, product launch workflows, and working-capital-backed inventory turns, and its public materials explicitly reference Amazon, Mercado Libre, Shopee, and DTC expansion. Amazon''s Selling Partner API and Listings Items API, plus Mercado Libre''s developer portal, show that these channels expose real programmatic surfaces around listings, inventory, pricing, and app security. That matters because a portfolio company scaling across those channels must comply with external authentication, schema, moderation, and rate-limit rules even if Merama never discloses its own internal stack. Public evidence is therefore strong on dependency topology and weak on Merama-owned services: the company does not publish its own API docs, status page, release notes, or named security certifications in the reviewed
    sources. In other words, Merama looks like an orchestration layer above many external systems rather than a vertically transparent full-stack software company in the public record.'
  claimRefs:
