- id: maturity-roadmap-and-business-unit-shift
  title: Maturity, roadmap, and the shift from aggregator to brand holdco
  body: 'Merama looks more mature as an operator than as a public software platform. The public record shows an evolution from 2021''s selective-partnership thesis toward a 2025 structure focused on six larger brands, more independent business units, and M&A only within existing vertical platforms. Growth Supplements is the clearest current roadmap marker: Merama-backed coverage ties the brand to more items, production, logistics capacity, and possible international expansion. Contxto''s reporting also suggests Merama is no longer presenting itself primarily as a centralized aggregator, but as a holdco optimizing a smaller set of stronger assets. What is missing is software-release-level maturity evidence. The roadmap is visible through acquisitions, brand concentration, and capital-allocation shifts, not through product changelogs, uptime histories, or engineering release notes. That makes maturity real at the portfolio-management level, but still only partially verified at the software-delivery
    level.'
