  title: Platform concentration and architecture opacity are the main technical risks
  body: Merama is clearly dependent on Amazon, Mercado Libre, Shopee, and brand storefronts, yet its own public surface does not disclose internal APIs, release discipline, status history, or independent security certifications. Dependency risk is visible; internal mitigation is not.
