callouts:
- calloutType: strength
  title: Merama has a real operator product, not just a financing wrapper
  body: 'The public evidence consistently shows a repeatable operating package: capital, channel expansion, product incubation, demand-planning support, and founder-retained brand operation. That is a stronger and more defensible product proposition than simple roll-up arbitrage.'
  claimRefs:
  - CE001
  - CE003
  - CE007
  - CE033
