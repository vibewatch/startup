  topStrengths:
    - 若公司所称 2023 年销售额超过 US$600 million、EBITDA 超过 US$100 million 得到验证，Merama 就是少数真正有规模、且据报盈利的聚合器式运营商。
    - 公司已从分散收购转向更聚焦的组合，Growth Supplements、Mercadazo、Océane 等品类龙头成为核心锚点。
    - Merama 的运营模型不只是财务工程，而是把资本、自研 BI 和 marketplace 工具、国际扩张支持、营运资本管理打包在一起。
    - 股东背书仍有分量，覆盖 SoftBank Latin America Fund、Advent International、Balderton、Monashees、Valor 和 Marcel Telles。
    - Merama 切入拉美两大电商市场；只要执行和整合不失控，这个市场位置就有平台价值。
  topRisks:
    - 公开披露仍然太薄：没有经审计合并报表、没有品牌级收入桥、没有股权结构瀑布，也没有公开债务 covenant 包。
    - 模型越来越依赖债务融资；2025 年规模更大的雷亚尔计价授信，在高 Selic 环境下抬高再融资和利率风险。
    - 收入看起来集中在少数品牌，尤其是 Growth Supplements；分销又集中在 Merama 不控制的 marketplace 渠道。
    - 全球同类先例很差：Thrasio 式聚合器在杠杆、整合复杂度与更紧的利率和需求周期相撞后，大量股权价值被打没。
    - 多国消费者、隐私和电商合规义务增加法律与执行负担；公开材料还看不到公司充分披露控制体系或事故历史。
  unresolvedGaps:
    - 四大审计的合并报表，以及逐品牌收入、利润率和所有权桥。
    - 当前现金、烧钱速度、现金跑道、covenant 包，以及 BTG/Citi/Itaú 债务工具的到期时间表。
    - 一张对账后的股权结构表，区分新增融资和再融资债务，并展示当前优先股堆叠经济性。
    - 品牌级留存、复购、活跃客户和队列数据，尤其是 Growth Supplements、Mercadazo 和 Océane。
    - 渠道级 marketplace 经济性，以及 Merama 对 Mercado Libre 和 Amazon sell-through 依赖度的清晰衡量。
