companyProfile:
  summary: >-
    Quantum Space is a U.S. orbital-mobility and space-defense company building Ranger, a
    maneuverable spacecraft platform designed for national-security, civil, and commercial missions
    across GEO and beyond. The company is positioning Ranger as mobility infrastructure rather than
    a single-mission satellite, with public emphasis on large storable propellant capacity,
    refuellability, modularity, and long-endurance operations. Quantum's strongest public traction
    is in government channels including U.S. Space Force, Department of War, DARPA, and AFRL-linked
    programs, while its announced SPAC and PIPE financing are meant to fund the transition from
    development-stage hardware to flagship proof and scaled production.
  founders:
    - name: Kam Ghaffarian
      role: Executive Chairman and Co-founder
      background: Co-founder of Axiom Space and X-Energy; repeat space entrepreneur and chairman.
      claimRefs: [CO011, CO016, CO017]
    - name: Jim Bridenstine
      role: CEO
      background: Former NASA Administrator, former U.S. Navy aviator, and former Oklahoma Congressman.
      claimRefs: [CO012, CO014]
  headquarters: Rockville, MD
  productSummary: Ranger is a maneuverable spacecraft platform with 4,000+ kg propellant capacity, single-fuel multi-mode propulsion, and a refuellable modular architecture for multi-orbit operations.
  customerFocus: U.S. government and national-security agencies first, with longer-term commercial satellite-servicing and life-extension opportunities.
  businessModel: Government contracts and mission services for orbital mobility, refueling, servicing, payload hosting, and related space-domain operations; commercial expansion remains earlier-stage.
  stage: SPAC (pre-close)
