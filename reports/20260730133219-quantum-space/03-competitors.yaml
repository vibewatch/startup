    {
      "id": "capability-comparison-and-buyer-choice",
      "title": "Capability comparison and buyer choice",
      "body": "Buyer choice in this market is driven less by generic 'space' competition than by the exact mission to be solved. If a customer needs proven commercial GEO life extension, Northrop is the highest-credibility benchmark in the retrieved set. If the problem is refueling readiness and interface standardization, Orbit Fab exerts outsized influence because RAFTI is flight-qualified, sold as an open-license interface, and already tied into multiple missions. If the mission is GEO servicing with a sustainability overlay, Astroscale presents the broadest non-incumbent package, spanning LEXI life extension, Orbit Fab refueling integration, and ELSA-M debris-removal heritage. Starfish competes by lowering integration burden through docking on satellites that were never designed for servicing. Impulse competes where speed, maneuver, and last-mile or high-energy delivery matter more than long-duration station-keeping. Momentus competes for orbital transport and hosted-payload use cases, though its public posture remains earlier-stage. The practical result is that Quantum must win by proving that Ranger can collapse several of these mission categories into one platform without giving up credibility on any of them. That is strategically attractive, but it also means Quantum is compared against the best specialist in each sub-problem rather than against an average peer.",
