    {
      "id": "moat-durability-and-adverse-evidence",
      "title": "Moat durability and adverse evidence",
      "body": "The strongest adverse evidence is that public competition is already specialized while public proof remains uneven. Northrop has flown and serviced commercial GEO assets, but many others are still in future-dated or demonstration-heavy phases. Orbit Fab has the clearest interface-standard position, yet that success could commoditize fueling access for mission primes rather than guarantee Orbit Fab itself wins the end-service relationship. Astroscale and ClearSpace show that sustainability, life extension, and debris-removal budgets can blur together, meaning Quantum may find adjacent competitors showing up in its opportunity set even when they do not market identical spacecraft. Pricing visibility is also weak. Full-service mission economics are still largely quote-led, which limits clean benchmarking and suggests buyers may continue to multi-home until operational results separate the field. Quantum's likely moat therefore does not come from a lack of alternatives. It comes, if at all, from integrating high propellant capacity, mission flexibility, customer intimacy, and procurement credibility faster than specialists can converge around shared standards. That is possible, but the public evidence today supports a nuanced view: Quantum may have a broader architecture than many peers, yet it is entering a market where specialists already own important trust anchors and where substitution risk remains meaningful.",
