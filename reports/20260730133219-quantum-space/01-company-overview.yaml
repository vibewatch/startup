company:
  name: Quantum Space
chapter:
  number: 1
  title: Company Overview
  summary: Quantum Space is a pre-close SPAC target building the Ranger orbital-mobility platform for defense-first missions beyond low Earth orbit. The company combines a high-profile national-security leadership team with early government traction, but its flagship spacecraft remains in development and its route to scaled production, contracted revenue realization, and public-market execution still depends on future capital and program conversion.
sections:
- id: identity-stage-product
  title: Identity, footprint, and product thesis
  body: 'Quantum Space, LLC presents itself as a U.S. space-defense and orbital-mobility company organized around Ranger, a maneuverable spacecraft platform intended to operate across LEO, MEO, GEO, and cislunar space. Primary-source transaction materials place the company''s engineering and mission-development center in Rockville, Maryland, its propulsion and integration test facility in Hawthorne, California, and a satellite manufacturing center in development in Tulsa, Oklahoma. The product story is defense-first: Ranger is marketed as a single-fuel, multi-mode spacecraft with more than 4,000 kilograms of storable propellant, modular and refuellable architecture, and up to 15 years of operational life. Investor materials repeatedly note that Ranger is still a design concept in development rather than an operational product, so the current diligence question is not whether the product narrative is compelling, but whether the team can convert concept advantages into a flight-proven platform quickly enough to capture the current defense demand window.'
