    "number": 4,
    "title": "Financials",
    "summary": "Quantum Space's public financial case is built almost entirely on management projections and transaction financing rather than on disclosed historical operating results. The available materials show a contract-driven hardware-and-services model with projected 2026-27 revenue growth, modest gross margins, large EBITDA losses, and heavy dependence on the SPAC trust plus a structured preferred PIPE to fund production, facilities, and continued product development."
  },
  "sections": [
    {
      "id": "revenue-model-and-traction-quality",
      "title": "Revenue model and traction quality",
      "body": "Quantum Space's public materials point to a project- and contract-driven aerospace revenue model rather than to anything resembling recurring software revenue. Management's disclosed projections show revenue of $23.646 million in 2026 and $60.633 million in 2027, with the investor presentation saying those numbers reflect contracted backlog plus a probability-weighted pipeline based on management estimates. That framing matters. It suggests the early revenue engine is expected to come from a mix of existing contracts, proposal conversion, milestone execution, and new awards rather than from a large installed recurring base. Public sources also show six contracts and pending proposals across government agencies and a broader unweighted pipeline of roughly $5.2 billion, but none of that should be mistaken for realized revenue quality. No public source in the retrieved pack discloses ARR, booked backlog dollars, revenue concentration by customer, milestone acceptance terms, or how much of the projected 2026 revenue is already contracted versus merely probability-weighted. The top-line story is therefore directionally plausible for a government-led space company, but still weakly evidenced from a classic underwriting perspective because the key bridge from pipeline to recognized revenue remains mostly management-described rather than independently verified.",
