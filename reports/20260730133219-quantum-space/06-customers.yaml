    "title": "Customers",
    "summary": "Quantum Space's customer evidence is strongest in U.S. government and national-security channels, where the company cites contracts, contract vehicles, and pending proposals tied to mobility, servicing, and cislunar missions. The public record shows meaningful procurement traction, but it still offers limited proof on revenue concentration, repeat usage, retention, or production-scale commercial deployment."
