    {
      "id": "named-customer-proof-and-adoption-quality",
      "title": "Named customer proof and adoption quality",
      "body": "The best public proof comes from named government relationships, not from broad user counts. Quantum says it has six contracts and pending proposals across the U.S. Space Force, Department of War, DARPA, and AFRL. Specific examples include the Andromeda IDIQ vehicle, a Department of War OECIF fuel-depot contract, DARPA's LASSO selection, a Space Development Agency servicing contract, and a joint-venture STEP-2.0 award. Each of these signals adoption, but each also needs to be read carefully. Andromeda proves eligibility on an important vehicle but does not prove funded backlog because Quantum itself says no specific funding allocation has yet been assigned. The OECIF and LASSO awards indicate mission-level relevance for refueling and cislunar operations, but they still look like capability-building engagements rather than scaled recurring service revenue. The Space Development Agency and STEP-2.0 announcements add additional national-security customer proof, yet public outcomes remain mostly qualitative. This is still useful evidence because it shows real procurement surfaces and real named buyers. However, it is not the same as proof of repeat production deployment, diversified commercial usage, or durable retention. Quantum has named-customer traction; it does not yet have public customer-depth transparency.",
