  "sections": [
    {
      "id": "customer-base-and-segmentation",
      "title": "Customer base and segmentation",
      "body": "Quantum's public customer base is best viewed as a government-first funnel with adjacent commercial ambition. The press release, investor materials, and later company posts consistently place the U.S. Space Force, the Department of War, DARPA, AFRL, and related national-security organizations at the center of the buyer map. Those agencies are not only users but also the main near-term payers, because the product still sits in a proof-building phase where contract vehicles, demonstrations, and mission awards matter more than self-serve demand. Around that core, Quantum also markets life-extension and servicing solutions to commercial satellite operators, payload-hosting concepts to broader mission owners, and cislunar capabilities to defense and exploration programs. The segmentation logic is therefore clear: government buyers fund mission readiness, while commercial operators represent a second-wave monetization path if Ranger and its servicing architecture prove operationally reliable. The weakness is equally clear. Public sources do not disclose revenue by customer, funded amount by program, or any denominator showing how much of the forecast depends on one or two agencies. This means the customer base looks strategically attractive but still potentially concentrated.",
