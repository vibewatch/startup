    {
      "id": "customer-verdict",
      "title": "Customer verdict",
      "body": "The customer verdict is better than a typical pre-launch hardware story but not yet robust enough for high-confidence adoption underwriting. Quantum has real named government counterparties, real mission-aligned contract surfaces, and enough public specificity to show that the company is not prospecting abstractly. It is already inside the national-security demand stack that most orbital-mobility startups want to reach. That is a genuine strength. The limitation is that the public record still blurs together funded contracts, pending proposals, vehicle eligibility, future service offerings, and large pipeline narratives. Commercial customer proof is especially thin. The life-extension launch announcement demonstrates go-to-market intent, not production customer validation. Retention data is absent. Concentration exposure is likely meaningful. And several customer relationships are best interpreted as early capability-development pathways rather than steady-state operating accounts. A fair conclusion is that Quantum has credible government adoption surfaces and a plausible expansion path, but investors still need a contract-by-contract bridge from procurement proof to durable revenue and repeat usage before treating customer traction as de-risked.",
