  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局与产品命题
        blocks:
          - type: paragraph
            body: >-
              Quantum Space, LLC 将自己定位为一家美国太空防务和轨道机动公司，核心是 Ranger：一个计划覆盖 LEO、MEO、GEO
              和地月空间的可机动航天器平台。第一手交易材料显示，公司的工程和任务开发中心位于马里兰州 Rockville，推进和集成测试设施位于加州 Hawthorne，俄克拉荷马州 Tulsa
              的卫星制造中心仍在建设。产品叙事首先面向防务：公司把 Ranger 推介为单燃料、多模式航天器，搭载超过 4,000 kg 可贮存推进剂，采用模块化、可补加燃料架构，作业寿命最长可达 15
              年。投资者材料反复提示，Ranger 仍是开发中的设计概念，不是已投入运行的产品。因此，当前尽调问题不在于产品叙事是否足够吸引人，而在于团队能否足够快地把概念优势变成经飞行验证的平台，吃到这一轮防务需求窗口。
