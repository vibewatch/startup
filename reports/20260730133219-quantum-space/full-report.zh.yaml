            title: Quantum 追的是更大未来市场中的防务主导切口
            body: >-
              未来几年能合理为 Quantum 付费的市场，不是整个轨道经济，而是防务、GEO 服务和转移用例中的一个子集：这些客户已经感受到有限推进剂、轨道不灵活或突发风险带来的痛点。这个切口仍然有吸引力，但不应和公司完整的
              $100 billion 叙事混为一谈。
            calloutType: insight
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM018
              - CM036
          - type: callout
            title: 标准和赋能基础设施终于开始出现
            body: >-
              最有建设性的市场变化，是真实赋能层开始出现：RAFTI 作为补加燃料接口，ModProp 作为模块化补加燃料架构，Andromeda 和 SpaceWERX 作为需求塑造者，Northrop 已有 GEO
              服务任务。这些因素共同降低了一个风险：Quantum 不是在向纯理论市场销售。
            calloutType: strength
            claimRefs:
              - CM013
