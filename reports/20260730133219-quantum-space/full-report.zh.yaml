      - number: '3.2'
        title: 能力对比与买方选择
        blocks:
          - type: paragraph
            body: >-
              这个市场的买方选择，不是由泛泛的“太空”竞争决定，而是由具体任务决定。如果客户需要已验证的商业 GEO 寿命延展，Northrop 是检索样本中可信度最高的基准。如果问题是补加燃料就绪和接口标准化，Orbit
              Fab 影响力超出自身规模，因为 RAFTI 已通过飞行资格认证，以开放许可接口销售，并已接入多个任务。如果任务是带可持续叙事的 GEO 服务，Astroscale 给出最完整的非在位者组合，横跨 LEXI
              寿命延展、Orbit Fab 补加燃料集成和 ELSA-M 碎片清除积累。Starfish 通过对接本来没有按服务设计的卫星，降低集成负担。Impulse
              在速度、机动、末端交付或高能轨道交付比长期定点驻留更重要的场景竞争。Momentus 争夺轨道运输和托管载荷用例，尽管其公开姿态仍较早期。实际结果是，Quantum 必须证明 Ranger
              能把多个任务类别压进一个平台，同时不在任何类别上牺牲可信度。这在战略上有吸引力，但也意味着 Quantum 会被拿来和每个子问题里的最佳专业公司相比，而不是和一个平均同行相比。
