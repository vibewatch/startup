      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              公开信息下，Quantum
              的财务故事只能作为有条件的前瞻模型来投资，而不是已证明的运营记录。公司有一个看似合理的合同驱动收入叙事，一套可信的名义融资方案，公开预测至少承认毛利率有限和持续亏损，而不是展示一条无摩擦的曲棍球杆曲线。但尽调阻断项很重：没有公开历史收入桥接，没有披露在手现金，没有客户集中度表，没有积压对账，没有合同毛利披露，没有清晰资本开支计划，也没有
              CAC 或回收期框架。反向证据也重要。预测于 2026 年 5 月为投资者评估准备，不是公开指引，未经审计，且不包括业务合并费用。SPAC
              赎回可能减少可用信托现金。优先股和认股权证层增加摊薄和资本结构复杂性。公开风险语言还称，Ranger
              截至目前尚未制造、运行或销售，意味着很大一部分预测仍压在广泛证明之前的执行里程碑上。因此，正确的财务结论是“有意思，但高度依赖融资”：Quantum
              可能有足够资本尝试建设，但当前公开记录还不足以让人高信心承销收入质量、利润率耐久性或真正的交割后跑道。
