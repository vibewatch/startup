  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与最接近的重叠
        blocks:
          - type: paragraph
            body: >-
              相比多数同行，Quantum Space 的公开定位异常宽。公开材料把 Ranger 平台包装成一个面向国家安全、民用和商业任务的可机动、可补加燃料航天器，覆盖 LEO、MEO、GEO
              和地月空间。在检索到的竞争样本中，没有一家公司完全复制这种宽度。最接近的竞争压力来自一组更窄但更成熟的替代方案。Northrop Grumman 的 SpaceLogistics 业务是 GEO
              寿命延展和在轨服务最强的在位类比，因为它已经有商业在轨服务证明。Orbit Fab
              不是完整任务主承包替代者，但正在成为最可见的补加燃料接口和推进剂基础设施标准制定者，可能让其他服务商汇聚到共同燃料架构。Astroscale 位于两者之间，拥有 LEXI 寿命延展雄心、补加燃料合作和
              ELSA-M 末寿服务积累。Starfish 提供更轻量的寿命延展和处置路径。Impulse 与 Momentus 更偏轨道运输和机动。ClearSpace
              通过主动碎片清除争取服务相邻预算。承销结论是，Quantum 面对的不是一个镜像竞争者，而是一个由专业公司组成的模块化生态，加上传统替代路径——发射替换卫星。
