      - number: '8.2'
        title: 正论点、反论点与价格纪律
        blocks:
          - type: paragraph
            body: >-
              正面论点很直接。Quantum
              切入的是一组具有战略重要性的问题；作为仍未上市的公司，它在政策和防务信用上异常强；公司试图打造一套机动平台，服务多个任务类别，而不是一个狭窄用例。政府牵引足够真实，值得认真看；如果交割干净落地，融资组合可以为去风险争取一段有意义的窗口。反面论点同样重要。公司在旗舰平台层面仍未完成验证；公开收入故事仍倚赖预测和管线框架；客户集中度高；轨道服务市场仍处早期。这些事实让建议对价格敏感。同样任务前景下，更低入场价可以支撑更积极的态度，但已宣布估值已经计入不少未来成功。投资人要决定的不是
              Quantum 是否有意思，而是愿意为多少未验证风险付钱。基于今天的公开证据，更合理的是纪律，而不是高喊买入。
