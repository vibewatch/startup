      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              轨道机动的近期买方并不是大众商业市场，而是一组持有昂贵资产、且资产位于难抵达轨道的集中型机构。太空军、DARPA、AFRL 及其他防务组织显然是韧性、机动、检查和后勤能力的主要付款方，Andromeda 载体和
              SpaceWERX 轨道后勤挑战都说明了这一点。商业 GEO
              运营商构成第二个有意义的客群，因为当替代卫星昂贵且轨道槽位稀缺时，他们已经理解寿命延展和补加燃料的商业逻辑。第三类是需要轨道转移、托管服务或碎片清除支持的载荷所有者和基础设施开发者。采用必须分阶段推进：运营商先要相信交会与近距离操作，再相信对接和燃料转移标准，最后才会接受常态化多任务后勤。这个顺序很关键，因为
              Quantum 进入的是一个技术资格认证与客户行为改变不可分割的市场。
