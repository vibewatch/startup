      - number: '2.4'
        title: 约束、相互矛盾的估算与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              乐观市场叙事仍被运营现实约束。GAO 称，机器人 ISAM 只在少数任务中得到演示，标准仍不清晰，在轨测试机会稀缺；在服务成为常态之前，用户不愿为可服务性买单。Payload
              从产业参与者处得到的反馈大体相同：多数合同仍是定制化、政府主导，商业客户还在等待时间表和价格确定性，整个领域很大程度上仍卡在把 RPO 变成日常任务。Quantum
              市场框架的核心矛盾也由此出现。长期轨道基础设施叙事可能方向正确，但近期需求更窄，由采购驱动，并高度依赖少数演示项目证明安全性、经济性和可得性。尽调时，应把 Quantum
              今天真正的市场看作更大理想化轨道服务叙事中的防务主导切口，而不是整个轨道经济同步迈向常态化补加燃料和多轨道后勤。
