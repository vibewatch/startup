  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模口径
        blocks:
          - type: paragraph
            body: >-
              Quantum Space 自己的材料定义了一个很大的机会集：设计、发射并运营横跨所有轨道的可机动航天器；适配 Ranger 平台的可服务任务对应 $8 billion SAM、$1 billion
              SOM，并嵌在其宣称的 2031 年 $100 billion 年化 TAM 里。这个框架有战略价值，因为它把补加燃料、寿命延展、轨道运输、检查和数据服务用例都装进去，而不是把 Ranger
              当成单一卫星项目。但它也比多数独立市场研究宽得多。The Business Research Company 估算，在轨制造、服务和运输合计市场 2026 年为 $2.6 billion，2030 年为
              $5.23 billion；GAO 则把 ISAM 视为一类赋能能力，而不是一个已被证明的大市场。因此，正确的承销结论不是说 Quantum 的 TAM
              错了，而是它内含相邻赛道和未来状态假设，必须和近期可变现需求拆开看。
