  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与资本结构风险
        blocks:
          - type: paragraph
            body: >-
              第一组风险卡在交易机制、披露姿态和资本充足性之间。截至本次报告日期，Quantum 仍是尚未完成交割的 SPAC 标的，因此公开估值和资产负债表故事仍取决于交割、赎回、融资落地以及常规交易审批。投资人演示和相关
              8-K 材料在零赎回、大额可转债 PIPE 的假设下呈现资金充裕的图景，但这些假设本身也带来执行敏感性：如果信托资金下降、交割时间延后，或 PIPE 条款在实践中更摊薄，Ranger、Tulsa
              和后续任务准备可用的跑道都会明显改变。法律与披露风险同样重要，因为公开叙事很大一部分靠预测、管线表述和前瞻里程碑，而不是已经交付的运营历史。这不意味着不当行为；它意味着投资人是在为一项雄心很大的国防太空建设买单，而历史现金生成证明有限。落到实处，核心问题是融资确定性能否跑在硬件和任务烧钱之前。若不能，项目节奏、供应商承诺和招聘计划会同时被压缩。
