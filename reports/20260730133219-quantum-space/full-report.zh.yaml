  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户任务
        blocks:
          - type: paragraph
            body: >-
              Quantum Space 卖的不是通用卫星平台。它的公开材料始终把 Ranger
              描述为一个可机动轨道平台，能为防务、民用和商业用户执行太空域态势感知、补加燃料、卫星寿命延展、载荷托管、轨道调整和地月空间作业。这一点很重要，因为产品更应被理解为机动基础设施，而不是单一任务航天器。放进客户工作流里看，Ranger
              应该让运营商把持久资产放入有价值或有争夺的轨道，反复重新定位，托管载荷，为其他资产补加燃料或延寿，并最终支持更大的后勤架构。因此，价值主张是一组组合拳：更大的机动余量、更长的任务寿命、燃料耗尽时更少替换卫星需求，以及一条走向
              LEO 之外持续在轨作业的路径。Quantum
              自己的页面反复把这种定位称为从固定架构转向动态太空作业的回应。好处是客户任务非常清晰；缺点是，同样的宽度提高了证明负担，因为买方必须相信的不只是飞行器，还包括横跨多个任务类型的运营模型，而不是一个窄任务。
