      - number: '5.2'
        title: 架构、推进与产业基础
        blocks:
          - type: paragraph
            body: >-
              技术故事的核心是推进和能源管理。投资者演示和后续公司更新把 Ranger 描述为单燃料、多模式系统，旨在把高推力机动和高效率持续作业结合起来。Quantum 收购 Phase Four 的多模式推进资产和 Los
              Angeles 集成测试设施，以此强化这套叙事，并称资产收购能同时加快机动性能和可制造性。公开描述还强调，Ranger 拥有同级最大之一的可贮存燃料容量，超过 4,000 kg，采用模块化载荷架构，作业寿命最长
              15 年。围绕这台飞行器核心，Quantum 正在搭建分布式产业布局：Rockville 负责工程和任务运营，Hawthorne/Los Angeles 负责推进集成和测试，Tulsa
              负责规模化制造。架构逻辑是连贯的。单一推进剂系统和大量机载储备提升任务灵活性；模块化载荷空间拓宽用例；多地产业能力降低对单一地点单一功能的依赖。但不能把这些特征误认为已完成的运营证明。在 Ranger Prime
              和后续任务完成在轨验证之前，它们仍是设计和扩张主张。
