              Quantum 的公开客户基础，最好看作一个政府优先漏斗，旁边带有商业野心。新闻稿、投资者材料和后续公司帖子始终把美国太空军、美国战争部、DARPA、AFRL
              及相关国家安全组织放在买方地图中心。这些机构不只是用户，也是近期主要付款方，因为产品仍处于构建证明阶段，合同载体、演示和任务授标比自助式需求更重要。围绕这个核心，Quantum
              还向商业卫星运营商推介寿命延展和在轨服务解决方案，向更广泛任务所有者推介载荷托管概念，并向防务和探索项目推介地月能力。因此，分群逻辑很清楚：政府买方为任务就绪买单；如果 Ranger
              及其服务架构证明运营可靠，商业运营商就是第二波变现路径。弱点同样清楚。公开来源没有披露按客户划分的收入、按项目划分的已获资金，或任何能说明预测有多少依赖一两个机构的分母。这意味着客户基础在战略上有吸引力，但仍可能集中。
