          - type: callout
            title: 商业规模化仍取决于证明、价格和可重复性
            body: >-
              GAO 和行业来源一致认为，该行业还没有常态化。多数合同仍是定制的，许多卫星从设计上就不支持服务，标准和测试机会也不完整。如果 Quantum
              假设市场成熟速度快于这些摩擦缓解速度，它的收入节奏和产能计划可能跑在真实需求前面。
