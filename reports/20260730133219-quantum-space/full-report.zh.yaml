        blocks:
          - type: paragraph
            body: >-
              Quantum 的资本叙事同时呈现出表面充裕和明显依赖。公开交易材料宣传，在无赎回假设下约有 $253 million 信托现金，加上一笔按每股 $12 定价的 $300 million 可转换
              PIPE，意味着交易泄漏前名义总资金来源约 $553 million。不过，这笔融资并不是普通普通股。6 月 12 日交易文件描述了约 $240 million Series A 优先股投资，以及约 $60
              million 预付 Series B 证券；两者都配有认股权证结构，以及股息或优先回报特征。SPAC IPO
              招股书也强调标准赎回权、创始人股份摊薄、递延承销佣金，以及未来融资价格可能低于公众股东有效价格的可能性。与此同时，预测本身明确假设业务合并提供足够资本资源，且不计入交易成本。这意味着公开口径的上行只有在三件事同时发生时才成立：赎回没有摧毁信托贡献，PIPE
              按结构交割，产品和制造执行没有消耗超过模型的资本。现有证据因此支持一个平衡判断：如果交易大体按公告完成，Quantum
              可能拥有足够总资本来支撑近期扩张；但起始现金、交易成本、优先股累积和真实交割后投资节奏仍不透明，公开信息无法精确验证跑道。
