  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与牵引质量
        blocks:
          - type: paragraph
            body: >-
              Quantum Space 的公开材料指向项目和合同驱动的航天收入模型，而不是任何接近经常性软件收入的东西。管理层披露的预测显示，2026 年收入为 $23.646 million，2027 年为 $60.633
              million；投资者演示称，这些数字反映已签合同积压，加上基于管理层估算的概率加权管线。这个框架很关键。它说明早期收入引擎预计来自现有合同、提案转化、里程碑执行和新授标的组合，而不是庞大的已安装经常性基础。公开来源还显示，公司有六份合同和跨政府机构的待决提案，以及约
              $5.2 billion 的更大未加权管线，但这些都不应被误认为已实现收入质量。检索样本中没有任何公开来源披露 ARR、已签积压金额、按客户划分的收入集中度、里程碑验收条款，或预测 2026
              年收入中已有多少已签约、多少只是概率加权。因此，顶线故事对一家政府主导的太空公司而言方向上可信，但从经典承销角度看证据仍弱，因为从管线到确认收入的关键桥梁主要由管理层描述，而非独立验证。
