      - number: '2.3'
        title: 增长驱动与赋能基础设施
        blocks:
          - type: paragraph
            body: >-
              多个公开信号显示市场确实在拉动。第一，国家安全需求正在升温：SSC 和 SpaceWERX 已明确要求产业提供轨道仓储、推进剂分配、可复用转移飞行器、维修概念，以及覆盖 LEO、GEO
              和更远区域的后勤网络。第二，赋能技术正从概念走向标准。Orbit Fab 将 RAFTI 接口推介为开放许可、TRL 8 的补加燃料接口；AFRL 的 ModProp
              工作正在为持续机动标准化模块化推进和补加燃料概念；DARPA 的 RSGS 项目持续让 GEO 服务操作正常化。第三，相邻商业供给正在增加。Northrop Grumman 已经证明付费 GEO
              寿命延展服务可以在轨运行；Astroscale 正用 Orbit Fab 补加燃料布局 LEXI；Starfish 销售轻量级寿命延展和处置；Momentus 提供在轨运输；Impulse
              推介面向高能轨道的快速交付。合起来看，市场并非假想；它正围绕防务资金推动的能力成熟，以及少数已验证或接近验证的服务模式成形。
