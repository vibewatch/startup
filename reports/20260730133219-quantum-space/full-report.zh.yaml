      - number: '7.4'
        title: 缓释因素、监测点与终止标准
        blocks:
          - type: paragraph
            body: >-
              缓释因素真实存在，但都取决于里程碑。Quantum 的领导团队有太空政策和项目深度；公司补进了推进资产，而不是完全押注未来发明；公司披露了多项政府合同和提案；SPAC+PIPE
              结构如果基本按披露交割，资产负债表可能明显增强。这些都是重要抵消项。但正确的投资姿态仍是有条件的：盯证明，不盯叙事。最重要的监测点很直接。投资人应关注业务合并能否按时完成且赎回水平可接受，Ranger Prime
              能否守住“不早于”的时间表并披露更多任务细节，公司能否把合同入口转成已资助积压订单，而不只是合同载体资格，以及 Tulsa 和 Hawthorne
              的集成布局能否展示可衡量的就绪度，而不只是扩张意图。破坏投资假设的触发点也应明确。重大排期延误、融资缺口、无法把 Andromeda
              或类似入口转成已资助工作，或旗舰平台无法实现一体化机动与服务性能的证据，都会实质改变投资故事。Quantum 的风险在理论上可管理，但前提是执行开始逐项消除这些风险。
