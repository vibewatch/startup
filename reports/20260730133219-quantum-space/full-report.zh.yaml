      - number: '5.3'
        title: 成熟度、部署与路线图
        blocks:
          - type: paragraph
            body: >-
              Quantum 的公开产品成熟度，最好描述为部分已有演示，但旗舰平台层面尚未完全证明。最强的正面信号是，管理层现在具体谈到 Ranger Prime 将作为 Ranger
              平台首飞，任务目标是验证航天器性能、载荷托管、数据采集、机动，以及交会与近距离操作。Quantum 还称，2024 年曾发射 Scout 卫星，并从缩短的 Sentry
              任务中学习；公司把这描述为真实硬件积累，而非纯幻灯片。公开更新还提到制造就绪评审、Ranger Prime 不早于 2027 年发射的目标，以及 Tulsa
              制造设施工作。与此同时，投资者演示明确写道，Ranger 是正在开发的设计概念，截至目前尚未制造、运行或销售。这就是关键的成熟度区别。Quantum
              披露的进展足以说明这不只是纸面项目，但公开证明仍不足以把完整平台作为运营成熟的在轨服务资产来承销。因此，路线图有前景但受证据约束：2026 年看起来是集成和工业化，2027
