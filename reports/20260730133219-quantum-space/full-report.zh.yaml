      - number: '3.4'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              最强的反向证据是，公开竞争已经专业化，而公开证明仍不均衡。Northrop 已经飞行并服务过商业 GEO 资产，但许多其他玩家仍处于未来计划或重演示阶段。Orbit Fab
              拥有最清晰的接口标准位置，但这种成功可能把任务主承包商的燃料接入商品化，而不保证 Orbit Fab 自己赢得最终服务关系。Astroscale 和 ClearSpace
              表明，可持续、寿命延展和碎片清除预算可能混在一起，意味着即便相邻竞争者不销售同款航天器，也可能出现在 Quantum
              的机会集中。价格可见度同样弱。全服务任务经济性仍主要由报价驱动，干净对标受限，也说明买方可能继续多家并用，直到运营结果把市场拉开。Quantum
              可能的护城河并不来自缺少替代方案；如果有，也来自它比专业公司更快地把高推进剂容量、任务灵活性、客户贴近度和采购可信度整合起来。这是可能的，但今天的公开证据支持的是更细的判断：Quantum
              的架构可能比许多同行更宽，但它进入的是一个专业公司已经占有重要信任锚点、替代风险仍然显著的市场。
