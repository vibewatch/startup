      - number: '8.4'
        title: 最终判断与尽调要求
        blocks:
          - type: paragraph
            body: >-
              最终建议因此是跟踪，而不是买入。Quantum 好过一套普通太空路演材料，但还没好到可以忽略估值纪律。若三件事发生，建议可以上调：业务合并以强劲净现金交割，Ranger Prime
              及相关就绪里程碑变得更具体，管理层披露一座更清晰的桥，把具名项目连接到已资助积压订单和可重复收入。反过来，如果融资质量恶化，旗舰任务排期拉长且透明度没有改善，或政府牵引仍主要停留在资格和提案话术而不是已资助执行，建议应下调。投资人还需要更锋利地尽调经济性。合同级毛利结构、制造产出、任务特定资本开支、发射伙伴义务和转化假设，都会决定
              $1.2 billion 究竟是平台便宜货，还是昂贵承诺。基于当前公开记录，正确姿态是保持跟踪、索要证明，不要按证明已经完成的价格付钱。
