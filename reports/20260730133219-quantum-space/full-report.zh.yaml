      - number: '1.2'
        title: 领导班底与治理集中度
        blocks:
          - type: paragraph
            body: >-
              Quantum Space 的领导班底是公司命题的核心。执行董事长兼联合创始人 Kam Ghaffarian 有 Axiom Space、X-energy、Intuitive Machines 以及早期
              Stinger Ghaffarian Technologies 平台的连续创业声誉。Jim Bridenstine 曾任 NASA 第 13 任局长，此前还做过海军飞行员和俄克拉荷马州国会议员，并在 2026 年
              5 月加入公司担任 CEO。投资者材料还突出联合创始人兼总裁 Kerry Wisnosky、CTO Philip Bracken、联合创始人 Ben Reed 以及国家安全负责人 Richard
              Matlock，把团队包装成累计拥有超过 225 年太空和防务经验。这个班底具备战略价值，因为 Quantum
              卖向的是一个同时看重政策理解、政府合同信誉和任务工程能力的市场。但集中度风险也随之出现：公开叙事高度绑定 Ghaffarian 的资本市场网络和 Bridenstine
              的政府声望，管理层留任和接班因此是实质性尽调议题，不是次要问题。
