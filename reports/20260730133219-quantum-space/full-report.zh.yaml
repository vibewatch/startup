      - number: '1.4'
        title: 里程碑、就绪信号与未解缺口
        blocks:
          - type: paragraph
            body: >-
              Quantum Space 近期里程碑显示出动能，但还不是证明。公司在 2026 年 5 月宣布 Bridenstine 出任 CEO，6 月披露 SPAC 交易；其投资者材料写明，Ranger
              Pathfinder 首飞目标为 2027 年 6 月，并在 2028 年末达到“任务就绪”状态。管理层还称，公司通过 Series A 融资 $80 million，完成 Ranger Prime
              的制造就绪评审，并收购多模式推进技术。Tulsa 制造叙事又提供了一个扩张标记：Bridenstine 告诉 The Journal Record，该基地到 2026 年底可能增至约 50
              名员工。反向证据同样重要，而且来自外部和官方渠道：GAO 认为机器人 ISAM 仍不成熟，标准不清、测试机会有限，并存在“先有鸡还是先有蛋”的采用难题；Quantum 自己的投资者材料也警示，Ranger
              尚未制造、运行或销售，公司预计仍会亏损，需要未来资本，并高度暴露于政府项目节奏。综上，本章结论很直接：Quantum 有可信叙事和特权入口，但仍是一个规模化前的执行故事，不是已经去风险的运营业务。
