            body: >-
              从公开信息看，Quantum
              的扩张逻辑在理论上强，但按客户批次维度证据弱。公司的客户故事天然适合“先落地再扩张”：买方可以从演示或小众任务起步；如果平台跑通，再扩到寿命延展、后勤、补加燃料、托管载荷和地月活动。这套逻辑也贯穿其国家安全和商业表述。但检索到的来源没有披露续约率、GRR、NRR、满意度分数、合同期限、后续任务订单节奏，甚至没有给出活跃付费客户的清晰数量。因此，公开证据无法说明早期政府关系是广泛且可重复，还是
              Quantum 仍依赖少数高价值采购路径。反向证据进一步加重这个风险。GAO 和 Payload 都把 ISAM 市场描述为早期且定制化；Andromeda 本身又是多授标，并明确尚未向 Quantum
