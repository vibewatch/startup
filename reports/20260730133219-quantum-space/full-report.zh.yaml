  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与可比框架
        blocks:
          - type: paragraph
            body: >-
              Quantum 以私营公司身份进入估值讨论，并借 SPAC 路径在旗舰平台飞行之前建立公开市场锚点。已宣布交易给出的投前估值约 $600 million，交易后股权价值约 $1.2
              billion；如果交割假设成立，背后有信托账户和大额可转债 PIPE
              支撑。绝对数看，这一价格低于许多上市太空赢家，高于较弱或陷入困境的太空公司，所以表面上听起来还算合理。更难的问题是，业务是否已经配得上这个中间位置。今天的答案只是部分肯定。公开可比公司显示，太空公司市值结果跨度极大：有问题平台低于
              $100 million，收入基础更强、证据点更好或投资人热情更清晰的公司可达数十亿美元。Quantum 的 $1.2 billion
              标记因此落在可投资区间，但还不在已去风险区间。估值框架应理解为一张按执行加权的国家安全轨道机动期权，而不是一家已经规模化企业的已验证现金流倍数。
