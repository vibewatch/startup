      - number: '5.4'
        title: 差异化、信任与未解缺口
        blocks:
          - type: paragraph
            body: >-
              Quantum 的差异化故事有三根主柱：任务宽度、推进架构和产业政策匹配。任务宽度重要，因为同行往往专注于运输、补加燃料基础设施、寿命延展或碎片清除中的一个方向；Quantum
              试图把这些角色合进一个平台。推进重要，因为公司声称一种燃料类型即可支持高推力和高效率两种模式，在降低复杂度的同时提高任务灵活性。产业政策匹配也重要，因为公司明确建设美国本土设施，并围绕国家安全响应能力发声。公开证据还指向一层
              IP 护城河：投资者材料称已有或待批专利、已提交申请共 17 项。不过，信任控制是技术栈里公开信息最弱的一环。Quantum 没有披露公开安全认证制度，没有发布任务保障框架，没有独立产品基准，没有 Ranger
              Prime
              发射伙伴细节，也没有类似软件或航电平台的公开安全或质量控制仪表盘。正确结论不是技术弱，而是公开记录在架构意图上最强，在审计验证和正式控制上最弱。对一个防务主导的轨道机动平台来说，这个缺口很关键，因为买方最终采购的是可靠性和任务保障，不只是有说服力的设计原则。
