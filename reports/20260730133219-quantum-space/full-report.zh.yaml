      - number: '4.2'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              披露预测中最能说明问题的，不是收入曲线，而是成本组合。Quantum 预计 2026 年毛利为 $5.101 million，2027 年为 $14.043 million；即便收入翻倍以上，毛利率也只有 22%
              和 23%。对航天器和服务模型来说，这并不意外，但意味着承销争论围绕的是如何扩张一个资本和运营都很重的业务，而不是软件式经营杠杆。公司还预计 2026 年和 2027 年 R&D 分别为 $14.976
              million 和 $15.866 million，G&A 为 $14.340 million 和 $28.002 million，S&M 仅为 $1.649 million 和 $2.861
              million。公开口径看，这是一家工程主导的组织：披露销售投入低，行政建设开支高，近期毛利率扩张有限。EBITDA 仍深度为负，2026 年为负 $40.864 million，2027 年为负 $32.685
              million；总现金消耗更糟，分别为负 $69.411 million 和负 $97.599
              million。这个差距强烈暗示，除纯运营亏损外，公司还有重大的营运资本、资本开支、库存或其他现金需求。因此，本章核心结论是，单位经济尚未披露到足以精确承销的程度；公开模型主要告诉我们，Quantum
              预计在证明强劲利润率转化之前，要靠产品开发、制造扩张和持续管理投入来买增长。
