      - number: '7.2'
        title: 产品、项目与运营风险
        blocks:
          - type: paragraph
            body: >-
              第二组风险在运营端。Quantum 的核心产品主张在战略上说得通，但公司仍要从架构跨到在轨性能。公开记录显示 Ranger 仍在研发中，而 Ranger Prime 是首个旗舰验证任务，时间不早于 2027
              年二季度。也就是说，推进集成、流体处理、交会与近距离操作、载荷托管、长期航天器健康、发射就绪和任务保障，都还要在一体化运营环境里验证。Phase Four 资产收购在纸面上补强了推进栈，Tulsa
              工厂扩大了工业产能，但两步也增加了集成和爬坡风险。硬件公司出问题，更多不是因为想法错，而是供应商、设施、测试、排期和现金依赖层层堆起来。Quantum
              的公开进展真实，但尚未披露详细的鉴定仪表盘、供应商冗余图，或任务成功阈值矩阵。实际含义是，2026 年和 2027 年初的主线是建设并证明，而不是软件式增量迭代。
