      - number: '8.3'
        title: 情景分析与估值区间
        blocks:
          - type: paragraph
            body: >-
              情景分析强化了同一结论。牛市情景下，SPAC 基本按计划交割，Ranger Prime 按时飞行，公司把政府合同载体和演示转成可见的已资助积压订单，投资人开始把 Quantum
              看作差异化的国家安全平台，并给予服务和加注可选性。在这个世界里，已宣布估值可能显得早，但可以成立。基准情景下，交割仍会发生，但验证和积压订单透明度逐步到来；在执行追上之前，股票或私募估值标记会被困在区间内。熊市情景下，赎回、排期延误或首飞证明偏弱，会迫使市场把
              Quantum
              重新定价为更像投机性、未规模化的硬件公司，而不是品类领导者。上市太空公司可比样本显示，这个区间可以非常宽。因此，虚假的精确在这里没有帮助。最有支撑的区间不是一个精确数字，而是一句清楚判断：如果里程碑滑坡，下行很实质；上行则要求未来
              12 到 24 个月内成功压缩验证风险。
