      - number: '7.3'
        title: 合作伙伴、客户与市场风险
        blocks:
          - type: paragraph
            body: >-
              第三组风险来自对合作伙伴、政府买家，以及仍在形成的市场结构的依赖。Quantum 的客户证明在政府渠道最强，尤其是 U.S. Space Force、DARPA、Department of War
              和其他防务相关项目。这是优势，也会加大采购节奏、预算优先级、任务订单转化和任务架构变化的集中度。Andromeda
              合同载体说明了这一点：入选有战略意义，但公司也表示目前还没有分配具体资金。在供给端，业务依赖发射准入、推进资质、生产放量，以及整个服务市场仍处早期的外部接口标准。GAO、Payload 等独立来源把 ISAM
              市场描述为不成熟且高度定制；ClearSpace、Orbit Fab、Northrop
              等同行的动作显示动能真实，也反过来确认标准、客户行为和任务经济性仍在成形。市场可以变大、变持久，但时间点和份额获取都尚未去风险。对 Quantum 而言，客户集中和生态依赖不是边缘问题，而是核心投资判断变量。
