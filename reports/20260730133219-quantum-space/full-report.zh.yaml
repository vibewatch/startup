companyProfile:
  summary: >-
    Quantum Space 是一家美国轨道机动与太空防务公司，正在打造 Ranger——一个可机动航天器平台，服务于 GEO 及更远区域的国家安全、民用和商业任务。公司把 Ranger
    定位成机动基础设施，而不是单一任务卫星；公开材料强调大容量可贮存推进剂、可补加燃料、模块化和长航时作业。Quantum 最强的公开牵引来自政府渠道，包括美国太空军、美国战争部、DARPA 以及 AFRL 相关项目；已宣布的 SPAC
    和 PIPE 融资则用于把公司从开发阶段硬件推向旗舰验证和规模化生产。
