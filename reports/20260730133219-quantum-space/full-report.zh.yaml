      - number: '3.3'
        title: 分销、信任与切换成本
        blocks:
          - type: paragraph
            body: >-
              轨道机动的竞争耐久性不仅由硬件决定，也同样由信任和采购架构决定。政府买方明确使用 Andromeda
              这类多授标载体，在传统主承包商和新商业进入者之间保留选择权，这削弱了一个假设：早期合同载体会自然变成赢家通吃护城河。在位证明很重要，因为运营商和合同官员在购买机动或补加燃料能力的同时，也在承销安全、任务保障和交易对手可靠性。这让
              Northrop 今天在服务可信度上占优，也帮助 Astroscale 在其可持续与 GEO
              服务叙事和预置捕获或负责任操作相匹配的地方赢得信任。切换成本也不均匀。预置接口、燃料标准和对接兼容性在存在时会形成锁定，但大量在轨卫星从设计上并不支持常规服务。这为 Starfish
              这类附着模式打开空间，也保留了替换发射这条现状路径，供不愿重设航天器或等待标准落定的客户使用。分销权力最终可能流向控制通用接口、仓库和项目入口的参与者，而不只是拥有最大航天器的公司。
