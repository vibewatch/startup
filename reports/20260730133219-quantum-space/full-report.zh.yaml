              最好的公开证明来自具名政府关系，而不是广泛用户数量。Quantum 称，公司有六份合同和待决提案，横跨美国太空军、美国战争部、DARPA 和 AFRL。具体例子包括 Andromeda IDIQ 载体、美国战争部
