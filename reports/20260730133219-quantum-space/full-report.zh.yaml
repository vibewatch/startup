      - number: '1.3'
        title: 资本结构、合同牵引与运营姿态
        blocks:
          - type: paragraph
            body: >-
              截至本报告日期，与 Inflection Point Acquisition Corp. VI 宣布合并，是 Quantum Space 最关键的公司事件。假设零赎回，交易给予 Quantum 约 $600
              million 投前估值、约 $1.2 billion 交易后股权价值；资金来源包括约 $253 million 的 SPAC 信托现金，以及按每股 $12 计价的 $300 million 可转换
              PIPE。投资者材料进一步列出，扣除预计交易费用后，假设备考资产负债表现金约 $533 million，现有 Quantum 股东在交割时保留约 50%
              股权。围绕这套融资叙事，管理层认为公司已有足够商业验证，可以进入扩张：投资者关系网站称 Quantum 已拿下超过 $88 million 的已锁定政府合同；2026 年 6
              月公告材料则描述了横跨美国太空军、美国战争部、DARPA 和 AFRL 的六份合同及待决提案，并称估算管线机会超过 $5
              billion。不过，这种牵引质量并不纯粹，因为叙事的一部分仍取决于提案、期权行使假设，以及一项有战略价值但尚未分配资金的 Andromeda 授标。
