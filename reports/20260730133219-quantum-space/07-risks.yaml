  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Quantum Space's risk profile is dominated by execution before proof: the Ranger platform is not yet operational, the first flagship mission remains ahead, and much of the demand story depends on government programs that have strategic importance but incomplete funding visibility. The combination of hardware complexity, capital intensity, procurement concentration, and SPAC-close uncertainty means the investment case can work, but only if specific technical, financing, and contract-conversion milestones are met on schedule."
  },
  "sections": [
    {
      "id": "regulatory-legal-and-capital-risks",
      "title": "Regulatory, legal, and capital-structure risks",
      "body": "The first risk cluster sits at the intersection of transaction mechanics, disclosure posture, and capital sufficiency. Quantum is still a pre-close SPAC target as of the run date, so the public valuation and balance-sheet story remains conditional on closing, redemptions, financing completion, and the usual transaction approvals. The investor presentation and related 8-K materials present a well-funded picture assuming zero redemptions and a large convertible PIPE, but those same assumptions create execution sensitivity: if trust proceeds fall, if closing timing slips, or if the PIPE economics become more dilutive in practice, the runway available for Ranger, Tulsa, and follow-on mission preparation changes materially. Legal and disclosure risk also matter because much of the public case relies on projections, pipeline narratives, and forward-looking milestone statements rather than delivered operating history. This does not imply misconduct; it means investors are underwriting an ambitious defense-space build with limited historical cash-generation proof. In practical terms, the key question is whether financing certainty stays ahead of hardware and mission burn. If not, program timing, supplier commitments, and hiring plans can all compress simultaneously.",
