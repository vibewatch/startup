    {
      "id": "product-program-and-operations-risks",
      "title": "Product, program, and operations risks",
      "body": "The second cluster is operational. Quantum's core product claims are strategically coherent, but the company is still crossing the distance from architecture to fielded performance. The public record says Ranger is still in development, while Ranger Prime is the first flagship proof mission and is scheduled no earlier than Q2 2027. That means propulsion integration, fluid handling, rendezvous and proximity operations, payload hosting, long-duration spacecraft health, launch readiness, and mission assurance all still have to be demonstrated in an integrated operating environment. The Phase Four asset acquisition strengthens the propulsion stack on paper, and the Tulsa facility broadens industrial capacity, yet both moves also add integration and ramp risk. Hardware companies fail less often because the idea is wrong than because dependencies pile up across suppliers, facilities, testing, schedule, and cash. Quantum's public updates show real progress, but they do not yet disclose a detailed qualification dashboard, supplier redundancy map, or mission-success threshold matrix. The practical implication is that 2026 and early 2027 are dominated by build-and-prove risk, not by incremental software-style iteration.",
