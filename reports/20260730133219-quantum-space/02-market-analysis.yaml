- id: buyers-and-budget-owners
  title: Buyers, users, payers, and adoption path
  body: 'The near-term buyer base for orbital mobility is not a mass commercial market; it is a concentrated set of institutional actors with expensive assets in hard-to-reach orbits. Space Force, DARPA, AFRL, and other defense organizations are clearly the lead payers for resilience, maneuver, inspection, and logistics capabilities, as shown by the Andromeda vehicle and the SpaceWERX orbital-logistics challenge. Commercial GEO operators form the second meaningful segment because they already understand the business case for life extension and refueling when replacement satellites are expensive and orbital slots are scarce. A third segment consists of payload owners and infrastructure developers that need orbit transfer, hosted services, or debris-removal support. Adoption is necessarily staged: operators first need confidence in rendezvous and proximity operations, then in docking and fuel-transfer standards, and only after that in routine multi-mission logistics. That sequence matters because Quantum is entering a market where technical qualification and customer behavior change are inseparable.'
  claimRefs:
  - CM010
