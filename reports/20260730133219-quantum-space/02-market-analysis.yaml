callouts:
- calloutType: insight
  title: Quantum is chasing the defense-led wedge of a larger future market
  body: The market that can plausibly fund Quantum in the next several years is not the whole orbital economy; it is the subset of defense, GEO servicing, and transfer use cases where customers already feel the pain of finite propellant, orbital inflexibility, or surprise risk. That wedge can still be attractive, but it should not be confused with the company's full $100 billion narrative.
  claimRefs:
  - CM001
  - CM010
  - CM011
  - CM018
  - CM036
- calloutType: strength
  title: Standards and enabling infrastructure are finally appearing
  body: 'The most constructive market change is the emergence of real enabling layers: RAFTI as a refueling interface, ModProp as a modular refueling architecture, Andromeda and SpaceWERX as demand shapers, and existing GEO servicing missions from Northrop. Together these reduce the probability that Quantum is selling into a purely theoretical market.'
  claimRefs:
  - CM013
  - CM019
  - CM020
  - CM021
  - CM022
  - CM024
  - CM025
- calloutType: risk
  title: Commercial scale still depends on proof, price, and repeatability
  body: GAO and industry sources agree that the sector is not yet routine. Most contracts remain bespoke, many satellites are not designed for serviceability, and standards plus test opportunities remain incomplete. If Quantum assumes the market matures faster than these frictions ease, its revenue timing and capacity plans could run ahead of actual demand.
  claimRefs:
  - CM029
  - CM030
  - CM031
  - CM032
  - CM033
  - CM034
  - CM035
