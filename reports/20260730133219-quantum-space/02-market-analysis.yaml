  evidenceGaps:
  - type: missing-source
    severity: material
    topic: ranger-sam-bridge
    missingEvidence: Independent market work that isolates the monetizable market for maneuverable multi-orbit refueling and mobility platforms rather than broader ISAM categories.
    whyItMatters: Quantum's valuation and capacity narrative relies on a broad market frame that is not directly bridged to a narrow, current-year accessible SAM.
    diligencePath: Build bottom-up demand from serviceable fleets, defense programs, and transport missions rather than relying on headline TAMs.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
    - TM005
  - type: enumeration-incomplete
    severity: material
    topic: serviceable-asset-base
    missingEvidence: A verified count of serviceable GEO, MEO, or cislunar assets compatible with emerging servicing and refueling standards.
    whyItMatters: Without a clear installed base, adoption and repeat-mission assumptions remain difficult to validate.
    diligencePath: Map fleets by orbit, interface compatibility, and replacement economics.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing
    missingEvidence: Public contract pricing benchmarks for recurring commercial refueling, life-extension, and orbital-transfer missions.
    whyItMatters: Commercial demand may exist conceptually but still fail to close at viable price points.
    diligencePath: Collect mission-level pricing from public awards, case studies, and customer interviews.
    relatedQuestionRefs:
    - QM020
  - type: conflicting-data
    severity: minor
    topic: tam-methodology
