    {
      "id": "architecture-propulsion-and-industrial-base",
      "title": "Architecture, propulsion, and industrial base",
      "body": "The heart of the technical story is propulsion and energy management. The investor presentation and later company updates describe Ranger as a single-fuel, multi-mode system designed to combine high-thrust maneuvering with high-efficiency sustained operations. Quantum reinforced that story by acquiring Phase Four's multi-mode propulsion assets and a Los Angeles integration and test facility, arguing that the asset purchase accelerates both mobility performance and manufacturability. Public descriptions also emphasize one of the largest storable fuel capacities in class at more than 4,000 kilograms, a modular payload architecture, and operational life of up to fifteen years. Around that vehicle core, Quantum is assembling a distributed industrial footprint: Rockville for engineering and mission operations, Hawthorne/Los Angeles for propulsion integration and testing, and Tulsa for scaled manufacturing. The architecture logic is coherent. One propellant system and large onboard stores improve mission flexibility; modular payload space broadens use cases; and multi-site industrial capacity reduces dependence on a single function at one location. But none of those features should be confused with finished operational proof. They remain design and scale-up claims until Ranger Prime and later missions validate them on orbit.",
      "claimRefs": [
        "CE010",
