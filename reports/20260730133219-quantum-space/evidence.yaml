evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding-date
    missingEvidence: An authoritative public document that states Quantum Space's original founding date.
    whyItMatters: A clean chronology requires a verified starting point for founding, financing, and product-development pacing.
    diligencePath: Review future S-4 or proxy materials for organizational history and formation dates.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: headcount-customer-count
    missingEvidence: A public headcount figure and customer-count disclosure beyond named agencies and programs.
    whyItMatters: Scale metrics are part of the requested overview KPI set and affect judgments on operating maturity.
    diligencePath: Use future S-4 disclosures, recruiting data, or management Q&A to verify workforce and customer counts.
    relatedQuestionRefs:
      - QO019
      - QO020
  - type: private-evidence-only
    severity: material
    topic: contract-backlog-detail
    missingEvidence: Contract-by-contract values, funded backlog, and option assumptions behind the >$88M secured-contract claim.
    whyItMatters: >-
      The overview depends heavily on government-traction quality, yet current disclosures mix firm contracts with
      proposals and options.
    diligencePath: Request customer schedule, award notices, and backlog bridge in future SEC filings or diligence materials.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: minor
    topic: pre-close-capital-structure
    missingEvidence: Updated redemption sensitivity, trust balance, and final PIPE roster closer to closing.
    whyItMatters: Illustrative close ownership and cash balances can change materially before the shareholder vote and closing.
    diligencePath: Revisit the cap table after S-4 filing and ahead of any shareholder meeting.
    relatedQuestionRefs:
      - QO010
      - QO011
  - type: missing-source
    severity: material
    topic: ranger-sam-bridge
    missingEvidence: >-
      Independent market work that isolates the monetizable market for maneuverable multi-orbit refueling and mobility
      platforms rather than broader ISAM categories.
    whyItMatters: >-
      Quantum's valuation and capacity narrative relies on a broad market frame that is not directly bridged to a
      narrow, current-year accessible SAM.
    diligencePath: >-
      Build bottom-up demand from serviceable fleets, defense programs, and transport missions rather than relying on
      headline TAMs.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
      - TM005
  - type: enumeration-incomplete
    severity: material
    topic: serviceable-asset-base
    missingEvidence: >-
      A verified count of serviceable GEO, MEO, or cislunar assets compatible with emerging servicing and refueling
      standards.
    whyItMatters: Without a clear installed base, adoption and repeat-mission assumptions remain difficult to validate.
    diligencePath: Map fleets by orbit, interface compatibility, and replacement economics.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing
    missingEvidence: >-
      Public contract pricing benchmarks for recurring commercial refueling, life-extension, and orbital-transfer
      missions.
    whyItMatters: Commercial demand may exist conceptually but still fail to close at viable price points.
    diligencePath: Collect mission-level pricing from public awards, case studies, and customer interviews.
    relatedQuestionRefs:
      - QM020
  - type: conflicting-data
    severity: minor
    topic: tam-methodology
    missingEvidence: >-
      Like-for-like methodologies that reconcile Quantum's orbital infrastructure TAM with third-party ISAM market
      reports.
    whyItMatters: Different boundaries can make large TAMs look contradictory when they may simply cover different opportunity sets.
    diligencePath: Normalize estimates by time horizon, included services, and revenue recognition basis.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
      - TM005
  - type: missing-source
    severity: material
    topic: full-mission-pricing
    missingEvidence: >-
      Public contract values or list pricing for recurring GEO servicing and orbital-mobility missions across Quantum,
      Northrop, Astroscale, Starfish, and Impulse.
    whyItMatters: >-
      Without pricing comparables, it is hard to benchmark win rates, gross-margin potential, or buyer ROI versus
      replacement launches.
    diligencePath: >-
      Request redacted proposals, award values, or program economics from management and compare against customer
      alternatives.
  - type: missing-source
    severity: material
    topic: mission-assurance-proof
    missingEvidence: >-
      Public mission-performance data for Ranger or equivalent Quantum demonstrations compared with incumbent servicing
      missions.
    whyItMatters: Trust and mission assurance are likely decisive in defense and GEO servicing source selections.
    diligencePath: Ask for test records, customer references, and mission-assurance artifacts tied to specific programs.
  - type: private-evidence-only
    severity: minor
