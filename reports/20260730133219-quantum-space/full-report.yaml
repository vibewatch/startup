  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product thesis
        blocks:
          - type: paragraph
            body: >-
              Quantum Space, LLC presents itself as a U.S. space-defense and orbital-mobility company organized around
              Ranger, a maneuverable spacecraft platform intended to operate across LEO, MEO, GEO, and cislunar space.
              Primary-source transaction materials place the company's engineering and mission-development center in
              Rockville, Maryland, its propulsion and integration test facility in Hawthorne, California, and a
              satellite manufacturing center in development in Tulsa, Oklahoma. The product story is defense-first:
              Ranger is marketed as a single-fuel, multi-mode spacecraft with more than 4,000 kilograms of storable
              propellant, modular and refuellable architecture, and up to 15 years of operational life. Investor
              materials repeatedly note that Ranger is still a design concept in development rather than an operational
              product, so the current diligence question is not whether the product narrative is compelling, but whether
              the team can convert concept advantages into a flight-proven platform quickly enough to capture the
              current defense demand window.
