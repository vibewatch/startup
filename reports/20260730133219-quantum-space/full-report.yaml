            body: >-
              The best public proof comes from named government relationships, not from broad user counts. Quantum says
              it has six contracts and pending proposals across the U.S. Space Force, Department of War, DARPA, and
              AFRL. Specific examples include the Andromeda IDIQ vehicle, a Department of War OECIF fuel-depot contract,
