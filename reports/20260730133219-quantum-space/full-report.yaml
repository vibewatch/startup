companyProfile:
  summary: >-
    Quantum Space is a U.S. orbital-mobility and space-defense company building Ranger, a maneuverable spacecraft
    platform designed for national-security, civil, and commercial missions across GEO and beyond. The company is
    positioning Ranger as mobility infrastructure rather than a single-mission satellite, with public emphasis on large
    storable propellant capacity, refuellability, modularity, and long-endurance operations. Quantum's strongest public
    traction is in government channels including U.S. Space Force, Department of War, DARPA, and AFRL-linked programs,
    while its announced SPAC and PIPE financing are meant to fund the transition from development-stage hardware to
    flagship proof and scaled production.
