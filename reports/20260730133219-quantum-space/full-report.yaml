      - number: '5.3'
        title: Maturity, deployment, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Quantum's public product maturity is best described as partially demonstrated but not yet fully proven at
              the flagship-platform level. The strongest positive signal is that management now talks concretely about
              Ranger Prime as the first flight of the Ranger platform, with a mission intended to validate spacecraft
              performance, payload hosting, data collection, maneuvering, and rendezvous and proximity operations.
              Quantum also says it previously launched a Scout satellite in 2024 and learned from the shortened Sentry
              mission, which it frames as real hardware heritage rather than pure slideware. Public updates further cite
              a Manufacturing Readiness Review, a 2027 no-earlier-than launch target for Ranger Prime, and
              manufacturing-facility work in Tulsa. At the same time, the investor presentation explicitly says Ranger
              is a design concept currently in development and has not been manufactured, operated, or sold to date.
              That is the critical maturity distinction. Quantum has enough disclosed progress to say this is more than
              a paper program, yet still not enough public proof to underwrite the full platform as an operationally
              mature orbital-servicing asset. The roadmap is therefore promising but evidence-constrained: 2026 looks
              like integration and industrialization, while 2027 becomes the public proof point for whether the
              technical claims begin to convert into fielded capability.
