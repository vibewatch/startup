      - number: '8.4'
        title: Final call and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The final call is therefore track rather than buy. Quantum looks better than a generic space slide deck,
              but not yet good enough to ignore valuation discipline. The recommendation could improve if three things
              happen: the business combination closes with strong net proceeds, Ranger Prime and related readiness
              milestones become more concrete, and management discloses a cleaner bridge from named programs to funded
              backlog and repeatable revenue. Conversely, the call should worsen if financing quality deteriorates, if
              the flagship mission schedule stretches without better transparency, or if government traction remains
              mostly eligibility and proposal language rather than funded execution. Investors also need sharper
              diligence on economics. Contract-level margin structure, manufacturing throughput, mission-specific capex,
              launch-partner obligations, and conversion assumptions all matter for whether $1.2 billion is a platform
              bargain or an expensive promise. Based on the current public record, the right posture is to stay engaged,
              ask for proof, and avoid paying as though the proof is already complete.
            claimRefs:
