      - number: '1.2'
        title: Leadership bench and governance concentration
        blocks:
          - type: paragraph
            body: >-
              Quantum Space's leadership bench is a central part of the company thesis. Executive Chairman and
              co-founder Kam Ghaffarian brings a repeat-builder reputation from Axiom Space, X-energy, Intuitive
              Machines, and the earlier Stinger Ghaffarian Technologies platform. Jim Bridenstine joined as chief
              executive in May 2026 after serving as NASA's 13th Administrator, following earlier service as a naval
              aviator and member of Congress from Oklahoma. Investor materials also highlight co-founder and president
              Kerry Wisnosky, CTO Philip Bracken, co-founder Ben Reed, and national-security lead Richard Matlock,
              framing the team as carrying more than 225 years of cumulative space and defense experience. That bench is
              strategically valuable because Quantum is selling into a market where policy fluency, government
              contracting credibility, and mission engineering all matter. It also creates concentration risk: the
              public narrative is heavily keyed to Ghaffarian's capital-markets network and Bridenstine's government
              stature, making executive retention and succession material diligence topics rather than secondary
              considerations.
