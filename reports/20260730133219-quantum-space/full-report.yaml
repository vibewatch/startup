      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The most revealing part of the disclosed projections is not the revenue curve but the cost mix. Quantum
              projects gross profit of $5.101 million in 2026 and $14.043 million in 2027, implying gross margins of
              only 22% and 23% even as revenue more than doubles. That is not surprising for a spacecraft-and-services
              model, but it means the underwriting debate is about scaling a capital- and operations-heavy business, not
              about software-like operating leverage. The company also projects R&D of $14.976 million in 2026 and
              $15.866 million in 2027, G&A of $14.340 million and $28.002 million, and S&M of just $1.649 million and
              $2.861 million. Publicly, that looks like an engineering-led organization with low disclosed
              commercial-sales spend, substantial administrative buildout, and modest near-term gross-margin expansion.
              EBITDA remains deeply negative at negative $40.864 million in 2026 and negative $32.685 million in 2027,
              while total cash burn is projected even worse at negative $69.411 million and negative $97.599 million.
              That gap strongly suggests material working-capital, capex, inventory, or other cash demands beyond pure
              operating losses. The chapter's core conclusion is therefore that unit economics are not yet published at
              a level that supports precise underwriting; the public model mostly tells us that Quantum expects to buy
              growth through product development, manufacturing scale-up, and continued overhead investment before
              proving strong margin conversion.
