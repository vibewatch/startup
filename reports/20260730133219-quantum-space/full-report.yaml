  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and closest overlaps
        blocks:
          - type: paragraph
            body: >-
              Quantum Space's public positioning is unusually broad relative to most peers. Its Ranger platform is
              framed as a maneuverable, refuellable spacecraft for national security, civil, and commercial missions
              across LEO, MEO, GEO, and cislunar space. In the retrieved competitive pack, no single company matches
              that exact breadth. Instead, the closest competitive pressure comes from a set of narrower but more mature
              substitutes. Northrop Grumman's SpaceLogistics business is the strongest incumbent analogue for GEO life
              extension and servicing because it already has commercial servicing proof on orbit. Orbit Fab is not a
              full mission-prime substitute, but it is becoming the most visible refueling-interface and
              propellant-infrastructure standard setter, which could let other servicers converge on common fueling
              architecture. Astroscale sits between those models with LEXI life-extension ambitions, refueling
              partnerships, and end-of-life servicing. Starfish offers a lighter-weight life-extension and disposal
              path. Impulse and Momentus compete more on orbital transport and maneuver. ClearSpace competes for
              servicing-adjacent budgets through active debris removal. The underwriting takeaway is that Quantum is not
              fighting one mirror-image rival; it is competing against a modular ecosystem of specialists plus the
              replacement-satellite status quo.
