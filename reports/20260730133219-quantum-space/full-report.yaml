      - number: '1.4'
        title: Milestones, readiness signals, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              Quantum Space's near-term milestones point to momentum but not yet proof. The company announced
              Bridenstine's CEO appointment in May 2026, then disclosed the SPAC transaction in June, and its investor
              deck outlines a Ranger Pathfinder first flight targeted for June 2027 with “mission ready” status in late
              2028. Management also says it has raised $80 million through Series A, completed a Manufacturing Readiness
              Review for Ranger Prime, and acquired multi-mode propulsion technology. The Tulsa manufacturing story adds
              another scaling marker, with Bridenstine telling The Journal Record the site could grow to roughly 50
              employees by the end of 2026. The counterweight is that external and official adverse evidence still
              matters: GAO says robotic ISAM remains immature, with unclear standards, limited test opportunities, and a
              chicken-and-egg adoption problem, while Quantum's own investor materials warn that Ranger has not yet been
              manufactured, operated, or sold and that the company expects losses, future capital needs, and heavy
              exposure to government-program timing. That mix makes the chapter's bottom line straightforward: Quantum
              has a credible narrative and privileged access, but it remains a pre-scale execution story rather than a
              de-risked operating business.
