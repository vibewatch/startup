      - number: '1.3'
        title: Capital structure, contract traction, and operating posture
        blocks:
          - type: paragraph
            body: >-
              The announced merger with Inflection Point Acquisition Corp. VI is the defining corporate event for
              Quantum Space as of the run date. The deal values Quantum at approximately $600 million pre-money and
              roughly $1.2 billion of post-transaction equity value assuming zero redemptions, with approximately $253
              million of SPAC trust cash and a $300 million convertible PIPE at $12 per share. Investor materials
              further show roughly $533 million of assumed pro forma balance-sheet cash after estimated transaction
              expenses, and existing Quantum equity holders retaining about 50% ownership at close. Against that
              financing story, management argues it already has enough commercial proof to justify scaling: the
              investor-relations site says Quantum is backed by more than $88 million in secured government contracts,
              while the June 2026 announcement materials describe six contracts and pending proposals across the U.S.
              Space Force, Department of War, DARPA, and AFRL plus more than $5 billion of estimated pipeline
              opportunities. The quality of that traction is mixed, however, because part of the narrative still depends
              on proposals, option exercise assumptions, and an Andromeda award that has strategic value but no
              allocated funding yet.
