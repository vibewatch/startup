      - number: '6.3'
        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Publicly, Quantum's expansion logic is strong in theory but weakly evidenced in cohort terms. The
              company's customer story naturally lends itself to land-and-expand dynamics: a buyer could start with a
              demonstration or niche mission, then broaden into life extension, logistics, refueling, hosted payloads,
              and cislunar activity if the platform works. That same logic appears across its national-security and
              commercial messaging. Yet no retrieved source discloses renewal rates, GRR, NRR, satisfaction scores,
              contract length, follow-on task-order cadence, or even a clean count of active paying customers. The
              public evidence therefore cannot show whether early government relationships are broad-based and
              repeatable or whether Quantum is still dependent on a few high-value procurement paths. Adverse evidence
              sharpens that risk. GAO and Payload both describe the ISAM market as early and bespoke, while Andromeda
              itself is multi-award and explicitly does not yet provide a dedicated funding allocation to Quantum. Those
              facts do not negate the opportunity, but they do imply that customer concentration, procurement friction,
              and program timing remain central risks. Until Quantum discloses more on funded backlog, contract
              conversion, and repeat awards, the customer chapter should be read as positive signal with significant
              durability uncertainty.
            claimRefs:
              - CU022
              - CU023
              - CU024
