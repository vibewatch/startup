  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer job
        blocks:
          - type: paragraph
            body: >-
              Quantum Space is not selling a generic satellite bus. Its public materials consistently describe Ranger as
              a maneuverable orbital platform that can perform space domain awareness, refueling, satellite life
              extension, payload hosting, orbital adjustment, and cislunar operations for defense, civil, and commercial
              users. That matters because the product is best understood as mobility infrastructure rather than as a
              single mission spacecraft. In customer-workflow terms, Ranger is supposed to let an operator place a
              persistent asset in valuable or contested orbit, reposition it repeatedly, host payloads, refuel or extend
              other assets, and eventually support a broader logistics architecture. The value proposition is therefore
              a bundle: more maneuver margin, longer mission life, less need to replace satellites when fuel runs low,
              and a path toward sustained on-orbit operations beyond LEO. Quantum's own pages repeatedly position this
              as a response to what it calls the move from fixed architectures to dynamic space operations. The benefit
              is conceptual clarity around the customer job. The drawback is that the same breadth increases proof
              burden because buyers must trust both the vehicle and the operating model across multiple mission types
              rather than only one narrow task.
