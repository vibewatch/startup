  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Quantum Space's own materials define an expansive opportunity set: designing, launching, and operating
              maneuverable spacecraft across all orbits, with serviceable missions that fit Ranger platforms yielding an
              $8 billion SAM and a $1 billion SOM inside a claimed $100 billion annual TAM by 2031. That framing is
              strategically useful because it captures refueling, life extension, orbital transportation, inspection,
              and data-service use cases rather than treating Ranger as a single satellite program. It is also much
              broader than most independent market studies. The Business Research Company pegs the combined in-space
              manufacturing, servicing, and transportation market at $2.6 billion in 2026 and $5.23 billion by 2030,
              while GAO treats ISAM as an enabling capability area rather than a large proven market. The right
              underwriting conclusion is therefore not that Quantum's TAM is wrong, but that it embeds adjacency and
              future-state assumptions that should be separated from near-term monetizable demand.
