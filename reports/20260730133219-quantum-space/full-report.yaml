              The most important competitive fact is that no single peer replicates Ranger's advertised breadth. Quantum
              instead faces best-of-breed substitutes for each customer job: Northrop for proven GEO servicing, Orbit
              Fab for fueling standardization, Astroscale for sustainability-linked servicing, and Impulse or Momentus
