      - number: '7.4'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The mitigating factors are real, but they are milestone-dependent. Quantum has a leadership team with
              space-policy and program depth, has added propulsion assets rather than relying purely on future
              invention, has disclosed multiple government contracts and proposals, and has lined up a SPAC-plus-PIPE
              structure that could materially strengthen the balance sheet if it closes substantially as advertised.
              Those are important offsets. Still, the right investment posture is conditional: track proof, not
              narrative. The top monitors are straightforward. Investors should watch whether the business combination
              closes on time and with acceptable redemptions, whether Ranger Prime keeps its no-earlier-than schedule
              while disclosing more mission detail, whether the company converts contract surfaces into funded backlog
              rather than only vehicle eligibility, and whether Tulsa and the Hawthorne integration footprint show
              measurable readiness rather than just expansion intent. Thesis-break triggers should also be explicit. A
              major schedule slip, financing shortfall, inability to translate Andromeda or similar surfaces into funded
              work, or evidence that the flagship platform cannot achieve integrated maneuver-and-servicing performance
              would all materially change the case. Quantum's risks are manageable in theory, but only if execution
              begins to remove them one by one.
            claimRefs:
