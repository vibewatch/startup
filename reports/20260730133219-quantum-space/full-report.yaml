      - number: '2.3'
        title: Growth drivers and enabling infrastructure
        blocks:
          - type: paragraph
            body: >-
              Several public signals indicate genuine market pull. First, the national-security case is intensifying:
              SSC and SpaceWERX are now explicitly asking industry for orbital warehousing, propellant distribution,
              reusable transfer vehicles, repair concepts, and logistics networks across LEO, GEO, and beyond. Second,
              enabling technologies are moving from concept toward standards. Orbit Fab's RAFTI interface is marketed as
              an open-license TRL 8 refueling interface, AFRL's ModProp work is standardizing modular propulsion and
              refueling concepts for sustained maneuver, and DARPA's RSGS program continues to normalize servicing
              operations in GEO. Third, adjacent commercial offerings are multiplying. Northrop Grumman has already
              demonstrated paid GEO life-extension service, Astroscale is positioning LEXI with Orbit Fab refueling,
              Starfish is selling lightweight life-extension and disposal, Momentus is offering in-space transport, and
              Impulse is marketing rapid delivery to high-energy orbits. Collectively, these signals suggest the market
              is not hypothetical; it is forming around defense-funded capability maturation and a small number of
              proven or near-proven servicing models.
            claimRefs:
