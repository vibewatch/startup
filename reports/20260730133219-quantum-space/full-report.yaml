      - number: '8.2'
        title: Thesis, anti-thesis, and price discipline
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is straightforward. Quantum is attacking a strategically important problem set, has
              unusually strong policy and defense credibility for a still-private company, and is trying to build a
              mobility platform that can serve multiple mission classes instead of one narrow use case. Government
              traction is real enough to take seriously, and the financing package could fund a meaningful de-risking
              window if the close lands cleanly. The anti-thesis is just as important. The company remains pre-proof at
              the flagship-platform level; its public revenue story still leans on projections and pipeline framing;
              customer concentration is high; and orbital servicing markets remain early. Those facts make the
              recommendation price-sensitive. A lower entry price with the same mission prospects could justify a more
              aggressive stance, but the announced valuation already prices in a fair amount of future success.
              Investors are therefore not deciding whether Quantum is interesting; they are deciding how much pre-proof
              risk they are willing to pay for. On today's public evidence, that argues for discipline rather than for
              full-throated enthusiasm.
            claimRefs:
              - CV012
