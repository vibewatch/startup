      - number: '3.3'
        title: Distribution, trust, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Competitive durability in orbital mobility is shaped as much by trust and procurement architecture as by
              hardware. Government buyers are explicitly using multi-award vehicles such as Andromeda to preserve choice
              among traditional primes and newer commercial entrants, which weakens any assumption that one early
              contract vehicle becomes a winner-take-all moat. Incumbent proof matters because operators and contracting
              officers are underwriting safety, mission assurance, and counterparty reliability at the same time they
              are buying maneuver or refueling capability. That favors Northrop today on servicing credibility and helps
              Astroscale where its sustainability and GEO-servicing narratives align with prepared-capture or
              responsible operations. Switching costs are also uneven. Prepared interfaces, fueling standards, and
              docking compatibility create lock-in where they exist, but a large portion of the installed satellite base
              was not designed for routine service. That opens room for attachment models such as Starfish's and
              preserves the status-quo path of replacement launches for customers unwilling to redesign spacecraft or
              wait for standards to settle. Distribution power may ultimately accrue to whichever actor controls the
              common interfaces, depots, and program access points, not just to the company with the biggest spacecraft.
            claimRefs:
