      - number: '2.4'
        title: Constraints, contradictory estimates, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The bullish market story remains constrained by operational reality. GAO says robotic ISAM has only been
              demonstrated on a handful of missions, standards remain unclear, in-space test opportunities are scarce,
              and users hesitate to pay for serviceability before servicing is routine. Payload reports much the same
              from industry participants: most contracts are still bespoke and government-led, commercial customers are
              waiting for timeline and price confidence, and much of the field still hinges on making RPO an everyday
              task. This explains the central contradiction in Quantum's market framing. Long-run orbital-infrastructure
              narratives may be directionally correct, but near-term demand is narrower, procurement-driven, and heavily
              dependent on a few demonstration programs proving safety, economics, and availability. For diligence
              purposes, Quantum's real market today should be treated as the defense-led wedge inside a larger
              aspirational orbital-services narrative, not as the entire orbital economy moving in lockstep toward
              routine refueling and multi-orbit logistics.
