      - number: '7.3'
        title: Partner, customer, and market risks
        blocks:
          - type: paragraph
            body: >-
              A third cluster comes from dependence on partners, government buyers, and a still-emergent market
              structure. Quantum's customer proof is strongest in government channels, especially U.S. Space Force,
              DARPA, Department of War, and other defense-linked programs. That is a strength, but it also increases
              concentration around procurement timing, budget priorities, task-order conversion, and changing mission
              architecture. The Andromeda vehicle illustrates the point: selection matters strategically, yet the
              company also states that no specific funding allocation has been assigned so far. On the supply side, the
              business depends on launch access, propulsion qualification, production scale-up, and external interface
              standards that remain early across the broader servicing market. Independent sources such as GAO and
              Payload describe the ISAM market as immature and bespoke, while peer activity from ClearSpace, Orbit Fab,
              Northrop, and others shows real momentum but also confirms that standards, customer behavior, and mission
              economics are still forming. The market can become large and durable, but the timing and share capture are
              not de-risked. For Quantum, that means customer concentration and ecosystem dependence are not side
              issues; they are core underwriting variables.
