  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and capital-structure risks
        blocks:
          - type: paragraph
            body: >-
              The first risk cluster sits at the intersection of transaction mechanics, disclosure posture, and capital
              sufficiency. Quantum is still a pre-close SPAC target as of the run date, so the public valuation and
              balance-sheet story remains conditional on closing, redemptions, financing completion, and the usual
              transaction approvals. The investor presentation and related 8-K materials present a well-funded picture
              assuming zero redemptions and a large convertible PIPE, but those same assumptions create execution
              sensitivity: if trust proceeds fall, if closing timing slips, or if the PIPE economics become more
              dilutive in practice, the runway available for Ranger, Tulsa, and follow-on mission preparation changes
              materially. Legal and disclosure risk also matter because much of the public case relies on projections,
              pipeline narratives, and forward-looking milestone statements rather than delivered operating history.
              This does not imply misconduct; it means investors are underwriting an ambitious defense-space build with
              limited historical cash-generation proof. In practical terms, the key question is whether financing
              certainty stays ahead of hardware and mission burn. If not, program timing, supplier commitments, and
              hiring plans can all compress simultaneously.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
