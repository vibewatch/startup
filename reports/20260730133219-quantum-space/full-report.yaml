  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context and comparable frame
        blocks:
          - type: paragraph
            body: >-
              Quantum enters valuation as a private company using a SPAC path to establish a public-market reference
              point before its flagship platform has flown. The announced deal values the company at roughly $600
              million pre-money and about $1.2 billion of post-transaction equity value, supported by a trust account
              and a large convertible PIPE if the closing assumptions hold. In absolute terms, that price is below many
              public-space winners and above weaker or distressed space names, which is why it can sound superficially
              reasonable. The harder question is whether the business has already earned that middle-ground positioning.
              Today the answer is only partly. Public comparables show a very wide spread in market cap outcomes across
              space companies, from sub-$100 million for troubled platforms to multi-billion-dollar valuations for
              businesses with stronger revenue bases, better proof points, or clearer investor enthusiasm. Quantum's
              $1.2 billion marker therefore sits in an investable band, but not yet in a de-risked band. The valuation
              frame should be read as an execution-weighted option on national-security orbital mobility rather than as
              a proved cash-flow multiple on an already scaled business.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
