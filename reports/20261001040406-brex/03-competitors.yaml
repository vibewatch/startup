    title: "Bank Ownership and Competitive Displacement"
    body: "Brex's integration into Capital One exposes it to aggressive customer poaching from independent competitors like Ramp and Mercury, who cite bank bureaucracy, conservative underwriting, and slower roadmap velocity to win disenfranchised startup accounts."
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP015"
  - calloutType: "strength"
    title: "Global Multi-Entity Issuance Advantage"
    body: "Brex retains a defensible competitive moat against domestic-only spend management tools through its local-currency card issuance across 50+ countries and support for complex multi-entity enterprise hierarchies."
