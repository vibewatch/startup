callouts:
  - calloutType: "insight"
    title: "The Fintech Infrastructure Abstraction"
    body: "Brex's product achievement is presenting a unified financial experience while orchestrating a complex, fragmented web of third-party partners: Column N.A. for deposit checking, Emigrant and Fifth Third for Mastercard issuing, Sutton Bank for Visa issuing, Brex Treasury LLC for money-market funds, and Brex Payments LLC for money transmission. The acquisition by Capital One creates a strategic imperative to collapse these third-party dependencies onto Capital One's internal bank charter and processing infrastructure."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
  - calloutType: "risk"
    title: "Developer Integration Constraints and SLA Protections"
    body: "Enterprise IT leaders building custom workflows on Brex must recognize significant contractual constraints: Brex's developer agreement expressly disclaims warranties that API access will be uninterrupted, error-free, or secure, caps maximum liability for any cause of action to the greater of total API fees paid or ten dollars ($10), and enforces a mandatory jury trial waiver. These terms reflect a customer-facing integration tool rather than an enterprise-grade API platform with financial SLA guarantees."
    claimRefs:
      - "CE009"
      - "CE010"
