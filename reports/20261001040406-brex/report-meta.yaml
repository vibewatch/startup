companyProfile:
  summary: >-
    Brex is a corporate spend management and financial workflows company founded in 2017 by Pedro Franceschi and
    Henrique Dubugras. It began with cash-underwritten corporate cards for startups, expanded into expense management,
    bill pay, business accounts, and treasury, and was acquired by Capital One in 2026 for $5.15 billion. The business
    now operates as a wholly owned subsidiary, with its value proposition tied to enterprise spend management and
    Capital One integration rather than independent venture-scale optionality.
