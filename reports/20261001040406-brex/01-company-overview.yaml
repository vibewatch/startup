chapter:
  number: 1
  title: "Company Overview"
  summary: "Brex is a spend management and corporate payments platform founded in 2017 that scaled from venture-backed startup cards to an enterprise spend platform before being acquired by Capital One in 2026 for $5.15 billion. The acquisition crystallises a 58% valuation discount from its 2022 private peak of $12.3 billion, transitioning the business into a wholly owned bank subsidiary."
sections:
  - id: "identity-and-corporate-status"
    title: "Corporate Identity, Stage, and Acquisition Structure"
    body: "Brex was founded on January 3, 2017, by Brazilian entrepreneurs Pedro Franceschi and Henrique Dubugras after completing the Y Combinator accelerator program. The company revolutionized corporate finance for high-growth technology companies by providing corporate credit cards without personal guarantees, underwriting accounts using real-time cash balances rather than traditional FICO credit scores. Over its operating history, Brex expanded from startup charge cards into a comprehensive financial software platform combining spend management, expense automation, bill pay, and treasury services. In January 2026, Capital One Financial Corporation announced a definitive agreement to acquire Brex in a stock and cash transaction valued at $5.15 billion, with the transaction closing on April 7, 2026. Following the acquisition, Brex LLC operates as a wholly owned subsidiary of Capital One, N.A., maintaining corporate headquarters in Salt Lake City, Utah, and major operational offices in San Francisco, California."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO005"
      - "CO013"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "leadership-and-governance"
    title: "Founders, Executive Leadership, and Governance Post-Acquisition"
    body: "Brex was conceived and established by co-founders Pedro Franceschi and Henrique Dubugras, who previously built and sold Brazilian payments gateway Pagar.me prior to entering Y Combinator in 2017. Under the acquisition agreement with Capital One, Pedro Franceschi continues in his role as Chief Executive Officer of Brex, leading the platform as an operating subsidiary within Capital One's commercial banking and payments structure. Governance and strategic oversight have transitioned from an independent private board of directors to Capital One corporate executive leadership headed by Founder, Chairman, and CEO Richard D. Fairbank. While co-founder Henrique Dubugras stepped back from day-to-day chief executive duties prior to the transaction, key-person continuity around Franceschi remains central to preserving Brex's product culture, engineering velocity, and technical integration with Capital One's cloud-native banking infrastructure."
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-stakeholder-map"
    title: "Capitalization History, Valuation Trajectory, and Stakeholders"
    body: "Across eight primary equity and debt financing rounds prior to acquisition, Brex raised approximately $1.5 billion in cumulative capital to finance aggressive customer acquisition, product expansion, and credit facility warehousing. The company's equity capitalisation attracted tier-one venture capital firms including Greenoaks Capital Partners, Ribbit Capital, Y Combinator, Kleiner Perkins, and Lone Pine Capital, pushing Brex's post-money valuation to a peak of $12.3 billion in January 2022 during its Series D-2 round. To support commercial card receivables and liquidity, Brex secured conventional and venture debt facilities from institutional lenders including Barclays, Credit Suisse, Silicon Valley Bank, and Citi. The January 2026 sale to Capital One for $5.15 billion in cash and stock closed the company's private venture lifecycle at an approximate 58% discount to its 2022 peak, providing an exit for early equity holders while re-anchoring ongoing equity upside to Capital One equity performance."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "operational-scale-and-milestones"
    title: "Operational Scale, Metrics, and Strategic Milestones"
    body: "Brex's operational scale serves over 25,000 corporate customers, including major technology enterprises such as DoorDash, Anthropic, TikTok, Robinhood, Zoom, Plaid, and Intel. The platform reported achieving $500 million in annual revenue in 2024 and 2025, supported by a workforce estimated between 1,100 and 1,500 employees as of early 2026. Brex's corporate trajectory reflects distinct development phases: pioneering startup credit underwriting in 2017, surviving the 2020 pandemic spend contraction, raising hyper-growth capital through 2022, pivoting from unprofitable SMB accounts toward mid-market and enterprise spend management in 2022–2024, and finally consolidating into Capital One in 2026. While competitor benchmarks highlight tightening underwriting standards and integration uncertainties following bank ownership, Brex maintains a substantial presence across venture-backed technology ecosystems and global enterprise disbursements."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO014"
      - "CO015"
    tableRefs: []
    figureRefs:
      - "FO001"
