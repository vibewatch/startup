callouts:
  - calloutType: "risk"
    title: "Underwriting Volatility and Working Capital Vulnerability"
    body: "Brex's automated underwriting ties corporate card limits directly to bank balance levels. High-growth startups with lumpy enterprise receivables or concentrated ad spend risk sudden, automated card limit reductions during runway burn down cycles, creating liquidity friction without credit default."
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR011"
  - calloutType: "recommendation"
    title: "Pre-Renewal Diligence on Bank Integration and Banking Redundancy"
    body: "Finance teams deploying Brex should establish secondary corporate card and banking redundancies to buffer against partner bank transitions from Column N.A. to Capital One infrastructure, while monitoring contractual fee realization on international card spend."
    claimRefs:
