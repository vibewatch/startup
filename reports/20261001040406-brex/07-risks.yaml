sections:
  - id: "regulatory-and-legal-risks"
    title: "Regulatory Compliance, Bank Supervision, and Legal Posture"
    body: "Following the closing of its acquisition by Capital One, N.A. on April 7, 2026, Brex LLC operates as an operating subsidiary of a regulated bank holding company. This corporate ownership change fundamentally alters the company's supervisory posture, subjecting its commercial operations to direct examination by federal regulators including the Office of the Comptroller of the Currency (OCC), the Federal Reserve Board, and the Financial Industry Regulatory Authority (FINRA). Brex has responded by scaling an internal regulatory affairs organization to interface with Capital One's enterprise compliance teams and manage supervisory exam cycles. Simultaneously, Brex Treasury LLC continues to manage self-directed cash management accounts as a registered broker-dealer, maintaining explicit disclaimers that it does not provide investment advisory services. Customer dispute exposure is governed by mandatory pre-dispute arbitration clauses under FINRA and JAMS rules alongside express jury trial waivers across commercial treasury and API access agreements."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR001"
  - id: "operational-security-and-platform-risks"
    title: "Operational Execution, API Reliability, and Customer Support Friction"
    body: "Brex's software and card infrastructure carries material operational and contractually capped platform exposure. Under the Brex Access Agreement governing its developer application programming interfaces, Brex disclaims any warranty that platform services will function without interruption or software defects, while contractually capping aggregate entity liability to customer fees paid or ten dollars. Third-party developers and enterprise customers bear the burden of maintaining rigorous information security controls, with an affirmative duty to report any suspected data security incident within 48 hours. Externally, user review aggregates highlight operational friction: while B2B directory ratings average 4.0 out of 5 stars across 2,300 reviews, consumer and small business sentiment on Trustpilot remains deeply underwater at 1.7 out of 5 across 569 reviews. The negative feedback cites abrupt account closures, verification freezes, and support response latency. Furthermore, enterprise total cost of ownership is subject to creep through contractually permitted 3% foreign exchange markups and seat overage fees."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR014"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "partner-dependencies-and-credit-underwriting-risks"
    title: "Counterparty Concentration, Credit Underwriting Dynamics, and Treasury Structure"
    body: "Despite its acquisition by a major national bank, Brex maintains structural counterparty dependencies that introduce transition and execution risks. Brex is not an independently chartered bank and continues to route operational checking accounts and demand deposits through Column N.A., while parking yield-bearing cash in the Dreyfus Government Cash Management Fund via custody at BNY Mellon. On the lending side, Brex differentiates its commercial corporate cards through automated underwriting that sizes credit limits dynamically against real-time operational account balances, monthly cash burn, and venture funding rather than personal guarantees. While this model expands borrowing capacity for venture-backed startups 10 to 20 times above legacy bank cards, it creates severe volatility: sudden declines in cash balance trigger immediate automated credit limit reductions, presenting working capital disruption for high-spend businesses. Strict account eligibility rules also require $50,000 to $500,000 in cash reserves while barring sole proprietorships."
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
    tableRefs:
      - "TR003"
  - id: "capital-one-integration-and-thesis-break-triggers"
    title: "Capital One Integration Trajectory and Thesis-Break Kill Criteria"
    body: "The commercial outcome of Brex's $5.15 billion sale to Capital One in April 2026 crystallised a 58% valuation haircut relative to its $12.3 billion peak private valuation, reflecting slowing top-line growth after annual revenue flattened at $500 million across 2024 and 2025. Key integration risks center on whether Capital One's institutional risk models will enforce more conservative underwriting guidelines, curtailing the rapid credit access that defines Brex's core value proposition for early-stage companies. Investors and enterprise buyers must monitor specific thesis-break triggers: regulatory directives from the OCC requiring tighter capital reserves against non-guaranteed corporate charge cards, potential partner bank dislocation if Column N.A. or BNY Mellon arrangements are terminated before native Capital One systems are ready, and leadership or product velocity attrition that could accelerate customer churn toward independent competitors."
    claimRefs:
      - "CR001"
      - "CR008"
      - "CR012"
      - "CR013"
