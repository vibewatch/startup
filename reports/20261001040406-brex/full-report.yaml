      - number: '6.3'
        title: Named Customer Deployments and Case Evidence
        blocks:
          - type: paragraph
            body: >-
              Brex maintains a roster of marquee enterprise and high-growth customer references that validate production
              deployment across mission-critical financial workflows. Prominent disclosed clients include consumer and
              enterprise technology leaders such as DoorDash, Coinbase, Robinhood, Zoom, Plaid, Reddit, SeatGeek,
              ServiceTitan, Anthropic, Wiz, and Sonos. Independent engineering disclosures confirm that Brex's internal
              architecture itself mirrors these complex enterprise demands, executing centralized authorization
              infrastructure via Oso to support fine-grained role-based and relationship-based access controls for
              cross-tenant enterprise security. Case studies from technical partners highlight that Brex saves an
              estimated 11 million employee hours through automated receipt categorization, machine-learning-driven
              expense classification, and automated policy validation at the point of purchase. Despite these prominent
              enterprise logos, public case proof remains heavily concentrated in high-profile venture-backed technology
              startups and digital-native tech corporations, leaving traditional industrial, non-profit, and
              brick-and-mortar commercial adoption relatively unproven.
            claimRefs:
