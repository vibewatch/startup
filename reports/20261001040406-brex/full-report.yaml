  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Bank Supervision, and Legal Posture
        blocks:
          - type: paragraph
            body: >-
              Following the closing of its acquisition by Capital One, N.A. on April 7, 2026, Brex LLC operates as an
              operating subsidiary of a regulated bank holding company. This corporate ownership change fundamentally
              alters the company's supervisory posture, subjecting its commercial operations to direct examination by
              federal regulators including the Office of the Comptroller of the Currency (OCC), the Federal Reserve
              Board, and the Financial Industry Regulatory Authority (FINRA). Brex has responded by scaling an internal
              regulatory affairs organization to interface with Capital One's enterprise compliance teams and manage
              supervisory exam cycles. Simultaneously, Brex Treasury LLC continues to manage self-directed cash
              management accounts as a registered broker-dealer, maintaining explicit disclaimers that it does not
              provide investment advisory services. Customer dispute exposure is governed by mandatory pre-dispute
              arbitration clauses under FINRA and JAMS rules alongside express jury trial waivers across commercial
              treasury and API access agreements.
            claimRefs:
              - CR001
              - CR002
              - CR003
