      - number: '7.3'
        title: Counterparty Concentration, Credit Underwriting Dynamics, and Treasury Structure
        blocks:
          - type: paragraph
            body: >-
              Despite its acquisition by a major national bank, Brex maintains structural counterparty dependencies that
              introduce transition and execution risks. Brex is not an independently chartered bank and continues to
              route operational checking accounts and demand deposits through Column N.A., while parking yield-bearing
              cash in the Dreyfus Government Cash Management Fund via custody at BNY Mellon. On the lending side, Brex
              differentiates its commercial corporate cards through automated underwriting that sizes credit limits
              dynamically against real-time operational account balances, monthly cash burn, and venture funding rather
              than personal guarantees. While this model expands borrowing capacity for venture-backed startups 10 to 20
              times above legacy bank cards, it creates severe volatility: sudden declines in cash balance trigger
              immediate automated credit limit reductions, presenting working capital disruption for high-spend
              businesses. Strict account eligibility rules also require $50,000 to $500,000 in cash reserves while
              barring sole proprietorships.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
