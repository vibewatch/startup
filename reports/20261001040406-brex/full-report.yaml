      - number: '7.2'
        title: Operational Execution, API Reliability, and Customer Support Friction
        blocks:
          - type: paragraph
            body: >-
              Brex's software and card infrastructure carries material operational and contractually capped platform
              exposure. Under the Brex Access Agreement governing its developer application programming interfaces, Brex
              disclaims any warranty that platform services will function without interruption or software defects,
              while contractually capping aggregate entity liability to customer fees paid or ten dollars. Third-party
              developers and enterprise customers bear the burden of maintaining rigorous information security controls,
              with an affirmative duty to report any suspected data security incident within 48 hours. Externally, user
              review aggregates highlight operational friction: while B2B directory ratings average 4.0 out of 5 stars
              across 2,300 reviews, consumer and small business sentiment on Trustpilot remains deeply underwater at 1.7
              out of 5 across 569 reviews. The negative feedback cites abrupt account closures, verification freezes,
              and support response latency. Furthermore, enterprise total cost of ownership is subject to creep through
              contractually permitted 3% foreign exchange markups and seat overage fees.
