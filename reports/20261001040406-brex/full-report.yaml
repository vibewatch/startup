      - number: '4.2'
        title: Traction, cost signals, and capital position
        blocks:
          - type: paragraph
            body: >-
              Public traction measures are not cleanly comparable. GetLatka labels $500 million as 2025 revenue, while W
              Fintechs relays a Sacra estimate of about $700 million in annualized revenue by August 2025 with roughly
              50% year-over-year growth. Revenue for a completed year is not ARR or an annualized run rate, and neither
              figure is presented here as audited. Historical operating signals are similarly directional: W Fintechs
              reported burn of about $17 million per month, a roughly 90% year-over-year reduction in cash burn in the
              first quarter of 2024, and a CEO statement that gross profit had grown more than 75% in the prior year.
              Those observations show a past efficiency program, not current profitability or cash generation. Brex's
              April 2026 legal agreement identifies Brex LLC as a wholly owned Capital One subsidiary. Parent ownership
              changes the capital context, but the retained evidence does not disclose a standalone Brex cash balance,
              current burn, committed parent funding, debt obligations, transfer-pricing arrangements, or a segment
              income statement.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
              - CI015
      - number: '4.3'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality cannot be underwritten from the available public evidence. The product breadth and
              embedded finance workflows create multiple monetization opportunities, but the evidence does not reveal
              how much revenue is recurring software, transaction-sensitive, spread-dependent, rewards-offset, or
              cross-subsidized. Historical go-to-market evidence is promising but insufficient: W Fintechs reported that
              concentrated San Francisco billboard inventory cost close to $300,000, while an analysis of the early
              pitch deck found card-volume growth during a referral-only private beta but no absolute scale, CAC, or
              referral-rate disclosure. Competitor commentary also flags uncertainty around post-acquisition pricing,
              underwriting, roadmap, and customer priorities; that is an adverse hypothesis, not proof that terms have
              changed. The financial stance is therefore evidence-constrained: Brex may have stronger strategic backing
              inside Capital One, but audited revenue recognition, gross margin, cohort NRR, CAC/payback, credit losses,
              current cash usage, and parent support terms are required before judging durable profitability or capital
              adequacy.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public scale signals are not an auditable revenue bridge
            body: >-
              The retained sources report both $500 million of 2025 revenue and about $700 million of annualized revenue
              by August 2025. Their periods, definitions, and provenance differ, so neither should be converted into
              ARR, margin, or current post-acquisition performance without primary financial records.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: callout
            title: Underwrite the Capital One relationship explicitly
            body: >-
              Treat Brex as a wholly owned subsidiary, but do not assume the parent's balance sheet is freely available
              to Brex. Request segment reporting, liquidity access, guarantees, internal funding charges, and investment
              commitments.
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Module Map
        blocks:
          - type: paragraph
            body: >-
              Brex provides a unified corporate financial operating platform that integrates corporate credit cards,
              expense management, accounts payable (Bill Pay), business checking, and cash management into a single
              multi-entity dashboard. Rather than operating disjointed financial tools, finance teams configure unified
              spend controls, custom approval hierarchies, and automated accounting sync rules that apply across
              physical cards, virtual cards, reimbursement requests, and vendor invoices. The core product suite is
              segmented into four primary modules: Corporate Cards with dynamic underwriting, Expense Management with
              automated receipt matching and policy enforcement, Bill Pay with purchase order matching and multi-rail
              disbursements, and Business Accounts combining commercial checking with treasury yield options. In the
              2026 operating environment, software pricing starts at a zero-dollar tier with premium enterprise
              capabilities offered at twelve dollars per user per month.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
      - number: '5.2'
        title: Operating Model, Partner Banking Substrate, and API Architecture
        blocks:
          - type: paragraph
            body: >-
              Brex's technical architecture is built as a software and workflow orchestration layer on top of
              specialized regulated partner institutions rather than a monolithic full-stack bank. Commercial checking
              accounts are provided through Column N.A., an unaffiliated Member FDIC institution. Corporate credit card
              issuance is distributed across partner banks including Emigrant Bank, Fifth Third Bank N.A., and Airwallex
              (Netherlands) B.V. for Mastercard programs, alongside Sutton Bank for Visa commercial cards. Treasury cash
              management is administered via Brex Treasury LLC, a FINRA/SIPC registered entity that routes idle client
              funds into institutional money-market funds like DGVXX, while cash sweep balances in the Vault product
              achieve pass-through FDIC insurance eligibility only upon settlement at designated program banks. Money
              movement across ACH, domestic wire, and physical check disbursements is executed through Brex Payments
