  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation, Confidence, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              Brex's operating trajectory reached a definitive strategic conclusion on April 7, 2026, when Capital One
              Financial Corp. completed its acquisition of Brex for $5.15 billion in a balanced 50% cash and 50% stock
              transaction. This definitive transaction establishes an unambiguous boundary for venture investors: the
              standalone growth equity thesis has concluded, replaced by bank subsidiary operations within Capital One,
              N.A. Consequently, the diligence stance recommends AVOID on any secondary private equity transactions or
              unvested option funding, and assigns a valuation stance of STRETCHED against historical venture
              benchmarks. While the $5.15 billion valuation represents a workable strategic recovery for early-stage
              backers, it crystallizes a severe 58% valuation haircut relative to the company's $12.3 billion peak
              post-money valuation established in its January 2022 Series D-2 financing. Confidence in this
              recommendation is rated high because the transaction has closed, eliminating speculative independence
              hypotheses and leaving remaining valuation upside directly tied to public Capital One share performance
              and banking integration synergies.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
