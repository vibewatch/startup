      - number: '6.4'
        title: Retention Dynamics and Acquisition Disruption
        blocks:
          - type: paragraph
            body: >-
              Customer retention and account durability face material headwind following the close of Capital One's
              $5.15 billion acquisition of Brex on April 7, 2026. The acquisition represents a 58% decline from Brex's
              peak $12.3 billion private valuation, signaling a decisive shift toward bank-led governance, centralized
              compliance, and conservative underwriting. Competitors including Airwallex, Ramp, and Mercury are
              aggressively executing displacement campaigns aimed at venture-backed founders and corporate controllers
              concerned about bureaucratic friction, credit line fluctuations, and slowed feature velocity under Capital
              One Commercial oversight. Historically, Brex underwrote startups dynamically against cash on hand rather
              than traditional debt service coverage or multi-year balance sheet histories. As Capital One integrates
              Brex into its national bank holding structure, finance leaders report heightened anxiety that credit
              underwriting will become more restrictive and conservative. Furthermore, specialized customer segments
              such as 501(c)(3) non-profits and faith-based organizations experience substantial procurement friction
              due to lack of native fund accounting integrations, prompting account migrations toward dedicated vertical
              expense alternatives.
            claimRefs:
              - CU003
              - CU004
              - CU012
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Post-Acquisition Bank Governance Disruption
            body: >-
              The April 7, 2026 closing of Brex's acquisition by Capital One for $5.15 billion creates an immediate
              retention vulnerability among venture-backed startups. Challenger platforms such as Airwallex and Ramp are
              actively leveraging founder fears of conservative, bank-led underwriting and decelerated product
              development to capture migrating accounts.
            calloutType: risk
