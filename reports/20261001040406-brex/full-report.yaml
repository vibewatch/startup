      - number: '7.4'
        title: Capital One Integration Trajectory and Thesis-Break Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The commercial outcome of Brex's $5.15 billion sale to Capital One in April 2026 crystallised a 58%
              valuation haircut relative to its $12.3 billion peak private valuation, reflecting slowing top-line growth
              after annual revenue flattened at $500 million across 2024 and 2025. Key integration risks center on
              whether Capital One's institutional risk models will enforce more conservative underwriting guidelines,
              curtailing the rapid credit access that defines Brex's core value proposition for early-stage companies.
              Investors and enterprise buyers must monitor specific thesis-break triggers: regulatory directives from
              the OCC requiring tighter capital reserves against non-guaranteed corporate charge cards, potential
              partner bank dislocation if Column N.A. or BNY Mellon arrangements are terminated before native Capital
              One systems are ready, and leadership or product velocity attrition that could accelerate customer churn
              toward independent competitors.
            claimRefs:
              - CR001
              - CR008
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting Volatility and Working Capital Vulnerability
            body: >-
              Brex's automated underwriting ties corporate card limits directly to bank balance levels. High-growth
              startups with lumpy enterprise receivables or concentrated ad spend risk sudden, automated card limit
              reductions during runway burn down cycles, creating liquidity friction without credit default.
            calloutType: risk
            claimRefs:
              - CR008
              - CR009
              - CR011
          - type: callout
            title: Pre-Renewal Diligence on Bank Integration and Banking Redundancy
            body: >-
              Finance teams deploying Brex should establish secondary corporate card and banking redundancies to buffer
              against partner bank transitions from Column N.A. to Capital One infrastructure, while monitoring
              contractual fee realization on international card spend.
            calloutType: recommendation
            claimRefs:
              - CR001
