  - id: TV002
    title: Thesis and Anti-Thesis Register
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - Investment Thesis (Strategic Exit)
        - >-
          Capital One secured an enterprise-grade card and spend management software platform at a 58% discount to peak
          valuation.
        - Acquisition closed at $5.15B ($2.75B cash + 10.6M COF shares) with Brex generating ~$500M ARR.
        - >-
          Failure of Capital One to cross-sell Brex into commercial bank accounts or severe enterprise customer
          attrition.
      - - Investment Thesis (Product Strength)
        - >-
          Brex retains strong enterprise customer retention, multi-currency corporate card issuance in 50+ countries,
          and proprietary underwriting.
        - 25,000+ business customers, high card limits underwritten against cash, and global local-currency issuance.
        - Loss of key enterprise accounts or rapid feature parity from Ramp in global spend orchestration.
      - - Anti-Thesis (Valuation Destruction)
        - >-
          Late-stage venture investors suffered severe capital destruction, with Series D marks written down 58% and
          2019 rounds returning only 1.2x–1.3x over 6.5 years.
        - $5.15B exit vs. $12.3B Series D-2 mark in 2022; dilution eroded Series C/D gains.
        - Substantial post-close appreciation in Capital One stock held by selling shareholders.
      - - Anti-Thesis (Execution & Competitive Loss)
        - >-
          Brex surrendered SMB market leadership to Ramp, exited smaller businesses, and was forced to sell to an
          incumbent bank to survive.
        - >-
          Ramp valued at $32B–$44B in 2025–2026; Delian Asparouhov 'GG WP' comment; Brex CBO acknowledged public market
          reset.
        - Brex accelerating independent growth under Capital One charter to re-take market leadership from Ramp.
    notes: >-
      Thesis and anti-thesis synthesis based on reported acquisition terms, historical financing rounds, and competitor
      valuation trajectories.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV010
      - CV011
  - id: TV003
    title: Bull, Base, and Bear Valuation Scenarios
    columns:
      - Scenario
      - Probability Signal
      - Core Operating Assumptions
      - Implied Valuation / Return Logic
      - Downside Triggers / Key Risks
    rows:
      - - Bull Case (Bank Synergy Realization)
        - 25% (Moderate)
        - >-
          Capital One accelerates Brex enterprise expansion, reduces deposit funding costs, and drives ARR to $800M+
          with 65%+ gross margin.
        - Implied asset value of $7.5B–$9.0B within Capital One portfolio (12x–14x ARR); COF stock surges 30%+.
        - Enterprise customer churn during bank technology integration; departure of key engineering leads.
      - - Base Case (Stable Corporate Division)
        - 55% (High)
        - Brex maintains ~$500M–$600M ARR with moderate 15–20% growth; operates as semi-autonomous subsidiary Brex LLC.
        - Realizes baseline transaction value of $5.15B (~10.3x ARR); modest capital efficiency gains for Capital One.
        - Margin compression from interchange pressure; intensifying competition from Ramp and legacy banks.
      - - Bear Case (Integration Friction & Attrition)
        - 20% (Low-Moderate)
        - >-
          Bank regulatory friction and bureaucratic slowdown cause talent exodus; enterprise renewals decline; ARR
          flattens below $450M.
        - Implied standalone value falls to $3.0B–$3.5B (6x–7x ARR); Capital One incurs goodwill impairment.
        - Rapid migration of tech-native clients to Ramp; culture clash between fintech speed and bank compliance.
    notes: >-
      Scenario analysis models post-acquisition asset value to Capital One Financial Corp and residual value of equity
      consideration.
