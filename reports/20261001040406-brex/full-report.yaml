      - number: '6.2'
        title: Adoption Trajectory and Platform Scale
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Brex reflects substantial platform throughput and accelerating software
              utilization across its customer base. By 2026, Brex reported more than 35,000 active customers driving
              transaction volume across its corporate card, bill pay, and treasury networks. Internal benchmarking data
              published in May 2026 indicates that aggregate customer transaction patterns have increasingly
              concentrated in generative artificial intelligence infrastructure, developer tools, and workflow
              abstraction platforms, demonstrating high software spend intensity among its client base. Total annualized
              corporate revenue achieved the $500 million threshold as of late 2024 and 2025, driven by a combination of
              interchange fees from card processing and high-margin recurring SaaS subscription revenue from Brex
              Empower and Premium tiers priced at $12 per user per month. Engineering case evidence demonstrates that
              the platform processes billions of authorization decisions daily across tens of millions of facts while
              sustaining sub-10 millisecond decision latency at scale. However, the exact expansion metrics, Net Revenue
              Retention (NRR), and Gross Revenue Retention (GRR) remain undisclosed private metrics, creating analytical
              uncertainty regarding true underlying cohort durability and organic expansion across non-AI tech
              verticals.
            claimRefs:
              - CU001
              - CU004
