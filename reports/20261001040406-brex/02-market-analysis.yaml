callouts:
  - calloutType: "insight"
    title: "The B2B Payments Card Penetration Paradox"
    body: "While US commercial B2B payment flows ($25T) are almost three times larger than consumer payments, credit cards account for only ~4% of commercial transactions. Checks and ACH continue to dominate commercial settlements due to legacy supplier invoicing practices, merchant processing fees, and historical bank underwriting friction. Fintech platforms that capture non-card accounts payable alongside charge card interchange command a broader addressable market than standalone corporate card issuers."
    claimRefs:
      - "CM005"
      - "CM006"
  - calloutType: "risk"
    title: "Post-Acquisition Bank Integration and Startup Alignment Risk"
    body: "Following Capital One's $5.15B acquisition in April 2026, Brex must navigate the transition from an agile standalone venture-backed challenger into a federally regulated commercial bank subsidiary. Potential alignment risks include tightened underwriting standards on early-stage accounts, shifting corporate focus toward Capital One's traditional commercial clients, and organizational friction that could impede software product development velocity."
    claimRefs:
      - "CM008"
      - "CM016"
