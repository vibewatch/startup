            body: >-
              现有公开证据无法完成针对营收质量的尽调核保。尽管产品广度与嵌入式金融工作流创造了多元变现抓手，但证据无法明确经常性软件收入、交易敏感型收入、利差依赖型收入、积分对冲成本或交叉补贴的具体占比。历史获客证据虽有亮点但并不充分：W
              Fintechs 披露其在旧金山集中投放的广告牌耗资接近 $300,000，而对早期路演材料的梳理仅显示其在纯推荐邀请内测期间发卡量快速增长，未披露绝对规模、CAC
              或转介绍率。竞品分析亦指出收购后其定价、核保政策、产品演进与客户优先级的走向存在不确定性；这属于下行情景假设，而非条款已实质改变的实锤。因此，财务评估受制于信息断层：Brex 在 Capital One
              体系内或将获得更坚实的战略支撑，但唯有获取审计后收入确认明细、毛利率、分客群 NRR、CAC/回收期、坏账率、当前现金消耗及母公司支持协议，方能审慎判断其长期盈利能力或资本充裕度。
