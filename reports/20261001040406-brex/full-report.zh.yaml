  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与模块功能图谱
        blocks:
          - type: paragraph
            body: >-
              Brex 构建了一体化企业财务操作系统，将企业信用卡、费用管理、应付账款（Bill
              Pay）、商业支票账户及现金管理聚合于统一的多实体管理后台。财务团队无需在割裂的工具间切换，即可统一配置贯穿实体卡、虚拟卡、报销申请及供应商发票的支出管控规则、定制化审批流和自动化财务对账规则。核心产品矩阵细分为四大支柱模块：具备动态核保能力的企业信用卡、支持自动化小票匹配与合规审计的费用管理、具备采购订单匹配与多通道划拨能力的账单支付，以及融合商业支票与高收益财资选项的商业账户。在
              2026 年运营环境下，软件定价提供零美元基础档，高级企业功能定价为每用户每月十二美元。
            claimRefs:
