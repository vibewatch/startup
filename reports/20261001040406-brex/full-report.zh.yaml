      - number: '1.4'
        title: 业务规模、经营指标与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              Brex 的业务规模已覆盖超 25,000 家企业客户，包括 DoorDash、Anthropic、TikTok、Robinhood、Zoom、Plaid 以及 Intel 等大型科技企业。平台据报道在 2024
              与 2025 年均达到 $500 million 年度营收，截至 2026 年初员工规模估计在 1,100 至 1,500 人之间。Brex 的发展路径可分为几个鲜明阶段：2017
              年首创初创企业信用核保模式，2020 年渡过疫情导致的支出萎缩期，截至 2022 年完成超常规资本扩张，2022 至 2024 年战略性放弃非盈利性 SMB 账户转向中型市场与大型企业支出管理，并最终于 2026
              年并入 Capital One。尽管竞品对标凸显出银行接管后核保标准收紧以及整合不确定性，Brex 在风投科技生态体系和全球企业资金划拨领域依然占据可观市场份额。
