      - number: '5.2'
        title: 运营模式、合作银行底层与 API 架构
        blocks:
          - type: paragraph
            body: >-
              Brex 的底层技术架构定位于构建在专业持牌合作机构之上的软件与工作流编排层，而非单一牌照的全能银行。商业支票账户由非关联 FDIC 成员机构 Column N.A. 提供。企业信用卡发卡分散在多家合作银行，其中
              Mastercard 项目涵盖 Emigrant Bank、Fifth Third Bank N.A. 及 Airwallex (Netherlands) B.V.，Visa 商业卡则依托 Sutton Bank
              发行。财资现金管理由 FINRA/SIPC 注册机构 Brex Treasury LLC 负责运营，该实体将客户闲置资金配置至 DGVXX 等机构级货币市场基金，而 Vault
              产品下的资金归集存款仅在结算至指定合作银行后方具备穿透式 FDIC 保险资格。ACH、美国境内电汇及纸质支票汇兑由持有 NMLS #2035354 牌照的货币服务商 Brex Payments LLC
              执行。外部开发者及大型企业 IT 团队通过 Brex REST API 对接系统，该 API 遵循 OpenAPI 标准规范，在严苛赔偿限额条款下对外开放会计、费用、支付与团队管理接口。
