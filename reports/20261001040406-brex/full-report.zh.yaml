            body: >-
              Brex
              被定位为涵盖企业卡、商业账户、财资管理、账单支付、差旅及支出管理工作流的综合财务平台，商业模式远超单一卡产品范畴。但公开资料并未披露交易卡手续费分成、软件订阅费、金融产品利差或服务费以及周边衍生服务各自的营收拆分比例。竞品对比报告显示，公司最后公开的挂牌价包括免费的
              Essentials 档以及每用户每月 $12 的 Premium 档，但这属于目录标价而非实际确认收入。Brex 自身的 API
              协议单方面保留了在通知后对超额使用收费的权利，但没有证据表明目前已实质性开征或形成规模收入。核保模型与还款周期同样塑造着单体经济模型：第三方评测指出，其信用额度基于企业现金、现金流及融资情况动态计算，按账户属性实行按日或按月清偿。这类机制能够压降信用敞口，但没有任何留存信源量化其各产品的损失率、刷卡分成收益率、积分激励成本、资金成本或毛利。
