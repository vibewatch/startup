              - CO004
              - CO005
      - number: '1.3'
        title: 股本演变历史、估值轨迹与核心利益方
        blocks:
          - type: paragraph
            body: >-
              在被收购前的 8 轮核心股权和债权融资中，Brex 累计融资约 $1.5 billion，用于支撑激进的获客扩张、产品线延伸以及信贷资产仓储授信。公司股权融资吸引了包括 Greenoaks Capital
              Partners、Ribbit Capital、Y Combinator、Kleiner Perkins 和 Lone Pine Capital 在内的顶级风投机构，在 2022 年 1 月完成 Series
              D-2 轮融资时，投后估值推升至 $12.3 billion 的峰值。为支撑商业信用卡应收账款和流动性，Brex 获得了来自 Barclays、Credit Suisse、Silicon Valley Bank
              和 Citi 等机构贷款方的传统信贷及风投债权授信。2026 年 1 月以 $5.15 billion 现金加股票出售给 Capital One，终结了公司的私有创投生命周期，交易对价较 2022
              年估值高点折价约 58%，为早期股权持有方提供了退出路径，同时将后续股权上行空间重新锚定于 Capital One 的股票表现。
