  summary: >-
    Brex 是一家企业支出管理与财务工作流公司，由 Pedro Franceschi 与 Henrique Dubugras 于 2017
    年创立。公司最初以基于实时现金余额核保的初创企业信用卡切入，随后拓展至费用管理、账单支付、商业账户与财资管理，并在 2026 年被 Capital One 以 $5.15 billion
    对价收购。目前该业务作为全资子公司运营，其核心价值主张绑定于大型企业支出管理与 Capital One 协同整合，而非独立风险投资规模扩张的期权价值。
