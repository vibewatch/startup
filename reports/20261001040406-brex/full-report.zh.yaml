            body: >-
              公开业务指标缺乏清晰可比性。GetLatka 将 2025 年营收标注为 $500 million，而 W Fintechs 引用的 Sacra 估算数据显示截至 2025 年 8 月年化营收约 $700
              million，同比增速约 50%。完整自然年营收不等同于 ARR 或年化运行率，且两项数据在此均不作为审计后结论采信。历史经营信号同样偏向方向性描述：W Fintechs 曾报道其月均烧钱约 $17
              million、2024 年一季度现金消耗同比收窄约 90%，且 CEO 曾公开宣称前一年毛利增长超 75%。这些数据只说明公司过去推行过降本增效，并不能证明当前具备盈利能力或现金造血能力。Brex 2026 年
              4 月签署的法律协议明确其为 Capital One 的全资子公司。母行所有权彻底改变了资本底座，但留存证据并未披露 Brex 的独立现金余额、当前消耗速度、母行注资承诺、债务负担、转让定价安排或分部损益表。
