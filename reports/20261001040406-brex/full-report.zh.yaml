chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业身份、发展阶段与收购架构
        blocks:
          - type: paragraph
            body: >-
              Brex 由巴西创业者 Pedro Franceschi 和 Henrique Dubugras 在结束 Y Combinator 加速营项目后于 2017-01-03
              创立。公司以无需个人担保的企业信用卡颠覆了高增长科技公司的企业财务体系，核保逻辑依托实时现金余额而非传统 FICO 信用评分。在运营历程中，Brex
              从初创企业记账卡拓展为集成支出管理、费用自动化、账单支付和财资服务的综合财务软件平台。2026 年 1 月，Capital One Financial Corporation
              宣布达成最终协议，以股票加现金方式收购 Brex，交易对价估值 $5.15 billion，并于 2026-04-07 完成交割。收购完成后，Brex LLC 作为 Capital One, N.A.
              的全资子公司运营，保持犹他州盐湖城总部以及加州旧金山核心运营办公地。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO013
