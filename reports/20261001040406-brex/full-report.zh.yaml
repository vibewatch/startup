          detail: Ramp 估值扩张至 $32B–$44B；Brex 从中小企业（SMB）客群收缩，转向大企业。
        - id: exit
          label: Capital One 收购
          detail: 最终收购协议于 2026 年 4 月 7 日交割，对价 $5.15B（50% 现金 / 50% Capital One 股票）。
        - id: haircut
          label: 估值折价与回报现实
          detail: 较 $12.3B 估值峰值折价 58%；2019–2022 年后期风险投资轮次遭受严重挤压。
        - id: integration
          label: 银行整合与公司治理
          detail: Brex LLC 成为 Capital One, N.A. 的全资子公司；保留品牌与 CEO。
        - id: recommendation
          label: 投资建议：回避
          detail: 回避流动性匮乏的交易前私募老股残余；持续跟踪 Capital One 投后整合执行。
      edges:
