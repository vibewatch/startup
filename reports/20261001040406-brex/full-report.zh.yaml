      - number: '5.3'
        title: 核心壁垒、工程研发能力与尽调风险点
        blocks:
          - type: paragraph
            body: >-
              Brex 的核心技术壁垒在于交易前策略决策引擎与自动化会计对账流，可直接将企业卡预授权逻辑与 ERP 总账科目及部门预算深度绑定。Brex 把合规规则前置到清算网络授权阶段，而不是只靠事后审计，因此
              显著减少了大型企业财务支出的跑冒滴漏。工程招聘画像显示其重点攻关分布式事务一致性、超低延迟授权引擎、多币种账本架构及数据驱动反欺诈系统。2026 年被 Capital One
              收购后，公司面临重大的架构与治理风险。开发者门户协议施加了严格的十美元法定损害赔偿责任上限及强制陪审团审判弃权条款，Brex 的实体保证条款中亦明确免除对 API
              不间断或零故障运行的担保。此外，技术尽调需高度关注 Brex 是否会逐步弃用碎片化的外部合作银行网络（Column、Emigrant、Sutton）而全面倒换至 Capital One
              的全国性银行牌照，此举将引发海量账户、账本余额及支付路由管道的超大规模系统迁移。另外，外部检索中频繁混入来自航空航天与国防技术出版物标准同名的 S1000D
              业务规则交换（BREX）数据模块，凸显出自动化技术尽调中业务领域语义消歧的重要性。
            claimRefs:
