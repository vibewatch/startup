  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户客群细分与买方画像
        blocks:
          - type: paragraph
            body: >-
              Brex 服务于两类截然不同的核心客群：获风投支持的科技初创企业，以及中型市场至大型跨国企业。Brex 早年深植于硅谷早期创投生态，曾一举囊括 75% 的 Y Combinator 孵化项目；此后，其战略性地将
              GTM 重心向中高端市场及全球大型企业客户倾斜。其核心买方画像兼顾初创创始人与早期 CEO（需要无个人担保的高额度企业记账卡），以及追求跨国统一支出管控、差旅自主策略与 ERP
              深度集成的大型机构财务总监、采购团队与 CFO。中型市场及大型企业账户面临硬性营收门槛，自筹资金企业要求月营收至少达到 $400,000 或年营收达到 $1
              million，而风投初创企业则依据流动现金余额核保，常规准入门槛为 $50,000。这种结构性分层形成了不同的业务落地场景：早期团队使用自动化企业卡和支票账户快速完成资金支出，而跨国集团则依赖其覆盖 50+
              国的本币发卡体系、多层级子公司风控，以及面向数千名员工的细粒度角色权限策略。
