  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 合规监管、银行审慎监管与法律诉讼风险
        blocks:
          - type: paragraph
            body: >-
              在 2026-04-07 被 Capital One, N.A. 收购交割后，Brex LLC
              正式作为受监管银行控股公司旗下的运营子公司运作。这一所有权变更从根本上改变了公司的监管定位，其商业运营直接纳入货币监理署（OCC）、美联储（Federal Reserve
              Board）以及金融业监管局（FINRA）等联邦监管机构的直接穿透审查。Brex 已扩建内部合规事务部门，对接 Capital One 集团风控合规团队并应对常态化审查周期。同时，Brex Treasury
              LLC 继续作为持牌券商运营自主管理的现金账户，并显式声明其不提供任何投资顾问服务。客户纠纷解决机制则受制于 FINRA 及 JAMS 仲裁规则项下的强制争议仲裁条款，并在商业财资及 API
              接入协议中全面嵌入了免除陪审团审判的声明。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营履约、API 可靠性与客户支持摩擦
        blocks:
          - type: paragraph
            body: >-
              Brex 的软件与信用卡基础设施存在不可忽视的运营敞口与严格的法定免责限制。在约束开发者接口的《Brex 访问协议》中，Brex
              明确声明不保证平台服务不会中断或毫无软件缺陷，并将公司最高累积赔偿限额封顶于客户实际支付的费用或十美元。外部开发者和大型企业客户须自行承担严密的信息安全风控义务，并承诺在发现任何疑似安全事件后 48
              小时内完成主动上报。从外部用户口碑聚合数据来看，运营服务瓶颈显现：B2B 软件目录评分在 2,300 条评价中均分达 4.0 / 5 星，但 Trustpilot 上的消费者及小微企业口碑深度探底至 1.7 /
              5 星（共 569 条评价）。负面反馈主要直指突发性封户、身份验证冻结以及客服响应迟缓。根据合同约定允许上浮的 3% 跨境汇率加价与超额席位增补费，也使得大型企业的实际总体拥有成本（TCO）面临暗中膨胀风险。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR014
