      - number: '3.2'
        title: 产品能力、定价策略与分销渠道对比
        blocks:
          - type: paragraph
            body: >-
              对主流企业支出平台的横向对比显示，各方在变现架构、软件管控和分销模式上存在显著分化。Brex 依托刷卡手续费分成以及 Premium 档每用户每月 $12 的软件费变现，而竞品采用了截然不同的定价模型：Ramp
              的基础企业卡、费用管理和 AP 自动化均免费开放，仅对 Ramp Plus 收取每用户每月 $15 并叠加企业定制档。相比之下，Coupa 和 SAP Concur
              等传统大型企业采购套件依赖不透明的定制合同，类似规模部署年费通常在 $5,000 至 $10,000 以上。功能上的决定性差异是事前拦截：Ramp
              在授权发生的瞬间执行管控策略，在结算前直接拦截违规交易并提供精细到商户级别的控制；Brex 则主要依赖类别级 MCC
              规则及交易后自动化对账。分销维度上，传统银行与大型企业套件依赖现成的财资合作网络与直销团队，新一代金融科技挑战者则主要依托产品驱动增长（PLG）、自动化入驻流程及风投生态圈推荐获客。
