      - number: '7.3'
        title: 交易对手集中度、信用核保动态与财资资金架构
        blocks:
          - type: paragraph
            body: >-
              尽管背靠大型全国性银行，Brex 依然保留着带来转型与执行风险的结构性交易对手依赖。Brex 并非独立持牌银行，日常运营支票账户及活期存款仍依托 Column N.A. 路由处理，收益型沉淀资金则通过 BNY
              Mellon 托管并投向德雷福斯政府现金管理基金（DGVXX）。在授信端，Brex
              商业企业卡的核心卖点在于自动化核保机制，即基于实时经营账户资金、月度现金消耗速度和风投资金到位情况动态计算额度，无需创始人背负个人连带责任。尽管该模式使风投初创企业的借贷杠杆较传统银行卡扩大十至二十
              倍，但同时也孕育了剧烈的波动风险：企业现金余额骤降会瞬时触发系统自动下调授信，为高开销企业的营运资金周转带来骤然冲击。严格的账户准入门槛要求保持 $50,000 至 $500,000
              的现金储备，并全面将个体工商户拒之门外。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
