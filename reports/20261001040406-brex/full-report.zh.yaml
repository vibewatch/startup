            body: >-
              Brex 的客户渗透轨迹体现出庞大的平台交易吞吐量以及客户对软件工具使用率的快速提升。截至 2026 年，Brex 披露拥有超 35,000 家活跃企业客户，驱动着企业卡、账单支付与财资网络的资金流转。2026
              年 5 月发布的内部对标基准数据显示，客户整体交易特征日益向生成式人工智能算力基础设施、开发者工具及工作流抽象平台集聚，凸显出客群极高的软件支出密度。截至 2024 年末与 2025 年，公司年化总营收跨越
