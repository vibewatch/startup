      - number: '1.2'
        title: 创始人、高管团队与收购后治理架构
        blocks:
          - type: paragraph
            body: >-
              Brex 由联合创始人 Pedro Franceschi 与 Henrique Dubugras 构思并创立，两人在 2017 年进入 Y Combinator 之前曾创立并出售巴西支付网关
              Pagar.me。根据与 Capital One 达成的收购协议，Pedro Franceschi 继续担任 Brex 首席执行官，在 Capital One
              商业银行与支付业务架构下主导该运营子公司。公司治理与战略监督权已从独立私有董事会移交至由创始人、董事长兼 CEO Richard D. Fairbank 领导的 Capital One 集团高管层。虽然联合创始人
              Henrique Dubugras 在交易完成前已淡出日常首席执行官管理事务，但 Franceschi 的关键人留任依然是维系 Brex 产品文化、工程研发迭代效率以及与 Capital One
              云原生银行基础设施技术整合的核心支柱。
            claimRefs:
              - CO001
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
