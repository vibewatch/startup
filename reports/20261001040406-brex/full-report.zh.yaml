            body: >-
              Capital One 于 2026-04-07 完成以 $5.15 billion 收购 Brex 后，客户留存与账户稳定性面临实质性逆风。本次收购较 Brex 的 $12.3 billion
              的私有估值峰值缩水 58%，标志着平台全面转向银行主导的治理体系、集约化合规审查及偏保守的核保倾向。Airwallex、Ramp 和 Mercury 等竞品正发起精准挖角，专打风投创始人与企业财务管理者对
              Capital One 体系下机构官僚作风、授信额度波动及功能迭代停滞的担忧。历史上，Brex 依据账面即期流动资金进行动态核保，而非考量传统偿债备付率或多年历史资产负债表。随着 Capital One 将
              Brex 纳入全国性银行控股监管框架，财务负责人对信用核保标准进一步收紧的忧虑升温。诸如 501(c)(3)
              非营利机构及宗教慈善团体等特定细分客群，因缺乏原生基金会计科目集成而遭遇采购阻碍，加速向垂直费用管理方案迁移。
            claimRefs:
              - CU003
              - CU004
              - CU012
              - CU014
              - CU015
      - number: '6.5'
        title: 图表
        blocks:
