      - number: '7.4'
        title: Capital One 整合路径与逻辑推翻关键指标
        blocks:
          - type: paragraph
            body: >-
              Brex 于 2026 年 4 月以 $5.15 billion 作价被 Capital One 收购，较其 $12.3 billion 的估值顶峰腰斩 58%，也印证了其年度营收在 2024 与 2025
              年连续停滞在 $500 million 后顶线增速明显放缓的现实。核心整合风险在于：Capital One 的机构风险计量模型是否会强推更为保守的核保准则，从而断送 Brex
              为早期企业提供极速授信的核心价值壁垒。投资者和企业决策者需密切盯防以下破坏底层逻辑的关停指标：OCC 针对无担保企业记账卡出台更严苛资本充足率要求的监管指令；在 Capital One
              自有基础设施尚未承接完毕前过早切断 Column N.A. 或 BNY Mellon 合作导致的银行通道中断；以及核心高管流失或产品研发迭代降速引发客户加速向独立竞品倒戈。
            claimRefs:
              - CR001
              - CR008
              - CR012
              - CR013
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 核保额度剧烈波动与营运资金风险
            body: Brex 的自动化核保将企业卡额度与银行存款实时绑定。处于烧钱扩张期的初创企业若遇大型企业应收账款回款延期或短期营销投放激增，极易遭遇额度被系统自动骤降的流动性休克，在未发生任何实质违约的情况下陷入资金周转困境。
            calloutType: risk
            claimRefs:
              - CR008
              - CR009
              - CR011
          - type: callout
            title: 续约前银行整合尽调与备用银行体系建设
            body: 部署 Brex 的企业财务团队应着手建立第二套备用企业卡及商业银行通道，以对冲底层合作行从 Column N.A. 迁往 Capital One 体系可能引发的服务颠簸，并持续跟踪跨境刷卡真实执行费率。
            calloutType: recommendation
            claimRefs:
