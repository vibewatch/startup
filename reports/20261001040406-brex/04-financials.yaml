schemaVersion: "report-v2"
artifact: financials
slug: brex
runDate: 2026-10-01
company:
  name: Brex
chapter:
  number: 4
  title: Financials
  summary: >-
    Brex has several plausible monetization surfaces—card activity, paid software,
    broader financial products, and potentially premium API access—but public
    evidence does not disclose their revenue mix or realized economics. Third-party
    revenue estimates, historical burn reductions, and the April 2026 Capital One
    ownership change are useful signals, not a substitute for audited revenue,
    gross margin, cohort retention, current cash, or segment-level capital support.
sections:
  - id: revenue-architecture
    title: Revenue architecture and pricing evidence
    body: >-
      Brex is described as a finance platform spanning corporate cards, business
      accounts, treasury, bill pay, travel, and spend-management workflows, so the
      economic model is broader than a single card product. The public record,
      however, does not allocate revenue among transaction-linked card economics,
      software subscriptions, financial-product spread or fees, and adjacent
      services. A competitor comparison reported a free Essentials tier and a
      $12-per-user monthly Premium tier as the last published price, which is list
      pricing rather than realized revenue. Brex's own API agreement separately
      reserves the right to introduce fees for usage beyond stated limits after
      notice; it does not establish that API fees are currently charged or material.
      Underwriting and payment cadence also shape economics: third-party comparisons
      describe dynamic limits based on company cash, cash flow, and funding, with
      daily or monthly repayment depending on the account. These mechanisms can
      constrain credit exposure, but no retained source quantifies loss rates,
      interchange yield, reward cost, financing cost, or gross profit by product.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-capital
    title: Traction, cost signals, and capital position
    body: >-
      Public traction measures are not cleanly comparable. GetLatka labels $500
      million as 2025 revenue, while W Fintechs relays a Sacra estimate of about
      $700 million in annualized revenue by August 2025 with roughly 50% year-over-year
      growth. Revenue for a completed year is not ARR or an annualized run rate, and
      neither figure is presented here as audited. Historical operating signals are
      similarly directional: W Fintechs reported burn of about $17 million per month,
      a roughly 90% year-over-year reduction in cash burn in the first quarter of
      2024, and a CEO statement that gross profit had grown more than 75% in the
      prior year. Those observations show a past efficiency program, not current
      profitability or cash generation. Brex's April 2026 legal agreement identifies
      Brex LLC as a wholly owned Capital One subsidiary. Parent ownership changes the
      capital context, but the retained evidence does not disclose a standalone
      Brex cash balance, current burn, committed parent funding, debt obligations,
      transfer-pricing arrangements, or a segment income statement.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: verdict-and-diligence
    title: Financial verdict and underwriting blockers
    body: >-
      Revenue quality cannot be underwritten from the available public evidence.
      The product breadth and embedded finance workflows create multiple monetization
      opportunities, but the evidence does not reveal how much revenue is recurring
      software, transaction-sensitive, spread-dependent, rewards-offset, or
      cross-subsidized. Historical go-to-market evidence is promising but insufficient:
      W Fintechs reported that concentrated San Francisco billboard inventory cost
      close to $300,000, while an analysis of the early pitch deck found card-volume
      growth during a referral-only private beta but no absolute scale, CAC, or
      referral-rate disclosure. Competitor commentary also flags uncertainty around
      post-acquisition pricing, underwriting, roadmap, and customer priorities; that
      is an adverse hypothesis, not proof that terms have changed. The financial
      stance is therefore evidence-constrained: Brex may have stronger strategic
      backing inside Capital One, but audited revenue recognition, gross margin,
      cohort NRR, CAC/payback, credit losses, current cash usage, and parent support
      terms are required before judging durable profitability or capital adequacy.
    claimRefs: [CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public status
      - Diligence ask
    rows:
      - - Corporate card and spend
        - Card activity creates a card-revenue opportunity and embeds spend controls
        - Card spend or transaction
        - Mechanism supported; realized yield and mix undisclosed
        - Obtain interchange, rewards, loss, and funding-cost waterfalls
      - - Spend-management software
        - Free Essentials tier and paid Premium tier reported by a competitor
        - User per month
        - $12 per user per month was the last published Premium price in the retained comparison
        - Reconcile current price books to contracted and realized pricing
      - - API access
        - Brex may introduce fees for usage beyond agreement limits after notice
        - API usage above limits
        - Contractual option observed; current revenue contribution not established
        - Obtain API usage, attach rate, pricing, and revenue by customer cohort
      - - Account, treasury, bill pay, and travel
        - Broader financial workflow may enable fees, spread, or cross-sell
        - Not publicly specified
        - Product surface supported; monetization and mix unavailable
        - Provide product-level revenue recognition and gross-profit bridge
    notes: >-
      Product mechanisms come from retained company and third-party sources; only
      the quoted Premium list price is numeric, and no row represents audited revenue mix.
    claimRefs: [CI001, CI002, CI003]
  - id: TI002
    title: Pricing, underwriting, and payment mechanics
    columns:
      - Offer or mechanism
      - Published term
      - Evidence status
      - Economic implication
      - Diligence ask
    rows:
      - - Essentials software tier
        - Free
        - Competitor-reported list price
        - Can widen adoption but does not disclose monetization or service cost
        - Verify current inclusions, attach rate, and cost to serve
      - - Premium software tier
        - $12 per user per month, last published
        - Competitor-reported list price
        - Creates recurring potential, but realized discounts and paid-seat counts are unknown
        - Obtain contracts, discount schedules, paid seats, and churn
      - - Daily-payment charge card
        - Balance auto-debits each evening
        - Third-party description
        - Short settlement can reduce exposure while limiting customer float
        - Quantify yield, losses, rewards, and processing costs by payment cadence
      - - Monthly-payment charge card
        - Statement-period collection with limits tied to financial performance
        - Third-party description
        - Longer exposure may improve utility but changes credit and funding economics
        - Obtain approval, utilization, delinquency, and loss cohorts
      - - API usage beyond limits
        - Fees may be implemented with 30 days prior notice
        - Current official contractual right
        - Optional monetization is not evidence of current API revenue
        - Confirm whether fees exist and their contribution
    notes: >-
      These are list terms, contractual options, and payment mechanics rather than
      realized pricing; customer-level discounts, reward offsets, and economics are unavailable.
    claimRefs: [CI002, CI003, CI004, CI005]
  - id: TI003
    title: Unit-economics and capital evidence matrix
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2025 revenue
        - $500M reported by GetLatka
        - Low
        - Gives a scale marker but is not audited and is not ARR
        - Reconcile to audited GAAP revenue and recognition policy
      - - August 2025 annualized revenue
        - Approximately $700M with approximately 50% year-over-year growth, relayed from Sacra
        - Low
        - Indicates possible momentum but differs in metric and period from full-year revenue
        - Supply monthly revenue bridge and definition of annualized revenue
      - - Historical monthly cash burn
        - Approximately $17M per month before the reported efficiency actions
        - Low
        - Shows prior capital intensity but is stale after restructuring and acquisition
        - Provide monthly cash-flow statements through the current run date
      - - Q1 2024 cash-burn change
        - Approximately 90% lower year over year
        - Low
        - Signals cost action without proving positive cash flow
        - Reconcile operating, financing, and working-capital cash movements
      - - Prior-year gross-profit growth
        - More than 75%, stated by the CEO during the early-2024 restructuring
        - Low
        - Gross-profit growth is not a gross-margin percentage or profitability
        - Provide gross profit and margin by product and period
      - - CAC and payback
        - Unavailable; historical billboard spend is not a current CAC measure
        - Low
        - Determines whether enterprise growth creates value
        - Provide fully loaded CAC, sales cycle, win rate, and payback by segment
      - - Net revenue retention
        - Unavailable; the early deck's expansion thesis was not a Brex cohort result
        - Low
        - Tests expansion quality and workflow lock-in
        - Provide logo retention, GRR, NRR, and expansion by cohort
      - - Current cash, runway, and obligations
        - Not publicly disclosed on a standalone post-close basis
        - Low
        - Parent ownership does not specify available liquidity or support commitments
        - Obtain segment cash use, debt, guarantees, and Capital One support terms
    notes: >-
      Values are third-party reports or company statements relayed by third parties;
      periods and metric definitions differ, nulls are explicit diligence gaps, and
      no funding-raised figure is treated as cash available.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI014, CI015]
figures:
  - id: FI001
    title: Evidence-bounded revenue model bridge
    type: flow
    summary: >-
      The public record shows several monetization surfaces, but it does not quantify
      the conversion from customer activity to revenue or gross profit.
    data:
      nodes:
        - id: qualified-customer
          label: Financially qualified customer
          detail: Eligibility and limits are described as linked to cash, cash flow, funding, and revenue.
        - id: embedded-workflows
          label: Embedded finance workflows
          detail: Cards, accounts, treasury, bill pay, travel, and spend controls generate activity.
        - id: card-economics
          label: Card-linked economics
          detail: A card-revenue opportunity is described, but realized yield and mix are not public.
        - id: software-pricing
          label: Software pricing
          detail: A third party reports free Essentials and last-published $12-per-user monthly Premium pricing.
        - id: optional-api-fees
          label: Optional API fees
          detail: The official agreement permits future fees above usage limits after notice.
        - id: undisclosed-gross-profit
          label: Revenue and gross profit
          detail: Current mix, recognition, margins, losses, rewards cost, and cash conversion remain undisclosed.
    approximationNotes: >-
      Ordered mechanism map only; it is not a proportional waterfall, and no node
      value should be read as reported revenue, ARR, margin, or cash flow.
    claimRefs: [CI001, CI003, CI004, CI005, CI016]
callouts:
  - calloutType: risk
    title: Public scale signals are not an auditable revenue bridge
    body: >-
      The retained sources report both $500 million of 2025 revenue and about
      $700 million of annualized revenue by August 2025. Their periods, definitions,
      and provenance differ, so neither should be converted into ARR, margin, or
      current post-acquisition performance without primary financial records.
    claimRefs: [CI006, CI007, CI008]
  - calloutType: recommendation
    title: Underwrite the Capital One relationship explicitly
    body: >-
      Treat Brex as a wholly owned subsidiary, but do not assume the parent's balance
      sheet is freely available to Brex. Request segment reporting, liquidity access,
      guarantees, internal funding charges, and investment commitments.
    claimRefs: [CI012, CI016]
