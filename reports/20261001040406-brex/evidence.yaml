evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited GAAP financial statements verifying Brex's exact 2025 revenue run-rate, gross profit margins, and net
      revenue retention.
    whyItMatters: >-
      Brex's publicly reported $500 million revenue figure is unverified by regulatory filings or independent auditor
      opinions, leaving exact profitability and unit economics uncertain.
    diligencePath: >-
      Review Capital One Financial Corporation post-acquisition segment reporting and Form 10-Q/10-K disclosures
      covering commercial banking and payments subsidiaries.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-mapping
    missingEvidence: >-
      Complete cap table and exact equity ownership percentages of common and preferred shareholders prior to the
      Capital One acquisition.
    whyItMatters: >-
      Exact economic distributions and founder earn-out packages under the $5.15 billion transaction cannot be confirmed
      without the full shareholder register.
    diligencePath: >-
      Examine detailed merger consideration schedules in Capital One regulatory filings or secondary transaction
      registries.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-governance
    missingEvidence: Complete executive vice president roster and commercial division reporting structure under Capital One.
    whyItMatters: >-
      Disclosed governance covers principal founders and parent CEO, while operational department leadership under bank
      integration is not fully detailed.
    diligencePath: >-
