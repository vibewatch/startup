tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale / proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Marketplace consumers
        - Buyer, user, and payer are usually the same individual household shopper, though BNPL and cards can change the payment timing
        - General merchandise shopping with next-day delivery, pickup points, returns, and installment purchases
        - 20 million monthly ecosystem users, 9 of 10 residents know Uzum Market, 1 million monthly orders achieved in July 2023
        - Anchors ecosystem traffic and cross-sell into cards, BNPL, and adjacent verticals
        - Public sources do not disclose active-buyer frequency, repeat purchase, or cohort retention.
      - - Tezkor delivery users
        - Buyer and user are usually the same consumer; payer is consumer or household
        - Restaurant, grocery, and convenience delivery
        - 25 cities, 2,600 partners, 7,000 couriers; 56% of surveyed respondents had already used Uzum Tezkor
        - Adds higher-frequency use cases that can deepen daily wallet share
        - Order frequency, contribution margin, and cohort repeat rates are private.
      - - Uzum Bank card and fintech users
        - Consumer is buyer and user; Uzum earns through payments, cards, and lending products
        - Payments, cashback, BNPL, revolving credit, deposits, and cashless commerce inside the ecosystem
        - 1.5 million cards by March 2025, 4 million cards issued in 2025, more than 5 million current cards on homepage framing
        - Financial attachment increases conversion, monetization, and switching costs
        - Card actives, deposit retention, delinquency-linked customer quality, and product-level churn are not public.
      - - Marketplace sellers and SMEs
        - Merchant is economic buyer and workflow user; end consumer remains the marketplace shopper
        - Acquire demand, list assortment, use pickup-point and delivery infrastructure, and increasingly plug into financing or business banking
        - 17,000+ active local sellers and 100 million+ SKUs in 2025
        - Expands supply, selection, and merchant monetization across logistics and fintech tools
        - No public merchant retention, GMV concentration, or cohort-by-seller-age disclosure.
      - - Restaurants, stores, and quick-commerce partners
        - Restaurant or store is supply-side partner; end user is consumer ordering delivery; payer is household
        - Food and grocery fulfillment through Tezkor
        - 2,400+ partner restaurants at end-2024 and 2,600 partners by 2026 expansion release
        - Creates higher-frequency habit loops and local merchant density
        - No public partner churn, take rate, or average order economics.
      - - Dealers and larger self-fulfilling merchants
        - Business seller is buyer of marketplace access; end user is consumer; seller may also manage last-mile delivery itself
        - Auto marketplace, bulky-goods sales, and DBS/FBS merchant workflows
        - FBS and DBS launches plus automotive marketplace pilot with trusted dealers in Tashkent
        - Opens new categories and larger merchants that would not fit pure warehouse-led fulfillment
        - Pilot/production split and dealer economics are not public.
    notes: >-
      Uzum’s customer map is best organized by consumer, partner, and merchant workflow because the same ecosystem monetizes shopping, payments, and seller operations rather than one narrow subscription SKU.
