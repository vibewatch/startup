  - id: SECU04
    title: Competitive benchmarks in Uzbekistan are raising customer expectations on speed, assortment, and finance
    body: |-
      Uzum’s customer proof is good, but it has to be read against what Uzbek users can increasingly expect from rival digital products. Trade.gov, KPMG, WORLDEF, DataReportal, and Kun all describe a national market that is still early in online retail penetration but rapidly digitizing, with more than 32 million internet users, low current e-commerce share of retail, and a policy push toward 9-11% penetration over the next several years. In that setting, rivals are teaching customers to expect more than simple listing pages. Pivot’s comparison says Uzum wins by integrating payments, logistics, and customer service inside Uzbekistan with 1-2 day delivery for many goods, while Yandex Market stretches the benchmark in a different direction by offering longer-tail imported assortment at 5-15 day delivery times. Yandex Market’s own Uzbekistan site supports that imported-choice framing with a broad catalog of Russian and cross-border goods.

      Finance competitors are also shaping the benchmark that Uzum must meet to keep users inside its ecosystem. TBC Bank markets one-minute credit decisions up to 100 million som and three-minute business account opening, while Kapitalbank emphasizes remote business banking, payroll, and transfers. Alif adds a scaled local fintech-superapp comparison point: its site claims 5 million-plus downloads, 170,000-plus ratings, 2,000-plus payment services, and 5,000-plus stores. OLX remains a powerful classifieds habit with its own “number one” consumer position. The implication is that Uzum’s strongest customer advantage is integrated local execution across shopping, delivery, credit, and merchant tools, but customer expectations in Uzbekistan are already being set by fast-credit apps, long-tail assortment competitors, and entrenched classifieds behavior. That makes broad awareness and app presence necessary but insufficient; the real moat must come from cross-sell density, logistics quality, and merchant utility.
