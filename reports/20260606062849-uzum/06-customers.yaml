    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Uzum’s strongest customer motion starts with mass-market discovery, converts into transacting commerce behavior, and can deepen into fintech attachment or merchant tooling.
    data:
      items:
        - id: discover
          label: Discover
          actor: Consumer or merchant
          description: >-
            Users encounter Uzum through national brand awareness, app stores, pickup points, merchants, and local word of mouth in a fast-digitizing Uzbek market.
          channels:
            - Uzum homepage
            - App stores
            - Pickup points
            - Merchant presence
        - id: browse-order
          label: Browse and order
          actor: Shopper or delivery user
          description: >-
            Consumers search marketplace assortment or order food and groceries through Tezkor, using next-day or rapid-delivery promises as the first concrete utility.
          channels:
            - Uzum Market
            - Uzum Tezkor
            - Pickup delivery
        - id: pay-credit
          label: Pay and finance
          actor: Consumer payer
          description: >-
            Payment, cashback, cards, BNPL, and QR acceptance move the user from marketplace-only engagement into deeper fintech attachment inside the same ecosystem.
          channels:
            - Uzum Bank
            - Uzum cards
            - BNPL / QR
        - id: receive-repeat
          label: Receive and repeat
          actor: Household user
          description: >-
            Convenient delivery, returns, pickup, and repeat convenience can bring the user back for the next order, even though public retention cohorts remain undisclosed.
          channels:
            - Pickup points
            - Courier delivery
            - Returns
        - id: expand-merchant
          label: Expand to merchant or partner loop
          actor: Seller, restaurant, or business operator
          description: >-
            Merchants add assortment, adopt FBS or DBS, or use business banking and installment tools, making Uzum useful on both demand and supply sides.
          channels:
            - FBS
            - DBS
            - Uzum Business
            - Nasiya Business
