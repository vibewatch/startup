  - id: SECU03
    title: Seller and SME reach appears durable at the workflow level even though retention stays private
    body: |-
      Public evidence is especially strong on Uzum’s seller-side expansion logic. FY2025 results said active local sellers surpassed 17,000 and assortment exceeded 100 million SKUs, while logistics expanded to 1,500 pickup points across more than 450 locations. Earlier proof already showed strong marketplace velocity: Uzum Market processed more than 1 million orders in July 2023, worked with more than 5,000 sellers at that stage, and offered delivery in more than 60 cities and towns. What matters for durability is that later operating changes were not cosmetic. Uzum introduced FBS, letting merchants keep stock in their own warehouses while using Uzum’s storefront and downstream logistics, and later launched DBS, allowing sellers with their own delivery capability to handle last-mile fulfillment themselves while still accessing more than 10 million marketplace users. Those changes lower onboarding friction for manufacturers, distributors, offline retailers, and bulky-goods sellers that would otherwise sit outside the default marketplace model.

      Merchant-side mobile tooling reinforces the same picture. Kapitalbank’s site and the Uzum Business app page show that business users can manage balances, payments, foreign-exchange transactions, and payroll from mobile or web, while Uzum Nasiya Business is designed for vendor registration and installment-plan workflow management. This matters because Uzum’s SME reach is not just a seller-count vanity metric; it increasingly looks like a bundled operating system for Uzbek merchants that want storefront demand, payment acceptance, installment conversion, and lightweight banking operations in one place. The missing piece is still disclosed retention quality. Public sources support strong merchant acquisition and workflow breadth, but they do not reveal merchant cohort survival, GMV concentration among top sellers, take-rate retention, or how much of seller growth comes from long-tail trial accounts versus durable high-volume merchants.
