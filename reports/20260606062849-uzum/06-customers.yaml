  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver / risk
      - What public evidence says
      - Impact
      - Diligence path
    rows:
      - - Cross-sell from commerce into fintech
        - Cards, BNPL, and payments are increasingly embedded in marketplace and Tezkor usage; official sources show rising in-ecosystem payment share
        - Strong expansion lever and switching-cost builder if card users transact repeatedly
        - Request card-actives, purchase-frequency uplift, and credit-attach by commerce cohort.
      - - Merchant model flexibility
        - FBS and DBS lower onboarding friction for manufacturers, distributors, and large merchants with their own logistics
        - Supports seller expansion into harder categories and larger merchants
        - Request seller cohorts and GMV by fulfillment model plus top-merchant concentration.
      - - National delivery and pickup reach
        - Tezkor operates in 25 cities and marketplace pickup points reach 450+ locations
        - Geographic reach can expand user acquisition beyond Tashkent
        - Request mature-versus-new-region retention, service quality, and logistics unit economics.
      - - Awareness-versus-usage gap
        - 9/10 know Uzum Market and 8/10 know Uzum Tezkor, but public sources do not show repeat purchase or active-buyer ratios
        - Brand strength may overstate monetized customer quality if shallow users dominate
        - Request purchase-frequency cohorts, MAU-to-transactor conversion, and dormant-user ratios.
      - - Merchant and partner concentration opacity
        - 17,000+ sellers and 2,600 quick-commerce partners sound diversified, but no public top-seller or top-partner concentration is disclosed
        - Large hidden concentration could weaken supply durability or bargaining power
        - Request top-10 merchant GMV share, partner concentration, and category concentration by GMV.
      - - Competitor expectation ratchet
        - Yandex stretches imported assortment, TBC pushes one-minute credit, Kapitalbank mobile business banking serves enterprises, and Alif already has multi-million-download local fintech adoption
        - Raises the service bar on assortment, credit speed, and merchant utility
        - Request customer win-loss data, NPS by product line, and feature adoption versus named local competitors.
    notes: >-
      The main customer risk is not lack of public adoption evidence; it is that the public record is much stronger on breadth and awareness than on retention, concentration, or wallet-share durability.
