  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: segment-economics
      missingEvidence: Audited segment-level revenue, gross profit, and charge-off bridge across commerce, banking, BNPL, and delivery.
      whyItMatters: Group-level profit alone cannot tell investors whether the current multiple is supported by durable segment economics.
      diligencePath: Request audited or board-approved segment financials and management commentary for FY2025 and 1H2026.
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Full cap table, share classes, liquidation preferences, and the exact conversion mechanics for the March 2026 structured-capital instrument.
      whyItMatters: Without terms visibility, the headline $2.3 billion reference may materially overstate common-equity value.
      diligencePath: Obtain legal diligence-room materials, financing documents, and board approvals for the 2025 and 2026 rounds.
    - type: stale
      severity: material
      topic: 2026-earnings-bridge
      missingEvidence: A current 1Q26 or 1H26 bridge from FY2025 net profit to present earnings power.
      whyItMatters: Entry discipline is too dependent on trailing 2025 profits without a fresher bridge.
      diligencePath: Request quarterly management accounts and auditor-reviewed interim materials.
