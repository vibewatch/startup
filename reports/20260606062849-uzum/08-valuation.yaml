  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the decision-useful valuation anchors and public benchmark ecosystems retained for this
        chapter: Uzum's 2024, 2025, and 2026 financing marks plus the already-fetched Kaspi.kz and
        MercadoLibre public-company pages. It is not an exhaustive census of all global super-app or
        fintech-commerce comparables.
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Uzum March 2024 round
        - $52M equity plus $62M debt
        - Above $1.0B post-money valuation
        - First hard milestone proving institutional willingness to fund the model.
        - Too early to be a current underwriting anchor.
      - - Uzum August 2025 round
        - Approximately $65.5M-$70M all-equity financing
        - Approximately $1.5B post-money; cleanest recent anchor
        - Best downside screen because it looks like straightforward priced equity.
        - Still private and seven months older than the latest reference point.
      - - Uzum March 2026 Oman transaction
        - Over $130M mix of equity and structured capital
        - $2.3B pre-money reference point, not pristine common-equity mark
        - Best current headline reference and proof of stronger investor demand.
        - Convertible structure can overstate common-equity comparability.
      - - Kaspi.kz
        - Public regional super-app benchmark
        - Listed public-company analogue with payments, marketplace, fintech, and 1Q26 filing trail
        - Closest regional model for what a post-Soviet listed super app can look like.
        - Retained chapter pages prove breadth and disclosure cadence more than a live trading multiple.
      - - MercadoLibre
        - Public global ecosystem benchmark
        - Listed public-company benchmark with 10-Q, 10-K, 8-K cadence and 18-country operating scope
        - Provides the scale and disclosure ceiling for commerce-plus-fintech platforms.
        - Much larger and more diversified than Uzum, so it is a ceiling rather than a direct peer.
    notes: >-
      Public comparable pages are used mainly as quality-of-disclosure and business-breadth anchors.
      The cleanest numerical sensitivity in the retained source set comes from Uzum's own trailing earnings.
    claimRefs:
