company:
  name: Uzum
chapter:
  number: 8
  title: Valuation
  summary: >-
    Uzum is no longer a question of existence or momentum; it is a question of price discipline.
    Public evidence supports a progression from an above-$1 billion 2024 unicorn round to a clean
    approximately $1.5 billion August 2025 post-money equity valuation and then to a $2.3 billion
    March 2026 pre-money reference point. The problem is that the 2026 transaction was not a clean,
    plain-vanilla equity mark: it mixed primary equity with structured convertible capital linked to a
    future financing round, while segment-level audited economics, cap-table terms, and preference
    details remain private. The most defensible stance is therefore TRACK with medium confidence,
    high risk, and a fair-to-stretched valuation view. Uzum's profitability, national ecosystem scale,
    and strong Uzbek digital-adoption tailwinds make the company investable in principle, but the
    prudent common-equity entry range remains around $1.9-$2.4 billion, with a stronger preference
    for at-or-below roughly $2.0 billion common-equity equivalent unless new diligence closes the
    disclosure gap.
sections:
  - id: financing-context-and-entry-discipline
    title: Financing context, valuation anchors, and entry discipline
    body: |
      Uzum now has three public valuation anchors, but only two are reasonably clean. The March 2024 unicorn round combined $52 million of primary equity and $62 million of debt and took the company above a $1 billion post-money valuation. The August 2025 financing was cleaner and more decision-useful: official and independent reporting both point to an all-equity round of roughly $65.5-$70 million at approximately $1.5 billion post-money. That is the best recent hard private anchor because it looks like straightforward equity rather than a blended capital structure.

      The March 2026 Oman-led transaction moved the headline reference point to $2.3 billion pre-money, but the structure matters as much as the headline number. Uzum's own release and TechCrunch both describe a mix of primary equity and convertible or structured capital linked to the next qualified financing round. That means investors should not treat $2.3 billion as equivalent to a clean all-common equity mark. It is evidence of increasing investor demand and a credible upward re-rating, but not yet proof that new money would clear on the same terms without downside protection.

      Capital structure complexity also matters because Uzum has layered debt and private credit on top of equity: VR Capital provided UZS 300 billion financing in late 2025, the Eurasian Development Bank announced a $70 million loan in May 2026, and management is targeting another $250-$300 million pre-IPO raise in late 2026 or early 2027. In other words, dilution risk has not gone away. The investment case is strongest if a new investor can either enter at or below the clean-equity-adjusted equivalent of roughly $2.0 billion, or obtain terms that compensate for the uncertainty around conversion, preference stack, and future fundraising.
