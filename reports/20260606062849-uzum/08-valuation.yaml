  - id: recommendation-confidence-and-final-diligence
    title: Recommendation, confidence, exit path, and final diligence asks
    body: |
      The evidence supports TRACK rather than BUY or AVOID. BUY would require the current valuation to be clearly cheap or at least clearly clean; public evidence does not show either. AVOID would imply the price is obviously disconnected from the business; that also goes too far for a company that reported $176 million of 2025 net profit, more than 20 million users, 17,000-plus sellers, five million-plus cards, and large financing interest from sovereign and international investors. The right posture is selective participation only if price, terms, or diligence quality move in the investor's favor.

      Confidence is medium because the valuation argument depends more on missing evidence than on contradictory evidence. The recommendation could improve if management opens segment-level audited data, if the Oman structure is confirmed to be investor-standard rather than unusually protective, and if the next round provides a clean priced-equity confirmation above the current level. It could deteriorate quickly if profitability weakens, if the next round prices below expectations, or if hidden preference mechanics make the headline mark a poor proxy for common-equity value.

      Exit readiness today supports another large private financing or eventual strategic liquidity more than a near-term public listing. Uzum has scale and financing momentum, but not yet the public governance and disclosure habit that makes a near-term IPO easy to underwrite from outside the data room. The final diligence asks are therefore straightforward: segment-level P&Ls, cap-table and conversion terms, audited 2026 earnings bridge, cohort and take-rate quality, and a realistic capital plan through the next financing. Until those are available, the disciplined conclusion is fair-to-stretched at $2.3 billion and investable only with clear entry discipline.
