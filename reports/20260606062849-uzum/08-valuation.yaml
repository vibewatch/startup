  - id: public-comparable-framework-and-sensitivity
    title: Public comparable framework and sensitivity
    body: |
      The most useful public frameworks for Uzum are Kaspi.kz and MercadoLibre, not because they are direct size peers, but because they show what public investors reward in integrated commerce-plus-fintech ecosystems. Kaspi's retained pages describe a super app integrating payments, marketplace, and fintech, with a visible 1Q 2026 filing trail and debt-market disclosure. MercadoLibre's retained investor-relations, SEC-filings, and Q1 2026 earnings-release pages show a much broader listed ecosystem spanning commerce, fintech, and logistics across 18 countries. Together they establish two important valuation lessons: first, investors do pay for ecosystem breadth when it is audited and disclosed continuously; second, that public-market reward comes with much higher disclosure standards than Uzum currently provides.

      Because the retained chapter corpus does not include matching live market-cap pages for Kaspi or MercadoLibre, the cleanest sensitivity screen is built from Uzum's own disclosed earnings power. On the official 2025 net profit of $176 million, the August 2025 $1.5 billion valuation implies roughly 8.5x trailing net income. The March 2026 $2.3 billion reference implies roughly 13.1x trailing 2025 net income. Those are not absurd multiples for a fast-growing profitable super app in an underpenetrated market, but they already require investors to credit a lot of future scale, especially when Uzum is still private, single-country, and disclosure-light relative to Kaspi or MercadoLibre.

      The right comparable conclusion is therefore not that Uzum must trade at the same multiple as Kaspi or MercadoLibre. It is that Kaspi represents the regional super-app analogue and MercadoLibre represents the breadth-and-disclosure ceiling. Uzum deserves a discount to both until investors can inspect segment profitability, credit performance, capital intensity, and governance terms with public-company-like clarity. That logic supports using the 2025 clean round as a floor, the 2026 structured-capital mark as a provisional midpoint, and only a later clean pre-IPO round as a basis for a materially higher valuation.
