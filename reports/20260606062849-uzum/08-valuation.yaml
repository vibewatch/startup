  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down-round or weak pre-IPO raise
        - Next priced financing clears below roughly $2.0B or below-market terms dominate economics
        - Suggests the $2.3B reference was not durable common-equity value
        - Reset to bear-case underwriting or pass
      - - Profitability deterioration
        - FY2026 earnings bridge shows material drop versus 2025 net profit or rising credit drag
        - Breaks the argument that Uzum deserves a premium multiple because it is already profitable
        - Move valuation work back toward the clean 2025 floor
      - - Hidden preference or conversion overhang
        - Oman structured capital or prior preferred shares receive unusually protective liquidation economics
        - Headline valuation would overstate what new common equity is actually buying
        - Recut the deal off common-equity proceeds, not the press-release mark
      - - Demand quality weakens
        - GMV, TPV, card growth, or seller activity flatten without offsetting margin gains
        - Undercuts the ecosystem-flywheel argument behind the step-up valuation
        - Downgrade recommendation and require new proof before re-engaging
      - - Uzbek digital tailwind slows materially
        - E-commerce penetration or digital adoption disappoints versus current public forecasts
        - Reduces the market-expansion logic supporting premium growth assumptions
        - Compress toward base or bear case even if company execution remains solid
    notes: >-
      The triggers mix private-diligence items with public monitors because both terms and operating
      durability determine whether the current reference price is investable.
    claimRefs:
      - CV010
      - CV011
      - CV023
      - CV031
      - CV038
      - CV039
      - CV040

  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Segment economics
        - Audited revenue, gross profit, charge-offs, and capital usage by Market, Bank, Nasiya, and delivery
        - Without segment contribution data investors cannot tell whether the group multiple is supported by durable earnings quality
        - CFO pack and audited management accounts
      - - Cap table and Oman terms
        - Full cap table, share classes, liquidation preferences, and conversion mechanics for the March 2026 structured capital
        - The headline $2.3B reference may not equal common-equity value
        - Legal diligence room plus board approvals
      - - 2026 earnings bridge
        - 1Q26 and 1H26 bridge from FY2025 net profit to current run rate
        - Needed to know whether the trailing 2025 earnings base is strengthening or peaking
        - Finance team and auditor review files
      - - Credit and funding quality
        - BNPL and lending vintage performance, delinquency trends, funding costs, and debt covenants
        - Fintech losses or refinancing strain could compress the valuation quickly
        - Risk committee materials and lending data tape
      - - Cohort and take-rate durability
        - Customer repeat rates, seller retention, take rates, and payment monetization by product
        - Determines whether scale claims convert into high-quality revenue rather than promotional volume
        - Commercial analytics and product dashboards
      - - Exit and financing roadmap
        - Board plan for the next $250M-$300M raise, timing, target investor mix, and eventual liquidity path
        - Future dilution and timing drive realized investor returns more than the headline mark alone
        - CEO materials, banker updates, and financing workstreams
    notes: >-
      Each ask is directly tied to a variable that could move the recommendation, the valuation range,
      or the acceptable entry structure.
    claimRefs:
      - CV023
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045

