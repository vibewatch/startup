      - number: '6.2'
        title: App 页面和经营披露证明真实采用，但不能证明留存经济性
        blocks:
          - type: paragraph
            body: >-
              在一个渗透率仍低的消费生态里，Uzum 可公开验证的客户证据集异常干净，因为公司公开提供了多个 App 和 App 页面入口。Google Play 页面确认，Uzum Market、Uzum
              Tezkor、Uzum Bank、Uzum Business 和 Uzum Nasiya Business 都是已上线、面向用户的产品，不是概念幻灯片。这些页面也显示公司希望客户完成什么任务：Uzum
              Market 强调次日达、最长 12 个月分期、免费自提点取货、退货和用户评价阅读；Uzum Tezkor 强调约 30 分钟送达、与餐厅同价，以及超过 1000 家合作餐厅和商店；Uzum Bank
              强调即时发行虚拟卡、领取实体卡、返现、在 6000+ 家合作方扫码受理，以及最高 2500 万 som 的循环额度。商家端的 Uzum Business 和 Uzum Nasiya Business
              则说明，卖家和经营者不只靠桌面端卖家后台服务；他们也有移动端工作流，可处理支付、工资、合同、客户注册和奖金跟踪。


              但这些 App 入口能证明的东西，比投资者为耐久性承保所需的证据更窄。它们确认公开门店存在、产品宽度，以及买家或卖家可在生态内完成的任务。它们本身不能证明精确复购率、活跃买家频次、商家流失、GRR、NRR
              或头部客户集中度。因此，最佳读法是把 App 页面证据与官方经营指标合并看。把 Google Play 门店与 2023 年 7 月 100 万月订单、2025 年 17,000+ 活跃本地卖家、Tezkor
              覆盖 25 个城市、以及数百万张发卡量放在一起，它们能证明真实生产环境中的采用。但它们仍然只是使用证明和分发证明，不能替代队列表或单位经济披露。
