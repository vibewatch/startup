  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 消费者触达已到全国级、多触点，并越来越绑定金融
        blocks:
          - type: paragraph
            body: >-
              Uzum 的付费与使用客户群不是单一 App 队列，而是一个多层乌兹别克消费者网络，覆盖平台购物、即时配送、银行卡、BNPL 和面向商家的工具。眼下最强的收入端证据来自 Uzum
              自己的首页，以及官方和独立结果报道。首页称，乌兹别克斯坦每月有 2000 万居民使用 Uzum 服务，超过全国一半人口使用其服务，10 名居民中有 9 名知道 Uzum
              Market。此前披露的时间点也吻合这条斜率：1H 2024 的 PR Newswire 稿称，该生态有 1060 万月活用户；FY2024 业绩称 MAU 同比增长 61%，接近 1600 万，约等于全国人口的
              40%。随后 TechCrunch 报道称，到 2025 年 8 月融资时，Uzum 月活用户超过 1700 万；到 2026 年 3 月，生态每月用户约 2000 万。


              因此，客户地图更适合被看作一个嵌入金融深化的消费平台。平台用户是最宽的人群，但官方支付证据显示，越来越多交易已经在 Uzum 自己的金融轨道内完成。PR Newswire 称，截至 2025 年 3 月，Uzum
              Bank 已发行 150 万张卡，近 50% 的 Uzum Market 交易和超过 30% 的 Uzum Tezkor 支付已通过生态内金融科技方案处理。FY2025 业绩随后称，Uzum 在 2025
              年发行超过 400 万张支付卡；首页当前表述则称，Uzum Bank 现在有超过 500 万张卡，2025 年支付额达 $11.1 billion。关键结论对真实客户采用是正面的：Uzum
              不再只是吸引购物者；它也在同一生态内，把相当一部分电商用户转化为支付、银行卡和信贷用户。
