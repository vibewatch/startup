      - number: '8.2'
        title: 公开可比框架与敏感性
        blocks:
          - type: paragraph
            body: >
              对 Uzum 最有用的公开框架是 Kaspi.kz 和 MercadoLibre，不是因为它们是直接体量可比公司，而是因为它们显示了公开市场投资者会如何奖励整合商业加金融科技生态。Kaspi
              留存页面描述了一个整合支付、平台和金融科技的超级 App，并有可见的 1Q 2026 申报轨迹和债券市场披露。MercadoLibre 留存的投资者关系、SEC 文件和 Q1 2026 业绩稿页面，显示出一个覆盖
              18 个国家、横跨商业、金融科技和物流的更宽上市生态。它们共同给出两条重要估值经验：第一，当生态宽度经过审计并持续披露时，投资者确实愿意为它付费；第二，这种公开市场奖励伴随的披露标准，远高于 Uzum 当前水平。


              留存章节材料没有包含 Kaspi 或 MercadoLibre 匹配的实时市值页面，因此最干净的敏感性筛选应从 Uzum 自己披露的盈利能力出发。按官方 2025 年净利润 $176 million
              计算，2025 年 8 月 $1.5 billion 估值意味着约 8.5x 往绩净利润。2026 年 3 月 $2.3 billion 参考值意味着约 13.1x 往绩 2025
              年净利润。对于一个在低渗透市场中快速增长且盈利的超级 App，这些倍数并不荒唐，但已经要求投资者相信大量未来规模，尤其是当 Uzum 相比 Kaspi 或 MercadoLibre
              仍是私有、单一国家且披露轻薄时。


              因此，正确的可比结论不是 Uzum 必须按 Kaspi 或 MercadoLibre 相同倍数交易。而是 Kaspi 代表区域超级 App 类比，MercadoLibre
              代表宽度与披露的天花板。在投资者能用接近上市公司的清晰度检查分部盈利能力、信贷表现、资本强度和治理条款之前，Uzum 应该相对两者折价。这一逻辑支持把 2025 年干净轮作为底部，把 2026
              年结构化资本标记作为暂定中点，只有后续干净的 IPO 前 轮才能作为大幅更高估值的依据。
