      - number: '2.2'
        title: 多视角测算：零售上行空间有吸引力，金融科技分母更模糊
        blocks:
          - type: paragraph
            body: >-
              最干净的公开测算视角是电商。KPMG 将 2022 年乌兹别克斯坦电商市场估为 $311 million，Trade.gov 则称该市场 2024 年达到 $1.2 billion，相当于零售的 3.8%
              [CM006][CM007]。KPMG 和 Trade.gov 对 2027 年预测也一致：$1.8-2.2 billion，占零售渗透率 9-11%
              [CM008]。这使乌兹别克电商同时具备真实规模和低渗透：市场已经大到值得关注；如果预测成立，距离饱和还很远 [CM007][CM008]。


              Uzum 披露的电商规模显示，公司在该市场内已经拥有有意义的 SOM。官方和第三方来源支撑了 2025 年 GMV 超过 $500 million、活跃卖家 17,000+、物流触达全国等事实
              [CM017][CM018][CM019][CM020]。基于这些证据，Uzum 已不再是为未成形市场下注的本地创业公司；它已经是乌兹别克线上零售内部塑造市场的参与者之一 [CM019][CM020]。


              相邻金融科技层看起来甚至更大，但测算严谨度低得多。Uzum 声称 2025 年 TPV 为 $11.1 billion、线上支付份额 13%，并有 $1.2 billion BNPL 放款和 40% BNPL
              份额 [CM022][CM024]。如果分母一致，这些数字意味着支付和分期市场都很大；但隐含的 $85 billion 线上支付口径和大约 $3.0 billion BNPL 口径，仍来自公司数据，而非独立基准
              [CM023][CM025]。同样的谨慎也适用于 2027 年市场预测：Kun 的 $1 billion 平台成交额目标，与 KPMG 的 $1.8-2.2 billion
              更广义电商预测，应并列保留，不能合成一个虚假的精确数字 [CM009][CM010]。
