    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、估值锚与入场纪律
        blocks:
          - type: paragraph
            body: >
              Uzum 现在有三个公开估值锚，但只有两个相对干净。2024 年 3 月独角兽轮由 $52 million 新股股权和 $62 million 债务组成，把公司投后估值推到 $1 billion 以上。2025
              年 8 月融资更干净，也更适合决策：官方和独立报道都指向一轮约 $65.5-$70 million 的全股权融资，投后估值约 $1.5
              billion。这是最近最好的硬私募锚，因为它看起来是直接股权，而不是混合资本结构。


              2026 年 3 月 Oman 牵头交易把标题参考点推到 $2.3 billion 投前估值，但结构和标题数字同样重要。Uzum 自己的公告和 TechCrunch
              都描述了一种组合：新股股权，加上与下一轮合格融资挂钩的可转或结构化资本。这意味着投资者不应把 $2.3 billion
              视为等同于干净全普通股标记。它证明投资者需求在上升，也证明公司可信地向上重估，但还不能证明新钱在没有下行保护的同等条款下也会成交。


              资本结构复杂性也重要，因为 Uzum 在股权之上叠加了债务和私人信贷：VR Capital 于 2025 年底提供 UZS 300 billion 融资，Eurasian Development Bank 于
              2026 年 5 月宣布 $70 million 贷款，管理层还计划在 2026 年底或 2027 年初再募 $250-$300 million IPO 前资金。换句话说，稀释风险没有消失。只有在新投资者能以约
              $2.0 billion 的干净股权调整等价或以下入场，或者拿到能补偿转换、优先股堆叠和未来融资不确定性的条款时，投资案例才最强。
