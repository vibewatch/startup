      - number: '3.5'
        title: 护城河耐久度和反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              如果把 Uzum 视为本地基础设施栈，它的护城河最强：公司现在披露的平台拥有 17,000+ 卖家、100 million+ SKU、1,500 个自提点，仅 2025 年就发卡超过 4 million
              张，并且生态内支付绑定已经有实质规模 [CP012][CP020][CP021][CP031]。但反向证据也很厚。Yandex 仍可赢下长尾跨境需求和进口选择 [CP002][CP034]；OLX 和
              BirBir 保留了一条零佣金、轻资产的直接交易路径 [CP003][CP004][CP015][CP033]；专业零售商用融资驱动方案和快速履约削弱 Uzum 在电子品类的优势
              [CP005][CP006][CP007][CP032]；Click、TBC 和 Alif 则争夺让生态更有韧性的钱包、存款、信贷和商户关系
              [CP008][CP009][CP010][CP011][CP035][CP036][CP037]。公开报道还显示，竞争变得更激烈、更公开：Pivot 称，在 Uzum 指控 Yandex Market
              广告不正当竞争后，乌兹别克斯坦反垄断机构启动了调查 [CP039]。最后，信任和监管姿态也不是 Uzum 独占的清晰优势。World Bank 和 IMF
              的研究都指向一个监管、支付系统基础设施和竞争条件仍在演进的环境，意味着监管硬化可能重塑数字金融领导者的竞争方式 [CP029][CP030]。因此，持久投资逻辑不是 Uzum
              没有可信对手，而是它当前最有可能在全国尺度上协调本地电商和金融，同时仍面对真实的边缘商品化和截流风险 [CP031][CP038][CP040]。
