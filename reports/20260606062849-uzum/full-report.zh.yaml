  本报告是基于截至 2026-06-06 可获得公开信息生成的 AI 辅助尽调摘要，不构成投资建议。Uzum
  是私营公司，多项承销关键事实仍未披露，包括分部层面已审计经济性、信贷表现细节、治理结构和融资条款。投资者在作出任何投资决定前，应直接向管理层和一手文件核实所有重大事实。
