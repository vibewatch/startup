    summary: 以已披露 FY2025 净利润 $176 million 为基准，不同倍数对应的 Uzum 隐含股权价值。
    data:
      items:
        - label: 8.5x 净利润
          value: 1496
          note: 接近 August 2025 清洁股权锚点
        - label: 10.0x 净利润
          value: 1760
          note: 对已盈利但仍属私有平台的保守溢价
        - label: 12.0x 净利润
          value: 2112
          note: 合理普通股入场区间的下半段
        - label: 13.1x 净利润
          value: 2306
          note: 接近 March 2026 名义参考值
        - label: 15.0x 净利润
          value: 2640
          note: 需要更干净的条款和更强披露
        - label: 18.0x 净利润
