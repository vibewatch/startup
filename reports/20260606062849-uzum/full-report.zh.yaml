    rows:
      - - 平台零售
        - 平台和托管店铺上的线上零售订单。
        - 线下集市销售、仅门店零售、批发出口合同。
        - 家庭购买；家庭或 BNPL 贷款方付款。
        - Uzum Market 的核心需求池。
      - - 分类信息与社交电商替代品
        - 点对点信息发布、Telegram 驱动发现、OLX 或 BirBir 式直接交易。
        - 带整合物流的托管库存平台销售。
        - 个人和微型卖家直接购买并付款。
        - 限制正规平台整合的现状替代品。
      - - 线上支付和数字结账
        - 与线上交易绑定的银行卡、账户和 App 关联数字支付。
        - 仅现金线下 POS、资金划拨、非商业批发流。
        - 消费者发起；商家和银行接收或结算。
        - Uzum Bank 和结账份额的核心观察口径。
      - - BNPL 与消费分期金融
        - 与购买绑定的销售点分期和无担保消费金融。
        - 抵押贷款、SME 定期贷款、政策导向企业贷款。
        - 家庭消费；贷款方先行垫付，之后收款。
        - Uzum Nasiya 变现的核心池子。
      - - 卖家和中小企业赋能
        - 商户获客、物流、履约、创业者工具和卖家侧服务。
        - 通用 ERP、仅面向出口的 SaaS、无关企业软件。
        - 商户和中小企业既是用户，也是付费方。
        - Uzum 如何把变现从单笔零售订单做深。
      - - 汽车交易平台和合作方金融邻近业务
        - 车源信息、经销商分销和合作银行贷款发放。
        - 整车制造、线下经销店资本开支、车队金融。
        - 家庭、经销商和合作银行分担用户与付费方角色。
        - 拓宽生态钱包份额的邻近业务。
