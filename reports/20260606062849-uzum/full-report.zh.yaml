      - number: '7.3'
        title: 单一国家集中、宏观与资本栈风险
        blocks:
          - type: paragraph
            body: >-
              从根本上说，Uzum 仍是一个单一国家承保案例。它的规模令人印象深刻——超过 2000 万用户、覆盖乌兹别克斯坦超过一半人口、17,000+ 卖家、26
              城配送覆盖，以及全国性银行和支付足迹——但几乎所有活动仍在一个经济体、一种货币和一个演进中的监管环境内。宏观数据解释了为什么这既是上行空间也是风险：乌兹别克斯坦仍有高互联网渗透率、年轻人口、低电商渗透率和大量未被银行服务的人群空间，但这些事实也意味着公司的投资逻辑与单一政策和消费制度紧密绑定。


              融资风险也集中在一小组跨境资本提供方。资本栈现在横跨 Series A 债务、Tencent 和 VR Capital 股权、Oman 牵头并带有与下一轮合格融资挂钩可转债成分的战略轮、VR 的本币融资，以及
              EDB 的 $70 million
              贷款。这种组合降低了对任何单一投资者的依赖，但没有消除市场准入风险。相反，它创造了一种模型：国家风险、制裁外溢和外国风险偏好，可能在明显影响客户需求之前先影响融资。投资者应把宏观和资本风险视为耦合敞口，而不是分开的敞口。
