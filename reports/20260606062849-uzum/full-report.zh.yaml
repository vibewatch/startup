      - number: '4.2'
        title: 盈利真实存在，但 GMV、TPV、TFV 和卡增长本身无法回答收入质量或单位经济性
        blocks:
          - type: paragraph
            body: >-
              Uzum 公开记录中最强的正面事实，是公司在激进扩张中已经盈利。公司报告 FY2024 净利润 $150 million、FY2025 净利润 $176 million，同时还报告 9M 2024
              电商平台在营销成本前 EBITDA 为正。围绕这些利润的规模指标很可观：FY2024 GMV 达到 $345 million，BNPL 融资规模达到 $421 million，贷款组合总额达到 $226
              million，年末在用卡超过 700,000 张。Uzum 在 1H 2024 和 9M 2024 也披露了用户、卖家、订单和现金贷发放的快速中间牵引力，使后续 FY2024 和 FY2025
              盈利披露看起来具备运营可信度，而不是一次性事件。

              但盈利本身不足以支撑收入质量判断。许多醒目的数字是活动指标或资产负债表规模指标，不是收入确认指标：GMV 衡量平台上流转的商品；TPV 衡量支付流量；TFV
              衡量融资规模；发卡显示分发；存款、贷款和卖家数显示规模。TechCrunch 和 The Future Media 报道 2024 年收入为 $505 million、2025 年收入为 $691
              million，方向上有用，但 Uzum
              自己的官方发布尚未提供公开的收入确认桥、实际收入结构或分线毛利率。因此，关键投资判断问题不是需求是否存在，而是扣除资金成本、物流费用、信用损失、促销和基础设施开销后，有多少需求能转成持久、高质量收入。公开证据指向金融科技是主要利润引擎，但从规模到净利润的利润率栈仍只露出一部分。
