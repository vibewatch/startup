    rows:
      - - 电商平台
        - Uzum Market 上的 GMV 和卖家服务经济性
        - GMV、订单、卖家、SKU
        - FY2025 GMV >$500M；本地卖家 >17k；跨境上线后 SKU >100M
        - 活跃度很高，但抽佣率和广告经济性未披露
        - 索要按卖家类型拆分的净收入桥、抽佣率、广告 / 服务收入和队列经济性
      - - 银行和支付
        - 通过 Uzum Bank 和生态通道提供卡、支付处理、转账、存款和账户服务
        - 发卡量、TPV、支付份额、存款余额
        - 2025 年发卡 >4M；首页显示卡量 >5M；TPV $11.1B；线上支付份额 13%；三个月存款 >$50M
        - 可能具备经常性和高频属性，但手续费收益率和资金成本未披露
        - 索要 MDR / 交换费留存、手续费收入拆分、存款定价和贡献利润率
      - - BNPL 和消费贷款
        - 分期贷款、循环信贷额度和现金贷款
        - TFV、放款额、获批额度、贷款账簿
        - FY2024 TFV $421M；FY2025 总金融成交量 $1.2B；声称 BNPL 市占率 40%；2024 Q2 有 2.8M 用户获批额度
        - 规模很大，但信贷损失、收益率和期限未披露
        - 索要贷款批次曲线、APR / 加价政策、核销、NPL 和资金组合
      - - 即时配送
        - Uzum Tezkor 中的配送佣金、购物篮费用和合作伙伴变现
        - 合作伙伴数量、城市覆盖、订单结构
        - FY2024 有 18 城 2.4k+ 合作餐厅；首页显示 26 城 3k+ 合作伙伴
        - 交易量可见，但实际配送费和单位利润率不可见
        - 索要平均订单金额、抽佣率、骑手经济性和地区贡献利润率
      - - 汽车交易平台
        - 通过 Uzum Avto 覆盖挂牌、融资转介和合作银行贷款收入经济性
        - 经销商数量、融资线索
        - 首页描述约 300 家合作经销商，以及合作银行即时批贷
        - 收入入口已经存在，但商业条款完全未披露
        - 索要转介费、融资附着率和库存 / 挂牌经济性
      - - 商业工具和 SME 服务
        - 创业者应用、SME 贷款、支付和一体化银行解决方案
        - SME 贷款增长、企业账户、支付使用
        - Uzum 称 Kapitalbank 的 SME 贷款在 2025 年增长 1.7x；商业工具仍是生态主张的一部分
        - 可能演变成粘性 B2B 收入，但定价和采用率未公开
        - 索要企业账户数量、订阅或收费模式，以及商户留存指标
