      - number: '1.3'
        title: 融资历史、估值路径和信用资金栈
        blocks:
          - type: paragraph
            body: >-
              Uzum 2022 年才创立，资本历史却异常多元。2024 年 3 月的独角兽融资把 $52 million 的 Series A 新股和 $62 million 债务合在一起，使公司投后估值超过 $1
              billion [CO017]。FinSight Ventures 领投该轮，Xanara Investment Management 和 Uzum 高级管理层也参与 [CO018]。2025 年 8
              月，Uzum 宣布又完成一轮由 Tencent 和 VR Capital 领投、FinSight 参投的大型股权融资，公司投后估值约 $1.5 billion [CO019][CO021]。独立媒体把同一轮报道为
              $65.5 million，而不是公司四舍五入后的「近 $70 million」；最公平的表述是约 $65.5-70 million，取决于来源 [CO020]。


              资本形成没有停在普通股权。Uzum 后续披露了来自 VR Capital 的 UZS 300 billion 融资，称其在 2025 年注册了首期 300 billion UZS 债券发行，并在 2026 年 5
              月与 Eurasian Development Bank 签署了另一笔 $70 million 贷款 [CO022][CO023][CO027]。2026 年 3 月，公司又加入一笔 Oman 牵头、超过
              $130 million 的战略交易，组合了新股和结构化资本，并给出 $2.3 billion 投前参考点 [CO024][CO025]。现有股东 VR Capital、Tencent 和 FinSight
              也参与了该轮 [CO026]。这种股权、债券、双边融资和结构化资本叠加的组合支撑了快速增长；但公开持股比例和董事席位披露缺失，外部观察者仍无法精确绘制控制权地图 [CO044]。
