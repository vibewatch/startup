      - number: '7.5'
        title: 缓释因素、监测项与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              风险案例不是直接回避公司的结论；它提醒的是，Uzum 必须像工业化分发一样快地工业化控制体系。最重要的现有缓释因素在公开数据中可见：持续盈利、首次获得 Fitch B/Positive
              评级、对关键子公司的运营控制、具名高管班子，以及反复获得国际资本。这些因素降低了单一冲击立即变成生存危机的概率。


              但如果可量化监测点失效，投资逻辑确实会破裂。最高优先级触发器包括：2025-2026 年贷款队列出现不利信贷成熟证据；银行、消费信贷或支付合规行动限制入驻或放贷；无法以可接受条款再融资或转换 2026
              年结构化融资；制裁或 AML 摩擦中断外国融资或跨境供给；或公司在下一次重大融资事件中仍持续治理不透明。因此，下一轮尽调需要少花力气证明增长——公开证据已经显示增长——多测试合规、信贷纪律和治理能否跟上增长。
