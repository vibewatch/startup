      - number: '8.4'
        title: 建议、信心、退出路径和最终尽调请求
        blocks:
          - type: paragraph
            body: >
              证据支持观察，而不是买入或回避。买入要求当前估值明显便宜，或至少明显干净；公开证据两者都没有显示。回避 则意味着价格明显脱离业务；对于一家报告 2025 年净利润 $176 million、超过 2000
              万用户、17,000+ 卖家、500 万+张卡，并吸引主权和国际投资者大量融资兴趣的公司，这也走得太远。正确姿态是，只有当价格、条款或尽调质量向投资者有利方向移动时，才选择性参与。


              信心为中等，因为估值论证更多取决于缺失证据，而不是矛盾证据。如果管理层开放分部级审计数据，如果 Oman
              结构被确认是投资者标准条款而非异常保护性条款，并且下一轮以高于当前水平的干净定价股权给出确认，建议可能上调。如果盈利能力转弱、下一轮定价低于预期，或隐藏优先权机制让标题标记不能很好代表普通股价值，建议可能迅速恶化。


              就今天的退出准备度而言，Uzum 更支持另一轮大型私募融资或最终战略流动性，而不是近期上市。公司有规模和融资动能，但还没有形成让外部投资者容易在数据室外承保近期 IPO
              的公开治理和披露习惯。因此，最终尽调请求很直接：分部级 P&L、股权结构表和转换条款、经审计的 2026 年利润桥、队列和抽佣率质量，以及贯穿下一轮融资的现实资本计划。在这些资料可用之前，有纪律的结论是，$2.3
              billion 估值合理到偏高，只有在入场纪律清晰时才可投资。
