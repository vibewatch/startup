  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与跨境合规风险
        blocks:
          - type: paragraph
            body: >-
              Uzum
              现在运营的受监管边界，远宽于一个简单电商平台。公司当前栈把平台、即时配送、数字银行、分期金融、银行卡、存款和消费贷款结合起来，并做到全国规模；乌兹别克斯坦已发布的银行法律栈覆盖央行监督、银行与银行活动、存款保护、外汇监管、银行保密、电子支付、消费信贷和小额金融。这种组合意味着监管敞口不是假设风险；它嵌在公司日常经营模型里。


              剩余问题不是已经发现某项执法行动的证据，而是快速产品扩张与有限公开合规披露之间的不匹配。到 2025-2026 年，Uzum
              已在生态上叠加跨境供给、数百万张卡、线上存款和大得多的贷款账簿，但已检索到的公开材料仍未披露董事会委员会、类似 IR 的合规联系人、监管检查结果或制裁筛查架构。FATF 2026 年 2 月行动呼吁措辞，以及
              OFAC 正在执行的 2026 年制裁项目清单，都显示跨境交易对手能多快从常规筛查转向强化尽调，甚至采取反制措施。Uzum 依赖外国投资者、开发金融贷款方和跨境平台供给，合规风险因此可能同时流入融资和供给。
