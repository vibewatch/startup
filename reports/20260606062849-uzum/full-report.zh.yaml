chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部、阶段和商业模式
        blocks:
          - type: paragraph
            body: >-
              Uzum 是一家由创始人主导的乌兹别克数字生态平台，官方材料称其为该国最大的数字平台，为消费者和创业者同时提供电商与金融科技服务 [CO003]。公司由 Djasur Djumaev 和乌兹别克合伙人于 2022
              年创立 [CO001]，独立报道到 2025 年 8 月已将其描述为总部位于 Tashkent [CO002]。从一开始，Uzum 就不是单一产品电商平台，而是多垂直领域平台：目前披露的组合包括 Uzum
              Market、Uzum Tezkor、Uzum Bank、Uzum Nasiya、Uzum Business 和 Uzum Avto [CO004]。官方历史也说明了生态在 2022 年如何拼起来：Uzum
              Market 成为第一个品牌服务，Apelsin 和 Uzum Nasiya 则被并入平台 [CO005]。


              从阶段看，Uzum 已不是早期创业公司。它已经跨过独角兽门槛、开始盈利，并仍在为更大规模的 Series B / pre-IPO 融资做准备，而不是像完全成熟的上市公司类比物那样运转
              [CO017][CO021][CO025][CO045]。经营足迹已经全国化：截至 2026 年 3 月，公司称其服务触达超过 20 million 人，2026 年 6 月官网首页称整个生态有超过 14,000
              名员工 [CO006][CO007]。官方商业材料把战略逻辑讲得很清楚：电商制造需求，支付和分期提升转化，银行产品加深留存和变现 [CO004][CO006]。
