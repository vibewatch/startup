  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对承保判断的影响
      - 为何公开记录仍不披露
      - 具体尽调路径
    rows:
      - - 按业务线拆分的收入确认政策
        - 无法把 GMV、TPV、TFV 或存款转化成可比较的收入质量
        - 官方材料报告结果和交易量，不披露会计政策
        - 索要管理层备忘录，映射电商平台、支付、贷款、配送和汽车业务的收入确认
      - - 实际收入组合
        - 无法判断利润中有多少来自支付和贷款，多少来自商业和配送
        - 公开披露只在高层级汇总生态规模
        - 索要 2024 至 2026 年迄今按业务线拆分的月度收入桥
      - - 按业务线拆分的毛利率
        - 没有业务线经济性，就无法判断利润率路径和可比公司组
        - 没有公开分部损益表
        - 索要电商平台、支付、BNPL、配送和商业工具的毛利率
      - - 信贷质量和风险成本
        - 没有损失经验就无法承保贷款经济性
        - 公开来源披露交易量和组合规模，不披露表现质量
        - 索要按队列拆分的 NPL、逾期、核销、回收和拨备时间表
      - - 资金成本和存款经济性
        - 存款定价和批发融资组合可能大幅改变银行盈利能力
        - 存款增长已披露，但定价和 NIM 未披露
        - 索要存款利率卡、资金成本、NIM 和流动性覆盖指标
      - - 现金、烧钱和现金跑道
        - 仅凭融资新闻标题无法证明资本充足性
        - Uzum 仍是私营公司，只披露事件驱动的融资公告
        - 索要不受限现金、月度烧钱、现金跑道和债务到期表
      - - 监管资本和流动性比率
        - 银行和贷款增长可能需要比头条利润暗示的更多资本
        - 公开摘要材料不包含审慎监管比率
        - 索要 CET1 / CAR 等价指标、杠杆率和内部资本目标
      - - 商户、卖家和配送经济性
        - 没有每单或每商户贡献利润率，就难以判断电商平台和配送价值
        - 卖家数量和合作伙伴数量不能显示净盈利能力
        - 索要抽佣率、平均订单经济性、每单物流成本和卖家留存
      - - 类上市公司披露文件包
        - 投资者无法在同等披露条件下把 Uzum 与上市生态型可比公司对标
        - Uzum 主要靠新闻稿披露，不像上市可比公司有监管文件级披露材料
        - 索取经审计财务报表、详细 KPI 材料，以及贷款方 / 投资方约束条款包
    notes: 空值和缺失字段是有意保留；它们标出在完整承销模型可信之前，仍需补齐的具体卡点。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Captures the full set of public-data gaps that most directly block underwriting given the current source set and
        peer-disclosure benchmark.
