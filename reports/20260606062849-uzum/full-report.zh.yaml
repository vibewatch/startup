  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与可触达需求
        blocks:
          - type: paragraph
            body: >-
              Uzum 的市场不只是一个电商平台应用。商业边界从乌兹别克线上零售和分类信息发现开始，但会延伸到支付、卡和分期轨道，因为这些轨道决定浏览能不能真正转成已支付订单。因此，本章把电商、线上支付、数字银行、BNPL
              和卖家工具视为一个相互连接的市场系统，而不是五个互不相干的类别 [CM015][CM016]。实操上，本章纳入数字零售订单、商户赋能、线上结账与储值支付行为，以及 POS
              消费金融；排除纯线下现金零售、批发型公司银行和只面向出口的 B2B 流量 [CM015][CM016]。


              可触达受众已经足够大，能支撑全国级数字平台。DataReportal 统计，到 2025 年底或 2025 年 10 月，乌兹别克斯坦有 33.1 million 互联网用户、33.9 million 移动连接和
              14.1 million 社交媒体身份 [CM001][CM002][CM003]。Trade.gov 补充说，约 60% 人口在 30 岁以下，公共电信投资仍在改善基础连接，包括 5G 部署和数据吞吐扩容
              [CM004][CM005]。这些事实不保证变现，但说明乌兹别克斯坦已经不是消费者互联网里的低连接度边疆市场。


              同时，现状并不是一个干净、正式的电商平台市场。Kun 指出，传统购买习惯仍然重要；Telegram、点对点信息发布、OLX 式分类信息，以及 BirBir 等新进入者，仍都是托管型电商平台交易的有效替代品
              [CM012][CM013][CM014]。这组替代品很关键，因为它解释了为什么数字采用可以快速上升，却不必然全部需求都集中到一个正式电商平台或一条支付轨道 [CM011][CM014]。
