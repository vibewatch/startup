      - number: '8.3'
        title: 带明确假设的乐观、基准和悲观情景
        blocks:
          - type: paragraph
            body: >
              情景分析必须保持纪律，因为公开证据在收入端规模和融资历史上很强，但在分部经济性和条款上很弱。悲观情景假设，投资者最终锚定上一轮干净股权融资，而不是 2026 年结构化参考值。如果下一轮 IPO
              前融资低于预期成交，如果信贷成本或融资需求上升，或如果标题上的 $2.3 billion 标记最终嵌入普通股股东无法完全享有的投资者保护，这种情况就可能发生。在该情景下，约 $1.3-$1.7 billion
              的估值可以成立，本质上回到 2025 年 8 月锚点，并为持续增长给一点温和信用。


              基准情景假设 2025 年经营轨迹延续到 2026 年，Oman
              交易方向上正确，但仍应给结构折价。在这个情景下，下一轮融资围绕当前参考点成交，公司继续保持盈利，银行卡、支付和商业继续彼此强化，且没有重大宏观或监管冲击打断乌兹别克数字化。这支持约 $1.9-$2.4
              billion 的估值区间。这是最可能情景，因为它承认 Uzum 的真实执行力，但拒绝假装当前公开记录像上市可比公司一样干净。


              乐观情景需要的不只是叙事动能。它需要证明，计划中的 IPO 前融资以干净条款高于 2026 年 3 月参考值成交，盈利能力随 GMV 和 TPV
              扩大而上升而不是走平，并且私下尽调没有发现隐藏股权结构包袱。只有到那时，$2.6-$3.2 billion 的估值区间才站得住。按 25% 悲观、50% 基准、25% 乐观加权，中心价值接近 $2.1-$2.3
              billion，这意味着当前标题参考值可用，但留给新普通股投资者的安全边际有限。
