      - number: '1.2'
        title: 创始人、领导层和治理可见度
        blocks:
          - type: paragraph
            body: >-
              Djasur Djumaev 仍是 Uzum 的核心决策者和公众面孔，以创始人兼 CEO 身份统领整个生态 [CO008]。官方管理层页面还列出了一套相当完整的年轻公司运营班子：Nikolay Seleznev
              负责战略和业务发展，Roman Lavrentyev 负责运营并同时领导 Uzum Fintech，Nikita Gulyaev 任 CFO，Sergey Salikov 任总法律顾问，Kevin Khanda
              负责技术和产品，Egor Abramets 负责 Uzum Avto，Dmitry Benzoruk 负责 Uzum E-commerce
              [CO009][CO010][CO011][CO012][CO013][CO014][CO015]。这份名单显示，Uzum 的功能覆盖已经远超三人创始团队，延伸到财务、法务、产品、运营和业务单元领导。


              管理层之上的治理结构则模糊得多。本章检索到的公开材料披露了管理层履历，但没有披露董事会名单、委员会结构或独立性信息
              [CO016]。这不能证明治理薄弱，但意味着外部投资者仅靠公开资料，无法判断投票动态、创始人制衡或债权人影响力。Uzum
              的这一点比普通创业公司更关键，因为公司已经在支付、贷款、平台物流和银行关联服务中跑到全国基础设施规模 [CO003][CO006]。
