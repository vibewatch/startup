              Uzum 的产品叙事在本地化基础设施和用户触达上很强，但在外部技术伙伴通常期待的信任证据上偏弱。仍有一些运营控制证据：Uzum Avto
              称会核验经销商文件和车源可用性，乌兹别克斯坦监管环境也越来越要求平台披露、法人实体可见和本地数据处理。但本章没有发现支付
              API、商户认证、卡数据保护、事件历史、可用性或隐私内生设计控制的公开文档。最直接、原本应有帮助的技术文档入口——developer.uzumbank.uz
              门户——在记录的抓取环境中无法访问。这让产品尽调呈现不对称：公开材料证明了需求、物流进展和银行卡铺开，但不能证明更深的平台实现得有多安全、有多稳健。投资者或战略伙伴的核心尽调任务，是把有吸引力的基础设施主张，转化为关于安全性、可靠性和集成设计的可检查证据。
