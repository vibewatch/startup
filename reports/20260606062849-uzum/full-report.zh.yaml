  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台触点与生态契合度
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Uzum 的公开产品触点是连贯的，尽管公司仍在营销多个命名业务。Uzum Market 是流量和货品引擎；Uzum Tezkor 把同一消费者关系延伸到本地快速配送；Uzum Bank 和
              Uzum Nasiya 把结账活动转成卡、支付和贷款采用；Uzum Business 则充当面向创业者的法人实体层。Uzum Avto
              是相邻扩张最清晰的例子：它复用品牌触达、消费者信任和融资能力，进入更高客单价交易，而不是另起一个割裂的汽车品牌。业务概览明确描述了一条循环：购物活动把用户迁入金融科技产品；当前公司披露也显示这不只是概念——据称，生态电商支付中超过一半跑在
              Uzum 自有金融科技轨道上，支付卡折扣则用来改变用户在结账时的行为。这使平台架构更像一套为乌兹别克斯坦消费者和中小企业工作流调优的本地化电商、支付和物流栈，而不是一组应用的简单捆绑。
