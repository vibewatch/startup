      - number: '7.4'
        title: 竞争、物流执行与披露风险
        blocks:
          - type: paragraph
            body: >-
              竞争和执行风险会随规模上升。Trade.gov、OLX 和 Yandex 显示，乌兹别克消费者已经有可信的本地和跨境购物替代入口，而 Uzum
              必须协调一个不断扩大的大型伙伴网络，横跨卖家、自提点、咖啡馆、商店、餐厅和配送城市。这些数字证明了分发强度，但也意味着一旦卖家质量下滑、库存准确性恶化，或骑手和自提点经济性变差，运营冲击半径会更大。


              治理和披露是另外两个主要执行变量。Uzum
              在运营、金融科技、财务、法务、产品和电商上都有具名管理班子，这确实缓释了纯粹创始人依赖。即便如此，已检索公开材料仍止步于管理层履历和融资标题。它们没有提供董事会名单、委员会结构、后续轮次后的所有权演变，或等同
              IR 的披露栈。Kaspi.kz 是有用的区域基准：其 IR 网站单独展示文件、管理层、平台页面和投资者联系人。Uzum
              更薄的披露不能证明存在隐藏问题，但它显著提高了围绕治理质量、关联方监督和问责的确定性缺口，尤其是在公司接近更大融资轮时。
