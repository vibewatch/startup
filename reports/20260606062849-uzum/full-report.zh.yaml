      - number: '1.4'
        title: 指标、盈利能力和明确的公开数据缺口
        blocks:
          - type: paragraph
            body: >-
              公开经营披露在利润和交易规模上很强，在收入结构和所有权结构上则薄一些。FY2024，Uzum 报告净利润 $150 million、月活用户近 16 million、合并 GMV $345 million
              [CO028]。同一份 FY2024 发布还披露，BNPL 总融资规模为 $421 million，贷款组合总额为 $226 million，年末已发行超过 700,000 张 Uzum Bank 卡
              [CO029]。更早的 9M 2024 数据已经显示快速增长：截至 2024 年 9 月，电商 GMV 为 $237 million，BNPL 总融资规模为 $235 million，贷款组合总额为 $169
              million，MAU 为 12.6 million，净利润为 $100 million [CO030]。


              FY2025 披露把这张图继续拉开：Uzum 报告净利润 $176 million，GMV 超过 $500 million，总融资规模 $1.2 billion，支付规模 $11.1 billion，当年发卡超过
              4 million 张，活跃本地卖家超过 17,000 个，并在 450 多个地点铺出 1,500 个自提点的全国物流密度 [CO031][CO032][CO033]。2026 年 6
              月官网首页给出的口径更进一步，称卡量超过 5 million、卖家超过 17,000 个、SKU 超过 200 million
              [CO034]。缺口同样重要：公开来源没有披露合并收入、抽佣率或分部结构，员工数披露也未在不同来源和日期之间完全勾稽
              [CO007][CO044]。投资者因此能看到扎实的规模和盈利证据，但还看不到完整达到投资级别的披露包。
