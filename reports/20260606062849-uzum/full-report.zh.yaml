      - number: '5.2'
        title: 物流栈与履约演进
        blocks:
          - type: paragraph
            body: >-
              Uzum 最强的产品工程证据在物流，公司逐步拆分了库存、仓储和配送由谁承担。2023 年，Uzum Market 强调经典的运营商主导履约：次日达、230 个自提点，以及覆盖 60 多个城市和城镇的骑手网络。到
              2024 年底，公司加入 FBS，允许卖家在自有仓库保留库存并打包商品，同时 Uzum 仍负责干线运输和末端配送。到 2026 年 6 月，Uzum 又推出
              DBS，卖家也可以处理末端配送并自行选择服务区域和时效，且无需支付平台物流费。独立报道称，管理层希望 20-30% 配送通过这些新模式完成，这与产品逻辑一致：FBS 和 DBS
              扩大货品、支持大件或定制品类，并降低 Uzum 在每个订单上自持库存处理的需求。Tezkor 不断扩大的骑手足迹也强化了这一点：Uzum 是一个有多种末端模式的运营平台，不只是目录网站。
