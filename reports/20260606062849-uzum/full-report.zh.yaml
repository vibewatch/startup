      - number: '3.4'
        title: 切换成本、锁定效应和多平台并用
        blocks:
          - type: paragraph
            body: >-
              乌兹别克斯坦消费者侧切换成本，形式上低，行为上中等。一个购物者可以用 Click 转账、用 TBC 存款、用 Alif 分期、用 Yandex 买进口商品，同时仍用 Uzum
              做本地快速配送；这些选择都不像更换薪资系统或 ERP 那样要求独占迁移 [CP018][CP019][CP024]。因此，多平台并用是默认基准情景，不是边缘情景
              [CP024][CP035][CP037]。Uzum 模型更有粘性的部分在商户和运营层。随着 Uzum 推出 FBS 和 DBS 模式，再加上自提点网络和商户工具，卖家工作流更深地嵌入其物流、支付和需求生成栈
              [CP023][CP026][CP031]。即便如此，商户锁定仍不完整：卖家可以继续在专业零售商、直接渠道、分类信息或金融科技牵头的商户计划之间多平台并用，尤其是在产品标准化、买家价格敏感的场景
              [CP014][CP023][CP032][CP033]。因此，Uzum
              最好的分发护城河不是硬合同壁垒，而是在一个本地平台里协调流量、信任、支付和履约的便利性。这是真优势，但必须靠服务质量和密度不断续上，因为消费者总可以在下一次搜索或支付时刻流失
              [CP021][CP024][CP031][CP040]。
