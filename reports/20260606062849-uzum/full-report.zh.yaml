      - number: '1.5'
        title: 里程碑、奖项和外部约束
        blocks:
          - type: paragraph
            body: >-
              上线以来的时间线很压缩，但逻辑连贯。生态创立于 2022 年，围绕 Uzum Market 拼起来，并很快扩展到新的运营层，例如 2023 年的 Uzum Tezkor 和 2024 年的 Uzum Avto
              [CO001][CO005][CO035][CO036][CO037]。融资里程碑随后密集到来：2024 年 3 月独角兽轮、2025 年 8 月 Tencent/VR Capital 轮、2026 年 3 月
              Oman 牵头战略融资 [CO017][CO019][CO024]。2025-2026 年信用信号也在改善，包括首个 Fitch 评级，以及来自 Euromoney 和 Global Finance
              的重要本地银行奖项 [CO038][CO039][CO040]。


              主要外部警示不是需求弱，而是在一个仍在发展中的市场里执行难度高。Trade.gov 称，2024 年乌兹别克斯坦电商仅占零售的 3.8%，这意味着巨大上行空间，也说明大量消费行为仍在线下
              [CO041]。同一来源还强调了更严格的本地数据存储和电商平台规则，并列出广泛竞争者，包括 OLX、Yandex、Wildberries、Ozon 和 AliExpress
              [CO042][CO043]。换句话说，Uzum 正从强本地领导地位出发扩张，但所在市场里，监管、竞争和基础设施投入仍都会实质影响结果。
