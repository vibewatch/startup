      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              需求侧，Uzum 面向的是广泛的大众家庭买家，而不是狭窄小众。生态把平台货品、配送、支付、银行和分期打包给个人和中小企业，公司现在声称月活用户超过 20 million
              [CM015][CM017]。这一规模说明，漏斗顶部不只是高频购物者；很可能还包括支付、银行和其他生态用户，后续才转成电商或信贷用户 [CM017][CM026]。


              关键的付款方差异在于，并非每个用户都直接用手头现金完成购买。KPMG 明确指出，分期选项是乌兹别克斯坦的转化驱动因素；Uzum 则称，生态电商支付中超过 50% 已通过自有金融科技轨道处理，卡关联折扣在 2025
              年为用户节省 $15.3 million [CM021][CM036][CM040]。换句话说，支付能力和支付编排不是电商周边的辅助功能；它们本身就是产品市场匹配的一部分
              [CM021][CM036][CM040]。


              供给侧，主要买家是需要流量、物流、结账和类营运资本融资的卖家、小企业和本地伙伴，而不是只需要纯软件的客户。超过 17,000 个活跃本地卖家、超过 200 million 个 SKU
              和全国自提点密度，说明商户聚合已经达到真实规模 [CM018][CM019]。但这不意味着所有商户都一样：最有吸引力的队列会是一次采用多个 Uzum
              服务的商户，因为这个生态显然是靠支付和融资加深绑定，而不是只靠店铺存在感 [CM019][CM021]。
