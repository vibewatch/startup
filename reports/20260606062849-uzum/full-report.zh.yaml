  - id: TP003
    title: 定价 / 打包对比
    description: Publicly visible pricing, financing, and packaging signals across Uzum and selected rivals.
    notes: 本表只使用公开标价层面的证据。整个赛道里，电商平台佣金、商户抽佣率、谈判融资条款和许多企业服务费仍未披露。
    columns:
      - 竞争对手
      - 公开价格 / 融资信号
      - 履约 / 支付信号
      - 合同或套餐信号
      - 竞争含义
    rows:
      - - Uzum
        - 循环卡贷额度最高 25M soums；充值零手续费，向 Uzcard/Humo 即时转账免费
        - 近 50% Uzum Market 交易、>30% Uzum Tezkor 支付走自有金融科技通道
        - 商业与金融科技一体化，而不是单独的结账工具
        - 只要消费者留在生态内，转化和复用闭环就很强
      - - Yandex Market
        - 平台页面突出进口商品价格和 Split 分期支付
        - Pivot 称进口商品通常 5-15 天送达
        - 生态套餐绑定 Yandex Go / Yandex 服务，而不是本地银行
        - 当品类广度比本地速度更重要时更有吸引力
      - - Olcha
        - 公开重点宣传 0% 分期
        - 归档页面称塔什干 1-3 天送达、地区 3-7 天送达
        - 电商平台式线上零售，用分期拉动转化
        - 对电子产品和家电形成很强的品类压力
      - - TBC Bank
        - 线上信贷最高 100M soums；存款利率显示约 19.5%-20%
        - 卡、存款、企业银行和转账都在一个数字银行内完成
        - 经营完整银行关系，而不是零售购物篮经济
        - 即便不拥有电商平台，也能抢下主钱包或储蓄关系
      - - Alif
        - 3-36 个月分期，额度最高 33M soums；返现最高 2.2%；投资回报最高 12%
        - Alif Business 展示 QR、收单、电商平台和商户支持
        - 消费者超级应用加商户平台套餐
        - 本地最接近「金融打包 + 商户赋能」的替代方案
      - - Click
        - 突出返现和家庭内部免费转账；首页未公开完整商户费率表
        - 20M 用户规模，再加 Click Business 和终端产品
        - 支付超级应用套餐，同时覆盖消费者和商户工具
        - 即便不拥有库存或物流，也能强力拦截结账场景
