  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the decision-useful valuation anchors and public benchmark ecosystems retained for this chapter: Uzum's
        2024, 2025, and 2026 financing marks plus the already-fetched Kaspi.kz and MercadoLibre public-company pages. It
        is not an exhaustive census of all global super-app or fintech-commerce comparables.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Uzum 2024 年 3 月轮
        - $52M 股权加 $62M 债务
        - 投后估值超过 $1.0B
        - 首个硬里程碑，证明机构愿意为该模式提供资金。
        - 时间过早，不能作为当前承保锚点。
      - - Uzum 2025 年 8 月轮
        - 约 $65.5M-$70M 全股权融资
        - 投后估值约 $1.5B；近期最干净锚点
        - 最好的下行筛选锚点，因为它看起来是直接定价股权。
        - 仍为私有，且比最新参考点早七个月。
      - - Uzum 2026 年 3 月 Oman 交易
        - 超过 $130M 的股权与结构性资本组合
        - $2.3B 投前参考点，并非纯净普通股标记
        - 当前最佳公开参考值，也证明投资者需求更强。
        - 可转结构可能夸大普通股可比性。
      - - Kaspi.kz
        - 区域上市超级应用基准
        - 上市公司类比，覆盖支付、市场平台和金融科技，并有 1Q26 申报轨迹
        - 后苏联地区上市超级应用最接近的区域模型。
        - 保留章节页面更多证明业务广度和披露节奏，而不是实时交易倍数。
      - - MercadoLibre
        - 全球上市生态基准
        - 上市公司基准，具备 10-Q、10-K、8-K 披露节奏和 18 国经营范围
        - 为商业 + 金融科技平台提供规模和披露上限。
        - 规模和多元化远高于 Uzum，因此是上限，不是直接同业。
    notes: 公开可比公司页面主要用作披露质量和业务广度锚点。在保留来源集里，最干净的数值敏感项来自 Uzum 自身过往盈利。
