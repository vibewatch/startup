      - number: '3.2'
        title: 竞争者画像和相对定位
        blocks:
          - type: paragraph
            body: >-
              公开记录支持对竞争者画像做拆分判断。Yandex Market 是最清晰的直接电商平台替代品，面向想要进口货品且愿意接受更长配送窗口的消费者；Pivot 的分析把它刻画为相对 Uzum
              更快本地模式的国际化、俄罗斯关联选项 [CP002][CP015]。OLX 和 BirBir 的重要性在于另一个原因：它们让用户可以直接交易，从而降低对托管型电商平台的需求；Kun 将 BirBir
              的零佣金和轻资产模式描述为对电商平台双位数佣金和物流负担的有意替代 [CP003][CP004][CP014]。专业电子零售商更窄，但可信：Asaxiy 强调全国配送和分期驱动销售，Olcha 宣传 0% 分期和
              Tashkent 1-3 天配送，Texnomart 与 Mediapark 则把自己定位为全国性家电电子目的地，而不是泛平台 [CP005][CP006][CP007]。金融科技侧，Click 的 20
              million 用户形成原始支付分发力；TBC 将自己营销为乌兹别克斯坦第一家数字银行，提供卡、存款和企业银行；Alif 已演化为超级应用，下载量达数百万，覆盖商户收单、QR
              支付、分期、平台交易活动，以及面向商户的 Alif Business 服务
              [CP008][CP009][CP010][CP011][CP018][CP019]。竞争对手公开披露的规模数据并不均匀，因此不是每个画像都能用 GMV
              或客户数精确对标；这种不对称本身就是尽调发现，而不是把比较抹平的理由 [CP025][CP038]。
