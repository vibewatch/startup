            body: >-
              公开证据显示，Uzum 的架构围绕共享基础设施组织，而不是割裂的业务单元栈。公司官网首页称，Uzum Bank
              运行在自研本地化基础设施上，可处理即时支付和快速发卡；独立报道则称，用于电商的同一自提点网络也分发实体卡。这种实体与数字重叠很重要，因为它降低了银行获客成本，同时把物流资产变成受监管金融的分发资产。软件侧，FY2025
              业绩称 Uzum 在信用筛查、风险管理、定价和个性化中使用机器学习；2025 年融资发布又把欺诈预防加入 AI 辅助功能列表。DataVolt
              备忘录补充说明，管理层仍在投资本地算力和云容量，而不只是靠营销买增长。缺失的一环是技术透明度：没有公开架构文件解释支付、贷款模型、商户系统或基础设施层如何互动，因此宽架构可以被推断，但不能被审计。
