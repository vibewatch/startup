      - 品类
      - 规模 / 融资信号
      - 目标客群
      - 差异化
      - 相比 Uzum 的关键局限
    rows:
      - - Uzum
        - 参照生态
        - '>17,000 个卖家；>100M 个 SKU；1,500 个自提点；2025 年发卡 >4M 张'
        - 大众购物者、商户和中小企业用户
        - 本地物流，加嵌入式支付、BNPL 和商户工具
        - 仍暴露于专业零售、金融科技截流和进口商品外流风险
      - - Yandex Market
        - 直接平台挑战者
        - 乌兹别克斯坦公开规模未披露；背靠更广泛的 Yandex 生态
        - 寻找进口商品供给和 Yandex Go 邻近服务的购物者
        - Yandex 生态内的进口长尾供给和 Split 支付
        - 配送似乎更慢，本地卖家开放度也弱于 Uzum 本地优先模式
      - - OLX / BirBir
        - 分类信息 / P2P 替代品
        - OLX 仍是全国性综合信息板；BirBir 报告 500K 用户和 $10M 投资
        - 二手商品买家、小商户和直接交易用户
        - 零佣金或直接交易模式，没有平台抽佣
        - 信任、物流和支付控制的托管程度低于 Uzum
      - - Asaxiy
        - 专业电子产品零售商
        - 公开融资未披露；定位全国电子产品和家用品
        - 电子产品和家电购物者
        - 高客单品类里，配送加分期驱动的零售
        - 品类宽度和生态深度窄于 Uzum
      - - Olcha
        - 专业零售商 / 平台
        - 公司页面显示自 2017 年运营
        - 电子产品和家用品购物者
        - 0% 分期，以及相对明确的配送承诺
        - 生态更窄，支付所有权披露也少于 Uzum
      - - Click
        - 支付 / 超级 app 对手
        - 首页披露 20M 用户
        - 使用支付、返现和企业工具的消费者与商户
        - 不持有库存，却有庞大结账触达和商户集成
        - 没有证据显示全国履约能力或平台密度达到 Uzum 水平
      - - TBC Bank
        - 数字银行对手
        - 公开用户数未披露；定位为乌兹别克斯坦首家数字银行
        - 存款人、借款人、卡用户和中小企业
        - 完整数字银行技术栈，覆盖存款、卡、贷款和 TBC Business
        - 未把银行能力与 Uzum 规模的平台和自提基础设施组合起来
      - - Alif
        - 超级 app / 金融科技电商对手
        - 5M+ 次下载；5,000+ 家合作门店
        - 使用分期的消费者，以及使用收单 / QR / 平台工具的商户
        - 在分期、平台、商户服务和应用分发上，本地重叠度最高
        - 公开证据未显示其托管物流足迹达到 Uzum 规模
