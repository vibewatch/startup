  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              Uzum 的竞争是结构性的，不是和某个完全相同的应用正面对打。在托管电商里，最直接的电商平台挑战者是 Yandex Market，它把 Yandex Go 分发、进口货品和 Split 支付带进乌兹别克斯坦
              [CP001][CP002][CP015]。在替代品和现状渠道中，OLX 仍锚定该国广泛的分类信息市场；BirBir 则试图用零佣金逻辑、据报道 500,000 用户和 $10 million
              投资来现代化直接买卖双方交易；同时，集市、Telegram 带货和商户自有页面仍是非正式基线 [CP003][CP004][CP014]。在品类零售里，Asaxiy、Olcha、Mediapark 和
              Texnomart 都在争夺最高价值的线上品类，尤其是电子和家电，并且公开提供分期方案和全国配送承诺
              [CP005][CP006][CP007][CP016]。金融科技是一个独立但重叠的战场。Click、Payme、TBC Bank 和 Alif 并不是 Uzum
              生态的完整复制品，但它们仍可以截获结账、钱包、存款、信贷或商户收单这一刻，让生态变得有粘性 [CP008][CP009][CP010][CP017][CP018]。实际结果是，Uzum 防守的不是一个平台 SKU
              目录，而是从发现、下单，到支付、分期转化、履约和复购的整条链 [CP011][CP012][CP013][CP021]。
