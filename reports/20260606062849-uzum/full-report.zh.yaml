      - number: '6.4'
        title: 乌兹别克斯坦的竞争基准正在抬高客户对速度、供给和金融的预期
        blocks:
          - type: paragraph
            body: >-
              Uzum 的客户证据不错，但必须放在乌兹别克用户对竞品数字产品越来越高的预期里读。Trade.gov、KPMG、WORLDEF、DataReportal 和 Kun
              都描述了一个线上零售渗透率仍早期、但快速数字化的全国市场：互联网用户超过 3200 万，当前电商占零售比例低，政策又推动未来几年渗透率走向
              9-11%。在这个背景下，竞争对手正在教育客户期待的不只是简单商品列表页。Pivot 的比较称，Uzum 通过在乌兹别克斯坦本地整合支付、物流和客服，并对许多商品提供 1-2 日达而胜出；Yandex
              Market 则从另一个方向拉高基准，提供更长尾的进口供给，配送时间为 5-15 天。Yandex Market 自己的乌兹别克斯坦网站也用俄罗斯和跨境商品的广泛目录支持了这种进口选择定位。


              金融竞争者也在塑造 Uzum 留住生态内用户必须达到的基准。TBC Bank 推广最高 1 亿 som 的一分钟授信决策和三分钟企业开户，Kapitalbank 强调远程企业银行、工资和转账。Alif
              增加了一个本地规模化金融科技超级 App 对照点：其网站声称 500 万+下载、170,000+评分、2000+项支付服务和 5000+家商店。OLX
              仍是强势分类信息使用习惯，拥有自己的“第一”消费者地位。含义是，Uzum 最强的客户优势在于购物、配送、信贷和商家工具的本地整合执行，但乌兹别克斯坦的客户预期已经由快贷
              App、长尾供给竞争者和根深蒂固的分类信息行为共同设定。这让广泛知名度和 App 存在成为必要条件，但还不够；真正护城河必须来自交叉销售密度、物流质量和商家效用。
