      - number: '4.4'
        title: 核心尽调障碍是披露深度，不是 Uzum 是否已经达到有意义的规模
        blocks:
          - type: paragraph
            body: >-
              Uzum 的公开规模案例已经足以支撑一个强商业叙事。乌兹别克斯坦市场看起来仍早期，而非饱和：官方和分析来源把 2024 年电商规模放在约 $1.2 billion、仅占零售 3.8%，DataReportal
              报告有 33.1 million 互联网用户，KPMG 预测电商渗透率到 2027 年可能达到 9% 至
              11%。这个背景解释了为什么一个已盈利、整合型生态仍可能通过卡、支付、贷款和物流继续复利。不过，规模不等于可投资性。Uzum
              的公开财务披露仍由新闻稿和官网指标承担大部分说明义务，而这些本应由上市公司披露包吸收。Kaspi
              的投资者关系财务信息页面是一个有用基准：即便不读底层材料，正式、受证券法约束的文件层本身就显示了成熟生态投资判断通常要求的披露标准。

              Uzum
              缺失的项目恰恰是估值和下行保护最关键的项目。公开来源没有披露实际抽佣率、商户经济性、分线毛利率、存款资金成本、不良贷款率、核销、监管资本率、不受限现金、烧钱速度或现金跑道。它们也没有把第三方收入数字与官方分部披露勾稽起来，或解释当前利润有多少来自经常性支付和贷款经济性、多少来自一次性或时点敏感效应。因此，投资判断应当克制，而不是看空：Uzum
              看起来已经盈利、增长并越来越能融资，但成交不能只靠口径上的净利润和规模。下一步尽调需要一套私有资料包，把交易规模桥接到已确认收入、毛利润、信用成本和流动性。
