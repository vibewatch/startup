  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型明显是多线条，但公开披露仍更偏活动指标，而不是实际变现
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是一张宽收入面，而不是单线电商平台故事。Uzum
              公开把平台电商、即时配送、传统与数字银行、BNPL、汽车和创业者工具放在同一个生态里，并反复强调这些服务相互强化。最有经济意义的披露信号不是公开价目表，而是内部流量捕获：Uzum
              称，电商支付中超过一半已经跑在自有金融科技轨道上；Q2 2024 公司还称，Uzum Market 订单中超过 55% 通过 Nasiya
              支付。这支撑了一套飞轮：电商规模播下卡、支付和贷款用户，金融科技反过来降低结账摩擦、加深留存。业务概览还称，2025 年用户通过 Uzum Bank 卡折扣节省 $15.3
              million，进一步说明支付不只是工具功能，而是在承担行为改变和变现层的角色。

              生态各分部的规模指标都很强。FY2025 披露显示，电商 GMV 超过 $500 million，金融科技规模 $1.2 billion，支付规模 $11.1 billion，2025 年发卡超过 4
              million 张，本地卖家超过 17,000 个，在 450 多个地点拥有 1,500 个自提点。2026 年 6 月官网首页把这些规模口径继续抬高，称 Uzum 卡超过 5 million
              张、线上支付市场份额 13%、BNPL 份额 40%，并在 26 个城市拥有超过 3,000 个 Tezkor 伙伴。在产品入口层，Uzum Market 仍宣传最快次日达；2025 年 4 月 Tezkor
              更新则描述了 25 个城市、2,600 个伙伴和 7,000 名骑手。这些都是有用的服务密度代理指标，但也意味着增长故事背后有真实的骑手和履约成本基础。竞争性零售入口让定价不透明更加突出：一个归档的 2026 年
              2 月 Olcha 门店仍宣传 0% 分期和全国配送，提醒尽调者，乌兹别克消费者已经习惯激进的信用促销，哪怕 Uzum
              没有披露自身实际贷款收益率或补贴水平。仍然缺失的是每条收入流上的实际变现。公开材料没有披露电商平台抽佣率、商户折扣率、贷款收益率、存款定价、配送费经济性，或 Uzum Avto 与 Uzum Business
              背后的商业模式。因此，本章把收入线条的存在和规模视为已成立，但其实际结构和质量仍属于私有信息。
