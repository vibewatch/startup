      - number: '3.3'
        title: 能力、定价和分发对比
        blocks:
          - type: paragraph
            body: >-
              公开定价和能力证据说明，Uzum 的竞争不能简化为最低价。Uzum 自有卡权益包括免费充值、向 Uzcard 和 Humo 免佣转账，以及最高 25 million soums
              的可续信用额度；公司披露则称，自有金融科技目前处理近半平台交易和超过 30% 的 Uzum Tezkor 支付 [CP020][CP021][CP022]。这是有意义的闭环优势，但并非无人挑战。Yandex
              在平台前台展示进口商品发现和 Split 支付；Olcha 宣传 0% 分期和快速配送；TBC 公开营销约 19.5%-20% 的存款利率和最高 100 million soums 的线上信贷；Alif
              在同一伞下提供 3-36 个月分期、免费卡、返现和商户工具 [CP002][CP006][CP009][CP010][CP011][CP019]。Click 施加的是另一种压力：它可能不拥有物流，但 20
              million 用户的支付轨道和 Click Business 工具，使其成为消费者和商户之间强有力的截流层 [CP008][CP017][CP035]。含义是，Uzum
              最明显的胜场出现在本地履约控制和嵌入式金融同时重要的场景。它在这些场景会更弱：买家只想要进口 SKU，专业电子卖家已经提供关键融资，或外部超级应用不掌握货物流也能拿下支付和忠诚度
              [CP016][CP024][CP031][CP032][CP034]。
