  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 盈利规模、估值上调、结构复杂度和披露质量如何共同导向 TRACK 建议。
    data:
      nodes:
        - id: scale
          label: 规模验证：>20M 用户、>17k 卖家、>5M 张卡
          type: input
        - id: profit
          label: 盈利能力验证：FY2025 净利润 $176M
          type: input
        - id: stepup
          label: 估值动能：从 Aug-2025 的 $1.5B 到 Mar-2026 的 $2.3B 参考值
          type: input
        - id: structure
          label: 复杂因素：March 2026 融资组合包含结构化可转换资本
          type: input
        - id: comps
          label: 公开可比公司上限：Kaspi 和 MercadoLibre 的披露节奏强得多
          type: input
        - id: conclusion
          label: 结论：按名义价格看，合理至偏高
          type: process
        - id: recommendation
          label: TRACK / 仅在严守价格纪律时选择性参与
          type: output
      edges:
        - from: scale
          to: conclusion
        - from: profit
          to: conclusion
        - from: stepup
          to: conclusion
        - from: structure
          to: conclusion
        - from: comps
          to: conclusion
        - from: conclusion
          to: recommendation
    approximationNotes: 这是决策逻辑，不是机械模型。它说明为什么公司质量强，并不自动意味着可以支付 2026 年参考名义价格。
