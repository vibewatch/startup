        - 在更窄品类里，只要速度或库存经济性足够好，Yandex、垂直零售商和直销卖家模式仍能胜出
        - 高
        - 索要按城市和品类拆分的队列留存；按履约模式比较失败订单和复购率
      - - 结账环节嵌入金融科技
        - Click、TBC、Payme 和 Alif 即便不拥有履约，也能截住钱包、转账或信贷时点
        - 高
        - 验证 Uzum 在首选支付凭证中的份额，以及从卡激活到实际使用的转化
      - - 通过 FBS / DBS / 商业工具整合商户侧
        - 卖家仍可同时入驻分类信息、垂直零售商和金融科技主导的商户项目
        - 中
        - 索要商户流失、多平台经营和广告抽佣率数据
      - - 一站式生态宽度
        - Alif 和 Yandex 各自用不同强项覆盖同一工作流的重要片段；Uzum 对进口、分类信息或外部钱包仍没有完全独占
        - 中
        - 测试客户何时把 Uzum 当主应用，何时只当多应用组合中的一个节点
      - - 信任和监管准备度
        - IMF 和 World Bank 都指向一个监管收紧、基础设施演进中的环境，而不是已经稳固的优势
        - 中
        - 复核投诉数据、争议处理 SLA，以及未来任何影响支付路由或数字开户的监管变化
      - - 向相邻品类扩张
        - 扩张到汽车、分类信息或新服务可以增强飞轮，但也会增加执行风险，并打开新的竞争战线
        - 中
        - 尽调中把核心电商平台回报与相邻业务投资负担拆开
