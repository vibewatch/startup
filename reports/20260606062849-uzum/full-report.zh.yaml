      - number: '7.2'
        title: 信贷、欺诈与数字银行风险
        blocks:
          - type: paragraph
            body: >-
              核心财务模型风险在于，Uzum 增长最快的业务，恰好也是最暴露于违约、欺诈、催收质量和监管审查的业务。公开业绩显示，2025 年发行超过 400 万张卡，支付额超过 $11.1 billion，三个月内吸收超过
              $50 million 线上存款，Kapitalbank 贷款组合达 $3.1 billion。FY2024 已经显示 700,000 张带循环信贷额度的发卡、$421 million BNPL 融资额，以及
              $226 million 总贷款组合，因此风险底座比一年前大得多。


              公司也有真实缓释因素。Uzum 称其使用 ML 驱动的信贷筛查、风险管理、定价和个性化；Fitch 的 B/Positive 评级案例也明确把盈利能力、流动性和对关键子公司的控制列为优势。但公开材料仍未披露
              NPL 比率、欺诈损失拆分、核销曲线、回收率或催收 KPI。这意味着投资者能看到快速放量，却不能独立判断 2025-2026 年信贷队列是否按计划成熟。Uzum 的银行、支付、卡和 BNPL
              业务彼此强化，任何承保或欺诈控制弱点都可能同时打击手续费收入、监管姿态和融资信心，而不是孤立发生。
