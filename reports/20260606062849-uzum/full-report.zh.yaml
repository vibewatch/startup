      - number: '6.3'
        title: 卖家与 SME 触达在工作流层面看起来耐久，尽管留存仍未公开
        blocks:
          - type: paragraph
            body: >-
              公开证据对 Uzum 卖家侧扩张逻辑尤其有力。FY2025 业绩称，活跃本地卖家超过 17,000，商品品类超过 1 亿个 SKU，物流扩至超过 450 个地点的 1500
              个自提点。更早的证据已显示强劲平台速度：Uzum Market 在 2023 年 7 月处理超过 100 万笔订单，当时与超过 5000 名卖家合作，并在 60
              多个城市和乡镇提供配送。对耐久性真正重要的是，后续经营变化不是表面动作。Uzum 推出 FBS，让商家把库存留在自有仓库，同时使用 Uzum 的门店和下游物流；后来又推出
              DBS，让具备自配送能力的卖家自己处理最后一公里履约，同时仍可触达 1000 多万平台用户。这些变化降低了制造商、分销商、线下零售商和大件商品卖家的入驻摩擦，否则这些卖家会被默认平台模式挡在外面。


              商家端移动工具强化了同一幅图。Kapitalbank 网站和 Uzum Business App 页面显示，企业用户可从移动端或网页端管理余额、支付、外汇交易和工资，而 Uzum Nasiya Business
              设计用于供应商注册和分期计划工作流管理。这一点重要，因为 Uzum 的 SME
              触达不只是卖家数这个虚荣指标；它越来越像一个面向乌兹别克商家的捆绑式操作系统，把门店需求、支付受理、分期转化和轻量银行操作放在同一处。缺失的一块仍是披露出来的留存质量。公开来源支持强劲商家获取和工作流宽度，但没有揭示商家队列存活、头部卖家
              GMV 集中度、抽佣率留存，或卖家增长中有多少来自长尾试用账号，而不是耐久的高交易量商家。
