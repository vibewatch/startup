  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资逻辑：Uzum 作为成立四年的乌兹别克生态，规模已不寻常。
        - FY2025 净利润为 $176M；2026 年 6 月主页称用户超过 20M、卖家 17k、银行卡 5M。
        - 如果下一次数据室显示用户或卖家轨迹放慢，Uzum 已达到全国平台密度的判断会被削弱。
      - - 投资逻辑：2025 至 2026 年估值上台阶反映真实融资动能，不只是叙事。
        - 公开证据显示，估值从 2025 年 8 月约 $1.5B 的干净股权轮，升至 2026 年 3 月 $2.3B 的投前参考值。
        - 只有下一轮用干净股权条款确认这次上台阶，判断才会改善。
      - - 投资逻辑：Kaspi 和 MercadoLibre 证明，商业 + 金融科技生态可以获得溢价上市估值。
        - 保留的公开可比公司页面描述了整合市场平台、支付和金融科技的平台，并有连续的申报节奏。
        - 如果 Uzum 开始以类似频率披露分部经济性，这一类比会更强。
      - - 反向逻辑：2026 年 3 月标记并非纯净的普通股估值。
        - 官方和独立报道都称，该交易混合了股权和与下一轮融资挂钩的结构性可转换资本。
        - 只有转换和清算条款被证明标准且非惩罚性，担忧才会消退。
      - - 反向逻辑：公开披露仍落后于投资者可查看的 Kaspi 或 MercadoLibre。
        - Uzum 尚未公布公开股权结构表、优先股堆叠或经审计的分部盈利桥。
        - 经审计的 2026 年分部报告和股权结构透明度会缓解该担忧。
      - - 反向逻辑：退出前可能还需要更多资本。
        - 管理层目标是在 IPO 前融资 $250M-$300M，并在股权之外叠加债务额度。
        - 如果下一轮明确增厚价值且稀释很小，这个问题的重要性会下降。
    notes: 正向逻辑有证据支撑；负向逻辑主要关乎估值干净程度和披露质量，而不是不相信商业模式。
