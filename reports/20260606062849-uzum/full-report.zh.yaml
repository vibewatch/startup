      - number: '4.3'
        title: 资本栈正从股权拓宽到债务、结构化资本和开发性金融，但流动性仍不透明
        blocks:
          - type: paragraph
            body: >-
              自 2024 年 3 月独角兽轮以来，Uzum 的资本栈已经明显复杂化。官方口径下，公司最早披露的 2024 年融资为 $114 million，由 $52 million Series A 股权和 $62
              million 债务组成。到 2024 年底，管理层公开瞄准至多 $300 million 的追加资本，用于 BNPL、线上贷款和电商扩张；2025 年 8 月，Uzum 称以约 $1.5 billion
              投后估值完成近 $70 million 新股融资。独立报道大体确认了估值上调，尽管一个来源把该轮报道为 $65.5 million，说明即便看似简单的融资事实也需要勾稽。该轮股权融资之后，Uzum
              又加入更多资产负债表工具：VR Capital 在 2025 年 11 月提供 UZS 300 billion 融资，Kapital Bank Azerbaijan 参与 $22 million
              联合债务融资，Oman 牵头投资者在 2026 年 3 月提供超过 $130 million 的新股加结构化资本，Eurasian Development Bank 在 2026 年 5 月又增加一笔 $70
              million 投资贷款。

              这种宽度在战略上是正面的，因为它说明 Uzum 已打开多条融资通道，尤其是在公司强调获得 Fitch B
              评级、展望为正面之后。但资本可得不等于资本充足。公开披露大致说明新钱要流向哪里——金融科技扩张、卡、贷款、支付、数字银行、物流和基础设施——却没有说明剩余不受限现金有多少，每轮融资后的月度烧钱速度如何，或贷款增长有多少消耗内部资金、有多少依赖外部资金。Uzum
              比更简单的电商平台更需要回答这些问题，因为其模型承担仓储和自提点建设、支付轨道、通过金融激励获客，以及不断增长的无抵押信用敞口。公司可能资金充足，但公开记录还无法在投资判断深度上证明这一结论。
