  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调追问
    rows:
      - - 33.1M 互联网用户和 33.9M 移动连接
        - 正向
        - 当前
        - 可数字触达的人群已经足够支撑大众平台。
        - 跟踪互联网增长是否继续扩散到塔什干和其他主要城市以外。
      - - 年轻人口和电信投资
        - 正向
        - 中期
        - 年轻用户基底加网络持续升级，支撑数字化渗透继续提升。
        - 验证各年龄队列购买力，不要把年轻直接等同于消费能力。
      - - 2024 年电商仍仅占零售 3.8%
        - 正向
        - 多年
        - 低渗透率为平台和结账环节增长留出空间。
        - 测试渗透率提升是集中在少数品类，还是正在扩散。
      - - 推动更多竞争的银行改革
        - 正向
        - 中期
        - 民营银行扩张和监管改革可以扩大数字金融分销与信任基础。
        - 跟踪国有商业银行（SOCB）私有化、存款保险改革和风险本位监管落地。
      - - Uzum 内集成支付和卡优惠
        - 正向
        - 当前
        - 嵌入式支付能在单纯平台流量之外，提高转化和留存。
        - 索取使用多个 Uzum 产品用户的商户队列和复购队列。
      - - 线下习惯加 Telegram / 分类信息替代品
        - 负向
        - 当前
        - 数字需求不会自动沉淀到托管型平台。
        - 测算仍在非正式渠道多栖的买方和卖方占比。
      - - 生物识别、活体检测和 OTP 开户规则
        - 负向
        - 当前
        - 数字银行 KYC 更安全，但可能更慢、更贵。
        - 评估 2026 年 4 月规则变化前后的开户漏斗流失。
      - - 外汇记录、本地实体和数据本地化规则
        - 负向
        - 当前
        - 合规工作会扩展到资金管理、数据处理和平台架构。
        - 委托本地律师把每条规则映射到具体运营控制。
      - - 商户扣率上限和昂贵的银行卡 P2P
        - 混合偏负面
        - 当前
        - 受理范围可能改善，但金融科技单位经济和 POS 投资激励会变弱。
        - 在不同 MDR 和受理率假设下，建模结账毛利敏感性。
      - - 关税冲击和消费金融 NPL 上升
        - 负向
        - 近期
        - BNPL 和无抵押贷款扩张时，借款人韧性可能变弱。
        - 按收入带、客单价和逾期批次复盘信贷队列。
      - - 来自 Oman 和 EDB 的国际资本供给
        - 正向
        - 当前
        - 规模化数字基础设施玩家仍能拿到成长资本。
        - 检查未来融资是否附带治理或盈利能力里程碑。
    notes: 各行有意混合需求驱动、政策驱动和风险约束，因为三者都会影响转化时点和估值质量。
