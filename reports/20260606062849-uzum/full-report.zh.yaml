      - number: '2.4'
        title: 增长驱动、信任摩擦和监管拖累
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动很直接：人口年轻且联网、当前电商渗透率低、电信持续建设，以及数字金融正变得更可投资的经营环境 [CM004][CM005][CM007][CM008][CM017]。公共政策改革也很重要。World
              Bank 和 IMF 都描述了一个正走向更多私人竞争和更强监管的银行业，Trade.gov 则显示国家继续支持物流和电商平台基础设施
              [CM027][CM030][CM039]。资本供给也已改善：独立报道和公司公告都显示，国际股权资本和开发性金融资本愿意大规模资助乌兹别克数字基础设施 [CM041][CM042][CM043]。


              摩擦栈同样重要。World Bank 称，商户折扣上限和昂贵的卡基 P2P 流量仍在扭曲支付经济性 [CM028][CM029]。2026 年规则变化又增加了运营拖累：The Paypers
              报道了数字银行开户的生物识别、活体检测和 OTP 标准，Yep.uz 报道了 Central Bank 系统内更严格的外汇记录义务 [CM031][CM032]。Trade.gov
              补充了平台运营商的本地数据存储规则和本地实体要求，Lex.uz 则显示，法律监控需要持续跟踪一个集中但不断变化的立法体系 [CM033][CM034]。


              最后，消费金融增长并非无风险。Kilde 显示非银信贷在扩张，但也强调了关税冲击对家庭预算的压力，以及短期 NPL 比率上升 [CM037][CM038]。再叠加 Telegram
              电商、分类信息和其他替代渠道持续存在，市场逻辑就变成强但不顺滑：Uzum 受益于结构性好的市场，但信任、合规和借款人韧性仍会决定名义 TAM 中有多少能变成持久、可变现的需求
              [CM012][CM013][CM035][CM038]。
