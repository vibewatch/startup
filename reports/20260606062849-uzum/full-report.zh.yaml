  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 降价轮或疲弱的 IPO 前融资
        - 下一轮定价融资低于约 $2.0B，或低于市场的条款主导经济性
        - 暗示 $2.3B 参考值不是可持续普通股价值
        - 重置为悲观情景承保，或放弃
      - - 盈利能力恶化
        - FY2026 盈利桥显示较 2025 年净利润大幅下滑，或信贷拖累上升
        - 打破 Uzum 因已盈利而应获溢价倍数的论点
        - 将估值工作拉回干净的 2025 年底部附近
      - - 隐性优先权或转换包袱
        - Oman 结构性资本或既有优先股获得异常保护性的清算经济性
        - 公开估值标记会高估新普通股实际买到的价值
        - 按普通股实际所得重切交易，而不是按新闻稿标记
      - - 需求质量走弱
        - GMV、TPV、银行卡增长或卖家活跃度趋平，且没有利润率改善抵消
        - 削弱估值上台阶背后的生态飞轮逻辑
        - 下调建议，并要求新证据后再重新接触
      - - 乌兹别克数字化顺风明显放慢
        - 电商渗透率或数字化采用不及当前公开预测
        - 削弱支撑溢价增长假设的市场扩张逻辑
        - 即便公司执行仍稳健，也压向基准或悲观情景
    notes: 触发因素混合了私有尽调事项和公开监控项，因为条款和经营韧性共同决定当前参考价格是否可投。
    claimRefs:
      - CV010
      - CV011
      - CV023
      - CV031
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 分部经济性
        - 按 Market、Bank、Nasiya 和配送拆分的经审计收入、毛利、核销和资本使用
        - 缺少分部贡献数据，投资者无法判断集团倍数是否由可持续盈利质量支撑
        - CFO 材料包和经审计管理账
      - - 股权结构表和 Oman 条款
        - 2026 年 3 月结构性资本的完整股权结构表、股份类别、清算优先权和转换机制
        - 公开口径 $2.3B 参考值可能不等于普通股价值
        - 法律尽调室和董事会批准文件
      - - 2026 年盈利桥
        - 从 FY2025 净利润到当前运行率的 1Q26 和 1H26 桥
        - 需要判断 2025 年过往盈利基数是在增强还是见顶
        - 财务团队和审计师审阅文件
      - - 信贷与融资质量
        - BNPL 和贷款 vintage 表现、逾期趋势、融资成本和债务契约
        - 金融科技亏损或再融资压力可能快速压缩估值
        - 风险委员会材料和贷款数据带
      - - 队列与抽佣率韧性
        - 按产品拆分的客户复购率、卖家留存、抽佣率和支付变现
        - 决定规模说法能否转化为高质量收入，而不是促销拉动交易量
        - 商业分析和产品看板
      - - 退出与融资路线图
        - 董事会对下一轮 $250M-$300M 融资的计划、时间、目标投资者组合和最终流动性路径
        - 未来稀释和时间比公开估值标记本身更影响投资者实际回报
        - CEO 材料、投行更新和融资工作流
    notes: 每项要求都直接对应一个可能改变建议、估值区间或可接受入场结构的变量。
    claimRefs:
      - CV023
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
