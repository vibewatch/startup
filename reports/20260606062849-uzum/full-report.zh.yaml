  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于清洁轮次锚点、结构折价和成功 pre-IPO 上行情景，给出 Uzum 悲观、基准和乐观估值区间。
    data:
      items:
        - label: 悲观情景
          low: 1300
          mid: 1500
          high: 1700
          note: 若结构折价占主导，估值回到 August 2025 清洁股权锚点附近
        - label: 基准情景
          low: 1900
          mid: 2150
          high: 2400
          note: March 2026 的估值上调大体守住，但仍因结构和披露缺口打折
        - label: 乐观情景
          low: 2600
          mid: 2900
          high: 3200
          note: 需要确认干净的上调融资，并拿出更强的已审计证据证明利润可持续增长
    approximationNotes: 该区间刻意受证据约束。公开信息足以框定情景，但不足以把任何单一数字视为精确内在价值。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按投委会口径，从市场、验证、护城河、披露质量、资本结构、退出准备度和估值纪律给 Uzum 打分。
    data:
      items:
        - label: 市场跑道
          value: 4
          note: 乌兹别克斯坦电商和数字金融渗透率仍低
        - label: 规模验证
          value: 4.5
          note: 用户、卖家、卡和支付证据已经有分量
        - label: 盈利能力验证
          value: 4
          note: 对创业公司规模的生态而言，FY2024 和 FY2025 净利润披露异常强
        - label: 披露质量
          value: 2
          note: 分部经济性、股权结构表和上市公司式披露节奏仍有限
        - label: 资本结构清洁度
          value: 2
          note: March 2026 结构化资本让名义估值可比性变复杂
        - label: 退出准备度
          value: 2.5
          note: 按当前披露，更适合再做一轮私募融资，而不是近期 IPO
        - label: 估值纪律
          value: 3
          note: 只有保持价格敏感，并用数据室核查条款，才算合理
    approximationNotes: 分数是方向性判断辅助，不是机械评级系统。这里的低分更多反映证据缺失和结构复杂，而不是经营业务弱。
    claimRefs:
      - CV010
      - CV012
      - CV017
      - CV024
      - CV035
      - CV041
      - CV045
