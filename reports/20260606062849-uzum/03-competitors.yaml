tables:
  - id: TP001
    title: Competitor profile table
    description: Head-to-head profiles of Uzum’s main marketplace, specialist-retail, and fintech rivals in Uzbekistan.
    notes: >-
      Many Uzbek private competitors do not publish clean GMV, revenue, CAC, or funding data. “Not publicly disclosed”
      is used intentionally where the public record does not support a firmer number.
    columns:
      - Competitor
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation
      - Key limitation versus Uzum
    rows:
      - - Uzum
        - Reference ecosystem
        - '>17,000 sellers; >100M SKUs; 1,500 pickup points; >4M cards issued in 2025'
        - Mass-market shoppers, merchants, and SME users
        - Local logistics plus embedded payments, BNPL, and merchant tools
        - Still exposed to specialist retail, fintech interception, and imported-goods leakage
      - - Yandex Market
        - Direct marketplace challenger
        - Public scale in Uzbekistan not disclosed; backed by broader Yandex ecosystem
        - Shoppers seeking imported assortment and Yandex Go adjacency
        - Imported long-tail selection and Split payments inside Yandex ecosystem
        - Delivery appears slower and local seller openness weaker than Uzum’s local-first model
      - - OLX / BirBir
        - Substitute classifieds / P2P
        - OLX remains broad national board; BirBir reported 500K users and $10M investment
        - Used-goods buyers, small merchants, and direct-trade users
        - Zero-commission or direct-transact model with no marketplace take rate
        - Less managed trust, logistics, and payment control than Uzum
      - - Asaxiy
        - Specialist electronics retailer
        - Public funding not disclosed; nationwide electronics and household-goods positioning
        - Electronics and appliance shoppers
        - Delivery plus instalment-led retail in high-value categories
        - Narrower category breadth and ecosystem depth than Uzum
      - - Olcha
        - Specialist retailer / marketplace
        - Operating since 2017 per company page
        - Electronics and household-goods shoppers
        - 0% installments and comparatively explicit delivery promises
        - Narrower ecosystem and less disclosed payments ownership than Uzum
      - - Click
        - Payments / superapp rival
        - 20M users disclosed on homepage
        - Consumers and merchants using payments, cashback, and business tools
        - Massive checkout reach and merchant integration without owning inventory
        - No evidence of full national fulfillment or marketplace-density parity with Uzum
      - - TBC Bank
        - Digital-bank rival
        - Public user count not disclosed; positions as first digital bank in Uzbekistan
        - Depositors, borrowers, card users, and SMEs
        - Full digital-bank stack with deposits, cards, lending, and TBC Business
        - Does not pair banking with Uzum-scale marketplace and pickup infrastructure
      - - Alif
        - Superapp / fintech-commerce rival
        - 5M+ downloads; 5,000+ partner stores
        - Consumers using installments and merchants using acquiring / QR / marketplace tools
        - Closest local overlap of installments, marketplace, merchant services, and app distribution
        - Public evidence does not show Uzum-scale managed logistics footprint
