  - id: profiles-and-relative-positioning
    title: Competitor profiles and relative positioning
    body: >-
      The public record supports a split view of competitor profiles. Yandex Market is the clearest direct marketplace
      alternative for shoppers who want imported assortment and are willing to accept longer delivery windows; Pivot’s
      analysis characterizes it as the international, Russia-linked option relative to Uzum’s faster local model [CP002][CP015].
      OLX and BirBir matter for a different reason: they lower the need for a managed marketplace at all by enabling
      direct trade, with Kun describing BirBir’s zero-commission and asset-light model as a deliberate alternative to the
      double-digit commissions and logistics burden associated with marketplaces [CP003][CP004][CP014]. Specialist
      electronics retailers are narrower but credible: Asaxiy emphasizes nationwide delivery and installment-led sales,
      Olcha advertises 0% installment payments and 1-3 day delivery in Tashkent, and Texnomart and Mediapark position
      themselves as nationwide household-electronics destinations rather than generic marketplaces [CP005][CP006][CP007].
      On the fintech side, Click’s 20 million users create raw payment distribution power, TBC markets itself as the first
      digital bank in Uzbekistan with cards, deposits, and business banking, and Alif has evolved into a superapp with
      downloads in the millions, merchant acquiring, QR payments, installments, marketplace activity, and Alif Business
      services for merchants [CP008][CP009][CP010][CP011][CP018][CP019]. Publicly disclosed scale data for rivals is
      uneven, so not every profile can be benchmarked on GMV or customers with precision; that asymmetry itself is a
      diligence finding rather than a reason to smooth the comparison [CP025][CP038].
    claimRefs:
