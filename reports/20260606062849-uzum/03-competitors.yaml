  - id: TP004
    title: Moat durability / competitive risk register
    description: Competitive moats, credible displacement vectors, and the diligence questions they create.
    notes: >-
      Severity is an analyst judgment based on public evidence only. No internal market-share or unit-economics data was
      available for like-for-like benchmarking across Uzbek rivals.
    columns:
      - Moat claim
      - Threat
      - Severity
      - Mitigation / diligence ask
    rows:
      - - Local logistics density and pickup network
        - Yandex, specialist retailers, and direct-seller models can still win when speed or inventory economics are good enough in narrower categories
        - High
        - Request cohort retention by city and category; compare failed orders and repeat rates by fulfillment model
      - - Embedded fintech at checkout
        - Click, TBC, Payme, and Alif can intercept wallet, transfer, or credit moments even when they do not own fulfillment
        - High
        - Verify Uzum’s share of primary payment credentials and card activation-to-usage conversion
      - - Merchant-side integration through FBS / DBS / business tools
        - Sellers can still multi-home across classifieds, specialist retailers, and fintech-led merchant programs
        - Medium
        - Request merchant churn, multi-homing, and advertising take-rate data
      - - One-stop ecosystem breadth
        - Alif and Yandex each cover meaningful slices of the same workflow with different strengths; Uzum still lacks full exclusivity over imports, classifieds, or external wallets
        - Medium
        - Test where customers use Uzum as primary app versus one node in a multi-app stack
      - - Trust and regulatory readiness
        - IMF and World Bank both point to an environment of tightening supervision and infrastructure evolution rather than settled advantage
        - Medium
        - Review complaint data, dispute SLAs, and any future regulatory changes affecting payment routing or digital onboarding
      - - Category expansion into adjacencies
        - Expansion into automotive, classifieds, or new services can strengthen flywheel but also adds execution risk and opens new competitive fronts
        - Medium
        - Separate core-marketplace returns from adjacency investment burden in diligence
