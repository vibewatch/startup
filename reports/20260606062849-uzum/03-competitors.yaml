  - id: TP003
    title: Pricing / packaging comparison
    description: Publicly visible pricing, financing, and packaging signals across Uzum and selected rivals.
    notes: >-
      This table uses only public list-level evidence. Marketplace commissions, merchant take rates, negotiated funding
      terms, and many enterprise fees remain undisclosed across the category.
    columns:
      - Competitor
      - Public price / financing signal
      - Fulfillment / payment signal
      - Contract or package signal
      - Competitive implication
    rows:
      - - Uzum
        - Renewable card credit up to 25M soums; zero-fee top-ups and free instant transfers to Uzcard/Humo
        - Nearly 50% of Uzum Market transactions and >30% of Uzum Tezkor payments routed through own fintech
        - Integrated commerce plus fintech rather than separate checkout utility
        - Strong conversion and repeat-use loop if shoppers stay in ecosystem
      - - Yandex Market
        - Marketplace page foregrounds imported-goods pricing and Split payments
        - Pivot describes typical delivery at 5-15 days for imported selection
        - Ecosystem package tied to Yandex Go / Yandex services rather than local banking
        - Appeals when assortment breadth matters more than local speed
      - - Olcha
        - 0% installments highlighted publicly
        - 1-3 day delivery in Tashkent and 3-7 days in regions stated on archived page
        - Marketplace-style online retail with installment-led conversion
        - Strong category-level pressure on electronics and appliances
      - - TBC Bank
        - Online credit up to 100M soums; deposits shown around 19.5%-20%
        - Cards, deposits, business banking, and transfers all inside one digital bank
        - Full banking relationship rather than retail-basket economics
        - Can win primary-wallet or savings relationship even without marketplace ownership
      - - Alif
        - 3-36 month installments up to 33M soums; up to 2.2% cashback; up to 12% investment return
        - QR, acquiring, marketplace, and merchant support visible in Alif Business
        - Consumer superapp plus merchant platform package
        - Closest local alternative for bundled finance plus merchant enablement
      - - Click
        - Cashback and free intra-family transfers highlighted; full merchant fee schedule not public on homepage
        - 20M-user distribution plus Click Business and terminal products
        - Payment superapp package with consumer and merchant tools
        - Powerful checkout interceptor even without owning inventory or logistics
