  - id: moat-durability-and-adverse-evidence
    title: Moat durability and adverse competitor evidence
    body: >-
      Uzum’s moat is strongest when judged as a local infrastructure stack: the company now discloses a marketplace with
      17,000-plus sellers, 100 million-plus SKUs, 1,500 pickup points, over 4 million cards issued in 2025 alone, and
      material in-ecosystem payment attachment [CP012][CP020][CP021][CP031]. But the adverse evidence is substantial.
      Yandex can still win long-tail cross-border demand and imported selection [CP002][CP034]; OLX and BirBir preserve
      a zero-commission, asset-light path for direct trade [CP003][CP004][CP015][CP033]; specialist retailers blunt Uzum’s
      edge in electronics with financing-led offers and fast fulfillment [CP005][CP006][CP007][CP032]; and Click, TBC,
      and Alif compete for the wallet, deposit, credit, and merchant relationships that make ecosystems resilient [CP008][CP009][CP010][CP011][CP035][CP036][CP037].
      Public reporting also shows rivalry becoming more aggressive and more public: Pivot says Uzbekistan’s antimonopoly
      authority opened an investigation after Uzum accused Yandex Market of unfair competition in advertising [CP039].
      Finally, trust and regulatory posture are not a clean Uzum-only advantage. World Bank and IMF work both point to
      an environment where supervision, payment-system infrastructure, and competitive conditions are still evolving,
      which means regulatory hardening could reshape how digital finance leaders compete [CP029][CP030]. The durable
      investment case is therefore not that Uzum faces no credible rivals, but that it currently looks best positioned to
      coordinate local commerce and finance at national scale while still facing real commoditization and interception risk
      at the edge [CP031][CP038][CP040].
