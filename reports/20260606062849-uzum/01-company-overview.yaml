chapter:
  number: 1
  title: Company Overview
  summary: >-
    Uzum is a Tashkent-based, founder-led Uzbek digital ecosystem built around commerce and fintech, founded in 2022 and
    already profitable at scale. Public evidence supports a rapid progression from a $1B+ March 2024 unicorn round to a
    $1.5B August 2025 valuation and a $2.3B pre-money reference point in March 2026, while key governance and cap-table
    detail remains private.
