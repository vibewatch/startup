  evidenceGaps:
    - id: EGO001
      topic: Board composition and committee structure remain undisclosed in public materials
      type: missing-source
      severity: minor
      missingEvidence: A board roster, committee list, and independence status for directors.
      whyItMatters: Without board visibility it is harder to judge governance maturity, investor rights, and key-person checks on the founder-led team.
      diligencePath: Request shareholder materials, board minutes summary, or a current board observer list from management.
      relatedQuestionRefs: [QO008]
    - id: EGO002
      topic: Stakeholder or investor map is partial because public releases omit ownership percentages and board seats
      type: enumeration-incomplete
      severity: material
      missingEvidence: A current cap table with ownership by founder, management, and each external investor, plus any board-seat or veto-right allocation.
      whyItMatters: Control, dilution, and governance rights can materially change the investment case even when valuation headlines look attractive.
      diligencePath: Request the latest cap table, shareholder agreement summary, and board rights schedule under NDA.
      relatedQuestionRefs: [QO020]
      relatedTableRefs: [TO003]
    - id: EGO003
      topic: Consolidated revenue, take rate, and segment mix are not publicly disclosed even though net profit is public
      type: private-evidence-only
      severity: material
      missingEvidence: Audited or management-approved revenue by segment, gross margin, and take-rate disclosures for commerce and fintech.
      whyItMatters: Profitability without revenue mix makes valuation-multiple work, quality-of-earnings analysis, and vertical attribution much weaker.
      diligencePath: Request audited financial statements or board reporting packs with revenue bridge and segment disclosures.
      relatedQuestionRefs: [QO020]
    - id: EGO004
      topic: Public workforce metrics are not fully reconciled across sources
      type: conflicting-data
      severity: minor
      missingEvidence: A consistent employee definition covering FTEs, blue-collar logistics staff, contractors, and bank subsidiaries across reporting dates.
      whyItMatters: Headcount is a useful proxy for operating leverage and execution complexity, but the current public figures are not directly comparable.
      diligencePath: Ask management for an as-of-date headcount table split by business line and worker category.
      relatedQuestionRefs: [QO020]
    - id: EGO005
      topic: The August 2025 equity amount is reported as both “nearly $70 million” and $65.5 million
      type: conflicting-data
      severity: minor
      missingEvidence: Final signed closing statement or cap-table update for the August 2025 round.
      whyItMatters: Exact round size affects financing chronology and implied dilution, especially in a company that has used both equity and structured capital.
      diligencePath: Confirm the legal close amount and whether public releases were rounded for communications purposes.
      relatedQuestionRefs: [QO012]
sections:
  - id: SEC101
    title: Identity, headquarters, stage, and business model
    body: >-
      Uzum is a founder-led Uzbek digital ecosystem that official materials describe as the country’s largest digital
      platform, combining e-commerce and fintech services for both consumers and entrepreneurs [CO003]. The company was
      founded in 2022 by Djasur Djumaev and Uzbek partners [CO001], and independent coverage described it as
      Tashkent-headquartered by August 2025 [CO002]. From the start, Uzum was built as a multi-vertical platform rather
      than a single-product marketplace: today the disclosed stack includes Uzum Market, Uzum Tezkor, Uzum Bank, Uzum
      Nasiya, Uzum Business, and Uzum Avto [CO004]. The official history also shows how the ecosystem was assembled in
      2022, with Uzum Market becoming the first branded service while Apelsin and Uzum Nasiya were folded into the
      platform [CO005].


      Stage-wise, Uzum is no longer an early startup. It has already crossed unicorn status, is profitable, and is still
      preparing for a larger Series B / pre-IPO capital raise rather than behaving like a fully mature public-company
      analogue [CO017][CO021][CO025][CO045]. The operating footprint is already national in character: as of March 2026
      the company said its services reached more than 20 million people, and its June 2026 homepage claimed more than
      14,000 employees across the ecosystem [CO006][CO007]. The strategic logic is explicit in official business
      materials: commerce creates demand, payments and instalments increase conversion, and banking products deepen
      retention and monetization [CO004][CO006].
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO017, CO021, CO025, CO045]
    figureRefs: [FO002]
  - id: SEC102
    title: Founders, leadership, and governance visibility
    body: >-
      Djasur Djumaev remains the central decision-maker and public face of Uzum, serving as founder and CEO across the
      ecosystem [CO008]. The official management page also names a fairly broad operating bench for a young company:
      Nikolay Seleznev handles strategy and business development, Roman Lavrentyev runs operations while also leading
      Uzum Fintech, Nikita Gulyaev is CFO, Sergey Salikov is general counsel, Kevin Khanda leads technology and product,
      Egor Abramets runs Uzum Avto, and Dmitry Benzoruk leads Uzum E-commerce
      [CO009][CO010][CO011][CO012][CO013][CO014][CO015]. That roster suggests functional coverage well beyond a
      three-person founding team, including finance, legal, product, operations, and business-unit leadership.


      What is much less visible is the governance overlay above management. The public materials retrieved for this
      chapter expose management biographies but not a board roster, committee structure, or independence disclosures
      [CO016]. That does not prove weak governance, but it does mean outside investors cannot infer voting dynamics,
      founder checks, or lender influence from public sources alone. This matters more for Uzum than for a typical
      startup because the company already operates at national infrastructure scale in payments, lending, marketplace
      logistics, and banking-linked services [CO003][CO006].
    claimRefs: [CO003, CO006, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO002]
  - id: SEC103
    title: Funding history, valuation path, and credit stack
    body: >-
      Uzum’s capital history is unusually diversified for a company founded only in 2022. The March 2024 unicorn
      financing combined $52 million of primary Series A equity with $62 million of debt, taking the company above a $1
      billion post-money valuation [CO017]. FinSight Ventures led that round, while Xanara Investment Management and
      Uzum senior management also participated [CO018]. In August 2025, Uzum announced another major equity round led by
      Tencent and VR Capital with FinSight participating, valuing the company at approximately $1.5 billion post-money
      [CO019][CO021]. Independent outlets reported the same round as $65.5 million rather than the company’s rounded
      “nearly $70 million” figure, so the fairest framing is approximately $65.5-70 million depending on source
      [CO020].


      Capital formation did not stop with plain equity. Uzum later disclosed a UZS 300 billion financing from VR
      Capital, said it registered its first 300 billion UZS bond issuance in 2025, and signed a further $70 million loan
      with the Eurasian Development Bank in May 2026 [CO022][CO023][CO027]. In March 2026 the company then added a
      strategic Oman-led transaction exceeding $130 million, combining primary equity and structured capital and setting
      a $2.3 billion pre-money reference point [CO024][CO025]. Existing shareholders VR Capital, Tencent, and FinSight
      also participated in that round [CO026]. This layered mix of equity, bonds, bilateral financing, and structured
      capital supports rapid growth, but the absence of public ownership percentages and board-seat disclosure means
      outside observers still cannot map control with precision [CO044].
    claimRefs: [CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO044]
    tableRefs: [TO003]
  - id: SEC104
    title: Metrics, profitability, and explicit public-data gaps
    body: >-
      Public operating disclosure is strong on profit and transaction scale, but thinner on revenue mix and ownership
      structure. For FY2024, Uzum reported $150 million of net income, nearly 16 million monthly active users, and $345
      million of consolidated GMV [CO028]. The same FY2024 release disclosed $421 million of BNPL total finance volume,
      a $226 million gross loan portfolio, and more than 700,000 Uzum Bank cards issued by year end [CO029]. Earlier 9M
      2024 data already showed steep growth, with $237 million of commerce GMV, $235 million of BNPL total finance
      volume, a $169 million gross loan portfolio, 12.6 million MAU, and $100 million of net income by September 2024
      [CO030].


      FY2025 disclosure extends that picture: Uzum reported $176 million of net profit, GMV above $500 million, $1.2
      billion of total finance volume, $11.1 billion of payment volume, more than 4 million cards issued in the year,
      more than 17,000 active local sellers, and national logistics density of 1,500 pickup points across 450-plus
      locations [CO031][CO032][CO033]. The June 2026 homepage goes even further, claiming more than 5 million cards,
      more than 17,000 sellers, and more than 200 million SKUs [CO034]. The gaps are important: public sources do not
      disclose consolidated revenue, take rate, or segment mix, and workforce disclosures are not fully reconciled across
      sources and dates [CO007][CO044]. Investors therefore get solid proof of scale and profitability, but not a fully
      investment-grade disclosure set yet.
    claimRefs: [CO007, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO044]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: SEC105
    title: Milestones, awards, and external constraints
    body: >-
      The chronology since launch is compressed but coherent. The ecosystem was founded in 2022, assembled around Uzum
      Market, and expanded quickly into new operating layers such as Uzum Tezkor in 2023 and Uzum Avto in 2024
      [CO001][CO005][CO035][CO036][CO037]. Funding milestones then came in fast succession: the March 2024 unicorn
      round, the August 2025 Tencent/VR Capital round, and the March 2026 Oman-led strategic financing
      [CO017][CO019][CO024]. Credit signals also improved during 2025-2026, including a first Fitch rating and major
      local banking awards from Euromoney and Global Finance [CO038][CO039][CO040].


      The main external caution is not weak demand so much as execution in a still-developing market. Trade.gov says
      Uzbekistan e-commerce was only 3.8% of retail in 2024, which implies enormous headroom but also shows how much
      consumer behavior remains offline [CO041]. The same source highlights stricter local data-storage and e-commerce
      platform rules, and it lists a broad competitor set including OLX, Yandex, Wildberries, Ozon, and AliExpress
      [CO042][CO043]. In other words, Uzum is scaling from a strong local leadership position, but it is doing so in a
      market where regulation, competition, and infrastructure investment all still matter materially to the outcome.
    claimRefs: [CO001, CO005, CO017, CO019, CO024, CO035, CO036, CO037, CO038, CO039, CO040, CO041, CO042, CO043]
    tableRefs: [TO004]
    figureRefs: [FO001]
