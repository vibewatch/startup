  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context, valuation anchors, and entry discipline
        blocks:
          - type: paragraph
            body: >
              Uzum now has three public valuation anchors, but only two are reasonably clean. The March 2024 unicorn
              round combined $52 million of primary equity and $62 million of debt and took the company above a $1
              billion post-money valuation. The August 2025 financing was cleaner and more decision-useful: official and
              independent reporting both point to an all-equity round of roughly $65.5-$70 million at approximately $1.5
              billion post-money. That is the best recent hard private anchor because it looks like straightforward
              equity rather than a blended capital structure.


              The March 2026 Oman-led transaction moved the headline reference point to $2.3 billion pre-money, but the
              structure matters as much as the headline number. Uzum's own release and TechCrunch both describe a mix of
              primary equity and convertible or structured capital linked to the next qualified financing round. That
              means investors should not treat $2.3 billion as equivalent to a clean all-common equity mark. It is
              evidence of increasing investor demand and a credible upward re-rating, but not yet proof that new money
              would clear on the same terms without downside protection.


              Capital structure complexity also matters because Uzum has layered debt and private credit on top of
              equity: VR Capital provided UZS 300 billion financing in late 2025, the Eurasian Development Bank
              announced a $70 million loan in May 2026, and management is targeting another $250-$300 million pre-IPO
              raise in late 2026 or early 2027. In other words, dilution risk has not gone away. The investment case is
              strongest if a new investor can either enter at or below the clean-equity-adjusted equivalent of roughly
              $2.0 billion, or obtain terms that compensate for the uncertainty around conversion, preference stack, and
              future fundraising.
