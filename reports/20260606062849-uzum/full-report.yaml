  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Cross-Border Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Uzum now operates a much broader regulated perimeter than a simple marketplace. The company’s current
              stack combines marketplace, express delivery, digital banking, instalment finance, cards, deposits, and
              consumer lending at national scale, while Uzbekistan’s published banking-law stack covers central-bank
              oversight, banks and banking activities, deposit protection, currency regulation, bank secrecy, electronic
              payments, consumer credit, and microfinance. That mix means regulatory exposure is not hypothetical; it is
              embedded in the company’s everyday operating model.


              The residual issue is not evidence of an identified enforcement action, but the mismatch between rapid
              product expansion and limited public compliance disclosure. By 2025-2026 Uzum had layered cross-border
              assortment, millions of cards, online deposits, and a much larger lending book onto the ecosystem, yet the
              retrieved public materials still do not disclose board committees, IR-style compliance contacts,
              regulatory inspection outcomes, or sanctions-screening architecture. FATF’s February 2026 call-for-action
              language and OFAC’s active 2026 sanctions program list show how quickly cross-border counterparties can
              move from routine screening to enhanced due diligence or even countermeasures. Because Uzum relies on
              foreign investors, development-finance lenders, and cross-border marketplace supply, compliance risk can
              flow into funding and assortment at the same time.
