            body: >-
              Public evidence suggests Uzum’s architecture is organized around shared infrastructure rather than
              separate business-unit stacks. The company’s homepage claims Uzum Bank runs on proprietary localized
              infrastructure for instant payment processing and fast card issuance, and independent reporting says the
              same pickup-point network used for e-commerce also distributes physical cards. That physical- digital
              overlap matters because it lowers customer-acquisition cost for banking while turning the logistics estate
              into a regulated-finance distribution asset. On the software side, FY2025 results say Uzum uses machine
              learning in credit screening, risk management, pricing, and personalization; the 2025 financing release
              added fraud prevention to the list of AI-assisted functions. The DataVolt memorandum complements this by
              showing that management is still investing in local compute and cloud capacity, not just buying growth
              through marketing. The missing piece is technical transparency: there is no public architecture paper that
              explains how payments, lending models, merchant systems, or infrastructure layers interact, so the broad
              architecture can be inferred but not audited.
