      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              On the demand side, Uzum addresses a broad mass-market household buyer rather than a narrow niche. The
              ecosystem bundles marketplace assortment, delivery, payments, banking, and instalments for individuals and
              SMEs, and the company now claims more than 20 million monthly users [CM015][CM017]. That scale suggests
              the top of funnel is not only frequent shoppers; it likely includes payments, banking, and other ecosystem
              users who may convert into commerce or credit later [CM017][CM026].


              The key payer distinction is that not every user funds a purchase directly out of cash-on-hand. KPMG
              explicitly points to instalment options as a conversion driver in Uzbekistan, while Uzum says more than
              50% of ecosystem e-commerce payments are already processed through its own fintech rails and that
              card-linked discounts saved users $15.3 million in 2025 [CM021][CM036][CM040]. In other words,
              affordability and payment orchestration are not supporting features around commerce; they are part of the
              product-market fit itself [CM021][CM036][CM040].


              On the supply side, the main buyers are sellers, small businesses, and local partners who need traffic,
              logistics, checkout, and working-capital-like finance rather than pure software. More than 17,000 active
              local sellers, over 200 million SKUs, and national pickup-point density show that merchant aggregation is
              already happening at real scale [CM018][CM019]. But that does not mean all merchants are equal: the most
              attractive cohorts will be those that adopt several Uzum services at once, because the ecosystem is
              clearly designed to deepen attachment through payments and financing rather than through storefront
              presence alone [CM019][CM021].
            claimRefs:
