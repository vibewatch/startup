      - number: '3.3'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Public pricing and capability evidence shows why Uzum’s competition cannot be reduced to lowest price.
              Uzum’s own card proposition includes zero-fee top-ups, commission-free transfers to Uzcard and Humo, and a
              renewable credit limit up to 25 million soums, while company disclosures say its own fintech now processes
              nearly half of marketplace transactions and over 30% of Uzum Tezkor payments [CP020][CP021][CP022]. That
              is a meaningful closed-loop advantage, but it is not uncontested. Yandex makes imported-goods discovery
              and Split payments visible on the marketplace surface; Olcha advertises 0% installments and fast delivery;
              TBC publicly markets deposits at roughly 19.5%-20% and online credit up to 100 million soums; and Alif
              offers 3-36 month installments, a free card, cashback, and merchant tools inside the same umbrella
              [CP002][CP006][CP009][CP010][CP011][CP019]. Click adds a different kind of pressure: it may not own
              logistics, but its 20 million-user payment rail and Click Business tools make it a powerful interception
              layer between shopper and merchant [CP008][CP017][CP035]. The implication is that Uzum wins most clearly
              where local fulfillment control and embedded finance matter together. It looks weaker where a buyer only
              wants an imported SKU, where a specialist electronics seller already offers the financing that matters, or
              where an external superapp can own payment and loyalty without owning the goods flow
              [CP016][CP024][CP031][CP032][CP034].
