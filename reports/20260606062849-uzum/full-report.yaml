      - number: '7.3'
        title: Single-Country Concentration, Macro, and Capital-Stack Risk
        blocks:
          - type: paragraph
            body: >-
              Uzum remains, fundamentally, a single-country underwriting case. Its scale is impressive—more than 20
              million users, more than half of Uzbekistan’s population reached, 17,000-plus sellers, 26-city delivery
              coverage, and a national banking and payments footprint—but almost all of that activity still sits inside
              one economy, one currency, and one evolving regulatory environment. Macro data show why that is
              simultaneously the upside and the risk: Uzbekistan still has high internet penetration, a young
              population, low e-commerce penetration, and significant unbanked headroom, but those same facts mean the
              company’s thesis is tied tightly to one policy and consumption regime.


              Funding risk is similarly concentrated in a small set of cross-border capital providers. The stack now
              spans Series A debt, Tencent and VR Capital equity, an Oman-led strategic round with a convertible
              component linked to the next qualified financing, VR’s local-currency financing, and a $70 million EDB
              loan. That mix reduces reliance on any single investor, but it does not remove market-access risk.
              Instead, it creates a model where country risk, sanctions spillover, and foreign risk appetite can affect
              financing before they visibly affect customer demand. Investors should treat macro and capital risk as
              coupled rather than separate exposures.
