      - CV032
      - CV033
      - CV034
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring of Uzum on market, proof, moat, disclosure quality, capital structure, exit readiness, and
      valuation discipline.
    data:
      items:
        - label: Market runway
          value: 4
          note: Uzbekistan remains underpenetrated in e-commerce and digital finance
        - label: Scale proof
          value: 4.5
          note: User, seller, card, and payments evidence is already meaningful
        - label: Profitability proof
          value: 4
          note: FY2024 and FY2025 net profit disclosure is unusually strong for a startup-scale ecosystem
        - label: Disclosure quality
          value: 2
          note: Segment economics, cap table, and public-company cadence remain limited
        - label: Capital structure cleanliness
          value: 2
          note: March 2026 structured capital complicates headline valuation comparability
        - label: Exit readiness
          value: 2.5
          note: Better suited to another private financing than a near-term IPO on current disclosure
        - label: Valuation discipline
          value: 3
          note: Reasonable only with price sensitivity and a data-room-backed terms check
    approximationNotes: >-
      Scores are directional judgment aids, not a mechanical rating system. Lower scores here reflect missing evidence
      and structure complexity more than a weak operating business.
    claimRefs:
      - CV010
      - CV012
      - CV017
      - CV024
      - CV035
      - CV041
      - CV045
