  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: >-
          Revenue model is clearly multi-line, but public disclosure still favors activity metrics over realized
          monetization
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a broad revenue surface rather than a single-line marketplace story. Uzum
              publicly groups marketplace, express delivery, traditional and digital banking, BNPL, auto, and
              entrepreneur tools inside one ecosystem, and the company repeatedly argues that these services reinforce
              one another. The most economically useful disclosed signal is not a public price list but internal traffic
              capture: Uzum says more than half of e-commerce payments already run through its own fintech rails, and in
              Q2 2024 it said more than 55% of Uzum Market orders were paid through Nasiya. That supports a flywheel in
              which commerce volume seeds cards, payments, and lending, while fintech in turn lowers checkout friction
              and deepens retention. The business overview also claims users saved $15.3 million with Uzum Bank card
              discounts in 2025, reinforcing that payments are being used as a behavioral and monetization layer, not
              just a utility feature.

              Segment-level scale metrics are strong across the ecosystem. FY2025 disclosures showed more than $500
              million of e-commerce GMV, $1.2 billion of fintech volume, $11.1 billion of payment volume, more than 4
              million cards issued during 2025, more than 17,000 local sellers, and 1,500 pickup points in more than 450
              locations. The June 2026 homepage pushes those surfaces further, claiming more than 5 million Uzum cards,
              13% share of the online-payments market, 40% BNPL share, and more than 3,000 Tezkor partners across 26
              cities. At the product surface level, Uzum Market still advertises delivery from one day, and an April
              2025 Tezkor update described 25 cities, 2,600 partners, and 7,000 couriers; those are useful
              service-density proxies, but they also imply a real courier and fulfillment cost base behind the growth
              story. Competitive retail surfaces make the pricing ambiguity sharper: an archived February 2026 Olcha
              storefront still advertised 0% installment payments and nationwide delivery, reminding diligence that
              Uzbek shoppers are accustomed to aggressive credit merchandising even when Uzum does not disclose its own
              realized lending yield or subsidy level. What remains missing is the realized monetization on each stream.
              Public materials do not disclose marketplace take rate, merchant discount rate, lending yield, deposit
              pricing, delivery fee economics, or the commercial model behind Uzum Avto and Uzum Business. The chapter
              therefore treats the existence and scale of the revenue lines as established, but their realized mix and
              quality as still private.
