      - number: '5.2'
        title: Logistics Stack and Fulfillment Evolution
        blocks:
          - type: paragraph
            body: >-
              The strongest product-engineering evidence around Uzum sits in logistics, where the company has
              progressively unbundled who owns inventory, storage, and delivery. In 2023 Uzum Market emphasized classic
              operator-led fulfillment: next-day delivery, 230 pickup points, and courier coverage in more than 60
              cities and towns. By late 2024 it had added FBS, allowing sellers to keep stock and pack goods in their
              own warehouses while Uzum still performed line-haul and final delivery. By June 2026 Uzum had introduced
              DBS, where sellers can also handle final delivery and choose their own service zones and timelines, with
              no marketplace logistics fee. Independent reporting says management wants 20-30% of deliveries to run
              through these newer models, which matches the product logic: FBS and DBS broaden assortment, support bulky
              or customized categories, and reduce the need for Uzum-owned inventory handling on every order. Tezkor’s
              widening courier footprint reinforces that this is an operating platform with multiple last-mile modes,
              not just a catalog site.
