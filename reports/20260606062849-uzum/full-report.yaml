    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the decision-useful valuation anchors and public benchmark ecosystems retained for this chapter: Uzum's
        2024, 2025, and 2026 financing marks plus the already-fetched Kaspi.kz and MercadoLibre public-company pages. It
        is not an exhaustive census of all global super-app or fintech-commerce comparables.
    columns:
