  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down-round or weak pre-IPO raise
        - Next priced financing clears below roughly $2.0B or below-market terms dominate economics
        - Suggests the $2.3B reference was not durable common-equity value
        - Reset to bear-case underwriting or pass
      - - Profitability deterioration
        - FY2026 earnings bridge shows material drop versus 2025 net profit or rising credit drag
        - Breaks the argument that Uzum deserves a premium multiple because it is already profitable
        - Move valuation work back toward the clean 2025 floor
      - - Hidden preference or conversion overhang
        - Oman structured capital or prior preferred shares receive unusually protective liquidation economics
        - Headline valuation would overstate what new common equity is actually buying
        - Recut the deal off common-equity proceeds, not the press-release mark
      - - Demand quality weakens
        - GMV, TPV, card growth, or seller activity flatten without offsetting margin gains
        - Undercuts the ecosystem-flywheel argument behind the step-up valuation
        - Downgrade recommendation and require new proof before re-engaging
      - - Uzbek digital tailwind slows materially
        - E-commerce penetration or digital adoption disappoints versus current public forecasts
        - Reduces the market-expansion logic supporting premium growth assumptions
        - Compress toward base or bear case even if company execution remains solid
    notes: >-
      The triggers mix private-diligence items with public monitors because both terms and operating durability
      determine whether the current reference price is investable.
