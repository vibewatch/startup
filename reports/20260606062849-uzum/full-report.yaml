      - number: '5.4'
        title: Workflows, Merchant Surfaces, and Capability Maturity
        blocks:
          - type: paragraph
            body: >-
              Uzum’s mature capabilities are the ones tightly linked to its existing commerce-and-fintech flywheel:
              marketplace discovery, installment-led checkout, card issuance, pickup-based last mile, and merchant
              access to demand through the marketplace. The public evidence is thinner for seller software and technical
              access. Uzum Business is consistently described as the entrepreneur layer for legal entities, but the
              fetched corpus does not expose a merchant API reference, ads console, reconciliation product, or detailed
              seller-ops documentation. Avto is similarly promising but not yet fully transparent: the core dealer
              marketplace and verification logic are visible, while financing promises still read partly as roadmap
              messaging. This maturity split is important. It suggests that Uzum’s strongest product moat today is
              operational integration across demand, payments, and fulfillment, whereas the merchant and developer
              surfaces remain far less legible to outside partners than the scale of the ecosystem would normally imply.
