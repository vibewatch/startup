      - number: '1.3'
        title: Funding history, valuation path, and credit stack
        blocks:
          - type: paragraph
            body: >-
              Uzum’s capital history is unusually diversified for a company founded only in 2022. The March 2024 unicorn
              financing combined $52 million of primary Series A equity with $62 million of debt, taking the company
              above a $1 billion post-money valuation [CO017]. FinSight Ventures led that round, while Xanara Investment
              Management and Uzum senior management also participated [CO018]. In August 2025, Uzum announced another
              major equity round led by Tencent and VR Capital with FinSight participating, valuing the company at
              approximately $1.5 billion post-money [CO019][CO021]. Independent outlets reported the same round as $65.5
              million rather than the company’s rounded “nearly $70 million” figure, so the fairest framing is
              approximately $65.5-70 million depending on source [CO020].


              Capital formation did not stop with plain equity. Uzum later disclosed a UZS 300 billion financing from VR
              Capital, said it registered its first 300 billion UZS bond issuance in 2025, and signed a further $70
              million loan with the Eurasian Development Bank in May 2026 [CO022][CO023][CO027]. In March 2026 the
              company then added a strategic Oman-led transaction exceeding $130 million, combining primary equity and
              structured capital and setting a $2.3 billion pre-money reference point [CO024][CO025]. Existing
              shareholders VR Capital, Tencent, and FinSight also participated in that round [CO026]. This layered mix
              of equity, bonds, bilateral financing, and structured capital supports rapid growth, but the absence of
              public ownership percentages and board-seat disclosure means outside observers still cannot map control
              with precision [CO044].
