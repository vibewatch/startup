      - number: '4.2'
        title: >-
          Profitability is real, but GMV, TPV, TFV, and card growth do not by themselves resolve revenue quality or unit
          economics
        blocks:
          - type: paragraph
            body: >-
              The strongest positive fact in Uzum's public record is that the business is already profitable while still
              scaling aggressively. The company reported FY2024 net income of $150 million and FY2025 net profit of $176
              million, while also reporting positive marketplace EBITDA before marketing costs by 9M 2024. Volume
              metrics around those profits are substantial: FY2024 GMV reached $345 million, BNPL financed volume
              reached $421 million, gross loan portfolio reached $226 million, and cards outstanding topped 700,000 by
              year-end. Through 1H 2024 and 9M 2024, Uzum also disclosed rapid intermediate traction in users, sellers,
              orders, and cash-loan disbursements, which makes the later FY2024 and FY2025 profit disclosures look
              operationally credible rather than one-off.

              But profitability alone is not enough to underwrite revenue quality. Many of the headline figures are
              activity metrics or balance-sheet scale metrics, not revenue recognition metrics: GMV measures merchandise
              moved through the marketplace; TPV measures payment flow; TFV measures financed volume; card issuance
              shows distribution; deposits, loans, and seller counts show scale. TechCrunch and The Future Media
              reported revenue of $505 million in 2024 and $691 million in 2025, which is directionally useful, but
              Uzum's own official releases do not yet provide a public revenue-recognition bridge, realized revenue mix,
              or gross margin by line. That makes the critical underwriting question not whether demand exists, but how
              much of that demand converts into durable, high-quality revenue after funding costs, logistics expense,
              credit losses, promotions, and infrastructure overhead. Public evidence points to fintech as the main
              profit engine, but the margin stack that gets from volume to net income is still only partially visible.
