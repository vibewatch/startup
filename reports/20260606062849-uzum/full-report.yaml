    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Bear, base, and bull valuation ranges for Uzum using clean-round anchors, structure discounts, and a successful
      pre-IPO-upside case.
    data:
      items:
        - label: Bear case
          low: 1300
          mid: 1500
          high: 1700
          note: Reverts toward August 2025 clean-equity anchor if the structure discount dominates
        - label: Base case
          low: 1900
          mid: 2150
          high: 2400
          note: March 2026 step-up broadly holds but remains discounted for structure and disclosure gaps
        - label: Bull case
          low: 2600
          mid: 2900
          high: 3200
          note: Requires clean up-round confirmation and stronger audited proof of durable profit growth
    approximationNotes: >-
      The range is deliberately evidence-constrained. Public information is sufficient to frame scenarios, but not
      sufficient to treat any single number as a precise intrinsic value.
    claimRefs:
