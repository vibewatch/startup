      - number: '3.4'
        title: Switching costs, lock-in, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Consumer-side switching costs in Uzbekistan look low in formal terms and moderate in behavioral terms. A
              shopper can keep Click for transfers, TBC for savings, Alif for installments, Yandex for imported goods,
              and still use Uzum for fast local delivery; none of those choices requires exclusive migration in the way
              payroll or ERP replacement would [CP018][CP019][CP024]. That makes multi-homing the default base case, not
              an edge case [CP024][CP035][CP037]. The stickier part of Uzum’s model is on merchant and operational
              layers. As Uzum rolled out FBS and DBS models, plus a pickup-point network and merchant tools, seller
              workflows became more embedded in its logistics, payments, and demand-generation stack
              [CP023][CP026][CP031]. Even so, merchant lock-in is still incomplete: sellers can continue to multi-home
              across specialist retailers, direct channels, classifieds, or fintech-led merchant programs, especially
              where the product is standardized and the buyer is price sensitive [CP014][CP023][CP032][CP033]. Uzum’s
              best distribution moat is therefore not a hard contractual barrier but the convenience of coordinating
              traffic, trust, payments, and fulfillment in one local platform. That is a real advantage, but one that
              must be renewed with service quality and density because the consumer can always defect at the next search
              or payment moment [CP021][CP024][CP031][CP040].
            claimRefs:
