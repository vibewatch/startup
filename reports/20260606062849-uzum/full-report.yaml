  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer reach is national, multi-surface, and increasingly finance-attached
        blocks:
          - type: paragraph
            body: >-
              Uzum’s paying and using customer base is not a single app cohort; it is a layered Uzbek consumer network
              spanning marketplace shopping, rapid delivery, cards, BNPL, and merchant-facing tools. The strongest
              current top-line proof comes from Uzum’s own homepage plus official and independent results coverage. The
              homepage says 20 million residents of Uzbekistan use Uzum services every month, more than half of the
              population uses its services, and 9 out of 10 residents know Uzum Market. Earlier disclosed timepoints fit
              the same slope: the 1H 2024 PR Newswire release said the ecosystem had 10.6 million monthly active users,
              while FY2024 results said MAU rose 61% year on year to nearly 16 million, equal to roughly 40% of the
              country’s population. TechCrunch then reported that Uzum had more than 17 million monthly active users by
              the August 2025 financing and that the ecosystem reached about 20 million monthly users by March 2026.


              The customer map is therefore best understood as a consumer platform with embedded financial deepening.
              Marketplace users are the broadest audience, but official payments evidence shows that a growing share of
              commerce is already transacting inside Uzum’s own financial rails. PR Newswire said Uzum Bank had issued
              1.5 million cards by March 2025 and that nearly 50% of Uzum Market transactions plus more than 30% of Uzum
              Tezkor payments were already processed through the ecosystem’s fintech solutions. FY2025 results then said
              Uzum issued more than 4 million payment cards during 2025, while the homepage’s current framing says Uzum
              Bank now has more than 5 million cards and $11.1 billion of 2025 payment volume. The key conclusion is
              positive for real customer adoption: Uzum is no longer only attracting shoppers; it is also converting a
              meaningful share of commerce users into payment, card, and credit users inside the same ecosystem.
