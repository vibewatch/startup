      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Djasur Djumaev remains the central decision-maker and public face of Uzum, serving as founder and CEO
              across the ecosystem [CO008]. The official management page also names a fairly broad operating bench for a
              young company: Nikolay Seleznev handles strategy and business development, Roman Lavrentyev runs
              operations while also leading Uzum Fintech, Nikita Gulyaev is CFO, Sergey Salikov is general counsel,
              Kevin Khanda leads technology and product, Egor Abramets runs Uzum Avto, and Dmitry Benzoruk leads Uzum
              E-commerce [CO009][CO010][CO011][CO012][CO013][CO014][CO015]. That roster suggests functional coverage
              well beyond a three-person founding team, including finance, legal, product, operations, and business-unit
              leadership.


              What is much less visible is the governance overlay above management. The public materials retrieved for
              this chapter expose management biographies but not a board roster, committee structure, or independence
              disclosures [CO016]. That does not prove weak governance, but it does mean outside investors cannot infer
              voting dynamics, founder checks, or lender influence from public sources alone. This matters more for Uzum
              than for a typical startup because the company already operates at national infrastructure scale in
              payments, lending, marketplace logistics, and banking-linked services [CO003][CO006].
