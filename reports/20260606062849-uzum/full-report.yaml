      - number: '6.2'
        title: App pages and operating disclosures prove live adoption, but not retention economics
        blocks:
          - type: paragraph
            body: >-
              Uzum’s retained customer-proof set is unusually clean for a consumer ecosystem in an underpenetrated
              market because the company exposes multiple public app and app-page surfaces. Google Play pages confirm
              that Uzum Market, Uzum Tezkor, Uzum Bank, Uzum Business, and Uzum Nasiya Business are live, user-facing
              products rather than conceptual slides. Those pages also show what the company wants customers to do: Uzum
              Market emphasizes next-day delivery, installments up to 12 months, free pickup-point collection, returns,
              and user review reading; Uzum Tezkor emphasizes roughly 30-minute delivery, price parity with restaurants,
              and more than 1,000 partner restaurants and stores; Uzum Bank emphasizes instant virtual-card issuance,
              plastic-card pickup, cashback, QR acceptance at 6,000+ partners, and a revolving limit of up to 25 million
              som. On the merchant side, Uzum Business and Uzum Nasiya Business show that sellers and business operators
              are not served only by a seller cabinet on desktop; they also have mobile workflows for payments, payroll,
              contracts, customer registration, and bonus tracking.


              What these app surfaces prove, however, is narrower than what investors need for durability underwriting.
              They confirm public storefront presence, product breadth, and buyer or seller tasks that can be completed
              inside the ecosystem. They do not by themselves prove exact repeat-order rates, active-buyer frequency,
              merchant churn, GRR, NRR, or top-customer concentration. That is why the best read is to combine app-page
              proof with official operating metrics. When Google Play storefronts are read together with 1 million
              monthly orders in July 2023, 17,000+ active local sellers in 2025, 25-city Tezkor coverage, and millions
              of cards issued, they establish real production adoption. But they still function as proof-of-use and
              proof-of-distribution, not as a substitute for cohort tables or unit-economics disclosure.
