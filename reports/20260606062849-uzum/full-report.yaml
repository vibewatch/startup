      - number: '2.2'
        title: 'Multi-lens sizing: attractive retail headroom, fuzzier fintech denominators'
        blocks:
          - type: paragraph
            body: >-
              The cleanest public sizing lens is e-commerce. KPMG sized Uzbekistan’s e-commerce market at $311 million
              in 2022, while Trade.gov said the market reached $1.2 billion in 2024, equal to 3.8% of retail
              [CM006][CM007]. KPMG and Trade.gov also align on a 2027 forecast of $1.8-2.2 billion and 9-11% of retail
              penetration [CM008]. That makes Uzbek e-commerce simultaneously real and underpenetrated: the market is
              already big enough to matter, but still far from saturation if the forecast holds [CM007][CM008].


              Uzum’s disclosed commerce scale suggests the company already owns meaningful SOM inside that market.
              Official and third-party sources support more than $500 million of 2025 GMV, 17,000+ active sellers, and
              national logistics reach [CM017][CM018][CM019][CM020]. On that evidence, Uzum is no longer a speculative
              local startup competing for an unformed market; it is already one of the market-shaping actors inside
              Uzbek online retail [CM019][CM020].


              The adjacent fintech layers look even larger, but the sizing is much less rigorous. Uzum claims $11.1
              billion of 2025 TPV and 13% share of online payments, plus $1.2 billion of BNPL disbursements and 40% BNPL
              share [CM022][CM024]. Those figures imply very large payments and instalment markets if the denominators
              align, but the implied $85 billion online-payments lens and roughly $3.0 billion BNPL lens are still
              company-derived rather than independently benchmarked [CM023][CM025]. The same caution applies to 2027
              market forecasts: Kun’s $1 billion marketplace-turnover target and KPMG’s $1.8-2.2 billion broader
              e-commerce forecast should be preserved side by side, not merged into a fake precision number
              [CM009][CM010].
