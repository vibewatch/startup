      - number: '7.2'
        title: Credit, Fraud, and Digital Banking Risk
        blocks:
          - type: paragraph
            body: >-
              The core financial-model risk is that Uzum’s fastest-growing activities are exactly the ones most exposed
              to default, fraud, collections quality, and regulatory scrutiny. Public results show more than four
              million cards issued during 2025, more than $11.1 billion of payment volume, over $50 million of online
              deposits gathered within three months, and a $3.1 billion loan portfolio at Kapitalbank. FY2024 already
              showed 700,000 card issuances with revolving credit limits, $421 million of BNPL finance volume, and a
              $226 million gross loan portfolio, so the risk base is materially larger than it was one year earlier.


              There are real mitigants. Uzum says it uses ML-driven credit screening, risk management, pricing, and
              personalization, and Fitch’s B/Positive rating case explicitly referenced profitability, liquidity, and
              control over key subsidiaries as strengths. But public materials still do not disclose NPL ratios,
              fraud-loss splits, charge-off curves, recovery rates, or collections KPIs. That means investors can see
              rapid volume growth, yet cannot independently judge whether 2025-2026 credit cohorts are seasoning in line
              with plan. Because Uzum’s banking, payments, cards, and BNPL activities reinforce one another, any
              weakness in underwriting or fraud controls would likely hit fee income, regulatory posture, and funding
              confidence together rather than in isolation.
