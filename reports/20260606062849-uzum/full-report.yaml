        - label: 13.1x net income
          value: 2306
          note: Approximate March 2026 headline reference
        - label: 15.0x net income
          value: 2640
          note: Requires cleaner terms and stronger disclosure
        - label: 18.0x net income
          value: 3168
          note: Bullish outcome that needs up-round proof and sustained earnings expansion
