  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Uzum’s rivalry is structural rather than head-to-head with one identical app. In managed e-commerce, the
              most direct marketplace challenger is Yandex Market, which brings Yandex Go distribution, imported
              assortment, and Split payments into Uzbekistan [CP001][CP002][CP015]. In substitutes and status quo
              channels, OLX still anchors the country’s broad classifieds market and BirBir is trying to modernize
              direct buyer-seller trade with zero- commission logic and a reported 500,000 users plus $10 million of
              investment, while bazaars, Telegram-led selling, and direct merchant pages remain the informal baseline
              [CP003][CP004][CP014]. In category-specific retail, Asaxiy, Olcha, Mediapark, and Texnomart all compete
              for the highest-value online categories—especially electronics and appliances—with public installment
              offers and national delivery promises [CP005][CP006][CP007][CP016]. A separate but overlapping battlefield
              sits in fintech. Click, Payme, TBC Bank, and Alif are not full replicas of Uzum’s ecosystem, but they can
              still capture the checkout, wallet, deposit, credit, or merchant-acquiring moment that makes an ecosystem
              sticky [CP008][CP009][CP010][CP017][CP018]. The practical result is that Uzum is not defending one
              marketplace SKU catalog; it is defending the whole chain from discovery and order placement to payment,
              installment conversion, fulfillment, and repeat use [CP011][CP012][CP013][CP021].
