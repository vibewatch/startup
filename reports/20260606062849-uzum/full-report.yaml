        - First hard milestone proving institutional willingness to fund the model.
        - Too early to be a current underwriting anchor.
      - - Uzum August 2025 round
        - Approximately $65.5M-$70M all-equity financing
        - Approximately $1.5B post-money; cleanest recent anchor
        - Best downside screen because it looks like straightforward priced equity.
        - Still private and seven months older than the latest reference point.
      - - Uzum March 2026 Oman transaction
        - Over $130M mix of equity and structured capital
        - $2.3B pre-money reference point, not pristine common-equity mark
        - Best current headline reference and proof of stronger investor demand.
        - Convertible structure can overstate common-equity comparability.
      - - Kaspi.kz
        - Public regional super-app benchmark
        - Listed public-company analogue with payments, marketplace, fintech, and 1Q26 filing trail
        - Closest regional model for what a post-Soviet listed super app can look like.
