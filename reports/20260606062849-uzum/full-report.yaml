      - number: '1.4'
        title: Metrics, profitability, and explicit public-data gaps
        blocks:
          - type: paragraph
            body: >-
              Public operating disclosure is strong on profit and transaction scale, but thinner on revenue mix and
              ownership structure. For FY2024, Uzum reported $150 million of net income, nearly 16 million monthly
              active users, and $345 million of consolidated GMV [CO028]. The same FY2024 release disclosed $421 million
              of BNPL total finance volume, a $226 million gross loan portfolio, and more than 700,000 Uzum Bank cards
              issued by year end [CO029]. Earlier 9M 2024 data already showed steep growth, with $237 million of
              commerce GMV, $235 million of BNPL total finance volume, a $169 million gross loan portfolio, 12.6 million
              MAU, and $100 million of net income by September 2024 [CO030].


              FY2025 disclosure extends that picture: Uzum reported $176 million of net profit, GMV above $500 million,
              $1.2 billion of total finance volume, $11.1 billion of payment volume, more than 4 million cards issued in
              the year, more than 17,000 active local sellers, and national logistics density of 1,500 pickup points
              across 450-plus locations [CO031][CO032][CO033]. The June 2026 homepage goes even further, claiming more
              than 5 million cards, more than 17,000 sellers, and more than 200 million SKUs [CO034]. The gaps are
              important: public sources do not disclose consolidated revenue, take rate, or segment mix, and workforce
              disclosures are not fully reconciled across sources and dates [CO007][CO044]. Investors therefore get
              solid proof of scale and profitability, but not a fully investment-grade disclosure set yet.
