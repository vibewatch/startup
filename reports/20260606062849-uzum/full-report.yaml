  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and reachable demand
        blocks:
          - type: paragraph
            body: >-
              For Uzum, the relevant market is not just one marketplace app. The commercial boundary starts with Uzbek
              online retail and classifieds discovery, but it extends into the payment, card, and instalment rails that
              determine whether browsing actually converts into paid orders. That is the logic behind treating
              e-commerce, online payments, digital banking, BNPL, and seller tooling as one connected market system
              rather than five unrelated categories [CM015][CM016]. In practice, this chapter therefore includes digital
              retail orders, merchant enablement, online checkout and stored-value payment behavior, and point-of-sale
              consumer finance, while excluding offline cash-only retail, wholesale corporate banking, and export-only
              B2B flows [CM015][CM016].


              The reachable audience is already large enough to support national-scale digital platforms. DataReportal
              counted 33.1 million internet users, 33.9 million mobile connections, and 14.1 million social-media
              identities at the end of 2025 or October 2025 [CM001][CM002][CM003]. Trade.gov adds that roughly 60% of
              the population is under 30 and that public telecom investment, including 5G rollout and expanded data
              throughput, is still improving basic connectivity [CM004][CM005]. Those facts do not guarantee
              monetization, but they do mean Uzbekistan is no longer a low-connectivity frontier case for consumer
              internet.


              At the same time, the status quo is not a clean, formal marketplace market. Kun notes that traditional
              purchasing habits still matter, while Telegram, peer-to-peer listings, OLX-style classifieds, and newer
              entrants such as BirBir all remain relevant substitutes for managed marketplace transactions
              [CM012][CM013][CM014]. That substitute set matters because it explains why digital adoption can rise
              quickly without all of that demand consolidating into one formal marketplace or one payment rail
              [CM011][CM014].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
