      - number: '1.5'
        title: Milestones, awards, and external constraints
        blocks:
          - type: paragraph
            body: >-
              The chronology since launch is compressed but coherent. The ecosystem was founded in 2022, assembled
              around Uzum Market, and expanded quickly into new operating layers such as Uzum Tezkor in 2023 and Uzum
              Avto in 2024 [CO001][CO005][CO035][CO036][CO037]. Funding milestones then came in fast succession: the
              March 2024 unicorn round, the August 2025 Tencent/VR Capital round, and the March 2026 Oman-led strategic
              financing [CO017][CO019][CO024]. Credit signals also improved during 2025-2026, including a first Fitch
              rating and major local banking awards from Euromoney and Global Finance [CO038][CO039][CO040].


              The main external caution is not weak demand so much as execution in a still-developing market. Trade.gov
              says Uzbekistan e-commerce was only 3.8% of retail in 2024, which implies enormous headroom but also shows
              how much consumer behavior remains offline [CO041]. The same source highlights stricter local data-storage
              and e-commerce platform rules, and it lists a broad competitor set including OLX, Yandex, Wildberries,
              Ozon, and AliExpress [CO042][CO043]. In other words, Uzum is scaling from a strong local leadership
              position, but it is doing so in a market where regulation, competition, and infrastructure investment all
              still matter materially to the outcome.
