chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, stage, and business model
        blocks:
          - type: paragraph
            body: >-
              Uzum is a founder-led Uzbek digital ecosystem that official materials describe as the country’s largest
              digital platform, combining e-commerce and fintech services for both consumers and entrepreneurs [CO003].
              The company was founded in 2022 by Djasur Djumaev and Uzbek partners [CO001], and independent coverage
              described it as Tashkent-headquartered by August 2025 [CO002]. From the start, Uzum was built as a
              multi-vertical platform rather than a single-product marketplace: today the disclosed stack includes Uzum
              Market, Uzum Tezkor, Uzum Bank, Uzum Nasiya, Uzum Business, and Uzum Avto [CO004]. The official history
              also shows how the ecosystem was assembled in 2022, with Uzum Market becoming the first branded service
              while Apelsin and Uzum Nasiya were folded into the platform [CO005].


              Stage-wise, Uzum is no longer an early startup. It has already crossed unicorn status, is profitable, and
              is still preparing for a larger Series B / pre-IPO capital raise rather than behaving like a fully mature
              public-company analogue [CO017][CO021][CO025][CO045]. The operating footprint is already national in
              character: as of March 2026 the company said its services reached more than 20 million people, and its
              June 2026 homepage claimed more than 14,000 employees across the ecosystem [CO006][CO007]. The strategic
              logic is explicit in official business materials: commerce creates demand, payments and instalments
              increase conversion, and banking products deepen retention and monetization [CO004][CO006].
