    rows:
      - - 'THESIS: Uzum already has unusual scale for a four-year-old Uzbek ecosystem.'
        - >-
          FY2025 net profit was $176M, while the June 2026 homepage claimed more than 20M users, 17k sellers, and 5M
          cards.
        - >-
          A slower user or seller trajectory in the next data room would weaken the idea that Uzum has already reached
          national-platform density.
      - - 'THESIS: The 2025 to 2026 valuation step-up reflects genuine financing momentum, not only narrative.'
        - >-
          Public evidence shows a move from an approximately $1.5B clean equity round in August 2025 to a $2.3B
          pre-money reference in March 2026.
        - The view improves only if the next round confirms the step-up on clean equity terms.
      - - >-
          THESIS: Kaspi and MercadoLibre demonstrate that commerce-plus-fintech ecosystems can deserve premium public
          valuations.
        - >-
          Both retained public-comparable pages describe integrated marketplace, payments, and fintech platforms with
          continuous filing cadence.
        - The read-through strengthens if Uzum starts disclosing segment economics with similar regularity.
      - - 'ANTI-THESIS: The March 2026 mark is not a pristine common-equity valuation.'
        - >-
          Official and independent reporting describe a blend of equity and structured convertible capital linked to the
          next financing.
        - The concern fades only if the conversion and liquidation terms prove standard and non-punitive.
      - - 'ANTI-THESIS: Public disclosure still lags what investors can inspect for Kaspi or MercadoLibre.'
        - Uzum has not published a public cap table, preference stack, or audited segment-level profitability bridge.
        - The concern would ease with audited 2026 segment reporting and cap-table transparency.
      - - 'ANTI-THESIS: More capital is likely needed before exit.'
        - Management is targeting a $250M-$300M pre-IPO raise and has layered debt facilities on top of equity.
        - The issue becomes less material if the next round is clearly accretive and minimally dilutive.
    notes: >-
      The positive case is evidence-backed, but the negative case is mostly about valuation cleanliness and disclosure
      quality rather than disbelief in the business model.
