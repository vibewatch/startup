      - number: '8.3'
        title: Bull, base, and bear scenarios with explicit assumptions
        blocks:
          - type: paragraph
            body: >
              The scenario work has to stay disciplined because public evidence is strong on top-line scale and
              financing history but weak on segment-level economics and terms. The bear case assumes that investors
              ultimately anchor to the last clean equity round rather than the structured 2026 reference. That can
              happen if the next pre-IPO raise clears below expectations, if credit costs or funding needs rise, or if
              the headline $2.3 billion mark proves to have embedded investor protections that common shareholders
              cannot fully enjoy. Under that case, a valuation around $1.3-$1.7 billion is defensible, essentially
              reverting toward the August 2025 anchor plus modest credit for continued growth.


              The base case assumes that the 2025 operating trajectory continues into 2026 and that the Oman transaction
              was directionally right but still deserves a structure discount. In this case, the next financing round
              clears around the current reference point, profitability remains positive, cards, payments, and commerce
              continue reinforcing each other, and no major macro or regulatory shock disrupts Uzbek digitization. That
              supports a valuation range of roughly $1.9-$2.4 billion. It is the most probable case because it gives
              Uzum credit for real execution while refusing to pretend that the current public record is as clean as a
              listed comparable.


              The bull case requires more than narrative momentum. It needs proof that the planned pre-IPO raise clears
              above the March 2026 reference on clean terms, that profitability scales with GMV and TPV rather than
              flattening, and that private diligence shows no hidden cap-table overhang. Only then does a $2.6-$3.2
              billion valuation range become supportable. Weighting the scenarios 25% bear, 50% base, and 25% bull
              produces a central value near $2.1-$2.3 billion, which means the current headline reference is usable but
              leaves limited margin of safety for new common-equity investors.
