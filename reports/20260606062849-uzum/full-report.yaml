  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Surfaces and Ecosystem Fit
        blocks:
          - type: paragraph
            body: >-
              Uzum’s public product surface is coherent in customer-workflow terms even though the company still markets
              multiple named businesses. Uzum Market is the traffic and assortment engine, Uzum Tezkor extends the same
              consumer relationship into rapid local delivery, Uzum Bank and Uzum Nasiya turn checkout activity into
              card, payment, and lending adoption, and Uzum Business acts as the legal- entity layer for entrepreneurs.
              Uzum Avto is the clearest example of adjacent expansion: it reuses brand reach, consumer trust, and
              financing capabilities to enter higher-ticket transactions rather than building a disconnected automotive
              brand. The business overview explicitly describes a loop in which shopping activity migrates users into
              fintech products, while current corporate surfaces show this is not merely conceptual: more than half of
              ecosystem e-commerce payments are said to run over Uzum’s own fintech rails, and payment-card discounts
              are used to change user behavior at checkout. That makes the platform architecture less like a bundle of
              apps and more like a localized commerce, payments, and logistics stack tuned for Uzbekistan’s consumer and
              SME workflows.
