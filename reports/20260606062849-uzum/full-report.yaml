        title: Competition, Logistics Execution, and Disclosure Risk
        blocks:
          - type: paragraph
            body: >-
              Competition and execution risk rise with scale. Trade.gov, OLX, and Yandex show that Uzbek consumers
              already have credible alternative local and cross-border shopping surfaces, while Uzum must coordinate a
              large and expanding partner network across sellers, pickup points, cafes, shops, restaurants, and delivery
              cities. Those numbers are evidence of distribution strength, but they also imply a larger operational
              blast radius if seller quality slips, inventory accuracy degrades, or courier and pickup-point economics
              deteriorate.


              Governance and disclosure are the other major execution variables. Uzum has a named operating bench across
              operations, fintech, finance, legal, product, and e-commerce, which is a genuine mitigation to pure
              founder dependency. Even so, retrieved public materials still stop at management biographies and financing
              headlines. They do not provide a board roster, committee structure, ownership evolution after later
              rounds, or an IR-equivalent disclosure stack. Kaspi.kz is a useful regional benchmark: its IR site
              separately exposes filings, management, platform pages, and investor contacts. Uzum’s thinner disclosure
              does not prove a hidden problem, but it materially increases uncertainty around governance quality,
              related-party oversight, and accountability as the company approaches larger financing rounds.
