companyProfile:
  summary: >-
    Uzum is a Tashkent-based digital ecosystem founded in 2022 by Djasur Djumaev and Uzbek partners.
    It combines marketplace commerce, express delivery, digital banking, BNPL, entrepreneur tools,
    and auto listings into a locally optimized consumer platform. Public materials support real national
    scale and profitability, but the company still discloses much less governance, cap-table, and
    segment-level financial detail than investors would want for a premium private valuation.
