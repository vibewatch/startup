chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a diversified commerce-plus-fintech revenue model at Uzum, with FY2024 net income of
    $150 million and FY2025 net profit of $176 million alongside strong GMV, TPV, card, and lending growth. The
    company has also layered in increasingly complex capital sources across equity, debt, structured capital, and
    development-bank funding, but underwriting is still blocked by missing disclosure on realized revenue mix, gross
    margins, credit quality, liquidity, and runway.
