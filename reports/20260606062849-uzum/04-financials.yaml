  - id: SECI03
    title: The capital stack is broadening from equity into debt, structured capital, and development finance, but liquidity remains opaque
    body: >-
      Uzum's capital stack has become materially more complex since the March 2024 unicorn round. Officially, the company
      first disclosed $114 million of 2024 financing split between $52 million of Series A equity and $62 million of
      debt. By late 2024 management was openly targeting up to $300 million of additional capital for BNPL, online
      lending, and e-commerce expansion, and in August 2025 Uzum said it raised nearly $70 million of new equity at
      roughly a $1.5 billion post-money valuation. Independent coverage broadly confirms the valuation step-up, although
      one source reported the round as $65.5 million, showing that even seemingly simple financing facts need
      reconciliation. After that equity raise, Uzum added more balance-sheet instruments: VR Capital provided UZS 300
      billion in financing in November 2025, Kapital Bank Azerbaijan participated in $22 million of joint debt financing,
      Oman-led investors provided more than $130 million of primary equity plus structured capital in March 2026, and the
      Eurasian Development Bank added a $70 million investment loan in May 2026.

      That breadth is strategically positive because it suggests multiple funding channels are open to Uzum, especially
      after the company highlighted a B rating with Positive Outlook from Fitch. But capital access is not the same as
      capital adequacy. Public disclosures say where new money is broadly intended to go—fintech expansion, cards,
      lending, payments, digital banking, logistics, and infrastructure—but they do not say how much unrestricted cash
      remains, what monthly burn looks like after each raise, or how much lending growth consumes internal versus external
      funding. This matters more at Uzum than at a simpler marketplace because the model carries warehouse and pickup-point
      buildout, payment rails, customer acquisition through financial incentives, and growing unsecured-credit exposure.
      The company may be well financed, but the public record still cannot prove that conclusion at underwriting depth.
    claimRefs:
