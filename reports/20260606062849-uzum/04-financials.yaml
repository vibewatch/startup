  - id: SECI04
    title: The core diligence blocker is disclosure depth, not whether Uzum has reached meaningful scale
    body: >-
      The public case for Uzum's scale is already good enough to support a strong commercial narrative. Uzbekistan's
      market still appears early rather than saturated: official and analytical sources place 2024 e-commerce at roughly
      $1.2 billion and only 3.8% of retail, while DataReportal reports 33.1 million internet users and KPMG projects
      e-commerce penetration could reach 9% to 11% by 2027. That backdrop helps explain why a profitable, integrated
      ecosystem could keep compounding through cards, payments, lending, and logistics. However, scale is not the same as
      investability. Uzum's public financial disclosure remains release-driven, with press announcements and homepage
      metrics carrying much of the burden that a public-company disclosure package would normally absorb. Kaspi's
      investor-relations financial-information surface is a useful benchmark: even before reading the underlying
      materials, the existence of a formal, securities-law-governed filing layer shows the disclosure standard that
      sophisticated ecosystem underwriting usually expects.

      For Uzum, the missing items are precisely the ones that matter most for valuation and downside protection. Public
      sources do not disclose realized take rates, merchant economics, gross margin by line, deposit cost of funds,
      non-performing loan ratios, charge-offs, regulatory capital ratios, unrestricted cash, burn, or runway. They also
      do not reconcile third-party revenue figures to official segment disclosures or explain how much of current profit
      is driven by recurring payments and lending economics versus one-off or timing-sensitive effects. The underwriting
      conclusion is therefore disciplined rather than bearish: Uzum appears profitable, growing, and increasingly funded,
      but a close cannot rest on headline net income and volume alone. The next diligence step is a private package that
      bridges volume into recognized revenue, gross profit, credit costs, and liquidity.
    claimRefs:
      - CI053
      - CI054
      - CI055
      - CI056
      - CI057
      - CI058
      - CI059
      - CI060
      - CI061
      - CI062
