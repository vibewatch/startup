  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric
      - Impact on underwriting
      - Why still private in public record
      - Exact diligence path
    rows:
      - - Revenue recognition policy by line
        - Cannot convert GMV, TPV, TFV, or deposits into comparable revenue quality
        - Official materials report outcomes and volumes, not accounting policy
        - Request management memo mapping marketplace, payments, lending, delivery, and auto revenue recognition
      - - Realized revenue mix
        - Impossible to know how much profit is payments and lending versus commerce and delivery
        - Public disclosures aggregate ecosystem scale at a high level
        - Request monthly revenue bridge by business line for 2024-2026 YTD
      - - Gross margin by business line
        - Margin path and comp set are unknowable without line-level economics
        - No public segment P&L is provided
        - Request gross margin by marketplace, payments, BNPL, delivery, and business tooling
      - - Credit quality and cost of risk
        - Lending economics cannot be underwritten without loss experience
        - Public sources disclose volume and portfolio size, not performance quality
        - Request NPL, delinquency, charge-off, recovery, and provisioning schedules by cohort
      - - Funding cost and deposit economics
        - Banking profitability could change materially with deposit pricing and wholesale funding mix
        - Deposit growth is disclosed, but pricing and NIM are not
        - Request deposit rate cards, cost of funds, NIM, and liquidity coverage metrics
      - - Cash, burn, and runway
        - Capital adequacy cannot be proved from fundraising headlines alone
        - Uzum remains private and only discloses event-driven financing announcements
        - Request unrestricted cash, monthly burn, runway, and debt-maturity schedule
      - - Regulatory capital and liquidity ratios
        - Banking and lending growth may require more capital than headline profit suggests
        - Public summary materials do not include prudential ratios
        - Request CET1 / CAR equivalents, leverage ratios, and internal capital targets
      - - Merchant, seller, and delivery economics
        - Marketplace and delivery value is hard to judge without contribution margin per order or merchant
        - Seller count and partner count do not show net profitability
        - Request take rate, average order economics, logistics cost per order, and seller retention
      - - Public-company-style filing package
        - Investors cannot benchmark Uzum against listed ecosystem comps on equal disclosure terms
        - Uzum reports via press releases, unlike public comps with filing-grade surfaces
        - Request audited financial statements, detailed KPI deck, and lender / investor covenant package
    notes: Nulls and missing fields are intentional; they identify the exact blockers that remain before a full underwriting model is credible.
    enumerationScope:
