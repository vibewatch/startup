      - - Marketplace activity
        - $345M FY2024 GMV and >$500M FY2025 GMV
        - high
        - Demonstrates commerce volume, but not net revenue or contribution margin
        - Request take rate, net revenue, and fulfillment cost by order cohort
      - - Payments scale
        - $11.1B TPV in 2025 and 13% online-payments share claimed on homepage
        - high
        - Payments could be the most recurring layer if fee capture is strong
        - Request payment revenue, fee take, and gross margin on processing
      - - BNPL / lending scale
        - $421M FY2024 TFV; $1.2B 2025 finance volume; $226M FY2024 gross loan portfolio
        - high
        - Lending scale matters only alongside yield, losses, and funding cost
        - Request NPLs, charge-offs, APR / mark-up, funding mix, and duration
      - - Third-party revenue figures
        - $505M revenue in 2024 and $691M in 2025 reported by TechCrunch and The Future Media
        - medium
        - Useful directional proxy for valuation work, but not yet reconciled to official revenue policy
        - Request audited or management revenue bridge by line and recognition policy
      - - Cross-sell efficiency proxy
        - '>50% of e-commerce payments processed through own fintech; >55% of Uzum Market orders paid via Nasiya in Q2 2024'
        - high
        - Suggests distribution leverage and lower visible standalone CAC
        - Request CAC, payback, cross-sell conversion, and churn / retention by product
      - - Gross margin by business line
        - null
        - low
        - Margin mix determines whether Uzum should be valued closer to a bank, marketplace, or ecosystem platform
        - Request gross margin by marketplace, payments, lending, delivery, and business tools
      - - Credit quality and cost of risk
        - null
        - low
        - Lending profitability cannot be underwritten without loss experience
        - Request NPL ratio, vintage losses, charge-offs, recovery rates, and provisioning policy
      - - Cash conversion / runway
        - null
        - low
        - Profit does not prove liquidity when logistics and lending consume capital
        - Request unrestricted cash, monthly burn, and rolling 12-month liquidity bridge
      - - Delivery network density proxy
        - 25 cities, 2.6k partners, 7k couriers in Apr 2025; Uzum Market advertises delivery from one day
        - high
        - Shows the service promise is backed by a dense delivery footprint that likely carries real opex and utilization risk
        - Request courier cost per order, own-vs-partner fulfillment mix, and network utilization by city
    notes: Public unit economics are strongest on scale and profit outcomes, weakest on the conversion from volume into margin and cash.
