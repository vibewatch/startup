        - GMV and seller-services economics on Uzum Market
        - GMV, orders, sellers, SKUs
        - FY2025 GMV >$500M; >17k local sellers; >100M SKUs after cross-border launch
        - High-activity line, but take rate and ad economics are undisclosed
        - Request net revenue bridge, take rate, ads/services revenue, and cohort economics by seller type
      - - Banking and payments
        - Cards, payment processing, transfers, deposits, and account services via Uzum Bank and ecosystem rails
        - Cards issued, TPV, payment share, deposit balances
        - '>4M cards issued in 2025; >5M cards on homepage; $11.1B TPV; 13% online-payments share; >$50M deposits in three months'
        - Potentially recurring and high-frequency, but fee yield and cost of funds are not disclosed
        - Request MDR / interchange capture, fee revenue split, deposit pricing, and contribution margin
      - - BNPL and consumer lending
        - Installment lending, revolving credit limits, and cash loans
        - TFV, disbursements, approved limits, loan book
        - FY2024 TFV $421M; FY2025 total finance volume $1.2B; 40% BNPL market share claimed; 2.8M users with approved limits in Q2 2024
        - Large scale, but credit losses, yield, and duration are undisclosed
        - Request vintage curves, APR / mark-up policy, charge-offs, NPLs, and funding mix
      - - Express delivery
        - Delivery commissions, basket fees, and partner monetization in Uzum Tezkor
        - Partner count, city coverage, order mix
        - 2.4k+ partner restaurants in 18 cities at FY2024; 3k+ partners in 26 cities on homepage
        - Volume is visible, but realized delivery fees and unit margins are not
        - Request average order value, take rate, courier economics, and regional contribution margin
      - - Auto marketplace
        - Listing, financing referral, and partner-bank loan economics through Uzum Avto
        - Dealership count, financed leads
        - Homepage describes ~300 partner dealerships and instant loan approvals from partner banks
        - Revenue surface exists, but commercial terms are entirely undisclosed
        - Request referral fees, financing attach rate, and inventory / listing economics
      - - Business tools and SME services
        - Entrepreneur app, SME lending, payments, and integrated banking solutions
        - SME loan growth, business accounts, payment usage
        - Uzum says SME lending at Kapitalbank grew 1.7x in 2025; business tooling remains part of the ecosystem proposition
        - Could become sticky B2B revenue, but pricing and adoption are not public
        - Request business-account count, subscription or fee model, and merchant retention metrics
