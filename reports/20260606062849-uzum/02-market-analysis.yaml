chapter:
  number: 2
  title: Market Analysis
  summary: 'Public sources frame Uzbekistan as a still-underpenetrated but fast-digitizing market: Trade.gov puts 2024 e-commerce
    at $1.2 billion or 3.8% of retail, KPMG projects $1.8-2.2 billion by 2027, and DataReportal shows 33.1 million internet
    users at end-2025. Uzum already commands meaningful SOM with more than $500 million of 2025 GMV, 17,000+ sellers, $11.1
    billion of payment volume, and a claimed 40% BNPL share, but payments and BNPL TAM still rely on company-derived denominators
    and face tighter 2026 compliance requirements.'
