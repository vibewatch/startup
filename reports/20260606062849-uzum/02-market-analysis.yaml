tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Marketplace retail
    - Online retail orders on marketplaces and managed storefronts.
    - Offline bazaar sales, store-only retail, wholesale export contracts.
    - Households buy; households or BNPL lender pay.
    - Core Uzum Market demand pool.
  - - Classifieds and social-commerce substitutes
    - Peer-to-peer listings, Telegram-led discovery, OLX or BirBir style direct transactions.
    - Managed inventory marketplace sales with integrated logistics.
    - Individuals and micro-sellers buy and pay directly.
    - Status-quo substitute that limits formal marketplace consolidation.
  - - Online payments and digital checkout
    - Card, account, and app-linked digital payments tied to online transactions.
    - Cash-only offline POS, treasury transfers, non-commerce wholesale flows.
    - Consumers initiate; merchants and banks receive or settle.
    - Core Uzum Bank and checkout share lens.
  - - BNPL and consumer instalment finance
    - Point-of-sale instalments and unsecured consumer finance linked to purchases.
    - Mortgages, SME term loans, state-directed corporate lending.
    - Household consumes; lender fronts payment and collects later.
    - Core Uzum Nasiya monetization pool.
  - - Seller and SME enablement
    - Merchant acquisition, logistics, fulfillment, entrepreneur tools, and seller-side services.
    - General ERP, export-only SaaS, unrelated enterprise software.
    - Merchants and SMEs are both user and payer.
    - How Uzum deepens monetization beyond one retail order.
  - - Auto marketplace and partner finance adjacency
    - Car listings, dealer distribution, and partner-bank loan origination.
    - Vehicle manufacturing, offline dealership capex, fleet finance.
    - Households, dealers, and partner banks split user and payer roles.
    - Adjacency that broadens ecosystem wallet share.
  notes: 'Rows overlap by design: this table defines the operating market boundary rather than additive TAM buckets.'
