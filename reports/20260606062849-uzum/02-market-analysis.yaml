  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: Online-payments TAM is only visible through Uzum’s own share and TPV claims.
    missingEvidence: An independent Central Bank or industry dataset that defines the denominator for total online-payments
      volume in Uzbekistan.
    whyItMatters: Without a public denominator, Uzum’s 13% payments-share claim is useful for direction but weak for valuation-grade
      TAM or market-share analysis.
    diligencePath: Request CBU market-volume disclosures or third-party acquiring data that reconciles online TPV, card volume,
      and merchant acceptance.
    relatedQuestionRefs:
    - QM009
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: BNPL market size is still company-derived rather than independently corroborated.
    missingEvidence: A regulator, bureau, or analyst dataset that sizes BNPL disbursements, active users, losses, and merchant
      mix across Uzbekistan.
    whyItMatters: Uzum’s 40% BNPL-share claim implies a large addressable market, but private or company-only market-share
      metrics can overstate a defensible SAM.
    diligencePath: Request product-level loan-book, merchant, and loss data from management and compare it with any CBU or
      bureau-level consumer-credit statistics.
    relatedQuestionRefs:
    - QM010
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: 2027 market projections mix broader e-commerce retail with narrower marketplace-turnover language.
    missingEvidence: A single methodology note that reconciles what counts as marketplace turnover, e-commerce retail, classifieds,
      and cross-border sales in Uzbekistan.
    whyItMatters: A valuation case can swing materially depending on whether Uzum is benchmarked against total e-commerce,
      only marketplaces, or only financed commerce.
    diligencePath: Ask management to reconcile its internal TAM deck to the KPMG and government lenses and to specify what
      spend is excluded from each layer.
    relatedQuestionRefs:
    - QM011
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: Buyer economics by seller cohort, take rate, and merchant acquisition cost remain private.
    missingEvidence: Seller cohort retention, take-rate bridge, logistics subsidy by region, and merchant payback by category
      or size band.
    whyItMatters: The market may be large, but valuation depends on whether Uzum can monetize sellers and repeat buyers efficiently
      rather than just aggregate volume.
    diligencePath: Request cohort and unit-economics cuts by seller segment, especially electronics, fashion, food delivery,
      and BNPL-heavy categories.
    relatedQuestionRefs:
    - QM013
    - QM016
    - QM026
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: 2026 regulatory changes span KYC, FX reporting, data localization, and competition rules but not all primary legal
      texts were synthesized in English.
    missingEvidence: A current counsel memo or translated law pack tying the 2026 operational obligations directly to onboarding,
      treasury, and merchant workflows.
    whyItMatters: Rapid rule changes can slow growth or raise compliance cost even when topline demand remains strong.
    diligencePath: Commission local counsel to map each cited rule to the exact operational control, data requirement, and
      sanction risk for Uzum Bank and marketplace entities.
    relatedQuestionRefs:
    - QM021
    - QM022
    - QM026
    relatedTableRefs:
    - TM004
sections:
- id: market-boundary
  title: Market boundary and reachable demand
  body: 'For Uzum, the relevant market is not just one marketplace app. The commercial boundary starts with Uzbek online retail
    and classifieds discovery, but it extends into the payment, card, and instalment rails that determine whether browsing
    actually converts into paid orders. That is the logic behind treating e-commerce, online payments, digital banking, BNPL,
    and seller tooling as one connected market system rather than five unrelated categories [CM015][CM016]. In practice, this
    chapter therefore includes digital retail orders, merchant enablement, online checkout and stored-value payment behavior,
    and point-of-sale consumer finance, while excluding offline cash-only retail, wholesale corporate banking, and export-only
    B2B flows [CM015][CM016].


    The reachable audience is already large enough to support national-scale digital platforms. DataReportal counted 33.1
    million internet users, 33.9 million mobile connections, and 14.1 million social-media identities at the end of 2025 or
    October 2025 [CM001][CM002][CM003]. Trade.gov adds that roughly 60% of the population is under 30 and that public telecom
    investment, including 5G rollout and expanded data throughput, is still improving basic connectivity [CM004][CM005]. Those
    facts do not guarantee monetization, but they do mean Uzbekistan is no longer a low-connectivity frontier case for consumer
    internet.


    At the same time, the status quo is not a clean, formal marketplace market. Kun notes that traditional purchasing habits
    still matter, while Telegram, peer-to-peer listings, OLX-style classifieds, and newer entrants such as BirBir all remain
    relevant substitutes for managed marketplace transactions [CM012][CM013][CM014]. That substitute set matters because it
    explains why digital adoption can rise quickly without all of that demand consolidating into one formal marketplace or
    one payment rail [CM011][CM014].'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
