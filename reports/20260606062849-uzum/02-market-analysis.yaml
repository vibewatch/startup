- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - 33.1M internet users and 33.9M mobile connections
    - Positive
    - Now
    - The digitally reachable base is already large enough for mass-market platforms.
    - Track whether internet growth continues outside Tashkent and other major cities.
  - - Young population and telecom investment
    - Positive
    - Medium term
    - A young user base and ongoing network upgrades support continued digital adoption.
    - Validate age-cohort purchasing power rather than assuming youth equals spend.
  - - E-commerce still only 3.8% of retail in 2024
    - Positive
    - Multi-year
    - Low penetration creates headroom for marketplace and checkout growth.
    - Test whether penetration gains are concentrated in a few categories or broadening.
  - - Banking reforms toward more competition
    - Positive
    - Medium term
    - Private-bank expansion and supervisory reform can widen distribution and trust for digital finance.
    - Monitor SOCB privatization, deposit-insurance reform, and risk-based supervision rollout.
  - - Integrated payments and card discounts inside Uzum
    - Positive
    - Now
    - Embedded payments can increase conversion and retention beyond plain marketplace traffic.
    - Request merchant and repeat-purchase cohorts for users who take several Uzum products.
  - - Offline habits plus Telegram/classifieds substitutes
    - Negative
    - Now
    - Digital demand does not automatically consolidate into managed marketplaces.
    - Measure share of buyers and sellers who still multi-home across informal channels.
  - - Biometric, liveness, and OTP onboarding rules
    - Negative
    - Now
    - Digital-bank KYC gets safer but potentially slower and more expensive.
    - Assess onboarding funnel drop-off before and after April 2026 rule changes.
  - - FX-recording, local-entity, and data-localization rules
    - Negative
    - Now
    - Compliance work expands across treasury, data handling, and platform structuring.
    - Commission local counsel to map each rule to concrete operational controls.
  - - Merchant-discount caps and expensive card-based P2P
    - Mixed to negative
    - Now
    - Acceptance may improve, but fintech unit economics and POS investment incentives can weaken.
    - Model checkout-margin sensitivity under alternative MDR and acceptance assumptions.
  - - Tariff shock and rising NPLs in consumer finance
    - Negative
    - Near term
    - Borrower resilience may weaken just as BNPL and unsecured lending scale.
    - Review credit cohorts by income band, ticket size, and delinquency vintage.
  - - International capital supply from Oman and EDB
    - Positive
    - Now
    - Growth capital remains available for scaled digital infrastructure players.
    - Check whether future funding comes with governance or profitability milestones.
  notes: Rows intentionally mix demand drivers, policy drivers, and risk constraints because all three affect conversion timing
    and valuation quality.
