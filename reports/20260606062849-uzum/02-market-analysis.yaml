- id: drivers-and-constraints
  title: Growth drivers, trust frictions, and regulatory drag
  body: 'The main growth drivers are straightforward: a young and connected population, low current e-commerce penetration,
    continued telecom build-out, and an operating environment where digital finance is becoming more investable [CM004][CM005][CM007][CM008][CM017].
    Public-policy reforms also matter. World Bank and IMF both describe a banking sector moving toward more private competition
    and stronger supervision, while Trade.gov shows continued state-backed logistics and marketplace infrastructure [CM027][CM030][CM039].
    Capital supply has also improved: independent coverage and company announcements both show that international equity and
    development-finance capital are willing to fund Uzbek digital infrastructure at scale [CM041][CM042][CM043].


    The friction stack is equally important. World Bank says merchant-discount caps and expensive card-based P2P flows still
    distort payment economics [CM028][CM029]. 2026 rule changes add more operational drag: The Paypers reported biometric,
    liveness, and OTP standards for digital bank onboarding, and Yep.uz reported tighter FX-recording obligations inside the
    Central Bank’s systems [CM031][CM032]. Trade.gov adds local-data-storage rules and local-entity requirements for platform
    operators, while Lex.uz shows that legal monitoring depends on tracking a centralized but evolving body of legislation
    [CM033][CM034].


    Finally, consumer-finance growth is not risk-free. Kilde shows that non-bank credit is scaling, but it also highlights
    a tariff shock to household budgets and a near-term rise in NPL ratios [CM037][CM038]. Combined with the persistence of
    Telegram commerce, classifieds, and other substitute channels, that means the market case is strong but not frictionless:
    Uzum is benefiting from a structurally good market, yet trust, compliance, and borrower resilience will still decide how
    much of that headline TAM becomes durable monetized demand [CM012][CM013][CM035][CM038].'
