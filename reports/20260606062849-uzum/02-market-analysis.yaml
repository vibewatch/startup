- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Mass-market household shopper
    - Individual consumer
    - Same person or family member
    - Household wallet, Uzum card, or BNPL provider
    - Browse marketplace -> pay -> pickup or delivery -> repeat
    - Household discretionary spend
    - Assortment, delivery reach, and instalment affordability
  - - Big-ticket BNPL-led shopper
    - Consumer buying electronics or fashion
    - Same person
    - BNPL lender funds purchase and customer repays later
    - Select product -> pre-approved credit -> repay over time
    - Household monthly budget
    - Ability to split larger purchase into instalments
  - - Marketplace seller
    - Merchant owner or operator
    - Merchant staff and end customers
    - Merchant pays through time, subsidies, or ecosystem fees
    - List inventory -> use logistics/pickup network -> receive payment
    - Founder or SME owner
    - Traffic, fulfillment reach, and lower go-live friction
  - - SME using ecosystem tools
    - Entrepreneur or micro-business
    - Owner and finance/admin team
    - Business owner
    - Use marketplace + bank + business tools together
    - Working-capital and marketing budget
    - One integrated stack instead of fragmented tools
  - - Tezkor partner café or shop
    - Restaurant or local merchant
    - Merchant staff and delivery network
    - Merchant plus consumer at checkout
    - Onboard catalog -> receive orders -> rely on delivery network
    - Owner-operator margin budget
    - Incremental digital demand without building own app
  - - Auto buyer / dealer adjacency
    - Household buyer or dealership
    - Buyer, dealership, and partner bank
    - Buyer with partner-bank financing
    - Search listing -> pre-approval -> dealer transaction
    - Household savings plus credit line
    - Faster loan approval and discovery in one flow
  notes: The same resident can appear in several rows over time; the key distinction is who owns the budget and what event
    triggers adoption.
