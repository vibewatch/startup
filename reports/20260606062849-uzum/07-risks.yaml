  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: credit performance detail
    missingEvidence: 2025-2026 lending-cohort vintage curves, NPL ratios, fraud-loss splits, recovery rates, and collections KPIs.
    whyItMatters: Public volume growth is now large enough that the investment case depends on loss quality, not just origination speed.
    diligencePath: Request monthly or quarterly vintage tables by product, fraud versus credit-loss waterfall, and collections scorecards from risk management.
    relatedQuestionRefs:
    - QR009
    - QR010
    - QR024
    - QR027
    - QR032
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: regulatory inspection visibility
    missingEvidence: Any bank-level inspection findings, remediation orders, complaint dashboards, or supervisory correspondence relevant to Uzum or Kapitalbank.
    whyItMatters: A company can appear operationally strong while still carrying latent supervisory issues that matter for onboarding, lending, or product design.
    diligencePath: Request regulator inspection history, management response plans, and customer-complaint trends by regulated entity.
    relatedQuestionRefs:
    - QR001
    - QR019
    - QR027
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: aml and sanctions controls
    missingEvidence: Sanctions-screening tooling, AML governance, SAR statistics, blocked-transaction logs, and cross-border restricted-goods exception rates.
    whyItMatters: Cross-border assortment and foreign funding create real compliance risk even without any public enforcement event.
    diligencePath: Review the AML policy suite, sanctions-screening vendor stack, escalation thresholds, and quarterly compliance committee materials.
    relatedQuestionRefs:
    - QR005
    - QR006
    - QR007
    - QR023
    - QR027
    relatedTableRefs:
    - TR001
    - TR003
  - type: missing-source
    severity: material
    topic: board and ownership transparency
    missingEvidence: Current board roster, committee structure, director independence, shareholder rights, and ownership evolution after 2024.
    whyItMatters: Governance quality and investor protections are critical as the funding structure becomes more complex and the company approaches larger rounds.
    diligencePath: Request the board deck cover page, committee charters, cap table by class, and side-letter summary under NDA.
    relatedQuestionRefs:
    - QR016
    - QR017
    - QR018
    - QR030
    - QR032
    relatedTableRefs:
    - TR001
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: debt and convertible financing terms
    missingEvidence: Maturity profile, covenants, draw conditions, security package, and conversion mechanics for the non-equity financing stack.
    whyItMatters: Structured capital can reprice downside risk if rollover, covenant, or conversion terms prove more restrictive than headline funding announcements suggest.
    diligencePath: Request financing agreements, covenant summary, maturity ladder, and management sensitivity analysis for delayed next-round scenarios.
    relatedQuestionRefs:
    - QR004
    - QR008
    - QR021
    - QR022
    - QR027
    - QR032
    relatedTableRefs:
    - TR003
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: partner concentration detail
    missingEvidence: Seller concentration, merchant concentration, pickup-point ownership split, and city-level economics for the logistics network.
    whyItMatters: National scale can hide brittle economics if too much volume is concentrated in a narrow set of merchants, sellers, or locations.
    diligencePath: Request top-seller share, top-city contribution, partner-owned versus company-owned location split, and on-time-delivery KPIs.
    relatedQuestionRefs:
    - QR012
    - QR026
    - QR029
    - QR032
    relatedTableRefs:
    - TR002
    - TR003
