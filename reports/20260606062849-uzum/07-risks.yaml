- id: mitigations-and-kill-criteria
  title: Mitigations, Monitoring, and Thesis-Break Triggers
  body: |-
    The risk case is not a verdict to avoid the company outright; it is a reminder that Uzum must industrialize controls as quickly as it industrialized distribution. The most important existing mitigants are visible in public data: sustained profitability, a first-time B/Positive Fitch rating, operational control over key subsidiaries, a named executive bench, and repeated access to international capital. Those factors reduce the probability that a single shock immediately becomes existential.

    The thesis does break, however, if measurable monitoring points fail. The highest-priority triggers are: evidence of adverse credit seasoning in the 2025-2026 lending cohorts; a banking, consumer-credit, or payments compliance action that constrains onboarding or lending; failure to refinance or convert the 2026 structured financing on acceptable terms; sanctions or AML friction that interrupts foreign funding or cross-border assortment; or continued governance opacity through the next major financing event. The next diligence cycle therefore needs to focus less on proving growth—which public evidence already shows—and more on testing whether compliance, credit discipline, and governance can keep pace with that growth.
