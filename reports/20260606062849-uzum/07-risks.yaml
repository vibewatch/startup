chapter:
  number: 7
  title: Risks
  summary: 'Uzum’s risk profile is dominated by five connected exposures: (1) a widening regulatory and legal perimeter as the company combines marketplace, digital banking, deposits, cards, BNPL, and cross-border assortment inside one Uzbek ecosystem; (2) credit, fraud, and collections risk from very rapid fintech scale-up without public loss-vintage disclosure; (3) single-country concentration and dependence on foreign capital even after the Oman round; (4) logistics and partner execution risk across a nationwide seller, pickup-point, and merchant network; and (5) governance and disclosure risk, especially versus regional public-market benchmarks such as Kaspi.kz. Current evidence shows real mitigants—profitability, a B/Positive Fitch rating, and a named operating bench—but public disclosure still lags the complexity of the operating model.'
sections:
- id: regulatory-cross-border-risk
  title: Regulatory, Legal, and Cross-Border Compliance Risk
  body: |-
    Uzum now operates a much broader regulated perimeter than a simple marketplace. The company’s current stack combines marketplace, express delivery, digital banking, instalment finance, cards, deposits, and consumer lending at national scale, while Uzbekistan’s published banking-law stack covers central-bank oversight, banks and banking activities, deposit protection, currency regulation, bank secrecy, electronic payments, consumer credit, and microfinance. That mix means regulatory exposure is not hypothetical; it is embedded in the company’s everyday operating model.

    The residual issue is not evidence of an identified enforcement action, but the mismatch between rapid product expansion and limited public compliance disclosure. By 2025-2026 Uzum had layered cross-border assortment, millions of cards, online deposits, and a much larger lending book onto the ecosystem, yet the retrieved public materials still do not disclose board committees, IR-style compliance contacts, regulatory inspection outcomes, or sanctions-screening architecture. FATF’s February 2026 call-for-action language and OFAC’s active 2026 sanctions program list show how quickly cross-border counterparties can move from routine screening to enhanced due diligence or even countermeasures. Because Uzum relies on foreign investors, development-finance lenders, and cross-border marketplace supply, compliance risk can flow into funding and assortment at the same time.
