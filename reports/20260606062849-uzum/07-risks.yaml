- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Credit / collections deterioration
    - Private vintage data, charge-off curves, and recovery reports
    - 2025-2026 cohorts materially worse than underwriting plan or 90+ DPD exceeds underwriting case
    - Pause underwriting until management proves cohort stability and recovery economics
  - - Banking / consumer-credit compliance action
    - Any regulator communication affecting onboarding, lending, or disclosures
    - Formal remediation order, onboarding cap, or lending constraint
    - Thesis break unless issue is clearly narrow and quickly reversible
  - - AML / sanctions friction
    - Blocked transactions, correspondent-bank limits, or sanctions exceptions
    - Funding or cross-border assortment interrupted by AML / sanctions controls
    - Re-underwrite capital access, cross-border strategy, and compliance spend immediately
  - - Structured-financing rollover risk
    - Progress toward the next qualified financing round
    - Next round delayed materially or convertible terms worsen versus March 2026 baseline
    - Treat financing as a gating diligence item, not a background assumption
  - - Logistics / partner-network degradation
    - Seller count, pickup-point count, merchant density, order-quality KPIs
    - Network shrinks or service KPIs deteriorate materially while competition remains active
    - Downgrade marketplace durability and revisit unit-economics assumptions
  - - Governance opacity persists
    - Board, committee, ownership, and IR-style reporting disclosures
    - No meaningful governance / ownership disclosure before the next major financing event
    - Discount valuation and require stronger investor protections
  - - Key-person event
    - Founder / senior leadership continuity
    - Founder departure or abrupt loss of finance / compliance leadership without a named replacement
    - Escalate execution-risk rating and revisit oversight sufficiency
  - - Macro / country shock
    - Foreign-capital appetite, funding spreads, and Uzbekistan operating-environment indicators
    - Sharp reversal in macro / policy backdrop that undermines Fitch’s support case or foreign funding channels
    - Re-cut downside scenario and assume slower financing plus tighter compliance scrutiny
