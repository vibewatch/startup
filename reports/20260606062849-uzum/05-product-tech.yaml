      - Module / Asset
      - Primary User
      - Status / Maturity
      - Key Differentiation
      - Diligence Gap
    rows:
      - - Uzum Market
        - Consumers and local sellers
        - Mature / scaled
        - National marketplace tied to next-day logistics, pickup points, and fintech checkout
        - Public materials do not disclose take rate, ad stack, or merchant API surface
      - - Uzum Tezkor
        - Consumers, restaurants, shops, couriers
        - Mature / regionally scaling
        - Reuses brand and last-mile operations for fast local delivery across 25-26 cities
        - No public SLA, courier-utilization, or retention data
      - - Uzum Bank
        - Consumers and ecosystem merchants
        - Mature / fast scaling
        - Localized instant payment processing, fast card issuance, and marketplace-linked physical distribution
        - No public docs for payment APIs, card security architecture, or uptime
      - - Uzum Nasiya
        - Consumers and merchants needing instalment checkout
        - Mature / embedded
        - Consumer lending embedded directly into commerce workflows and checkout economics
        - No public vintage, delinquency, or integration-detail disclosure
      - - Uzum Business
        - Legal entities and entrepreneurs
        - Visible but under-documented
        - Positioned as all-in-one merchant layer spanning ecosystem services
        - Merchant features, APIs, and ops modules are not publicly enumerated
      - - Uzum Avto
        - Car buyers, dealers, partner banks
        - Early-to-mid stage
        - High-ticket marketplace built on existing demand, verification, and financing infrastructure
        - Financing workflow, nationwide seller mix, and user metrics remain opaque
      - - Marketplace FBS / DBS tooling
        - Sellers with own warehousing or delivery
        - Newly expanded
        - Lets merchants choose lighter-capex operating modes and unlock bulky or niche categories
        - Public docs do not show seller-console depth or per-model economics
      - - ML and data infrastructure layer
        - Risk, product, and analytics teams
        - Active but externally low-visibility
        - ML used in credit screening, pricing, personalization, and risk management; DataVolt supports local capacity build-out
        - No public model-governance, feature-store, or MLOps documentation
    notes: >-
      Status is based on public disclosure depth as of 2026-06-06. “Mature” means scaled and repeatedly
      referenced in official materials, not independently audited for technical robustness.
