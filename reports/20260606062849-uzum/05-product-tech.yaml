  evidenceGaps:
    - id: EGE001
      type: missing-source
      severity: material
      topic: developer-docs-access
      missingEvidence: >-
        A working public developer portal or downloadable API/authentication reference for Uzum Bank,
        merchant integrations, card issuance, or Uzum Business.
      whyItMatters: >-
        The platform’s strategic pitch depends on localized payments and deep ecosystem integration, but
        outside parties cannot inspect integration methods, authentication models, error handling, or
        release cadence without an accessible docs surface.
      diligencePath: >-
        Request a live developer-portal walkthrough, merchant API reference, sandbox credentials, and
        version history for card, payment, and merchant endpoints.
      relatedQuestionRefs: [QE015, QE025]
      relatedTableRefs: [TE004]
    - id: EGE002
      type: missing-source
      severity: material
      topic: payments-security-disclosure
      missingEvidence: >-
        Public PCI-style controls, tokenization model, fraud-rule governance, privacy notices for payment
        data flows, and security incident or uptime disclosures for Uzum Bank and checkout systems.
      whyItMatters: >-
        A local payments stack can be a moat only if control quality is knowable; otherwise investors and
        partners cannot judge operational resilience, regulatory risk, or merchant trustworthiness.
      diligencePath: >-
        Request security architecture materials, card-data handling controls, audit summaries, and any
        incident or uptime reporting used in bank and merchant sales.
      relatedQuestionRefs: [QE018, QE019, QE023]
      relatedTableRefs: [TE004]
    - id: EGE003
      type: missing-source
      severity: material
      topic: data-infrastructure-capacity
      missingEvidence: >-
        Quantified DataVolt scope, including target capacity, timeline, capex, hosting model, and which
        Uzum workloads will migrate or scale on the new local infrastructure.
      whyItMatters: >-
        The memorandum is strategically important but too high level to prove whether it meaningfully
        de-risks payments, ML, storage, or AI workloads at Uzum’s current scale.
      diligencePath: >-
        Ask for the DataVolt memorandum appendix, project timeline, capacity plan, and named workloads
