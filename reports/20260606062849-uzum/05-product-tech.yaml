chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Uzum’s product stack is best understood as a locally integrated commerce-and-fintech platform:
    Uzum Market generates demand, pickup points and couriers provide physical fulfillment, Uzum Bank
    and Uzum Nasiya monetize checkout and lending, Uzum Tezkor extends the same consumer and last-mile
    network into on-demand delivery, and Uzum Business and Uzum Avto broaden the ecosystem into merchant
    tooling and high-ticket transactions. Public evidence supports meaningful operating sophistication in
    logistics, card issuance, risk models, and local infrastructure build-out, but the technical surface
    visible to outsiders remains shallow: the only obvious developer-doc endpoint for Uzum Bank was
    inaccessible at run time, and no public architecture paper, API reference, or security-control
    package explains how the platform’s payment, merchant, or compliance layers actually work.
