sections:
  - id: E-platform-fit
    title: Platform Surfaces and Ecosystem Fit
    body: >-
      Uzum’s public product surface is coherent in customer-workflow terms even though the company still
      markets multiple named businesses. Uzum Market is the traffic and assortment engine, Uzum Tezkor
      extends the same consumer relationship into rapid local delivery, Uzum Bank and Uzum Nasiya turn
      checkout activity into card, payment, and lending adoption, and Uzum Business acts as the legal-
      entity layer for entrepreneurs. Uzum Avto is the clearest example of adjacent expansion: it reuses
      brand reach, consumer trust, and financing capabilities to enter higher-ticket transactions rather
      than building a disconnected automotive brand. The business overview explicitly describes a loop in
      which shopping activity migrates users into fintech products, while current corporate surfaces show
      this is not merely conceptual: more than half of ecosystem e-commerce payments are said to run over
      Uzum’s own fintech rails, and payment-card discounts are used to change user behavior at checkout.
      That makes the platform architecture less like a bundle of apps and more like a localized commerce,
      payments, and logistics stack tuned for Uzbekistan’s consumer and SME workflows.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE023
      - CE037
    tableRefs:
      - TE001
    figureRefs:
      - FE001
  - id: E-logistics-evolution
    title: Logistics Stack and Fulfillment Evolution
    body: >-
      The strongest product-engineering evidence around Uzum sits in logistics, where the company has
      progressively unbundled who owns inventory, storage, and delivery. In 2023 Uzum Market emphasized
      classic operator-led fulfillment: next-day delivery, 230 pickup points, and courier coverage in more
      than 60 cities and towns. By late 2024 it had added FBS, allowing sellers to keep stock and pack
      goods in their own warehouses while Uzum still performed line-haul and final delivery. By June 2026
      Uzum had introduced DBS, where sellers can also handle final delivery and choose their own service
      zones and timelines, with no marketplace logistics fee. Independent reporting says management wants
      20-30% of deliveries to run through these newer models, which matches the product logic: FBS and DBS
      broaden assortment, support bulky or customized categories, and reduce the need for Uzum-owned
      inventory handling on every order. Tezkor’s widening courier footprint reinforces that this is an
      operating platform with multiple last-mile modes, not just a catalog site.
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE025
      - CE035
    tableRefs:
      - TE002
    figureRefs:
      - FE002
  - id: E-payments-data-architecture
    title: Payments, Data, and Operating Architecture
    body: >-
      Public evidence suggests Uzum’s architecture is organized around shared infrastructure rather than
      separate business-unit stacks. The company’s homepage claims Uzum Bank runs on proprietary localized
      infrastructure for instant payment processing and fast card issuance, and independent reporting says
      the same pickup-point network used for e-commerce also distributes physical cards. That physical-
      digital overlap matters because it lowers customer-acquisition cost for banking while turning the
      logistics estate into a regulated-finance distribution asset. On the software side, FY2025 results
      say Uzum uses machine learning in credit screening, risk management, pricing, and personalization;
      the 2025 financing release added fraud prevention to the list of AI-assisted functions. The DataVolt
      memorandum complements this by showing that management is still investing in local compute and cloud
      capacity, not just buying growth through marketing. The missing piece is technical transparency:
      there is no public architecture paper that explains how payments, lending models, merchant systems,
      or infrastructure layers interact, so the broad architecture can be inferred but not audited.
    claimRefs:
      - CE005
      - CE008
      - CE015
      - CE027
      - CE028
      - CE029
      - CE030
      - CE032
      - CE035
      - CE036
    tableRefs:
      - TE003
    figureRefs:
      - FE003
  - id: E-workflows-maturity
    title: Workflows, Merchant Surfaces, and Capability Maturity
    body: >-
      Uzum’s mature capabilities are the ones tightly linked to its existing commerce-and-fintech flywheel:
      marketplace discovery, installment-led checkout, card issuance, pickup-based last mile, and merchant
      access to demand through the marketplace. The public evidence is thinner for seller software and
      technical access. Uzum Business is consistently described as the entrepreneur layer for legal entities,
      but the fetched corpus does not expose a merchant API reference, ads console, reconciliation product,
      or detailed seller-ops documentation. Avto is similarly promising but not yet fully transparent: the
      core dealer marketplace and verification logic are visible, while financing promises still read partly
      as roadmap messaging. This maturity split is important. It suggests that Uzum’s strongest product moat
      today is operational integration across demand, payments, and fulfillment, whereas the merchant and
      developer surfaces remain far less legible to outside partners than the scale of the ecosystem would
      normally imply.
    claimRefs:
      - CE006
      - CE017
      - CE021
      - CE022
      - CE023
      - CE024
      - CE026
      - CE032
      - CE037
    tableRefs:
      - TE005
