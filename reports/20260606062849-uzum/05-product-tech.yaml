figures:
  - id: FE001
    title: Product Architecture Map
    type: stack
    layout: standard
    summary: >-
      Uzum’s public product architecture layers consumer demand surfaces over shared fulfillment,
      fintech, risk, and local infrastructure capabilities.
    data:
      layers:
        - label: Consumer and Merchant Surfaces
          detail: Branded entry points that capture demand and workflow intent for individuals and businesses.
          items:
            - Uzum Market (national marketplace)
            - Uzum Tezkor (rapid local delivery)
            - Uzum Avto (automotive marketplace)
            - Uzum Business (entrepreneur layer)
        - label: Commerce and Checkout Layer
          detail: Shared catalog, promotions, checkout, and lending attachment mechanisms that move users from shopping into fintech products.
          items:
            - Marketplace catalog and promotions
            - Checkout and embedded payment choice
            - BNPL / lending attachment via Uzum Nasiya
            - Card-linked discount economics
        - label: Banking and Payments Layer
          detail: Localized bank and card stack used for payment processing, issuance, and financial-service monetization.
          items:
            - Uzum Bank cards
            - Instant payment processing
            - Fast card issuance
            - Digital bank account and deposits
        - label: Logistics and Service Operations
          detail: Physical network enabling next-day commerce, rapid delivery, and card distribution.
          items:
            - Warehousing and inventory handling
            - FBO / FBS / DBS fulfillment models
            - Pickup points
            - Courier network
        - label: Data, Risk, and Personalization
          detail: ML-enabled layer used in credit, pricing, risk, and user-level optimization.
          items:
            - Credit screening
            - Risk management
            - Pricing
            - Personalization
        - label: Infrastructure Foundation
          detail: Local IT and cloud-capacity build-out supporting scale across commerce and fintech workloads.
          items:
            - Proprietary localized banking infrastructure
            - Local data infrastructure
            - DataVolt capacity partnership
            - Shared national-scale operations
    approximationNotes: >-
      The layer map is reconstructed from public materials; Uzum has not published a formal architecture diagram.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE023
      - CE027
      - CE028
      - CE037
  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: standard
    summary: >-
      The ecosystem converts marketplace demand into logistics execution and fintech adoption through a shared flow.
    data:
      nodes:
        - id: n1
          label: User opens Uzum surface
          detail: Market, Tezkor, Avto, or entrepreneur workflow starts demand capture
        - id: n2
          label: Product or service selected
          detail: Assortment may come from operator-fulfilled inventory, FBS, DBS, or local partner delivery
        - id: n3
          label: Checkout and payment choice
          detail: User can use Uzum Bank card, fintech payment rails, or instalment option
        - id: n4
          label: Credit and risk evaluation
          detail: ML-supported screening, pricing, and fraud/risk controls shape approval and offers
        - id: n5
          label: Fulfillment routing
          detail: Order flows through warehouse, seller shipment, seller delivery, or rapid courier network
        - id: n6
          label: Pickup point or last-mile handoff
          detail: Physical network handles delivery and can also distribute payment cards
        - id: n7
          label: Repeat usage loop
          detail: Discounts, convenience, and financial-service attachment increase retention and cross-sell
