      - FE004
  - id: E-trust-gaps
    title: Trust, Compliance, and Product-Technology Gaps
    body: >-
      Uzum’s product narrative is strong on localized infrastructure and user reach, but weak on the trust
      artifacts that outside technical partners would normally expect. There is some evidence of operating
      controls: Uzum Avto says it verifies dealer documents and listing availability, and Uzbekistan’s own
      regulatory environment increasingly requires platform disclosure, legal-entity visibility, and local
      data handling. But the chapter did not surface public documentation for payment APIs, merchant auth,
      card-data protection, incident history, uptime, or privacy-by-design controls. The single most direct
      technical-doc surface that should have helped—the developer.uzumbank.uz portal—was inaccessible from
      the logged fetch environment. That makes product diligence asymmetric: public materials prove demand,
      logistics progress, and banking-card rollout, but they do not prove how safely or robustly the deeper
      platform is implemented. The website-level privacy notice adds some legal disclosure for corporate-site
      data handling, but it still does not turn the underlying payments and merchant stack into an inspectable
      technical control environment. For an investor or strategic partner, the core diligence task is therefore
      to convert attractive infrastructure claims into inspectable evidence on security, reliability, and
      integration design.
    claimRefs:
