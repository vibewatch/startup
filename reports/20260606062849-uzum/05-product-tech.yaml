  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User Job / Workflow
      - Legacy or Earlier Model
      - Current Uzum Solution
      - Stated Benefit
      - Limitation / Caveat
    rows:
      - - Buy household goods nationally
        - Offline bazaars or fragmented local shops
        - Uzum Market marketplace with next-day delivery and pickup-point network
        - Broad assortment with national reach and integrated payments
        - Public sources do not show fulfillment reliability by region or category
      - - Seller wants online demand without storing at Uzum warehouse
        - Only operator-fulfilled model available
        - FBS seller stores and packs while Uzum handles downstream delivery
        - Lower onboarding friction for manufacturers, distributors, and offline stores
        - 48-hour shipment and ~3-day delivery window may still be slow for some categories
      - - Seller wants full control over last mile
        - Marketplace required Uzum logistics services
        - DBS seller stores, packs, and delivers while using Uzum storefront and marketing
        - No marketplace logistics fee; enables bulky, niche, premium, or customized goods
        - Quality control and SLA become more decentralized
      - - Order hot food or local essentials
        - Call restaurant / use fragmented local delivery apps
        - Uzum Tezkor rapid delivery from partner cafes, restaurants, and stores
        - Shared consumer audience and brand trust across 25-26 cities
        - No public disclosure of delivery times, frequency, or unit economics
      - - Get a payment card and start using bank services
        - Visit branch and wait for plastic issuance
        - Apply digitally; use instantly; receive physical card through marketplace pickup network if needed
        - Faster activation and lower acquisition friction via existing commerce network
        - Public docs do not explain KYC, fraud, or card-lifecycle controls
      - - Buy a car with ecosystem financing support
        - Search classifieds and negotiate financing separately
        - Uzum Avto dealer listings plus partner-bank pre-approval workflow
        - Trusted inventory checks and faster financing discovery inside a known brand
        - Exact approval speed and conversion funnel are not publicly documented
      - - Merchant wants one ecosystem entry point
        - Separate relationships with marketplace, payments, and lending products
        - Uzum Business positioned as bundled entrepreneur surface for ecosystem services
        - Cross-sell potential between demand generation, payments, and finance
        - Public merchant feature set is still sparse versus the strategic positioning
    notes: >-
      Workflow rows synthesize public product descriptions from official pages and press releases. Benefits are
      company-stated or analyst-inferred; no controlled benchmarking is available.
    claimRefs:
      - CE010
      - CE012
      - CE013
      - CE019
      - CE021
      - CE023
      - CE029
  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Risk
    rows:
      - - Consumer superapp and branded surfaces
        - Front door for Market, Tezkor, Bank, Nasiya, Avto, and Business journeys
        - Consistent identity, checkout, and cross-sell flows across ecosystem brands
        - Public architecture for identity/session orchestration is not disclosed
      - - Marketplace inventory and merchant layer
        - Hosts assortment, seller onboarding, FBO/FBS/DBS logic, and cross-border catalog expansion
        - Seller ops, warehouse processes, and marketplace commissions
        - Seller-tooling depth and APIs are under-documented
      - - Last-mile and pickup-point network
        - Connects warehousing, customer delivery, returns, and card distribution
        - Company-owned and partner-operated pickup points plus courier network
        - Reliability, throughput, and economics by node are undisclosed
      - - Local payments and card-processing layer
        - Supports instant payment processing, card issuance, and embedded financial flows
        - Uzum Bank’s localized infrastructure plus regulatory compliance
        - No public payment-rail, tokenization, or auth architecture documentation
      - - BNPL and lending engine
        - Converts checkout demand into instalment and unsecured-loan volume
        - Credit scoring, underwriting rules, and repayment operations
        - Portfolio-quality controls and model governance are not publicly inspectable
      - - ML / risk / pricing systems
        - Used for credit screening, risk management, pricing, and personalization
        - Data pipelines, models, and product analytics teams
        - Model governance, bias testing, and monitoring are not publicly disclosed
      - - Local cloud and data-infrastructure expansion
        - Adds compute and storage capacity for scaling cloud services and AI workloads in-country
        - DataVolt partnership and Uzum’s own infrastructure spend
        - Memorandum does not quantify capacity, timeline, or workload allocation
      - - External technical access surface
        - Should expose docs, APIs, and release history to merchants or integrators
        - Public developer portal and any merchant documentation
        - Documented portal was inaccessible at run time; technical transparency is unusually low
    notes: >-
      This operating architecture is reconstructed from official business, results, and press materials plus
