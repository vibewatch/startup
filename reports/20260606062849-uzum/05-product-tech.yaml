  - id: TE004
    title: Trust / Quality / Compliance Table
    columns:
      - Control / Disclosure
      - Status
      - Scope
      - Gap / Caveat
    rows:
      - - Own banking license and fully digital bank claim
        - Publicly stated
        - Consumer banking, payments, and card issuance inside Uzum ecosystem
        - License mechanics and control architecture are not described in technical detail
      - - Localized payment processing and fast card issuance claim
        - Publicly stated
        - Bank and checkout infrastructure for ecosystem users
        - No public explanation of processing stack, tokenization, or issuer controls
      - - Pickup-point card distribution
        - Third-party reported and operationally plausible
        - Physical card handoff through commerce network
        - KYC, card-security, and exception handling are not documented
      - - Dealer-document verification in Uzum Avto
        - Publicly stated
        - Dealer onboarding and listing-quality assurance
        - No audit or fraud-rate disclosure for dealer verification
      - - Local personal-data storage and e-commerce platform rules in Uzbekistan
        - Externally documented requirement
        - Affects platform operators and payment/data flows
        - Uzum does not publish a data-flow map or compliance-control package tied to these rules
      - - Public developer portal for banking integrations
        - Inaccessible at research time
        - Should support merchants or technical partners
        - Broken access blocked inspection of public technical docs
      - - Website privacy notice
        - Publicly stated
        - Corporate-site personal-data disclosure
        - Useful as a legal notice, but not a substitute for payment-security or merchant-control documentation
      - - Security and payments-control disclosure
        - Not found publicly
        - Card-data, merchant auth, incident response, and uptime reporting
        - No public PCI-style, uptime, or incident-history artifacts surfaced in corpus
    notes: >-
      Rows mix disclosed controls with disclosed gaps because that is the real state of public evidence in this
