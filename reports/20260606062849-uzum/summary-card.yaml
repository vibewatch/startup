  topStrengths:
    - >-
      Uzum has reached unusual national scale for a four-year-old Uzbek platform, with more than 20 million users, more
      than 17,000 sellers, and more than 5 million cards claimed by mid-2026.
    - >-
      Public evidence supports real earnings power, including $176 million of FY2025 net profit, more than $500 million
      of FY2025 GMV, and $11.1 billion of payment volume.
    - >-
      The ecosystem spans commerce, payments, cards, BNPL, delivery, and merchant tooling on shared local
      infrastructure, which can deepen user retention and monetization.
    - >-
      Tencent, VR Capital, Omani sovereign investors, and a Fitch B/Positive rating provide credible third-party
      validation that the company is financeable at scale.
  topRisks:
    - >-
      The March 2026 $2.3 billion reference point is not a clean common-equity mark because the round mixed primary
      equity with structured or convertible capital.
    - >-
      Uzum remains a private, single-country ecosystem exposed to Uzbekistan macro, regulatory, currency, and policy
      risk.
    - >-
      Banking and BNPL expansion add credit, fraud, collections, and funding risk without public vintage, charge-off,
      reserve, or capital-ratio disclosure.
    - >-
      Governance, board, cap-table, and segment-level financial disclosure still lag what investors would normally want
      before underwriting a premium late-stage valuation.
    - >-
      Management is targeting another large pre-IPO financing, so dilution and preference-stack complexity may increase
      before exit.
  unresolvedGaps:
    - >-
      Full cap table, liquidation preferences, and exact conversion economics tied to the March 2026 structured
      instrument.
    - >-
      Audited segment-level revenue, gross profit, and capital-usage reporting across commerce, fintech, logistics, and
      banking.
    - BNPL and lending loss-vintage, delinquency, charge-off, reserve, and funding-cost detail.
    - >-
      Public governance detail beyond executive biographies, including board composition, committee structure, and
      investor-rights visibility.
    - A 2026 earnings bridge showing whether the FY2025 profit base is strengthening, flat, or under pressure.
