evidenceGaps:
  - id: EGO001
    topic: Board composition and committee structure remain undisclosed in public materials
    type: missing-source
    severity: minor
    missingEvidence: A board roster, committee list, and independence status for directors.
    whyItMatters: >-
      Without board visibility it is harder to judge governance maturity, investor rights, and key-person checks on the
      founder-led team.
    diligencePath: Request shareholder materials, board minutes summary, or a current board observer list from management.
    relatedQuestionRefs:
      - QO008
  - id: EGO002
    topic: Stakeholder or investor map is partial because public releases omit ownership percentages and board seats
    type: enumeration-incomplete
    severity: material
    missingEvidence: >-
      A current cap table with ownership by founder, management, and each external investor, plus any board-seat or
      veto-right allocation.
    whyItMatters: >-
      Control, dilution, and governance rights can materially change the investment case even when valuation headlines
      look attractive.
    diligencePath: Request the latest cap table, shareholder agreement summary, and board rights schedule under NDA.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO003
  - id: EGO003
    topic: Consolidated revenue, take rate, and segment mix are not publicly disclosed even though net profit is public
    type: private-evidence-only
    severity: material
    missingEvidence: >-
      Audited or management-approved revenue by segment, gross margin, and take-rate disclosures for commerce and
      fintech.
    whyItMatters: >-
      Profitability without revenue mix makes valuation-multiple work, quality-of-earnings analysis, and vertical
      attribution much weaker.
    diligencePath: Request audited financial statements or board reporting packs with revenue bridge and segment disclosures.
    relatedQuestionRefs:
      - QO020
  - id: EGO004
    topic: Public workforce metrics are not fully reconciled across sources
    type: conflicting-data
    severity: minor
    missingEvidence: >-
      A consistent employee definition covering FTEs, blue-collar logistics staff, contractors, and bank subsidiaries
      across reporting dates.
    whyItMatters: >-
      Headcount is a useful proxy for operating leverage and execution complexity, but the current public figures are
      not directly comparable.
    diligencePath: Ask management for an as-of-date headcount table split by business line and worker category.
    relatedQuestionRefs:
      - QO020
  - id: EGO005
    topic: The August 2025 equity amount is reported as both “nearly $70 million” and $65.5 million
    type: conflicting-data
    severity: minor
    missingEvidence: Final signed closing statement or cap-table update for the August 2025 round.
    whyItMatters: >-
      Exact round size affects financing chronology and implied dilution, especially in a company that has used both
      equity and structured capital.
    diligencePath: Confirm the legal close amount and whether public releases were rounded for communications purposes.
    relatedQuestionRefs:
      - QO012
  - type: conflicting-data
    severity: material
    topic: Online-payments TAM is only visible through Uzum’s own share and TPV claims.
    missingEvidence: >-
      An independent Central Bank or industry dataset that defines the denominator for total online-payments volume in
      Uzbekistan.
    whyItMatters: >-
      Without a public denominator, Uzum’s 13% payments-share claim is useful for direction but weak for valuation-grade
      TAM or market-share analysis.
    diligencePath: >-
      Request CBU market-volume disclosures or third-party acquiring data that reconciles online TPV, card volume, and
      merchant acceptance.
    relatedQuestionRefs:
      - QM009
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: BNPL market size is still company-derived rather than independently corroborated.
    missingEvidence: >-
      A regulator, bureau, or analyst dataset that sizes BNPL disbursements, active users, losses, and merchant mix
      across Uzbekistan.
    whyItMatters: >-
      Uzum’s 40% BNPL-share claim implies a large addressable market, but private or company-only market-share metrics
      can overstate a defensible SAM.
    diligencePath: >-
      Request product-level loan-book, merchant, and loss data from management and compare it with any CBU or
      bureau-level consumer-credit statistics.
    relatedQuestionRefs:
      - QM010
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: 2027 market projections mix broader e-commerce retail with narrower marketplace-turnover language.
    missingEvidence: >-
      A single methodology note that reconciles what counts as marketplace turnover, e-commerce retail, classifieds, and
      cross-border sales in Uzbekistan.
    whyItMatters: >-
      A valuation case can swing materially depending on whether Uzum is benchmarked against total e-commerce, only
      marketplaces, or only financed commerce.
    diligencePath: >-
      Ask management to reconcile its internal TAM deck to the KPMG and government lenses and to specify what spend is
      excluded from each layer.
    relatedQuestionRefs:
      - QM011
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Buyer economics by seller cohort, take rate, and merchant acquisition cost remain private.
    missingEvidence: >-
      Seller cohort retention, take-rate bridge, logistics subsidy by region, and merchant payback by category or size
      band.
    whyItMatters: >-
      The market may be large, but valuation depends on whether Uzum can monetize sellers and repeat buyers efficiently
      rather than just aggregate volume.
    diligencePath: >-
      Request cohort and unit-economics cuts by seller segment, especially electronics, fashion, food delivery, and
      BNPL-heavy categories.
    relatedQuestionRefs:
      - QM013
      - QM016
      - QM026
    relatedTableRefs:
