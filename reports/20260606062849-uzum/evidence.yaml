      texts were synthesized in English.
    missingEvidence: >-
      A current counsel memo or translated law pack tying the 2026 operational obligations directly to onboarding,
      treasury, and merchant workflows.
    whyItMatters: Rapid rule changes can slow growth or raise compliance cost even when topline demand remains strong.
    diligencePath: >-
