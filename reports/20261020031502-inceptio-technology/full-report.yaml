        title: Commercial milestones and investment read-through
        blocks:
          - type: paragraph
            body: >-
              The company's milestone sequence shows progression from system development and serial production toward
              larger customer deployments. In May 2024, Inceptio said Huatai Logistics had added 40 equipped trucks and
              reported route-level labor, fuel, and cost improvements. By September 2026, Inceptio said its systems had
