  - id: FE001
    title: Inceptio product architecture from vehicle to fleet
    type: stack
    summary: >-
      The claimed product spans physical execution, vehicle compute, autonomy software, data/model infrastructure, and
      fleet operations, with assurance processes crossing every layer.
    data:
      layers:
        - label: Fleet operations
          detail: >-
            Operational Brain turns truck telemetry and risk signals into route, energy, cost, and fleet-efficiency
            actions.
          items:
            - Risk identification and warning
            - Route and transportation-cost management
            - Energy and fuel optimization
        - label: Data and model infrastructure
          detail: >-
            Vehicle-cloud data, a data factory, scenario recognition, simulation, and the Freight World Model support
            iteration.
          items:
            - ROSL scenario library
            - Freight World Model
            - Closed-loop data and over-the-air updates
        - label: Autonomy software
          detail: >-
            Freight-native models and modular vehicle functions convert sensor input into driving and fuel-efficiency
            decisions.
          items:
            - Perception and localization
            - Planning and control
            - Fuel-efficient autonomous driving
        - label: Vehicle compute and interfaces
          detail: >-
            A redundant ADCU, system middleware, networking, sensors, and human-machine interfaces host and supervise
            autonomy.
          items:
            - ADCU and system software
            - Camera, lidar, radar, and gateway
            - Multimodal driver interaction
        - label: Physical truck execution
          detail: OEM-integrated vehicle systems execute commands and maintain fallback paths.
          items:
            - Drive-by-wire steering, braking, throttle, and gear
            - Redundant power and control paths
            - Factory-installed heavy-truck platform
        - label: Assurance processes
          detail: >-
            Functional safety, SOTIF, cybersecurity, staged testing, quality gates, and incident response are described
            as lifecycle controls.
          items:
            - ISO 26262 and ISO 21448 methods
            - ISO/SAE 21434 cybersecurity process
            - SIL, HIL, DIL, closed-ground, and open-road testing
    approximationNotes: >-
      Conceptual layer map based on company-authored descriptions; it does not represent undisclosed interfaces,
      ownership boundaries, or a verified production topology.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: Publicly evidenced customer adoption journey
    type: journey-map
    summary: >-
      The visible path runs from OEM-integrated supply through fleet deployment and operational proof, while renewal and
      revenue expansion remain unobserved.
    data:
      nodes:
        - id: integration
          label: OEM integration
          detail: Inceptio systems are pre-loaded into commercial truck platforms.
          touchpoints:
            - OEM product configuration
            - Fleet specification
        - id: cooperation
          label: Commercial inquiry
          detail: Official sites route prospective partners to dedicated cooperation contacts.
          touchpoints:
            - Industrial cooperation email
            - Commercial cooperation email
        - id: procurement
          label: Fleet procurement
          detail: Express and logistics operators order or specify equipped trucks.
          touchpoints:
            - Standard-equipment specification
            - Named fleet delivery
        - id: deployment
          label: Production deployment
          detail: Trucks operate on line-haul routes in multiple freight categories.
          touchpoints:
            - Express delivery
            - Contract logistics
            - Specialist freight
        - id: operating-proof
          label: Operating proof
          detail: Mileage, truck counts, and case-study economics demonstrate use but not retention.
          touchpoints:
            - Commercial kilometers
            - Route economics
            - Safety and efficiency claims
        - id: expansion
          label: Adjacent-scenario expansion
          detail: JD and SF programs extend evidence into L4 and regional-delivery pilots.
          touchpoints:
            - Commercial-cargo demonstration
            - Public-road light-truck pilot
    approximationNotes: >-
      The sequence reflects the public evidence path, not measured conversion rates; no retained source discloses stage
      conversion, renewal, or expansion revenue.
