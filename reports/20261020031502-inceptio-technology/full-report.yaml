  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Commercial proof and customer economics support monitoring, while financing ambiguity and missing valuation inputs
      block a price-taking recommendation.
    data:
      nodes:
        - id: scale
          label: Commercial scale
          detail: Company-reported mileage and deployment milestones indicate activity beyond pilot scale.
        - id: economics
          label: Customer economics
          detail: Huatai reported lower total cost of ownership on long routes.
        - id: market
          label: Market potential
          detail: The company-issued ARK summary cites a large 2030 autonomous over-the-road revenue projection.
        - id: capital
          label: Capital intensity
          detail: Reported funding and peer totals show a capital-heavy category, not a valuation.
        - id: disclosure
          label: Valuation gap
          detail: Current price, audited financials, cash needs, and preference terms are unavailable.
        - id: decision
          label: Track / research more
          detail: Advance only after private diligence supports price, dilution, return, and exit assumptions.
      edges:
