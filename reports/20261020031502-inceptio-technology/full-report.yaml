      - number: '4.2'
        title: Customer savings are promising but remain company-issued proxies
        blocks:
          - type: paragraph
            body: >-
              Inceptio's Huatai case reports a driver-to-truck ratio falling from two to one, fuel consumption declining
              by 3-5 liters per 100 kilometers, total cost of ownership per kilometer declining by 7-15%, and monthly
              kilometers per truck increasing by as much as 10%. A separate 2024 company release reports 20-50% lower
              labor costs, 3-7% better fuel efficiency, and estimated annual diesel savings of 6,000 liters per truck
              across deployed fleets. These measures indicate a plausible willingness-to-pay envelope, but they are
              company-issued operating outcomes rather than independently audited unit economics. They do not establish
              Inceptio's CAC, sales cycle, contribution margin, warranty burden, support cost, customer retention, or
              payback.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.3'
        title: Deployment scale does not resolve financing dependency
        blocks:
          - type: paragraph
            body: >-
              The operating base has expanded materially: Inceptio said more than 2,000 equipped trucks were deployed
              and commercial mileage exceeded 200 million kilometers by December 2024, while a September 2026 release
              relayed by Unite.AI put cumulative mileage above 1 billion kilometers. These are meaningful utilization
              signals, but neither units nor kilometers provide a revenue denominator. Indexed.vc reports $678.0 million
              raised across four rounds and identifies a $188.0 million Series B in February 2022 as the most recent
              round in its record. Funding raised is not cash available, and a dated last disclosed round cannot
              establish current runway, debt, project-finance exposure, or the timing of another financing.
            claimRefs:
              - CI008
              - CI009
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: The financial case remains blocked by private-company disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Inceptio has stronger public commercialization evidence than a pre-deployment autonomous-trucking venture,
              but the available source set is insufficient for a financial underwriting. The primary blockers are
              audited revenue by stream, realized price per truck or kilometer, gross margin and its
              hardware-versus-software mix, customer concentration, receivables and inventory needs, warranty and
              support costs, capex, debt obligations, cash, burn, and runway. A data-room review should reconcile
              customer contracts to recognized revenue, cohort contribution margin, and cash consumption, then stress
              adoption and financing scenarios. Until those records are supplied, revenue quality, margin scalability,
              and capital adequacy remain unverified despite substantial operating mileage and cumulative funding.
            claimRefs:
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operating milestones are not financial metrics
            body: >-
              More than 1 billion reported commercial kilometers demonstrates activity, but without price, recognized
              revenue, and cost-to-serve data it cannot establish ARR, margin, or cash generation.
            calloutType: risk
            claimRefs:
              - CI015
              - CI016
          - type: callout
            title: Make financing and margin evidence a diligence condition
            body: >-
              Require audited financial statements, current cash and debt schedules, contract-level pricing, revenue
              recognition, and cohort contribution margins before underwriting runway or valuation.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and maturity
        blocks:
          - type: paragraph
            body: >-
              Inceptio's delivered product is not a retrofit software package: its company-authored white paper
              describes a factory-integrated autonomous-driving system jointly engineered with truck OEMs and placed
              into serial production by the end of 2021. The system spans perception, localization, planning and
              control, fuel-saving logic, system software, an autonomous-driving control unit, sensors, drive-by-wire
              interfaces, human-machine interaction, cybersecurity, cloud infrastructure, and a closed-loop data system.
              That breadth is reinforced by company deployment releases: Huatai Logistics added 40 Inceptio-powered
              trucks in 2024, and Inceptio reported more than 2,000 deployed trucks and 200 million commercial
              kilometers by December 2024. In September 2026, Inceptio announced one billion commercial kilometers;
              Unite.AI repeated the announcement but explicitly attributed the milestone to the company, so it is
              corroboration of the announcement rather than independent measurement.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE007
              - CE008
              - CE010
      - number: '5.2'
        title: Architecture and data loop
        blocks:
          - type: paragraph
            body: >-
              The architecture is vertically integrated across vehicle, autonomy, data, and fleet layers. At the vehicle
              edge, the white paper describes multi-sensor perception, a heterogeneous and redundant ADCU, system
              middleware, planning and control, drive-by-wire execution, and multimodal driver interaction. At the data
              layer, Inceptio describes vehicle-cloud communications, data recording, over-the-air updates, and a
              closed-loop development process. Its 2026 "Freight Physical AI" positioning adds a freight-native
              end-to-end model, a Freight World Model for simulation and reconstruction, a scenario library containing
              up to several hundred thousand high-value scenarios, and an Operational Brain for fleet-level risk, route,
              energy, and cost management. These newer components are product claims in a company press release and
              derivative coverage, not a disclosed technical benchmark or auditable architecture specification.
            claimRefs:
              - CE002
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
      - number: '5.3'
        title: Deployment workflow and roadmap
        blocks:
          - type: paragraph
            body: >-
              The customer workflow begins with an OEM-produced truck preloaded with Inceptio's system, followed by
              route deployment with a safety driver, real-time vehicle monitoring, data capture, and iterative software
              improvement. Inceptio's Huatai release reports hub-to-hub operation with adaptive cruise, nudge, automated
              lane change, overtaking, emergency braking, driver monitoring, and seat-vibration alerts. It also reports
              a shift from two drivers per truck to one and a 7%-15% decline in total cost per kilometer on roughly
              1,500-kilometer routes, but those results remain company-published and lack an independently disclosed
              study design. The roadmap moves beyond L2+/L3 line-haul: Inceptio says it has regional L4 test permits, a
              JD Logistics open-road demonstration, an SF Express driverless light-truck pilot, and international
              validation activity. Pilot status should not be read as production-readiness evidence.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Safety, security, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Safety and security are embedded in the claimed engineering process. The white paper says Inceptio applies
              ISO 26262 functional-safety and ISO 21448 SOTIF methods, uses five test environments from
              software-in-the-loop through open-road testing, and holds process certifications for ASIL D and ISO/SAE
              21434. It also describes a six-layer cybersecurity design, 179 identified risk types, nearly 500 security
              requirements, penetration testing, fault monitoring, fallback, and redundant braking and steering. These
              are substantive design disclosures, but the same white paper acknowledges that autonomous-driving safety
              lacks uniform evaluation standards, extreme operational-design-domain coverage grows combinatorially, and
              deep-learning behavior in edge cases remains uncertain. The retained public web surfaces expose no
              independent safety benchmark, certification-registry record, incident history, service-level data, status
              page, public repository, package activity, or practitioner-community signal. Investment diligence
              therefore needs primary audit artifacts and operating logs, not additional marketing mileage.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial operation is the strongest maturity signal
            body: >-
              Company disclosures show serial production, named fleet deployments, and rapidly rising commercial
              mileage; these are stronger signals than a laboratory prototype, while still requiring independent
              operating-data verification.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
          - type: callout
            title: The assurance case remains company-controlled
            body: >-
              The pool contains detailed engineering disclosures but no independent safety benchmark, current
              certification-registry record, incident series, service-level history, or developer-community signal.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              Inceptio addresses business buyers rather than individual drivers. Dealroom classifies the company as a
              B2B manufacturing business, while company materials identify express delivery, less-than-truckload,
              cold-chain, general-cargo, and liquid-food transportation as served applications. That points to fleet
              owners and logistics procurement teams as the economic buyers, with drivers, dispatchers, safety teams,
              and fleet operators as day-to-day users. Named relationships span large express carriers and
              contract-logistics operators, including ZTO, STO, YTO, Huatai, JD Logistics, and SF Express; Dealroom
              separately names Budweiser, Nestle, JD Logistics, and Deppon Express. Public materials do not allocate
              revenue, vehicles, or usage by segment, so neither segment economics nor payer concentration can be
              measured from the retained evidence.
            claimRefs:
              - CU003
              - CU011
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption scale and trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signal is the company's reported commercial operating scale. Inceptio announced
              more than 1 billion commercial autonomous-driving kilometers on September 8, 2026, up from more than 200
              million kilometers in December 2024; the earlier disclosure also said more than 2,000 equipped trucks were
              deployed in leading Chinese logistics fleets. The company additionally claims roughly 97% coverage of
              China's highway network, more than 90% share of China's autonomous-trucking market, and a 2026 shift by
              several express carriers toward specifying autonomous driving as standard equipment. These are meaningful
              commercialization indicators, but they remain company-originated measures without disclosed active-fleet
              methodology, utilization distribution, or an independent audit tying kilometers to recurring customer
              revenue.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU016
      - number: '6.3'
        title: Named customer proof
        blocks:
          - type: paragraph
            body: >-
              Production evidence is most concrete for ZTO and Huatai. The 2024 disclosures describe a 400-truck
              delivery to ZTO and 40 trucks added by Huatai, while also naming deliveries to STO, YTO, and Yunyi.
              Inceptio's Huatai case study reports a 7-15% reduction in total cost of ownership per kilometer on routes
              averaging 1,500 kilometers, but the outcome was published by Inceptio rather than Huatai and is not
              accompanied by contract or cohort data. JD Logistics and SF Express evidence is explicitly earlier-stage:
              the 2026 release describes an L4 demonstration carrying commercial cargo with JD and a commercial
              public-road pilot of driverless light-duty trucks with SF. Named logos therefore span production
              deliveries and pilots and should not be treated as one uniform customer-adoption cohort.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU013
              - CU014
      - number: '6.4'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports an expansion loop from OEM-integrated vehicles to fleet procurement, operating
              mileage, and adjacent freight scenarios, but it does not establish retention. The official English and
              Chinese sites provide dedicated cooperation contacts, yet neither publishes pricing, procurement stages,
              renewal terms, or contract length. No retained source reports NRR, GRR, churn, repeat-order rates,
              customer revenue shares, or the share of kilometers contributed by the largest fleets. Dealroom's separate
              report of a 1.7% year-over-year team decline is a mild adverse operating signal, not evidence of customer
              attrition. Investors should therefore treat mileage and delivered-truck counts as adoption indicators, not
              substitutes for durable revenue, and obtain customer-level cohort and concentration data before
              underwriting land-and-expand economics.
            claimRefs:
              - CU005
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU007
              - CU009
              - CU010
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deployment proof is not retention proof
            body: >-
              More than 1 billion reported commercial kilometers and multiple named fleets demonstrate adoption, but
              public evidence does not disclose churn, renewals, contract length, repeat orders, or customer revenue
              concentration.
            calloutType: risk
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Inceptio reported more than one billion kilometers of commercial autonomous driving by September 2026,
              following its own 200-million-kilometer disclosure in December 2024. That scale expands the operating
              surface exposed to safety, regulatory, customer, and reputation failures; it does not by itself establish
              that those risks are controlled. The newest scale and market-share statements originate with Inceptio and
              were repeated by an AI trade publication, while the assigned evidence contains no regulator incident
              register, recall record, court docket, audited safety study, or insurer methodology. Risk ratings below
              are therefore evidence-weighted analyst judgments rather than measured incident probabilities. The
              investment case should remain conditional on primary-document diligence, especially because public
              evidence supports deployment growth more strongly than residual-risk measurement.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR007
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              Inceptio says it holds L4 testing permits in Zhejiang, Beijing, and Hainan and is conducting
              commercial-cargo demonstration operations with JD Logistics. Those permissions are evidence of regulatory
              access, but they are geographically bounded testing or demonstration permissions rather than proof of
              unrestricted driverless commercialization. The company also cites a joint CPIC study showing performance
              75-99% better than human-operated trucks across several safety indicators, yet the assigned materials do
              not disclose the study design, denominator, observation window, or incident definitions. The kill
              criterion is not the absence of a recorded incident in this pool. It is permit suspension, a material
              injury or recall, a regulator finding, or a safety metric that fails independent replication. Counsel
              should verify permit terms, litigation, privacy, cybersecurity, insurance, and product-liability
              allocation before underwriting international or L4 expansion.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR013
              - CR015
      - number: '7.3'
        title: Operational and technical failure surfaces
        blocks:
          - type: paragraph
            body: >-
              The deployed system combines LiDAR, millimeter-wave radar, cameras, onboard compute, planning and control
              software, driver monitoring, and emergency-braking functions. This creates correlated hardware, software,
              calibration, maintenance, connectivity, and human-oversight failure modes across a large fleet. Huatai's
              reported 40-truck deployment and improved fuel, staffing, and utilization outcomes are useful production
              evidence, but they come from an Inceptio-authored customer announcement and do not disclose downtime,
              intervention, maintenance, or severe-event rates. Inceptio's claimed scenario library and fleet-level
              Operational Brain may improve detection and iteration, but neither the assigned company release nor its
              republication provides an independent reliability audit. Diligence should require route-level
              disengagement, intervention, incident, uptime, sensor-replacement, and software rollback data, segmented
              by vehicle generation and OEM.
            claimRefs:
              - CR007
              - CR008
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR014
              - CR016
      - number: '7.4'
        title: Partner, concentration, financing, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Inceptio's factory-integrated model depends on OEM production, component availability, vehicle
              homologation, fleet-customer procurement, and the continuing willingness of logistics partners to deploy
              the system. Public materials identify Dongfeng and other OEM-linked deployments and several large
              logistics customers, but provide no revenue concentration, contract-duration, renewal, warranty,
              indemnity, or minimum-purchase data. Independent market databases report $678 million raised across four
              rounds, with the latest disclosed round in February 2022, but funding raised is not cash available and
              does not reveal burn or runway. Monitor permit continuity, serious safety events, OEM program retention,
              fleet utilization, customer concentration, and cash runway. Thesis-break triggers are a material permit
              loss, safety event with systemic implications, withdrawal of a core OEM, sustained fleet contraction, or
              inability to finance the capital and support burden of the installed base.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not infer safety from missing adverse records
            body: >-
              The assigned pool contains company safety claims but no regulator incident register, recall database, or
              independently published CPIC methodology. Absence from this bounded evidence pool is not evidence that no
              incident, recall, claim, or enforcement action occurred.
            calloutType: risk
            claimRefs:
              - CR006
              - CR013
          - type: callout
            title: Pre-investment kill criteria
            body: >-
              Stop or reprice on a material permit loss, systemic safety event, core-OEM withdrawal, sustained fleet
              contraction, or evidence that cash runway cannot support installed-fleet obligations and the L4 roadmap.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment logic
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track/research more, not buy. Inceptio's strongest evidence is operating scale: the
              company said ARK highlighted 250 million cumulative commercial autonomous-trucking miles as of October
              2025, while a December 2024 company update reported more than 2,000 deployed trucks and 200 million
              commercial kilometers. Customer-level evidence also points to potential value creation, with Huatai
              reporting a 7-15% reduction in total cost of ownership per kilometer on long routes. Those signals justify
              continued diligence, but they do not establish revenue, margin, cash generation, or equity value. With
              current price and financing terms absent, the risk rating is high, confidence is medium-low, and the
              valuation stance is indeterminate rather than cheap, fair, or expensive.
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Financing context and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports that Inceptio has raised $678 million across four rounds and identifies a February 2022
              Series B as its latest funding, while Caplight labels January 21, 2025 as the last round and shows an IPO
              row without a public amount or valuation. That conflict prevents the apparent 2025 event from being
              treated as verified financing or proof of an IPO. Funding raised is also not cash available and cannot
              substitute for burn or runway. Tracxn's selected peer set spans $165 million of reported funding for
              Kodiak to $1.03 billion for Waabi, placing Inceptio's funding scale inside a broad capital range but
              offering no valuation multiple. The comparable evidence therefore informs capital intensity, not price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.3'
        title: Scenario framework and entry discipline
        blocks:
          - type: paragraph
            body: >-
              A numeric bull/base/bear valuation would create false precision because the assigned evidence contains no
              current equity value, audited revenue, gross margin, retention, burn, cash balance, debt, preference
              stack, or fully diluted share count. The scenarios are therefore milestone gates rather than invented
              dollar ranges. A bull case requires independently verified growth and unit economics alongside sustained
              deployments; the base case requires commercialization to continue while economics and cash needs remain
              private; the bear case is triggered by stalled deployment, failure to validate savings, unfavorable
              financing terms, or a widening gap between capital consumed and commercial output. Entry discipline should
              be negotiated only after those inputs permit a model tied to revenue, margins, dilution, and a credible
              exit path.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public operating milestones improve strategic relevance but do not demonstrate exit readiness. Caplight's
              unlabeled-detail IPO row is insufficient to establish listing status, timing, proceeds, or investor
              liquidity, and the evidence set provides no M&A valuation reference. Before an investment decision,
              diligence should obtain audited financial statements, monthly cash and runway, cohort-level customer
              economics, fleet utilization, customer concentration, the current cap table, debt and liquidation
              preferences, and documentary support for any 2025 transaction. Thesis-break triggers are independently
              verified deployment stagnation, materially weaker savings than the company-reported ranges, inability to
              finance the next scale phase without punitive dilution, or regulatory and cross-border constraints that
              impair OEM, customer, or capital access. A September 2026 third-party summary repeated Inceptio's
              one-billion-kilometer announcement, reinforcing commercial relevance while remaining company-originated
              evidence.
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline dominates company quality
            body: >-
              Commercial evidence is strong enough to justify continued access and diligence, but not strong enough to
              infer an equity value. A favorable company view should not be converted into an investment recommendation
              until price, preferences, dilution, cash needs, and exit assumptions can be tested.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV016
