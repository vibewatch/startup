              same release describes 2026 pilots with JD Logistics and SF Express and international validation activity.
              The scale trajectory is strategically meaningful, but underwriting still requires fleet-level accident
              data, customer concentration, paid revenue, gross margin, and externally verified market-share
              denominators. No adverse event found in this constrained source pool should be interpreted as proof that
