  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded more narrowly than autonomous vehicles overall. Inceptio develops
              autonomy for heavy-duty trucks and focuses on line-haul logistics, while its described model also includes
              asset services and an autonomous trucking network. Relevant spend therefore includes factory-integrated
              autonomous driving systems, vehicle integration, and related per-kilometer capacity services; passenger
              autonomy, warehouse robots, and last-mile delivery vehicles are excluded unless Inceptio enters those
              adjacencies. The practical substitutes are conventional driver-operated fleets, driver-assistance
              packages, internal fleet technology, and competing OEM-integrated systems. The company lists Shanghai and
              Silicon Valley contact locations, but the retained evidence establishes commercial depth primarily in
              China rather than a geographically diversified operating market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The source set does not justify a current dollar TAM/SAM/SOM. A 2020 industry article cited a $1.0 billion
              global self-driving-truck technology market for that year and a $1.6 billion 2025 projection at 10.4%
              CAGR, while also citing a materially higher 18.6% CAGR forecast for the same period. Those historical
              estimates use undisclosed methodologies in the retained text and should not be rolled forward to 2026.
              More current evidence measures deployment rather than addressable spend: Inceptio reported 200 million
              commercial kilometers and more than 2,000 deployed trucks in late 2024, then more than 1 billion
              kilometers and approximately 97% highway-network coverage in 2026. Its claim of more than 90% Chinese
              autonomous-trucking share lacks an independent denominator, so it is an unverified SOM indicator rather
              than a defensible market size.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
