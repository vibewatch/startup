        title: Capitalization and scale indicators
        blocks:
          - type: paragraph
            body: >-
              Tracxn, Indexed.vc, and the reviewed secondary profile converge on $678 million of total funding across
              four rounds through February 2022. The reported sequence is $100 million in April 2020, $120 million in
              November 2020, $270 million in August 2021, and $188 million in February 2022. Investors named across
