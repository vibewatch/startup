          target: economics
          label: proof
        - source: economics
          target: market
          label: value path
        - source: market
          target: capital
          label: scaling requirement
        - source: capital
          target: disclosure
          label: underwriting constraint
        - source: disclosure
          target: decision
          label: recommendation
    approximationNotes: The flow expresses decision dependencies; it does not assign weights, probabilities, or valuation amounts.
