chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Inceptio Technology was founded in 2018 and is identified by independent company databases as a
              Shanghai-based autonomous-vehicle company focused on heavy-duty freight. Its operating model combines a
              proprietary full-stack autonomous-driving system with integration into serial-production trucks, rather
              than limiting the offering to an aftermarket software layer. The company's own contact pages identify
              operating addresses in Shanghai and Santa Clara, while third-party descriptions consistently place the
              primary corporate base in Shanghai. This dual-location footprint supports research access in Silicon
              Valley, but the available evidence does not establish a separately capitalized US operating entity or a
              material US commercial business. The investable identity is therefore a China-centered trucking autonomy
              platform with OEM-integrated technology and freight-operator deployments, not a general-purpose passenger
              autonomy company.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
