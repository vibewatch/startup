      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Julian Ma is consistently identified as founder and chief executive, making him the clearest key-person
              dependency in the accessible record. A secondary profile identifies Ruigang Yang as chief technology
              officer, but that role could not be confirmed from a current official leadership page in the assigned
              evidence. The evidence set contains no reliable current board roster, committee structure, ownership
              percentages, succession plan, or broader executive bench. That absence matters because Inceptio is
              managing capital-intensive vehicle integration, safety-critical software, regulatory permissions, and
              international pilots simultaneously. Diligence should not infer governance maturity from the prominence of
              its institutional investors; management interviews and corporate records are needed to establish decision
              rights, technical succession, board oversight, and the actual depth beneath the founder.
            claimRefs:
              - CO004
              - CO005
