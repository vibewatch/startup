            body: >-
              已部署系统结合 LiDAR、毫米波雷达、摄像头、车载计算、规划与控制软件、司机监控和紧急制动功能。这会在大型车队中形成相互关联的硬件、软件、标定、维护、连接和人工监督故障模式。Huatai 报告的 40
              辆部署，以及燃油、人员配置和利用率改善结果，是有用的量产证据，但来自 Inceptio 撰写的客户公告，未披露停机、接管、维护或严重事件率。Inceptio 所称的场景库和车队级 Operational
              Brain 可能改善检测和迭代，但指定公司公告及其转载都没有提供独立可靠性审计。尽调应要求按车辆代际和 OEM 分层的线路级脱离、接管、事故、正常运行时间、传感器更换和软件回滚数据。
