              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              公开运营里程碑提升了战略相关性，但没有证明退出准备度。Caplight 那行没有标签的 IPO 记录不足以证明上市状态、时间、募集所得或投资者流动性，证据集也没有 M&A
              估值参照。作出投资决定前，应获取经审计财务报表、月度现金和 runway、客户 cohort 经济性、车队利用率、客户集中度、当前股权结构表、债务和清算优先权，以及任何 2025
              年交易的文件支持。论点失效触发器包括经独立验证的部署停滞、节省明显低于公司报告区间、无法在惩罚性稀释之外为下一规模阶段融资，或监管与跨境限制损害 OEM、客户或资本准入。2026 年 9 月的一份第三方摘要重复了
              Inceptio 达到 10 亿公里的公告，在保持公司来源属性的同时强化了其商业相关性。
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格纪律压过公司质量
            body: 商业证据足以支持继续接触和尽调，但不足以推断股权价值。在价格、优先权、稀释、现金需求和退出假设可以被检验前，不应把对公司的正面判断转化为投资建议。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV016
