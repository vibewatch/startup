chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Inceptio Technology 成立于 2018
              年。独立公司数据库将其列为总部位于上海、专注重型货运的自动驾驶公司。其运营模式把自研全栈自动驾驶系统集成进量产卡车，而不是只提供售后软件层。公司联系页面显示其在上海和 Santa Clara
              设有运营地址，第三方资料也一致将上海列为主要公司基地。这一双地点布局有助于其接触硅谷研究资源，但现有证据无法证明其拥有独立资本化的美国运营实体或实质性美国商业业务。因此，值得投资研究的身份是一个以中国为中心、采用
              OEM 集成技术并服务货运运营商的卡车自动驾驶平台，而不是通用乘用车自动驾驶公司。
            claimRefs:
              - CO001
              - CO002
              - CO003
