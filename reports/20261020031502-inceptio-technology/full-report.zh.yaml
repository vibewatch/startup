  - id: FE001
    title: Inceptio 从车辆到车队的产品架构
    type: stack
    summary: 公司所称产品覆盖物理执行、车载计算、自动驾驶软件、数据 / 模型基础设施和车队运营，保障流程贯穿每一层。
    data:
      layers:
        - label: 车队运营
          detail: Operational Brain 将卡车遥测数据和风险信号转化为路线、能源、成本与车队效率行动。
          items:
            - 风险识别与预警
            - 路线与运输成本管理
            - 能源与燃油优化
        - label: 数据与模型基础设施
          detail: 车云数据、数据工厂、场景识别、仿真和 Freight World Model 支持迭代。
          items:
            - ROSL 场景库
            - Freight World Model
            - 闭环数据与空中更新
        - label: 自动驾驶软件
          detail: 面向货运的模型和模块化车辆功能将传感器输入转化为驾驶与燃油效率决策。
          items:
            - 感知与定位
            - 规划与控制
            - 高燃油效率自动驾驶
        - label: 车载计算与接口
          detail: 冗余 ADCU、系统中间件、网络、传感器和人机界面承载并监督自动驾驶系统。
          items:
            - ADCU 与系统软件
            - 摄像头、激光雷达、雷达与网关
            - 多模态驾驶员交互
        - label: 卡车物理执行
          detail: OEM 集成的车辆系统执行指令并保留降级路径。
          items:
            - 线控转向、制动、油门与换挡
            - 冗余动力与控制路径
            - 工厂安装的重型卡车平台
        - label: 保障流程
          detail: 功能安全、SOTIF、网络安全、分阶段测试、质量闸门和事件响应被描述为全生命周期控制。
          items:
            - ISO 26262 与 ISO 21448 方法
            - ISO/SAE 21434 网络安全流程
            - SIL、HIL、DIL、封闭场地与开放道路测试
    approximationNotes: 基于公司自述的概念性分层图；不代表未披露的接口、所有权边界或经验证的量产拓扑。
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: 有公开证据支持的客户采用路径
    type: journey-map
    summary: 可见路径从 OEM 集成供给延伸至车队部署和运营验证，但续约与收入扩张仍不可见。
    data:
      nodes:
        - id: integration
          label: OEM 集成
          detail: Inceptio 系统预装于商用卡车平台。
          touchpoints:
            - OEM product configuration
            - Fleet specification
        - id: cooperation
          label: 商业咨询
          detail: 官网将潜在合作伙伴引导至专门的合作联系人。
          touchpoints:
            - Industrial cooperation email
            - Commercial cooperation email
        - id: procurement
          label: 车队采购
          detail: 快递和物流运营商订购或指定配备相关系统的卡车。
          touchpoints:
            - Standard-equipment specification
            - Named fleet delivery
        - id: deployment
          label: 量产部署
          detail: 卡车在多个货运类别的干线运输路线上运营。
          touchpoints:
            - Express delivery
            - Contract logistics
            - Specialist freight
        - id: operating-proof
          label: 运营验证
          detail: 里程、卡车数量和案例经济性证明了使用，但不能证明留存。
          touchpoints:
            - Commercial kilometers
            - Route economics
            - Safety and efficiency claims
        - id: expansion
          label: 相邻场景扩张
          detail: JD 和 SF 项目将证据延伸至 L4 和区域配送试点。
          touchpoints:
            - Commercial-cargo demonstration
            - Public-road light-truck pilot
    approximationNotes: 该序列反映公开证据路径，而非实测转化率；保留的来源没有披露阶段转化、续约或扩张收入。
