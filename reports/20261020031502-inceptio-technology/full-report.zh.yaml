      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方通常是物流车队或合同承运商，日常用户是司机及调度或车队运营团队，经济上的付费方则是控制车辆采购和运输成本的组织。Inceptio 将快递、整车运输、零担和冷链物流列为已部署场景。Huatai
              在中国东部、中部和西南地区新增 40 辆卡车，展示了从线路验证到车队采购的分阶段路径。采购理由是运营性的，而不只是技术性的：Inceptio 报告司机与卡车比例从 2:1 变为 1:1，每 100 公里油耗减少
              3-5 升，长途线路每公里总成本下降 7-15%。这些结果来自公司披露的客户证据，仍需买方核实。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用动力来自可量化的人工、燃油、利用率和安全目标，也来自 OEM 合作伙伴提供的量产卡车。商业里程和已部署车队增长表明，在 Inceptio
              的中国线路上，这一品类已经超越零散原型阶段。制约因素同样明确：车队必须承担换车成本，验证特定线路的表现，接受集成和转换成本，满足公共道路监管，并在长期运营记录基础上相信安全声明。自动驾驶卡车初创企业过往的停业和裁员，加上技术与法律障碍，说明品类增长并不保证经济性持久。因此，估值应建立在经独立验证的单位经济性和重复采购上，而不是宽泛的市场增长倍数或公司未经验证的份额声明。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 当前 TAM 与 SOM 仍未经验证
            body: 没有保留来源提供当前、独立定义的美元市场规模，也没有 Inceptio 所称份额的分母。在这些缺口补齐前，应从已验证的采购和单位经济性出发评估机会。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
