      - number: '1.4'
        title: 商业里程碑与投资解读
        blocks:
          - type: paragraph
            body: >-
              公司里程碑显示，业务正从系统开发和量产走向更大规模的客户部署。2024 年 5 月，Inceptio 称 Huatai Logistics 新增 40 辆搭载系统的卡车，并报告了线路层面的人工、燃油和成本改善。到
              2026 年 9 月，Inceptio 称其系统商业自动驾驶里程已超过 10 亿公里，覆盖中国约 97% 的高速公路网络，并占中国自动驾驶卡车市场超过
              90%。这些是公司发起的指标，虽被转载和新闻摘要重复，但并非独立审计的市场测量。同一份公告还描述了 2026 年与 JD Logistics 和 SF Express
              的试点及国际验证活动。规模增长具有战略意义，但投资判断仍需车队层面的事故数据、客户集中度、已付收入、毛利率和经外部验证的市场份额分母。在这一受限资料池中没有发现不利事件，不应被解读为没有发生过不利事件。
