      - CR007
      - CR010
      - CR011
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 商业化证据和客户经济性足以支持继续跟踪，但融资情况不明且估值输入缺失，暂不足以支持按当前价格直接投资。
    data:
      nodes:
        - id: scale
          label: 商业化规模
          detail: 公司披露的里程和部署里程碑表明，业务已超出试点规模。
        - id: economics
          label: 客户经济性
          detail: Huatai 报告称，长途运输的总拥有成本更低。
        - id: market
          label: 市场潜力
          detail: 公司发布的 ARK 摘要引用了 2030 年自动驾驶干线运输的高额收入预测。
        - id: capital
          label: 资本密集度
          detail: 已披露融资额和同行融资总额显示，这是一个资本密集型赛道，而非估值依据。
        - id: disclosure
          label: 估值缺口
          detail: 当前价格、经审计财务数据、现金需求和优先权条款均不可得。
        - id: decision
          label: 跟踪 / 继续研究
          detail: 只有在私下尽调支持价格、稀释、回报和退出假设后，才应推进。
      edges:
        - source: scale
          target: economics
          label: 证据
        - source: economics
          target: market
          label: 价值路径
        - source: market
          target: capital
          label: 规模化要求
        - source: capital
          target: disclosure
          label: 投资判断约束
        - source: disclosure
          target: decision
          label: 推荐
    approximationNotes: 该流程表达决策依赖关系，不代表权重、概率或估值金额。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV014
      - CV015
      - CV016
