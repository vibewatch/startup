  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应比整个自动驾驶市场窄得多。Inceptio
              为重型卡车开发自动驾驶，重点是干线物流；其描述的模式还包括资产服务和自动驾驶卡车网络。因此，相关支出包括工厂集成式自动驾驶系统、车辆集成及相关按公里计费的运力服务；除非 Inceptio
              进入这些邻近领域，否则乘用车自动驾驶、仓储机器人和末端配送车辆不应计入。现实替代方案包括传统人工驾驶车队、驾驶辅助套件、车队自有技术和其他 OEM
              集成系统。公司列出上海和硅谷联系地点，但保留证据显示其商业深度主要在中国，而非地理多元化的运营市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有资料不足以支持当前的美元 TAM/SAM/SOM。2020 年一篇行业文章引用了当年 $1.0 billion 的全球自动驾驶卡车技术市场，以及 2025 年 $1.6 billion、CAGR 为
              10.4% 的预测，同时又引用了同一时期明显更高的 18.6% CAGR 预测。这些历史估算在保留文本中没有披露方法，不应直接外推至 2026 年。更近期的证据衡量的是部署而非可服务支出：Inceptio 称
              2024 年底已有 2 亿公里商业里程和超过 2,000 辆已部署卡车，2026 年则超过 10 亿公里、覆盖约 97% 的高速公路网络。其称占中国自动驾驶卡车市场超过
              90%，但缺少独立分母，因此只能视为未经验证的 SOM 指标，而不是可辩护的市场规模。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
