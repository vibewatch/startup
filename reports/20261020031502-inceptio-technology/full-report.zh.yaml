      - number: '8.2'
        title: 融资背景与可比证据
        blocks:
          - type: paragraph
            body: >-
              Tracxn 报告 Inceptio 四轮融资共 $678 million，并将 2022 年 2 月 Series B 列为最近一轮；Caplight 则把 2025 年 1 月 21
              日标为最近一轮，并显示一行没有公开金额或估值的 IPO 记录。这一冲突使得 2025 年事件不能被视为已验证融资或 IPO 证明。已募集资金也不等于可用现金，不能替代消耗速度或 runway。Tracxn
              的选定同行融资从 Kodiak 报告的 $165 million 到 Waabi 的 $1.03 billion，Inceptio
              处于宽泛资本区间之内，但没有提供估值倍数。因此，可比证据只能说明资本密集度，而不是价格。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.3'
        title: 情景框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              由于指定证据没有当前股权价值、经审计收入、毛利率、留存、消耗、现金余额、债务、优先股堆叠或完全稀释后的股数，给出数字化的乐观情景 / 基准情景 /
              悲观情景估值会制造虚假精确度。因此，情景应是里程碑门槛，而不是臆造的美元区间。乐观情景需要经独立验证的增长和单位经济性，并且部署持续；基准情景要求商业化继续推进，同时经济性和现金需求仍保持私有；悲观情景由部署停滞、节省无法验证、不利融资条款，或资本消耗与商业产出之间的差距扩大触发。只有在这些输入能够支持与收入、利润率、稀释和可信退出路径挂钩的模型后，才能谈入场纪律。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
