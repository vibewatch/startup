  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构可见，但价格和结构不可见
        blocks:
          - type: paragraph
            body: >-
              公开证据支持两条潜在变现路径：嵌入量产卡车的 Inceptio Autonomous Driving System，以及 Transportation-as-a-Service 货运网络。在 Huatai
              部署中，该系统预装于 Dongfeng Tianlong 卡车，证明了从 OEM 到车队的交付机制，但没有说明 Inceptio
              获得的是前置许可费、按车计的硬件毛利、经常性软件费、使用费、服务收入，还是几者组合。TaaS 可能产生交易型或按运力计费的收入，但审阅资料没有披露资费或 take rate。客户节省的成本不能视为
              Inceptio 收入，公开商业里程也不能视为 ARR。
