              ZTO、STO、YTO、Huatai、JD Logistics 和 SF Express；Dealroom 另行点名 Budweiser、Nestle、JD Logistics 和 Deppon
              Express。公开材料没有按分群分配收入、车辆或使用量，因此无法从保留证据衡量各分群经济性或付费方集中度。
