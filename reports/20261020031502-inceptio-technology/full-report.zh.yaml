        - 只有在获得经审计收入、利润率、现金需求、稀释信息和可信退出倍数后，才可考虑溢价。
        - 执行、监管、资本密集度和倍数压缩。
        - 付费利用率上升、重复订单、单位经济性改善以及不苛刻的融资。
      - - 基准
        - 商业里程与部署继续增长，但经济性和财务报表仍属私有信息。
        - 不给出数值区间；通过持续监测和获取数据室权限保留期权价值，而不是被动接受价格。
        - 烧钱情况不透明、客户集中、融资压力和自动驾驶进展缓慢。
        - 部署稳定推进，但披露不足以评估回报。
      - - 悲观
        - 部署停滞、节省无法通过独立验证、资本需求上升，或交易条款损害普通股权益。
        - 公开信息无法界定下行空间；重新考虑前，必须重设价格并审阅优先级。
        - 下轮融资、优先权负担、流动性延迟、监管阻力和商业化失败。
        - 利用率下降、失去锚定客户、里程碑延迟或苛刻资本。
    notes: 各情景均未虚构估值区间或概率；由于指定证据缺少必要的财务与资本结构输入，每个情景都只是尽调闸门。
