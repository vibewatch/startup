  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争集合覆盖直接自动驾驶同行、相邻货运模式和现状方案
        blocks:
          - type: paragraph
            body: >-
              买方替代方案不止一小批自动驾驶卡车开发商。Tracxn 将 Aurora、Einride、TuSimple、Gatik、PlusAI、Waabi、Kodiak、Changsha Intelligent
              Driving Institute 和 DeepWay 列入活跃竞争集合，但这些公司的运营范围不同：长途自动驾驶软件、中途运输服务、电动自动货运和智能卡车制造并不是可互换的产品。传统人工驾驶车队、OEM
              驾驶辅助套件和车队内部优化仍是实际替代方案，因为它们无需采用完整自动驾驶运营模式，也能改善安全或成本。因此，竞争边界应按货运任务、地理区域、自动化水平和采购模式评估，而不是做无差别的公司排名。
            claimRefs:
              - CP001
              - CP003
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: Inceptio 的地位建立在已部署运营和嵌入式分销之上
        blocks:
          - type: paragraph
            body: >-
              Inceptio 称其在 2021 年底与 OEM 合作伙伴开始量产 L3 卡车，并披露截至 2024 年 12 月已有超过 2,000 辆已部署卡车和 200M 公里商业里程。公司随后在 2026 年 9
              月披露达到 10 亿公里；行业出版物还报道了 STO Express 和 ZTO Freight
              的已宣布订单。这些都是有意义的商业化信号，因为它们把软件、车辆集成和已点名的物流渠道连在一起。但它们不等同于经审计的市场份额、独立安全验证或已披露收入。证据主要来自公司，即使被新闻或分发平台转述也一样；因此本章把部署视为已展示，把所称表现和份额视为未经验证。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP011
              - CP013
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP015
              - CP016
      - number: '3.3'
        title: 数据、OEM 接入与运营集成是可能的护城河
        blocks:
          - type: paragraph
            body: >-
              Inceptio 的防御性逻辑是一个强化循环：量产卡车产生运营数据，数据支持模型和场景迭代，改进后的软件再通过 OEM 和车队关系分发。公司提出的 Transportation-as-a-Service 方向和
              Freight Physical AI 架构，把产品从车载驾驶栈扩展到车队级路线、风险、能源和成本管理。这可能加深集成并提高切换摩擦，尤其是在客户依赖兼容卡车平台、OTA
              更新、保险产品和运营流程的情况下。不过，持久性尚未得到证明。竞争对手累计融资可观，而融资额不等于可用现金；指定证据也无法证明独家性、留存、数据质量可比性，或客户是否能在多个车辆和软件供应商之间多栖部署。
            claimRefs:
              - CP002
              - CP010
              - CP011
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: 定价不透明与 L4 过渡使买方决策保持开放
        blocks:
          - type: paragraph
            body: >-
              没有保留来源披露 Inceptio
              及其同行的可比目录价、实际合同价、软硬件分配、保险经济性或最低承诺。因此，仅凭公开价格无法比较买方的总成本；必须进一步核查车辆采购、改装或工厂集成、司机要求、支持、维护、车联网、保险和线路限制。成熟度边界同样关键。Inceptio
              的大规模运营基础被描述为 L2+/L3，而 L4 只出现在许可、演示和试点中。这带来双向替代风险：无人驾驶规模化前，现有厂商可以先改善辅助驾驶经济性；如果聚焦 L4
              的新进入者更快跨过商业和监管鸿沟，也可能形成竞争。
            claimRefs:
