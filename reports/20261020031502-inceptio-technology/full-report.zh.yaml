            body: >-
              客户流程从预装 Inceptio 系统的 OEM 卡车开始，随后由安全员参与线路部署、实时监控车辆、采集数据并迭代软件。Inceptio 的 Huatai
              公告称，系统支持枢纽到枢纽运营、自适应巡航、轻推、自动变道、超车、紧急制动、司机监控和座椅振动提醒。公告还称，每辆卡车的司机数从两人变为一人，在约 1,500 公里线路上每公里总成本下降
