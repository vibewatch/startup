      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Julian Ma 一直被列为创始人兼 CEO，是现有资料中最明确的关键人物依赖。另一份次级资料称 Ruigang Yang 为
              CTO，但指定证据中没有当前官方领导层页面能够确认这一职务。证据集没有可靠的当前董事会名单、委员会架构、持股比例、继任计划或更完整的高管梯队。Inceptio
              同时管理资本密集型车辆集成、安全关键软件、监管许可和国际试点，这一缺口因此很重要。不能因为机构投资者知名就推断其治理成熟；要确认决策权、技术继任、董事会监督以及创始人之外的实际管理深度，仍需访谈管理层并查阅公司记录。
            claimRefs:
              - CO004
              - CO005
