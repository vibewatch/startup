  - id: FM001
    title: 受证据约束的市场规模阶梯
    type: pyramid
    summary: 历史品类预测位于当前部署指标之上；各层使用不同单位，是证据筛选层，而非按价值比例缩放的 TAM 漏斗。
    data:
      items:
        - label: 历史全球品类基准
          value: 1
          unit: USD billions
          detail: The Robot Report 引用的 Allied Market Research 2020 年估计。
        - label: 历史全球品类预测
          value: 1.6
          unit: USD billions
          detail: 2020 年引用的 Allied Market Research 2025 年预测。
        - label: Inceptio 商业里程
