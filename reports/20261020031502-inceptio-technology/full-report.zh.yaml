      - number: '5.4'
        title: 安全、安保与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              安全与安保被嵌入其声称的工程流程。白皮书称 Inceptio 采用 ISO 26262 功能安全和 ISO 21448 SOTIF 方法，使用从软件在环到开放道路测试的五种测试环境，并持有 ASIL D 和
              ISO/SAE 21434 流程认证。白皮书还描述了六层网络安全设计、179 类已识别风险、近 500
              项安全要求、渗透测试、故障监测、故障降级以及冗余制动和转向。这些是实质性的设计披露，但同一白皮书也承认，自动驾驶安全缺乏统一评估标准，极端运行设计域的覆盖会组合式增长，深度学习在边缘案例中的行为仍不确定。保留的公开网页没有显示独立安全基准、认证注册记录、事故历史、服务水平数据、状态页面、公开代码库、软件包活动或从业者社区信号。因此，投资尽调需要一手审计材料和运营日志，而不是更多营销里程。
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
