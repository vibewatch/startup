            body: >-
              Inceptio 称截至 2026 年 9 月已有超过 10 亿公里商业自动驾驶里程，此前公司在 2024 年 12 月披露过 2
              亿公里。这样的规模扩大了暴露于安全、监管、客户和声誉失败的运营面，但本身不能证明这些风险已受控。最新的规模和市场份额声明来自 Inceptio，并被一家 AI
              行业媒体重复；指定证据没有监管机构事故登记、召回记录、法院案卷、经审计安全研究或保险方方法。以下风险评级因此是按证据加权的分析师判断，而不是测得的事故概率。投资判断应继续以一手文件尽调为条件，尤其是因为公开证据对部署增长的支持强于对剩余风险的测量。
