      - number: '4.3'
        title: 部署规模无法消除融资依赖
        blocks:
          - type: paragraph
            body: >-
              运营基础已明显扩大：Inceptio 称截至 2024 年 12 月已部署超过 2,000 辆装备卡车，商业里程超过 2 亿公里；Unite.AI 转述的 2026 年 9 月公告则称累计里程超过 10
              亿公里。这些是有意义的利用率信号，但车辆数和里程都不能提供收入分母。Indexed.vc 报告四轮融资共 $678.0 million，并将 2022 年 2 月的 $188.0 million Series B
              列为其记录中的最近一轮。已募集资金不等于可用现金，最后一轮披露日期也不能证明当前 runway、债务、项目融资敞口或下一轮融资时间。
            claimRefs:
              - CI008
              - CI009
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: 私营公司披露缺口仍阻断财务判断
        blocks:
          - type: paragraph
            body: >-
              与尚未部署的自动驾驶卡车项目相比，Inceptio
              的公开商业化证据更强，但现有资料仍不足以完成财务投资判断。主要缺口包括按收入流划分的经审计收入、每辆卡车或每公里实际价格、毛利率及软硬件结构、客户集中度、应收账款和库存需求、质保与支持成本、资本开支、债务义务、现金、消耗和
              runway。应通过数据室审阅，把客户合同与确认收入、cohort
              贡献毛利和现金消耗对账，再对采用和融资情景做压力测试。在这些记录提供前，尽管运营里程和累计融资规模可观，收入质量、毛利率扩张性和资本充足性仍未经验证。
            claimRefs:
