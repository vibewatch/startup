  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 已报告里程碑记录了 Inceptio 从成立、融资到量产、商业部署及 2026 年 9 月里程声明的进程。
    data:
      items:
        - date: '2018'
          label: 公司成立
          detail: 独立数据库和审阅过的二手资料均将 2018 年确定为 Inceptio 的成立年份。
          tone: neutral
          claimRefs:
            - CO001
        - date: 2020-04
          label: Series A 轮
          detail: 二手资料称 GLP 和 G7 领投了 $100 million 的 Series A 轮融资。
          tone: neutral
          claimRefs:
            - CO006
