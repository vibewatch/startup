      - CP016
  - id: FI001
    title: 从商业活动到客户价值，但缺少收入桥接
    type: flow
    summary: 公开证据将部署与运营活动、客户收益串联起来，但没有披露 Inceptio 获得的合同对价或毛利。
    data:
      nodes:
        - id: oem-truck
          label: 量产 OEM 卡车
          detail: Huatai 部署中识别出 Dongfeng Tianlong 车型。
        - id: embedded-ads
          label: 预装 Inceptio ADS
          detail: 自动驾驶系统在客户车队运营前已完成嵌入。
        - id: fleet-deployment
          label: 客户车队部署
          detail: Huatai 增加了 40 辆卡车；2024 年各车队报告的卡车总数超过 2,000 辆。
        - id: commercial-mileage
          label: 商业道路运营
          detail: 报告累计里程从 2024 年的 200 million km 增至 2026 年的超过 1 billion km。
        - id: operating-benefit
          label: 人力、燃油与利用率收益
          detail: 公司公告报告了买方节省和月度里程提升。
        - id: undisclosed-capture
          label: Inceptio 收入与毛利
          detail: 价格、确认收入、服务成本和毛利均未公开披露。
