        title: 交付产品与成熟度
        blocks:
          - type: paragraph
            body: >-
              Inceptio 的交付产品不是改装软件包：公司白皮书称，这是一套与卡车 OEM 联合开发、工厂集成并在 2021
              年底前投入量产的自动驾驶系统。系统覆盖感知、定位、规划与控制、节油逻辑、系统软件、自动驾驶控制单元、传感器、线控接口、人机交互、网络安全、云基础设施和闭环数据系统。公司的部署公告进一步支持这一广度：Huatai
              Logistics 在 2024 年新增 40 辆 Inceptio 动力卡车，Inceptio 称截至 2024 年 12 月已部署超过 2,000 辆卡车、商业里程达 200M 公里。2026 年 9
              月，Inceptio 宣布商业里程达到 10 亿公里；Unite.AI 重复了这一消息，但明确将里程碑归因于公司，因此它是对公司公告的佐证，而非独立测量。
            claimRefs:
