  - id: FP001
    title: 指定证据池中的融资规模与商业化证据
    type: quadrant
    summary: Inceptio 是图中唯一拥有量产部署和大规模商业里程指定证据的公司；竞争对手的纵向位置反映该证据池中证据是否可得，而不是产品实际成熟度。
    data:
      points:
        - label: Inceptio Technology
          x: 2
          'y': 3
          detail: 报告融资额为 $678M；保留的公司来源记录了量产卡车和商业里程。
        - label: Aurora
          x: 2
          'y': 2
          detail: 报告融资额为 $693M；Tracxn 描述了货运集成，但指定证据池中没有部署细节。
        - label: Einride
          x: 3
          'y': 2
          detail: 报告融资额为 $865M；Tracxn 描述了电动与自动驾驶货运运输。
        - label: TuSimple
          x: 2
          'y': 2
          detail: 报告融资额为 $648M；Tracxn 描述了自动驾驶卡车解决方案，但此处没有当前部署细节。
        - label: Gatik
          x: 2
          'y': 2
          detail: 报告融资额为 $500M；Tracxn 描述了中程自动驾驶卡车运营。
        - label: PlusAI
          x: 3
          'y': 2
          detail: 报告融资额为 $720M；Tracxn 描述了出厂集成卡车。
        - label: Waabi
          x: 3
          'y': 1
          detail: 指定证据池中仅有平台描述；报告融资额为 $1.03B。
    approximationNotes: >-
      序数 x 分数：Tracxn 报告累计融资低于 $300M 为 1，$300M 至 $699M 为 2，达到或超过 $700M 为 3。序数 y 分数：仅有资料页列举为 1，产品或运营模式描述为 2，保留有量产商业运营证据为
      3。分数衡量的是这组证据，而非质量或市场排名。
