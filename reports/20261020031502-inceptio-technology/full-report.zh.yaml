              Inceptio 称其持有浙江、北京和海南的 L4 测试许可，并与 JD Logistics
              开展商业货物演示运营。这些许可证明其具备监管准入，但属于有地域边界的测试或演示许可，不是可以无限制商业化无人驾驶的证明。公司还引用一项 CPIC 联合研究，称其在若干安全指标上比人工驾驶卡车好
              75%-99%；但指定材料没有披露研究设计、分母、观察窗口或事故定义。否决标准不是这一资料池中没有记录事故，而是许可被暂停、发生重大伤害或召回、监管机构作出不利认定，或安全指标无法通过独立复现。投资国际化或 L4
              扩张前，法律顾问应核实许可条款、诉讼、隐私、网络安全、保险和产品责任分配。
