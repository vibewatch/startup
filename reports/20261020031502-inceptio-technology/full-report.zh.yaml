      - number: '4.2'
        title: 客户节省有吸引力，但仍是公司披露的代理指标
        blocks:
          - type: paragraph
            body: >-
              Inceptio 的 Huatai 案例称，司机与卡车比例从 2:1 降至 1:1，每 100 公里油耗减少 3-5 升，每公里总拥有成本下降 7-15%，每辆卡车月行驶里程最多增加 10%。公司另一份 2024
              年公告称，已部署车队人工成本下降 20-50%，燃油效率提升 3-7%，每辆卡车预计每年节省柴油 6,000 升。这些指标说明客户可能愿意付费，但它们是公司披露的运营结果，而非独立审计的单位经济性。它们不能证明
              Inceptio 的 CAC、销售周期、贡献毛利、质保负担、支持成本、客户留存或回本周期。
