      - number: '5.2'
        title: 架构与数据闭环
        blocks:
          - type: paragraph
            body: >-
              该架构纵向贯通车辆、自动驾驶、数据和车队层。在车辆端，白皮书描述了多传感器感知、异构冗余 ADCU、系统中间件、规划与控制、线控执行和多模态司机交互。在数据层，Inceptio 描述了车云通信、数据记录、OTA
              更新和闭环开发流程。其 2026 年提出的 Freight Physical AI 定位加入了货运原生端到端模型、用于仿真和重建的 Freight World
              Model、包含数十万高价值场景的场景库，以及负责车队级风险、路线、能源和成本管理的 Operational Brain。这些新组件来自公司新闻稿及衍生报道中的产品声明，并非已披露的技术基准或可审计的架构规格。
