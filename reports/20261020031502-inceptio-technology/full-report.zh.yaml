      - number: '7.4'
        title: 合作伙伴、集中度、融资与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Inceptio 的工厂集成模式依赖 OEM 生产、零部件供应、车辆认证、车队客户采购，以及物流合作伙伴持续部署系统的意愿。公开材料点名 Dongfeng 和其他 OEM
              相关部署，以及几家大型物流客户，但没有提供收入集中度、合同期限、续约、质保、赔偿或最低采购数据。独立市场数据库报告四轮融资合计 $678 million，最近披露轮次在 2022 年 2
              月；但已募集资金不等于可用现金，也不能说明消耗速度或 runway。应监测许可延续、严重安全事件、OEM 项目留存、车队利用率、客户集中度和现金
              runway。论点失效触发器包括重大许可损失、具有系统性影响的安全事件、核心 OEM 退出、车队持续收缩，或无法为已安装车队的资本和支持负担融资。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR012
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要从缺少不利记录推断安全
            body: 指定资料池包含公司的安全声明，但没有监管事故登记、召回数据库或独立发布的 CPIC 方法。某项记录未出现在这一限定资料池中，不代表没有发生事故、召回、索赔或执法行动。
            calloutType: risk
            claimRefs:
              - CR006
              - CR013
          - type: callout
            title: 投资前否决标准
            body: 出现重大许可损失、系统性安全事件、核心 OEM 退出、车队持续收缩，或证据表明现金 runway 无法支撑已安装车队义务和 L4 路线图时，应停止投资或重新定价。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR009
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资逻辑
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪 / 继续研究，而不是买入。Inceptio 最强的证据是运营规模：公司称 ARK 截至 2025 年 10 月强调其累计商业自动驾驶卡车里程达到 2.5 亿英里；2024 年 12
              月公司更新则披露已部署超过 2,000 辆卡车和 2 亿公里商业里程。客户层面的证据也显示潜在价值创造，Huatai 称长途线路每公里总拥有成本下降
              7%-15%。这些信号足以支持继续尽调，但不能证明收入、利润率、现金创造或股权价值。由于当前价格和融资条款缺失，风险评级为高，信心为中低，估值立场应为无法判断，而不是便宜、公允或昂贵。
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV016
