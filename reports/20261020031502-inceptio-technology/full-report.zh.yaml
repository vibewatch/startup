              - CO005
      - number: '1.3'
        title: 资本化与规模指标
        blocks:
          - type: paragraph
            body: >-
              Tracxn、Indexed.vc 和审阅的次级资料都指向同一结论：截至 2022 年 2 月，四轮融资合计 $678 million。披露的顺序为 2020 年 4 月 $100 million、2020 年
              11 月 $120 million、2021 年 8 月 $270 million，以及 2022 年 2 月 $188
              million。这些记录提到的投资者包括物流、战略和金融机构，可能有助于商业化，但无法说明当前控制权或清算经济性。Tracxn 估计截至 2026 年 9 月 30 日有 179
              名员工；这是第三方估算，并非公司认证的员工数。没有可访问来源披露当前估值。Caplight 还显示一项日期为 2025 年 1 月 21 日的 IPO 事件，而另外两个当前数据库仍将 Inceptio 列为
              Series B。公开记录无法解决这一矛盾，应将其视为资本化尽调问题，而不是上市已经发生的证据。
