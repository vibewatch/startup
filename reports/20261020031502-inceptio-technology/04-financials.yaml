      severity: material
      topic: customer-economics
      missingEvidence: >-
        Independent verification of labor, fuel, utilization, safety-driver, maintenance, and
        total-cost outcomes across comparable routes and customer cohorts.
      whyItMatters: >-
        Current savings evidence is company-issued and cannot by itself establish sustained
        buyer ROI, pricing power, or repeatable unit economics.
      diligencePath: >-
        Obtain raw telematics and invoices for matched routes, interview fleet finance teams,
        and commission an independent cohort analysis.
      relatedQuestionRefs: [QI003, QI007]
      relatedTableRefs: [TI002, TI003]
