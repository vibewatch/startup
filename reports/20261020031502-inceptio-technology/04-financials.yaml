  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: >-
        Audited income statements, balance sheets, cash-flow statements, monthly burn, current
        cash, restricted cash, debt, project-finance obligations, and management runway plan.
      whyItMatters: >-
        Funding raised cannot establish liquidity, and operating mileage cannot establish
        profitability or the timing and size of the next financing.
      diligencePath: >-
        Obtain audited statements, current management accounts, bank and debt schedules, a
        24-month operating plan, and monthly budget-to-actual cash reconciliation.
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: revenue-model
      missingEvidence: >-
        Contract-level pricing, billing unit, discounts, revenue recognition, recurring versus
        non-recurring mix, customer concentration, renewals, and revenue by offering.
      whyItMatters: >-
        Public deployment and customer savings do not reveal the amount, durability, or quality
        of revenue captured by Inceptio.
      diligencePath: >-
        Review the contract register, invoices, deferred-revenue roll-forward, top-customer
        cohorts, renewal history, and recognized revenue reconciliation.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI001, TI002]
