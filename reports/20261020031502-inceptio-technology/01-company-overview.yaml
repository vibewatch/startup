callouts:
  - calloutType: strength
    title: Commercial scale is visible, but not audited
    body: >-
      The September 2026 mileage claim and named customer deployments indicate
      substantial real-world use. They do not substitute for audited fleet,
      safety, revenue, or market-share data.
    claimRefs: [CO010, CO011, CO012, CO013]
  - calloutType: risk
    title: Capitalization record requires primary-document confirmation
    body: >-
      The accessible sources agree on $678 million raised but disagree on whether
      Inceptio remains Series B or had an IPO event in 2025, while current valuation
      and security terms remain undisclosed.
    claimRefs: [CO006, CO009, CO015, CO016]
