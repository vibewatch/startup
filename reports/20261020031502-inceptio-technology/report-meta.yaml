  productSummary: >-
    Factory-integrated heavy-truck autonomy spanning sensing, localization, planning and control, vehicle compute,
    drive-by-wire interfaces, vehicle-cloud data, software updates, and fleet-level operations tooling.
  customerFocus: >-
    Express delivery, line-haul, less-than-truckload, contract-logistics, cold-chain, general-cargo, and other
    heavy-freight fleet operators.
