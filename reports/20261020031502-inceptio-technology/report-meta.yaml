companyProfile:
  summary: >-
    Founded in Shanghai in 2018, Inceptio develops a full-stack autonomous-driving platform integrated into
    serial-production heavy trucks. Its public commercialization record includes named logistics deployments and more
    than one billion company-reported commercial autonomous-driving kilometers, but current financial, capitalization,
    governance, and independently verified safety data remain limited.
