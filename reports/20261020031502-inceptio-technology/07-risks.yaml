callouts:
  - calloutType: "risk"
    title: "Do not infer safety from missing adverse records"
    body: >-
      The assigned pool contains company safety claims but no regulator incident register, recall
      database, or independently published CPIC methodology. Absence from this bounded evidence pool
      is not evidence that no incident, recall, claim, or enforcement action occurred.
    claimRefs:
      - "CR006"
      - "CR013"
  - calloutType: "recommendation"
    title: "Pre-investment kill criteria"
    body: >-
      Stop or reprice on a material permit loss, systemic safety event, core-OEM withdrawal,
      sustained fleet contraction, or evidence that cash runway cannot support installed-fleet
      obligations and the L4 roadmap.
    claimRefs:
      - "CR003"
      - "CR009"
      - "CR010"
