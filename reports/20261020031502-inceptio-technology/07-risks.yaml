  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "safety"
      missingEvidence: >-
        Independent CPIC methodology, regulator incident and recall records, insurance claims data,
        and complete litigation or enforcement records.
      whyItMatters: >-
        Company-issued comparative safety claims cannot establish severe-event frequency, product
        liability exposure, or the absence of adverse legal and regulatory events.
      diligencePath: >-
        Obtain the full CPIC study and loss runs, query applicable court and regulator databases,
        and reconcile every material incident, recall, claim, and enforcement matter with management.
      relatedQuestionRefs:
        - "QR002"
        - "QR003"
      relatedTableRefs:
        - "TR001"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: >-
        Revenue and vehicle concentration by customer and OEM, contract duration, renewal,
        minimum-purchase, warranty, indemnity, and termination terms.
      whyItMatters: >-
        Named deployments establish adoption but not commercial durability or exposure to a single
        customer, OEM program, or procurement cycle.
      diligencePath: >-
        Review customer and OEM contracts, cohort revenue, renewal history, order backlog, fleet
        utilization, and concentration schedules for the last eight quarters.
      relatedQuestionRefs:
        - "QR007"
      relatedTableRefs:
        - "TR003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-risk"
      missingEvidence: >-
        Audited revenue, gross margin, operating cash flow, cash balance, debt, burn, runway, and
        investor preference terms.
      whyItMatters: >-
        Historical funding raised cannot establish current liquidity or the ability to support
        installed fleets, R&D, and international expansion.
      diligencePath: >-
        Obtain audited financial statements, monthly cash reporting, capitalization table, debt and
        preference documents, and a board-approved 24-month operating plan.
      relatedQuestionRefs:
        - "QR008"
      relatedTableRefs:
        - "TR003"
    - type: "missing-source"
      severity: "material"
      topic: "cybersecurity"
      missingEvidence: >-
        Independent penetration tests, security certifications, outage history, fleet-cloud
        architecture controls, recovery objectives, and breach-response records.
      whyItMatters: >-
        A fleet-level cloud platform can create correlated operational and safety exposure if access,
        software distribution, or telemetry controls fail.
      diligencePath: >-
        Commission architecture and security review, inspect incident and outage logs, test software
        rollback and key-management controls, and verify customer notification obligations.
      relatedQuestionRefs:
        - "QR003"
        - "QR004"
      relatedTableRefs:
        - "TR002"
