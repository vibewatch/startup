    notes: "Assessments use only the assigned public evidence; missing valuation and financial inputs are left unresolved rather than estimated."
    claimRefs: [CV005, CV008, CV009, CV010, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence, Interpretation, What would change the view]
    rows:
      - [Thesis, "250 million cumulative commercial miles as of October 2025, company-reported", "Suggests substantial real-world operating exposure.", "Independent fleet and mileage audit showing materially lower activity."]
      - [Thesis, "Huatai reported 7-15% lower total cost of ownership per kilometer", "Offers a customer-specific path to economic value.", "Cohort evidence showing savings do not persist across routes or customers."]
      - [Thesis, "More than 2,000 deployed trucks and 200 million commercial kilometers reported in December 2024", "Indicates commercialization beyond a small pilot.", "Deployment stagnation or low paid utilization."]
      - [Context, "$678 million reported funding; selected peers range from $165 million to $1.03 billion", "Shows a capital-intensive category but is not a valuation benchmark.", "Verified peer revenue, margins, and current transaction multiples."]
      - [Anti-thesis, "No current public valuation, audited revenue, margin, cash, burn, or runway", "Prevents a defensible price or return model.", "Audited financial package and current financing terms."]
      - [Anti-thesis, "Aggregators conflict on the latest transaction date and type", "Creates financing and exit-status ambiguity.", "Executed transaction documents and an updated cap table."]
    notes: "Funding totals are cumulative capital raised, not revenue, enterprise value, or cash available; operating metrics are company-issued unless explicitly attributed to Huatai."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV009, CV010, CV014, CV016]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Case, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Independent validation of growth, fleet utilization, customer savings, safety, and repeat deployments; financeable path to driverless operations.", "A premium could be considered only after audited revenue, margins, cash needs, dilution, and a credible exit multiple are available.", "Execution, regulation, capital intensity, and multiple compression.", "Rising paid utilization, repeat orders, improving unit economics, and non-punitive financing."]
      - [Base, "Commercial mileage and deployments continue, but economics and financial statements remain private.", "No numeric range; preserve option value through monitoring and data-room access rather than price-taking.", "Opaque burn, customer concentration, financing overhang, and slow autonomy progression.", "Steady deployments without sufficient disclosure to underwrite returns."]
      - [Bear, "Deployment stalls, savings fail independent verification, capital needs rise, or transaction terms impair common equity.", "Downside cannot be bounded publicly; require a reset price and seniority review before reconsideration.", "Down round, preference overhang, liquidity delay, regulatory friction, and commercialization failure.", "Lower utilization, lost anchor customers, delayed milestones, or punitive capital."]
    notes: "No scenario contains an invented valuation range or probability; each is a diligence gate because the assigned evidence lacks the required financial and capitalization inputs."
    claimRefs: [CV005, CV007, CV008, CV009, CV011, CV012, CV014, CV016]
