    claimRefs: [CV004, CV005, CV008, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price discipline dominates company quality
    body: >-
      Commercial evidence is strong enough to justify continued access and diligence, but not strong
      enough to infer an equity value. A favorable company view should not be converted into an
      investment recommendation until price, preferences, dilution, cash needs, and exit assumptions
      can be tested.
    claimRefs: [CV005, CV008, CV009, CV016]
