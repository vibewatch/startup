      - ["Closed-loop data and Freight Physical AI", "Autonomy R&D and fleet operations teams", "Company announced one billion commercial kilometers and a large scenario library in September 2026", "Freight-native world model, scenario intelligence, and operational intelligence", "Dataset governance, model evaluation, version history, reproducibility, and independent technical review"]
      - ["Operational Brain", "Fleet dispatcher and operator", "Announced as a cloud platform in the September 2026 release", "Aggregates vehicle risk and operating data for route, energy, cost, and efficiency decisions", "Production customer scope, integration interfaces, uptime, latency, and measurable incremental benefit"]
