    title: "Workflow, use case, and measurable evidence"
    columns: ["User job", "Current workflow", "Inceptio solution", "Reported benefit", "Limitation"]
    rows:
      - ["Long-haul line-haul movement", "Two-driver staffing on roughly 1,500-kilometer Huatai routes", "Hub-to-hub assisted autonomy in OEM-produced heavy trucks", "Company reports driver-to-truck ratio reduced from 2:1 to 1:1", "Single company-published customer example; route and comparison design are not disclosed"]
      - ["Fuel and total-cost control", "Human driving under route, payload, traffic, and schedule constraints", "Fuel-efficient planning/control and fleet optimization", "Huatai release reports 3-5 liters per 100 kilometers lower fuel use and 7%-15% lower TCO per kilometer", "No independent baseline, confidence interval, vehicle mix, or maintenance-cost reconciliation"]
      - ["Safe operation with a backup driver", "Driver monitors vehicle and takes over when requested", "Emergency braking, driver monitoring, multimodal alerts, fallback, and redundant controls", "Company describes safety, comfort, and attendance improvements", "No public disengagement, incident, near-miss, false-alert, or takeover-time series"]
      - ["L4 freight expansion", "Regional testing and pilot operations", "Heavy-truck demonstrations with JD Logistics and light-truck pilot activity with SF Express", "Company reports testing permits and commercial-cargo demonstrations", "Permits and pilots do not establish scaled driverless production readiness"]
      - ["Fleet-wide operations management", "Dispatchers combine route, cost, energy, and risk information", "Operational Brain aggregates vehicle signals into fleet intelligence", "Company claims support for risk warning, routing, energy, cost, and efficiency", "No public API, integration guide, SLA, production-customer count, or controlled outcome study"]
    notes: "Benefits are company-reported and retain their stated route context and ranges; unavailable denominators and study-design details remain explicit limitations."
    claimRefs: [CE004, CE005, CE010, CE011, CE012]
  - id: "TE003"
    title: "Technology and operating architecture"
    columns: ["Layer or process", "Role", "Named components", "Key dependency", "Primary risk"]
    rows:
      - ["Fleet operations", "Turn truck-level signals into operating decisions", "Operational Brain, route planning, risk warnings, energy and cost management", "Reliable vehicle-cloud connectivity and customer-system integration", "No public uptime, latency, API, or decision-quality evidence"]
      - ["Data and model development", "Identify scenarios, train/test models, and close the iteration loop", "Freight World Model, ROSL scenario library, data factory, simulation, shadow-mode data capture", "Representative, governed, high-quality operating data", "Company-reported scale does not establish coverage, labeling quality, or model generalization"]
      - ["Autonomy software", "Perceive, localize, plan, control, and optimize fuel use", "Perception, localization, planning/control, FEAD, system middleware", "Sensor quality, map freshness, compute limits, and validated operational domain", "Extreme scenarios and deep-learning uncertainty remain acknowledged industry constraints"]
      - ["Vehicle compute and hardware", "Run safety-critical autonomy functions", "Redundant ADCU, cameras, lidar, radar, gateway, antenna, in-cabin monitoring", "Automotive-grade suppliers, OEM validation, thermal and vibration durability", "No independent field-failure distribution or current component bill of materials"]
      - ["Execution and human interface", "Apply commands and coordinate fallback", "Drive-by-wire braking/steering/throttle/gear, visual/audio/tactile HMI", "Redundant actuators, driver readiness, clear takeover logic", "Fallback frequency, takeover performance, misuse, and alert fatigue are undisclosed"]
      - ["Safety and cybersecurity assurance", "Prevent, detect, test, and respond to failures and attacks", "ISO 26262/21448 methods, ISO/SAE 21434 process, SIL/HIL/DIL/LST/ORT, defense in depth", "Current certifications, test coverage, supplier controls, and incident response", "Company white paper is not a certification-registry record or independent safety case"]
    notes: "Architecture is reconstructed from Inceptio's white paper and September 2026 company announcement; component relationships are not independently audited."
    claimRefs: [CE002, CE008, CE009, CE010, CE012, CE013, CE014]
