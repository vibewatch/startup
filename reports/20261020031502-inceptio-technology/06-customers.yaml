      - [Huatai Logistics, "Contract logistics", "40 trucks on line-haul automotive-parts routes", "Production deployment", "Inceptio reports 7-15% lower TCO per kilometer", "Company-issued case study; no contract term or customer-authored proof"]
      - [STO Express, "Express delivery", "Autonomous heavy-duty truck delivery", "Named delivery", "Included among 2024 major deliveries", "Volume, active use, and outcomes not disclosed"]
      - [YTO Express, "Express delivery", "Autonomous heavy-duty truck delivery", "Named delivery", "Included among 2024 major deliveries", "Volume, active use, and outcomes not disclosed"]
      - [Yunyi Transport, "Logistics", "Autonomous heavy-duty truck delivery", "Named delivery", "Included among 2024 major deliveries", "Volume, active use, and outcomes not disclosed"]
      - [JD Logistics, "Integrated logistics", "L4 heavy-duty trucks carrying commercial cargo on open roads", "Demonstration", "Commercial cargo was part of the demonstration", "Paid scale, duration, and production conversion undisclosed"]
      - [SF Express, "Express and regional delivery", "Driverless light-duty trucks on public roads", "Commercial pilot", "Extends the system into shorter and more complex routes", "Pilot fleet size and conversion criteria undisclosed"]
    notes: >-
      Partial public enumeration through the run date; stage labels follow source wording
      and do not imply that every named delivery remains active or revenue-generating.
    enumerationScope:
      coverage: partial
      basis: >-
        Named customers and partners found in the assigned public source pool through
        October 20, 2026; the complete customer population is not publicly disclosed.
    claimRefs: [CU008, CU009, CU010, CU011, CU013, CU014]
figures:
  - id: FU001
    title: Publicly evidenced customer adoption journey
    type: journey-map
    summary: >-
      The visible path runs from OEM-integrated supply through fleet deployment and
      operational proof, while renewal and revenue expansion remain unobserved.
    data:
      nodes:
        - id: integration
          label: OEM integration
          detail: Inceptio systems are pre-loaded into commercial truck platforms.
          touchpoints:
            - OEM product configuration
            - Fleet specification
        - id: cooperation
          label: Commercial inquiry
          detail: Official sites route prospective partners to dedicated cooperation contacts.
          touchpoints:
            - Industrial cooperation email
            - Commercial cooperation email
        - id: procurement
          label: Fleet procurement
          detail: Express and logistics operators order or specify equipped trucks.
          touchpoints:
            - Standard-equipment specification
            - Named fleet delivery
        - id: deployment
          label: Production deployment
          detail: Trucks operate on line-haul routes in multiple freight categories.
          touchpoints:
            - Express delivery
            - Contract logistics
            - Specialist freight
        - id: operating-proof
          label: Operating proof
          detail: Mileage, truck counts, and case-study economics demonstrate use but not retention.
          touchpoints:
            - Commercial kilometers
            - Route economics
            - Safety and efficiency claims
        - id: expansion
          label: Adjacent-scenario expansion
          detail: JD and SF programs extend evidence into L4 and regional-delivery pilots.
          touchpoints:
            - Commercial-cargo demonstration
            - Public-road light-truck pilot
    approximationNotes: >-
      The sequence reflects the public evidence path, not measured conversion rates;
      no retained source discloses stage conversion, renewal, or expansion revenue.
    claimRefs: [CU005, CU007, CU009, CU010, CU013, CU014, CU015]
callouts:
  - calloutType: risk
    title: Deployment proof is not retention proof
    body: >-
      More than 1 billion reported commercial kilometers and multiple named fleets
      demonstrate adoption, but public evidence does not disclose churn, renewals,
      contract length, repeat orders, or customer revenue concentration.
    claimRefs: [CU001, CU008, CU009, CU013, CU014]
