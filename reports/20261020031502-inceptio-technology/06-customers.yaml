      - ["ZTO delivery", "400 trucks", "2024", "Inceptio release and FleetPoint syndication", Medium, "Large named production delivery", "No follow-on order or active-use disclosure"]
      - ["Huatai fleet addition", "40 trucks", "By May 2024", "Inceptio customer case study", Medium, "Concrete contract-logistics deployment", "No starting fleet, contract value, or renewal data"]
      - ["Commercial autonomous-driving mileage", ">1 billion km", "September 8, 2026", "Inceptio release and derivative news coverage", Medium, "Fivefold increase from the disclosed 2024 milestone", "No audited methodology or revenue linkage"]
      - ["Express-fleet procurement behavior", "Several leading companies", "2026", "Inceptio company release", Low, "Suggests autonomy is entering standard specifications", "Companies, order volumes, and conversion rate not disclosed"]
      - ["Team growth", "-1.7% year over year", "Accessed October 20, 2026", "Dealroom market-data profile", Medium, "Mild counter-signal to a simple growth narrative", "Not a customer, revenue, or retention measure"]
    notes: >-
      Values preserve each source's metric and period; milestones are company-reported,
      and no retained source supplies audited customer cohorts or recurring-revenue data.
    claimRefs: [CU001, CU005, CU006, CU007, CU008, CU009, CU016]
