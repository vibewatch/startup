evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, cash balance, burn, debt, and runway.
    whyItMatters: Deployment scale cannot establish economic sustainability or financing need.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, bank statements, and the current operating
      plan.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO006
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, executive roster, succession plan, cap table, and investor control rights.
    whyItMatters: Founder dependence and investor influence cannot be assessed from named funding participants alone.
    diligencePath: Obtain corporate registry extracts, board minutes, organization chart, cap table, and financing documents.
    relatedQuestionRefs:
      - QO002
      - QO005
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: stage
    missingEvidence: Primary documentation resolving Caplight's 2025 IPO entry against current Series B classifications.
    whyItMatters: Listing status changes capitalization, disclosure expectations, liquidity, and valuation analysis.
    diligencePath: >-
      Confirm legal entity and listing status with management, regulators, exchange records, and current shareholder
      documents.
    relatedQuestionRefs:
      - QO005
      - QO006
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: Complete investor ownership, board representation, OEM contracts, and customer contract economics.
    whyItMatters: The public map cannot quantify control, concentration, exclusivity, or related-party dependencies.
    diligencePath: Request the fully diluted cap table, board schedule, material contracts, and customer-level revenue bridge.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: Independent legal, regulatory, safety-incident, outage, and enforcement records covering the operating fleet.
    whyItMatters: >-
      The assigned pool did not produce sufficient independent adverse evidence, so absence of a cited incident cannot
      establish absence of incidents.
    diligencePath: Run jurisdiction-specific court, regulator, transport-safety, insurance-claims, and customer-reference checks.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: commercial-scale
    missingEvidence: Independent verification of mileage, active paid fleet, highway coverage, and market-share denominators.
    whyItMatters: Company-originated scale metrics may not map directly to active revenue-generating deployments.
    diligencePath: Reconcile telemetry, OEM shipment records, customer invoices, insurer records, and a defined market-share dataset.
    relatedQuestionRefs:
      - QO004
      - QO009
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current independently defined market size with geography, autonomy level, revenue category, methodology, and
      base year.
    whyItMatters: Without a consistent denominator, TAM, SAM, growth, and valuation multiples cannot be compared reliably.
    diligencePath: >-
      Obtain current analyst methodology and triangulate it with Chinese heavy-truck sales, eligible line-haul routes,
      system price, and recurring service revenue.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      Independent shipment, installed-base, or revenue data supporting Inceptio's claimed share of China's
      autonomous-trucking market.
    whyItMatters: >-
      The share claim is a central SOM and competitive-position input but has no disclosed denominator in the retained
      evidence.
    diligencePath: >-
      Reconcile OEM production records, fleet registrations, paid deployments, and competitor shipments using a
      consistent autonomy-level definition.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Buyer-side procurement records, contract prices, renewal behavior, route-level utilization, and independently
      measured savings.
    whyItMatters: >-
      Company-issued case evidence does not establish repeatable ROI, budget ownership, or switching behavior across
      customer segments.
    diligencePath: >-
      Interview fleet procurement and operations leaders and review invoices, route cohorts, maintenance records, and
      before-versus-after cost data.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable contracts showing vehicle price, software and service fees, usage units, discounts, support, insurance,
      and minimum commitments for Inceptio and alternatives.
    whyItMatters: >-
      Without normalized realized pricing, the buyer cannot compare route-level total cost or determine whether claimed
      operating savings produce attractive payback.
    diligencePath: >-
      Obtain redacted proposals and executed contracts for matched truck models, routes, autonomy levels, volumes, and
      service scopes, then reconcile them with invoices.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      Independent, methodologically comparable evidence for market share, safety incidents, utilization, uptime, cost
      per kilometer, and driverless maturity across Inceptio and named peers.
    whyItMatters: >-
      Most retained operating metrics originate with Inceptio, so they cannot establish relative performance or a
      durable competitive lead.
    diligencePath: >-
      Request insurer loss runs, regulator records, customer fleet extracts, route-matched benchmark studies, and peer
      disclosures with common denominators and periods.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited income statements, balance sheets, cash-flow statements, monthly burn, current cash, restricted cash,
      debt, project-finance obligations, and management runway plan.
    whyItMatters: >-
      Funding raised cannot establish liquidity, and operating mileage cannot establish profitability or the timing and
      size of the next financing.
    diligencePath: >-
      Obtain audited statements, current management accounts, bank and debt schedules, a 24-month operating plan, and
      monthly budget-to-actual cash reconciliation.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-model
    missingEvidence: >-
      Contract-level pricing, billing unit, discounts, revenue recognition, recurring versus non-recurring mix, customer
      concentration, renewals, and revenue by offering.
    whyItMatters: >-
      Public deployment and customer savings do not reveal the amount, durability, or quality of revenue captured by
      Inceptio.
    diligencePath: >-
      Review the contract register, invoices, deferred-revenue roll-forward, top-customer cohorts, renewal history, and
      recognized revenue reconciliation.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Independent verification of labor, fuel, utilization, safety-driver, maintenance, and total-cost outcomes across
      comparable routes and customer cohorts.
    whyItMatters: >-
      Current savings evidence is company-issued and cannot by itself establish sustained buyer ROI, pricing power, or
      repeatable unit economics.
    diligencePath: >-
      Obtain raw telematics and invoices for matched routes, interview fleet finance teams, and commission an
      independent cohort analysis.
    relatedQuestionRefs:
      - QI003
      - QI007
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: safety-assurance
    missingEvidence: >-
      Independent safety-case review, current certification-registry records, disengagements, incidents, near misses,
      fallback events, and takeover-time distributions by operational domain.
    whyItMatters: Company-described processes do not establish field safety performance or continuing certification coverage.
    diligencePath: >-
      Obtain certification numbers and scopes, auditor reports, insurer loss studies, regulator records, and route-level
      safety logs under NDA.
    relatedQuestionRefs:
      - QE006
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public repository, package registry, technical changelog, API documentation, engineer talk, practitioner forum,
      or comparable developer-community signal.
    whyItMatters: >-
      Without a developer surface or practitioner proxy, software cadence, integration burden, tooling maturity, and
      external technical scrutiny cannot be assessed.
    diligencePath: >-
      Request private repository and release-history access, architecture review sessions, dependency inventories, and
      integration references from OEM engineering teams.
    relatedQuestionRefs:
      - QE002
      - QE003
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-outcomes
    missingEvidence: >-
      Controlled route-level evidence for fuel, labor, uptime, maintenance, insurance, and total-cost outcomes with
      baselines and denominators.
    whyItMatters: >-
      Company-published ranges cannot distinguish product impact from route, payload, vehicle, driver, or
      operating-policy effects.
    diligencePath: >-
      Reconcile raw telematics and invoices for matched autonomous and manual fleets across customers, routes, seasons,
      and truck models.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: roadmap
    missingEvidence: >-
      Versioned product roadmap, operational-design-domain boundaries, permit scopes, pilot-to-production gates, status
      history, and service-level commitments.
    whyItMatters: >-
      Testing permits and announced pilots do not establish driverless production readiness, reliability, or
      supportability.
    diligencePath: >-
      Review permit documents, release criteria, vehicle and software version maps, uptime logs, incident-response
      records, and signed pilot-to-production milestones.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Customer cohorts showing GRR, NRR, churn, renewal rates, repeat orders, contract length, and active utilization by
      deployment vintage.
    whyItMatters: Delivered trucks and accumulated mileage do not establish recurring revenue or durable customer behavior.
    diligencePath: >-
      Obtain anonymized contract and invoice cohorts, reconcile them to active-vehicle telemetry, and conduct reference
      calls with renewed and non-renewed customers.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue, gross profit, deployed trucks, and commercial mileage attributable to the top one, five, and ten
      customers.
    whyItMatters: Named large fleets could create bargaining power and renewal risk even when aggregate deployment metrics grow.
    diligencePath: >-
      Request a customer concentration schedule tied to audited revenue and vehicle telemetry, including related-party
      and channel-attributed sales.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer
    missingEvidence: >-
