    approximationNotes: >-
      Ordinal x score: 1 below $300M, 2 from $300M through $699M, 3 at or above $700M of Tracxn-reported cumulative funding. Ordinal y score: 1 profile listing only, 2 product or operating-model description, 3 retained evidence of production commercial operations. Scores measure this evidence set, not quality or market rank.
    claimRefs: [CP015, CP016]
callouts:
  - calloutType: strength
    title: Deployment creates a potentially compounding data advantage
    body: >-
      Production integration and repeated commercial operation can create a feedback loop that is harder to replicate than a standalone autonomy demonstration, although dataset quality and incremental model benefit remain unverified.
    claimRefs: [CP004, CP005, CP006, CP013]
  - calloutType: risk
    title: Public pricing and independent performance proof are missing
    body: >-
      Buyers cannot yet normalize total cost, safety, uptime, or route economics across alternatives from the assigned evidence, so apparent leadership should not be converted into a procurement or valuation premium without diligence.
    claimRefs: [CP012, CP015, CP016]
