      - Status quo or internal-build alternative
      - Diligence implication
    rows:
      - ["Factory vehicle integration", "Company says L3 trucks have been series-produced with OEM partners since 2021", "Aurora and PlusAI are described as integration-oriented; detailed comparability is unknown", "Buy OEM driver-assistance packages", "Verify compatible models, exclusivity, upgrade rights, and integration cost"]
      - ["Commercial operating scale", "Company reported more than 2,000 trucks and 200M km by Dec. 2024, then 1B km in Sep. 2026", "Unknown from assigned evidence", "Continue driver-operated line-haul fleets", "Reconcile mileage basis, active fleet, autonomy level, and paid utilization"]
      - ["Freight-network breadth", "Company says coverage spans line-haul sectors and approximately 97% of China's highway network", "Gatik is described as middle-mile; other route coverage is unknown", "Deploy route-specific telematics and dispatch optimization", "Test actual route availability, edge cases, and geographic permits"]
      - ["Fleet-level operations", "Operational Brain is claimed to support risk, energy, route, cost, and efficiency management", "Einride offers a broader freight model; peer feature detail is unknown", "Use third-party transportation-management and telematics software", "Determine which functions are bundled, interoperable, and contractually supported"]
      - ["Safety and insurance", "Company and trade coverage cite CPIC studies and a tailored-insurance collaboration", "Unknown from assigned evidence", "Use conventional insurance and driver-safety programs", "Obtain study methods, claims history, policy terms, and independent validation"]
      - ["Driverless readiness", "L4 permits, demonstrations, and pilots are reported; scaled fleet is described as L2+/L3", "Several peers target self-driving trucks, but maturity is unknown here", "Retain human drivers while adding assistance", "Separate permitted tests from unsupervised paid operations"]
    notes: >-
      "Unknown" means the assigned prefetched evidence does not support a comparison; company-reported capabilities are not treated as independent benchmarks.
    claimRefs: [CP004, CP005, CP006, CP008, CP011, CP013, CP016]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Alternative
      - Likely procurement object
      - Public price or unit
      - Included capabilities supported here
      - Commercial unknowns
      - Buyer implication
    rows:
      - [Inceptio, "Factory-integrated truck system and potentially TaaS or fleet software", "Not disclosed", "Autonomous-driving stack, OTA updates, and claimed fleet intelligence", "Vehicle/software split, subscription, usage fees, support, insurance, minimums", "Request route-level total-cost and contract waterfall"]
      - ["Factory-integrated autonomy peer", "Truck plus embedded autonomy or OEM integration", "Not disclosed", "Broad integration model only", "Hardware ownership, software license, update and warranty economics", "Compare on identical vehicle, route, autonomy, and service assumptions"]
      - ["Managed autonomous-freight provider", "Transport capacity or managed service", "Not disclosed", "Service model inferred from peer category", "Per-mile rate, utilization guarantees, fuel, remote operations, exception handling", "Compare service price with fully loaded carrier cost"]
      - ["Status quo or internal build", "Driver-operated fleet plus purchased telematics and assistance", "Not disclosed in retained evidence", "Existing fleet control and modular tooling", "Integration labor, insurance, driver availability, and foregone autonomy savings", "Use as the base case rather than assuming autonomous adoption"]
    notes: >-
      The retained pool contains no comparable list or realized pricing. Procurement objects are analytical categories, not quoted offers, and every undisclosed field requires buyer-side contract evidence.
    claimRefs: [CP010, CP011, CP012, CP014]
