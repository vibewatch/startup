      - [Gatik, "Autonomous middle-mile trucking operator", "$500M", "Middle-mile logistics", "Narrower operating-domain service model", "Different route profile from Inceptio's core line-haul deployment"]
      - [PlusAI, "Autonomous-driving technology for factory-built trucks", "$720M", "Factory-integrated trucking", "Closest retained-evidence analogue to OEM integration", "Assigned evidence contains no deployment, economics, or China-specific comparison"]
      - [Waabi, "Physical-AI platform for autonomous trucks and robotaxis", "$1.03B", "Trucks and robotaxis", "High reported funding and AI-platform positioning", "Assigned evidence contains only a profile description, not operating proof"]
