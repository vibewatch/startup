      - number: '8.2'
        title: Valuation Framework and Comparable Analysis
        blocks:
          - type: paragraph
            body: >-
              Valuation of Platform Science is constrained by the company's private status and non-disclosure of
              financial metrics. The framework applied relies on fleet count-based ARR estimation, comparable
              public-market multiples anchored on Samsara, private-market M&A comparables from Motive, Spireon, and
              Fleet Complete, and implied valuation inference from the April 2024 growth round.


              ARR estimation: With approximately 53,500 named commercial vehicles under management as of mid-2025 and
              industry-standard per-truck per-month SaaS pricing of $10-20, ARR is estimated at $100-250 million. The
              midpoint of $175 million is used as the base-case assumption, with acknowledgment that OEM-negotiated
              pricing may differ materially from open-market rates.


              Public comparable — Samsara (IOT): Fiscal Q4 FY2025 ARR of approximately $937 million, trading at 15-20x
              ARR on public markets. Applying a 25-35% private-market discount for Platform Science's smaller scale and
              financial opacity yields an implied multiple of 10-15x ARR, consistent with a $1.5-3.75 billion enterprise
              value range.


              Private-market comparables: Motive's $2.2 billion raise at 8-12x estimated ARR, Spireon's $500 million
              acquisition at 4-6x revenue, and Geotab's analyst-estimated $4-6 billion private valuation for a business
              with 3.5 million connected vehicles all anchor the range. Platform Science's OEM-native moat warrants a
              premium to Spireon and Fleet Complete but likely trades below Samsara's public multiple until
              IPO-readiness is demonstrated.
            claimRefs:
              - CV006
              - CV007
              - CV008
