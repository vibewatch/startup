  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Peer Classification
        blocks:
          - type: paragraph
            body: >-
              The North American fleet telematics competitive landscape divides into four structural tiers based on
              distribution model and product scope. Tier 1 is OEM-native fleet OS: Platform Science occupies this tier
              alone, with factory-certified integrations at Daimler Truck NA, International (Navistar), and PACCAR
              covering approximately 80% of North American Class 8 production. No other independent software vendor
              holds comparable OEM factory-install agreements across multiple Class 8 OEMs simultaneously.


              Tier 2 is enterprise pure-play aftermarket: Samsara (NYSE: IOT, ~$1.47B ARR), Motive (~$501M ARR), and
              Geotab (private, 4M+ connected vehicles) compete via direct or reseller sales with aftermarket hardware.
              All three offer broad product suites (ELD, video safety, GPS, analytics) and compete for the same large
              enterprise fleet customers Platform Science targets. Samsara and Motive are the primary growth threats
              given their superior AI capabilities and aggressive enterprise upsell motion.


              Tier 3 is telco/conglomerate-backed: Verizon Connect (Verizon division) and Zonar Systems (Continental AG
              subsidiary) compete with legacy products and telco/OEM parent backing. Verizon Connect's G2 score of 39.6
              versus Samsara's 99 reflects significant product experience gaps; Zonar is narrowly focused on compliance
              and was displaced by Platform Science at Daimler. Tier 4 is legacy platforms: Omnitracs (Solera), Trimble
              Transportation (now integrated into Platform Science), and fleet-card players. Platform Science's February
              2025 acquisition of Trimble's telematics segment added 85,000+ enterprise customers and video safety
              capabilities, absorbing Tier 4 directly.
