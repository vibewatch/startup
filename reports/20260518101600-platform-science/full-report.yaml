      - number: '8.4'
        title: Recommendation, Diligence Asks, and Thesis Monitors
        blocks:
          - type: paragraph
            body: >-
              Recommendation: Qualified Positive. Platform Science presents a compelling investment profile anchored by
              a structurally differentiated OEM distribution moat, large-enterprise customer proof at scale, and a large
              addressable market with regulatory tailwinds. The recommendation is qualified rather than
              conviction-positive due to three material constraints: complete absence of financial disclosure, OEM
              channel concentration in three partners, and driver adoption friction that could impair NRR. Conviction
              investment requires satisfying the pre-conditions outlined in the diligence asks table.


              Entry discipline: At implied entry valuation of $1.2-1.8 billion, the base-case return of 2-4x over 3-4
              years is attractive but not exceptional. The bull-case return of 5-8x justifies conviction participation
              if financial diligence confirms ARR above $120 million with NRR above 110% and gross margin above 68%.
              Valuation discipline requires a price ceiling of $2.0 billion for initial entry.


              Exit readiness: Platform Science is not currently IPO-ready given financial opacity, but is positioned for
              a 2027-2029 IPO or strategic acquisition window. The most probable near-term exit is OEM strategic
              acquisition, most likely by PACCAR or Daimler Truck seeking full control of embedded platform economics as
              connected truck fleets become central to OEM service revenue strategies.
