      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Cases'
        blocks:
          - type: paragraph
            body: >-
              Three scenarios are constructed based on ARR growth trajectory, exit multiple compression or expansion,
              and structural thesis integrity.


              Bull case ($8-12 billion exit, 2027-2028): Requires ARR of $400-500 million with 40-50% sustained growth,
              OEM partnerships scaling to full production deployment, successful international expansion via Daimler
              Truck and Volvo global networks, and exit at 18-22x ARR consistent with Samsara's IPO-era valuation.
              Probability signals include OEM contract renewals at improved economics, named customer fleet expansion
              announcements, and international deployment milestones.


              Base case ($3-5.6 billion exit, 2027-2028): ARR of $250-350 million with growth decelerating from 40% to
              25% by 2027, retention of all major OEM partnerships, North American fleet focus, and exit at 12-16x ARR.
              Probability signal is continuation of current customer expansion rate and absence of competitive losses in
              major fleet tender events.


              Bear case ($0.6-1.5 billion exit, 2027-2028): Triggered by OEM contract renegotiation, Samsara or Motive
              gaining OEM-embedded distribution with a competing OEM partner, ARR growth decelerating to 10-15%, and
              multiple compression to 6-8x in a fleet-tech sector selloff. This scenario implies exit at or below
              current implied entry valuation, eliminating investor returns.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV024
              - CV033
              - CV034
