            body: >-
              Samsara is the most formidable platform-level competitor. As a public company (NYSE: IOT) with $1.47B ARR
              (FY2025, +33% YoY), 40,000+ customers, and 2M+ connected devices, Samsara outscales Platform Science on
              installed base and R&D spend. Its open Connected Operations Cloud spans cameras, telematics, ELD, routing,
              maintenance, and equipment tracking. Samsara's enterprise customers (>$100K ARR accounts) represented more
              than 51% of ARR as of FY2025, indicating successful upmarket migration. Samsara does not hold OEM
              factory-install agreements with Daimler, PACCAR, or Navistar; all deployments require aftermarket hardware
              installation.


              Motive (formerly KeepTruckin) holds ~$501M ARR (September 2025, +27% YoY) and 100,000+ customers skewed
              toward SMB trucking and construction. Its AI-first positioning — AI dashcam, driver coaching, predictive
              maintenance — and the Motive Fleet Card (spend management) differentiate it from both Samsara and Platform
              Science. Enterprise net dollar retention of 126% signals strong expansion economics in large accounts.
              Motive last raised $200M at a $2.65B valuation in 2022; IPO preparation has been reported but not
              confirmed as of early 2026.


              Geotab (private, Oakville Ontario) operates 4M+ connected vehicles globally with 50,000+ enterprise and
              government customers across 160 countries. Its open telematics API (MyGeotab SDK) has attracted 1,200+
              resellers and 300+ marketplace integrations, creating the largest third-party ISV ecosystem in the
              industry. Geotab is particularly strong in government fleet and enterprise IT-intensive accounts where
              custom data integration requirements make its open API a structural requirement. Geotab has no OEM
              factory-install channel; its distribution is entirely reseller-driven.


              Verizon Connect and Zonar represent structurally weaker competitors. Verizon Connect's G2 rating (39.6)
              versus Samsara (99) reflects a significant product experience gap accumulated through underinvestment
              following Verizon's acquisitions of Fleetmatics and Telogis in 2016. Zonar (Continental AG) occupies a
