            body: >-
              Platform Science's deployment model is fundamentally different from SaaS software-only vendors. The
              primary path to market is OEM factory installation — DTNA (Freightliner, Western Star), PACCAR (Kenworth,
              Peterbilt), and Navistar (International) integrate the INSTINCT Gateway and Virtual Vehicle OS into new
              truck builds. This means that new Class 8 trucks from these OEMs ship with Platform Science pre-installed,
              creating an embedded distribution channel that bypasses direct fleet sales cycles for new-truck purchases.


              Integration capabilities extend beyond OEM partnerships. The Cummins Vehicle Health Intelligence (VHI)
              partnership (March 2025) connects the Virtual Vehicle platform to Cummins Connected Solutions® portal,
              delivering real-time engine diagnostics and OTA firmware updates via the platform. The Trucker Path
              marketplace integration (October 2025) adds truck-optimized navigation. Post-Trimble, Platform Science can
              offer Trimble's navigation, telematics, and fleet optimization products to the same fleet base.


              Key 2025–2026 roadmap milestones include: completion of the Trimble Transportation acquisition (February
              2025); Cummins VHI partnership go-live (March 2025); launch of the Trust Portal for security transparency
              (March 2026); Canadian ELD certification on CTP2 (May 2026); and the 2026 Connected Vehicle Lab (CVL)
              North American Roadshow, a mobile demonstration program designed to accelerate fleet adoption. The company
              has not published a formal product roadmap document, and post-Trimble integration plans for the combined
              product suite remain undisclosed.
