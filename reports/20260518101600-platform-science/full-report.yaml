  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Landscape
        blocks:
          - type: paragraph
            body: >-
              Platform Science's primary offering is the Virtual Vehicle® (VV) platform, a SaaS telematics IoT
              marketplace deployed as factory-installed software on commercial trucks built by Daimler Truck North
              America (DTNA), PACCAR (Kenworth/Peterbilt), and Navistar (International). Unlike aftermarket telematics
              providers that require physical hardware installation, Platform Science operates at the OEM level, meaning
              the platform is pre-activated via over-the-air (OTA) software provisioning on trucks that already include
              the company's INSTINCT Gateway hardware. This eliminates truck downtime for installation and allows fleet
              operators to activate and manage software applications remotely.


              The core product modules available on Virtual Vehicle span: (1) ELD/HOS compliance — FMCSA-certified in
              the United States and, as of May 2026, the first platform to achieve Canadian ELD certification on DTNA's
              CTP2 factory-installed telematics platform; (2) PS Visual Intelligence — an AI-driven video safety system
              with up to four recording channels (front, rear, side, in-cab) and automated detection of fatigue,
              distracted driving, and seatbelt violations; (3) Vehicle Health Intelligence — a Cummins partnership
              delivering remote diagnostics and OTA engine firmware updates; (4) Navigation and routing via marketplace
              partners including Trucker Path; and (5) an open application marketplace with SPEED-certified third-party
              apps.
