      - number: '7.4'
        title: Financial, People, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Platform Science is a private company that has not publicly disclosed revenue, EBITDA, burn rate, or cash
              runway. With approximately $309 million raised through April 2024 and an operating model that requires OEM
              hardware agreements, multi-year enterprise sales cycles, ongoing R&D, and post-Trimble integration
              investment, the capital intensity of the business is meaningful. Hardware capital requirements create
              upfront cost exposure: the INSTINCT Gateway and associated OEM certification investments are significant
              non-recurring costs per new OEM partner. Multi-year enterprise contracts may create revenue recognition
              timing mismatches; customer credit risk is low given blue-chip counterparties, but contract non-renewal at
              term creates revenue cliff exposure. People risk is concentrated in co-founders Jack Kennedy (CEO) and
              Jake Fields (CTO), whose deep OEM relationships and regulatory expertise are not easily replaceable.
              Post-Trimble integration adds management bandwidth risk: integrating 500+ Trimble transportation employees
              and global operations while maintaining customer experience and product velocity is a significant
              execution demand on the current leadership team. Engineering talent competition in San Diego (proximity to
              Qualcomm, ServiceNow, and tech adjacencies) and remote work competition from Bay Area hyperscalers creates
              ongoing hiring risk. Revenue model risk: Platform Science's SaaS-plus-marketplace model requires ongoing
              app developer and customer engagement; if the marketplace fails to achieve critical mass, the platform's
              defensibility against vertically integrated competitors diminishes.
