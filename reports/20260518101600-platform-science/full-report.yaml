  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Platform Science serves large North American enterprise fleets as its primary and essentially only
              addressable market segment. All publicly named production customers operate 200 or more trucks, and most
              are in the top-50 US truckload carrier tier. The platform's dependence on OEM-native hardware
              preinstallation (Daimler Truck North America, PACCAR, Navistar) structurally excludes owner-operators and
              fleets below ~200 vehicles — hardware cost ($400–600 per unit), multi-year enterprise contracts, and OEM
              channel requirements make small-fleet adoption economically non-viable. Publicly announced deployments
              span eight named carriers representing at least 28,000 trucks, with total fleet under management estimated
              by Platform Science at "hundreds of fleets" serving 53,500+ active drivers. Several anchor customers —
              C.R. England, Schneider, Ryder, Cummins — are also strategic investors, aligning capital and commercial
              relationships and reducing voluntary churn probability for these accounts. The Trimble global telematics
              acquisition (Feb 2025) added international fleet customers in Europe and Australia, beginning geographic
              diversification beyond US OEM-native deployment. The split between fleet manager satisfaction (4.6/5 per
              TruckingWay) and driver satisfaction (2.2/5) on the same platform signals a constituency tension that, if
              unaddressed, may constrain adoption at fleets where driver retention is a primary technology evaluation
              criterion.
