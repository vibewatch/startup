chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >
              Platform Science, incorporated in San Diego, California (9560 Towne Centre Dr, Suite 200, San Diego, CA
              92121), was founded in 2015 by Jack Kennedy and Jake Fields to transform commercial fleet management by
              replacing fragmented aftermarket hardware with an open, software-native connected vehicle platform. The
              company's flagship product, Virtual Vehicle®, is an open application platform that lives natively on the
              truck—pre-installed by OEM partners during production at the factory—enabling enterprise fleets to access
              telematics, compliance, safety, driver workflow, and third-party applications through a single unified
              interface without aftermarket hardware installation.

              Virtual Vehicle serves as the operating system for commercial trucking, connecting the truck's vehicle
              data (J1939/RP1226 signals), driver-facing Samsung Galaxy Tab Active tablets, cloud infrastructure, and a
              growing marketplace of telematics service providers (TSPs), third-party application developers, and OEM
              partners. The platform architecture unlocks over a trillion cumulative data points across more than 6
              billion miles logged and generates approximately 15 billion API calls annually, reflecting significant
              fleet penetration.

              The business model is primarily enterprise SaaS subscription-based, targeting large commercial trucking
              fleets (typically 200+ vehicles) that seek a centralized platform to manage devices, applications, and
              compliance workflows. Revenue is derived from per-vehicle monthly subscription fees for the platform and
              optional application marketplace participation fees. Platform Science markets exclusively through
              strategic OEM embedding and direct enterprise sales, positioning itself as distinct from point-solution
              telematics vendors by offering an "unlimited canvas" for fleet innovation. The company was named by Fast
              Company as one of the World's Most Innovative Companies (2022) and ranked #2 in the FreightTech 25 Awards
              for both 2022 and 2023, and has twice earned Forbes Best Startup Employer recognition (2024 and 2025).

              A key structural advantage is the OEM-native distribution model: fleets purchasing new trucks from Daimler
              (Freightliner/Western Star), Navistar (International Trucks), or PACCAR (Kenworth/Peterbilt) may receive
              Virtual Vehicle pre-installed, eliminating the traditional hardware-install barrier. This creates a
              compounding installed base as newer trucks enter fleets, and incentivizes TSPs and developers to build on
              the platform.

              However, the platform's positioning as enterprise-only, with opaque pricing ("Contact Vendor"), multi-year
              contract requirements, and complex configuration workflows, has been cited by independent reviewers as a
              significant limitation for smaller fleets and owner-operators, where the $600+ upfront hardware and
              onboarding complexity create friction.
