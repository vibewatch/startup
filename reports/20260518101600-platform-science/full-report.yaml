      - number: '1.3'
        title: Funding History, Valuation, and Investor Landscape
        blocks:
          - type: paragraph
            body: >
              Platform Science has raised approximately $293–$309 million in total capital since its founding, across
              multiple venture and strategic investment rounds. The most recent publicly confirmed round was a $125
              million growth capital injection announced on April 9, 2024—joining prior rounds that culminated in the
              Series C in 2022, when SoftBank Vision Fund 2 led a $115 million round valuing the company at $575 million
              post-money. Yahoo Finance and Telematics Wire cite the cumulative total at approximately $309 million
              through April 2024 (including prior undisclosed rounds from 2017 through early 2022), while Tracxn reports
              a slightly lower $293 million total.

              The April 2024 growth round was notable for the depth of strategic participation: it included Cummins
              (NYSE: CMI), PACCAR (NASDAQ:PCAR), C.R. England, Daimler Truck North America, RyderVentures (NYSE:R), and
              Schneider National (NYSE:SNDR) alongside new financial backers Activant Capital, BDT & MSD Partners, and
              Manhattan Venture Partners, with continued participation from 8VC, NewRoad Capital Partners, and Prologis
              Ventures. The presence of major truck OEMs (Daimler, PACCAR) and large fleet operators (Schneider, Ryder,
              C.R. England) as investors demonstrates the strategic alignment between Platform Science and the incumbent
              logistics industry.

              Platform Science has not reported a post-2024 round valuation, so the last confirmed post-money valuation
              remains the April 2022 Series C figure of $575 million. Given the Trimble acquisition in February 2025
              (terms undisclosed), the total enterprise value implied has likely increased materially, but no updated
              third-party valuation or IPO disclosure has confirmed a current figure. Some market aggregators (Tracxn)
              conceal the current valuation behind a paywall, and PitchBook similarly masks it.

              The investor base is structured with dual-track capital: financial VCs providing growth runway, and
              strategic OEM/fleet operators aligning commercial interests. This structure creates both alignment
              benefits (customers as investors) and governance risk (potential conflicts of interest between fleet
              investor-customers and independent fleet sales).
