      - number: '3.3'
        title: Pricing, Distribution, and Channel Dynamics
        blocks:
          - type: paragraph
            body: >-
              Fleet telematics pricing is uniformly structured as per-vehicle, per-month SaaS with 12–36 month
              contracts; hardware costs are either bundled or charged separately. Enterprise pricing for major platforms
              runs $45–100+ per vehicle per month, with variation driven by product tier, fleet size, and contract
              duration. Samsara's enterprise pricing (reported as $50–75/vehicle/month) includes hardware amortization;
              Motive ($45–70) is positioned slightly below on price but comparable on features. Platform Science's
              enterprise pricing ($45–85/vehicle/month) is competitive with pure-play aftermarket peers, with the
              differentiation being factory delivery eliminating hardware installation cost and delay.


              Geotab's reseller channel creates pricing opacity — its 1,200+ resellers set their own margin, leading to
              a wide range of $15–50/vehicle/month depending on reseller and bundle. This variability makes Geotab
              structurally disadvantaged in competitive RFPs where fleet buyers require standardized per-seat pricing.
              Verizon Connect benefits from telco bundle pricing (connectivity + fleet software), appealing to smaller
              fleets that want a single invoice but less competitive in pure-ROI evaluation.


              Distribution channel is the deepest structural differentiator. Platform Science's OEM-certified factory
              distribution compresses the sales cycle to zero for new truck buyers — Virtual Vehicle arrives
              pre-installed, eliminating the 6–12 weeks typically required for aftermarket hardware procurement,
              installation scheduling, and MDM provisioning. Samsara and Motive invest heavily in direct enterprise
              sales; Samsara's NPS-driven land-and-expand motion and Motive's industry-specific pricing for trucking are
              their primary GTM levers. Geotab relies on its reseller network but has begun building a direct enterprise
              sales motion for accounts above $500K ARR.
