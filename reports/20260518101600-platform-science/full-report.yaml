  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Market Context
        blocks:
          - type: paragraph
            body: >-
              Platform Science occupies a structurally differentiated position in fleet management SaaS by shipping its
              platform pre-installed in new heavy-duty trucks produced by PACCAR, Daimler Truck, and Volvo Group,
              collectively representing over 70% of North American heavy-duty truck production. This OEM-native approach
              eliminates aftermarket installation costs, reduces fleet operator friction, and embeds Platform Science in
              the asset purchase decision rather than competing for attention post-sale.


              The core investment thesis rests on three pillars. First, OEM channel distribution creates compounding
              reach: each annual cohort of 200,000+ new North American heavy-duty trucks represents potential new
              connected vehicles. Second, enterprise switching costs are high due to ELD recertification, data
              migration, and driver retraining, creating durable retention once a fleet standardizes on the platform.
              Third, the global fleet management software market is projected to expand from $25 billion in 2025 to over
              $45 billion by 2030, providing substantial headroom for a focused enterprise-and-large-fleet player.


              The anti-thesis centers on financial opacity, channel concentration, and competitive pressure. Platform
              Science does not disclose revenue or ARR, creating material valuation uncertainty. More than 70% of
              embedded fleet reach flows through three OEM partnerships; loss of any single agreement would materially
              impair growth trajectory. Samsara's AI-powered suite and Motive's broad SMB penetration represent credible
              competitive threats in open-market segments where OEM-channel leverage is lower. Fleet management SaaS
              multiples compressed 30-40% between 2022 and 2024, and a further contraction cycle could erode the return
              case.
            claimRefs:
              - CV004
              - CV005
              - CV013
              - CV017
              - CV021
              - CV022
              - CV023
              - CV027
              - CV028
              - CV037
