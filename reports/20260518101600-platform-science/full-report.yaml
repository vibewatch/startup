      - number: '7.2'
        title: Operational, Supply Chain, and Cybersecurity Risk
        blocks:
          - type: paragraph
            body: >-
              Platform Science's operational risk profile is shaped by hardware supply chain concentration, cloud
              infrastructure dependency, post-Trimble integration complexity, and the cybersecurity attack surface of a
              telematics platform embedded in 53,500+ commercial vehicles. The INSTINCT Gateway hardware — the core IoT
              device pre-installed by OEMs — uses an NXP ARM dual-core processor. NXP's automotive semiconductor supply
              was meaningfully constrained during the 2020–2023 semiconductor shortage; a recurrence would delay OEM
              truck production and thereby impair new Platform Science deployments. The Samsung Galaxy Tab Active3 is
              the standard driver-facing display; Samsung's product discontinuation or component shortages could force a
              hardware platform migration across existing and new fleets. Cloud infrastructure dependency (assumed
              AWS/GCP given San Diego enterprise stack norms) creates availability risk: the ELD mandate requires
              near-continuous data synchronization for FMCSA compliance; outages lasting more than the FMCSA's
              7-consecutive-day offline tolerance could generate driver log exceptions and fleet compliance penalties.
              The Trimble acquisition (Feb 2025) adds integration execution risk: merging engineering teams, product
              roadmaps, data models, customer success functions, and billing systems across a global telematics platform
              is inherently complex. Post-acquisition cultural and technical integration is a 12-36 month execution risk
              window. Cybersecurity is a structural surface-area risk: Platform Science's platform sits on OEM vehicle
              data buses and has bidirectional remote access to commercial vehicles; a successful cyber intrusion could
              impact vehicle controls, driver safety, or mass ELD data corruption — all with regulatory and liability
              consequences.
