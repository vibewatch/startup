            body: >-
              Platform Science generates revenue across three primary streams: OEM-embedded subscription fees,
              marketplace take rate on third-party applications, and professional services for fleet integration. The
              core Virtual Vehicle platform charges per-vehicle per-month subscription fees to fleet operators; specific
              rates are not publicly disclosed, but industry benchmarks for enterprise fleet management software range
              $27-50/vehicle/month. The marketplace model, hosting 400+ applications, earns a platform take rate
              estimated at 20-25% on in-app transactions. Following the February 2025 acquisition of Trimble
              Transportation, Platform Science absorbed an established contracted revenue base spanning 85K+ customers
              across North American trucking and logistics. This acquisition materially changed the revenue profile,
              adding legacy subscription contracts at potentially lower per-vehicle ASPs than native Virtual Vehicle
              agreements. Professional services revenue derives from OEM integration projects and fleet onboarding. The
              OEM-embedded distribution model fundamentally lowers customer acquisition cost by eliminating field
              hardware installation; instead, telematics is factory-installed, and subscription activation is bundled
              into vehicle procurement cycles. This structural advantage creates switching cost lock-in from day one of
              vehicle ownership.
