  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Platform Science operates at the intersection of federal transportation safety regulation, emerging data
              privacy law, and evolving cybersecurity mandates for connected vehicles — creating a dense regulatory
              surface area. The Electronic Logging Device (ELD) mandate (FMCSA 49 CFR Part 395) is Platform Science's
              primary compliance anchor: Platform Science's ELD product is FMCSA-registered, but must maintain technical
              specification compliance through ongoing FMCSA re-certification cycles. Any FMCSA finding of
              non-compliance — whether through software update, third-party audit, or enforcement action — could result
              in decertification that would force customer fleets to switch ELD providers within the FMCSA's remediation
              window, creating acute churn risk. The company expanded into Canada in May 2026, deploying the first
              Canadian ELD certified under Transport Canada's ELD Technical Standard (TP15205) on a Daimler CTP2 truck —
              a market with different certification requirements than the US. Data privacy risk is material and growing:
              Platform Science collects driver location, biometric (fatigue monitoring), vehicle telemetry, and
              behavioral data at scale. California's CCPA/CPRA (as the company's home state), plus international GDPR
              exposure for Trimble-acquired EU customers, creates a multi-jurisdictional compliance burden. The FTC's
              expanded data security enforcement posture and proposed Connected Vehicle Privacy Rule from NHTSA add
              further regulatory layers. IP risk is moderate but real: Platform Science holds a growing patent portfolio
              in vehicle application platforms, but direct competitors (Samsara, Motive) also have significant patent
              estates, creating potential cross-licensing or infringement litigation exposure. No known active
              litigation has been publicly reported as of May 2026, but absence of reporting should not be treated as
              confirmed absence of risk in a private company.
            claimRefs:
              - CR001
              - CR002
