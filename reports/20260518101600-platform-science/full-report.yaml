  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Platform Science operates at the intersection of three overlapping market categories: fleet management
              software (FMS), commercial vehicle telematics, and electronic logging device (ELD) compliance
              infrastructure. The primary market boundary for Platform Science is North American enterprise commercial
              fleet management — specifically, heavy-duty Class 6–8 trucks operated by fleets with 200 or more vehicles
              that are already equipped with or purchasing vehicles factory-fitted with OEM telematics from Platform
              Science's partner OEMs (Daimler Truck NA, Navistar, PACCAR).

              The broader market definition includes: (1) vehicle tracking and GPS monitoring; (2) hours-of-service
              (HOS) ELD compliance mandated by the FMCSA; (3) driver performance monitoring and coaching; (4) predictive
              maintenance and remote diagnostics via CAN bus data; (5) fleet analytics and reporting; (6) dispatch and
              routing optimization; (7) third-party app marketplace access. Excluded from Platform Science's primary
              addressable market are: light commercial vehicles (vans, pickups), passenger fleets, construction/off-road
              equipment, last-mile delivery vehicles, European and Asian fleets (prior to the Trimble acquisition
              expanding the SAM), and owner-operators with 1–5 trucks (too small for enterprise deployment economics).

              Status-quo substitutes include manual paper logs (still used by some small fleets pre-ELD), legacy
              installed hardware from Geotab, Verizon Connect, or PeopleNet/Trimble, and internal IT departments
              managing fragmented vendor stacks. Aftermarket ELD-only solutions (J.J. Keller, EZLogz, Samsara solo)
              represent a substitute for the compliance-only use case. The OEM-native model specifically displaces the
              aftermarket hardware installation cost and logistical overhead.

              Post-Trimble acquisition (February 2025), Platform Science's total addressable market expanded to include
              European and international commercial fleets, though integration of these customer bases is ongoing and
              not yet a core revenue contributor per public disclosures.
