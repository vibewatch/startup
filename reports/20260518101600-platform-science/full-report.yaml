      - number: '2.3'
        title: Buyer and User Segmentation
        blocks:
          - type: paragraph
            body: >
              Fleet management buyers are segmented primarily by fleet size, which drives purchase behavior, budget
              ownership, contract terms, and feature requirements. Platform Science's go-to-market focuses on the
              enterprise and upper-mid-market segments.

              **Enterprise fleets (>500 vehicles):** These buyers are typically VP of Operations, VP of Safety, or
              CIO/VP of IT at large publicly-traded carriers (Schneider National, Werner Enterprises, J.B. Hunt, C.R.
              England, Covenant Logistics). Budget ownership rests with the Chief Operating Officer in most cases, with
              safety and IT leadership as co-approvers. Annual software spend ranges from $50 to $100+ per vehicle per
              month under multi-year contracts (typically 3–5 years). Adoption triggers include OEM factory-install
              (eliminating hardware capex), ELD mandate renewal cycles, safety program upgrades, and insurance carrier
              premium negotiations. Enterprise buyers require enterprise-grade SSO, SAML integration, dedicated account
              management, and custom SLA guarantees.

              **Mid-market fleets (50–499 vehicles):** Budget owners are typically operations directors or fleet
              managers at regional carriers or private fleets. Spend ranges from $30–$60/vehicle/month. Mid-market
              buyers require ROI-positive payback within 12–18 months, modular feature purchasing, and proven
              interoperability with existing TMS/ERP systems. Samsara and Motive serve this segment most aggressively;
              Platform Science competes here primarily through OEM factory-install at the point of truck purchase.

              **Small fleets/owner-operators (<50 vehicles):** These buyers spend under $35/vehicle/month and represent
              the largest segment by fleet count but lowest by revenue. They are highly price-sensitive and prefer
              plug-and-play ELD compliance solutions. Platform Science explicitly targets larger enterprise clients and
              is not positioned for owner-operators per its product pricing and deployment model.

              **OEM channel:** A critical secondary buyer is the OEM partner itself (Daimler, Navistar, PACCAR) which
              bundles Virtual Vehicle into the truck purchase or subscription at the production line. The OEM fleet
              management sale is typically bundled with dealer/OEM extended service agreements, effectively shifting the
              distribution decision upstream to the OEM sales team and fleet procurement departments rather than direct
              fleet technology buying centers.
