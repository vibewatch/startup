      - number: '1.2'
        title: Founders, Leadership Team, and Governance
        blocks:
          - type: paragraph
            body: >
              Platform Science was co-founded by Jack Kennedy and Jake Fields, who remain CEO and CTO respectively. Jack
              Kennedy brings a distinctive blend of military, government, media, and technology experience. He served as
              a Commander in the U.S. Navy Reserves (retiring in 2016) and was a founding team member of the Defense
              Innovation Unit Experimental (DIUx), the Department of Defense's Silicon Valley innovation center. His
              civilian career included serving as President of Qualcomm Enterprise Services and executive roles at News
              Corp and Fox Interactive Media, where he was part of the founding team for Hulu. Kennedy holds a B.S. from
              the United States Naval Academy and an MBA from Harvard Business School.

              Jake Fields, as CTO and Co-Founder, oversees Platform Science's technological direction. Fields brings
              deep expertise in IoT, cloud platform development, mobile applications, telematics, and enterprise
              mobility. His prior experience includes work at Samsung Electronics America (as an advisory board member),
              Avimesa Corporation (IoT middleware), and Treeline Interactive (founder and chairman, digital media and
              marketing).

              The broader leadership team includes several seasoned executives: John Hall (COO), responsible for daily
              operations; Darrin Demchuk (SVP Product – Fleet North America), who announced the 2026 Canadian ELD
              certification; Luke Wachtel (SVP Transportation & Logistics); Don Son (SVP Product Operations); and
              Paulina Romero (Chief of Staff). The CFO role has been reported under different names in external
              databases (Anthony Smolek in Zippia, Greg Ivancich in other sources), indicating possible leadership
              transition or data inconsistency that warrants diligence attention.

              The Board of Directors includes Chris Sultemeier (Chairman), Tracy Black (Director), Jake Medwell (Partner
              at 8VC, representing the 8VC investor seat), and William O'Donnell (representing Prologis Ventures).
              Following the February 2025 Trimble acquisition, Trimble received a board seat alongside the existing
              strategic investor representatives from C.R. England, Cummins, Daimler Truck, PACCAR, RyderVentures, and
              Schneider.

              The company's concentrated founder-led leadership creates key-person dependency risk, particularly with
              Jack Kennedy's multi-front roles as CEO, public spokesperson, and strategic relationship anchor. No public
              succession plan has been disclosed.
