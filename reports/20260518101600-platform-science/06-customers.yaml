  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Net revenue retention (NRR), gross revenue retention (GRR), and fleet-level churn rate have not been
      publicly disclosed.
    whyItMatters: Without NRR/GRR, durability of the customer base cannot be assessed from disclosed data. The absence of
      churn events is a weak positive signal, not a substitute for retention metrics.
    diligencePath: Request cohort retention analysis and NRR/GRR breakdown in diligence data room; interview CFO and VP Customer
      Success.
    relatedQuestionRefs:
