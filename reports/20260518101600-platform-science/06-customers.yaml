- id: SU-S02
  title: Named Customer Proof and Reference Quality
  body: 'Platform Science has an unusually strong named customer proof set for a mid-stage SaaS company: ten publicly confirmed
    production deployments across enterprise carriers ranging from 330 to 8,500 trucks, with authenticated executive quotes
    in all cases. Named proof quality is high — customers include publicly traded carriers (Covenant Logistics, Werner Enterprises),
    one of the largest private US carriers (C.R. England), and a Fortune 500 supply chain company (Schneider). Onboarding
    velocity is a standout: MVT deployed 1,600 trucks in 76 days; C.R. England deployed 4,000 trucks in ~5 months; Stevens
    Transport completed a 2,300-truck rollout in 60 days. Anchor customers Werner and MVT, both original 2020 deployments,
    have expanded their PS product footprints as recently as 2024 — Werner adding AI cybersecurity via Fleet Defender Neural
    Sentinel and MVT adding PS Navigation — providing multi-year contract renewal signals without public termination events.
    The principal limitation of the reference set is self-selection: all named case studies appear to be co-authored or approved
    by Platform Science, creating a positive-outcome bias; no independent audit of customer outcomes has been identified.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
