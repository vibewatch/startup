- id: SU-S03
  title: Customer Retention and Satisfaction Signals
  body: No major voluntary Platform Science customer churn or public contract non-renewal has been identified across reviewed
    sources. The two oldest enterprise customers — Werner Enterprises (2020) and Mesilla Valley Transportation (2020) — are
    both actively expanding their Platform Science deployments as of 2024, providing the strongest observable retention signal.
    However, three sources of latent satisfaction risk are notable. First, Platform Science's own 2026 Driver Experience Report
    (surveying 1,100 commercial drivers) found that 53% of drivers say technology makes their job harder, with in-cab complexity,
    multiple app logins, and hardware reliability as the primary friction points. Second, aggregate SoftwareAdvice/Capterra
    reviews rate Platform Science at 3.8/5 overall with value-for-money at 3.48/5 — below the enterprise SaaS median — and
    reviewers cite multi-year lock-in and high hardware costs as concerns. Third, no aggregate NRR, GRR, or cohort churn data
    has been publicly disclosed; retention durability is assessed entirely from observable expansion signals and absence of
    public churn events rather than from disclosed metrics. Multi-year contract structure and hardware switching friction
    (tablet/gateway replacement plus driver retraining) create structural lock-in for enterprise accounts, which partially
    mitigates these satisfaction risk signals.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
