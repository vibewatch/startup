- id: FU001
  title: Customer Journey Map
  type: journey-map
  description: Six-stage customer journey from OEM preinstall awareness through multi-year expansion and advocacy for enterprise
    fleet buyers.
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU006
  - CU020
  data:
    items:
    - label: OEM Hardware Pre-Install
      description: Virtual Vehicle gateway pre-installed at DTNA/PACCAR/Navistar factory; fleet buyer receives truck with
        PS hardware already embedded — no separate procurement decision required for initial contact.
    - label: Fleet Evaluation / RFP
      description: VP Technology or CIO evaluates PS against Samsara, Motive, Zonar; OEM-native architecture, app marketplace,
        and pilot deployment terms are key differentiators at this stage.
    - label: Virtual Vehicle Activation
      description: 'Fleet activates Virtual Vehicle on shipped trucks via remote provisioning; no physical hardware install
        required. Speed: MVT 1,600 trucks in 76 days; CR England 4,000 trucks in ~5 months.'
    - label: Core Suite Deployment
      description: ELD, HOS, DVIR, Workflow, Messages, and compliance apps deployed fleet-wide; driver onboarding at terminal
        visits; RPM (Remote Platform Management) enables MDM-style device control.
    - label: Marketplace Expansion
      description: Fleet adds third-party apps (navigation, safety cam, pay transparency, AI cybersecurity, diagnostics) via
        SPEED-certified marketplace — pure software OTA, no hardware swaps.
    - label: Renewal and Advocacy
      description: Multi-year contract renewal; some accounts (CR England, Schneider) become strategic investors; customer
        executives quoted in co-authored case studies and press releases used for peer-fleet acquisition.
