artifact: financials
schemaVersion: report-v2
chapter:
  number: 4
  title: Financials
  letter: I
  summary: Platform Science is a private company with limited public financial disclosure. Based on press reports, third-party
    estimates, and peer company filings, total capital raised exceeds $409M against an estimated pre-Trimble revenue of ~$37.8M
    (third-party estimate), implying aggressive capital deployment. The OEM-embedded subscription model, 400+ marketplace
    apps, and 85K+ post-Trimble customers offer a credible recurring-revenue base, but profitability path and gross margin
    remain undisclosed. Fleet tech peers (Motive, Samsara) demonstrate ~70% gross margins and -40%+ net loss at growth stage,
    suggesting Platform Science faces multi-year capital dependency before reaching cash-flow breakeven.
sections:
- id: SI-SEC-01
  title: Revenue Streams and Pricing Architecture
  body: 'Platform Science generates revenue across three primary streams: OEM-embedded subscription fees, marketplace take
    rate on third-party applications, and professional services for fleet integration. The core Virtual Vehicle platform charges
    per-vehicle per-month subscription fees to fleet operators; specific rates are not publicly disclosed, but industry benchmarks
    for enterprise fleet management software range $27-50/vehicle/month. The marketplace model, hosting 400+ applications,
    earns a platform take rate estimated at 20-25% on in-app transactions. Following the February 2025 acquisition of Trimble
    Transportation, Platform Science absorbed an established contracted revenue base spanning 85K+ customers across North
    American trucking and logistics. This acquisition materially changed the revenue profile, adding legacy subscription contracts
    at potentially lower per-vehicle ASPs than native Virtual Vehicle agreements. Professional services revenue derives from
    OEM integration projects and fleet onboarding. The OEM-embedded distribution model fundamentally lowers customer acquisition
    cost by eliminating field hardware installation; instead, telematics is factory-installed, and subscription activation
    is bundled into vehicle procurement cycles. This structural advantage creates switching cost lock-in from day one of vehicle
    ownership.'
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: SI-SEC-02
  title: Unit Economics and Cost Structure
  body: 'Platform Science has not publicly disclosed gross margin, operating expenses, or unit economics. However, publicly
    comparable fleet management SaaS companies provide useful benchmarks. Motive''s S-1 filing (December 2025) and Samsara''s
    public earnings history both demonstrate approximately 70% gross margins despite hardware component bundling — a figure
    consistent across the segment because software licensing, cloud infrastructure, and telematics data processing dominate
    COGS after hardware is recovered via subscription. Net income margins at growth stage are deeply negative: Motive''s FY2024
    loss from operations was $112M on $370M revenue (-30% operating margin), with net losses of $153M (-41% net income margin).
    Samsara improved from -100% net margin at IPO to approximately -34% as of FY2025. Platform Science''s OEM channel implies
    lower sales and marketing expense as a percentage of revenue than direct-sales competitors, potentially enabling better
    near-term operating leverage. However, R&D investment to maintain platform competitiveness, OEM integration engineering,
    and marketplace developer support costs remain structural. Net dollar retention for enterprise fleet tech platforms averages
    110-126% (Motive data), suggesting strong expansion revenue dynamics once customers are onboarded, which partially offsets
    acquisition costs.'
  tableRefs:
  - TI003
  figureRefs:
  - FI002
  - FI003
- id: SI-SEC-03
  title: Capital Position and Funding History
  body: 'Platform Science has raised $409M+ in total equity and debt capital since founding. The Series C (November 2021,
    $115M led by SoftBank Vision Fund 2) established a $575M post-money valuation — the last disclosed valuation. A debt round
    in September 2022 supplemented working capital. The April 2024 Series C-1 expansion ($125M) was led by strategic OEM and
    fleet operator investors including C.R. England, Cummins, PACCAR, Daimler Truck North America, Ryder Ventures, and Schneider
    National. This investor composition signals commercial conviction from the largest North American fleet operators rather
    than purely financial capital. The February 2025 Trimble Transportation acquisition added approximately $100M in new capital
    alongside the transaction. No subsequent valuation has been publicly disclosed, leaving the 2021 $575M figure as the last
    known benchmark. SoftBank Vision Fund 2''s involvement introduces fund lifecycle pressure: Vision Fund 2 targets liquidity
    within 5-7 years of investment, placing the 2021-2028 window as a likely IPO or acquisition timeline. Burn rate and cash
    runway are not disclosed; applying Motive-level operating expense ratios (~30% of revenue in operating losses) to a post-Trimble
    revenue base of $150-220M suggests annual operating losses in the $45-66M range, consistent with multi-year runway from
    the most recent capital raise.'
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: SI-SEC-04
  title: Public Traction Gaps and Financial Verdict
  body: 'Platform Science is a private company with no SEC filing obligation and no public revenue or ARR disclosure. All
    financial analysis relies on press releases, third-party data aggregators, and peer company benchmarking. A third-party
    company intelligence source (Usearch.com) estimated Platform Science revenue at $37.8M as of approximately 2022-2023,
    representing pre-Trimble pre-scale operations. Post-Trimble with 85K+ customers, the revenue base is likely materially
    higher, but no verification source is available. A May 2026 press release noted Platform Science''s ''first revenue''
    milestone for its post-acquisition integrated platform, suggesting the combined entity is in early commercial scaling.
    The primary diligence blockers are: (1) no verifiable ARR, gross margin, or net retention metrics; (2) no confirmed cash
    position or burn rate; (3) the 2021 $575M valuation was set in a high-multiple private market environment that has since
    corrected by 30-50% for comparable fleet tech names; (4) undisclosed integration costs and earnout terms from the Trimble
    acquisition. Financial verdict: the OEM-embedded subscription model, 85K+ customer base, and 400+ marketplace apps create
    a credible recurring revenue foundation with 70%+ gross margin potential at maturity. However, significant near-term capital
    dependency, a valuation-to-disclosed-revenue multiple exceeding 10x (at 2021 terms), and complete opacity on unit economics
    constitute material diligence blockers that must be resolved before any financing or strategic transaction.'
  tableRefs:
  - TI005
  figureRefs: []
