callouts:
- title: 'Capital Intensity Risk: 10x+ Revenue-to-Capital Multiple'
  body: Platform Science has raised $409M+ against an estimated $37.8M in disclosed revenue (pre-Trimble, third-party estimate).
    This implies a capital deployment ratio exceeding 10:1, substantially above efficient SaaS norms. While the Trimble acquisition
    likely multiplied revenue by 3-5x, the capital efficiency profile remains a key diligence risk until audited financials
    become available.
  calloutType: risk
  claimRefs:
