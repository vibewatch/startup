  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块版图
        blocks:
          - type: paragraph
            body: >-
              Platform Science 的核心产品是 Virtual Vehicle®（VV）平台：一个 SaaS 车联网 IoT 应用市场，作为出厂预装软件部署在 Daimler Truck North
              America（DTNA）、PACCAR（Kenworth/Peterbilt）和 Navistar（International）生产的商用卡车上。传统后装车联网厂商需要物理安装硬件，Platform
              Science 则在 OEM 层运行：只要卡车已经搭载公司的 INSTINCT Gateway 硬件，平台就能靠 OTA 软件开通预激活。车队不必为安装停运卡车，运营商也能远程启用和管理软件应用。


              Virtual Vehicle 上的核心产品模块包括：（1）ELD/HOS 合规——在美国获得 FMCSA 认证；截至 2026 年 5 月，也是首个在 DTNA CTP2 出厂预装车联网平台上取得加拿大 ELD
              认证的平台；（2）PS Visual Intelligence——AI 驱动的视频安全系统，最多支持四路录制（前方、后方、侧面、驾驶室内），并自动识别疲劳、分心驾驶和未系安全带；（3）Vehicle Health
              Intelligence——与 Cummins 合作，提供远程诊断和 OTA 发动机固件更新；（4）通过 Trucker Path 等应用市场伙伴提供导航和路线规划；（5）开放应用市场，承载通过 SPEED
              认证的第三方应用。
