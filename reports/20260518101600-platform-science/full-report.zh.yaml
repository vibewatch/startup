          note: Platform Science 的主渠道：OEM 工厂认证消除硬件安装销售周期
        - label: 经销商向车队交付
          value: 216000
          detail: 新车交付给企业车队时，Virtual Vehicle 已激活或可随时激活 [约 80% 北美 Class 8 产量通过 OEM 合作伙伴（估计）]
          note: 激活率取决于车队合同；部分卡车购买后不会激活可选订阅服务
        - label: 车队入驻 / 激活
          value: 120000
          detail: 车队签署企业 SaaS 合同；Virtual Vehicle 通过 OTA 激活；司机平板通过 MDM 配置 [Platform Science 企业销售周期；合同签署]
          note: 免去硬件安装周期，是 PS 相对后装竞争对手的关键差异
        - label: 核心平台使用（ELD + 合规）
          value: 90000
          detail: ELD 合规、HOS 记录、车队追踪 — 基线服务；监管底线带来粘性 [美国强制池 3.5M 名 CMV 司机；北美 19.2M+ 活跃单元（2024）]
          note: ELD 合规是经常性、非可选支出；形成切换成本底线
        - label: 应用市场采用（增购）
          value: 45000
          detail: 车队增加安全应用（Netradyne）、路线规划（Drivewyze）、维护、分析 — 带来增量 ARPU [Virtual Vehicle 应用市场；第三方 ISV 集成]
          note: 应用市场模式类似 App Store 经济性；每增加一个应用，切换成本和 ARPU 都上升
        - label: 经常性收入 + 扩张
          value: 36000
          detail: 年度合同续约、扩展到更多卡车、增购新应用类别；Motive 126% NDR 基准显示企业扩张经济性 [估计企业定价 $50–100/车/月；多年锁定]
          note: Platform Science 未披露 NDR；Motive 126% 和 Samsara 企业扩张作为可比基准
    approximationNotes: >-
      漏斗数值为分析师估计和公开基准。Platform Science 未披露激活率、转化率或 ARPU。OEM 产量来自 TruckingDive/FleetOwner 关于 Daimler 2025 年 Q4 业绩和 PACCAR
