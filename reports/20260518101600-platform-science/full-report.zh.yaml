      - number: '6.1'
        title: 客户基础与分群
        blocks:
          - type: paragraph
            body: >-
              Platform Science 主要、也基本唯一服务的是北美大型企业车队这一可触达市场。所有公开具名的生产客户都运营 200 辆以上卡车，多数属于美国整车运输承运商 top-50 梯队。平台依赖 OEM
              原生硬件预装（Daimler Truck North America、PACCAR、Navistar），这在结构上排除了个体车主运营商和规模低于约 200 辆车的车队——每台 $400–600
              的硬件成本、多年企业合同和 OEM 渠道要求，使小车队采纳在经济上不可行。公开宣布的部署覆盖 8 家具名承运商，合计至少 28,000 辆卡车；Platform Science
              估计其管理的总车队为「数百个车队」，服务 53,500+ 名活跃司机。若干锚定客户——C.R.
              England、Schneider、Ryder、Cummins——同时也是战略投资方，资本关系与商业关系绑定，降低了这些账户自愿流失的概率。Trimble 全球车联网业务收购（2025 年 2
              月）加入了欧洲和澳大利亚的国际车队客户，开始让业务从美国 OEM 原生部署走向地域多元化。同一平台上，车队经理满意度（TruckingWay 为
              4.6/5）与司机满意度（2.2/5）分化明显，说明利益相关群体之间存在张力；如果不解决，司机留存被列为核心技术评估标准的车队可能放慢采纳。
