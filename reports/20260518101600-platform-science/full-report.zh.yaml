  - id: TV005
    title: 投资逻辑破裂与止损触发条件
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - OEM 合作合同不续约，或宣布竞争对手独家合作
        - PACCAR、Daimler Truck 或 Volvo Group 中任一方，公开与 Samsara 或 Motive 合作，将其作为 OEM 嵌入式独家供应商
        - 被动获得车队增长的路径消失；TAM 缩小 25-40%；立即触发悲观情景
        - 停止新增投资；等待 OEM 回应，立即重估投资逻辑
      - - 财务尽调显示 ARR 低于投资逻辑底线
        - 尽调披露 ARR 低于 $100M，或毛利率低于 60%
        - 将隐含估值重置到 $800M 以下；以当前进入价计算，基准情景回报失效
        - 按当前估值放弃投资；进入价显著降低后再重看
      - - NRR 低于行业底线
        - 披露的 NRR 低于 105%，或从队列流失数据推断低于 105%
        - 意味着平台粘性不足；侵蚀情景中扩张收入假设
        - 要求运营修复计划，并降价以反映经济质量下降
      - - Samsara 或主要竞争对手宣布与前三大 OEM 达成 OEM 原生协议
        - 公开宣布与 PACCAR、Daimler Truck 或 Volvo Group 达成 OEM 嵌入式交易
        - 直接切入 Platform Science 核心分销渠道；结构性护城河被削弱
        - 立即退出或减仓；OEM 竞争护城河逻辑坍塌
      - - 监管或法律行动实质损害车队数据变现
        - FMCSA 或州级执法针对车队数据实践，或围绕司机数据发起集体诉讼
        - 增加合规成本；压低数据变现上行空间；加大投资人对未来经济性的疑虑
        - 暂停新增投资；追加资本前先跟踪法律结果
    claimRefs:
      - CV016
      - CV017
      - CV033
      - CV024
    notes: 这些触发条件是基于可比公司分析的示例阈值；实际契约条款需要法律审查，并需 Platform Science 披露股权结构表。
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - ARR 与收入构成
        - 公司未公开披露总 ARR、MRR，或按 OEM 嵌入式与开放市场等分部划分的收入
        - 验证支撑所有估值情景的 $100-250M ARR 估计区间
        - 尽调中索取经审计财务；用具名客户车队规模和单车定价交叉核验
      - - 净留存率（NRR）
        - 未披露公开 NRR、总美元留存率或扩张收入数据
        - NRR 高于 110% 支持溢价倍数；低于 105% 是扩张逻辑的止损信号
        - 索取所有在平台上满 12+ 个月的车队客户队列收入分析
      - - OEM 合同经济性和续约条款
        - 合同期限、收入分成、续约权和排他条款均未公开披露
        - OEM 合同是主要增长引擎；经济性不利或期限过短会实质改变投资逻辑
        - 要求完整披露 OEM 合同，包括经济条款、期限长度、续约选择权和竞争限制条款
      - - 毛利率与单位经济性
        - 未公开披露毛利率、销售与营销效率，或按分部划分的贡献利润率
        - 毛利率低于 65%，意味着 OEM 收入分成或集成成本在吞噬 SaaS 经济性
        - 索取按分部拆分的 P&L 及 OEM 渠道成本分摊；对照 Samsara 72% 毛利率做基准
      - - 客户赢单 / 输单竞争数据
        - 未公开披露在竞争性招标中对 Samsara、Motive 或 Geotab 的赢单 / 输单数据
        - 赢率和竞争替换数据能验证 OEM 渠道之外开放市场分部的护城河逻辑
        - 索取 24 个月赢单 / 输单分析；识别非 OEM 车队中竞争侵蚀的模式
      - - 股权结构与优先股堆叠
        - 股权结构表、清算优先权和 OEM 投资方治理权利均未公开披露
        - 若 OEM 投资方持有参与型优先股，低倍数退出时可能吸收不成比例的回款
        - 签署投资条款清单前，要求完整披露股权结构表、优先股堆叠分析和董事会治理权利
    claimRefs:
      - CV031
      - CV034
      - CV036
      - CV039
    notes: 这些尽调问题是信念阶段私营 SaaS 投资的标准要求；披露是否完整，决定「有条件正面」能否上调为高信念「买入」。
