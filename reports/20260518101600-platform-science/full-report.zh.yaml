      - number: '8.3'
        title: 情景分析：乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              三个情景基于 ARR 增长轨迹、退出倍数压缩或扩张，以及结构性投资逻辑是否完整来构建。


              乐观情景（$8-12 billion 退出，2027-2028）：要求 ARR 达到 $400-500 million，并保持 40-50% 持续增长；OEM 合作扩大到完整生产部署；借助 Daimler
              Truck 和 Volvo 全球网络成功国际扩张；并以 18-22x ARR 退出，接近 Samsara IPO 时代估值。概率信号包括 OEM 合同以更好经济条款续签、具名客户车队扩张公告，以及国际部署里程碑。


              基准情景（$3-5.6 billion 退出，2027-2028）：ARR 为 $250-350 million，增速到 2027 年从 40% 放缓至 25%；保住所有主要 OEM 合作；继续聚焦北美车队；以
              12-16x ARR 退出。概率信号是当前客户扩张速度延续，并且在重大车队招标中没有竞争性丢单。


              悲观情景（$0.6-1.5 billion 退出，2027-2028）：触发因素包括 OEM 合同重新谈判、Samsara 或 Motive 通过竞争性 OEM 伙伴拿到 OEM 内嵌分销、ARR 增速放缓至
              10-15%，以及车队科技板块抛售导致倍数压缩至 6-8x。该情景意味着退出估值处于或低于当前隐含进入估值，投资者回报被抹平。
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
