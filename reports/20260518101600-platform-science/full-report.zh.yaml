      - number: '3.4'
        title: 竞争护城河评估与风险因素
        blocks:
          - type: paragraph
            body: >-
              Platform Science 的主要护城河是 OEM 合同锁定，并由工厂集成复杂度加固。把 Platform Science 从 Daimler 或 PACCAR 生产线上换掉，需要 18–36
              个月重新认证、改造工厂产线并重配 MDM；如果没有足够有力的理由，OEM 理性上会避开这笔成本。收购 Trimble Transportation（2025 年 2 月）通过新增 85,000+
              装机基础客户、嵌入式工作流依赖和遗留数据集成，进一步加深了护城河。


              第二层护城河来源包括：（1）Virtual Vehicle 市场（400+ 个预集成 ISV 应用）制造 ISV 认证依赖，类似应用商店动态；（2）司机工作流采用——司机学会界面后，ELD 日志、DVIR
              检查和调度工作流会变得粘；（3）OEM 数据权利——Platform Science 在工厂层处理车辆 CAN bus 数据，拿到比后装竞争对手更丰富的遥测数据。


              关键竞争风险是 Samsara 和 Motive 抢走企业车队续约。通过 OEM 渠道采购的车队如果发现产品体验差距扩大，可能在合同续约时切换到纯后装竞争对手。Samsara 更强的 AI
              视频安全评分、路线智能和开放 API 集成是真实的产品优势。Geotab 的开放平台策略在政府和企业 IT 密集型账户中是特定风险，因为在那里 Platform Science
              更垂直整合的架构吸引力较弱。次级风险是 ISV 集中度——如果领先 ISV 因更大装机基础而优先做 Samsara 或 Motive 认证，Platform Science
              的市场护城河会被侵蚀。历史上，Zonar 被 Platform Science 从 Daimler 替换下来，说明 OEM 关系可以迁移；这个先例有两面性。
