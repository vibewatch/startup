      - number: '7.2'
        title: 运营、供应链与网络安全风险
        blocks:
          - type: paragraph
            body: >-
              Platform Science 的运营风险由硬件供应链集中、云基础设施依赖、Trimble 收购后整合复杂度，以及嵌入 53,500+ 辆商用车的车联网平台所带来的网络安全攻击面共同塑造。INSTINCT
              Gateway 硬件是 OEM 预装的核心 IoT 设备，采用 NXP ARM 双核处理器。2020–2023 年半导体短缺期间，NXP 汽车半导体供应明显受限；如果短缺重演，将推迟 OEM 卡车生产，并损害
              Platform Science 的新增部署。Samsung Galaxy Tab Active3 是标准司机端显示设备；若 Samsung
              停产或零部件短缺，可能迫使公司在既有与新增车队中迁移硬件平台。云基础设施依赖（考虑到 San Diego 企业软件栈惯例，假设为 AWS/GCP）带来可用性风险：ELD 强制令要求近乎连续的数据同步以满足
              FMCSA 合规；若宕机超过 FMCSA 连续 7 天离线容忍期，可能产生司机日志异常和车队合规处罚。Trimble 收购（2025 年 2
              月）增加整合执行风险：在全球车联网平台上合并工程团队、产品路线图、数据模型、客户成功职能和计费系统，本身就很复杂。收购后的文化与技术整合是一个 12-36
              个月的执行风险窗口。网络安全是结构性的暴露面风险：Platform Science 平台连接 OEM 车辆数据总线，并能对商用车辆进行双向远程访问；一次成功的网络入侵可能影响车辆控制、司机安全或大规模 ELD
              数据损坏，并带来监管和责任后果。
