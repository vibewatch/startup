      - number: '1.4'
        title: 里程碑、规模与战略进展
        blocks:
          - type: paragraph
            body: >
              Platform Science 从 2015 年的 San Diego 创业公司，到 2025 年已成为收购后的全球化车联网遥测重量级平台。公司的里程碑轨迹由三条交织的弧线构成：OEM
              合作、资本形成和产品驱动的车队采用。

              基础产品市场契合度在 2020 年 5 月确立，当时 Daimler Truck North America 成为首个在 Platform Science Virtual Vehicle
              平台上集成工厂预装车联网遥测的 OEM。该事件验证了“开放、原生”假设：商用卡车可以在出厂时就带上软件定义的连接层，而不是依赖后装硬件改造。随后两年，Platform Science 将 OEM 覆盖扩展至
              PACCAR 和 Navistar，向跨 OEM 标准推进。

              2022 年 Series C 后投后估值 $575M，巩固了 Platform Science 在货运科技领域近独角兽的地位。2023 年，Schneider（上市公司，NYSE:SNDR）、Werner
              Enterprises（NASDAQ:WERN）、C.R. England 和 Covenant Logistics 等大型车队运营商公开宣布部署 Virtual Vehicle。到 2023 年 12
              月，Platform Science 披露其车队客户基础累计产生超过 1 万亿个数据点、行驶 60 亿英里、每年 150 亿次 API 调用。

              2024 年 4 月增长轮（$125M）之后，公司在 2024 年 9 月宣布收购 Trimble。这是一笔标志性交易，使 Platform Science 得以吸收 Trimble
              全球遗留车联网遥测客户基础，从北美 OEM 原生创业公司转型为全球车队管理平台。交易于 2025 年 2 月完成，Trimble 成为股东并获得董事会席位。Trimble 交易由 J.P.
              Morgan（Platform Science）以及 Centerview Partners 和 Goldman Sachs（Trimble）提供顾问服务，体现交易已达到机构级规模。员工数从 2024 年的
              412 人增至 2025 年的 748 人，增长 57.9%，反映有机招聘和很可能包含 Trimble 员工整合。

              2026 年 5 月，Platform Science 成为首家在 Daimler CTP2（Common Telematics Platform 2）工厂预装硬件上获得加拿大 ELD 认证的公司，使
              Freightliner Cascadia、Freightliner Plus 和 Western Star X-Series 车队能够无缝满足美加跨境合规。这个监管里程碑进一步巩固了 Platform
              Science 作为北美主要卡车 OEM 品牌合规基础设施层的地位。
