      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              多家分析机构对车队管理和车联网遥测市场规模的估算差异很大，取决于范围定义、地理区域和纳入标准。我们用三层分析来定位 Platform Science 的机会。

              **全球 TAM：** 全球车队管理市场 2025 年约为 $27B，预计 2026 年增至 $30.1B，2035 年达到 $122.3B，CAGR 为 16.9%（Global Market
              Insights，2025 年 12 月）。更窄口径的全球车队车联网遥测市场（不含没有车联网遥测的 FMS 软件）2025 年达到 $10.42B，预计到 2032 年以 11.2% CAGR 增至
              $21.95B（MarketsandMarkets，2025）。差异来自是否把车队管理软件（路线规划、调度、TMS 集成）与硬件和车联网遥测服务一并计入。

              **SAM — 北美：** 北美商用车车联网遥测市场 2025 年规模为 $24.83B，预计到 2031 年以 13.67% CAGR 扩至 $48.31B（Mordor
              Intelligence，2026）。仅美国就占北美份额的 77.64%（2025 年 $19.3B），加拿大约 16%，墨西哥 6%。美国车队管理软件市场单独估计 2025 年为 $11.34B，预计到
              2030 年以 9.2% CAGR 达到 $17.63B（MarketsandMarkets，2025）。这些分歧反映了硬件 OEM 收入、车联网遥测服务和车队管理应用是分开计量还是合并计量。

              **活跃装机基础：** 北美正在使用的车队管理系统总数预计将从 2024 年底约 19.2M 套增至 2029 年的 33.2M 套，CAGR 11.6%，市场渗透率从非私人拥有商用车车队的 56.8% 提升至
              84.7%（ResearchAndMarkets/Berg Insight，2025）。

              **Platform Science 的 SOM：** Platform Science 的 SOM 主要由三家 OEM 合作关系决定：Daimler Truck
              NA、Navistar（International）和 PACCAR（Kenworth/Peterbilt），合计约占北美 Class 8 卡车产量的 80%。按北美年产 250,000–290,000 辆
              Class 8 车（2026 共识）和 10 年车辆寿命假设，OEM 合作装机车队基础每年增加约 200,000–230,000 辆。按 $50–$100/车/月的企业定价区间，仅新 OEM
              产车带来的新增年收入潜力就是每年 $120–$276M。现有渗透估算（ResearchAndMarkets 的 500K+ 装机）按企业定价推算，当前收入运行率下限为 $300–$600M
              ARR；这与增长资本轨迹和员工规模相符，但尚未被公开披露确认。
