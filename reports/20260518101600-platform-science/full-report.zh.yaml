        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Platform Science 的收入来自三条主线：OEM 嵌入式订阅费、第三方应用市场抽成，以及车队集成专业服务。核心 Virtual Vehicle
              平台向车队运营商按车、按月收取订阅费；具体费率未公开披露，但企业级车队管理软件的行业基准为 $27-50/车/月。拥有 400+ 应用的市场模式，对应用内交易抽取估计 20-25% 的平台分成。2025 年 2
              月收购 Trimble Transportation 后，Platform Science 吸收了一块成熟的合同收入基础，覆盖北美卡车运输和物流的 85K+
              客户。这笔收购实质性改变了收入结构，加入了遗留订阅合同，其单车 ASP 可能低于原生 Virtual Vehicle 协议。专业服务收入来自 OEM 集成项目和车队上线。OEM
              嵌入式分发模式从根本上降低了获客成本，因为它消除了现场硬件安装；车联网遥测改为工厂预装，订阅激活打包进车辆采购周期。这个结构性优势从车辆所有权第一天起就建立切换成本锁定。
