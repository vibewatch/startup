  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同业分类
        blocks:
          - type: paragraph
            body: >-
              北美车队车联网遥测竞争格局按分发模式和产品范围分为四个结构层级。第一层是 OEM 原生车队 OS：Platform Science 独占这一层，在 Daimler Truck
              NA、International（Navistar）和 PACCAR 获得工厂认证集成，覆盖约 80% 的北美 Class 8 产量。没有其他独立软件厂商能同时在多家 Class 8 OEM 中持有类似的 OEM
              工厂预装协议。


              第二层是企业级纯后装厂商：Samsara（NYSE: IOT，约 $1.47B ARR）、Motive（约 $501M ARR）和 Geotab（私营，4M+
              联网车辆）通过直销或经销商销售后装硬件。三者都提供宽产品套件（ELD、视频安全、GPS、分析），并争夺 Platform Science 瞄准的同一批大型企业车队客户。Samsara 和 Motive 拥有更强的
              AI 能力和激进的企业增购动作，是主要增长威胁。


              第三层由电信公司 / 综合集团支持：Verizon Connect（Verizon 部门）和 Zonar Systems（Continental AG 子公司）依靠传统产品以及电信 / OEM
              母公司背书竞争。Verizon Connect 的 G2 得分为 39.6，远低于 Samsara 的 99，反映产品体验缺口显著；Zonar 聚焦合规和安全，且在 Daimler 被 Platform
              Science 取代。第四层是传统平台：Omnitracs（Solera）、Trimble Transportation（现已并入 Platform Science）和车队卡公司。Platform Science
              2025 年 2 月收购 Trimble 车联网遥测板块，新增 85,000+ 企业客户和视频安全能力，直接吸收了第四层。
