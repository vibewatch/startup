      - number: '5.2'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Virtual Vehicle 的技术栈从硬件到云分为六层。硬件层的 INSTINCT Gateway 是一台 ARM 设备（NXP i.MX6D Lite Dual Core Cortex-A9
              @800MHz、8GB eMMC、1GB DDR3 RAM），支持带 3G/2G 回落的 4G Cat 4 LTE、Wi‑Fi 802.11 a/b/g/n/ac、Bluetooth 5.0，以及
              GPS/GLONASS/Galileo，定位精度 <2.5m CEP。该网关连接卡车的 OBD-II/CAN 总线并运行 Virtual Vehicle OS，为车队软件提供应用沙箱。


              平台在边缘侧每天为每辆卡车处理超过 3 million 个数据点，整个车队网络每天处理的数据点超过 100 billion。车联网遥测每天为每辆车发送 288 次车辆心跳（约每 5 分钟一次）；在 53,500+
              名活跃司机范围内，车队总心跳每天超过 12.5 million 次。云数据平台负责摄取、处理并通过 API 暴露这些数据，供车队运营商和应用市场开发者使用。


              SPEED
              认证计划（Security、Performance、Experience、Efficiency、Documentation）是所有第三方应用在通过应用市场分发或部署到客户车队前必须经过的评审与验证流程。该计划保护司机安全、数据安全和设备性能。收购
              Trimble 后，应用目录纳入 Trimble 既有车联网产品组合，全球车队运营商现在可在 Platform Science 的 Virtual Vehicle 平台上访问这些产品。
