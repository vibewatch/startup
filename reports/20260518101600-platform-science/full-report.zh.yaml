      - number: '6.3'
        title: 客户留存与满意度信号
        blocks:
          - type: paragraph
            body: >-
              已审阅来源中，没有发现 Platform Science 主要客户自愿流失或公开合同不续约事件。两家最老的企业客户——Werner Enterprises（2020）和 Mesilla Valley
              Transportation（2020）——截至 2024 年都在主动扩大 Platform Science 部署，这是当前最强的可观察留存信号。不过，潜在满意度风险有三类值得注意。第一，Platform
              Science 自己的 2026 Driver Experience Report（调查 1,100 名商业司机）发现，53%
              的司机认为技术让工作更难，驾驶室内复杂度、多应用登录和硬件可靠性是主要摩擦点。第二，SoftwareAdvice/Capterra 汇总评价给 Platform Science 总体评分 3.8/5，性价比评分
              3.48/5——低于企业 SaaS 中位数——评论者提到多年锁定和高硬件成本。第三，公司没有公开披露汇总 NRR、GRR
              或队列流失数据；留存韧性完全基于可观察扩张信号和没有公开流失事件来判断，而非披露指标。多年合同结构和硬件切换摩擦（替换平板电脑 / 网关并重新培训司机）为企业账户形成结构性锁定，部分缓释了这些满意度风险信号。
