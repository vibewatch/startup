  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    data:
      items:
        - label: 市场机会
          score: 8
          detail: TAM 大且在增长；监管顺风；绿地渗透机会
        - label: 产品与护城河
          score: 9
          detail: OEM 原生集成带来结构性分销优势和高切换成本
        - label: 客户验证
          score: 7
          detail: 已披露的企业客户群具备规模；但公开 NPS 或流失率数据有限
        - label: 财务透明度
          score: 2
          detail: 未公开披露 ARR、收入、利润率或 NRR——这是最大风险，也是尽调必须补齐的核心项
        - label: 竞争地位
          score: 7
          detail: 差异化 OEM 渠道构成护城河；在开放市场板块，Samsara 和 Motive 构成可信威胁
        - label: 风险画像
          score: 4
          detail: OEM 集中度、财务未披露、司机采用阻力，以及估值倍数压缩风险
        - label: 估值吸引力
          score: 6
          detail: 隐含入场估值 $1.2-1.8B 较合理；基准情形回报 2-4x；乐观情形 5-8x，前提是尽调确认
    claimRefs:
      - CV025
      - CV039
