  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与替代方案
        blocks:
          - type: paragraph
            body: >
              Platform Science 位于三个重叠市场类别的交叉点：车队管理软件（FMS）、商用车车联网遥测和电子日志设备（ELD）合规基础设施。Platform Science
              的主要市场边界是北美企业级商用车队管理，具体是由拥有 200 辆及以上车辆的车队运营的 Class 6–8 重型卡车，这些车队已经配备或正在采购由 Platform Science 合作 OEM（Daimler
              Truck NA、Navistar、PACCAR）出厂预装 OEM 车联网遥测的车辆。

              更广义的市场定义包括：（1）车辆追踪和 GPS 监控；（2）FMCSA 强制的工时服务（HOS）ELD 合规；（3）司机表现监控和辅导；（4）通过 CAN bus
              数据做预测性维护和远程诊断；（5）车队分析和报告；（6）调度与路线优化；（7）第三方应用市场接入。Platform Science 主要可服务市场不包括：轻型商用车（厢式货车、皮卡）、乘用车队、施工 /
              越野设备、最后一英里配送车辆、欧洲和亚洲车队（在 Trimble 收购扩大 SAM 之前），以及拥有 1–5 辆卡车的车主运营商（企业化部署经济性不足）。

              现状替代方案包括手工纸质日志（ELD 前仍有部分小型车队使用）、Geotab、Verizon Connect 或 PeopleNet/Trimble 的传统安装硬件，以及由内部 IT
              部门管理碎片化供应商栈。只解决 ELD 合规的后装方案（J.J. Keller、EZLogz、Samsara solo）构成合规单一用例的替代。OEM 原生模式专门替代后装硬件的安装成本和物流开销。

              收购 Trimble 后（2025 年 2 月），Platform Science 的总可用市场扩展到欧洲和国际商用车队，不过这些客户基础仍在整合中，按公开披露尚未成为核心收入贡献者。
