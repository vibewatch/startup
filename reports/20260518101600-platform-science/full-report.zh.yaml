  - id: TR001
    title: 监管与法律风险台账
    notes: 行按严重程度排序。剩余风险暴露反映已知缓释措施后的风险。
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Rows represent identified regulatory and legal risk areas based on FMCSA regulations, Transport Canada ELD
        mandate, CCPA/CPRA, NHTSA cybersecurity guidance, and Platform Science patent and IP landscape review.
    columns:
      - 规则 / 许可 / 案件
      - 司法管辖区
      - 状态
      - 发生概率
      - 严重程度
      - 缓释措施
      - 剩余风险暴露
      - 尽调路径
    rows:
      - - FMCSA ELD 技术规范（49 CFR 395）
        - 美国联邦
        - 截至 2026-05 已注册且合规
        - 中 — 每次规范更新都有重新认证风险
        - 高 — 一旦取消认证，客户将被迫大规模切换 ELD
        - FMCSA 注册仍有效；工程合规团队；SOC 2 Type 2
        - 中等 — 单个软件 bug 或审计发现就可能触发整改窗口
        - 调取 FMCSA 合规审计记录；审查 ELD 重新认证时间表
      - - Transport Canada ELD 技术标准（TP15205）
        - 加拿大
        - 2026 年 5 月在 DTNA CTP2 上获认证（首个加拿大 PS ELD）
        - 低 — 刚获认证
        - 中 — 如果认证失效，加拿大车队客户会承压
        - Transport Canada 认证；与 DTNA 合作完成初始部署
        - 短期低；加拿大车队数量增长后上升
        - 确认认证到期日和重新认证义务
      - - CCPA / CPRA（加州消费者隐私法 / 隐私权法）
        - 美国加州
        - 需合规（总部位于加州 San Diego）
        - 中 — 执法活动增加
        - 高 — 大规模采集司机位置、生物识别和行为数据
        - 已发布 Customer Data Bill of Rights；Trust Portal；ISO 27001；同意管理
        - 中等 — 多车队、多司机数据管线让合规面持续存在
        - 审查隐私政策、同意流程、数据保留计划和司机退出机制
      - - GDPR（通用数据保护条例）
        - EU/EEA（通过 Trimble 收购带来的欧盟车队客户）
        - Trimble 收购触发合规义务（欧盟车队客户）
        - 中 — 收购后合规映射仍在推进
        - 高 — 欧盟数据传输、处理和泄露通知要求
