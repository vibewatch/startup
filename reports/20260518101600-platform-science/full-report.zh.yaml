      - number: '1.2'
        title: 创始人、领导团队与治理
        blocks:
          - type: paragraph
            body: >
              Platform Science 由 Jack Kennedy 和 Jake Fields 联合创立，两人分别继续担任 CEO 和 CTO。Jack Kennedy 的经历横跨军队、政府、媒体和科技。他曾任
              U.S. Navy Reserves 指挥官（2016 年退役），也是 Defense Innovation Unit Experimental（DIUx，美国国防部硅谷创新中心）的创始团队成员。Kennedy
              的民用职业经历包括担任 Qualcomm Enterprise Services 总裁，以及在 News Corp 和 Fox Interactive Media 担任高管；在 Fox Interactive
              Media 期间，他参与 Hulu 创始团队。Kennedy 拥有 United States Naval Academy 理学学士和 Harvard Business School MBA 学位。

              作为 CTO 和联合创始人，Jake Fields 负责 Platform Science 的技术方向。Fields 在 IoT、云平台开发、移动应用、车联网遥测和企业移动性方面经验深。此前他曾在 Samsung
              Electronics America 任顾问委员会成员，任职于 Avimesa Corporation（IoT 中间件），并创办和担任 Treeline Interactive 董事长（数字媒体与营销）。

              更广泛的领导团队包括多位资深高管：John Hall（COO，负责日常运营）、Darrin Demchuk（SVP Product – Fleet North America，宣布 2026 年加拿大 ELD
              认证）、Luke Wachtel（SVP Transportation & Logistics）、Don Son（SVP Product Operations）和 Paulina Romero（Chief of
              Staff）。外部数据库对 CFO 人选记录不一致（Zippia 记录为 Anthony Smolek，其他来源为 Greg Ivancich），提示可能存在领导层交接或数据不一致，尽调需要关注。

              董事会成员包括 Chris Sultemeier（Chairman）、Tracy Black（Director）、Jake Medwell（8VC 合伙人，代表 8VC 投资人席位）和 William
              O'Donnell（代表 Prologis Ventures）。2025 年 2 月收购 Trimble 后，Trimble 获得一个董事会席位，与 C.R. England、Cummins、Daimler
              Truck、PACCAR、RyderVentures 和 Schneider 等既有战略投资方代表并列。

              公司由创始人集中领导，形成关键人依赖风险，尤其是 Jack Kennedy 同时承担 CEO、公开发言人和战略关系锚点等多重角色。公司尚未公开披露接班计划。
