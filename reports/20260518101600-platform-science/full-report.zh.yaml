    title: 采用部署漏斗
    type: funnel
    description: 从符合 OEM 条件的新卡车产量到活跃 Platform Science 平台部署的估计漏斗。数值为基于公开数据的底线估计。
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU009
    data:
      items:
        - label: DTNA + PACCAR 北美 Class 8 年产量（估计）
          value: 90000
        - label: 累计预装 PS Virtual Vehicle 硬件的卡车（估计，平台生命周期）
          value: 200000
        - label: 平台活跃司机（PS 称 2025 年 53,500+）
          value: 53500
        - label: 公开点名量产部署的卡车数下限
          value: 28000
        - label: 使用 3+ 个应用市场应用集成的具名车队（估计）
          value: 8
