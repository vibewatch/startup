      - number: '6.2'
        title: 具名客户证明与背书质量
        blocks:
          - type: paragraph
            body: >-
              对一家中期 SaaS 公司来说，Platform Science 的具名客户证明异常扎实：10 个公开确认的生产部署横跨企业承运商，车队规模从 330 辆到 8,500
              辆不等，每个案例都有经认证的高管引述。具名证明质量高——客户包括上市承运商（Covenant Logistics、Werner Enterprises）、美国最大私人承运商之一（C.R. England）和
              Fortune 500 供应链公司（Schneider）。上线速度突出：MVT 在 76 天内部署 1,600 辆卡车；C.R. England 约 5 个月内部署 4,000 辆；Stevens
              Transport 用 60 天完成 2,300 辆卡车上线。锚定客户 Werner 和 MVT 都是 2020 年首批部署客户，且截至 2024 年仍在扩大 PS 产品使用范围——Werner 增加 Fleet
              Defender Neural Sentinel 的 AI 网络安全能力，MVT 增加 PS
              Navigation——在没有公开终止事件的情况下，释放出多年续约信号。该背书集的主要限制是自我选择偏差：所有具名案例研究看起来都由 Platform Science
              共同撰写或批准，天然偏向正面结果；尚未发现独立审计客户成效。
