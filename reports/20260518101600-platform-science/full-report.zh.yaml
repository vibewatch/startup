      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: OEM 分发带来结构性市场准入优势
            body: >
              北美 Class 8 车队管理市场预计从 2024 年 19.2M 套活跃系统增长到 2029 年 33.2M 套（CAGR 11.6%）。其中，OEM 嵌入式细分以 13.83% CAGR
              增长，快于后装市场。Platform Science 是三家 OEM 合作伙伴的领先独立软件层，这些伙伴覆盖约 80% 的北美 Class 8
              产量，形成复利式分发优势；只做后装的竞争对手（Samsara、Motive、Geotab）没有 OEM 协议就无法复制。
