      - number: '5.3'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >-
              Platform Science 的部署模式与纯软件 SaaS 厂商根本不同。主要上市路径是 OEM 工厂预装——DTNA（Freightliner、Western
              Star）、PACCAR（Kenworth、Peterbilt）和 Navistar（International）把 INSTINCT Gateway 与 Virtual Vehicle OS
              集成进新车生产。这意味着这些 OEM 的新 Class 8 卡车出厂时已经预装 Platform Science，为新车采购场景建立了嵌入式分销渠道，绕过了直接车队销售周期。


              集成能力不止 OEM 合作。Cummins Vehicle Health Intelligence（VHI）合作（2025 年 3 月）把 Virtual Vehicle 平台接入 Cummins
              Connected Solutions® 门户，通过平台提供实时发动机诊断和 OTA 固件更新。Trucker Path 应用市场集成（2025 年 10 月）加入卡车优化导航。收购 Trimble
              后，Platform Science 能向同一车队基础提供 Trimble 的导航、车联网和车队优化产品。


              2025–2026 年关键路线图里程碑包括：完成 Trimble Transportation 收购（2025 年 2 月）；Cummins VHI 合作上线（2025 年 3 月）；推出用于安全透明度的
              Trust Portal（2026 年 3 月）；在 CTP2 上获得加拿大 ELD 认证（2026 年 5 月）；以及 2026 Connected Vehicle Lab（CVL）North American
              Roadshow，一个用于加速车队采纳的移动演示项目。公司尚未发布正式产品路线图文件，Trimble 收购后合并产品套件的整合计划仍未披露。
