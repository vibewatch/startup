              Platform Science 的主要增长机制——新卡车 OEM 安装——与北美 Class 8 卡车产量直接绑定。2025 年，Class 8 销量同比下降 16% 至 258,000
              辆，原因是货运衰退持续、运营成本升至 $2.25/mile。Daimler 的 2026 年指引为 250,000–290,000 辆，仍低于 2024 年水平。按企业定价基准，每年 Class 8 产量每减少
              10,000 辆，就会从 Platform Science 可服务 OEM 安装渠道中拿走约 $60–120M 年经常性收入潜力。
