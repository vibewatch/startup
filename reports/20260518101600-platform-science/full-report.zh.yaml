        - 客户群以 SMB 为主；相较 Platform Science 聚焦企业客户，NRR 和扩张经济性更低
      - - Trimble Transportation Suite
        - 2022 年资产被 Platform Science 收购
        - 收购倍数未披露
        - 未披露
        - 非内生 ARR 贡献；验证企业车队管理领域的整合胃口
        - 收购来的客户群在流失动态上，可能不同于 OEM 原生渠道自然新增客户
    claimRefs:
