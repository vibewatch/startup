      - number: '5.4'
        title: 差异化、信任与技术风险
        blocks:
          - type: paragraph
            body: >-
              Platform Science 的主要技术差异化来自 OEM 原生集成。CTO Jake Fields 称，「后装硬件的时代已经结束」。Samsara、Motive、Geotab
              等竞争对手依赖后装硬件插接设备或网关，部署需要卡车停运，也需要车队协调人员投入。Platform Science 的 OEM 内嵌模式消除了安装摩擦，降低总拥有成本（无需后装设备成本），并让平台通过直接 OEM
              集成点（CAN 总线、OBD-II、OEM 诊断 API）访问更深层车辆数据，这是后装设备拿不到的。


              信任与安全基础设施包括：SOC 2 Type 2 认证（自 2021 年起）；ISO 27001 认证（Schellman 审计）；端到端加密；遵循 NIST 与 ISO 27001 框架；以及 Customer
              Data Bill of Rights（客户数据权利法案），确认车队客户数据归客户所有、不被出售，并由车队运营商控制。Trust Portal（2026 年 3 月）让车队运营商实时查看安全态势。


              关键技术风险包括 OEM 集中度（三家 OEM 覆盖全部工厂预装量；失去任一 OEM 关系都会实质影响增长）、自有硬件锁定（INSTINCT Gateway 形成单一硬件依赖）、开发者社区规模小于 Samsara
              更大的 App Ecosystem，以及 Trimble 收购后需要把合并产品套件迁移到单一平台，整合复杂度高。IP 透明度低——除营销材料外，Platform Science
              没有公开披露专利或详细技术架构文件，这是一个尽调缺口。
