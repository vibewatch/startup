      - number: '3.2'
        title: 竞争对手画像：规模、融资与战略方向
        blocks:
          - type: paragraph
            body: >-
              Samsara 是最强的平台级竞争对手。作为上市公司（NYSE: IOT），Samsara 拥有 $1.47B ARR（FY2025，同比 +33%）、40,000+ 客户和 2M+ 联网设备，在装机基础和
              R&D 支出上都超过 Platform Science。其开放的 Connected Operations Cloud 覆盖摄像头、车联网遥测、ELD、路线规划、维护和设备追踪。截至 FY2025，Samsara
              企业客户（>$100K ARR 账户）贡献超过 51% ARR，说明其上探大客户成效明显。Samsara 没有与 Daimler、PACCAR 或 Navistar 的 OEM
              工厂预装协议；所有部署都需要后装硬件安装。


              Motive（原 KeepTruckin）拥有约 $501M ARR（2025 年 9 月，同比 +27%）和 100,000+ 客户，客户结构偏 SMB 卡车运输和建筑。其 AI 优先定位——AI
              行车记录仪、司机辅导、预测性维护——以及 Motive Fleet Card（支出管理）使其区别于 Samsara 和 Platform Science。企业客户净美元留存率
              126%，显示大客户账户扩张经济性强。Motive 最近一次融资为 2022 年以 $2.65B 估值融资 $200M；截至 2026 年初，有 IPO 准备报道但未确认。


              Geotab（私营，总部 Oakville Ontario）在全球运营 4M+ 联网车辆，覆盖 160 个国家的 50,000+ 企业和政府客户。其开放车联网遥测 API（MyGeotab SDK）吸引了
              1,200+ 经销商和 300+ 市场集成，形成业内最大的第三方 ISV 生态。Geotab 在政府车队和企业 IT 密集型账户中特别强，因为定制数据集成需求让开放 API 成为结构性要求。Geotab 没有
              OEM 工厂预装渠道，分发完全由经销商驱动。


              Verizon Connect 和 Zonar 是结构上更弱的竞争对手。Verizon Connect 的 G2 评分（39.6）相较 Samsara（99）反映了显著的产品体验缺口，这一缺口是在 Verizon
              2016 年收购 Fleetmatics 和 Telogis 后投资不足逐步累积出来的。Zonar（Continental AG）占据合规 / 安全利基，并已被 Platform Science 取代，不再是
              Daimler 新卡车生产的主要车队 OS 合作伙伴。
