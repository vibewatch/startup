      - number: '7.4'
        title: 财务、人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Platform Science 是私有公司，尚未公开披露收入、EBITDA、烧钱速度或现金跑道。公司截至 2024 年 4 月已融资约 $309 million，运营模式又要求 OEM
              硬件协议、多年企业销售周期、持续 R&D 和 Trimble 收购后整合投入，业务资本密集度很高。硬件资本需求带来前期成本暴露：INSTINCT Gateway 以及相关 OEM 认证投入，是每新增一家 OEM
              伙伴都要承担的重大一次性成本。多年企业合同可能造成收入确认时间错配；考虑到交易对手多为蓝筹客户，客户信用风险较低，但合同到期不续约会形成收入断崖风险。人员风险集中在联合创始人 Jack Kennedy（CEO）和
              Jake Fields（CTO），两人深厚的 OEM 关系和监管专长并不容易替代。Trimble 收购后整合增加管理带宽风险：在维持客户体验和产品速度的同时整合 500+ 名 Trimble
              运输业务员工与全球运营，对现有领导团队是重大执行要求。San Diego 工程人才竞争（靠近 Qualcomm、ServiceNow 及科技相邻领域）和 Bay Area
              超大规模云厂商的远程工作竞争，带来持续招聘风险。收入模式风险在于：Platform Science 的 SaaS +
              应用市场模式需要应用开发者和客户持续参与；如果应用市场达不到临界规模，平台相对垂直整合竞争对手的防御力会下降。
