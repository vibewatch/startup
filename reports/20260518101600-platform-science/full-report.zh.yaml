  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与市场背景
        blocks:
          - type: paragraph
            body: >-
              Platform Science 在车队管理 SaaS 中占据结构性差异化位置：平台预装在 PACCAR、Daimler Truck 和 Volvo Group 生产的新重型卡车中，这些 OEM
              合计占北美重型卡车产量的 70% 以上。OEM 原生路径消除了后装安装成本，降低车队运营商摩擦，并把 Platform Science 嵌入资产采购决策，而不是在售后再争夺注意力。


              核心投资逻辑建立在三根支柱上。第一，OEM 渠道分销带来复利式触达：北美每年 200,000+ 辆新重型卡车年度批次都代表潜在新增联网车辆。第二，ELD
              再认证、数据迁移和司机再培训推高企业切换成本；车队一旦在平台上标准化，留存就更稳。第三，全球车队管理软件市场预计从 2025 年 $25 billion 扩张到 2030 年超过 $45
              billion，为一家专注企业和大型车队的玩家留下可观天花板。


              反向逻辑集中在财务不透明、渠道集中和竞争压力。Platform Science 不披露收入或 ARR，造成重大估值不确定性。超过 70% 的嵌入式车队触达来自三家 OEM
              合作；失去任何一项协议都会实质损害增长轨迹。Samsara 的 AI 套件和 Motive 在 SMB 的广泛渗透，在 OEM 渠道杠杆较低的开放市场板块构成可信竞争威胁。车队管理 SaaS 倍数在 2022 至
              2024 年间压缩 30-40%，若进一步进入收缩周期，回报假设会被侵蚀。
