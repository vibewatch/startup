      - number: '8.2'
        title: 估值框架与可比分析
        blocks:
          - type: paragraph
            body: >-
              Platform Science 的估值受限于公司私有属性和财务指标不披露。这里采用的框架依赖基于车队数量的 ARR 估算、以 Samsara 为锚的公开市场倍数、Motive、Spireon 和 Fleet
              Complete 的私有市场 M&A 可比，以及从 2024 年 4 月成长轮反推的隐含估值。


              ARR 估算：截至 2025 年中，公司约管理 53,500 辆具名商用车；按行业标准每辆卡车每月 $10-20 的 SaaS 定价，ARR 估计为 $100-250 million。基准假设采用 $175
              million 中点，同时承认 OEM 谈判价格可能与开放市场费率有实质差异。


              公开可比——Samsara（IOT）：FY2025 财年 Q4 ARR 约 $937 million，公开市场交易倍数为 15-20x ARR。考虑 Platform Science 规模较小且财务不透明，给予
              25-35% 私有市场折价，得到 10-15x ARR 的隐含倍数，对应 $1.5-3.75 billion 企业价值区间。


              私有市场可比：Motive 融资时估值 $2.2 billion、约为估计 ARR 的 8-12x；Spireon 以 $500 million 被收购，约 4-6x 收入；Geotab 拥有 3.5
              million 辆联网车，分析师估计私有估值为 $4-6 billion，这些都为区间提供锚点。Platform Science 的 OEM 原生护城河支撑其相对 Spireon 和 Fleet Complete
              获得溢价，但在证明 IPO 就绪度前，倍数很可能低于 Samsara 的公开市场倍数。
