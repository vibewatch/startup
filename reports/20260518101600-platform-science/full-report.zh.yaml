chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >
              Platform Science 注册于 California 州 San Diego（9560 Towne Centre Dr, Suite 200, San Diego, CA 92121），由 Jack
              Kennedy 和 Jake Fields 于 2015 年创立，目标是用开放、软件原生的联网车辆平台取代碎片化的后装硬件，重塑商用车队管理。公司的旗舰产品 Virtual Vehicle®
              是一个开放应用平台，原生运行在卡车上——由 OEM 合作伙伴在工厂生产环节预装——让企业车队无需安装后装硬件，就能通过一个统一界面接入车联网遥测、合规、安全、司机工作流和第三方应用。

              Virtual Vehicle 相当于商用卡车的操作系统，把卡车车辆数据（J1939/RP1226 信号）、面向司机的 Samsung Galaxy Tab Active
              平板、云基础设施，以及不断扩大的车联网遥测服务商（TSP）、第三方应用开发者和 OEM 合作伙伴市场连接起来。平台架构释放了超过 1 万亿个累计数据点，覆盖超过 60 亿英里行驶里程，每年约产生 150 亿次
              API 调用，显示其已经打入大量车队。

              商业模式以企业 SaaS 订阅为主，瞄准希望集中管理设备、应用和合规工作流的大型商用卡车车队（通常 200+ 辆车）。收入来自平台按车每月收取的订阅费，以及可选的应用市场参与费。Platform Science
              只通过战略性 OEM 嵌入和直销企业客户获客，并用一个供车队创新的「无限画布」把自己与单点车联网遥测厂商区分开。公司入选 Fast Company World's Most Innovative
              Companies（2022），在 2022 和 2023 年 FreightTech 25 Awards 中均排名第 2，并两次获得 Forbes Best Startup Employer
              认可（2024、2025）。

              关键结构性优势在于 OEM 原生分发：车队从 Daimler（Freightliner/Western Star）、Navistar（International Trucks）或
              PACCAR（Kenworth/Peterbilt）购买新车时，可能直接拿到已预装 Virtual Vehicle 的车辆，从而消除传统硬件安装门槛。新车进入车队会持续扩大装机基础，也激励 TSP
              和开发者在平台上开发。

              但平台定位于企业客户，定价不透明（需联系供应商）、要求多年合同、配置流程复杂。独立评测将这些问题列为小型车队和车主运营商的重要限制：$600+ 的前置硬件成本和上手复杂度都会增加摩擦。
