companyProfile:
  summary: >-
    Platform Science 是一家总部位于 San Diego 的车队管理软件公司，成立于 2015 年，在 PACCAR（Kenworth、Peterbilt）、Daimler
    Truck（Freightliner、Western Star）和 Volvo Group（Volvo、Mack）生产的新型重卡中预装 OEM 原生平台。Virtual Vehicle 平台为企业和大型车队运营商提供 ELD
    合规、司机工作流管理、实时车联网遥测，以及开放应用市场，支持 400 多个第三方集成。Platform Science 服务 Werner Enterprises（约 8,000 辆卡车）、U.S. Xpress（约 6,500
