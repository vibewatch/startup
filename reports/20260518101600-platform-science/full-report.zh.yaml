      - number: '1.3'
        title: 融资历史、估值与投资人格局
        blocks:
          - type: paragraph
            body: >
              Platform Science 自成立以来已通过多轮风险投资和战略投资融资约 $293–$309M。最近一轮公开确认融资是 2024 年 4 月 9 日宣布的 $125M 增长资本注入；此前多轮融资在 2022
              年 Series C 达到阶段高点，当时 SoftBank Vision Fund 2 领投 $115M，公司投后估值 $575M。Yahoo Finance 和 Telematics Wire 引用的截至
              2024 年 4 月累计融资约 $309M（包括 2017 年至 2022 年初若干未披露轮次），Tracxn 报告的总额略低，为 $293M。

              2024 年 4 月增长轮的突出之处在于战略方参与深：投资方包括 Cummins（NYSE: CMI）、PACCAR（NASDAQ:PCAR）、C.R. England、Daimler Truck North
              America、RyderVentures（NYSE:R）和 Schneider National（NYSE:SNDR），同时有新财务投资方 Activant Capital、BDT & MSD
              Partners、Manhattan Venture Partners，以及 8VC、NewRoad Capital Partners、Prologis Ventures 继续跟投。主要卡车
              OEM（Daimler、PACCAR）和大型车队运营商（Schneider、Ryder、C.R. England）出现在投资人名单中，说明 Platform Science 与既有物流产业之间存在战略绑定。

              Platform Science 未披露 2024 年之后融资轮估值，因此最后确认的投后估值仍是 2022 年 4 月 Series C 的 $575M。考虑到 2025 年 2 月 Trimble
              收购（条款未披露），隐含企业价值很可能已经显著上升，但目前没有第三方更新估值或 IPO 披露确认当前数字。一些市场聚合平台（Tracxn）将当前估值放在付费墙后，PitchBook 也同样隐藏该信息。

              投资人基础呈双轨结构：财务 VC 提供增长跑道，战略 OEM/车队运营商绑定商业利益。这个结构既带来协同（客户也是投资人），也带来治理风险（投资方兼客户的车队与独立车队销售之间可能存在利益冲突）。
