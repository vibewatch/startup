            - 低 — 仅定性
            - 强 — 投资者客户
            - 高 — 2022 年以来 4,000 辆卡车
        - label: Mesilla Valley Transportation
          values:
            - 高 — 案例研究 + 多年期
            - 中 — 提到燃油 / 安全改善
            - 强 — 2024 年导航扩张
