  - id: TV002
    title: 投资逻辑 vs 反向逻辑
    columns:
      - 论点
      - 证据基础
      - 什么会改变判断
    rows:
      - - OEM 原生护城河带来结构性分销优势，后装竞争对手拿不到
        - 三个 OEM 合作覆盖北美重卡产量的 70%+
        - 竞争对手 OEM 与 Samsara 或 Motive 签署排他协议
      - - Werner、U.S. Xpress、Schneider、C.R. England 等大型企业客户提供规模化验证
        - 已点名客户公告且公开披露车队规模
        - 前五大车队客户出现公开披露的重大流失事件
      - - ELD 和自动驾驶合规等监管顺风扩大总可用市场（TAM）和切换成本
        - FMCSA 强制要求和新兴 AV 合规框架
        - FMCSA 放松 ELD 要求，或转向开放 API 标准
      - - 财务不透明制造估值不确定性和尽调风险
        - 未公开披露年经常性收入（ARR）、收入、利润率或净留存率（NRR）
        - 公司发布经审计财务，或提交 S-1
      - - OEM 渠道集中：通过三个合作伙伴触达 70%+，构成单点失效风险
        - 所有主要部署都绑定 PACCAR、Daimler Truck 和 Volvo Group
        - OEM 合作伙伴宣布不续约、竞争性排他或平台内化
      - - 司机使用阻力可能损害净留存率（NRR）和平台扩张经济性
        - 独立调查显示，53% 司机认为驾驶室内技术让工作更难
        - Platform Science 发布 NPS 高于 50 或净留存率（NRR）高于 115% 的数据予以反驳
