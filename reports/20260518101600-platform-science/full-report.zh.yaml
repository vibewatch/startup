      - number: '3.3'
        title: 定价、分发与渠道动态
        blocks:
          - type: paragraph
            body: >-
              车队车联网遥测定价统一采用按车、按月 SaaS 结构，合同期 12–36 个月；硬件成本要么打包进订阅，要么单独收费。主流平台的企业定价为每车每月
              $45–100+，差异取决于产品层级、车队规模和合同期限。Samsara 企业定价（报道为 $50–75/车/月）包含硬件摊销；Motive（$45–70）价格略低，但功能可比。Platform Science
              企业定价（$45–85/车/月）与纯后装同业相当，差异点在于工厂交付消除硬件安装成本和延迟。


              Geotab 经销商渠道造成定价不透明：1,200+ 经销商各自设定利润率，根据经销商和套餐不同，价格区间可从 $15–50/车/月。这种可变性让 Geotab 在车队买方要求标准化席位定价的竞争性 RFP
              中处于结构性劣势。Verizon Connect 受益于电信捆绑定价（连接 + 车队软件），对想要单一账单的小型车队有吸引力，但在纯 ROI 评估中竞争力较弱。


              分发渠道是最深的结构性差异。Platform Science 的 OEM 认证工厂分发把新车买家的销售周期压缩到零——Virtual Vehicle 随车预装交付，省掉后装硬件采购、安装排期和 MDM
              配置通常需要的 6–12 周。Samsara 和 Motive 大量投入企业直销；Samsara 由 NPS 驱动的先落地再扩张动作，以及 Motive 面向卡车运输的行业定价，是二者主要 GTM
              杠杆。Geotab 依赖经销商网络，但已开始为 $500K ARR 以上账户搭建企业直销动作。
