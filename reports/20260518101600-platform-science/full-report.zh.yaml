      - number: '8.4'
        title: 建议、尽调问题与投资逻辑监控
        blocks:
          - type: paragraph
            body: >-
              建议：有条件正面。Platform Science 的投资画像有吸引力，核心支撑是结构性差异化的 OEM
              分销护城河、大型企业客户规模化证明，以及受监管顺风推动的大型可触达市场。建议是有条件正面，而非高确信度正面，原因在于三项重大约束：完全缺乏财务披露、OEM 渠道集中在三家伙伴，以及司机采纳摩擦可能损害
              NRR。若要高确信度投资，必须满足尽调问题表中列出的前置条件。


              进入纪律：若隐含进入估值为 $1.2-1.8 billion，基准情景 3-4 年 2-4x 回报具备吸引力，但并不突出。若财务尽调确认 ARR 高于 $120 million、NRR 高于 110%、毛利率高于
              68%，乐观情景 5-8x 回报才足以支持高确信度参与。估值纪律要求初始进入价格上限为 $2.0 billion。


              退出准备度：考虑到财务不透明，Platform Science 当前尚未达到 IPO 就绪状态，但具备在 2027-2029 年窗口 IPO 或战略收购的定位。最可能的近期退出是 OEM 战略收购，最可能买方是
              PACCAR 或 Daimler Truck；随着联网卡车车队成为 OEM 服务收入战略的核心，这些厂商可能寻求完全控制嵌入式平台经济。
