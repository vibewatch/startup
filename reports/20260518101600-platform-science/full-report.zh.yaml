  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Platform Science 处在联邦运输安全监管、新兴数据隐私法和联网车辆网络安全要求演进的交叉点，监管暴露面很密。电子日志设备（Electronic Logging
              Device，ELD）强制令（FMCSA 49 CFR Part 395）是 Platform Science 的核心合规锚点：Platform Science 的 ELD 产品已在 FMCSA
              注册，但必须在持续的 FMCSA 再认证周期中保持技术规范合规。FMCSA 任何不合规认定——无论来自软件更新、第三方审计还是执法行动——都可能导致认证撤销，迫使客户车队在 FMCSA 整改窗口内切换 ELD
              供应商，带来急性流失风险。公司于 2026 年 5 月进入加拿大，在 Daimler CTP2 卡车上部署了首个根据 Transport Canada ELD Technical
              Standard（TP15205）认证的加拿大 ELD——该市场的认证要求不同于美国。数据隐私风险重大且仍在上升：Platform Science
              大规模收集司机位置、生物识别（疲劳监测）、车辆遥测和行为数据。California CCPA/CPRA（公司所在州），叠加 Trimble 收购带来的欧盟客户国际 GDPR 暴露，形成多司法辖区合规负担。FTC
              扩大的数据安全执法姿态，以及 NHTSA 拟议的联网车辆隐私规则，进一步增加监管层级。IP 风险中等但真实存在：Platform Science
              在车辆应用平台上拥有不断增长的专利组合，但直接竞争对手（Samsara、Motive）也有大量专利资产，带来潜在交叉许可或侵权诉讼暴露。截至 2026 年 5
              月，没有公开报道已知活跃诉讼；但缺少报道不应被视为确认不存在风险。
