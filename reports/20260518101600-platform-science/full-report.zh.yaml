      - number: '6.4'
        title: 扩张动态与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Platform Science 的落地后扩张主要由开放应用市场模式驱动：车队一旦激活 Virtual Vehicle，就可以通过 OTA
              启用更多应用（导航、安全、工作流、合规、薪酬透明度），无需更换硬件。这一架构应能在合同生命周期内提高单辆在管卡车收入。客户集中度是重大风险：历史上具名的前两大账户（Werner Enterprises 约
              8,000 辆卡车，U.S. Xpress 约 6,500 辆）合计约占公开宣布卡车基数的一半。重要的是，U.S. Xpress 已在 2023 年被 Knight-Swift Transportation
              收购，收购后与 Platform Science 的关系状态并未公开确认——这可能意味着锚定账户已经流失或部分流失。Trimble 收购（2025 年 2 月）加入国际车队账户和 Trimble
              导航软件客户，降低了对美国 OEM 原生部署的比例依赖。ATA Corporate Partner 身份（2025 年 7 月）打开了更广泛的车队会员管线。Platform Science 的
              FreightTech 25 排名从 #2（2022–2023）滑至 #4（2026），这是一个温和信号：Samsara、Motive 等对手在大型托运方技术采购者中的竞争压力可能正在上升。
