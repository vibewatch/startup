        - 结果具体性
        - 留存信号
        - 生产成熟度
      rows:
        - label: Werner Enterprises
          values:
            - 高 — 具名高管引用 + 新闻稿
            - 低 — 仅定性
            - 强 — 4+ 年扩张
            - 高 — 2020 年以来持续使用
        - label: C.R. England
