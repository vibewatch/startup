    title: 推荐逻辑：从市场位置到投资立场
    type: flow
    data:
      nodes:
        - label: OEM 原生分销护城河（PACCAR、Daimler Truck、Volvo Group）
        - label: 大型企业客户验证（Werner、U.S. Xpress、Schneider、C.R. England）
        - label: 巨大且增长中的 TAM（到 2030 年 $25B 至 $45B）
        - label: 监管顺风（ELD、AV 合规要求）
        - label: 财务未披露 — 重大估值不确定性
        - label: OEM 渠道集中风险（3 个合作伙伴，70%+ 触达）
        - label: 有条件正面 — 建立高确信仓位前先推进财务尽调
      edges:
        - from: OEM-Native Distribution Moat (PACCAR, Daimler Truck, Volvo Group)
          to: Qualified Positive — Proceed to Financial Diligence Before Conviction Entry
        - from: Large Enterprise Customer Proof (Werner, U.S. Xpress, Schneider, C.R. England)
          to: Qualified Positive — Proceed to Financial Diligence Before Conviction Entry
        - from: Large and Growing TAM ($25B to $45B by 2030)
          to: Qualified Positive — Proceed to Financial Diligence Before Conviction Entry
        - from: Regulatory Tailwinds (ELD, AV Compliance Mandates)
          to: Qualified Positive — Proceed to Financial Diligence Before Conviction Entry
        - from: Undisclosed Financials — Material Valuation Uncertainty
          to: Qualified Positive — Proceed to Financial Diligence Before Conviction Entry
        - from: OEM Channel Concentration Risk (3 Partners, 70%+ Reach)
          to: Qualified Positive — Proceed to Financial Diligence Before Conviction Entry
