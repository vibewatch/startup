      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >
              车队管理买方主要按车队规模分层，规模决定购买行为、预算归属、合同条款和功能需求。Platform Science 的 GTM 聚焦企业级和中高端中型市场。

              **企业车队（>500 辆）：** 买方通常是大型上市承运商（Schneider National、Werner Enterprises、J.B. Hunt、C.R. England、Covenant
              Logistics）的运营副总裁、安全副总裁或 CIO/IT 副总裁。多数情况下预算归首席运营官所有，安全和 IT 负责人共同审批。多年合同（通常 3–5 年）下，年度软件支出为每车每月 $50 到
              $100+。采用触发因素包括 OEM 工厂预装（消除硬件资本开支）、ELD 强制令续约周期、安全项目升级和保险承运商保费谈判。企业买方要求企业级 SSO、SAML 集成、专属客户经理和定制 SLA 保障。

              **中型市场车队（50–499 辆）：** 预算所有者通常是区域承运商或私人车队的运营总监或车队经理。支出为 $30–$60/车/月。中型市场买方要求 12–18 个月内 ROI
              转正、模块化功能采购，并能证明与既有 TMS/ERP 系统互操作。Samsara 和 Motive 最积极地服务这一细分；Platform Science 主要在购车节点通过 OEM 工厂预装竞争。

              **小型车队 / 车主运营商（<50 辆）：** 这类买方支出低于 $35/车/月，按车队数量是最大细分，但收入贡献最低。他们对价格高度敏感，偏好即插即用的 ELD 合规方案。Platform Science
              明确瞄准更大的企业客户；从产品定价和部署模式看，它并不面向车主运营商。

              **OEM 渠道：** 关键次级买方是 OEM 合作伙伴本身（Daimler、Navistar、PACCAR），它们在生产线上将 Virtual Vehicle 打包进购车或订阅。OEM 车队管理销售通常与经销商
              / OEM 延保服务协议捆绑，实际上把分发决策从车队技术采购中心上移到 OEM 销售团队和车队采购部门。
