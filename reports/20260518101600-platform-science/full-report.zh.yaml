      - number: '7.3'
        title: 伙伴、渠道与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Platform Science 的主要增长引擎——OEM 卡车出厂预装 Virtual Vehicle 硬件——带来尖锐的渠道集中风险。三家 OEM 伙伴（Daimler Truck North
              America、PACCAR 和 Navistar）几乎控制了 Platform Science 所有新增车队客户获取的分销入口。OEM 合作是长期关系，也存在重新谈判周期；任何一家 OEM
              若收购竞争性车联网平台（Daimler Truck 已在欧洲用自有软件栈这样做）或战略转向替代伙伴，都可能实际上终止 Platform Science 对该 OEM 年产量的触达。云基础设施（推测为
              AWS）在数据处理和 API 层是单一供应商依赖；价格调整、服务条款修改或持续可用性事件，都可能实质影响 Platform Science 的成本结构和服务可靠性。资本提供方也集中：Cummins、Daimler
              Truck、PACCAR、Prologis 和 RyderVentures 持有战略股权，同时也是伙伴或客户——如果战略投资者利益偏离独立股东价值最大化，就会产生治理风险。Trimble
              现在是持股方并拥有董事席位，在 CoPilot 导航软件和运输数据业务上有战略利益；它可能运用董事会影响力，把 Trimble 旧产品整合置于 Platform Science 独立路线图之上。
