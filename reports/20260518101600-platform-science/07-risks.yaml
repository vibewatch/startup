company:
  name: Platform Science
chapter:
  number: 7
  title: Risks
  summary: 'Platform Science faces material risks across five domains. Regulatory risk centers on FMCSA ELD re-certification
    cycles, evolving federal and state data privacy law, and TSA/NHTSA cybersecurity mandates for connected vehicles. Operational
    risk is dominated by OEM hardware supply chain concentration (NXP semiconductors, Samsung tablets), cloud infrastructure
    single-vendor dependency, and post-Trimble integration execution complexity. Partner risk is most acute in OEM channel
    concentration: Daimler Truck, PACCAR, and Navistar control new-fleet distribution access; loss of any OEM relationship
    would impair new-customer acquisition. Financial risk includes undisclosed burn rate and capital intensity, plus potential
    revenue concentration in top 2-3 customers. People risk includes CEO/founder key-person dependency and post-Trimble cultural
    integration challenges. The most asymmetric risk is OEM channel loss combined with simultaneous customer concentration
    — Werner or a second large anchor account departure could produce a revenue cliff.'
sections:
- id: SR-S01
  title: Regulatory and Legal Risk
  body: 'Platform Science operates at the intersection of federal transportation safety regulation, emerging data privacy
    law, and evolving cybersecurity mandates for connected vehicles — creating a dense regulatory surface area. The Electronic
    Logging Device (ELD) mandate (FMCSA 49 CFR Part 395) is Platform Science''s primary compliance anchor: Platform Science''s
    ELD product is FMCSA-registered, but must maintain technical specification compliance through ongoing FMCSA re-certification
    cycles. Any FMCSA finding of non-compliance — whether through software update, third-party audit, or enforcement action
    — could result in decertification that would force customer fleets to switch ELD providers within the FMCSA''s remediation
    window, creating acute churn risk. The company expanded into Canada in May 2026, deploying the first Canadian ELD certified
    under Transport Canada''s ELD Technical Standard (TP15205) on a Daimler CTP2 truck — a market with different certification
    requirements than the US. Data privacy risk is material and growing: Platform Science collects driver location, biometric
    (fatigue monitoring), vehicle telemetry, and behavioral data at scale. California''s CCPA/CPRA (as the company''s home
    state), plus international GDPR exposure for Trimble-acquired EU customers, creates a multi-jurisdictional compliance
    burden. The FTC''s expanded data security enforcement posture and proposed Connected Vehicle Privacy Rule from NHTSA add
    further regulatory layers. IP risk is moderate but real: Platform Science holds a growing patent portfolio in vehicle
    application platforms, but direct competitors (Samsara, Motive) also have significant patent estates, creating potential
    cross-licensing or infringement litigation exposure. No known active litigation has been publicly reported as of May 2026,
    but absence of reporting should not be treated as confirmed absence of risk in a private company.'
