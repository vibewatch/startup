  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: OEM-contract-terms
    missingEvidence: DTNA, PACCAR, and Navistar OEM partnership contract terms — exclusivity, renewal schedule, termination
      provisions — are not publicly disclosed.
    whyItMatters: OEM channel concentration is the single most asymmetric risk; without knowing contract terms, the probability
      and notice period of partner defection cannot be assessed.
    diligencePath: Request OEM partnership agreements in data room; specifically review exclusivity carve-outs, minimum commitment
      volumes, and termination for cause provisions.
    relatedQuestionRefs:
    - QR012
    - QR014
  - type: private-evidence-only
    severity: material
    topic: financial-runway
    missingEvidence: Revenue, ARR, burn rate, cash runway, and post-Trimble capital structure have not been publicly disclosed.
    whyItMatters: Capital intensity of the OEM hardware model, post-Trimble integration costs, and multi-year sales cycles
      make burn rate assessment critical for thesis evaluation.
    diligencePath: Request CFO presentation on burn rate, ARR, NRR, and runway; review post-Trimble pro forma capitalization
      table.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR025
    - QR028
    - QR019
