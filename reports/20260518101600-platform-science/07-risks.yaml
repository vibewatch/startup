- id: TR002
  title: Operational Quality Security Risk Register
  notes: Rows ordered by estimated severity. Mitigation maturity 1=low, 3=high.
  columns:
  - Failure Mode
  - Likelihood
  - Severity
  - Mitigation Maturity
  - Residual Exposure
  - Unresolved Gap
  rows:
  - - NXP semiconductor supply disruption delays INSTINCT Gateway production
    - Medium (prior shortage demonstrated 2020–2023)
    - High — delays new OEM truck activation and fleet acquisition
    - 2 — NXP is sole-source; limited dual-sourcing evidence
    - High during shortage events
    - Confirm NXP supply agreement terms and buffer inventory level with OEM partners
  - - Samsung Galaxy Tab Active3 product discontinuation or component shortage
    - Low-Medium — Samsung refreshes product line every 2–3 years
    - Medium — hardware platform migration across existing fleets is operationally disruptive
    - 2 — no confirmed successor device partnership announced
    - Medium — increases as Tab Active3 ages
    - Request roadmap for hardware platform transitions and estimated fleet migration cost
  - - Cloud infrastructure outage (AWS/GCP) affecting ELD data synchronization
    - Low — hyperscaler SLAs are 99.9%+
    - High — ELD offline >7 consecutive days triggers FMCSA violation
    - 3 — multi-region deployment assumed; offline mode in device (7-day buffer)
    - Low-Medium — brief outages tolerable; multi-day events material
    - Confirm cloud redundancy architecture and 7-day offline capability in all production firmware
  - - Post-Trimble integration execution failure (product, engineering, customer success)
    - Medium — M&A integration typically takes 18–36 months
    - High — customer churn, product velocity loss, or talent attrition during integration
    - 2 — integration is early-stage (Feb 2025 close)
    - High during 2025–2026 integration window
    - Request integration roadmap, combined product backlog, and key personnel retention plan
  - - Cybersecurity intrusion via vehicle data bus or telematics API
    - Low — no public breach reported; SOC 2 / ISO 27001 in place
    - High — safety, regulatory, and reputational consequences
    - 3 — SOC 2 Type 2 since 2021; ISO 27001; Fleet Defender Neural Sentinel partnership
    - Moderate — expanding attack surface as fleet count grows
    - Review penetration test results, incident response plan, and cyber insurance coverage
