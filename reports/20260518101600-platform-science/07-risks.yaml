- id: SR-S03
  title: Partner, Channel, and Dependency Risk
  body: 'Platform Science''s primary growth engine — factory-installed Virtual Vehicle hardware on OEM trucks — creates an
    acute channel concentration risk. Three OEM partners (Daimler Truck North America, PACCAR, and Navistar) control distribution
    access for virtually all of Platform Science''s new-fleet customer acquisition. OEM partnerships are long-term relationships
    with renegotiation cycles; any OEM that acquires a competing telematics platform (as Daimler Truck has done in Europe
    with its own software stack) or makes a strategic shift to an alternative partner could effectively terminate Platform
    Science''s access to that OEM''s annual production volume. Cloud infrastructure (presumably AWS) is a single-vendor dependency
    at the data processing and API layer; pricing changes, terms-of-service modifications, or sustained availability events
    could materially affect Platform Science''s cost structure and service reliability. Capital provider concentration: Cummins,
    Daimler Truck, PACCAR, Prologis, and RyderVentures hold strategic equity stakes and are also partners or customers — creating
    a governance risk if strategic investor interests diverge from independent shareholder value maximization. Trimble, now
    a shareholder with a board seat, has strategic interests in its CoPilot navigation software and transportation data business;
    it could exercise board influence in ways that prioritize Trimble-legacy product integration over Platform Science''s
    independent roadmap.'
  claimRefs:
  - CR021
