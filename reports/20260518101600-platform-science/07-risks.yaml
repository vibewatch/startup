- id: TR001
  title: Regulatory Legal Risk Register
  notes: Rows ordered by severity. Residual exposure reflects risk after known mitigations.
  enumeration: true
  enumerationScope:
    coverage: partial
    basis: Rows represent identified regulatory and legal risk areas based on FMCSA regulations, Transport Canada ELD mandate,
      CCPA/CPRA, NHTSA cybersecurity guidance, and Platform Science patent and IP landscape review.
  columns:
  - Rule / License / Case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual Exposure
  - Diligence Path
  rows:
  - - FMCSA ELD Technical Specification (49 CFR 395)
    - United States federal
    - Registered and compliant as of 2026-05
    - Medium — re-certification risk at each spec update
    - High — decertification would force mass customer ELD switch
    - Active FMCSA registration; engineering compliance team; SOC 2 Type 2
    - Moderate — single software bug or audit finding could trigger remediation window
    - Request FMCSA compliance audit history; review ELD re-certification schedule
  - - Transport Canada ELD Technical Standard (TP15205)
    - Canada
    - Certified on DTNA CTP2, May 2026 (first Canadian PS ELD)
    - Low — recently certified
    - Medium — Canadian fleet customers at risk if certification lapses
    - Transport Canada certification; partnership with DTNA for initial deployment
    - Low short-term; increases as Canadian fleet count grows
    - Confirm certification expiry and re-certification obligations
  - - CCPA / CPRA (California Consumer Privacy Act / Privacy Rights Act)
    - California, USA
    - Subject to compliance (headquartered San Diego, CA)
    - Medium — enforcement activity increasing
    - High — driver location, biometric, and behavioral data collection at scale
    - Customer Data Bill of Rights (published); Trust Portal; ISO 27001; consent management
    - Moderate — multi-fleet, multi-driver data pipeline creates ongoing compliance surface
    - Review privacy policy, consent flows, data retention schedule, and driver opt-out mechanism
  - - GDPR (General Data Protection Regulation)
    - EU/EEA (via Trimble-acquired EU fleet customers)
    - Compliance obligations triggered by Trimble acquisition (EU fleet customers)
    - Medium — post-acquisition compliance mapping in progress
    - High — EU data transfer, processing, and breach notification requirements
    - Trimble legacy GDPR compliance framework; legal counsel assessment post-acquisition
    - Material — EU compliance posture post-acquisition not yet confirmed in public materials
    - Request EU data processing agreements (DPAs) and data transfer mechanism documentation
  - - NHTSA Connected Vehicle Cybersecurity Guidance / Proposed Rule
    - United States federal (proposed)
    - Proposed rulemaking phase; not yet enacted
    - Medium — rulemaking timeline 18–36 months
    - Medium — may require cybersecurity program documentation, reporting, and certification
    - Werner Fleet Defender Neural Sentinel deployment signals proactive posture
    - Low short-term; increases as rule is finalized
    - Monitor NHTSA ANPRM/NPRM timeline; assess gap between current posture and proposed requirements
  - - Platform Science IP / Patent Portfolio
    - USA / International
    - Active patent holder; no known litigation as of 2026-05
    - Medium — competitor patent estates (Samsara, Motive) may create cross-licensing pressure
    - Medium — offensive or defensive IP litigation could absorb management bandwidth and legal cost
    - Active patent filing program; general counsel oversight
    - Moderate — private company, no patent litigation disclosures required
    - Review patent portfolio scope, pending applications, and FTO (freedom to operate) analysis
