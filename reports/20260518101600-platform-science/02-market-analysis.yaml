callouts:
- calloutType: strength
  title: OEM Distribution Creates Structural Market Access Advantage
  body: 'North America''s Class 8 fleet management market is projected to grow from 19.2 million active systems in 2024 to
    33.2 million by 2029 (CAGR 11.6%). Within this, the OEM-embedded segment is growing at 13.83% CAGR — faster than aftermarket.
    Platform Science is the leading independent software layer for three OEM partners covering approximately 80% of North
    American Class 8 production, creating a compounding distribution advantage that aftermarket-only competitors (Samsara,
    Motive, Geotab) cannot replicate without OEM agreements.

    '
  claimRefs:
  - CM004
  - CM008
  - CM009
  - CM033
- calloutType: risk
  title: Freight Recession Slows OEM-Dependent Growth Channel
  body: 'Platform Science''s primary growth mechanism — new truck OEM installs — is directly tied to North American Class
    8 truck production volumes. In 2025, Class 8 sales fell 16% year-over-year to 258,000 units, driven by a prolonged freight
    recession and elevated operating costs of $2.25/mile. Daimler''s 2026 guidance of 250,000–290,000 units remains below
    2024 levels. Every 10,000-unit decline in annual Class 8 builds removes approximately $60–120M of annual recurring revenue
    potential from Platform Science''s addressable OEM-install channel, based on enterprise pricing benchmarks.

    '
  claimRefs:
  - CM011
  - CM012
  - CM014
  - CM025
- calloutType: insight
  title: Value Gap Creates Replacement Opportunity for Integrated Platforms
  body: 'Escalent''s Fleet Advisory Hub 2025 research reveals that fewer than 45% of fleet decision-makers strongly agree
    their telematics solutions fully meet their needs, and only 40–60% report actually experiencing promised operational benefits.
    This telematics ''value gap'' — driven by data silos, integration complexity, and lack of implementation support — creates
    a differentiation opportunity for Platform Science''s integrated open-platform approach. As fleets seek to consolidate
    fragmented vendor stacks onto a single OS, an OEM-native platform with a curated app marketplace is better positioned
    to address this gap than pure ELD point solutions.

    '
  claimRefs:
  - CM029
  - CM030
  - CM031
