  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: global-market-expansion
    missingEvidence: Revenue contribution and integration status of Trimble's global telematics customer base acquired February
      2025; whether European and international customers are actively billed on Virtual Vehicle or still on legacy Trimble
      platform
    whyItMatters: Cannot accurately bound Platform Science's current SAM vs. expanded global TAM without knowing the pace
      of customer migration from legacy Trimble systems
    diligencePath: Request customer migration plan and revenue breakdown (NA vs. international) from company data room; cross-reference
      Trimble's final 10-K for customer count transferred
    relatedQuestionRefs:
    - QM015
  - type: missing-source
    severity: material
    topic: cybersecurity-incidents
    missingEvidence: Specific documented cybersecurity incidents involving Platform Science, Virtual Vehicle data, or its
      OEM partner telematics infrastructure; FMCSA enforcement actions against Virtual Vehicle ELD certifications
    whyItMatters: 60% of global telematics platforms experienced a breach in 2023; Platform Science's security posture and
      incident history are material to risk assessment
    diligencePath: Request SOC 2 Type II certification, penetration test results, and incident history from company; check
      FMCSA ELD device revocation list for Platform Science entries
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: material
    topic: price-compression
    missingEvidence: Fleet management industry pricing trend data showing whether per-vehicle-per-month pricing is compressing
      as competition intensifies among Samsara, Motive, Geotab, and OEM-native platforms
    whyItMatters: Price compression would reduce Platform Science's unit economics and limit upsell expansion opportunities;
      Samsara's 3-year contract lock-in suggests pricing pressure is a real concern
    diligencePath: Survey recent RFP outcomes for enterprise fleet contracts; monitor Samsara and Motive earnings commentary
      on pricing; review secondary market analyst reports on telematics pricing trends
    relatedQuestionRefs:
    - QM026
