- id: market-sizing-tam-sam-som
  title: 'Market Sizing: TAM, SAM, and SOM'
  body: 'Multiple analyst sources provide materially different estimates for fleet management and telematics market size depending
    on the scope definition, geography, and inclusion criteria. We present three levels of analysis to contextualize Platform
    Science''s opportunity.

    **Global TAM:** The global fleet management market reached approximately $27 billion in 2025 and is expected to grow to
    $30.1 billion in 2026 and $122.3 billion by 2035, at a CAGR of 16.9% (Global Market Insights, December 2025). A narrower
    measure, global fleet telematics specifically (excluding FMS software without telematics), reached $10.42 billion in 2025
    and is projected to reach $21.95 billion by 2032 at an 11.2% CAGR (MarketsandMarkets, 2025). The discrepancy arises from
    whether fleet management software (route planning, dispatch, TMS integration) is included alongside hardware and telematics
    services.

    **SAM — North America:** The North America commercial vehicle telematics market is sized at $24.83 billion in 2025 and
    is expected to expand to $48.31 billion by 2031 at a 13.67% CAGR (Mordor Intelligence, 2026). The United States alone
    accounts for 77.64% of North America''s share ($19.3 billion in 2025), with Canada at approximately 16% and Mexico at
    6%. The US fleet management software market independently is estimated at $11.34 billion in 2025, projected to reach $17.63
    billion by 2030 at a CAGR of 9.2% (MarketsandMarkets, 2025). These divergent estimates reflect whether hardware OEM revenue,
    telematics services, and fleet management applications are counted separately or together.

    **Active installed base:** The total number of fleet management systems in active use in North America is forecast to
    grow from approximately 19.2 million units at end of 2024 to 33.2 million units by 2029, a CAGR of 11.6%, representing
    market penetration growth from 56.8% to 84.7% of non-privately owned commercial vehicles in fleet use (ResearchAndMarkets/Berg
    Insight, 2025).

    **Platform Science''s SOM:** Platform Science''s SOM is primarily determined by its three OEM partnerships: Daimler Truck
    NA, Navistar (International), and PACCAR (Kenworth/Peterbilt), which collectively represent approximately 80% of North
    American Class 8 truck production volume. At a North American annual build rate of 250,000–290,000 Class 8 units (2026
    consensus) and assuming 10-year vehicle lifetimes, the OEM-partnered installed fleet base grows by roughly 200,000–230,000
    units per year. At an enterprise pricing range of $50–$100/vehicle/month, the incremental annual revenue potential from
    new OEM builds alone is $120–$276 million per year. Current penetration estimates (500K+ installed units per ResearchAndMarkets)
    at enterprise pricing imply a current revenue run-rate floor of $300–$600M ARR — consistent with the growth capital trajectory
    and headcount scale, though not confirmed by public disclosures.

    '
