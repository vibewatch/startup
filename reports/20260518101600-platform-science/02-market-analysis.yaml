  rows:
  - - FMCSA ELD mandate (HOS compliance for 3.5M CMV drivers)
    - ↑ Accelerating
    - Regulatory driver
    - Near-term (already enforced; June 2025 expansion)
    - 'Baseline: 3.5M drivers mandated; 900+ registered ELD devices; ~$4.89B ELD market 2024'
    - ELD compliance is table-stakes for Virtual Vehicle; low-cost aftermarket competitors can undercut on ELD alone
    - Monitor FMCSA ELD revocation activity; confirm PS device certifications renewed
  - - EPA Phase 3 GHG rules (model-year 2027 trucks, real-time emissions data)
    - ↑ Accelerating
    - Regulatory driver
    - Medium-term (2 to 4 years)
    - +3.2% estimated impact on North America telematics CAGR per Mordor Intelligence
    - Increases value of OEM-native CAN bus access vs. aftermarket; favors Platform Science's data architecture
    - Confirm PS roadmap for EPA27 emissions reporting modules
  - - Insurance premium discounts for video-verified safety data
    - ↑ Accelerating
    - Economic driver
    - Short-term (≤ 2 years)
    - Dash-cam deployments self-funding within 12 months per Mordor Intelligence
    - Increases attach rate for video/safety apps on Virtual Vehicle marketplace; drives upsell
    - Confirm insurance carrier integration partnerships and telematics-scoring program enrollment
  - - North America Class 8 freight recession / new truck volume decline
    - ↓ Constraint
    - Cyclical market risk
    - Near-term (2025–2026)
    - 'NA Class 8 sales: 258,000 in 2025 (–16% YoY); 2026 consensus: 250,000–270,000 units'
    - Lower new truck builds = slower OEM-native installed base growth; Platform Science revenue tied to new vehicle deployment
    - Track monthly Class 8 order data (ACT Research, FTR); assess PS contracted pipeline vs. build schedules
  - - OEM factory-fit telematics standardization
    - ↑ Accelerating
    - Structural driver
    - Short-to-medium term
    - 'OEM embedded segment CAGR: 13.83% (2026–2031) vs. aftermarket lower; 65% CAGR uplift from factory-fit relative to overall
      market'
    - Structural tailwind for Platform Science as primary OEM software layer for Daimler, Navistar, PACCAR
    - Confirm exclusivity terms and duration with each OEM partner; understand Volvo, Ford, GM OEM strategy
  - - 'Telematics value gap (45% of fleets: solutions don''t fully meet needs)'
    - ↓ Constraint
    - Demand risk
    - Current and ongoing
    - < 45% of decision-makers strongly agree telematics fully meets needs; 40–60% experience promised benefits — Escalent
      2025
    - Integration complexity and data silos limit expansion beyond compliance; risk of churn or feature downgrade
    - Assess PS NPS, churn rate, and integration depth with enterprise TMS/ERP at top 10 customers
  - - Cybersecurity breach risk in telematics infrastructure
    - ↓ Constraint
    - Technology risk
    - Ongoing
    - 60% of global telematics systems had ≥1 cybersecurity breach in 2023 per IBM/WorldMetrics
    - Vehicle data exposure risk; regulatory liability; reputational risk if breach attributed to Virtual Vehicle platform
    - Request PS SOC 2 Type II certification and penetration test history; confirm OEM data governance agreements
  - - AI analytics and edge computing integration (5G V2X, predictive maintenance)
    - ↑ Accelerating
    - Technology driver
    - Medium-to-long term
    - +1.5% estimated CAGR impact from 5G V2X per Mordor Intelligence; Video telematics advancing at 13.95% CAGR
    - Platform Science's edge computing architecture (CAN bus direct access) well-positioned for AI analytics expansion
    - Review PS AI and ML product roadmap; assess partner integrations (Netradyne, Drivewyze)
  notes: Impact quantifications are sourced from analyst estimates and are not independently verified. Timing is analytical
