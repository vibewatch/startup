companyProfile:
  summary: Platform Science is a San Diego-based fleet management software company founded in 2015 that operates an OEM-native
    platform pre-installed in new heavy-duty trucks manufactured by PACCAR (Kenworth, Peterbilt), Daimler Truck (Freightliner,
    Western Star), and Volvo Group (Volvo, Mack). The Virtual Vehicle platform provides enterprise and large-fleet operators
    with ELD compliance, driver workflow management, real-time telematics, and an open app marketplace supporting over 400
    third-party integrations. Platform Science serves named customers including Werner Enterprises (~8,000 trucks), U.S. Xpress
    (~6,500 trucks), C.R. England (~4,000 trucks), Schneider National, and NFI Industries (~3,200 trucks), with an estimated
    53,500+ commercial vehicles under management as of mid-2025.
  foundedDate: '2015-01-01'
