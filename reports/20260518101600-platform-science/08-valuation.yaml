- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold
  - Transmission to Thesis
  - Action Implication
  rows:
  - - OEM partner contract non-renewal or competitive exclusivity announcement
    - Any of PACCAR, Daimler Truck, or Volvo Group publicly engages Samsara or Motive as an OEM-embedded exclusive provider
    - Eliminates passive fleet growth; reduces TAM by 25-40%; triggers bear case immediately
    - Halt new investment; immediate thesis reassessment pending OEM response
  - - Financial diligence reveals ARR below thesis floor
    - ARR below $100M or gross margin below 60% revealed in diligence
    - Resets implied valuation to below $800M; base-case return math fails at current entry price
    - Pass on investment at current valuation; revisit at meaningfully lower entry price
  - - Net revenue retention below industry floor
    - NRR below 105% disclosed or inferred from cohort churn data
    - Signals platform stickiness failure; erodes expansion revenue assumption underlying scenarios
    - Require operational remediation plan and price reduction to reflect lower quality economics
  - - Samsara or major competitor announces OEM-native agreement with top-3 OEM
    - Public announcement of OEM-embedded deal with PACCAR, Daimler Truck, or Volvo Group
    - Directly competes in Platform Science core distribution channel; structural moat erodes
    - Exit or reduce position immediately; OEM competitive moat thesis collapses
  - - Regulatory or legal action materially impairs fleet data monetization
    - FMCSA or state-level enforcement action against fleet data practices or class action re driver data
    - Adds compliance cost; reduces data monetization upside; increases investor uncertainty about future economics
    - Suspend new investment; monitor legal outcome before committing additional capital
  claimRefs:
  - CV016
  - CV017
  - CV033
  - CV024
  notes: Triggers are illustrative thresholds based on comparable company analysis; actual covenant terms require legal review
    and cap table disclosure from Platform Science.
- id: TV006
  title: Final Diligence Asks
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Diligence Path
  rows:
  - - ARR and revenue composition
    - No public disclosure of total ARR, MRR, or revenue by segment including OEM-embedded versus open-market
    - Validates the $100-250M ARR estimate range that underpins all valuation scenarios
    - Request audited financials in diligence; cross-check against named customer fleet counts and per-truck pricing
  - - Net Revenue Retention
    - No published NRR, gross dollar retention, or expansion revenue data disclosed
    - NRR above 110% supports premium multiple; below 105% is a kill signal for the expansion thesis
    - Request cohort revenue analysis for all fleet customers with 12+ month tenure on platform
  - - OEM contract economics and renewal terms
    - Contract durations, revenue splits, renewal rights, and exclusivity terms not disclosed publicly
    - OEM contracts are the primary growth engine; unfavorable economics or short terms change the thesis materially
    - Require full OEM contract disclosure including economic terms, term lengths, renewal options, and competitive restriction
      clauses
  - - Gross margin and unit economics
    - No public disclosure of gross margin, sales and marketing efficiency, or contribution margin by segment
    - Gross margin below 65% would indicate OEM rev-share or integration costs eating into SaaS economics
    - Request segmented P&L with OEM channel cost allocation; benchmark against Samsara 72% gross margin
  - - Customer win/loss competitive data
    - No public win/loss data against Samsara, Motive, or Geotab in competitive tender events
    - Win rate and competitive displacement data validates the moat thesis in open-market segments outside OEM channel
    - Request 24 months of win/loss analysis; identify patterns of competitive encroachment in non-OEM fleets
  - - Capitalization and preference stack
    - Cap table, liquidation preferences, and OEM investor governance rights not disclosed publicly
    - Participating preferred with OEM investors could absorb disproportionate proceeds at lower exit multiples
    - Require full cap table, preference stack analysis, and board governance rights disclosure before term sheet
  claimRefs:
  - CV031
  - CV034
  - CV036
  - CV039
  notes: Diligence asks are standard for conviction-stage private SaaS investment; completeness of disclosure determines whether
    Qualified Positive upgrades to conviction Buy.
