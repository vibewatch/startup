- id: SE-S04
  title: Differentiation, Trust, and Technology Risk
  body: 'Platform Science''s primary technical differentiator is OEM-native integration: the ''era of aftermarket hardware
    is dead,'' according to CTO Jake Fields. Competitors like Samsara, Motive, and Geotab rely on aftermarket hardware dongle
    or gateway installations, which require truck downtime and fleet coordinator effort to deploy. Platform Science''s OEM-embedded
    model eliminates installation friction, reduces total cost of ownership (no aftermarket device cost), and gives the platform
    access to deeper vehicle data through direct OEM integration points (CAN bus, OBD-II, OEM diagnostic APIs) unavailable
    to aftermarket devices.


    Trust and security infrastructure includes: SOC 2 Type 2 certification (since 2021); ISO 27001 certification (Schellman
    auditor); end-to-end encryption; compliance with NIST and ISO 27001 frameworks; and the Customer Data Bill of Rights,
    which affirms that fleet customer data belongs to the customer, is not sold, and is controlled by the fleet operator.
    The Trust Portal (March 2026) provides real-time security posture visibility to fleet operators.


    Key technology risks include OEM concentration (three OEMs represent all factory-install volume; loss of any one OEM relationship
    would materially impact growth), proprietary hardware lock-in (INSTINCT Gateway creates single hardware dependency), limited
    developer community scale relative to Samsara''s larger App Ecosystem, and post-Trimble integration complexity as the
    combined product suite is merged onto a single platform. IP transparency is low — Platform Science has not publicly disclosed
    patents or a detailed technical architecture document outside marketing copy, which is a diligence gap.'
