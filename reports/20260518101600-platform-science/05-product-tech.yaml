  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cloud-infrastructure-and-reliability
    missingEvidence: Platform Science does not publicly disclose its cloud infrastructure provider, uptime SLA commitments,
      or redundancy architecture for the Virtual Vehicle data platform.
    whyItMatters: Cannot assess operational resilience; 100B+ daily data points require robust cloud architecture; downtime
      would impact ELD compliance for regulated fleets.
    diligencePath: Request SOC 2 Type 2 audit report for cloud scope coverage; ask for cloud provider disclosure and SLA terms
      in data room.
    relatedQuestionRefs:
    - QE012
  - type: private-evidence-only
    severity: material
    topic: product-roadmap-and-ip
    missingEvidence: Platform Science has no public product roadmap document. Patent filings and IP ownership details are
      not publicly disclosed.
    whyItMatters: Cannot assess product differentiation durability or competitive moat without IP documentation; roadmap absence
      increases integration risk from Trimble acquisition.
    diligencePath: Request product roadmap and patent portfolio in data room; check USPTO and PCT databases for Platform Science
      filings.
    relatedQuestionRefs:
    - QE019
    - QE022
  - type: private-evidence-only
    severity: minor
    topic: hardware-oem-variations-and-adoption
    missingEvidence: Whether INSTINCT hardware is the only gateway used across all three OEM integrations (vs. OEM-proprietary
      hardware post-Trimble) is not publicly confirmed. Fleet adoption rate within the OEM truck base is not disclosed.
    whyItMatters: Hardware fragmentation post-Trimble acquisition could complicate platform consistency; low adoption rate
      within OEM-installed base would undermine GTM thesis.
    diligencePath: Request hardware deployment breakdown by OEM from company; request activated vs. installed truck ratio
      to measure OTA adoption rate.
    relatedQuestionRefs:
    - QE007
    - QE020
