- id: SE-S02
  title: Technology Architecture and Operating Model
  body: 'Virtual Vehicle''s technical stack is structured in six layers from hardware to cloud. At the hardware layer, the
    INSTINCT Gateway is an ARM-based device (NXP i.MX6D Lite Dual Core Cortex-A9 @800MHz, 8GB eMMC, 1GB DDR3 RAM) with 4G
    Cat 4 LTE with 3G/2G fallback, Wi-Fi 802.11 a/b/g/n/ac, Bluetooth 5.0, and GPS/GLONASS/Galileo with <2.5m CEP positional
    accuracy. This gateway connects to the truck''s OBD-II/CAN bus and runs the Virtual Vehicle OS, providing an application
    sandbox for fleet software.


    The platform processes over 3 million data points per truck per day on the edge, aggregating to more than 100 billion
    data points processed across the fleet network every day. Telematics telemetry sends 288 vehicle heartbeats per vehicle
    per day (approximately one every 5 minutes), with the fleet-wide count exceeding 12.5 million heartbeats daily across
    53,500+ active drivers. The cloud data platform ingests, processes, and exposes this data through APIs accessible to fleet
    operators and marketplace application developers.


    The SPEED certification program (Security, Performance, Experience, Efficiency, Documentation) is the mandatory review
    and validation process all third-party applications must pass before distribution through the marketplace or deployment
    to customer fleets. This program protects driver safety, data security, and device performance. Post-Trimble acquisition,
    the application catalog expanded to include Trimble''s existing telematics product portfolio, which Global fleet operators
    can now access across Platform Science''s Virtual Vehicle platform.'
