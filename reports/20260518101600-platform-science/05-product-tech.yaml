- id: TE002
  title: Workflow / use-case table
  columns:
  - User Job
  - Current Workflow (Without PS)
  - Platform Science Solution
  - Measurable Benefit
  - Limitation / Gap
  rows:
  - - ELD compliance (FMCSA HOS)
    - Paper logs or aftermarket ELD dongle; daily manual submission
    - Embedded ELD/HOS via Virtual Vehicle; automatic log sync; dual US/Canada compliance
    - Eliminates manual log errors; single device for US & Canada fleets
    - Only available on DTNA, PACCAR, Navistar new trucks; not retrofittable to older equipment
  - - Driver safety monitoring
    - Dash cam with cloud upload; manual review by safety manager
    - 'PS Visual Intelligence: AI-triggered event flagging, 4-channel video, synchronized telematics'
    - Faster incident review; AI detects 6+ distraction/fatigue event types in-cabin
    - AI accuracy metrics not benchmarked publicly; requires VV-compatible camera hardware
  - - Predictive vehicle maintenance
    - Scheduled PM intervals or reactive breakdowns; manual fault code reading
    - 'Cummins VHI: real-time engine data, remote diagnostics, OTA firmware updates'
    - Reduces unplanned downtime; OTA firmware eliminates dealer visit for software updates
    - Only available for Cummins engines initially; integration with other powertrain OEMs pending
  - - Fleet routing and navigation
    - Separate navigation device; driver-owned mobile phone; back-office route dispatch
    - Trucker Path marketplace app on VV tablet; truck-optimized routing with real-time data
    - Eliminates separate device; integrates dispatch with driver navigation on VV screen
    - Marketplace apps require SPEED certification delay; navigation quality vs. ProMiles not benchmarked
  - - Remote fleet management
    - In-person vehicle inspections; manual report aggregation; siloed data systems
    - 'Virtual Vehicle cloud portal: single pane for all fleet data; OTA app updates; API integrations'
    - Single dashboard reduces fleet management complexity; OTA eliminates site visits for software updates
    - SLA commitments and uptime guarantees for VV platform not publicly disclosed
