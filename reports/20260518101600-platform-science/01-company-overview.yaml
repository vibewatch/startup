  - id: milestones-scale
    title: "Milestones, Scale, and Strategic Developments"
    body: >
      Platform Science has traversed several critical phases from a San Diego startup in 2015 to a post-acquisition
      telematics heavyweight with global reach by 2025. The company's milestone trajectory tracks three overlapping
      arcs: OEM partnerships, capital formation, and product-led fleet adoption.

      The foundational product-market fit was established in May 2020, when Daimler Truck North America became
      the first OEM to integrate factory-installed telematics on Platform Science's Virtual Vehicle platform. This
      event marked the validation of the "open, native" thesis—that commercial trucks could ship from the factory
      with a software-defined connectivity layer instead of requiring aftermarket hardware retrofits. Platform Science
      extended the OEM footprint to PACCAR and Navistar over the following two years, building toward a cross-OEM
      standard.

      The 2022 Series C at $575 million post-money cemented Platform Science's status as a near-unicorn in freight
      technology. In 2023, large fleet operators including Schneider (public, NYSE:SNDR), Werner Enterprises
      (NASDAQ:WERN), C.R. England, and Covenant Logistics publicly announced Virtual Vehicle deployments. By
      December 2023, Platform Science reported over 1 trillion cumulative data points, 6 billion miles logged,
      and 15 billion API calls annually across its fleet customer base.

      The April 2024 growth round ($125M) was followed in September 2024 by the announcement of the Trimble
      acquisition—a landmark deal that positioned Platform Science to absorb Trimble's legacy telematics customer
      base globally, transforming from a North American OEM-native startup into a global fleet management platform.
      The acquisition closed in February 2025, with Trimble becoming a shareholder and receiving a board seat.
      The Trimble deal was advised by J.P. Morgan (Platform Science) and Centerview Partners and Goldman Sachs
      (Trimble), reflecting the institutional scale of the transaction. Headcount surged from 412 in 2024 to
      748 in 2025, a 57.9% increase, reflecting both organic hiring and likely Trimble employee integration.

      In May 2026, Platform Science became the first company to achieve Canadian ELD certification on Daimler's
      CTP2 (Common Telematics Platform 2) factory-installed hardware, enabling seamless cross-border U.S.-Canada
      compliance for Freightliner Cascadia, Freightliner Plus, and Western Star X-Series fleets. This regulatory
      milestone further consolidates Platform Science's position as the compliance infrastructure layer for major
      North American truck OEM brands.
