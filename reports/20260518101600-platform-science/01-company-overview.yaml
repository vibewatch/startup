company:
  name: Platform Science
chapter:
  number: 1
  title: Company Overview
  summary: >
    Platform Science is a San Diego-based connected vehicle platform company founded in 2015 by Jack Kennedy (CEO)
    and Jake Fields (CTO), providing its Virtual Vehicle® open application platform to large enterprise fleets through
    factory-installed OEM integrations with Daimler Truck North America, Navistar, and PACCAR. The company has raised
    approximately $293–$309 million in total venture and strategic capital including a $125 million growth round in
    April 2024, completed the acquisition of Trimble's global transportation telematics business units in February 2025,
    and employs approximately 748 people as of December 2025.
sections:
  - id: identity-product-model
    title: "Company Identity, Product, and Business Model"
    body: >
      Platform Science, incorporated in San Diego, California (9560 Towne Centre Dr, Suite 200, San Diego, CA 92121),
      was founded in 2015 by Jack Kennedy and Jake Fields to transform commercial fleet management by replacing fragmented
      aftermarket hardware with an open, software-native connected vehicle platform. The company's flagship product,
      Virtual Vehicle®, is an open application platform that lives natively on the truck—pre-installed by OEM partners
      during production at the factory—enabling enterprise fleets to access telematics, compliance, safety, driver
      workflow, and third-party applications through a single unified interface without aftermarket hardware installation.

      Virtual Vehicle serves as the operating system for commercial trucking, connecting the truck's vehicle data
      (J1939/RP1226 signals), driver-facing Samsung Galaxy Tab Active tablets, cloud infrastructure, and a growing
      marketplace of telematics service providers (TSPs), third-party application developers, and OEM partners. The
      platform architecture unlocks over a trillion cumulative data points across more than 6 billion miles logged and
      generates approximately 15 billion API calls annually, reflecting significant fleet penetration.

      The business model is primarily enterprise SaaS subscription-based, targeting large commercial trucking fleets
      (typically 200+ vehicles) that seek a centralized platform to manage devices, applications, and compliance
      workflows. Revenue is derived from per-vehicle monthly subscription fees for the platform and optional application
      marketplace participation fees. Platform Science markets exclusively through strategic OEM embedding and direct
      enterprise sales, positioning itself as distinct from point-solution telematics vendors by offering an "unlimited
      canvas" for fleet innovation. The company was named by Fast Company as one of the World's Most Innovative Companies
      (2022) and ranked #2 in the FreightTech 25 Awards for both 2022 and 2023, and has twice earned Forbes Best
      Startup Employer recognition (2024 and 2025).

      A key structural advantage is the OEM-native distribution model: fleets purchasing new trucks from Daimler
      (Freightliner/Western Star), Navistar (International Trucks), or PACCAR (Kenworth/Peterbilt) may receive
      Virtual Vehicle pre-installed, eliminating the traditional hardware-install barrier. This creates a compounding
      installed base as newer trucks enter fleets, and incentivizes TSPs and developers to build on the platform.

      However, the platform's positioning as enterprise-only, with opaque pricing ("Contact Vendor"), multi-year contract
      requirements, and complex configuration workflows, has been cited by independent reviewers as a significant
      limitation for smaller fleets and owner-operators, where the $600+ upfront hardware and onboarding complexity
      create friction.
