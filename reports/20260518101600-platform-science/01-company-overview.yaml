callouts:
  - calloutType: strength
    title: "OEM-Native Distribution Moat"
    body: >
      Platform Science's factory-embedded model with Daimler (Freightliner/Western Star), Navistar, and PACCAR
      creates a durable distribution moat: fleets purchasing new trucks from these OEMs may receive Virtual Vehicle
      pre-installed, generating a compounding installed base without traditional hardware-sales cycles. This
      contrasts sharply with aftermarket-only competitors like Samsara and Motive, which require hardware
      installation in each vehicle.
    claimRefs:
      - CO004
      - CO028
      - CO029

  - calloutType: risk
    title: "Private Financials and Valuation Opacity"
    body: >
      Platform Science has not publicly updated its valuation since the April 2022 Series C ($575M post-money).
      The April 2024 growth round and February 2025 Trimble acquisition occurred without disclosed valuation
      anchors. Revenue, ARR, and gross margin remain undisclosed. This opacity requires any valuation judgment
      to rely on comparables and disclosed funding scale rather than financial fundamentals.
    claimRefs:
      - CO022
      - CO026

  - calloutType: risk
    title: "Post-Trimble Integration Risk and Support Disruption"
    body: >
      The February 2025 acquisition of Trimble's global telematics business units created material integration
      uncertainty. Independent reviewers note "transition risk" and "enterprise-first" support prioritization
      post-acquisition, leaving smaller fleet customers and owner-operators potentially under-served. Headcount
      grew 57.9% in 2025, suggesting rapid scaling that may strain operational processes.
    claimRefs:
      - CO034
      - CO035
      - CO009

  - calloutType: insight
    title: "Canadian ELD Certification Extends North American Compliance Leadership"
    body: >
      Platform Science became the first company to achieve Canadian ELD certification on DTNA's CTP2 factory-installed
      platform in May 2026, enabling seamless cross-border U.S.-Canada operations for major Daimler truck brands.
      This regulatory milestone reinforces Platform Science's position as the compliance infrastructure standard
      for large North American fleets and makes it more difficult for alternatives to displace the incumbent
      platform.
    claimRefs:
      - CO038

