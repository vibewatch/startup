- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - xCell expeditionary manufacturing cell
    - Operational military unit / logistics operator
    - Operational pilot / early fielding
    - Moves polymer-airframe production and repair to point of need rather than rear factory
    - Need named production-rate, uptime, and maintenance metrics by deployment
  - - Tempest fixed-wing UAS family
    - Operational command / ISR-EW-strike user
    - Demonstrated and fielded with growing procurement support
    - Designed specifically for xCell production and rapid mission reconfiguration
    - Official spec sheet and airworthiness data not publicly posted
  - - Squall FPV platform
    - Short-range tactical operator
    - Publicly named but low public proof depth
    - Extends additive-manufacturing model into FPV class
    - No public deployment record or dated roadmap found
  - - Payload / mission integration layer
    - Mission integrator / program office
    - Company-claimed, partially corroborated
    - Open-architecture pitch spans ISR, EW/SI, and kinetic payload options
    - No public payload catalog or interface standard published
  - - Software Integration & Operations platform
    - Platform / manufacturing software team
    - Actively staffed; architecture visible through public hiring
    - Factory-floor-to-cloud runtime across GovCloud and on-prem edge
    - No public platform docs, uptime SLOs, or supported-environment matrix
  notes: Status labels combine official statements, fundraising releases, hiring signals, and independent reporting; detailed technical maturity remains partly unverified outside military-program context.
