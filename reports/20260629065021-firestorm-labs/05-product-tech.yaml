callouts:
- calloutType: strength
  title: Manufacturing-as-product is the real wedge
  body: The most credible part of Firestorm's product story is that xCell is treated as a deployable manufacturing system, not a sidecar to a drone SKU. That is a harder but potentially more durable moat than a single airframe.
  claimRefs:
  - CE003
  - CE004
  - CE028
  - CE033
- calloutType: risk
  title: Trust and reliability evidence still lags the ambition
  body: Public materials establish a real architecture and serious customer interest, but they do not yet establish public cybersecurity certification, airworthiness, or repeatable field-reliability metrics. Those items remain management-diligence asks.
  claimRefs:
  - CE024
  - CE026
  - CE034
  - CE036
  - CE037
