figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Firestorm's public stack runs from contested-logistics need through xCell manufacturing, modular airframes, mission payloads, and the software operations layer that keeps the factory running.
  data:
    layers:
    - label: Operational demand layer
      detail: 'Customer pain is contested logistics: operators need rapid replacement, adaptation, and sustainment at the point of need.'
      modules:
      - Contested logistics
      - Point-of-need production
      - Field repair and sustainment
    - label: Manufacturing cell layer
      detail: xCell packages additive manufacturing, environmental controls, deployability, and secure communications into a mobile production cell.
      modules:
      - Containerized xCell
      - HP MJF print core
      - PA-12 composite feedstock
      - HVAC / secure comms / power
    - label: Airframe layer
      detail: Firestorm's named airframes are designed to exploit the manufacturing cell rather than sit apart from it.
      modules:
      - Tempest fixed-wing family
      - Squall FPV platform
      - Replacement parts / components
    - label: Mission integration layer
      detail: Public materials emphasize open-architecture payload integration across ISR, EW/SI, and strike roles.
      modules:
      - ISR mission kits
      - EW / SI payloads
      - Kinetic / strike configurations
    - label: Software operations layer
      detail: Hiring signals show a cloud-and-edge platform responsible for automation, observability, deployment, and compliance-sensitive runtime operations.
      modules:
      - Kubernetes clusters
      - Service mesh
      - Terraform + Helm + GitOps
      - GovCloud + on-prem edge
  approximationNotes: Figure synthesizes official homepage language, partner case-study detail, and public job descriptions; Firestorm has not published an end-to-end technical architecture diagram.
