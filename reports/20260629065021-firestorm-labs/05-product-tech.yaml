- id: trust-quality-and-public-gaps
  title: Trust, Quality Controls, and Public Gaps
  body: Firestorm discloses more about website privacy than about product certification, which is useful but incomplete for diligence. The April 2026 privacy policy is explicit about basic controls — essential local storage only, no tracking cookies, no sale of personal data for marketing, and formal handling of recruiting, contact, and contracting information. Hiring materials further imply that regulated-environment practices matter because roles call out GovCloud, incident response, and ITAR/EAR eligibility. Those are credible trust signals, but they are not substitutes for public evidence of cybersecurity certification, airworthiness, manufacturing quality systems, or field reliability metrics. No public certification register, MTBF dataset, or dated Squall roadmap appeared in the reviewed sources. For underwriting, the practical conclusion is that Firestorm has enough public evidence to establish a real product architecture and an increasingly operational platform, but not enough to
    clear trust-and-quality diligence without direct management data room support.
  claimRefs:
  - CE024
  - CE025
  - CE026
  - CE027
