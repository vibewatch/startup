chapter:
  number: 5
  title: Product & Technology
  summary: 'Firestorm''s product is not just a drone family: it is a mobile manufacturing system (xCell), a modular fixed-wing line (Tempest), a less-proven FPV line (Squall), and a factory-floor-to-cloud software layer that together aim to solve contested logistics for military users. Public evidence supports real technical substance — HP-based additive manufacturing, cloud/edge platform hiring, Air Force/Army demonstrations, and modular payload claims — but public diligence still lacks formal certification, airworthiness, and field-reliability disclosure.'
sections:
- id: product-definition-module-map
  title: Product Definition and Module Map
  body: 'Firestorm''s public narrative is unusually coherent for a young defense-hardware company: it is not selling a single drone, but a combined manufacturing-and-platform system intended to move production to the edge. The official site anchors the portfolio on three named assets — xCell, Tempest, and Squall — and frames them in customer workflow terms: contested logistics, rapid mission adaptation, and sustainment when centralized supply chains fail. That matters because the product boundary is broader than an airframe. xCell is the factory, Tempest is the modular fixed-wing family designed to be produced inside that factory, and Squall is the FPV line that extends the same additive-manufacturing logic into a different mission class. Public materials also show the company cares about payload openness and software enablement, not only composite structures, which is why the technical stack has to be read across the homepage, fundraising releases, and current hiring signals rather than
    from a single spec sheet.'
