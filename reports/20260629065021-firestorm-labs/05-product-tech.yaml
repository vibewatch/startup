- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow / pain
  - Firestorm solution
  - Measurable benefit stated
  - Limitation / caveat
  rows:
  - - Forward unit replaces lost airframes
    - Wait for centralized factory output and fragile resupply chain
    - Print modular airframes and parts in xCell at point of need
    - Company and media sources cite under-24-hour production or sub-36-hour full-aircraft cycles
    - Throughput claims are not yet backed by independent field metrics
  - - Program office adapts platform to new mission
    - Traditional redesign and supply-chain change orders move slowly
    - Open-architecture Tempest can accept new sensors or propulsion modules
    - Public sources emphasize faster redesign and mission adaptation
    - Official module-interface docs are not public
  - - Operator needs ISR or EW configuration
    - Dedicated platform per mission increases cost and logistics burden
    - Tempest is positioned as reconfigurable across ISR, EW, and strike roles
    - Same airframe family can cover multiple mission sets
    - Mission-kit maturity and payload interoperability are not documented publicly
  - - Unit repairs damaged platform in austere environment
    - Replacement parts may take weeks or months to arrive
    - xCell can fabricate replacement structures and mission-specific components near the fight
    - Army Bradley-parts example and drone-part narrative support sustainment use case
    - No public repair-success-rate or cost-per-repair data found
  - - Platform team runs manufacturing software in regulated environments
    - Industrial platform tooling often fragments across local and cloud stacks
    - Firestorm is staffing for GovCloud, on-prem edge, observability, and GitOps-based operations
    - Suggests the company is building repeatable software operations, not only hardware
    - Evidence comes from hiring proxy rather than public product docs
  notes: Benefits are company-claimed or third-party reported; no independent benchmark study on cost, uptime, or sortie regeneration was found.
