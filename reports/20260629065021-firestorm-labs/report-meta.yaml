companyProfile:
  summary: Firestorm Labs is a San Diego-based private defense-manufacturing startup founded in 2022 by Dan Magy, Chad McCoy, and Ian Muceus. It sells xCell, a containerized expeditionary additive-manufacturing cell, alongside Tempest and Squall unmanned aircraft platforms designed to be produced, repaired, or adapted near the point of need. Public traction is concentrated in U.S. military programs, especially Air Force and AFRL pathways, with Army sustainment and Indo-Pacific fielding evidence emerging but not yet broadly disclosed.
  foundedDate: '2022-04-30'
  founders:
    - name: Dan Magy
      role: CEO / co-founder
      background: Repeat defense-tech founder; previously founded and exited Citadel Defense.
      claimRefs: [CO004, CO005]
    - name: Chad McCoy
      role: Chief Growth Officer / Chief Strategy Officer / co-founder
      background: Tier 1 special operations veteran; former Doolittle Institute and AFRL munitions leader.
      claimRefs: [CO004, CO006]
    - name: Ian Muceus
      role: CTO / co-founder
      background: Former Stratasys aerospace-and-defense leader and additive-manufacturing patent holder.
      claimRefs: [CO004, CO007]
  foundingLocation: San Diego, California, USA
  headquarters: San Diego, California, USA
  productSummary: Firestorm's core offer is xCell, a mobile manufacturing system using HP Multi Jet Fusion printing to produce drone structures, parts, and partner systems in the field, plus the Tempest modular UAS line and Squall FPV platform.
  customerFocus: U.S. military buyers and operators, especially Air Force, AFRL, AFSOC, Army sustainment users, and selected Indo-Pacific operational customers.
  businessModel: Revenue is described publicly as hardware sales and government contracts tied to SBIRs, development contracts, IDIQ vehicles, and fielded manufacturing-plus-UAS programs.
  stage: Series B
  fundingStatus: Firestorm disclosed a $47 million 2025 Series A and an $82 million April 2026 Series B, bringing public disclosed capital to roughly $153 million; exact post-money valuation remains undisclosed in retained sources.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO003, CO004, CO005, CO006, CO007, CO017, CO019, CO023, CO024, CO027, CE002, CE003, CU001, CU040]
summary:
  headline: Firestorm combines a differentiated deployable microfactory thesis with credible U.S. military traction, but public underwriting is constrained by opaque financials, concentrated government demand, and no verified post-money valuation.
