  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, renewal rates, task-order renewal behavior, and branch-level repeat-purchase data.
    whyItMatters: Without repeat-demand metrics, it is hard to distinguish early procurement success from durable operating dependence.
    diligencePath: Request a customer cohort bridge showing SBIR, development, deployment, and renewal by program office and branch.
    relatedQuestionRefs:
