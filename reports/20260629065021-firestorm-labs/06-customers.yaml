company:
  name: Firestorm Labs
chapter:
  number: 6
  title: Customers
  summary: 'Firestorm has real customer proof, but it is concentrated: the strongest public evidence sits inside the U.S. Air Force ecosystem, with named AFRL and AFSOC deployments, a documented SBIR-to-contract progression, Army exercise and sustainment use cases, and APFIT-backed Indo-Pacific fielding claims. Public retention, satisfaction, and diversification evidence remain thin, so the right framing is not “no customers” but “credible government traction with high concentration and limited public durability metrics.”'
sections:
- id: customer-base-segmentation
  title: Customer Base Segmentation
  body: Firestorm's visible customer universe is narrow and defense-specific. Public proof clusters around the Air Force ecosystem — AFRL, AFWERX-adjacent programs, AFSOC, and contract vehicles that support broader Air Force experimentation and procurement — with secondary evidence that the Army has used Firestorm systems or manufacturing outputs in exercises and sustainment scenarios. The company and adjacent profiles also speak about allied militaries and humanitarian organizations, but those references read as target segments rather than named, proven deployed customers. That distinction matters because this chapter is not evaluating TAM; it is evaluating demonstrated adoption. On that basis, Firestorm appears to have a real but concentrated government customer base, with the strongest evidence rooted in U.S. military procurement records and named domestic deployments rather than in a wide roster of disclosed end users.
  claimRefs:
  - CU001
  - CU013
  - CU014
  - CU015
  - CU025
  - CU038
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-named-proof
  title: Adoption Trajectory and Named Customer Proof
  body: The public adoption story is unusually legible for a private defense startup because it can be read through government award breadcrumbs. The earliest strong record in this run is the 2023 SBIR Phase II order for xCell-at-the-edge work. By late 2025, that had expanded into a named AFRL xCell development contract and a high-profile Air Force IDIQ vehicle. By spring 2026, Firestorm was publicly tying its Series B and APFIT award to successful Air Force and Army demonstrations, domestic xCell deployments, and operational focus in the Indo-Pacific. Named proof is strongest for AFRL, AFSOC, and the Army Bradley-parts sustainment example. Those are materially better than logo slides, but they still do not constitute broad public deployment evidence across many units. Firestorm has moved beyond speculative customer discovery; it has not yet disclosed a diversified fleet of referenceable users with standardized outcomes.
