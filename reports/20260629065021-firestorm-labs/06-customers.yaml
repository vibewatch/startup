    - QU017
  - type: private-evidence-only
    severity: material
    topic: satisfaction-gap
    missingEvidence: Named operator reference calls, after-action reports, and satisfaction or usability feedback from AFRL, AFSOC, and Army users.
    whyItMatters: Public procurement records prove buying interest, but not operator satisfaction or repeat operational value.
    diligencePath: Request two to three customer references plus any redacted after-action metrics from domestic xCell deployments.
