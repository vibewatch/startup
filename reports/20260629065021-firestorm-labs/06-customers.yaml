figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Firestorm's current public customer journey runs from contested-logistics problem identification to prototype contract, domestic deployment, and selective operational fielding.
  data:
    nodes:
    - id: n1
      label: Mission need identified
      description: A defense user faces contested logistics, high attrition, or slow repair cycles in austere environments.
    - id: n2
      label: Prototype / SBIR engagement
      description: Early-stage procurement funds concept validation for xCell and edge production.
    - id: n3
      label: Named contract vehicle
      description: Customer or sponsoring program creates a larger vehicle such as AFRL xCell development or USAF IDIQ.
    - id: n4
      label: Domestic deployment / exercise proof
      description: xCell or Tempest is used in named domestic sites or exercises such as AFRL, AFSOC, Northern Strike, or T-REX.
    - id: n5
      label: Operational fielding
      description: Public materials claim operational focus in the Indo-Pacific and expanded deployment to operational units.
    - id: n6
      label: Scaled multi-branch / allied expansion
      description: Potential next stage is broader recurring demand across more branches and allied users; public proof remains thin.
  approximationNotes: Stages 1-5 are backed by public evidence, though Stage 5 lacks named-unit specificity. Stage 6 is a forward-looking expansion path rather than a verified current state.
  claimRefs:
