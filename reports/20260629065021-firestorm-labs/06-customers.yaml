- id: retention-expansion-and-concentration
  title: Retention, Expansion, and Concentration Risk
  body: 'Retention evidence is the weakest part of the public customer picture. There are enough records to show continuation of the Air Force relationship across multiple programs and years, but there are not enough disclosures to compute any SaaS-like retention metric, renewal rate, or customer-count cohort. That means the best public proxy for durability is program continuation: SBIR to development contract to IDIQ/APFIT is a positive signal, but it is not the same as disclosed revenue retention. Concentration is high because the overwhelming majority of visible demand is tied to U.S. government budgets, especially the Air Force. The Army examples help prove adjacent use cases, but not diversification. Expansion upside exists — allied militaries, humanitarian operations, broader sustainment, and partner-platform production — yet most of that upside remains narrative until named contracts or repeated deployments appear. Investors should treat the customer base as real, strategically valuable,
    and still concentrated.'
