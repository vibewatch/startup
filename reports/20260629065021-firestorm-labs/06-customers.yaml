- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Type
  - Impact
  - Diligence path
  rows:
  - - AFRL / USAF progression from SBIR to IDIQ and APFIT
    - Expansion driver
    - High positive — shows the relationship can expand across budget vehicles and operating contexts
    - Map every Air Force program office, vehicle, and option year
  - - Army sustainment and exercise adjacency
    - Expansion driver
    - Medium positive — proves cross-branch relevance and parts-repair use case
    - Verify whether Army interest has converted into funded follow-on work
  - - Allied / humanitarian positioning
    - Expansion driver (unproven)
    - Medium upside — could diversify beyond U.S. government if converted
    - Request named pipeline by ally, region, and contracting route
  - - DoD / Air Force dependence
    - Concentration risk
    - High — visible proof and likely revenue are concentrated in one federal buyer family
    - Stress-test budget, reprogramming, and policy sensitivity
  - - Ceiling-to-obligation gap on flagship IDIQ
    - Concentration / conversion risk
    - High — headline ceiling can overstate realized demand
    - Review obligated-to-recognized-revenue waterfall
  - - Operational secrecy and sparse references
    - Concentration / proof risk
    - Medium — makes customer proof harder to reuse in commercial scaling or fundraising
    - Ask for sanitized reference cases and after-action metrics
  - - Investor-channel reliance
    - Channel dependence risk
    - Medium — investor access may accelerate programs but does not replace durable end-user adoption
    - Separate equity relationships from paid recurring demand in diligence materials
  notes: Expansion paths are real but uneven. The biggest underwriting risk is still concentration on U.S. government demand and the pace at which announced vehicles convert into usage and revenue.
