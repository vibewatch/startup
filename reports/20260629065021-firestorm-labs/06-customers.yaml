- id: adverse-read-through-and-open-gaps
  title: Adverse Read-Through and Open Gaps
  body: 'The adverse case is not that Firestorm lacks customers; it is that the public proof set may overstate commercial depth relative to procurement-stage reality. Startup Fortune''s skeptical read is useful because it reframes the thesis from contract announcements to field survivability and maintainability. TechCrunch adds another important caution: only a fraction of the Air Force ceiling had been obligated as of April 2026. Public materials also stop short of naming Indo-Pacific units, disclosing renewal terms, or surfacing end-user satisfaction data. That combination is typical for defense startups, but it means diligence must distinguish between proof of government interest and proof of durable, repeated operational dependence. Firestorm has clearly earned meaningful customer attention; the unresolved question is how much of that attention converts into repeatable, scalable, and referenceable production demand over the next several years. Another practical read-through is that public
    proof remains announcement-led: procurement aggregators, trade press, and official releases are easier to find than sanitized operator case studies. That asymmetry itself is a diligence signal, because it suggests Firestorm still benefits more from contract visibility than from public references that demonstrate standardized repeat usage.'
