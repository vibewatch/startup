callouts:
- calloutType: strength
  title: Customer proof is real, not just thematic
  body: Firestorm has cleared the threshold from thematic defense demand to named procurement and deployment evidence. AFRL, AFSOC, Army use cases, and APFIT-backed Indo-Pacific fielding claims are more substantive than a generic dual-use pitch.
  claimRefs:
  - CU002
  - CU009
  - CU011
  - CU019
- calloutType: risk
  title: Concentration and proof-depth remain the key underwriting issues
  body: The visible customer set is narrow, government-heavy, and procurement-centric. Public materials do not yet show robust retention cohorts, broad named deployments, or diversified non-U.S. revenue proof.
  claimRefs:
  - CU022
  - CU024
  - CU025
  - CU028
  - CU029
