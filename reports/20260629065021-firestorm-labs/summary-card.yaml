  topStrengths:
    - >-
      xCell gives Firestorm a differentiated battlefield-manufacturing wedge versus drone vendors that only ship
      finished airframes.
    - >-
      Public evidence shows real defense traction, including a $100 million Air Force ceiling contract, named AFRL and
      AFSOC deployments, Army sustainment use, and APFIT-backed Indo-Pacific fielding.
    - >-
      Founder-market fit and a defense-aligned investor syndicate improve credibility with military buyers and strategic
      partners.
  topRisks:
    - >-
      Public sources do not disclose post-money valuation, audited revenue, gross margin, burn, or cap-table structure,
      limiting price verification.
    - Visible customer demand is highly concentrated in U.S. government and especially Air Force-related channels.
    - >-
      Compliance, certification, and supplier dependence remain material, including unresolved DDTC/SAM/CMMC readiness
      and HP-centered manufacturing concentration.
  unresolvedGaps:
    - >-
      Verified post-money valuation, Form D detail, cap-table structure, and preference terms remain unavailable in
      retained public sources.
    - >-
      Audited revenue, burn, gross margin, backlog, and cash-balance disclosures were not found and require management
      access.
    - >-
      Public sources do not provide MIL-SPEC qualification, airworthiness, or acceptance-test evidence for expeditionary
      additive-manufactured systems.
    - >-
      Customer retention, named Indo-Pacific unit identities, and standardized operator reference evidence remain
      limited.
