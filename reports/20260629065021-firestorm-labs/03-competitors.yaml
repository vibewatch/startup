  - id: direct-peers-platform
    title: Direct Peers — Autonomy Platforms and Established Hardware OEMs
    body: >-
      Anduril Industries is the best-capitalized defense-tech startup globally. A May 2026
      TechCrunch report confirmed a $5B Series H at a $61B valuation and total capital
      raised exceeding $11B; 2025 revenue was $2.2B, double the prior year. Anduril's
      competitive surface is Lattice AI, the Ghost sUAS, the Fury autonomous fighter CCA,
      and a growing international footprint. The Air Force awarded Anduril and General
      Atomics the first CCA production contracts, a milestone Firestorm has not matched.
      Separately, the Air Force selected Shield AI's Hivemind software to run on Anduril's
      Fury, showing DoD is actively splitting hardware and software sourcing—a signal that
      the market does not reward single-vendor lock-in even at the highest tier. Shield AI
      raised $1.5B in its March 2026 Series G at a $12.7B valuation; its V-BAT is a
      fielded Group 3 VTOL ISR drone used by allied nations including Poland, which
      announced a V-BAT purchase for Baltic Sea operations. Shield AI's Hivemind platform
      is sold as an AI pilot agnostic to the airframe, providing a monetization path
      distinct from hardware margins. Neither Anduril nor Shield AI offers field-printable
      airframe replacement; they sell autonomy intelligence and mission hardware produced
      at fixed facilities. AeroVironment is the established incumbent: a public company
      with Switchblade 300 and 600 loitering munitions fielded across U.S. and allied
      forces, the JUMP 20-X VTOL ISR, and decades of DoD IDIQ relationships. Its
      competitive disadvantage is exactly what Firestorm targets—centralized production
      that cannot adapt design cycles at the pace Ukraine demonstrated. Red Cat Holdings
      (Nasdaq: RCAT) owns Teal Drones, the Blue UAS-certified platform selected as the
      U.S. Army's Short Range Reconnaissance (SRR) program of record—a rucksack-portable
      sUAS for platoon-level intelligence and surveillance. The SRR selection is a
      meaningful milestone and positions Red Cat as the Army's qualified sUAS standard,
      but Teal does not offer expeditionary manufacturing.
