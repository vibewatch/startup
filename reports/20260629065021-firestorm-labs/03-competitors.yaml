  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Primary Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - HP 5-year global exclusive for mobile 3D printing deployment units
        - HP modifies commercial terms; alternative industrial-grade printers close the gap; exclusive is bilateral not exclusive-to-DoD
        - High
        - Confirm exclusive contract terms, transferability, and what "global" scope covers; ask for independent legal review
      - - Open-architecture xCell ecosystem (no vendor lock-in)
        - Anduril Lattice, Auterion AuterionOS, and Shield AI Hivemind offer comparable open-integration stories; open architecture is not proprietary
        - Medium
        - Identify what is proprietary about Firestorm's integration layer; assess whether the advantage is in the manufacturing IP rather than the software openness
      - - Expeditionary manufacturing concept with deployed xCell units
        - Rheinmetall container-dispenser; Cummings Aerospace 3D-printed loitering munitions; potential EU/US prime copycat programs
        - Medium
        - Track Rheinmetall FV-014 and Cummings Hellhound S3 program development timelines; assess whether large primes are investing in additive field-manufacturing R&D
      - - Strategic investor channel (Lockheed Martin Ventures, Booz Allen Ventures, In-Q-Tel)
        - Investor alignment is not a contract; investors may back competing programs or withdraw; In-Q-Tel works with many companies simultaneously
        - Medium
        - Confirm whether Lockheed and Booz Allen have contractual channel commitments; assess if investor relationship creates exclusivity or just access
      - - Development-to-production conversion (xCell USAF contract)
        - Only $27M of $100M obligated; no production contract awarded; Drone Dominance Gauntlet I excluded Firestorm from public awardee list
        - Critical
        - Verify independently whether Firestorm was evaluated and excluded or simply did not submit; ask for status of next contract obligation milestone and timeline
      - - Additive manufacturing quality / MIL-SPEC certification gap
        - No publicly documented digital thread, material qualification data, or MIL-SPEC acceptance test results for xCell airframes
        - Critical
        - Request internal quality documentation, acceptance test reports, and material qualification certificates; validate with AFRL or AFSOC program office contacts
    notes: >-
      Severity ratings are editorial assessments derived from available public evidence;
      "Critical" denotes risk sufficient to delay or block production-contract conversion
      without remediation. Mitigation column describes recommended diligence steps, not
      confirmed risk controls in place at Firestorm. No competitor or analyst has publicly
      quantified the probability of production conversion.
