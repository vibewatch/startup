  - id: distribution-trust-regulatory
    title: Distribution, Trust, Switching Costs, and Regulatory Posture
    body: >-
      Firestorm's contracting pathway runs primarily through SBIR Phase III, which allows
      multi-agency orders off the $100M USAF IDIQ vehicle without re-competing. This is a
      legitimate mechanism but is a narrower channel than the long-term IDIQ suites held
      by AeroVironment and other primes, which carry legacy performance records that
      satisfy CO "past performance" requirements. The presence of Lockheed Martin Ventures
      and Booz Allen Ventures on both Series A and Series B is more than a financial
      signal—both firms have direct DoD program integration pathways that may accelerate
      Firestorm's channel access beyond the SBIR track. In-Q-Tel participation in the
      Series B adds intelligence community access. Switching costs in the sUAS and
      loitering munition category are significant: DoD program-of-record designations
      like Teal/Red Cat's SRR win create institutional inertia, Blue UAS certification
      requirements bar non-compliant platforms from most programs, and the qualified
      supplier list process for any given weapons system can take years. Open-architecture
      design (Firestorm, Auterion) reduces integration friction at the platform level
      and lowers the multi-homing cost for DoD buyers who want to add new airframes
      without rebuilding command-and-control stacks. However, the xCell manufacturing
      cell itself is proprietary: once a forward unit builds production processes around
      xCell workflow and HP-printed part files, switching to a different manufacturing
      system requires retraining and re-qualification, which creates switching costs in
      the opposite direction for Firestorm's customers.
