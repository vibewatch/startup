callouts:
  - calloutType: risk
    title: Production-to-Development Gap is the Core Competitive Risk
    body: >-
      Firestorm's most significant competitive disadvantage is not a product or
      technology shortfall but a contracting and certification gap. All $100M of the
      USAF IDIQ ceiling is available on paper, but only $27M is obligated as of April
      2026 and the xCell System Development award is explicitly a development—not
      production—vehicle. Competitors with accepted hardware (AeroVironment, Shield AI
      V-BAT, Red Cat/Teal SRR) have cleared the qualification hurdle that Firestorm has
      not yet crossed. Firestorm's absence from the public Drone Dominance Gauntlet I
      awardee list, which paid $150M to 11 companies for 30,000 attack drones, is the
      most concrete adverse data point available.
    claimRefs:
      - CP005
      - CP031
      - CP032
      - CP033
      - CP034

  - calloutType: strength
    title: Expeditionary Manufacturing Niche Has No Direct Funded Competitor
    body: >-
      Among the principal competitors identified, none offers a commercially deployed,
      containerized, field-printable drone manufacturing system comparable to xCell. The
      five-year HP exclusive, the Tempest 50's claimed 1/5 production cost and 10× speed
      advantage, and the open-ecosystem design together constitute a differentiation
      profile that larger, better-capitalized peers (Anduril, Shield AI) do not replicate
      in this specific manufacturing delivery mode. This niche aligns directly with DoD's
      contested-logistics critical technology designation and is supported by strategic
      investors with direct channel access.
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP037
      - CP042

