  - id: capability-and-feature-comparison
    title: Capability Comparison, Pricing, and Feature Analysis
    body: >-
      On the most strategically differentiated dimension—expeditionary / field-printable
      manufacturing—Firestorm has no funded direct competitor. xCell is a two-container
      HP-powered 3D printing system that produces drone airframes in under 24 hours; the
      company holds a five-year global exclusive with HP for mobile deployment units.
      Firestorm claims Tempest 50 production costs are roughly one-fifth those of
      comparable fixed-wing systems and that manufacturing is approximately 10× faster
      than conventional assembly, though neither figure has been independently audited.
      On Blue UAS / NDAA compliance, Teal Drones (Red Cat) holds the strongest public
      certification record with Blue UAS status and Army SRR program-of-record
      designation; Firestorm's Squall FPV quadcopter is claimed to be NDAA-compliant
      through the Orqa partnership but lacks a Blue UAS listing for the Tempest line in
      public sources. On AI-autonomous flight software, Anduril (Lattice) and Shield AI
      (Hivemind) are far ahead in operational maturity, deployed across named military
      programs. Auterion's AuterionOS is a credible open-architecture alternative.
      Firestorm's software stack is presented as GPS-independent and plug-and-play, but
      independent operational proof is thin. On production track record and DoD program
      credibility, AeroVironment, Shield AI (V-BAT), and Red Cat (SRR) have accepted
      hardware in field units; Firestorm has only development contracts. Pricing is
      uniformly opaque across the category—none of the primary competitors publish list
      prices for defense programs; all pricing is contract-negotiated. Firestorm's unit
      economics claim (1/5 cost) is the only public comparative data point, and it comes
      from the company, not an auditor or independent test.
