- id: comparable-context
  title: Comparable Valuation Context
  body: The best way to think about Firestorm’s upside is through defense-tech comparable behavior rather than through a single hard multiple. Anduril and Shield AI show that investors will pay aggressively for companies that combine defense relevance, software or autonomy leverage, and visible program momentum. But those peer rounds also came with much clearer scale signals than Firestorm currently shares publicly. Public-market names such as AeroVironment, Kratos, Ondas, and Red Cat are useful because they offer ongoing filing-based and market-data-based tracking surfaces, even if none is a perfect match for Firestorm’s blend of mobile manufacturing and modular airframes. The comparable lesson is therefore two-sided. Yes, the category can support billion-dollar outcomes. But those outcomes are usually earned once customers, revenue, and strategic positioning are more legible than they are here. Firestorm’s narrative plausibly belongs in that family; its publicly verifiable metrics do not
    yet prove that it should be priced like the leaders of that family.
  claimRefs:
