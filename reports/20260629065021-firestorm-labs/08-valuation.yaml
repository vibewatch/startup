- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Reference type
  - What public evidence shows
  - Why relevant
  - Key limitation
  rows:
  - - Anduril
    - Private mega-round
    - '2025: $30.5B after ~$1B revenue; 2026: $61B after $2.2B revenue'
    - Shows current upper-end defense-tech premium when scale and contracts are visible
    - Much larger and more proven than Firestorm
  - - Shield AI
    - Private late-stage round
    - '2025: $5.3B; 2026: $12.7B after Air Force-driven step-up'
    - Shows how defense valuations can jump on program relevance
    - Still more mature and software-centric than Firestorm
  - - AeroVironment
    - Public filing + market-data surface
    - Active 10-K-reporting public drone company
    - Useful listed UAS benchmark for ongoing relative tracking
    - Different business mix and maturity
  - - Kratos
    - Public filing + market-data surface
    - Active 10-K-reporting defense company with unmanned exposure
    - Useful larger defense-manufacturing benchmark
    - Broader portfolio than Firestorm
  - - Ondas / Red Cat
    - Public filing + market-data surface
    - Active public small-UAS names; Ondas also appears in Firestorm’s investor list
    - Useful smaller-cap defense-drone bracket
    - Neither is a manufacturing-first mobile-factory analogue
  - - Defense-tech market backdrop
    - Sector commentary / research
    - Strong capital inflow but explicit warning about the prototype-to-production gap
    - Helps frame premium vs. risk simultaneously
    - Macro sentiment is not company-level proof
  notes: Comparable set mixes private rounds, public-reporting UAS names, and sector-level context because no single company perfectly matches Firestorm’s mobile-manufacturing plus modular-drone profile.
