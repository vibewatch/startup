- id: final-diligence-asks
  title: Exit Readiness and Final Diligence Asks
  body: Firestorm is not yet an IPO-readiness story in the public record; it is still a private, growth-financed defense manufacturing story. That means valuation discipline depends on questions that sophisticated investors should treat as gating rather than nice-to-have. Management needs to provide the post-money and preference stack, not just the amount raised. It needs to explain what portion of visible government traction is prototype, ceiling, obligated, recurring, or program-of-record quality. It needs to show how HP concentration is contractually protected and what contingency exists if service, feedstock, or hardware availability changes. It also needs to prove that the compliance stack is mature enough to support larger defense programs without delays. Those diligence asks do not negate the strategic upside. They define whether the upside can be purchased at a rational price. Until those asks are answered, the correct stance is to keep Firestorm on the active list but not to treat
    the current valuation as cleanly underwritten.
