callouts:
- calloutType: recommendation
  title: Public evidence supports interest, not a clean price
  body: Firestorm has enough strategic momentum to remain on the short list, but not enough public price transparency to justify a buy call. That is the central distinction in this chapter.
  claimRefs:
  - CV029
  - CV030
  - CV036
- calloutType: risk
  title: The missing post-money is a real underwriting gap
  body: Investors can know that Firestorm has raised a lot of capital without knowing whether the current entry price is attractive. Until the company discloses the latest price and preference stack, return math is incomplete.
  claimRefs:
  - CV029
  - CV030
  - CV031
- calloutType: insight
  title: Defense-tech comps validate upside—but at higher disclosed scale
  body: Anduril and Shield AI show that defense startups can earn premium private valuations when contracts and revenue become legible. Firestorm’s story points in that direction, but its public metrics have not yet caught up to that valuation standard.
