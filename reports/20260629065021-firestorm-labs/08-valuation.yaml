- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - No clean pricing disclosure
    - Management will not disclose post-money, senior terms, or waterfall during diligence
    - Prevents rational underwriting of return potential
    - Do not advance beyond research-more
  - - Contract conversion stalls
    - Obligated revenue remains narrow relative to announced ceiling and deployment narrative
    - Bull case loses its clearest scaling proof
    - Re-cut valuation to base/bear range
  - - HP dependence becomes brittle
    - No contingency for printer, feedstock, or service disruption
    - Manufacturing moat turns into manufacturing fragility
    - Apply higher execution discount and margin skepticism
  - - Compliance readiness slips
    - DDTC / SAM / cyber controls cannot be evidenced on demand
    - Large-program growth gets delayed or blocked
    - Pause until compliance pack is complete
  - - Next round is structurally punitive
    - New financing arrives with heavy seniority or a down-round dynamic
    - Common-equity upside compresses sharply
    - Re-underwrite from liquidation stack upward
  notes: Kill triggers focus on facts that can invalidate either the scaling case or the return case, not merely the product story.
  claimRefs:
