  - CV034
  - CV040
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current post-money and share price
    - Exact latest valuation, price per share, and implied dilution
    - Without price, recommendation cannot move beyond research-more
    - Company CFO / data room request
  - - Preference stack
    - Liquidation waterfall, debt seniority, and investor rights
    - Return outcomes depend on structure, not just enterprise value
    - Company counsel / cap-table software export
  - - Contract quality
    - Breakout of prototype, ceiling, obligated, and recurring funded revenue
    - Separates signal from marketing narrative
    - CRO / finance team contract schedule
  - - Manufacturing economics
    - Gross margin, throughput, yield, and field-service burden for xCell deployments
    - Core to whether premium multiples are warranted
    - Operations review and customer reference checks
  - - Supplier resilience
    - HP exclusivity terms, service commitments, feedstock contingency
    - Determines whether the moat is durable or brittle
    - Procurement and partnership review
  - - Compliance pack
    - DDTC, SAM, NIST/CMMC evidence and owners
    - Large-program scalability depends on this stack being real
    - Legal / compliance workstream
  notes: These asks are the shortest path to turning Firestorm from a compelling strategic story into an investable priced opportunity.
