- id: financing-and-entry-discipline
  title: Financing History and Entry Discipline
  body: 'Firestorm’s disclosed financing history is directionally positive but still incomplete for pricing. The company has publicly announced a $47 million Series A that included venture debt and an $82 million Series B that lifted disclosed capital to $153 million. That is meaningful runway for a hardware-heavy defense startup. It also implies a capital structure complex enough that preferred terms, liquidation stack, and investor rights can materially alter common-equity outcomes. The problem is not that the company lacks investor validation. It clearly has it. The problem is that public evidence still does not show the exact post-money, how much dilution has accumulated across rounds, or what structural seniority sits above any new common-equity entry. The SEC browse surface identifies Firestorm in EDGAR-adjacent results, but this run did not produce a clean, readable Form D trail that resolves the missing pricing detail. That makes entry discipline the core valuation issue: the company
    may be attractive, but the current public record is not enough to say whether the price is attractive.'
