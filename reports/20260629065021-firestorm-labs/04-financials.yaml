callouts:
  - calloutType: risk
    title: IDIQ Ceiling-to-Obligation Gap Is the Primary Revenue Risk
    body: >-
      The $100M USAF IDIQ is Firestorm's most-cited revenue signal, but only $27M
      of the ceiling has been obligated as of April 2026. If the Air Force does not
      issue additional task orders—due to budget sequestration, program delays,
      performance concerns, or competitive recompete—the realized revenue from this
      vehicle may never approach the ceiling. Defense IDIQ ceilings historically
      obligate at varying rates; some vehicles obligate less than 30% of ceiling
      over their full term. Investors should treat $27M as the only contractually
      committed revenue figure, not $100M.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI035

  - calloutType: risk
    title: Burn Acceleration Outpaces Revenue Visibility
    body: >-
      Firestorm's headcount grew 4× in 12 months, its facility footprint more than
      doubled, and the Series B was immediately earmarked for capital-intensive
      activities including xCell production and Indo-Pacific fielding. The combined
      burn pressure from labor, capex, and logistics is estimated at $2.4–3.2M per
      month based on headcount alone—likely an underestimate once facility rent,
      HP printer procurement, and deployment costs are included. Against this burn,
      no contract revenue figure has been disclosed to offset the draw on Series B
      proceeds. This asymmetry—accelerating cash outflows against invisible inflows—
      is the central financial risk for investors at this stage.
    claimRefs:
      - CI019
      - CI020
      - CI031
      - CI036

  - calloutType: insight
    title: Filing Transparency Gap Versus Public Peers Is Extreme
    body: >-
      Every meaningful public defense comparator—AeroVironment (AVAV), Red Cat
      (RCAT), and Ondas (ONDS)—files quarterly and annual financial statements with
      the SEC. Ondas, which is a Series B investor in Firestorm, itself discloses
      revenue, cash, and burn in 10-Q filings. Firestorm, as a private company, has
      no equivalent disclosure obligation and has not voluntarily published any
      financial data. This makes Firestorm uniquely opaque for a company at its
      funding level and with its level of public media profile. The diligence
      requirement is clear: without management disclosure of audited or reviewed
      financial statements, no credible underwriting of revenue quality, capital
      adequacy, or margin trajectory is possible.
    claimRefs:
      - CI028
      - CI029
      - CI030
      - CI031

  - calloutType: recommendation
    title: Minimum Financial Disclosures Required Before Investment Decision
    body: >-
      A credible investment decision requires at minimum: (1) audited or reviewed
      balance sheet at Series B close showing cash and short-term investments;
      (2) trailing 12-month income statement showing revenue, gross margin, and
      operating expenses; (3) funded backlog schedule showing signed task orders
      and performance milestones; (4) J.P. Morgan debt term sheet including
      maturity, rate, covenants, and any cross-default provisions with the IDIQ;
      (5) management-prepared 18-month runway model with revenue scenario inputs
      labeled. These disclosures are standard for a Series B investment and should
      not require negotiation.
    claimRefs:
      - CI015
      - CI031
      - CI014
      - CI003

