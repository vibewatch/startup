  - id: peer-filing-transparency-comparison
    title: Peer Filing Transparency Comparison — Public Data Gaps
    body: >-
      The contrast between Firestorm's financial disclosure posture and that of its
      publicly traded defense peers is stark. AeroVironment (AVAV) files an annual 10-K
      with the SEC, with the most recent filed June 25, 2025; the filing contains revenue
      by segment, gross margin, R&D costs, operating cash flows, balance-sheet cash
      position, and funded backlog. Red Cat Holdings (RCAT) filed its most recent 10-K on
      March 19, 2026, disclosing comparable financials including cash on hand, quarterly
      burn, and contract pipeline. Ondas Inc. (ONDS), a direct Firestorm Series B investor,
      files 10-Q quarterly reports, with the most recent dated May 15, 2026. All three
      companies carry market capitalizations that make direct valuation comparison
      possible. Draganfly (DPRO), a smaller public comparator in the drone space, also
      files with the SEC. Firestorm, as a private company, does not appear as a named
      filer in SEC EDGAR based on a full-text search of the system.


      This creates a structural asymmetry in diligence. Every quantitative benchmark in
      this chapter—gross margin analog, burn proxy, runway estimate, and capital intensity
      comparison—is derived from public peer data or extrapolated from headcount because
      Firestorm has disclosed nothing. The IDIQ ceiling of $100 million is frequently
      cited in media coverage as a proxy for company scale, but it is a contract
      authorization, not a revenue figure; the $27 million obligated value is the only
      contractually committed revenue signal, and even that is an aggregate across task
      orders whose individual amounts, timing, and acceptance conditions remain private.
      An investor or diligence team cannot construct a credible financial model without
      direct management disclosure of cash position, trailing revenue, gross margin, and
      funded backlog. The gaps are enumerated in the table below.
    claimRefs:
      - CI028
      - CI029
      - CI030
      - CI031
      - CI033
      - CI034
    tableRefs:
      - TI005
    figureRefs:
      - FI002

  - id: financial-verdict
    title: Financial Verdict — Revenue Quality, Burn Risk, and Diligence Blockers
    body: >-
      Firestorm's revenue quality is low on publicly available evidence. All confirmed
      revenue flows through a single customer class (USG/DoD), within a narrow program
      vehicle set, and the total confirmed obligated amount of $27 million under the
      flagship IDIQ is modest relative to the $153 million in disclosed financing. This
      does not mean Firestorm is in financial difficulty—APFIT, STRATFI, and unannounced
      task orders may be adding significantly to the revenue base—but the inability to
      verify any of this from external sources is the problem. The adverse analysis from
      robotics.press reinforces this: the gap between a development contract and a
      production program is exactly where hardware defense companies historically stall.
      Firestorm has not publicly demonstrated production-to-acceptance conversions or
      delivery of acceptance-tested hardware at scale.


      The burn risk is real and accelerating. A fourfold headcount increase over twelve
      months, a facility expansion, and a capital-intensive product requiring industrial
      HP printers in each deployable unit collectively create a high monthly cash
      obligation. The Series B runway estimate (26–34 months) is optimistic in the sense
      that it assumes no capex surprises, no HP printer procurement delays, and steady
      contract inflows—none of which are verifiable. The DoD additive manufacturing budget
      is growing (reportedly 83% YoY) and the DAF FY27 President's Budget request of
      $338.8 billion represents a 38% increase over FY26 enacted, which is a favorable
      macro backdrop. However, DoD budget growth does not translate to Firestorm-specific
      revenue without task-order awards and production delivery, and those conversion
      events are the open question. The financial verdict is: thesis is funded, burn is
      accelerating, and the diligence path requires direct management disclosure of cash,
      revenue, and backlog before any investment decision can be underwritten with
      confidence.
    claimRefs:
      - CI035
      - CI036
      - CI037
      - CI038
      - CI039
      - CI032
      - CI033
      - CI034

