      topic: capital adequacy
      sourceRefs:
        - SI003
      confidence: medium
      freshness: current

  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation
      missingEvidence: >-
        Post-money valuation for Series B (and all prior rounds) is not
        publicly disclosed. No secondary-market transaction data, cap-table
        record, or SAFE filing is available in public sources.
      whyItMatters: >-
        Without a valuation anchor, return analysis, dilution modeling, and
        any comparative efficiency metric relative to funded peers are
        impossible to construct from public data.
      diligencePath: >-
        Request last primary mark and cap-table summary from board; check
        Forge Global, EquityZen, or AngelList for secondary transactions;
        request most recent 409A report.
      relatedQuestionRefs:
        - QI003

    - type: private-evidence-only
      severity: blocking
      topic: financial transparency
      missingEvidence: >-
        No revenue, gross margin, cash balance, operating cash flow, or
        funded backlog has been publicly disclosed by Firestorm. The company
        has not filed any financial statements with the SEC.
      whyItMatters: >-
        Cannot underwrite revenue quality, capital adequacy, or burn trajectory.
        Every financial metric in this chapter is an estimate or peer analog,
        not a company-reported number.
      diligencePath: >-
        Request audited or reviewed financial statements (balance sheet,
        P&L, cash flow statement) for the most recent fiscal year and
        trailing 12 months from management or CFO.
      relatedQuestionRefs:
        - QI012

    - type: missing-source
      severity: material
      topic: revenue recognition
      missingEvidence: >-
        No revenue recognition policy has been disclosed for Firestorm's
        government contracts. It is unclear whether revenue is recognized
        upon acceptance, milestone delivery, cost incurrence (cost-plus),
        or percentage-of-completion.
      whyItMatters: >-
        Revenue recognition method determines timing and quality of revenue.
        Cost-plus contracts recognize revenue as costs are incurred (potentially
        front-loaded); acceptance-based contracts recognize only upon delivery
        (potentially back-loaded). The difference materially affects the
        revenue-versus-cash-burn relationship.
      diligencePath: >-
        Request accounting policy memo from CFO; review task-order SOW to
        understand billing event triggers; ask auditors (or the company if
        pre-audit) to describe the revenue recognition approach by contract type.
      relatedQuestionRefs:
        - QI017

    - type: missing-source
