      - number: '4.3'
        title: Cost Structure and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Firestorm's cost structure is dominated by hardware capital intensity and a rapidly growing labor base.
              Each xCell unit spans two shipping containers equipped with industrial-grade HP 3D printers; Firestorm
              holds a five-year global exclusive with HP to deploy this technology in mobile production units, which is
              a meaningful strategic asset but also means xCell unit economics are anchored to high-cost capital
              equipment per deployment. Weapons and kinetic payloads integrated into Tempest UAS are not additively
              manufactured—they are procured separately—meaning Firestorm's bill of materials includes both printed
              components and externally sourced munitions or EW hardware, a dual-sourced COGS structure that complicates
              margin analysis. The Army's use of xCell to print Bradley Fighting Vehicle replacement parts on-site
              demonstrates platform versatility but also implies an unpredictable spare-parts revenue mix that is hard
              to model.


              Labor costs are the most legible burn signal. The team grew approximately fourfold from 40 to over 160
              employees in the twelve months prior to the Series B close in April 2026. At a fully loaded cost of
              $15,000–$20,000 per employee per month (a reasonable proxy for a San Diego defense-hardware organization
              of this profile), the headcount implies a monthly labor burn of approximately $2.4 million to $3.2
              million. Facility costs add to this: the company announced a move from a 15,000 square-foot facility to a
              35,000 square-foot location, more than doubling its physical footprint. Neither production yields per
              xCell unit nor materials unit costs nor gross margin by product line are disclosed in any public source.
              Public defense hardware peers like AeroVironment and Red Cat report gross margins of 45–55 percent and
              30–35 percent respectively in their SEC filings, providing the only available analog; Firestorm's actual
              gross margin trajectory is unknown.
            claimRefs:
              - CI017
              - CI018
              - CI019
              - CI020
              - CI021
