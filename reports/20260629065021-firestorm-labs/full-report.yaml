      - number: '3.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Production-to-Development Gap is the Core Competitive Risk
            body: >-
              Firestorm's most significant competitive disadvantage is not a product or technology shortfall but a
              contracting and certification gap. All $100M of the USAF IDIQ ceiling is available on paper, but only $27M
              is obligated as of April 2026 and the xCell System Development award is explicitly a development—not
              production—vehicle. Competitors with accepted hardware (AeroVironment, Shield AI V-BAT, Red Cat/Teal SRR)
              have cleared the qualification hurdle that Firestorm has not yet crossed. Firestorm's absence from the
              public Drone Dominance Gauntlet I awardee list, which paid $150M to 11 companies for 30,000 attack drones,
              is the most concrete adverse data point available.
