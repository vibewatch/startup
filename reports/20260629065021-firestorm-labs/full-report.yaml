companyProfile:
  summary: >-
    Firestorm Labs is a San Diego-based private defense-manufacturing startup founded in 2022 by Dan Magy, Chad McCoy,
    and Ian Muceus. It sells xCell, a containerized expeditionary additive-manufacturing cell, alongside Tempest and
    Squall unmanned aircraft platforms designed to be produced, repaired, or adapted near the point of need. Public
    traction is concentrated in U.S. military programs, especially Air Force and AFRL pathways, with Army sustainment
    and Indo-Pacific fielding evidence emerging but not yet broadly disclosed.
