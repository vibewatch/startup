              Firestorm discloses more about website privacy than about product certification, which is useful but
              incomplete for diligence. The April 2026 privacy policy is explicit about basic controls — essential local
              storage only, no tracking cookies, no sale of personal data for marketing, and formal handling of
              recruiting, contact, and contracting information. Hiring materials further imply that
              regulated-environment practices matter because roles call out GovCloud, incident response, and ITAR/EAR
