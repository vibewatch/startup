      - number: '2.2'
        title: Buyer, user, payer, and procurement path
        blocks:
          - type: paragraph
            body: >-
              Public buyer evidence is unusually concrete for a private company at this stage. Firestorm sources point
              to Air Force and Army organizations, while broader policy sources identify the exact procurement
              environment in which low-cost attritable systems are being pulled into service. The user is the
              operational unit that needs reconnaissance, electronic warfare, strike, or sustainment support; the payer
              is typically a program office, innovation budget, or service procurement line; and the adoption trigger is
              operational urgency around cost, readiness, and contested logistics. The Army's FoSUAS and LASSO logic
              shows how UAS are mapped by echelon from squad to battalion, while Drone Dominance and Replicator show a
              separate high-tempo channel for fast, low-cost attack-drone procurement. NATO and allied counter-drone
              frameworks add a second, adjacent buyer universe in which small-UAS proliferation pulls procurement
              outward beyond the U.S. alone.
