  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Firestorm Labs competes inside a large and well-funded defense unmanned-systems sector but occupies a
              distinctive sub-category: containerized, field-deployable drone manufacturing. The broader landscape can
              be organized into six layers. Direct software and autonomy peers—Anduril and Shield AI—have raised the
              most capital of any defense-tech VC-backed companies in 2026 and own established DoD program
              relationships, but neither offers forward-deployed additive manufacturing. Platform hardware
              incumbents—AeroVironment (Switchblade, JUMP 20-X), Teal Drones/Red Cat (Army SRR program of record)—have
              production track records and Blue UAS or program certifications, but they source airframes from
              centralized fixed facilities. Adjacent software platforms—Auterion (AuterionOS, Nemyx swarm) and Skydio
              (public safety / X10D)—provide open-architecture flight stacks and autonomous navigation but do not
              manufacture drones in theater. Public-safety substitutes—BRINC, Skydio for law-enforcement—do not compete
              on DoD expeditionary missions. The status-quo alternative is traditional centralized procurement:
              rear-area fixed facilities with multi-month lead times that DoD has explicitly designated as a "contested
              logistics" vulnerability, one of only six national critical technology areas. The most relevant likely
              entrants are Rheinmetall, which markets a container capable of dispensing attack drones (but not
              manufacturing them), and Cummings Aerospace, which has completed flight trials of a 3D-printed loitering
              munition. Executive Order 14307 ("Unleashing American Drone Dominance") and Ukraine combat
              experience—where drone design cycles compress to days and loss rates approach 1,000 units per day—have
              validated Firestorm's thesis but also accelerated competitor interest in expeditionary production.
            claimRefs:
              - CP036
              - CP037
              - CP038
              - CP039
              - CP040
