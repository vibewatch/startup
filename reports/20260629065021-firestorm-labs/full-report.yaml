      - number: '4.5'
        title: Peer Filing Transparency Comparison — Public Data Gaps
        blocks:
          - type: paragraph
            body: >-
              The contrast between Firestorm's financial disclosure posture and that of its publicly traded defense
              peers is stark. AeroVironment (AVAV) files an annual 10-K with the SEC, with the most recent filed June
              25, 2025; the filing contains revenue by segment, gross margin, R&D costs, operating cash flows,
              balance-sheet cash position, and funded backlog. Red Cat Holdings (RCAT) filed its most recent 10-K on
              March 19, 2026, disclosing comparable financials including cash on hand, quarterly burn, and contract
              pipeline. Ondas Inc. (ONDS), a direct Firestorm Series B investor, files 10-Q quarterly reports, with the
              most recent dated May 15, 2026. All three companies carry market capitalizations that make direct
              valuation comparison possible. Draganfly (DPRO), a smaller public comparator in the drone space, also
              files with the SEC. Firestorm, as a private company, does not appear as a named filer in SEC EDGAR based
              on a full-text search of the system.


              This creates a structural asymmetry in diligence. Every quantitative benchmark in this chapter—gross
              margin analog, burn proxy, runway estimate, and capital intensity comparison—is derived from public peer
              data or extrapolated from headcount because Firestorm has disclosed nothing. The IDIQ ceiling of $100
              million is frequently cited in media coverage as a proxy for company scale, but it is a contract
              authorization, not a revenue figure; the $27 million obligated value is the only contractually committed
              revenue signal, and even that is an aggregate across task orders whose individual amounts, timing, and
              acceptance conditions remain private. An investor or diligence team cannot construct a credible financial
              model without direct management disclosure of cash position, trailing revenue, gross margin, and funded
              backlog. The gaps are enumerated in the table below.
