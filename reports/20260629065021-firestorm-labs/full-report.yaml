            body: >-
              Firestorm's visible customer universe is narrow and defense-specific. Public proof clusters around the Air
              Force ecosystem — AFRL, AFWERX-adjacent programs, AFSOC, and contract vehicles that support broader Air
              Force experimentation and procurement — with secondary evidence that the Army has used Firestorm systems
              or manufacturing outputs in exercises and sustainment scenarios. The company and adjacent profiles also
              speak about allied militaries and humanitarian organizations, but those references read as target segments
              rather than named, proven deployed customers. That distinction matters because this chapter is not
              evaluating TAM; it is evaluating demonstrated adoption. On that basis, Firestorm appears to have a real
              but concentrated government customer base, with the strongest evidence rooted in U.S. military procurement
              records and named domestic deployments rather than in a wide roster of disclosed end users.
