      - number: '8.4'
        title: Bull / Base / Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Because exact price and revenue are not public, scenario analysis is the only intellectually honest way to
              frame valuation. In the bull case, Firestorm converts today’s contract and deployment proof into a wider
              funded program base, keeps HP-enabled manufacturing differentiation intact, and shows that xCell can scale
              faster than conventional drone supply chains. In that world, premium defense-tech multiples remain
              relevant and a billion-dollar-plus enterprise value is reasonable. In the base case, the company continues
              to grow but does so on a slower procurement curve, with recurring funded revenue and manufacturing margins
              taking longer to prove than investors hope. In the bear case, prototype-style traction proves harder to
              convert, supplier or compliance frictions slow deployment, and the next financing round is priced more on
              hardware risk than on strategic narrative. Public evidence supports all three paths enough to keep the
              recommendation cautious. The issue is not whether Firestorm could become very valuable; it is whether a
              new investor can underwrite that path at an unknown current price.
