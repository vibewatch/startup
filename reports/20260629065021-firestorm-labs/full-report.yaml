  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Firestorm is operating in one of the most regulation-dense corners of the startup market: military-focused
              drones, forward-deployed additive manufacturing, and government procurement. The public evidence is enough
              to frame the risk clearly even though it is not enough to clear the diligence burden. Firestorm openly
              markets modular UAS and printable mission hardware for warfighters, which makes ITAR treatment of both
              hardware and technical data the default assumption rather than a remote edge case. The FAR telecom clauses
              and foreign-acquisition rules add another layer because even a strong product can become unawardable if
              the electronics stack, communications chain, or manufacturing bill of materials contains banned or
              noncompliant inputs. The strongest adverse signal in the current public record is mundane but telling: the
              homepage links a privacy-policy PDF that returned 404 on this run. That does not prove broader legal
              failure, but it does suggest that back-office governance is trailing the company’s operational ambition.
              The most important unanswered compliance question is whether Firestorm can produce DDTC registration, SAM
              registration, and a documented CMMC or NIST 800-171 implementation path on demand.
