      - number: '2.5'
        title: Constraints and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The demand case is strong, but the adoption path is not frictionless. Multiple sources converge on the
              same bottleneck: production readiness matters more than conceptual novelty once procurement moves to
              scale. C4ISRNET reporting on Replicator says buyers care about how close vendors are to volume production,
              and its more skeptical commentary argues that mass alone is insufficient without integration, sustainment,
              and reliable signals to industry. Counter-drone economics also cut both ways. The Pentagon wants
              lower-cost intercept and attack options because legacy cost curves are unsustainable, but the same
              pressure can favor manufacturers with the cheapest, most bankable hardware and the cleanest
              industrialization path. Public sources still do not establish whether edge-manufacturing cells can meet
              defense-grade QA, certification, and repeatability standards as easily as they satisfy operational
              storytelling. That is the core adverse lens to carry forward.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM022
              - CM035
              - CM039
