      - number: '2.6'
        title: What remains unknowable from public data
        blocks:
          - type: paragraph
            body: >-
              The key remaining gap is not whether there is money in military drones. There is. The harder question is
              how much of that money belongs to Firestorm's exact niche and what share the company can realistically
              capture before other manufacturers, primes, or government-owned production schemes take it. Public analyst
              reports disagree sharply on top-down market size, and official budget lines aggregate many programs whose
              accessibility to Firestorm is unclear. The chapter can therefore defend a boundary, a budget floor, and a
              growth thesis, but it cannot defend a precise Firestorm SAM/SOM without private data on target programs,
              win rates, unit economics, or customer concentration. That unresolved precision problem should be
              preserved as a diligence gap rather than disguised with a single broad market number.
            claimRefs:
              - CM024
              - CM026
              - CM036
              - CM037
