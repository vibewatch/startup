  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Contract Architecture
        blocks:
          - type: paragraph
            body: >-
              Firestorm's public revenue architecture rests on three government program vehicles, none of which
              discloses absolute realized revenue. The most important is a five-year, $100 million IDIQ contract awarded
              by the U.S. Air Force in December 2024 under the SBIR Phase III authority. The IDIQ allows the Air Force
              to issue multiple task and delivery orders with individual performance periods of up to 24 months after
              the final order. Because SBIR Phase III status applies, the IDIQ can also be used to issue orders from
              other federal agencies, expanding the nominal addressable billing surface beyond the Air Force. However,
              TechCrunch reporting as of April 2026 confirms that only $27 million of the $100 million ceiling had been
              obligated—meaning the ceiling is a capacity authorization, not a revenue commitment, and roughly 73
              percent of the headline contract value remains uncommitted.


              Beyond the IDIQ, the company announced a STRATFI PY25.1 award from AFVentures to scale production and
              deployment of its UAS and xCell platform, and in May 2026 disclosed an APFIT award of up to $30 million
              for expanded xCell deployment and Tempest production in the Indo-Pacific. The APFIT award is contingent on
              performance milestones and its exact contract type—firm-fixed-price versus cost-plus—has not been
              disclosed. All three vehicles share a common characteristic: the revenue Firestorm can recognize from them
              is bounded by task-order issuance and acceptance testing, not by ceiling value. The company also claims a
              broader revenue model that includes hardware sales and services across all military branches, but no
              disaggregated breakdown or independent corroboration of multi-branch traction is available.
            claimRefs:
              - CI001
              - CI002
