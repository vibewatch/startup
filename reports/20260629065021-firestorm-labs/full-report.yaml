chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and product architecture
        blocks:
          - type: paragraph
            body: >-
              Firestorm Labs' public identity is unusually consistent across official and independent sources. The
              homepage, privacy policy, and independent profiles all place the company in San Diego and frame it as a
              defense startup founded in 2022 around expeditionary additive manufacturing and modular unmanned aircraft.
              Rather than pitch a generic software stack, Firestorm centers its company narrative on xCell, a deployable
              production system intended to make airframes, spare parts, and partner systems at the tactical edge. The
              product stack is built around xCell, the Tempest family, and the Squall FPV platform. That package matters
              because it makes Firestorm more than a drone OEM: it is trying to sell a manufacturing method for
              contested logistics, where the ability to print, assemble, and repair systems near the fight is the core
              product logic.
