  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      Public materials imply a six-step operating loop from mission requirement to local manufacture, field integration,
      mission execution, and repair.
    data:
      nodes:
        - id: n1
          label: Mission need identified in contested environment
        - id: n2
          label: Digital design / mission kit chosen for Tempest or Squall
        - id: n3
          label: xCell prints modular airframe structures and components
        - id: n4
          label: Operators assemble platform, integrate payloads, and run checks
        - id: n5
          label: Unit launches configured UAS for ISR, EW, strike, or training mission
        - id: n6
          label: Damaged systems or changed mission demands trigger repair / reconfiguration loop
      edges:
        - from: n1
          to: n2
          label: defines
        - from: n2
          to: n3
          label: drives
        - from: n3
          to: n4
          label: feeds
        - from: n4
          to: n5
          label: enables
        - from: n5
          to: n6
          label: creates sustainment need
        - from: n6
          to: n2
          label: loops back for redesign / re-fit
    approximationNotes: >-
      The flow abstracts multiple public descriptions into one cycle; Firestorm does not publish a formal BPMN-style
      workflow.
    claimRefs:
      - CE006
      - CE007
      - CE016
      - CE017
      - CE018
      - CE019
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Firestorm sits at the center of a dependency web spanning print hardware, feedstock, military customers, field
      lift, and cloud-edge software operations.
    data:
      nodes:
        - id: firestorm
          label: Firestorm Labs
          description: System integrator for expeditionary manufacturing, airframes, and software operations
        - id: hp
          label: HP MJF platform
          description: Critical print-core technology and materials ecosystem for xCell
        - id: feedstock
          label: Polymer feedstock + climate control
          description: Material availability and environmental stability required for repeatable output
        - id: lift
          label: Transport + field power
          description: Trailer / aircraft lift and austere-environment power assumptions
        - id: mil
          label: USAF / AFRL / AFSOC / Army demand
          description: Primary public customer set validating and funding the platform
        - id: cloud
          label: Cloud / GovCloud / edge runtime
          description: Software platform that supports deployment automation, observability, and reliability
        - id: payloads
          label: Payload and partner-platform ecosystem
          description: Mission kits and third-party systems that make open-architecture claims meaningful
      edges:
