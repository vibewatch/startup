      - number: '1.5'
        title: Adverse signals and unresolved diligence asks
        blocks:
          - type: paragraph
            body: >-
              The company narrative is strong, but the adverse record is not empty. The most useful challenge comes from
              robotics.press, which argues that Firestorm's hardest transition is moving from development contracts and
              media attention to independently verified production programs with documented acceptance testing. That
              source specifically flags the absence of public certification KPIs, quality-assurance data, and
              acceptance-tested airframes, which is important because expeditionary manufacturing only compounds QA risk
              at the tactical edge. Separate gaps remain around valuation, revenue, named end customers, and board
              visibility. These omissions do not negate the company's traction, but they do cap confidence in any scale
              thesis that assumes the leap from prototypes and task orders to repeatable production conversion has
              already happened. Those gaps are material and should remain open diligence asks, not smoothed into false
              precision.
