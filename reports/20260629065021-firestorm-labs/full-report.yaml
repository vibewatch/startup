        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Firestorm is not yet an IPO-readiness story in the public record; it is still a private, growth-financed
              defense manufacturing story. That means valuation discipline depends on questions that sophisticated
              investors should treat as gating rather than nice-to-have. Management needs to provide the post-money and
              preference stack, not just the amount raised. It needs to explain what portion of visible government
              traction is prototype, ceiling, obligated, recurring, or program-of-record quality. It needs to show how
              HP concentration is contractually protected and what contingency exists if service, feedstock, or hardware
              availability changes. It also needs to prove that the compliance stack is mature enough to support larger
              defense programs without delays. Those diligence asks do not negate the strategic upside. They define
              whether the upside can be purchased at a rational price. Until those asks are answered, the correct stance
              is to keep Firestorm on the active list but not to treat the current valuation as cleanly underwritten.
            claimRefs:
              - CV018
              - CV029
              - CV030
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV034
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports interest, not a clean price
            body: >-
              Firestorm has enough strategic momentum to remain on the short list, but not enough public price
              transparency to justify a buy call. That is the central distinction in this chapter.
            calloutType: recommendation
            claimRefs:
              - CV029
              - CV030
              - CV036
          - type: callout
            title: The missing post-money is a real underwriting gap
            body: >-
              Investors can know that Firestorm has raised a lot of capital without knowing whether the current entry
              price is attractive. Until the company discloses the latest price and preference stack, return math is
              incomplete.
            calloutType: risk
            claimRefs:
              - CV029
              - CV030
              - CV031
          - type: callout
            title: Defense-tech comps validate upside—but at higher disclosed scale
            body: >-
              Anduril and Shield AI show that defense startups can earn premium private valuations when contracts and
              revenue become legible. Firestorm’s story points in that direction, but its public metrics have not yet
              caught up to that valuation standard.
            calloutType: insight
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV035
