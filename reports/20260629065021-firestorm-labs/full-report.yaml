      - number: '4.2'
        title: Pricing Opacity and GTM Motion
        blocks:
          - type: paragraph
            body: >-
              No public list pricing exists for any Firestorm product—not for xCell containerized manufacturing units,
              not for Tempest drones, and not for spare-parts or sustainment services. All commercial terms are
              negotiated under government contract vehicles where pricing is typically proprietary and not subject to
              Freedom of Information disclosure at the order level. The only pricing signal in public sources is a
              company-asserted claim that the Tempest UAS can be produced at approximately one-fifth the cost of
              comparable fixed-wing systems and ten times faster than legacy manufacturing methods. This claim appears
              in the STRATFI release and in Army Recognition coverage but has not been independently verified against a
              named comparison platform or third-party cost study. No absolute per-unit dollar figure has been
              disclosed.


              Firestorm's GTM motion is entirely direct-to-government. The primary acquisition pathways are AFWERX (for
              SBIR/STRATFI vehicles), APFIT program offices, and IDIQ task ordering. There is no evidence of commercial
              or export sales, channel partners, or resellers in any public source. The xCell open-ecosystem
              strategy—allowing third-party drone makers to use Firestorm's manufacturing infrastructure—creates a
              potential incremental revenue stream from partner platform production, but no partner has publicly
              disclosed payment terms, and no revenue figure has been attributed to this stream. The concentration of
              revenue in a single customer class (DoD/USG) and a narrow set of program vehicles means that sales-cycle
              length, customer acquisition cost, and competitive procurement exposure are all unknown.
            claimRefs:
              - CI023
              - CI024
