      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Firestorm's capital position reflects substantial VC-and-debt financing against a background of zero
              public revenue disclosure. The funding chronology—seed, Series A with venture debt, and Series B—is
              detailed in the Company Overview chapter. For capital adequacy purposes, the relevant facts are: total
              disclosed financing reached $153 million at the Series B close; the Series B itself was $82 million led by
              Washington Harbour Partners, with a second and final tranche of approximately $49.5 million that closed
              April 29, 2026 per S&P Capital IQ data; and the Series A package included $12 million in venture debt from
              J.P. Morgan whose terms, maturity, and covenants are not disclosed. No post-money valuation for any round
              has been disclosed in any public source.


              Against the headcount-implied burn of $2.4–3.2 million per month, the $82 million Series B gross proceeds
              would imply roughly 26–34 months of runway—a planning estimate only, as it excludes contract revenue
              inflows, capex obligations, debt service, and any additional spend not captured by headcount. The
              company's stated uses of Series B proceeds—team expansion, xCell production scale-up, and Indo-Pacific
              fielding—are all capital-intensive categories that compress runway faster than headcount alone implies.
              The planned Indo-Pacific full operational deployment is targeted "ideally within the next two years" per
              the CEO, creating a soft deadline that aligns with the estimated runway window but requires sustained
              contract-revenue inflows to be self-funding before another raise. No evidence of revenue milestone
              targets, next-round triggers, or breakeven projections has been disclosed.
