      - number: '2.4'
        title: 'Growth drivers: policy, industrial base urgency, and theater realities'
        blocks:
          - type: paragraph
            body: >-
              The most powerful adoption drivers all point in the same direction. White House policy now explicitly
              prioritizes American-made drones, Blue UAS expansion, supply-chain security, export enablement, and
              routine operations support. DoD budget language separately prioritizes deterring China in the Indo-Pacific
              and revitalizing the defense industrial base, which is exactly the narrative Firestorm uses for xCell.
              Replicator and Drone Dominance then convert that policy momentum into procurement mechanisms that value
              speed, scale, and affordability rather than long-cycle exquisite systems. Allied budgets matter too: NATO
              data and Atlantic Council's 2026 tracker show defense spending growth broadening across Europe and Canada,
              while NATO's own counter-drone contract activity shows that drone proliferation is no longer a
              single-service U.S. issue. These drivers favor any supplier that can combine low-cost hardware, local
              production, and credible readiness.
            claimRefs:
              - CM009
              - CM013
              - CM014
              - CM023
              - CM031
              - CM034
              - CM039
