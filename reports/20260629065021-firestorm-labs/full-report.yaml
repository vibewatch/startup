  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The reason investors keep leaning into Firestorm is easy to see. The company is selling into a defense
              environment that increasingly rewards distributed manufacturing, attritable systems, and logistics
              resilience. Public sources show a compelling strategic story: modular UAS, a forward-deployable factory,
              real military deployments, and a founder team fluent in defense hardware and additive manufacturing. The
              anti-thesis is just as important. The public record still does not disclose a verified post-money
              valuation, a clear Form D trail, or enough recurring-revenue detail to treat the company’s latest price as
              independently supported. In other words, the qualitative thesis looks strong, but the quantitative entry
              case remains incomplete. That matters because defense-tech exuberance can push valuations higher on
              strategic narrative long before unit economics, contract conversion, or cap-table structure become
              transparent. Firestorm may well deserve premium attention, but the public file still asks investors to pay
              on trust before it lets them underwrite on full evidence.
