            body: >-
              The named founder set is consistent and gives Firestorm credible founder-market fit even if broader
              governance disclosure is thin. Dan Magy brings repeat founder experience in defense systems, Chad McCoy
              anchors the operational user and acquisition narrative through prior special-operations and Air Force
              innovation roles, and Ian Muceus contributes the additive-manufacturing and industrialization layer. That
              mix supports Firestorm's story that expeditionary production is a practical defense-manufacturing problem
