  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: what Firestorm is and is not selling into'
        blocks:
          - type: paragraph
            body: >-
              The correct market boundary starts by excluding a great deal of spend that casual drone-TAM narratives
              would include. Firestorm is not competing for all civil UAS, all aerospace autonomy, or all
              precision-strike budgets. Public product and contract evidence points instead to a narrower intersection:
              Group 1-3 military UAS, low-cost attritable or one-way attack systems, and expeditionary manufacturing
              that can print or sustain those systems near the point of use. That last element matters because it
              changes the denominator. A conventional market estimate for military drones counts airframes; Firestorm is
              trying to capture value in the production method, repair loop, and rapid-iteration workflow behind those
              airframes. The market should therefore be treated as a military-drone procurement wedge conditioned by
              logistics pain, not a generic drone-software or aviation-manufacturing TAM.
            claimRefs:
