      - number: '2.4'
        title: 增长驱动：政策、工业基础紧迫性与战区现实
        blocks:
          - type: paragraph
            body: >-
              最强采用驱动都指向同一方向。White House 政策现在明确优先支持美国制造无人机、Blue UAS 扩展、供应链安全、出口赋能和日常作战支持。DoD
              预算语言另行优先威慑印太地区的中国，并重振国防工业基础，这正是 Firestorm 用来讲 xCell 的叙事。Replicator 和 Drone Dominance
              随后把这种政策动量转化为采购机制，重视速度、规模和可负担性，而不是长周期精致系统。盟友预算也重要：NATO 数据和 Atlantic Council 的 2026
              年追踪器显示，欧洲和加拿大的国防开支增长正在扩散；NATO 自身反无人机合同活动也说明，无人机扩散不再是美国单一军种问题。这些驱动有利于任何能组合低成本硬件、本地生产和可信战备的供应商。
            claimRefs:
