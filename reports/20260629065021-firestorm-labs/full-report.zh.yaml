          detail: 合同、测试、部署
        - id: reg
          label: DDTC / SAM / CMMC
          detail: 授标和出口资格
        - id: team
          label: 创始人与专家
          detail: AM、捕获、运营
        - id: investors
          label: 战略投资者
          detail: 资本和采购可信度
        - id: mission
          label: 已列装任务结果
          detail: 证明效果，拉动复购需求
      edges:
        - from: hp
          to: mission
          label: 赋能
        - from: reg
          to: mission
          label: 许可
        - from: team
          to: mission
          label: 构建
        - from: dod
          to: mission
          label: 出资
        - from: investors
          to: team
          label: 支撑
        - from: mission
          to: dod
          label: 续约
    claimRefs:
      - CR011
      - CR022
      - CR028
      - CR030
      - CR031
      - CR032
      - CR034
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐结论从战略需求和投资者质量出发，再穿过价格不透明和执行风险，落到“继续研究”。
    data:
      nodes:
        - id: n1
          label: 国防后勤顺风
          detail: 分布式制造和可消耗 UAS 很关键
        - id: n2
          label: 可见牵引
          detail: 已融资、已部署、合同上限
        - id: n3
          label: 定价不透明
          detail: 没有已验证的当前投后估值或清算瀑布
        - id: n4
          label: 执行 / 合规风险
          detail: 合同转化和准备度仍然关键
        - id: n5
          label: 推荐：继续研究
          detail: 保持跟踪，但不要盲目承销价格
    approximationNotes: 该流程是决策图，不是加权评分模型。
    claimRefs:
      - CV002
      - CV004
      - CV017
      - CV029
      - CV030
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 这是合同转化情景下的企业价值敏感性示意，不是披露收入数据。
    data:
      items:
        - label: 熊市情景 EV 低值
          value: 60
        - label: 熊市情景 EV 高值
          value: 200
        - label: 基准情景 EV 低值
          value: 300
        - label: 基准情景 EV 高值
          value: 700
        - label: 牛市情景 EV 低值
          value: 1200
        - label: 牛市情景 EV 高值
          value: 1800
        - label: 已披露融资额
          value: 153
    approximationNotes: 数值是分析师以百万美元计的估算，锚定情景逻辑，不是 Firestorm 披露的估值标记。
    claimRefs:
      - CV002
      - CV031
      - CV032
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于情景的 EV 区间凸显，承销对合同转化和价格不透明高度敏感。
    data:
      items:
        - label: 牛市情景
          low: 1200
          high: 1800
        - label: 基准情景
          low: 300
          high: 700
        - label: 熊市情景
          low: 60
          high: 200
        - label: 未披露当前估值标记
          low: 153
          high: 153
    approximationNotes: “未披露当前估值标记”占位项使用已披露融资额作为公开可见锚点，而不是估值主张。
    claimRefs:
      - CV029
      - CV031
      - CV034
      - CV035
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 记分卡偏向战略契合度和投资者质量，但对价格可见度和执行确定性打折。
    data:
      items:
        - label: 市场顺风
          value: 8
        - label: 任务 / 产品证据
          value: 7
        - label: 投资者质量
          value: 8
        - label: 收入可见度
          value: 4
        - label: 估值可见度
          value: 2
        - label: 合规准备度可见度
          value: 4
        - label: 入场纪律
          value: 3
    approximationNotes: 评分是分析师仅基于本轮审阅的公开证据，在 1–10 分尺度上作出的判断。
    claimRefs:
      - CV004
      - CV017
      - CV019
      - CV020
      - CV029
      - CV036
      - CV037
      - CV038
