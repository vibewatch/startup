      - number: '4.5'
        title: 同行申报透明度比较——公开数据缺口
        blocks:
          - type: paragraph
            body: >-
              Firestorm 的财务披露姿态，与上市国防同行形成鲜明对比。AeroVironment（AVAV）向 SEC 提交年度 10-K，最近一次提交于 2025 年 6 月 25
              日；文件包含按分部划分的收入、毛利率、R&D 成本、经营现金流、资产负债表现金位置和已获资金支持的 backlog。Red Cat Holdings（RCAT）于 2026 年 3 月 19 日提交最近一次
              10-K，披露了可比财务信息，包括手头现金、季度烧钱和合同管线。Ondas Inc.（ONDS）是 Firestorm Series B 的直接投资方，按季度提交 10-Q，最近日期为 2026 年 5 月 15
              日。三家公司都有市值，使直接估值比较可行。Draganfly（DPRO）是无人机领域较小的公开可比公司，也向 SEC 申报。基于对 SEC EDGAR 系统的全文搜索，Firestorm
              作为私营公司并未以具名申报主体出现。


              这在尽调中制造了结构性不对称。本章每一个量化基准——毛利率类比、烧钱代理、runway 估算和资本强度比较——都来自公开同行数据，或因 Firestorm 没有披露任何内容而从员工数外推。媒体报道经常把 $100
              million IDIQ 上限当作公司规模代理，但它是合同授权，不是收入数字；$27 million
              已拨付价值是唯一合同承诺收入信号，即便如此，它也是跨任务订单的汇总，单个订单金额、时间和验收条件仍为私有。没有管理层直接披露现金位置、过去收入、毛利率和已获资金支持的
              backlog，投资者或尽调团队无法搭建可信财务模型。下表列举了这些缺口。
