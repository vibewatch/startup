              UAS、可前沿部署的工厂、真实军事部署，以及熟悉国防硬件和增材制造的创始团队。反论点同样重要。公开记录仍未披露经验证的 post-money 估值、清晰的 Form D
              线索，或足够的经常性收入细节，无法独立支撑公司最新价格。换句话说，定性论点很强，但定量入场理由仍不完整。这一点重要，因为在单位经济、合同转化或股权结构表变透明之前，国防科技热度就可能先靠战略叙事把估值推高。Firestorm
              很可能值得重点关注，但公开档案仍要求投资人先基于信任付钱，而不是让他们基于完整证据承销。
