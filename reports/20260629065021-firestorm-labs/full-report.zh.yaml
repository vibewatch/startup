            - 受争夺物流
            - 需求点生产
            - 野外维修和保障
        - label: 制造单元层
          detail: xCell 把增材制造、环境控制、可部署性和安全通信打包成一个移动生产单元。
          modules:
            - 集装箱式 xCell
            - HP MJF 打印核心
            - PA-12 复合材料原料
            - HVAC / 安全通信 / 电力
        - label: 机体层
          detail: Firestorm 具名机体为利用制造单元而设计，而不是与制造单元割裂。
          modules:
            - Tempest 固定翼系列
            - Squall FPV 平台
            - 替换零部件 / 组件
        - label: 任务集成层
          detail: 公开材料强调，开放架构载荷集成覆盖 ISR、EW/SI 和打击角色。
          modules:
            - ISR 任务套件
            - EW / SI 载荷
            - 动能 / 打击配置
        - label: 软件运营层
          detail: 招聘信号显示，公司有一个云端与边缘平台，负责自动化、可观测性、部署，以及合规要求较高的运行时运营。
          modules:
