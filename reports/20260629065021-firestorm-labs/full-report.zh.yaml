figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Firestorm 从 2022 年成立，推进到 Air Force 合同、战略国防资本背书与 2026 年现场部署；同时，负面报道仍让生产转化风险留在视野中。
    data:
      items:
        - date: '2022-01-01'
          label: 成立
          detail: Firestorm 在圣迭戈创立，切入远征式无人机制造。
          tone: positive
          claimRefs:
            - CO002
            - CO040
        - date: '2024-01-01'
          label: 种子轮
          detail: 公开资料称，与 Lockheed 有关联的国防投资方支持了 $12.5M 种子轮。
          tone: positive
          claimRefs:
            - CO022
        - date: '2025-01-29'
          label: USAF IDIQ
          detail: 公司宣布获得五年期美国空军上限合同，覆盖增材 UAS 和自主能力工作。
          tone: positive
          claimRefs:
            - CO024
            - CO025
        - date: '2025-02-12'
          label: 设施扩张可见
          detail: Axios 报道称，Firestorm 计划在 Miramar 附近建设第三座仓库。
          tone: positive
          claimRefs:
            - CO032
        - date: '2025-07-16'
          label: Booz 战略支持
