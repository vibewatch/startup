            body: >-
              Firestorm 可见的客户范围很窄，且高度聚焦国防。公开证据集中在空军生态——AFRL、AFWERX
              相邻项目、AFSOC，以及支持更广泛空军试验和采购的合同工具——另有次级证据显示，陆军在演习和保障场景中使用过 Firestorm
              系统或制造产出。公司和相邻简介也提到盟军和人道主义组织，但这些表述更像目标客群，而不是具名、已验证的已部署客户。这个区分很重要，因为本章评估的不是 TAM，而是已证明的采用。按这个标准，Firestorm
              似乎拥有真实但集中的政府客户基础，最强证据来自美国军事采购记录和具名国内部署，而不是一长串已披露终端用户。
