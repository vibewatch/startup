      - number: '3.6'
        title: 护城河耐久性与负面证据
        blocks:
          - type: paragraph
            body: >-
              最尖锐的负面映射来自 robotics.press 竞争情报笔记，其中指出三个具体缺口：（1）Firestorm 的 $18M xCell System Development
              奖项是开发合同，不是生产载体；（2）任何公开来源中都没有独立验证的生产交付或通过验收测试的机体；（3）Firestorm 没有出现在 2026 年 3 月 Drone Dominance Gauntlet I 的
              11 家获奖者名单中，这些获奖者分享 $150M，用于 30,000 架攻击无人机。最后一点直接不利，因为 DoD 已经在该品类表达了投入生产资金的意愿，而 Firestorm
              缺席公开获奖名单。国防级机体的增材制造需要有记录的数字线程、材料资质数据和 MIL-SPEC 验收测试；Firestorm 没有发布其中任何一项。HP 合作在战略上合理，但 HP 此前的远征 3D
              打印工作偏向人道主义和商业应用，而不是前沿生产单元的国防级质量保证。五年 HP 独家是竞争护城河；如果 HP 调整商业条款，或其他工业级聚合物打印系统超过 HP
              当前能力，它也会变成单一供应商依赖。Firestorm 在 Tracxn 同行排名中位列 261 家活跃竞争者第 7，反映其相对位置；但排在其前面的三家公司——Anduril、Shield
              AI、Skydio——拥有 Firestorm 尚未匹配的成熟项目记录和产量。robotics.press 分析提到 Tracxn
              内部有一个“Deadpooled”标记，但无法与活跃融资和合同记录调和；这需要独立核验。最耐久的护城河元素是 HP 独家、允许无人机制造商为增材制造改造机体的 xCell 开放生态设计，以及 CEO
              在国防系统中的履历叠加 SOCOM 相关联合创始人。这些都不是不可攻破，但组合起来，对缺少机构知识和供应链配置的竞争者构成了复制时间优势。
