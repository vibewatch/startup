      - number: '3.5'
        title: 分销、信任、切换成本与监管姿态
        blocks:
          - type: paragraph
            body: >-
              Firestorm 的合同路径主要通过 SBIR Phase III，允许多个机构在不重新竞标的情况下，基于 $100M USAF IDIQ 载体下单。这是合法机制，但比 AeroVironment
              和其他主承包商持有的长期 IDIQ 套件更窄；后者有历史履约记录，可满足 CO 对“past performance”的要求。Lockheed Martin Ventures 和 Booz Allen
              Ventures 同时出现在 Series A 和 Series B 中，不只是财务信号——两家公司都有直接 DoD 项目集成路径，可能把 Firestorm 的渠道触达推进到 SBIR
              轨道之外。In-Q-Tel 参与 Series B 又增加了情报共同体触达。sUAS 和巡飞弹品类的切换成本很高：Teal/Red Cat 的 SRR 中选这类 DoD program-of-record
              指定会形成机构惯性，Blue UAS 认证要求把不合规平台挡在多数项目之外，任何给定武器系统的合格供应商名单流程都可能耗时数年。开放架构设计（Firestorm、Auterion）降低了平台层集成摩擦，也降低了
              DoD 买方多归属成本，使其可在不重建指挥控制栈的情况下增加新机体。不过，xCell 制造单元本身是专有的：一旦前沿单位围绕 xCell 工作流和 HP
              打印零件文件搭建生产流程，切换到不同制造系统就需要重新培训和重新认证，这又为 Firestorm 客户制造了反方向切换成本。
