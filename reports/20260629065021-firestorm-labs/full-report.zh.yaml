      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              在公开记录中，Firestorm 还不是一个 IPO 准备度故事；它仍是一家由增长资本支持的私营国防制造公司。这意味着，估值纪律取决于成熟投资人应视为闸门而非锦上添花的问题。管理层需要提供 post-money
              和优先权栈，而不只是融资金额。它需要解释可见政府牵引力中有多少属于原型、上限、已义务、经常性，或正式项目质量。它需要说明 HP
              集中在合同上如何被保护，以及如果服务、原料或硬件可得性变化，有什么应急方案。它还需要证明合规栈足够成熟，可以支撑更大的国防项目且不造成延误。这些尽调问题并不否定战略上行空间。它们定义的是，上行空间能否以理性价格买到。在这些问题得到回答之前，正确姿态是把
              Firestorm 留在活跃名单上，但不要把当前估值视为已经被干净承销。
            claimRefs:
