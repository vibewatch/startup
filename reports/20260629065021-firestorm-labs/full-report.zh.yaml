      - number: '4.2'
        title: 定价不透明与 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              Firestorm 任何产品都没有公开标价——xCell 集装箱化制造单元没有，Tempest 无人机没有，备件或保障服务也没有。所有商业条款都在政府合同载体下谈判，定价通常为专有信息，且订单层面不受
              Freedom of Information 披露约束。公开来源中唯一的定价信号，是公司声称 Tempest UAS 可以按可比固定翼系统约五分之一的成本生产，且速度比传统制造方法快十倍。该主张出现在
              STRATFI 新闻稿和 Army Recognition 报道中，但没有用具名比较平台或第三方成本研究进行独立验证。绝对单机美元价格没有披露。


              Firestorm 的 GTM 动作完全是直面政府。主要采购路径是 AFWERX（用于 SBIR/STRATFI 载体）、APFIT 项目办公室和 IDIQ
              任务下单。任何公开来源中都没有商业销售、出口销售、渠道伙伴或经销商证据。xCell 开放生态策略——允许第三方无人机制造商使用 Firestorm
              制造基础设施——创造了来自合作伙伴平台生产的潜在增量收入流，但没有合作伙伴公开披露付款条款，也没有任何收入数字归因于这条流。收入集中在单一客户类别（DoD/USG）和狭窄项目载体中，意味着销售周期长度、客户获取成本和竞争性采购暴露都未知。
