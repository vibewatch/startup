      - number: '1.3'
        title: 资本形成与规模信号
        blocks:
          - type: paragraph
            body: >-
              Firestorm 的资本形成速度明显加快。保留报道一致指向 2026 年由 Washington Harbour Partners 领投的 $82 million Series B，融资后披露融资总额为
              $153 million。此前 Series A 组合共 $47 million，包含 Lockheed Martin Ventures 和 Booz Allen Ventures 等重要战略投资方，并由
              J.P. Morgan venture debt 扩大融资包。这些投资方重要，因为它们暗示的不是单纯财务财团，而是渠道触达和产品验证。员工数信号在 2026 年也明显变化：sUAS News
              和公司新闻稿称，团队在此前一年从 40 人增长到 160 多人。缺失的数字是估值：公开来源描述了融资轮和投资方，但没有披露投后估值，使一个重要承销输入在公开来源中不可得。
