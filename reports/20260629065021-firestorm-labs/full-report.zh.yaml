            body: >-
              公开需求图景仍高度集中在美国国防客户周围。TechCrunch 称 Firestorm 通过硬件销售和覆盖所有军种的政府合同获得收入，并指出一份空军合同上限为 $100 million，但目前仅有 $27
              million 已获义务资金。这是有用的牵引力，但不等同于广泛、耐久、多客户收入基础。可读的公开奖项界面没有提供清晰主合同列表，SBIR 和 SAM 页面在本环境下也过于单薄，无法判断 Firestorm
              主要是主承包商、分包商、OTA 参与者，还是几者混合。DIU 模式在这里相关，因为许多军民两用国防初创公司都卡在从原型资金转向重复项目资金的阶段。如果 Firestorm
