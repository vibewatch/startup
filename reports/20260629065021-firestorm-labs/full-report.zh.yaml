companyProfile:
  summary: >-
    Firestorm Labs 是一家位于 San Diego 的私营国防制造创业公司，由 Dan Magy、Chad McCoy 和 Ian Muceus 于 2022 年创立。公司销售
    xCell——一种集装箱化远征增材制造单元，同时提供 Tempest 和 Squall 无人机平台，设计目标是在需求点附近生产、维修或改装。公开牵引主要集中在美国军方项目，尤其是空军和 AFRL
    路径；陆军保障和印太部署已有证据浮现，但披露仍不充分。
  foundedDate: '2022-04-30'
  founders:
