      - number: '3.7'
        title: 图表要点
        blocks:
          - type: callout
            title: 从开发到生产的缺口是核心竞争风险
            body: >-
              Firestorm 最大的竞争劣势不是产品或技术短板，而是合同和认证缺口。USAF IDIQ 的 $100M 上限在纸面上全部可用，但截至 2026 年 4 月只有 $27M 已拨付，且 xCell System
              Development 奖项明确是开发载体，不是生产载体。拥有已接收硬件的竞争者（AeroVironment、Shield AI V-BAT、Red Cat/Teal SRR）已经跨过 Firestorm
              尚未跨过的资质门槛。Firestorm 缺席公开 Drone Dominance Gauntlet I 获奖名单，是目前最具体的负面数据点；该项目向 11 家公司支付 $150M，用于 30,000
