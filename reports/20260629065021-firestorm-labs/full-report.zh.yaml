      - number: '8.4'
        title: 牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: >-
              由于确切价格和收入没有公开，情景分析是框定估值的唯一诚实方式。牛市情景下，Firestorm 把今天的合同和部署证明转化为更广的已获资金项目基础，守住 HP 赋能的制造差异化，并证明 xCell
              扩张速度快于传统无人机供应链。在这个世界里，高溢价国防科技倍数仍相关，十亿美元以上企业价值也合理。基准情景下，公司继续增长，但增长沿着更慢的采购曲线推进；经常性已获资金收入和制造利润率比投资人希望的更晚得到证明。熊市情景下，原型式牵引力更难转化，供应商或合规摩擦拖慢部署，下一轮融资按硬件风险而不是战略叙事定价。公开证据对三条路径都有足够支持，因此推荐应保持谨慎。问题不是
              Firestorm 能否变得很有价值；问题是新投资人能否在当前价格未知的情况下承销这条路径。
