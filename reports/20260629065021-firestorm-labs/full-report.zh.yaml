          - type: callout
            title: 投资决策前所需的最低财务披露
            body: >-
              一项可信的投资决策至少需要几项材料：（1）Series B 交割时经审计或审阅的资产负债表，列明现金和短期投资；（2）过去 12
              个月利润表，列明收入、毛利率和运营费用；（3）已获资金支持的积压订单表，列明已签任务订单和履约里程碑；（4）J.P. Morgan 债务条款清单，包含到期日、利率、契约条款，以及与 IDIQ
