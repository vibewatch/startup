      - number: '2.6'
        title: 公开数据仍无法回答什么
        blocks:
          - type: paragraph
            body: >-
              关键剩余缺口不是军用无人机里有没有钱。有。更难的问题是，这些钱有多少属于 Firestorm
              的精确细分生态位，以及在其他制造商、主承包商或政府自有生产方案拿走份额之前，公司现实能捕捉多少。公开分析师报告对自上而下市场规模分歧很大，官方预算线又聚合了许多项目，Firestorm
              能否进入并不清楚。因此，本章可以捍卫一个边界、一个预算底线和一个增长论点，但如果没有目标项目、赢单率、单位经济性或客户集中度的私有数据，就无法捍卫精确的 Firestorm
              SAM/SOM。这个未解决的精度问题应作为尽调缺口保留，而不是用一个宽泛市场数字伪装。
            claimRefs:
              - CM024
              - CM026
              - CM036
              - CM037
              - CM040
