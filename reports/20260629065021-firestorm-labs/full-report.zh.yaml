      - number: '3.4'
        title: 能力比较、定价与功能分析
        blocks:
          - type: paragraph
            body: >-
              在最具战略差异化的维度——远征 / 野外可打印制造——Firestorm 没有获得资金支持的直接竞争者。xCell 是一套由 HP 驱动的双集装箱 3D 打印系统，可在 24 小时内生产无人机机体；公司持有 HP
              在移动部署单元上的五年全球独家。Firestorm 称 Tempest 50 生产成本约为可比固定翼系统的五分之一，制造速度约为传统装配的 10×，但两项数字都未被独立审计。在 Blue UAS / NDAA
              合规上，Teal Drones（Red Cat）拥有最强公开认证记录，具备 Blue UAS 状态和陆军 SRR program-of-record 指定；Firestorm 的 Squall FPV 四旋翼通过
              Orqa 合作关系被称为 NDAA-compliant，但 Tempest 产品线在公开来源中没有 Blue UAS 列名。在 AI 自主飞行软件上，Anduril（Lattice）和 Shield
              AI（Hivemind）的运营成熟度遥遥领先，并已部署到具名军事项目中。Auterion 的 AuterionOS 是可信的开放架构替代。Firestorm 的软件栈被描述为不依赖
              GPS、即插即用，但独立运营证明偏薄。在生产记录和 DoD 项目可信度上，AeroVironment、Shield AI（V-BAT）和 Red Cat（SRR）都有被野战单位接收的硬件；Firestorm
              只有开发合同。整个品类定价都不透明——主要竞争者都不公布国防项目标价，所有定价都通过合同谈判。Firestorm 的单位经济性主张（1/5 成本）是唯一公开比较数据点，且来自公司，而非审计方或独立测试。
