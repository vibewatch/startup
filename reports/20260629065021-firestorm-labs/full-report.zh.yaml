      - number: '3.3'
        title: 相邻替代、替代品、现状方案与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Auterion 提供领先的开源无人机操作系统（基于 PX4 的 AuterionOS），并销售 Skynode X——一体化自动驾驶仪与任务计算机——同时提供 Nemyx 蜂群自主系统，以及可在最远 1,000
              英里距离实现精确效果的 Long Range One Way Attack 模块。Auterion 定位为供应商中立的赋能方，任何 OEM 都可集成，因此它可能是 Firestorm xCell
              生态的补充，而不是直接竞争者；不过，其蜂群和打击能力仍争夺同一批 DoD 预算池。Skydio 是美国本土自主无人机制造商，主要服务公共安全、基础设施巡检和 Drone as First Responder
              项目；其 X10D 面向国防和政府任务，但设计重心是本土行动，而非对抗后勤远征环境。BRINC Drones 以 Guardian 和 Responder 平台服务执法、消防和搜救，不在 DoD
              远征制造任务上竞争。现状替代方案——来自固定设施主承包商和成熟 IDIQ 持有者的传统 DoD 采购——是最根深蒂固的选择。AeroVironment 等既有厂商带着多年验收测试、生产资质、供应链冗余和
              program-of-record 历史，一家 2022 年创立的公司无法快速复制。内部自建方案（DoD 自有增材制造能力）理论上可行，但 DoD 缺乏足够的前沿自有生产能力；这正是 Firestorm
              明确瞄准的缺口。欧洲主承包商阵营的潜在进入者包括 Rheinmetall，其公开了一种运输集装箱，可通过火箭助推启动投放 18 架 FV-014 攻击无人机——但不能制造无人机；以及 Cummings
              Aerospace，其完成了 Hellhound S3 的飞行试验，这是一款低于 25 lbs（含容器和地面控制）的 3D 打印巡飞弹，证明美国本土 3D
              打印进入者在某种程度上能执行，但目前是在更简单的一次性平台上，而不是多任务制造单元上。
