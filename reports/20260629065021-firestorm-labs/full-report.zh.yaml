      - number: '2.3'
        title: 规模测算视角：大 TAM、更小的公开预算底线，以及未解决的 SAM
        blocks:
          - type: paragraph
            body: >-
              本章应保留多个规模测算视角，而不是假装一个商业估算就能定论。最宽口径下，公开分析师报告把 2025 年军用无人机市场放在约 $18 billion 到 $47 billion 之间，并预测未来十年增长到 $66
              billion 至 $98 billion 区间。这个跨度太大，不能当作单一真相，但足以说明伞形品类很大。更贴近作战的视角来自美国公开预算线：CRS 指出，仅 FoSUAS 和 LASSO 合计，FY2026
              陆军小型 UAS 和巡飞弹口径约为 $654 million，另有面向工业产能的未来 Sky Foundry 预算线。缺失层是 Firestorm 特定的 SAM 或
              SOM。公开来源没有揭示这些预算中有多少份额现实上向边缘制造供应商开放，因此精确 SAM 仍是尽调缺口，而不是可报告事实。
