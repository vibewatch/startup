      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              Firestorm 的成本结构主要由硬件资本强度和快速增长的劳动力基数驱动。每个 xCell 单元横跨两个运输集装箱，配备工业级 HP 3D 打印机；Firestorm 持有 HP
              在移动生产单元部署该技术的五年全球独家，这是有意义的战略资产，但也意味着每次部署的 xCell 单位经济性锚定在高成本资本设备上。集成到 Tempest UAS
              的武器和动能载荷不是增材制造的——它们另行采购——这意味着 Firestorm 的物料清单既包括打印部件，也包括外部采购弹药或 EW 硬件，形成双源 COGS 结构，使利润率分析更复杂。陆军用 xCell
              在现场打印 Bradley Fighting Vehicle 替换零件，证明了平台多用途性，但也意味着备件收入组合不可预测，难以建模。


              人工成本是最清楚的烧钱信号。在 2026 年 4 月 Series B 完成前的十二个月里，团队从 40 人增至 160 多人，约为四倍。按每名员工每月全成本 $15,000–$20,000 计算（对 San
              Diego 这一画像的国防硬件组织而言是合理代理），员工数意味着每月人工烧钱约 $2.4 million 到 $3.2 million。设施成本还会叠加：公司宣布从 15,000 平方英尺设施搬迁到 35,000
              平方英尺地点，物理面积增加一倍以上。公开来源未披露每个 xCell 单元的生产良率、材料单位成本或按产品线划分的毛利率。AeroVironment 和 Red Cat 等公开国防硬件同行在 SEC 文件中分别报告
              45–55% 和 30–35% 的毛利率，提供了唯一可用类比；Firestorm 的实际毛利率轨迹未知。
