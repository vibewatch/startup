      - number: '8.3'
        title: 可比估值背景
        blocks:
          - type: paragraph
            body: >-
              思考 Firestorm 上行空间，最好的方式不是套一个硬倍数，而是看国防科技可比公司的行为。Anduril 和 Shield AI
              表明，只要公司同时具备国防相关性、软件或自主能力杠杆，以及可见项目动能，投资人就会愿意给出激进价格。但这些同行融资轮也伴随比 Firestorm
              目前公开分享更清晰的规模信号。AeroVironment、Kratos、Ondas 和 Red Cat 等公开市场公司有用，因为它们提供持续的基于申报文件和市场数据的跟踪界面，尽管没有一家能完美匹配
              Firestorm 的移动制造与模块化机体组合。因此，可比公司的启示是双向的。是的，这个类别可以支撑十亿美元级结果。但这些结果通常要等客户、收入和战略定位比现在更清楚之后才挣得。Firestorm
              的叙事有理由归入这个家族；但其公开可验证指标还没有证明它应该按该家族领导者定价。
