      - number: '1.4'
        title: 政府牵引、部署与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              公开来源中最重要的外部验证不是商业收入，而是政府牵引。Firestorm 拥有一份五年期空军上限合同，覆盖增材制造 UAS 和自主系统工作，不过 TechCrunch 指出，到 2026
              年春季，上限中只有少数部分已被拨付。公司还称已与 AFRL 和 AFSOC 完成两次美国本土 xCell 部署；更新近的报道则指向一个由 APFIT 资助的印太组合，包含 xCell 单元、Tempest
              无人机和操作员培训。这一点重要，因为公司的制造论点只有在项目从演示转向重复野外使用后，才具备可投资性。迄今里程碑模式一致：2022 年创立，种子轮和 Series A 融资，2025
              年空军合同，更广泛投资方扩张，以及 2026 年与对抗后勤需求和盟友战区用例绑定的部署努力。
