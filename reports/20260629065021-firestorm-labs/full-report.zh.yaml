      - number: '2.5'
        title: 约束与负面证据
        blocks:
          - type: paragraph
            body: >-
              需求论点很强，但采用路径并不顺滑。多个来源收敛到同一个瓶颈：采购走向规模化后，生产准备度比概念新颖性更重要。C4ISRNET 对 Replicator
              的报道称，买方关心供应商距离批量生产有多近；其更怀疑的评论则认为，只有数量远远不够，还需要集成、保障以及给产业界的可靠信号。反无人机经济性也两面切割。Pentagon
              想要更低成本的拦截和攻击选项，因为传统成本曲线不可持续；但同样的压力也可能偏向硬件最便宜、最可融资、工业化路径最干净的制造商。公开来源仍未证明，边缘制造单元能像满足作战叙事那样轻松满足国防级
              QA、认证和可重复性标准。这是后续必须保留的核心负面视角。
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM022
              - CM035
              - CM039
