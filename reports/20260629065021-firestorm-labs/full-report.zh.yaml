      - number: '1.2'
        title: 创始人、领导层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开点名的创始团队口径一致，即便更广泛的治理披露偏薄，也给 Firestorm 带来可信的创始人—市场匹配。Dan Magy 带来国防系统连续创业经验，Chad McCoy
              用特种作战和空军创新经历锚定作战用户与采购叙事，Ian Muceus 则补上增材制造和工业化层。这样的组合支撑了 Firestorm
              的说法：远征生产是一个现实的国防制造问题，而不是纯概念式自主系统命题。弱点在治理透明度。公开材料没有披露董事会名单、正式治理图谱或带日期的高管变更日志。后续章节因此需要把关键人依赖继续压在三位创始人身上，尤其是如果
              Magy 是融资和客户前台节点，而 Muceus 承担制造执行与认证准备可信度。
