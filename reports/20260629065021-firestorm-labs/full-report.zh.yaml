  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              Firestorm Labs 处在一个庞大且资金充足的国防无人系统赛道内竞争，但占据一个独特子类：集装箱化、可野外部署的无人机制造。更广泛格局可分为六层。直接软件和自主系统同行——Anduril 与 Shield
              AI——是 2026 年融资最多的 VC 支持国防科技公司，拥有成熟 DoD 项目关系，但两者都不提供前沿部署的增材制造。平台硬件既有厂商——AeroVironment（Switchblade、JUMP
              20-X）、Teal Drones/Red Cat（陆军 SRR program of record）——有生产记录和 Blue UAS
              或项目认证，但它们从集中式固定设施采购机体。相邻软件平台——Auterion（AuterionOS、Nemyx swarm）和 Skydio（公共安全 /
              X10D）——提供开放架构飞控栈和自主导航，但不在战区制造无人机。公共安全替代品——BRINC、面向执法的 Skydio——不在 DoD
              远征任务上竞争。现状替代方案是传统集中式采购：后方固定设施和数月交付周期，而 DoD 已明确把这类模式列为“对抗后勤”脆弱点，也是六大国家关键技术领域之一。最相关的潜在进入者是
              Rheinmetall，其营销一种可投放攻击无人机的集装箱（但不制造无人机），以及 Cummings Aerospace，其已完成一款 3D 打印巡飞弹的飞行试验。Executive Order
              14307（“Unleashing American Drone Dominance”）和乌克兰战斗经验——无人机设计周期压缩到数天，损耗率接近每天 1,000 架——验证了 Firestorm
              的论点，也加速了竞争者对远征生产的兴趣。
