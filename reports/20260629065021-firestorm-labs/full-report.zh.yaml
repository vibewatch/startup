      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Firestorm 的资本位置体现为：在零公开收入披露的背景下，获得了大量 VC 和债务融资。融资时间线——种子轮、带 venture debt 的 Series A、以及 Series
              B——已在公司概览章节详述。就资本充足性而言，相关事实是：Series B 完成后披露融资总额达到 $153 million；Series B 本身为 $82 million，由 Washington
              Harbour Partners 领投，其中第二笔也是最终一笔约 $49.5 million 于 2026 年 4 月 29 日完成，依据 S&P Capital IQ 数据；Series A 组合包括来自
              J.P. Morgan 的 $12 million venture debt，其条款、到期日和契约均未披露。公开来源没有披露任何轮次的投后估值。


              对照员工数隐含的每月 $2.4–3.2 million 烧钱，$82 million Series B 总融资额意味着约 26–34 个月 runway——这只是规划估算，因为它排除了合同收入流入、capex
              义务、债务服务，以及任何员工数没有捕捉的额外支出。公司列明的 Series B 资金用途——团队扩张、xCell 生产爬坡和印太部署——都属于资本密集类别，会比单看员工数更快压缩 runway。CEO
              称，计划中的印太全面运营部署目标是“最好在未来两年内”，这形成一个软期限，与估算 runway
              窗口相符，但要求合同收入持续流入，才能在下一轮融资前自我供血。没有证据显示公司披露了收入里程碑目标、下一轮触发条件或盈亏平衡预测。
