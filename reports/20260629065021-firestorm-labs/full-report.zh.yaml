      - number: '4.6'
        title: 财务结论——收入质量、烧钱风险与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              基于公开可得证据，Firestorm 的收入质量偏低。所有已确认收入都流经单一客户类别（USG/DoD），落在狭窄项目载体组合内；旗舰 IDIQ 下已确认拨付总额为 $27 million，相比 $153
              million 已披露融资规模并不大。这并不意味着 Firestorm 陷入财务困境——APFIT、STRATFI
              和未公布任务订单可能正在显著增加收入基数——但问题在于外部来源无法验证这些内容。robotics.press
              的负面分析强化了这一点：开发合同与生产项目之间的缺口，正是硬件国防公司历史上容易卡住的位置。Firestorm 尚未公开证明生产到验收的转化，也未证明规模化交付通过验收测试的硬件。


              烧钱风险真实存在且正在加速。十二个月内员工数增长四倍、设施扩张，以及每个可部署单元都需要工业级 HP 打印机的资本密集产品，共同制造了高额月度现金义务。Series B runway 估算（26–34
              个月）偏乐观，因为它假设没有 capex 意外、没有 HP 打印机采购延迟，并且合同收入稳定流入——这些都无法验证。DoD 增材制造预算正在增长（据报道同比 83%），DAF FY27 President's
              Budget 请求为 $338.8 billion，较 FY26 已颁布额增长 38%，这是有利的宏观背景。不过，若没有任务订单授予和生产交付，DoD 预算增长不会自动转化为 Firestorm
              特定收入，而这些转化事件正是开放问题。财务结论是：论点已获融资支持，烧钱正在加速；在任何投资决策能被有信心承销之前，尽调路径要求管理层直接披露现金、收入和 backlog。
            claimRefs:
              - CI035
              - CI036
              - CI037
              - CI038
              - CI039
