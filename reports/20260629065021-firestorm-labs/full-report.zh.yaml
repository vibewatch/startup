  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              Firestorm 所处的是初创市场中监管最密集的角落之一：军用无人机、前沿部署增材制造和政府采购。公开证据足以把风险框定清楚，但不足以卸下尽调负担。Firestorm 公开营销面向作战人员的模块化 UAS
              和可打印任务硬件，因此硬件和技术数据默认都应按 ITAR 处理，而不是一个遥远的边缘情形。FAR 电信条款和外国采购规则又加了一层限制，因为即便产品很强，只要电子栈、通信链路或制造 BOM
              含有被禁或不合规输入，也可能无法获得授标。当前公开记录中最强的负面信号很普通却很说明问题：本轮访问时，官网链接的隐私政策 PDF 返回
              404。这不能证明更广泛的法律失败，但确实暗示后台治理落后于公司的运营雄心。最重要的未答合规问题是，Firestorm 是否能按要求提供 DDTC 注册、SAM 注册，以及有文档支持的 CMMC 或 NIST
              800-171 实施路径。
