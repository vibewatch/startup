      - number: '1.5'
        title: 负面信号与未解决尽调问题
        blocks:
          - type: paragraph
            body: >-
              公司叙事很强，但负面记录并非空白。最有用的挑战来自 robotics.press，其观点是 Firestorm
              最难的一步，是从开发合同和媒体关注，转向由独立证实、并有验收测试记录的生产项目。该来源明确指出，公开认证 KPI、质量保证数据和通过验收测试的机体缺位；这一点重要，因为远征制造会在战术边缘放大 QA
              风险。估值、收入、具名终端客户和董事会可见度也仍有缺口。这些遗漏不否定公司的牵引，但会限制任何规模化论点的置信度，尤其是那些假设公司已经完成从原型和任务订单到可重复生产转化的论点。这些缺口具有实质性，应继续作为开放尽调问题，而不是被抹平成虚假的精确性。
            claimRefs:
              - CO023
              - CO031
              - CO034
              - CO035
              - CO037
              - CO038
      - number: '1.6'
        title: 图表要点
        blocks:
          - type: callout
            title: “制造即产品”是差异化核心
            body: 最强主线是，Firestorm 不只卖无人机；它销售一套可部署的生产和保障方法，相比集中式无人机制造，更适配对抗后勤场景。
            calloutType: strength
            claimRefs:
              - CO010
              - CO034
              - CO035
          - type: callout
            title: 生产转化仍是核心承销风险
            body: 公开记录更清楚地证明了融资和原型，而不是经审计的生产转化、验收测试或野外规模下的单位经济性。
            calloutType: risk
            claimRefs:
              - CO026
              - CO037
              - CO038
          - type: callout
            title: 战略投资方比融资标题金额本身更重要
            body: Lockheed Martin Ventures 和 Booz Allen Ventures 证明，Firestorm 吸引到的生态伙伴不只是被动资本，还可能影响采购触达和集成可信度。
            calloutType: insight
            claimRefs:
              - CO021
              - CO036
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Firestorm 究竟卖进哪里、又不卖进哪里
        blocks:
          - type: paragraph
            body: >-
              正确的市场边界，首先要排除许多随意的无人机 TAM 叙事会纳入的开支。Firestorm 并不争夺全部民用 UAS、全部航空航天自主系统，或全部精确打击预算。公开产品和合同证据指向更窄的交叉点：Group 1-3
              军用 UAS、低成本可消耗或单程攻击系统，以及能在使用点附近打印或保障这些系统的远征制造。最后一项重要，因为它改变了分母。传统军用无人机市场估算数的是机体；Firestorm
              试图捕捉的价值，在机体背后的生产方法、维修闭环和快速迭代工作流。因此，这个市场应被视为一个受后勤痛点约束的军用无人机采购楔子，而不是通用无人机软件或航空制造 TAM。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM030
              - CM038
