          - type: callout
            title: 相比公开同行，申报透明度缺口极大
            body: >-
              每一个有意义的公开国防可比公司——AeroVironment（AVAV）、Red Cat（RCAT）和 Ondas（ONDS）——都向 SEC 提交季度和年度财务报表。Ondas 是 Firestorm 的
              Series B 投资方，本身在 10-Q 文件中披露收入、现金和烧钱。Firestorm
              作为私营公司没有同等披露义务，也没有自愿发布任何财务数据。对于一家达到这一融资水平、且拥有这种公开媒体能见度的公司，Firestorm
              异常不透明。尽调要求很清楚：没有管理层披露经审计或经审阅财务报表，就无法可信承销收入质量、资本充足性或利润率轨迹。
