      - number: '2.2'
        title: 买方、用户、付款方与采购路径
        blocks:
          - type: paragraph
            body: >-
              对于一家处在这个阶段的私营公司，公开买方证据异常具体。Firestorm
              来源指向空军和陆军组织；更广泛的政策来源则勾勒出低成本可消耗系统被拉入服役的精确采购环境。用户是需要侦察、电子战、打击或保障支援的作战单位；付款方通常是项目办公室、创新预算或军种采购线；采用触发点则是围绕成本、战备和对抗后勤的作战紧迫性。陆军的
              FoSUAS 和 LASSO 逻辑显示，UAS 按梯队从班到营映射；Drone Dominance 和 Replicator 则展示了另一个高节奏通道，用于快速、低成本攻击无人机采购。NATO
              和盟友反无人机框架又增加了第二个相邻买方宇宙，小型 UAS 扩散把采购拉出美国单一范围。
