chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与产品架构
        blocks:
          - type: paragraph
            body: >-
              Firestorm Labs 的公开身份在官方与独立来源之间异常一致。官网、隐私政策和独立画像都把公司定位在 San Diego，并将其描述为一家 2022
              年创立、围绕远征增材制造和模块化无人机展开的国防创业公司。Firestorm 没有推一个通用软件栈，而是把公司叙事压在 xCell 上：一套可部署生产系统，目标是在战术边缘制造机体、备件和合作伙伴系统。产品栈围绕
              xCell、Tempest 系列和 Squall FPV 平台搭建。这套组合重要，因为 Firestorm 不只是一个无人机
              OEM；它试图销售一种适配对抗后勤的制造方法，在作战附近打印、组装和维修系统的能力，才是产品逻辑的核心。
