      - number: '4.7'
        title: 图表要点
        blocks:
          - type: callout
            title: IDIQ 上限与拨付缺口是主要收入风险
            body: >-
              $100M USAF IDIQ 是 Firestorm 最常被引用的收入信号，但截至 2026 年 4 月，上限中只有 $27M 已拨付。如果空军不发出额外任务订单——原因可能是预算
              sequestration、项目延迟、履约担忧或竞争性重新竞标——该载体实际收入可能永远接近不了上限。国防 IDIQ 上限在历史上拨付节奏差异很大；有些载体在完整期限内拨付不足上限的 30%。投资者应把 $27M
              视为唯一合同承诺收入数字，而不是 $100M。
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI035
          - type: callout
            title: 烧钱加速超过收入可见度
            body: >-
              Firestorm 员工数在 12 个月内增长 4×，设施面积增加一倍以上，Series B 立即被指定用于资本密集活动，包括 xCell 生产和印太部署。仅按员工数估算，人工、capex
              和后勤带来的综合烧钱压力为每月 $2.4–3.2M；一旦计入设施租金、HP 打印机采购和部署成本，这很可能仍是低估。面对这种烧钱，公司没有披露任何合同收入数字来抵消 Series B
              资金消耗。这种不对称——现金流出加速、流入不可见——是现阶段投资者的核心财务风险。
            calloutType: risk
            claimRefs:
