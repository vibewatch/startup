  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Firestorm 的公开技术栈从受争夺物流需求出发，经过 xCell 制造、模块化机体、任务载荷，再到维持工厂运转的软件运营层。
    data:
      layers:
