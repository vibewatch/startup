          - type: paragraph
            body: >-
              Firestorm 已披露融资历史方向上积极，但用于定价仍不完整。公司公开宣布过一轮 $47 million 的 Series A，其中包括风险债；又宣布过一轮 $82 million 的 Series
              B，使披露总资本达到 $153 million。对于一家硬件占比较高的国防初创公司，这是有意义的
              runway。它也意味着资本结构足够复杂，优先股条款、清算顺位和投资人权利都可能实质性改变普通股结果。问题不在于公司缺少投资人背书。它显然有。问题在于，公开证据仍没有显示准确
              post-money、各轮累积稀释幅度，或任何新普通股入场上方存在怎样的结构性优先权。SEC 浏览界面在 EDGAR 相邻结果中识别了 Firestorm，但本轮没有拿到一条清晰、可读、能解决缺失定价细节的
              Form D 线索。因此，入场纪律就是核心估值问题：公司可能有吸引力，但当前公开记录不足以判断价格是否有吸引力。
            claimRefs:
