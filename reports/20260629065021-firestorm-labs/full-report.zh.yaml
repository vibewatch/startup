  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流与合同架构
        blocks:
          - type: paragraph
            body: >-
              Firestorm 的公开收入架构建立在三个政府项目载体上，但没有一个披露绝对已实现收入。最重要的是美国空军在 2024 年 12 月根据 SBIR Phase III 授予的五年期 $100 million
              IDIQ 合同。该 IDIQ 允许空军发出多项任务和交付订单，在最终订单之后，单个履约期最长可达 24 个月。由于适用 SBIR Phase III 状态，该 IDIQ
              也可用于其他联邦机构下单，把名义可服务计费面从空军扩展出去。不过，TechCrunch 截至 2026 年 4 月的报道确认，$100 million 上限中只有 $27 million
              已被拨付——也就是说，上限是容量授权，不是收入承诺，标题合同价值中约 73% 仍未承诺。


              除 IDIQ 外，公司宣布获得 AFVentures 的 STRATFI PY25.1 奖项，用于扩大其 UAS 和 xCell 平台的生产与部署；并在 2026 年 5 月披露一项最高 $30 million
              的 APFIT 奖项，用于印太地区扩展 xCell 部署和 Tempest 生产。APFIT 奖项取决于履约里程碑，其精确合同类型——firm-fixed-price 还是
              cost-plus——尚未披露。三个载体共享一个特征：Firestorm
              能确认的收入受任务订单发出和验收测试约束，而不是受上限金额约束。公司还声称有一个更广泛的收入模型，包括面向所有军种的硬件销售和服务，但没有分项拆解，也没有独立佐证多军种牵引。
