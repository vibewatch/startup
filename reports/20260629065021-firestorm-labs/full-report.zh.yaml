        title: 图表要点
        blocks:
          - type: callout
            title: 正确市场是受后勤约束的楔子，不是“所有无人机”
            body: Firestorm 的差异化在买方重视可替换性、边缘维修和快速本地化生产时价值最高，而不是在精致续航或广泛民用 UAS 采用占主导时。
            calloutType: insight
            claimRefs:
