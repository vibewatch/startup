      - number: '3.2'
        title: 直接同行——自主平台与成熟硬件 OEM
        blocks:
          - type: paragraph
            body: >-
              Anduril Industries 是全球资本最充足的国防科技创业公司。2026 年 5 月 TechCrunch 报道确认，其以 $61B 估值完成 $5B Series H，累计融资超过 $11B；2025
              年收入为 $2.2B，较上一年翻倍。Anduril 的竞争面包括 Lattice AI、Ghost sUAS、Fury 自主战斗机 CCA，以及不断扩大的国际足迹。空军向 Anduril 和 General
              Atomics 授予首批 CCA 生产合同，这是 Firestorm 尚未达到的里程碑。另一个信号是，空军选择 Shield AI 的 Hivemind 软件运行在 Anduril 的 Fury 上，说明 DoD
              正在主动拆分硬件和软件采购——即便在最高层级，市场也不奖励单一供应商锁定。Shield AI 在 2026 年 3 月 Series G 中以 $12.7B 估值融资 $1.5B；其 V-BAT 是已部署的
              Group 3 VTOL ISR 无人机，被包括 Poland 在内的盟国使用，Poland 已宣布为 Baltic Sea 行动采购 V-BAT。Shield AI 的 Hivemind
              平台作为不依赖具体机体的 AI 飞行员出售，提供了一条不同于硬件利润率的变现路径。Anduril 和 Shield AI
              都不提供可野外打印的机体替换；它们销售的是自主智能和在固定设施生产的任务硬件。AeroVironment 是成熟既有厂商：上市公司，Switchblade 300 和 600 巡飞弹部署在美国及盟军部队，拥有
              JUMP 20-X VTOL ISR，以及数十年的 DoD IDIQ 关系。它的竞争劣势正是 Firestorm 瞄准的点——集中式生产无法以乌克兰展示的速度适应设计周期。Red Cat
              Holdings（Nasdaq: RCAT）拥有 Teal Drones，这一 Blue UAS 认证平台被选为美国陆军 Short Range Reconnaissance（SRR）program of
              record，即面向排级情报与监视的背包便携 sUAS。SRR 中选是有意义的里程碑，也让 Red Cat 成为陆军合格 sUAS 标准，但 Teal 不提供远征制造。
