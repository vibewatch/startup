        title: 运营、制造与部署风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Firestorm 的吸引力与脆弱性密不可分。公司卖的不只是机体；它承诺集装箱化生产单元可以把制造前移，快速打印所需组件，并在物流受争夺时持续补给部队。TechCrunch
              的报道把价值主张讲得很具体——xCell 可在 24
              小时内打印无人机系统，两个国内单元已部署，陆军也用该平台打印替换零件——但每项证据也都带出现场可靠性、备件质量、校准和测试负担，而公开记录还无法完全消除这些风险。HP 关系尤其是一把双刃剑。独家移动打印安排可以让
              Firestorm 差异化，但也把关键技术、原料、软件和服务依赖集中到一家 OEM。公开材料尚未说明，如果 HP 硬件可得性、粉末供应、服务响应或定价对 Firestorm
              不利，公司有什么备选方案。因此，运营扩张和供应商韧性是核心风险，而不是单纯执行细节。
