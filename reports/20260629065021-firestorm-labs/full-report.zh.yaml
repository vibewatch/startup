        - 吞吐量说法尚未有独立外场指标支撑
      - - 项目办公室让平台适配新任务
        - 传统重新设计和供应链变更单推进缓慢
        - 开放架构 Tempest 可接入新传感器或推进模块
        - 公开来源强调更快重新设计和任务适配
        - 官方模块接口文档未公开
      - - 操作员需要 ISR 或 EW 配置
        - 每个任务配专用平台，会推高成本和后勤负担
        - Tempest 被定位为可跨 ISR、EW 和打击角色重构
        - 同一机体家族可覆盖多组任务
        - 任务套件成熟度和载荷互操作性没有公开记录
      - - 单位在简陋环境修复受损平台
