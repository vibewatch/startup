        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              对一家年轻的国防硬件公司来说，Firestorm 的公开叙事异常清晰：公司卖的不是单一无人机，而是一套制造与平台结合的系统，目标是把生产推到前沿。官网把产品组合锚定在三个具名资产——xCell、Tempest 和
              Squall——并放在客户工作流里讲：争议环境下的物流、快速任务适配，以及中心化供应链失灵时的保障能力。这一点重要，因为产品边界不止机体。xCell 是工厂，Tempest
              是设计成可在该工厂内生产的模块化固定翼家族，Squall 则是 FPV
              产品线，把同一套增材制造逻辑延伸到另一类任务。公开材料还显示，公司不仅关心复合材料结构，也重视载荷开放性和软件赋能。因此，理解其技术栈不能只看一张规格表，而要把官网、融资新闻和当前招聘信号放在一起读。
