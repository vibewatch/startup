            body: Anduril 和 Shield AI 表明，当合同和收入变得清楚时，国防初创公司可以获得高溢价私募估值。Firestorm 的故事指向这个方向，但公开指标尚未追上那套估值标准。
            calloutType: insight
            claimRefs:
