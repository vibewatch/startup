      - number: '5.4'
        title: 信任、质量控制与公开缺口
        blocks:
          - type: paragraph
            body: >-
              Firestorm 披露的网站隐私信息多于产品认证信息；这对尽调有用，但并不完整。2026 年 4 月隐私政策明确列出基础控制：仅使用必要的本地存储、不使用跟踪
              cookie、不为营销出售个人数据，并正式处理招聘、联系和合同信息。招聘材料进一步暗示，受监管环境实践很重要，因为岗位明确提到 GovCloud、事件响应和 ITAR/EAR
              资格。这些是可信的信任信号，但不能替代网络安全认证、适航性、制造质量体系或现场可靠性指标的公开证据。在已审阅来源中，没有出现公开认证登记、MTBF 数据集或带日期的 Squall
              路线图。对承销而言，实际结论是：Firestorm 的公开证据足以确立真实产品架构和越来越偏运营的平台，但若没有管理层数据室直接支持，还不足以通过信任与质量尽调。
