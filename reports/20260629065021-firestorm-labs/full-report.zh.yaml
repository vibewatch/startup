              的怀疑视角有用，因为它把论点从合同公告重新框定到现场生存性和可维护性。TechCrunch 又补充了一个重要警惕：截至 2026 年 4
              月，空军合同上限只有一部分已获义务资金。公开材料也没有具名印太单位、披露续约条款，或拿出终端用户满意度数据。这种组合在国防初创公司中很常见，但也意味着尽调必须区分政府兴趣证明与持久、重复运营依赖证明。Firestorm
