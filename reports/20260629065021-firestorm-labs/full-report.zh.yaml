        - Army Bradley 零部件案例和无人机零部件叙事支撑保障用例
        - 未发现公开修复成功率或单次修复成本数据
      - - 平台团队在受监管环境运行制造软件
        - 工业平台工具常在本地和云栈之间碎片化
        - Firestorm 正在招聘 GovCloud、本地边缘、可观测性和基于 GitOps 的运维岗位
        - 暗示公司在搭可复制的软件运营，而不只是硬件
        - 证据来自招聘代理，而非公开产品文档
