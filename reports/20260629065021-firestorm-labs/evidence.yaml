evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation TO003
    missingEvidence: Post-money valuation or investor-marked fair value for the Series A or Series B rounds.
    whyItMatters: Valuation is required for ownership dilution and entry-pricing analysis in later chapters.
    diligencePath: Request cap table summary, financing term sheet excerpts, or board-approved fair value memo.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance TO002
    missingEvidence: Current board roster, observer rights, and any leadership-change log since founding.
    whyItMatters: Governance concentration and key-person dependence cannot be underwritten cleanly from founder bios alone.
    diligencePath: Request board list, committee map, and most recent financing governance side letter.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Revenue, backlog, and customer concentration disclosures tied to actual task orders and deployments.
    whyItMatters: Public contract ceilings are not the same as realized revenue or durable repeat demand.
    diligencePath: Request monthly ARR/revenue bridge, funded backlog, and named-program revenue mix.
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: material
    topic: customer-count TO004
    missingEvidence: Named end-customer roster or public disclosure of how many units or commands are actively using Firestorm systems.
    whyItMatters: >-
      Adoption breadth is still inferred from a small set of named trials and one undisclosed Indo-Pacific customer
      package.
    diligencePath: Request deployment count by command, installed-base metrics, and follow-on order history.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: blocking
    topic: production-certification
    missingEvidence: >-
      Material qualification, acceptance-testing data, MIL-SPEC-equivalent QA, and field failure rates for
      xCell-produced airframes.
    whyItMatters: The biggest thesis risk is whether expeditionary manufacturing can meet defense-grade quality at scale.
    diligencePath: Request QA package, test reports, defect rates, and any acceptance criteria used by Air Force or Army customers.
    relatedQuestionRefs:
      - QO024
      - QO025
  - type: private-evidence-only
    severity: material
    topic: sam-som TM002
    missingEvidence: >-
      Program-by-program target share, win rates, and attach rates for edge-manufacturing modules versus drone-only
      spend.
    whyItMatters: A precise Firestorm SAM/SOM cannot be defended from public TAMs and budget lines alone.
    diligencePath: Request internal pipeline segmentation, program targets, and expected revenue contribution by procurement channel.
    relatedQuestionRefs:
      - QM013
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer map TM003
    missingEvidence: Named allied customers and budget owners behind the Indo-Pacific deployment package.
    whyItMatters: Buyer concentration and repeatability are still obscured by undisclosed customer identities.
    diligencePath: Request customer list, theater ownership, and follow-on option structure for APFIT-linked deliveries.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: blocking
    topic: distributed qa
    missingEvidence: Qualification, certification, and failure-rate evidence for field-manufactured airframes and replacement parts.
    whyItMatters: Without QA proof, the company may fit the policy narrative but fail the transition from demos to scaled adoption.
    diligencePath: Request test reports, QA workflow, acceptance criteria, and defect statistics for xCell outputs.
    relatedQuestionRefs:
      - QM019
  - type: conflicting-data
    severity: material
    topic: analyst estimate spread
    missingEvidence: A normalized market-definition bridge explaining why public TAM estimates differ so widely.
    whyItMatters: Analyst divergence can mislead valuation work if not normalized before benchmarking.
    diligencePath: >-
      Normalize each market report by included platform types, geographies, and forecast years before using in
      valuation.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: material
    topic: unit economics TM004
    missingEvidence: Manufacturing cost per Tempest or xCell-produced airframe, plus gross margin under low-cost procurement targets.
    whyItMatters: Cost competitiveness determines whether Firestorm benefits from price-down procurement or is squeezed by it.
    diligencePath: Request unit-cost build, throughput assumptions, and margin sensitivity at $5,000 and lower price regimes.
    relatedQuestionRefs:
      - QM017
      - QM022
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: blocking
    topic: mil-spec-certification-gap
    missingEvidence: >-
      Documented digital thread, material qualification data, and MIL-SPEC acceptance test results for xCell-printed
      Tempest airframes are not available in any public source.
    whyItMatters: >-
      DoD production contracts require qualified parts and acceptance-tested airframes; without this documentation, the
      development-to-production conversion cannot be validated and Firestorm cannot be compared on production readiness
      against AeroVironment or Red Cat.
    diligencePath: >-
      Request internal quality-management documentation, acceptance test reports, material qualification certificates,
      and AFRL or AFSOC program office confirmation of acceptance status from Firestorm management.
    relatedQuestionRefs:
      - QP012
      - QP018
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: production-delivery-gap
    missingEvidence: >-
      No production delivery records, accepted airframe counts, or failure-rate data for the Tempest 50 or
      xCell-manufactured components exist in public sources.
    whyItMatters: >-
      The distinction between a development program and a production program is the central risk variable; absence of
      delivery evidence prevents verifying whether Firestorm has crossed this threshold.
    diligencePath: >-
      Ask Firestorm for copies of delivery orders, acceptance certifications, or milestone reports from the AFRL and
      AFSOC xCell deployments.
    relatedQuestionRefs:
      - QP011
  - type: missing-source
    severity: material
    topic: drone-dominance-program-status
    missingEvidence: >-
      Firestorm's participation in the Drone Dominance Program—including whether it submitted to the Gauntlet I
      competition and its current Phase I status—is not confirmed or denied in public sources.
    whyItMatters: >-
      The Drone Dominance Program is a major near-term revenue opportunity; absence from the public awardee list is
      adverse evidence, but absence could also reflect a decision not to compete rather than a rejection.
    diligencePath: >-
      Request confirmation from Firestorm of its Drone Dominance submission status and any communications with the
      program office; cross-reference against the war.gov vendor announcement.
    relatedQuestionRefs:
      - QP010
  - type: missing-source
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: >-
      No independent audited cost sheet or independent cost analysis exists for the Tempest 50's claimed 1/5
      production-cost advantage or 10× manufacturing speed versus comparable fixed-wing systems.
    whyItMatters: >-
      If the cost advantage cannot be independently verified, the pricing story may not survive a rigorous DoD cost
      analysis, weakening the procurement value proposition versus incumbents.
    diligencePath: >-
      Request internal cost-accounting data, HP printing material consumption figures, labor-hour data per airframe, and
      an independent manufacturing cost comparison from a defense cost analysis firm.
  - type: private-evidence-only
    severity: minor
    topic: tracxn-deadpool-flag
    missingEvidence: >-
      The Tracxn 'Deadpooled' corporate status marker on Firestorm's entity cannot be reconciled with the active $153M
      funding record and active DoD contracts.
    whyItMatters: >-
      A persistent data discrepancy in commercial databases could complicate due diligence, create confusion in
      procurement evaluations, or indicate a subsidiary or earlier legal entity that was dissolved.
    diligencePath: >-
      Obtain the current corporate status from the California Secretary of State and confirm the active legal entity
      name against the Air Force contract award records.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: blocking
    topic: valuation
    missingEvidence: >-
      Post-money valuation for Series B (and all prior rounds) is not publicly disclosed. No secondary-market
      transaction data, cap-table record, or SAFE filing is available in public sources.
    whyItMatters: >-
      Without a valuation anchor, return analysis, dilution modeling, and any comparative efficiency metric relative to
      funded peers are impossible to construct from public data.
    diligencePath: >-
      Request last primary mark and cap-table summary from board; check Forge Global, EquityZen, or AngelList for
      secondary transactions; request most recent 409A report.
    relatedQuestionRefs:
      - QI003
  - type: private-evidence-only
    severity: blocking
    topic: financial transparency
    missingEvidence: >-
      No revenue, gross margin, cash balance, operating cash flow, or funded backlog has been publicly disclosed by
      Firestorm. The company has not filed any financial statements with the SEC.
    whyItMatters: >-
      Cannot underwrite revenue quality, capital adequacy, or burn trajectory. Every financial metric in this chapter is
      an estimate or peer analog, not a company-reported number.
    diligencePath: >-
      Request audited or reviewed financial statements (balance sheet, P&L, cash flow statement) for the most recent
      fiscal year and trailing 12 months from management or CFO.
    relatedQuestionRefs:
      - QI012
  - type: missing-source
    severity: material
    topic: revenue recognition
    missingEvidence: >-
      No revenue recognition policy has been disclosed for Firestorm's government contracts. It is unclear whether
      revenue is recognized upon acceptance, milestone delivery, cost incurrence (cost-plus), or
      percentage-of-completion.
