- id: section-3
  title: 'Sizing lenses: large TAM, smaller public budget floor, and an unresolved SAM'
  body: 'The chapter should preserve multiple sizing lenses instead of pretending one commercial estimate settles the question. On the broadest lens, public analyst reports place the military-drone market somewhere between roughly $18 billion and $47 billion in 2025, with forecast growth into the $66 billion to $98 billion range over the next decade. That spread is too wide to treat as a single truth, but it does establish that the umbrella category is large. A more operational lens comes from public U.S. budget lines: CRS identifies a FY2026 Army small-UAS and loitering-munition envelope of about $654 million across FoSUAS and LASSO alone, plus a future Sky Foundry line aimed at industrial capacity. The missing layer is Firestorm-specific SAM or SOM. Public sources do not reveal what share of those budgets is realistically open to edge-manufacturing providers, so a precise SAM remains a diligence gap rather than a reportable fact.'
  claimRefs:
  - CM020
  - CM021
  - CM024
  - CM025
  - CM026
  - CM029
  - CM033
  - CM036
  - CM037
  - CM038
