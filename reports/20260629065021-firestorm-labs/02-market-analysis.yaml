  title: The right market is a logistics-constrained wedge, not “all drones”
  body: Firestorm's differentiation is most valuable where buyers care about replaceability, edge repair, and rapid localized production, not where exquisite endurance or broad civil-UAS adoption dominate.
  claimRefs:
  - CM001
  - CM002
  - CM017
  - CM038
- calloutType: risk
  title: SAM precision is still impossible from public data alone
  body: Public sources can defend a budget floor and a TAM range, but they cannot cleanly isolate the exact share of spend available to an edge-manufacturing vendor like Firestorm.
  claimRefs:
