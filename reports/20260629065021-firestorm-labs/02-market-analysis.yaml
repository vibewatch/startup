  rows:
  - - Group 1-3 military UAS
    - Small and medium tactical UAS for ISR, EW, strike, and support missions.
    - Large MALE/HALE strategic aircraft and non-UAS aviation.
    - Service program offices and operational commands.
    - Matches the size class referenced in Firestorm contract coverage.
  - - Attritable / one-way attack drones
    - Low-cost attack drones, loitering munitions, and expendable air vehicles.
    - Premium cruise missiles and manned strike aircraft.
    - DoD rapid procurement channels and tactical units.
    - Maps to Drone Dominance, LASSO, and Firestorm's attack-drone adjacency.
  - - Expeditionary drone manufacturing
    - Forward-deployed production, repair, and sustainment of drones and parts.
    - Centralized aerospace factory capex unrelated to field sustainment.
    - Commands with contested-logistics problems and industrial-base sponsors.
    - This is Firestorm's differentiating wedge rather than a generic drone line item.
  - - Allied counter-drone and small-UAS procurement
    - Small-UAS and C-UAS demand from NATO and partners.
    - National air-defense systems unrelated to small-UAS proliferation.
    - NATO agencies and allied ministries.
    - Shows adjacent international demand and pressure to scale drone ecosystems.
  - - Broader military-drone market
    - All military UAS platforms counted by analyst reports.
    - Civil drones and non-defense aviation.
    - Global defense buyers.
    - Useful only as a TAM lens, not as Firestorm's direct SAM.
