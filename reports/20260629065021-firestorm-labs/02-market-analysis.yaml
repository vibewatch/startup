company:
  name: Firestorm Labs
chapter:
  number: 2
  title: Market Analysis
  summary: 'Firestorm Labs addresses a narrower market than generic “drones”: the relevant wedge is low-cost, attritable Group 1-3 military UAS plus expeditionary production and sustainment for buyers facing contested logistics. Public data confirms large top-down defense budgets and rising drone procurement urgency, but analyst market-size estimates diverge widely and do not isolate Firestorm''s exact SAM/SOM. The strongest quantitative signal is not one TAM number but a stack of budget and procurement lenses—Army small-UAS appropriations, Drone Dominance price-volume targets, and a broader multi-billion-dollar military-drone market that is growing quickly in North America and the Indo-Pacific.'
sections:
- id: section-1
  title: 'Market boundary: what Firestorm is and is not selling into'
  body: 'The correct market boundary starts by excluding a great deal of spend that casual drone-TAM narratives would include. Firestorm is not competing for all civil UAS, all aerospace autonomy, or all precision-strike budgets. Public product and contract evidence points instead to a narrower intersection: Group 1-3 military UAS, low-cost attritable or one-way attack systems, and expeditionary manufacturing that can print or sustain those systems near the point of use. That last element matters because it changes the denominator. A conventional market estimate for military drones counts airframes; Firestorm is trying to capture value in the production method, repair loop, and rapid-iteration workflow behind those airframes. The market should therefore be treated as a military-drone procurement wedge conditioned by logistics pain, not a generic drone-software or aviation-manufacturing TAM.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM030
  - CM038
  tableRefs:
  - TM001
- id: section-2
  title: Buyer, user, payer, and procurement path
  body: Public buyer evidence is unusually concrete for a private company at this stage. Firestorm sources point to Air Force and Army organizations, while broader policy sources identify the exact procurement environment in which low-cost attritable systems are being pulled into service. The user is the operational unit that needs reconnaissance, electronic warfare, strike, or sustainment support; the payer is typically a program office, innovation budget, or service procurement line; and the adoption trigger is operational urgency around cost, readiness, and contested logistics. The Army's FoSUAS and LASSO logic shows how UAS are mapped by echelon from squad to battalion, while Drone Dominance and Replicator show a separate high-tempo channel for fast, low-cost attack-drone procurement. NATO and allied counter-drone frameworks add a second, adjacent buyer universe in which small-UAS proliferation pulls procurement outward beyond the U.S. alone.
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  - CM010
  - CM011
