    nodes:
    - label: TAM — global military drones
      value: $18B-$47B 2025 lens
      description: Public analyst estimates for the broad military-drone market vary widely across sources.
    - label: Regional demand core
      value: North America >40% share
      description: North America is the largest market and allied rearmament is accelerating in Europe and the Indo-Pacific.
    - label: Programmatic demand wedge
      value: FoSUAS/LASSO + Drone Dominance
      description: Public U.S. budget and procurement programs for small attritable systems create a visible budget floor.
    - label: Firestorm immediate niche
      value: Edge manufacturing for low-cost Group 1-3 systems
      description: The company competes where distributed production, repair, and modularity matter simultaneously.
