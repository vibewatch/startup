- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Domestic drone industrial policy
    - positive
    - current
    - White House policy now favors U.S.-made drones, Blue UAS expansion, and supply-chain security.
    - How much of this policy will translate into direct procurement for Firestorm-sized vendors?
  - - Contested logistics in Indo-Pacific
    - positive
    - current
    - Distributed production and repair become more valuable when central supply lines are vulnerable.
    - What theater demand is recurring versus demonstration-only?
  - - Low-cost attack-drone procurement
    - positive
    - current
    - Drone Dominance and similar programs expand the addressable attritable-drone channel.
    - Can Firestorm win on price if the market standard moves toward $2,300 attack drones?
  - - Allied spending growth
    - positive
    - current
    - NATO and allied budget growth broadens demand beyond U.S. domestic buyers.
    - Which allies will actually buy U.S.-made edge-manufacturing systems?
  - - Production readiness bias
    - constraint
    - current
    - Programs like Replicator reward vendors closest to scale production, not only the best concept.
    - How close is Firestorm to repeatable, bankable production?
  - - Distributed QA / certification burden
    - constraint
    - current
    - Forward manufacturing raises quality-assurance and acceptance-testing complexity.
    - What evidence proves field-made airframes meet defense-grade requirements?
  - - Cost curve pressure
    - constraint
    - current
    - Buyers want far lower unit and intercept costs, compressing room for premium pricing.
    - What gross-margin profile survives at target low-cost price points?
  - - Government-owned manufacturing capacity
    - constraint
    - emerging
    - Sky Foundry and related public industrial-base efforts could absorb some of the need Firestorm targets.
    - Does Firestorm complement or compete with government-owned production nodes?
  notes: The table mixes growth drivers and constraints because procurement urgency and adoption friction are advancing at the same time.
