  - TM002
  figureRefs:
  - FM002
- id: section-4
  title: 'Growth drivers: policy, industrial base urgency, and theater realities'
  body: 'The most powerful adoption drivers all point in the same direction. White House policy now explicitly prioritizes American-made drones, Blue UAS expansion, supply-chain security, export enablement, and routine operations support. DoD budget language separately prioritizes deterring China in the Indo-Pacific and revitalizing the defense industrial base, which is exactly the narrative Firestorm uses for xCell. Replicator and Drone Dominance then convert that policy momentum into procurement mechanisms that value speed, scale, and affordability rather than long-cycle exquisite systems. Allied budgets matter too: NATO data and Atlantic Council''s 2026 tracker show defense spending growth broadening across Europe and Canada, while NATO''s own counter-drone contract activity shows that drone proliferation is no longer a single-service U.S. issue. These drivers favor any supplier that can combine low-cost hardware, local production, and credible readiness.'
  claimRefs:
  - CM009
  - CM013
  - CM014
  - CM023
  - CM031
  - CM034
  - CM039
  tableRefs:
  - TM004
- id: section-5
  title: Constraints and adverse evidence
  body: 'The demand case is strong, but the adoption path is not frictionless. Multiple sources converge on the same bottleneck: production readiness matters more than conceptual novelty once procurement moves to scale. C4ISRNET reporting on Replicator says buyers care about how close vendors are to volume production, and its more skeptical commentary argues that mass alone is insufficient without integration, sustainment, and reliable signals to industry. Counter-drone economics also cut both ways. The Pentagon wants lower-cost intercept and attack options because legacy cost curves are unsustainable, but the same pressure can favor manufacturers with the cheapest, most bankable hardware and the cleanest industrialization path. Public sources still do not establish whether edge-manufacturing cells can meet defense-grade QA, certification, and repeatability standards as easily as they satisfy operational storytelling. That is the core adverse lens to carry forward.'
  claimRefs:
  - CM015
  - CM016
  - CM017
  - CM022
  - CM035
  - CM039
  figureRefs:
  - FM001
- id: section-6
  title: What remains unknowable from public data
  body: The key remaining gap is not whether there is money in military drones. There is. The harder question is how much of that money belongs to Firestorm's exact niche and what share the company can realistically capture before other manufacturers, primes, or government-owned production schemes take it. Public analyst reports disagree sharply on top-down market size, and official budget lines aggregate many programs whose accessibility to Firestorm is unclear. The chapter can therefore defend a boundary, a budget floor, and a growth thesis, but it cannot defend a precise Firestorm SAM/SOM without private data on target programs, win rates, unit economics, or customer concentration. That unresolved precision problem should be preserved as a diligence gap rather than disguised with a single broad market number.
  claimRefs:
  - CM024
  - CM026
  - CM036
  - CM037
  - CM040
