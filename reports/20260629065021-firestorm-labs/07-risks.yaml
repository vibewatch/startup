- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Compliance readiness gap
    - DDTC / SAM / CMMC evidence requested
    - Management cannot provide registration or implementation proof within diligence window
    - Treat thesis as blocked until primary documentation is produced
  - - Contract-conversion risk
    - Obligated dollars vs. contract ceiling
    - Air Force ceiling remains lightly obligated or expansion stalls for multiple quarters
    - Downgrade growth confidence and re-underwrite revenue timing
  - - HP concentration risk
    - Supplier dependency
    - No documented alternate tooling, service, or feedstock contingency plan
    - Assume higher margin and continuity risk in base case
  - - Talent stretch
    - Critical hiring progress
    - Key technical or compliance roles remain open for prolonged periods
    - Increase execution discount and shorten monitoring cadence
  - - Funding durability
    - Runway vs. program slippage
    - New capital is consumed before recurring program mix broadens
    - Assume dilutive follow-on financing and revisit valuation discipline
  notes: Kill criteria convert the public risk record into monitorable diligence tests rather than one-way narrative caution.
