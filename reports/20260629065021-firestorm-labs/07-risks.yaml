- id: customer-and-dependency-risk
  title: Customer, Contract, and Dependency Risk
  body: The public demand picture still looks heavily concentrated around U.S. defense customers. TechCrunch says Firestorm earns revenue through hardware sales and government contracts across all branches of the military, and it identifies an Air Force contract with a $100 million ceiling but only $27 million obligated so far. That is useful traction, but it is not the same as a broad, durable, multi-customer revenue base. The readable public award surfaces did not provide a clean list of prime awards, and the SBIR and SAM pages were too thin in this environment to resolve whether Firestorm is primarily a prime, subcontractor, OTA participant, or a mix. The DIU model is relevant here because many dual-use defense startups struggle in the transition from prototype money to repeat program funding. If Firestorm’s visible traction is still concentrated in prototype-like or branch-specific channels, then the company remains vulnerable to budget changes, sponsor turnover, and pauses in procurement
    velocity. Strategic investors can help, but they do not eliminate sponsor concentration.
