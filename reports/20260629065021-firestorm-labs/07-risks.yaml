tables:
- id: TR001
  title: Regulatory / Legal Risk Register
  columns:
  - Risk
  - Why it exists
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - ITAR classification and registration
    - Military-oriented UAS plus printable design files likely create defense-article and technical-data obligations
    - Official site + ITAR definitions + DDTC portal
    - High
    - Request DDTC registration number, export-control counsel memo, and technical-data handling workflow
  - - Procurement certification exposure
    - Telecom-ban clauses and representations can invalidate awards if supplier diligence is incomplete
    - FAR 52.204-25 and 52.204-26
    - High
    - Map every communications and surveillance component to compliant vendor evidence before scaling awards
  - - Privacy and website-governance immaturity
    - Homepage-linked privacy-policy PDF returned 404 and no broader legal stack is publicly visible
    - Homepage + broken PDF
    - Medium-High
    - Restore legal documents, publish controller/processor terms, and align site governance with enterprise expectations
  - - CMMC / CUI readiness burden
    - Defense work handling controlled information can require a meaningful cyber-compliance program
    - NIST 800-171
    - High
    - Provide SSP/POA&M status, assessment timetable, and budgeted compliance owner
  - - Litigation / corporate-record visibility gap
    - No confirmed lawsuits were surfaced, but public review still requires direct PACER and state-court confirmation
    - PACER + Delaware + California record surfaces
    - Medium
    - Run full party-name searches and request legal-representation letter from counsel
  notes: Rows rank the most visible legal and compliance risks evidenced in public sources; they are not a substitute for formal export-control or procurement counsel.
