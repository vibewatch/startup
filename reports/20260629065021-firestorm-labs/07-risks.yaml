chapter:
  number: 7
  title: Risks
  summary: 'Firestorm’s risk profile is dominated by compliance, customer concentration, and supplier dependence rather than by lack of mission demand. Public evidence shows real traction—$153 million of disclosed capital, military deployments, an Air Force contract ceiling, and strategic defense investors—but it also shows a thin public compliance trail, a broken privacy-policy link, HP concentration inside the manufacturing stack, and a demand picture still centered on government programs. Net view: high but financeable risk if management can document DDTC/SAM/CMMC readiness and prove broader contract conversion beyond a handful of visible defense channels.'
sections:
- id: regulatory-legal-risk
  title: Regulatory, Legal, and Compliance Risk
  body: 'Firestorm is operating in one of the most regulation-dense corners of the startup market: military-focused drones, forward-deployed additive manufacturing, and government procurement. The public evidence is enough to frame the risk clearly even though it is not enough to clear the diligence burden. Firestorm openly markets modular UAS and printable mission hardware for warfighters, which makes ITAR treatment of both hardware and technical data the default assumption rather than a remote edge case. The FAR telecom clauses and foreign-acquisition rules add another layer because even a strong product can become unawardable if the electronics stack, communications chain, or manufacturing bill of materials contains banned or noncompliant inputs. The strongest adverse signal in the current public record is mundane but telling: the homepage links a privacy-policy PDF that returned 404 on this run. That does not prove broader legal failure, but it does suggest that back-office governance
    is trailing the company’s operational ambition. The most important unanswered compliance question is whether Firestorm can produce DDTC registration, SAM registration, and a documented CMMC or NIST 800-171 implementation path on demand.'
