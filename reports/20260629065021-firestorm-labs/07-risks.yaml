- id: people-financing-and-kill-criteria
  title: People, Financing, and Kill Criteria
  body: The founding team quality is a real mitigation, but this is still a founder-heavy, talent-constrained business. The official site highlights Dan Magy, Chad McCoy, and Ian Muceus rather than a fully fleshed-out senior bench, and the live careers page shows that continued specialist hiring is part of the current operating burden. That matters because Firestorm’s strategy requires defense credibility, additive-manufacturing know-how, software integration, contracting literacy, and disciplined manufacturing execution all at once. Financially, the disclosed capital stack is meaningful—$153 million total funding with venture debt layered in—but the business model remains capital-intensive and potentially lumpy if programs slip or scale slower than expected. The practical kill criteria are therefore measurable. If management cannot demonstrate DDTC and SAM readiness, show how HP concentration is hedged, explain how the Air Force ceiling converts into recurring funded demand, or produce
    a credible specialist-hiring plan, risk should be treated as high rather than merely manageable. In other words, the top mitigants are real, but so are the dependencies they are meant to offset.
