callouts:
- calloutType: risk
  title: The public record still cannot clear Firestorm’s compliance burden
  body: The company’s mission fit and investor quality are not substitutes for documentary proof of DDTC, SAM, and cyber-compliance readiness. Until management can produce those materials, the compliance stack is a gating risk rather than a background detail.
  claimRefs:
  - CR014
  - CR019
  - CR029
  - CR040
- calloutType: insight
  title: HP is both moat and fragility
  body: The same HP-enabled mobile-printing differentiation that makes Firestorm interesting also creates single-OEM exposure in hardware, service, and feedstock. If management cannot explain the contingency plan, investors should assume elevated continuity and margin risk.
  claimRefs:
  - CR011
  - CR021
  - CR022
- calloutType: recommendation
  title: Treat customer concentration as real until broader revenue proof appears
  body: Public evidence shows genuine DoD traction, but it still points overwhelmingly toward government channels rather than a diversified customer base. Contract ceilings, obligations, and repeat-program evidence should therefore be monitored like core valuation inputs.
  claimRefs:
  - CR008
  - CR009
  - CR025
  - CR028
