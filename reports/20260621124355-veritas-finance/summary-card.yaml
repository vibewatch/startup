summary:
  headline: >-
    Veritas Finance has built India's fastest-growing MSME NBFC franchise and achieved unicorn status, but deteriorating
    returns, rising NPAs, and a 17-month IPO delay all argue that the ₹8,500 crore unicorn mark is stretched;
    public-market investors should track until ROTA stabilises above 3.5% and the RHP price band provides a clearing
    anchor.
