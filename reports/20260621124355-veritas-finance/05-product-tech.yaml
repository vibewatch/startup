  - id: trust-security-compliance
    title: Trust, Security, and Compliance Framework
    body: >-
      Veritas Finance operates under the Reserve Bank of India's NBFC-ICC (Investment and Credit
      Company) framework as a systemically important non-deposit-taking entity, subjecting it to
      capital adequacy, income recognition, asset classification, and provisioning norms. The company's
      KYC and AML compliance follows RBI's digital lending guidelines and the Prevention of Money
      Laundering Act, 2002, with Aadhaar-linked eKYC enabling paperless customer onboarding. The
      credit policy, updated regularly, defines borrower selection norms, sector exposure limits, and
      collections procedures in line with applicable RBI guidelines.

      On information security, the company received ISO 27001:2022 certification for its data security
      management systems in FY25, upgrading from the earlier ISO 27001:2013 standard. Monthly security
      audits are conducted with an external data security firm. Disaster recovery is managed via
      real-time cloud backup to a cloud-based DR site, providing protection against malware and
      encryption attacks. The IT infrastructure is hybrid on-premise and multi-cloud, designed for
      resilience against single-point failures.

      The company also holds ISO 9001:2015 certification for HR support activities and ISO 30408:2016
      for Human Resource Management. Field-level data integrity is enforced through digital sealing
      and employee ID-signing of each scorecard submission, preventing post-submission tampering. The
      in-house back-office and centralised MIS systems operate with adequate safeguards for backup,
      disaster recovery, and business continuity, as independently reviewed by CARE Ratings' in its
      June 2025 and October 2024 reports.
