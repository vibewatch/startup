chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Veritas Finance operates a branch-led, field-anchored retail NBFC model built around four loan
    products—Rural Business Loans (56% of AUM), Affordable Home Loans (~14%), Used Commercial Vehicle
    Loans (~4%), and Working Capital Loans (~7%)—each with distinct risk profiles, yields, and
    operational workflows. The company has achieved 100% digital disbursement and ~90% digital
    collections through e-NACH, UPI, and QR-code rails, while retaining mandatory on-site appraisal
    for secured loans via its proprietary triple-AAA scoring framework across 409+ data points.
    Technology infrastructure relies on a third-party LOS/LMS vendor complemented by a central
    data lake and ISO 27001:2022 certified multi-cloud infrastructure. Key risks include third-party
    MIS vendor dependency, ongoing manual field-visit intensity, geographic concentration, and
    unseasoned books on the two newest product lines.

sections:
  - id: product-portfolio
    title: Product Portfolio and Customer Proposition
    body: >-
      Veritas Finance serves MSME borrowers—primarily self-employed traders, small manufacturers,
      rural transport operators, and informal shopkeepers—through four loan products calibrated to
      different credit risk profiles and income cycles.

      Rural Business Loans are the flagship product and the foundation of the company's franchise.
      These are secured loans against immovable property with an average ticket of ₹4.7 lakh and
      an on-book yield of approximately 22.83%, designed for first-time borrowers with limited
      formal documentation. The product has been in production for a decade and benefits from the
      deepest institutional knowledge and most mature scorecard. It dominated the book at 56% of AUM
      as of March 2025, down from 72% in FY23 as newer products scaled.

      Affordable Home Loans were introduced in FY23 as a logical adjacency: when an MSME borrower
      who has taken a business loan has repaid reliably, the natural next need is formal housing
      credit for self-construction or purchase. With an average ticket of ₹11.3 lakh and yield of
      approximately 16.63%, these loans are longer-tenor and carry lower credit risk than MSME
      business loans. They contributed ~14% of AUM in FY25, up from essentially zero in FY22.

      Used Commercial Vehicle Loans were launched in March 2024, targeting rural transport operators
      and small businesses that purchase commercial vehicles for logistics, agriculture, or
      construction. Average ticket is ₹4.5 lakh at a yield of ~19.25%, secured on the vehicle.
      The loan book crossed ₹300 crore by March 2025 within its first full operating year, and
      represents the highest near-term uncertainty given limited seasoning and no full-cycle default
      experience.

      Working Capital Loans are short-term, unsecured loans averaging ₹1.8 lakh at a yield of
      ~27.03%, the highest in the portfolio, serving shopkeepers and restaurant owners in urban and
      semi-urban markets. These operate on a weekly collection model driven by relationship managers.
      The segment was deliberately moderated in FY25 (down to ~7% of AUM from 11% in FY24) as the
      company prioritised secured product growth and managed unsecured NPA stress. The four-product
      portfolio map reflects a deliberate expansion from a single rural MSME product toward a broader
      life-cycle financial services platform, with each new product reusing the branch distribution
      and credit infrastructure.
