callouts:
  - calloutType: strength
    title: "100% Digital Disbursement with Field-Anchored Credit Quality"
    body: >-
      Veritas Finance has achieved 100% digital disbursement and ~90% digital collections
      while maintaining field-led underwriting that captures income signals unavailable to
      purely algorithmic lenders. This hybrid model—AI scorecard informed by on-ground
      assessment—has enabled the company to serve first-time borrowers at scale (24.72% of
      the book as of H1FY25) while sustaining Stage 3 loans at 1.95%, among the lowest
      in its peer group. The proprietary scorecard, launched in FY22, now covers 409+
      data points and is the basis for risk-based pricing that allows granular spread management
      without blanket rate floors.
    claimRefs:
      - CE021
      - CE022
      - CE012
      - CE020

  - calloutType: risk
    title: "Third-Party LOS/LMS Dependency and Manual Scalability Ceiling"
    body: >-
      The entire origination and servicing pipeline runs on a third-party LOS/LMS vendor whose
      identity is not publicly disclosed. A vendor outage, licensing dispute, or version migration
      could simultaneously disrupt sourcing, approvals, and collections across all branches.
      Separately, mandatory field visits for income appraisal and property verification create a
      structural cost floor per loan: as the branch network expands to new states with lower
      population densities, unit economics per loan may deteriorate without equivalent revenue
      yield compression to offset rising per-loan field costs. Cash collections at 10.39% of the
      book, with two disclosed employee-fraud incidents, represent a residual operational risk
      that is difficult to eliminate without fully digitising the working-capital loan segment.
    claimRefs:
      - CE037
      - CE035
      - CE036
      - CE040

  - calloutType: insight
    title: "Used CV and Home Loan Diversification Extends the Platform Without New Infrastructure"
    body: >-
      Each new product line reuses the branch network, collections team, data lake, and LMS
      infrastructure, limiting marginal fixed costs. The used vehicle loan crossed ₹300 crore
      AUM within its first operating year by leveraging the same branch presence and field
      officer relationships that serve rural business borrowers. This asset-light product
      expansion strategy is a notable operational strength. The risk, however, is insufficient
      seasoning on both newer product lines to determine whether the same scorecard assumptions
      translate across asset classes.
    claimRefs:
      - CE004
      - CE025
      - CE026

