  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: key-person-dependency-succession
      missingEvidence: >-
        Formal board-level succession plan for D. Arulmany's MD & CEO role; depth of bench strength
        demonstrated through audited leadership continuity disclosures; granular active customer count
        broken down by product and state (beyond company-stated cumulative 2 lakh figure).
      whyItMatters: >-
        Key-person risk is material for a pre-IPO NBFC where the founder controls operations,
        investor relationships, and credit culture. Granular customer count matters for MSME
        lifetime value and churn analysis in due diligence.
      diligencePath: >-
        Request formal succession plan disclosure from management; review RHP (final DRHP) for
        leadership risk factors; obtain quarterly MIS reports with active-customer breakdown;
        cross-check with operational interviews of senior leadership team.
      relatedQuestionRefs: [QO006, QO016]

    - type: missing-source
      severity: minor
      topic: state-level-branch-expansion-detail
      missingEvidence: >-
        Precise entry dates, branch count, and AUM share for each of the 11 states/UTs beyond the
        top three; particularly granular data for West Bengal, Karnataka, Jharkhand, Odisha, Bihar,
        and Chhattisgarh.
      whyItMatters: >-
        State-level diversification trajectory is central to assessing whether geographic
        concentration risk is genuinely declining or persisting; state-specific data would validate
        management's diversification narrative.
      diligencePath: >-
        Request internal branch rollout report from management; cross-reference with DRHP/RHP
        state-wise AUM disclosure appendix; review RBI NBFC branch inspection returns if accessible.
      relatedQuestionRefs: [QO019]
