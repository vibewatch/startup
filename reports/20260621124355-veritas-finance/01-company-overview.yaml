callouts:
  - calloutType: strength
    title: Fastest-Growing NBFC in India by AUM (FY22–FY24)
    body: >-
      CRISIL MI&A certified Veritas as the fastest-growing NBFC among comparable peers with a
      61.76% AUM CAGR from FY22 to FY24. Over the broader five-year window to March 2025, CARE
      Ratings confirmed a 41% AUM CAGR. This exceptional growth while maintaining a CAR of
      37.82%—well above the 15% regulatory floor—demonstrates disciplined capital management
      alongside aggressive organic expansion.
    claimRefs:
      - CO032
      - CO033
      - CO036

  - calloutType: strength
    title: Investment-Grade Credit Rating Upgrade to CARE AA- Stable
    body: >-
      In June 2025 CARE Ratings upgraded Veritas Finance from CARE A+ Positive to CARE AA-
      Stable for its long-term bank facilities and NCDs, citing robust AUM growth, healthy
      capitalisation, and consistent profitability. The AA- rating, together with CARE A1+ on
      short-term instruments, materially expands the eligible investor base for borrowings and
      reduces funding costs heading into the IPO process.
    claimRefs:
      - CO039
      - CO036

  - calloutType: risk
    title: Geographic Concentration—Tamil Nadu Accounts for 43% of AUM
    body: >-
      Despite expansion into 11 states and one union territory, Tamil Nadu remains dominant at
      43% of AUM as of March 2025, with the top three states (Tamil Nadu, West Bengal, Karnataka)
      collectively representing 71%. Any localised economic shock, monsoon stress, or political
      disruption in Tamil Nadu could disproportionately affect asset quality and collections.
      CARE Ratings flags geographic concentration as a persistent key weakness.
    claimRefs:
      - CO045
      - CO038

  - calloutType: risk
    title: Rising Delinquencies in Unsecured Working Capital Segment
    body: >-
      GNPA widened from 1.79% (March 2024) to 2.81% (June 2025), primarily from the unsecured
      working capital loan segment. CARE Oct 2025 noted that GNPA and NNPA stood at 2.81% and
      1.41% as of June 2025, and early-stage bucket delinquencies (0+ DPD) rose to 6.96%.
      Veritas has responded by cutting unsecured exposure from 11% (FY24) to 7% (March 2025)
      and to 6% (June 2025). The RBI's June 2025 FSR separately flagged rising GNPA across
      NBFC retail portfolios at 3.1% versus 1.2% for banks.
    claimRefs:
      - CO037
      - CO038
      - CO044
      - CO045

