  name: Veritas Finance Limited

chapter:
  number: 1
  title: Company Overview
  summary: >-
    Veritas Finance Limited is a Chennai-headquartered, RBI-registered Systematically Important
    Non-Deposit Taking NBFC incorporated on April 30, 2015 by D. Arulmany, focused on secured MSME
    lending to underserved semi-urban and rural borrowers across 11 Indian states. Having
    cumulatively raised ₹1,835 crore in equity, achieved unicorn status at ~₹8,500 crore valuation
    in September 2024, and received SEBI IPO approval in April 2025 for a ₹2,800 crore offering,
    the company closed FY25 with AUM of ₹7,349 crore, revenue of ₹1,557 crore, and PAT of ₹292
    crore—a CAGR of 41% AUM growth over five years confirmed by CARE Ratings.

sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: >-
      Veritas Finance Limited (CIN: U65923TN2015PLC100328) is a Systematically Important
      Non-Deposit-Taking NBFC registered with the Reserve Bank of India, classified under
      RBI's scale-based regulation as an NBFC-Middle Layer. Incorporated on April 30, 2015 and
      domiciled in Tamil Nadu, the company operates from SKCL Central Square 1, Guindy, Chennai
      600 032. It started lending operations in 2015 with a mission to provide need-based credit
      to micro, small, and medium enterprises in underserved semi-urban and rural markets.

      The company's core product is secured MSME small business loans collateralised by property,
      with loan sizes ranging from ₹30,000 to ₹50 lakh and an average ticket of ₹4.5 lakh. Over
      the years it has diversified into working capital loans (unsecured, capped at ~10% of AUM),
      Loan Against Property-Construction (LAP-C) for affordable self-construction housing, home
      loans for owner-occupied dwellings, and used commercial vehicle finance (launched FY24).
      The FY25 portfolio mix was 56% secured MSME, 19% home loans, 14% LAP-C, 7% working
      capital, and 4% vehicle loans. Underwriting relies on in-house field teams performing
      site visits and collateral assessments, with loan-to-value capped below 50% of distressed
      asset value, and collections routed primarily through ACH/direct debit mandates.
