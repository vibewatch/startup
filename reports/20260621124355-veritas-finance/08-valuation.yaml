  - id: financing-context
    title: Financing Context and Private-Market Reference Point
    body: >
      In September 2024, Veritas Finance raised ₹240 crore in an internal round from existing investors
      Lok Capital, Evolvence, and Avendus Future Leaders Fund. The transaction was structured at a
      pre-money valuation of approximately ₹8,500 crore (~$1.0–1.1 billion at prevailing exchange rates),
      granting the company unicorn status. The implied P/B multiple at the time of the round was
      approximately 3.25x the September 2024 net worth of ₹2,610 crore.

      This unicorn mark must be treated as a private-market reference point, not a public-market clearing
      price, for three reasons. First, internal rounds by existing investors do not impose the rigour of
      arm's-length price discovery; PE investors managing concentrated positions have incentives to mark
      at the prior-round level or slightly above. Second, the Sep 2024 round occurred before the subsequent
      deterioration in ROTA (from ~4% to ~3.1%) and GNPA (from 1.79% to 2.89%), materially weakening
      the fundamental support for the premium. Third, liquidity discounts of 20–30% are standard for
      pre-IPO equity relative to public-market equivalents, reflecting lock-up risk and exit uncertainty —
      and in Veritas Finance's case, the IPO launch has already slipped 17+ months past the original
      target, amplifying this risk.

      The cumulative equity raised prior to the IPO totals approximately ₹1,835 crore across seven
      tranches (FY16–FY24), with an additional ₹240 crore in the Sep 2024 internal round. The July 2023
      ₹1,200 crore Multiples PE-led round (prior to the unicorn mark) implied a pre-money valuation
      well below the unicorn mark, suggesting a step-up of approximately 40–50% between mid-2023 and
      the internal Sep 2024 round — an appreciation that is now partly unwound by profitability erosion.
      The fresh IPO issue of ₹600 crore will bolster Tier-1 capital and support a post-IPO AUM target of
      approximately ₹10,000 crore, with the balance ₹2,200 crore representing investor exits.
