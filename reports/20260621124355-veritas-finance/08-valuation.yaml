  - id: exit-readiness
    title: Exit Readiness, Final Diligence Asks, and Thesis-Break Triggers
    body: >
      Veritas Finance's exit readiness profile is mixed. The regulatory gate is cleared — SEBI observations
      were granted April 29, 2025, books of accounts are audited, and five top-tier lead managers are
      appointed. The credit market accepts the company at AA- (bonds at 9.75% yield, November 2026
      maturity). However, the equity market gate is not yet cleared: more than 17 months post-SEBI
      approval, no price band, lot size, or listing date has been announced. This is highly unusual for a
      mainboard IPO with approved observations and suggests either the internal financial trajectory was
      not yet suitable for price discovery, or market conditions were judged unfavourable.

      The OFS component of ₹2,200 crore — split across Norwest (₹550 crore), Kedaara (₹550 crore), BII
      (₹500 crore), Lok Capital (₹425 crore), and Growth Catalyst (₹175 crore) — reflects PE investors'
      intent to monetise a substantial portion of their positions at listing. For minority investors,
      this creates a structural post-IPO overhang: selling pressure from residual promoter stakes and
      lock-up expiries is typically observed in the 180-day period post-listing. That said, PE investors
      who entered at or before the 2023 ₹1,200 crore Multiples round can achieve 2–3x returns even at a
      ₹5,500–7,000 crore public-market clearing price, giving them flexibility to accept a discount to
      the unicorn mark.

      The most critical final diligence items as of June 2026 are: (a) FY26 full-year audited financials
      to confirm whether ROTA has stabilised or deteriorated further; (b) Q4FY26 NPA movement and
      write-off schedule to assess whether NNPA has breached the 2% CARE trigger; (c) RHP (Red Herring
      Prospectus) with the price band and post-IPO net worth; and (d) the post-IPO AUM growth plan and
      capital deployment schedule justifying the fresh issue proceeds.
