  - id: peer-comparables
    title: Comparable Set and Public-Market Benchmarks
    body: >
      The most relevant comparable for Veritas Finance is Five Star Business Finance (NSE: FIVESTAR), a
      pure-play secured MSME lender with a similar geographic focus in South India, branch-based
      origination, and a long track record. As of June 2026, Five Star trades at a P/B of approximately
      2.08x with market capitalisation of ₹15,333 crore. Its superior profitability profile — ROA of
      7.27%, ROE of 16.06%, GNPA of 1.79% — justifies this premium over Veritas Finance. Five Star's
      zero unsecured exposure and strictly secured LAP model deliver significantly lower credit costs
      (0.7% in FY24 vs. Veritas Finance's 2.31% in FY25), and its operating efficiency (cost-to-income
      25.4% vs. 35.2%) generates substantially higher ROA. If Veritas Finance trades at parity with Five
      Star's current 2.08x P/B, the implied equity value on Dec 2025 net worth (₹3,004 crore) would be
      approximately ₹6,248 crore — a 27% discount to the unicorn mark.

      SBFC Finance (NSE: SBFC) trades at a higher P/B of 3.13x (historical range 3.50–4.61x) on book
      value per share of ₹29.40, reflecting its asset-light, lower branch-count model (205 branches vs.
      Veritas's 509) and superior opex efficiency (4.65% opex/AUM vs. Veritas's ~6.9%). SBFC's GNPA of
      2.74% (FY25) is closer to Veritas's 2.21%, suggesting the current P/B of 3.13x partly reflects a
      quality premium that Veritas's more branch-intensive, unsecured-exposed model would not command.

      Ugro Capital, with a P/B of 0.44–0.57x in 2026, represents the floor for DataTech NBFCs with
      limited profit track records in SME lending — a relevant reference for how markets penalise
      unprofitable growth. Aptus Value Housing Finance (GNPA 1.19%, cost-to-income ~14.4%) commands a
      higher multiple, but its pure home-loan book makes it an imperfect comparable.

      The Indian NBFC IPO market in 2026 is active: SK Finance, Avanse, Credila, and Veritas Finance
      together seek to raise approximately ₹13,500 crore, which creates NBFC IPO supply pressure that
      could compress available multiples. Analyst consensus for high-quality MSME NBFC IPOs in India
      targets 1.8–2.5x P/B for lenders with GNPA below 2% and ROA above 5%; Veritas Finance's current
      metrics sit below both thresholds, arguing for placement at the lower end of this range.
