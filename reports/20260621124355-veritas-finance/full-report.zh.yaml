      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Veritas 的借款人画像高度具体：自雇微型企业主，拥有住房（抵押物所有者），经营现金周转型生意（收入来源），家庭财务和生意财务常常混在一起、没有正式区分。 借款人、使用者和付款方通常是同一个人——不同于公司制
              MSME，由企业主体借款、员工使用资金、发起人个人担保还款。

              这个市场的预算归属问题更细。还款来自家庭和生意混合现金流，而不是单独跟踪的企业账户。季节性收入是常态——农业社区、商贩和手工业者在节庆、收获季或婚礼月份收入高峰， 淡季则走弱。僵硬 EMI
              还款表与现实冲突；Veritas 的产品设计隐含接受一定回款波动。

              对有抵押 MSME 贷款而言，抵押物所有者维度最关键：房产通常是借款人自住房，违约会带来很高社会污名，并把还款激励对齐。在缺少可靠收入文件时， 这是最主要的信用风险缓释手段。LTV 控制在压力价值 50%
              以下，在正常和压力资产估值下都提供缓冲。

              截至 2024 年 9 月，首贷借款人占 Veritas 贷款账簿 24.72%。这批客户此前没有正式信贷历史，基于征信局的风险评估不可靠；
              分支机构信贷经理的外勤评估才是主要承销机制。这既是差异化能力（很少有银行或大型 NBFC 投入这种能力），也是扩张约束（增加分支机构是主要增长机制）。
