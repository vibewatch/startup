      - - 投资逻辑：市场领导地位
        - 按 AUM CAGR 计算，Veritas 是增长最快的纯 MSME NBFC（截至 FY25 的五年 CAGR 为 41%，AUM 达 ₹7,349 crore），并已证明可打入农村 / 半城镇市场。
        - 若 Five Star 或 SBFC 加速在 Veritas 的南印度区域扩张，先发优势会被侵蚀。
      - - 投资逻辑：信贷质量
        - CARE 升级至 AA-；稳定（2025 年 6 月）让公司获得多元化、低成本资金；509 家网点支撑 88.67% 的内部获客。
        - 若 NNPA > 2% 或 ROTA < 3% 触发 CARE 下调至 A+，借款成本会上升，股权倍数会被压缩。
      - - 投资逻辑：市场机会
        - 印度 MSME 信贷缺口超过 ₹530 billion；RBI 2025 年降息 100 bps，叠加信用周期改善，支撑长期需求。
        - RBI 收紧监管，或引入更严格的 NBFC 杠杆上限，会限制 AUM 增长和资本效率。
      - - 反逻辑：盈利侵蚀
        - ROTA 从 5.36%（FY23）降至 3.10%（9MFY26）；GNPA 从 0.85%（FY22）升至 2.89%（2025 年 12 月），CARE 触发线为 ROTA < 3%、NNPA > 2%。
        - 若 ROTA 恢复到 3.5%+，且 GNPA 连续两个季度稳定在 2.5% 以下，可支撑重估至基准情景 P/B。
      - - 反逻辑：IPO 结构
        - ₹2,200 crore 的 OFS（占募资 78.6%）意味着 PE 投资人退出，而新资金仅 ₹600 crore；SEBI 批准后已超过 17 个月，仍无价格区间。
        - 若 RHP 提交并给出价格区间、AUM 增长计划，且 FY26 盈利稳定得到确认，进入点风险会下降。
    notes: 投资逻辑 / 反逻辑基于公开申报文件、CARE 评级报告（2025 年 6 月、2026 年 4 月）、DRHP（2025 年 1 月）和 Q3FY26 季度业绩。前瞻性陈述为分析师估计。
