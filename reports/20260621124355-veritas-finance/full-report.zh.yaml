          - type: callout
            title: SAM 估算由代理构造，仍需专有验证
            body: >-
              Veritas 11 邦可服务可得市场的 ₹12,000–20,000 crore SAM 估算，是研究者基于 NBFC Micro-LAP AUM 地理切分构造的结果。 没有独立发布方测算过这个具体交集。真实
              SAM 取决于 Veritas 所在区县的借款人密度、票面规模与 micro-LAP 定义的重合度， 以及会排除部分原本合格借款人的 LTV 纪律。
