      - number: '8.4'
        title: 牛 / 基准 / 熊情景分析
        blocks:
          - type: paragraph
            body: >
              估值情景以 2025 年 12 月 31 日净资产 ₹3,004 crore（Q3FY26）为锚，这是截至报告运行日可取得的最新数据。FY26E 净资产估计为 约 ₹3,100–3,250 crore，方法是在
              Q3FY26 基础上加一季盈利（约 ₹90–100 crore，由 Q3FY26 PAT ₹81.76 crore 外推）； 在经审计 FY26 年报尚未披露前，这些只是估计值，年报一旦可得应作为更优锚点。

              牛市情景（P/B 2.8–3.2x）下，FY27 AUM 增速在更广泛 NBFC 信贷周期复苏推动下回到 25% 以上；WCL 组合出清后信用成本下降， ROTA 稳定在 3.5% 以上；CARE 评级维持
              AA-。隐含股权价值为 ₹8,960–10,240 crore，与独角兽估值一致或略高。该情景要求 GNPA 在 Q4FY26 见顶，且 NNPA 不突破 2% 触发线。

              基准情景（P/B 2.0–2.5x）下，FY27 AUM 增长 15–20%，ROTA 稳定在约 3.0–3.5%，GNPA 控制在 3.0–3.5%。隐含股权价值为 ₹6,400–8,000
              crore，较独角兽估值折价 6–25%；这对盈利轨迹和 IPO 时间不确定性而言，是合理的 Pre-IPO 折价。若没有进一步信用压力， 这是最可能结果。

              熊市情景（P/B 1.5–1.8x）下，ROTA 持续低于 3.0%，NNPA 超过 2.0%，CARE 将评级从 AA- 下调至 A+；资本配置优先拨备而非放款， AUM 增速停在 15%
              以下。隐含股权价值降至 ₹4,800–5,760 crore，较独角兽估值打 32–44% 折扣。熊市情景并非牵强： 9MFY26 年化 ROTA 为 3.10%，2025 年 12 月 NNPA 为
              1.58%，距离两条触发线同时被击穿的缓冲很窄。敏感性表（FV002）显示， 基于同业观察到的 Five Star ROTA 与 P/B 关系，ROTA 每变化 ±50 个基点，大约带来 P/B ±0.3x
              重估。
