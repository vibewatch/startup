        - 允许 NBFC-MFI 进入有抵押贷款；竞争重叠可能增加
        - 监测 NBFC-MFI 同业进入 Veritas 核心邦有抵押 MSME 贷款的情况
      - - 抵押品驱动的承保形成地理密度要求
        - 约束
        - 结构性
        - 扩张需要新开网点；新网点需要 12–18 个月成熟
        - 评估最近新开的 Bihar 和 Chhattisgarh 网点 RoI 时间线
    notes: 时点反映研究团队对各力量何时会实质影响 Veritas 近期战略的判断。NBFC-MFI 合格资产变更来自 RBI 2025 年 6 月 6 日通函。PSL 合格细节仍需结合 RBI 主指引确认。
