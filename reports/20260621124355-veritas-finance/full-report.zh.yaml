  - id: TV005
    title: 投资逻辑破裂与否决触发项
    columns:
      - 触发项
      - 阈值 / 信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - CARE 评级下调
        - NNPA 持续超过 2.00%，且 ROTA 低于 3.00%
        - 借款成本上升 50–100 bps；NIM 进一步压缩；股权 P/B 从 2.0x 向 1.5x 重估；IPO 定价难度上升
        - 退出或减仓；跟踪未来两个季度业绩中的 NNPA 和 ROTA 走势
      - - IPO 发行失败或撤回
        - Q2FY27（2026 年 9 月）前仍未提交价格区间 / RHP；或 IPO 已启动但因认购不足撤回
        - PE 退出压力加剧；二级流动性消失；未售出 OFS 带来的内部融资影响资产负债表观感
        - 下调至回避；重新进入前，坚持看到 NNPA 稳定和 FY26 审计业绩超预期
      - - AUM 增长停滞
        - AUM 连续两个季度增长低于 10%（对比当前 Q1FY26 环比 2%）
        - 信用成本继续上升；opex 杠杆无法释放；ROTA 进一步恶化并跌破 3%
        - 暂停新增敞口；重新评估任何上市前持仓的退出时间表
      - - 集中度冲击
        - Tamil Nadu 发生邦级特定信贷事件（监管干预、自然灾害、气旋），同时影响 43% AUM
        - 拨备需求激增；GNPA 可能跳升 200–300 bps；资本充足率可能接近最低要求
        - 在承诺 1.5x P/B 以上估值前，要求给出地理多元化计划
      - - 竞争对手价格战
        - Five Star 或 SBFC 在 Veritas 核心区域以低于 Veritas 22–23% 收益率 200+ bps 的价格提供 LAP
        - 收益率压缩 100–150 bps 会使 NIM 降低 0.7–1.0 个百分点，并使 ROTA 降低约 0.5 个百分点——推入 CARE 触发区间
        - 跟踪季度贷款收益率；若 Veritas 披露的收益率连续多个季度低于 21%，重新评估
    notes: 阈值来自 CARE 评级标准（2025 年 6 月升级报告、2026 年 4 月确认报告）、DRHP 风险因素和 Q3FY26 财务结果。行动含义为分析指引，不构成投资建议。
    claimRefs:
      - CV004
      - CV005
      - CV030
      - CV031
      - CV033
      - CV039
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - FY26 审计财务
        - FY26 全年利润表、资产负债表和现金流——预计 2026 年 7/8 月可从公司年报或 RHP 获得
        - ROTA 和 NNPA 走势决定熊市 / 基准 / 牛市情景信心；审计数据可消除净资产计算中的估计风险
        - 向公司 IR 索取；或在 RHP 提交后获取
      - - Q4FY26 NPA 变化
        - 截至 2026 年 3 月 31 日季度的 GNPA、NNPA 和核销明细——截至运行日期尚未公开
        - Q3FY26 NNPA 为 1.58%，距离 CARE 2% 触发线仅 42 bps；Q4FY26 变化是区分熊市 / 基准情景的最关键数据点
        - 公司季度披露（SEBI Regulation 52）；CARE 发布评级理由更新时获取
      - - 带价格区间的 RHP
        - 红鲱鱼招股书，包含价格区间、IPO 后净资产、EPS 稀释和募资用途细节
        - 价格区间锚定公开市场 P/B 倍数，也会揭示管理层是否认可 2.0–2.5x 的基准情景区间，还是瞄准独角兽估值
        - 公司在 BSE/NSE 公告；SEBI EFTS 披露；IPO 主承销商沟通
      - - IPO 后 AUM 增长计划
        - 详细资本部署时间表：放款地理、产品组合目标、FY27–FY28 每网点 AUM 目标
        - ₹600 crore 新发行必须靠高于资本成本的增量 AUM 收益率来证明；没有该计划，牛市情景假设无法压力测试
        - 公司管理层演示材料；RHP 招股书中的募资用途章节
      - - 按产品分部的 GNPA
        - FY26 按季度拆分的 GNPA：有抵押 LAP、住房贷款、二手 CV 贷款和无抵押 WCL
        - WCL 分部被识别为 GNPA 恶化的主要驱动；压降后（WCL 现占 AUM 6%）的轨迹决定信用成本前景
        - DRHP 补充数据；CARE 评级理由；公司 Q4/FY26 投资者演示
    notes: 所有尽调事项都可从监管申报、公司投资者关系，或 RHP/IPO 发行前后的主承销商披露中获得。不需要访问非公开数据。
    claimRefs:
      - CV040
      - CV004
      - CV005
      - CV038
      - CV042
