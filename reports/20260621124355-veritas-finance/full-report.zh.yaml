  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 的可服务市场位于四类长期信贷交付缺口的交汇处：正式 NBFC 有抵押 MSME LAP、平价住房建设金融、二手商用车贷款，
              以及农村和半城市企业家仍作为主要资金来源的深层非正规信贷替代品。因此，它的竞争环境横跨五类玩家。第一类是直接 MSME LAP 同业——Five Star Business Finance 和 SBFC
              Finance——它们在南印度和中印度用几乎相同的抵押物和票面画像，服务重叠借款人群。 第二类是邻近平台型贷款机构，如 UGRO Capital；其 Emerging Market LAP
              板块已转向相同地理和借款人类型，并把 DataTech 发起模型叠加到原本以共同放贷、 表外业务为主的模式上。第三类是 Aptus Value Housing 等平价住房 HFC，竞争 Veritas
              的住房贷款邻近业务，尤其在 Andhra Pradesh 和 Tamil Nadu。第四类是大型多元化 NBFC，主要是 Shriram Finance；它们有可观 MSME
              账簿，但不是纯粹竞争对手，而是既有替代者， 其分支密度和品牌认知为半城市市场的客户信任设定下限。第五类，也是结构上最重要的一类，是非正规现状来源——本地放贷人、chit funds、自有资金和家庭资金——
              它们仍服务农村 MSME 信贷需求的大多数，才是 Veritas 增长时必须替代的真正既有者。
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: 直接 MSME LAP 同业——Five Star、SBFC Finance 与 UGRO Capital
        blocks:
          - type: paragraph
            body: >-
              Five Star Business Finance 是 Veritas 最接近、最可直接比较的竞争对手。两者都主要向自雇微型企业主放贷，以住宅房产作抵押， 地理上重叠于南印度半城市地区。截至 FY25，Five
              Star 在 10 个邦和一个联邦属地运营 748 家分支机构，总贷款组合为 ₹11,877 crore，平均票面 ₹3.58 lakh。其 LTV 控制在压力价值 50%
              以内，大部分账簿内部收益率（IRR）超过 23%。 Five Star 盈利能力显著超过 Veritas——FY24 RoA 为 8.2%，Veritas 为 4.7%；原因是信用成本更低（0.7% vs
              2.0%）， opex 比率也更低（25.4% vs 35.2%）——这反映出 Five Star 在南印度本土市场更长的经营年限和更强的催收基础设施。 Five Star 的 CARE 评级在 2025 年 6
              月上调至 AA-; Positive，而 Veritas 为 AA-; Stable，说明评级轨迹偏向同业。 不过，Five Star 截至 2025 年中 91% 的 AUM
              集中在南印度，限制了其全国护城河；Veritas 则已进入东印度（West Bengal、Odisha、Bihar、 Jharkhand、Chhattisgarh）——这些邦 Five Star 存在感很低。

              SBFC Finance 在同一有抵押 MSME LAP 类别中位于更高票面位置。其 MSME 平均票面为 ₹9.49 lakh，处于 ₹5–30 lakh 区间，高于 Veritas 的 ₹4 lakh 和
              Five Star 的 ₹3.5 lakh；其组合本质上 100% 有抵押（MSME 加黄金）。SBFC FY25 AUM 为 ₹8,747 crore，增长 28%；仅靠 205 家分支机构实现 4.65%
              的高效 opex/AUM，意味着单分支 AUM 显著高于 Veritas。SBFC 17.88% 的收益率低于 Veritas（22.0%），但能更高效转化为 4.53% RoAAUM。两家公司在 ₹5–10
              lakh 区间边际竞争，因为 Veritas 的上限票面与 SBFC 的下限边界重叠。

              UGRO Capital 的 Emerging Market LAP 板块（原 Micro Enterprises）是更新但增长很快的威胁。UGRO 仅 Q4FY25 就在该板块放款 ₹669
              crore，同比增长 230%，并在 FY25 新开 85 家新兴市场分支机构。UGRO 总 AUM 到 2025 年 3 月达到 ₹12,003 crore，但其差异点是 DataTech 模型：GRO
              Score AI/ML 信用引擎、730+ 分销伙伴，以及 42% 的表外共同放贷账簿， 让它无需等量资本投放也能发起规模。这使 UGRO 在规模化后拥有结构性获客成本优势，尽管其半城市市场分支密度仍低于
              Veritas， 对非正规部门的信用评估也不如外勤模式深入。
