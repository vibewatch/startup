  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入结构与利息收入
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 运营的是纯放贷模式：截至 2025 年 3 月，收入几乎全部来自资产组合产生的利息收入，组合包括有抵押 MSME 小企业贷款 （占 AUM
              56%）、住房贷款（19%）、LAP-Construction（14%）、无抵押营运资金贷款（7%）和二手车融资（4%）。总利息收入从 FY24 的 ₹1,057 crore 增至 FY25 的 ₹1,474
              crore（+39.4%），由贷款账簿扩大 28.4% 至 ₹7,349 crore 以及维持较高综合收益率驱动；这意味着有抵押 MSME 产品的账面收益率在 20%
              出头到中段。其他收入（手续费、顾问费）FY25 贡献 ₹77 crore，规模不大但在增长。

              FY25 净利息收入（NII）达到 ₹960 crore，高于 FY24 的 ₹718 crore；按公司自有公式（贷款利息收入减融资成本，除以平均 AUM）， NIM 为 14.69%；按 CARE
              Ratings 等效口径，为 13.38%。NIM 同比压缩 80–115 bps，反映银行借款利率走高推升资金成本， 同时 Veritas 逐步向 NCD
              多元化；贷款收益率也因产品组合转向期限更长的住房贷款而部分受压（收益率较低、稳定性较高）。 Veritas 使用基于风险的定价，收入与分期付款比率上限为 55%，LTV 限制在压力资产价值 50%
              以下；这压低综合收益率，但提供抵押缓冲。

              FY25 放款小幅增至 ₹3,933 crore（FY24：₹3,702 crore），较 FY23/FY24 65–89% 的同比激增明显放缓，反映公司有意收紧无抵押营运资金板块的组合质量 （WCL 敞口从
              AUM 11% 降至 7%）。
