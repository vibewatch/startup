              Veritas Finance 已实现 100% 数字放款和约 90% 数字催收，同时保留一线驱动的承保，以捕捉纯算法贷款机构拿不到的收入信号。这种混合模型——由实地评估喂给 AI
              评分卡——让公司能规模化服务首贷借款人（截至 H1FY25 占账簿 24.72%），同时将 Stage 3 贷款维持在 1.95%，处于同业低位。自有评分卡 FY22 推出，目前覆盖 409+
