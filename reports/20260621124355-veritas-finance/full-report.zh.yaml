      - number: '4.5'
        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              以 Veritas Finance 的 NBFC 规模看，财务记录有吸引力：接近十年持续盈利，五年 AUM CAGR 为 41%，ROTA 持续高于 3%，CAR 超过监管底线两倍。FY25 ROTA 放缓至约
              3.9%、NIM 压缩至约 14.7%，主要来自无抵押分部信用压力和资金成本上升；两项风险公司均已承认，并已推出缓释动作（WCL 降风险、收紧承保、增加拨备）。Q3FY26 PAT 快速恢复（₹82
              crore，对比 Q1FY26 的 ₹62 crore），说明拨备周期可能正在稳定。

              重大尽调阻断点仍在。按产品拆分的贷款收益率和按工具拆分的实际资金成本披露不够细，精确搭建 NIM 和利差压缩模型较难。尽管公司已跨州扩张，Tamil Nadu 地理集中度仍高（FY25 AUM
              43%；Q1FY26 43%），形成单一州灾害风险。组合账龄偏低（47% 不足一年），历史损失率可能低估稳态信用成本。计划中的 ₹2,800 crore IPO（₹600 crore 新股发行）会进一步稀释
              ROE，但能强化资本基础；若 IPO 推迟，公司对现有投资者股权融资的依赖会延长。资本强度、运营费用杠杆，以及新市场扩张与资产质量爬坡之间的联动，是中期盈利路径的关键摆动因素。
