      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 所在行业是印度监管最重的领域之一。作为 AUM 超过 ₹5,000 crore 的系统重要性非吸收存款 NBFC，公司适用 RBI Scale-Based Regulations
              全套要求，包括最低 CRAR 15%、Tier-1 CAR 10% 和 Liquidity Coverage Ratio 合规；公司目前均满足（2026 年 1–3 月 CAR 34.85%，LCR
              270.94%）。但 2025–26 年监管环境明显更严。

              RBI 的 Non-Banking Financial Companies — Responsible Business Conduct Directions, 2025 对披露、利率透明度、公平催收实践、Key
              Facts Statement 发放和数字「暗黑模式」禁令提出新要求。2026 年 7 月生效的进一步修订扩大消费者保护义务。这些指引增加合规成本，也让一线催收或 DSA 实践尚未标准化的 NBFC
              面临审计风险。此外，RBI 在 2026 年行业扫查中取消 135 家 NBFC 的注册证书，显示对合规缺陷采取零容忍。尽管 Veritas 未被列入任何执法行动，更高的行业审视已实质性抬高违规成本。

              法律方面，DRHP 披露 Veritas 涉及 5 起刑事案件，公司发起 3,227 起刑事程序（多数为针对违约借款人的 NI Act
              支票拒付案件）。公司及董事没有可量化的法定或重大民事索赔。公司披露过去曾延迟缴纳法定款项。RBI 会进行定期现场检查；任何带有不利发现的观察函，都需要在 IPO 推进前完成整改。
