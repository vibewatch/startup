      - number: '6.5'
        title: 留存、信用行为与耐久性
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 不披露 NRR、GRR 或贷款续借 cohort 数据，因为这些概念适用于订阅式 / B2B 产品，而不是零售小额信贷。最接近的替代指标是 DPD（days past
              due）趋势和 GNPA 比率，它们反映存量借款人基数的当期还款行为。

              截至 2024 年 9 月，0 DPD 贷款账簿为 ₹61,994.27 million（约占 AUM 95.12%），意味着在任一测量日，大约二十名借款人中有十九名没有任何逾期。             
              Gross NPA 从 3.94%（FY2022）改善至 2.19%（FY2023）、1.79%（FY2024）和 1.95%（H1 FY2025 / 2024 年 9 月），之后升至
              2.21%（FY2025）和 2.89%（2025 年 12 月），主要由无抵押营运资金分部滑坡和更广泛的 MSME 微借款人压力推动。

              WCL 压力来自城市小店主：他们从其他贷款机构取得利率明显更高的数字贷款后过度负债，难以继续偿还 Veritas 贷款。公司把无抵押敞口从 11%（FY2024）降至 7%（FY2025），再降至 5%（2025
              年 12 月），同时收紧 WCL 承保并获取质量更好的客户。CareEdge Ratings 预计 GNPA 未来会稳定在约 2.5%，充足拨备提供支撑（截至 2025 年 3 月，整体 PCR 为
              2.19%）。

              组合账龄有限：截至 2025 年 3 月，47% 的 AUM 账龄不足一年（2024 年 3 月为 58%），33% 账龄为 1–2 年，只有 20% 拥有三年或更长记录。账龄不足意味着当前报告的 GNPA
              很可能低估长期正常化信用成本，这是快速增长小额贷款机构的标准风险。核销从 ₹65.22 crore（FY2024）增至 ₹108.22 crore（FY2025）。
