companyProfile:
  summary: >-
    Veritas Finance Limited 总部位于 Chennai，是一家 RBI 注册的系统重要性非吸收存款 NBFC，由 D. Arulmany 于 2015 年 4 月 30 日创立，
    聚焦向服务不足的半城市和农村借款人提供有抵押 MSME 贷款。截至 2025 年 3 月，公司在 11 个邦运营 508 家分支机构，员工 7,796 人，累计服务超过 2 lakh 客户，AUM 达 ₹7,349
    crore；CARE Ratings 认证其五年 CAGR 为 41%。公司于 2024 年 9 月以 ₹8,500 crore 隐含估值跻身独角兽，并在 2025 年 4 月取得 SEBI 对 ₹2,800 crore IPO
    的观察意见。CARE 于 2025 年 6 月 将长期评级上调至 AA- Stable，并在 2026 年 4 月确认；这反映出业务质地较强，尽管近期盈利能力放缓 （9MFY26 年化 ROTA 约 3.10%）且 NPA
    上升（2025 年 12 月 GNPA 2.89%）。
