      - number: '1.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 按 AUM 计，FY22–FY24 印度增长最快的 NBFC
            body: >-
              CRISIL MI&A 认证，Veritas 在可比同业中是增长最快的 NBFC，FY22 至 FY24 的 AUM CAGR 为 61.76%。 拉长到截至 2025 年 3 月的五年窗口，CARE
              Ratings 确认 AUM CAGR 为 41%。公司一边保持 37.82% 的 CAR， 远高于 15% 监管底线，一边实现超常增长，说明其在激进有机扩张中仍守住了资本管理纪律。
            calloutType: strength
            claimRefs:
              - CO032
              - CO033
              - CO036
          - type: callout
            title: 投资级信用评级上调至 CARE AA- Stable
            body: >-
              2025 年 6 月，CARE Ratings 将 Veritas Finance 长期银行授信和 NCD 的评级从 CARE A+ Positive 上调至 CARE AA- Stable，理由是 AUM
              增长强劲、资本化健康、盈利持续。AA- 评级叠加短期工具 CARE A1+，显著扩大了可参与借款的投资者群体， 并在 IPO 进程前降低融资成本。
            calloutType: strength
            claimRefs:
              - CO039
              - CO036
          - type: callout
            title: 地理集中——Tamil Nadu 占 AUM 43%
            body: >-
              虽然已扩展至 11 个邦和一个联邦属地，截至 2025 年 3 月，Tamil Nadu 仍占 AUM 43%，前三大邦（Tamil Nadu、West Bengal、Karnataka）合计占
              71%。Tamil Nadu 的任何本地经济冲击、季风压力或政治扰动，都可能不成比例地影响资产质量和回款。 CARE Ratings 将地理集中列为持续存在的关键弱点。
            calloutType: risk
            claimRefs:
              - CO045
              - CO038
          - type: callout
            title: 无抵押营运资金板块逾期上升
            body: >-
              GNPA 从 1.79%（2024 年 3 月）扩大至 2.81%（2025 年 6 月），主要来自无抵押营运资金贷款板块。CARE 2025 年 10 月指出，截至 2025 年 6 月，GNPA 和 NNPA
              分别为 2.81% 和 1.41%，早期 bucket 逾期（0+ DPD）升至 6.96%。Veritas 已将无抵押敞口从 11%（FY24）降至 7%（2025 年 3 月），再降至 6%（2025 年 6
              月）。 RBI 2025 年 6 月 FSR 也单独提示，NBFC 零售组合 GNPA 升至 3.1%，银行为 1.2%。
