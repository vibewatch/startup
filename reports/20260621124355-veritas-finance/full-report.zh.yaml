      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 是一家专业管理公司，按 SEBI 定义没有可识别发起人；DRHP 因此将其归为无发起人公司。 公司由 D. Arulmany 创立，他拥有超过 25 年金融服务经验，曾任职
              Cholamandalam Finance 和 Aptus Housing Finance，现任董事总经理兼 CEO。管理团队经验较深，包括 CFO V G Suchindran、COO J Prakash
              Rayen、总裁兼首席业务官 K P Venkatesh，以及 CTO PS Parthiban Sudarson。2025 年， 公司任命 Dheeraj Mohan 为首席战略官兼投资者关系负责人，加强
              IPO 前的机构沟通。

              董事会共有九名董事：MD、五名独立董事，以及分别代表 Lok Capital（Priyamvada Ramkumar）、Kedaara Capital（Parin Mehta）和 Multiples
              Private Equity（Sudhir Narayanankutty Variyar）的三名提名董事。 Raj Vikash Verma（前 IRDAI 和 SEBI
              成员）担任非执行独立主席，为董事会提供监管经验。 截至 2025 年 3 月，Arulmany 及其家族按完全稀释口径持有 9.56% 股份；创始人持股仍有意义但已被稀释，若创始人离任， 关键人风险真实存在。
