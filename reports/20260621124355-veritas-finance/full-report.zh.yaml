            - 客户经理拜访 — 上门 / 到店发起贷款，并每周收取营运资金贷款款项
            - 基于 WhatsApp 的 UPI 提醒 — 对即将到期的 EMI 给出数字化轻提醒
        - label: 贷款发起和 KYC
          detail: 数字化开户层：零录入 OCR 从 KYC 文件预填申请；通过 Aadhaar 做 eKYC；自动查征信；外勤照片带地理标签
          modules:
            - 零录入 OCR — 用政府 KYC 照片预填申请
            - Aadhaar / India Stack eKYC — 无纸化身份验证
            - 征信局自动检查（CIBIL）— 在潜客阶段过滤负面画像
            - 带地理标签的外勤照片 — 经营场所和房产证据以数字方式封存
        - label: 信用决策
          detail: 自研 AI/ML 评分卡（409+ 个数据点，数字封存）接入规则引擎，按 2–4 层 maker-checker 层级流转审批，并设定基于风险的定价
          modules:
            - AI/ML 评分卡 — 409+ 个数据点；风险评分；FY22 推出
            - 规则引擎信用审批工作流 — 按评分和贷款规模路由到权限层级
            - 基于风险的定价引擎 — 按风险档位采用 VPLR 挂钩利率或固定利率
            - Maker-Checker 审批 — 按贷款金额设置 2–4 级
        - label: 法律和技术核验
          detail: 内部法务和技术团队为所有有担保产品做房产权属检索、所有权核验、技术估值和 LTV 评估；住房业务使用外部来源补充
          modules:
            - 内部法务团队 — 权属检索、所有权文件、留置权设立
            - 内部技术团队 — 房产估值、LTV 计算、困境价值
            - 外部法务 / 技术（住房）— 为经济适用房贷款增加一层
            - 电子签名和文件库 — 协议数字签署；文件跟踪入库
        - label: LOS / LMS 核心平台（第三方供应商）
          detail: 第三方 LOS 和 LMS（供应商未披露；PSU 银行和头部 NBFC 也在使用）覆盖完整放贷生命周期：发起、放款、服务、EMI 跟踪和 NPA 管理
          modules:
            - 贷款发起系统 — 管理从线索到放款的工作流
            - 贷款管理系统 — EMI 跟踪、退票监测、NPA 分类
            - 核心财务和资金系统 — 资产负债表、ALM、流动性管理
            - HR 系统 — 员工记录、薪资、外勤代理跟踪
        - label: 催收和回收
          detail: 数字优先催收：e-NACH 自动扣款（覆盖 92.8%）、UPI QR/WhatsApp/链接渠道、AI 预测违约算法，以及三层升级（电话催收 → 外勤 → 内部法务）
          modules:
            - e-NACH 自动扣款授权 — 覆盖 92.8% 的有担保借款人
            - UPI QR 码 / 个性化链接 / WhatsApp — 替代性数字还款通道
            - AI/ML 预测违约算法 — 预判违约风险；指导催收优先级
            - 三层升级 — 电话催收 → 外勤催收 → 内部法务回收
        - label: 数据和基础设施
          detail: 中央数据湖汇总所有系统数据；分支到邦级仪表板每日更新；混合本地和多云基础设施，具备 ISO 27001:2022 认证和实时 DR 备份
          modules:
            - 中央数据湖 — 汇总放贷、财务、HR、催收数据
            - 分支到邦级仪表板 — 每日指标：退票率、催收效率、Stage 3
            - 混合本地 + 多云 — 具韧性的基础设施，支持实时 DR 同步
            - ISO 27001:2022 + 每月安全审计 — 信息安全认证
    approximationNotes: 第三方 LOS/LMS 供应商身份未公开披露。层级描述来自 DRHP 技术章节（第 228–235 页）和 FY25 年报。
