      - number: '6.6'
        title: 集中度风险与不利因素
        blocks:
          - type: paragraph
            body: >-
              四项结构性风险需要尽调重点关注。第一，地理集中：截至 2025 年 3 月和 2025 年 12 月，Tamil Nadu 单一州均占 AUM 43%。任何集中在 Tamil Nadu
              的政治扰动、自然灾害（洪水、气旋）或信用事件，都可能对组合造成实质损害。CARE Ratings 持续提示该风险。前三大州（Tamil Nadu、AP、Telangana）在 2025 年 12 月持有 75%
              AUM，限制了新地区带来的分散价值。

              第二，借款人脆弱性：DRHP 明确披露，Veritas 借款人因易受不利经济环境影响、正式部门参与有限，并暴露于经营失败、健康紧急事件和自然灾害带来的收入冲击，属于「relatively high
              credit-risk」。宏观下行、关键南部州作物歉收，或创收家庭成员遭遇健康冲击，都可能伤及没有其他正式信贷安全网的借款人。

              第三，宏观行业压力：CRIF High Mark 数据（2026 年 4 月）显示，2025 年 12 月至 2026 年 4 月 MSME 信贷增长放缓至 3.1%（一年前为 9.7%），微型分部未偿贷款收缩
              3.1%，早期逾期上升。2026 年 4 月，微型借款人 PAR 31-90 为 2.7%。考虑到 Veritas 聚焦微小分部，这一外部逆风具有实质性。

              第四，更广泛小额金融和非正规借贷生态中的过度杠杆风险：TransUnion CIBIL 数据显示，敞口低于 ₹10 lakh 的 MSME 借款人逾期率从 5.1%（2024 年 3 月）升至 5.8%（2025
              年 3 月），尽管整体 MSME 组合质量改善。Veritas 借款人画像与这一脆弱 cohort 高度重合；如果 FY2025 WCL 中由城市数字贷款触发的过度杠杆再次出现，可能在其他地区复制。

              公司的缓释措施——低于 50% 的 LTV 有抵押品、88.67% 内部获客、主动压降无抵押敞口、强制 e-NACH
              注册——都有实质意义，但不能消除风险。客户群相对隔绝于正式机构信贷，是一把双刃剑：它创造市场机会，也限制借款人在冲击发生时的财务韧性。
            claimRefs:
              - CU042
              - CU043
              - CU044
              - CU045
              - CU046
              - CU047
              - CU048
      - number: '6.7'
        title: 图表证据
        blocks:
          - type: callout
            title: 生产化规模：211,000 名借款人，FY2024 前 GNPA 低于 2%
            body: >-
              到 2025 年 3 月，Veritas Finance 已建成完全生产化、能产生收入的零售 NBFC，拥有 211,389 名活跃借款人和 ₹7,349 crore AUM。GNPA 从
              3.94%（FY2022）降至 1.79%（FY2024）的轨迹说明，核心扩张阶段的快速增长并未以牺牲信用质量为代价。规模化后仍保持低于 2% GNPA 的记录，验证了「AAA filter」模型。
            calloutType: strength
            claimRefs:
              - CU002
              - CU037
          - type: callout
            title: 地理与行业集中制造尾部风险
            body: >-
              Tamil Nadu 占 AUM 43%，前三大州占 75%，意味着单一州的区域信用事件、自然灾害或政策变化，都可能伤及四分之一甚至更多组合。叠加农村微借款人对收入冲击的结构性脆弱，以及 GNPA 从
              FY2025（2.21%）到 2025 年 12 月（2.89%）的上升轨迹，这一集中度风险需要在尽调中设置专门的地理压力情景。
            calloutType: risk
            claimRefs:
              - CU042
              - CU043
              - CU045
          - type: callout
            title: 借款人脆弱性是商业模式的结构性取舍
            body: >-
              Veritas Finance 的竞争护城河，恰恰是愿意向正式银行拒绝的借款人放贷。同一特征——非正规收入、文件有限、地理偏远、new-to-credit
              状态——也让借款人基数天然容易受到收入冲击、过度杠杆和宏观下行影响。2025 年 WCL
              分部压力（城市小店主数字贷款遗留负担）预演了宏观冲击到来时，有抵押分部可能发生的情况。投资者必须把金融普惠使命和更高信用成本基线视为同一枚硬币的两面。
            calloutType: insight
            claimRefs:
              - CU044
              - CU045
              - CU046
              - CU048
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 信用与资产质量风险
        blocks:
          - type: paragraph
            body: >-
              资产质量是 Veritas Finance 面临的最直接财务风险。Gross NPA 从 1.79%（FY24）升至 2.21%（FY25），并在 2025 年 12 月 31 日进一步升至 2.89%；net
              NPA 升至 1.58%，接近 CARE 已发布的降级触发线：NNPA 高于 2% 且 ROTA 低于 3%。早期逾期指标确认恶化具有广泛性：截至 2025 年 12 月 31 日，0+ DPD 达到
              5.93%，30+ DPD 为 4.75%，60+ DPD 为 3.24%，而 2025 年 3 月 31 日分别为 4.85%、3.86% 和 2.65%。核销从 ₹65.22
              crore（FY24）增至超过两倍的 ₹108.22 crore（FY25），推动信用成本从 1.73% 升至 2.31%，并将 FY25 ROTA 从 4.70% 压缩至 3.98%，9MFY26
              年化进一步压至 3.10%。

              滑坡的主要驱动是无抵押 working-capital loan（WCL）分部。Veritas 有意收缩该分部，FY24 至 2025 年 12 月其占 AUM 比例从 11% 降至
              5%，但违约贡献仍不成比例。首贷借款人占贷款账簿 24.72%（2024 年 9 月），截至 2025 年 3 月，整体组合中 47% 账龄不足一年，限制了历史违约模型的可靠性。CARE 预计短期 GNPA
              稳定在约 2.5%，总 AUM 的 2.48% 拨备覆盖提供缓冲。投资者应监控 IPO 窗口关闭前 NNPA 是否越过 2%，因为 CARE 已表示这将触发负面评级行动。
