            body: >-
              整个获客和服务管线运行在第三方 LOS/LMS
              供应商上，供应商身份未公开披露。供应商宕机、授权争议或版本迁移，都可能同时扰乱所有分支的获客、审批和催收。另一个问题是，收入评估和房产核验必须实地拜访，这为每笔贷款形成结构性成本底线：随着分支网络扩展到人口密度较低的新州，如果贷款收益率没有同步压缩来抵消单笔外勤成本上升，单位经济可能恶化。现金催收占账簿
              10.39%，且披露两起员工欺诈事件，是剩余运营风险；不把营运资金贷款分部完全数字化，风险很难消除。
