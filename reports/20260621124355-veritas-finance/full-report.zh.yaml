      - number: '1.4'
        title: 规模、里程碑与财务表现
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 从 2015 年 Tamil Nadu 单一邦贷款机构，成长为截至 2025 年 3 月覆盖 11 个邦、508 家分支机构 （含 117 个服务中心）的平台，员工 7,796
              人，服务超过 2 lakh 客户。2025 年 3 月 AUM 达 ₹7,349 crore， 同比增长 28%，高于 FY24 的 ₹5,724 crore；CARE Ratings 验证其五年 CAGR 为
              41%。CRISIL MI&A 认定， Veritas 在 FY22 至 FY24 期间以 61.76% 的 AUM CAGR 成为增长最快的 NBFC。

              FY25 总收入为 ₹1,557.40 crore，税后利润（OCI 后）为 ₹292.19 crore；净资产达到 ₹2,783.17 crore， 借款为 ₹5,629.24 crore。资本充足率为
              37.82%，远高于 15% 的监管底线。资产质量略有走弱：2025 年 3 月 GNPA 为 2.21%、NNPA 为 1.10%，到 2025 年 6 月扩大至
              2.81%/1.41%，主要受无抵押营运资金贷款账簿承压影响 （该部分从 AUM 11% 降至 7%）。CARE 于 2025 年 6 月将长期评级上调至 AA- Stable。Q3FY26（2025 年
              10–12 月）总收入为 ₹46,183 lakhs，PAT 为 ₹8,176 lakhs；截至 2025 年 12 月，净资产达到 ₹3,004 crore， 债务股本比为 2.20。行业层面风险仍在：RBI
              2025 年 6 月 Financial Stability Report 指出，NBFC 零售 GNPA 为 3.1%，银行为 1.2%；同时提示银行对 NBFC 融资增速从 35%（2023 年 3
              月）放缓至 5.9%（2025 年 3 月）， 中型贷款机构融资更紧。

              地理集中仍是风险点：Tamil Nadu 单独占 AUM 43%，前三大邦合计占 71%，尽管公司 FY24 已进入 Bihar 和 Chhattisgarh。
