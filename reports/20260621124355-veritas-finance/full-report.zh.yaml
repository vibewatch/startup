      - number: '7.3'
        title: 融资、流动性与负债结构风险
        blocks:
          - type: paragraph
            body: >-
              相比长期资产账簿，Veritas 的融资结构集中且期限偏短。截至 2025 年 12 月 31 日，银行借款占融资组合 71.30%，其中 SBI 单独占总借款 18.11%，前 27
              大交易对手合计占除净资产外全部负债的 91.30%。按 2026 年 3 月季度披露，一年内到期的短期负债占总负债 33.76%，在贷款账簿年增 28%+ 的背景下形成有意义的年度再融资风险。

              截至 2025 年 12 月 31 日，NCDs 占融资组合 11.39%，证券化占 12.19%，提供一定分散。但 NIM 从 14.39%（FY24）压缩至
              13.38%（FY25），因为借款成本上涨快于贷款收益率；账面杠杆从 2025 年 3 月 31 日的 2.08x 升至 2025 年 12 月 31 日的 2.25x。CARE 的负面触发线是杠杆率高于
              3x，目前仍有空间，但轨迹向上。若 IPO 的 ₹600 crore 新股发行部分成功推出，将降低杠杆率；但 ₹2,200 crore OFS 部分不会增加一级资本。

              FY25 银行对 NBFC 的信贷流量停滞，因为贷款机构提高风险权重并收紧信贷条件。如果这种宏观收紧回归或被放大——例如又一次 IL&FS 式事件之后——Veritas
              对银行的集中依赖会让短期替代融资路径有限。ALM 结构目前舒适（截至 2025 年 12 月 31 日无累计期限桶错配），但随着账簿放大仍需密切监控。
