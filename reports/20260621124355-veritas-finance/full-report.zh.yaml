chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance Limited（CIN: U65923TN2015PLC100328）是一家在 Reserve Bank of India 注册的系统重要性非吸收存款 NBFC， 按 RBI
              规模化监管框架归为 NBFC-Middle Layer。公司 2015 年 4 月 30 日注册成立，住所地在 Tamil Nadu，办公地址为 SKCL Central Square 1, Guindy,
              Chennai 600 032。公司 2015 年开始放贷，使命是向半城市和农村市场中服务不足的微型、小型和中型企业提供按需信贷。

              公司的核心产品是以房产抵押的有抵押 MSME 小企业贷款，贷款规模从 ₹30,000 到 ₹50 lakh，平均票面为 ₹4.5 lakh。多年间，公司拓展至营运资金贷款（无抵押，占 AUM 约 10%
              以下）、面向平价自建住房的房产抵押建设贷款 （Loan Against Property-Construction，LAP-C）、自住住房贷款，以及二手商用车融资（FY24 推出）。FY25 组合结构为 56%
              有抵押 MSME、19% 住房贷款、14% LAP-C、7% 营运资金、4% 车辆贷款。承销依托内部外勤团队完成实地走访和抵押物评估， 贷款价值比控制在压力资产价值的 50% 以下，回款主要通过
              ACH/直接借记授权完成。
