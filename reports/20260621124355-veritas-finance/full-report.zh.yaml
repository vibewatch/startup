  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正论、反论与建议
        blocks:
          - type: paragraph
            body: >
              Veritas Finance 搭起了一个有吸引力的金融服务 franchise：它是印度 AUM CAGR 最高的纯 MSME NBFC（截至 FY25， 五年 CAGR 41%，AUM 达 ₹7,349
              crore），采用网点密集的外勤承保模式（509 家网点，88.67% 内部获客），并持有 CARE AA-；Stable 信用评级（2025 年 6 月上调，2026 年 4 月确认），可从银行、共同基金和
              NCD 市场取得多元低成本资金。 SEBI 已于 2025 年 4 月 29 日批准 ₹2,800 crore IPO；HDFC Bank、ICICI Securities、Kotak Mahindra
              Capital、 Jefferies India 和 Nuvama Wealth Management 担任主承销商，说明机构路演准备已经到位。五家头部 PE 投资人—— Norwest Venture
              Partners、Kedaara Capital、Multiples PE、British International Investment 和 Lok Capital—— 合计参与八轮股权融资，总额
              ₹1,835 crore，跨周期验证了公司的信贷模型。

              反论同样尖锐。总资产回报率（ROTA）已从 FY23 峰值 5.36% 降至 FY25 的 3.98%，并在 9MFY26 进一步降至年化 3.10%， 接近 CARE 明示的 3.00% 负面触发线。总 NPA
              从 FY22 的 0.85% 升至 2025 年 12 月的 2.89%，NNPA 为 1.58%， 距 CARE 2.00% 评级触发线仅 42 个基点。IPO 结构以 OFS 为主（₹2,200 crore
              OFS，占总募资 78.6%），意味着多数资金流向 寻求退出的 PE 投资人，而不是公司增长。FY24 成本收入比 35.2%，在 CRISIL MI&A 同业中最高，形成结构性成本底线，限制利润率修复。 截至
              2026 年 6 月 21 日，SEBI 批准已超过 17 个月，公司仍未公布价格区间或上市日期，这表明内部盈利轨迹或市场时机约束仍未解除。

              综合来看，Veritas Finance 适合“跟踪”建议：franchise 和市场机会真实存在，但盈利走势恶化、NPA 抬升、独角兽估值拉得过高， 都要求相对 2024 年 9
              月内部估值给出显著折价。公开市场投资人在按独角兽估值区间上半段投入前，应要求看到 ROTA 稳定在 3.5% 以上、 GNPA 得到控制的证据。
