      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              多个结构性力量正在加速 Veritas 目标客群获得正式信贷。Udyam 注册让数百万小企业进入正式体系；GST Sahay 和 TREDS 生成了数字现金流证据，
              贷款机构可将其作为部分收入代理。Priority Sector Lending（PSL）要求允许银行向 NBFC 提供、再转贷给小工业的信贷被归类为 PSL， 直接补贴 NBFC
              融资成本，并激励银行扩大这一渠道。FY21 至 FY24，NBFC 的 MSME 贷款 CAGR 为 32%，明显快于私营银行 （20.9% CAGR）和 PSU 银行（10.4% CAGR），部分原因是这种
              PSL 好处通过 NBFC 发起方更容易落地。

              PMAY（Pradhan Mantri Awas Yojana）住房计划刺激了 Tier 2–4 城镇和村庄的首套房需求，直接扩大 Veritas 住房建设贷款的可服务人群。整个 AHFC 板块预计到 FY26
              将保持 20–22% 增长，靠这一政策顺风支撑。CV 端，农村物流需求上升、 电商渗透 Tier 3+ 城镇，以及新经营者偏好二手车，共同扩大可服务的车队业主细分市场。

              正规化是更长期的世俗驱动因素。截至 2025 年 9 月，新信贷（NTC）借款人占比为 23.3%（CRIF-SIDBI），意味着小企业信贷生态中约每四个活跃借款人就有一个此前未从正式贷款机构借款。
              即使既有借款人升级到银行贷款，这个池子也会不断补充可服务市场。
