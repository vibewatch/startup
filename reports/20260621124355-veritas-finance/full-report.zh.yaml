      - number: '2.5'
        title: 采用约束、市场风险与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              这个市场的增长轨迹真实存在，但若干结构性约束限制了采用速度，并制造信用周期风险。

              借款人过度加杠杆是眼前的系统性风险。FY25，NBFC-MFI AUM 在借款人负债激增后下降 12%；从超过三家贷款机构借款的借款人比例在 2024 年 9 月达到 25% 峰值，护栏措施落地后到 2025 年
              3 月降至 17%。MFI 板块总压力池 FY25 达到 15.3% （ICRA），且已有证据显示压力外溢到邻近 micro-LAP 板块：MFI 贷款还款承压的借款人，也会放慢有抵押贷款还款。 Veritas
              的有抵押优先模式能缓释这类风险，但早期逾期指标仍小幅上行（2025 年 3 月 0+ DPD 为 4.85%，上年为 3.61%）。

              文件缺口是结构性的。Veritas 借款人大多缺少文件：没有 ITR、没有经审计财务报表，往往也没有 GST 注册。外勤信贷评估做得好时有效， 但需要密集分支网络，限制了地理扩张速度。新市场分支机构需要
              12–18 个月成熟；本地信贷团队不熟悉的区域，错误率更高。

              银行融资收紧，是 NBFC 资产负债表近期增长约束。银行对 NBFC 贷款在 2023 年初增长超过 35%，到 2025 年 3 月放缓至 5.9%。融资压缩抬高 NBFC
              借款成本，并限制资产负债表扩张。资本充足率和信用评级更强的 NBFC（Veritas 于 2025 年 6 月上调至 CARE AA–）处境更好，但行业层面的约束真实存在。

              RBI 2025 年 6 月放松 NBFC-MFI 合格资产规则（从 75% 降至 60%），是一项促进竞争的结构性变化，允许 MFI 产品更多元； 这可能让部分 NBFC-MFI 进入 Veritas
              所在的有抵押贷款空间——这是一个中期竞争威胁，市场数据尚未反映。
