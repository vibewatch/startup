      - number: '6.3'
        title: 客户增长与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              FY2022 至 FY2024，Veritas 活跃借款人基数以 56.68% CAGR 增长，从 53,772（FY2021）增至
              71,726（FY2022）、116,403（FY2023）、176,082（FY2024）和 211,389（FY2025）。AUM 轨迹紧贴借款人增长：₹1,563 crore（FY2021）、₹2,187
              crore（FY2022）、₹3,534 crore（FY2023）、₹5,724 crore（FY2024）、₹7,349 crore（FY2025）和 ₹8,506 crore（2025 年 12
              月，未经审计）。截至 2025 年 6 月 30 日，公司报告贷款账簿 ₹7,477 crore、438 个分支。自成立至 2025 年 6 月，累计放款为 ₹14,270 crore。

              平均票面从 ₹3.7 lakh（FY2022）稳步升至 ₹4.0 lakh（FY2024）和 ₹4.2 lakh（2024 年 9
              月），反映组合向更高金额农村商业贷款倾斜，也反映复借客户收入温和提升。FY2025 总放款达到 ₹3,933 crore，略高于 FY2024 的 ₹3,702 crore。

              Veritas 在 FY2024 跨过 100,000 名借款人和 400 个分支两个里程碑，公司里程碑页面均有记录。19th Inclusive Finance India Awards 2022
              的「Inclusive Enterprise Lending by NBFC of the Year」奖项，以及连续 Great Place to Work
              认证，说明该模式获得外部认可。采用已经完全进入生产阶段——披露数据中没有试点阶段指标。截至 2024 年 9 月，单分支 AUM 为 ₹153.71 million，单销售经理 AUM 为 ₹17.43
              million，显示一线团队生产力充足。
