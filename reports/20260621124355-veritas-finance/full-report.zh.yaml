      - number: '8.3'
        title: 可比公司组与公开市场基准
        blocks:
          - type: paragraph
            body: >
              Veritas Finance 最相关的可比公司是 Five Star Business Finance（NSE: FIVESTAR）。它同样是纯抵押 MSME 贷款机构，
              地理重心也在南印度，依赖网点获客，并有长期经营记录。截至 2026 年 6 月，Five Star 约以 2.08x P/B 交易，市值为 ₹15,333 crore。更强的盈利质量——ROA 7.27%、ROE
              16.06%、GNPA 1.79%——支撑了它相对 Veritas Finance 的溢价。 Five Star 没有无抵押敞口，严格采用有抵押 LAP 模型，信用成本显著更低（FY24 为
              0.7%，Veritas Finance FY25 为 2.31%）； 运营效率也更高（成本收入比 25.4%，Veritas 为 35.2%），因此 ROA 明显更强。若 Veritas Finance 按
              Five Star 当前 2.08x P/B 平价交易，以 2025 年 12 月净资产 ₹3,004 crore 计算，隐含股权价值约 ₹6,248 crore，较独角兽估值折价 27%。

              SBFC Finance（NSE: SBFC）P/B 更高，为 3.13x（历史区间 3.50–4.61x），每股账面价值 ₹29.40，反映其轻资产、低网点数模型 （205 家网点，Veritas 为 509
              家）以及更优的运营费用效率（opex/AUM 4.65%，Veritas 约 6.9%）。SBFC FY25 GNPA 为 2.74%， 接近 Veritas 的 2.21%，说明当前 3.13x P/B
              部分反映质量溢价，而 Veritas 更依赖网点、且有无抵押敞口的模型难以取得同等溢价。

              Ugro Capital 2026 年 P/B 为 0.44–0.57x，代表 SME 贷款领域盈利记录有限的 DataTech NBFC 估值下限——可作为市场如何惩罚 未盈利增长的参照。Aptus Value
              Housing Finance（GNPA 1.19%、成本收入比约 14.4%）享有更高倍数，但纯住房贷款账本使其可比性不完整。

              2026 年印度 NBFC IPO 市场活跃：SK Finance、Avanse、Credila 和 Veritas Finance 合计计划募资约 ₹13,500 crore， NBFC IPO
              供给压力可能压缩可用倍数。分析师对印度高质量 MSME NBFC IPO 的共识目标为 1.8–2.5x P/B，适用于 GNPA 低于 2%、 ROA 高于 5% 的贷款机构；Veritas Finance
              当前指标低于两条门槛，因此更应落在区间低端。
