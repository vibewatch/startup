      - number: '2.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 信贷缺口框架必须讲清方法
            body: >-
              DRHP 中 ₹103 trillion 的 MSME 信贷缺口（CRISIL，FY24）和 CARE Ratings 的 ₹18.3 lakh crore 正式可服务缺口，并不是同一对象的不同估算。DRHP
              使用总债务需求，包含贸易信贷和非正规借款；CARE 测量正式供给与可银行化需求之间的缺口。 分析师应把 CARE 数字作为正式 NBFC 切入的可服务市场；DRHP 数字是更广义的社会融资需求。Veritas
              自身 AUM（₹7,477 crore， 2025 年 6 月）相对任一口径都很小。
            calloutType: insight
            claimRefs:
              - CM010
              - CM003
              - CM004
          - type: callout
            title: 过度加杠杆与 MFI 压力外溢是现实风险
            body: >-
              ICRA 记录，MFI 板块总压力在 FY25 达到 15.3%；CARE 确认压力外溢至邻近的有抵押 micro-LAP。Veritas 的有抵押模式和 LTV 纪律提供结构性保护，但早期逾期（0+ DPD 到
              2025 年 3 月升至 4.85%）以及 Q1 FY26 的 GNPA 恶化（2.81%） 表明，逆周期并未只封闭在无抵押贷款机构内部。
            calloutType: risk
