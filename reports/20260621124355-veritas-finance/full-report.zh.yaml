      - number: '7.5'
        title: 地理集中与宏观行业风险
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 3 月 31 日和 2025 年 12 月 31 日，Tamil Nadu 均占 Veritas Finance AUM 的 43%；前三大州（Tamil Nadu、West
              Bengal，以及 Andhra Pradesh / Karnataka 区域）截至 2025 年 12 月 31 日合计占 75%，高于 2025 年 3 月 31 日的 71%。在 DRHP
              中，Veritas 披露 83.02% 分支和 91.82% 放款集中于五个州。单一州级事件——严重季风季、政治扰动或本地经济冲击——可能对接近一半 AUM 的催收产生不成比例影响。

              行业层面，按 CRIF High Mark 数据，2025 年 12 月至 2026 年 4 月 MSME 信贷增长仅 3.1%，较上一年的 9.7% 大幅放缓。按笔数计占活跃 MSME 贷款 86%
              的微型借款人出现早期压力（2026 年 4 月微型 PAR 31-90 为 2.7%，中型为 0.8%）。营运资金贷款和公营银行组合压力最大。尽管过度杠杆的小额金融借款人从 35 million（2023 年 9
              月）降至 17.1 million（2025 年 3 月），说明行业部分修复，Veritas 服务的非正规 MSME 分部仍易受收入冲击和作物周期波动影响。RBI 的 FSR 和行业分析师将无抵押 NBFC
              MSME 贷款列为 FY26 主要系统性压力点，强化了公司自身缩减 WCL 账簿的决定。
