          to: verdict
        - from: profitability
          to: verdict
        - from: npa
          to: verdict
        - from: valuation_ref
          to: verdict
        - from: peer_bench
          to: verdict
        - from: ipo_risk
          to: verdict
        - from: verdict
          to: range
