      - number: '4.3'
        title: 资产质量与信用成本轨迹
        blocks:
          - type: paragraph
            body: >-
              Veritas 的资产质量结构性分化：有抵押 MSME 组合（FY25 占 AUM 93%）在 LTV 低于 50% 的约束下表现稳健；无抵押营运资金贷款板块 （WCL）则是主要滑坡来源。合并层面 GNPA 从
              1.79%（FY24）升至 2.21%（FY25），到 2025 年 6 月（Q1FY26）进一步恶化至 2.81%；NNPA 同期从 0.85% 升至 1.10%，再到 1.41%。早期逾期更尖锐：0+ DPD
              从 3.61%（FY24）升至 4.85%（FY25）和 6.96%（Q1FY26），60+ DPD 从 2.02% 升至 2.65% 和 3.32%。总核销从 ₹65.22 crore （FY24）跳升至
              ₹108.22 crore（FY25），增长 66%。

              FY25 信用成本从 FY24 的 AUM 1.73% 升至 2.31%，与更广泛行业趋势一致：ICRA 2025 年 7 月报告提示，NBFC-MFI 板块 FY25 AUM 下降
              12%，整体压力（SMA+GNPA+write-offs+SR）从 5.9% 激增至 15.3%。Veritas 不是纯 MFI， 但承担无抵押放贷相关性风险。Reserve Bank of India 2025
              年 6 月 Financial Stability Report 也指出，NBFC 微金融压力资产升至 5.9%，middle-layer NBFC 的核销率从约 20% 升至 38.7%。

              Veritas 的应对较主动：WCL 敞口从 11%（FY24）降至 7%（FY25），再到 6%（Q1FY26）；信贷承销收紧；拨备增加。 FY25 Stage-3 PCR 为
              50.52%（FY24：53.14%），按 stage-3 口径略低，但整体 PCR 从 1.56% 改善至 2.19% （FY25），并进一步升至 2.67%（Q1FY26）。FY25 组合中 47%
              账龄不足一年（FY24 为 58%），未来 12–18 个月组合成熟度将是关键观察变量。
