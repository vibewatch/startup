  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户主张
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 服务 MSME 借款人，主要包括自雇商户、小型制造商、农村运输经营者和非正规小店主。公司提供四类贷款产品，分别匹配不同信用风险画像和收入周期。

              Rural Business Loans 是旗舰产品，也是公司业务特许权的基础。这类贷款以不动产作抵押，平均票面 ₹4.7 lakh，账面收益率约
              22.83%，面向正式文件有限的首贷借款人。该产品已运行十年，沉淀了最深的机构知识和最成熟的评分卡。截至 2025 年 3 月，它占 AUM 56%，仍是账簿主力；随着新产品放量，该比例已从 FY23 的 72%
              下降。

              Affordable Home Loans 在 FY23 推出，是顺着客户需求延伸的邻近产品：MSME 借款人还清商业贷款并形成可靠还款记录后，下一步自然需要正式住房贷款，用于自建或购房。平均票面 ₹11.3
              lakh、收益率约 16.63%，期限更长，信用风险低于 MSME 商业贷款。FY25 该产品贡献约 14% AUM，而 FY22 基本为零。

              Used Commercial Vehicle Loans 于 2024 年 3 月推出，面向农村运输经营者和购买商用车用于物流、农业或建筑的小微企业。平均票面 ₹4.5 lakh，收益率约
              19.25%，以车辆抵押。首个完整运营年度内，贷款账簿到 2025 年 3 月已超过 ₹300 crore；但由于账龄有限、尚无完整周期违约经验，它也是近期不确定性最高的产品。

              Working Capital Loans 是短期无抵押贷款，平均票面 ₹1.8 lakh，收益率约 27.03%，为组合最高，服务城市和半城市市场的小店主、餐厅业主。该产品由客户经理推动周度催收。FY25
              公司有意压降该分部（AUM 占比从 FY24 的 11% 降至约 7%），因为公司优先发展有抵押产品，并管理无抵押 NPA 压力。四类产品组合显示，公司有意识地从单一农村 MSME
              产品，扩展为更宽的生命周期金融服务平台；每个新产品都复用分支机构渠道和信用基础设施。
