      - number: '3.3'
        title: 邻近与既有玩家——Aptus Housing、Shriram Finance、CreditAccess Grameen
        blocks:
          - type: paragraph
            body: >-
              Aptus Value Housing Finance 竞争的是 Veritas 的平价住房邻近业务，而不是核心 MSME LAP 板块。截至 FY25，Aptus AUM 为 ₹10,865 crore（同比
              +25%），300 家分支机构集中在 Andhra Pradesh（42%）、Tamil Nadu（34%）和 Telangana（16%）——这些区域与 Veritas 本土市场高度重叠。Aptus 实现
              7.7% RoA、18.76% RoE，GNPA 仅 1.19%， opex/AUM 只有 14.4%，经济性远优于 Veritas；这由标准化住房贷款流程和较低风险借款人画像驱动。Veritas 住房贷款占比
              18%（FY25），使其与 Aptus 在边缘正式部门自建房借款人上直接竞争；但 Aptus 更深的产品专精、数字化贷款执行 （92% 协议数字化）和住房金融品牌更强，让 Veritas
              赢得纯住房需求时面临真实摩擦。

              Shriram Finance 是既有 NBFC，规模（₹2,63,190 crore AUM、3,220 家分支机构）和农村、半城市客户关系，对借款人信任形成竞争压力； 但其 MSME 贷款（₹37,413
              crore，占 AUM 14.2%）次于其占主导的商用车业务。Shriram 的分支密度和既有小企业客户关系，既是品牌优势， 也可能在双方运营的邦中与 Veritas 争夺管道。不过，Shriram
              的平均票面更大，承销框架以车辆为中心，限制了它与 ₹1–10 lakh 有抵押 MSME LAP 利基的直接重叠。

              CreditAccess Grameen 是印度最大的 NBFC-MFI，截至 2025 年 3 月 AUM 约 ₹25,948 crore，是间接替代者——其无抵押团体贷款模式瞄准的借款人群， 与
              Veritas 农村客户部分重叠。关键差异在抵押物：CreditAccess 按团体担保利率发放无抵押贷款，Veritas 则要求房产抵押。MFI 板块 FY25 压力（CreditAccess
              净利润因逾期周期同比下降 63.2% 至 ₹531 crore）凸显一个风险：Veritas 借款人同时背负 MFI 和 LAP 债务时会过度加杠杆， 这是 Veritas 资产质量的不利情景。
