      - number: '6.2'
        title: 地理分布与分支覆盖
        blocks:
          - type: paragraph
            body: >-
              Veritas 覆盖 11 个州和联邦属地，足迹从 FY2022 的 8 个州扩张而来。截至 2025 年 3 月，网络包含 508 个分支，其中包括 117 个服务中心，覆盖 178 个地区。到 2025 年
              12 月，运营点增至 512 个（包括 71 个服务中心）。按最新公司简介，截至 2025 年 6 月 30 日，公司还运营 438 个分支和 71 个服务中心。

              地理集中度突出。Tamil Nadu 是 Veritas 发源地，2024 年 9 月占 AUM 41.94%，到 2025 年 3 月和 2025 年 12 月仍均为 43%。前三大州——Tamil
              Nadu、Andhra Pradesh 和 Telangana——合计在 2025 年 3 月贡献 71% AUM，2025 年 12 月为 75%，既反映南部业务的深度，也反映新地区仍处早期（Bihar 和
              Chhattisgarh 于 FY2024 进入，2024 年 9 月合计占 AUM 不到 1.2%）。随着 AP/TN 住房贷款增长加速，东部走廊（West
              Bengal、Odisha、Jharkhand）的优先级被降低。

              服务中心补充完整分支，专注贷款服务、催收和客户咨询，不具备获客能力，从而在农村集群实现最后一公里催收覆盖。公司瞄准未服务和服务不足地区，并优先招聘本地人才；按 AUM 计，88.67%
              的贷款由分支网络内部获客，只有 11.33% 来自直销代理（DSAs），后者集中在住房贷款和车辆贷款业务。
