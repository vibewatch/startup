      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 独角兽估值与公开市场现实
            body: >
              2024 年 9 月 ₹8,500 crore 的独角兽估值（按 2024 年 9 月账面价值为 3.25x P/B）由现有 PE 投资人在内部轮中设定， 并非独立第三方价格发现。自该估值设定以来，ROTA
              已降至 3.10%，GNPA 升至 2.89%，支撑 3.25x P/B 的基本面明显变弱。 上市同业 Five Star Business Finance 以 2.08x P/B 交易，ROA 却是
              Veritas Finance 当前轨迹的 3.5 倍。合理的公开市场出清价为 ₹6,000–7,500 crore（2.0–2.5x P/B），意味着较独角兽估值折价 12–29%。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV027
              - CV028
          - type: callout
            title: OFS 抛压与时间延误
            body: >
              ₹2,200 crore OFS（占 IPO 募资 78.6%）说明 PE 投资人优先考虑退出，而不是公司资本补充。从 SEBI 批准（2025 年 4 月）到报告运行日 （2026 年 6 月）已过去超过 17
              个月，仍未公布价格区间；这种异常延误可能反映管理层不愿按低于独角兽估值的价格定价。IPO 若继续推迟或撤回， 现有 PE
              投资人会被困在流动性不足的持仓中，可能被迫以更深折价进行二级出售。公开市场投资人应把这段延误视为管理层对近期财务轨迹信心不足的负面信号。
            calloutType: risk
            claimRefs:
              - CV006
              - CV024
              - CV033
              - CV038
              - CV039
          - type: callout
            title: 建仓前的尽调路径
            body: >
              若要在基准情景区间或以上（₹6,400+ crore）进入，投资人应要求：（1）FY26 经审计财务确认 ROTA ≥ 3.0%、NNPA ≤ 2.0%； （2）RHP 价格区间，以确认管理层自身对 P/B
              的看法；（3）Q4FY26 NPA 数据，以确认 GNPA 峰值；（4）IPO 后 AUM 增长计划， 证明 ₹600 crore 新股发行资金的投放合理。若入场价低于 2.0x P/B（≤ ₹6,008
              crore），熊市情景下才有有意义的安全边际。
            calloutType: recommendation
            claimRefs:
              - CV040
              - CV005
              - CV004
              - CV018
              - CV019
