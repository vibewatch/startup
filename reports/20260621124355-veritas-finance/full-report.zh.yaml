  - id: FV001
    title: 建议逻辑 — 从证据到结论
    type: flow
    layout: standard
    summary: 从 Veritas Finance 的规模、盈利能力、风险和估值证据出发，推导出 Track 建议。
    data:
      nodes:
        - id: scale
          label: 规模：AUM ₹7,349 Cr；509 家分支；AA- 评级
          type: strength
        - id: growth
          label: 增长：AUM 5 年 CAGR 41%；增长最快的 MSME NBFC
          type: strength
        - id: profitability
          label: 盈利压力：ROTA 3.10%（9MFY26），仍在下滑
          type: risk
        - id: npa
          label: NPA 风险：GNPA 2.89%，NNPA 1.58% — 接近 CARE 触发线
          type: risk
        - id: valuation_ref
          label: 独角兽标记：₹8,500 Cr = 2025 年 12 月 P/B 2.83x
          type: neutral
        - id: peer_bench
          label: 同业：Five Star P/B 2.08x（ROA 7.27%）；SBFC 3.13x
          type: neutral
        - id: ipo_risk
          label: IPO 风险：获批后 17+ 个月，仍无价格区间
          type: risk
        - id: verdict
          label: 结论：TRACK — 独角兽标记下估值偏高
          type: recommendation
        - id: range
          label: 基准区间：₹6,000–7,500 Cr（以 ₹3,004 Cr 净资产计 P/B 2.0–2.5x）
          type: insight
      edges:
