      - number: '5.3'
        title: 技术基础设施与数字栈
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 将自身方法描述为「technology as an enabler」——这个克制表述说明，技术用来加速一线驱动的信贷模型，而不是取代人判断。数字贷款流程从零数据录入 OCR
              开始，KYC 文件自动预填申请，减少人工转录错误。基于 AI/ML 的承保评分卡进入规则引擎，将审批路由到相应授权层级。电子签名处理客户协议，文件跟踪覆盖收取、入库和返还。所有放款都通过 NEFT 或 RTGS
              数字化转入借款人银行账户。

              催收基础设施是运营中技术密度最高的部分。e-NACH 自动扣款授权覆盖 92.8% 的有抵押借款人，UPI QR 码、个性化付款链接和 WhatsApp UPI
              提醒提供替代数字渠道。一线催收时会向借款人发送一次性密码，以减少欺诈。AI/ML 预测违约算法分析历史还款数据和行业数据库，为每名借款人估计违约概率，从而引导催收团队投入。每笔还款都会通过数字 SMS
              回执确认，形成可审计轨迹。

              核心贷款生命周期运行在大型 PSU 银行和头部 NBFC 使用的第三方 LOS 和 LMS 平台上。这是有意标准化的选择：放弃自有差异化，换取已验证的可靠性、监管熟悉度和供应商问责。系统覆盖从获客到 NPA
              管理的全流程，并部署在数据中心高端服务器上，配有灾备和业务连续性控制。

              中央数据湖汇聚放贷、财务、催收和 HR 系统数据，驱动分支层面每日更新的仪表盘，展示催收效率、贷款拒绝率、扣款失败率、Stage 3
              贷款数量等指标。数据从分支汇总到区域、地区和州层面，支持实时绩效管理。移动应用支持七种区域语言，借款人可管理
              EMI、查看贷款详情，并用语音提出问题。公司还在试点自助入职和无纸化执行工具，为回头客提供借款人侧数字入口，进一步减少到店需求。
