  - id: FV002
    title: 估值敏感性 — P/B 倍数 vs. ROTA 情景
    type: bar
    layout: standard
    summary: 条形图展示 ROTA 每变化 50 bps 如何对应 P/B 重估，并按 2025 年 12 月净资产 ₹3,004 crore 推算隐含股权价值。
    data:
      items:
        - label: 熊市：ROTA 2.5%
          value: 1.5
          note: 隐含股权价值约 ₹4,506 Cr；CARE 下调风险
        - label: 熊市-基准：ROTA 3.0%
          value: 1.8
          note: 隐含股权价值约 ₹5,407 Cr；CARE 触发线边缘
        - label: 基准：ROTA 3.5%
          value: 2.2
          note: 隐含股权价值约 ₹6,609 Cr；企稳情景
        - label: 基准-牛市：ROTA 4.0%
          value: 2.5
          note: 隐含股权价值约 ₹7,510 Cr；FY24 盈利水平
        - label: 牛市：ROTA 4.5%+
          value: 3
          note: 隐含股权价值约 ₹9,012 Cr；接近独角兽标记
    approximationNotes: >-
      P/B 倍数为分析师估算，来自 Five Star 与 Veritas 的 ROTA 差距及观察到的 P/B 缺口。根据同业 ROTA/P/B 关系，假设 ROTA 每改善 50 bps 可带动 P/B 扩张约
      0.3–0.5x。股权价值按 2025 年 12 月净资产 ₹3,004 crore 计算。
