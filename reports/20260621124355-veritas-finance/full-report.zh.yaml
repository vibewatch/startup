      - number: '1.3'
        title: 资本结构与投资者
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Veritas Finance 已通过七轮累计募集 ₹1,835 crore 股权：₹31 crore（FY16，Sarva Capital 和 Caspian Impact）、₹120
              crore（FY18，CDC Group 和 Lok Capital）、₹260 crore（FY19，Norwest Venture Partners 和既有投资者）、₹350
              crore（FY20，Kedaara Capital 和既有投资者）、₹440 crore（FY22，既有投资者）、 ₹492 crore（FY24，Multiples PE 领投的 ₹1,200 crore
              融资，Avendus FLF 参与；其中 ₹400 crore 为 primary）， 以及 ₹141 crore（FY25）。2024 年 9 月，Lok Capital、Evolvence 和 Avendus
              FLF 参与 ₹240 crore 内部轮，部分转换此前发行的部分缴款股份， 隐含估值约 ₹8,500 crore（约 $1 billion），让 Veritas 跻身独角兽。

              截至 2025 年 3 月，按完全稀释口径，Norwest Venture Partners X 是最大股东，持股 21.23%；其后为 Multiples PE 及关联方 15.97%、Kedaara
              Capital 14.83%、Lok Capital 及关联方 13.86%、BII（British International Investment）10.16%、Avendus FLF 2.85%。2025
              年 1 月 18 日，Veritas 向 SEBI 递交 DRHP，拟 IPO ₹2,800 crore（₹600 crore 新股发行，₹2,200 crore 由
              Norwest、Kedaara、BII、Lok Capital 和 Growth Catalyst Partners 出售）。SEBI 于 2025 年 4 月 29 日授予观察意见，拟在 BSE 和 NSE
              上市；截至本报告运行日，IPO 尚未启动。
