      - number: '7.6'
        title: IPO 时点、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 于 2025 年 4 月 29 日获得 SEBI 对 ₹2,800 crore IPO（₹600 crore 新股发行、₹2,200 crore OFS）的批准，有效期 12
              个月。截至 2026 年 6 月 21 日，公司尚未宣布 IPO 开放日期或价格区间，意味着 SEBI 批准窗口已过期或进入最后几天。如果公司未在窗口到期前发行，就必须重新申请 SEBI
              批准——重新进入最初耗时约三个月的审核流程——可能进一步推迟资本注入，并延长 PE 投资者退出压力。OFS 部分占总发行 78.6%，传递的信号更像是早期投资者退出意图，而非增长资本部署。

              没有可识别发起人抬高治理风险。D. Arulmany（创始人兼 MD/CEO，25+ 年经验）及其亲属按完全稀释口径仅持有 9.56%，而 PE
              投资者（Norwest、Kedaara、Multiples、BII、Lok Capital）合计控制多数股权。PE 主导的股权结构在 IPO 后会带来一致性风险：无法在 OFS 中完全出售的 PE
              赞助方将保留大额持股，可能压制公众流通盘。DRHP 将公司对 D. Arulmany 和高级管理团队的依赖披露为重大风险；H1FY25 KMP 流失率为 11.76%，绝对水平虽低，但考虑到农村地区 MSME
              贷款高度定制、依赖关系，仍值得监控。
