              每条新产品线都复用分支网络、催收团队、数据湖和 LMS 基础设施，从而限制边际固定成本。二手车贷款借助服务农村商业借款人的同一网点覆盖和一线员工关系，首个运营年度内 AUM 超过 ₹300
