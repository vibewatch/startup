  - id: FV003
    title: 估值区间 — 熊市 / 基准 / 牛市股权价值估算
    type: range
    layout: wide
    summary: 区间图展示 Veritas Finance 在公开市场出清时的低位、基准和高位股权价值估算，并锚定 2025 年 12 月净资产。
    data:
      items:
        - label: 熊市情景
          low: 4800
          high: 5760
          note: P/B 1.5–1.8x；NNPA > 2%，ROTA < 3%，CARE 下调
        - label: 基准情景
          low: 6400
          high: 8000
          note: P/B 2.0–2.5x；ROTA 3.0–3.5%，GNPA 受控；最可能
        - label: 牛市情景
          low: 8960
          high: 10240
          note: P/B 2.8–3.2x；ROTA > 3.5%，GNPA 改善，AUM 加速
    approximationNotes: >-
      区间按 FY26E 净资产约 ₹3,200 crore 计算。熊市区间基于 ₹3,200 crore：1.5x = ₹4,800 crore，1.8x = ₹5,760 crore。基准：2.0x = ₹6,400
      crore，2.5x = ₹8,000 crore。牛市：2.8x = ₹8,960 crore，3.2x = ₹10,240 crore。以上为指示性区间，不构成投资建议。独角兽标记（2024 年 9 月）为 ₹8,500
      crore，落在基准上沿至牛市下沿之间。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV042
      - CV043
