  - id: TE002
    title: 工作流 / 用例表——按产品划分的贷款生命周期
    columns:
      - 用户任务
      - 当前替代方案（Veritas 之前）
      - Veritas 方案
      - 可衡量收益
      - 限制
    rows:
      - - 获取有抵押 MSME 商业贷款
        - 到银行网点办理；材料繁重；需要信用历史；非正规企业很可能被拒
        - 网点实地走访 + OCR KYC + AI 评分卡 + 分行信贷审批；平均 TAT 5–7 天
        - 100% 数字化获客；大规模服务首次借款人；FY22–FY24 借款人基数 CAGR 56.68%
        - 每笔贷款都要人工实地走访，形成成本底线；票据极小的贷款无法经济扩张
      - - 为房屋建设或购买融资
        - 银行按揭对收入和产权材料要求严格
        - 经济适用住房贷款评估家庭收入；期限最长 15 年；覆盖部分建成房产
        - 覆盖非正规收入的服务不足人群；FY24 催收效率 99.97%
        - 住房分部需要外部法律 / 技术估值；拉长 TAT 并增加第三方风险
      - - 购买二手商用车
        - 向民间放贷人借高息、结构松散的钱；或由经销商安排、承保有限的融资
        - 以车辆作抵押的二手 CV 贷款；分行信贷员核验车辆；通过 e-NACH 正式还款
        - 建立正式信用记录；结构化定价低于市场，收益率约 19.25%
        - 沉淀不足 2 年；车辆折旧风险；农村市场的收回和转售仍不确定
      - - 获取短期营运资金
        - 轮转信用会、民间放贷人，或供应商提供的商户赊账
        - 无抵押营运资金贷款，按周还款；客户经理每周拜访
        - 放款快；结构化还款建立信用记录；27.03% 收益率补偿无抵押风险
        - 每周实地催收运营强度高；NPA 率最高；现金催收有舞弊风险
      - - 偿还贷款分期
        - 到网点办理、开远期支票，或交现金
        - e-NACH 自动扣款，或通过 QR 码、个性化链接、WhatsApp 请求发起 UPI 付款；短信回执
        - 截至 H1FY25，89.61% 催收为数字化；短信回执为每笔付款留下审计轨迹
        - 仍有 10.39% 依赖现金；扣款失败追回需要 OTP 验证的实地催收
    notes: 工作流描述综合 DRHP（第 240–248 页）、FY25 年报、CARE Ratings 报告和 businessindia.co 分析。收益指标为公司截至 2024 年 9 月 30 日披露的数据，除非另有说明。
