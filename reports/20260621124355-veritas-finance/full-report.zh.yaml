      - number: '7.4'
        title: 运营与执行风险
        blocks:
          - type: paragraph
            body: >-
              Veritas 目标规模下的一线运营会引入叠加执行风险。H1FY25 现金催收仍占总催收 10.39%（FY22 为 47.40%），公司披露期内发生两起员工挪用现金欺诈，合计损失 ₹1.01
              million。虽然事件孤立，但反映出让农村 / 半城市催收队伍转向完全数字合规的内在难度。H1FY25 员工流失率为 32.09%，FY24 一度高达 58.50%，意味着公司在分支数量年增 17%+
              的同时，必须不断培训替补的一线客户岗位员工。

              技术侧，Veritas 使用第三方供应商软件处理贷款获客和 NPA 管理——与 PSU 银行使用的平台相同——降低开发风险，但把单一供应商栈变成集中点。公司已获 ISO 27001 认证，且截至 2024 年 9
              月未报告已知数据泄露。RBI 的 IT Governance Directions（2023 年 11 月）对 IT 风险管理提出正式治理要求，Veritas 必须持续遵守。2024 年 9 月 DSA
              合作伙伴贡献 11.33% AUM；若 DSA 承保质量恶化，组合数据不会立刻显现，形成滞后识别风险。

              向 Tamil Nadu 以外州份——Bihar、Chhattisgarh、Jharkhand——扩张，会引入不熟悉的本地法律和催收基础设施。不到两年内从 434 个分支（FY24）扩至 512 个（2025 年
              12 月），并覆盖 11 个州，需要同时建设信用、法务和催收能力；在可比同业中，每一项都曾推动员工流失率上升。
