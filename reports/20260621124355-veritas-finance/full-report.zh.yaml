      - number: '4.2'
        title: 盈利能力与经营表现
        blocks:
          - type: paragraph
            body: >-
              Veritas 自 FY19 起每年盈利，ROTA 始终高于 3%——这是 CARE Ratings 用作负面触发的门槛。FY25，OCI 前 PAT 为 ₹295.11 crore（OCI 后：₹292.19
              crore），较 FY24 的 ₹245.05 crore 增长 20.4%，延续了从 FY20 ₹33 crore 开始的五年利润轨迹。FY25 PBT 利润率从总收入的 28.90% 压缩至
              24.93%，主因是信用成本增长 90% 至 ₹171 crore（FY24：₹90 crore），而总收入只增长 39.5%。融资成本激增 53.6% 至 ₹483 crore，反映 AUM
              增长和融资利差走阔。

              抵消上述压力的是，运营费用率从 FY24 的 7.45% 改善至 FY25 的 6.94%；随着分支网络扩至 508 家、员工增至 7,796 人， 经营杠杆开始显现。ROTA 稳定在 3.91–3.98%（AR
              与 CARE 计算公式不同），ROE 为 11.43–11.52%，均略低于 FY24 峰值 4.67–4.70% 和 12.27–12.50%。进入 FY26 后轨迹偏软：Q1FY26（未经审计）PAT 为
              ₹62 crore，年化 ROTA 约 2.9%，由无抵押组合信用成本上升驱动。Q3FY26 明显改善，PAT 达 ₹82 crore（总收入 ₹462 crore）；FY26 前九个月 PAT 为 ₹211
              crore，高于 FY25 前九个月的 ₹202 crore。到 2025 年 12 月，净资产达到 ₹3,004 crore。Basic EPS 从 ₹19.04（FY24）升至
              ₹22.44（FY25），FY26 前九个月为 ₹16.08。
