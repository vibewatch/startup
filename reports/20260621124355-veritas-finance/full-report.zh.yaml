    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的 Veritas Finance 七项投资维度评分，每项 1–5 分。
    data:
      items:
        - label: 市场机会
          value: 4
          note: MSME 信贷缺口 ₹530 Bn；NBFC AUM 到 FY26 目标 ₹5.3 lakh crore；TAM 大且仍在增长
        - label: 业务壁垒 / 验证
          value: 4
          note: AUM 5 年 CAGR 41%；增长最快的 MSME NBFC 第 1 名；AA- 评级；509 家分支
        - label: 竞争护城河
          value: 3
          note: 分支密度耐久，但难挡 Five Star 扩张；没有专有数据护城河
        - label: 单位经济
          value: 2
          note: ROTA 3.10%（9MFY26）；ROE 11.5%（FY25）；信用成本 2.31%；成本收入比 35.2% — 全部低于同业中位数
        - label: 风险画像
          value: 2
          note: GNPA 2.89%，NNPA 1.58%（2025 年 12 月）；43% AUM 在 Tamil Nadu；接近 CARE 触发线；IPO 时间不确定
        - label: 估值
          value: 2
          note: 独角兽标记对应 P/B 2.83x（2025 年 12 月账面）；合理 P/B 2.0–2.5x；较公允价值溢价 12–37%
        - label: 证据质量
          value: 3
          note: 可用 DRHP + CARE + AR FY25；FY26 审计数据尚未发布；Q3FY26 未审计数据可用
    approximationNotes: 评分采用 1–5 分制（5 = 最优）。分数是分析师基于本章及第 1–7 章汇总证据作出的判断，并非机械计算；FY26 审计财务发布后应更新。
    claimRefs:
      - CV022
      - CV023
      - CV016
      - CV027
      - CV028
      - CV040
appendices:
  - id: A
    title: 估值情景与基准锚点
    blocks:
      - type: paragraph
        body: >-
          三种估值情景均以 2025 年 12 月净资产 ₹3,004 crore 为锚，并套用 P/B 倍数建模：熊市（₹4,506 crore，P/B 1.5x）、基准（₹6,000–7,500 crore，P/B
          2.0–2.5x）和牛市（₹9,012 crore，P/B 3.0x，要求 ROTA 恢复至 ≥4.5% 且 GNPA 低于 2.0%）。₹8,500 crore 的独角兽参考标记（约为 2025 年 12 月账面价值的
          2.83x）位于基准与牛市之间，与估值偏高的判断一致。若以 P/B 2.0x 或更低（≤₹6,008 crore）进入，熊市情景下才有足够安全边际。
        claimRefs:
          - CV001
          - CV002
          - CV003
          - CV004
          - CV027
