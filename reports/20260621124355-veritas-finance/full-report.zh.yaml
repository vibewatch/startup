  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与产品范围
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 的真实市场不是笼统的「印度 fintech」或整个「MSME 信贷」。它可服务的人群，是印度农村和半城市地区的自雇微型与小型企业主：
              拥有或占用住宅房产、非正规经营、缺少正式收入文件，长期被银行信贷排除在外。公司主要通过有抵押 MSME 小企业贷款 （房产支持，₹0.3–50 lakh
              票面）、平价住房建设贷款（LAP-Construction）、自住住房贷款，以及 FY24 起推出的二手商用车融资服务这些借款人。 营运资金贷款（无抵押）是有意控制的邻近业务，占 AUM 低于
              10%，用来管理信用风险。

              被排除的边界同样重要。Veritas 不服务大型企业、受薪雇员、都市专业借款人、消费贷款、黄金贷款、微金融团体贷款，或有完整财务文件、可进入银行体系的企业。 它的竞争对手不是 Axis Bank 的 MSME
              部门，而是本地放贷人、区域合作社，以及该借款群体在缺少正式渠道时依赖的非正规贸易信贷。 现状替代品包括家庭贷款、chit funds，以及无抵押数字贷款机构；后者利率明显更高，但不要求抵押物。

              地理边界也很清楚。Veritas 83% 的分支机构和 89% 的 AUM 集中在 Tamil Nadu、Andhra Pradesh、Telangana、Karnataka 和 West Bengal。公司正向
              Uttar Pradesh、Bihar、Chhattisgarh 等农村人口庞大的邦扩张。这种地理聚焦不是偶然： 它来自十年来在 Tamil Nadu 半城市 MSME
              地带打磨出的外勤信贷承销能力，也意味着把该模式复制到陌生市场时存在运营风险。

              平价住房邻近业务（截至 2025 年 3 月占 AUM 19%）对应一个相关但不同的市场：建设或购买首套住房的家庭，往往也是同一批会拿 MSME 经营贷款的借款人。二手 CV 板块（占 AUM
              4%）服务半城市和农村走廊中的商用车个体经营者；在这个细分市场，NBFC 占优，因为银行不太愿意承销现金收入经营者和二手车抵押物。
