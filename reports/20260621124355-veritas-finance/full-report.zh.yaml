      - number: '3.5'
        title: 护城河耐久度与替代风险
        blocks:
          - type: paragraph
            body: >-
              Veritas 的竞争优势来自几项组合：外勤密集型承销（销售、信贷、技术、法律和催收团队均以分支机构为基础）、在大型 NBFC 服务不足的半城市市场具备地理密度，
              以及能降低薄信用档案人群选择风险的分支加关系模式。关键护城河维度包括：（1）本地借款人评估的信息优势，靠实地走访经营场所和收入交叉验证获得， 中央信用评分模型很难复制；（2）Tier III 和 IV
              市场的分支网络密度，需要多年投入和本地招聘才能建立；（3）监管资本充足率 （FY25 CAR 37.82%），支撑持续增长且短期不必股权稀释。

              主要替代风险来自两个方向。第一，Five Star 在南部的主导地位和持续地理扩张（FY22–H1FY25 分支机构 CAGR 为 37%，Veritas 为 28%） 最终可能侵蚀 Veritas 在
              Tamil Nadu 和 Andhra Pradesh 的本地关系优势；这两个市场也是双方竞争最激烈的地方。第二，UGRO Capital 的 Emerging Market LAP 扩张方向上正靠近
              Veritas 的地理市场，并采用更低成本的共同放贷结构；如果 UGRO 成功用 DataTech 模型把承销流程商品化， Veritas 将面临利润率压缩。

              ₹2–10 lakh 有抵押 MSME LAP 空间的商品化风险真实存在，但被外勤承销的结构复杂性压低。不同于标准化消费信贷，面向非正规部门借款人的 MSME LAP
              需要本地知识；对没有征信历史的首贷借款人，算法模型复制效果很弱。不利证据包括 FY24 后 Veritas GNPA 从 1.79% 升至 2.21% （FY25），由无抵押板块驱动；Five Star 的
              Gross Stage 3 到 2025 年 6 月也升至 2.5%——说明行业资产质量整体放缓，对任何既有玩家都不是利好。 借款人转换成本中等：已建立 LAP
              关系且满意的借款人，考虑到交易成本和重复信用评估，转贷动力有限；但住房贷款再融资方带来的余额转移风险， 是 DRHP 记录过的风险。总体看，Veritas
              在既有地理市场护城河耐久，但在新进入、成熟度不足的市场更窄。
