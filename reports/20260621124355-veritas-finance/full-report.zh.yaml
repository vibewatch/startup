      - number: '5.5'
        title: 差异化、路线图与运营风险
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 产品与技术模型的核心差异化，在于把一线情报与数据科学整合起来：自有信用评分卡完全内部开发（FY22 推出），每名借款人捕捉 409+ 个数据点，包括定性一线观察，并用 AI/ML
              模型把社区层面的经济信号转成风险分，这是银行纯文件模型难以复制的。基于风险的定价引擎通过 Veritas Prime Lending
              Rate（VPLR）框架，将借款人信用分输出连接到放贷利率，使公司能在贷款层面管理盈利，而不是只在产品分部层面管理。

              十年产品演进显示出有纪律的节奏：公司前七年专注打磨 Rural Business Loan 模型并建设分支基础设施，然后才推出 Home Loans（FY23）和 Used CV
              Loans（FY24）。每个新产品都复用现有分支网络、催收团队和数据湖架构，限制边际固定成本上升。二手车融资产品首个完整年度内 AUM 已达 ₹300+ crore，验证了渠道模型跨资产类别的适配性。

              关键运营风险和限制实质性存在：（i）依赖第三方 LOS/LMS，意味着供应商故障可能打断整个获客和服务管线；（ii）现金催收占账簿 10.39%，让公司暴露于员工欺诈，DRHP
              披露了两起事件；（iii）用于信用评估的人工实地拜访模型虽能提高质量，但为每笔贷款形成结构性成本底线，限制极小票面客户的可覆盖范围；（iv）地域集中（83%+
              放款在三个南部州）意味着进入新州时，技术投入难以轻易替代密集本地网点；（v）Used CV 贷款和住房贷款账簿还没有完整信用周期，也尚未提供统计上稳定的违约数据用于模型校准。公司公布的路线图——Vision
              2028，目标 ₹10,000 crore AUM——依赖持续开设分支和继续产品多元化，技术主要扮演支撑角色。
