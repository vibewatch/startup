      - number: '3.4'
        title: 现状与非正规替代品
        blocks:
          - type: paragraph
            body: >-
              对 Veritas 而言，最具结构性意义的竞争替代者不是正式 NBFC，而是目前服务农村和半城市 MSME 大部分需求的非正规信贷渠道。 本地放贷人——印度农村主导性替代品——年化收费
              36–50%+，不要求文件，几小时内放款。它们的竞争优势是速度、私人关系和零文书； 劣势是掠夺性定价，且借款人缺少监管保护。因此，与非正规基准相比，Veritas 22–23%
              的收益率并不高：它相当于相对放贷人的折价， 同时仍远高于 PSB 利率底线。

              Chit funds 是轮转储蓄和信贷协会，在南印度（Tamil Nadu、Andhra Pradesh、Telangana）尤其普遍，既是非正规 MSME 经营者的储蓄工具， 也是信贷工具。chit fund
              运营者对资金池收取折扣（通常为本金池 5–30%），并分摊给全组；按资金用途计算，有效信贷成本在 20–30% 区间， 与 Veritas IRR 相当，但不要求抵押。缺少监管监督和社会群体动态，让 chit
              funds 成为文化嵌入式替代品；正式 NBFC 要替代它们， 不能只靠价格，还要证明便利性和产品匹配。

              PSB 和定期商业银行是正式低成本替代者；对文件完备的借款人，MSME LAP 年利率约从 8–10.5% 起（SBI、PNB、Indian Bank）。
              但它们的文件要求——ITR、正式资产负债表、注册企业主体——系统性排除了现金型、非正式文件化的 MSME 群体，而这正是 Veritas 的核心借款人池。 正式化缺口是结构性壁垒，保护 Veritas 相对
              PSB 竞争的收益率溢价。

              自有资金（内部现金流）和家庭资金仍是许多微型企业的首选信贷来源。没有正式定价、没有抵押、交易成本为零——但信贷额度也有硬上限， 企业增长受制于自生成现金。Veritas
              在增长诉求超过内部资本时捕获借款人，这让该场景成为从非正规信贷转向正式信贷的主要漏斗。
