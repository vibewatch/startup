      - number: '2.2'
        title: 市场规模测算——多重视角
        blocks:
          - type: paragraph
            body: >-
              没有一个权威数字能完整覆盖 Veritas 的服务市场；要诚实测算规模，必须同时使用多个方法视角。三个独立方法指向同一个结论：机会很大，但并非没有边界。

              视角 1——MSME 信贷池。截至 2025 年 3 月，MSME 未偿信贷总额已超过 ₹40 trillion，同比增长 20%（CRIF High Mark，2025 年 6 月）。总债务需求为 ₹95.6
              lakh crore（₹95.6 trillion），正式供给只有 ₹32.4 lakh crore， 留下 ₹18.3 lakh crore 的可服务缺口（CARE
              Ratings）。这是最宽的规模视角——它高估了 Veritas 的可服务市场，因为其中大部分是正式文件不足的企业， 即使由外勤型贷款机构服务也会有难度。DRHP 常引用的 ₹103 trillion
              信贷缺口（CRISIL，FY24 预测）采用不同方法 （总债务需求包括贸易信贷和非正规债务），不能直接与 CARE 的正式缺口估算相比；两者在此作为相互矛盾但合理的规模框架保留。

              视角 2——NBFC micro-LAP 与有抵押 MSME。Veritas 的核心产品是微型房产抵押贷款（micro-Loan Against Property，票面 ≤₹10 lakh）。 这一具体板块从
              FY22 到 2024 年 9 月由 ₹1 lakh crore 增至 ₹1.6 lakh crore，增长 60%（CARE）。NBFC 在 micro-LAP 中持有 45%
              市场份额，远高于私营银行（26%）和 PSU 银行（11%）。CARE 预计 NBFC MSME AUM 总额到 FY26 将达到 ₹5.3 lakh crore，高于 FY24 的 ₹3.7 lakh
              crore，年内增长预测为 20%。截至 2025 年 3 月， Veritas AUM 为 ₹7,349 crore，不到估算 NBFC MSME 账簿的 1.7%；即使市场不扩张，渗透空间也很大。

              视角 3——可服务可得市场（SAM）构造。把范围限定在 Veritas 的 11 邦地理足迹、房产支持产品和 ₹0.3–50 lakh 票面区间后， 可服务池显著收窄。这个精确交集没有独立估算。一个保守构造是：对
              Veritas 运营邦的全国 NBFC micro-LAP 市场应用约 8–12% 份额，得到 ₹12,000–20,000 crore 的 SAM。Veritas 2025 年 6 月 AUM 为 ₹7,477
              crore，意味着在这个狭义构造的 SAM 中渗透率约 37–62%；但 SAM 边界本身依赖不精确的地理切分。

              平价住房邻近业务（AHFC）是单独视角。截至 2024 年 12 月，AHFC AUM 已超过 ₹1.27 lakh crore，9M FY25 增长 14%；ICRA 预计 FY25 和 FY26 增长
              20–22%。Veritas 的住房贷款（占 AUM 19%，₹1,396 crore）只是该市场的一小部分。 二手 CV 市场则带来另一个邻近机会。
