      - number: '8.5'
        title: 退出准备度、最终尽调问题与论点破裂触发器
        blocks:
          - type: paragraph
            body: >
              Veritas Finance 的退出准备度并不均衡。监管关口已经通过——SEBI 于 2025 年 4 月 29 日出具 observations，账目已经审计， 五家顶级主承销商已经任命。信用市场也接受公司
              AA- 评级（债券收益率 9.75%，2026 年 11 月到期）。但股权市场关口尚未通过： SEBI 批准后超过 17 个月，仍没有价格区间、手数或上市日期。对一个已获 observations 的主板 IPO
              而言，这非常少见， 说明内部财务轨迹可能尚不适合价格发现，或市场环境被判断为不利。

              ₹2,200 crore OFS——由 Norwest（₹550 crore）、Kedaara（₹550 crore）、BII（₹500 crore）、Lok Capital（₹425 crore） 和
              Growth Catalyst（₹175 crore）分摊——体现 PE 投资人希望在上市时变现大量持仓。对少数股东而言，这构成 IPO 后结构性抛压： 上市后 180
              天内，剩余发起人持股和锁定期到期通常会带来卖压。话虽如此，在 2023 年 ₹1,200 crore Multiples 轮或更早进入的 PE 投资人，即便公开市场出清价只有 ₹5,500–7,000
              crore，仍可实现 2–3x 回报，因此有空间接受相对独角兽估值的折价。

              截至 2026 年 6 月，最关键的最终尽调事项包括：（a）FY26 全年经审计财务数据，确认 ROTA 是稳定还是进一步恶化； （b）Q4FY26 NPA 变动和核销时间表，评估 NNPA 是否已突破 CARE
              2% 触发线；（c）包含价格区间和 IPO 后净资产的 RHP（Red Herring Prospectus）；（d）IPO 后 AUM 增长计划和资本投放安排，以证明新股发行募集资金的用途合理。
