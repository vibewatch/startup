  - id: TE003
    title: 技术 / 运营架构——逐层视图
    columns:
      - 层级 / 流程
      - 在放贷中的作用
      - 关键依赖
      - 风险
    rows:
      - - 贷款发起系统（LOS）
        - 管理从线索到放款的流程：KYC、信用评分、审批权限路由、电子签名、文件库
        - 第三方供应商软件（印度 PSU 银行和主要 NBFC 使用）
        - 供应商集中；定制受限；若供应商改变条款，迁移有风险
      - - 贷款管理系统（LMS）
        - 放款后服务：EMI 跟踪、扣款失败监控、NPA 分类、分行看板
        - 第三方供应商；每项贷款业务使用独立的产品专属 LMS 实例
        - 系统停机会打断催收跟进；跨产品线版本升级协调有风险
      - - AI/ML 信用评分卡
        - 处理 409+ 个数据点；分配风险分；决定定价层级和审批权限级别
        - 内部开发（FY22 推出）；外部数据依赖信用局 API；实地人员录入数据
        - 借款人人群变化会带来模型漂移；贷款拒绝争议中存在可解释性缺口；依赖数据质量
      - - e-NACH / UPI 催收通道
        - 通过 NACH 设置自动扣款授权；用 UPI QR、WhatsApp、个性化链接还款；OTP 防欺诈
        - NPCI 基础设施（NACH/UPI）；各银行授权登记系统；农村地区移动连接
        - NACH 扣款失败率约 11%（推算）；UPI 系统中断会影响催收；农村连接存在缺口
      - - 数据湖与分析平台
        - 汇总 LOS、LMS、财务和 HR 系统数据；支撑从分行到邦的看板；驱动违约预测算法
        - 多云基础设施；内部数据管道；云供应商 SLA
        - 源系统分化会造成数据碎片；依赖云供应商；PII 数据集中风险
    notes: >-
      架构基于 DRHP（第 228–245 页）、FY25 年报（技术章节）和 CARE Ratings 2025 年 1 月报告（MIS/LMS 描述）。第三方供应商身份未公开披露。扣款失败率估算来自 92.80% 的
      NACH/UPI 覆盖率减去披露的 89.61% 数字催收效率。
