      - number: '8.2'
        title: 融资背景与私募市场参照点
        blocks:
          - type: paragraph
            body: >
              2024 年 9 月，Veritas Finance 从现有投资人 Lok Capital、Evolvence 和 Avendus Future Leaders Fund 完成 ₹240 crore
              内部轮融资。该交易按约 ₹8,500 crore 投前估值（按当时汇率约 $1.0–1.1 billion）定价，使公司进入独角兽行列。 该轮隐含 P/B 约为 2024 年 9 月净资产 ₹2,610
              crore 的 3.25x。

              这个独角兽估值只能作为私募市场参照点，不能视为公开市场出清价，原因有三。第一，现有投资人的内部轮融资没有独立第三方价格发现的严苛约束； 管理集中持仓的 PE 投资人有动力按上一轮或略高水平标记估值。第二，2024
              年 9 月融资发生在随后 ROTA（从约 4% 降至约 3.1%） 和 GNPA（从 1.79% 升至 2.89%）恶化之前，支撑溢价的基本面已经明显削弱。第三，相比公开市场可比公司，Pre-IPO 股权通常有
              20–30% 流动性折价，反映锁定风险和退出不确定性；而在 Veritas Finance 案例中，IPO 启动已比原目标晚了 17 个多月， 放大了这一风险。

              IPO 前累计股权融资约 ₹1,835 crore，覆盖七轮融资（FY16–FY24），另有 2024 年 9 月内部轮 ₹240 crore。2023 年 7 月由 Multiples PE 领投的
              ₹1,200 crore 融资（独角兽估值前）隐含投前估值明显低于独角兽标记，说明 2023 年中至 2024 年 9 月 内部轮之间估值约上调 40–50%；如今盈利能力侵蚀已部分抹去这段升值。₹600
              crore IPO 新股发行将补充 Tier-1 资本， 支持 IPO 后约 ₹10,000 crore 的 AUM 目标，剩余 ₹2,200 crore 则对应投资人退出。
