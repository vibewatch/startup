  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分群与借款人画像
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 是零售 NBFC；FY2025 的 211,389
              名借款人全部是个人或微小企业，而非公司客户。借款人群体覆盖四种产品原型，它们在收入水平、抵押品类型、文件可得性和现金流模式上差异很大。

              Rural Business Loans（FY2025 AUM 56%）构成核心业务。目标借款人是位于农村和半城市地区、月收入 ₹25,000–₹80,000
              的自雇微小企业——商贩、小店主、手工业者、小型制造商和居家劳动者。这些客户通常缺少 GST 申报、ITR 或审计报表等正式收入文件。贷款发放时平均经营年限约 11.93
              年，说明企业虽非正规，但已较成熟。贷款金额从 ₹30,000 到 ₹50 lakh 不等，多数落在 ₹2–5 lakh 区间；抵押物为自住房产，贷款价值比（LTV）限制在困境资产价值的 40–50%
              以下。LAP-Construction（LAP-C）贷款子分部（占 AUM 14%）服务同一类借款人，但用途是为自有地块上的自建房融资，而非商业营运资金。

              Affordable Home Loans（AUM 19%）面向低收入自雇和受薪借款人，以及在 Tier-1 和 Tier-2 城市寻求 5 到 15 年住房融资的非居民印度人。Used Commercial
              Vehicle Loans（AUM 4%）于 FY2024 推出，服务半城市和农村地区的运输经营者、车主经营者，为其购买小型和轻型商用车作为生计资产提供三年期有抵押融资。Working Capital
              Loans（AUM 7%；无抵押）面向城市和半城市微型企业——小店主、餐厅业主、五金店主——这些客户有每日现金流和一定既往信用记录；贷款期限一到三年，按周还款。

              各分部共同的借款人特征，是正式信用历史有限或没有（「new-to-credit」）、文件极少，并依赖 Veritas 分支信用经理的一线收入核验，而不是单靠征信分。DRHP 披露，截至 2024 年 9
              月，24.72% 的贷款账簿由首贷借款人构成，凸显了该业务的金融普惠取向。
