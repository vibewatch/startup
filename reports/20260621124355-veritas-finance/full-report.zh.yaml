      - number: '5.2'
        title: 承保架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 的承保模型刻意区别于依赖文件和评分的银行贷款。核心思路不是把正式文件或征信分数作为第一道门槛，而是靠现场核验评估真实创收能力和还款意愿。分支信用经理执行自有的「triple AAA
              filter」：（i）住址核查，验证 KYC
              文件并收集定性生活方式信息；（ii）经营场所核查，确认借款人业务性质，目测客流和库存，并通过带地理标签的照片收集邻居推荐；（iii）房产核查，由内部法务和技术团队从权属、技术参数和市场价值角度评估拟抵押物。

              三项核查进入信用评分卡，每次借款人评估都会数字化记录 409 个数据点。每个数据点都用信用经理员工 ID
              电子封存和签名，防止篡改。评分卡给出风险分，进入基于规则引擎的信贷审批流程，决定定价权限和放款审批。不同贷款业务（Rural Business 与 Working
              Capital）在同一框架下使用不同数据点和权重。

              信贷审批采用两到四级 maker-checker 层级：₹0.5 million 以内贷款需要两级（销售经理 + 分支经理）；₹1–2.5 million 需要第三级（信用经理）；₹2.5 million
              及以上上升到集群或区域信用经理。授权按风险校准，防止较大敞口的决策集中在分支层面。

              批准后，借款人在放款前注册 e-NACH 授权，确保 92.80%
              的有抵押借款人拥有自动还款路径。销售经理在贷款初期继续负责催收，将获客质量与还款结果绑定。这套运营设计依赖人判断和一线存在，同时用数字评分卡固化流程；它既是信用质量差异化的主要来源，也是单网点可扩展性的主要约束。
