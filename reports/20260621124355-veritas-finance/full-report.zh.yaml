      - - Udyam / GST / TREDS 正规化生态
        - 驱动
        - 当前，正在加速
        - 更多借款人留下数字化记录；降低收入文件负担
        - 评估 Veritas 借款人在放款时拥有 Udyam 或 GST 注册的数量
      - - PMAY 住房计划 — 农村和城市
        - 驱动
        - 当前；PMAY 2.0 已生效
        - 扩大 LAP-C 和住房贷款可寻址客群；为首套房买家提供补贴
        - 确定住房贷款组合中获得 PMAY 补贴的比例；衡量对还款的影响
