      - number: '3.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: CRISIL 同业组中 AUM 增长最快
            body: >-
              FY22 至 FY24，Veritas Finance 在 CRISIL MI&A 识别的所有同业中实现最高 AUM CAGR（62%）和放款 CAGR（77%）， 超过 Five
              Star（38%）、SBFC（46%）和 Aptus（23%）。这说明它在半城市 LAP 利基中捕获需求能力强，分支网络部署有效。
            calloutType: strength
            claimRefs:
              - CP002
          - type: callout
            title: 与 Five Star 的盈利差距是结构性担忧
            body: >-
              Veritas RoA 为 4.7%（FY24）和 3.98%（FY25），明显弱于 Five Star 的 8.2%（FY24）；驱动因素是信用成本接近 3 倍（2.0% vs 0.7%），opex
              比率也比最接近同业高 10 个百分点。除非 Veritas 的东印度和新地理区域快速成熟、信用成本正常化， 否则 RoA 差距会限制其以 Five Star 的节奏自我融资增长。
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP039
          - type: callout
            title: 非正规放贷人才是真正既有者
            body: >-
              对 Veritas 在印度农村和半城市的目标借款人，最相关的竞争比较不是 Five Star 或 SBFC，而是本地放贷人：年化收费 36–50%+， 无需文书、当天放款。Veritas 22–23%
              的收益率相对非正规基准确实有折扣，但要赢得借款人，还必须证明速度、便利性和关系信任。 因此，分支密度和本地员工稳定性——而不是技术——才是 Veritas 核心板块的主要护城河。
