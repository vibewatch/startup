      - number: '6.4'
        title: 借款人经济性、痛点与关系模型
        blocks:
          - type: paragraph
            body: >-
              Veritas 借款人与银行标准零售客户在经济特征上不同。农村商业借款人月收入在 ₹25,000 至 ₹80,000
              之间，通常来自贸易周期、季节性农业相关需求或非正规服务，收入节奏不稳定。文件稀缺：多数借款人没有 ITR、GST 申报或审计报表。公司 DRHP
              明确将借款人缺乏正式文件、信用历史有限或缺失、就业非正规、地理位置偏远列为定义性特征。这类借款人可用的非正规替代品——放贷人、轮转储蓄小组、亲友贷款——利率通常远高于 Veritas 的 20–24%
              收益率区间，且没有结构化期限。

              Veritas 用自有「triple AAA」过滤器填补承保缺口：assessed income（通过家庭和经营场所拜访）、attitude（邻居推荐和社区声誉）和 asset
              creation（抵押品文件）。信用评估数字化收集 409 个数据点，并运行两套机器学习评分卡模型（一套用于有抵押借款人，一套用于无抵押借款人），从中加权 15
              个关键风险变量。结果是一个风险分，驱动决策权限和利率定价。Rural Business Loan 借款人发放时平均经营年限约 11.93
              年，明显高于初创企业中位年龄，说明公司瞄准成熟微型企业而非初创企业，从而降低信用风险。

              British International Investment（BII）性别影响案例研究记录，Veritas 专门面向女性创业者推出「Dhana Shakti」产品，使女性借款人在 2023 年 3 月至
              2024 年 3 月增长 60%（从 19,000 增至 30,600）。2022 年女性在借款人基数中的占比停滞在 16%；产品推出和面向 300
              名信贷员的性别敏感度培训扭转了趋势。这显示公司能在现有低文件、半农村原型内有效扩展客户分群。

              催收依赖 ACH/e-NACH 授权（截至 2024 年 9 月，92.80% 的有抵押借款人已注册）、UPI，以及支持本地语言的 Veritas 自助移动应用。客户经理对 working capital
              借款人进行周度拜访，对有抵押借款人进行月度 EMI 监控，构成主要逾期预防机制。数字催收从 52.60%（FY2022）提升至 89.61%（2024 年 9 月）；FY2025 实现 100% 数字放款。
