      - number: '4.4'
        title: 资本充足率与融资结构
        blocks:
          - type: paragraph
            body: >-
              按 NBFC 标准看，Veritas 的资产负债表资本充足。FY25 总 CAR 和 Tier-1 CAR 均为 37.82%（FY24：41.49%），明显高于 RBI 要求的 15%（总资本）和
              10%（Tier-1）监管下限。Q1FY26 CAR 回升至 38.34%，反映 Q2FY25 的股权融资。 有形净资产从 ₹2,279 crore（FY24）增至 ₹2,710 crore（FY25），支撑
              2.08x 杠杆率，仍远低于 CARE 设定的 3x 负面触发线。Q3FY26 杠杆率为 2.20x，净资产为 ₹3,004 crore。CARE 指出，当前资本水平足以支持中期增长计划，净杠杆率可维持在 3x
              以下。

              融资结构已有一定分散，但仍偏重银行借款。截至 2025 年 3 月，银行借款占总借款 68.23%（FY24 为 76.53%），NCDs 占 10.10%（其中 2.74% 来自外国投资者），证券化占
              13.80%，NBFC 定期贷款占 4.26%，商业票据用于流动性管理。到 2025 年 6 月，结构大体稳定：银行 67.10%，NCDs 10.08%，证券化 15.54%，NBFC 3.81%。FY25
              总借款为 ₹5,629 crore（FY24：₹3,996 crore），增长 40.9%，与 AUM 增长匹配。

              公司披露流动性充足：未受限现金等价物为 ₹906 crore（FY25）和 ₹846 crore（Q1FY26），另有 ₹171–175 crore 流动投资，以及 ₹264–357 crore
              未使用授信额度。一年内到期的近期债务本金为 ₹1,874 crore（FY25）和 ₹2,061 crore（Q1FY26），可由流动资产加预期 AUM
              自然回款覆盖。公司通过银行定期贷款、NCDs（境内与境外）、向共同基金证券化，以及用于短期流动性的 CP 融资。CARE 将进一步分散融资来源、降低银行借款集中度列为未来资金成本和盈利能力的关键变量。
