      - number: '5.4'
        title: 信任、安全与合规框架
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 作为系统重要性、非吸收存款实体，受印度储备银行 NBFC-ICC（Investment and Credit
              Company）框架监管，需遵守资本充足率、收入确认、资产分类和拨备规范。公司的 KYC 和 AML 合规遵循 RBI 数字贷款指引和 2002 年《防止洗钱法》，通过 Aadhaar 关联 eKYC
              支持无纸化客户入职。信用政策会定期更新，按照适用 RBI 指引定义借款人筛选规范、行业敞口限制和催收程序。

              信息安全方面，公司 FY25 获得数据安全管理体系 ISO 27001:2022 认证，从早期 ISO 27001:2013 标准升级。外部数据安全公司每月执行安全审计。灾备通过实时云备份到云端 DR
              站点管理，防护恶意软件和加密攻击。IT 基础设施采用混合本地部署和多云架构，设计目标是抵御单点故障。

              公司还持有 HR 支持活动 ISO 9001:2015 认证，以及 Human Resource Management 的 ISO 30408:2016 认证。一线数据完整性通过数字封存和每份评分卡提交的员工
              ID 签名执行，防止提交后篡改。CARE Ratings 在 2025 年 6 月和 2024 年 10 月报告中独立审阅后认为，公司内部后台和集中 MIS 系统在备份、灾难恢复和业务连续性方面具备足够保障。
