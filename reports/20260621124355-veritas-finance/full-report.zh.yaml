  - id: FR001
    title: 风险热力图 — Veritas Finance
    type: matrix
    layout: wide
    summary: 将 Veritas Finance 的主要风险按发生可能性（x 轴）和影响程度（y 轴）定位；右上象限代表优先级最高的风险。
    data:
      columns:
        - 不太可能
        - 可能
        - 很可能
        - 极可能
      rows:
        - label: 严重影响
          values:
            - 网络攻击 / 数据泄露
            - 评级下调（NNPA > 2%）
            - GNPA 加速 / 信贷周期
            - Tamil Nadu 系统性冲击
        - label: 高影响
          values:
            - 利率飙升（ALM 违约）
            - 技术 / LMS 供应商故障
            - 银行信贷撤回（融资收紧）
            - 员工流失（分支质量）
        - label: 中等影响
          values:
            - 法律诉讼不利结果
            - DSA 误导销售 / 行为风险
            - 监管合规缺口（RBC Directions）
            - 地域集中（TN 43%）
        - label: 低影响
          values:
            - 声誉 / 社交媒体风险
            - 法定会费延迟
            - IPO 定价 / 市场窗口风险
            - 现金催收欺诈事件
    approximationNotes: 可能性和影响评级是基于 DRHP 披露及 CARE Ratings 评论作出的定性估计；未用历史频率数据校准。
