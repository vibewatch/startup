        - 驱动
        - 新兴，3–5 年周期
        - 扩大农村走廊中需要融资的首次 CV 车主司机群体
        - 评估 Veritas 当前 CV 组合的 GNPA 和账龄；CV 仍处早期
      - - 借款人过度杠杆（MFI 外溢）
        - 约束
        - 近期（FY26 上半年活跃）
        - MFI 承压借款人与 Veritas 借款人同属一个家庭；还款压力上升
        - 按 MFI 压力最高邦（Maharashtra、UP）的敞口拆分 Veritas 早期 DPD
      - - 文件缺口 / 非正式收入
        - 约束
        - 结构性
        - 必须靠网点现场尽调承保；不能只用数字征信局数据
        - 比较开业 < 2 年网点与成熟网点的承保错误率
      - - 银行对 NBFC 融资收紧
        - 约束
        - 当前（截至 2025 年 3 月，同比增速降至 5.9%）
        - 推高资产负债表型 NBFC 的借款成本；挤压 NIM
        - 梳理 Veritas 融资多元化计划；NCD / 证券化份额路径
      - - RBI 放宽 NBFC-MFI 合格资产要求（2025 年 6 月）
