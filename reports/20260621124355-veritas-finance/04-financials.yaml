  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-model
      missingEvidence: "Product-level yield-on-loan (interest rate by segment: MSME, HL, LAP-C, WCL, Vehicle) for FY24 and FY25."
      whyItMatters: "Without yield-on-loan by product, it is impossible to independently model NIM sensitivity to mix shift, repricing risk, or competitive yield compression."
      diligencePath: "Request disaggregated income statements by product segment in the data room; cross-reference with RHP income breakdowns when filed."
      relatedQuestionRefs: [QI007]

    - type: private-evidence-only
      severity: material
      topic: cost-of-funds
      missingEvidence: "Realised cost of funds broken down by borrowing instrument (bank term loan, NCD—domestic and foreign, securitisation, CP) with weighted average rates."
      whyItMatters: "The blended cost of funds drives NIM and ROTA; rising bank spreads or NCD markets could compress margins materially if the instrument-level cost is higher than the blended implied rate."
      diligencePath: "Review borrowing schedule annexures in the Rating Annexures or the forthcoming RHP; model sensitivity to a 50–100 bps cost-of-funds shock."
      relatedQuestionRefs: [QI004]

    - type: enumeration-incomplete
      severity: material
      topic: geographic-concentration
      missingEvidence: "State-level asset quality (GNPA, DPD, write-off rate) for Tamil Nadu vs. other states, to assess whether 43% portfolio concentration carries proportionally higher credit risk."
      whyItMatters: "A localised economic shock (drought, political disruption, state-specific NBFC regulatory action) in Tamil Nadu could disproportionately affect credit cost and capital adequacy."
      diligencePath: "Request state-level portfolio data from management; the RHP geographic section provides AUM distribution but not quality breakdown."
      relatedQuestionRefs: [QI024]
      relatedTableRefs: [TI005]

    - type: stale
      severity: material
      topic: portfolio-seasoning
      missingEvidence: "Cohort-level (vintage-adjusted) default and recovery rates for the FY24–FY25 origination cohort, which represents 47% of the FY25 book."
      whyItMatters: "Historical GNPA ratios are biased toward older seasoned cohorts; the unseasoned recent book likely carries higher latent loss rates than reported trailing-twelve-month GNPA."
      diligencePath: "Commission independent cohort/vintage analysis from management actuarial data; cross-reference DRHP static pool disclosures if available in the RHP."
      relatedQuestionRefs: [QI027]
      relatedTableRefs: [TI005]

    - type: private-evidence-only
      severity: minor
      topic: unit-economics-gap
      missingEvidence: "Customer-level unit economics: customer acquisition cost (CAC), loan-level ROA, and payback period by product segment."
      whyItMatters: "Branch-based NBFC economics differ significantly from digital-only models; understanding per-branch and per-loan economics is needed to stress-test the opex leverage thesis."
      diligencePath: "Request branch-level P&L and productivity data from management in due diligence; comparable peer disclosures (Five Star Business Finance) can provide a proxy benchmark."
      relatedQuestionRefs: [QI011]
      relatedTableRefs: [TI005]

    - type: enumeration-incomplete
      severity: minor
