acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      All five tables contain data from multiple sources spanning different time periods, estimation methodologies, and audit statuses; notes are provided on every table to capture these caveats. The tableNotes warning is acknowledged only to the extent that pure factual snapshot tables (TI001, which contains qualitative product descriptions alongside audited AUM shares) have notes explaining the source conventions rather than quantitative caveats.
  - dimension: unverifiedSource
    reason: >-
      Sources SI019–SI025 and SI027 are supplementary corroboration for sector-level NBFC
      stress data, the SEBI IPO approval confirmation, and the July 2023 fundraise. These
      URLs were fetched during research but the fetch-url trail file is absent from this
      environment; the underlying facts are cross-corroborated by primary sources
      (CARE Ratings reports SO008/SO009, RBI FSR SO023) already in the chapter ledger.
