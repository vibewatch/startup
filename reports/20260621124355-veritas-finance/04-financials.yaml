  - id: financial-verdict-gaps
    title: Financial Verdict and Diligence Blockers
    body: >-
      Veritas Finance presents a compelling financial track record for an NBFC of its size: near-
      decade of profitability, a 41% AUM CAGR over five years, ROTA consistently above 3%, and CAR
      more than double the regulatory floor. The FY25 moderation in ROTA (to ~3.9%) and NIM
      compression (to ~14.7%) are primarily explained by unsecured-segment credit stress and rising
      cost of funds—both acknowledged risks with mitigants already deployed (WCL de-risking,
      tightened underwriting, provisioning build-up). The rapid Q3FY26 PAT recovery (₹82 crore vs.
      ₹62 crore in Q1FY26) suggests the provisioning cycle may be stabilising.

      Material diligence blockers remain. Yield-on-loan by product and realised cost of funds by
      instrument are not granularly disclosed, making precise NIM-build and spread-compression
      modelling difficult. Geographic concentration in Tamil Nadu (43% of AUM at FY25; 43% at
      Q1FY26) persists despite multi-state expansion, creating single-state catastrophe risk.
      Portfolio seasoning is low (47% under one year), meaning historical loss rates may understate
      steady-state credit costs. The planned ₹2,800 crore IPO (₹600 crore fresh issue) will further
      dilute ROE but strengthen the capital base; any delay in IPO execution extends reliance on
      equity raises from existing investors. Capital intensity, opex leverage, and the interplay
      between new-market expansion and asset-quality ramp-up are the key swing factors for the
      medium-term earnings trajectory.
    claimRefs:
      - CI037
      - CI038
      - CI039
      - CI040
      - CI041
      - CI042
