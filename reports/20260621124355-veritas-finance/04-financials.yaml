callouts:
  - calloutType: strength
    title: Profitable NBFC with a Decade-Long Track Record
    body: >-
      Veritas has maintained uninterrupted profitability since FY19, including through COVID. A
      five-year AUM CAGR of 41% and ROTA consistently above 3% are strong signals of disciplined
      growth. CAR of 37.82% provides over 2.5× headroom above the 15% regulatory floor, meaning
      the balance sheet can absorb moderate credit losses without a capital crisis.
    claimRefs:
      - CI001
      - CI029
      - CI030

  - calloutType: risk
    title: Unsecured Segment Driving Credit Cost Spiral
    body: >-
      The unsecured WCL segment (now 6–7% of AUM but historically 10–11%) has disproportionately
      driven delinquencies. GNPA rose from 1.79% to 2.81% in 18 months, and 0+ DPD nearly doubled
      to 6.96% by Q1FY26. The broader NBFC microfinance sector saw total stress reach 15.3% in
      FY25 per ICRA. While Veritas has cut WCL exposure, the legacy book will continue to season
      through FY26, and credit costs are likely to stay elevated above the FY24 trough.
    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI025
      - CI027
      - CI028

  - calloutType: risk
    title: NIM Compression and Rising Cost of Funds
    body: >-
      NIM has compressed by 80–115 bps YoY in FY25 and ROTA has fallen from a peak of ~5.4%
      (FY23) to ~3.9% (FY25) and further to ~2.9% annualised in Q1FY26. Finance costs grew 53.6%
      in FY25 versus AUM growth of 28.4%, a negative leverage spread. The funding profile remains
      68% bank-borrowing dependent; tightening bank credit to NBFCs (bank lending to NBFCs grew
      only 5.9% in March 2025 per RBI FSR) compounds funding cost and availability risk.
    claimRefs:
      - CI009
      - CI011
      - CI032
      - CI033
      - CI035
      - CI036

  - calloutType: recommendation
    title: IPO Proceeds Should Prioritise Tier-1 Capital Build
    body: >-
      The ₹600 crore fresh issue (of the ₹2,800 crore IPO) is earmarked for augmenting the capital
      base for onward lending. Proceeds should specifically target growing the equity buffer before
      AUM growth resumes above 30% annually—keeping gearing well below 2.5x and preventing the
      CAR from approaching the 25–30% range where the cushion may feel thin under a sustained
      NPA-shock scenario.
    claimRefs:
      - CI037
      - CI038
      - CI041
      - CI042

