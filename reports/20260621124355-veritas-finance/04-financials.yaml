  - id: asset-quality-credit-cost
    title: Asset Quality and Credit Cost Trajectory
    body: >-
      Asset quality at Veritas is structurally bifurcated: the secured MSME portfolio (93% of AUM
      at FY25) has held up well with LTVs below 50%, while the unsecured working-capital loan
      segment (WCL) has been the primary source of slippage. GNPA at the consolidated level rose
      from 1.79% (FY24) to 2.21% (FY25) and deteriorated further to 2.81% by June 2025 (Q1FY26);
      NNPA moved from 0.85% to 1.10% to 1.41% over the same period. Early-stage delinquencies
      tell a starker story: 0+ DPD rose from 3.61% (FY24) to 4.85% (FY25) and 6.96% (Q1FY26),
      while 60+ DPD climbed from 2.02% to 2.65% to 3.32%. Total write-offs jumped from ₹65.22
      crore (FY24) to ₹108.22 crore (FY25), a 66% increase.

      Credit costs rose to 2.31% of AUM in FY25 from 1.73% in FY24, consistent with broader
      sector trends: ICRA's July 2025 report flagged NBFC-MFI sector AUM declining 12% in FY25
      amid surging overall stress (SMA+GNPA+write-offs+SR) from 5.9% to 15.3%. Veritas is not
      a pure MFI but carries unsecured-lending correlation risk. The Reserve Bank of India's
      June 2025 Financial Stability Report similarly noted NBFC stressed assets in microfinance
      rising to 5.9% and write-offs for middle-layer NBFCs increasing from ~20% to 38.7%.

      Veritas's response has been proactive: WCL exposure cut from 11% (FY24) to 7% (FY25) to 6%
      (Q1FY26); credit underwriting tightened; and provisioning increased. Stage-3 PCR stood at
      50.52% at FY25 (FY24: 53.14%), marginally lower on a stage-3 basis but overall PCR improved
      from 1.56% to 2.19% (FY25) and further to 2.67% (Q1FY26). With 47% of the portfolio having
      less than one year seasoning at FY25 (vs. 58% in FY24), portfolio maturation will be a key
      watch variable over the next 12–18 months.
