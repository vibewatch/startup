companyProfile:
  summary: >-
    Veritas Finance Limited is a Chennai-headquartered, RBI-registered Systematically
    Important Non-Deposit-Taking NBFC incorporated on April 30, 2015 by D. Arulmany,
    focused on secured MSME lending to underserved semi-urban and rural borrowers. By
    March 2025 it operated 508 branches across 11 states, employed 7,796 people, had
    served over 2 lakh customers cumulatively, and held AUM of ₹7,349 crore—growing at a
    41% five-year CAGR certified by CARE Ratings. The company achieved unicorn status in
    September 2024 at a ₹8,500 crore implied valuation and received SEBI observations for a
    ₹2,800 crore IPO in April 2025. CARE upgraded the long-term rating to AA- Stable in
    June 2025, reaffirmed in April 2026, reflecting strong franchise quality despite a
    recent moderation in profitability (ROTA ~3.10% annualised in 9MFY26) and rising NPAs
    (GNPA 2.89% at Dec 2025).
  foundedDate: "2015-04-30"
  founders:
    - name: D. Arulmany
      role: Managing Director & CEO
      background: >-
        Over 25 years of financial-services experience spanning Cholamandalam Finance and
        Aptus Housing Finance; founded Veritas Finance in 2015 and leads both strategy and
        day-to-day operations.
      claimRefs:
        - CO013
        - CO014
  foundingLocation: Tamil Nadu, India
  headquarters: Chennai, Tamil Nadu, India
  productSummary: >-
    Secured MSME small business loans (56% of AUM; ₹30,000–₹50 lakh per loan; average
    ticket ₹4.5 lakh) collateralised by property, supplemented by Loan Against
    Property-Construction (LAP-C; 14%), home loans for owner-occupied dwellings (19%),
    unsecured working capital loans (7%), and used commercial vehicle finance (4%).
    All underwriting is performed by in-house field teams with on-site collateral
    assessment and LTV capped below 50% of distressed asset value.
  customerFocus: >-
    Micro, small, and medium enterprises and individuals in semi-urban and rural India,
    typically lacking formal income documentation and excluded from bank credit channels,
    across 11 states with a concentration in Tamil Nadu (43% of AUM).
  businessModel: >-
    Interest-income-driven secured lending: the company borrows wholesale (banks, NCD
    market, mutual funds) at a blended cost near 10% and deploys at a portfolio yield of
    ~17.5%, generating a reported NIM of 13.38% on AUM. Revenue is almost entirely
    interest income (₹1,474 crore of ₹1,557 crore total in FY25) plus processing fees.
    Collections are ACH/direct-debit-based; the company maintains no deposit-taking licence.
  stage: Late-stage private (Pre-IPO)
  fundingStatus: >-
    Cumulative equity of ₹1,835 crore raised across seven tranches (FY16–FY25) from Norwest
    Venture Partners, Kedaara Capital, Multiples PE, British International Investment, Lok
    Capital, Caspian Impact, and Avendus Future Leaders Fund. An additional ₹240 crore
    internal round in September 2024 (Lok Capital, Evolvence, Avendus FLF) set the unicorn
    mark of ₹8,500 crore. SEBI granted observations for a ₹2,800 crore IPO (₹600 crore
    fresh issue + ₹2,200 crore OFS) on April 29, 2025; the price band had not been filed
    as of June 21, 2026.
