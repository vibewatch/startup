summary:
  headline: >-
    Veritas Finance has built India's fastest-growing MSME NBFC franchise and achieved
    unicorn status, but deteriorating returns, rising NPAs, and a 17-month IPO delay all
    argue that the ₹8,500 crore unicorn mark is stretched; public-market investors should
    track until ROTA stabilises above 3.5% and the RHP price band provides a clearing anchor.
  overallScore: 5.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1012
    revenueRunRateUsdM: 185
    arrUsdM: null
    revenueGrowthYoYPct: 39.5
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 247
    customerCount: 200000
    headcount: 7854
  topStrengths:
    - >-
      Fastest-growing MSME NBFC in India by AUM CAGR (41% over five years to ₹7,349 crore
      at FY25; 61.76% from FY22–FY24 per CRISIL MI&A), with a CARE AA-/Stable rating
      (upgraded June 2025, reaffirmed April 2026) enabling diversified low-cost wholesale
      funding.
    - >-
      Branch-dense, in-house field-underwriting model (509 branches, 88.67% in-house
      sourcing) built on deep penetration in semi-urban and rural South India, creating a
      moat that is hard to replicate quickly and underpins low-LTV collateral discipline.
    - >-
      Five marquee PE investors—Norwest Venture Partners, Kedaara Capital, Multiples PE,
      British International Investment, and Lok Capital—collectively underwrote ₹1,835 crore
      across eight tranches, validating the credit model across multiple economic cycles.
    - >-
      SEBI-approved ₹2,800 crore IPO (April 2025) with lead managers including HDFC Bank,
      ICICI Securities, Kotak Mahindra Capital, and Jefferies India signals institutional
      readiness and provides an imminent public-market liquidity event.
  topRisks:
    - >-
      Return on Total Assets has deteriorated from a peak of 5.36% (FY23) to 3.10%
      annualised in 9MFY26, approaching CARE's negative rating trigger of 3.00%, while GNPA
      has risen from 0.85% (FY22) to 2.89% (Dec 2025)—42 bps below CARE's 2.00% NNPA
      trigger—raising the risk of a rating downgrade that would widen funding costs.
    - >-
      The ₹8,500 crore unicorn mark (3.25x Sep 2024 book value) was set by existing PE
      investors in a non-arm's-length internal round; the base-case public-market range is
      ₹6,000–7,500 crore (2.0–2.5x P/B on Dec 2025 net worth), implying a 12–30% discount
      to the internal mark.
    - >-
      More than 17 months elapsed between SEBI approval (April 2025) and the run date
      (June 2026) without a price band being filed; the OFS-dominant structure (78.6% of
      proceeds) means most capital flows to PE exits, not to company capitalisation.
    - >-
      Geographic concentration—Tamil Nadu 43% of AUM, top three states 71%—and sector
      funding pressure (bank lending growth to NBFCs fell from 35% to 5.9% between March
      2023 and March 2025 per RBI FSR June 2025) represent structural headwinds.
  unresolvedGaps:
    - >-
      FY26 audited financials (expected July–August 2026): needed to confirm whether ROTA
      has troughed above 3.00% and whether GNPA/NNPA are within CARE's rating triggers on
      a full-year basis.
    - >-
      IPO price band and final Red Herring Prospectus: the RHP will set the public-market
      clearing price and disclose Q4FY26 financials, revised risk factors, and the updated
      cap table; without it, the valuation range remains a model estimate.
    - >-
      Q4FY26 NPA data and CARE/CRISIL rating surveillance update post March 2026: needed to
      confirm whether the GNPA peak is behind the company or still rising in the unsecured
      working-capital and vehicle-loan segments.
    - >-
      Post-IPO AUM growth plan and use of ₹600 crore fresh-issue proceeds: visibility into
      whether new capital will be deployed in higher-yielding secured MSME loans or in
      geographic expansion into new states.

appendices:
  - id: A
    title: Valuation Scenarios and Base-Case Anchor
    blocks:
      - type: paragraph
        body: >-
          Three valuation scenarios were modelled using P/B multiples applied to the
          December 2025 net worth of ₹3,004 crore as anchor: Bear (₹4,506 crore, 1.5x P/B),
          Base (₹6,000–7,500 crore, 2.0–2.5x P/B), and Bull (₹9,012 crore, 3.0x P/B,
          requiring ROTA recovery to ≥4.5% and GNPA below 2.0%). The unicorn reference mark
          of ₹8,500 crore (~2.83x Dec 2025 book) falls between the Base and Bull scenarios,
          consistent with the stretched valuation stance. Entry at or below 2.0x P/B (≤₹6,008
          crore) provides a meaningful margin of safety in the bear scenario.
        claimRefs:
          - CV001
          - CV002
          - CV003
          - CV004
          - CV027

