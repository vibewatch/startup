    title: Veritas Finance Customer Onboarding and Loan Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Maps the end-to-end borrower journey from discovery through disbursement to
      collection, illustrating where field-based and digital touchpoints intersect for
      a semi-rural micro-enterprise borrower.
