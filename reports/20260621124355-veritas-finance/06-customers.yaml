      - TU004
    figureRefs:
      - FU004

  - id: concentration-risks-and-adverse-factors
    title: Concentration Risks and Adverse Factors
    body: >-
      Four structural risks warrant diligence attention. First, geographic concentration:
      Tamil Nadu alone accounts for 43% of AUM as of both March 2025 and December 2025.
      Any political disruption, natural disaster (floods, cyclones), or credit event
      concentrated in Tamil Nadu could materially impair the portfolio. CARE Ratings
      flags this persistently. The top-three states (Tamil Nadu, AP, Telangana) held
      75% of AUM at December 2025, limiting the diversification value of newer geographies.

      Second, borrower vulnerability: the DRHP explicitly discloses that Veritas's
      borrowers are "relatively high credit-risk" due to vulnerability to adverse economic
      conditions, limited formal-sector participation, and exposure to income shocks from
      business failures, health emergencies, and natural calamities. A macro downturn,
      crop failure in a key southern state, or health shock to an income-earning household
      member can impair a borrower with no alternative formal credit safety net.

      Third, macro-sector stress: CRIF High Mark data (April 2026) shows MSME credit
      growth slowed to 3.1% between December 2025 and April 2026 (versus 9.7% a year
      prior), with micro-segment outstanding loans contracting 3.1% and early-stage
      delinquencies rising. PAR 31-90 for micro borrowers stood at 2.7% in April 2026.
      This external headwind is material given Veritas's focus on the micro/small segment.

      Fourth, overleveraging risk in the broader microfinance and informal lending ecosystem:
      TransUnion CIBIL data shows delinquency among MSME borrowers with exposure below
      ₹10 lakh rose to 5.8% (March 2025) from 5.1% (March 2024), even as overall MSME
      portfolio quality improved. Veritas's borrower profile overlaps substantially with
      this vulnerable cohort, and any recurrence of the urban digital-lending-triggered
      overleveraging seen in WCL in FY2025 could replicate in other geographies.

      The company's mitigants — sub-50% LTV secured collateral, in-house sourcing at 88.67%,
      proactive reduction of unsecured exposure, and mandatory e-NACH enrolment — are
      substantive but do not eliminate these risks. The customer base's relative isolation
      from formal institutional credit remains a double-edged sword: it creates the market
      opportunity but also limits the borrower's financial resilience when shocks occur.
    claimRefs:
      - CU042
      - CU043
      - CU044
      - CU045
      - CU046
      - CU047
      - CU048

