  - id: borrower-economics-pain-points-and-relationship
    title: Borrower Economics, Pain Points, and Relationship Model
    body: >-
      The Veritas borrower is economically distinct from a bank's standard retail customer.
      Monthly incomes range from ₹25,000 to ₹80,000 (for rural business borrowers), often
      earned irregularly from trade cycles, seasonal agriculture-linked demand, or informal
      services. Documentation is sparse: most borrowers lack ITRs, GST filings, or audited
      statements. The company's DRHP explicitly identifies borrowers' lack of formal
      documentation, limited or absent credit history, informal employment, and geographic
      remoteness as defining characteristics. The informal substitutes available to such
      borrowers — moneylenders, rotating savings groups, family loans — typically carry
      rates far exceeding Veritas's 20–24% yield range and have no structured tenure.

      Veritas addresses this underwriting gap through a proprietary "triple AAA" filter:
      assessed income (via household and business site visits), attitude (neighbour references
      and community standing), and asset creation (collateral documentation). The credit
      assessment collects 409 data points digitally and runs two machine-learning scorecard
      models (one for secured, one for unsecured borrowers) from which 15 key risk variables
      are weighted. The result is a risk score driving both decisioning authority and interest-
      rate pricing. Average business vintage at origination is approximately 11.93 years for
      Rural Business Loan borrowers — well above the median startup age — suggesting the
      company targets established micro-enterprises rather than start-ups, which moderates
      credit risk.

      The British International Investment (BII) gender-impact case study documents how
      Veritas launched the 'Dhana Shakti' product specifically for women entrepreneurs,
      enabling women borrowers to grow 60% (from 19,000 to 30,600) between March 2023 and
      March 2024. Women had plateaued at 16% of the borrower base in 2022; the product
      launch and gender-sensitisation training for 300 loan officers reversed that trend.
      This demonstrates meaningful customer-segment expansion within the existing
      low-documentation, semi-rural archetype.

      Collections rely on ACH/e-NACH mandates (92.80% of secured borrowers enrolled as of
      September 2024), UPI, and the Veritas self-service mobile application available in
      vernacular languages. Weekly visits by relationship managers for working capital
      borrowers and monthly EMI monitoring for secured borrowers constitute the primary
      delinquency-prevention mechanism. Digital collections rose from 52.60% (FY2022) to
      89.61% (September 2024); FY2025 achieved 100% digital disbursement.
