        - label: "Initial Assessment"
          description: "Sales manager visits borrower household and business premises; informal income assessment and reference gathering"
        - label: "Application and KYC"
          description: "Zero-data-entry digital onboarding via OCR tools; e-KYC, photo-tagging, and digital consent via SMS"
        - label: "Credit Scoring (AAA Filter)"
          description: "409 data points collected; ML scorecard runs 15 key variables; LTV appraisal and legal/technical property check"
        - label: "Sanction"
          description: "Risk score drives decision authority (branch/area/regional credit manager); risk-based interest rate determined; Key Fact Statement issued"
