  - id: customer-growth-and-adoption-trajectory
    title: Customer Growth and Adoption Trajectory
    body: >-
      Veritas's active borrower base grew at a CAGR of 56.68% between FY2022 and FY2024,
      accelerating from 53,772 (FY2021) to 71,726 (FY2022), 116,403 (FY2023), 176,082
      (FY2024), and 211,389 (FY2025). The AUM trajectory closely tracked borrower growth:
      ₹1,563 crore (FY2021), ₹2,187 crore (FY2022), ₹3,534 crore (FY2023), ₹5,724 crore
      (FY2024), ₹7,349 crore (FY2025), and ₹8,506 crore (December 2025 unaudited). By
      June 30, 2025 the company reported ₹7,477 crore loan book and 438 branches. This
      represents cumulative disbursements of ₹14,270 crore since inception (to June 2025).

      Average ticket size rose steadily from ₹3.7 lakh (FY2022) to ₹4.0 lakh (FY2024)
      and ₹4.2 lakh (September 2024), reflecting both a shift toward higher-value rural
      business loans and moderate income progression among repeat borrowers. Total
      disbursements reached ₹3,933 crore in FY2025, marginally above the ₹3,702 crore
      in FY2024.

      Veritas crossed the 100,000-borrower milestone and the 400-branch milestone in FY2024,
      both tracked on the company's milestone page. The 'Inclusive Enterprise Lending by
      NBFC of the Year' award at the 19th Inclusive Finance India Awards 2022 and repeated
      Great Place to Work certification attest to external recognition of the model. Adoption
      is entirely in production — no pilot-stage indicators remain in the disclosed data.
      AUM per branch was ₹153.71 million as of September 2024, and AUM per sales manager
      was ₹17.43 million, signalling adequate field-team productivity.
