        - label: "Renewal / Expansion"
          description: "No explicit top-up or repeat-loan programme disclosed; borrower eligibility based on repayment track record; business-vintage filter applied"
    approximationNotes: "Journey stages derived from DRHP 'Our Business' section and Annual Report 2025 technology/credit-process disclosures. The renewal/expansion stage is inferred from general NBFC practice; Veritas does not disclose a formal repeat-lending programme."
