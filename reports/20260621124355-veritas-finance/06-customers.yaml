callouts:
  - calloutType: strength
    title: In-Production Scale with 211,000 Borrowers at Sub-2% GNPA Through FY2024
    body: >-
      Veritas Finance has built a fully in-production, revenue-generating retail NBFC
      with 211,389 active borrowers and ₹7,349 crore AUM by March 2025. The GNPA
      trajectory from 3.94% (FY2022) to 1.79% (FY2024) demonstrated that rapid growth
      was not achieved at the cost of credit quality during the core expansion phase.
      This track record of sub-2% GNPA at scale validates the 'AAA filter' model.
    claimRefs:
      - CU002
      - CU037
  - calloutType: risk
    title: Geographic and Sector Concentration Create Tail Risk
    body: >-
      Tamil Nadu at 43% of AUM, with the top-three states at 75%, means a regional
      credit event, natural disaster, or policy change in one state could impair a
      quarter or more of the portfolio. Combined with the structural vulnerability of
      rural micro-borrowers to income shocks, and a rising GNPA trajectory from FY2025
      (2.21%) through December 2025 (2.89%), this concentration risk warrants a specific
      geo-stress scenario in due diligence.
    claimRefs:
      - CU042
      - CU043
      - CU045
  - calloutType: insight
    title: Borrower Vulnerability Is the Business Model's Structural Trade-Off
    body: >-
      Veritas Finance's competitive moat is precisely its willingness to lend to borrowers
      that formal banks decline. This same trait — informal income, limited documentation,
      geographic remoteness, new-to-credit status — makes the borrower base inherently
      fragile to income shocks, overleveraging, and macro downturns. The 2025 WCL segment
      stress (urban shopkeeper digital-loan overhang) is a preview of what could happen in
      the secured segment if a macro shock arrives. Investors must hold the financial-
      inclusion mission and the elevated credit-cost baseline as two sides of the same coin.
    claimRefs:
      - CU044
      - CU045
      - CU046
      - CU048

