  - id: geographic-distribution-and-footprint
    title: Geographic Distribution and Branch Footprint
    body: >-
      Veritas operates across 11 states and union territories, a footprint that expanded
      from 8 states in FY2022. As of March 2025, the network comprised 508 branches
      including 117 service centres covering 178 districts. By December 2025 this had
      grown to 512 operating points (including 71 service centres). The company also
      operated 438 branches plus 71 service centres as of June 30, 2025 per the latest
      company profile.

      Geographic concentration is pronounced. Tamil Nadu, where Veritas was founded,
      accounted for 41.94% of AUM as of September 2024 and remains at 43% of AUM at
      both March 2025 and December 2025. The top three states — Tamil Nadu, Andhra
      Pradesh, and Telangana — together contributed 71% of AUM as of March 2025 and
      75% as of December 2025, reflecting both the depth of the southern franchise and
      the early-stage nature of newer geographies (Bihar and Chhattisgarh, entered FY2024,
      combined <1.2% of AUM at September 2024). The eastern corridor (West Bengal, Odisha,
      Jharkhand) has been de-emphasised as home-loans growth in AP/TN accelerated.

      Service centres supplement full-branches by focusing on loan servicing, collections,
      and customer queries without origination capability, enabling last-mile collection
      coverage in rural clusters. The company targets unserved and under-served areas and
      prioritises hiring local talent; 88.67% of all loans (by AUM) are sourced in-house
      through the branch network, with only 11.33% attributable to direct selling agents
      (DSAs), the latter concentrated in the home-loans and vehicle-loans businesses.
    claimRefs:
      - CU015
      - CU016
