summary:
  headline: >-
    Veritas Finance 已经搭起印度增长最快的 MSME NBFC 业务，并跻身独角兽；但回报走弱、NPA 上升、IPO 延迟 17 个月，都说明 ₹8,500 crore 的独角兽标记偏高，公开市场投资者应继续跟踪，等
    ROTA 稳定在 3.5% 以上且 RHP 价格区间给出清算锚点后再行动。
