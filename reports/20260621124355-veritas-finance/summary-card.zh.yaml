  topStrengths:
    - >-
      按 AUM CAGR 看，Veritas Finance 是印度增长最快的 MSME NBFC（截至 FY25 达 ₹7,349 crore，五年复合增速 41%；CRISIL MI&A 口径 FY22–FY24 为
      61.76%），CARE AA-/Stable 评级（2025 年 6 月上调、2026 年 4 月确认）支撑多元化、低成本批发融资。
    - 高网点密度、内部实地承保模型（509 家分支，88.67% 内部获客）深扎印度南部半城市和农村市场，形成难以快速复制的护城河，并支撑低 LTV 抵押纪律。
    - >-
      Norwest Venture Partners、Kedaara Capital、Multiples PE、British International Investment 和 Lok Capital 五家头部 PE
      投资者，八个批次合计投入 ₹1,835 crore，跨多个经济周期验证了信贷模型。
    - >-
      SEBI 已批准 ₹2,800 crore IPO（2025 年 4 月），主承销商包括 HDFC Bank、ICICI Securities、Kotak Mahindra Capital 和 Jefferies
      India，显示公司已具备机构化准备，也带来临近的公开市场流动性事件。
  topRisks:
    - >-
      总资产回报率从 5.36%（FY23）峰值降至 9MFY26 年化 3.10%，逼近 CARE 3.00% 的负面评级触发线；GNPA 从 0.85%（FY22）升至 2.89%（2025 年 12 月），距 CARE
      2.00% NNPA 触发线仅 42 bps，评级下调风险会推高融资成本。
    - >-
      ₹8,500 crore 独角兽标记（2024 年 9 月账面价值的 3.25x）来自既有 PE 投资者的非公平交易内部轮；基准公开市场区间为 ₹6,000–7,500 crore（按 2025 年 12 月净资产
      2.0–2.5x P/B），较内部标记折让 12–30%。
    - SEBI 批准（2025 年 4 月）到运行日期（2026 年 6 月）已过去超过 17 个月，价格区间仍未提交；以 OFS 为主的结构（占募资额 78.6%）意味着大部分资金流向 PE 退出，而不是公司资本补充。
    - >-
      地理集中度高——Tamil Nadu 占 AUM 43%，前三大邦占 71%；行业融资也承压（RBI FSR 2025 年 6 月显示，银行对 NBFC 贷款增速从 2023 年 3 月的 35% 降至 2025 年 3 月的
      5.9%），两者都是结构性逆风。
  unresolvedGaps:
    - FY26 审计财务（预计 2026 年 7–8 月）：需要确认 ROTA 是否在 3.00% 以上见底，以及 GNPA/NNPA 在全年口径下是否仍处于 CARE 评级触发线以内。
    - IPO 价格区间和最终 Red Herring Prospectus：RHP 会确定公开市场清算价格，并披露 Q4FY26 财务、修订后风险因素和更新后的股权结构表；缺少它，估值区间仍只是模型估计。
    - Q4FY26 NPA 数据，以及 2026 年 3 月之后 CARE/CRISIL 评级监测更新：需要确认 GNPA 峰值是否已经过去，还是仍在无抵押营运资金和车辆贷款分部上升。
    - IPO 后 AUM 增长计划和 ₹600 crore 新股募资用途：需要看清新增资本是投向收益率更高的有抵押 MSME 贷款，还是用于进入新邦的地理扩张。
