company:
  name: Veritas Finance Limited

chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Veritas Finance operates in the high-growth, chronically under-served niche of secured
    and semi-secured MSME credit for self-employed rural and semi-urban borrowers in India,
    with product adjacencies in affordable home construction finance and used commercial
    vehicle lending. India's total MSME debt demand is estimated at ₹95.6 lakh crore
    against a formal supply of only ₹32.4 lakh crore, leaving an addressable credit gap of
    ₹18.3 lakh crore (CARE Ratings, H1 FY25); NBFC MSME AUM grew at 32% CAGR from
    FY21–FY24 and is projected to reach ₹5.3 lakh crore by FY26. Growth is driven by PSL
    mandates, formalisation, and digital infrastructure, but constrained by borrower
    documentation gaps, overleveraging in the MFI segment, tightening bank funding to NBFCs,
    and branch-led cost intensity—structural tensions that benefit Veritas' collateral-first,
    field-underwriting model while limiting rapid scale.

sections:
  - id: market-boundary
    title: Market Boundary and Product Perimeter
    body: >-
      Veritas Finance's real market is not "Indian fintech" or "MSME credit" in its entirety.
      Its serviceable population is self-employed micro and small entrepreneurs in rural and
      semi-urban India who own or occupy residential property, operate informally, lack formal
      income documentation, and have been historically excluded from bank lending. The company
      serves these borrowers primarily through secured MSME small business loans (property-backed,
      ₹0.3–50 lakh ticket), affordable home construction loans (LAP-Construction), owner-occupied
      home loans, and—since FY24—used commercial vehicle finance. Working capital loans (unsecured)
      are a deliberate adjacency capped below 10% of AUM to manage credit risk.

      The excluded perimeter is equally important. Veritas does not serve large enterprises, salaried
      employees, metro-urban professional borrowers, consumer loans, gold loans, microfinance group
      lending, or bank-eligible businesses with documented financials. Its competition is not Axis
      Bank's MSME division; it is the local moneylender, regional cooperative, and informal trade
      credit that this borrower segment relies on in the absence of formal access. Status-quo
      substitutes include family loans, chit funds, and unsecured digital lenders who charge
      materially higher rates but require no collateral.

      The geographic perimeter is also bounded. 83% of Veritas' branches and 89% of its AUM are
      concentrated in Tamil Nadu, Andhra Pradesh, Telangana, Karnataka, and West Bengal. The
      company is expanding into Uttar Pradesh, Bihar, Chhattisgarh, and other states with large
      rural populations. This geographic focus is not incidental—it reflects the skill of field-
      based credit underwriting developed in Tamil Nadu's semi-urban MSME belt over a decade,
      and the operational risk of replicating that model in unfamiliar markets.

      The affordable housing adjacency (19% of AUM as of March 2025) addresses a related but
      distinct market: families building or purchasing their first home, often the same borrower
      who also takes an MSME business loan. The used CV segment (4% of AUM) serves owner-operators
      of commercial vehicles in semi-urban and rural corridors, a subsegment where NBFCs dominate
      because banks are less willing to underwrite cash-income operators and used-vehicle collateral.
