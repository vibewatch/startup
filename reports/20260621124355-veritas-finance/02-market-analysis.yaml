  - id: growth-drivers
    title: Growth Drivers
    body: >-
      Several structural forces are accelerating formal credit access for Veritas' target segment.
      Udyam registration has formalised millions of small enterprises; GST Sahay and TREDS have
      created digital cash-flow evidence that lenders can use as partial income proxies. Priority
      Sector Lending (PSL) mandates allow bank credit extended to NBFCs for on-lending to small
      industries to be classified as PSL, directly subsidising NBFC funding costs and incentivising
      banks to grow this channel. NBFCs have grown MSME lending at 32% CAGR from FY21 to FY24,
      well ahead of private banks (20.9% CAGR) and PSU banks (10.4% CAGR), partly because this PSL
      benefit applies more cleanly through NBFC originators.

      The PMAY (Pradhan Mantri Awas Yojana) housing scheme has stimulated first-home demand in
      Tier 2–4 towns and villages, directly enlarging the addressable population for Veritas' home
      construction loans. The AHFC segment as a whole is projected to grow at 20–22% through FY26,
      sustained by this policy tailwind. On the CV side, rising rural logistics demand, e-commerce
      penetration into Tier 3+ towns, and the preference for used vehicles among new operators
      expand the addressable fleet-owner segment.

      Formalization is a longer-term secular driver. The share of new-to-credit (NTC) borrowers was
      23.3% as of September 2025 (CRIF-SIDBI), meaning roughly one in four active borrowers in
      the small-business credit ecosystem had not previously borrowed from a formal lender. This pool
      replenishes the addressable market even as existing borrowers graduate to bank lending.
