  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: SAM geographic construction
      missingEvidence: >-
        District-level or state-level breakdown of NBFC micro-LAP and secured MSME AUM for Tamil
        Nadu, Andhra Pradesh, Telangana, Karnataka, and West Bengal, which would enable a
        bottom-up SAM construction specific to Veritas' geographic footprint.
      whyItMatters: >-
        Without a state-level split of the NBFC micro-LAP market, the SAM estimate of
        ₹12,000–20,000 crore remains researcher-constructed and cannot be independently validated.
        This affects sizing credibility in any investor diligence context.
      diligencePath: >-
        Request CRIF High Mark or TransUnion CIBIL state-level MSME credit data. RBI's MSME
        credit data by state is available annually; CARE or ICRA could construct a state-level
        NBFC micro-LAP breakdown on request.
      relatedQuestionRefs:
        - QM010
        - QM013
        - QM020
        - QM026

    - type: missing-source
      severity: material
      topic: used CV market sizing
      missingEvidence: >-
        An independent, current estimate of the used commercial vehicle finance market size
        specifically for rural and semi-urban NBFCs, segregated from new CV and urban fleet finance.
        The DRHP's 13% CAGR for total CV market (CRISIL projection) conflates new and used vehicles.
      whyItMatters: >-
        Veritas' CV segment (4–6% of AUM) is growing and is a strategic diversification. Without
        a specific market size for the rural used CV segment, it is impossible to assess penetration
        or competitive intensity.
      diligencePath: >-
        Obtain CRIF High Mark vehicle finance data segmented by used/new and metro/non-metro.
        Industry body FINANCE INDUSTRY DEVELOPMENT COUNCIL (FIDC) publishes CV finance data that
        may allow this disaggregation.
      relatedQuestionRefs:
        - QM006

    - type: private-evidence-only
      severity: material
      topic: first-time borrower credit performance
      missingEvidence: >-
        Segmented GNPA and loss-given-default data specifically for Veritas' 24.72% first-time
        borrower cohort, which is disclosed in aggregate but not broken out in public filings or
        rating reports in sufficient detail to benchmark against seasoned borrowers.
      whyItMatters: >-
        First-time borrowers at 24.72% of the book represent a credit stratification that matters
        for cycle risk. The DRHP notes that NPA in first-time borrowers was 1.74% of AUM as of
        September 2024, but post-stress data is unavailable publicly.
      diligencePath: >-
        Request from Veritas: vintage cohort analysis of first-time vs. repeat borrowers broken
        out by DPD bucket, product line, and geography. Compare with sector benchmarks from
        CRIF High Mark new-to-credit borrower performance data.
      relatedQuestionRefs:
        - QM009
        - QM016

    - type: stale
      severity: minor
      topic: CV finance CAGR projection
      missingEvidence: >-
        A current (FY25 or FY26) projection for the commercial vehicle financing market CAGR.
        The DRHP cites a 13% CAGR projection for FY22–FY27 from CRISIL; this was filed in
        January 2025 and may not reflect current CV demand conditions.
      whyItMatters: >-
        If CV demand softens with rural income stress, the used CV segment's growth thesis
        weakens and may not justify Veritas' investment in branch-level CV underwriting capacity.
      diligencePath: >-
        Check SIAM (Society of Indian Automobile Manufacturers) CV sales data and latest
        CRISIL vehicle finance market reports for FY25 actuals and FY26 outlook.
      relatedQuestionRefs:
        - QM006
        - QM011

