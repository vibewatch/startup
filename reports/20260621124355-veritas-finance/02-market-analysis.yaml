  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      Veritas' borrower profile is highly specific: the self-employed micro-entrepreneur who owns
      a home (collateral owner), runs a cash-and-carry business (income earner), and often combines
      household and business finances without formal separation. The borrower, user, and payer are
      typically the same individual—unlike corporate MSME where a business entity borrows, an
      employee uses the funds, and a promoter personally guarantees repayment.

      The budget ownership question in this market is nuanced. Repayment comes from a blended
      household-and-business cash flow rather than a separately tracked business account. Seasonal
      income is the norm—agricultural communities, traders, and artisans have peaks during festivals,
      harvest seasons, or wedding months and slack in lean periods. Rigid EMI schedules conflict
      with this reality; Veritas' product design implicitly accepts some collection variability.

      The collateral owner dimension matters most for secured MSME loans: the property is typically
      the borrower's self-occupied home, which creates a high-stigma default event and aligns
      incentives for repayment. This is the primary credit risk mitigant in the absence of reliable
      income documentation. LTV is kept below 50% of distressed value, providing a buffer under
      normal and stressed asset valuations.

      First-time borrowers represent 24.72% of Veritas' loan book as of September 2024. This
      cohort has no prior formal credit history, making bureau-based risk assessment unreliable;
      field assessment by branch credit managers is the primary underwriting mechanism. This is both
      a differentiator (few banks or larger NBFCs invest in this capability) and a scalability
      constraint (adding branches is the primary growth mechanism).
