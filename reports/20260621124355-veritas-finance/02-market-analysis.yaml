callouts:
  - calloutType: insight
    title: Credit Gap Framing Requires Methodological Honesty
    body: >-
      The DRHP's ₹103 trillion MSME credit gap (CRISIL, FY24) and CARE Ratings' ₹18.3 lakh
      crore formal addressable gap are not different estimates of the same thing. The DRHP uses
      total debt demand including trade credit and informal borrowing; CARE measures the gap
      between formal supply and bankable demand. Analysts should use the CARE figure as the
      addressable market for formal NBFC entry; the DRHP figure is the broader social financing
      need. Veritas' own AUM (₹7,477 crore, June 2025) is small against either measure.
    claimRefs:
      - CM010
      - CM003
      - CM004

  - calloutType: risk
    title: Overleveraging and MFI Stress Spillover is Active Risk
    body: >-
      ICRA documents that MFI-sector total stress reached 15.3% in FY25, and CARE confirms
      spillover into adjacent secured micro-LAP. Veritas' secured model and LTV discipline
      provide structural protection, but early delinquency (0+ DPD up to 4.85% by March 2025)
      and the GNPA deterioration at Q1 FY26 (2.81%) signal that the adverse cycle is not
      quarantined to unsecured lenders alone.
    claimRefs:
      - CM022
      - CM025
      - CM029
      - CM030

  - calloutType: assumption
    title: SAM Estimate is Agent-Constructed and Requires Proprietary Validation
    body: >-
      The ₹12,000–20,000 crore SAM estimate for Veritas' 11-state served addressable market
      is a researcher construction based on geographic partitioning of NBFC Micro-LAP AUM. No
      independent publisher has sized this specific intersection. The actual SAM depends on
      borrower density in Veritas' districts, ticket-size overlap with the micro-LAP definition,
      and the LTV discipline that rules out some otherwise eligible borrowers.
    claimRefs:
      - CM005
      - CM006
      - CM013

