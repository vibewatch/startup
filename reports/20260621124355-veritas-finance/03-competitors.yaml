  - id: adjacent-incumbent-players
    title: "Adjacent and Incumbent Players — Aptus Housing, Shriram Finance, CreditAccess Grameen"
    body: >-
      Aptus Value Housing Finance competes in Veritas' affordable housing adjacency, not its core MSME LAP segment.
      Aptus had AUM of ₹10,865 crore as of FY25 (+25% YoY) with 300 branches concentrated in Andhra Pradesh (42%),
      Tamil Nadu (34%), and Telangana (16%) — geographies that heavily overlap Veritas' home markets. Aptus achieves
      a 7.7% RoA and 18.76% RoE with GNPA of only 1.19% and opex/AUM of just 14.4% — far superior economics to
      Veritas — driven by its standardized home-loan process and lower borrower risk profile. Veritas' 18% housing
      loan share (FY25) places it in direct competition with Aptus for borderline formal-sector home-construction
      borrowers, but Aptus' deeper product specialisation, digital loan execution (92% of agreements digital), and
      stronger brand in home finance create meaningful friction for Veritas to win pure housing mandates.

      Shriram Finance is an incumbent NBFC whose scale (₹2,63,190 crore AUM, 3,220 branches) and customer
      relationships in rural and semi-urban markets create competitive pressure on borrower trust, though its MSME
      lending (₹37,413 crore, 14.2% of AUM) is secondary to its dominant commercial vehicle franchise. Shriram's
      branch density and existing relationships with small business customers represent both a brand advantage and
      a potential pipeline competition for Veritas in states where both operate. However, Shriram's larger average
      ticket and vehicle-centric underwriting framework limit direct overlap in the ₹1–10 lakh secured MSME LAP niche.

      CreditAccess Grameen, India's largest NBFC-MFI with AUM of approximately ₹25,948 crore as of March 2025,
      is an indirect substitute — its unsecured group-lending model targets a borrower demographic partially overlapping
      Veritas' rural clientele. The critical difference is collateral: CreditAccess lends unsecured at group-guarantee
      rates, while Veritas requires property collateral. The MFI sector's FY25 stress (CreditAccess net profit fell
      63.2% YoY to ₹531 crore due to delinquency cycles) highlights the risk Veritas' borrowers face from overleveraging
      when they carry both MFI and LAP debt — an adverse scenario for Veritas' asset quality.
