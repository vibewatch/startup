        in South India (AP 38%, TN 30%, Telangana 19%), indicating geographic overlap in Veritas' home markets and
        direct competition in the Tamil Nadu and Andhra Pradesh MSME LAP corridors.
      type: third-party-reported
      topic: geography-overlap
      sourceRefs:
        - SP001
        - SP002
      confidence: high
      freshness: recent
      answersQuestionRefs:
        - QP023

