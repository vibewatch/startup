  claims:
    - id: CP001
      statement: >-
        Veritas Finance's competitive environment spans five distinct categories: direct secured MSME LAP NBFCs
        (Five Star, SBFC), adjacent DataTech lenders (UGRO Capital), affordable HFCs (Aptus Value Housing), large
        diversified incumbents (Shriram Finance, PSBs), and informal status-quo sources (moneylenders, chit funds,
        family capital).
      type: observed
      topic: competitive-landscape
      sourceRefs:
        - SP001
        - SP002
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QP009

    - id: CP002
      statement: >-
        Veritas Finance achieved an AUM CAGR of 62% from FY2022 to FY2024, the highest among its CRISIL MI&A-identified
        peer set including Five Star (38%), SBFC (46%), Aavas (24%), Aptus (23%), and Cholamandalam (38%).
      type: third-party-reported
      topic: veritas-differentiation
      sourceRefs:
        - SP001
        - SP002
      confidence: high
      freshness: historical

    - id: CP003
      statement: >-
