callouts:
  - calloutType: strength
    title: Fastest AUM Growth in CRISIL Peer Set
    body: >-
      Veritas Finance achieved the highest AUM CAGR of 62% and disbursement CAGR of 77% among all CRISIL MI&A-identified
      peers from FY22 to FY24, outpacing Five Star (38%), SBFC (46%), and Aptus (23%). This suggests strong demand
      capture in its semi-urban LAP niche and effective branch network deployment.
    claimRefs:
      - CP002

  - calloutType: risk
    title: Profitability Gap vs Five Star Is a Structural Concern
    body: >-
      Veritas' RoA of 4.7% (FY24) and 3.98% (FY25) compares unfavourably to Five Star's 8.2% (FY24), driven by a
      credit cost that is nearly 3× higher (2.0% vs 0.7%) and an opex ratio that is 10 percentage points above its
      closest peer. Unless Veritas' East India and newer geographies season rapidly and credit costs normalise, the
      RoA gap constrains its ability to self-fund growth at the pace of Five Star.
    claimRefs:
      - CP008
      - CP009
      - CP039

  - calloutType: insight
    title: Informal Moneylenders Are the Real Incumbent
    body: >-
      For Veritas' target borrowers in rural and semi-urban India, the most relevant competitive comparison is not
      Five Star or SBFC — it is a local moneylender charging 36–50%+ per annum with no paperwork and same-day
      disbursement. Veritas' 22–23% yield represents a genuine discount to the informal baseline, but winning the
      borrower requires demonstrating speed, convenience, and relationship trust. This makes branch density and
      local staff permanence — not technology — the primary moat in Veritas' core segment.
    claimRefs:
      - CP031
      - CP033
      - CP044

