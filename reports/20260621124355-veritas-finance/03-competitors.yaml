        and SBFC at ₹9.49 lakh, placing Veritas and Five Star in the micro-MSME LAP segment while SBFC targets a
        distinctly higher-ticket mid-market niche.
      type: third-party-reported
      topic: pricing-comparison
      sourceRefs:
        - SP001
        - SP006
      confidence: high
      freshness: recent
      answersQuestionRefs:
