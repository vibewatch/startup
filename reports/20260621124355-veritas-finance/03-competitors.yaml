      statement: >-
        Five Star's entire loan portfolio is secured against property collateral with LTV capped at up to 50% of
        distressed value and has zero unsecured exposure, contrasting with Veritas' 7% unsecured working capital book
        (as of FY25) which contributed to higher credit costs in FY25.
