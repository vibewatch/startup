  - id: funding-liability
    title: Funding, Liquidity, and Liability-Mix Risks
    body: >-
      Veritas's funding profile is concentrated and short in tenor relative to its long-dated asset
      book. Bank borrowings account for 71.30% of the funding mix at December 31, 2025, with SBI alone
      at 18.11% of total borrowings and the 27 largest counterparties collectively comprising 91.30% of
      all liabilities excluding net worth. Short-term liabilities (borrowings maturing within one year)
      stand at 33.76% of total liabilities as of the March 2026 quarterly disclosure, creating meaningful
      annual refinancing risk on a loan book growing at 28%+ annually.

      NCDs represent 11.39% and securitisation 12.19% of the funding mix at December 31, 2025, providing
      some diversification. However, NIM compressed from 14.39% (FY24) to 13.38% (FY25) as borrowing
      costs rose faster than loan yields, and on-book gearing rose to 2.25x at December 31, 2025 from
      2.08x at March 31, 2025. CARE's negative trigger is gearing above 3x, still providing headroom,
      but the trajectory is upward. The IPO's ₹600 crore fresh issue component, if successfully launched,
      would lower gearing, but the ₹2,200 crore OFS component would not add primary capital.

      Bank credit flows to NBFCs stagnated in FY25 as lenders raised risk weights and tightened credit
      terms. If this macro tightening returns or is amplified — e.g., post another IL&FS-style event —
      Veritas's concentrated bank dependency would leave limited alternative funding routes in the short
      term. The ALM profile remains comfortable (no cumulative bucket mismatches as of December 31, 2025)
      but warrants close monitoring as the book scales.
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR019
