  - id: operational-execution
    title: Operational and Execution Risks
    body: >-
      Field operations at the scale Veritas is targeting introduce compounding execution risks. Cash
      collections remained 10.39% of total collections in H1FY25 (down from 47.40% in FY22), and the
      company disclosed two employee fraud instances involving cash misappropriation in the period,
      totalling ₹1.01 million in losses. While isolated, these incidents reflect the inherent difficulty
      of moving a rural/semi-urban collection workforce toward full digital compliance. Employee attrition
      was 32.09% in H1FY25 and as high as 58.50% in FY24, meaning the company constantly trains
      replacement staff for customer-facing roles while growing its branch count at 17%+ annually.

      On the technology side, Veritas uses third-party vendor software for loan origination and NPA
      management — the same platforms used by PSU banks — reducing development risk but creating
      concentration in a single vendor stack. The company is ISO 27001 certified and has not reported
      known data breaches through September 2024. The RBI's IT Governance Directions (November 2023)
      impose formal governance requirements on IT risk management that Veritas must continuously comply
      with. DSA partners sourced 11.33% of AUM at September 2024; any deterioration in DSA underwriting
      quality would not immediately surface in portfolio data, creating a lagged detection risk.

      Geographic expansion into states outside Tamil Nadu — Bihar, Chhattisgarh, Jharkhand — introduces
      unfamiliar local legal and collections infrastructure. Scaling from 434 branches (FY24) to 512
      (December 2025) across 11 states in under two years requires simultaneous credit, legal, and
      collections capacity building, each of which has historically driven attrition spikes in the
      comparable peers.
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
    tableRefs:
      - TR002
    figureRefs:
      - FR002

  - id: geographic-macro
    title: Geographic Concentration and Macro Sector Risks
    body: >-
      Tamil Nadu accounts for 43% of Veritas Finance's AUM at both March 31, 2025 and December 31,
      2025, with the top three states (Tamil Nadu, West Bengal, and Andhra Pradesh / Karnataka region)
      collectively at 75% as of December 31, 2025 — up from 71% at March 31, 2025. In the DRHP, Veritas
      discloses that 83.02% of its branches and 91.82% of disbursements are concentrated in five states.
      A single state-level event — a severe monsoon season, political disruption, or localized economic
      shock — could disproportionately affect collections across almost half the AUM.

      At the sector level, MSME credit growth moderated to just 3.1% between December 2025 and April
      2026, down sharply from 9.7% the previous year, per CRIF High Mark. Micro borrowers — which
      account for 86% of active MSME loans by count — showed early stress (PAR 31-90 at 2.7% for micro
      versus 0.8% for medium in April 2026). Working-capital loans and public-sector bank portfolios are
      the most stressed segments. While overleveraged microfinance borrowers fell from 35 million
      (September 2023) to 17.1 million (March 2025), indicating partial sector healing, the informal
      MSME segments Veritas serves remain vulnerable to income shocks and crop-cycle volatility. The
      RBI's FSR and sector analysts flag unsecured NBFC MSME lending as the primary systemic stress
      point for FY26, reinforcing the company's own decision to reduce its WCL book.
    claimRefs:
      - CR011
      - CR012
      - CR013
