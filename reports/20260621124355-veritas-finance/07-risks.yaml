callouts:
  - calloutType: risk
    title: "NNPA Approaching CARE's Downgrade Trigger"
    body: >-
      Veritas Finance's net NPA stood at 1.58% at December 31, 2025 — 42 basis points below CARE's
      published negative trigger of 2.00%. With 0+ DPD rising to 5.93% and write-offs doubling YoY,
      the trajectory is adverse. If NNPA crosses 2.00% while ROTA remains below 3.00% on a sustained
      basis, CARE has stated it would downgrade from AA-. Given that ROTA is already at 3.10%
      annualised in 9MFY26, both triggers could be breached simultaneously within 2–3 quarters, which
      would substantially raise borrowing costs and jeopardise the IPO valuation.
    claimRefs:
      - CR001
      - CR002
      - CR006
      - CR007

  - calloutType: risk
    title: "IPO Timing Window Risk — SEBI Approval May Have Elapsed"
    body: >-
      SEBI granted IPO approval on April 29, 2025, valid for 12 months. As of June 21, 2026, no
      IPO launch date has been announced, suggesting the window has elapsed or expired. A re-filing
      would require SEBI to review updated financials incorporating 9MFY26 results that show asset
      quality deterioration. PE investors who planned to exit via the OFS component will face extended
      lock-up, deepening the investor overhang. The ₹600 crore fresh-issue component needed to fund
      growth has also been delayed, increasing dependency on bank refinancing during the gap period.
    claimRefs:
      - CR032
      - CR033
      - CR034
      - CR035

  - calloutType: risk
    title: "Tamil Nadu Concentration — Idiosyncratic Shock Risk"
    body: >-
      With 43% of AUM in Tamil Nadu and no material reduction despite multi-year diversification
      efforts, a state-specific shock — flood, drought, local political unrest, or a state government
      policy affecting informal sector credit — would directly impair nearly half the book. The DRHP
      discloses that 91.82% of disbursements come from just five states. CARE flags this as a
      persistent rating constraint. Until Tamil Nadu's share falls below 35% of AUM and the top-3
      state concentration drops below 65%, geographic risk remains a structural underwriting concern
      that investors should price into expected loss assumptions.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR015

  - calloutType: recommendation
    title: "Priority Diligence Asks Before Investment Decision"
    body: >-
      Investors should obtain: (1) Q4FY26 / Q1FY27 asset quality tape by product, geography, and
      vintage to confirm GNPA stabilisation at ~2.5% or better; (2) current SEBI communication on
      IPO re-filing status and timeline; (3) detailed Tamil Nadu portfolio stress-test (GNPA by TN
      state alone under a 300 bps credit-cost shock); (4) audit of DSA and field-agent compliance
      with RBC Directions 2025; (5) third-party IT security assessment and vendor SLA terms for the
      LMS; and (6) confirmation of succession plan for MD/CEO and senior management retention post-IPO.
    claimRefs:
      - CR006
      - CR033
      - CR011
      - CR025
      - CR049

