      topic: ipo-timing
      missingEvidence: >-
        Confirmation of whether Veritas Finance has filed for a fresh SEBI IPO approval after the
        estimated April 2026 window expiry, and the expected new timeline for IPO launch.
      whyItMatters: >-
        The IPO timing directly affects PE investor overhang, the availability of fresh capital
        for growth, and the valuation context for any new investment.
      diligencePath: >-
        Review Veritas Finance's press releases, SEBI public-issues portal, and direct management
        communication to confirm current IPO filing status and expected launch quarter.
      relatedQuestionRefs:
        - QR029

    - type: missing-source
      severity: material
      topic: asset-quality
      missingEvidence: >-
        Q4FY26 (March 31, 2026) audited or unaudited asset quality data — GNPA, NNPA, DPD buckets,
        and write-offs — is not yet publicly available beyond the December 31, 2025 CARE disclosure.
      whyItMatters: >-
        Whether GNPA stabilised at ~2.5% or continued rising toward CARE's 2% NNPA downgrade trigger
        in Q4FY26 materially changes the risk assessment and IPO readiness judgment.
      diligencePath: >-
        Request Q4FY26 management accounts or audited financials directly from Veritas Finance;
        alternatively, obtain the next CARE press release (expected June–July 2026) for updated data.
      relatedQuestionRefs:
        - QR018

    - type: private-evidence-only
      severity: material
      topic: cybersecurity
      missingEvidence: >-
        Third-party IT security assessment, penetration test results, vendor SLA terms for the
        LMS vendor, and DPDP Act compliance roadmap are not publicly disclosed.
      whyItMatters: >-
        Rising digital collections (now 89.6% of total) and borrower PII concentration in the
        LMS system create growing cybersecurity exposure that is not externally auditable from
        public disclosures alone.
      diligencePath: >-
        Request the most recent penetration-test report, ISO 27001 surveillance audit report,
        vendor SLA documentation, and the company's DPDP Act implementation plan as part
        of due diligence.
      relatedQuestionRefs:
        - QR030

    - type: missing-source
      severity: minor
