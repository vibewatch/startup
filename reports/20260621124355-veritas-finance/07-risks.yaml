  - id: ipo-governance
    title: IPO Timing, Governance, and Key-Person Risks
    body: >-
      Veritas Finance received SEBI approval for a ₹2,800 crore IPO (₹600 crore fresh issue, ₹2,200
      crore OFS) on April 29, 2025, with a 12-month validity window. As of June 21, 2026, the company
      has not announced an IPO open date or price band, meaning the SEBI approval window has elapsed or
      is in its final days. If the company did not launch before the window expired, it must file for
      fresh SEBI approval — re-entering a review process that took approximately three months originally
      — potentially delaying capital infusion further and extending the period of PE investor overhang.
      The OFS component (78.6% of the total issue) signals primary investor exit intent rather than
      growth capital deployment.

      Governance risk is elevated by the absence of an identifiable promoter. D. Arulmany (founder and
      MD/CEO, 25+ years experience) and his relatives hold only 9.56% on a fully diluted basis, while
      PE investors (Norwest, Kedaara, Multiples, BII, Lok Capital) collectively control the majority.
      This PE-dominated cap table creates alignment risk post-IPO: PE sponsors who cannot sell fully
      in the OFS will retain large blocks that may weigh on the public float. DRHP discloses the
      company's dependence on D. Arulmany and the senior management team as a material risk; KMP
      attrition of 11.76% in H1FY25, though low in absolute terms, warrants monitoring given the
      bespoke, relationship-intensive nature of MSME lending in rural geographies.
    claimRefs:
