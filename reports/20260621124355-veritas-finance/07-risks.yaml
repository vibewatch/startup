company:
  name: Veritas Finance Limited

chapter:
  number: 7
  title: Risks
  summary: >-
    Veritas Finance faces a compound risk stack dominated by rising asset quality stress (GNPA 2.89%,
    NNPA 1.58% at Dec 2025), geographic concentration in Tamil Nadu (43% of AUM), heavy dependence on
    bank borrowings (71% of funding), and an active but still-unlaunched SEBI-approved IPO. CARE's
    negative rating triggers — NNPA above 2% and ROTA below 3% on a sustained basis — are approaching:
    ROTA already moderated to 3.10% in 9MFY26. The RBI's 2025 Responsible Business Conduct Directions
    and heightened sector enforcement add regulatory compliance cost and uncertainty, while key-person
    concentration in the founder-CEO and a high employee attrition rate (32–58%) present operational
    continuity risks that must be addressed before the company can safely reach public-market scale.

sections:
  - id: credit-asset-quality
    title: Credit and Asset Quality Risks
    body: >-
      Asset quality is the most proximate financial risk facing Veritas Finance. Gross NPA rose from
      1.79% (FY24) to 2.21% (FY25) and further to 2.89% at December 31, 2025; net NPA climbed to
      1.58% — approaching CARE's published downgrade trigger of NNPA above 2% combined with ROTA below
      3%. Early-delinquency indicators confirm the deterioration is broad-based: 0+ DPD reached 5.93%,
      30+ DPD 4.75%, and 60+ DPD 3.24% at December 31, 2025, versus 4.85%, 3.86%, and 2.65% at
      March 31, 2025 respectively. Write-offs more than doubled from ₹65.22 crore (FY24) to ₹108.22
      crore (FY25), driving credit costs up to 2.31% from 1.73% and compressing ROTA from 4.70% to
      3.98% in FY25, and further to 3.10% annualised in 9MFY26.

      The primary driver of slippage is the unsecured working-capital loan (WCL) segment, which fell
      from 11% to 5% of AUM between FY24 and December 2025 as Veritas deliberately shrank it, yet
      contributed disproportionate defaults. First-time borrowers constitute 24.72% of the loan book
      (Sep 2024), and 47% of the overall portfolio carries less than one year of seasoning as of March
      2025, limiting the reliability of historical default models. CARE expects GNPA to stabilise around
      2.5% near term, with provision coverage at 2.48% of total AUM providing a buffer. Investors should
      monitor whether NNPA crosses 2% before the IPO window closes, as CARE has indicated this would
      trigger a negative rating action.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
