  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Interest Income
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance operates a pure-play lending model: revenue is almost entirely interest income earned on
              an asset portfolio of secured MSME small-business loans (56% of AUM), home loans (19%), LAP-Construction
              (14%), unsecured working-capital loans (7%), and used-vehicle finance (4%) as of March 2025. Total
              interest income rose from ₹1,057 crore in FY24 to ₹1,474 crore in FY25 (+39.4%), driven by a 28.4%
              expansion in the loan book to ₹7,349 crore and by sustaining a relatively high blended yield—implying an
              on-book yield in the low-to-mid 20% range for secured MSME products. Other income (processing fees,
              advisory) contributed ₹77 crore in FY25, a small but growing line.

              Net Interest Income (NII) reached ₹960 crore in FY25 (up from ₹718 crore in FY24), giving a NIM of 14.69%
              by the company's own formula (interest income on loans minus finance cost, divided by average AUM) and
              13.38% by CARE Ratings' equivalent measure. The 80–115 bps NIM compression year-on-year reflected a rising
              cost of funds as bank-borrowing rates firmed and Veritas progressively diversified toward NCDs, while the
              loan yield was partially compressed by a product-mix shift toward longer-tenure home loans (lower yield,
              higher stability). Veritas uses risk-based pricing, with an income-to-instalment cap of 55% and LTV
              limited to below 50% of distressed asset value, which constrains blended yield but provides collateral
              cushion.

              Disbursements grew modestly to ₹3,933 crore in FY25 (FY24: ₹3,702 crore), a slowdown from the 65–89% YoY
              surges of FY23/FY24, reflecting deliberate portfolio-quality tightening in the unsecured working-capital
              segment (WCL exposure cut from 11% to 7% of AUM).
