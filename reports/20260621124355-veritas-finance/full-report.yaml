      - number: '2.2'
        title: Market Sizing — Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              No single authoritative figure captures Veritas' served market; sizing requires multiple lenses applied
              with methodological honesty. Three independent approaches converge on a large but not boundless
              opportunity.

              Lens 1 — MSME credit pool. Total credit outstanding to MSMEs crossed ₹40 trillion as of March 2025,
              growing 20% year-on-year (CRIF High Mark, June 2025). Against a total debt demand of ₹95.6 lakh crore
              (₹95.6 trillion), formal supply is only ₹32.4 lakh crore, leaving an addressable gap of ₹18.3 lakh crore
              (CARE Ratings). This gap is the broadest sizing lens—it overstates Veritas' addressable market because
              most of it sits with formally undocumented businesses that would struggle even with a field-based lender.
              The DRHP's oft-cited ₹103 trillion credit gap (CRISIL, FY24 projection) uses a different methodology
              (total debt demand including trade credit and informal debt) and is not directly comparable to the CARE
              formal-gap estimate; both are preserved here as contradictory but legitimate sizing frames.

              Lens 2 — NBFC micro-LAP and secured MSME. Veritas' core product is micro-Loan Against Property (ticket
              ≤₹10 lakh). This specific segment grew 60% from ₹1 lakh crore to ₹1.6 lakh crore between FY22 and
              September 2024 (CARE). NBFCs hold 45% market share in micro-LAP, far ahead of private banks (26%) and PSU
              banks (11%). The total NBFC MSME AUM is expected to reach ₹5.3 lakh crore by FY26 (CARE), up from ₹3.7
              lakh crore in FY24—a 20% growth projection for the year. Veritas' AUM of ₹7,349 crore as of March 2025
              represents less than 1.7% of the estimated NBFC MSME book, indicating large room for penetration even
              without market expansion.

              Lens 3 — Served addressable market (SAM) construct. Restricting to Veritas' 11-state geographic footprint,
              property-backed product, and ₹0.3–50 lakh ticket range significantly narrows the addressable pool. No
              independent estimate exists for this precise intersection. A conservative construction—applying an ~8–12%
              share of the national NBFC micro-LAP market for states where Veritas operates—implies a SAM in the range
              of ₹12,000–20,000 crore. Veritas' ₹7,477 crore AUM (June 2025) implies roughly 37–62% penetration of this
              narrowly constructed SAM, but the SAM boundary itself is based on imprecise geographic partitioning.

              The affordable housing adjacency (AHFC) is a separate lens. AHFC AUM crossed ₹1.27 lakh crore as of
              December 2024, growing 14% in 9M FY25, with ICRA projecting 20–22% growth in FY25 and FY26. Veritas' home
              loans (19% of AUM, ₹1,396 crore) are a small fraction of this market. The used CV market adds a further
              adjacency.
