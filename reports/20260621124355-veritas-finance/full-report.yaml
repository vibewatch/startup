      - number: '2.5'
        title: Adoption Constraints, Market Risks, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The market's growth trajectory is real, but several structural constraints limit adoption speed and create
              credit-cycle risk.

              Borrower overleveraging is the immediate systemic risk. NBFC-MFI AUM declined 12% in FY25 following a
              surge in borrower indebtedness—borrowers with loans from more than three lenders peaked at 25% in
              September 2024 before guardrail implementation brought it down to 17% by March 2025. The MFI sector's
              total stress pool reached 15.3% in FY25 (ICRA), and there is documented spillover into adjacent micro-LAP
              segments as borrowers who face repayment stress in MFI loans also slow payment on secured loans. Veritas'
              secured-first model mitigates this, but early delinquency indicators have still risen modestly (0+ DPD at
              4.85% in March 2025 vs. 3.61% prior year).

              Documentation gaps are structural. Veritas' borrowers are largely undocumented: no ITR, no audited
              financials, often no GST registration. Field-based credit assessment—while effective when done
              well—requires a dense branch network, limiting geographic expansion speed. New-market branches take 12–18
              months to season, and error rates are higher in geographies unfamiliar to the local credit team.

              Bank funding tightening is a near-term constraint on NBFC balance-sheet growth. Bank lending to NBFCs grew
              at over 35% in early 2023 but slowed to 5.9% by March 2025. This funding compression raises NBFC borrowing
              costs and restricts balance-sheet expansion. NBFCs with stronger capital adequacy and credit ratings
              (Veritas upgraded to CARE AA– in June 2025) are better positioned, but the sector-wide constraint is real.

              RBI's June 2025 relaxation of NBFC-MFI qualifying asset norms (from 75% to 60%) is a pro-competitive
              structural change that allows MFIs greater product diversity, potentially enabling some NBFC-MFIs to enter
              the secured lending space that Veritas occupies—a medium- term competitive threat that is not yet
              reflected in market data.
