      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance is a professionally managed company with no identifiable promoter under SEBI definitions;
              the DRHP accordingly classifies it as promoterless. The company was founded by D. Arulmany, who brings
              over 25 years of financial-services experience spanning Cholamandalam Finance and Aptus Housing Finance,
              and who serves as Managing Director and CEO. He is supported by an experienced C-suite: CFO V G
              Suchindran, COO J Prakash Rayen, President and Chief Business Officer K P Venkatesh, and CTO PS Parthiban
              Sudarson. In 2025 the company appointed Dheeraj Mohan as Chief Strategy Officer and Head of Investor
              Relations, strengthening its pre-IPO institutional engagement.

              The board comprises nine directors: the MD, five independent directors, and three nominee directors
              representing Lok Capital (Priyamvada Ramkumar), Kedaara Capital (Parin Mehta), and Multiples Private
              Equity (Sudhir Narayanankutty Variyar). Raj Vikash Verma (former IRDAI and SEBI member) chairs the board
              as Non-Executive Independent Chairman, providing regulatory expertise. Arulmany and his family held 9.56%
              of shares on a fully diluted basis as of March 2025, indicating meaningful but diluted founder ownership
              with real key-person risk should the founder depart.
