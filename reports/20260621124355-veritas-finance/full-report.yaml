      - number: '7.4'
        title: Operational and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Field operations at the scale Veritas is targeting introduce compounding execution risks. Cash collections
              remained 10.39% of total collections in H1FY25 (down from 47.40% in FY22), and the company disclosed two
              employee fraud instances involving cash misappropriation in the period, totalling ₹1.01 million in losses.
              While isolated, these incidents reflect the inherent difficulty of moving a rural/semi-urban collection
              workforce toward full digital compliance. Employee attrition was 32.09% in H1FY25 and as high as 58.50% in
              FY24, meaning the company constantly trains replacement staff for customer-facing roles while growing its
              branch count at 17%+ annually.

              On the technology side, Veritas uses third-party vendor software for loan origination and NPA management —
              the same platforms used by PSU banks — reducing development risk but creating concentration in a single
              vendor stack. The company is ISO 27001 certified and has not reported known data breaches through
              September 2024. The RBI's IT Governance Directions (November 2023) impose formal governance requirements
              on IT risk management that Veritas must continuously comply with. DSA partners sourced 11.33% of AUM at
              September 2024; any deterioration in DSA underwriting quality would not immediately surface in portfolio
              data, creating a lagged detection risk.

              Geographic expansion into states outside Tamil Nadu — Bihar, Chhattisgarh, Jharkhand — introduces
              unfamiliar local legal and collections infrastructure. Scaling from 434 branches (FY24) to 512 (December
              2025) across 11 states in under two years requires simultaneous credit, legal, and collections capacity
              building, each of which has historically driven attrition spikes in the comparable peers.
