      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Unicorn Mark vs. Public-Market Reality
            body: >
              The Sep 2024 unicorn mark of ₹8,500 crore (3.25x P/B on Sep 2024 book) was set by existing PE investors in
              an internal round — not arm's-length price discovery. With ROTA declining to 3.10% and GNPA rising to
              2.89% since that mark was set, the fundamental support for 3.25x P/B has weakened materially. Listed peer
              Five Star Business Finance trades at 2.08x P/B with ROA 3.5x higher than Veritas Finance's current
              trajectory. A reasonable public-market clearing price is ₹6,000–7,500 crore (2.0–2.5x P/B), implying a
              12–29% discount to the unicorn mark.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV027
              - CV028
          - type: callout
            title: OFS Overhang and Timing Slippage
            body: >
              The ₹2,200 crore OFS (78.6% of IPO proceeds) signals PE investors prioritising exit over company
              capitalisation. More than 17 months elapsed between SEBI approval (April 2025) and the run date (June
              2026) without a price band — an unusual delay that may reflect management's unwillingness to price at a
              discount to the unicorn mark. Any further delay or withdrawal of the IPO would trap existing PE investors
              in an illiquid position, potentially forcing a secondary sale at a steeper discount. Public-market
              investors should treat the delay as a negative signal on current management confidence in the near-term
              financial trajectory.
            calloutType: risk
            claimRefs:
              - CV006
              - CV024
              - CV033
              - CV038
              - CV039
          - type: callout
            title: Diligence Path Before Taking a Position
            body: >
              Before entering at or above the base-scenario range (₹6,400+ crore), investors should require: (1) FY26
              audited financials confirming ROTA ≥ 3.0% and NNPA ≤ 2.0%; (2) the RHP price band to confirm management's
              own view on P/B; (3) Q4FY26 NPA data to confirm the GNPA peak; and (4) a post-IPO AUM growth plan
              justifying the ₹600 crore fresh issue deployment. Entry below 2.0x P/B (≤ ₹6,008 crore) would provide
              meaningful margin-of-safety in the bear scenario.
            calloutType: recommendation
            claimRefs:
              - CV040
              - CV005
              - CV004
              - CV018
