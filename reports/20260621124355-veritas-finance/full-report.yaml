      - number: '5.3'
        title: Technology Infrastructure and Digital Stack
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance describes its approach as "technology as an enabler"—a deliberately modest framing that
              positions technology as accelerating a field-led credit model rather than replacing human judgment. The
              digital loan journey begins with zero-data-entry OCR onboarding that pre-fills applications from KYC
              documents, eliminating manual transcription errors. AI/ML-based underwriting scorecards feed into a
              rule-engine that routes approvals through the appropriate authority tier. E-signatures handle customer
              agreements and document tracking spans collection, vaulting, and return. All disbursements are processed
              digitally via NEFT or RTGS to the borrower's bank account.

              Collections infrastructure is the most technology-intensive part of operations. e-NACH auto- debit
              mandates cover 92.8% of secured borrowers, with UPI QR codes, personalised payment links, and
              WhatsApp-based UPI reminders providing alternative digital channels. A one-time password is sent to
              borrowers at the time of field collection to minimise fraud. An AI/ML predictive default algorithm
              analyses historical repayment data and industry databases to estimate default probability for each
              borrower, directing collections team effort appropriately. Every repayment is acknowledged by a digital
              SMS receipt, creating an auditable trail.

              The core loan lifecycle runs through third-party LOS and LMS platforms used by major PSU banks and leading
              NBFCs—this is a deliberate standardisation choice, sacrificing proprietary differentiation for proven
              reliability, regulatory familiarity, and vendor accountability. The systems cover origination through NPA
              management and run on high-end servers at a data centre with disaster recovery and business continuity
              controls.

              A central data lake aggregates data from lending, financial, collections, and HR systems. This powers
              branch-level dashboards (updated daily) showing metrics like collection efficiency, loan rejection rates,
              bounce rates, and Stage 3 loan counts. Data is collated from branch to area to region to state level,
              enabling real-time performance management. The mobile app, available in seven regional languages, allows
              borrowers to manage EMIs, view loan details, and raise queries by voice. The company is also piloting
              self-onboarding and paperless execution tools for borrower-side digital access to further reduce branch
              visit requirements for returning customers.
