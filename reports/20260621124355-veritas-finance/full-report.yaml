    title: Investment Thesis vs. Anti-Thesis
    columns:
      - Axis
      - Argument
      - What Would Change the View
    rows:
      - - 'Thesis: Market leadership'
        - >-
          Fastest-growing pure-play MSME NBFC by AUM CAGR (41% over 5 years to ₹7,349 crore FY25) with proven
          rural/semi-urban penetration.
        - >-
          Five Star or SBFC accelerating branch expansion into Veritas's South Indian geographies would erode the
          first-mover advantage.
      - - 'Thesis: Credit quality'
        - >-
          AA-; Stable CARE upgrade (June 2025) enables diversified low-cost funding; 509 branches enforce in-house
          sourcing at 88.67%.
        - >-
          A CARE downgrade to A+ — triggered by NNPA > 2% or ROTA < 3% — would raise borrowing costs and compress equity
          multiple.
      - - 'Thesis: Market opportunity'
        - >-
          India's MSME credit gap exceeds ₹530 billion; RBI rate cuts (100 bps in 2025) and improving credit cycle
          underpin long-term demand.
        - >-
          RBI tightening or introduction of stricter NBFC leverage caps would constrain AUM growth and capital
          efficiency.
      - - 'Anti-thesis: Profitability erosion'
        - >-
          ROTA declined from 5.36% (FY23) to 3.10% (9MFY26); GNPA rose from 0.85% (FY22) to 2.89% (Dec 2025), with CARE
          triggers at ROTA < 3% and NNPA > 2%.
        - >-
          ROTA recovering to 3.5%+ and GNPA stabilising below 2.5% for two consecutive quarters would support re-rating
          to base-scenario P/B.
      - - 'Anti-thesis: IPO structure'
        - >-
          OFS of ₹2,200 crore (78.6% of proceeds) means PE investors exit while fresh capital remains limited to ₹600
          crore; 17+ months post-SEBI approval with no price band.
        - >-
          RHP filing with price band, AUM growth plan, and confirmed FY26 profitability stabilisation would de-risk the
          entry point.
    notes: >-
      Thesis/anti-thesis based on public filings, CARE rating reports (June 2025, April 2026), DRHP (January 2025), and
      Q3FY26 quarterly results. Forward-looking statements are analyst estimates.
