  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >
              Veritas Finance has built a compelling franchise: the fastest-growing pure-play MSME NBFC in India by AUM
              CAGR (41% over five years to ₹7,349 crore at FY25), a branch-dense field-underwriting model (509 branches,
              88.67% in-house sourcing), and a CARE AA-; Stable credit rating (upgraded June 2025, reaffirmed April
              2026) that unlocks diversified low-cost funding from banks, mutual funds, and the NCD market. SEBI
              approved the ₹2,800 crore IPO on April 29, 2025, with lead managers HDFC Bank, ICICI Securities, Kotak
              Mahindra Capital, Jefferies India, and Nuvama Wealth Management signalling readiness for institutional
              roadshows. Five marquee PE investors — Norwest Venture Partners, Kedaara Capital, Multiples PE, British
              International Investment, and Lok Capital — collectively underwrote eight equity tranches totalling ₹1,835
              crore, validating the credit model across cycles.

              The anti-thesis is equally sharp. Return on Total Assets (ROTA) has deteriorated from a peak of 5.36%
              (FY23) to 3.98% (FY25) and further to 3.10% annualised in 9MFY26, approaching CARE's stated negative
              trigger of 3.00%. Gross NPA has risen from 0.85% (FY22) to 2.89% (Dec 2025), with NNPA at 1.58% just 42
              basis points below CARE's 2.00% rating trigger. The IPO's OFS-dominant structure (₹2,200 crore OFS, 78.6%
              of total proceeds) means most capital flows to PE investors seeking exits, not to company growth.
              Cost-to-income at 35.2% (FY24) is the highest among CRISIL MI&A peers, setting a structural cost floor
              that limits margin recovery. And as of June 21, 2026 — more than 17 months after SEBI approval — no price
              band or listing date has been announced, a signal that either internal profitability or market timing
              constraints remain unresolved.

              On balance, Veritas Finance merits a "track" recommendation: the franchise and market opportunity are
              genuine but the deteriorating earnings trajectory, elevated NPAs, and the stretched unicorn mark all argue
              for a significant discount relative to the Sep 2024 internal valuation. Public-market investors should
              require evidence of ROTA stabilisation above 3.5% and GNPA containment before committing to the top half
              of the unicorn-mark range.
            claimRefs:
