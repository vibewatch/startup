  - id: TE003
    title: Technology / Operating Architecture — Layer-by-Layer View
    columns:
      - Layer / Process
      - Role in Lending
      - Key Dependency
      - Risk
    rows:
      - - Loan Origination System (LOS)
        - 'Manages lead-to-disbursal workflow: KYC, credit scoring, approval authority routing, e-sign, document vault'
        - Third-party vendor software (used by PSU banks and major NBFCs in India)
        - Vendor concentration; customisation limitations; migration risk if vendor changes terms
      - - Loan Management System (LMS)
        - 'Post-disbursal servicing: EMI tracking, bounce monitoring, NPA classification, branch dashboards'
        - Third-party vendor; separate product-specific LMS instances for each loan business
        - System downtime disrupts collection follow-ups; version upgrade coordination risk across product lines
      - - AI/ML Credit Scorecard
        - Processes 409+ data points; assigns risk score; determines pricing tier and approval authority level
        - Internally developed (launched FY22); credit bureau APIs for external data; field-agent data entry
        - >-
          Model drift if borrower population shifts; explainability gap in loan rejection disputes; data quality
          dependence
      - - e-NACH / UPI Collection Rails
        - Auto-debit mandate via NACH; UPI QR, WhatsApp, personalised link for repayment; OTP fraud prevention
        - NPCI infrastructure (NACH/UPI); individual bank mandate registries; mobile connectivity in rural areas
        - NACH bounce rate ~11% (implied); UPI system outages affect collections; rural connectivity gaps
      - - Data Lake and Analytics Platform
        - >-
          Aggregates data from LOS, LMS, financial, and HR systems; powers branch-to-state dashboards;
          default-prediction algorithm
        - Multi-cloud infrastructure; internal data pipelines; cloud vendor SLAs
        - Data fragmentation if source systems diverge; cloud vendor dependency; PII data concentration risk
    notes: >-
      Architecture based on DRHP (p. 228–245), Annual Report FY25 (technology section), and CARE Ratings January 2025
      report (MIS/LMS description). Third-party vendor identity not disclosed publicly. Bounce rate estimate derived
      from 92.80% NACH/UPI coverage minus reported 89.61% digital collection efficiency.
