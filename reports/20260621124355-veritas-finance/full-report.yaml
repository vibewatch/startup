  - id: FE001
    title: Veritas Finance — Technology Stack Architecture
    type: stack
    layout: wide
    summary: >-
      End-to-end technology layers from borrower interface through core lending operations to infrastructure, showing
      how Veritas Finance's digital-first and field-anchored model is implemented across seven system layers.
    data:
      layers:
        - label: Borrower Interface
          detail: >-
            Borrower-facing touchpoints: mobile app (7 regional languages, voice queries), branch walk-in, relationship
            manager field visit, WhatsApp UPI reminders
          modules:
            - Mobile App — 7 regional languages, EMI management, voice queries
            - Branch Walk-In — primary acquisition and query resolution channel
            - Relationship Manager Visit — home/business origination and weekly WC collection
            - WhatsApp-Based UPI Reminders — digital nudge for upcoming EMI due dates
        - label: Origination and KYC
          detail: >-
            Digital onboarding layer: zero-data-entry OCR pre-fills applications from KYC documents; eKYC via Aadhaar;
            bureau auto-checks; geo-tagged field photographs
          modules:
            - Zero-Data-Entry OCR — pre-fills application from government KYC photos
            - Aadhaar / India Stack eKYC — paperless identity verification
            - Credit Bureau Auto-Check (CIBIL) — negative profile filter at lead stage
            - Geo-Tagged Field Photographs — business-place and property evidence sealed digitally
        - label: Credit Decisioning
          detail: >-
            Proprietary AI/ML scorecard (409+ data points, digitally sealed) feeds a rule-engine that routes approvals
            through 2–4 tier maker-checker hierarchy and sets risk-based pricing
          modules:
            - AI/ML Scorecard — 409+ data points; risk score; launched FY22
            - Rule-Engine Credit Approval Workflow — authority-tier routing by score and loan size
            - Risk-Based Pricing Engine — VPLR-linked rate or fixed rate by risk band
            - Maker-Checker Approval — 2–4 levels based on loan amount
        - label: Legal and Technical Verification
          detail: >-
            In-house legal and technical teams perform property title search, ownership verification, technical
            valuation, and LTV assessment for all secured products; external sourcing used for housing segment
          modules:
            - In-House Legal Team — title search, ownership documents, lien creation
            - In-House Technical Team — property valuation, LTV calculation, distressed value
            - External Legal/Technical (Housing) — additional layer for affordable home loans
            - E-Sign and Document Vault — agreements signed digitally; documents tracked to vault
        - label: LOS / LMS Core Platforms (Third-Party Vendor)
          detail: >-
            Third-party LOS and LMS (vendor undisclosed; used by PSU banks and leading NBFCs) cover the full lending
            lifecycle: origination, disbursement, servicing, EMI tracking, and NPA management
          modules:
            - Loan Origination System — lead to disbursal workflow management
            - Loan Management System — EMI tracking, bounce monitoring, NPA classification
            - Core Financial and Treasury Systems — balance sheet, ALM, liquidity management
            - HR Systems — employee records, payroll, field-agent tracking
        - label: Collections and Recovery
          detail: >-
            Digital-first collections: e-NACH auto-debit (92.8% coverage), UPI QR/WhatsApp/link channels, AI predictive
            default algorithm, and 3-tier escalation (tele-call → field → in-house legal)
          modules:
            - e-NACH Auto-Debit Mandate — covers 92.8% of secured borrowers
            - UPI QR Code / Personalised Link / WhatsApp — alternative digital repayment rails
            - AI/ML Predictive Default Algorithm — anticipates default risk; guides collections priority
            - 3-Tier Escalation — Tele-Call → Field Collection → In-House Legal Recovery
        - label: Data and Infrastructure
          detail: >-
            Central data lake aggregates all system data; branch-to-state dashboards updated daily; hybrid on-premise
            and multi-cloud infrastructure with ISO 27001:2022 certification and real-time DR backup
          modules:
            - Central Data Lake — aggregates lending, financial, HR, collections data
            - 'Branch-to-State Dashboards — daily metrics: bounce rate, collection efficiency, Stage 3'
            - Hybrid On-Premise + Multi-Cloud — resilient infrastructure with real-time DR sync
            - ISO 27001:2022 + Monthly Security Audits — information security certification
    approximationNotes: >-
      Third-party LOS/LMS vendor identity not publicly disclosed. Layer descriptions derived from DRHP technology
      section (p. 228–235) and Annual Report FY25.
    claimRefs:
      - CE019
      - CE021
      - CE025
      - CE026
      - CE030
      - CE031
