      - number: '7.2'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance operates in one of India's most heavily regulated sectors. As a Systemically Important
              Non-Deposit Taking NBFC with AUM exceeding ₹5,000 crore, it is subject to the full suite of RBI
              Scale-Based Regulations, including minimum CRAR of 15%, Tier-1 CAR of 10%, and Liquidity Coverage Ratio
              compliance — all of which it currently meets (CAR 34.85%, LCR 270.94% at Jan–Mar 2026). However, the
              regulatory environment has become markedly more demanding in 2025–26.

              The RBI's Non-Banking Financial Companies — Responsible Business Conduct Directions, 2025 impose new
              requirements on disclosures, interest rate transparency, fair collection practices, Key Facts Statement
              issuance, and digital "dark pattern" prohibition. Further amendments effective July 2026 expand
              consumer-protection obligations. These directions add compliance cost and create audit risk for any NBFC
              whose field collection or DSA practices are not already standardised. Additionally, the RBI canceled
              Certificates of Registration for 135 NBFCs in a 2026 sector sweep, signaling a zero-tolerance approach to
              compliance lapses. While Veritas has not been named in any enforcement action, the elevated sector
              scrutiny raises the cost of non-compliance materially.

              On the legal side, the DRHP discloses 5 criminal cases against Veritas and 3,227 criminal proceedings
              initiated by the company (mostly NI Act cheque-dishonour cases against defaulting borrowers). There are no
              quantifiable statutory or material civil claims against the company or its directors. The company has
              disclosed delayed payment of statutory dues in the past. RBI undertakes periodic on-site inspections; any
              observation letter with adverse findings would require remediation before the IPO can proceed.
