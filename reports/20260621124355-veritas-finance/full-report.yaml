            body: >-
              Tamil Nadu accounts for 43% of Veritas Finance's AUM at both March 31, 2025 and December 31, 2025, with
              the top three states (Tamil Nadu, West Bengal, and Andhra Pradesh / Karnataka region) collectively at 75%
              as of December 31, 2025 — up from 71% at March 31, 2025. In the DRHP, Veritas discloses that 83.02% of its
              branches and 91.82% of disbursements are concentrated in five states. A single state-level event — a
              severe monsoon season, political disruption, or localized economic shock — could disproportionately affect
              collections across almost half the AUM.

              At the sector level, MSME credit growth moderated to just 3.1% between December 2025 and April 2026, down
              sharply from 9.7% the previous year, per CRIF High Mark. Micro borrowers — which account for 86% of active
              MSME loans by count — showed early stress (PAR 31-90 at 2.7% for micro versus 0.8% for medium in April
              2026). Working-capital loans and public-sector bank portfolios are the most stressed segments. While
              overleveraged microfinance borrowers fell from 35 million (September 2023) to 17.1 million (March 2025),
              indicating partial sector healing, the informal MSME segments Veritas serves remain vulnerable to income
              shocks and crop-cycle volatility. The RBI's FSR and sector analysts flag unsecured NBFC MSME lending as
              the primary systemic stress point for FY26, reinforcing the company's own decision to reduce its WCL book.
