    summary: >-
      Three nested market lenses narrow from India's ₹18.3 lakh crore formal MSME credit gap (TAM), to the NBFC MSME
      addressable pool (₹5.3 lakh crore by FY26), to Veritas' own current AUM as an indicative SOM proxy.
