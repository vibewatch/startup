      - number: '8.4'
        title: Bull / Base / Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >
              Valuation scenarios are anchored to the December 31, 2025 net worth of ₹3,004 crore (Q3FY26), the most
              recent available figure as of the run date. FY26E net worth is estimated at approximately ₹3,100–3,250
              crore by adding one additional quarter of earnings (~₹90–100 crore, extrapolated from Q3FY26 PAT of ₹81.76
              crore) to the Q3FY26 base — these are estimates absent the audited FY26 annual report, which would be the
              preferred anchor once available.

              In the bull scenario (P/B of 2.8–3.2x), AUM growth recovers to 25%+ in FY27 driven by a broader NBFC
              credit cycle recovery, ROTA stabilises at 3.5%+ on lower credit costs as the WCL portfolio runs off, and
              the CARE rating maintains AA-. The implied equity value is ₹8,960–10,240 crore, consistent with or
              modestly above the unicorn mark. This scenario requires that GNPA peaks by Q4FY26 and NNPA does not breach
              the 2% trigger.

              In the base scenario (P/B of 2.0–2.5x), AUM grows 15–20% in FY27, ROTA stabilises near 3.0–3.5%, and GNPA
              is contained at 3.0–3.5%. The implied equity value is ₹6,400–8,000 crore, representing a 6–25% discount to
              the unicorn mark — a rational pre-IPO discount for the profitability trajectory and IPO timing
              uncertainty. This is the most likely outcome assuming no further credit stress.

              In the bear scenario (P/B of 1.5–1.8x), ROTA falls below 3.0% on a sustained basis, NNPA exceeds 2.0%,
              CARE downgrades from AA- to A+, and AUM growth stalls below 15% as capital allocation is prioritised for
              provisioning over disbursements. The implied equity value falls to ₹4,800–5,760 crore — a 32–44% haircut
              from the unicorn mark. The bear scenario is not implausible: ROTA was 3.10% annualised in 9MFY26 and NNPA
              was 1.58% at December 2025, leaving a narrow buffer before both triggers are breached simultaneously. A
              sensitivity table (FV002) shows how each ±50 bps of ROTA change drives approximately ±0.3x of P/B
              re-rating based on the Five Star ROTA-to-P/B relationship observed across peers.
            claimRefs:
