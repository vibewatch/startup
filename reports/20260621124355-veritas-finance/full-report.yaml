            title: Credit Gap Framing Requires Methodological Honesty
            body: >-
              The DRHP's ₹103 trillion MSME credit gap (CRISIL, FY24) and CARE Ratings' ₹18.3 lakh crore formal
              addressable gap are not different estimates of the same thing. The DRHP uses total debt demand including
              trade credit and informal borrowing; CARE measures the gap between formal supply and bankable demand.
              Analysts should use the CARE figure as the addressable market for formal NBFC entry; the DRHP figure is
              the broader social financing need. Veritas' own AUM (₹7,477 crore, June 2025) is small against either
              measure.
