  - id: A
    title: Valuation Scenarios and Base-Case Anchor
    blocks:
      - type: paragraph
        body: >-
          Three valuation scenarios were modelled using P/B multiples applied to the December 2025 net worth of ₹3,004
          crore as anchor: Bear (₹4,506 crore, 1.5x P/B), Base (₹6,000–7,500 crore, 2.0–2.5x P/B), and Bull (₹9,012
          crore, 3.0x P/B, requiring ROTA recovery to ≥4.5% and GNPA below 2.0%). The unicorn reference mark of ₹8,500
          crore (~2.83x Dec 2025 book) falls between the Base and Bull scenarios, consistent with the stretched
          valuation stance. Entry at or below 2.0x P/B (≤₹6,008 crore) provides a meaningful margin of safety in the
          bear scenario.
