      - number: '6.5'
        title: Retention, Credit Behaviour, and Durability
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance does not disclose NRR, GRR, or loan renewal cohort data because these constructs apply to
              subscription/B2B products, not retail micro-lending. The closest proxies are DPD (days past due) trends
              and GNPA ratios, which reflect the current-period repayment behaviour of the outstanding borrower base.

              The 0 DPD loan book stood at ₹61,994.27 million (approximately 95.12% of AUM) as of September 2024 —
              meaning roughly nineteen in twenty borrowers had no overdue on any given measurement date. Gross NPA
              improved from 3.94% (FY2022) to 2.19% (FY2023), 1.79% (FY2024), and 1.95% (H1 FY2025 / September 2024),
              before rising to 2.21% (FY2025) and 2.89% (December 2025), driven primarily by slippages in the unsecured
              working capital segment and some broader MSME micro-borrower stress.

              The WCL stress arose as urban shopkeepers who had taken digital loans at materially higher interest rates
              from other lenders became over-indebted and struggled to service Veritas's loans. The company responded by
              reducing its unsecured exposure from 11% (FY2024) to 7% (FY2025) and further to 5% (December 2025),
              tightening WCL underwriting, and sourcing better-quality customers. CareEdge Ratings expects GNPA to
              stabilise near 2.5% on a going-forward basis, supported by adequate provisioning (overall PCR of 2.19% as
              of March 2025).

              Portfolio seasoning is limited: 47% of AUM had vintage below one year as of March 2025 (down from 58% at
              March 2024), and 33% had vintage of 1–2 years, leaving only 20% with three or more years of track record.
              This under-seasoning means the currently reported GNPA likely understates the long-run normalised credit
              cost, a standard risk for rapidly growing micro-lenders. Write-offs increased from ₹65.22 crore (FY2024)
              to ₹108.22 crore (FY2025).
