      - number: '3.4'
        title: Status Quo and Informal Alternatives
        blocks:
          - type: paragraph
            body: >-
              The most structurally important competitive substitutes for Veritas are not formal NBFCs but informal
              credit channels that currently serve the majority of rural and semi-urban MSME demand. Local moneylenders
              — the dominant substitute in rural India — charge 36–50%+ per annum, impose no documentation requirements,
              and disburse within hours. Their competitive advantage is speed, personal relationship, and zero
              paperwork; their disadvantage is predatory pricing and lack of regulated protection for borrowers.
              Veritas' yield of 22–23% is therefore not high by comparison to the informal baseline: it represents a
              discount to moneylenders while remaining far above the PSB rate floor.

              Chit funds, rotating savings-and-credit associations particularly prevalent in South India (Tamil Nadu,
              Andhra Pradesh, Telangana), serve as both savings and credit instruments for informal MSME operators. A
              chit fund operator charges a discount on the pot (typically 5–30% of corpus) distributed across the group,
              delivering effective credit costs in the 20–30% range on a use-of-funds basis — comparable to Veritas' IRR
              but without collateral requirements. The absence of regulatory oversight and the social-group dynamic make
              chit funds a culturally embedded substitute that formal NBFCs must displace through demonstrated
              convenience and product fit rather than pricing alone.

              PSBs and scheduled commercial banks represent the formal low-cost substitute, with MSME LAP rates starting
              from approximately 8–10.5% per annum for well-documented borrowers (SBI, PNB, Indian Bank). However, their
              documentation requirements — ITR, formal balance sheets, registered business entities — systematically
              exclude the cash-based, informally documented MSME segment that constitutes Veritas' core borrower pool.
              The formality gap is the structural barrier that protects Veritas' yield premium against PSB competition.

              Self-funding (internal cash flows) and family capital remain the first-resort credit source for many
              micro-enterprises. No formal pricing, no collateral, zero transaction cost — but also a hard ceiling on
              credit quantum that limits business growth to self-generated cash. Veritas captures borrowers at the point
              where growth aspirations exceed internal capital, making this the primary funnel from informal to formal
              credit.
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
