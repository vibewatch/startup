      - number: '6.6'
        title: Concentration Risks and Adverse Factors
        blocks:
          - type: paragraph
            body: >-
              Four structural risks warrant diligence attention. First, geographic concentration: Tamil Nadu alone
              accounts for 43% of AUM as of both March 2025 and December 2025. Any political disruption, natural
              disaster (floods, cyclones), or credit event concentrated in Tamil Nadu could materially impair the
              portfolio. CARE Ratings flags this persistently. The top-three states (Tamil Nadu, AP, Telangana) held 75%
              of AUM at December 2025, limiting the diversification value of newer geographies.

              Second, borrower vulnerability: the DRHP explicitly discloses that Veritas's borrowers are "relatively
              high credit-risk" due to vulnerability to adverse economic conditions, limited formal-sector
              participation, and exposure to income shocks from business failures, health emergencies, and natural
              calamities. A macro downturn, crop failure in a key southern state, or health shock to an income-earning
              household member can impair a borrower with no alternative formal credit safety net.

              Third, macro-sector stress: CRIF High Mark data (April 2026) shows MSME credit growth slowed to 3.1%
              between December 2025 and April 2026 (versus 9.7% a year prior), with micro-segment outstanding loans
              contracting 3.1% and early-stage delinquencies rising. PAR 31-90 for micro borrowers stood at 2.7% in
              April 2026. This external headwind is material given Veritas's focus on the micro/small segment.

              Fourth, overleveraging risk in the broader microfinance and informal lending ecosystem: TransUnion CIBIL
              data shows delinquency among MSME borrowers with exposure below ₹10 lakh rose to 5.8% (March 2025) from
              5.1% (March 2024), even as overall MSME portfolio quality improved. Veritas's borrower profile overlaps
              substantially with this vulnerable cohort, and any recurrence of the urban digital-lending-triggered
              overleveraging seen in WCL in FY2025 could replicate in other geographies.

              The company's mitigants — sub-50% LTV secured collateral, in-house sourcing at 88.67%, proactive reduction
              of unsecured exposure, and mandatory e-NACH enrolment — are substantive but do not eliminate these risks.
              The customer base's relative isolation from formal institutional credit remains a double-edged sword: it
              creates the market opportunity but also limits the borrower's financial resilience when shocks occur.
            claimRefs:
              - CU042
              - CU043
              - CU044
              - CU045
              - CU046
              - CU047
              - CU048
      - number: '6.7'
        title: Exhibits
        blocks:
          - type: callout
            title: In-Production Scale with 211,000 Borrowers at Sub-2% GNPA Through FY2024
            body: >-
              Veritas Finance has built a fully in-production, revenue-generating retail NBFC with 211,389 active
              borrowers and ₹7,349 crore AUM by March 2025. The GNPA trajectory from 3.94% (FY2022) to 1.79% (FY2024)
              demonstrated that rapid growth was not achieved at the cost of credit quality during the core expansion
              phase. This track record of sub-2% GNPA at scale validates the 'AAA filter' model.
            calloutType: strength
            claimRefs:
              - CU002
              - CU037
          - type: callout
            title: Geographic and Sector Concentration Create Tail Risk
            body: >-
              Tamil Nadu at 43% of AUM, with the top-three states at 75%, means a regional credit event, natural
              disaster, or policy change in one state could impair a quarter or more of the portfolio. Combined with the
              structural vulnerability of rural micro-borrowers to income shocks, and a rising GNPA trajectory from
              FY2025 (2.21%) through December 2025 (2.89%), this concentration risk warrants a specific geo-stress
              scenario in due diligence.
            calloutType: risk
            claimRefs:
              - CU042
              - CU043
              - CU045
          - type: callout
            title: Borrower Vulnerability Is the Business Model's Structural Trade-Off
            body: >-
              Veritas Finance's competitive moat is precisely its willingness to lend to borrowers that formal banks
              decline. This same trait — informal income, limited documentation, geographic remoteness, new-to-credit
              status — makes the borrower base inherently fragile to income shocks, overleveraging, and macro downturns.
              The 2025 WCL segment stress (urban shopkeeper digital-loan overhang) is a preview of what could happen in
              the secured segment if a macro shock arrives. Investors must hold the financial- inclusion mission and the
              elevated credit-cost baseline as two sides of the same coin.
            calloutType: insight
            claimRefs:
              - CU044
              - CU045
              - CU046
