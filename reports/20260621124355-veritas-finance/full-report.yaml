      - number: '4.2'
        title: Profitability and Operating Performance
        blocks:
          - type: paragraph
            body: >-
              Veritas has been profitable every year since FY19, with a consistent ROTA above 3%—a threshold used by
              CARE Ratings as a negative trigger. In FY25, PAT on a pre-OCI basis was ₹295.11 crore (post-OCI: ₹292.19
              crore), up 20.4% from ₹245.05 crore in FY24 and continuing a five-year earnings trajectory from ₹33 crore
              in FY20. The PBT margin compressed from 28.90% to 24.93% of total income in FY25, principally because
              credit costs rose 90% to ₹171 crore (FY24: ₹90 crore) while total revenue grew only 39.5%. Finance costs
              surged 53.6% to ₹483 crore, reflecting both AUM growth and wider funding spreads.

              Offsetting these headwinds, the operating expense ratio improved to 6.94% in FY25 from 7.45% in FY24,
              demonstrating operating leverage as the branch network scaled to 508 branches and headcount to 7,796. ROTA
              settled at 3.91–3.98% (AR vs. CARE computations differ by formula) and ROE at 11.43–11.52%, both slightly
              lower than FY24 peaks of 4.67–4.70% and 12.27–12.50% respectively. The trajectory into FY26 is softer:
              Q1FY26 (unaudited) showed PAT of ₹62 crore and annualised ROTA of ~2.9%, driven by higher credit costs in
              the unsecured portfolio. Q3FY26 improved sharply to PAT of ₹82 crore (total income ₹462 crore), with
              nine-month FY26 PAT of ₹211 crore vs. ₹202 crore for nine months of FY25. The net worth reached ₹3,004
              crore by December 2025. Basic EPS progressed from ₹19.04 (FY24) to ₹22.44 (FY25) and ₹16.08 for nine
