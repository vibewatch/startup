      - number: '4.4'
        title: Capital Adequacy and Funding Structure
        blocks:
          - type: paragraph
            body: >-
              Veritas runs a well-capitalised balance sheet by NBFC standards. Total CAR and Tier-1 CAR both stood at
              37.82% at FY25 (FY24: 41.49%), comfortably above the regulatory minima of 15% (total) and 10% (Tier-1)
              mandated by the RBI. CAR recovered to 38.34% by Q1FY26, reflecting the Q2FY25 equity raise. Tangible net
              worth grew from ₹2,279 crore (FY24) to ₹2,710 crore (FY25), supporting gearing of 2.08x—well within CARE's
              negative trigger of 3x. Q3FY26 gearing was 2.20x on net worth of ₹3,004 crore. CARE notes that current
              capitalisation is adequate for medium-term growth plans with net gearing staying below 3x.

              The funding profile is moderately diversified but still bank-heavy. As of March 2025, bank borrowings
              accounted for 68.23% of total borrowings (down from 76.53% in FY24), NCDs 10.10% (including 2.74% from
              foreign investors), securitisation 13.80%, NBFC term loans 4.26%, and commercial paper for liquidity
              management. By June 2025, the mix held broadly steady: banks 67.10%, NCDs 10.08%, securitisation 15.54%,
              NBFC 3.81%. Total borrowings at FY25 were ₹5,629 crore (FY24: ₹3,996 crore), a 40.9% increase aligned with
              AUM growth.

              Liquidity is reported as adequate: unencumbered cash equivalents of ₹906 crore (FY25) and ₹846 crore
              (Q1FY26), plus liquid investments of ₹171–175 crore and un-availed credit lines of ₹264–357 crore.
              Near-term debt obligations (principal) under one year were ₹1,874 crore at FY25 and ₹2,061 crore at
              Q1FY26, covered by liquid assets plus expected AUM runoff. The company raises funds via bank term loans,
              NCDs (domestic and foreign), securitisation to mutual funds, and CP for short-term liquidity. The ability
              to diversify the funding base further and reduce the bank-borrowing concentration is flagged by CARE as a
              key determinant of future cost of funds and profitability.
