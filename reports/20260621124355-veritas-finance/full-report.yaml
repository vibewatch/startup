      - number: '1.4'
        title: Scale, Milestones, and Financial Performance
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance has grown from a single-state lender in Tamil Nadu in 2015 to an 11-state, 508-branch
              (including 117 service centres) operation by March 2025, employing 7,796 people and serving over 2 lakh
              customers. AUM reached ₹7,349 crore at March 2025 (28% YoY growth), up from ₹5,724 crore in FY24, against
              a 41% five-year CAGR validated by CARE Ratings. CRISIL MI&A identified Veritas as the fastest-growing NBFC
              in AUM terms at a 61.76% CAGR between FY22 and FY24.

              FY25 total revenue was ₹1,557.40 crore and profit after tax (post OCI) was ₹292.19 crore, with net worth
              reaching ₹2,783.17 crore and borrowings of ₹5,629.24 crore. Capital adequacy ratio stood at 37.82%, far
              above the 15% regulatory floor. Asset quality saw slight moderation: GNPA was 2.21% and NNPA was 1.10% at
              March 2025, widening to 2.81%/1.41% by June 2025, driven by stress in the unsecured working capital loan
              book (reduced to 7% of AUM from 11%). CARE upgraded the long-term rating to AA- Stable in June 2025. For
              Q3FY26 (October-December 2025) total income was ₹46,183 lakhs with PAT of ₹8,176 lakhs; net worth reached
              ₹3,004 crore and debt-equity ratio was 2.20 by December 2025. Sector-level risks persist: RBI's June 2025
              Financial Stability Report noted NBFC retail GNPA at 3.1% versus banks' 1.2%, and flagged bank funding
              growth to NBFCs slowing from 35% (March 2023) to 5.9% (March 2025), tightening funding access for mid-tier
              lenders.

              Geographic concentration remains an area of risk: Tamil Nadu alone accounts for 43% of AUM and the top
              three states account for 71%, even as the company expanded into Bihar and Chhattisgarh in FY24.
