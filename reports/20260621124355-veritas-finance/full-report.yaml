    rows:
      - - Obtain secured MSME business loan
        - Bank branch visit; documentation-heavy; credit history required; rejection likely for informal businesses
        - Branch field visit + OCR KYC + AI scorecard + branch credit approval; average 5–7 day TAT
        - 100% digital sourcing; first-time borrowers served at scale; borrower base grew 56.68% CAGR FY22–FY24
        - Manual field visit per loan creates cost floor; cannot scale to very small ticket sizes economically
      - - Finance home construction or purchase
        - Bank mortgage with strict income and title documentation requirements
        - >-
          Affordable home loan with household income assessment; long tenors up to 15 years; covers partially-built
          properties
        - Covers underserved segment with informal income; 99.97% collection efficiency in FY24
        - Requires external legal/technical valuation (housing segment); adds TAT and third-party risk
      - - Buy a used commercial vehicle
        - Informal moneylender at high unstructured rates; or dealer-arranged finance with limited underwriting
        - Used CV loan secured on vehicle; branch credit officer verifies vehicle; formal repayment via e-NACH
        - Builds formal credit track record; below-market structured pricing at ~19.25% yield
        - Less than 2 years seasoning; vehicle depreciation risk; repossession and resale uncertain in rural markets
      - - Access short-term working capital
        - Rotating credit chits, informal moneylenders, or merchant credit from suppliers
        - Unsecured working capital loan with weekly repayment; relationship manager visits every week
        - Quick disbursal; structured repayment builds credit track; 27.03% yield compensates unsecured risk
        - Weekly field collection is operationally intensive; highest NPA rate; cash collection fraud risk
      - - Repay loan instalment
        - Branch visit, post-dated cheque, or cash handover
        - e-NACH auto-debit or UPI payment via QR code, personalised link, WhatsApp request; SMS receipt
        - 89.61% digital collections as of H1FY25; SMS receipt provides audit trail for every payment
        - 10.39% still cash-based; OTP-verified field collection required for bounce recovery
