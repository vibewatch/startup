      - number: '5.2'
        title: Underwriting Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance's underwriting model is intentionally distinct from document-and-score-based bank lending.
              The core philosophy is to assess actual income-earning capacity and repayment willingness through on-site
              verification rather than relying on formal documentation or credit bureau scores as the primary gate. This
              is operationalised through the proprietary "triple AAA filter" evaluated by branch credit managers: (i)
              residence check, where KYC documents are verified and qualitative lifestyle information is gathered; (ii)
              business-place check, where the nature of the borrower's business is confirmed, customer footfall and
              stock visually assessed, and neighbour references collected with geo-tagged photographs; and (iii)
              property check, where the proposed collateral is technically and legally assessed for ownership, technical
              parameters, and market value by in-house legal and technical teams.

              These three checks feed into a credit scorecard that digitally records 409 data points per borrower
              assessment. Each data point is electronically sealed and signed with the credit manager's employee ID to
              prevent tampering. The scorecard assigns a risk score that feeds into a rule-engine-based credit approval
              workflow determining pricing authority and disbursement approvals. Different loan businesses (Rural
              Business vs. Working Capital) use different data points and weights within the same framework.

              Credit approval follows a two-to-four-level maker-checker hierarchy: loans up to ₹0.5 million require two
              levels (sales manager + branch manager); ₹1–2.5 million need a third level (credit manager); ₹2.5 million
              and above escalate to a cluster or regional credit manager. This authority delegation is risk-calibrated
              and prevents concentration of decision-making at branch level for larger exposures.

              Post-sanction, borrowers register an e-NACH mandate before disbursement, ensuring 92.80% of secured
              borrowers have an automated repayment path. Sales managers retain collection responsibility for the
              initial loan period, aligning origination quality with repayment outcomes. This operational design—heavy
              on human judgment and field presence but codified in a digital scorecard—is the primary source of credit
              quality differentiation and also the primary constraint on per-branch scalability.
            claimRefs:
              - CE011
              - CE012
