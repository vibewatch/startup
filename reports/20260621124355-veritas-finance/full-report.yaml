      - number: '5.5'
        title: Differentiation, Roadmap, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              The core differentiation of Veritas Finance's product and technology model lies in the integration of
              field-intelligence with data science: the proprietary credit scorecard was developed entirely in-house
              (launched FY22), captures 409+ data points per borrower including qualitative field observations, and uses
              AI/ML models to translate community-level economic signals into risk scores that banks' purely
              document-based models cannot replicate. The risk-based pricing engine links the borrower's credit score
              output to a lending rate via the Veritas Prime Lending Rate (VPLR) framework, enabling granular
              profitability management at the loan level rather than at product-segment level.

              The 10-year product evolution shows disciplined cadence: the company spent its first seven years
              perfecting the Rural Business Loan model and building the branch infrastructure before introducing Home
              Loans (FY23) and Used CV Loans (FY24). Each new product reuses the existing branch network, collections
              team, and data lake architecture, limiting marginal fixed-cost escalation. The used vehicle finance
              product—now at ₹300+ crore AUM within its first full year—validates the distribution model's versatility
              across asset classes.

              Key operational risks and limitations are material: (i) third-party LOS/LMS dependency means a vendor
              failure can disrupt the entire origination and servicing pipeline; (ii) cash collections at 10.39% of the
              book expose the company to employee fraud—two incidents were disclosed in the DRHP; (iii) the manual
              field-visit model for credit appraisal, while quality-enhancing, creates a structural cost floor per loan
              that limits the addressable customer segment at very small ticket sizes; (iv) geographic concentration
              (83%+ disbursements in three southern states) means technology investments cannot easily substitute for
              dense local branch presence in new states; (v) the used CV loan and home loan books lack a full credit
              cycle and do not yet provide statistically stable defaults data for model calibration. The company's
              stated roadmap—Vision 2028 targeting ₹10,000 crore AUM—relies on sustained branch expansion and continued
              product diversification, with technology primarily in a supporting role.
            claimRefs:
