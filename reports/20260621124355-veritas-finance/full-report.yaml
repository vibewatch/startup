              Despite expansion into 11 states and one union territory, Tamil Nadu remains dominant at 43% of AUM as of
              March 2025, with the top three states (Tamil Nadu, West Bengal, Karnataka) collectively representing 71%.
              Any localised economic shock, monsoon stress, or political disruption in Tamil Nadu could
              disproportionately affect asset quality and collections. CARE Ratings flags geographic concentration as a
              persistent key weakness.
