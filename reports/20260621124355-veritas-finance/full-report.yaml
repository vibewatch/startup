      - number: '1.3'
        title: Capital Structure and Investors
        blocks:
          - type: paragraph
            body: >-
              Since inception Veritas Finance has raised ₹1,835 crore in cumulative equity across seven tranches: ₹31
              crore (FY16, Sarva Capital and Caspian Impact), ₹120 crore (FY18, CDC Group and Lok Capital), ₹260 crore
              (FY19, Norwest Venture Partners and existing investors), ₹350 crore (FY20, Kedaara Capital and existing
              investors), ₹440 crore (FY22, existing investors), ₹492 crore (FY24, Multiples PE-led ₹1,200 crore raise
              with Avendus FLF; ₹400 crore primary), and ₹141 crore (FY25). In September 2024 a ₹240 crore internal
              round from Lok Capital, Evolvence, and Avendus FLF partly converted previously issued partly-paid shares,
              implying a valuation of approximately ₹8,500 crore (~$1 billion), granting Veritas unicorn status.

              On a fully diluted basis as of March 2025, Norwest Venture Partners X is the largest shareholder at
              21.23%, followed by Multiples PE and affiliates at 15.97%, Kedaara Capital at 14.83%, Lok Capital and
              affiliates at 13.86%, BII (British International Investment) at 10.16%, and Avendus FLF at 2.85%. On
              January 18, 2025 Veritas filed a DRHP with SEBI for an IPO of ₹2,800 crore (₹600 crore fresh issue, ₹2,200
              crore offer for sale by Norwest, Kedaara, BII, Lok Capital, and Growth Catalyst Partners). SEBI granted
              its observations on April 29, 2025 with proposed listing on BSE and NSE; the IPO had not launched as of
              the run date of this report.
