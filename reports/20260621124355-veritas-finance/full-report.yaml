  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Borrower Profile
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance is a retail NBFC; every one of its 211,389 FY2025 borrowers is an individual or
              micro/small enterprise, not a corporate. The borrower universe spans four distinct product archetypes that
              differ substantially by income level, collateral type, documentation availability, and cash-flow pattern.

              Rural Business Loans (56% of AUM, FY2025) constitute the core franchise. Target borrowers are
              self-employed micro and small enterprises — traders, shopkeepers, artisans, small manufacturers, and
              home-based workers — located in rural and semi-urban areas and earning ₹25,000–₹80,000 per month. These
              customers typically lack formal income documents such as GST filings, ITRs, or audited accounts. Average
              business vintage at loan origination is approximately 11.93 years, indicating established, if informal,
              enterprises. Loan amounts range from ₹30,000 to ₹50 lakh with the majority in the ₹2–5 lakh band;
              collateral is self-occupied residential property with loan-to-value (LTV) capped below 40–50% of
              distressed asset value. The sub-segment of LAP-Construction (LAP-C) loans (14% of AUM) serves the same
              borrower profile but finances home self-construction on owned plots rather than business working capital.

              Affordable Home Loans (19% of AUM) target low-income self-employed and salaried borrowers and non-resident
              Indians in Tier-1 and Tier-2 cities seeking five-to-fifteen-year housing finance. Used Commercial Vehicle
              Loans (4% of AUM), launched in FY2024, serve transport operators and owner-operators in semi-urban and
              rural areas who require financing for small and light commercial vehicles as livelihood assets on
              three-year secured tenures. Working Capital Loans (7% of AUM; unsecured) target urban and semi-urban
              micro-businesses — shopkeepers, restaurant owners, hardware store owners — with daily cash flows and some
              prior credit history; loans are one-to-three years with weekly repayment schedules.

              Across all segments the unifying borrower characteristic is limited or no prior formal credit history
              ("new-to-credit"), minimal documentation, and reliance on field-based income verification by Veritas's
              branch credit managers rather than bureau scores alone. The DRHP discloses that 24.72% of the loan book as
              of September 2024 consisted of first-time borrowers, underscoring the financial-inclusion orientation of
              the franchise.
