companyProfile:
  summary: >-
    Veritas Finance Limited is a Chennai-headquartered, RBI-registered Systematically Important Non-Deposit-Taking NBFC
    incorporated on April 30, 2015 by D. Arulmany, focused on secured MSME lending to underserved semi-urban and rural
    borrowers. By March 2025 it operated 508 branches across 11 states, employed 7,796 people, had served over 2 lakh
    customers cumulatively, and held AUM of ₹7,349 crore—growing at a 41% five-year CAGR certified by CARE Ratings. The
    company achieved unicorn status in September 2024 at a ₹8,500 crore implied valuation and received SEBI observations
    for a ₹2,800 crore IPO in April 2025. CARE upgraded the long-term rating to AA- Stable in June 2025, reaffirmed in
    April 2026, reflecting strong franchise quality despite a recent moderation in profitability (ROTA ~3.10% annualised
    in 9MFY26) and rising NPAs (GNPA 2.89% at Dec 2025).
