            title: Investment-Grade Credit Rating Upgrade to CARE AA- Stable
            body: >-
              In June 2025 CARE Ratings upgraded Veritas Finance from CARE A+ Positive to CARE AA- Stable for its
              long-term bank facilities and NCDs, citing robust AUM growth, healthy capitalisation, and consistent
              profitability. The AA- rating, together with CARE A1+ on short-term instruments, materially expands the
