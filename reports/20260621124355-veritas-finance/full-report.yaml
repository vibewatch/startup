        - Current; PMAY 2.0 active
        - Enlarges addressable pool for LAP-C and home loans; subsidy for first-home buyers
        - Determine share of home loan portfolio with PMAY subsidy; measure impact on repayment
      - - Rural logistics / CV demand growth
        - Driver
        - Emerging, 3–5 year horizon
        - Enlarges pool of first-time CV owner-operators needing finance in rural corridors
        - Assess Veritas' current CV portfolio GNPA and seasoning; CV is early stage
