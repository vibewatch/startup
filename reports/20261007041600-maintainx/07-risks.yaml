callouts:
  - calloutType: "risk"
    title: "The Structural Machine Telemetry Gap"
    body: "MaintainX was purposefully engineered as a mobile-first communication tool for frontline technicians, optimizing human task coordination rather than direct industrial machine interfacing. This structural architectural choice means MaintainX does not natively ingest high-frequency PLC signals or monitor Overall Equipment Effectiveness (OEE). While this ensures rapid adoption, it prevents automated condition-based maintenance and leaves plants exposed to unmonitored production slowdowns."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
  - calloutType: "insight"
    title: "Strategic Rationale and Execution Risk of Autodesk Acquisition"
    body: "Autodesk's $3.6 billion acquisition of MaintainX at ~27x forward ARR represents a high-conviction bet on bridging design and build assets with operational performance data under Autodesk Operations Solutions (AOS). However, realizing this strategic value requires successfully converging MaintainX's frontline work orders with Autodesk's Tandem digital twin and Fusion Operations, presenting substantial multi-year software integration and organizational retention risks."
    claimRefs:
      - "CR005"
      - "CR015"
      - "CR016"
