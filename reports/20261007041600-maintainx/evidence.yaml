evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited historical GAAP revenue, gross margin percentages, and cash burn rate for MaintainX.
    whyItMatters: >-
      Essential to evaluate standalone operational profitability and software unit economics behind the 27x forward ARR
      acquisition multiple.
    diligencePath: Inspect audited income statements and cash flow statements in corporate M&A data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Net revenue retention (NRR), gross revenue retention, and customer logo churn curves.
    whyItMatters: >-
      Determines whether top-line expansion is driven by durable expansion within large enterprise accounts or
      high-velocity customer acquisition offsetting frontline churn.
    diligencePath: Audit quarterly net dollar retention cohort waterfalls from company management accounts.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: governance-terms
    missingEvidence: Final shareholder voting agreements, liquidation preference distribution, and secondary share transaction terms.
    whyItMatters: >-
      Clarifies exact net proceeds distribution across founders, management, and institutional venture tiers upon
      transaction closing.
    diligencePath: Review definitive merger agreement schedules, escrow terms, and capitalization waterfall.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-unit-economics
    missingEvidence: >-
      Audited cohort net retention rates (NRR), gross margin profile, and logo-level churn metrics across customer
      tiers.
    whyItMatters: >-
      Without audited retention and unit economics, the durability of MaintainX's growth and the economic justification
      for its 26x ARR acquisition multiple cannot be verified independently.
    diligencePath: >-
      Request audited revenue retention schedules, customer cohort expansion tables, and gross margin breakdowns from
      Autodesk investor relations or MaintainX management.
    relatedQuestionRefs:
