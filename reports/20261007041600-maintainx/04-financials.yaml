chapter:
  number: 4
  title: "Financials"
  summary: "MaintainX's public financial picture is anchored by a buyer-disclosed forecast of more than $135 million of calendar-2026 ARR at growth above 50% and Autodesk's approximately $3.6 billion acquisition agreement. The evidence supports subscription monetization and strong top-line momentum, but not standalone gross margin, retention, sales efficiency, burn, cash, or runway underwriting."
sections:
  - id: "public-financial-snapshot"
    title: "Public Financial Snapshot"
    body: "Autodesk announced an approximately $3.6 billion all-cash agreement to acquire MaintainX and relayed management's expectation that calendar-2026 annualized recurring revenue would exceed $135 million while growing above 50%. Those are forward-looking ARR disclosures, not audited revenue, recognized revenue, or cash flow. Independent transaction coverage translates the disclosed figures into roughly 26.7x to 27x forward ARR, a demanding strategic multiple whose durability depends on retention and margin evidence that is not public. MaintainX separately says more than 14,000 companies use the product, but logo count does not reveal paid-seat mix, average contract value, customer concentration, or revenue quality."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI008"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "monetization-and-pricing"
    title: "Monetization and Pricing"
    body: "The reviewed evidence describes MaintainX as a subscription business with a freemium-to-enterprise packaging ladder. A competitor-authored pricing teardown lists Basic as free, Essential at $20 per user per month on annual billing, Premium at $65, and Enterprise as custom priced; it also reports a 225% per-user increase from Essential to Premium. These figures are useful indications of monetization mechanics, not verified realized pricing. The assigned pool contains no current official pricing page, contract sample, discount schedule, or revenue-mix disclosure, so list prices cannot establish average selling price, recognized revenue, services contribution, or gross margin."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI016"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "go-to-market-and-cost-economics"
    title: "Go-to-Market and Cost Economics"
    body: "Public signals point to enterprise expansion potential but do not quantify selling efficiency. Autodesk highlights MaintainX's pre-built integrations and scalable go-to-market motion, while Futurum reports that 55.2% of surveyed enterprise software decision makers identify better integration as a condition for increased spending. MaintainX's own 2026 industry report says 58% of maintenance teams surveyed already use AI, supporting category demand rather than MaintainX-specific conversion. None of these sources discloses sales cycle, customer acquisition cost, payback, quota productivity, partner economics, implementation labor, hosting expense, AI inference cost, or support burden. The evidence therefore supports a demand thesis, not a defensible unit-economics model."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI016"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: "MaintainX raised a $150 million Series D in 2025, bringing reported cumulative funding to $254 million, with proceeds directed toward AI, machine-health monitoring, predictive maintenance, enterprise asset management, geographic expansion, and hiring. Funding raised is not cash available: the public record reviewed here does not disclose current cash, burn, debt, working capital, or runway. Autodesk says its acquisition consideration would be financed with cash on hand and debt, but those are buyer-level sources of funds rather than MaintainX standalone liquidity. The financial verdict is therefore strong reported ARR momentum and recurring-revenue potential, offset by a premium transaction multiple and material gaps in revenue quality, margins, retention, sales efficiency, and cash conversion."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI014"
      - "CI015"
      - "CI016"
