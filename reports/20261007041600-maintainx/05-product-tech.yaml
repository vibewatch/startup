callouts:
  - calloutType: "insight"
    title: "Frontline Mobile Usability Drives High-Frequency Operational Telemetry"
    body: "MaintainX's competitive advantage centers on frontline technician adoption rather than top-down administrative reporting. By prioritizing mobile UX with low-friction photo capture, messaging, and digital checklists, the platform captures high-frequency field maintenance data that legacy desktop-bound CMMS implementations routinely miss, establishing a critical foundation for predictive asset maintenance."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE009"
  - calloutType: "risk"
    title: "Enterprise Seat Economics and Advanced Configuration Friction"
    body: "While MaintainX excels at rapid departmental deployments, enterprise customers face two critical structural frictions: per-user per-month subscription pricing creates escalating cost hurdles across massive frontline workforces, and multi-facility governance, custom reporting, and deep ERP integration remain restricted to higher-tier licensing."
    claimRefs:
      - "CE010"
      - "CE011"
