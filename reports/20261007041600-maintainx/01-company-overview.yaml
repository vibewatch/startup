chapter:
  number: 1
  title: "Company Overview"
  summary: "MaintainX is an AI-powered computerized maintenance management solution (CMMS) and enterprise asset management (EAM) platform founded in 2018 in San Francisco to digitize industrial frontline workflows. The company scaled to over 14,000 customer organizations and raised $254 million in venture funding before entering a definitive agreement in May 2026 to be acquired by Autodesk for approximately $3.6 billion in cash, supported by CY2026 expected ARR exceeding $135 million."
sections:
  - id: "corporate-identity-and-operating-model"
    title: "Corporate Identity, Mission, and Operating Model"
    body: "MaintainX Inc. is a cloud-based industrial software company founded in 2018 and headquartered at 185 Clara Street in San Francisco, California. The company develops a mobile-first computerized maintenance management solution (CMMS) and enterprise asset management (EAM) software platform purpose-built for deskless industrial frontline teams across manufacturing, energy, facilities management, food and beverage, and distribution logistics. Historically, maintenance operations across physical-asset-driven industries relied heavily on paper checklists, clipboards, and disparate spreadsheets, creating severe communication latency and equipment downtime. MaintainX designed a consumer-grade mobile application that enables shop-floor technicians to create, track, and execute digital work orders, preventive maintenance routines, safety inspections, and parts inventory movements directly from mobile devices. The software architecture combines real-time technician communications, automated maintenance workflows, and native AI capabilities—such as Report Builder AI and MaintainX CoPilot—to convert frontline work logs into actionable operating intelligence. Commercial monetization follows a tiered software-as-a-service (SaaS) model spanning a free Basic plan alongside paid tiers ranging from $20 per user per month (Essential, billed annually) to $65 per user per month (Premium) and custom-quoted Enterprise packages, with free requester accounts to accelerate bottom-up shop-floor adoption."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Founders, Executive Leadership, and Governance Architecture"
    body: "MaintainX was co-founded by Chief Executive Officer Chris Turlica and Head of Product Hugo Dozois-Caouette, following their earlier collaboration building and selling consumer startup Voo. Turlica, who immigrated from Romania, holds a finance degree from McGill University and served as an Entrepreneur in Residence at Deutsche Telekom Capital Partners before identifying industrial maintenance coordination as an unaddressed software opportunity. Dozois-Caouette, a computer engineering graduate from Sherbrooke University, brought critical engineering and systems experience from technical roles at Townsquared, Fujitsu, and Autodesk. The broader operational leadership team includes General Counsel Chris Matton (formerly General Counsel at AgBiome and Bandwidth), Head of New Products Linda Pham (previously at Webflow and Vungle), Head of Engineering Sami Tas (former engineering leader at Meta's XR People), Head of Sales Justin Turner, and Head of Marketing Erich Ziegler (formerly CMO at CircleCI and senior marketing executive at Base CRM, RingCentral, and Netflix). Corporate governance has been steered by an active board of directors that includes key institutional venture partners Byron Deeter (Bessemer Venture Partners) and David Hornik (August Capital), independent technology executive Peter Yared, Charles Reim, and the co-founders. Key-person dependence has historically centered on Turlica's operational drive and product vision, though the governance structure and senior executive bench expanded significantly across successive venture growth rounds."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "capitalization-scale-and-acquisition-milestones"
    title: "Capitalization History, Operational Milestones, and Pending Acquisition"
    body: "Between its founding in 2018 and mid-2025, MaintainX raised an aggregate of $254 million in venture equity across five institutional financing rounds. The capitalization trajectory progressed through early institutional rounds led by August Capital, Amity Ventures, and Ridge Ventures, followed by a $39 million Series B in June 2021 led by Bessemer Venture Partners and a $50 million Series C in December 2023 led by Bain Capital Ventures at a $1.0 billion valuation. In July 2025, MaintainX completed a $150 million Series D financing led by Bessemer Venture Partners and Bain Capital Ventures at a $2.5 billion post-money valuation, with participation from D. E. Shaw Ventures, Founders Circle Capital, Sozo Ventures, and Fifth Down Capital. On May 28, 2026, Autodesk announced a definitive agreement to acquire MaintainX in an all-cash transaction valued at approximately $3.6 billion, funded through cash on hand and debt financing, accompanied by a reported $150 million employee restricted stock retention pool. In transaction disclosures, MaintainX revealed it expects to achieve in excess of $135 million in annualized recurring revenue (ARR) for calendar year 2026 with year-over-year ARR growth exceeding 50%. The acquisition anchors Autodesk's Operations Solutions (AOS) division, uniting design and engineering models with real-world operating and maintenance telemetry across physical assets."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
