      - number: '3.3'
        title: Moat Durability, Switching Costs, and Platform Threats
        blocks:
          - type: paragraph
            body: >-
              MaintainX derives its primary moat from frontline adoption and daily messaging workflows that overcome
              deskless worker resistance to administrative data entry [CP009, CP012]. With over 14,000 corporate
              customers and widespread mobile marketplace traction, MaintainX has built significant workflow inertia
              [CP006, CP012, CP013]. However, switching costs in mid-market CMMS remain relatively low because standard
              work orders, basic asset records, and routine PM schedules can be exported to competing platforms in days
              [CP001, CP004]. Moreover, structural limitations in asset-hierarchy depth—such as three levels on Premium
              and default six levels on Enterprise—create ceilings for complex process-manufacturing plants [CP008]. A
              major strategic turning point occurred in May 2026 with MaintainX's acquisition by Autodesk for
              approximately $3.6 billion, integrating it into Autodesk Operations Solutions [CP007, CP014]. While this
              expands enterprise distribution and ties maintenance to architectural design data, it also introduces
              procurement concerns regarding platform neutrality, European data residency, and long-term subscription
              pricing [CP007, CP014].
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pricing Gating Friction Across Expanding Technicians
            body: >-
              Because MaintainX restricts spare parts inventory, purchase order management, and meter-based maintenance
              to its Premium tier ($65 per user per month), expanding adoption from initial pilot crews to an entire
              facility significantly increases software expenditure [CP008, CP010]. Competitors like Maintainly and
              UpKeep exploit this pricing step-up to position themselves as more economical alternatives for asset-heavy
              operations [CP008, CP009].
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP010
          - type: callout
            title: Post-Acquisition Positioning Under Autodesk Operations Solutions
            body: >-
              MaintainX's acquisition by Autodesk for approximately $3.6 billion validates its frontline software thesis
              and embeds the platform into Autodesk's broader AEC and Operations ecosystem [CP007, CP014]. However, this
              institutional backing also introduces corporate dependencies, potential platform neutrality concerns, and
              European procurement scrutiny regarding US data hosting [CP007, CP014].
            calloutType: insight
            claimRefs:
              - CP007
              - CP014
