      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Motions
        blocks:
          - type: paragraph
            body: >-
              MaintainX addresses a tiered buyer landscape spanning mid-market manufacturing, multi-facility operations,
              and heavy industrial enterprises. The primary economic buyer is typically a Vice President of Operations
              or Director of Facilities, whereas daily active users are plant technicians, maintenance mechanics, and
              reliability engineers. Budget allocation predominantly draws from operational expenditure (OpEx) budgets
              rather than central corporate IT capital funds. MaintainX drives adoption through a product-led growth
              model anchored by a free Basic plan, transitioning accounts into paid tiers at $20 and $65 per user per
              month as organizations require advanced capabilities such as meter-based preventive maintenance, automated
              parts purchase orders, and multi-site analytics. At enterprise scale, MaintainX leverages cloud partner
              marketplaces such as AWS Marketplace to streamline enterprise procurement and security approvals,
              supporting an active customer footprint exceeding 14,000 organizations.
            claimRefs:
