              - CU006
              - CU007
              - CU008
              - CU013
      - number: '6.3'
        title: Retention Durability, Expansion Friction, and Enterprise Blockers
        blocks:
          - type: paragraph
            body: >-
              MaintainX's commercial expansion encounters structural procurement and compliance barriers as accounts
              attempt to scale from localized shop-floor pilots into enterprise-wide deployments. First, European
              enterprise operators encounter disqualifying compliance friction because MaintainX relies on US-only cloud
              data hosting across 24 US-based subprocessors, using Standard Contractual Clauses rather than local EU
              data residency. This architecture has disqualified MaintainX from shortlists in DACH public
              administration, healthcare institutions, and industrial fleets, while the lack of native German statutory
              safety inspection workflows (DGUV V3, UVV) forces European users to maintain parallel point solutions.
              Second, MaintainX gates critical enterprise functionality—including IoT condition monitoring, single
              sign-on (SSO), meter-based maintenance, and advanced reporting—behind its $65 per user per month tier and
              custom Enterprise contracts. This per-seat tier structure drives significant cost creep as organizations
              add field technicians, contractors, and site supervisors. Third, enterprise buyers note that MaintainX
              lacks native asset lifecycle financial tracking (such as leasing schedules, depreciation schedules, and
              warranty cost-centre modeling) and direct machine telemetry feeds, treating assets as static
              administrative records rather than connected machinery. In acquisition analysis surrounding Autodesk's
              $3.6 billion transaction, maintaining strong net dollar retention across this base was identified by
              market analysts as the primary test of long-term software enterprise durability, amidst undisclosed
              logo-level revenue concentration.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
