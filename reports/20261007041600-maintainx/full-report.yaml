              - CP004
              - CP005
              - CP006
              - CP007
              - CP013
      - number: '3.2'
        title: Feature Gating, Packaging, and Pricing Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging architectures serve as primary battlegrounds across the CMMS sector [CP008].
              MaintainX employs a transparent product-led growth (PLG) pricing ladder beginning with a tightly capped
              free Basic tier, stepping to Essential at $20 per user per month billed annually, and $65 per user per
              month for Premium, with custom quote-based Enterprise tiers [CP008, CP009]. However, key operational
              capabilities such as spare parts inventory management, purchase orders, and meter-based preventive
              maintenance triggers are strictly gated behind the Premium tier [CP008, CP009]. This creates considerable
              pricing friction for growing maintenance teams, where adding frontline technicians across an entire
              facility forces all seats into the $65 to $75 bracket [CP008, CP010]. In contrast, UpKeep includes
              meter-based maintenance and parts inventory at lower price points while gating offline mobile and full
              lifecycle tracking to higher tiers [CP009]. Specialized value-oriented rivals like Maintainly offer
              modular add-ons that avoid forcing every seat into high fixed tiers, though Maintainly lacks offline
              mobile support [CP008, CP011].
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
