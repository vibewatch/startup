      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Rationale of Autodesk's $3.6B Operations Acquisition
            body: >-
              Autodesk's $3.6 billion acquisition of MaintainX bridges a historic chasm between architectural design and
              ongoing physical asset operations. By combining Autodesk's design tools (AEC and D&M) with MaintainX's
              high-frequency shop-floor work order telemetry across 14,000 organizations, Autodesk positions itself to
              create a closed-loop system where field failure data informs future asset design and capital expenditure.
            calloutType: insight
            claimRefs:
              - CO002
              - CO005
              - CO014
              - CO015
          - type: callout
            title: Valuation Premium Dependent on Unverified Private Metrics
            body: >-
              At a transaction valuation of $3.6 billion against expected 2026 ARR of over $135 million, Autodesk is
              paying approximately 27x forward revenue. This premium relies heavily on growth durability and net
              expansion. However, audited GAAP gross margins, net revenue retention cohorts, and cash burn rates remain
              undisclosed private metrics, creating diligence dependencies for post-acquisition integration.
            calloutType: risk
            claimRefs:
