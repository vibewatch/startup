      - number: '1.3'
        title: Capitalization History, Operational Milestones, and Pending Acquisition
        blocks:
          - type: paragraph
            body: >-
              Between its founding in 2018 and mid-2025, MaintainX raised an aggregate of $254 million in venture equity
              across five institutional financing rounds. The capitalization trajectory progressed through early
              institutional rounds led by August Capital, Amity Ventures, and Ridge Ventures, followed by a $39 million
              Series B in June 2021 led by Bessemer Venture Partners and a $50 million Series C in December 2023 led by
              Bain Capital Ventures at a $1.0 billion valuation. In July 2025, MaintainX completed a $150 million Series
              D financing led by Bessemer Venture Partners and Bain Capital Ventures at a $2.5 billion post-money
              valuation, with participation from D. E. Shaw Ventures, Founders Circle Capital, Sozo Ventures, and Fifth
              Down Capital. On May 28, 2026, Autodesk announced a definitive agreement to acquire MaintainX in an
              all-cash transaction valued at approximately $3.6 billion, funded through cash on hand and debt financing,
              accompanied by a reported $150 million employee restricted stock retention pool. In transaction
              disclosures, MaintainX revealed it expects to achieve in excess of $135 million in annualized recurring
              revenue (ARR) for calendar year 2026 with year-over-year ARR growth exceeding 50%. The acquisition anchors
              Autodesk's Operations Solutions (AOS) division, uniting design and engineering models with real-world
              operating and maintenance telemetry across physical assets.
