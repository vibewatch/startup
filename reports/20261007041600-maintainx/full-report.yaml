chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              MaintainX Inc. is a cloud-based industrial software company founded in 2018 and headquartered at 185 Clara
              Street in San Francisco, California. The company develops a mobile-first computerized maintenance
              management solution (CMMS) and enterprise asset management (EAM) software platform purpose-built for
              deskless industrial frontline teams across manufacturing, energy, facilities management, food and
              beverage, and distribution logistics. Historically, maintenance operations across physical-asset-driven
              industries relied heavily on paper checklists, clipboards, and disparate spreadsheets, creating severe
              communication latency and equipment downtime. MaintainX designed a consumer-grade mobile application that
              enables shop-floor technicians to create, track, and execute digital work orders, preventive maintenance
              routines, safety inspections, and parts inventory movements directly from mobile devices. The software
              architecture combines real-time technician communications, automated maintenance workflows, and native AI
              capabilities—such as Report Builder AI and MaintainX CoPilot—to convert frontline work logs into
              actionable operating intelligence. Commercial monetization follows a tiered software-as-a-service (SaaS)
              model spanning a free Basic plan alongside paid tiers ranging from $20 per user per month (Essential,
              billed annually) to $65 per user per month (Premium) and custom-quoted Enterprise packages, with free
              requester accounts to accelerate bottom-up shop-floor adoption.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
