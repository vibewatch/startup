        - Delays or organizational friction in unifying MaintainX with Tandem and Fusion Operations
        - High
        - Early (Definitive agreement signed; integration road-map under joint planning)
        - Key executive turnover, engineering distraction, and loss of standalone agility during multi-year absorption.
      - - Tier-Gated Pricing & User Cost Scaling
        - Commercial software subscription and packaging structure
        - High (Steep 225% price jump from Essential $20/mo to Premium $65/mo per user)
        - Customers resist price escalation for technician seats and migrate to flat-fee or open CMMS tools
        - Medium
        - Moderate (Free requester tier softens barrier, but technician seats scale linearly)
        - Mid-market account churn when expanding parts inventory and API access across large field teams.
      - - Enterprise ERP & Ecosystem Connectors (SAP)
        - Core integration partner for inventory and accounting data sync
        - Moderate (SAP Silver Partner status and enterprise REST API connectors)
        - ERP schema changes, synchronization failures, or API rate limitations breaking parts workflows
        - Medium
        - Mature (Pre-built integrations and enterprise connector support available)
        - Custom connector professional services fees and ongoing maintenance overhead for IT departments.
