      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              MaintainX was co-founded by Chief Executive Officer Chris Turlica and Head of Product Hugo
              Dozois-Caouette, following their earlier collaboration building and selling consumer startup Voo. Turlica,
              who immigrated from Romania, holds a finance degree from McGill University and served as an Entrepreneur
              in Residence at Deutsche Telekom Capital Partners before identifying industrial maintenance coordination
              as an unaddressed software opportunity. Dozois-Caouette, a computer engineering graduate from Sherbrooke
              University, brought critical engineering and systems experience from technical roles at Townsquared,
              Fujitsu, and Autodesk. The broader operational leadership team includes General Counsel Chris Matton
              (formerly General Counsel at AgBiome and Bandwidth), Head of New Products Linda Pham (previously at
              Webflow and Vungle), Head of Engineering Sami Tas (former engineering leader at Meta's XR People), Head of
              Sales Justin Turner, and Head of Marketing Erich Ziegler (formerly CMO at CircleCI and senior marketing
              executive at Base CRM, RingCentral, and Netflix). Corporate governance has been steered by an active board
              of directors that includes key institutional venture partners Byron Deeter (Bessemer Venture Partners) and
              David Hornik (August Capital), independent technology executive Peter Yared, Charles Reim, and the
              co-founders. Key-person dependence has historically centered on Turlica's operational drive and product
              vision, though the governance structure and senior executive bench expanded significantly across
              successive venture growth rounds.
