  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Taxonomic Disconnect
        blocks:
          - type: paragraph
            body: >-
              MaintainX operates at the intersection of computerized maintenance management systems (CMMS), frontline
              work execution, and enterprise asset management (EAM). Historically, the maintenance software sector
              bifurcated into heavy, desktop-oriented EAM platforms tailored for accounting compliance and paper-based
              clipboards used by field technicians. MaintainX established its market boundary around mobile-first work
              order execution, preventive maintenance scheduling, and real-time technician communication. This boundary
              explicitly encompasses operational work execution, procedure checklists, asset health logging, and parts
              inventory tracking, while excluding core enterprise financial ledgers and building design engineering.
              Notably, automated software aggregators like 6sense classify MaintainX under generic IT workflow
              automation alongside systems like Apache Airflow and Control-M, reflecting a significant taxonomic
              distortion that obscures MaintainX's specialized focus on industrial physical assets and frontline
              deskless labor.
            claimRefs:
              - CM001
              - CM002
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM013
      - number: '2.2'
        title: Market Sizing, Downtime Economics, and Revenue Trajectory
        blocks:
          - type: paragraph
            body: >-
              Quantifying MaintainX's addressable market requires distinguishing macro industrial operating losses from
              addressable software budgets. Unplanned equipment downtime inflicts an estimated $2.8 billion in annual
              losses on the average Fortune 500 company, representing approximately 11 percent of revenues, with large
              manufacturing facilities losing an average of $253 million annually. The core addressable market for
              industrial CMMS and operations software is estimated at $4.5 billion to $6.0 billion globally, supported
              by a broader $233 billion potential efficiency dividend from predictive maintenance. Within this
              landscape, MaintainX demonstrated rapid market capture, scaling from seed launch to an estimated $115.5
              million ARR in 2025 and projecting over $135 million ARR for calendar year 2026 at greater than 50 percent
              annual growth. This rapid expansion underpinned Autodesk's definitive $3.6 billion acquisition agreement,
              which prices MaintainX at approximately 26 times forward ARR.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
