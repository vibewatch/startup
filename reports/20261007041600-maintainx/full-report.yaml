  - id: TV002
    title: Investment Thesis vs Anti-Thesis Evaluation
    columns:
      - Perspective
      - Core Thesis Argument
      - Empirical Grounding and Metrics
      - What Would Change the View
    rows:
      - - Thesis (Strategic Asset)
        - Proprietary frontline maintenance record bridges design, build, and operations lifecycle
        - 14,000+ customer organizations, 500,000+ frontline workers, and >50% forward ARR growth
        - Stagnating enterprise customer additions or customer switching to vertical competitors like Limble or UpKeep
      - - Thesis (Data Moat)
        - High-frequency operational data on equipment breakdowns and work orders feeds predictive AI
        - Autodesk creation of AOS platform combining MaintainX, Tandem digital twin, and Fusion Operations
        - Failure to monetize operational telemetry into premium AI modules or customer data privacy restrictions
      - - Anti-Thesis (Price Discipline)
        - 27x forward ARR is an extreme multiple in a normalized capital environment
        - $3.6B all-cash check funded via $1.6B cash plus debt for a category historically viewed as commoditized CMMS
        - Demonstrated audited gross margins above 80% and net dollar retention sustainably exceeding 125%
      - - Anti-Thesis (Integration Risk)
        - Post-merger attrition among mobile frontline champions and overlap with Autodesk homegrown tools
        - Historic struggle of Autodesk internal facility management efforts folded into ACC with limited traction
        - Retention of key MaintainX engineering/GTM leadership via reported $150M restricted stock package
    notes: >-
      Core thesis arguments evaluated against reported operating metrics and industrial software M&A precedents.
      Multiple analysis based on May 2026 transaction terms.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Scenario Drivers and Return Logic
    columns:
      - Scenario
      - Operating and Integration Assumptions
      - Implied 2026 ARR and Valuation Logic
      - Key Risks and Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - ARR growth exceeds 60%; cross-selling into Autodesk AEC and manufacturing accounts; rapid AOS integration
        - '>$150M ARR at 24x multiple yielding >$3.6B standalone equivalent; highly accretive data feedback layer'
        - Regulatory remedies in overseas markets or severe field-labor churn
        - 25%
      - - Base Case
        - ARR meets guidance of >$135M at >50% YoY growth; smooth closing; $150M stock retention locks team
        - $135M-$145M ARR valuing company at agreed $3.6B cash transaction (approx 27x multiple)
        - Extended debt financing costs for Autodesk ($1.6B cash plus borrowing) during high-rate environment
        - 55%
      - - Bear Case
        - Growth decelerates below 35%; net retention leaks; frontline users resist enterprise ERP/Autodesk bundling
        - Standalone software value compresses toward 12x-15x ARR ($1.6B-$2.0B intrinsic standalone value)
        - Large write-down risk for Autodesk; key customer defection to independent point solutions
        - 20%
    notes: >-
      Probability signals and return logic evaluate the risk-return profile absorbed by Autodesk in the $3.6B all-cash
      acquisition. Forward ARR benchmarks anchor to Autodesk official calendar year 2026 guidance.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
