callouts:
  - calloutType: "risk"
    title: "Pricing Gating Friction Across Expanding Technicians"
    body: "Because MaintainX restricts spare parts inventory, purchase order management, and meter-based maintenance to its Premium tier ($65 per user per month), expanding adoption from initial pilot crews to an entire facility significantly increases software expenditure [CP008, CP010]. Competitors like Maintainly and UpKeep exploit this pricing step-up to position themselves as more economical alternatives for asset-heavy operations [CP008, CP009]."
    claimRefs:
      - "CP008"
      - "CP009"
      - "CP010"
  - calloutType: "insight"
    title: "Post-Acquisition Positioning Under Autodesk Operations Solutions"
    body: "MaintainX's acquisition by Autodesk for approximately $3.6 billion validates its frontline software thesis and embeds the platform into Autodesk's broader AEC and Operations ecosystem [CP007, CP014]. However, this institutional backing also introduces corporate dependencies, potential platform neutrality concerns, and European procurement scrutiny regarding US data hosting [CP007, CP014]."
    claimRefs:
      - "CP007"
      - "CP014"
