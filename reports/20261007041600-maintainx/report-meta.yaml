companyProfile:
  summary: >-
    MaintainX is a mobile-first computerized maintenance management and enterprise asset management platform built for
    industrial frontline teams. Founded in 2018 and headquartered in San Francisco, it combines work orders,
    inspections, preventive maintenance, parts workflows, and AI-assisted reporting into a subscription SaaS product
    aimed at manufacturing, facilities, logistics, and other asset-intensive operations. The company reports more than
    14,000 customer organizations and raised $254 million in venture capital before Autodesk announced an all-cash
    agreement to acquire it for about $3.6 billion. Public evidence supports strong adoption and growth, but it does not
    disclose audited revenue, gross margin, net revenue retention, or standalone cash burn.
