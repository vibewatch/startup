      - number: '1.3'
        title: 资本化历程、运营里程碑与待完成收购
        blocks:
          - type: paragraph
            body: >-
              MaintainX 从 2018 年成立到 2025 年年中，五轮机构融资累计募得 $254 million 风投股权。资本化历程先后经历 August Capital、Amity Ventures 和
              Ridge Ventures 领投的早期机构轮次，随后是 Bessemer Venture Partners 于 2021 年 6 月领投的 $39 million Series B，以及 Bain
              Capital Ventures 于 2023 年 12 月领投、估值 $1.0 billion 的 $50 million Series C。2025 年 7 月，MaintainX 完成由 Bessemer
              Venture Partners 和 Bain Capital Ventures 领投的 $150 million Series D，投后估值为 $2.5 billion，D. E. Shaw
              Ventures、Founders Circle Capital、Sozo Ventures 和 Fifth Down Capital 参与其中。2026 年 5 月 28 日，Autodesk 宣布以约
              $3.6 billion 的全现金交易收购 MaintainX， 资金来自手头现金和债务融资，并据报道配套 $150 million 员工限制性股票留任池。交易披露显示，MaintainX 预计 2026
              日历年年化经常性收入（ARR）超过 $135 million，年同比 ARR 增长超过 50%。这笔收购将 MaintainX 纳入 Autodesk 的 Operations
              Solutions（AOS）部门，把设计和工程模型与实体资产的现实运营、维护遥测连接起来。
