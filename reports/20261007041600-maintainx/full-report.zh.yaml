        title: 展示材料
        blocks:
          - type: callout
            title: Autodesk 36 亿美元运营业务收购的战略逻辑
            body: >-
              Autodesk 以 36 亿美元收购 MaintainX，弥合了建筑设计与实体资产持续运营之间长期存在的断层。Autodesk 将其设计工具（AEC 和 D&M）与 MaintainX 覆盖 14,000
              家组织的高频车间工单遥测结合，试图建立闭环系统，让现场故障数据反哺未来资产设计和资本开支。
            calloutType: insight
