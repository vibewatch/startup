chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              MaintainX Inc. 是一家云端工业软件公司，成立于 2018 年，总部位于加州旧金山 Clara Street 185
              号。公司开发移动优先的计算机化维护管理解决方案（CMMS）和企业资产管理（EAM）软件平台，专为制造、能源、设施管理、食品饮料和配送物流等行业的无固定办公桌一线团队打造。过去，依赖实体资产的行业高度依赖纸质清单、夹板和彼此割裂的电子表格，导致沟通延迟严重、设备停机频繁。MaintainX
              设计了消费级移动应用，让车间技术人员直接用移动设备创建、跟踪并执行数字工单、预防性维护例程、安全巡检和零部件库存流转。软件架构结合实时技术人员沟通、自动化维护流程和原生 AI 能力——例如 Report
              Builder AI 和 MaintainX CoPilot——将一线工作日志转化为可执行的运营情报。商业化采用分层软件即服务（SaaS）模式，从免费的 Basic 方案到付费层级，Essential
              年付每用户每月 20 美元，Premium 每用户每月 65 美元，Enterprise 则按需报价；免费请求者账号也加速了自下而上的车间采用。
            claimRefs:
