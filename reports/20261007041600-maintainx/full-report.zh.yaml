  - id: FE001
    title: 产品架构图
    type: stack
    summary: 展示 MaintainX 移动一线界面、AI CoPilot 分析、核心 CMMS 业务逻辑及企业 ERP/IoT 集成的多层功能栈。
    data:
      layers:
        - label: 一线参与层
          detail: 支持离线缓存、相机条码 / 照片采集及工人团队 消息的 iOS 和 Android 原生移动客户端
        - label: 智能辅助层
          detail: MaintainX CoPilot 生成式助手，提供自动工单生成、语音转文字 转录和故障异常检测
        - label: 核心 CMMS 业务引擎
          detail: 工单状态机、预防性维护排程、资产层级、数字化流程 清单和零件库存
        - label: 开发者与集成平台
          detail: MaintainX REST API v1 端点和实时 webhook 事件分发器，用于触发外部工作流
        - label: 企业连接与同步网关
          detail: 事件驱动的发布 / 订阅消息队列、状态协调数据库，以及连接 SAP、Oracle 和 SCADA 遥测的双向连接器
        - label: Autodesk 生命周期融合层
          detail: 双向反馈回路，将现场维护绩效记录连接至 Autodesk Operations Solutions、 Tandem 数字孪生和设计模型
