      - number: '7.3'
        title: 伙伴依赖、定价升级与收购整合摩擦
        blocks:
          - type: paragraph
            body: >-
              MaintainX 存在影响客户留存和合同生命周期经济的显著商业与伙伴依赖。公司的市场进入模式依赖按用户订阅层级（Basic 免费、Essential 年付每用户每月 20 美元、Premium 每用户每月 65
              美元以及定制 Enterprise 合同）。基础工作请求和工单提交免费，但中端客户扩张一线人员时会遇到陡峭的商业摩擦，因为解锁零部件库存跟踪、采购订单流程、基于仪表读数的维护触发器和 REST API
              访问等核心运营能力，要求所有技术人员席位升级到 Premium，每用户成本增加 225%。这种按席位定价惩罚了不断扩充承包商和技术人员队伍的大型多设施组织，常常促使买方重新评估专用设施管理或开放 API 的
              CMMS 替代品。平台上，MaintainX 高度依赖企业软件连接器（包括 SAP Silver Partner 集成）和公共云托管商，提供多站点管理与单点登录（SSO）。最后，Autodesk 计划把
              MaintainX 与 Tandem 数字孪生和 Fusion Operations 一并整合进 Autodesk Operations
              Solutions（AOS），造成显著的组织、技术和产品路线图依赖。若技术整合失利，或 Autodesk 在交易完成后改变定价包装，最初因独立简洁而采用 MaintainX、对价格敏感的独立运营商可能加速流失。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
