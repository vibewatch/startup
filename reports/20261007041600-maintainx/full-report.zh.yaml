      - number: '8.2'
        title: 融资演进与收购倍数分析
        blocks:
          - type: paragraph
            body: >-
              MaintainX 在收购前累计获得 $253.85 million 至 $254 million 股权融资，融资历程从 2019 年 3 月的 $3.8 million Seed 轮开始，随后是 2019 年的
              $11 million Series A、2021 年 6 月的 $39 million Series B、2023 年 12 月投后估值 $1.0 billion 的 $50 million Series
              C，以及 2025 年 7 月投后估值 $2.5 billion 的 $150 million Series D。Series D 轮结束不到一年，Autodesk 于 2026 年 5 月 28
              日宣布最终协议，拟以约 $3.6 billion 全现金收购公司。MaintainX 预计 2026 日历年 ARR 超过 $135 million，增长超过 50%。这对应约 27x 前瞻 ARR
              的隐含交易倍数，所需资金据 Bloomberg 报道约为 $1.6 billion 手头现金加债务融资，另有 $150 million 员工限制性股票方案。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: 情景驱动因素、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              在基准收购执行情景下，MaintainX 顺利完成监管交割并加入 Autodesk Operations
              Solutions（AOS），扩大全球企业客户覆盖，将统一资产数据带入设计工作流。在乐观情景中，MaintainX 通过解锁更高价值的 AI 系统自动化和数十年期客户关系，将 ARR 增长加速至 60%
              以上，从而支撑高达 27 倍的倍数。相反，悲观情景包括并购后留存流失、客户反对单一供应商锁定，以及 Tandem 和 Fusion Operations 的整合摩擦。由于交易于 2026 年 8
              月完成，或仍受制于 2027 财年交割条件，首要尽调聚焦净美元留存、客户集中度，以及超过 14,000 家组织和 500,000 名一线员工客户基础中的一线席位参与度。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
