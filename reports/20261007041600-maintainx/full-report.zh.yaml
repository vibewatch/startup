  - id: FP001
    title: 竞争定位：一线易用性 vs 资产深度
    type: quadrant
    summary: 聚焦市场拆解结果，比较各竞争平台的一线技术员易用性与资产数据深度表现。
    data:
      xAxis: 资产数据深度与机器遥测
      yAxis: 一线采用与消息易用性
      points:
        - label: MaintainX
          x: 4
          'y': 9
          note: 技术员用户体验的市场领导者；原生资产核算能力中等
        - label: UpKeep
          x: 7
          'y': 7
          note: 资产生命周期、折旧和移动端易用性均衡
        - label: Limble CMMS
          x: 6
          'y': 8
          note: 客户满意度高，维护工作流可定制
        - label: Tractian
          x: 8
          'y': 5
          note: 振动硬件和预测性监测深入；CMMS 用户体验较窄
        - label: ToolSense
          x: 8
          'y': 6
          note: 直接 OEM 遥测和欧盟合规；专注车队范围
        - label: IBM Maximo
          x: 10
          'y': 2
          note: 企业资产建模全面；行政摩擦大
        - label: Maintainly
          x: 4
          'y': 5
          note: 价格实惠的模块化 CMMS；缺少移动离线功能
