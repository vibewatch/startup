      - number: '7.2'
        title: 运营故障模式、遥测缺口与移动应用可靠性
        blocks:
          - type: paragraph
            body: >-
              从运营和技术看，MaintainX 的主要架构局限源于其被设计成一线移动沟通和人员协同工具，而非与机器集成的运营平台。独立运营评估指出，MaintainX
              原生不监测整体设备效率（OEE），没有按“六大损失”框架自动跟踪设备可用性、运行表现和产出质量损失。MaintainX 不采集实时可编程逻辑控制器（PLC）信号或车间机器的自动 IoT
              遥测，而是依赖人工观察、手动仪表记录和技术人员发起的工单请求。这种结构性依赖让机器故障模式出现到维护介入之间不可避免地存在延迟。移动应用虽能让一线人员快速上手，且日常工单用户参与度较高，但 Capterra
              等平台的现场评价记录了应用偶发变慢、数据读取延迟及连接中断，尤其发生在一线技术人员处于低信号工业地下室或屏蔽工厂生产环境时。MaintainX
              虽提供纠正和预防措施（CAPA）工单流程及标准作业模板，以统一安全指令和挂牌上锁（LOTO）验证，但超过 14,000
              家客户组织依赖人工执行，若技术人员跳过安全步骤或在计划外停机事件中未记录次生缺陷，仍会留下运营风险。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
