              - CV014
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 27 倍收购倍数的战略逻辑
            body: >-
              按 27 倍远期 ARR 估值，Autodesk 收购的不只是计算机化维护管理工具，而是还包括一层自有的运营遥测。工程和建筑项目从设计转向实体运营后， MaintainX 能围绕设备故障和维护成本提供闭环反馈，
              为后续设计周期提供依据，也为预测型 AI 模型提供动力。
            calloutType: insight
            claimRefs:
              - CV005
              - CV010
          - type: callout
            title: 软件整合中的留存与倍数压力
            body: >-
              Autodesk 以现金支付 $3.6 billion，部分资金来自新增公司债务；如果 MaintainX 的净收入留存率无法 维持在顶级 SaaS 门槛之上，Autodesk 将面临估值倍数大幅压缩。
              在并入企业级 Autodesk Operations Solutions 的同时留住一线用户的认可， 仍是核心运营风险。
            calloutType: risk
            claimRefs:
              - CV004
              - CV011
              - CV015
