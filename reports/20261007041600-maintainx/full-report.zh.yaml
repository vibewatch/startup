      - number: '2.4'
        title: 采用催化剂、劳动力约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场扩张由两个结构性催化剂推动：工业实体基础设施老化，以及前所未有的一线劳动力转型。工业固定资产平均已有 24 年历史，是近七十年来最老的一批，推动 55% 的维护团队报告零部件更换费用上升。同时，制造业劳动力中
              40% 计划在 2030 年前退休，当前 69% 的技术人员年龄已达 50 岁或以上，市场迫切需要能留存机构知识的数字平台。不过，采用阻力仍然明显：尽管 71% 的设施采用预防性维护策略，58%
              仍将超过一半时间用于被动维修。关键在于，交易文件印证了 ARR 和客户数增长，但净收入留存率、客户流失率和队列单位经济等关键尽调指标仍是未披露的私有数据点。
            claimRefs:
              - CM011
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 一线采用胜过分类标签
            body: >-
              MaintainX 的成功来自面向无固定办公桌技术人员的移动易用性，而非与功能堆叠的桌面 CMMS 矩阵竞争。尽管聚合器把 MaintainX 归入通用 IT 工作流自动化，一线现场采用率推动其 ARR 达到
              1.35 亿美元以上。
            calloutType: insight
            claimRefs:
