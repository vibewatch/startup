      - number: '7.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 结构性机器遥测缺口
            body: >-
              MaintainX 有意打造为一线技术人员使用的移动优先沟通工具，优化人工任务协同，而非直接连接工业机器。这一结构性架构选择意味着 MaintainX 原生无法接收高频 PLC
              信号，也不监测整体设备效率（OEE）。虽然这有助于快速采用，却阻止了基于状态的自动维护，让工厂暴露于未监测的生产放缓风险。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Autodesk 收购的战略逻辑与执行风险
            body: >-
              Autodesk 以约 27 倍前瞻 ARR、36 亿美元收购 MaintainX，是在 Autodesk Operations
              Solutions（AOS）下将设计建造资产与运营表现数据连接起来的高确信度押注。但要实现这一战略价值，必须成功把 MaintainX 的一线工单与 Autodesk 的 Tandem 数字孪生和 Fusion
              Operations 融合，这带来重大的多年软件整合和组织留存风险。
            calloutType: insight
            claimRefs:
              - CR005
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              支撑 MaintainX 从 2019 年到 2025 年 7 月 $2.5 billion Series D
              期间快速完成五轮私募融资的核心论点，是其面向工业一线技术人员打造的现代移动优先计算机化维护管理系统（CMMS）和企业资产管理（EAM）平台。MaintainX
              在工厂车间采集细粒度的设备维护流程、工单、安全规程和状态异常，积累了传统桌面工具无法触达的高频运营数据。反论点则是估值极度膨胀：Autodesk 以 $3.6 billion 全现金收购，指引 2026 年
              ARR 超过 $135 million，隐含约 27x 前瞻 ARR。这一倍数按历史软件标准已被拉高，几乎完全依赖与 Autodesk Tandem 数字孪生和 Fusion Operations
              尚未证实的数据协同，而非经审计的独立盈利能力或已披露的净收入留存率指标。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
