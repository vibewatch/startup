              - CO014
              - CO015
          - type: callout
            title: 估值溢价依赖未经验证的私有指标
            body: >-
              交易估值 36 亿美元、预计 2026 年 ARR 超过 1.35 亿美元，意味着 Autodesk 支付了约 27 倍的前瞻收入。这一溢价高度依赖增长持续性和净扩张，但经审计的 GAAP
              毛利率、净收入留存队列和现金消耗率仍是未披露的私有指标，因而给并购后整合带来尽调依赖。
