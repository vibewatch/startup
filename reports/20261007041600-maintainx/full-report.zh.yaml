      - number: '1.2'
        title: 创始人、高管领导层与治理架构
        blocks:
          - type: paragraph
            body: >-
              MaintainX 由首席执行官 Chris Turlica 和产品负责人 Hugo Dozois-Caouette 联合创办，两人此前曾共同打造并出售消费级初创公司 Voo。Turlica
              从罗马尼亚移民而来，拥有 McGill University 金融学位，曾任 Deutsche Telekom Capital Partners
              驻企创业家，之后发现工业维护协同是一个尚未被软件解决的机会。Dozois-Caouette 毕业于 Sherbrooke University 计算机工程专业，曾在 Townsquared、Fujitsu 和
              Autodesk 担任技术职务，带来了关键的工程和系统经验。更广泛的运营领导团队包括总法律顾问 Chris Matton（曾任 AgBiome 和 Bandwidth 总法律顾问）、新产品负责人 Linda
              Pham（曾任职于 Webflow 和 Vungle）、工程负责人 Sami Tas（曾任 Meta XR People 工程负责人）、销售负责人 Justin Turner，以及营销负责人 Erich
              Ziegler（曾任 CircleCI 首席营销官，并在 Base CRM、RingCentral 和 Netflix 担任高级营销管理职务）。公司治理由活跃的董事会推动，成员包括重要机构风险投资伙伴 Byron
              Deeter（Bessemer Venture Partners）和 David Hornik（August Capital）、独立技术高管 Peter Yared、Charles Reim
              及两位联合创始人。历史上，公司对关键人物的依赖主要集中在 Turlica 的执行推动力和产品愿景上，但随着多轮风险增长融资，治理结构和高级管理梯队显著扩充。
