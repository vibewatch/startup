  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 市场分类与竞争格局
        blocks:
          - type: paragraph
            body: >-
              计算机化维护管理系统（CMMS）和企业资产管理（EAM）的竞争格局横跨多个不同类别 [CP001]。一线市场里，MaintainX 直接面对 UpKeep 和 Limble CMMS
              等移动优先同业者，核心工单和预防性维护能力日益趋同 [CP001, CP002, CP003]。在直接同业者之外，IBM Maximo、SAP ERP EAM 和 Siemens Brightly Asset
              Essentials 等大型传统企业平台凭借深层组织层级和完整财务规划，守住资产密集型工业客户 [CP002, CP004]。在商业地产和多设施场景，Facilio 等专用平台提供通用移动 CMMS
              工具缺乏的楼宇管理系统（BMS）集成 [CP003, CP005]。此外，Tractian 等原生机器状态监测平台以及 ToolSense
              等欧洲混合车队工具，依靠直接传感器遥测和自动化合规展开竞争，也说明一线工单协同只覆盖整个资产生命周期的一部分 [CP006, CP007]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
