      - number: '3.2'
        title: 功能分层、产品包装与定价取舍
        blocks:
          - type: paragraph
            body: >-
              定价和产品包装架构是 CMMS 行业的主要战场 [CP008]。MaintainX 采用透明的产品主导增长（PLG）价格梯度，从严格限额的免费 Basic 开始，升至年付每用户每月 $20 的
              Essential，再到每用户每月 $65 的 Premium，Enterprise 层级则按报价定制 [CP008,
              CP009]。但备用零部件库存管理、采购订单和基于仪表读数的预防性维护触发器等关键运营能力，严格锁在 Premium 层级之后 [CP008,
              CP009]。这给成长中的维护团队造成明显定价摩擦：当整个设施增加一线技术人员时，所有席位都被迫进入每用户每月 $65 至 $75 的区间 [CP008, CP010]。相比之下，UpKeep
              在较低价格点就提供基于仪表读数的维护和零部件库存，却把离线移动端和完整生命周期跟踪锁在更高层级 [CP009]。Maintainly 等重视性价比的专用竞品提供模块化附加项，避免迫使每个席位进入高固定层级，但
              Maintainly 不支持离线移动端 [CP008, CP011]。
            claimRefs:
              - CP008
              - CP009
              - CP010
