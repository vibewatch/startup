      - number: '6.3'
        title: 留存韧性、扩张摩擦与企业阻碍
        blocks:
          - type: paragraph
            body: >-
              当客户试图从局部车间试点扩展到全企业部署时，MaintainX 的商业扩张遭遇结构性的采购与合规障碍。首先，欧洲企业运营商面临会导致淘汰的合规摩擦，因为 MaintainX 通过 24
              家美国子处理器仅在美国托管云数据，采用标准合同条款而非当地欧盟数据驻留。这一架构使 MaintainX 在 DACH 公共管理、医疗机构和工业车队的候选名单中出局；同时，缺乏原生德国法定安全巡检流程（DGUV
              V3、UVV），迫使欧洲用户维护并行的点解决方案。其次，MaintainX 将 IoT 状态监测、单点登录（SSO）、基于仪表读数的维护和高级报告等关键企业功能锁在每用户每月 65 美元层级及定制
              Enterprise 合同之后。按席位分层的结构让组织增加现场技术人员、承包商和站点主管时成本明显爬升。第三，企业买方指出，MaintainX
              缺少原生资产生命周期财务跟踪（如租赁排程、折旧排程和保修成本中心建模）及直接机器遥测输入，把资产当作静态行政记录，而非联网机器。在围绕 Autodesk 36
              亿美元交易的收购分析中，市场分析师将该客户基础能否维持强劲净美元留存视为长期企业软件韧性的首要检验，而客户数层面的收入集中度仍未披露。
