  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别范围与分类错位
        blocks:
          - type: paragraph
            body: >-
              MaintainX 处在计算机化维护管理系统（CMMS）、一线工作执行和企业资产管理（EAM）的交叉地带。过去，维护软件行业一边是面向会计合规、以桌面为核心的重型 EAM
              平台，另一边是现场技术人员使用的纸质夹板。MaintainX
              围绕移动优先的工单执行、预防性维护排程和技术人员实时沟通划定市场边界，明确覆盖运营工作执行、流程清单、资产健康记录和零部件库存跟踪，同时排除核心企业财务账簿及建筑设计工程。值得注意的是，6sense
              等自动化软件聚合器却把 MaintainX 与 Apache Airflow、Control-M 等系统一起归入通用 IT 工作流自动化，暴露出明显的分类失真，掩盖了 MaintainX
              对工业实体资产和无固定办公桌一线劳动力的专注。
            claimRefs:
              - CM001
              - CM002
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM013
      - number: '2.2'
        title: 市场规模、停机经济学与收入轨迹
        blocks:
          - type: paragraph
            body: >-
              衡量 MaintainX 的可服务市场，必须区分宏观工业运营损失与可争取的软件预算。计划外设备停机使一家典型 Fortune 500 企业每年损失约 $2.8 billion，约占收入的 11
              percent；大型制造工厂平均每年损失 $253 million。全球工业 CMMS 和运营软件的核心可服务市场估计为 $4.5 billion 至 $6.0 billion，背后还有预测性维护带来的 $233
              billion 潜在效率红利。MaintainX 从种子期产品上线后快速扩张，预计 2025 年 ARR 达到 $115.5 million，并预计 2026 日历年 ARR 超过 $135
              million、年增长率高于 50 percent。这轮扩张支撑了 Autodesk 最终敲定的 $3.6 billion 收购协议，对 MaintainX 的定价约为前瞻 ARR 的 26 times。
