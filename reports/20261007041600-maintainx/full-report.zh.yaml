      - number: '2.3'
        title: 买方分层、预算归属与采购动作
        blocks:
          - type: paragraph
            body: >-
              MaintainX
              服务分层买方市场，覆盖中端制造、多设施运营和重工业企业。主要经济买方通常是运营副总裁或设施总监，而日常活跃用户是一线工厂技术人员、维护技工和可靠性工程师。预算主要来自运营支出（OpEx），而非中央企业 IT
              资本资金。MaintainX 以免费 Basic 方案驱动产品主导增长，再在组织需要基于仪表读数的预防性维护、自动化零部件采购订单和多站点分析等高级能力时，转入每用户每月 20 美元和 65
              美元的付费层级。在企业规模下，MaintainX 借助 AWS Marketplace 等云合作伙伴市场简化企业采购与安全审批，支持超过 14,000 家组织的活跃客户基础。
            claimRefs:
