  summary: >-
    MaintainX 是一个移动优先的计算机化维护管理和企业资产管理平台，面向工业一线团队。公司成立于 2018 年，总部位于旧金山，将工单、巡检、预防性维护、零部件流程和 AI 辅助报告整合进订阅制 SaaS
    产品，服务制造、设施、物流及其他资产密集型运营。公司称客户组织超过 14,000 家，并在 Autodesk 宣布以约 36 亿美元全现金收购前累计获得 2.54
    亿美元风险投资。公开证据支持其采用率和增长势头较强，但未披露经审计收入、毛利率、净收入留存率或独立现金消耗。
