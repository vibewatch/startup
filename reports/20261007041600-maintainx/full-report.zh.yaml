        - 增长放缓至 35% 以下；净留存下滑；一线用户抵制企业 ERP / Autodesk 捆绑
        - 独立软件价值压缩至 ARR 的 12x-15x（$1.6B-$2.0B 独立内在价值）
        - Autodesk 面临大额减值风险；关键客户转投独立点解决方案
        - 20%
    notes: 概率信号和回报逻辑评估 Autodesk 在 $3.6B 全现金 收购中承接的风险回报特征。远期 ARR 基准锚定 Autodesk 官方 2026 日历年指引。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
figures:
  - id: FO001
    title: MaintainX 公司发展与资本化时间线
    type: timeline
    summary: 按时间顺序展示 MaintainX 公司成立、机构融资轮次、产品发布及 收购协议的时间顺序。
    data:
      items:
        - date: '2018'
          label: 公司成立
          detail: Chris Turlica 和 Hugo Dozois-Caouette 在旧金山创立 MaintainX，打造移动优先的一线 CMMS。
        - date: 2019-03
          label: 首轮风险融资
          detail: 公司筹集首轮风险资本，用于打造核心工单和检查软件。
        - date: 2021-06
          label: B 轮融资（$39M）
          detail: Bessemer Venture Partners 联合 Amity、August Capital 和 Ridge Ventures 领投 $39M B 轮。
        - date: 2023-12
          label: C 轮融资（$50M）
          detail: Bain Capital Ventures 领投 $50M 轮融资，投后估值 $1.0B，跻身独角兽。
        - date: 2025-07
          label: D 轮融资（$150M）
          detail: Bessemer 和 BCV 共同领投 $150M 轮，估值 $2.5B，使累计风险融资达到 $254M。
        - date: 2026-03
          label: Report Builder AI 发布
          detail: MaintainX 发布自然语言报告工具，让维护负责人生成定制化可视化 洞察。
        - date: 2026-05
          label: Autodesk 收购协议
          detail: Autodesk 同意以 $3.6B 现金收购 MaintainX；MaintainX 预计 CY2026 ARR 超过 $135M，增长 >50%。
    approximationNotes: 时间线里程碑涵盖公司成立、主要风险融资、AI 功能发布及最终并购 交易公告。
    claimRefs:
      - CO001
      - CO003
      - CO012
      - CO013
      - CO014
      - CO015
  - id: FM001
    title: 市场规模与运营机会层级
    type: pyramid
    summary: 分层规模对比宏观经济停机成本、可触达软件市场和 MaintainX 的 签约收入轨迹。
    data:
      items:
        - label: 宏观经济停机机会
          detail: Fortune 500 企业平均每年损失 $2.8B（工业制造全球潜在效率节省 $233B）。
          value: $233B+
          tone: neutral
          claimRefs:
            - CM006
        - label: 全球一线运营支出
          detail: 面向无桌面工作人员的运营劳动力和工具支出，他们约占全球劳动力的 80% 。
          value: 80% Deskless
          tone: neutral
          claimRefs:
            - CM013
        - label: 总可触达市场（TAM）
          detail: 覆盖工业设施的全球专业 CMMS 和企业维护管理软件支出。
          value: $4.5B–$6.0B
          tone: neutral
          claimRefs:
            - CM004
        - label: 可服务市场（SAM）
          detail: 云原生、移动优先的一线工作执行和预防性维护软件，替代传统 电子表格。
          value: $1.5B–$2.2B
          tone: neutral
          claimRefs:
            - CM004
            - CM012
        - label: 可获取市场（SOM）
          detail: 中端市场制造、设施和离散运营中的分层 SaaS CMMS 采用。
          value: $300M–$450M
          tone: neutral
          claimRefs:
            - CM012
        - label: MaintainX 签约规模
          detail: 2026 日历年预计 ARR 超过 $135 million，14,000+ 家客户同比增长 >50%。
          value: $135M+ ARR
          tone: positive
          claimRefs:
            - CM004
            - CM009
    approximationNotes: TAM、SAM 和 SOM 数字代表行业共识规模区间；停机经济成本反映 Fortune 500 运营损失调查数据； ARR 规模反映 Autodesk 收购协议下的管理层目标。
    claimRefs:
