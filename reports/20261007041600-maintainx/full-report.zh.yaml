  - id: FU001
    title: MaintainX 客户采用生命周期与扩张摩擦点
    type: journey-map
    summary: 展示客户账户从最初采用移动工单到企业多站点 扩张的进程，并标出关键摩擦关口。
    data:
      nodes:
        - label: 一线试点
          description: 技术员在 Basic 或 Essential 层级上于 1-2 周内采用移动工单和清单。
        - label: 部门标准
          description: 维护经理在单个设施内引入定期 PM、零件跟踪和照片记录。
        - label: 多站点推广
          description: 运营负责人尝试跨多个设施标准化，并升级至 Premium（$65/user/mo）以获得报告功能。
        - label: 企业治理关口
          description: 采购团队评估深度 ERP 集成（SAP/Oracle）、IoT 遥测和 SSO 要求。
        - label: 合规与数据驻留障碍
          description: 欧洲招标遇到仅在美国的云子处理商，以及缺少原生 DGUV 检查工作流。
        - label: 完整企业生产
          description: 成熟账户与 Autodesk AOS / Tandem 数字孪生集成，进行数十年资产生命周期 跟踪。
    approximationNotes: 代表综合 G2 用户评测、ToolSense 采购分析和 Autodesk 投资者材料得出的客户采用进程。
