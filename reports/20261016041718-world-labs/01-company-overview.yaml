callouts:
  - calloutType: risk
    title: "Commercial evidence still lags strategic momentum"
    body: >-
      The assigned pool supports a real launch-and-funding story, but it does not support conviction on revenue,
      customer count, exact headcount, board structure, or post-close terms continuity. That asymmetry matters
      because the pending AMD price can otherwise look cleaner than the underlying commercial disclosure.
    claimRefs: [CO007, CO010, CO011, CO014]
