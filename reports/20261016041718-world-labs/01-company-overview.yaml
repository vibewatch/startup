      - ["Justin Johnson", "Co-founder; quoted publicly on Marble and described as continuing to lead the World Labs team", "Worked on generative models at Stanford per HokAI", "Bridges research commercialization, product positioning, and creator use cases", "High: product credibility and launch messaging are repeatedly tied to Johnson."]
      - ["Christoph Lassner", "Co-founder", "Built the Pulsar renderer at Meta Reality Labs and Epic Games per HokAI", "Adds rendering and 3D systems depth that fits World Labs' explicit 3D product strategy", "Medium: less public-facing than Li or Johnson, but central to graphics execution."]
      - ["Ben Mildenhall", "Co-founder; described by HokAI as continuing to lead the team post-deal", "Co-created NeRF at Google Research per HokAI", "Strengthens the world-model and view-synthesis research base behind Marble and Atlas", "High: technical continuity through the AMD transition appears to depend partly on retained founders."]
    notes: "Covers the named founders and current leaders visible in assigned public sources; board membership and independent governance are not publicly enumerated here."
