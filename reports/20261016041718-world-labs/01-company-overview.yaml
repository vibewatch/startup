company:
  name: World Labs
chapter:
  number: 1
  title: Company Overview
  summary: >-
    World Labs has moved from stealth funding to a pending $8.2 billion AMD sale in roughly two years, with Marble,
    the World API, Atlas, and the SceniX acquisition showing a company that is shipping and expanding quickly.
    The same public record still leaves material gaps around revenue, customer count, headcount, board structure,
    and even the founding date, so later chapters should reuse the identity facts below selectively rather than
    treat every profile datapoint as settled ground truth.
sections:
  - id: identity-and-product-surface
    title: Identity, product surface, and what is actually public
    body: >-
      Public sources agree on the broad business description: World Labs is building spatial-intelligence software
      around persistent, navigable 3D worlds, with Marble as the main product surface and the World API as the
      programmable interface for developers. The current documentation and launch materials support a concrete
      product story -- text, image, video, panorama, and coarse 3D inputs become editable 3D worlds that can be
      rendered on the web or exported into downstream tools. What is less cleanly settled is the company identity
      itself. HokAI's October 2026 profile says World Labs was founded in January 2024 in San Francisco by Fei-Fei
      Li, Justin Johnson, Christoph Lassner, and Ben Mildenhall, while a Silicon Valley Invest Club profile lists a
      2017 founding year for the same business. That conflict is material because later diligence on team velocity,
      capital efficiency, and valuation step-ups depends on whether the company should be treated as a 2024 startup
      or as a longer-running effort whose public emergence simply came later.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO010, CO011, CO014]
    tableRefs: [TO001]
  - id: leadership-funding-and-ownership
    title: Leadership, funding, and the ownership transition
    body: >-
      The core leadership picture is clearer than the founding-date record. Across current third-party profiles,
      Fei-Fei Li remains the central operating and narrative figure, with Johnson and Mildenhall still positioned as
      product and technical leaders around the AMD transaction. The September 2026 agreement to sell World Labs to
      AMD for about $8.2 billion in stock is the defining ownership event in the current refresh cycle, and the
      transaction matters beyond price because it reframes World Labs from a venture-backed standalone platform into
      a research-and-product asset inside a semiconductor company if it closes. Funding history is directionally
      strong but still incomplete in governance detail: the public record supports about $1.23 billion of disclosed
      capital raised, including a $1 billion round announced on February 18, 2026, but it does not provide a public
      shareholder register, board composition, control rights, or full commercial terms around strategic investors
      such as Autodesk and AMD.
    claimRefs: [CO004, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestone-cadence-and-open-gaps
    title: Milestone cadence and the remaining diligence gaps
    body: >-
      The milestone cadence is real and unusually compressed. World Labs moved from an early public research moment
      in late 2024 to RTFM in October 2025, public Marble availability in November 2025, the World API in January
      2026, SceniX in July 2026, Atlas in September 2026, and a signed AMD deal later that same month. That pace
      supports the view that this is not a pre-product story anymore. At the same time, the strongest adverse
      evidence in the assigned pool is not about product absence; it is about commercial opacity. Independent
      analysts still say World Labs has disclosed no revenue or ARR despite charging for Marble, offering paid API
      credits, and attracting both a $5 billion private-round valuation discussion and an $8.2 billion pending exit.
      Later chapters should therefore treat customer scale, exact headcount, board oversight, and post-close pricing
      continuity as live diligence items rather than facts established by this chapter.
    claimRefs: [CO003, CO007, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
