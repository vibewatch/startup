evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: >-
      Primary-source incorporation or company-authored founding-date disclosure that resolves the 2024 versus 2017
      conflict.
    whyItMatters: >-
      Founding date changes the frame for speed of execution, capital efficiency, and how investors should interpret the
      valuation ramp.
    diligencePath: >-
      Request incorporation records, cap-table history, or a management-confirmed timeline that states the official
      founding date used in board materials.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      Management-confirmed revenue, ARR, paid-customer count, and exact headcount for the Marble and World API
      businesses.
    whyItMatters: >-
      The chapter can support product availability and funding history, but it cannot support commercial scale or
      operating leverage without these numbers.
    diligencePath: >-
      Obtain KPI snapshots, board packs, or audited/internal operating metrics that separate pilots from recurring
      production usage.
  - type: missing-source
    severity: material
    topic: governance-and-post-close-terms
    missingEvidence: >-
      Current board composition, control rights, and any documented customer-term changes tied to the pending AMD
      transaction.
    whyItMatters: >-
      Ownership transition risk cannot be judged cleanly without knowing who governs the company now and whether
      customer economics or roadmap commitments change at close.
    diligencePath: >-
      Request board observer/seat map, financing documents, and any customer communications or contract amendments tied
      to the AMD transaction.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent TAM, SAM, or demand-by-segment totals for spatial-intelligence or persistent 3D world-generation
      workflows.
    whyItMatters: >-
      Without an external demand denominator, valuation and adoption debates lean on narrative and strategic capital
      instead of measurable market share.
    diligencePath: >-
      Obtain analyst, public-company, or industry-association market data broken out by creator, developer, and
      industrial simulation budgets.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Revenue, active customer count, renewal data, and named production deployments for Marble subscriptions and the
      World API.
    whyItMatters: These metrics determine whether self-serve adoption is novelty, repeat usage, or an emerging software business.
    diligencePath: >-
      Request management KPI disclosure or customer references with contract scope, production status, and renewal
      evidence.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: missing-source
    severity: material
    topic: atlas-commercialization
    missingEvidence: Atlas pricing, named early-access partners, and public terms for enterprise availability.
    whyItMatters: >-
      Atlas is the clearest bridge to higher-value enterprise budgets, but procurement cannot be modeled without price
      and access data.
    diligencePath: Ask management for partner references, pricing architecture, and launch timing for Atlas commercial access.
    relatedQuestionRefs:
      - QM005
      - QM007
  - type: missing-source
    severity: minor
    topic: roi
    missingEvidence: >-
      Public ROI or payback case studies showing how Marble or World API changes cost, cycle time, or output quality
      versus incumbent 3D workflows.
    whyItMatters: >-
      Workflow fit is clear, but budget conversion will depend on measurable productivity gains rather than product
      novelty.
    diligencePath: Collect case studies from Marble Labs, partner pilots, or customer interviews with before/after workflow metrics.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: missing-source
    severity: material
    topic: enterprise-pricing
    missingEvidence: World API rate card, enterprise minimums, SLAs, volume discounts, or Autodesk-linked commercial terms.
    whyItMatters: >-
      Without contract economics, it is hard to compare World Labs against incumbent software seats, startup APIs, or
      internal-build ROI.
    diligencePath: Request enterprise pricing sheets, MSA language, and any Autodesk commercial distribution attachments.
    relatedQuestionRefs:
      - QP003
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named production customers with contract scope, deployment scale, renewal evidence, and separation of pilots from
      scaled usage.
    whyItMatters: >-
      Customer proof is the cleanest way to test whether World Labs' workflow breadth is translating into durable
      adoption.
    diligencePath: Request customer references, signed statements of work, renewal cohorts, and API usage concentration data.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Evidence on repeat workflow usage, export re-use, time saved versus incumbent pipelines, and churn after trial
      tiers.
    whyItMatters: >-
      Switching cost and lock-in cannot be assessed from capability claims alone; they depend on embedded workflow
      behavior.
    diligencePath: >-
      Request case studies with before/after workflow timing, expansion from self-serve to team contracts, and retention
      by use case.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-gap
    missingEvidence: >-
      Product-level revenue, ARR, growth, deferred revenue, and revenue mix across Marble, API, and enterprise
      contracts.
    whyItMatters: >-
      Public packaging does not establish revenue quality, scale, or durability, so underwriting remains incomplete
      without topline and mix data.
    diligencePath: >-
      Request monthly management reporting, cohort revenue waterfall, and contract-level revenue concentration for the
      last 12 months.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by workflow, infrastructure cost per generation/export, CAC, payback, and sales-cycle data.
    whyItMatters: >-
      The docs imply meaningful compute intensity, but there is no public bridge from workload to contribution margin or
      customer acquisition efficiency.
    diligencePath: >-
      Request unit-economics model by product surface, cloud/GPU cost allocations, and sales funnel metrics from lead to
      paid deployment.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A verified current employee count and payroll footprint reconciling the 150-employee and 50-100-team public
      proxies.
    whyItMatters: >-
      Burn estimates and operating leverage assumptions materially change depending on which staffing figure is closer
      to reality.
    diligencePath: >-
      Request current org chart, FTE count by function and geography, contractor spend, and the latest monthly payroll
      run.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-continuity
    missingEvidence: >-
      Public or management-confirmed post-close contract continuity, grandfathering, and roadmap commitments for Marble
      and the World API.
    whyItMatters: >-
      A pending change of control can affect pricing power, renewals, customer willingness to commit, and whether
      current packaging remains a valid forecast base.
    diligencePath: >-
      Request AMD integration plan, customer communication drafts, renewal language, and any board-approved post-close
      pricing policy.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-gap
    missingEvidence: Public security, privacy, certification, or incident-management documentation for Marble and Atlas.
    whyItMatters: >-
      Enterprise, developer-platform, and robotics buyers need explicit control evidence before relying on generative 3D
