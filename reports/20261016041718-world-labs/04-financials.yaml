schemaVersion: report-v2
artifact: financials
slug: world-labs
runDate: 2026-10-16
company:
  name: World Labs
chapter:
  number: 4
  title: Financials
  summary: >-
    World Labs now shows a public monetization surface across Marble subscriptions and a
    separately billed World API, but retained evidence still stops short of disclosing
    revenue, gross margin, burn, or cash. The February 2026 $1 billion financing and
    pending $8.2 billion AMD sale reduce immediate capital stress, yet they do not replace
    the operating data needed to underwrite revenue quality or runway.
sections:
  - id: public-monetization-surfaces
    title: Public monetization surfaces exist, but realized pricing does not
    body: >-
      World Labs now has two clearly public commercial surfaces: the Marble application and
      the World API. Official product material shows Marble as a persistent 3D-world
      creation workflow rather than a demo viewer, and World Labs' November 2025 launch post
      moved the product from beta to general availability. Third-party pricing coverage adds
      useful packaging detail: HokAI says Marble runs from a free plan capped at four world
      generations through a Max plan capped at 75, with separate enterprise packaging, while
      the API is sold on a fixed credit schedule. What remains missing is the reader's core
      underwriting bridge: no retained source discloses actual subscription price points for
      each Marble tier, realized discounts, revenue mix between app and API, or conversion
      from free usage into paid revenue.
    claimRefs: [CI002, CI003, CI008, CI009, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-proxies
    title: Unit economics are mostly inferential because public cost and volume data are thin
    body: >-
      The strongest public cost-structure proxy is operational rather than financial. World
      Labs' own documentation lists generation times from roughly 20 seconds for a draft to
      around one hour for a high-quality mesh export, implying compute-heavy and likely
      variable service-delivery cost by workflow. Public traction evidence is also
      directional, not underwritable: StartupHub says World Labs already has paying
      customers across gaming, visual effects, robotics training, and architectural design,
      while HokAI describes self-serve free-plan onboarding for Marble and separate account
      funding for the API. Even the burn proxy is unstable because public headcount signals
      conflict, with StartupHub citing 150 employees while HokAI lists a 50-100 team range.
      That combination supports commercial activity, but not a defendable CAC, payback, or
      gross-margin model.
    claimRefs: [CI004, CI010, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital availability looks strong on paper, but runway cannot be verified
    body: >-
      Public financing visibility is much better than operating visibility. World Labs'
      February 2026 funding announcement says the company raised $1 billion from a syndicate
      that included AMD, Autodesk, Emerson Collective, Fidelity Management & Research
      Company, NVIDIA, and Sea. Forbes adds that Autodesk contributed $200 million and took
      a strategic advisory role, while Bloomberg previously reported an approximately $5
      billion round valuation that the company declined to confirm. The September 2026 AMD
      transaction announcement creates a second capital support vector: Ars and HokAI both
      describe an about-$8.2 billion all-stock acquisition agreement targeted to close by
      year-end, subject to approval. That backdrop materially lowers the odds of a near-term
      emergency capital raise, but it still does not reveal cash on hand, monthly burn,
      working-capital needs, or debt obligations.
    claimRefs: [CI005, CI006, CI007, CI011, CI012]
  - id: financial-verdict
    title: "Financial verdict: compelling strategic funding story, insufficient underwriting data"
    body: >-
      The retained evidence supports a credible revenue architecture and a much stronger
      balance-sheet narrative than the June 2026 report had, but not a full underwriting
      case. Marble and the API give World Labs visible monetization rails, and the company
      appears to have reached at least some paid usage across multiple verticals. However,
      the most important investor-grade inputs remain absent from the public record: revenue,
      ARR, gross margin, burn, cash, customer concentration, renewal behavior, and any clear
      statement of post-close contract continuity. The right financial conclusion is
      therefore not that the business lacks traction, but that public evidence still cannot
      separate product promise from durable economics. Treat capital dependency as buffered
      in the short term and underwriting quality as still diligence-blocked.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Marble subscriptions
        - Self-serve creator app for generating, editing, and exporting persistent 3D worlds
        - Plan / world-generation allowance
        - Free through Max tiers plus custom enterprise packaging are public; exact dollar prices are not in retained evidence
        - Packaging is visible, but realized ASP and discounts are unknown
        - Request plan price sheet, paid-seat counts, upgrade funnel, and enterprise mix
      - - World API
        - Developer credit purchases for the same generation engine
        - Credits
        - 1,250 credits per $1, $5 minimum purchase, credits do not expire
        - Public unit pricing is visible, but usage-to-revenue conversion is undisclosed
        - Request active developers, monthly credit consumption, and gross margin per workload
      - - Enterprise / custom contracts
        - Negotiated commercial terms attached to Marble enterprise plans
        - Contract / minimum commit
        - Enterprise availability is disclosed, but scope, services, and pricing are not
        - Suggests larger-ticket motion without ACV or services burden disclosure
        - Request standard order form, services attachments, and minimum annual commitments
    notes: >-
      Built from retained official product surfaces plus HokAI's packaging summary; rows mark
      public packaging visibility separately from undisclosed realized pricing and revenue mix.
    claimRefs: [CI002, CI008, CI009]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Marble Free
        - Up to 4 world generations; no commercial rights
        - Usage cap disclosed, dollar price inherently zero
        - Conversion rate into paid tiers is unknown
        - HokAI
      - - Marble Standard
        - Up to 12 world generations
        - Tier exists, but retained evidence does not include list price
        - No public ASP, discount, or seat information
        - HokAI
      - - Marble Pro
        - Up to 25 world generations; adds commercial rights and textured mesh export
        - Feature and usage cap disclosed, list dollar price absent
        - No evidence on realized price, negotiated discounts, or attach rates
        - HokAI
      - - Marble Max
        - Up to 75 world generations
        - Tier exists, but retained evidence does not include list price
        - No public evidence on who buys Max or whether limits are soft
        - HokAI
      - - World API
        - 1,250 credits per $1; $5 minimum purchase; credits do not expire
        - Exact public unit price disclosed
        - No evidence on volume breaks, enterprise commits, or effective realized pricing
        - HokAI
    notes: >-
      Retained evidence provides usage caps and API credit pricing but not the Marble pricing
      page's dollar amounts, so unknowns are preserved rather than estimated.
    claimRefs: [CI008, CI009]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Public revenue / ARR
        - Not disclosed
        - Low
        - Revenue quality cannot be underwritten without product-level topline and growth
        - Monthly revenue, ARR, growth, deferred revenue, and product mix by Marble vs API
      - - Paying-customer proof
        - Paying customers reported across gaming, visual effects, robotics training, and architectural design; customer count undisclosed
        - Medium
        - Confirms some monetization breadth but not scale, concentration, or renewal quality
        - Production customer list, contract size, renewal status, and pilot-to-production conversion
      - - Compute / service-delivery proxy
        - Docs list ~20 sec draft generation, ~5 min world generation, and ~1 hr high-quality mesh export
        - High
        - Long-running exports imply potentially meaningful GPU and support cost variability
        - Cost per generation/export, infrastructure burden, support load, and gross margin by workflow
      - - Team-size proxy
        - "Conflicting public proxies: 150 employees vs 50-100 team"
        - Low
        - Staffing ambiguity makes burn and fixed-cost estimates unreliable
        - Verified FTE count by function, contractor mix, and payroll run-rate
      - - Cash / runway
        - $1B funding announced in Feb 2026; current cash balance and monthly burn not disclosed
        - Medium
        - Round size alone does not reveal how much capital remains or how fast it is consumed
        - Cash on balance sheet, monthly burn, debt, lease obligations, and board runway plan
      - - Pricing continuity through AMD close
        - Post-close Marble and API terms not publicly committed
        - Medium
        - Renewal risk limits confidence in LTV, contract duration, and buyer willingness to commit
        - Change-of-control language, grandfathering policy, and product roadmap through closing
    notes: >-
      This is intentionally a diligence-oriented snapshot: retained sources expose only
      indirect proxies for economics, so nulls mark missing public data rather than zero values.
    claimRefs: [CI004, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how multimodal creation flows into subscriptions or API credit
      purchases, but not how those surfaces convert into realized revenue or gross profit.
    data:
      nodes:
        - id: inputs
          label: Customer inputs
          value: Text, image, video, panorama, or rough 3D layout
          note: Official surfaces describe multimodal creation as the entry point.
        - id: generate
          label: World generation
          value: Draft ~20 sec; world ~5 min
          note: Docs expose a public time-to-output proxy for compute intensity.
        - id: refine
          label: Edit / expand / compose
          value: Iterative world-building workflow
          note: Extra editing steps likely raise workload intensity, but no public price-per-action exists.
        - id: export
          label: Export / downstream use
          value: Meshes, videos, VR links, and development assets
          note: Usable downstream output is the customer value bridge, not just one-off generation.
        - id: app
          label: Marble subscriptions
          value: Free / Standard / Pro / Max / enterprise
          note: Packaging and generation caps are public; retained sources do not include dollar amounts.
        - id: api
          label: World API credits
          value: 1,250 credits per $1; $5 minimum
          note: API credits are a separate wallet from Marble app usage.
        - id: gp
          label: Revenue to gross profit
          value: Public bridge unavailable
          note: No retained source discloses realized pricing, revenue mix, gross margin, or cash collection.
      edges:
        - from: inputs
          to: generate
          relationship: Users submit multimodal prompts to create a world.
        - from: generate
          to: refine
          relationship: Customers edit, expand, and combine scenes before delivery.
        - from: refine
          to: export
          relationship: Value crystallizes when scenes are exported or integrated into downstream workflows.
        - from: export
          to: app
          relationship: Creator usage maps to Marble plan limits and enterprise packaging.
        - from: export
          to: api
          relationship: Developer workflows map to separate credit purchases through the API.
        - from: app
          to: gp
          relationship: Subscription-to-gross-profit conversion is not publicly disclosed.
        - from: api
          to: gp
          relationship: Credit-sales-to-gross-profit conversion is not publicly disclosed.
    approximationNotes: >-
      This is a qualitative commercial bridge, not a revenue waterfall: retained sources do
      not disclose transaction volumes, realized pricing, or margin conversion.
    claimRefs: [CI002, CI004, CI008, CI009, CI016]
callouts:
  - calloutType: insight
    title: Two monetization surfaces are visible, but only one has exact public unit pricing
    body: >-
      The retained pool shows Marble subscription packaging and a separately billed API, yet
      only the API exposes an exact public price-per-unit. That makes blended ASP, revenue
      mix, and free-to-paid conversion impossible to model from public evidence alone.
    claimRefs: [CI008, CI009]
  - calloutType: risk
    title: Capital support is clearer than economics
    body: >-
      The February 2026 $1 billion round and the pending AMD transaction both support the
      view that World Labs is unlikely to face immediate capital stress, but neither event
      discloses cash on hand, burn, debt, or margin. Financing headlines therefore reduce
      insolvency fear more than they improve revenue-quality underwriting.
    claimRefs: [CI005, CI011, CI012, CI013]
  - calloutType: recommendation
    title: Management data room requirements are obvious
    body: >-
      A serious investment decision still needs product-level revenue, pricing realization,
      gross margin by workflow, customer counts, renewal evidence, and verified headcount.
      Without those data, the business can be strategically exciting and still financially
      under-specified.
    claimRefs: [CI010, CI013, CI014, CI015]
