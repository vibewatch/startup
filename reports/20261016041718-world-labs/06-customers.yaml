callouts:
  - calloutType: "insight"
    title: "Best proof is in creator and developer-adjacent workflows"
    body: >-
      The strongest public customer evidence is not generic logo spray; it is a set of named creative, gaming, immersive, and developer-oriented workflows that align with Marble's export and API surfaces.
    claimRefs: ["CU001", "CU008", "CU009", "CU010"]
  - calloutType: "risk"
    title: "Durability still depends on evidence World Labs has not published"
    body: >-
      Public sources reviewed for this chapter do not disclose renewals, retention, customer concentration, or contract scope, so commercial durability remains materially less proven than top-of-funnel adoption.
    claimRefs: ["CU013", "CU014", "CU015"]
