company:
  name: "World Labs"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    World Labs has credible public evidence of top-of-funnel adoption for Marble: the product moved from an early beta to broad self-serve access, is packaged with paid plans, exposes export and sharing surfaces, and has at least some documented usage. The strongest named proof still clusters in creative and developer-adjacent workflows such as VFX, gaming, immersive media, and virtual production, while public sources in this pool do not show retention, concentration, or renewal evidence that would prove durable scaled enterprise adoption.
sections:
  - id: "customer-base-and-access-model"
    title: "Customer evidence starts with creators, technical teams, and developers"
    body: >-
      The public record in this pool points first to creator and technical users rather than classic procurement-led enterprise accounts. World Labs' own Marble Labs hub says it is for "artists, engineers, and designers" and frames public case studies around gaming, VFX, design, robotics, and health systems. The docs reinforce that positioning by organizing the product around Gallery, Create, and Studio, while Technology Magazine says the World API lets developers integrate generation into programmable workflows. Taken together, the visible customer base looks like a mix of self-serve creators, studios, developer teams, and experimental technical users, with the clearest proof concentrated in creative production and developer-adjacent use cases.
    claimRefs: ["CU001", "CU003", "CU006", "CU007", "CU008", "CU009", "CU010"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "public-adoption-signals"
    title: "Adoption signals are real, but the disclosed metrics remain thin"
    body: >-
      World Labs has more customer-proof than a stealth research lab, but less than a mature software vendor. The company blog says Marble progressed from an early beta cohort to general availability for anyone, and both Stanford Tech Review and TechCrunch describe a priced commercial product rather than a waitlist-only demo. Docs and the gallery show browsing, sharing, VR viewing, and export paths that make repeat project usage plausible. Even so, the clearest numeric adoption datapoint in the assigned pool is secondhand: an ICMR case study says Marble had 3,000+ users as of December 2025. Public materials do not disclose current active users, paid conversion, API usage, or segment mix, so visible momentum is easier to prove than present scale.
    claimRefs: ["CU002", "CU004", "CU005", "CU006", "CU007", "CU011"]
    tableRefs: ["TU002"]
  - id: "named-proof-and-durability"
    title: "Named proof favors creative collaborations, while durability is still unproven"
    body: >-
      The named references World Labs publishes are useful but should be scored carefully. Marble Labs names Promise, Magnific, OpenArt, HTC VIVE, Escape.ai, WithLore, Rosebud AI, VIVERSE, James C. Kane, and a joint Lightcraft/Beeble example, which is enough to show real external usage conversations and workflow experiments. However, those headlines do not confirm production status, contract value, renewal behavior, or expansion. Independent sources in this pool also stay cautious: ICMR says there were still questions about product-market fit and scaled industry adoption, while the broader external coverage emphasizes packaging, category creation, and early creative use cases more than customer durability. Public evidence therefore supports adoption interest and workflow relevance, but not customer concentration, retention, or enterprise depth.
    claimRefs: ["CU009", "CU012", "CU013", "CU014", "CU015"]
    tableRefs: ["TU003"]
