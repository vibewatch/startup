      - ["Multimodal input", "Text, image, video, panorama, and coarse 3D structure", "Not fully disclosed across retained peer sources", "Internal build can combine tools, but with more workflow overhead", "Broader entry points for different creator workflows"]
      - ["Native editing / structure control", "Edit, expand, compose, and Chisel structure controls", "Unknown in retained peer sources", "Manual DCC tools still offer deepest explicit control", "World Labs optimizes fast iteration rather than final-authoring depth"]
      - ["Export / pipeline compatibility", "Gaussian splats, meshes, videos, VR links, DCC integration", "Unknown in retained peer sources", "Incumbent stack already owns final delivery and file formats", "Lower switching cost, but weaker lock-in"]
      - ["Public pricing / commercial proof", "List pricing public; customer economics private", "Runway ARR disclosed; others mostly private in retained sources", "Existing software stacks have mature procurement patterns", "World Labs is easier to trial than to underwrite"]
