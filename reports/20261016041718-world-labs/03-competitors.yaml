  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Option
      - Public price signal
      - Unit / contract model
      - Included capabilities
      - Known unknowns
      - Competitive implication
    rows:
      - ["Marble Free", "Free", "4 generations", "Text, image, or panorama generation", "Enterprise support, retention, and conversion data unknown", "Low-friction top-of-funnel wedge"]
      - ["Marble Standard", "$20/month", "12 generations", "Adds multi-image/video input and advanced editing", "Realized discounting and overages unknown", "Accessible prosumer entry price"]
      - ["Marble Pro", "$35/month", "25 generations", "Adds scene expansion and commercial rights", "No public evidence on team/seat packaging", "Targets small commercial creators before enterprise procurement"]
      - ["Marble Max", "$95/month", "75 generations", "All features at highest self-serve tier", "Volume economics and margin profile unknown", "Upper self-serve bound still looks modest versus enterprise software budgets"]
      - ["World API", "Public access, but retained sources do not disclose price", "Pay-per-use API", "Asynchronous 3D world generation for developer use", "Contract minimums, SLAs, and volume pricing unknown", "Enterprise moat depends on terms the public record does not show"]
      - ["Peer / incumbent alternatives", "Not disclosed in retained sources", "Varies across startup APIs, incumbent software seats, and internal build", "Depends on vendor or internal workflow", "No normalized TCO comparison in retained evidence", "Buyer comparison likely centers on workflow fit before price"]
    notes: >-
      This table separates published list pricing from unknown realized economics. Peer and incumbent pricing stays “unknown” because the retained source set does not support a normalized apples-to-apples comparison.
    claimRefs: [CP003, CP004, CP013, CP016]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      World Labs plots high on workflow breadth but only mid-tier on public commercialization proof because pricing is visible while revenue and customer metrics are not.
    data:
      xAxis:
        label: "Workflow control / pipeline fit"
        min: 1
        max: 5
        low: "demo / narrow"
        high: "editable / pipeline-ready"
        description: "Ordinal score from retained evidence on editing, export, and workflow integration."
        scale: "ordinal"
      yAxis:
        label: "Public commercialization proof"
        min: 1
        max: 5
        low: "limited proof"
        high: "strong disclosed proof"
        description: "Ordinal score from retained evidence on pricing, customers, revenue, or distribution evidence."
        scale: "ordinal"
      points:
        - { label: "World Labs", x: 4, y: 3 }
        - { label: "Runway", x: 4, y: 5 }
        - { label: "Decart", x: 3, y: 3 }
        - { label: "Odyssey", x: 3, y: 2 }
        - { label: "Google DeepMind / Genie 3", x: 2, y: 4 }
        - { label: "Nvidia / Cosmos", x: 4, y: 4 }
    approximationNotes: >-
      Ordinal scoring synthesizes retained evidence rather than vendor-reported benchmarks: World Labs scores high on editing/export breadth and mid on commercialization because list pricing is public but revenue and customer counts are not; Runway scores highest on proof due to cited ARR; Decart and Odyssey score from funding and positioning with limited public economics; Google DeepMind and Nvidia score on incumbent research or platform reach instead of startup monetization.
    claimRefs: [CP004, CP005, CP009, CP010, CP011, CP013]
callouts:
  - calloutType: insight
    title: Workflow fit is the strongest current wedge
    body: >-
      World Labs' most defensible near-term story is not that it has no rivals, but that
      Marble already fits recognizable creative and simulation workflows through multimodal
      generation, editing, export, and browser/VR delivery.
    claimRefs: [CP002, CP008, CP014]
  - calloutType: risk
    title: Commercial proof lags product ambition
    body: >-
      The biggest adverse signal is not lack of product breadth; it is that peers such as
      Runway show stronger disclosed economics while World Labs still withholds revenue,
      customer-count, renewal, and enterprise-pricing evidence.
    claimRefs: [CP012, CP013, CP016]
