      - [Spatial context model core, "Atlas publicly describes a multimodal autoregressive diffusion transformer grounded in 3D spatial context", "Large-scale training compute plus multimodal/world-model inference stack", "No public Marble paper, independently reproduced Atlas evaluation, or architecture-level performance envelope"]
      - [Interactive control layer, "Chisel, editing, expansion, composition, and recording convert model output into controllable creator workflows", "Product UX, scene-editing tools, and model responsiveness", "Independent evidence on edit reliability, collaboration, and rollback controls is thin"]
      - [Output and runtime layer, "Worlds can be exported as Gaussian splats, meshes, videos, VR links, or development assets", "Renderer/export toolchain and downstream engine compatibility", "Public sources do not quantify export fidelity, asset cleanup burden, or enterprise support obligations"]
    notes: >-
      This table reconstructs the operating stack from public system descriptions; it is not a code-level
      architecture disclosure and therefore keeps hidden internals as explicit diligence risk.
    claimRefs: [CE002, CE003, CE004, CE005, CE007, CE010]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Marble commercializes a layered world-creation workflow while Atlas sits underneath as the next-generation model core.
    data:
      layers:
        - label: Input and capture layer
          detail: User-provided conditioning and reference material.
          items:
            - Text prompt
            - Single image
            - Multiple images
            - Panorama
            - Video clip
            - Coarse 3D structure
        - label: Spatial context model layer
          detail: Publicly described model and world-building core.
          modules:
            - Atlas multimodal autoregressive diffusion transformer
            - Shared spatial context grounding
            - World generation
            - Spatial reconstruction
            - Space-time simulation
        - label: World representation layer
          detail: Persistent scene representations bridge generated views and explicit 3D output.
          modules:
            - Image frames
            - Depth maps
            - Point clouds
            - Gaussian splats
        - label: Control and editing layer
          detail: Creator tooling that turns model output into editable scenes.
          modules:
            - Chisel structure controls
            - Pano edit
            - Click and expand
            - Compose
            - Record
        - label: Marble product layer
          detail: The documented web interface packages generation and editing into creator workflows.
          modules:
            - Gallery
            - Create
            - Worlds
            - Studio
        - label: Output and delivery layer
          detail: User-facing outputs and destinations.
          outputs:
            - Persistent 3D worlds
            - Gaussian splats
            - Triangle meshes
            - Videos
            - VR experiences
            - Development assets
    approximationNotes: >-
      The stack is reconstructed from public product and blog descriptions rather than from source code,
      internal diagrams, or benchmarking disclosures.
    claimRefs: [CE002, CE003, CE004, CE005, CE007]
callouts:
  - calloutType: strength
    title: Product story is concrete, not just conceptual
    body: >-
      The assigned public evidence shows a usable creator workflow with creation, editing, composition,
      recording, and export paths, which is much stronger than a pure research-demo narrative.
    claimRefs: [CE001, CE002, CE003, CE006]
  - calloutType: risk
    title: Public technical diligence is still shallow
    body: >-
      Independent sources repeatedly highlight missing technical detail and benchmark evidence, and this
      pool does not surface public security or certification artifacts, so production-readiness still needs
      substantial off-platform diligence.
    claimRefs: [CE010, CE011, CE012, CE013]
