company:
  name: World Labs
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    World Labs now has a real public product surface around Marble plus a next-generation Atlas model in
    early access, and the core public workflow is specific enough to underwrite what users can create,
    edit, export, and preview today. The technical differentiation story is promising—persistent 3D worlds,
    multimodal prompting, Chisel-based structure control, and exportable splats/meshes—but the public record
    still withholds independently reproducible benchmarks, safety artifacts, and deep technical disclosures
    that would let an investor separate frontier narrative from durable production readiness.
sections:
  - id: product-surface
    title: Product surface and user workflow
    body: >-
      The clearest delivered product is Marble, not Atlas. Across the product site, public docs, and the
      launch post, World Labs consistently describes Marble as a creator workflow for turning text, images,
      video, panoramas, and coarse 3D structure into persistent 3D environments that can then be edited,
      expanded, composed, recorded, and exported. That matters because it anchors the company in a practical
      workflow—scene creation and manipulation—rather than an abstract “world model” claim. The evidence
      also shows a split between what is usable today and what is still being staged for later rollout:
      Marble is broadly exposed through the web product and documentation, while Atlas is presented as early
      access and “coming to Marble soon,” which suggests World Labs is commercializing with a staged product
      ladder rather than a single fully generalized platform release.
    claimRefs: [CE001, CE002, CE003, CE008, CE009, CE014]
    tableRefs: [TE001, TE002]
  - id: architecture
    title: Architecture, operating model, and roadmap linkage
    body: >-
      Public technical detail is strongest at the system-description level. Atlas is described as a
      multimodal autoregressive diffusion transformer that grounds text, images, video, and 3D inputs into a
      shared spatial context; Marble is the product layer that packages that world-model capability into
      creation, editing, and export workflows. Together, the sources imply a stack with three layers:
      multimodal capture and prompting, spatial-context model inference, and downstream rendering/export
      surfaces such as splats, meshes, and recorded flythroughs. The product roadmap is also explicit that
      Atlas is intended to power future Marble versions, so current commercial surface area should be treated
      as a productization wrapper around a still-scaling model family rather than a frozen architecture.
    claimRefs: [CE004, CE005, CE006, CE007, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-risks
    title: Maturity, differentiation, and technical risks
    body: >-
      The differentiation story is credible but not yet fully de-risked. Independent coverage supports that
      Marble’s key distinction is persistent, downloadable 3D worlds with AI-native editing and structure
      control, which is a more operationally useful output than ephemeral 2D world demos. At the same time,
      independent observers also note that public technical disclosure is thin: there is no public Marble
      paper, Atlas benchmark discussion is company-authored rather than independently reproduced, and evidence
      on control, planning, or reliability under production conditions is limited. World Labs documents
      creator-facing generation times and desktop/mobile constraints, but the assigned source pool does not
      surface public security, privacy, certification, or uptime materials.
      That leaves the chapter’s core judgment unchanged: the product is specific enough to believe, but the
      technical diligence burden remains high before underwriting broad enterprise, robotics, or platform
      claims.
    claimRefs: [CE006, CE010, CE011, CE012, CE013, CE015]
