  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-gap
      missingEvidence: Public security, privacy, certification, or incident-management documentation for Marble and Atlas.
      whyItMatters: Enterprise, developer-platform, and robotics buyers need explicit control evidence before relying on generative 3D assets in production workflows.
      diligencePath: Request SOC 2 or ISO status, data-handling documentation, DPA terms, model-safety notes, and any public or customer-visible status/incident materials.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: disclosure-gap
      missingEvidence: Independent benchmarks or model-evaluation evidence on reconstruction fidelity, spatial consistency, latency, edit reliability, and export quality.
      whyItMatters: Without evals, investors cannot separate compelling demos from repeatable production-grade performance.
      diligencePath: Ask management for benchmark decks, user evaluation studies, red-team or failure-rate summaries, and customer validation on shipped workflows.
      relatedQuestionRefs: [QE006, QE008]
    - type: private-evidence-only
      severity: material
      topic: developer-signal
      missingEvidence: Public API usage, repo/package telemetry, or partner integration data showing durable external developer or practitioner adoption.
      whyItMatters: A platform valuation requires more than product demos; it needs proof that outside builders are integrating, extending, or repeatedly using the system.
      diligencePath: Request World API usage metrics, public integration references, change-log evidence, and any open-source or partner telemetry available for diligence.
      relatedQuestionRefs: [QE001, QE005, QE007, QE009]
