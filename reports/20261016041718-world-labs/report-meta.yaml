companyProfile:
  summary: >-
    World Labs builds a spatial-intelligence platform centered on Marble, the World API, and Atlas, aiming to turn
    multimodal inputs into persistent, editable, exportable 3D worlds. The company has moved from stealth into a visible
    commercial phase with paid packaging, public launches, and a signed AMD acquisition, but it still does not disclose
    revenue, customer concentration, or post-close commercial continuity.
