  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how multimodal creation flows into subscriptions or API credit purchases, but not how those
      surfaces convert into realized revenue or gross profit.
    data:
      nodes:
        - id: inputs
          label: Customer inputs
          value: Text, image, video, panorama, or rough 3D layout
          note: Official surfaces describe multimodal creation as the entry point.
        - id: generate
          label: World generation
          value: Draft ~20 sec; world ~5 min
          note: Docs expose a public time-to-output proxy for compute intensity.
        - id: refine
          label: Edit / expand / compose
          value: Iterative world-building workflow
          note: Extra editing steps likely raise workload intensity, but no public price-per-action exists.
        - id: export
          label: Export / downstream use
          value: Meshes, videos, VR links, and development assets
          note: Usable downstream output is the customer value bridge, not just one-off generation.
        - id: app
          label: Marble subscriptions
          value: Free / Standard / Pro / Max / enterprise
          note: Packaging and generation caps are public; retained sources do not include dollar amounts.
        - id: api
          label: World API credits
          value: 1,250 credits per $1; $5 minimum
          note: API credits are a separate wallet from Marble app usage.
        - id: gp
          label: Revenue to gross profit
          value: Public bridge unavailable
          note: No retained source discloses realized pricing, revenue mix, gross margin, or cash collection.
      edges:
        - from: inputs
          to: generate
          relationship: Users submit multimodal prompts to create a world.
        - from: generate
          to: refine
          relationship: Customers edit, expand, and combine scenes before delivery.
        - from: refine
          to: export
          relationship: Value crystallizes when scenes are exported or integrated into downstream workflows.
        - from: export
          to: app
          relationship: Creator usage maps to Marble plan limits and enterprise packaging.
        - from: export
          to: api
          relationship: Developer workflows map to separate credit purchases through the API.
        - from: app
          to: gp
          relationship: Subscription-to-gross-profit conversion is not publicly disclosed.
        - from: api
          to: gp
          relationship: Credit-sales-to-gross-profit conversion is not publicly disclosed.
    approximationNotes: >-
      This is a qualitative commercial bridge, not a revenue waterfall: retained sources do not disclose transaction
      volumes, realized pricing, or margin conversion.
    claimRefs:
      - CI002
      - CI004
      - CI008
      - CI009
      - CI016
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Marble commercializes a layered world-creation workflow while Atlas sits underneath as the next-generation model
      core.
    data:
      layers:
        - label: Input and capture layer
          detail: User-provided conditioning and reference material.
          items:
            - Text prompt
            - Single image
            - Multiple images
            - Panorama
            - Video clip
            - Coarse 3D structure
        - label: Spatial context model layer
          detail: Publicly described model and world-building core.
          modules:
            - Atlas multimodal autoregressive diffusion transformer
            - Shared spatial context grounding
            - World generation
            - Spatial reconstruction
            - Space-time simulation
        - label: World representation layer
          detail: Persistent scene representations bridge generated views and explicit 3D output.
          modules:
            - Image frames
            - Depth maps
            - Point clouds
            - Gaussian splats
        - label: Control and editing layer
          detail: Creator tooling that turns model output into editable scenes.
          modules:
            - Chisel structure controls
            - Pano edit
            - Click and expand
            - Compose
            - Record
        - label: Marble product layer
          detail: The documented web interface packages generation and editing into creator workflows.
          modules:
            - Gallery
            - Create
            - Worlds
            - Studio
        - label: Output and delivery layer
          detail: User-facing outputs and destinations.
          outputs:
            - Persistent 3D worlds
            - Gaussian splats
            - Triangle meshes
            - Videos
            - VR experiences
            - Development assets
    approximationNotes: >-
      The stack is reconstructed from public product and blog descriptions rather than from source code, internal
      diagrams, or benchmarking disclosures.
