  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk stack
        blocks:
          - type: paragraph
            body: >-
              The most material near-term risk is not demand; it is continuity. World Labs has signed a definitive
              agreement to join AMD for an all-stock transaction that still requires regulatory approval and is only
              expected to close before the end of 2026. At the same time, an independent profile notes that neither side
              has publicly said what happens to Marble or World API terms after closing, while the same source says
              Atlas is early access and intended to power future Marble versions. That creates a live transition risk
              for anyone underwriting multi-quarter product usage, pricing, or roadmap stability. The second risk
              cluster is enterprise readiness: public materials reviewed by HokAI say World Labs has not published model
              cards or a responsible scaling policy, lists no SOC 2 or ISO 27001 certification, and describes training
              use of user-submitted content with only an opt-out mechanism. The third cluster is operational maturity:
              Marble's own docs still quote multi-minute generation times, a one-hour high-quality mesh export, and
              desktop-only dependence for some advanced workflows, while TechCrunch's launch review still described edge
              morphing and prompt-quality inconsistency.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR009
              - CR011
              - CR012
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              The legal and governance picture is not one of disclosed litigation or enforcement, but of material public
              unknowns. The AMD transaction itself cannot be treated as a closed fact until regulators clear it, so
              diligence has to test closing timing, remedies, and any product or customer-contract implications of the
              ownership change. Separately, the public privacy-and-security posture leaves unanswered questions for
              enterprise use cases that could involve proprietary footage, design files, or simulation data. HokAI's
              review says uploads may be used for model training, benchmarking, and product development unless customers
              opt out, and it found no public model cards, responsible scaling policy, SOC 2, ISO 27001, or bug bounty.
              Those are not proof of a hidden defect, but they are real diligence gaps because the business is selling a
              tool that asks users to upload valuable content into a frontier-model workflow.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: Operational execution and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Product readiness still looks early relative to the ambition of serving gaming, VFX, design, robotics, and
              developer workflows at once. World Labs' own materials stress that product feedback is a core part of
              improving Marble, which is consistent with a platform still learning from usage rather than one already
              stabilized around a narrow enterprise workflow. The docs also show that the heaviest export step remains
              slow and some advanced features are still desktop-only, limiting adoption in teams that need predictable
              turnaround or mobile review paths. TechCrunch's hands-on launch review adds another execution signal:
              Marble looked strong enough to impress, but it still showed edge morphing and prompt-result inconsistency.
              Finally, the company is becoming more dependent on AMD as owner, investor, and hardware partner at the
              same time that outside commentary flags uncertainty on future openness of formats and product terms.
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Mitigations, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The mitigation playbook is straightforward but evidence-heavy. Before treating the risk stack as
              manageable, investors or customers should require explicit post-close commitments on Marble and World API
              pricing, support, export rights, and roadmap ownership; evidence of independent security assurance or
              formal customer controls; and product-level metrics showing that generation quality and turnaround are
              production-usable rather than demo-usable. The strongest public positive is that Marble already exists as
              a commercial product with exportable outputs and a broad set of use cases, which means these risks are
              attached to a real platform instead of a research-only preview. The cleanest thesis-break signals would be
              a delayed or conditional acquisition that disrupts product continuity, terms changes that reduce
              portability or customer rights, a meaningful security or privacy incident, or continued inability to show
              commercial metrics and enterprise controls after the AMD transition narrative is complete.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
              - CR009
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction near-term risk
            body: >-
              The AMD transaction is strategically positive on paper, but until it closes and product commitments are
              explicit, it compounds ownership, roadmap, and hardware concentration into one transition risk instead of
              removing them.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR015
          - type: callout
            title: Clearest thesis-break triggers
            body: >-
              Treat delayed merger approval, restrictive post-close terms changes, a material security or privacy
              incident, or continued failure to show enterprise controls and commercial metrics as the cleanest reasons
              to step back from the current thesis.
            calloutType: assumption
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public price support improved, but standalone underwriting is still thin
        blocks:
          - type: paragraph
            body: >-
              Public financing context is directionally better than it was in the prior report: multiple independent
              profiles now converge on a February 2026 round of roughly $1 billion and on a reported valuation around $5
              billion, while HokAI says the later signed AMD transaction at about $8.2 billion is the only valuation
              either side has put in writing. That matters because it shows real strategic demand for the asset, not
              just venture enthusiasm. The underwriting problem is that the February round's exact post-money,
              preference stack, and dilution consequences remain undisclosed, and Value Add VC explicitly notes that the
              company never confirmed the ~$5 billion figure in public. For a minority investor, a signed strategic M&A
              price is also not the same thing as a clean contemporaneous venture entry mark with known rights, timing,
              and downside protections.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: Product proof is visible, but commercial proof is still the missing bridge
        blocks:
          - type: paragraph
            body: >-
              World Labs has crossed an important threshold from research story to shippable product: official materials
              and TechCrunch show Marble as a public commercial offering with paid tiers, downloadable outputs, multiple
              input modes, and a separate developer API. That supports the thesis that the company has turned
              world-model research into something buyers can try today. It does not yet support a high-conviction
              valuation case. Public sources still do not disclose revenue, customer counts, retention, gross margin, or
              named scaled deployments, and both HokAI and Silicon Valley Invest Club state that no revenue figure is
              public. Value Add VC's comparison is the sharpest external benchmark: Runway reportedly reached roughly
              $300 million ARR before or around a similar valuation band, while World Labs remains valued primarily on
              team quality, product potential, investor signal, and strategic optionality.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Recommendation stays track until revenue quality and deal economics are visible
        blocks:
          - type: paragraph
            body: >-
              The decision implication is not that World Labs lacks upside; rather, the public record still leaves too
              much unpriced uncertainty for a buy recommendation at strategic-takeout or late private-market optics. The
              bull case is that AMD closes near the announced value and the Autodesk relationship plus World API /
              Marble adoption eventually prove a category-defining infrastructure position. The base case is that the
              signed deal validates technology and team, but outside investors still cannot underwrite minority-entry
              returns because core economics and rights remain private. The bear case is that if the AMD close slips or
              strategic enthusiasm cools, the market re-anchors on the lack of disclosed revenue and customer proof.
              That keeps the right call at track, with diligence focused on revenue quality, named production customers,
              February 2026 round terms, and any pricing or contractual changes ahead of transaction close.
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports track, not buy
            body: >-
              World Labs now has signed-exit support and real productization, but the public record still lacks the
              revenue, customer, and round-term disclosure needed to justify paying strategic or reported late-stage
              private prices with high conviction.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV010
              - CV011
              - CV013
              - CV014
