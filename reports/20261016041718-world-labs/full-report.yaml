          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Milestone cadence and the remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone cadence is real and unusually compressed. World Labs moved from an early public research
              moment in late 2024 to RTFM in October 2025, public Marble availability in November 2025, the World API in
              January 2026, SceniX in July 2026, Atlas in September 2026, and a signed AMD deal later that same month.
              That pace supports the view that this is not a pre-product story anymore. At the same time, the strongest
              adverse evidence in the assigned pool is not about product absence; it is about commercial opacity.
              Independent analysts still say World Labs has disclosed no revenue or ARR despite charging for Marble,
              offering paid API credits, and attracting both a $5 billion private-round valuation discussion and an $8.2
              billion pending exit. Later chapters should therefore treat customer scale, exact headcount, board
              oversight, and post-close pricing continuity as live diligence items rather than facts established by this
              chapter.
            claimRefs:
              - CO003
              - CO007
              - CO010
              - CO011
              - CO012
              - CO013
