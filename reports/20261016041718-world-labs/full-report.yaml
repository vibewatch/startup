chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product surface, and what is actually public
        blocks:
          - type: paragraph
            body: >-
              Public sources agree on the broad business description: World Labs is building spatial-intelligence
              software around persistent, navigable 3D worlds, with Marble as the main product surface and the World API
              as the programmable interface for developers. The current documentation and launch materials support a
              concrete product story -- text, image, video, panorama, and coarse 3D inputs become editable 3D worlds
              that can be rendered on the web or exported into downstream tools. What is less cleanly settled is the
              company identity itself. HokAI's October 2026 profile says World Labs was founded in January 2024 in San
              Francisco by Fei-Fei Li, Justin Johnson, Christoph Lassner, and Ben Mildenhall, while a Silicon Valley
              Invest Club profile lists a 2017 founding year for the same business. That conflict is material because
              later diligence on team velocity, capital efficiency, and valuation step-ups depends on whether the
              company should be treated as a 2024 startup or as a longer-running effort whose public emergence simply
              came later.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO010
              - CO011
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO011
              - CO014
      - number: '1.2'
        title: Leadership, funding, and the ownership transition
        blocks:
          - type: paragraph
            body: >-
              The core leadership picture is clearer than the founding-date record. Across current third-party profiles,
              Fei-Fei Li remains the central operating and narrative figure, with Johnson and Mildenhall still
              positioned as product and technical leaders around the AMD transaction. The September 2026 agreement to
              sell World Labs to AMD for about $8.2 billion in stock is the defining ownership event in the current
              refresh cycle, and the transaction matters beyond price because it reframes World Labs from a
              venture-backed standalone platform into a research-and-product asset inside a semiconductor company if it
              closes. Funding history is directionally strong but still incomplete in governance detail: the public
              record supports about $1.23 billion of disclosed capital raised, including a $1 billion round announced on
              February 18, 2026, but it does not provide a public shareholder register, board composition, control
              rights, or full commercial terms around strategic investors such as Autodesk and AMD.
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
