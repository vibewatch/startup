      - number: '5.3'
        title: Maturity, differentiation, and technical risks
        blocks:
          - type: paragraph
            body: >-
              The differentiation story is credible but not yet fully de-risked. Independent coverage supports that
              Marble’s key distinction is persistent, downloadable 3D worlds with AI-native editing and structure
              control, which is a more operationally useful output than ephemeral 2D world demos. At the same time,
              independent observers also note that public technical disclosure is thin: there is no public Marble paper,
              Atlas benchmark discussion is company-authored rather than independently reproduced, and evidence on
              control, planning, or reliability under production conditions is limited. World Labs documents
              creator-facing generation times and desktop/mobile constraints, but the assigned source pool does not
              surface public security, privacy, certification, or uptime materials. That leaves the chapter’s core
              judgment unchanged: the product is specific enough to believe, but the technical diligence burden remains
              high before underwriting broad enterprise, robotics, or platform claims.
            claimRefs:
              - CE006
              - CE010
              - CE011
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Product story is concrete, not just conceptual
            body: >-
              The assigned public evidence shows a usable creator workflow with creation, editing, composition,
              recording, and export paths, which is much stronger than a pure research-demo narrative.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
          - type: callout
            title: Public technical diligence is still shallow
            body: >-
              Independent sources repeatedly highlight missing technical detail and benchmark evidence, and this pool
              does not surface public security or certification artifacts, so production-readiness still needs
              substantial off-platform diligence.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer evidence starts with creators, technical teams, and developers
        blocks:
          - type: paragraph
            body: >-
              The public record in this pool points first to creator and technical users rather than classic
              procurement-led enterprise accounts. World Labs' own Marble Labs hub says it is for "artists, engineers,
              and designers" and frames public case studies around gaming, VFX, design, robotics, and health systems.
              The docs reinforce that positioning by organizing the product around Gallery, Create, and Studio, while
              Technology Magazine says the World API lets developers integrate generation into programmable workflows.
              Taken together, the visible customer base looks like a mix of self-serve creators, studios, developer
              teams, and experimental technical users, with the clearest proof concentrated in creative production and
              developer-adjacent use cases.
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
