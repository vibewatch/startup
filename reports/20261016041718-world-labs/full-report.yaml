      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              The public packaging already separates at least three buyer paths. Creators and small teams can trial
              Marble directly via free and paid subscriptions; developers can buy World API credits separately for
              programmable workflows; and enterprise design, VFX, gaming, digital-twin, or robotics teams are asked to
              adopt through existing 3D pipelines or early partner access. Export support for game engines, DCC tools,
              CAD/modeling software, and VR devices lowers switching cost versus closed video outputs, but Atlas itself
              remains gated, so the broadest enterprise thesis is still ahead of open commercial proof.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Growth drivers, constraints, and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers are strongest where teams already care about 3D persistence, camera control, and
              interoperability: design and digital twin workflows, game and VFX asset creation, developer tooling, and
              robotics simulation. Constraints are equally visible. TechCrunch reports skepticism in gaming around IP,
              energy use, and quality, while independent analysis flags unresolved post-AMD pricing continuity and no
              public Atlas pricing or named early-access partners. Because public evidence still lacks named production
              customers, revenue, or independent demand totals, this chapter can support a market thesis but not a
              defensible market-share model.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public demand proof starts with access design, not revenue disclosure
            body: >-
              The strongest public evidence is how World Labs packages access: low-cost creator trials, a separately
              metered API, and gated partner access for Atlas. That is enough to map adoption paths, but not enough to
              infer segment penetration.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
          - type: callout
            title: Enterprise upside is plausible, but procurement proof is still thin
            body: >-
              Autodesk's $200 million investment and repeated simulation/digital-twin messaging show why investors care,
              yet public materials still do not name production customers, Atlas pricing, or post-AMD product terms.
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              The direct startup peer set in retained evidence is narrower than the broader “AI 3D” label suggests.
              Runway, Decart, and Odyssey are the most relevant venture-backed comparables because they are all being
              financed around world-model or adjacent generative-media infrastructure, while Google DeepMind and Nvidia
              represent incumbent research and platform pressure rather than clean startup comps. Autodesk and the
              established DCC/game-engine stack matter as status-quo substitutes because many buyers can still solve the
              same creation or simulation job by staying inside incumbent tools and only adding generative layers
              selectively.


              That framing matters because World Labs is not competing only against other startup demos. It is competing
              against a mature workflow stack that already owns designers, animators, and simulation teams, plus
              well-funded model builders that can afford to move fast. Public evidence therefore supports a landscape
              where World Labs is clearly in the top tier of funded spatial-intelligence startups, but not obviously
              alone in product direction or capitalization, and less proven commercially than the best-disclosed peer in
              the set.
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: Product scope and buyer tradeoffs
        blocks:
          - type: paragraph
            body: >-
              World Labs’ strongest public differentiation is that Marble is already framed as a commercial product
              rather than just a research preview. Across the official docs, launch blog, and TechCrunch review, Marble
              is presented as a persistent, downloadable, editable 3D world generator that accepts text, image, video,
              panorama, and coarse 3D inputs, then exports assets back into downstream creative workflows. That makes it
              easier to understand where the product fits relative to manual 3D authoring, game engines, or pure
              research demos: it is positioned as an acceleration layer for world creation, not a full replacement for
              the rest of the production stack.


              The tradeoff is that public capability breadth is ahead of public commercial proof. Buyers can see list
              pricing, visible community/gallery surfaces, and anecdotal use cases, but they still cannot see disclosed
              customer counts, renewal data, or realized enterprise economics. In other words, World Labs has made
              product evaluation easier than business-model evaluation. That leaves feature breadth as a real wedge,
              while pushing the hardest underwriting questions into diligence.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP008
              - CP013
              - CP014
          - type: table
