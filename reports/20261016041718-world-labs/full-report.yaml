      - number: '5.2'
        title: Architecture, operating model, and roadmap linkage
        blocks:
          - type: paragraph
            body: >-
              Public technical detail is strongest at the system-description level. Atlas is described as a multimodal
              autoregressive diffusion transformer that grounds text, images, video, and 3D inputs into a shared spatial
              context; Marble is the product layer that packages that world-model capability into creation, editing, and
              export workflows. Together, the sources imply a stack with three layers: multimodal capture and prompting,
              spatial-context model inference, and downstream rendering/export surfaces such as splats, meshes, and
              recorded flythroughs. The product roadmap is also explicit that Atlas is intended to power future Marble
              versions, so current commercial surface area should be treated as a productization wrapper around a
              still-scaling model family rather than a frozen architecture.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE010
