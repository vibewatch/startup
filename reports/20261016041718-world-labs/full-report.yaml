        - Medium-high because concentration still rises after closing
      - - Format and ecosystem openness
        - Downstream toolchain and third-party developers
        - Export formats and integrations help external tooling build on Marble outputs
        - Medium
        - Future terms or format changes reduce portability and ecosystem goodwill
        - Medium-high
