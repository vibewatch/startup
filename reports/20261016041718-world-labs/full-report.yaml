              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.3'
        title: Distribution leverage, switching cost, and lock-in
        blocks:
          - type: paragraph
            body: >-
              The Autodesk relationship is strategically important less because it proves revenue today and more because
              it validates where World Labs wants to sit in the stack. TechCrunch describes the partnership as
              exploratory, with media and entertainment first and no data-sharing commitment, which means it is best
              read as distribution optionality and incumbent validation rather than a locked-in reseller channel.
              Combined with the official emphasis on mesh export, DCC integration, browser sharing, and VR delivery, the
              evidence points to World Labs trying to slide into existing pipelines instead of forcing users to abandon
              them.


              That lowers adoption friction, but it also constrains moat claims. If customers still finish their work
              inside Autodesk tools, Blender/Maya/3ds Max, Unity, Unreal, or robotics simulators, then World Labs
              benefits from incumbent distribution while remaining exposed to incumbent imitation or bundling. Switching
              costs may rise if teams build repeatable workflows around Marble-generated worlds, but the retained public
              record still does not show the contract, retention, or workflow-embeddedness evidence needed to call that
              durable lock-in.
            claimRefs:
              - CP006
              - CP008
              - CP014
              - CP016
      - number: '3.4'
        title: Moat durability verdict
        blocks:
          - type: paragraph
            body: >-
              On the current public record, World Labs looks differentiated enough to win attention, partnerships, and
              experimentation, but not yet differentiated enough to claim an unassailable moat. The company has enormous
              capital, a strong founding team, and a product surface that is broader than the demo-stage peers cited in
              retained sources. At the same time, Runway already has the clearest disclosed commercialization in the
              peer set, and Google DeepMind plus Nvidia can pressure the category from much larger platform positions.


              The result is a market structure where World Labs may be ahead on product packaging and workflow fit, but
              still competes in a category that is rapidly attracting adjacent incumbents, direct startup rivals, and
              internal-build substitutes. The most important disconfirming fact is not technical parity; it is the
              absence of public revenue, customer-count, renewal, and enterprise-pricing disclosure. Until those metrics
              are visible, moat durability remains a plausible thesis rather than a demonstrated outcome.
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow fit is the strongest current wedge
            body: >-
              World Labs' most defensible near-term story is not that it has no rivals, but that Marble already fits
              recognizable creative and simulation workflows through multimodal generation, editing, export, and
              browser/VR delivery.
            calloutType: insight
            claimRefs:
              - CP002
              - CP008
              - CP014
          - type: callout
            title: Commercial proof lags product ambition
            body: >-
              The biggest adverse signal is not lack of product breadth; it is that peers such as Runway show stronger
              disclosed economics while World Labs still withholds revenue, customer-count, renewal, and
              enterprise-pricing evidence.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Public monetization surfaces exist, but realized pricing does not
        blocks:
          - type: paragraph
            body: >-
              World Labs now has two clearly public commercial surfaces: the Marble application and the World API.
              Official product material shows Marble as a persistent 3D-world creation workflow rather than a demo
              viewer, and World Labs' November 2025 launch post moved the product from beta to general availability.
              Third-party pricing coverage adds useful packaging detail: HokAI says Marble runs from a free plan capped
              at four world generations through a Max plan capped at 75, with separate enterprise packaging, while the
              API is sold on a fixed credit schedule. What remains missing is the reader's core underwriting bridge: no
              retained source discloses actual subscription price points for each Marble tier, realized discounts,
              revenue mix between app and API, or conversion from free usage into paid revenue.
            claimRefs:
              - CI002
              - CI003
              - CI008
              - CI009
              - CI016
