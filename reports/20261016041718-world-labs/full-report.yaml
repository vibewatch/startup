      - number: '4.2'
        title: Unit economics are mostly inferential because public cost and volume data are thin
        blocks:
          - type: paragraph
            body: >-
              The strongest public cost-structure proxy is operational rather than financial. World Labs' own
              documentation lists generation times from roughly 20 seconds for a draft to around one hour for a
              high-quality mesh export, implying compute-heavy and likely variable service-delivery cost by workflow.
              Public traction evidence is also directional, not underwritable: StartupHub says World Labs already has
              paying customers across gaming, visual effects, robotics training, and architectural design, while HokAI
              describes self-serve free-plan onboarding for Marble and separate account funding for the API. Even the
              burn proxy is unstable because public headcount signals conflict, with StartupHub citing 150 employees
              while HokAI lists a 50-100 team range. That combination supports commercial activity, but not a defendable
              CAC, payback, or gross-margin model.
            claimRefs:
              - CI004
              - CI010
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Capital availability looks strong on paper, but runway cannot be verified
        blocks:
          - type: paragraph
            body: >-
              Public financing visibility is much better than operating visibility. World Labs' February 2026 funding
              announcement says the company raised $1 billion from a syndicate that included AMD, Autodesk, Emerson
              Collective, Fidelity Management & Research Company, NVIDIA, and Sea. Forbes adds that Autodesk contributed
              $200 million and took a strategic advisory role, while Bloomberg previously reported an approximately $5
              billion round valuation that the company declined to confirm. The September 2026 AMD transaction
              announcement creates a second capital support vector: Ars and HokAI both describe an about-$8.2 billion
              all-stock acquisition agreement targeted to close by year-end, subject to approval. That backdrop
              materially lowers the odds of a near-term emergency capital raise, but it still does not reveal cash on
              hand, monthly burn, working-capital needs, or debt obligations.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI011
              - CI012
      - number: '4.4'
        title: 'Financial verdict: compelling strategic funding story, insufficient underwriting data'
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a credible revenue architecture and a much stronger balance-sheet narrative
              than the June 2026 report had, but not a full underwriting case. Marble and the API give World Labs
              visible monetization rails, and the company appears to have reached at least some paid usage across
              multiple verticals. However, the most important investor-grade inputs remain absent from the public
              record: revenue, ARR, gross margin, burn, cash, customer concentration, renewal behavior, and any clear
              statement of post-close contract continuity. The right financial conclusion is therefore not that the
              business lacks traction, but that public evidence still cannot separate product promise from durable
              economics. Treat capital dependency as buffered in the short term and underwriting quality as still
              diligence-blocked.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Two monetization surfaces are visible, but only one has exact public unit pricing
            body: >-
              The retained pool shows Marble subscription packaging and a separately billed API, yet only the API
              exposes an exact public price-per-unit. That makes blended ASP, revenue mix, and free-to-paid conversion
              impossible to model from public evidence alone.
            calloutType: insight
            claimRefs:
              - CI008
              - CI009
          - type: callout
            title: Capital support is clearer than economics
            body: >-
              The February 2026 $1 billion round and the pending AMD transaction both support the view that World Labs
              is unlikely to face immediate capital stress, but neither event discloses cash on hand, burn, debt, or
              margin. Financing headlines therefore reduce insolvency fear more than they improve revenue-quality
              underwriting.
            calloutType: risk
            claimRefs:
              - CI005
              - CI011
              - CI012
              - CI013
          - type: callout
            title: Management data room requirements are obvious
            body: >-
              A serious investment decision still needs product-level revenue, pricing realization, gross margin by
              workflow, customer counts, renewal evidence, and verified headcount. Without those data, the business can
              be strategically exciting and still financially under-specified.
            calloutType: recommendation
            claimRefs:
              - CI010
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              The clearest delivered product is Marble, not Atlas. Across the product site, public docs, and the launch
              post, World Labs consistently describes Marble as a creator workflow for turning text, images, video,
              panoramas, and coarse 3D structure into persistent 3D environments that can then be edited, expanded,
              composed, recorded, and exported. That matters because it anchors the company in a practical
              workflow—scene creation and manipulation—rather than an abstract “world model” claim. The evidence also
              shows a split between what is usable today and what is still being staged for later rollout: Marble is
              broadly exposed through the web product and documentation, while Atlas is presented as early access and
              “coming to Marble soon,” which suggests World Labs is commercializing with a staged product ladder rather
              than a single fully generalized platform release.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE009
