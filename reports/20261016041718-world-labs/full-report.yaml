      - number: '6.3'
        title: Named proof favors creative collaborations, while durability is still unproven
        blocks:
          - type: paragraph
            body: >-
              The named references World Labs publishes are useful but should be scored carefully. Marble Labs names
              Promise, Magnific, OpenArt, HTC VIVE, Escape.ai, WithLore, Rosebud AI, VIVERSE, James C. Kane, and a joint
              Lightcraft/Beeble example, which is enough to show real external usage conversations and workflow
              experiments. However, those headlines do not confirm production status, contract value, renewal behavior,
              or expansion. Independent sources in this pool also stay cautious: ICMR says there were still questions
              about product-market fit and scaled industry adoption, while the broader external coverage emphasizes
              packaging, category creation, and early creative use cases more than customer durability. Public evidence
              therefore supports adoption interest and workflow relevance, but not customer concentration, retention, or
              enterprise depth.
            claimRefs:
