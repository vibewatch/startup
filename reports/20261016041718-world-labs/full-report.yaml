              - CU015
      - number: '6.2'
        title: Adoption signals are real, but the disclosed metrics remain thin
        blocks:
          - type: paragraph
            body: >-
              World Labs has more customer-proof than a stealth research lab, but less than a mature software vendor.
              The company blog says Marble progressed from an early beta cohort to general availability for anyone, and
              both Stanford Tech Review and TechCrunch describe a priced commercial product rather than a waitlist-only
              demo. Docs and the gallery show browsing, sharing, VR viewing, and export paths that make repeat project
              usage plausible. Even so, the clearest numeric adoption datapoint in the assigned pool is secondhand: an
              ICMR case study says Marble had 3,000+ users as of December 2025. Public materials do not disclose current
              active users, paid conversion, API usage, or segment mix, so visible momentum is easier to prove than
              present scale.
            claimRefs:
              - CU002
