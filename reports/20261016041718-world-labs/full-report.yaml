  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence today
      - What would change the view
    rows:
      - - Founding team and research edge
        - >-
          Fei-Fei Li and the co-founders give World Labs unusual technical credibility and helped attract major capital
          quickly.
        - Keep positive unless attrition or post-acquisition integration weakens the core research team.
      - - Product is real and monetized
        - >-
          Marble is live with paid tiers and exportable persistent 3D worlds while the World API is separately
          monetized.
        - Upgrade if paid adoption, named enterprise deployments, and renewal behavior become public.
      - - Strategic investor signal is unusually strong
        - Autodesk committed $200 million and AMD later signed an ~$8.2B stock acquisition.
        - >-
          Upgrade only if those relationships translate into shipped products, durable contracts, or clearer
          monetization evidence.
      - - Commercial opacity remains the core anti-thesis
        - >-
          Public sources still disclose no revenue, profitability, customer count, or confirmed standalone latest
          valuation.
        - Downgrade concern only with audited or management-confirmed revenue, margin, and customer-quality disclosure.
