  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              World Labs' own surfaces define the category as spatial intelligence and world models for virtual and
              physical worlds, not a generic generative-AI bucket. The included workflows are persistent 3D world
              creation, editing, export, and simulation across creator, developer, and industrial use cases. The
              practical substitutes are video-first generation, flat-image tools, and incumbent 3D pipelines that do not
              deliver editable, explorable worlds from multimodal prompts. That boundary matters because World Labs is
              trying to win where 3D persistence, camera control, and downstream export are more valuable than raw
              content novelty.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM009
              - CM010
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports market lenses, not a clean TAM/SAM/SOM stack. The clearest numeric signals are
              self-serve packaging, a usage-priced API, and strategic capital from Autodesk and other investors. Those
              numbers show that World Labs can lower trial friction for creators and developers while attracting large
              strategic attention from design and physical-world incumbents. They do not show recurring revenue, active
              customer counts, renewal behavior, or penetration by segment, so any broader market-size claim would be
              speculative and should remain a diligence gap.
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
