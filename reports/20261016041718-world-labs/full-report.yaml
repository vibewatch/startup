  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Probability signal
      - Downside / trigger
    rows:
      - - Bull
        - >-
          AMD closes near the announced value and Marble plus the World API prove broad commercial pull across design
          and simulation workflows.
        - Strategic value remains closer to the signed ~$8.2B exit context than to the earlier reported private mark.
        - >-
          Positive if diligence uncovers real paid usage, Autodesk-linked distribution, and enterprise-grade customer
          references.
        - Breaks if strategic closing or product continuity weakens before economics are proven.
      - - Base
        - >-
          The technology and team are validated but public economics stay opaque and minority investors still cannot
          price rights cleanly.
        - >-
          A new outside entry is hard to justify above the reported February 2026 private mark without verified revenue
          quality or better terms.
        - >-
          Most consistent with today's evidence because financing and product facts are public while monetization proof
          is not.
        - Remains capped by missing revenue, customer, gross-margin, and cap-table disclosure.
      - - Bear
        - AMD timing slips or strategic enthusiasm fades before World Labs shows durable monetization.
        - >-
          Valuation could reset below the last reported private mark because the public record still lacks disclosed
          revenue and scaled customer proof.
        - More likely if the deal stalls, if pricing/terms change unfavorably, or if adoption remains demo-heavy.
        - >-
          Triggered by failed close, weak commercial evidence, or evidence that the company is spreading across markets
          without a winning wedge.
    notes: >-
      The scenarios are qualitative because public evidence does not support a precise target-return model, terminal
      multiple, or cap-table-adjusted entry math.
