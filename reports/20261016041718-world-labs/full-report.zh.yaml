  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              保留证据中的直接创业公司同业集合，比更宽泛的“AI 3D”标签窄。Runway、Decart 和 Odyssey 最具可比性，因为它们都围绕世界模型或相邻的生成媒体基础设施融资；Google DeepMind 和
              Nvidia 则代表传统研究与平台压力，并非干净的创业公司可比对象。Autodesk 及成熟的 DCC/游戏引擎体系属于现状替代方案，因为许多买方仍可留在传统工具中，只选择性增加生成层，完成同一创建或仿真任务。

              这一框架很重要：World Labs 不只是与其他创业公司演示竞争，也在与已经拥有设计师、动画师和仿真团队的成熟工作流，以及有资金快速推进的模型公司竞争。公开证据因此支持这样的格局：World Labs
              明显处于融资空间智能创业公司的第一梯队，但在产品方向或资本实力上并非显然独占；其商业验证也弱于该集合中披露最充分的同业。
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
