      - number: '1.2'
        title: 管理层、融资与所有权变更
        blocks:
          - type: paragraph
            body: >-
              核心管理层信息比成立年份更清楚。当前各份第三方资料都把 Fei-Fei Li 视为运营和叙事核心；在 AMD 交易中，Johnson 和 Mildenhall 仍被定位为产品和技术负责人。2026 年 9
              月签署的协议拟以约 $8.2 billion 的股票收购 World Labs，是本轮更新中决定所有权归属的事件；其意义不止于价格，因为交易完成后，World Labs
              将从风险投资支持的独立平台变成半导体公司内部的研究与产品资产。融资历史总体强劲，但治理细节仍不完整：公开记录支持约 $1.23 billion 的已披露融资，其中包括 2026 年 2 月 18 日宣布的 $1
              billion 轮融资；但没有公开股东名册、董事会构成、控制权安排，或 Autodesk、AMD 等战略投资者的完整商业条款。
