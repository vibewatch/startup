              缓释方案直截了当，但需要大量证据。在把风险堆栈视为可管理之前，投资者或客户应要求明确的交易完成后承诺，涵盖 Marble 和 World API
              的定价、支持、导出权及路线图归属；独立安全保障或正式客户控制证据；以及产品层指标，证明生成质量和周转速度达到生产可用而非演示可用。最强的公开积极信号是 Marble
              已作为商业产品存在，拥有可导出输出和广泛用例，说明这些风险附着在真实平台上，而不是只存在于研究预览中。最清晰的论点破坏信号包括延迟或附带条件的收购导致产品连续性受损、条款变更削弱可移植性或客户权利、重大安全或隐私事件，或
              AMD 过渡叙事结束后仍无法展示商业指标和企业控制。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
              - CR009
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 确信度最高的近期风险
            body: AMD 交易在纸面上具有战略积极性，但在交易完成且产品承诺明确之前，它把所有权、路线图和硬件集中度叠加成一个过渡风险，而不是消除这些风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR015
          - type: callout
            title: 最清晰的论点破坏触发因素
            body: 若合并批准延迟、交易完成后条款发生限制性变化、出现重大安全或隐私事件，或持续无法展示企业控制和商业指标，应视为退出当前论点的最明确理由。
            calloutType: assumption
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开价格支撑增强，但独立投资判断仍薄弱
        blocks:
          - type: paragraph
            body: >-
              公开融资背景比上一份报告有所改善：多份独立资料如今都指向 2026 年 2 月约 $1 billion 的融资和约 $5 billion 的据报道估值；HokAI 则称，后来签署的约 $8.2 billion
              AMD 交易，是双方唯一白纸黑字写下的估值。这很重要，因为它显示了对资产的真实战略需求，而不只是风险投资热情。投资判断的问题在于，2 月融资的确切投后估值、优先股堆叠及稀释后果仍未披露，Value Add VC
              也明确指出公司从未公开确认约 $5 billion 的数字。对少数股权投资者而言，签署的战略并购价格，也不等于权利、时间和下行保护均明确的同期干净风险投资入场价格。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: 产品证据可见，但商业证据仍是缺失的桥梁
        blocks:
          - type: paragraph
            body: >-
              World Labs 已跨过从研究故事到可交付产品的重要门槛：官方材料和 TechCrunch 展示了公开商业产品 Marble，拥有付费层级、可下载输出、多种输入模式及独立开发者
              API。这支持公司已把世界模型研究转化为买方今天可以试用的产品。但还不足以支撑高确信度估值。公开来源仍未披露收入、客户数、留存、毛利率或具名规模化部署；HokAI 和 Silicon Valley Invest
              Club 都称没有公开收入数字。Value Add VC 的比较是最尖锐的外部基准：据报道 Runway 在类似估值区间前后达到约 $300 million ARR，而 World Labs
              的估值仍主要依靠团队质量、产品潜力、投资者信号和战略选择权。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: 在收入质量和交易经济性清晰前，建议保持跟踪
        blocks:
          - type: paragraph
            body: >-
              决策含义不是 World Labs 没有上行空间，而是公开记录仍留下太多未定价的不确定性，不足以在战略收购或后期私募市场估值下给出买入建议。乐观情景是 AMD 接近公告价值完成交易，Autodesk 关系以及
              World API / Marble 的采用最终证明其处于定义品类的基础设施位置。基准情景是签署的交易验证了技术和团队，但由于核心经济性和权利仍属私人信息，外部投资者仍无法判断少数股权入场回报。悲观情景是 AMD
              交割延迟或战略热情降温，市场重新锚定于缺乏公开收入和客户证据。因而正确做法仍是跟踪，尽调重点放在收入质量、具名生产客户、2026 年 2 月融资条款，以及交易完成前任何定价或合同变化。
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
