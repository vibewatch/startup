          touchpoints:
            - Marble moved from an early beta cohort to general availability.
            - Inputs include text, images, video, and coarse 3D structures.
          tone: positive
          claimRefs:
            - CU002
            - CU003
        - label: 深化工作流控制
          actor: Power users and studios
          stage: Activation
          channel: Create + Studio
          touchpoints:
