  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              World Labs 自身的产品界面把品类定义为空间智能和面向虚拟、实体世界的世界模型，而不是泛泛的生成式 AI。相关工作流覆盖创作者、开发者和工业场景中的持久 3D
              世界创建、编辑、导出与仿真。实际替代方案包括视频优先生成、平面图像工具，以及无法根据多模态提示生成可编辑、可探索世界的传统 3D 流程。这一边界很关键，因为 World Labs 要争取的是 3D
              持久性、镜头控制和下游导出比单纯内容新颖性更有价值的场景。
