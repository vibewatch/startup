  - id: TV003
    title: 看涨 / 基准 / 看跌情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行 / 触发因素
    rows:
      - - 看涨
        - AMD 接近公告价值完成交割，Marble 和 World API 在设计与仿真工作流中证明具有广泛商业吸引力。
        - 战略价值更接近已签署的 ~$8.2B 退出背景，而不是早先据报道的私人估值。
        - 如果尽调发现真实付费使用、Autodesk 关联分销和企业级客户参考，则为正面。
        - 若经济性得到证明前战略交割或产品连续性走弱，情景失效。
      - - 基准
        - 技术和团队得到验证，但公开经济数据仍不透明，少数股东仍无法清晰定价其权利。
        - 在没有经验证的收入质量或更优条款时，很难证明新一笔外部入场价格应高于据报道的 February 2026 私人估值。
        - 这与今日证据最一致：融资和产品事实公开，但变现证明尚不存在。
        - 收入、客户、毛利率和资本结构披露缺失，继续构成上限。
      - - 看跌
        - AMD 时间表延后，或 World Labs 展示持久变现前战略热情消退。
        - 由于公开记录仍缺少披露收入和规模化客户证明，估值可能跌破上次据报道的私人估值。
        - 若交易停滞、定价 / 条款转差，或采用仍主要停留在演示阶段，可能性更高。
        - 交易交割失败、商业证据薄弱，或公司在没有形成制胜切口的情况下铺开多个市场，均可触发。
    notes: 这些情景是定性的，因为公开证据不足以支持精确的目标回报模型、终值倍数或按资本结构调整的入场计算。
    claimRefs:
      - CV004
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
