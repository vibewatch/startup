        title: 增长驱动、约束与未解决的规模缺口
        blocks:
          - type: paragraph
            body: >-
              团队已经重视 3D 持久性、镜头控制和互操作性的场景，采用驱动力最强，包括设计和数字孪生工作流、游戏与 VFX 资产创建、开发者工具及机器人仿真。约束同样明显。TechCrunch 报道称，游戏行业对
              IP、能耗和质量存在疑虑；独立分析也指出，AMD 交易完成后的定价连续性尚未明确，Atlas
              没有公开定价，也没有公布早期访问合作伙伴。由于公开证据仍缺少具名生产客户、收入或独立需求总量，本章可以支撑市场论点，却无法支撑可辩护的市场份额模型。
