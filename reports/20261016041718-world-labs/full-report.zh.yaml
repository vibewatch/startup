              近期最重要的风险不是需求，而是连续性。World Labs 已签署加入 AMD 的最终协议，交易采用全股票形式，仍需监管批准，预计在 2026 年底前完成。同时，一份独立资料指出，双方都没有公开说明交易完成后
              Marble 或 World API 条款如何变化；同一来源称 Atlas 仍处于早期访问阶段，并计划为未来 Marble
              版本提供动力。这给需要判断多季度产品使用、定价或路线图稳定性的投资者带来现实的过渡风险。第二类风险是企业就绪度：HokAI 审阅的公开材料称 World Labs 尚未发布模型卡或负责任扩展政策，没有列出 SOC
              2 或 ISO 27001 认证，并说明用户提交内容可用于训练，只有退出机制。第三类风险是运营成熟度：Marble 自身文档仍列出数分钟生成时间、1
              小时高质量网格导出，以及部分高级工作流只能依赖桌面端；TechCrunch 的发布评测仍提到边缘变形和提示质量不稳定。
