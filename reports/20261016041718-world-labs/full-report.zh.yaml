  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据显示多模态创作如何流向订阅或 API 积分购买，但没有显示这些入口如何转化为实现收入或毛利。
    data:
      nodes:
        - id: inputs
          label: 客户输入
          value: Text, image, video, panorama, or rough 3D layout
          note: 官方入口将多模态创作描述为起点。
        - id: generate
          label: 世界生成
          value: Draft ~20 sec; world ~5 min
          note: 文档披露了可用于衡量算力强度的公开输出耗时代理指标。
        - id: refine
          label: 编辑 / 扩展 / 合成
          value: Iterative world-building workflow
          note: 额外编辑步骤可能提高工作负载强度，但没有公开的单次操作价格。
        - id: export
          label: 导出 / 下游使用
          value: Meshes, videos, VR links, and development assets
          note: 可用的下游输出是客户价值桥梁，而不只是一次性生成。
        - id: app
          label: Marble 订阅
          value: Free / Standard / Pro / Max / enterprise
          note: 套餐和生成上限公开；保留来源不含美元金额。
        - id: api
          label: World API 积分
          value: 1,250 credits per $1; $5 minimum
          note: API 积分与 Marble 应用使用量是分开的钱包。
        - id: gp
          label: 收入到毛利
          value: Public bridge unavailable
          note: 没有保留来源披露实现价格、收入结构、毛利率或现金收款。
      edges:
        - from: inputs
          to: generate
          relationship: 用户提交多模态提示词以创建世界。
        - from: generate
          to: refine
          relationship: 客户在交付前编辑、扩展和组合场景。
        - from: refine
          to: export
          relationship: 场景导出或接入下游工作流时，价值才真正落地。
        - from: export
          to: app
          relationship: 创作者使用量映射到 Marble 套餐上限和企业套餐。
        - from: export
          to: api
          relationship: 开发者工作流映射到 API 的独立积分购买。
        - from: app
          to: gp
          relationship: 订阅到毛利的转化未公开。
        - from: api
          to: gp
          relationship: 积分销售到毛利的转化未公开。
    approximationNotes: 这是一张定性的商业桥接图，而不是收入瀑布图：保留来源没有披露交易量、实现价格或利润率转化。
    claimRefs:
      - CI002
      - CI004
      - CI008
      - CI009
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Marble 将分层的世界创建工作流商业化，而 Atlas 位于底层，作为下一代模型核心。
    data:
      layers:
        - label: 输入与采集层
          detail: 用户提供的条件信息与参考材料。
          items:
            - 文本提示词
            - 单张图片
            - 多张图片
            - 全景图
            - 视频片段
            - 粗略 3D 结构
        - label: 空间上下文模型层
          detail: 公开描述的模型与世界构建核心。
          modules:
            - Atlas 多模态自回归扩散 Transformer
            - 共享空间上下文定位
            - 世界生成
            - 空间重建
            - 时空仿真
        - label: 世界表示层
          detail: 持久化场景表示连接生成视图与显式 3D 输出。
          modules:
            - 图像帧
            - 深度图
            - 点云
            - Gaussian splats
        - label: 控制与编辑层
          detail: 将模型输出变成可编辑场景的创作者工具。
          modules:
            - Chisel 结构控制
            - Pano 编辑
            - 点击并扩展
            - 合成
            - 录制
        - label: Marble 产品层
          detail: 有文档记录的网页界面将生成和编辑打包进创作者工作流。
          modules:
            - Gallery
            - Create
            - Worlds
            - Studio
        - label: 输出与交付层
          detail: 面向用户的输出与目的地。
          outputs:
            - 持久化 3D 世界
            - Gaussian splats
            - 三角网格
            - 视频
            - VR 体验
            - 开发资产
    approximationNotes: 该堆栈根据公开产品和博客描述重建，而非来自源代码、内部图表或基准测试披露。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据支持一条由创作者主导、从发现产品到导出 / API 使用的采用路径，但持久化企业环节仍缺少文档。
