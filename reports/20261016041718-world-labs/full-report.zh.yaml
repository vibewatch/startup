      - number: '3.3'
        title: 分销杠杆、切换成本与锁定
        blocks:
          - type: paragraph
            body: >-
              Autodesk 关系的战略价值，不在于证明今天已有收入，而在于验证 World Labs 希望处于技术栈中的位置。TechCrunch
              将该合作描述为探索性合作，先聚焦媒体和娱乐，且没有数据共享承诺；因此更适合把它理解为分销选择权和传统企业认可，而不是已经锁定的经销渠道。结合官方对网格导出、DCC 集成、浏览器分享和 VR 交付的强调，证据显示
              World Labs 试图嵌入现有流程，而不是迫使用户放弃这些流程。

              这降低了采用摩擦，却也限制了护城河论断。如果客户仍在 Autodesk 工具、Blender/Maya/3ds Max、Unity、Unreal 或机器人仿真器中完成工作，World Labs
              虽能借助传统企业分销，却仍暴露于传统企业模仿或捆绑的风险。团队若围绕 Marble 生成的世界建立可重复工作流，切换成本可能上升；但现有公开记录仍未提供足以称为持久锁定的合同、留存或流程嵌入证据。
            claimRefs:
              - CP006
              - CP008
              - CP014
              - CP016
      - number: '3.4'
        title: 护城河持久性判断
        blocks:
          - type: paragraph
            body: >-
              按当前公开记录，World Labs 已有足够差异化来赢得关注、合作与试验，但还不足以宣称拥有不可攻破的护城河。公司资本雄厚、创始团队强，产品界面也比保留资料中的演示阶段同业更广。与此同时，Runway
              已是同业中商业化披露最清晰的公司，而 Google DeepMind 和 Nvidia 可凭更大的平台地位向该品类施压。

              因此，World Labs
              可能在产品包装和工作流适配上领先，却仍处在迅速吸引相邻传统企业、直接创业对手和内部自建方案的品类中。最重要的反证并不是技术是否同等，而是公开收入、客户数、续费和企业定价披露的缺失。在这些指标可见之前，护城河持久性仍是合理论点，而非已证明的结果。
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
