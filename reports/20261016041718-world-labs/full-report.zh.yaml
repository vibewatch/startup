      - number: '2.3'
        title: 买方、用户与付费方地图
        blocks:
          - type: paragraph
            body: >-
              公开套餐至少区分了三条买方路径。创作者和小团队可以直接通过免费或付费订阅试用 Marble；开发者可以单独购买 World API
              积分，用于可编程工作流；企业设计、VFX、游戏、数字孪生或机器人团队则需要接入既有 3D 流程，或通过早期合作伙伴渠道采用。对游戏引擎、DCC 工具、CAD/建模软件和 VR
              设备的导出支持，相比封闭的视频输出降低了切换成本；但 Atlas 仍受限，最广泛的企业论点尚未获得公开商业证据支持。
