      - number: '3.2'
        title: 产品范围与买方权衡
        blocks:
          - type: paragraph
            body: >-
              World Labs 最强的公开差异化在于，Marble 已被定位为商业产品，而不只是研究预览。官方文档、发布博客和 TechCrunch 评测都把 Marble 描述为持久、可下载、可编辑的 3D
              世界生成器，接受文本、图像、视频、全景图和粗粒度 3D 输入，再把资产导回下游创意工作流。由此更容易理解它相对手工 3D 创作、游戏引擎或纯研究演示的位置：它是加速世界创建的工具层，而非替代其余生产体系。

              代价是，公开能力广度领先于公开商业证据。买方能看到标价、社区和图库界面以及个别使用案例，却看不到已披露客户数、续费数据或实际企业经济性。换言之，World Labs
              让产品评估比商业模式评估更容易。功能广度构成真实切入口，但最难回答的投资判断问题仍要靠尽调。
