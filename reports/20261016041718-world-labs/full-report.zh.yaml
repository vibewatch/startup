  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 战略信号很强，但公开经济数据缺失，使结论停留在“跟踪”而非“买入”。
    data:
      nodes:
        - id: technical-credibility
          label: 技术可信度
          detail: 创始团队、世界模型论点与快速融资，共同构成了异常强的初始信号。
        - id: product-proof
          label: 产品证明
          detail: Marble 已商业化、支持导出，并配有单独变现的 World API。
        - id: strategic-validation
          label: 战略验证
          detail: Autodesk 投资了 $200 million，AMD 随后签署了 ~$8.2B 的换股收购协议。
        - id: economic-opacity
          label: 经济数据不透明
          detail: 公开来源仍未披露收入、客户数量或已确认的独立最新估值。
        - id: entry-discipline
          label: 入场纪律
          detail: 在经济状况和权利条款都更清晰之前，仅凭战略收购价格不足以为新的少数股权入场定价。
        - id: recommendation
          label: 建议
          detail: 在尽调补齐收入、客户和本轮条款缺口前，先跟踪；当前价格昂贵、风险高。
      edges:
        - source: technical-credibility
          target: product-proof
          label: 研究成果变成产品
        - source: product-proof
          target: strategic-validation
          label: 产品与团队吸引了战略资本
        - source: strategic-validation
          target: economic-opacity
          label: 信号改善速度快于披露
        - source: economic-opacity
          target: entry-discipline
          label: 经济数据缺失限制投资判断
        - source: entry-discipline
          target: recommendation
          label: 取决于价格的决策
    approximationNotes: null
