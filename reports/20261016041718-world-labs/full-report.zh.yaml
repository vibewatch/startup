            title: 商业证据仍落后于战略势头
            body: 指定资料支持真实的产品发布和融资故事，但不足以让人对收入、客户数、准确员工数、董事会结构或交易完成后的条款连续性形成确定判断。这种不对称很重要，否则 AMD 的待完成交易价格可能看起来比底层商业披露更干净。
