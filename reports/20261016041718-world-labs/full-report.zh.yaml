chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品界面与实际公开信息
        blocks:
          - type: paragraph
            body: >-
              公开来源对大致业务描述基本一致：World Labs 围绕持久、可导航的 3D 世界开发空间智能软件，Marble 是主要产品界面，World API
              是面向开发者的可编程接口。现有文档和发布材料呈现了具体的产品路径：文本、图像、视频、全景图和粗粒度 3D 输入可变成可编辑的 3D 世界，并在网页中渲染或导出到下游工具。尚未厘清的是公司本身的身份。HokAI
              2026 年 10 月的资料称，World Labs 于 2024 年 1 月在旧金山由 Fei-Fei Li、Justin Johnson、Christoph Lassner 和 Ben Mildenhall
              创立；而 Silicon Valley Invest Club 的资料则把同一业务的成立年份列为 2017 年。这个冲突很重要，因为后续对团队速度、资本效率和估值跃升的判断，取决于我们应把它视为 2024
              年创业公司，还是一家更早运行、只是后来才公开出现的企业。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO010
              - CO011
              - CO014
