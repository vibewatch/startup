      - number: '1.3'
        title: 里程碑节奏与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              里程碑节奏确实存在，而且异常紧凑。World Labs 从 2024 年末早期公开研究进展，走到 2025 年 10 月的 RTFM、2025 年 11 月公开提供 Marble、2026 年 1 月推出
              World API、2026 年 7 月发布 SceniX、2026 年 9 月发布 Atlas，并在同月晚些时候签署 AMD
              交易。这一速度说明它已不是尚未推出产品的项目。但指定资料中最强的反向证据并非产品缺失，而是商业信息不透明。独立分析人士仍称，尽管 World Labs 已对 Marble 收费、提供付费 API 积分，并同时引发
              $5 billion 私募轮估值讨论和 $8.2 billion 待完成退出交易，公司却没有披露收入或
              ARR。因此，后续章节应把客户规模、准确员工数、董事会监督和交易完成后的定价连续性视为仍需核实的尽调事项，而不是本章已经证实的事实。
