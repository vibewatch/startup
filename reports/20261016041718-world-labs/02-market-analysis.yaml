company:
  name: World Labs
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    World Labs is selling into an emerging spatial-intelligence category defined
    by persistent, editable 3D world generation rather than generic text, image,
    or video AI. Public evidence supports commercialization lenses such as
    subscription packaging, API pricing, and strategic partner capital, but it
    does not support a defensible TAM/SAM/SOM build because revenue, customer,
    and segment-demand totals remain undisclosed.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      World Labs' own surfaces define the category as spatial intelligence and
      world models for virtual and physical worlds, not a generic generative-AI
      bucket. The included workflows are persistent 3D world creation, editing,
      export, and simulation across creator, developer, and industrial use
      cases. The practical substitutes are video-first generation, flat-image
      tools, and incumbent 3D pipelines that do not deliver editable,
      explorable worlds from multimodal prompts. That boundary matters because
      World Labs is trying to win where 3D persistence, camera control, and
      downstream export are more valuable than raw content novelty.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing lenses
    body: >-
      Public evidence supports market lenses, not a clean TAM/SAM/SOM stack.
      The clearest numeric signals are self-serve packaging, a usage-priced API,
      and strategic capital from Autodesk and other investors. Those numbers
      show that World Labs can lower trial friction for creators and developers
      while attracting large strategic attention from design and physical-world
      incumbents. They do not show recurring revenue, active customer counts,
      renewal behavior, or penetration by segment, so any broader market-size
      claim would be speculative and should remain a diligence gap.
    claimRefs: [CM006, CM007, CM011, CM012]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: Buyer, user, and payer map
    body: >-
      The public packaging already separates at least three buyer paths.
      Creators and small teams can trial Marble directly via free and paid
      subscriptions; developers can buy World API credits separately for
      programmable workflows; and enterprise design, VFX, gaming, digital-twin,
      or robotics teams are asked to adopt through existing 3D pipelines or
      early partner access. Export support for game engines, DCC tools,
      CAD/modeling software, and VR devices lowers switching cost versus closed
      video outputs, but Atlas itself remains gated, so the broadest enterprise
      thesis is still ahead of open commercial proof.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Growth drivers, constraints, and unresolved sizing gaps
    body: >-
      Adoption drivers are strongest where teams already care about 3D
      persistence, camera control, and interoperability: design and digital
      twin workflows, game and VFX asset creation, developer tooling, and
      robotics simulation. Constraints are equally visible. TechCrunch reports
      skepticism in gaming around IP, energy use, and quality, while
      independent analysis flags unresolved post-AMD pricing continuity and no
      public Atlas pricing or named early-access partners. Because public
      evidence still lacks named production customers, revenue, or independent
      demand totals, this chapter can support a market thesis but not a
      defensible market-share model.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend / workflow
      - Excluded spend / workflow
      - Buyer / payer
      - Relevance
    rows:
      - - Spatial-intelligence foundation models
        - >-
          Model and product spend for systems that perceive, generate, reason
          about, and interact with 3D or physical worlds.
        - Generic LLM copilots or flat-image generation with no world output.
        - AI labs, strategic platforms, and investors.
        - Sets the category boundary World Labs uses in product and investor messaging.
      - - Creator 3D world creation
        - >-
          Subscription spend for explorable, persistent 3D scenes generated
          from text, images, video, panoramas, or coarse layouts.
        - Pure 2D image or video tools with no editable 3D export.
        - Individual creators, studios, and prosumer teams.
        - Current self-serve wedge for Marble.
      - - Developer platform / API
        - >-
          Usage-based spend for programmable 3D world generation inside apps
          and internal workflows.
        - One-off manual content creation with no API dependency.
        - Product and platform engineering teams.
        - Separate monetization rail through World API.
      - - Enterprise design / digital twin
        - >-
          Budgets for design, simulation, reality capture, and digital-twin
          workflows that benefit from 3D reasoning and exports.
        - Chatbots or generic office automation budgets.
        - Design-software, AEC, manufacturing, and innovation leaders.
        - Autodesk's rationale points directly at this segment.
      - - Robotics and simulation
        - >-
          R&D spend on controllable simulated environments for robot training,
          testing, and real-to-sim workflows.
        - Generic robotics hardware spend without simulation software.
        - Robotics research and autonomy teams.
        - Roadmap expansion area, not yet proven as broad revenue.
      - - Status-quo substitutes
        - Existing game engines, DCC/CAD tools, and video-first generation tools.
        - Spend that never needs editable, persistent 3D worlds.
        - The same teams already using incumbent 3D pipelines.
        - Defines the switching-cost hurdle World Labs must clear.
    notes: >-
      Boundary rows mix official positioning with analyst interpretation of what
      each workflow includes or excludes; they describe spend categories, not
      measured market totals.
    claimRefs: [CM001, CM002, CM003, CM004, CM009, CM010]
