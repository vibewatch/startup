        - Engineering or platform leadership
        - Need programmable 3D world generation
      - - AEC / design / digital-twin teams
        - Innovation or design-software leader
        - Designers and engineers
        - Workflow or transformation budget
        - Use 3D reasoning, simulation, and exports in built-environment workflows.
        - Design or engineering leadership
        - Interoperability with existing 3D tools plus Autodesk alignment
      - - Robotics / simulation teams
        - Robotics R&D lead
        - Simulation and ML engineers
        - Research budget
        - Build controllable simulated worlds for training and testing.
        - Robotics or research leadership
