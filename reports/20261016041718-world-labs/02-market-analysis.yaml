callouts:
  - calloutType: insight
    title: Public demand proof starts with access design, not revenue disclosure
    body: >-
      The strongest public evidence is how World Labs packages access: low-cost
      creator trials, a separately metered API, and gated partner access for
      Atlas. That is enough to map adoption paths, but not enough to infer
      segment penetration.
    claimRefs: [CM005, CM006, CM007, CM008, CM012]
  - calloutType: risk
    title: Enterprise upside is plausible, but procurement proof is still thin
    body: >-
      Autodesk's $200 million investment and repeated simulation/digital-twin
      messaging show why investors care, yet public materials still do not name
      production customers, Atlas pricing, or post-AMD product terms.
    claimRefs: [CM011, CM013, CM014, CM016]
