        - null
        - Free Marble tier for low-friction creator trial.
        - Medium
        - Plan limit is not buyer count, revenue, or TAM.
      - - Standard creator plan
        - TechCrunch, 2025
        - Global
        - $20 per month; 12 generations
        - null
        - Public paid self-serve package for individual or small-team users.
        - Medium
        - No public conversion, retention, or seat-count data.
      - - Pro creator plan
        - TechCrunch, 2025
        - Global
        - $35 per month; 25 generations
        - null
        - Adds scene expansion and commercial rights for higher-intent creators.
        - Medium
        - Still packaging evidence, not segment demand.
      - - Max creator plan
        - TechCrunch, 2025
        - Global
        - $95 per month; 75 generations
        - null
        - Highest disclosed self-serve plan and usage cap.
        - Medium
        - Ceiling on public plan access, not enterprise willingness to pay.
      - - Developer API floor
        - HokAI, 2026
        - Global
        - $1 per 1,250 credits; $5 minimum
