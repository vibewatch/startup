    notes: >-
      Rows summarize buyer pathways visible in public product, press, and
      analyst sources; budget owners are inferred from the workflow each source
      describes rather than from named customer contracts.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
