        - Usage-priced API entry point for developers.
        - Medium
        - No public consumption benchmarks or contract-volume data.
      - - Strategic enterprise signal
        - Autodesk / Construction Dive, 2026
        - Global
        - $200M strategic investment
        - null
        - Proxy for partner conviction in design and physical-world AI demand.
        - Medium
        - Financing is not customer spend or recurring revenue.
      - - Capital narrative
        - Winzheng, 2026
        - Global
        - $1.23B total capital raised
        - null
        - Investor-conviction proxy used because public TAM and revenue are absent.
        - Low
        - Capital raised is not market size, SAM, or SOM.
    notes: >-
      Null CAGR means the source did not publish a growth rate or the row is a
      commercialization proxy rather than a true market series. Numeric lenses
      are source-backed but do not share a common denominator.
    claimRefs: [CM006, CM007, CM011, CM012]
