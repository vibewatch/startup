  evidenceGaps:
    - type: missing-source
      severity: material
      topic: round-terms
      missingEvidence: Confirmed February 2026 post-money valuation, liquidation preferences, investor rights, and dilution mechanics for new and prior holders.
      whyItMatters: Without round-term detail, an outside investor cannot translate reported headline valuation into a real entry price or expected payoff.
      diligencePath: Obtain the financing documents, board materials, or direct management confirmation of the round structure and cap-table effects.
      relatedQuestionRefs: [QV001, QV002, QV008]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Revenue, paid-user, enterprise-customer, retention, gross-margin, and burn data for Marble and the World API.
      whyItMatters: These metrics are the missing bridge between strategic excitement and a price-sensitive underwriting case.
      diligencePath: Request management KPI packs, cohort data, and customer references segmented by creator, enterprise, and robotics use cases.
      relatedQuestionRefs: [QV003, QV004, QV008]
    - type: private-evidence-only
      severity: material
      topic: transaction-continuity
      missingEvidence: Product-roadmap, pricing, contract-assignment, and integration commitments for Marble and the World API through AMD close.
      whyItMatters: The signed acquisition improves headline valuation support but could also change product economics, sales motion, or customer willingness to commit.
      diligencePath: Review the merger agreement summary, customer contract change-of-control clauses, and management's integration plan for pricing and support continuity.
      relatedQuestionRefs: [QV002, QV007, QV008]
