schemaVersion: report-v2
artifact: valuation
slug: world-labs
runDate: 2026-10-16
company:
  name: World Labs
chapter:
  number: 8
  title: Valuation
  summary: World Labs has unusually strong strategic and technical signal, including a reported roughly $5 billion February 2026 private mark and a signed AMD acquisition at about $8.2 billion, but public evidence still does not disclose revenue, paid customer scale, or a confirmed standalone post-money valuation. The chapter therefore supports a track recommendation, medium confidence, high risk rating, and an expensive valuation stance unless diligence produces revenue quality, customer proof, and cap-table detail that justify paying up.
sections:
  - id: price-support
    title: Public price support improved, but standalone underwriting is still thin
    body: >-
      Public financing context is directionally better than it was in the prior report: multiple
      independent profiles now converge on a February 2026 round of roughly $1 billion and on a
      reported valuation around $5 billion, while HokAI says the later signed AMD transaction at
      about $8.2 billion is the only valuation either side has put in writing. That matters because
      it shows real strategic demand for the asset, not just venture enthusiasm. The underwriting
      problem is that the February round's exact post-money, preference stack, and dilution
      consequences remain undisclosed, and Value Add VC explicitly notes that the company never
      confirmed the ~$5 billion figure in public. For a minority investor, a signed strategic M&A
      price is also not the same thing as a clean contemporaneous venture entry mark with known
      rights, timing, and downside protections.
    claimRefs: [CV001, CV002, CV003, CV010, CV011]
    tableRefs: [TV001]
  - id: commercial-proof
    title: Product proof is visible, but commercial proof is still the missing bridge
    body: >-
      World Labs has crossed an important threshold from research story to shippable product:
      official materials and TechCrunch show Marble as a public commercial offering with paid tiers,
      downloadable outputs, multiple input modes, and a separate developer API. That supports the
      thesis that the company has turned world-model research into something buyers can try today.
      It does not yet support a high-conviction valuation case. Public sources still do not disclose
      revenue, customer counts, retention, gross margin, or named scaled deployments, and both
      HokAI and Silicon Valley Invest Club state that no revenue figure is public. Value Add VC's
      comparison is the sharpest external benchmark: Runway reportedly reached roughly $300 million
      ARR before or around a similar valuation band, while World Labs remains valued primarily on
      team quality, product potential, investor signal, and strategic optionality.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV012, CV013]
    tableRefs: [TV002]
  - id: recommendation
    title: Recommendation stays track until revenue quality and deal economics are visible
    body: >-
      The decision implication is not that World Labs lacks upside; rather, the public record still
      leaves too much unpriced uncertainty for a buy recommendation at strategic-takeout or late
      private-market optics. The bull case is that AMD closes near the announced value and the
      Autodesk relationship plus World API / Marble adoption eventually prove a category-defining
      infrastructure position. The base case is that the signed deal validates technology and team,
      but outside investors still cannot underwrite minority-entry returns because core economics and
      rights remain private. The bear case is that if the AMD close slips or strategic enthusiasm
      cools, the market re-anchors on the lack of disclosed revenue and customer proof. That keeps
      the right call at track, with diligence focused on revenue quality, named production customers,
      February 2026 round terms, and any pricing or contractual changes ahead of transaction close.
    claimRefs: [CV010, CV011, CV013, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision lens
      - Assessment
      - Evidence-backed implication
    rows:
      - [Recommendation, track, "Public evidence supports continued monitoring and diligence rather than chasing a priced entry today."]
      - [Confidence, medium, "Sources agree on financing and product facts but not on disclosed economics or a confirmed standalone private mark."]
      - [Risk rating, high, "The asset now has strategic-exit support, but valuation and ownership context still outrun public commercial disclosure."]
      - [Valuation stance, expensive, "The reported ~$5B February 2026 mark was never confirmed publicly and the ~$8.2B AMD price is strategic M&A rather than a clean minority-entry benchmark."]
      - [Entry discipline, price-sensitive only, "Re-underwrite only with verified revenue quality, named scaled customers, and round-term clarity, or at a materially better effective entry price."]
    notes: Public evidence supports direction and relative discipline, not a precise target return or fully disclosed private-round economics.
    claimRefs: [CV002, CV004, CV010, CV011, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence today
      - What would change the view
    rows:
      - [Founding team and research edge, "Fei-Fei Li and the co-founders give World Labs unusual technical credibility and helped attract major capital quickly.", "Keep positive unless attrition or post-acquisition integration weakens the core research team."]
      - [Product is real and monetized, "Marble is live with paid tiers and exportable persistent 3D worlds while the World API is separately monetized.", "Upgrade if paid adoption, named enterprise deployments, and renewal behavior become public."]
      - [Strategic investor signal is unusually strong, "Autodesk committed $200 million and AMD later signed an ~$8.2B stock acquisition.", "Upgrade only if those relationships translate into shipped products, durable contracts, or clearer monetization evidence."]
      - [Commercial opacity remains the core anti-thesis, "Public sources still disclose no revenue, profitability, customer count, or confirmed standalone latest valuation.", "Downgrade concern only with audited or management-confirmed revenue, margin, and customer-quality disclosure."]
    notes: The table separates thesis strength from the evidence still missing to convert strategic signal into underwritable economics.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV010, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Probability signal
      - Downside / trigger
    rows:
      - [Bull, "AMD closes near the announced value and Marble plus the World API prove broad commercial pull across design and simulation workflows.", "Strategic value remains closer to the signed ~$8.2B exit context than to the earlier reported private mark.", "Positive if diligence uncovers real paid usage, Autodesk-linked distribution, and enterprise-grade customer references.", "Breaks if strategic closing or product continuity weakens before economics are proven."]
      - [Base, "The technology and team are validated but public economics stay opaque and minority investors still cannot price rights cleanly.", "A new outside entry is hard to justify above the reported February 2026 private mark without verified revenue quality or better terms.", "Most consistent with today's evidence because financing and product facts are public while monetization proof is not.", "Remains capped by missing revenue, customer, gross-margin, and cap-table disclosure."]
      - [Bear, "AMD timing slips or strategic enthusiasm fades before World Labs shows durable monetization.", "Valuation could reset below the last reported private mark because the public record still lacks disclosed revenue and scaled customer proof.", "More likely if the deal stalls, if pricing/terms change unfavorably, or if adoption remains demo-heavy.", "Triggered by failed close, weak commercial evidence, or evidence that the company is spreading across markets without a winning wedge."]
    notes: The scenarios are qualitative because public evidence does not support a precise target-return model, terminal multiple, or cap-table-adjusted entry math.
    claimRefs: [CV004, CV009, CV010, CV011, CV013, CV014, CV015]
