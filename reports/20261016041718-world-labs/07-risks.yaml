callouts:
  - calloutType: risk
    title: Highest-conviction near-term risk
    body: >-
      The AMD transaction is strategically positive on paper, but until it closes and
      product commitments are explicit, it compounds ownership, roadmap, and hardware
      concentration into one transition risk instead of removing them.
    claimRefs: [CR001, CR002, CR012, CR015]
  - calloutType: assumption
    title: Clearest thesis-break triggers
    body: >-
      Treat delayed merger approval, restrictive post-close terms changes, a material
      security or privacy incident, or continued failure to show enterprise controls and
      commercial metrics as the cleanest reasons to step back from the current thesis.
    claimRefs: [CR001, CR003, CR005, CR006, CR013]
