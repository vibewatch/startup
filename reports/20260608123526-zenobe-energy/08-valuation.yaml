- 'id': 'SV004'
  'title': 'Recommendation, exit readiness, and diligence asks'
  'body': 'Zenobē looks more exit-ready than many growth-stage climate companies, but not yet price-ready for an outside investor relying only on public evidence. The company has sponsor-quality owners, real debt-market access, international operating breadth, and tangible project proof points such as Blackhillock, European fleet finance, and North American fleet expansion via Revolv. Those features make a 2026-2029 monetisation window believable through a secondary infrastructure sale, strategic sale, or sponsor recap. A near-term IPO is less compelling because public UK battery funds are still wrestling with weak revenue environments and NAV discounts, which would make it hard to float Zenobē on an asset-heavy story alone. The correct investment stance is therefore research-more, not avoid: Zenobē has enough public evidence to justify deeper work, and enough scale to keep £1 billion-plus EV on the table, but not enough disclosed economics to say whether today’s equity is attractive, fair,
    or expensive. Before underwriting any mark, diligence must close the gaps on EBITDA, net debt, contract quality, debt terms, and the preference stack sitting above common equity.'
