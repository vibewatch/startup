  'title': 'Valuation'
  'summary': 'Public evidence supports a plausible £1B+ enterprise-value implication for Zenobē, but not a defensible equity mark. The 2023 KKR/Infracapital sponsor recap, the £410M 2024 bus-platform financing, and the €325M July 2025 European fleet facility show real lender and sponsor support, yet public sources still do not disclose EBITDA, net debt, contracted-versus-merchant mix, or preference terms. The disciplined recommendation is research-more: treat £1.0-1.5B EV as a directional public-evidence range and do not underwrite price from headlines alone.'
'sections':
- 'id': 'SV001'
  'title': 'Financing context and what public evidence can actually price'
  'body': 'Zenobē has strong public financing signals but weak public pricing transparency. The clearest equity anchor is the 7 September 2023 sponsor recap: Zenobē disclosed c.£600 million from KKR plus a further c.£270 million from Infracapital, while KKR separately described its own cheque as approximately US$750 million and said KKR and Infracapital would become joint majority shareholders. That confirms large-scale sponsor conviction and suggests a business already operating at infrastructure-ticket size, but neither the company nor KKR disclosed the post-money equity valuation, price per share, liquidation preferences, or current leverage. The debt record is similarly supportive but incomplete: Zenobē announced a £410 million electric-bus platform financing in May 2024 on top of an existing £241 million platform, and then a €325 million debt facility in July 2025 to expand European fleets. Those announcements show funding access, bank confidence, and real asset-finance capacity, but
    they do not tell investors how much enterprise value accrues to equity after debt, preferred rights, and sponsor economics. Companies House filings reinforce the opacity point: the group filed 2024 accounts and multiple 2025-2026 share allotments and charge notices, proving an active capital structure, yet public filings still do not surface the valuation bridge a minority investor would need to underwrite a precise mark.'
