      - number: '8.3'
        title: Bull, base, bear and sensitivity
        blocks:
          - type: paragraph
            body: >-
              The central judgment is not whether Zenobē is a quality company; it is whether the public record supports
              paying a specific price today. On that question, the evidence is directional rather than precise. The bull
              case requires three things to show up together: continued sponsor-backed growth capital, successful
              monetisation of Blackhillock-scale assets, and fleet-financing expansion that keeps pushing electric
              transport below diesel total cost of ownership. The base case assumes those advantages are real but
              partially offset by UK battery-market revenue volatility and by the absence of disclosed EBITDA, net debt,
              and equity terms; under that frame, public evidence is consistent with something like a £1.0-1.5 billion
              enterprise-value band, but not a tighter mark. The bear case assumes UK storage revenue pressure persists,
              fleet margins prove thinner than the headlines imply, and the cost of debt or sponsor preferences absorb
              more value than outsiders can see. The most important sensitivity is the contracted-versus-merchant mix in
              storage cash flows, followed by the true return on Zenobē’s financing-led fleet model. Until those two
              bridges are disclosed, any valuation argument above £1 billion should be framed as plausible inference,
              not verified price.
