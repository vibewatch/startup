  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: few full-stack clones, many credible unbundlers'
        blocks:
          - type: paragraph
            body: >-
              Zenobē competes across two linked buying problems: grid-scale battery storage and fleet electrification.
              That makes its peer set unusually broad. On the fleet side, Zenobē publicly sells finance, grid connection
              support, depot design and build, charging optimisation, operations support, and battery repurposing in one
              package. On the storage side, it is also an owner and developer of large battery assets. Very few rivals
              show both layers at once. The closest overlaps come from EDF power solutions and Pivot Power, which
              combine grid-scale battery storage with multi-megawatt EV power infrastructure, and from Centrica Business
              Solutions, which combines financing, monitoring, maintenance, and behind-the-meter generation or storage.
              Beyond those incumbents, the competitive threat is more modular: Nuvve attacks V2G-led monetisation,
              GridBeyond attacks optimisation and financed on-site storage, EO and Heliox attack depot charging
              delivery, and Connected Energy plus Forsee attack the second-life battery economics that help Zenobē lower
              day-one cost. That means the market is fragmented in surface area but converging in buyer outcome.
