  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      The public evidence suggests a repeatable journey from authority funding or operator decarbonisation intent to
      long-term managed charging, with Zenobe’s grid-risk transfer at the center.
    data:
      items:
        - label: Funding or route mandate emerges
          detail: >-
