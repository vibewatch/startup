      - number: '7.3'
        title: Safety, permitting, and technology risk
        blocks:
          - type: paragraph
            body: >
              Operational risk is manageable but not trivial because Zenobe is scaling lithium-ion BESS assets at a pace
              the safety framework is still catching up with. NFCC's battery-storage position statement says the UK's
              transition is outpacing safety standards and regulation, and warns that lithium-ion failures can create
              thermal runaway, toxic and explosive vapours, multi-day fires, and reignition risk. Government guidance
              likewise says the health and safety landscape for grid-scale BESS is complex and requires integrated
              design, emergency response, and lifecycle management, while DSEAR imposes clear duties around dangerous
              substances, control measures, and emergency procedures. Zenobe's own posture is stronger than average: it
              cites ISO 45001 certification, zero-harm objectives, and site-level fire-water storage or containment
              provisions for Hawthorn Pit and Little Horsted. Yet those mitigants reduce severity rather than remove it.
              The technology risk is broader than fire: Zenobe's own fleet guidance says bus batteries normally require
              replacement below 70% state of health, current warranties are roughly eight years, and poorly managed
              fleets may require two replacements over vehicle life. Zenobe's second-life and battery-managed-service
              models help preserve residual value and transfer some replacement risk from operators, but they depend on
              accurate degradation forecasting and continued demand for repurposed packs. Investors should therefore
              treat safety and obsolescence as compounding risks on a larger installed base, not as one-off engineering
              exceptions.
            claimRefs:
