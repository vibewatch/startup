      - number: '6.3'
        title: Adoption trajectory is visible through fleet counts, depot counts, and programme expansion
        blocks:
          - type: paragraph
            body: >-
              Zenobe does not disclose a simple customer-count time series in the fetched current source set, so
              adoption has to be read through deployment scale proxies. Those proxies are still meaningful. Independent
              financing coverage framed Zenobe’s platform as enabling more than 2,000 new electric buses across the UK
              and Ireland by 2026. At the customer level, Oxford’s 159-bus programme, National Express West Midlands’
              170-bus 2025 launch, Transport UK London Bus’s 193 financed vehicles across 12 TfL routes, McGill’s 68
              buses across three depots, Cardiff’s 36-bus first fleet, and Transdev’s 39-bus Harrogate financing all
              demonstrate that the business has moved far beyond one-off demonstration sites. The pattern is also
              cumulative. National Express expanded from a 19-bus Yardley Wood starting point into a broader nationwide
