  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Policy, legal, and market-design risk
        blocks:
          - type: paragraph
            body: >
              Zenobe's largest residual risk is that UK battery market rules change faster than its project-finance
              model can absorb. Competition Appeal Tribunal filings show Zenobe is itself challenging GEMA's 2025 and
              2026 LDES cap-and-floor decisions, arguing that subsidised long-duration storage could distort competition
              against unsupported short-duration batteries that rely on revenue stacking across balancing, ancillary,
              and wholesale markets. At the same time, Zenobe's own June 2026 policy note says zonal-pricing uncertainty
              is already slowing battery investment because debt providers need confidence in forecast revenues and
              contracted offtakes. Ofgem's January 2026 market report reinforces the macro backdrop: balancing costs
              have risen with transmission constraints and renewable growth, the connections queue reached 750GW, and
              RIIO-3 transmission spending could rise dramatically. This does not mean Zenobe is structurally
              unfinanceable—Clean Power 2030 still needs large volumes of storage, and Zenobe already operates
              grid-forming sites that regulators say are strategically useful. But it does mean the main downside path
              is policy-led: if reform reduces revenue visibility or tilts the market toward subsidised alternatives
              without protecting short-duration battery economics, future UK project FIDs, debt terms, and equity marks
              could deteriorate before demand for storage itself weakens.
            claimRefs:
              - CR015
              - CR016
