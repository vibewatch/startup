      - number: '7.4'
        title: Partner, customer, and counterparty risk
        blocks:
          - type: paragraph
            body: >
              Zenobe markets itself as technology agnostic, but individual assets still depend on a narrow counterparty
              stack. Blackhillock combines Wärtsilä battery technology and software, SMA grid-forming inverters, SSEN
              grid connection, and EDF route-to-market services. Kilmarnock South depends on Wärtsilä, Omexom, EDF, and
              Kraken for hardware, balance-of-plant, trading, and dispatch. Those are sensible specialist choices, but
              they create concentrated execution paths at the site level. Customer exposure is more diversified by logo
              than by end-market. Zenobe works with roughly 90% of major UK bus companies and powers about 25% of the UK
              e-bus market, which limits single-name concentration but still concentrates demand within regulated public
              transport and local-budget cycles. Frameworks with Go-Ahead, Vectalia, and National Express show the model
              can scale across operators: the Go-Ahead facility has funded more than 280 buses from four OEMs, the
              Vectalia agreement transfers battery health risk to Zenobe, and National Express's two-year procurement
              model gives Zenobe authority over 47GWh of renewable power under live wholesale pricing. Even so, public
              sources do not disclose customer-level revenue shares, portfolio-wide supplier concentration, or exact
              contract tenors by route-to-market provider. The result is a risk profile that is diversified relative to
              an early-stage startup, but still dependent on a concentrated set of financing, dispatch, hardware, and
              public-transport counterparties.
