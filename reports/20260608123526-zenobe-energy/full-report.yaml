  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Zenobé's relevant market should be defined as spend on flexible, grid-connected batteries and on
              heavy-duty transport electrification systems where power availability, financing, and energy optimisation
              are part of the product. Included spend therefore covers utility-scale BESS development, ownership and
              optimisation; zero-emission bus fleet transition programmes and depots; commercial-fleet depot charging
              and onsite power infrastructure; and rail traction or non-traction energy projects where batteries,
              charging, or depot power reduce diesel dependence. Excluded spend is home batteries, passenger-car
              charging, generic retail charging-point operations, and broad passenger-EV sales, because those buyers,
              funding lines, and operating workflows differ materially from Zenobé's institutional buyer set. The
              status-quo substitutes also vary by segment: peaker plants and thermal flexibility in grid services,
              diesel fleets in buses and trucks, and diesel traction on unelectrified rail. That boundary matters
              because the best public evidence remains fragmented by submarket. The supportable approach is not to
              present one inflated blended TAM, but to combine several constrained lenses and keep the exclusions
              explicit.
            claimRefs:
              - CM040
              - CM041
              - CM042
              - CM043
              - CM045
