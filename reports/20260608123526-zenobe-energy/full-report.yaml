      - number: '8.2'
        title: Comparable set and the adverse market read-through
        blocks:
          - type: paragraph
            body: >-
              The right public comp set for Zenobē is blended, not pure-play. Fluence gives a public-market ceiling for
              a scaled storage platform with real disclosure and a multi-billion-dollar market cap, while UK listed
              battery-storage funds such as Gresham House Energy Storage Fund, Gore Street Energy Storage Fund, and
              Harmony Energy Income Trust provide an asset-backed floor for merchant and quasi-contracted UK battery
              portfolios. Zenobē should command some premium to those listed funds because it combines storage
              development, financing, charging infrastructure, and fleet services rather than holding batteries in a
              passive trust wrapper. However, the adverse evidence is too important to dismiss. Tamarindo reported that
              large UK storage funds were trading at significant discounts while Balancing Mechanism revenues hit record
              lows, and Fitch noted that the merchant share of UK battery revenue rose to 55% in November 2023 and 75%
              in December 2023, making cash flows more volatile. Those sector conditions matter because they cap how
              aggressively a public investor should capitalise Zenobē’s storage portfolio absent a clear
              contracted-revenue mix. Public evidence therefore supports a premium to listed UK BESS funds, but not a
              venture-style multiple that ignores merchant-risk compression.
