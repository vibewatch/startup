  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Implied EV range (£m)
      - Valuation logic
      - Key risk
      - Probability signal
    rows:
      - - Bull
        - >-
          European fleet financing scales quickly, Blackhillock-like assets monetise well, contracted revenue dominates
          merchant volatility
        - 1500-2100
        - Infrastructure-style sponsor exit with premium for fleet optionality and execution proof
        - Requires strong segment margins and benign debt terms
        - Possible, but needs private diligence support
      - - Base
        - >-
          Current scale is real, debt access stays open, but public disclosure remains insufficient and UK revenue
          conditions stay mixed
        - 1000-1500
        - >-
          Directional EV range supported by sponsor equity, debt capacity, and operating footprint without claiming
          precise equity value
        - Still vulnerable to undisclosed leverage and contract-quality weaknesses
        - Most defensible from current public evidence
      - - Bear
        - >-
          Merchant weakness persists, debt proves expensive or restrictive, and fleet economics underperform
          expectations
        - 700-950
        - Value compresses toward an asset-backed floor once public-market storage stress dominates the story
        - Could be worse if preference stack is heavy or EBITDA is weak
        - Credible downside until economics are disclosed
    notes: >-
