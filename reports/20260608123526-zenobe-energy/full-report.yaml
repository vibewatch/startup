  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Contracted revenue weaker than expected
        - Storage portfolio is majority merchant and fleet contracts lack durable minimum payments
        - Cuts infrastructure-style multiple support and increases dependence on volatile spreads
        - Move from research-more to avoid or demand a materially lower entry mark
      - - Debt package is tight
        - July 2025 facility pricing, security package, or covenants leave little downside room
        - Enterprise value may remain high while equity value is impaired by leverage and lender controls
        - Reprice on equity basis or stop process
      - - Fleet unit economics are thin
        - Electric-fleet financing earns sub-par returns after capex, battery replacement, and operations
        - Destroys the premium over listed BESS trusts and turns growth into capital consumption
        - Use asset-floor valuation only
      - - Exit route narrows to IPO-only
        - Secondary and strategic buyer interest is weak while listed BESS discounts persist
        - Reduces sponsor monetisation options and lengthens hold period at uncertain marks
        - Downgrade exit confidence and widen discount rate
    notes: >-
      Each trigger is tied to a diligence item that could shift valuation quickly even if headline growth metrics remain
      positive.
    claimRefs:
      - CV029
      - CV030
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current valuation bridge
        - Latest priced equity round, share price history, and any internal or lender mark
        - Without it, public EV inference cannot be translated into an equity underwriting case
        - Management data room; board materials; investor letters
      - - Economics and leverage
        - Segment EBITDA, net debt, interest cost, and contracted-versus-merchant revenue split
        - These are the core drivers of whether £1B+ EV leaves attractive equity value
        - Audited 2024/2025 management accounts plus debt model
      - - Preference stack and control rights
        - Liquidation preferences, anti-dilution, veto rights, and sponsor governance terms
        - Determines where minority equity sits in the capital structure
        - Cap table, shareholder agreement, and financing term sheets
      - - July 2025 facility detail
        - Pricing, tenor, security, amortisation, cash sweeps, and covenant package for the €325M debt facility
        - Turns a headline financing positive into a usable valuation input
        - Lender deck, facility agreement, treasury memo
      - - Customer and contract quality
        - Fleet customer concentration, contract duration, renewal history, and minimum-payment terms
        - Needed to justify any premium to listed BESS funds or public storage comps
        - Top-customer schedule and contract sample set
    notes: >-
      The most price-critical asks are capital-structure and cash-flow disclosures; market-size work is secondary
      because the public proof of demand is already adequate.
    claimRefs:
      - CV035
      - CV038
      - CV043
      - CV044
