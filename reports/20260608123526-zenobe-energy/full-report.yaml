      - number: '7.2'
        title: Financing and revenue-model risk
        blocks:
          - type: paragraph
            body: >
              Zenobe has moved well beyond venture-style funding into full infrastructure finance. Official company
              materials cite more than £2.3 billion of debt and equity raised since 2017, more than £1 billion of green
              debt raised since 2019, a 13-lender EV financing syndicate, and repeated project-level facilities for
              Blackhillock, Kilmarnock South, and Eccles. That funding depth is a strength because it shows lenders view
              Zenobe's assets as increasingly bankable, but it also changes the risk profile: returns now depend on debt
              availability, refinancing terms, and stable asset cash flows rather than on market awareness alone.
              Companies House records show continuing share allotments through 2025-2026 and a new security charge
              registered in October 2025 after satisfaction of an earlier charge, consistent with an actively managed
              capital structure. Merchant exposure also remains meaningful. Blackhillock and Eccles savings assumptions
              rely partly on balancing services, constraint management, and price volatility reduction, while National
              Express's 2026 procurement model explicitly uses live wholesale prices and resells unused power back to
              the grid. Zenobe mitigates this through longer-term debt, framework agreements, and battery-risk-transfer
              products, but exact covenant headroom, tenor ladders, and the split between contracted and merchant EBITDA
              are not publicly disclosed. Investors should therefore underwrite Zenobe as a capital-intensive platform
              whose growth rate is constrained by market design and debt market trust.
