      - number: '4.2'
        title: Contract quality, tenor and margin drivers
        blocks:
          - type: paragraph
            body: >-
              The most supportive public evidence for Zenobē’s revenue quality is not a disclosed income statement but
              the contract structures visible in customer examples. Oxford Bus Company uses a 15-year
              battery-as-a-service agreement that converts upfront battery capex into a monthly fee. Transport UK London
              Bus uses 14-year charging-service and battery-managed-service structures across 193 financed vehicles.
              Go-Ahead has a committed finance framework under which more than 280 buses had already been funded by May
              2026, while Vectalia signed a three-year, up to €120 million operating-lease framework that also shifts
              battery performance risk to Zenobē. National Express adds another monetized layer: a two-year
              power-management arrangement over 47GWh that allows Zenobē to buy electricity at live wholesale prices and
              sell unused energy back to the grid. These structures imply a business with real recurring or
              quasi-recurring cash flows, but margin depends on disciplined pricing of financing cost, battery
              replacement reserves, depot build complexity, electricity volatility and infrastructure operation. Yardley
              Wood is illustrative: the depot battery both supports overnight charging and earns daytime grid-service
              income, showing that Zenobē’s margin path depends as much on asset optimisation and risk transfer as on
              pure hardware resale.
