        title: Operating footprint, project anchors, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Open-web scale signals are meaningful but they use different lenses. Zenobē’s own 2026 Our Story page says
              the company has c.1,300MW of contracted storage assets and supports more than 3,400 electric vehicles
              globally, while the July 2025 Europe debt announcement used the same >3,400 vehicle figure across 120
              depots. By March 2026 the Revolv acquisition release raised the depot count to 122 and described more than
              2.5GWh of battery storage assets in contract, showing that storage scale is reported in both power and
              energy terms depending on context. Public deployment anchors are concrete. Brampton announced a $4 billion
              framework with Zenobē for up to 1,000 battery-electric buses, and trade coverage confirmed Blackhillock’s
              200MW/400MWh phase one had entered commercial operations with a further 100MW expected in 2026. These
              facts support a view of Zenobē as an international platform with real asset depth across fleets and grid
              services, even though revenue, valuation, and customer-economics disclosure remain limited.
