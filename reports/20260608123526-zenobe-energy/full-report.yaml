      - number: '6.5'
        title: Expansion upside is real, but concentration and modal-diversification risk remain unresolved
        blocks:
          - type: paragraph
            body: >-
              Zenobe’s expansion logic is visible in both geography and product scope. Geographically, the customer set
              spans London, Oxford, Coventry, Cardiff, Nottingham, Scotland, Yorkshire, and New Zealand. Commercially,
              the land-and-expand motion is clearest where depot electrification grows into broader route financing,
              second-life storage, or power procurement. National Express is the best example, and Transport UK London
              Bus is another. But the concentration questions that matter to investors remain unresolved. The public
              proof set is still heavily concentrated in UK bus and London-route operators, a segment where public
              grants, council economics, and transport-authority procurement all shape timing and win rates. Public
              evidence for rail operators, coaches, or other transport modalities did not survive this current-url run
              at comparable depth. That does not mean the pipeline is absent; it means the public customer proof is
              still bus-centric. As a result, the strongest near-term insight is positive—Zenobe has a repeatable
              bus-fleet playbook—while the strongest open risk is that the public record does not yet show how
              diversified the revenue base really is across operators, modes, and renewal cohorts.
