      - number: '3.2'
        title: Direct peers and adjacents by stack layer
        blocks:
          - type: paragraph
            body: >-
              EDF and Centrica are the clearest incumbent alternatives because both can bring balance-sheet strength,
              grid relationships, and long-duration service models into procurement cycles. EDF says its battery storage
              portfolio will provide up to 3GW of flexible capacity and that it has secured up to 40 strategic
              high-voltage connection locations for EV charging, including depot and HGV use cases. Centrica markets
              integrated energy solutions, microgrids, zero-CAPEX structures, and 24/7 monitoring, which turns it into a
              credible alternative when the buyer cares more about resilience and financing than fleet-specialist
              software. Among software or market-access specialists, Nuvve focuses on bidirectional charging, V2G
              revenue, and site-level control; GridBeyond focuses on AI-led optimisation, fleet charging around grid
              limits, and funded on-site storage. In second-life batteries, Connected Energy and Forsee Power are not
              yet full Zenobē substitutes, but they do attack one of Zenobē’s most distinctive economic claims: using
              reused EV batteries to improve project economics. EO, Heliox, Siemens, and SWARCO matter most when buyers
              want depot charging capability without signing up for Zenobē’s financing and battery wrapper.
