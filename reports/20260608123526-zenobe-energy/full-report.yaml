  - id: FE001
    title: Product architecture map — Zenobē
    type: stack
    summary: >-
      Zenobē’s architecture layers financial packaging, telemetry, charging control, grid dispatch and battery
      repurposing into a single operating model.
    approximationNotes: >-
      Layer boundaries are reconstructed from product, case-study and launch materials; Zenobē does not publish a full
      technical architecture diagram.
    claimRefs:
      - CE002
      - CE005
      - CE009
      - CE012
      - CE031
      - CE036
    data:
      layers:
        - id: l1
          label: Commercial wrapper
          detail: >-
            ETaaS and BaaS contracts allocate capex, battery risk and operations support into monthly service
            structures.
          modules:
            - Finance
            - Battery-as-a-Service
            - Operational support
            - Performance guarantees
        - id: l2
          label: Fleet data + telemetry
          detail: Vehicle, charger and battery data feeds operating decisions.
          modules:
            - Telematics devices
            - State-of-health analytics
            - Live fleet data
            - Operator onboarding
        - id: l3
          label: Charging orchestration
          detail: Hekaton and related smart-charging workflows optimise timing, load and depot operations.
          modules:
            - Smart charging
            - Load management
            - Tariff-aware scheduling
            - Charger interoperability
        - id: l4
          label: Depot and site electrical layer
          detail: Physical infrastructure translates grid capacity into usable charger power.
          modules:
            - HV/LV substations
            - Private wire or grid connection
            - DC chargers
            - Protection systems
        - id: l5
          label: Grid battery control layer
          detail: BESS platforms stack stability and market services on transmission-connected assets.
          modules:
            - Grid-forming inverters
            - ESS hardware
            - Dispatch / route-to-market
            - Stability services
        - id: l6
          label: Battery circularity layer
          detail: Retired fleet packs are repurposed into static and portable power assets.
          modules:
            - Replacement workflow
            - Refurbishment
            - Powerskids
            - Second-life depot support
