            body: >-
              Founder attribution is consistent across official and partner materials even if full governance visibility
              is not. Zenobē’s public team page names Donald Weir as Chief Executive Officer, James Basden and Steven
              Meersman as Founder Directors, and Steve Holliday as Non-Executive Chairman. The 2023 KKR transaction
              materials also identify Nicholas Beatty as the third founder, which matters because later funding and
              strategy materials still present the business as founder-built even when not every founder carries a
              front-stage executive title. Meersman remains especially visible in fleet-financing announcements and
              public-partnership releases, while Basden appears in grid-storage project commentary. Public governance
              disclosure is thinner than leadership disclosure: reviewed materials identify the chair and selected
              executives, but they do not provide a full current board roster, committee structure, delegated
              authorities, or shareholder-control terms. That leaves clear founder and executive dependence, with board
