      - number: '2.2'
        title: Sizing Lenses and Constrained Market Estimates
        blocks:
          - type: paragraph
            body: >-
              Battery storage provides the cleanest numeric lens because UK and EU reporting is relatively mature. The
              precise UK baseline differs by methodology and timing, but the direction is clear: RenewableUK counted
              more than 6.8GW and 10.5GWh operational by September 2025, while Energy-Storage.news said more than 4GWh
              came online during 2025, lifting operational capacity to 12.9GWh by January 2026. Modo Energy's end-2024
              snapshot already showed 4.7GW and 6.6GWh in Great Britain, plus merchant revenues around £88k/MW/year in
              January 2025. The official policy lens is also sizeable: Ofgem and DESNZ say the UK should support 23-27GW
              of grid-scale batteries by 2030. For the European context, SolarPower Europe reported 27.1GWh of new EU
              installations in 2025, taking the region to 77.3GWh of installed stock, while the IEA said global battery
              storage added 108GW in 2025. The most defensible sizing conclusion is therefore a constrained multi-lens
              view: a UK storage market already at double-digit GWh operational scale, an official UK need range in the
              mid-twenties GW by 2030, and a European market that still needs much larger deployment to reach
              flexibility targets.
