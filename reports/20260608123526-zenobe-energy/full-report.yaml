  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Service Bundles
        blocks:
          - type: paragraph
            body: >-
              Zenobē’s public product surface is organised around fleet electrification, grid-scale battery assets,
              portable power and second-life battery services. In practice the commercial unit is a managed service
              bundle rather than a charger, inverter or battery module sold à la carte. The fleet business is explicitly
              marketed as an end-to-end offer spanning finance, grid connection, design and build, energy procurement,
              charging, optimisation, operations support and repurposing. On bus and coach contracts that bundle extends
              to battery replacement, smart charging software, spare parts and ongoing operational support under
              Electric Transport as a Service. [CE001] [CE002] [CE003] [CE004]


              The through-line across these products is that Zenobē tries to own battery lifecycle risk and convert it
              into a financing and operations product. Under Battery-as-a-Service the battery is separated from the
              chassis, backed by a minimum state-of-health commitment, monitored through telemetry and replaced when
              needed; when useful vehicle life ends, the same packs can be repurposed into stationary or portable
              assets. That creates a circular commercial loop between first-life fleet contracts and second-life storage
              that few public CPOs can match. [CE007] [CE008] [CE009] [CE010] [CE012] [CE013]
