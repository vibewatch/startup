      - number: '7.5'
        title: Governance and execution risk
        blocks:
          - type: paragraph
            body: >
              Governance has matured, but that does not eliminate key-person or alignment risk. Zenobe's 2023 equity
              round brought in c.£600 million from KKR and a further c.£270 million from Infracapital, leaving the pair
              as joint majority shareholders with JERA and TEPCO retained as minority strategic investors. Companies
              House now shows a broader board and officer bench, including CEO Donald Weir, CFO Iain Wetherall,
              founder-directors James Basden and Steven Meersman, and investor-linked directors such as Andy Matthews
              and Shreya Malik. Filing history also shows that co-founder Nicholas Beatty left the board in October
              2024, while new director appointments continued in 2024 and 2025. That looks healthier than a founder-only
              governance model, especially for a company reliant on repeated debt raises and cross-border execution. The
              residual risk is alignment and succession: Zenobe is now trying to scale UK storage, European fleet
              leasing, and newer North American ambitions simultaneously, while its public materials do not disclose
              reserved matters, customer concentration thresholds, or succession planning for founders and newer senior
              executives. The investor base is an advantage for capital access and discipline, but it also raises the
              possibility that growth pace, leverage tolerance, and exit timing become governed more by sponsor
              expectations than by purely technical readiness. Governance transparency has improved, but it remains
              incomplete for an investor underwriting multi-year expansion.
