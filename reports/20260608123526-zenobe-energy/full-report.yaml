      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Storage and fleet electrification are already scaled enough to matter
            body: >-
              The evidence base no longer describes pilots. UK battery storage is already measured in double-digit GWh,
              the EU added 27.1GWh in 2025 alone, the UK registered 2,523 zero-emission buses in 2025, and government
              fleet packages now fund both vehicles and depots. That combination supports an infrastructure specialist
              thesis better than a purely speculative emerging-market story.
            calloutType: strength
            claimRefs:
              - CM004
              - CM009
              - CM023
              - CM031
          - type: callout
            title: ADVERSE — queue surplus and depot power can delay monetisation
            body: >-
              The same markets can grow while still becoming harder to monetise. Ofgem and DESNZ say the post-reform
              battery queue remains well above official need, while truck operators still face depot-connection delays
              that SMMT says can stretch toward 15 years and BVRLA says leave only 9% of operators comfortable with
              today's business case. Zenobé therefore has real market demand, but timing risk is structural.
            calloutType: risk
            claimRefs:
              - CM015
              - CM033
              - CM034
