        title: Customer base segmentation remains bus-heavy and public-sector-linked
        blocks:
          - type: paragraph
            body: >-
              Zenobe’s public customer evidence in this run is dominated by bus operators rather than rail operators,
              and by buyers whose economics are shaped by public policy, local-authority funding, or transport-authority
              route structures. The named set spans national groups such as National Express, Go-Ahead/Oxford Bus
              Company, Stagecoach, First Bus, and Arriva; London route operators such as Transport UK London Bus and
              Abellio; regional and municipal operators such as Cardiff Bus, Nottingham City Transport, and McGill’s;
              and one international bus operator, Ritchies in New Zealand. That is real breadth within bus, but it is
              still a narrow modal lens. Buyer-user-payer roles are also fragmented. In Oxford and Nottingham, councils
              and ZEBRA awards help fund the asset base while operators run services. In London, TfL route economics
              matter even when the direct contractual counterparty is the operator. The segmentation takeaway is that
              Zenobe is not merely selling chargers: it is typically selling capital structure, grid-risk transfer, and
              operational assurance into bus fleets where public-sector economics matter.
