      - number: '4.4'
        title: Public disclosure gaps and adverse developments
        blocks:
          - type: paragraph
            body: >-
              Zenobē gives investors and customers many useful public operating signals, but it does not provide the
              financial disclosures needed for a clean underwriting model. Companies House confirms that the company is
              private, active and has filed accounts through 31 December 2024, while the filing history shows charges
              and repeated share allotments. What the accessible public record does not disclose in usable text is
              turnover, EBITDA, unrestricted cash, net debt, interest burden, covenant headroom, or a bridge from signed
              framework value to recognized revenue. In other words, debt platform sizes are far more visible than
              debt-service capacity. That asymmetry matters because the company’s public examples repeatedly show Zenobē
              financing assets itself and guaranteeing battery outcomes over 14- to 15-year terms. There is also at
              least one adverse policy signal relevant to forward storage economics. In 2026, legal commentary from
              Local Government Lawyer and Ward Hadaway said Zenobē was challenging GEMA’s cap-and-floor support for
              long-duration storage, with the outcome still uncertain. That does not impair today’s fleet contracts, but
              it shows that part of the company’s wider storage economics remains exposed to policy design and
              litigation rather than only customer demand.
