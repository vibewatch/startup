evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-rights
    missingEvidence: Full current board roster, committee structure, observer rights, and shareholder reserved matters.
    whyItMatters: >-
      Control cannot be assessed properly from public titles alone, especially after a joint-majority ownership
      transaction.
    diligencePath: Request the board list, committee charters, shareholder agreement, and delegated-authorities schedule.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: capital-reconciliation
    missingEvidence: >-
      A reconciled financing schedule that separates disclosed equity, project debt, fleet debt, convertibles, and any
      secondaries.
    whyItMatters: >-
      Public materials cite both >£850m of equity and around £1.8bn of total equity plus debt, but the directly
      disclosed instruments do not fully reconcile on the open web.
    diligencePath: Request a financing timeline by instrument, date, amount, purpose, and recourse structure.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: A run-date headcount snapshot showing FTEs, contractors, and regional split.
    whyItMatters: >-
      Headcount is a core proxy for burn, operating leverage, and execution capacity, and public disclosures currently
      present only a moving lower bound.
    diligencePath: Request HR, payroll, or org-chart data current to 2026-06-08.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation-and-revenue
    missingEvidence: Latest valuation mark, revenue or ARR, and customer concentration by business line.
    whyItMatters: >-
      Later financial and valuation chapters cannot rely on project scale alone when public sources do not disclose
      monetization or a current market mark.
    diligencePath: Request board materials, financing decks, management accounts, and top-customer concentration summaries.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
      - TO005
  - type: missing-source
    severity: minor
    topic: TO004 milestone coverage beyond public record
    missingEvidence: >-
      Internal milestone log covering non-public governance actions, private financings, and product releases not
      visible in retained sources.
    whyItMatters: >-
      The milestone table is intentionally public-record partial, so readers need a clear explanation of what chronology
      is still missing.
    diligencePath: >-
      Request an internal timeline of financing amendments, governance changes, and major operating milestones for
      reconciliation against TO004.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      A unified, bottom-up public TAM/SAM/SOM that ties storage, buses, commercial fleets and rail into one comparable
      market denominator.
    whyItMatters: >-
      Without a common denominator, valuation work can overstate the reachable market by blending incompatible
      submarkets and units.
    diligencePath: >-
      Request internal pipeline, won-project, and backlog data from Zenobé; reconcile against public battery, bus and
      fleet programme data to build a company-specific SAM and SOM.
    relatedQuestionRefs:
      - QM007
  - type: conflicting-data
    severity: material
    topic: uk-bess-market
    missingEvidence: >-
      A harmonised UK battery baseline that reconciles MW/GWh and project-boundary differences across RenewableUK, Solar
      Media and Modo snapshots.
    whyItMatters: >-
      Public market baselines differ by date, duration modelling and whether they focus on operational stock, annual
      additions or total queue, so naive comparisons can mis-size growth.
    diligencePath: >-
      Normalise a single internal base case by project date, duration assumption and operational definition before using
      any market-share math.
    relatedQuestionRefs:
      - QM003
      - QM004
