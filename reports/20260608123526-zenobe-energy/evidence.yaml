    severity: material
    topic: fleet-electrification
    missingEvidence: Depot-level ROI, payback, charger utilisation and grid-upgrade cost data for bus, van and HGV deployments.
    whyItMatters: >-
      The buying process is infrastructure-led, so project economics depend more on site-specific power and utilisation
      than on top-line fleet counts.
