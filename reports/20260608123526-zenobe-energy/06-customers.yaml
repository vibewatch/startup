    {
      "id": "named-customer-proof",
      "title": "Named customer proof is strongest on live depot and route deployments",
      "body": "The named proof set is materially stronger than a simple logo wall. Oxford Bus Company, Stagecoach, Cardiff Bus, Transport UK London Bus, Nottingham City Transport, First Bus Leeds, Arriva, Abellio, McGill’s, National Express, Transdev Blazefield, and Ritchies all have publicly described projects with enough specificity to distinguish live operations from generic partnership language. Several include exact bus counts, charger counts, battery terms, or route references. Oxford is the cleanest flagship case: 104 buses at Cowley House plus 55 at Stagecoach’s Oxford site, with public council corroboration. National Express is the clearest scaled relationship, progressing from Yardley Wood and Coventry depot work to 170 buses in service in the West Midlands and then into a 2026 energy-procurement upsell. London is the second strongest cluster because Transport UK London Bus discloses route counts, fleet share, and depot details. The weakest part of the public proof set is not deployment existence but proof quality beyond deployment: only some operators provide direct quotes or quantified operating outcomes, and rail remains conspicuously absent from the named current proof set.",
