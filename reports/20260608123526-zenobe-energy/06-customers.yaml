      "id": "durability-and-friction",
      "title": "Durability is inferred from contract structures, but procurement and grid friction remain visible",
      "body": "The public record is strongest on long-duration operating commitments and weakest on actual commercial retention metrics. Across Cardiff, Oxford, Nottingham, Transport UK London Bus, and Ritchies, Zenobe repeatedly frames its customer relationships through 14-year to 16-year charging or battery-managed-service arrangements. That is meaningful because it implies recurring operational responsibility rather than one-time EPC work. But it does not substitute for NRR, churn, renewal rates, or cohort curves, none of which were disclosed in the fetched sources. The other consistent theme is friction. Grid-capacity problems recur across almost every serious customer case, and several examples explain why Zenobe’s battery-backed model resonates: expensive upgrades, constrained depots, listed buildings, long cable routes, and the need to keep services running during construction. National Express’s 2026 move away from fixed-price electricity contracts adds a second layer of friction—energy-price volatility after buses are already live. Taken together, the durability story is plausible but still partially opaque: public evidence shows multi-year technical embedding, while the commercial renewal data investors would normally want remains private.",
