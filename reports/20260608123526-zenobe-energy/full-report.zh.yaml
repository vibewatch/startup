  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面和服务包
        blocks:
          - type: paragraph
            body: >-
              Zenobē
              的公开产品表面围绕车队电动化、电网级电池资产、便携式电力和二次寿命电池服务展开。实际商业单元是托管服务包，而不是按件出售的充电器、逆变器或电池模块。车队业务被明确营销为端到端方案，覆盖融资、电网连接、设计与建设、能源采购、充电、优化、运营支持和再利用。在公交和长途客车合同中，这套服务包还延伸到电动交通即服务下的电池更换、智能充电软件、备件和持续运营支持。[CE001]
              [CE002] [CE003] [CE004]


              这些产品的主线是，Zenobē
              试图持有电池生命周期风险，并把它转化成融资和运营产品。在电池即服务下，电池与底盘分离，由最低健康状态承诺背书，通过遥测监控，并在需要时更换；车辆有用寿命结束后，同一批电池包可再利用为固定式或便携式资产。这在一线车队合同和二次寿命储能之间形成一个循环商业闭环，少有公开
              CPO 能匹配。[CE007] [CE008] [CE009] [CE010] [CE012] [CE013]
