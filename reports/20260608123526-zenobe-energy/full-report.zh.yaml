      - number: '8.2'
        title: 可比组合与不利市场读数
        blocks:
          - type: paragraph
            body: >-
              Zenobē 合适的公开可比对象应是混合组合，而不是单一业务。Fluence 为一家有真实披露、数十亿美元市值的规模化储能平台给出公开市场上限；英国上市电池储能基金，如 Gresham House Energy
              Storage Fund、Gore Street Energy Storage Fund 和 Harmony Energy Income Trust，则为市场化和准签约英国电池组合给出资产支撑的下限。Zenobē
              应较这些上市基金享有一定溢价，因为它整合了储能开发、融资、充电基础设施和车队服务，而不是把电池被动放在信托壳里。不过，反向证据太重要，不能忽略。Tamarindo 报道，大型英国储能基金在大幅折价交易，同时
              Balancing Mechanism 收入跌至纪录低位；Fitch 指出，英国电池收入中的市场化部分在 2023 年 11 月升至 55%、12 月升至
              75%，使现金流更波动。这些行业条件很关键，因为在签约收入结构不清晰时，它们限制了公开市场投资者能多激进地资本化 Zenobē 的储能组合。因此，公开证据支持 Zenobē 相对英国上市 BESS
              基金享有溢价，但不支持忽视市场化收入风险压缩的风险投资式倍数。
