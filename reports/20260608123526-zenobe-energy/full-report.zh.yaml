  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 资方支持
        - KKR 和 Infracapital 投入大额股权资金，并仍是联合多数股东
        - 公开记录仍缺少投后估值、优先股堆叠以及任何少数股权经济条款
        - 股权结构表、股价历史和股东权利清单
      - - 债务市场准入
        - 2024 年和 2025 年债务融资显示贷款方有反复进场意愿，也证明结构化融资能力
        - 若杠杆、定价或契约条款偏紧，能拿到债务并不能证明股权有吸引力
        - 完整债务包，包含期限、担保、定价和契约余量
      - - 经营验证
        - Blackhillock、>3,400 辆 EV、122 个车库和国际车队案例证明规模真实
        - 规模指标看不出 EBITDA 质量、合同期限或市场化收入依赖
        - 分部 EBITDA、合约收入占比和客户集中度披露
      - - 退出路径
        - 资方画像和基础设施属性支持 2026-2029 年老股或战略退出
        - 英国上市 BESS 折价和疲弱市场化收入削弱 IPO 式倍数支撑
        - 合约现金流耐久性和战略买家意愿证据
    notes: 只要管理层能提供私下证据，每条反向逻辑都应是尽调收口项，而不是投资逻辑杀手。
    claimRefs:
