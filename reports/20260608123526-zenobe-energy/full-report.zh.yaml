              - CV042
      - number: '8.3'
        title: 乐观、基准、悲观情景与敏感性
        blocks:
          - type: paragraph
            body: >-
              核心判断不是 Zenobē 是不是一家优质公司，而是公开记录是否支持今天支付某个具体价格。在这个问题上，证据只能指方向，不能定精确价。乐观情景需要三件事同时出现：资方继续支持增长资本，Blackhillock
              级资产成功变现，车队融资扩张持续把电动交通的总拥有成本压到柴油车之下。基准情景假设这些优势真实存在，但被英国电池市场收入波动，以及 EBITDA、净债务和股权条款未披露所部分抵消；在这个框架下，公开证据与约
              £1.0-1.5 billion
              企业价值区间相符，但无法支持更窄估值。悲观情景假设英国储能收入压力持续，车队利润率比头条暗示的更薄，债务成本或资方优先权吸收了外部人看不到的更多价值。最重要的敏感性是储能现金流中签约收入与市场化收入的比例，其次是
              Zenobē 融资驱动车队模型的真实回报。在这两座桥披露之前，任何高于 £1 billion 的估值论证都应被表述为合理推断，而不是经验证价格。
