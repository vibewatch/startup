      - number: '7.4'
        title: 合作伙伴、客户和交易对手风险
        blocks:
          - type: paragraph
            body: >
              Zenobe 将自己定位为技术中立，但单个资产仍依赖狭窄的交易对手栈。Blackhillock 组合了 Wärtsilä 的电池技术和软件、SMA 构网型逆变器、SSEN 并网以及 EDF
              入市服务。Kilmarnock South 依赖 Wärtsilä、Omexom、EDF 和 Kraken，分别覆盖硬件、BOP、交易和调度。这些都是合理的专业选择，但也让站点层面的执行路径更集中。客户敞口按
              logo 看更分散，按终端市场看则没那么分散。Zenobe 服务约 90% 的英国主要公交公司，并为英国约 25% 的电动公交市场供能，这降低了单一客户集中度，但需求仍集中在受监管公共交通和地方预算周期内。与
              Go-Ahead、Vectalia、National Express 的框架说明模型可以跨运营商复制：Go-Ahead 融资安排已支持来自四家 OEM 的 280 多辆公交，Vectalia
              协议把电池健康风险转移给 Zenobe，National Express 的两年采购模型则授权 Zenobe 按实时批发价管理 47GWh
              可再生电力。即便如此，公开来源没有披露客户级收入占比、组合层面供应商集中度，或按入市服务商划分的确切合同期限。因此，风险画像相对早期创业公司已更分散，但仍依赖一组集中的融资、调度、硬件和公共交通交易对手。
