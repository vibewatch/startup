      - number: '4.3'
        title: 资本结构和债务依赖
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的增长路径显然由债务驱动。公司在 2022 年披露 £241 million EV 债务结构，随后在 2024 年 5 月扩展，向现有平台增加 £410 million，并把 2019
              年以来累计绿色债务推高到超过 £1 billion。电池储能侧，Zenobē 2024 年 1 月披露 Kilmarnock South 项目新增 £147 million 债务，叠加更早的 £101
              million Blackhillock 融资；公司称这是一个合计 £282 million 的融资平台，并带有额外 £400 million 扩额条款。2025 年 7 月，公司又为欧洲车队扩张完成 €325
              million 债务融资，并列出七家贷款方。后续 Companies House 抵押登记显示，这组资金堆栈不是无担保的公司商誉：贷款方获得了以 Kroll Trustee Services
              为受益人的固定抵押和负面承诺。股权并没有从故事中消失——Zenobē 自己的公告提到 KKR 和 Infracapital 在 2023 年投入约 £870 million 股权，Companies House
              也显示到 2025 年和 2026
              年初仍有多次配股——但模式仍指向一个需要持续债务容量来为车辆、电池、充电器、电网连接和储能项目融资的业务。若合同耐久，这在经济上很有力量；但这也意味着再融资风险是运营模式的一部分，而不是遥远的尾部事件。
