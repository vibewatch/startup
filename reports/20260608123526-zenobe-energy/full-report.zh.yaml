        - 重做 GB 电池回报测算，并放慢或停止新增建设假设
      - - 再融资压力
        - 债务定价 / 担保包
        - 新融资定价显著高于基准情景，或担保 / 契约条款较 2024-25 年先例收紧
        - 提高要求回报，假设 FID 速度下降，并建模稀释风险
      - - 安全制度大幅升级
        - 英国重大 BESS 火灾或新许可规则
        - 任何显著抬高保险、设计或应急响应要求的行业事故或规则变化
        - 上调管线站点的 capex 和 opex 假设，并重新评估进度风险
      - - 项目管线延误
        - 规划审批或并网送电里程碑未达成
        - Hawthorn Pit / Little Horsted 审批未达 2026 年目标，或新站点较计划延误 >6 个月
        - 推迟收入爬坡，扩大执行折价，并测试资方追加股权的意愿
      - - 车队需求 / 预算压力
        - 客户投放放缓
        - Go-Ahead、National Express、Vectalia 或可比运营商连续 2+ 个季度未达到投放或节省预期
        - 下调车队增长假设，并重估客户集中度和补贴敏感性
    notes: 这些是投资人监测阈值，不是管理层 KPI。越过阈值不一定自动打破投资逻辑，但应迫使投资人重做测算。
