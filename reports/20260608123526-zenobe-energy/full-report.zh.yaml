        title: 耐久性来自合同结构推断，但采购和电网摩擦仍可见
        blocks:
          - type: paragraph
            body: >-
              公开记录最强的是长期运营承诺，最弱的是实际商业留存指标。Cardiff、Oxford、Nottingham、Transport UK London Bus 和 Ritchies 等案例中，Zenobe 反复用
              14 年到 16 年的充电或电池管理服务安排来表述客户关系。这很有意义，因为它意味着持续运营责任，而不是一次性 EPC 工作。但它不能替代
              NRR、流失率、续约率或队列曲线；抓取来源没有披露这些指标。另一个一致主题是摩擦。几乎每个严肃客户案例都会反复出现电网容量问题，多个例子也解释了 Zenobe
              的电池支撑模式为何有吸引力：昂贵升级、受限车场、保护建筑、长电缆线路，以及施工期间保持服务运行的需求。National Express 2026
              年从固定价电力合同转出，又增加了第二层摩擦——公交已经上线后的能源价格波动。合在一起，耐久性故事可信但仍部分不透明：公开证据显示多年技术嵌入，而投资者通常想要的商业续约数据仍是私有的。
