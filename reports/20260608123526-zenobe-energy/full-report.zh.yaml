      - number: '1.3'
        title: 资本形成、股东结构和债务容量
        blocks:
          - type: paragraph
            body: >-
              资本形成是后续章节最清楚、也最可复用的事实之一。2023 年 9 月 7 日，Zenobē 宣布从 KKR 获得约 £600 million，并从 Infracapital 获得额外约 £270
              million；KKR 和 Infracapital 成为联合多数股东，JERA 与 TEPCO Power Grid 继续作为少数战略持有人。KKR
              另行表示，这是其全球气候战略的第一笔投资，说明这笔交易既是融资事件，也是对 Zenobē 车队电动化和电池储能平台的战略背书。公开记录对债务也异常具体。Zenobē 2025 年 7
              月公告称，公司已就欧洲车队电动化的 €325 million 债务融资完成交割；更早的公司材料提到 2022 年 2 月的车队私募配售，以及 2023 年苏格兰电池债务包。缺失的仍是交易后的精确持股比例、2023
              年控制权交易对应的任何估值，以及公司宣称的累计融资总额与直接披露工具之间的完整对账。
