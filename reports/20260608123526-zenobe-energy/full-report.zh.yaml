            body: >-
              EDF 和 Centrica 是最清楚的既有替代方案，因为两者都能把资产负债表实力、电网关系和长周期服务模式带入采购周期。EDF 称其电池储能组合将提供最高 3GW 灵活容量，并已锁定多达 40
              个战略高压连接地点用于 EV 充电，包括车场和 HGV 用例。Centrica 营销集成能源解决方案、微电网、零 CAPEX 结构和 24/7
              监控；当买方更看重韧性和融资，而不是车队专用软件时，它就成为可信替代。软件或市场准入专家中，Nuvve 聚焦双向充电、V2G 收入和站点级控制；GridBeyond 聚焦 AI
              驱动的优化、围绕电网限制安排车队充电，以及有资金支持的现场储能。在二次寿命电池中，Connected Energy 和 Forsee Power 还不是完整 Zenobē 替代品，但它们确实攻击 Zenobē
              最有辨识度的经济主张之一：用再利用 EV 电池改善项目经济性。买方若只想要车场充电能力，而不想签下 Zenobē 的融资和电池包裹，EO、Heliox、Siemens 和 SWARCO 最重要。
