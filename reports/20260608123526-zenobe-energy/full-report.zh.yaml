      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方和付款方结构把 Zenobē 的市场同消费 EV
              叙事区分开来。在电网级储能中，买方是开发商、公用事业公司、IPP、交易商和基础设施基金；用户是资产运营商和优化方；付款方最终落在批发、平衡、辅助服务和容量相关市场。公交领域的购买决策通常在地方交通主管机构、公交运营商和公共资金机构之间拆分：2025
              年 4 月 DfT 资金包资助 319 辆公交，并要求至少 3:1 私人资金匹配；2026 年 3 月 ZEBRA 轮又为 484 辆公交和车场增加 £73.2 million 公共支持和 £94 million
              私人资本。在商用车队中，买方是物流运营商、租赁车队、零售商和公共机构，他们必须把车辆补贴、车场充电资本开支和电网接入合在一起。在铁路中，买方结构更分散，横跨 Network
              Rail、列车运营公司和公共交通机构；可获得的公开数据仍更多关注能源和排放，而不是逐线路的电池经济性。估值上，Zenobē 卖进的是机构预算和基础设施工作流，而不是冲动型车辆需求。
