      - number: '3.3'
        title: 替代品：大型车队自建是真实选项
        blocks:
          - type: paragraph
            body: >-
              Zenobē 最大的替代品不总是另一个有品牌的“电动化即服务”提供商。对拥有内部能源团队或强承包商的大型车队来说，替代品是一套拼装堆栈。买方可以从 EO、Heliox 或 Siemens
              采购车场硬件和可用性支持；用 GridBeyond 或 Nuvve 做充电优化、灵活性收入或微电网控制；再依赖 Centrica 或 EDF 做融资、电力采购或连接策略。PwC
              的车队电动化工作也强化了这一方向：充电即服务正在扩散，智能集成平台变得关键，OEM 也在发展自己的车队。实际采购中，Zenobē
              的胜点在于客户更看重风险转移和单一责任方，而不是模块化控制。硬件和软件多栖更容易，融资型电池管理合同则不一样，因为 EO 和 Nuvve 都强调互操作性和合作伙伴生态。因此，当客户运营受限时，Zenobē
              受益；当客户有资本、采购能力或能把堆栈缝合起来的能源管理伙伴时，它更容易被替代。
