  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：完整堆栈克隆者少，可信拆分者多
        blocks:
          - type: paragraph
            body: >-
              Zenobē 同时竞争两个相连的采购问题：电网级电池储能和车队电动化。这让它的可比对象异常宽。在车队侧，Zenobē
              公开销售融资、电网连接支持、车场设计与建设、充电优化、运营支持和电池再利用的一体化包。在储能侧，它也是大型电池资产的持有人和开发商。很少有竞争对手同时展示这两层。最接近的重叠来自 EDF power
              solutions 和 Pivot Power，它们把电网级电池储能与多兆瓦 EV 电力基础设施结合起来；以及 Centrica Business
              Solutions，它把融资、监控、维护和表后发电或储能结合起来。除这些既有玩家外，竞争威胁更模块化：Nuvve 进攻 V2G 主导的变现，GridBeyond 进攻优化和融资型现场储能，EO 和 Heliox
              进攻车场充电交付，Connected Energy 与 Forsee 则进攻帮助 Zenobē 降低初始成本的二次寿命电池经济性。这意味着市场表面上碎片化，但正向买方结果收敛。
