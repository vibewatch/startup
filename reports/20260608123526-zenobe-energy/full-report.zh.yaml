    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部和商业模式
        blocks:
          - type: paragraph
            body: >-
              Zenobē 应被视为一家总部位于伦敦的私营能源转型公司，其法律史和运营史起点略有不同。Companies House 显示，Zenobe Energy Limited 于 2016 年 10 月 19
              日注册成立，并在 2019 年 3 月由 Battery Energy Storage Solutions Limited 更名；公司材料则称 Zenobē“始于 2017
              年”。后续章节应保留这一区分，而不是把它压成一个创立日期。当前官方定位比早期法律名称更清楚：Zenobē
              称其在电动车队、网络基础设施和二次寿命电池应用中设计、融资、建设并运营电池解决方案。官网把电动车队定义为端到端电动化，包括充电基础设施、电池更换和软件；网络基础设施则被表述为服务电网的大规模电池储能。因此，Zenobē
              更适合被理解为横跨交通电动化和电网服务的资本密集型运营与融资平台，而不是纯软件或硬件供应商。
