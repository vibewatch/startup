      - number: '8.5'
        title: 图表要点
        blocks:
          - type: callout
            title: 最强估值结论
            body: 公开证据支持 1B+ 企业价值含义，但不足以做出已定价的股权判断。应把资方再资本化和债务融资视为融资质量证明，而不是有吸引力入场估值的证明。
            calloutType: recommendation
