      - number: '8.4'
        title: 建议、退出准备度与尽调问题
        blocks:
          - type: paragraph
            body: >-
              Zenobē 看起来比许多成长阶段气候公司更接近退出，但对于只依赖公开证据的外部投资者，还没到可以定价的程度。公司有资方级股东、真实债务市场通道、国际运营广度，以及 Blackhillock、欧洲车队融资、通过
              Revolv 扩张北美车队等具体项目证明点。这些特征让 2026-2029 年通过二级基础设施出售、战略出售或资方再资本化实现变现窗口显得可信。短期 IPO 吸引力较弱，因为英国上市电池基金仍在应对疲弱收入环境和
              NAV 折价；仅靠资产重故事让 Zenobē 上市会很难。正确投资立场因此是继续研究，而不是回避：Zenobē 公开证据足以支持继续深入研究，规模也足以让超过 £1 billion
              的企业价值（EV）留在桌面上，但披露的经济性还不足以判断今天的股权是有吸引力、公允还是昂贵。在承保任何估值标记前，尽调必须补齐 EBITDA、净债务、合同质量、债务条款，以及位于普通股之上的优先权堆叠。
