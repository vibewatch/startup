      - number: '2.2'
        title: 规模视角和受约束的市场估算
        blocks:
          - type: paragraph
            body: >-
              电池储能给出最干净的数字视角，因为英国和欧盟报告相对成熟。精确的英国基线会因方法和时间不同而变化，但方向很清楚：RenewableUK 统计，到 2025 年 9 月已有超过 6.8GW 和 10.5GWh
              投运；Energy-Storage.news 则称 2025 年新增上线超过 4GWh，使 2026 年 1 月的投运容量达到 12.9GWh。Modo Energy 的 2024 年底快照已显示 Great
              Britain 有 4.7GW 和 6.6GWh，且 2025 年 1 月商业化收入约 £88k/MW/year。官方政策视角同样可观：Ofgem 和 DESNZ 称，英国到 2030 年应支持 23-27GW
              电网级电池。在欧洲语境下，SolarPower Europe 报告 2025 年欧盟新增 27.1GWh 装机，使区域累计装机达到 77.3GWh；IEA 则称 2025 年全球电池储能新增
              108GW。因此，最站得住脚的规模结论是一个受约束的多视角判断：英国储能市场已达到两位数 GWh 的投运规模，英国官方到 2030 年的需求区间在二十多 GW，欧洲市场若要达成灵活性目标仍需要大得多的部署。
