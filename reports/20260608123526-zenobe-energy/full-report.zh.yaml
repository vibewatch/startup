  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景，以及公开证据究竟能给什么定价
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的公开融资信号很强，但公开定价透明度很弱。最清晰的股权锚是 2023 年 9 月 7 日的财务投资人再资本化交易：Zenobē 披露 KKR 投入约 £600
              million，Infracapital 进一步投入约 £270 million；KKR 另行称自己的支票约 US$750 million，并表示 KKR 与 Infracapital
              将成为联合多数股东。这确认了大规模资方信心，也说明公司已经进入基础设施投资的单笔规模，但无论公司还是 KKR，都没有披露投后股权估值、每股价格、清算优先权或当前杠杆。债务记录同样提供支持但不完整：Zenobē 于
              2024 年 5 月宣布 £410 million 电动公交平台融资，叠加既有 £241 million 平台；随后又在 2025 年 7 月宣布 €325 million
              债务融资，用于扩张欧洲车队。这些公告说明它能拿到资金、银行有信心、资产融资能力真实存在，但没有告诉投资者，在债务、优先权和资方经济性之后，有多少企业价值归属股权。Companies House
              文件进一步印证了不透明：集团提交了 2024 年账目，以及多项 2025-2026 年配股和担保通知，证明资本结构活跃；但公开文件仍没有给出少数股投资者承保精确估值所需的估值桥。
