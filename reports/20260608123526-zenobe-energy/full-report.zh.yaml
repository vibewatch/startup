      - number: '2.4'
        title: 增长驱动、瓶颈和估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求驱动是真实的。IEA 称电池仍是增长最快的电力技术；公共政策仍需要多得多的灵活性；Elexon 的 2026/27
              计划继续扩展数据和市场管道，帮助灵活性提供方参与市场。公交项目继续用公共资金撬动更大的私人承诺；政府 2026 年卡车和厢式货车方案也直接补贴车辆和车场。但瓶颈同样实质。Ofgem 和 DESNZ 承认，推进到
              Gate 2 的电池项目仍比 2030 年目标区间上限高出 14.8GW，比 2035 年预测需求高出 61.7GW，给商业化回报带来真实的过剩风险。Ofgem
              的平衡机制审查显示，系统仍在为拥堵和稀缺付费：Balancing Mechanism 电量增长 17% 至 33TWh，2024-25 年总平衡成本达到 £2.7
              billion。交通电动化同样由基础设施牵引：DESNZ 称车队充电行为和障碍仍缺少充分记录；SMMT 称部分 HGV 运营商可能要等最多 15 年才能拿到车场电网连接；BVRLA 称只有 9% 的运营商认为当前
              HGV 商业案例成立；铁路脱碳数据仍没有分离出干净的公开电池 TAM。
