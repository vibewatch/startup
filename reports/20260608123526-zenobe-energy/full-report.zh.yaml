  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 评估
      - 公开证据支撑
      - 决策含义
    rows:
      - - 投资建议
        - 继续研究
        - 融资和规模真实；价格透明度不足
        - 不要只靠标题做投资测算
      - - 信心
        - 中
        - 公开来源很多，但缺少关键定价输入
        - 把公开证据用于初筛，不要当作最终定价
      - - 风险评级
        - 高
        - 市场化收入敞口、杠杆不透明和优先权不确定性仍然重要
        - 定价前必须拿到硬尽调
      - - 估值立场
        - unknown
        - £1B+ EV 有可信度；股权价值无法由公开资料验证
        - 不要把 EV 推断当成股权事实
      - - 最强结论
        - 1B+ EV 可以论证，不能证明
        - 资方资本、债务能力和经营规模支撑可信度
        - 入场纪律应锚定已披露 EBITDA、债务和条款
    notes: 本判断表仅综合公开证据；它刻意不替代管理层、贷款方或数据室尽调。
