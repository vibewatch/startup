      - number: '7.3'
        title: 安全、许可和技术风险
        blocks:
          - type: paragraph
            body: >
              运营风险可控，但并不轻，因为 Zenobe 扩张锂离子 BESS 资产的速度仍快过安全框架追上的速度。NFCC
              电池储能立场声明称，英国转型正跑在安全标准和监管之前，并警告锂离子故障可能引发热失控、有毒和爆炸性蒸汽、多日火灾及复燃风险。政府指引同样指出，电网级 BESS
              的健康与安全环境复杂，需要一体化设计、应急响应和全生命周期管理；DSEAR 也对危险物质、控制措施和应急程序设定明确职责。Zenobe 自身姿态强于平均水平：它列出 ISO 45001 认证、零伤害目标，以及
              Hawthorn Pit 和 Little Horsted 站点级消防水储存或围堵安排。但这些缓释措施降低严重性，并不能消除风险。技术风险不止火灾：Zenobe 自有车队指南称，公交电池通常在健康状态低于 70%
              时需要更换，当前质保大约八年，管理不善的车队在车辆生命周期内可能需要更换两次。Zenobe
              的梯次利用和电池托管服务模式有助于保留残值，并把部分更换风险从运营商转移出去，但这些模式依赖准确的衰减预测，以及对再利用电池包的持续需求。因此，投资者应把安全和技术淘汰视为装机基数扩大后叠加放大的风险，而不是一次性的工程例外。
