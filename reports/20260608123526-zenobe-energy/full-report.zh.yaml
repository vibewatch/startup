      - number: '4.5'
        title: 关于收入质量、利润率路径和资本充足性的财务结论
        blocks:
          - type: paragraph
            body: >-
              最强、可支撑的财务结论是：Zenobē
              拥有真实且越来越可重复的变现引擎，但它建立在结构化融资和长期资产义务上，而不是轻量软件经济性上。收入质量看起来好于披露质量：长期电池、充电、租赁和能源管理合同意味着客户关系粘性和可见合同期限。利润率潜力也可信，因为
              Zenobē 试图同时捕捉几类价差——高于资本成本的租赁定价、电池风险定价、充电和基础设施运维，以及能源优化或电网服务收入。取舍是资本强度。公开案例研究显示，Zenobē
              反复为车辆、电池、充电基础设施和电网连接融资；债务公告和 2025 年抵押备案也显示贷款方保留担保和结构性保护。因此，2025 年 7 月的 €325 million
              融资更应被理解为业务仍依赖债务平台维持扩张的证据，而不是可有可无的增长资本。没有私有收入、EBITDA、流动性和契约数据，资本充足性无法证明；只能推断为目前仍能融资。尽调下一步应索取一份贷款人质量的桥接，把已签平台价值连接到确认收入、毛利、现金生成和偿债覆盖。
