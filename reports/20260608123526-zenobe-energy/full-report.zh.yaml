  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 政策、法律和市场设计风险
        blocks:
          - type: paragraph
            body: >
              Zenobe 最大的残余风险，是英国电池市场规则变化快过其项目融资模型可吸收的速度。Competition Appeal Tribunal 文件显示，Zenobe 自己正在挑战 GEMA 2025 年和 2026
              年 LDES cap-and-floor 决定，理由是受补贴的长时储能可能扭曲竞争，挤压那些没有补贴、依靠在平衡服务、辅助服务和批发市场叠加收入的短时电池。与此同时，Zenobe 2026 年 6
              月政策备忘录称，分区定价的不确定性已经拖慢电池投资，因为债权资金方需要确信预测收入和签约购电能站得住。Ofgem 2026 年 1 月市场报告强化了宏观背景：输电约束和可再生能源增长推高了平衡成本，接入队列达到
              750GW，RIIO-3 输电支出可能大幅上升。这并不意味着 Zenobe 结构上不可融资——Clean Power 2030 仍需要大量储能，Zenobe
              已运营的构网型站点也被监管方认定有战略价值。但它说明主要下行路径由政策驱动：如果改革降低收入可见度，或在不保护短时电池经济性的情况下把市场推向补贴替代品，未来英国项目
              FID、债务条款和股权估值标记可能在储能需求本身走弱之前先恶化。
