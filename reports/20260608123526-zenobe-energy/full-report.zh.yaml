            body: >-
              具名证据集明显强于一面简单标识墙。Oxford Bus Company、Stagecoach、Cardiff Bus、Transport UK London Bus、Nottingham City
              Transport、First Bus Leeds、Arriva、Abellio、McGill’s、National Express、Transdev Blazefield 和 Ritchies
              都有公开描述的项目，细节足以把实际运营和泛泛合作语言区分开来。多个案例包含精确公交数量、充电器数量、电池条款或线路引用。Oxford 是最干净的旗舰案例：Cowley House 有 104
              辆公交，Stagecoach 的 Oxford 站点另有 55 辆，并有公开议会佐证。National Express 是最清楚的规模化关系，从 Yardley Wood 和 Coventry 车场工作推进到
              West Midlands 170 辆公交投运，随后又进入 2026 年能源采购增购。伦敦是第二强的集群，因为 Transport UK London Bus
              披露了线路数量、车队占比和车场细节。公开证据集最弱的地方不是部署是否存在，而是部署之外的证据质量：只有部分运营商提供直接引述或量化运营结果，铁路仍明显缺席当前具名证据集。
