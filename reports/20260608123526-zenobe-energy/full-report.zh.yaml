            body: >-
              Zenobe 在抓取到的当前来源集中没有披露简单的客户数时间序列，因此采用情况必须通过部署规模代理来读。这些代理仍有意义。独立融资报道把 Zenobe 平台描述为到 2026 年将在英国和爱尔兰推动超过
              2,000 辆新电动公交。在客户层面，Oxford 的 159 辆公交项目、National Express West Midlands 2025 年 170 辆公交上线、Transport UK London
              Bus 横跨 12 条 TfL 线路的 193 辆融资车辆、McGill’s 三个车场的 68 辆公交、Cardiff 首批 36 辆公交，以及 Transdev 39 辆 Harrogate
              融资，都说明业务已远远超出一次性示范站点。模式也在累积。National Express 从 Yardley Wood 的 19 辆公交起点扩展为更广泛的全国关系；Transport UK London Bus
              则在多个车场和线路上使用融资。因此，公开证据支持一个生产部署漏斗：Zenobe 赢下复杂车场项目，嵌入多年充电或电池服务，随后有时延伸到更宽的车辆、线路或电力管理范围。
