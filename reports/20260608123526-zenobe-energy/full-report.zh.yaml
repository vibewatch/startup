      - number: '5.5'
        title: 差异化、铁路邻近性和路线图
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的差异化来自架构和商业打包，而不是独特硬件。GRIDSERVE、InstaVolt 和 Moto 等公共充电网络强调充电器可达、支付和地点可用性；Zenobē 则承接电池风险、融资资产、管理车场 /
              电网集成，并加入更换和二次寿命再利用等生命周期服务。对 GoMetro 的投资强化了一个判断：Zenobē
              希望在其充电和电池堆栈之上铺出更宽的数据和车队分析层；北美领导层招聘则显示公司正并行扩张车队电动化和接入输电网的储能。[CE039] [CE040] [CE041] [CE042] [CE043] [CE044]
              [CE045] [CE046] [CE047]


              铁路是最清楚的产品边界。相邻市场中显然已有专用电池铁路技术，Hitachi Rail 的电池通勤和城际产品就是例子；但 Zenobē 当前公开核心产品仍是道路车队、电网 BESS
              和再利用电池。因此，铁路是邻近机会，而不是当前公开产品线。短期路线图在卡车充电、北美和更多构网型 BESS 部署上更清晰，而不是任何已披露的铁路电池解决方案。[CE048] [CE049] [CE050]
