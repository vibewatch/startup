      - number: '1.5'
        title: 里程碑、法律挑战和反向标记
        blocks:
          - type: paragraph
            body: >-
              里程碑记录足以作为后续章节的事实年表。它从 2016 年法律注册和 2017 年运营启动开始，随后是 2019 年更名、2022 年 2 月车队私募配售里程碑、2023 年 2 月苏格兰电池债务融资，以及
              2023 年 9 月 KKR/Infracapital 控制权交易。到 2025 年中，Zenobē 已从英国领先地位走向更大的国际项目，尤其是 Brampton 的公交电动化框架和 €325 million
              欧洲债务融资。最重要的反向标记不是运营丑闻，而是政策冲突。2025 年底，Zenobē 公开挑战 Ofgem 的长时储能计划；CAT
              文件显示，公司认为受补贴的长时项目可能扭曲竞争，压制没有支持的短时电池。法律评论和 British Hydropower Association 的介入回应也显示了这一路径的负面影响：即便挑战从 Zenobē
              角度看是理性的，它也引发了可见的行业反弹，并抛出关于投资信心、市场设计和公司政策姿态的问题。
