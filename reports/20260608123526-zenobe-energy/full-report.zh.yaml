      - number: '4.4'
        title: 公开披露缺口和反向进展
        blocks:
          - type: paragraph
            body: >-
              Zenobē 给投资者和客户提供了很多有用的公开运营信号，但还不足以支持干净的承销模型。Companies House 确认公司为私营、仍在运营，并已提交截至 2024 年 12 月 31
              日的账目；备案历史也显示了抵押和多次配股。可获得的公开记录没有用可用文本披露营业额、EBITDA、非受限现金、净债务、利息负担、契约余量，或从已签框架价值到确认收入的桥接。换句话说，债务平台规模远比偿债能力更可见。这种不对称很重要，因为公司的公开案例反复显示
              Zenobē 自行融资资产，并在 14 至 15 年期限内保证电池结果。还有至少一个与未来储能经济性相关的反向政策信号。2026 年，Local Government Lawyer 和 Ward Hadaway
              的法律评论称，Zenobē 正在挑战 GEMA 对长时储能的上限-下限支持，结果仍不确定。这不会损害当前车队合同，但说明公司更广泛储能经济性的一部分仍暴露于政策设计和诉讼，而不只是客户需求。
