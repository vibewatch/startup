      - number: '5.3'
        title: 部署工作流、充电基础设施和运维
        blocks:
          - type: paragraph
            body: >-
              Zenobē 最强的产品证据来自已经交付的运营工作流。Oxford 展示了标准模式：高压连接、充电器安装、智能充电集成、电池承保，以及建设期间持续车场运营。Nottingham
              则是在受限的保护建筑车场中执行同一打法的更难版本：Zenobē 处理电网分析、改造设计、消防抑制加装和电缆保护细节，同时保持服务运行。在澳大利亚，Leichhardt
              车场通过把太阳能、电池和电网升级与遥测驱动的充电和电池优化集成，扩展了这一架构。[CE018] [CE019] [CE020] [CE021] [CE022] [CE023] [CE024]


              卡车充电把工作流从单纯车场用例扩展出去。Cardiff 是 Zenobē 在英国的首个卡车充电项目，围绕四个可扩展的 400kW DC 充电器和智能站点电力平衡搭建。Mascot
              进一步采用场外共享充电枢纽、可再生电力、多租户容量和 EVaaS 卡车租赁。再结合 Zenobē 自己 2026
              年关于共享重型车辆充电的市场指南，这些项目显示公司正试图从私有车场电动化转向网络化重型车队基础设施；在那里，融资、电力管理和运营支持与充电器本身同样重要。[CE025] [CE026] [CE027]
