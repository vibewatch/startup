  - id: TV005
    title: 投资逻辑破裂和终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 合约收入弱于预期
        - 储能组合以市场化收入为主，车队合同缺少持久最低付款
        - 削弱基础设施式倍数支撑，并提高对波动价差的依赖
        - 从继续研究转为回避，或要求显著更低的入场定价
      - - 债务包偏紧
        - 2025 年 7 月融资的定价、担保包或契约条款留下的下行空间很小
        - 企业价值可能仍高，但股权价值会受杠杆和贷款方控制损伤
        - 按股权基础重新定价，或停止流程
      - - 车队单位经济性偏薄
        - 电动车队融资扣除 capex、电池更换和运营后回报低于标准
        - 抹掉相对上市 BESS 信托的溢价，并把增长变成资本消耗
        - 只使用资产底部估值
      - - 退出路径收窄为只能 IPO
        - 上市 BESS 折价持续，同时老股和战略买家兴趣弱
        - 减少资方变现选项，并在不确定定价下拉长持有期
        - 下调退出信心，并提高折现率
    notes: 每个触发项都绑定一个尽调事项；即便表面增长指标仍为正，它也可能迅速改变估值。
    claimRefs:
      - CV029
      - CV030
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前估值桥
        - 最新有定价股权轮、股价历史，以及任何内部或贷款方定价
        - 没有这些，公开 EV 推断无法转化为股权投资测算
        - 管理层数据室；董事会材料；投资人信件
      - - 经济性和杠杆
        - 分部 EBITDA、净债务、利息成本，以及合约收入与市场化收入拆分
        - 这些决定 £1B+ EV 是否还能留下有吸引力的股权价值
        - 经审计 2024/2025 管理账目加债务模型
      - - 优先股堆叠和控制权
        - 清算优先权、反稀释、否决权和资方治理条款
        - 决定少数股权在资本结构中的位置
        - 股权结构表、股东协议和融资条款清单
      - - 2025 年 7 月融资细节
        - €325M 债务融资的定价、期限、担保、摊还、现金清扫和契约条款包
        - 把标题式融资利好转成可用估值输入
        - 贷款方材料、融资协议、司库备忘录
      - - 客户和合同质量
        - 车队客户集中度、合同期限、续约历史和最低付款条款
        - 若要证明相对上市 BESS 基金或公开储能可比公司的溢价，需要这些证据
        - 头部客户明细和合同样本集
    notes: 最影响定价的是资本结构和现金流披露；市场规模工作次要，因为公开需求证据已经足够。
    claimRefs:
      - CV035
      - CV038
      - CV043
      - CV044
