  - id: TV003
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Zenobē 2023 年资方再资本化
        - KKR 约 £600M + Infracapital 约 £270M
        - 大额私募股权注资；联合控股资方结构；未公开投后估值
        - 最直接的私募市场参考，显示外部信心
        - 无法从已披露条款推导干净的当前股权定价
      - - Fluence Energy
        - 截至 7 Jun 2026 的公开市值
        - US$4.22B 市值
        - 对有完整披露的规模化储能平台，提供公开市场上限参考
        - 美国上市技术 / 集成商画像不同于 Zenobē 的混合车队融资模式
      - - Gresham House Energy Storage Fund 储能基金
        - Modo 2022 年快照，加上后续行业压力
        - 2022 年市值 £571M、NAV £490M、425MW；后续英国电池基金面临显著折价
        - 有用的英国电池资产底部参考
        - 被动上市信托结构，且时点数据较旧
      - - Gore Street Energy Storage Fund 储能基金
        - Tamarindo 2024 年收入评论
        - GB 市场收入走弱时，行业参与者被提及以显著折价交易
        - 显示公开市场如何给市场化收入占比较高的电池现金流定价
        - 地理多元化和基金外壳降低可比性
      - - Harmony Energy Income Trust
        - Modo 2022 年 IPO 参考
        - 213.5MW 种子组合募得 £186.5M IPO 资金
        - 较小的英国上市电池基准，可参考资产支持型资本市场准入
        - 不是像 Zenobē 那样带车队业务的运营平台
      - - 英国上市 BESS 基金组合
        - Tamarindo + Fitch 反向证据
        - 收入环境疲弱、折价显著、市场化收入占比更高，不支持激进公开市场倍数
        - 当前英国储能情绪最有力的反向映射
        - 组合映射是间接的，且不包含 Zenobē 的车队融资经济性
    enumerationScope:
      coverage: partial
      basis: >-
        Model-appropriate public references selected for Zenobē's hybrid storage-plus-fleet model; not an exhaustive
        census of all global energy-transition comps.
    notes: 可比行混合了上市公司、上市信托和近期私募交易锚点，因为 Zenobē 横跨资产支持型基础设施和服务驱动的车队电气化。
    claimRefs:
