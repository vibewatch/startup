        - 车场充电器、变电站、车辆、融资、能源管理
        - 普通乘用车 EV 需求
        - 地方政府、公交运营商、补贴机构、贷款方
        - 核心交通电气化切口
      - - 英国商业车队电气化
        - 车场充电、现场电力、车辆转型融资、能源优化
        - 公共路侧充电和私家车充电
        - 物流运营商、租赁车队、零售商、公共车队
        - 付款方池大，但受基础设施约束
      - - 英国铁路能源脱碳
        - 牵引和非牵引能源项目、车场电力、选择性柴油替代项目
        - 未绑定能源基础设施的通用机车车辆销售
        - Network Rail、列车运营商、公共交通机构
        - 相关，但难以用公开数据清晰测算规模
      - - 排除的相邻类别
        - —
        - 家庭电池、住宅 EV 充电、广泛乘用车 EV 销售、通用零售 CPO 铺设
        - 大众家庭 / 购车者
        - 工作流、预算负责人和 ROI 逻辑都不同
    notes: 边界受证据约束：纳入的类别都具有 Zenobē 式机构买家和基础设施牵引的部署步骤；排除的类别不具备这些特征。铁路一行反映公开的能源 / 排放证据，而不是仅电池口径的公开 TAM。
