      - number: '1.2'
        title: 创始人、管理层梯队和治理可见度
        blocks:
          - type: paragraph
            body: >-
              即便完整治理结构不透明，官方和合作伙伴材料对创始人的归属仍保持一致。Zenobē 公开团队页列出 Donald Weir 为首席执行官，James Basden 和 Steven Meersman
              为创始董事，Steve Holliday 为非执行主席。2023 年 KKR 交易材料还把 Nicholas Beatty
              列为第三位创始人；这很重要，因为后续融资和战略材料仍把公司描述为创始人搭建的业务，即便并非每位创始人都站在前台担任高管。Meersman 在车队融资公告和公共合作发布中尤其可见，Basden
              则出现在电网储能项目评论里。公开治理披露比管理层披露更薄：已审阅材料列出了董事长和部分高管，但没有给出完整的现任董事会名单、委员会结构、授权安排或股东控制条款。因此，创始人和高管依赖较清楚，董事会独立性和正式治理权利仍需要直接尽调材料验证。
