      - number: '4.2'
        title: 合同质量、期限和利润率驱动
        blocks:
          - type: paragraph
            body: >-
              支撑 Zenobē 收入质量的最强公开证据不是已披露的利润表，而是客户案例中可见的合同结构。Oxford Bus Company 使用 15 年电池即服务协议，把前置电池资本开支转成月费。Transport UK
              London Bus 在 193 辆融资车辆上使用 14 年充电服务和电池管理服务结构。Go-Ahead 有一项承诺融资框架，截至 2026 年 5 月已有超过 280 辆公交获得资金；Vectalia
              签署三年、最高 €120 million 的运营租赁框架，也把电池性能风险转给 Zenobē。National Express 增加了另一层变现：一项覆盖 47GWh 的两年电力管理安排，让 Zenobē
              按实时批发价买电，并把未用能源卖回电网。这些结构意味着业务有真实的经常性或准经常性现金流，但利润率取决于能否严谨定价融资成本、电池更换储备、车场建设复杂度、电价波动和基础设施运营。Yardley Wood
              很有代表性：车场电池既支持夜间充电，也在白天赚取电网服务收入，说明 Zenobē 的利润率路径同样依赖资产优化和风险转移，而不只是硬件转售。
