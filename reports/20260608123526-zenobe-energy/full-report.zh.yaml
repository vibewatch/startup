      - number: '7.2'
        title: 融资和收入模型风险
        blocks:
          - type: paragraph
            body: >
              Zenobe 已远超风险投资式融资，进入完整基础设施融资阶段。官方材料称，自 2017 年以来累计募集债务和股权超过 £2.3 billion，自 2019 年以来募集绿色债务超过 £1 billion，另有
              13 家贷款方组成的 EV 融资银团，以及 Blackhillock、Kilmarnock South、Eccles 多次项目级融资安排。这种融资深度是优势，因为它说明贷款方越来越把 Zenobe
              资产视为可银行融资；但风险画像也随之改变：回报不再只靠市场认知，而取决于债务可得性、再融资条款和稳定的资产现金流。Companies House 记录显示，2025-2026 年公司仍在持续配股；2025 年
              10 月在一项早前担保清偿后又登记了新的担保，符合主动管理资本结构的特征。市场化电价敞口仍然不小。Blackhillock 和 Eccles 的节省假设部分依靠平衡服务、约束管理和降低电价波动，而
              National Express 2026 年采购模型明确使用实时批发价，并将未使用电力转售回电网。Zenobe 通过长期债务、框架协议和电池风险转移产品来缓释，但确切契约余量、期限梯队，以及签约 EBITDA
              与市场化 EBITDA 的拆分并未公开披露。因此，投资者应把 Zenobe 当作资本密集型平台承保：其增长速度受市场设计和债务市场信任约束。
