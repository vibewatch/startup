  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和变现架构
        blocks:
          - type: paragraph
            body: >-
              Zenobē 公开材料描述的变现模式，远不止充电器安装商或车队软件供应商。公司把融资、电网连接、车场设计与建设、电力采购、充电优化、运营支持和电池再利用打包成单一车队即服务产品。在此之上，Zenobē
              明确营销按月收费的电池即服务，电池作为一项独立资产由 Zenobē
              持有、监控，并在性能衰退时更换。这带来几条收入线：车辆租赁或出租收入、电池服务费、充电和车场服务收入，以及电力管理或优化费用。公开交易案例中也有同样模式。Zenobē 2025 年 7 月欧洲债务公告提到，为
              Grupo Julià 提供 €42 million 端到端方案，覆盖车辆融资以及设计、建设、维护和充电运营。公开披露的运营规模——支持超过 3,400 辆车、122 个车场和 340MWh
              融资电池——说明这些不是只停留在试点的产品，而是可重复的商业产品。关键结论是，收入质量可能受益于长期合同，但公司是通过把大量资产、电池和交付义务留在自身资产负债表上来捕捉这种质量。
