      - number: '1.4'
        title: 运营版图、项目锚点和规模信号
        blocks:
          - type: paragraph
            body: >-
              公开网络上的规模信号有意义，但口径各不相同。Zenobē 自己的 2026 年 Our Story 页面称，公司拥有约 1,300MW 已签约储能资产，并在全球支持超过 3,400 辆电动车；2025 年 7
              月欧洲债务公告也把同一个 >3,400 辆车数字用于 120 个车场。到 2026 年 3 月，Revolv 收购公告把车场数提高到 122 个，并称已签约电池储能资产超过
              2.5GWh，显示储能规模会按语境分别用功率和电量口径报告。公开部署锚点也很具体。Brampton 宣布与 Zenobē 达成 $4 billion 框架，最多部署 1,000 辆电动公交；行业报道确认
              Blackhillock 200MW/400MWh 一期已进入商业运营，另有 100MW 预计在 2026 年上线。这些事实支持这样一种判断：Zenobē
              是一个在车队和电网服务上都有真实资产厚度的国际平台，尽管收入、估值和客户经济性披露仍有限。
