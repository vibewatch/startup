      - number: '6.5'
        title: 扩张上行真实存在，但集中度和模态多元化风险仍未解决
        blocks:
          - type: paragraph
            body: >-
              Zenobe 的扩张逻辑在地理和产品范围上都可见。地理上，客户集覆盖 London、Oxford、Coventry、Cardiff、Nottingham、Scotland、Yorkshire 和 New
              Zealand。商业上，落地后扩张动作在车场电动化延伸到更广线路融资、二次寿命储能或电力采购时最清楚。National Express 是最佳例子，Transport UK London Bus
              也是一个例子。但对投资者重要的集中度问题仍未解决。公开证据集仍高度集中在英国公交和伦敦线路运营商，这一细分受公共补贴、议会经济性和交通主管机构采购共同影响时点和胜率。针对铁路运营商、长途客车或其他交通模态的公开证据，在本轮当前
              URL 抓取中没有达到可比深度。这不意味着管线不存在；它意味着公开客户证据仍以公交为中心。因此，最强的短期正面洞见是：Zenobe
              有可重复的公交车队打法；最强的开放风险是：公开记录还没有显示收入基础在运营商、模态和续约队列之间到底有多分散。
