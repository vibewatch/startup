  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调追问
    rows:
      - - 电池成本下降和长时储能系统
        - 驱动
        - 当前至 2030 年
        - 提升公用事业级储能竞争力，并拓宽应用场景
        - 压测时长假设和扩容资本开支
      - - 英国官方口径：到 2030 年需要 23-27GW 电网级电池
        - 驱动
        - 当前至 2030 年
        - 政策仍要求储能大幅增建
        - 跟踪改革周期后官方区间是否变化
      - - Elexon 灵活性市场管线和资产注册
        - 驱动
        - 2026-2027
        - 可扩大电池参与范围，并提高变现透明度
        - 确认落地里程碑和参与方采用率
      - - 公交补贴搭配私人资本
        - 驱动
        - 2025-2027
        - 为车场和车队转型项目创造明确买方预算
        - 盘点哪些主管部门有可重复的后续资金
      - - 卡车 / 厢式车补贴加车场充电支持
        - 驱动
        - 2026 年以后
        - 降低重型车队电动化前期门槛
        - 对照补贴领取与车场实际通电情况
      - - 电池排队容量相对官方需求过剩
        - 约束（反向）
        - 当前至 2030 年
        - 可能压缩市场化收益，并带来流失风险
        - 跟踪 Gate 2 后报价接受率和项目退出
      - - 平衡成本波动和未完成的市场设计
        - 约束（反向）
        - 当前至 2027 年
        - 收入组合仍受政策和调度影响
        - 建模 BM、备用和批发价差的下行情景
      - - 车场并网延迟
        - 约束（反向）
        - 当前至中期
        - 即便车辆资金到位，也可能拖慢公交和 HGV 推广
        - 测量目标车场实际并网周期
      - - 小型和农村运营商经济性
        - 约束（反向）
        - 当前至中期
        - 可能限制密集城市线路和大型车队以外的电动化
        - 按区域评估共享枢纽、租赁或融资方案
      - - 铁路数据稀疏和基础设施报告滞后
        - 约束
        - 当前至中期
        - 公开证据太薄，无法形成清晰的铁路电池专项 TAM
        - 索取线路级柴油替代和车场资本开支计划
    notes: 时点反映该因素可能影响部署和估值的时间，不是精确政策截止日。反向行被明确列出，因为本章证据门槛要求保留下行证据，而不只是看多的市场增长主张。
