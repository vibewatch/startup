    年已注册成立。公司为公交、卡车和其他车队融资、持有并运营电网级电池储能资产和电动化项目，把车辆或电池融资、充电基础设施、电力采购、优化软件和二次寿命电池服务打包在一起。KKR 和 Infracapital 于 2023
