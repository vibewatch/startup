      - number: '5.2'
        title: 软件、控制和资产架构
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的软件和控制层在公开资料中只露出轮廓，但各来源呈现的模式一致。Hekaton 被定位为客户运营的实时车队管理层；电池健康数据通过遥测和外部验证的健康状态算法流动；Portsmouth
              Innovation Centre 则在推广前测试充电器、车辆和软件组合。结果是一套面向车队和车场运营的控制系统，而不是对外开放开发者平台或公共 API。[CE005] [CE006] [CE009]
              [CE014] [CE015]


              同样的编排思路也出现在电网侧。Blackhillock 和 Kilmarnock 不是简单接入电网的储能箱；Zenobē 将它们描述为由软件调度的稳定性资产，把构网型逆变器、ESS
              硬件、入市交易和优化能力结合起来，交付多种服务。公开材料称该组合可以叠加 13 项电网服务，这强烈暗示 Zenobē 的护城河在跨资产优化和调度逻辑，而不是自研化学体系或充电器硬件。[CE030] [CE031]
              [CE033] [CE035] [CE036] [CE037]
