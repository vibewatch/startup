      - number: '7.5'
        title: 治理和执行风险
        blocks:
          - type: paragraph
            body: >
              治理已经成熟，但不能消除关键人或利益一致性风险。Zenobe 2023 年股权轮引入 KKR 约 £600 million，以及 Infracapital 进一步约 £270
              million，使两者成为联合多数股东，JERA 和 TEPCO 保留为少数战略投资者。Companies House 现在显示董事会和高管梯队更宽，包括 CEO Donald Weir、CFO Iain
              Wetherall、创始董事 James Basden 和 Steven Meersman，以及 Andy Matthews、Shreya Malik 等投资方关联董事。申报历史还显示，联合创始人
              Nicholas Beatty 于 2024 年 10 月离开董事会，2024 年和 2025
              年仍有新董事任命。对于一家依赖反复举债和跨境执行的公司，这比纯创始人治理模型更健康。残余风险在于利益一致性和接班：Zenobe
              现在同时扩张英国储能、欧洲车队租赁和更新的北美野心，而公开材料没有披露保留事项、客户集中度阈值，或创始人与新任高管的接班规划。投资者基础有利于获取资本和纪律约束，但也带来一种可能：增长节奏、杠杆容忍度和退出时点，更多受资方预期支配，而不只是技术准备度。治理透明度已经提高，但对于承保多年扩张的投资者来说仍不完整。
