  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层仍以公交为主，并与公共部门相连
        blocks:
          - type: paragraph
            body: >-
              本轮 Zenobe 的公开客户证据由公交运营商主导，而不是铁路运营商；买方经济性也受公共政策、地方政府资金或交通主管机构线路结构影响。具名客户横跨 National Express、Go-Ahead/Oxford
              Bus Company、Stagecoach、First Bus 和 Arriva 等全国性集团；Transport UK London Bus 和 Abellio 等伦敦线路运营商；Cardiff
              Bus、Nottingham City Transport 和 McGill’s 等区域及市政运营商；以及一个国际公交运营商——新西兰
              Ritchies。这说明公交内部确有广度，但模态视角仍窄。买方、用户和付款方角色也被拆碎。在 Oxford 和 Nottingham，议会和 ZEBRA
              资金帮助资助资产基础，运营商负责跑服务。在伦敦，即使直接合同对手方是运营商，TfL 线路经济性仍重要。分层结论是，Zenobe
              不只是卖充电器：它通常是在公共部门经济性重要的公交车队中销售资本结构、电网风险转移和运营保障。
