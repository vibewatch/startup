      - 类别
      - 公开规模或融资信号
      - 目标客户 / 任务
      - 公开差异化
      - 相比 Zenobē 的公开局限
    rows:
      - - Zenobē
        - 全栈储能 + 车队电动化专营商
        - 122 个车场；>3,400 辆 EV；已融资 340MWh；2024 年宣布新增融资 £410m
        - 公交、长途客车、卡车和车场运营商；需要所有者-运营商能力的储能项目
        - 在一份合同里打包融资、电池风险转移、充电优化和梯次利用
        - 公开定价不透明，规模小于老牌公用事业公司
      - - Centrica Business Solutions
        - 公用事业公司背书的老牌企业 / 表后集成商
        - 英国 / 爱尔兰 9,500+ 个现场能源发电安装项目；200 年能源历史；零 CAPEX 融资选项
        - 重视韧性和现场能源经济性的大型工业及公共部门组织
        - 资产负债表、融资、O&M、微电网和 24/7 监控能力强
        - 面向车队的公开软件深度弱于 Zenobē
      - - 竞品：EDF power solutions / Pivot Power
        - 公用事业公司背书的储能 + EV 电力基础设施老牌企业
        - 最高 3GW 电池储能组合；最多 40 个战略性高压接入点
        - 公共充电、公交车场、厢式车、卡车、HGV 枢纽、电网级储能
        - 输电网接入电力，加上市场化路径和储能开发
        - 公开车队运营层细节少于 Zenobē 的完整车场方案
      - - Nuvve
        - V2G / 车队软件和能源服务邻近玩家
        - 上市公司式定位；安装并运营 BESS；24/7 VPP 变现和双向充电
        - 追求 V2G 增量收益的校车、市政、公共部门和 C&I 场址
        - V2G 和场址级变现叙事强
        - Zenobē 式融资和完整车场规模化交付的证据更少
      - - GridBeyond
        - 优化和融资型现场储能替代方案
        - 24/7 运营中心；AI 平台；无前期成本的融资型储能方案
        - 需要电池优化、灵活性收入和 EV 车队管理的资产所有者与能源用户
        - AI 驱动的优化、交易，以及闲置资产创收
        - 未体现 Zenobē 面向公交的融资和电池管理封装
      - - Connected Energy + Forsee Power
        - 梯次利用储能邻近玩家
        - 5MWh Connected 设施在建；£2m 补贴；首个 2.5MWh 英国合作系统；Forsee 称已装备 >4,200 辆公交
        - 寻求用退役 EV 电池做低成本储能的所有者或开发商
        - 直接冲击梯次利用成本优势和公交电池供应入口
        - 仍是单层方案专家，不是完整 Zenobē 合同替代品
      - - EO Charging / Pod
        - 车场充电软件 + 服务竞品
        - '>80 家充电点供应商集成；>99.5% 在线率目标；24/7/365 支持；现由 Pod/EDF 能源管理栈背书'
        - 需要车场充电、充电桩管理和能源管理的商用车队
        - 充电桩无关软件和车场运营能力强
        - 电池融资和梯次利用经济性的公开证据较弱
      - - 充电供应商：Heliox / Siemens eMobility
        - 工业级充电基础设施进入者
        - Heliox 称每天为 150+ 个城市的 25,000+ 辆车供电；Siemens 提供车场硬件、软件和 24/7 支持
        - 需要工业供应商的公交、卡车、车场和公共充电买方
        - 车场硬件、软件和服务深度可信
        - 主要偏硬件服务，不是 Zenobē 式融资专家
      - - SWARCO
        - 智能充电邻近玩家
        - 公开车队页面重宣传册，轻规模证据
        - 商用车队和电动公交充电买方
        - 有聚焦商用车队智能充电的证据
        - 融资、储能所有权或运营规模的公开细节非常有限
    notes: 行覆盖本次审阅中证据最强的英国 / 欧盟同行和邻近玩家；并非穷尽全部竞品。
