      - CV034
  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含 EV 区间（£m）
      - 估值逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - 欧洲车队融资快速放量，Blackhillock 类资产变现良好，合约收入压过市场化波动
        - 1500-2100
        - 基础设施式资方退出，并因车队可选性和执行验证获得溢价
        - 需要强劲分部利润率和温和债务条款
        - 可能成立，但需要私下尽调支撑
      - - 基准
        - 现有规模真实，债务通道保持开放，但公开披露仍不足，英国收入环境仍然复杂
        - 1000-1500
        - 资方股权、债务能力和经营版图支撑方向性 EV 区间，但不声称精确股权价值
        - 仍易受未披露杠杆和合同质量弱点影响
        - 从当前公开证据看最站得住脚
      - - 悲观
        - 市场化收入疲弱持续，债务被证明昂贵或限制多，车队经济性低于预期
        - 700-950
        - 一旦公开市场储能压力主导叙事，价值会压向资产支持型底部
        - 如果优先股堆叠厚或 EBITDA 偏弱，结果可能更差
        - 在经济性披露前，下行情景可信
    notes: 情景区间是以公开证据和行业环境锚定的企业价值估计，不是管理层指引，也不是谈判交易区间。
    claimRefs:
