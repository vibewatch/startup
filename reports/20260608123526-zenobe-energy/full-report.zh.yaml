  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和纳入支出
        blocks:
          - type: paragraph
            body: >-
              Zenobē 的相关市场应定义为两类支出：一是灵活、并网电池，二是把电力可得性、融资和能源优化纳入产品一部分的重型交通电动化系统。因此，纳入支出包括公用事业级 BESS
              开发、持有和优化；零排放公交车队转型项目和车场；商用车队车场充电和现场电力基础设施；以及用电池、充电或车场电力减少柴油依赖的铁路牵引或非牵引能源项目。排除支出包括家用电池、乘用车充电、通用零售充电点运营和广义乘用
              EV 销售，因为这些买方、资金线和运营流程与 Zenobē
              的机构买方群体明显不同。现状替代品也随细分市场而变：电网服务中是调峰电厂和火电灵活性，公交和卡车中是柴油车队，未电气化铁路上则是柴油牵引。这一边界很重要，因为最佳公开证据仍按子市场碎片化。更可支撑的做法不是给出一个虚高的混合
              TAM，而是组合几个受约束的视角，并把排除项说清楚。
