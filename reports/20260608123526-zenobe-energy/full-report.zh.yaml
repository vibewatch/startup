      - number: '5.4'
        title: 信任、安全和合规
        blocks:
          - type: paragraph
            body: >-
              公开信任和安全证据可信但不完整。正面来看，Zenobē 确实发布了具体的电池处理步骤、性能保证、消防抑制改造和实时车场电缆保护措施；其电网资产也绑定到 NESO Stability Pathfinder
              结构，这类结构存在的原因正是化石时代稳定性服务需要清洁替代。Blackhillock 发布材料明确把该站点定位为全球首个向 NESO 提供 Stability Services 的电池，NESO 自己的
              phase-2 材料也印证了更广泛的构网型电池框架。[CE008] [CE010] [CE011] [CE021] [CE030] [CE038]


              信任表面较弱的一环是软件保证。Zenobē 谈到自研软件、数据分析和优化，但公开来源集没有披露产品特定网络安全认证、公开可用性
              SLA、软件文档或正式电池安全认证框架。这并不能证明内部没有这些控制；但确实意味着外部用户无法凭公开材料独立评估它们。产品越来越依赖跨充电器、电池、入市调度和车队运营的软件协同，这一点因此很重要。[CE006]
              [CE051]
            claimRefs:
              - CE006
