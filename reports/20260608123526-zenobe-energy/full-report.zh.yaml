      - number: '3.4'
        title: 护城河耐久性：集成有帮助，但英国储能压力压缩容错
        blocks:
          - type: paragraph
            body: >-
              Zenobē
              的护城河在融资、电池性能保证、电网连接工作、充电优化和二次寿命再利用被打包进一份合同时最强。车队或电池站点投运后，这会形成切换成本，因为客户不再只是在选充电器或软件；它还在选择谁承担电池风险、谁管理电力采购、谁享有二次寿命价值。问题在于，这条护城河所处市场的回报正变得更拥挤。ESS
              News 报道，英国 2026-27 T-1 容量拍卖以 GBP 5 per kW-year 出清，为 2020 年以来最低的 T-1 水平；Elgar Middleton
              也称新容量使市场饱和，辅助服务收入被侵蚀。商业化环境收紧时，买方和融资方可能更偏好具备入市路径能力或公用事业式资产负债表的提供商。这把压力推向 EDF、Centrica、Pod/EO
              以及其他专业公司联盟。承销含义是：Zenobē 不需要输给一个完美克隆者；只要既有玩家和点解决方案让其集成溢价显得可选，它就可能一层一层丢掉经济性。
