  evidenceGaps:
    - type: missing-source
      severity: material
      topic: refinancing-covenants
      missingEvidence: "The full security package, pricing, tenor, amortisation schedule and covenant set behind charge 104362490011 and current project debt facilities."
      whyItMatters: "Without covenant and maturity detail, it is impossible to judge refinance risk, interest coverage resilience, or sponsor support requirements under a weaker revenue case."
      diligencePath: "Request charge instrument 104362490011, lender term sheets, hedge policy, and an asset-by-asset debt maturity schedule from management."
      relatedQuestionRefs: [QR003, QR004]
    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: "Asset-level split between contracted stability revenues, merchant balancing revenues, wholesale trading and fleet-service earnings."
      whyItMatters: "Public sources show multiple revenue streams but do not disclose how much of EBITDA is exposed to market volatility, which is central to underwriting leverage and policy risk."
      diligencePath: "Request site-level revenue stacks, contract tenors, DSCR sensitivities and downside cases under market-design changes."
      relatedQuestionRefs: [QR009]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: "Customer-level revenue concentration, drawdown schedules, and renewal exposure across Go-Ahead, National Express, Vectalia and other large operators."
      whyItMatters: "Breadth of logo coverage does not reveal how much revenue depends on a few operators, franchises or local-authority funding cycles."
      diligencePath: "Ask for top-10 customers by revenue, contracted vehicles and gross margin, plus public-subsidy exposure by customer."
      relatedQuestionRefs: [QR019]
    - type: private-evidence-only
      severity: material
      topic: supplier-concentration
      missingEvidence: "Portfolio-wide concentration by battery OEM, inverter supplier, EMS provider, EPC and route-to-market partner."
      whyItMatters: "Zenobe describes itself as technology agnostic, but public evidence only confirms site-level stacks and does not show whether hidden single-vendor concentration exists across the full portfolio."
      diligencePath: "Request supplier concentration schedules, approved-alternative lists, spare-part strategy and single-vendor failure scenarios."
      relatedQuestionRefs: [QR026]
    - type: private-evidence-only
      severity: material
      topic: succession-planning
      missingEvidence: "Succession plans, reserved matters, retention packages and board-committee mandates for founders and newer senior executives."
      whyItMatters: "Institutional ownership lowers some governance risk, but the public record still does not show how Zenobe would handle a founder departure, sponsor disagreement or CFO transition during rapid expansion."
      diligencePath: "Request governance papers, succession documentation, committee charters and board approval thresholds under the current shareholder agreement."
      relatedQuestionRefs: [QR029]
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-risk-enumeration
      missingEvidence: "A complete register of all live planning, fire-authority, insurer and environmental-permitting conditions across Zenobe's existing and planned UK BESS sites."
      whyItMatters: "The public record is rich for the largest and newest sites but does not fully enumerate every active regulatory or planning condition that could affect timing, cost or insurability."
      diligencePath: "Build a site-by-site regulatory matrix from planning files, insurer requirements, environmental permits and legal counsel summaries."
      relatedQuestionRefs: [QR014]
      relatedTableRefs: [TR001]

