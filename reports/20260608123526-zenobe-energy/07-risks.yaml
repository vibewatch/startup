schemaVersion: "report-v2"
artifact: risks
slug: zenobe-energy
runDate: "2026-06-08"
company:
  name: "Zenobe Energy"
chapter:
  number: 7
  title: Risks
  summary: >
    Zenobe Energy's sharpest residual risk is not customer demand but the combination of debt-funded scale-up and
    unstable UK battery-market design. The company has proven an ability to raise project debt and equity at scale,
    but legal disputes over LDES subsidy design, zonal-pricing uncertainty, and dependence on stacked grid-service
    revenues create the clearest path to a financing slowdown. Fire/safety and permitting risks look manageable but
    remain material as the pipeline broadens into multiple new 300MW-class sites.
sections:
  - id: policy-legal-and-market-design-risk
    title: Policy, legal, and market-design risk
    body: >
      Zenobe's largest residual risk is that UK battery market rules change faster than its project-finance model can
      absorb. Competition Appeal Tribunal filings show Zenobe is itself challenging GEMA's 2025 and 2026 LDES
      cap-and-floor decisions, arguing that subsidised long-duration storage could distort competition against
      unsupported short-duration batteries that rely on revenue stacking across balancing, ancillary, and wholesale
      markets. At the same time, Zenobe's own June 2026 policy note says zonal-pricing uncertainty is already
      slowing battery investment because debt providers need confidence in forecast revenues and contracted offtakes.
      Ofgem's January 2026 market report reinforces the macro backdrop: balancing costs have risen with transmission
      constraints and renewable growth, the connections queue reached 750GW, and RIIO-3 transmission spending could
      rise dramatically. This does not mean Zenobe is structurally unfinanceable—Clean Power 2030 still needs large
      volumes of storage, and Zenobe already operates grid-forming sites that regulators say are strategically useful.
      But it does mean the main downside path is policy-led: if reform reduces revenue visibility or tilts the market
      toward subsidised alternatives without protecting short-duration battery economics, future UK project FIDs,
      debt terms, and equity marks could deteriorate before demand for storage itself weakens.
    claimRefs: [CR015, CR016, CR017, CR018, CR019, CR020, CR021, CR022, CR023]
    tableRefs: [TR001]
    figureRefs: [FR001]

  - id: financing-and-revenue-model-risk
    title: Financing and revenue-model risk
    body: >
      Zenobe has moved well beyond venture-style funding into full infrastructure finance. Official company materials
      cite more than £2.3 billion of debt and equity raised since 2017, more than £1 billion of green debt raised
      since 2019, a 13-lender EV financing syndicate, and repeated project-level facilities for Blackhillock,
      Kilmarnock South, and Eccles. That funding depth is a strength because it shows lenders view Zenobe's assets as
      increasingly bankable, but it also changes the risk profile: returns now depend on debt availability,
      refinancing terms, and stable asset cash flows rather than on market awareness alone. Companies House records
      show continuing share allotments through 2025-2026 and a new security charge registered in October 2025 after
      satisfaction of an earlier charge, consistent with an actively managed capital structure. Merchant exposure also
      remains meaningful. Blackhillock and Eccles savings assumptions rely partly on balancing services, constraint
      management, and price volatility reduction, while National Express's 2026 procurement model explicitly uses live
      wholesale prices and resells unused power back to the grid. Zenobe mitigates this through longer-term debt,
      framework agreements, and battery-risk-transfer products, but exact covenant headroom, tenor ladders, and the
      split between contracted and merchant EBITDA are not publicly disclosed. Investors should therefore underwrite
      Zenobe as a capital-intensive platform whose growth rate is constrained by market design and debt market trust.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR009, CR010, CR011, CR012, CR013, CR014, CR028, CR042, CR043, CR044, CR049, CR050, CR052]
    figureRefs: [FR002]

  - id: safety-permitting-and-technology-risk
    title: Safety, permitting, and technology risk
    body: >
      Operational risk is manageable but not trivial because Zenobe is scaling lithium-ion BESS assets at a pace the
      safety framework is still catching up with. NFCC's battery-storage position statement says the UK's transition is
      outpacing safety standards and regulation, and warns that lithium-ion failures can create thermal runaway,
      toxic and explosive vapours, multi-day fires, and reignition risk. Government guidance likewise says the health
      and safety landscape for grid-scale BESS is complex and requires integrated design, emergency response, and
      lifecycle management, while DSEAR imposes clear duties around dangerous substances, control measures, and
      emergency procedures. Zenobe's own posture is stronger than average: it cites ISO 45001 certification, zero-harm
      objectives, and site-level fire-water storage or containment provisions for Hawthorn Pit and Little Horsted.
      Yet those mitigants reduce severity rather than remove it. The technology risk is broader than fire: Zenobe's
      own fleet guidance says bus batteries normally require replacement below 70% state of health, current warranties
      are roughly eight years, and poorly managed fleets may require two replacements over vehicle life. Zenobe's
      second-life and battery-managed-service models help preserve residual value and transfer some replacement risk
      from operators, but they depend on accurate degradation forecasting and continued demand for repurposed packs.
      Investors should therefore treat safety and obsolescence as compounding risks on a larger installed base, not as
      one-off engineering exceptions.
    claimRefs: [CR029, CR030, CR031, CR032, CR033, CR034, CR035, CR036, CR037, CR038, CR039, CR040, CR041, CR051]
    tableRefs: [TR002]

  - id: partner-customer-and-counterparty-risk
    title: Partner, customer, and counterparty risk
    body: >
      Zenobe markets itself as technology agnostic, but individual assets still depend on a narrow counterparty stack.
      Blackhillock combines Wärtsilä battery technology and software, SMA grid-forming inverters, SSEN grid
      connection, and EDF route-to-market services. Kilmarnock South depends on Wärtsilä, Omexom, EDF, and Kraken for
      hardware, balance-of-plant, trading, and dispatch. Those are sensible specialist choices, but they create
      concentrated execution paths at the site level. Customer exposure is more diversified by logo than by end-market.
      Zenobe works with roughly 90% of major UK bus companies and powers about 25% of the UK e-bus market, which
      limits single-name concentration but still concentrates demand within regulated public transport and local-budget
      cycles. Frameworks with Go-Ahead, Vectalia, and National Express show the model can scale across operators: the
      Go-Ahead facility has funded more than 280 buses from four OEMs, the Vectalia agreement transfers battery health
      risk to Zenobe, and National Express's two-year procurement model gives Zenobe authority over 47GWh of renewable
      power under live wholesale pricing. Even so, public sources do not disclose customer-level revenue shares,
      portfolio-wide supplier concentration, or exact contract tenors by route-to-market provider. The result is a risk
      profile that is diversified relative to an early-stage startup, but still dependent on a concentrated set of
      financing, dispatch, hardware, and public-transport counterparties.
    claimRefs: [CR003, CR024, CR025, CR026, CR027, CR028, CR042, CR043, CR044, CR045, CR046, CR049]
    tableRefs: [TR003]
    figureRefs: [FR003]

  - id: governance-and-execution-risk
    title: Governance and execution risk
    body: >
      Governance has matured, but that does not eliminate key-person or alignment risk. Zenobe's 2023 equity round
      brought in c.£600 million from KKR and a further c.£270 million from Infracapital, leaving the pair as joint
      majority shareholders with JERA and TEPCO retained as minority strategic investors. Companies House now shows a
      broader board and officer bench, including CEO Donald Weir, CFO Iain Wetherall, founder-directors James Basden
      and Steven Meersman, and investor-linked directors such as Andy Matthews and Shreya Malik. Filing history also
      shows that co-founder Nicholas Beatty left the board in October 2024, while new director appointments continued
      in 2024 and 2025. That looks healthier than a founder-only governance model, especially for a company reliant on
      repeated debt raises and cross-border execution. The residual risk is alignment and succession: Zenobe is now
      trying to scale UK storage, European fleet leasing, and newer North American ambitions simultaneously, while its
      public materials do not disclose reserved matters, customer concentration thresholds, or succession planning for
      founders and newer senior executives. The investor base is an advantage for capital access and discipline, but it
      also raises the possibility that growth pace, leverage tolerance, and exit timing become governed more by sponsor
      expectations than by purely technical readiness. Governance transparency has improved, but it remains incomplete
      for an investor underwriting multi-year expansion.
    claimRefs: [CR012, CR013, CR014, CR045, CR046, CR047, CR048, CR050]
    tableRefs: [TR004, TR005]

callouts:
  - calloutType: risk
    title: "The main thesis risk is policy certainty, not battery demand"
    body: >
      Zenobe's demand backdrop is favorable, but debt underwriting for GB battery projects still depends on market
      rules that are in flux. The combination of zonal-pricing uncertainty and Zenobe's own litigation against the
      LDES cap-and-floor regime makes policy design the clearest path to a negative repricing.
    claimRefs: [CR018, CR019, CR020, CR021, CR022, CR023]

  - calloutType: risk
    title: "Leverage is acceptable only while revenue stacks stay financeable"
    body: >
      Zenobe has repeatedly proven access to lenders, but the model now depends on continued debt availability and on
      merchant or semi-contracted revenues remaining predictable enough for new facilities to clear. A financing shock
      would likely hit project cadence before customer adoption weakens.
    claimRefs: [CR001, CR006, CR007, CR010, CR011, CR014, CR050]

  - calloutType: risk
    title: "Battery fire risk is low frequency, but portfolio-level severity is high"
    body: >
      NFCC and government guidance show that grid-scale lithium-ion BESS incidents can create hard-to-extinguish fires,
      toxic vapours, and environmental runoff issues. Zenobe has meaningful mitigations, but a single major incident or
      tighter permitting regime could raise insurance, capex, and timeline risk across multiple future sites.
    claimRefs: [CR030, CR031, CR032, CR033, CR034, CR035, CR051]

  - calloutType: recommendation
    title: "Priority diligence asks: charge 0011, revenue mix, fire plans, and board reserved matters"
    body: >
      Before underwriting new capital, investors should request the October 2025 charge documentation and covenant
      package, the asset-level split between contracted and merchant revenues, site-specific emergency and insurer
      requirements for new UK projects, and the board's reserved-matters and succession framework under joint-majority
      ownership.
    claimRefs: [CR011, CR018, CR033, CR047, CR048]

