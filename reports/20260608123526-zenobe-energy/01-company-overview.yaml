- id: TO005
  title: Public disclosure and diligence gaps table
  columns:
  - Missing item
  - Current public evidence
  - Why it matters
  - Exact diligence path
  rows:
  - - Exact post-2023 ownership split and governance rights
    - Public sources say KKR and Infracapital are joint majority shareholders but do not disclose percentages or rights.
    - Control, exit leverage, and downside economics cannot be assessed without the underlying terms.
    - Request the cap table, shareholder agreement, board-reserved matters, and any side letters.
  - - Current valuation
    - The 2023 control transaction did not publish a valuation in retained sources, and later debt/project sources did not
      update one.
    - Later valuation work needs a defensible entry point rather than guesswork from debt or project scale.
    - Request the latest financing memo, internal valuation mark, and any fairness or board materials.
  - - Revenue / run-rate and customer concentration
    - Public materials highlight projects, vehicles, and storage assets rather than revenue, ARR, or concentration.
    - Underwriting quality depends on monetization, concentration, and contract durability rather than asset headlines alone.
    - Request management accounts, booked revenue by business line, and top-customer concentration.
  - - Current headcount and regional mix
    - Public disclosures moved from >230 FTEs in 2023 to >380 in 2026 without a precise current figure or geography split.
    - Headcount is a key proxy for burn, operating leverage, and delivery footprint.
    - Request an HR census showing FTEs, contractors, and geography at the run date.
  - - Full board roster and committee structure
    - Reviewed sources identify the CEO, founders, chairman, and some executives but not the full board or committees.
    - Board independence, control dynamics, and risk oversight remain unclear.
    - Request the current board list, committee charters, and delegated authorities matrix.
  notes: This table is intentionally gap-forward so later chapters do not overstate precision when public evidence is incomplete.
