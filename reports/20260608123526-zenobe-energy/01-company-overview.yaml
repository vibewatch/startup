- id: milestones-and-adverse-markers
  title: Milestones, legal challenges, and adverse markers
  body: 'The milestone record is strong enough to serve as later chapters’ chronology of record. It starts with 2016 legal
    incorporation and 2017 operating launch, then moves through the 2019 renaming, the February 2022 fleet private-placement
    milestone, the February 2023 Scottish battery debt financing, and the September 2023 KKR/Infracapital control transaction.
    By mid-2025 Zenobē had moved from UK leadership into larger international projects, notably Brampton’s transit-electrification
    framework and the €325 million European debt facility. The most important adverse marker is not an operating scandal but
    policy conflict. In late 2025 Zenobē publicly challenged Ofgem’s long-duration energy-storage scheme, and CAT filings
    show the company arguing that subsidised long-duration projects could distort competition against unsupported short-duration
    batteries. Legal commentary and the British Hydropower Association’s intervention response show the downside of that approach:
    even if the challenge is rational from Zenobē’s perspective, it also created visible sector backlash and raised questions
    about investment confidence, market design, and the company’s policy posture.'
