- id: capital-and-shareholder-structure
  title: Capital formation, shareholder structure, and debt capacity
  body: Capital formation is one of the clearest reusable facts for later chapters. On 7 September 2023 Zenobē announced c.£600
    million from KKR plus a further c.£270 million from Infracapital, with KKR and Infracapital becoming joint majority shareholders
    and JERA plus TEPCO Power Grid remaining minority strategic holders. KKR separately said this was the first investment
    through its global climate strategy, underscoring how the transaction functioned as both a financing event and a strategic
    endorsement of Zenobē’s fleet-electrification and battery-storage platform. The public record is also unusually explicit
    about debt. Zenobē’s July 2025 announcement said it reached financial close on a €325 million debt facility for European
    fleet electrification, while earlier company materials referenced a February 2022 fleet private placement and a 2023 Scottish
    battery debt package. What remains missing is the exact post-deal ownership split, any valuation attached to the 2023
    control transaction, and a full reconciliation between company-claimed aggregate capital raised and directly disclosed
    instruments.
