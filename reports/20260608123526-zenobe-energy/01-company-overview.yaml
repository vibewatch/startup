company:
  name: Zenobe Energy
chapter:
  number: 1
  title: Company Overview
  summary: Zenobē is a London-headquartered private energy-transition company whose legal entity was incorporated in 2016
    but whose own materials say operations began in 2017. The strongest public evidence shows a business spanning grid-scale
    battery storage and fleet electrification, with KKR and Infracapital becoming joint majority shareholders after a September
    2023 c.£870 million equity package and Zenobē closing a €325 million European fleet debt facility in July 2025. Public
    scale markers include c.1,300MW of contracted storage assets, more than 3,400 supported electric vehicles, the Brampton
    transit partnership, and the Revolv acquisition, while exact valuation, revenue, board rights, and ownership split remain
    unresolved.
sections:
- id: identity-and-business-model
  title: Identity, headquarters, and business model
  body: 'Zenobē should be treated as a London-headquartered private energy-transition company whose legal and operating histories
    start at slightly different points. Companies House shows Zenobe Energy Limited was incorporated on 19 October 2016 and
    renamed from Battery Energy Storage Solutions Limited in March 2019, while company materials say Zenobē ‘began in 2017’.
    Later chapters should preserve that distinction rather than flattening it into a single founding date. Current official
    positioning is clearer than the early legal nomenclature: Zenobē says it designs, finances, builds and operates battery
    solutions across electric fleets, network infrastructure, and second-life battery applications. The homepage defines electric
    fleets as end-to-end electrification including charging infrastructure, battery replacement, and software, while network
    infrastructure is framed as large-scale battery storage serving the grid. Zenobē is therefore best understood as a capital-intensive
    operator and financing platform spanning transport electrification and grid services, not as a pure software or hardware
    vendor.'
