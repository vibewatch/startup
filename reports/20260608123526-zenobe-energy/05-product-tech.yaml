- id: software-control-and-asset-architecture
  title: Software, Control and Asset Architecture
  body: >-
    Zenobē’s software and control layer is public only in outline, but the pattern is consistent across
    sources. Hekaton is presented as the real-time fleet-management layer for customer operations; battery
    health data flows through telematics and an externally validated state-of-health algorithm; and the
    Portsmouth Innovation Centre exists to test charger, vehicle and software combinations before rollout.
    The result is a control system aimed at operating fleets and depots rather than exposing a developer
    platform or public API. [CE005] [CE006] [CE009] [CE014] [CE015]


    The same orchestration mindset appears on the grid side. Blackhillock and Kilmarnock are not just
    energy boxes connected to the grid; Zenobē describes them as software-mediated stability assets that
    combine grid-forming inverters, ESS hardware, route-to-market trading and optimisation expertise to
    deliver multiple services. Public materials say the portfolio can stack 13 grid services, which is
    a strong clue that Zenobē’s moat sits in cross-asset optimisation and dispatch logic rather than proprietary
    chemistry or charger hardware. [CE030] [CE031] [CE033] [CE035] [CE036] [CE037]
  claimRefs:
