callouts:
- calloutType: strength
  title: Zenobē’s moat is product packaging, not battery chemistry
  body: The company repeatedly monetises the same core capability — taking battery lifecycle risk, software-driven
    optimisation and power-market complexity away from operators — across buses, trucks and transmission-connected
    batteries.
  claimRefs:
  - CE002
  - CE007
  - CE037
  - CE042
- calloutType: risk
  title: Public software assurance is thin
  body: Zenobē clearly has meaningful software inside its offering, but reviewed materials do not expose
    product-specific cyber controls, public uptime SLAs or technical documentation, which makes external
    diligence on resilience harder than on the physical infrastructure side.
  claimRefs:
  - CE006
  - CE051
- calloutType: insight
  title: Rail is adjacent, not core
  body: Zenobē has battery, telemetry and electrification know-how that could travel into rail, but its
    current public product surface still clusters around road fleets, grid batteries and second-life reuse
    rather than a disclosed rail battery product.
