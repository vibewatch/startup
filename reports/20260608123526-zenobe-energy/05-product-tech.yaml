- id: trust-safety-and-compliance
  title: Trust, Safety and Compliance
  body: >-
    Public trust and safety evidence is credible but incomplete. On the positive side, Zenobē does publish
    specific battery-handling steps, performance guarantees, fire-suppression retrofits and cable-protection
    measures at live depots, and its grid assets are tied to NESO Stability Pathfinder structures that
    exist precisely because fossil-era stability services need clean replacements. Blackhillock’s launch
    materials explicitly position the site as the first battery in the world delivering Stability Services
    to NESO, and NESO’s own phase-2 materials corroborate the broader grid-forming battery framework.
    [CE008] [CE010] [CE011] [CE021] [CE030] [CE038]


    The weaker part of the trust surface is software assurance. Zenobē talks about proprietary software,
    data analysis and optimisation, but the public source set does not disclose product-specific cybersecurity
    certifications, public uptime SLAs, software documentation or formal battery-safety certification
    frameworks. That does not prove those controls are absent internally; it does mean external users
    cannot independently assess them from public materials, which matters because the product increasingly
    depends on software coordination across chargers, batteries, route-to-market dispatch and fleet operations.
    [CE006] [CE051]
  claimRefs:
  - CE006
