- id: deployment-workflows-and-operations
  title: Deployment Workflows, Charging Infrastructure and O&M
  body: >-
    Zenobē’s strongest product proof is in delivered operational workflows. Oxford shows the standard
    pattern: high-voltage connection, charger installation, smart-charging integration, battery underwriting
    and live depot operation throughout construction. Nottingham shows the harder version of the same
    playbook in a constrained listed depot, where Zenobē handled grid analysis, retrofit design, fire-suppression
    additions and cable-protection details while still keeping services running. In Australia, the Leichhardt
    depot extends the architecture by integrating solar, batteries and grid upgrades with telematics-led
    charging and battery optimisation. [CE018] [CE019] [CE020] [CE021] [CE022] [CE023] [CE024]


    Truck charging broadens the workflow beyond depot-only use cases. Cardiff is Zenobē’s first UK truck-charging
    project, built around four expandable 400kW DC chargers and smart site power balancing. Mascot goes
    further with an off-site shared charging hub, renewable power, multi-tenant capacity and EVaaS truck
    leasing. Together with Zenobē’s own 2026 market guide on shared heavy-vehicle charging, these projects
    suggest the company is trying to move from private depot electrification toward networked heavy-fleet
    infrastructure where finance, power management and operational support matter as much as the chargers
    themselves. [CE025] [CE026] [CE027] [CE028] [CE029]
