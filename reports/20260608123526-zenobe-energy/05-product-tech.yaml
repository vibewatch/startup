- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Telematics + SoH algorithm
    - Streams battery voltage/power data and forecasts replacement timing
    - Vehicle data quality and algorithm validation
    - Opaque public methodology; false positives or missed degradation hurt uptime
  - - Hekaton smart charging
    - Optimises charging windows, load and operational scheduling
    - Depot data quality, tariff inputs, charger interoperability
    - No public API or architecture docs
  - - GoMetro Bridge / fleet data
    - Aggregates OEM-agnostic IoT data for EV feasibility and fleet insight
    - Partner integration with telematics devices and cloud workflows
    - Commercial dependency on investee roadmap and integration success
  - - Depot electrical infrastructure
    - Transforms grid power into safe charger-level distribution
    - HV/LV substations, private wire, civil works, DNO coordination
    - Site-specific grid delays and retrofit costs
  - - Grid-forming inverter + ESS stack
    - Provides stability, inertia, voltage and frequency support on BESS sites
    - Wärtsilä ESS, SMA/grid-forming controls, TSO interfaces
    - Vendor lock-in and performance verification complexity
  - - Route-to-market / dispatch platforms
    - Controls battery dispatch into markets and contracted services
    - EDF, Kraken and internal optimisation expertise
    - Public materials do not disclose exact control split or fallback procedures
  - - Second-life integration layer
    - Moves retired EV packs into stationary or portable uses
    - Battery traceability and refurbishment process
    - Need visibility into throughput, yields and recycling handoff
  - - Innovation Centre test bed
    - Tests multi-vehicle charging and software integrations before scale rollout
    - Availability of representative hardware and site conditions
    - Lab success may not fully translate to every depot topology
  notes: Architecture reflects public deployment evidence plus explicitly named partner platforms; it
    does not imply Zenobē owns every layer end to end.
