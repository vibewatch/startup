  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: blackhillock-specs
    missingEvidence: A single authoritative technical datasheet reconciling Blackhillock’s final MWh duration
      and phase-by-phase configuration.
    whyItMatters: The company currently publishes both 600MWh and 700MWh for the same asset, which weakens
      confidence in downstream performance and savings analysis.
    diligencePath: Obtain the Blackhillock EPC or asset technical specification from Zenobē, Wärtsilä
      or NESO and reconcile against the launch and case-study pages.
    relatedQuestionRefs:
    - QE015
    - QE028
  - type: missing-source
    severity: material
    topic: software-security-disclosure
    missingEvidence: Product-specific cybersecurity certifications, security architecture notes, API controls
      or formal software-assurance documentation for Hekaton and related control systems.
    whyItMatters: Software increasingly coordinates fleet charging, battery monitoring and grid dispatch,
      so assurance gaps directly affect operational and counterparty risk.
    diligencePath: Request security architecture diagrams, audit summaries, incident-response procedures
      and any ISO/SOC-style attestations covering fleet and grid software.
    relatedQuestionRefs:
    - QE020
    - QE022
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: public-sla-gap
    missingEvidence: Quantified public uptime, availability or response-time SLAs for Zenobē’s charging,
      battery and software services.
    whyItMatters: Service guarantees are part of the core product promise, but the public record does
      not show the thresholds customers can rely on operationally.
    diligencePath: Review sample ETaaS/BaaS contracts, service schedules and operating dashboards to confirm
      uptime, battery-capacity and charger-availability commitments.
    relatedQuestionRefs:
    - QE017
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: rail-product-surface
    missingEvidence: An explicit Zenobē rail battery product page, pilot announcement, technical brief
      or partner disclosure showing rail as a current product line.
    whyItMatters: Rail battery solutions are strategically adjacent to Zenobē’s existing capabilities,
      but the public surface does not show whether management views rail as active roadmap or non-core
      whitespace.
    diligencePath: Ask management for rail strategy, pilot pipeline, rolling-stock partners and whether
      battery lifecycle software is being adapted for rail use cases.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: software-control-boundaries
    missingEvidence: A clear architecture showing where Hekaton, GoMetro Bridge, Kraken, EDF dispatch
      tooling and partner hardware control systems begin and end.
    whyItMatters: Control-boundary ambiguity makes it difficult to assess vendor concentration, fallback
      procedures and the durability of Zenobē’s software moat.
    diligencePath: Request integration architecture diagrams and named responsibility matrices for fleet
      and grid deployments, including failure and override paths.
    relatedQuestionRefs:
    - QE017
    relatedTableRefs:
    - TE003
