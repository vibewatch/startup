- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Electric Fleets / ETaaS
    - Bus, coach, truck and school-transport operators
    - Commercial and repeatably deployed
    - Bundles finance, charging, batteries, software and O&M instead of charger-only sales
    - No public breakdown of software feature modules or contract-level margins
  - - Battery-as-a-Service
    - Fleet operators needing battery-risk transfer
    - Commercial and central to road-fleet offer
    - Separates battery from chassis, guarantees minimum SoH and replacement coverage
    - Need contract sample covering exclusions, warranty carve-outs and SLA triggers
  - - Hekaton smart-charging layer
    - Depot operations teams
    - Deployed but product surface is thin
    - Links charging optimisation to live fleet data and operator onboarding
    - No public API, architecture diagram or cyber-control documentation
  - - Network Infrastructure / grid BESS
    - System operators, power markets, renewable-heavy grids
    - Commercial at Blackhillock and Kilmarnock
    - Grid-forming stability services plus multi-service revenue stacking
    - Need verified module boundaries between Zenobē software and partner platforms
  - - Second-life batteries / Powerskids
    - Fleet depots, temporary power users, static-storage users
    - Commercial but narrower than fleet/grid core
    - Turns replacement batteries into residual-value assets and portable power
    - Need unit economics and refurbishment throughput data
  - - Open-access truck charging hubs
    - Commercial fleet operators lacking depot capacity
    - Early commercial expansion
    - Shared-hub model plus EVaaS and site power management
    - Need utilisation, queueing and pricing data for hubs
  - - Rail battery solutions
    - Rail operators
    - No dedicated current Zenobē product surface found
    - Battery lifecycle, telemetry and electrification know-how are adjacent assets
    - Need explicit rail product page, pilot evidence or partnership disclosure
  notes: Rows mix current commercial products with one explicit adjacency gap; maturity reflects public
    evidence only.
