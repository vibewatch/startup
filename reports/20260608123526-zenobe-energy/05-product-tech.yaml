- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Zenobē solution
  - Measurable benefit
  - Limitation
  rows:
  - - Electrify a bus depot
    - Raise capex, redesign depot, install chargers while service keeps running
    - Finance + HV connection + charger install + smart charging + BaaS
    - 'Oxford: 104 buses, 52 dual-gun chargers, 8MW private wire'
    - Public materials do not show software dashboards or uptime metrics
  - - Operate a constrained legacy depot
    - Retrofit around listed buildings and awkward cable routes
    - Peak-power analysis, phased delivery, fire-suppression retrofit and load management
    - Nottingham delivered on time with two 1800kVA grid connections
    - Cost and design trade-offs are case-specific and not fully quantified publicly
  - - Plan heavy-duty battery lifecycle
    - Run batteries to failure or absorb replacement risk internally
    - Telemetry-led SoH monitoring, minimum SoH guarantee and scheduled replacement
    - Replacements planned ~6 months ahead and cost shifted into service fee
    - No public SLA on maximum downtime or failure response
  - - Open a shared truck-charging site
    - Secure land, power, hardware and financing for a single-user depot
    - Zenobē develops shared hubs with smart power balancing and EVaaS overlays
    - Mascot launched with 22 chargers and room for 44 trucks
    - Public utilisation and pricing data are not disclosed
  - - Add UK HGV charging capacity quickly
    - Wait for broader public network coverage
    - Partner with Zenobē at operator-owned or open-access hubs
    - Cardiff starts with four 400kW chargers and expansion optionality
    - Single-site evidence only; nationwide footprint is still emerging
  - - Relieve renewable congestion on the grid
    - Curtail wind or rely on fossil-based stability services
    - Deploy grid-forming BESS with route-to-market trading and stability services
    - Blackhillock and Kilmarnock provide stability services plus balancing value
    - Public data conflict on Blackhillock’s final MWh rating
  notes: Benefits are taken from public case studies and launch materials; missing economic or uptime
    data is left qualitative.
