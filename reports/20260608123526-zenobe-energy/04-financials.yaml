- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why missing matters
  - Public proxy available
  - Impact on verdict
  - Exact diligence path
  rows:
  - - FY2024 / FY2025 turnover by segment
    - Needed to bridge public contract sizes into recognized revenue
    - Contract values, fleet counts and debt sizes only
    - Blocks revenue-quality and valuation modelling
    - Obtain audited management accounts or lender pack with segment revenue
  - - Gross margin / EBITDA by business line
    - Needed to test whether fleet and battery guarantees earn adequate spread over cost
    - Case studies show contract structure but not margin
    - Blocks margin-path underwriting
    - Request segment gross margin, EBITDA bridge and reserve policy
  - - Unrestricted cash and monthly burn
    - Needed to test runway between debt raises and share allotments
    - Accounts date and debt raises are public; cash is not
    - Blocks capital-adequacy conclusion
    - Request latest treasury dashboard and monthly liquidity forecast
  - - Net debt, interest cost and covenant headroom
    - Needed to assess debt-service resilience and refinancing risk
    - Charge filing confirms security but not leverage ratios
    - Blocks lender-quality credit view
    - Request debt schedule, covenant package and compliance certificates
  - - Backlog and revenue-recognition policy
    - Framework size does not equal recognized revenue
    - Contract tenor and framework values are public
    - Creates risk of overstating revenue visibility
    - Request contract-value-to-revenue bridge and accounting policy memo
  - - Battery replacement reserve / default loss history
    - Zenobē takes battery risk in multiple contracts
    - Battery guarantees are public but loss history is not
    - Blocks confidence in long-term margin durability
    - Request actuarial reserve data, claim history and replacement assumptions
  notes: Every row is a real diligence blocker rather than a cosmetic omission because the business uses debt-backed, long-duration obligations.
