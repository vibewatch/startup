  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: Signed pipeline conversion data, sales cycle length, CAC by vehicle cohort, and payback by operator segment.
    whyItMatters: Without booking, cycle and acquisition-efficiency data, GTM productivity cannot be underwritten and debt-funded growth may hide expensive origination.
    diligencePath: Request board or lender materials showing booking funnel, average tender duration, grant attachment rates, and payback by fleet programme.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited FY2024 and FY2025 turnover, segment revenue, and gross profit by fleets, batteries and energy services.
    whyItMatters: Contract sizes and debt facilities are visible, but revenue scale is not; this blocks any debt-service or valuation bridge anchored to actual earnings.
    diligencePath: Obtain lender presentation, management accounts, or machine-readable filed accounts with segment turnover and gross profit disclosures.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Unrestricted cash, monthly operating cash burn, net debt, interest schedule, covenant headroom and DSCR or leverage tests.
    whyItMatters: Zenobē is scaling through layered debt facilities and asset ownership; without liquidity and covenant data, capital adequacy cannot be confirmed.
    diligencePath: Request latest treasury pack, debt schedule, lender covenant package and monthly liquidity forecast covering fleet and BESS programmes.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: Recognized revenue versus financed asset values, contracted backlog, grant pass-through treatment, and recurring-service mix.
    whyItMatters: Zenobē discloses lease sizes and project values, but not how much converts into recognized revenue, deferred income, or financed assets on balance sheet.
    diligencePath: Request accounting policy memo and cohort bridge from signed framework value to recognized revenue, deferred revenue and leased assets.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI001
    - TI005
