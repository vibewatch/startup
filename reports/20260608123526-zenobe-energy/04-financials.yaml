- id: capital-structure-and-debt-dependence
  title: Capital structure and debt dependence
  body: 'Zenobē’s growth path is clearly debt-enabled. The company disclosed a £241 million EV debt structure in 2022, then a May 2024 expansion that added £410 million to the existing platform and lifted cumulative green debt since 2019 above £1 billion. On the battery-storage side, Zenobē disclosed £147 million of additional Kilmarnock South project debt in January 2024 on top of an earlier £101 million Blackhillock facility, describing a combined £282 million financing platform with a further £400 million accordion. In July 2025 the company closed another €325 million debt facility for European fleet expansion and named seven lenders. A later Companies House charge filing shows that this funding stack is not unsecured corporate goodwill: lenders obtained a fixed charge and negative pledge in favour of Kroll Trustee Services. Equity has not disappeared from the story—Zenobē’s own announcements reference roughly £870 million of 2023 equity from KKR and Infracapital, and Companies House
    shows repeated share allotments through 2025 and early 2026—but the pattern still points to a business that needs regular debt capacity to finance vehicles, batteries, chargers, grid connections and storage projects. That is economically powerful if contracts are durable, but it also means refinancing risk is part of the operating model, not a remote tail event.'
