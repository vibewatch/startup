company:
  name: Zenobe Energy
chapter:
  number: 4
  title: Financials
  summary: Zenobē has built a real, contract-backed monetization engine around vehicle leasing, battery guarantees, charging infrastructure and energy management, but the model is capital intensive rather than software-like. Public evidence shows repeated expansion of debt platforms—including the July 2025 €325 million ($382 million) facility—and visible secured-lender protections, yet it does not disclose turnover, EBITDA, cash or covenant headroom tightly enough to prove capital adequacy without private lender or management data.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization architecture
  body: 'Zenobē’s public materials describe a monetization model that is much broader than a charger installer or fleet software vendor. The company packages finance, grid connection, depot design and build, power procurement, charging optimisation, operating support and battery repurposing into a single fleets-as-a-service offer. On top of that, Zenobē explicitly markets battery-as-a-service for a monthly fee, with the battery treated as a separate asset that Zenobē owns, monitors and replaces if performance degrades. That creates several revenue lines: lease or rental income on vehicles, battery-service fees, charging and depot service revenue, and power-management or optimisation fees. The same pattern appears in public deal examples. Zenobē’s July 2025 European debt announcement references a €42 million end-to-end package for Grupo Julià covering vehicle finance plus design, construction, maintenance and charging operations. Publicly disclosed operating scale—more than 3,400 supported
    vehicles, 122 depots and 340MWh of financed batteries—suggests these are not pilot-only offerings but repeatable commercial products. The key takeaway is that revenue quality likely benefits from long-tenor contracts, but the business captures that quality by keeping substantial asset, battery and delivery obligations on its own balance sheet.'
