- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / tenor
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Vehicle operating leases / master rentals
    - Zenobē finances buses or trucks and recovers value through lease or rental cash flows
    - Per vehicle over contract term
    - Visible in Vectalia, TUKLB and Go-Ahead frameworks
    - Contracted and asset-backed, but funding-cost sensitive
    - Provide portfolio yield versus weighted average debt cost
  - - Battery-as-a-Service
    - Monthly fee for owned batteries with monitoring, guarantees and replacement
    - Monthly fee; 14-15 year examples
    - Explicit monthly-fee product with Oxford and TUKLB examples
    - Recurring-like and sticky, but reserve-heavy
    - Disclose minimum state-of-health assumptions and reserve policy
  - - Charging Service / depot electrification
    - Financed chargers, substations, grid connections and infrastructure O&M
    - Per depot / long-term service agreement
    - 14-year CSA at TUKLB; depot packages in Spain and Oxford
    - Sticky once installed; margin depends on EPC and O&M execution
    - Show gross margin after build, connection and maintenance costs
  - - Power procurement and optimisation
    - Energy buying, reconciliation and resale of unused power
    - Ongoing management arrangement
    - National Express 2-year 47GWh power model
    - Recurring operational fee / savings share; exposed to wholesale volatility
    - Show fee take-rate, hedge rules and savings-sharing mechanics
  - - Depot BESS and grid services
    - Depot batteries provide charging support and earn grid-service revenue
    - Ancillary income plus cost avoidance
    - Yardley Wood battery earns daytime grid-services income
    - Mixed contracted and merchant characteristics
    - Split contracted versus merchant revenue by asset
  - - Grid-scale battery storage services
    - Large BESS assets earn stability, active/reactive power and curtailment value
    - Project-level, long-dated
    - Blackhillock, Kilmarnock and Eccles financings publicly disclosed
    - Potentially durable but capital intensive and policy exposed
    - Provide project revenue stack, DSCR and merchant share
  - - Infrastructure design / build / commissioning
    - Front-end project delivery and deployment work around electrification programmes
    - Milestone based
    - Visible in Grupo Julià and Oxford-style depot programmes
    - Useful for customer capture but lumpier than service fees
    - Separate EPC-style revenue from recurring service income
  notes: Rows combine public fleet, battery, power and storage offers; public contract values are visible, but recognized revenue by stream is not.
