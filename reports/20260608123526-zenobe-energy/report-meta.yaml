companyProfile:
  summary: >-
    Zenobē is a London-headquartered private energy-transition infrastructure
    platform whose operating business dates to 2017, although the legal entity
    was incorporated in 2016. The company finances, owns, and operates grid-
    scale battery-storage assets and electrification programmes for buses,
    trucks, and other fleets, combining vehicle or battery financing, charging
    infrastructure, power procurement, optimisation software, and second-life
    battery services. KKR and Infracapital became joint majority shareholders in
    2023, and public sources show the company has continued to scale both debt-
    funded fleet programmes and large battery assets, while leaving revenue,
    EBITDA, net debt, and current valuation undisclosed.
