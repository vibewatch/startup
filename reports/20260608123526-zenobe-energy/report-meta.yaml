  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: >-
    Zenobē sells a blended infrastructure-and-services stack spanning grid-scale
    battery storage, Electric Transport as a Service, battery-as-a-service,
    charging infrastructure, power procurement, smart charging, Hekaton fleet
    optimisation software, and second-life battery applications.
  customerFocus: >-
    Public transport operators, commercial fleet operators, local authorities,
    and grid or network customers that need financed electrification or battery
    storage capacity.
  businessModel: >-
    The company monetizes long-term service and financing contracts around
    batteries, vehicles, depots, charging, and energy management rather than a
    pure software subscription model, making it capital intensive but
    contract-backed.
  stage: Growth-stage private company
  fundingStatus: >-
