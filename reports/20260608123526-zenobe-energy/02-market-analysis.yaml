  rows:
  - - UK grid-scale battery storage
    - BESS hardware, EPC, optimisation, market access, augmentation
    - Residential batteries, small behind-the-meter home systems
    - Developers / utilities / infrastructure investors; revenues paid by power and flexibility markets
    - Core and best-publicly-sized market
  - - EU utility-scale battery storage
    - Large-scale storage projects, hybrid renewables-plus-storage, system-flexibility assets
    - Consumer electronics batteries, EV manufacturing
    - Developers, utilities, grid-scale investors
    - Important adjacency and benchmarking market
  - - UK zero-emission bus electrification
    - Depot chargers, substations, vehicles, financing, energy management
    - General passenger-car EV demand
    - Local authorities, bus operators, grant bodies, lenders
    - Core transport-electrification wedge
  - - UK commercial fleet electrification
    - Depot charging, onsite power, vehicle-transition financing, energy optimisation
    - Public on-street charging and private car charging
    - Logistics operators, rental fleets, retailers, public fleets
    - Large payer pool but infrastructure constrained
  - - UK rail energy decarbonisation
    - Traction and non-traction energy projects, depot power, selective diesel-displacement projects
    - Generic rolling-stock sales not tied to energy infrastructure
    - Network Rail, train operators, public transport bodies
    - Relevant but hard to size cleanly from public data
  - - Excluded adjacent categories
    - —
    - Home batteries, residential EV charging, broad passenger-EV sales, generic retail CPO rollouts
    - Mass-market households / car buyers
    - Different workflows, budget owners, and ROI logic
  notes: 'Boundary is evidence-constrained: included categories share Zenobé-style institutional buyers and infrastructure-led deployment steps; excluded categories do not. Rail row reflects public energy/emissions evidence rather than a battery-only public TAM.'
