  evidenceGaps:
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: A unified, bottom-up public TAM/SAM/SOM that ties storage, buses, commercial fleets and rail into one comparable market denominator.
    whyItMatters: Without a common denominator, valuation work can overstate the reachable market by blending incompatible submarkets and units.
    diligencePath: Request internal pipeline, won-project, and backlog data from Zenobé; reconcile against public battery, bus and fleet programme data to build a company-specific SAM and SOM.
    relatedQuestionRefs:
    - QM007
  - type: conflicting-data
    severity: material
    topic: uk-bess-market
    missingEvidence: A harmonised UK battery baseline that reconciles MW/GWh and project-boundary differences across RenewableUK, Solar Media and Modo snapshots.
    whyItMatters: Public market baselines differ by date, duration modelling and whether they focus on operational stock, annual additions or total queue, so naive comparisons can mis-size growth.
    diligencePath: Normalise a single internal base case by project date, duration assumption and operational definition before using any market-share math.
    relatedQuestionRefs:
    - QM003
    - QM004
  - type: private-evidence-only
    severity: material
    topic: fleet-electrification
    missingEvidence: Depot-level ROI, payback, charger utilisation and grid-upgrade cost data for bus, van and HGV deployments.
    whyItMatters: The buying process is infrastructure-led, so project economics depend more on site-specific power and utilisation than on top-line fleet counts.
    diligencePath: Obtain operating-case studies or management data for Zenobé-financed depots and compare achieved uptime, utilisation and capex against public grant assumptions.
    relatedQuestionRefs:
    - QM017
    - QM024
  - type: missing-source
    severity: material
    topic: rail-decarbonisation
    missingEvidence: Route-level rail battery or depot-electrification opportunities with budget, diesel-displacement and capex detail.
    whyItMatters: Public rail sources show energy and emissions pressure but not a clean battery-only TAM, so rail SAM risks being overstated without route economics.
    diligencePath: Gather Network Rail, TOC and devolved-transport business cases for unelectrified corridors and depot projects; map where battery or charging assets are funded rather than generic rolling-stock upgrades.
    relatedQuestionRefs:
    - QM025
  - type: stale
    severity: minor
    topic: battery-surplus
    missingEvidence: Observed attrition rates after 2026 Gate 2 offers and evidence on how quickly oversupplied battery projects actually leave the queue.
    whyItMatters: Merchant-return pressure depends on which projects survive reform, not just on the headline queue surplus published today.
    diligencePath: Monitor offer acceptance, capacity-market participation, planning progression and withdrawal notices through the next reform window.
    relatedQuestionRefs:
    - QM022
