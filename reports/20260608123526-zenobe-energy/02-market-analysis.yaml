- id: drivers-and-bottlenecks
  title: Growth Drivers, Bottlenecks, and Valuation Relevance
  body: 'The demand drivers are real. The IEA says batteries remain the fastest-growing power technology, public policy still needs far more flexibility, and Elexon''s 2026/27 plan keeps expanding the data and market plumbing that helps flexibility providers participate. Bus programmes continue to use public money to unlock larger private commitments, and the government''s 2026 truck-and-van package directly subsidises both vehicles and depots. But the bottlenecks are also material. Ofgem and DESNZ acknowledge that battery projects progressing through Gate 2 still sit 14.8GW above the top of the 2030 target range and 61.7GW above projected 2035 need, creating a genuine oversupply risk for merchant returns. Ofgem''s balancing review shows that the system is still paying for congestion and scarcity: Balancing Mechanism volumes rose 17% to 33TWh and total balancing costs reached £2.7 billion in 2024-25. Transport electrification is likewise infrastructure-led: DESNZ says fleet charging behaviour
    and barriers remain under-documented, SMMT says some HGV operators may wait up to 15 years for depot grid connections, BVRLA says only 9% of operators see a current HGV business case, and rail decarbonisation data still does not isolate a clean public battery TAM.'
