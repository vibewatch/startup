- id: TM004
  title: Growth Drivers and Adoption Constraints
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Battery cost declines and longer-duration systems
    - Driver
    - Now to 2030
    - Improves utility-scale storage competitiveness and broadens use cases
    - Pressure-test duration assumptions and augmentation capex
  - - Official UK need for 23-27GW of grid-scale batteries by 2030
    - Driver
    - Now to 2030
    - Policy still requires materially more storage buildout
    - Track whether future official ranges change after reform cycles
  - - Elexon flexibility-market plumbing and asset registration
    - Driver
    - 2026-2027
    - Can widen battery participation and improve monetisation transparency
    - Confirm implementation milestones and participant uptake
  - - Bus grants with private-capital matching
    - Driver
    - 2025-2027
    - Creates concrete buyer budgets for depot and fleet transition projects
    - Map which authorities have repeatable follow-on funding
  - - Truck/van grants plus depot-charging support
    - Driver
    - 2026 onward
    - Reduces upfront barrier for heavy-duty fleet electrification
    - Check grant take-up versus actual depot energisation
  - - Battery queue surplus versus official need
    - Constraint (adverse)
    - Now to 2030
    - Can compress merchant returns and create attrition risk
    - Track post-Gate 2 offer acceptance and project drop-out
  - - Balancing-cost volatility and unfinished market design
    - Constraint (adverse)
    - Now to 2027
    - Revenue stacks remain policy- and dispatch-sensitive
    - Model downside cases for BM, reserve and wholesale spreads
  - - Depot grid-connection delays
    - Constraint (adverse)
    - Now to mid-term
    - Can delay bus and HGV rollout even when vehicle funding exists
    - Measure actual connection timelines for target depots
  - - Small and rural operator economics
    - Constraint (adverse)
    - Now to mid-term
    - May limit electrification outside dense urban routes and large fleets
    - Assess shared-hub, leasing or financing solutions by region
  - - Rail data sparsity and slow infrastructure reporting
    - Constraint
    - Now to mid-term
    - Public evidence is too thin for a clean battery-only rail TAM
    - Request route-level diesel-displacement and depot-capex plans
  notes: Timing reflects when the factor is likely to matter for deployment and valuation, not a precise policy deadline. Adverse rows are explicit because the chapter gate requires preservation of downside evidence, not just bullish market-growth claims.
