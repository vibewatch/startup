company:
  name: Zenobe Energy
chapter:
  number: 2
  title: Market Analysis
  summary: 'Zenobé is exposed to two large but operationally different markets: a UK and European battery-storage market already at double-digit GWh scale and a transport-electrification market where public funding and depot power determine adoption more than headline vehicle demand. The most supportable sizing view is therefore evidence-constrained rather than one blended TAM: Ofgem and DESNZ still target 23-27GW of UK grid-scale batteries by 2030, SolarPower Europe says the EU added 27.1GWh in 2025, and UK zero-emission bus and fleet programmes are now funding vehicles plus depots. The main valuation tension is not whether demand exists, but whether queue surplus, merchant volatility, and depot/grid bottlenecks delay monetisation.'
sections:
- id: market-boundary
  title: Market Boundary and Included Spend
  body: 'Zenobé''s relevant market should be defined as spend on flexible, grid-connected batteries and on heavy-duty transport electrification systems where power availability, financing, and energy optimisation are part of the product. Included spend therefore covers utility-scale BESS development, ownership and optimisation; zero-emission bus fleet transition programmes and depots; commercial-fleet depot charging and onsite power infrastructure; and rail traction or non-traction energy projects where batteries, charging, or depot power reduce diesel dependence. Excluded spend is home batteries, passenger-car charging, generic retail charging-point operations, and broad passenger-EV sales, because those buyers, funding lines, and operating workflows differ materially from Zenobé''s institutional buyer set. The status-quo substitutes also vary by segment: peaker plants and thermal flexibility in grid services, diesel fleets in buses and trucks, and diesel traction on unelectrified rail.
    That boundary matters because the best public evidence remains fragmented by submarket. The supportable approach is not to present one inflated blended TAM, but to combine several constrained lenses and keep the exclusions explicit.'
