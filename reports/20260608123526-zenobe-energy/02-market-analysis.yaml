- id: buyer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'Buyer and payer structures separate Zenobé''s market from consumer EV narratives. In grid-scale storage, buyers are developers, utilities, IPPs, traders, and infrastructure funds; users are asset operators and optimisers; and payers ultimately sit in wholesale, balancing, ancillary and capacity-linked markets. In buses, the buying decision is usually split across local transport authorities, bus operators and public-funding bodies: the April 2025 DfT package funded 319 buses with at least 3:1 private matching, while the March 2026 ZEBRA round added £73.2 million of public support and £94 million of private capital for 484 buses and depots. In commercial fleets, buyers are logistics operators, rental fleets, retailers and public authorities that must combine vehicle grants with depot charging capex and grid access. In rail, buyer structures are more fragmented across Network Rail, train operating companies and public transport bodies, while the accessible public data remains focused
    on energy and emissions rather than route-by-route battery economics. For valuation, Zenobé therefore sells into institutional budgets and infrastructure workstreams, not impulse vehicle demand.'
