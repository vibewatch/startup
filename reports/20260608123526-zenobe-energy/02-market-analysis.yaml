- id: TM003
  title: Buyer / User / Payer Map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget Owner
  - Adoption Trigger
  rows:
  - - Grid-scale battery developer / IPP
    - Developer, utility, fund
    - Asset operator / optimiser
    - Wholesale, BM, ancillary and capacity-linked markets
    - Site development → connection offer → EPC → optimisation
    - Project sponsor / investment committee
    - Connection certainty plus stacked-revenue case
  - - Battery trader / supplier / flexibility participant
    - Trader, supplier, aggregator
    - Dispatch and trading teams
    - Supplier books and flexibility counterparties
    - Asset registration → market access → dispatch optimisation
    - Energy trading / flexibility budget
    - Data transparency and open market access
  - - Local authority backed bus fleet
    - Transport authority + operator
    - Operator and passengers
    - Public grant + operator capex + financing
    - Grant award → procurement → depot upgrade → vehicle delivery
    - Local transport budget plus operator board
    - Air-quality and fleet-renewal mandate
  - - Urban bus operator depot project
    - Bus operator
    - Depot and route operations
    - Operator capex plus grant support
    - Depot grid works → chargers/BESS → route conversion
    - Operator fleet and infrastructure budget
    - Lower operating cost and policy pressure
  - - Commercial van fleet
    - Logistics / rental / retail fleet owner
    - Drivers and fleet managers
    - Operator capex plus vehicle/depot grants
    - Vehicle selection → depot design → connection → charging operations
    - Fleet procurement and facilities budget
    - Cost, compliance and fuel-price resilience
  - - HGV fleet / haulier
    - Haulier or large shipper
    - Drivers and logistics teams
    - Operator capex, grants, financing
    - Grant application → depot connection → charger rollout → route pilot
    - Transport director / CFO
    - Availability of depot power and heavy-duty grant support
  - - Rail energy / depot decarbonisation
    - Network Rail / TOC / public body
    - Rail operators and maintenance teams
    - Public infrastructure budget and franchise / operator spend
    - Programme design → approvals → site works → operational integration
    - Infrastructure owner / public transport budget
    - Carbon target plus asset-renewal need
  notes: The buyer map focuses on who owns the budget and deployment process, not who benefits from cleaner journeys. Transport electrification usually has split public/private budgets; grid-scale storage uses merchant and flexibility-market revenues rather than one payer contract.
