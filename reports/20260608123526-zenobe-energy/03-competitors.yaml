tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Public scale or funding signal
  - Target customer / job
  - Public differentiation
  - Public limitation vs. Zenobē
  rows:
  - - Zenobē
    - Full-stack storage + fleet electrification specialist
    - 122 depots; >3,400 EVs; 340MWh financed; £410m new financing announced in 2024
    - Bus, coach, truck and depot operators; storage projects needing owner-operator capability
    - Combines finance, battery-risk transfer, charging optimisation, and second-life reuse in one contract
    - Public pricing is opaque and scale is smaller than utility incumbents
  - - Centrica Business Solutions
    - Utility-backed incumbent / behind-the-meter integrator
    - 9,500+ onsite energy generation installations in UK/Ireland; 200-year energy history; zero-CAPEX financing options
    - Large industrial and public-sector organisations prioritising resilience and onsite energy economics
    - Strong balance sheet, financing, O&M, microgrids, and 24/7 monitoring
    - Public fleet-specific software depth is weaker than Zenobē’s
  - - EDF power solutions / Pivot Power
    - Utility-backed storage + EV power infrastructure incumbent
    - Up to 3GW battery storage portfolio; up to 40 strategic high-voltage connection locations
    - Public charging, bus depots, vans, trucks, HGV hubs, grid-scale storage
    - Transmission-connected power access plus route-to-market and storage development
    - Public fleet-operations layer is less detailed than Zenobē’s full depot package
  - - Nuvve
    - V2G / fleet software and energy-services adjacent
    - Public-company style positioning; installs and operates BESS; 24/7 VPP monetisation and bidirectional charging
    - School buses, municipalities, public sector, C&I sites seeking V2G upside
    - Strong V2G and site-level monetisation narrative
    - Less evidence of Zenobē-style financing and full depot delivery at scale
  - - GridBeyond
    - Optimisation and funded on-site storage substitute
    - 24/7 operations centre; AI platform; no-upfront-cost funded storage offer
    - Asset owners and energy users seeking battery optimisation, flexibility revenues, and EV fleet management
    - AI-led optimisation, trading, and revenue generation from idle assets
    - Does not show Zenobē’s bus-focused finance and battery-management wrapper
  - - Connected Energy + Forsee Power
    - Second-life storage adjacent
    - 5MWh Connected facility under development; £2m grant; first 2.5MWh UK partnership system; Forsee says >4,200 buses equipped
    - Owners or developers seeking lower-cost storage from repurposed EV batteries
    - Direct attack on second-life cost advantage and bus-battery supply access
    - Still a layer specialist rather than a full Zenobē contract substitute
  - - EO Charging / Pod
    - Depot charging software + services competitor
    - '>80 charge-point provider integrations; >99.5% uptime target; 24/7/365 support; now backed by Pod/EDF energy-management stack'
    - Commercial fleets needing depot charging, charger management, and energy management
    - Strong charger-agnostic software and depot operations capability
    - Public evidence is lighter on battery finance and second-life economics
  - - Heliox / Siemens eMobility
    - Industrial charging-infrastructure entrants
    - Heliox says 25,000+ vehicles powered daily in 150+ cities; Siemens offers depot hardware, software and 24/7 support
    - Bus, truck, depot and public-charging buyers wanting industrial vendors
    - Credible hardware, software and service depth for depots
    - Primarily hardware-service oriented rather than Zenobē-style financing specialists
  - - SWARCO
    - Smart-charging adjacent
    - Public fleet page is brochure-led rather than scale-led
    - Commercial fleet and e-bus charging buyers
    - Evidence of commercial-fleet smart-charging focus
    - Very limited public detail on financing, storage ownership, or operating scale
  notes: Rows cover the strongest evidence-backed UK/EU peers and adjacencies reviewed for this run; they are not an exhaustive competitor universe.
