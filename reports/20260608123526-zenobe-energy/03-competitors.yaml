- id: substitutes-and-internal-build
  title: 'Substitutes: internal build is real for large fleets'
  body: |-
    The biggest substitute to Zenobē is not always another branded “electrification-as-a-service” provider. For large fleets with internal energy teams or strong contractors, the substitute is an assembled stack. A buyer can source depot hardware and uptime support from EO, Heliox, or Siemens; use GridBeyond or Nuvve for charging optimisation, flexibility revenues, or microgrid control; and rely on Centrica or EDF for financing, power procurement, or connection strategy. PwC’s fleet-electrification work reinforces this direction: charging-as-a-service is spreading, intelligent integrated platforms are becoming central, and OEMs are developing their own fleets. In practice, that means Zenobē wins when the customer values risk transfer and one throat to choke more than modular control. Multi-homing is easier in hardware and software than in financed battery-management contracts, because EO and Nuvve both stress interoperability and partner ecosystems. Zenobē therefore benefits when the customer is operationally constrained, but it becomes easier to displace where the customer has capital, procurement capacity, or an energy-management partner able to stitch the stack together.
