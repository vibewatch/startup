- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider / class
  - Public contract model
  - Included capabilities
  - Public price signal
  - Main unknown
  - Implication
  rows:
  - - Zenobē
    - Monthly-fee ETaaS / battery-as-a-service style contract
    - Vehicles or batteries, charging and grid infrastructure, software, O&M, replacement and repurposing
    - No public list pricing
    - Realised margin, term mix, and savings share
    - Powerful for buyers seeking risk transfer, but hard to benchmark externally
  - - Centrica Business Solutions
    - PPA / DEP / zero-CAPEX financing structures
    - Generation or storage assets, financing, maintenance, monitoring, insights
    - No public list pricing
    - How aggressively it prices fleet-specific work
    - Competes well where corporate energy budgets dominate procurement
  - - EDF / Pivot Power
    - Infrastructure and connection-led model
    - High-voltage connections, EV power infrastructure, storage development, route-to-market
    - No public list pricing
    - How much depot software or operations are bundled
    - Can win when access to power is the scarcest resource
  - - Nuvve
    - Software, charging, grants / rebates and V2G revenue participation
    - Bidirectional charging, fleet portal, microgrid / ancillary-services participation
    - No public list pricing
    - Delivered fleet-level V2G revenue by customer cohort
    - Appealing when monetisation upside matters more than turnkey financing
  - - EO / Pod
    - Depot charging platform and service contracts
    - EO Cloud, charger integrations, energy management, uptime support, now with Pod/EDF flex stack
    - No public list pricing
    - Post-acquisition packaging and contract terms
    - Good modular substitute for fleets that want charger and software depth first
  - - GridBeyond
    - Funded battery storage plus optimisation services
    - On-site battery installation, AI optimisation, flexibility revenues, resilience support
    - No-upfront-cost offer stated publicly
    - How savings and revenue share are split
    - Strong substitute for customers happy to self-assemble the wider fleet stack
  notes: Public materials reveal contract architecture and budget posture more clearly than realised pricing, so the key comparison is who absorbs capital and operating complexity.
