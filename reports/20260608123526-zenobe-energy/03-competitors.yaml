- id: durability-and-risk
  title: 'Moat durability: integration helps, but UK storage pressure reduces room for error'
  body: |-
    Zenobē’s moat is strongest where financing, battery performance guarantees, grid-connection work, charging optimisation, and second-life reuse are packaged in one contract. That creates switching cost after a fleet or battery site is live, because the customer is no longer choosing only chargers or software; it is also choosing who carries battery risk, who manages power procurement, and who benefits from second-life value. The problem is that this moat sits in markets where returns are getting more competitive. ESS News reported the UK 2026-27 T-1 capacity auction cleared at GBP 5 per kW-year, the lowest T-1 level since 2020, and Elgar Middleton described ancillary-service erosion as new capacity saturates the market. As merchant conditions tighten, buyers and financiers are likely to prefer providers with either route-to-market sophistication or utility-style balance sheets. That shifts pressure toward EDF, Centrica, Pod/EO and other coalitions of specialists. The underwriting implication is that Zenobē does not need to lose to one perfect clone; it can lose economics one layer at a time if incumbents and point solutions collectively make its integrated premium look optional.
