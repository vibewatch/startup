  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Realised contract pricing, term length, savings-share mechanics, and service-level penalties across Zenobē, EDF, Centrica, EO, and GridBeyond.
    whyItMatters: Without realised commercial terms it is hard to compare margin durability, switching cost, and whether Zenobē wins on price or on risk transfer.
    diligencePath: Request anonymised proposals, term sheets, or procurement comparisons from recent customer deals.
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: zenobe-retention-economics
    missingEvidence: Cohort retention, renewal, and upsell data for Zenobē ETaaS and battery-management contracts.
    whyItMatters: The chapter’s moat view depends on whether integrated contracts really create better retention and refinancing outcomes than modular alternatives.
    diligencePath: Request cohort retention, expansion, and refinance data split by buses, trucks, and storage customers.
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: v2g-realised-revenues
    missingEvidence: Customer-level evidence on realised V2G or flexibility revenues for Nuvve-like and Zenobē-like fleet programmes.
    whyItMatters: Public materials describe monetisation potential, but the practical importance of V2G to procurement depends on delivered cash outcomes, not marketing language.
    diligencePath: Request audited project savings, grid-service revenues, and duty-cycle constraints from live fleet deployments.
    relatedTableRefs:
    - TP002
  - type: private-evidence-only
    severity: minor
    topic: second-life-deployment-base
    missingEvidence: Current installed MW or MWh base for Connected Energy and the live commercial performance of second-life projects beyond press releases.
    whyItMatters: Second-life economics are strategically relevant to Zenobē, but public sources remain stronger on pipeline announcements than on operating asset performance.
    diligencePath: Request operating asset schedules, warranty data, degradation outcomes, and customer references for second-life sites.
    relatedTableRefs:
    - TP001
