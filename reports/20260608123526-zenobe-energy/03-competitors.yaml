- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Integrated finance + battery-risk transfer
    - Utilities or financiers replicate capital wrapper while specialists supply the technical layers
    - High
    - Centrica zero-CAPEX financing, EDF power access, and Pod/EO energy-management stack all address parts of the same budget problem
    - Request win-loss data by buyer type and whether Zenobē wins more on risk transfer or on software
  - - Second-life reuse lowers effective battery cost
    - Connected Energy and Forsee scale second-life supply into grid projects
    - Medium-High
    - Forsee / Connected plan first 2.5MWh system in 2025 and larger >25MWh projects later
    - Request current economics from repurposing versus new-pack alternatives by project type
  - - Software optimisation and depot intelligence
    - Nuvve, GridBeyond, EO and Pod compress software differentiation
    - High
    - Each competitor publicly markets optimisation, smart charging, or revenue monetisation layers
    - Request product-level churn and attach rates for Hekaton or equivalent Zenobē software layers
  - - Route-to-market / storage economics
    - UK ancillary and capacity-market revenue compression narrows merchant upside
    - High
    - ESS News and Elgar both point to lower clearing prices and ancillary-service erosion as new capacity enters
    - Request toll, floor, and merchant mix on Zenobē’s UK BESS portfolio
  - - Single-vendor convenience
    - Large fleets self-assemble stacks from charger vendors, utilities and optimisers
    - Medium
    - PwC describes charging-as-a-service and OEM-led fleet models expanding while EO, Heliox and Siemens cover depot delivery
    - Request customer segmentation by internal capability and procurement complexity
  notes: The highest-risk items are the ones where incumbents can attack economics without needing to replicate every Zenobē capability in-house.
