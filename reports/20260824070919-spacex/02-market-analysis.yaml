- id: buyer-map
  title: Buyer / User / Payer Map
  body: 'Buyer structure differs sharply across SpaceX’s markets, which is why the company’s sales motion is not reducible to one procurement pattern. In launch, the buyer is usually a satellite operator or government mission office, the user is the payload owner and mission team, and the payer is a capex or program budget. In Starlink residential, buyer, user, and payer often collapse into one household or small business. In aviation, the buyer is the airline, the end user is the passenger, and the commercial logic can be retention, brand differentiation, or ancillary economics rather than direct Wi-Fi monetization. In direct-to-cell, the buyer is the mobile network operator, the end user is the wireless subscriber, and the economic model is wholesale network extension rather than terminal sales.


    That buyer diversity is strategically positive because it reduces dependence on one budget cycle or one adoption trigger. But it also means go-to-market complexity is high. SpaceX has to win government mission assurance, enterprise deployment trust, airline retrofit execution, and consumer network satisfaction at the same time. The market is large precisely because it is multi-segment; the difficulty is that each segment has different requirements, switching costs, and regulatory gates.'
