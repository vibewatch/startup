- id: TM002
  title: TAM / SAM / SOM or Sizing Lens Table
  columns:
  - Lens
  - Current public signal
  - What it bounds
  - Why it matters
  - Main limitation
  - Confidence
  rows:
  - - Launch pricing floor
    - $350k for 50kg to SSO; $7k/kg extra
    - Low-end access price for small payloads
    - Shows SpaceX has standardized entry-level commercial packaging
    - Does not represent full dedicated-launch economics
    - medium
  - - Starlink consumer broadband
    - 4M to almost 5M customers in late 2024
    - Existing user-side demand
    - Proves the sat-broadband market is already operating at scale
    - Subscriber count does not reveal ARPU or profit by segment
    - medium
  - - Aviation connectivity
    - 2,500 aircraft under contract; United >1,000 aircraft
    - Enterprise mobility market
    - Shows airline demand can move through fleet-scale contracts
    - Contracted aircraft are not the same as active revenue seats
    - medium
  - - Direct-to-cell coverage gap
    - 20% of U.S. land and 90% of Earth initially lacked terrestrial service; >50% of world land mass still uncovered
    - Coverage-need ceiling for NTN services
    - Explains why MNO partnerships exist at all
    - Coverage gap is not equal to paying demand
    - medium
  - - Lunar cargo pricing
    - $100M per metric ton, no earlier than 2028
    - Upper-end exploration logistics price signal
    - Provides a visible benchmark for long-dated Starship economics
    - Company-authored future pricing, not market-cleared demand
    - low
  notes: Public evidence supports bounded lenses better than a single clean TAM. Each row measures a different layer of SpaceX demand.
