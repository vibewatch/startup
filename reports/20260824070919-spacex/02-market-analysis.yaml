- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Factor
  - Driver or constraint
  - Evidence
  - Why it matters
  - Implication
  rows:
  - - Coverage gaps
    - Driver
    - Amazon Leo, AST, and SpaceX DTC updates all describe large uncovered populations or geographies
    - Real unmet need creates room for satellite alternatives
    - Supports long runway for broadband and DTC adoption
  - - Airline retrofit momentum
    - Driver
    - 2,500 aircraft backlog and United deal
    - Enterprise distribution can expand quickly through large contracts
    - Mobility can grow faster than residential in some geographies
  - - Government mission priorities
    - Driver
    - HLS, Starshield, and FCC framework
    - Public-sector demand can de-risk strategic adjacencies
    - Government demand amplifies launch and secure-communications TAM
  - - Spectrum and licensing
    - Constraint
    - FCC SCS framework and FAA launch approvals
    - Regulation can expand or bottleneck addressable markets
    - Execution requires policy and compliance, not just hardware
  - - Multi-orbit competitors
    - Constraint
    - SES, Viasat, Telesat, AST, Amazon Leo
    - The market is growing, but not uncontested
    - Pricing and feature capture will not be frictionless
  - - Vehicle readiness
    - Constraint
    - New Glenn reuse miss; Starship regulation; Neutron still preflight
    - Stated capability and market share depend on flight heritage
    - Not all theoretical demand converts on schedule
  notes: The same factors that enlarge SpaceX’s market also create bottlenecks to capturing it.
