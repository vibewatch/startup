company:
  name: SpaceX
chapter:
  number: 2
  title: Market Analysis
  summary: 'SpaceX participates in several overlapping markets rather than one monolithic “space economy”: commercial launch, rideshare, broadband connectivity, direct-to-cell wholesale extension, and government or exploration systems. The strongest currently proved demand is in Starlink broadband and aviation connectivity, while launch remains both a sold product and an internal demand engine for constellation deployment. The largest unresolved issue is not whether the market is large, but how much of each segment is presently monetized versus still option value, because the public record does not provide a clean segment-revenue bridge.'
sections:
- id: market-boundary
  title: 'Market Boundary: Launch, Connectivity, and Government Space Infrastructure'
  body: 'SpaceX cannot be analyzed inside a single neatly bounded market. The reviewed sources show at least five economically meaningful surfaces: launch services, standardized rideshare access, Starlink broadband, direct-to-cell wholesale connectivity, and government exploration or secure-communications systems. The right market boundary therefore excludes the entire downstream “space economy” and instead focuses on spend that chooses SpaceX vehicles, SpaceX connectivity, or SpaceX government systems. That distinction matters because a dollar of satellite-manufacturing revenue, downstream telecom ARPU captured by someone else, or generic space-enabled GDP is not the same as a dollar that can accrue to SpaceX.


    At the same time, the company’s internal flywheel blurs the line between market participation and self-generated demand. The launch manifest is heavily populated by Starlink missions, which means launch cadence and connectivity growth reinforce each other. The company is therefore not just selling into external markets; it is using a proprietary transport stack to build out its own recurring-demand platform. That makes SpaceX broader than a launch provider but also harder to size with one simple TAM number.'
