  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争基准：Falcon 9 定义可信度的参考价格
        blocks:
          - type: paragraph
            body: >-
              分析 SpaceX 的竞争，必须从 Falcon 9 开始，因为多数发射替代方案仍要对标它在可复用经济性、飞行履历和排期确定性上的组合。SpaceX
              不只是公布运载器参数；它公布的是一个可复用发射产品，有可见的拼车发射价格地板，也有足够深的公开任务清单来传递反复运营成功。结果是，基准不再只是每公斤成本或载荷大小。真正的基准，是竞争者能否匹配一个已经按工业节奏飞行、既能吸收内部星座需求又能服务外部客户的系统。


              这很重要，因为许多竞争者仍在销售未来信心。SpaceX 的基准方案已经在线、已经可复用，并且已经被商业买家、NASA 和美国国家安全生态熟悉。落到实务上，Falcon 9
              为许多任务设定了“默认同意”；挑战者必须解释，买方为什么要离开这个默认选项。
