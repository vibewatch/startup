      - 主赛道
      - 证据最扎实的优势
      - 相比 SpaceX 的弱点
      - 含义
    rows:
      - - SpaceX Falcon / Starlink
        - 发射 + 宽带 + 政府 + 未来探索
        - 现役可复用发射节奏与广泛平台整合
        - 披露不透明，Starship 面临越来越多监管 / 安全审视
        - 多数品类的基准在位者
      - - Rocket Lab Neutron
        - 中型发射
        - 面向星座和国家安全的可复用中型发射定位
        - 相比 Falcon 履历，仍未进入运营
        - 最相关的新兴 Falcon 9 式替代方案
      - - ULA Vulcan
        - 政府与高精度发射
        - 任务保障和政府端更高信任姿态
        - 低成本可复用叙事没那么明确
        - 在重视保障的场景里是强第二来源
      - - Arianespace Ariane 6
        - 欧洲机构与商业发射
        - 主权准入和模块化
        - SpaceX 式发射节奏优势证据较弱
        - 重视非美国依赖的客户可选替代
      - - Blue Origin New Glenn
        - 美国重型发射替代
        - 已入轨，并具备第二来源潜力
        - 运营中的复用尚未证明
        - 如果发射冗余上升为战略需求，它很重要
      - - Amazon Leo / Project Kuiper
        - LEO 宽带
        - 规模资本和宽带野心
        - 商业服务和装机基础落后 Starlink
        - 未来有意义的宽带竞争者
      - - SES / Viasat / Telesat / AST
        - 在位或细分连接替代方案
        - 既有基础设施、企业聚焦或直连手机专长
        - 没有一家把 SpaceX 的发射飞轮与现有 Starlink 规模结合起来
        - 竞争压力是分段式，不是一对一
    notes: 这组公司混合了直接和相邻竞争者，因为 SpaceX 自身横跨发射、连接和政府市场。
