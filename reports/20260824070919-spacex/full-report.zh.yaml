  - id: TV005
    title: 投资逻辑破裂与止损触发点表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Starship 时间线破裂
        - 重大延误周期反复出现，或到下一个运营窗口仍无法展示可信的节奏改善。
        - 最大的可选性信用来源停止转化为证据。
        - 从谨慎乐观转为明确下调乐观情景。
      - - 融资压力破裂
        - 债务成本或再融资需求上升，同时资本开支仍高、执行滑坡。
        - 估值从受增长约束变成受资产负债表约束。
        - 要求明显更低的入场价格，或避免新增敞口。
      - - 监管摩擦破裂
        - FAA 或其他审批实质性拖慢发射节奏，或有意义的新限制持续累积。
        - 收入节奏和平台扩张假设失去可信度。
        - 立即把情景权重切向基准 / 悲观。
      - - 治理破裂
        - 发生重大策略变化，但外部制衡可见度不足。
        - 受控公司折价扩大，因为投资者不能依赖常规治理控制。
        - 参与前要求更大安全边际。
      - - 证据与价格脱节
        - 老股或私募定价继续跑在经营证据改善前面。
        - 即使公司质量仍高，回报仍会被压缩。
        - 证据追上估值前，不投新钱。
    notes: 这些触发点聚焦可监控事件，而不是叙事情绪波动。
