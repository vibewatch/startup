        - $25.21B 市值
        - 有助于参照卫星连接和频谱资产。
        - 资产负债表和运营质量画像不同。
      - - Globalstar
        - 公开市场市值
        - $10.67B 市值
        - 显示市场如何给较小的战略卫星资产定价。
        - 服务范围和规模窄得多。
      - - Viasat
        - 公开市场市值
        - $10.29B 市值
        - 卫星宽带经济性的在位者参照。
