  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：顶级公司，但当前私募定价已计入大量成功
        blocks:
          - type: paragraph
            body: >-
              SpaceX 已经不再只靠愿景估值。2026 年文件支持这样一个判断：公司已经有真实规模，2025 年收入为 $18.674 billion，Starlink
              是主导利润引擎，政府、发射、移动连接和任务邻近收入面也清晰可见。这一点很重要，因为它把 SpaceX 和那些估值建立在 TAM
              幻灯片与精选客户标识上的普通后期未上市公司区分开。公开证据已经足以支撑优质资产的判断。


              但投资问题已经不是 SpaceX 是否卓越。问题是，当把 Starship 依赖、牌照拖累、债务、资本开支强度和受控公司治理全部算进去，$350 billion
              级别的私募入场价还能否留下足够有吸引力的经风险调整回报空间。更稳妥的答案是继续跟踪，但严格守价格纪律。当前标记并不显然荒谬，但要求已经足够高：买方要么需要折价，要么需要差异化进入渠道，要么需要更多证据证明
              Starship 和资本强度正在从逻辑走向证据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
