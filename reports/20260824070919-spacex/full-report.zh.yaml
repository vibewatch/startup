  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 方向
      - 论点
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - Starlink 已经给 SpaceX 提供真实、大规模且可盈利的连接业务核心，而不是一个投机性的未来订阅叙事。
        - 如果 Starlink 利润率或订阅用户质量明显走弱，溢价情景会迅速压缩。
      - - 投资逻辑
        - SpaceX 把发射、政府项目、任务服务和宽带几条业务面拼在一起，公开市场里没有可完全匹配的可比公司。
        - 如果这种一体化广度不再产出跨板块经营杠杆，投资者可能把公司看成杂乱的集团，而不是平台。
      - - 投资逻辑
        - NASA、政府与企业验证支撑战略溢价，不能只看零售订阅用户指标。
        - 如果这些项目最终呈现为波动大、政治依赖强，或变现弱于预期，溢价支撑就会变弱。
      - - 反向逻辑
        - 下一轮估值台阶很大一部分仍取决于 Starship 及其带来的发射节奏。
        - Starship 如果明确降风险且运营节奏持续，这一反对意见会明显弱化。
      - - 反向逻辑
        - 资本开支、债务和 AI 相关复杂性让当下经济性没 Starlink 标题故事那么干净。
        - 分部拆分更清晰，再加上可见的去杠杆或资本开支正常化，会提高可承销性。
      - - 反向逻辑
        - 受控公司治理意味着，如果战略或风险偏好变化，外部投资者手里制衡更少。
        - 更独立的治理和更清晰的继任梯队会小幅缩窄折价。
    notes: 反向逻辑解释了为什么一家高溢价公司在错误价格上仍可能不是好入口。
