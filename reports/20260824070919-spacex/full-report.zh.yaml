      - number: '5.5'
        title: 路线图可见、迭代，并且异常公开
        blocks:
          - type: paragraph
            body: >-
              SpaceX 一个被低估的产品优势，是路线图已经变得多么可见。载人航天概览提供了从 Falcon 1 到载人 Dragon 任务、再到 Starship
              测试的多十年里程碑弧线。内容中心加入更细的近期时间线，包含一直到 2026 年 5 月 Starship 第十二次飞行测试的纪录片和飞行测试条目。文件还搭了一座技术-商业桥，描述 Starlink Mobile
              扩张、卫星到手机服务、相控阵终端规模，以及 Starship 作为长期降低边际发射成本和提高载荷能力的赋能因素。

              这种可见性并不让路线图免于风险。但它确实创造了一种罕见状态：外部投资者几乎可以连续监控技术成熟度、部署节奏和面向客户的产品界面。因此，SpaceX
              的差异化不仅在某项专利或某个运载器参数，而在横跨发射、航天器、卫星和新服务层的公开运营节奏；很少有竞争者能匹配这种节奏。
