      - number: '6.5'
        title: 客户结论——真实采用、高质量旗舰客户，但集中度未知仍重要
        blocks:
          - type: paragraph
            body: >-
              客户基础毫无疑问真实存在。公开证据覆盖数百万订阅用户、航空公司、移动网络运营商、NASA 载人任务、月球系统工作，以及研究或宇航员任务入口。这已经把 SpaceX
              放在与仍需证明有人愿意在生产环境付费的公司不同的类别里。更细的尽调问题，不是客户是否存在，而是哪一条客户线是否过度主导收入或战略价值。消费者 Starlink
              似乎是规模引擎，而航空公司、运营商和政府项目可能在参考质量、利润率和护城河上具有不成比例的重要性。

              因此，本章最终客户判断是正面但不天真。SpaceX 拥有广泛采用和异常强的旗舰验证。仍缺失的是一张精确的公开地图，标出收入集中度、合同期限、队列留存，以及企业或政府账户中有多少是深度生产关系，而不只是头条合作。
