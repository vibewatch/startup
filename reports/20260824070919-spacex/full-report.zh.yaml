  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险是 Starship 与高频扩张的项目集中度
        blocks:
          - type: paragraph
            body: >-
              SpaceX 面对的不是一组彼此松散关联的普通创业风险。公开申报文件说得很清楚：Starship 是下一代 Starlink V3 部署、V2 Mobile 放量、登月野心，甚至更具试探性的轨道 AI
              计算项目的关键支点。因此，一个技术或监管瓶颈就可能同时传导为产品延期、客户失望、资本开支效率下降和估值压缩。正向看，一个平台跑通就能打开几条业务线；反向看，执行依赖异常集中。

              这种集中度并不抽象。文件明确列出 Starship 在技术、供应链、基础设施和监管上的障碍；FAA 公开记录也显示，即便重大批准已经落地，环境审查和更新的空域关闭工作仍在继续。因此，投资人不该只说「SpaceX
              风险很多」，更准确的表述是：「SpaceX 有一个巨大的扩张引擎，一旦失灵，故障模式会沿多条收入面级联。」
