      - number: '7.3'
        title: 运营和安全风险已从工程迭代外溢到空域与公共安全
        blocks:
          - type: paragraph
            body: >-
              SpaceX 一直主张，快速迭代才能让雄心勃勃的发射系统进步；公开记录也支持公司学习很快。投资人的问题在于，Starship 事故现在制造的外部性，不只 SpaceX
              工程师看得见，航空公司、监管机构、周边社区和环境批评者也都看得见。CNBC 报道称，Starship 在飞行中失效后 FAA 叫停项目，并要求完成纠正措施后才可能发出下一张许可证。另一篇 CNBC
              报道显示，碎片警告导致数十个航班改道或延误。ProPublica 的调查更进一步，认为 FAA 被迫在繁忙空域中为不断扩大的发射风险临场补位。

              这很关键，因为运营风险不再只是单次发射失败的概率。它还包括反复异常收紧危险区假设、拉长调查窗口、增加环境条件、引发客户或航空公司反弹，或限制 SpaceX 所需实际发射节奏的概率。换句话说，运营问题不只是
              Starship 能不能飞，而是它能否飞得足够频繁、足够安全，并把附带扰动压到可接受范围。
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
