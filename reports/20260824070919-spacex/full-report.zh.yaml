      - number: '8.5'
        title: 公开可比公司证明稀缺价值，也暴露预付了多少未来成功
        blocks:
          - type: paragraph
            body: >-
              可比公司分析在这里只适合作为边界工具。Rocket Lab、AST SpaceMobile、EchoStar、Globalstar、Viasat 和 Iridium 等公开卫星与航天同行的市值远低于 SpaceX
              私募估值。它同时证明两件事：第一，SpaceX 比其中任何一家都更宽、更强、战略重要性更高，因此应享有大幅稀缺溢价；第二，估值差距如此之大，投资人承销的不可避免是未来执行，而不是当前公开市场平价。Amazon
              提醒我们，巨型基础设施平台可以支撑万亿美元级股权价值，但它不是直接可比公司，因为 Amazon 的现金生成宽度和资本市场灵活性截然不同。


              这会直接把问题带回尽调。在接受 $350 billion 级别入场价之前，投资人应要求更干净的证据：Starship 里程碑时间、债务与再融资状态、AI
              相关复杂性之后的分部可拆分性，以及政府和企业增长的准确经济性。没有这些证据，正确姿态不是看空 SpaceX 这家公司，而是对 SpaceX 这个价格保持纪律。
