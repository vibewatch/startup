            body: >-
              SpaceX 各业务的公开定价仍不均匀，但变现架构已经比投资者只能依靠二级市场报道时清晰得多。文件称，Connectivity
              收入主要来自消费者订阅费；企业合同围绕订阅、数据消耗、容量和其他服务特定价格设计；此外还有政府连接收入，以及 Starlink Mobile
              与移动网络运营商的收入分成安排。文件还指出，托管型企业和政府客户未计入披露的订阅用户指标，这阻止分析师把订阅用户数单独当成总商业规模。文件之外，公开证据也提供了实用锚点：SpaceX 仍公布太阳同步轨道 50
              公斤拼车发射标价 $350,000，每增加 1 公斤加收 $7,000；CNBC 报道 United 超大交易后约 2,500 架飞机已签约。

              含义是，SpaceX 同时在多个层面变现：住宅和漫游订阅、企业和移动连接合同、直连手机收入分成、政府安全服务、发射服务，以及 NASA 牵引的探索项目。多元化提高收入韧性，但也让产品级定价不透明更重要。住宅
              ARPU 已披露；企业和政府实际定价大多没有披露。
