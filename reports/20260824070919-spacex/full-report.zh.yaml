      - number: '7.2'
        title: 监管和法律摩擦已不再是商业模式的边缘问题
        blocks:
          - type: paragraph
            body: >-
              SpaceX 的监管负担随着野心一起上升。S-1 招股说明书称，发射和再入活动需要大量批准；更大的轨道基础设施还可能需要国内外授权，卫星数量潜在可高达 100 万颗。FAA 公开 Starbase
              材料显示，监管流程现在覆盖的不只是发射牌照，还包括反复环境评估、更高频次审查、着陆轨迹工作、临时空域关闭和公众意见程序。成熟航天主承包商能处理这些，但对一家激进迭代的公司来说，一旦失败或公众反对加剧审查，排期就会变得不确定。

              法律暴露也不只是常规许可工作。NLRB 和 Fifth Circuit 公开记录显示，劳动相关争议升级为围绕机构结构的宪法诉讼；DOJ 也公开宣布了一起涉及 SpaceX
              对庇护申请者和难民招聘立场的歧视案件。单看任何一项都不像生死问题，但合在一起说明，SpaceX 的法律风险面已经同时跨过劳动、雇佣、国家安全、频谱、安全和环境多个领域。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
