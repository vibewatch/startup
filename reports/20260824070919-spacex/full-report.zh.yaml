            body: >-
              具名客户证明既有意义，也很多元。移动场景里，United 和 Hawaiian 提供旗舰航空公司证据；SpaceX 的飞机合同数量则说明，具名胜利不是孤立试点。直连手机场景里，T-Mobile
              是公开记录最清晰的发布伙伴；CNBC 关于首批短信的报道证明，这段关系已越过新闻稿意图，进入真实网络测试。机构项目里，NASA
              的商业载人航天和月球着陆器工作提供了多数私人公司难以接近的高信任客户验证。研究和宇航员运输入口又加了一层：SpaceX 公开征集研究提案，并把 Dragon 定位为执行这些任务的手段。

              即便如此，证明质量仍有差异。NASA 和航空公司公告很具体；一些国际客户页面内容单薄、已迁移或高度依赖 JS；标识或航线公告也不会自动证明长期收入韧性。因此，本章把强具名证明与较弱、更表层的公开提及区分开来。
