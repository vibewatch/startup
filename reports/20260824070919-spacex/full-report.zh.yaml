  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: SpaceX 销售的是一体化入轨与连接栈
        blocks:
          - type: paragraph
            body: >-
              再把 SpaceX 描述成“一家火箭公司加 Starlink”，已经不准确。它的官方页面、S-1 和载人航天页面显示出一个分层平台：Falcon 9、Falcon
              Heavy、Dragon、Starship/Super Heavy、Starlink
              宽带与移动星座、用户终端、Starshield，以及配套地面和软件运营。设计逻辑是垂直整合。运载火箭不只是收入产品，也承担星座部署机制。卫星不只是硬件资产，而是支撑宽带、直连手机、航空、海事和政府通信。Dragon
              不只是太空舱，它是可复用载人航天和货物返回系统，也强化 SpaceX 作为高可靠运营商的信任。

              这个一体化架构很重要，因为它压缩了制造、发射、部署和服务交付之间的迭代循环。技术差异化也因此不局限于某一个部件。SpaceX
              的优势来自可复用发射、卫星生产、终端部署和运营之间的耦合。结果是，产品栈比多数单赛道竞争者需要匹配的范围更宽。
