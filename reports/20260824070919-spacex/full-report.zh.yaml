      - number: '2.5'
        title: 矛盾、反向证据与仍不可知的部分
        blocks:
          - type: paragraph
            body: >-
              SpaceX 市场叙事的主要矛盾在于，需求显然很广，但今天不应把所有需求同等估值。住宅和航空 Starlink
              需求已经得到验证；月球货运定价和地球到地球旅行仍属愿景。发射需求在外部和内部都可见，但公开记录仍没有把发射节奏转换成已确认的外部发射收入。连接需求显而易见，但本次审阅的来源没有披露一个干净的 ARPU
              或分部利润率桥，无法串起住宅、企业、航空、海事和直连手机。


              因此，投资者应把本章的市场规模测算当成决策框架，而不是伪精确表格。市场毫无疑问很大、跨多个分部且仍在增长。公开材料仍无法回答的是：各收入池的相对权重、新邻近产品转化为现金流的程度，以及理论战略期权和今天已变现需求之间的切分。
