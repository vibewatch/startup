  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资建议的逻辑是：强验证和优质资产，与已经苛刻的价格正面相撞。
    data:
      nodes:
        - id: scale
          label: 真实收入规模
          detail: 2025 年收入 $18.674B，Starlink 利润规模大，支撑高质量资产可享溢价的判断。
        - id: breadth
          label: 战略宽度
          detail: 发射、连接、政府需求和任务信任叠在一起，让 SpaceX 成为稀缺资产。
        - id: risk
          label: 剩余执行风险
          detail: Starship、监管、杠杆和治理仍在关键路径上。
        - id: price
          label: 饱满的私募估值
          detail: $350B 级定价已经预支了大量未来验证。
        - id: decision
          label: 跟踪 / 仅在折价时择机
          detail: 公司质量高；入场必须守纪律。
      edges:
        - from: scale
          to: decision
          label: 支撑关注
        - from: breadth
          to: decision
          label: 支撑溢价
        - from: risk
          to: decision
          label: 要求谨慎
        - from: price
          to: decision
          label: 压缩上行缓冲
    approximationNotes: 这条流程是定性判断，因为决策取决于当前价格如何与验证和风险相互作用，而不是某个公式。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV008
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 相对上市同业的估值差距巨大，既是稀缺性溢价的理由，也是在提醒：很多未来价值已经预付。
    data:
      items:
        - label: SpaceX $350B 级私募估值
          value: 350
          unit: $B
          detail: 公开报道中的高端老股交易定价背景。
          tone: warning
        - label: SpaceX $210B 私募估值
          value: 210
          unit: $B
          detail: 后续重估前较早的私募成交背景。
          tone: neutral
        - label: Rocket Lab 上市市值
          value: 46.4
          unit: $B
          detail: 样本中最大的纯发射平台上市可比公司。
          tone: positive
        - label: AST SpaceMobile 上市市值
          value: 26.71
          unit: $B
          detail: 直连手机热度参照。
          tone: neutral
        - label: Iridium 上市市值
          value: 5.18
          unit: $B
          detail: 盈利卫星通信参照。
          tone: neutral
    approximationNotes: 柱状图展示股权价值参照点，不代表企业价值调整或目标价。
    claimRefs:
      - CV018
      - CV019
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支撑一个宽但可执行的估值区间，当前私募估值更偏向乐观侧。
    data:
      items:
        - label: 悲观情景
          low: 160
          mid: 190
          high: 220
          displayValue: $160B–$220B
          detail: Starship 验证更慢、融资更紧，可选性信用更少。
          tone: negative
        - label: 基准情景
          low: 260
          mid: 290
          high: 320
          displayValue: $260B–$320B
          detail: 核心经济性强，但可选性转化较慢。
          tone: warning
        - label: 乐观情景
          low: 420
          mid: 460
          high: 500
          displayValue: $420B–$500B
          detail: Starship 与平台可选性风险下降，转化为可见经营杠杆。
          tone: positive
    approximationNotes: 区间是作者估算，锚定本报告保留的公开证据和情景逻辑。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: SpaceX 在验证和战略质量上得分极高，在估值缓冲和治理舒适度上弱一些。
    data:
      items:
        - label: 收入规模
          value: 9
          note: 2026 年监管文件显示，公司确实达到大型企业规模。
        - label: 客户与任务验证
          value: 9
          note: 零售、企业、政府和任务场景都有真实证据。
        - label: 战略护城河
          value: 9
          note: 业务宽度和一体化仍很难复制。
        - label: 经济性清晰度
          value: 7
          note: 比多数私营公司更好，但业务板块跨度和 AI 影响仍让口径复杂。
        - label: 估值缓冲
          value: 3
          note: 当前私募价格已经计入大量未来成功。
        - label: 治理舒适度
          value: 4
          note: 控制型公司结构压低外部制衡。
    approximationNotes: 评分是作者基于保留公开证据集作出的 1–10 分判断。
    claimRefs:
      - CV002
      - CV005
      - CV012
      - CV023
      - CV039
      - CV040
