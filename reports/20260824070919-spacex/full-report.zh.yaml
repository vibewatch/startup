      - number: '5.3'
        title: 架构和运营依赖复用、制造节奏与地面整合
        blocks:
          - type: paragraph
            body: >-
              SpaceX 的公开技术叙事始终强调，性能来自运营循环，而不是孤立参数。Falcon 9 的复用能力、Falcon Heavy 的通用核心逻辑、Dragon 的可复用太空舱架构，以及 Starship
              规划中的捕获再飞模式，都指向减少硬件报废、提高飞行节奏。连接端也有一个独立但相连的循环：Starlink
              Mobile、政府叠加层和企业渠道，依赖卫星进入正确轨道面、终端完成制造和安装、运营商合作激活，以及地面或监管瓶颈被打通。S-1 进一步说明，公司按整套系统吞吐量思考，并明确把发射能力描述为支撑
              Connectivity 和未来扩张的骨干。

              这个架构同时带来强项和复杂性。强项在于，相比外采发射或只运营狭窄航天器产品的公司，SpaceX
              能更紧密地协调运载器、航天器、卫星和服务。复杂性在于，故障会跨层传导。发射、卫星或频谱问题并非局部问题；它可能同时影响产品可用性、客户服务、测试节奏和路线图时间。
