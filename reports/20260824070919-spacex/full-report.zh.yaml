      - number: '1.3'
        title: 政府项目、估值历史与流动性信号
        blocks:
          - type: paragraph
            body: >-
              SpaceX 的公开融资图景仍由二级交易主导，而不是透明的新股融资。Forbes 报道，2024 年 6 月要约收购流程将 SpaceX 估值定在约 $210 billion；Yahoo
              Finance/Bloomberg 报道，2024 年 12 月内部交易以每股 $185 把估值推至约 $350 billion。这些事件说明公司经历了快速重估，但并没有提供 IPO
              招股书或经审计私募备忘录那样干净的财务披露。使用这些估值标记的正确方式，是把它们当作流动性信号：投资者愿意以大幅更高的价格成交，公司本身也参与回购，但底层的全公司损益表仍大多未公开。


              政府需求比私有市场经济性更容易找到证据。NASA 最初的 HLS 奖项给 SpaceX 提供了一个 $2.89 billion 的月球着陆器锚点，之后 Option B 修改又增加约 $1.15
              billion，并加入第二次载人着陆演示。CNBC 也把 SpaceX 描述为 NASA 和 Department of Defense 数十亿美元业务的获得者，这与 Starshield 和 Dragon
              呈现的更大图景一致。就尽调而言，公司的估值因此由高战略重要性、可见的经常性 Starlink 基础，以及政府背书的任务关键性共同支撑，而不是由上市公司式的经审计披露支撑。
