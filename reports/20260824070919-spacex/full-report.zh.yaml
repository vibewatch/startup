      - number: '4.4'
        title: 流动性充足，但义务和雄心远超普通风投故事
        blocks:
          - type: paragraph
            body: >-
              按普通后期风投意义看，SpaceX 已不像一家靠一轮接一轮融资续命的公司。文件称，截至 2026 年 3 月 31 日，公司持有现金及现金等价物 $15.852 billion，另有短期可交易证券 $7.823
              billion，当时循环信贷下可用额度为 $1.5 billion。文件还称，公司在 2026 年 5 月修订信贷安排，把额度提高到 $5.0 billion；2026 年 3 月签下一笔 $20.0
              billion 过桥贷款；并背负 $29.132 billion 合计本金债务，以及 $5.823 billion 最低租赁付款。除此之外，EchoStar 频谱交易预计对价约 $19.6
              billion，其中包括 $11.1 billion 股权，以及最高 $8.5 billion 与偿债或现金有关的对价。

              这些事实两面切。它们说明 SpaceX 融资能力极强，资产负债表能支撑一个比多数私人初创公司更大的工业平台。它们也说明，SpaceX
              的资本议程如今更接近基础设施、电信和超大规模算力，而不是传统发射创业公司。正确的尽调姿态因此不是“现金跑道永远解决了”，而是“流动性很充足，但债务、资本开支和战略承诺同样很大”。
