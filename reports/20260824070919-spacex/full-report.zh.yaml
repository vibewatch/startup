  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 责任方或尽调路径
    rows:
      - - Starship 商业化解锁
        - 可持续节奏、V3 部署，以及从测试转向运营时依赖项降低的精确时间表。
        - 这是判断当前可选性信用是否合理的最大变量。
        - 项目复盘与里程碑材料。
      - - 债务与再融资
        - 过桥贷款路径、利率敏感性和去杠杆计划。
        - 在完整私募价格下，大额债务的影响远大于困境价格下。
        - 资金部与 CFO 尽调。
      - - 分部可拆分性
        - 2026 年文件之后，清楚划分 Starlink、Space 与 AI 的经济边界。
        - 投资者需要知道自己到底在买什么、补贴什么。
        - 财务数据室与管理层问答。
      - - 政府集中度
        - 按 NASA、DoD 和其他大项目划分的收入与积压订单集中度。
        - 战略声望很好，但集中的里程碑收入会改写下行测算。
        - 客户集中度明细表。
      - - 治理与继任
        - Musk 控制治理周围的独立制衡机制和梯队深度。
        - 受控公司地位应得到明确折价，而不是默认忽略。
        - 董事会与治理尽调。
    notes: 这些问题是把对公司的钦佩转成纪律化承销文件所需的最低清单。
