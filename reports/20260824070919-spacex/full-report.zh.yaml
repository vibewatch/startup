      - number: '2.2'
        title: 用多重视角测算市场规模
        blocks:
          - type: paragraph
            body: >-
              测算 SpaceX 可触达市场，最干净的做法不是追一个标题数字，而是使用有边界的多重视角。第一层是发射定价和载荷经济性：SpaceX
              公布拼车发射价格和运载器能力，竞争对手也公布各自载荷范围，由此可以勾出可发射质量和任务类别的粗略市场地图。第二层是宽带采用：2024 年末的报道已经显示 Starlink 拥有 4 million 到接近 5
              million 客户，证明卫星互联网需求已经成为真实运营市场，而不是未来主义品类。第三层是移动与批发连接：2,500 架飞机签约、超过 1,000 架 United 飞机，以及直连手机运营商合作，说明企业和
              MNO 需求足够大，可以独立于住宅终端而重要。


              第四层是政府战略需求。NASA 的 Artemis/HLS 工作、Starshield，以及 FCC 支持的太空补充覆盖，都表明 SpaceX
              的一部分市场由美国政府优先事项创造或加速。第五层是长期上行情景：按公开价格计算的月球货运，以及地球到地球旅行等概念市场。这些未来切面具备战略重要性，但当前公开记录仍更支持把它们视为期权价值，而不是当下收入池。
