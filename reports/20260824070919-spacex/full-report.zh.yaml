      - number: '4.3'
        title: 业务产生强分部利润，但资本强度并不低
        blocks:
          - type: paragraph
            body: >-
              只有同时抓住两个事实，SpaceX 的财务故事才有吸引力。第一，Starlink 已经具备明确规模和盈利能力。文件称，2025 年消费者收入占 Connectivity 收入超过 60%；截至 2026 年 3
              月订阅用户达到 10.3 million；即使 ARPU 从 2024 年每月 $91 降至 2025 年 $81，又从 2025 年第一季度 $86 降至 2026 年第一季度
              $66，营业利润仍在扩大。也就是说，这门业务通过订阅用户增长、企业采用和更宽的服务供给，跑赢了价格稀释。

              第二，这仍是一个深度物理网络，折旧、补网、发射和基础设施负担很重。同一份文件称，资本化发射和卫星成本的折旧增加，部分抵消了连接业务收益；Starlink 卫星通常只有三到五年寿命。Space 端 2025
              年亏损，则由 Starship 开发加速和发射设施支出驱动。因此，虽然经常性服务层真实存在，经济模型却不是纯软件式：利润率取决于一台必须持续大规模投入卫星、终端、频谱和设施的发射与硬件机器。
