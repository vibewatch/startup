chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、足迹与平台范围
        blocks:
          - type: paragraph
            body: >-
              理解 SpaceX，最好把它看成一个垂直整合的发射与连接平台，而不是单一产品的火箭公司。官网仍把公司使命放在让生命成为多星球物种上，但本次审阅的页面显示出更宽的商业栈：Falcon 9 和 Falcon
              Heavy 负责发射，Dragon 负责货运和载人运输，Starship 面向下一代月球与火星物流，Starlink 提供宽带连接，Starshield
              则服务政府通信与感知。这个宽度很关键，因为公司变现的不是一次技术押注，而是发射、通信、政府项目，以及不断扩大的连接产品分发足迹。


              最基本的公司身份事实，一部分清晰，一部分仍在变化。FAA 材料仍称 SpaceX 总部位于 California 州 Hawthorne，而当前 Starship 页面把 Starbase 描述为 SpaceX
              总部所在地和 Starship 开发中心。与其强行套入单一总部叙事，更稳妥的尽调结论是：Hawthorne 仍是传统公司锚点，Starbase
              则已成为公司最重要未来平台的战略运营总部。后续章节应沿用的核心判断是，SpaceX 的运营重心已从 Southern California 扩展为由 Texas 主导的制造、测试和发射足迹。
