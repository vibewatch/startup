      - number: '2.3'
        title: 买方 / 用户 / 付款方地图
        blocks:
          - type: paragraph
            body: >-
              SpaceX 各市场的买方结构差异很大，所以公司的销售动作不能简化成一种采购模式。在发射业务里，买方通常是卫星运营商或政府任务办公室，用户是载荷所有者和任务团队，付款方是资本开支或项目预算。在 Starlink
              住宅场景里，买方、用户和付款方往往合并为一个家庭或小企业。在航空场景里，买方是航空公司，终端用户是乘客，商业逻辑可能是留存、品牌差异化或附带经济性，而不是直接 Wi-Fi
              变现。在直连手机场景里，买方是移动网络运营商，终端用户是无线用户，经济模型是批发网络延伸，而不是终端销售。


              买方多样性具备战略正面意义，因为它降低了公司对单一预算周期或单一采用触发因素的依赖。但这也意味着商业化推进复杂度很高。SpaceX
              必须同时赢下政府任务保障、企业部署信任、航空公司改装执行和消费者网络满意度。市场之所以大，正是因为它跨多个分部；难点也在这里：每个分部都有不同要求、切换成本和监管关口。
