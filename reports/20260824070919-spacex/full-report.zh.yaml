      - number: '4.5'
        title: 财务结论——强于多数私有同行，但仍不能完全自下而上测算
        blocks:
          - type: paragraph
            body: >-
              相对同行，SpaceX 披露的规模差距巨大。Rocket Lab 的 2026 年第二季度文件显示，上半年收入 $434.4 million、现金 $2.129 billion；AST SpaceMobile
              的文件显示，上半年收入 $46.255 million、现金 $2.288 billion。Amazon 仍在投入最高 $10 billion 建设 Kuiper，Eutelsat-OneWeb
              的组合则凸显，一些竞争者仍在押注企业和政府经济性，而不是大众消费者 ARPU。在这个背景下，SpaceX 披露的 2025 年收入基础、Connectivity
              分部盈利能力和融资渠道，明显把它放在另一个财务层级。

              即便如此，本章仍不会说仅凭公开来源就能完整测算这家公司。文件还没有给出清晰的发射毛利率桥、Starship
              项目级回报门槛、订阅用户流失队列、终端补贴经济性，或按国家、运营商、航空公司和政府客户拆分的集中度数据。这门业务显然比普通私人航天公司更容易融资。它还没有透明到让投资者可以跳过对已实现单位经济性的尽调。
