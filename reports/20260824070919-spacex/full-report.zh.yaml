            body: >-
              对一家私人公司而言，公开采用证明在漏斗顶端异常强。TechCrunch 报道 Starlink 订阅用户在 2024 年 9 月达到 4 million；CNBC 报道到 2024 年 11 月用户基数接近 5
              million；S-1 后来披露，截至 2026 年 3 月约有 10.3 million
              订阅用户。同一份文件称，这些订阅用户不包括托管型企业和政府账户，因此披露数量低估了总客户关系。采用也在部署场景上可见。CNBC 报道 United 超大交易后约 2,500 架飞机签约，Hawaiian
              公开上线免费 Starlink 连接，SpaceX 和 T-Mobile 宣布通过 Starlink 卫星发出首批短信，说明运营商伙伴模型已经从概念进入现场验证。

              限制在于分母质量。公开来源表明采用真实且快速增长，但没有完整呈现激活到留存的转换、国家组合、合同规模分布，或新闻公告后各条客户线贡献多少收入。
