      - number: '1.2'
        title: 产品、规模信号与商业范围
        blocks:
          - type: paragraph
            body: >-
              即使缺少经审计的财务细节，本次审阅的来源包也足以支持一个强基准判断：SpaceX 产品宽度大，运营规模已经成形。Falcon 9 和 Falcon Heavy 公布的载荷参数仍支撑 SpaceX
              的发射领先地位；Dragon 仍是当前唯一能把有意义货物带回地球的私人航天器，也是 NASA 运输任务的核心资产。Starship
              仍处开发阶段，但官方材料把它定位为完全可复用系统，用来承接未来月球、火星和高容量卫星部署需求。拼车发射页面还给出一个重要商业细节：SpaceX 继续用标准化预订和可见的低端价格地板，把价格发现开放给小载荷客户。


              Starlink 周围的采用信号，是 SpaceX 已经运营规模化经常性收入业务的最清晰证明，哪怕全公司收入仍不透明。TechCrunch 记录其客户数在 2024 年 9 月跃升至 4 million；CNBC
              到 2024 年 11 月把这一数字推至接近 5 million，并描述近 7,000 颗卫星在轨。CNBC 的航空报道还显示，United 交易后已有 2,500 架飞机签约，这把 Starlink
              从农村消费者故事推进成跨家庭、航空、海事和直连手机合作的多分部连接业务。
