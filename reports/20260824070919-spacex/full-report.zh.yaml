      - number: '1.4'
        title: 领导层、里程碑与反向背景
        blocks:
          - type: paragraph
            body: >-
              领导层图景在顶层可读，往下则不透明。第三方报道清楚标出 Elon Musk 是 CEO，Gwynne Shotwell 是总裁兼 COO；即便没有抓取到董事会治理页面，这也足以判断 SpaceX
              仍高度依赖关键人物。公开材料没有解决的问题，是当前完整董事会名单、股权结构表，以及私有市场投资者评估控制权、关联方影响或少数股东保护时最关心的治理机制。这个缺口足够重要，应作为尽调缺口继续带入，而不是被抹平。


              公司概况里的反向面，已经无法与 Starship 的规模雄心分开。FAA 批准提高 Boca Chica 年度发射节奏，但 CNBC、BBC 和 ProPublica
              都说明，监管不是一个打勾式细节，而是仍在发酵的尽调问题。Starship 2025 年 1 月爆炸造成停飞和财产损害报告；ProPublica
              则记录了反复发射失败、紧急空域干预以及上升的航空安全批评。净判断应当平衡但不能天真：SpaceX
              拥有无可匹敌的发射雄心和独特宽广的产品栈，但其最重要的未来平台仍背负真实的执行风险和监管外部性，后续章节必须把它作为一阶问题处理，而不是附带事项。
