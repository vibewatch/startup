      - number: '5.2'
        title: Falcon、Dragon 与 Starlink 是经飞行验证的层；Starship 是前沿层
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调区分，是成熟层和前沿层。Falcon 9 和 Falcon Heavy 是已验证的运营系统，公开载荷范围、可复用一级逻辑和高任务成功率叙事都很清楚。Dragon
              是已经运行的航天器产品，拥有货运和载人履历；SpaceX 和 NASA 页面都把它描述为可信赖的宇航员运输系统，也能把有意义货物从轨道带回。Starlink 也不再是概念。S-1 称，截至 2026 年 3
              月，公司在 164 个国家运营超过 9,600 颗宽带和移动卫星；官方与第三方证据也显示，其产品布局同时覆盖消费者、企业、航空、海事、漫游和移动网络运营商渠道。

              相比之下，Starship 具备战略核心地位，但运营成熟度更早。SpaceX 自己的 Starship
              页面以罕见具体的方式描述了架构、复用目标、油船补给概念和助推器捕获逻辑；内容中心也显示，飞行测试序列一直延续到 2026 年。但文件仍称 Starship
              处于开发中，目前多数项目成本通过研发费用化。正确的技术判断因此不是“处处未经验证”或“已经解决”，而是“Falcon/Dragon/Starlink 已得到验证，Starship 仍在验证中”。
