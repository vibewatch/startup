  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：发射、连接与政府太空基础设施
        blocks:
          - type: paragraph
            body: >-
              不能把 SpaceX 塞进一个边界整齐的单一市场里分析。本次审阅的来源显示，至少有五个具备经济意义的市场切面：发射服务、标准化拼车发射接入、Starlink
              宽带、直连手机批发连接，以及政府探索或安全通信系统。因此，正确的市场边界应排除整个下游“太空经济”，而聚焦会选择 SpaceX 运载器、SpaceX 连接或 SpaceX
              政府系统的支出。这个区分很重要：卫星制造收入、别人拿走的下游电信 ARPU，或泛太空赋能 GDP，都不等同于能够归属于 SpaceX 的一美元。


              同时，公司的内部飞轮模糊了市场参与和自我生成需求之间的边界。发射清单里 Starlink
              任务占比很高，这意味着发射节奏和连接增长彼此强化。因此，公司不只是向外部市场销售；它用自有运输栈搭建自己的经常性需求平台。这让 SpaceX 比发射服务商更宽，也让单一 TAM 数字更难量清。
