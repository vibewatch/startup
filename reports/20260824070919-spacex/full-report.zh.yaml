  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层覆盖消费者、企业、运营商、政府和任务买家
        blocks:
          - type: paragraph
            body: >-
              不能用一种买方原型理解 SpaceX 的客户基础。S-1 和公开部署证据显示，公司至少有五条主要客户线：零售 Starlink 订阅用户；航空公司、船舶等企业和移动用户；使用 Starlink Mobile
              的移动网络运营商；使用发射、Starshield 或任务服务的政府和国家安全买家；以及使用 Dragon、研究或月球开发能力的 NASA
              或私人航天客户。这很重要，因为公司并不依赖一种销售动作。消费者订阅增长遵循广泛可得模型，航空公司和运营商需要安装与集成周期，政府或 NASA 项目则走更慢、更重信任的采购路径。

              这个分层也改变了投资者读取客户证明的方式。一个新零售订阅用户不等于一次航空公司铺装，一次航空公司铺装也不等于一个 NASA 项目。只有当这些线互相强化，而不是被误认为同一种证据时，客户故事才最有力。
