  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入结构已看清，Starlink 扛起损益
        blocks:
          - type: paragraph
            body: >-
              相比上一轮私有市场报道周期，最重要的变化是 SpaceX 的 2026 年 S-1 把分部图景讲清了。文件称，2025 年合并收入达到 $18.674 billion；Connectivity 分部（主要是
              Starlink）贡献其中 $11.387 billion，同时产生 $4.423 billion 营业利润和 $7.168 billion 分部调整后 EBITDA。相比之下，Space 分部 2025
              年收入为 $4.086 billion，但在承担重大 Starship 和发射设施投资后录得 $657 million 营业亏损。这个组合很关键，因为它改变了投资判断框架：SpaceX
              已不是一个发射业务外加卫星副项目的公司。公开证据现在更支持相反解读。发射、Dragon、Starshield 和探索项目仍具战略意义，但 Starlink 才是支撑更广平台的主导收入和利润引擎。

              收入质量仍不完美。文件给出了分部总额和部分业务组合评论，但没有完整披露逐产品毛利率、递延收入瀑布、队列留存或合同集中度。投资者现在可以比过去更有把握地判断大致组合，但若没有管理层尽调材料，仍无法为每条主要收入线搭出干净的自下而上模型。
