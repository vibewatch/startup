      - number: '8.2'
        title: 正反逻辑都有真实证据支撑
        blocks:
          - type: paragraph
            body: >-
              支持高估值的逻辑很直接。SpaceX 把公开市场通常分开定价的业务线组合到一起：发射、卫星宽带、Direct-to-cell 可选性、政府连接和载人航天信任。文件和客户证据显示，Starlink
              不只是规模大，运营层面已经盈利；NASA、Starshield 和发射节奏则创造了多数同行难以匹配的稀缺价值。这种组合足以支撑相对狭义卫星或发射可比公司的战略溢价。


              反向逻辑同样真实。Starship 仍是 V3 卫星、Direct-to-cell
              放量和更广泛可选性的主要解锁点，因此未来估值中很大一部分仍压在一个很难的项目上。风险章节也已经说明，监管、安全外部性和治理集中并不是装饰性问题。因此，在已经抬高的标记上买入，就是同时为一门有真实证据、也有真实未解传导风险的生意付钱。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
