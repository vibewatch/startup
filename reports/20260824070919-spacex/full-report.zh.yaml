      - number: '7.4'
        title: 合作伙伴、政府、供应商和创始人依赖增加了非技术脆弱性
        blocks:
          - type: paragraph
            body: >-
              SpaceX 的垂直整合是一项优势，但这门生意并不独立于交易对手。文件称，增长需要协调供应商、承包商、发射场、监管机构和合作伙伴生态。Direct-to-cell 依赖 FCC
              补充覆盖框架下的地面频谱合作；Starshield 和重大任务项目依赖政府需求与政府验收；航空公司或移动出行客户则依赖危险窗口和运营可预测性，其中一部分不在他们掌控之内。SpaceX
              从发射服务商扩展为连接和防务基础设施后，合作伙伴风险更像公用事业或政府平台风险，而不是典型硬件创业公司风险。

              治理又加了一层。S-1 招股说明书称，Elon Musk 将控制股东结果，SpaceX
              预期会依赖受控公司豁免。这不意味着治理失灵必然发生，但确实意味着，如果战略、风险偏好、融资或继任假设发生变化，外部投资人可动用的正式杠杆会更少。一家公司同时押注发射、电信、AI
              基础设施和防务相关服务时，控制权集中是实质剩余风险，不是风格脚注。
            claimRefs:
              - CR023
              - CR024
