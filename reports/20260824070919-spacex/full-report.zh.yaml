      - - 航司改装势头
        - 驱动
        - 2,500 架飞机积压订单和 United 合约
        - 大合同能让企业分销快速扩张
        - 在部分地区，移动场景可能比住宅宽带增长更快
      - - 政府任务优先级
        - 驱动
        - HLS、Starshield 和 FCC 框架
        - 公共部门需求能降低战略相邻市场的风险
        - 政府需求放大发射与安全通信的总可用市场（TAM）
      - - 频谱与牌照
        - 约束
        - FCC SCS 框架与 FAA 发射审批
        - 监管既能打开可触达市场，也能卡住市场进入
        - 落地靠政策与合规，不只是硬件
      - - 多轨道竞争者
        - 约束
        - SES、Viasat、Telesat、AST 与 Amazon Leo
        - 市场在增长，但并非无人竞争
        - 定价与功能优势转化不会毫无摩擦
      - - 运载器成熟度
        - 约束
        - New Glenn 复用未达成；Starship 面临监管；Neutron 仍未首飞
        - 宣称的能力和市场份额要靠飞行履历支撑
        - 理论需求不会都按期转化
    notes: 扩大 SpaceX 市场的同一组因素，也会成为其兑现市场的瓶颈。
