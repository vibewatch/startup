      - number: '5.4'
        title: 信任与质量来自飞行履历、政府接受和严密控制
        blocks:
          - type: paragraph
            body: >-
              SpaceX 的信任位置，与其说来自抽象认证语言，不如说来自反复运营证明。Falcon 页面和 S-1 强调复用和任务成功。NASA 对商业载人航天的表述，以及 SpaceX 自己的载人航天页面，显示
              Dragon 已跨过从有趣私人硬件到政府信任运输系统的门槛。Starshield 把这种信任逻辑延伸到政府安全用例；FCC 直连手机框架和 FAA 对 Starship
              的监督流程则说明，未来能力仍需要持续监管对齐。

              但质量控制不应被误读为没有风险。文件明确区分 Falcon 任务成功指标与 Starship 测试；关于 Starship
              碎片和航空公司中断的反向报道也显示，公众对实验失败的容忍并非无限。本章正确的尽调姿态，是把 Falcon 和 Dragon 视为可信，Starlink 视为已规模化但运营仍复杂，Starship
              则是高潜力系统，其质量论证仍在公开场景中搭建。
