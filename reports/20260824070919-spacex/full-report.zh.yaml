      - number: '2.4'
        title: 增长驱动、约束与多轨道替代方案
        blocks:
          - type: paragraph
            body: >-
              来源包里最强的采用驱动，都来自现有基础设施的结构性缺口。Amazon Leo 和 AST SpaceMobile
              都明确描绘了全球覆盖问题：仍有数十亿人缺少可靠高速互联网接入，地球大部分表面仍在传统基站覆盖之外。SES、Viasat 和 Telesat 也证明，企业和政府场景同样存在真实需求；但它们也说明，市场并不空白。既有
              GEO、MEO 和新兴 LEO 网络，已经用不同的延迟、保障、安全和吞吐权衡，覆盖了许多用例。


              发射端的竞争集合也在扩大。Neutron、Vulcan、Ariane 6 和 New Glenn 都想切下同一块商业或政府运输需求，即使它们并非都能与 Falcon 9、Falcon Heavy 或
              Starship 一一替代。最大的非需求约束是监管和安全。直连手机依赖频谱框架，Starship
              发射节奏依赖空域整合和发射许可。也就是说，市场规模本身并不决定可获得份额；执行、许可和信任，才决定理论需求能否转化为持久份额。
