      - number: '7.5'
        title: 财务模型能承受很多压力，但前提是资本开支、杠杆和竞争仍可融资
        blocks:
          - type: paragraph
            body: >-
              SpaceX 现在的规模已经到了必须认真看待资产负债表风险的阶段，即便收入增长仍然强劲。S-1 招股说明书和 CNBC 报道显示，公司资本开支异常庞大，AI 是主要驱动，但 Space 和
              Connectivity 也仍然烧钱；文件还披露，截至 2026 年 3 月 31 日，未偿本金债务超过 $29
              billion。这不意味着公司马上承压，尤其在公开市场通道临近时更是如此，但它意味着执行滑坡会转化为真实融资压力，而不只是增长放慢。

              竞争时点也增加紧迫性。CNBC 2026 年报道显示，Amazon 获 FCC 批准的 LEO 建设在扩张；2024 年中国巨型星座报道则表明，地缘政治和产业替代方案正在增多。SpaceX
              仍在规模和节奏上领先，但一家如此激进投入的公司，不能假设先发就必然带来持久定价权或顺滑监管待遇。因此，财务风险不是「SpaceX
              明天没钱了」；而是公司需要持续拿到大额、时点合适的资本，同时还要在多个战线守住执行领先。
            claimRefs:
