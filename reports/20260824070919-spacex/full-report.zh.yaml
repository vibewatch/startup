              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 当前价格支撑比过去更强，但按公开证据看倍数仍然偏贵
        blocks:
          - type: paragraph
            body: >-
              相比更早的老股要约阶段，最重要的变化是 S-1 招股说明书让估值可以和经营事实真正接上。按文件披露的 2025 年收入 $18.674 billion 计算，$210 billion 估值约等于 11.2x
              收入，$350 billion 估值约等于 18.7x 收入。对一个独特基础设施平台来说，这些倍数并非不可能，但在完全资本化风险之前已经是溢价估值。与此同时，文件仍显示巨额资本开支、超过 $29 billion
              的本金债务，以及公司层面的 GAAP 亏损，尽管 Starlink 已经盈利。


              这组事实说明，当前标记更应被视为偏乐观价格，而不是中性入场点。估值不再只靠故事支撑；真实收入和利润中心已经存在。但它也已经反映了几项预期：SpaceX 会继续复合式放大规模，Starship
              会解锁下一段增长，公司在为异常宽的路线图融资时，融资市场也会持续支持。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
      - number: '8.4'
        title: 情景测算支持一个区间，而不是对当前标记一概背书
        blocks:
          - type: paragraph
            body: >-
              这里更合适的估值方法是情景法，而不是只看可比公司。乐观情景下，SpaceX 证明 Starship 可重复进展，按节奏部署 V3，继续扩大 Starlink
              的利润引擎，并把战略宽度转化为市场承销意愿：投资人愿意把公司看成定义品类的基础设施平台，而不是传统航天主承包商。在这种世界里，高于当前私募标记的估值可以成立。


              基准情景没有那么宽容。它假设 Starlink 仍然强劲，发射和政府需求仍然真实，但 Starship
              商业化去风险耗时更长，资本开支叠加杠杆，让投资人无法同时给所有业务线支付峰值战略溢价。悲观情景不需要业务崩盘；只要 Starship
              爬坡更慢、融资条件收紧，或监管拖累更重就够了。在这些条件下，当前标记更像天花板，而不是便宜货。
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
