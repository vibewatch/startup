        title: 扩张逻辑强，但公开留存数据仍薄
        blocks:
          - type: paragraph
            body: >-
              关于持久性的最佳论证，不是指标完美，而是结构成立。消费者采用持续上升，航空似乎正从少数示范部署走向更广泛的已安装机队，Starlink Mobile 借运营商合作扩张，可以在不要求 SpaceX
              直接销售每个账户的情况下延伸客户覆盖。NASA 和政府牵引项目增加声誉和期限，哪怕收入确认由里程碑驱动。因此，客户扩张逻辑看起来可信：发射和网络基础设施创造更多用例，反过来又在各分部创造更多可引用客户。

              公开记录在正式留存上薄得多。没有可靠的 NRR 或 GRR 披露，合同期限只能部分推断，流失没有按产品拆分，也缺少按收入计的客户集中度。投资者可以判断扩张正在发生；但还不能准确判断每个子分部有多粘、多分散。
