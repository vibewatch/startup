companyProfile:
  summary: >-
    SpaceX is an integrated launch-and-connectivity company founded in 2002 by Elon Musk. Public evidence now supports a business with large-scale launch operations, Dragon and Artemis-linked mission credibility, millions of Starlink users, expanding enterprise and carrier adoption, and a government-facing Starshield layer. The 2026 filing changes the underwriting frame materially by showing that Starlink is the economic center of gravity while Starship remains the main future unlock.
