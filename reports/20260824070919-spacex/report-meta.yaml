  topStrengths:
    - Starlink is already large and profitable at the operating level, giving SpaceX a real economic engine rather than only a future promise.
    - Product breadth is unmatched across reusable launch, spacecraft, connectivity, government communications, and mission credibility.
    - NASA, government, airline, and carrier proof support a strategic premium that narrower public comps cannot fully capture.
    - The 2026 S-1 provides far stronger disclosure than most private companies at comparable valuations.
  topRisks:
    - Starship is still the largest value unlock and the largest single execution dependency.
    - The filing also reveals heavy capex, large debt, and more complex economics than the headline Starlink story suggests.
    - Controlled-company governance materially limits outside-investor checks on strategy and risk appetite.
    - Launch safety, airspace, and regulatory externalities can slow the cadence needed to justify full optionality credit.
  unresolvedGaps:
    - Exact debt-refinancing path and rate sensitivity remain incomplete from the public record.
    - Public evidence does not clearly disclose revenue concentration by NASA, DoD, or other major government programs.
    - Investors still need a cleaner economic bridge between Starlink, Space, and AI-related segment complexity.
    - Exact timing for when Starship becomes a reliable commercial unlock rather than a mostly developmental one remains a key diligence item.
