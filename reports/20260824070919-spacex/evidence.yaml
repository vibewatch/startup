evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, voting structure, and cap table showing control and minority-protection terms.
    whyItMatters: >-
      Company Overview must establish whether the business is still effectively single-controller driven and how outside
      investors are protected.
    diligencePath: Request the latest board list, stock classes, and cap table from management or a data room.
    relatedQuestionRefs:
      - QO019
  - type: missing-source
    severity: material
    topic: company-wide financial disclosure
    missingEvidence: >-
      Audited company-wide revenue, margin, cash, debt, and segment-mix disclosure for launch, Starlink, and government
      lines.
    whyItMatters: Public valuation marks are hard to underwrite without a verified income statement and cash-flow view.
    diligencePath: Obtain audited financials or lender-grade monthly reporting before treating secondary marks as intrinsic value.
    relatedQuestionRefs:
      - QO016
  - type: stale
    severity: minor
    topic: starlink scale
    missingEvidence: An independently corroborated 2025-2026 Starlink subscriber and satellite count update.
    whyItMatters: >-
      The strongest scale proof in the current pack is from late 2024 plus 2026 company-authored updates, not a fresh
      audited or regulator-verified count.
    diligencePath: Seek a 2025-2026 regulator filing, audited prospectus extract, or independent market-data update.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: minor
    topic: leadership-governance detail
    missingEvidence: A formal management page and broader board/governance disclosure.
    whyItMatters: The source pack clearly surfaces Musk and Shotwell but not the rest of the governance stack.
    diligencePath: Request the management presentation or corporate-governance packet.
    relatedQuestionRefs:
      - QO005
      - QO019
  - type: conflicting-data
    severity: minor
    topic: headquarters framing
    missingEvidence: A formal company statement reconciling Hawthorne versus Starbase as headquarters.
    whyItMatters: This affects how later chapters discuss operating footprint and regulatory concentration.
    diligencePath: Use official corporate or legal-entity disclosures to confirm the canonical HQ convention.
    relatedQuestionRefs:
      - QO002
      - QO003
  - type: private-evidence-only
    severity: minor
    topic: valuation chronology
    missingEvidence: The exact terms, participants, and secondary volume for each 2024 liquidity event.
    whyItMatters: Secondary valuations can overstate conviction if the float is thin or transactions are highly structured.
    diligencePath: Request tender-offer materials or cap-table administrator records.
    relatedQuestionRefs:
      - QO014
      - QO015
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table coverage
    missingEvidence: A complete current management roster and board-governance mapping for SpaceX.
    whyItMatters: >-
      The public source pack clearly surfaces top visible executives but not the full leadership and governance
      structure.
    diligencePath: Request the current management list, board roster, and reporting lines from management or investor materials.
    relatedQuestionRefs:
      - QO005
      - QO019
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone table coverage
    missingEvidence: >-
      A complete company-verified chronology that reconciles every major financing, launch, and regulatory milestone
      into one authoritative sequence.
    whyItMatters: >-
      Later chapters rely on milestone ordering, but the public record emphasizes selected events rather than a single
      canonical timeline.
    diligencePath: Request the official historical timeline or internal chronology used by the company and lead investors.
    relatedQuestionRefs:
      - QO014
      - QO015
      - QO017
    relatedTableRefs:
      - TO005
  - type: private-evidence-only
    severity: material
    topic: segment economics
    missingEvidence: >-
      A segmented revenue bridge across launch, residential Starlink, enterprise, aviation, maritime, and
      direct-to-cell.
    whyItMatters: Without segment economics, a large market map still does not show which pools are profitable or most monetizable.
    diligencePath: Request management reporting or a board deck with segment revenue and margin splits.
    relatedQuestionRefs:
      - QM020
  - type: conflicting-data
    severity: minor
    topic: single-number TAM
    missingEvidence: >-
      A consistent public methodology that converts launch, connectivity, wholesale, and lunar adjacencies into one
      comparable TAM construct.
    whyItMatters: Public sources use incompatible units, which can exaggerate perceived market size if they are summed.
    diligencePath: Build a bottoms-up segment model with explicit assumptions and avoid summing non-comparable market pools.
    relatedQuestionRefs:
      - QM017
      - QM025
  - type: missing-source
    severity: minor
    topic: maritime adoption proof
    missingEvidence: Fresh, named public maritime customer deployment evidence equivalent in quality to the aviation backlog evidence.
    whyItMatters: Starlink clearly serves mobility markets, but the reviewed pack is much stronger on aviation than on maritime.
    diligencePath: Collect official cruise, merchant, or offshore deployment announcements and renewal metrics.
    relatedQuestionRefs:
      - QM008
      - QM024
  - type: stale
    severity: minor
    topic: current Starlink subscriber mix
    missingEvidence: A 2025-2026 independent breakout of residential versus enterprise versus mobility Starlink subscribers.
    whyItMatters: Late-2024 scale proves demand, but not the current segment mix driving marginal growth.
    diligencePath: Use a recent independent market-data or regulatory source to refresh subscriber segmentation.
    relatedQuestionRefs:
      - QM007
      - QM022
  - type: private-evidence-only
    severity: minor
    topic: internal versus external launch revenue
    missingEvidence: A clean split between internal Starlink launches and revenue-generating external launch missions.
    whyItMatters: >-
      Launch cadence is an important market signal, but it can overstate addressable third-party revenue if most
      missions are internal.
    diligencePath: Request an external customer mission count and launch-revenue disclosure by year.
    relatedQuestionRefs:
      - QM004
      - QM023
  - type: private-evidence-only
    severity: material
    topic: competitor pricing transparency
    missingEvidence: Dedicated-launch pricing and enterprise-connectivity pricing for rivals on a like-for-like basis.
    whyItMatters: >-
      Platform comparisons are more reliable than economic comparisons when most competitors do not publish equivalent
      price points.
    diligencePath: Collect customer quotes, procurement records, or investor materials that disclose competitor packaging economics.
    relatedQuestionRefs:
      - QP017
  - type: missing-source
    severity: minor
    topic: maritime and cruise-line competitive proof
    missingEvidence: Comparable fresh public deployment evidence for maritime competition similar to the airline backlog evidence.
    whyItMatters: The current pack is stronger on aviation than on maritime, which may bias the read on distribution strength.
    diligencePath: Add named maritime customer case studies or fleet deployments in the next refresh.
    relatedQuestionRefs:
      - QP020
  - type: stale
    severity: minor
    topic: current relative launch cadence
    missingEvidence: A current independent 2025-2026 launch-share update comparing SpaceX and competitors.
    whyItMatters: Heritage matters, but cadence gaps can narrow over time.
    diligencePath: Refresh with an independent launch database or industry report.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: minor
    topic: internal launch economics
    missingEvidence: A clean split between internal Starlink launch economics and third-party mission economics.
    whyItMatters: Captive demand is a moat, but it can obscure true external pricing power.
    diligencePath: Request external mission mix and launch-margin reporting.
    relatedQuestionRefs:
      - QP016
      - QP017
  - type: conflicting-data
    severity: minor
    topic: direct-to-cell winner-take-most assumption
    missingEvidence: Carrier-level evidence on whether MNOs will single-home or multi-home over time.
    whyItMatters: Distribution power may prove less durable if carriers diversify partner exposure.
    diligencePath: Track exclusive clauses, renewals, and multi-partner arrangements by geography.
    relatedQuestionRefs:
      - QP019
      - QP023
  - type: private-evidence-only
    severity: material
    topic: launch gross margin
    relatedQuestionRefs:
      - QI018
    missingEvidence: >-
      Falcon and Dragon realized gross margin by mission class, including internal-transfer pricing for Starlink
      launches.
    whyItMatters: >-
      Segment-level Space revenue and losses do not reveal the economics of the mature launch franchise once Starship
      development is separated out.
    diligencePath: Request vehicle-level income statements, mission insurance history, and internal transfer-pricing policy.
  - type: private-evidence-only
    severity: material
    topic: starlink hardware subsidy
    relatedQuestionRefs:
      - QI022
    missingEvidence: Terminal bill of materials, subsidy per activation, refurbishment rates, and payback by region and product line.
