- id: bottom-line
  title: 'Diligence Bottom Line: SpaceX Competes Against Heritage, Distribution, and Second-Source Demand'
  body: 'The chapter’s bottom line is that SpaceX has the strongest integrated platform in the reviewed competitive set, but not an uncontestable one. Its best assets are proven reusability, launch cadence, a broadening Starlink installed base, visible airline backlog, and extension into government-secure and lunar markets. Its biggest vulnerabilities are exactly where buyers may prefer alternatives for political, assurance, or diversification reasons: sovereign launch access, direct-to-cell carrier leverage, and any area where Starship’s future capability still outruns current operational proof.


    The practical diligence question is therefore not “who competes with SpaceX?” but “which layer of the SpaceX stack is most exposed to credible substitutes?” Today the most durable moat appears around Falcon cadence and Starlink’s early scale. The least settled layers are Starship-dominated future markets and wholesale connectivity segments where the carrier, not the satellite operator, may own the customer relationship.'
