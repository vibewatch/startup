- id: operations-and-switching
  title: Operations, Manufacturing, and Switching Costs Favor the Fleets Already Flying
  body: 'Switching costs vary sharply across SpaceX’s competitive arenas, but in most of them, operational proof matters more than marketing. In launch, heritage and mission assurance make requalification expensive. In airline connectivity, retrofits, certifications, and downtime create switching friction even when airlines are open to multiple vendors. In direct-to-cell, distribution control sits with the carriers and regulators, not just the satellite operator.


    SpaceX’s advantage is that it already combines flight history, active constellation deployment, and a growing partner network. The weakness is that some of its newest competitive fronts—especially direct-to-cell and Starship—still depend on outside approvals, public-safety acceptance, and customer patience. Competitors do not need to beat SpaceX everywhere; they only need to win enough trusted niches to slow the compounding effect of the SpaceX flywheel.'
