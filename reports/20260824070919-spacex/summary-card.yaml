summary:
  headline: >-
    SpaceX is one of the rare private companies whose public evidence supports both a genuine strategic premium and a
    disciplined refusal to chase the current price; the right call is track, because the business is exceptional but the
    valuation already assumes too much future Starship and capital-markets success.
