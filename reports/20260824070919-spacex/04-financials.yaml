  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: launch gross margin
    relatedQuestionRefs:
    - QI018
    missingEvidence: Falcon and Dragon realized gross margin by mission class, including internal-transfer pricing for Starlink launches.
    whyItMatters: Segment-level Space revenue and losses do not reveal the economics of the mature launch franchise once Starship development is separated out.
    diligencePath: Request vehicle-level income statements, mission insurance history, and internal transfer-pricing policy.
  - type: private-evidence-only
    severity: material
    topic: starlink hardware subsidy
    relatedQuestionRefs:
    - QI022
    missingEvidence: Terminal bill of materials, subsidy per activation, refurbishment rates, and payback by region and product line.
    whyItMatters: Reported ARPU and segment profit do not show how much cash is consumed to acquire and retain users.
    diligencePath: Request subscriber-acquisition cohorts with hardware gross margin, churn, and payback curves.
  - type: private-evidence-only
    severity: high
    topic: deferred revenue and working capital
    relatedQuestionRefs:
    - QI019
    missingEvidence: Product-level deferred revenue, accounts-receivable aging by segment, and cash-conversion by major revenue surface.
    whyItMatters: Strong segment growth can still mask weaker collection quality or front-loaded contract economics.
    diligencePath: Request deferred-revenue waterfall, top-customer payment terms, and quarterly cash-conversion bridge.
  - type: private-evidence-only
    severity: high
    topic: customer concentration
    missingEvidence: Revenue concentration by country, airline, carrier, enterprise customer, and government program.
    whyItMatters: Large contract exposure can materially alter the durability of enterprise, mobility, and government revenue.
    diligencePath: Request top-20 customer schedule and concentration thresholds by segment.
  - type: estimation-risk
    severity: medium
    topic: valuation versus operating cash generation
    missingEvidence: Public data tying secondary-share valuation marks to free cash flow or normalized EBITDA by business line.
    whyItMatters: Private valuation momentum can obscure whether long-run shareholder returns are supported by operating economics rather than scarcity.
    diligencePath: Reconcile tender-offer marks to audited cash flow, debt-adjusted enterprise value, and scenario-based segment earnings.
