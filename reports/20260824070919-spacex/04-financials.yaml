- id: verdict-and-diligence-blockers
  title: Financial Verdict — Stronger Than Most Private Peers, Still Not Fully Underwritable Bottom-Up
  body: >-
    Relative to peers, the reported scale gap is enormous. Rocket Lab's 2026 second-quarter filing showed $434.4 million of first-half revenue and $2.129 billion of cash; AST SpaceMobile's filing showed $46.255 million of first-half revenue and $2.288 billion of cash. Amazon is still spending up to $10 billion to build Kuiper, and the Eutelsat-OneWeb combination highlights that some competitors are still betting on enterprise and government economics rather than mass consumer ARPU. Against that backdrop, SpaceX's reported 2025 revenue base, segment profitability in Connectivity, and financing access clearly place it in a different financial tier.

    Even so, the chapter stops short of calling the company fully underwritable from public sources alone. The filing does not yet give a clean launch gross-margin bridge, Starship project-level return thresholds, subscriber churn cohorts, terminal subsidy economics, or concentration data by country, carrier, airline, or government customer. The business is clearly more financeable than the average private aerospace company. It is not yet public-data transparent enough to make diligence on realized unit economics optional.
