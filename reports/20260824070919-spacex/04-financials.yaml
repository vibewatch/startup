- id: cost-structure-and-unit-economics
  title: The Business Produces Strong Segment Profit, but Not Low Capital Intensity
  body: >-
    The financial story is attractive only if the investor holds two ideas at once. First, Starlink now has clear scale and profitability. The filing says consumer revenue represented more than 60% of Connectivity revenue in 2025, subscriber count reached 10.3 million by March 2026, and operating income expanded despite ARPU moving down from $91 per month in 2024 to $81 in 2025 and from $86 in the first quarter of 2025 to $66 in the first quarter of 2026. That means the business has been able to outrun price dilution through subscriber growth, enterprise adoption, and broader service offerings.

    Second, this is still a deeply physical network with heavy depreciation, replenishment, launch, and infrastructure burdens. The same filing says higher depreciation of capitalized launch and satellite costs partially offset connectivity gains, and that Starlink satellites generally last only three to five years. On the Space side, 2025 losses were driven by accelerated Starship development and launch-facility spend. So while the recurring-service layer is real, the economics are not software-pure: margin depends on a launch-and-hardware machine that must keep funding satellites, terminals, spectrum, and facilities at scale.
