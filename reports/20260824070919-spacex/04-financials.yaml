  - Public value / status
  - Why it matters
  - Confidence
  - Diligence ask
  rows:
  - - Cash and cash equivalents
    - $15.852B as of March 31 2026
    - Core liquidity buffer for launches, satellites, terminals, and AI investments
    - high
    - Request unrestricted vs operationally ring-fenced cash
  - - Short-term marketable securities
    - $7.823B as of March 31 2026
    - Adds near-liquid resources beyond reported cash
    - high
    - Request maturity ladder and liquidity policy
  - - Revolving credit facility
    - $1.5B available as of March 31 2026; amended to $5.0B in May 2026
    - Supports short-term flexibility and signals lender confidence
    - high
    - Request covenant headroom and drawdown intentions
  - - Bridge loan
    - $20.0B entered in March 2026, maturing September 2027 with extension options
    - Major financing tool but also a large refinancing obligation
    - high
    - Request repayment plan and sensitivity to IPO timing
  - - Aggregate principal indebtedness
    - $29.132B as of March 31 2026
    - Capital access is large, but leverage is also material
    - high
    - Request debt stack by secured status, maturity, and purpose
  - - Minimum lease payments
    - $5.823B total, including $1.026B due within fiscal year
    - Adds fixed cash commitments beyond debt
    - high
    - Request site-by-site lease schedule and flexibility provisions
  - - EchoStar spectrum transaction
    - ~$19.6B consideration, including $11.1B in equity and up to $8.5B tied to debt payoff/cash
    - Expands strategic option value but deepens capital commitments
    - high
    - Request closing financing plan and target return thresholds
  notes: SpaceX appears adequately funded for near-term operations, but adequacy must be judged against a very large capex, debt, and strategic-acquisition program rather than against ordinary startup burn alone.
