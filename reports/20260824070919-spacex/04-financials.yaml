tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality assessment
  - Diligence ask
  rows:
  - - Starlink consumer subscriptions
    - Monthly subscription fees across residential and roam plans
    - Subscribers and ARPU
    - 10.3M subscribers in Q1 2026; consumer revenue >60% of Connectivity revenue in 2025
    - Highest-confidence recurring revenue stream in public record
    - Request cohort retention, churn, hardware subsidy, and geography-level ARPU
  - - Starlink enterprise and mobility
    - Contracts priced via subscriptions, data consumption, capacity, and other service-specific structures
    - Contract revenue
    - Aviation, maritime, construction, hospitals, cruise ships, trains, and hotels named as use cases; 2,500 aircraft under contract reported
    - Strong demand signal but realized pricing and margin are not disclosed
    - Request top 20 enterprise contracts, renewal rates, and installation economics
  - - Government connectivity / Starshield
    - Secure connectivity and national-security applications
    - Contract revenue
    - Filing and Starshield page confirm category; contract-level economics mostly undisclosed
    - Strategically important but opaque in current public detail
    - Request program-by-program revenue, gross margin, and backlog visibility
  - - Starlink Mobile / direct-to-cell
    - Revenue-share arrangements with mobile-network operators
    - Rev-share / device usage
    - 7.4M monthly unique devices across about 30 countries by Q1 2026
    - Promising surface with disclosed scale but undisclosed commercial terms
    - Request MNO rev-share formula, usage ramp, and spectrum costs
  - - Launch services
    - Commercial and government launch missions across Falcon, Dragon, and related services
    - Mission revenue / contract milestones
    - 2025 Space segment revenue $4.086B; rideshare list pricing is public at the smallsat end
    - Revenue scale is public, but realized mission economics remain unclear
    - Request launch gross-margin bridge by vehicle and customer class
  - - Exploration / NASA-linked programs
    - Milestone-driven development and mission support, including HLS-related work
    - Contract and milestone revenue
    - Official NASA award history visible, but 2025 recognized revenue by program not separately disclosed
    - Useful diversification surface, not sufficient alone to explain total growth
    - Request contract backlog, milestone timing, and margin by exploration program
  notes: Public evidence supports multiple monetization surfaces, but only the consumer subscription layer is disclosed with enough regularity to evaluate scale, growth, and ARPU directly.
