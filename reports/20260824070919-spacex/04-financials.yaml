- id: liquidity-and-capital-adequacy
  title: Liquidity Looks Large, but Obligations and Ambition Are Larger Than a Normal Venture Story
  body: >-
    SpaceX no longer looks like a company living from round to round in the ordinary late-stage venture sense. The filing says cash and cash equivalents were $15.852 billion as of March 31, 2026, with another $7.823 billion in short-term marketable securities and $1.5 billion then available under the revolver. It also says the company amended the credit facility in May 2026 to increase capacity to $5.0 billion, entered into a $20.0 billion bridge loan in March 2026, and carried $29.132 billion of aggregate principal indebtedness plus $5.823 billion of minimum lease payments. On top of that, the EchoStar spectrum transaction contemplates about $19.6 billion of consideration, including $11.1 billion in equity and up to $8.5 billion tied to debt payoff or cash.

    Those facts cut two ways. They show exceptional financing access and a balance sheet that can support a larger industrial platform than most private startups. They also show that SpaceX's capital agenda now sits closer to infrastructure, telecom, and hyperscale compute than to a conventional launch startup. The correct diligence posture is therefore not 'runway solved forever,' but 'liquidity is substantial, yet so are debt, capex, and strategic commitments.'
