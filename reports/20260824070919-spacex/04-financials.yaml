- id: TI002
  title: Pricing / monetization table
  columns:
  - Surface
  - Price / contract unit
  - What is public
  - List vs. realized
  - Source-backed caveat
  - Implication
  rows:
  - - SpaceX rideshare
    - $350k for 50kg to SSO; $7k per additional kg
    - Public list pricing for smallsat launch
    - Clear list pricing; unknown realized blended economics
    - Only one slice of launch monetization is fully visible
    - Helpful anchor for standardized launch pricing, not for full Space segment margin
  - - Starlink consumer plans
    - Monthly subscription / ARPU basis
    - ARPU was $81 in 2025 and $66 in Q1 2026; company expects pressure from lower-priced expansion
    - Realized service revenue disclosed at segment level, not by plan or country
    - ARPU excludes managed enterprise and government accounts
    - Consumer scale is measurable, but price compression is visible
  - - Enterprise and mobility connectivity
    - Subscription, data, capacity, and other contract forms
    - End-market categories are disclosed, not contract terms
    - Realized pricing unknown
    - Dozens of airlines and multiple enterprise verticals are named, but no average contract value is disclosed
    - Enterprise upside exists, but analysts cannot model it precisely from public data
  - - Starlink Mobile / MNO partnerships
    - Revenue sharing with carrier partners
    - Device and geography scale are disclosed; rev-share percentages are not
    - Realized pricing unknown
    - Regulatory and partner economics sit outside disclosed ARPU
    - Direct-to-cell can grow without showing up clearly in consumer ARPU
  - - Government secure services
    - Contract and program terms
    - Product category is public; economics largely confidential
    - Realized pricing unknown
    - Security work may carry different margin and cash-collection profiles from consumer plans
    - Government revenue likely matters more than public price sheets suggest
  - - Launch services beyond rideshare
    - Per mission / milestone / payload class
    - Space segment revenue totals are public; contract-level pricing mostly is not
    - Realized pricing unknown
    - Mission mix, customer mix, and internal Starlink launches complicate ASP analysis
    - Launch underwriting still requires management disclosure
  notes: Public monetization detail is strongest where SpaceX sells a standardized consumer or rideshare product and weakest where pricing is negotiated or contract-specific.
