- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Public status
  - Underwriting impact
  - Exact diligence path
  rows:
  - - Falcon / Dragon realized gross margin by mission class
    - Separates mature launch economics from Starship investment drag
    - Not publicly disclosed
    - Cannot tell whether mature launch is structurally very profitable or only modestly profitable
    - Request vehicle-level gross profit, internal-transfer pricing, and insurance cost history
  - - Starship project economics
    - Central to the Space segment loss and future upside case
    - Public spend direction is disclosed; return thresholds and program budget are not
    - Cannot underwrite whether Starship is disciplined capex or open-ended strategic spend
    - Request annualized program budget, milestone gates, and required launch cadence for breakeven
  - - Starlink hardware subsidy and terminal payback
    - Determines how much reported service profit depends on subsidized acquisition
    - Not publicly disclosed
    - Subscriber growth quality cannot be fully judged
    - Request terminal BOM trend, customer acquisition subsidy, and payback by region
  - - Subscriber churn / retention by product and geography
    - Needed to distinguish durable recurring revenue from expansion-fueled growth
    - Not publicly disclosed
    - ARPU and subscriber growth are less informative without retention
    - Request quarterly cohorts for residential, roam, business, aviation, and maritime
  - - Customer concentration and contract liabilities by segment
    - Large contracts or governments can affect revenue durability and working capital
    - Not publicly disclosed at the required granularity
    - Revenue quality and cash conversion remain only partly visible
    - Request top-customer exposure, deferred-revenue waterfall, and contract-asset aging
  notes: The remaining diligence blockers are no longer top-line questions; they are product-level, cohort-level, and cash-conversion questions.
  enumerationScope:
    coverage: partial
    basis: These are the highest-value remaining public gaps for underwriting and are not meant to be an exhaustive list of every missing disclosure.
