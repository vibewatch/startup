- id: monetization-surfaces-and-pricing
  title: Monetization Surfaces Extend Beyond Residential Subscriptions
  body: >-
    Public pricing remains uneven across SpaceX's businesses, but the monetization architecture is much clearer than it was when investors relied only on secondary-market coverage. The filing says Connectivity revenue comes primarily from consumer subscription fees, with enterprise contracts structured around subscriptions, data consumption, capacity, and other service-specific pricing, plus government connectivity revenue and Starlink Mobile revenue-share arrangements with mobile-network operators. It also notes that managed enterprise and government customers are not included in the disclosed subscriber metric, which prevents analysts from treating subscriber count alone as total commercial scale. Outside the filing, published evidence adds practical anchors: SpaceX still posts a rideshare list price of $350,000 for 50 kilograms to sun-synchronous orbit plus $7,000 for each additional kilogram, and CNBC reported about 2,500 aircraft under contract after the United megadeal.

    The implication is that SpaceX monetizes at multiple layers simultaneously: residential and roam subscriptions, enterprise and mobility contracts, direct-to-cell revenue sharing, government-secure services, launch services, and NASA-linked exploration programs. That diversity improves revenue resilience but makes product-level pricing opacity more consequential. Residential ARPU is disclosed; realized enterprise and government pricing largely is not.
