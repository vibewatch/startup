  topStrengths:
    - Starlink 已经有规模，并在经营层面盈利，给 SpaceX 提供了真实经济引擎，而不只是未来承诺。
    - 产品宽度无人可比，横跨可重复使用发射、航天器、连接、政府通信和任务可信度。
    - NASA、政府、航空公司和运营商证明支撑战略溢价，较窄的上市可比公司无法完全捕捉。
    - 2026 年 S-1 提供的披露，远强于大多数估值相近的私营公司。
  topRisks:
    - Starship 仍是最大价值解锁点，也是最大的单一执行依赖。
    - 文件也揭示了高额 capex、大额债务，以及比 Starlink 标题故事更复杂的经济性。
    - 受控公司治理实质限制了外部投资人对战略和风险偏好的制衡。
    - 发射安全、空域和监管外部性，可能拖慢支撑完整可选性信用所需的节奏。
  unresolvedGaps:
    - 公开记录仍无法完整说明确切债务再融资路径和利率敏感性。
    - 公开证据没有清楚披露 NASA、DoD 或其他主要政府项目的收入集中度。
    - 投资人仍需要一条更干净的经济性桥梁，把 Starlink、Space 和 AI 相关分部复杂性串起来。
    - Starship 何时从主要开发项目变成可靠商业解锁点，确切时间仍是关键尽调项。
