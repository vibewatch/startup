- id: TE002
  title: Workflow / use-case table
  columns:
  - User job / use case
  - Current workflow
  - SpaceX solution
  - Measurable benefit / proof
  - Limitation
  rows:
  - - Deliver commercial payloads to orbit
    - Customer procures launch capacity and mission integration
    - Falcon 9 / Falcon Heavy launch services and rideshare packaging
    - Published payload classes, visible launch cadence, reusable history
    - Dedicated-launch realized pricing and margin are not public
  - - Send crew or cargo to the ISS
    - Government or commercial operator needs orbital transport plus return capability
    - Dragon crew and cargo missions
    - NASA commercial-crew acceptance and SpaceX human-spaceflight proof
    - Capacity utilization and per-mission economics remain opaque
  - - Provide remote broadband connectivity
    - User needs low-latency internet where terrestrial access is weak
    - Starlink constellation plus terminals
    - 10.3M disclosed subscribers and global service footprint
    - Public service-quality and retention data are incomplete by region
  - - Extend connectivity to airlines, ships, and roaming users
    - Operator installs specialized connectivity hardware and service contracts
    - Starlink aviation, maritime, and roam surfaces plus enterprise contracts
    - 2,500 aircraft under contract and dedicated product surfaces
    - Pricing and SLA details remain mostly hidden
  - - Enable direct-to-cell coverage
    - Mobile network operator seeks supplemental off-grid coverage
    - Starlink Mobile partnerships and satellite-to-mobile service
    - 7.4M monthly unique devices and ~30 MNO partnerships disclosed
    - Performance and commercial terms depend on regulators and carrier partners
  - - Develop lunar or very high-mass future missions
    - Customer or partner needs a higher-capacity reusable system than Falcon
    - Starship / Super Heavy architecture with tanker refilling and NASA HLS pathway
    - Extensive public testing, NASA HLS adoption, and visible 2025-2026 test cadence
    - Vehicle remains pre-operational for routine commercial service
  notes: The table uses customer workflow language to distinguish proven workflows from frontier workflows still undergoing technical validation.
  enumerationScope:
    coverage: partial
    basis: It captures the most important user jobs exposed in official and third-party evidence rather than every prospective mission profile.
