- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality marker
  - Status
  - Scope
  - Gap
  rows:
  - - Falcon mission success messaging
    - Publicly emphasized
    - Filing cites over 99% mission success rate for Falcon rockets
    - Metric explicitly excludes Starship tests and does not reveal all root-cause detail
  - - NASA Commercial Crew acceptance
    - Active
    - Dragon used for crew transportation under NASA's commercial-crew framework
    - Government trust is strong, but public economic detail is limited
  - - Cargo return capability
    - Active
    - Dragon remains a differentiated orbital cargo-return system
    - Capsule turnaround and maintenance cost data are not public
  - - Starship regulatory oversight
    - Active and ongoing
    - FAA involvement shapes flight-test cadence and site operations
    - Approval timing remains outside SpaceX's full control
  - - Direct-to-cell regulatory path
    - Active but evolving
    - FCC SCS framework supports satellite-terrestrial integration
    - Global approvals and partner economics remain fragmented
  - - Government secure-service trust
    - Active but opaque
    - Starshield extends platform into defense-grade use cases
    - Contract-level requirements and performance benchmarks are mostly private
  notes: Trust in SpaceX is strongest where repeated operations and government acceptance are already visible; it is weaker where newer architectures or regulatory layers are still in formation.
