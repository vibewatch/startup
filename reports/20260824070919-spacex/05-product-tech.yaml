- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Public role
  - Key dependency
  - Key risk
  rows:
  - - Reusable first-stage recovery
    - Lowers marginal cost and supports higher cadence across Falcon and eventually Starship
    - Precision guidance, landing systems, pad or droneship operations
    - Recovery failure or refurbishment burden can reduce economic advantage
  - - Dragon capsule and life-support layer
    - Transports crew and returns cargo from orbit
    - NASA certification, launch integration, recovery operations
    - Human-rating and mission assurance create high consequence for failures
  - - Starlink satellite and terminal layer
    - Delivers broadband and mobility services through orbital assets and user hardware
    - Continuous satellite deployment, phased-array terminal manufacturing, ground systems
    - Depreciation, replacement cadence, and service outages can erode economics and trust
  - - Starlink Mobile layer
    - Provides satellite-to-mobile connectivity directly to smartphones through carrier partnerships
    - Spectrum rights, MNO partners, Gen2 satellites, regulatory approvals
    - Commercial scaling depends on non-SpaceX counterparties and authorizations
  - - Starship heavy-lift architecture
    - Future high-capacity reusable transport and moon/Mars logistics backbone
    - Raptor engines, catch towers, tankers, launch-site approvals, repeated test learning
    - Development-stage complexity can delay roadmap and absorb capital
  - - Mission and content operations layer
    - Publicly documents launches, test cadence, and program milestones
    - Operational tempo and media discipline
    - Visibility raises credibility but also exposes failures and delays immediately
  notes: 'SpaceX''s operating architecture is unusually coupled: launch, spacecraft, satellites, service delivery, and public test cadence all feed one another.'
  enumerationScope:
    coverage: partial
    basis: The table captures the most consequential technical and operating layers visible in public materials, not a full subsystem bill of materials.
