- id: flight-proven-systems
  title: Falcon, Dragon, and Starlink Are the Flight-Proven Layers; Starship Is the Frontier Layer
  body: >-
    The most important diligence distinction is between mature and frontier layers. Falcon 9 and Falcon Heavy are proven operational systems with clearly published payload envelopes, reusable-core logic, and high mission success messaging. Dragon is a live spacecraft product with cargo and crew heritage, and both SpaceX and NASA pages frame it as a system trusted to carry astronauts and to return meaningful cargo from orbit. Starlink is also no longer a concept. The S-1 says the company operated over 9,600 broadband and mobile satellites across 164 countries by March 2026, while official and third-party evidence shows parallel product surfaces across consumer, enterprise, aviation, maritime, roam, and mobile-network-operator channels.

    Starship, by contrast, is strategically central but operationally earlier. SpaceX's own Starship page describes the architecture, reusability goal, tanker-refill concept, and booster-catch logic in unusually concrete terms, and the content hub shows a continuing flight-test sequence through 2026. But the filing still says Starship remains in development and that most current program costs are expensed through research and development. The correct technical read is therefore not 'unproven everywhere' or 'already solved,' but 'proven on Falcon/Dragon/Starlink, still being validated on Starship.'
