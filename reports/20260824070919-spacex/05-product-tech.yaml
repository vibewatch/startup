tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset / product line
  - User / buyer
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Falcon 9
    - Commercial launch buyers, NASA, government missions, internal Starlink deployment
    - Mature live product
    - Reusable orbital-class workhorse with published performance and deep flight heritage
    - Mission-level realized economics and refurbishment cycle detail are not public
  - - Falcon Heavy
    - Heavy-payload buyers and government missions
    - Mature but lower-frequency live product
    - Three-core reusable architecture with very high operational thrust and commonality with Falcon 9
    - Product cadence and long-run demand mix remain less transparent than Falcon 9
  - - Dragon
    - NASA, private astronaut missions, ISS cargo and crew customers, research users
    - Mature live spacecraft
    - Human-rated capsule with cargo return and crew transport track record
    - Full cost structure and commercial-pricing detail remain private
  - - Starlink broadband and mobility
    - Consumer, enterprise, aviation, maritime, roam, and direct-to-cell channels
    - Mature and scaling live network
    - Integrated launch-plus-constellation-plus-terminal stack
    - Product-level churn, subsidy, and service-quality data are incomplete publicly
  - - Starshield
    - Government and national-security buyers
    - Live but economically opaque product surface
    - Secure-government overlay built on broader SpaceX stack
    - Contract-level scope and margin are mostly non-public
  - - Starship / Super Heavy
    - Future large-payload, lunar, Mars, and high-volume deployment missions
    - Development-stage frontier system
    - Fully reusable super heavy-lift architecture with tanker/refill and booster-catch concepts
    - Commercial and reliability proof remain incomplete
  notes: The matrix separates SpaceX's mature, cash-generating modules from its frontier architecture while preserving the system-level integration between them.
  enumerationScope:
    coverage: partial
    basis: The table covers the major externally visible product and asset layers rather than every internal software or hardware subsystem.
