  evidenceGaps:
  - type: private-evidence-only
    severity: high
    topic: starship operational maturity
    relatedQuestionRefs:
    - QE022
    missingEvidence: Stage-level reliability, turnaround, refurbishment, and payload-delivery performance for commercial Starship operations.
    whyItMatters: Public test cadence is visible, but commercial readiness cannot be underwritten from concept and test footage alone.
    diligencePath: Request stage-test history, integrated reliability data, post-flight corrective actions, and commercialization milestones.
  - type: private-evidence-only
    severity: medium
    topic: starlink service quality by product surface
    missingEvidence: Product-specific latency, availability, churn, and terminal failure rates across business, aviation, maritime, roam, and mobile channels.
    whyItMatters: Multiple Starlink pages exist, but their public surfaces do not reveal operational quality by segment.
    diligencePath: Request product-line SLA dashboards, churn cohorts, and installation/maintenance metrics.
  - type: private-evidence-only
    severity: medium
    topic: government and Starshield technical scope
    missingEvidence: Contract-level performance standards, security requirements, and deployment footprint for Starshield and comparable government work.
    whyItMatters: Government trust is clear, but the exact technical burden and differentiation remain hard to quantify publicly.
    diligencePath: Request program briefs, certifications, and technical requirement summaries available under NDA or customer permission.
