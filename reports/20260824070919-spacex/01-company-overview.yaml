company:
  name: SpaceX
chapter:
  number: 1
  title: Company Overview
  summary: SpaceX is already a scaled multi-line platform across launch, human spaceflight, Starlink, and government secure-communications work, but public disclosure remains far better on product capability and secondary-market valuation than on audited company-wide economics or governance detail. The strongest verified scale signals are late-2024 Starlink adoption milestones, NASA lunar-lander contract values, visible launch cadence, and 2024 secondary transactions that stepped valuation from roughly $210 billion to roughly $350 billion. The main unresolved issues at the overview layer are governance opacity, the exact current headquarters convention between Hawthorne and Starbase, and the lack of audited revenue, margin, and cap-table disclosure.
sections:
- id: identity-and-platform
  title: Identity, footprint, and platform scope
  body: 'SpaceX remains best understood as a vertically integrated launch-and-connectivity platform rather than a single-product rocket company. The official site still centers the company mission on making life multiplanetary, but the reviewed pages show a broader commercial stack: Falcon 9 and Falcon Heavy for launch, Dragon for cargo and crew transport, Starship for next-generation lunar and Mars logistics, Starlink for broadband connectivity, and Starshield for government communications and sensing. That breadth matters because the business is not monetizing just one technology bet; it is monetizing launch, communications, government programs, and a growing distribution footprint for connectivity products.


    The most basic company-identity facts are partly clear and partly evolving. FAA materials still describe SpaceX as headquartered in Hawthorne, California, while the current Starship page describes Starbase as home to SpaceX headquarters and the center of Starship development. Rather than force a false single-headquarters narrative, the safer diligence conclusion is that Hawthorne remains the legacy corporate anchor while Starbase now functions as a strategic operating headquarters for the company’s most important future platform. For later chapters, the canonical takeaway is that SpaceX’s operating center of gravity has expanded from Southern California into a Texas-led manufacturing, test, and launch footprint.'
  claimRefs:
