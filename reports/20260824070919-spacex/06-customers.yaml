- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Consumer subscriber growth
    - Revenue may still be overly weighted to retail Starlink despite broader product surfaces
    - Helps scale quickly but can mask weak enterprise diversification
    - Request segment revenue split beyond consumer >60% disclosure
  - - Airline fleet expansion
    - A few flagship airline wins can dominate perception if revenue remains concentrated
    - Strong references may overstate installed-base breadth
    - Request top-airline revenue share and installed-vs-contracted fleet counts
  - - Carrier partnerships
    - Distribution leverage may sit with a handful of MNOs
    - Negotiating power and service rollout may be outside SpaceX's control
    - Request revenue concentration and rev-share dependence by carrier
  - - NASA and government programs
    - Strategic prestige may exceed economic diversification
    - Program timing or milestone shifts can alter revenue quality
    - Request customer concentration by government program and milestone stage
  - - Research and private-mission ecosystem
    - Brand value may be high while recurring revenue is low
    - Can distort perceived customer breadth if weighted too heavily
    - Request repeat-customer and revenue contribution data for non-core mission users
  notes: Expansion is visible across several customer lanes, but the public record still does not fully separate breadth from concentration.
  enumerationScope:
    coverage: partial
    basis: The table centers on the most important transmission paths from customer expansion into concentration or durability risk.
