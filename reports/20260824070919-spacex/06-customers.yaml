- id: named-customer-proof
  title: Named Customer Proof Is Best in Aviation, Carrier Partnerships, and NASA Programs
  body: >-
    Named customer proof is meaningful and varied. In mobility, United and Hawaiian provide flagship airline evidence, while SpaceX's aircraft-contract count suggests that named wins are not isolated pilot projects. In direct-to-cell, T-Mobile is the clearest publicly documented launch partner and the CNBC report on first texts establishes that the relationship moved past press-release intent into real network testing. In institutional programs, NASA's commercial-crew and lunar-lander work provide high-trust customer validation that most private companies cannot approach. Research and astronaut-transport surfaces add another layer: SpaceX publicly solicits research proposals and positions Dragon as the means to execute those missions.

    Even here, however, proof quality varies. NASA and airline announcements are concrete; some international customer pages are thin, moved, or JS-heavy; and logos or route announcements do not automatically prove long-term revenue durability. The chapter therefore separates strong named proof from weaker or more superficial public mentions.
