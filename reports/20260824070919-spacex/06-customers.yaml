  evidenceGaps:
  - type: private-evidence-only
    severity: high
    topic: retention metrics
    relatedQuestionRefs:
    - QU016
    missingEvidence: Churn, NRR, GRR, renewal rates, and contract-duration data by customer segment.
    whyItMatters: Strong adoption does not automatically prove durable revenue.
    diligencePath: Request cohort retention, renewal schedules, and churn by retail, airline, carrier, and government segments.
  - type: private-evidence-only
    severity: high
    topic: customer satisfaction and SLA quality
    relatedQuestionRefs:
    - QU017
    missingEvidence: NPS, outage-adjusted SLA performance, complaint rates, and post-install service quality by product line.
    whyItMatters: Enterprise and mobility adoption quality depends on reliability, not only installations.
    diligencePath: Request service dashboards, support metrics, and named reference calls.
  - type: private-evidence-only
    severity: high
    topic: revenue concentration
    missingEvidence: Revenue share of top customers, top carriers, top airlines, and top government programs.
    whyItMatters: Customer breadth can look better than revenue breadth.
    diligencePath: Request top-20 customer concentration schedule and segment revenue split.
  - type: evidence-quality-limit
    severity: medium
    topic: international customer announcements
    relatedTableRefs:
    - TU003
    missingEvidence: Fresh, stable, and easily verifiable pages for some international airline or hospitality customer mentions.
    whyItMatters: Weak or moved pages reduce confidence in marginal customer proofs.
    diligencePath: Re-verify with original press releases, airline IR pages, or procurement records.
  - type: private-evidence-only
    severity: medium
    topic: deployment economics
    missingEvidence: Installed-vs-contracted fleet counts, activation lag, and monetization by customer lane.
    whyItMatters: Headline announcements may overstate current in-service revenue if installations lag.
    diligencePath: Request implementation pipeline, live-seat counts, and activation-to-billing timeline by flagship account.
