tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / proof
  - Revenue or strategic value
  - Gap
  rows:
  - - Retail Starlink subscribers
    - Household or small-site end user paying monthly service fees
    - Broadband in underserved or mobile contexts
    - 10.3M disclosed subscribers by March 2026
    - Largest visible recurring volume base
    - Churn and geography-level ARPU not public
  - - Airlines and mobility operators
    - Airline or fleet operator as buyer; passenger as end user
    - In-flight connectivity and mobile broadband
    - 2,500 aircraft under contract plus United and Hawaiian proof
    - High-visibility enterprise reference set
    - Contract economics and renewal terms not public
  - - Mobile-network operators
    - Carrier as buyer/distribution partner; subscriber as downstream user
    - Satellite-to-cell texting and future voice/data coverage
    - ~30 MNO partnerships and first-text milestone with T-Mobile
    - Expands reach without one-by-one direct sales
    - Rev-share, activation, and carrier concentration are not public
  - - NASA and government mission buyers
    - NASA and government agencies as buyers; astronauts, programs, or operators as users
    - Crew transport, lunar systems, launch, and secure communications
    - Commercial Crew, HLS, Starshield, and research surfaces are all public
    - Highest trust and validation value
    - Program-level revenue concentration and timing are opaque
  - - Research / astronaut missions / private mission users
    - Research teams, private astronauts, and mission sponsors
    - On-orbit research, private human spaceflight, and mission participation
    - Public research intake and human-spaceflight surfaces exist
    - Enhances ecosystem breadth and brand trust
    - Named production volumes and repeat economics are sparse
  notes: Customer categories are intentionally separated by buyer, user, and proof type because adoption quality varies materially across them.
  enumerationScope:
    coverage: partial
    basis: The table covers the customer lanes most visible in retained public sources rather than every geography or government account.
