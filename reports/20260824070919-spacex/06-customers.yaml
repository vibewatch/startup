company:
  name: SpaceX
chapter:
  number: 6
  title: Customers
  summary: >-
    SpaceX's customer picture is unusually broad for a private aerospace company: millions of retail Starlink subscribers, airlines deploying in-flight connectivity, mobile-network operators using Starlink Mobile, NASA buying crew transportation and lunar-system development, and government or research users sitting on top of the same underlying launch and communications stack. The strongest adoption proof is on broad-scale usage and named flagship accounts; the weakest public evidence remains on retention, revenue concentration, and contract duration by segment, meaning customer quality is clearly real but not fully transparent.
sections:
- id: segmentation
  title: Customer Segmentation Spans Consumer, Enterprise, Carrier, Government, and Mission Buyers
  body: >-
    SpaceX's customer base cannot be understood through one buyer archetype. The S-1 and public deployment evidence show at least five major customer lanes: retail Starlink subscribers; enterprise and mobility users such as airlines and ships; mobile-network operators using Starlink Mobile; government and national-security buyers using launch, Starshield, or mission services; and NASA or private-spaceflight customers using Dragon, research, or lunar-development capabilities. This matters because the company is not dependent on one sales motion. Consumer subscription growth follows a broad-availability model, airlines and carriers require installation and integration cycles, and government or NASA programs follow much slower trust-heavy procurement paths.

    The segmentation also changes how investors should read customer proof. A new retail subscriber is not equivalent to an airline rollout, and an airline rollout is not equivalent to a NASA program. The customer story is strongest when those lanes reinforce each other rather than being mistaken for the same kind of evidence.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
