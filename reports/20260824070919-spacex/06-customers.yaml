  title: Customer Journey Map
  type: journey-map
  layout: wide
  summary: Main adoption surfaces from discovery to repeat use across SpaceX's customer lanes.
  data:
    items:
    - label: Awareness of SpaceX surface
      detail: Customer encounters SpaceX through broadband need, airline connectivity search, carrier coverage gap, NASA procurement, or private mission interest.
    - label: Qualification and trust check
      detail: Buyer evaluates flight heritage, coverage, regulatory fit, and mission assurance.
    - label: Deployment or activation commitment
      detail: User subscribes, airline installs terminals, carrier activates partnership, or agency awards program work.
    - label: Live service or mission use
      detail: Customer receives broadband, in-flight Wi-Fi, direct-to-cell coverage, crew transport, research support, or program execution.
    - label: Expansion or repeat loop
      detail: More service lines, more aircraft, more carriers, more missions, or broader government scope reinforce the account.
  approximationNotes: The journey map compresses multiple customer types into one evidence-backed flow because SpaceX serves very different buyers through a shared platform.
