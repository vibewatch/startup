- id: adoption-trajectory
  title: Adoption Trajectory Is Clear at the Top Line and Increasingly Visible in Named Deployments
  body: >-
    Public adoption proof is unusually strong for a private company at the top of the funnel. TechCrunch reported 4 million Starlink subscribers in September 2024, CNBC reported the base was nearing 5 million by November 2024, and the S-1 later disclosed about 10.3 million subscribers by March 2026. The same filing says those subscribers do not include managed enterprise and government accounts, which means the disclosed count understates total customer relationships. Adoption is also visible in deployment surfaces. CNBC reported about 2,500 aircraft under contract after the United megadeal, Hawaiian publicly launched complimentary Starlink connectivity, and SpaceX and T-Mobile announced first texts through Starlink satellites as the carrier-partner model moved from concept into field proof.

    The limitation is denominator quality. Public sources show that adoption is real and fast-growing, but they do not give a full view into activation-to-retention conversion, country mix, contract-size distribution, or how much revenue each lane contributes after headline announcements.
