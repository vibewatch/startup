- id: dependency-people
  title: Partner, Government, Supplier, and Founder Dependencies Add Non-Technical Fragility
  body: 'SpaceX''s vertical integration is a strength, but the business is not independent of counterparties. The filing says growth requires coordination across suppliers, contractors, launch sites, regulators, and partner ecosystems. Direct-to-cell depends on terrestrial spectrum partnerships under the FCC''s supplemental-coverage framework; Starshield and major mission programs depend on government demand and government acceptance; and airline or mobility customers depend on hazard windows and operational predictability that sit partly outside their control. As SpaceX broadens from launch provider into connectivity and defense infrastructure, partner risk becomes more like utility or government-platform risk than like a typical hardware startup risk.

    Governance adds another layer. The S-1 says Elon Musk will control shareholder outcomes and that SpaceX expects to rely on controlled-company exemptions. That does not mean governance failure is inevitable, but it does mean outside investors will have fewer formal levers if strategy, risk appetite, financing, or succession assumptions change. In a company whose ambitions span launch, telecom, AI infrastructure, and defense-linked services, concentrated control is a meaningful residual risk rather than a stylistic footnote.'
