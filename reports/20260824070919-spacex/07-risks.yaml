  evidenceGaps:
  - type: missing-metric
    severity: high
    topic: exact Starship anomaly-rate trend and root-cause closure quality
    relatedQuestionRefs:
    - QR007
    missingEvidence: Public sources do not provide a clean flight-by-flight risk-adjusted trend line or closure audit for corrective actions.
    diligenceAsk: Request internal post-mortem cadence, corrective-action closure, and reliability trend data for Starship flights.
  - type: missing-metric
    severity: medium
    topic: supplier concentration and single-point operational bottlenecks
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR003
    - TR004
    missingEvidence: The public filing names categories of dependency but does not quantify supplier concentration, backup vendors, or recovery times.
    diligenceAsk: Request top supplier exposure, pad redundancy assumptions, and component lead-time concentration.
  - type: missing-metric
    severity: medium
    topic: insurance adequacy for launch debris, property damage, and third-party disruption
    relatedQuestionRefs:
    - QR028
    missingEvidence: Public sources do not clearly disclose insurance structure, coverage sufficiency, or probable uninsured exposure by mishap type.
    diligenceAsk: Obtain launch-insurance program summary and historical claims experience.
  - type: missing-metric
    severity: high
    topic: government revenue concentration by program
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
    missingEvidence: Public evidence confirms important government demand but does not show exact revenue share, margin, or renewal concentration by program.
    diligenceAsk: Request top-program revenue, backlog, milestone timing, and termination exposure.
  - type: evidence-quality-limit
    severity: medium
    topic: international regulatory pushback examples
    relatedTableRefs:
    - TR001
    missingEvidence: The filing makes clear that international approvals matter, but retained public sources do not create a comprehensive country-by-country deny or delay map.
    diligenceAsk: Build a priority-country regulatory tracker covering licenses granted, deferred, denied, or politically contested.
  - type: missing-metric
    severity: medium
    topic: people-risk telemetry across safety, legal, and recruiting functions
    relatedTableRefs:
    - TR004
    missingEvidence: Public sources describe staffing ambition and governance concentration but not attrition, vacancy aging, or safety-leadership churn.
    diligenceAsk: Request attrition, open critical roles, internal succession depth, and training completion data.
