chapter:
  number: 7
  title: Risks
  summary: 'SpaceX''s risk profile is dominated by one compounding fact: Starship is both the largest upside lever and the largest single point of execution failure. The company has real demand, strong government credibility, and unmatched launch cadence, but public evidence also shows repeated Starship mishaps, ongoing FAA environmental and licensing dependencies, legal and labor friction, concentrated founder control, and an unusually capital-intensive roadmap. The investment case therefore remains viable only if launch cadence, licensing progress, and financing discipline keep compounding faster than regulatory, safety, and governance drag.'
sections:
- id: ranked-overview
  title: The Core Risk Is Program Concentration Around Starship and High-Cadence Scale-Up
  body: 'SpaceX does not face a normal portfolio of loosely connected startup risks. The public filing makes clear that Starship is the keystone for next-generation Starlink V3 deployment, V2 Mobile scaling, lunar ambitions, and even the more speculative orbital AI-compute program. That means one technical or regulatory bottleneck can transmit into product delays, customer disappointment, capex inefficiency, and valuation compression at the same time. The positive reading is that one successful platform can unlock several businesses; the negative reading is that execution dependency is unusually concentrated.

    That concentration is not abstract. The filing explicitly lists technical, supply-chain, infrastructure, and regulatory hurdles around Starship, while the FAA public record shows continuing environmental reviews and updated airspace-closure work even after major approvals were granted. The right investor stance is therefore not “SpaceX has many risks,” but rather “SpaceX has one giant scaling engine whose failure modes cascade across many revenue surfaces.”'
