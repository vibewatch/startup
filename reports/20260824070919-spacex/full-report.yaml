      - number: '8.3'
        title: Current price support is better than before, but the multiple is still rich on public evidence
        blocks:
          - type: paragraph
            body: >-
              The most important change versus the earlier tender-offer era is that the S-1 allows a real bridge from
              valuation to operating facts. Using the filing's $18.674 billion of 2025 revenue, a $210 billion valuation
              implies roughly 11.2x revenue while a $350 billion valuation implies roughly 18.7x revenue. Those are not
              impossible multiples for a unique infrastructure platform, but they are premium valuations even before
              fully capitalizing risk. They also arrive while the filing still shows enormous capex, more than $29
              billion of principal debt, and a company-level GAAP loss despite Starlink profitability.


              That combination is why the current mark should be treated as a bull-leaning price rather than as a
              neutral entry point. The valuation is no longer backed only by storytelling; it is backed by real revenue
              and profit centers. But it also already reflects expectations that SpaceX will keep compounding scale,
              that Starship will unlock the next leg, and that financing markets will remain supportive while the
              company funds an unusually broad roadmap.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
      - number: '8.4'
        title: Scenario work supports a range, not a blanket endorsement of the current mark
        blocks:
          - type: paragraph
            body: >-
              The right valuation method here is scenario-based rather than comp-only. In the bull case, SpaceX proves
              repeatable Starship progress, deploys V3 at pace, keeps Starlink's profit engine expanding, and converts
              strategic breadth into a market willingness to underwrite the company more like a category-defining
              infrastructure platform than like a conventional aerospace prime. In that world, a valuation above the
              current private mark is supportable.


              The base case is less forgiving. It assumes Starlink remains powerful, launch and government demand stay
              real, but Starship commercial de-risking takes longer and capex plus leverage keep investors from paying
              peak strategic premiums across every business line at once. The bear case does not require business
              collapse; it only requires a slower Starship ramp, tighter financing conditions, or heavier regulatory
              drag. Under those conditions, the present mark looks much more like a ceiling than a bargain.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
