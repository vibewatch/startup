  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: SpaceX Sells an Integrated Access-to-Orbit and Connectivity Stack
        blocks:
          - type: paragraph
            body: >-
              SpaceX is no longer well described as 'a rocket company plus Starlink.' Its official surfaces, S-1, and
              human-spaceflight pages show a layered platform composed of Falcon 9, Falcon Heavy, Dragon, Starship/Super
              Heavy, the Starlink broadband and mobile constellations, user terminals, Starshield, and associated ground
              and software operations. The design logic is vertical integration. Launch vehicles are not merely a
              revenue product; they are also the deployment mechanism for the constellation. Satellites are not merely a
              hardware asset; they underpin broadband, direct-to-cell, aviation, maritime, and government
              communications. Dragon is not only a capsule; it is a reusable human-spaceflight and cargo-return system
              that reinforces trust in SpaceX as a high-reliability operator.

              This integrated architecture matters because it compresses iteration loops across manufacturing, launch,
              deployment, and service delivery. It also means that technological differentiation is not confined to one
              component. SpaceX's edge sits in the coupling of reusable launch, satellite production, terminal
              deployment, and operations. The result is a product stack that is broader than most single-lane
              competitors have to match.
