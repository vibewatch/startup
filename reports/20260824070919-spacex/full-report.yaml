            body: >-
              Relative to peers, the reported scale gap is enormous. Rocket Lab's 2026 second-quarter filing showed
              $434.4 million of first-half revenue and $2.129 billion of cash; AST SpaceMobile's filing showed $46.255
              million of first-half revenue and $2.288 billion of cash. Amazon is still spending up to $10 billion to
              build Kuiper, and the Eutelsat-OneWeb combination highlights that some competitors are still betting on
              enterprise and government economics rather than mass consumer ARPU. Against that backdrop, SpaceX's
              reported 2025 revenue base, segment profitability in Connectivity, and financing access clearly place it
