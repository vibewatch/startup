      - number: '1.3'
        title: Government programs, valuation history, and liquidity signals
        blocks:
          - type: paragraph
            body: >-
              SpaceX’s public financing picture is still dominated by secondary transactions rather than transparent
              primary financing. Forbes reported that the June 2024 tender process valued SpaceX at about $210 billion,
              and Yahoo Finance/Bloomberg reported that the December 2024 insider transaction moved that mark to about
              $350 billion on a $185 share price. Those events show a sharp re-rating, but they do not provide the clean
              financial disclosure that an IPO prospectus or audited private placement memo would. The right way to use
              these valuation marks is as liquidity signals: investors were willing to transact at dramatically higher
              prices, and the company itself participated in buybacks, but the underlying company-wide income statement
              still remains largely private.


              Government demand is easier to evidence than private-market economics. NASA’s initial HLS award gave
              SpaceX a $2.89 billion lunar-lander anchor and the later Option B modification added about $1.15 billion
              plus a second crewed landing demonstration. CNBC also characterized SpaceX as a recipient of billions of
              dollars in NASA and Department of Defense business, which fits the broader picture from Starshield and
              Dragon. For diligence purposes, the company’s valuation is therefore being carried by a combination of
              high strategic relevance, a visible recurring Starlink base, and government-backed mission criticality
              rather than by audited public-company style disclosure.
            claimRefs:
              - CO015
              - CO016
              - CO017
              - CO026
              - CO030
              - CO031
              - CO032
              - CO033
