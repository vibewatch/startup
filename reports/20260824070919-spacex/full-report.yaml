      - number: '2.5'
        title: Contradictions, Adverse Evidence, and What Remains Unknowable
        blocks:
          - type: paragraph
            body: >-
              The main contradiction in SpaceX’s market story is that demand is clearly broad, but not all of it should
              be valued equally today. Residential and aviation Starlink demand are already demonstrated; lunar cargo
              pricing and Earth-to-Earth travel remain aspirational. Launch demand is visible both externally and
              internally, but the public record still does not translate launch cadence into recognized external launch
              revenue. Connectivity demand is obvious, but the reviewed sources do not disclose a clean ARPU or
              segment-margin bridge across residential, enterprise, aviation, maritime, and direct-to-cell.


              Investors should therefore treat the chapter’s sizing work as a decision framework, not a pseudo-precise
              spreadsheet. The market is unquestionably large, multi-segment, and growing. What remains unknowable from
              the public pack is the exact relative weight of each revenue pool, the conversion of new adjacency
              products into cash flow, and the split between theoretical strategic optionality and today’s monetized
              demand.
            claimRefs:
              - CM028
              - CM029
              - CM033
              - CM034
              - CM039
              - CM040
