  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation Spans Consumer, Enterprise, Carrier, Government, and Mission Buyers
        blocks:
          - type: paragraph
            body: >-
              SpaceX's customer base cannot be understood through one buyer archetype. The S-1 and public deployment
              evidence show at least five major customer lanes: retail Starlink subscribers; enterprise and mobility
              users such as airlines and ships; mobile-network operators using Starlink Mobile; government and
              national-security buyers using launch, Starshield, or mission services; and NASA or private-spaceflight
              customers using Dragon, research, or lunar-development capabilities. This matters because the company is
              not dependent on one sales motion. Consumer subscription growth follows a broad-availability model,
              airlines and carriers require installation and integration cycles, and government or NASA programs follow
              much slower trust-heavy procurement paths.

              The segmentation also changes how investors should read customer proof. A new retail subscriber is not
              equivalent to an airline rollout, and an airline rollout is not equivalent to a NASA program. The customer
              story is strongest when those lanes reinforce each other rather than being mistaken for the same kind of
              evidence.
