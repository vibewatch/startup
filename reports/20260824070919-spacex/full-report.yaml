  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Starship timing break
        - Repeated major delay cycles or failure to show credible cadence improvement through the next operating window.
        - The largest source of optionality credit stops converting into proof.
        - Move from watchful optimism to explicit de-rating of the bull case.
      - - Financing-pressure break
        - Debt costs or refinancing needs rise while capex remains elevated and execution slips.
        - Valuation becomes balance-sheet constrained rather than growth constrained.
        - Require materially lower entry pricing or avoid new exposure.
      - - Regulatory-friction break
        - FAA or other approvals materially slow launch tempo or meaningful new restrictions accumulate.
        - Revenue timing and platform expansion assumptions lose credibility.
        - Cut scenario weights toward base/bear immediately.
      - - Governance break
        - Material strategic change occurs without meaningful outside-check visibility.
        - Controlled-company discount widens because investors cannot rely on normal governance controls.
        - Demand larger margin of safety before participating.
      - - Proof-to-price break
        - Secondary or private pricing continues rising ahead of operating proof improvement.
        - Return compression occurs even if company quality remains high.
        - Pass on new money until evidence catches up to mark.
    notes: These triggers focus on monitorable events rather than on narrative mood swings.
    claimRefs:
      - CV006
      - CV008
      - CV015
      - CV024
      - CV029
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Starship commercial unlock
        - Exact timetable for sustained cadence, V3 deployment, and dependency reduction from test to operations.
        - This is the largest determinant of whether current optionality credit is deserved.
        - Program review and milestone deck.
      - - Debt and refinancing
        - Bridge-loan path, rate sensitivity, and deleveraging plan.
        - Large debt matters far more at a full private price than at a distressed one.
        - Treasury and CFO diligence.
      - - Segment separability
        - Clear view of Starlink, Space, and AI economic boundaries after the 2026 filing.
        - Investors need to know what exactly they are paying for and subsidizing.
        - Finance data room and management Q&A.
      - - Government concentration
        - Revenue and backlog concentration by NASA, DoD, and other major programs.
        - Strategic prestige is good, but concentrated milestone revenue changes downside math.
        - Customer concentration schedule.
      - - Governance and succession
        - Independent-check mechanisms and bench depth around Musk-controlled governance.
        - Controlled-company status deserves an explicit rather than assumed discount.
        - Board and governance diligence.
    notes: These asks are the minimum set needed to convert admiration for the company into a disciplined underwriting file.
    claimRefs:
      - CV005
      - CV007
      - CV024
      - CV038
      - CV039
      - CV040
