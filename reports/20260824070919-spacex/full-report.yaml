        - $420B–$500B fair-value zone becomes plausible if platform optionality converts into visible operating proof.
        - Requires several difficult execution and policy variables to go right at once.
        - low-medium
      - - Base
        - >-
          Starlink stays strong, launch and government demand remain durable, but Starship de-risks slower and leverage
          plus capex keep valuation discipline in place.
        - $260B–$320B is supportable for a premium but still execution-heavy infrastructure platform.
        - This scenario leaves the current mark looking somewhat rich rather than cheap.
        - medium
      - - Bear
        - >-
          Starship ramps slowly, regulatory friction persists, financing tightens, or AI/capex complexity drags on
          investor willingness to pay.
        - $160B–$220B reflects strong assets with far less optionality credit and more balance-sheet discount.
        - No business collapse is needed; only slower proof and tighter capital.
        - medium
    notes: >-
      Ranges are author estimates using public evidence only; they inform entry discipline rather than mimic management
      guidance.
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        The table covers the most decision-relevant public analogs and bounding references available in retained August
        2026 evidence. No listed company is a one-for-one match for SpaceX.
    columns:
