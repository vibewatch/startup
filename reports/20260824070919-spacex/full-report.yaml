      - number: '2.2'
        title: Sizing the Market With Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to size SpaceX’s addressable market is through bounded lenses rather than a single
              headline number. One lens is launch pricing and payload economics: SpaceX publishes rideshare pricing and
              vehicle capacities, while competitors publish their own payload envelopes, creating a rough market map for
              launchable mass and mission classes. A second lens is broadband adoption: late-2024 reporting already
              showed Starlink at four to almost five million customers, which proves that satellite internet demand has
              become a real operating market rather than a futuristic category. A third lens is mobility and wholesale
              connectivity: 2,500 aircraft under contract, more than 1,000 United aircraft, and direct-to-cell carrier
              partnerships show that enterprise and MNO demand can be large enough to matter independently of
              residential terminals.


              The fourth lens is government strategic demand. NASA’s Artemis/HLS work, Starshield, and FCC-supported
              supplemental coverage from space all indicate that part of SpaceX’s market is created or accelerated by
              U.S. government priorities. The fifth lens is the long-dated upside case: lunar cargo at published rates
              and concept markets like Earth-to-Earth travel. Those future surfaces are strategically important, but the
              current public record still supports treating them as option value rather than present-day revenue pools.
            claimRefs:
