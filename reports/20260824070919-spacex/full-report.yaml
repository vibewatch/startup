      - number: '3.2'
        title: 'Incumbents and Assurance Alternatives: Vulcan, Ariane 6, and New Glenn Are Not Clean Apples-to-Apples'
        blocks:
          - type: paragraph
            body: >-
              Not every alternative to SpaceX is a direct Falcon 9 clone. ULA’s Vulcan is optimized around precision and
              government-grade assurance, Arianespace offers sovereign European access and institutional credibility,
              and Blue Origin’s New Glenn aims to become a second heavy U.S. source with long-term reuse ambitions.
              These competitors matter even where they are not price leaders because launch buyers often want
              redundancy, political alignment, or procurement diversity.


              The key implication is that SpaceX’s moat in launch is strongest in commercial cadence and reusable trust,
              not necessarily in every government or sovereign buying context. Buyers with national-security or
              strategic-autonomy motives may willingly support second sources even when SpaceX’s performance appears
              stronger. That does not erase SpaceX’s advantage, but it does cap the extent to which SpaceX can assume a
              permanent monopoly.
            claimRefs:
