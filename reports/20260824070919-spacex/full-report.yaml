      - number: '6.4'
        title: Expansion Logic Is Strong, but Public Retention Data Remain Thin
        blocks:
          - type: paragraph
            body: >-
              The best case for durability is structural rather than metric-perfect. Consumer adoption keeps rising,
              aviation appears to be moving from a few showcase deployments toward wider installed fleets, and Starlink
              Mobile expands through carrier partnerships that can extend customer reach without requiring SpaceX to
              sell every account directly. NASA and government-linked programs add prestige and duration even where
              revenue timing is milestone-driven. The customer-expansion logic therefore looks credible: launch and
              network infrastructure create more use cases, which in turn create more referenceable customers across
              segments.

              The public record is much thinner on formal retention. No reliable NRR or GRR is disclosed, contract
              lengths are only partly inferable, churn is not broken out by product, and customer concentration by
              revenue is absent. Investors can conclude that expansion is happening; they cannot yet conclude exactly
              how sticky or diversified each sub-segment is.
