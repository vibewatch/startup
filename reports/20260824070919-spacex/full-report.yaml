            body: >-
              SpaceX's trust position is grounded less in abstract certification language than in repeated operational
              proof. Falcon pages and the S-1 emphasize reusability and mission success. NASA's commercial-crew framing
              and SpaceX's own human-spaceflight pages show that Dragon crossed the threshold from interesting private
              hardware to government-trusted transportation system. The Starshield surface extends that trust logic into
              secure-government use cases, while the FCC direct-to-cell framework and the FAA Starship oversight process
              show that future capabilities still require active regulatory alignment.

              Quality control, however, should not be confused with absence of risk. The filing explicitly distinguishes
              Falcon mission success metrics from Starship tests, and adverse reporting on Starship debris and airline
              disruption shows that public tolerance for experimental failure is not limitless. In this chapter, the
              right diligence posture is to treat Falcon and Dragon as trusted, Starlink as scaled but still
              operationally complex, and Starship as a high-potential system whose quality case is still being built in
