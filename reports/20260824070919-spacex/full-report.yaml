      - number: '2.4'
        title: Growth Drivers, Constraints, and Multi-Orbit Alternatives
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers in the pack all come from structural gaps in current infrastructure. Amazon
              Leo and AST SpaceMobile both frame the global coverage problem explicitly: billions still lack reliable
              high-speed internet access and most of Earth’s surface remains beyond traditional cell towers. SES,
              Viasat, and Telesat demonstrate that this demand is real across enterprise and government settings as
              well, but they also show that the market is not empty. Existing GEO, MEO, and emerging LEO networks
              already address many use cases with different trade-offs around latency, guarantees, security, and
              throughput.


              On the launch side, the competitive set is also expanding. Neutron, Vulcan, Ariane 6, and New Glenn all
              aim to capture slices of the same commercial or government transport demand, even if not all are direct
              one-for-one substitutes for Falcon 9, Falcon Heavy, or Starship. The biggest non-demand constraint is
              regulation and safety. Direct-to-cell depends on spectrum frameworks, while Starship cadence depends on
              airspace integration and launch licensing. That means market size alone does not determine capture;
              execution, permissions, and trust determine whether theoretical demand converts into durable share.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
