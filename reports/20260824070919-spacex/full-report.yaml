      - number: '6.5'
        title: Customer Verdict — Real Adoption, High-Quality Flagships, Still Meaningful Concentration Unknowns
        blocks:
          - type: paragraph
            body: >-
              The customer base is unquestionably real. Public evidence spans millions of subscribers, airlines,
              mobile-network operators, NASA crew missions, lunar-system work, and research or astronaut mission
              surfaces. That already places SpaceX in a different category from companies still proving that anybody
              will pay them in production. The more subtle diligence question is not whether customers exist, but
              whether any one lane dominates too much of revenue or strategic value. Consumer Starlink appears to be the
              volume engine, while airlines, carriers, and government programs may matter disproportionately for
              reference quality, margin, and moat.

              The chapter's final customer judgment is therefore positive but not naive. SpaceX has broad adoption and
              unusually strong flagship validation. What remains missing is a precise public map of revenue
              concentration, contract duration, cohort retention, and the share of enterprise or government accounts
              that are deep production relationships rather than headline partnerships.
