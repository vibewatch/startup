  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The Core Risk Is Program Concentration Around Starship and High-Cadence Scale-Up
        blocks:
          - type: paragraph
            body: >-
              SpaceX does not face a normal portfolio of loosely connected startup risks. The public filing makes clear
              that Starship is the keystone for next-generation Starlink V3 deployment, V2 Mobile scaling, lunar
              ambitions, and even the more speculative orbital AI-compute program. That means one technical or
              regulatory bottleneck can transmit into product delays, customer disappointment, capex inefficiency, and
              valuation compression at the same time. The positive reading is that one successful platform can unlock
              several businesses; the negative reading is that execution dependency is unusually concentrated.

              That concentration is not abstract. The filing explicitly lists technical, supply-chain, infrastructure,
              and regulatory hurdles around Starship, while the FAA public record shows continuing environmental reviews
              and updated airspace-closure work even after major approvals were granted. The right investor stance is
              therefore not “SpaceX has many risks,” but rather “SpaceX has one giant scaling engine whose failure modes
              cascade across many revenue surfaces.”
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
