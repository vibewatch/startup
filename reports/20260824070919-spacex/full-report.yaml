        - id: risk
          label: Residual execution risk
          detail: Starship, regulation, leverage, and governance still sit on the critical path.
        - id: price
          label: Full private mark
          detail: $350B-class pricing already assumes a lot of future proof.
        - id: decision
          label: Track / selective only at discount
          detail: High-quality company; disciplined entry posture.
