      - number: '1.2'
        title: Products, scale signals, and commercial scope
        blocks:
          - type: paragraph
            body: >-
              The reviewed source pack supports a strong baseline view of product breadth and operational scale even
              where audited financial detail is missing. Falcon 9 and Falcon Heavy publish payload specifications that
              still underpin SpaceX’s launch leadership, while Dragon remains the only current private spacecraft able
              to return meaningful cargo to Earth and a core asset for NASA transport missions. Starship is still
              developmental but the official materials frame it as the fully reusable system meant to absorb future
              lunar, Mars, and high-capacity satellite deployment demand. The rideshare page adds an important
              commercial detail: SpaceX continues to expose price discovery to small payload customers with standardized
              booking and a visible low-end price floor.


              The adoption signals around Starlink are the clearest proof that SpaceX is already operating a scaled
              recurring-revenue business, even if full-company revenue remains opaque. TechCrunch documented a jump to 4
              million customers in September 2024, while CNBC pushed that figure to almost 5 million by November 2024
              and described nearly 7,000 satellites in orbit. CNBC’s aviation reporting also showed 2,500 aircraft under
              contract after the United deal, which turns Starlink from a rural-consumer story into a multi-segment
              connectivity business spanning households, aviation, maritime, and direct-to-cell partnerships.
            claimRefs:
