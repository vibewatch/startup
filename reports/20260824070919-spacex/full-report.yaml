  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Baseline: Falcon 9 Sets the Reference Price of Trust'
        blocks:
          - type: paragraph
            body: >-
              Any competitive analysis for SpaceX has to start with Falcon 9, because most launch alternatives are still
              judged against its combination of reusable economics, flight heritage, and schedule certainty. SpaceX does
              not merely publish vehicle specifications; it publishes a reusable launch product with a visible rideshare
              price floor and a public manifest deep enough to signal repeated operational success. The effect is that
              the benchmark is not just cost per kilogram or payload size. The benchmark is whether a rival can match a
              system that already flies at industrial cadence and can absorb internal constellation demand while still
              serving external customers.


              That matters because many competitors are still selling future confidence. SpaceX’s baseline offer is
              already live, already reusable, and already culturally familiar to commercial buyers, NASA, and the U.S.
              national-security ecosystem. In practical terms, Falcon 9 sets the “default yes” for many missions;
              challengers must explain why a buyer should switch away from that default.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP022
