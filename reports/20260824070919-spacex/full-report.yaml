  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Mix Is Now Legible, and Starlink Carries the P&L
        blocks:
          - type: paragraph
            body: >-
              The most important change since the earlier private-market reporting cycle is that SpaceX's 2026 S-1 makes
              the segment picture explicit. The filing says consolidated revenue reached $18.674 billion in 2025 and
              that the Connectivity segment, primarily Starlink, produced $11.387 billion of that total while also
              generating $4.423 billion of operating income and $7.168 billion of Segment Adjusted EBITDA. By contrast,
              the Space segment produced $4.086 billion of 2025 revenue but reported a $657 million operating loss after
              carrying major Starship and launch-facility investment. That mix matters because it changes the
              underwriting frame: SpaceX is not mainly a launch business with an attached satellite side project. Public
              evidence now supports the opposite interpretation. Launch, Dragon, Starshield, and exploration programs
              still matter strategically, but Starlink is the dominant revenue and profit engine that supports the
              broader platform.

              Revenue quality is still not perfect. The filing gives segment totals and some business-mix commentary,
              but it does not fully disclose product-by-product gross margins, deferred-revenue waterfalls, cohort
              retention, or contract concentration. Investors can now underwrite the broad mix with much higher
              confidence than before, yet they still cannot build a clean bottom-up model for every major revenue
              surface without management diligence materials.
