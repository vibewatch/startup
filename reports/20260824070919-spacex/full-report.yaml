      - number: '1.4'
        title: Leadership, milestones, and adverse context
        blocks:
          - type: paragraph
            body: >-
              The leadership picture is legible at the top and opaque beneath it. Third-party reporting clearly
              identifies Elon Musk as CEO and Gwynne Shotwell as president and COO, which is enough to conclude that
              SpaceX remains heavily key-person dependent even without a fetched board-governance page. What the public
              pack does not resolve is a full current board roster, cap table, or the governance mechanics that would
              matter most to a private-market investor evaluating control, related-party influence, or minority
              protections. That omission is material enough to carry forward as a diligence gap rather than something to
              smooth over.


              The adverse side of the company overview is now inseparable from Starship’s scale ambitions. FAA approvals
              have expanded the permitted annual cadence at Boca Chica, but CNBC, BBC, and ProPublica all show why this
              is a live diligence issue rather than a box-checking regulatory detail. Starship’s January 2025 explosion
              produced a grounding and property damage report, while ProPublica documented repeated launch failures,
              emergency airspace interventions, and mounting aviation-safety criticism. The net view is balanced but not
              naive: SpaceX has unmatched launch ambition and a uniquely broad product stack, yet its most important
              future platform still carries real execution and regulatory externality risk that later chapters must
              treat as first-order rather than incidental.
