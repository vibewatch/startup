      - number: '7.5'
        title: The Financial Model Can Absorb a Lot, but Only if Capex, Leverage, and Competition Stay Fundable
        blocks:
          - type: paragraph
            body: >-
              SpaceX now operates at a scale where balance-sheet risk must be taken seriously even if revenue growth
              remains strong. The S-1 and CNBC coverage show extraordinary capital expenditures, driven heavily by AI
              but still large in Space and Connectivity, while the filing also discloses more than $29 billion of
              principal indebtedness outstanding as of March 31, 2026. That does not signal immediate distress,
              especially with public-market access looming, but it does mean that execution slips can translate into
              real financing pressure instead of merely slower growth.

              Competitive timing adds urgency. CNBC's 2026 reporting shows Amazon's FCC-approved Leo buildout expanding,
              while the 2024 China megaconstellation coverage suggests geopolitical and industrial alternatives are
              proliferating. SpaceX still leads on scale and cadence, but a company investing this aggressively cannot
              assume that being first guarantees enduring pricing power or frictionless regulatory treatment. The
              financial risk is therefore not “SpaceX runs out of money tomorrow”; it is that the company keeps needing
              large, well-timed pools of capital while simultaneously defending execution leadership across multiple
              fronts.
            claimRefs:
