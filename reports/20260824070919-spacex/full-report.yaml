      - number: '7.2'
        title: Regulatory and Legal Friction Is No Longer Peripheral to the Business Model
        blocks:
          - type: paragraph
            body: >-
              SpaceX's regulatory burden rises with ambition. The S-1 says launch and reentry activity require numerous
              approvals, and that larger orbital infrastructure could require domestic and international authorizations
              potentially numbering up to one million satellites. The FAA's public Starbase materials show that the
              regulatory process now encompasses not only launch licenses but repeated environmental assessments,
              increased-cadence review, landing-trajectory work, temporary airspace closures, and public-comment
              processes. This is manageable for a mature aerospace prime, but for an aggressively iterative company it
              creates schedule uncertainty whenever failures or public opposition intensify scrutiny.

              Legal exposure also goes beyond ordinary permit work. Public NLRB and Fifth Circuit records show that
              labor-related disputes escalated into constitutional litigation over agency structure, while the DOJ
              publicly announced a discrimination case involving SpaceX's hiring posture toward asylees and refugees.
              None of these issues alone looks existential, but together they show that SpaceX's legal surface area now
              spans labor, employment, national-security, spectrum, safety, and environmental domains simultaneously.
            claimRefs:
              - CR007
