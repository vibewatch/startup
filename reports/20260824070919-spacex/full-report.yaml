        - Still far narrower in scope and cash generation than SpaceX.
      - - AST SpaceMobile
        - Public market cap
        - $26.71B market cap
        - Direct-to-cell optionality reference for satellite-to-phone enthusiasm.
        - Early-stage and far less diversified than SpaceX.
      - - EchoStar
        - Public market cap
        - $25.21B market cap
        - Useful satellite-connectivity and spectrum asset reference.
        - Different balance sheet and operating quality profile.
      - - Globalstar
        - Public market cap
        - $10.67B market cap
        - Shows how markets price smaller strategic satellite assets.
        - Much narrower service scope and scale.
      - - Viasat
        - Public market cap
        - $10.29B market cap
        - Connectivity incumbent reference for satellite broadband economics.
        - Legacy structure and debt profile make it a weak direct analog.
      - - Iridium
        - Public market cap
        - $5.18B market cap
        - Cash-generating satellite service reference with real government relevance.
        - Far smaller growth and ambition envelope than SpaceX.
      - - Amazon
        - Public market cap
        - $2.789T market cap
        - Upper-bound reminder that giant infrastructure platforms can justify huge equity values.
        - Not a direct operating comp for a space and telecom hybrid.
      - - SpaceX 2024–2026 pricing context
        - Private secondary marks / S-1 scale
        - $210B to $350B-class private pricing against $18.674B of 2025 revenue
        - Most relevant context for current entry discipline.
        - Private marks are not the same as continuous public-market clearing prices.
