company:
  name: SpaceX
chapter:
  number: 8
  title: Valuation
  summary: 'SpaceX is one of the strongest private-company quality stories in the market, but quality alone does not justify any entry price. The public record now supports a much more serious underwriting exercise than most late-stage private companies allow: the 2026 S-1 exposes real revenue scale, a highly profitable Starlink core, and strategic breadth across launch, government, and connectivity. It also exposes unusually high capex, large debt, concentrated founder control, and a roadmap still heavily dependent on Starship. The supportable call is track or selective-only-at-discount: at a $350B-class private mark, upside still exists, but too much of the bull case is already prepaid.'
sections:
- id: section-recommendation
  title: 'Recommendation: elite company, but the current private mark already prices in a lot of success'
  body: 'SpaceX has graduated from being valued on aspiration alone. The 2026 filing supports that the business already operates at real scale, with $18.674 billion of 2025 revenue, Starlink as the dominant profit engine, and visible government, launch, mobility, and mission-adjacent revenue surfaces. That matters because it separates SpaceX from the usual late-stage private company whose valuation rests on TAM slides and selective customer logos. Public evidence now supports a premium-quality judgment.


    The investment question, however, is no longer whether SpaceX is exceptional. It is whether a $350 billion-class private entry still leaves enough room for attractive risk-adjusted returns once Starship dependency, licensing drag, debt, capex intensity, and controlled-company governance are fully counted. On that question, the safer answer is to stay engaged but price-disciplined. The current mark is not obviously absurd, but it is demanding enough that a buyer needs either a discount, a differentiated access advantage, or more evidence that Starship and capital intensity are moving from thesis to proof.'
