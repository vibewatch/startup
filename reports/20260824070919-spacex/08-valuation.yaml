  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Starship commercial unlock
    - Exact timetable for sustained cadence, V3 deployment, and dependency reduction from test to operations.
    - This is the largest determinant of whether current optionality credit is deserved.
    - Program review and milestone deck.
  - - Debt and refinancing
    - Bridge-loan path, rate sensitivity, and deleveraging plan.
    - Large debt matters far more at a full private price than at a distressed one.
    - Treasury and CFO diligence.
  - - Segment separability
    - Clear view of Starlink, Space, and AI economic boundaries after the 2026 filing.
    - Investors need to know what exactly they are paying for and subsidizing.
    - Finance data room and management Q&A.
  - - Government concentration
    - Revenue and backlog concentration by NASA, DoD, and other major programs.
    - Strategic prestige is good, but concentrated milestone revenue changes downside math.
    - Customer concentration schedule.
  - - Governance and succession
    - Independent-check mechanisms and bench depth around Musk-controlled governance.
    - Controlled-company status deserves an explicit rather than assumed discount.
    - Board and governance diligence.
  notes: These asks are the minimum set needed to convert admiration for the company into a disciplined underwriting file.
