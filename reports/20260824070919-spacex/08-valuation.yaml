- id: section-thesis-antithesis
  title: Thesis and anti-thesis both have real evidence behind them
  body: 'The pro-valuation case is straightforward. SpaceX combines business lines that public markets usually value separately: launch, satellite broadband, direct-to-cell optionality, government connectivity, and human-spaceflight trust. The filing and customer evidence show that Starlink is not only large but already profitable at the operating level, while NASA, Starshield, and launch cadence create scarcity value that most peers cannot match. That mix justifies a strategic premium to narrow satellite or launch comparables.


    The anti-thesis is equally real. Starship remains the main unlock for V3 satellites, direct-to-cell scaling, and broader optionality, so a large share of future valuation still rides on one hard program. The risks chapter also established that regulation, safety externalities, and governance concentration are not cosmetic issues. A buyer at an already elevated mark is therefore paying for a business with genuine proof and genuine unresolved transmission risks at the same time.'
  claimRefs:
  - CV009
