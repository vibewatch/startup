    type: company-claimed
    topic: scale
    confidence: medium
    freshness: current
    sourceRefs:
    - SV001
  - id: CV003
    statement: A valuation call on SpaceX should be price-sensitive because company quality and entry attractiveness are no longer the same question.
    type: inferred
    topic: recommendation
    confidence: medium
    freshness: recent
    sourceRefs:
    - SV001
    - SV003
    - SV004
  - id: CV004
    statement: At a $350 billion-class private mark, the supportable posture is track or selective-only-at-discount rather than an unconditional buy.
    type: inferred
    topic: recommendation
    confidence: medium
    freshness: recent
    sourceRefs:
    - SV001
    - SV003
  - id: CV005
    statement: Recommendation confidence is medium because the evidence base has improved materially, but major drivers still depend on Starship and financing outcomes.
    type: inferred
    topic: recommendation
    confidence: medium
    freshness: recent
    sourceRefs:
    - SV001
    - SV007
    - SV010
  - id: CV006
    statement: Risk remains high because execution, regulation, leverage, and governance can all compress returns without destroying the business.
    type: inferred
    topic: risk-rating
    confidence: medium
    freshness: recent
    sourceRefs:
    - SV001
    - SV007
    - SV010
    - SV011
