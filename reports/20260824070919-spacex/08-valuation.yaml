  - id: CV001
    statement: The 2026 filing gives investors enough public disclosure to treat SpaceX as an underwritable operating business rather than only a prestige private mark.
    type: inferred
    topic: recommendation
    confidence: medium
    freshness: current
    sourceRefs:
