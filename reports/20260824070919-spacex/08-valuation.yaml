- id: section-comps-diligence
  title: Public comparables prove scarcity value, but they also show how much is being prepaid
  body: 'The comparable exercise is useful only as a bounding tool. Public satellite and space peers such as Rocket Lab, AST SpaceMobile, EchoStar, Globalstar, Viasat, and Iridium trade at market caps far below SpaceX''s private valuation. That proves two things at once: first, SpaceX deserves a large scarcity premium because it is broader, stronger, and more strategically important than any one of those companies; second, the valuation gap is so large that an investor is inevitably underwriting future execution rather than current public-market parity. Amazon is a reminder that giant infrastructure platforms can justify trillion-dollar equity values, but it is not a direct comp because its cash-generation breadth and capital-market flexibility are radically different.


    That leads directly to diligence. Before accepting a $350 billion-class entry, an investor should ask for cleaner evidence on Starship milestone timing, debt and refinancing posture, segment separability after AI-related complexity, and the exact economics of government and enterprise growth. Without that, the right posture is not bearishness on SpaceX as a company; it is discipline on SpaceX as a price.'
