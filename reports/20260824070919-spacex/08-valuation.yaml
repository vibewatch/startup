- id: section-current-mark
  title: Current price support is better than before, but the multiple is still rich on public evidence
  body: 'The most important change versus the earlier tender-offer era is that the S-1 allows a real bridge from valuation to operating facts. Using the filing''s $18.674 billion of 2025 revenue, a $210 billion valuation implies roughly 11.2x revenue while a $350 billion valuation implies roughly 18.7x revenue. Those are not impossible multiples for a unique infrastructure platform, but they are premium valuations even before fully capitalizing risk. They also arrive while the filing still shows enormous capex, more than $29 billion of principal debt, and a company-level GAAP loss despite Starlink profitability.


    That combination is why the current mark should be treated as a bull-leaning price rather than as a neutral entry point. The valuation is no longer backed only by storytelling; it is backed by real revenue and profit centers. But it also already reflects expectations that SpaceX will keep compounding scale, that Starship will unlock the next leg, and that financing markets will remain supportive while the company funds an unusually broad roadmap.'
