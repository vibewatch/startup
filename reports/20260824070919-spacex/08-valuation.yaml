- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - key assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Starship cadence improves meaningfully, V3 deployment scales, Starlink keeps monetizing a larger base, and financing markets remain supportive.
    - $420B–$500B fair-value zone becomes plausible if platform optionality converts into visible operating proof.
    - Requires several difficult execution and policy variables to go right at once.
    - low-medium
  - - Base
    - Starlink stays strong, launch and government demand remain durable, but Starship de-risks slower and leverage plus capex keep valuation discipline in place.
    - $260B–$320B is supportable for a premium but still execution-heavy infrastructure platform.
    - This scenario leaves the current mark looking somewhat rich rather than cheap.
    - medium
  - - Bear
    - Starship ramps slowly, regulatory friction persists, financing tightens, or AI/capex complexity drags on investor willingness to pay.
    - $160B–$220B reflects strong assets with far less optionality credit and more balance-sheet discount.
    - No business collapse is needed; only slower proof and tighter capital.
    - medium
  notes: Ranges are author estimates using public evidence only; they inform entry discipline rather than mimic management guidance.
