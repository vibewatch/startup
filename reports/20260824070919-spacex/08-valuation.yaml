- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Starship timing break
    - Repeated major delay cycles or failure to show credible cadence improvement through the next operating window.
    - The largest source of optionality credit stops converting into proof.
    - Move from watchful optimism to explicit de-rating of the bull case.
  - - Financing-pressure break
    - Debt costs or refinancing needs rise while capex remains elevated and execution slips.
    - Valuation becomes balance-sheet constrained rather than growth constrained.
    - Require materially lower entry pricing or avoid new exposure.
  - - Regulatory-friction break
    - FAA or other approvals materially slow launch tempo or meaningful new restrictions accumulate.
    - Revenue timing and platform expansion assumptions lose credibility.
    - Cut scenario weights toward base/bear immediately.
  - - Governance break
    - Material strategic change occurs without meaningful outside-check visibility.
    - Controlled-company discount widens because investors cannot rely on normal governance controls.
    - Demand larger margin of safety before participating.
  - - Proof-to-price break
    - Secondary or private pricing continues rising ahead of operating proof improvement.
    - Return compression occurs even if company quality remains high.
    - Pass on new money until evidence catches up to mark.
  notes: These triggers focus on monitorable events rather than on narrative mood swings.
