- id: section-scenarios
  title: Scenario work supports a range, not a blanket endorsement of the current mark
  body: 'The right valuation method here is scenario-based rather than comp-only. In the bull case, SpaceX proves repeatable Starship progress, deploys V3 at pace, keeps Starlink''s profit engine expanding, and converts strategic breadth into a market willingness to underwrite the company more like a category-defining infrastructure platform than like a conventional aerospace prime. In that world, a valuation above the current private mark is supportable.


    The base case is less forgiving. It assumes Starlink remains powerful, launch and government demand stay real, but Starship commercial de-risking takes longer and capex plus leverage keep investors from paying peak strategic premiums across every business line at once. The bear case does not require business collapse; it only requires a slower Starship ramp, tighter financing conditions, or heavier regulatory drag. Under those conditions, the present mark looks much more like a ceiling than a bargain.'
