- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - direction
  - argument
  - what would change the view
  rows:
  - - thesis
    - Starlink already gives SpaceX a real large-scale and profitable connectivity core rather than a speculative future subscription story.
    - If Starlink margin or subscriber quality weakens materially, the premium case compresses fast.
  - - thesis
    - SpaceX combines launch, government, mission, and broadband surfaces in a way no public comp fully matches.
    - If integrated breadth stops producing cross-segment operating leverage, investors may treat the company as a messy conglomerate instead of a platform.
  - - thesis
    - NASA, government, and enterprise proof support a strategic premium beyond simple retail subscriber metrics alone.
    - If those programs prove lumpy, politically contingent, or less monetizable than expected, premium support weakens.
  - - anti-thesis
    - A large share of the next valuation step still depends on Starship and the cadence it enables.
    - Clear Starship de-risking and sustained operational cadence would reduce this objection materially.
  - - anti-thesis
    - Capex, debt, and AI-related complexity make present economics less clean than the headline Starlink story implies.
    - Greater segment separation and visible deleveraging or capex normalization would improve underwriteability.
  - - anti-thesis
    - Controlled-company governance means outside investors have fewer checks if strategy or risk appetite changes.
    - More independent governance and clearer succession depth would modestly narrow the discount.
  notes: The anti-thesis is the reason a premium company can still be an unattractive entry at the wrong price.
