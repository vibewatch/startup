  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gaps
      missingEvidence: A current state-by-state premium and policy count dataset separating Kin's eligible, served, and obtainable residential-property segments.
      whyItMatters: The public $110 billion estimate is historical and the $100 billion figure is insured property value, so neither establishes current SAM or SOM.
      diligencePath: Request current written premium, policy count, eligibility, and competitor-capacity data by state from Kin and relevant state insurance departments.
      relatedQuestionRefs: [QM003, QM009]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-economics
      missingEvidence: Segment-level conversion, retention, renewal, shopping, and contribution-margin evidence for homeowners, landlord, auto, lending, and partner-led products.
      whyItMatters: Market demand does not establish that Kin can convert or profitably retain each adjacent segment.
      diligencePath: Obtain cohort dashboards and product-level unit economics under confidentiality, reconciled to statutory carrier results.
      relatedQuestionRefs: [QM004, QM008]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: material
      topic: capital-capacity
      missingEvidence: State-specific catastrophe stress tests, reinsurance attachment and exhaustion terms, and residual-market regulatory constraints.
      whyItMatters: Capital protection can support growth but does not remove underwriting, affordability, or solvency risk.
      diligencePath: Review carrier filings, catastrophe-model outputs, reinsurance treaties, bond offering documents, and regulator correspondence.
      relatedQuestionRefs: [QM006, QM007]
    - type: conflicting-data
      severity: minor
      topic: loss-ratio
      missingEvidence: Independently reconciled statutory results that explain the relationship between Kin's non-GAAP gross adjusted loss ratio and industry net combined-ratio measures.
      whyItMatters: The measures have different definitions and denominators and cannot be used as direct evidence of relative profitability.
      diligencePath: Reconcile audited or statutory carrier statements, reinsurance recoverables, earned premium, and subscriber-surplus adjustments.
      relatedQuestionRefs: [QM006, QM008]
