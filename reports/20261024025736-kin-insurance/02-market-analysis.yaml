      - [Swiss Re Institute, 2024-2025, Global, "$137bn insured natural-catastrophe losses in 2024", "Trend toward $145bn in 2025", "Insurance-market loss analysis", high, "Global catastrophe losses are a risk-capacity lens; not a U.S. homeowners TAM"]
    notes: >-
      Values use each publisher's own unit and denominator. The rows are
      complementary lenses, not a funnel or additive market build; the Kin
      figures are company-reported and the industry figures are third-party
      estimates or forecasts.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM016]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Underserved catastrophe-exposed homeowner, Homeowner, Household decision maker, Household premium budget, Quote and bind coverage digitally, Household / mortgage obligation, Incumbent withdrawal or nonrenewal]
      - [New or renewing homeowner with price sensitivity, Homeowner, Household, Household premium budget, Compare coverage and premium, Household, Agent overhead and rate pressure]
      - [Landlord or condo owner, Property owner, Owner or property manager, Property owner, Select specialized property form, Owner / property operating budget, Need for a state-available policy form]
      - [Mortgage-required borrower, Lender and borrower, Borrower, Borrower under lender requirement, Verify continuous coverage and claims path, Borrower with lender constraint, Closing or renewal coverage requirement]
      - ["State insurance ecosystem", "State regulator or residual plan", "Insurers and policyholders", "Insurers and policyholders", "Rate; capacity; and residual-market balancing", "State system / insurer capital", "Affordability and solvency pressure"]
    notes: >-
      Buyer-map rows synthesize documented Kin products, direct distribution,
      California market conditions, and the lender-linked nature of homeowners
      coverage; no row is presented as a measured segment count.
    claimRefs: [CM001, CM003, CM004, CM010, CM011]
figures:
  - id: FM001
    title: "Market sizing lens: from homeowner need to risk capacity"
    type: pyramid
    summary: Separate evidence lenses show why Kin's obtainable market cannot be inferred by adding exposure, premium, and catastrophe-loss figures.
    data:
      items:
        - label: Global insured natural-catastrophe losses
          value: 137
          unit: USD bn, 2024
          note: Swiss Re reported insured losses; global risk-capacity context, not Kin TAM.
        - label: U.S. homeowners share of P/C premiums
          value: 15.6
          unit: percent, 2024
          note: Triple-I product-line share; denominator is all P/C premiums.
        - label: Kin historical licensed-market lens
          value: 110
          unit: USD bn, 2021
          note: Kin company estimate for states enabled by acquired licenses.
        - label: Kin total insured property value
          value: 100
          unit: USD bn, 2025 announcement
          note: Insured exposure, not premium revenue.
        - label: Kin Florida concentration
          value: 75
          unit: percent of TIV, 2024
          note: Company-reported geographic concentration after expansion.
        - label: Homeowners NWP growth forecast
          value: 11.8
          unit: percent, 2025 forecast
          note: Triple-I industry forecast; not Kin growth.
    approximationNotes: >-
      Layers are ordered by analytical lens and are not proportional, additive,
      or a conversion funnel. Values retain their source units and periods.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM014, CM016]
