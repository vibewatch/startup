company:
  name: Kin Insurance
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Kin is a private, Chicago-founded direct-to-consumer insurer serving
    catastrophe-exposed homeowners through a multi-entity operating and carrier
    structure. Public evidence shows material insured-property, premium, and
    revenue scale, but current ownership, board control, headcount, customer count,
    and carrier-level catastrophe economics remain unavailable.
sections:
  - id: identity-and-model
    title: Identity, model, and legal perimeter
    body: >-
      Kin was founded in Chicago in 2016 and sells homeowners insurance directly
      through digital channels, concentrating on states exposed to hurricanes,
      wildfire, and other severe weather. The model removes the traditional
      retail-agent layer, but it does not make Kin a single conventional carrier.
      Independent reporting describes Kin Insurance, Inc. as attorney-in-fact for
      policyholder-owned reciprocal exchanges, while Kin's own disclosure says
      policies are distributed and serviced through a licensed producer agency.
      California adds another distinction: policies are marketed by a surplus-lines
      broker and underwritten by a non-admitted carrier. Diligence therefore needs
      to separate the operating company, managed exchanges, distributors, and
      underwriting counterparties rather than treating all reported metrics as one
      balance sheet.
    claimRefs: [CO001, CO006, CO008, CO012]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founder record, and governance
    body: >-
      Sean Harper remains the clearest continuity point: the Q1 2026 company
      release and two profiles identify him as co-founder and CEO. The same release
      identifies Jerry Fadden as CFO and Angel Conlin as chief insurance officer,
      providing visible finance and underwriting leadership. The historical founder
      record is less consistent. Insurance Business names Harper, Lucas Ward, and
      Sebastian Villarreal, whereas CNBC also names Stephen Wooten. This discrepancy
      may be definitional rather than substantive, but the assigned evidence does
      not resolve it. More importantly, none of the retained sources supplies a
      current board roster, ownership schedule, voting rights, or succession plan,
      leaving material key-person and governance questions around Harper and the
      investor-policyholder structure.
    claimRefs: [CO002, CO003, CO004, CO005]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Capital history and operating scale
    body: >-
      Public profiles converge on approximately $265 million of funding, although
      they use different labels: Netfigo calls it total funding, while the Polsky
      Center described approximately $265 million of total equity funding in
      September 2023. Polsky also reported a $1 billion company value at that time;
      the assigned evidence does not support a current valuation or reconcile any
      subsequent securities, debt, or secondary transactions. Operating indicators
      are more recent but remain unaudited public disclosures. Reinsurance News
      reported 2025 gross written premium of $634.4 million and total revenue of
      $201.6 million. Kin's Q1 2026 release said it operated in 14 states. Revenue,
      premium, funding, valuation, and cash available are distinct measures and
      should not be substituted for one another.
    claimRefs: [CO007, CO009, CO010, CO014, CO015]
    tableRefs: [TO003]
  - id: milestones-and-risk
    title: Expansion milestones and evidence limits
    body: >-
      Kin's development path includes a 2021 acquisition of an inactive carrier
      licensed in 43 states, a March 2025 California launch, and a company-reported
      crossing of $100 billion in total insured property value in April 2025. These
      milestones show expanded capacity and reach, not automatically realized
      nationwide operations or independently verified underwriting quality. The
      company reported 14 operating states in Q1 2026, well below the acquired
      carrier's license count. Independent reviews also identify practical
      constraints: limited geographic availability, no face-to-face agent channel,
      and a shorter catastrophe-claims history than established carriers. Public
      milestones therefore support scale and specialization, while leaving
      state-by-state profitability, reserve development, reinsurance attachment
      points, and severe-event claims execution as core diligence gaps.
    claimRefs: [CO007, CO011, CO012, CO013, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Focused catastrophe-market platform
    body: >-
      Kin combines direct digital distribution with a carrier structure designed
      for homeowners in difficult catastrophe-exposed markets and reported operating
      in 14 states during Q1 2026.
    claimRefs: [CO006, CO007, CO008]
  - calloutType: risk
    title: Scale does not resolve carrier economics
    body: >-
      Reported insured value, premium, and revenue do not establish reserve adequacy,
      reinsurance durability, or cash available at the operating company.
    claimRefs: [CO013, CO014, CO015, CO016]
