evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, ownership schedule, voting rights, investor protections, and executive succession plan.
    whyItMatters: >-
      Control and continuity determine how investors and policyholder-owned exchanges share risk, economics, and
      decision rights.
    diligencePath: >-
      Request the current cap table, charter, investor-rights agreements, board materials, and succession plan under
      NDA.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: founder-roster
    missingEvidence: A primary corporate record reconciling the three-person and four-person founder rosters.
    whyItMatters: The discrepancy affects attribution and may indicate differing definitions of founding participation.
    diligencePath: Confirm the founder record through incorporation documents and a signed company response.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: financing
    missingEvidence: >-
      A current capitalization and financing schedule covering all equity, debt, and secondary transactions after
      September 2023.
    whyItMatters: >-
      Historical funding and valuation figures do not establish present ownership, cash availability, debt burden, or
      entry economics.
    diligencePath: >-
      Reconcile signed financing documents, debt schedules, secondary transfers, and cash balances to the current cap
      table.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: carrier-economics
    missingEvidence: Entity-level statutory financials, reserve development, catastrophe stress tests, and reinsurance treaty terms.
    whyItMatters: >-
      Operating-company revenue and insured-property scale do not establish carrier solvency or severe-event claims
      capacity.
    diligencePath: >-
      Obtain statutory statements, actuarial reserve opinions, catastrophe models, and ceded-reinsurance schedules for
      each carrier.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: scale
    missingEvidence: Current customer count, policy count, headcount, office locations, and state-by-state in-force exposure.
    whyItMatters: These denominators are required to assess productivity, concentration, retention, and operating leverage.
    diligencePath: Request a dated KPI pack with metric definitions, entity scope, period ends, and state-level exposure.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gaps
    missingEvidence: >-
      A current state-by-state premium and policy count dataset separating Kin's eligible, served, and obtainable
      residential-property segments.
    whyItMatters: >-
      The public $110 billion estimate is historical and the $100 billion figure is insured property value, so neither
      establishes current SAM or SOM.
    diligencePath: >-
      Request current written premium, policy count, eligibility, and competitor-capacity data by state from Kin and
      relevant state insurance departments.
    relatedQuestionRefs:
