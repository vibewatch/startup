              him as co-founder and CEO. The same release identifies Jerry Fadden as CFO and Angel Conlin as chief
              insurance officer, providing visible finance and underwriting leadership. The historical founder record is
              less consistent. Insurance Business names Harper, Lucas Ward, and Sebastian Villarreal, whereas CNBC also
              names Stephen Wooten. This discrepancy may be definitional rather than substantive, but the assigned
              evidence does not resolve it. More importantly, none of the retained sources supplies a current board
              roster, ownership schedule, voting rights, or succession plan, leaving material key-person and governance
