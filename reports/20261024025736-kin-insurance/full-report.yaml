      - number: '5.3'
        title: Trust, safety, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              Kin's technology proposition is inseparable from insurance execution. The company reports improved
              adjusted loss ratios and geographic diversification, while its Q1 2026 release says the infrastructure is
              driven by investments in software and AI and that non-catastrophe adjusted loss ratios were consistent
              with the prior year. Those are company-reported operating signals, not independent validation of the
              models or controls. Product scope also varies by state: Kin's California disclosures identify
              surplus-lines distribution and a non-admitted underwriting carrier, and its general terms state that
              coverage availability and qualifications vary. The principal implementation risks are therefore model
              drift under changing weather, state-by-state product and licensing constraints, claims-service quality
              after a catastrophe, and opacity around privacy, security, incident history, and model governance.
              Customer ratings are positive but company-hosted and do not substitute for claims, complaint, or security
              audits.
            claimRefs:
              - CE009
              - CE010
              - CE012
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite the control plane, not just the interface
            body: >-
              The next diligence step should obtain model governance, security and privacy evidence, state-by-state
              carrier metrics, claims-service performance, and reinsurance terms before treating Kin's technology moat
              as independently verified.
            calloutType: recommendation
            claimRefs:
