        title: Expansion milestones and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Kin's development path includes a 2021 acquisition of an inactive carrier licensed in 43 states, a March
              2025 California launch, and a company-reported crossing of $100 billion in total insured property value in
              April 2025. These milestones show expanded capacity and reach, not automatically realized nationwide
              operations or independently verified underwriting quality. The company reported 14 operating states in Q1
              2026, well below the acquired carrier's license count. Independent reviews also identify practical
              constraints: limited geographic availability, no face-to-face agent channel, and a shorter
              catastrophe-claims history than established carriers. Public milestones therefore support scale and
              specialization, while leaving state-by-state profitability, reserve development, reinsurance attachment
