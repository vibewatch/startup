chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, model, and legal perimeter
        blocks:
          - type: paragraph
            body: >-
              Kin was founded in Chicago in 2016 and sells homeowners insurance directly through digital channels,
              concentrating on states exposed to hurricanes, wildfire, and other severe weather. The model removes the
              traditional retail-agent layer, but it does not make Kin a single conventional carrier. Independent
              reporting describes Kin Insurance, Inc. as attorney-in-fact for policyholder-owned reciprocal exchanges,
              while Kin's own disclosure says policies are distributed and serviced through a licensed producer agency.
              California adds another distinction: policies are marketed by a surplus-lines broker and underwritten by a
              non-admitted carrier. Diligence therefore needs to separate the operating company, managed exchanges,
              distributors, and underwriting counterparties rather than treating all reported metrics as one balance
              sheet.
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO012
