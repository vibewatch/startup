company:
  name: Kin Insurance
chapter:
  number: 6
  title: Customers
  summary: Kin shows substantial and growing policy adoption, with renewal written premium becoming the larger growth engine and home-to-auto bundling producing an important retention signal. The evidence is strongest for in-force scale, premium cohorts, and customer-service ratings; customer-level retention, cohort denominators, and concentration remain incompletely disclosed.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: Kin targets homeowners in catastrophe-exposed U.S. markets and sells directly rather than through a retail agent network. The customer is generally a homeowner, while the payer is the policyholder and the insured risk is the property; the company also sells to adjacent landlord, condo, mobile-home, flood, auto, and home-finance needs. CNBC Select describes Kin as suitable for higher-risk homes and notes that customers can complete the quote and purchase online, while its independent review also identifies the limited geographic footprint and lack of a mobile app. Kin's own descriptions emphasize underserved homeowners and state-specific risk pricing, but these are company claims rather than independently measured segment economics. The customer segmentation therefore appears strategically coherent, but the pool does not disclose revenue or policy counts by property type, geography, channel, or product.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and renewal engine
    body: Public operating evidence indicates a sizable and expanding book. Kin reported more than 250,000 home policies in force in June 2026, while its Q2 release reported premium in force of $701.1 million, gross written premium of $218.9 million, and record monthly bind volume in May and June. Reinsurance News independently reported 2025 gross written premium of $634.4 million, up 28% year over year, with renewal written premium rising from $302 million in 2024 to $439.9 million in 2025 while new written premium was broadly stable at $194.5 million. That mix supports a renewal-led adoption story, but neither source supplies a consistent active-policy denominator, cancellation curve, state mix, or customer-count bridge. Premium growth should not be read as equivalent to customer growth.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-retention
    title: Named proof, service signals, and durability
    body: The assigned evidence contains little named customer deployment proof in the conventional enterprise sense because Kin sells insurance policies to households rather than software seats. The strongest customer proof is therefore policy adoption, independent consumer-review coverage, and the scale of third-party ratings. CNBC Select reports an A+ Better Business Bureau rating and relatively few National Association of Insurance Commissioners complaints, while also noting that Kin has not appeared in J.D. Power's Home Insurance Studies because of its size. Kin's June and August 2026 releases cite large Google, BBB, and Trustpilot review populations and USA TODAY recognition based on surveys, but those releases are company-issued. The evidence supports a positive service signal, not a verified retention cohort or claims-outcome measure.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: expansion-and-gaps
    title: Expansion, concentration, and diligence implications
    body: >-
      Kin's land-and-expand motion is clearest in home-to-auto bundling. The company says auto launched for Texas and Florida home customers after a Texas pilot, reached more than $6 million of auto gross written premium in five months, and later reported $10 million of Q2 auto gross written premium; it also claims that adding auto cuts attrition approximately in half and generates two- to three-times higher lifetime value. These figures are management-reported and lack cohort definitions, control groups, and product-level contribution margins. Geography is another constraint: Kin reports 14 states representing 50% of its home-insurance total addressable market, while CNBC's review highlights limited availability. Investors still need state-by-state policy counts, top-customer or channel concentration, renewal and churn cohorts, claims satisfaction, and the economics of finance and partner-led cross-sell.
    claimRefs: [CU014, CU015, CU016, CU017]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Renewal base is becoming the adoption engine
    body: Independent reporting shows renewal written premium materially outpaced new written premium in 2025, consistent with a maturing in-force book rather than growth driven only by acquisition.
    claimRefs: [CU006, CU007]
  - calloutType: risk
    title: Retention claims remain under-specified
    body: Kin reports stronger renewal and bundling economics, but public evidence does not provide cohort denominators, gross or net retention, cancellation timing, or a control group for the claimed attrition and lifetime-value effects.
    claimRefs: [CU009, CU014, CU015]
