  topStrengths:
    - Direct digital distribution focused on underserved catastrophe-exposed markets.
    - Reported improvement in reciprocal-exchange loss ratios and positive adjusted net income in 2024.
    - Expanding product and geographic footprint, including auto and California operations.
  topRisks:
    - Carrier-level profitability, reserves, reinsurance attachment points, and catastrophe stress remain opaque.
    - Series E security terms, debt constraints, dilution, and effective common-equity economics are undisclosed.
    - Retention cohorts and contribution margins for auto, finance, and partner-led products are under-specified.
  unresolvedGaps:
