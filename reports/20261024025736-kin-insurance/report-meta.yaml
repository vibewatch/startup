companyProfile:
  summary: >-
    Kin is a private, Chicago-founded direct-to-consumer insurer serving catastrophe-exposed homeowners through a
    multi-entity operating and carrier structure. It combines digital distribution and property-level data with
    reciprocal exchanges and related products, while public evidence leaves carrier-level catastrophe economics and
    governance incompletely disclosed.
