  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financing
      missingEvidence: "Series E preferred-security terms, cap table, option pool, secondary-sale mix, liquidation preferences, and current common-equity price."
      whyItMatters: "The $2 billion pre-money mark cannot be translated into investor return or downside without the rights and dilution attached to the securities."
      diligencePath: "Obtain the executed financing documents, fully diluted cap table, latest 409A or board valuation, and an ownership waterfall from management or the lead investors."
      relatedQuestionRefs: [QV001, QV002]
    - type: missing-source
      severity: material
      topic: financial-model
      missingEvidence: "Audited or statutory entity-level revenue, GWP, loss-ratio, reserve-development, operating-margin, and cash-flow reconciliation."
      whyItMatters: "Kin's operating metrics span reciprocal exchanges, carrier entities, and the operating company, so reported revenue and profitability may not equal distributable equity earnings."
      diligencePath: "Request monthly management accounts, statutory statements, reserve triangles, intercompany fee schedules, and a bridge from carrier results to Kin Insurance, Inc. economics."
      relatedQuestionRefs: [QV003, QV007]
    - type: missing-source
      severity: material
      topic: reinsurance
      missingEvidence: "Catastrophe-model outputs, attachment and exhaustion points, collateral requirements, renewal pricing, and state-level surplus headroom."
      whyItMatters: "The value proposition depends on writing catastrophe-exposed business while remaining able to pay claims and renew protection after severe events."
      diligencePath: "Review catastrophe stress tests, reinsurance treaties, catastrophe-bond offering materials, collateral schedules, and regulator filings by carrier and state."
      relatedQuestionRefs: [QV005, QV006]
    - type: missing-source
      severity: minor
      topic: cross-sell
      missingEvidence: "Auto and lending cohort retention, attachment, CAC, contribution margin, and policy-level profitability."
      whyItMatters: "A reported customer-value increase may not be incremental equity value if retention, claims, or financing costs consume the benefit."
      diligencePath: "Request cohort-level contribution waterfalls for bundled and unbundled customers, split by state and product, with renewal and claims outcomes."
      relatedQuestionRefs: [QV007, QV008]
