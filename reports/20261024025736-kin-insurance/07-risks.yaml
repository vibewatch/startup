    notes: "Likelihood and severity are qualitative risk judgments anchored to the cited peril, operating, and regulatory evidence; no public incident dashboard was located."
    claimRefs: [CR001, CR004, CR006, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
