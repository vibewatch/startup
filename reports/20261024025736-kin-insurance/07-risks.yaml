callouts:
  - calloutType: risk
    title: Underwriting resilience is the central diligence gate
    body: "Kin reports improving loss performance, but catastrophe severity, reinsurance leverage, and carrier-level reserve evidence determine whether that improvement survives a stressed event."
    claimRefs: [CR001, CR002, CR003]
  - calloutType: recommendation
    title: Require carrier-level evidence before underwriting a clean risk view
    body: "Request statutory statements, reserve triangles, treaty terms, claims samples, and state-by-state regulatory records before treating reported corporate profitability as durable."
    claimRefs: [CR006, CR008, CR011, CR012]
