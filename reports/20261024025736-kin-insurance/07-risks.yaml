      - [Reciprocal exchanges, "Kin-managed policyholder-owned exchanges", "Core model", "Surplus or reserve pressure constrains growth and claims payment", "Very high", "Reciprocal structure and underwriting controls", "High"]
      - [Carrier and policy partners, "Licensed and surplus-lines carriers", "State-dependent", "Partner exits, license limits, or policy-form restrictions", "High", "Acquired licenses and multi-state expansion", "Medium-high"]
      - [Customer renewal economics, "Home policyholders and renewal cohorts", "Core revenue driver", "Churn or acquisition-cost inflation removes first-renewal payback", "High", "Digital servicing, bundling, and renewal revenue base", "Medium-high"]
    notes: "Dependency concentration is described qualitatively because public disclosures do not provide counterparty-level shares, treaty limits, or renewal cohorts."
    claimRefs: [CR002, CR009, CR010, CR011, CR012]
