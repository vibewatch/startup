      - [Home finance, "Mortgage, refinance, or equity product", "Product is described but revenue, take rate, and margin are not disclosed", "Private-evidence gap; request lender economics and credit-risk allocation"]
    notes: "No public assigned source provides a complete realized price book; unknowns are intentionally retained rather than estimated."
    claimRefs: [CI004, CI013, CI014, CI015]
  - id: TI003
    title: Unit economics and underwriting indicators
    columns: [Metric, Value, Confidence, Why it matters and diligence ask]
    rows:
      - [Total revenue, "$201.6M FY2025; $68M Q2 2026", high, "Shows scale but reconcile consolidated parent scope and revenue recognition"]
      - [Baseline operating margin, "49% FY2025; 57% Q2 2026", high, "Indicates renewal-book leverage; reconcile non-GAAP bridge and carrier fees"]
      - [Growth operating income, "-$47.3M FY2025", high, "Acquisition is not yet profitable on Kin’s definition; request CAC and payback by cohort"]
      - [Adjusted loss ratio, "20.7% FY2025; 25.9% FY2024", medium, "Carrier economics depend on weather and reinsurance; request statutory and catastrophe-normalized results"]
      - ["Cash, burn, and runway", null, low, "Not disclosed in assigned evidence; request parent cash, debt, restricted collateral, burn, and runway"]
    notes: "Reported operating metrics are management-defined and the loss ratios are for managed reciprocal exchanges; null means the assigned public evidence does not disclose the metric."
    claimRefs: [CI005, CI007, CI009, CI010, CI012]
