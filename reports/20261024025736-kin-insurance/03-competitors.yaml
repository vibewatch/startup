        - label: "Residual market / internal build"
          x: 1
          y: 1
          detail: "This is a substitute category with no comparable public operating metric in the assigned pool."
    approximationNotes: "Analyst-coded ordinal axes: x=direct relationship and distribution integration (1 low, 5 high); y=evidence of catastrophe-market specialization (1 low, 5 high). Scores reflect retained disclosures, not measured performance."
    claimRefs: [CP004, CP006, CP010, CP011, CP012, CP016]
