  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: store-level-economics
      missingEvidence: Audited store-level contribution margins, same-store sales growth, and cohort payback metrics across GCC company-owned outlets and partner kitchens.
      whyItMatters: Without unit-level unit economics, overall corporate profitability claims cannot distinguish between high-margin software/royalty streams and capital-intensive kitchen operations.
      diligencePath: Request confidential store-level P&L breakdowns, four-wall EBITDA schedules, and same-store volume trends under NDA in management diligence.
      relatedQuestionRefs:
        - QV009
    - type: missing-source
      severity: material
