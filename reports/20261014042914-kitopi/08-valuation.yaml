  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Perspective
      - Core Argument
      - Evidence Anchor
      - What Would Change View
    rows:
      - - Thesis Pillar 1
        - Proprietary SKOS tech stack optimizes multi-brand kitchen operations and driver dispatch
        - Over 200 operational locations managed across UAE, Saudi Arabia, Kuwait, Bahrain, and Qatar
        - Evidence of kitchen prep bottlenecks or customer order fulfillment degradation
      - - Thesis Pillar 2
        - Shift to owned brand incubation (AWJ, Operation Falafel) captures full food retail margin
        - Acquisition of AWJ group with 30+ outlets and global franchise presence in New York and London
        - Slowing same-store sales growth across acquired restaurant concepts
      - - Anti-Thesis Pillar 1
        - Heavy capital intensity and senior debt service burden limit equity upside
        - $50M growth capital raised from EvolutionX as private credit rather than fresh equity valuation
        - Sustained positive free cash flow generation covering interest and principal obligations
      - - Anti-Thesis Pillar 2
        - Aggressive scale draws adverse SME pushback and potential GCC regulatory scrutiny
        - Regional advocacy reports alleging independent restaurant displacement and margin squeeze
        - Transparent platform revenue-sharing and independent merchant partnership retention data
    notes: Compares thesis pillars against anti-thesis risks across technology moat, brand acquisition, competitive intensity, and unit economics.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Rapid international franchise scaling beyond GCC; loyalty app cuts aggregator fees by 30%
        - Justifies prior $1.55B+ valuation mark at 3.0x-4.0x revenue multiple; viable regional IPO candidate
        - Franchise partner execution missteps and aggregator platform retaliation
        - 20% probability; contingent on overseas franchise traction
      - - Base Case
        - GCC kitchen network expands steadily; EBITDA margins stabilize in mid-single digits
        - Fair enterprise valuation of $900M-$1.1B (1.5x-2.0x revenue); 10-12% debt yield supported
        - Sustained high delivery platform fees and rising Gulf commercial real estate rents
        - 55% probability; reflects mature GCC delivery growth
      - - Bear Case
        - Delivery demand cools; debt service covenants strain working capital amidst price competition
        - Down-round equity restructuring or distressed debt recapitalization below $600M enterprise value
        - Aggregator commission hikes, labor cost inflation, and loss of major brand partners
        - 25% probability; heightened by private credit debt service burden
    notes: Scenario parameters model regional restaurant brand scaling and international franchise expansion against food delivery aggregator and operating cost pressures.
