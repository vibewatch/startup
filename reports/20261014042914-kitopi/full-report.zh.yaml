      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              当前融资证据方向上偏正面，但并不完整。Wamda 刊载的 EvolutionX 公告称，Kitopi 在 2026 年完成一轮 $50 million
              成长资本融资，投资发生在一个盈利里程碑之后，资金用于品牌扩张和特许经营。Tracxn 另行记录了这轮 $50 million 融资，并报告公司五轮累计融资 $852
              million。历史背景也显示出资本密集性：Kitopi 2021 年的官方公告称，$415 million C 轮融资将用于地域扩张、技术、餐厅合作和团队增长。EvolutionX
              被认定为私人信贷提供方，但保留文本没有披露工具类型、票息、担保、到期日、契约、摊还、现金余额或现金消耗。因而，已筹资金不能视为可用现金，也不能证明现金跑道。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI012
      - number: '4.4'
        title: 财务投资判断
        blocks:
          - type: paragraph
            body: >-
              Kitopi
              已证明自己仍能获得外部资本，并披露过运营盈利里程碑，但现有证据不足以评估收入质量或资本充足性。最重要的缺口是从总订单额出发，经过渠道扣除、特许权使用费、食品与人工成本、场地、资本支出和营运资金，最终连接到贡献利润和现金生成。LeadIQ
              的可访问文本提到收入规模却没有数字，说明了披露问题，并没有解决它。一场激进股东活动还指控 Kitopi
              的规模和定价造成竞争伤害，但抓取到的文本没有列出可核实的底层来源，因此只能作为低置信度负面信号。投资决策应继续以经审计财务报表、门店队列、渠道集中度和完整私人信贷文件为前提。
            claimRefs:
              - CI002
              - CI013
              - CI014
              - CI015
              - CI016
