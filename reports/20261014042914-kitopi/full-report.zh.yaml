      - number: '6.3'
        title: 企业客户部署与组合收购
        blocks:
          - type: paragraph
            body: >-
              Kitopi 平台的商业验证来自与全球知名食品企业的生产级合作，以及大规模品牌组合收购。Papa Johns、Nathan's Famous 和 iHOP 等企业特许经营品牌已将菜单部署到 Kitopi 的
              GCC 厨房网络，证明平台能在 14 天快速入驻 SLA 下维持严格的企业烹饪标准、配方一致性和健康合规。不过，纯粹作为外包食品制造商运营的战略天花板，促使 Kitopi 通过收购 AWJ Group 完成
              GCC 地区规模最大的食品交易之一。AWJ 的组合包括超过 10 个配送和堂食概念——包括 Operation Falafel、Catch 22、Awani 和 Sushi Do——覆盖 32+ 家实体门店和
              1,300+ 名员工。Kitopi
              将成熟消费品牌纳入直接企业所有权后，客户画像从被动的第三方租户品牌转为自有知识产权。虽然这一转型获取了完整的餐厅零售利润并消除了品牌合作方流失风险，但也显著提高了资产负债表的资本密集度、运营复杂度和实体餐厅间接费用敞口。
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU011
