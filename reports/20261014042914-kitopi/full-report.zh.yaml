  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户与合作伙伴生态细分
        blocks:
          - type: paragraph
            body: >-
              Kitopi 运营一个多边商业生态，模糊了软件许可、合同食品制造和餐饮品牌所有权之间的传统边界。平台在中东服务三类不同的买方和合作伙伴。第一，Papa Johns、Nathan's Famous 和 iHOP
              等国际快餐特许经营商和主许可方与 Kitopi 合作，在不投入实体餐厅租赁资本的情况下，把配送覆盖扩展到高密度城市社区。第二，独立及新兴区域餐饮概念利用 Kitopi 的中央厨房和自有 Smart Kitchen
              Operating System（SKOS）作为外包生产引擎，支付初始入驻费和销售额 10% 的特许权使用费，换取一站式烹饪、员工培训和平台分发。第三，通过收购 AWJ Group 等战略交易，Kitopi
              已转变为直接品牌所有者，在实体堂食门店和配送中心运营 Operation Falafel 等热门概念。然而，由于终端消费者通过 Talabat 和 Deliveroo 等配送聚合平台下单，Kitopi 在纯
              B2B 业务时期缺乏直接的零售客户所有权，形成了烹饪生产规模与终端用户触达之间的根本张力。
            claimRefs:
