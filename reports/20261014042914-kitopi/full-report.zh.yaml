  - id: TV002
    title: 正论 / 反论表
    columns:
      - 观点
      - 核心论点
      - 证据锚点
      - 哪些情况会改变判断
    rows:
      - - 正论支柱 1
        - 自有 SKOS 技术栈优化多品牌厨房运营及司机调度
        - 在阿联酋、沙特阿拉伯、科威特、巴林及卡塔尔管理超过 200 个运营地点
        - 出现厨房备餐瓶颈或客户订单履约恶化的证据
      - - 正论支柱 2
        - 转向孵化自有品牌（AWJ、Operation Falafel）可捕获完整食品零售利润率
        - 收购 AWJ 集团，拥有 30 多家门店，并在纽约及伦敦开展全球特许经营
        - 被收购餐饮概念的同店销售增速放缓
      - - 反论支柱 1
        - 高资本密度及优先级债务偿付负担限制股权上行空间
        - EvolutionX 提供 $50M 成长资本，形式是私募信贷而非新的股权估值
        - 持续产生正自由现金流，覆盖利息及本金义务
      - - 反论支柱 2
        - 激进扩张引发中小企业反弹，并可能招致 GCC 监管审查
        - 区域倡议组织报告称独立餐厅被挤出、利润率受到挤压
        - 平台收入分成透明，且独立商户合作伙伴留存数据充分
    notes: 从技术护城河、品牌收购、竞争强度及单位经济等维度，对比正论支柱与反论风险。
