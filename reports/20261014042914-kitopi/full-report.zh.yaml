            body: >-
              正向投资论点建立在 Kitopi 的转型之上：它从资产沉重的合约厨房运营商，变成由自有 Smart Kitchen Operating System (SKOS) 驱动的多元化多品牌餐饮平台。公司收购 AWJ
              等成熟区域餐饮集团，并把 Operation Falafel
              等热门概念扩展到堂食和配送两种场景，因此能拿到完整的零售餐饮毛利，不必只靠厨房即服务的分成。其忠诚度移动应用还提供了直接获客渠道，能缓解第三方配送聚合平台长期抽取费用的问题。反方论点则指出，市场快速整合正在与本地独立餐饮商家发生摩擦。倡议组织报告和区域餐饮利益相关方担心，Kitopi
