      - number: '6.4'
        title: 留存韧性、聚合平台依赖与本地市场摩擦
        blocks:
          - type: paragraph
            body: >-
              Kitopi 客户生态的长期韧性受到结构性渠道依赖和本地市场反弹的限制。由于公司几乎完全依赖 Talabat、Deliveroo 和 Careem
              等第三方聚合平台完成客户发现、订单获取和最后一公里配送，因此处在脆弱的中间商位置。Harvard Business School 和 StartupKit 的学术案例分析记录了 Kitopi
              最初的业务模式如何陷入合作伙伴依赖的利润夹层：一侧支付高额聚合平台佣金，另一侧向餐饮品牌支付特许权使用费，运营商只能留下薄薄的剩余利润。此外，公开披露对合作伙伴留存率、净收入留存率（NRR）或合同续期年限完全没有可见信息，因此无法判断较小品牌合作方能否实现可持续盈利，还是会退出系统。这些平台脆弱性又叠加了激进的多品牌厨房扩张，引发本地行业强烈反弹。区域餐饮报告显示，迪拜和阿布扎比的独立家族餐厅已被中央云厨房夺走最高
              30% 的配送销售额。批评者和本地餐饮协会认为，标准化多品牌厨房加剧不公平竞争、同质化区域餐饮传统，并挤压本地食品供应链，持续带来监管和社区逆风。
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU013
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: “合作伙伴利润夹层”：价值捕获对比聚合平台挤压
            body: >-
              Kitopi 让餐饮品牌无需资本支出，14 天内就能覆盖 GCC 市场，但其最初的纯 B2B 模式实际上从配送聚合平台租来需求、从餐厅租来品牌。为摆脱由此产生的利润挤压，Kitopi
              从隐形厨房运营商转为多品牌餐饮资产的股权所有者。
            calloutType: insight
            claimRefs:
              - CU001
              - CU010
              - CU011
          - type: callout
            title: 对配送渠道的集中与生态反弹
            body: >-
              Kitopi 在根本上仍依赖 Talabat、Deliveroo 和 Careem 等第三方配送聚合平台获取终端消费者需求；与此同时，中央厨房的快速扩张也引发本地餐饮业反弹，区域餐厅经营者报告配送收入最高下降
              30%。
            calloutType: risk
            claimRefs:
              - CU007
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 运营复杂度与食品安全传染
        blocks:
          - type: paragraph
            body: >-
              Kitopi 在五个 GCC 市场快速扩张至超过 200 个厨房地点和超过 100 个品牌，带来了深刻的运营执行复杂度。在共享的 2,000-square-foot
              设施中处理数十种不同餐饮概念的大量备餐，需要工位协调无误、配方严格标准化以及严密的卫生规程。与单一概念餐厅不同，中央云厨房一旦发生卫生或食品安全事故，就会产生系统性传染风险，瞬间影响多个合作品牌。Kitopi
              虽然利用自有 Smart Kitchen Operating
              System（SKOS）自动排列菜品顺序、追踪库存并预测配送员到达，但软件算法无法彻底消除人工运营摩擦或实体厨房瓶颈。公司过去从美国和英国等资本密集型扩张中撤回，说明要维持网络密度、同时避免管理带宽过度透支，需要很强的运营纪律。
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR014
