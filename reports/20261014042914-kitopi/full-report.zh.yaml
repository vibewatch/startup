      - number: '5.4'
        title: 技术差异化、依赖与运营风险
        blocks:
          - type: paragraph
            body: >-
              Kitopi 的主要竞争护城河在于把算法任务路由与实体供应链协同起来。然而，这种托管云厨房模式也带来明显的平台和结构性脆弱点。公司严重依赖 Deliveroo、Jahez 和 Talabat
              等第三方食品配送聚合平台获客并完成最后一公里履约，使订单利润率暴露在 18% 至 28%
              的佣金抽成和算法发现机制变化之下。此外，快速市场整合引发了独立餐厅协会的公开批评和抵制呼吁，它们指责公司定价激进、供应链垄断。最后，国际扩张显示出清晰的运营边界：Kitopi
              在美国推出配送业务后，更高的人工成本、工会审查和严格的员工分类规则严重侵蚀了 SKOS 在 GCC 内带来的成本优势。
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 算法生产工程对比被动式房地产
            body: >-
              Kitopi 的核心技术防御力来自通过 SKOS 将烹饪执行流程内化，而不是租赁原始暗厨房隔间。把配方拆成数字微步骤，能在紧凑的 2,000-square-foot
              场地内实现高密度多品牌生产，但也使运营一致性完全取决于软件稳定性和员工遵循程度。
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
              - CE009
          - type: callout
            title: 聚合平台买方垄断与地域劳动力套利边界
            body: >-
              Kitopi 将厨房层面的订单停留时间优化至 2.2 分钟，但在结构上仍依赖控制需求生成、并收取最高 28% 佣金的第三方聚合平台。此外，模式的成本优势高度依赖 GCC
              的劳动力环境；当公司尝试进入美国等高工资西方司法辖区时，这一优势很难复制。
            calloutType: risk
            claimRefs:
              - CE012
