      - number: '6.2'
        title: 采用速度、版图规模与商业证明
        blocks:
          - type: paragraph
            body: >-
              Kitopi 的运营轨迹显示，风险资本规模和多品牌烹饪密度推动了快速网络扩张。公司在 2020 年初只有 30 座厨房，2021 年已扩张至四个海湾市场的 60+ 座厨房，随后进一步扩大到七个国家、十二座城市的
              200+ 个运营地点。这个实体厨房网络由高密度生产设施支撑：一座典型的 2,000-square-foot 中央厨房最多可容纳 70 个不同食品品牌，并通过自动烹饪排序和数据驱动的司机派单每天处理最多 3,000
              个订单。与此同时，Kitopi 的活跃品牌组合也发生了明显的质量变化。公司在 2021 年 C 轮融资阶段曾与超过 200 个第三方品牌合作，但 2023 至 2026 年的公开报道显示，其组合已精简至约
              100+ 个品牌。这种整合反映出公司有意把厨房产能集中到利润率更高、拥有专有权且规模化程度更高的概念上，例如仅 Operation Falafel 一家每年就服务全球超过 2 million
              名消费者。尽管吞吐量巨大，公开披露仍缺少关键的单位层面经济指标，包括同厨房销售增长、平均订单金额和非高峰时段的厨房产能利用率。
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU012
