      - number: '7.2'
        title: 监管碎片化与市场反弹
        blocks:
          - type: paragraph
            body: >-
              在阿联酋、沙特阿拉伯、科威特、巴林和卡塔尔应对不同的市级及国家级监管框架，会持续产生合规负担。每个市级主管机构都会执行本地化食品安全检查、商业许可标准和劳动力本国化要求，例如沙特阿拉伯王国的
              Saudization。此外，Kitopi 在主要都市中心的快速市场集中也引发了独立餐饮经营者之间的商业摩擦。区域餐厅协会和本地行业利益相关者担心配送渠道主导、基础设施定价激进，以及传统餐饮商户可能被挤出。尽管
              Kitopi 维持有效许可并遵守卫生要求，但围绕海湾各市云厨房劳工实践、配送交通密度和竞争政策的监管加强，仍是持续的运营约束。
            claimRefs:
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
      - number: '7.3'
        title: 聚合平台主导与合作伙伴集中
        blocks:
          - type: paragraph
            body: >-
              Kitopi 的商业模式在结构上暴露于 Talabat、Deliveroo 和 Jahez
              等第三方配送聚合平台。由于这些面向消费者的平台控制最后一公里获客和司机路线，它们可以收取高额佣金，压缩后端厨房的运营利润率。聚合平台排名算法变化或平台费用突然上升，会直接威胁合作品牌的订单量和单位经济性。与此同时，成熟餐厅合作伙伴担心品牌资产被稀释、机密配方泄露，或失去对食品制作的运营控制，因此对合作有所犹豫。Kitopi
              通过集中食材采购、谈判供应商批量折扣，并有策略地把组合转向自有品牌来降低这一脆弱性。通过收购 Operation Falafel 等成熟概念并孵化自有菜单，Kitopi
              获取完整的消费者零售定价，而不再只依靠基础设施服务费。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
