      - number: '8.3'
        title: 估值立场与乐观 / 基准 / 悲观情景建模
        blocks:
          - type: paragraph
            body: >-
              Kitopi 的资本结构反映出公司在 5 轮融资中累计获得约 $852 million，最终形成 2026
              年债务工具。最新融资是私募信贷而非定价股权发行，按历史基准和公开市场倍数衡量，公司当前估值偏贵。我们的情景模型中，基准情景概率为 55%：区域温和增长，GCC 配送需求成熟，企业估值按 1.5x 至 2.0x
              收入落在 $900 million 至 $1.1 billion。乐观情景概率为 20%，假设欧洲和北美国际加盟业务加速扩张，忠诚度应用的直接订单占比超过 40%，支撑 $1.55 billion
              估值。悲观情景概率为 25%，考虑债务偿付压力上升、人工成本通胀和配送聚合平台提高佣金，导致 EBITDA 利润率收缩，并迫使公司以低于 $600 million 的价格进行向下轮重组。
            claimRefs:
              - CV003
