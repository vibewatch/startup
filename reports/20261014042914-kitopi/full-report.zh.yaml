      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              按 Kitopi 的发展轨迹，资本市场一旦接纳成长期科技公司上市，它可能成为迪拜金融市场或沙特 Tadawul
              的区域上市候选。但要准备退出，机构投资者必须先拿到具体的私募尽调披露，再决定是否作出投资判断承诺。重点尽调要求包括经审计的四墙厨房贡献利润率、忠诚度应用的客户 cohort 留存指标，以及 EvolutionX
              融资工具的明确债务契约，包括利息覆盖率和认股权证条款。明确的论点失效触发因素包括任何债务契约违约或流动性短缺、迪拜和利雅得核心枢纽配送量持续收缩，或监管干预限制云厨房聚集和零工配送运营。在管理层提供经审计的门店单位经济数据前，股权投资者应守住定价纪律，不要接受历史私募市场估值。
