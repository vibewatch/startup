  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 餐饮品牌及聚合平台从接入到多厨房扩张、再到品牌收购的生命周期阶段。
    data:
      nodes:
        - id: stage-1
          label: 品牌接入及许可
          stage: Awareness & Contract
          actor: F&B Brand Partner
          description: 餐饮品牌将配方及菜单规格授权给 Kitopi，并支付一次性接入费。
          touchpoints:
            - Recipe standardization
            - SKOS platform training
            - Kitchen trial runs
        - id: stage-2
          label: SKOS 集成及厨房准备
          stage: Deployment
          actor: Kitopi Kitchen Operations
          description: Kitopi 中央厨房在 14 天内导入配方，并配置自动烹饪顺序及食材供应链。
          touchpoints:
            - Central commissary procurement
            - Smart Kitchen OS configuration
            - Staff culinary training
        - id: stage-3
          label: 聚合平台市场调度
          stage: Go-Live & Ordering
          actor: Delivery Aggregators (Talabat, Deliveroo, Careem)
          description: 品牌出现在配送应用上；终端客户向聚合平台下单，而客户关系及数据由聚合平台掌握。
          touchpoints:
            - Aggregator menu listing
            - Delivery app dispatch
            - Last-mile courier handoff
        - id: stage-4
          label: 订单执行及单店特许权费
          stage: Fulfillment & Monetization
          actor: Kitopi & Brand
          description: 订单在 2,000 平方英尺的枢纽中烹制，每天最多处理 3,000 单；Kitopi 收取收入分成并支付特许权费。
          touchpoints:
            - Automated prep sequencing
            - Aggregator commission deduction
            - 10-13% brand royalty remittance
        - id: stage-5
          label: 跨境区域扩张
          stage: Expansion Loop
          actor: Enterprise Brand Partner
          description: 成功品牌在 GCC 各地（阿联酋、沙特、科威特、巴林、卡塔尔）扩张，无需新增房地产资本开支。
          touchpoints:
            - Multi-city launch
            - Central procurement scaling
            - Menu engineering analytics
        - id: stage-6
          label: 资本挤压或股权收购
          stage: Terminal Durability
          actor: Kitopi Brand Incubator
          description: 面临聚合平台低利润率的品牌要么流失，要么通过并购（如 AWJ）转入自有或孵化资产组合。
          touchpoints:
            - Aggregator commission margin pressure
            - Kitopi M&A buyout offer
            - Full brand vertical integration
    approximationNotes: 阶段综合自 Harvard Business School 和 StartupKit 的案例拆解，后者详细描述了 Kitopi 的运营流程。
