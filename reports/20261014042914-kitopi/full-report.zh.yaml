        title: 展示项
        blocks:
          - type: callout
            title: 新鲜资本不等于已证明的现金跑道
            body: 2026 年融资支持公司继续获得资金，但保留现金余额和私人信贷提供方附带的义务均未公开。
            calloutType: insight
            claimRefs:
              - CI001
