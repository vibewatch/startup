          - type: callout
            title: 核心投资判断桥梁仍然缺失
            body: 在缺少实际定价、渠道扣除、销货成本、人工、场地、资本支出和营运资金数据的情况下，公开证据无法证明收入质量或可持续的贡献利润率。
            calloutType: risk
            claimRefs:
              - CI008
              - CI014
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与多品牌运营架构
        blocks:
          - type: paragraph
            body: >-
              Kitopi 将核心产品定义为托管基础设施和多品牌烹饪平台，而不是被动的房地产分租服务。公司在中东七个国家、十二座城市运营超过 200 个厨房地点，为区域和国际餐饮概念授权，并代其制作完整菜单。除了为 Papa
              Johns、Nathan's Famous 等合作品牌提供托管厨房运营，Kitopi 还通过收购 AWJ、Operation Falafel、Right Bite 和 Zaroob
              等标志性区域餐饮组合实现垂直整合。为获取直接客户关系并提高合并品牌网络的订单留存，公司还推出 Kitopi Rewards 消费者移动应用，在堂食、配送和自取渠道提供最高百分之二十的返现。
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
