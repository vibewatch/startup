chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 企业身份、运营模式与业务版图
        blocks:
          - type: paragraph
            body: >-
              Kitopi（名称取自 Kitchen Operation Innovation，或 Kitchen Utopia 的首字母）于 2018 年 1
              月在迪拜成立，是一家技术驱动的托管云厨房平台，旨在让餐饮品牌以极少的前期资本投入扩大配送业务 [CO003,
              CO004]。经过八年的激进区域扩张，公司完成了关键的战略转型，从外包幽灵厨房运营商转为全面整合的多品牌餐饮集团 [CO001, CO005]。截至 2026 年，Kitopi
              在五个中东核心经济体——阿联酋、沙特阿拉伯、科威特、巴林和卡塔尔——直接运营超过 200 家面向消费者的门店 [CO001]。这些实体设施既包括仅提供配送的云厨房，也包括全服务堂食餐厅
              [CO001]。公司的运营由超过 6,000 名员工（“Kitopians”）协调，并由国际专业设施提供支持，包括位于波兰克拉科夫的工程技术中心、位于丹麦欧登塞的机器人开发中心，以及位于迪拜的全球客户体验总部
              [CO002, CO014]。Kitopi 采用双重收入架构变现：合作餐饮品牌支付一次性入驻集成费，合作餐厅订单销售额持续支付 10% 的特许权使用费；与此同时，公司维护名为 Smart Kitchen
              Operating System（SKOS）的自有技术底座，用于自动化烹饪流程、库存调度和配送派单 [CO009, CO011]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO009
              - CO011
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO008
              - CO010
      - number: '1.2'
        title: 创始人、执行领导层与组织治理
        blocks:
          - type: paragraph
            body: >-
              Kitopi 由四位创业者共同创办：Mohamad Ballout（首席执行官）、Saman Darkan（首席技术官）、Bader Ataya（首席增长官）和 Andy Arenas（首席订单官）[CO003,
              CO004]。首席执行官 Mohamad Ballout 是公司的主要负责人和发言人，将公司的长期商业战略定义为“Franchise 2.0”——让第三方餐饮品牌直接接入标准化运营和物流基础设施的模式
              [CO004]。首席技术官 Saman Darkan 主导了 Smart Kitchen Operating System（SKOS）的内部开发，该系统负责协调厨房现场任务和数据分析 [CO004,
              CO011]。首席增长官 Bader Ataya 与首席订单官 Andy Arenas 负责领导品牌合作、区域市场进入和厨房运营标准化 [CO004]。尽管管理层在多轮融资扩张期间总体稳定，但关键人依赖高度集中于
              Ballout 的愿景与资本配置能力，以及 Darkan 对 SKOS 架构的掌舵 [CO004]。机构融资之后，董事会治理显著扩张，SoftBank Investment Advisers
              等主要风险投资和主权资本支持方加强了监督，同时保留各工程与机器人中心的运营自主权 [CO006, CO014]。
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO011
              - CO014
