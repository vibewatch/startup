      - number: '4.2'
        title: 成本结构与运营杠杆代理指标
        blocks:
          - type: paragraph
            body: >-
              成本基础包括食品投入、人工、厨房占用、配送平台佣金、合作方特许权使用费、技术和质量体系。StartupKit
              的独立但无来源重构认为，佣金和特许权使用费使基础设施运营商只能获得狭窄的剩余利润；这一判断可作为风险假设，不能视为经审计的经济性。Kitopi 2021
              年的公告提供了历史运营杠杆代理指标：管理层称订单量翻倍、备餐时间下降
              40%，并将责任范围描述为覆盖供应链、员工培训、配送和客户体验。这些说法表明流程具备杠杆效应，但无法证明毛利率、门店利用率、贡献利润、CAC、回本期或渠道经济性。因此，单位经济性表把已披露的规模和历史运营说法，与仍需用于投资判断的财务输入分开。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
