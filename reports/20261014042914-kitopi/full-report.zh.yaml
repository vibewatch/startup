      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 向多品牌餐饮转型
            body: >-
              Kitopi 从纯第三方配送厨房转向直接持有区域旗舰餐饮品牌，意味着其结构性转向更高的运营利润率和更具防御力的消费者品牌资产。公司把自有厨房自动化与 Operation Falafel
              这样的成熟实体概念结合起来，在明显提高运营复杂度的同时，也减少了对传统配送聚合平台的依赖。
            calloutType: insight
            claimRefs:
              - CO001
              - CO002
              - CO005
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与模式演进
        blocks:
          - type: paragraph
            body: >-
              Kitopi 所处的市场横跨两个相互交叠的垂直领域：托管云厨房基础设施，以及多品牌餐饮运营。早期阶段，Kitopi 严格作为 B2B 托管云厨房供应商运营，以“Franchise
              2.0”向区域和国际餐饮品牌推介，帮助它们扩大配送覆盖，而无需承担商业租赁、装修或本地招聘的资本支出。在这一模式下，合作品牌授权其配方和标准操作流程，Kitopi
              则承担备餐、库存采购、包装及向聚合平台交接的全部运营责任。然而，纯厨房基础设施的运营经济性造成了结构性利润挤压：平台一端承受食品配送聚合平台的需求端佣金，另一端又要向合作品牌支付供给端特许权使用费。作为回应，Kitopi
              果断转向垂直持有品牌，其收购区域餐饮控股集团 AWJ 就是代表性动作。该交易把 Operation Falafel 等高流量概念纳入 Kitopi
              的运营体系，使公司从隐形厨房工具转变为一家在配送和实体堂食渠道管理超过 100 个品牌的主导型多品牌餐饮运营商。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: 可服务市场规模、地域版图与资本规模
        blocks:
          - type: paragraph
            body: >-
              估算 Kitopi 的可服务市场，必须把总体食品消费与数字配送和集中生产实际能够捕获的部分区分开。行业分析师预计，全球云厨房市场到 2026 年将达到 $71.4 billion 至 $112.5
              billion，复合年增长率为 12.5% 至 14.2%。在 Kitopi 的核心运营区域，中东和 GCC 在线食品配送市场估计为 $8.5 billion 至 $11.0
              billion；极端的夏季气候、都市高密度外籍人口、高智能手机渗透率以及根深蒂固的配送优先餐饮文化，持续推动需求。Kitopi 已建立覆盖七个国家、十二座城市和超过 200
              个运营厨房设施的区域基础设施版图，遍及阿联酋、沙特阿拉伯、科威特、巴林和卡塔尔。为利用这一版图，公司获得了大量机构支持，其中包括 2021 年 7 月由 SoftBank Vision Fund 2 领投的
              $415 million C 轮融资，五轮累计融资达到 $852 million。2026 年 1 月，Kitopi 又补充了 $50 million
              成长资本，专门用于区域和国际特许经营扩张，并从资本密集型的直接设施建设转向可扩张、轻资本的许可模式。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
