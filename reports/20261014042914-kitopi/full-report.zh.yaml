              - CO013
      - number: '1.4'
        title: 战略演进、运营里程碑与生态摩擦
        blocks:
          - type: paragraph
            body: >-
              公司的里程碑展现了从基础设施外包商到区域餐饮品牌所有者的根本转型 [CO001, CO005]。2020 年，食品配送加速普及，推动运营量增长 300%；这证明 SKOS
              能在订单处理能力翻倍的同时，将厨房备餐时间缩短 40% [CO008]。2021 年获得大量 C 轮资本后，Kitopi 从托管第三方概念转向执行重大企业收购 [CO005, CO006]。2023
              年，Kitopi 完成了对 AWJ Group 的重大收购。AWJ 是一家在迪拜创立的知名餐饮控股公司，旗下拥有超过 10 个配送和堂食品牌，其中最重要的是 Operation Falafel；该品牌每年服务超过
              2 million 名顾客，在 GCC 拥有 32+ 家门店，并在伦敦和纽约经营国际特许门店 [CO005]。Kitopi 将 AWJ 的 1,300+
              名员工和成熟实体餐厅纳入旗下，实际上把自己重新定位为现代餐饮综合集团 [CO001,
              CO005]。快速扩张和中央厨房的主导地位也引发了明显的负面审视：区域餐饮倡导团体和中小餐厅协会担心市场集中、聚合平台的激进主导，以及对利雅得、迪拜和麦纳麦传统独立厨房的结构性冲击 [CO012]。
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO008
              - CO012
