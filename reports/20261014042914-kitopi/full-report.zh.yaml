            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO011
      - number: '1.3'
        title: 资本化历史、估值与利益相关者治理
        blocks:
          - type: paragraph
            body: >-
              Kitopi 的企业增长由大量风险资本和成长资本推动，在七轮融资中累计筹资约 $854 million [CO010]。公司最初的机构扩张由 2018 年末的 $27.2 million A 轮融资支持，随后在
              2020 年 2 月宣布完成 $60 million B 轮融资；该轮由美国风投 Lumia Capital 和 Knollwood Investment Advisory 领投，用于建设 30
              座运营厨房并支持国际试点 [CO007]。2021 年 7 月，Kitopi 完成由 SoftBank Vision Fund 2 领投的 $415 million C
              轮融资，成为独角兽；这是软银首次直接投资总部位于阿联酋的科技企业，并确立了 $1.55 billion 的投后估值 [CO006]。C 轮银团还包括 Chimera
              Investments、DisruptAD、B. Riley、Dogus Group、Next Play Capital、Nordstar、Beco Capital 和 Crescent
              Enterprises（CE-Ventures）等知名主权及机构共同投资方 [CO006, CO013]。商业情报显示，公司在 2026 年初进一步获得约 $300 million
              的成长融资，用于扩大区域零售版图和企业能力 [CO010]。不过，详细的资本化机制——包括优先股清算顺位、股息契约和二级流动性定价——仍属于保密的私营企业记录 [CO010]。
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
