      - number: '5.2'
        title: Smart Kitchen Operating System（SKOS）与算法执行
        blocks:
          - type: paragraph
            body: >-
              Kitopi 运营规模化的技术核心是自有 Smart Kitchen Operating System（SKOS）。传统餐厅由固定的流水线厨师制作单一品牌菜单，而 SKOS
              通过算法把复杂烹饪流程拆成离散、连续、数字化的微步骤，让同一厨房工作站能够并行执行不同餐饮品牌的任务。厨师直接与可视化终端交互，系统根据对烹饪时长、工位吞吐量和配送员通行时间的预测性机器学习模型，动态分配备餐任务。此外，SKOS
              集成双向物流 API，把菜品完成时间与配送员到达时间同步起来。这种算法派单减少了菜品在保温灯下长时间等待的情况，据报道将厨房订单平均停留时间从行业中位数 8.5 分钟降至 2.2 分钟以下，同时使厨房吞吐量翻倍。
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE009
      - number: '5.3'
        title: 中心—卫星拓扑与国际工程基础设施
        blocks:
          - type: paragraph
            body: >-
              Kitopi 的运营架构围绕两层中心—卫星基础设施拓扑构建。位于低成本工业区的 Centralized Processing
              Facilities（CPFs）负责批量采购食材、初步分切、批量酱料生产和冷链准备；与独立餐厅相比，这使原材料食品成本估计降低 300 至 500 个基点。中央中心向密集的分布式卫星厨房供货，这些厨房位于紧凑的
              2,000-square-foot 都市场地内，负责最终烹饪组装，并在 3 公里半径内完成向配送员交接。驱动这套基础设施的软件和自动化技术由专门的国际开发中心研发：Kitopi
              在波兰克拉科夫设有核心软件工程、数据架构和 DevOps 中心，在丹麦欧登塞设有先进机器人测试中心，并在阿联酋迪拜设有集中式客户体验中心。
            claimRefs:
