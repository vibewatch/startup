      - number: '2.3'
        title: 买方细分、工作流整合与技术赋能
        blocks:
          - type: paragraph
            body: >-
              Kitopi
              生态中的商业采用者可分为经济激励不同的买方群体。对企业餐饮品牌而言，平台解决了地域扩张的首要约束：在迪拜、利雅得或科威特城等竞争激烈的城市中心建设实体门店，需要高额资本、数月许可周期，并承担财务风险。这些企业买方利用
              Kitopi，在最短 14 天内建立多点配送覆盖，并用企业发展和扩张预算支付入驻费及收入分成。相反，新兴餐饮创业者和原生虚拟品牌把 Kitopi
              当作低风险孵化器，在无需预先承诺设备投入的情况下测试新菜单、捕捉城市需求。Kitopi 位于波兰克拉科夫的工程中心开发了自有 Smart Kitchen Operating
              System（SKOS），为这些合作伙伴提供运营支持。SKOS
              把实时商业智能、自动烹饪顺序优化、库存补货和配送司机到达同步整合到各厨房工位。该系统利用数据科学预测备餐时间、优化工作站吞吐量，据报道可将厨房备餐时间最多缩短 40%，从而提升客户满意度并缩短司机周转时间。
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM011
              - CM013
          - type: table
            tableRef: TM003
