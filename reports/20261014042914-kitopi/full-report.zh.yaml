      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - GCC 以外的国际特许经营快速扩张；忠诚度应用将聚合平台费用削减 30%
        - 按 3.0x–4.0x 收入倍数支撑此前 $1.55B+ 的估值，具备区域 IPO 候选资格
        - 特许经营伙伴执行失误及聚合平台报复
        - 20% 概率；取决于海外特许经营能否形成势头
      - - 基准情景
        - GCC 厨房网络稳步扩张；EBITDA 利润率稳定在中个位数
        - 合理企业估值为 $900M–$1.1B（1.5x–2.0x 收入），可支撑 10–12% 债务收益率
        - 配送平台费用持续高企，海湾商业地产租金上涨
        - 55% 概率；反映成熟的 GCC 配送增长
      - - 悲观情景
        - 配送需求降温；价格竞争下偿债契约挤压营运资金
        - 企业价值低于 $600M 时进行下调轮股权重组或困境债务资本重组
        - 聚合平台提高佣金、劳动力成本上涨及主要品牌合作伙伴流失
        - 25% 概率；私募信贷偿债负担使风险上升
    notes: 情景参数在食品配送聚合平台及运营成本压力下，模拟区域餐饮品牌扩张与国际特许经营扩张。
