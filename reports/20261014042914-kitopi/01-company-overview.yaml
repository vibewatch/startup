  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited company financial statements, store-level contribution margins, food cost ratios, and same-store
      sales growth across GCC outlets.
    whyItMatters: Without audited unit economics, external valuation multiples cannot be evaluated against underlying profitability
      or cash burn rate.
    diligencePath: Request confidential management financial package, including FY2024-FY2025 audited revenue, gross profit
      by brand vertical, and EBITDA bridge.
    relatedQuestionRefs:
    - QO009
  - type: private-evidence-only
    severity: material
    topic: capitalization-stack
    missingEvidence: Detailed shareholder register, share class preference stack, liquidation covenants, and debt/credit facility
      agreements.
    whyItMatters: High headline valuations ($1.55B+) from 2021 tech cycles may carry senior liquidation preferences that significantly
      impair common or junior equity value.
    diligencePath: Review full capitalization table and investor rights agreement under NDA in virtual data room.
    relatedTableRefs:
