  - type: missing-source
    severity: minor
    topic: regulatory-and-quality-inspections
    missingEvidence: Centralized municipal health and food safety inspection logs and commercial kitchen licensing records
      across Riyadh and Dubai municipalities.
    whyItMatters: Centralized high-throughput multi-brand kitchens carry concentrated operational health and municipal compliance
      contagion risks.
