evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited company financial statements, store-level contribution margins, food cost ratios, and same-store sales
      growth across GCC outlets.
    whyItMatters: >-
      Without audited unit economics, external valuation multiples cannot be evaluated against underlying profitability
      or cash burn rate.
    diligencePath: >-
      Request confidential management financial package, including FY2024-FY2025 audited revenue, gross profit by brand
      vertical, and EBITDA bridge.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: capitalization-stack
    missingEvidence: >-
      Detailed shareholder register, share class preference stack, liquidation covenants, and debt/credit facility
      agreements.
    whyItMatters: >-
      High headline valuations ($1.55B+) from 2021 tech cycles may carry senior liquidation preferences that
      significantly impair common or junior equity value.
    diligencePath: Review full capitalization table and investor rights agreement under NDA in virtual data room.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: regulatory-and-quality-inspections
    missingEvidence: >-
      Centralized municipal health and food safety inspection logs and commercial kitchen licensing records across
      Riyadh and Dubai municipalities.
    whyItMatters: >-
      Centralized high-throughput multi-brand kitchens carry concentrated operational health and municipal compliance
      contagion risks.
    diligencePath: >-
      Conduct local municipal licensing audit and review past health inspection certificates across primary centralized
      kitchen hubs.
  - type: missing-source
    severity: material
    topic: unit-economics-and-store-productivity
    missingEvidence: >-
      Audited store-level P&L statements, average order values, and same-store sales growth across individual cloud
      kitchen locations.
    whyItMatters: >-
      Without granular kitchen productivity data, assessing whether high top-line network growth translates into durable
      operating margins remains uncertain.
    diligencePath: >-
      Request confidential disclosure of cohort-level kitchen unit economics, contribution margins by city, and
      hub-versus-satellite facility payback periods.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: franchise-royalty-and-licensing-terms
    missingEvidence: >-
      Contractual fee structures, royalty take-rates, and franchisee capital commitments for the 2026 franchising
      expansion program.
    whyItMatters: >-
      Franchising shifts capital intensity to franchisees, but net revenue realization depends on the split between tech
      licensing, royalty cut, and food supply margins.
    diligencePath: Review master franchise agreements and disclosure documents for the UAE and international franchise expansions.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: partner-brand-churn-and-multi-homing
    missingEvidence: >-
      Audited brand retention cohorts, churn statistics, and the proportion of partner brand order volume fulfilled
      through competing kitchen platforms or in-house locations.
    whyItMatters: >-
      Without visibility into brand multi-homing and churn rates, underwriters cannot confirm whether Kitopi's network
      effects are sticky or if mature brands eventually churn to build direct kitchen operations.
    diligencePath: >-
      Request historical brand partner cohort retention schedules, annualized churn rates, and multi-homing exclusivity
      clauses during commercial confirmatory diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: financial-statements-and-runway
    missingEvidence: >-
      Audited current revenue, gross profit, operating profit, cash flow, cash balance, monthly burn, working capital,
      and runway.
    whyItMatters: >-
      A reported profitability milestone and funding amount do not establish earnings quality, cash conversion, or
      capital adequacy.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, bank statements, and a board-approved liquidity forecast
      with downside cases.
    relatedQuestionRefs:
      - QI006
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Realized pricing, delivery-platform take rates, royalties, food and labor costs, occupancy, utilization, capex,
      and contribution margin by site and brand type.
    whyItMatters: >-
      Without a reconciled unit-economics waterfall, the owned-brand margin thesis and operating-leverage claims cannot
      be converted into sustainable contribution profit.
    diligencePath: >-
      Request site-level cohorts and order-level waterfalls split by owned brands, partner brands, country, channel, and
      kitchen maturity.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: private-credit-terms
    missingEvidence: >-
      Instrument type, funded amount, unrestricted proceeds, coupon, security, maturity, amortization, covenants, and
      repayment priorities for the EvolutionX financing.
    whyItMatters: >-
      The provider's private-credit identity creates potential debt-service and covenant exposure that cannot be
      inferred from the headline funding amount.
    diligencePath: >-
      Review executed financing documents, capitalization table, debt schedule, covenant calculations, security package,
      and proceeds ledger.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gtm-and-channel-efficiency
    missingEvidence: >-
      Customer acquisition cost, payback, repeat-order cohorts, promotion spend, channel mix, aggregator concentration,
      payment terms, and customer or brand concentration.
    whyItMatters: >-
      Historical kitchen productivity does not establish efficient demand acquisition, durable retention, or bargaining
      power with distribution channels.
    diligencePath: >-
      Obtain monthly channel and customer cohorts, contract-level economics, promotion attribution, concentration
      schedules, and retention analyses.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: public-developer-signal
    missingEvidence: >-
      Public source code repositories, open API documentation, or developer community metrics (GitHub, PyPI, npm) for
      Kitopi's proprietary SKOS platform.
    whyItMatters: >-
      Without developer-signal telemetry, software quality, release frequency, testing coverage, and architectural
      health must be assessed entirely through company claims and proxy interviews.
    diligencePath: >-
      Request architecture design documents, SOC 2 compliance reports, and access to internal Git commit logs and CI/CD
      pipelines during technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: store-level-quality-audits
    missingEvidence: >-
      Third-party municipality food-safety inspection logs, order defect rates, and cold-chain temperature telemetry
      across distributed satellite kitchens.
    whyItMatters: >-
      Centralizing food prep for up to 70 brands per facility creates single-point-of-failure contamination and brand
      equity risks if satellite kitchens fail health standards.
    diligencePath: >-
      Review municipal health inspection reports, ISO 22000 / HACCP audit certificates, and store-level customer
      refund/rejection rate logs.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: minor
    topic: robotics-automation-roi
    missingEvidence: >-
      Throughput metrics, capital expenditure, and commercial deployment status of robotic automation developed at the
      Odense, Denmark Robotics Hub.
    whyItMatters: >-
      Evaluating whether kitchen automation provides meaningful labor cost reduction or remains an experimental R&D
      initiative.
    diligencePath: Request capital expenditure breakdown and facility deployment roadmap for robotic equipment developed in Odense.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: Customer Retention and Partner Churn Rates
    missingEvidence: >-
      Disclosed gross revenue retention (GRR), net revenue retention (NRR), brand churn rates, and cohort lifespan data
      across Kitopi's 100+ partner and owned brand relationships.
    whyItMatters: >-
      Without cohort-level retention or churn metrics, it is impossible to verify whether brand growth is driven by
      recurring organic demand or continuous replacement of churned franchise partners.
    diligencePath: >-
      Request historical partner cohort schedules, contract renewal rates, and monthly brand churn data under NDA during
      confirmatory diligence.
    relatedQuestionRefs:
      - QU005
