callouts:
  - calloutType: "insight"
    title: "The Strategic Margin Sandwich Trap"
    body: "In a pure Kitchen-as-a-Service model, an operator sits sandwiched between delivery aggregator take rates (often 20-30%) and partner brand royalties (10-13%), leaving the kitchen operator with thin residual margins despite high operational utilization. Kitopi's acquisition of established brands like AWJ directly addresses this structural squeeze by replacing third-party royalty payouts with full brand margin capture."
    claimRefs:
      - "CP008"
      - "CP013"
  - calloutType: "risk"
    title: "Displacement Pressure and Ecosystem Backlash"
    body: "Kitopi's immense scale and centralized kitchen procurement create intense competitive headwinds for independent restaurants in core GCC cities, sparking calls from local trade groups for regulatory oversight over cloud kitchen market dominance and anti-competitive delivery aggregation practices."
    claimRefs:
      - "CP011"
      - "CP012"
