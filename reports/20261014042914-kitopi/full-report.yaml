chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Footprint
        blocks:
          - type: paragraph
            body: >-
              Kitopi (an acronym derived from Kitchen Operation Innovation, or Kitchen Utopia) was established in Dubai
              in January 2018 as a technology-enabled managed cloud kitchen platform designed to allow food and beverage
              brands to scale delivery operations with minimal upfront capital investment [CO003, CO004]. Over eight
              years of aggressive regional expansion, the enterprise has executed a decisive strategic evolution,
              transitioning from an outsourced ghost kitchen operator into a fully integrated multi-brand hospitality
              group [CO001, CO005]. As of 2026, Kitopi directly operates over 200 customer-facing outlets across five
              key Middle Eastern economies: the United Arab Emirates, Saudi Arabia, Kuwait, Bahrain, and Qatar [CO001].
              This physical footprint encompasses both delivery-only cloud kitchens and full-service dine-in restaurants
              [CO001]. The company's operations are coordinated by a workforce of more than 6,000 employees
              ("Kitopians"), supported by specialized international infrastructure including an engineering technology
              hub in Krakow, Poland, a robotics development center in Odense, Denmark, and a global customer experience
              headquarters in Dubai [CO002, CO014]. Kitopi monetizes its platform through a dual revenue architecture
              comprising one-time onboarding integration fees paid by partner food brands alongside an ongoing 10%
              royalty on partner restaurant order sales, while maintaining a proprietary technology backbone known as
              the Smart Kitchen Operating System (SKOS) that automates cooking workflows, inventory routing, and
              delivery dispatch [CO009, CO011].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO009
              - CO011
              - CO014
