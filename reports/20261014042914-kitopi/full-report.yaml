        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Transition to Multi-Brand Hospitality
            body: >-
              Kitopi's shift from pure third-party delivery kitchens to direct ownership of flagship regional restaurant
              brands represents a structural pivot toward higher operating margins and defensible consumer equity. By
              combining proprietary kitchen automation with proven physical concepts like Operation Falafel, Kitopi has
              diversified beyond traditional delivery aggregators while significantly increasing its operational
              complexity.
            calloutType: insight
