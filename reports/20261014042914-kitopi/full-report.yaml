      - number: '5.3'
        title: Hub-and-Spoke Topology and International Engineering Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Kitopi's operational architecture is physically structured around a two-tier hub-and-spoke infrastructure
              topology. Centralized Processing Facilities (CPFs) situated in low-cost industrial zones execute bulk
              ingredient procurement, primary butchery, batch sauce production, and cold-chain staging, lowering raw
              food costs by an estimated 300 to 500 basis points compared to standalone restaurants. These central hubs
              supply dense networks of distributed satellite kitchens operating in compact 2,000-square-foot
              metropolitan footprints that handle final cooking assembly and courier hand-off within three-kilometer
              radii. The underlying software and automation technologies driving this infrastructure are engineered
              through dedicated international development centers: Kitopi maintains its core software engineering, data
              architecture, and DevOps hub in Krakow, Poland, an advanced robotics testing center in Odense, Denmark,
              and its centralized customer experience center in Dubai, UAE.
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE008
              - CE009
