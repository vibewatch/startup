      - number: '4.2'
        title: Cost Structure and Operating-Leverage Proxies
        blocks:
          - type: paragraph
            body: >-
              The cost base combines food inputs, labor, kitchen occupancy, delivery-platform commissions, partner
              royalties, technology, and quality systems. StartupKit's independent but unsourced reconstruction argues
              that commissions and royalties leave the infrastructure operator with a narrow residual margin; it is
              useful as a risk hypothesis, not as audited economics. Kitopi's 2021 release provides a historical
              operating-leverage proxy: management said order volume doubled while preparation time fell 40%, and
              described responsibility from supply chain and staff training through delivery and customer experience.
              Those claims indicate process leverage but do not establish gross margin, site utilization, contribution
              profit, CAC, payback, or channel economics. The unit-economics table therefore separates disclosed scale
              and historical operating claims from the financial inputs still required for underwriting.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
