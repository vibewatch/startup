      - number: '1.2'
        title: Founders, Executive Leadership, and Organizational Governance
        blocks:
          - type: paragraph
            body: >-
              Kitopi was co-founded by an executive team of four entrepreneurs: Mohamad Ballout (Chief Executive
              Officer), Saman Darkan (Chief Technology Officer), Bader Ataya (Chief Growth Officer), and Andy Arenas
              (Chief Order Officer) [CO003, CO004]. Chief Executive Officer Mohamad Ballout serves as the primary
              corporate leader and spokesperson, framing the company's long-term commercial strategy as "Franchise
              2.0"—a model that enables third-party restaurant brands to plug directly into standardized operational and
              logistics infrastructure [CO004]. Chief Technology Officer Saman Darkan spearheaded the in-house
              development of the Smart Kitchen Operating System (SKOS), which coordinates kitchen-floor tasks and data
              analytics [CO004, CO011]. Chief Growth Officer Bader Ataya and Chief Order Officer Andy Arenas led brand
              partnerships, regional market entry, and kitchen operational standardization [CO004]. While executive
              leadership has remained relatively stable across funding expansions, key-person dependency is heavily
              concentrated in Ballout's vision and capital allocation capabilities and Darkan's architectural
              stewardship of SKOS [CO004]. Board governance expanded substantially following institutional funding,
              incorporating significant oversight from major venture and sovereign backers, including SoftBank
              Investment Advisers, while maintaining operational autonomy across specialized engineering and robotics
              hubs [CO006, CO014].
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO011
              - CO014
