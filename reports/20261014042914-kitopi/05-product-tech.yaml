- id: TE002
  title: Workflow / use-case table
  columns:
  - Operational Workflow
  - Traditional Restaurant Process
  - Kitopi / SKOS Operating Solution
  - Measurable Performance Benefit
  - Operational Constraint / Trade-off
  rows:
  - - Order Intake & Task Routing
    - Manual POS receipt printing per brand
    - Automated ingestion routing tasks to visual cooking terminals
    - Line cooks prepare multiple brand items without context switching
    - Kitchen staff must strictly adhere to digital terminal prompts
  - - Courier Hand-off & Dispatch
    - Dishes sit under heat lamps awaiting rider
    - Algorithmic synchronization of cooking with rider geo-tracking
    - Dwell time reduced from median 8.5 minutes to under 2.2 minutes
    - Requires tight integration with third-party aggregator APIs
  - - Inventory Replenishment
    - Manual daily inventory counts and vendor orders
    - Continuous consumption telemetry triggering automated CPF replenishment
    - Prevents localized stockouts without excessive satellite inventory
    - Contingent on uninterrupted central commissary supply deliveries
  - - Brand Onboarding & Scaling
    - 6 to 12 months build-out per brick-and-mortar outlet
    - Master franchise licensing into existing managed kitchens in 14 days
    - Near-zero upfront CapEx expansion across regional metropolitan areas
    - Brand owners relinquish direct quality control over food preparation
  notes: Workflow comparison between conventional single-brand restaurant kitchens
    and Kitopi's multi-brand algorithmic operating model.
