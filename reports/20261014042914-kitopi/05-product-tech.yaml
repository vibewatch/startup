callouts:
- calloutType: insight
  title: Algorithmic Production Engineering vs. Passive Real Estate
  body: Kitopi's core technological defensibility stems from internalizing culinary
    execution workflows through SKOS rather than leasing raw dark kitchen compartments.
    Deconstructing recipes into digital micro-steps enables high-density multi-brand
    production within compact 2,000-square-foot footprints, but ties operating consistency
    entirely to software stability and staff adherence.
  claimRefs:
  - CE002
  - CE003
  - CE009
- calloutType: risk
  title: Aggregator Monopsony and Geographic Labor Arbitrage Boundaries
  body: While Kitopi optimizes kitchen-level dwell times to 2.2 minutes, it remains
    structurally dependent on third-party aggregators who control demand generation
    and charge up to 28% in commissions. Furthermore, the model's cost advantages
    rely heavily on GCC labor dynamics, which proved difficult to replicate when attempting
    expansion into higher-wage Western jurisdictions like the United States.
  claimRefs:
  - CE012
  - CE014
