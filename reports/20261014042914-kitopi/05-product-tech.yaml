- id: TE003
  title: Technology / operating architecture table
  columns:
  - Architectural Layer
  - Key Components & Locations
  - Core Functionality
  - Key External Dependencies
  - Technical & Operational Risk
  rows:
  - - Application & Cloud Core
    - Cloud data warehouse, BI tools, Krakow engineering hub
    - Real-time kitchen management, telemetry collection, and demand modeling
    - Cloud infrastructure providers (AWS / Azure) and stable network links
    - Outage in central cloud services could halt kitchen order ingestion
  - - Kitchen Station IoT & Terminals
    - Visual touch terminals, connected kitchen equipment
    - Step-by-step recipe display and multi-brand station cooking guides
    - Hardware reliability in high-heat, high-humidity kitchen environments
    - Terminal hardware failure directly stalls workstation meal prep
  - - Logistics & Aggregator Gateway
    - API integration layer, courier arrival prediction engine
    - Bi-directional order intake and courier ETA synchronization
    - APIs of aggregators (Deliveroo, Talabat, Jahez, Hungerstation)
    - Aggregator API throttling or algorithm changes disrupts dispatch
  - - Advanced Automation & R&D
    - Robotics testing facility in Odense, Denmark
    - Exploratory kitchen automation and robotic food preparation tooling
    - Industrial robotics supply chain and specialized robotics talent
    - Commercial readiness and capital return of robotics remain unproven
  notes: Architecture layers and operating dependencies synthesized from engineering
    hub disclosures, industry case studies, and partner filings.
