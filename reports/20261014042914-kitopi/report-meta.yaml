companyProfile:
  summary: >-
    Kitopi is a Dubai-founded, late-stage private hospitality and food-tech operator that began as a managed
    cloud-kitchen platform and has evolved into a multi-brand regional restaurant group. It combines cloud kitchens,
    dine-in outlets, and owned brands across the GCC, monetized through onboarding fees, royalty/take-rate arrangements,
    and direct restaurant operations. The company says its Smart Kitchen Operating System (SKOS) standardizes prep,
    inventory, and dispatch across a network of more than 200 outlets and more than 6,000 employees.
