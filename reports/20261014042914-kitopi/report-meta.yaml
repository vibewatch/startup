  topStrengths:
    - Proven operating scale across more than 200 GCC locations with a workforce above 6,000 employees.
    - Proprietary SKOS and standardized kitchen workflows provide real operational leverage.
    - >-
      Mix of partner-brand revenue, owned-brand expansion, and direct restaurant operations broadens the commercial
      model.
  topRisks:
    - Store-level economics, contribution margins, and cash conversion remain largely undisclosed.
    - Capital intensity and acquisition-led expansion raise valuation and integration risk.
    - Aggregator dependence and market-backlash risk remain material across GCC markets.
    - Food-safety, labor, and regulatory complexity scale with the multi-country operating footprint.
  unresolvedGaps:
