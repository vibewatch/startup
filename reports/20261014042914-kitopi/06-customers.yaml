figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Lifecycle stages of restaurant brands and aggregators from onboarding through multi-kitchen expansion and brand
    acquisition.
  data:
    nodes:
    - id: stage-1
      label: Brand Onboarding & Licensing
      stage: Awareness & Contract
      actor: F&B Brand Partner
      description: Restaurant brand licenses recipe and menu specifications to Kitopi, paying a one-time onboarding fee.
      touchpoints:
      - Recipe standardization
      - SKOS platform training
      - Kitchen trial runs
    - id: stage-2
      label: SKOS Integration & Kitchen Prep
      stage: Deployment
      actor: Kitopi Kitchen Operations
      description: Kitopi central kitchens ingest recipes and configure automated cook sequencing and ingredient supply chain
        in 14 days.
      touchpoints:
      - Central commissary procurement
      - Smart Kitchen OS configuration
      - Staff culinary training
    - id: stage-3
      label: Aggregator Marketplace Dispatch
      stage: Go-Live & Ordering
      actor: Delivery Aggregators (Talabat, Deliveroo, Careem)
      description: Brand appears on delivery apps; end customers place orders with aggregators owning customer relationship
        and data.
      touchpoints:
      - Aggregator menu listing
      - Delivery app dispatch
      - Last-mile courier handoff
    - id: stage-4
      label: Order Execution & Unit Royalty
      stage: Fulfillment & Monetization
      actor: Kitopi & Brand
      description: Orders cooked in 2,000 sq ft hubs processing up to 3,000 orders/day; Kitopi collects revenue share while
        remitting royalties.
      touchpoints:
      - Automated prep sequencing
      - Aggregator commission deduction
      - 10-13% brand royalty remittance
    - id: stage-5
      label: Cross-Border Regional Expansion
      stage: Expansion Loop
      actor: Enterprise Brand Partner
      description: Successful brands expand across GCC locations (UAE, KSA, Kuwait, Bahrain, Qatar) with zero additional real
        estate capex.
      touchpoints:
      - Multi-city launch
      - Central procurement scaling
      - Menu engineering analytics
    - id: stage-6
      label: Capital Squeeze or Equity Acquisition
      stage: Terminal Durability
      actor: Kitopi Brand Incubator
      description: Brands facing thin aggregator margins either churn or transition into owned/incubated portfolio assets
        via M&A (e.g., AWJ).
      touchpoints:
      - Aggregator commission margin pressure
      - Kitopi M&A buyout offer
      - Full brand vertical integration
  approximationNotes: Stages synthesized from Harvard Business School and StartupKit case teardowns detailing Kitopi's operational
    workflow.
