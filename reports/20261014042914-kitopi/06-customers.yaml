callouts:
- calloutType: insight
  title: 'The Partner Sandwich: Value Capture vs. Aggregator Squeeze'
  body: While Kitopi enables F&B brands to expand across GCC markets within 14 days without capex, its original pure-play
    B2B model rented demand from delivery aggregators and brands from restaurants. To escape the resulting margin compression,
    Kitopi pivoted from an invisible kitchen operator into an equity owner of multi-brand restaurant assets.
  claimRefs:
  - CU001
  - CU010
  - CU011
- calloutType: risk
  title: Concentration on Delivery Rails and Ecosystem Pushback
  body: Kitopi remains fundamentally dependent on third-party delivery aggregators (Talabat, Deliveroo, Careem) for end-consumer
    demand, while rapid expansion of centralized kitchens has catalyzed local F&B pushback, with regional restaurateurs reporting
    up to 30% delivery revenue declines.
  claimRefs:
  - CU007
  - CU013
