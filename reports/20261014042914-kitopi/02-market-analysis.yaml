callouts:
  - calloutType: insight
    title: Strategic Transition from Pure Kitchen Infrastructure to Multi-Brand Operating House
    body: >-
      Kitopi's corporate trajectory reflects an evolution from pure kitchen-as-a-service infrastructure to an integrated
      multi-brand operator. By acquiring established brand portfolios such as AWJ and expanding into franchising in
      2026, the company captures higher gross margins while diversifying away from pure platform dependency.
    claimRefs:
      - CM004
      - CM006
      - CM007
  - calloutType: risk
    title: Channel Concentration and Local Restaurant Backlash
    body: >-
      While centralized cloud kitchens offer operational efficiencies, aggressive market expansion creates friction with
      traditional dining establishments and exposes the platform to channel concentration on third-party delivery apps.
      Reported delivery share declines among local restaurants underscore emerging regulatory and reputation risks
      across core Gulf markets.
    claimRefs:
      - CM009
      - CM010
