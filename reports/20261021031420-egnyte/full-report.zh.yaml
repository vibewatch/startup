      - number: '1.3'
        title: 里程碑与证据质量
        blocks:
          - type: paragraph
            body: >-
              现有时间线显示，Egnyte 已从文件基础设施扩展到治理、合规、AI 和赞助方支持的规模化运营。Egnyte 官方历史记录了 2011 年的 Object Store、2016 年的 AI 数据治理方案、2020
              年面向生命科学合规的安全隔离区，以及 2023 年的 Microsoft CSPP+ 身份和生成式 AI 助手。Deep Analysis 将 Goldman Sachs 领投的 E 轮定于 2018 年，并将
              GI/TA 控股投资定于 2025 年 2 月。ARR Club 随后把 2025 年 8 月标为 $300 million ARR
              里程碑，但其页面未提供源文件或方法论，因此该数字仍是第三方据报数据，而非审计数据。这不能与 Deep Analysis 估计的 $250 million-plus 年收入混为一谈。IncFact
              只提供宽泛的估计收入区间，并明确称私营公司收入属于统计评估。UpGuard 确认 Egnyte
              持续接受外部监测，但抓取到的公开文本既未披露评级，也未披露发现，因此它支持进一步尽调，而不是对违规历史或当前安全质量下结论。
