      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              指定证据没有当前现金余额、烧钱速度、现金跑道、债务余额、授信额度条款、资金计划用途或下一轮融资触发条件。其他地方披露的融资额不应视为可用现金，宽泛的第三方收入区间也无法填补流动性缺口。Egnyte
              聚焦受监管和内容密集型行业，有利于高级套餐和潜在切换成本，但没有合同、续约、队列和利润率数据，收入质量仍未验证。财务结论因此喜忧参半：定价能力有一定可能，订阅机制也清晰，但利润率路径、销售效率、集中度和资本充足性无法基于公开资料作出投资判断。要形成信心，必须审阅数据室中的审计报表、账单队列、递延收入、债务和现金资料。
