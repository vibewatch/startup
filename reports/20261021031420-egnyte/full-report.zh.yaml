  - id: FM001
    title: Egnyte 可服务市场的证据梯
    type: pyramid
    summary: 定性触达层级将已披露的存量客户证明与更广泛但未量化的可服务空间区分开来。
    data:
      items:
        - label: 已披露存量客户
