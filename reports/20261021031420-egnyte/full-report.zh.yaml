  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：受治理的企业内容，而非通用存储
        blocks:
          - type: paragraph
            body: >-
              Egnyte
              可守住的市场边界，是围绕关键任务非结构化内容的控制层：企业文件共享、外部协作、内容治理、数据安全和文档工作流。其平台材料把文件访问、权限、敏感数据发现、可审计性、勒索软件检测、留存、元数据、OCR、工作流自动化和受治理
              AI 放在同一产品界面中。因此，通用对象存储、独立端点安全、宽泛生产力套件和结构化数据治理，更像相邻或替代性支出，不能自动算作可触达支出。这个边界比“所有内容管理”窄，但比传统文件同步与共享更宽。Egnyte
              新闻稿转载的 IDC 评论强化了这一组合类别，不过新闻稿仍是公司发布的证据，并非底层评估的独立副本。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 市场规模视角：有装机基础证明，但没有公开 TAM
        blocks:
          - type: paragraph
            body: >-
              指定来源集的公开证据没有披露品类收入、可服务席位数、年度合同价值或买方总体分母，因此用货币表示 TAM、SAM 或 SOM 会制造虚假精确度。最有用的规模视角是 Egnyte 披露的装机基础：合作伙伴新闻稿称
              2025 年 2 月企业客户超过 22,000 名，2026 年 9 月公司新闻稿和当前落地页则称客户或企业超过 23,000 名。这些数字说明商业覆盖面，但没有经过验证的
              ARPU、一致的客户定义和符合条件的账户数量，就不能直接换算成市场价值。Tracxn 列出的 1,301 家活跃竞争者体现的是品类广度，而非可触达收入，因为其比较集合包含宽泛的相邻领域和替代方案。
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM014
              - CM015
