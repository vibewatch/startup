      - number: '1.2'
        title: 所有权、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              最重要的所有权里程碑是 GI Partners 和 TA Associates 于 2025 年 2 月完成控股投资。Deep Analysis
              将其描述为控股投资，但未披露对价、投后估值、优先权条款、债务、滚存持股或两家赞助方的确切持股比例。该来源还称公司自成立以来融资 $137.5 million，并将 Goldman Sachs 领投的 2018 年
              E 轮列为这笔私募股权交易前最后一轮常规融资。Egnyte 当前管理层页面显示，在 CEO Vineet Jain 领导下，公司覆盖技术、财务、运营、产品、安全、工程、收入、增长和营销职能。董事会名单主要由 TA
              和 GI Partners
              的具名代表组成，因此赞助方治理和管理层连续性是核心尽调议题。现有证据无法确定创始人身份、创始人持股、投票安排、保留事项或继任计划；这些缺口使我们无法定论创始人与市场的匹配度及关键人依赖。
