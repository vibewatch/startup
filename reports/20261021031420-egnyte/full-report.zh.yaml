      - CM008
      - CM012
      - CM015
  - id: FP001
    title: 按治理深度和采用简易度定位竞争
    type: quadrant
    summary: 分析师序数定位显示，Egnyte 位于易采用套件和治理型专业厂商之间，其论点建立在兼顾两者之上。
    data:
      points:
        - label: Egnyte
          x: 4
          'y': 3
          note: 治理覆盖面广；由于用户评价中的摩擦褒贬不一，采用简易度中等。
        - label: Box
          x: 4
          'y': 4
          note: 以治理为导向的云端同业，报道的入门价格更低。
        - label: Microsoft OneDrive / SharePoint
          x: 3
          'y': 5
          note: 套件分发有助于采用；尚未确立可比的专业深度。
        - label: Dropbox
          x: 2
          'y': 5
          note: 评价证据更支持其设置和易用性；在该比较中治理深度较轻。
        - label: Laserfiche、DocuWare、iManage
          x: 5
          'y': 2
          note: 专业记录或工作流深度更高，但复杂度更高、适用场景更窄。
        - label: 本地文件服务器 / 内部自建
          x: 1
          'y': 2
          note: 避开迁移，但将协作、治理和安全负担留在内部。
    approximationNotes: 两条轴均使用 1-5 分析师序数：x 轴为治理/工作流专业化程度，y 轴为采用/分发简易度。分数综合定性指定证据，不是厂商基准，也不应解读为实测性能差异。
