        title: 图表
        blocks:
          - type: callout
            title: 先看价格，再谈信心
            body: Egnyte 可能是高质量资产，但指定公开证据不支持已验证的当前股权价值或目标回报。只有在一级交易证据和经审计运营证据确定实际入场经济学后，才应推进。
            calloutType: recommendation
