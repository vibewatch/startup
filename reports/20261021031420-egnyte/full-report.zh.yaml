      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方最可能是 CIO 或 IT
              部门，安全、合规、法务和档案管理相关人员影响采购，业务线负责人则推动垂直工作流。终端用户包括员工、现场团队、外部协作者和直接处理文档的专业人员，因此付费方是组织而非个人用户。Egnyte
              的集成主张指向一条共存式采用路径：连接 Microsoft 365、Google Workspace、Salesforce、Teams、Slack、Zoom
              和行业应用，再整合文件服务器、治理和工作流功能。熟悉的类驱动器访问方式与 API 兼容性可以减少再培训和迁移摩擦，但现有证据没有量化实施时间、采购周期或预算替代规模。
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
      - number: '2.4'
        title: 增长驱动、采用约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              需求由三股相互关联的力量支撑：非结构化内容价值上升、更严格的治理要求，以及企业希望 AI 保留权限和上下文。Egnyte 及其投资方明确把受监管垂直行业、AI
              工作流、全球扩张和更多行业方案视为增长方向。反向压力来自平台捆绑：一份可靠性较低的 AI 生成 Built In 摘要把 Microsoft、Google 和 Box
              列为根深蒂固的评估基准，并指出定价和套餐复杂。外部安全评估是另一道门槛，而不是产品质量证明；UpGuard 描述了数百项检查的持续监测，但保留文本没有披露评分。估值上行取决于垂直行业和 AI
              深度的变现，而套件竞争、不透明的单位经济学和未量化的切换成本限制了我们对市场份额假设的信心。
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 这是重叠市场，不是单一分析师品类
            body: Egnyte 争夺内容协作、治理、安全和工作流预算；把任何一个宽泛品类的估算直接当作 TAM，都会夸大可触达支出。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: callout
            title: 装机基础不是市场规模
            body: 披露的 23,000+ 客户数字证明了覆盖面，但缺少 ARPU、客户定义和符合条件的账户数据，无法得出站得住脚的 SAM 或 SOM。
            calloutType: risk
            claimRefs:
              - CM008
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 买方可以选择套件、专业厂商或维持现状
        blocks:
          - type: paragraph
            body: >-
              竞争集合比企业内容管理厂商名单更宽。G2 的存档替代方案以 Google Drive、Dropbox、Microsoft OneDrive for Business 和 Box 为首，说明买方通常会拿
              Egnyte 与熟悉的协作和存储工具比较，而不只与正式档案系统比较。SelectHub 还列出 Laserfiche、DocuWare 和
              iManage，它们通过档案管理、工作流自动化或专业文档控制展开竞争。本地文件服务器仍是维持现状的替代方案，因为 Egnyte 自己就把平台定位为云文件服务器替代品。公开规模证据很薄弱：Revelio Labs
              估计截至 2026 年 3 月 Egnyte 有 1,435 名员工，并列出 Box 有 2,990 名，但指定证据无法建立行业其他公司的可比收入、融资、客户或细分规模。
            claimRefs:
              - CP001
              - CP003
              - CP013
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP013
              - CP015
      - number: '3.2'
        title: Egnyte 卖的是受治理的协作，而不只是存储
        blocks:
          - type: paragraph
            body: >-
              Egnyte 的产品卖点是在一个受治理的平台中结合云文件访问、策略驱动工作流、元数据增强、搜索、API 和安全控制。公司具体强调基于角色的访问控制、数据丢失防护、Zero
              Trust、勒索软件检测、数据驻留、审计可见性，以及与 Microsoft 365、Google Workspace、Salesforce 和行业应用的集成。它还瞄准
              AEC、金融服务、生命科学和媒体行业；在这些领域，大文件和受监管内容可能让通用驱动器不够用。这作为产品定位是可信的，但仍属于公司发布的证据。UpGuard 确认存在外部攻击面监测框架，但可访问页面没有披露
              Egnyte 的实际评分或经过竞争者标准化的结果。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.3'
        title: 捆绑销售和迁移经济学是主要压力点
        blocks:
          - type: paragraph
            body: >-
              一份由竞争者撰写的 2026 年比较报告称，Egnyte Business 为每用户每月 $22，含 100GB 共享存储；Enterprise Lite 为 $39，Elite 为 $48；Box
              Business 为 $15 且存储不限量，Microsoft 365 Business Basic 为 $7 且包含
              SharePoint。这些数字有助于理解买方替代方案，但并非经过独立验证的实际合同价格。Microsoft 可以通过已有的身份和生产力套件提供存储；Dropbox 和 Google 可凭用户熟悉度取胜；Box
              则无需 Egnyte 的混合定位，也能在云治理上竞争。Egnyte 用 API、继承权限、熟悉的类驱动器访问、大文件支持和受监管工作流控制应对。现有证据没有量化迁移成本、多重使用、折扣或续约议价能力。
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河是工作流组合，而非不可攻破的单项功能
        blocks:
          - type: paragraph
            body: >-
              独立评测证据好坏参半。G2 评测者认为 Dropbox 和 Google Drive 比 Egnyte 更容易设置、更易合作，也更好用。SelectHub 总结了 Egnyte
              的安全与集成优势，但也记录了对离线访问、界面复杂度、外部共享及大文件或高峰使用性能的抱怨。这带来双向替代风险：套件厂商可以把基础存储和协作商品化，而 Laserfiche、DocuWare、iManage
              等专业厂商则可能凭深度档案或工作流能力绕开 Egnyte。因此 Egnyte
              的防守力取决于：面对受治理的复杂内容，它能否持续提供比“捆绑驱动器加点状控制”更好的组合体验。指定证据只定性支持这一逻辑，没有留存率、胜率或切换成本数据支持。
            claimRefs:
              - CP002
              - CP005
              - CP016
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 捆绑替代方案可能重置支付意愿
            body: >-
              Microsoft 365、Box、Dropbox 和 Google Workspace 可以让基础存储和协作看起来已包含在内，或明显更便宜。Egnyte
              必须证明，其治理、混合部署、行业适配和大文件优势足以抵消额外许可费及独立管理界面的成本。
            calloutType: risk
            claimRefs:
              - CP001
              - CP010
              - CP011
              - CP012
              - CP016
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Egnyte 可观察到的商业模式是按用户按年计费的订阅，治理、安全、工作流和 AI 能力价格更高。PCMag 报称，Team 对 1-10 名用户为每用户每月 $10，Business 为
              $22，Enterprise Lite 为 $39，Elite 为 $48，Ultimate
              则需定制报价。产品和定价页面支持这种层级与功能架构，而独立采购来源指出存储、支持、迁移和实施也是额外成本变量。因此，标价订阅额适合作为起点，却不能替代实际年度合同价值或确认收入。2026 年 3
              月的一份指南列出的 Enterprise Lite 和 Elite 价格略低，因此所有定价分析都应标明日期，并与当前订单表核对。
