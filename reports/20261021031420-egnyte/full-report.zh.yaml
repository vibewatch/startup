          - type: paragraph
            body: >-
              最新融资背景是 2025 年 2 月的控股投资，但公开记录没有披露轮次金额、投后估值、持股拆分、优先股堆叠或杠杆。Tracxn 报告截至 2025 年 3 月 27 日估值为 $1.5 billion，而
              Multiples 给出两种无法兼容的交易描述：以 $250 million 收入的 11.8 倍、对应 $2.9 billion 的收购；同一页面其他位置又称估计 $250 million ARR 的 5-6
              倍、约 $1.5 billion 估值。这些数字不能视为等价，因为收入不是 ARR，且两个来源都没有提供交易文件。因此结论是估值证据不足且对价格敏感：任何点估值都不应被当作已验证的当前股权价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV015
