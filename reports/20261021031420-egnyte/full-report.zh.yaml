chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、产品与运营规模
        blocks:
          - type: paragraph
            body: >-
              Egnyte 成立于 2008 年，总部位于加州 Mountain
              View。公司如今的定位已超越基础文件共享：它将协作、智能、治理、安全、工作流自动化和集成整合到一个内容平台中，服务关键任务非结构化内容。这个定位对应一种订阅软件业务，面向既要提升员工生产力、又要集中管控的组织；当文件很大、数据受监管或工作流具有行业特性时，通用存储往往不够用。公司当前页面称客户超过
              23,000 名，LeadIQ 也重复这一规模，并将 AEC、金融服务和生命科学列为服务行业。规模数字必须标明期间和口径。Deep Analysis 报称截至 2025 年 5 月客户超过 22,000 名、员工
              1,100 人，而 IncFact 的 2026 年 10 月档案将员工数列为 500-1,000 人。这些观察可能来自不同日期或估算方法，不应合并成一个精确的当前员工数。
