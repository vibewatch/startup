        - 获取事件时间线、取证报告、受影响数据分析、保险方通知、监管机构往来及客户通知
      - - 合规与控制主张
        - GDPR、HIPAA、FINRA、ITAR、数据驻留及合同控制范围
        - 公司称相关支持已具备；一份声誉较低的资料声称具备 SOC 2 Type II，但未分配一手鉴证材料包
        - 证据可能不足
        - 对受监管客户续约而言较高
        - 已描述产品控制；独立范围和例外情况未经核实
        - 中高
        - 审阅当前 SOC 报告、桥接函、子处理方清单、渗透测试、DPA、控制例外和整改日志
      - - 续约、取消和计费争议
        - BBB 提交材料所反映的美国商业合同
        - BBB 报告三年内有五起投诉，并标记五起均未答复；相关指称未经独立裁决
        - 合理可能
        - 中等
        - 指定证据池中没有管理层回应证据
        - 中
        - 抽查续约通知、取消工作流日志、许可变更控制、抵扣、响应 SLA 和争议结果
    notes: 该登记表仅基于指定预取证据池；严重性反映所引暴露的潜在影响，而事件是否发生及法律义务仍须审阅一手记录后确认。
    enumerationScope:
      coverage: partial
      basis: >-
        Public regulatory, legal, security, and contractual signals present in the assigned eight-source worker pool as
        of 2026-10-21.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR006
      - CR007
      - CR010
      - CR011
      - CR016
  - id: TR002
    title: 运营、质量与安全风险登记表
    columns:
      - 失效模式
      - 证据
      - 可能性
      - 严重性
      - 缓解成熟度
      - 残余暴露
      - 未解决缺口
    rows:
      - - 重大网络事件
        - 第三方勒索软件记录；泄露规模未知；明确指出凭证数据未必相关
        - 可能
        - 严重
        - 公司描述勒索软件检测、访问控制和审计可见性
        - 高
        - 一手事件确认、范围、遏制、整改和通知记录
      - - 大文件上传失败
        - Gartner 托管的评测者报告超过 2 GB 后上传缓慢、崩溃并需完全重启
        - 在一份可访问评测中观察到；普遍程度未知
        - 对 AEC 及其他大文件工作流而言较高
        - 产品营销边缘能力和云端协作；没有独立压力测试结果
        - 中高
        - 按文件大小、并发量、地域、客户端版本、恢复点和支持严重等级划分的失败率
      - - 外部攻击面薄弱
        - UpGuard 描述 330 多项持续外部检查，但抓取文本未披露评分
        - Unknown
        - 若存在关键发现则较高
        - 第三方存在监测；整改证据不可得
        - 中
        - 完整供应商风险报告、带日期的发现、例外负责人和关闭证据
      - - AI 性能或治理不足
        - Egnyte 营销答案准确率提高 94%、响应速度提高 77%，AI 采用率达到 2 倍
        - 在公司测量语境之外未知
        - 中等
        - 声称内置治理；此处未披露基准设计和分母
        - 中
        - 在买方数据上复现指标；检查评估集、基线、错误类别、访问控制和审计日志
    notes: 可能性标签区分单次评测观察、第三方指称和未知普遍程度；任何一行都不会把未经核实的记录或营销指标转成已确认事件或独立基准结果。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR009
      - CR013
      - CR016
  - id: TR003
    title: 合作伙伴与依赖风险登记表
    columns:
      - 依赖
      - 交易对手或角色
      - 集中度证据
      - 失败情景
      - 严重性
      - 缓解措施
      - 残余暴露
    rows:
      - - 生产力与协作连接器
        - Microsoft 365 和 Teams；Google Workspace；Slack；Zoom
        - 已点名多项集成，但使用量和收入集中度未披露
        - API、身份、权限或供应商策略变化损害核心工作流
        - 高
        - 公司声称提供开放 API 和集中治理
        - 待核验连接器级使用量和回退测试，当前为中高
      - - 业务工作流集成
        - Salesforce 及其他通过 RESTful API 连接的应用
        - 指定证据中没有连接器级客户或工作负载分布
        - 身份验证、速率限制、架构或可用性变化扰乱自动化内容工作流
        - 高
        - API 被描述为遵循平台治理和安全控制
        - 待补依赖清单、SLO 和故障切换证据，优先级中高
      - - 年度签约与客户支持
        - Egnyte 的计费、续约、账户管理和支持运营
        - BBB 投诉数量不多，但列出的投诉均标为未回应
        - 支持延迟或僵化的续约流程会放大流失、纠纷和声誉风险
        - 中等
        - 指定证据池中没有缓释证据
        - 待补代表性工单、续约、退款和响应时长数据
    notes: 依赖集中度未知：公开来源提到了集成，但未披露工作负载占比、客户集中度、连接器 SLO 或故障转移使用情况。
    claimRefs:
      - CR010
      - CR011
      - CR012
      - CR016
  - id: TV001
    title: 建议摘要
    columns:
      - 决策维度
      - 当前判断
      - 对决策的含义
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 在拿到主要交易和财务证据前，不要对入场价格作投资判断。
      - - 信心
        - 中等
        - 公开来源不少，但最重要的估值数字彼此冲突。
      - - 风险评级
        - 高
        - 私营公司披露缺口，以及尚未解决的安全和客户服务信号占据主导。
      - - 估值立场
        - 公开证据不足
        - 将 $1.5B 和 $2.9B 视为冲突的报道估值，而不是已验证的区间。
      - - 入场纪律
        - 对价格敏感
        - 先核实经常性收入、增长、利润率、留存、债务和优先权，再确定倍数。
    notes: 判断来自公开的第三方及公司发布证据，是分析推断；指定证据中没有经审计的当前财务数据或已签署交易文件。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV010
      - CV011
      - CV013
      - CV015
      - CV016
  - id: TV002
    title: 论点与反论点
    columns:
      - 立场
      - 基于证据的论点
      - 哪些信息会改变判断
    rows:
      - - 论点
        - 统一的协作、治理、安全、合规、API、工作流和 AI 定位。
        - 独立的客户留存和扩张证据会增强其持久性判断。
      - - 论点
        - 据报道，GI Partners 和 TA Associates 在 2025 年投资后成为多数股东。
        - 披露治理、杠杆和可信退出路径，会提升投资准备度。
      - - 反论点
        - 公开交易价值在约 $1.5B 和 $2.9B 之间冲突。
        - 已签署交易文件和完整摊薄资本表会解决基准问题。
      - - 反论点
        - AI 结果指标和公开安全监控文字缺少足够的方法论或结果，无法用于投资判断。
        - 可复现的 AI 研究和完整的独立安全报告会降低证据风险。
    notes: 公司发布的产品和 AI 表述只能确立定位，不能替代独立验证；融资估值来自第三方数据库，而非主要交易申报文件。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV015
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 适用报道中的 $1.5B 估值；经常性收入接近所引用的 $250M 估计值；增长和留存具有持久性。
        - 只有在核实指标和资本结构后，约 5x-6x 的经常性收入参考倍数才可能站得住。
        - 估计 ARR 可能不同于收入；优先权或债务可能吞噬股权价值。
        - 在拿到经审计指标和交易条款前，信号较弱。
      - - 基准
        - 平台仍有相关性，但当前财务数据和交易经济学仍属私有信息。
        - 没有可辩护的目标回报或退出价值；保留观察名单，并围绕已核实指标谈判。
        - 披露缺口持续存在，可比公司选择仍然宽泛。
        - 当前最强信号，因为决定性输入缺失或互相冲突。
      - - 悲观
        - 报道中的 $2.9B 价格或 11.8x 倍数是有效基准，且软件倍数收缩。
        - 若增长未超过所引用上市公司基准，或安全信任减弱，下行空间会扩大。
        - 未核实的事件说法、未回应投诉和薄弱的留存证据会叠加倍数风险。
        - 若主要尽调确认更高入场估值或存在重大未解决事件，影响将很大。
    notes: 情景标签是条件式框架，不是概率估计或预测；收入、ARR、股权价值和企业价值不视为可互换指标。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
