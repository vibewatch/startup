  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 扩张可以从替换基础设施开始，推进到受治理工作流、更广泛协作和产品反馈；但公开留存指标无法确认客户是否稳定完成这一旅程。
    data:
      items:
        - title: Replace fragmented infrastructure
          label: 替换碎片化基础设施
          detail: 从文件服务器、VPN 或点状工具迁移到受治理内容层。
          touchpoints:
            - IT 评估
            - 安全审查
            - 迁移规划
        - title: Migrate operational content
          label: 迁移运营内容
          detail: 转移大型存储库，同时保留访问模式和权限。
          touchpoints:
            - 专业服务
            - Storage Sync
            - 权限
        - title: Embed existing workflows
          label: 嵌入现有工作流
          detail: 连接 Microsoft 365、Google Workspace、Salesforce 和行业应用。
          touchpoints:
            - 集成
            - REST API
            - 桌面访问
        - title: Expand collaborators and sites
          label: 扩大协作者和站点范围
          detail: 增加现场团队、外部伙伴、被收购办公室和受监管用户。
          touchpoints:
            - 外部共享
            - 移动访问
            - 基于角色的权限
        - title: Add governance and intelligence
          label: 增加治理与智能
          detail: 在受治理内容上叠加安全、合规、搜索、自动化和 AI。
          touchpoints:
            - 审计轨迹
            - 敏感数据控制
            - AI 工作流
        - title: Feed usage back into product
          label: 将使用反馈回传产品
          detail: 通过门户、支持、NPS 和客户成功团队收集需求。
          touchpoints:
            - Productboard Portal
            - Zendesk
            - NPS 调研
    approximationNotes: 该顺序是根据公开工作流证据拼出的分析旅程，不是实测漏斗，也不代表转化率或留存率。
    claimRefs:
      - CU003
      - CU010
      - CU011
      - CU012
      - CU015
      - CU016
  - id: FR001
    title: 剩余风险优先级矩阵
    type: matrix
    summary: 以证据为边界的优先级排序，将高影响不确定性与已观察到但更窄的运营和商业信号分开。
    data:
      columns:
        - label: 可能性
          detail: 根据保留证据判断为已观察、可能或未知
        - label: 影响
          detail: 风险发生时可能对投资判断造成的后果
        - label: 缓释成熟度
          detail: 有公开证据支持的缓释力度
        - label: 剩余严重度
          detail: 考虑现有缓释证据后的优先级
      rows:
        - label: 网络事件不明
          note: 泄露列表不是主要确认来源
          values:
            - 可能
            - 关键
            - 控制措施为公司自述；事件响应未经核实
            - 高
        - label: 大文件可靠性
          note: 一份可访问的用户报告；普遍程度未知
          values:
            - 一条评价中已观察到
            - 对大文件工作流影响高
            - 产品能力为公司自述；缺少压力数据
            - 中高
        - label: 合同与支持摩擦
          note: BBB 不核实第三方投诉的准确性
          values:
            - 合理可能
            - 中等
            - 证据池中没有回应证据
            - 中等
        - label: 财务模型不透明
          note: ARR 和增长是单一来源的第三方说法
          values:
            - 已确认的证据缺口
            - 对投资判断影响高
            - 证据池中没有经审计证据
            - 高
        - label: 外部攻击面验证
          note: 监控方法可见，但结果分数不可见
          values:
            - Unknown
            - 若存在关键发现则为高
            - 已描述持续外部检查
            - 中等
        - label: 集成依赖
          note: 连接器使用、集中度和故障转移证据不可得
          values:
            - 合理可能
            - 对核心工作流影响高
            - 公司自述拥有开放 API 和集中控制
            - 中高
    approximationNotes: 类别是定性且受证据约束的，不是概率或数值风险评分。
    claimRefs:
      - CR005
      - CR009
      - CR010
      - CR011
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策路径从产品相关性出发，先看证据质量和下行风险，再形成对价格敏感的跟踪建议。
    data:
      nodes:
        - id: platform
          label: 广泛的企业内容平台
          detail: 协作、治理、安全、合规、API、工作流和 AI。
        - id: ownership
          label: 机构多数股权
          detail: 据报道，GI Partners 和 TA Associates 是多数股东。
        - id: price
          label: 价格发现冲突
          detail: 公开来源给出约 $1.5B 和 $2.9B 的估值。
        - id: financials
          label: 私有财务证据
          detail: 经审计的当前 ARR、收入、利润率、留存和集中度仍不可得。
        - id: downside
          label: 下行空间需要验证
          detail: 安全和投诉信号偏负面，但尚无定论。
        - id: decision
          label: 跟踪 / 继续研究
          detail: 只有在主要尽调填补缺口后，才设定价格和回报目标。
    approximationNotes: 这是定性决策顺序，不编码概率、转化率或与价值成比例的宽度。
    claimRefs:
      - CV007
      - CV008
      - CV010
      - CV011
      - CV013
      - CV015
      - CV016
