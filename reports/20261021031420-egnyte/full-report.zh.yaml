      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              可投资逻辑是：Egnyte 面向受监管或内容复杂的环境，销售覆盖协作、治理、安全、合规、工作流、API 和 AI 的统一内容平台。GI Partners 和 TA Associates
              的控股可能带来运营和退出支持，而当前主页仍突出上下文 AI。反向逻辑同样重要：估值证据内部不一致，抓取页面没有披露平台 AI 成果主张的研究设计，UpGuard
              的公开文本描述了广泛监测，却没有展示最终评级。因此，产品广度支持公司质量，但不能替代经审计财务表现、留存、安全证据或可投资价格。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
      - number: '8.3'
        title: 情景与下行风险
        blocks:
          - type: paragraph
            body: >-
              乐观情景需要一级证据证明较低的据报交易价值才是相关股权基准，持续性收入接近所引估算，且增长、利润率和留存足以支持相对于增长较慢的公开软件公司的溢价。基准情景是继续跟踪，因为相互冲突的估值口径和未披露交易条款无法支持可靠的回报模型。悲观情景则是较高的据报价格叠加倍数压缩和未解决的运营信号。Breachsense
              记录了勒索软件团伙主张，但标明泄露规模未知，并警告凭据数据可能无关；BBB 报告少量未回复投诉，但明确声明不会核验。这些是尽调触发点，不是已确认入侵或客户普遍失败的证明。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 建议与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              建议：继续观察并深入研究，信心中等，投资判断风险高。公司在战略上似乎重要，但公开证据不足以确定入场价、目标回报、持有期或退出价值。基于价格作决定，需要已签署的 2025
              年交易文件、完全摊薄股权结构表、优先权和债务条款、经审计收入与 ARR 对账、增长、毛利率、净留存率、流失率和客户集中度。安全尽调应独立核实据称的 2026 年 5
              月勒索指控、影响范围、响应和补救。如果经验证的经常性收入或留存明显低于所引估算、有效入场倍数在增长没有更优的情况下接近较高估值口径，或重大未解决事件损害受监管行业信任，投资逻辑就会破裂。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
