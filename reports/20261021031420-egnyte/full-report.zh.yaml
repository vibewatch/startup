        - label: 核心任务
          value: Collaborate, govern, secure
          detail: 关键的非结构化内容和文档工作流。
        - label: 高匹配组织
          value: Regulated or content-intensive
          detail: 在外部协作与集中控制之间寻求平衡的组织。
        - label: 明确的垂直行业重点
          value: AEC, life sciences, financial services
          detail: 公司和投资者材料反复提及的垂直行业。
        - label: 计划扩张
