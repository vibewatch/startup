              公开规模证据过于模糊，无法建立运营模型。IncFact 将年收入置于宽泛的 $100 million 至 $500 million 区间，并明确把私营公司收入标为统计评估。Vendr
              发布部署支出区间，但那是买方侧估算，不是 Egnyte 的收入、ARR
              或订单额。指定的当前来源均未披露经审计收入、ARR、同比增长、毛利率、净留存率、流失率、CAC、回本周期、销售周期或收入集中度。这一缺口具有财务后果：投资者无法区分持久的订阅扩张、涨价、存储增长、服务工作或组合变化。正确的投资判断应保留这些字段为不可得，并直接索取队列和利润率证据。
