company:
  name: "Egnyte"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Egnyte is a Mountain View enterprise content platform founded in 2008, with
    company-reported reach above 23,000 customers and a February 2025 majority
    investment by GI Partners and TA Associates. Scale indicators are directionally
    substantial but not audit-ready: annual revenue, ARR, employee, funding, valuation,
    and transaction-economics disclosures remain incomplete or methodologically mixed.
sections:
  - id: "identity-and-scale"
    title: "Identity, product, and operating scale"
    body: >-
      Egnyte was founded in 2008 and is headquartered in Mountain View, California.
      Its current positioning is broader than basic file sharing: the company describes
      one content platform combining collaboration, intelligence, governance, security,
      workflow automation, and integrations for mission-critical unstructured content.
      That framing points to a subscription software business aimed at organizations
      that need both employee productivity and centralized control, especially where
      large files, regulated data, or industry-specific workflows make generic storage
      less suitable. The current company page reports more than 23,000 customers, and
      LeadIQ repeats that scale while identifying AEC, financial services, and life
      sciences as served verticals. Scale figures require careful period and metric
      labeling. Deep Analysis reported more than 22,000 customers and 1,100 employees
      in May 2025, while IncFact's October 2026 profile places employment in a 500-1,000
      band. Those observations may reflect different dates or estimation methods, so
      they should not be collapsed into a single precise current headcount.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO009]
    tableRefs: [TO001]
  - id: "ownership-leadership-and-governance"
    title: "Ownership, leadership, and governance"
    body: >-
      The most consequential ownership milestone is the February 2025 majority
      investment by GI Partners and TA Associates. Deep Analysis describes it as a
      majority investment but does not disclose consideration, post-money valuation,
      preference terms, debt, rollover ownership, or the sponsors' exact stakes. It
      also reports $137.5 million raised since founding and identifies a Goldman
      Sachs-led Series E in 2018 as the last conventional funding round before the
      private-equity transaction. Egnyte's current leadership page shows functional
      coverage across technology, finance, operations, product, security, engineering,
      revenue, growth, and marketing under CEO Vineet Jain. Its board list is dominated
      by named representatives of TA and GI Partners, making sponsor governance and
      management continuity central diligence topics. The fetched evidence does not
      establish founder identities, founder ownership, voting arrangements, reserved
      matters, or succession plans; those omissions prevent a definitive assessment of
      founder-market fit and key-person dependence.
    claimRefs: [CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO002, TO003]
  - id: "milestones-and-evidence-quality"
    title: "Milestones and evidence quality"
    body: >-
      The available chronology shows a company that expanded from file infrastructure
      into governance, compliance, AI, and sponsor-backed scale. Egnyte's official
      history records Object Store in 2011, an AI-powered data-governance solution in
      2016, a secure enclave for life-sciences compliance in 2020, and both Microsoft
      CSPP+ status and generative-AI assistants in 2023. Deep Analysis places the
      Goldman Sachs-led Series E in 2018 and the GI/TA majority investment in February
      2025. ARR Club then labels August 2025 as a $300 million ARR milestone, but its
      fetched page does not provide source documents or a methodology, so that figure
      remains third-party reported rather than audited. This is not interchangeable
      with Deep Analysis's approximate $250 million-plus annual-revenue figure. IncFact
      supplies only a broad estimated revenue range and explicitly calls private-company
      revenue a statistical evaluation. UpGuard confirms continuous external monitoring
      of Egnyte but exposes neither a rating nor findings in the fetched public text;
      it therefore supports a diligence path, not a conclusion about breach history or
      current security quality.
    claimRefs: [CO007, CO008, CO009, CO011, CO012, CO015, CO016]
    figureRefs: [FO001]
