callouts:
  - calloutType: "risk"
    title: "Scale is material, but the metric bridge is missing"
    body: >-
      Public evidence points to a sizable, profitable software company, yet the assigned
      sources do not reconcile annual revenue to ARR, employee estimates, customer
      definitions, transaction economics, or valuation. Investment analysis should use
      the figures as bounded indicators until audited statements and deal documents are
      available.
    claimRefs: [CO004, CO006, CO007, CO008, CO009, CO010, CO012]
