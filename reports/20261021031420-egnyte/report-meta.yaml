companyProfile:
  summary: >-
    Egnyte is a Mountain View-based private software company serving more than 23,000 company-reported customers with a
    unified enterprise content platform. Its product combines collaboration with governance, security, compliance,
    automation, integrations, and AI for content-intensive and regulated workflows. GI Partners and TA Associates made a
    majority investment in February 2025.
  foundingLocation: null
  headquarters: Mountain View, California, United States
  productSummary: >-
    An enterprise content platform that combines file collaboration, content governance, security and compliance
    controls, workflow automation, integrations, APIs, and contextual AI.
  customerFocus: >-
    Enterprises with large volumes of mission-critical unstructured content, especially architecture, engineering and
    construction, financial services, life sciences, and other regulated or content-intensive industries.
  businessModel: >-
    Annually billed per-user subscriptions with higher-priced governance, security, workflow, recovery, and AI tiers
    plus contract-specific storage, support, migration, and implementation economics.
