      - [Data governance and classification, "Security, compliance, and records teams", "Established controls; detailed technical description is from 2023", "Classification and policy across Egnyte and selected third-party repositories", "Control parity by repository API and plan tier"]
      - [Threat management and recovery, "Security operations and IT administrators", "Documented ransomware detection, account disablement, version rollback, and recovery options", "Content-native response tied to files, identities, and audit records", "Independent efficacy tests and recovery-time evidence"]
      - [Workflow automation, "Business process owners and content teams", "Current platform capability with reviews, file actions, metadata, signatures, and integrations", "Policy-driven document workflows inside the governed content layer", "Workflow volume, failure handling, and implementation effort"]
      - [AI and Context Studio, "Knowledge workers, AI teams, and administrators", "Currently marketed product direction", "Permission-aware context, metadata enrichment, search, and agent workflows", "Release maturity, adoption, benchmark methodology, and pricing"]
      - [APIs and integrations, "Developers, IT, and application owners", "REST APIs and broad integration claims; some ERP paths are partner or iPaaS delivered", "Governed content embedded into productivity and industry workflows", "Public developer activity, connector ownership, release cadence, and support boundaries"]
    notes: "Status reflects only the assigned public evidence through 2026-10-21; roadmap, adoption, reliability, plan entitlement, and benchmark gaps are stated explicitly."
    claimRefs: [CE001, CE003, CE005, CE009, CE014]
  - id: TE002
    title: Workflow and use-case assessment
    columns:
      - User job
      - Existing friction
      - Egnyte approach
      - Measurable benefit evidence
      - Limitation
    rows:
      - ["Collaborate on large project files", "Cloud latency or file-server dependence", "Hybrid cache plus governed cloud access", "No current independent latency benchmark in the assigned pool", "Requires deployment-specific network and cache validation"]
      - ["Share sensitive content externally", "Attachments, uncontrolled links, and recipient ambiguity", "Recipient controls, preview-only links, permissions, and auditability", "Feature behavior is documented; outcome data is not public here", "Policy configuration and user behavior remain operational dependencies"]
      - ["Find and classify sensitive content", "Manual tagging does not scale across repositories", "OCR, contextual classification, metadata, and repository scanning", "A 2023 company benchmark claims 7 million files and 3 TB in under a week", "Benchmark methodology and current reproducibility are unavailable"]
      - ["Automate document-centric work", "Manual approvals, tagging, signatures, and handoffs", "Policy-driven workflow actions and integrations", "No independently measured cycle-time reduction in the assigned pool", "Advanced capabilities and implementation scope may vary by tier"]
      - ["Ground enterprise AI in governed content", "Agents lack curated, permission-aware business context", "Context Studio, search, summaries, and permission-aware AI workflows", "A current company page claims 94% more accurate answers", "No disclosed denominator, test set, baseline, or external replication"]
    notes: "Benefits are separated into documented functionality and disclosed outcome claims; unavailable independent outcome measurements remain null rather than inferred."
    claimRefs: [CE003, CE004, CE009, CE015, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Key dependency
      - Principal risk
    rows:
      - [Experience layer, "Web, desktop, mobile, sharing, preview, and co-editing surfaces", "Identity, endpoint policy, and network conditions", "User and device controls may differ by access path"]
      - [AI and workflow layer, "Search, metadata enrichment, document actions, and context for agents", "Content quality, permissions, models, and plan entitlement", "Unvalidated outcome claims and fast-moving product maturity"]
      - [Governance and security layer, "Classification, access governance, DLP, retention, audit, and threat response", "Correct policy design and repository API coverage", "Controls may not apply uniformly to third-party repositories"]
      - [Content services layer, "Versioning, metadata, project folders, lifecycle, and collaboration", "Administrative configuration and user adoption", "Platform breadth can add operational overhead"]
      - [Hybrid access layer, "Smart Cache, local performance, synchronization, and legacy protocols", "Local appliances, network topology, and synchronization correctness", "Deployment complexity and edge-specific security exposure"]
      - [Storage and repository layer, "Egnyte object storage plus governed external repositories", "Cloud providers and third-party repository APIs", "External API limits, residency requirements, and vendor concentration"]
    notes: "The architecture is reconstructed from company-issued technical material and independent reviews; component behavior should be verified in the buyer's target configuration."
    claimRefs: [CE002, CE004, CE006, CE007, CE008, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: "A layered view of Egnyte's user surfaces, automation, governance, hybrid access, and repository dependencies."
    data:
      layers:
        - label: User experiences
          modules:
            - Web, desktop, mobile, and external sharing
            - AI search and assistant experiences
        - label: Business workflows
          modules:
            - Reviews, approvals, e-signatures, and metadata actions
            - REST APIs and application integrations
        - label: Content services
          modules:
            - Versioning, preview, search, project folders, and lifecycle
        - label: Governance and security
          modules:
            - Classification, permissions, DLP, audit, and threat response
        - label: Hybrid access
          modules:
            - Smart Cache, synchronization, and supported file protocols
        - label: Storage and governed repositories
          modules:
            - Egnyte object storage and selected third-party content systems
    approximationNotes: "Conceptual layering only; it does not assert physical topology, service boundaries, throughput, or uniform control coverage across external repositories."
    claimRefs: [CE002, CE004, CE006, CE007, CE009, CE014]
callouts:
  - calloutType: risk
    title: Security incident evidence needs direct confirmation
    body: >-
      A breach-index entry records an INC_RANSOM claim dated May 8, 2026, but the
      assigned evidence contains no direct attacker post, company statement,
      regulator notice, forensic report, or independently corroborated impact.
      Treat it as a diligence lead and request incident-response evidence.
    claimRefs: [CE011]
