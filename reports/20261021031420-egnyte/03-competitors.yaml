      - Differentiation in assigned evidence
      - Limitation or open issue
    rows:
      - [Egnyte, "Governed content collaboration", "1,435 employees estimated as of March 2026; funding not established", "Regulated and complex-content organizations", "Hybrid migration, governance, security, AI, and industry workflows", "Private revenue, funding, and segment scale are not disclosed here"]
      - [Box, "Direct cloud-content peer", "2,990 employees in Revelio's peer list; funding not established", "Cloud-first teams needing governance", "Cloud governance and reported unlimited storage from Business tier", "Hybrid file-server capability is not established in assigned evidence"]
      - ["Microsoft OneDrive / SharePoint", "Suite incumbent", "Not established in assigned evidence", "Microsoft 365-standardized organizations", "Native suite bundling, identity, and productivity distribution", "Egnyte-comparable regulated-content depth is not established here"]
      - [Dropbox, "Ease-first cloud substitute", "Not established in assigned evidence", "Teams prioritizing familiar sync and simple adoption", "Reviewer-reported setup and usability advantage", "Governance and regulated-industry depth are not established here"]
      - ["Laserfiche / DocuWare / iManage", "Specialist ECM and document systems", "Not established in assigned evidence", "Records-heavy, workflow-heavy, or legal buyers", "Deeper records, process automation, or matter-centric specialization", "Higher complexity and comparable hybrid support remain unverified"]
      - ["On-premises file server / internal build", "Status quo and internal substitute", "Internal cost is organization-specific and not public", "Organizations retaining existing infrastructure", "Avoids a new SaaS control plane and migration", "Remote collaboration, governance, and security burden remains internal"]
    notes: >-
      Publicly accessible assigned sources provide only partial and non-comparable
      scale data; unknown funding, revenue, customer, and segment figures are not estimated.
    claimRefs: [CP001, CP003, CP013, CP015]
  - id: TP002
    title: Capability and buyer-criteria matrix
    columns:
      - Buying criterion
      - Egnyte
      - Box
      - Microsoft suite
      - Dropbox
      - Specialist ECM
    rows:
      - ["Cloud file collaboration", "Company-claimed core capability", "Supported by comparison evidence", "Supported through OneDrive / SharePoint", "Supported and reviewer-favored for usability", "Varies; not consistently established"]
      - ["Governance and security controls", "RBAC, DLP, Zero Trust, ransomware detection, residency, and audit controls claimed", "Governance and Box Shield reported", "Baseline suite controls; depth not compared", "Lighter governance reported", "Strong records controls reported for selected specialists"]
      - ["Hybrid / file-server migration", "Company claims cloud file-server replacement with familiar access", "Not established", "Not established", "Not established", "Varies; not established"]
      - ["Workflow and records depth", "Policy-driven workflows and lifecycle controls claimed", "Retention and governance reported", "Suite workflow available but not compared", "Not established", "Laserfiche and DocuWare positioned for deeper automation"]
      - ["Industry specialization", "AEC, financial services, life sciences, and media named", "Not established", "Not established", "Not established", "iManage is positioned for legal; other specialists vary"]
    notes: >-
      Cells summarize only the assigned source set. "Not established" means the
      capability was not supported by that evidence, not that the product lacks it.
    claimRefs: [CP001, CP003, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Reported list-price and packaging pressure
    columns:
      - Vendor or suite
      - Reported entry or comparison tier
      - Reported price
      - Included capacity or packaging
      - Diligence implication
    rows:
      - [Egnyte, "Business / Enterprise Lite / Elite", "$22 / $39 / $48 per user per month, annual", "100GB pooled on Business; 150GB reported on higher tiers", "Verify current list, storage overage, AI usage, and realized discounts"]
      - [Box, "Business Starter / Business / Business Plus", "$5 / $15 / $25 per user per month, annual", "100GB on Starter; unlimited storage reported on Business and above", "Tests willingness to pay for Egnyte's hybrid and industry controls"]
      - ["Microsoft 365", "Business Basic / Standard / Premium", "$7 / $23.50 / $32 per user per month, annual", "SharePoint bundled with Microsoft 365; pooled storage described", "Installed-suite distribution can lower incremental procurement friction"]
      - [Dropbox Business, "Standard / Advanced", "$15 / $24 per user per month", "3TB / 15TB starting team storage reported for three licenses", "Familiarity and storage can outweigh deeper governance for simpler use cases"]
    notes: >-
      All prices in this table come from a competitor-authored comparison rather
      than direct vendor pricing pages; currencies, taxes, overages, discounting,
      contract terms, and realized enterprise prices require vendor verification.
    claimRefs: [CP010, CP011, CP012]
figures:
  - id: FP001
    title: Competitive positioning by governance depth and adoption simplicity
    type: quadrant
    summary: >-
      Analyst ordinal placement shows Egnyte between easy-to-adopt suites and
      governance-heavy specialists, with its thesis resting on combining both.
    data:
      points:
        - label: Egnyte
          x: 4
          y: 3
          note: "High governance breadth; moderate adoption simplicity because user-review friction is mixed."
        - label: Box
          x: 4
          y: 4
          note: "Governance-oriented cloud peer with lower reported entry pricing."
        - label: "Microsoft OneDrive / SharePoint"
          x: 3
          y: 5
          note: "Suite distribution improves adoption; comparable specialist depth is not established."
        - label: Dropbox
          x: 2
          y: 5
          note: "Reviewer evidence favors setup and usability; governance depth is lighter in the comparison."
        - label: "Laserfiche / DocuWare / iManage"
          x: 5
          y: 2
          note: "Specialist records or workflow depth, with more complexity and narrower use-case fit."
        - label: "On-premises file server / internal build"
          x: 1
          y: 2
          note: "Avoids migration but leaves collaboration, governance, and security burden internal."
    approximationNotes: >-
      Both axes use a 1-5 analyst ordinal: x is governance/workflow specialization
      and y is adoption/distribution simplicity. Scores synthesize qualitative
      assigned evidence, are not vendor benchmarks, and should not be read as
      measured performance differences.
    claimRefs: [CP016]
