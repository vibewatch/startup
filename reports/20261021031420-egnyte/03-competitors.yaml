  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: >-
        Current direct vendor price sheets, storage-overage schedules, AI usage charges,
        discount bands, and realized enterprise contract prices for Egnyte and peers.
      whyItMatters: >-
        Competitor-issued list-price comparisons cannot establish effective customer
        cost or renewal leverage.
      diligencePath: >-
        Obtain current vendor quotes for matched seat, storage, security, workflow,
        and support configurations and normalize them to annual contract value.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: scale
      missingEvidence: >-
        Comparable revenue, growth, customer mix, funding, win rate, and segment-level
        scale for Egnyte and the private specialist competitors.
      whyItMatters: >-
        Headcount alone does not show commercial momentum, share, or capacity to fund
        product and distribution.
      diligencePath: >-
        Request Egnyte's competitive win-loss pack and segment metrics, then obtain
        management or investor materials for the named private competitors.
      relatedQuestionRefs: [QP002]
      relatedTableRefs: [TP001]
    - type: missing-source
      severity: material
      topic: switching
      missingEvidence: >-
        Quantified migration effort, customer multi-homing, renewal retention,
        integration dependency, and time-to-value by competitor.
      whyItMatters: >-
        Product breadth does not establish durable lock-in without evidence of
