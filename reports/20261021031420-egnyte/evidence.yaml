evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: >-
      Verified founder identities, current founder roles and ownership, executive biographies, succession planning, and
      key-person retention terms.
    whyItMatters: >-
      These records determine founder-market fit, management continuity, and dependence on specific executives after the
      sponsor investment.
    diligencePath: >-
      Request the management presentation, capitalization table, executive biographies, employment agreements, retention
      plan, and succession materials.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: >-
      February 2025 transaction consideration, valuation, sponsor stakes, rollover equity, preference stack, debt, board
      rights, and reserved matters.
    whyItMatters: Deal economics and control rights determine the current capital structure, governance, and return constraints.
    diligencePath: >-
      Obtain the purchase agreement, capitalization table, debt documents, investor rights agreement, and current board
      materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      Audited revenue and ARR bridge, current payroll headcount, customer definition, retention, concentration, gross
      margin, and cash-flow data.
    whyItMatters: >-
      The available figures mix revenue with ARR and use inconsistent employee estimates, preventing a reliable current
      scale and quality-of-revenue assessment.
    diligencePath: >-
      Reconcile audited financial statements, monthly ARR schedules, payroll records, CRM cohorts, retention waterfalls,
      and customer concentration reports.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: access-blocked
    severity: minor
    topic: security
    missingEvidence: >-
      The underlying UpGuard rating, category-level checks, dated findings, remediation status, and corroborating
      incident records.
    whyItMatters: A monitoring methodology without results cannot establish either a weakness or the absence of incidents.
    diligencePath: >-
      Obtain the full vendor-risk report and corroborate material findings with Egnyte's trust materials, incident
      records, and customer security reviews.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: Complete investor history, capitalization table, customer concentration, and contractual partner economics.
    whyItMatters: The public stakeholder map cannot establish economic ownership, dependency, or concentration.
    diligencePath: Request the capitalization table, investor ledger, top-customer schedule, and material partnership agreements.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A credible spend-based category estimate, Egnyte pricing and ACV distribution, eligible-account counts, and
      vertical or geographic revenue mix.
    whyItMatters: >-
      Without common-denominator spend and buyer evidence, TAM, SAM, SOM, penetration, and market-share assumptions
      cannot be calculated defensibly.
    diligencePath: >-
      Obtain management's market model and cohort-level ACV data, then triangulate it against an independent analyst
      category taxonomy and public peer disclosures.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyers
    missingEvidence: Win-loss data, procurement-cycle duration, buyer roles, implementation time, and budget source by vertical.
    whyItMatters: >-
      The public product evidence supports a buyer hypothesis but not adoption speed, sales friction, or budget
      displacement.
    diligencePath: >-
      Review CRM win-loss records and interview recent customers, churned accounts, implementation partners, and
      security reviewers.
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: customer-scale
    missingEvidence: >-
      A consistent definition reconciling more than 22,000 enterprise customers in February 2025 with more than 23,000
      customers or businesses in September-October 2026.
    whyItMatters: >-
      The figures are directionally consistent but do not establish net additions, retention, segment mix, or comparable
      period-over-period growth.
    diligencePath: >-
      Request dated customer-count definitions, gross additions, churned logos, and segment or geography splits from
      management.
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current direct vendor price sheets, storage-overage schedules, AI usage charges, discount bands, and realized
      enterprise contract prices for Egnyte and peers.
    whyItMatters: Competitor-issued list-price comparisons cannot establish effective customer cost or renewal leverage.
    diligencePath: >-
      Obtain current vendor quotes for matched seat, storage, security, workflow, and support configurations and
      normalize them to annual contract value.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: scale
    missingEvidence: >-
      Comparable revenue, growth, customer mix, funding, win rate, and segment-level scale for Egnyte and the private
      specialist competitors.
    whyItMatters: Headcount alone does not show commercial momentum, share, or capacity to fund product and distribution.
    diligencePath: >-
      Request Egnyte's competitive win-loss pack and segment metrics, then obtain management or investor materials for
      the named private competitors.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: switching
    missingEvidence: >-
      Quantified migration effort, customer multi-homing, renewal retention, integration dependency, and time-to-value
      by competitor.
    whyItMatters: >-
      Product breadth does not establish durable lock-in without evidence of retained workflows and measurable
      replacement cost.
    diligencePath: >-
      Interview recent wins, losses, and churned customers and compare migration plans, implementation hours, connector
      use, and post-deployment renewal data.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: access-blocked
    severity: minor
    topic: external-security-evidence
    missingEvidence: UpGuard's actual Egnyte security score, check-level findings, trend, and a normalized peer comparison.
    whyItMatters: >-
      The public methodology description confirms monitoring but does not validate Egnyte's relative external security
      posture.
    diligencePath: >-
      Obtain the full vendor-risk report and compare the same check set and date against Box, Microsoft, Dropbox, and
      selected specialist ECM vendors.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: private-financials
    missingEvidence: Audited revenue, ARR bridge, revenue growth, gross margin, and revenue-recognition policy.
    whyItMatters: These metrics determine scale, recurring quality, and whether services or infrastructure dilute software margins.
    diligencePath: Obtain three years of audited statements plus monthly ARR, billings, deferred revenue, and gross-margin schedules.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-efficiency
    missingEvidence: NRR, gross retention, logo churn, CAC, sales-cycle duration, and CAC payback by segment.
    whyItMatters: Without cohort and acquisition economics, subscription durability and GTM efficiency cannot be underwritten.
    diligencePath: Review monthly customer cohorts, pipeline conversion, sales compensation, and fully loaded acquisition cost.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, operating cash flow, burn, runway, debt schedule, covenants, and financing plan.
    whyItMatters: Funding raised is not cash available, and liquidity determines financing dependency and downside protection.
    diligencePath: >-
      Obtain current bank statements, monthly cash-flow forecasts, debt agreements, covenant calculations, and board
      financing plan.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized price per seat, discounting, storage overages, support attach, services fees, and renewal uplift.
    whyItMatters: Public list prices cannot establish ACV, pricing power, customer TCO, or revenue quality.
    diligencePath: Sample signed order forms and analyze bookings, discounts, add-ons, renewals, and concessions by tier and cohort.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue concentration by customer, vertical, geography, channel, and product tier.
    whyItMatters: Vertical focus may support pricing but can also create correlated renewal and cyclicality risk.
    diligencePath: Review top-customer schedules and revenue mix with retention and gross margin for each segment.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: missing-source
    severity: material
    topic: classification-performance
    missingEvidence: >-
      A reproducible current benchmark for classification throughput, accuracy, workload composition, and infrastructure
      assumptions.
    whyItMatters: The 2023 company claim cannot establish present performance or deployment capacity without a defined test design.
    diligencePath: >-
      Request benchmark methodology and run a representative proof of concept against the buyer's file mix and
      repository topology.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: ransomware-claim
    missingEvidence: >-
      Direct and independently corroborated evidence of the May 2026 INC_RANSOM claim, scope, affected systems, data
      impact, and remediation.
    whyItMatters: >-
      A low-reputation breach index is not sufficient to establish that an Egnyte compromise occurred or affected
      customer content.
    diligencePath: >-
      Request Egnyte's incident statement, forensic timeline, insurer or regulator notices, customer communications, and
      corrective-action evidence.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Current independently verifiable uptime, latency, recovery performance, support-response data, and status-history
      evidence.
    whyItMatters: Mission-critical content workflows depend on operational performance that feature documentation cannot prove.
    diligencePath: >-
      Review SLA and status history, sample support tickets, disaster-recovery tests, RTO/RPO evidence, and
      reference-customer operating data.
    relatedQuestionRefs:
      - QE004
      - QE009
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer-signal proxy such as accessible API documentation, SDK or package activity, release history,
      repository activity, or practitioner implementation evidence.
    whyItMatters: >-
      The assigned pool documents APIs and integrations but does not reveal ecosystem traction, release cadence, or
      implementation quality.
    diligencePath: >-
      Obtain the developer portal and changelog, inspect SDK and connector ownership, and interview implementation
      partners about API stability.
    relatedQuestionRefs:
      - QE004
      - QE009
  - type: private-evidence-only
    severity: material
    topic: ai-performance
    missingEvidence: >-
      Benchmark design, baseline, sample size, task mix, error definition, and independent replication for the claimed
      94% AI-answer accuracy uplift.
    whyItMatters: The marketing percentage cannot be compared or underwritten without its denominator and evaluation method.
    diligencePath: >-
      Request the evaluation report and reproduce the test on permissioned customer content with predefined accuracy and
      leakage criteria.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Customer-level and cohort-level NRR, GRR, gross churn, renewal rate, contract term, and seat-expansion data.
    whyItMatters: Selected customer outcomes cannot establish revenue durability or the consistency of land-and-expand behavior.
    diligencePath: >-
      Request the last eight quarters of cohort retention, logo churn, renewal, seat expansion, and contract-duration
      schedules from management.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-10 customer and vertical revenue shares, contract values, renewal dates, and channel-attributed revenue.
    whyItMatters: A broad logo and case-study set does not rule out material customer, vertical, or channel concentration.
    diligencePath: >-
      Obtain anonymized customer revenue concentration and renewal calendars segmented by vertical, geography, size, and
      channel.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: minor
    topic: named-customers
    missingEvidence: A complete current customer roster with deployment status, contract scope, and independently confirmed outcomes.
    whyItMatters: >-
      Public case studies are selected success stories and cannot measure the production share or failed-deployment
      rate.
    diligencePath: >-
      Reconcile CRM and billing exports to the public named-customer sample and interview a stratified set of current
      and churned customers.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: security-incident-claim
    missingEvidence: >-
      Primary incident notice, forensic report, regulator filing, or company response confirming or refuting the May
      2026 ransomware-group claim and any customer impact.
    whyItMatters: >-
      An unverified tracker entry can affect procurement perception but does not establish a breach, affected
      population, or retention impact.
    diligencePath: >-
      Request Egnyte's incident record and customer notices, then corroborate with regulators, affected customers, and
      an independent forensic report.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: alleged-incident
    missingEvidence: >-
      A primary Egnyte, regulator, insurer, court, forensic, or affected-customer record confirming or disproving the
      May 2026 ransomware claim and defining its scope.
    whyItMatters: >-
      Incident occurrence, affected data, notification duties, remediation quality, and customer impact drive the
      chapter's highest potential severity.
    diligencePath: >-
      Request the incident register, forensic report, board and insurer notices, regulator correspondence, customer
      notifications, containment timeline, and remediation tests.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: compliance
    missingEvidence: >-
      Current SOC reports and bridge letters, certification scopes, penetration-test summaries, control exceptions,
      subprocessor inventory, DPA terms, and remediation logs.
    whyItMatters: >-
      Product marketing and a low-reputation profile do not independently establish that controls cover the relevant
      products, regions, and regulated customer workflows.
    diligencePath: >-
      Review the trust-center data room with security leadership and trace every material exception to an owner,
      deadline, retest, and customer disclosure.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited revenue and ARR reconciliation, bookings, gross margin, cash flow, retention, churn, customer
      concentration, contract duration, and debt or preference obligations.
    whyItMatters: >-
      A low-reputation ARR estimate cannot establish revenue quality, cash availability, downside resilience, or the
      capital required to manage an adverse event.
    diligencePath: >-
      Reconcile audited statements to monthly recurring-revenue schedules, cohort retention, invoices, deferred revenue,
      cash, debt, and board-approved forecasts.
    relatedQuestionRefs:
      - QR005
  - type: missing-source
    severity: material
    topic: platform-dependency
    missingEvidence: >-
      Connector-level workload and revenue concentration, API and identity dependencies, incident histories, contractual
      SLOs, fallback procedures, and recovery test results.
    whyItMatters: >-
      Named integrations establish ecosystem breadth but do not show the impact of a counterparty outage, policy change,
      degraded API, or permission-model change.
    diligencePath: >-
      Obtain the dependency inventory and rank connectors by active users, content volume, revenue exposure, outage
      minutes, change incidents, and tested substitution time.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited current revenue, ARR reconciliation, growth, gross margin, net retention, churn, and customer
      concentration.
    whyItMatters: These metrics determine whether any recurring-revenue multiple and target return are supportable.
    diligencePath: >-
      Obtain audited statements, monthly recurring-revenue bridges, cohort retention schedules, and customer
      concentration reports.
    relatedQuestionRefs:
      - QV003
      - QV004
      - QV007
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
  - type: conflicting-data
    severity: material
    topic: transaction-terms
    missingEvidence: >-
      Signed February 2025 transaction documents, fully diluted capitalization, ownership split, debt, and preference
