  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Egnyte was founded in 2008 and is headquartered in Mountain View, California. Its current positioning is
              broader than basic file sharing: the company describes one content platform combining collaboration,
              intelligence, governance, security, workflow automation, and integrations for mission-critical
              unstructured content. That framing points to a subscription software business aimed at organizations that
              need both employee productivity and centralized control, especially where large files, regulated data, or
              industry-specific workflows make generic storage less suitable. The current company page reports more than
              23,000 customers, and LeadIQ repeats that scale while identifying AEC, financial services, and life
              sciences as served verticals. Scale figures require careful period and metric labeling. Deep Analysis
              reported more than 22,000 customers and 1,100 employees in May 2025, while IncFact's October 2026 profile
              places employment in a 500-1,000 band. Those observations may reflect different dates or estimation
              methods, so they should not be collapsed into a single precise current headcount.
