      - number: '1.3'
        title: Milestones and evidence quality
        blocks:
          - type: paragraph
            body: >-
              The available chronology shows a company that expanded from file infrastructure into governance,
              compliance, AI, and sponsor-backed scale. Egnyte's official history records Object Store in 2011, an
              AI-powered data-governance solution in 2016, a secure enclave for life-sciences compliance in 2020, and
              both Microsoft CSPP+ status and generative-AI assistants in 2023. Deep Analysis places the Goldman
              Sachs-led Series E in 2018 and the GI/TA majority investment in February 2025. ARR Club then labels August
              2025 as a $300 million ARR milestone, but its fetched page does not provide source documents or a
              methodology, so that figure remains third-party reported rather than audited. This is not interchangeable
              with Deep Analysis's approximate $250 million-plus annual-revenue figure. IncFact supplies only a broad
              estimated revenue range and explicitly calls private-company revenue a statistical evaluation. UpGuard
              confirms continuous external monitoring of Egnyte but exposes neither a rating nor findings in the fetched
              public text; it therefore supports a diligence path, not a conclusion about breach history or current
              security quality.
