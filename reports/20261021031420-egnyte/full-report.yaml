  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Expansion can progress from infrastructure replacement to governed workflows, wider collaboration, and product
      feedback, but public retention metrics do not confirm how consistently customers complete the journey.
    data:
      items:
        - title: Replace fragmented infrastructure
          label: Replace fragmented infrastructure
          detail: Move from file servers, VPNs, or point tools into a governed content layer.
          touchpoints:
            - IT evaluation
            - Security review
            - Migration planning
        - title: Migrate operational content
          label: Migrate operational content
          detail: Transfer large repositories while preserving access patterns and permissions.
          touchpoints:
            - Professional services
            - Storage Sync
            - Permissions
        - title: Embed existing workflows
          label: Embed existing workflows
          detail: Connect Microsoft 365, Google Workspace, Salesforce, and industry applications.
          touchpoints:
            - Integrations
            - REST APIs
            - Desktop access
        - title: Expand collaborators and sites
          label: Expand collaborators and sites
          detail: Add field teams, external partners, acquired offices, and regulated users.
          touchpoints:
            - External sharing
            - Mobile access
            - Role-based permissions
        - title: Add governance and intelligence
          label: Add governance and intelligence
          detail: Layer security, compliance, search, automation, and AI over governed content.
          touchpoints:
            - Audit trails
            - Sensitive-data controls
            - AI workflows
        - title: Feed usage back into product
          label: Feed usage back into product
          detail: Collect requests through portals, support, NPS, and customer-success teams.
          touchpoints:
            - Productboard Portal
            - Zendesk
            - NPS surveys
    approximationNotes: >-
      The sequence is an analytical journey assembled from public workflow evidence; it is not a measured funnel, and no
      conversion or retention rates are implied.
    claimRefs:
      - CU003
      - CU010
      - CU011
      - CU012
      - CU015
      - CU016
  - id: FR001
    title: Residual-risk priority matrix
    type: matrix
    summary: >-
      Evidence-qualified prioritization separates high-impact uncertainty from observed but narrower operational and
      commercial signals.
    data:
      columns:
        - label: Likelihood
          detail: Observed, possible, or unknown based on retained evidence
        - label: Impact
          detail: Potential underwriting consequence if the risk materializes
        - label: Mitigation maturity
          detail: Publicly evidenced mitigation strength
        - label: Residual severity
          detail: Priority after considering available mitigation evidence
      rows:
        - label: Cyber incident ambiguity
          note: Breach listing is not primary confirmation
          values:
            - Possible
            - Critical
            - Claimed controls; event response unverified
            - High
        - label: Large-file reliability
          note: One accessible user report; prevalence is unknown
          values:
            - Observed in one review
            - High for large-file workflows
            - Product capability claimed; stress data absent
            - Medium-high
        - label: Contract and support friction
          note: BBB does not verify third-party complaint accuracy
          values:
            - Plausible
            - Moderate
            - No response evidence in pool
            - Medium
        - label: Financial-model opacity
          note: ARR and growth are single-source third-party claims
          values:
            - Confirmed evidence gap
            - High for underwriting
            - No audited evidence in pool
            - High
        - label: External attack-surface validation
          note: Monitoring methodology is visible but the resulting score is not
          values:
            - Unknown
            - High if critical findings exist
            - Continuous external checks described
            - Medium
        - label: Integration dependency
          note: Connector usage, concentration, and fallback evidence are unavailable
          values:
            - Plausible
            - High for core workflows
            - Open APIs and centralized controls claimed
            - Medium-high
    approximationNotes: Categories are qualitative and evidence-bounded; they are not probabilities or a numerical risk score.
    claimRefs:
      - CR005
      - CR009
      - CR010
      - CR011
      - CR014
      - CR016
