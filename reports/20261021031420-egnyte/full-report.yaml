      - number: '1.2'
        title: Ownership, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The most consequential ownership milestone is the February 2025 majority investment by GI Partners and TA
              Associates. Deep Analysis describes it as a majority investment but does not disclose consideration,
              post-money valuation, preference terms, debt, rollover ownership, or the sponsors' exact stakes. It also
              reports $137.5 million raised since founding and identifies a Goldman Sachs-led Series E in 2018 as the
              last conventional funding round before the private-equity transaction. Egnyte's current leadership page
              shows functional coverage across technology, finance, operations, product, security, engineering, revenue,
              growth, and marketing under CEO Vineet Jain. Its board list is dominated by named representatives of TA
              and GI Partners, making sponsor governance and management continuity central diligence topics. The fetched
              evidence does not establish founder identities, founder ownership, voting arrangements, reserved matters,
              or succession plans; those omissions prevent a definitive assessment of founder-market fit and key-person
              dependence.
            claimRefs:
              - CO010
