  - id: FM001
    title: Evidence ladder for Egnyte's addressable market
    type: pyramid
    summary: A qualitative reach hierarchy separates disclosed installed-base proof from broader, unquantified addressability.
    data:
      items:
        - label: Disclosed installed base
          value: 23,000+ customers / businesses
          detail: Company disclosure as of September-October 2026; not ARR or market spend.
        - label: Core jobs
          value: Collaborate, govern, secure
          detail: Mission-critical unstructured content and document workflows.
        - label: High-fit organizations
          value: Regulated or content-intensive
          detail: Organizations balancing external collaboration with centralized control.
        - label: Named vertical focus
          value: AEC, life sciences, financial services
          detail: Verticals repeatedly identified in company and investor materials.
        - label: Planned expansion
          value: Additional verticals and international markets
          detail: Growth direction stated in the February 2025 investor releases.
        - label: AI adjacency
          value: Governed search, automation, and agents
          detail: Potential expansion surface without a disclosed spend denominator.
