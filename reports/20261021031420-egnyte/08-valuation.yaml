    notes: "Views are analytical inferences from public third-party and company-issued evidence; no audited current financials or signed transaction documents were available in the assigned evidence."
    claimRefs: [CV001, CV002, CV003, CV004, CV010, CV011, CV013, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, "Unified collaboration, governance, security, compliance, API, workflow, and AI positioning.", "Independent customer retention and expansion evidence would strengthen durability."]
      - [Thesis, "GI Partners and TA Associates are reported as majority owners after the 2025 investment.", "Disclosure of governance, leverage, and a credible exit path would improve readiness."]
      - [Anti-thesis, "Public transaction values conflict between approximately $1.5B and $2.9B.", "Signed transaction documents and a fully diluted capitalization table would resolve the benchmark."]
      - [Anti-thesis, "AI outcome metrics and public security-monitoring text lack enough methodology or results for underwriting.", "A reproducible AI study and complete independent security report would reduce evidence risk."]
    notes: "Company-issued product and AI statements establish positioning, not independent validation; financing values come from third-party databases rather than primary transaction filings."
    claimRefs: [CV003, CV004, CV007, CV008, CV009, CV010, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "The $1.5B reported mark is applicable; recurring revenue is near the cited $250M estimate; growth and retention are durable.", "A roughly 5x-6x recurring-revenue reference could be supportable only after metric and capital-structure verification.", "Estimated ARR may differ from revenue; preferences or debt may absorb equity value.", "Weak until audited metrics and transaction terms are produced."]
      - [Base, "Platform relevance persists, but current financials and transaction economics remain private.", "No defensible target return or exit value; maintain a watchlist and negotiate against verified metrics.", "Disclosure gaps persist and comparable selection remains broad.", "Strongest current signal because the decisive inputs are absent or conflicting."]
      - [Bear, "The $2.9B reported price or 11.8x multiple is the effective benchmark and software multiples compress.", "Downside rises if growth does not exceed the cited public-company references or if security trust weakens.", "Unverified incident claims, unanswered complaints, and weak retention evidence compound multiple risk.", "Material if primary diligence validates the higher entry mark or a significant unresolved incident."]
    notes: "Scenario labels are conditional frameworks, not probability estimates or forecasts; revenue, ARR, equity value, and enterprise value are not treated as interchangeable."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV011, CV012, CV013, CV014, CV015]
