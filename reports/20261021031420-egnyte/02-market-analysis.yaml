      - "Limitation"
    rows:
      - ["TA Associates and GI Partners / Feb. 2025", "Global", "More than 22,000 enterprise customers", "Company scale disclosed in syndicated investor transaction releases", "Medium", "Partner-issued company figure; no ARPU, definition, or market denominator"]
      - ["Egnyte / Sep. 2026", "Global", "More than 23,000 customers", "Current company disclosure in an IDC recognition release", "Medium", "Company-issued and not a spend estimate"]
      - ["Egnyte landing page / accessed Oct. 2026", "Global", "23,000+ businesses", "Current marketing disclosure of installed-base reach", "Medium", "Definition may differ from enterprise-customer wording"]
      - ["Tracxn / accessed Oct. 2026", "Not specified", "1,301 active competitors", "Database-defined competitive-set count", "Low", "Broad set includes adjacencies; not market revenue or addressable accounts"]
    notes: >-
      Values retain each publisher's metric name and period; none is converted into TAM,
      SAM, SOM, revenue, ARR, or spend because pricing and denominator evidence is absent.
    claimRefs: [CM007, CM008, CM011, CM014, CM015]
