      - ["Life sciences", "IT and informatics leadership", "Scientists, clinical or quality teams, and external research partners", "Enterprise", "Controlled exchange and retrieval of regulated research content", "IT with quality / compliance influence", "Auditability, sensitive-data controls, and external collaboration"]
      - ["Financial services", "CIO / security leadership", "Advisers, operations, compliance, and external counterparties", "Enterprise", "Secure document collaboration, retention, and discovery", "IT / security with compliance influence", "Governance requirements and AI over permissioned content"]
      - ["Horizontal content-intensive enterprise", "CIO / IT leader", "Employees, business operations, and external collaborators", "Enterprise", "Cloud file access, workflow automation, and content search", "IT or applications", "Consolidation, remote access, and integration with existing applications"]
    notes: >-
      Buyer, payer, and budget-owner assignments are evidence-based inferences from the
      product's controls, integrations, and named users; no retained source discloses procurement roles.
    claimRefs: [CM003, CM004, CM005, CM006]
