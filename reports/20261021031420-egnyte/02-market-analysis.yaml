    notes: >-
      Boundary is an analyst synthesis of Egnyte's product descriptions and company-issued
      IDC excerpts; excluded spend is not quantified and does not imply products cannot compete.
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
