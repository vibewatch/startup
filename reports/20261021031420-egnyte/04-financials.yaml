    rows:
      - [Core subscription, Annual named-user license, User per month billed annually, Published list prices, Recurring but realized price unknown, Contracted seats and realized price by cohort]
      - [Governance and security tiers, Higher-priced feature packaging, User per month, Tier features and list prices published, Recurring upsell potential but mix unknown, ARR and gross retention by tier]
      - [AI and workflow capability, Elite or custom-tier packaging, User per month or custom quote, Feature availability published, Expansion potential not quantified, Attach rate and incremental gross margin]
      - [Storage and premium support, Contract-specific add-on or overage, TB and support tier, Independent guides describe variable charges, Potentially recurring but terms are opaque, Included capacity overage rates and support mix]
      - [Migration and professional services, Project or statement-of-work fees, Deployment, Pricing not publicly disclosed, Likely non-recurring and services-intensive, Services revenue mix utilization and delivery margin]
    notes: >-
      Mechanisms are synthesized from official product/pricing pages and independent
      procurement sources; realized prices, mix, recognition policy, and margins are unavailable.
    claimRefs: [CI004, CI009, CI010]
  - id: TI002
    title: Public pricing and packaging snapshot
    columns:
      - Plan
      - Current public list price
      - Contract basis
      - Public scope
      - Realized-pricing status
    rows:
      - [Team, "$10/user/month", Annual billing, One to ten users and limited governance, Unknown]
      - [Business, "$22/user/month", Annual billing, Up to 100 users with basic protection, Unknown]
      - [Enterprise Lite, "$39/user/month", Annual billing with reported multi-year discounts, Unlimited users and expanded governance, Unknown]
      - [Elite, "$48/user/month", Annual billing, AI workflow and advanced control features, Unknown]
      - [Ultimate, Custom quote, Negotiated, Advanced governance classification and recovery, Unknown]
    notes: >-
      PCMag's current figures are used for the snapshot; a March 2026 independent
      guide listed Enterprise Lite at $38 and Elite at $46, and no source discloses realized discounts.
    claimRefs: [CI001, CI002, CI003]
  - id: TI003
    title: Unit economics and underwriting gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Annual revenue, "$100M-$500M statistical range", Low, Establishes only a broad scale envelope, Audited revenue and recognition policy]
      - [ARR, null, Unavailable, Separates recurring run-rate from accounting revenue, ARR bridge to billed and recognized revenue]
      - [Revenue growth, null, Unavailable, Tests expansion and market momentum, Monthly revenue and ARR for three years]
      - [Gross margin, null, Unavailable, Tests software economics and service burden, Gross margin by subscription storage and services]
      - [NRR and churn, null, Unavailable, Tests revenue durability and expansion, Logo and dollar retention by cohort and tier]
      - [CAC and payback, null, Unavailable, Tests GTM efficiency, Fully loaded CAC sales cycle and payback by segment]
      - [Cash burn runway and debt, null, Unavailable, Determines financing dependency, Current cash cash-flow statements debt schedule and covenants]
    notes: >-
      Null means no usable value appeared in the assigned prefetched public evidence;
      the revenue band is an IncFact statistical evaluation, not audited company disclosure.
    claimRefs: [CI005, CI006, CI007, CI008, CI016]
