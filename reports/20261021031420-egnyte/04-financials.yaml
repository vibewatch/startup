schemaVersion: "report-v2"
artifact: financials
slug: egnyte
runDate: "2026-10-21"
company:
  name: Egnyte
chapter:
  number: 4
  title: Financials
  summary: >-
    Egnyte exposes a clear annual, per-user pricing ladder, but not the realized
    pricing, revenue mix, margins, retention, cash, or burn needed for full
    underwriting. Independent pricing and revenue ranges are useful only as
    low-confidence procurement and scale proxies, not as audited company metrics.
sections:
  - id: revenue-model
    title: Revenue model and pricing architecture
    body: >-
      Egnyte's observable commercial model is an annually billed, per-user
      subscription with higher prices attached to governance, security, workflow,
      and AI capability. PCMag reports Team at $10 per user per month for one to
      ten users, Business at $22, Enterprise Lite at $39, Elite at $48, and
      Ultimate on custom quote. The product and pricing pages support the
      underlying tier-and-feature architecture, while independent procurement
      sources identify storage, support, migration, and implementation as
      additional cost variables. This makes list subscription value a useful
      starting point, not a proxy for realized annual contract value or recognized
      revenue. A March 2026 guide listed slightly lower Enterprise Lite and Elite
      prices, so all pricing analysis should be date-stamped and reconciled to a
      current order form.
    claimRefs: [CI001, CI002, CI003, CI004, CI009, CI010]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Public traction and unit-economics limits
    body: >-
      Public scale evidence is too imprecise for an operating model. IncFact
      places annual revenue in a broad $100 million to $500 million band and
      explicitly labels private-company revenue as a statistical evaluation.
      Vendr publishes deployment-spend ranges, but those are buyer-side estimates
      rather than Egnyte revenue, ARR, or bookings. None of the assigned current
      sources discloses audited revenue, ARR, year-over-year growth, gross margin,
      net retention, churn, CAC, payback, sales-cycle duration, or revenue
      concentration. The absence is financially consequential: investors cannot
      distinguish durable subscription expansion from price increases, storage
      growth, services work, or mix shift. The correct underwriting posture is to
      preserve these fields as unavailable and request cohort and margin evidence
      directly.
    claimRefs: [CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: cost-structure-and-efficiency
    title: Cost structure and sales-efficiency proxies
    body: >-
      The strongest public cost signals sit on the customer side, not Egnyte's
      income statement. Egnyte frames value around IT cost avoidance,
      productivity, and risk reduction, and markets platform consolidation as a
      way to reduce systems under management. Those are company-issued value
      propositions, not proof of Egnyte's gross margin or customer ROI. Vendr
      estimates that implementation, storage overages, true-ups, and training can
      add 20% to 40% to base subscription cost, while PCMag documents migration
      limitations and slow classification or AI workflows that can increase
      deployment effort. These observations suggest professional-services and
      support intensity may vary materially by account, but they do not reveal
      delivery cost, channel economics, CAC, or payback.
    claimRefs: [CI004, CI005, CI011, CI012, CI014, CI015]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The assigned evidence contains no current cash balance, burn rate, runway,
      debt balance, credit-facility terms, planned use of funds, or next-round
      trigger. Funding raised elsewhere should not be treated as cash available,
      and the wide third-party revenue range cannot close the liquidity gap.
      Egnyte's vertical focus across regulated and content-intensive industries
      supports premium packaging and potential switching costs, but revenue
      quality remains unverified without contract, renewal, cohort, and margin
      data. The financial verdict is therefore mixed: pricing power is plausible
      and the recurring mechanism is legible, yet margin path, sales efficiency,
      concentration, and capital adequacy are not publicly underwritable. A data
      room review of audited statements, billing cohorts, deferred revenue, debt,
      and cash is a prerequisite to conviction.
    claimRefs: [CI013, CI016, CI008, CI009, CI010]
callouts:
  - calloutType: insight
    title: Pricing is a moving diligence input
    body: >-
      A March 2026 independent guide listed Enterprise Lite and Elite below the
      later prices reported by PCMag, so modeled contract values should use a
      dated order form rather than a cached pricing benchmark.
    claimRefs: [CI003]
  - calloutType: risk
    title: Liquidity cannot be inferred from funding or revenue estimates
    body: >-
      No assigned source discloses current cash, burn, runway, or debt terms, and
      the only public revenue range is explicitly statistical.
    claimRefs: [CI007, CI016]
