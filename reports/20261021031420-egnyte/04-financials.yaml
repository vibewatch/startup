        - id: customer-need
          label: Regulated or content-intensive customer need
          detail: Collaboration, governance, security, and industry workflow requirements.
        - id: tier-selection
          label: Tier and feature selection
          detail: Business, Enterprise Lite, Elite, or custom Ultimate packaging.
        - id: contracted-users
          label: Contracted named users
          detail: Per-user list pricing is the primary observable unit.
        - id: annual-commitment
          label: Annual subscription commitment
          detail: Published plans are billed annually.
        - id: contract-adjustments
          label: Storage, support, discount, and term adjustments
          detail: Contract-specific variables are not fully public.
        - id: services
          label: Migration and professional services
          detail: One-time implementation scope may add customer cost.
        - id: recognized-economics
          label: Recognized revenue and gross profit
          detail: Mix, recognition policy, and gross margin are not disclosed.
    approximationNotes: >-
      Conceptual mechanism only; node order does not represent magnitude,
      conversion rate, timing, or a quantified revenue bridge.
    claimRefs: [CI002, CI009, CI010, CI012]
