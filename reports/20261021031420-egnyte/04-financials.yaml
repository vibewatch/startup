      topic: realized-pricing
      missingEvidence: Realized price per seat, discounting, storage overages, support attach, services fees, and renewal uplift.
      whyItMatters: Public list prices cannot establish ACV, pricing power, customer TCO, or revenue quality.
      diligencePath: Sample signed order forms and analyze bookings, discounts, add-ons, renewals, and concessions by tier and cohort.
      relatedQuestionRefs: [QI001, QI002, QI003]
      relatedTableRefs: [TI001, TI002]
