      - [BridgeBio, "Regulated-user deployment", "More than 200 GxP users", "Date not stated", "Derivative customer-story summary", "No total employee denominator or renewal evidence"]
      - [Alta Planning + Design, "Annual savings", "More than $220,000 per year", "Date not stated", "Two case-study aggregators repeat the outcome", "Methodology, cost baseline, and audited support are unavailable"]
    notes: >-
      Values retain the source metric names and denominators. Dates are unavailable
      in the fetched assigned evidence, and the rows are not comparable stages of a
      common population.
    claimRefs: [CU004, CU005, CU006, CU007, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - [Red Bull, "Consumer brand / global enterprise", "Global file sharing and collaboration", "Production-scale use reported", "More than 20,000 users across 170 countries", "No direct customer filing, contract data, or current active-use rate"]
      - [Engineering Systems Inc., "Engineering and legal services", "Unified project data and AI knowledge bases", "Production-scale repository reported", "500 TB across 20,000 active projects", "Outcome is an aggregator summary of customer-story evidence"]
      - [BridgeBio, "Life sciences", "GxP content management and subsidiary collaboration", "Production deployment reported", "More than 200 GxP users; Part 11 compliance in three months", "No audit report, renewal data, or current seat count"]
      - [Alta Planning + Design, "Design and planning", "Distributed-office collaboration and version control", "Production use reported", "More than $220,000 annual savings", "Savings methodology and contract economics are not public"]
    notes: >-
      This is a sample of named deployments visible in the assigned prefetched
      evidence, not an exhaustive customer list. Production status is inferred only
      where the source describes broad operational use rather than a trial.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative named deployments with quantified scale or outcomes in the
        assigned official and case-study sources reviewed on 2026-10-21.
    claimRefs: [CU001, CU002, CU004, CU006, CU007, CU008, CU009]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Expansion can progress from infrastructure replacement to governed workflows,
      wider collaboration, and product feedback, but public retention metrics do not
      confirm how consistently customers complete the journey.
    data:
      items:
        - title: Replace fragmented infrastructure
          label: Replace fragmented infrastructure
          detail: "Move from file servers, VPNs, or point tools into a governed content layer."
          touchpoints: ["IT evaluation", "Security review", "Migration planning"]
        - title: Migrate operational content
          label: Migrate operational content
          detail: "Transfer large repositories while preserving access patterns and permissions."
          touchpoints: ["Professional services", "Storage Sync", "Permissions"]
        - title: Embed existing workflows
          label: Embed existing workflows
          detail: "Connect Microsoft 365, Google Workspace, Salesforce, and industry applications."
          touchpoints: ["Integrations", "REST APIs", "Desktop access"]
        - title: Expand collaborators and sites
          label: Expand collaborators and sites
          detail: "Add field teams, external partners, acquired offices, and regulated users."
          touchpoints: ["External sharing", "Mobile access", "Role-based permissions"]
        - title: Add governance and intelligence
          label: Add governance and intelligence
          detail: "Layer security, compliance, search, automation, and AI over governed content."
          touchpoints: ["Audit trails", "Sensitive-data controls", "AI workflows"]
        - title: Feed usage back into product
          label: Feed usage back into product
          detail: "Collect requests through portals, support, NPS, and customer-success teams."
          touchpoints: ["Productboard Portal", "Zendesk", "NPS surveys"]
    approximationNotes: >-
      The sequence is an analytical journey assembled from public workflow evidence;
      it is not a measured funnel, and no conversion or retention rates are implied.
    claimRefs: [CU003, CU010, CU011, CU012, CU015, CU016]
callouts:
  - calloutType: strength
    title: Production evidence extends beyond logo presence
    body: >-
      Several named stories include operational denominators such as users,
      countries, terabytes, projects, and regulated users, supporting real deployment
      rather than a simple logo-wall inference.
    claimRefs: [CU004, CU005, CU006, CU007]
  - calloutType: risk
    title: Retention and concentration remain unobservable
    body: >-
      Public case studies demonstrate selected outcomes but do not disclose NRR,
      GRR, renewal cohorts, contract duration, or customer revenue concentration.
      Those private metrics are necessary to test durability.
    claimRefs: [CU013, CU014]
