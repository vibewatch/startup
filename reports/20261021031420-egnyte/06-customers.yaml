chapter:
  number: 6
  title: Customers
  summary: >-
    Egnyte shows credible production adoption across AEC, life sciences, financial
    services, and other content-intensive sectors, including deployments measured
    in tens of thousands of users, hundreds of terabytes, and thousands of active
    projects. The evidence is nevertheless dominated by company-selected or
    derivative customer stories, while retention, contract durability, and revenue
    concentration remain private diligence gaps.
sections:
  - id: customer-segments-and-buyers
    title: Customer segments, buyers, and use cases
    body: >-
      Egnyte's customer surface is centered on organizations that manage large
      volumes of sensitive, complex, or regulated content. Its own platform
      description identifies AEC, financial services, life sciences, and media and
      entertainment as especially suitable verticals, while the customer-story
      catalogs extend the footprint into government, education, healthcare,
      manufacturing, retail, and professional services. The common economic buyer
      is typically an IT, security, compliance, or operations leader; users range
      from field and project teams to researchers, advisors, and external
      collaborators. The product's integration surface supports this pattern:
      Microsoft 365, Google Workspace, Salesforce, industry applications, and APIs
      let customers embed governed content in existing workflows rather than force
      a wholesale process replacement. This breadth is persuasive evidence of a
      multi-vertical customer base, but it does not disclose the revenue mix,
      contract values, or relative profitability of those segments.
    claimRefs: [CU001, CU002, CU003, CU007]
    tableRefs: [TU001]
  - id: adoption-and-production-proof
    title: Adoption scale and named production proof
    body: >-
      The strongest adoption evidence comes from named deployments with operational
      scale and outcomes rather than logo presence alone. Independent aggregators
      that reproduce or summarize customer stories report Red Bull connecting more
      than 20,000 users across 170 countries and rolling out 10,000 users in under
      three months; Engineering Systems Inc. managing 500 TB across 20,000 active
      projects; and BridgeBio centralizing content for more than 200 GxP users and
      reaching Part 11 compliance in three months. Alta Planning + Design is
      associated with more than $220,000 of annual savings. These data points are
      consistent with production use and meaningful switching or workflow value,
      but most remain case-study claims rather than independently audited adoption
      metrics. Their denominators also differ, so they should not be combined into
      a single growth rate or funnel.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-risk
    title: Durability, expansion loops, and concentration risk
    body: >-
      Egnyte appears to operate deliberate expansion mechanisms: customer feedback
      can move from portals, support systems, and NPS surveys into product
      prioritization, while integrations and governed external collaboration create
      additional users and workflows after initial deployment. Productboard's
      account of a 10,000-person deployment also exposes a challenge: Egnyte may
      hear directly from only a handful of managers, leaving most end-user feedback
      mediated inside the customer. A separate case-study index indicates that
      Egnyte has deployed customer-success tooling associated with reduced churn and
      faster time-to-value, but it supplies no retention denominator or cohort.
      The assigned public evidence contains no NRR, GRR, renewal rate, contract
      length, or customer-revenue concentration. Security diligence is another
      procurement variable: UpGuard markets continuous external checks, while
      Breachsense records an unverified ransomware-group claim with unknown leak
      size and explicitly warns that listed credentials are not necessarily
      connected. These signals justify verification, not a conclusion that customer
      data or retention was affected.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
