  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: "Customer-level and cohort-level NRR, GRR, gross churn, renewal rate, contract term, and seat-expansion data."
      whyItMatters: "Selected customer outcomes cannot establish revenue durability or the consistency of land-and-expand behavior."
      diligencePath: "Request the last eight quarters of cohort retention, logo churn, renewal, seat expansion, and contract-duration schedules from management."
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: "Top-10 customer and vertical revenue shares, contract values, renewal dates, and channel-attributed revenue."
      whyItMatters: "A broad logo and case-study set does not rule out material customer, vertical, or channel concentration."
      diligencePath: "Obtain anonymized customer revenue concentration and renewal calendars segmented by vertical, geography, size, and channel."
      relatedQuestionRefs: [QU007]
