companyProfile:
  summary: >-
    Cover Genius is a 2014-founded Sydney-headquartered embedded-insurance infrastructure company
    that positions itself as a global B2B2C platform rather than as a conventional direct insurer.
    Its public product suite spans XCover distribution, XClaim claims and payouts, BrightWrite
    pricing optimization, and RentalCover mobility protection, while the July 2026 fundraising
    pack said the company connected 200-plus partners with 50-plus carriers across 60-plus
    countries and all 50 U.S. states. The public record supports meaningful operating scale and
    partner proof, but still leaves investors under-informed on audited revenue quality, margins,
    concentration, and private financing terms.
  foundedDate: '2014-01-01'
  founders:
    - name: Angus "Gus" McDonald
      role: Co-founder and CEO
      background: >-
        Public founder materials say McDonald started Cover Genius after seeing how poorly embedded
        insurance fit inside online travel workflows.
      claimRefs: [CO003, CO021]
    - name: Chris Bayley
      role: Co-founder and CPO
      background: >-
        Bayley is named alongside McDonald in official founder materials as part of the original
        leadership team behind the company’s embedded-protection platform.
      claimRefs: [CO003]
  foundingLocation: Sydney, Australia
  headquarters: Sydney, Australia
  productSummary: >-
    The public suite combines XCover for global embedded distribution, XClaim for claims handling
    and instant payouts, BrightWrite for pricing and experimentation, and RentalCover for
    mobility-oriented protection inside booking flows.
  customerFocus: >-
    Large digital platforms, merchants, travel brands, logistics networks, fintechs, and adjacent
    enterprises that want to add tailored protection without building their own global insurance
    operations.
  businessModel: >-
    Public evidence implies a mix of embedded-distribution economics, orchestration or service
    revenue, claims-support workflows, and pricing-optimization value capture rather than a single
    self-serve software subscription model.
  stage: Private late-stage embedded-insurance platform
  fundingStatus: >-
