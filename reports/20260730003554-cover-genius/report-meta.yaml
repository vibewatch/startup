  topStrengths:
    - Cover Genius shows real operating scale with 200-plus partners, 50-plus carriers, 70M-plus protected customers, and 240M policies cited in current public materials.
    - Multiple named case studies attribute measurable attach-rate, ancillary-revenue, sales, and claims-speed improvements to the platform rather than offering only logo walls.
    - The product surface spans distribution, claims, pricing, and localized deployment workflows, which supports the thesis that Cover Genius is more than a narrow checkout widget.
  topRisks:
    - Public disclosure remains thin on net revenue, take rates, gross margin, concentration, renewal durability, and runway, which keeps fair value highly assumption-sensitive.
    - Global distribution across 60-plus countries and all 50 U.S. states creates material regulatory, claims-service, and conduct complexity.
    - The business promise depends heavily on claims quality, payout controls, and partner implementation discipline, so operational failures could hit trust, margins, and growth simultaneously.
    - The 2026 headline valuation may be fair as a negotiated private mark, but it is not yet independently reproducible from public evidence alone.
  unresolvedGaps:
    - Audited net revenue, take-rate logic, and revenue-recognition policy by stream and geography remain undisclosed.
    - Gross margin, service-cost intensity, concentration by top account, and cohort retention remain opaque.
    - Current cash, burn, runway, debt constraints, and financing preference terms are not publicly disclosed.
    - Public assurance evidence is still thin on uptime history, incident disclosure, and enterprise security-control detail.
