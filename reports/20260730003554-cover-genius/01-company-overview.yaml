- id: capital-base-and-milestones
  title: Capital base, milestone trajectory, and late-stage posture
  body: "The company now has two consecutive public late-stage financing markers. In May 2024, Cover Genius announced an USD $80 million round led by Spark Capital, paired with 107% revenue growth and more than 30 million protected customers. In July 2026, the company announced an additional USD $100 million at a USD $1.9 billion valuation backed by Vista Credit Partners, with capital earmarked for integrations, AI, platform scalability, and selective acquisitions. That progression matters because it shifts the story from \u2018emerging insurtech\u2019 to a company that has already crossed into mature private-capital territory. Public milestones support the same read: the about page shows a multi-stage evolution from travel and mobility roots into global XCover distribution, while the 2026 Friendsurance acquisition and new travel-platform partnerships show expansion into European banking and APAC travel. The caution is disclosure depth. The public pack is strong on milestones, weaker on\
    \ absolute revenue, margin, headcount, cap table, and board-level control terms."
