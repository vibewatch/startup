- id: adverse-and-disclosure-limits
  title: Adverse context and disclosure limits
  body: "The public-source set for Cover Genius is materially more positive than negative, but there are still caution flags worth preserving. First, the review evidence is strong but not perfectly consistent: the official July 2026 release cited a 4.5 out of 5 Trustpilot score across more than 70,000 verified reviews, while the archived Trustpilot page fetched in this run showed 4.6 out of 5 at a smaller review count. That is not a red flag, but it does show how fast-moving scale markers can drift across surfaces. Second, the company\u2019s broad licensing claim matters precisely because it is hard to verify from the public pack alone; a platform active in 60-plus countries and all 50 states necessarily faces meaningful privacy and authorization obligations. Third, basic late-stage diligence facts remain private: current board composition, fully diluted ownership, headcount, cash, burn, and preference terms. The right read is therefore positive on company maturity and market position, but\
    \ still disciplined on what is genuinely public versus what remains management-only."
