- id: founders-leadership-and-governance
  title: Founders, leadership, and governance visibility
  body: "The founder story is unusually coherent for a late-stage private company. Angus \u201CGus\u201D McDonald\u2019s ten-year note explains that he and Chris Bayley built the business after firsthand frustration with trying to add insurance into an online travel agency flow, which is a clean founder-market-fit origin for an embedded-insurance platform. Public leadership evidence is also improving. Cover Genius expanded its extended leadership team in 2024 and then added a chief revenue officer and a global senior vice president of marketing in March 2026, which suggests the company is institutionalising its go-to-market bench as it enters a more mature scale phase. What remains less visible is formal governance. The retained public pack does not clearly disclose a current board roster, committee structure, or the rights attached to major investors in either the 2024 or 2026 financings. That means the operational bench looks increasingly real, but the governance layer still has to be\
    \ diligenced directly rather than inferred from press materials."
