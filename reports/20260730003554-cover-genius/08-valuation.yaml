    - Service-heavy low margin
  - - Concentration
    - Low and diversified
    - Manageable but meaningful
    - High top-account dependency
  - - Retention / renewal
    - Strong multi-year durability
    - Mixed by cohort
    - Fragile or short-duration programs
  - - Strategic premium
    - Real and durable
    - Present but moderate
    - Overstated relative to fundamentals
  notes: This table is a public framework, not management guidance. Each sensitivity dimension maps to a concrete private diligence ask.
