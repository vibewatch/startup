- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Net revenue and take rate
    - Audited net revenue bridge and accounting policy
    - Needed to convert the round into a defendable valuation multiple
    - CFO diligence pack
  - - Gross margin and service intensity
    - Gross-profit waterfall by stream
    - Separates software-like economics from services-heavy economics
    - Finance plus operations review
  - - Concentration and renewals
    - Top-account exposure and renewal schedules
    - Can materially compress fair value even with strong growth
    - Revenue operations and account review
  - - Preference stack and terms
    - Security docs, preferences, and liquidation overhang
    - Headline valuation may differ from common-equity value
    - Legal counsel review
  - - Exit and market window
    - Board scenario pack on next-round and exit timing
    - Needed to test liquidity and return path discipline
    - Board materials and banker read
  notes: These are the minimum incremental files needed to convert a plausible price into an underwritten investment decision.
