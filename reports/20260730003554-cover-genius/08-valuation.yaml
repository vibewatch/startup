- id: valuation-verdict-and-blockers
  title: Valuation verdict and blockers
  body: "The central valuation blocker is disclosure asymmetry, not lack of momentum. Public evidence supports the idea that Cover Genius is creating real partner value across travel, logistics, and embedded-protection workflows and that investors were willing to commit fresh capital at scale in 2026. Public evidence does not support precision about the company\u2019s intrinsic value because net revenue, take rate, gross margin, concentration, cash profile, and security terms remain private. That means the 2026 mark should be treated as a serious negotiated data point within a wide fair-value range, not as a number that outside investors can independently recreate from public information. The constructive conclusion is that Cover Genius likely deserves a meaningful premium to slow incumbent benchmarks. The conditional part is that true support for the full headline mark still depends on private files that would show whether the business is closer to software-like orchestration or to high-touch\
    \ insurance services. A disciplined committee should therefore treat the current mark as a credible negotiating point, but still require explicit evidence on revenue quality, retention, and downside protection before treating it as fully de-risked intrinsic value. That is why recommendation quality here depends more on disciplined scenario framing and diligence gating than on pretending that one public multiple can settle the question."
