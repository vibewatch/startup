      - number: '2.4'
        title: Growth drivers, constraints, and competitive pressure
        blocks:
          - type: paragraph
            body: >-
              The market tailwinds are real. API-first integration lowers the cost of experimentation, personalization
              can lift attach rates, and partner-owned distribution can reduce direct customer-acquisition burden. But
              the constraints are just as real. Regulatory fragmentation across the UK, EU, Australia, and the U.S.
              state system means multi-country launches remain compliance-heavy. Consumer trust and post-purchase claims
              handling are another gating variable because a badly handled embedded claim can damage the merchant
              relationship the product is supposed to protect. Competitive intensity is already visible: Qover,
              bolttech, Wakam, Chubb, Assurant, and other players all market embedded-protection or digital-insurance
              capabilities. The correct investment conclusion is therefore not that Cover Genius benefits from a
              uniquely large market, but that it participates in a structurally attractive market where execution speed,
              trust, local permissions, and partner economics will determine whether it captures a durable share.
