        title: Headline mark and support for the 2026 round
        blocks:
          - type: paragraph
            body: >-
              The public valuation starting point is clear. Cover Genius raised USD $100 million in July 2026 at a
              headline USD $1.9 billion valuation, with multiple outlets corroborating the event and SmartCompany
              describing it in “above $2 billion” terms. That mark did not appear in a vacuum. It followed an USD $80
              million 2024 round, reported 107% year-over-year revenue growth in the earlier period, and reported 50%
              growth in 2025 in the latest round materials. The same pack added scale markers—more than USD $3 billion
              of cumulative gross written sales, more than 70 million protected customers, and 240 million policies—that
              make the company look materially larger and more proven than a typical late-stage insurtech narrative.
              Those facts justify taking the 2026 price seriously. They do not, by themselves, reveal whether the price
              is generous, fair, or conservative. A disciplined committee should therefore treat the current mark as a
              credible negotiating point, but still require explicit evidence on revenue quality, retention, and
              downside protection before treating it as fully de-risked intrinsic value. That is why recommendation
              quality here depends more on disciplined scenario framing and diligence gating than on pretending that one
              public multiple can settle the question.
