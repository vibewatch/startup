chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating model, and scale markers
        blocks:
          - type: paragraph
            body: >-
              Cover Genius now presents itself less as a niche travel-insurance intermediary and more as the
              infrastructure layer for embedded protection across digital commerce. The homepage, about page, and 2026
              raise release repeatedly describe a B2B2C model in which partners integrate protection into their own
              customer journeys while Cover Genius handles orchestration, product design, claims and servicing
              workflows. That identity matters because it explains why the company can sell into travel, retail,
              logistics, ticketing, fintech, mobility, and other sectors without needing a stand-alone consumer brand
              for every line. The strongest current scale markers are company claims, but they are specific and
              repeatedly stated: 200-plus distribution partners, 50-plus insurance carriers, 70 million-plus protected
              customers, 240 million policies, and more than USD $3 billion of cumulative gross written sales. Those
              figures are more credible than a generic ‘fast-growing insurtech’ label because several of them were
              repeated in both official and independent July 2026 coverage. The gap is not whether the company has
              achieved real reach; it is that the public pack still does not connect that reach to audited economics or
              headcount.
