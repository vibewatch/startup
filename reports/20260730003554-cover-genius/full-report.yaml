      - number: '2.3'
        title: Buyer, user, and payer motion across priority segments
        blocks:
          - type: paragraph
            body: >-
              The buyer map in embedded insurance is structurally channel-led. In Cover Genius’s visible verticals, the
              economic buyer is usually a platform or product owner seeking higher conversion, ancillary revenue, or
              lower support burden. The end user is the consumer encountering the offer inside the merchant journey, and
              the payer is usually the consumer via an added premium, though sometimes a merchant or bundled membership
              can absorb some cost. That architecture makes partner economics as important as consumer demand. Travel
              platforms, shipping providers, marketplaces, lenders, and fintechs will adopt embedded protection only
              when it fits their own workflow and P&L logic. Public case studies from Cover Genius show the category’s
              most persuasive proof points are not abstract premium figures but attach-rate uplift, ancillary revenue
              expansion, faster claims handling, and lower support burden. Those are exactly the metrics a digital
              platform owner can underwrite against a new feature launch.
