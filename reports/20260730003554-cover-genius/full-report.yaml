      - number: '3.2'
        title: Capability breadth, pricing visibility, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Public capability messaging across the category is converging. Cover Genius, Qover, and bolttech all
              stress APIs, orchestration, and embedded distribution. Extend emphasizes conversion outcomes in retail
              programs. Chubb now markets AI optimization, and Assurant markets scale in protection and servicing. That
              means surface-level feature language is less useful than it once was. Cover Genius’s clearest public edge
              is that it combines global protection distribution with claims and instant-payment tooling; many rivals
              emphasize distribution, servicing, or regulation more selectively. But public pricing is still remarkably
              thin. None of the retained open sources provides a clean enterprise fee card or a directly comparable
              revenue-share schedule. Procurement therefore shifts toward trust signals: Qover leans on licenses,
              Assurant on public-company scale, Chubb on carrier depth, and Cover Genius on partner outcomes and global
              reach. Put differently, breadth alone is not a moat. The decisive question is whether Cover Genius can
              convert breadth into partner stickiness, faster launches, and better claims outcomes than adjacent rivals.
              Investors should therefore compare not only nominal feature breadth, but also the speed with which each
              competitor can translate distribution, claims, and compliance depth into durable partner trust. That is
              why the most investable competitive signal is repeatable execution across distribution, claims, and
