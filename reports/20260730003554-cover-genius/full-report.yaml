  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitive set is not one clean peer list. bolttech and Qover are the closest direct platforms
              because they also market orchestration for embedded protection rather than only an owned consumer book.
              Extend is narrower but relevant in merchant product protection, while Wakam and Friendsurance matter more
              as European infrastructure references. Chubb and Assurant sit in a different weight class because they
              bring carrier balance sheets, claims scale, or device-care operations that can compress a platform pitch
              in procurement. Lemonade and Root are adjacent substitutes rather than direct peers because they prove
              digital insurance can scale, but they own more of the consumer relationship and risk economics. The
              practical implication is that Cover Genius rarely sells against one identical rival. It sells against a
              class of alternatives that each attack a different weak spot in its story. That framing also matters for
              investors because Cover Genius is not competing in only one lane: it overlaps with software-led MGAs,
              incumbent protection companies, and broader insurance infrastructure providers. Investors should therefore
              compare not only nominal feature breadth, but also the speed with which each competitor can translate
              distribution, claims, and compliance depth into durable partner trust. That is why the most investable
              competitive signal is repeatable execution across distribution, claims, and compliance rather than any one
              marketing slogan or feature list.
