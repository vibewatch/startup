            body: >-
              On public evidence alone, the financial verdict is constructive on growth and cautious on quality. Cover
              Genius clearly has a live economic engine: multiple partners attribute real commercial uplift to the
              platform, and the company has raised fresh capital at a strong private valuation while reporting robust
              recent growth. The underwriting blocker is not whether revenue exists; it is whether that revenue carries
              durable take rates, acceptable service costs, low concentration, and enough operating leverage to support
