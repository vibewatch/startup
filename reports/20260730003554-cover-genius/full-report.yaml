companyProfile:
  summary: >-
    Cover Genius is a 2014-founded Sydney-headquartered embedded-insurance infrastructure company that positions itself
    as a global B2B2C platform rather than as a conventional direct insurer. Its public product suite spans XCover
    distribution, XClaim claims and payouts, BrightWrite pricing optimization, and RentalCover mobility protection,
    while the July 2026 fundraising pack said the company connected 200-plus partners with 50-plus carriers across
    60-plus countries and all 50 U.S. states. The public record supports meaningful operating scale and partner proof,
    but still leaves investors under-informed on audited revenue quality, margins, concentration, and private financing
    terms.
