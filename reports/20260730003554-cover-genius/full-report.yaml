            body: >-
              The capital story is stronger than the balance-sheet story. Cover Genius raised USD $80 million in 2024
              and then another USD $100 million at a USD $1.9 billion valuation in July 2026, with official uses of
              proceeds centered on integrations, AI, platform scaling, and selective acquisitions. That confirms
              continued access to late-stage capital. It does not, however, answer the basic liquidity questions that
              investors need to price downside risk. The retained public pack does not disclose current cash, monthly
              burn, runway, debt, or project-finance-style obligations. SmartCompany’s framing of the 2026 round as
              roughly A$143 million shows local significance, but not liquidity sufficiency. The gap becomes even more
