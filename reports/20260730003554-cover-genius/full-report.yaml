  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitute stack
        blocks:
          - type: paragraph
            body: >-
              The first analytical step is separating embedded insurance from the broader insurance universe. Fortune
              and Mordor both define it as insurance sold contextually within a transaction or service flow, not as an
              independent shopping journey. Cover Genius’s own materials align with that frame: the company does not
              market a stand-alone mass consumer carrier; it markets infrastructure that lets merchants or platforms
              present protection at moments of purchase, booking, shipping, lending, or post-purchase service. That
              matters because it means the relevant market boundary is shaped by partner traffic, technical integration,
              local permissions, and claims servicing—not just by theoretical premium pools. The status quo substitutes
              are also more varied than a standard TAM slide implies. A partner can offer no protection, send customers
              to a third-party insurer after checkout, build internal orchestration, or choose an incumbent carrier with
              embedded APIs rather than a neutral platform. Cover Genius therefore competes for a specific job to be
              done inside digital commerce, not for all insurance spend. The gap between market studies matters
              strategically because valuation arguments can overstate precision when category boundaries are unstable.
              That uncertainty is itself useful diligence information.
