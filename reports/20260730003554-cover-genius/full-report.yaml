      - number: '3.3'
        title: Switching costs, moat durability, and commoditization risk
        blocks:
          - type: paragraph
            body: >-
              The moat is credible, but narrower than the broad market narrative implies. Switching costs are meaningful
              where embedded protection is integrated into claims, support, pricing, or localized carrier workflows
              rather than added as a thin checkout widget. That dynamic works in Cover Genius’s favor. At the same time,
              multi-homing remains plausible for very large digital brands, and each major rival attacks a different
              vulnerability: Qover on Europe-centric permissions clarity, Assurant on service depth, Chubb on
              balance-sheet strength, and Extend on merchant ROI language. AI is also no longer a unique wedge because
              Chubb and other vendors now use similar positioning. The strongest current conclusion is therefore
              operational rather than absolute. Cover Genius looks defensible if it can keep proving partner outcomes
              and cross-border execution, but public sources do not yet support a monopoly-like moat or effortless
              pricing power. The competitive verdict therefore depends less on logo comparison than on whether the
              company can keep compounding global permissions, carrier access, and workflow depth faster than peers.
              Investors should therefore compare not only nominal feature breadth, but also the speed with which each
              competitor can translate distribution, claims, and compliance depth into durable partner trust. That is
              why the most investable competitive signal is repeatable execution across distribution, claims, and
              compliance rather than any one marketing slogan or feature list.
