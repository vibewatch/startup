  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Cover Genius’s public materials do not describe the company as a balance-sheet insurer collecting all
              premium economics. They describe a B2B2C infrastructure layer that lets partners distribute customized
              protection, manage claims, and optimize presentation inside their own customer journeys. That strongly
              implies a revenue mix built from program economics, revenue sharing, orchestration fees, claims or service
              operations, and pricing-optimization value capture rather than from one clean software subscription. The
              strategic language in the 2026 raise reinforces that interpretation: management talks about deeper
              integrations, higher conversion, and AI-backed hyper-personalization, not about growing a single carrier
              book. The missing piece is pricing transparency. Public sources do not disclose a canonical take rate,
              revenue-recognition policy, or fee schedule by vertical. That means the model is legible, but not fully
              priceable. The public evidence is therefore directionally useful but still insufficient for precise
              underwriting without a management-quality KPI pack. The public evidence is therefore directionally useful
              but still insufficient for precise underwriting without a management-quality KPI pack. That asymmetry
              between visible demand proof and hidden economics is the main reason to treat public financial conclusions
              as conditional rather than final.
