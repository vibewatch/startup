  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and partner-linked risk
        blocks:
          - type: paragraph
            body: >-
              The clearest risk category is regulatory complexity. Cover Genius markets coverage across more than 60
              countries and all 50 U.S. states, which means the company sits inside many overlapping conduct,
              product-governance, and distribution regimes. The retained regulatory pack underscores how fragmented this
              is: UK guidance treats insurance-distribution activities broadly, EIOPA emphasizes product governance and
              customer outcomes across Europe, Australia splits conduct and prudential oversight, and U.S. insurance
              rules remain state-centered. For an embedded-insurance platform, that complexity is amplified by partner
              distribution. Even if Cover Genius provides the infrastructure correctly, partner disclosure, placement,
              or UX choices can still create regulatory or conduct issues. That makes compliance not a one-time
              licensing exercise but an operating-system requirement that must scale with every new partner and market.
              The right diligence posture is therefore to treat these as monitorable operating risks with explicit
              trigger conditions, not as abstract checklist items. The operating question is not whether these risks
              exist in theory, but whether management can measure, prioritize, and contain them faster than scale
              introduces new failure modes. Even where the public record is directionally reassuring, investors still
              need evidence that mitigation maturity is keeping pace with geographic and product expansion.
