- id: TR005
  title: Risk gaps table
  columns:
  - Missing evidence
  - Why it matters
  - Minimum diligence ask
  rows:
  - - Security / compliance assurance pack
    - Residual risk cannot be estimated from policy pages
    - Request audit summaries, certification matrix, and internal controls
  - - Program-level claims and fraud metrics
    - Core service risk lives in claims operations
    - Request claim-rate, fraud-loss, and complaint dashboards
  - - Partner concentration and renewals
    - Needed to quantify customer and revenue durability
    - Request top-account exposure and renewal schedules
  - - Reliability metrics and incident history
    - Platform scale requires uptime proof
    - Request SLA history and postmortem summaries
  - - Integration and synergy tracking
    - Friendsurance execution risk is otherwise narrative-only
    - Request PMO dashboard and synergy review
  notes: These asks convert an identified risk map into a diligence plan that could actually reduce uncertainty.
