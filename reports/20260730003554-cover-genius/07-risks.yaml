- id: TR003
  title: Operational / execution risks table
  columns:
  - Domain
  - Current workflow
  - Failure mode
  - Visible mitigant
  rows:
  - - Claims payouts
    - Instant multi-currency claims resolution
    - Fraud, payout, or screening error
    - Workflow depth and support capability
  - - Partner launches
    - Enterprise integration and localization
    - Slow launch, poor UX, or disclosure mismatch
    - Reusable docs and platform language
  - - Support operations
    - End-customer service at claim time
    - Ticket backlog or inconsistent resolution quality
    - Strong support case study
  - - Data handling
    - Quote, policy, identity, and payment data
    - Privacy breach or governance failure
    - Public privacy policy exists
  - - Acquisition integration
    - Friendsurance expansion
    - Roadmap distraction or control gaps
    - Strategic rationale appears coherent
  notes: Visible mitigants are public signals, not proof that residual risk is low.
