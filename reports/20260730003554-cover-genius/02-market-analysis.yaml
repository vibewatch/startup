- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - API-first integration
    - tailwind
    - current
    - Lets partners test protection without building everything internally
    - Request average time-to-launch by vertical and geography
  - - Personalization and dynamic pricing
    - tailwind
    - current
    - Can improve conversion and attach when offers are context-aware
    - Ask for measured uplift attributable to BrightWrite or similar tooling
  - - Partner-owned traffic
    - tailwind
    - current
    - Reduces direct CAC and allows contextual merchandising
    - Request partner-renewal and concentration data
  - - Claims and service UX
    - tailwind / headwind
    - current
    - Great claims can deepen loyalty; poor claims can damage merchant trust
    - Request platform-wide service SLAs and complaint rates
  - - Regulatory fragmentation
    - headwind
    - current
    - Local permissions and product governance slow launches
    - Map launch times and failed launches by market
  - - Data privacy and product-governance rules
    - headwind
    - current
    - Sensitive-data handling and fair-product obligations raise execution burden
    - Review consent, DPA, and incident-response controls
  - - Competitive crowding
    - headwind
    - current
    - Peers and incumbents can compress pricing and stretch sales cycles
    - Collect win-loss and pricing-pressure data by segment
  - - Market-estimate dispersion
    - headwind
    - current
    - Broad TAM slides can disguise a narrower real SAM
    - Insist on bottom-up partner pipeline evidence rather than top-down TAM rhetoric
  notes: These rows translate market structure into decision-relevant drivers. None of them substitute for private operating data such as attach rates, launch times, or renewal cohorts.
