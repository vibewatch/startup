- id: tam-sam-som-lenses
  title: TAM, SAM, and contradictory sizing lenses
  body: "The public market-sizing evidence is useful, but only if its contradictions are preserved. Mordor\u2019s 2025-2026 market sizes are an order of magnitude smaller than Fortune\u2019s, while Cover Genius\u2019s 2024 and 2026 funding materials cite even broader opportunity frames. The gap likely reflects different units and category boundaries: some publishers emphasize near-term embedded-insurance revenue, some emphasize broader premium opportunity, and some blend non-insurance protection into the same umbrella. That means investors should resist the temptation to average the estimates. The better read is that the long-run category is large enough to matter, but the serviceable market for any one platform is constrained by partner fit, carrier supply, product governance, localization, and claims operations. For Cover Genius, the most defendable SAM sits inside global digital brands in travel, retail, logistics, ticketing, fintech, mobility, and adjacent verticals where checkout traffic\
    \ already exists and ancillary monetization matters."
