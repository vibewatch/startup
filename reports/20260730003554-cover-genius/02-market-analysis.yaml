  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-sizing
    missingEvidence: Partner-qualified serviceable market by vertical and geography.
    whyItMatters: TAM alone does not show where Cover Genius can realistically win revenue.
    diligencePath: Request internal pipeline segmentation and live-program counts by vertical.
    relatedQuestionRefs:
    - QM021
    - QM024
    - QM025
  - type: private-evidence-only
    severity: material
    topic: budget-owner
    missingEvidence: Which internal team and budget line actually approves protection by vertical.
    whyItMatters: Budget ownership governs sales cycle and adoption pacing.
    diligencePath: Interview product and commercial leaders across travel, retail, and fintech cohorts.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: consumer-fatigue
    missingEvidence: Public attach-rate data outside a few case studies.
    whyItMatters: Market size is less useful if customers ignore embedded offers.
    diligencePath: Request attach and opt-out distributions by vertical and geography.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: material
    topic: regulatory-timeline
    missingEvidence: Typical launch-time variance caused by local permissions and product governance.
    whyItMatters: This is a core determinant of how much of TAM is serviceable.
    diligencePath: Request go-live timeline data from compliance and implementation teams.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: share-estimation
