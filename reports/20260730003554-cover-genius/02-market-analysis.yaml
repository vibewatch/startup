- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Travel embedded protection
    - Trip cancellation, CFAR, baggage, delay, and ancillary travel protection sold inside bookings
    - Standalone broker-sold annual travel policies
    - Online travel platforms / end traveler
    - Core current Cover Genius segment with deep partner proof
  - - Retail and e-commerce protection
    - Product warranties, shipping protection, refund protection, and checkout add-ons
    - Traditional off-line extended warranty channels
    - Merchant or marketplace / shopper
    - Relevant to Cover Genius retail and shipping surfaces
  - - Logistics and shipping
    - Parcel or shipment protection embedded in merchant workflows
    - Standalone marine or cargo enterprise policies outside checkout
    - Merchant platform / merchant or end buyer
    - Validated by Shippo and ShipRush proof
  - - Ticketing and live events
    - Refund or ticket protection inside ticketing flows
    - Standalone event insurance bought elsewhere
    - Ticketing platform / event attendee
    - Relevant because Cover Genius markets ticketing partnerships
  - - Fintech, banking, and lending
    - Protection offered inside financial-product journeys
    - Pure balance-sheet lending economics without embedded insurance
    - Fintech or bank / borrower or account holder
    - Growing adjacency after TAL and Friendsurance signals
  - - Mobility and rental car
    - Rental-car and vehicle-adjacent protection inside booking flows
    - Traditional auto insurance purchased outside the trip or booking
    - Rental or mobility platform / renter or driver
    - Covered by RentalCover and partner history
  notes: The table defines the serviceable category in workflow terms. It intentionally excludes broad insurance spend that never sits inside a digital partner journey.
