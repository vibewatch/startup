summary:
  headline: >-
    Cover Genius has credible global embedded-insurance scale and real partner proof, but public disclosure is still too
    thin on economics, concentration, and security terms to underwrite the July 2026 USD 1.9B mark with high confidence.
  overallScore: 6.7
