company:
  name: Cover Genius
chapter:
  number: 4
  title: Financials
  summary: 'The public record supports a real revenue engine around embedded protection, partner conversion, and global claims servicing, but it still falls well short of underwriting-grade private-company disclosure. The positive evidence is clear: Cover Genius reported 107% year-over-year revenue growth in 2024, 50% growth in 2025, more than USD $3 billion of cumulative gross written sales, and partner case studies showing attach-rate and ancillary-revenue uplift. The missing files are just as clear: absolute revenue, take rates, gross margin, cash, burn, runway, concentration, and cap-table economics remain private.'
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing visibility
  body: "Cover Genius\u2019s public materials do not describe the company as a balance-sheet insurer collecting all premium economics. They describe a B2B2C infrastructure layer that lets partners distribute customized protection, manage claims, and optimize presentation inside their own customer journeys. That strongly implies a revenue mix built from program economics, revenue sharing, orchestration fees, claims or service operations, and pricing-optimization value capture rather than from one clean software subscription. The strategic language in the 2026 raise reinforces that interpretation: management talks about deeper integrations, higher conversion, and AI-backed hyper-personalization, not about growing a single carrier book. The missing piece is pricing transparency. Public sources do not disclose a canonical take rate, revenue-recognition policy, or fee schedule by vertical. That means the model is legible, but not fully priceable. The public evidence is therefore directionally\
    \ useful but still insufficient for precise underwriting without a management-quality KPI pack. The public evidence is therefore directionally useful but still insufficient for precise underwriting without a management-quality KPI pack. That asymmetry between visible demand proof and hidden economics is the main reason to treat public financial conclusions as conditional rather than final."
