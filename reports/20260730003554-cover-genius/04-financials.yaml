- id: growth-throughput-and-unit-economics
  title: Growth, throughput, and unit-economics read-through
  body: "The strongest public financial evidence is on growth and throughput. The 2024 and 2026 fundraising announcements bracket two strong growth periods, while the 2026 pack adds large throughput markers\u201470 million-plus customers, 240 million policies, and more than USD $3 billion of cumulative gross written sales. Partner case studies add a second layer of evidence because they tie Cover Genius to measurable economic outputs such as 400% attach-rate improvement, 4x ancillary revenue, 7x add-on sales, 86% year-over-year travel revenue growth, and faster claims handling. That is meaningful because it shows the company is not selling only a conceptual platform. At the same time, none of those metrics is a substitute for net revenue, take rate, or gross margin. Public proof says demand is real; it does not yet prove whether economics are software-like, service-heavy, or somewhere in between. The public evidence is therefore directionally useful but still insufficient for precise underwriting\
    \ without a management-quality KPI pack. The public evidence is therefore directionally useful but still insufficient for precise underwriting without a management-quality KPI pack. That asymmetry between visible demand proof and hidden economics is the main reason to treat public financial conclusions as conditional rather than final."
