  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited net revenue bridge from gross written sales, policies, and partner economics.
    whyItMatters: This is the main missing file for underwriting the current private valuation.
    diligencePath: Request audited revenue split by stream and geography.
    relatedQuestionRefs:
    - QI021
  - type: private-evidence-only
    severity: material
    topic: margins
    missingEvidence: Gross margin and service-cost waterfall by stream.
    whyItMatters: Unit economics can look very different for orchestration software versus claims-heavy service work.
    diligencePath: Request gross-profit bridge and contribution margins.
    relatedQuestionRefs:
    - QI022
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash, monthly burn, runway, and downside financing plan.
    whyItMatters: A fresh round is not the same as transparent capital adequacy.
