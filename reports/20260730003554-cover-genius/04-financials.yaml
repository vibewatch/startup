- id: capital-adequacy-and-disclosure-limits
  title: Capital adequacy and disclosure limits
  body: "The capital story is stronger than the balance-sheet story. Cover Genius raised USD $80 million in 2024 and then another USD $100 million at a USD $1.9 billion valuation in July 2026, with official uses of proceeds centered on integrations, AI, platform scaling, and selective acquisitions. That confirms continued access to late-stage capital. It does not, however, answer the basic liquidity questions that investors need to price downside risk. The retained public pack does not disclose current cash, monthly burn, runway, debt, or project-finance-style obligations. SmartCompany\u2019s framing of the 2026 round as roughly A$143 million shows local significance, but not liquidity sufficiency. The gap becomes even more obvious when compared with a mature public protection company like Assurant, whose annual report and investor site offer far richer financial disclosure than anything available for Cover Genius. The public evidence is therefore directionally useful but still insufficient\
    \ for precise underwriting without a management-quality KPI pack. The public evidence is therefore directionally useful but still insufficient for precise underwriting without a management-quality KPI pack. That asymmetry between visible demand proof and hidden economics is the main reason to treat public financial conclusions as conditional rather than final."
