- id: architecture-and-workflow
  title: Architecture, APIs, and workflow model
  body: "The public technical surface is strongest in partner documentation and demos. The Offers API page describes a REST interface for promoting, selling, and managing insurance and non-insurance products. The XClaim documentation shows operational detail around first notice of loss, document upload, and claim creation, while RentalCover documentation maps a quote-and-reference flow into booking journeys. The demos reinforce that this is not a thin front-end wrapper: instant payouts, fraud detection, shipping risk reduction, and dynamic pricing all point to a stack that spans more than checkout presentation. The right conclusion is not that the full internal architecture is now public. It is that Cover Genius has shown enough workflow detail to prove a meaningful enterprise integration surface. What remains private are the infrastructure-level artifacts\u2014cloud architecture, uptime, change failure, and incident history\u2014that enterprise buyers would still demand. That is why the\
    \ chapter distinguishes clearly between workflow proof that is publicly visible and enterprise-assurance evidence that likely exists privately but is not yet independently visible from outside. That is why the chapter distinguishes clearly between workflow proof that is publicly visible and enterprise-assurance evidence that likely exists privately but is not yet independently visible from outside. In practice, that means the technology case is strong enough for commercial diligence, but not yet strong enough for a full enterprise-assurance signoff based on public artifacts alone."
