  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Public uptime, incident, and change-failure evidence.
    whyItMatters: Enterprise buyers need reliability evidence beyond marketing copy.
    diligencePath: Request status history, SLAs, and postmortem summaries.
    relatedQuestionRefs:
    - QE021
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: Certification inventory, pen-test summaries, and privacy-governance artifacts.
    whyItMatters: Sensitive claims and identity data make assurance a core product attribute.
    diligencePath: Request security pack and vendor-risk inventory.
    relatedQuestionRefs:
    - QE022
  - type: private-evidence-only
    severity: material
    topic: architecture-detail
    missingEvidence: Internal systems architecture and cloud or data-stack detail.
    whyItMatters: Needed to evaluate scalability and vendor dependency.
    diligencePath: Request CTO or architecture review.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: developer-metrics
    missingEvidence: API adoption, versioning cadence, and breaking-change discipline.
    whyItMatters: Developer docs alone do not prove mature platform operations.
    diligencePath: Request developer-ops metrics and release notes.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: module-economics
    missingEvidence: Product-module profitability and service intensity.
    whyItMatters: Technical breadth can still hide weak economics by module.
    diligencePath: Request product P&L and resource allocation by module.
    relatedQuestionRefs:
