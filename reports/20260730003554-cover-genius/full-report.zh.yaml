  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价能见度
        blocks:
          - type: paragraph
            body: >-
              Cover Genius 的公开材料没有把公司描述为承担资产负债表风险、收取全部保费经济性的保险公司。它描述的是一个 B2B2C 基础设施层，
              让伙伴在自己的客户旅程中分销定制化保障、管理理赔并优化呈现方式。这强烈暗示，收入组合来自项目经济性、收入分成、编排费用、 理赔或服务运营以及定价优化价值捕获，而不是一个干净的软件订阅。2026
              年融资中的战略语言进一步强化这一解释： 管理层谈的是更深集成、更高转化和 AI 支持的超个性化，而不是扩大单一承保账簿。缺失的是定价透明度。公开来源没有披露标准抽成率、
              收入确认政策或按垂直领域划分的费用表。因此，模型可以读懂，但还不能完整定价。公开证据方向上有用， 但没有管理层级 KPI 包，仍不足以支持精确投资判断。公开证据方向上有用，但没有管理层级 KPI
              包，仍不足以支持精确投资判断。 可见需求证明与隐藏经济性之间的不对称，是把公开财务结论视为有条件而非最终结论的主要原因。
