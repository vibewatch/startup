      - number: '6.2'
        title: 客户证明质量
        blocks:
          - type: paragraph
            body: >-
              客户章节最强的部分，是案例研究证据的质量。Cover Genius 反复发布具名伙伴结果，而不只是客户标识墙。Turkish Airlines 报告附加率提高 400%，Omio 报告附加收入增长
              4x，Rhino 报告附加销售增长 7x，Luxury Escapes 把合作同 86% 的旅行收入同比增长连起来， ShipRush
              则报告理赔处理明显更快。这种多样性重要，因为它显示价值主张并不局限于一个指标或一个垂直领域。XCover 支持案例研究和存档 Trustpilot
              页面也补充了证据，表明售后支持是产品价值的一部分。不利读法是，这些材料全都是经过筛选的营销证据。 没有未经筛选的留存、投诉和队列数据，公开故事仍很强，但照亮的是被挑选过的一面。因此，实际尽调后果是：
              投资人在把客户故事视为充分去风险之前，应把可见生产证明同仍缺失的续约、队列和集中度证据分开。因此，实际尽调后果是：
              投资人在把客户故事视为充分去风险之前，应把可见生产证明同仍缺失的续约、队列和集中度证据分开。B2B2C 模型下这一点尤其重要， 因为公开证据可能让规模看起来很宽，却仍很少揭示已安装客户群中的续约质量。
