  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有玩家、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争集合不是一张干净的同业名单。bolttech 和 Qover 是最接近的直接平台，因为它们同样营销嵌入式保障编排， 而不只是自有消费者账簿。Extend 范围更窄，但在商户产品保障上仍有意义；Wakam 和
              Friendsurance 更像欧洲基础设施参照。 Chubb 和 Assurant 属于另一重量级，因为它们带来承保机构资产负债表、理赔规模或设备保障运营，能在采购中挤压平台型叙事。 Lemonade 和
              Root 是相邻替代方案，而不是直接同业；它们证明数字保险可以规模化，但更多掌握消费者关系和风险经济性。 实际含义是，Cover Genius
              很少只对上一家完全相同的对手。它面对的是一组替代方案，每一类都攻击其故事中的不同弱点。 这种框架对投资人也重要，因为 Cover Genius 不只在一条赛道竞争：它与软件驱动型
              MGA、既有保障公司和更广义保险基础设施提供商都有重叠。 因此，投资人不应只比较名义功能宽度，还要比较每个竞争者把分销、理赔和合规深度转化为持久伙伴信任的速度。
              最值得投资的竞争信号，不是某一句营销口号或某一张功能清单，而是在分销、理赔和合规上可重复执行。
