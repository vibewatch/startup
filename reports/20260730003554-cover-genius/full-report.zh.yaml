  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 披露估值与 2026 轮支撑
        blocks:
          - type: paragraph
            body: >-
              公开估值起点很清楚。Cover Genius 2026 年 7 月以披露估值 USD $1.9 billion 融资 USD $100 million，多家媒体佐证了该事件， SmartCompany 还用“超过
              $2 billion”口径描述。这一估值标记并非凭空出现。它之前有一轮 2024 年 USD $80 million 融资， 早期阶段报告收入同比增长 107%，最新轮材料又报告 2025 年增长
              50%。同一资料包还加入规模标记——超过 USD $3 billion 的累计承保销售额、 超过 7000 万受保护客户和 2.4 亿份保单——让公司看起来比典型后期保险科技叙事大得多，也被证明得更充分。
              这些事实足以让 2026 年价格值得认真对待。它们本身不能说明价格是慷慨、公允还是保守。因此，纪律严格的投委会应把当前估值标记视为可信谈判点，
              但在把它当成充分去风险的内在价值之前，仍要要求收入质量、留存和下行保护的明确证据。这也是为什么这里的建议质量， 更多取决于有纪律的情景框架和尽调闸门，而不是假装一个公开倍数就能定案。
