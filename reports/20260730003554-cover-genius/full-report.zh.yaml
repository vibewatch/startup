chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营模型与规模标记
        blocks:
          - type: paragraph
            body: >-
              Cover Genius 现在呈现的形象，已经不太像一家细分旅行保险中介，更像数字商业嵌入式保障的基础设施层。官网、关于页面和 2026 年融资公告反复描述一个 B2B2C
              模型：伙伴把保障嵌入自己的客户旅程，Cover Genius 负责背后的编排、产品设计、 理赔和服务工作流。这个身份很关键，因为它解释了公司为什么能卖进旅行、零售、物流、票务、fintech、出行等行业，
              而不必为每条业务线都建立独立消费者品牌。当前最强的规模标记仍来自公司口径，但这些数字具体且反复出现：200 多家分销伙伴、 50 多家保险承保机构、7000 多万受保护客户、2.4 亿份保单，以及超过 USD
              $3 billion 的累计承保销售额。 这些数字比笼统的“高增长 insurtech”标签更可信，因为其中多项同时出现在 2026 年 7 月官方和独立报道中。缺口不在于公司是否已经做出真实触达，
              而在于公开资料包仍没有把这种触达同经审计经济性或员工规模连起来。
