            body: >-
              最强的公开财务证据落在增长和吞吐量上。2024 和 2026 年融资公告夹住了两个强增长阶段；2026 年资料包又加入大规模吞吐标记—— 7000 多万客户、2.4 亿份保单，以及超过 USD $3
              billion 的累计承保销售额。伙伴案例研究提供第二层证据， 因为它们把 Cover Genius 同可衡量的经济产出连起来，例如附加率提高 400%、附加收入增长 4x、附加销售增长 7x、 旅行收入同比增长
              86%，以及更快的理赔处理。这很有意义，因为它显示公司卖的不只是概念性平台。与此同时， 这些指标都不能替代净收入、抽成率或毛利率。公开证明说明需求真实；它还没有证明经济性到底像软件、偏服务，还是介于两者之间。
