      - number: '2.3'
        title: 优先细分市场中的买方、用户与付款方流转
        blocks:
          - type: paragraph
            body: >-
              嵌入式保险的买方地图天然由渠道驱动。在 Cover Genius 可见的垂直领域，经济买方通常是平台或产品负责人，
              他们想提高转化、增加附加收入或降低支持负担。终端用户是在商户旅程中看到报价的消费者；付款方通常也是消费者，
              通过额外保费付款，不过有时商户或捆绑会员会吸收部分成本。这种架构让伙伴经济性与消费者需求同样重要。旅行平台、物流服务商、 交易平台、放贷方和金融科技公司只有在嵌入式保障契合自己的工作流和 P&L
              逻辑时才会采用。Cover Genius 的公开案例显示，
              这一类别最有说服力的证明点不是抽象保费数字，而是附加率提升、附加收入扩张、更快理赔处理和更低支持负担。这些正是数字平台负责人在推出新功能时可以据以测算的指标。
