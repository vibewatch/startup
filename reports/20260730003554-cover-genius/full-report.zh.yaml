      - number: '3.2'
        title: 能力宽度、定价能见度与信任姿态
        blocks:
          - type: paragraph
            body: >-
              这一类别的公开能力话术正在趋同。Cover Genius、Qover 和 bolttech 都强调 API、编排和嵌入式分销。Extend 强调零售项目中的转化结果。 Chubb 现在营销 AI
              优化，Assurant 则营销保障和服务规模。这意味着表层功能语言已经不如过去有用。 Cover Genius
              最清楚的公开优势，是把全球保障分销同理赔和即时支付工具合在一起；许多对手更选择性地强调分销、服务或监管。
              但公开定价仍异常稀薄。留存的开放来源中，没有任何一个给出清楚的企业价格表或可直接比较的分成表。因此，采购会转向信任信号： Qover 倚重牌照，Assurant 倚重上市公司规模，Chubb
              倚重承保机构深度，Cover Genius 则倚重伙伴结果和全球触达。 换句话说，宽度本身不是护城河。决定性问题是，Cover Genius 能否把宽度转化为伙伴粘性、更快上线和比相邻对手更好的理赔结果。
              因此，投资人不应只比较名义功能宽度，还要比较每个竞争者把分销、理赔和合规深度转化为持久伙伴信任的速度。 最值得投资的竞争信号，不是某一句营销口号或某一张功能清单，而是在分销、理赔和合规上可重复执行。
