      - number: '1.4'
        title: 不利背景与披露边界
        blocks:
          - type: paragraph
            body: >-
              Cover Genius 的公开来源集合明显正面多于负面，但仍有几面谨慎旗帜需要保留。第一，评论证据很强，却并非完全一致： 2026 年 7 月官方公告引用超过 70,000 条已验证评论、Trustpilot
              评分 4.5/5；本次抓取的存档 Trustpilot 页面则显示， 在更小评论数下评分为 4.6/5。这不是红旗，但说明快速变化的规模标记会在不同页面之间漂移。第二，公司广泛牌照覆盖的说法重要，
              正因为仅靠公开资料包很难验证；一个活跃于 60 多个国家和美国 50 州的平台，必然面对实质性的隐私和授权义务。第三，
              后期尽调的基础事实仍属私有：当前董事会构成、完全稀释股权、员工数、现金、现金消耗和优先权条款。因此，正确读法是： 对公司成熟度和市场位置保持正向，但必须严格区分真正公开的信息和仍只在管理层手里的材料。
