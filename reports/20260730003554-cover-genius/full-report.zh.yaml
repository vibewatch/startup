      - number: '7.3'
        title: 竞争、财务与结论风险
        blocks:
          - type: paragraph
            body: >-
              风险栈的其余部分，是投资人会从一家规模化私营基础设施公司身上预期到的内容。竞争来自嵌入式保险专业玩家、拥有资产负债表和承保机构关系的大型
              既有玩家，以及可能向重叠流程收敛的数字保险品牌。即使客户标识名单很宽，集中度仍可能存在，因为公开来源不披露伙伴收入组合。
              利润率质量也不确定：伙伴驱动的交易量可能看起来很亮眼，却在底下隐藏服务占比高的经济性。Friendsurance 收购和 TAL 扩张带来机会， 也带来执行和产品治理复杂性。2026
              年新资本显著降低近期融资压力，强案例证据也降低纯产品—市场匹配风险， 但两者都不能消除对控制、集中度和单位经济性的硬性私有证据需求。实际结论是，Cover Genius 是一家业务范围很宽的公司，
              主要风险偏治理负荷，而不是需求不足。正确尽调姿态是把这些视为带明确触发条件、可监控的运营风险，而不是抽象清单项。
              运营问题不在于这些风险理论上是否存在，而在于管理层能否衡量、排序并控制它们，且速度快过规模带来的新失效模式。 即便公开记录方向上令人放心，投资人仍需要证据证明，风险缓释成熟度跟得上地域和产品扩张。
