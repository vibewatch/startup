              公开可比公司工作反对单点估值答案。Lemonade、Root 和 Assurant 虽然都以某种方式触及保险、保障或数字分销， 但公开市场倍数区间差异很大。Lemonade
              捕捉更像软件或科技溢价的情绪区间，Assurant 捕捉成熟保障服务既有玩家的视角， Root 则显示数字保险故事也可能落到低得多的倍数区间。它们都不是 Cover Genius 的完美类比， 这也是
              Qover、bolttech、Extend 和 Wakam 等私营同业具有战略意义的原因，尽管这些同业也不能解决透明度问题。 正确方法是基于情景。下行情景把 Cover Genius
              视为服务占比高、利润率较弱或有集中度问题的中介；基准情景假设其增长持久但经济性混合； 上行情景假设私有数据会更接近一个规模化编排平台，且留存和抽成率有吸引力。因此，纪律严格的投委会应把当前估值标记视为可信谈判点，
