  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案栈
        blocks:
          - type: paragraph
            body: >-
              第一项分析动作，是把嵌入式保险从更广义的保险宇宙中分离出来。Fortune 和 Mordor 都把它定义为在交易或服务流程中按场景销售的保险， 而不是独立选购旅程。Cover Genius
              自己的材料也贴合这一框架：公司不营销独立的大众消费者承保机构， 而是营销一套基础设施，让商户或平台能在购买、预订、发货、借贷或售后服务时刻展示保障。这个边界很关键，
              因为这个市场由伙伴流量、技术集成、本地许可和理赔服务塑造，而不只是理论保费池。现状替代方案也比标准 TAM 页更复杂。
              伙伴可以不提供保障，可以在结账后把客户导向第三方保险公司，可以自建内部编排，也可以选择带嵌入式 API 的既有承保机构， 而不是中立平台。因此，Cover Genius
              争的是数字商业里一项具体工作，而不是全部保险支出。市场研究之间的差距具有战略意义， 因为类别边界不稳时，估值论证很容易夸大精确度。这种不确定性本身就是有用的尽调信息。
