          - type: paragraph
            body: >-
              对一家后期私营公司来说，Cover Genius 的创始人故事少见地连贯。Angus “Gus” McDonald 的十周年笔记解释，他和 Chris Bayley
              是在亲身遭遇在线旅行社流程里加入保险的挫败后创办公司；这给嵌入式保险平台提供了清晰的创始人—市场匹配起点。 公开领导层证据也在变多。Cover Genius 2024 年扩充了延展领导团队，2026 年 3
              月又加入首席营收官和全球营销高级副总裁， 显示公司进入更成熟扩张阶段时，正在把商业化班底做成体系。更不透明的是正式治理。本次留存的公开资料包没有清楚披露当前董事会名单、 委员会结构，也没有披露 2024 或
