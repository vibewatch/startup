      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              仅看公开证据，财务结论是增长可正向、质量需谨慎。Cover Genius 显然有一个真实运转的经济引擎：
              多个伙伴把真实商业提升归因于平台，公司也在报告强劲近期增长的同时，以很强的私营估值拿到新资本。投资判断的阻塞点不是有没有收入， 而是这笔收入是否带有持久抽成率、可接受服务成本、低集中度，以及足以支撑 2026 年
              7 月估值标记的经营杠杆。换句话说， 如果业务表现得像软件占比高的编排层，它可能配得上溢价估值；但当前公开资料包仍留下另一种可能：经济性更接近复杂、合规负担重的服务中介。
              这正是剩余尽调问题如此重要的原因。公开证据方向上有用，但没有管理层级 KPI 包，仍不足以支持精确投资判断。 公开证据方向上有用，但没有管理层级 KPI
