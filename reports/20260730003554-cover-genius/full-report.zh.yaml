          - type: paragraph
            body: >-
              在私营保险科技公司中，Cover Genius 的客户规模披露得少见地清楚。2026 年官方融资材料称，公司已通过 2.4 亿份保单保护超过 7000 万客户，并把这种触达同 200 多家分销伙伴、50
              多家保险承保机构连接起来。具名伙伴名单覆盖全球旅行品牌、金融科技公司、零售商和 交易平台。这个点重要，因为它把讨论从零星案例推进到更广平台足迹。Cover Genius 展示的不是一个样板客户，
              而是横跨多类交易旅程的广泛平台足迹。从 APAC 旅行到 DACH 银行业基础设施，伙伴公告的地域跨度也进一步支持它是全球 B2B2C 网络的判断。
              公开资料包没有显示的是，这些规模中有多少集中在少数超大型平台。因此，实际尽调后果是：投资人在把客户故事视为充分去风险之前，
              应把可见生产证明同仍缺失的续约、队列和集中度证据分开。因此，实际尽调后果是：投资人在把客户故事视为充分去风险之前， 应把可见生产证明同仍缺失的续约、队列和集中度证据分开。B2B2C
              模型下这一点尤其重要，因为公开证据可能让规模看起来很宽， 却仍很少揭示已安装客户群中的续约质量。
