      - number: '7.2'
        title: 服务、数据与运营风险
        blocks:
          - type: paragraph
            body: >-
              服务和数据风险同样重要，因为 Cover Genius 的承诺不止卖出一份保单。公开产品材料强调理赔速度、即时赔付和支持改善。
              这意味着运营失败会出现在客户旅程最敏感的时刻：客户提交理赔或等待赔付时。隐私政策确认公司处理敏感客户和支付数据；
              条款页面则显示平台原生账户和报价模型。这些事实抬高了访问控制、隐私治理、赔付完整性、制裁筛查和欺诈控制的重要性。 Trustpilot
              的正面存档信号和支持案例研究有助于缓释风险，但不能替代真实项目层指标。公开资料包缺少正常运行时间历史、 投诉看板、欺诈损失率或理赔率分布，所以剩余运营风险仍难以从外部量化。正确尽调姿态是把这些视为带明确触发条件、
              可监控的运营风险，而不是抽象清单项。运营问题不在于这些风险理论上是否存在，而在于管理层能否衡量、排序并控制它们，
              且速度快过规模带来的新失效模式。即便公开记录方向上令人放心，投资人仍需要证据证明，风险缓释成熟度跟得上地域和产品扩张。
