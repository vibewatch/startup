  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              对一家私营保险科技公司来说，Cover Genius 的产品故事少见地清楚。官网和平台页面把 Cover Genius 呈现为一组模块： XCover 做全球嵌入式分销，XClaim
              做快速理赔赔付，BrightWrite 做优化和实验，RentalCover 做租车保障。这个点重要， 因为它显示公司卖的不止一种保险报价，而是一套可复用运营栈，可以按多个垂直领域和地域配置。垂直覆盖也很明确：
              旅行、物流、票务、金融科技、零售、零工经济、出行和保险用例都出现在公开网站上。这种宽度支撑公司的“全球基础设施”说法，
              但也抬高了尽调门槛，因为如此宽的平台，背后必须有真实编排、许可和理赔深度。因此，本章清楚区分公开可见的工作流证明， 与很可能私下存在但外部尚无法独立看到的企业级保障证据。因此，本章清楚区分公开可见的工作流证明，
              与很可能私下存在但外部尚无法独立看到的企业级保障证据。实际含义是，技术论点足够支撑商业尽调； 但仅凭公开材料，还不足以完成企业级保障签核。
