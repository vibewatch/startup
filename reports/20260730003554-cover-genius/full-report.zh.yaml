companyProfile:
  summary: >-
    Cover Genius 创立于 2014 年，总部位于悉尼，是一家嵌入式保险基础设施公司。公司把自己定位为全球 B2B2C 平台，而不是传统直销保险公司。 公开产品套件覆盖 XCover 分销、XClaim
    理赔与赔付、BrightWrite 定价优化，以及 RentalCover 出行保障；2026 年 7 月融资资料包称， 公司连接了 200 多家伙伴和 50 多家承保机构，覆盖 60 多个国家和美国 50
    州。公开记录支持其已有可观运营规模和伙伴证明， 但投资人对经审计收入质量、利润率、集中度和私募融资条款仍了解不足。
