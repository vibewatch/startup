      - number: '8.3'
        title: 估值结论与阻塞项
        blocks:
          - type: paragraph
            body: >-
              核心估值阻塞项是披露不对称，而不是缺少动能。公开证据支持这样一个判断：Cover Genius 正在旅行、物流和嵌入式保障工作流中创造真实伙伴价值， 投资人也愿意在 2026
              年投入大额新资本。公开证据不支持对公司内在价值做精确判断，因为净收入、抽成率、毛利率、集中度、现金状况和安全条款仍属私有。 因此，2026
              年估值标记应被视为一个认真谈判得出的数据点，落在很宽的公允价值区间内；它不是外部投资人能靠公开信息独立复原的数字。 建设性结论是，Cover Genius
              很可能应相对增长较慢的既有巨头基准获得显著溢价。条件部分在于， 对完整披露估值的真正支撑仍取决于私有文件：这些文件需要显示业务到底更接近软件型编排，还是更接近高接触保险服务。
              因此，纪律严格的投委会应把当前估值标记视为可信谈判点，但在把它当成充分去风险的内在价值之前， 仍要要求收入质量、留存和下行保护的明确证据。这也是为什么这里的建议质量，更多取决于有纪律的情景框架和尽调闸门，
              而不是假装一个公开倍数就能定案。
