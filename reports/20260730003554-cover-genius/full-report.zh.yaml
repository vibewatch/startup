      - number: '2.2'
        title: TAM、SAM 与互相矛盾的规模测算口径
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据有用，但前提是保留其中的矛盾。Mordor 的 2025-2026 年市场规模比 Fortune 小一个数量级， Cover Genius 2024 和 2026
              年融资材料又引用了更宽的机会框架。差距很可能来自单位和类别边界不同：有些出版方强调近期嵌入式保险收入， 有些强调更广的保费机会，还有些把非保险保障放进同一个伞下。这意味着投资人不应把估算简单平均。更好的读法是：
              长期类别足够大，值得关注；但任一平台真正可服务的市场，都会受到伙伴适配、承保机构供给、产品治理、本地化和理赔运营约束。 对 Cover Genius 来说，最可辩护的 SAM
              位于全球数字品牌之中，覆盖旅行、零售、物流、票务、金融科技、出行和相邻垂直领域； 这些场景已经有结账流量，附加变现也重要。
