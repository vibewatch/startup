  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与伙伴联动风险
        blocks:
          - type: paragraph
            body: >-
              最清楚的风险类别是监管复杂性。Cover Genius 营销覆盖 60 多个国家和美国 50 州，这意味着公司处在许多交叠的行为、产品治理和分销制度中。
              留存的监管资料包凸显了这种碎片化：英国指引宽泛看待保险分销活动，EIOPA 强调欧洲范围内的产品治理和客户结果，
              澳大利亚拆分行为监管和审慎监管，美国保险规则仍以州为中心。对嵌入式保险平台来说，伙伴分销会放大这种复杂性。 即便 Cover Genius 正确提供基础设施，伙伴披露、摆放位置或 UX
              选择仍可能造成监管或行为问题。因此， 合规不是一次性牌照动作，而是一项操作系统级要求，必须随每个新伙伴和新市场扩展。正确尽调姿态是把这些视为带明确触发条件、
              可监控的运营风险，而不是抽象清单项。运营问题不在于这些风险理论上是否存在，而在于管理层能否衡量、排序并控制它们，
              且速度快过规模带来的新失效模式。即便公开记录方向上令人放心，投资人仍需要证据证明，风险缓释成熟度跟得上地域和产品扩张。
