      - number: '2.4'
        title: 增长驱动、约束与竞争压力
        blocks:
          - type: paragraph
            body: >-
              市场顺风是真实的。API-first 集成降低实验成本，个性化可能抬高附加率，伙伴自有分销也能减少直接获客负担。
              但约束同样真实。英国、欧盟、澳大利亚和美国州级体系之间的监管碎片化，让多国上线始终合规负担很重。消费者信任和售后理赔处理是另一道门槛变量，
              因为处理糟糕的嵌入式理赔会伤害产品本该保护的商户关系。竞争强度已经可见：Qover、bolttech、Wakam、Chubb、Assurant 等玩家， 都在营销嵌入式保障或数字保险能力。因此，正确的投资结论不是
              Cover Genius 受益于一个独一无二的大市场， 而是它身处一个结构性有吸引力的市场；执行速度、信任、本地许可和伙伴经济性，将决定它能否拿到持久份额。
