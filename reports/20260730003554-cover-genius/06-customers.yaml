chapter:
  number: 6
  title: Customers
  summary: "Cover Genius has crossed the threshold from impressive logo roster to credible public customer proof. The 2026 fundraising pack established large scale\u201470 million-plus protected customers, 240 million policies, and 200-plus partners\u2014while multiple case studies showed attach-rate, ancillary-revenue, and support improvements. The remaining diligence gap is durability: public sources are light on retention, concentration, and cohort quality."
sections:
- id: customer-scale-and-breadth
  title: Customer scale and breadth
  body: "The company\u2019s customer scale is unusually well signposted for a private insurtech. Official 2026 fundraising materials say Cover Genius has protected more than 70 million customers through 240 million policies, and they tie that reach to more than 200 distribution partners connected to 50-plus insurance carriers. The named partner roster spans global travel brands, fintechs, retailers, and marketplaces. That matters because it moves the conversation beyond anecdotal proof. Cover Genius is not presenting one showcase customer; it is presenting a broad platform footprint across multiple types of transaction journeys. The geographic spread of partnership announcements\u2014from APAC travel to DACH banking infrastructure\u2014further supports the view that this is a global B2B2C network. What the public pack does not show is how much of that scale is concentrated in a few very large platforms. The practical diligence consequence is that investors should separate visible production\
    \ proof from still-missing renewal, cohort, and concentration evidence before treating the customer story as fully de-risked. The practical diligence consequence is that investors should separate visible production proof from still-missing renewal, cohort, and concentration evidence before treating the customer story as fully de-risked. That is especially important in a B2B2C model, where public evidence can make scale look broad while still revealing little about renewal quality inside the installed base."
