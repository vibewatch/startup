- id: buyer-map-and-verdict
  title: Buyer map, durability, and verdict
  body: 'Public evidence suggests Cover Genius sells best to partners that already own high-intent traffic and want to add protection without becoming insurance operators themselves. The best-fit buyer appears to have transaction density, global reach, and some customer-support pain that faster claims and better orchestration can reduce. That is a compelling buyer map, but it does not eliminate two classic late-stage risks: concentration and durability. The public record is thin on churn, renewals, and top-account revenue share. It is also easier to verify marquee platforms than to assess the long tail of customers or the health of newer cohorts. As a result, the customer verdict is positive on breadth, named proof, and service capability, but incomplete on the metrics that would distinguish a durable platform franchise from a curated success portfolio. The practical diligence consequence is that investors should separate visible production proof from still-missing renewal, cohort, and concentration
    evidence before treating the customer story as fully de-risked. The practical diligence consequence is that investors should separate visible production proof from still-missing renewal, cohort, and concentration evidence before treating the customer story as fully de-risked. That is especially important in a B2B2C model, where public evidence can make scale look broad while still revealing little about renewal quality inside the installed base.'
