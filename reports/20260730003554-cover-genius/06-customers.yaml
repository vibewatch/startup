- id: quality-of-customer-proof
  title: Quality of customer proof
  body: "The strongest part of the customer chapter is the quality of the case-study evidence. Cover Genius repeatedly publishes named partner outcomes rather than only logo walls. Turkish Airlines reported a 400% attach-rate increase, Omio reported a 4x increase in ancillary revenue, Rhino reported a 7x increase in add-on sales, Luxury Escapes tied the partnership to 86% year-over-year travel revenue growth, and ShipRush reported meaningfully faster claims handling. That variety is important because it shows the value proposition is not restricted to one metric or one vertical. The XCover support case study and archived Trustpilot profile also add evidence that post-purchase support is part of the product\u2019s value. The adverse read is that every one of these items is curated marketing evidence. Without uncurated retention, complaints, and cohort data, the public story remains strong but selectively illuminated. The practical diligence consequence is that investors should separate visible\
    \ production proof from still-missing renewal, cohort, and concentration evidence before treating the customer story as fully de-risked. The practical diligence consequence is that investors should separate visible production proof from still-missing renewal, cohort, and concentration evidence before treating the customer story as fully de-risked. That is especially important in a B2B2C model, where public evidence can make scale look broad while still revealing little about renewal quality inside the installed base."
