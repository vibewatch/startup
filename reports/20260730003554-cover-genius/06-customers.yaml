- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Missing evidence
  - Why it matters
  - Minimum diligence ask
  rows:
  - - Renewal and churn by partner cohort
    - Separates sticky distribution from one-time launches
    - Request renewal schedules and cohort churn
  - - Top-partner concentration
    - Logo breadth can hide revenue concentration
    - Request top-10 partner revenue and policy shares
  - - Claims complaints / NPS by program
    - Trustpilot is too broad for program-level quality
    - Request complaint and NPS data by vertical
  - - Implementation timelines
    - Long enterprise launch cycles can slow growth
    - Request median time-to-launch by partner type
  - - Long-tail cohort health
    - Marquee logos may outperform the rest of the base
    - Request performance by size band and launch vintage
  notes: Every missing item is directly tied to underwriting customer durability rather than simply acknowledging that private companies disclose less.
