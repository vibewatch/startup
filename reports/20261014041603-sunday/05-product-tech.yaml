chapter:
  number: 5
  title: "Product & Technology"
  summary: "Sunday pairs an empirical in-home data collection loop centered on a $200 wearable Skill Capture Glove with ACT-2 imitation-learning foundation models to achieve a reported 99.1% laundry folding reliability in unfamiliar homes. Memo utilizes a wheeled torso design with a telescoping 2.1-meter reach and compliant dual grippers to optimize safety and energy efficiency over bipedal humanoid form factors. However, the path from hand-assembled $20,000 prototypes to a sub-$10,000 commercial product faces significant risks in unproven mass manufacturing economics, undisclosed long-horizon intervention rates, and domestic privacy constraints."
sections:
  - id: "product-definition-workflow"
    title: "Product Definition and Household Chore Workflow"
    body: |
      Sunday positions Memo as an autonomous domestic appliance engineered to reclaim household hours consumed by repetitive, dexterous chores. Rather than addressing broad industrial tasks or structured factory assembly, Memo is designed around the messy, unpredictable geometry of residential living spaces, focusing primarily on laundry folding, kitchen tidying, and dishwasher management. The operational benchmark for household robotics requires executing multi-step physical routines without site-specific human intervention or teleoperation. In demonstrated pilot sequences, Memo executes a 33-step Table-to-Dishwasher workflow comprising 68 dexterous interactions across 21 objects and 130 feet of indoor navigation, manipulating ceramic dinnerware, metal cutlery, food scraps, and delicate wine glasses.

      Household chore automation diverges fundamentally from industrial automation because items in domestic environments exhibit high variability, deformation, and partial occlusion. Clothing deforms unpredictably, plates vary in diameter, and dishwasher racks present irregular spatial geometries. While Sunday demonstrated foundational capabilities such as pulling espresso shots and organizing shoes, the company's near-term product focus concentrates on laundry folding as its first production-grade capability. However, long-horizon kitchen clearing tasks continue to exhibit higher failure sensitivity, requiring extensive perceptual reasoning and recovery policies before autonomous kitchen deployment can match the consistency demonstrated in textile folding.
    claimRefs:
      - "CE001"
      - "CE006"
      - "CE007"
