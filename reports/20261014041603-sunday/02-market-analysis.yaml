  title: Market Analysis
  summary: Sunday targets the consumer domestic robotics market, focusing on tedious household tasks like dishes and laundry
    with its wheeled Memo robot. While industrial and enterprise robotics address structured environments, domestic automation
    faces a steep $20,000 initial unit cost and real-home variance that constrain initial adoption to affluent early adopters.
sections:
- id: market-boundary-and-scope
  title: Market Boundary, Workload Scope, and Status-Quo Substitutes
  body: 'Sunday positions its flagship product Memo squarely within the nascent domestic assistance robotics sector, consciously
    separating itself from industrial automation and warehouse logistics. Rather than competing for factory material handling
    contracts where structured workflows and dedicated safety zones predominate, Sunday targets unstructured single-family
    residential living environments. Within this home boundary, Sunday focuses narrowly on high-friction daily chores: clearing
    dining tables, scraping food debris, loading dishwashers, folding laundry garments, and tidying misplaced personal items.
    By prioritizing manipulation of delicate domestic articles over raw industrial lifting capacity, Memo bypasses traditional
    industrial robotics specifications in favor of compliance and family safety. The status-quo substitutes for Sunday are
    not other autonomous mobile robots, but rather existing single-purpose white-goods appliances such as conventional dishwashers
    and washing machines, paired with outsourced professional cleaning labor and unpaid household domestic effort. For Memo
    to capture residential wallet share, it must coordinate effectively with these legacy appliances rather than demanding
    architectural home modifications.'
  claimRefs:
  - CM001
  - CM006
  - CM007
  tableRefs:
  - TM001
  figureRefs: []
- id: addressable-sizing-and-cost-realities
  title: Addressable Market Sizing, Cost Realities, and Economic Constraints
  body: Quantifying the market for general-purpose domestic robotics requires filtering speculative multi-trillion-dollar
    general artificial intelligence narratives through physical hardware cost structures. While venture investors priced Sunday
    at a $1.15 billion post-money valuation in March 2026 based on its potential to unlock consumer physical AI, the immediate
    serviceable addressable market is sharply constrained by prototype economics. Hand-assembled Memo units currently cost
    approximately $20,000 each to manufacture, reflecting expensive custom dual-gripper tooling, telescoping spinal actuators,
    sensor arrays, and low-volume component sourcing. Management has stated an explicit target retail price under $10,000
    once mass manufacturing takes effect. At a $10,000 capital price point amortized across 60 months, the robot represents
    roughly $167 per month, putting it in direct competition with high-end luxury appliances or second-car financing. Without
    widespread consumer financing infrastructure or subsidized hardware subscription contracts, the initial serviceable obtainable
    market remains restricted to affluent suburban households and early technology adopters capable of absorbing substantial
    upfront hardware outlays without guaranteed resale liquidity.
  claimRefs:
  - CM002
  - CM004
  - CM005
  - CM010
  - CM011
  - CM012
  - CM014
  tableRefs:
  - TM002
  figureRefs:
