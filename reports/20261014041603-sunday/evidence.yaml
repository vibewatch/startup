    severity: material
    topic: financial-kpis
    missingEvidence: Audited revenue run-rate, ARR, unit manufacturing costs at scale, and customer deposit figures for Memo.
    whyItMatters: >-
      Pre-revenue robotics valuation underwriting depends on gross margin trajectory, warranty reserves, and beta
      conversion economics.
    diligencePath: >-
      Request management accounts, bill of materials (BOM) cost accounting, and beta contract terms during formal
      sponsor due diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-bom
    missingEvidence: >-
      Audited bill-of-materials (BOM) breakdown, assembly labor costs, and component supplier terms demonstrating a
      viable path from $20,000 prototype cost to sub-$10,000 retail pricing.
    whyItMatters: >-
      Without public BOM disclosures or volume hardware gross margins, Sunday's commercial sustainability and pricing
      viability remain unverified venture hypotheses.
    diligencePath: >-
      Review vendor supply agreements, contract manufacturing quotes, and hardware teardowns during Series C or
      pre-commercial diligence.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: material
    topic: commercial-conversion-and-deposits
    missingEvidence: >-
      Binding paid deposit figures, contract cancellation terms, and customer willingness-to-pay studies beyond waitlist
      signups.
    whyItMatters: >-
      Waitlist volume of 1,000 individuals does not establish economic commitment or paid conversion rates at premium
      $10,000+ appliance price points.
    diligencePath: >-
      Obtain beta cohort conversion data, deposit collection policies, and customer cohort churn records directly from
      company management.
    relatedQuestionRefs:
      - QM003
  - type: missing-source
    severity: material
    topic: retail-pricing
    missingEvidence: >-
      Official retail price, consumer financing terms, or hardware subscription pricing for commercial mass-market Memo
      units.
    whyItMatters: >-
      Without final consumer pricing, Sunday's unit economics, gross margins, and customer payback cannot be modeled
      against competitor alternatives like Weave ($7,999) or 1X ($20,000).
    diligencePath: >-
      Review commercial launch filings, customer pre-order documentation, and pricing announcements prior to general
      availability in 2027.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: field-reliability
    missingEvidence: >-
      Real-world intervention rates, MTBF, teleoperation takeover frequency, and hardware degradation statistics from
      Founding Family beta deployments.
    whyItMatters: >-
      Internal 99.1% benchmark reliability on laundry folding in controlled homes may not translate to unassisted
      operation across edge-case customer homes.
    diligencePath: >-
      Request telemetry data, intervention logs, and customer support ticket frequency from the Fall 2026 Founding
      Family beta cohort.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Audited financial statements, monthly net cash burn rate, operating expense breakdown between R&D and operations,
      and forward cash runway under scaled commercialization.
    whyItMatters: >-
      Without verified cash burn and runway figures, investors cannot determine whether the $165 million Series B
      provides sufficient buffer to reach commercial production or if a dilutive intermediate financing will be needed.
    diligencePath: >-
      Request confidential management accounts, trailing 12-month cash flow statements, hiring plans, and capex budget
      schedules under NDA during diligence.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: hardware-bom-and-gross-margins
    missingEvidence: >-
      Detailed component bill of materials (BOM), outsourced contract manufacturing agreements, supplier yield rates,
      and post-beta unit cost reduction schedules.
    whyItMatters: >-
      Hand-assembled prototype unit costs of approximately $20,000 exceed the target sub-$10,000 retail price; failure
      to achieve at least 50% manufacturing cost reductions would generate deeply negative hardware gross margins.
    diligencePath: >-
      Inspect supplier quotes, manufacturing feasibility studies with contract manufacturers, and teardown BOM models
      during engineering review.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: commercial-pricing-and-warranty-liabilities
    missingEvidence: >-
      Finalized commercial pricing architecture, extended warranty terms, replacement unit reserve assumptions, and
      field technician servicing fee structures.
    whyItMatters: >-
      Deploying autonomous physical robots in domestic environments creates ongoing servicing and liability obligations
      that heavily impact lifecycle customer profitability.
    diligencePath: >-
      Review customer service contracts, customer support staffing plans, and product liability insurance underwriting
      terms.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: production-bom-and-margins
    missingEvidence: >-
      Audited production bill of materials, contract manufacturing agreements, and supply chain component costs for
      mass-production Memo units.
    whyItMatters: >-
      Current prototypes cost approximately $20,000 to assemble by hand, and Sunday's target retail price under $10,000
      depends on unverified 50% manufacturing cost reductions.
    diligencePath: >-
      Request manufacturing teardown schedules, supplier quotes for injection-molded tooling, and gross margin
      projections under volume production.
    relatedQuestionRefs:
      - QE002
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: beta-intervention-rates
    missingEvidence: >-
      Real-world mean time between failures (MTBF), teleoperation intervention rates, and autonomous recovery success
      rates during multi-hour household deployments.
    whyItMatters: >-
      Lab benchmarks showing 99.1% success on isolated laundry tasks do not establish end-to-end autonomous reliability
      across dynamic multi-room home environments.
    diligencePath: >-
      Review teleoperation intervention logs, incident tickets, and household disengagement metrics from the upcoming
      2026 Founding Family Beta deployments.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: data-retention-and-privacy
    missingEvidence: >-
      Formally documented customer privacy terms, in-home camera streaming controls, local versus cloud sensor
      processing boundaries, and certification roadmap.
    whyItMatters: >-
      Placing autonomous vision-equipped robots into private domestic spaces creates regulatory and consumer trust
      hurdles that cannot be resolved by marketing statements alone.
    diligencePath: >-
      Obtain the formal Founding Family Beta user agreement, security architecture audit reports, and SOC2 / consumer
      privacy compliance roadmaps.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: Actual household retention, daily active usage hours, and intervention rates from real-world domestic deployment.
    whyItMatters: >-
      Without field retention data, underwriting Sunday's $1.15 billion valuation relies entirely on pre-commercial demo
      figures.
    diligencePath: >-
      Review telemetry, intervention frequency, and cohort retention data from the Founding Family Beta following Fall
      2026 deployment.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: commercial-pricing-and-unit-economics
    missingEvidence: Final retail pricing model, warranty support costs, and recurring software subscription terms.
    whyItMatters: >-
      Determines customer acquisition friction, gross margin feasibility, and lifetime customer value relative to
      hardware BOM cost.
    diligencePath: Request Sunday's commercial GTM model and beta-to-paid conversion assumptions in management meetings.
  - type: missing-source
    severity: material
    topic: regulatory-safety-certification
    missingEvidence: >-
      Third-party consumer safety certifications (e.g., UL 1740, ISO 13482, ANSI/RIA R15.08) and formal product
      liability compliance filings for untethered domestic manipulation.
    whyItMatters: >-
      Unsupervised in-home deployment of a 170-pound motorized robot with articulating arms exposes Sunday to
      catastrophic product liability and regulatory stop-orders in the event of child injury or domestic property
      damage.
    diligencePath: >-
      Request Sunday's safety engineering test reports, NRTL certification roadmap, and product liability insurance
      underwriting terms during beta reviews.
    relatedQuestionRefs:
      - QR001
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: bom-cost-and-component-concentration
    missingEvidence: >-
      Detailed hardware bill of materials (BOM), supplier concentration for actuators and custom dual grippers, and
      volume manufacturing contracts required to reduce assembly cost from $20,000 to under $10,000.
    whyItMatters: >-
      Failure to cut production costs by at least 50% will compress hardware gross margins, force retail pricing into
      luxury-only tiers, or accelerate cash burn across the planned 2027 commercial rollout.
    diligencePath: >-
      Examine detailed BOM breakdowns, contract manufacturing agreements, and component yield metrics from the initial
      50-unit beta production batch.
    relatedQuestionRefs:
      - QR002
      - QR010
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: commercial-revenue-and-pricing
    missingEvidence: Official retail pricing, subscription software fees, reservation deposit terms, and converted customer billings.
    whyItMatters: >-
      Without commercial pricing or customer revenue, calculating price-to-sales multiples or operating margins is
      impossible, forcing an unknown valuation stance.
    diligencePath: >-
      Request management disclosure of Founding Family Beta conversion agreements, deposit policies, and commercial unit
      pricing schedules.
    relatedQuestionRefs:
      - QV003
