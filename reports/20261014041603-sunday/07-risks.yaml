chapter:
  number: 7
  title: "Risks"
  summary: "Sunday faces severe execution, unit economic, and consumer liability hurdles as it moves Memo from controlled demos to unsupervised homes. While its wheeled chassis and passive stability mitigate tipping hazards, scaling manufacturing below the $10,000 retail target and achieving multi-step chore reliability without remote teleoperation remain unproven in commercial deployments."
sections:
  - id: executive-risk-hierarchy
    title: "Executive Risk Ranking and Thesis-Break Hierarchy"
    body: "Sunday's transition from academic imitation learning breakthroughs to consumer home robotics concentrates risk around physical execution, unit economics, and consumer trust. While venture backers have funded Sunday with $200 million through an oversubscribed Series B round valuing the company at $1.15 billion, commercial success requires deploying a 170-pound motorized machine into unpredictable private residences. Laboratory-grade demonstrations fail to capture the combinatorial chaos of residential environments where furniture arrangements, lighting shifts, and child interactions disrupt autonomous task completion. Early beta deployments in late 2026 involve roughly fifty households, exposing the company to severe product liability and reputational damage if unmonitored failure modes occur. Because Sunday remains completely pre-revenue with zero disclosed commercial ARR or customer contracts, any protracted delay in achieving mass manufacturing below its $10,000 retail pricing ceiling threatens to trigger down-round valuations or severe capital constraints before volume shipments begin."
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR012
  - id: regulatory-compliance-safety-risks
    title: "Regulatory Compliance, Product Safety, and Domestic Privacy"
    body: "Deploying untethered autonomous manipulation into domestic living spaces introduces unprecedented regulatory scrutiny across consumer product safety and consumer surveillance. Memo incorporates passive physical stability through a low-center-of-gravity wheeled chassis that stays upright upon power interruption, combined with compliant joint actuation designed to allow physical redirection by occupants. However, public records indicate no formal third-party product safety certifications under robotics standards such as UL 1740 or ISO 13482, and Sunday has disclosed no granted public patents covering its core manipulation hardware. Furthermore, ambient domestic sensing using continuous cameras and microphones creates substantial exposure under state privacy and wiretapping statutes. Sunday mitigates privacy blowback by rejecting in-home human teleoperation in favor of pre-collected demonstration data from paid Memory Developers, but customer consent frameworks and domestic edge data security remain unverified regulatory diligence priorities."
    claimRefs:
      - CR002
      - CR010
      - CR011
    tableRefs:
      - TR001
  - id: operational-hardware-reliability-risks
    title: "Operational Execution, Long-Tail Generalization, and Field Failure Modes"
    body: "Operational vulnerability centers on the mathematical reality of compound task error rates across long-horizon chores. While Sunday's ACT-2 foundation model achieved an impressive 99.1% success rate across 785 autonomous laundry-folding attempts, that benchmark deliberately excluded complex edge cases such as socks, garment sorting, and drawer placement. Independent engineering assessments demonstrate that even a 1% per-operation error rate results in an average of one failure daily across a hundred domestic actions, manifesting as broken tableware, spilled liquids, or wedged mechanisms. Physical prototypes currently cost approximately $20,000 to hand-assemble, and scaling beyond low-volume prototyping requires tooling, precision custom dual grippers, and actuator supply chains that have not yet achieved industrial yield maturity. If unsupervised field reliability degrades during the late 2026 beta trials, Sunday faces intensive maintenance dispatch costs that software-only venture models cannot absorb."
    claimRefs:
      - CR006
      - CR007
      - CR015
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: capital-intensity-ecosystem-dependencies
    title: "Capital Intensity, Partner Dependencies, and Commercial Viability"
    body: "The financial architecture of consumer robotics merges the computing overhead of frontier artificial intelligence with the working capital intensity of precision hardware manufacturing. Sunday has rapidly expanded organizational headcount past 100 employees, growing engineering threefold and research fourfold to accelerate model deployment ahead of mass production. However, commercial viability depends on cutting manufacturing costs by at least 50% to hit target retail pricing under $10,000, while competing against well-funded bipedal and wheeled competitors like Figure AI and Weave Robotics. Historical precedents in domestic automation, including the insolvency of Seven Dreamers Laboratories and FoldiMate, illustrate that consumer willingness to pay collapses when machine throughput is slow or intervention requirements are frequent. If Sunday fails to demonstrate dependable autonomy and viable unit economics during its beta program, the company will face severe valuation compression when seeking the growth capital required for mass consumer tooling in 2027."
    claimRefs:
      - CR005
      - CR008
      - CR013
      - CR014
    tableRefs:
      - TR003
