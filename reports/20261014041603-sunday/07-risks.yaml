callouts:
  - calloutType: risk
    title: "The Multiplicative Failure Trap in Unsupervised Homes"
    body: "Even with laboratory task success rates reaching 99.1% for isolated laundry folding, compound multi-step domestic chores involving twenty or more sequential actions face exponential reliability decay. In an unsupervised household running dozens of operations daily, a single failure per hundred actions produces daily incidents such as dropped dishware, spilled liquids, or collision obstacles that undermine consumer trust and create direct product liability."
    claimRefs:
      - CR006
      - CR008
  - calloutType: recommendation
    title: "Diligence Priorities for Founding Family Beta Deployment"
    body: "Prospective investors and partners must track real-world intervention rates, remote operator escalation frequencies, and hardware repair turnaround times during the late 2026 beta rollout. Sunday's commitment to pure local autonomy without continuous in-home teleoperation establishes a strong consumer privacy posture, but field durability under adversarial domestic conditions remains the decisive underwriting hurdle."
    claimRefs:
      - CR004
      - CR007
      - CR010
