callouts:
  - calloutType: insight
    title: 'Contrarian Architecture: Data-First Mobile Torso'
    body: >-
      Sunday's core strategic divergence lies in prioritizing human-captured manipulation data over humanoid bipedalism.
      By deploying low-cost capture gloves and adopting a wheeled torso, Sunday reduced prototype build costs to
      approximately $20,000—substantially lower than industrial humanoids—while eliminating fall risks in domestic
      settings.
    claimRefs:
      - CO009
      - CO010
      - CO013
  - calloutType: risk
    title: 'Commercialization Hurdle: Unit Economics and Generalization'
    body: >-
      While Sunday achieved a $1.15 billion valuation in under two years, it remains pre-revenue with unproven unit
      economics. Achieving consumer price points below $10,000 requires substantial manufacturing cost reduction from
      the current $20,000 prototype level, while real-world household deployments introduce physical safety, liability,
      and out-of-distribution failure risks.
    claimRefs:
      - CO013
      - CO014
      - CO015
