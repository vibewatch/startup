- calloutType: risk
  title: Severe Unit Economics and Historical Mortality Risk
  body: Building hand-assembled Memo units costs approximately $20,000 today, creating a substantial negative margin profile against Sunday's sub-$10,000 aspirational retail target. Furthermore, two decades of domestic consumer robotics venture investments have repeatedly failed due to edge-case unreliability and prohibitive support burdens.
