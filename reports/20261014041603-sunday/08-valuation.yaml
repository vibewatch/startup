- calloutType: recommendation
  title: 'Recommendation: Research-More at Unknown Valuation Stance'
  body: While Sunday has built a differentiated data flywheel and assembled $200 million in total venture backing from premier investors, its $1.15 billion headline valuation is entirely unsupported by commercial operating metrics. Investors should track Founding Family Beta conversion, hardware BOM reduction, and intervention rates before committing growth capital.
