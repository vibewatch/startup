- id: TV003
  title: Scenario Analysis, Assumptions, and Downside Triggers
  columns:
  - Scenario
  - Operating & Commercial Assumptions
  - Valuation & Return Logic
  - Downside Triggers & Kill Criteria
  rows:
  - - Bull Case (20% probability)
    - Beta achieves 99%+ autonomous task completion; BOM drops to $4,000; 10,000 units sold at $9,999 in 2027-2028
    - Valuation expands to $3.0B-$5.0B as category-defining consumer AI hardware platform (3x-4.5x return)
    - Severe in-home safety failure, property damage, or consumer backlash regarding in-home camera privacy
  - - Base Case (50% probability)
    - Beta reveals frequent edge-case jams; Memo requires teleoperation assistance; unit price set at $12,000-$15,000
    - Valuation flat at $1.0B-$1.2B; requires extension financing round to fund hardware re-engineering
    - Hardware manufacturing scrap rates exceed 20%; customer churn from beta exceeds 40% within 90 days
  - - Bear Case (30% probability)
    - Manufacturing fails to scale below $18,000; beta households disengage; consumer conversion stalls under 10%
    - Valuation compresses to liquidation/down-round mark under $300M (75%+ capital impairment)
    - Series B preference overhang triggers recapitalization or fire-sale asset acquisition by tech conglomerate
  notes: Probabilities and valuation multiples reflect venture synthesis for pre-revenue deep-tech consumer hardware based on available financing benchmarks.
