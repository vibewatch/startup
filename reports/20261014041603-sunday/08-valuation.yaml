company:
  name: Sunday
chapter:
  number: 8
  title: Valuation
  summary: Sunday attained a post-money valuation of $1.15 billion in March 2026 following a $165 million Series B financing round led by Coatue, bringing total private capital raised to $200 million. However, the company remains strictly pre-revenue ahead of its late 2026 Founding Family Beta deployment, leaving public evidence without verified billings, gross margins, or customer unit economics. Consequently, the diligence recommendation is research-more with an unknown valuation stance and high risk rating pending real-home operating data.
sections:
- id: investment-thesis-and-recommendation
  title: Investment Thesis, Stance, and Recommendation
  body: 'Sunday presents a compelling theoretical thesis in consumer Physical AI, positing that scalable in-the-wild manipulation data captured via its proprietary Skill Capture Glove will overcome the classic deployment barrier in household robotics. By co-designing human demonstration hardware with its wheeled Memo platform and employing the ACT-1 foundation model, Sunday reached an oversubscribed $165 million Series B round at a $1.15 billion valuation in March 2026. Top-tier venture sponsors including Coatue, Benchmark, Bain Capital Ventures, Fidelity, Tiger Global, and Conviction have endorsed this data-first architecture.


    Nevertheless, the anti-thesis remains severe: household robotics has absorbed billions of dollars in historical venture investment over twenty years without yielding a single commercially viable consumer product. Sunday is pre-revenue and enters an unvalidated consumer market where Memo''s commercial manufacturing cost stands at approximately $20,000 per unit by hand versus an aspirational sub-$10,000 retail price. Because customer deposit volume, billings conversion, warranty liabilities, and unit economics remain undisclosed, the investment recommendation is research-more, accompanied by a high risk rating and an unknown valuation stance rather than false precision.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
