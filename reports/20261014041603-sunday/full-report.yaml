      - number: '7.3'
        title: Operational Execution, Long-Tail Generalization, and Field Failure Modes
        blocks:
          - type: paragraph
            body: >-
              Operational vulnerability centers on the mathematical reality of compound task error rates across
              long-horizon chores. While Sunday's ACT-2 foundation model achieved an impressive 99.1% success rate
              across 785 autonomous laundry-folding attempts, that benchmark deliberately excluded complex edge cases
              such as socks, garment sorting, and drawer placement. Independent engineering assessments demonstrate that
              even a 1% per-operation error rate results in an average of one failure daily across a hundred domestic
              actions, manifesting as broken tableware, spilled liquids, or wedged mechanisms. Physical prototypes
              currently cost approximately $20,000 to hand-assemble, and scaling beyond low-volume prototyping requires
              tooling, precision custom dual grippers, and actuator supply chains that have not yet achieved industrial
              yield maturity. If unsupervised field reliability degrades during the late 2026 beta trials, Sunday faces
              intensive maintenance dispatch costs that software-only venture models cannot absorb.
            claimRefs:
