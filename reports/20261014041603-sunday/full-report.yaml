      - number: '7.4'
        title: Capital Intensity, Partner Dependencies, and Commercial Viability
        blocks:
          - type: paragraph
            body: >-
              The financial architecture of consumer robotics merges the computing overhead of frontier artificial
              intelligence with the working capital intensity of precision hardware manufacturing. Sunday has rapidly
              expanded organizational headcount past 100 employees, growing engineering threefold and research fourfold
              to accelerate model deployment ahead of mass production. However, commercial viability depends on cutting
              manufacturing costs by at least 50% to hit target retail pricing under $10,000, while competing against
              well-funded bipedal and wheeled competitors like Figure AI and Weave Robotics. Historical precedents in
              domestic automation, including the insolvency of Seven Dreamers Laboratories and FoldiMate, illustrate
              that consumer willingness to pay collapses when machine throughput is slow or intervention requirements
              are frequent. If Sunday fails to demonstrate dependable autonomy and viable unit economics during its beta
              program, the company will face severe valuation compression when seeking the growth capital required for
              mass consumer tooling in 2027.
