  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Ranking and Thesis-Break Hierarchy
        blocks:
          - type: paragraph
            body: >-
              Sunday's transition from academic imitation learning breakthroughs to consumer home robotics concentrates
              risk around physical execution, unit economics, and consumer trust. While venture backers have funded
              Sunday with $200 million through an oversubscribed Series B round valuing the company at $1.15 billion,
              commercial success requires deploying a 170-pound motorized machine into unpredictable private residences.
              Laboratory-grade demonstrations fail to capture the combinatorial chaos of residential environments where
              furniture arrangements, lighting shifts, and child interactions disrupt autonomous task completion. Early
              beta deployments in late 2026 involve roughly fifty households, exposing the company to severe product
              liability and reputational damage if unmonitored failure modes occur. Because Sunday remains completely
              pre-revenue with zero disclosed commercial ARR or customer contracts, any protracted delay in achieving
              mass manufacturing below its $10,000 retail pricing ceiling threatens to trigger down-round valuations or
              severe capital constraints before volume shipments begin.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR012
      - number: '7.2'
        title: Regulatory Compliance, Product Safety, and Domestic Privacy
        blocks:
          - type: paragraph
            body: >-
              Deploying untethered autonomous manipulation into domestic living spaces introduces unprecedented
              regulatory scrutiny across consumer product safety and consumer surveillance. Memo incorporates passive
              physical stability through a low-center-of-gravity wheeled chassis that stays upright upon power
              interruption, combined with compliant joint actuation designed to allow physical redirection by occupants.
              However, public records indicate no formal third-party product safety certifications under robotics
              standards such as UL 1740 or ISO 13482, and Sunday has disclosed no granted public patents covering its
              core manipulation hardware. Furthermore, ambient domestic sensing using continuous cameras and microphones
              creates substantial exposure under state privacy and wiretapping statutes. Sunday mitigates privacy
              blowback by rejecting in-home human teleoperation in favor of pre-collected demonstration data from paid
              Memory Developers, but customer consent frameworks and domestic edge data security remain unverified
              regulatory diligence priorities.
            claimRefs:
              - CR002
              - CR010
              - CR011
