      - number: '6.4'
        title: Retention Durability, Churn Risks, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The central diligence hurdle for Sunday lies in customer retention durability and unit economics rather
              than top-of-funnel consumer curiosity. In domestic settings where a robot must execute dozens of
              sequential physical actions daily, even an impressive 99.1% task reliability rate mathematically implies
              an operational failure approximately once every 100 actions, leading to daily dropped tableware, stalled
              laundry piles, or trapped navigation in cluttered rooms. Domestic robotics history underscores this
              durability challenge: heavily capitalized pioneers like Seven Dreamers Laboratories and FoldiMate folded
              after failing to solve the gap between automated demos and reliable domestic utility. Compounding this
              challenge, Memo prototype manufacturing costs approximately $20,000 per unit today against an unannounced
              retail price targeted under $10,000, leaving customer acquisition payback and recurring subscription
              margins highly speculative.
            claimRefs:
              - CU012
              - CU013
              - CU014
