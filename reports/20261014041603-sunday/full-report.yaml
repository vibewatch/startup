      - number: '5.3'
        title: Physical AI Foundation Models and the In-Home Data Flywheel
        blocks:
          - type: paragraph
            body: >
              Sunday's core technological differentiation originates from the synthesis of its co-founders' foundational
              academic research in robot imitation learning. Chief Executive Tony Zhao co-developed ALOHA, Mobile ALOHA,
              and Action Chunking with Transformers (ACT) at Stanford, establishing methods for robots to learn
              multi-second action trajectories rather than isolated motor steps. Chief Technology Officer Cheng Chi
              pioneered Diffusion Policy and the Universal Manipulation Interface (UMI) at Columbia and Stanford,
              establishing generative diffusion techniques for multi-modal action generation and decoupling
              demonstration capture from physical robot hardware. Sunday operationalizes these academic breakthroughs
              into a commercial physical AI stack centered on the proprietary Skill Capture Glove.


              Traditional robot learning relies on remote teleoperation rigs that cost upwards of $20,000 per unit,
              creating a severe capital bottleneck that constrains training dataset size. Sunday replaces this setup
              with an instrumented, low-cost wearable glove costing roughly $200 to produce, which mirrors Memo's hand
              kinematics and sensor placement. Sunday distributes thousands of these gloves to a remote crowdsourced
              network of more than 500 Memory Developers across U.S. households, who record authentic daily chores in
              their own homes. The recorded multi-modal interactions are processed through Skill Transform, a
              proprietary software pipeline that retargets human kinematics and compensates for visual embodiment gaps
              with a 90% conversion yield. This pipeline fed ACT-1 with over 10 million real-world episodes, enabling
              the foundation model to train on zero physical robot teleoperation data.
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE014
              - CE015
