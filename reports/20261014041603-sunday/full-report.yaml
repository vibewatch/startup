      - number: '2.3'
        title: Buyer Segmentation, Workflow Friction, and Early Adopter Economics
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of autonomous household robotics follows a pronounced multi-stage customer
              segmentation trajectory. Sunday's immediate launch customer cohort is defined by its Founding Family Beta
              program, which plans to deploy individually numbered Memo units to approximately 50 selected households in
              late 2026. This beachhead segment consists of self-selected tech-enthusiast families willing to
              accommodate pre-commercial operational friction, occasional teleoperation interventions, and diagnostic
              software updates in exchange for priority access to domestic automation. Beyond the beta group, the
              primary target buyer is the dual-income professional household experiencing severe time poverty from daily
              domestic chores. In this segment, the economic buyer and daily user reside under the same roof,
              simplifying procurement dynamics compared to enterprise software. However, workflow friction remains
              substantial: residential kitchens feature diverse counter heights, fragile stemware, cluttered floor
              surfaces, and unpredictably placed furniture. Adoption triggers will depend heavily on Memo achieving
              near-perfect reliability on bounded chores such as dish loading without requiring human pre-sorting or
              constant supervision.
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM013
