  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Sunday presents a compelling theoretical thesis in consumer Physical AI, positing that scalable
              in-the-wild manipulation data captured via its proprietary Skill Capture Glove will overcome the classic
              deployment barrier in household robotics. By co-designing human demonstration hardware with its wheeled
              Memo platform and employing the ACT-1 foundation model, Sunday reached an oversubscribed $165 million
              Series B round at a $1.15 billion valuation in March 2026. Top-tier venture sponsors including Coatue,
              Benchmark, Bain Capital Ventures, Fidelity, Tiger Global, and Conviction have endorsed this data-first
              architecture.


              Nevertheless, the anti-thesis remains severe: household robotics has absorbed billions of dollars in
              historical venture investment over twenty years without yielding a single commercially viable consumer
              product. Sunday is pre-revenue and enters an unvalidated consumer market where Memo's commercial
              manufacturing cost stands at approximately $20,000 per unit by hand versus an aspirational sub-$10,000
              retail price. Because customer deposit volume, billings conversion, warranty liabilities, and unit
              economics remain undisclosed, the investment recommendation is research-more, accompanied by a high risk
              rating and an unknown valuation stance rather than false precision.
            claimRefs:
