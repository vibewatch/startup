          - type: callout
            title: Domestic Utility vs. Anthropomorphic Form Factor Trade-Off
            body: >-
              Sunday's deliberate rejection of a bipedal humanoid architecture in favor of a wheeled chassis with a
              telescoping spine avoids balance instability and reduces hardware cost, optimizing specifically for
              domestic table-clearing and dish-loading workflows.
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Domestic Robotics Landscape and Form-Factor Divergence
        blocks:
          - type: paragraph
            body: >-
              The robotics industry in 2026 has fractured into two fundamentally divergent architectural approaches to
              general-purpose manipulation. On one side stand well-funded humanoid generalists including Tesla Optimus,
              Figure AI, and 1X Technologies, which champion bipedal anthropomorphism to navigate environments built for
              human locomotion. On the opposite side stands Sunday, which deliberately rejects the humanoid form factor
              in favor of a domestic-first, utilitarian machine named Memo. Standing 1.7 meters tall and weighing 170
              pounds, Memo foregoes bipedal walking to move on a stable wheeled base paired with a telescoping vertical
              Z-axis spine reaching from the floor to 2.1 meters. By trading the ability to traverse multi-story
              staircases for a four-hour single-charge runtime, low manufacturing complexity, and passive physical
              stability that prevents catastrophic falls when powered down, Sunday addresses the severe safety and
              liability constraints inherent to active domestic households. Competitors targeting factory floors accept
              heavy hydraulic or high-torque electric bipedal frames because industrial environments tolerate safety
              cages and strict perimeter barriers. In contrast, residential households demand compliant control where a
              machine yields immediately to human contact, making Sunday's form-factor trade-off a deliberate
              operational moat against industrial humanoid incumbents.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
      - number: '3.2'
        title: Capability Matrix and the Autonomy Divergence
        blocks:
          - type: paragraph
            body: >-
              The central bottleneck in physical artificial intelligence has long been the scarcity of high-fidelity
              manipulation data in unstructured, cluttered environments. Sunday bypasses conventional $20,000
              teleoperation rigs and simulated environments by deploying lightweight $200 Skill Capture Gloves to
              hundreds of remote Memory Developers, collecting over ten million genuine chore episodes across authentic
              home layouts. This data engine powers the ACT-1 and ACT-2 imitation learning models, achieving a reported
              99.1% success rate across 785 laundry folding trials spanning nine distinct clothing types without
              per-home fine-tuning. This technical architecture contrasts sharply with Sunday's closest direct wheeled
              peer, Weave Robotics. While Weave has deployed its Isaac fleet to fold commercial laundry using active
              remote human teleoperation whenever automated policies stall, Sunday explicitly excludes in-home human
              teleoperation and surveillance streaming from customer residences. Sunday's pure autonomy philosophy
              establishes a compelling consumer privacy posture, but it leaves the company exposed to real-world edge
              cases where unassisted manipulation failure requires physical user intervention rather than seamless
              remote recovery.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
