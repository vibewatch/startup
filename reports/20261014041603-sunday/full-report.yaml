      - number: '4.2'
        title: Unit Economics, Hardware Cost Structure, and Margin Path
        blocks:
          - type: paragraph
            body: >-
              Memo's underlying unit economics currently present a severe gross margin deficit that can only be resolved
              through volume manufacturing. Hand-assembled prototype units cost approximately $20,000 to produce due to
              specialized dual grippers, custom polymer cladding, and low-volume actuator procurement. While Sunday
              projects a minimum 50% cost reduction at scale to bring production costs below $10,000, industry observers
              emphasize that selling hardware at or near target retail pricing would produce negative or negligible
              gross margins unless component supply chains compress dramatically. On the data collection side, Sunday
              achieves strong capital efficiency by deploying $200 Skill Capture Gloves rather than $20,000
              teleoperation rigs, compensating crowdsourced Memory Developers at $30 to $60 per approved hour.
              Nevertheless, compounding error rates across multi-step chores pose unmodeled warranty and servicing
              liabilities that could degrade unit economics after retail deployment.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
