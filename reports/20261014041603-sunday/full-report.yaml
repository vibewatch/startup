  - id: TV002
    title: Investment Thesis and Anti-Thesis Drivers
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Vulnerability
      - What Would Change View
    rows:
      - - Data Collection Moat
        - Low-cost Skill Capture Glove enables diverse domestic motion collection in real homes at scale
        - Human demonstration data does not guarantee autonomous long-horizon reliability in unmapped homes
        - Independent verification of zero-shot generalization across 100+ unconstrained customer homes
      - - Hardware Form Factor
        - Wheeled chassis with passive stability avoids bipedal falling hazards and reduces mechanical complexity
        - Inability to climb stairs restricts total addressable multi-level domestic deployment spaces
        - Evidence of single-floor consumer willingness to pay exceeding hardware amortization costs
      - - Unit Economics & Pricing
        - Aspirational sub-$10,000 retail price positions Memo as an accessible domestic luxury appliance
        - Current hand-assembly prototype cost is $20,000, creating negative gross margins without massive volume
        - Audited bill-of-materials and contract manufacturing agreement achieving sub-$5,000 production cost
      - - Operating Cash Burn
        - Over $165M in Series B capital provides runway to stop demonstrations and execute initial deployment
        - Remote Memory Developers paid $30-$60/hr plus 100+ headcount create rapid pre-revenue cash burn
        - Disclosed commercial subscription or upfront pricing model delivering positive contribution margin
      - - Market Feasibility
        - 1,000+ waitlist applicants indicate strong early enthusiast interest for domestic chore automation
        - Historical consumer robotics has burned billions without producing a commercial market winner
        - Conversion of waitlist applicants into non-refundable paid orders with sustained daily active usage
    notes: >-
      Evaluates thesis versus anti-thesis pillars based on public announcements, technical releases, and labor postings
