      - number: '6.3'
        title: Customer Proof, Pilot Reality, and Operational Limitations
        blocks:
          - type: paragraph
            body: >-
              Despite intense market enthusiasm and unicorn financing, Sunday has not yet placed a single commercial
              unit in a customer home, remaining pre-revenue with zero paying accounts. Customer proof is currently
              limited to prospective interest in the planned 50-unit Founding Family Beta and data-gathering workflows
              conducted by paid Memory Developer contractors wearing Skill Capture Gloves. Furthermore, Sunday's
              operational philosophy diverges sharply from domestic robotics peers such as Weave Robotics: while Weave
              deploys robots backed by remote human teleoperators who intervene in real time, Sunday commits strictly to
              autonomous physical AI execution without live in-home teleoperation. This pure autonomy stance raises the
              operational bar, requiring Memo to succeed in unstructured domestic environments without an active
              human-in-the-loop fallback.
