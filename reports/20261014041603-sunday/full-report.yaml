            title: 'Contrarian Architecture: Data-First Mobile Torso'
            body: >-
              Sunday's core strategic divergence lies in prioritizing human-captured manipulation data over humanoid
              bipedalism. By deploying low-cost capture gloves and adopting a wheeled torso, Sunday reduced prototype
              build costs to approximately $20,000—substantially lower than industrial humanoids—while eliminating fall
              risks in domestic settings.
