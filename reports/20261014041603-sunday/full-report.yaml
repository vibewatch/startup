      - number: '5.2'
        title: Mechanical Architecture, Mobility, and Physical Safety
        blocks:
          - type: paragraph
            body: >
              Memo deviates decisively from the anthropomorphic bipedal designs favored by humanoid competitors like
              Figure and Tesla, adopting a wheeled mobile base paired with a vertical-lift torso. The physical chassis
              stands 1.7 meters tall, weighs approximately 77 kilograms (170 lbs), and incorporates a telescoping Z-axis
              spine capable of extending vertical reach from floor level to 2.1 meters (6 feet 10 inches). This
              mechanical layout allows Memo to pick up discarded objects from rugs and reach elevated kitchen shelving
              without expending energy on bipedal dynamic balance. The wheeled architecture eliminates catastrophic fall
              risks, optimizes battery efficiency to deliver a 4-hour runtime from a 1-hour fast charge, and
              substantially reduces mechanical actuator count.


              Safety within residential environments is anchored on compliant actuation and passive structural
              stability. Memo's multi-degree-of-freedom arms utilize compliant control loops, permitting human occupants
              or children to physically push the limbs aside without meeting rigid resistance. In the event of sudden
              power loss, Memo's low center of gravity and stable wheelbase prevent the robot from toppling or
              collapsing under its own weight. Instead of human-like five-fingered hands, Memo utilizes custom
              three-fingered compliant grippers engineered to mirror the functional grasp geometry of human fingers.
              This reduces motor complexity and failure points while retaining the tactile dexterity required to grasp
              fragile glassware and manipulate soft textiles. Hand-built prototypes currently cost approximately $20,000
              each, presenting a major manufacturing scaling challenge.
            claimRefs:
              - CE002
              - CE003
              - CE010
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
