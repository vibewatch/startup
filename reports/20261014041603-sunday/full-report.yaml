      - number: '5.4'
        title: Generalization Benchmarks, Solve Standard, and Failure Recovery
        blocks:
          - type: paragraph
            body: >
              In July 2026, Sunday unveiled ACT-2, an advanced foundation model targeting the persistent generalization
              gap that plagues robotics: the tendency of models trained in laboratory environments to fail when deployed
              in unfamiliar homes. Sunday evaluated ACT-2 across 785 autonomous laundry folding trials across nine
              distinct clothing categories in real-world homes excluded from training. Memo achieved 778 successful
              folds, representing an aggregate 99.1% success rate (standard error ±0.3%) and an average aesthetic
              quality score of 4.72 out of 5 stars under a strict defect deduction rubric. Success rates reached 100% on
              shorts and polo shirts, 99.0% on T-shirts, and 94.7% on lightweight blouses, which presented higher
              handling friction due to material flimsiness.


              Crucially, Sunday demonstrated that scaling diverse pretraining data systematically compresses the
              out-of-domain generalization gap. In internal ablation experiments, models trained without pretraining
              data exhibited a 96% in-domain lab success rate but plummeted to 14% in unfamiliar environments (an
              82-point generalization penalty). Scaling pretraining data to 100% eliminated this gap entirely under test
              conditions. Furthermore, ACT-2 demonstrated single-demonstration supervised fine-tuning, learning novel
              folding styles from a single human example and successfully applying them across unseen garments. To
              establish rigorous industry accountability, Sunday introduced the Solve framework, advocating that robotic
              capabilities be measured by verified autonomy rates across unseen environments rather than curated
              highlight videos.
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE012
      - number: '5.5'
        title: Deployment Trajectory, Production Economics, and Diligence Risks
        blocks:
          - type: paragraph
            body: >
              Supported by an oversubscribed $165 million Series B financing round in March 2026 that valued Sunday at
              $1.15 billion, the company is shifting resources from research demonstrations toward commercial
              deployment. Sunday plans to deploy approximately 50 numbered Memo units to early adopters through its
              Founding Family Beta in late 2026, targeting initial deliveries around Thanksgiving 2026. This beta
              deployment serves as an empirical validation laboratory to evaluate unscripted household edge cases,
              including children, pets, spilled liquids, ambient lighting shifts, and Wi-Fi latency, while testing
              long-term mechanical reliability before initiating broader consumer hardware production.


              Despite technical progress, significant commercial and operational hurdles remain unresolved for
              underwriting. Unit manufacturing costs currently sit near $20,000 for custom-machined prototypes; Sunday
              projects that transitioning to injection-molded volume tooling could reduce production costs below
              $10,000, but tooling schedules and supplier contracts remain undisclosed. Additionally, placing
              vision-equipped robots into private homes creates substantial privacy sensitivities. While Sunday
              emphasizes that Memo runs autonomous policies without live human teleoperator feeds, formal security
              certifications, on-device data redaction protocols, and cloud transmission boundaries have not been
              publicly audited. Furthermore, the absence of public patents suggests Sunday's intellectual property rests
              heavily on trade secrets in glove hardware and data transformation pipelines.
            claimRefs:
              - CE002
              - CE008
              - CE010
              - CE013
      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital-Efficient Data Flywheel via Wearable Gloves
            body: >-
              By substituting $20,000 in-home teleoperation rigs with $200 wearable Skill Capture Gloves distributed
              across more than 500 private households, Sunday decouples physical data collection scale from expensive
              robot fleet deployments, accumulating over 10 million authentic household manipulation episodes.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
          - type: callout
            title: Unproven Volume Manufacturing Economics and In-Home Intervention Rates
            body: >-
              Memo's current hand-built prototype cost of approximately $20,000 requires an unverified 50% cost
              reduction to achieve Sunday's sub-$10,000 commercial retail target, while public reliability benchmarks in
              controlled laundry folding have not yet demonstrated multi-hour autonomous uptime or acceptable
              teleoperation intervention rates in chaotic household environments.
            calloutType: risk
            claimRefs:
              - CE002
              - CE007
              - CE008
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Target Household Profile
        blocks:
          - type: paragraph
            body: >-
              Sunday targets residential consumer households for domestic chore automation, deliberately bypassing
              commercial hospitality, healthcare, or industrial warehouse logistics. The company concentrates its
              go-to-market design on high-income single-family homeowners and dual-earner families who face persistent
              daily time constraints around routine chores such as laundry folding, table clearing, and kitchen tidying.
              Because consumer robotics hardware carries inherent deployment complexities, Sunday recognizes that early
              customer adoption will center on technology enthusiasts who are motivated to live alongside early-stage
              autonomous systems and are willing to tolerate occasional operational hiccups. In contrast to enterprise
              software or B2B hardware, Sunday possesses no commercial contract structures, enterprise procurement
              channels, or SLA commitments, focusing exclusively on establishing a direct consumer relationship.
