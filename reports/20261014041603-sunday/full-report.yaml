              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.2'
        title: Executive Leadership, Pedigree, and Governance
        blocks:
          - type: paragraph
            body: >-
              Sunday's technical credibility and rapid capitalization trace directly to the elite research pedigrees of
              its founding team. Co-founder and Chief Executive Officer Tony Zhao earned his Electrical Engineering and
              Computer Science degree from UC Berkeley before entering Stanford University's CS PhD program, where he
              was advised by leading robot learning researchers Sergey Levine and Chelsea Finn. Zhao gained widespread
              recognition within the robotics community as the principal architect of the open-source ALOHA low-cost
              teleoperation system, followed by research appointments at Google DeepMind and Tesla Autopilot prior to
              dropping out of Stanford to launch Sunday. Co-founder and Chief Technology Officer Cheng Chi completed his
              doctoral dissertation in computer science at Columbia University under Shuran Song, where he invented
              Diffusion Policy, one of the most widely adopted imitation learning formulations in modern manipulation
              robotics, earning multiple Best Paper accolades. Corporate governance reflects institutional venture
              sponsorship; following Sunday's Series B financing in March 2026, Coatue Management co-founder Thomas
              Laffont formally joined the board of directors, providing late-stage scaling oversight.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO007
      - number: '1.3'
        title: Capitalization History and Stakeholder Landscape
        blocks:
          - type: paragraph
            body: >-
              Sunday has raised approximately $200 million in total equity financing across two institutional rounds
              within twenty-three months of inception. The company secured an initial seed financing round of
              approximately $35 million led by venture capital firms Benchmark and Conviction to finance initial
              hardware prototyping, glove manufacturing, and stealth data operations. On March 12, 2026, Sunday
              announced an oversubscribed $165 million Series B financing round at a post-money valuation of $1.15
              billion, establishing unicorn status at one of the fastest paces in consumer robotics history. The Series
              B round was led by Coatue Management, with participation from crossover and growth institutions including
              Bain Capital Ventures, Fidelity Management & Research Company, Tiger Global, Benchmark, Conviction, and
              Xtal Ventures. The syndicate combines Tier-1 consumer venture backing from Benchmark with deep-tech growth
              capital from Coatue and Fidelity. However, complete shareholder rights, secondary transactions, and
              liquidation preferences remain private, and Sunday has disclosed no commercial subscription revenue or
              paid customer deposits to support this valuation.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO007
              - CO008
      - number: '1.4'
        title: Operational Scale, Milestones, and Risk Profile
        blocks:
          - type: paragraph
            body: >-
              Sunday's core competitive asset is an operational data collection apparatus rather than conventional
              teleoperation fleets. To train its ACT foundation models without simulated or synthetic data, Sunday
              deployed more than 2,000 patented Skill Capture Gloves to hundreds of remote Memory Developers across
              United States households, paying $30 to $60 per hour to record authentic domestic routines. This
              operational pipeline amassed over 10 million real-world interaction episodes across 500 homes. Core
              full-time headcount expanded from the original two founders in an apartment to roughly 30 to 50
              specialized robotics and machine learning engineers, while contractor hiring rosters indicate broader
              distributed operations. Sunday has targeted late 2026 for its Founding Family Beta deployment across 50
              households, with full commercial shipments planned by Thanksgiving 2026. Nevertheless, external critics
              emphasize substantial hurdles: prototype build costs currently hover around $20,000 against a sub-$10,000
              retail target, and real-home beta deployments create unresolved safety, property liability, and
              out-of-distribution model generalization risks.
            claimRefs:
