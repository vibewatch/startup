  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workload Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Sunday positions its flagship product Memo squarely within the nascent domestic assistance robotics
              sector, consciously separating itself from industrial automation and warehouse logistics. Rather than
              competing for factory material handling contracts where structured workflows and dedicated safety zones
              predominate, Sunday targets unstructured single-family residential living environments. Within this home
              boundary, Sunday focuses narrowly on high-friction daily chores: clearing dining tables, scraping food
              debris, loading dishwashers, folding laundry garments, and tidying misplaced personal items. By
              prioritizing manipulation of delicate domestic articles over raw industrial lifting capacity, Memo
              bypasses traditional industrial robotics specifications in favor of compliance and family safety. The
              status-quo substitutes for Sunday are not other autonomous mobile robots, but rather existing
              single-purpose white-goods appliances such as conventional dishwashers and washing machines, paired with
              outsourced professional cleaning labor and unpaid household domestic effort. For Memo to capture
              residential wallet share, it must coordinate effectively with these legacy appliances rather than
              demanding architectural home modifications.
            claimRefs:
              - CM001
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
      - number: '2.2'
        title: Addressable Market Sizing, Cost Realities, and Economic Constraints
        blocks:
          - type: paragraph
            body: >-
              Quantifying the market for general-purpose domestic robotics requires filtering speculative
              multi-trillion-dollar general artificial intelligence narratives through physical hardware cost
              structures. While venture investors priced Sunday at a $1.15 billion post-money valuation in March 2026
              based on its potential to unlock consumer physical AI, the immediate serviceable addressable market is
              sharply constrained by prototype economics. Hand-assembled Memo units currently cost approximately $20,000
              each to manufacture, reflecting expensive custom dual-gripper tooling, telescoping spinal actuators,
              sensor arrays, and low-volume component sourcing. Management has stated an explicit target retail price
              under $10,000 once mass manufacturing takes effect. At a $10,000 capital price point amortized across 60
              months, the robot represents roughly $167 per month, putting it in direct competition with high-end luxury
              appliances or second-car financing. Without widespread consumer financing infrastructure or subsidized
              hardware subscription contracts, the initial serviceable obtainable market remains restricted to affluent
              suburban households and early technology adopters capable of absorbing substantial upfront hardware
              outlays without guaranteed resale liquidity.
            claimRefs:
