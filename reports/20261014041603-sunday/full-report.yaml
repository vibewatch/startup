      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Multiplicative Failure Trap in Unsupervised Homes
            body: >-
              Even with laboratory task success rates reaching 99.1% for isolated laundry folding, compound multi-step
              domestic chores involving twenty or more sequential actions face exponential reliability decay. In an
              unsupervised household running dozens of operations daily, a single failure per hundred actions produces
              daily incidents such as dropped dishware, spilled liquids, or collision obstacles that undermine consumer
              trust and create direct product liability.
            calloutType: risk
            claimRefs:
