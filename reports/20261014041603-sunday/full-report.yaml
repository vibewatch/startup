        title: Exhibits
        blocks:
          - type: callout
            title: The $10,000 Production Cost Chasm and Consumer Margin Reality
            body: >-
              Hand-building Memo currently costs approximately $20,000 per unit, presenting an acute commercial hurdle.
              Until volume manufacturing cuts production costs below $10,000, Sunday faces severe gross margin pressure
              and must rely on affluent early adopters or subsidized hardware business models.
            calloutType: risk
            claimRefs:
