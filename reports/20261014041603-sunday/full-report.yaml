      - number: '4.3'
        title: Commercial Traction, Beta Deployment, and GTM Motion Proxies
        blocks:
          - type: paragraph
            body: >-
              Sunday's commercial go-to-market motion remains in a pre-commercial demonstration and research phase. The
              company has generated zero commercial revenue, zero ARR, and has zero paying enterprise or retail
              customers. For its late 2026 deployment milestone, Sunday is distributing approximately 50 uniquely
              numbered Memo units free of charge to selected Founding Family beta participants rather than executing
              commercial hardware deliveries. Early interest is substantiated by an organic waitlist exceeding 1,000
              signups, demonstrating substantial consumer curiosity. However, free beta deployments do not establish
              willingness to pay or customer acquisition cost efficiency, and analysts caution that in-home deployments
              create immediate exposure to safety failures, legal liabilities, and public relations risks before
              commercial underwriting can begin.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Capital Adequacy, Burn Estimates, and Diligence Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Sunday's forward balance sheet is anchored by cumulative venture funding of $200 million, and the March
              2026 Series B also added Coatue co-founder Thomas Laffont to the board while expanding the capital pool
              for deployment. The company has aggressively scaled operating expenditures, expanding engineering 3x,
              research 4x, and data operations 5x, while hiring senior talent across Silicon Valley. With a 50-unit free
              beta program requiring minimal capital expenditure compared to automotive or high-volume hardware
              rollouts, Sunday possesses sufficient liquidity to fund operations through 2027. Nonetheless, from an
              underwriting perspective, Sunday remains a pure research-and-development asset: without audited cash burn
              figures, realized bill of materials costs, or proven consumer willingness to pay, financial underwriting
              cannot substantiate the $1.15 billion valuation without deep private diligence.
            claimRefs:
              - CI014
              - CI015
              - CI016
