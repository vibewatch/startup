            title: Pre-Revenue Gap Between Demo Reliability and Household Retention
            body: >-
              While Sunday's ACT-2 model demonstrates a 99.1% success rate on laundry folding in internal trials, Sunday
              has not yet deployed a single commercial unit into a customer's home. In domestic environments where
              robots execute dozens of daily tasks, even a 1% per-step failure rate can result in daily physical
              disruptions, making actual household retention the central diligence uncertainty.
            calloutType: risk
            claimRefs:
