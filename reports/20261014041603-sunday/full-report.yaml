        title: Adoption Trajectory & Pre-Commercial Demand
        blocks:
          - type: paragraph
            body: >-
              Public appetite for domestic robotics automation has generated substantial top-of-funnel consumer interest
              for Sunday since its stealth unveiling in late 2025. Following viral showcase demonstrations of its Memo
              prototype preparing espresso and clearing glassware, the startup accumulated thousands of beta program
              inquiries and established an initial waitlist exceeding 1,000 households. The company has structured its
              initial customer pipeline around a gated Founding Family Beta rollout targeted for late 2026, coinciding
              with the Thanksgiving holiday horizon. Sunday intends to use this initial intake to transition from
              lab-bound evaluation to continuous domestic data collection, leveraging customer feedback to expand Memo's
              chore repertoire and validate fleet-wide model updates.
