      - number: '2.4'
        title: Growth Drivers, Commercial Bottlenecks, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              The primary growth driver propelling investor interest in Sunday is the massive latent consumer demand for
              automated chore relief, evidenced by roughly 1,000 individuals joining the company's waitlist shortly
              after emerging from stealth. Sunday has scaled its engineering, research, and data operations teams
              substantially to prepare for physical household deployments. Nevertheless, formidable commercialization
              bottlenecks loom. The most immediate risk is the hardware cost chasm: a prototype build cost of $20,000
              leaves no room for positive gross margins until contract manufacturing volume discounts are unlocked.
              Furthermore, operating heavy motorized manipulators in intimate living spaces introduces acute product
              liability and child safety exposures that could trigger catastrophic reputational damage in the event of
              an uncontained hardware failure. Finally, Sunday has disclosed no customer deposit metrics or firm pricing
              schedules, leaving fundamental questions regarding commercial conversion rates and customer lifetime value
              unresolved as the company approaches its initial beta delivery milestones.
            claimRefs:
              - CM009
              - CM012
              - CM013
              - CM014
