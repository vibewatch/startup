chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Founding Mission
        blocks:
          - type: paragraph
            body: >-
              Sunday is an artificial intelligence and consumer robotics startup founded in April 2024 in Mountain View,
              California, by robotics researchers Tony Zhao and Cheng Chi. Operating initially from an apartment
              prototype without university or corporate lab affiliation, Sunday established its mission around solving
              household chores through low-cost physical AI. The company publicly emerged from stealth on November 19,
              2025, introducing Memo, an autonomous household robot engineered for everyday domestic tasks including
              clearing tables, loading dishwashers, folding laundry, and brewing espresso. Unlike contemporary humanoid
              robotics startups that pursue legged bipedal locomotion for industrial settings, Sunday intentionally
              designed Memo as a wheeled-base mobile torso with an adjustable vertical lift reaching 2.1 meters. This
              architectural divergence eliminates fall risks, ensures passive mechanical stability when powered off, and
              allows onboard execution of Sunday's proprietary ACT-1 foundation model. While the company achieved a
              $1.15 billion valuation in under two years, it operates as a pre-revenue venture without public commercial
              revenue or audited unit economics.
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
