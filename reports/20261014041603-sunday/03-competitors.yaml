callouts:
  - calloutType: insight
    title: Form-Factor Pruning Prioritizes Household Safety and Reliability Over Vanity
    body: 'By replacing bipedal legs with a wheeled base, Sunday eliminates the dominant catastrophic risk in domestic robotics: falling onto furniture, children, or pets. While bipedal humanoids like Optimus and Figure require constant active balancing and draw significant power merely standing upright, Memo leverages passive stability and compliant actuation, enabling a 4-hour runtime and fail-safe power-off states.'
    claimRefs:
      - CP002
      - CP003
      - CP004
  - calloutType: risk
    title: 'The Autonomy Divide: Production Teleoperation vs. The 99.1% Generalization Gamble'
    body: The domestic robotics race in 2026 reveals a fundamental philosophical divide. Direct competitor Weave Robotics embraces human-in-the-loop teleoperation to deploy early and generate revenue ($449/month), whereas Sunday refuses customer-home teleoperation, betting entirely on pre-trained imitation learning models (ACT-2). If long-horizon household edge cases exceed autonomous recovery, Sunday faces delayed commercialization while peers capture early customer relationships.
    claimRefs:
      - CP006
      - CP007
      - CP011
