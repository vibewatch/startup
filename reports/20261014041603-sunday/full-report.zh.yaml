            title: 家庭实用性与拟人化形态的取舍
            body: Sunday 有意放弃双足人形架构，改用带伸缩脊柱的轮式底盘，避开平衡失稳并降低硬件成本，从而专门优化收拾餐桌和装洗碗机等家庭工作流。
            calloutType: insight
            claimRefs:
              - CM001
