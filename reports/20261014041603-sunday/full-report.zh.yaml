  - id: FE001
    title: 产品与技术架构栈
    type: stack
    summary: 多层物理 AI 栈，展示从手套数据采集、基础模型推理到机器人柔顺执行的完整链路。
    data:
      layers:
        - label: Tier 1 - 家庭数据采集
          items:
            - 专有 Skill Capture Glove（$200 BOM）
            - 超过 500 个 Memory Developer 家庭组成的分布式网络
            - 可穿戴动作、力和光学采集传感器
          modules:
            - 硬件数据记录器
            - 演示质量验证器
          outputs:
            - 人类原始多模态运动学演示流
        - label: Tier 2 - 数据转换与领域适配
          items:
            - Skill Transform 软件管线
            - 将 20 多个 DoF 的运动学重定向至三指手
            - 视觉手臂遮罩与领域合成
          modules:
            - 运动学转换器
            - 视觉合成器
          outputs:
            - 机器人兼容轨迹片段（90% 转换良率）
        - label: Tier 3 - 预训练与基础 AI
          items:
            - ACT-1 与 ACT-2 基础模型
            - 使用 Transformers 架构进行动作分块
            - Diffusion Policy 多模态轨迹生成
          modules:
            - 动作 Transformer 核心
            - 扩散轨迹规划器
          outputs:
            - 通用操作策略权重
        - label: Tier 4 - 微调与求解校准
          items:
            - 单次演示监督微调
            - 现实世界故障恢复闭环
            - 求解泛化基准协议
          modules:
            - 快速 SFT 适配器
            - 故障采集器
          outputs:
            - 校准后的任务策略（例如 99.1% 叠衣）
        - label: Tier 5 - 边缘推理与传感运动执行
          items:
            - 机器人端神经推理引擎
            - 3D 地图条件室内导航
            - 双臂轨迹跟踪控制器
          modules:
            - 地图定位引擎
            - 轨迹控制器
          outputs:
            - 协同双臂毫米级操作指令
        - label: 第 6 层——物理硬件与安全子系统
          items:
            - 覆硅胶底盘与轮式移动底座
            - 伸缩式 Z 轴脊柱（伸展范围 0m 至 2.1m）
            - 柔顺执行器、被动稳定与电源安全
          modules:
            - 柔顺电机控制器
            - 断电装置与被动阻尼器
          outputs:
            - 安全完成家庭实体家务
    approximationNotes: 分层拆解综合了公开技术论文（ACT、Diffusion Policy、UMI）与公司披露；边缘推理芯片的具体细节仍属机密。
