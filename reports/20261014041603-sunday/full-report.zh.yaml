      - number: '1.4'
        title: 运营规模、里程碑与风险画像
        blocks:
          - type: paragraph
            body: >-
              Sunday 的核心竞争资产不是传统远程操作机队，而是一套运营级数据采集装置。为在没有模拟或合成数据的情况下训练 ACT 基础模型，Sunday 向美国各地 数百名远程 Memory Developers
              部署了超过 2,000 只取得专利的 Skill Capture Gloves，每小时支付 $30 至 $60 记录真实家庭日常。 这条运营流水线已在 500 个家庭中积累超过 10 million
              个真实世界交互片段。全职员工从最初住在公寓里的两名创始人，扩展到约 30 至 50 名 专业机器人和机器学习工程师；承包商招聘名单显示，分布式运营规模更大。Sunday 计划在 2026 年底将 Founding
              Family Beta 部署到 50 个家庭， 并计划在 2026 年感恩节前后开始全面商业发货。然而，外部批评者指出了多重障碍：原型制造成本目前约 $20,000，却对应低于 $10,000 的零售价目标；
              真实家庭 Beta 部署还带来尚未解决的安全、财产责任和分布外模型泛化风险。
            claimRefs:
              - CO002
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
