            title: 借助可穿戴手套打造资本高效的数据飞轮
            body: >-
              Sunday 用分布在 500 多个私人家庭中的 $200 可穿戴 Skill Capture Gloves，替代 $20,000 的入户远程操作台， 将实体数据采集规模与昂贵的机器人机队部署解耦，积累了超过
              10 million 个真实家庭操作片段。
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
          - type: callout
            title: 尚未验证的规模制造经济学与入户介入率
            body: >-
              Memo 当前手工制造的原型成本约 $20,000；要达到 Sunday 低于 $10,000 的商业零售目标，必须实现尚未验证的 50% 降本。
              同时，受控叠衣测试中的公开可靠性基准，尚未证明机器人能在混乱家庭环境中连续自主运行数小时，或达到可接受的远程操作介入率。
            calloutType: risk
            claimRefs:
              - CE002
              - CE007
              - CE008
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与目标家庭画像
        blocks:
          - type: paragraph
            body: >-
              Sunday 瞄准住宅消费者家庭，用于自动化家庭家务，有意绕开商业酒店、医疗和工业仓储物流。公司的 go-to-market 设计集中在高收入的独栋住宅业主和双职工家庭，
              他们每天都受叠衣服、收拾餐桌、整理厨房等家务的持续时间约束。消费机器人硬件本身部署复杂，Sunday 因而意识到，早期客户会以科技爱好者为主： 他们愿意与早期自主系统共处，也愿意容忍偶尔的运行故障。与企业软件或
              B2B 硬件不同，Sunday 没有商业合同结构、企业采购渠道或 SLA 承诺， 只专注于建立直接的消费者关系。
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
          - type: table
            tableRef: TU001
