      - number: '2.3'
        title: 买家分层、工作流摩擦与早期采用者经济学
        blocks:
          - type: paragraph
            body: >-
              自主家庭机器人的商业采用，会沿着明显的多阶段客户分层路径推进。Sunday 的首批客户群由 Founding Family Beta 计划定义：计划在 2026 年底向 约 50 个入选家庭部署带独立编号的
              Memo。这个切入群体是自我选择的科技爱好者家庭，愿意承受商业化前的运营摩擦、偶尔的远程操作介入和诊断软件更新， 以换取优先使用家庭自动化的机会。Beta
              之外，主要目标买家是因日常家务而严重缺时间的双收入职业家庭。在这一群体中，经济决策者和日常用户住在
              同一屋檐下，采购关系比企业软件更简单。但工作流摩擦依然很大：家庭厨房台面高度各异，酒杯易碎，地面杂乱，家具摆放不可预测。 能否触发采用，很大程度取决于 Memo
              能否在装洗碗机等边界明确的家务上接近完美地工作，同时不需要人类预先分类或持续看护。
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM013
      - number: '2.4'
        title: 增长驱动、商业瓶颈与尽调风险
        blocks:
          - type: paragraph
            body: >-
              推动投资者关注 Sunday 的首要增长动力，是消费者对自动化减轻家务负担的巨大潜在需求；公司结束隐身后不久，约 1,000 人加入了等待名单。 Sunday
              大幅扩充工程、研究和数据运营团队，为进入家庭部署做准备。但商业化瓶颈仍然突出。最直接的风险是硬件成本鸿沟：在通过合同制造的规模折扣 释放之前，$20,000
              的原型成本根本没有正毛利空间。更严重的是，在亲密的居住空间里运行重型电动机械臂，会带来严重的产品责任和儿童安全风险； 一旦硬件失控，可能造成灾难性的声誉损害。最后，Sunday
              未披露客户定金指标或确定的定价计划，商业转化率和客户生命周期价值等基本问题， 在接近首次 Beta 交付里程碑时仍没有答案。
            claimRefs:
              - CM009
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: $10,000 生产成本鸿沟与消费级毛利现实
            body: Memo 目前手工制造的单台成本约 $20,000，构成严峻的商业障碍。在规模制造将生产成本压低到 $10,000 以下之前，Sunday 将承受严重的毛利率压力，只能依赖富裕早期采用者或补贴型硬件商业模式。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM012
