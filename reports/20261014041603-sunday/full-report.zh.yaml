      - number: '5.4'
        title: 泛化基准、Solve 标准与失败恢复
        blocks:
          - type: paragraph
            body: >
              2026 年 7 月，Sunday 发布 ACT-2，这是一款针对机器人领域长期泛化缺口的先进基础模型：实验室环境训练的模型，部署到陌生家庭时往往会失败。 Sunday 在未参与训练的真实家庭中，针对 9
              个不同衣物类别进行了 785 次自主叠衣试验。Memo 成功叠好 778 次，综合成功率 99.1%（标准误差 ±0.3%）； 按严格的缺陷扣分标准，平均外观质量为 4.72 / 5 星。短裤和 Polo
              衫成功率达到 100%，T 恤为 99.0%，轻薄女式衬衫为 94.7%， 后者因材料柔软而更难操作。


              更关键的是，Sunday 证明，扩大多样化预训练数据能系统性压缩分布外泛化差距。内部消融实验显示，没有预训练数据的模型在实验室同域成功率为 96%， 但在陌生环境中骤降至 14%（泛化损失 82
              个百分点）。将预训练数据扩展到 100% 后，在测试条件下这一差距完全消失。 此外，ACT-2 还展示了单次示范监督微调能力：仅凭一个人的示范，就能学习新的折叠方式，并应用到未见过的衣物。为建立严格的行业问责，
              Sunday 提出了 Solve 框架，主张用未见环境中的经验证自主率衡量机器人能力，而不是靠精心剪辑的亮点视频。
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE012
      - number: '5.5'
        title: 部署路径、生产经济学与尽调风险
        blocks:
          - type: paragraph
            body: >
              2026 年 3 月，Sunday 以 $1.15 billion 估值完成超额认购的 $165 million Series B 后，开始把资源从研究演示转向商业部署。 Sunday 计划在 2026 年底通过
              Founding Family Beta 向早期采用者部署约 50 台带编号的 Memo，目标是在 2026 年感恩节前后开始交付。 这次 Beta
              部署既是经验验证实验室，用来评估未编排的家庭边缘案例（包括儿童、宠物、液体洒落、环境光变化和 Wi-Fi 延迟），也用于在扩大消费硬件生产前 测试长期机械可靠性。


              尽管技术有所进展，承保判断所需的重大商业和运营问题仍未解决。定制机加工原型的单台制造成本目前接近 $20,000；Sunday 预计转向注塑规模化工具后， 可将生产成本降至 $10,000
              以下，但工具排期和供应商合同尚未披露。把配备视觉系统的机器人放进私人住宅，也会带来显著隐私敏感性。 Sunday 强调 Memo
              运行自主策略，不会接入实时人工远程操作视频；但正式安全认证、设备端数据脱敏协议和云端传输边界尚未接受公开审计。 此外，公开专利缺失表明，Sunday 的知识产权很大程度依赖手套硬件和数据转换流水线中的商业秘密。
            claimRefs:
              - CE002
              - CE008
              - CE010
              - CE013
