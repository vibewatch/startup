      - number: '5.2'
        title: 机械架构、移动能力与物理安全
        blocks:
          - type: paragraph
            body: >
              Memo 明确偏离 Figure、Tesla 等人形竞争者偏好的拟人化双足设计，采用带轮移动底座和垂直升降躯干。机身高 1.7 米，约重 77 千克（170 磅）， 配有伸缩 Z
              轴脊柱，可将垂直触达范围从地面延伸至 2.1 米（6 英尺 10 英寸）。这种机械布局让 Memo 无需消耗能量维持双足动态平衡， 就能从地毯捡起丢弃物并够到高处的厨房搁板。带轮架构消除了灾难性跌倒风险，以 1
              小时快速充电换来 4 小时续航，并大幅减少机械执行器数量。


              住宅环境的安全，建立在柔顺执行和被动结构稳定性之上。Memo 的多自由度手臂使用柔顺控制回路，住户或儿童可以把手臂推到一旁，而不会遇到刚性阻力。 突然断电时，Memo
              的低重心和稳定轮距能防止机器人倾倒或因自重坍塌。Memo 没有采用人类式五指手，而是使用定制的三指柔顺夹爪，
              模仿人类手指的功能性抓取几何。这样既降低了电机复杂度和故障点，又保留了抓取易碎玻璃器皿和操作柔软纺织品所需的触觉灵巧性。 手工制造的原型目前每台约 $20,000，制造规模化仍是重大挑战。
            claimRefs:
              - CE002
              - CE003
              - CE010
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
      - number: '5.3'
        title: 物理 AI 基础模型与家庭数据飞轮
        blocks:
          - type: paragraph
            body: >
              Sunday 的核心技术差异，来自创始人将机器人模仿学习的学术研究融入产品。CEO Tony Zhao 在 Stanford 共同开发 ALOHA、Mobile ALOHA 和 Action Chunking
              with Transformers（ACT），建立了让机器人学习数秒动作轨迹、而非孤立电机步骤的方法。CTO Cheng Chi 则在 Columbia 和 Stanford 开创 Diffusion
              Policy 与 Universal Manipulation Interface（UMI），建立了生成式扩散技术，用于多模态动作生成，并把演示采集与实体机器人硬件解耦。 Sunday 将这些学术突破变成商业物理
              AI 技术栈，核心是专有的 Skill Capture Glove。


              传统机器人学习依赖每台成本超过 $20,000 的远程操作台，形成严重的资本瓶颈，限制训练数据集规模。Sunday 用一只成本约 $200 的低成本传感手套替代， 让手套模仿 Memo
              的手部运动学和传感器布局。公司把数千只手套发给美国各地家庭中的 500 多名远程众包 Memory Developers，让他们在自家记录真实日常家务。 记录下来的多模态交互经由 Skill Transform
              处理；这是一个专有软件流水线，可重定向人类运动学，并以 90% 的转换产出率补偿视觉具身差距。 这条流水线为 ACT-1 提供了超过 10 million
              个真实世界片段，使基础模型能在没有任何实体机器人远程操作数据的情况下训练。
