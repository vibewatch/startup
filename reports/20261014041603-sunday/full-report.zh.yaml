      - number: '3.3'
        title: 定价、产品包装与历史失败先例
        blocks:
          - type: paragraph
            body: >-
              家庭操作硬件商业化，必须跨过高昂的物料清单门槛，也要面对惨痛的历史失败先例。Memo 原型目前手工装配，每台约花费 Sunday $20,000；随着制造规模化， 管理层目标是降价 50% 至
              $10,000。相比之下，Weave Robotics 通过 Isaac 1 建立了明确的商业价格上限：首付 $7,999，或每月 $449、定金 $250； 1X NEO 的目标售价为
              $20,000，或每月订阅 $499。然而，家庭洗衣和家务机器人行业有着令人警醒的商业破产史。日本初创公司 Seven Dreamers Laboratories 从包括 Panasonic
              在内的企业支持者处筹得约 10 billion yen，用于打造 Laundroid 叠衣柜；但由于无法解决叠衣速度慢（每件衬衫三至十分钟）、 零售价高（$16,000）和深色衣物传感器失灵等问题，最终于
              2019 年申请破产并背负 2.2 billion yen 债务。FoldiMate 也在 2021 年停止运营， 未能交付可行的低于 $1,000 的消费级叠衣设备。Sunday 必须在即将到来的 2026
              年秋季 Founding Family Beta 中证明，Memo 的多任务效用超过 过去市场参与者致命的单任务单位经济学。
