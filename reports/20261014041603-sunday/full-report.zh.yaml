chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与创立使命
        blocks:
          - type: paragraph
            body: >-
              Sunday 是一家人工智能和消费机器人初创公司，由机器人研究员 Tony Zhao 和 Cheng Chi 于 2024 年 4 月在加州 Mountain View 创立。
              公司最初在没有大学或企业实验室背景的情况下，于公寓里制作原型，并将使命定为用低成本物理 AI 解决家庭家务。2025 年 11 月 19 日， 公司结束隐身状态，公开推出
              Memo——一款面向日常家务的自主家庭机器人，可收拾餐桌、装洗碗机、叠衣服和制作浓缩咖啡。 与追求双足行走、面向工业场景的当代人形机器人初创公司不同，Sunday 有意把 Memo
              设计成带轮底盘的移动躯干，并配备可调高度、 最大升至 2.1 米的垂直升降机构。这种架构差异消除了跌倒风险，断电时仍能保持被动机械稳定，也让 Memo 能在机载端运行 Sunday 专有的 ACT-1
              基础模型。公司不到两年就达到 $1.15 billion 估值，但仍是一家没有公开商业收入或经审计单位经济学数据的未产生收入企业。
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
              - CO015
