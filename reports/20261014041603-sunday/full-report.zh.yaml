  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 家庭机器人格局与形态分化
        blocks:
          - type: paragraph
            body: >-
              2026 年的机器人行业已经分裂为两种截然不同的通用操作架构。一边是 Tesla Optimus、Figure AI 和 1X Technologies 等资金雄厚的人形通用机器人，
              主张用双足拟人形态在为人类行动建造的环境中移动；另一边是 Sunday，它有意拒绝人形外观，转向以家庭为先、实用主义的 Memo。Memo 高 1.7 米、重 170
              磅，不用双足行走，而是靠稳定的带轮底盘和伸缩垂直 Z 轴脊柱移动，脊柱可从地面升到 2.1 米。Sunday 放弃跨越多层楼梯的能力，换来单次充电 4
              小时续航、较低制造复杂度，以及断电时可防止灾难性跌倒的被动物理稳定性，从而应对真实家庭中严苛的安全和责任约束。面向工厂的竞争者
              接受笨重的液压或高扭矩电动双足机身，因为工业环境能容纳安全笼和严格的隔离带。住宅则需要柔顺控制，让机器一接触人就立即让开； 因此 Sunday 的形态取舍，构成了对工业人形既有企业的运营护城河。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
      - number: '3.2'
        title: 能力矩阵与自主性分歧
        blocks:
          - type: paragraph
            body: >-
              物理人工智能长期以来的核心瓶颈，是在无序、杂乱环境中缺少高保真操作数据。Sunday 不用传统的 $20,000 远程操作台或模拟环境，而是向数百名远程 Memory Developers 部署轻量、单只
              $200 的 Skill Capture Gloves，在真实家庭布局中收集超过 ten million 个真实家务片段。这个数据引擎驱动 ACT-1 和 ACT-2 模仿学习模型；据报道，在 9
              种不同衣物、785 次叠衣试验中，无需针对每个家庭微调，就达到了 99.1% 成功率。 这一技术架构与 Sunday 最接近的带轮直接对手 Weave Robotics 形成鲜明对比。Weave 已部署
              Isaac 机队，用主动远程人工操作折叠商业洗衣；一旦自动策略卡住， 就由人介入。Sunday 则明确排除在客户家中进行人工远程操作和监控直播。Sunday
              的纯自主理念有利于建立消费隐私形象，但也让公司暴露在真实世界 边缘案例中：无辅助的操作失败需要用户亲自介入，而不是无缝远程恢复。
            claimRefs:
              - CP005
              - CP006
