      - number: '1.2'
        title: 管理层、学术背景与治理
        blocks:
          - type: paragraph
            body: >-
              Sunday 的技术可信度和快速融资，直接来自创始团队顶尖的研究背景。联合创始人兼 CEO Tony Zhao 先在 UC Berkeley 获得电气工程与计算机科学学位， 随后进入 Stanford
              University CS 博士项目，师从机器人学习领域的 Sergey Levine 和 Chelsea Finn。Zhao 作为开源低成本 ALOHA 远程操作系统的 核心架构师，在机器人圈广受认可；之后曾在
              Google DeepMind 和 Tesla Autopilot 任研究职务，最终从 Stanford 退学创办 Sunday。 联合创始人兼 CTO Cheng Chi 在 Shuran Song 指导下于
              Columbia University 完成计算机科学博士论文，并发明 Diffusion Policy——现代操作机器人中 应用最广泛的模仿学习方法之一，曾多次获得 Best
              Paper。公司治理也纳入了机构风投代表：Sunday 于 2026 年 3 月完成 Series B 融资后， Coatue Management 联合创始人 Thomas Laffont
              正式加入董事会，负责后期规模化监督。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO006
          - type: table
