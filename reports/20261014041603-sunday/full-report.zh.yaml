      - number: '1.3'
        title: 融资历程与股东格局
        blocks:
          - type: paragraph
            body: >-
              Sunday 在成立后的二十三个月内，通过两轮机构融资累计筹集约 $200 million 股权资金。公司先完成约 $35 million 的 Seed 轮，由 Benchmark 和 Conviction
              领投，用于硬件原型、手套制造和隐身期数据运营。2026 年 3 月 12 日，Sunday 宣布完成超额认购的 $165 million Series B， 投后估值 $1.15
              billion，以消费机器人行业极快的速度跻身独角兽。Series B 由 Coatue Management 领投，Bain Capital Ventures、 Fidelity Management &
              Research Company、Tiger Global、Benchmark、Conviction 和 Xtal Ventures 等跨界及成长型机构参与。 该银团把 Benchmark 的一线消费风投支持，与
              Coatue 和 Fidelity 的深科技成长资本结合起来。不过，完整股东权利、二级交易和清算优先权 仍属私密信息；Sunday 也未披露商业订阅收入或付费客户定金来支撑这一估值。
            claimRefs:
