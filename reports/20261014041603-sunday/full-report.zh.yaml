              - CU011
      - number: '6.4'
        title: 留存持久性、流失风险与单位经济学
        blocks:
          - type: paragraph
            body: >-
              Sunday 的核心尽调难题不是漏斗顶部的消费者好奇心，而是客户留存能否持久以及单位经济学是否成立。在机器人每天必须连续执行几十个物理动作的家庭环境中， 即使任务可靠性达到令人印象深刻的
              99.1%，按数学推算也意味着约每 100 次动作会失败一次，导致餐具每天掉落、衣物堆积卡住，或机器人在杂乱房间中迷路。 家庭机器人历史凸显了这一持久性挑战：Seven Dreamers Laboratories
              和 FoldiMate 等资本雄厚的先驱，没能解决自动化演示与可靠家庭实用性之间的差距， 最终失败。更糟的是，Memo 原型目前每台制造成本约 $20,000，而未公布的目标零售价低于
              $10,000，客户获客回本周期和经常性订阅毛利都高度不确定。
            claimRefs:
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 收入前演示可靠性与家庭留存之间的缺口
            body: >-
              Sunday 的 ACT-2 模型在内部叠衣试验中展示了 99.1% 成功率，但 Sunday 仍未向任何客户家庭部署商业产品。在机器人每天执行几十项任务的家庭环境中， 即使每一步 1%
              的失败率，也可能造成日常物理干扰；真实家庭留存因此成为尽调中最核心的不确定性。
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 管理层风险排名与论点破坏层级
        blocks:
          - type: paragraph
            body: >-
              Sunday 从学术模仿学习突破走向消费家庭机器人，风险集中在物理执行、单位经济学和消费者信任上。风投支持者已通过超额认购的 Series B 为 Sunday 提供 $200 million 融资，公司估值达到
              $1.15 billion；但商业成功要求把一台重 170 磅的电动机器部署进不可预测的私人住宅。 实验室级演示无法覆盖住宅环境的组合式混乱：家具布局、光线变化和儿童互动，都会打断自主任务完成。2026
              年底的早期 Beta 部署涉及约 50 个家庭， 一旦出现未受监控的失效模式，公司就会暴露在严重的产品责任和声誉损害之下。Sunday 仍完全没有收入，公开披露的商业 ARR 和客户合同均为零；
              如果量产长期无法把零售价压到 $10,000 以下，在大批量发货前就可能触发下轮估值或严重资本约束。
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR012
      - number: '7.2'
        title: 监管合规、产品安全与家庭隐私
        blocks:
          - type: paragraph
            body: >-
              将无系留自主操作部署到家庭生活空间，会让消费品安全和消费者监控监管面临前所未有的审视。Memo 采用低重心带轮底盘，通过被动物理稳定性在断电时保持直立，
              并结合柔顺关节执行，让住户可以主动改变机器人的方向。然而，公开记录显示，Sunday 没有按照 UL 1740 或 ISO 13482 等机器人标准取得正式第三方产品安全认证，
              也未披露覆盖核心操作硬件的已授权公开专利。持续使用摄像头和麦克风感知家庭环境，还会使公司暴露在州级隐私和窃听法规之下。 Sunday 通过拒绝入户人工远程操作、改用付费 Memory Developers
              事先采集的演示数据，来缓解隐私反弹；但客户同意框架和家庭边缘数据安全， 仍是尚未验证的监管尽调重点。
            claimRefs:
              - CR002
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR010
              - CR011
              - CR015
      - number: '7.3'
        title: 运营执行、长尾泛化与现场失效模式
        blocks:
          - type: paragraph
            body: >-
              运营层面的脆弱性，核心在于长流程家务中任务错误率的复合效应。Sunday 的 ACT-2 基础模型在 785 次自主叠衣尝试中取得了令人印象深刻的 99.1%
              成功率，但该基准测试有意排除了袜子、衣物分类和抽屉收纳等复杂边界情况。独立工程评估显示，即使每次操作的错误率只有
              1%，每天完成一百项家务动作，平均也会出现一次失败，表现为餐具破损、液体洒落或机构卡死。当前，实体原型仍需约 $20,000
              的手工组装成本；要超越低批量原型阶段，还需要工装、精密定制双夹爪和执行器供应链，而这些环节尚未达到成熟的工业良率。如果 2026 年下半年 beta 试验期间无人监督下的现场可靠性下降，Sunday
              将承担高昂的维护派遣成本，纯软件创业模式无法消化这笔开支。
            claimRefs:
              - CR006
              - CR007
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR012
              - CR013
      - number: '7.4'
        title: 资本密集度、合作伙伴依赖与商业可行性
        blocks:
          - type: paragraph
            body: >-
              消费机器人要同时承担前沿人工智能的算力开销和精密硬件制造的营运资金压力。Sunday 迅速扩充组织规模，员工已超过 100 人；为赶在量产前加快模型部署，工程团队扩大了三倍，研究团队扩大了四倍。然而，要达到低于
              $10,000 的目标零售价，商业化必须把制造成本至少削减 50%，同时还要与资金充足的双足和轮式竞争者 Figure AI、Weave Robotics 竞争。家庭自动化的历史先例——包括 Seven
              Dreamers Laboratories 和 FoldiMate 破产——说明，机器吞吐速度慢或需要频繁人工介入时，消费者支付意愿会迅速崩塌。如果 Sunday 在 beta
              项目期间无法证明自主运行可靠、单位经济性可行，公司在 2027 年寻求量产工装所需的成长资本时，估值将面临严重压缩。
            claimRefs:
              - CR005
              - CR008
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR013
      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 无人监督家庭中的乘法式失败陷阱
            body: >-
              即使实验室中孤立的叠衣任务成功率达到
              99.1%，涉及二十个以上连续动作的多步骤家务仍会出现指数级可靠性衰减。在每天运行数十项操作、无人监督的家庭里，每一百个动作发生一次失败，就会造成餐具掉落、液体洒出或碰撞障碍等日常事故，削弱消费者信任并直接带来产品责任风险。
            calloutType: risk
            claimRefs:
              - CR006
              - CR008
          - type: callout
            title: 创始家庭 beta 部署的尽调重点
            body: >-
              潜在投资人和合作伙伴必须在 2026 年下半年 beta 推出期间，跟踪真实世界的人工介入率、远程操作员升级处理频率和硬件维修周转时间。Sunday
              承诺完全采用本地自主运行，不在家中持续进行远程操作，这一设计强化了消费者隐私保护；但在充满对抗性的家庭环境中的现场耐久性，仍是决定投资判断的关键门槛。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR007
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与建议
        blocks:
          - type: paragraph
            body: >-
              Sunday 提出了一个颇具吸引力的消费级 Physical AI 理论论点：它认为，通过专有 Skill Capture Glove
              捕捉可规模化的真实环境操作数据，就能跨过家庭机器人部署的经典障碍。Sunday 将人类示范硬件与轮式 Memo 平台共同设计，并采用 ACT-1 基础模型，于 2026 年 3 月以 $1.15 billion
              估值完成超额认购的 $165 million B 轮融资。Coatue、Benchmark、Bain Capital Ventures、Fidelity、Tiger Global 和 Conviction
              等顶级风险投资机构都认可这套数据优先架构。


              尽管如此，反方论点仍然严峻：过去二十年，家庭机器人已吸收数十亿美元风险投资，却没有诞生一款具备商业可行性的消费产品。Sunday 尚无收入，进入的是一个未经验证的消费市场；Memo
              当前的商业化制造成本是手工组装约 $20,000/台，而其期望零售价低于
              $10,000。由于客户押金规模、账单转化率、保修负债和单位经济性均未披露，投资建议为继续研究，并附带高风险评级和未知估值立场，而不是给出虚假的精确判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
