      - number: '6.3'
        title: 客户证明、试点现实与运营限制
        blocks:
          - type: paragraph
            body: >-
              尽管市场热情高涨、融资达到独角兽水平，Sunday 尚未将任何一台商业产品放入客户家中，仍处于没有收入、没有付费账户的阶段。 当前客户证明仅限于对计划中的 50 台 Founding Family Beta
              的潜在兴趣，以及付费 Memory Developer 承包商佩戴 Skill Capture Gloves 进行的数据采集工作流。 此外，Sunday 的运营理念与 Weave Robotics
              等家庭机器人同行截然不同：Weave 依靠远程人工操作员实时介入，Sunday 则严格承诺自主执行物理 AI， 不允许入户实时远程操作。这种纯自主立场抬高了运营门槛，Memo
              必须在无序家庭环境中成功工作，不能依赖人类参与的后备方案。
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
