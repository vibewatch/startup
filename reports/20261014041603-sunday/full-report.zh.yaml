      - CV005
      - CV006
      - CV011
      - CV012
  - id: TV002
    title: 投资论点与反论点驱动因素
    columns:
      - 支柱
      - 论点
      - 反论点脆弱性
      - 哪些变化会改变判断
    rows:
      - - 数据采集护城河
        - 低成本 Skill Capture Glove 可在真实家庭中大规模采集多样化的家庭动作
        - 人类演示数据不保证机器人在未测绘家庭中具备长时程自主可靠性
        - 独立验证零样本泛化能覆盖 100 多个不受约束的客户家庭
      - - 硬件形态
        - 带轮底盘配合被动稳定，避开双足跌倒风险并降低机械复杂度
        - 无法爬楼限制了可服务的多层住宅总市场空间
        - 证据表明单层家庭消费者愿意支付的价格超过硬件摊销成本
      - - 单位经济性与定价
        - 目标零售价低于 $10,000，使 Memo 成为可触达的家庭奢侈电器
        - 当前手工组装原型成本为 $20,000，没有巨大规模就会产生负毛利率
        - 经审计的物料清单和合同制造协议将生产成本降至 $5,000 以下
      - - 运营现金消耗
        - 超过 $165M 的 B 轮资本提供 runway，可停止演示并执行初始部署
        - 远程 Memory Developer 每小时 $30-$60，加上 100 多名员工，会迅速加剧收入前现金消耗
        - 披露商业订阅或预付定价模式，并实现正贡献毛利
      - - 市场可行性
        - 1,000 多名候补名单申请者显示出对家庭杂务自动化的早期爱好者需求强劲
        - 历史上的消费机器人烧掉数十亿美元，却未产生商业市场赢家
        - 将候补申请者转化为不可退款的付费订单，并保持每日使用
    notes: 依据截至 2026 年 10 月的公开公告、技术发布和招聘信息，评估论点与反论点支柱。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: 情景分析、假设与下行触发器
    columns:
      - 情景
      - 运营与商业假设
      - 估值与回报逻辑
      - 下行触发器与终止标准
    rows:
      - - 乐观情景（20% 概率）
        - Beta 实现 99% 以上自主任务完成率；BOM 降至 $4,000；2027-2028 年以 $9,999 售出 10,000 台
        - 估值扩张至 $3.0B-$5.0B，成为定义品类的消费 AI 硬件平台（3x-4.5x 回报）
        - 严重的家庭安全事故、财产损坏，或消费者因室内摄像头隐私问题反弹
      - - 基准情景（50% 概率）
        - Beta 暴露出频繁的边缘场景卡顿；Memo 需要远程操作协助；单价定为 $12,000-$15,000
        - 估值维持在 $1.0B-$1.2B；需要追加融资为硬件重新设计提供资金
        - 硬件制造报废率超过 20%；90 天内 beta 客户流失超过 40%
      - - 悲观情景（30% 概率）
        - 制造成本无法降至 $18,000 以下；beta 家庭退出；消费者转化率停留在 10% 以下
        - 估值压缩至低于 $300M 的清算 / 下轮融资估值（资本减值 75% 以上）
        - B 轮优先股堆叠的条款触发资本重组，或科技集团低价收购资产
    notes: 这些概率和估值倍数，是基于可用融资基准对尚无收入的深科技消费硬件所作的风险投资综合判断。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
