      - number: '8.3'
        title: 情景分析、可比公司与尽调要求
        blocks:
          - type: paragraph
            body: >-
              鉴于 Sunday 尚无收入，DCF 模型缺乏经验输入，因此，情景分析和基于里程碑的持有估值才是合适的估值框架。在乐观、基准和悲观路径下，估值最敏感的变量是：Memo 能否从仅邀请 50 户家庭参与的
              beta，转向商业可行的合同制造，而无需接受惩罚性下轮融资。Sunday 的目标零售价低于 $10,000，而初始手工组装成本为 $20,000，因此必须把硬件供应链规模大幅做大。


              从可比市场看，消费机器人历史上充斥着资金充足但最终清算的公司；当代人形机器人同行则筹集了数亿美元，目标是工业工厂部署，而非无结构的消费住宅。打破核心论点的触发因素和眼下的尽调要求，集中在 beta
              远程操作介入率、现场可靠性、硬件物料清单的规模化，以及 B 轮优先股条款的完整结构。
