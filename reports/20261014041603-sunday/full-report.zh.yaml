      - number: '8.2'
        title: 论点与反方论点的驱动因素
        blocks:
          - type: paragraph
            body: >-
              评估 Sunday 的长期商业价值，需要把核心技术差异化优势与执行脆弱性放在一起比较。正向投资逻辑建立在数据护城河和资本高效的数据采集模式上：向居家 Memory Developers
              发放可穿戴手套，由他们收集日常家务示范，绕开成本高达数万美元的工业远程操作设备。Sunday 打通硬件、模型训练和持续车队评估的全栈能力，因此获得了蓝筹机构支持并完成超额认购融资。


              相反，反方逻辑聚焦于消费机器人行业的历史高死亡率、未经验证的消费者支付意愿门槛，以及数据运营和专业工程人才持续消耗现金。Sunday 以按任务计酬的方式雇用 Memory
              Developers，每个获批数据小时支付 $30 至 $60，同时维持超过 100 名员工，但尚未披露 beta
              到付费用户的转化计划或量产制造协议。在不受约束的家庭环境中证明自主车队的可靠性和家庭留存之前，私人估值标记无法由经营现金流支撑。
