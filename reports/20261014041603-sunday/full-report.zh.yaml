      - number: '3.4'
        title: 数据护城河持久性、转换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Sunday 在 2026 年 3 月由 Coatue 领投、以 $1.15 billion 估值完成超额认购的 $165 million Series B 后，将工程和运营团队扩展到 100 多名专业人士，
              并从 Tesla Optimus 项目招募有经验的基础设施和系统负责人。Sunday 认为，从手套硬件、Skill Transform 具身翻译、基础策略预训练到机队部署的垂直整合，
              打造了难以攻破的数据飞轮。然而，长期护城河仍面临明显的替代威胁。家庭家电的消费者转换成本很低，家庭可以同时使用传统洗碗机、洗衣机和扫地机器人， 几乎没有固有的供应商锁定。此外，Physical
              Intelligence（Pi0）等第三方研究机构快速推进基础操作模型，可能把通用操作策略商品化，让资金雄厚的硬件 OEM 无需复制 Sunday 的专有手套机队，也能达到类似任务成功率。Sunday
              的竞争持久性最终取决于：它的全自主架构能否比竞争者扩张多任务远程操作更快赢得家庭信任。
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 砍掉人形腿，优先守住家庭安全与可靠性，而非追求外形
            body: >-
              Sunday 用带轮底盘替代双足，消除了家庭机器人最主要的灾难性风险：砸到家具、儿童或宠物。Optimus、Figure 等双足人形机器人需要持续主动平衡， 仅站立就会消耗大量电力；Memo
              则利用被动稳定和柔顺执行器，实现 4 小时续航以及断电后的故障安全状态。
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP004
          - type: callout
            title: 自主性分野：生产级远程操作 vs. 99.1% 泛化能力豪赌
            body: >-
              2026 年的家庭机器人竞赛显现出根本性的理念分歧。直接竞争者 Weave Robotics 拥抱人类参与的远程操作，以便尽早部署并产生收入（$449/month）； Sunday
              则拒绝在客户家中远程操作，把全部筹码押在预训练模仿学习模型（ACT-2）上。如果长时段家庭边缘案例超出自主恢复能力，Sunday 的商业化会延迟， 同行则可能先拿下客户关系。
            calloutType: risk
            claimRefs:
