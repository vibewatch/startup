  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与家庭家务工作流
        blocks:
          - type: paragraph
            body: >
              Sunday 将 Memo 定位为自主家庭设备，旨在把被重复、灵巧家务占用的家庭时间还回来。Memo 不处理宽泛的工业任务或结构化工厂装配，
              而是围绕住宅空间凌乱且不可预测的几何环境设计，主要聚焦叠衣服、整理厨房和管理洗碗机。家庭机器人能否落地，关键标准是无需针对特定场所的人类介入 或远程操作，也能执行多步骤物理流程。在演示试验中，Memo 执行了一个
              33 步的 Table-to-Dishwasher 工作流，涉及 21 件物体上的 68 次灵巧交互， 并完成 130 英尺的室内导航，处理陶瓷餐具、金属餐具、食物残渣和易碎的酒杯。


              家庭家务自动化与工业自动化有根本差异，因为家庭物品高度多变、会变形，还常常部分被遮挡。衣服会不可预测地变形，盘子直径各不相同， 洗碗机篮架的空间几何也不规则。Sunday
              已展示抽浓缩咖啡、整理鞋子等基础能力，但近期产品重点是把叠衣服做成首项生产级能力。 然而，长时段的厨房清理任务仍然更容易失败；在自主进入厨房部署前，还需要大量感知推理和恢复策略，才能达到叠衣服已经展示的稳定性。
            claimRefs:
