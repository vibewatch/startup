        - 宏观下行导致后期硬件融资关闭
        - 高
        - $165M B 轮融资提供资金 runway 至 2027 年
        - 中：若商业化延迟至 2027 年之后，将需要低价融资轮
    notes: 按严重程度排序；反映硬件、AI 软件和融资方面的集中风险。
    claimRefs:
      - CR001
      - CR005
      - CR010
      - CR013
  - id: TV001
    title: 建议与立场摘要
    columns:
      - 维度
      - 评估
      - 支持证据
      - 决策含义
    rows:
      - - 投资建议
        - 继续研究
        - 在 2026 年末 beta 启动前仍处于收入前运营；尚无商业账单或转化记录
        - 在现场可靠性和定价转化数据出现前，暂不作出新的资本承诺
      - - 信心水平
        - 高
        - B 轮主要新闻稿、领投方董事席位及官方 beta 申请条款
        - 对资本结构事实信心较高，但对商业估值坚持克制，不贸然下注
      - - 风险评级
        - 高
        - 未经验证的消费硬件需求、$20,000 原型成本及较高的家庭故障责任
        - 需要严格的下行保护，并审查清算优先权
      - - 估值立场
        - unknown
        - $1.15 billion 投后估值，未披露收入运行率或客户毛利率
        - 没有单位经济性或经核实的生产成本，不应为私人市场 headline 估值背书
      - - 目标回报 / 行动
        - 持有 / 关注 Beta
        - 50 个家庭的 Founding Family Beta 将于 2026 年末启动，使用编号 Memo 设备
        - 跟踪人工介入频率、硬件损坏事故及 beta 转付费转化率
    notes: 由于截至 2026 年 10 月没有公开财务报表、商业收入或披露的单位账单，估值立场标为未知。
    claimRefs:
