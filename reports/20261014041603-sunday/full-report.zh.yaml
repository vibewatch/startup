      - number: '6.2'
        title: 采用路径与商业化前需求
        blocks:
          - type: paragraph
            body: >-
              自 2025 年底隐身亮相以来，公众对家庭机器人自动化的兴趣，为 Sunday 带来了大量漏斗顶部需求。Memo 原型制作浓缩咖啡和收拾玻璃器皿的演示走红后， 这家初创公司收到数千个 Beta
              计划咨询，并建立了超过 1,000 个家庭的初始等待名单。公司围绕计划在 2026 年底启动、设有门槛的 Founding Family Beta 设计了首条客户管道，时间点接近感恩节。Sunday
              希望借此从实验室评估转向持续的家庭数据采集，利用客户反馈扩大 Memo 的家务范围， 并验证全机队模型更新。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
