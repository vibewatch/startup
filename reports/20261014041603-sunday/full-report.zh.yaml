              - CO009
              - CO010
              - CO012
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 反常规架构：数据优先的移动躯干
            body: >-
              Sunday 的核心战略分歧，在于优先采集人类操作数据，而不是追求双足人形。通过部署低成本采集手套并采用带轮躯干，Sunday 将原型制造成本 降至约
              $20,000——显著低于工业人形机器人——同时消除了家庭场景中的跌倒风险。
            calloutType: insight
            claimRefs:
              - CO009
              - CO010
              - CO013
          - type: callout
            title: 商业化障碍：单位经济学与泛化能力
            body: >-
              Sunday 不到两年就达到 $1.15 billion 估值，但仍未产生收入，单位经济学也尚未得到验证。要实现低于 $10,000 的消费级价格，必须大幅降低 当前 $20,000
              原型的制造成本；而真实家庭部署又会引入人身安全、责任和分布外失效风险。
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作范围与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              Sunday 将旗舰产品 Memo 明确定位在尚处早期的家庭辅助机器人领域，并刻意与工业自动化、仓储物流区分开来。它不去争夺工厂物料搬运合同， 因为那里的流程结构化、且有专门的安全区域；Sunday
              瞄准的是无序的单户住宅环境。在这一家庭边界内，Sunday 聚焦摩擦最重的日常家务： 收拾餐桌、刮除食物残渣、装洗碗机、折叠衣物和整理放错位置的个人物品。Memo
              优先处理脆弱的家庭物件，而不是追求工业级举重能力， 因而用柔顺性和家庭安全绕开传统工业机器人指标。Sunday 的现状替代方案不是其他自主移动机器人，而是传统洗碗机、洗衣机等单一用途白色家电，
              加上外包的专业清洁劳动和无偿的家庭劳动。要从家庭预算中分得一杯羹，Memo 必须与这些旧有家电协同，而不是要求改造住宅结构。
            claimRefs:
              - CM001
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
      - number: '2.2'
        title: 可服务市场规模、成本现实与经济约束
        blocks:
          - type: paragraph
            body: >-
              评估通用家庭机器人的市场，必须把关于数万亿美元通用人工智能的投机叙事，过滤进物理硬件成本结构。2026 年 3 月，风投基于 Sunday 解锁消费级物理 AI 的潜力，将其投后估值定为 $1.15
              billion；但眼下可服务市场受到原型经济学的强力约束。Memo 手工装配的单台制造成本 约
              $20,000，原因包括定制双夹爪工具、伸缩脊柱执行器、传感器阵列和小批量零部件采购。管理层明确表示，大规模制造后目标零售价低于 $10,000。 按 $10,000 的资本性价格分摊 60
              个月计算，相当于每月约 $167，直接与高端奢侈家电或第二辆车的融资支出竞争。若没有普及的消费金融基础设施
              或补贴型硬件订阅合同，早期可服务可获得市场仍局限于富裕郊区家庭和早期科技采用者；这些人能承受高额前期硬件支出，却没有确定的二手流动性。
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM010
              - CM011
              - CM012
              - CM014
