    title: "Prototype Unit Cost vs. Retail Pricing Disconnect"
    body: "Memo's current hand-assembled prototype cost of approximately $20,000 is double Sunday's targeted retail price of under $10,000. Unless Sunday achieves its projected 50% manufacturing cost reduction through volume contract manufacturing, early commercial units will generate deeply negative gross margins."
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI007"
