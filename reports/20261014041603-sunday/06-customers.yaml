company:
  name: Sunday
chapter:
  number: 6
  title: Customers
  summary: >-
    Sunday targets residential households for domestic chore automation with its wheeled Memo robot, but the company
    remains pre-revenue and has not yet deployed a single commercial unit into a customer home. While public interest is
    robust with thousands of waitlist applicants for its invite-only Founding Family Beta launching in late 2026,
    commercial adoption, customer retention, and unit economics remain unproven.
sections:
  - id: customer-segmentation
    title: Customer Segmentation & Target Household Profile
    body: >-
      Sunday targets residential consumer households for domestic chore automation, deliberately bypassing commercial
      hospitality, healthcare, or industrial warehouse logistics. The company concentrates its go-to-market design on
      high-income single-family homeowners and dual-earner families who face persistent daily time constraints around
      routine chores such as laundry folding, table clearing, and kitchen tidying. Because consumer robotics hardware
      carries inherent deployment complexities, Sunday recognizes that early customer adoption will center on technology
      enthusiasts who are motivated to live alongside early-stage autonomous systems and are willing to tolerate
      occasional operational hiccups. In contrast to enterprise software or B2B hardware, Sunday possesses no commercial
      contract structures, enterprise procurement channels, or SLA commitments, focusing exclusively on establishing a
      direct consumer relationship.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
    tableRefs:
      - TU001
  - id: adoption-trajectory
    title: Adoption Trajectory & Pre-Commercial Demand
    body: >-
      Public appetite for domestic robotics automation has generated substantial top-of-funnel consumer interest for
      Sunday since its stealth unveiling in late 2025. Following viral showcase demonstrations of its Memo prototype
      preparing espresso and clearing glassware, the startup accumulated thousands of beta program inquiries and
      established an initial waitlist exceeding 1,000 households. The company has structured its initial customer
      pipeline around a gated Founding Family Beta rollout targeted for late 2026, coinciding with the Thanksgiving
      holiday horizon. Sunday intends to use this initial intake to transition from lab-bound evaluation to continuous
      domestic data collection, leveraging customer feedback to expand Memo's chore repertoire and validate fleet-wide
      model updates.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU008
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: customer-proof-and-pilots
    title: Customer Proof, Pilot Reality, and Operational Limitations
    body: >-
      Despite intense market enthusiasm and unicorn financing, Sunday has not yet placed a single commercial unit in a
      customer home, remaining pre-revenue with zero paying accounts. Customer proof is currently limited to prospective
      interest in the planned 50-unit Founding Family Beta and data-gathering workflows conducted by paid Memory
      Developer contractors wearing Skill Capture Gloves. Furthermore, Sunday's operational philosophy diverges sharply
      from domestic robotics peers such as Weave Robotics: while Weave deploys robots backed by remote human
      teleoperators who intervene in real time, Sunday commits strictly to autonomous physical AI execution without live
      in-home teleoperation. This pure autonomy stance raises the operational bar, requiring Memo to succeed in
      unstructured domestic environments without an active human-in-the-loop fallback.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU003
  - id: retention-risks-economics
    title: Retention Durability, Churn Risks, and Unit Economics
    body: >-
      The central diligence hurdle for Sunday lies in customer retention durability and unit economics rather than
      top-of-funnel consumer curiosity. In domestic settings where a robot must execute dozens of sequential physical
      actions daily, even an impressive 99.1% task reliability rate mathematically implies an operational failure
      approximately once every 100 actions, leading to daily dropped tableware, stalled laundry piles, or trapped
      navigation in cluttered rooms. Domestic robotics history underscores this durability challenge: heavily
      capitalized pioneers like Seven Dreamers Laboratories and FoldiMate folded after failing to solve the gap between
      automated demos and reliable domestic utility. Compounding this challenge, Memo prototype manufacturing costs
      approximately $20,000 per unit today against an unannounced retail price targeted under $10,000, leaving customer
      acquisition payback and recurring subscription margins highly speculative.
    claimRefs:
      - CU012
      - CU013
      - CU014
