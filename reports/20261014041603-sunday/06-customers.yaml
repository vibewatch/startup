      End-to-end customer journey from waitlist application to autonomous household task execution and long-term
      expansion.
    data:
      items:
        - description: Prospective users apply online for the Founding Family Beta.
          touchpoints:
            - Website beta application
            - Waitlist intake questionnaire
          label: Waitlist Application
        - description: Sunday selects initial cohort of early adopters willing to test prototype hardware.
          touchpoints:
            - Invitation email
            - Pre-deployment onboarding survey
          label: Cohort Selection
        - description: Sunday engineering personnel deliver and consult on in-home robot installation.
          touchpoints:
            - In-person team delivery
            - Home layout and 3D map calibration
          label: White-Glove Delivery
        - description: Households supervise initial chores such as laundry folding and table clearing.
          touchpoints:
            - Sunday companion mobile app
            - Voice commands and scheduled runs
          label: Supervised Initial Runs
        - description: Memo executes long-horizon tasks autonomously with remote operator assistance as safety net.
          touchpoints:
            - Daily scheduled cleaning cycles
            - Edge-case recovery prompts
          label: Autonomous Routine Execution
        - description: Founding families guide prioritization of new household skills and software updates.
          touchpoints:
            - In-app feedback loop
            - Direct access to Sunday engineering team
          label: Skill Expansion & Feedback
    claimRefs:
      - CU003
      - CU004
      - CU005
callouts:
  - calloutType: risk
    title: Pre-Revenue Gap Between Demo Reliability and Household Retention
    body: >-
      While Sunday's ACT-2 model demonstrates a 99.1% success rate on laundry folding in internal trials, Sunday has not
      yet deployed a single commercial unit into a customer's home. In domestic environments where robots execute dozens
      of daily tasks, even a 1% per-step failure rate can result in daily physical disruptions, making actual household
      retention the central diligence uncertainty.
    claimRefs:
      - CU008
      - CU009
