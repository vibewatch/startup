companyProfile:
  summary: >-
    Sunday is a private consumer robotics company building Memo, a wheeled home robot that uses a proprietary Skill
    Capture Glove data loop and imitation-learning models to automate chores such as laundry folding, table clearing,
    and dishwasher loading. The company is based in Mountain View, has raised $200 million, and reached a $1.15 billion
    post-money valuation in March 2026, but it remains pre-revenue and has not disclosed customer pricing, paid
    deployments, or unit economics.
