evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee membership, and investor-control summary.
    whyItMatters: Public evidence does not let the report assess governance quality or decision-right concentration with confidence.
    diligencePath: Request a current board deck, board observer list, and major-investor rights summary from management.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: Audited profitability, margin, and cash-flow statements behind the >$200M ARR marker.
    whyItMatters: Without audited statements, investors cannot separate durable revenue quality from topline scale claims.
    diligencePath: Request audited or board-approved financial statements, cohort margins, and cash-flow bridge.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Interest cost, maturity, covenant package, collateral, and draw mechanics for the 2023 and 2025 debt financings.
    whyItMatters: Debt can materially affect optionality and downside even when the topline financing headline looks attractive.
    diligencePath: Request signed debt agreements or lender summary sheets from Tipalti and Hercules or JPMorgan.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Current 2025-2026 headcount by geography and function.
    whyItMatters: The only fetched hard headcount marker is from 2022, which is stale for operating-efficiency analysis.
    diligencePath: Request current HR census or hiring-plan slide and reconcile it to the layoffs disclosed in 2025.
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: minor
    topic: ipo-readiness
    missingEvidence: Board-approved timeline, auditor status, and internal controls posture for a possible IPO path.
    whyItMatters: The overview can call Tipalti an IPO candidate only directionally without an actual readiness plan.
    diligencePath: Request IPO readiness workstream materials, auditor letters, and internal-controls readiness review.
    relatedQuestionRefs:
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: >-
      Complete internal chronology covering secondaries, product launches, regulatory filings, and any unpublicized
      financing amendments.
    whyItMatters: >-
      The public timeline is sufficient for overview sequencing but not exhaustive enough to treat the milestone table
      as complete.
    diligencePath: Request a company-prepared milestone chronology and reconcile it to board materials and press archives.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: >-
      A company-specific SAM model that bridges broad AP and B2B payment market estimates to Tipalti’s actual ICP, win
      rate, and product scope.
    whyItMatters: >-
      Public market pages prove demand direction but do not isolate the portion of spend that Tipalti can realistically
      monetize.
    diligencePath: Request management’s bottom-up SAM by segment, geography, product module, and expected take-rate.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer conversion
    missingEvidence: >-
      Internal pipeline by company size, sales cycle length, and module attach rate from AP into procurement, expenses,
      and treasury.
    whyItMatters: Without funnel evidence, it is hard to translate broad market growth into Tipalti-specific expansion assumptions.
    diligencePath: Request CRM cohort data and implementation-to-expansion conversion metrics.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: TM001 market definition table
    missingEvidence: >-
      A sharper breakdown of what management excludes from its own TAM, especially payroll, pure ERP modules, and manual
      bank workflows.
    whyItMatters: Boundary slippage can overstate strategic optionality and complicate comparable analysis.
    diligencePath: Request management’s market-taxonomy slide and reconcile it to product packaging.
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: minor
    topic: adoption ROI
    missingEvidence: Measured before-and-after ROI by invoice volume band, customer size, and geography.
    whyItMatters: Market reports describe why buyers adopt, but actual ROI proof determines conversion speed.
    diligencePath: Request customer ROI dashboards and implementation benchmarks from sales engineering.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Customer-specific quotes, discount schedules, and contract terms for Tipalti, Coupa, Airbase, and SAP Concur by
      segment and invoice volume.
    whyItMatters: >-
      Public pages show list or custom structures but not the realized price bands that determine win rates, discounting
      behavior, and margin pressure.
    diligencePath: >-
      Request at least three recent enterprise quotes or anonymized RFP responses from finance buyers, implementation
      partners, or procurement advisers.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: switching-behavior
    missingEvidence: >-
      Segment-level churn, rip-and-replace, and module-attach data showing whether AP buyers truly switch vendors or
      just add adjacent modules.
    whyItMatters: >-
      Review evidence suggests lock-in, but without migration-rate data it is hard to size how much competitive pressure
      converts into actual displacement.
    diligencePath: >-
      Request customer reference calls, renewal decks, churn analyses, or implementation-partner win-loss summaries
      split by buyer size and ERP base.
    relatedQuestionRefs:
      - QP022
      - QP025
    relatedTableRefs:
      - TP006
  - type: missing-source
    severity: minor
    topic: implementation-friction
    missingEvidence: >-
      Measured deployment times, services effort, and post-go-live ticket volumes across Coupa, Concur, Tipalti, and
      Airbase implementations.
    whyItMatters: >-
      Current review evidence shows friction and change management burden, but quantified benchmark data would
      distinguish isolated complaints from structural adoption drag.
    diligencePath: >-
      Collect statements of work, onboarding timelines, and post-implementation satisfaction data from customers, SIs,
      or reseller references.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC payback, NRR, and cohort retention by segment remain undisclosed.
    whyItMatters: >-
      These metrics determine whether Tipalti behaves like a durable software platform or a more service-heavy payments
      operator.
    diligencePath: >-
      Request monthly board KPIs with gross margin by stream, CAC payback, NRR, gross retention, and segment-level
      churn.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt covenant headroom, and maturity schedule are not public.
    whyItMatters: Debt access alone does not answer downside resilience or next-round timing.
    diligencePath: Request the latest treasury package, cash bridge, debt schedule, covenant model, and 24-month operating plan.
    relatedQuestionRefs:
      - QI022
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      No retained public source explains how Tipalti recognizes software, payment, FX, implementation, and service
      revenue.
    whyItMatters: Revenue quality and comparability to SaaS peers depend on the recognition policy.
    diligencePath: Request the accounting memo, auditor summary, and sample customer contract language for each monetization stream.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Top-customer concentration, module attach rates, and renewal cohorts are not public.
    whyItMatters: Scale can mask dependence on a small number of accounts or weak expansion durability.
    diligencePath: Request top-20 customer concentration, module attach by cohort, and 12-quarter renewal and churn tables.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Published list prices do not show realized payment fees, FX spreads, or implementation recovery by customer
      segment.
    whyItMatters: Underwriting needs actual realized pricing, not entry-page anchors.
    diligencePath: >-
      Request top-10 contracts, discount history, fee schedules by payment rail, and professional-services recovery
      rates.
    relatedQuestionRefs:
      - QI003
      - QI019
    relatedTableRefs:
      - TI002
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: No retained public source provides a post-2021 equity valuation or market-clearing secondary reference.
    whyItMatters: Using a stale peak-era valuation can overstate current downside protection or upside confidence.
    diligencePath: >-
      Request any internal 409A, tender, or secondary-mark pricing from 2025-2026 and reconcile it to current debt
      terms.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: implementation-ops
    missingEvidence: Named implementation timelines, services mix, and customer-success staffing by deployment size.
    whyItMatters: >-
      Public reviews show friction, but they do not establish how repeatable or manageable implementation burden is
      across customer cohorts.
    diligencePath: >-
      Request implementation playbooks, time-to-live benchmarks, services gross margin, and reference calls segmented by
      ERP and entity complexity.
    relatedQuestionRefs:
      - QE018
      - QE025
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current public trust-center evidence for SOC 2 scope, PCI scope, penetration testing cadence, and
      incident-response SLAs.
    whyItMatters: >-
      Security marketing exists, but underwriters still need formal assurance artifacts and scope boundaries before
      treating controls as investment-grade.
    diligencePath: >-
      Obtain current SOC 2 report, PCI attestation, DPA/subprocessor list, and customer-facing security package under
      NDA.
    relatedQuestionRefs:
      - QE012
      - QE023
      - QE025
    relatedTableRefs:
      - TE004
  - type: stale
    severity: material
    topic: reliability-history
    missingEvidence: >-
      Official historical incident log, uptime SLA, and recent postmortems rather than a third-party point-in-time
      status check.
    whyItMatters: >-
      Operational reliability is central to a payments-adjacent platform, and a single uptime snapshot does not prove
      production resilience.
    diligencePath: >-
      Request status-page history exports, uptime reports, customer SLA language, and the last year of Sev1/Sev2
      incident summaries.
    relatedQuestionRefs:
      - QE019
      - QE025
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: minor
    topic: api-operating-limits
    missingEvidence: >-
      Public detail on API rate limits, versioning policy, and deprecation windows across payout and procurement
      endpoints.
    whyItMatters: >-
      Integrator effort and long-term maintenance risk depend on whether APIs are stable, capacity-managed, and backward
      compatible.
    diligencePath: >-
      Ask for API versioning policy, rate-limit envelopes, webhook/event coverage, and customer migration notices for
      recent API changes.
    relatedQuestionRefs:
      - QE011
      - QE021
      - QE025
    relatedTableRefs:
      - TE003
