summary:
  headline: >-
    Tipalti is a real scaled fintech platform with broad product depth and strong customer adoption, but the combination
    of regulated payments exposure, debt-funded expansion, layoffs, and a stale 2021 valuation anchor makes this a
    research-more name until management proves current economics and fair value.
