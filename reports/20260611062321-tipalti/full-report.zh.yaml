  - id: TR005
    title: 缓解措施和终止标准表
    columns:
      - 风险
      - 可监测触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 牌照 / AML / 制裁
        - 牌照续期状态、检查结果、合作银行通知
        - 任何续期失败、重大检查发现或制裁控制问题
        - 暂停承销，直到管理层给出整改方案，并让监管方 / 合作伙伴放心
      - - 打款连续性
        - 支付可用时间、事故数量、RCA 严重性
        - 反复或长期打款事故，尤其跨越季末结账或类薪资周期
        - 降低信心；把运营视为闸门风险，而不是规模化优势
      - - 实施 / 支持拖累
        - 平均实施时间、工单积压、支持 SLA 达成率
        - 部署时间或支持响应速度明显恶化
        - 假设企业客户队列扩张放慢、流失风险上升
      - - AI 功能竞赛
        - 附加率、输赢单数据、相对同业的路线图滑坡
        - AI 功能上线，却没有可衡量的增购、留存或赢单率改善
        - 重估产品叙事；不要只为 AI 定位支付溢价
      - - 重新聚焦中端市场
        - 新 Logo 结构、客户客群结构、销售生产率
        - 中端市场占比上升，但净留存或生产率没有改善
        - 把重组视为需求质量走弱的信号，而不是战略更聚焦
      - - 债务负担
        - 契约余量、利息费用、现金消耗、现金跑道
        - 偿债开始约束研发、GTM 或支持投入
        - 预期估值重置，并可能出现融资压力
      - - 合作伙伴依赖
        - 银行 / ERP / 平台合作伙伴通知或故障
        - 失去主要合作伙伴支持、认证或银行能力
        - 重新评估交付韧性和客户扩张假设
      - - 集中度可见性缺口
        - 管理层披露客户、合作银行和牌照集中度的意愿
        - 投资人提出要求后，仍没有关于集中度或牌照清单的尽调披露
        - 视为未解决的投资逻辑阻断点，而不是普通跟进事项
    notes: 终止标准按可监测事件来定义，因此本章能服务投资委员会，而不只是一份叙事备忘录。
