  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余严重性集中在受监管资金流动、竞争性重新定价，以及靠债务支撑的执行。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
        - 极高可能性
      rows:
        - label: 影响有限
          values:
            - 0
            - 0
            - 0
            - 0
        - label: 影响中等
          values:
