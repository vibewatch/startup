      - number: '5.3'
        title: 信任、控制与产品成熟度
        blocks:
          - type: paragraph
            body: >-
              最可信的产品技术正面因素在控制表面。Tipalti 的 Workday 集成页异常具体：它声称可在付款前拦截疑似欺诈，执行 OFAC 和 Do Not Pay 筛查，支持 MFA、基于角色的安全、审计日志、IP
              限制、HTTPS 和 AES 加密，以及旨在减少重复发票的 OCR 加机器学习发票抓取。供应商管理和税务页面还加入自助入驻、多语言支持、W-8 和 W-9 收集、VAT 抓取，以及覆盖 60 多个国家、3,000
              多条规则的税务引擎。这是有意义的证据，说明平台不只是自动化工作流，也把合规和控制步骤嵌入运营模式。不过，各模块成熟度并不均匀。核心 AP、采购和费用工作流看起来已经上线且有文档；较新的 AI 层、基于
              Statement 的资金管理表面和卡货币化功能，主要由 Tipalti 自有材料以及 2025 年末至 2026 年 Q1 的发布支撑。Tipalti 自己的 AI
              页面也承认输出可能不准确或不完整，并称客户可关闭 AI 功能；这是正确的治理姿态，也提醒我们不要把较新的智能体工作流视为毫无摩擦。
