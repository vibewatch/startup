          label: 分发 / 嵌入
        - from: tipalti
          to: customers
          label: AP + 付款 + AI 交付
        - from: reviews
          to: customers
          label: 买方信心
        - from: customers
          to: reviews
          label: 实施结果
    claimRefs:
