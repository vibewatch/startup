chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、商业模式与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Tipalti 把自己定位成 AI 驱动的财务自动化平台，而不是单一用途的 AP
              工具。从公司页、首页、应付账款、全球付款和大规模付款材料看，公司持续描述的是一套连通套件，覆盖应付账款、采购、员工费用、卡、供应商管理、税务合规、资金管理和全球支付。这个定位很关键：Tipalti 要做的是
              CFO 办公室的工作流基础设施，而不只是发票自动化。公开材料也显示，公司明确聚焦中端市场和高速增长企业——这些客户复杂到需要多实体控制和全球支付触达，但仍希望用统一的 SaaS
              控制平面，而不是把不同工具拼在一起。地理足迹同样有分量。Tipalti 公司页和 2022–2023 年公告显示，总部位于加州 Foster City，运营足迹覆盖 London、Tel
              Aviv、Toronto、Vancouver、Tbilisi 和 Netherlands。官方隐私语言确认了多实体法律结构，包括 Tipalti, Inc.、Tipalti Solutions
              LTD、Tipalti Payments, Inc.、Tipalti Europe LTD、Tipalti Canada, Inc. 和 Tipalti B.V. 这种法律和办公室分布与 Tipalti
              的产品承诺一致：通过 Citi、Wells Fargo、J.P. Morgan、Visa 等银行和卡合作伙伴，支持 200 多个国家和地区、120 种货币的全球供应商和收款人工作流。
