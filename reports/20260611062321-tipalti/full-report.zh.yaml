  - id: TV005
    title: 投资逻辑破裂和终止触发点表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 桥接不及预期
        - 经审计 ARR 和收入质量仅略高于公开 >$200M 下限
        - 旧的 $8.3B 锚点变得站不住脚，基准情景也会下移。
        - 重新定价至更接近悲观区间，或直接退出。
      - - 留存或队列质量走弱
        - NRR 或队列续约无法支撑软件式溢价
        - Tipalti 不再像复利型自动化平台，而更像交易量业务。
        - 将倍数压缩至支付行业中位数附近。
      - - 优先股堆叠重于预期
        - 清算条款或附函吸收了低于 $4B 退出的大部分价值
        - 头部估值高估了普通股结果。
        - 要求结构保护、更低入场价，或两者都要。
      - - 债务条款约束灵活性
        - 契约、摊还或流动性限制收窄战略选项
        - 2025 年贷款不再是桥接资本，而变成下行杠杆。
        - 降低估值、收紧尽调，或回避。
      - - AI 没有改善经济性
        - AI 仍只是故事层，没有带来实施、利润率或留存提升
        - 软件式估值溢价逻辑坍塌。
        - 移到区间低端。
      - - IPO 准备度弱于宣传
        - 没有经审计上市公司材料包，治理准备度弱，或指引纪律差
        - 流动性路径被推迟，后期私营溢价应当压缩。
        - 把公司视为持有期更长、当前价值更低的私营资产。
    notes: 这些触发点会移动估值：每一项改变的都是价格支撑，而不只是公司叙事语气。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV040
