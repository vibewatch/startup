      - number: '4.4'
        title: 披露阻碍与财务结论
        blocks:
          - type: paragraph
            body: >-
              净评估是：需求建设性，但承销信心应保守。多个来源相互印证，Tipalti
              是有真实规模的软件公司：业务在把财务自动化、全球支付以及较新的资金管理或支出模块货币化，水平符合一家严肃的中端市场平台。不过，留存公开记录在投资承销最关键问题上明显更薄。没有公开经审计收入拆分，没有按收入流披露毛利率，没有
              CAC
              或回本数据，没有净留存，没有集中度披露，也没有当前现金或跑道披露。反向客户反馈还显示，即便产品解决了重要财务痛点，实施和支付运营也可能制造真实摩擦。因此，公开证据足以支持一个谨慎正面的财务判断：收入广度、需求和资本可得性成立；但还不足以把收入质量、利润率路径或资产负债表充足性视为已解决。任何尽调都应在把过时的
              2021 年估值用作承销锚点前，强力追问收入确认政策、队列经济性和现金规划。
