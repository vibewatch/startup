        - 毛利率、留存、股权结构表和契约数据缺失，普通股结果很难划定边界。
      - - 估值立场
        - 昂贵
        - 留存的公开可比公司大多按个位数收入倍数交易，而 Tipalti 的历史估值暗示的结果要高得多。
      - - 决策含义
        - 出价前先尽调
        - 在承销价格前，要求提供经审计 ARR 和利润率桥接、当前公允价值证据，以及下行保护条款。
