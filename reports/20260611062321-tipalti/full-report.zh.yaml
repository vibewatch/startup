  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围与客户工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Tipalti 拥有真正宽的财务运营足迹，而不是单点 AP 工具。Tipalti
              持续把平台描述为覆盖应付账款、全球支付、采购、费用、卡、供应商管理、税务合规，以及如今的资金管理；这些主张有独立产品页面支撑，不只是首页上一段模糊文案。最强证据集中在核心 AP 工作流：供应商入驻、发票抓取、PO
              匹配、审批路由、付款执行和对账被描述为一个连通动作；采购和费用则被呈现为共享数据、审批、报销或支付通道的相邻工作流。卡也不再只是泛泛的支出控制提法；帮助中心记录了不同的虚拟卡和实体卡产品，2026 年 Q1
              发布说明还把发票卡接入既有控制、ERP 同步，甚至返现经济性。结果是，这个平台看起来很贴合财务控制负责人和 AP 团队的工作，但产品地图向卡货币化和资金管理外扩的速度，已经快于公开证据能展示采用深度的速度。
