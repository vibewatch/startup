      - number: '1.2'
        title: 创始人、领导层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              抓取材料里最清楚的创始人事实是，Tipalti 由 Chen Amit 和 Oren Zeev 于 2010 年创立，Amit 仍任 CEO，Zeev
              列为联合创始人兼董事长。官方材料还显示，除两位创始人外，公司有更宽的领导班子：Rob Israch 任总裁，Dan Barzily 任 CFO，Manish Vrishaketu 任首席客户与运营官，Roby
              Baruch 任首席产品与技术官，Alice Davidson 任总法律顾问，Perla Stoeckert 任首席合规官。2022 年和 2023 年动能公告尤其有用，因为它们记录的是领导层晋升和
              C-suite
              扩张，而不只是静态履历。即便如此，公开治理披露仍不完整。公司页展示了审计委员会主席、一名投资人和一名顾问，但抓取材料没有提供完整的当前董事会名单、投票权摘要或所有权地图。因此，本章可以较有把握地支持创始人连续性和职能领导覆盖，但仅靠公开证据还无法完整背书治理质量。对后续尽调的含义很直接：Tipalti
              看起来已经运营成熟，能在财务、产品、合规和营收等职能配置规模化高管；但投资人仍需索取董事会组成和控制权条款，才能把治理视为已解决问题。
