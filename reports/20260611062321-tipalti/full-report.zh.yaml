  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Tipalti 放进一个单一、无差别的市场桶里估算。它解决的运营问题位于应付账款自动化、B2B 支付编排、采购工作流和费用或支出控制的交叉点。最窄的镜头是 AP
              自动化：发票抓取、编码、审批路由、匹配、供应商验证、付款排程和对账。Tipalti 自己的教育材料也强化了这个定义，明确把 AP 自动化与供应商入驻、OCR 和 AI
              数据抓取、审批工作流、付款执行和对账连接起来。这比简单发票影像更宽，但比全企业 ERP 替代更窄。相邻领域很重要，因为它们决定谁买、预算如何归类、供应商为何趋同。采购软件管理采购申请、供应商工作流、政策控制和
              procure-to-pay 编排。费用管理管的是员工发起支出和报销。B2B 支付基础设施则决定已批准义务如何通过 ACH、电汇、卡或跨境 rails
              实际流转。现实中，财务团队常先用手工替代方案——邮件审批、电子表格跟踪、共享 inbox、ERP 变通、支票批处理和银行门户电汇——再扩展到集成软件。BILL、Ramp 和 Stampli
              的供应商页面显示同一种市场模式：AP 如今销售的是 AI 辅助工作流加付款执行，不只是发票数字化。
