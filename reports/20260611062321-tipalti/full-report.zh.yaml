  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - ARR / 收入假设
      - 倍数假设
      - 隐含估值
      - 概率信号
      - 必须成立的条件
    rows:
      - - 乐观
        - $250M-$325M 运行率，且有软件式留存和利润率证明
        - 16x-20x
        - ~$4.0B-$6.5B
        - 可能，但要求很高
        - Tipalti 证明 AI 和工作流能带动扩张，利润率呈现软件特征，且投资人仍愿意相对公开支付可比公司给溢价。
      - - 基准
        - $220M-$275M 运行率，经济性良好但并不突出
        - 10x-16x
        - ~$2.5B-$4.0B
        - 留存证据最能支撑
        - 公司仍是高质量财务自动化资产，但估值会较 2021 年峰值明显压缩，以反映 2026 年市场区间。
      - - 悲观
        - $200M-$230M 运行率，留存更弱，或债务 / 优先权拖累更重
        - 8x-11x
        - ~$1.6B-$2.5B
        - 尽调若不及预期，下行空间明显
        - 增长放慢、溢价向支付行业中位数压缩，或债务和股权层级条款吸收的价值超过预期。
      - - 历史估值锚
        - $8.3B 历史投后估值
        - 基于公开 ARR 下限为 40x+
        - $8.3B
        - 仅作历史锚点
        - 投资人需要看到远高于当前公开记录的未披露 ARR 和利润率质量。
    notes: 情景估值是以公开 ARR 下限和明确溢价假设为锚的简单倍数桥接，单位为十亿美元，不是管理层指引或 DCF。
    claimRefs:
      - CV014
      - CV045
      - CV046
      - CV047
      - CV049
      - CV050
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标锚
      - 倍数 / 估值状态
      - 相关性
      - 局限
    rows:
      - - BILL.com
        - 2026 财年 Q3 收入 $406.6M；2026 财年指引 $1.642B-$1.652B
        - 约 1.8x EV/LTM 收入；约 8.7x EV/LTM EBITDA
        - 最明显的公开 AP 和财务运营基准；显示规模化 AP 平台在 2026 年可能交易得多便宜。
        - SMB 占比高于 Tipalti，且已经上市，可能低估中端市场全球工作流的溢价。
      - - Corpay
        - 2026 年 Q1 收入 $1.261B；2026 年指引 $5.25B-$5.33B
        - 约 6.3x EV/LTM 收入；约 11.9x EV/LTM EBITDA
        - 可作为规模化企业支付和 AP 现代化的公开高端可比公司。
        - 比 Tipalti 更宽、更成熟、更多元，因此不是纯粹逐项可比的软件公司。
      - - Payoneer
        - 2025 年收入 $1.053B；2026 年 Q1 收入 $261.6M
        - 盈利的公开跨境平台；当前留存来源给出的运营规模比实时倍数更清楚
        - 有助于理解跨境和 B2B 打款语境。
        - 不是直接的 AP 自动化平台，当前留存来源集也无法锁定干净的实时 EV/收入倍数。
      - - Flywire
        - 2026 年 Q1 收入 $188.1M；2025 年支付量 $37.6B
        - 规模较小但由软件驱动的支付可比公司，2026 年增长强劲且盈利能力改善
        - 可作为软件加支付模型的参照，这类模型能跑赢原始支付增长。
        - 垂直结构偏教育、医疗和旅游，而不是财务自动化。
      - - 公开支付公司中位数
        - 2026 年 Q1 支付和转账队列
        - EV/Revenue 中位数 3.6x；平均值 7.7x
        - 是理解 2026 年市场如何给支付重业务定价的最佳基础率公开基准。
        - 中位数和平均值是宽行业统计，不是直接公司可比。
      - - 私营金融科技平均值
        - 2026 年 Q1 私营与公开金融科技数据集
        - 私营 EV/Revenue 16.4x，公开平均 5.9x
        - 说明为什么后期私营估值可在一段时间内高于公开可比公司。
        - 数据集平均值受异常值拉动，并不能证明 Tipalti 本身应享有私营溢价。
    notes: 可比公司集有意保持不完整，并混合直接公司和适合模型的市场参照，因为 Tipalti 没有完美的公开对标。
    enumerationScope:
      coverage: partial
      basis: >-
        Partial set covering the most decision-useful 2026 public companies and market benchmarks for Tipalti: BILL,
        Corpay, Payoneer, Flywire, payments medians, and private-public fintech bands.
    claimRefs:
