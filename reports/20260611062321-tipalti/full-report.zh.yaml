  - id: TP006
    title: 切换成本与锁定机制
    columns:
      - 锁定向量
      - 证据
      - 受益厂商
      - 对买方的含义
      - 对 Tipalti 的威胁
    rows:
      - - ERP 和 GL 集成
        - 厂商页面把具名双向集成或大型连接器库放在核心位置
        - 受益厂商：Tipalti、Coupa、SAP Concur、Ramp、BILL、Stampli
        - 替换 AP 层可能打断对账和财务关账流程
        - Tipalti 可凭集成广度赢单，但装上之后也更难被移除
      - - 审批层级和工作流路由
        - 几乎所有套件都销售可配置审批流和异常处理
        - 所有主要套件
        - 工作流逻辑会变成内控和审计实践的一部分
        - 功能趋同时，流程重设计成本会偏向在位厂商
      - - 供应商入驻和税务数据
        - 多款产品都出现供应商门户、W-9 收集和入驻链接
        - 受益厂商：Tipalti、BILL、Stampli、Brex、Ramp、Coupa
        - 迁移供应商基础会带来真实培训和数据清理成本
        - 如果入驻流程全球化且合规负担重，Tipalti 受益
      - - 卡、费用和差旅整合
        - 卡优先或差旅费用套件会从单一产品扩到多个支出类别
        - 受益厂商：Ramp、Brex、SAP Concur、Paylocity Airbase
        - 多条支出工作流共存后，单点替换吸引力下降
        - Tipalti 要证明 AP 基础功能之外的价值，才能撬开这些打包方案
      - - 采购流程所有权
        - Coupa、Airbase、Stampli、Ramp 和 Brex 都把 AP 接到采购控制
        - 受益厂商：Coupa、Paylocity Airbase、Stampli、Ramp、Brex
        - 采购所有权会扩大干系人数量，拖慢 rip-and-replace 决策
        - Tipalti 的采购模块重要，因为独立 AP 更容易商品化
      - - 安装基础分销和文化适配
        - 评论和分销证据显示，SAP 适配、HCM 适配和网络默认选项都重要
        - 受益厂商：SAP Concur、Paylocity Airbase、BILL
        - 在功能比较前，在位生态就可能塑造入围名单
        - Tipalti 必须进入全球复杂度压过生态惯性的预算
    notes: AP 一旦嵌入关账、审批、供应商、卡或差旅工作流，切换就很少只是功能比较；这些行解释了原因。
