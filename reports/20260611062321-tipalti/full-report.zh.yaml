        - 若 2026 年公允价值信号得到验证，并叠加软件式留存和利润率证据，估值立场可向合理移动。
    notes: 本建议明确对价格敏感：它评估的是公开证据能否支撑旧的头部估值，而不是抽象判断 Tipalti 是否是一家优质公司。
