          detail: 财务总监、AP 团队、采购审批人、员工和资金用户在可配置的审批和角色规则内操作。
        - id: l2
          label: 工作流应用
          detail: AP、采购、费用、卡、供应商入驻和付款工作流构成可见的用户侧运营层。
        - id: l3
          label: AI 和规则引擎
          detail: AI Assistant、面向具体任务的智能体、OCR/ML 捕获、重复校验和审批逻辑嵌在工作流执行中，而不是单独的纯分析模块。
        - id: l4
          label: 集成和身份织网
          detail: ERP、HRIS、SSO、Slack、Workday、Workato 和自定义 API 在不同系统之间同步对象和用户访问。
        - id: l5
          label: 支付和合规通道
