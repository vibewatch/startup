      - number: '8.4'
        title: 退出就绪度、尽调要求和论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              2026 年 IPO 窗口已经打开，但明确是选择性开放。EY、PwC 和 Forbes 都把市场描述为奖励具备规模、基本面有韧性、经常性收入持久、治理强、且有可信路径迈向持续盈利的发行人。Forbes
              给出的实操门槛——估值约 $2-3 billion、收入超过 $200 million、盈利能力达到盈亏平衡或更好——说明 Tipalti 也许已有资格进入讨论。但规模本身不等于准备就绪。Tipalti 公开谈过
              IPO 准备，并且显然在塑造一个金融自动化与 AI
              故事；但公开记录仍缺少经审计盈利能力、净留存、指引纪律、股本结构条款和新的股权参照点。因此，建立信心的路径靠尽调，而不是热情。投资委员会在支付任何接近历史标记的价格前，应要求看到 ARR 与利润率桥、409A
              或二级市场证据、债务契约和优先权栈细节。如果这些文件不及预期，投资论点会很快破裂，因为当前大部分支撑来自溢价假设，而不是已披露证据。
