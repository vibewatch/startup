companyProfile:
  summary: >-
    Tipalti 是一家私营财务自动化和 B2B 支付平台，由 Chen Amit 和 Oren Zeev 于 2010 年创立。公司从 AP 自动化和全球付款切入，已经扩展成更宽的 CFO
    办公室堆栈，覆盖采购、费用、卡、供应商管理、税务合规和资金管理，并在 2025 年收购 Statement。公开证据支持其规模已经可观——服务 5,000+ 家企业、ARR 超过 $200 million、年化支付量约 $75
    billion；同时也显示，经历 2025 年裁员和新增非稀释融资后，公司仍在增长、利润率约束和产品扩张之间找平衡。
