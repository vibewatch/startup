      - number: '8.2'
        title: 公开可比区间与 2026 年 fintech 重置
        blocks:
          - type: paragraph
            body: >-
              Tipalti 的可比公司问题，不是没有公开参照，而是公开参照比历史私募标记便宜得多。Finro 的 2026 年一季度数据称，公开 fintech 平均 EV/revenue 为 5.9x，支付与转账公司平均
              7.7x，但中位数只有 3.6x。Windsor Drake 当前 M&A 工作显示，成熟支付企业通常以约 4-6x 收入和 8-12x EBITDA 成交。Multiples.vc
              在实时公开公司里也显示同样分散：BILL 约为 1.8x EV/LTM revenue，Corpay 约为 6.3x。从业务上看，这些可比公司并不完全相同——BILL 更偏 SMB，Corpay
              更宽、更成熟，Flywire 和 Payoneer 更偏跨境——但它们仍锚定了公开市场目前愿意为规模化金融软件和支付资产支付的价格。Tipalti
              卖的是自动化和资金管理软件，而不是纯支付通道，因此也许应享有一定溢价；但这个溢价必须靠留存、利润率和披露质量挣出来。公开 ARR 只给出超过 $200 million
              的底线，没有披露经审计分母，基准证据指向的估值区间显著低于 2021 年头部估值标记。
