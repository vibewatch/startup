  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Tipalti 需要银行、监管机构、ERP / 平台伙伴，以及面向客户的交付质量，才能把平台宽度转化为持久增长。
    data:
      nodes:
        - id: tipalti
          label: Tipalti 核心平台
        - id: banks
          label: 银行 / 付款伙伴
        - id: regulators
          label: 监管机构
        - id: erp
          label: ERP / HRIS / SSO 伙伴
        - id: platforms
          label: SAP / Workday / APIs
        - id: customers
          label: 中型市场 / 企业客户
        - id: reviews
          label: 评论 / 支持口碑
      edges:
