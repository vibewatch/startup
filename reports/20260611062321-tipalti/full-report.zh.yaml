  - id: FU001
    title: Tipalti 客户旅程图
    type: journey-map
    layout: standard
    summary: 公开可见的路径从财务痛点出发，经过实施、供应商上线、重复使用，最终走向更广的财务套件扩张。
    data:
      items:
        - label: 痛点识别
          value: Manual invoice handling, fragmented payouts, approval bottlenecks, or procurement email chains
          note: 案例研究和合作伙伴材料的起点高度一致：财务团队被手工流程或多实体复杂度压住。
        - label: 评估
          value: ERP integration fit, global payment coverage, tax compliance, and supplier self-service are assessed
          note: 官方内容反复把 NetSuite、Intacct、全球收款方覆盖和税务流程列为选型标准。
        - label: 实施
          value: >-
            Finance team configures approvals, onboarding flows, and ERP sync; partner or customer-success help may be
            required
          note: 官方材料主打快速上线，但评论平台显示，大型买家的实施仍可能很重。
        - label: 生产付款批次
          value: Invoices, suppliers, contractors, publishers, or creators are paid through centralized workflows
          note: 具名客户案例显示，部署完全上线后，这一阶段能带来可衡量的时间或人力节省。
        - label: 重复使用与信任
          value: >-
            Suppliers or payees track status, approvers use dashboards, finance teams close faster and rely on recurring
            workflows
          note: 独立评论支持较广的重复使用，但公开来源没有披露续约批次或合同期限。
        - label: 扩张
          value: Customers may add procurement, expenses, treasury, or broader finance-operations automation
          note: 公开定位明显指向套件扩张，但附加率和转化数据没有公开。
    claimRefs:
      - CU002
      - CU003
      - CU021
      - CU041
      - CU042
      - CU046
      - CU047
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: 从最初的手工流程痛点，到规模化生产使用和更广推广的代表性部署路径。
    data:
      nodes:
        - id: manual-pain
          label: 手工 AP 或付款痛点
          detail: 客户提到的痛点包括分散的邮件、电子表格、银行上传，或笨重的付款批次。
          type: input
        - id: evaluation-fit
          label: 平台匹配评估
          detail: 决策标准集中在 ERP 适配、税务合规、供应商自助服务和全球支付覆盖。
          type: process
        - id: implementation-work
          label: 实施与变更管理
          detail: 官方口径里的实施可以很快，但评论平台的个案显示，大型机构的实施负担可能更重。
          type: process
        - id: production-workflow
          label: 生产工作流上线
          detail: 具名客户已在生产环境中通过 Tipalti 处理发票、供应商付款或承包商付款。
          type: process
        - id: efficiency-outcome
          label: 效率与控制结果
          detail: 公开案例研究最常提到更快关账、更少手工工时，以及不增员扩张。
          type: output
        - id: suite-expansion
          label: 潜在套件扩张
          detail: 初始工作流嵌入后，客户可以继续叠加采购、费用或资金管理。
          type: output
    approximationNotes: 由于公开资料没有披露各阶段转化率，该图是方向性的工作流图，而不是数字漏斗。
    claimRefs:
      - CU009
      - CU012
      - CU018
      - CU019
      - CU041
      - CU042
      - CU044
      - CU046
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: standard
    summary: 量化案例研究、仅展示标识的引用和独立评论页面之间，公开证据质量差异很大。
