  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Tipalti
              的公开定价和产品页面让收入架构清晰可读，尽管还达不到承销级披露。公司明确表示，定价由基础订阅叠加按交易计费构成，实际支出取决于支付量、法律实体数量和启用模块。区域列表页给出了可见锚点：英国方案每月从 £99 和
              £199 起，欧洲方案每月从 €99 和 €219 起，另有支付或模块经济性。因此，Tipalti
              卖的不是简单席位许可。它把工作流软件、资金流转，以及采购、卡、费用、供应商管理、税务和资金管理等附加功能一起货币化。2025 年 6 月收购 Statement
              后，公司又通过资金管理自动化和现金智能工具进一步扩大范围。含义是，扩张收入更有想象空间，但利润率清晰度更复杂：公开证据支持混合 SaaS
              加支付收费模式，却仍未披露实际抽佣率、模块组合、收入确认政策，或毛利中有多少来自软件、多少来自运营型支付服务。
