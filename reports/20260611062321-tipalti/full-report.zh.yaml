  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: Tipalti 的规模和产品宽度足以进入尽调，但价格发现陈旧、经济性缺失，挡住了高确信买入。
    data:
      nodes:
        - id: A
          label: 规模与增长
          detail: ARR 已超过 $200M，客户数超过 5,000，年化支付量达到 $75B。
          tone: positive
        - id: B
          label: 自动化宽度
          detail: Tipalti 现在在 200+ 个国家销售 AP、支付、采购、费用和资金管理。
          tone: positive
        - id: C
          label: 陈旧价格锚
          detail: 最近一次公开股权标记仍是 2021 年 $8.3B 的 F 轮。
          tone: warning
        - id: D
          label: 缺少承销证据
          detail: 利润率、留存、当前公允价值和优先权条款仍未公开。
          tone: warning
        - id: E
          label: 决策
          detail: 新的经济性和价格支撑出现前，结论仍是继续研究 / 高风险 / 昂贵。
          tone: neutral
      edges:
        - from: A
          to: E
          label: 支持尽调
        - from: B
          to: E
          label: 支持部分溢价
        - from: C
          to: E
          label: 阻碍按全额估值持有
        - from: D
          to: E
          label: 阻碍确信
    approximationNotes: 流程概括的是估值逻辑，而不是数字模型。
    claimRefs:
      - CV007
      - CV009
      - CV010
      - CV011
      - CV013
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 即使按公开 ARR 下限给出溢价倍数，Tipalti 仍明显低于旧有 $8.3B 标记。
    data:
      items:
        - label: $200M 上 8x
          value: 1.6
          detail: 接近降级后支付资产或谨慎私有软件情景。
          tone: negative
        - label: $200M 上 10x
          value: 2
          detail: 相对支付行业中位数给出小幅溢价的起点。
          tone: warning
        - label: $200M 上 12x
          value: 2.4
          detail: 需要更清楚的软件式质量，但还不算激进倍数。
          tone: warning
        - label: $200M 上 15x
          value: 3
          detail: 经济性良好的强自动化资产可获得的健康溢价。
          tone: neutral
        - label: $200M 上 20x
          value: 4
          detail: 仍只约为 2021 年名义标记的一半。
          tone: positive
    approximationNotes: 数值是在公开 >$200M ARR 下限上做的简单倍数桥，单位为十亿美元。
    claimRefs:
      - CV007
      - CV021
      - CV022
      - CV024
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 最可支撑的 2026 年区间很宽，但除非隐含经济性远强于公开证据显示，否则仍会显著低于 2021 年峰值。
    data:
      items:
        - label: 熊市
          low: 1.6
          mid: 2.1
          high: 2.5
          displayValue: $1.6B-$2.5B
          detail: 增长放缓、溢价收缩，债务或优先权条款权重上升。
          tone: negative
        - label: 基准
          low: 2.5
          mid: 3.2
          high: 4
          displayValue: $2.5B-$4.0B
          detail: Tipalti 相对支付可比公司保留溢价，但达不到 2021 年峰值估值。
          tone: warning
        - label: 牛市
          low: 4
          mid: 5.1
          high: 6.5
          displayValue: $4.0B-$6.5B
          detail: 需要更强的 ARR 复合增长、软件式利润率，以及持续的 AI 溢价。
          tone: positive
        - label: 2021 年旧标记
          low: 8.3
          mid: 8.3
          high: 8.3
          displayValue: $8.3B
          detail: 这是历史融资锚点，不是当前公允价值成交价。
          tone: neutral
    approximationNotes: 所有区间都是以十亿美元计的情景估值带，不是 2026 年已观察到的交易。
    claimRefs:
      - CV001
      - CV045
      - CV046
      - CV047
      - CV050
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Tipalti 在规模和品类相关性上得分不错，但证据质量和估值支撑落后于叙事。
    data:
      items:
        - label: 规模
          score: 8
          detail: 5,000+ 客户和 $75B 年化支付量，是有意义的后期指标。
          tone: positive
        - label: 产品宽度
          score: 7
          detail: AP、支付、采购、费用和资金管理支撑了更广的自动化叙事。
          tone: positive
        - label: 品类顺风
          score: 7
          detail: 到 2026 年，财务自动化和选择性金融科技重启仍提供支撑。
          tone: positive
        - label: 证据质量
          score: 4
          detail: 利润率、留存和当前公允价值仍未公开。
          tone: warning
        - label: 估值支撑
          score: 3
          detail: 可比区间不支持今天继续按完整 2021 年峰值标记持有。
          tone: negative
        - label: IPO 准备度
          score: 5
          detail: Tipalti 正在公开讨论准备度，但留存记录还不是上市公司级证据。
          tone: warning
    approximationNotes: 分数是投资委员会基于已留存公开证据做出的 1-10 分启发式判断。
    claimRefs:
      - CV009
      - CV011
      - CV034
      - CV040
      - CV044
      - CV056
