      - number: '7.2'
        title: 合规、法律与平台风险
        blocks:
          - type: paragraph
            body: >-
              公开材料显示，Tipalti 已在合规文档和控制措施叙事上投入不少。公司发布了法律中心、隐私政策和欧盟 DPA，并对外宣传 SOC 控制覆盖、加密、MFA、审计日志、OFAC / Do Not Pay
              筛查、欺诈检测、税务校验和恢复流程（CR004、CR005、CR006、CR002、CR012、CR013、CR014）。这些缓释措施重要，但仍不足以完全封住下行风险：公开档案里还缺少逐司法辖区的完整牌照清单、带应急细节的合作银行名单，以及超出外部
              uptime 监控之外的事故历史披露（CR037、CR038、CR039、CR046）。实际承销时，投资人应继续计入资金传输检查、制裁筛查失误、付款冻结或数据 /
              隐私故障的剩余敞口，直到管理层提供一手尽调材料。评论网站证据也强化了这组风险的运营面：客户可以认可自动化价值，同时仍反馈上线复杂、定价摩擦和手工绕路；合规负担重的产品跨多个地区和系统铺开时，这类隐藏交付阻力最容易暴露（CR020、CR021、CR040）。
