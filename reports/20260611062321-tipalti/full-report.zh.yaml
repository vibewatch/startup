      - number: '2.4'
        title: 增长驱动、约束与未解规模缺口
        blocks:
          - type: paragraph
            body: >-
              市场最强的结构性驱动来自监管数字化、云迁移、AI 赋能工作流自动化和实时支付基础设施。ViDA 提供了具体政策顺风：它允许更早推出全国电子发票强制要求，并为 2030 年起的跨境 B2B
              交易设定数字报告里程碑。AP 和费用市场报告反复提到电子发票、合规、欺诈检测和嵌入式支付，作为买家从重纸面流程转向集成工作流平台的原因。实时 rails 同样重要：Federal Reserve 把 FedNow
              描述为按秒结算、始终在线的基础设施，ECB 则把即时支付定义为十秒体验，支持欧洲协调和创新。主要约束同样重要。市场报告反复提示，与传统 ERP 的切换和集成成本、安全和数据驻留担忧、跨境支付中的 AML/KYC
              摩擦，以及大型企业今天仍主导支出的事实。这意味着对 Tipalti 的承销视角非常具体：市场不是缺用例，而是受变革管理、系统集成、合规复杂度以及能否足够快证明 ROI
              的约束，财务负责人只有在这些过关后才会替换既有习惯。因此，核心尽调缺口不是市场是否足够大，而是中端市场中有多少部分会真正标准化到集成的 invoice-to-pay 堆栈，而不是继续用 ERP
              模块、银行门户或点解决方案。
