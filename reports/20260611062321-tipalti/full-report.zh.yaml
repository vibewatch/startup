      - number: '7.4'
        title: 缓释措施、监控和终止标准
        blocks:
          - type: paragraph
            body: >-
              公开记录里的缓释措施是真实存在的：Tipalti 发布法律和隐私文件，宣传安全与筛查控制，并持续推出
              AI、卡、资金管理和工作流更新（CR002、CR004、CR005、CR012、CR018、CR032、CR038）。但正确的承销姿态应是有条件，而不是无条件。投资人在进行激进承销前，应要求管理层证明三件事：第一，牌照覆盖、合作银行监督和
              AML 治理足够完整，经得住不利监管审查；第二，平台扩张时，支持、实施和 uptime 质量保持稳定；第三，在竞争加剧和人员重置之后，债务融资推动的 AI
              扩张正在转化为持久的企业级增长（CR037、CR039、CR040、CR041、CR042、CR043、CR044）。因此，终止标准必须客观。牌照续期失败或延迟、重大制裁或筛查问题、持续的付款可用性事故、实施 /
              支持表现可衡量地下滑，或有证据显示债务服务正在挤压产品或 GTM
              投入，都应迫使投资人重置信心。在未披露的集中度、契约和牌照细节交出前，本章应按需监控的风险案例处理，而不是已清除的风险案例（CR045、CR046）。
