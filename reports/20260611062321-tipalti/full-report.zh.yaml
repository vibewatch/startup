      - number: '8.3'
        title: 情景区间、建议和估值立场
        blocks:
          - type: paragraph
            body: >-
              对 Tipalti 的正确判断取决于价格，也取决于证据。公司已有足够真实规模，不能轻易否定：ARR 高于 $200 million 门槛，全球支付量可观，并且在投资 AI 和资金管理工作流的同时仍声称客户增长
              30%。这支持其相对原始支付公司中位数享有溢价。但记录并不支持不加挑战地沿用完整的 $8.3 billion 标记。如果投资人从公开 ARR 底线出发，套用健康但不狂热的 10x-16x
              倍数区间，基准估值框架大约落在 $2.5-$4.0 billion。更强的牛市情形需要显著更高的 ARR、软件化利润率，并证明 AI
              加深了经济性，而不只是叙事。熊市情形会低得多：增长放缓、溢价压向支付公司中位数，或债务和优先权条款吃掉上行空间。基于这组条件，本章建议为继续研究，置信度中等，风险高，估值立场为昂贵。公司本身可能仍然不错；但旧价格的公开支撑并不充分。
