  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险格局排序
        blocks:
          - type: paragraph
            body: >-
              Tipalti 排名最高的风险不是通用软件执行，而是受监管资金流转。公司称自己是持牌资金转移机构、在美国财政部注册的货币服务企业，并连接一线银行伙伴和全球银行网络；这意味着许可、AML
              设计、制裁筛查或伙伴银行监督一旦失败，就会立刻级联为付款中断和客户伤害（CR001、CR016、CR037、CR038）。纽约州许可标准、MTMA 推进、OCC 的 2026 年 AML 提案以及 OFAC
              活跃的执法节奏，都显示周边规则只会更紧，不会更松（CR007、CR008、CR009、CR010）。这让法律和监管准备度成为本章最大致命区。第二层风险是平台运营：Tipalti
              宣传强安全、备份、反欺诈和筛查控制，但支付可用性是投资逻辑关键客户承诺，服务连续性仍然重要（CR002、CR003、CR011、CR019、CR039）。第三层是市场和融资压力。BILL、Coupa、SAP
              Concur、Ramp 和 Brex 等竞争对手都在推 AI 主导的 AP 和支出自动化；Tipalti
              则一边用债务资助扩张，一边重组员工数（CR023、CR025、CR028、CR032、CR041、CR045）。
