      - CV054
      - CV056
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 和收入桥接
        - 按产品和客群拆分、经审计的 ARR、收入和毛利率桥接
        - 区分软件溢价逻辑和支付交易量逻辑。
        - CFO 材料包，加审计师审阅过的桥接。
      - - 留存质量
        - 按客户带拆分的 NRR、GRR、Logo 留存和队列扩张
        - 决定 Tipalti 是否应享有复利软件估值，而不是支付倍数。
        - 收入运营仪表盘和董事会指标。
      - - 当前公允价值
        - 2026 年 409A、要约或老股交易价格、董事会估值备忘录
        - 将陈旧的 2021 年估值转化为真实当前价格信号。
        - 财务团队、董事会材料和转让代理数据。
      - - 债务经济性
        - Hercules 契约、摊还计划和流动性限制
        - 说明债务是便宜的桥接资本，还是隐藏的下行放大器。
        - 资金管理团队、信贷协议和贷款方合规报告。
      - - 股权结构表和优先权
        - 最新股权结构表、清算优先权、认股权证和附函
        - 检验普通股回报是否与头部估值明显背离。
        - 法律顾问和股权结构表管理员。
      - - IPO 准备材料包
        - SOX 准备度、审计节奏、董事会委员会、指引流程和 IR 搭建
        - 选择性开放的 2026 年 IPO 市场奖励准备度，而不只是私营公司规模。
        - CFO、GC、外部顾问和 IPO 项目计划。
    notes: 这些是最低限度文件，能把 Tipalti 从有吸引力的后期故事，变成可承销的估值决策。
    claimRefs:
