      - number: '1.3'
        title: 融资历史、规模标尺与时间线
        blocks:
          - type: paragraph
            body: >-
              Tipalti 的公开资本故事有三个主要阶段。第一，2021 年 12 月 Series F 融资 $270 million，估值 $8.3 billion，累计融资超过 $550 million。第二，公司在
              2023 年增加信用融资，官方材料把产品扩张和欧洲增长与 JPMorgan Chase Bank、Hercules Capital 领投的 $150 million 融资挂钩。第三，2025 年 9 月
              Hercules 交易又带来 $200 million 非稀释增长融资，明确用于 AI 投资、产品创新和全球扩张。这一顺序很重要，因为它说明 Tipalti 在 2021
              年估值高峰期之后很久，仍保持私营融资并持续战略投入。规模标尺也指向持续相关性。官方 2023 年材料披露客户超过 3,500 家、年支付量超过 $50 billion；2025 年 9
              月融资公告把数据更新为客户超过 5,000 家、ARR 超过 $200 million、年化支付量约 $75 billion。Calcalist、Globes 和 Ynet
              的独立报道大体吻合融资叙事，并确认公司同时在通过 Statement 收购投资 AI 和资金管理。关键但书是，Tipalti 对董事会结构、盈利能力、2025
              年确切员工数和债务条款的公开披露仍有限，所以部分规模主张仍由管理层驱动，还不到监管文件级别。
