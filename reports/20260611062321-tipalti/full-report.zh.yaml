        title: 架构、集成与部署模式
        blocks:
          - type: paragraph
            body: >-
              对一家财务自动化供应商而言，Tipalti 的公开技术表面异常偏实施导向，即便还远未达到深入架构的工程文档。产品页、集成页和开发者材料合在一起，显示出模块化云运营模式：工作流应用位于 ERP
              和身份集成之上，付款执行则通过有文档的 API 和平台连接器暴露。付款 API 显然是现代 REST/JSON，payment-batch 参考文档确认使用 Bearer JWT 认证，而不是纯传统集成模式。采购
              API 也存在，但 Tipalti 明确提醒它们可能变化；这对尽调而言是有用的成熟度信号，因为它意味着部分表面仍在演进。部署控制方面，Okta 指南显示有独立沙盒和生产端点，开发者材料提到示例代码和沙盒测试。与
              Workday 和 Workato 的集成表明，平台设计是为了同步供应商、账单、PO、PR 和付款等运营对象，而不只是导出汇总文件。结论是，Tipalti 看起来以集成和可配置性为中心，但 API
              运行限制、弃用纪律和特定伙伴实施工作量仍主要属于私有证据。
