            - 2
            - 1
    approximationNotes: 单元格数值统计的是本章基于公开证据综合后，按剩余可能性和影响分配的排序风险。
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR041
      - CR043
      - CR044
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管和运营失误会快速传导到付款连续性、支持负载、利润率和估值。
    data:
      nodes:
        - id: licensing
          label: 牌照 / AML / 制裁
        - id: payouts
          label: 付款连续性
        - id: support
          label: 支持 / 实施负载
        - id: customers
          label: 客户信任 / 留存
        - id: margin
          label: 利润率 / 单位经济
        - id: growth
          label: 增长 / 管线转化
        - id: financing
          label: 债务余量
        - id: valuation
          label: 估值 / IPO 时点
      edges:
        - from: licensing
          to: payouts
          label: 暂停 / 中断
        - from: licensing
          to: support
          label: 人工审核负担
