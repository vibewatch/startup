      - number: '2.2'
        title: 规模测算口径、矛盾估计及其真实含义
        blocks:
          - type: paragraph
            body: >-
              公开市场数据方向强劲，但数字不一致；这正是本章保留多个口径而不是单一 TAM 标题的原因。仅看 AP 自动化，The Business Research Company 的 2026 年报告把市场估为 2026
              年 $6.57 billion，高于 2025 年 $5.42 billion；Mordor Intelligence 估算 2026 年为 $6.94 billion；Future Market
              Insights 则给出窄得多的 2026 年 $3.8 billion。Grand View 更偏历史的框架给出 2023 年 $3.07 billion、2030 年 $7.1
              billion。这些并不一定说明底层趋势互相矛盾；它们反映的是服务、支付处理、企业工作流和预测窗口的纳入口径不同。正确解读不是某一个来源正确、其他都无用，而是任何诚实的市场地图都必须声明自己在统计什么。周边支付池大得多。Mordor
              把 2026 年 B2B 支付总市场估为 $1.67 trillion；Fortune Business Insights 估计 2026 年跨境支付市场为 $397.37 billion，并显示 B2B
              跨境是最大的交易类型。采购软件和费用管理本身也是大型相邻类别，Mordor 页面显示 2026 年规模分别约 $10.74 billion 和 $8.48 billion。这意味着 Tipalti
              可信的机会集不是所有全球支付，而是那些愿意用统一软件替换碎片化 AP、供应商和支付流程，并且工作流高量、合规敏感的财务团队子集。
