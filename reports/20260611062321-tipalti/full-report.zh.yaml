            body: >-
              Tipalti 最强的公开财务证据是规模，而不是经审计盈利能力。2025 年 9 月融资公告及佐证报道显示，公司 ARR 超过 $200 million、客户超过 5,000 家、年化支付量约 $75
              billion；而 2023 年 5 月融资时已经显示中端市场客户超过 3,000 家、年化支付量约 $43 billion。这些披露端点足以搭建有用但粗略的 GTM 代理指标。用 2025
              年下限相除，意味着平均每客户 ARR 至少约 $40,000，这更符合财务控制负责人和 CFO 主导的中端市场动作，而不是小企业自助产品。公司客户故事和独立评论网站也强调节省时间、自动化、合规和 ERP
              集成是核心 ROI 钩子。与这条正面规模叙事相对的是更谨慎的运营信号：管理层告诉 Calcalist，公司正在聚焦中端市场客户，并减少对小客户的敞口；而 2025 年和 2026
              年连续裁员意味着销售覆盖、支持强度和经营杠杆仍在调校。
