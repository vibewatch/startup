  sector: fintech
  stage: Series F
  headquarters: San Mateo, California, USA
  shortDescription: >-
    Tipalti is a private finance-automation platform for mid-market and global businesses that combines
    accounts payable, supplier onboarding, cross-border payouts, procurement, expenses, cards, tax
    compliance, and treasury workflows. Public evidence shows real scale—more than $200 million ARR,
    5,000+ customers, and roughly $75 billion in annualized payment volume—but current underwriting is
    constrained by stale equity price discovery, debt-funded expansion, and limited disclosure on
    margins, covenants, and retention.
subtitle: >-
  Scaled finance automation leader with real workflow depth and payment reach, but still a
  price-sensitive diligence case because the latest equity mark is stale and key economics remain private.
coverageNotes: >-
  Tipalti is a private company with no public audited financial statements. The strongest current scale
  anchors are management-backed and lender-backed disclosures around >$200 million ARR, 5,000+
  customers, and ~$75 billion annualized payment volume as of September 2025. The latest publicly
  confirmed priced equity round remains the December 2021 Series F at an $8.3 billion valuation;
  subsequent 2023 and 2025 financings were debt / growth-financing transactions rather than fresh equity
  price discovery. Gross margin, NRR, CAC payback, concentration, current headcount, profitability, and
  debt covenants remain undisclosed, so nulls below reflect evidence gaps rather than zero values.
