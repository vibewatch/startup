companyProfile:
  summary: >-
    Tipalti is a private finance-automation and B2B payments platform founded in 2010 by Chen Amit and
    Oren Zeev. The company has expanded from AP automation and global payouts into a broader office-of-the-
    CFO stack spanning procurement, expenses, cards, supplier management, tax compliance, and treasury,
    including the Statement acquisition in 2025. Public evidence supports meaningful scale—5,000+
    businesses served, >$200 million ARR, and ~$75 billion of annualized payment volume—while also
    showing a business still balancing growth, margin discipline, and product expansion after 2025 layoffs
    and additional non-dilutive financing.
  foundedDate: '2010-01-01'
  founders:
    - name: Chen Amit
      role: Co-founder and CEO
      background: >-
        Co-founded Tipalti in 2010 and remains CEO, providing founder continuity through the company’s
        expansion from AP automation into a broader finance-operations platform.
      claimRefs: [CO013, CO014]
    - name: Oren Zeev
      role: Co-founder and Chairman
      background: >-
        Co-founded Tipalti and remains chairman, giving the company long-duration founder and board
        continuity even though broader public governance disclosure remains limited.
      claimRefs: [CO013, CO014]
  foundingLocation: San Mateo, California, USA
  headquarters: San Mateo, California, USA
  productSummary: >-
    Tipalti sells a connected finance-automation suite covering accounts payable, supplier onboarding,
    invoice capture, approval routing, payment execution, procurement, expenses, cards, tax compliance,
    global payouts, and newer treasury workflows, with APIs, ERP integrations, and embedded fraud,
    screening, and compliance controls.
  customerFocus: >-
    Mid-market and digitally scaled businesses with multi-entity, cross-border, supplier, contractor,
    publisher, or procurement complexity; the strongest public proof sits with finance-led teams that need
    integrated AP and payment operations rather than a narrow point solution.
  businessModel: >-
    Hybrid software-plus-payments model combining recurring platform subscriptions with transaction-based
    payment fees and module upsells across procurement, expenses, cards, supplier management, tax, and
    treasury workflows.
  stage: Series F
  fundingStatus: >-
    Tipalti’s last disclosed priced equity round was the $270 million Series F in December 2021 at an
    $8.3 billion valuation. Since then it added $150 million of growth financing in 2023 and a further
    $200 million Hercules facility in September 2025, indicating continued capital access but no fresh
    public equity price discovery.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO013, CO014, CO023, CO024, CO026, CO029, CI010, CE001]
summary:
  headline: >-
    Tipalti is a real scaled fintech platform with broad product depth and strong customer adoption, but
    the combination of regulated payments exposure, debt-funded expansion, layoffs, and a stale 2021
    valuation anchor makes this a research-more name until management proves current economics and fair
    value.
  overallScore: 6.2
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: expensive
  keyMetrics:
    valuationUsdM: 8300
    revenueRunRateUsdM: null
    arrUsdM: 200
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 900
    customerCount: 5000
    headcount: null
  topStrengths:
    - >-
      Real scaled platform traction: public sources support >$200 million ARR, 5,000+ customers, and
      roughly $75 billion in annualized payment volume, which is enough to show Tipalti is operating at
      serious fintech scale rather than selling a narrow niche tool.
    - >-
      Broad office-of-the-CFO product scope across AP, global payouts, procurement, expenses, cards,
      supplier management, tax, and treasury creates multiple expansion paths and a more durable platform
      story than pure invoice automation alone.
    - >-
      Differentiation is strongest where workflows are global, multi-entity, and compliance-sensitive;
      that complexity is harder for lighter AP point solutions to match and raises switching costs once
      Tipalti is embedded.
    - >-
      Public technical evidence shows meaningful control surfaces including fraud screening, OFAC / Do Not
      Pay checks, MFA, audit logs, tax validation, ERP integrations, and API-driven payment operations.
    - >-
      Customer proof is broad and multi-vertical, with numerous quantified case studies showing time,
      staffing, close, and payment-workflow improvements across finance, adtech, insurance, nonprofits,
      and creator or contractor payouts.
  topRisks:
    - >-
      Regulated money movement is the core downside: licensing, AML, sanctions screening, partner-bank
      coordination, and payout continuity are all thesis-critical, and the public record does not fully
      document license inventory, contingency detail, or incident history.
    - >-
      The latest public equity mark is stale. The only fresh 2025 capital signal was debt, not a new
      equity round, so the historical $8.3 billion Series F valuation remains difficult to defend against
      2026 public comp bands without audited economics.
    - >-
      Key underwriting metrics remain private, including gross margin, NRR, CAC payback, concentration,
      profitability, and debt covenants, which makes revenue quality and downside protection hard to bound.
    - >-
      2025 layoffs and a go-to-market refocus toward higher-value mid-market accounts suggest management is
      still tuning cost structure and customer mix rather than operating from an obviously settled growth
      model.
    - >-
      Competitive pressure is rising as BILL, Coupa, SAP Concur, Ramp, Brex, Stampli, and others converge
      on AI-led AP, spend, procurement, and payments workflows, reducing the durability of generic feature-
      led differentiation.
  unresolvedGaps:
    - >-
      Obtain audited 2024-2026 ARR, revenue, and gross-margin bridges by software, payments, services, and
      treasury to test whether current scale is software-quality or primarily volume-driven.
    - >-
      Review the full debt package, including 2023 and 2025 facility size, pricing, covenants, maturity,
      security, and any restrictions that could impair product or go-to-market investment.
    - >-
      Confirm current fair value through 409A, secondary transactions, or a fresh financing process before
      underwriting anything close to the 2021 $8.3 billion headline mark.
    - >-
      Request NRR, GRR, churn, implementation burden, and support metrics by segment to determine whether
      the broader suite is deepening customer durability or increasing delivery friction.
    - >-
      Obtain a complete money-transmission and compliance diligence pack covering jurisdictional licenses,
      partner-bank oversight, exam history, sanctions controls, and payout-incident response.
    - >-
      Verify current headcount, post-layoff organizational shape, and leadership accountability for AI,
      treasury, compliance, and enterprise implementation as the product surface broadens.
