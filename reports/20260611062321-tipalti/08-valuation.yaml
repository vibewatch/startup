  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Basis
  rows:
  - - Recommendation
    - research-more
    - Real scale and current growth are visible, but the last public valuation is stale and unsupported by a fresh equity print.
  - - Confidence
    - medium
    - Public financing and operating milestones are documented, but the key underwriting variables remain private.
  - - Risk rating
    - high
    - Missing margin, retention, cap-table, and covenant data make common-equity outcomes hard to bound.
  - - Valuation stance
    - expensive
    - The retained public comp set mostly trades at single-digit revenue multiples while Tipalti’s legacy mark implies a far richer outcome.
  - - Decision implication
    - Do diligence before any bid
    - Require audited ARR and margin bridges, current fair-value evidence, and downside-protection terms before underwriting price.
  - - What would upgrade the call
    - Fresh proof of economics and price
    - A verified 2026 fair-value signal plus software-like retention and margin evidence could move the stance toward fair.
  notes: 'This recommendation is explicitly price-sensitive: it evaluates whether public evidence supports the old headline mark, not whether Tipalti is a quality company in the abstract.'
