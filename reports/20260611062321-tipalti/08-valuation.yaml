- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR bridge disappoints
    - Audited ARR and revenue quality land only marginally above the public >$200M floor
    - The old $8.3B anchor becomes indefensible and even the base case moves lower.
    - Reprice closer to the bear range or walk away.
  - - Retention or cohort quality weakens
    - NRR or cohort renewals fail to support a software-style premium
    - Tipalti stops looking like a compounding automation platform and starts looking more like a volume business.
    - Compress the multiple toward payments medians.
  - - Preference stack is heavier than expected
    - Liquidation terms or side letters absorb much of any sub-$4B exit
    - Headline valuation overstates common-equity outcomes.
    - Demand structure, lower entry price, or both.
  - - Debt terms constrain flexibility
    - Covenants, amortization, or liquidity restrictions narrow strategic options
    - The 2025 facility stops being bridge capital and becomes downside leverage.
    - Lower valuation, tighten diligence, or avoid.
  - - AI does not improve economics
    - AI remains a story layer without implementation, margin, or retention lift
    - The premium case for software-like valuation collapses.
    - Move to the low end of the range.
  - - IPO readiness is weaker than advertised
    - No audited public-company package, weak governance readiness, or poor guidance discipline
    - Liquidity path gets pushed out and late-stage private premium should compress.
    - Treat the company as a longer-duration private hold with a lower current value.
  notes: 'These are valuation-moving triggers: each one changes price support, not merely the narrative tone around the company.'
