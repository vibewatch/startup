  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ARR and margin bridge
    missingEvidence: Audited ARR, revenue, gross margin, and net retention by cohort and product line.
    whyItMatters: The valuation call depends on whether Tipalti deserves a software premium or should revert toward payments medians.
    diligencePath: Obtain the CFO pack, auditor-reviewed bridge, and board operating metrics used in 2025-2026 financing discussions.
    relatedQuestionRefs:
    - QV014
    - QV020
  - type: missing-source
    severity: material
    topic: Preference stack and dilution overhang
    missingEvidence: Current cap table, liquidation preferences, warrants, participation rights, and any side-letter protections.
    whyItMatters: Headline valuation can overstate common-equity value if the stack absorbs most downside or mid-case exit proceeds.
    diligencePath: Request the latest cap-table export, board-approved financing summary, and counsel memo on preference terms.
    relatedQuestionRefs:
    - QV027
    - QV029
  - type: stale
    severity: material
    topic: Current equity price discovery
    missingEvidence: 2026 409A, tender or secondary prints, and any board-approved fair-value materials.
    whyItMatters: Without a fresh price signal, the 2021 $8.3 billion mark remains a stale historical datapoint rather than a market-clearing value.
    diligencePath: Request the latest 409A package, employee tender data, and secondary broker indications from the finance team.
    relatedQuestionRefs:
    - QV007
    - QV027
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable valuation table coverage
    missingEvidence: A broader live comp book with fresh public EV/revenue data and up-to-date private marks for adjacent finance-automation names.
    whyItMatters: The current comparable set is directionally useful but still leaves wide dispersion around the premium Tipalti might deserve.
    diligencePath: Pull a live FactSet or PitchBook comp sheet and add current secondary/private market datapoints before a term-sheet decision.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: IPO readiness and governance package
    missingEvidence: SOX readiness, board committee composition, audit cadence, guidance discipline, and investor-relations buildout.
    whyItMatters: Selective 2026 IPO markets reward companies that can operate as public issuers from day one, not just those with large private valuations.
    diligencePath: Ask management for the IPO readiness checklist, external advisor workplan, and mock-public-company reporting calendar.
    relatedQuestionRefs:
    - QV020
    - QV028
