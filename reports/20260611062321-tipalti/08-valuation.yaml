- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric anchor
  - Multiple / valuation status
  - Relevance
  - Limitation
  rows:
  - - BILL.com
    - Q3 FY2026 revenue $406.6M; FY2026 guide $1.642B-$1.652B
    - ~1.8x EV/LTM revenue; ~8.7x EV/LTM EBITDA
    - Most obvious public AP and finance-ops benchmark; shows how cheaply a scaled AP platform can trade in 2026.
    - More SMB-heavy than Tipalti and already public, so it may understate premium for mid-market global workflows.
  - - Corpay
    - Q1 2026 revenue $1.261B; 2026 guide $5.25B-$5.33B
    - ~6.3x EV/LTM revenue; ~11.9x EV/LTM EBITDA
    - Useful upper-end public comp for scaled corporate payments and AP modernization.
    - Broader, more mature, and more diversified than Tipalti, so it is not a pure apples-to-apples software comp.
  - - Payoneer
    - 2025 revenue $1.053B; Q1 2026 revenue $261.6M
    - Profitable public cross-border platform; current retained sources give operating scale more clearly than live multiple
    - Helpful for cross-border and B2B payout context.
    - Not a direct AP automation platform and current retained source set does not pin a clean live EV/revenue multiple.
  - - Flywire
    - Q1 2026 revenue $188.1M; 2025 payment volume $37.6B
    - Smaller but software-led payments comp with strong 2026 growth and profitability improvement
    - Good reference for a software-plus-payments model that can outrun raw payments growth.
    - Vertical mix skews to education, healthcare, and travel rather than finance automation.
  - - Payments public median
    - Q1 2026 payments-and-transfers cohort
    - 3.6x median EV/Revenue; 7.7x average
    - Best base-rate public benchmark for how 2026 markets price payment-heavy businesses.
    - Median and average are broad sector statistics, not direct company comps.
  - - Private fintech average
    - Q1 2026 private versus public fintech dataset
    - 16.4x private EV/Revenue versus 5.9x public average
    - Shows why late-stage private marks can stay above public comps for a time.
    - Dataset averages are skewed by outliers and do not prove Tipalti itself deserves the private premium.
  notes: Comp set is intentionally partial and mixes direct companies with model-appropriate market references because Tipalti has no perfect public twin.
  enumerationScope:
