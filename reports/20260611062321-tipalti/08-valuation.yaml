- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale
    - Tipalti has moved from 2,000+ customers and $30B volume in 2021 to 5,000+ customers and $75B annualized volume in 2025.
    - Scale growth does not itself validate the old equity price if margins and retention remain private.
    - Show audited ARR, NRR, and gross margin proving the new scale is software-quality rather than volume-only growth.
  - - Capital strategy
    - The 2025 Hercules debt raise suggests lenders saw enough resilience to extend non-dilutive capital.
    - Debt can also indicate management preferred to avoid a public equity reset at a lower valuation.
    - Provide secondary or 409A evidence showing equity still clears near management expectations.
  - - Product breadth
    - Tipalti now sells finance automation across AP, payments, procurement, expenses, and treasury.
    - Broader workflow claims are still marketing until investors see attach rates, expansion, and margin mix.
    - Disclose product-level ARR mix and cross-sell data.
  - - AI narrative
    - AI and treasury messaging can justify some premium over commodity payments processors.
    - AI can be narrative inflation if it does not improve unit economics or deepen moat.
    - Prove AI drives faster implementation, lower support cost, or stronger retention.
  - - Go-to-market focus
    - Reducing SMB exposure may sharpen fit around more attractive mid-market customers.
    - Layoffs and customer pruning can also signal friction in the prior growth model.
    - Show improved CAC payback, win rates, and better retention in the target segment.
  - - Exit optionality
    - Selective 2026 IPO markets may reopen a liquidity path for scaled fintechs.
    - Selective markets punish private companies that lack public-company proof, especially on profitability and governance.
    - Demonstrate public-company readiness with audited quarterly reporting, governance, and guidance discipline.
  notes: The anti-thesis focuses on what would break price support, not on whether Tipalti has built a real business.
