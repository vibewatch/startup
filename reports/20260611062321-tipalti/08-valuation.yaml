- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - ARR and revenue bridge
    - Audited ARR, revenue, and gross-margin bridge by product and segment
    - Separates a software premium case from a payment-volume case.
    - CFO pack plus auditor-reviewed bridge.
  - - Retention quality
    - NRR, GRR, logo retention, and cohort expansion by customer band
    - Determines whether Tipalti deserves compounding-software valuation rather than payments multiples.
    - Revenue-operations dashboard and board metrics.
  - - Current fair value
    - 2026 409A, tender or secondary marks, and board valuation memos
    - Converts the stale 2021 mark into an actual current price signal.
    - Finance team, board materials, and transfer-agent data.
  - - Debt economics
    - Hercules covenants, amortization schedule, and liquidity restrictions
    - Clarifies whether the debt is cheap bridge capital or a hidden downside amplifier.
    - Treasury team, credit agreement, and lender compliance reports.
  - - Cap table and preferences
    - Latest capitalization table, liquidation preferences, warrants, and side letters
    - Tests whether common-equity returns diverge sharply from headline valuation.
    - Legal counsel and cap-table administrator.
  - - IPO readiness package
    - SOX readiness, audit cadence, board committees, guidance process, and IR buildout
    - Selective 2026 IPO markets reward readiness, not just private-company scale.
    - CFO, GC, external advisors, and IPO project plan.
  notes: These are the minimum files needed to turn Tipalti from a compelling late-stage story into an underwritable valuation decision.
