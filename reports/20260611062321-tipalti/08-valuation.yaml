- id: public-comp-band-and-market-reset
  title: Public comp band and the 2026 fintech reset
  body: 'The comp problem for Tipalti is not that there are no public references; it is that the public references are much cheaper than the legacy private mark. Finro’s Q1 2026 dataset says public fintechs average 5.9x EV/revenue while payments and transfers average 7.7x but median only 3.6x. Windsor Drake’s current M&A work says established payments businesses usually clear around 4-6x revenue and 8-12x EBITDA. Multiples.vc shows the same dispersion in live public names: BILL sits around 1.8x EV/LTM revenue and Corpay around 6.3x. Operationally, those comps are not identical — BILL is more SMB oriented, Corpay is broader and more mature, while Flywire and Payoneer are more cross-border oriented — but they still anchor what public investors currently pay for scaled finance software and payments assets. Tipalti may deserve some premium because it sells automation and treasury software rather than pure payment rails, yet the premium has to be earned through retention, margin, and disclosure
    quality. With only a public ARR floor above $200 million, not a disclosed audited denominator, the base-rate evidence points to a valuation band materially below the 2021 headline mark.'
