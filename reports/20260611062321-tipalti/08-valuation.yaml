chapter:
  number: 8
  title: Valuation
  summary: Tipalti still carries a public $8.3B 2021 peak-round anchor, but the only fresh capital signal in 2025 was $200M of Hercules debt after ARR merely crossed $200M, which makes the old mark hard to defend against 2026 fintech comp bands. The company is clearly scaled and still growing, yet the public record supports a research-more / high-risk / expensive stance until audited economics, current price discovery, and cap-table terms are disclosed.
sections:
- id: valuation-anchor-and-reset
  title: Legacy valuation anchor versus current price support
  body: 'Tipalti’s last publicly confirmed priced equity round is still the December 2021 Series F at $8.3 billion. That round made sense inside a peak-multiple backdrop and already reflected strong scale signals for the time: management said Tipalti was processing more than $30 billion of annual payments volume and had passed 2,000 customers. The more relevant question for 2026 is not whether Tipalti was a breakout fintech in 2021, but whether the same price is still supportable after the market reset. The only fresh public capital signal in 2025 was a $200 million Hercules debt facility, not a new equity round. Management paired that financing with current scale claims — ARR above $200 million, customer growth of 30%, more than 5,000 businesses served, and $75 billion of annualized payment volume — but those are still growth and usage datapoints, not a new market-clearing equity valuation. Debt can buy time and flexibility, yet it does not re-price the common. When the last priced mark
    is four years old and the newest financing avoids equity entirely, the default posture should be to treat the 2021 valuation as historical context, not today’s fair value.'
