  rows:
  - - AP automation
    - Invoice capture, approval routing, matching, supplier validation, payment scheduling, reconciliation
    - Payroll, consumer bill pay, generic bookkeeping without workflow control
    - CFO, controller, AP leader
    - Core entry market and most direct category
  - - B2B payments
    - Domestic and cross-border business-to-business payment execution across bank, ACH, wire, card, and fintech rails
    - Consumer P2P payments, retail checkout, remittance-only flows
    - Treasury, finance ops, AP leader
    - Provides the much larger throughput pool surrounding AP workflows
  - - Procurement software
    - Purchase requests, policy controls, supplier management, purchase orders, procure-to-pay orchestration
    - Inventory planning or sourcing tools with no finance approval layer
    - Procurement head, finance, sometimes CIO
    - Important adjacency because Tipalti now bundles procurement
  - - Expense management
    - Employee spend capture, reimbursement, card and travel-expense policy workflows
    - Supplier invoice processing when no employee spending is involved
    - Finance ops, controller, spend owner
    - Adjacency that raises suite value but is not the original wedge
  - - Status-quo substitute stack
    - Email approvals, spreadsheets, ERP modules, bank portals, paper checks, shared inboxes
    - Fully integrated invoice-to-pay platforms
    - Finance teams already using legacy tools
    - Explains why switching cost and ROI proof matter
