callouts:
- calloutType: insight
  title: The relevant market is broad, but Tipalti’s credible entry wedge is narrower
  body: The presence of trillion-dollar B2B payment flow does not automatically mean Tipalti can monetize all of it. The believable wedge is the subset of finance teams that need integrated invoice, supplier, approval, and payment controls badly enough to replace fragmented legacy processes.
  claimRefs:
  - CM018
  - CM023
  - CM040
- calloutType: risk
  title: Boundary mistakes can make valuation work look stronger than adoption reality
  body: AP estimates span from roughly $3.8 billion to nearly $7 billion in 2026 before procurement, expense, or broader payment adjacencies are added. A diligence model that treats all adjacent spend categories as one frictionless TAM will overstate practical SAM and understate integration constraints.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
  - CM040
- calloutType: strength
  title: Regulation and real-time rails are pushing finance teams toward integrated workflow platforms
  body: ViDA, instant-payment infrastructure, and AI-enabled compliance workflows all increase the value of software that connects invoice approval to actual payment execution. That structural direction benefits vendors like Tipalti that span both workflow and money movement.
  claimRefs:
  - CM033
  - CM034
  - CM035
  - CM036
