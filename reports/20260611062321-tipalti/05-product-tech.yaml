- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Public interface or dependency
  - Current public evidence
  - Key technical risk
  rows:
  - - Application workflows (AP / procurement / expenses / cards)
    - Primary finance-user workflows and approvals
    - Tipalti web platform and connected product modules
    - Multiple official product pages and release notes describe live workflow depth
    - Breadth raises change-management and configuration burden during rollout.
  - - Integration layer
    - Sync data with ERP, HRIS, SSO, Slack, and partner systems
    - Prebuilt connectors plus API layer
    - Integration page and Workday page show real-time sync claims and object-level coverage
    - Partner-specific edge cases and custom mapping effort remain private.
  - - Payments API
    - Create payees, payment batches, and payout workflows
    - REST/JSON endpoints with JWT auth
    - Payout API page and payment-batch doc are explicit on architecture and auth model
    - Rate limits, webhooks, and deprecation windows are not public.
  - - Procurement REST API
    - Read and modify procurement records programmatically
    - HTTPS access points and evolving schema
    - Help doc confirms read/write access and warns APIs may change
    - Version instability could increase integration maintenance cost.
  - - Identity and access layer
    - SSO, role assignment, and environment separation
    - OIDC with Okta plus custom role assignment
    - Okta doc and Q1 2026 team-management update show sandbox/prod split and richer access controls
    - No public evidence on SCIM depth or enterprise identity rollout scale.
  - - Treasury data plane
    - Pull live bank and ERP data into cash dashboard and forecasts
    - Secure APIs to 3,000+ banks/financial institutions and ERP/billing tools
    - Treasury page documents direct data ingestion and forecasting workflow
    - Public evidence does not yet show production accuracy or bank-coverage limitations.
  notes: This architecture table is limited to publicly inferable operating layers; Tipalti does not disclose deep internal service decomposition or tenancy design in retained sources.
