figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: A layered view of the public Tipalti stack from finance-user workflows down to integrations, payment rails, and treasury data services.
  data:
    layers:
    - id: l1
      label: Finance users and policies
      detail: Controllers, AP teams, procurement approvers, employees, and treasury users operate within configurable approval and role rules.
    - id: l2
      label: Workflow applications
      detail: AP, procurement, expenses, cards, supplier onboarding, and payout workflows provide the visible user-facing operating layer.
    - id: l3
      label: AI and rules engine
      detail: AI Assistant, task-specific agents, OCR/ML capture, duplicate checks, and approval logic sit inside workflow execution rather than as a separate analytics-only module.
    - id: l4
      label: Integration and identity fabric
      detail: ERP, HRIS, SSO, Slack, Workday, Workato, and custom APIs synchronize objects and user access across systems.
    - id: l5
      label: Payments and compliance rails
      detail: Global payout execution, fraud screening, OFAC and Do Not Pay checks, tax validation, and card funding sit close to transaction execution.
    - id: l6
      label: Treasury and data services
      detail: Statement Treasury adds real-time bank and ERP data aggregation, liquidity dashboards, and rolling cash forecasting.
  approximationNotes: The stack is conceptual. Tipalti does not publish a deep service-decomposition diagram, so the figure organizes only the layers that are directly inferable from product, integration, and treasury materials.
