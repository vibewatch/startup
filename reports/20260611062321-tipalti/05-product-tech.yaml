- id: trust-controls-and-product-maturity
  title: Trust, controls, and product maturity
  body: 'The most credible product-technology positives are around control surfaces. Tipalti’s Workday integration page is unusually specific: it claims suspected-fraud blocking, OFAC and Do Not Pay screening before payments, MFA, role-based security, audit logs, IP restrictions, HTTPS and AES encryption, and OCR-plus-machine-learning invoice capture that is supposed to reduce duplicates. Supplier-management and tax pages add self-service onboarding, multilingual support, W-8 and W-9 collection, VAT capture, and a 3,000-plus-rule tax engine across 60-plus countries. That is meaningful evidence that the platform is not only automating workflow but also embedding compliance and control steps into the operating model. Product maturity, however, is mixed across modules. The core AP, procurement, and expense workflows look live and documented, while the newer AI layer, Statement-based treasury surface, and card monetization features are supported mainly by Tipalti-authored materials and late-2025
    to Q1-2026 releases. Tipalti’s own AI page also admits outputs may be inaccurate or incomplete and says customers can disable AI features, which is the right governance stance but also a reminder that newer agentic workflows should not be treated as frictionless.'
  claimRefs:
