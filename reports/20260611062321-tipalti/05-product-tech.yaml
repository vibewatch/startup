- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: Publicly documented end-to-end operating flow from supplier onboarding or request intake through approvals, payments, and audit-ready reporting.
  data:
    nodes:
    - id: n1
      label: Supplier or employee submits data
      detail: Suppliers self-onboard or send invoices; employees submit expenses or card transactions via web or mobile.
    - id: n2
      label: Intake and document capture
      detail: Invoices, purchase requests, receipts, and supporting documents enter Tipalti workflows from email, portal, or UI.
    - id: n3
      label: Validation and enrichment
      detail: OCR or ML extracts line items; tax data, duplicate checks, and contextual rules are applied.
    - id: n4
      label: Approval routing
      detail: Purchase requests, invoices, cards, or reimbursements follow role- and policy-based approval paths.
    - id: n5
      label: ERP and identity sync
      detail: Approved objects synchronize to ERP or identity systems, with sandbox and production configurations kept distinct where documented.
    - id: n6
      label: Payment execution or reimbursement
      detail: Tipalti runs supplier payouts, expense reimbursements, or invoice card payments through its global payment rails.
    - id: n7
      label: Reconciliation and status visibility
      detail: Payment status, vendor correspondence, and reconciliation data flow back to finance teams and counterparties.
    - id: n8
      label: Reporting, audit, and treasury feedback
      detail: Audit logs, reporting agents, and treasury visibility consume the resulting transaction and balance data.
    edges:
    - from: n1
      to: n2
    - from: n2
      to: n3
    - from: n3
      to: n4
    - from: n4
      to: n5
    - from: n5
      to: n6
    - from: n6
      to: n7
    - from: n7
      to: n8
  approximationNotes: The workflow combines product and help-center descriptions across AP, procurement, expenses, and cards. Internal orchestration details are not published as a sequence diagram.
