tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user
  - Public live-state evidence
  - Differentiation / control angle
  - Maturity / caveat
  - Exact diligence gap
  rows:
  - - Accounts Payable
    - AP manager / controller
    - Dedicated AP page plus 2025 release notes and Workday integration page
    - End-to-end invoice, approval, payment, and reconciliation with AI and PO-matching depth
    - Most mature public surface
    - Need implementation metrics by invoice volume and ERP complexity.
  - - Procurement / Tipalti Approve
    - Requester, approver, procurement lead
    - Dedicated procurement page, procurement REST docs, Workato actions, 2025 feature updates
    - Purchase requests, approvals, supplier workflows, and connected spend controls
    - Live but some APIs explicitly marked subject to change
    - Need GA roadmap, versioning discipline, and adoption depth by customer segment.
  - - Global payments / payout API
    - AP ops, marketplace ops, finance systems team
    - Homepage, payout API page, Postman/GitHub developer artifacts
    - Cross-border payout coverage plus API-driven execution and sandbox tooling
    - Live and strategically central
    - Need documented rate limits, webhook/event model, and corridor-level operational SLAs.
  - - Expenses
    - Employees, managers, finance team
    - Product page plus help-center overview
    - Mobile capture, approval, reimbursement, and shared payment/compliance rails
    - Live and connected to broader suite
    - Need public proof of adoption depth versus AP base.
  - - Cards
    - Finance ops, spend owners
    - Help-center cards doc plus Q1 2026 update
    - Virtual invoice cards, virtual/physical expense cards, card-based funding and cashback logic
    - Clearly live but newest monetization layer
    - Need attach rate, issuer economics, and fraud-loss performance by card program.
  - - Supplier management + tax
    - AP ops, suppliers, compliance team
    - Supplier-management and tax-compliance pages
    - Self-service onboarding, multilingual support, W-8/W-9/VAT capture, tax validation
    - Live and highly workflow-adjacent
    - Need public trust-center proof for audit coverage and withholding accuracy.
  - - Treasury / Statement
    - Treasury, CFO, controller
    - 2025 press release plus treasury page
    - Real-time cash visibility, 13-week forecasting, anomaly detection, multi-bank aggregation
    - Newest adjacency with mostly Tipalti-authored proof
    - Need customer references, bank-coverage detail, and attach rates into installed base.
  - - AI layer
    - Finance users across modules
    - AI page plus 2025/2026 updates
    - Task-specific agents, AI assistant, reporting, tax scan, and sync-resolution workflows
    - Fast-moving and still partially roadmap-like
    - Need GA status, human-override design, and measurable accuracy by workflow.
  notes: Rows separate clearly documented live modules from newer adjacencies where public launch activity exists but customer-adoption depth is still limited.
