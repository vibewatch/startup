- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Tipalti product response
  - Public benefit signal
  - Limitation or caveat
  rows:
  - - AP manager processing supplier invoices
    - Email/PDF intake, manual coding, approval chasing, duplicate risk
    - AI invoice capture, OCR/ML extraction, PO matching, approval routing, reconciliation
    - Tipalti says AP teams can redirect time and close faster; reviewers cite automation benefits
    - No public benchmark for error rates or implementation effort by complexity band.
  - - Procurement requester and approver
    - Ad hoc requests, fragmented approvals, weak spend visibility
    - Approve handles purchase requests, approval workflows, signature steps, and supplier collaboration
    - Capterra feature summaries and Workato actions corroborate broad process coverage
    - Public docs do not show hard production metrics or long-term API stability.
  - - Employee and manager handling expenses
    - Receipt collection, policy checks, reimbursement lag
    - Mobile/web expense creation, approvals, reimbursements, and card reconciliation
    - Expense help docs show same payment rails and mobile flow reused across the platform
    - No public module-level adoption data or reimbursement SLA.
  - - Finance ops paying global suppliers or creators
    - Cross-border payout complexity and manual execution
    - Global payout API plus payment rails across countries, currencies, and methods
    - Official materials show broad geographic coverage and API-led automation
    - Corridor pricing, uptime, and API rate limits remain undisclosed.
  - - Treasury or CFO user managing liquidity
    - Spreadsheet-heavy cash visibility and short-term planning gaps
    - Statement Treasury adds real-time visibility, 13-week forecasts, and AI anomaly alerts
    - Treasury page documents live bank/API connectivity and drill-down visibility
    - Public evidence does not yet prove installed-base adoption or forecast accuracy.
  notes: Benefits are limited to publicly stated improvements and independent review signals; the table does not infer realized ROI beyond what sources describe.
