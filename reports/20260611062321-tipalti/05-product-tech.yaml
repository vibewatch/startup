  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: implementation-ops
    missingEvidence: Named implementation timelines, services mix, and customer-success staffing by deployment size.
    whyItMatters: Public reviews show friction, but they do not establish how repeatable or manageable implementation burden is across customer cohorts.
    diligencePath: Request implementation playbooks, time-to-live benchmarks, services gross margin, and reference calls segmented by ERP and entity complexity.
    relatedQuestionRefs:
    - QE018
    - QE025
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Current public trust-center evidence for SOC 2 scope, PCI scope, penetration testing cadence, and incident-response SLAs.
    whyItMatters: Security marketing exists, but underwriters still need formal assurance artifacts and scope boundaries before treating controls as investment-grade.
    diligencePath: Obtain current SOC 2 report, PCI attestation, DPA/subprocessor list, and customer-facing security package under NDA.
    relatedQuestionRefs:
    - QE012
    - QE023
    - QE025
    relatedTableRefs:
    - TE004
  - type: stale
    severity: material
    topic: reliability-history
    missingEvidence: Official historical incident log, uptime SLA, and recent postmortems rather than a third-party point-in-time status check.
    whyItMatters: Operational reliability is central to a payments-adjacent platform, and a single uptime snapshot does not prove production resilience.
    diligencePath: Request status-page history exports, uptime reports, customer SLA language, and the last year of Sev1/Sev2 incident summaries.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: api-operating-limits
    missingEvidence: Public detail on API rate limits, versioning policy, and deprecation windows across payout and procurement endpoints.
    whyItMatters: Integrator effort and long-term maintenance risk depend on whether APIs are stable, capacity-managed, and backward compatible.
    diligencePath: Ask for API versioning policy, rate-limit envelopes, webhook/event coverage, and customer migration notices for recent API changes.
    relatedQuestionRefs:
    - QE011
    - QE021
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: new-module-maturity
    missingEvidence: Customer adoption, attach rates, and production depth for newer AI, treasury, and card-monetization features.
    whyItMatters: The chapter can verify launch activity, but not whether newer adjacencies are materially deployed or economically durable.
    diligencePath: Request module-level attach rates, design-partner lists, customer references, and GA versus beta status by feature.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
