- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality signal
  - Public status
  - Scope implied by sources
  - Best public proof
  - Gap that still matters
  rows:
  - - OFAC and Do Not Pay screening
    - Documented as pre-payment control
    - Payee onboarding and payment execution
    - Workday integration and fraud-detection pages
    - Need actual screening providers, hit rates, and false-positive handling.
  - - MFA, RBAC, audit logs, IP restrictions, HTTPS, AES
    - Documented as control stack
    - User access, network transport, and auditability
    - Workday integration page
    - Need formal trust package and scope boundaries for each control.
  - - OCR / ML invoice capture plus duplicate reduction
    - Documented as production workflow control
    - Supplier bills from email or supplier portal
    - Workday integration page and AP page
    - Need measured extraction accuracy and duplicate-detection precision.
  - - Supplier self-service and multilingual onboarding
    - Documented as product capability
    - Supplier data capture and payment visibility
    - Supplier-management page
    - Need proof of actual localization quality and admin override controls.
  - - Tax engine with 3,000+ rules and 60+ countries
    - Documented as tax-compliance capability
    - Supplier tax IDs, VAT IDs, and withholding workflows
    - Tax-compliance page
    - Need external assurance on rule coverage and exception management.
  - - AI governance disclosures
    - Documented guardrails and opt-out
    - AI outputs, permissions, and third-party model use
    - Tipalti AI page
    - Need model-evaluation detail, hallucination controls, and auditability of AI actions.
  - - Operational status monitoring
    - Current uptime snapshot available
    - Point-in-time external status visibility
    - StatusGator service page
    - Need official historical incidents, SLA targets, and postmortem discipline.
  notes: Control rows capture what public sources explicitly say; they are not substitutes for audit reports, contractual SLAs, or customer security packets.
