callouts:
- calloutType: strength
  title: Tipalti has grown from AP tooling into a broader CFO platform story
  body: The product set visible in current official materials is substantially broader than classic bill pay. Tipalti now packages AP, global payouts, procurement, employee expenses, cards, tax, supplier management, and treasury under one operating umbrella, which strengthens the company’s position with mid-market finance leaders who want fewer system handoffs.
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO028
- calloutType: risk
  title: Execution quality, not demand existence, is the main near-term overview risk
  body: The 2025 layoffs and mid-market sales refocus imply that Tipalti is still tuning go-to-market efficiency and segment mix even after reaching large scale markers. That does not negate product-market fit, but it does mean investors should not treat the current private-company narrative as frictionless.
  claimRefs:
  - CO031
  - CO037
  - CO038
- calloutType: insight
  title: Debt has become part of the capital story alongside equity
  body: Tipalti’s 2023 and 2025 financing milestones show a company that remains able to attract lenders without resetting valuation publicly. For diligence, that is encouraging on access to capital, but it also makes the exact debt terms and covenant package more important than they would be in a pure-equity story.
  claimRefs:
  - CO026
  - CO027
  - CO032
