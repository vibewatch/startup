company:
  name: Tipalti
chapter:
  number: 1
  title: Company Overview
  summary: Tipalti is a finance-automation platform founded in 2010 that combines accounts payable, global payouts, procurement, expenses, cards, supplier management, tax compliance, and treasury workflows for mid-market businesses operating across borders. The strongest current public signal is the September 2025 $200 million Hercules Capital financing, which corroborates continued scale after the 2021 $270 million Series F at an $8.3 billion valuation and coincides with management claims of more than $200 million ARR, over 5,000 customers, and roughly $75 billion in annualized payment volume. The main diligence caveats are that governance and board disclosure remain thin in public materials, Tipalti has relied on debt alongside equity, and 2025 layoffs show management is still optimizing go-to-market focus and cost structure.
sections:
- id: identity-model-and-footprint
  title: Identity, business model, and operating footprint
  body: 'Tipalti presents itself as an AI-powered finance automation platform rather than a single-purpose AP tool. Across its company, homepage, accounts-payable, global-payouts, and mass-payments materials, the company consistently describes a connected suite spanning accounts payable, procurement, employee expenses, cards, supplier management, tax compliance, treasury, and global payments. The positioning matters because it frames Tipalti as workflow infrastructure for the office of the CFO, not just invoice automation. Public materials also show a clear focus on mid-market and high-velocity businesses that are complex enough to need multi-entity controls and global payment reach but still want a unified SaaS control plane instead of stitching together separate tools. The geographic footprint is also meaningful. Tipalti’s company page and 2022-2023 announcements show headquarters in Foster City, California, with an operating footprint spanning London, Tel Aviv, Toronto, Vancouver, Tbilisi,
    and the Netherlands. Official privacy-language confirms a multi-entity legal structure that includes Tipalti, Inc., Tipalti Solutions LTD, Tipalti Payments, Inc., Tipalti Europe LTD, Tipalti Canada, Inc., and Tipalti B.V. That legal and office spread is consistent with Tipalti’s product promise: supporting global supplier and payee workflows in 120 currencies across more than 200 countries and territories through bank and card partners such as Citi, Wells Fargo, J.P. Morgan, and Visa.'
