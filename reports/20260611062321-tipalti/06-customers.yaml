- id: gaps-and-diligence-priorities
  title: Gaps and diligence priorities
  body: >-
    The key diligence gap is not whether Tipalti has real customers—it clearly does—but how durable and
    economically valuable those relationships are. Public materials do not disclose NRR, GRR, cohort retention,
    top-account concentration, or contract-tenor data. The reviewed sources also leave a large gap between
    strong midmarket case-study proof and weaker marquee-logo proof: public evidence for Roblox, Twitch,
    X/Twitter, or WordPress.com is mostly reference quality, while no retained corroborated public source
    was found for Amazon Advertising, Canva, Automattic, or GoPro during this pass. That does not mean
    those relationships do not exist; it means the public evidence is not yet reference-grade. A diligence
    process should therefore treat Tipalti's customer base as clearly real and multi-vertical, but reserve
    judgment on concentration, renewal strength, and marquee-account depth until management provides permissioned
    references, deployment scope by logo, and cohort-retention data.
  claimRefs:
  - CU035
  - CU036
  - CU037
  - CU038
  - CU039
  - CU042
  - CU044
  - CU046
tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale signal
  - Strategic value / monetization signal
  - Key gap
  rows:
  - - Finance/AP teams
    - Controllers, AP managers, CFO orgs / supplier approvers / enterprise payer
    - Invoice capture, approvals, global supplier payments, close automation
    - 5,000+ businesses claimed on current public surfaces; multiple named AP case studies
    - Anchor module for upsell into procurement, expenses, and treasury
    - No public segment-level customer count or ARR split
  - - Creator / contractor payouts
    - Marketplace or network operator / creators-builders-artists / platform payer
    - Mass payouts, onboarding, tax forms, preferred currency and method selection
    - A.Team scaled payouts to builders in 40 countries; Create Music Group pays artists monthly
    - Payout-heavy programs raise switching costs if tax and onboarding data stay in-platform
    - No public disclosure of creator-network GMV or retention by cohort
  - - Publishers / adtech networks
    - Network finance teams / publishers / ad-network payer
    - Publisher payouts, self-service status visibility, early-payment options
    - PubMatic and Freestar public stories show adtech and publisher use cases
    - Supports high-frequency payment operations with cross-border complexity
    - No public top-publisher concentration or payment-volume mix
  - - Regulated / process-heavy finance teams
    - Insurance, biotech, nonprofit or services finance leaders / internal approvers / corporate payer
    - AP control, compliance, NetSuite or Intacct integration, faster closes
    - NEXT Insurance, ImaginAb, Capital Area Food Bank, and ServiceRocket case studies
    - Demonstrates fit beyond pure creator-economy or marketplace customers
    - No public contract-tenor or renewal statistics for these accounts
  - - Suppliers and vendors as payees
    - Enterprise procurement or AP team / supplier self-service payee / corporate payer
    - Supplier onboarding, W-9/W-8 collection, PO-linked payments, status tracking
    - Official procurement and global pages emphasize supplier self-service across 200+ countries
    - Can deepen embed once vendors onboard and compliance data is centralized
    - No public supplier-portal usage metrics or drop-off rates
  - - Procurement-led buyers
    - Procurement leaders and budget owners / requesters and approvers / enterprise payer
    - Intake-to-procure workflow, PO generation, policy enforcement, ERP sync
    - Procurement Magazine and Citrin Cooperman show Tipalti now selling into procurement workflows
    - Broadens wallet share beyond payouts and classic AP automation
    - Public sources do not quantify what share of customers buy procurement modules
  notes: >-
    Segmentation reflects reviewed public positioning plus named customer stories; public sources describe
    buyer-user-payer patterns but do not disclose segment-level customer counts, revenue mix, or concentration.
