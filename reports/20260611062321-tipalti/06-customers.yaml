company:
  name: Tipalti
chapter:
  number: 6
  title: Customers
  summary: >-
    Tipalti shows broad, multi-vertical customer adoption with 5,000+ businesses on current public surfaces
    and a deep set of named case studies that quantify time, close, and staffing gains. Public proof is
    strongest for midmarket finance teams, publisher or contractor payouts, and process-heavy AP workflows;
    it is materially weaker for marquee logos and almost silent on NRR, concentration, and contract durability.
sections:
- id: customer-base-and-adoption
  title: Customer base and adoption surfaces
  body: >-
    Tipalti's public customer picture is broad but unevenly measured. The strongest current top-line scale
    claim is the official customer stories hub and two recent third-party or partner surfaces saying the
    platform is trusted by more than 5,000 businesses, while older official comparison content still references
    more than 2,500 customers and over 4 million global payees. Public messaging also makes clear that
    the platform is sold into several buyer and user roles at once: finance teams managing AP, supplier
    and contractor payees, publisher and creator payout programs, and newer procurement or spend-control
    buyers. The product footprint matters because the same customer can start with global payouts or AP
    and later expand into procurement, expenses, or treasury. Tipalti's current pages also emphasize global
    operational reach—200+ countries, 120 currencies, and roughly 50 payment methods—which supports the
    adoption narrative for customers that need supplier, contractor, or creator payouts across many jurisdictions. It also suggests that Tipalti's customer base is operationally diverse: some accounts look like classic AP automation buyers, some are payout-heavy networks, and others appear to be procurement-led finance teams using broader intake-to-pay workflows.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU040
  - CU041
  - CU047
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: named-proof-and-reference-quality
  title: Named customer proof and reference quality
  body: >-
    Public named proof is strongest where Tipalti publishes full customer stories with quantified outcomes.
    JLab, Yoto, ImaginAb, PubMatic, A.Team, ServiceRocket, Brooklinen, Create Music Group, NEXT Insurance,
    Freestar, Sensei, and Capital Area Food Bank all have reviewed public stories describing clear production
    workflows and specific time, close, invoice-volume, or staffing outcomes. Those stories span consumer
    products, adtech, insurance, creator payouts, nonprofits, and global services, suggesting that Tipalti
    is not confined to one narrow vertical. By contrast, some of the highest-profile brands associated
    with Tipalti appear only as logos, customer-roster mentions, or breach-linked references rather than
    as permissioned case studies with deployment scope and outcome detail. That means the public corpus
    supports real adoption, but not every marquee name carries the same evidentiary weight. For diligence
    purposes, quantified case studies deserve more weight than logo walls, portfolio-level press-release
    claims, or security reporting that incidentally reveals customer names.
