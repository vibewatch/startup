  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Public retention metrics beyond headline marketing claims
    missingEvidence: >-
      No public NRR, GRR, cohort-retention table, or segment-level renewal data was found in retained
      sources; only high-level marketing retention and satisfaction claims are public.
    whyItMatters: >-
      Without cohort or revenue-retention data, public evidence cannot distinguish durable net expansion
      from merely low logo churn or strong new-customer acquisition.
    diligencePath: >-
      Request NRR, GRR, cohort retention by segment, renewal rates, and customer health dashboards from
      the finance data room or board materials.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: Customer concentration and segment revenue exposure
    missingEvidence: >-
      No retained public source disclosed top-customer concentration, top-10 account exposure, vertical
      revenue mix, or customer-count breakdown by segment or geography.
    whyItMatters: >-
      Tipalti serves many complex midmarket and enterprise accounts, so concentration or vertical overexposure
      could materially change durability, pricing power, and implementation-support needs.
    diligencePath: >-
      Request top-20 customer revenue share, segment revenue mix, geography mix, and logo concentration
      by ARR or payment volume.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU001
    - TU005
  - type: missing-source
    severity: material
    topic: >-
      Marquee-logo proof quality for Twitch, Roblox, X/Twitter, WordPress.com, Amazon Advertising, Canva,
      Automattic, and GoPro
    missingEvidence: >-
      Reviewed public materials yielded logo, press-release, or breach-coverage references for some marquee
      names, but not permissioned case studies with deployment scope, contract duration, or quantified
      outcomes; no corroborated public proof was retained for Amazon Advertising, Canva, Automattic, or
      GoPro.
    whyItMatters: >-
      Marquee logos can overstate customer quality if they represent limited workflows, legacy relationships,
      or non-referenceable deployments rather than broad production usage.
    diligencePath: >-
      Request a permissioned reference list for marquee accounts, deployment scope by logo, years live,
      annual volume handled, renewal status, and whether each logo is a current production customer.
    relatedQuestionRefs:
    - QU010
    relatedTableRefs:
    - TU003
    - TU006
  - type: private-evidence-only
    severity: moderate
    topic: Contract duration, renewal cadence, and pilot-to-production conversion
    missingEvidence: >-
      Retained public sources did not disclose average contract length, renewal cadence, pilot-to-production
      conversion rates, or segment-level implementation success rates.
    whyItMatters: >-
      Expansion economics depend on whether deployments quickly reach steady-state production and renew
      at attractive terms, especially for larger procurement-led buyers.
    diligencePath: >-
      Request contract-tenor distribution, renewal cohorts, pilot conversion rates, and implementation
      completion statistics by customer segment.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU003
    - TU004
    - TU005
