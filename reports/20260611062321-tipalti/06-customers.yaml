figures:
- id: FU001
  title: Tipalti customer journey map
  type: journey-map
  layout: standard
  summary: >-
    Publicly visible journey from finance pain to implementation, supplier onboarding, repeat use, and
    broader finance-suite expansion.
  data:
    items:
    - label: Pain recognition
      value: Manual invoice handling, fragmented payouts, approval bottlenecks, or procurement email chains
      note: >-
        Case studies and partner materials consistently start with finance teams overwhelmed by manual
        work or multi-entity complexity.
    - label: Evaluation
      value: ERP integration fit, global payment coverage, tax compliance, and supplier self-service are
        assessed
      note: >-
        Official content repeatedly highlights NetSuite, Intacct, global payee coverage, and tax workflows
        as selection criteria.
    - label: Implementation
      value: >-
        Finance team configures approvals, onboarding flows, and ERP sync; partner or customer-success
        help may be required
      note: >-
        Official materials advertise fast go-live, while review platforms show that implementations can
        still be heavy for large buyers.
    - label: Production payment run
      value: Invoices, suppliers, contractors, publishers, or creators are paid through centralized workflows
      note: >-
        Named customer stories show this stage producing measurable time or staffing savings when the
        deployment is fully live.
    - label: Repeat use and trust
      value: >-
        Suppliers or payees track status, approvers use dashboards, finance teams close faster and rely
        on recurring workflows
      note: >-
        Independent reviews support broad repeat usage, but public sources do not disclose renewal cohorts
        or contract duration.
    - label: Expansion
      value: Customers may add procurement, expenses, treasury, or broader finance-operations automation
      note: Public positioning clearly aims for suite expansion, but attach-rate and conversion data are
        not public.
  claimRefs:
  - CU002
  - CU003
  - CU021
  - CU041
  - CU042
  - CU046
  - CU047
- id: FU002
  title: Adoption / deployment flow
  type: flow
  layout: wide
  summary: Representative deployment path from initial manual-process pain to scaled production use and
    broader rollout.
  data:
    nodes:
    - id: manual-pain
      label: Manual AP or payout pain
      detail: Customers describe fragmented emails, spreadsheets, bank uploads, or cumbersome payout runs.
      type: input
    - id: evaluation-fit
      label: Platform-fit evaluation
      detail: Decision criteria center on ERP fit, tax compliance, supplier self-service, and global payment
        reach.
      type: process
    - id: implementation-work
      label: Implementation and change management
      detail: >-
        Implementation can be quick in official messaging but heavier in review-platform anecdotes, especially
        for large institutions.
      type: process
    - id: production-workflow
      label: Production workflow live
      detail: Named customers run invoices, supplier payments, or contractor payouts through Tipalti in
        production.
      type: process
    - id: efficiency-outcome
      label: Efficiency and control outcome
      detail: Public case studies most often cite faster closes, fewer manual hours, and no-headcount
        scaling.
      type: output
    - id: suite-expansion
      label: Potential suite expansion
      detail: Customers can layer procurement, expenses, or treasury if the initial workflow becomes embedded.
      type: output
  approximationNotes: >-
    This is a directional workflow figure rather than a numeric funnel because public conversion rates
    between stages are not disclosed.
