- id: retention-expansion-and-friction
  title: Retention, expansion, and procurement friction
  body: >-
    Public durability evidence is mixed. On the positive side, Tipalti repeatedly markets 99% retention
    and 98% satisfaction or support satisfaction, and independent review platforms show broad review volume
    with generally strong ratings. Review comments frequently praise automation, global payment coverage,
    ERP integrations, and supplier self-service. But the independent sources also expose procurement and
    implementation friction that matters for actual expansion quality: setup can be heavy, integration
    errors can be opaque, pricing can feel expensive for smaller accounts, and large or regulated buyers
    may need more internal change management than headline marketing suggests. That tension matters because
    Tipalti is clearly trying to expand from point solutions into a broader finance-operations suite.
    The partner ecosystem, procurement content, and customer stories all support the land-and-expand thesis,
    but public evidence is still thin on renewal cohorts, contract length, or what share of customers
    actually broadens from payments or AP into the full connected suite.
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU032
