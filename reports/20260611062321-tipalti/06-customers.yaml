- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Suite expansion from AP or payouts into procurement, expenses, and treasury
    - Attach-rate not publicly disclosed
    - Expansion thesis looks credible but conversion economics are opaque
    - Request module-attach rates, cross-sell cohorts, and ARR by product family
  - - Global payee and supplier onboarding data stored inside Tipalti
    - Customer may still multi-source payment rails or procurement tools
    - Embedded workflows can support stickiness but not necessarily sole-system status
    - Request competitive displacement rates and module win/loss analysis
  - - Large partner ecosystem (570+ partners)
    - Channel dependence may shift implementation quality to partners with uneven capability
    - Can accelerate reach while also creating service-variation risk
    - Request partner-sourced ARR, implementation NPS, and escalation data
  - - Marquee-logo marketing references
    - Logo concentration may be overstated if public proof is reference-quality only
    - Investors could overweight brand names without knowing deployment depth
    - Request permissioned reference calls and current production-scope by marquee logo
  - - Customer concentration
    - Top-customer, top-vertical, and top-region exposure are undisclosed publicly
    - A few large accounts could drive disproportionate volume, pricing leverage, or support burden
    - Request top-10 and top-20 customer exposure by revenue and payment volume
  - - Security and trust narratives after 2023 breach coverage
    - Enterprise customers may raise diligence demands or slow module expansion
    - Can increase procurement friction even if core adoption remains strong
    - Request incident-postmortem, remediation evidence, and renewal impact by affected customer segment
  notes: >-
    Expansion upside is plausible, but public evidence does not quantify cross-sell conversion or concentration.
    Security and implementation frictions could slow procurement-led expansion even if core AP and payout
    demand remains solid.
  claimRefs:
  - CU036
  - CU037
  - CU040
  - CU041
  - CU042
  - CU047
- id: TU006
  title: Public proof-quality and implementation-evidence table
  columns:
  - Evidence tier
  - Example
  - Signal
  - What it proves
  - What it does not prove
  - Diligence ask
  rows:
  - - Quantified official case study
    - JLab, Yoto, ImaginAb, PubMatic, A.Team, ServiceRocket
    - Specific operational outcomes on named deployments
    - Production usage and workflow impact are highly likely
    - Renewal, contract length, pricing, and independent customer permission are not shown
    - Ask for direct reference calls and current contract status
  - - Homepage logo or carousel
    - Roblox logo; PubMatic and A.Team carousel cards
    - Current official reference surface
    - Tipalti is comfortable publicly associating itself with these logos
    - Scope, recency, and commercial depth vary widely
    - Ask whether each logo is current, active, and referenceable
  - - Portfolio-level press release
    - PR Newswire partner expansion release
    - Named customer roster and portfolio-wide outcome claims
    - Some marquee logos are at least company-claimed customers
    - Does not tie outcomes to any one named customer or deployment
    - Ask for logo-specific metrics and permissioned references
  - - Independent review platform
    - Capterra, Software Advice, GetApp, TrustRadius
    - Independent user commentary and rating breadth
    - Satisfaction and implementation friction are observable externally
    - Reviewers are not a full customer sample and often lack segment metadata
    - Request support-ticket, churn, and customer-size segmentation
  - - Incident reporting
    - SOCRadar and The Cyber Express breach coverage
    - Adverse trust signal and incidental customer-name leakage
    - Enterprise trust risk and some customer-name linkage are externally visible
    - Security reporting is not customer-success proof and may reflect incomplete claims
    - Ask for incident impact, affected-customer count, and renewal fallout
  notes: >-
    This table ranks the reviewed public proof by diligence value. Quantified customer stories are the
    best public evidence; logo walls, portfolio-level releases, and incident reporting are weaker and
    need management corroboration.
