  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Customer-specific quotes, discount schedules, and contract terms for Tipalti, Coupa, Airbase, and SAP Concur by segment and invoice volume.
    whyItMatters: Public pages show list or custom structures but not the realized price bands that determine win rates, discounting behavior, and margin pressure.
    diligencePath: Request at least three recent enterprise quotes or anonymized RFP responses from finance buyers, implementation partners, or procurement advisers.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: switching-behavior
    missingEvidence: Segment-level churn, rip-and-replace, and module-attach data showing whether AP buyers truly switch vendors or just add adjacent modules.
    whyItMatters: Review evidence suggests lock-in, but without migration-rate data it is hard to size how much competitive pressure converts into actual displacement.
    diligencePath: Request customer reference calls, renewal decks, churn analyses, or implementation-partner win-loss summaries split by buyer size and ERP base.
    relatedQuestionRefs:
    - QP022
    - QP025
    relatedTableRefs:
    - TP006
  - type: missing-source
    severity: minor
    topic: implementation-friction
    missingEvidence: Measured deployment times, services effort, and post-go-live ticket volumes across Coupa, Concur, Tipalti, and Airbase implementations.
    whyItMatters: Current review evidence shows friction and change management burden, but quantified benchmark data would distinguish isolated complaints from structural adoption drag.
    diligencePath: Collect statements of work, onboarding timelines, and post-implementation satisfaction data from customers, SIs, or reseller references.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP007
