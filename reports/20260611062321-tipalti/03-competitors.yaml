- id: TP006
  title: Switching cost and lock-in mechanics
  columns:
  - Lock-in vector
  - Evidence
  - Vendors advantaged
  - Buyer implication
  - Threat to Tipalti
  rows:
  - - ERP and GL integrations
    - Named bi-directional integrations or large connector libraries are central to vendor pages
    - Tipalti, Coupa, SAP Concur, Ramp, BILL, Stampli
    - Replacing the AP layer can break reconciliations and finance close routines
    - Tipalti can win on integration breadth but also becomes harder to remove once installed
  - - Approval hierarchies and workflow routing
    - Nearly every suite sells configurable approval flows and exceptions handling
    - All major suites
    - Workflow logic becomes part of internal controls and audit practice
    - Feature parity means process redesign cost can favor incumbents
  - - Supplier onboarding and tax data
    - Vendor portals, W-9 collection, and onboarding links appear across products
    - Tipalti, BILL, Stampli, Brex, Ramp, Coupa
    - A migrated vendor base carries real retraining and data-cleanup cost
    - Tipalti benefits if onboarding is global and compliance heavy
  - - Cards, expenses, and travel consolidation
    - Card-first or T&E suites widen from one product into multiple spend categories
    - Ramp, Brex, SAP Concur, Paylocity Airbase
    - Once multiple spend workflows live together, a point replacement looks less attractive
    - Tipalti must prove value beyond basic AP to dislodge these bundles
  - - Procurement process ownership
    - Coupa, Airbase, Stampli, Ramp, and Brex tie AP to purchasing controls
    - Coupa, Paylocity Airbase, Stampli, Ramp, Brex
    - Procurement ownership broadens stakeholder count and slows rip-and-replace decisions
    - Tipalti’s procurement module matters because standalone AP is easier to commoditize
  - - Installed-base distribution and culture fit
    - Review and distribution evidence show SAP fit, HCM fit, and network defaults matter
    - SAP Concur, Paylocity Airbase, BILL
    - The incumbent ecosystem can shape shortlist formation before features are compared
    - Tipalti must sell into budgets where global complexity outweighs ecosystem inertia
  notes: These rows describe why switching is rarely a pure feature comparison once AP is embedded in close, approval, supplier, card, or travel workflows.
