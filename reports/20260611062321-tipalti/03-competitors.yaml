- id: TP007
  title: Moat durability and competitive risk register
  columns:
  - Moat claim
  - Supporting evidence
  - Competitive threat
  - Severity
  - Mitigation or diligence ask
  rows:
  - - Global payout and compliance depth
    - Tipalti explicitly markets broad cross-border coverage and compliance controls
    - Card-first suites may close some gaps over time
    - medium
    - Test real customer need for tax, entity, and multi-currency complexity before assuming buyers will pay for it
  - - Broader suite expansion protects AP core
    - Tipalti, Paylocity Airbase, Ramp, Brex, Coupa, and SAP Concur all push adjacent modules
    - Feature convergence reduces standalone AP differentiation
    - high
    - Underwrite attach rates for procurement, expense, and treasury rather than AP alone
  - - Procurement cross-sell can deepen lock-in
    - Coupa, Airbase, Stampli, Ramp, and Brex all connect AP to purchasing controls
    - Procurement-led incumbents may win the budget owner before AP teams do
    - high
    - Ask for win-rate data where procurement owns the buying process
  - - Transparent economics can reset buyer expectations
    - BILL shows public seat pricing and Brex advertises $0 or $12 plans while Ramp highlights low-friction payment economics
    - Custom-quote vendors may look expensive or slow to evaluate
    - high
    - Gather realized quote data and total-cost comparisons by invoice volume
  - - Installed-base channels matter more than brochure depth
    - BILL network scale, Paylocity client base, SAP connectors, and Coupa network all create distribution power
    - Tipalti may face preemptive bundling by adjacent system owners
    - high
    - Map how many target accounts already sit inside those ecosystems
  - - Implementation friction can blunt enterprise-suite wins
    - TrustRadius reviewers cite Coupa change management and hard integration work
    - A heavy rollout can slow adoption or create dissatisfaction
    - medium
    - Request deployment timelines, SI scopes, and post-go-live ticket data
  - - Valuation and market signals show category pressure
    - TechCrunch’s Brex valuation reset versus Ramp acceleration shows capital rewards the strongest distribution and economics story
    - Category crowding can compress standalone AP premiums
    - medium
    - Stress-test Tipalti against a scenario where AP becomes a feature within broader spend platforms
  notes: Severity reflects the risk to Tipalti’s differentiation if a buyer can source a “good enough” AP layer from an adjacent system owner with stronger channel leverage.
