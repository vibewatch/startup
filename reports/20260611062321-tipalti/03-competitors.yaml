  rows:
  - - Direct AP plus payments suites
    - Tipalti, BILL
    - Invoice-to-pay plus payment execution
    - Core controller-led AP automation budget
    - Breadth overlaps heavily and pricing differs
  - - Collaborative AP specialists
    - Stampli
    - Invoice-centric collaboration and vendor communication
    - Strong fit for teams optimizing approval workflow before full suite replacement
    - Less obvious distribution breadth than suites
  - - Enterprise AP layer
    - Medius
    - ERP-adjacent automation and control layer
    - Appeals to larger finance teams standardizing invoice workflow around ERP
    - Weaker public pricing transparency
  - - Procure-to-pay suites
    - Coupa
    - Source-to-pay breadth, network scale, compliance
    - Wins when procurement-led control is the buying center
    - Can be heavier change-management lift
  - - Travel and expense suite
    - SAP Concur
    - Travel, expense, and invoice in one spend stack
    - Strong fit where AP is bought with T&E and SAP integration needs
    - Invoice depth is not the only product story
  - - HCM-linked spend suite
    - Paylocity with Airbase
    - Payroll plus non-payroll spend in one pane of glass
    - Cross-sell into existing HCM accounts can preempt standalone AP searches
    - Most focused on 100-5,000 employee segment
  - - Card-first spend suites
    - Ramp, Brex
    - Low-friction cards, AP, expense, procurement adjacencies
    - Often enter through card or reimbursements then expand into bill pay
    - Global payout and tax depth look lighter than Tipalti
  - - Status quo stack
    - ERP modules, bank portals, email, spreadsheets, checks
    - No new platform purchase required
    - Still competes when switching cost or urgency is low
    - Poor visibility, control, and automation versus modern suites
  notes: Rows group the main buyer alternatives rather than every vendor in the category so the reader can see how Tipalti loses deals through several distribution paths, not one peer set.
