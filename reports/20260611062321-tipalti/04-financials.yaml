  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC payback, NRR, and cohort retention by segment remain undisclosed.
    whyItMatters: These metrics determine whether Tipalti behaves like a durable software platform or a more service-heavy payments operator.
    diligencePath: Request monthly board KPIs with gross margin by stream, CAC payback, NRR, gross retention, and segment-level churn.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt covenant headroom, and maturity schedule are not public.
    whyItMatters: Debt access alone does not answer downside resilience or next-round timing.
    diligencePath: Request the latest treasury package, cash bridge, debt schedule, covenant model, and 24-month operating plan.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: No retained public source explains how Tipalti recognizes software, payment, FX, implementation, and service revenue.
    whyItMatters: Revenue quality and comparability to SaaS peers depend on the recognition policy.
    diligencePath: Request the accounting memo, auditor summary, and sample customer contract language for each monetization stream.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Top-customer concentration, module attach rates, and renewal cohorts are not public.
    whyItMatters: Scale can mask dependence on a small number of accounts or weak expansion durability.
    diligencePath: Request top-20 customer concentration, module attach by cohort, and 12-quarter renewal and churn tables.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Published list prices do not show realized payment fees, FX spreads, or implementation recovery by customer segment.
    whyItMatters: Underwriting needs actual realized pricing, not entry-page anchors.
    diligencePath: Request top-10 contracts, discount history, fee schedules by payment rail, and professional-services recovery rates.
    relatedQuestionRefs:
    - QI003
    - QI019
    relatedTableRefs:
    - TI002
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: No retained public source provides a post-2021 equity valuation or market-clearing secondary reference.
    whyItMatters: Using a stale peak-era valuation can overstate current downside protection or upside confidence.
    diligencePath: Request any internal 409A, tender, or secondary-mark pricing from 2025-2026 and reconcile it to current debt terms.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI004
