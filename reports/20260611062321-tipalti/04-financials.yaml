- id: capital-adequacy-and-cost-structure
  title: Capital adequacy, cost structure, and margin drivers
  body: Capital access is visible; liquidity is not. Tipalti raised $150 million of growth financing in 2023 and another $200 million in 2025, both from venture lenders rather than from a newly disclosed equity round. Hercules' own Q3 2025 SEC disclosure shows the lender had substantial commitment volume and over $1 billion of available liquidity, which supports the plausibility of the facility but says nothing direct about Tipalti's cash balance. The last public equity price still referenced in retained sources is the December 2021 $8.3 billion valuation, so current valuation support is effectively being inferred from debt-market willingness, ARR claims, and ongoing product expansion rather than from a fresh priced round. On cost structure, the evidence points away from pure software economics. Vendr describes negotiated enterprise contracts and meaningful annual spend, while adverse reviews point to implementation work, onboarding, support burden, and settlement friction. That combination
    suggests margin depends on software subscription mix, payment rails and FX economics, compliance overhead, and service intensity across onboarding and support.
