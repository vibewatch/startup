- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Current public proxy
  - Impact
  - Exact diligence path
  rows:
  - - Audited revenue by stream and recognition policy
    - ARR, customer count, and payment volume only
    - Cannot judge revenue quality or software-versus-payments mix
    - Request audited 2024-2025 revenue split plus accounting memo for payment and service revenue.
  - - Gross margin by stream
    - Reviews and pricing show operational complexity but no actual margins
    - Cannot underwrite software-like margin path
    - Request gross-profit waterfall for subscriptions, payment rails, FX, support, and treasury.
  - - CAC payback, sales cycle, and NRR
    - Layoff and segment-focus signals suggest optimization, but no company metrics are public
    - Cannot judge sales efficiency durability
    - Request cohort CAC, payback, NRR, gross retention, and win-rate by segment.
  - - Cash, burn, and runway
    - Fresh debt financing without disclosed balance-sheet numbers
    - Cannot assess financing dependency or downside timing
    - Request latest board deck, cash bridge, and 24-month operating plan.
  - - Debt terms and covenant headroom
    - Facility amounts are public, but covenant package is not
    - Hidden leverage could change the downside sharply
    - Request full debt schedule, lender consents, collateral, and covenant model.
  - - Customer concentration and module attach
    - Customer count and stories are public, but top-account exposure is not
    - Scale could hide concentration or weak expansion quality
    - Request top-20 customer concentration, module attach rates, and renewal cohorts.
  notes: Each gap is specific and actionable. Public evidence supports a directional financial view, but these requests are required for underwriting-grade diligence.
