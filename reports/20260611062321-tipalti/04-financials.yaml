tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / public proxy
  - Current value / status
  - Revenue quality read
  - Diligence ask
  rows:
  - - AP automation subscriptions
    - Base platform subscription for invoice, approval, supplier, and ERP workflow automation
    - List pricing visible in UK/EU; negotiated in larger deals
    - Live and clearly monetized
    - Looks recurring and software-like, but realized contract values are not public
    - Request revenue by plan tier, entity count, and module attach.
  - - Mass payments and payment-method fees
    - Transaction-based pricing layered on top of the platform for payout activity
    - Payment volume, payment method, and entity count drive cost
    - Live, but no public fee card by rail
    - Likely recurring with lower incremental margin than pure SaaS
    - Request fee schedules by ACH, wire, FX, card, and cross-border corridor.
  - - Procurement, expenses, cards, and supplier-management upsells
    - Module expansion on top of core payables workflows
    - Official materials show modules, not realized attach rates
    - Live and expanding
    - Useful for ACV expansion but opaque on contribution margin
    - Request module penetration and gross profit by add-on.
  - - Treasury / cash-intelligence upsell
    - Statement acquisition adds treasury automation and cash-forecasting capability
    - Product scope expanded in June 2025
    - Newer cross-sell surface
    - Strategically attractive but pricing and adoption are undisclosed
    - Request early pipeline, attach rate, and net-new ARR from treasury.
  - - Implementation and onboarding services
    - Deployment, configuration, supplier migration, and support work referenced by reviews and enterprise benchmarks
    - Independent reviews cite material onboarding effort
    - Economically relevant but not transparently priced
    - Can help land deals while depressing near-term margin if service-heavy
    - Request one-time services revenue, partner implementation mix, and support cost by cohort.
  notes: Rows distinguish clearly disclosed monetization surfaces from undisclosed realized economics; public evidence shows where Tipalti gets paid, not the exact take rate or revenue-recognition policy.
