              The 2025 layoffs and mid-market sales refocus imply that Tipalti is still tuning go-to-market efficiency
              and segment mix even after reaching large scale markers. That does not negate product-market fit, but it
              does mean investors should not treat the current private-company narrative as frictionless.
            calloutType: risk
