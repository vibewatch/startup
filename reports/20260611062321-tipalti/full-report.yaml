      - number: '3.3'
        title: Pricing, distribution, and buyer economics favor scaled channels
        blocks:
          - type: paragraph
            body: >-
              Competitive pressure is not just feature pressure; it is commercial and channel pressure. Tipalti’s
              pricing page makes clear that the platform is modular, transaction-based, and custom-quoted for more
              complex deployments. That can be sensible for global multi-entity workflows, but it is harder to benchmark
              than BILL’s published seat tiers or Brex’s visible $0 and $12 plans, and Ramp’s pricing page reinforces a
              low-friction economic story around free wires and bill-pay economics. Distribution also matters. BILL
              brings a large installed base and network. Paylocity can cross-sell finance into an existing HCM base.
              Coupa rides procurement ownership, while SAP Concur travels with T&E and SAP adjacency. Those channels
              shape who gets on the shortlist before a pure AP bake-off even starts. Tipalti therefore wins best where
              pain is complex enough that buyers will tolerate custom pricing and a more deliberate evaluation process
              in exchange for global depth.
