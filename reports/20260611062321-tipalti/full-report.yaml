  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Tipalti has enough scale and product breadth to merit diligence, but stale price discovery and missing economics
      block a conviction buy.
    data:
      nodes:
        - id: A
          label: Scale and growth
          detail: ARR crossed $200M, customers exceeded 5,000, and annualized payment volume reached $75B.
          tone: positive
        - id: B
          label: Automation breadth
          detail: Tipalti now markets AP, payments, procurement, expenses, and treasury across 200+ countries.
          tone: positive
        - id: C
          label: Stale price anchor
          detail: The last public equity mark is still the 2021 $8.3B Series F.
          tone: warning
        - id: D
          label: Missing underwriting proof
          detail: Margins, retention, current fair value, and preference terms are still private.
          tone: warning
        - id: E
          label: Decision
          detail: research-more / high risk / expensive until fresh economics and price support appear.
          tone: neutral
      edges:
        - from: A
          to: E
          label: supports diligence
        - from: B
          to: E
          label: supports some premium
        - from: C
          to: E
          label: blocks full carry
        - from: D
          to: E
          label: prevents conviction
    approximationNotes: Flow summarizes valuation logic rather than a numeric model.
    claimRefs:
      - CV007
      - CV009
      - CV010
      - CV011
      - CV013
      - CV041
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Even a premium multiple on the public ARR floor leaves Tipalti well below the legacy $8.3B mark.
    data:
      items:
        - label: 8x on $200M
          value: 1.6
          detail: Near a de-rated payments or cautious private software case.
          tone: negative
        - label: 10x on $200M
          value: 2
          detail: Entry point for a modest premium to payments medians.
          tone: warning
        - label: 12x on $200M
          value: 2.4
          detail: Requires clearer software-like quality but still not a heroic multiple.
          tone: warning
        - label: 15x on $200M
          value: 3
          detail: Healthy premium for a strong automation asset with good economics.
          tone: neutral
        - label: 20x on $200M
          value: 4
          detail: Still only about half of the 2021 headline mark.
          tone: positive
    approximationNotes: Values are simple multiple bridges on the public >$200M ARR floor, expressed in USD billions.
    claimRefs:
      - CV007
      - CV021
      - CV022
      - CV024
      - CV045
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The most supportable 2026 range is wide but still materially below the 2021 peak unless hidden economics are much
      stronger than public evidence suggests.
    data:
      items:
        - label: Bear
          low: 1.6
          mid: 2.1
          high: 2.5
          displayValue: $1.6B-$2.5B
          detail: Growth slows, premium compresses, and debt or preference terms matter more.
          tone: negative
        - label: Base
          low: 2.5
          mid: 3.2
          high: 4
          displayValue: $2.5B-$4.0B
          detail: Tipalti keeps a premium to payments comps but not its 2021 peak valuation.
          tone: warning
        - label: Bull
          low: 4
          mid: 5.1
          high: 6.5
          displayValue: $4.0B-$6.5B
          detail: Requires stronger ARR compounding, software-like margins, and persistent AI premium.
          tone: positive
        - label: 2021 legacy mark
          low: 8.3
          mid: 8.3
          high: 8.3
          displayValue: $8.3B
          detail: Historical financing anchor rather than a current fair-value print.
          tone: neutral
    approximationNotes: All ranges are scenario-based valuation bands in USD billions rather than observed 2026 transactions.
    claimRefs:
      - CV001
      - CV045
      - CV046
      - CV047
      - CV050
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Tipalti scores well on scale and category relevance, but evidence quality and valuation support lag the narrative.
    data:
      items:
        - label: Scale
          score: 8
          detail: 5,000+ customers and $75B annualized payment volume are meaningful late-stage metrics.
          tone: positive
        - label: Product breadth
          score: 7
          detail: AP, payments, procurement, expenses, and treasury support a broader automation story.
          tone: positive
        - label: Category tailwind
          score: 7
          detail: Finance automation and selective fintech reopening remain supportive in 2026.
          tone: positive
        - label: Evidence quality
          score: 4
          detail: Margins, retention, and current fair value are still private.
          tone: warning
        - label: Valuation support
          score: 3
          detail: Comp bands do not support carrying the full 2021 peak mark today.
          tone: negative
        - label: IPO readiness
          score: 5
          detail: Tipalti is discussing readiness publicly, but the retained record is not yet public-company proof.
          tone: warning
    approximationNotes: Scores are investment-committee heuristics on a 1-10 scale built from retained public evidence.
    claimRefs:
      - CV009
      - CV011
      - CV034
      - CV040
      - CV044
      - CV056
