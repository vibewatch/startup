      - number: '3.2'
        title: Capability convergence narrows feature-led differentiation
        blocks:
          - type: paragraph
            body: >-
              The evidence set shows a market that has already converged well beyond basic invoice digitization.
              Tipalti, BILL, Airbase by Paylocity, Stampli, Coupa, SAP Concur, Ramp, and Brex all now market some
              combination of invoice capture, approvals, PO matching, payments, ERP sync, supplier onboarding, and
              adjacent spend modules. The differences are still real, but they are becoming more contextual. Tipalti’s
              clearest technical wedge is the explicit global payout and multi-entity story. BILL pairs AP depth with
              network scale and transparent packaging. Stampli is more invoice-collaboration centric. Coupa and SAP
              Concur pull AP into broader enterprise suites, while Ramp and Brex lean on cards and modern UX to make AP
              part of a wider spend operating system. That convergence is the core adverse fact in this chapter: buyers
              can increasingly get a “good enough” AP layer from multiple adjacent entry points, so the moat cannot rest
