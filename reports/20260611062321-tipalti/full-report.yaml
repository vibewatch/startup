companyProfile:
  summary: >-
    Tipalti is a private finance-automation and B2B payments platform founded in 2010 by Chen Amit and Oren Zeev. The
    company has expanded from AP automation and global payouts into a broader office-of-the- CFO stack spanning
    procurement, expenses, cards, supplier management, tax compliance, and treasury, including the Statement acquisition
    in 2025. Public evidence supports meaningful scale—5,000+ businesses served, >$200 million ARR, and ~$75 billion of
    annualized payment volume—while also showing a business still balancing growth, margin discipline, and product
    expansion after 2025 layoffs and additional non-dilutive financing.
