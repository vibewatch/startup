  - id: FU001
    title: Tipalti customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Publicly visible journey from finance pain to implementation, supplier onboarding, repeat use, and broader
      finance-suite expansion.
    data:
      items:
        - label: Pain recognition
          value: Manual invoice handling, fragmented payouts, approval bottlenecks, or procurement email chains
          note: >-
            Case studies and partner materials consistently start with finance teams overwhelmed by manual work or
            multi-entity complexity.
        - label: Evaluation
          value: ERP integration fit, global payment coverage, tax compliance, and supplier self-service are assessed
          note: >-
            Official content repeatedly highlights NetSuite, Intacct, global payee coverage, and tax workflows as
            selection criteria.
        - label: Implementation
          value: >-
            Finance team configures approvals, onboarding flows, and ERP sync; partner or customer-success help may be
            required
          note: >-
            Official materials advertise fast go-live, while review platforms show that implementations can still be
            heavy for large buyers.
        - label: Production payment run
          value: Invoices, suppliers, contractors, publishers, or creators are paid through centralized workflows
          note: >-
            Named customer stories show this stage producing measurable time or staffing savings when the deployment is
            fully live.
        - label: Repeat use and trust
          value: >-
            Suppliers or payees track status, approvers use dashboards, finance teams close faster and rely on recurring
            workflows
          note: >-
            Independent reviews support broad repeat usage, but public sources do not disclose renewal cohorts or
            contract duration.
        - label: Expansion
          value: Customers may add procurement, expenses, treasury, or broader finance-operations automation
          note: Public positioning clearly aims for suite expansion, but attach-rate and conversion data are not public.
