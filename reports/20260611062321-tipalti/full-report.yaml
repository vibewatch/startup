      - number: '4.4'
        title: Disclosure blockers and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The net assessment is constructive on demand but conservative on underwriting confidence. Multiple sources
              corroborate that Tipalti is real scale software: the business is monetizing finance automation, global
              payments, and newer treasury or spend modules at a level consistent with a serious mid-market platform.
              However, the retained public record is notably thinner on the questions that matter most for investment
              underwriting. There is no public audited revenue breakout, no disclosed gross margin by stream, no CAC or
              payback data, no net retention, no concentration disclosure, and no current cash or runway disclosure.
              Adverse customer feedback also shows that implementation and payment operations can create real friction
              even when the product solves important finance pain. As a result, public evidence is sufficient to support
              a cautious-positive financial verdict on revenue breadth, demand, and access to capital, but not enough to
              treat revenue quality, margin path, or balance-sheet adequacy as resolved. Any diligence process should
              therefore push hard on recognition policy, cohort economics, and cash planning before using the stale 2021
              valuation as an underwriting anchor.
