      - number: '6.4'
        title: Gaps and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The key diligence gap is not whether Tipalti has real customers—it clearly does—but how durable and
              economically valuable those relationships are. Public materials do not disclose NRR, GRR, cohort
              retention, top-account concentration, or contract-tenor data. The reviewed sources also leave a large gap
              between strong midmarket case-study proof and weaker marquee-logo proof: public evidence for Roblox,
              Twitch, X/Twitter, or WordPress.com is mostly reference quality, while no retained corroborated public
              source was found for Amazon Advertising, Canva, Automattic, or GoPro during this pass. That does not mean
              those relationships do not exist; it means the public evidence is not yet reference-grade. A diligence
              process should therefore treat Tipalti's customer base as clearly real and multi-vertical, but reserve
              judgment on concentration, renewal strength, and marquee-account depth until management provides
              permissioned references, deployment scope by logo, and cohort-retention data.
