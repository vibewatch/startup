      - number: '3.4'
        title: Switching costs, lock-in, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Switching costs cut both ways in this category. Once AP is wired into ERP mappings, approval hierarchies,
              supplier onboarding, cards, procurement, or travel, a buyer is no longer comparing only invoice features.
              TrustRadius review evidence is particularly important here because it shows the lived cost of enterprise
              suites: Coupa can require procurement change management and difficult NetSuite integration work, while
              Concur can become so embedded that switching stops feeling practical. That supports a real lock-in thesis
              for deployed systems, but it also means Tipalti faces inertia when chasing installed rivals. The adverse
              evidence is broader than implementation pain. TechCrunch’s 2026 Brex coverage shows how quickly capital
              and market sentiment can re-rank vendors when distribution and economics shift, while official pages show
              ongoing suite convergence across the field. The durable question is therefore whether Tipalti’s global
              payout and compliance complexity is valuable enough to overcome adjacent-system bundling and incumbent
              inertia in the accounts it cares about most.
