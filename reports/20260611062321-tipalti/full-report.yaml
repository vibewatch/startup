      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The 2026 IPO window is open, but it is explicitly selective. EY, PwC, and Forbes all describe a market
              that rewards scaled issuers with resilient fundamentals, durable recurring revenue, strong governance, and
              a credible path to sustained profitability. Forbes’ practical bar — roughly $2-3 billion of valuation,
              more than $200 million of revenue, and breakeven or better profitability — suggests Tipalti may have
              enough scale to join the conversation. But scale alone is not readiness. Tipalti has publicly discussed
              IPO readiness and is clearly shaping a finance-automation and AI story, yet the public record still lacks
              audited profitability, net retention, guidance discipline, cap-table terms, and a fresh equity reference
              point. That means the path to conviction runs through diligence, not enthusiasm. An investment committee
              should ask for the ARR and margin bridge, 409A or secondary evidence, debt covenants, and preference-stack
              detail before paying anything close to the historical mark. If those files disappoint, the thesis breaks
              quickly because most of the current support rests on premium assumptions rather than on disclosed proof.
            claimRefs:
