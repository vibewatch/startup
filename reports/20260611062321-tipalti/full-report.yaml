  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk landscape
        blocks:
          - type: paragraph
            body: >-
              Tipalti’s highest-ranked risk is not generic software execution; it is regulated money movement. The
              company says it is a licensed money transmitter, a U.S. Treasury-registered money services business, and
              connected to blue-chip bank partners and a global banking network, which means any failure in licensing,
              AML design, sanctions screening, or partner-bank oversight can immediately cascade into payout disruption
              and customer harm (CR001, CR016, CR037, CR038). New York’s licensing standard, the MTMA rollout, the OCC’s
              2026 AML proposal, and OFAC’s active enforcement cadence show that the surrounding rulebook is getting
              tighter rather than easier (CR007, CR008, CR009, CR010). That makes legal and regulatory readiness the
              chapter’s top kill-zone. The second tier of risk is platform-operational: Tipalti advertises strong
              security, backup, fraud, and screening controls, but service continuity still matters because payments
              availability is a thesis-critical customer promise (CR002, CR003, CR011, CR019, CR039). The third tier is
              market and financing pressure. Competitors across BILL, Coupa, SAP Concur, Ramp, and Brex are all pitching
              AI-led AP and spend automation, while Tipalti is funding expansion with debt and simultaneously
              restructuring headcount (CR023, CR025, CR028, CR032, CR041, CR045).
            claimRefs:
              - CR001
              - CR002
              - CR003
