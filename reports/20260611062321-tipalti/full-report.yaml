  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Tipalti's public pricing and product pages make the revenue architecture legible even though they stop
              short of underwriting-grade disclosure. The company explicitly says pricing combines a base subscription
              with transaction-based fees, and that realized spend depends on payment volume, number of legal entities,
              and enabled modules. Regional list pages give a visible anchor: UK plans start at £99 and £199 per month,
              while European plans start at €99 and €219 per month, before additional payment or module economics. That
              means Tipalti is not selling a simple seat license. It is monetizing workflow software, money movement,
              and add-on functionality such as procurement, cards, expenses, supplier management, tax, and treasury. The
              June 2025 Statement acquisition widened that scope further by adding treasury automation and
              cash-intelligence tooling. The implication is positive for expansion revenue but mixed for margin clarity:
              public evidence supports a hybrid SaaS-plus-payments fee model, yet it still does not disclose realized
              take rates, module mix, revenue-recognition policy, or how much gross profit comes from software versus
              operational payment services.
