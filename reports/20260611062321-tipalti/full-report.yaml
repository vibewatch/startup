      - number: '5.2'
        title: Architecture, integrations, and deployment model
        blocks:
          - type: paragraph
            body: >-
              Tipalti’s public technical surface is unusually implementation-oriented for a finance-automation vendor,
              even if it stops well short of architecture-deep engineering docs. The product pages, integration pages,
              and developer materials together show a modular cloud operating model: workflow applications sit above ERP
              and identity integrations, while payment execution is exposed through documented APIs and platform
              connectors. The payout API is clearly modern REST/JSON, and the payment-batch reference confirms Bearer
              JWT authentication rather than a purely legacy integration pattern. Procurement APIs also exist, but
              Tipalti explicitly warns they are subject to change, which is a useful maturity signal for diligence
              because it implies some surfaces are still evolving. On deployment controls, the Okta guide shows separate
              sandbox and production endpoints, while the developer materials reference sample code and sandbox testing.
              Integrations with Workday and Workato suggest the platform is designed to sync operational objects like
              suppliers, bills, POs, PRs, and payments rather than just export summary files. The takeaway is that
              Tipalti looks integration-centric and configurable, but API operating limits, deprecation discipline, and
              partner-specific implementation effort are still mostly private evidence.
