      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The relevant market is broad, but Tipalti’s credible entry wedge is narrower
            body: >-
              The presence of trillion-dollar B2B payment flow does not automatically mean Tipalti can monetize all of
              it. The believable wedge is the subset of finance teams that need integrated invoice, supplier, approval,
              and payment controls badly enough to replace fragmented legacy processes.
            calloutType: insight
            claimRefs:
              - CM018
              - CM023
              - CM040
          - type: callout
            title: Boundary mistakes can make valuation work look stronger than adoption reality
            body: >-
              AP estimates span from roughly $3.8 billion to nearly $7 billion in 2026 before procurement, expense, or
              broader payment adjacencies are added. A diligence model that treats all adjacent spend categories as one
              frictionless TAM will overstate practical SAM and understate integration constraints.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM040
          - type: callout
            title: Regulation and real-time rails are pushing finance teams toward integrated workflow platforms
            body: >-
              ViDA, instant-payment infrastructure, and AI-enabled compliance workflows all increase the value of
              software that connects invoice approval to actual payment execution. That structural direction benefits
              vendors like Tipalti that span both workflow and money movement.
            calloutType: strength
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape across direct, adjacent, and status-quo alternatives
        blocks:
          - type: paragraph
            body: >-
              Tipalti does not compete against one clean peer group. The direct overlap includes BILL, Stampli, and
              Medius in AP automation, but the same buyer can also solve the job through a procure-to-pay suite like
              Coupa, a travel-and-expense stack like SAP Concur, an HCM-linked spend suite like Paylocity after the
              Airbase acquisition, or card-first platforms such as Ramp and Brex that have pushed quickly into bill pay
              and procurement. Status quo also still matters: company and competitor pages continue to describe
              fragmented bank portals, spreadsheets, ERP workarounds, email approvals, and checks as the incumbent
              alternative. Tipalti’s own positioning is broader than classic invoice workflow because it emphasizes AP,
              mass payments, procurement, and expenses in one platform, with the strongest explicit edge around
              cross-border and multi-entity complexity. That means the real competitive map follows the buyer’s starting
              point and adjacent system footprint, not just who else says “AP automation” on a homepage.
