      - number: '2.2'
        title: Sizing lenses, contradictory estimates, and what they really mean
        blocks:
          - type: paragraph
            body: >-
              The public market data is directionally strong but numerically inconsistent, which is exactly why this
              chapter preserves multiple lenses instead of one headline TAM. For AP automation alone, The Business
              Research Company’s 2026 report pegs the market at $6.57 billion in 2026 after $5.42 billion in 2025, while
              Mordor Intelligence estimates $6.94 billion in 2026, and Future Market Insights presents a much narrower
              $3.8 billion 2026 figure. Grand View’s more historical framing gives $3.07 billion in 2023 and $7.1
              billion by 2030. These are not necessarily contradictions in the underlying trend; they reflect different
              inclusions around services, payment processing, enterprise workflows, and forecast windows. The correct
              interpretation is not that one source is right and the others are useless, but that any honest market map
              must declare what it is counting. The surrounding payment pool is much larger. Mordor puts the total B2B
              payments market at $1.67 trillion in 2026, while Fortune Business Insights estimates the cross-border
              payments market at $397.37 billion in 2026 and shows the B2B cross-border segment as the largest
              transaction type. Procurement software and expense management are also large adjacent categories in their
              own right, at roughly $10.74 billion and $8.48 billion respectively in 2026 according to Mordor pages.
              That means Tipalti’s believable opportunity set is not all global payments, but the subset of finance
              teams willing to replace fragmented AP, supplier, and payment processes with unified software tied to
              high-volume, compliance-sensitive workflows.
