        - Helpful for cross-border and B2B payout context.
        - >-
          Not a direct AP automation platform and current retained source set does not pin a clean live EV/revenue
          multiple.
      - - Flywire
        - Q1 2026 revenue $188.1M; 2025 payment volume $37.6B
        - Smaller but software-led payments comp with strong 2026 growth and profitability improvement
        - Good reference for a software-plus-payments model that can outrun raw payments growth.
        - Vertical mix skews to education, healthcare, and travel rather than finance automation.
      - - Payments public median
        - Q1 2026 payments-and-transfers cohort
        - 3.6x median EV/Revenue; 7.7x average
        - Best base-rate public benchmark for how 2026 markets price payment-heavy businesses.
        - Median and average are broad sector statistics, not direct company comps.
      - - Private fintech average
        - Q1 2026 private versus public fintech dataset
        - 16.4x private EV/Revenue versus 5.9x public average
        - Shows why late-stage private marks can stay above public comps for a time.
        - Dataset averages are skewed by outliers and do not prove Tipalti itself deserves the private premium.
