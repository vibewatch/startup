      - number: '8.3'
        title: Scenario range, recommendation, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The right call on Tipalti is price-sensitive and evidence-sensitive. The company has enough real scale to
              avoid an easy dismissal: it is above the $200 million ARR threshold, runs meaningful global payment
              volume, and still claims 30% customer growth while investing in AI and treasury workflows. That supports a
              premium to raw payments medians. What the record does not support is carrying the entire $8.3 billion mark
              forward without challenge. If an investor underwrites from the public ARR floor and applies a healthy but
              not euphoric 10x-16x multiple range, the base-case valuation frame lands around $2.5-$4.0 billion. A
              stronger bull case needs materially higher ARR, software-like margins, and proof that AI deepens economics
              rather than just narrative. The bear case pushes much lower if growth slows, the premium compresses toward
              payments medians, or debt and preference terms absorb upside. Given that setup, the chapter’s
              recommendation is research-more, confidence is medium, risk is high, and valuation stance is expensive.
              The company itself may still be good; the public support for the old price is not.
            claimRefs:
