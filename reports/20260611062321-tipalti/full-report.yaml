      - number: '1.2'
        title: Founders, leadership depth, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The clearest founder facts in the fetched pack are that Tipalti was founded in 2010 by Chen Amit and Oren
              Zeev, with Amit still serving as CEO and Zeev listed as co-founder and chairman. Official materials also
              show a broader leadership bench than the two founders alone: Rob Israch as President, Dan Barzily as CFO,
              Manish Vrishaketu as Chief Customer and Operating Officer, Roby Baruch as Chief Product and Technology
              Officer, Alice Davidson as General Counsel, and Perla Stoeckert as Chief Compliance Officer. The 2022 and
              2023 momentum releases are particularly useful because they document leadership promotions and C-suite
              expansion rather than only static bios. Even so, public governance disclosure is incomplete. The company
              page surfaces an audit committee chair, an investor, and an advisor, but the fetched pack does not provide
              a full current board roster, voting-rights summary, or ownership map. That means the chapter can support
              founder continuity and functional leadership coverage with confidence, but it cannot fully underwrite
              governance quality from public evidence alone. The implication for later diligence is straightforward:
              Tipalti appears operationally mature enough to have scaled executives across finance, product, compliance,
              and revenue, yet investors still need a board composition and control-rights request before treating
              governance as a solved question.
